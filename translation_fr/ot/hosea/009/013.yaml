  text: אֶפְרַ֛יִם כַּ/אֲשֶׁר רָאִ֥יתִי לְ/צ֖וֹר שְׁתוּלָ֣ה בְ/נָוֶ֑ה וְ/אֶפְרַ֕יִם לְ/הוֹצִ֥יא אֶל הֹרֵ֖ג בָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/013.yaml
  text: Ephraim[a], as I have seen, is planted in a pleasant pasture like Tyre[c][b]; but Ephraim must bring out his children to the killer.
translation:
  language: fr
  text: Éphraïm, tel que je l’ai vu, est planté comme Tyr dans un beau pâturage[a] ; mais Éphraïm devra conduire ses enfants[b] au tueur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Comme je l’ai vu, Éphraïm était planté comme Tyr dans un lieu agréable. » La construction de la comparaison est condensée en hébreu, et le mot traduit par « pâturage » peut aussi désigner un séjour ou un lieu agréable.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « ses fils » ; le terme peut ici désigner collectivement ses enfants ou sa descendance.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « à celui qui tue ». L’hébreu désigne littéralement une personne qui tue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Le nom propre du royaume et de la tribu du Nord est rendu selon sa forme française usuelle.
- source_word: כַּאֲשֶׁר רָאִיתִי
  choice: à ce que j’ai vu
  rationale: Cette formulation naturelle maintient explicitement l’observation à la première personne sans trancher outre mesure le lien syntaxique de la proposition.
- source_word: לְצוֹר
  choice: comme Tyr
  rationale: Le préfixe ל est compris ici dans un sens comparatif. La mention de Tyr est conservée conformément au texte massorétique, malgré la syntaxe difficile.
- source_word: שְׁתוּלָה
  choice: est planté
  rationale: Ce choix garde l’image horticole du participe passif et son contraste avec le sort funeste annoncé ensuite.
- source_word: בְנָוֶה
  choice: dans un beau pâturage
  rationale: נָוֶה peut désigner un pâturage, un séjour ou un lieu agréable. « Beau pâturage » conserve à la fois l’idée d’un cadre favorable et la cohérence de l’image végétale.
- source_word: וְאֶפְרַיִם
  choice: mais Éphraïm
  rationale: La conjonction introduit ici un contraste marqué entre l’établissement favorable et la mort prochaine des enfants.
- source_word: לְהוֹצִיא
  choice: devra conduire
  rationale: L’infinitif avec ל exprime une action destinée ou inéluctable. « Devra » en restitue la sombre nécessité, tandis que « conduire » rend naturellement l’idée de faire sortir vers quelqu’un.
- source_word: אֶל הֹרֵג
  choice: au meurtrier
  rationale: Le participe actif désigne littéralement celui qui tue. « Meurtrier » préserve cet agent personnel plutôt que de transformer l’expression en l’abstrait « au massacre ».
- source_word: בָּנָיו
  choice: ses enfants
  rationale: Bien que le mot signifie formellement « ses fils », il peut désigner collectivement la descendance ; « ses enfants » exprime naturellement ce sens probable.
theological_decisions:
- issue: Conserver l’image horticole ou la remplacer par une affirmation générale de prospérité
  choice: Conserver Éphraïm planté dans un beau pâturage
  alternative: Éphraïm prospérait comme Tyr
  rationale: Le contraste du verset repose sur l’image d’un établissement favorable suivi de la perte des enfants. Garder la métaphore évite d’en imposer une interprétation explicative.
- issue: Rendre בָּנָיו par « fils » ou par « enfants »
  choice: ses enfants
  alternative: ses fils
  rationale: Le terme peut viser les fils en particulier ou la descendance collectivement. Le contexte met surtout en avant la perte de la génération suivante ; une note préserve le sens formel.
- issue: Interprétation de la syntaxe comparative condensée
  choice: Éphraïm est comparé à Tyr et décrit comme planté dans un beau pâturage
  alternative: Comme je l’ai vu, Éphraïm était planté pour Tyr dans un beau lieu
  rationale: La lecture comparative fournit un sens cohérent, mais la note signale honnêtement que la construction hébraïque est condensée et susceptible d’une autre articulation.
translation_notes:
  register: Français international moderne, sobre et digne. Le présent « est planté » maintient la valeur descriptive du participe, tandis que « devra » exprime l’issue inéluctable. La répétition d’« Éphraïm » est conservée pour reproduire le retournement rhétorique du texte.
