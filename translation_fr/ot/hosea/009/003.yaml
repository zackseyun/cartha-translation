id: HOS.9.3
reference: Hosea 9:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹ֥א יֵשְׁב֖וּ בְּ/אֶ֣רֶץ יְהוָ֑ה וְ/שָׁ֤ב אֶפְרַ֨יִם֙ מִצְרַ֔יִם וּ/בְ/אַשּׁ֖וּר טָמֵ֥א יֹאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/003.yaml
  text: They will not remain in the land of Yahweh[a]; Ephraim will return to Egypt[c][b], and in Assyria they will eat unclean food.
translation:
  language: fr
  text: Ils ne resteront pas dans le pays de Yahvé[a] ; Éphraïm retournera en Égypte[b], et, en Assyrie, ils mangeront ce qui est impur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « n’habiteront pas dans le pays de Yahvé ».'
    reason: lexical_alternative
  - marker: b
    text: L’« Égypte » peut être comprise au sens littéral ou comme une image typologique d’un nouvel esclavage ou exil ; l’hébreu maintient cette tension tout en mentionnant aussi l’Assyrie.
    reason: alternative_reading
  - marker: c
    text: 'Ou : « mangeront de la nourriture impure ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשְׁבוּ
  choice: resteront
  rationale: Dans ce contexte de jugement et d’exil, le verbe désigne la continuité du séjour dans le pays. « Resteront » exprime naturellement qu’ils ne pourront plus y demeurer.
- source_word: בְּאֶרֶץ יְהוָה
  choice: dans le pays de Yahvé
  rationale: Cette formulation conserve l’idée que le pays appartient à Yahvé ainsi que sa portée d’alliance.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, qui distingue celui-ci d’un titre tel que « le Seigneur ».
- source_word: וְשָׁב
  choice: retournera
  rationale: Dans ce discours prophétique, la forme exprime ici un événement futur ; « retournera » rend directement le mouvement de retour.
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Le texte nomme explicitement Éphraïm, employé par métonymie pour le royaume du Nord ; le nom propre est donc conservé.
- source_word: מִצְרַיִם
  choice: Égypte
  rationale: Le nom de lieu est maintenu sans décider dans le corps du texte s’il est littéral, typologique ou rhétorique.
- source_word: וּבְאַשּׁוּר
  choice: et, en Assyrie
  rationale: Le simple waw est rendu par « et », sans imposer une opposition absente de la forme hébraïque ; « en Assyrie » conserve la valeur locative.
- source_word: טָמֵא יֹאכֵלוּ
  choice: ils mangeront ce qui est impur
  rationale: L’adjectif substantivé est rendu sans ajouter explicitement « nourriture ». La formule française garde la portée rituelle de l’impureté tout en restant naturelle.
theological_decisions:
- issue: Sens de la mention de l’Égypte
  choice: Conserver le nom « Égypte » et la juxtaposition avec l’Assyrie.
  alternative: Comprendre l’Égypte uniquement comme une image du retour à la servitude ou considérer l’Assyrie comme la seule destination littérale.
  rationale: L’hébreu mentionne expressément les deux lieux. La traduction préserve donc la tension entre un possible retour géographique en Égypte et sa résonance typologique de nouvelle servitude.
- issue: Portée cultuelle de טָמֵא
  choice: « ce qui est impur »
  alternative: « de la nourriture impure » ou « des aliments souillés »
  rationale: « Impur » conserve la catégorie rituelle et liée à l’alliance, sans la réduire à une question d’hygiène ni préciser davantage que l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur prophétique est conservé. La ponctuation met en relief le complément locatif « en Assyrie » sans transformer la coordination en opposition.
