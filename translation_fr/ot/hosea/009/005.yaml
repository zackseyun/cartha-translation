  text: מַֽה תַּעֲשׂ֖וּ לְ/י֣וֹם מוֹעֵ֑ד וּ/לְ/י֖וֹם חַג יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/005.yaml
  text: What will you do on the day of appointed assembly[a], and on the day of the feast of Yahweh?
translation:
  language: fr
  text: Que ferez-vous au jour solennel, au jour de la fête de Yahweh ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה
  choice: Que
  rationale: Le pronom interrogatif introduit une question rhétorique portant sur ce que le peuple pourra faire.
- source_word: תַּעֲשׂוּ
  choice: ferez-vous
  rationale: L’imparfait qal à la deuxième personne du pluriel vise ici une situation future; le futur français rend naturellement cette valeur.
- source_word: לְיוֹם
  choice: au jour de
  rationale: La préposition לְ a ici une valeur temporelle. « Au jour de » conserve le parallélisme et le registre solennel.
- source_word: מוֹעֵד
  choice: assemblée fixée
  rationale: Le terme peut désigner un moment fixé ou une réunion cultuelle. Dans ce parallèle avec חַג, « assemblée fixée » exprime la dimension sacrée sans confondre les deux termes.
- source_word: וּלְיוֹם
  choice: et au jour de
  rationale: La répétition française reflète la structure parallèle de l’hébreu.
- source_word: חַג
  choice: fête
  rationale: Le mot désigne une fête religieuse, souvent liée à un pèlerinage; « fête » est clair, naturel et distinct de « assemblée fixée ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé directement par le tétragramme.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte hébreu emploie le nom divin; sa translittération évite de le remplacer par un titre.
- issue: Rapport entre מוֹעֵד et חַג
  choice: Distinguer « assemblée fixée » de « fête »
  alternative: Employer « fête » ou « festival » pour les deux termes
  rationale: Les deux mots appartiennent au même domaine cultuel sans être identiques. Les distinguer préserve le parallélisme et l’ambiguïté propre à מוֹעֵד.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « au jour de » maintient la solennité et le parallélisme du verset sans devenir obscure.
