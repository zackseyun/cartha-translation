  terminology: « Éphraïm », « gloire » et « s’envolera comme un oiseau » sont appropriés. La note sur « gloire » conserve avec justesse l’ouverture de כָּבוֹד. La note de la triade doit correspondre au texte révisé et ne pas présenter « grossesse » comme le rendu littéral de בֶּטֶן.
