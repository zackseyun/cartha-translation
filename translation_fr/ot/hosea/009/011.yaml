  source_fidelity: La formulation « plus de grossesse » remplace « du sein/ventre » (מִבֶּטֶן) par une interprétation du référent. Bien que le contexte concerne la fécondité, le texte hébreu maintient l’image concrète du sein maternel. « Loin de » rend sobrement la valeur privative de la série des prépositions מן sans transformer les trois termes en une paraphrase explicative.
