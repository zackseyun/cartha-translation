source:
  edition: WLC
  text: אֶפְרַ֕יִם כָּ/ע֖וֹף יִתְעוֹפֵ֣ף כְּבוֹדָ֑/ם מִ/לֵּדָ֥ה וּ/מִ/בֶּ֖טֶן וּ/מֵ/הֵרָיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/011.yaml
  text: Ephraim—their glory will fly away like a bird—from birth[a], from the womb[b], and from conception.
translation:
  language: fr
  text: Éphraïm — leur gloire[a] s’envolera comme un oiseau — loin de l’enfantement, du sein maternel et de la conception[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur honneur » ou « leur splendeur ». Dans ce contexte, « leur gloire » désigne probablement surtout leur descendance et leur fécondité.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de l’enfantement, du sein maternel et de la conception (ou grossesse) ». Cette triple expression décrit la perte des enfants à tous les stades, en remontant de la naissance à la conception.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Nom propre rendu selon l’usage français courant; il désigne ici collectivement le royaume ou le peuple du Nord.
- source_word: כָּעוֹף
  choice: comme un oiseau
  rationale: La préposition כְּ marque la comparaison, et « oiseau » exprime naturellement ici le sens concret de עוֹף.
- source_word: יִתְעוֹפֵף
  choice: s’envolera
  rationale: Le verbe évoque quelque chose qui prend son vol et disparaît; « s’envolera » conserve à la fois le mouvement et l’idée de perte.
- source_word: כְּבוֹדָם
  choice: leur gloire
  rationale: Le terme peut signifier gloire, honneur ou splendeur. Le contexte suggère particulièrement la descendance et la fécondité, mais la traduction conserve la métaphore sans en imposer l’interprétation.
- source_word: מִלֵּדָה
  choice: plus d’enfantement
  rationale: Dans cette série, la préposition מִן exprime la privation liée au stade de l’accouchement ou de la naissance. La tournure française « plus de » rend clairement cette disparition.
- source_word: וּמִבֶּטֶן
  choice: plus de grossesse
  rationale: Littéralement « du sein » ou « du ventre »; dans ce contexte reproductif, le terme désigne par métonymie la gestation. « Grossesse » rend ce stade sans ambiguïté en français.
- source_word: וּמֵהֵרָיוֹן
  choice: plus de conception
  rationale: הֵרָיוֹן peut désigner la conception ou la grossesse. « Conception » maintient la progression rhétorique à rebours, de l’enfantement jusqu’à l’origine de la grossesse.
theological_decisions:
- issue: Référent de « leur gloire »
  choice: La métaphore demeure dans le texte, tandis que la note indique son lien probable avec la descendance et la fécondité d’Éphraïm.
  alternative: Préciser directement « leurs enfants » ou comprendre plus largement la richesse, l’honneur ou la puissance nationale.
  rationale: Le contexte immédiat associe fortement cette gloire aux enfants et à la fécondité, mais le verset ne définit pas explicitement la métaphore; il convient donc de préserver son amplitude.
- issue: Valeur des trois compléments introduits par מִן
  choice: Les rendre comme une privation touchant successivement l’enfantement, la grossesse et la conception.
  alternative: Les traduire littéralement par « de l’enfantement, du sein maternel et de la conception » ou comme une simple liste.
  rationale: La répétition décrit la disparition de la descendance à tous les stades, dans un mouvement rhétorique remontant de la naissance à la conception. La formulation « plus de » communique ce sens naturellement en français.
translation_notes:
  register: Français international moderne, sobre et digne. Le tiret détache l’annonce concernant Éphraïm; les répétitions de « plus de » rendent clairement la privation exprimée par l’hébreu tout en conservant la série ternaire et son ordre inversé.
