revisions:
- from: Éphraïm est frappé ; leur racine est desséchée ; ils ne porteront aucun fruit. Même s’ils ont des enfants, je ferai mourir les êtres chéris sortis de leur sein.[a]
  to: Éphraïm est frappé ; leur racine est desséchée ; ils ne porteront aucun fruit. Même s’ils mettent des enfants au monde, je ferai mourir les êtres chers de leur ventre.
  rationale: La révision conserve le suffixe pluriel de « leur racine », l’imagerie végétale de « fruit » et l’agent divin explicite. Elle rend plus exactement le verbe d’enfantement et le génitif « de leur ventre », sans ajouter l’idée que les enfants en sont déjà « sortis ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:52:10Z'
review_pass:
  verdict: revise
  source_fidelity: 'La progression de l’hébreu est bien conservée : Éphraïm frappé, racine desséchée, absence de fruit, puis intensification par l’enfantement et la mort des êtres précieux du ventre. Toutefois, « ont des enfants » affaiblit le verbe ילד, qui évoque ici l’enfantement, et « sortis de leur sein » ajoute une idée absente du texte : le génitif hébreu désigne les êtres précieux « de leur ventre/sein », non leur sortie du sein.'
  naturalness: Le français est globalement sobre et naturel. « Même s’ils mettent des enfants au monde » rend plus précisément l’enfantement tout en restant idiomatique avec le sujet collectif. « Les êtres chers de leur ventre » est plus proche de l’image hébraïque que la paraphrase proposée, quoique volontairement solennel, comme l’original.
  terminology: « Éphraïm », « racine », « fruit » et l’action divine explicite de « je ferai mourir » sont appropriés. « Êtres chers » rend sans surinterprétation מַחֲמַדֵּי, terme de valeur affective et précieuse ; « ventre » conserve l’image corporelle de בטן dans ce contexte d’enfantement.
  issues:
  - severity: medium
    issue: « Même s’ils ont des enfants » ne rend pas explicitement l’enfantement.
    rationale: יַלֵּדוּן se rapporte à la naissance ou à l’engendrement. La formulation actuelle peut seulement désigner le fait de posséder des enfants et atténue le lien rhétorique avec « leur ventre ».
  - severity: medium
    issue: « sortis de leur sein » ajoute un mouvement de sortie qui n’est pas exprimé dans l’hébreu.
    rationale: מַחֲמַדֵּי בִטְנָם signifie littéralement les êtres précieux/chers de leur ventre. Il convient de conserver le génitif imagé plutôt que de le transformer en participe décrivant la naissance.
  - severity: low
    issue: La note actuelle justifie une formulation qui s’écarte inutilement de l’image source.
    rationale: Une fois l’image « de leur ventre » rendue dans le texte, la note n’est plus nécessaire.
  revised_text: Éphraïm est frappé ; leur racine est desséchée ; ils ne porteront aucun fruit. Même s’ils mettent des enfants au monde, je ferai mourir les êtres chers de leur ventre.
