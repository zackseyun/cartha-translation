  text: הֻכָּ֣ה אֶפְרַ֔יִם שָׁרְשָׁ֥/ם יָבֵ֖שׁ פְּרִ֣י בלי יַעֲשׂ֑וּ/ן גַּ֚ם כִּ֣י יֵֽלֵד֔וּ/ן וְ/הֵמַתִּ֖י מַחֲמַדֵּ֥י בִטְנָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/016.yaml
  text: Ephraim is stricken[a]; their root is dried up; they will bear no fruit. Even if they give birth[b], I will put to death the cherished ones of their womb.
translation:
  language: fr
  text: Éphraïm est frappé ; leur racine est desséchée ; ils ne porteront aucun fruit. Même s’ils mettent des enfants au monde, je ferai mourir les êtres chers de leur ventre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֻכָּה
  choice: est frappé
  rationale: Le passif de נכה exprime ici le coup subi et l’état qui en résulte sous le jugement ; « est frappé » reste direct, grave et naturel en français moderne.
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Le nom propre est conservé ; dans le contexte, il désigne collectivement le royaume du Nord.
- source_word: שָׁרְשָׁם
  choice: leur racine
  rationale: Le suffixe hébreu est pluriel, bien qu’Éphraïm soit un nom collectif grammaticalement singulier. « Leur » préserve cette discordance signifiante et renvoie aux membres du peuple.
- source_word: יָבֵשׁ
  choice: est desséchée
  rationale: Cette formulation rend l’état résultant de la racine et convient précisément à l’image végétale.
- source_word: פְּרִי בלי יַעֲשׂוּן
  choice: ils ne porteront aucun fruit
  rationale: « Porter du fruit » est idiomatique et maintient l’image agricole avant son prolongement explicite dans celle de la maternité.
- source_word: גַּם כִּי
  choice: Même si
  rationale: 'La tournure introduit ici une concession et une intensification : une naissance éventuelle n’empêchera pas le jugement annoncé.'
- source_word: יֵלֵדוּן
  choice: ils ont des enfants
  rationale: Cette expression française naturelle inclut la mise au monde et s’accorde avec le sujet collectif Éphraïm sans imposer un sujet exclusivement féminin.
- source_word: וְהֵמַתִּי
  choice: je ferai mourir
  rationale: Le causatif à la première personne attribue explicitement l’action à Dieu. « Je ferai mourir » conserve cette agence et la valeur causative du hiphil.
- source_word: מַחֲמַדֵּי
  choice: les êtres chéris
  rationale: Le terme désigne ce qui est précieux, désirable ou aimé. Appliqué aux enfants, « êtres chéris » exprime leur valeur affective sans surinterprétation.
- source_word: בִטְנָם
  choice: sortis de leur sein
  rationale: Dans le contexte de l’enfantement, בטן désigne le ventre maternel. « Sein » appartient à un registre digne et l’ajout idiomatique « sortis de » explicite naturellement le lien avec les enfants engendrés.
theological_decisions:
- issue: L’action divine dans la clause de jugement
  choice: 'Conserver l’action divine à la première personne : « je ferai mourir »'
  alternative: Employer une conséquence impersonnelle telle que « ils mourront »
  rationale: L’hébreu emploie explicitement la première personne du singulier au hiphil et présente Dieu comme l’auteur du jugement ; la traduction ne doit pas atténuer cette affirmation.
- issue: Passage de la stérilité végétale à la perte des enfants
  choice: Préserver d’abord « fruit », puis rendre explicitement l’enfantement
  alternative: Traduire dès la première proposition par « descendance »
  rationale: Le texte construit une progression rhétorique de la racine et du fruit vers le sein et les enfants. La maintenir conserve la force et la tension des images.
translation_notes:
  register: Français international moderne, sobre et prophétique. La traduction conserve la sévérité du jugement, l’image agricole et le suffixe pluriel de « leur racine », tout en évitant les formulations archaïques.
