source:
  edition: WLC
  text: כִּֽי הִנֵּ֤ה הָֽלְכוּ֙ מִ/שֹּׁ֔ד מִצְרַ֥יִם תְּקַבְּצֵ֖/ם מֹ֣ף תְּקַבְּרֵ֑/ם מַחְמַ֣ד לְ/כַסְפָּ֗/ם קִמּוֹשׂ֙ יִֽירָשֵׁ֔/ם ח֖וֹחַ בְּ/אָהֳלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/006.yaml
  text: For behold[a], they have gone away from destruction; Egypt will gather them, Memphis will bury them. Nettles will possess the precious things of their silver; thorns will be in their tents.
translation:
  language: fr
  text: 'Car voici, ils ont fui la dévastation : l’Égypte les rassemblera, Memphis les ensevelira. Des orties[a] prendront possession de leurs précieux objets d’argent, et des épines pousseront dans leurs tentes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des plantes sauvages » ou « des chardons ». L’identification précise du terme hébreu est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשֹּׁד
  choice: loin de la dévastation
  rationale: שֹׁד désigne une ruine violente ou une dévastation. Après הָלְכוּ, la préposition מִן exprime ici le mouvement d’éloignement, sans laisser entendre que la fuite réussira.
- source_word: מִצְרַיִם
  choice: l’Égypte
  rationale: Forme française usuelle du nom de pays.
- source_word: תְּקַבְּצֵם
  choice: les rassemblera
  rationale: Le piel de קבץ signifie « rassembler » ou « recueillir ». Le choix conserve l’ironie du verbe, souvent positif ailleurs, alors qu’ici le rassemblement en Égypte conduit à la mort.
- source_word: מֹף
  choice: Memphis
  rationale: מֹף désigne la ville égyptienne connue en français sous le nom de Memphis.
- source_word: תְּקַבְּרֵם
  choice: les ensevelira
  rationale: קבר signifie « enterrer » ou « ensevelir ». « Ensevelira » convient au registre poétique et exprime clairement l’issue mortelle de l’exil.
- source_word: מַחְמַד לְכַסְפָּם
  choice: leurs précieux objets d’argent
  rationale: מַחְמַד désigne ce qui est désirable ou précieux, et לְכַסְפָּם renvoie vraisemblablement à leurs biens précieux en argent. La formulation reste proche de l’image hébraïque tout en étant intelligible en français.
- source_word: קִמּוֹשׂ
  choice: orties
  rationale: Le terme désigne une plante sauvage nuisible associée aux lieux abandonnés, mais son identification botanique exacte demeure incertaine. « Orties » suit une compréhension traditionnelle plausible, signalée par une note.
- source_word: יִירָשֵׁם
  choice: prendront possession de
  rationale: ירשׁ peut signifier « hériter », « posséder » ou « prendre possession de ». Cette formulation conserve l’ironie d’une végétation sauvage qui s’empare des biens abandonnés.
- source_word: חוֹחַ
  choice: épines
  rationale: חוֹחַ désigne génériquement une plante épineuse. « Épines » est clair et garde l’image de désolation.
- source_word: בְּאָהֳלֵיהֶם
  choice: dans leurs tentes
  rationale: אֹהֶל signifie littéralement « tente ». Le maintien de cette image respecte le parallélisme poétique et évoque les habitations abandonnées.
theological_decisions:
- issue: Interprétation de הָלְכוּ מִשֹּׁד
  choice: Ils sont partis loin de la dévastation.
  alternative: Ils sont partis à cause de la dévastation ; ils ont échappé à la dévastation.
  rationale: Le contexte annonce le jugement, l’exil et la mort en Égypte. La phrase décrit donc une fuite loin de la dévastation, non un salut réussi. « Loin de » garde la valeur spatiale de מִן sans effacer la portée causale possible.
translation_notes:
  register: Français international moderne, poétique et digne. « Car les voici » conserve l’effet d’annonce de כִּי הִנֵּה. L’ordre des deux propositions sur l’Égypte et Memphis maintient le parallélisme et la progression vers la mort.
