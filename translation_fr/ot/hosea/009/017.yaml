id: HOS.9.17
reference: Hosea 9:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יִמְאָסֵ֣/ם אֱלֹהַ֔/י כִּ֛י לֹ֥א שָׁמְע֖וּ ל֑/וֹ וְ/יִהְי֥וּ נֹדְדִ֖ים בַּ/גּוֹיִֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/017.yaml
  text: My God will reject them because they have not listened to him[a], and they will be wanderers among the nations.
translation:
  language: fr
  text: Mon Dieu les rejettera, parce qu’ils ne l’ont pas écouté[a] ; ils seront errants parmi les nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne lui ont pas obéi ». L’expression hébraïque parle littéralement de ne pas l’écouter, avec l’idée d’obéissance impliquée dans le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְאָסֵם
  choice: les rejettera
  rationale: Le verbe מאס exprime ici le rejet ou le refus. « Les rejettera » est naturel en français moderne et conserve la portée judiciaire et relationnelle du contexte sans accentuer indûment l’idée de mépris.
- source_word: אֱלֹהַי
  choice: Mon Dieu
  rationale: 'Le suffixe de première personne du singulier doit être conservé : il maintient la voix personnelle du prophète et la dimension relationnelle de l’expression.'
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit la cause du rejet divin ; « parce que » rend clairement ce rapport causal.
- source_word: לֹא שָׁמְעוּ לוֹ
  choice: ils ne l’ont pas écouté
  rationale: שׁמע construit avec ל peut signifier écouter quelqu’un et, par implication, lui obéir. Cette formulation préserve l’image auditive de l’hébreu sans effacer l’idée contextuelle de désobéissance.
- source_word: וְיִהְיוּ
  choice: ils seront
  rationale: Le verbe היה peut exprimer l’état ou l’entrée dans un état. Ici, « ils seront » est direct, naturel et suffisamment ouvert pour décrire la condition résultant du rejet.
- source_word: נֹדְדִים
  choice: errants
  rationale: Le participe de נדד évoque des personnes qui vont d’un lieu à l’autre, privées de stabilité. « Errants » convient au contexte de dispersion sans ajouter la notion plus précise de fuite.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: L’expression désigne les peuples étrangers au milieu desquels Israël sera dispersé. « Parmi les nations » est idiomatique et évite une formulation chargée par un usage néotestamentaire.
theological_decisions:
- issue: Expression prophétique « Mon Dieu »
  choice: Conserver « Mon Dieu » comme déclaration personnelle d’Osée.
  alternative: Employer simplement « Dieu » pour alléger la phrase.
  rationale: Le possessif figure explicitement dans l’hébreu. Le conserver respecte la voix prophétique et sa dimension d’alliance sans ajouter d’interprétation doctrinale.
- issue: 'Valeur de שׁמע : écouter ou obéir'
  choice: Employer « ne l’ont pas écouté » dans le texte principal.
  alternative: « ne lui ont pas obéi »
  rationale: Le contexte implique l’insoumission, mais l’hébreu formule celle-ci comme un refus d’écouter. Le texte principal préserve cette image et la note signale le sens implicite possible.
translation_notes:
  register: Français international moderne, sobre et digne. Le point-virgule marque nettement le passage de la cause du rejet à la conséquence de dispersion. « Errants » garde la concision poétique du participe hébreu.
