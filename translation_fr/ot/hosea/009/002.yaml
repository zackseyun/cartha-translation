id: HOS.9.2
reference: Hosea 9:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גֹּ֥רֶן וָ/יֶ֖קֶב לֹ֣א יִרְעֵ֑/ם וְ/תִיר֖וֹשׁ יְכַ֥חֶשׁ בָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/002.yaml
  text: Threshing floor and winepress will not feed them[a], and new wine will fail her.
translation:
  language: fr
  text: L’aire de battage et le pressoir ne les nourriront pas, et le vin nouveau la décevra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la trompera », « lui fera défaut » ou « se révélera trompeur envers elle ». Le verbe hébreu peut évoquer ce qui ne tient pas ses promesses ou ne produit pas l’effet attendu.
    reason: 'Alternative lexicale : le verbe יְכַחֶשׁ peut signifier tromper, se révéler faux, décevoir ou faire défaut.'
lexical_decisions:
- source_word: גֹּרֶן
  choice: aire de battage
  rationale: Le nom désigne concrètement l’endroit où l’on bat le grain et peut, par métonymie, représenter la récolte céréalière. L’image agricole est conservée.
- source_word: יֶקֶב
  choice: pressoir
  rationale: Le terme désigne l’installation où les raisins sont pressés. « Pressoir » forme en français un parallèle naturel avec « aire de battage ».
- source_word: יִרְעֵם
  choice: ne les nourriront pas
  rationale: Le verbe רעה signifie « faire paître, nourrir ». Avec l’aire et le pressoir pour sujets, « nourrir » exprime naturellement le fait qu’ils ne fourniront pas la subsistance attendue.
- source_word: תִירוֹשׁ
  choice: vin nouveau
  rationale: Le mot désigne couramment le vin nouveau, produit de la récolte. Cette expression maintient l’imagerie agricole et la nuance d’une production attendue.
- source_word: יְכַחֶשׁ
  choice: la décevra
  rationale: Le verbe peut exprimer l’idée de tromper, de se révéler faux ou de ne pas répondre à l’attente. « La décevra » est naturel avec le vin nouveau comme sujet et conserve l’idée d’une attente frustrée sans réduire entièrement l’ambiguïté lexicale.
- source_word: בָּהּ
  choice: la
  rationale: Le suffixe est au féminin singulier. « La » préserve explicitement la personnification féminine d’Israël ou d’Éphraïm au lieu de l’aplanir en un pluriel.
theological_decisions:
- issue: Référent du suffixe féminin singulier בָּהּ
  choice: Le pronom « la » renvoie à Israël ou Éphraïm, personnifié au féminin singulier.
  alternative: Le suffixe pourrait être rendu collectivement par « leur », ou être compris comme renvoyant au pays.
  rationale: Dans le contexte prophétique, la personnification féminine de la nation est naturelle. La conserver respecte la grammaire et l’image littéraire sans imposer une conclusion doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. Les deux réalités agricoles concrètes sont maintenues comme sujets personnifiés de « nourrir », et le pronom féminin singulier est conservé explicitement.
