  text: צֹפֶ֥ה אֶפְרַ֖יִם עִם אֱלֹהָ֑/י נָבִ֞יא פַּ֤ח יָקוֹשׁ֙ עַל כָּל דְּרָכָ֔י/ו מַשְׂטֵמָ֖ה בְּ/בֵ֥ית אֱלֹהָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/008.yaml
  text: Ephraim’s watchman is with my God[a]; the prophet is a fowler’s snare on all his ways[b], and hostility is in the house of his God.
translation:
  language: fr
  text: La sentinelle d’Éphraïm est avec mon Dieu[a] ; le prophète est un piège d’oiseleur sur tous ses chemins, et l’hostilité[b] se trouve dans la maison de son Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Éphraïm est une sentinelle auprès de mon Dieu ; le prophète est un piège d’oiseleur sur tous ses chemins. » La syntaxe hébraïque est difficile ; certains comprennent la première proposition de manière plus positive avant que le verset ne passe à l’accusation.'
    reason: alternative_reading
  - marker: b
    text: Ou « la haine », « l’inimitié ».
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹפֶה
  choice: sentinelle
  rationale: Le participe désigne quelqu’un qui veille ou fait le guet. « Sentinelle » conserve l’image biblique d’une personne chargée de surveiller et convient au possible rôle prophétique.
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Translittération française usuelle du nom de la tribu et du royaume du Nord.
- source_word: עִם אֱלֹהָי
  choice: avec mon Dieu
  rationale: עִם signifie normalement « avec », et le suffixe de première personne dans אֱלֹהָי est conservé. Cette formulation maintient l’étonnant contraste avec « son Dieu » à la fin du verset.
- source_word: נָבִיא
  choice: le prophète
  rationale: Le singulier est rendu avec l’article défini comme désignation représentative du prophète lié à Éphraïm dans cette accusation.
- source_word: פַּח יָקוֹשׁ
  choice: un piège d’oiseleur
  rationale: Cette expression française naturelle conserve l’image du dispositif posé par un preneur d’oiseaux pour capturer sa proie.
- source_word: עַל כָּל דְּרָכָיו
  choice: sur tous ses chemins
  rationale: 'La préposition et l’image spatiale sont conservées : le piège se trouve sur les chemins qu’il emprunte. Le suffixe masculin singulier reste volontairement ambigu quant à son référent.'
- source_word: מַשְׂטֵמָה
  choice: hostilité
  rationale: Le nom exprime la haine, l’inimitié ou une opposition active. « Hostilité » en garde l’étendue sans la réduire au seul sentiment de haine.
- source_word: בְּבֵית אֱלֹהָיו
  choice: dans la maison de son Dieu
  rationale: « Maison » traduit directement בֵּית sans préciser qu’il s’agit nécessairement d’un temple, et « son Dieu » conserve le suffixe masculin singulier du texte massorétique.
theological_decisions:
- issue: Rapport syntaxique entre « sentinelle », « Éphraïm », « avec mon Dieu » et « prophète »
  choice: Lire d’abord « La sentinelle d’Éphraïm est avec mon Dieu », puis faire de « le prophète » le sujet de l’accusation suivante.
  alternative: Lire « Le prophète est la sentinelle d’Éphraïm auprès de mon Dieu », avant le retournement introduit par l’image du piège.
  rationale: La syntaxe hébraïque est exceptionnellement compacte et permet plusieurs regroupements. Le texte principal suit une lecture possible à dominante accusatrice, tandis que la note préserve une autre analyse réelle sans trancher artificiellement.
- issue: Contraste entre « mon Dieu » et « son Dieu »
  choice: Conserver les deux pronoms possessifs distincts.
  alternative: Uniformiser en « Dieu » ou interpréter les deux expressions depuis un même point de vue.
  rationale: Le texte massorétique passe effectivement de la première personne à la troisième. Garder cette tension évite une harmonisation interprétative et peut laisser entendre une distance entre le locuteur et l’institution religieuse visée.
- issue: Valeur du prophète dans le contexte
  choice: Présenter le prophète comme une figure devenue un piège.
  alternative: Comprendre la première proposition comme une affirmation positive concernant le vrai prophète, suivie d’une accusation visant d’autres personnes.
  rationale: Le contexte immédiat est accusateur, mais la syntaxe laisse subsister une lecture plus positive de la première proposition ; celle-ci est donc signalée en note.
translation_notes:
  register: Français international actuel, sobre et digne. « Sentinelle » et « piège d’oiseleur » maintiennent les images concrètes du texte. « Se trouve » explicite discrètement la proposition nominale finale afin d’obtenir une phrase française naturelle, sans ajouter l’idée plus forte que l’hostilité « règne ».
