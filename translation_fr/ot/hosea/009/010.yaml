  text: כַּ/עֲנָבִ֣ים בַּ/מִּדְבָּ֗ר מָצָ֨אתִי֙ יִשְׂרָאֵ֔ל כְּ/בִכּוּרָ֤ה בִ/תְאֵנָה֙ בְּ/רֵ֣אשִׁיתָ֔/הּ רָאִ֖יתִי אֲבֽוֹתֵי/כֶ֑ם הֵ֜מָּה בָּ֣אוּ בַֽעַל פְּע֗וֹר וַ/יִּנָּֽזְרוּ֙ לַ/בֹּ֔שֶׁת וַ/יִּהְי֥וּ שִׁקּוּצִ֖ים כְּ/אָהֳבָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/010.yaml
  text: Like grapes in the wilderness I found Israel[a]; like the first-ripe fruit on the fig tree in its first season I saw your fathers. They came to Baal-peor and consecrated themselves to shame[d][c][b], and they became detestable like the thing they loved.
translation:
  language: fr
  text: Comme des raisins dans le désert, j’ai trouvé Israël ; comme une figue précoce sur un figuier, au début de sa saison[a], j’ai vu vos pères[b]. Eux, ils sont allés à Baal-Péor[c] et se sont consacrés à la honte[d] ; ils sont devenus abominables comme ce qu’ils aimaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « à son commencement » ; il s’agit vraisemblablement du début de la saison, lorsque paraît la première figue, particulièrement recherchée.
    reason: lexical_alternative
  - marker: b
    text: Ou « vos ancêtres ». L’hébreu dit « vos pères ».
    reason: lexical_alternative
  - marker: c
    text: Voir Nombres 25.1-5, où Israël s’attache au Baal de Péor.
    reason: cross_reference
  - marker: d
    text: Ici, « la honte » désigne probablement de manière méprisante l’idole liée à Baal-Péor.
    reason: alternative_reading
lexical_decisions:
- source_word: כַּעֲנָבִים בַּמִּדְבָּר
  choice: Comme des raisins dans le désert
  rationale: La préposition כְּ introduit une comparaison. « Désert » rend naturellement מִדְבָּר et souligne le caractère inattendu et précieux de raisins trouvés dans un lieu aride.
- source_word: מָצָאתִי יִשְׂרָאֵל
  choice: j’ai trouvé Israël
  rationale: Le qal parfait de מצא signifie simplement « trouver » ; la formulation conserve l’image vive du texte.
- source_word: כְּבִכּוּרָה בִתְאֵנָה
  choice: comme une figue précoce sur un figuier
  rationale: בִּכּוּרָה désigne un premier fruit mûr, particulièrement recherché. « Figue précoce » est idiomatique en français et communique à la fois la précocité et la valeur du fruit.
- source_word: בְּרֵאשִׁיתָהּ
  choice: au début de sa saison
  rationale: Littéralement « à son commencement ». Dans l’image agricole, la traduction explicite naturellement le début de la période de fructification sans masquer le sens littéral, signalé en note.
- source_word: רָאִיתִי אֲבוֹתֵיכֶם
  choice: j’ai vu vos pères
  rationale: « J’ai vu » maintient le parallélisme avec « j’ai trouvé ». « Vos pères » conserve la forme masculine du texte hébreu et son renvoi aux générations ancestrales.
- source_word: הֵמָּה בָּאוּ בַעַל פְּעוֹר
  choice: Eux sont allés à Baal-Péor
  rationale: Le pronom indépendant הֵמָּה met le sujet en relief. « Eux » reproduit cette insistance sans introduire un « mais » absent de l’hébreu ; « sont allés à » exprime naturellement ici le mouvement marqué par בוא.
- source_word: וַיִּנָּזְרוּ לַבֹּשֶׁת
  choice: et se sont consacrés à la honte
  rationale: Le niphal de נזר évoque le fait de se vouer ou de se consacrer. La formulation garde l’ironie cultuelle et la polysémie de בֹּשֶׁת, qui signifie « honte » tout en visant probablement l’idole.
- source_word: וַיִּהְיוּ שִׁקּוּצִים
  choice: ils sont devenus détestables
  rationale: שִׁקּוּצִים désigne ce qui est abominable ou répugnant, notamment dans un contexte idolâtre. L’adjectif « détestables » convient naturellement à des personnes tout en conservant la forte réprobation du terme.
- source_word: כְּאָהֳבָם
  choice: comme ce qu’ils aimaient
  rationale: La formule hébraïque est concise et ambiguë. Cette traduction conserve la comparaison et laisse l’objet de leur amour implicite, sans ajouter explicitement « idole » dans le texte principal.
theological_decisions:
- issue: Valeur de לַבֹּשֶׁת dans le contexte idolâtre
  choice: « à la honte », avec une note indiquant l’allusion probable à l’idole
  alternative: « à l’idole honteuse » ou « à la Honte » comme nom polémique de Baal
  rationale: Le texte emploie le nom commun « honte » dans une formule polémique, probablement comme désignation méprisante de l’idole. Le conserver évite de rendre explicite dans le corps du texte une identification qui reste implicite en hébreu.
- issue: Traduction de אֲבוֹתֵיכֶם
  choice: « vos pères »
  alternative: « vos ancêtres »
  rationale: La traduction principale respecte la forme masculine plurielle de l’hébreu ; la note donne l’équivalent fonctionnel plus général.
- issue: Rapport logique introduisant הֵמָּה
  choice: Insistance par « Eux », sans connecteur adversatif
  alternative: « Mais eux » ou simplement « Ils »
  rationale: Le contraste avec l’appréciation initiale est réel dans le contexte, mais aucun « mais » explicite ne figure dans l’hébreu. Le pronom détaché exprime l’emphase sans résoudre excessivement le rapport logique.
translation_notes:
  register: Français international moderne, digne et accessible. Les deux comparaisons agricoles gardent leur vivacité, tandis que « Eux » restitue l’emphase hébraïque sans ajouter un contraste explicite. Les termes polémiques « honte » et « détestables » restent forts sans surinterpréter l’identité précise de l’idole.
