source:
  edition: WLC
  text: לֹא יִסְּכ֨וּ לַ/יהוָ֥ה יַיִן֮ וְ/לֹ֣א יֶֽעֶרְבוּ ל/וֹ֒ זִבְחֵי/הֶ֗ם כְּ/לֶ֤חֶם אוֹנִים֙ לָ/הֶ֔ם כָּל אֹכְלָ֖י/ו יִטַמָּ֑אוּ כִּֽי לַחְמָ֣/ם לְ/נַפְשָׁ֔/ם לֹ֥א יָב֖וֹא בֵּ֥ית יְהוָֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/004.yaml
  text: They will not pour out wine offerings to Yahweh[a], and their sacrifices will not please him. They will be like mourners’ bread to them; all who eat it will become unclean. For their bread will be for themselves alone[b]; it will not enter the house of Yahweh.
translation:
  language: fr
  text: 'Ils ne verseront pas de vin en offrande à Yahweh, et leurs sacrifices ne lui seront pas agréables. Ils seront pour eux comme du pain de deuil[a] : tous ceux qui en mangeront deviendront impurs. Car leur pain ne servira qu’à les nourrir[b] ; il n’entrera pas dans la maison de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « du pain de ceux qui sont dans le deuil ». Il s’agit probablement de nourriture associée au deuil et, par conséquent, à l’impureté rituelle liée à la mort.
    reason: lexical_alternative
  - marker: b
    text: Ou « sera pour leur appétit » ou « sera pour eux-mêmes ». L’expression hébraïque indique que ce pain ne servira qu’à leur propre consommation et ne pourra pas être apporté dans la maison de Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסְּכוּ ... יַיִן
  choice: verseront ... du vin en offrande
  rationale: Le verbe נסך, avec « vin » comme complément dans un contexte cultuel, désigne une libation. Cette formulation française explicite naturellement la fonction sacrificielle du vin.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל indique ici le destinataire de l’offrande, et le nom divin יהוה est conservé sous la forme « Yahweh ».
- source_word: יֶעֶרְבוּ לוֹ
  choice: ne lui seront pas agréables
  rationale: Le verbe ערב exprime ici l’idée d’être agréable ou acceptable à Dieu. La tournure retenue convient au registre cultuel sans réduire le sens au plaisir émotionnel.
- source_word: זִבְחֵיהֶם
  choice: leurs sacrifices
  rationale: זבח désigne des sacrifices ou offrandes animales; « sacrifices » est clair, précis et naturel en français.
- source_word: כְּלֶחֶם אוֹנִים
  choice: comme du pain de deuil
  rationale: L’expression désigne vraisemblablement du pain associé au deuil et à l’impureté liée à la mort. « Pain de deuil » préserve l’image et reste compréhensible.
- source_word: יִטַמָּאוּ
  choice: deviendront impurs
  rationale: טמא relève ici de l’impureté rituelle dans un contexte de sacrifices et d’accès au sanctuaire; « impurs » conserve cette dimension cultuelle.
- source_word: לַחְמָם לְנַפְשָׁם
  choice: leur pain ne servira qu’à les nourrir
  rationale: נפש peut désigner la personne, la vie ou l’appétit. Dans ce contexte, le pain est destiné à leur propre consommation plutôt qu’au culte. La traduction garde cette idée tout en signalant l’ambiguïté en note.
- source_word: לֹא יָבוֹא בֵּית יְהוָה
  choice: il n’entrera pas dans la maison de Yahweh
  rationale: Le singulier renvoie au pain, qui ne peut être admis dans le sanctuaire. « Maison de Yahweh » conserve l’expression hébraïque et son sens cultuel.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le nom propre de l’alliance. La translittération « Yahweh » le distingue d’un titre et suit la convention fournie.
- issue: Nature de l’impureté du « pain de deuil »
  choice: impureté rituelle associée au deuil et à la mort
  alternative: tristesse générale; souillure morale
  rationale: Le vocabulaire de l’impureté, des sacrifices et de l’accès à la maison de Yahweh indique une question cultuelle plutôt qu’une simple émotion ou une faute morale.
- issue: Rapport syntaxique de זִבְחֵיהֶם כְּלֶחֶם אוֹנִים לָהֶם
  choice: leurs sacrifices seront pour eux comme du pain de deuil
  alternative: leurs sacrifices ne lui seront pas agréables, comme du pain de deuil pour eux
  rationale: La ponctuation et la syntaxe permettent une certaine hésitation. La traduction rattache naturellement la comparaison aux sacrifices, tout en conservant l’enchaînement du texte et sans expliquer davantage que l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire cultuel est conservé (« offrande », « sacrifices », « impurs », « maison de Yahweh »), tandis que les expressions hébraïques difficiles sont rendues naturellement et accompagnées de notes. Tous les marqueurs de notes figurent dans le texte.
