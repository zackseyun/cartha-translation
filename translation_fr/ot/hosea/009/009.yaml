source:
  edition: WLC
  text: הֶעְמִֽיקוּ שִׁחֵ֖תוּ כִּ/ימֵ֣י הַ/גִּבְעָ֑ה יִזְכּ֣וֹר עֲוֺנָ֔/ם יִפְק֖וֹד חַטֹּאותָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/009.yaml
  text: They have gone deep into corruption[a], as in the days of Gibeah; he will remember their iniquity[b]; he will punish their sins.
translation:
  language: fr
  text: Ils se sont enfoncés dans la corruption[a], comme aux jours de Guibéa[b] ; il se souviendra de leur faute ; il leur demandera des comptes pour leurs péchés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement, la formulation hébraïque, très concise, associe « aller en profondeur » et « corrompre » ; on pourrait aussi comprendre : « Ils ont profondément agi de manière corrompue. »'
    reason: lexical_alternative
  - marker: b
    text: Guibéa renvoie au crime notoire commis dans cette ville et aux événements racontés en Juges 19–21 ; le prophète compare ici la corruption d’Israël à celle de cette époque.
    reason: cross_reference
lexical_decisions:
- source_word: הֶעְמִיקוּ שִׁחֵתוּ
  choice: se sont enfoncés dans la corruption
  rationale: Cette formulation française conserve l’image de la profondeur portée par הֶעְמִיקוּ tout en exprimant la corruption indiquée par שִׁחֵתוּ. Elle rend naturellement la tournure hébraïque, concise et idiomatique, sans réduire les deux verbes à un simple adverbe d’intensité.
- source_word: כִּימֵי הַגִּבְעָה
  choice: comme aux jours de Guibéa
  rationale: Le préfixe כְּ marque la comparaison, et « aux jours de » garde la référence historique à l’épisode de Guibéa.
- source_word: יִזְכּוֹר עֲוֺנָם
  choice: il se souviendra de leur faute
  rationale: Le futur rend les verbes hébreux à l’inaccompli dans cette annonce de jugement. « Faute » exprime ici עָוֹן comme conduite coupable, puisque la sanction est évoquée séparément.
- source_word: יִפְקֹד חַטֹּאותָם
  choice: il leur demandera compte de leurs péchés
  rationale: Dans un contexte de jugement, פקד signifie demander des comptes, intervenir contre ou punir. Cette expression française restitue clairement l’idée judiciaire sans l’étrangeté de « punir leurs péchés ».
theological_decisions:
- issue: Sujet implicite des verbes de jugement
  choice: Conserver le pronom « il », dont le référent contextuel est Dieu, sans ajouter son nom.
  alternative: Expliciter « Dieu se souviendra… » ou laisser le sujet indéterminé.
  rationale: L’hébreu emploie deux verbes à la troisième personne du masculin singulier sans sujet exprimé. Le contexte désigne Dieu, mais conserver « il » respecte la forme du texte et n’explicite pas davantage que l’original.
translation_notes:
  register: Français international moderne, naturel et digne. « Se sont enfoncés dans la corruption » préserve la métaphore hébraïque sans raideur excessive ; « demander compte » maintient le registre judiciaire et prophétique.
