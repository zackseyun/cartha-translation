  text: וְ/עָרְכ֗וּ בְּנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים אֵ֚ת הַ/נְּתָחִ֔ים אֶת הָ/רֹ֖אשׁ וְ/אֶת הַ/פָּ֑דֶר עַל הָ/עֵצִים֙ אֲשֶׁ֣ר עַל הָ/אֵ֔שׁ אֲשֶׁ֖ר עַל הַ/מִּזְבֵּֽחַ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/008.yaml
  text: And Aaron’s sons[a], the priests, shall arrange the pieces, the head, and the fat on the wood that is on the fire that is on the altar.
translation:
  language: fr
  text: Et les fils d’Aaron, les prêtres, disposeront les morceaux, la tête et la graisse[a] sur le bois qui est sur le feu, et ce feu est sur l’autel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le suif » ou « l’enveloppe graisseuse » ; le terme hébreu désigne une partie graisseuse de l’animal utilisée dans l’offrande.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָרְכוּ
  choice: Puis … disposeront
  rationale: Le verbe ערך désigne ici l’action de disposer méthodiquement les éléments du sacrifice. « Puis » rend naturellement la progression marquée par la conjonction וְ dans cette suite d’instructions.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: les fils d’Aaron, les prêtres
  rationale: « Les prêtres » est en apposition à « les fils d’Aaron »; les virgules rendent clairement cette identification sans modifier le sens.
- source_word: הַנְּתָחִים
  choice: les morceaux
  rationale: Le terme désigne les morceaux de l’animal découpé à l’étape précédente. « Morceaux » est concret, naturel et n’ajoute aucune précision absente de l’hébreu.
- source_word: הָרֹאשׁ
  choice: la tête
  rationale: Traduction anatomique directe du terme hébreu.
- source_word: הַפָּדֶר
  choice: la graisse
  rationale: Le terme désigne une partie graisseuse de l’animal, peut-être le suif ou l’enveloppe graisseuse. « La graisse » est la formulation moderne la plus accessible; l’incertitude anatomique est signalée en note.
- source_word: עַל הָעֵצִים
  choice: sur le bois
  rationale: עֵצִים a ici un sens collectif et désigne le bois servant de combustible.
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: qui se trouve sur le feu, lequel est sur l’autel
  rationale: 'Cette formulation conserve les deux propositions relatives successives et leur description spatiale: le bois est sur le feu, et le feu est sur l’autel. « Lequel » évite que la seconde relative soit comprise comme se rapportant au bois.'
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde la précision procédurale et la succession des indications spatiales de l’hébreu, tout en levant une ambiguïté grammaticale que produirait en français la répétition littérale de « qui est sur ».
