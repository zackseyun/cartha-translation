  text: וְ֠/נָתְנוּ בְּנֵ֨י אַהֲרֹ֧ן הַ/כֹּהֵ֛ן אֵ֖שׁ עַל הַ/מִּזְבֵּ֑חַ וְ/עָרְכ֥וּ עֵצִ֖ים עַל הָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/007.yaml
  text: And the sons of Aaron the priest shall put fire on the altar and arrange wood on the fire[a].
translation:
  language: fr
  text: Les fils du prêtre Aaron mettront du feu sur l’autel et disposeront du bois sur le feu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: mettront
  rationale: Le verbe נתן signifie couramment « donner, mettre, placer ». Ici, « mettront » exprime naturellement l’action prescrite et le futur français convient à la portée procédurale du passage.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֵן
  choice: les fils du prêtre Aaron
  rationale: La construction hébraïque désigne les fils d’Aaron et l’apposition singulière הַכֹּהֵן qualifie Aaron. Cette formulation française est naturelle, digne et maintient clairement cette relation syntaxique.
- source_word: אֵשׁ
  choice: du feu
  rationale: Le terme désigne ici le feu au sens concret. L’article partitif est idiomatique en français avec « mettre ».
- source_word: עַל הַמִּזְבֵּחַ
  choice: sur l’autel
  rationale: Traduction directe et usuelle de la préposition et du nom dans le contexte sacrificiel.
- source_word: וְעָרְכוּ
  choice: et disposeront
  rationale: Dans les prescriptions rituelles, ערך évoque une mise en ordre. « Disposer » préserve cette nuance tout en restant naturel en français.
- source_word: עֵצִים
  choice: du bois
  rationale: Bien que le nom hébreu soit au pluriel, le collectif « du bois » est l’expression française normale ici; « des morceaux de bois » serait plus explicite que la source.
- source_word: עַל הָאֵשׁ
  choice: sur le feu
  rationale: La répétition du feu et de la préposition est conservée afin de rendre la succession précise des gestes en hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le verset garde le caractère prescriptif de la législation sacrificielle sans archaïsme. Aucun appel de note n’est nécessaire, car « les fils du prêtre Aaron » rend sans ambiguïté excessive l’apposition hébraïque singulière.
