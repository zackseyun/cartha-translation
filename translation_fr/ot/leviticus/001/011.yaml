  text: וְ/שָׁחַ֨ט אֹת֜/וֹ עַ֣ל יֶ֧רֶךְ הַ/מִּזְבֵּ֛חַ צָפֹ֖נָ/ה לִ/פְנֵ֣י יְהוָ֑ה וְ/זָרְק֡וּ בְּנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֲנִ֧ים אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/011.yaml
  text: And he shall slaughter it on the north side of the altar before Yahweh[a], and Aaron’s sons, the priests, shall throw its blood against the altar all around.
translation:
  language: fr
  text: Il l’égorgera du côté nord de l’autel, devant Yahweh ; puis les fils d’Aaron, les prêtres, projeteront son sang contre l’autel, tout autour.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jetteront son sang contre l’autel, tout autour ». Le verbe hébreu désigne une projection énergique du sang, plutôt qu’une légère aspersion.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט אֹתוֹ
  choice: Il l’égorgera
  rationale: שׁחט est le verbe propre à l’abattage rituel d’un animal. « Égorg­er » exprime naturellement en français l’action sacrificielle, tandis que le futur garde la valeur prescriptive du texte.
- source_word: עַל יֶרֶךְ הַמִּזְבֵּחַ צָפֹנָה
  choice: du côté nord de l’autel
  rationale: יֶרֶךְ désigne ici le côté ou flanc de l’autel, et צָפֹנָה en précise l’emplacement au nord.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: L’expression cultuelle signifie « en présence de Yahweh »; « devant » reste précis, digne et concis.
- source_word: וְזָרְקוּ
  choice: jetteront
  rationale: זרק évoque une projection du sang, plus énergique qu’une simple aspersion. Le complément « contre l’autel » clarifie le geste rituel.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: les fils d’Aaron, les prêtres
  rationale: La formulation conserve l’apposition hébraïque, qui indique à la fois la filiation et la fonction.
- source_word: אֶת דָּמוֹ
  choice: son sang
  rationale: Le suffixe renvoie à l’animal sacrifié. En français, « son sang » est la tournure naturelle et n’introduit aucune ambiguïté réelle dans ce contexte.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: contre l’autel, tout autour
  rationale: Avec זרק, עַל indique ici la surface contre laquelle le sang est projeté; סָבִיב précise que l’action concerne le pourtour de l’autel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom personnel divin plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. Le futur simple rend la prescription rituelle; « puis » marque naturellement la succession des gestes sans ajouter de contenu théologique.
