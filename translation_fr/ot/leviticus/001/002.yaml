source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם אָדָ֗ם כִּֽי יַקְרִ֥יב מִ/כֶּ֛ם קָרְבָּ֖ן לַֽ/יהוָ֑ה מִן הַ/בְּהֵמָ֗ה מִן הַ/בָּקָר֙ וּ/מִן הַ/צֹּ֔אן תַּקְרִ֖יבוּ אֶת קָרְבַּנְ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man from among you brings an offering to Yahweh[b][a], you shall bring your offering from the livestock—from the herd or from the flock.'
translation:
  language: fr
  text: '« Parle aux fils d’Israël[a] et dis-leur : Quand l’un de vous[b] présente une offrande à Yahweh, vous présenterez votre offrande, prise parmi le bétail, qu’il s’agisse de gros ou de petit bétail[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « aux Israélites » ou « au peuple d’Israël ». Littéralement : « aux fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « quand un homme parmi vous ». Le mot hébreu désigne ici un membre quelconque de la communauté.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « parmi le bétail, parmi le gros bétail et parmi le petit bétail ». Le petit bétail comprend notamment les moutons et les chèvres.'
    reason: clarification
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Conserve la formule d’adresse hébraïque et son caractère solennel; une note donne les équivalents français plus idiomatiques.
- source_word: אָדָם כִּי יַקְרִיב מִכֶּם
  choice: quand l’un de vous présente
  rationale: אָדָם introduit ici un cas individuel représentatif, tandis que מִכֶּם a une valeur partitive. « L’un de vous » restitue naturellement l’ensemble sans limiter indûment le cas aux hommes.
- source_word: קָרְבָּן
  choice: offrande
  rationale: Terme général approprié à cette introduction aux prescriptions sacrificielles; « sacrifice » serait ici plus étroit.
- source_word: יקריב
  choice: présente / présenterez
  rationale: Le hiphil de קרב désigne l’action d’apporter ou de présenter à Dieu. « Présenter » garde la nuance cultuelle et permet de conserver la répétition du verbe hébreu.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Transcrit le nom divin יהוה plutôt que de le remplacer par un titre.
- source_word: הַבְּהֵמָה
  choice: le bétail
  rationale: Désigne collectivement les animaux domestiques dont proviennent ici les offrandes.
- source_word: הַבָּקָר
  choice: un bovin
  rationale: Désigne le gros bétail, c’est-à-dire les bovins, par opposition au petit bétail.
- source_word: הַצֹּאן
  choice: un mouton ou une chèvre
  rationale: Explicite la portée collective de צֹאן, qui comprend normalement ovins et caprins; « troupeau » serait moins précis en français dans cette phrase.
- source_word: תַּקְרִיבוּ אֶת קָרְבַּנְכֶם
  choice: vous présenterez votre offrande
  rationale: Le pluriel hébreu adresse la prescription à l’ensemble de la communauté après le cas individuel; le futur normatif est naturel en français juridique.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme; la translittération préserve le nom propre de l’alliance.
- issue: Portée représentative de אָדָם
  choice: l’un de vous
  alternative: un homme parmi vous
  rationale: Dans cette formulation de cas, אָדָם désigne un membre quelconque de la communauté. Le choix français conserve cette portée sans transformer le terme en désignation explicitement masculine; l’alternative littérale est signalée en note.
- issue: Formule בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / le peuple d’Israël
  rationale: Le texte principal garde l’idiome hébreu traditionnel, tandis que la note indique sa valeur collective.
- issue: Alternance du singulier et du pluriel
  choice: « l’un de vous présente » puis « vous présenterez »
  alternative: uniformiser au singulier
  rationale: Préserve le passage du cas individuel au commandement adressé à la communauté, tension grammaticale réelle du texte hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La formule d’adresse demeure formelle; le corps de la prescription emploie un français juridique naturel. La répétition de « présente / présenterez » et l’alternance singulier-pluriel reflètent la structure hébraïque.
