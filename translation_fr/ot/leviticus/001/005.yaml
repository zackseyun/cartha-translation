source:
  edition: WLC
  text: וְ/שָׁחַ֛ט אֶת בֶּ֥ן הַ/בָּקָ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ֠/הִקְרִיבוּ בְּנֵ֨י אַהֲרֹ֤ן הַֽ/כֹּֽהֲנִים֙ אֶת הַ/דָּ֔ם וְ/זָרְק֨וּ אֶת הַ/דָּ֤ם עַל הַ/מִּזְבֵּ֨חַ֙ סָבִ֔יב אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/005.yaml
  text: And he shall slaughter the young bull before Yahweh[a], and Aaron’s sons, the priests, shall present the blood and throw the blood against the altar all around[b], which is at the entrance of the tent of meeting.
translation:
  language: fr
  text: Il égorgera le jeune taureau[a] devant Yahweh. Puis les fils d’Aaron, les prêtres, présenteront le sang et projetteront le sang contre l’autel, tout autour[b], qui se trouve à l’entrée de la tente de la rencontre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « fils du gros bétail », expression hébraïque désignant ici un bovin mâle.
    reason: lexical_alternative
  - marker: b
    text: Ou « ils aspergeront le sang sur l’autel, tout autour ». Le verbe hébreu évoque le fait de lancer ou de projeter le sang lors de son application rituelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: il égorgera
  rationale: Dans cette prescription rituelle, la forme verbale exprime l’action à accomplir. « Égorger » désigne précisément la mise à mort sacrificielle de l’animal.
- source_word: בֶּן הַבָּקָר
  choice: le jeune taureau
  rationale: Littéralement « fils du gros bétail », cette expression idiomatique désigne ici un bovin mâle offert en sacrifice. « Jeune taureau » est naturel et conserve la nuance de בֶּן.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: La formulation conserve à la fois le cadre spatial et cultuel de l’hébreu ainsi que le nom divin.
- source_word: וְהִקְרִיבוּ
  choice: présenteront
  rationale: Le hiphil de קרב signifie faire approcher ou présenter. Ici, « présenteront » convient au sang apporté par les prêtres sans confondre ce geste avec l’ensemble de l’offrande.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: les fils d’Aaron, les prêtres
  rationale: Cette tournure maintient la désignation familiale et l’apposition qui précise leur fonction sacerdotale.
- source_word: וְזָרְקוּ אֶת הַדָּם
  choice: ils projetteront le sang
  rationale: זרק exprime ici un geste de lancement ou de projection du sang. « Projeter » restitue mieux cette action physique que le traditionnel « asperger », tout en restant naturel en français.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: contre l’autel, tout autour
  rationale: Dans ce contexte de manipulation du sang, « contre » exprime son application aux côtés de l’autel; « tout autour » rend סָבִיב.
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: à l’entrée de la tente de la rencontre
  rationale: La proposition situe l’autel. « Tente de la rencontre » traduit de façon transparente אֹהֶל מוֹעֵד sans importer le terme architectural plus traditionnel « tabernacle ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom d’alliance au lieu de le remplacer par un titre.
- issue: Identité de celui qui égorge l’animal
  choice: 'Maintien du sujet singulier implicite : « il »'
  alternative: Expliciter « celui qui présente l’offrande »
  rationale: Le verbe hébreu est au singulier, tandis que les prêtres deviennent ensuite le sujet pluriel. Le verset ne répète pas explicitement l’identité du premier acteur; la traduction préserve cette continuité et ce contraste.
translation_notes:
  register: 'Français international moderne, sobre et digne. Le vocabulaire rituel demeure concret : « égorger », « présenter » et « projeter ». La ponctuation en deux phrases clarifie le passage de l’offrant aux prêtres sans modifier la succession des gestes.'
