id: LEV.1.14
reference: Leviticus 1:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִ֧ם מִן הָ/ע֛וֹף עֹלָ֥ה קָרְבָּנ֖/וֹ לַֽ/יהוָ֑ה וְ/הִקְרִ֣יב מִן הַ/תֹּרִ֗ים א֛וֹ מִן בְּנֵ֥י הַ/יּוֹנָ֖ה אֶת קָרְבָּנֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/014.yaml
  text: And if his offering to Yahweh is a burnt offering from the birds, then he shall present his offering from the turtledoves or from the young pigeons.
translation:
  language: fr
  text: Et si son offrande à Yahweh est un holocauste d’oiseaux, il présentera comme offrande des tourterelles ou de jeunes pigeons.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Et si
  rationale: Le waw et la particule conditionnelle introduisent un nouveau cas tout en maintenant le lien avec les instructions précédentes.
- source_word: מִן הָעוֹף
  choice: pris parmi les oiseaux
  rationale: עוֹף désigne ici la catégorie des oiseaux; cette formulation exprime naturellement en français la provenance de l'offrande.
- source_word: עֹלָה
  choice: holocauste
  rationale: « Holocauste » est le terme cultuel français établi pour l'offrande entièrement brûlée, sans imposer à la traduction l'étymologie possible d'une offrande qui « monte ».
- source_word: קָרְבָּנוֹ
  choice: son offrande / comme offrande
  rationale: קָרְבָּן désigne ce qui est présenté à Dieu. La variation française évite une répétition pesante tout en conservant les deux occurrences et leur fonction.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל marque ici le destinataire de l'offrande, et le tétragramme est transcrit « Yahweh ».
- source_word: וְהִקְרִיב
  choice: il présentera
  rationale: Le hiphil de קרב signifie faire approcher ou présenter dans le cadre rituel; « présentera » restitue ce sens sans littéralisme maladroit.
- source_word: מִן הַתֹּרִים
  choice: une tourterelle
  rationale: תֹּרִים désigne les tourterelles. Après « comme offrande », le singulier distributif est naturel en français pour l'un des animaux permis.
- source_word: אוֹ
  choice: ou
  rationale: La conjonction marque simplement le choix entre les deux espèces autorisées.
- source_word: מִן בְּנֵי הַיּוֹנָה
  choice: un jeune pigeon
  rationale: L'expression idiomatique « fils de pigeon/colombe » désigne un jeune pigeon; le singulier français correspond à l'animal effectivement offert.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conditionnelle et le vocabulaire rituel sont conservés, avec une formulation naturelle. Aucun marqueur de note n'est requis.
