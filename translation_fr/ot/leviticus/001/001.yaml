id: LEV.1.1
reference: Leviticus 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּקְרָ֖א אֶל מֹשֶׁ֑ה וַ/יְדַבֵּ֤ר יְהוָה֙ אֵלָ֔י/ו מֵ/אֹ֥הֶל מוֹעֵ֖ד לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/001.yaml
  text: Then Yahweh called to Moses and spoke to him from the tent of meeting[a], saying,
translation:
  language: fr
  text: 'Puis Yahvé[a] appela Moïse et lui parla depuis la tente de la rencontre en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte ici le nom divin יהוה (YHWH), traditionnellement rendu par « le Seigneur ».
    reason: Signaler la présence du nom divin et l’autre convention de traduction courante.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: appela
  rationale: Le verbe קרא introduit ici l’adresse divine à Moïse. « Appela » reste naturel sans ajouter l’idée plus forte d’une convocation.
- source_word: אֶל־מֹשֶׁה
  choice: Moïse
  rationale: 'Avec le verbe « appeler », le complément indirect hébreu devient naturellement un complément direct en français : « appela Moïse ». « Moïse » est la forme française usuelle du nom.'
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: « Parla » conserve la distinction entre l’acte de parler et לֵאמֹר, qui introduit ensuite le contenu du discours.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française traditionnelle « Yahvé » représente directement le nom divin יהוה plutôt que de lui substituer un titre.
- source_word: אֵלָיו
  choice: lui
  rationale: Le pronom renvoie clairement à Moïse ; « lui parla » est la tournure française idiomatique.
- source_word: מֵאֹהֶל מוֹעֵד
  choice: depuis la tente de la rencontre
  rationale: « Depuis » exprime le lieu d’où vient la parole, et « tente de la rencontre » rend de façon transparente la désignation du sanctuaire comme lieu de rencontre fixé.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: Cette formule française introduit naturellement le contenu du discours qui commence au verset suivant, tout en représentant la fonction de l’infinitif hébreu « disant ».
- source_word: וַ
  choice: Puis
  rationale: Le waw narratif fait avancer le récit dans la continuité de la fin de l’Exode ; « Puis » exprime cette progression avec naturel.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. Employer le nom propre préserve cette donnée du texte hébreu au lieu de la remplacer par un titre.
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve les deux actes verbaux distincts (« appela », « parla ») et emploie une formule idiomatique pour introduire la parole qui suit.
