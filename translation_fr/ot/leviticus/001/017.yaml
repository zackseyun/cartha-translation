revisions:
- from: Il ouvrira l’oiseau en le déchirant du côté des ailes, sans le séparer en deux. Puis le prêtre le fera fumer sur l’autel, sur le bois placé sur le feu. C’est un holocauste, une offrande consumée par le feu[a], au parfum agréable pour Yahweh.
  to: Il le déchirera par les ailes, sans le séparer. Puis le prêtre le fera monter en fumée sur l’autel, sur le bois placé sur le feu. C’est un holocauste, une offrande consumée par le feu[a], un parfum agréable pour Yahweh.
  rationale: La révision resserre le rendu du déchirement aux ailes, évite l’ajout « en deux », et emploie une expression française moderne et précise pour l’offrande mise en fumée. La formule cultuelle finale demeure une suite d’appositions, conforme à l’hébreu, et la note conserve l’ambiguïté lexicale signalée.
