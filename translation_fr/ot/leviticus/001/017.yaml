  text: וְ/שִׁסַּ֨ע אֹת֣/וֹ בִ/כְנָפָי/ו֮ לֹ֣א יַבְדִּיל֒ וְ/הִקְטִ֨יר אֹת֤/וֹ הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה עַל הָ/עֵצִ֖ים אֲשֶׁ֣ר עַל הָ/אֵ֑שׁ עֹלָ֣ה ה֗וּא אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/017.yaml
  text: He shall tear it open by its wings[a], but he shall not divide it; and the priest shall burn it on the altar, on the wood that is on the fire. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: fr
  text: Il le déchirera par les ailes, sans le séparer. Puis le prêtre le fera monter en fumée sur l’autel, sur le bois placé sur le feu. C’est un holocauste, une offrande consumée par le feu[a], un parfum agréable pour Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un mets offert ».
    reason: Alternative lexicale pour אִשֶּׁה, dont l’analyse comme offrande faite par le feu est traditionnelle, mais discutée.
lexical_decisions:
- source_word: שִׁסַּע
  choice: ouvrira l’oiseau en le déchirant
  rationale: Le verbe décrit l’action de fendre ou déchirer le corps de l’oiseau. Cette formulation concrète s’accorde avec l’interdiction qui suit de le séparer entièrement.
- source_word: בִכְנָפָיו
  choice: du côté des ailes
  rationale: La préposition peut indiquer le lieu ou le moyen. « Du côté des ailes » conserve l’image anatomique sans imposer que les ailes servent elles-mêmes d’instrument.
- source_word: לֹא יַבְדִּיל
  choice: sans le séparer en deux
  rationale: Le hiphil de בדל signifie séparer ou diviser. Le complément « en deux » rend naturellement en français l’idée que l’oiseau est ouvert, mais non entièrement disjoint.
- source_word: וְהִקְטִיר
  choice: le fera fumer
  rationale: Dans le vocabulaire sacrificiel, le verbe désigne l’action de faire monter l’offrande en fumée sur l’autel, nuance mieux conservée que par le simple verbe « brûler ».
- source_word: עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: sur le bois placé sur le feu
  rationale: La formulation préserve la disposition en couches exprimée par la répétition de עַל, tout en restant naturelle en français.
- source_word: עֹלָה
  choice: holocauste
  rationale: « Holocauste » est le terme sacrificiel français établi pour l’offrande entièrement brûlée, sans réduire le mot à son étymologie liée à la montée.
- source_word: אִשֵּׁה
  choice: offrande consumée par le feu
  rationale: Le terme cultuel désigne vraisemblablement une offrande faite par le feu. La traduction reste transparente, tandis que l’autre analyse possible est signalée en note.
- source_word: רֵיחַ נִיחֹחַ
  choice: au parfum agréable
  rationale: Cette expression cultuelle évoque un parfum accueilli favorablement. « Parfum agréable » garde la métaphore sans langage archaïque.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל exprime ici la destination ou la relation du parfum sacrificiel, et le nom divin est rendu directement par « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre d’alliance sans le remplacer par un titre.
- issue: Formule cultuelle רֵיחַ נִיחֹחַ
  choice: au parfum agréable pour Yahweh
  alternative: d’une odeur apaisante pour Yahweh
  rationale: La formulation préserve l’image sacrificielle et l’idée d’agrément divin, sans préciser au-delà du texte comment cet agrément doit être compris.
- issue: Sens de אִשֵּׁה
  choice: offrande consumée par le feu
  alternative: mets offert
  rationale: L’analyse traditionnelle relie le terme au feu, mais une relation avec le vocabulaire du mets ou de la nourriture offerte a aussi été proposée. L’ambiguïté lexicale est conservée en note.
translation_notes:
  register: Français international moderne, digne et concret. La syntaxe distingue clairement l’action initiale de l’offrant de celle du prêtre. Le terme cultuel établi « holocauste » est conservé, tandis que « fera fumer » explicite la nuance sacrificielle de l’action sur l’autel.
