revisions:
- from: Il posera sa main sur la tête de l’holocauste[a], et celui-ci sera agréé en sa faveur, afin de faire l’expiation pour lui.
  to: Il posera sa main sur la tête de l’holocauste[a], et celui-ci sera agréé en sa faveur, afin de servir d’expiation pour lui.
  rationale: La révision remplace l’infinitif « faire l’expiation », dont le sujet est ambigu en français, par « servir d’expiation », qui exprime clairement la fonction de l’holocauste agréé. La note maintient l’ambiguïté interprétative du passif hébreu.
