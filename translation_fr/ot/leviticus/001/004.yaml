id: LEV.1.4
reference: Leviticus 1:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/סָמַ֣ךְ יָד֔/וֹ עַ֖ל רֹ֣אשׁ הָ/עֹלָ֑ה וְ/נִרְצָ֥ה ל֖/וֹ לְ/כַפֵּ֥ר עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/004.yaml
  text: And he shall lay his hand on the head of the burnt offering[a], and it shall be accepted for him to make atonement on his behalf.
translation:
  language: fr
  text: Il posera sa main sur la tête de l’holocauste[a], et celui-ci sera agréé en sa faveur, afin de servir d’expiation pour lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et il sera agréé » — le passif hébreu peut être compris comme se rapportant plus directement à celui qui présente l’offrande plutôt qu’à l’offrande elle-même.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָמַךְ
  choice: Il posera
  rationale: Dans le contexte sacrificiel, סמך désigne le geste rituel consistant à poser ou appuyer la main sur l’animal. « Posera » est naturel et n’exagère pas la pression exercée.
- source_word: יָדוֹ
  choice: sa main
  rationale: Le singulier et la relation possessive de l’hébreu sont conservés.
- source_word: עַל רֹאשׁ
  choice: sur la tête de
  rationale: Rendu direct et idiomatique qui préserve le caractère concret du geste.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: « Holocauste » est le terme cultuel français établi pour עֹלָה, offrande entièrement consumée, et convient au registre biblique sans développer ici son étymologie.
- source_word: וְנִרְצָה
  choice: et celui-ci sera agréé
  rationale: Le nifal de רצה exprime ici l’acceptation favorable. Le pronom « celui-ci » renvoie naturellement à l’holocauste tout en maintenant la voix passive.
- source_word: לוֹ
  choice: en sa faveur
  rationale: La préposition ל marque ici le bénéfice de l’offrant. Cette formulation distingue clairement cette relation de celle exprimée ensuite par עָלָיו.
- source_word: לְכַפֵּר
  choice: afin de faire l’expiation
  rationale: « Faire l’expiation » conserve le poids cultuel de כפר sans imposer une théorie particulière du mécanisme expiatoire.
- source_word: עָלָיו
  choice: pour lui
  rationale: Avec כפר dans ce contexte sacrificiel, על désigne la personne en faveur de laquelle l’expiation est accomplie.
theological_decisions:
- issue: Référent du passif וְנִרְצָה
  choice: L’holocauste sera agréé
  alternative: L’offrant sera agréé
  rationale: Le référent sacrificiel immédiatement disponible est l’holocauste, et la suite relie naturellement son agrément à sa fonction expiatoire pour l’offrant. Toutefois, la construction hébraïque permet de comprendre l’agrément comme visant plus directement l’offrant; cette possibilité est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le terme cultuel traditionnel « holocauste » est retenu pour sa précision dans le contexte lévitique. La formulation distingue « en sa faveur » et « pour lui » afin d’éviter une répétition lourde tout en reflétant les deux prépositions hébraïques.
