  yaml_path: translation/ot/leviticus/001/016.yaml
  text: He shall remove its crop with its feathers and throw it beside the altar[a], on the east side[b], to the place of the ashes.
translation:
  language: fr
  text: Il retirera son jabot avec ses plumes[a] et le jettera à côté de l’autel, du côté est, au lieu des cendres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec son contenu impur ». L’expression hébraïque est difficile ; elle peut aussi être comprise comme désignant les matières contenues dans le jabot.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵסִיר
  choice: Il retirera
  rationale: Le hiphil de סור exprime ici l’action d’enlever une partie de l’oiseau; « retirera » convient naturellement à cette prescription rituelle.
- source_word: מֻרְאָתוֹ
  choice: son jabot
  rationale: Dans le contexte anatomique d’un oiseau, le terme désigne le jabot, poche de l’œsophage où la nourriture est temporairement stockée.
- source_word: בְּנֹצָתָהּ
  choice: avec ses plumes
  rationale: La forme consonantique se rattache le plus directement à נוצה, « plume, plumage ». Cette traduction conserve le sens lexical le plus immédiat sans intégrer au texte l’interprétation traditionnelle « avec son contenu impur ».
- source_word: וְהִשְׁלִיךְ אֹתָהּ
  choice: et le jettera
  rationale: Le hiphil de שלך signifie couramment « jeter ». Le pronom français masculin reprend naturellement « jabot », même si le suffixe hébreu renvoie grammaticalement à la partie retirée.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: à côté de l’autel
  rationale: אֵצֶל indique une position proche, sur le côté; « à côté de » est précis et courant.
- source_word: קֵדְמָה
  choice: vers l’est
  rationale: L’adverbe directionnel indique le côté oriental de l’autel. « Vers l’est » préserve sa forme directionnelle sans alourdir la phrase.
- source_word: אֶל מְקוֹם הַדָּשֶׁן
  choice: à l’endroit où l’on dépose les cendres
  rationale: Littéralement « au lieu des cendres »; la formulation explicite naturellement qu’il s’agit de l’emplacement réservé aux cendres de l’autel, sans le réduire nécessairement à un tas.
