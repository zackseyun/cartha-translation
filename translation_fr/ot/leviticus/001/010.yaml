id: LEV.1.10
reference: Leviticus 1:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם מִן הַ/צֹּ֨אן קָרְבָּנ֧/וֹ מִן הַ/כְּשָׂבִ֛ים א֥וֹ מִן הָ/עִזִּ֖ים לְ/עֹלָ֑ה זָכָ֥ר תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/010.yaml
  text: And if his offering is from the flock, from the sheep or from the goats, for a burnt offering, he shall offer it, a male without blemish.
translation:
  language: fr
  text: Si son offrande pour un holocauste est prise parmi le petit bétail, qu’il s’agisse de moutons ou de chèvres, il offrira un mâle sans défaut[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme holocauste ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Si
  rationale: Dans la suite des prescriptions, le français exprime naturellement ce nouveau cas conditionnel par « Si »; la coordination hébraïque n’a pas besoin d’être rendue mécaniquement par « Et ».
- source_word: מִן הַצֹּאן
  choice: provient du petit bétail
  rationale: צֹאן désigne collectivement les animaux domestiques de petite taille, principalement moutons et chèvres, catégories précisées immédiatement après.
- source_word: קָרְבָּנוֹ
  choice: son offrande
  rationale: קָרְבָּן désigne ce qui est présenté dans le cadre du culte; « offrande » est clair, usuel et adapté au contexte sacrificiel.
- source_word: מִן הַכְּשָׂבִים א֥וֹ מִן הָעִזִּים
  choice: moutons ou chèvres
  rationale: La formulation conserve les deux catégories sans restreindre כְּשָׂבִים aux seuls agneaux ni préciser un âge absent du texte.
- source_word: לְעֹלָה
  choice: pour un holocauste
  rationale: « Holocauste » est le terme français établi pour le sacrifice entièrement consumé; la préposition « pour » garde la valeur de destination ou de fonction de לְ.
- source_word: זָכָר תָּמִים
  choice: un mâle sans défaut
  rationale: 'La traduction conserve l’exigence explicite relative au sexe de l’animal et rend תָּמִים selon son sens sacrificiel concret: exempt de défaut physique.'
- source_word: יַקְרִיבֶנּוּ
  choice: il offrira
  rationale: Le hiphil de קרב signifie ici présenter ou offrir un animal en sacrifice. En français, le complément est naturellement explicité par l’apposition « un mâle sans défaut », sans pronom redondant.
theological_decisions:
- issue: Sens du terme sacrificiel עֹלָה
  choice: holocauste
  alternative: sacrifice entièrement brûlé; offrande ascendante
  rationale: « Holocauste » nomme traditionnellement et précisément cette catégorie sacrificielle en français sans imposer une interprétation de l’étymologie. La note conserve l’autre relation syntaxique possible de לְ.
- issue: Exigence relative au sexe de l’animal
  choice: un mâle
  alternative: un animal mâle
  rationale: Le texte hébreu précise explicitement le sexe de la victime; cette donnée doit être conservée sans la généraliser.
- issue: Portée de תָּמִים
  choice: sans défaut
  alternative: intègre; parfait
  rationale: Dans ce contexte rituel, le mot vise l’absence de défaut physique chez l’animal, plutôt qu’une perfection morale ou métaphysique.
translation_notes:
  register: Français international moderne, sobre et digne. « Petit bétail » conserve la catégorie collective hébraïque, aussitôt rendue transparente par « moutons ou chèvres ». La syntaxe évite une répétition pesante tout en gardant toutes les précisions du texte source.
