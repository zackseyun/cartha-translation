id: LEV.1.3
reference: Leviticus 1:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִם עֹלָ֤ה קָרְבָּנ/וֹ֙ מִן הַ/בָּקָ֔ר זָכָ֥ר תָּמִ֖ים יַקְרִיבֶ֑/נּוּ אֶל פֶּ֝תַח אֹ֤הֶל מוֹעֵד֙ יַקְרִ֣יב אֹת֔/וֹ לִ/רְצֹנ֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/003.yaml
  text: If his offering is a burnt offering from the herd[a], he shall offer a male without blemish. He shall offer it at the entrance of the tent of meeting, that he may be accepted before Yahweh.
translation:
  language: fr
  text: Si son offrande est un holocauste pris parmi le gros bétail, il présentera un mâle sans défaut. Il le présentera à l’entrée de la tente de la rencontre, afin d’être agréé devant Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il le présentera de son plein gré devant Yahweh ».'
    reason: La formule hébraïque לִרְצֹנוֹ peut exprimer l’agrément de l’offrant ou, selon une interprétation traditionnelle, son libre consentement.
lexical_decisions:
- source_word: עֹלָה
  choice: holocauste
  rationale: Terme sacrificiel français établi pour l’offrande entièrement consumée sur l’autel; il rend ici le sens cultuel sans paraphrase.
- source_word: קָרְבָּנוֹ
  choice: son offrande
  rationale: קָרְבָּן désigne ce qui est présenté à Dieu; « offrande » est naturel, précis et adapté au contexte sacrificiel.
- source_word: מִן הַבָּקָר
  choice: pris parmi le gros bétail
  rationale: הַבָּקָר désigne ici les bovins domestiques. « Gros bétail » est une expression française claire qui les distingue du petit bétail mentionné ensuite.
- source_word: זָכָר
  choice: un mâle
  rationale: Le texte précise explicitement le sexe de l’animal; cette formulation conserve cette exigence sans ajout.
- source_word: תָּמִים
  choice: sans défaut
  rationale: Dans le contexte sacrificiel, le terme qualifie un animal exempt de tare; « sans défaut » est précis et naturel en français moderne.
- source_word: יַקְרִיבֶנּוּ / יַקְרִיב אֹתוֹ
  choice: il présentera / il le présentera
  rationale: Le hiphil de קרב signifie faire approcher, présenter ou offrir. « Présenter » rend bien le geste cultuel tout en évitant la répétition ambiguë du nom « offrande ».
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à l’entrée de la tente de la rencontre
  rationale: Rend directement la désignation du sanctuaire et son emplacement, dans une formulation française courante.
- source_word: לִרְצֹנוֹ
  choice: afin d’être agréé
  rationale: Dans ce contexte, l’expression indique probablement l’agrément de l’offrant devant Dieu. L’infinitif français rattache naturellement cet agrément à celui qui présente l’animal, tandis que l’autre interprétation historique est signalée en note.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » rend לִפְנֵי, et le nom divin יהוה est transcrit « Yahweh » afin de conserver le nom propre présent dans le texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte directement le tétragramme. La transcription « Yahweh » conserve le nom propre sans lui substituer un titre.
- issue: Interprétation de לִרְצֹנוֹ
  choice: afin d’être agréé
  alternative: de son plein gré
  rationale: La lecture principale retient le sens cultuel probable d’acceptation de l’offrant devant Dieu. La construction hébraïque permet toutefois une lecture liée au bon vouloir ou au caractère volontaire; cette ambiguïté est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire sacrificiel établi (« holocauste », « sans défaut ») est conservé, tandis que la syntaxe reste accessible. La répétition de « il présentera » suit l’insistance du texte hébreu.
