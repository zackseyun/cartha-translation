revisions:
- from: 'Il lavera à l’eau les entrailles et les pattes de l’animal, puis le prêtre fera tout fumer sur l’autel : c’est un holocauste, une offrande consumée par le feu[a], au parfum agréable pour Yahweh.'
  to: 'Il lavera à l’eau les entrailles et les pattes de l’animal, puis le prêtre fera monter le tout en fumée sur l’autel : c’est un holocauste, une offrande par le feu[a], une odeur agréable à Yahweh.'
  rationale: La révision améliore la précision du verbe sacrificiel et l’idiomaticité française, tout en maintenant la structure appositionnelle, le nom divin Yahweh et l’ambiguïté lexicale de אִשֶּׁה.
