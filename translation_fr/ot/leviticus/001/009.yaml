  text: וְ/קִרְבּ֥/וֹ וּ/כְרָעָ֖י/ו יִרְחַ֣ץ בַּ/מָּ֑יִם וְ/הִקְטִ֨יר הַ/כֹּהֵ֤ן אֶת הַ/כֹּל֙ הַ/מִּזְבֵּ֔חָ/ה עֹלָ֛ה אִשֵּׁ֥ה רֵֽיחַ נִיח֖וֹחַ לַֽ/יהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/009.yaml
  text: But he shall wash its entrails and its legs with water[a], and the priest shall turn all of it into smoke on the altar, a burnt offering, a food offering[c][b], a pleasing aroma to Yahweh.
translation:
  language: fr
  text: 'Il lavera à l’eau les entrailles et les pattes de l’animal, puis le prêtre fera monter le tout en fumée sur l’autel : c’est un holocauste, une offrande par le feu[a], une odeur agréable à Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « une offrande alimentaire ». Le sens précis du terme hébreu est discuté; il désigne une offrande présentée à Dieu sur l’autel par le feu.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְבּוֹ
  choice: les entrailles de l’animal
  rationale: Dans ce contexte sacrificiel, קֶרֶב désigne les parties internes de l’animal. « Entrailles » est concret et courant; l’ajout « de l’animal » explicite naturellement en français le possessif hébreu.
- source_word: כְרָעָיו
  choice: les pattes de l’animal
  rationale: Le terme désigne les membres inférieurs de l’animal. « Pattes » convient mieux que « jambes » en français courant et reste moins technique que « jarrets ».
- source_word: יִרְחַץ בַּמָּיִם
  choice: lavera à l’eau
  rationale: Cette formulation française naturelle exprime clairement le lavage rituel et la valeur instrumentale de בַּמַּיִם.
- source_word: וְהִקְטִיר
  choice: fera tout fumer
  rationale: Le verbe sacrificiel désigne l’action de faire monter l’offrande en fumée sur l’autel. « Faire fumer » conserve cette nuance plus précisément que le simple verbe « brûler ».
- source_word: אֶת־הַכֹּל
  choice: tout
  rationale: Le pronom maintient avec concision l’insistance du texte sur la totalité de l’animal préparé.
- source_word: הַמִּזְבֵּחָה
  choice: sur l’autel
  rationale: C’est l’expression sacrificielle française naturelle et directe.
- source_word: עֹלָה
  choice: un holocauste
  rationale: « Holocauste » est le terme français établi pour l’offrande entièrement brûlée, tout en restant intelligible dans le contexte immédiat.
- source_word: אִשֵּׁה
  choice: une offrande consumée par le feu
  rationale: Le sens précis et l’étymologie du terme sont discutés. Cette traduction rend sa relation manifeste au feu sacrificiel sans affirmer que le feu lui-même constitue l’offrande; une note conserve l’autre compréhension importante.
- source_word: רֵיחַ נִיחוֹחַ
  choice: au parfum agréable
  rationale: Cette expression française conserve l’image de la formule sacrificielle, qui présente l’offrande comme agréée par Dieu, sans la paraphraser théologiquement.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition indique le destinataire auquel l’offrande et son parfum sont agréables; « Yahweh » représente directement le nom divin יהוה.
theological_decisions:
- issue: Représentation du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahweh » le rend comme nom propre sans le remplacer par un titre.
- issue: Portée de la formule רֵיחַ נִיחוֹחַ
  choice: au parfum agréable
  alternative: une odeur apaisante
  rationale: La traduction maintient la métaphore sacrificielle et l’idée d’agrément sans préciser de manière indue que le sacrifice modifierait l’état émotionnel de Dieu.
- issue: Sens de אִשֵּׁה
  choice: une offrande consumée par le feu
  alternative: un mets offert
  rationale: La traduction principale suit l’association cultuelle évidente avec le feu, tandis que la note signale l’analyse lexicale selon laquelle le mot peut désigner un mets présenté à Dieu.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe garde la succession rituelle du texte hébreu et présente les derniers groupes comme des appositions explicatives. « Pattes » et « à l’eau » privilégient une expression courante, tandis que « holocauste » conserve le vocabulaire sacrificiel établi.
