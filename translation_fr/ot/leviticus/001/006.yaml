  yaml_path: translation/ot/leviticus/001/006.yaml
  text: Then he shall skin the burnt offering and cut it into its pieces[a][b].
translation:
  language: fr
  text: Puis il dépouillera l’holocauste de sa peau et le découpera en morceaux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « en ses morceaux » ; c’est-à-dire en divisant l’animal en différentes parties pour le sacrifice.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהִפְשִׁיט
  choice: il dépouillera … de sa peau
  rationale: Le hifil de פשט désigne ici l’action d’enlever la peau de l’animal. Cette formulation est claire et naturelle en français moderne, sans l’ambiguïté possible de « dépouiller » employé seul.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: Dans le Lévitique, עֹלָה désigne le sacrifice entièrement consumé sur l’autel. « Holocauste » est le terme cultuel français établi, malgré son emploi moderne dans d’autres contextes.
- source_word: וְנִתַּח
  choice: et le découpera
  rationale: נתח exprime le fait de diviser l’animal en parties. « Découper » rend naturellement l’action rituelle et s’accorde avec le complément « en morceaux ».
- source_word: לִנְתָחֶיהָ
  choice: en morceaux
  rationale: Le nom נתח désigne une partie obtenue par découpe; avec ל, l’expression indique le résultat de l’action. Le possessif hébreu est implicite en français dans cette tournure idiomatique.
- source_word: וְ
  choice: Puis
  rationale: La conjonction relie cette prescription à l’étape précédente et marque ici la progression de la procédure sacrificielle.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La formulation conserve le vocabulaire sacrificiel traditionnel tout en explicitant concrètement l’enlèvement de la peau. Un seul appel de note figure dans le texte et correspond à la note fournie.
