  text: And the priest shall bring it to the altar[a], and pinch off its head and burn it on the altar[b], and its blood shall be drained out on the side of the altar.
translation:
  language: fr
  text: Le prêtre amènera l’oiseau à l’autel, lui tordra le cou[a] et brûlera la tête sur l’autel. Son sang sera pressé contre la paroi de l’autel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu est un terme technique pour la mise à mort d’un oiseau offert en sacrifice. Il peut évoquer le fait de pincer ou de tordre le cou, jusqu’à détacher la tête.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sur le mur/la paroi de l’autel ». Le verbe indique que le sang est pressé ou extrait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: apportera l’oiseau
  rationale: Le hiphil de קרב exprime ici le fait d’amener ou de présenter la victime. « Apportera l’oiseau à l’autel » rend concrètement le mouvement indiqué par אֶל et explicite naturellement en français le référent du pronom.
- source_word: וּמָלַק אֶת־רֹאשׁוֹ
  choice: lui détachera la tête
  rationale: מלק est un terme technique désignant la mise à mort d’un oiseau par le prêtre au niveau de la tête ou du cou. Cette formulation est claire et conserve la mention explicite de la tête, tandis qu’une note signale l’incertitude sur le geste précis.
- source_word: וְהִקְטִיר
  choice: la fera fumer
  rationale: Dans le langage sacrificiel, קטר désigne l’action de brûler sur l’autel de manière à faire monter la victime en fumée. Le pronom féminin reprend naturellement « la tête », dernier objet exprimé dans la séquence.
- source_word: הַמִּזְבֵּחָה
  choice: sur l’autel
  rationale: Dans ce contexte rituel, la forme directionnelle désigne le lieu où la partie de la victime est brûlée; « sur l’autel » est idiomatique et précis.
- source_word: וְנִמְצָה דָמוֹ
  choice: il fera couler son sang
  rationale: Le niphal de מצה évoque le sang extrait, pressé ou laissé s’écouler. La tournure active avec le prêtre comme sujet implicite est plus naturelle en français, tandis qu’une note conserve le caractère passif et la nuance concrète de l’hébreu.
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: contre la paroi de l’autel
  rationale: קִיר signifie littéralement « mur » ou « paroi ». Pour un autel, « paroi » désigne clairement sa face verticale et עַל se rend naturellement ici par « contre ».
