    rationale: 'וְנִמְצָה דָמוֹ est une forme passive : le texte dit que le sang est pressé ou extrait contre/sur la paroi de l’autel, sans exprimer ici le prêtre comme sujet grammatical.'
  - severity: low
    issue: La reprise « la fera fumer » est ambiguë en français.
    rationale: Après « la tête », le pronom peut être compris correctement, mais l’objet non exprimé de l’hébreu est mieux explicité en français comme « la tête » dans cette séquence.
  - severity: low
    issue: La note b ne documente pas directement l’alternative spatiale liée à « paroi ».
    rationale: L’ancre suit « sang », mais la note doit aussi préserver la valeur de עַל קִיר, littéralement « sur le mur/la paroi de l’autel ».
