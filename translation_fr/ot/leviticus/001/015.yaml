revisions:
- from: Le prêtre apportera l’oiseau à l’autel, lui détachera la tête[a] et la fera fumer sur l’autel. Puis il fera couler son sang[b] contre la paroi de l’autel.
  to: Le prêtre amènera l’oiseau à l’autel, lui tordra le cou[a] et brûlera la tête sur l’autel. Son sang sera pressé contre la paroi de l’autel[b].
  rationale: La révision rétablit le passif de la dernière proposition, explicite de façon naturelle la tête comme objet de l’action de brûler et ajuste les notes pour conserver les nuances lexicales et spatiales de l’hébreu.
