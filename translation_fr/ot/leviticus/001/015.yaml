review_pass:
  verdict: revise
  source_fidelity: La séquence rituelle et les principaux référents sont bien rendus. Toutefois, וְנִמְצָה est au passif (« son sang sera pressé/extrait ») et non une action explicitement attribuée au prêtre. En outre, l’objet sous-entendu de « fera fumer » est, dans le contexte immédiat, la tête mentionnée; le préciser évite une reprise pronominale française équivoque.
  naturalness: Le français est globalement fluide et de registre sobre. « Lui détachera la tête » reste possible, mais « lui tordra le cou » est plus idiomatique pour l’acte technique appliqué à un oiseau, avec une note qui conserve l’incertitude précise du geste. « Brûlera la tête » est plus naturel et plus clair que « la fera fumer ».
  terminology: « Prêtre », « autel » et « paroi de l’autel » conviennent. « Brûlera » rend clairement le geste sacrificiel de הקטיר sans introduire une terminologie confessionnelle. La note sur la paroi maintient la valeur plus littérale de קיר (« mur/paroi »).
  issues:
