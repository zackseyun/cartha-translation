  text: וְ/נִתַּ֤ח אֹת/וֹ֙ לִ/נְתָחָ֔י/ו וְ/אֶת רֹאשׁ֖/וֹ וְ/אֶת פִּדְר֑/וֹ וְ/עָרַ֤ךְ הַ/כֹּהֵן֙ אֹתָ֔/ם עַל הָֽ/עֵצִים֙ אֲשֶׁ֣ר עַל הָ/אֵ֔שׁ אֲשֶׁ֖ר עַל הַ/מִּזְבֵּֽחַ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/012.yaml
  text: And he shall cut it into its pieces[a], with its head and its fat, and the priest shall arrange them on the wood that is on the fire, which is on the altar.
translation:
  language: fr
  text: Il le découpera en morceaux, avec sa tête et sa graisse[a], puis le prêtre les disposera sur le bois qui est sur le feu, lui-même sur l’autel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son suif » ou « la graisse autour de ses entrailles ». Le terme hébreu désigne du tissu graisseux associé à l’animal sacrifié.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִתַּח
  choice: il le découpera
  rationale: Dans ce contexte sacrificiel, נתח désigne l’action de découper l’animal. Le futur français convient à la valeur prescriptive de cette instruction rituelle.
- source_word: לִנְתָחָיו
  choice: en morceaux
  rationale: Le nom apparenté au verbe désigne les différentes parties obtenues par le découpage; « en morceaux » est naturel et précis en français.
- source_word: רֹאשׁוֹ
  choice: sa tête
  rationale: Terme anatomique direct, dont le possessif renvoie à l’animal offert.
- source_word: פִּדְרוֹ
  choice: sa graisse
  rationale: פדר désigne un tissu graisseux associé à l’animal sacrifié. « Graisse » reste clair et général, tandis que « suif » serait plus technique et « graisse autour des entrailles » plus interprétatif.
- source_word: וְעָרַךְ
  choice: disposera
  rationale: Dans le vocabulaire cultuel, ערך signifie placer méthodiquement ou mettre en ordre. « Disposera » exprime naturellement cette action rituelle.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Équivalent français courant de כהן dans la législation sacrificielle du Lévitique.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom reprend collectivement les morceaux, la tête et la graisse.
- source_word: עַל הָעֵצִים
  choice: sur le bois
  rationale: Bien que le nom hébreu soit au pluriel, le collectif français « le bois » est idiomatique dans ce contexte.
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: qui est sur le feu, sur l’autel
  rationale: 'Cette formulation conserve la description spatiale en deux niveaux: le bois est sur le feu, et le feu se trouve sur l’autel, tout en évitant une répétition lourde en français.'
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe prescriptive reste proche de l’hébreu, avec « puis » pour marquer naturellement la succession des gestes sans ajouter de portée théologique.
