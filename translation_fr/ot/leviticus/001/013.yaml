base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/013.yaml
  text: But he shall wash the entrails and the legs with water[a], and the priest shall present all of it and turn it into smoke on the altar. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: fr
  text: Il lavera les entrailles et les pattes avec de l’eau, puis le prêtre présentera le tout et le fera monter en fumée sur l’autel. C’est un holocauste, une offrande consumée par le feu[a], un parfum agréable pour YHWH.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une offrande par le feu ». Le sens précis du terme hébreu est discuté; cette expression en est le rendu traditionnel.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: les entrailles
  rationale: Dans ce contexte sacrificiel, le terme désigne les parties internes de l’animal. « Entrailles » est concret, naturel et précis en français.
- source_word: הַכְּרָעַיִם
  choice: les pattes
  rationale: Le mot désigne les membres, particulièrement leur partie inférieure. Pour un animal sacrifié, « pattes » est plus idiomatique que « jambes ».
- source_word: יִרְחַץ בַּמָּיִם
  choice: il lavera … avec de l’eau
  rationale: La formulation conserve le verbe « laver », le sujet masculin singulier et la mention explicite du moyen employé.
- source_word: וְהִקְרִיב
  choice: présentera
  rationale: Le hiphil de קרב exprime ici l’action d’apporter ou de présenter l’offrande. « Présentera » la distingue de l’action suivante, qui consiste à la faire fumer.
- source_word: אֶת־הַכֹּל
  choice: le tout
  rationale: Cette expression française naturelle rend la totalité de l’animal préparé.
- source_word: וְהִקְטִיר
  choice: le fera fumer
  rationale: Le verbe sacrificiel désigne plus précisément le fait de faire monter l’offrande en fumée, et non simplement de la brûler.
- source_word: הַמִּזְבֵּחָה
  choice: sur l’autel
  rationale: Rendu direct et idiomatique du complément indiquant le lieu de la combustion sacrificielle.
- source_word: עֹלָה
  choice: un holocauste
  rationale: « Holocauste » est le terme français établi pour le sacrifice entièrement consumé sur l’autel; il garde ici son sens cultuel, sans connotation historique moderne.
- source_word: אִשֵּׁה
  choice: une offrande consumée par le feu
  rationale: Cette formulation accessible conserve le lien probable du terme avec le feu et décrit la manière dont l’offrande est présentée, sans la réduire au simple acte de brûler.
- source_word: רֵיחַ נִיחֹחַ
  choice: d’une odeur agréable
  rationale: La traduction préserve l’image sensorielle hébraïque exprimant le caractère agréé du sacrifice, sans l’expliciter théologiquement.
- source_word: לַיהוָה
  choice: à YHWH
  rationale: La forme « YHWH » représente directement le nom divin hébreu sans imposer une vocalisation incertaine ni le remplacer par un titre.
theological_decisions:
- issue: Langage anthropomorphique de רֵיחַ נִיחֹחַ
  choice: d’une odeur agréable
  alternative: d’un parfum apaisant
  rationale: Le texte présente l’offrande au moyen d’une image olfactive liée à son acceptation par Dieu. La traduction conserve cette image et sa tension théologique sans la transformer en explication abstraite.
- issue: Sens cultuel de אִשֵּׁה
  choice: une offrande consumée par le feu
  alternative: un mets offert
  rationale: Le lien avec le feu est le sens traditionnel et convient à l’action décrite. Une compréhension liée à la nourriture offerte sur l’autel demeure possible et est signalée en note.
- issue: Représentation du tétragramme יהוה
  choice: YHWH
  alternative: le SEIGNEUR
  rationale: Employer les quatre consonnes rend visible le nom propre présent dans le texte source, tandis que le titre traditionnel constitue une autre pratique de traduction possible.
translation_notes:
  register: Français international moderne, clair et digne. La coordination a été légèrement structurée avec « puis » afin de distinguer l’action du sacrifiant de celle du prêtre. Le vocabulaire cultuel « holocauste » est conservé parce qu’il demeure le terme biblique français consacré; le reste de la phrase emploie des formulations courantes.
