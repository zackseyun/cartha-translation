review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle au texte hébreu : lavage des entrailles et des pattes, présentation de la totalité, combustion sur l’autel, puis désignation comme holocauste et offrande à YHWH. « Faire fumer » est toutefois moins précis et naturel que « faire monter en fumée » pour הִקְטִיר. La formule finale gagne à rendre directement le syntagme nominal רֵיחַ נִיחֹחַ par « un parfum agréable pour YHWH ».'
  naturalness: Le français est globalement moderne et clair. « Le fera fumer » peut suggérer qu’on fait fumer l’animal plutôt que l’acte cultuel de brûler l’offrande; « le fera monter en fumée » est idiomatique dans ce contexte. « Un parfum agréable pour YHWH » est plus fluide que « d’une odeur agréable à YHWH » et conserve l’image olfactive.
  terminology: « Entrailles », « pattes », « autel » et « holocauste » conviennent. « Une offrande consumée par le feu » est un rendu recevable de אִשֶּׁה, mais la note actuelle introduit « un mets offert », formulation insuffisamment claire et qui ne correspond pas utilement à l’alternative lexicalement pertinente. La note doit signaler « une offrande par le feu » tout en indiquant avec prudence que l’étymologie précise est discutée. « YHWH » est une représentation cohérente du tétragramme.
  issues:
  - severity: medium
    issue: « le fera fumer » pour וְהִקְטִיר
    rationale: Cette expression est peu naturelle en français pour l’action sacrificielle et peut créer une image imprécise. « le fera monter en fumée » rend la nuance cultuelle du verbe sans la réduire à « brûler ».
  - severity: medium
    issue: 'Note a : « Ou “un mets offert” »'
    rationale: Cette alternative est obscure en français et ne présente pas l’alternative de traduction la plus pertinente. Pour אִשֶּׁה, « offrande par le feu » doit être donnée comme alternative traditionnelle; le lien étymologique exact avec le feu demeure discuté.
  - severity: low
    issue: « d’une odeur agréable à YHWH »
    rationale: La construction est compréhensible, mais « un parfum agréable pour YHWH » est plus idiomatique et reflète plus directement l’apposition hébraïque רֵיחַ נִיחֹחַ לַיהוָה.
  revised_text: Il lavera les entrailles et les pattes avec de l’eau, puis le prêtre présentera le tout et le fera monter en fumée sur l’autel. C’est un holocauste, une offrande consumée par le feu[a], un parfum agréable pour YHWH.
  revised_footnotes:
  - marker: a
    text: Ou « une offrande par le feu ». Le sens précis du terme hébreu est discuté; cette expression en est le rendu traditionnel.
    reason: lexical_alternative
  revision_rationale: La révision conserve toutes les distinctions du texte source et le choix de représenter le tétragramme par « YHWH ». Elle améliore la précision de l’action sacrificielle, la fluidité de la formule sur le parfum, et la pertinence de la note lexicale sans trancher au-delà de ce que permet le terme hébreu.
