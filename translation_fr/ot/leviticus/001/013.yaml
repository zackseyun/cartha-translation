revisions:
- from: Il lavera les entrailles et les pattes avec de l’eau, puis le prêtre présentera le tout et le fera fumer sur l’autel. C’est un holocauste, une offrande consumée par le feu[a], d’une odeur agréable à YHWH.
  to: Il lavera les entrailles et les pattes avec de l’eau, puis le prêtre présentera le tout et le fera monter en fumée sur l’autel. C’est un holocauste, une offrande consumée par le feu[a], un parfum agréable pour YHWH.
  rationale: La révision conserve toutes les distinctions du texte source et le choix de représenter le tétragramme par « YHWH ». Elle améliore la précision de l’action sacrificielle, la fluidité de la formule sur le parfum, et la pertinence de la note lexicale sans trancher au-delà de ce que permet le terme hébreu.
