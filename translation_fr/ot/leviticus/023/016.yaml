source:
  edition: WLC
  text: עַ֣ד מִֽ/מָּחֳרַ֤ת הַ/שַּׁבָּת֙ הַ/שְּׁבִיעִ֔ת תִּסְפְּר֖וּ חֲמִשִּׁ֣ים י֑וֹם וְ/הִקְרַבְתֶּ֛ם מִנְחָ֥ה חֲדָשָׁ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/016.yaml
  text: You shall count fifty days[a], up to the day after the seventh Sabbath; then you shall present a new grain offering to Yahweh.
translation:
  language: fr
  text: Vous compterez cinquante jours[a], jusqu’au lendemain du septième sabbat ; puis vous présenterez à Yahweh une nouvelle offrande de céréales.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’au lendemain de la septième semaine ». L’hébreu dit littéralement « le lendemain du septième sabbat » ; l’expression calendaire de ce décompte fait l’objet d’interprétations différentes.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַד מִמָּחֳרַת
  choice: jusqu’au lendemain
  rationale: Rend naturellement en français la limite temporelle introduite par עַד et le sens de מָחֳרָת, « lendemain ».
- source_word: הַשַּׁבָּת הַשְּׁבִיעִת
  choice: du septième sabbat
  rationale: Conserve le terme explicite שַׁבָּת et l’ordinal du texte hébreu, sans réduire l’ambiguïté calendaire à « septième semaine ».
- source_word: תִּסְפְּרוּ חֲמִשִּׁים יוֹם
  choice: Vous compterez cinquante jours
  rationale: Le futur français exprime avec naturel cette prescription légale adressée au pluriel ; « cinquante jours » reproduit clairement la durée indiquée.
- source_word: וְהִקְרַבְתֶּם
  choice: puis vous présenterez
  rationale: Dans le contexte sacrificiel, הקריב signifie faire approcher ou présenter une offrande. « Puis » explicite sobrement la succession marquée par וְ.
- source_word: מִנְחָה חֲדָשָׁה
  choice: une nouvelle offrande de céréales
  rationale: Dans la terminologie lévitique, מִנְחָה désigne couramment une offrande végétale, notamment céréalière ; חֲדָשָׁה est rendu directement par « nouvelle ».
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Rend la préposition ל par « à » dans ce contexte d’offrande et transcrit le nom divin יהוה selon la convention éditoriale fournie.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme ; « Yahweh » préserve ici le nom d’alliance conformément à la convention éditoriale indiquée.
- issue: Valeur calendaire de הַשַּׁבָּת הַשְּׁבִיעִת
  choice: le septième sabbat
  alternative: la septième semaine
  rationale: L’hébreu emploie explicitement שַׁבָּת. Le conserver évite de trancher silencieusement la question de son expression calendaire dans ce décompte festif.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur simple convient à la prescription juridique. « Offrande de céréales » est précis sans être excessivement technique ; la formulation conserve l’ambiguïté calendaire du texte source.
