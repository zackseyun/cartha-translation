source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֛ם שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּ֑את וּ/שְׁנֵ֧י כְבָשִׂ֛ים בְּנֵ֥י שָׁנָ֖ה לְ/זֶ֥בַח שְׁלָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/019.yaml
  text: And you shall offer one male goat for a sin offering[b][a], and two male lambs a year old for a sacrifice of peace offerings.
translation:
  language: fr
  text: Vous offrirez un bouc en sacrifice pour le péché[a], et deux agneaux d’un an en sacrifice de paix[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en sacrifice de purification ».
    reason: lexical_alternative
  - marker: b
    text: Ou « en sacrifice de communion ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: vous offrirez
  rationale: Le verbe signifie littéralement « faire », mais, dans ce contexte rituel où des animaux sont assignés à des catégories sacrificielles, « offrir » exprime naturellement l’action en français.
- source_word: שְׂעִיר עִזִּים אֶחָד
  choice: un bouc
  rationale: L’expression désigne un caprin mâle; « un bouc » rend à la fois l’espèce, le sexe et le nombre sans lourdeur.
- source_word: לְחַטָּאת
  choice: en sacrifice pour le péché
  rationale: Cette formulation conserve l’appellation traditionnelle et largement comprise de cette catégorie sacrificielle, sans exclure sa fonction purificatrice, signalée en note.
- source_word: וּשְׁנֵי כְבָשִׂים
  choice: et deux agneaux mâles
  rationale: Le nombre et la désignation des animaux sont rendus explicitement; « mâles » préserve la précision pertinente dans la législation sacrificielle.
- source_word: בְּנֵי שָׁנָה
  choice: d’un an
  rationale: L’expression hébraïque indique l’âge des animaux; « d’un an » est la formulation française naturelle et concise.
- source_word: לְזֶבַח שְׁלָמִים
  choice: en sacrifice de paix
  rationale: « Sacrifice de paix » reste proche du terme hébreu et de la catégorie cultuelle traditionnelle. Le singulier catégoriel est idiomatique en français bien que שְׁלָמִים ait une forme plurielle.
theological_decisions:
- issue: Sens cultuel de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le terme peut désigner l’offrande liée au péché tout en mettant en jeu une fonction de purification. Le texte principal garde l’expression traditionnelle, et la note préserve l’autre analyse sans trancher le débat.
- issue: Sens de שְׁלָמִים
  choice: sacrifice de paix
  alternative: sacrifice de communion
  rationale: « Paix » demeure proche du champ lexical hébreu et évite de réduire la catégorie à une seule interprétation de sa fonction; « communion », formulation courante mais plus interprétative, est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste concise et législative; les termes cultuels traditionnels sont conservés dans le texte, tandis que les principales possibilités lexicales sont données en notes.
