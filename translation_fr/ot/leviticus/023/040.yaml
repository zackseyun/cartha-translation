id: LEV.23.40
reference: Leviticus 23:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֨ם לָ/כֶ֜ם בַּ/יּ֣וֹם הָ/רִאשׁ֗וֹן פְּרִ֨י עֵ֤ץ הָדָר֙ כַּפֹּ֣ת תְּמָרִ֔ים וַ/עֲנַ֥ף עֵץ עָבֹ֖ת וְ/עַרְבֵי נָ֑חַל וּ/שְׂמַחְתֶּ֗ם לִ/פְנֵ֛י יְהוָ֥ה אֱלֹהֵי/כֶ֖ם שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/040.yaml
  text: And on the first day you shall take for yourselves the fruit of majestic trees[a], branches of palm trees, boughs of leafy trees, and willows of the brook, and you shall rejoice before Yahweh your God for seven days.
translation:
  language: fr
  text: Le premier jour, vous prendrez pour vous du fruit d’arbres magnifiques[a], des palmes, des rameaux d’arbres touffus et des saules de torrent, et vous vous réjouirez devant Yahweh votre Dieu pendant sept jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être, selon la tradition juive postérieure : « du cédrat » (étrog). L’hébreu dit littéralement : « du fruit d’arbres magnifiques » ou « splendides ».'
    reason: Préserver l’ambiguïté lexicale de l’hébreu tout en signalant l’identification rituelle traditionnelle.
lexical_decisions:
- source_word: וּלְקַחְתֶּם לָכֶם
  choice: vous prendrez pour vous
  rationale: Le parfait avec waw, dans ce contexte prescriptif, exprime une directive. « Pour vous » conserve explicitement לָכֶם.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: le premier jour
  rationale: Expression temporelle directe; le français n’exige pas ici de préposition, et le complément « de la fête » n’est pas ajouté puisqu’il n’est pas explicite dans ce verset.
- source_word: פְּרִי עֵץ הָדָר
  choice: du fruit d’arbres magnifiques
  rationale: הָדָר évoque la beauté, la splendeur ou la magnificence. Cette formulation garde le sens générique et l’ambiguïté du texte hébreu sans imposer l’identification traditionnelle au cédrat.
- source_word: כַּפֹּת תְּמָרִים
  choice: des palmes
  rationale: Le syntagme désigne les feuilles ou branches du palmier. « Palmes » est précis, naturel et concis en français.
- source_word: וַעֲנַף עֵץ עָבֹת
  choice: des rameaux d’arbres touffus
  rationale: עָבֹת indique l’épaisseur ou la densité, vraisemblablement celle du feuillage; « touffus » en transmet naturellement le sens.
- source_word: וְעַרְבֵי נָחַל
  choice: des saules de torrent
  rationale: עַרְבֵי désigne ici des saules ou arbres apparentés, tandis que נָחַל évoque un torrent, un cours d’eau ou un oued. La formulation reste proche de l’hébreu.
- source_word: וּשְׂמַחְתֶּם
  choice: vous vous réjouirez
  rationale: Rend directement le verbe « se réjouir, être dans la joie » tout en conservant la force prescriptive de la séquence.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: devant Yahweh votre Dieu
  rationale: « Devant » rend naturellement לִפְנֵי, et le nom divin יהוה est translittéré « Yahweh » conformément à la ligne éditoriale fournie.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: « Pendant » exprime clairement en français la durée indiquée par l’hébreu.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom d’alliance selon la convention éditoriale indiquée.
- issue: Identification de פְּרִי עֵץ הָדָר
  choice: formulation générique « du fruit d’arbres magnifiques »
  alternative: du cédrat; du fruit du cédratier
  rationale: L’identification au cédrat est bien attestée dans la tradition juive postérieure, mais elle est plus précise que la formulation hébraïque elle-même. Le texte principal conserve donc l’indétermination, avec une note signalant l’interprétation traditionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe prescriptive est conservée au futur, courant dans le style juridique biblique. Les termes botaniques restent compréhensibles sans surinterpréter les espèces visées.
