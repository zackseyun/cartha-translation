source:
  edition: WLC
  text: וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י י֤וֹם כִּפֻּרִים֙ ה֔וּא לְ/כַפֵּ֣ר עֲלֵי/כֶ֔ם לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/028.yaml
  text: You shall do no work on this very day[a], for it is a Day of Atonement, to make atonement for you before Yahweh your God.
translation:
  language: fr
  text: Vous ne ferez aucun travail en ce jour même, car c’est le jour des Expiations[a], afin que l’expiation soit faite pour vous devant Yahweh, votre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un jour d’expiations ». L’expression désigne la fête appelée « jour des Expiations ».'
    reason: Le pluriel hébreu et la forme littérale méritent d’être signalés tout en gardant dans le texte le nom français naturel de la fête.
lexical_decisions:
- source_word: וְכָל מְלָאכָה לֹא תַעֲשׂוּ
  choice: Vous ne ferez aucun travail
  rationale: מְלָאכָה désigne ici le travail interdit lors des sabbats et des fêtes. Le futur à valeur prescriptive rend naturellement l’instruction juridique en français moderne.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: en ce jour même
  rationale: L’expression idiomatique souligne qu’il s’agit précisément de ce jour-là; « ce jour même » en conserve l’emphase.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’interdiction et « car » maintient clairement ce lien explicatif.
- source_word: יוֹם כִּפֻּרִים
  choice: le jour des Expiations
  rationale: Le pluriel de כִּפֻּרִים est conservé dans l’appellation française naturelle de la fête. L’article défini permet de reconnaître le jour cultuel déjà identifié par le contexte.
- source_word: לְכַפֵּר עֲלֵיכֶם
  choice: afin de faire l’expiation pour vous
  rationale: Le piel de כפר a ici son sens cultuel. Cette formulation conserve la valeur de but de l’infinitif et ne précise pas artificiellement l’agent implicite.
- source_word: לִפְנֵי
  choice: devant
  rationale: Le terme exprime la présence cultuelle devant Dieu; « devant » en est l’équivalent français direct et naturel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Dans cette formule liée à Yahweh, le nom est singulier par le sens et le suffixe de deuxième personne du pluriel s’adresse collectivement au peuple.
theological_decisions:
- issue: Sens cultuel de כפר et כִּפֻּרִים
  choice: expiation / jour des Expiations
  alternative: purification / jour des Propitiations
  rationale: « Expiation » garde la portée cultuelle et réconciliatrice du terme sans imposer une théorie doctrinale particulière. Le pluriel du nom de la fête reste visible en français.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte source emploie le nom propre divin; sa translittération préserve cette donnée au lieu de la remplacer par un titre.
- issue: Agent de l’expiation dans לְכַפֵּר
  choice: 'infinitif sans agent explicite : « afin de faire l’expiation »'
  alternative: « afin que l’expiation soit faite »
  rationale: L’hébreu ne nomme pas ici l’agent de l’action. La formulation retenue conserve cette indétermination et la valeur finale de לְ.
translation_notes:
  register: Français international moderne, clair et digne. La formulation juridique reste ferme sans archaïsme; le vocabulaire cultuel est conservé parce qu’il est essentiel au sens du passage.
