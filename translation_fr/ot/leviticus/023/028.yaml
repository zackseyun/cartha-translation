    issue: L’agent de « faire l’expiation » peut être compris comme étant « vous ».
    rationale: Dans « Vous ne ferez aucun travail … afin de faire l’expiation pour vous », l’infinitif français est susceptible d’être rattaché au sujet « vous ». Le לְכַפֵּר hébreu exprime le but sans désigner ici l’agent. Une formulation passive préserve cette absence d’agent explicite.
