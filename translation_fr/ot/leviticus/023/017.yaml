  variant: modern international French
source:
  edition: WLC
  text: מִ/מּוֹשְׁבֹ֨תֵי/כֶ֜ם תָּבִ֣יאּוּ לֶ֣חֶם תְּנוּפָ֗ה שְׁ֚תַּיִם שְׁנֵ֣י עֶשְׂרֹנִ֔ים סֹ֣לֶת תִּהְיֶ֔ינָה חָמֵ֖ץ תֵּאָפֶ֑ינָה בִּכּוּרִ֖ים לַֽ/יהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/017.yaml
  text: From your dwellings you shall bring two loaves of bread for a wave offering[a]; they shall be of two-tenths of an ephah of fine flour, baked with leaven[b], as firstfruits to Yahweh.
translation:
  language: fr
  text: Vous apporterez de vos lieux d’habitation deux pains pour une offrande agitée. Ils seront faits de fleur de farine, à raison de deux dixièmes d’épha[a], et cuits avec du levain[b] ; ce seront des prémices pour Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « deux dixièmes » ; dans le système de mesures des textes sacerdotaux, il s’agit de deux dixièmes d’épha.
    reason: cultural_note
  - marker: b
    text: 'Autre traduction possible : « cuits comme des pains levés ». L’hébreu précise expressément que ces pains de prémices sont préparés avec du levain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמּוֹשְׁבֹתֵיכֶם
  choice: de vos lieux d’habitation
  rationale: מוֹשָׁב désigne un lieu où l’on habite ou une localité. Cette formulation naturelle conserve l’idée d’une provenance depuis les lieux habités du peuple.
- source_word: תָּבִיאוּ
  choice: vous apporterez
  rationale: Le hifil de בוא exprime ici une prescription cultuelle. Le futur français convient au style législatif sans alourdir la phrase.
- source_word: לֶחֶם תְּנוּפָה
  choice: deux pains destinés au geste de présentation
  rationale: לֶחֶם, bien que formellement singulier, est quantifié par « deux ». תְּנוּפָה désigne la présentation rituelle de l’offrande, probablement au moyen d’un mouvement cérémoniel ; « geste de présentation » reste intelligible sans imposer le mouvement précis que le terme ne décrit pas à lui seul.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: deux dixièmes d’épha
  rationale: עִשָּׂרוֹן est une mesure correspondant, dans les textes sacerdotaux, à un dixième d’épha. L’unité implicite est explicitée pour rendre la mesure compréhensible.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: Expression française usuelle pour une farine fine et soigneusement préparée, employée dans les offrandes céréalières.
- source_word: חָמֵץ תֵּאָפֶינָה
  choice: cuits avec du levain
  rationale: חָמֵץ indique que les pains sont levés ou fermentés, tandis que le nifal de אפה indique leur cuisson. La formulation est claire et naturelle en français.
- source_word: בִּכּוּרִים
  choice: des prémices
  rationale: Le terme désigne les premiers produits présentés à Dieu. Le prédicat « ce seront des prémices » rend leur fonction dans ce contexte.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל exprime ici la destination ou la consécration de l’offrande. Le nom divin יהוה est transcrit « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le Tétragramme. La transcription conserve le nom divin personnel sans le remplacer par un titre.
- issue: Sens cultuel de תְּנוּפָה
  choice: geste de présentation
  alternative: offrande balancée
  rationale: Le mot désigne une catégorie rituelle associée à un mouvement de présentation. La traduction choisie conserve la fonction cultuelle tout en évitant une expression française obscure ou une description excessivement précise du geste.
- issue: Répartition des deux dixièmes entre les deux pains
  choice: à raison de deux dixièmes d’épha, sans préciser « chacun »
  alternative: deux dixièmes d’épha chacun
  rationale: L’hébreu indique deux pains et deux dixièmes, mais ne comporte pas explicitement le distributif « chacun ». La traduction préserve cette formulation sans résoudre silencieusement la portée exacte de la mesure.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur prescriptif maintient le ton législatif. « Geste de présentation » rend le terme cultuel sans recourir au calque peu naturel « offrande balancée ». La syntaxe ne précise pas si les deux dixièmes s’appliquent à chaque pain ou à l’ensemble, conformément à la formulation hébraïque.
