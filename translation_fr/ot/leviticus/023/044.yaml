id: LEV.23.44
reference: Leviticus 23:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה אֶת מֹעֲדֵ֖י יְהוָ֑ה אֶל בְּנֵ֖י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/044.yaml
  text: So Moses declared the appointed times of Yahweh to the sons of Israel[a].
translation:
  language: fr
  text: Ainsi, Moïse annonça aux fils d’Israël[a] les temps fixés par Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux Israélites » ; traditionnellement, « aux enfants d’Israël ». L’hébreu dit littéralement « aux fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: annonça
  rationale: Dans cette phrase récapitulative qui clôt le calendrier sacré, le piel de דבר exprime la communication publique de ces prescriptions. « Annonça » convient naturellement avec un complément d’objet direct, sans surtraduire par « proclama ».
- source_word: מֹעֲדֵי
  choice: les temps fixés
  rationale: Le pluriel de מוֹעֵד désigne les temps déterminés du calendrier sacré. « Temps fixés » en préserve l’étendue, qui inclut notamment le sabbat, tandis que « fêtes » serait trop étroit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֶל
  choice: aux
  rationale: La préposition indique les destinataires auxquels Moïse communique les temps fixés.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: Cette formulation rend directement l’expression hébraïque. « Aux Israélites » serait plus idiomatique et peut exprimer la portée collective, mais effacerait la forme masculine explicite de l’original.
theological_decisions:
- issue: Rendu du nom d’alliance יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte directement le tétragramme. La translittération « Yahweh » préserve le nom propre sans le remplacer par un titre traditionnel.
translation_notes:
  register: Français international moderne, clair et digne. L’ordre des constituants a été légèrement adapté pour être naturel en français, tout en conservant le caractère récapitulatif de la phrase et la portée large de מֹעֵד.
