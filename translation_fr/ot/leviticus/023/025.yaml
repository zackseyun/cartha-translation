id: LEV.23.25
reference: Leviticus 23:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֖ה לַ/יהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/025.yaml
  text: You shall do no laborious work[a], and you shall present a food offering to Yahweh.
translation:
  language: fr
  text: Vous ne ferez aucun travail ordinaire, et vous présenterez à Yahvé une offrande par le feu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une offrande de nourriture »; on traduit aussi « une offrande faite par le feu ».
    reason: Le sens précis du terme cultuel אִשֶּׁה est discuté.
lexical_decisions:
- source_word: כָּל ... לֹא תַעֲשׂוּ
  choice: Vous ne ferez aucun
  rationale: La tournure négative française « ne… aucun » restitue naturellement la portée totale de l’interdiction hébraïque.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: travail astreignant
  rationale: L’expression désigne le travail ordinaire imposé par les activités de service ou de production, et non absolument toute action. « Astreignant » reste actuel et évite l’expression vieillie « travail servile ».
- source_word: וְהִקְרַבְתֶּם
  choice: et vous présenterez
  rationale: Dans un contexte sacrificiel, le hiphil de קרב signifie apporter ou présenter quelque chose comme offrande.
- source_word: אִשֶּׁה
  choice: une offrande consumée par le feu
  rationale: Cette formulation exprime la compréhension cultuelle traditionnelle du terme sans le limiter à une offrande végétale; l’autre analyse courante, « offrande de nourriture », est signalée en note.
- source_word: לַיהוָה
  choice: à Yahvé
  rationale: La forme française usuelle « Yahvé » représente directement le nom divin יהוה plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte explicitement le nom propre de l’alliance; sa transcription française préserve cette distinction.
- issue: Sens du terme cultuel אִשֶּׁה
  choice: offrande consumée par le feu
  alternative: offrande de nourriture
  rationale: L’étymologie et la portée exacte du terme sont discutées. Le texte principal retient la compréhension traditionnelle liée au feu, tandis que la note conserve l’autre lecture largement admise sans trancher silencieusement.
translation_notes:
  register: Français international moderne, au registre juridique et cultuel sobre. Le pluriel de l’adresse hébraïque est rendu par « vous ». « Travail astreignant » évite l’archaïsme de « travail servile » tout en ne transformant pas l’interdiction en défense absolue de toute activité.
