review_pass:
  verdict: revise
  source_fidelity: La prohibition totale est bien rendue par « Vous ne ferez aucun ». Toutefois, « travail astreignant » réduit מְלֶאכֶת עֲבֹדָה à l’idée d’effort physique ou de pénibilité, alors que l’expression vise le travail ordinaire/de service. « Offrande consumée par le feu » affirme en outre que l’offrande est entièrement brûlée, nuance que le terme אִשֶּׁה n’impose pas et qui ne convient pas à toutes les offrandes de cette catégorie.
  naturalness: « Vous ne ferez aucun travail ordinaire » est idiomatique en français moderne et conserve le registre normatif et cultuel sobre. « Offrande par le feu » est concis et usuel dans ce contexte; la note explicite l’autre analyse lexicale sans alourdir le texte.
  terminology: « Yahvé » restitue de façon cohérente le tétragramme. Le pluriel de l’adresse est conservé. Le rendu principal d’אִשֶּׁה comme « offrande par le feu » préserve mieux l’ambiguïté lexicale que « consumée par le feu »; « offrande de nourriture » demeure une alternative à signaler en note.
  issues:
  - severity: medium
    issue: « travail astreignant »
    rationale: Cette expression évoque un travail physiquement ou psychologiquement pénible. מְלֶאכֶת עֲבֹדָה désigne plutôt le travail ordinaire, de service ou professionnel; l’interdiction ne se limite donc pas aux tâches astreignantes.
  - severity: medium
    issue: « offrande consumée par le feu »
    rationale: Le terme אִשֶּׁה est traditionnellement associé au feu, mais il ne signifie pas nécessairement qu’une offrande entière est consumée. Cette formulation introduit ainsi une précision cultuelle non requise par le texte.
