revisions:
- from: Pendant sept jours, vous présenterez à Yahweh une offrande consumée par le feu. Le huitième jour, vous tiendrez une assemblée sainte et vous présenterez à Yahweh une offrande consumée par le feu. C’est une assemblée solennelle ; vous ne ferez aucun travail ordinaire.
  to: Pendant sept jours, vous présenterez à Yahweh une offrande par le feu. Le huitième jour, vous aurez une sainte convocation et vous présenterez à Yahweh une offrande par le feu. C’est une assemblée solennelle ; vous ne ferez aucun travail ordinaire.
  rationale: 'La révision retire l’affirmation non justifiée selon laquelle l’offrande serait entièrement consumée, tout en conservant la référence explicite au feu portée par le terme sacrificiel hébreu. Elle rend également plus directement la construction existentielle et normative « il y aura pour vous une sainte convocation ». Aucune note n’est indispensable : « offrande par le feu » est suffisamment transparent et ne tranche pas au-delà du texte.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:25:26Z'
review_pass:
  verdict: revise
  source_fidelity: 'La structure, la durée de sept jours, le huitième jour, la double prescription d’offrande, l’assemblée sacrée, l’assemblée solennelle et l’interdiction du travail ordinaire sont bien rendues. Toutefois, « consumée par le feu » affirme que l’offrande entière est brûlée/consumée, ce que אִשֶּׁה ne précise pas nécessairement : il s’agit de la catégorie d’offrande faite par le feu. « Vous tiendrez » est possible, mais « vous aurez » rend plus directement יִהְיֶה לָכֶם sans ajouter l’idée de présider ou de célébrer l’assemblée.'
  naturalness: Le français est globalement clair et d’un registre approprié. « Une offrande par le feu » est concis, compréhensible dans ce contexte cultuel et évite la sur-précision de « consumée ». « Vous aurez une sainte convocation » conserve la formulation institutionnelle du texte tout en restant intelligible en français moderne.
  terminology: « Yahweh », « sainte convocation », « assemblée solennelle » et « travail ordinaire » sont cohérents avec le texte hébreu et le registre législatif cultuel. La correction d’« offrande consumée par le feu » en « offrande par le feu » préserve la portée technique de אִשֶּׁה sans l’assimiler à un holocauste.
  issues:
  - severity: medium
    issue: « offrande consumée par le feu » surinterprète אִשֶּׁה.
    rationale: Le terme désigne une offrande sacrificielle faite par le feu ; il ne dit pas à lui seul que l’offrande entière est consumée. Certaines offrandes de cette catégorie ne sont pas entièrement brûlées.
  - severity: low
    issue: « vous tiendrez une assemblée sainte » est moins direct que le texte source.
    rationale: יִהְיֶה לָכֶם signifie littéralement qu’il y aura/pour vous une convocation sainte. « Vous aurez » conserve mieux cette construction sans changer le sens normatif.
  revised_text: Pendant sept jours, vous présenterez à Yahweh une offrande par le feu. Le huitième jour, vous aurez une sainte convocation et vous présenterez à Yahweh une offrande par le feu. C’est une assemblée solennelle ; vous ne ferez aucun travail ordinaire.
  revised_footnotes: []
  revision_rationale: 'La révision retire l’affirmation non justifiée selon laquelle l’offrande serait entièrement consumée, tout en conservant la référence explicite au feu portée par le terme sacrificiel hébreu. Elle rend également plus directement la construction existentielle et normative « il y aura pour vous une sainte convocation ». Aucune note n’est indispensable : « offrande par le feu » est suffisamment transparent et ne tranche pas au-delà du texte.'
