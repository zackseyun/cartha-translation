source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֔ים תַּקְרִ֥יבוּ אִשֶּׁ֖ה לַ/יהוָ֑ה בַּ/יּ֣וֹם הַ/שְּׁמִינִ֡י מִקְרָא קֹדֶשׁ֩ יִהְיֶ֨ה לָ/כֶ֜ם וְ/הִקְרַבְתֶּ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֲצֶ֣רֶת הִ֔וא כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/036.yaml
  text: For seven days you shall present a food offering to Yahweh. On the eighth day you shall have a holy convocation[a], and you shall present a food offering to Yahweh. It is a solemn assembly; you shall do no ordinary work.
translation:
  language: fr
  text: Pendant sept jours, vous présenterez à Yahweh une offrande par le feu. Le huitième jour, vous aurez une sainte convocation et vous présenterez à Yahweh une offrande par le feu. C’est une assemblée solennelle ; vous ne ferez aucun travail ordinaire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Pendant sept jours
  rationale: Exprime clairement la durée de l’obligation dans un français naturel.
- source_word: תַּקְרִיבוּ / וְהִקְרַבְתֶּם
  choice: vous présenterez
  rationale: Le hiphil de קרב a ici le sens cultuel de présenter ou d’offrir un sacrifice ; « présenter » reste précis et s’accorde naturellement avec le complément.
- source_word: אִשֶּׁה
  choice: une offrande consumée par le feu
  rationale: Ce terme sacrificiel désigne une offrande faite par le feu. Cette formulation française en conserve explicitement la dimension cultuelle sans la réduire à de la nourriture.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל indique la destination ou la dédicace de l’offrande, et le tétragramme est transcrit « Yahweh ».
- source_word: מִקְרָא קֹדֶשׁ
  choice: une assemblée sainte
  rationale: L’expression désigne un rassemblement sacré officiellement convoqué ; « assemblée sainte » est clair, digne et idiomatique.
- source_word: עֲצֶרֶת
  choice: une assemblée solennelle
  rationale: Le nom désigne une assemblée festive particulière, associée ici au jour conclusif et à la cessation du travail ; cette traduction préserve sa portée cultuelle sans surinterpréter l’étymologie.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: aucun travail ordinaire
  rationale: Dans la législation des fêtes, l’expression interdit le travail régulier ou professionnel, et non nécessairement toute activité sans distinction.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Le huitième jour
  rationale: Rendu temporel direct et naturel.
- source_word: יִהְיֶה לָכֶם
  choice: vous tiendrez
  rationale: Dans le contexte d’un מִקְרָא קֹדֶשׁ, cette formulation rend idiomatiquement l’obligation qu’une assemblée ait lieu pour la communauté.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme ; sa transcription préserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Portée de אִשֶּׁה
  choice: offrande consumée par le feu
  alternative: offrande alimentaire
  rationale: Le terme est une désignation sacrificielle liée au feu. Le rendu choisi conserve cette donnée explicite sans trancher davantage la nature précise de chaque offrande.
- issue: Sens de עֲצֶרֶת
  choice: assemblée solennelle
  alternative: assemblée de clôture
  rationale: Le contexte suggère une observance conclusive, mais le mot lui-même n’exprime pas sans ambiguïté toute cette précision ; le rendu retenu évite de l’ajouter au texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme des deux prescriptions sacrificielles est conservé, ainsi que la distinction entre « assemblée sainte » et « assemblée solennelle ». Aucun marqueur de note n’est requis puisqu’aucune note n’est ajoutée.
