base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/034.yaml
  text: 'Speak to the sons of Israel[a], saying: On the fifteenth day of this seventh month is the Feast of Booths for seven days to Yahweh.'
translation:
  language: fr
  text: '« Parle aux fils d’Israël et dis-leur : Le quinzième jour de ce septième mois, c’est la fête des Huttes[a] pour Yahweh, pendant sept jours. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nom traditionnel : « fête des Tabernacles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר
  choice: Parle aux fils d’Israël et dis-leur
  rationale: « Fils d’Israël » conserve l’expression collective et formulaire de l’hébreu. « Et dis-leur » rend naturellement en français la construction introductive לֵאמֹר sans l’alourdir par un littéral « en disant ».
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: Le quinzième jour de ce septième mois
  rationale: Cette formulation française courante conserve la date précise ainsi que le démonstratif « ce » présent dans le texte source.
- source_word: חַג הַסֻּכּוֹת
  choice: la fête des Huttes
  rationale: חַג désigne une fête religieuse, et סֻכּוֹת des abris temporaires ou huttes. « Huttes » est transparent pour le lecteur moderne, tandis que le nom traditionnel est signalé en note.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: La préposition « pendant » exprime clairement et naturellement en français la durée indiquée par l’hébreu.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל marque ici la destination ou la consécration de la fête. « Pour Yahweh » est idiomatique et conserve le nom divin.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Nom de la fête סֻכּוֹת
  choice: fête des Huttes
  alternative: fête des Tabernacles
  rationale: Le texte principal privilégie le sens concret du terme hébreu. L’appellation traditionnelle, familière à de nombreux lecteurs, est conservée en note.
- issue: Valeur de la proposition nominale חַג הַסֻּכּוֹת
  choice: ce sera la fête des Huttes
  alternative: c’est la fête des Huttes
  rationale: Dans cette prescription calendaire, le futur français situe naturellement la célébration au jour annoncé, sans ajouter de contenu théologique au texte hébreu dépourvu de verbe exprimé.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe impérative conserve le ton législatif du Lévitique, tandis que « et dis-leur » évite le tour peu naturel « en disant ». La note est placée après « Huttes », le terme auquel elle se rapporte.
