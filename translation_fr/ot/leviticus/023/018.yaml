  text: וְ/הִקְרַבְתֶּ֣ם עַל הַ/לֶּ֗חֶם שִׁבְעַ֨ת כְּבָשִׂ֤ים תְּמִימִם֙ בְּנֵ֣י שָׁנָ֔ה וּ/פַ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד וְ/אֵילִ֣ם שְׁנָ֑יִם יִהְי֤וּ עֹלָה֙ לַֽ/יהוָ֔ה וּ/מִנְחָתָ/ם֙ וְ/נִסְכֵּי/הֶ֔ם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/018.yaml
  text: And with the bread you shall present seven male lambs a year old[a], without blemish, and one bull from the herd, and two rams. They shall be a burnt offering to Yahweh, with their grain offering and their drink offerings, a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: fr
  text: 'Avec les pains[a], vous présenterez sept agneaux mâles d’un an, sans défaut, un taureau du gros bétail et deux béliers. Ils seront un holocauste pour Yahweh, avec leur offrande de céréales et leurs libations : un sacrifice offert par le feu[b], une odeur agréable à Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en plus des pains » ; la préposition hébraïque exprime ici l’accompagnement ou l’ajout, et non nécessairement une position au-dessus des pains.
    reason: lexical_alternative
  - marker: b
    text: Ou « une offrande alimentaire » ; le terme hébreu désigne une offrande faite par le feu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: vous présenterez
  rationale: Le hiphil de קרב désigne ici l’action cultuelle de présenter une offrande; « présenterez » est naturel et précis.
- source_word: עַל הַלֶּחֶם
  choice: avec les pains
  rationale: Dans cette formule, עַל exprime vraisemblablement l’accompagnement ou l’ajout plutôt qu’une position physique au-dessus des pains; le pluriel renvoie aux deux pains du verset précédent.
- source_word: שִׁבְעַת כְּבָשִׂים תְּמִימִם בְּנֵי שָׁנָה
  choice: sept agneaux mâles d’un an, sans défaut
  rationale: La formulation conserve le sexe, l’âge et l’exigence rituelle d’intégrité des animaux.
- source_word: וּפַר בֶּן בָּקָר אֶחָד
  choice: un taureau pris parmi le gros bétail
  rationale: פַר בֶּן־בָּקָר désigne un bovin mâle; cette expression reflète le lien explicite avec le bétail sans imposer une précision d’âge incertaine.
- source_word: וְאֵילִם שְׁנָיִם
  choice: et deux béliers
  rationale: אַיִל désigne précisément un bélier.
- source_word: יִהְיוּ עֹלָה
  choice: Ils constitueront un holocauste
  rationale: עֹלָה est le terme sacrificiel technique pour l’offrande entièrement brûlée; le singulier hébreu a ici une valeur collective.
- source_word: וּמִנְחָתָם וְנִסְכֵּיהֶם
  choice: avec l’offrande de céréales et les offrandes de vin qui les accompagnent
  rationale: מִנְחָה est l’offrande céréalière dans ce contexte, tandis que נֶסֶךְ est une offrande versée; le possessif pluriel est rendu par une relation explicite d’accompagnement. « Offrandes de vin » est contextuellement naturel pour les libations prescrites.
- source_word: אִשֵּׁה
  choice: un sacrifice consumé par le feu
  rationale: Le terme désigne une offrande faite par le feu. Cette traduction conserve l’élément explicite du feu sans introduire l’interprétation plus discutée d’« offrande alimentaire ».
- source_word: רֵיחַ נִיחֹחַ
  choice: d’une odeur agréable
  rationale: Expression cultuelle indiquant une odeur apaisante ou plaisante; « odeur agréable » reste claire et dignifiée.
- source_word: לַיהוָה
  choice: à Yahweh / pour Yahweh
  rationale: Le tétragramme est translittéré « Yahweh »; les prépositions françaises varient selon la syntaxe naturelle de chaque proposition.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: La translittération conserve le nom d’alliance présent dans le texte hébreu, sans le remplacer par un titre.
- issue: Sens de אִשֵּׁה
  choice: un sacrifice consumé par le feu
  alternative: une offrande alimentaire
  rationale: Le choix retient la référence au feu, lexicalement plus transparente, tout en signalant l’autre possibilité en note afin de ne pas masquer le débat lexical.
translation_notes:
  register: Français international moderne, clair et solennel. Le vocabulaire cultuel traditionnel compréhensible (« holocauste ») est conservé, tandis que les formulations opaques sont explicitées sans effacer les ambiguïtés lexicales.
