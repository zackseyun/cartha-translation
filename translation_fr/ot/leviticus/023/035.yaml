  yaml_path: translation/ot/leviticus/023/035.yaml
  text: On the first day there shall be a holy convocation[b][a]; you shall do no laborious work.
translation:
  language: fr
  text: Le premier jour, il y aura une assemblée sacrée[a] ; vous ne ferez aucun travail ordinaire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une convocation sainte ». L’expression hébraïque désigne une réunion sacrée officiellement convoquée.
    reason: lexical_alternative
  - marker: b
    text: Ou « aucun travail lié à votre activité ». L’expression hébraïque désigne le travail habituel accompli dans le cadre d’un service ou d’une occupation.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: Le premier jour
  rationale: La préposition בְּ introduit ici une indication temporelle; cette formulation est naturelle en français et rend fidèlement l’ordinal défini.
- source_word: מִקְרָא קֹדֶשׁ
  choice: vous tiendrez une assemblée sainte
  rationale: L’expression cultuelle désigne une réunion sacrée officiellement convoquée. La tournure verbale française exprime naturellement la proposition nominale hébraïque dans ce contexte prescriptif.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: aucun travail ordinaire
  rationale: La combinaison désigne le travail habituel lié à l’activité professionnelle ou au service, plutôt que toute forme d’action. « Travail ordinaire » évite le caractère archaïque et socialement trompeur de « travail servile ».
- source_word: לֹא תַעֲשׂוּ
  choice: vous ne ferez
  rationale: L’imparfait hébreu à valeur prescriptive est rendu par le futur normatif français, courant dans les textes législatifs.
