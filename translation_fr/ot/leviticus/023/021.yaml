id: LEV.23.21
reference: Leviticus 23:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/קְרָאתֶ֞ם בְּ/עֶ֣צֶם הַ/יּ֣וֹם הַ/זֶּ֗ה מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ חֻקַּ֥ת עוֹלָ֛ם בְּ/כָל מוֹשְׁבֹ֥תֵי/כֶ֖ם לְ/דֹרֹֽתֵי/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/021.yaml
  text: And on that very day you shall proclaim a holy convocation[a]; you shall do no laborious work[c][b]. It is a permanent statute throughout your dwellings for your generations.
translation:
  language: fr
  text: Ce jour-là même, vous proclamerez une sainte convocation[a]. Vous ne ferez aucun travail servile[b]. Ce sera une prescription permanente[c], partout où vous habiterez, de génération en génération.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une assemblée sainte » ou « une assemblée sacrée ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « aucun travail de service »; il s’agit du travail ordinaire accompli comme occupation ou service.'
    reason: lexical_alternative
  - marker: c
    text: Ou « une prescription perpétuelle » ou « une prescription pour toujours ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם
  choice: vous proclamerez
  rationale: Dans ce contexte cultuel, קרא exprime une proclamation officielle qui convoque la communauté, plutôt qu’un simple appel verbal.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ce jour-là même
  rationale: Cette tournure souligne qu’il s’agit précisément de ce jour; la formulation française conserve cette insistance temporelle.
- source_word: מִקְרָא קֹדֶשׁ
  choice: une sainte convocation
  rationale: Cette expression cultuelle désigne une assemblée sacrée officiellement convoquée. « Sainte convocation » en conserve la portée technique tout en restant intelligible.
- source_word: יִהְיֶה לָכֶם
  choice: intégré à « vous proclamerez une sainte convocation »
  rationale: La valeur prédicative est rendue naturellement en français sans ajouter la répétition peu fluide « elle sera pour vous ».
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: aucun travail servile
  rationale: La formule vise le travail ordinaire accompli comme occupation ou service, et non nécessairement toute activité sans distinction. Une note explicite ce sens.
- source_word: לֹא תַעֲשׂוּ
  choice: vous ne ferez aucun
  rationale: Cette formulation rend directement l’interdiction juridique et s’accorde naturellement avec le complément choisi.
- source_word: חֻקַּת עוֹלָם
  choice: une prescription permanente
  rationale: Dans cette formule juridique, עוֹלָם marque la permanence durable de la prescription au fil des générations, sans imposer une interprétation métaphysique du terme.
- source_word: בְּכָל מוֹשְׁבֹתֵיכֶם
  choice: partout où vous habiterez
  rationale: Cette formulation actuelle exprime clairement l’application de la prescription dans tous les lieux d’habitation d’Israël.
- source_word: לְדֹרֹתֵיכֶם
  choice: de génération en génération
  rationale: Cette expression idiomatique française rend l’application continue à travers les générations successives.
theological_decisions:
- issue: Portée de l’interdiction de travailler pendant la fête
  choice: aucun travail servile
  alternative: aucun travail; aucun travail ordinaire; aucun travail pénible
  rationale: La formule hébraïque כָּל מְלֶאכֶת עֲבֹדָה désigne couramment le travail ordinaire ou de service. La traduction évite donc d’élargir silencieusement l’interdiction à toute activité imaginable.
- issue: Portée temporelle de חֻקַּת עוֹלָם
  choice: une prescription permanente
  alternative: une prescription perpétuelle; une prescription pour toujours
  rationale: « Permanente » conserve la force durable de la formule légale, tout en laissant au contexte biblique le soin d’en préciser la portée théologique.
translation_notes:
  register: Français international moderne, clair et digne. Le futur conserve le ton prescriptif de la loi. « Sainte convocation » maintient le vocabulaire cultuel, tandis que « partout où vous habiterez » et « de génération en génération » donnent aux formules juridiques une expression naturelle.
