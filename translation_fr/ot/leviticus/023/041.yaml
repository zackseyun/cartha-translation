id: LEV.23.41
reference: Leviticus 23:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/חַגֹּתֶ֤ם אֹת/וֹ֙ חַ֣ג לַֽ/יהוָ֔ה שִׁבְעַ֥ת יָמִ֖ים בַּ/שָּׁנָ֑ה חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בַּ/חֹ֥דֶשׁ הַ/שְּׁבִיעִ֖י תָּחֹ֥גּוּ אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/041.yaml
  text: You shall celebrate it as a feast to Yahweh for seven days in the year[a]. It is a permanent statute throughout your generations[b]; in the seventh month you shall celebrate it.
translation:
  language: fr
  text: Vous la célébrerez comme une fête en l’honneur de Yahvé pendant sept jours chaque année. C’est une prescription permanente, de génération en génération[a]. Vous la célébrerez le septième mois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une prescription perpétuelle pour toutes vos générations ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחַגֹּתֶם / תָּחֹגּוּ
  choice: vous la célébrerez
  rationale: Le verbe חָגַג désigne la célébration d’une fête, souvent liée au pèlerinage. « Célébrer » est naturel en français moderne, et sa répétition conserve celle de l’hébreu.
- source_word: אֹתוֹ
  choice: la
  rationale: Le pronom masculin hébreu renvoie à חַג, mais le français reprend naturellement le nom féminin « fête » par « la ».
- source_word: חַג
  choice: une fête
  rationale: חַג désigne une fête cultuelle, souvent avec une dimension de pèlerinage. « Fête » est clair et usuel dans ce contexte.
- source_word: לַיהוָה
  choice: en l’honneur de Yahvé
  rationale: La préposition ל marque ici la destination ou la dédicace de la fête. « En l’honneur de » rend cette relation naturellement sans trancher artificiellement entre « à » et « pour ».
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: Cette formulation exprime clairement la durée indiquée par l’hébreu.
- source_word: בַּשָּׁנָה
  choice: chaque année
  rationale: Littéralement « dans l’année » ; dans ce contexte prescriptif, l’expression indique la périodicité annuelle.
- source_word: חֻקַּת עוֹלָם
  choice: une prescription permanente
  rationale: חֻקָּה est une règle prescrite, et עוֹלָם exprime ici sa validité durable. « Prescription permanente » conserve cette force sans imposer une affirmation philosophique d’intemporalité absolue.
- source_word: לְדֹרֹתֵיכֶם
  choice: de génération en génération
  rationale: Cette locution française naturelle exprime la continuité à travers les générations successives.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: le septième mois
  rationale: 'Après le verbe « célébrer », le complément temporel français se construit naturellement sans préposition : « le septième mois ».'
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur ; YHWH
  rationale: Le texte porte directement le tétragramme. « Yahvé » restitue en français courant le nom divin personnel plutôt que de le remplacer par un titre.
- issue: Portée de עוֹלָם dans une prescription cultuelle
  choice: permanente
  alternative: éternelle ; perpétuelle
  rationale: Le terme affirme la durée continue et stable de la prescription dans le cadre des générations d’Israël, sans obliger à préciser ici une durée métaphysiquement illimitée.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « célébrerez » reproduit l’insistance du texte hébreu. « En l’honneur de Yahvé » rend idiomatiquement la dédicace marquée par ל, tandis que « chaque année » explicite la valeur distributive contextuelle de בַּשָּׁנָה.
