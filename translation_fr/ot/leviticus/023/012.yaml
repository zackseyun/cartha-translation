source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֕ם בְּ/י֥וֹם הֲנִֽיפְ/כֶ֖ם אֶת הָ/עֹ֑מֶר כֶּ֣בֶשׂ תָּמִ֧ים בֶּן שְׁנָת֛/וֹ לְ/עֹלָ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/012.yaml
  text: On the day you wave the sheaf[a], you shall offer a male lamb without blemish, a year old, as a burnt offering to Yahweh.
translation:
  language: fr
  text: Le jour où vous agiterez la gerbe[a], vous offrirez à Yahweh un agneau mâle d’un an, sans défaut, en holocauste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’omer »; ici, le terme désigne probablement la gerbe présentée lors du rite plutôt qu’une simple mesure de capacité.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: vous offrirez
  rationale: Dans ce contexte sacrificiel, עשה signifie accomplir ou présenter le sacrifice; « offrir » exprime naturellement cette valeur cultuelle.
- source_word: בְּיוֹם
  choice: Le jour où
  rationale: Cette tournure française introduit naturellement le moment auquel l’offrande doit être faite.
- source_word: הֲנִיפְכֶם
  choice: vous balancerez
  rationale: Le hifil de נוף désigne le geste rituel consistant à balancer une offrande devant Yahweh; le verbe conserve cette image concrète.
- source_word: הָעֹמֶר
  choice: la gerbe
  rationale: Dans le contexte immédiat des prémices de la moisson, עֹמֶר désigne vraisemblablement la gerbe présentée rituellement, plutôt qu’une simple unité de capacité.
- source_word: כֶּבֶשׂ
  choice: un agneau mâle
  rationale: כֶּבֶשׂ désigne ici un jeune ovin mâle; préciser « mâle » conserve l’information pertinente à la prescription sacrificielle.
- source_word: תָּמִים
  choice: sans défaut
  rationale: Dans les lois sacrificielles, תמים qualifie un animal exempt de tare physique; « sans défaut » est clair et précis en français actuel.
- source_word: בֶּן שְׁנָתוֹ
  choice: d’un an
  rationale: Cette expression idiomatique hébraïque indique l’âge de l’animal; « d’un an » est la formulation française la plus naturelle.
- source_word: לְעֹלָה
  choice: en holocauste
  rationale: עֹלָה est le terme technique pour un sacrifice entièrement consumé; « holocauste » demeure le terme biblique français précis et reconnu.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition indique le destinataire de l’offrande, et le nom divin יהוה est rendu par sa forme personnelle « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Nature de עֹמֶר dans ce rite
  choice: la gerbe
  alternative: l’omer; la mesure
  rationale: Le contexte des prémices et l’action de balancer favorisent un objet concret présenté dans le rite, tout en maintenant l’autre possibilité dans une note.
translation_notes:
  register: Français international moderne, digne et accessible. L’ordre de la phrase place « à Yahweh, en holocauste » avant l’objet détaillé afin d’éviter une fin lourde, sans modifier les relations syntaxiques. Le verbe « balancer » maintient le geste rituel concret.
