source:
  edition: WLC
  text: וְ/כָל הַ/נֶּ֗פֶשׁ אֲשֶׁ֤ר תַּעֲשֶׂה֙ כָּל מְלָאכָ֔ה בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/הַֽאֲבַדְתִּ֛י אֶת הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/030.yaml
  text: And every person who does any work on this very day—I will destroy that person from among his people[a].
translation:
  language: fr
  text: Toute personne qui fera un travail quelconque en ce jour même, je ferai disparaître cette personne du milieu de son peuple[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « je retrancherai cette personne du milieu de son peuple » ou « je ferai périr cette personne ». Le verbe hébreu signifie littéralement « faire périr, détruire » ; ce n’est pas le verbe habituellement traduit par « retrancher ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: personne
  rationale: Dans ce contexte juridique, נֶפֶשׁ désigne l’individu tout entier, non une âme immatérielle. « Personne » convient naturellement aux deux occurrences.
- source_word: תַּעֲשֶׂה כָּל מְלָאכָה
  choice: fera un travail quelconque
  rationale: Avec מְלָאכָה, עשה signifie naturellement « faire »; « quelconque » conserve la portée exhaustive de כָּל.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: en ce jour même
  rationale: Cette tournure restitue l’insistance temporelle de l’expression hébraïque sans lourdeur.
- source_word: וְהַאֲבַדְתִּי
  choice: je la ferai disparaître
  rationale: Le hifil de אבד signifie « faire périr, détruire, faire disparaître ». La formulation retenue garde la valeur causative et s’accorde naturellement avec la suite « du milieu de son peuple ».
- source_word: מִקֶּרֶב עַמָּהּ
  choice: du milieu de son peuple
  rationale: La traduction suit de près l’image spatiale de l’hébreu et exprime le retrait de la communauté. Le possessif français ne marque pas ici le genre de la personne concernée.
theological_decisions:
- issue: Nature de la sanction exprimée par וְהַאֲבַדְתִּי ... מִקֶּרֶב עַמָּהּ
  choice: je la ferai disparaître du milieu de son peuple
  alternative: je retrancherai cette personne du milieu de son peuple; je ferai périr cette personne au milieu de son peuple
  rationale: 'Le texte emploie le hifil de אבד, et non le verbe כרת habituellement rendu par « retrancher ». La traduction principale évite donc d’introduire comme terme technique un verbe absent de l’hébreu, tout en préservant l’idée d’une suppression opérée par Dieu. Une note signale les deux nuances possibles : exclusion de la communauté ou destruction.'
translation_notes:
  register: Français international moderne, digne et accessible. Le futur « fera » correspond à la formulation juridique hébraïque. La reprise pronominale « je la ferai disparaître » est naturelle en français et renvoie sans ambiguïté à « toute personne ».
