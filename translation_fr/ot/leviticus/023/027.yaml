    issue: « Vous vous imposerez des privations » est plus interprétatif que l’hébreu.
    rationale: L’idiome ordonne de s’affliger/s’humilier soi-même sans spécifier la forme des privations. Le terme retenu dans le texte principal doit préserver cette ouverture; « privations » convient mieux comme possibilité en note.
  - severity: low
