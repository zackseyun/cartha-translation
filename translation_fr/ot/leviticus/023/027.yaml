- from: Toutefois, le dixième jour de ce septième mois sera le jour des Expiations[a]. Ce sera pour vous une assemblée sainte. Vous vous imposerez des privations[b] et vous présenterez à Yahvé une offrande consumée par le feu[c].
  to: Toutefois, le dixième jour de ce septième mois sera le jour des Expiations[a]. Ce sera pour vous une assemblée sainte. Vous vous affligerez[b] et vous présenterez à Yahvé une offrande faite par le feu[c].
  rationale: La révision réduit les interprétations ajoutées dans le texte principal tout en conservant les explications utiles en notes. Elle maintient le pluriel de « Expiations », conformément à la forme hébraïque et au choix éditorial attesté, sans imposer une lecture doctrinale.
