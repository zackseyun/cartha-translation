  text: אַ֡ךְ בֶּ/עָשׂ֣וֹר לַ/חֹדֶשׁ֩ הַ/שְּׁבִיעִ֨י הַ/זֶּ֜ה י֧וֹם הַ/כִּפֻּרִ֣ים ה֗וּא מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/027.yaml
  text: But on the tenth day of this seventh month[a], it is the Day of Atonement. It shall be a holy convocation for you[c][b], and you shall afflict yourselves and present a food offering to Yahweh.
translation:
  language: fr
  text: Toutefois, le dixième jour de ce septième mois sera le jour des Expiations[a]. Ce sera pour vous une assemblée sainte. Vous vous affligerez[b] et vous présenterez à Yahvé une offrande faite par le feu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « le jour de l’Expiation ». L’hébreu porte littéralement le pluriel : « le jour des Expiations ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « vous vous humilierez » ou « vous vous imposerez des privations ». L’expression désigne une affliction ou un renoncement personnel sans préciser ici qu’il s’agit uniquement du jeûne.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « une offrande par le feu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Toutefois
  rationale: La particule marque ici une transition restrictive et emphatique par rapport aux prescriptions précédentes; « toutefois » la rend naturellement sans la surcharger.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: le dixième jour de ce septième mois
  rationale: Le français explicite naturellement « jour », sous-entendu dans l’expression temporelle hébraïque, tout en conservant le démonstratif « ce ».
- source_word: יוֹם הַכִּפֻּרִים
  choice: le jour des Expiations
  rationale: Le pluriel français reflète la forme plurielle כִּפֻּרִים; la majuscule signale le nom de la fête.
- source_word: מִקְרָא קֹדֶשׁ
  choice: une assemblée sainte
  rationale: L’expression désigne un rassemblement sacré officiellement convoqué. « Assemblée sainte » est clair, digne et naturel en français moderne.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: vous vous imposerez des privations
  rationale: L’idiome exprime une mortification ou un renoncement personnel. Cette formulation rend la portée concrète du commandement sans la limiter explicitement au jeûne.
- source_word: וְהִקְרַבְתֶּם
  choice: vous présenterez
  rationale: À la forme causative et en contexte sacrificiel, le verbe signifie apporter ou présenter quelque chose comme offrande.
- source_word: אִשֶּׁה
  choice: une offrande consumée par le feu
  rationale: Le terme cultuel désigne une offrande livrée au feu et transformée en fumée; cette traduction reste compréhensible sans imposer l’interprétation plus spécifique de « nourriture offerte ».
- source_word: לַיהוָה
  choice: à Yahvé
  rationale: La forme française « Yahvé » représente directement le nom divin יהוה plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Titre traditionnel de la fête et pluriel hébreu
  choice: le jour des Expiations
  alternative: le jour de l’Expiation
  rationale: Le texte hébreu emploie le pluriel כִּפֻּרִים. Le texte principal le conserve, tandis que la note donne le titre français traditionnel au singulier.
- issue: Sens de l’affliction de soi
  choice: vous vous imposerez des privations
  alternative: vous vous humilierez / vous vous affligerez
  rationale: L’expression ne doit être ni réduite au seul jeûne ni ramenée à une attitude purement intérieure. La formulation retenue préserve l’idée générale de renoncement corporel et personnel.
- issue: Nature de אִשֶּׁה
  choice: une offrande consumée par le feu
  alternative: un mets offert / une offrande faite par le feu
  rationale: Le mot appartient au vocabulaire sacrificiel et évoque une offrande remise au feu. La traduction évite d’affirmer plus précisément que le terme signifie en lui-même « nourriture ».
translation_notes:
  register: Français international moderne, clair et digne. Le tour reste formel en raison du contexte législatif et cultuel, mais évite les archaïsmes. Les termes techniques sont rendus de façon intelligible, avec les ambiguïtés lexicales importantes conservées en notes.
