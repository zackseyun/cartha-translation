    rationale: Le mot désigne une offrande relevant du feu sacrificiel, mais sa formulation française ne doit pas nécessairement affirmer que l’offrande entière est consumée. La formulation traditionnelle « offrande faite par le feu » est plus prudente.
  - severity: low
