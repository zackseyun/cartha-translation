source:
  edition: WLC
  text: וְ/לֶחֶם֩ וְ/קָלִ֨י וְ/כַרְמֶ֜ל לֹ֣א תֹֽאכְל֗וּ עַד עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה עַ֚ד הֲבִ֣יאֲ/כֶ֔ם אֶת קָרְבַּ֖ן אֱלֹהֵי/כֶ֑ם חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בְּ/כֹ֖ל מֹשְׁבֹֽתֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/014.yaml
  text: And you shall not eat bread or roasted grain or fresh grain until this very day[a], until you have brought the offering of your God[c][b]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: fr
  text: Vous ne mangerez ni pain, ni grain grillé, ni grain frais[a] jusqu’à ce jour même, jusqu’à ce que vous ayez apporté l’offrande de votre Dieu. C’est une prescription permanente[b], de génération en génération, partout où vous habiterez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « grain nouveau ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « prescription perpétuelle » ou « règle valable pour toujours ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: pain
  rationale: Le sens concret de « pain » convient à cette liste de produits céréaliers et évite le terme plus général « nourriture ».
- source_word: קָלִי
  choice: grain grillé
  rationale: Le mot désigne du grain préparé par l’action du feu. « Grain grillé » est précis et naturel en français moderne.
- source_word: כַרְמֶל
  choice: grain frais
  rationale: Dans cette série, le terme désigne vraisemblablement du grain récemment mûri ou des épis frais, et non le nom de lieu Carmel. Une note conserve l’autre formulation possible, « grain nouveau ».
- source_word: לֹא תֹאכְלוּ
  choice: vous ne mangerez
  rationale: Le futur français employé dans une prescription rend naturellement la valeur prohibitive de l’imparfait hébreu nié.
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour même
  rationale: « Même » restitue l’insistance portée par עֶצֶם sur le jour précis.
- source_word: עַד הֲבִיאֲכֶם
  choice: jusqu’à ce que vous ayez apporté
  rationale: Le subjonctif passé exprime clairement l’accomplissement préalable de l’action qui met fin à l’interdiction.
- source_word: קָרְבַּן אֱלֹהֵיכֶם
  choice: l’offrande de votre Dieu
  rationale: « Offrande » garde la portée générale de קָרְבָּן sans préciser indûment la catégorie du sacrifice.
- source_word: חֻקַּת עוֹלָם
  choice: une prescription permanente
  rationale: Cette formulation française actuelle conserve la force juridique et durable de l’expression sans adopter un registre archaïque.
- source_word: לְדֹרֹתֵיכֶם
  choice: de génération en génération
  rationale: Cette tournure idiomatique exprime clairement la continuité au fil des générations.
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: partout où vous habiterez
  rationale: Cette traduction naturelle rend l’ensemble des lieux où les destinataires résideront, sans suggérer uniquement des établissements organisés.
theological_decisions:
- issue: Portée de חֻקַּת עוֹלָם dans la loi mosaïque
  choice: prescription permanente
  alternative: prescription perpétuelle / règle valable pour toujours
  rationale: La traduction maintient la force durable de l’obligation dans son cadre légal et alliance sans trancher les débats théologiques ultérieurs sur l’application des prescriptions cérémonielles mosaïques.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur de prescription maintient le ton juridique; « partout où vous habiterez » privilégie une expression courante sans perdre la portée générale de l’hébreu.
