  text: אֵ֚לֶּה מוֹעֲדֵ֣י יְהוָ֔ה מִקְרָאֵ֖י קֹ֑דֶשׁ אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם בְּ/מוֹעֲדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/004.yaml
  text: These are the appointed times of Yahweh[a], holy convocations[b], which you shall proclaim at their appointed times.
translation:
  language: fr
  text: Voici les temps fixés[a] par Yahweh, les convocations saintes[b] que vous proclamerez aux temps qui leur sont fixés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les fêtes fixées » ou « les moments déterminés ». Le terme hébreu est plus large que « fêtes » et désigne des temps établis par Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Ou « les assemblées sacrées ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Voici
  rationale: Le démonstratif pluriel introduit la liste qui suit; « Voici » est naturel en français et fournit implicitement la copule absente en hébreu.
- source_word: מוֹעֲדֵי
  choice: les temps fixés
  rationale: מוֹעֵד désigne un moment ou un rendez-vous déterminé. Dans ce chapitre, le terme est plus large que « fêtes » et garde ici sa valeur temporelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin יהוה; sa translittération préserve le nom propre plutôt que de lui substituer un titre.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: les convocations saintes
  rationale: La tournure exprime des rassemblements officiellement convoqués et consacrés; « convocations saintes » conserve à la fois l'idée d'appel public et celle de sainteté.
- source_word: תִּקְרְאוּ
  choice: vous proclamerez
  rationale: Dans ce contexte, קרא signifie annoncer publiquement ces observances, et non simplement les nommer.
- source_word: בְּמוֹעֲדָם
  choice: au moment fixé pour chacune
  rationale: L'expression indique que chaque observance doit être proclamée à l'occasion qui lui est assignée. Cette formulation française rend clairement le suffixe pluriel tout en conservant l'écho de מוֹעֵד.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » maintient le nom personnel présent dans la source, sans remplacer celui-ci par un titre.
- issue: Rapport entre les « temps fixés » et les « convocations saintes »
  choice: Apposition maintenue
  alternative: interpréter les convocations comme une catégorie distincte
  rationale: La syntaxe présente les deux expressions en apposition. La traduction conserve ce rapport sans préciser davantage si elles sont strictement coextensives.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La répétition du vocabulaire de מוֹעֵד est conservée par « temps fixés » puis « moment fixé », tandis que « pour chacune » évite une formulation française ambiguë ou maladroite.
