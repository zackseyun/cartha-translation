source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר בַּ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י בְּ/אֶחָ֣ד לַ/חֹ֗דֶשׁ יִהְיֶ֤ה לָ/כֶם֙ שַׁבָּת֔וֹן זִכְר֥וֹן תְּרוּעָ֖ה מִקְרָא קֹֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/024.yaml
  text: 'Speak to the sons of Israel[a], saying: In the seventh month, on the first day of the month, there shall be for you a solemn rest, a memorial of trumpet blasts, a holy convocation.'
translation:
  language: fr
  text: 'Parle aux fils d’Israël et dis-leur : Le premier jour du septième mois, vous observerez un repos solennel, un mémorial, avec des acclamations retentissantes[a], une convocation sainte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec des sonneries retentissantes ». Le terme hébreu peut désigner plus généralement un puissant signal sonore, notamment une acclamation, un cri ou une sonnerie de cor ou de trompette.
    reason: alternative lexicale
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Reproduit l’expression familiale masculine de l’hébreu, employée collectivement pour la communauté d’Israël.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי בְּאֶחָד לַחֹדֶשׁ
  choice: Le premier jour du septième mois
  rationale: Rend naturellement en français l’indication calendaire hébraïque, littéralement « dans le septième mois, au premier du mois ».
- source_word: יִהְיֶה לָכֶם שַׁבָּתוֹן
  choice: vous observerez un repos solennel
  rationale: Expression française claire qui conserve l’idée d’une cessation spécialement prescrite, sans identifier automatiquement שַׁבָּתוֹן au sabbat hebdomadaire.
- source_word: זִכְרוֹן
  choice: une commémoration
  rationale: Désigne ici une observance servant de rappel ou de mémorial; « commémoration » convient au contexte cultuel.
- source_word: תְּרוּעָה
  choice: une sonnerie éclatante
  rationale: Préserve l’idée générale d’un signal sonore puissant sans préciser indûment l’instrument, que l’hébreu ne nomme pas dans ce verset.
- source_word: מִקְרָא קֹדֶשׁ
  choice: une convocation sainte
  rationale: Rend formellement l’expression cultuelle désignant un rassemblement officiellement convoqué et consacré.
theological_decisions:
- issue: Nature de תְּרוּעָה dans la désignation de la fête
  choice: sonnerie éclatante
  alternative: acclamation, cri retentissant ou sonnerie de cor/trompette
  rationale: Le terme hébreu peut désigner divers sons élevés, notamment un cri ou une sonnerie de signal. Le contexte liturgique favorise une sonnerie, mais l’absence d’un nom d’instrument invite à conserver l’ambiguïté dans une note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de la structure législative hébraïque tout en évitant un calque lourd de יִהְיֶה לָכֶם. « Convocation sainte » maintient le registre cultuel et favorise la cohérence dans les textes calendaires de la Torah.
