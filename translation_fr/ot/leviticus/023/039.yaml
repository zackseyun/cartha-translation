source:
  edition: WLC
  text: אַ֡ךְ בַּ/חֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בְּ/אָסְפְּ/כֶם֙ אֶת תְּבוּאַ֣ת הָ/אָ֔רֶץ תָּחֹ֥גּוּ אֶת חַג יְהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הָֽ/רִאשׁוֹן֙ שַׁבָּת֔וֹן וּ/בַ/יּ֥וֹם הַ/שְּׁמִינִ֖י שַׁבָּתֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/039.yaml
  text: However[a], on the fifteenth day of the seventh month, when you have gathered in the produce of the land, you shall celebrate the feast of Yahweh for seven days. On the first day there shall be a solemn rest[b], and on the eighth day a solemn rest.
translation:
  language: fr
  text: Toutefois, le quinzième jour du septième mois, lorsque vous aurez rentré la récolte du pays, vous célébrerez la fête[a] de Yahweh pendant sept jours. Le premier jour sera un repos solennel[b], et le huitième jour, un repos solennel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la fête de pèlerinage de Yahweh ». Le mot hébreu désigne une célébration festive, souvent associée à un pèlerinage.
    reason: lexical_alternative
  - marker: b
    text: Ou « un repos sabbatique ». Le terme hébreu désigne un temps particulier de cessation lié à une observance sacrée.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Toutefois
  rationale: La particule marque ici une transition assortie d’une nuance restrictive ou corrective par rapport aux prescriptions précédentes. « Toutefois » conserve cette articulation sans réduire le terme à une simple emphase.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: le quinzième jour du septième mois
  rationale: Formulation calendaire naturelle en français, qui conserve avec précision la date hébraïque.
- source_word: בְּאָסְפְּכֶם אֶת תְּבוּאַת הָאָרֶץ
  choice: lorsque vous aurez rentré la récolte du pays
  rationale: L’infinitif précédé de בְּ exprime la circonstance temporelle. « Aurez rentré » rend l’achèvement de l’engrangement, tandis que « récolte » couvre ici l’ensemble des produits recueillis sans limiter le sens aux seules céréales.
- source_word: תָּחֹגּוּ אֶת חַג יְהוָה
  choice: vous célébrerez la fête de Yahweh
  rationale: Le verbe חגג désigne la célébration d’une fête, souvent avec une dimension de pèlerinage. La formulation française est actuelle et conserve le nom divin personnel.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: « Pendant » exprime naturellement en français la durée de la célébration.
- source_word: שַׁבָּתוֹן
  choice: un repos solennel
  rationale: Le terme désigne une cessation sacrée liée à l’observance festive. Cette traduction évite de l’identifier sans nuance au sabbat hebdomadaire tout en gardant son caractère religieux.
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: et le huitième jour
  rationale: La formulation garde explicitement la distinction entre les sept jours de fête et le repos prescrit au huitième jour.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu porte directement le tétragramme. « Yahweh » conserve le nom personnel sans lui substituer un titre.
- issue: Sens de שַׁבָּתוֹן dans une prescription festive
  choice: un repos solennel
  alternative: un repos sabbatique ; un repos complet ; un jour de repos
  rationale: Le mot indique une cessation sacrée, mais le rendre simplement par « sabbat » risquerait de l’assimiler au sabbat hebdomadaire. « Repos solennel » préserve à la fois l’idée de repos et le cadre cultuel.
- issue: Rapport entre les sept jours de fête et le huitième jour
  choice: Maintenir sans harmonisation la mention d’un repos au huitième jour
  alternative: Présenter le huitième jour comme faisant partie des sept jours
  rationale: Le texte juxtapose une célébration de sept jours et une prescription pour le huitième. La traduction conserve cette tension chronologique au lieu de l’expliquer ou de la résoudre.
translation_notes:
  register: Français international moderne, clair et digne. « Rentrer la récolte » est idiomatique dans le contexte agricole. La répétition finale de « repos solennel » est conservée pour refléter l’insistance et la structure de l’hébreu.
