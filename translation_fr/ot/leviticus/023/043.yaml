language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְמַעַן֮ יֵדְע֣וּ דֹרֹֽתֵי/כֶם֒ כִּ֣י בַ/סֻּכּ֗וֹת הוֹשַׁ֨בְתִּי֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/הוֹצִיאִ֥/י אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/043.yaml
  text: so that your generations may know that I made the sons of Israel dwell in booths when I brought them out of the land of Egypt[b][a]. I am Yahweh your God.
translation:
  language: fr
  text: afin que vos générations sachent que j’ai fait habiter les Israélites[b] dans des huttes[a] lorsque je les ai fait sortir du pays d’Égypte. Je suis Yahweh, votre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des abris ». Le terme hébreu soukkot désigne des huttes ou abris temporaires.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les fils d’Israël », expression qui désigne ici le peuple d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן יֵדְעוּ
  choice: afin que … sachent
  rationale: La tournure exprime clairement le but visé, tout en restant naturelle et digne en français moderne.
- source_word: דֹרֹתֵיכֶם
  choice: vos générations
  rationale: Ce choix formel conserve la portée multigénérationnelle et collective du terme hébreu, sans le réduire aux seuls descendants biologiques.
- source_word: בַסֻּכּוֹת
  choice: dans des huttes
  rationale: Le nom סֻכּוֹת désigne des constructions temporaires faites pour servir d’abri. « Huttes » maintient aussi le lien lexical avec la fête évoquée dans le contexte.
- source_word: הוֹשַׁבְתִּי
  choice: j’ai fait habiter
  rationale: La formulation conserve la valeur causative du hifil de ישׁב, plutôt que de l’aplatir en « j’ai installé ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: C’est l’équivalent collectif courant et exact en français moderne; le sens littéral est signalé en note.
- source_word: בְּהוֹצִיאִי
  choice: lorsque je les ai fait sortir
  rationale: L’infinitif construit précédé de בְּ exprime ici la circonstance temporelle; cette tournure française en restitue naturellement le sens.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: du pays d’Égypte
  rationale: La traduction conserve le nom explicite אֶרֶץ, tout en employant la formulation française usuelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération représente le nom divin présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Cette traduction directe préserve la formule d’alliance et le pluriel possessif adressé à la communauté.
theological_decisions:
- issue: Représentation du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Rendu collectif de בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël
  rationale: L’expression désigne collectivement le peuple d’Israël. Le français idiomatique « les Israélites » rend cette portée sans introduire une restriction masculine absente de la fonction collective; la forme littérale demeure indiquée en note.
- issue: Nature des סֻכּוֹת
  choice: des huttes
  alternative: des abris
  rationale: Le terme peut désigner des abris temporaires sans préciser davantage leur forme ou leur matériau. « Huttes » conserve le lien avec la fête du contexte, tandis que la note maintient l’autre possibilité lexicale.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsmes. La syntaxe reste proche de l’hébreu là où elle demeure intelligible, notamment dans « vos générations » et « j’ai fait habiter ». Les marqueurs de notes sont placés immédiatement après les termes concernés.
