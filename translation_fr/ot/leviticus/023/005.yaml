  text: בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בְּ/אַרְבָּעָ֥ה עָשָׂ֛ר לַ/חֹ֖דֶשׁ בֵּ֣ין הָ/עַרְבָּ֑יִם פֶּ֖סַח לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/005.yaml
  text: In the first month[a], on the fourteenth day of the month, at twilight[b], is the Passover to Yahweh.
translation:
  language: fr
  text: Le premier mois, le quatorzième jour du mois, au crépuscule[a], c’est la Pâque[b] pour Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « entre les soirs », expression hébraïque désignant la période du crépuscule autour du coucher du soleil.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’offrande de la Pâque » ou « le sacrifice pascal ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: Le premier mois
  rationale: Dans ce contexte calendaire, חֹדֶשׁ désigne le mois, et הָרִאשׁוֹן indique le premier mois de l’année cultuelle.
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ
  choice: le quatorzième jour du mois
  rationale: L’ajout de « jour » explicite naturellement en français la formule hébraïque de datation sans en modifier la précision.
- source_word: בֵּין הָעַרְבָּיִם
  choice: au crépuscule
  rationale: Cette expression idiomatique, littéralement « entre les soirs », désigne la période crépusculaire autour du coucher du soleil. La traduction naturelle figure dans le texte et la forme littérale en note.
- source_word: פֶּסַח
  choice: la Pâque
  rationale: Le terme peut désigner la célébration pascale ou l’offrande sacrificielle qui lui est associée. « La Pâque » maintient le sens large dans ce calendrier des fêtes, tandis que la nuance sacrificielle est signalée en note.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל marque ici la destination, la consécration ou l’appartenance. « Pour Yahweh » conserve cette relation sans transformer le nom divin en titre.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » rend le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Portée cultuelle de פֶּסַח
  choice: la Pâque
  alternative: l’offrande de la Pâque ; le sacrifice pascal
  rationale: Le mot hébreu peut viser la célébration, le rite ou la victime sacrificielle. Le texte principal garde cette amplitude et la note préserve explicitement la lecture sacrificielle.
- issue: Relation exprimée par לַיהוָה
  choice: pour Yahweh
  alternative: de Yahweh ; en l’honneur de Yahweh
  rationale: « Pour » exprime sobrement la destination cultuelle indiquée par ל, sans décider si פֶּסַח désigne principalement la fête ou l’offrande.
translation_notes:
  register: Français international moderne, simple et digne. La phrase nominale hébraïque est rendue par « c’est », tournure naturelle qui n’ajoute aucune obligation rituelle absente du verset. Les marqueurs de notes sont placés sur les expressions auxquelles ils se rapportent.
