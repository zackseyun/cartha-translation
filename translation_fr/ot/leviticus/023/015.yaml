source:
  edition: WLC
  text: וּ/סְפַרְתֶּ֤ם לָ/כֶם֙ מִ/מָּחֳרַ֣ת הַ/שַּׁבָּ֔ת מִ/יּוֹם֙ הֲבִ֣יאֲ/כֶ֔ם אֶת עֹ֖מֶר הַ/תְּנוּפָ֑ה שֶׁ֥בַע שַׁבָּת֖וֹת תְּמִימֹ֥ת תִּהְיֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/015.yaml
  text: 'And you shall count for yourselves from the day after the Sabbath[a], from the day you bring the sheaf of the wave offering: seven complete Sabbaths shall there be.'
translation:
  language: fr
  text: 'Vous compterez pour vous-mêmes, à partir du lendemain du sabbat, à partir du jour où vous apporterez la gerbe de l’offrande agitée : il y aura sept sabbats complets[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sept semaines complètes ». L’hébreu dit littéralement « sept sabbats complets ».
    reason: 'Alternative lexicale et calendaire : « semaines » exprime l’interprétation courante des sept périodes complètes, tandis que le texte principal conserve le terme hébreu littéral.'
lexical_decisions:
- source_word: וּסְפַרְתֶּם
  choice: Vous compterez
  rationale: Le parfait qal précédé de la conjonction a ici une valeur directive dans un contexte légal. Le futur français exprime naturellement cette prescription.
- source_word: לָכֶם
  choice: pour vous-mêmes
  rationale: Cette formulation conserve la nuance personnelle et quasi réflexive du pronom datif, sans la réduire à un simple complément indirect.
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: à partir du lendemain du sabbat
  rationale: מָחֳרַת désigne le jour suivant. « À partir de » marque clairement le point de départ du décompte, tandis que « sabbat » maintient le terme cultuel précis.
- source_word: מִיּוֹם הֲבִיאֲכֶם
  choice: à partir du jour où vous apporterez
  rationale: La tournure française rend clairement le second repère initial et conserve la relation temporelle du texte hébreu.
- source_word: עֹמֶר
  choice: la gerbe
  rationale: Dans ce contexte, עֹמֶר désigne l’objet végétal apporté lors du rite plutôt qu’une simple unité de mesure. « Gerbe » est concret et immédiatement compréhensible.
- source_word: הַתְּנוּפָה
  choice: présentée rituellement
  rationale: תְּנוּפָה désigne une présentation cultuelle impliquant un geste rituel. Cette formulation française naturelle conserve la fonction rituelle sans imposer l’image potentiellement trompeuse d’une offrande « agitée » ou « balancée ».
- source_word: שֶׁבַע שַׁבָּתוֹת
  choice: sept sabbats
  rationale: L’hébreu emploie explicitement le pluriel de שַׁבָּת. Le texte principal garde donc « sabbats » au lieu de résoudre l’expression en « semaines ».
- source_word: תְּמִימֹת
  choice: complets
  rationale: Dans un décompte temporel, תָּמִים exprime l’intégralité des périodes, non une perfection morale ou rituelle.
- source_word: תִּהְיֶינָה
  choice: il y aura
  rationale: La construction existentielle française reflète naturellement la forme verbale hébraïque et convient à l’énoncé du total à compter.
theological_decisions:
- issue: Sens calendaire de שַׁבָּת et שַׁבָּתוֹת
  choice: Conserver « sabbat » et « sabbats » dans le texte principal.
  alternative: Traduire par « semaine » et « semaines » afin d’expliciter les périodes de sept jours comptées.
  rationale: Le texte hébreu utilise expressément le terme du sabbat. Le conserver évite de trancher silencieusement les débats anciens sur le point de départ du décompte et sur l’éventuel emploi idiomatique du pluriel au sens de « semaines ». La note signale l’autre traduction courante.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « à partir de » suit le double מִן hébreu et souligne les deux formulations du même point de départ. « Présentée rituellement » privilégie une expression naturelle tout en gardant la spécificité cultuelle de תְּנוּפָה.
