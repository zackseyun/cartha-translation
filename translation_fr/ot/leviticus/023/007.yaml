  text: בַּ/יּוֹם֙ הָֽ/רִאשׁ֔וֹן מִקְרָא קֹ֖דֶשׁ יִהְיֶ֣ה לָ/כֶ֑ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/007.yaml
  text: On the first day there shall be a holy convocation for you[b][a]; you shall do no laborious work.
translation:
  language: fr
  text: Le premier jour, vous aurez une convocation sainte[a] ; vous ne ferez aucun travail ordinaire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une assemblée sacrée » ou « une assemblée sainte ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « travail de service » ; il s’agit du travail ordinaire. Traduction traditionnelle : « aucun ouvrage servile ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: Le premier jour
  rationale: La préposition בְּ avec « jour » et l’adjectif ordinal a ici une valeur temporelle. Cette formulation est naturelle en français et conserve exactement le repère donné.
- source_word: מִקְרָא קֹדֶשׁ
  choice: une convocation sainte
  rationale: Dans ce contexte cultuel, מִקְרָא peut désigner une convocation ou l’assemblée ainsi convoquée, tandis que קֹדֶשׁ la qualifie de sainte. « Convocation sainte » maintient la nuance d’appel officiel sans exclure le sens d’assemblée.
- source_word: יִהְיֶה לָכֶם
  choice: vous aurez
  rationale: Cette tournure française naturelle exprime ce qui devra avoir lieu pour la communauté, sans alourdir la phrase par un calque de « il y aura pour vous ».
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: aucun travail ordinaire
  rationale: Sous la négation, כָּל a une portée totale rendue par « aucun ». L’expression מְלֶאכֶת עֲבֹדָה vise le travail courant lié au service ou à l’activité habituelle, plutôt que toute action concevable.
- source_word: לֹא תַעֲשׂוּ
  choice: vous ne ferez
  rationale: L’inaccompli avec לֹא formule ici une interdiction juridique. Le futur français conserve le registre législatif du passage.
theological_decisions:
- issue: Étendue de l’interdiction exprimée par מְלֶאכֶת עֲבֹדָה
  choice: L’interdiction porte sur le travail ordinaire, lié aux activités habituelles de service ou de métier.
  alternative: L’interdiction porterait indistinctement sur toute forme d’activité.
  rationale: La formulation qualifiée מְלֶאכֶת עֲבֹדָה est plus précise qu’une interdiction absolue de toute action. La traduction garde cette nuance sans définir davantage les exceptions que le verset lui-même.
translation_notes:
  register: Français international moderne, clair et digne. « Convocation sainte » conserve le registre cultuel de Lévitique, tandis que la note explicite l’autre compréhension possible. Le futur maintient la tonalité juridique.
