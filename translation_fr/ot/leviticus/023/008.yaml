  text: וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֛ה לַ/יהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הַ/שְּׁבִיעִי֙ מִקְרָא קֹ֔דֶשׁ כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/008.yaml
  text: And you shall present a food offering to Yahweh for seven days[a]. On the seventh day there shall be a holy convocation; you shall do no laborious work.
translation:
  language: fr
  text: Pendant sept jours, vous présenterez à Yahweh une offrande par le feu[a]. Le septième jour, il y aura une assemblée sainte ; vous ne ferez aucun travail ordinaire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Terme sacrificiel désignant une offrande associée au feu de l’autel.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: vous présenterez
  rationale: Le hiphil de קרב, dans un contexte sacrificiel, signifie présenter ou apporter une offrande. « Présenterez » est naturel et conserve le geste cultuel.
- source_word: אִשֶּׁה
  choice: une offrande consumée par le feu
  rationale: Le terme sacerdotal désigne une offrande destinée au feu de l’autel. Cette formulation française exprime clairement cette idée sans supposer qu’il s’agit nécessairement d’une offrande alimentaire.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל marque ici la destination ou la dédicace de l’offrande ; « à Yahweh » en conserve le sens direct.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: La locution indique la durée durant laquelle les offrandes doivent être présentées.
- source_word: מִקְרָא קֹדֶשׁ
  choice: une assemblée sainte
  rationale: L’expression désigne un rassemblement sacré officiellement convoqué. « Assemblée sainte » est clair, digne et courant en français moderne.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: aucun travail ordinaire
  rationale: L’expression vise le travail habituel lié à l’activité professionnelle ou au service, et non toute action sans exception. « Travail ordinaire » évite l’archaïsme de « travail servile ».
- source_word: לֹא תַעֲשׂוּ
  choice: vous ne ferez aucun
  rationale: Cette tournure française rend directement et naturellement l’interdiction plurielle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre substitutif.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte hébreu porte le nom divin ; « Yahweh » le représente directement sans lui substituer un titre.
- issue: Portée de l’interdiction de travail
  choice: aucun travail ordinaire
  alternative: aucun travail pénible / aucun travail servile
  rationale: מְלֶאכֶת עֲבֹדָה désigne le travail courant de service ou d’occupation. La traduction évite d’étendre l’interdiction à toute activité imaginable.
translation_notes:
  register: Français international moderne, au registre digne et accessible. Le futur normatif rend l’instruction légale ; le point-virgule maintient le lien étroit entre la convocation du septième jour et l’interdiction de travailler.
