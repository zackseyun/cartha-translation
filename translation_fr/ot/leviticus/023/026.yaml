lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר avec waw consécutif introduit ici une nouvelle parole divine. « Parla » convient à cette formule solennelle et se distingue de l’introduction du contenu qui suit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de préserver le nom divin plutôt que de lui substituer un titre.
- source_word: אֶל־מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל désigne le destinataire de la parole; « à Moïse » est la formulation naturelle en français moderne.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Dans cette formule d’introduction, l’infinitif « pour dire » annonce le contenu de la parole. « En ces termes » restitue naturellement cette fonction en français sans calquer lourdement l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom personnel et rend sa forme hébraïque probable, tandis que « le Seigneur » constitue une substitution traditionnelle et « Jéhovah » une autre forme historique.
translation_notes:
  register: Français international moderne, digne et fluide. La tournure « en ces termes » conserve la fonction formulaire de לֵאמֹר tout en évitant le calque « disant ».
