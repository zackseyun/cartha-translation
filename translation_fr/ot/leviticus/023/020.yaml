  text: וְ/הֵנִ֣יף הַ/כֹּהֵ֣ן אֹתָ֡/ם עַל֩ לֶ֨חֶם הַ/בִּכּוּרִ֤ים תְּנוּפָה֙ לִ/פְנֵ֣י יְהוָ֔ה עַל שְׁנֵ֖י כְּבָשִׂ֑ים קֹ֛דֶשׁ יִהְי֥וּ לַ/יהוָ֖ה לַ/כֹּהֵֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/020.yaml
  text: The priest shall wave them with the bread of the firstfruits as a wave offering before Yahweh[a], with the two lambs. They shall be holy to Yahweh for the priest.
translation:
  language: fr
  text: Le prêtre les présentera avec le pain des prémices, comme offrande présentée par un geste rituel devant Yahweh[a], avec les deux agneaux. Ils seront consacrés à Yahweh et réservés au prêtre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait traduire plus littéralement : « au-dessus du pain des prémices » et « au-dessus des deux agneaux ». La préposition hébraïque peut avoir ce sens spatial, mais elle indique probablement ici que tous ces éléments sont associés dans la même présentation rituelle.'
    reason: Alternative lexicale et préservation d’une ambiguïté du texte hébreu.
lexical_decisions:
- source_word: וְהֵנִיף
  choice: présentera
  rationale: Dans le contexte sacrificiel, le hifil de נוּף désigne le geste rituel par lequel une offrande est présentée devant Dieu. « Présentera » est naturel en français moderne, tandis que la nature rituelle du geste est explicitée par la suite de la phrase.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom objet masculin pluriel renvoie aux éléments prescrits dans le contexte précédent. Le pronom français conserve cette référence anaphorique sans la préciser davantage que l’hébreu.
- source_word: עַל לֶחֶם הַבִּכּוּרִים
  choice: avec le pain des prémices
  rationale: עַל peut avoir un sens spatial (« sur », « au-dessus de »), mais il exprime vraisemblablement ici l’association des éléments dans une même présentation rituelle. « Avec » évite d’imposer une disposition matérielle incertaine.
- source_word: תְּנוּפָה
  choice: en offrande rituelle
  rationale: תְּנוּפָה est un terme cultuel désignant une offrande présentée par un geste rituel, traditionnellement compris comme un balancement ou une élévation. Cette formulation reste claire pour le lecteur moderne sans donner au geste une forme plus précise que ne l’exige le verset.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: L’expression désigne une action cultuelle accomplie en présence de Dieu. Le nom divin יהוה est transcrit « Yahweh ».
- source_word: עַל שְׁנֵי כְּבָשִׂים
  choice: avec les deux agneaux
  rationale: Comme dans la première occurrence de עַל, « avec » exprime ici l’association dans la présentation rituelle, tout en évitant d’affirmer que les objets étaient physiquement placés sur les agneaux.
- source_word: קֹדֶשׁ יִהְיוּ
  choice: Ils seront consacrés
  rationale: La construction indique que ces éléments auront un statut saint. « Consacrés » exprime naturellement en français leur mise à part dans le domaine sacré.
- source_word: לַיהוָה לַכֹּהֵן
  choice: à Yahweh et réservés au prêtre
  rationale: La formulation distingue la consécration à Yahweh de la part attribuée au prêtre. « Réservés » rend l’idée de destination ou de droit sacerdotal sans suggérer que leur caractère sacré est annulé.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. Sa transcription préserve ici le nom personnel d’alliance plutôt que de le remplacer par un titre.
- issue: Rapport entre la consécration à Yahweh et l’attribution au prêtre
  choice: consacrés à Yahweh et réservés au prêtre
  alternative: saints pour Yahweh, pour le prêtre
  rationale: 'Les deux compléments en לְ sont conservés dans leur tension : les offrandes sont saintes en relation avec Yahweh tout en étant attribuées au prêtre. La formulation française clarifie ce double rapport sans opposer consécration divine et droit sacerdotal.'
translation_notes:
  register: Français international moderne, digne et accessible. « Offrande rituelle » évite le calque peu naturel « offrande balancée », tandis que la note signale l’ambiguïté spatiale de עַל. La syntaxe conserve le pronom non explicité du texte source.
