id: LEV.23.29
reference: Leviticus 23:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י כָל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁ֣ר לֹֽא תְעֻנֶּ֔ה בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/נִכְרְתָ֖ה מֵֽ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/029.yaml
  text: For every person who does not humble himself on this very day shall be cut off from his people[a].
translation:
  language: fr
  text: Car toute personne qui ne s’humiliera pas en ce jour même sera retranchée de son peuple[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne s’imposera pas de privations ». L’expression hébraïque évoque l’humiliation de soi ou le renoncement à soi, traditionnellement associé au jeûne.'
    reason: Variante lexicale conservant la portée concrète possible de l’expression hébraïque.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la justification de l’ordre précédent et convient au mouvement explicatif du texte législatif.
- source_word: כָל הַנֶּפֶשׁ
  choice: toute personne
  rationale: נֶפֶשׁ désigne ici l’individu, non une « âme » conçue comme une partie immatérielle distincte.
- source_word: אֲשֶׁר לֹא תְעֻנֶּה
  choice: qui ne s’humiliera pas
  rationale: Dans le contexte du jour des Expiations, la forme de ענה exprime l’humiliation volontaire ou le renoncement à soi, traditionnellement associé au jeûne. Cette formulation naturelle conserve la dimension pénitentielle sans réduire l’expression à une pratique précise.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: en ce jour même
  rationale: L’expression avec עֶצֶם renforce la désignation temporelle; « ce jour même » en restitue l’insistance.
- source_word: וְנִכְרְתָה
  choice: sera retranchée
  rationale: « Être retranché » conserve la formule juridique et théologique de כרת sans préciser indûment si la sanction consiste en la mort, l’exclusion ou un jugement divin.
- source_word: מֵעַמֶּיהָ
  choice: de son peuple
  rationale: Le suffixe féminin s’accorde grammaticalement avec נֶפֶשׁ; en français, « son peuple » renvoie naturellement à « toute personne ».
theological_decisions:
- issue: Sens de l’ordre de s’humilier au jour des Expiations
  choice: s’humiliera
  alternative: s’imposera des privations; s’affligera
  rationale: Le contexte associe cette expression à une attitude pénitentielle qui se manifeste notamment par le jeûne et le renoncement. « S’humilier » en communique la portée sans limiter le commandement à une souffrance physique; l’autre possibilité est signalée en note.
- issue: Nature de la peine exprimée par כרת
  choice: sera retranchée de son peuple
  alternative: sera exclue de son peuple; sera supprimée du milieu de son peuple
  rationale: Le verset ne précise pas le mécanisme de la sanction. La formule traditionnelle préserve cette indétermination et sa gravité juridique.
translation_notes:
  register: Français international moderne, clair et digne. Le futur convient à la formulation de la sanction légale. « Retranchée » s’accorde avec « personne » tout en conservant la formule biblique sans en expliciter excessivement la nature.
