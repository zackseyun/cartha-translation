source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם מוֹעֲדֵ֣י יְהוָ֔ה אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם מִקְרָאֵ֣י קֹ֑דֶשׁ אֵ֥לֶּה הֵ֖ם מוֹעֲדָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/002.yaml
  text: 'Speak to the sons of Israel and say to them: The appointed times of Yahweh[c][b][a], which you shall proclaim as holy convocations—these are my appointed times.'
translation:
  language: fr
  text: 'Parle aux fils d’Israël et dis-leur : Les temps fixés par Yahweh[a], que vous proclamerez comme des saintes convocations[b], ce sont mes temps fixés[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh est le nom personnel du Dieu d’Israël dans le texte hébreu.
    reason: divine_name
  - marker: b
    text: Ou « assemblées saintes ».
    reason: lexical_alternative
  - marker: c
    text: Ou « fêtes fixées » ou « fêtes » ; le terme hébreu désigne plus largement des occasions sacrées déterminées, et non seulement des repas de fête.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Parle
  rationale: L’impératif intensif commande à Moïse de s’adresser directement au peuple; « Parle » convient au registre juridique et solennel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Rend littéralement l’expression hébraïque conventionnelle, qui désigne collectivement le peuple d’Israël.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: et dis-leur
  rationale: Préserve l’enchaînement formel des deux verbes de parole.
- source_word: מוֹעֲדֵי / מוֹעֲדָי
  choice: les temps fixés / mes temps fixés
  rationale: מוֹעֵד désigne ici des occasions sacrées déterminées; l’expression reste assez large pour inclure le sabbat, et le suffixe possessif final est explicitement rendu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֲשֶׁר תִּקְרְאוּ אֹתָם
  choice: que vous proclamerez
  rationale: קרא exprime ici l’annonce publique de ces temps sacrés.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: de saintes convocations
  rationale: « Convocations » conserve l’idée de rassemblements officiellement convoqués, tandis que « saintes » rend leur caractère consacré.
- source_word: אֵלֶּה הֵם
  choice: ce sont
  rationale: Restitue naturellement en français la construction hébraïque emphatique d’identification.
theological_decisions:
- issue: Rendu du nom d’alliance יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte emploie un nom propre; sa transcription préserve cette fonction sans substituer un titre traditionnel.
- issue: Étendue du terme מוֹעֵד
  choice: temps fixés
  alternative: fêtes / festivals
  rationale: Le chapitre inclut aussi le sabbat; un terme temporel large évite de limiter indûment le sens aux célébrations festives.
- issue: Expression בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / les enfants d’Israël
  rationale: Le choix conserve la forme masculine de l’expression hébraïque tout en laissant intacte sa portée collective conventionnelle.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe suit l’ordre du texte hébreu sans lourdeur excessive. « Saintes convocations » garde la précision cultuelle; « temps fixés » maintient la portée générale du terme hébreu.
