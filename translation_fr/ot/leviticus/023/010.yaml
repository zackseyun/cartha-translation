source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּֽי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר אֲנִי֙ נֹתֵ֣ן לָ/כֶ֔ם וּ/קְצַרְתֶּ֖ם אֶת קְצִירָ֑/הּ וַ/הֲבֵאתֶ֥ם אֶת עֹ֛מֶר רֵאשִׁ֥ית קְצִירְ/כֶ֖ם אֶל הַ/כֹּהֵֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/010.yaml
  text: 'Speak to the sons of Israel and say to them: When you come into the land that I am giving to you[a], and reap its harvest[b], then you shall bring the sheaf of the firstfruits of your harvest to the priest.'
translation:
  language: fr
  text: '« Parle aux Israélites[a] et dis-leur : Quand vous entrerez dans le pays que je vous donne et que vous en moissonnerez la récolte, vous apporterez au prêtre la gerbe[b] des prémices de votre récolte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’omer ». Le terme hébreu peut désigner ici une gerbe; il est aussi employé comme terme technique et comme nom d’une mesure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette formulation française naturelle désigne fidèlement l’ensemble du peuple auquel s’adresse la prescription; la tournure hébraïque littérale est signalée en note.
- source_word: כִּי תָבֹאוּ
  choice: Quand vous entrerez
  rationale: כִּי introduit ici la circonstance future dans laquelle la prescription s’appliquera, sans exprimer une simple hypothèse.
- source_word: הָאָרֶץ אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: le pays que je vous donne
  rationale: « Pays » est naturel en français pour le territoire promis, tandis que le présent « je vous donne » conserve la valeur actuelle ou imminente du participe hébreu.
- source_word: וּקְצַרְתֶּם אֶת קְצִירָהּ
  choice: et que vous en moissonnerez la récolte
  rationale: Le verbe « moissonner » et le nom « récolte » rendent le jeu étymologique hébreu sans produire en français la lourdeur de « moissonner sa moisson »; « en » renvoie au pays.
- source_word: וַהֲבֵאתֶם
  choice: vous apporterez
  rationale: Le futur français exprime naturellement l’instruction qui découle de la circonstance précédente; l’enchaînement suffit sans ajouter explicitement « alors ».
- source_word: עֹמֶר
  choice: la gerbe
  rationale: Dans ce contexte agricole et rituel, « gerbe » rend concrètement ce qui est apporté au prêtre, tout en conservant en note la possibilité du terme technique « omer ».
- source_word: רֵאשִׁית קְצִירְכֶם
  choice: des prémices de votre récolte
  rationale: « Prémices » exprime à la fois la première part de la récolte et sa fonction cultuelle.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Équivalent français courant du titre cultuel כֹּהֵן.
theological_decisions:
- issue: Forme genrée de l’adresse à Israël
  choice: les Israélites
  alternative: les fils d’Israël
  rationale: L’expression hébraïque est littéralement masculine, mais fonctionne comme le nom collectif conventionnel du peuple. « Les Israélites » est une désignation française exacte et naturelle; la forme littérale est conservée en note afin de ne pas masquer la formulation de la source.
- issue: Sens cultuel de עֹמֶר
  choice: la gerbe
  alternative: l’omer
  rationale: Le contexte décrit un produit de la moisson apporté au prêtre, ce qui favorise le sens concret « gerbe ». Puisque עֹמֶר peut aussi être conservé comme terme technique et désigner ailleurs une mesure, l’ambiguïté est explicitée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure législative du verset tout en évitant les calques peu naturels. Les deux notes sont placées exactement sur les expressions qu’elles éclairent.
