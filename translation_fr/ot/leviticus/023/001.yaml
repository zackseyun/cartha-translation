lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol de דבר fait progresser le récit et introduit une déclaration divine. « Parla » restitue naturellement cette formule narrative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre afin de préserver le nom divin présent dans le texte hébreu.
- source_word: אֶל־מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל désigne ici le destinataire de la parole; « à Moïse » est l’expression française naturelle.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'Dans cette formule d’introduction au discours, l’infinitif לֵאמֹר annonce les paroles qui suivent. « En ces termes : » est idiomatique en français et évite le calque lourd « en disant ».'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » en préserve la fonction de nom propre, tandis que « le SEIGNEUR » relève de la tradition de substitution.
translation_notes:
  register: Français moderne, digne et naturel. La formule hébraïque est conservée dans sa fonction d’introduction au discours, mais rendue idiomatiquement plutôt que mot à mot.
