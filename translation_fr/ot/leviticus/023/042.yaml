id: LEV.23.42
reference: Leviticus 23:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בַּ/סֻּכֹּ֥ת תֵּשְׁב֖וּ שִׁבְעַ֣ת יָמִ֑ים כָּל הָֽ/אֶזְרָח֙ בְּ/יִשְׂרָאֵ֔ל יֵשְׁב֖וּ בַּ/סֻּכֹּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/042.yaml
  text: You shall dwell in booths for seven days[a]; every native-born person in Israel shall dwell in booths.
translation:
  language: fr
  text: Vous habiterez dans des huttes pendant sept jours[a] ; toute personne israélite de naissance habitera dans des huttes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans des abris », ou « dans des abris temporaires » ; le mot hébreu désigne les abris provisoires construits pour la fête.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּסֻּכֹּת
  choice: dans des huttes
  rationale: Le nom סֻכּוֹת désigne ici les constructions temporaires utilisées pendant la fête. « Huttes » conserve l’image concrète et correspond au nom traditionnel de la fête, tandis qu’une note précise le caractère temporaire de ces abris.
- source_word: תֵּשְׁבוּ / יֵשְׁבוּ
  choice: habiterez / habitera
  rationale: Dans ce contexte de résidence, ישׁב signifie « habiter » plutôt que simplement « s’asseoir ». La répétition du même verbe français reflète celle de l’hébreu.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: « Pendant » exprime naturellement en français la durée indiquée par l’accusatif temporel hébreu.
- source_word: כָּל הָאֶזְרָח
  choice: toute personne israélite de naissance
  rationale: אֶזְרָח désigne un membre autochtone ou de naissance de la communauté, par contraste avec l’étranger résident. Cette formulation évite le sens politique moderne de « citoyen » et rend explicite la portée générique du masculin hébreu.
- source_word: בְּיִשְׂרָאֵל
  choice: israélite
  rationale: Dans cette construction, l’expression situe la personne au sein d’Israël, compris comme communauté. L’adjectif « israélite » l’exprime naturellement sans suggérer seulement un lieu géographique moderne.
theological_decisions:
- issue: Portée du masculin singulier הָאֶזְרָח
  choice: toute personne israélite de naissance
  alternative: tout Israélite de naissance
  rationale: Le masculin singulier hébreu a ici une valeur représentative et ne limite pas explicitement le commandement aux hommes. « Toute personne » en préserve la portée sans ajouter une restriction sexuelle.
translation_notes:
  register: Français moderne, digne et direct. Le futur à valeur impérative rend la prescription hébraïque. Le point-virgule conserve le parallélisme et la reprise emphatique de la seconde proposition.
