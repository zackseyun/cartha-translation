  text: וּ/מִנְחָת/וֹ֩ שְׁנֵ֨י עֶשְׂרֹנִ֜ים סֹ֣לֶת בְּלוּלָ֥ה בַ/שֶּׁ֛מֶן אִשֶּׁ֥ה לַ/יהוָ֖ה רֵ֣יחַ נִיחֹ֑חַ וְ/נִסְכֹּ֥/ה יַ֖יִן רְבִיעִ֥ת הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/013.yaml
  text: Its grain offering shall be two-tenths of an ephah of fine flour mixed with oil[a], a food offering to Yahweh, a pleasing aroma; and its drink offering shall be wine, a fourth of a hin.
translation:
  language: fr
  text: Son offrande de céréales sera de deux dixièmes d’épha de fleur de farine mélangée à de l’huile, une offrande par le feu pour Yahweh[a], au parfum agréable ; et sa libation sera d’un quart de hin de vin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une offrande alimentaire pour Yahweh ».'
    reason: Le terme hébreu אִשֶּׁה est un terme cultuel dont le sens précis est discuté. « Offrande par le feu » est une traduction traditionnelle; l’alternative alimentaire est également attestée.
lexical_decisions:
- source_word: וּמִנְחָתוֹ
  choice: L’offrande de céréales qui l’accompagnera
  rationale: Dans ce contexte sacrificiel, מִנְחָה désigne une offrande de céréales. Le suffixe masculin singulier renvoie à l’agneau du verset précédent ; « qui l’accompagnera » rend ce lien clairement en français.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: deux dixièmes d’épha
  rationale: L’expression signifie littéralement « deux dixièmes » ; dans la législation sacerdotale, l’unité sous-entendue est l’épha. La formulation conserve la mesure ancienne tout en explicitant l’unité.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: Expression française courante et précise pour la farine fine et raffinée destinée aux offrandes.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: mélangée à de l’huile
  rationale: Le participe passif indique que la farine est mêlée à l’huile. « Mélangée » est naturel en français moderne sans préciser un procédé non exprimé.
- source_word: אִשֶּׁה לַיהוָה
  choice: une offrande consumée pour Yahweh
  rationale: אִשֶּׁה est un terme cultuel désignant une offrande présentée par le feu. « Offrande consumée » garde cette dimension sans imposer l’interprétation plus incertaine de « nourriture offerte ».
- source_word: רֵיחַ נִיחֹחַ
  choice: dont l’odeur est agréable
  rationale: Cette formule sacrificielle exprime l’agrément de l’offrande devant Dieu tout en conservant l’image concrète de l’odeur.
- source_word: וְנִסְכֹּה
  choice: La libation qui l’accompagnera
  rationale: נֶסֶךְ désigne une offrande liquide versée. « Libation » est précis et reste intelligible ; le suffixe renvoie encore à l’agneau.
- source_word: יַיִן
  choice: vin
  rationale: Équivalent lexical direct.
- source_word: רְבִיעִת הַהִין
  choice: un quart de hin
  rationale: La fraction est rendue naturellement et le nom de l’ancienne mesure liquide est conservé.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Sens du terme cultuel אִשֶּׁה
  choice: offrande consumée
  alternative: mets offert / offrande faite par le feu
  rationale: Le terme est lié aux offrandes présentées sur l’autel, mais son étymologie et sa nuance exacte sont discutées. Le texte principal maintient la dimension du feu, et la note signale une autre traduction traditionnelle sans résoudre artificiellement l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. Les phrases ont été légèrement segmentées pour éviter une accumulation lourde, tout en préservant les rapports syntaxiques et rituels du texte hébreu. Les unités anciennes « épha » et « hin » sont maintenues.
