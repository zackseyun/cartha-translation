    issue: « Offrande consumée » pour אִשֶּׁה
    rationale: Cette formulation suggère que l’offrande est entièrement brûlée ou consumée. Le mot hébreu est un terme cultuel traditionnellement rendu « offrande par le feu » et ne requiert pas cette précision.
  - severity: low
    issue: Lien de « dont l’odeur est agréable »
    rationale: La relative est compréhensible, mais la formule hébraïque qualifie directement l’offrande comme ayant un « parfum agréable ». Une formulation attributive conserve mieux la construction et le registre cultuel.
