revisions:
- from: L’offrande de céréales qui l’accompagnera sera de deux dixièmes d’épha de fleur de farine mélangée à de l’huile. Ce sera une offrande consumée pour Yahweh[a], dont l’odeur est agréable. La libation qui l’accompagnera sera d’un quart de hin de vin.
  to: Son offrande de céréales sera de deux dixièmes d’épha de fleur de farine mélangée à de l’huile, une offrande par le feu pour Yahweh[a], au parfum agréable ; et sa libation sera d’un quart de hin de vin.
  rationale: La révision remplace « offrande consumée », qui surinterprète le terme technique אִשֶּׁה, par « offrande par le feu ». Elle rend la formule רֵיחַ נִיחֹחַ par « au parfum agréable » et resserre la syntaxe tout en préservant les référents possessifs, les mesures et la coordination du texte hébreu.
