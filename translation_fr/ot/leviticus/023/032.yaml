  text: שַׁבַּ֨ת שַׁבָּת֥וֹן הוּא֙ לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם בְּ/תִשְׁעָ֤ה לַ/חֹ֨דֶשׁ֙ בָּ/עֶ֔רֶב מֵ/עֶ֣רֶב עַד עֶ֔רֶב תִּשְׁבְּת֖וּ שַׁבַּתְּ/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/032.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall afflict yourselves. On the ninth day of the month, in the evening, from evening to evening[b], you shall keep your Sabbath.
translation:
  language: fr
  text: Ce sera pour vous un sabbat de repos complet, et vous vous affligerez[a]. Le neuvième jour du mois, au soir, d’un soir à l’autre[b], vous observerez votre sabbat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous vous humilierez » ou « vous vous imposerez des privations ». L’expression hébraïque désigne une affliction volontaire dans une observance pénitentielle, traditionnellement associée au jeûne.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « d’un soir à l’autre » : l’observance est ainsi délimitée selon la manière israélite de compter les jours.'
    reason: cultural_note
lexical_decisions:
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: un sabbat de repos complet
  rationale: La construction redoublée intensifie l’idée de cessation et de repos. Cette formulation conserve cette force sans ajouter la notion de solennité, qui n’est pas explicite ici.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: vous vous affligerez vous-mêmes
  rationale: Dans ce contexte rituel, le verbe ענה exprime une forme d’affliction volontaire liée à la pénitence. La traduction reste proche de l’hébreu sans réduire explicitement le commandement au jeûne.
- source_word: נַפְשֹׁתֵיכֶם
  choice: vous-mêmes
  rationale: Dans cette locution, נֶפֶשׁ a une valeur réfléchie et désigne les personnes elles-mêmes, non pas seulement une âme immatérielle.
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ בָּעֶרֶב
  choice: Le neuvième jour du mois, au soir
  rationale: La formulation suit l’ordre de l’hébreu et indique le début de l’observance au soir du neuvième jour.
- source_word: מֵעֶרֶב עַד עֶרֶב
  choice: d’un soir à l’autre
  rationale: Cette tournure française naturelle conserve exactement les deux limites temporelles exprimées par l’hébreu, sans remplacer « soir » par « coucher du soleil ».
- source_word: תִּשְׁבְּתוּ שַׁבַּתְּכֶם
  choice: vous observerez votre sabbat
  rationale: Le verbe signifie cesser ou se reposer; avec « votre sabbat », « observer » rend naturellement l’idée de respecter ce repos prescrit.
theological_decisions:
- issue: Sens de l’affliction de soi dans le contexte cultuel
  choice: Conserver « vous vous affligerez vous-mêmes » dans le texte principal.
  alternative: « vous jeûnerez », « vous vous humilierez » ou « vous vous imposerez des privations »
  rationale: Le jeûne est traditionnellement associé à cette observance, mais le verset ne le nomme pas explicitement. La formulation retenue préserve donc l’étendue et l’ambiguïté de l’expression hébraïque.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur à valeur impérative convient au style juridique du passage. « Sabbat » est conservé comme terme biblique usuel; « repos complet » explicite la force intensive de la construction hébraïque.
