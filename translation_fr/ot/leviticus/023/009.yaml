  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/009.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Yahweh[a] parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque du nom divin et son rendu traditionnel.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר, précédé du waw narratif, introduit ici une nouvelle prise de parole. « Parla » respecte la formule hébraïque tout en restant naturel dans un récit français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre afin de préserver le nom divin présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֶל־מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל désigne le destinataire de la parole ; « à Moïse » est son équivalent français naturel.
- source_word: לֵּאמֹר
  choice: en ces termes
  rationale: Dans cette formule d’introduction au discours, l’infinitif hébreu annonce les paroles qui suivent. « En ces termes » est idiomatique en français et prépare naturellement la citation du verset suivant.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » en conserve la fonction de nom propre, tandis que la substitution traditionnelle par un titre est signalée en note.
translation_notes:
  register: Français moderne, sobre et digne. La formule hébraïque est conservée sans lourdeur ; « en ces termes » sert d’introduction naturelle au discours qui commence au verset suivant.
