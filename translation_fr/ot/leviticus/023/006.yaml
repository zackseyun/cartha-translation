  text: וּ/בַ/חֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ לַ/חֹ֣דֶשׁ הַ/זֶּ֔ה חַ֥ג הַ/מַּצּ֖וֹת לַ/יהוָ֑ה שִׁבְעַ֥ת יָמִ֖ים מַצּ֥וֹת תֹּאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/006.yaml
  text: And on the fifteenth day of this month is the Feast of Unleavened Bread to Yahweh[a]; for seven days you shall eat unleavened bread.
translation:
  language: fr
  text: Le quinzième jour de ce mois, c’est la fête des Pains sans levain en l’honneur de Yahweh[a]. Pendant sept jours, vous mangerez du pain sans levain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « appartenant à Yahweh » ou « pour Yahweh ». La préposition hébraïque peut exprimer la dédicace ou l’appartenance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם
  choice: Le quinzième jour
  rationale: Cette formulation rend naturellement en français l’expression calendaire hébraïque, où le nombre cardinal a une valeur ordinale.
- source_word: לַחֹדֶשׁ הַזֶּה
  choice: de ce mois
  rationale: Avec « jour », la préposition situe la date à l’intérieur du mois; « de ce mois » est la tournure française idiomatique.
- source_word: חַג הַמַּצּוֹת
  choice: la fête des Pains sans levain
  rationale: חַג désigne ici une fête cultuelle, et הַמַּצּוֹת en précise le nom. La majuscule à « Pains » signale le titre de la fête sans modifier son sens.
- source_word: לַיהוָה
  choice: en l’honneur de Yahweh
  rationale: La préposition ל peut marquer la destination, la dédicace ou l’appartenance. « En l’honneur de » exprime naturellement la consécration de la fête à Yahweh, sans exclure l’autre nuance signalée en note.
- source_word: שִׁבְעַת יָמִים
  choice: Pendant sept jours
  rationale: Le groupe nominal exprime une durée; « pendant » la rend explicitement et naturellement en français.
- source_word: מַצּוֹת
  choice: du pain sans levain
  rationale: Le pluriel hébreu désigne les pains azymes comme catégorie alimentaire; le singulier collectif français est ici naturel.
- source_word: תֹּאכֵלוּ
  choice: vous mangerez
  rationale: Dans ce contexte légal, l’inaccompli a une valeur prescriptive. Le futur français conserve cette force normative avec un registre biblique courant.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » représente le nom divin plutôt que de le remplacer par un titre.
- issue: Valeur de la préposition ל dans לַיהוָה
  choice: en l’honneur de Yahweh
  alternative: appartenant à Yahweh; pour Yahweh
  rationale: La relation peut relever de la dédicace ou de l’appartenance. Le texte principal emploie une expression française naturelle et la note préserve explicitement l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La structure en deux phrases suit la progression du verset. « Vous mangerez » conserve la portée prescriptive sans employer une formulation excessivement autoritaire.
