  text: וְ/הֵנִ֧יף אֶת הָ/עֹ֛מֶר לִ/פְנֵ֥י יְהוָ֖ה לִֽ/רְצֹנְ/כֶ֑ם מִֽ/מָּחֳרַת֙ הַ/שַּׁבָּ֔ת יְנִיפֶ֖/נּוּ הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/011.yaml
  text: And he shall wave the sheaf before Yahweh for your acceptance[a]; on the day after the Sabbath the priest shall wave it.
translation:
  language: fr
  text: Il agitera la gerbe devant Yahweh afin que vous soyez agréés[a] ; le prêtre l’agitera le lendemain du sabbat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « pour votre acceptation ». L’expression hébraïque peut indiquer que les adorateurs sont agréés devant Yahweh par l’intermédiaire de l’offrande.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף / יְנִיפֶנּוּ
  choice: présentera… en faisant le geste rituel / la présentera ainsi
  rationale: Le hifil de נוּף désigne ici le mouvement rituel par lequel l’offrande est présentée. Cette formulation française reste compréhensible sans supposer un simple mouvement de la main ni employer le peu naturel « balancer la gerbe ».
- source_word: הָעֹמֶר
  choice: la gerbe
  rationale: Dans ce contexte de prémices, עֹמֶר désigne la gerbe apportée au sanctuaire plutôt qu’une mesure sèche.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: Rend directement l’expression cultuelle indiquant une présentation en présence de Dieu et conserve le nom divin du texte hébreu.
- source_word: לִרְצֹנְכֶם
  choice: afin que vous soyez agréés
  rationale: Le syntagme exprime l’agrément des adorateurs par l’intermédiaire de l’offrande. La formulation conserve la portée relationnelle et cultuelle.
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: le lendemain du sabbat
  rationale: Expression temporelle française naturelle et fidèle au jour qui suit le sabbat.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Équivalent français courant de כֹּהֵן dans la législation cultuelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme ; la translittération conserve le nom personnel sans le remplacer par un titre.
- issue: Portée de לִרְצֹנְכֶם
  choice: afin que vous soyez agréés
  alternative: pour votre agrément
  rationale: L’expression peut viser l’acceptation des personnes représentées par l’offrande. Le choix retenu l’explicite dans le texte, tandis que la note signale l’autre formulation possible.
translation_notes:
  register: Français international moderne, digne et accessible. « Présenter en faisant le geste rituel » rend l’action cultuelle de נוּף sans employer un calque français ambigu ou peu naturel.
