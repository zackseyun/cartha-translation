  text: אֵ֚לֶּה מוֹעֲדֵ֣י יְהוָ֔ה אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם מִקְרָאֵ֣י קֹ֑דֶשׁ לְ/הַקְרִ֨יב אִשֶּׁ֜ה לַ/יהוָ֗ה עֹלָ֧ה וּ/מִנְחָ֛ה זֶ֥בַח וּ/נְסָכִ֖ים דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/037.yaml
  text: 'These are the appointed times of the LORD, which you shall proclaim as holy convocations, to present a food offering to the LORD: a burnt offering and a grain offering, a sacrifice and drink offerings, each day''s matter on its day.'
translation:
  language: fr
  text: 'Voici les fêtes fixées par le SEIGNEUR, que vous proclamerez comme de saintes assemblées, afin de présenter au SEIGNEUR des offrandes consumées par le feu : holocauste et offrande végétale, sacrifice et libations, ce qui est prescrit pour chaque jour.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹעֲדֵי
  choice: fêtes fixées
  rationale: Dans ce contexte cultuel, le terme désigne les célébrations prescrites à des dates déterminées; cette formulation est naturelle en français et conserve l’idée de temps fixé.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme selon la convention française biblique en petites capitales, sans introduire une vocalisation conjecturale.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: saintes assemblées
  rationale: Exprime des rassemblements officiellement convoqués et consacrés, plutôt qu’un simple acte de proclamation.
- source_word: אִשֶּׁה
  choice: offrandes consumées par le feu
  rationale: Le terme cultuel désigne une offrande faite par le feu; cette traduction évite l’interprétation plus spécifique et discutée « offrande de nourriture ».
- source_word: עֹלָה
  choice: holocauste
  rationale: Terme français traditionnel et précis pour l’offrande entièrement brûlée.
- source_word: מִנְחָה
  choice: offrande végétale
  rationale: Dans la législation lévitique, il s’agit d’une offrande non animale, généralement à base de céréales; « végétale » est plus immédiatement clair que « oblation ».
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: chaque jour ce qui est prévu pour ce jour-là
  rationale: Restitue l’idée distributive de la prescription propre à chaque journée dans un français naturel.
theological_decisions:
- issue: Sens cultuel de אִשֶּׁה
  choice: offrandes consumées par le feu
  alternative: offrandes de nourriture
  rationale: Le rapport étymologique ou conceptuel à la nourriture divine est débattu; la formulation choisie traduit le mode rituel explicite sans suggérer que Dieu aurait besoin de nourriture.
- issue: Relation entre les différentes offrandes
  choice: énumération sans harmonisation explicative
  alternative: présenter chaque catégorie comme une sous-classe d’une « offrande de nourriture »
  rationale: L’hébreu juxtapose holocauste, offrande végétale, sacrifice et libations; conserver cette structure évite de résoudre artificiellement leurs relations syntaxiques ou cultuelles.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme énumératif de l’hébreu est conservé, avec une explicitation minimale dans la formule finale.
