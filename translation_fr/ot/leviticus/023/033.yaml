  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/033.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Yahvé[a] parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH ; aussi transcrit « Yahweh » ou « Jéhovah ».'
    reason: Signaler la forme hébraïque du nom divin et des translittérations françaises ou internationales courantes.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר avec waw consécutif introduit un nouvel acte de parole dans la suite narrative. « Parla » restitue naturellement en français la formule solennelle récurrente de l’adresse divine.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu par la forme française courante « Yahvé », afin de conserver le nom divin plutôt que de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition désigne ici le destinataire de la parole ; « à » est son équivalent idiomatique dans « parler à quelqu’un ».
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et universellement reconnue du nom hébreu מֹשֶׁה.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif introduit le contenu de la parole qui suit. « En ces termes » rend cette fonction de manière naturelle et digne, sans le calque moins idiomatique « disant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahvé » en conserve le caractère de nom propre dans une forme française établie ; la note signale la graphie source et les autres rendus connus sans imposer une tradition confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. La formule « parla à Moïse en ces termes » conserve la solennité et la fonction introductive de l’hébreu tout en évitant un calque artificiel.
