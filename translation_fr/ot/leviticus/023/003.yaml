base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/003.yaml
  text: For six days work may be done[a], but on the seventh day is a Sabbath of complete rest, a holy convocation. You shall do no work[b]; it is a Sabbath to Yahweh in all your dwellings.
translation:
  language: fr
  text: Pendant six jours, le travail pourra se faire, mais le septième jour est un sabbat de repos complet[a], une sainte convocation. Vous ne ferez aucun travail ; c’est un sabbat pour Yahweh dans tous vos lieux d’habitation[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un repos sabbatique » ou « un sabbat, un repos solennel ». L’expression hébraïque renforce l’idée de cessation et de repos sabbatique.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans toutes vos communautés établies ». Le terme hébreu peut désigner les lieux où l’on habite ou les communautés dans lesquelles on est établi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה
  choice: le travail pourra se faire
  rationale: Le nifal conserve une formulation passive. « Pourra se faire » exprime naturellement en français la valeur permissive ou générale du verbe dans ce contexte.
- source_word: מְלָאכָה
  choice: travail
  rationale: Terme courant et précis pour le travail interdit par la législation du sabbat.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: un sabbat de repos complet
  rationale: Cette formulation garde le terme « sabbat » et rend l’intensification produite par שַׁבָּתוֹן, sans ajouter d’interprétation doctrinale.
- source_word: מִקְרָא קֹדֶשׁ
  choice: une sainte convocation
  rationale: « Convocation » préserve l’idée d’un rassemblement officiellement convoqué, tandis que « sainte » en indique le caractère consacré.
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: Vous ne ferez aucun travail
  rationale: Rend directement l’interdiction à la deuxième personne du pluriel, dans un français juridique clair et digne.
- source_word: שַׁבָּת הִוא לַיהוָה
  choice: c’est un sabbat pour Yahweh
  rationale: « Pour » conserve la relation exprimée par la préposition ל sans la réduire explicitement à la possession ou à la consécration.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: partout où vous habiterez
  rationale: Formulation française naturelle qui exprime la portée territoriale générale de la prescription tout en laissant ouverte la nuance de lieux d’habitation ou de communautés établies.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: mais le septième jour
  rationale: Le « mais » fait ressortir en français le contraste implicite entre les six jours de travail et le septième jour, sans modifier le contenu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte directement le tétragramme ; « Yahweh » en préserve la fonction de nom personnel.
- issue: Force de שַׁבַּת שַׁבָּתוֹן
  choice: un sabbat de repos complet
  alternative: un sabbat, un repos solennel
  rationale: Le choix retenu communique l’intensification de la cessation du travail sans introduire de développement théologique ultérieur.
- issue: Relation exprimée par ל dans לַיהוָה
  choice: pour Yahweh
  alternative: consacré à Yahweh
  rationale: « Pour Yahweh » préserve la relative ouverture de la préposition hébraïque ; « consacré à » expliciterait davantage que le texte lui-même.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du texte législatif hébreu, tandis que « partout où vous habiterez » évite une tournure inutilement archaïque. Les deux marqueurs de note figurent dans le texte à l’endroit correspondant.
