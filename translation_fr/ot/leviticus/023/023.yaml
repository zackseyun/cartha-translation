  yaml_path: translation/ot/leviticus/023/023.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Yahweh parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר, dans cette formule narrative, introduit une nouvelle parole divine. « Parla » est naturel, digne et distingue ce verbe de לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre, conformément au texte hébreu, plutôt que remplacé par un titre.
- source_word: אֶל מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל désigne ici le destinataire de la parole; « à Moïse » est l’équivalent français idiomatique.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Dans cette formule introductive, l’infinitif « dire » annonce le contenu qui suit. « En ces termes » évite le calque peu naturel « disant » tout en conservant sa fonction.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le nom divin YHWH. « Yahweh » le conserve comme nom propre sans lui substituer un titre; « Jéhovah » repose sur une vocalisation traditionnelle plus tardive.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure formulaire hébraïque est rendue naturellement, sans effacer la distinction entre le verbe principal « parla » et l’introduction du discours « en ces termes ».
