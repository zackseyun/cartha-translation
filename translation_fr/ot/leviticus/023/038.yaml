base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/038.yaml
  text: besides the Sabbaths of Yahweh[a], and besides your gifts, and besides all your vows, and besides all your freewill offerings[b], which you give to Yahweh.
translation:
  language: fr
  text: Outre les sabbats de Yahweh[a], outre vos dons, outre tous vos vœux et outre toutes vos offrandes volontaires que vous donnez à Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: À chaque occurrence, « outre » peut aussi se comprendre comme « en dehors de » ou « en plus de ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: en plus de
  rationale: Dans ce contexte, l’expression indique que les éléments énumérés s’ajoutent aux célébrations et aux offrandes prescrites précédemment. Sa répétition est conservée afin de rendre la structure insistante de l’hébreu.
- source_word: שַׁבְּתֹת יְהוָה
  choice: les sabbats de Yahweh
  rationale: Le pluriel « sabbats » correspond à l’hébreu, et la construction possessive est rendue littéralement sans l’alourdir.
- source_word: מַתְּנוֹתֵיכֶם
  choice: vos dons
  rationale: Le terme désigne de manière générale ce qui est donné; « dons » préserve cette ampleur sans préciser indûment qu’il s’agit d’une catégorie sacrificielle particulière.
- source_word: כָּל נִדְרֵיכֶם
  choice: tous vos vœux
  rationale: נֶדֶר peut désigner le vœu ou ce qui est voué. « Vœux » conserve la formulation concise et l’ambiguïté du texte, tandis que le contexte cultuel indique leur rapport aux dons faits à Dieu.
- source_word: כָּל נִדְבֹתֵיכֶם
  choice: toutes vos offrandes volontaires
  rationale: Dans ce contexte cultuel, נְדָבָה désigne naturellement une offrande faite volontairement; cette traduction est claire en français moderne.
- source_word: אֲשֶׁר תִּתְּנוּ לַיהוָה
  choice: que vous donnerez à Yahweh
  rationale: Le relatif est compris comme portant sur l’ensemble des derniers éléments coordonnés. Le futur rend naturellement en français l’action envisagée par la forme verbale hébraïque.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin propre; « Yahweh » le représente directement plutôt que de le remplacer par un titre.
- issue: Portée de מִלְּבַד
  choice: en plus de
  alternative: indépendamment de / sans compter
  rationale: Le contexte indique vraisemblablement une addition aux observances déjà prescrites, mais la note conserve les autres nuances possibles sans trancher plus que l’hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « en plus de » reproduit l’effet cumulatif de l’hébreu, malgré une légère lourdeur assumée. « Sabbats » reste en minuscule selon l’usage courant du français.
