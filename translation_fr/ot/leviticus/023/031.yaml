id: LEV.23.31
reference: Leviticus 23:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כָּל מְלָאכָ֖ה לֹ֣א תַעֲשׂ֑וּ חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בְּ/כֹ֖ל מֹֽשְׁבֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/031.yaml
  text: You shall do no work[b][a]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: fr
  text: Vous ne ferez aucun travail. C’est une prescription permanente[a], pour toutes vos générations, dans tous vos lieux d’habitation[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une prescription pour toujours » ou « une prescription perpétuelle ». Le terme hébreu peut exprimer une durée durable ou perpétuelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans toutes vos localités » ou « partout où vous habiterez ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: Vous ne ferez aucun travail
  rationale: La négation avec כָּל מְלָאכָה interdit toute forme de travail. « Aucun travail » exprime naturellement cette portée générale sans ajouter une emphase absente du texte.
- source_word: חֻקַּת עוֹלָם
  choice: une prescription permanente
  rationale: חֻקָּה désigne une prescription établie, tandis que עוֹלָם marque ici une durée indéfinie ou durable. « Prescription permanente » conserve le registre juridique dans un français actuel.
- source_word: לְדֹרֹתֵיכֶם
  choice: pour toutes vos générations
  rationale: La formule indique que la prescription vaut au fil des générations successives. « Pour toutes vos générations » en préserve la portée temporelle.
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: dans tous vos lieux d’habitation
  rationale: מוֹשָׁב peut désigner un lieu où l’on demeure ou une localité. La traduction retenue conserve à la fois le caractère locatif et la totalité exprimée par כֹּל.
theological_decisions:
- issue: Durée de la prescription cultuelle
  choice: une prescription permanente
  alternative: une prescription pour toujours / une prescription perpétuelle
  rationale: עֹולָם peut exprimer une durée durable, indéfinie ou perpétuelle selon le contexte. « Permanente » maintient la force continue de l’obligation sans trancher au-delà de l’ambiguïté temporelle de l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur injonctive convient au registre juridique biblique sans être archaïque. La phrase nominale hébraïque est rendue par « C’est » pour assurer une syntaxe française naturelle.
