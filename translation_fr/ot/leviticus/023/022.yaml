  text: וּֽ/בְ/קֻצְרְ/כֶ֞ם אֶת קְצִ֣יר אַרְצְ/כֶ֗ם לֹֽא תְכַלֶּ֞ה פְּאַ֤ת שָֽׂדְ/ךָ֙ בְּ/קֻצְרֶ֔/ךָ וְ/לֶ֥קֶט קְצִירְ/ךָ֖ לֹ֣א תְלַקֵּ֑ט לֶֽ/עָנִ֤י וְ/לַ/גֵּר֙ תַּעֲזֹ֣ב אֹתָ֔/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/022.yaml
  text: And when you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest; you shall leave them for the poor and for the sojourner[b]. I am Yahweh your God.
translation:
  language: fr
  text: Quand vous moissonnerez la récolte de votre pays, tu ne moissonneras pas jusqu’au bord[a] de ton champ et tu ne ramasseras pas les glanures de ta récolte. Tu les laisseras au pauvre et à l’étranger résident[b]. Je suis Yahvé, votre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le coin ». Le mot hébreu peut désigner le bord, le côté ou le coin d’un champ.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’étranger établi parmi vous ». Le mot hébreu désigne une personne d’origine étrangère qui réside en Israël sous la protection de ses lois.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם אֶת קְצִיר אַרְצְכֶם
  choice: Quand vous moissonnerez la récolte de votre pays
  rationale: L’infinitif construit introduit une circonstance temporelle. Cette formulation naturelle conserve le pluriel hébreu et le cadre agricole explicite.
- source_word: לֹא תְכַלֶּה פְּאַת שָׂדְךָ בְּקֻצְרֶךָ
  choice: tu ne moissonneras pas entièrement le bord de ton champ
  rationale: Le piel de כלה exprime ici l’action d’achever ou d’épuiser complètement. La formulation maintient aussi le passage marqué du pluriel au singulier présent dans l’hébreu.
- source_word: וְלֶקֶט קְצִירְךָ לֹא תְלַקֵּט
  choice: tu ne ramasseras pas les glanures de ta récolte
  rationale: לקט désigne les épis ou autres restes épars après la moisson. « Glanures » est le terme agricole précis, tandis que « ramasser » rend clairement l’interdiction verbale.
- source_word: לֶעָנִי
  choice: au pauvre
  rationale: עני désigne ici une personne pauvre ou économiquement vulnérable; le singulier correspond au texte source.
- source_word: וְלַגֵּר
  choice: à l’étranger résident
  rationale: גר désigne un non-Israélite établi au sein de la communauté et bénéficiant de la protection de ses lois. « Étranger résident » conserve cette nuance sans le confondre avec un simple visiteur.
- source_word: תַּעֲזֹב אֹתָם
  choice: Tu les laisseras
  rationale: עזב signifie ici laisser ces produits sur place à l’intention d’autres personnes, et non abandonner au sens affectif.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Je suis Yahvé, votre Dieu
  rationale: La formule d’alliance est rendue directement, avec le nom divin sous sa forme française courante « Yahvé » et le retour au pluriel de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » représente le nom propre en français plutôt que de le remplacer par un titre.
- issue: Statut social du גֵּר
  choice: l’étranger résident
  alternative: l’immigré / l’étranger établi parmi vous
  rationale: Le terme vise une personne d’origine étrangère qui réside durablement en Israël sous la protection de sa législation. Le choix retenu préserve cette catégorie sociale sans lui imposer une définition administrative moderne.
- issue: Alternance entre pluriel et singulier dans l’adresse
  choice: conserver « vous… tu… votre »
  alternative: uniformiser au pluriel ou au singulier
  rationale: L’hébreu passe réellement du pluriel au singulier, puis revient au pluriel dans la formule finale. Cette variation peut refléter l’adresse au peuple puis à chaque propriétaire; la conserver évite de trancher silencieusement sa portée.
translation_notes:
  register: Français international moderne, sobre et juridique. Le verset conserve volontairement l’alternance inhabituelle entre le pluriel collectif et le singulier individuel du texte hébreu. « Glanures » est un terme agricole précis mais encore intelligible; les notes éclairent les deux termes dont l’étendue sémantique ne se laisse pas reproduire par un seul équivalent français.
