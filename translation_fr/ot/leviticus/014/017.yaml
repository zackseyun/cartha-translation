  text: וּ/מִ/יֶּ֨תֶר הַ/שֶּׁ֜מֶן אֲשֶׁ֣ר עַל כַּפּ֗/וֹ יִתֵּ֤ן הַ/כֹּהֵן֙ עַל תְּנ֞וּךְ אֹ֤זֶן הַ/מִּטַּהֵר֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִ֑ית עַ֖ל דַּ֥ם הָ/אָשָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/017.yaml
  text: And from the rest of the oil that is on his palm[a], the priest shall put some on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand, and on the big toe of his right foot[b], on top of the blood of the guilt offering.
translation:
  language: fr
  text: Du reste de l’huile qui est dans sa paume, le prêtre en mettra sur le lobe[a] de l’oreille droite de la personne en cours de purification, sur le pouce de sa main droite et sur le gros orteil de son pied droit, sur le sang du sacrifice de réparation[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’extrémité de l’oreille ». Le terme hébreu désigne la partie extérieure ou extrême de l’oreille ; « lobe » est le rendu anatomique le plus clair dans ce contexte rituel.
    reason: lexical_alternative
  - marker: b
    text: Ou « par-dessus le sang du sacrifice de réparation ». L’huile est appliquée à l’endroit déjà marqué par le sang.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיֶּתֶר הַשֶּׁמֶן
  choice: avec le reste de l’huile
  rationale: יֶתֶר désigne ce qui reste. En français, « avec le reste de l’huile » exprime naturellement la matière dont le prêtre prélève pour l’application, tout en conservant la valeur partitive de מִן.
- source_word: עַל כַּפּוֹ
  choice: qui est dans le creux de sa main
  rationale: כַּף peut désigner la paume ou le creux de la main. Dans ce geste rituel, « dans le creux de sa main » donne une image naturelle et précise, sans modifier le référent.
- source_word: יִתֵּן
  choice: en mettra
  rationale: נתן signifie ici mettre ou appliquer. Le pronom « en » indique naturellement en français qu’une partie de l’huile restante est employée.
- source_word: תְּנוּךְ אֹזֶן
  choice: le lobe de l’oreille
  rationale: תְּנוּךְ désigne l’extrémité extérieure de l’oreille dans cette formule rituelle; « lobe » est le terme anatomique moderne le plus clair.
- source_word: הַמִּטַּהֵר
  choice: la personne qui se purifie
  rationale: Le participe hitpael présente la personne engagée dans le processus rituel de purification. Cette formulation française conserve l’aspect en cours sans suggérer qu’elle accomplit seule le rite.
- source_word: בֹּהֶן יָדוֹ / בֹּהֶן רַגְלוֹ
  choice: le pouce de sa main / le gros orteil de son pied
  rationale: בֹּהֶן désigne selon le contexte le pouce ou le gros orteil; le français exige ces termes anatomiques distincts.
- source_word: עַל דַּם הָאָשָׁם
  choice: par-dessus le sang du sacrifice de réparation
  rationale: Le dernier עַל indique vraisemblablement que l’huile est appliquée au même endroit, sur le sang déjà posé. « Par-dessus » rend clairement cette relation spatiale tout en laissant une note signaler la formulation plus littérale.
theological_decisions:
- issue: Traduction du terme sacrificiel אָשָׁם
  choice: sacrifice de réparation
  alternative: sacrifice de culpabilité
  rationale: אָשָׁם est une offrande précise liée à la faute, à la responsabilité et, selon les cas, à la réparation. « Sacrifice de réparation » est une désignation française claire qui met en valeur sa fonction cultuelle sans importer une doctrine ultérieure; « sacrifice de culpabilité » reste une traduction possible.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition des membres droits est conservée pour respecter la précision de la formule rituelle; « la personne qui se purifie » évite le masculin générique substantivé.
