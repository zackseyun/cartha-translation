  text: וְ/הַ/נּוֹתָ֗ר מִן הַ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר לְ/כַפֵּ֥ר עָלָ֖י/ו לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/029.yaml
  text: And the rest of the oil that is in the priest’s palm he shall put on the head of the one being cleansed[a], to make atonement for him before Yahweh.
translation:
  language: fr
  text: Le reste de l’huile qui se trouve dans la paume du prêtre, il le mettra sur la tête de la personne en cours de purification, afin de faire expiation pour elle devant Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר מִן הַשֶּׁמֶן
  choice: Le reste de l’huile
  rationale: Le participe נוֹתָר désigne ce qui subsiste; avec מִן au sens partitif, «le reste de l’huile» est naturel et précis en français.
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: qui se trouve dans la paume du prêtre
  rationale: כַּף désigne la paume ou le creux de la main. Pour un liquide tenu dans la main, «dans la paume» rend naturellement l’image concrète malgré la préposition עַל.
- source_word: יִתֵּן עַל רֹאשׁ
  choice: il le mettra sur la tête
  rationale: Dans ce geste rituel, נתן signifie mettre ou appliquer; «mettra sur» est clair et direct.
- source_word: הַמִּטַּהֵר
  choice: la personne en cours de purification
  rationale: Le participe hitpael présente la personne qui subit ou accomplit le processus rituel de purification; cette formulation préserve l’aspect en cours sans marquage de genre inutile.
- source_word: לְכַפֵּר עָלָיו
  choice: afin de faire l’expiation pour elle
  rationale: כפר est un terme cultuel majeur, rendu par «faire l’expiation»; עַל introduit ici la personne au bénéfice de laquelle l’expiation est accomplie.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי exprime la présence cultuelle devant Dieu, et le tétragramme est translittéré «Yahweh».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme; «Yahweh» conserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Portée cultuelle de לְכַפֵּר
  choice: faire l’expiation pour elle
  alternative: accomplir le rite d’expiation en sa faveur
  rationale: La formulation retenue conserve le terme théologique traditionnel sans expliquer davantage que le texte la nature ou le mécanisme de l’expiation.
translation_notes:
  register: 'Français international moderne, digne et accessible. La reprise pronominale «il le mettra» suit naturellement la longue construction nominale hébraïque tout en gardant clairement le prêtre comme sujet. Aucun marqueur de note n’est requis, puisque l’ambiguïté signalée dans la couche anglaise semble provenir d’un mauvais rattachement: l’hébreu relie sans ambiguïté la relative à l’huile restante dans la paume.'
