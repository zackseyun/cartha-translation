id: LEV.14.10
reference: Leviticus 14:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִקַּ֤ח שְׁנֵֽי כְבָשִׂים֙ תְּמִימִ֔ים וְ/כַבְשָׂ֥ה אַחַ֛ת בַּת שְׁנָתָ֖/הּ תְּמִימָ֑ה וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן וְ/לֹ֥ג אֶחָ֖ד שָֽׁמֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/010.yaml
  text: And on the eighth day he shall take two male lambs without blemish[a], and one ewe lamb a year old without blemish, and three-tenths of an ephah of fine flour as a grain offering mixed with oil, and one log of oil.
translation:
  language: fr
  text: Le huitième jour, il prendra deux agneaux mâles sans défaut, une agnelle d’un an sans défaut, trois dixièmes d’épha de fleur de farine mélangée à de l’huile comme offrande de céréales, et un log[a] d’huile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le log est une petite unité de capacité employée dans les rites israélites.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: Le huitième jour
  rationale: Formulation naturelle en français pour poursuivre la séquence des prescriptions; la conjonction hébraïque n’a pas besoin d’être rendue mécaniquement.
- source_word: יִקַּח
  choice: il prendra
  rationale: Le futur français exprime ici la valeur prescriptive de l’imparfait hébreu dans un texte légal.
- source_word: שְׁנֵי כְבָשִׂים
  choice: deux agneaux mâles
  rationale: Le masculin est explicité afin de conserver le contraste voulu avec l’agnelle mentionnée ensuite.
- source_word: תְּמִימִים / תְּמִימָה
  choice: sans défaut
  rationale: Dans le contexte sacrificiel, l’adjectif désigne des animaux exempts de défaut; cette expression est claire et consacrée en français.
- source_word: וְכַבְשָׂה אַחַת בַּת שְׁנָתָהּ
  choice: une agnelle d’un an
  rationale: Rend à la fois le sexe de l’animal et l’indication d’âge de manière concise et naturelle.
- source_word: וּשְׁלֹשָׁה עֶשְׂרֹנִים
  choice: trois dixièmes d’épha
  rationale: Le terme désigne des mesures d’un dixième; l’épha, unité sous-entendue dans ce contexte, est précisé pour rendre la quantité intelligible sans conversion approximative.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: Équivalent français usuel pour une farine finement moulue destinée aux offrandes.
- source_word: מִנְחָה
  choice: comme offrande de céréales
  rationale: Dans ce contexte cultuel, le terme désigne l’offrande non animale préparée avec de la farine; cette expression est compréhensible en français moderne.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: mélangée à de l’huile
  rationale: Reproduit simplement l’état de la farine combinée avec de l’huile.
- source_word: וְלֹג אֶחָד שָׁמֶן
  choice: et un log d’huile
  rationale: Le log est une mesure liquide spécifique sans équivalent français exact; sa translittération préserve l’unité du texte source et appelle une note explicative.
theological_decisions: []
