  text: וְ/הַ/שֹּׁכֵ֣ב בַּ/בַּ֔יִת יְכַבֵּ֖ס אֶת בְּגָדָ֑י/ו וְ/הָ/אֹכֵ֣ל בַּ/בַּ֔יִת יְכַבֵּ֖ס אֶת בְּגָדָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/047.yaml
  text: And whoever lies down in the house shall wash his clothes[b][a], and whoever eats in the house shall wash his clothes.
translation:
  language: fr
  text: Celui qui se couche dans la maison lavera ses vêtements[a], et celui qui mange dans la maison lavera ses vêtements.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Celui qui dort dans la maison ». Le verbe hébreu peut signifier « se coucher » ou « dormir »; « se couche » est plus large et convient au contexte juridique.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשֹּׁכֵב
  choice: Celui qui se couche
  rationale: Le participe substantivé désigne de manière générale toute personne qui se couche. « Se couche » conserve le sens large de שׁכב sans exiger qu’elle dorme effectivement.
- source_word: בַּבַּיִת
  choice: dans la maison
  rationale: Cette formulation rend directement et naturellement la valeur locative de l’expression hébraïque.
- source_word: יְכַבֵּס
  choice: lavera
  rationale: Dans ce contexte juridique sacerdotal, l’inaccompli exprime une prescription. Le futur français garde le ton législatif du passage.
- source_word: אֶת־בְּגָדָיו
  choice: ses vêtements
  rationale: « Vêtements » est une traduction actuelle et digne de בֶּגֶד. Le possessif français « ses » ne marque pas le genre, mais conserve le singulier référentiel.
- source_word: וְהָאֹכֵל
  choice: et celui qui mange
  rationale: Comme le premier participe, il s’agit d’un participe substantivé à portée générale; « celui qui mange » convient au registre juridique.
theological_decisions:
- issue: Portée des formes masculines singulières génériques dans la prescription juridique
  choice: Employer « celui qui… ses vêtements »
  alternative: Employer « quiconque… ses vêtements » ou une tournure explicitement inclusive
  rationale: L’hébreu emploie des participes masculins singuliers dans un sens représentatif général. La tournure française conserve le singulier et le style juridique sans ajouter une restriction explicite aux hommes; le possessif « ses » est naturellement non marqué en genre.
translation_notes:
  register: Français moderne, clair et digne, avec un futur à valeur prescriptive adapté au contexte légal. La répétition de « dans la maison lavera ses vêtements » est maintenue afin de respecter le parallélisme et l’insistance du texte hébreu.
