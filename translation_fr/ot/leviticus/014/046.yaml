source:
  edition: WLC
  text: וְ/הַ/בָּא֙ אֶל הַ/בַּ֔יִת כָּל יְמֵ֖י הִסְגִּ֣יר אֹת֑/וֹ יִטְמָ֖א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/046.yaml
  text: And whoever enters the house during all the days that it is quarantined shall be unclean until the evening[a].
translation:
  language: fr
  text: Quiconque entrera dans la maison pendant toute la période où elle est mise à l’isolement[a] sera impur jusqu’au soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « où elle est fermée » ou « où elle est placée sous restriction ». L’hébreu désigne l’isolement de la maison sous l’autorité du prêtre, en vue de son examen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/בָּא
  choice: Quiconque entrera
  rationale: L’article suivi du participe désigne ici de manière générale toute personne qui entre. « Quiconque entrera » rend naturellement la portée juridique de la formulation.
- source_word: אֶל הַ/בַּיִת
  choice: dans la maison
  rationale: Avec בוא et אֶל, l’expression indique un mouvement vers l’intérieur; en français, « entrer dans la maison » l’exprime de façon idiomatique.
- source_word: כָּל יְמֵי
  choice: pendant toute la période
  rationale: L’expression couvre la totalité des jours où la mesure reste en vigueur. « Toute la période » est clair et naturel sans imposer un nombre précis de jours.
- source_word: הִסְגִּיר אֹת/וֹ
  choice: où elle est mise à l’isolement
  rationale: Dans les procédures de Lévitique 13–14, סגר désigne la mise à l’écart sous restriction sacerdotale en vue d’un examen. « Mise à l’isolement » conserve ce sens sans évoquer principalement une quarantaine médicale moderne.
- source_word: יִטְמָא
  choice: sera impur
  rationale: Le verbe indique l’état d’impureté rituelle qui résulte de l’entrée dans la maison. Le futur convient à la formulation juridique française.
- source_word: עַד הָ/עָרֶב
  choice: jusqu’au soir
  rationale: Il s’agit de la formule habituelle indiquant la durée d’une impureté rituelle temporaire.
theological_decisions: []
