  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/שָׁחַט֮ אֶת כֶּ֣בֶשׂ הָֽ/אָשָׁם֒ וְ/לָקַ֤ח הַ/כֹּהֵן֙ מִ/דַּ֣ם הָֽ/אָשָׁ֔ם וְ/נָתַ֛ן עַל תְּנ֥וּךְ אֹֽזֶן הַ/מִּטַּהֵ֖ר הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/025.yaml
  text: Then he shall slaughter the guilt-offering lamb[a], and the priest shall take some of the blood of the guilt offering and put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: fr
  text: Il égorgera ensuite l’agneau destiné au sacrifice de réparation[a]. Le prêtre prendra du sang de ce sacrifice et en mettra sur le lobe[b] de l’oreille droite de la personne qui est en cours de purification, sur le pouce de sa main droite et sur le gros orteil de son pied droit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de culpabilité ». Il s’agit d’une catégorie particulière de sacrifice.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’extrémité de l’oreille ». Le terme hébreu désigne la partie extérieure ou l’extrémité de l’oreille.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחַט
  choice: égorgera
  rationale: Dans le contexte sacrificiel, « égorger » est le verbe technique naturel en français et rend mieux l’acte rituel que le terme général « tuer ».
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: l’agneau destiné au sacrifice de réparation
  rationale: La construction désigne l’agneau affecté à ce sacrifice précis. Cette formulation explicite naturellement le rapport entre l’animal et l’offrande.
- source_word: אָשָׁם
  choice: sacrifice de réparation
  rationale: Le nom désigne ici une catégorie sacrificielle, non la culpabilité abstraite. « Sacrifice de réparation » est clair et idiomatique en français biblique moderne.
- source_word: מִדַּם הָאָשָׁם
  choice: du sang de ce sacrifice
  rationale: 'La préposition מִן a ici une valeur partitive : le prêtre ne prend qu’une partie du sang. En français, « prendre du sang » exprime naturellement cette valeur.'
- source_word: תְּנוּךְ אֹזֶן
  choice: le lobe de l’oreille
  rationale: Le terme hébreu désigne une partie extérieure ou une extrémité de l’oreille. « Lobe » est le terme rituel traditionnel et demeure naturel, tout en signalant l’incertitude par une note.
- source_word: הַמִּטַּהֵר
  choice: la personne qui se purifie
  rationale: Le participe hitpael présente la personne engagée dans le processus rituel de purification, sans préciser ici qu’elle accomplit elle-même tous les gestes.
- source_word: בֹּהֶן יָדוֹ
  choice: le pouce de sa main droite
  rationale: Avec « main », בֹּהֶן désigne le pouce.
- source_word: בֹּהֶן רַגְלוֹ
  choice: le gros orteil de son pied droit
  rationale: Avec « pied », בֹּהֶן désigne le gros orteil.
- source_word: וְ
  choice: ensuite / et
  rationale: Les coordinations marquent la succession des gestes rituels. « Ensuite » au début rend cette progression naturelle en français, tandis que les autres liens sont exprimés par la coordination.
theological_decisions:
- issue: Traduction du terme sacrificiel אָשָׁם
  choice: sacrifice de réparation
  alternative: sacrifice de culpabilité
  rationale: Le verset parle d’un sacrifice lévitique déterminé. « Réparation » communique sa fonction cultuelle sans réduire le terme à un état intérieur de culpabilité ni lui imposer une interprétation doctrinale ultérieure.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit la progression rituelle sans lourdeur; les termes anatomiques sont courants et précis. Le pronom « Il » conserve la continuité avec le contexte antérieur du passage.
