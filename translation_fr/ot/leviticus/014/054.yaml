  text: זֹ֖את הַ/תּוֹרָ֑ה לְ/כָל נֶ֥גַע הַ/צָּרַ֖עַת וְ/לַ/נָּֽתֶק־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/054.yaml
  text: This is the law for every case of leprous disease and for an itch[a].
translation:
  language: fr
  text: Voici la loi concernant toute atteinte de lèpre[a] et la teigne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traditionnellement traduit par « lèpre » ne désigne pas nécessairement la maladie de Hansen; il couvre diverses atteintes constatées sur la peau et, selon le contexte, sur des objets ou des bâtiments.
    reason: lexical_alternative
  - marker: b
    text: Ou « affection squameuse ». Le terme hébreu désigne une affection particulière, surtout du cuir chevelu ou de la barbe, mais son équivalent médical exact est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: Voici la loi
  rationale: La formule hébraïque introduit une récapitulation juridique. « Voici la loi » est une tournure française naturelle et digne qui conserve la portée normative de תּוֹרָה.
- source_word: לְכָל נֶגַע הַצָּרַעַת
  choice: concernant toute atteinte de lèpre
  rationale: לְכָל indique ici le champ d’application de la règle. נֶגַע désigne une atteinte ou manifestation soumise à examen. « Atteinte de lèpre » garde le terme biblique traditionnel tout en évitant d’identifier directement צָרַעַת à une maladie moderne précise; une note explicite cette réserve.
- source_word: וְלַנָּתֶק
  choice: et la teigne
  rationale: נֶתֶק désigne une affection particulière du cuir chevelu ou de la barbe en Lévitique 13. « Teigne » est le terme français traditionnel et compréhensible, mais son équivalence médicale n’est pas certaine; cette incertitude est signalée en note.
