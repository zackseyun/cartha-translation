  to: Le prêtre mettra un peu de l’huile qui est dans sa paume sur le lobe de l’oreille droite de la personne en cours de purification, sur le pouce de sa main droite et sur le gros orteil de son pied droit, à l’endroit où le sang du sacrifice de réparation avait été appliqué.[a]
  rationale: La correction remplace une affirmation non exprimée de présence actuelle du sang par une référence contextuelle à son application antérieure. Elle conserve le sens spatial de l’hébreu, l’enchaînement rituel et un français international naturel.
