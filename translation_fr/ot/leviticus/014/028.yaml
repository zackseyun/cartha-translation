  text: וְ/נָתַ֨ן הַ/כֹּהֵ֜ן מִן הַ/שֶּׁ֣מֶן אֲשֶׁ֣ר עַל כַּפּ֗/וֹ עַל תְּנ֞וּךְ אֹ֤זֶן הַ/מִּטַּהֵר֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִ֑ית עַל מְק֖וֹם דַּ֥ם הָ/אָשָֽׁם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/028.yaml
  text: And the priest shall put some of the oil that is on his palm on the lobe of the right ear of the one being cleansed[a], and on the thumb of his right hand, and on the big toe of his right foot, on the place of the guilt-offering blood.
translation:
  language: fr
  text: Le prêtre mettra un peu de l’huile qui est dans sa paume sur le lobe de l’oreille droite de la personne en cours de purification, sur le pouce de sa main droite et sur le gros orteil de son pied droit, à l’endroit où le sang du sacrifice de réparation avait été appliqué.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur l’endroit du sang du sacrifice de réparation ».'
    reason: La formule hébraïque renvoie à l’endroit où le sang du sacrifice de réparation avait été appliqué auparavant dans le rite.
lexical_decisions:
- source_word: וְנָתַן
  choice: mettra
  rationale: Dans ce geste rituel, « mettre » rend naturellement le sens large de נתן sans préciser outre mesure la manière d’appliquer l’huile.
- source_word: מִן הַשֶּׁמֶן
  choice: un peu de l’huile
  rationale: Cette formulation française exprime naturellement la valeur partitive de מִן.
- source_word: אֲשֶׁר עַל כַּפּוֹ
  choice: qui est dans sa paume
  rationale: כַּף désigne ici la paume ou le creux de la main du prêtre ; en français, l’huile est idiomatiquement dite « dans » la paume.
- source_word: תְּנוּךְ אֹזֶן
  choice: le lobe de l’oreille
  rationale: Dans ces prescriptions rituelles, תְּנוּךְ désigne le lobe de l’oreille ; c’est le terme anatomique moderne le plus clair.
- source_word: הַמִּטַּהֵר
  choice: la personne en cours de purification
  rationale: Le participe hitpael présente la personne engagée dans le processus de purification rituelle, sans laisser entendre que le processus est déjà achevé.
- source_word: בֹּהֶן יָדוֹ
  choice: le pouce de sa main
  rationale: Pour la main, בֹּהֶן désigne précisément le pouce.
- source_word: בֹּהֶן רַגְלוֹ
  choice: le gros orteil de son pied
  rationale: Pour le pied, בֹּהֶן correspond au gros orteil, expression française courante et précise.
- source_word: עַל מְקוֹם דַּם הָאָשָׁם
  choice: à l’endroit où se trouve le sang du sacrifice de réparation
  rationale: La formulation rend explicitement et naturellement מְקוֹם, « endroit », tout en conservant le rapport spatial avec le sang déjà appliqué au cours du rite.
theological_decisions:
- issue: Traduction de אָשָׁם
  choice: sacrifice de réparation
  alternative: sacrifice de culpabilité
  rationale: אָשָׁם peut désigner la faute, la réparation due et l’offrande correspondante. « Sacrifice de réparation » rend bien la fonction cultuelle et compensatoire du terme sans réduire son sens à un sentiment subjectif de culpabilité.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la répétition rituelle des trois parties droites du corps, tout en employant une syntaxe naturelle.
