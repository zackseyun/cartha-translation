id: LEV.14.52
reference: Leviticus 14:52
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/חִטֵּ֣א אֶת הַ/בַּ֔יִת בְּ/דַם֙ הַ/צִּפּ֔וֹר וּ/בַ/מַּ֖יִם הַֽ/חַיִּ֑ים וּ/בַ/צִּפֹּ֣ר הַ/חַיָּ֗ה וּ/בְ/עֵ֥ץ הָ/אֶ֛רֶז וּ/בָ/אֵזֹ֖ב וּ/בִ/שְׁנִ֥י הַ/תּוֹלָֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/052.yaml
  text: Thus he shall cleanse the house with the blood of the bird[a], with the living water, with the live bird, with cedar wood, with hyssop[b], and with scarlet yarn.
translation:
  language: fr
  text: Il purifiera ainsi la maison avec le sang de l’oiseau, l’eau vive[a], l’oiseau vivant, le bois de cèdre, l’hysope et le fil écarlate[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’eau fraîche » ou « l’eau courante » ; littéralement « l’eau vivante », expression hébraïque désignant l’eau provenant d’une source fraîche et courante.
    reason: lexical_alternative
  - marker: b
    text: Ou « la laine écarlate ». L’expression hébraïque désigne une matière teinte en écarlate utilisée dans le rite de purification.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִטֵּא
  choice: Il purifiera ainsi
  rationale: Au piel, חטא désigne ici l’action rituelle de purifier ou de décontaminer. « Ainsi » relie naturellement cette conclusion aux gestes décrits auparavant.
- source_word: הַבַּיִת
  choice: la maison
  rationale: Le terme désigne le bâtiment soumis au rite de purification.
- source_word: בְּדַם הַצִּפּוֹר
  choice: avec le sang de l’oiseau
  rationale: La préposition ב indique ici le moyen employé dans le rite.
- source_word: וּבַמַּיִם הַחַיִּים
  choice: l’eau vive
  rationale: L’expression hébraïque signifie littéralement « eau vivante » et désigne une eau fraîche provenant d’une source courante. « Eau vive » conserve l’image et correspond à l’expression biblique française traditionnelle.
- source_word: וּבַצִּפֹּר הַחַיָּה
  choice: l’oiseau vivant
  rationale: Cette formulation distingue clairement cet oiseau de celui qui a été immolé.
- source_word: וּבְעֵץ הָאֶרֶז
  choice: le bois de cèdre
  rationale: עֵץ suivi du nom de l’arbre désigne ici le bois utilisé dans le rite.
- source_word: וּבָאֵזֹב
  choice: l’hysope
  rationale: « Hysope » est le terme biblique usuel, même si l’identification botanique exacte de la plante reste discutée.
- source_word: וּבִשְׁנִי הַתּוֹלָעַת
  choice: le fil écarlate
  rationale: L’expression désigne une matière teinte en écarlate, vraisemblablement du fil employé dans le rite.
theological_decisions:
- issue: Sens rituel du verbe חטא au piel
  choice: purifier
  alternative: faire l’expiation pour / purger
  rationale: Dans ce contexte, le verbe décrit la purification rituelle de la maison; « purifier » exprime ce sens sans suggérer que le bâtiment aurait commis une faute morale.
translation_notes:
  register: Français international moderne, clair et digne. La répétition hébraïque de la préposition instrumentale est rendue par un seul « avec » devant une liste naturelle en français. « Eau vive » et « hysope » conservent le vocabulaire rituel biblique sans alourdir le verset.
