base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/014.yaml
  text: Then the priest shall take some of the blood of the guilt offering[a], and the priest shall put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: fr
  text: Le prêtre prendra du sang du sacrifice de réparation[a], et le prêtre en mettra sur le lobe[b] de l’oreille droite de la personne en train d’être purifiée, sur le pouce de sa main droite et sur le gros orteil de son pied droit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de culpabilité ».
    reason: lexical_alternative
  - marker: b
    text: Ou « l’extrémité de l’oreille ». Le terme hébreu désigne une partie extérieure de l’oreille, probablement le lobe.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּם
  choice: du sang
  rationale: 'La préposition מִן a ici une valeur partitive : le prêtre prélève une partie du sang. En français, « prendre du sang » exprime naturellement ce sens sans laisser entendre qu’il prend tout le sang.'
- source_word: הָאָשָׁם
  choice: sacrifice de réparation
  rationale: Dans ce contexte rituel, אָשָׁם désigne l’offrande liée à une faute et à sa réparation. « Sacrifice de réparation » est clair en français moderne et évite de réduire le terme au seul sentiment subjectif de culpabilité.
- source_word: תְּנוּךְ אֹזֶן
  choice: le lobe de l’oreille
  rationale: תְּנוּךְ désigne l’extrémité ou la partie souple de l’oreille dans ces prescriptions rituelles. « Lobe » est l’équivalent anatomique français le plus naturel, tout en laissant « extrémité » comme possibilité en note.
- source_word: הַמִּטַּהֵר
  choice: la personne en cours de purification
  rationale: Le participe hitpael désigne ici la personne qui passe par le rite de purification. Cette formulation française rend le processus sans suggérer qu’elle accomplit seule sa propre purification.
- source_word: בֹּהֶן יָדוֹ
  choice: le pouce de sa main
  rationale: Avec יָד, בֹּהֶן désigne le pouce. La formulation explicite correspond au parallélisme anatomique de l’hébreu.
- source_word: בֹּהֶן רַגְלוֹ
  choice: le gros orteil de son pied
  rationale: Avec רֶגֶל, בֹּהֶן désigne le gros orteil. C’est l’expression courante en français moderne.
- source_word: וְלָקַח ... וְנָתַן
  choice: prendra ... mettra
  rationale: Dans cette procédure légale, les formes verbales prescrivent les gestes à accomplir. Le futur français convient naturellement au registre des instructions rituelles.
theological_decisions:
- issue: Situation de la personne soumise au rite de purification
  choice: la personne est présentée comme étant en cours de purification
  alternative: la personne qui se purifie elle-même ; la personne déjà purifiée
  rationale: Le contexte décrit un rite sacerdotal encore en cours. La traduction évite à la fois d’attribuer une purification autonome à la personne et d’anticiper l’achèvement du rite.
- issue: Sens cultuel de אָשָׁם
  choice: sacrifice de réparation
  alternative: sacrifice de culpabilité ; sacrifice pour la faute
  rationale: Le terme peut associer faute, responsabilité et réparation. Le choix retenu rend la fonction cultuelle sans imposer une interprétation purement psychologique de la culpabilité.
translation_notes:
  register: Français international moderne, clair et digne. Le futur garde la valeur prescriptive du texte légal. Les répétitions anatomiques sont conservées pour respecter la précision rituelle, tandis que la seconde mention explicite du prêtre est rendue par « il » afin d’éviter une lourdeur inutile.
