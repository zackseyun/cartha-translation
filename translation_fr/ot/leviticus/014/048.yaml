id: LEV.14.48
reference: Leviticus 14:48
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם בֹּ֨א יָבֹ֜א הַ/כֹּהֵ֗ן וְ/רָאָה֙ וְ֠/הִנֵּה לֹא פָשָׂ֤ה הַ/נֶּ֨גַע֙ בַּ/בַּ֔יִת אַחֲרֵ֖י הִטֹּ֣חַ אֶת הַ/בָּ֑יִת וְ/טִהַ֤ר הַ/כֹּהֵן֙ אֶת הַ/בַּ֔יִת כִּ֥י נִרְפָּ֖א הַ/נָּֽגַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/048.yaml
  text: But if the priest comes in and looks[a], and behold, the disease has not spread in the house after the house was plastered, then the priest shall pronounce the house clean[b], because the disease is healed.
translation:
  language: fr
  text: Mais si le prêtre entre, examine et constate que l’atteinte[a] ne s’est pas étendue dans la maison après que celle-ci a été enduite, il déclarera la maison pure[b], car l’atteinte est guérie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire «l’affection» ou, selon la formulation traditionnelle, «le fléau». Le terme hébreu désigne ici le phénomène qui touche la maison.
    reason: lexical_alternative
  - marker: b
    text: Ou «il purifiera la maison». Dans ce contexte, le verbe hébreu peut désigner la déclaration sacerdotale de pureté.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit la situation conditionnelle qui contraste avec le cas précédent dans la procédure.
- source_word: בֹּא יָבֹא
  choice: entre
  rationale: L’infinitif absolu renforce le verbe, mais le français exprime naturellement ici l’action procédurale sans redoublement.
- source_word: וְרָאָה וְהִנֵּה
  choice: examine et constate que
  rationale: Rend l’inspection du prêtre et le marqueur qui attire l’attention sur son résultat, dans un français juridique naturel.
- source_word: לֹא פָשָׂה
  choice: ne s’est pas étendue
  rationale: Le verbe désigne la propagation de l’atteinte; «s’étendre» convient bien à une maison.
- source_word: הַנֶּגַע
  choice: l’atteinte
  rationale: Terme suffisamment large pour la condition touchant la maison, sans imposer un diagnostic médical moderne ni évoquer nécessairement une épidémie.
- source_word: אַחֲרֵי הִטֹּחַ אֶת־הַבָּיִת
  choice: après que celle-ci a été enduite
  rationale: טוח désigne l’application d’un enduit; la tournure passive respecte l’absence d’agent exprimé.
- source_word: וְטִהַר הַכֹּהֵן אֶת־הַבַּיִת
  choice: il déclarera la maison pure
  rationale: Dans cette procédure sacerdotale, le verbe exprime la reconnaissance officielle de l’état de pureté plutôt qu’un nettoyage matériel accompli ici par le prêtre.
- source_word: כִּי נִרְפָּא הַנָּגַע
  choice: car l’atteinte est guérie
  rationale: Conserve la métaphore explicite de guérison portée par רפא, même lorsqu’elle s’applique à l’atteinte d’une maison.
theological_decisions:
- issue: Déclaration rituelle ou purification matérielle dans וְטִהַר
  choice: Le prêtre déclarera la maison pure
  alternative: Le prêtre purifiera la maison
  rationale: Le contexte légal attribue au prêtre l’inspection et la reconnaissance de la pureté. Cette formulation n’insinue pas qu’il effectue lui-même une nouvelle opération matérielle.
translation_notes:
  register: Français international moderne, sobre et digne. «Examine et constate» rend naturellement la séquence d’inspection, tandis que «est guérie» conserve volontairement l’image hébraïque appliquée à la maison.
