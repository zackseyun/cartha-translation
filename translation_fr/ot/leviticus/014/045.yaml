  verdict: revise
  source_fidelity: 'Le verset est globalement fidèle : la démolition, les pierres, les éléments de bois, le matériau terreux/enduit et la destination hors de la ville vers un lieu rituellement impur sont tous conservés. Toutefois, « fera transporter » introduit inutilement l’idée que le sujet charge autrui du transport. Le hiphil de יצא signifie ici naturellement qu’il emporte/évacue les matériaux ; sa valeur causative morphologique ne requiert pas une périphrase française de délégation.'
  naturalness: Le français est moderne et clair. La coordination encadrée par les tirets est recevable. « Il transportera le tout » est plus direct et idiomatique que « fera transporter le tout », tout en maintenant la référence collective aux matériaux.
  terminology: « Lieu impur » rend adéquatement le terme rituel טָמֵא sans implication morale. « Enduit » est une interprétation contextuellement plausible de עָפָר ; la note conserve à juste titre le sens littéral et les possibilités matérielles, ce qui préserve l’ambiguïté lexicale.
