  text: וְ/נָתַ֣ץ אֶת הַ/בַּ֗יִת אֶת אֲבָנָי/ו֙ וְ/אֶת עֵצָ֔י/ו וְ/אֵ֖ת כָּל עֲפַ֣ר הַ/בָּ֑יִת וְ/הוֹצִיא֙ אֶל מִ/ח֣וּץ לָ/עִ֔יר אֶל מָק֖וֹם טָמֵֽא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/045.yaml
  text: Then he shall tear down the house—its stones[a], its timbers, and all the plaster of the house—and carry them out to an unclean place outside the city.
translation:
  language: fr
  text: Il démolira la maison — ses pierres, ses pièces de bois et tout l’enduit[a] de la maison — et transportera le tout hors de la ville, dans un lieu impur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toute la poussière de la maison » ; il peut s’agir de la terre, du mortier ou de l’enduit provenant des murs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַץ
  choice: Il démolira
  rationale: Le verbe נתץ désigne ici la destruction complète de la maison contaminée. « Démolira » est précis, naturel et conserve la forme active à la troisième personne du masculin singulier.
- source_word: הַבַּיִת
  choice: la maison
  rationale: בית désigne ici le bâtiment soumis à l’examen et à la démolition.
- source_word: אֲבָנָיו
  choice: ses pierres
  rationale: La traduction concrète et littérale convient à la description du démontage de la construction.
- source_word: עֵצָיו
  choice: ses pièces de bois
  rationale: Le pluriel désigne les éléments en bois de la maison. « Pièces de bois » est plus naturel et moins restrictif que « poutres ».
- source_word: כָּל עֲפַר הַבָּיִת
  choice: tout l’enduit de la maison
  rationale: עפר signifie littéralement « poussière » ou « terre », mais, dans ce contexte de murs raclés et de matériaux de construction, il désigne vraisemblablement l’enduit ou les matériaux terreux qui recouvrent les murs. Une note conserve le sens littéral et les autres possibilités.
- source_word: וְהוֹצִיא
  choice: et fera transporter le tout
  rationale: La forme causative exprime le fait de faire sortir les matériaux. Cette formulation française naturelle conserve la valeur causative sans préciser qui les transporte.
- source_word: אֶל מִחוּץ לָעִיר
  choice: hors de la ville
  rationale: La formule exprime un déplacement au-delà des limites de la ville.
- source_word: אֶל מָקוֹם טָמֵא
  choice: dans un lieu impur
  rationale: « Impur » rend le terme rituel טמא de manière claire et cohérente en français moderne.
theological_decisions:
- issue: Traduction du vocabulaire de pureté rituelle
  choice: impur
  alternative: souillé
  rationale: Dans le Lévitique, טמא appartient au système juridique et cultuel de pureté. « Impur » exprime ce statut rituel sans le réduire à une saleté matérielle ou à une faute morale.
translation_notes:
  register: Français international moderne, digne et direct. Les tirets mettent en relief les éléments constitutifs de la maison sans modifier leur relation grammaticale avec « démolira ». La répétition de « la maison » est conservée pour rester proche de la formulation hébraïque.
