  naturalness: « Quelque chose qui ressemble à une atteinte » est compréhensible, mais assez lourd et peu idiomatique en français courant. « Une sorte de plaie m’est apparue » est plus naturel dans un registre biblique moderne tout en restant non médical et non définitif.
  terminology: « Plaie » est un rendu français établi et suffisamment large pour נגע dans ce contexte rituel; il ne faut pas l’assimiler à une maladie moderne. « Une sorte de » préserve la valeur approximative de כ־. « Dire au prêtre » est plus neutre et fidèle que « avertir le prêtre ».
