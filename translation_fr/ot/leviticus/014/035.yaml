  text: then the owner of the house shall come and tell the priest[a], saying, ‘Something like a plague has appeared to me in the house.’
translation:
  language: fr
  text: 'Alors, le propriétaire de la maison viendra dire au prêtre : « Une sorte de plaie m’est apparue dans la maison. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָא
  choice: Alors, … viendra
  rationale: Dans cette procédure légale, le parfait précédé de la conjonction marque l’étape suivante. « Alors » et le futur rendent naturellement cette progression en français.
- source_word: אֲשֶׁר לוֹ הַבַּיִת
  choice: le propriétaire de la maison
  rationale: L’expression signifie littéralement « celui à qui appartient la maison ». « Le propriétaire de la maison » est une formulation française naturelle et précise.
- source_word: וְהִגִּיד לַכֹּהֵן
  choice: avertir le prêtre
  rationale: Le hiphil de נגד signifie faire savoir ou signaler. « Avertir » convient au signalement officiel d’un problème constaté, sans impliquer que le propriétaire établit lui-même le diagnostic.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Cette formule introduit les paroles rapportées et se rend naturellement ainsi en français.
- source_word: כְּנֶגַע
  choice: quelque chose qui ressemble à une atteinte
  rationale: La préposition כְּ exprime ici la ressemblance ou l’approximation. נֶגַע désigne dans ce contexte lévitique une zone touchée ou une manifestation nuisible; « atteinte » reste assez large pour ne pas imposer une catégorie médicale moderne.
- source_word: נִרְאָה לִי
  choice: est apparu
  rationale: Le niphal de ראה peut signifier « apparaître ». La perspective limitée de l’observateur est déjà rendue par « quelque chose qui ressemble à », ce qui évite un français inutilement lourd.
- source_word: בַּבָּיִת
  choice: dans la maison
  rationale: La préposition בְּ situe l’atteinte dans la maison considérée comme bâtiment.
theological_decisions:
- issue: Degré de certitude du propriétaire
  choice: Maintenir explicitement le caractère seulement apparent de l’atteinte
  alternative: Présenter directement la maison comme atteinte d’un fléau ou de la lèpre
  rationale: Le כְּ initial indique que le propriétaire signale une ressemblance; il ne prononce pas le diagnostic rituel, qui relève du prêtre dans la suite de la procédure.
translation_notes:
  register: Français international moderne, clair et digne. « Atteinte » évite l’anachronisme médical de « lèpre » appliqué à une maison, tandis que la tournure « ressemble à » préserve la prudence du témoignage.
