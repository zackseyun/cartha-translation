  text: and for a skin disease in a garment or in a house,[a]
translation:
  language: fr
  text: et pour une atteinte[a] affectant un vêtement ou une maison,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu tsaraʿat est traditionnellement traduit par « lèpre », mais, dans le Lévitique, il désigne plus largement diverses affections ou altérations, notamment celles qui touchent des vêtements et des maisons.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְ
  choice: ainsi que pour
  rationale: La conjonction et la préposition poursuivent l’énumération des cas auxquels s’applique la loi exposée dans le contexte précédent.
- source_word: צָרַעַת
  choice: atteinte
  rationale: Le terme hébreu désigne dans le Lévitique diverses affections ou altérations, y compris celles qui touchent des vêtements et des maisons. « Atteinte » reste assez large pour couvrir ici des réalités non humaines sans imposer un diagnostic moderne.
- source_word: הַבֶּגֶד
  choice: un vêtement
  rationale: Bien que l’hébreu emploie l’article, le singulier indéfini exprime naturellement en français la valeur générique du nom dans cette liste.
- source_word: וְלַבָּיִת
  choice: ou une maison
  rationale: La conjonction coordonne deux lieux possibles de la même atteinte. « Ou » rend clairement la distribution entre le vêtement et la maison; la préposition « sur », placée avant le premier terme, porte naturellement sur les deux.
theological_decisions: []
translation_notes:
  register: Formulation moderne, concise et digne. Le verset demeure un membre d’énumération, d’où la virgule finale. Le choix général « atteinte » évite l’expression « maladie de peau », inadaptée à un vêtement ou à une maison, tout en conservant l’étendue et l’ambiguïté du terme hébreu.
