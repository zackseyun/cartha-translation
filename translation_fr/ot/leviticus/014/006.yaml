  text: אֶת הַ/צִּפֹּ֤ר הַֽ/חַיָּה֙ יִקַּ֣ח אֹתָ֔/הּ וְ/אֶת עֵ֥ץ הָ/אֶ֛רֶז וְ/אֶת שְׁנִ֥י הַ/תּוֹלַ֖עַת וְ/אֶת הָ/אֵזֹ֑ב וְ/טָבַ֨ל אוֹתָ֜/ם וְ/אֵ֣ת הַ/צִּפֹּ֣ר הַֽ/חַיָּ֗ה בְּ/דַם֙ הַ/צִּפֹּ֣ר הַ/שְּׁחֻטָ֔ה עַ֖ל הַ/מַּ֥יִם הַֽ/חַיִּֽים־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/006.yaml
  text: As for the living bird, he shall take it, along with the cedar wood, the scarlet yarn, and the hyssop, and dip them and the living bird in the blood of the bird that was slaughtered over the fresh water.
translation:
  language: fr
  text: Quant à l’oiseau vivant, il le prendra avec le bois de cèdre, le fil écarlate et l’hysope, puis il les trempera, ainsi que l’oiseau vivant, dans le sang de l’oiseau égorgé au-dessus de l’eau vive.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « eau vivante »; on peut aussi comprendre « eau courante » ou « eau fraîche ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּפֹּר הַחַיָּה
  choice: l’oiseau vivant
  rationale: Rend directement l’adjectif חַיָּה et maintient le contraste rituel avec l’oiseau égorgé.
- source_word: יִקַּח
  choice: il le prendra
  rationale: Le futur français exprime naturellement ici la prescription légale de l’imparfait hébreu.
- source_word: עֵץ הָאֶרֶז
  choice: le bois de cèdre
  rationale: Traduction naturelle du syntagme construit désignant le matériau rituel.
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: le fil écarlate
  rationale: Désigne de façon compréhensible la matière textile teinte en écarlate; la nature exacte de l’objet n’est pas davantage précisée par l’hébreu.
- source_word: הָאֵזֹב
  choice: l’hysope
  rationale: Équivalent traditionnel et transparent du nom de cette plante rituelle, malgré une identification botanique discutée.
- source_word: וְטָבַל
  choice: puis il les trempera
  rationale: « Tremper » rend idiomatiquement l’immersion brève indiquée par טבל; « puis » clarifie la succession sans ajouter de contenu.
- source_word: הַצִּפֹּר הַשְּׁחֻטָה
  choice: l’oiseau égorgé
  rationale: « Égorgé » conserve la nuance d’abattage rituel de שׁחט avec concision.
- source_word: עַל הַמַּיִם הַחַיִּים
  choice: au-dessus de l’eau vive
  rationale: Conserve l’expression imagée littérale de l’hébreu et son ambiguïté, tout en signalant en note son sens concret possible.
theological_decisions:
- issue: Sens de מַיִם חַיִּים dans le rite de purification
  choice: eau vive
  alternative: eau courante / eau fraîche
  rationale: « Eau vive » reproduit au plus près l’expression hébraïque sans réduire son image à une seule explication; la note donne les équivalents concrets possibles et évite d’imposer une lecture théologique ultérieure.
translation_notes:
  register: Français international moderne, digne et prescriptif. La répétition de « l’oiseau vivant » est conservée parce qu’elle structure l’instruction hébraïque. Le marqueur [a] figure dans le texte principal.
