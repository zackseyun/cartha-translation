id: LEV.14.49
reference: Leviticus 14:49
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לָקַ֛ח לְ/חַטֵּ֥א אֶת הַ/בַּ֖יִת שְׁתֵּ֣י צִפֳּרִ֑ים וְ/עֵ֣ץ אֶ֔רֶז וּ/שְׁנִ֥י תוֹלַ֖עַת וְ/אֵזֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/049.yaml
  text: And he shall take, to purify the house from sin, two birds, cedar wood, scarlet yarn, and hyssop.
translation:
  language: fr
  text: Il prendra, pour purifier la maison[a], deux oiseaux, du bois de cèdre, du fil écarlate[b] et de l’hysope.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour ôter l’impureté de la maison ». Le verbe hébreu désigne ici une purification rituelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « de l’étoffe écarlate ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Il prendra
  rationale: Le parfait qal précédé de la conjonction poursuit ici une série de prescriptions rituelles et prend une valeur injonctive ou future. Le futur français exprime naturellement cette instruction.
- source_word: לְחַטֵּא אֶת הַבַּיִת
  choice: pour purifier la maison
  rationale: Au piel et dans ce contexte rituel, חטא désigne l’action d’ôter une souillure. « Purifier » conserve cette portée cultuelle sans suggérer que la maison serait moralement coupable ni ajouter explicitement « du péché », absent du texte.
- source_word: שְׁתֵּי צִפֳּרִים
  choice: deux oiseaux
  rationale: L’hébreu de ce verset dit simplement « deux oiseaux » ; il ne convient pas d’y ajouter « vivants », même si cette précision apparaît dans le contexte voisin.
- source_word: וְעֵץ אֶרֶז
  choice: du bois de cèdre
  rationale: Traduction directe et idiomatique du syntagme construit désignant le matériau employé dans le rite.
- source_word: וּשְׁנִי תוֹלַעַת
  choice: du fil écarlate
  rationale: L’expression désigne une matière teinte d’un rouge écarlate produit traditionnellement à partir d’une cochenille. « Fil écarlate » est clair en français moderne, tout en laissant en note l’autre possibilité « étoffe écarlate ».
- source_word: וְאֵזֹב
  choice: de l’hysope
  rationale: « Hysope » est l’équivalent traditionnel et reconnu, bien que l’identification botanique précise de la plante biblique demeure discutée.
theological_decisions:
- issue: Portée rituelle de לְחַטֵּא appliqué à une maison
  choice: pour purifier la maison
  alternative: pour ôter l’impureté de la maison ; pour purifier la maison du péché
  rationale: La maison est l’objet d’une purification cultuelle liée à une atteinte ou souillure, non d’un pardon moral. La traduction retient la valeur rituelle du piel sans expliciter un mécanisme d’expiation ni introduire « du péché », qui risquerait de surtraduire.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve la valeur prescriptive du passage tout en plaçant le complément de but de façon naturelle. Les termes rituels restent accessibles sans effacer leur portée propre.
