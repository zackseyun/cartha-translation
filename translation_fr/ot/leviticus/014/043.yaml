id: LEV.14.43
reference: Leviticus 14:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם יָשׁ֤וּב הַ/נֶּ֨גַע֙ וּ/פָרַ֣ח בַּ/בַּ֔יִת אַחַ֖ר חִלֵּ֣ץ אֶת הָ/אֲבָנִ֑ים וְ/אַחֲרֵ֛י הִקְצ֥וֹת אֶת הַ/בַּ֖יִת וְ/אַחֲרֵ֥י הִטּֽוֹחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/043.yaml
  text: But if the disease returns and breaks out in the house after he has removed the stones[a], and after he has scraped the house, and after it has been plastered,
translation:
  language: fr
  text: Mais si l’atteinte revient et se propage dans la maison après qu’on a retiré les pierres[a], après qu’on a raclé la maison et après qu’on l’a enduite de mortier,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «l’infection» ou «la lésion». Le terme hébreu néga‘ désigne dans le Lévitique une atteinte identifiable pouvant toucher une personne, un vêtement ou une maison.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit la suite conditionnelle de la procédure tout en marquant un contraste avec les mesures précédentes.
- source_word: יָשׁוּב
  choice: revient
  rationale: Exprime simplement la réapparition de l’atteinte.
- source_word: הַנֶּגַע
  choice: l’atteinte
  rationale: Terme assez large pour le נגע lévitique, qui peut toucher des personnes, des vêtements ou des maisons, sans assimiler abusivement le phénomène à une maladie humaine.
- source_word: וּפָרַח
  choice: se propage
  rationale: Le verbe évoque littéralement le fait de bourgeonner; dans ce contexte, il décrit le développement visible de l’atteinte dans la maison.
- source_word: בַּבַּיִת
  choice: dans la maison
  rationale: Rend naturellement la valeur locative de la préposition.
- source_word: אַחַר חִלֵּץ אֶת הָאֲבָנִים
  choice: après qu’on a retiré les pierres
  rationale: Renvoie à l’enlèvement prescrit des pierres atteintes; le pronom indéfini évite d’imposer au texte français un sujet que l’hébreu ne précise pas ici.
- source_word: וְאַחֲרֵי הִקְצוֹת אֶת הַבַּיִת
  choice: après qu’on a raclé la maison
  rationale: Conserve l’action physique précise de racler les surfaces de la maison.
- source_word: וְאַחֲרֵי הִטּוֹחַ
  choice: après qu’on l’a enduite de mortier
  rationale: טוח désigne l’application d’un enduit; «de mortier» rend concrètement le matériau déjà mentionné dans la procédure du verset 42, tandis que le sujet indéfini respecte l’absence de sujet explicite.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et procédural. La répétition de «après» conserve la structure cumulative de l’hébreu. La phrase reste ouverte par une virgule, puisque la condition se poursuit au verset suivant.
