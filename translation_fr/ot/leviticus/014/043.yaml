  source_fidelity: 'Le texte rend fidèlement la condition procédurale : le retour de la négaʿ, son développement dans la maison, puis les trois actions antérieures d’enlèvement des pierres, de raclage et d’application d’un enduit. « Mais si », « revient », « dans la maison » et la répétition de « après » reflètent bien la syntaxe et la progression du texte hébreu. « Se propage » est une expression contextuellement juste pour פָּרַח, dont l’image végétale décrit ici la réapparition ou l’extension visible de l’atteinte.'
