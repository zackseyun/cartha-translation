id: LEV.14.31
reference: Leviticus 14:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֵ֣ת אֲשֶׁר תַּשִּׂ֞יג יָד֗/וֹ אֶת הָ/אֶחָ֥ד חַטָּ֛את וְ/אֶת הָ/אֶחָ֥ד עֹלָ֖ה עַל הַ/מִּנְחָ֑ה וְ/כִפֶּ֧ר הַ/כֹּהֵ֛ן עַ֥ל הַ/מִּטַּהֵ֖ר לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/031.yaml
  text: whatever his means can afford[a], one as a sin offering and one as a burnt offering, along with the grain offering[b]. Thus the priest shall make atonement for the one being cleansed before Yahweh.
translation:
  language: fr
  text: 'Il offrira ce que ses moyens lui permettent[a] : l’un en sacrifice pour le péché[b] et l’autre en holocauste, avec l’offrande de céréales. Le prêtre fera ainsi l’expiation pour celui qui se purifie, devant Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ce que sa main atteint » ; c’est-à-dire ce qu’il a les moyens de fournir.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sacrifice de purification ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: ce que ses moyens lui permettent
  rationale: L’expression signifie littéralement « ce que sa main atteint » et désigne ici ce que la personne a les moyens de fournir. La formulation française en restitue naturellement le sens économique.
- source_word: חַטָּאת
  choice: sacrifice pour le péché
  rationale: Dans le contexte sacrificiel du Lévitique, ce terme désigne l’offrande liée au péché et à la purification rituelle. La traduction retenue est traditionnelle et immédiatement compréhensible, tandis que l’autre valeur possible est signalée en note.
- source_word: עֹלָה
  choice: holocauste
  rationale: Terme français établi pour le sacrifice entièrement consumé, correspondant à l’idée de l’offrande qui « monte » en fumée.
- source_word: עַל הַמִּנְחָה
  choice: avec l’offrande de céréales
  rationale: Dans cette procédure sacrificielle, עַל marque l’accompagnement ou l’ajout, et non une position spatiale.
- source_word: וְכִפֶּר
  choice: fera ainsi l’expiation
  rationale: Cette formulation conserve la portée cultuelle du verbe כפר sans imposer une théorie doctrinale plus précise que le texte.
- source_word: הַמִּטַּהֵר
  choice: celui qui se purifie
  rationale: Le participe désigne la personne engagée dans le processus rituel de purification.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: La formulation rend directement l’idée d’être devant ou en présence de Yahweh et conserve le nom divin.
theological_decisions:
- issue: Terminologie du sacrifice et portée de l’expiation
  choice: « sacrifice pour le péché », « holocauste » et « fera l’expiation »
  alternative: « sacrifice de purification » et « accomplira la purification rituelle »
  rationale: Les termes retenus préservent le langage cultuel du texte hébreu sans réduire חַטָּאת à une seule de ses dimensions ni définir plus étroitement le mécanisme de l’expiation.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: La translittération conserve dans le texte français le caractère personnel du nom divin présent dans l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. « Il offrira » explicite le verbe sous-entendu par la continuité syntaxique avec le verset précédent. Le marqueur [b] est placé après « sacrifice pour le péché », expression à laquelle la variante se rapporte.
