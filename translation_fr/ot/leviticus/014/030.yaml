  text: וְ/עָשָׂ֤ה אֶת הָֽ/אֶחָד֙ מִן הַ/תֹּרִ֔ים א֖וֹ מִן בְּנֵ֣י הַ/יּוֹנָ֑ה מֵ/אֲשֶׁ֥ר תַּשִּׂ֖יג יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/030.yaml
  text: And he shall offer one of the turtledoves or one of the young pigeons[a], according to what his means can afford—
translation:
  language: fr
  text: Il offrira l’une des tourterelles ou l’un des jeunes pigeons, selon ce que ses moyens lui permettent[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de ce que sa main peut atteindre », expression hébraïque signifiant : selon ce qu’il peut se permettre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: Il offrira
  rationale: Bien que le verbe signifie couramment « faire », son emploi dans ce contexte sacrificiel désigne l’accomplissement d’une offrande. « Offrira » exprime naturellement ce sens cultuel.
- source_word: אֶת הָאֶחָד
  choice: l’une / l’un
  rationale: Le numéral désigne un seul animal parmi les deux catégories mentionnées. L’accord varie en français selon « tourterelles » et « pigeons ».
- source_word: מִן הַתֹּרִים
  choice: des tourterelles
  rationale: תֹּרִים désigne précisément des tourterelles dans la législation sacrificielle, plutôt que des colombes au sens générique.
- source_word: אוֹ מִן בְּנֵי הַיּוֹנָה
  choice: ou l’un des jeunes pigeons
  rationale: L’expression hébraïque désigne habituellement de jeunes pigeons. La reprise de « l’un » rend clairement le choix d’un animal.
- source_word: מֵאֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: selon ce que ses moyens lui permettent
  rationale: Littéralement, « parmi ce que sa main atteint ». Cette tournure hébraïque exprime les ressources dont une personne dispose; la formulation retenue en restitue le sens économique dans un français naturel.
theological_decisions: []
