revisions:
- from: Le prêtre sortira hors du camp et procédera à l’examen. S’il constate que l’affection cutanée[a] dont la personne était atteinte est guérie,
  to: Le prêtre sortira hors du camp et examinera la personne. Si l’affection cutanée[a] est guérie chez la personne atteinte,
  rationale: La révision rend explicitement l’examen de la personne, conservant ainsi l’action sacerdotale et son objet. Elle maintient le futur procédural, la phrase inachevée et le sens non médicalement spécifique de צרעת. « Si » exprime de manière idiomatique en français la situation vérifiée dans cette procédure, sans imposer une lecture doctrinale.
