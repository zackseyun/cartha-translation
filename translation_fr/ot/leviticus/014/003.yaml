  text: וְ/יָצָא֙ הַ/כֹּהֵ֔ן אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה וְ/רָאָה֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה נִרְפָּ֥א נֶֽגַע הַ/צָּרַ֖עַת מִן הַ/צָּרֽוּעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/003.yaml
  text: The priest shall go out to a place outside the camp[a], and the priest shall examine him; and behold, the disease of leprosy has been healed in the one with the skin disease,
translation:
  language: fr
  text: Le prêtre sortira hors du camp et examinera la personne. Si l’affection cutanée[a] est guérie chez la personne atteinte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traduction traditionnelle : « l’affection de lèpre chez la personne lépreuse ». Les termes hébreux ont un sens plus large et ne désignent pas nécessairement la lèpre moderne (maladie de Hansen).'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָצָא הַכֹּהֵן
  choice: Le prêtre sortira
  rationale: Dans ce contexte de procédure légale, la forme verbale prescrit l’action à accomplir; le futur français l’exprime naturellement.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: hors du camp
  rationale: Cette formulation française idiomatique conserve l’idée d’un déplacement vers l’extérieur du camp.
- source_word: וְרָאָה הַכֹּהֵן
  choice: et procédera à l’examen
  rationale: Le verbe ראה signifie littéralement « voir », mais désigne ici l’inspection officielle effectuée par le prêtre. La répétition du sujet, naturelle en hébreu, n’est pas nécessaire en français.
- source_word: וְהִנֵּה
  choice: S’il constate que
  rationale: Dans cette procédure, l’expression introduit le résultat observé lors de l’examen. Cette tournure rend sa fonction sans recourir à l’archaïsme « voici ».
- source_word: נִרְפָּא
  choice: est guérie
  rationale: Le nifal exprime ici l’état résultant d’une guérison.
- source_word: נֶגַע הַצָּרַעַת
  choice: l’affection cutanée
  rationale: Le terme נגע désigne une atteinte ou affection, tandis que צרעת recouvre dans ce contexte biblique diverses manifestations cutanées et ne correspond pas nécessairement à la maladie de Hansen.
- source_word: מִן הַצָּרוּעַ
  choice: dont la personne était atteinte
  rationale: La préposition מן marque la disparition de l’affection hors de la personne atteinte. La proposition relative exprime ce rapport clairement et naturellement en français.
theological_decisions:
- issue: Sens de צָרַעַת et de צָרוּעַ
  choice: affection cutanée / personne atteinte
  alternative: lèpre / lépreux
  rationale: Les mots hébreux désignent une catégorie biblique d’affections associées à l’impureté rituelle, sans se limiter à la lèpre moderne. Le choix retenu évite une identification médicale anachronique, tandis que la traduction traditionnelle est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La formulation suit le caractère procédural du passage, évite un vocabulaire médical anachronique et conserve la phrase ouverte sur la suite du texte.
