lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר avec le waw narratif introduit une nouvelle prise de parole. « Parla » convient à la formule récurrente du discours divin et reste naturel en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre, conformément au texte hébreu, plutôt que remplacé silencieusement par le titre traditionnel « le SEIGNEUR ».
- source_word: אֶל
  choice: à
  rationale: La préposition introduit ici le destinataire de la parole ; « à » est l’équivalent français idiomatique.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française usuelle du nom hébreu מֹשֶׁה.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif לֵאמֹר introduit le contenu du discours qui suit. « En ces termes » restitue naturellement cette fonction en français sans la tournure lourde « en disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve son statut de nom personnel et suit la translittération retenue, tandis que « le SEIGNEUR » est la substitution traditionnelle signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formule « parla à Moïse en ces termes » conserve la solennité de l’introduction hébraïque tout en évitant un calque peu naturel.
