  text: וְ/הֶעֱלָ֧ה הַ/כֹּהֵ֛ן אֶת הָ/עֹלָ֥ה וְ/אֶת הַ/מִּנְחָ֖ה הַ/מִּזְבֵּ֑חָ/ה וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן וְ/טָהֵֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/020.yaml
  text: Then the priest shall offer up the burnt offering and the grain offering on the altar[a], and the priest shall make atonement for him, and he shall be clean.
translation:
  language: fr
  text: Le prêtre offrira l’holocauste et l’offrande de céréales sur l’autel. Il fera l’expiation pour cet homme, et celui-ci sera pur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶעֱלָה
  choice: offrira
  rationale: Dans un contexte sacrificiel, le hiphil de עלה désigne l’action d’offrir sur l’autel, et non simplement d’apporter.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: עלה est le terme sacrificiel consacré pour l’offrande entièrement brûlée; « holocauste » demeure l’équivalent français biblique précis et usuel.
- source_word: הַמִּנְחָה
  choice: l’offrande de céréales
  rationale: Dans la législation du Lévitique, מנחה désigne ici l’offrande non animale préparée à partir de produits céréaliers.
- source_word: הַמִּזְבֵּחָה
  choice: sur l’autel
  rationale: La forme directionnelle exprime ici idiomatiquement le lieu où les offrandes sont présentées et consumées.
- source_word: וְכִפֶּר עָלָיו
  choice: fera l’expiation pour cet homme
  rationale: Dans ce cadre sacerdotal, כפר exprime l’accomplissement du rite d’expiation, tandis que עליו indique son bénéficiaire. « Cet homme » évite l’ambiguïté d’un simple pronom.
- source_word: וְטָהֵר
  choice: et celui-ci sera pur
  rationale: Le qal décrit l’état de pureté qui résulte du rite. « Celui-ci » identifie clairement l’homme concerné sans transformer l’énoncé en passif (« sera purifié »).
theological_decisions:
- issue: Nature de la pureté dans la législation sacerdotale
  choice: pureté rituelle exprimée par « sera pur »
  alternative: pureté morale ou « sera purifié »
  rationale: Le contexte de Lévitique 14 concerne le rétablissement rituel après une affection cutanée. La formulation simple conserve la catégorie du texte sans y introduire une transformation morale ni reformuler l’état résultant comme un processus passif.
translation_notes:
  register: Français moderne, clair et digne. Deux phrases allègent la longue coordination hébraïque tout en conservant l’ordre des actes. Le vocabulaire sacrificiel traditionnel est maintenu lorsqu’il reste précis et largement intelligible.
