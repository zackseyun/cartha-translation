  text: to give instruction about when it is unclean and when it is clean. This is the law concerning the defiling condition[a].
translation:
  language: fr
  text: afin d’enseigner quand il y a impureté et quand il y a pureté. Telle est la loi concernant l’affection qui rend impur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « lèpre ». Le terme hébreu peut désigner des affections rendant impurs des personnes, des étoffes ou des maisons ; il ne se limite pas à la maladie de Hansen moderne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹרֹת
  choice: afin d’indiquer
  rationale: Le hiphil exprime ici l’instruction autorisée permettant de déterminer l’état rituel; « indiquer » convient naturellement à cette formule récapitulative.
- source_word: בְּיוֹם הַטָּמֵא וּבְיוֹם הַטָּהֹר
  choice: quand il y a impureté et quand il y a pureté
  rationale: L’expression temporelle ne désigne pas deux jours calendaires, mais les circonstances où l’état impur ou pur doit être reconnu. La tournure impersonnelle évite d’ajouter un référent absent de l’hébreu.
- source_word: תּוֹרַת
  choice: la loi concernant
  rationale: Dans ce résumé législatif, תּוֹרָה désigne l’ensemble des prescriptions régissant la catégorie mentionnée.
- source_word: הַצָּרָעַת
  choice: l’affection qui rend impur
  rationale: Le terme hébreu couvre une catégorie rituelle pouvant toucher des personnes, des étoffes ou des maisons; cette formulation évite de la réduire à une maladie moderne précise.
theological_decisions:
- issue: Portée de צָרַעַת dans les lois de pureté du Lévitique
  choice: l’affection qui rend impur
  alternative: la lèpre; une maladie de peau
  rationale: Le contexte élargi des chapitres 13–14 inclut la peau humaine, les étoffes et les maisons. Le choix retenu rend l’effet rituel commun sans imposer une identification médicale anachronique.
translation_notes:
  register: Français international moderne, clair et digne. La formulation impersonnelle « il y a » conserve l’absence de référent explicite dans l’hébreu, tandis que « affection qui rend impur » maintient l’unité de la catégorie rituelle dans l’ensemble du passage.
