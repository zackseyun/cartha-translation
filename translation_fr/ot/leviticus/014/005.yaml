  text: Then the priest shall command that one bird be slaughtered over an earthenware vessel containing fresh water[a].
translation:
  language: fr
  text: Puis le prêtre ordonnera qu’on égorge l’un des oiseaux au-dessus d’un récipient de terre cuite, sur de l’eau vive[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « eau vivante »; c’est-à-dire de l’eau fraîche ou courante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: Puis … ordonnera
  rationale: Dans cette procédure rituelle, le waw suivi du parfait exprime l’étape suivante et prend naturellement en français une valeur future prescriptive.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Équivalent français courant de כֹּהֵן dans un contexte cultuel et juridique.
- source_word: וְשָׁחַט
  choice: qu’on égorge
  rationale: Après « ordonnera », le sujet de l’action n’est pas explicitement identifié. La tournure avec « on » conserve cette indétermination, tandis qu’« égorger » désigne précisément l’abattage rituel de l’oiseau.
- source_word: אֶת הַצִּפּוֹר הָאֶחָת
  choice: l’un des oiseaux
  rationale: La formule distingue un oiseau de la paire mentionnée au verset précédent; cette expression est naturelle en français et explicite correctement la relation partitive contextuelle.
- source_word: אֶל כְּלִי חֶרֶשׂ
  choice: au-dessus d’un récipient en terre cuite
  rationale: Dans ce contexte d’égorgement, le récipient est placé pour recueillir le sang. « Au-dessus de » rend naturellement la relation spatiale, et « récipient en terre cuite » traduit clairement le type de contenant.
- source_word: עַל מַיִם חַיִּים
  choice: contenant de l’eau vive
  rationale: La relation avec le récipient implique que l’eau s’y trouve déjà. « Eau vive » conserve l’expression hébraïque traditionnelle et son évocation d’une eau fraîche provenant d’une source, sans la réduire nécessairement à de l’eau courante.
theological_decisions:
- issue: Sens de מַיִם חַיִּים dans le rite de purification
  choice: eau vive
  alternative: eau fraîche; eau courante
  rationale: « Eau vive » préserve la formulation imagée de l’hébreu et toute sa portée potentielle, tandis qu’une note en précise le sens concret dans ce contexte rituel sans imposer un symbolisme théologique ultérieur.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde le caractère prescriptif du texte rituel; « qu’on égorge » évite d’attribuer sans certitude l’action au prêtre lui-même.
