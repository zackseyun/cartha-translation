source:
  edition: WLC
  text: וְ/הַ/נּוֹתָ֗ר בַּ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/018.yaml
  text: And what remains of the oil that is on the priest’s palm he shall put on the head of the one being cleansed[a], and the priest shall make atonement for him before Yahweh.
translation:
  language: fr
  text: Le reste de l’huile qui est sur la paume du prêtre, celui-ci le mettra sur la tête de la personne en cours de purification, et le prêtre fera l’expiation pour elle devant Yahvé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר בַּשֶּׁמֶן
  choice: Le reste de l’huile
  rationale: Le participe substantivé désigne ce qui demeure; avec בַּשֶּׁמֶן, la tournure partitive « le reste de l’huile » est naturelle et fidèle au contexte.
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: qui est sur la paume du prêtre
  rationale: כַּף désigne précisément la paume, et « sur » conserve la valeur spatiale de עַל ainsi que l’image rituelle.
- source_word: יִתֵּן עַל רֹאשׁ
  choice: le mettra sur la tête
  rationale: Dans ce geste rituel, נתן signifie mettre ou appliquer; « mettra » est clair et idiomatique.
- source_word: הַמִּטַּהֵר
  choice: la personne en cours de purification
  rationale: Le participe hitpael présente la personne engagée dans le processus rituel de purification, et non simplement déjà purifiée.
- source_word: וְכִפֶּר עָלָיו
  choice: il accomplira pour elle le rite d’expiation
  rationale: Cette formulation conserve le sens cultuel de כפר sans préciser indûment une théorie particulière de l’expiation; « pour elle » rend idiomatiquement עָלָיו et reprend « la personne ».
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahvé
  rationale: « Devant » rend directement לִפְנֵי, tandis que « Yahvé » représente en français le nom divin יהוה.
theological_decisions:
- issue: Sens rituel de כפר
  choice: accomplir pour elle le rite d’expiation
  alternative: faire l’expiation pour elle; effectuer la purification rituelle pour elle
  rationale: « Rite d’expiation » maintient la portée sacerdotale du terme tout en évitant de réduire son sens à une seule conception doctrinale.
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR; Yahweh
  rationale: Le texte hébreu emploie le nom propre divin; la forme française traditionnelle et intelligible « Yahvé » le rend explicitement.
translation_notes:
  register: Français moderne, digne et accessible. La reprise « celui-ci » puis « il » évite l’ambiguïté sur le sujet du verbe tout en conservant le prêtre comme agent des deux gestes rituels.
