  text: וְ/הִזָּ֤ה הַ/כֹּהֵן֙ בְּ/אֶצְבָּע֣/וֹ הַ/יְמָנִ֔ית מִן הַ/שֶּׁ֕מֶן אֲשֶׁ֥ר עַל כַּפּ֖/וֹ הַ/שְּׂמָאלִ֑ית שֶׁ֥בַע פְּעָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/027.yaml
  text: Then the priest shall sprinkle with his right finger some of the oil that is on his left palm seven times before Yahweh.
translation:
  language: fr
  text: Puis, avec le doigt de sa main droite, le prêtre fera devant Yahweh sept aspersions de l’huile qui est sur la paume de sa main gauche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִזָּה
  choice: Puis… il en fera… l’aspersion
  rationale: Le hifil de נזה désigne ici l’action rituelle d’asperger. « Puis » exprime naturellement la progression de la procédure.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Équivalent français courant et précis de כֹּהֵן dans la législation cultuelle.
- source_word: בְּאֶצְבָּעוֹ הַיְמָנִית
  choice: avec le doigt de sa main droite
  rationale: Cette formulation naturelle en français conserve le singulier et l’opposition rituelle entre le côté droit et le côté gauche.
- source_word: מִן הַשֶּׁמֶן
  choice: de l’huile… il en
  rationale: 'מִן a ici une valeur partitive : seule une partie de l’huile tenue dans la paume est aspergée.'
- source_word: אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: qui est dans la paume de sa main gauche
  rationale: כַּף désigne précisément la paume. En français, l’huile est naturellement dite « dans » la paume plutôt que « sur » celle-ci, sans modifier la scène rituelle.
- source_word: שֶׁבַע פְּעָמִים
  choice: sept fois
  rationale: Rendu direct et idiomatique de l’expression de comptage.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי évoque ici une action accomplie devant la présence divine; le nom propre יהוה est translittéré « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » conserve le caractère de nom propre et suit la décision éditoriale fournie, sans le remplacer par un titre.
translation_notes:
  register: 'Français moderne, digne et accessible. La phrase explicite naturellement le mouvement : le prêtre prélève de l’huile avec son doigt droit dans sa paume gauche, puis en fait l’aspersion. Aucun marqueur de note n’est requis.'
