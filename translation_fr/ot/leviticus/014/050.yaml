  text: וְ/שָׁחַ֖ט אֶת הַ/צִּפֹּ֣ר הָ/אֶחָ֑ת אֶל כְּלִי חֶ֖רֶשׂ עַל מַ֥יִם חַיִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/050.yaml
  text: Then he shall slaughter the one bird into an earthenware vessel over living water[a].
translation:
  language: fr
  text: Il égorgera ensuite l’un des oiseaux dans un récipient en terre cuite, au-dessus de l’eau vive[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « des eaux vivantes » ; l’expression désigne de l’eau fraîche provenant d’une source ou d’un courant.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: Il égorgera ensuite
  rationale: Dans cette suite de prescriptions rituelles, le waw suivi de la forme verbale marque l’étape suivante. Le futur français convient à l’instruction, et « égorger » désigne précisément la mise à mort rituelle de l’oiseau.
- source_word: הַצִּפֹּר הָאֶחָת
  choice: l’un des oiseaux
  rationale: L’expression distingue cet oiseau de l’autre déjà mentionné sans préciser qu’il s’agit du « premier ». Cette formulation est naturelle en français et n’ajoute aucun ordre absent de l’hébreu.
- source_word: אֶל כְּלִי חֶרֶשׂ
  choice: dans un récipient en terre cuite
  rationale: 'Avec un récipient, אֶל indique ici la direction et le résultat de l’action : le sang est reçu dans le récipient. « Récipient en terre cuite » rend clairement le matériau et la fonction de l’objet.'
- source_word: עַל מַיִם חַיִּים
  choice: au-dessus de l’eau vive
  rationale: עַל conserve la relation spatiale entre l’abattage, le récipient et l’eau qu’il contient. « Eau vive » est une expression française établie qui reste proche de l’image hébraïque et désigne une eau provenant d’une source ou d’un courant.
theological_decisions:
- issue: Sens de מַיִם חַיִּים dans une prescription de purification
  choice: eau vive
  alternative: eau courante
  rationale: « Eau vive » préserve l’expression imagée de l’hébreu et ses résonances bibliques, tout en restant intelligible en français. La note en explicite le sens concret dans ce contexte rituel sans réduire la formule à une interprétation théologique particulière.
translation_notes:
  register: Français international actuel, sobre et digne. La formulation suit l’ordre rituel du texte tout en évitant l’ordinal « premier », qui n’apparaît pas dans l’hébreu. Le singulier collectif « l’eau vive » est idiomatique en français, tandis que la note signale le pluriel littéral hébreu.
