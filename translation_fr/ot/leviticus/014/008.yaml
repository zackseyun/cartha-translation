id: LEV.14.8
reference: Leviticus 14:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כִבֶּס֩ הַ/מִּטַּהֵ֨ר אֶת בְּגָדָ֜י/ו וְ/גִלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ וְ/רָחַ֤ץ בַּ/מַּ֨יִם֙ וְ/טָהֵ֔ר וְ/אַחַ֖ר יָב֣וֹא אֶל הַֽ/מַּחֲנֶ֑ה וְ/יָשַׁ֛ב מִ/ח֥וּץ לְ/אָהֳל֖/וֹ שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/008.yaml
  text: The one being cleansed shall wash his clothes[a], shave off all his hair, and bathe in water; then he shall be clean. Afterward he may come into the camp[b], but he shall stay outside his tent for seven days.
translation:
  language: fr
  text: La personne en cours de purification lavera ses vêtements[a], rasera toute sa pilosité et se baignera dans l’eau ; alors elle sera pure. Après cela, elle pourra entrer dans le camp[b], mais elle restera sept jours hors de sa tente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la personne qui est purifiée ». L’hébreu désigne la personne soumise au processus rituel de purification.
    reason: lexical_alternative
  - marker: b
    text: Ou « elle entrera dans le camp ». La forme hébraïque peut exprimer un simple futur ou une permission ; le contexte suggère une réintégration autorisée, mais encore soumise à des restrictions.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמִּטַּהֵר
  choice: la personne qui se purifie
  rationale: Le participe hitpael désigne la personne engagée dans le processus rituel de purification. Cette formulation française est naturelle et n’implique pas que la purification soit morale ou intérieure.
- source_word: כִבֶּס ... בְּגָדָיו
  choice: lavera ses vêtements
  rationale: Le verbe désigne couramment le lavage des vêtements. « Vêtements » est actuel et précis.
- source_word: גִלַּח אֶת כָּל שְׂעָרוֹ
  choice: rasera tous ses poils
  rationale: שֵׂעָר peut désigner collectivement la pilosité. « Tous ses poils » exprime ici plus clairement l’ensemble de la pilosité corporelle que le seul mot « cheveux ».
- source_word: רָחַץ בַּמַּיִם
  choice: se baignera dans l’eau
  rationale: Dans ce contexte rituel, le verbe désigne le lavage du corps et se distingue ainsi du lavage des vêtements mentionné auparavant.
- source_word: וְטָהֵר
  choice: alors elle sera pure
  rationale: La proposition indique le statut rituel qui résulte des gestes prescrits ; « alors » rend clairement la progression.
- source_word: וְאַחַר
  choice: Après cela
  rationale: Cette expression introduit naturellement en français l’étape suivante du rite.
- source_word: יָבֹא אֶל הַמַּחֲנֶה
  choice: elle pourra entrer dans le camp
  rationale: L’imparfait hébreu peut être compris comme un futur simple ou comme l’autorisation de rentrer. La restriction qui suit favorise ici la nuance permissive, sans masquer l’autre lecture.
- source_word: וְיָשַׁב מִחוּץ לְאָהֳלוֹ
  choice: mais elle restera sept jours hors de sa tente
  rationale: יָשַׁב exprime ici un séjour temporaire. « Mais » rend le contraste contextuel entre la réintégration du camp et l’accès encore interdit à la tente, bien que l’hébreu ait une simple conjonction.
- source_word: שִׁבְעַת יָמִים
  choice: sept jours
  rationale: Expression française idiomatique de la durée, intégrée directement au verbe « restera ».
theological_decisions:
- issue: Nature du vocabulaire de pureté rituelle
  choice: « se purifie / sera pure » dans un sens rituel
  alternative: « est purifiée / sera nette »
  rationale: Le passage décrit le rétablissement d’un statut rituel après une affection cutanée, non une purification morale intérieure. « Pure » conserve le vocabulaire cultuel traditionnel sans ajouter de doctrine étrangère au texte.
- issue: Valeur modale de יָבֹא
  choice: « pourra entrer »
  alternative: « entrera »
  rationale: Le contexte présente une réadmission limitée dans le camp. La traduction permissive est donc probable, tandis que la note conserve la possibilité du futur simple.
translation_notes:
  register: Français international moderne, digne et accessible. Le féminin grammatical reprend « la personne » et évite un masculin générique pesant. La ponctuation distingue les étapes successives du rite.
