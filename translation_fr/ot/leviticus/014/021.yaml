source:
  edition: WLC
  text: וְ/אִם דַּ֣ל ה֗וּא וְ/אֵ֣ין יָד/וֹ֮ מַשֶּׂגֶת֒ וְ֠/לָקַח כֶּ֣בֶשׂ אֶחָ֥ד אָשָׁ֛ם לִ/תְנוּפָ֖ה לְ/כַפֵּ֣ר עָלָ֑י/ו וְ/עִשָּׂר֨וֹן סֹ֜לֶת אֶחָ֨ד בָּל֥וּל בַּ/שֶּׁ֛מֶן לְ/מִנְחָ֖ה וְ/לֹ֥ג שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/021.yaml
  text: But if he is poor and his means are insufficient[a], then he shall take one male lamb for a guilt offering to be waved, to make atonement for him, and one-tenth of an ephah of fine flour mixed with oil for a grain offering[b], and one log of oil.
translation:
  language: fr
  text: Mais s’il est pauvre et que ses ressources ne suffisent pas[a], il prendra un agneau mâle comme sacrifice de réparation, qui sera présenté par un geste d’agitation, afin de faire l’expiation en sa faveur, ainsi qu’un dixième d’épha de fleur de farine mélangée à de l’huile comme offrande de céréales, et un log d’huile[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « sa main n’atteint pas » ; autrement dit, ses ressources ne suffisent pas.'
    reason: lexical_alternative
  - marker: b
    text: Le log est une petite mesure de capacité pour les liquides, employée dans la législation rituelle d’Israël.
    reason: cultural_note
lexical_decisions:
- source_word: דַּל
  choice: pauvre
  rationale: Dans ce contexte juridique, le terme désigne directement une personne de condition économique modeste.
- source_word: וְאֵין יָדוֹ מַשֶּׂגֶת
  choice: ses moyens soient insuffisants
  rationale: Cette formulation rend le sens économique de l’expression idiomatique hébraïque sans la réduire à l’idée plus absolue de ne pas pouvoir payer.
- source_word: כֶּבֶשׂ אֶחָד
  choice: un seul agneau mâle
  rationale: כֶּבֶשׂ désigne ici un agneau mâle; « un seul » souligne la quantité prescrite dans le cas de pauvreté.
- source_word: אָשָׁם
  choice: sacrifice de réparation
  rationale: Ce terme rend la catégorie sacrificielle propre à אָשָׁם et sa dimension de réparation, sans imposer une théorie particulière de son effet.
- source_word: לִתְנוּפָה
  choice: que l’on présentera par le geste d’élévation
  rationale: Le syntagme décrit la présentation rituelle de l’agneau; il ne fait pas de celui-ci un second type de sacrifice distinct.
- source_word: לְכַפֵּר עָלָיו
  choice: afin de faire l’expiation en sa faveur
  rationale: « Faire l’expiation » conserve la portée rituelle et théologique de כפר, tandis que « en sa faveur » rend prudemment עָלָיו.
- source_word: וְעִשָּׂרוֹן סֹלֶת אֶחָד
  choice: un dixième d’épha de fleur de farine
  rationale: עִשָּׂרוֹן est la mesure d’un dixième, comprise dans cette législation comme un dixième d’épha; « fleur de farine » rend la farine fine de qualité sacrificielle.
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: mélangée à de l’huile
  rationale: La formulation française exprime clairement le mélange prescrit sans préciser une technique que l’hébreu ne détaille pas.
- source_word: לְמִנְחָה
  choice: comme offrande de céréales
  rationale: Dans le Lévitique, מִנְחָה désigne la catégorie rituelle de l’offrande végétale, ici constituée de farine et d’huile.
- source_word: לֹג שָׁמֶן
  choice: un log d’huile
  rationale: Le nom de l’unité ancienne est conservé pour éviter une conversion moderne incertaine; il est expliqué en note.
theological_decisions:
- issue: Terminologie des sacrifices dans la législation sacerdotale
  choice: 'Conserver des termes cultuels distincts: « sacrifice de réparation », « geste d’élévation », « faire l’expiation » et « offrande de céréales ».'
  alternative: Employer des paraphrases générales telles que « sacrifice pour la faute », « présentation rituelle » ou « obtenir le pardon ».
  rationale: Les termes retenus préservent les catégories rituelles du texte hébreu et sa tension théologique sans réduire l’expiation à une interprétation doctrinale particulière.
- issue: Rapport entre l’אָשָׁם et la תְּנוּפָה
  choice: Présenter l’agneau offert en sacrifice de réparation au moyen du geste rituel d’élévation.
  alternative: Comprendre « sacrifice de réparation » et « offrande d’élévation » comme deux catégories sacrificielles séparées.
  rationale: La construction hébraïque indique que l’unique agneau servant de sacrifice de réparation fait l’objet de cette présentation rituelle.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe juridique demeure perceptible, mais les expressions idiomatiques sont rendues naturellement. Les unités anciennes et les catégories sacrificielles sont conservées pour préserver la précision du texte.
