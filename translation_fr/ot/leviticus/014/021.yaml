revisions:
- from: Mais s’il est pauvre et que ses moyens soient insuffisants[a], il prendra un seul agneau mâle comme sacrifice de réparation, que l’on présentera par le geste d’élévation, afin de faire l’expiation en sa faveur, ainsi qu’un dixième d’épha de fleur de farine mélangée à de l’huile comme offrande de céréales, et un log d’huile[b].
  to: Mais s’il est pauvre et que ses ressources ne suffisent pas[a], il prendra un agneau mâle comme sacrifice de réparation, qui sera présenté par un geste d’agitation, afin de faire l’expiation en sa faveur, ainsi qu’un dixième d’épha de fleur de farine mélangée à de l’huile comme offrande de céréales, et un log d’huile[b].
  rationale: La correction remplace « geste d’élévation » par « geste d’agitation », qui rend plus exactement le rite de תְּנוּפָה sans en faire une offrande distincte. Elle améliore également la formulation de l’idiome financier, sans modifier le sens, les catégories sacrificielles ni les ancres de notes.
