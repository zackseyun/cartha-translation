  text: וּ/מִן הַ/שֶּׁ֖מֶן יִצֹ֣ק הַ/כֹּהֵ֑ן עַל כַּ֥ף הַ/כֹּהֵ֖ן הַ/שְּׂמָאלִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/026.yaml
  text: And from the oil the priest shall pour onto the palm of his own left hand[a].
translation:
  language: fr
  text: Puis le prêtre versera de l’huile dans la paume de sa main gauche[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur la paume du prêtre, la gauche ».'
    reason: La syntaxe hébraïque rattache explicitement la paume au prêtre et la qualifie ensuite de gauche; le français courant exprime cela par « sa main gauche ».
lexical_decisions:
- source_word: וּ/מִן הַ/שֶּׁמֶן
  choice: Puis… de l’huile
  rationale: Le וּ poursuit la séquence rituelle et se rend naturellement par « Puis » en français; מִן indique que le prêtre prélève une partie de l’huile déjà mentionnée, ce que traduit idiomatiquement « de l’huile ».
- source_word: יִצֹק
  choice: versera
  rationale: Dans cette procédure rituelle, le yiqtol exprime l’action prescrite; le futur français convient au style législatif et procédural.
- source_word: הַ/כֹּהֵן
  choice: le prêtre
  rationale: Équivalent français courant de כֹּהֵן dans le contexte cultuel du Lévitique.
- source_word: עַל כַּף
  choice: dans la paume
  rationale: כַּף désigne ici la paume, c’est-à-dire le creux de la main. Avec « verser », le français dit naturellement « dans la paume », tandis que l’hébreu emploie עַל.
- source_word: הַ/כֹּהֵן הַ/שְּׂמָאלִית
  choice: de sa propre main gauche
  rationale: La formulation rend naturellement le sens de « la paume du prêtre, la gauche » et précise que la main est celle du prêtre qui verse, sans répétition lourde.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et fluide. Le futur conserve la valeur prescriptive de la procédure rituelle; « sa propre » lève naturellement toute ambiguïté sur l’identité du possesseur de la main.
