source:
  edition: WLC
  text: זֹ֤את תִּֽהְיֶה֙ תּוֹרַ֣ת הַ/מְּצֹרָ֔ע בְּ/י֖וֹם טָהֳרָת֑/וֹ וְ/הוּבָ֖א אֶל הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/002.yaml
  text: 'This shall be the law for the leprous person on the day of his cleansing: he shall be brought to the priest[a].'
translation:
  language: fr
  text: 'Voici la loi concernant la personne atteinte d’une affection de peau[a] : le jour de sa purification, cette personne sera amenée au prêtre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie un terme traditionnellement rendu par « lépreux ». Il désigne une personne atteinte de צָרַעַת (tsaraath), une affection associée à l’impureté rituelle, qui ne correspond pas nécessairement à la maladie de Hansen.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת תִּהְיֶה
  choice: Voici
  rationale: Cette formulation française naturelle introduit solennellement la prescription et rend la valeur présentative de זֹאת avec le caractère normatif de תִּהְיֶה, sans lourdeur juridique artificielle.
- source_word: תּוֹרַת
  choice: la loi concernant
  rationale: תּוֹרָה désigne ici la prescription rituelle applicable à la personne concernée. « Loi » maintient le vocabulaire juridique du Lévitique, tandis que « concernant » exprime clairement le rapport construit.
- source_word: הַמְּצֹרָע
  choice: la personne atteinte d’une affection de peau[a]
  rationale: Le terme désigne une personne touchée par צָרַעַת, état qui ne correspond pas exactement à une maladie moderne déterminée. Cette formulation évite « lépreux », qui réduit la personne à son état, et ne l’assimile pas à tort à la maladie de Hansen.
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: le jour de sa purification
  rationale: La formulation conserve l’expression temporelle du texte hébreu et le sens rituel de la racine טהר. « Purification » convient mieux ici que le seul registre de l’hygiène.
- source_word: וְהוּבָא
  choice: elle sera amenée
  rationale: Le passif rend le hophal hébreu et maintient l’indétermination quant aux personnes qui la conduisent. Le féminin grammatical reprend naturellement « la personne » sans modifier le référent du texte.
- source_word: אֶל הַכֹּהֵן
  choice: au prêtre
  rationale: L’article défini hébreu désigne le prêtre chargé de la procédure dans ce contexte.
theological_decisions:
- issue: Rapport entre מְצֹרָע, צָרַעַת et la « lèpre » au sens médical moderne
  choice: la personne atteinte d’une affection de peau
  alternative: le lépreux ; la personne atteinte de lèpre ; la personne atteinte de tsaraath
  rationale: Le texte décrit une catégorie rituelle ancienne sans permettre de l’identifier simplement à la maladie de Hansen. La traduction choisie reste compréhensible, respecte la dignité de la personne et signale en note la portée particulière du terme hébreu.
- issue: Sens de טָהֳרָתוֹ
  choice: sa purification
  alternative: sa guérison ; le moment où elle redevient pure
  rationale: Le passage porte sur la reconnaissance et la restauration de la pureté rituelle. « Guérison » introduirait une affirmation médicale que le mot hébreu ne formule pas ici.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la tonalité juridique et rituelle du Lévitique tout en évitant un diagnostic médical anachronique et une désignation qui réduirait la personne à son affection.
