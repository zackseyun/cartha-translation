  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/שְּׁבִיעִ֜י יְגַלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ אֶת רֹאשׁ֤/וֹ וְ/אֶת זְקָנ/וֹ֙ וְ/אֵת֙ גַּבֹּ֣ת עֵינָ֔י/ו וְ/אֶת כָּל שְׂעָר֖/וֹ יְגַלֵּ֑חַ וְ/כִבֶּ֣ס אֶת בְּגָדָ֗י/ו וְ/רָחַ֧ץ אֶת בְּשָׂר֛/וֹ בַּ/מַּ֖יִם וְ/טָהֵֽר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/009.yaml
  text: 'And on the seventh day he shall shave off all his hair: his head[a], his beard, and his eyebrows. He shall shave off all his hair, wash his clothes, and bathe his body in water; then he shall be clean.'
translation:
  language: fr
  text: 'Le septième jour, il rasera tous ses poils : les cheveux, la barbe et les sourcils. Il rasera tous ses poils, lavera ses vêtements et se lavera le corps dans l’eau ; alors il sera pur.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַשְּׁבִיעִי
  choice: Le septième jour
  rationale: La tournure hébraïque introduit l’étape suivante de la procédure. En français, l’expression temporelle simple rend naturellement cette progression.
- source_word: יְגַלַּח אֶת כָּל שְׂעָרוֹ
  choice: il rasera tous ses poils
  rationale: Le verbe désigne ici l’enlèvement par rasage, et שֵׂעָר englobe la pilosité corporelle, comme le montre l’énumération qui suit. « Poils » est donc plus précis que le seul « cheveux ».
- source_word: אֶת רֹאשׁוֹ
  choice: ceux de sa tête
  rationale: Littéralement « sa tête », objet du verbe « raser ». La formulation française explicite qu’il s’agit des poils ou cheveux de la tête sans modifier le sens.
- source_word: וְאֶת זְקָנוֹ
  choice: sa barbe
  rationale: זָקָן désigne normalement la barbe dans ce contexte.
- source_word: וְאֵת גַּבֹּת עֵינָיו
  choice: ses sourcils
  rationale: L’expression hébraïque « les arcades de ses yeux » correspond idiomatiquement aux sourcils.
- source_word: וְאֶת כָּל שְׂעָרוֹ יְגַלֵּחַ
  choice: Il rasera tous ses poils
  rationale: La répétition récapitulative souligne la totalité du rasage. Elle est conservée pour respecter l’insistance du texte.
- source_word: וְכִבֶּס אֶת בְּגָדָיו
  choice: lavera ses vêtements
  rationale: כִּבֵּס désigne couramment le lavage des vêtements. La formulation est actuelle et claire.
- source_word: וְרָחַץ אֶת בְּשָׂרוֹ בַּמַּיִם
  choice: se lavera le corps dans l’eau
  rationale: בָּשָׂר signifie littéralement « chair », mais désigne ici le corps de la personne. « Se lavera le corps » restitue naturellement l’acte rituel tout en conservant la mention de l’eau.
- source_word: וְטָהֵר
  choice: alors il sera pur
  rationale: Le verbe exprime l’état de pureté qui résulte des gestes prescrits. « Alors » rend la succession logique, et « pur » relève ici du statut rituel.
theological_decisions:
- issue: Terminologie de la pureté rituelle
  choice: pur
  alternative: purifié ; propre
  rationale: Le contexte concerne le statut rituel lévitique et non l’innocence morale. « Pur » est en français le terme biblique courant et accessible pour cette catégorie ; « purifié » mettrait davantage l’accent sur un processus, tandis que « propre » risquerait d’évoquer surtout l’hygiène.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste fluide tout en conservant la répétition emphatique de l’hébreu. Aucun marqueur de note n’est nécessaire, puisque « corps » rend sans ambiguïté l’emploi idiomatique de בָּשָׂר.
