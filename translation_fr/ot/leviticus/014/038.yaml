id: LEV.14.38
reference: Leviticus 14:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יָצָ֧א הַ/כֹּהֵ֛ן מִן הַ/בַּ֖יִת אֶל פֶּ֣תַח הַ/בָּ֑יִת וְ/הִסְגִּ֥יר אֶת הַ/בַּ֖יִת שִׁבְעַ֥ת יָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/038.yaml
  text: Then the priest shall go out of the house to the doorway of the house and shut up the house for seven days[a].
translation:
  language: fr
  text: Alors le prêtre sortira de la maison et se rendra à l’entrée de celle-ci, puis il la fermera pendant sept jours[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il en interdira l’accès pendant sept jours ». Le verbe hébreu peut désigner la fermeture d’un lieu en vue d’une période d’inspection.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: Alors ... sortira
  rationale: Dans cette procédure légale, le waw suivi du verbe fait progresser la suite des actions. « Alors » exprime naturellement cette succession, et le futur conserve la valeur prescriptive.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Équivalent usuel de כֹּהֵן dans le contexte des lois lévitiques, avec maintien de l’article défini.
- source_word: מִן הַבַּיִת
  choice: de la maison
  rationale: Avec « sortir », le français exprime naturellement le mouvement hors du lieu par « sortir de la maison ».
- source_word: אֶל פֶּתַח הַבָּיִת
  choice: se rendra à l’entrée de celle-ci
  rationale: פֶּתַח désigne l’entrée ou l’ouverture. « Entrée » est concret sans supposer la présence d’une porte; « celle-ci » évite une répétition lourde tout en gardant le même référent.
- source_word: וְהִסְגִּיר
  choice: puis il la fermera
  rationale: Le hiphil de סגר indique ici que l’accès à la maison est fermé durant une période déterminée. « Fermer » reste naturel et moins interprétatif que « mettre en quarantaine ».
- source_word: אֶת הַבַּיִת
  choice: la
  rationale: Le pronom reprend clairement « la maison » et rend la phrase fluide en français; le marqueur de l’objet direct n’est pas traduit.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: « Pendant » exprime naturellement en français la durée prescrite.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le caractère procédural du texte tout en évitant le terme plus interprétatif « quarantaine ».
