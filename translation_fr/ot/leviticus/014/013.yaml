base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/013.yaml
  text: And he shall slaughter the lamb in the place where they slaughter the sin offering and the burnt offering[a], in the holy place; for like the sin offering, the guilt offering belongs to the priest[b]; it is most holy.
translation:
  language: fr
  text: 'Il égorgera l’agneau à l’endroit où l’on égorge le sacrifice pour le péché[a] et l’holocauste, dans le lieu saint. En effet, comme le sacrifice pour le péché, le sacrifice de réparation[b] revient au prêtre : il est très saint.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « sacrifice de purification » : l’hébreu חַטָּאת peut souligner ici la fonction purificatrice du rite.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou « sacrifice de culpabilité » : l’hébreu אָשָׁם peut désigner un sacrifice associé à la culpabilité, à la réparation et à la restitution.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: Il égorgera
  rationale: Dans le contexte sacrificiel, שׁחט désigne l’égorgement rituel. « Égorg­er » est précis et idiomatique dans la législation cultuelle.
- source_word: הַכֶּבֶשׂ
  choice: l’agneau
  rationale: כֶּבֶשׂ désigne couramment un agneau dans les prescriptions sacrificielles; le contexte immédiat précise déjà l’animal concerné.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: à l’endroit où l’on égorge
  rationale: Le singulier verbal a ici une valeur générique. Le pronom indéfini « on » rend naturellement la pratique prescrite sans imposer un agent particulier.
- source_word: הַחַטָּאת
  choice: le sacrifice pour le péché
  rationale: Cette formulation française conserve la désignation traditionnelle de la catégorie sacrificielle, tout en explicitant qu’il s’agit d’un sacrifice. L’autre analyse, « sacrifice de purification », est signalée en note.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: « Holocauste » est le terme français biblique établi pour עֹלָה, offrande entièrement consumée.
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: dans le lieu saint
  rationale: L’article hébreu renvoie à l’emplacement sacré désigné; « le lieu saint » en conserve la détermination.
- source_word: כִּי כַּחַטָּאת הָאָשָׁם הוּא לַכֹּהֵן
  choice: En effet, comme le sacrifice pour le péché, le sacrifice de réparation revient au prêtre
  rationale: La phrase maintient l’analogie entre les deux sacrifices et rend לַכֹּהֵן par une appartenance ou attribution sacerdotale naturelle en français.
- source_word: קֹדֶשׁ קָדָשִׁים הוּא
  choice: c’est une chose très sainte
  rationale: La construction superlative hébraïque indique le degré cultuel supérieur de sainteté. « Une chose très sainte » est clair et convient au référent sacrificiel.
theological_decisions:
- issue: Sens de חַטָּאת dans la législation sacrificielle sacerdotale
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le terme peut mettre en jeu à la fois le péché et la purification rituelle. Le texte principal conserve la catégorie traditionnelle et intelligible, tandis que la note préserve l’autre analyse importante.
- issue: Sens de אָשָׁם
  choice: sacrifice de réparation
  alternative: sacrifice de culpabilité
  rationale: Dans ce contexte lévitique, « réparation » rend bien la dimension de compensation ou de restitution associée à אָשָׁם. La traduction plus formellement liée à la culpabilité reste possible et est indiquée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le vocabulaire sacrificiel technique tout en évitant une syntaxe inutilement archaïque. Les deux ambiguïtés lexicales majeures sont maintenues au moyen de notes explicitement appelées dans le texte.
