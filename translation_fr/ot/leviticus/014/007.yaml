source:
  edition: WLC
  text: וְ/הִזָּ֗ה עַ֧ל הַ/מִּטַּהֵ֛ר מִן הַ/צָּרַ֖עַת שֶׁ֣בַע פְּעָמִ֑ים וְ/טִ֣הֲר֔/וֹ וְ/שִׁלַּ֛ח אֶת הַ/צִּפֹּ֥ר הַֽ/חַיָּ֖ה עַל פְּנֵ֥י הַ/שָּׂדֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/007.yaml
  text: He shall sprinkle it on the one being cleansed from the skin disease seven times[a], and he shall pronounce him clean[b], and he shall let the living bird go free over the open field.
translation:
  language: fr
  text: Il aspergera sept fois la personne qu’on purifie de sa maladie de peau[a], puis il la purifiera[b]. Ensuite, il relâchera l’oiseau vivant dans la campagne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « lèpre ». Le terme hébreu désigne ici diverses maladies de peau et ne correspond pas nécessairement à la lèpre moderne.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il la déclarera pure ». Dans ce contexte, l’acte du prêtre est rituel et officiel, et pas simplement médical.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: Il aspergera
  rationale: Le hiphil de נזה désigne couramment l’aspersion rituelle. En français, « asperger » permet de laisser implicite la substance, comme le fait ce verset, tout en la rattachant au rite décrit auparavant.
- source_word: הַמִּטַּהֵר
  choice: la personne en cours de purification
  rationale: Le participe hitpael de טהר présente la personne comme engagée dans le processus rituel de purification, et non comme déjà pure.
- source_word: מִן הַצָּרַעַת
  choice: de la maladie de peau
  rationale: Dans le Lévitique, צָרַעַת désigne une catégorie plus large que la lèpre moderne. « Maladie de peau » est clair pour le lecteur actuel et évite une identification médicale trop précise.
- source_word: שֶׁבַע פְּעָמִים
  choice: sept fois
  rationale: Équivalent direct et naturel de l’expression numérique hébraïque.
- source_word: וְטִהֲרוֹ
  choice: puis il la déclarera pure
  rationale: Dans ce contexte sacerdotal, le verbe exprime vraisemblablement l’acte rituel et officiel par lequel la personne est reconnue pure. La note conserve l’autre nuance possible, « la purifiera ».
- source_word: וְשִׁלַּח
  choice: Ensuite, il relâchera
  rationale: Le piel de שׁלח signifie ici laisser partir ou remettre en liberté l’oiseau vivant dans le cadre du rite.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: l’oiseau vivant
  rationale: Cette formulation distingue explicitement cet oiseau de celui qui a été égorgé au verset précédent.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: dans la campagne
  rationale: L’expression évoque l’espace ouvert hors de l’habitation. « Dans la campagne » rend naturellement la destination de l’oiseau relâché sans reproduire littéralement l’idiome « sur la face du champ ».
theological_decisions:
- issue: Sens de צָרַעַת
  choice: maladie de peau
  alternative: lèpre
  rationale: Le terme lévitique ne correspond pas précisément à la maladie de Hansen et couvre diverses atteintes cutanées associées à l’impureté rituelle. La traduction retenue évite un anachronisme médical.
- issue: Portée de וְטִהֲרוֹ
  choice: il la déclarera pure
  alternative: il la purifiera
  rationale: Le contexte permet de comprendre l’action comme une déclaration sacerdotale de pureté, mais la forme verbale peut aussi être rendue de manière causative par « purifier ». La note maintient cette tension.
translation_notes:
  register: Français international moderne, clair et digne. La formulation suit le déroulement rituel de l’hébreu, évite le terme médicalement trompeur « lèpre » dans le corps du texte et conserve en note l’ambiguïté entre déclaration de pureté et purification effective.
