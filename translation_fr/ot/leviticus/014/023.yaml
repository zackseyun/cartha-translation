id: LEV.14.23
reference: Leviticus 14:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הֵבִ֨יא אֹתָ֜/ם בַּ/יּ֧וֹם הַ/שְּׁמִינִ֛י לְ/טָהֳרָת֖/וֹ אֶל הַ/כֹּהֵ֑ן אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/023.yaml
  text: And on the eighth day he shall bring them for his cleansing to the priest[a], at the entrance of the tent of meeting, before Yahweh.
translation:
  language: fr
  text: Le huitième jour, il les apportera au prêtre pour sa purification, à l’entrée de la tente de la rencontre, devant Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבִיא
  choice: il les apportera
  rationale: Dans cette prescription rituelle, le parfait hiphil précédé de la conjonction poursuit la suite des instructions avec une valeur prospective. Le futur français convient naturellement.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom objet masculin pluriel renvoie aux offrandes énumérées au verset précédent.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Le huitième jour
  rationale: Expression temporelle idiomatique en français, sans nécessité d’ajouter « et » en tête de phrase.
- source_word: לְטָהֳרָתוֹ
  choice: pour sa purification
  rationale: Le nom dérivé de טהר désigne ici la procédure ou l’état de pureté rituelle. « Purification » exprime clairement ce cadre cultuel en français moderne.
- source_word: אֶל הַכֹּהֵן
  choice: au prêtre
  rationale: Rend directement la direction indiquée par אֶל dans un français naturel.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: à l’entrée de la tente de la rencontre
  rationale: Le second אֶל précise le lieu de la présentation. « Tente de la rencontre » rend les deux éléments de אֹהֶל מוֹעֵד et reste compréhensible.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: Formule cultuelle indiquant la présence de Yahweh; « devant » en préserve la concision.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin, qui conserve ici le nom personnel présent dans le texte hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; employer « Yahweh » préserve le nom divin plutôt que de lui substituer un titre.
- issue: Portée cultuelle de לְטָהֳרָתוֹ
  choice: pour sa purification
  alternative: pour qu’il soit purifié
  rationale: La formulation nominale conserve la possibilité que le terme désigne globalement la procédure ou son résultat rituel, sans préciser au-delà de l’hébreu le moment exact de l’obtention de la pureté.
translation_notes:
  register: Français international moderne, digne et direct. Le futur garde la force prescriptive de la procédure légale. Aucun marqueur de note n’est requis, puisque l’alternative lexicale se rend sans perte notable et n’appelle pas de note de publication.
