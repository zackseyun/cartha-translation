base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/044.yaml
  text: then the priest shall come and inspect[a], and if indeed the infection has spread in the house, it is a destructive mildew in the house[b]; it is unclean.
translation:
  language: fr
  text: 'Alors le prêtre viendra examiner la maison. S’il constate que l’atteinte s’est étendue dans la maison, il s’agit d’une atteinte[a] destructrice[b] dans la maison : la maison est impure.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu, traditionnellement rendu par « lèpre », désigne une catégorie plus large d’atteintes entraînant l’impureté rituelle. Il peut concerner des personnes, des vêtements ou, comme ici, des maisons; il ne correspond donc pas précisément à la lèpre moderne ni à une maladie identifiable.
    reason: lexical_alternative
  - marker: b
    text: Ou « maligne » ou « corrosive ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: Alors … viendra
  rationale: Dans cette procédure légale, le qatal précédé du waw exprime l’étape suivante de l’instruction plutôt qu’un simple passé narratif.
- source_word: וְרָאָה
  choice: examiner
  rationale: Le verbe signifie littéralement « voir », mais désigne ici l’examen diagnostique effectué par le prêtre.
- source_word: וְהִנֵּה
  choice: S’il constate que
  rationale: Cette formulation naturelle en français rend la condition observée à l’issue de l’examen, sans conserver artificiellement « voici ».
- source_word: פָּשָׂה הַנֶּגַע
  choice: l’atteinte s’est étendue
  rationale: פָּשָׂה indique la propagation; « atteinte » reste assez large pour une altération affectant une maison sans lui attribuer une cause médicale précise.
- source_word: צָרַעַת
  choice: moisissure
  rationale: Le terme désigne une catégorie d’atteinte entraînant l’impureté rituelle et s’applique ici à une maison; « moisissure » est intelligible dans ce contexte matériel, avec une note signalant que l’hébreu ne pose pas un diagnostic moderne précis.
- source_word: מַמְאֶרֶת
  choice: dévastatrice
  rationale: L’adjectif évoque une atteinte grave, nuisible ou corrosive; « dévastatrice » rend sa force sans connotation médicale moderne.
- source_word: טָמֵא הוּא
  choice: celle-ci est impure
  rationale: « Impure » exprime le statut rituel de la maison. Le féminin explicite que le pronom hébreu renvoie à la maison plutôt qu’à la moisissure.
theological_decisions:
- issue: Nature de צָרַעַת lorsqu’elle affecte une maison
  choice: Employer « moisissure » avec une note explicative
  alternative: « lèpre », « affection » ou maintien d’un terme technique translittéré
  rationale: « Lèpre » suggérerait à tort la maladie de Hansen, impossible à attribuer littéralement à une maison. « Moisissure » donne au lecteur une représentation appropriée au support, tandis que la note préserve l’étendue et l’indétermination de la catégorie hébraïque.
- issue: Portée de טָמֵא הוּא
  choice: Rapporter l’impureté à la maison
  alternative: « elle est impure », avec un antécédent pouvant sembler être la moisissure
  rationale: Le pronom masculin singulier correspond naturellement à בַּיִת, « maison », masculin en hébreu. Le français exige une reprise féminine pour rendre clairement cette relation.
- issue: Valeur temporelle de la séquence verbale
  choice: Rendre la procédure au futur normatif
  alternative: Employer le passé narratif
  rationale: Le contexte est celui d’une prescription sacerdotale décrivant les étapes à suivre, non d’un événement passé particulier.
translation_notes:
  register: Français international moderne, clair et digne. La phrase est légèrement restructurée en deux propositions pour éviter une longue coordination et clarifier que l’examen porte sur la maison. Les termes « atteinte » et « impure » conservent le cadre rituel sans médicaliser indûment le passage.
