  rationale: La révision remplace « moisissure », qui diagnostique indûment l’atteinte, par « atteinte », terme suffisamment large pour la catégorie rituelle exprimée par צָרַעַת dans une maison. Elle explicite également que c’est la maison, et non l’atteinte, qui est déclarée impure. Les éléments procéduraux et la force de l’adjectif sont conservés.
