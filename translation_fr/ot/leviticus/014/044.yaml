review_pass:
  verdict: revise
  source_fidelity: La « moisissure » est une identification matérielle trop précise pour צָרַעַת. Dans ce contexte, le terme désigne une catégorie rituelle d’atteinte applicable à une maison, sans permettre de conclure à une moisissure au sens moderne. La séquence procédurale, la propagation et le statut d’impureté sont autrement bien rendus.
  naturalness: Le français est clair et de registre approprié. La reprise « celle-ci est impure » peut toutefois être lue comme renvoyant à la moisissure plutôt qu’à la maison; nommer explicitement la maison lève l’ambiguïté.
  terminology: « Atteinte » préserve utilement l’indétermination de נגע et de la catégorie צָרַעַת dans une maison. « Impure » convient au statut rituel. « Destructrice » est une traduction recevable de מַמְאֶרֶת; la note peut signaler les alternatives sans les imposer.
  issues:
  - severity: medium
    issue: « moisissure » surinterprète צָרַעַת.
    rationale: Ni le terme hébreu ni son emploi dans la législation rituelle ne permettent d’identifier avec certitude l’atteinte d’une maison à de la moisissure moderne. L’audit anglais emploie aussi « mildew », mais sa note reconnaît que le terme hébreu est une catégorie plus large; le français doit préserver cette indétermination.
  - severity: low
    issue: L’antécédent de « celle-ci » est potentiellement ambigu.
    rationale: Le texte hébreu déclare que la maison est impure. En français, après « une moisissure », « celle-ci » peut naturellement reprendre ce dernier groupe nominal plutôt que « la maison ».
