  verdict: revise
  source_fidelity: Le futur prescriptif rend correctement la valeur procédurale des formes verbales. « De l’huile du log » exprime naturellement le complément introduit par מִן, sans laisser entendre de manière trop matérielle qu’une « partie » de la mesure elle-même est prise. « Dans la paume » est une adaptation idiomatique recevable de עַל dans ce geste de versement.
  naturalness: La formulation proposée est plus fluide en français moderne. « Une partie du log d’huile » est compréhensible, mais paraît moins idiomatique et peut suggérer une fraction de l’unité de mesure. « Sa propre main gauche » est inutilement insistant en français ; le possessif suffit.
  terminology: « Prêtre », « huile », « paume » et le terme technique « log » sont appropriés. La note culturelle explique suffisamment ce dernier sans imposer une équivalence moderne incertaine.
