  text: Then the priest shall take some of the log of oil and pour it into the palm of his own left hand[a].
translation:
  language: fr
  text: Puis le prêtre prendra de l’huile du log et la versera dans la paume de sa main gauche[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « log » était une ancienne mesure de capacité pour les liquides.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: Puis le prêtre prendra
  rationale: Le waw suivi de l’accompli poursuit ici la succession des prescriptions rituelles. Le futur français exprime naturellement l’instruction et « Puis » en marque l’ordre.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Équivalent courant de כֹּהֵן dans le contexte cultuel, avec maintien de l’article défini.
- source_word: מִלֹּג הַשָּׁמֶן
  choice: une partie du log d’huile
  rationale: 'La préposition מִן a ici une valeur partitive ou indique la provenance : le prêtre prélève de l’huile contenue dans la mesure, sans nécessairement prendre la totalité.'
- source_word: לֹג
  choice: log
  rationale: Le terme désigne une ancienne mesure précise de capacité pour les liquides. La translittération évite de lui substituer une équivalence moderne incertaine.
- source_word: וְיָצַק
  choice: et la versera
  rationale: Le futur coordonné poursuit naturellement la prescription. Le pronom « la » reprend l’huile prélevée.
- source_word: עַל כַּף
  choice: dans la paume
  rationale: עַל signifie littéralement « sur », mais, lorsqu’un liquide est versé dans une main creusée, « dans la paume » rend naturellement l’action concrète.
- source_word: כַּף
  choice: paume
  rationale: כַּף désigne précisément la paume ou le creux de la main, détail rituel conservé dans la traduction.
- source_word: הַשְּׂמָאלִית
  choice: de sa propre main gauche
  rationale: L’adjectif indique la gauche du prêtre. « Sa propre » lève l’ambiguïté possible tout en reflétant la répétition de « prêtre » dans l’hébreu.
