source:
  edition: WLC
  text: וְ/אֶת הַ/בַּ֛יִת יַקְצִ֥עַ מִ/בַּ֖יִת סָבִ֑יב וְ/שָׁפְכ֗וּ אֶת הֶֽ/עָפָר֙ אֲשֶׁ֣ר הִקְצ֔וּ אֶל מִ/ח֣וּץ לָ/עִ֔יר אֶל מָק֖וֹם טָמֵֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/041.yaml
  text: He shall have the inside of the house scraped all around[a], and they shall pour out the dust that they scraped off outside the city into an unclean place.
translation:
  language: fr
  text: Il fera racler l’intérieur de la maison tout autour. On déversera la poussière[a] qu’on aura raclée hors de la ville, dans un lieu impur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « poussière » ; le terme désigne ici la matière retirée des parois par raclage.
    reason: Précision lexicale et contextuelle sans identifier explicitement cette matière à du plâtre.
lexical_decisions:
- source_word: יַקְצִעַ
  choice: Il fera racler
  rationale: 'Le hifil exprime ici une action causative : le prêtre fait exécuter le raclage, sans nécessairement l’accomplir lui-même.'
- source_word: מִבַּיִת סָבִיב
  choice: tout l’intérieur de la maison
  rationale: L’expression désigne l’intérieur de la maison sur tout son pourtour. Cette formulation est naturelle en français moderne tout en conservant l’étendue indiquée par סָבִיב.
- source_word: וְשָׁפְכוּ
  choice: On déversera
  rationale: Le pluriel hébreu indéfini désigne les personnes chargées de l’évacuation. « On » le rend naturellement, tandis que « déversera » convient à l’élimination de matériaux en vrac.
- source_word: הֶעָפָר
  choice: la poussière
  rationale: עָפָר signifie littéralement « poussière » ou « terre ». Le contexte permet de comprendre qu’il s’agit de la matière détachée des murs, sans qu’il soit nécessaire d’ajouter « plâtre », absent de l’hébreu.
- source_word: אֲשֶׁר הִקְצוּ
  choice: qu’on aura raclée
  rationale: La proposition renvoie à la matière retirée par raclage. Le futur antérieur marque naturellement en français que le raclage précède son évacuation.
- source_word: אֶל מִחוּץ לָעִיר
  choice: hors de la ville
  rationale: La séquence prépositionnelle indique un déplacement au-delà des limites de la ville.
- source_word: אֶל מָקוֹם טָמֵא
  choice: dans un endroit impur
  rationale: « Impur » conserve la valeur rituelle technique de טָמֵא dans le Lévitique, sans suggérer nécessairement une faute morale.
theological_decisions:
- issue: Traduction de טָמֵא dans le cadre des règles lévitiques de pureté
  choice: impur
  alternative: souillé
  rationale: « Impur » est le terme français usuel pour la catégorie rituelle exprimée par טָמֵא. « Souillé » pourrait suggérer plus fortement une corruption matérielle ou morale que le texte n’affirme pas.
translation_notes:
  register: Français moderne, clair et digne. La tournure causative « fera racler » respecte la forme verbale hébraïque ; le pronom indéfini « on » rend naturellement le pluriel non précisé du second verbe. La division en deux phrases évite une coordination lourde.
