  text: וְ/שָׁ֥ב הַ/כֹּהֵ֖ן בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֑י וְ/רָאָ֕ה וְ/הִנֵּ֛ה פָּשָׂ֥ה הַ/נֶּ֖גַע בְּ/קִירֹ֥ת הַ/בָּֽיִת׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/039.yaml
  text: Then the priest shall return on the seventh day and look, and if the infection has spread in the walls of the house,
translation:
  language: fr
  text: Le septième jour, le prêtre reviendra et examinera la maison ; s’il constate que l’atteinte s’est étendue sur les murs de la maison,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁב
  choice: reviendra
  rationale: Le verbe שׁוב exprime ici le retour du prêtre après la période d’attente prescrite.
- source_word: וְרָאָה
  choice: examiner la maison
  rationale: Dans ce contexte rituel d’inspection, « examiner » rend naturellement l’action de regarder pour établir un constat; « la maison » explicite l’objet évident en français.
- source_word: הַנֶּגַע
  choice: l’atteinte
  rationale: נגע désigne la manifestation qui affecte la maison; « atteinte » reste générale et évite le terme médical trop précis « infection ».
- source_word: פָשָׂה
  choice: s’est étendue
  rationale: Le verbe signifie que l’atteinte s’est propagée ou étendue.
- source_word: בְּקִירֹת הַבָּיִת
  choice: sur les murs de la maison
  rationale: « Sur » correspond à la manifestation visible à la surface des murs et produit un français idiomatique.
theological_decisions:
- issue: Nature de נגע dans une maison
  choice: atteinte
  alternative: infection / plaie
  rationale: Le texte décrit un phénomène rituellement évalué sans en donner ici une identification médicale ou scientifique; la traduction ne doit pas le préciser davantage.
- issue: Valeur de וְהִנֵּה
  choice: rendue par « S’il constate que »
  alternative: « et voici que »
  rationale: Dans la séquence d’inspection, וְהִנֵּה introduit le résultat observé. La formulation conditionnelle française conserve la logique de la prescription et s’accorde avec la proposition laissée en suspens vers le verset suivant.
translation_notes:
  register: Français international moderne, clair et digne. Le verset conserve sa syntaxe conditionnelle inachevée, dont la conséquence est donnée au verset suivant.
