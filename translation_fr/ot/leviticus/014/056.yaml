  yaml_path: translation/ot/leviticus/014/056.yaml
  text: and for a swelling[a], and for a scab[b], and for a bright spot.
translation:
  language: fr
  text: pour l’enflure, l’éruption[a] et la tache claire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plaque » ou « éruption secondaire » ; le sens dermatologique exact du terme hébreu est incertain.
    reason: lexical_alternative
  - marker: b
    text: Ou « tache brillante » ; dans ce contexte, il peut s’agir d’une tache blanche.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאֵת
  choice: enflure
  rationale: Dans ce contexte de diagnostic cutané, le terme désigne une zone surélevée de la peau. « Enflure » reste concis, compréhensible et médicalement non spécifique.
- source_word: סַפַּחַת
  choice: éruption
  rationale: Le sens dermatologique exact est incertain; « éruption » est un terme moderne assez large qui convient mieux que « croûte », trop précis, tout en préservant l'idée d'une affection ou plaque cutanée.
- source_word: בֶּהֶרֶת
  choice: tache brillante
  rationale: Le mot évoque d'abord l'éclat ou la clarté d'une marque cutanée. « Tache brillante » préserve cette valeur sans imposer la couleur blanche, qui dépend du contexte.
- source_word: וְ/לַ
  choice: pour toute
  rationale: La préposition répétée poursuit l'énumération récapitulative des cas régis par les instructions précédentes. En français, sa reprise devant chaque nom serait lourde; la coordination avec « toute » conserve clairement la portée distributive.
