source:
  edition: WLC
  text: וְ/צִוָּה֙ הַ/כֹּהֵ֔ן וְ/חִלְּצוּ֙ אֶת הָ֣/אֲבָנִ֔ים אֲשֶׁ֥ר בָּ/הֵ֖ן הַ/נָּ֑גַע וְ/הִשְׁלִ֤יכוּ אֶתְ/הֶן֙ אֶל מִ/ח֣וּץ לָ/עִ֔יר אֶל מָק֖וֹם טָמֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/040.yaml
  text: then the priest shall command that they remove the stones in which the infection is[a], and throw them outside the city to an unclean place.
translation:
  language: fr
  text: Alors le prêtre ordonnera qu’on retire les pierres atteintes[a] et qu’on les jette hors de la ville, dans un endroit impur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les pierres dans lesquelles se trouve l’atteinte »; autre traduction : « les pierres qui portent l’atteinte ».'
    reason: La construction hébraïque emploie une expression spatiale inhabituelle, qu’une traduction française idiomatique condense en « pierres atteintes ».
lexical_decisions:
- source_word: וְצִוָּה הַכֹּהֵן
  choice: Alors le prêtre ordonnera
  rationale: Le waw suivi du parfait poursuit la procédure rituelle avec une valeur prospective. « Alors » marque naturellement l’étape suivante, et le futur rend la prescription.
- source_word: וְחִלְּצוּ אֶת הָאֲבָנִים
  choice: qu’on retire les pierres
  rationale: Le verbe חָלַץ exprime ici l’action d’extraire les pierres du mur. La tournure impersonnelle « qu’on » reste naturelle en français sans identifier des exécutants que l’hébreu ne précise pas.
- source_word: אֲשֶׁר בָּהֵן הַנָּגַע
  choice: les pierres atteintes[a]
  rationale: Dans ce contexte, נֶגַע désigne l’atteinte visible faisant l’objet du diagnostic rituel, sans permettre de préciser avec certitude sa nature matérielle. « Atteintes » est naturel pour une maison tout en évitant d’imposer un diagnostic moderne; la note conserve la formulation spatiale de l’hébreu.
- source_word: וְהִשְׁלִיכוּ אֶתְהֶן
  choice: et qu’on les jette
  rationale: « Jeter » est l’équivalent moderne et direct de שׁלך; le pronom renvoie clairement aux pierres.
- source_word: אֶל מִחוּץ לָעִיר
  choice: hors de la ville
  rationale: La préposition indique un déplacement vers l’extérieur. « Hors de la ville » est concis, idiomatique et fidèle.
- source_word: אֶל מָקוֹם טָמֵא
  choice: dans un endroit impur
  rationale: « Impur » rend le terme rituel טָמֵא et maintient la distinction entre impureté cultuelle et saleté matérielle ou faute morale.
theological_decisions:
- issue: Nature de נֶגַע dans une maison
  choice: atteinte
  alternative: tache, infection, moisissure ou fléau
  rationale: Le texte décrit un phénomène visible soumis à un constat rituel, mais n’en donne pas un diagnostic scientifique précis. « Atteinte » conserve cette généralité et évite d’identifier abusivement le phénomène à une maladie ou à une moisissure déterminée.
- issue: Terminologie lévitique de pureté
  choice: impur
  alternative: souillé
  rationale: « Impur » est le terme français courant pour la catégorie rituelle exprimée par טָמֵא. Il ne réduit pas cette catégorie à une salissure physique et n’en fait pas automatiquement une faute morale.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe impersonnelle convient à une procédure légale et rituelle. Le vocabulaire évite aussi bien l’archaïsme que l’introduction d’un diagnostic moderne absent du texte.
