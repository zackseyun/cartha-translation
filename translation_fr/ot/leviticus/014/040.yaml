  source_fidelity: Le texte rend fidèlement la séquence injonctive de וְצִוָּה, l’enlèvement des pierres, la référence de « les », le rejet hors de la ville et la destination rituellement impure. « Pierres atteintes » constitue une condensation française recevable de « les pierres dans lesquelles se trouve l’atteinte »; la note restitue utilement la formulation spatiale de l’hébreu sans prétendre identifier le phénomène.
  naturalness: Le français est moderne, fluide et adapté au registre procédural du Lévitique. « Alors le prêtre ordonnera qu’on retire … et qu’on les jette » est idiomatique; l’impersonnel ne spécifie pas des exécutants que le texte ne nomme pas explicitement.
  terminology: « Atteinte » préserve avec prudence l’indétermination de נֶגַע dans le contexte d’une maison et évite un diagnostic matériel ou médical indu. « Impur » rend correctement la catégorie rituelle de טָמֵא, de façon plus technique et moins matérielle que « sale ».
