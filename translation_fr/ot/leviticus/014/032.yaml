id: LEV.14.32
reference: Leviticus 14:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זֹ֣את תּוֹרַ֔ת אֲשֶׁר בּ֖/וֹ נֶ֣גַע צָרָ֑עַת אֲשֶׁ֛ר לֹֽא תַשִּׂ֥יג יָד֖/וֹ בְּ/טָהֳרָתֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/032.yaml
  text: This is the law for him in whom there is an infection of skin disease[b][a], whose means cannot afford what is required for his cleansing.
translation:
  language: fr
  text: Voici la loi concernant celui qui est atteint d’une affection de la peau[a] et qui n’a pas les moyens nécessaires à sa purification[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu צָרָעַת, traditionnellement traduit par « lèpre », désigne dans le Lévitique une catégorie plus large d’affections graves de la peau et d’impureté rituelle; il ne correspond pas nécessairement à la maladie de Hansen.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dont la main n’atteint pas lors de sa purification »; cette expression signifie que la personne ne dispose pas de ressources suffisantes pour ce qui est exigé en vue de sa purification.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: la loi concernant
  rationale: Dans ce contexte sacerdotal, תּוֹרָה désigne la règle ou la procédure prescrite; « la loi concernant » introduit naturellement la personne visée.
- source_word: בּוֹ נֶגַע צָרָעַת
  choice: qui est atteint d’une affection de la peau
  rationale: La formulation exprime la présence de l’affection chez la personne. « Affection de la peau » évite d’identifier à tort צָרָעַת à la seule maladie de Hansen, tandis que « atteint » rend idiomatiquement l’idée portée par נֶגַע.
- source_word: לֹא תַשִּׂיג יָדוֹ
  choice: qui n’a pas les moyens nécessaires
  rationale: L’expression signifie littéralement que sa main « n’atteint pas » et désigne ici l’insuffisance de ses ressources; la traduction française en donne clairement le sens économique.
- source_word: בְּטָהֳרָתוֹ
  choice: à sa purification
  rationale: Le terme renvoie à la procédure rituelle décrite dans les versets précédents. « Purification » conserve cette dimension rituelle plus précisément que le seul « nettoyage ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste concise comme l’hébreu, tout en explicitant naturellement l’idiome économique; elle préserve aussi la portée rituelle de « purification ».
