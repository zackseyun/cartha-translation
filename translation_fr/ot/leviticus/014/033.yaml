  yaml_path: translation/ot/leviticus/014/033.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: fr
  text: 'Yahweh[a] parla à Moïse et à Aaron en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le Seigneur ».'
    reason: Signaler la forme hébraïque du nom divin et son rendu traditionnel.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le waw consécutif avec דבר introduit un nouvel acte de parole dans le récit. « Parla » rend naturellement cette formule en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin YHWH. « Yahweh » le restitue comme nom propre plutôt que de lui substituer le titre traditionnel « le Seigneur ».
- source_word: אֶל מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל désigne ici le destinataire de la parole; « à » est son équivalent français naturel.
- source_word: וְאֶל אַהֲרֹן
  choice: et à Aaron
  rationale: La répétition de la préposition indique explicitement qu’Aaron, comme Moïse, est destinataire de la parole; elle est conservée en français.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Dans cette formule introductive du discours direct, « en ces termes » est une tournure française naturelle qui évite la lourdeur de « disant » tout en annonçant fidèlement les paroles qui suivent.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le verset emploie directement le Tétragramme. Le rendre par « Yahweh » préserve le nom personnel présent dans le texte hébreu sans le remplacer par un titre.
translation_notes:
  register: 'Français international moderne, clair et digne. La formule hébraïque de discours est rendue idiomatiquement par « en ces termes : », qui prépare la suite du discours direct.'
