source:
  edition: WLC
  text: וּ/שְׁתֵּ֣י תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֲשֶׁ֥ר תַּשִּׂ֖יג יָד֑/וֹ וְ/הָיָ֤ה אֶחָד֙ חַטָּ֔את וְ/הָ/אֶחָ֖ד עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/022.yaml
  text: and two turtledoves or two young pigeons[a], as his means can afford; and one shall be a sin offering and the other a burnt offering.
translation:
  language: fr
  text: et deux tourterelles ou deux jeunes pigeons qu’il peut se procurer selon ses moyens. L’un sera un sacrifice pour le péché[a], et l’autre un holocauste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification ». Le terme hébreu peut désigner le sacrifice servant à la purification dans un contexte rituel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי תֹרִים
  choice: et deux tourterelles
  rationale: La conjonction poursuit la liste du verset précédent, et תֹרִים désigne précisément des tourterelles, oiseaux sacrificiels habituels dans le Lévitique.
- source_word: אוֹ שְׁנֵי בְּנֵי יוֹנָה
  choice: ou deux jeunes pigeons
  rationale: L’expression idiomatique בְּנֵי יוֹנָה désigne de jeunes pigeons; cette formulation naturelle conserve la nuance d’âge.
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: selon ses moyens
  rationale: Littéralement, ce que sa main peut atteindre; l’expression hébraïque évoque ici la capacité matérielle de la personne.
- source_word: חַטָּאת
  choice: un sacrifice pour le péché
  rationale: Cette désignation cultuelle traditionnelle reste claire en français tout en laissant signaler en note la nuance possible de purification rituelle.
- source_word: עֹלָה
  choice: un holocauste
  rationale: Holocauste est le terme français établi pour le sacrifice entièrement brûlé, dont la fumée monte.
theological_decisions:
- issue: Sens de חַטָּאת dans un contexte rituel de purification
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le terme peut nommer un sacrifice lié au péché tout en mettant, dans ce contexte, l’accent sur la purification rituelle. Le texte principal conserve la désignation cultuelle familière et la note préserve l’autre nuance sans trancher artificiellement.
translation_notes:
  register: Français international moderne, sobre et digne. « Selon ses moyens » restitue naturellement l’idiome économique; « l’un… l’autre » rend clairement la répartition des deux oiseaux.
