  text: וְ/לָקַ֣ח אֶת עֵֽץ הָ֠/אֶרֶז וְ/אֶת הָ֨/אֵזֹ֜ב וְ/אֵ֣ת שְׁנִ֣י הַ/תּוֹלַ֗עַת וְ/אֵת֮ הַ/צִּפֹּ֣ר הַֽ/חַיָּה֒ וְ/טָבַ֣ל אֹתָ֗/ם בְּ/דַם֙ הַ/צִּפֹּ֣ר הַ/שְּׁחוּטָ֔ה וּ/בַ/מַּ֖יִם הַֽ/חַיִּ֑ים וְ/הִזָּ֥ה אֶל הַ/בַּ֖יִת שֶׁ֥בַע פְּעָמִֽים־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/051.yaml
  text: Then he shall take the cedar wood[a], the hyssop, the scarlet yarn, and the living bird, and dip them in the blood of the slaughtered bird and in the fresh water[b], and sprinkle the house seven times.
translation:
  language: fr
  text: Il prendra le bois de cèdre, l’hysope, le fil écarlate[a] et l’oiseau vivant. Il les trempera dans le sang de l’oiseau égorgé et dans l’eau vive[b], puis il aspergera la maison sept fois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « l’écarlate du ver »; l’expression est traditionnellement comprise comme du fil ou une matière textile teinte en écarlate.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « eau vivante », c’est-à-dire de l’eau fraîche provenant d’une source ou de l’eau courante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Il prendra
  rationale: Dans cette prescription rituelle, la forme verbale coordonnée exprime l’étape suivante de la procédure; le futur français convient naturellement au registre légal.
- source_word: עֵץ הָאֶרֶז
  choice: le bois de cèdre
  rationale: Rend directement le syntagme hébreu désignant le cèdre comme matériau rituel.
- source_word: הָאֵזֹב
  choice: l’hysope
  rationale: Terme français traditionnel et précis pour cette plante rituelle, sans ajout explicatif dans le texte.
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: le fil écarlate
  rationale: L’expression désigne une matière textile teinte en écarlate; « fil écarlate » est clair et idiomatique, tandis que le sens littéral est signalé en note.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: l’oiseau vivant
  rationale: Préserve le contraste explicite avec l’oiseau égorgé.
- source_word: וְטָבַל אֹתָם
  choice: Il les trempera
  rationale: טבל signifie tremper ou immerger; « tremper » est naturel dans cette description rituelle. Le pluriel « les » conserve la référence à l’ensemble des éléments énumérés.
- source_word: בְּדַם הַצִּפֹּר הַשְּׁחוּטָה
  choice: dans le sang de l’oiseau égorgé
  rationale: « Égorgé » restitue la mise à mort rituelle exprimée par שׁחט plus précisément que le terme général « tué ».
- source_word: וּבַמַּיִם הַחַיִּים
  choice: et dans l’eau vive
  rationale: « Eau vive » conserve l’image hébraïque tout en désignant en français une eau fraîche provenant d’une source ou d’un courant; une note explicite cette valeur contextuelle.
- source_word: וְהִזָּה אֶל הַבַּיִת
  choice: puis il aspergera la maison
  rationale: Le hifil de נזה est le verbe usuel de l’aspersion rituelle. La construction française avec complément direct exprime naturellement l’action orientée vers la maison.
- source_word: שֶׁבַע פְּעָמִים
  choice: sept fois
  rationale: Rendu direct de l’expression numérique adverbiale.
theological_decisions:
- issue: Sens de מַיִם חַיִּים dans la législation rituelle
  choice: eau vive
  alternative: eau fraîche; eau courante
  rationale: Le syntagme signifie littéralement « eaux vivantes » et désigne ici une eau fraîche, issue d’une source ou courante. « Eau vive » préserve l’expression imagée sans imposer au passage les résonances théologiques de textes ultérieurs; la note en précise le sens concret.
translation_notes:
  register: Français international moderne, clair et digne. Le futur maintient le caractère prescriptif du rituel. La division en deux phrases allège une longue coordination hébraïque sans modifier l’ordre des actions.
