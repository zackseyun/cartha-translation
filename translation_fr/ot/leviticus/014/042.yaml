source:
  edition: WLC
  text: וְ/לָקְחוּ֙ אֲבָנִ֣ים אֲחֵר֔וֹת וְ/הֵבִ֖יאוּ אֶל תַּ֣חַת הָ/אֲבָנִ֑ים וְ/עָפָ֥ר אַחֵ֛ר יִקַּ֖ח וְ/טָ֥ח אֶת הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/042.yaml
  text: Then they shall take other stones and bring them in place of the stones[b][a], and he shall take other mortar and plaster the house.
translation:
  language: fr
  text: Puis on prendra d’autres pierres et on les mettra à la place des pierres retirées[a]. On prendra un autre mortier[b] et on enduira la maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sous les pierres »; l’expression signifie ici « à la place des pierres », c’est-à-dire pour les remplacer.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une autre terre ». Le mot hébreu désigne littéralement de la poussière ou de la terre; ici, il s’agit du matériau utilisé pour refaire l’enduit de la maison. L’hébreu passe en outre du pluriel (« ils prendront ») au singulier (« il prendra »).'
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Puis on prendra
  rationale: Le parfait qal précédé du waw poursuit la séquence des prescriptions. « Puis » exprime cette succession, et le pronom indéfini « on » convient au français juridique courant tout en laissant l’agent non précisé.
- source_word: אֲבָנִים אֲחֵרוֹת
  choice: d’autres pierres
  rationale: Rend directement l’idée de pierres différentes destinées au remplacement.
- source_word: וְהֵבִיאוּ אֶל תַּחַת הָאֲבָנִים
  choice: on les mettra à la place des pierres retirées[a]
  rationale: תַּחַת a ici sa valeur de substitution, et non sa valeur spatiale habituelle « sous ». « Retirées » explicite sobrement l’antécédent contextuel des pierres remplacées.
- source_word: וְעָפָר אַחֵר
  choice: un autre mortier[b]
  rationale: עָפָר désigne littéralement de la terre ou de la poussière, mais, dans cette réparation, il s’agit du matériau terreux servant à refaire l’enduit. « Mortier » distingue naturellement le matériau de l’action d’enduire.
- source_word: יִקַּח
  choice: On prendra
  rationale: Le verbe hébreu passe du pluriel au masculin singulier. Le français indéfini « on » permet de ne pas identifier artificiellement l’agent; une note signale le changement grammatical de nombre.
- source_word: וְטָח אֶת הַבָּיִת
  choice: et on enduira la maison
  rationale: טוח signifie appliquer un enduit ou crépir. « Enduire » est précis, naturel et évite la répétition peu élégante de « plâtre/plâtrer ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La formulation suit la séquence procédurale sans archaïsme. Le changement hébreu du pluriel au singulier n’est pas attribué à un acteur déterminé; il est signalé en note plutôt qu’harmonisé silencieusement.
