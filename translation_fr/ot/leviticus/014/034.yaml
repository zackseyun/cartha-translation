source:
  edition: WLC
  text: כִּ֤י תָבֹ֨אוּ֙ אֶל אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁ֥ר אֲנִ֛י נֹתֵ֥ן לָ/כֶ֖ם לַ/אֲחֻזָּ֑ה וְ/נָתַתִּי֙ נֶ֣גַע צָרַ֔עַת בְּ/בֵ֖ית אֶ֥רֶץ אֲחֻזַּתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/034.yaml
  text: When you enter the land of Canaan that I am giving to you as a possession[a], and I put an outbreak of skin disease in a house in the land of your possession,
translation:
  language: fr
  text: Lorsque vous entrerez dans le pays de Canaan, que je vous donne en possession, et que je mettrai une plaie de lèpre[a] dans une maison du pays que vous possédez,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une plaie de tsaraath ». Le terme hébreu désigne diverses affections ou contaminations pouvant toucher des personnes, des vêtements ou des maisons; il ne correspond donc pas seulement à la maladie aujourd’hui appelée lèpre.
    reason: Préciser l’étendue du terme hébreu et éviter que « lèpre » soit compris comme un diagnostic médical moderne.
lexical_decisions:
- source_word: כִּי
  choice: Lorsque
  rationale: Dans ce contexte législatif, la conjonction introduit une circonstance future attendue plutôt qu’une simple condition hypothétique.
- source_word: תָבֹאוּ אֶל אֶרֶץ כְּנַעַן
  choice: vous entrerez dans le pays de Canaan
  rationale: Cette formulation rend naturellement en français le mouvement vers l’intérieur du territoire.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: que je vous donne
  rationale: Le présent français convient au participe hébreu et présente le don du pays comme l’action actuelle et certaine de Dieu.
- source_word: לַאֲחֻזָּה
  choice: en possession
  rationale: Le terme désigne un bien foncier détenu durablement; « possession » conserve ce sens sans imposer l’idée plus précise d’héritage.
- source_word: וְנָתַתִּי
  choice: et que je mettrai
  rationale: Le verbe signifie littéralement « donner » ou « mettre ». « Mettrai » reste naturel avec une atteinte tout en conservant explicitement l’action divine.
- source_word: נֶגַע צָרַעַת
  choice: une atteinte de lèpre
  rationale: « Atteinte » rend le phénomène observable sans le réduire à un diagnostic moderne. « Lèpre », accompagné d’une note, maintient le lien lexical avec la catégorie hébraïque qui peut toucher personnes, vêtements et maisons.
- source_word: בְּבֵית
  choice: dans une maison
  rationale: La préposition est rendue selon son sens locatif naturel dans ce contexte.
- source_word: אֶרֶץ אֲחֻזַּתְכֶם
  choice: le pays qui est votre possession
  rationale: Cette formulation conserve la reprise du vocabulaire de la possession et le rapport au territoire donné.
theological_decisions:
- issue: L’action divine dans l’atteinte de la maison
  choice: 'Conserver l’action explicite de Dieu : « je mettrai »'
  alternative: Employer une tournure impersonnelle telle que « une atteinte apparaîtra »
  rationale: Le texte hébreu attribue directement l’événement à Dieu. La traduction maintient cette tension théologique au lieu de l’atténuer.
translation_notes:
  register: Français international actuel, digne et lisible. La phrase demeure ouverte par une virgule, car la proposition principale de cette disposition légale se poursuit au verset suivant.
