    reason: cultural_note
  revision_rationale: La révision conserve tous les référents et la progression du texte hébreu, rend plus directement le rapport entre l’agneau et le sacrifice de réparation, et rétablit la terminologie spécifique de l’agitation rituelle (הֵנִיף … תְּנוּפָה). La répétition de « le prêtre » reflète également celle du sujet dans l’hébreu, sans nuire sensiblement à la lisibilité.
