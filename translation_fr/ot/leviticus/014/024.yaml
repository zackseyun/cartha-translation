source:
  edition: WLC
  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן אֶת כֶּ֥בֶשׂ הָ/אָשָׁ֖ם וְ/אֶת לֹ֣ג הַ/שָּׁ֑מֶן וְ/הֵנִ֨יף אֹתָ֧/ם הַ/כֹּהֵ֛ן תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/024.yaml
  text: Then the priest shall take the guilt-offering lamb and the log of oil[b][a], and the priest shall wave them as a wave offering before Yahweh.
translation:
  language: fr
  text: Puis le prêtre prendra l’agneau du sacrifice de réparation[a] et le log d’huile[b], et le prêtre les agitera comme offrande agitée devant Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’agneau du sacrifice de réparation »; traditionnellement : « l’agneau du sacrifice pour le délit ».'
    reason: lexical_alternative
  - marker: b
    text: Le « log » était une petite unité de capacité employée dans le système rituel d’Israël.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: Puis … prendra
  rationale: Le waw suivi du qatal poursuit la séquence rituelle; « Puis » exprime naturellement cette progression en français.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Équivalent courant de כֹּהֵן dans un contexte cultuel; la répétition hébraïque du sujet est représentée par le pronom « il » afin d’éviter une lourdeur en français.
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: l’agneau destiné au sacrifice de réparation
  rationale: Cette formulation conserve le rapport entre l’agneau et la catégorie sacrificielle אָשָׁם, tout en étant naturelle et compréhensible en français moderne.
- source_word: לֹג הַשָּׁמֶן
  choice: le log d’huile
  rationale: לֹג désigne une unité précise de capacité; la translittération préserve le terme technique, expliqué en note.
- source_word: וְהֵנִיף … תְּנוּפָה
  choice: présentera … en faisant le geste rituel de présentation
  rationale: Le verbe et son nom apparenté décrivent une présentation cultuelle effectuée par un mouvement rituel. Cette traduction évite l’expression française potentiellement trompeuse « offrande balancée » tout en conservant l’action.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom pluriel renvoie conjointement à l’agneau et au log d’huile.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: La préposition exprime la présentation en présence de Dieu, et le nom divin est rendu directement par « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » en conserve la fonction de nom propre sans le remplacer par un titre.
- issue: Sens sacrificiel de אָשָׁם
  choice: sacrifice de réparation
  alternative: sacrifice de culpabilité; sacrifice pour le délit
  rationale: « Sacrifice de réparation » exprime la catégorie rituelle liée à la culpabilité et à la responsabilité encourue, sans recourir à une terminologie française archaïque ni réduire le terme à un simple sentiment de culpabilité.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les termes cultuels nécessaires, explique l’unité ancienne en note et rend l’expression hébraïque redondante וְהֵנִיף … תְּנוּפָה par une tournure française claire qui maintient le geste rituel.
