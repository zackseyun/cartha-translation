source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן אֶת הַ/כֶּ֣בֶשׂ הָ/אֶחָ֗ד וְ/הִקְרִ֥יב אֹת֛/וֹ לְ/אָשָׁ֖ם וְ/אֶת לֹ֣ג הַ/שָּׁ֑מֶן וְ/הֵנִ֥יף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/012.yaml
  text: Then the priest shall take the one male lamb and present it as a guilt offering[a], along with the log of oil[b], and he shall wave them as a wave offering before Yahweh.
translation:
  language: fr
  text: Puis le prêtre prendra l’un des agneaux mâles et le présentera en sacrifice de réparation[a], avec le log d’huile[b]. Il les présentera devant Yahweh en les agitant comme offrande de présentation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en sacrifice de culpabilité ».
    reason: lexical_alternative
  - marker: b
    text: Le log était une petite unité de capacité pour les liquides, employée dans le système rituel d’Israël.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: Puis … prendra
  rationale: Le waw poursuit la séquence rituelle; « Puis » exprime naturellement cette progression, et le futur garde la valeur prescriptive.
- source_word: הַכֶּבֶשׂ הָאֶחָד
  choice: l’un des agneaux mâles
  rationale: Le nom désigne un agneau mâle, et l’article avec le numéral distingue celui-ci des autres animaux du rite.
- source_word: וְהִקְרִיב אֹתוֹ
  choice: le présentera
  rationale: Dans ce contexte sacrificiel, le verbe signifie amener ou présenter l’animal en vue de l’offrande, sans désigner encore un geste d’immolation précis.
- source_word: לְאָשָׁם
  choice: en sacrifice de réparation
  rationale: אָשָׁם est ici un terme sacrificiel technique. « Réparation » rend sa dimension de compensation sans effacer son rapport à la culpabilité.
- source_word: לֹג הַשָּׁמֶן
  choice: le log d’huile
  rationale: Le log est une unité précise de capacité liquide; conserver son nom évite une conversion moderne incertaine.
- source_word: וְהֵנִיף אֹתָם תְּנוּפָה
  choice: Il les présentera … en faisant le geste rituel de présentation
  rationale: La formulation française rend à la fois le verbe הניף et le nom apparenté תְּנוּפָה, tout en évitant d’imposer une reconstruction incertaine du mouvement exact.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » convient à la formule de présence rituelle, et le nom divin est rendu directement par « Yahweh ».
theological_decisions:
- issue: Sens sacrificiel de אָשָׁם
  choice: sacrifice de réparation
  alternative: sacrifice de culpabilité
  rationale: Le terme peut mettre en avant la culpabilité comme la réparation qui lui est liée. Le choix principal souligne la fonction réparatrice du sacrifice, tandis qu’une note conserve l’autre formulation traditionnelle.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le nom divin; sa translittération le distingue du titre אֲדֹנָי et préserve sa fonction de nom propre.
translation_notes:
  register: Français moderne, clair et digne. La terminologie rituelle demeure précise, mais la tournure évite le calque peu naturel « agiter en offrande agitée ». Les marqueurs de note ont été alignés sur leur objet respectif dans le texte.
