source:
  edition: WLC
  text: וְ/עָשָׂ֤ה הַ/כֹּהֵן֙ אֶת הַ֣/חַטָּ֔את וְ/כִפֶּ֕ר עַל הַ/מִּטַּהֵ֖ר מִ/טֻּמְאָת֑/וֹ וְ/אַחַ֖ר יִשְׁחַ֥ט אֶת הָ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/019.yaml
  text: Then the priest shall offer the sin offering and make atonement for the one being cleansed from his uncleanness[a]; and afterward he shall slaughter the burnt offering.
translation:
  language: fr
  text: Puis le prêtre offrira le sacrifice pour le péché[a] et fera l’expiation pour celui qui est purifié de son impureté. Après cela, il égorgera l’holocauste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sacrifice de purification ». Le terme hébreu חַטָּאת peut désigner le sacrifice servant à la purification dans les rites du Lévitique.
    reason: Alternative lexicale reflétant la fonction rituelle possible du terme.
lexical_decisions:
- source_word: וְעָשָׂה
  choice: offrira
  rationale: Dans ce contexte sacrificiel, עשה signifie accomplir ou offrir un sacrifice. « Offrira » exprime naturellement cette valeur cultuelle.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Équivalent français courant et précis du nom défini dans ce contexte rituel.
- source_word: הַחַטָּאת
  choice: le sacrifice pour le péché
  rationale: Le terme désigne ici un sacrifice, puisqu’il est l’objet de l’action sacerdotale. Cette formulation conserve le lien lexical avec le péché, tandis que l’autre interprétation rituelle est signalée en note.
- source_word: וְכִפֶּר
  choice: fera l’expiation
  rationale: Expression française établie qui préserve la portée rituelle et théologique de כפר sans préciser une théorie particulière de l’expiation.
- source_word: עַל
  choice: pour
  rationale: Avec כפר, la préposition introduit ici la personne en faveur de laquelle l’expiation est accomplie.
- source_word: הַמִּטַּהֵר
  choice: celui qui se purifie
  rationale: Le participe hitpael désigne la personne engagée dans le processus rituel de purification. La tournure pronominale française conserve la nuance réfléchie ou médio-passive du verbe.
- source_word: מִטֻּמְאָתוֹ
  choice: de son impureté
  rationale: טֻמְאָה désigne l’impureté rituelle dans le Lévitique. Le possessif masculin singulier correspond au suffixe hébreu.
- source_word: וְאַחַר
  choice: Après cela
  rationale: Cette expression marque clairement la succession des étapes du rite.
- source_word: יִשְׁחַט
  choice: il égorgera
  rationale: שחט est le verbe technique de l’abattage sacrificiel. « Égorger » rend précisément l’action dans un français biblique naturel.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: Terme français traditionnel et concis pour le sacrifice entièrement consumé désigné par עֹלָה.
theological_decisions:
- issue: Sens de חַטָּאת dans le contexte sacrificiel lévitique
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: חַטָּאת est un terme sacrificiel pouvant mettre l’accent soit sur le péché, soit sur la fonction purificatrice du rite. Le texte principal retient l’appellation française largement reconnue, et la note préserve l’autre analyse particulièrement pertinente dans un contexte d’impureté rituelle.
- issue: Valeur du participe הַמִּטַּהֵר
  choice: celui qui se purifie
  alternative: celui qui est purifié
  rationale: La forme hitpael peut présenter la personne comme engagée dans la purification sans déterminer à elle seule si elle agit directement ou subit principalement le rite. La tournure pronominale française maintient cette ouverture mieux qu’un passif explicite.
- issue: Genre et nombre du suffixe dans מִטֻּמְאָתוֹ
  choice: son impureté, avec un référent masculin singulier
  alternative: leur impureté
  rationale: Le suffixe hébreu est masculin singulier; la traduction en respecte le nombre et le genre grammatical sans le neutraliser.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire sacrificiel établi (« expiation », « holocauste », « égorgera ») est conservé pour sa précision, tandis que la syntaxe reste simple et naturelle.
