id: LEV.14.4
reference: Leviticus 14:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/צִוָּה֙ הַ/כֹּהֵ֔ן וְ/לָקַ֧ח לַ/מִּטַּהֵ֛ר שְׁתֵּֽי צִפֳּרִ֥ים חַיּ֖וֹת טְהֹר֑וֹת וְ/עֵ֣ץ אֶ֔רֶז וּ/שְׁנִ֥י תוֹלַ֖עַת וְ/אֵזֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/004.yaml
  text: Then the priest shall command that two live clean birds[a], cedar wood, scarlet yarn[b], and hyssop be taken for the one being cleansed.
translation:
  language: fr
  text: Puis le prêtre ordonnera de prendre, pour la personne en cours de purification, deux oiseaux vivants et purs, du bois de cèdre, du fil écarlate[a] et de l’hysope[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la matière teinte en écarlate ». L’expression hébraïque désigne une matière colorée en écarlate, mais sa forme exacte n’est pas certaine.
    reason: lexical_alternative
  - marker: b
    text: L’identification exacte de la plante appelée ici « hysope » est incertaine; la désignation traditionnelle est conservée.
    reason: cultural_note
lexical_decisions:
- source_word: וְצִוָּה
  choice: Puis le prêtre ordonnera
  rationale: Dans cette procédure rituelle, le waw suivi du parfait fait progresser la suite des instructions. « Puis » exprime naturellement cette succession, tandis que le futur conserve la valeur prescriptive.
- source_word: וְלָקַח
  choice: de prendre
  rationale: Après « ordonnera », l’infinitif français rend naturellement l’instruction de se procurer les éléments requis sans affirmer que le prêtre doit nécessairement les prendre lui-même.
- source_word: לַמִּטַּהֵר
  choice: pour la personne en cours de purification
  rationale: Le participe hitpael désigne la personne engagée dans le processus de purification rituelle. Cette formulation inclusive préserve l’idée d’un processus en cours.
- source_word: שְׁתֵּי צִפֳּרִים חַיּוֹת טְהֹרוֹת
  choice: deux oiseaux vivants et purs
  rationale: צִפּוֹר est un terme général pour un oiseau, et non spécifiquement un moineau. « Purs » garde ici le vocabulaire rituel lévitique sans ajouter une explication dans le texte.
- source_word: עֵץ אֶרֶז
  choice: du bois de cèdre
  rationale: Le syntagme construit désigne le bois ou matériau de cèdre employé dans le rite; cette expression est précise et naturelle en français.
- source_word: שְׁנִי תוֹלַעַת
  choice: du fil écarlate
  rationale: L’expression désigne une matière teinte en écarlate, probablement sous forme de fil ou de textile. « Fil écarlate » est clair et traditionnel, tout en signalant en note l’incertitude sur la forme exacte.
- source_word: אֵזֹב
  choice: de l’hysope
  rationale: « Hysope » est la désignation traditionnelle dans les contextes rituels bibliques; elle évite de trancher une identification botanique incertaine.
theological_decisions: []
