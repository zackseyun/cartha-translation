  text: וְ/שִׁלַּ֞ח אֶת הַ/צִּפֹּ֧ר הַֽ/חַיָּ֛ה אֶל מִ/ח֥וּץ לָ/עִ֖יר אֶל פְּנֵ֣י הַ/שָּׂדֶ֑ה וְ/כִפֶּ֥ר עַל הַ/בַּ֖יִת וְ/טָהֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/053.yaml
  text: Then he shall release the live bird outside the city into the open field. Thus he shall make atonement for the house[a], and it shall be clean.
translation:
  language: fr
  text: Puis il relâchera l’oiseau vivant hors de la ville, dans la campagne. Ainsi, il fera l’expiation pour la maison[a], et elle sera pure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il accomplira le rite d’expiation pour la maison » ou « il purifiera rituellement la maison ». L’hébreu emploie ici le vocabulaire sacerdotal de l’expiation dans un contexte de purification rituelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּח
  choice: Puis il relâchera
  rationale: Le piel de שלח désigne ici l’acte rituel consistant à laisser partir librement l’oiseau. « Relâchera » est naturel en français, et « Puis » exprime la succession marquée par le waw.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: l’oiseau vivant
  rationale: L’adjectif distingue cet oiseau de celui qui a été tué auparavant; cette formulation concise conserve clairement le contraste.
- source_word: אֶל מִחוּץ לָעִיר
  choice: hors de la ville
  rationale: La locution indique un déplacement au-delà des limites de la ville. « Hors de la ville » convient au registre soutenu mais accessible du passage.
- source_word: אֶל פְּנֵי הַשָּׂדֶה
  choice: en pleine campagne
  rationale: L’expression idiomatique évoque l’espace découvert des champs, à l’extérieur de la ville, plutôt que la surface d’un champ particulier.
- source_word: וְכִפֶּר עַל הַבַּיִת
  choice: il accomplira le rite d’expiation pour la maison
  rationale: כפר appartient au langage sacerdotal de l’expiation. L’ajout de « rite » rend la construction française naturelle lorsqu’une maison en est l’objet, sans réduire le terme à un simple nettoyage ni résoudre sa tension théologique.
- source_word: וְטָהֵר
  choice: et elle sera pure
  rationale: Le verbe décrit le statut rituel qui en résulte pour la maison. Le pronom féminin explicite le sujet, et « pure » maintient le vocabulaire de pureté rituelle.
theological_decisions:
- issue: Sens de כפר dans un rite de purification appliqué à une maison
  choice: accomplir le rite d’expiation pour la maison
  alternative: purifier la maison / faire propitiation pour la maison
  rationale: La traduction conserve le langage sacerdotal d’expiation, même appliqué à une maison, tout en signalant son cadre rituel. « Purifier » risquerait d’effacer la distinction avec טהר, tandis que « propitiation » préciserait indûment une théorie théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur normatif convient aux prescriptions rituelles. « En pleine campagne » restitue naturellement l’idiome spatial; « pure » préserve la catégorie rituelle plutôt que la seule idée de propreté.
