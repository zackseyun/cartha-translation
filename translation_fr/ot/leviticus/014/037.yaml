id: LEV.14.37
reference: Leviticus 14:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/רָאָ֣ה אֶת הַ/נֶּ֗גַע וְ/הִנֵּ֤ה הַ/נֶּ֨גַע֙ בְּ/קִירֹ֣ת הַ/בַּ֔יִת שְׁקַֽעֲרוּרֹת֙ יְרַקְרַקֹּ֔ת א֖וֹ אֲדַמְדַּמֹּ֑ת וּ/מַרְאֵי/הֶ֥ן שָׁפָ֖ל מִן הַ/קִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/037.yaml
  text: He shall examine the infection, and if the infection is in the walls of the house as sunken areas, greenish or reddish, and their appearance is deeper than the wall,
translation:
  language: fr
  text: 'Il examinera la lésion : si la lésion présente, sur les murs de la maison, des creux verdâtres ou rougeâtres qui paraissent[a] en retrait par rapport à la surface du mur,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dont l’aspect est plus bas que le mur » ; autrement dit, ils semblent en retrait par rapport à la surface du mur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: Il examinera
  rationale: Dans cette procédure de diagnostic sacerdotal, ראה signifie examiner ou inspecter, et non simplement voir.
- source_word: הַנֶּגַע
  choice: la lésion
  rationale: נגע désigne ici une zone anormale affectant la maison. « Lésion » reste suffisamment large sans suggérer à tort une infection biologique certaine.
- source_word: וְהִנֵּה
  choice: si
  rationale: Dans ce texte procédural, l’expression introduit ce que révèle l’examen; « si » en restitue naturellement la valeur conditionnelle.
- source_word: בְּקִירֹת הַבַּיִת
  choice: sur les murs de la maison
  rationale: En français, une altération visible de la surface murale se situe naturellement « sur » les murs, même si les creux s’enfoncent dans leur matière.
- source_word: שְׁקַעֲרוּרֹת
  choice: des creux
  rationale: Ce terme rare désigne des zones enfoncées ou des dépressions. « Creux » est clair, concret et naturel.
- source_word: יְרַקְרַקֹּת
  choice: verdâtres
  rationale: La forme exprime une teinte tirant sur le vert plutôt qu’un vert franc.
- source_word: אֲדַמְדַּמֹּת
  choice: rougeâtres
  rationale: La forme exprime une teinte tirant sur le rouge plutôt qu’un rouge vif.
- source_word: וּמַרְאֵיהֶן
  choice: qui paraissent
  rationale: Cette formulation rend l’aspect visuel des creux et s’accorde idiomatiquement avec le pluriel français.
- source_word: שָׁפָל מִן הַקִּיר
  choice: plus profonds que la surface du mur
  rationale: Littéralement « plus bas que le mur »; dans ce contexte, il s’agit de zones qui semblent en retrait par rapport à la surface murale.
theological_decisions: []
