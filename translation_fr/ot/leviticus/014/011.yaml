source:
  edition: WLC
  text: וְ/הֶעֱמִ֞יד הַ/כֹּהֵ֣ן הַֽ/מְטַהֵ֗ר אֵ֛ת הָ/אִ֥ישׁ הַ/מִּטַּהֵ֖ר וְ/אֹתָ֑/ם לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/011.yaml
  text: And the priest who cleanses shall present the man who is being cleansed, along with those things, before Yahweh at the entrance of the tent of meeting.
translation:
  language: fr
  text: Le prêtre qui accomplit la purification présentera devant Yahweh, à l’entrée de la tente de la rencontre, l’homme en cours de purification, ainsi que ces choses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: présentera
  rationale: Le hifil de עמד signifie ici faire tenir quelqu’un ou quelque chose devant Yahweh dans un cadre rituel. « Présentera » exprime naturellement cette comparution cultuelle.
- source_word: הַכֹּהֵן הַמְטַהֵר
  choice: le prêtre qui accomplit la purification
  rationale: Le participe piel décrit le rôle actif du prêtre dans le rite. Cette formulation évite de suggérer qu’il produit une pureté morale tout en couvrant l’ensemble de ses gestes rituels.
- source_word: הָאִישׁ הַמִּטַּהֵר
  choice: l’homme qui se purifie
  rationale: « L’homme » conserve le masculin explicite de אִישׁ. La forme hitpael de טהר peut décrire celui qui se soumet au processus de purification; le français pronominal en préserve la nuance sans imposer un passif absent de la forme.
- source_word: וְאֹתָם
  choice: ainsi que ces choses
  rationale: Le pronom masculin pluriel renvoie aux éléments énumérés au verset précédent. « Ces choses » explicite ce référent non humain et évite l’ambiguïté de « eux ».
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » conserve la formulation cultuelle concise, et le nom divin est translittéré « Yahweh » conformément à sa présence explicite dans l’hébreu.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à l’entrée de la tente de la rencontre
  rationale: Cette formulation rend le lieu du sanctuaire de manière exacte et idiomatique; « tente de la rencontre » exprime la fonction de אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Rôle du prêtre dans la purification
  choice: qui accomplit la purification
  alternative: qui purifie
  rationale: La formulation retenue indique que le prêtre officie dans le processus rituel, sans trancher au-delà du texte la question de l’efficacité propre de son action.
- issue: Valeur de הַמִּטַּהֵר
  choice: qui se purifie
  alternative: qui est purifié
  rationale: Le hitpael permet une nuance pronominale ou médio-passive. Le choix français conserve la participation du sujet au processus sans nier qu’il subit aussi les rites prescrits.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste proche de l’ordre logique de l’hébreu tout en étant naturelle; le vocabulaire rituel demeure précis sans archaïsme.
