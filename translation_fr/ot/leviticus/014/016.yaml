source:
  edition: WLC
  text: וְ/טָבַ֤ל הַ/כֹּהֵן֙ אֶת אֶצְבָּע֣/וֹ הַ/יְמָנִ֔ית מִן הַ/שֶּׁ֕מֶן אֲשֶׁ֥ר עַל כַּפּ֖/וֹ הַ/שְּׂמָאלִ֑ית וְ/הִזָּ֨ה מִן הַ/שֶּׁ֧מֶן בְּ/אֶצְבָּע֛/וֹ שֶׁ֥בַע פְּעָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/016.yaml
  text: The priest shall dip his right finger into some of the oil that is on his left palm[a], and with his finger he shall sprinkle some of the oil seven times before Yahweh.
translation:
  language: fr
  text: Le prêtre trempera son doigt droit dans l’huile qui est sur la paume de sa main gauche, puis, avec son doigt, il aspergera sept fois de cette huile devant Yahvé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טָבַל
  choice: trempera
  rationale: Le verbe désigne l’action de plonger une partie du corps ou un objet dans un liquide; «tremper» est naturel ici puisque seul le doigt est concerné.
- source_word: אֶצְבָּעוֹ הַיְמָנִית
  choice: son doigt droit
  rationale: Cette formulation directe conserve la précision corporelle du rite sans ajouter «de la main» au texte hébreu.
- source_word: מִן הַשֶּׁמֶן אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: dans l’huile qui est sur la paume de sa main gauche
  rationale: Après «tremper», la préposition מן se rend naturellement par «dans» en français; כף désigne ici la paume, et l’expression explicite «de sa main gauche» est idiomatique.
- source_word: הִזָּה
  choice: aspergera
  rationale: Dans ce contexte rituel sacerdotal, «asperger» exprime clairement la projection prescrite d’un liquide.
- source_word: בְּאֶצְבָּעוֹ
  choice: avec son doigt
  rationale: La préposition ב marque ici l’instrument employé pour l’aspersion.
- source_word: שֶׁבַע פְּעָמִים
  choice: sept fois
  rationale: La traduction littérale préserve le nombre rituellement significatif.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahvé
  rationale: «Devant» conserve la formulation cultuelle et spatiale de לפני, tandis que le nom divin est rendu comme nom propre.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le Tétragramme. «Yahvé» le rend comme nom propre en français et évite de remplacer silencieusement le nom par un titre.
translation_notes:
  register: Français moderne, digne et accessible, avec un vocabulaire rituel précis. Le futur prescriptif convient à la suite d’instructions sacerdotales. La répétition de «son doigt» est conservée parce qu’elle reflète la formulation et le déroulement précis du rite.
