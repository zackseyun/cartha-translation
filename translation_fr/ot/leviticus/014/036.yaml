revisions:
- from: Le prêtre ordonnera alors de vider la maison avant d’y entrer pour examiner la zone atteinte[a], afin que rien de ce qui se trouve dans la maison ne devienne impur. Après cela, le prêtre entrera pour examiner la maison.
  to: Le prêtre ordonnera alors qu’on vide la maison avant qu’il ne vienne examiner la zone atteinte[a], afin que rien de ce qui se trouve dans la maison ne devienne rituellement impur. Après cela, le prêtre viendra examiner la maison.
  rationale: 'La formulation révisée suit plus étroitement la syntaxe et la progression de l’hébreu : vidage de la maison avant la venue du prêtre pour examiner la zone atteinte, puis venue du prêtre pour examiner la maison. « Qu’on vide » rend naturellement le pluriel indéfini בלי ajouter un agent identifié. « Rituellement impur » précise la portée technique de l’impureté.'
