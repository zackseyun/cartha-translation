review_pass:
  verdict: revise
  source_fidelity: 'Le sens procédural est bien rendu : le prêtre donne l’ordre de vider la maison avant son examen, afin que son contenu ne devienne pas impur, puis il examine la maison. Toutefois, « avant d’y entrer » risque de faire de l’entrée elle-même la condition temporelle, alors que l’hébreu précise explicitement : avant que le prêtre ne vienne examiner la marque/zone atteinte. La révision rétablit cet objet et évite cette légère compression.'
  naturalness: Français moderne et naturel. « Ne devienne impur » est grammatical, mais « ne devienne rituellement impur » rend plus nettement la valeur technique de טמא sans alourdir excessivement le texte.
  terminology: « Prêtre », « maison » et « examiner » conviennent. « Zone atteinte » est une option prudente pour נגע, dont le référent exact demeure volontairement non médicalisé. La note conserve utilement les possibilités lexicales.
  issues:
  - severity: medium
    issue: La première occurrence de l’examen porte explicitement sur הַנֶּגַע, mais « avant d’y entrer pour examiner la zone atteinte » peut rattacher « y entrer » de façon trop directe et est moins explicite sur la formulation source.
    rationale: Le texte hébreu dit que la maison doit être vidée avant que le prêtre ne vienne examiner la zone atteinte ; il est préférable de conserver cette construction temporelle et l’objet de l’examen.
  - severity: low
    issue: « Impur » seul peut être compris dans un sens moral ou général.
    rationale: Dans ce contexte lévitique, טמא décrit un statut rituel. L’ajout de « rituellement » lève l’ambiguïté sans introduire d’interprétation confessionnelle.
  revised_text: Le prêtre ordonnera alors qu’on vide la maison avant qu’il ne vienne examiner la zone atteinte[a], afin que rien de ce qui se trouve dans la maison ne devienne rituellement impur. Après cela, le prêtre viendra examiner la maison.
  revised_footnotes:
