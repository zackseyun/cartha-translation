  text: וְ/צִוָּ֨ה הַ/כֹּהֵ֜ן וּ/פִנּ֣וּ אֶת הַ/בַּ֗יִת בְּ/טֶ֨רֶם יָבֹ֤א הַ/כֹּהֵן֙ לִ/רְא֣וֹת אֶת הַ/נֶּ֔גַע וְ/לֹ֥א יִטְמָ֖א כָּל אֲשֶׁ֣ר בַּ/בָּ֑יִת וְ/אַ֥חַר כֵּ֛ן יָבֹ֥א הַ/כֹּהֵ֖ן לִ/רְא֥וֹת אֶת הַ/בָּֽיִת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/036.yaml
  text: Then the priest shall command that they empty the house before the priest goes in to inspect the diseased area[a], so that everything in the house may not become unclean; and afterward the priest shall go in to inspect the house.
translation:
  language: fr
  text: Le prêtre ordonnera alors qu’on vide la maison avant qu’il ne vienne examiner la zone atteinte[a], afin que rien de ce qui se trouve dans la maison ne devienne rituellement impur. Après cela, le prêtre viendra examiner la maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la marque », « l’affection » ou, traditionnellement, « le fléau ». Le mot hébreu négaʿ désigne la manifestation ou l’endroit atteint soumis à l’examen du prêtre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: ordonnera alors
  rationale: Dans cette procédure légale, le waw suivi du parfait introduit l’étape suivante; le futur normatif et « alors » rendent naturellement cette progression.
- source_word: וּפִנּוּ אֶת הַבַּיִת
  choice: de vider la maison
  rationale: Le verbe pluriel a un sujet indéfini après l’ordre du prêtre. La construction française « ordonner de » évite un « ils » sans antécédent tout en conservant l’action de retirer le contenu.
- source_word: לִרְאוֹת
  choice: examiner
  rationale: Le sens premier est « voir », mais le contexte sacerdotal est celui d’une inspection officielle; « examiner » est naturel et précis.
- source_word: הַנֶּגַע
  choice: la zone atteinte
  rationale: נֶגַע désigne ici la manifestation ou l’endroit affecté soumis à l’examen, sans imposer le diagnostic médical moderne suggéré par « infection » ni le sens épidémique de « peste ».
- source_word: וְלֹא יִטְמָא
  choice: afin que ... ne devienne impur
  rationale: La proposition indique le but préventif du vidage de la maison avant l’inspection.
- source_word: כָּל אֲשֶׁר בַּבָּיִת
  choice: rien de ce qui se trouve dans la maison
  rationale: Avec la négation, cette formulation française rend clairement que tous les objets ou biens présents sont concernés.
- source_word: וְאַחַר כֵּן
  choice: Après cela
  rationale: Cette expression marque explicitement l’étape suivante de la procédure.
- source_word: יָבֹא הַכֹּהֵן ... אֶת הַבָּיִת
  choice: le prêtre entrera pour examiner la maison
  rationale: Dans le contexte spatial de la maison, « entrera » explicite naturellement le mouvement de יָבֹא sans ajouter d’idée étrangère.
theological_decisions:
- issue: Terminologie de l’impureté rituelle
  choice: devenir impur
  alternative: être souillé
  rationale: טמא relève ici du statut rituel et non nécessairement d’une faute morale. « Devenir impur » conserve cette distinction et correspond au vocabulaire courant du Lévitique.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde le caractère normatif et séquentiel de la procédure sacerdotale; « zone atteinte » préserve l’indétermination du phénomène décrit.
