  text: וְ/כָל מִנְחַ֥ת כֹּהֵ֛ן כָּלִ֥יל תִּהְיֶ֖ה לֹ֥א תֵאָכֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/016.yaml
  text: And every grain offering of a priest shall be wholly burned[a]; it shall not be eaten.
translation:
  language: fr
  text: Toute offrande de céréales présentée par un prêtre sera entièrement consumée[a] ; elle ne sera pas mangée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sera entière ». Ici, le terme hébreu désigne une offrande livrée tout entière à l’autel : aucune part n’en est mangée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: Toute
  rationale: 'Le וְ relie cette prescription à ce qui précède, mais il n’est pas nécessaire de le rendre séparément en français. Avec le nom singulier, כָּל a une valeur distributive : « toute » au sens de « chaque ».'
- source_word: מִנְחַת
  choice: offrande de céréales
  rationale: Dans le Lévitique, מִנְחָה est le terme cultuel désignant l’offrande composée de produits céréaliers, et non une offrande générique.
- source_word: כֹּהֵן
  choice: présentée par un prêtre
  rationale: La chaîne construite signifie littéralement « offrande de céréales d’un prêtre ». « Présentée par » exprime naturellement en français qu’il s’agit de l’offrande apportée par le prêtre, sans suggérer simplement une possession.
- source_word: כָּלִיל תִּהְיֶה
  choice: sera entièrement consumée
  rationale: כָּלִיל qualifie ce qui est entier ou intégralement livré en sacrifice. Dans ce contexte, où la consommation est aussitôt interdite, l’expression indique que toute l’offrande est consumée sur l’autel. La note signale que le verbe « consumer » est implicite plutôt qu’exprimé dans l’hébreu.
- source_word: לֹא תֵאָכֵל
  choice: elle ne sera pas mangée
  rationale: Le nifal exprime le passif. Cette formulation reproduit directement et sobrement l’interdiction légale.
