revisions:
- from: Il prélèvera de l’offrande une pleine poignée de fleur de farine et de son huile[a], avec tout l’encens qui se trouve sur l’offrande. Il fera fumer sur l’autel cette part commémorative[b], comme un parfum agréable à Yahweh.
  to: Il prélèvera de l’offrande de céréales une poignée de farine fine et une partie de son huile[a], avec tout l’encens qui se trouve sur l’offrande. Il fera fumer sur l’autel sa part commémorative[b], comme un parfum agréable à Yahweh.
  rationale: La révision évite d’ajouter « pleine », clarifie que la poignée porte sur la farine et que l’huile est prise en partie, et rétablit l’appellation technique « offrande de céréales ». « Sa part commémorative » reflète le suffixe possessif de אַזכרתהּ et s’enchaîne naturellement avec l’offrande mentionnée.
