  text: וְ/הֵרִ֨ים מִמֶּ֜/נּוּ בְּ/קֻמְצ֗/וֹ מִ/סֹּ֤לֶת הַ/מִּנְחָה֙ וּ/מִ/שַּׁמְנָ֔/הּ וְ/אֵת֙ כָּל הַ/לְּבֹנָ֔ה אֲשֶׁ֖ר עַל הַ/מִּנְחָ֑ה וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֗חַ רֵ֧יחַ נִיחֹ֛חַ אַזְכָּרָתָ֖/הּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/008.yaml
  text: And he shall take up from it a handful of the fine flour of the grain offering and some of its oil[a], with all the frankincense that is on the grain offering[b], and he shall burn its memorial portion on the altar as a pleasing aroma to Yahweh.
translation:
  language: fr
  text: Il prélèvera de l’offrande de céréales une poignée de farine fine et une partie de son huile[a], avec tout l’encens qui se trouve sur l’offrande. Il fera fumer sur l’autel sa part commémorative[b], comme un parfum agréable à Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il prélèvera d’elle, avec sa poignée, de la farine fine de l’offrande et de son huile ». L’expression désigne la quantité de farine saisie dans la main ; l’huile est également prélevée en partie.'
    reason: lexical_alternative
  - marker: b
    text: La « part commémorative » est la portion représentative de l’offrande que l’on faisait fumer sur l’autel.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵרִים מִמֶּנּוּ בְּקֻמְצוֹ
  choice: Il prélèvera de l’offrande une pleine poignée
  rationale: Le hiphil de רום exprime ici le prélèvement de la portion prescrite, tandis que בְּקֻמְצוֹ désigne ce que la main peut saisir. « Une pleine poignée » rend naturellement la mesure sans réduire le geste à une simple poignée imprécise.
- source_word: מִסֹּלֶת
  choice: de fleur de farine
  rationale: סֹלֶת désigne une farine fine de qualité employée dans les offrandes. « Fleur de farine » est une expression française actuelle et cultuellement précise.
- source_word: הַמִּנְחָה
  choice: l’offrande
  rationale: Dans ce contexte immédiat, מִנְחָה désigne l’offrande végétale déjà identifiée. « L’offrande » évite la lourdeur tout en maintenant le référent.
- source_word: וּמִשַּׁמְנָהּ
  choice: et de son huile
  rationale: 'La répétition de מִן conserve une valeur partitive : une quantité d’huile est prélevée avec la farine, sans suggérer nécessairement toute l’huile.'
- source_word: וְאֵת כָּל הַלְּבֹנָה אֲשֶׁר עַל הַמִּנְחָה
  choice: avec tout l’encens qui se trouve sur l’offrande
  rationale: לְבֹנָה désigne spécifiquement l’oliban, couramment appelé « encens » en français. « Tout » marque le contraste avec la quantité seulement partielle de farine et d’huile.
- source_word: וְהִקְטִיר
  choice: Il fera fumer
  rationale: Dans le langage sacrificiel, le hiphil de קטר décrit l’action de faire partir en fumée sur l’autel. Cette formulation préserve mieux la nuance cultuelle que le simple verbe « brûler ».
- source_word: אַזְכָּרָתָהּ
  choice: cette part commémorative
  rationale: אַזְכָּרָה est un terme sacrificiel technique désignant la portion représentative consumée sur l’autel. « Part commémorative » conserve sa fonction technique sans en préciser abusivement l’objet théologique.
- source_word: רֵיחַ נִיחֹחַ
  choice: comme un parfum agréable
  rationale: Cette expression cultuelle indique que l’offrande est agréée. « Parfum agréable » est naturel, digne et ne transforme pas la formule en description grossière d’un plaisir olfactif.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition indique le destinataire de l’offrande, et le tétragramme est rendu par le nom propre « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu porte directement le tétragramme. « Yahweh » préserve sa fonction de nom propre et correspond à la convention fournie dans la couche de consultation.
- issue: Portée de רֵיחַ נִיחֹחַ
  choice: comme un parfum agréable
  alternative: en odeur apaisante
  rationale: La formulation retenue exprime l’agrément cultuel sans imposer l’idée que le sacrifice calmerait une colère divine, nuance que le syntagme ne formule pas explicitement.
- issue: Sens de אַזְכָּרָה
  choice: part commémorative
  alternative: part destinée à rappeler l’offrande
  rationale: Le terme technique est conservé sans résoudre la question de savoir qui ou quoi est censé se souvenir, ambiguïté que le texte hébreu laisse ouverte.
translation_notes:
  register: Français international moderne, clair et digne. Le futur simple maintient le style prescriptif du passage. Le vocabulaire sacrificiel reste précis sans archaïsmes inutiles.
