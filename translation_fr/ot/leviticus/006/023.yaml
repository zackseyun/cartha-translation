  terminology: « Sacrifice pour le péché » est un équivalent clair et recevable de חַטָּאת ; la note conserve à juste titre l’alternative savante « sacrifice de purification ». « Tente de la Rencontre » et « sanctuaire » maintiennent une terminologie cultuelle cohérente, sans imposer d’interprétation confessionnelle.
