  text: וְ/כָל חַטָּ֡את אֲשֶׁר֩ יוּבָ֨א מִ/דָּמָ֜/הּ אֶל אֹ֧הֶל מוֹעֵ֛ד לְ/כַפֵּ֥ר בַּ/קֹּ֖דֶשׁ לֹ֣א תֵאָכֵ֑ל בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/023.yaml
  text: But any sin offering from whose blood some is brought into the tent of meeting to make atonement in the holy place shall not be eaten[a]; it shall be burned with fire.
translation:
  language: fr
  text: Mais tout sacrifice pour le péché dont une partie du sang est apportée dans la tente de la Rencontre pour faire l’expiation dans le sanctuaire ne sera pas mangé[a] ; il sera brûlé au feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification » pour « sacrifice pour le péché » ; dans le Lévitique, le terme hébreu חַטָּאת peut désigner le sacrifice qui traite de l’impureté et du péché.
    reason: Alternative lexicale légitime qui préserve la double portée possible du terme cultuel hébreu.
lexical_decisions:
- source_word: וְכָל
  choice: Mais tout
  rationale: Dans ce contexte législatif, וְ introduit une restriction contrastant avec les sacrifices qui peuvent être mangés, tandis que כָל marque la totalité de la catégorie visée.
- source_word: חַטָּאת
  choice: sacrifice pour le péché
  rationale: Le terme désigne ici le sacrifice rituel et non le péché abstrait. Cette formulation est claire pour le lecteur moderne tout en conservant le lien lexical avec le péché.
- source_word: אֲשֶׁר יוּבָא מִדָּמָהּ
  choice: dont une partie du sang est apportée
  rationale: 'La préposition מִן a une valeur partitive : c’est une partie du sang du sacrifice, et non nécessairement tout son sang, qui est apportée.'
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: « Dans » exprime ici l’entrée du sang à l’intérieur de la structure sacrée ; « tente de la rencontre » rend naturellement l’appellation cultuelle hébraïque.
- source_word: לְכַפֵּר
  choice: afin de faire l’expiation
  rationale: La formulation conserve la portée rituelle et théologique de כפר sans imposer une théorie particulière de l’expiation.
- source_word: בַּקֹּדֶשׁ
  choice: dans le lieu saint
  rationale: L’expression désigne ici l’espace sacré concret où s’accomplit le rite, plutôt que la sainteté au sens abstrait.
- source_word: לֹא תֵאָכֵל
  choice: ne sera pas mangé
  rationale: Le passif hébreu et le registre prescriptif sont conservés dans une formulation française naturelle.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: il sera brûlé au feu
  rationale: Cette tournure garde l’insistance explicite de l’hébreu sur le feu, tout en restant idiomatique en français.
theological_decisions:
- issue: Sens de חַטָּאת dans la législation sacrificielle
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le contexte montre qu’il s’agit d’une offrande sacrificielle. « Sacrifice pour le péché » reste immédiatement intelligible et n’exclut pas sa fonction purificatrice, signalée en note.
- issue: Quantité de sang apportée dans le sanctuaire
  choice: dont une partie du sang est apportée
  alternative: dont le sang est apporté
  rationale: Le מִן préfixé à « son sang » suggère explicitement une relation partitive ; la traduction évite donc de laisser entendre que tout le sang est apporté.
translation_notes:
  register: Français international moderne, clair et digne, avec un registre juridique et cultuel mesuré. La syntaxe passive du texte source est maintenue sans lourdeur excessive.
