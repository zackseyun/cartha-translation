source:
  edition: WLC
  text: הַ/כֹּהֵ֛ן הַֽ/מְחַטֵּ֥א אֹתָ֖/הּ יֹאכֲלֶ֑/נָּה בְּ/מָק֤וֹם קָדֹשׁ֙ תֵּֽאָכֵ֔ל בַּ/חֲצַ֖ר אֹ֥הֶל מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/019.yaml
  text: The priest who makes atonement with it shall eat it. It shall be eaten in a holy place[a], in the court of the tent of meeting.
translation:
  language: fr
  text: Le prêtre qui l’offre en sacrifice pour le péché[a] la mangera. Elle sera mangée dans un lieu saint, dans la cour de la tente de la rencontre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui accomplit avec elle le rite de purification » ou « qui fait l’expiation avec elle ». Le participe hébreu peut désigner plus précisément l’accomplissement du rite de l’offrande pour le péché.
    reason: 'Alternative lexicale : le verbe חטא au piel possède ici un sens cultuel spécialisé qui ne se laisse pas réduire avec certitude à une seule formulation française.'
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: Le prêtre
  rationale: Rend directement le nom défini כֹּהֵן dans un français courant et conforme au vocabulaire cultuel.
- source_word: הַמְחַטֵּא אֹתָהּ
  choice: qui l’offre en sacrifice pour le péché
  rationale: Dans ce contexte sacrificiel, le participe piel de חטא désigne le prêtre qui accomplit le rite de l’offrande pour le péché. Cette formulation française est claire tout en évitant de réduire le verbe à une seule nuance possible.
- source_word: יֹאכֲלֶנָּה
  choice: la mangera
  rationale: L’imparfait hébreu exprime ici une prescription cultuelle. Le futur français convient au style juridique et le pronom féminin reprend naturellement l’offrande ou la victime sacrificielle.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: dans un lieu saint
  rationale: L’absence d’article devant מָקוֹם favorise « un lieu saint », formulation à la fois précise et naturelle.
- source_word: תֵּאָכֵל
  choice: Elle sera mangée
  rationale: Le passif préserve la focalisation hébraïque sur l’offrande et maintient la valeur prescriptive.
- source_word: בַּחֲצַר אֹהֶל מוֹעֵד
  choice: dans la cour de la tente de la rencontre
  rationale: « Cour » désigne l’enceinte du sanctuaire, et « tente de la rencontre » rend אֹהֶל מוֹעֵד de manière transparente et digne.
theological_decisions:
- issue: Sens cultuel du participe הַמְחַטֵּא
  choice: qui l’offre en sacrifice pour le péché
  alternative: qui accomplit avec elle le rite de purification ; qui fait l’expiation avec elle
  rationale: Le verbe peut évoquer la purification, l’expiation ou, plus largement, l’accomplissement du rite de l’offrande pour le péché. Le texte principal privilégie une formulation fonctionnelle sans imposer une définition doctrinale étroite; la note conserve l’ambiguïté lexicale.
- issue: Référence des pronoms féminins
  choice: la / Elle
  alternative: le / Il
  rationale: Le féminin hébreu renvoie à l’offrande ou à la victime du sacrifice pour le péché. En français, le féminin demeure naturel si l’on comprend « offrande » ou « victime », et il assure la cohésion des deux propositions.
translation_notes:
  register: Français international moderne, clair et digne. Le futur conserve la tonalité prescriptive de la législation cultuelle; le vocabulaire reste accessible sans effacer la terminologie sacrificielle.
