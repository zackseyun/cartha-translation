source:
  edition: WLC
  text: וְ/הָ/אֵ֨שׁ עַל הַ/מִּזְבֵּ֤חַ תּֽוּקַד בּ/וֹ֙ לֹ֣א תִכְבֶּ֔ה וּ/בִעֵ֨ר עָלֶ֧י/הָ הַ/כֹּהֵ֛ן עֵצִ֖ים בַּ/בֹּ֣קֶר בַּ/בֹּ֑קֶר וְ/עָרַ֤ךְ עָלֶ֨י/הָ֙ הָֽ/עֹלָ֔ה וְ/הִקְטִ֥יר עָלֶ֖י/הָ חֶלְבֵ֥י הַ/שְּׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/005.yaml
  text: And the fire on the altar shall be kept burning on it[a]; it shall not go out. The priest shall burn wood on it every morning[b], and he shall arrange the burnt offering on it and burn up on it the fat portions of the peace offerings.
translation:
  language: fr
  text: Sur l’autel, le feu sera maintenu allumé ; il ne s’éteindra pas. Chaque matin[a], le prêtre y fera brûler du bois, y disposera l’holocauste et y fera monter en fumée les graisses des sacrifices de paix[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « matin après matin ». La répétition en hébreu exprime ici la régularité.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sacrifices de communion » ou « sacrifices de bien-être ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוּקַד
  choice: sera maintenu allumé
  rationale: Le hophal exprime ici le maintien du feu dans un état de combustion, plutôt qu’un simple constat selon lequel il brûle.
- source_word: בּוֹ
  choice: y
  rationale: Le pronom adverbial français renvoie naturellement à l’autel et évite la lourdeur de « sur lui ».
- source_word: לֹא תִכְבֶּה
  choice: il ne s’éteindra pas
  rationale: Cette formulation naturelle conserve l’exigence de continuité du feu sans préciser artificiellement s’il s’éteindrait de lui-même ou serait éteint.
- source_word: וּבִעֵר
  choice: fera brûler du bois
  rationale: Dans ce contexte, le prêtre alimente et entretient le feu avec du bois ; « allumera » suggérerait à tort qu’il recommence le feu.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: chaque matin
  rationale: La répétition hébraïque a une valeur distributive et indique une action quotidienne.
- source_word: וְעָרַךְ
  choice: disposera
  rationale: Le verbe désigne la mise en ordre rituelle de l’offrande sur l’autel.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: « Holocauste » est le terme cultuel français établi pour l’offrande entièrement consumée, tout en évitant une paraphrase explicative dans le corps du texte.
- source_word: וְהִקְטִיר
  choice: fera fumer
  rationale: Le hiphil de קטר désigne, dans le culte sacrificiel, l’action de faire monter l’offrande en fumée ; cette traduction conserve cette nuance mieux que le simple « brûlera ».
- source_word: חֶלְבֵי
  choice: les graisses
  rationale: Le terme vise les parties grasses précisément réservées à la combustion sacrificielle.
- source_word: הַשְּׁלָמִים
  choice: les sacrifices de paix
  rationale: Cette désignation cultuelle reconnaissable conserve le lien lexical avec la paix et l’intégrité, sans réduire le terme à une seule interprétation.
theological_decisions:
- issue: Terminologie sacrificielle
  choice: Employer « holocauste » et « sacrifices de paix » dans le texte, avec une note signalant les autres rendus possibles de שְׁלָמִים.
  alternative: « offrande entièrement brûlée » et « sacrifices de communion » ou « sacrifices de bien-être »
  rationale: Les termes retenus assurent la continuité des catégories cultuelles en français, tandis que la note préserve l’étendue sémantique incertaine de שְׁלָמִים sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la répétition de « y » afin de rendre explicite que toutes les actions ont lieu sur l’autel. Les termes cultuels établis sont conservés, avec des variantes en notes lorsque l’hébreu permet plusieurs nuances.
