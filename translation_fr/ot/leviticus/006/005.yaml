revisions:
- from: Le feu sur l’autel y sera maintenu allumé ; il ne s’éteindra pas. Chaque matin[a], le prêtre y fera brûler du bois, y disposera l’holocauste et y fera fumer les graisses des sacrifices de paix[b].
  to: Sur l’autel, le feu sera maintenu allumé ; il ne s’éteindra pas. Chaque matin[a], le prêtre y fera brûler du bois, y disposera l’holocauste et y fera monter en fumée les graisses des sacrifices de paix[b].
  rationale: Révision limitée à la suppression d’une redondance locative et à un rendu plus exact de l’action rituelle consistant à faire monter les graisses en fumée. Les ancres de notes restent correctement associées, respectivement, à la répétition distributive de « matin » et au terme « sacrifices de paix ».
