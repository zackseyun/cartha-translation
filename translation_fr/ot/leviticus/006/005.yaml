  terminology: « Holocauste » et « sacrifices de paix » sont des termes cultuels français établis. « Faire monter en fumée » est plus précis et plus idiomatique dans ce contexte que « faire fumer », qui peut évoquer seulement l’émission de fumée plutôt que l’acte sacrificiel.
