  source_fidelity: Le projet rend fidèlement l’injonction de maintenir le feu, l’action quotidienne du prêtre, la disposition de l’holocauste et la combustion des graisses des sacrifices de paix. La révision conserve ces éléments et rend plus explicitement la nuance cultuelle de וְהִקְטִיר (« faire monter en fumée »).
