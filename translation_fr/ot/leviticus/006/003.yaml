base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/003.yaml
  text: And the priest shall put on his linen garment, and he shall put linen undergarments on his body, and he shall remove the ashes to which the fire has reduced the burnt offering on the altar, and he shall place them beside the altar.
translation:
  language: fr
  text: Le prêtre revêtira sa tunique de lin et mettra sur son corps[a] des sous-vêtements de lin. Il retirera les cendres de l’holocauste que le feu aura consumé sur l’autel[b] et les déposera à côté de l’autel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Sur son corps » signifie littéralement « sur sa chair ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou, plus littéralement : « les cendres que le feu consumera de l’holocauste ». L’expression hébraïque est concise et peut être rendue de plusieurs manières proches.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדּוֹ בַד
  choice: sa tunique de lin
  rationale: Dans ce contexte sacerdotal, מִדּוֹ désigne le vêtement officiel du prêtre, et בַד en précise la matière. « Tunique de lin » est naturel en français et suffisamment précis sans définir davantage sa coupe.
- source_word: מִכְנְסֵי בַד
  choice: un sous-vêtement de lin
  rationale: Le terme désigne le vêtement sacerdotal couvrant le bas du corps et porté directement sur la peau. « Sous-vêtement » exprime clairement sa fonction en français moderne.
- source_word: עַל בְּשָׂרוֹ
  choice: sur son corps
  rationale: Littéralement « sur sa chair ». « Sur son corps » conserve l’idée du contact direct tout en restant naturel.
- source_word: וְהֵרִים
  choice: il retirera
  rationale: Le verbe signifie littéralement « soulever », mais décrit ici l’enlèvement des cendres de l’autel.
- source_word: הַדֶּשֶׁן
  choice: les cendres
  rationale: Dans le contexte sacrificiel, le mot désigne les résidus laissés par la combustion sur l’autel.
- source_word: אֲשֶׁר תֹּאכַל הָאֵשׁ אֶת הָעֹלָה
  choice: auxquelles le feu aura réduit l’holocauste
  rationale: La formulation française explicite le rapport entre les cendres et la combustion de l’holocauste, tout en signalant en note la construction hébraïque compacte.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: « Holocauste » est le terme cultuel français établi pour l’offrande entièrement consumée, sans imposer le calque étymologique « offrande d’élévation ».
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: à côté de l’autel
  rationale: Cette expression rend simplement et précisément la proximité latérale indiquée par אֵצֶל.
