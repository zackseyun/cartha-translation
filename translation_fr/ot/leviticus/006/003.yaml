revisions:
- from: Le prêtre revêtira sa tunique de lin et mettra sur son corps[a] un sous-vêtement de lin. Il retirera les cendres auxquelles le feu aura réduit l’holocauste sur l’autel[b] et les déposera à côté de l’autel.
  to: Le prêtre revêtira sa tunique de lin et mettra sur son corps[a] des sous-vêtements de lin. Il retirera les cendres de l’holocauste que le feu aura consumé sur l’autel[b] et les déposera à côté de l’autel.
  rationale: Révision limitée de la clause relative concernant les cendres afin de produire une formulation française claire et fidèle au rapport entre les cendres, l’holocauste et le feu. Le pluriel pour les sous-vêtements améliore également l’usage français sans modifier le sens.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:23:04Z'
review_pass:
  verdict: revise
  source_fidelity: La première partie rend fidèlement les vêtements sacerdotaux et l’enlèvement des cendres. En revanche, « les cendres auxquelles le feu aura réduit l’holocauste » est une reformulation possible mais syntaxiquement lourde en français et interprète la relation compacte de l’hébreu de façon moins directe. « Les cendres de l’holocauste que le feu aura consumé sur l’autel » rend clairement le résidu et l’action du feu, tout en restant proche du texte source.
  naturalness: Le registre est moderne, digne et approprié. Le pluriel « des sous-vêtements de lin » est plus idiomatique et reflète mieux le terme hébreu pour le vêtement couvrant le bas du corps. La révision de la proposition relative améliore sensiblement la lisibilité.
  terminology: « Tunique de lin », « sous-vêtements de lin », « cendres », « holocauste » et « autel » conviennent au contexte cultuel et au français international. « Holocauste » est maintenu comme terme traditionnel pour עֹלָה, sans ajouter d’interprétation doctrinale.
  issues:
  - severity: medium
    issue: La relative « les cendres auxquelles le feu aura réduit l’holocauste » est maladroite et éloigne légèrement la relation exprimée par l’hébreu.
    rationale: L’hébreu identifie les cendres par rapport à l’holocauste consumé par le feu sur l’autel. En français, la tournure avec « auxquelles » est grammaticalement possible, mais peu naturelle et moins transparente; elle risque aussi de suggérer une formulation explicative plus forte que le texte compact.
  - severity: low
    issue: « un sous-vêtement de lin » est au singulier.
    rationale: Le terme hébreu désigne le vêtement inférieur sacerdotal; le pluriel français « des sous-vêtements » est plus naturel et correspond mieux à la désignation habituelle de cette pièce.
  revised_text: Le prêtre revêtira sa tunique de lin et mettra sur son corps[a] des sous-vêtements de lin. Il retirera les cendres de l’holocauste que le feu aura consumé sur l’autel[b] et les déposera à côté de l’autel.
  revised_footnotes:
