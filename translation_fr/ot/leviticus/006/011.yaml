  verdict: revise
  source_fidelity: 'La structure et le sens juridique sont globalement fidèles : l’accès est réservé aux mâles parmi les fils d’Aaron, la règle est durable, et le dernier membre conserve l’indétermination de « tout ce qui » ainsi que le résultat de sainteté. Toutefois, « offrandes consumées » présente les אִשֵּׁי comme des offrandes entièrement brûlées, alors que le terme désigne la catégorie des offrandes présentées par le feu et peut comporter des portions non consumées.'
  naturalness: Le français est clair et d’un registre approprié. « Offrandes offertes par le feu à Yahweh » est plus exact et naturel ici que « offrandes consumées pour Yahweh ».
  terminology: « Fils d’Aaron », « Yahweh » et « deviendra saint » conviennent. La note conserve correctement l’ambiguïté interprétative du dernier membre sans en imposer une résolution doctrinale.
