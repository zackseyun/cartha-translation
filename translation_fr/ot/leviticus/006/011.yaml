source:
  edition: WLC
  text: כָּל זָכָ֞ר בִּ/בְנֵ֤י אַהֲרֹן֙ יֹֽאכֲלֶ֔/נָּה חָק עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם מֵ/אִשֵּׁ֖י יְהוָ֑ה כֹּ֛ל אֲשֶׁר יִגַּ֥ע בָּ/הֶ֖ם יִקְדָּֽשׁ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/011.yaml
  text: Every male among the sons of Aaron may eat of it[a]. It is a permanent statute throughout your generations from the food offerings of Yahweh. Whatever touches them shall become holy.
translation:
  language: fr
  text: Tout homme parmi les fils d’Aaron pourra en manger. C’est, de génération en génération, une prescription permanente relative aux offrandes offertes par le feu à Yahweh. Tout ce qui les touchera deviendra saint.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sera consacré ». L’hébreu peut indiquer que le contact communique un statut de sainteté ; certains comprennent plus restrictivement que seul ce qui est saint peut toucher ces offrandes.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל זָכָר
  choice: Tout homme
  rationale: Dans ce contexte de droit sacerdotal, l’expression désigne chaque personne de sexe masculin. « Tout homme » est naturel en français tout en conservant la restriction explicite du texte.
- source_word: בִּבְנֵי אַהֲרֹן
  choice: parmi les fils d’Aaron
  rationale: Conserve la désignation familiale et sacerdotale littérale sans l’élargir explicitement à tous les descendants.
- source_word: יֹאכֲלֶנָּה
  choice: pourra en manger
  rationale: Le verbe exprime ici l’autorisation accordée aux prêtres de prendre part à l’offrande évoquée dans le contexte précédent.
- source_word: חָק עוֹלָם
  choice: une prescription permanente
  rationale: Rend clairement la force juridique durable de la formule hébraïque dans un français moderne.
- source_word: לְדֹרֹתֵיכֶם
  choice: de génération en génération
  rationale: Formulation française idiomatique indiquant la continuité de la prescription au fil des générations.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: concernant les offrandes consumées pour Yahweh
  rationale: אִשִּׁים désigne les offrandes présentées sur l’autel, typiquement par le feu. « Consumées » garde ce lien concret sans suggérer que la totalité de chaque offrande était nécessairement brûlée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de le remplacer par un titre.
- source_word: כֹּל אֲשֶׁר יִגַּע בָּהֶם
  choice: Tout ce qui les touchera
  rationale: Préserve l’indétermination de l’hébreu, qui ne précise pas s’il s’agit d’une personne ou d’un objet.
- source_word: יִקְדָּשׁ
  choice: deviendra saint
  rationale: Exprime naturellement le changement d’état résultant du contact, sens le plus direct du verbe dans cette construction.
theological_decisions:
- issue: Sens du transfert de sainteté dans la dernière proposition
  choice: Le contact avec les offrandes saintes fait entrer ce qui les touche dans un état de sainteté.
  alternative: Seul ce qui est déjà saint peut les toucher ; ou bien le contact entraîne des obligations de consécration sans décrire un simple transfert de qualité.
  rationale: 'La construction hébraïque exprime le plus naturellement un résultat : « deviendra saint ». La note conserve toutefois les autres compréhensions possibles sans résoudre artificiellement la tension rituelle.'
translation_notes:
  register: Français international moderne, digne et accessible. Le style juridique sacerdotal est conservé sans archaïsmes inutiles ; le nom divin est rendu par « Yahweh ».
