revisions:
- from: 'Parle à Aaron et à ses fils en ces termes : « Voici la loi concernant le sacrifice pour le péché[a] : le sacrifice pour le péché sera égorgé devant Yahweh, à l’endroit où l’on égorge l’holocauste. Il est très saint. »'
  to: 'Parle à Aaron et à ses fils en ces termes : « Voici la loi concernant le sacrifice pour le péché[a] : dans le lieu où l’on égorge l’holocauste, le sacrifice pour le péché sera égorgé devant Yahweh. C’est une chose très sainte. »'
  rationale: La révision conserve les choix terminologiques solides du projet, rétablit plus directement l’ordre de la phrase hébraïque et rend la désignation cultuelle superlative par une expression française précise. La note est rendue plus neutre afin de préserver la latitude sémantique de חַטָּאת.
