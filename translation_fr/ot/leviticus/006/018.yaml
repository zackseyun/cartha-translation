  text: דַּבֵּ֤ר אֶֽל אַהֲרֹן֙ וְ/אֶל בָּנָ֣י/ו לֵ/אמֹ֔ר זֹ֥את תּוֹרַ֖ת הַֽ/חַטָּ֑את בִּ/מְק֡וֹם אֲשֶׁר֩ תִּשָּׁחֵ֨ט הָ/עֹלָ֜ה תִּשָּׁחֵ֤ט הַֽ/חַטָּאת֙ לִ/פְנֵ֣י יְהוָ֔ה קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִֽוא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/018.yaml
  text: 'Speak to Aaron and to his sons[a], saying, ‘This is the law of the sin offering: in the place where the burnt offering is slaughtered, the sin offering shall be slaughtered before Yahweh. It is most holy.’'
translation:
  language: fr
  text: 'Parle à Aaron et à ses fils en ces termes : « Voici la loi concernant le sacrifice pour le péché[a] : dans le lieu où l’on égorge l’holocauste, le sacrifice pour le péché sera égorgé devant Yahweh. C’est une chose très sainte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification » ; le terme hébreu חַטָּאת peut désigner à la fois le péché et le sacrifice associé à la purification.
    reason: Alternative lexicale reflétant la double portée du terme hébreu.
lexical_decisions:
- source_word: דַּבֵּר אֶל־אַהֲרֹן וְאֶל־בָּנָיו לֵאמֹר
  choice: Parle à Aaron et à ses fils en ces termes
  rationale: Rend la formule d’introduction législative avec un impératif direct et une tournure française naturelle et digne.
- source_word: זֹאת תּוֹרַת
  choice: Voici la loi concernant
  rationale: Dans ce contexte cultuel, תּוֹרָה désigne la prescription qui régit le sacrifice. « Loi concernant » conserve le poids normatif tout en étant idiomatique en français.
- source_word: הַחַטָּאת
  choice: le sacrifice pour le péché
  rationale: Le terme désigne ici l’offrande sacrificielle, non le péché abstrait. Cette traduction est claire et traditionnelle, tandis que l’autre valeur possible, liée à la purification, est signalée en note.
- source_word: בִּמְקוֹם אֲשֶׁר תִּשָּׁחֵט הָעֹלָה
  choice: à l’endroit où l’on égorge l’holocauste
  rationale: « Égorge » exprime précisément l’acte sacrificiel de שׁחט, et « holocauste » est le terme français courant pour עֹלָה.
- source_word: תִּשָּׁחֵט הַחַטָּאת
  choice: le sacrifice pour le péché sera égorgé
  rationale: Le futur passif rend la valeur prescriptive de l’imparfait hébreu et maintient le parallèle avec l’holocauste.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » conserve l’idiome cultuel hébreu, et le nom divin est rendu explicitement par « Yahweh ».
- source_word: קֹדֶשׁ קָדָשִׁים הִוא
  choice: Il est très saint
  rationale: La construction superlative hébraïque indique le degré suprême de sainteté. Le pronom français renvoie naturellement au sacrifice.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le représente directement plutôt que de le remplacer par un titre.
- issue: Portée de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: La traduction principale conserve le lien lexical explicite avec le péché, sans nier la fonction rituelle de purification, préservée dans la note.
translation_notes:
  register: Français international moderne, clair et solennel. Le vocabulaire sacrificiel précis (« égorger », « holocauste ») est maintenu sans alourdir la syntaxe.
