lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר dans cette formule introduit une nouvelle parole divine. Le passé simple convient au registre narratif biblique français, tandis que l’enchaînement hébreu par waw n’exige pas ici un « puis » explicite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme conserve le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: אֶל מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל indique le destinataire de la parole; « à Moïse » est l’équivalent français naturel.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: Dans une formule introduisant un discours direct, « en ces termes » exprime naturellement la fonction de לֵאמֹר et appelle les paroles qui suivent.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » en conserve la valeur de nom propre sans le remplacer par le titre traditionnel « le SEIGNEUR ».
translation_notes:
  register: 'Français international moderne et digne. Le passé simple maintient le registre narratif; « en ces termes : » introduit naturellement le discours direct qui commence au verset suivant.'
