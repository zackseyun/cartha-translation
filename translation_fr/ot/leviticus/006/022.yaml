  text: כָּל זָכָ֥ר בַּ/כֹּהֲנִ֖ים יֹאכַ֣ל אֹתָ֑/הּ קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/022.yaml
  text: Every male among the priests may eat it[a]; it is most holy.
translation:
  language: fr
  text: Tout mâle parmi les prêtres peut en manger. C’est une chose très sainte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une sainteté de saintetés », tournure hébraïque signifiant « une chose très sainte ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זָכָר
  choice: Tout mâle
  rationale: Le singulier distributif כָּל et le nom זָכָר désignent chaque personne de sexe masculin ; « tout mâle » conserve cette précision dans ce contexte cultuel.
- source_word: בַּכֹּהֲנִים
  choice: parmi les prêtres
  rationale: La préposition בְּ marque ici l’appartenance au groupe sacerdotal ; « parmi les prêtres » est naturel et précis.
- source_word: יֹאכַל
  choice: peut en manger
  rationale: Dans cette prescription cultuelle, l’imparfait exprime l’autorisation ou le droit de manger, plutôt qu’un ordre imposé à chaque prêtre.
- source_word: אֹתָהּ
  choice: en
  rationale: Le pronom féminin renvoie à l’offrande évoquée dans le contexte. En français, « en manger » reprend naturellement cette réalité sans ajout explicatif.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: une chose très sainte
  rationale: La construction « sainteté des saintetés » est un superlatif hébraïque. « Une chose très sainte » exprime le degré suprême de consécration tout en évitant une lecture spatiale.
- source_word: הִוא
  choice: C’est
  rationale: Le pronom féminin reprend l’offrande ; la tournure présentative « c’est » rend naturellement la proposition nominale en français.
theological_decisions: []
