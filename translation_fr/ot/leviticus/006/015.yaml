source:
  edition: WLC
  text: וְ/הַ/כֹּהֵ֨ן הַ/מָּשִׁ֧יחַ תַּחְתָּ֛י/ו מִ/בָּנָ֖י/ו יַעֲשֶׂ֣ה אֹתָ֑/הּ חָק עוֹלָ֕ם לַ/יהוָ֖ה כָּלִ֥יל תָּקְטָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/015.yaml
  text: 'And the anointed priest from among his sons[a], who succeeds him, shall prepare it[c][b]. It is a permanent statute for Yahweh: it shall be completely turned into smoke.'
translation:
  language: fr
  text: 'Le prêtre oint qui lui succédera, l’un de ses fils, la préparera[a]. C’est une prescription permanente[b] pour le SEIGNEUR : elle sera tout entière offerte en fumée[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à sa place » ; littéralement « sous lui ».
    reason: lexical_alternative
  - marker: b
    text: Ou « une prescription perpétuelle » ou « une ordonnance durable ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement « elle sera entièrement transformée en fumée » : l’offrande est consumée tout entière sur l’autel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: le prêtre […] aura reçu l’onction
  rationale: Dans ce contexte cultuel, l’expression désigne le prêtre consacré par l’onction pour exercer la charge, et non un titre messianique. La formulation française s’intègre naturellement à la proposition relative de succession.
- source_word: תַּחְתָּיו מִבָּנָיו
  choice: qui, parmi ses fils, […] pour lui succéder
  rationale: La formulation exprime la succession à la charge tout en conservant explicitement la sélection parmi ses fils. Une note préserve le sens plus littéral « à sa place ».
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: la préparera
  rationale: Le verbe עשה est général (« faire »), mais, dans cette procédure sacrificielle, « préparer » fournit un français naturel sans préciser indûment un acte rituel absent de l’hébreu.
- source_word: חָק עוֹלָם
  choice: une prescription permanente
  rationale: « Prescription » convient au contexte légal et cultuel, tandis que « permanente » exprime la durée de validité sans archaïsme ni surdétermination métaphysique.
- source_word: לַיהוָה
  choice: pour le SEIGNEUR
  rationale: « le SEIGNEUR » représente conventionnellement le tétragramme en français, et « pour » marque ici la destination cultuelle.
- source_word: כָּלִיל תָּקְטָר
  choice: elle sera tout entière offerte en fumée
  rationale: Cette formulation conserve à la fois la totalité de la combustion et la nuance sacrificielle de קטר, qui évoque l’offrande dont la fumée monte, plutôt qu’une simple destruction par le feu.
theological_decisions:
- issue: Identité du « prêtre oint »
  choice: le prêtre choisi parmi les fils du titulaire et oint pour lui succéder
  alternative: n’importe quel prêtre ayant reçu une onction, ou une figure messianique
  rationale: La mention explicite de la succession parmi les fils situe l’expression dans la transmission de la charge sacerdotale; le texte ne présente pas ici un titre messianique.
- issue: Représentation du nom divin יהוה
  choice: le SEIGNEUR
  alternative: YHWH, Yahvé ou l’Éternel
  rationale: La petite capitale distingue le nom divin du titre ordinaire « Seigneur » tout en suivant l’usage français respectueux et largement intelligible.
- issue: Portée temporelle de חָק עוֹלָם
  choice: prescription permanente
  alternative: prescription perpétuelle ou ordonnance éternelle
  rationale: Le choix maintient l’idée d’une règle durable sans trancher au-delà du texte les débats sur sa portée dans les différentes économies théologiques.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe rend clairement la succession sacerdotale sans effacer l’expression hébraïque, conservée en note. Le vocabulaire cultuel reste précis sans recourir à des tournures archaïques.
