id: LEV.6.4
reference: Leviticus 6:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/פָשַׁט֙ אֶת בְּגָדָ֔י/ו וְ/לָבַ֖שׁ בְּגָדִ֣ים אֲחֵרִ֑ים וְ/הוֹצִ֤יא אֶת הַ/דֶּ֨שֶׁן֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה אֶל מָק֖וֹם טָהֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/004.yaml
  text: Then he shall take off his garments and put on other garments[b][a], and carry the ashes outside the camp to a clean place.
translation:
  language: fr
  text: Puis il retirera ses vêtements et en mettra d’autres, et il emportera les cendres[a] hors du camp, dans un endroit pur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fera sortir les cendres » ou « sortira les cendres ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « pur » désigne la pureté rituelle au sens lévitique.
    reason: cultural_note
lexical_decisions:
- source_word: וּפָשַׁט
  choice: Puis il retirera
  rationale: Dans le contexte des vêtements, פשט signifie les enlever. « Retirera » est naturel, digne et rend la succession procédurale marquée par le waw.
- source_word: בְּגָדָיו
  choice: ses vêtements
  rationale: בגד désigne couramment les vêtements; ce terme français convient au registre rituel sans être archaïque.
- source_word: וְלָבַשׁ בְּגָדִים אֲחֵרִים
  choice: et en mettra d’autres
  rationale: לבש exprime l’action de mettre des vêtements, et אחרים indique qu’il s’agit de vêtements différents des premiers. Le pronom « en » évite une répétition lourde.
- source_word: וְהוֹצִיא
  choice: et il emportera
  rationale: Le hiphil de יצא signifie faire sortir ou porter dehors. « Emportera » exprime ici concrètement le déplacement des cendres vers un autre lieu.
- source_word: הַדֶּשֶׁן
  choice: les cendres
  rationale: Dans ce contexte, דשן désigne les résidus de l’offrande consumée sur l’autel; le pluriel « cendres » est idiomatique en français.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: hors du camp
  rationale: La locution indique un mouvement au-delà des limites du camp. « Hors du camp » est concise et naturelle.
- source_word: אֶל מָקוֹם טָהוֹר
  choice: dans un endroit pur
  rationale: טָהוֹר appartient ici au vocabulaire lévitique de la pureté rituelle. « Pur » conserve cette catégorie mieux que le sens seulement matériel de « propre ».
theological_decisions:
- issue: Nuance rituelle de טָהוֹר
  choice: un endroit pur
  alternative: un endroit rituellement pur; un endroit propre
  rationale: « Pur » préserve la portée cultuelle du terme sans intégrer une explication interprétative dans le corps du verset. Une note précise que la pureté est rituelle.
translation_notes:
  register: Français international moderne, clair et digne. La construction procédurale au futur maintient le ton prescriptif du passage. Les marqueurs [a] et [b] sont placés immédiatement après les expressions qu’ils éclairent.
