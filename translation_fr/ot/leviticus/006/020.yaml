source:
  edition: WLC
  text: כֹּ֛ל אֲשֶׁר יִגַּ֥ע בִּ/בְשָׂרָ֖/הּ יִקְדָּ֑שׁ וַ/אֲשֶׁ֨ר יִזֶּ֤ה מִ/דָּמָ/הּ֙ עַל הַ/בֶּ֔גֶד אֲשֶׁר֙ יִזֶּ֣ה עָלֶ֔י/הָ תְּכַבֵּ֖ס בְּ/מָק֥וֹם קָדֹֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/020.yaml
  text: Anything that touches its flesh shall become holy[a], and if any of its blood is spattered on a garment, you shall wash that on which it was spattered in a holy place.
translation:
  language: fr
  text: Tout ce qui touchera sa chair deviendra saint. Si de son sang gicle[a] sur un vêtement, tu laveras dans un lieu saint le vêtement sur lequel il aura giclé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « est aspergé ». Le verbe hébreu peut désigner une aspersion rituelle; ici, « gicle » convient au sang qui atteint un vêtement et doit ensuite être lavé.'
    reason: Alternative lexicale liée à l’ambiguïté du verbe hébreu נזה.
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Tout ce qui
  rationale: Cette expression indéfinie et globale convient aux êtres ou aux objets qui entrent en contact avec la chair de l’offrande.
- source_word: יִגַּע בִּבְשָׂרָהּ
  choice: touchera sa chair
  rationale: « Chair » conserve le terme concret du langage sacrificiel, et le possessif féminin renvoie à l’offrande pour le péché mentionnée dans le contexte.
- source_word: יִקְדָּשׁ
  choice: deviendra saint
  rationale: La forme verbale exprime ici l’entrée dans un statut de sainteté par contact, plutôt qu’un simple état déjà acquis ou une cérémonie explicite de consécration.
- source_word: וַאֲשֶׁר יִזֶּה מִדָּמָהּ
  choice: Si de son sang gicle
  rationale: Le verbe décrit du sang projeté sur un vêtement. « Gicler » est naturel en français et n’impose pas l’idée d’une aspersion rituelle intentionnelle, tout en laissant cette possibilité en note.
- source_word: עַל הַבֶּגֶד
  choice: sur un vêtement
  rationale: L’indéfini convient au style général d’une prescription juridique; « vêtement » reste plus précis que « habits ».
- source_word: אֲשֶׁר יִזֶּה עָלֶיהָ
  choice: le vêtement sur lequel il aura giclé
  rationale: Cette formulation reprend clairement le vêtement comme antécédent et restitue directement la proposition relative hébraïque.
- source_word: תְּכַבֵּס
  choice: tu laveras
  rationale: Le piel de כבס désigne le lavage d’un vêtement; la deuxième personne du singulier conserve la forme directe de l’instruction.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: dans un lieu saint
  rationale: L’expression ne porte pas l’article et désigne un espace consacré sans l’identifier nécessairement au sanctuaire intérieur.
theological_decisions:
- issue: Nature de la sainteté transmise par contact avec la chair de l’offrande
  choice: Le contact fait entrer la personne ou l’objet dans un statut de sainteté cultuelle.
  alternative: Le contact réserve seulement l’objet à un usage sacré, sans aucune idée de sainteté morale.
  rationale: Le contexte porte sur la sainteté rituelle et non sur une transformation morale intérieure. « Deviendra saint » conserve néanmoins la formulation et la tension du texte sans préciser davantage ses conséquences.
translation_notes:
  register: Français international actuel, clair et digne. Le futur prescriptif (« touchera », « deviendra », « tu laveras ») maintient le ton juridique du passage. Le pronom « il » dans la dernière proposition renvoie explicitement au sang.
