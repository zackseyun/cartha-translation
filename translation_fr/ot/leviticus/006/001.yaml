  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Yahweh[a] parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque du nom divin et son rendu traditionnel.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר désigne ici l’acte de parler et introduit une nouvelle parole divine. Le passé simple convient au registre narratif biblique en français sans alourdir la phrase d’un « et » peu naturel dans ce contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre, conformément à sa fonction dans le texte hébreu, plutôt que remplacé silencieusement par un titre.
- source_word: אֶל־מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל marque le destinataire de la parole ; « à Moïse » est l’équivalent français naturel.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Dans cette formule d’introduction au discours direct, l’infinitif de אמר annonce les paroles qui suivent. « En ces termes » est naturel, digne et évite le calque pesant « en disant ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu porte explicitement le nom divin. Le conserver sous la forme « Yahweh » distingue le nom propre du titre אֲדֹנָי, tout en signalant en note la tradition française qui le remplace par « le SEIGNEUR ».
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le registre narratif écrit ; « en ces termes » introduit naturellement le discours qui commence au verset suivant.
