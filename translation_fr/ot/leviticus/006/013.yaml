source:
  edition: WLC
  text: זֶ֡ה קָרְבַּן֩ אַהֲרֹ֨ן וּ/בָנָ֜י/ו אֲשֶׁר יַקְרִ֣יבוּ לַֽ/יהוָ֗ה בְּ/יוֹם֙ הִמָּשַׁ֣ח אֹת֔/וֹ עֲשִׂירִ֨ת הָ/אֵפָ֥ה סֹ֛לֶת מִנְחָ֖ה תָּמִ֑יד מַחֲצִיתָ֣/הּ בַּ/בֹּ֔קֶר וּ/מַחֲצִיתָ֖/הּ בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/013.yaml
  text: 'This is the offering of Aaron and his sons[a], which they shall present to Yahweh on the day he is anointed: a tenth of an ephah of fine flour as a regular grain offering, half of it in the morning and half of it in the evening.'
translation:
  language: fr
  text: '« Voici l’offrande d’Aaron et de ses fils[a], qu’ils présenteront à Yahweh le jour où il sera oint : un dixième d’épha de fleur de farine, comme offrande de céréales régulière, la moitié le matin et l’autre moitié le soir. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ensuite un pronom au singulier : « le jour où il sera oint », bien qu’Aaron et ses fils viennent d’être nommés. On peut aussi traduire : « le jour de son onction ».'
    reason: Signaler le décalage entre le groupe pluriel et le pronom singulier, tout en préservant une formulation française alternative sans en fixer le référent.
lexical_decisions:
- source_word: קָרְבַּן
  choice: offrande
  rationale: Terme sacrificiel général ; « offrande » est naturel, précis dans ce contexte et dépourvu d’archaïsme inutile.
- source_word: יַקְרִיבוּ
  choice: présenteront
  rationale: Le hiphil de קרב désigne ici l’acte cultuel de présenter une offrande ; ce choix conserve l’idée d’une présentation officielle devant Dieu.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La translittération rend explicitement le nom divin יהוה et correspond à la couche anglaise de consultation fournie.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: le jour où il recevra l’onction
  rationale: Cette formulation garde la valeur temporelle ainsi que le pronom masculin singulier du texte hébreu, sans le transformer silencieusement en pluriel.
- source_word: עֲשִׂירִת הָאֵפָה
  choice: un dixième d’épha
  rationale: Expression française concise qui conserve précisément l’unité de mesure ancienne.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: Expression française usuelle pour une farine très fine et de qualité, adaptée au vocabulaire sacrificiel.
- source_word: מִנְחָה
  choice: offrande de céréales
  rationale: Dans la législation lévitique, le terme désigne précisément une offrande non animale faite de produits céréaliers.
- source_word: תָּמִיד
  choice: régulière
  rationale: Le terme exprime ici une récurrence stable ; « régulière » évite de suggérer une action matériellement ininterrompue.
- source_word: מַחֲצִיתָהּ ... וּמַחֲצִיתָהּ
  choice: la moitié ... et l’autre moitié
  rationale: Formulation française naturelle qui rend clairement le partage en deux portions égales.
- source_word: בַּבֹּקֶר ... בָּעָרֶב
  choice: le matin ... le soir
  rationale: Équivalents temporels idiomatiques et directs en français moderne.
theological_decisions:
- issue: Référent du pronom singulier dans « le jour où il recevra l’onction », après la mention d’Aaron et de ses fils
  choice: Conserver le singulier du texte massorétique sans préciser davantage son référent.
  alternative: 'Employer le pluriel : « le jour où ils recevront l’onction » ; ou comprendre explicitement le singulier comme visant Aaron ou chaque prêtre successif.'
  rationale: L’hébreu nomme Aaron et ses fils, mais emploie ensuite un pronom objet singulier. La traduction préserve cette tension grammaticale et laisse la note signaler l’ambiguïté sans imposer une harmonisation.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’organisation de l’hébreu tout en étant idiomatique. Les termes cultuels sont explicites sans être inutilement techniques.
