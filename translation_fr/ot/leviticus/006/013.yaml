  to: '« Voici l’offrande d’Aaron et de ses fils[a], qu’ils présenteront à Yahweh le jour où il sera oint : un dixième d’épha de fleur de farine, comme offrande de céréales régulière, la moitié le matin et l’autre moitié le soir. »'
