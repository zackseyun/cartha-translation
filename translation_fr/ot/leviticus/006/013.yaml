    rationale: הִמָּשַׁח signifie littéralement « être oint ». « Il sera oint » maintient la voix et le singulier sans ajouter la notion de réception.
  - severity: low
    issue: La note qualifie « le jour où il recevra l’onction » de formulation littérale.
    rationale: Cette expression est une paraphrase interprétative du passif hébreu, non une traduction littérale. La note doit signaler le singulier sans cette qualification inexacte.
