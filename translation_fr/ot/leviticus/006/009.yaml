  text: וְ/הַ/נּוֹתֶ֣רֶת מִמֶּ֔/נָּה יֹאכְל֖וּ אַהֲרֹ֣ן וּ/בָנָ֑י/ו מַצּ֤וֹת תֵּֽאָכֵל֙ בְּ/מָק֣וֹם קָדֹ֔שׁ בַּ/חֲצַ֥ר אֹֽהֶל מוֹעֵ֖ד יֹאכְלֽוּ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/009.yaml
  text: What is left of it Aaron and his sons shall eat[a]. It shall be eaten unleavened in a holy place[c][b]; they shall eat it in the court of the tent of meeting.
translation:
  language: fr
  text: Ce qui en restera, Aaron et ses fils le mangeront[a]. On le mangera sans levain[b] dans un lieu saint[c] ; ils le mangeront dans la cour de la tente de la rencontre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le reste » ou « ce qui en subsistera ».
    reason: lexical_alternative
  - marker: b
    text: Ou « sous forme de pains sans levain » ou « de galettes sans levain ». L’hébreu indique que l’offrande doit être mangée sans levain, sans préciser ici sa forme.
    reason: lexical_alternative
  - marker: c
    text: L’hébreu dit « dans un lieu saint », et non « dans le lieu saint » ; la proposition suivante précise qu’il s’agit de la cour de la tente de la rencontre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת מִמֶּנָּה
  choice: Ce qui en restera
  rationale: Le participe féminin substantivé désigne la portion restante de l’offrande. Cette formulation française est naturelle et conserve l’idée de reste.
- source_word: יֹאכְלוּ
  choice: le mangeront
  rationale: Dans ce contexte législatif, l’imparfait hébreu a une valeur prescriptive. Le futur français exprime sobrement cette instruction.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Aaron et ses fils
  rationale: Les « fils » sont ici les descendants masculins d’Aaron qui exercent le sacerdoce.
- source_word: מַצּוֹת תֵּאָכֵל
  choice: Cela sera mangé sans levain
  rationale: Le nom pluriel מַצּוֹת employé avec le passif indique que la portion doit être consommée sous une forme sans levain, sans imposer une forme précise telle que pains ou galettes.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: dans un lieu saint
  rationale: מָקוֹם ne porte pas l’article ; l’indéfini reflète ce détail, tandis que la proposition suivante précise le lieu concerné.
- source_word: בַּחֲצַר
  choice: dans la cour
  rationale: חָצֵר désigne l’espace clos entourant le sanctuaire.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette traduction conserve l’image et la fonction exprimées par l’appellation hébraïque, dans un français clair.
- source_word: יֹאכְלוּהָ
  choice: ils le mangeront
  rationale: La répétition finale de l’instruction et le suffixe objet sont conservés plutôt que fondus avec la première proposition.
