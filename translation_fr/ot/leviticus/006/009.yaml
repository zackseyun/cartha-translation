translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la répétition juridique de l’hébreu. « Tente de la rencontre » rend directement אֹהֶל מוֹעֵד ; « sans levain » évite d’ajouter une forme de produit non explicitement imposée par le texte.
