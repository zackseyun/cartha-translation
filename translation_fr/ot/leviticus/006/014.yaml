source:
  edition: WLC
  text: עַֽל מַחֲבַ֗ת בַּ/שֶּׁ֛מֶן תֵּעָשֶׂ֖ה מֻרְבֶּ֣כֶת תְּבִיאֶ֑/נָּה תֻּפִינֵי֙ מִנְחַ֣ת פִּתִּ֔ים תַּקְרִ֥יב רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/014.yaml
  text: On a griddle with oil it shall be made[a], well mixed; you shall bring it in baked pieces, a grain offering broken into pieces[c][b], and present it as a pleasing aroma to Yahweh.
translation:
  language: fr
  text: Elle sera préparée sur une plaque, avec de l’huile[a], bien mélangée. Tu l’apporteras sous forme de portions cuites[b] ; tu présenteras cette offrande de céréales en morceaux en parfum agréable[c] pour Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans l’huile ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu traduit par « portions cuites » est rare ; il peut désigner des portions cuites sur la plaque.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « un parfum agréable », formule sacrificielle indiquant une offrande agréée par Yahweh.'
    reason: cultural_note
lexical_decisions:
- source_word: מַחֲבַת
  choice: plaque
  rationale: Le terme désigne un ustensile plat servant à cuire les offrandes de céréales. « Plaque » est naturel en français moderne et évite d’évoquer une poêle profonde.
- source_word: בַּשֶּׁמֶן
  choice: avec de l’huile
  rationale: La préposition ב peut exprimer ici le moyen ou le milieu de préparation. « Avec de l’huile » est idiomatique, tandis que la variante « dans l’huile » est signalée en note.
- source_word: תֵּעָשֶׂה
  choice: elle sera préparée
  rationale: Le nifal de עשה exprime un passif. « Sera préparée » convient mieux à une instruction culinaire et cultuelle que le calque « sera faite ».
- source_word: מֻרְבֶּכֶת
  choice: bien mélangée
  rationale: Ce terme décrit vraisemblablement la préparation comme mêlée ou incorporée à l’huile. La traduction reste générale afin de ne pas imposer une technique culinaire incertaine.
- source_word: תְּבִיאֶנָּה
  choice: tu l’apporteras
  rationale: Le verbe signifie « apporter » et le suffixe féminin renvoie à l’offrande. La formulation conserve le mouvement de présentation sans le confondre avec תַּקְרִיב.
- source_word: תֻּפִינֵי
  choice: portions cuites
  rationale: Ce mot culinaire rare semble désigner des éléments ou portions ayant subi une cuisson. « Portions cuites » préserve cette probabilité sans préciser indûment le procédé.
- source_word: מִנְחַת
  choice: offrande de céréales
  rationale: Dans ce contexte lévitique, מִנְחָה désigne l’offrande faite de farine ou de céréales, et non une offrande générique.
- source_word: פִּתִּים
  choice: en morceaux
  rationale: Le pluriel renvoie à des morceaux ou portions. « En morceaux » rend simplement leur état divisé sans préciser comment ils ont été séparés.
- source_word: תַּקְרִיב
  choice: tu présenteras
  rationale: Au hifil, קרב est un terme sacrificiel signifiant faire approcher, présenter ou offrir. « Présenteras » garde la solennité cultuelle et évite de répéter « apporteras ».
- source_word: רֵיחַ נִיחֹחַ
  choice: un parfum agréable
  rationale: Cette expression sacrificielle consacrée indique que l’offrande est agréée par Dieu. « Parfum agréable » conserve l’image concrète et la portée cultuelle sans la surinterpréter.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le texte porte explicitement le nom divin יהוה. La translittération « Yahweh » préserve le nom propre de l’alliance.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le Tétragramme comme nom propre. « Yahweh » le représente directement, sans le remplacer par un titre.
- issue: Portée de רֵיחַ נִיחֹחַ
  choice: un parfum agréable
  alternative: une odeur apaisante
  rationale: La formulation retenue conserve l’expression sacrificielle d’acceptation sans suggérer que le sacrifice apaise mécaniquement Dieu ni réduire l’image à un simple plaisir olfactif.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète les formes verbales hébraïques. La syntaxe distingue l’action d’apporter de celle de présenter rituellement l’offrande, tout en conservant l’incertitude du terme culinaire rare.
