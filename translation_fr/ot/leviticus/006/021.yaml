source:
  edition: WLC
  text: וּ/כְלִי חֶ֛רֶשׂ אֲשֶׁ֥ר תְּבֻשַּׁל בּ֖/וֹ יִשָּׁבֵ֑ר וְ/אִם בִּ/כְלִ֤י נְחֹ֨שֶׁת֙ בֻּשָּׁ֔לָה וּ/מֹרַ֥ק וְ/שֻׁטַּ֖ף בַּ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/021.yaml
  text: And an earthenware vessel in which it is boiled must be broken; but if it is boiled in a bronze vessel[a], it must be scoured and rinsed with water.
translation:
  language: fr
  text: Tout récipient en terre cuite dans lequel elle sera cuite devra être brisé. Mais si elle est cuite dans un récipient en bronze[a], celui-ci sera récuré et rincé à l’eau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en cuivre ». Le mot hébreu נְחֹשֶׁת peut désigner le cuivre ou le bronze selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: récipient en terre
  rationale: L’expression désigne un récipient en terre cuite. « Récipient en terre » est clair et naturel, tout en conservant la distinction de matériau qui motive le traitement prescrit.
- source_word: תְּבֻשַּׁל / בֻּשָּׁלָה
  choice: aura cuit / a cuit
  rationale: Le verbe בשׁל peut désigner la cuisson, notamment dans un liquide. En français, « cuire dans un récipient » est plus idiomatique que « bouillir dans un récipient » lorsque le sujet implicite est la viande de l’offrande; la voix passive hébraïque est rendue naturellement par une tournure active à sujet implicite.
- source_word: בּוֹ
  choice: dans lequel
  rationale: La préposition avec suffixe renvoie au récipient et exprime clairement la relation locative.
- source_word: יִשָּׁבֵר
  choice: sera brisé
  rationale: Dans ce texte juridique, le futur français exprime une prescription ferme avec dignité, sans archaïsme.
- source_word: כְלִי נְחֹשֶׁת
  choice: récipient en bronze
  rationale: נְחֹשֶׁת peut désigner le cuivre ou le bronze. « Bronze » convient bien aux récipients métalliques anciens; l’autre possibilité est signalée en note.
- source_word: וּמֹרַק
  choice: sera récuré
  rationale: מרק évoque un nettoyage vigoureux par frottement. « Récurer » exprime précisément cette action appliquée à un récipient métallique.
- source_word: וְשֻׁטַּף בַּמָּיִם
  choice: et rincé à l’eau
  rationale: שטף désigne un lavage ou rinçage à l’eau. « Rincé à l’eau » forme une seconde étape naturelle après le récurage.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le référent féminin implicite (« elle ») reprend l’offrande pour le péché mentionnée dans le contexte. La formulation conserve le caractère prescriptif du texte juridique.
