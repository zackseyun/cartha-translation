- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Dans cette formule d’introduction au discours direct, « en ces termes » exprime idiomatiquement la fonction de l’infinitif hébreu et prépare les paroles qui suivent.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le nom divin. « Yahweh » le conserve comme nom propre, sans le remplacer silencieusement par le titre traditionnel.
translation_notes:
  register: Français moderne, digne et naturel. La tournure « en ces termes » évite le calque pesant « disant » tout en conservant la formule solennelle d’introduction au discours.
