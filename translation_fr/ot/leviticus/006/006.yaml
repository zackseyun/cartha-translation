  text: אֵ֗שׁ תָּמִ֛יד תּוּקַ֥ד עַל הַ/מִּזְבֵּ֖חַ לֹ֥א תִכְבֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/006.yaml
  text: A continual fire shall be kept burning on the altar[a]; it shall not go out.
translation:
  language: fr
  text: Un feu continuel sera entretenu sur l’autel[a] ; il ne s’éteindra pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Un feu perpétuel brûlera sur l’autel ; il ne s’éteindra pas. »'
    reason: Alternative lexicale pour תָּמִיד (« perpétuel ») et alternative syntaxique plus directe pour תּוּקַד (« brûlera »), tout en conservant le caractère intransitif de « il ne s’éteindra pas » pour תִכְבֶּה.
lexical_decisions:
- source_word: אֵשׁ
  choice: feu
  rationale: Le nom désigne directement un feu réel ; « feu » est le terme naturel dans le contexte de l’autel.
- source_word: תָּמִיד
  choice: continuel
  rationale: L’adjectif exprime ici la permanence du feu. « Continuel » conserve cette portée sans suggérer seulement une répétition régulière.
- source_word: תּוּקַד
  choice: sera entretenu
  rationale: La forme hophal de יקד présente le feu comme maintenu en combustion. « Sera entretenu » rend la valeur passive-causative et la responsabilité implicite des prêtres, plutôt que le simple fait de brûler.
- source_word: עַל הַמִּזְבֵּחַ
  choice: sur l’autel
  rationale: Cette formulation rend directement la préposition spatiale et l’article défini dans un français cultuel naturel.
- source_word: לֹא תִכְבֶה
  choice: il ne s’éteindra pas
  rationale: Le verbe peut décrire le fait qu’un feu s’éteint. Cette tournure française claire conserve la valeur intransitive du texte plutôt que d’expliciter un agent qui l’éteindrait.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. « Sera entretenu » explicite naturellement la maintenance prescrite par la forme verbale, tandis que la note préserve une traduction plus formelle et l’ambiguïté de la dernière proposition.
