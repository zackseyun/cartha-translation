id: LEV.6.7
reference: Leviticus 6:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת הַ/מִּנְחָ֑ה הַקְרֵ֨ב אֹתָ֤/הּ בְּנֵֽי אַהֲרֹן֙ לִ/פְנֵ֣י יְהוָ֔ה אֶל פְּנֵ֖י הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/007.yaml
  text: 'And this is the law of the grain offering: the sons of Aaron shall present it before Yahweh[a], in front of the altar.'
translation:
  language: fr
  text: 'Et voici la loi[a] relative à l’offrande de céréales : les fils d’Aaron la présenteront devant Yahweh, face à l’autel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’instruction concernant » ou « les prescriptions relatives à ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Et voici
  rationale: Cette formule conserve le lien avec le contexte précédent tout en introduisant naturellement une nouvelle section de prescriptions.
- source_word: תּוֹרַת
  choice: la loi relative à
  rationale: Dans ce contexte sacrificiel, תּוֹרָה désigne l’ensemble des prescriptions régissant l’offrande. « Loi » maintient le caractère normatif du passage, tandis que « relative à » donne une formulation française naturelle.
- source_word: הַמִּנְחָה
  choice: l’offrande de céréales
  rationale: Dans la législation lévitique, מִנְחָה désigne ici une offrande constituée de produits céréaliers, et non une offrande au sens générique.
- source_word: הַקְרֵב אֹתָהּ
  choice: la présenteront
  rationale: Le verbe קרב au hifil exprime l’action rituelle de faire approcher ou de présenter l’offrande. Le futur français convient à une prescription légale adressée aux prêtres.
- source_word: בְּנֵי אַהֲרֹן
  choice: les fils d’Aaron
  rationale: La traduction directe préserve la désignation familiale et sacerdotale propre au Lévitique.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: La formule indique que la présentation se fait dans la présence divine, et le nom propre יהוה est rendu par « Yahweh ».
- source_word: אֶל פְּנֵי הַמִּזְבֵּחַ
  choice: face à l’autel
  rationale: Cette expression situe concrètement l’acte rituel par rapport à l’autel et permet de la distinguer en français de לִפְנֵי יְהוָה, traduit juste avant par « devant Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » conserve le nom d’alliance au lieu de le remplacer par un titre.
- issue: Valeur de תּוֹרָה dans la législation sacrificielle
  choice: loi
  alternative: instruction ; prescription
  rationale: « Loi » garde la force normative et liturgique du terme sans exclure sa nuance d’enseignement ou de directive, signalée en note.
translation_notes:
  register: 'Français international moderne, digne et accessible. La formulation conserve le caractère prescriptif du texte et distingue les deux indications spatiales : « devant Yahweh » et « face à l’autel ».'
