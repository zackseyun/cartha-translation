  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: צַ֤ו אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו לֵ/אמֹ֔ר זֹ֥את תּוֹרַ֖ת הָ/עֹלָ֑ה הִ֣וא הָ/עֹלָ֡ה עַל֩ מוֹקְדָ֨ה עַל הַ/מִּזְבֵּ֤חַ כָּל הַ/לַּ֨יְלָה֙ עַד הַ/בֹּ֔קֶר וְ/אֵ֥שׁ הַ/מִּזְבֵּ֖חַ תּ֥וּקַד בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/002.yaml
  text: 'Command Aaron and his sons[a], saying, This is the law of the burnt offering: the burnt offering itself shall remain on its hearth on the altar all night until the morning[b], and the fire of the altar shall be kept burning on it.'
translation:
  language: fr
  text: 'Donne cet ordre à Aaron et à ses fils : « Voici la loi concernant l’holocauste : l’holocauste restera sur le foyer de l’autel[a] toute la nuit, jusqu’au matin, et le feu de l’autel y sera maintenu allumé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sur l’endroit où le feu brûle, sur l’autel ». Le terme hébreu désigne le lieu de combustion, le foyer de l’autel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: Donne cet ordre à
  rationale: L’impératif exprime un commandement direct. Cette tournure conserve sa force tout en étant plus naturelle en français courant que « Commande à ».
- source_word: אַהֲרֹן וְאֶת־בָּנָיו
  choice: Aaron et ses fils
  rationale: Dans ce contexte sacerdotal, בנים désigne précisément les fils d’Aaron qui exercent avec lui le sacerdoce.
- source_word: לֵאמֹר
  choice: introduction directe par les deux-points
  rationale: Après « Donne cet ordre », le français introduit naturellement les paroles commandées par les deux-points, sans calquer « en disant ».
- source_word: זֹאת תּוֹרַת
  choice: Voici la loi concernant
  rationale: תּוֹרָה désigne ici la prescription qui régit un sacrifice. « Loi » conserve le registre formel de cette formule cultuelle, tandis que « concernant » produit une construction française naturelle.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: Terme français traditionnel et précis pour le sacrifice entièrement consumé, plus idiomatique que « offrande d’élévation ».
- source_word: הִוא הָעֹלָה
  choice: l’holocauste
  rationale: La reprise du nom hébreu recentre l’instruction sur l’offrande elle-même. La répétition française préserve cette insistance sans ajouter une interprétation.
- source_word: עַל מוֹקְדָה עַל הַמִּזְבֵּחַ
  choice: sur le foyer de l’autel
  rationale: מוֹקְדָה désigne le lieu où le feu brûle, ou foyer, sur l’autel. Cette formulation garde l’image concrète et rattache clairement le foyer à l’autel.
- source_word: כָּל הַלַּיְלָה עַד הַבֹּקֶר
  choice: toute la nuit, jusqu’au matin
  rationale: Rendu direct et idiomatique qui conserve toute l’étendue temporelle indiquée par l’hébreu.
- source_word: וְאֵשׁ הַמִּזְבֵּחַ תּוּקַד בּוֹ
  choice: et le feu de l’autel y sera maintenu allumé
  rationale: La forme verbale passive indique que le feu doit être entretenu. « y » conserve la référence locale compacte du suffixe hébreu sans trancher artificiellement entre le foyer et l’autel, étroitement associés dans le contexte.
theological_decisions:
- issue: Sens de תּוֹרָה dans la législation sacrificielle
  choice: loi
  alternative: instruction ; règle ; prescription
  rationale: Le mot introduit ici une disposition cultuelle précise, et non nécessairement la Torah entière comme corpus. « Loi » préserve le caractère normatif et la solennité de la formule sans imposer une distinction doctrinale étrangère au passage.
- issue: Caractère prescriptif de l’entretien du feu
  choice: sera maintenu allumé
  alternative: brûlera
  rationale: La forme hébraïque présente le feu comme devant être entretenu. Le rendu choisi conserve donc l’obligation sacerdotale implicite au lieu de transformer la prescription en simple constat.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le ton normatif de la législation sacerdotale, évite les calques peu naturels et maintient l’ambiguïté locale du pronom hébreu au moyen de « y ».
