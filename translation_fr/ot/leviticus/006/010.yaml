source:
  edition: WLC
  text: לֹ֤א תֵאָפֶה֙ חָמֵ֔ץ חֶלְקָ֛/ם נָתַ֥תִּי אֹתָ֖/הּ מֵ/אִשָּׁ֑/י קֹ֤דֶשׁ קָֽדָשִׁים֙ הִ֔וא כַּ/חַטָּ֖את וְ/כָ/אָשָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/010.yaml
  text: It shall not be baked with leaven[a]. I have given it as their portion from my food offerings. It is most holy[b], like the sin offering and the guilt offering.
translation:
  language: fr
  text: Elle ne sera pas cuite avec du levain. Je la leur ai donnée comme leur part parmi mes offrandes par le feu[a]. Elle est très sainte, comme le sacrifice pour le péché et le sacrifice de réparation[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parmi mes offrandes alimentaires ».'
    reason: Le terme hébreu אִשֶּׁה désigne une catégorie technique d’offrandes; son lien au feu de l’autel ou au langage de l’offrande alimentaire est discuté.
  - marker: b
    text: 'Ou : « le sacrifice de culpabilité »; traduction traditionnelle : « le sacrifice pour le délit ».'
    reason: Le terme אָשָׁם peut mettre l’accent sur la culpabilité, la réparation ou le sacrifice prescrit dans ce cas.
lexical_decisions:
- source_word: תֵאָפֶה
  choice: elle ne sera pas cuite
  rationale: Le nifal exprime ici un sens passif et renvoie à l’offrande, de genre féminin dans le contexte. Le futur normatif convient au style juridique français.
- source_word: חָמֵץ
  choice: avec du levain
  rationale: Cette formulation naturelle en français moderne exprime l’emploi de levain sans préciser indûment qu’il s’agit d’un pain.
- source_word: חֶלְקָם
  choice: comme part
  rationale: חֵלֶק désigne la part attribuée aux prêtres; le pronom « leur » dans la proposition rend explicitement le suffixe possessif pluriel.
- source_word: נָתַתִּי אֹתָהּ
  choice: je la leur ai donnée
  rationale: Le passé composé rend l’acte établi de don dont l’effet demeure; le pronom féminin reprend l’offrande.
- source_word: מֵאִשַּׁי
  choice: de mes offrandes consumées par le feu
  rationale: Cette traduction conserve le caractère sacrificiel et le rapport traditionnel du terme אִשֶּׁה au feu, tout en restant intelligible en français courant.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: très sainte
  rationale: La construction intensive indique le degré suprême de sainteté. L’accord féminin reprend l’offrande et évite l’expression française « saint des saints », généralement associée à un lieu.
- source_word: כַּחַטָּאת
  choice: comme le sacrifice pour le péché
  rationale: Le préfixe כ établit une comparaison ou une même catégorie de sainteté; « sacrifice pour le péché » est clair et usuel.
- source_word: וְכָאָשָׁם
  choice: et le sacrifice de réparation
  rationale: Dans ce contexte sacrificiel, אָשָׁם désigne une offrande associée à la culpabilité et à la réparation. « Sacrifice de réparation » met en valeur sa fonction cultuelle sans employer le terme vieilli « délit ».
theological_decisions:
- issue: Sens du terme sacrificiel אָשָׁם
  choice: sacrifice de réparation
  alternative: sacrifice de culpabilité; traditionnellement, sacrifice pour le délit
  rationale: Le mot peut mettre en avant la culpabilité ou la réparation exigée. Le choix retenu est naturel en français et désigne la catégorie sacrificielle sans enfermer le terme dans une théorie doctrinale particulière; les autres possibilités sont signalées.
- issue: Sens du terme technique אִשֶּׁה
  choice: offrandes consumées par le feu
  alternative: offrandes alimentaires
  rationale: Le terme désigne une catégorie d’offrandes présentées à Dieu et traditionnellement liée au feu de l’autel. La traduction principale conserve cet élément concret; la note préserve l’analyse qui souligne plutôt l’offrande comme nourriture divine dans le langage cultuel.
translation_notes:
  register: Français international moderne, clair et digne. Le futur passif conserve le ton normatif du texte sacerdotal. La terminologie sacrificielle reste accessible tout en maintenant les ambiguïtés lexicales importantes dans les notes.
