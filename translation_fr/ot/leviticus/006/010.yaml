  naturalness: Le français est globalement clair et moderne. « Je la leur ai donnée comme leur part parmi mes offrandes par le feu » est plus idiomatique et reproduit plus naturellement la relation entre l’attribution sacerdotale et les offrandes. « Offrandes par le feu » évite en outre de laisser entendre que la part donnée aux prêtres est elle-même consumée.
  terminology: « Sacrifice pour le péché », « sacrifice de réparation » et « très sainte » conviennent au registre cultuel tout en restant accessibles. « Offrandes par le feu » est une formulation sobre pour le terme technique אִשֶּׁה; l’alternative « offrandes alimentaires » est correctement signalée. La note sur אָשָׁם est maintenue, mais son ancre est déplacée vers le terme concerné.
