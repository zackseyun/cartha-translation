  text: וַ/יִּשְׁמַ֣ע מֹשֶׁ֔ה וַ/יִּיטַ֖ב בְּ/עֵינָֽי/ו׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/020.yaml
  text: And Moses heard[a], and it was good in his eyes.
translation:
  language: fr
  text: Moïse entendit, et cela lui parut bon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cela fut bon à ses yeux » ; autrement : « cela lui parut juste » ou « il l’approuva ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: entendit cela
  rationale: Le qal de שׁמע signifie couramment « entendre ». Le pronom « cela », implicite dans le contexte, renvoie à l’explication donnée par Aaron au verset précédent sans imposer l’idée plus forte de compréhension ou d’obéissance.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom hébreu מֹשֶׁה.
- source_word: וַיִּיטַב בְּעֵינָיו
  choice: il trouva bon ce qui avait été dit
  rationale: L’expression signifie littéralement que la chose « fut bonne à ses yeux », c’est-à-dire qu’elle parut acceptable à Moïse. Cette formulation française actuelle conserve l’évaluation positive sans la renforcer jusqu’à une approbation formelle.
theological_decisions:
- issue: Portée de la réaction de Moïse
  choice: « il trouva bon ce qui avait été dit »
  alternative: « il approuva »
  rationale: Le texte indique une appréciation favorable, mais ne précise pas nécessairement un acte officiel d’approbation. La traduction retenue préserve cette nuance.
translation_notes:
  register: Français moderne, simple et digne. L’idiome hébreu est rendu naturellement dans le texte, tandis que sa forme littérale et ses principales nuances sont conservées en note.
