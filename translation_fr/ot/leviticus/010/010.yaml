  text: וּֽ/לֲ/הַבְדִּ֔יל בֵּ֥ין הַ/קֹּ֖דֶשׁ וּ/בֵ֣ין הַ/חֹ֑ל וּ/בֵ֥ין הַ/טָּמֵ֖א וּ/בֵ֥ין הַ/טָּהֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/010.yaml
  text: to distinguish between the holy and the common[a], and between the unclean and the clean[b],
translation:
  language: fr
  text: afin de distinguer ce qui est saint de ce qui est profane[a], et ce qui est impur de ce qui est pur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « profane » désigne ce qui n’est pas consacré, et non nécessairement ce qui témoigne d’irrévérence.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire impur ou pur sur le plan rituel.
    reason: cultural_note
lexical_decisions:
- source_word: וּלֲהַבְדִּיל
  choice: afin de distinguer
  rationale: L’infinitif construit exprime ici le but dans la continuité du verset précédent. « Afin de distinguer » rend naturellement cette fonction de discernement.
- source_word: בֵּין
  choice: distinguer… de…
  rationale: La préposition introduit deux catégories opposées. En français, après « distinguer », la construction idiomatique est « distinguer X de Y » plutôt qu’une répétition littérale de « entre ».
- source_word: הַקֹּדֶשׁ
  choice: ce qui est saint
  rationale: Le substantif désigne ici la catégorie de ce qui est mis à part pour Dieu, sans préciser un objet particulier.
- source_word: הַחֹל
  choice: ce qui est profane
  rationale: Dans le vocabulaire sacerdotal, le mot désigne ce qui n’est pas consacré, par opposition à ce qui est saint. « Profane » exprime clairement cette opposition en français, avec une note pour écarter le sens moderne d’irrévérence.
- source_word: הַטָּמֵא
  choice: ce qui est impur
  rationale: Dans le Lévitique, le terme désigne principalement un statut d’impureté rituelle. « Impur » est précis et forme une paire naturelle avec « pur ».
- source_word: הַטָּהוֹר
  choice: ce qui est pur
  rationale: Le terme désigne le statut rituel opposé à l’impureté. « Pur » est la formulation française usuelle et contextuellement appropriée.
theological_decisions:
- issue: Opposition sacerdotale entre קֹדֶשׁ et חֹל
  choice: ce qui est saint et ce qui est profane
  alternative: ce qui est sacré et ce qui est ordinaire
  rationale: Le texte oppose ce qui est consacré à ce qui ne l’est pas. « Profane » conserve cette catégorie cultuelle, tandis que la note précise qu’il ne s’agit pas nécessairement d’un comportement irrévérencieux.
- issue: Nature des catégories טָמֵא et טָהוֹר
  choice: impur / pur, compris comme statuts rituels
  alternative: souillé / sans souillure
  rationale: Le contexte sacerdotal du Lévitique porte sur le statut rituel. Cette formulation évite d’assimiler automatiquement toute impureté à une faute morale.
translation_notes:
  register: Français international moderne, clair et digne. La structure répétée est allégée selon l’usage français (« distinguer X de Y »), tout en conservant les deux oppositions catégorielles du texte hébreu.
