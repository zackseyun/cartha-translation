  text: וּ/מִ/פֶּתַח֩ אֹ֨הֶל מוֹעֵ֜ד לֹ֤א תֵֽצְאוּ֙ פֶּן תָּמֻ֔תוּ כִּי שֶׁ֛מֶן מִשְׁחַ֥ת יְהוָ֖ה עֲלֵי/כֶ֑ם וַֽ/יַּעֲשׂ֖וּ כִּ/דְבַ֥ר מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/007.yaml
  text: And you shall not go out from the entrance of the tent of meeting, lest you die, because the anointing oil of Yahweh is on you.” And they did according to the word of Moses.
translation:
  language: fr
  text: Vous ne sortirez pas de l’entrée de la tente de la rencontre, de peur que vous ne mouriez, car l’huile d’onction de Yahweh est sur vous. » Ils agirent conformément à la parole de Moïse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִפֶּתַח
  choice: de l’entrée
  rationale: פֶּתַח désigne ici l’entrée de la tente-sanctuaire. « De l’entrée » rend directement la préposition מִן sans suggérer qu’ils se trouvent simplement à l’intérieur d’un bâtiment ordinaire.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette expression cultuelle désigne le sanctuaire où Yahweh rencontre son peuple. « Tente de la rencontre » est exacte, intelligible et naturelle en français moderne.
- source_word: לֹא תֵצְאוּ
  choice: Vous ne sortirez pas
  rationale: L’imparfait nié exprime ici une interdiction ferme. Le futur français conserve sa force juridique et solennelle sans archaïsme excessif.
- source_word: פֶּן תָּמֻתוּ
  choice: de peur que vous ne mouriez
  rationale: פֶּן introduit la conséquence redoutée que l’interdiction vise à éviter. Cette formulation conserve la nuance d’avertissement sans transformer explicitement la proposition en menace certaine.
- source_word: שֶׁמֶן מִשְׁחַת יְהוָה
  choice: l’huile d’onction de Yahweh
  rationale: Le groupe construit désigne l’huile sacrée d’onction liée à Yahweh et à la consécration des prêtres. La formulation reste proche de l’hébreu.
- source_word: עֲלֵיכֶם
  choice: est sur vous
  rationale: La préposition עַל indique concrètement que l’huile a été appliquée sur eux, avec la portée cultuelle de leur consécration. « Est sur vous » préserve cette image.
- source_word: וַיַּעֲשׂוּ כִּדְבַר מֹשֶׁה
  choice: Ils agirent conformément à la parole de Moïse
  rationale: Le verbe עשה signifie ici qu’ils se conformèrent à l’instruction reçue. « Conformément à la parole » préserve דָּבָר tout en produisant un français idiomatique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom divin personnel יהוה. « Yahweh » le représente directement au lieu de lui substituer un titre.
- issue: Portée de l’huile d’onction sur les prêtres
  choice: « l’huile d’onction de Yahweh est sur vous »
  alternative: « vous avez reçu l’onction de Yahweh »
  rationale: La traduction conserve l’image concrète et la formulation nominale de l’hébreu, sans expliciter davantage la nature ou les effets théologiques de la consécration.
- issue: Nuance de פֶּן תָּמֻתוּ
  choice: « de peur que vous ne mouriez »
  alternative: « sinon vous mourrez »
  rationale: פֶּן marque le résultat redouté ou à éviter. La formulation retenue préserve cette nuance plutôt que de la résoudre en annonce catégorique.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur d’interdiction maintient le ton prescriptif du contexte sacerdotal. « Tente de la rencontre » et « huile d’onction » conservent le vocabulaire cultuel sans surcharge explicative.
