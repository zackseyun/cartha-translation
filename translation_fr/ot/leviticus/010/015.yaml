  source_fidelity: La formulation « cuisse prélevée » ne rend pas clairement la relation construite « cuisse du prélèvement »; de même, « poitrine destinée au geste » ajoute une nuance de destination qui n’est pas exprimée. « Offrandes consumées » est imprécis pour אִשֵּׁי, qui désigne les portions offertes par le feu, sans affirmer ici qu’elles sont entièrement consumées. La reprise française au pluriel (« Ces parts ») explicite naturellement le référent collectif du singulier hébreu.
  naturalness: Le texte révisé conserve un français moderne et digne. « Cuisse de prélèvement » et « poitrine de présentation » sont des expressions cultuelles transparentes, plus exactes et plus fluides que les périphrases adjectivales du projet. « Pour les présenter rituellement » rend le lien verbal avec le terme de présentation sans imposer un mouvement matériel précis.
  terminology: Yahweh est conservé. « Prélèvement », « présentation » et « portions de graisse offertes par le feu » rendent les termes sacrificiels sans recourir à un jargon inutilement archaïque ni transformer la présentation rituelle en une description certaine de son geste.
