  to: Ils apporteront la cuisse de prélèvement[a][b] et la poitrine de présentation[c], avec les portions de graisse offertes par le feu, afin de les présenter rituellement devant Yahweh[d]. Ces parts seront pour toi et pour tes fils avec toi, comme une prescription permanente, ainsi que Yahweh l’a ordonné.
  rationale: La révision restitue les relations syntaxiques des deux portions sacerdotales, clarifie les portions grasses offertes par le feu et remplace des formulations françaises maladroites ou trop interprétatives. Elle conserve l’ambiguïté relative au geste exact de la présentation rituelle et maintient tous les ancrages de notes.
