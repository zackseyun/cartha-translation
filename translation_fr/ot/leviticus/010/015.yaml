  text: שׁ֣וֹק הַ/תְּרוּמָ֞ה וַ/חֲזֵ֣ה הַ/תְּנוּפָ֗ה עַ֣ל אִשֵּׁ֤י הַ/חֲלָבִים֙ יָבִ֔יאוּ לְ/הָנִ֥יף תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וְ/הָיָ֨ה לְ/ךָ֜ וּ/לְ/בָנֶ֤י/ךָ אִתְּ/ךָ֙ לְ/חָק עוֹלָ֔ם כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/015.yaml
  text: They shall bring the thigh of the contribution and the breast of the wave offering[a], along with the food offerings of the fat portions, to wave as a wave offering before Yahweh; and it shall be for you and for your sons with you as a permanent statute[d][c][b], just as Yahweh commanded.
translation:
  language: fr
  text: Ils apporteront la cuisse de prélèvement[a][b] et la poitrine de présentation[c], avec les portions de graisse offertes par le feu, afin de les présenter rituellement devant Yahweh[d]. Ces parts seront pour toi et pour tes fils avec toi, comme une prescription permanente, ainsi que Yahweh l’a ordonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jambe »; le mot désigne ici la partie arrière de l’animal attribuée au prêtre.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « la cuisse du prélèvement » : une portion mise à part. Traduction traditionnelle : « offrande élevée ».'
    reason: lexical_alternative
  - marker: c
    text: La « présentation » désigne un rite accompli devant Yahweh, traditionnellement appelé « offrande agitée ».
    reason: cultural_note
  - marker: d
    text: « Yahweh » transcrit le nom divin hébreu YHWH, souvent rendu par « le SEIGNEUR ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹק
  choice: cuisse
  rationale: Dans ce contexte sacrificiel, le terme désigne la partie supérieure de la patte arrière attribuée au prêtre. « Cuisse » est précis et naturel en français.
- source_word: תְּרוּמָה
  choice: prélevée
  rationale: Le nom désigne une portion retirée de l’ensemble et mise à part pour Dieu ou pour le prêtre. La formulation adjectivale « cuisse prélevée » évite un jargon archaïque tout en exprimant cette mise à part.
- source_word: חָזֶה
  choice: poitrine
  rationale: Terme anatomique courant et approprié pour la pièce de l’animal dans le contexte sacrificiel.
- source_word: תְּנוּפָה / לְהָנִיף
  choice: geste de présentation / accomplir le geste de présentation
  rationale: Le nom et le verbe apparentés décrivent une présentation rituelle devant Yahweh, traditionnellement comprise comme un mouvement d’élévation ou de balancement. Cette traduction conserve la dimension rituelle sans imposer un mouvement précis que le français « balancer » pourrait rendre de façon trompeuse.
- source_word: עַל אִשֵּׁי הַחֲלָבִים
  choice: avec les offrandes consumées faites des morceaux de graisse
  rationale: עַל a ici un sens d’accompagnement; אִשֵּׁי renvoie aux offrandes destinées au feu, et הַחֲלָבִים aux morceaux de graisse sacrificiels.
- source_word: וְהָיָה לְךָ וּלְבָנֶיךָ אִתְּךָ
  choice: Elles seront pour toi et pour tes fils avec toi
  rationale: Le singulier hébreu peut envisager collectivement l’ensemble mentionné. Le pluriel français reprend clairement les deux parts, la cuisse et la poitrine, sans modifier le droit sacerdotal exprimé.
- source_word: לְחָק עוֹלָם
  choice: selon une prescription permanente
  rationale: Exprime une règle cultuelle durable. « Prescription permanente » est actuel, clair et moins archaïque que « statut perpétuel ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin YHWH, qui préserve ici le nom propre du Dieu d’Israël.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahweh » conserve le nom propre plutôt que de lui substituer un titre.
- issue: Nature du rite exprimé par תְּנוּפָה
  choice: geste de présentation
  alternative: offrande balancée
  rationale: Le terme désigne une présentation rituelle devant Yahweh, mais la forme exacte du mouvement n’est pas entièrement explicitée par ce verset. La traduction retenue préserve la fonction rituelle et la note signale la traduction traditionnelle.
- issue: Portée de la prescription permanente
  choice: prescription permanente
  alternative: prescription perpétuelle
  rationale: La traduction rend la durée affirmée par חָק עוֹלָם sans préciser au-delà du texte son rapport aux développements théologiques ultérieurs.
translation_notes:
  register: Français international moderne, digne et accessible. Les termes techniques sont limités et expliqués en notes. La répétition de « geste de présentation » reproduit intentionnellement le lien entre le nom תְּנוּפָה et le verbe apparenté לְהָנִיף.
