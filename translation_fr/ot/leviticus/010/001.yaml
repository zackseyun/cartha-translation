  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּקְח֣וּ בְנֵֽי אַ֠הֲרֹן נָדָ֨ב וַ/אֲבִיה֜וּא אִ֣ישׁ מַחְתָּת֗/וֹ וַ/יִּתְּנ֤וּ בָ/הֵן֙ אֵ֔שׁ וַ/יָּשִׂ֥ימוּ עָלֶ֖י/הָ קְטֹ֑רֶת וַ/יַּקְרִ֜בוּ לִ/פְנֵ֤י יְהוָה֙ אֵ֣שׁ זָרָ֔ה אֲשֶׁ֧ר לֹ֦א צִוָּ֖ה אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/001.yaml
  text: Then Nadab and Abihu[a], Aaron’s sons, each took his firepan, put fire in it, placed incense on it, and presented unauthorized fire before Yahweh, which he had not commanded them.
translation:
  language: fr
  text: Nadab et Abihou, fils d’Aaron, prirent chacun son brasero, y mirent du feu, déposèrent de l’encens dessus et présentèrent devant Yahweh un feu non autorisé[a], qu’il ne leur avait pas ordonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un feu étranger ». L’expression hébraïque désigne ici un feu qui n’avait pas été autorisé par Yahweh, comme l’explique la proposition suivante.
    reason: Alternative lexicale pour אֵשׁ זָרָה, dont le rendu littéral traditionnel peut être moins clair en français moderne.
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: prirent
  rationale: Le verbe narratif לקח signifie simplement « prendre » dans cette suite d’actions.
- source_word: בְנֵי אַהֲרֹן
  choice: fils d’Aaron
  rationale: Rend directement la relation familiale exprimée par l’état construit hébreu.
- source_word: נָדָב וַאֲבִיהוּא
  choice: Nadab et Abihou
  rationale: Translittération française usuelle et immédiatement reconnaissable des noms propres.
- source_word: אִישׁ מַחְתָּתוֹ
  choice: chacun son brasero
  rationale: אִישׁ a ici une valeur distributive, et מַחְתָּה désigne un récipient servant à transporter des braises; « brasero » est plus courant et concret que « encensoir », sans réduire l’objet à une seule fonction.
- source_word: וַיִּתְּנוּ בָהֵן אֵשׁ
  choice: y mirent du feu
  rationale: La tournure française reprend naturellement le brasero de chacun tout en rendant נתן et le complément introduit par ב.
- source_word: וַיָּשִׂימוּ עָלֶיהָ קְטֹרֶת
  choice: déposèrent de l’encens dessus
  rationale: Rend le placement de l’encens sur le feu ou le brasero sans préciser davantage le référent du suffixe féminin singulier.
- source_word: וַיַּקְרִבוּ
  choice: présentèrent
  rationale: Le hiphil de קרב possède ici un sens cultuel de présentation ou d’offrande; « présentèrent » conserve ce registre sans surinterpréter le geste.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: Rend l’expression cultuelle לִפְנֵי et conserve directement le nom divin יהוה.
- source_word: אֵשׁ זָרָה
  choice: un feu non autorisé
  rationale: Dans ce contexte sacerdotal, זָרָה signale ce qui n’est pas admis dans le cadre sacré; la proposition suivante précise que ce feu n’avait pas été commandé.
- source_word: אֲשֶׁר לֹא צִוָּה אֹתָם
  choice: ce qu’il ne leur avait pas ordonné
  rationale: Cette formulation naturelle rattache l’absence d’ordre divin à l’acte qui vient d’être décrit, tout en conservant explicitement « leur ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le Tétragramme; « Yahweh » conserve le nom d’alliance sans le remplacer par un titre.
- issue: Sens de אֵשׁ זָרָה
  choice: un feu non autorisé
  alternative: un feu étranger
  rationale: Le choix principal fait ressortir la transgression cultuelle explicitée par la proposition suivante, tandis que la note conserve le rendu plus formel et son ambiguïté lexicale.
translation_notes:
  register: Français international moderne, narratif et digne. Les verbes restent concrets et la syntaxe distributive (« chacun son brasero ») évite les discordances de nombre. Le terme cultuel « brasero » demeure accessible, et la note préserve le rendu traditionnel de l’expression hébraïque.
