  text: וַ/יִּקְרָ֣א מֹשֶׁ֗ה אֶל מִֽישָׁאֵל֙ וְ/אֶ֣ל אֶלְצָפָ֔ן בְּנֵ֥י עֻזִּיאֵ֖ל דֹּ֣ד אַהֲרֹ֑ן וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם קִ֠רְב֞וּ שְׂא֤וּ אֶת אֲחֵי/כֶם֙ מֵ/אֵ֣ת פְּנֵי הַ/קֹּ֔דֶשׁ אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/004.yaml
  text: Then Moses called Mishael and Elzaphan[a], the sons of Uzziel, Aaron’s uncle, and said to them, “Come near[b]; carry your brothers away from before the sanctuary to outside the camp.”
translation:
  language: fr
  text: 'Moïse appela alors Mishaël et Eltsaphân, les fils d’Ouzziel, oncle d’Aaron, et leur dit : « Approchez. Emportez vos frères[a] de devant le sanctuaire[b], hors du camp. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, « vos frères » peut aussi désigner des parents masculins proches ; il s’agit ici de Nadab et Abihou, qui étaient leurs cousins.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le lieu saint ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: appela
  rationale: Dans ce récit, קרא signifie appeler quelqu’un ou le faire venir. « Appela » est direct, naturel et fidèle.
- source_word: בְּנֵי עֻזִּיאֵל
  choice: les fils d’Ouzziel
  rationale: Le syntagme construit désigne directement Mishaël et Eltsaphân comme les fils d’Ouzziel, et non simplement comme ses descendants.
- source_word: דֹּד אַהֲרֹן
  choice: oncle d’Aaron
  rationale: Dans ce contexte généalogique, דּוֹד désigne naturellement l’oncle. L’apposition se rapporte à Ouzziel.
- source_word: קִרְבוּ
  choice: Approchez
  rationale: L’impératif conserve le mouvement spatial exprimé par קרב et convient au registre solennel du passage.
- source_word: שְׂאוּ
  choice: Emportez
  rationale: נשא signifie lever, porter ou emporter. Ici, il s’agit d’enlever les corps du lieu où ils se trouvent ; « emportez » exprime clairement cette action.
- source_word: אֲחֵיכֶם
  choice: vos frères
  rationale: אָח peut désigner des frères au sens strict ou, plus largement, de proches parents masculins. La traduction conserve le terme de parenté du texte hébreu, tandis qu’une note précise son emploi ici.
- source_word: מֵאֵת פְּנֵי הַקֹּדֶשׁ
  choice: de devant le sanctuaire
  rationale: La formulation garde la valeur spatiale de פְּנֵי (« face, devant, présence ») sans transformer l’expression en simple indication abstraite.
- source_word: הַקֹּדֶשׁ
  choice: le sanctuaire
  rationale: Dans ce contexte, le substantif désigne le lieu ou l’espace sacré. « Sanctuaire » est clair, digne et laisse en note l’autre traduction possible.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: hors du camp
  rationale: Cette tournure française idiomatique exprime le déplacement vers un endroit situé à l’extérieur du camp.
theological_decisions:
- issue: Portée du terme de parenté אֲחֵיכֶם
  choice: vos frères
  alternative: vos proches parents / vos cousins
  rationale: Le texte emploie le mot « frères » dans un sens familial élargi. Le remplacer directement par « cousins » expliciterait le lien réel, mais supprimerait la formulation propre au texte hébreu.
- issue: Référent spatial de הַקֹּדֶשׁ
  choice: le sanctuaire
  alternative: le lieu saint
  rationale: Le contexte indique un espace consacré, mais le terme hébreu permet les deux formulations. « Sanctuaire » convient au contexte sans préciser davantage que le texte.
translation_notes:
  register: Français international moderne, sobre et digne. Les impératifs brefs rendent la gravité de la scène. Les marqueurs de note sont placés immédiatement après les expressions qu’ils éclairent.
