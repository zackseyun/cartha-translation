source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן הוּא֩ אֲשֶׁר דִּבֶּ֨ר יְהוָ֤ה לֵ/אמֹר֙ בִּ/קְרֹבַ֣/י אֶקָּדֵ֔שׁ וְ/עַל פְּנֵ֥י כָל הָ/עָ֖ם אֶכָּבֵ֑ד וַ/יִּדֹּ֖ם אַהֲרֹֽן־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/003.yaml
  text: 'Then Moses said to Aaron[a], “This is what Yahweh spoke, saying: ‘Among those who come near me I will be sanctified[b], and before all the people I will be glorified.’” And Aaron was silent.'
translation:
  language: fr
  text: 'Alors Moïse dit à Aaron : « C’est ce que Yahweh a déclaré : “Par ceux qui s’approchent de moi, je manifesterai ma sainteté[a], et devant tout le peuple, je serai glorifié[b].” » Aaron garda le silence.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Au milieu de ceux qui s’approchent de moi, je serai reconnu comme saint. » L’hébreu peut évoquer soit la manifestation de la sainteté de Dieu, soit le fait qu’il soit reconnu et traité comme saint par ceux qui s’approchent de lui.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « je serai honoré ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin plutôt que de lui substituer un titre.
- source_word: בִּקְרֹבַי
  choice: Par ceux qui s’approchent de moi
  rationale: Rend la préposition בְּ et la portée cultuelle de ceux qui s’approchent de Dieu, sans limiter explicitement le groupe aux prêtres.
- source_word: אֶקָּדֵשׁ
  choice: je manifesterai ma sainteté
  rationale: Exprime naturellement en français la valeur niphal, qui peut désigner la manifestation ou la reconnaissance de la sainteté divine, sans la réduire à une simple exigence humaine.
- source_word: וְעַל פְּנֵי כָל הָעָם
  choice: devant tout le peuple
  rationale: Formulation française idiomatique qui conserve la dimension publique de la déclaration.
- source_word: אֶכָּבֵד
  choice: je serai glorifié
  rationale: Préserve le poids théologique du niphal de כבד ainsi que son parallélisme avec la sainteté.
- source_word: וַיִּדֹּם
  choice: garda le silence
  rationale: Rend avec sobriété la réaction silencieuse et contenue d’Aaron.
theological_decisions:
- issue: La sainteté de Dieu en relation avec ceux qui s’approchent de lui
  choice: Par ceux qui s’approchent de moi, je manifesterai ma sainteté
  alternative: Au milieu de ceux qui s’approchent de moi, je serai reconnu comme saint
  rationale: L’hébreu permet d’entendre à la fois la manifestation de la sainteté de Dieu et sa reconnaissance par ceux qui l’approchent. Le texte principal conserve l’initiative divine, tandis que la note signale l’autre nuance.
- issue: La portée publique de אֶכָּבֵד
  choice: je serai glorifié
  alternative: je serai honoré
  rationale: « Glorifié » conserve la force religieuse de כבד; « honoré » en explicite une nuance lexicale possible.
translation_notes:
  register: Français international moderne, sobre et solennel. La syntaxe reste proche de l’hébreu tout en évitant les tournures archaïques; « déclara » restitue naturellement דִּבֶּר dans ce contexte de citation.
