base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/012.yaml
  text: 'Then Moses spoke to Aaron and to Eleazar and to Ithamar[a], his remaining sons: “Take the grain offering that remains from the food offerings of Yahweh, and eat it unleavened beside the altar, because it is most holy.”'
translation:
  language: fr
  text: 'Puis Moïse dit à Aaron, ainsi qu’à Éléazar et à Itamar, ses fils qui restaient : « Prenez l’offrande de céréales qui reste des offrandes faites par le feu à Yahweh, et mangez-la sans levain à côté de l’autel, car elle est très sainte. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Puis Moïse dit
  rationale: Le waw consécutif fait avancer le récit. « Puis » exprime naturellement la succession narrative sans ajouter de contraste.
- source_word: הַנּוֹתָרִים
  choice: les fils qui lui restaient
  rationale: Le participe désigne Éléazar et Itamar comme les fils d’Aaron encore en vie après la mort de Nadab et Abihou, sans accentuer davantage que l’hébreu l’idée de survie.
- source_word: הַמִּנְחָה
  choice: l’offrande de céréales
  rationale: Dans le vocabulaire sacrificiel du Lévitique, מִנְחָה désigne ici l’offrande végétale ou céréalière, et non une offrande générique.
- source_word: הַנּוֹתֶרֶת
  choice: ce qui reste
  rationale: Cette formulation naturelle renvoie à la part de l’offrande qui demeure après la portion présentée à Yahweh.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: parmi les offrandes consumées pour Yahweh
  rationale: אִשֶּׁה désigne une offrande faite par le feu. « Consumées » conserve cette image cultuelle, tandis que « pour Yahweh » rend clairement le destinataire sans prétendre que toute la part restante a elle-même été brûlée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וְאִכְלֻהָ מַצּוֹת
  choice: et mangez-le sans levain
  rationale: מַצּוֹת indique ici la manière ou la forme sous laquelle l’offrande doit être mangée. « Sans levain » est idiomatique et fidèle.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: à côté de l’autel
  rationale: אֵצֶל marque la proximité; cette expression française reste précise et naturelle.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: une chose très sainte
  rationale: La construction hébraïque exprime le degré suprême de sainteté. « Une chose très sainte » convient à l’offrande et évite la confusion avec le lieu appelé le Saint des saints.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom propre révélé à Israël plutôt que de le remplacer par un titre.
- issue: Portée de קֹדֶשׁ קָדָשִׁים
  choice: une chose très sainte
  alternative: une chose très sacrée
  rationale: L’expression qualifie le statut cultuel de l’offrande au degré le plus élevé; elle ne désigne pas ici l’espace du sanctuaire nommé le Saint des saints.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’adresse solennelle de Moïse et la terminologie sacrificielle, avec une note pour l’expression cultuelle אִשֵּׁי.
