revisions:
- from: 'Puis Moïse dit à Aaron, ainsi qu’à Éléazar et à Itamar, les fils qui lui restaient : « Prenez ce qui reste de l’offrande de céréales parmi les offrandes consumées pour Yahweh[a], et mangez-le sans levain à côté de l’autel, car c’est une chose très sainte. »'
  to: 'Puis Moïse dit à Aaron, ainsi qu’à Éléazar et à Itamar, ses fils qui restaient : « Prenez l’offrande de céréales qui reste des offrandes faites par le feu à Yahweh, et mangez-la sans levain à côté de l’autel, car elle est très sainte. »'
  rationale: La révision conserve la structure et le sens du verset, tout en corrigeant la relation entre la part restante et les offrandes faites par le feu. Elle améliore également la clarté référentielle et l’accord grammatical en français, sans ajouter d’interprétation doctrinale.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:23:41Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : Moïse s’adresse à Aaron, Éléazar et Itamar, ordonne de prendre la part restante de l’offrande de céréales, de la manger sans levain près de l’autel, et en donne le motif cultuel. Toutefois, « parmi les offrandes consumées pour Yahweh » est imprécis : מִן introduit la provenance (« des/parmi les offrandes faites par le feu »), tandis que « consumées » peut laisser entendre que les offrandes visées ont toutes été brûlées, ce qui cadre mal avec la part à manger.'
  naturalness: La phrase est fluide et de registre approprié. « Ses fils qui restaient » est plus direct et moins ambigu que « les fils qui lui restaient ». Employer le féminin avec « l’offrande » (« mangez-la ») évite aussi le détour neutre « ce qui reste / mangez-le ».
  terminology: « Offrande de céréales », « sans levain », « autel » et « Yahweh » sont appropriés. « Offrandes faites par le feu à Yahweh » rend le terme technique אִשֵּׁי sans affirmer que toute l’offrande a été matériellement consumée. « Très sainte » rend naturellement le superlatif cultuel קֹדֶשׁ קָדָשִׁים.
  issues:
  - severity: medium
    issue: « parmi les offrandes consumées pour Yahweh »
    rationale: La formulation rend insuffisamment le rapport de provenance exprimé par מֵ־ et « consumées » peut induire une affirmation matérielle excessive sur les offrandes dont provient la part restante.
  - severity: low
    issue: Accord référentiel de « mangez-le »
    rationale: Le français peut reprendre « ce qui reste », mais une formulation qui conserve « l’offrande » permet le féminin et suit plus directement l’antécédent hébreu.
  revised_text: 'Puis Moïse dit à Aaron, ainsi qu’à Éléazar et à Itamar, ses fils qui restaient : « Prenez l’offrande de céréales qui reste des offrandes faites par le feu à Yahweh, et mangez-la sans levain à côté de l’autel, car elle est très sainte. »'
  revised_footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « des offrandes par le feu de Yahweh ».'
    reason: Alternative lexicale conservant explicitement l’expression cultuelle אִשֵּׁי et son image du feu.
  revision_rationale: La révision conserve la structure et le sens du verset, tout en corrigeant la relation entre la part restante et les offrandes faites par le feu. Elle améliore également la clarté référentielle et l’accord grammatical en français, sans ajouter d’interprétation doctrinale.
