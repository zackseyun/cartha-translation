source:
  edition: WLC
  text: וַ/תֵּ֥צֵא אֵ֛שׁ מִ/לִּ/פְנֵ֥י יְהוָ֖ה וַ/תֹּ֣אכַל אוֹתָ֑/ם וַ/יָּמֻ֖תוּ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/002.yaml
  text: And fire came out from before Yahweh and consumed them[a], and they died before Yahweh.
translation:
  language: fr
  text: Un feu sortit de la présence de Yahweh[a] et les consuma, et ils moururent devant Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de devant Yahweh »; ou : « de la présence de Yahweh ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: sortit
  rationale: Le wayyiqtol de יצא fait progresser le récit par un événement passé; « sortit » conserve le mouvement depuis la présence divine.
- source_word: אֵשׁ
  choice: un feu
  rationale: Le nom désigne ici un feu réel, agent du jugement immédiat.
- source_word: מִלִּפְנֵי יְהוָה
  choice: de devant Yahweh
  rationale: Cette formulation conserve l’image hébraïque de ce qui vient de devant la face ou la présence de Yahweh, sans réduire le sens à une simple origine spatiale.
- source_word: וַתֹּאכַל
  choice: les consuma
  rationale: אכל signifie littéralement « manger », mais avec le feu pour sujet, « consumer » exprime naturellement en français son action destructrice.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom objet renvoie à Nadab et Abihou dans le contexte immédiat.
- source_word: וַיָּמֻתוּ
  choice: ils moururent
  rationale: Le verbe מות est actif et intransitif. Cette traduction énonce le résultat sans le reformuler en passif causatif.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: La traduction garde la répétition solennelle du motif de la présence divine.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Valeur de וַיָּמֻתוּ
  choice: ils moururent
  alternative: ils furent tués
  rationale: L’hébreu emploie un verbe actif intransitif, tandis que la proposition précédente indique déjà la cause de leur mort.
- issue: Sens spatial et relationnel de לִפְנֵי
  choice: devant
  alternative: en présence de
  rationale: « Devant » maintient l’expression concrète de l’hébreu ainsi que sa portée théologique, tout en laissant ouverte la nuance de présence.
translation_notes:
  register: Français moderne, sobre et solennel. Le passé simple convient au récit écrit. La répétition de « Yahweh » et de « devant » est conservée intentionnellement pour refléter la structure hébraïque.
