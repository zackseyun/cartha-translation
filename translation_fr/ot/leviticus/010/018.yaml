  text: הֵ֚ן לֹא הוּבָ֣א אֶת דָּמָ֔/הּ אֶל הַ/קֹּ֖דֶשׁ פְּנִ֑ימָה אָכ֨וֹל תֹּאכְל֥וּ אֹתָ֛/הּ בַּ/קֹּ֖דֶשׁ כַּ/אֲשֶׁ֥ר צִוֵּֽיתִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/018.yaml
  text: Look, its blood was not brought into the sanctuary, inside. You certainly should have eaten it in the holy place, as I commanded.
translation:
  language: fr
  text: 'Voyez : son sang n’a pas été apporté à l’intérieur du sanctuaire[a]. Vous auriez absolument dû la manger dans le lieu saint[b], comme je l’avais ordonné.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le lieu saint, vers l’intérieur ». L’hébreu associe le terme désignant l’espace sacré à un mot qui souligne le mouvement vers l’intérieur.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « manger, vous mangerez » ; l’hébreu répète la racine du verbe « manger » pour renforcer l’ordre. Dans ce contexte de reproche, cela signifie : « vous auriez absolument dû la manger ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Voyez
  rationale: La particule attire avec insistance l’attention sur le fait invoqué par Moïse. « Voyez » est actuel et digne, sans l’archaïsme de « voici » dans cet emploi.
- source_word: הוּבָא
  choice: n’a pas été apporté
  rationale: Le hofal de בוא exprime ici le fait passif que le sang n’a pas été introduit dans l’espace sacré.
- source_word: דָּמָהּ
  choice: son sang
  rationale: Le suffixe féminin singulier renvoie à la victime ou à l’offrande mentionnée dans le contexte ; le possessif français rend naturellement ce rapport.
- source_word: אֶל־הַקֹּדֶשׁ פְּנִימָה
  choice: à l’intérieur du sanctuaire
  rationale: Cette formulation exprime à la fois le mouvement vers l’espace sacré et la valeur directionnelle de פְּנִימָה, tout en restant naturelle en français.
- source_word: אָכוֹל תֹּאכְלוּ
  choice: vous auriez absolument dû la manger
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’action. Dans cette réprimande portant sur une action omise, « auriez absolument dû » communique à la fois l’obligation et l’insistance.
- source_word: בַּקֹּדֶשׁ
  choice: dans le lieu saint
  rationale: L’expression désigne le lieu consacré où les prêtres devaient manger l’offrande. « Lieu saint » conserve le vocabulaire cultuel sans l’identifier automatiquement à l’espace intérieur évoqué auparavant.
- source_word: כַּאֲשֶׁר צִוֵּיתִי
  choice: comme je l’avais ordonné
  rationale: Le plus-que-parfait situe naturellement en français l’ordre antérieur à l’omission que Moïse reproche.
theological_decisions:
- issue: Terminologie des espaces sacrés
  choice: Distinguer « à l’intérieur du sanctuaire » de « dans le lieu saint »
  alternative: Employer « dans le lieu saint » pour les deux expressions, ou préciser « derrière le voile » pour la première
  rationale: La première expression comporte פְּנִימָה et marque l’introduction du sang vers l’intérieur de l’espace sacré, tandis que la seconde indique le lieu consacré où l’offrande devait être mangée. La distinction préserve la logique rituelle sans ajouter la mention du voile, absente du verset.
- issue: Genre du pronom désignant l’offrande
  choice: Employer « la »
  alternative: Expliciter « l’offrande » ou employer un tour sans pronom genré
  rationale: Le pronom hébreu est féminin singulier et renvoie dans le contexte à l’offrande pour le péché ou à la victime. Le féminin français maintient ce renvoi sans alourdir le texte.
translation_notes:
  register: Français international moderne, clair et digne. « Voyez » introduit la réprimande avec vigueur ; « auriez absolument dû » rend l’obligation passée et la construction hébraïque intensive. La ponctuation sépare nettement le fait rituel de l’obligation qui en découle.
