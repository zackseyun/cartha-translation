  verdict: revise
  source_fidelity: Le sens général est bien rendu, mais « sur les sacrifices » ne rend pas correctement מִן (« provenant de / tirés des »). Les désignations rituelles « poitrine présentée » et « cuisse prélevée » sont aussi un peu trop elliptiques et ne reflètent pas aussi clairement les deux constructions hébraïques.
  naturalness: La juxtaposition « Vous mangerez …, toi, tes fils et tes filles avec toi » est maladroite en français, notamment par l’alternance de « vous » et « toi » après coup. Placer le groupe des bénéficiaires en tête produit une phrase naturelle tout en gardant l’insistance du texte.
  terminology: « Offrande agitée » et « prélèvement » sont des termes cultuels français établis et transparents grâce aux notes. « Sacrifices de paix » conserve utilement l’ouverture sémantique de שְׁלָמִים. « Part attribuée » rend bien le dû sacerdotal.
  issues:
  - severity: medium
    issue: « sur les sacrifices de paix »
    rationale: 'La préposition מִן introduit la provenance : ces parts sont données à partir, ou tirées, des sacrifices. « Sur » suggère plutôt une base ou une imputation et ne rend pas cette relation.'
  - severity: medium
    issue: Ordre et accord de « Vous mangerez …, toi, tes fils et tes filles avec toi »
    rationale: La formulation est grammaticalement compréhensible, mais stylistiquement heurtée en français moderne. Le déplacement du sujet explicite avant le verbe conserve le sens sans cette rupture.
  - severity: low
    issue: « poitrine présentée » et « cuisse prélevée »
    rationale: Ces participes seuls peuvent décrire les morceaux plutôt que nommer les catégories rituelles. « Poitrine de l’offrande agitée » et « cuisse du prélèvement » rendent plus explicitement les relations constructes de l’hébreu.
