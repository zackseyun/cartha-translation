source:
  edition: WLC
  text: וְ/אֵת֩ חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה תֹּֽאכְלוּ֙ בְּ/מָק֣וֹם טָה֔וֹר אַתָּ֕ה וּ/בָנֶ֥י/ךָ וּ/בְנֹתֶ֖י/ךָ אִתָּ֑/ךְ כִּֽי חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ נִתְּנ֔וּ מִ/זִּבְחֵ֥י שַׁלְמֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/014.yaml
  text: And you[a], and your sons and your daughters with you, shall eat the breast of the wave offering and the thigh of the contribution in a clean place[c][b], because they have been given as your portion and your sons’ portion from the sacrifices of the peace offerings of the sons of Israel.
translation:
  language: fr
  text: Toi, tes fils et tes filles avec toi, vous mangerez, dans un lieu pur, la poitrine de l’offrande agitée[a] et la cuisse du prélèvement[b], car elles vous ont été données comme ta part et celle de tes fils, provenant des sacrifices de paix[c] des fils d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la poitrine de l’offrande de présentation ». Le terme hébreu désigne la portion rituellement agitée ou présentée devant le SEIGNEUR.
    reason: lexical_alternative
  - marker: b
    text: Ou « la cuisse de la contribution ». Le terme hébreu désigne ce qui est élevé ou mis à part comme part sacerdotale.
    reason: lexical_alternative
  - marker: c
    text: On peut aussi traduire par « sacrifices de communion » ; le terme hébreu peut évoquer plus largement la paix, l’intégrité ou le bien-être.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: la poitrine présentée
  rationale: חֲזֶה désigne la poitrine de l’animal, et תְּנוּפָה sa présentation rituelle devant le SEIGNEUR, traditionnellement associée à un geste d’agitation. « Présentée » reste naturel en français tout en exprimant la fonction cultuelle.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: la cuisse prélevée
  rationale: שׁוֹק désigne ici la cuisse ou la partie supérieure de la patte. תְּרוּמָה est ce qui est retiré, élevé ou mis à part comme contribution sacerdotale ; « prélevée » rend clairement cette mise à part.
- source_word: תֹּאכְלוּ
  choice: vous mangerez
  rationale: L’imparfait hébreu a ici une valeur prescriptive. Le futur français convient au registre des instructions légales sans durcir inutilement la formulation.
- source_word: בְּמָקוֹם טָהוֹר
  choice: dans un lieu pur
  rationale: טָהוֹר renvoie, dans ce contexte lévitique, à la pureté rituelle. « Lieu pur » conserve cette terminologie sans ajouter une explication absente du texte.
- source_word: אַתָּה וּבָנֶיךָ וּבְנֹתֶיךָ אִתָּךְ
  choice: toi, tes fils et tes filles avec toi
  rationale: La formulation conserve les fils, les filles et l’expression « avec toi » explicitement présents dans l’hébreu. Placée après les objets, elle demeure naturelle malgré le passage du pluriel « vous » au groupe explicatif.
- source_word: חָקְךָ וְחָק בָּנֶיךָ
  choice: comme part à toi et à tes fils
  rationale: חֹק désigne ici la part prescrite ou attribuée aux prêtres, plutôt qu’une loi abstraite. « Part » transmet clairement cette attribution.
- source_word: נִתְּנוּ
  choice: ont été données
  rationale: Le parfait passif exprime l’attribution établie de ces portions. Le passé composé français rend naturellement cette action dont le résultat demeure valable.
- source_word: מִזִּבְחֵי שַׁלְמֵי
  choice: sur les sacrifices de paix
  rationale: שְׁלָמִים appartient au champ de la paix, de l’intégrité et du bien-être. « Sacrifices de paix » préserve cette largeur sémantique mieux que l’interprétation plus étroite « sacrifices de communion ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette expression filiale collective est rendue formellement, tout en étant une désignation conventionnelle du peuple d’Israël.
theological_decisions:
- issue: Portée de שְׁלָמִים
  choice: sacrifices de paix
  alternative: sacrifices de communion
  rationale: « Paix » garde le champ sémantique ouvert à la paix, à l’intégrité et au bien-être, tandis que « communion » privilégierait une interprétation relationnelle particulière.
- issue: Désignation collective בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: Israélites
  rationale: Le choix conserve la forme filiale masculine du texte source sans nier son emploi collectif pour le peuple.
- issue: Nature de la part sacerdotale חֹק
  choice: part attribuée
  alternative: prescription
  rationale: Dans ce contexte, le mot désigne concrètement ce qui revient à Aaron et à ses fils ; le rendre par « prescription » déplacerait l’accent vers la règle plutôt que vers la portion reçue.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’insistance hébraïque sur Aaron, ses fils et ses filles, tout en employant un vocabulaire cultuel compréhensible. Les termes techniques dont le sens reste discuté sont explicités en notes plutôt que résolus de manière confessionnelle.
