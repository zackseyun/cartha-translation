source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֤ם אֹתָ/הּ֙ בְּ/מָק֣וֹם קָדֹ֔שׁ כִּ֣י חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ הִ֔וא מֵ/אִשֵּׁ֖י יְהוָ֑ה כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/013.yaml
  text: You shall eat it in a holy place[a], because it is your portion and the portion of your sons from the food offerings of Yahweh, for so I have been commanded.
translation:
  language: fr
  text: Vous la mangerez dans un lieu saint, car c’est ta part et celle de tes fils, provenant des offrandes faites par le feu à Yahweh[a] ; car c’est ainsi qu’il m’a été ordonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des offrandes alimentaires de Yahweh ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: Vous la mangerez
  rationale: Le verbe s’adresse à plusieurs personnes et exprime ici une instruction contraignante. Le futur français convient naturellement au style prescriptif.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: dans un lieu saint
  rationale: L’absence d’article en hébreu favorise l’indéfini. « Saint » conserve le registre cultuel sans identifier un emplacement plus précis que le texte.
- source_word: חָקְךָ וְחָק בָּנֶיךָ
  choice: la part qui te revient, à toi et à tes fils
  rationale: Dans ce contexte sacerdotal, חֹק désigne la part attribuée aux prêtres. Le singulier « te » et « tes fils » reproduit le passage de l’adresse plurielle à l’adresse personnelle faite à Aaron.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: sur les offrandes faites par le feu à Yahweh
  rationale: Cette formulation conserve le lien cultuel du terme אִשֶּׁה avec le feu, tout en restant compréhensible en français actuel. « Sur » exprime que la part sacerdotale provient de cette catégorie d’offrandes.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: C’est en effet l’ordre que j’ai reçu
  rationale: Cette tournure française naturelle conserve l’idée du commandement reçu par Moïse et la valeur explicative de כִּי.
theological_decisions:
- issue: Sens sacerdotal de חֹק
  choice: la part qui te revient
  alternative: ton dû ; ce qui t’est attribué par prescription
  rationale: Le contexte porte sur la portion concrète réservée à Aaron et à ses fils, non sur une loi envisagée abstraitement.
- issue: Portée de אִשֵּׁי יְהוָה
  choice: offrandes faites par le feu à Yahweh
  alternative: offrandes alimentaires de Yahweh
  rationale: Le choix principal garde l’association explicite avec le feu traditionnellement portée par le terme, tandis que la note signale son emploi plus large possible dans le vocabulaire sacrificiel.
- issue: Alternance entre adresse plurielle et suffixes singuliers
  choice: « Vous » puis « te… tes fils »
  alternative: uniformiser au pluriel
  rationale: 'L’alternance du texte hébreu est significative : le groupe doit manger l’offrande, mais la part est attribuée à Aaron et à ses fils. L’uniformiser effacerait cette nuance.'
translation_notes:
  register: Français international moderne, digne et direct. Le futur garde la force prescriptive sans archaïsme. L’alternance entre « vous » et « te » est volontaire et reflète précisément les formes hébraïques.
