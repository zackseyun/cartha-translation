revisions:
- from: Vous la mangerez dans un lieu saint, car elle est la part qui te revient, à toi et à tes fils, sur les offrandes faites par le feu[a] à Yahweh. C’est en effet l’ordre que j’ai reçu.
  to: Vous la mangerez dans un lieu saint, car c’est ta part et celle de tes fils, provenant des offrandes faites par le feu à Yahweh[a] ; car c’est ainsi qu’il m’a été ordonné.
  rationale: Les corrections rétablissent le sens de provenance de מן, conservent la distinction entre la part d’Aaron et celle de ses fils, et rendent plus directement le passif final. La note maintient l’alternative lexicale attestée pour אִשֵּׁי sans supprimer le sens traditionnel « offrandes faites par le feu ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:24:01Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement l’injonction, le « lieu saint », l’adresse à Aaron et à ses fils, ainsi que le nom Yahweh. Toutefois, « sur les offrandes » ne rend pas le מן (« provenant de / parmi »), et la dernière phrase explicite « ordre » là où l’hébreu emploie le passif « il m’a été ordonné ».
  naturalness: Le français est globalement naturel et de registre approprié. « Ta part et celle de tes fils » est plus direct et plus fidèle à la double expression hébraïque que « la part qui te revient, à toi et à tes fils ».
  terminology: « Offrandes faites par le feu à Yahweh » est une traduction recevable de מֵאִשֵּׁי יְהוָה. La note doit présenter « offrandes alimentaires » comme une possibilité terminologique, sans prétendre que le terme désigne simplement ou nécessairement une catégorie plus large.
  issues:
  - severity: medium
    issue: « sur les offrandes faites par le feu »
    rationale: La préposition מן indique la provenance ou l’origine de la part sacerdotale (« provenant des / parmi les offrandes »), non une relation de surplomb ou de base exprimée naturellement par « sur ».
  - severity: low
    issue: « la part qui te revient, à toi et à tes fils »
    rationale: Le texte distingue « ta part » et « la part de tes fils ». La formulation proposée peut les fondre en une seule part commune; « ta part et celle de tes fils » préserve mieux le parallélisme.
  - severity: low
    issue: « C’est en effet l’ordre que j’ai reçu »
    rationale: L’hébreu dit littéralement « car ainsi il m’a été ordonné ». « L’ordre que j’ai reçu » est compréhensible, mais ajoute un nom absent du texte et affaiblit la forme passive.
  revised_text: Vous la mangerez dans un lieu saint, car c’est ta part et celle de tes fils, provenant des offrandes faites par le feu à Yahweh[a] ; car c’est ainsi qu’il m’a été ordonné.
  revised_footnotes:
  - marker: a
    text: 'Ou : « des offrandes alimentaires de Yahweh ».'
    reason: lexical_alternative
  revision_rationale: Les corrections rétablissent le sens de provenance de מן, conservent la distinction entre la part d’Aaron et celle de ses fils, et rendent plus directement le passif final. La note maintient l’alternative lexicale attestée pour אִשֵּׁי sans supprimer le sens traditionnel « offrandes faites par le feu ».
