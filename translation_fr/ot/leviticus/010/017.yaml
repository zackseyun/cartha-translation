  text: מַדּ֗וּעַ לֹֽא אֲכַלְתֶּ֤ם אֶת הַֽ/חַטָּאת֙ בִּ/מְק֣וֹם הַ/קֹּ֔דֶשׁ כִּ֛י קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִ֑וא וְ/אֹתָ֣/הּ נָתַ֣ן לָ/כֶ֗ם לָ/שֵׂאת֙ אֶת עֲוֺ֣ן הָ/עֵדָ֔ה לְ/כַפֵּ֥ר עֲלֵי/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/017.yaml
  text: Why did you not eat the sin offering in the holy place? For it is most holy[a], and he has given it to you to bear the iniquity of the congregation, to make atonement for them before Yahweh.
translation:
  language: fr
  text: Pourquoi n’avez-vous pas mangé le sacrifice pour le péché[a] dans le lieu saint ? Car c’est une chose très sainte, et il vous l’a donné pour que vous portiez la faute de la communauté et fassiez l’expiation pour eux devant Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification ». Le terme hébreu חַטָּאת peut désigner le sacrifice associé à l’élimination de l’impureté aussi bien qu’au traitement du péché.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ לֹא אֲכַלְתֶּם
  choice: Pourquoi n’avez-vous pas mangé
  rationale: Rend directement l’interrogation de reproche et l’accompli hébreu dans un français naturel.
- source_word: הַחַטָּאת
  choice: le sacrifice pour le péché
  rationale: Dans ce contexte, le terme désigne clairement l’offrande sacrificielle; cette formulation reste accessible tout en conservant son rapport au péché. L’autre valeur cultuelle, « sacrifice de purification », est signalée en note.
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: dans le lieu saint
  rationale: Désigne l’espace sacré prévu pour la consommation de cette offrande par les prêtres.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: très saint
  rationale: Rend la construction superlative hébraïque sans la confondre avec le Très-Saint comme partie du sanctuaire.
- source_word: וְאֹתָהּ נָתַן לָכֶם
  choice: et il vous l’a donné
  rationale: Conserve le sujet masculin singulier implicite, qui renvoie naturellement à Dieu dans le contexte, et reprend explicitement le sacrifice par le pronom « l’ ».
- source_word: לָשֵׂאת אֶת עֲוֺן הָעֵדָה
  choice: pour que vous portiez la faute de la communauté
  rationale: « Porter la faute » maintient l’expression cultuelle et représentative de נשא עון sans préciser indûment s’il s’agit de culpabilité, d’iniquité ou de peine.
- source_word: לְכַפֵּר עֲלֵיהֶם
  choice: fassiez l’expiation pour elle
  rationale: « Faire l’expiation » est une expression cultuelle établie qui préserve la portée de כפר sans en imposer une théorie particulière.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » exprime la présence cultuelle, et « Yahweh » représente directement le nom divin יהוה.
theological_decisions:
- issue: Sens cultuel de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le référent sacrificiel est certain, mais le nom hébreu peut mettre en jeu aussi bien le péché que la purification; l’alternative est donc conservée en note.
- issue: Sujet implicite de נָתַן
  choice: il vous l’a donné
  alternative: il vous a été donné
  rationale: Le verbe hébreu est actif à la troisième personne du masculin singulier; le contexte permet de comprendre Dieu comme sujet sans devoir l’expliciter par un nom ajouté.
- issue: Portée de נשא עון
  choice: porter la faute
  alternative: porter l’iniquité / porter la culpabilité
  rationale: La formulation choisie conserve la tension entre faute objective, culpabilité et responsabilité cultuelle, sans définir le mécanisme de la médiation sacerdotale.
- issue: Référent pronominal de עֲלֵיהֶם
  choice: pour elle, c’est-à-dire la communauté
  alternative: pour eux, c’est-à-dire ses membres
  rationale: Le français reprend naturellement le nom collectif singulier « communauté », tandis que l’hébreu passe au pluriel pour viser les personnes qui la composent.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le ton vif du reproche de Moïse. « Très saint » évite l’ambiguïté spatiale de « saint des saints », et « communauté » rend naturellement le collectif désignant Israël.
