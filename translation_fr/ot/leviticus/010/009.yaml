id: LEV.10.9
reference: Leviticus 10:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יַ֣יִן וְ/שֵׁכָ֞ר אַל תֵּ֣שְׁתְּ אַתָּ֣ה וּ/בָנֶ֣י/ךָ אִתָּ֗/ךְ בְּ/בֹאֲ/כֶ֛ם אֶל אֹ֥הֶל מוֹעֵ֖ד וְ/לֹ֣א תָמֻ֑תוּ חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתֵי/כֶֽם־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/009.yaml
  text: You and your sons with you shall not drink wine or strong drink when you enter the tent of meeting[a], lest you die[c][b]. It is a permanent statute throughout your generations.
translation:
  language: fr
  text: Toi et tes fils avec toi, vous ne boirez ni vin ni boisson enivrante[a] lorsque vous entrerez dans la tente de la rencontre, afin que vous ne mouriez pas[b]. C’est une prescription permanente[c], de génération en génération.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne largement une boisson alcoolisée autre que le vin.
    reason: Précision lexicale sur שֵׁכָר, que « boisson forte » risquerait de restreindre aux alcools distillés.
  - marker: b
    text: 'Littéralement : « et vous ne mourrez pas »; on peut aussi comprendre : « de peur que vous ne mouriez ».'
    reason: Préserve l’ambiguïté entre coordination formelle et nuance de conséquence à éviter.
  - marker: c
    text: 'Ou : « une prescription perpétuelle ».'
    reason: Signale une autre traduction possible de חֻקַּת עוֹלָם.
lexical_decisions:
- source_word: יַיִן
  choice: vin
  rationale: Terme hébreu courant désignant le vin issu du raisin fermenté.
- source_word: שֵׁכָר
  choice: boisson enivrante
  rationale: Le terme désigne une boisson alcoolisée autre que le vin. « Boisson forte » pourrait évoquer à tort les spiritueux modernes, tandis que « boisson enivrante » conserve la portée générale du terme.
- source_word: אַל תֵּשְׁתְּ
  choice: vous ne boirez pas
  rationale: אַל suivi de l’imparfait exprime ici une interdiction. Le futur à valeur injonctive convient au registre juridique français.
- source_word: אַתָּה וּבָנֶיךָ אִתָּךְ
  choice: Toi et tes fils avec toi
  rationale: Conserve l’adresse explicite à Aaron ainsi que אִתָּךְ, qui souligne que ses fils sont concernés avec lui.
- source_word: בְּבֹאֲכֶם
  choice: lorsque vous entrerez
  rationale: Le ב préfixé à l’infinitif construit marque la circonstance temporelle de l’entrée.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Rend le nom cultuel hébreu de manière transparente et conforme à l’usage biblique français.
- source_word: וְלֹא תָמֻתוּ
  choice: afin que vous ne mouriez pas
  rationale: Dans la suite de l’interdiction, la proposition exprime naturellement le résultat fatal à éviter, sans effacer la possibilité d’une lecture plus littérale coordonnée.
- source_word: חֻקַּת עוֹלָם
  choice: une prescription permanente
  rationale: La formule juridique désigne une règle durable; « permanente » est clair en français moderne sans coloration archaïque.
- source_word: לְדֹרֹתֵיכֶם
  choice: de génération en génération
  rationale: Expression française naturelle indiquant l’application continue de la prescription aux générations successives.
theological_decisions:
- issue: Portée de l’interdiction
  choice: L’interdiction est liée au moment où Aaron et ses fils entrent dans la tente de la rencontre.
  alternative: Comprendre le verset comme imposant aux prêtres une abstinence totale en toute circonstance.
  rationale: La proposition temporelle בְּבֹאֲכֶם אֶל אֹהֶל מוֹעֵד limite explicitement la situation visée; la traduction n’élargit donc pas la règle au-delà du texte.
- issue: Valeur de la proposition relative à la mort
  choice: « afin que vous ne mouriez pas »
  alternative: « et vous ne mourrez pas » ou « sous peine de mort »
  rationale: La formulation retenue exprime le danger mortel que l’obéissance doit éviter. La note maintient visible la coordination plus littérale, sans transformer la phrase en formule pénale plus explicite que l’hébreu.
- issue: Durée de la prescription
  choice: « permanente »
  alternative: « perpétuelle »
  rationale: עוֹלָם exprime ici une durée indéfinie et continue à travers les générations. « Permanente » en rend la force juridique sans trancher des débats théologiques extérieurs au verset.
translation_notes:
  register: Français international moderne, digne et accessible. La structure « Toi et tes fils avec toi, vous… » conserve l’insistance de l’hébreu tout en restant intelligible. Le vocabulaire juridique demeure clair sans archaïsmes; les notes rendent visibles les principales possibilités lexicales et syntaxiques.
