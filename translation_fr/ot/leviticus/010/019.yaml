  text: וַ/יְדַבֵּ֨ר אַהֲרֹ֜ן אֶל מֹשֶׁ֗ה הֵ֣ן הַ֠/יּוֹם הִקְרִ֨יבוּ אֶת חַטָּאתָ֤/ם וְ/אֶת עֹֽלָתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/תִּקְרֶ֥אנָה אֹתִ֖/י כָּ/אֵ֑לֶּה וְ/אָכַ֤לְתִּי חַטָּאת֙ הַ/יּ֔וֹם הַ/יִּיטַ֖ב בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/019.yaml
  text: And Aaron said to Moses[a], “Look, today they presented their sin offering and their burnt offering before Yahweh, and things like these have happened to me. If I had eaten the sin offering today[c][b], would it have been good in the sight of Yahweh?”
translation:
  language: fr
  text: 'Aaron dit à Moïse : « Vois : aujourd’hui, ils ont présenté devant Yahweh leur sacrifice pour le péché[a] et leur holocauste, et de telles choses me sont arrivées[b]. Si j’avais mangé aujourd’hui le sacrifice pour le péché, cela aurait-il été bon aux yeux de Yahweh[c] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur sacrifice de purification » ; de même pour la seconde occurrence. Le terme hébreu peut désigner le sacrifice associé à la purification du péché ou de l’impureté.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et des choses telles que celles-ci me sont arrivées ». L’expression renvoie vraisemblablement aux événements tragiques de cette journée, en particulier à la mort des fils d’Aaron, sans préciser l’enjeu exact de la question.'
    reason: cultural_note
  - marker: c
    text: Ou « cela aurait-il plu à Yahweh ? »
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Vois
  rationale: La particule attire l’attention sur l’explication d’Aaron. « Vois » conserve cette force dans un registre digne sans recourir à l’archaïsme « Voici » employé comme simple interjection.
- source_word: הִקְרִיבוּ
  choice: ont présenté
  rationale: 'Le hiphil de קרב a ici son sens sacrificiel : faire approcher, présenter une offrande. « Présenter » convient au contexte cultuel.'
- source_word: חַטָּאתָם / חַטָּאת
  choice: leur sacrifice pour le péché / le sacrifice pour le péché
  rationale: Dans ce contexte lévitique, חַטָּאת désigne le sacrifice et non le péché abstrait. Cette formulation française est claire et laisse en note l’autre analyse courante, « sacrifice de purification ».
- source_word: עֹלָתָם
  choice: leur holocauste
  rationale: « Holocauste » est le terme français conventionnel pour l’offrande entièrement brûlée désignée par עֹלָה.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: Rend directement l’expression cultuelle indiquant la présence de Yahweh.
- source_word: וַתִּקְרֶאנָה אֹתִי כָּאֵלֶּה
  choice: de tels malheurs me sont arrivés
  rationale: L’expression renvoie aux événements tragiques de la journée, notamment à la mort des fils d’Aaron. « Malheurs » explicite naturellement la valeur négative donnée par le contexte sans préciser davantage leur portée rituelle.
- source_word: וְאָכַלְתִּי
  choice: Si j’avais mangé
  rationale: Le parfait précédé de waw prend dans la question rhétorique une valeur conditionnelle contrefactuelle, naturellement rendue ainsi en français.
- source_word: הַיִּיטַב בְּעֵינֵי יְהוָה
  choice: cela aurait-il été bon aux yeux de Yahweh
  rationale: Cette formulation préserve l’image hébraïque et la question portant sur l’approbation divine, sans la réduire à la seule idée de plaisir.
theological_decisions:
- issue: Nature de la défense d’Aaron pour ne pas avoir mangé le sacrifice
  choice: Aaron demande si, après les malheurs qui l’ont frappé ce jour-là, manger le sacrifice aurait été bon aux yeux de Yahweh.
  alternative: Aaron pourrait parler soit de son deuil personnel, soit de son aptitude rituelle à consommer le sacrifice.
  rationale: L’hébreu lie la question rhétorique aux événements tragiques sans indiquer précisément si l’obstacle est le deuil, un état cérémoniel ou une convenance plus générale. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’argumentation hébraïque, tandis que « de tels malheurs » rend son sens contextuel en français naturel. Le nom divin est translittéré « Yahweh » conformément au dossier fourni.
