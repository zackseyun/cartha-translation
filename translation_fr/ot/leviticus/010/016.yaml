source:
  edition: WLC
  text: וְ/אֵ֣ת שְׂעִ֣יר הַֽ/חַטָּ֗את דָּרֹ֥שׁ דָּרַ֛שׁ מֹשֶׁ֖ה וְ/הִנֵּ֣ה שֹׂרָ֑ף וַ֠/יִּקְצֹף עַל אֶלְעָזָ֤ר וְ/עַל אִֽיתָמָר֙ בְּנֵ֣י אַהֲרֹ֔ן הַ/נּוֹתָרִ֖ם לֵ/אמֹֽר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/016.yaml
  text: Moses diligently searched for the goat of the sin offering[a], and behold, it had been burned up. So he was angry with Eleazar and with Ithamar, Aaron’s remaining sons, saying[c][b],
translation:
  language: fr
  text: 'Moïse rechercha avec soin le bouc du sacrifice pour le péché[a], et voici qu’il avait été brûlé[b]. Il se mit alors en colère contre Éléazar et Itamar, les fils d’Aaron qui restaient[c], et leur dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chercha et chercha le bouc du sacrifice pour le péché ». L’hébreu renforce le verbe « rechercher » au moyen d’un infinitif absolu.
    reason: lexical_alternative
  - marker: b
    text: Ou « avait été entièrement brûlé ». L’hébreu présente le bouc dans l’état où il fut découvert, après avoir été brûlé.
    reason: lexical_alternative
  - marker: c
    text: Les « fils d’Aaron qui restaient » sont Éléazar et Itamar, après la mort de Nadab et Abihou (Lévitique 10.1-2, 12).
    reason: cross_reference
lexical_decisions:
- source_word: שְׂעִיר הַחַטָּאת
  choice: le bouc du sacrifice pour le péché
  rationale: שְׂעִיר désigne ici un bouc, et הַחַטָּאת la catégorie sacrificielle du sacrifice pour le péché. Cette formulation reste claire et naturelle sans réduire l’expression à un terme technique opaque.
- source_word: דָּרֹשׁ דָּרַשׁ
  choice: rechercha avec soin
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’action. « Avec soin » restitue cette insistance dans un français naturel.
- source_word: וְהִנֵּה
  choice: et voici que
  rationale: הִנֵּה attire soudainement l’attention sur ce que Moïse découvre. « Et voici que » conserve cette fonction narrative dans un registre digne.
- source_word: שֹׂרָף
  choice: avait été brûlé
  rationale: Le participe passif décrit l’état dans lequel le bouc fut découvert. Le plus-que-parfait exprime naturellement en français que l’acte de brûler avait précédé la découverte, sans imposer dans le texte principal l’idée qu’il avait nécessairement été entièrement consumé.
- source_word: וַיִּקְצֹף
  choice: il se mit alors en colère
  rationale: Le verbe exprime la colère. Cette traduction rend la progression narrative sans exagérer son intensité.
- source_word: הַנּוֹתָרִם
  choice: qui restaient
  rationale: Le participe désigne Éléazar et Itamar comme les fils encore présents après la mort de Nadab et Abihou. La formulation reste proche du texte et évite de préciser davantage que l’hébreu.
- source_word: לֵאמֹר
  choice: 'et leur dit :'
  rationale: Devant les paroles directes du verset suivant, cette tournure est plus naturelle en français que le calque « disant », tout en conservant la fonction d’introduction du discours.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’effet de découverte de וְהִנֵּה, rend idiomatiquement l’intensification hébraïque et introduit naturellement la parole qui suit au verset suivant.
