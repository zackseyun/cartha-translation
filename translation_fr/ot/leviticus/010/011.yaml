id: LEV.10.11
reference: Leviticus 10:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/לְ/הוֹרֹ֖ת אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֚ת כָּל הַ֣/חֻקִּ֔ים אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֲלֵי/הֶ֖ם בְּ/יַד מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/011.yaml
  text: and to teach the sons of Israel all the statutes that Yahweh has spoken to them by the hand of Moses[a].
translation:
  language: fr
  text: et enseigner aux fils d’Israël toutes les prescriptions que Yahweh leur a communiquées par la main de Moïse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'C’est-à-dire : « par l’intermédiaire de Moïse ».'
    reason: Explication de l’idiome hébreu littéralement rendu « par la main de Moïse ».
lexical_decisions:
- source_word: וּ/לְ/הוֹרֹת
  choice: et enseigner
  rationale: La conjonction, la préposition et l’infinitif causatif poursuivent l’énumération des devoirs sacerdotaux du verset précédent. « Enseigner » est naturel et rend clairement le sens de transmission autorisée.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: Cette formulation conserve l’expression familiale et collective de l’hébreu, בְּנֵי signifiant littéralement « fils de ». Dans le contexte, elle désigne le peuple de l’alliance dans son ensemble.
- source_word: כָּל הַחֻקִּים
  choice: toutes les prescriptions
  rationale: חֻקִּים désigne ici les règles établies par autorité divine. « Prescriptions » est précis, actuel et intelligible dans un contexte juridique et cultuel.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֲלֵיהֶם
  choice: que Yahweh leur a communiquées
  rationale: Le verbe דבר signifie fondamentalement « parler »; avec des prescriptions pour complément implicite, « communiquer » produit un français naturel tout en maintenant l’idée d’une parole divine adressée au peuple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de conserver le nom personnel présent dans le texte hébreu.
- source_word: בְּיַד מֹשֶׁה
  choice: par la main de Moïse
  rationale: La traduction conserve l’image hébraïque de la « main » comme moyen ou agent de transmission. La note en explicite le sens médiateur.
theological_decisions:
- issue: Rendu du nom de l’alliance יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre sans lui substituer un titre.
- issue: Portée de l’expression masculine collective בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les enfants d’Israël; les Israélites
  rationale: « Les fils d’Israël » reflète directement la forme hébraïque et sa métaphore familiale. L’expression fonctionne ici collectivement pour le peuple, sans limiter le commandement aux seuls hommes.
- issue: Médiation de Moïse dans בְּיַד מֹשֶׁה
  choice: par la main de Moïse
  alternative: par l’intermédiaire de Moïse
  rationale: Le texte présente Moïse comme l’agent médiateur de la parole divine. L’expression imagée est maintenue dans le texte et expliquée en note, sans préciser davantage la nature théologique de cette médiation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe infinitive conserve le lien avec le verset précédent. Le vocabulaire juridique reste clair sans devenir archaïque, tandis que l’idiome final préserve la texture hébraïque.
