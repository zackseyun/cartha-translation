  variant: modern international French
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/008.yaml
  text: And Yahweh spoke to Aaron[a], saying,
translation:
  language: fr
  text: 'Puis Yahweh[a] parla à Aaron en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hébreu YHWH, le nom divin ; également transcrit « Yahvé » ou « Jéhovah » et traditionnellement rendu par « le SEIGNEUR ».
    reason: Signaler les principales formes de transcription et la substitution traditionnelle du nom divin.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Puis … parla
  rationale: Le waw narratif fait progresser le récit et peut naturellement se rendre ici par « Puis ». Le verbe דבר désigne l’acte de parler ; « parla » convient à cette formule d’introduction d’une parole divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Cette transcription représente le nom divin YHWH comme un nom propre, sans lui substituer un titre.
- source_word: אֶל־אַהֲרֹן
  choice: à Aaron
  rationale: La préposition אֶל introduit le destinataire de la parole ; « à Aaron » est la formulation française naturelle.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif לֵאמֹר introduit le contenu du discours. « En ces termes » restitue sa fonction idiomatiquement, sans la répétition peu naturelle « parla… disant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Yahvé ; Jéhovah
  rationale: Le texte hébreu emploie directement le Tétragramme. « Yahweh » en préserve le caractère de nom propre ; une note signale les autres usages connus sans imposer une reconstruction de sa prononciation comme absolument certaine.
translation_notes:
  register: Français international actuel, sobre et digne. « En ces termes » évite un calque maladroit de לֵאמֹר tout en conservant clairement la formule d’introduction du discours.
source_grounding:
  english_pob_role: consult_only
