- from: 'Moïse dit à Aaron, ainsi qu’à Éléazar et Itamar, ses fils : « Ne laissez pas vos cheveux en désordre[a] et ne déchirez pas vos vêtements, de peur que vous ne mouriez et qu’il ne s’irrite contre toute la communauté. Mais vos frères, toute la maison d’Israël, pleureront le brasier que Yahweh a allumé[b]. »'
  to: 'Moïse dit à Aaron, ainsi qu’à Éléazar et Itamar, ses fils : « Ne laissez pas vos cheveux en désordre[a] et ne déchirez pas vos vêtements, de peur que vous ne mouriez et qu’il ne s’irrite contre toute la communauté. Mais vos frères, toute la maison d’Israël, pleureront l’embrasement que Yahweh a provoqué[b]. »'
