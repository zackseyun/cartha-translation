base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/006.yaml
  text: And Moses said to Aaron and to Eleazar and Ithamar his sons[a], “Do not let your heads hang loose, and do not tear your garments, so that you do not die and he become angry with all the congregation. But your brothers, the whole house of Israel[b], shall weep for the burning that Yahweh has kindled.”
translation:
  language: fr
  text: 'Moïse dit à Aaron, ainsi qu’à Éléazar et Itamar, ses fils : « Ne laissez pas vos cheveux en désordre[a] et ne déchirez pas vos vêtements, de peur que vous ne mouriez et qu’il ne s’irrite contre toute la communauté. Mais vos frères, toute la maison d’Israël, pleureront l’embrasement que Yahweh a provoqué[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne découvrez pas vos têtes » ou « Ne laissez pas flotter vos cheveux ». L’hébreu désigne un signe de deuil concernant la tête ou la chevelure.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie ici un nom et un verbe de même racine : littéralement, « l’embrasement que Yahweh a embrasé ». La traduction française emploie une expression naturelle tout en conservant l’image du feu et l’action divine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁיכֶם אַל תִּפְרָעוּ
  choice: Ne laissez pas vos cheveux en désordre
  rationale: Le verbe פרע évoque ici la chevelure laissée libre ou négligée comme signe de deuil. Cette formulation française exprime naturellement ce geste sans imposer l’interprétation plus précise d’une tête découverte.
- source_word: וּבִגְדֵיכֶם לֹא תִפְרֹמוּ
  choice: ne déchirez pas vos vêtements
  rationale: פרם désigne le fait de déchirer ses vêtements, geste traditionnel de deuil. La formulation est directe et actuelle.
- source_word: וְלֹא תָמֻתוּ
  choice: de peur que vous ne mouriez
  rationale: La tournure rend la conséquence redoutée après les interdictions et conserve la force solennelle de l’avertissement.
- source_word: וְעַל כָּל הָעֵדָה יִקְצֹף
  choice: et qu’il ne s’irrite contre toute la communauté
  rationale: Le verbe hébreu est au singulier sans sujet exprimé. Le pronom « il » préserve ce sujet implicite, naturellement compris comme Yahweh dans le contexte, sans remplacer le verbe personnel par le nom abstrait « colère ».
- source_word: וַאֲחֵיכֶם כָּל בֵּית יִשְׂרָאֵל
  choice: vos frères, toute la maison d’Israël
  rationale: Cette traduction conserve à la fois le masculin pluriel « vos frères » et l’apposition collective et nationale « toute la maison d’Israël ».
- source_word: יִבְכּוּ אֶת הַשְּׂרֵפָה
  choice: pleureront le brasier
  rationale: « Brasier » garde l’image concrète du feu destructeur tout en permettant une expression française naturelle avec le verbe « allumer ».
- source_word: אֲשֶׁר שָׂרַף יְהוָה
  choice: que Yahweh a allumé
  rationale: Cette formulation attribue directement l’acte à Yahweh et évite la répétition peu naturelle « le brûlement que Yahweh a brûlé », tout en maintenant l’image du feu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la présence du tétragramme dans le texte hébreu.
theological_decisions:
- issue: Sujet implicite de יִקְצֹף
  choice: qu’il ne s’irrite contre toute la communauté
  alternative: que la colère ne s’abatte sur toute la communauté
  rationale: L’hébreu emploie un verbe personnel singulier sans nommer son sujet. Le pronom maintient cette implicitness et la dimension personnelle de la réaction divine, sans ajouter explicitement le nom de Yahweh.
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; sa translittération préserve cette donnée plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. Les gestes de deuil restent concrets; le sujet de la colère demeure implicite comme en hébreu, et le nom divin est rendu par « Yahweh ».
