revisions:
- from: Ils s’approchèrent donc et les transportèrent, vêtus de leurs tuniques, hors du camp[a], comme Moïse l’avait ordonné.
  to: Ils s’approchèrent et les transportèrent dans leurs tuniques hors du camp[a], comme Moïse l’avait dit.
  rationale: La révision retire l’inférence causale non marquée, remplace l’interprétation restrictive « vêtus de » par la formulation plus proche « dans leurs tuniques », et rend le verbe de Moïse sans renforcer « dit » en « ordonné ». La note conserve explicitement l’alternative instrumentale.
  reviewer_model: gpt-5.6-terra
