  text: So they came near and carried them in their tunics to outside the camp[a], just as Moses had said.
translation:
  language: fr
  text: Ils s’approchèrent et les transportèrent dans leurs tuniques hors du camp[a], comme Moïse l’avait dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « par leurs tuniques ». La préposition hébraïque peut indiquer le moyen employé : ils ont peut-être transporté les corps en les saisissant ou en utilisant leurs tuniques.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: Ils s’approchèrent
  rationale: Le qal de קרב exprime ici le mouvement vers les corps, conformément à l’ordre donné au verset précédent. « S’approchèrent » est naturel et ne charge pas le verbe d’une nuance rituelle supplémentaire.
- source_word: וַיִּשָּׂאֻם
  choice: les transportèrent
  rationale: נשׂא avec le suffixe objet masculin pluriel désigne ici l’action d’emporter les corps de Nadab et d’Abihou. « Transportèrent » exprime clairement le déplacement, tandis que « soulevèrent » serait trop ponctuel.
- source_word: בְּכֻתֳּנֹתָם
  choice: vêtus de leurs tuniques
  rationale: כֻּתֹּנֶת désigne une tunique ou longue pièce de vêtement. Cette formulation retient naturellement la lecture circonstancielle de ב, selon laquelle les défunts portaient encore leurs propres tuniques, sans effacer la possibilité instrumentale signalée en note.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: hors du camp
  rationale: La locution exprime un déplacement vers un lieu situé à l’extérieur du camp. En français actuel, « transporter hors du camp » rend naturellement cette direction sans calquer lourdement la construction hébraïque.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: comme Moïse l’avait ordonné
  rationale: Dans le contexte immédiat, les paroles antérieures de Moïse constituent un ordre précis. « L’avait ordonné » explicite correctement la fonction pragmatique de דִּבֶּר, et le plus-que-parfait marque l’antériorité.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. « Tuniques » conserve la précision concrète du terme vestimentaire. La syntaxe privilégie une lecture fluide tout en maintenant en note l’ambiguïté réelle de la préposition hébraïque.
