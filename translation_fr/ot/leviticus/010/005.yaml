review_pass:
  verdict: revise
  source_fidelity: La proposition principale rend correctement la succession des actions et le déplacement des corps. Toutefois, « donc » introduit une conséquence non exprimée par le simple waw narratif. « Vêtus de leurs tuniques » interprète la préposition ב comme une indication explicite d’habillement et affaiblit l’ambiguïté instrumentale/circonstancielle du texte. Enfin, « l’avait ordonné » explicite de façon plausible le contexte, mais dépasse le verbe hébreu « avait dit/parlé »; il vaut mieux conserver cette formulation sobre.
  naturalness: « Ils s’approchèrent et les transportèrent dans leurs tuniques hors du camp » est idiomatique dans un registre biblique moderne et compréhensible en français international. La note permet d’éclairer l’expression inhabituelle sans lui imposer une seule analyse.
  terminology: « Transportèrent », « tuniques », « camp » et « Moïse » conviennent. « Dans leurs tuniques » conserve le vocabulaire concret et l’ambiguïté du texte hébreu.
  issues:
  - severity: medium
    issue: Ajout de « donc »
    rationale: Le waw de וַיִּקְרְבוּ est narratif et ne marque pas nécessairement une conséquence logique.
  - severity: medium
    issue: « vêtus de leurs tuniques » interprète excessivement בְּכֻתֳּנֹתָם
    rationale: Cette formulation affirme que les défunts étaient habillés, alors que la préposition peut également indiquer le moyen de transport. « Dans leurs tuniques », avec note, préserve mieux l’ambiguïté.
  - severity: low
    issue: « comme Moïse l’avait ordonné » est plus spécifique que le texte source
    rationale: דִּבֶּר signifie « dit/parlé ». Le contexte est bien celui d’une instruction, mais « avait dit » évite une explicitation inutile.
  revised_text: Ils s’approchèrent et les transportèrent dans leurs tuniques hors du camp[a], comme Moïse l’avait dit.
  revised_footnotes:
  - marker: a
    text: 'Ou « par leurs tuniques ». La préposition hébraïque peut indiquer le moyen employé : ils ont peut-être transporté les corps en les saisissant ou en utilisant leurs tuniques.'
    reason: lexical_alternative
  revision_rationale: La révision retire l’inférence causale non marquée, remplace l’interprétation restrictive « vêtus de » par la formulation plus proche « dans leurs tuniques », et rend le verbe de Moïse sans renforcer « dit » en « ordonné ». La note conserve explicitement l’alternative instrumentale.
