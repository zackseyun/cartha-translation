source:
  edition: WLC
  text: לֹ֖א תִּגְנֹ֑בוּ וְ/לֹא תְכַחֲשׁ֥וּ וְ/לֹֽא תְשַׁקְּר֖וּ אִ֥ישׁ בַּ/עֲמִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/011.yaml
  text: You shall not steal[a], and you shall not deal falsely, and you shall not lie to one another.
translation:
  language: fr
  text: Vous ne volerez pas, vous ne tromperez pas et vous ne mentirez pas les uns aux autres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּגְנֹבוּ
  choice: vous ne volerez pas
  rationale: Le qal inaccompli à la 2e personne du pluriel sous לֹא exprime ici une interdiction. « Voler » rend directement le sens courant de גנב.
- source_word: תְכַחֲשׁוּ
  choice: vous ne tromperez pas
  rationale: Le piel de כחש peut évoquer la tromperie, la dénégation ou une conduite mensongère. « Tromper » conserve une portée assez large et se distingue naturellement du verbe suivant, « mentir ».
- source_word: תְשַׁקְּרוּ
  choice: vous ne vous mentirez pas
  rationale: Le piel de שקר désigne couramment le fait de mentir ou d'agir faussement. La construction pronominale avec « les uns aux autres » exprime naturellement en français la relation interpersonnelle indiquée par l'hébreu.
- source_word: אִישׁ בַּעֲמִיתוֹ
  choice: les uns aux autres
  rationale: L'expression, littéralement « un homme envers/contre son prochain », a ici une valeur distributive et réciproque. La formulation inclusive « les uns aux autres » en restitue le sens sans laisser entendre que seuls les hommes sont visés.
- source_word: עֲמִית
  choice: les uns aux autres
  rationale: עמית désigne un compatriote, un associé ou un prochain au sein de la communauté. Intégré à l'expression réciproque française, son sens relationnel est rendu sans lourdeur.
theological_decisions:
- issue: Portée de l'expression masculine distributive אִישׁ ... עֲמִיתוֹ
  choice: Formulation inclusive « les uns aux autres »
  alternative: « chacun à son prochain » ou, littéralement, « un homme à son compagnon »
  rationale: Le masculin singulier hébreu est représentatif et ne limite pas l'interdiction aux hommes. La formulation française rend cette portée générale sans ajouter de restriction.
translation_notes:
  register: Français international moderne, direct et digne. Le futur à valeur injonctive maintient le registre juridique des interdictions, tandis que la coordination sans répétition superflue de « et » reste naturelle en français.
