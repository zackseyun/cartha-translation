reference: Leviticus 19:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הֵבִ֤יא אֶת אֲשָׁמ/וֹ֙ לַֽ/יהוָ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד אֵ֖יל אָשָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/021.yaml
  text: 'And he shall bring his guilt offering to Yahweh[a], to the entrance of the tent of meeting: a ram as a guilt offering.'
translation:
  language: fr
  text: 'Il apportera à Yahweh son sacrifice de réparation[a], à l’entrée de la tente de la rencontre : un bélier comme sacrifice de réparation.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de culpabilité ». Le terme hébreu אָשָׁם peut désigner aussi bien la culpabilité que le sacrifice offert pour la réparer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Il apportera
  rationale: Dans ce texte juridique, la forme verbale exprime une prescription. Le futur français rend naturellement cette valeur normative sans alourdir la phrase.
- source_word: אֲשָׁמוֹ
  choice: son sacrifice de réparation
  rationale: Dans ce contexte rituel, אָשָׁם désigne l’offrande apportée en réparation d’une faute. « Sacrifice de réparation » exprime clairement sa fonction tout en conservant le lien avec la culpabilité, explicité en note.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition indique ici le destinataire auquel le sacrifice est présenté. Le nom divin יהוה est translittéré « Yahweh ».
- source_word: אֶל־פֶּתַח
  choice: à l’entrée
  rationale: פֶּתַח désigne l’entrée ou l’ouverture d’un lieu ; « à l’entrée » est précis et naturel dans ce cadre cultuel.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette expression désigne le sanctuaire où Yahweh rencontre son peuple. « Tente de la rencontre » en restitue le sens de façon claire en français moderne.
- source_word: אֵיל
  choice: un bélier
  rationale: אֵיל désigne précisément un bélier, l’animal prescrit dans ce verset.
- source_word: אָשָׁם
  choice: en sacrifice de réparation
  rationale: La dernière expression précise la fonction rituelle du bélier. La tournure « en sacrifice de réparation » conserve cette apposition et évite d’ajouter une relation absente de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme יהוה. « Yahweh » préserve le nom propre de l’alliance sans le remplacer par un titre.
- issue: Portée du terme אָשָׁם
  choice: sacrifice de réparation, avec une note sur son lien avec la culpabilité
  alternative: sacrifice de culpabilité
  rationale: Dans ce contexte, le terme désigne le sacrifice rituel, mais son champ sémantique inclut également la culpabilité à laquelle il répond. La traduction principale reste idiomatique tandis que la note préserve cette tension lexicale.
translation_notes:
  register: Français international moderne, sobre et digne. Le futur a une valeur prescriptive adaptée au contexte légal. La répétition de « sacrifice de réparation » est maintenue parce qu’elle reflète celle de l’hébreu et précise que le bélier constitue ce sacrifice.
