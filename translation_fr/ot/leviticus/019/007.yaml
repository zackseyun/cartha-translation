source:
  edition: WLC
  text: וְ/אִ֛ם הֵאָכֹ֥ל יֵאָכֵ֖ל בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י פִּגּ֥וּל ה֖וּא לֹ֥א יֵרָצֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/007.yaml
  text: But if it is eaten at all on the third day[a], it is a defiled thing; it will not be accepted.
translation:
  language: fr
  text: Mais si l’on en mange quand même le troisième jour, c’est une chose répugnante[a] ; cela ne sera pas agréé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une chose impropre » ou « une chose infecte ». Le terme hébreu désigne ici une viande sacrificielle rendue inacceptable parce qu’elle est consommée après le délai permis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Le waw introduit ici une condition qui contraste avec la règle précédente ; « Mais si » rend naturellement cet enchaînement.
- source_word: הֵאָכֹל יֵאָכֵל
  choice: l’on en mange malgré tout
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’idée verbale. « malgré tout » exprime ici l’éventualité insistante d’une consommation en dépit de l’interdiction, sans donner artificiellement au français une tournure solennelle.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: le troisième jour
  rationale: Rendu temporel direct et naturel en français.
- source_word: פִּגּוּל
  choice: une chose souillée
  rationale: Dans ce contexte sacrificiel, le terme qualifie ce qui est devenu impropre et inacceptable du fait du dépassement du délai prescrit. « Souillée » garde la portée cultuelle sans employer « abomination », qui évoquerait un autre vocabulaire hébreu plus fort.
- source_word: הוּא
  choice: c’est
  rationale: Le pronom sert de sujet à une proposition nominale emphatique ; « c’est » produit une formulation française claire.
- source_word: לֹא יֵרָצֶה
  choice: elle ne sera pas agréée
  rationale: Le niphal de רצה désigne couramment, en contexte sacrificiel, l’acceptation favorable d’une offrande. « Agréée » conserve cette nuance cultuelle.
theological_decisions:
- issue: Statut cultuel de la viande consommée le troisième jour
  choice: Le texte déclare cette viande souillée et donc non agréée dans le cadre sacrificiel.
  alternative: Y voir seulement une viande physiquement avariée, ou une « abomination » au sens général et maximal du terme.
  rationale: Le contexte immédiat porte sur les délais de consommation du sacrifice et sur son acceptabilité. La traduction garde cette portée rituelle sans la réduire à une question d’altération physique ni l’élargir à une catégorie théologique étrangère au passage.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’insistance de la construction hébraïque et le vocabulaire cultuel, tout en évitant un calque peu naturel.
