  source_fidelity: 'La construction hébraïque intensifie l’éventualité de manger le sacrifice le troisième jour. « Malgré tout » explicite de façon un peu trop marquée l’idée d’une action accomplie en dépit d’un ordre; « quand même » restitue plus naturellement l’insistance dans le contexte immédiat. Surtout, פִּגּוּל ne désigne pas la souillure rituelle au sens technique : il qualifie ici une chose cultuellement offensante et devenue inacceptable.'
  naturalness: La formulation révisée reste fluide en français international moderne. « Cela ne sera pas agréé » évite l’antécédent féminin artificiel de « elle », alors que le référent exact (viande ou sacrifice) n’est pas explicitement répété en hébreu.
  terminology: « Une chose répugnante » rend le caractère offensant de פִּגּוּל sans le confondre avec l’impureté/souillure rituelle, ni employer « abomination », qui serait plus chargé. « Agréé » convient au vocabulaire de l’acceptabilité sacrificielle.
