  rationale: La révision remplace « souillée », terme susceptible d’évoquer une catégorie distincte d’impureté rituelle, par « répugnante », qui préserve la valeur négative et cultuelle de פִּגּוּל. Elle ajuste également l’expression de l’insistance verbale et le pronom final sans modifier le sens du passage.
