  text: וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן בְּ/אֵ֤יל הָֽ/אָשָׁם֙ לִ/פְנֵ֣י יְהוָ֔ה עַל חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א וְ/נִסְלַ֣ח ל֔/וֹ מֵ/חַטָּאת֖/וֹ אֲשֶׁ֥ר חָטָֽא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/022.yaml
  text: And the priest shall make atonement for him before Yahweh with the ram of the guilt offering for the sin that he committed[a], and he shall be forgiven for the sin that he committed.
translation:
  language: fr
  text: Le prêtre accomplira pour lui le rite d’expiation devant Yahweh avec le bélier du sacrifice de réparation[a], pour le péché qu’il a commis, et il sera pardonné du péché qu’il a commis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du sacrifice de culpabilité ». Le mot hébreu אָשָׁם peut évoquer à la fois la culpabilité et la réparation liée à ce sacrifice.
    reason: alternative lexicale
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו הַכֹּהֵן
  choice: Le prêtre fera pour lui le rite d’expiation
  rationale: Dans le contexte sacerdotal du Lévitique, כפר désigne l’acte rituel accompli par le prêtre en faveur d’une personne. « Faire le rite d’expiation » est naturel en français tout en conservant le caractère cultuel du terme.
- source_word: בְּאֵיל הָאָשָׁם
  choice: avec le bélier du sacrifice de réparation
  rationale: איל désigne précisément un bélier, et le beth est instrumental. אָשָׁם désigne ici un sacrifice lié à la culpabilité, mais aussi à la réparation exigée; « sacrifice de réparation » met en relief cette fonction sans nier l’aspect de culpabilité.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » conserve la formulation spatiale et cultuelle, tandis que « Yahweh » représente directement le nom divin יהוה.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: pour le péché qu’il a commis
  rationale: Cette formulation restitue clairement la faute au titre de laquelle l’expiation est accomplie, en lissant la construction apparentée חטאת / חטא qui serait lourde mot à mot en français.
- source_word: וְנִסְלַח לוֹ מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: et ce péché qu’il a commis lui sera pardonné
  rationale: Le passif conserve l’agent divin implicite. Placer « ce péché » comme sujet rend aussi compte de la préposition מן et évite une tournure française maladroite telle que « il lui sera pardonné de son péché ».
theological_decisions:
- issue: Représentation du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme; « Yahweh » préserve le nom propre de l’alliance plutôt que de le remplacer par un titre.
- issue: Portée de אָשָׁם dans le nom du sacrifice
  choice: sacrifice de réparation
  alternative: sacrifice de culpabilité
  rationale: Le terme associe culpabilité et réparation. Le choix principal souligne ici la dimension compensatoire propre à ce sacrifice, tandis que la note conserve l’autre valeur lexicale légitime.
- issue: Agent du pardon dans וְנִסְלַח
  choice: passif sans agent exprimé
  alternative: Yahweh lui pardonnera
  rationale: L’hébreu laisse l’auteur du pardon implicite. Le français conserve cette réserve au lieu d’expliciter théologiquement l’agent dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la répétition finale du péché commis, présente dans l’hébreu, tout en évitant un calque peu naturel. Le vocabulaire cultuel reste précis sans devenir technique à l’excès.
