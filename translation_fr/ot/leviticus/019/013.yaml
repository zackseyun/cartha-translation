source:
  edition: WLC
  text: לֹֽא תַעֲשֹׁ֥ק אֶת רֵֽעֲ/ךָ֖ וְ/לֹ֣א תִגְזֹ֑ל לֹֽא תָלִ֞ין פְּעֻלַּ֥ת שָׂכִ֛יר אִתְּ/ךָ֖ עַד בֹּֽקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/013.yaml
  text: You shall not oppress your neighbor or rob him[a]. The wages of a hired worker shall not remain with you until morning.
translation:
  language: fr
  text: Tu n’opprimeras pas ton prochain et tu ne le dépouilleras pas. Le salaire d’un salarié ne passera pas la nuit chez toi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Tu ne garderas pas jusqu’au matin le salaire d’un salarié. »'
    reason: La syntaxe hébraïque présente littéralement le salaire comme sujet du verbe « passer la nuit »; l’autre formulation explicite la responsabilité de celui qui le retient.
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: exploiteras
  rationale: Le verbe désigne l’oppression exercée notamment en abusant de son pouvoir ou en retenant ce qui est dû. « Exploiter » exprime naturellement cette injustice dans le contexte économique immédiat.
- source_word: רֵעֲךָ
  choice: ton prochain
  rationale: Dans ce contexte juridique et éthique, le terme désigne l’autre membre de la communauté. « Ton prochain » maintient le vocabulaire caractéristique du Lévitique et son ampleur relationnelle.
- source_word: תִגְזֹל
  choice: dépouilleras
  rationale: Le verbe évoque le fait de prendre injustement, souvent par force. « Dépouiller » conserve une intensité plus forte que le simple vol sans imposer ici une construction française maladroite.
- source_word: תָלִין
  choice: ne restera pas
  rationale: Le verbe signifie passer la nuit ou demeurer jusqu’au lendemain. Cette formulation conserve « le salaire » comme sujet grammatical et reste naturelle en français.
- source_word: פְּעֻלַּת
  choice: le salaire
  rationale: Bien que le nom puisse désigner le travail ou sa rétribution, son association avec l’ouvrier salarié et l’interdiction de différer le paiement indique ici la rémunération.
- source_word: שָׂכִיר
  choice: d’un ouvrier
  rationale: Le terme désigne une personne engagée contre salaire. « Ouvrier » est clair et idiomatique dans ce contexte, tandis que la notion de rémunération est déjà explicite dans « salaire ».
- source_word: אִתְּךָ
  choice: chez toi
  rationale: L’expression indique que le salaire demeure en la possession de l’employeur. « Chez toi » rend directement cette idée dans un français courant.
- source_word: עַד בֹּקֶר
  choice: jusqu’au matin
  rationale: La traduction garde la limite temporelle concrète donnée par l’hébreu plutôt que de la réduire à une simple paraphrase comme « pendant la nuit ».
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne, avec les futurs à valeur impérative propres au style juridique. « Prochain » assure la cohérence avec le vocabulaire éthique du chapitre.
