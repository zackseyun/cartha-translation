review_pass:
  verdict: revise
  source_fidelity: Le premier interdit doit conserver la portée large de עָשַׁק (« opprimer », y compris par la rétention de ce qui est dû), distincte de גָּזַל (« dépouiller/voler »). Pour la seconde phrase, « ne passera pas la nuit » rend plus exactement לון/לין et la limite « jusqu’au matin ».
  naturalness: Le français proposé est globalement clair et de registre approprié. « Ne passera pas la nuit chez toi » est plus idiomatique et plus précis que « ne restera pas chez toi jusqu’au matin », qui atténue l’idée explicite de passer la nuit. « Salarié » est un équivalent moderne et international de « travailleur engagé contre salaire ».
  terminology: « Ton prochain » convient à רֵעֲךָ. « Opprimer » évite de réduire עָשַׁק à l’exploitation économique continue; « dépouiller » conserve la force de גָּזַל. Aucun enjeu théologique particulier n’est en cause.
  issues:
  - severity: medium
    issue: « Exploiter » est plus étroit que עָשַׁק.
    rationale: En français courant, « exploiter » évoque volontiers une pratique économique ou durable, tandis que le verbe hébreu désigne plus largement l’oppression ou le tort abusif, notamment la privation de ce qui est dû.
  - severity: low
    issue: « Ne restera pas chez toi jusqu’au matin » ne marque pas explicitement le fait de passer la nuit.
    rationale: לון/לין exprime l’idée de demeurer pour la nuit. « Ne passera pas la nuit chez toi » préserve cette image temporelle et le sens de ne pas retenir le salaire pendant la nuit.
  revised_text: Tu n’opprimeras pas ton prochain et tu ne le dépouilleras pas. Le salaire d’un salarié ne passera pas la nuit chez toi.[a]
