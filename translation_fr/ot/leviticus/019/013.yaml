revisions:
- from: Tu n’exploiteras pas ton prochain et tu ne le dépouilleras pas. Le salaire d’un ouvrier ne restera pas chez toi jusqu’au matin.[a]
  to: Tu n’opprimeras pas ton prochain et tu ne le dépouilleras pas. Le salaire d’un salarié ne passera pas la nuit chez toi.[a]
  rationale: La révision distingue plus nettement les deux verbes hébreux et restitue explicitement l’idée que le salaire ne doit pas être retenu durant la nuit. Elle conserve le style juridique direct, le vocabulaire éthique de « prochain » et l’ambiguïté non problématique de la construction hébraïque, signalée par la note.
