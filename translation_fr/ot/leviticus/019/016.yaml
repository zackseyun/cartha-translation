source:
  edition: WLC
  text: לֹא תֵלֵ֤ךְ רָכִיל֙ בְּ/עַמֶּ֔י/ךָ לֹ֥א תַעֲמֹ֖ד עַל דַּ֣ם רֵעֶ֑/ךָ אֲנִ֖י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/016.yaml
  text: You shall not go about as a slanderer among your people[a]. You shall not stand against the blood of your neighbor. I am Yahweh.
translation:
  language: fr
  text: Tu ne colporteras pas de calomnies parmi ton peuple. Tu ne t’élèveras pas contre le sang de ton prochain[a]. Je suis Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu ne resteras pas sans intervenir lorsque le sang de ton prochain est versé. »'
    reason: Lecture alternative de la tournure hébraïque concise לֹא תַעֲמֹד עַל דַּם רֵעֶךָ, souvent comprise comme une interdiction de l’inaction face au danger mortel encouru par le prochain.
lexical_decisions:
- source_word: תֵלֵךְ רָכִיל
  choice: tu n’iras pas répandre des calomnies
  rationale: L’expression associe le verbe « aller » à un nom désignant celui qui fait circuler des propos nuisibles. Cette formulation française conserve l’idée de se déplacer dans la communauté tout en exprimant naturellement l’action visée.
- source_word: בְּעַמֶּיךָ
  choice: parmi ton peuple
  rationale: La préposition בְּ situe cette conduite au sein du peuple auquel appartient le destinataire.
- source_word: תַעֲמֹד עַל
  choice: tu ne te tiendras pas contre
  rationale: La formulation reste proche de l’image hébraïque, volontairement concise et difficile, sans trancher entièrement entre action hostile, complicité et inaction coupable.
- source_word: דַּם
  choice: le sang
  rationale: Le sens concret de « sang » est conservé; dans ce contexte, il peut évoquer la vie menacée ou le sang versé.
- source_word: רֵעֶךָ
  choice: ton prochain
  rationale: « Prochain » est le terme français établi et naturel dans ce contexte éthique pour désigner l’autre membre de la communauté.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin représenté par le tétragramme, plutôt que sa substitution par un titre.
theological_decisions:
- issue: Sens de לֹא תַעֲמֹד עַל דַּם רֵעֶךָ
  choice: Maintenir dans le texte la formulation concrète « te tenir contre le sang de ton prochain ».
  alternative: Comprendre l’interdiction comme « rester sans agir lorsque le sang de ton prochain est versé »; une autre interprétation y voit l’interdiction de témoigner contre lui dans une affaire capitale.
  rationale: L’hébreu est laconique et permet plusieurs nuances. Le texte principal conserve son image et sa tension; la note signale l’interprétation courante relative à l’inaction devant un danger mortel.
translation_notes:
  register: Français moderne, digne et directement compréhensible. La première interdiction est rendue idiomatiquement; la seconde garde une formulation plus littérale afin de préserver l’ambiguïté réelle de l’hébreu. Le tutoiement singulier reflète les formes hébraïques.
