  terminology: « Calomnies », « peuple », « sang », « prochain » et « Yahvé » conviennent au registre biblique français moderne. « Colporter des calomnies » exprime plus directement et naturellement l’activité visée par רָכִיל que « aller répandre des calomnies ».
