id: LEV.19.4
reference: Leviticus 19:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַל תִּפְנוּ֙ אֶל הָ֣/אֱלִילִ֔ים וֵֽ/אלֹהֵי֙ מַסֵּכָ֔ה לֹ֥א תַעֲשׂ֖וּ לָ/כֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/004.yaml
  text: Do not turn to idols[a], and do not make cast-metal gods for yourselves[b]. I am Yahweh your God.
translation:
  language: fr
  text: Ne vous tournez pas vers les idoles[a] et ne vous fabriquez pas de dieux en métal fondu[b]. Je suis Yahweh, votre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les idoles sans valeur » ; le terme hébreu peut avoir une nuance péjorative.
    reason: lexical_alternative
  - marker: b
    text: Ou « des dieux de métal coulé » ou « des idoles en métal ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְנוּ
  choice: vous tournez vers
  rationale: Le verbe פנה avec אֶל exprime le fait de se tourner vers ou de diriger son attention vers quelque chose. Cette formulation naturelle conserve la portée du texte sans la réduire explicitement au seul acte d’adoration.
- source_word: אֱלִילִים
  choice: idoles
  rationale: « Idoles » est le terme français clair et courant. Le mot hébreu peut comporter une nuance péjorative d’inanité ou de nullité, signalée en note.
- source_word: אֱלֹהֵי מַסֵּכָה
  choice: dieux en métal fondu
  rationale: Cette expression conserve le pluriel « dieux » et rend מַסֵּכָה comme une indication de fabrication par fonte et moulage du métal.
- source_word: תַעֲשׂוּ לָכֶם
  choice: vous fabriquez
  rationale: 'Le pronom réfléchi rend naturellement en français la valeur bénéficiaire de לָכֶם : fabriquer ces objets pour soi-même ou pour son propre usage.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » préserve le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Malgré sa morphologie plurielle, אֱלֹהִים désigne ici le Dieu unique d’Israël dans la formule d’alliance et appelle donc le singulier en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » maintient le nom propre et évite de le remplacer par un titre.
- issue: Portée religieuse du verbe פנה
  choice: Ne vous tournez pas vers
  alternative: N’adorez pas / Ne prêtez pas attention à
  rationale: Le verbe hébreu parle littéralement de se tourner vers. La traduction retenue préserve cette image et sa portée potentiellement large sans expliciter seulement l’adoration.
- issue: Statut de אֱלֹהֵי dans l’expression אֱלֹהֵי מַסֵּכָה
  choice: dieux
  alternative: idoles
  rationale: Le mot hébreu est grammaticalement « dieux ». Le conserver maintient le contraste du verset entre les prétendus dieux fabriqués et Yahweh, « votre Dieu », sans reconnaître pour autant leur réalité divine.
translation_notes:
  register: Français international moderne, digne et accessible. L’impératif pluriel est rendu par « vous ». La coordination et le parallélisme des deux interdictions sont conservés, de même que la formule finale brève et solennelle.
