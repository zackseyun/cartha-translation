id: LEV.19.18
reference: Leviticus 19:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹֽא תִקֹּ֤ם וְ/לֹֽא תִטֹּר֙ אֶת בְּנֵ֣י עַמֶּ֔/ךָ וְ/אָֽהַבְתָּ֥ לְ/רֵעֲ/ךָ֖ כָּמ֑וֹ/ךָ אֲנִ֖י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/018.yaml
  text: You shall not take vengeance or bear a grudge against the sons of your people[a], but you shall love your neighbor as yourself; I am Yahweh.
translation:
  language: fr
  text: Tu ne te vengeras pas des membres de ton peuple[a] et tu ne leur garderas pas rancune, mais tu aimeras ton prochain comme toi-même. Je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des fils de ton peuple ».'
    reason: Précision sur l’expression hébraïque idiomatique et sur sa forme littérale.
lexical_decisions:
- source_word: תִקֹּם
  choice: tu ne te vengeras pas
  rationale: Le verbe נקם exprime l’action de se venger ou d’exercer une vengeance. La tournure pronominale est naturelle en français et conserve le sens actif de représailles.
- source_word: תִטֹּר
  choice: tu ne leur garderas pas rancune
  rationale: Dans ce contexte, נטר désigne le fait d’entretenir durablement du ressentiment. « Garder rancune » rend clairement cet aspect persistant.
- source_word: בְּנֵי עַמֶּךָ
  choice: des membres de ton peuple[a]
  rationale: Littéralement « les fils de ton peuple », l’expression désigne ici les personnes appartenant au même peuple. « Membres de ton peuple » restitue naturellement en français la valeur collective de l’idiome, tandis que la forme littérale est signalée en note.
- source_word: וְאָהַבְתָּ
  choice: mais tu aimeras
  rationale: Le parfait précédé de waw a ici une valeur injonctive dans le cadre légal. « Tu aimeras » conserve la force du commandement, et « mais » explicite le contraste porté par l’enchaînement.
- source_word: לְרֵעֲךָ
  choice: ton prochain
  rationale: רֵעַ peut désigner un compagnon, un semblable ou une personne proche. « Prochain » est idiomatique dans ce contexte éthique et garde la formulation biblique bien établie sans élargir ni restreindre artificiellement la portée du terme.
- source_word: כָּמוֹךָ
  choice: comme toi-même
  rationale: Cette formulation française naturelle rend directement la comparaison et présente l’amour de soi comme mesure de l’amour dû au prochain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la présence explicite du tétragramme dans le texte hébreu.
theological_decisions:
- issue: Portée des personnes visées par le commandement
  choice: Conserver la référence immédiate aux membres du peuple, puis rendre רֵעַ par « prochain ».
  alternative: Universaliser les deux expressions dans le corps du texte, ou traduire littéralement בְּנֵי עַמֶּךָ par « fils de ton peuple ».
  rationale: Le verset emploie deux expressions distinctes. La traduction maintient leur particularité textuelle sans imposer au verset une extension ou une restriction théologique étrangère à sa formulation.
- issue: Rendu du nom divin
  choice: Yahweh
  alternative: Le SEIGNEUR ou Jéhovah
  rationale: Le texte porte le nom personnel יהוה. Sa translittération préserve cette donnée au lieu de lui substituer un titre.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement singulier reflète les formes hébraïques de deuxième personne du singulier. La répétition du pronom dans « tu ne leur garderas pas rancune » permet de respecter en français les constructions propres à « se venger de » et « garder rancune à », sans altérer l’objet commun des deux interdictions.
