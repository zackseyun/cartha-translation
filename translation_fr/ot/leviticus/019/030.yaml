id: LEV.19.30
reference: Leviticus 19:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֶת שַׁבְּתֹתַ֣/י תִּשְׁמֹ֔רוּ וּ/מִקְדָּשִׁ֖/י תִּירָ֑אוּ אֲנִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/030.yaml
  text: You shall keep my Sabbaths and revere my sanctuary[a]; I am Yahweh.
translation:
  language: fr
  text: Vous observerez mes sabbats et vous révérerez mon sanctuaire[a]. Je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous craindrez mon sanctuaire ». Le verbe hébreu peut exprimer aussi bien la crainte que la révérence; ici, il évoque le profond respect dû au lieu saint de Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: mes sabbats
  rationale: Le pluriel hébreu est explicite. « Mes sabbats » conserve la forme du texte et désigne les observances sabbatiques établies par Yahweh.
- source_word: תִּשְׁמֹרוּ
  choice: vous observerez
  rationale: שׁמר peut signifier garder, respecter ou observer. En français juridique et cultuel moderne, « observer » convient naturellement aux sabbats et rend clairement l'obligation.
- source_word: מִקְדָּשִׁי
  choice: mon sanctuaire
  rationale: מִקְדָּשׁ désigne un lieu saint ou sanctuaire. « Mon sanctuaire » est précis et naturel sans spécifier indûment le tabernacle ou le Temple.
- source_word: תִּירָאוּ
  choice: vous révérerez
  rationale: ירא peut exprimer la crainte ou la révérence. Avec le sanctuaire comme objet, « révérer » rend l'attitude de profond respect sacré tout en laissant la note signaler le sens plus littéral possible.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » conserve le nom divin personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: אֲנִי יְהוָה
  choice: Je suis Yahweh
  rationale: Cette formulation rend directement la formule hébraïque d'auto-identification divine et en préserve la force covenantielle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel révélé à Israël sans lui substituer un titre.
- issue: Sens de ירא appliqué au sanctuaire
  choice: vous révérerez mon sanctuaire
  alternative: vous craindrez mon sanctuaire
  rationale: Le verbe comporte une tension entre crainte et révérence. Dans ce contexte cultuel, « révérer » communique naturellement le profond respect dû au lieu saint; la note conserve l'autre possibilité lexicale.
translation_notes:
  register: Français international moderne, digne et direct. Le futur à valeur injonctive convient au registre légal du Lévitique. Le pluriel « sabbats » et le nom « Yahweh » suivent explicitement l'hébreu.
