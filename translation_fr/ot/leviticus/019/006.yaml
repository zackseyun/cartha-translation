  text: בְּ/י֧וֹם זִבְחֲ/כֶ֛ם יֵאָכֵ֖ל וּ/מִֽ/מָּחֳרָ֑ת וְ/הַ/נּוֹתָר֙ עַד י֣וֹם הַ/שְּׁלִישִׁ֔י בָּ/אֵ֖שׁ יִשָּׂרֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/006.yaml
  text: It shall be eaten on the day of your sacrifice and on the next day[a], but what remains until the third day shall be burned in the fire.
translation:
  language: fr
  text: On le mangera le jour de votre sacrifice et le lendemain ; mais ce qui restera jusqu’au troisième jour sera brûlé au feu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם זִבְחֲכֶם
  choice: le jour où vous offrirez votre sacrifice
  rationale: Cette formulation rend naturellement la valeur temporelle de בְּיוֹם et la construction nominale זִבְחֲכֶם, tout en conservant le cadre sacrificiel.
- source_word: יֵאָכֵל
  choice: on la mangera
  rationale: Le nifal exprime ici le passif. En français juridique courant, le pronom indéfini « on » donne une tournure naturelle sans changer le sens de l’instruction.
- source_word: וּמִמָּחֳרָת
  choice: ainsi que le lendemain
  rationale: מָחֳרָת désigne le jour suivant. « Le lendemain » est moderne et idiomatique ; « ainsi que » marque clairement que la consommation est aussi permise ce jour-là.
- source_word: וְהַנּוֹתָר
  choice: mais ce qui restera
  rationale: Le participe désigne la portion restante. « Mais » explicite le contraste pragmatique entre la période de consommation et l’ordre concernant le reste.
- source_word: עַד יוֹם הַשְּׁלִישִׁי
  choice: jusqu’au troisième jour
  rationale: Cette traduction conserve directement la limite temporelle exprimée par עַד.
- source_word: בָּאֵשׁ יִשָּׂרֵף
  choice: sera brûlé au feu
  rationale: Le nifal est passif et l’imparfait a ici une valeur prescriptive. « Au feu » est une expression française naturelle qui conserve l’image concrète du texte.
theological_decisions: []
