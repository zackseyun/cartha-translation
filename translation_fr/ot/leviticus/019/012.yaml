  terminology: « Jurer faussement », « par mon nom », « profaner », « le nom de ton Dieu » et « Yahweh » sont des choix appropriés, précis et de registre biblique moderne. La note doit éviter de présenter comme une simple littéralité non qualifiée une forme verbale dont la relation au premier membre est rendue ici de façon consécutive.
