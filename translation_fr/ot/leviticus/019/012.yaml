  text: וְ/לֹֽא תִשָּׁבְע֥וּ בִ/שְׁמִ֖/י לַ/שָּׁ֑קֶר וְ/חִלַּלְתָּ֛ אֶת שֵׁ֥ם אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/012.yaml
  text: You shall not swear falsely by my name and so profane the name of your God[a]. I am Yahweh.
translation:
  language: fr
  text: Vous ne jurerez pas faussement par mon nom, car tu profanerais ainsi le nom de ton Dieu.[a] Je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « Vous ne jurerez pas par mon nom pour le mensonge, et tu profaneras le nom de ton Dieu. » L’hébreu passe ici du pluriel au singulier ; la seconde proposition exprime la conséquence du faux serment.'
    reason: Précision lexicale et conservation de la variation grammaticale du texte source.
lexical_decisions:
- source_word: תִשָּׁבְעוּ
  choice: vous ne jurerez pas
  rationale: Le nifal de שׁבע désigne ici le fait de jurer ou de prêter serment. Le futur à valeur impérative exprime naturellement en français une interdiction solennelle, et « vous » conserve le pluriel hébreu.
- source_word: בִשְׁמִי
  choice: par mon nom
  rationale: 'Dans le contexte d’un serment, la préposition ב indique le nom invoqué comme garant : on jure « par » ce nom.'
- source_word: לַשָּׁקֶר
  choice: faussement
  rationale: L’expression signifie littéralement « pour le mensonge » ou « en vue du faux ». « Jurer faussement » en restitue clairement et naturellement la valeur adverbiale en français.
- source_word: וְחִלַּלְתָּ
  choice: ce serait profaner
  rationale: Le piel de חלל signifie « profaner, traiter comme non sacré ». Cette formulation française exprime le lien de conséquence entre le faux serment et la profanation, sans en faire artificiellement une interdiction indépendante.
- source_word: שֵׁם אֱלֹהֶיךָ
  choice: le nom de ton Dieu
  rationale: « Nom » est conservé, car il renvoie à l’identité et à l’honneur de Dieu. אֱלֹהִים désigne ici sans ambiguïté le Dieu d’Israël, et le possessif singulier hébreu est rendu par « ton ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre tel que « le Seigneur ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Yahvé
  rationale: Le texte emploie le nom personnel de Dieu. Le conserver sous la forme « Yahweh » évite de lui substituer un titre et maintient le lien explicite entre « mon nom » et l’auto-identification finale.
- issue: Rapport entre le faux serment et la profanation
  choice: conséquence exprimée par « ce serait profaner »
  alternative: 'coordination littérale : « et tu profaneras »'
  rationale: 'Le waw relie étroitement les deux actes : jurer faussement par le nom de Dieu entraîne sa profanation. La formulation retenue rend cette portée en français naturel sans gommer la force théologique du lien.'
- issue: Variation du pluriel au singulier
  choice: maintien de « vous » puis « ton »
  alternative: harmonisation entièrement au pluriel ou au singulier
  rationale: L’hébreu passe du verbe pluriel תִשָּׁבְעוּ au verbe et au suffixe singuliers וְחִלַּלְתָּ et אֱלֹהֶיךָ. La traduction conserve autant que possible cette variation réelle, tout en évitant une phrase française heurtée.
translation_notes:
  register: Français moderne, international et solennel. « Jurer faussement » est idiomatique sans être familier. Les deux-points rendent lisible le rapport de conséquence; la note signale la formulation plus littérale et le changement de nombre grammatical.
