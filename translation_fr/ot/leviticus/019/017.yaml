  text: לֹֽא תִשְׂנָ֥א אֶת אָחִ֖י/ךָ בִּ/לְבָבֶ֑/ךָ הוֹכֵ֤חַ תּוֹכִ֨יחַ֙ אֶת עֲמִיתֶ֔/ךָ וְ/לֹא תִשָּׂ֥א עָלָ֖י/ו חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/017.yaml
  text: You shall not hate your brother in your heart. You shall surely rebuke your neighbor[a], and you shall not bear sin because of him.
translation:
  language: fr
  text: Tu ne haïras pas ton frère dans ton cœur. Tu ne manqueras pas de reprendre ton prochain, et tu ne porteras pas de péché à cause de lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu n’encourras pas de culpabilité à son sujet » ou « tu ne participeras pas à son péché ». L’expression hébraïque est idiomatique et peut indiquer que l’on devient coupable si l’on omet de reprendre celui qui agit mal.
    reason: alternative lexicale et préservation d’une ambiguïté idiomatique
lexical_decisions:
- source_word: תִשְׂנָא
  choice: haïras
  rationale: Le verbe שׂנא exprime directement la haine. « Haïras » conserve toute la force morale de l’interdiction.
- source_word: אָחִיךָ
  choice: ton frère
  rationale: אָח peut désigner un frère au sens propre ou un membre du même peuple. « Ton frère » préserve l’image familiale et la portée communautaire du terme source.
- source_word: בִּלְבָבֶךָ
  choice: dans ton cœur
  rationale: לֵבָב désigne l’être intérieur, notamment les pensées et les intentions. Cette expression française naturelle maintient l’accent mis sur la disposition intérieure.
- source_word: הוֹכֵחַ תּוֹכִיחַ
  choice: tu reprendras sans faute
  rationale: La construction associant l’infinitif absolu et le verbe conjugué renforce le commandement. « Sans faute » rend cette insistance de manière claire et naturelle; « reprendre » exprime ici une correction morale explicite.
- source_word: עֲמִיתֶךָ
  choice: ton prochain
  rationale: עָמִית désigne un membre de la même communauté. « Ton prochain » est idiomatique dans ce contexte éthique et s’accorde avec le vocabulaire de Lévitique 19.
- source_word: תִשָּׂא עָלָיו חֵטְא
  choice: tu ne porteras pas de péché à cause de lui
  rationale: La formulation reste proche de l’hébreu tout en indiquant que le comportement de l’autre peut devenir l’occasion d’une culpabilité personnelle. Puisque l’expression est idiomatique et admet plusieurs nuances, celles-ci sont signalées en note.
theological_decisions:
- issue: Portée des termes relationnels masculins dans l’éthique de l’alliance
  choice: Conserver « ton frère » et « ton prochain »
  alternative: Employer « l’un des tiens », « ton compatriote » ou une formulation épicène plus générale
  rationale: L’hébreu emploie des formes masculines singulières à valeur représentative. Les termes retenus préservent la formulation familiale et communautaire sans restreindre artificiellement la portée du commandement.
- issue: Lien entre la réprimande et la culpabilité
  choice: Maintenir la coordination et l’expression ambiguë « à cause de lui »
  alternative: Expliciter que l’absence de réprimande rend coupable, ou comprendre qu’il ne faut ni participer au péché de l’autre ni encourir de culpabilité en le reprenant
  rationale: La syntaxe hébraïque ne précise pas entièrement de quelle manière le péché est porté « à cause de lui ». La traduction évite donc de résoudre dans le corps du texte une tension que l’original laisse ouverte.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur impérative correspond au registre législatif biblique; « sans faute » restitue l’intensification hébraïque sans lourdeur.
