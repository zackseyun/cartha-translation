review_pass:
  verdict: revise
  source_fidelity: La structure temporelle initiale au pluriel, suivie des injonctions au singulier, reflète correctement l’alternance de nombre de l’hébreu. En revanche, « les récoltes » rend sans nécessité au pluriel le singulier קְצִיר. « Tu ne moissonneras pas entièrement le bord » est peu idiomatique en français et exprime moins clairement l’interdiction de moissonner jusqu’à l’extrémité du champ. « Ce qui reste à glaner » est compréhensible, mais « les glanures » rend plus directement לֶקֶט.
  naturalness: La formulation révisée emploie « faire la moisson », « jusqu’à l’extrémité » et « glanures », tournures naturelles dans un registre biblique moderne et accessible. L’alternance vous/tu est volontaire, car elle correspond au texte source, même si elle est marquée en français.
  terminology: « Terre » convient pour אֶרֶץ dans ce contexte agricole. « Extrémité » rend naturellement פֵּאָה sans imposer l’idée géométrique d’un coin; la note conserve cette possibilité. « Glanures » est le terme agricole précis pour לֶקֶט et « ramasser » rend le verbe לקט.
  issues:
  - severity: medium
    issue: Nombre non justifié pour « les récoltes »
    rationale: קְצִיר est au singulier. Le français peut naturellement employer « la moisson » sans la répétition maladroite que cherchait à éviter le projet.
  - severity: medium
    issue: Formulation peu naturelle de la défense concernant le bord du champ
    rationale: « Ne pas moissonner entièrement le bord » est grammaticalement possible, mais maladroit et moins explicite. « Ne pas moissonner jusqu’à l’extrémité » exprime avec naturel l’effet de la construction hébraïque.
  - severity: low
    issue: Rendu indirect de לֶקֶט
    rationale: « Ce qui reste à glaner » est explicatif; « les glanures » est plus concis et correspond directement au terme technique, tout en restant compréhensible.
  revised_text: Lorsque vous ferez la moisson de votre terre, tu ne moissonneras pas jusqu’à l’extrémité[a] de ton champ et tu ne ramasseras pas les glanures de ta moisson.
  revised_footnotes:
  - marker: a
    text: Ou « le coin ». Le mot hébreu peut désigner le bord, le côté ou le coin d’un champ ; ici, il désigne sa partie extérieure, qui doit rester non moissonnée.
    reason: lexical_alternative
