source:
  edition: WLC
  text: וּֽ/בְ/קֻצְרְ/כֶם֙ אֶת קְצִ֣יר אַרְצְ/כֶ֔ם לֹ֧א תְכַלֶּ֛ה פְּאַ֥ת שָׂדְ/ךָ֖ לִ/קְצֹ֑ר וְ/לֶ֥קֶט קְצִֽירְ/ךָ֖ לֹ֥א תְלַקֵּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/009.yaml
  text: When you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest.
translation:
  language: fr
  text: Lorsque vous ferez la moisson de votre terre, tu ne moissonneras pas jusqu’à l’extrémité[a] de ton champ et tu ne ramasseras pas les glanures de ta moisson.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le coin ». Le mot hébreu peut désigner le bord, le côté ou le coin d’un champ ; ici, il désigne sa partie extérieure, qui doit rester non moissonnée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם
  choice: Quand vous moissonnerez
  rationale: La construction avec infinitif introduit une circonstance temporelle. Le futur convient au style législatif français et le pluriel du texte hébreu est conservé.
- source_word: קְצִיר אַרְצְכֶם
  choice: les récoltes de votre terre
  rationale: קְצִיר désigne ici la récolte agricole, tandis que אֶרֶץ renvoie à la terre cultivée plutôt qu’à une entité politique. Le pluriel français évite la tournure peu naturelle « moissonner la moisson ».
- source_word: לֹא תְכַלֶּה ... לִקְצֹר
  choice: tu ne moissonneras pas entièrement
  rationale: Le piel de כלה exprime l’idée d’achever ou d’épuiser. La formulation rend explicite l’action de moissonner indiquée par l’infinitif לִקְצֹר et interdit de dépouiller complètement la limite du champ.
- source_word: פְּאַת שָׂדְךָ
  choice: le bord de ton champ
  rationale: פֵּאָה peut désigner un bord, un côté ou un coin. « Le bord » exprime naturellement la partie extérieure du champ sans imposer une forme géométrique précise.
- source_word: לֶקֶט קְצִירְךָ
  choice: ce qui reste à glaner de ta moisson
  rationale: לֶקֶט désigne les produits épars ou laissés après la récolte. Cette expression française reste compréhensible et précise sans limiter indûment le référent aux seuls épis tombés.
- source_word: לֹא תְלַקֵּט
  choice: tu ne ramasseras pas
  rationale: Le verbe לקט signifie ramasser ou recueillir les restes de la récolte. « Ramasser » distingue clairement l’action interdite de ce qui est laissé aux glaneurs.
theological_decisions:
- issue: Passage du pluriel au singulier dans l’adresse
  choice: Conserver « vous » dans la proposition temporelle, puis « tu/ton/ta » dans les commandements
  alternative: Uniformiser toute l’adresse au pluriel ou au singulier
  rationale: L’hébreu passe réellement du pluriel בְקֻצְרְכֶם / אַרְצְכֶם au singulier שָׂדְךָ / קְצִירְךָ / תְלַקֵּט. Le maintien de ce changement respecte l’adresse collective suivie de son application à chaque propriétaire.
translation_notes:
  register: Français international moderne, clair et digne. Le changement du pluriel au singulier, marqué dans l’hébreu, est volontairement conservé. Le vocabulaire agricole reste accessible, avec « glaner » employé dans son sens précis et encore courant.
