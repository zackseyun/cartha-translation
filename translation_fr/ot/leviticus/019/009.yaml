revisions:
- from: Quand vous moissonnerez les récoltes de votre terre, tu ne moissonneras pas entièrement le bord[a] de ton champ et tu ne ramasseras pas ce qui reste à glaner de ta moisson.
  to: Lorsque vous ferez la moisson de votre terre, tu ne moissonneras pas jusqu’à l’extrémité[a] de ton champ et tu ne ramasseras pas les glanures de ta moisson.
  rationale: La révision conserve l’alternance pluriel-singulier du texte hébreu, mais remplace les formulations françaises moins naturelles ou moins directes. Elle restitue le singulier de « moisson », clarifie l’interdiction de moissonner jusqu’à la limite du champ et emploie « glanures » pour le terme agricole לֶקֶט. La note est maintenue avec son ancre déplacée sur le terme rendu.
