source:
  edition: WLC
  text: וְ/שֶׂ֣רֶט לָ/נֶ֗פֶשׁ לֹ֤א תִתְּנוּ֙ בִּ/בְשַׂרְ/כֶ֔ם וּ/כְתֹ֣בֶת קַֽעֲקַ֔ע לֹ֥א תִתְּנ֖וּ בָּ/כֶ֑ם אֲנִ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/028.yaml
  text: You shall not make any cuts in your flesh for the dead[a], and you shall not put a tattoo mark on yourselves[b]. I am Yahweh.
translation:
  language: fr
  text: Vous ne ferez pas d’incisions dans votre chair pour un mort[a], et vous ne vous ferez pas de marque de tatouage[b]. Je suis Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour une personne morte ». L’expression hébraïque est idiomatique et renvoie couramment à une pratique de deuil pour les morts.
    reason: lexical_alternative
  - marker: b
    text: Ou « une inscription » ou « un tatouage ». L’expression hébraïque est rare et désigne probablement une marque corporelle permanente.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂרֶט
  choice: incisions
  rationale: Le nom désigne une coupure ou une entaille pratiquée dans le corps. « Incisions » est naturel en français et n’en précise ni l’instrument ni la gravité.
- source_word: לָנֶפֶשׁ
  choice: pour un mort
  rationale: Dans ce contexte légal lié au deuil, נֶפֶשׁ désigne idiomatiquement une personne morte. Le singulier français conserve celui de l’hébreu.
- source_word: בִּבְשַׂרְכֶם
  choice: dans votre chair
  rationale: Cette formulation conserve le langage corporel concret de בָּשָׂר ainsi que la préposition hébraïque, tout en restant compréhensible.
- source_word: כְתֹבֶת קַעֲקַע
  choice: marque tatouée
  rationale: L’expression rare associe l’idée d’une inscription ou marque à celle d’un signe corporel probablement permanent. « Marque tatouée » traduit prudemment l’expression sans prétendre en résoudre toute l’incertitude lexicale.
- source_word: לֹא תִתְּנוּ ... בָּכֶם
  choice: vous ne vous ferez pas
  rationale: Dans ce contexte, נתן avec ב exprime l’application d’une marque sur le corps. La tournure pronominale est idiomatique en français.
- source_word: אֲנִי יְהוָה
  choice: Je suis Yahvé
  rationale: La formule d’auto-identification est rendue directement, et le nom divin est translittéré selon la ligne éditoriale fournie par le texte anglais audité.
theological_decisions:
- issue: Portée de l’interdiction des marques corporelles
  choice: Traduire séparément l’incision faite pour un mort et la marque tatouée, sans limiter ni étendre explicitement la seconde interdiction
  alternative: Rapporter les deux interdictions uniquement aux rites funéraires, ou présenter le verset comme une interdiction explicitement universelle de tout tatouage moderne
  rationale: La précision « pour un mort » suit grammaticalement la première interdiction et n’est pas répétée dans la seconde. La traduction préserve cette tension sans trancher une question d’application que le texte ne formule pas.
translation_notes:
  register: Français international moderne, digne et direct. Le futur à valeur injonctive convient au registre légal biblique sans être archaïque. « Chair » garde l’image concrète de l’hébreu; les notes signalent les deux principales incertitudes lexicales.
