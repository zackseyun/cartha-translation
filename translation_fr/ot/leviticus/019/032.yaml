id: LEV.19.32
reference: Leviticus 19:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִ/פְּנֵ֤י שֵׂיבָה֙ תָּק֔וּם וְ/הָדַרְתָּ֖ פְּנֵ֣י זָקֵ֑ן וְ/יָרֵ֥אתָ מֵּ/אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/032.yaml
  text: You shall rise before gray hair[a], and you shall honor the face of an old man, and you shall fear your God[b]; I am Yahweh.
translation:
  language: fr
  text: Tu te lèveras devant les cheveux blancs[a] et tu honoreras le vieillard[b]. Tu craindras ton Dieu. Je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en présence d’une personne aux cheveux blancs ». L’hébreu emploie concrètement « cheveux blancs » pour évoquer le grand âge.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tu honoreras le visage d’un vieillard »; cette expression signifie lui témoigner de l’honneur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי שֵׂיבָה
  choice: devant les cheveux blancs
  rationale: Cette formulation conserve l’image concrète de l’hébreu, où les cheveux blancs représentent la personne âgée, tout en exprimant naturellement l’idée de se lever en sa présence.
- source_word: תָּקוּם
  choice: tu te lèveras
  rationale: Le verbe קום désigne ici le fait de se lever en signe de respect. Le futur français a une valeur injonctive adaptée au contexte légal.
- source_word: וְהָדַרְתָּ פְּנֵי זָקֵן
  choice: et tu honoreras le vieillard
  rationale: Le piel de הדר commande de témoigner de l’honneur. La traduction rend idiomatiquement l’expression hébraïque littérale « honorer le visage d’un vieillard », sans effacer le masculin singulier du texte source.
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: Tu craindras ton Dieu
  rationale: « Craindre » maintient la force de ירא et la tension biblique entre crainte, respect et révérence envers Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à sa présence explicite dans le texte hébreu.
theological_decisions:
- issue: Portée du masculin זָקֵן
  choice: le vieillard
  alternative: la personne âgée ; l’ancien
  rationale: Le texte hébreu emploie un masculin singulier. La traduction le conserve sans prétendre que le principe exclut les femmes âgées.
- issue: Sens de la crainte de Dieu
  choice: tu craindras ton Dieu
  alternative: tu révéreras ton Dieu ; tu respecteras ton Dieu
  rationale: « Craindre » préserve la force et la tension théologique du verbe ירא, plutôt que de le réduire au simple respect.
- issue: Rendu du nom divin
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte le tétragramme יְהוָה; sa translittération préserve le nom personnel au lieu de lui substituer un titre.
translation_notes:
  register: Français moderne, digne et direct. Le tutoiement singulier reproduit l’adresse personnelle de l’hébreu. Le futur simple porte ici la valeur de commandement caractéristique du registre légal biblique.
