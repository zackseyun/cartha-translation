source:
  edition: WLC
  text: לֹא תַעֲשׂ֥וּ עָ֨וֶל֙ בַּ/מִּשְׁפָּ֔ט לֹא תִשָּׂ֣א פְנֵי דָ֔ל וְ/לֹ֥א תֶהְדַּ֖ר פְּנֵ֣י גָד֑וֹל בְּ/צֶ֖דֶק תִּשְׁפֹּ֥ט עֲמִיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/015.yaml
  text: You shall not commit injustice in judgment. You shall not show partiality to the poor, nor honor the face of the great; with righteousness you shall judge your neighbor.
translation:
  language: fr
  text: Vous ne commettrez pas d’injustice en rendant un jugement. Tu ne favoriseras pas le pauvre ni ne feras preuve de déférence envers une personne de haut rang[a] ; tu jugeras ton prochain avec justice[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les expressions hébraïques signifient littéralement « relever le visage du pauvre » et « honorer le visage d’une personne de haut rang » ; dans ce contexte judiciaire, elles désignent deux formes de partialité.
    reason: cultural_note
  - marker: b
    text: 'Ou : « avec droiture » ou « de manière juste ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָוֶל בַּמִּשְׁפָּט
  choice: injustice en rendant un jugement
  rationale: Cette formulation exprime clairement la perversion de la justice dans un cadre judiciaire, tout en restant naturelle en français moderne.
- source_word: תִשָּׂא פְנֵי דָל
  choice: favoriseras une personne pauvre
  rationale: L’expression idiomatique « relever le visage » signifie ici accorder un traitement de faveur. « Une personne pauvre » rend le sens social de דָּל sans employer le masculin générique comme seule forme.
- source_word: תֶהְדַּר פְּנֵי גָדוֹל
  choice: traiteras une personne importante avec déférence
  rationale: Le syntagme vise une partialité déférente envers quelqu’un de rang élevé. Cette formulation conserve la nuance d’honneur ou de considération excessive sans le calque peu naturel « honorer le visage ».
- source_word: בְּצֶדֶק
  choice: avec droiture
  rationale: צֶדֶק associe ici rectitude morale et justice judiciaire. « Avec droiture » conserve cette portée morale, tandis qu’une note signale l’autre traduction contextuelle possible.
- source_word: תִּשְׁפֹּט עֲמִיתֶךָ
  choice: tu jugeras ton prochain
  rationale: La traduction garde le verbe judiciaire direct et rend עָמִית par « prochain », terme naturel dans le contexte de Lévitique 19 pour un membre de la communauté.
theological_decisions:
- issue: Portée morale et judiciaire de צֶדֶק
  choice: avec droiture
  alternative: avec justice / de manière juste
  rationale: Le choix principal maintient la dimension éthique du nom hébreu sans effacer son application judiciaire; la note préserve explicitement l’autre lecture légitime.
- issue: Alternance du pluriel et du singulier dans l’adresse
  choice: « Vous ne commettrez » puis « Tu ne favoriseras… tu jugeras »
  alternative: Uniformiser tout le verset au pluriel ou au singulier
  rationale: L’hébreu passe réellement de la deuxième personne du pluriel à celle du singulier. La traduction conserve ce changement plutôt que de le gommer silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. Les tournures idiomatiques hébraïques sont rendues selon leur sens juridique dans le texte, puis explicitées en note. L’alternance entre l’adresse collective et individuelle est volontairement conservée.
