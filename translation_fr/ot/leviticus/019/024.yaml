  source_fidelity: La phrase principale « consacrés à célébrer Yahweh » transforme הִלּוּלִים (« louanges », « célébrations ») en infinitif dont les fruits seraient le sujet implicite. Le texte hébreu qualifie plutôt les fruits de קֹדֶשׁ et les associe, dans une construction rare, à des louanges/célébrations pour Yahweh. « Consacrés, pour la louange de Yahweh » conserve mieux cette relation sans décider si l’expression désigne strictement une offrande.
  naturalness: '« Mais la quatrième année » et le pluriel « tous ses fruits » sont naturels. En revanche, « des fruits ... à célébrer Yahweh » est peu idiomatique et sémantiquement équivoque : ce sont grammaticalement les fruits qui célébreraient Yahweh. La ponctuation proposée rend la formule française claire et digne tout en gardant sa concision.'
  terminology: « Consacrés » convient bien à קֹדֶשׁ appliqué à des fruits dans un cadre cultuel. « Yahweh » respecte le rendu retenu du tétragramme. « Louange » rend sobrement הִלּוּלִים sans introduire le terme technique « offrande », absent de l’hébreu.
