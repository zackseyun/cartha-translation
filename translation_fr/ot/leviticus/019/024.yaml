  text: But in the fourth year all its fruit shall be holy[a], for giving praise to Yahweh.
translation:
  language: fr
  text: Mais la quatrième année, tous ses fruits seront consacrés[a], pour la louange de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « saints, louanges pour Yahweh » ou « saints, pour la louange de Yahweh ». L’expression hébraïque est rare et peut évoquer des louanges ou une célébration liés à ces fruits consacrés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הָרְבִיעִת
  choice: Mais la quatrième année
  rationale: Le ו marque ici naturellement le contraste avec les trois années précédentes; la tournure temporelle française n’exige pas de rendre ב par « dans ».
- source_word: יִהְיֶה כָּל פִּרְיוֹ
  choice: tous ses fruits seront
  rationale: Le singulier collectif hébreu désigne l’ensemble de la production de l’arbre; le pluriel « fruits » est idiomatique en français.
- source_word: קֹדֶשׁ
  choice: consacrés
  rationale: Dans ce contexte cultuel, « consacrés » exprime que les fruits sont saints, c’est-à-dire mis à part pour Dieu, tout en donnant une phrase française naturelle.
- source_word: הִלּוּלִים
  choice: à célébrer
  rationale: Ce nom pluriel rare évoque les louanges ou la célébration. La formulation conserve cette portée sans introduire l’idée plus précise d’une offrande, absente du terme hébreu.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: La préposition ל est intégrée à la construction finale « à célébrer Yahweh »; le nom divin יהוה est translittéré afin de préserver le nom propre présent dans le texte.
theological_decisions:
- issue: Sens de קֹדֶשׁ הִלּוּלִים לַיהוָה
  choice: consacrés à célébrer Yahweh
  alternative: saints, louanges pour Yahweh
  rationale: La traduction principale rend lisiblement la destination sacrée et festive des fruits, tandis qu’une note préserve la construction rare et l’ambiguïté du rapport entre « sainteté », « louanges » et Yahweh.
translation_notes:
  register: Français moderne, clair et digne. « Consacrés » est plus naturel ici que « saints » pour des fruits, tandis que la note conserve la formulation plus formelle et l’ambiguïté de l’hébreu.
