id: LEV.19.14
reference: Leviticus 19:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹא תְקַלֵּ֣ל חֵרֵ֔שׁ וְ/לִ/פְנֵ֣י עִוֵּ֔ר לֹ֥א תִתֵּ֖ן מִכְשֹׁ֑ל וְ/יָרֵ֥אתָ מֵּ/אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/014.yaml
  text: 'You shall not curse a deaf man[a], and before a blind man you shall not put a stumbling block; but you shall fear your God: I am Yahweh.'
translation:
  language: fr
  text: Tu ne maudiras pas un sourd[a] et tu ne mettras pas d’obstacle devant un aveugle. Mais tu craindras ton Dieu. Je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une personne sourde » et « une personne aveugle ». L’hébreu emploie des formes masculines singulières comme exemples représentatifs dans cette loi.
    reason: Précision sur la forme grammaticale et la portée représentative des exemples.
lexical_decisions:
- source_word: תְקַלֵּל
  choice: maudiras
  rationale: Dans cette forme, קלל peut signifier maudire ou traiter avec mépris. « Maudire » exprime directement la portée verbale et morale de l’interdiction.
- source_word: חֵרֵשׁ
  choice: un sourd
  rationale: Le terme hébreu est au masculin singulier et présente un cas juridique concret ayant une portée représentative. Cette formulation est naturelle en français.
- source_word: לִפְנֵי
  choice: devant
  rationale: « Devant » conserve clairement le sens spatial de la préposition dans ce contexte.
- source_word: עִוֵּר
  choice: un aveugle
  rationale: Comme חֵרֵשׁ, le mot est au masculin singulier et sert d’exemple représentatif dans la loi.
- source_word: תִתֵּן
  choice: mettras
  rationale: Bien que נתן signifie souvent « donner », le français emploie naturellement « mettre » avec « obstacle ».
- source_word: מִכְשֹׁל
  choice: d’obstacle
  rationale: Le nom désigne ce qui fait trébucher. « Obstacle » est clair et idiomatique, tout en préservant l’image concrète du texte.
- source_word: וְיָרֵאתָ
  choice: Mais tu craindras
  rationale: Le waw peut simplement coordonner, mais la clause oppose à l’abus commis à l’insu de la victime la responsabilité de celui qui doit révérer Dieu. « Mais » rend naturellement cette fonction discursive.
- source_word: מֵאֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Avec ירא, la préposition מן introduit idiomatiquement l’objet de la crainte ; en français, on dit « craindre ton Dieu ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Masculins singuliers représentatifs dans la législation
  choice: « un sourd » et « un aveugle »
  alternative: « une personne sourde » et « une personne aveugle », ou « les sourds » et « les aveugles »
  rationale: L’hébreu formule les deux exemples au masculin singulier. La traduction conserve cette forme concrète tout en signalant que ces cas ont une portée représentative.
- issue: Valeur de la dernière proposition motivante
  choice: « Mais tu craindras ton Dieu »
  alternative: « Et tu craindras ton Dieu »
  rationale: Le texte passe d’abus qui peuvent échapper à la perception ou au contrôle de la victime à la responsabilité devant Dieu. « Mais » exprime ce contraste sans modifier le contenu du commandement.
translation_notes:
  register: Français international actuel, simple et digne. Le tutoiement singulier reflète les verbes et suffixes hébreux de deuxième personne masculine singulière. Les termes concrets « sourd », « aveugle » et « obstacle » maintiennent la force directe de la prescription.
