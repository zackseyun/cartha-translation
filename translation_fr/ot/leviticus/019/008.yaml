id: LEV.19.8
reference: Leviticus 19:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֹֽכְלָי/ו֙ עֲוֺנ֣/וֹ יִשָּׂ֔א כִּֽי אֶת קֹ֥דֶשׁ יְהוָ֖ה חִלֵּ֑ל וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/008.yaml
  text: Whoever eats it shall bear his iniquity[a], because he has profaned the holy thing of Yahweh[d][c][b], and that person shall be cut off from his people.
translation:
  language: fr
  text: Celui qui en mangera portera sa faute[a], car il a profané ce qui est consacré à Yahvé[b] ; cette personne[c] sera retranchée de son peuple[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « portera sa culpabilité ». L’expression hébraïque peut englober à la fois la culpabilité et les conséquences qui en découlent.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de ce qui a été mis à part pour Yahvé, ici de la viande du sacrifice mentionnée dans le contexte.
    reason: cultural_note
  - marker: c
    text: Littéralement « cette âme » ; dans ce contexte juridique, le terme hébreu désigne la personne tout entière.
    reason: lexical_alternative
  - marker: d
    text: « Sera retranchée » est une formule de sanction liée à l’alliance. Le verset ne précise pas si elle désigne la mort, l’exclusion de la communauté ou un jugement direct de Dieu.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֹכְלָיו
  choice: Celui qui en mangera
  rationale: Le participe muni d’un suffixe désigne de manière générale quiconque mange la viande sacrificielle évoquée dans le contexte précédent. Cette formulation est naturelle en français et conserve le singulier générique.
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: portera sa faute
  rationale: L’expression hébraïque associe la culpabilité aux conséquences qui en découlent. « Porter sa faute » conserve cette densité sans préciser indûment qu’il s’agit seulement du châtiment.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison de la sanction. « Car » établit clairement ce rapport causal dans un registre digne et courant.
- source_word: קֹדֶשׁ יְהוָה
  choice: ce qui est consacré à Yahvé
  rationale: Le nom קֹדֶשׁ désigne ici une réalité sainte, mise à part pour Yahvé, en contexte la viande sacrificielle. Cette traduction reste générale comme l’hébreu sans ajouter explicitement le mot « offrande ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription usuelle en français moderne du nom divin dans le cadre du projet.
- source_word: חִלֵּל
  choice: aura profané
  rationale: Le piel de חלל signifie traiter comme ordinaire ce qui est saint. « Profaner » rend précisément cette atteinte au caractère sacré.
- source_word: וְנִכְרְתָה
  choice: sera retranchée
  rationale: Cette formulation conserve l’expression juridique et covenantale de l’hébreu sans décider si la sanction consiste en la mort, l’exclusion communautaire ou un jugement divin direct.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: cette personne
  rationale: Dans ce contexte juridique, נֶפֶשׁ désigne l’être humain concerné dans son ensemble. « Cette personne » est plus naturel que le littéral « cette âme ».
- source_word: מֵעַמֶּיהָ
  choice: de son peuple
  rationale: Le suffixe féminin s’accorde grammaticalement avec נֶפֶשׁ. En français, « son peuple » exprime naturellement l’appartenance collective de la personne concernée.
theological_decisions:
- issue: Sens de la formule de sanction « être retranché »
  choice: Conserver la formule « sera retranchée » sans en préciser le mécanisme.
  alternative: « sera mise à mort », « sera exclue » ou « sera supprimée par un jugement divin »
  rationale: Le verset affirme nettement la sanction, mais n’en indique pas ici le mode précis. La traduction préserve donc l’ambiguïté juridique et théologique du texte.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le relief juridique de l’hébreu tout en évitant des tournures artificiellement littérales. Le futur antérieur « aura profané » présente la profanation comme le motif accompli de la sanction.
