id: LEV.19.23
reference: Leviticus 19:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כִי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ וּ/נְטַעְתֶּם֙ כָּל עֵ֣ץ מַאֲכָ֔ל וַ/עֲרַלְתֶּ֥ם עָרְלָת֖/וֹ אֶת פִּרְי֑/וֹ שָׁלֹ֣שׁ שָׁנִ֗ים יִהְיֶ֥ה לָ/כֶ֛ם עֲרֵלִ֖ים לֹ֥א יֵאָכֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/023.yaml
  text: When you come into the land and plant any kind of tree for food[a], you shall regard its fruit as uncircumcised. For three years it shall be forbidden to you; it shall not be eaten.
translation:
  language: fr
  text: Quand vous entrerez dans le pays et que vous planterez toutes sortes d’arbres fruitiers, vous considérerez leurs fruits comme incirconcis[a]. Pendant trois ans, ils seront incirconcis pour vous ; ils ne devront pas être mangés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « incirconcis ». Ce terme est employé ici comme une métaphore : durant les trois premières années, les fruits ne sont pas encore autorisés à être mangés.'
    reason: Clarification d’une métaphore hébraïque dont la traduction littérale pourrait autrement sembler obscure.
lexical_decisions:
- source_word: וְכִי תָבֹאוּ אֶל הָאָרֶץ
  choice: Quand vous entrerez dans le pays
  rationale: Dans cette instruction juridique, כִּי introduit une circonstance future. « Le pays » conserve la référence du texte sans préciser explicitement Canaan.
- source_word: וּנְטַעְתֶּם כָּל עֵץ מַאֲכָל
  choice: et que vous planterez toutes sortes d’arbres fruitiers
  rationale: Cette formulation française naturelle exprime la valeur distributive de כָּל et désigne les arbres dont les produits sont destinés à être mangés.
- source_word: וַעֲרַלְתֶּם עָרְלָתוֹ אֶת פִּרְיוֹ
  choice: vous considérerez leurs fruits comme incirconcis
  rationale: 'La tournure restitue la valeur juridique et métaphorique de la racine ערל : il s’agit d’attribuer aux fruits un statut, non de pratiquer une action physique.'
- source_word: שָׁלֹשׁ שָׁנִים יִהְיֶה לָכֶם עֲרֵלִים
  choice: Pendant trois ans, ils seront incirconcis pour vous
  rationale: La répétition d’« incirconcis » préserve celle de la racine hébraïque ainsi que la métaphore. « Pour vous » rend לָכֶם et indique le statut de ces fruits à l’égard des Israélites.
- source_word: לֹא יֵאָכֵל
  choice: ils ne devront pas être mangés
  rationale: Le passif conserve la forme impersonnelle du nifal, tandis que « devront » rend clairement la portée normative de l’interdiction.
theological_decisions:
- issue: Faut-il conserver la métaphore des fruits « incirconcis » ou la remplacer par « interdits » ?
  choice: Conserver « incirconcis » dans le texte principal
  alternative: « interdits » ou « impropres à la consommation »
  rationale: Le texte hébreu répète délibérément la racine ערל, chargée d’une image cultuelle et alliance. « Interdits » exprimerait l’effet pratique, mais effacerait cette image et sa répétition. La note explique donc le sens contextuel sans résoudre la métaphore dans le texte.
translation_notes:
  register: Français international moderne, clair et digne. Le futur convient à l’instruction donnée en vue de l’entrée dans le pays. Le pluriel « leurs fruits / ils » est naturel en français et explicite la valeur collective du singulier hébreu.
