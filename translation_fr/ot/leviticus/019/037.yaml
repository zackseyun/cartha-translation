id: LEV.19.37
reference: Leviticus 19:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֤ם אֶת כָּל חֻקֹּתַ/י֙ וְ/אֶת כָּל מִשְׁפָּטַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֖י יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/037.yaml
  text: So you shall keep all my statutes and all my judgments[a], and do them. I am Yahweh.
translation:
  language: fr
  text: Vous respecterez donc toutes mes prescriptions et toutes mes règles[a], et vous les mettrez en pratique. Je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes mes lois et toutes mes décisions ». L’hébreu emploie deux termes juridiques distincts.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Vous respecterez donc
  rationale: Dans un contexte d’alliance et de droit, שׁמר signifie observer ou respecter. « Donc » exprime ici la portée récapitulative de la conclusion du chapitre, tout en rendant naturellement la conjonction hébraïque.
- source_word: כָּל
  choice: toutes
  rationale: Conserve la portée exhaustive des deux occurrences de כָּל.
- source_word: חֻקֹּתַי
  choice: mes prescriptions
  rationale: חֻקִּים désigne des dispositions prescrites ou établies. « Prescriptions » appartient au registre juridique courant et reste distinct de מִשְׁפָּטִים.
- source_word: מִשְׁפָּטַי
  choice: mes règles
  rationale: מִשְׁפָּטִים peut désigner des règles, décisions judiciaires ou ordonnances. « Règles » est clair en français moderne et préserve, avec « prescriptions », les deux termes juridiques distincts de l’hébreu.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: et vous les mettrez en pratique
  rationale: Avec des dispositions légales comme objet, עשה signifie exécuter ou mettre en pratique. Cette formulation est plus naturelle en français que le calque « les faire ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin plutôt que de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le nom divin. « Yahweh » le représente comme nom propre sans le remplacer par un titre, tout en évitant d’imposer une lecture confessionnelle particulière.
- issue: Rapport entre l’observance et la mise en pratique
  choice: 'Conserver les deux verbes : « respecterez » et « mettrez en pratique »'
  alternative: Fusionner en une seule injonction, par exemple « vous appliquerez »
  rationale: L’hébreu coordonne שׁמר et עשה. La traduction maintient cette insistance sans préciser au-delà du texte le rapport théologique entre disposition intérieure, fidélité et action.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur à valeur injonctive garde la forme solennelle de la prescription hébraïque. « Prescriptions » et « règles » évitent un vocabulaire excessivement archaïque tout en maintenant la distinction lexicale.
