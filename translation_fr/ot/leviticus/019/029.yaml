source:
  edition: WLC
  text: אַל תְּחַלֵּ֥ל אֶֽת בִּתְּ/ךָ֖ לְ/הַזְנוֹתָ֑/הּ וְ/לֹא תִזְנֶ֣ה הָ/אָ֔רֶץ וּ/מָלְאָ֥ה הָ/אָ֖רֶץ זִמָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/029.yaml
  text: Do not profane your daughter by making her a prostitute[c][b][a], lest the land become prostituted and the land be filled with depravity.
translation:
  language: fr
  text: Ne profane pas ta fille en la livrant à la prostitution[a], de peur que le pays ne se prostitue[b] et ne se remplisse de dépravation[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en la poussant à se prostituer » ou « en la prostituant ». Le verbe hébreu est à la forme causative.'
    reason: lexical_alternative
  - marker: b
    text: 'Le pays est personnifié : l’expression évoque une corruption qui gagne l’ensemble de la société.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « conduite infâme », « débauche » ou « perversité ». Le terme hébreu désigne une grave dépravation morale, souvent de nature sexuelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַלֵּל
  choice: profane
  rationale: Le piel de חלל signifie ici traiter comme profane. « Profaner » conserve le vocabulaire caractéristique de la sainteté dans le Lévitique.
- source_word: בִּתְּךָ
  choice: ta fille
  rationale: Le nom singulier avec suffixe masculin singulier est rendu directement, conformément au tutoiement des prescriptions adressées à l’Israélite.
- source_word: לְהַזְנוֹתָהּ
  choice: en la prostituant
  rationale: L’infinitif hifil de זנה avec suffixe féminin singulier a une valeur causative. Cette formulation concise conserve la responsabilité de celui qui pousse sa fille à la prostitution.
- source_word: תִזְנֶה הָאָרֶץ
  choice: le pays ne se prostitue
  rationale: La construction personnifie le pays et lui applique métaphoriquement le verbe « se prostituer ». La métaphore est préservée sans être réduite à une simple idée de déclin moral.
- source_word: וּמָלְאָה הָאָרֶץ
  choice: ne se remplisse
  rationale: Dans la proposition de crainte introduite en français par « de peur que », le subjonctif exprime naturellement la conséquence redoutée.
- source_word: זִמָּה
  choice: dépravation
  rationale: Le terme désigne une conduite scandaleuse et moralement perverse, souvent sexuelle. « Dépravation » garde à la fois cette gravité et une certaine ampleur sémantique.
theological_decisions:
- issue: Maintien de la métaphore du pays qui « se prostitue »
  choice: Conserver « le pays ne se prostitue » dans le texte principal.
  alternative: « le pays ne sombre dans l’immoralité »
  rationale: Le texte hébreu personnifie explicitement le pays au moyen du même champ lexical que la première proposition. Maintenir cette tension rhétorique évite d’aplanir l’image en une affirmation morale générique.
- issue: Maintien du registre saint-profane propre au Lévitique
  choice: Employer « profane ».
  alternative: « déshonore » ou « souille »
  rationale: « Profaner » rattache l’interdiction au cadre conceptuel du Lévitique, où la distinction entre saint et profane est structurante, sans ajouter une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier reflète l’adresse hébraïque. « Pays » rend ici הָאָרֶץ dans son sens territorial et communautaire; la répétition est conservée. Les trois marqueurs sont placés sur les expressions auxquelles leurs notes se rapportent.
