  variant: modern international French
source:
  edition: WLC
  text: אַל תִּפְנ֤וּ אֶל הָ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים אַל תְּבַקְשׁ֖וּ לְ/טָמְאָ֣ה בָ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/031.yaml
  text: Do not turn to mediums or to spiritists; do not seek them out[a], to become unclean by them. I am Yahweh your God.
translation:
  language: fr
  text: Ne vous tournez pas vers les médiums ni vers les devins[a] ; ne les recherchez pas, pour ne pas devenir impurs par eux. Je suis Yahweh, votre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi comprendre « ceux qui évoquent les morts » pour « médiums », et « ceux qui consultent les esprits » pour « devins ». Les termes hébreux peuvent désigner des esprits ou des praticiens associés à la consultation interdite des esprits ou des morts.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְנוּ
  choice: vous tournez vers
  rationale: Le verbe פנה signifie d’abord « se tourner vers ». Cette formulation française conserve l’image du texte hébreu tout en suggérant naturellement le recours à ces personnes, sans expliciter davantage par « consulter ».
- source_word: הָאֹבֹת
  choice: les médiums
  rationale: Dans ce contexte légal, אוֹב peut désigner soit un esprit évoqué, soit la personne qui sert d’intermédiaire pour consulter les morts. « Médiums » convient au parallélisme entre deux catégories de praticiens et reste compréhensible en français moderne ; l’ambiguïté lexicale est signalée en note.
- source_word: הַיִּדְּעֹנִים
  choice: les devins
  rationale: יִדְּעֹנִי désigne une personne associée à un savoir occulte ou à la consultation des esprits. « Devins » est naturel et digne en français contemporain, sans les connotations imaginaires que pourrait avoir « sorciers » ; la note précise le lien possible avec les esprits.
- source_word: תְּבַקְשׁוּ
  choice: ne les recherchez pas
  rationale: בקש signifie « chercher » ou « rechercher ». La traduction conserve ce sens direct et exprime la démarche active visant à trouver ces praticiens.
- source_word: לְטָמְאָה בָהֶם
  choice: sous peine de devenir impurs à leur contact
  rationale: L’infinitif de טמא exprime ici le résultat ou la finalité de cette recherche. « Devenir impurs » préserve l’état résultant sans limiter l’impureté à sa seule dimension rituelle ou morale ; « à leur contact » rend idiomatiquement בָהֶם, qui indique que l’impureté survient par leur intermédiaire ou par le recours à eux.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Cette traduction directe conserve l’adresse à la deuxième personne du pluriel et l’identification relationnelle formulée en hébreu.
theological_decisions:
- issue: Nature de l’impureté liée au recours aux pratiques occultes
  choice: devenir impurs
  alternative: devenir rituellement impurs ; vous souiller moralement
  rationale: Dans le Lévitique, טמא peut comporter des dimensions rituelles et morales. La formulation retenue maintient cette amplitude sans trancher entre elles.
- issue: Référents des termes אוֹב et יִדְּעֹנִי
  choice: Les rendre comme deux catégories de praticiens, tout en signalant l’ambiguïté en note
  alternative: Les rendre directement comme des esprits ou des esprits des morts
  rationale: Le contexte de l’interdiction et le parallélisme favorisent ici les praticiens auxquels on a recours, mais les termes hébreux restent étroitement liés aux esprits invoqués. La note préserve cette tension lexicale.
translation_notes:
  register: Français international moderne, clair et digne. Le pluriel « vous » est maintenu dans toute la phrase. « Sous peine de » exprime naturellement le résultat redouté sans réduire l’impureté à une catégorie précise.
