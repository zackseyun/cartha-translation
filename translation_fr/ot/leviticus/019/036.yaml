  variant: modern international French
source:
  edition: WLC
  text: מֹ֧אזְנֵי צֶ֣דֶק אַבְנֵי צֶ֗דֶק אֵ֥יפַת צֶ֛דֶק וְ/הִ֥ין צֶ֖דֶק יִהְיֶ֣ה לָ/כֶ֑ם אֲנִי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/036.yaml
  text: You shall have honest scales[a], honest weights, an honest ephah, and an honest hin. I am Yahweh your God[c][b], who brought you out of the land of Egypt.
translation:
  language: fr
  text: Vous aurez des balances justes[a], des poids justes, un épha juste[b] et un hin juste[c]. Je suis Yahvé, votre Dieu, qui vous ai fait sortir du pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire par « balances exactes » ou « balances honnêtes ». Le mot hébreu répété dans ce verset est צֶדֶק, souvent rendu par « justice » ou « droiture » ; il s’applique ici aux instruments et aux mesures du commerce.
    reason: lexical_alternative
  - marker: b
    text: L’épha était une ancienne mesure de capacité utilisée pour les matières sèches.
    reason: cultural_note
  - marker: c
    text: Le hin était une ancienne mesure de capacité, notamment utilisée pour les liquides.
    reason: cultural_note
lexical_decisions:
- source_word: מֹאזְנֵי צֶדֶק
  choice: des balances justes
  rationale: מֹאזְנַיִם désigne des balances servant à peser. « Justes » conserve le lien explicite avec צֶדֶק, la justice ou la droiture, tout en exprimant ici l’exactitude honnête exigée dans le commerce.
- source_word: אַבְנֵי צֶדֶק
  choice: des poids justes
  rationale: אַבְנֵי signifie littéralement « pierres », mais désigne ici les poids de pierre employés pour peser. « Poids » rend clairement cette fonction, tandis que la répétition de « justes » reproduit celle de צֶדֶק.
- source_word: אֵיפַת צֶדֶק
  choice: un épha juste
  rationale: אֵיפָה est une ancienne unité de capacité pour les matières sèches. La translittération « épha » préserve la réalité culturelle du texte sans proposer une conversion moderne incertaine.
- source_word: וְהִין צֶדֶק
  choice: et un hin juste
  rationale: הִין est une ancienne unité de capacité, notamment pour les liquides. Le terme est conservé par translittération et reçoit le même qualificatif que les trois expressions précédentes.
- source_word: יִהְיֶה לָכֶם
  choice: Vous aurez
  rationale: Littéralement « sera pour vous ». Dans ce contexte prescriptif, « Vous aurez » exprime naturellement en français l’obligation de posséder et d’utiliser de tels instruments et mesures.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française « Yahvé » représente le nom divin יהוה comme nom propre plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Dans la formule d’alliance avec יהוה, אֱלֹהֵיכֶם a un sens singulier et se traduit naturellement par « votre Dieu ».
- source_word: הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: qui vous ai fait sortir du pays d’Égypte
  rationale: Cette formulation française naturelle conserve la première personne du verbe hébreu, rattachée à « Je suis Yahvé », et la formule de l’exode qui fonde l’exigence donnée.
theological_decisions:
- issue: Sens de צֶדֶק répété dans une loi commerciale
  choice: justes
  alternative: honnêtes / exacts
  rationale: « Justes » maintient le champ sémantique de la justice et de la droiture ainsi que la répétition insistante de l’hébreu. Dans ce contexte, le mot implique des instruments et mesures exacts, sans fraude. La note signale cette portée contextuelle.
- issue: Traitement des anciennes unités de mesure
  choice: conserver « épha » et « hin »
  alternative: mesure de matières sèches / mesure de liquides, ou conversions modernes
  rationale: Les translittérations préservent les unités propres au monde biblique. Des notes brèves donnent l’information nécessaire sans imposer des équivalences modernes discutables.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « juste » restitue la cadence juridique et morale du texte hébreu. Les termes culturels « épha » et « hin » sont conservés et expliqués en notes.
