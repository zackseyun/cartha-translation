source:
  edition: WLC
  text: וְ/כִֽי יָג֧וּר אִתְּ/ךָ֛ גֵּ֖ר בְּ/אַרְצְ/כֶ֑ם לֹ֥א תוֹנ֖וּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/033.yaml
  text: When a foreigner resides with you in your land[b][a], you shall not mistreat him.
translation:
  language: fr
  text: Si un étranger[a] séjourne avec toi dans votre pays, vous ne le maltraiterez pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu désigne ici une personne non autochtone qui réside parmi les Israélites ; on peut aussi traduire par « résident étranger » ou « immigré ».
    reason: cultural_note
  - marker: b
    text: Ou « vous ne l’opprimerez pas » ou « vous ne lui ferez pas de tort ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Si
  rationale: Cette expression introduit ici un cas envisagé par la loi. « Si » restitue naturellement la construction conditionnelle, sans exclure que la situation soit attendue.
- source_word: יָגוּר
  choice: vient résider
  rationale: Le verbe גור désigne le fait de séjourner ou de vivre quelque part en tant que non-autochtone. « Vient résider » exprime clairement l’établissement parmi la population locale.
- source_word: אִתְּךָ
  choice: avec toi
  rationale: La préposition et son suffixe sont au singulier. La traduction conserve cette adresse individuelle, malgré le passage au pluriel dans la suite du verset.
- source_word: גֵּר
  choice: étranger
  rationale: Le terme désigne ici un non-Israélite établi parmi les Israélites, et non un simple voyageur. « Étranger » est courant et digne; la note précise son statut de résident.
- source_word: בְּאַרְצְכֶם
  choice: dans votre pays
  rationale: אֶרֶץ désigne ici le territoire où vit la communauté. « Pays » est naturel en français moderne et le possessif pluriel conserve l’adresse collective de l’hébreu.
- source_word: לֹא תוֹנוּ
  choice: vous ne le maltraiterez pas
  rationale: Le hiphil de ינה peut exprimer le fait de faire du tort, de maltraiter ou d’opprimer. « Maltraiter » est clair et suffisamment large; les principales nuances sont signalées en note.
- source_word: אֹתוֹ
  choice: le
  rationale: Le pronom objet masculin singulier renvoie directement à גֵּר; le français en conserve le genre grammatical et la référence.
theological_decisions:
- issue: Sens de גֵּר dans la législation de sainteté
  choice: étranger
  alternative: immigré; résident étranger; personne venue d’ailleurs
  rationale: Le mot désigne une personne non autochtone qui réside durablement au sein d’Israël et bénéficie de sa protection sociale et juridique. « Étranger » reste lisible et non technique, tandis que le verbe « vient résider » et la note empêchent de le comprendre comme un simple inconnu ou voyageur.
- issue: Portée de l’interdiction exprimée par ינה
  choice: maltraiter
  alternative: opprimer; léser; faire du tort
  rationale: Le terme peut viser diverses formes de tort ou d’oppression. La traduction principale garde cette portée générale sans réduire le commandement à une catégorie particulière d’abus.
translation_notes:
  register: Français international moderne, simple et digne. Le passage de « toi » au singulier à « votre » et « vous » au pluriel reproduit le changement de nombre présent dans l’hébreu, qui passe de l’individu à la communauté.
