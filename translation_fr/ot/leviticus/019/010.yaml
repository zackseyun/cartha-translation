source:
  edition: WLC
  text: וְ/כַרְמְ/ךָ֙ לֹ֣א תְעוֹלֵ֔ל וּ/פֶ֥רֶט כַּרְמְ/ךָ֖ לֹ֣א תְלַקֵּ֑ט לֶֽ/עָנִ֤י וְ/לַ/גֵּר֙ תַּעֲזֹ֣ב אֹתָ֔/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/010.yaml
  text: And you shall not strip your vineyard bare[a], nor shall you gather the fallen grapes of your vineyard; you shall leave them for the poor and for the sojourner[c][b]. I am Yahweh your God.
translation:
  language: fr
  text: Tu ne repasseras pas dans ta vigne pour cueillir ce qui reste[a], et tu ne ramasseras pas les raisins tombés de ta vigne[b]. Tu les laisseras au pauvre et à l’étranger[c]. Je suis Yahweh, votre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’interdiction concerne le fait de grappiller la vigne, c’est-à-dire d’y repasser après la vendange principale pour prendre les grappes restantes.
    reason: lexical_alternative
  - marker: b
    text: Ou « les raisins détachés de ta vigne » ; il s’agit des raisins tombés ou dispersés pendant la vendange.
    reason: lexical_alternative
  - marker: c
    text: Le terme hébreu désigne un étranger installé au sein de la communauté d’Israël, et non un simple voyageur de passage.
    reason: lexical_clarification
lexical_decisions:
- source_word: תְעוֹלֵל
  choice: repasseras pas dans ta vigne pour cueillir ce qui reste
  rationale: Dans ce contexte, le verbe désigne un second passage dans la vigne afin de prendre les grappes restées après la récolte principale. Cette formulation explicite l’action en français courant sans la confondre avec la vendange elle-même.
- source_word: פֶרֶט כַּרְמְךָ
  choice: les grains de raisin tombés
  rationale: פֶּרֶט désigne ici les raisins détachés ou tombés pendant la vendange. « Grains de raisin tombés » donne un référent concret et naturel.
- source_word: תְלַקֵּט
  choice: ramasseras
  rationale: לקט signifie recueillir ou ramasser. Avec des grains tombés au sol, « ramasser » est plus précis et idiomatique que « cueillir ».
- source_word: לֶעָנִי
  choice: au pauvre
  rationale: עָנִי désigne une personne pauvre ou démunie. Le singulier générique du texte hébreu est conservé.
- source_word: וְלַגֵּר
  choice: et à l’étranger qui vit parmi vous
  rationale: גֵּר désigne un non-Israélite résidant durablement au sein de la communauté, et non n’importe quel étranger de passage. La formulation retenue rend cette nuance en français actuel.
- source_word: תַּעֲזֹב אֹתָם
  choice: Tu les laisseras
  rationale: עזב exprime ici le fait de laisser ces produits à la disposition d’autres personnes. Le pronom pluriel reprend ce qui reste sur les vignes et les grains tombés.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de conserver le nom personnel présent dans le texte hébreu.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: La forme est au pluriel et appartient à la formule d’autorité qui conclut le commandement.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » en conserve la fonction de nom propre, tandis que « le SEIGNEUR » lui substituerait un titre.
- issue: Identification du גֵּר
  choice: l’étranger qui vit parmi vous
  alternative: l’immigré / l’étranger
  rationale: Le terme désigne un étranger résidant au sein d’Israël. Le rendu choisi préserve ce statut social et juridique sans lui imposer une catégorie administrative moderne.
translation_notes:
  register: Français moderne, clair et digne. Les commandements restent au singulier, conformément à l’hébreu, tandis que « votre Dieu » conserve le pluriel collectif de la formule finale. « Repasser dans la vigne » évite le caractère potentiellement technique ou ambigu de « grappiller » dans le corps du texte, tout en maintenant ce terme dans la note.
