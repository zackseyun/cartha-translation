  naturalness: La phrase actuelle est globalement compréhensible, mais « et que celle-ci soit une esclave » est une construction lourde et fautive après « Si » dans ce contexte. Une coordination explicite de la seconde condition est plus naturelle en français moderne.
  terminology: « Esclave », « rachetée » et « affranchie » conviennent au registre juridique et rendent le statut social en jeu. « Désignée pour un homme » conserve utilement l’incertitude de נֶחֱרֶפֶת sans imposer le statut de fiançailles formelles. « Enquête » reste un choix possible pour le terme rare בִּקֹּרֶת, à condition que la note maintienne les autres sens proposés.
