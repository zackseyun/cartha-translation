source:
  edition: WLC
  text: וְ֠/אִישׁ כִּֽי יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה שִׁכְבַת זֶ֗רַע וְ/הִ֤וא שִׁפְחָה֙ נֶחֱרֶ֣פֶת לְ/אִ֔ישׁ וְ/הָפְדֵּה֙ לֹ֣א נִפְדָּ֔תָה א֥וֹ חֻפְשָׁ֖ה לֹ֣א נִתַּן לָ֑/הּ בִּקֹּ֧רֶת תִּהְיֶ֛ה לֹ֥א יוּמְת֖וּ כִּי לֹ֥א חֻפָּֽשָׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/020.yaml
  text: If a man lies with a woman and has an emission of semen[a], and she is a servant woman designated for a man, but she has not been redeemed or given her freedom, there shall be an inquiry; they shall not be put to death[b], because she had not been freed.
translation:
  language: fr
  text: Si un homme couche avec une femme et émet de la semence, si elle est une esclave désignée pour un homme[a], mais qu’elle n’a été ni rachetée ni affranchie, il y aura une enquête[b]. Ils ne seront pas mis à mort, car elle n’avait pas été affranchie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fiancée à un homme » ou « promise à un homme ». L’hébreu indique probablement que cette esclave est attribuée ou promise à un homme, bien qu’elle n’ait pas le même statut juridique qu’une épouse libre.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu rendu par « enquête » est rare et son sens est incertain ; il peut aussi désigner une punition ou une compensation.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁכַּב אֶת אִשָּׁה שִׁכְבַת זֶרַע
  choice: couche avec une femme avec émission de semence
  rationale: Cette formulation conserve à la fois le caractère sexuel de l’acte et la précision juridique concernant l’émission de semence, sans réduire l’expression à un simple euphémisme.
- source_word: שִׁפְחָה
  choice: esclave
  rationale: Le statut de servitude est déterminant dans cette loi; « esclave » le rend clairement, contrairement à des termes plus atténués comme « servante ».
- source_word: נֶחֱרֶפֶת לְאִישׁ
  choice: destinée à un autre homme
  rationale: Le participe rare indique vraisemblablement qu’elle est attribuée ou promise à un homme, sans nécessairement posséder le plein statut juridique d’une femme libre fiancée. « autre » explicite naturellement en français que cet homme n’est pas celui de la première proposition, comme le contexte l’implique.
- source_word: וְהָפְדֵּה לֹא נִפְדָּתָה
  choice: sans avoir été rachetée
  rationale: « Rachetée » convient au contexte juridico-économique et exprime naturellement que le rachat n’a pas eu lieu.
- source_word: חֻפְשָׁה לֹא נִתַּן לָהּ
  choice: ni avoir reçu sa liberté
  rationale: Cette tournure française actuelle conserve l’idée juridique d’une liberté accordée à l’esclave.
- source_word: בִּקֹּרֶת
  choice: une enquête
  rationale: Le terme est rare et de sens incertain. « Enquête » rend l’idée possible d’un examen officiel sans imposer une peine précise que le mot ne permet pas d’établir avec certitude.
- source_word: לֹא יוּמְתוּ
  choice: ils ne seront pas mis à mort
  rationale: Le pluriel hébreu vise naturellement les deux personnes concernées et la tournure passive correspond à une décision judiciaire.
- source_word: כִּי לֹא חֻפָּשָׁה
  choice: puisqu’elle n’avait pas été affranchie
  rationale: « Affranchie » renvoie précisément à la libération du statut d’esclave et relie clairement la justification à la situation juridique déjà décrite.
theological_decisions:
- issue: Statut juridique exprimé par נֶחֱרֶפֶת לְאִישׁ
  choice: destinée à un autre homme
  alternative: fiancée à un homme; promise à un homme
  rationale: Le texte distingue vraisemblablement ce cas de celui d’une femme libre pleinement fiancée. La formulation retenue indique le lien envers l’homme sans trancher en faveur d’un statut matrimonial complet.
- issue: Sens de בִּקֹּרֶת
  choice: il y aura une enquête
  alternative: il y aura une punition; il y aura une compensation
  rationale: Le substantif n’apparaît qu’ici sous cette forme et son sens est débattu. Le texte principal retient une possibilité plausible, tandis que la note maintient ouvertes les autres lectures sans introduire une théorie pénale particulière.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire juridique reste accessible; « esclave » et « affranchie » préservent explicitement le statut social décisif dans le passage. La structure a été légèrement fluidifiée, tout en maintenant les ambiguïtés lexicales réelles dans les notes.
