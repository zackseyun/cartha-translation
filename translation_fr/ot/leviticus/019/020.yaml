  to: Si un homme couche avec une femme et émet de la semence, si elle est une esclave désignée pour un homme[a], mais qu’elle n’a été ni rachetée ni affranchie, il y aura une enquête[b]. Ils ne seront pas mis à mort, car elle n’avait pas été affranchie.
  rationale: La révision corrige la syntaxe conditionnelle, supprime l’ajout interprétatif « autre » et conserve les choix lexicaux prudents du projet ainsi que les deux ancres de notes. La répétition d’« affranchie » reflète intentionnellement le lien causal explicite du texte hébreu avec l’absence de libération.
