id: LEV.19.3
reference: Leviticus 19:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִ֣ישׁ אִמּ֤/וֹ וְ/אָבִי/ו֙ תִּירָ֔אוּ וְ/אֶת שַׁבְּתֹתַ֖/י תִּשְׁמֹ֑רוּ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/003.yaml
  text: Each man shall fear his mother and his father[a], and you shall keep my Sabbaths[b]. I am Yahweh your God.
translation:
  language: fr
  text: Que chacun respecte sa mère et son père[a], et que vous observiez mes sabbats. Je suis Yahweh, votre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « craigne sa mère et son père ». Le verbe hébreu peut désigner ici une crainte faite de respect et de révérence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: chacun
  rationale: Le nom masculin singulier est employé distributivement à l’égard de toute la communauté. « Chacun » rend naturellement cette portée en français moderne sans restreindre artificiellement le commandement aux seuls hommes.
- source_word: אִמּוֹ וְאָבִיו
  choice: sa mère et son père
  rationale: La traduction conserve les deux termes de parenté ainsi que l’ordre inhabituel du texte hébreu, qui place la mère avant le père.
- source_word: תִּירָאוּ
  choice: respecte
  rationale: Dans ce commandement familial, ירא exprime une crainte empreinte de révérence. « Respecter » communique clairement cette valeur en français actuel; « craindre » reste une traduction plus littérale possible et est signalée en note.
- source_word: שַׁבְּתֹתַי
  choice: mes sabbats
  rationale: Le pluriel et le possessif divin sont tous deux conservés.
- source_word: תִּשְׁמֹרוּ
  choice: observiez
  rationale: Avec les sabbats, שמר signifie veiller à leur observance. « Observer » est l’expression française naturelle et précise dans ce contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Dans la formule d’alliance avec Yahweh comme référent singulier, אֱלֹהִים désigne Dieu au singulier; le suffixe est adressé à la communauté au pluriel.
theological_decisions:
- issue: Force affective du commandement envers les parents
  choice: respecte sa mère et son père
  alternative: craigne sa mère et son père
  rationale: Le verbe ירא peut exprimer la peur, la révérence ou le respect. Le contexte filial favorise « respecter » dans le corps du texte, tout en maintenant en note la formulation plus littérale afin de ne pas effacer la force du terme hébreu.
- issue: Portée du masculin singulier distributif
  choice: Que chacun
  alternative: Que tout homme
  rationale: אִישׁ introduit une prescription individuelle adressée à l’ensemble de la communauté. En français, « chacun » en reproduit la force distributive sans décider que seuls les hommes sont visés.
- issue: Alternance entre singulier et pluriel
  choice: chacun respecte… que vous observiez
  alternative: chacun respecte… et observe
  rationale: Le texte hébreu passe du singulier distributif אִישׁ avec les suffixes singuliers au verbe pluriel תִּשְׁמֹרוּ. La traduction rend visible ce changement d’adresse plutôt que de l’harmoniser.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le passage du singulier distributif au pluriel communautaire, l’ordre « mère… père », le pluriel « sabbats » et le nom divin Yahweh.
