reference: Leviticus 19:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל כָּל עֲדַ֧ת בְּנֵי יִשְׂרָאֵ֛ל וְ/אָמַרְתָּ֥ אֲלֵ/הֶ֖ם קְדֹשִׁ֣ים תִּהְי֑וּ כִּ֣י קָד֔וֹשׁ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/002.yaml
  text: Speak to all the congregation of the sons of Israel[a], and say to them, ‘You shall be holy, for I, Yahweh your God[b], am holy.’
translation:
  language: fr
  text: '« Parle à toute la communauté des fils d’Israël[a] et dis-leur : “Vous serez saints[b], car je suis saint, moi, Yahvé, votre Dieu.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toute l’assemblée des Israélites ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Soyez saints » ou « Vous devez être saints ».'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: Parle
  rationale: L’impératif intensif adresse à Moïse un ordre direct. « Parle » est naturel en français et convient au registre solennel de la législation.
- source_word: כָּל עֲדַת
  choice: toute la communauté
  rationale: עֵדָה désigne ici la collectivité d’Israël convoquée ou considérée comme un corps. « Toute la communauté » rend explicitement כָּל et reste plus courant aujourd’hui que « toute la congrégation ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: des fils d’Israël
  rationale: Cette formulation conserve l’expression hébraïque filiale et masculine. Une formulation française plus idiomatique est indiquée en note afin de signaler que l’expression désigne collectivement les Israélites.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: et dis-leur
  rationale: La tournure reproduit simplement l’enchaînement d’ordres caractéristique du discours juridique hébreu.
- source_word: קְדֹשִׁים תִּהְיוּ
  choice: Vous serez saints
  rationale: L’adjectif prédicatif suivi de l’imparfait de היה peut exprimer une exigence, tout en gardant formellement la tournure « vous serez ». Ce choix préserve à la fois la forme et la tonalité d’alliance; les valeurs impérative et déontique sont données en note.
- source_word: קָדוֹשׁ
  choice: saint
  rationale: « Saint » est le terme français établi qui exprime ici la sainteté propre à Dieu et celle qu’il exige de son peuple; « mis à part » n’en couvrirait qu’un aspect.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin, employée plutôt qu’un titre de substitution afin de conserver le nom personnel présent dans l’hébreu.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Le suffixe hébreu est à la deuxième personne du pluriel et renvoie à toute la communauté dans la formule d’alliance.
theological_decisions:
- issue: Portée de l’expression בְּנֵי יִשְׂרָאֵל
  choice: des fils d’Israël
  alternative: des Israélites
  rationale: Le texte principal conserve la forme filiale de l’hébreu sans nier sa portée collective. La note fournit l’équivalent idiomatique qui inclut l’ensemble du peuple.
- issue: Force de l’énoncé קְדֹשִׁים תִּהְיוּ
  choice: Vous serez saints
  alternative: Soyez saints / Vous devez être saints
  rationale: L’imparfait hébreu, dans ce contexte prescriptif, porte une force impérative ou obligatoire, mais sa forme peut aussi être rendue par le futur français. La note maintient cette tension au lieu de la résoudre silencieusement.
- issue: Relation entre la sainteté du peuple et celle de Dieu
  choice: car je suis saint, moi, Yahvé, votre Dieu
  alternative: car moi, Yahvé, votre Dieu, je suis saint
  rationale: 'La formulation choisie conserve le lien causal explicite : la sainteté de Dieu fonde l’exigence adressée au peuple. Le pronom tonique « moi » restitue l’emphase de l’ordre hébreu sans ajouter d’explication doctrinale.'
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier (« Parle ») s’adresse à Moïse, puis le pluriel (« vous ») à toute la communauté. La ponctuation met en relief l’auto-identification divine sans alourdir la phrase.
