lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: dit
  rationale: Dans cette formule hébraïque introduisant une parole divine, « dit » est l’équivalent français naturel de וַיְדַבֵּר. « Parla à » serait plus formel, mais moins idiomatique ici.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin יהוה. « Yahweh » le représente directement au lieu de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition introduit ici le destinataire de la parole ; « à » est l’expression française naturelle.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française usuelle du nom hébreu מֹשֶׁה.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Après un verbe de parole, le français moderne rend naturellement cette formule hébraïque par une ponctuation annonçant le discours direct, plutôt que par le calque « en disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu emploie explicitement le tétragramme. Le rendre par « Yahweh » préserve le nom propre, tandis que « le SEIGNEUR » reflète la lecture traditionnelle qui lui substitue un titre.
translation_notes:
  register: 'Français international moderne, simple et digne. La tournure idiomatique « dit à Moïse : » évite le calque lourd « parla à Moïse, en disant » tout en conservant la fonction introductive de la formule hébraïque.'
