id: LEV.19.25
reference: Leviticus 19:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ/חֲמִישִׁ֗ת תֹּֽאכְלוּ֙ אֶת פִּרְי֔/וֹ לְ/הוֹסִ֥יף לָ/כֶ֖ם תְּבוּאָת֑/וֹ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/025.yaml
  text: And in the fifth year you may eat its fruit, so that it may increase its produce for you. I am Yahweh your God.
translation:
  language: fr
  text: La cinquième année, vous pourrez manger de ses fruits, afin que sa production augmente pour vous. Je suis Yahweh, votre Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַשָּׁנָה הַחֲמִישִׁת
  choice: La cinquième année
  rationale: Cette formulation française naturelle inscrit l’instruction dans la suite chronologique des années précédentes; la coordination hébraïque n’a pas besoin d’être exprimée séparément.
- source_word: תֹּאכְלוּ
  choice: vous pourrez manger
  rationale: Dans ce contexte légal, l’inaccompli exprime l’autorisation qui succède à l’interdiction des années précédentes.
- source_word: אֶת־פִּרְיוֹ
  choice: de ses fruits
  rationale: פְּרִי désigne ici les fruits de l’arbre; le pluriel est idiomatique en français pour une récolte fruitière, tandis que le possessif reprend l’arbre mentionné dans le contexte.
- source_word: לְהוֹסִיף
  choice: afin que … augmente
  rationale: L’infinitif avec לְ indique ici le but ou le résultat attendu; « afin que » en conserve clairement la valeur sans trancher davantage entre finalité et conséquence.
- source_word: תְּבוּאָתוֹ
  choice: sa production
  rationale: תְּבוּאָה désigne le produit ou rendement. « Production » convient à l’arbre et reste distinct de « fruits ».
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Je suis Yahweh, votre Dieu
  rationale: La formule d’alliance est rendue avec solennité et naturel, et le nom divin est translittéré conformément à la décision fournie.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel d’alliance et suit l’orientation théologique fournie, sans le remplacer par un titre.
- issue: Rapport entre l’autorisation de manger et l’augmentation de la production
  choice: afin que sa production augmente pour vous
  alternative: pour augmenter sa production à votre profit
  rationale: La construction hébraïque permet une nuance de but ou de résultat. Le rendu retenu conserve cette tension et évite d’attribuer explicitement aux mangeurs eux-mêmes l’action de faire croître la production.
translation_notes:
  register: Français international moderne, clair et digne. Le futur « pourrez » exprime naturellement la permission légale à partir de la cinquième année. Aucun marqueur de note n’est requis.
