id: LEV.19.27
reference: Leviticus 19:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹ֣א תַקִּ֔פוּ פְּאַ֖ת רֹאשְׁ/כֶ֑ם וְ/לֹ֣א תַשְׁחִ֔ית אֵ֖ת פְּאַ֥ת זְקָנֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/027.yaml
  text: You shall not round off the hair at the sides of your head[c][b][a], and you shall not mar the edges of your beard.
translation:
  language: fr
  text: Vous ne couperez pas en rond les cheveux sur les côtés de votre tête[a][b], et vous n’abîmerez pas les bords de votre barbe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les bords de votre chevelure » ou « les coins de votre tête ». Le terme hébreu peut désigner un bord, un côté ou un coin.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit probablement de raser ou de tailler en rond les cheveux situés sur les côtés de la tête.
    reason: cultural_note
  - marker: c
    text: Ou « ne détruirez pas », « ne détériorerez pas » ou « ne défigurerez pas les bords de votre barbe ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תַקִּפוּ
  choice: couperez pas en rond
  rationale: Le hifil de נקף désigne ici une coupe qui arrondit le pourtour ou les côtés de la chevelure. « Couper en rond » rend concrètement l’action sans préciser davantage la technique.
- source_word: פְּאַת רֹאשְׁכֶם
  choice: les cheveux sur les côtés de votre tête
  rationale: פֵּאָה peut signifier « bord », « côté » ou « coin ». Dans ce contexte, la formulation explicite naturellement qu’il s’agit des cheveux situés sur les côtés de la tête. Le possessif hébreu est pluriel et collectif, mais le singulier distributif français est plus idiomatique.
- source_word: תַשְׁחִית
  choice: n’abîmerez pas
  rationale: Le hifil de שׁחת signifie détruire, détériorer ou défigurer. « Abîmer » conserve l’idée d’une altération dommageable tout en restant naturel à propos de la barbe et sans imposer une méthode précise.
- source_word: פְּאַת זְקָנֶךָ
  choice: les bords de votre barbe
  rationale: פֵּאָה désigne ici les bords ou extrémités de la barbe. Le pluriel français « les bords » exprime naturellement les différentes parties concernées, bien que l’hébreu emploie le singulier collectif.
- source_word: לֹא ... וְלֹא
  choice: Vous ne… pas…, et vous ne… pas
  rationale: Cette tournure française rend clairement les deux interdictions légales coordonnées sans recourir à un style artificiellement archaïque.
theological_decisions:
- issue: Nature de l’interdiction
  choice: Une interdiction concrète de certaines manières de couper les cheveux et la barbe, sans en intégrer le motif supposé dans le texte.
  alternative: Une interdiction visant précisément des rites païens de deuil, ou plus largement des styles associés aux peuples voisins.
  rationale: Le verset énonce les gestes interdits sans en donner explicitement la raison. La traduction préserve cette retenue et n’impose pas une reconstruction culturelle ou cultuelle.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur d’interdiction convient au registre légal biblique sans archaïsme excessif. Les notes conservent l’ambiguïté lexicale et distinguent le texte de son interprétation culturelle.
