  text: לֹ֥א תֹאכְל֖וּ עַל הַ/דָּ֑ם לֹ֥א תְנַחֲשׁ֖וּ וְ/לֹ֥א תְעוֹנֵֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/026.yaml
  text: You shall not eat over the blood[b][a]. You shall not practice divination or interpret omens.
translation:
  language: fr
  text: Vous ne mangerez pas sur le sang[a]. Vous ne pratiquerez pas la divination et vous n’interpréterez pas les présages[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec le sang ». L’expression hébraïque est difficile ; elle peut désigner le fait de manger de la viande contenant encore du sang ou de participer à un repas rituel lié au sang.
    reason: alternative_reading
  - marker: b
    text: 'Le sens exact du terme hébreu est incertain. Autres traductions possibles : « pratiquer la divination », « dire la bonne aventure » ou, plus traditionnellement, « observer les temps ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאכְלוּ
  choice: Vous ne mangerez rien
  rationale: Dans ce texte juridique, l’imparfait précédé de לֹא exprime naturellement une interdiction. Le futur français conserve un registre législatif digne; « rien » permet à « sur le sang » de porter sur ce qui est mangé sans imposer le mot « viande », absent de l’hébreu.
- source_word: עַל הַדָּם
  choice: sur le sang
  rationale: L’expression est difficile et son référent précis demeure incertain. Le rendu relativement formel « sur le sang » préserve la préposition hébraïque et évite de trancher entre un aliment contenant encore du sang et un repas rituel lié au sang.
- source_word: תְנַחֲשׁוּ
  choice: pratiquerez … la divination
  rationale: Au piel, נחשׁ désigne une pratique divinatoire. « Pratiquer la divination » est clair, actuel et non archaïque.
- source_word: תְעוֹנֵנוּ
  choice: l’interprétation des présages
  rationale: Le sens exact du verbe est discuté, mais il renvoie vraisemblablement à une forme de divination ou de lecture des signes. Cette formulation française est intelligible tout en signalant dans une note les autres possibilités lexicales.
theological_decisions:
- issue: Portée précise de l’interdiction עַל הַדָּם
  choice: Conserver « sur le sang » dans le texte principal
  alternative: « avec le sang », « alors que le sang s’y trouve encore » ou une référence à un repas rituel lié au sang
  rationale: Le texte peut viser la consommation d’un aliment contenant du sang, un repas rituel accompli autour du sang, ou une autre pratique cultuelle. Le rendu principal conserve cette ambiguïté plutôt que de privilégier une interprétation.
- issue: Distinction entre נחשׁ et ענן
  choice: Rendre les deux termes par « divination » et « interprétation des présages »
  alternative: Employer « pratiques divinatoires », « dire la bonne aventure » ou, selon la tradition, « observer les temps »
  rationale: La juxtaposition suggère deux pratiques apparentées, sans permettre d’en définir avec certitude la distinction technique. Le texte garde deux expressions distinctes et la note signale l’incertitude du second terme.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur d’interdiction maintient le registre législatif. La coordination « ni… ni… » rend naturellement les deux prohibitions hébraïques successives. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
