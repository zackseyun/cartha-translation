source:
  edition: WLC
  text: וְ/כִ֧י תִזְבְּח֛וּ זֶ֥בַח שְׁלָמִ֖ים לַ/יהוָ֑ה לִֽ/רְצֹנְ/כֶ֖ם תִּזְבָּחֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/005.yaml
  text: And when you sacrifice a peace offering to Yahweh[a], you shall sacrifice it so that you may be accepted.
translation:
  language: fr
  text: Quand vous offrirez à Yahweh un sacrifice de paix, vous l’offrirez pour être agréés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « pour votre agrément » ou « pour votre acceptation ».'
    reason: La tournure hébraïque לִרְצֹנְכֶם est concise et peut viser l’agrément accordé au sacrifice et, par lui, aux personnes qui l’offrent.
lexical_decisions:
- source_word: וְכִי
  choice: Quand
  rationale: Dans cette instruction légale, כִּי introduit le cas où le sacrifice est offert. « Quand » exprime naturellement cette valeur temporelle et conditionnelle en français.
- source_word: תִזְבְּחוּ / תִּזְבָּחֻהוּ
  choice: vous offrirez / vous l’offrirez
  rationale: Le verbe זבח désigne ici l’acte sacrificiel. « Offrir » est naturel en français cultuel; sa répétition conserve celle de l’hébreu sans la lourdeur de « sacrifier un sacrifice ».
- source_word: זֶבַח שְׁלָמִים
  choice: un sacrifice de paix
  rationale: Cette expression désigne une catégorie sacrificielle précise. « Sacrifice de paix » reste proche de שְׁלָמִים et évite de privilégier l’interprétation plus explicative « sacrifice de communion ».
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל marque la destination ou la dédicace du sacrifice. Le nom divin יהוה est translittéré « Yahweh ».
- source_word: לִרְצֹנְכֶם
  choice: de manière à être agréés
  rationale: Dans le langage sacrificiel, רָצוֹן évoque l’agrément ou l’acceptation devant Dieu. Cette formulation française rend clairement la finalité tout en conservant la nuance cultuelle d’« agréer ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom d’alliance sans le remplacer par un titre.
- issue: Portée de לִרְצֹנְכֶם
  choice: de manière à être agréés
  alternative: pour votre agrément / selon votre volonté
  rationale: Le contexte sacrificiel favorise l’acceptation du fidèle ou de son offrande devant Dieu. Le rendu retenu évite de faire de la préférence personnelle de l’offrant le sens principal, tout en signalant la forme plus littérale en note.
translation_notes:
  register: Français moderne, digne et accessible. Le futur à valeur prescriptive convient naturellement à une instruction légale. « Sacrifice de paix » conserve le lien lexical avec l’hébreu, tandis que « être agréés » garde le registre cultuel sans devenir obscur.
