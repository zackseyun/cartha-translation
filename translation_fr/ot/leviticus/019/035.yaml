source:
  edition: WLC
  text: לֹא תַעֲשׂ֥וּ עָ֖וֶל בַּ/מִּשְׁפָּ֑ט בַּ/מִּדָּ֕ה בַּ/מִּשְׁקָ֖ל וּ/בַ/מְּשׂוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/035.yaml
  text: You shall not commit injustice in judgment[a], in measures of length, weight, or volume.
translation:
  language: fr
  text: Vous ne commettrez aucune injustice dans les jugements[a], ni dans les mesures de longueur, de poids ou de capacité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Vous ne commettrez aucune injustice en matière de justice, de mesure, de poids ou de capacité. »'
    reason: La construction hébraïque répète la préposition devant chacun des quatre termes, et מִשְׁפָּט peut signifier aussi bien « jugement » que « justice ».
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ
  choice: Vous ne commettrez
  rationale: Le yiqtol à la deuxième personne du pluriel, précédé de לֹא, exprime ici une interdiction. « Commettre » s’emploie naturellement avec « injustice » en français et conserve le ton juridique.
- source_word: עָוֶל
  choice: aucune injustice
  rationale: עָוֶל désigne ce qui est injuste ou malhonnête. « Aucune injustice » rend clairement la portée prohibitive dans ce contexte juridique et commercial.
- source_word: בַּמִּשְׁפָּט
  choice: dans les jugements
  rationale: מִשְׁפָּט peut désigner le jugement, la décision judiciaire ou l’exercice de la justice. Le pluriel générique est naturel en français et garde la dimension judiciaire sans exclure le principe plus large d’équité.
- source_word: בַּמִּדָּה
  choice: dans les mesures de longueur
  rationale: מִדָּה est une mesure ou dimension. Puisque le poids et la capacité sont ensuite mentionnés séparément, « longueur » distingue utilement cette première catégorie.
- source_word: בַּמִּשְׁקָל
  choice: de poids
  rationale: מִשְׁקָל désigne le poids ou l’action de peser. Dans l’énumération française, « mesures de poids » est précis et idiomatique.
- source_word: וּבַמְּשׂוּרָה
  choice: ou de capacité
  rationale: מְשׂוּרָה désigne une mesure de contenance, sans nécessairement se limiter aux liquides. « Capacité » préserve cette généralité et forme une catégorie moderne claire.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le futur à valeur injonctive maintient le registre législatif. L’énumération est légèrement explicitée pour distinguer longueur, poids et capacité, tout en conservant en note la structure plus littérale et l’ambiguïté de מִשְׁפָּט.
