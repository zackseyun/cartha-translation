  text: אֶֽת חֻקֹּתַ/י֮ תִּשְׁמֹרוּ֒ בְּהֶמְתְּ/ךָ֙ לֹא תַרְבִּ֣יעַ כִּלְאַ֔יִם שָׂדְ/ךָ֖ לֹא תִזְרַ֣ע כִּלְאָ֑יִם וּ/בֶ֤גֶד כִּלְאַ֨יִם֙ שַֽׁעַטְנֵ֔ז לֹ֥א יַעֲלֶ֖ה עָלֶֽי/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/019.yaml
  text: You shall keep my statutes. You shall not breed your livestock with two different kinds; you shall not sow your field with two kinds of seed; and a garment of mixed material[a], shaatnez, shall not come upon you.
translation:
  language: fr
  text: Vous observerez mes prescriptions. Tu ne feras pas s’accoupler des espèces différentes de ton bétail ; tu n’ensemenceras pas ton champ de deux sortes de semences ; et tu ne porteras pas de vêtement en tissu mélangé, de shaatnez[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu shaatnez est un terme technique désignant un tissu mélangé interdit, traditionnellement compris comme un mélange de laine et de lin ; voir Deutéronome 22.11.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: mes prescriptions
  rationale: Le terme חֻקָּה désigne des règles établies ayant force normative. « Prescriptions » conserve cette portée juridique dans un français moderne et naturel.
- source_word: תִּשְׁמֹרוּ
  choice: vous observerez
  rationale: Dans un contexte légal et d’alliance, שׁמר signifie respecter ou observer des commandements. « Observerez » rend clairement cette idée.
- source_word: בְּהֶמְתְּךָ
  choice: ton bétail
  rationale: בְּהֵמָה désigne ici collectivement les animaux domestiques ; « bétail » convient au contexte agricole sans limiter le sens aux bovins.
- source_word: תַרְבִּיעַ כִּלְאַיִם
  choice: tu n’accoupleras pas deux espèces différentes parmi ton bétail
  rationale: La forme causative de רבע évoque le fait de faire s’accoupler des animaux, tandis que כִּלְאַיִם indique des catégories différentes. Cette formulation reste précise sans introduire la terminologie moderne du croisement génétique.
- source_word: שָׂדְךָ לֹא תִזְרַע כִּלְאָיִם
  choice: tu n’ensemenceras pas ton champ de deux sortes de semences
  rationale: זרע désigne l’action de semer ; le complément « deux sortes de semences » explicite naturellement en français le sens de כִּלְאָיִם dans ce contexte.
- source_word: בֶגֶד כִּלְאַיִם
  choice: vêtement en tissu mélangé
  rationale: בֶּגֶד est un vêtement, et כִּלְאַיִם qualifie ici sa composition hétérogène. « Tissu mélangé » est intelligible sans préciser dans le texte principal les fibres concernées.
- source_word: שַׁעַטְנֵז
  choice: shaatnez
  rationale: Ce terme technique rare est conservé en translittération afin de ne pas imposer dans le texte principal une définition plus précise que le mot hébreu lui-même ; la note en explique l’interprétation traditionnelle.
- source_word: לֹא יַעֲלֶה עָלֶיךָ
  choice: tu ne porteras pas
  rationale: L’expression signifie littéralement que le vêtement ne « montera » pas sur la personne. En contexte vestimentaire, « tu ne porteras pas » en restitue naturellement la valeur idiomatique.
theological_decisions:
- issue: Passage du pluriel au singulier
  choice: Conserver « Vous observerez », puis employer « tu » dans les trois interdictions.
  alternative: Uniformiser tout le verset au pluriel ou au singulier.
  rationale: L’hébreu passe réellement du pluriel תִּשְׁמֹרוּ au singulier dans les clauses suivantes. Le français permet de préserver ce changement de nombre, qui peut refléter une adresse collective suivie d’une application individuelle, sans en fixer l’interprétation.
- issue: Identification précise du shaatnez
  choice: Maintenir le terme technique dans le texte et expliquer en note son identification traditionnelle.
  alternative: Traduire directement par « mélange de laine et de lin ».
  rationale: Deutéronome 22.11 explicite la laine et le lin, mais le terme rare employé ici ne les nomme pas. La translittération évite de transférer silencieusement cette précision dans le texte du Lévitique.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur à valeur prescriptive conserve le ton juridique. Le changement du pluriel au singulier présent dans l’hébreu est volontairement maintenu.
