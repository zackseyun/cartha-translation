revisions:
- from: Vous observerez mes prescriptions. Tu n’accoupleras pas deux espèces différentes parmi ton bétail ; tu n’ensemenceras pas ton champ de deux sortes de semences ; et tu ne porteras pas de vêtement en tissu mélangé, du shaatnez[a].
  to: Vous observerez mes prescriptions. Tu ne feras pas s’accoupler des espèces différentes de ton bétail ; tu n’ensemenceras pas ton champ de deux sortes de semences ; et tu ne porteras pas de vêtement en tissu mélangé, de shaatnez[a].
  rationale: La révision clarifie l’interdit relatif à l’accouplement sans introduire de notion génétique moderne et corrige l’intégration syntaxique de « shaatnez ». Elle conserve le passage délibéré du pluriel au singulier, le registre prescriptif et la réserve lexicale concernant le terme technique.
