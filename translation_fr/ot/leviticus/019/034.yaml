  text: כְּ/אֶזְרָ֣ח מִ/כֶּם֩ יִהְיֶ֨ה לָ/כֶ֜ם הַ/גֵּ֣ר הַ/גָּ֣ר אִתְּ/כֶ֗ם וְ/אָהַבְתָּ֥ ל/וֹ֙ כָּמ֔וֹ/ךָ כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/034.yaml
  text: The sojourner who sojourns with you shall be to you like a native among you[a], and you shall love him as yourself, for you were sojourners in the land of Egypt. I am Yahweh your God.
translation:
  language: fr
  text: L’étranger[a] qui réside avec vous sera pour vous comme un natif d’entre vous. Tu l’aimeras comme toi-même, car vous avez été étrangers dans le pays d’Égypte. Je suis Yahweh, votre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’immigré », « le résident étranger » ou « l’étranger établi ». Le terme hébreu désigne ici une personne non native qui vit parmi les Israélites.
    reason: Précision lexicale sur le statut durable exprimé par גֵּר.
lexical_decisions:
- source_word: כְּאֶזְרָח מִכֶּם
  choice: comme un autochtone parmi vous
  rationale: אֶזְרָח désigne un membre natif de la communauté. « Autochtone » conserve cette idée et la préposition comparative כְּ est rendue par « comme ».
- source_word: הַגֵּר
  choice: l’étranger
  rationale: גֵּר désigne ici une personne non native qui réside durablement au sein d’Israël. « Étranger » est naturel en français courant; une note précise le statut résident impliqué par le terme hébreu.
- source_word: הַגָּר אִתְּכֶם
  choice: qui réside avec vous
  rationale: Le participe גָּר indique que cet étranger habite au sein de la communauté, et non qu’il ne fait que passer.
- source_word: יִהְיֶה לָכֶם
  choice: sera pour vous
  rationale: Cette formulation conserve la construction hébraïque et exprime la manière dont la communauté doit considérer l’étranger.
- source_word: וְאָהַבְתָּ לוֹ
  choice: Tu l’aimeras
  rationale: Le futur français a ici valeur de commandement et préserve le passage à l’interpellation au singulier dans le texte hébreu.
- source_word: כָּמוֹךָ
  choice: comme toi-même
  rationale: Cette expression idiomatique conserve le lien verbal et thématique avec Lévitique 19:18.
- source_word: כִּי גֵרִים הֱיִיתֶם
  choice: car vous avez été étrangers
  rationale: La répétition d’« étrangers » reproduit le lien lexical avec הַגֵּר et fonde le commandement dans l’expérience historique d’Israël.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: dans le pays d’Égypte
  rationale: La formulation pleine respecte l’expression biblique hébraïque et son cadre historique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Cette traduction directe conserve la formule d’alliance et le pluriel du suffixe hébreu.
theological_decisions:
- issue: Sens de גֵּר dans ce contexte juridique et éthique
  choice: l’étranger, avec une note précisant qu’il réside parmi Israël
  alternative: l’immigré; le résident étranger; l’étranger établi
  rationale: Le mot désigne un non-natif vivant durablement au sein de la communauté. Le choix retenu reste naturel et non technique, tandis que la note empêche de le comprendre comme un simple voyageur.
- issue: Alternance entre destinataire pluriel et singulier
  choice: « avec vous… pour vous… Tu l’aimeras… vous avez été »
  alternative: uniformiser tout le verset au pluriel
  rationale: L’alternance est présente dans l’hébreu et mérite d’être conservée plutôt que silencieusement harmonisée.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte emploie directement le tétragramme; la translittération préserve le nom personnel de Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur exprime naturellement le commandement. L’alternance intentionnelle entre « vous » et « tu » suit les nombres grammaticaux du texte hébreu.
