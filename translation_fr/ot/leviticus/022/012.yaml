id: LEV.22.12
reference: Leviticus 22:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בַת כֹּהֵ֔ן כִּ֥י תִהְיֶ֖ה לְ/אִ֣ישׁ זָ֑ר הִ֕וא בִּ/תְרוּמַ֥ת הַ/קֳּדָשִׁ֖ים לֹ֥א תֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/012.yaml
  text: But if a priest’s daughter becomes the wife of an outsider[b][a], she shall not eat from the contribution of the holy things.
translation:
  language: fr
  text: Mais si la fille d’un prêtre épouse un homme extérieur au sacerdoce[a], elle ne mangera pas de la part prélevée sur les choses saintes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devient à un homme étranger ». Ici, « étranger » désigne un homme extérieur au cercle sacerdotal, et non nécessairement un étranger par son origine.'
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « des offrandes saintes » ou « des dons sacrés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַת כֹּהֵן
  choice: Mais si la fille d’un prêtre
  rationale: Le waw marque ici le contraste avec les cas précédents. La relation construite est rendue naturellement par « la fille d’un prêtre ».
- source_word: כִּי תִהְיֶה לְ/אִישׁ זָר
  choice: épouse un homme qui n’appartient pas au sacerdoce
  rationale: L’expression décrit l’entrée de la fille dans une relation conjugale avec un homme extérieur au cercle sacerdotal. Cette formulation explicite le mariage sans donner à זָר un sens nécessairement ethnique.
- source_word: הִוא
  choice: elle
  rationale: Le pronom indépendant reprend explicitement la fille du prêtre; le français l’exprime naturellement par « elle ».
- source_word: בִּ/תְרוּמַת הַ/קֳּדָשִׁים
  choice: de la contribution provenant des choses saintes
  rationale: תְּרוּמָה désigne une part prélevée et offerte; קֳדָשִׁים conserve ici la catégorie générale des réalités consacrées.
- source_word: לֹא תֹאכֵל
  choice: elle ne mangera pas
  rationale: Le futur français convient à la formulation prescriptive d’une règle juridique et conserve le verbe concret « manger ».
theological_decisions:
- issue: Sens de זָר dans la législation sacerdotale
  choice: un homme qui n’appartient pas au sacerdoce
  alternative: un étranger; un non-prêtre; un profane
  rationale: Dans ce contexte, le terme indique surtout une personne extérieure au cercle habilité à manger les aliments sacrés. La traduction évite donc de suggérer sans fondement qu’il s’agit nécessairement d’un étranger sur le plan ethnique.
- issue: Portée de תְּרוּמַת הַקֳּדָשִׁים
  choice: la contribution provenant des choses saintes
  alternative: les offrandes saintes; les dons sacrés
  rationale: La formulation retenue reste proche de la construction hébraïque et ne réduit pas la référence à une seule catégorie précise d’offrandes.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure conditionnelle et la force juridique du texte, tout en explicitant sobrement le sens conjugal de l’expression hébraïque.
