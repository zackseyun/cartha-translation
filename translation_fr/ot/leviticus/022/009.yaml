id: LEV.22.9
reference: Leviticus 22:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/שָׁמְר֣וּ אֶת מִשְׁמַרְתִּ֗/י וְ/לֹֽא יִשְׂא֤וּ עָלָי/ו֙ חֵ֔טְא וּ/מֵ֥תוּ ב֖/וֹ כִּ֣י יְחַלְּלֻ֑/הוּ אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/009.yaml
  text: They shall keep my charge[a], so that they do not bear sin because of it and die by it when they profane it[d][c][b]. I am Yahweh who sanctifies them.
translation:
  language: fr
  text: Ils observeront ce que je leur ai confié[a], afin de ne pas se charger d’un péché à cause de cela[b] et d’en mourir[c] pour l’avoir profané[d]. Je suis Yahweh, qui les sanctifie[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils garderont ma charge »; il s’agit de l’obligation ou du service qui leur est confié.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « devenir coupables à cause de cela ». L’expression hébraïque signifie littéralement « porter un péché » et peut indiquer qu’on devient passible de culpabilité.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « mourir à cause de cela ».'
    reason: lexical_alternative
  - marker: d
    text: 'Ou : « l’avoir traité comme une chose ordinaire » ou « l’avoir désacralisé ». Le référent exact du pronom n’est pas précisé en hébreu.'
    reason: lexical_and_referential_ambiguity
  - marker: e
    text: 'Ou : « qui les rend saints ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרוּ
  choice: observeront
  rationale: Dans une instruction cultuelle, שׁמר exprime l’observation attentive et fidèle d’une obligation; « observeront » est naturel en français juridique et religieux.
- source_word: מִשְׁמַרְתִּי
  choice: ce que je leur ai confié
  rationale: מִשְׁמֶרֶת désigne ici une charge ou une obligation confiée aux prêtres. Cette formulation française rend la responsabilité reçue sans recourir au peu naturel « ma charge ».
- source_word: יִשְׂאוּ עָלָיו חֵטְא
  choice: se charger d’un péché à cause de cela
  rationale: La formulation conserve l’image hébraïque de « porter » un péché tout en restant compréhensible; elle peut aussi signifier devenir passible de culpabilité.
- source_word: וּמֵתוּ בוֹ
  choice: et d’en mourir
  rationale: Le pronom « en » exprime avec concision la mort résultant de la faute, sans préciser davantage le référent du pronom hébreu.
- source_word: יְחַלְּלֻהוּ
  choice: pour l’avoir profané
  rationale: חלל marque le fait de profaner, de désacraliser ou de traiter comme ordinaire ce qui est saint. « Profaner » maintient le contraste lévitique entre saint et profane.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: מְקַדְּשָׁם
  choice: qui les sanctifie
  rationale: Le participe présente Yahweh comme celui qui les met à part et les rend saints; « sanctifie » conserve le registre théologique de la sainteté.
theological_decisions:
- issue: Référent des pronoms dans « à cause de cela », « en » et « l’ »
  choice: Les pronoms restent génériques et renvoient sans précision supplémentaire à la réalité sacrée ou à l’obligation qui vient d’être mentionnée.
  alternative: Les faire renvoyer explicitement soit à la charge de Yahweh, soit aux aliments saints du contexte immédiat.
  rationale: L’hébreu emploie des pronoms singuliers sans répéter leur antécédent. Une formulation non spécifique préserve cette ambiguïté au lieu de trancher entre l’obligation confiée et les choses saintes concernées.
- issue: Valeur de כִּי devant יְחַלְּלֻהוּ
  choice: pour l’avoir profané
  alternative: quand ils le profanent; parce qu’ils le profanent
  rationale: La tournure française relie la mort à l’acte de profanation tout en gardant la nuance causale de כִּי dans ce contexte pénal.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur conserve la force prescriptive de l’instruction. La formulation évite de préciser au-delà de l’hébreu le référent des pronoms singuliers.
