  text: הַ/מּוֹצִ֤יא אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לִ/הְי֥וֹת לָ/כֶ֖ם לֵ/אלֹהִ֑ים אֲנִ֖י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/033.yaml
  text: who brought you out of the land of Egypt to be your God[a]. I am Yahweh.
translation:
  language: fr
  text: qui vous ai fait sortir du pays d’Égypte pour être votre Dieu. Je suis Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » (traditionnellement rendu par « le SEIGNEUR »; autre translittération possible : « Yahvé »).'
    reason: Signaler la forme hébraïque du nom divin et les principales conventions françaises de traduction ou de translittération.
lexical_decisions:
- source_word: הַמּוֹצִיא
  choice: qui vous ai fait sortir
  rationale: Le participe hiphil défini de יצא poursuit la présentation de Yahweh commencée au verset précédent. En français, une relative au passé composé exprime naturellement l’acte historique de la sortie d’Égypte; « ai » s’accorde avec le « je » auquel renvoie « qui » dans le contexte.
- source_word: אֶתְכֶם
  choice: vous
  rationale: Le suffixe de deuxième personne du pluriel est rendu directement par « vous ».
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: du pays d’Égypte
  rationale: Cette formulation conserve « pays », présent dans l’hébreu, ainsi que la tournure traditionnelle et naturelle de la formule de l’Exode.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: pour être votre Dieu
  rationale: Cette formulation française naturelle préserve la finalité introduite par ל et la relation d’alliance exprimée par « être pour vous comme Dieu ».
- source_word: אֲנִי יְהוָה
  choice: Je suis Yahweh
  rationale: La proposition nominale hébraïque devient naturellement « Je suis » en français, et le nom divin יהוה est translittéré « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » conserve le nom d’alliance sans le remplacer silencieusement par un titre.
translation_notes:
  register: Français international moderne, simple et digne. Le début en minuscule et la relative « qui vous ai fait sortir » indiquent que le verset poursuit syntaxiquement la phrase du verset précédent. « Pays d’Égypte » maintient la formule biblique sans lourdeur.
