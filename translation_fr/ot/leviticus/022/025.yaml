  - severity: medium
    issue: 'Formulation pesante et ambiguë : « elles portent en elles une altération »'
    rationale: Cette tournure n’est pas idiomatique et risque d’obscurcir l’affirmation. « Elles sont altérées ; elles ont un défaut » conserve les deux prédications du texte sans identifier indûment l’altération à un défaut particulier.
