  text: וּ/מִ/יַּ֣ד בֶּן נֵכָ֗ר לֹ֥א תַקְרִ֛יבוּ אֶת לֶ֥חֶם אֱלֹהֵי/כֶ֖ם מִ/כָּל אֵ֑לֶּה כִּ֣י מָשְׁחָתָ֤/ם בָּ/הֶם֙ מ֣וּם בָּ֔/ם לֹ֥א יֵרָצ֖וּ לָ/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/025.yaml
  text: And from the hand of a foreigner you shall not present any of these as the food of your God[a], because their corruption is in them; a defect is in them[b]. They shall not be accepted for you.
translation:
  language: fr
  text: Vous ne présenterez pas non plus, de la part d’un étranger, aucune de ces bêtes comme nourriture de votre Dieu[a], car elles sont altérées ; elles ont un défaut[b]. Elles ne seront pas acceptées pour vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pain de votre Dieu ». Ici, « pain » est une expression sacrificielle hébraïque qui désigne la nourriture présentée à Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « tare ». Le terme hébreu désigne un défaut qui rend un animal impropre au sacrifice.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִיַּד
  choice: de la main de
  rationale: Conserve l’image hébraïque de la main tout en indiquant naturellement la provenance du don.
- source_word: בֶּן נֵכָר
  choice: un étranger
  rationale: Cette expression idiomatique désigne une personne étrangère, c’est-à-dire non israélite ; la traduction évite le calque peu naturel « fils d’un étranger ».
- source_word: תַקְרִיבוּ
  choice: vous ne présenterez pas
  rationale: À la forme causative et dans un contexte sacrificiel, le verbe signifie présenter ou offrir à Dieu. « Présenter » garde clairement le cadre cultuel.
- source_word: לֶחֶם אֱלֹהֵיכֶם
  choice: nourriture de votre Dieu
  rationale: Bien que לֶחֶם signifie littéralement « pain », le terme désigne ici, dans le langage sacrificiel sacerdotal, la nourriture présentée à Dieu.
- source_word: מִכָּל אֵלֶּה
  choice: l’une quelconque de ces bêtes
  rationale: La formulation exprime la valeur partitive de מִן avec כָּל et explicite sobrement que le démonstratif renvoie aux animaux mentionnés dans le contexte.
- source_word: מָשְׁחָתָם
  choice: elles portent en elles une altération
  rationale: Le nom peut évoquer une corruption, une détérioration ou une déformation. « Altération » convient aux animaux rendus impropres au sacrifice sans préciser au-delà de l’hébreu la nature exacte du problème.
- source_word: מוּם
  choice: un défaut
  rationale: Il s’agit du terme habituel de Lévitique 21–22 pour un défaut corporel qui disqualifie une victime sacrificielle.
- source_word: לֹא יֵרָצוּ לָכֶם
  choice: elles ne seront pas agréées en votre faveur
  rationale: Le passif de רצה exprime l’accueil favorable d’un sacrifice. « En votre faveur » conserve la portée de לָכֶם, qui rapporte cet agrément aux personnes qui présentent les victimes.
theological_decisions:
- issue: Expression cultuelle désignant le don sacrificiel
  choice: nourriture de votre Dieu
  alternative: pain de votre Dieu
  rationale: « Nourriture » communique la portée sacrificielle de l’expression sans laisser croire qu’il s’agit seulement de pain, tandis que la note conserve la métaphore hébraïque littérale.
- issue: Portée de l’agrément sacrificiel
  choice: agréées en votre faveur
  alternative: acceptées pour vous
  rationale: Cette formulation indique que l’acceptation concerne les offrants, sans développer une théorie particulière de l’efficacité du sacrifice.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe maintient le lien avec la formulation sacerdotale et conserve la distinction entre l’altération et le défaut, sans la résoudre artificiellement.
