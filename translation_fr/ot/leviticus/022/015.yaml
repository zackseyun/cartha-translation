source:
  edition: WLC
  text: וְ/לֹ֣א יְחַלְּל֔וּ אֶת קָדְשֵׁ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֥ת אֲשֶׁר יָרִ֖ימוּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/015.yaml
  text: They shall not profane the holy things of the sons of Israel[b][a], which they lift up to Yahweh.
translation:
  language: fr
  text: Ils ne profaneront pas les choses saintes des fils d’Israël, qu’ils présentent à Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’ils élèvent pour Yahweh » ou « qu’ils offrent à Yahweh ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַלְּלוּ
  choice: profaneront
  rationale: Le piel de חלל, dans ce contexte cultuel, signifie traiter comme profane ce qui est saint. « Profaner » conserve directement l’opposition entre saint et profane propre au Lévitique.
- source_word: קָדְשֵׁי
  choice: les choses saintes
  rationale: Le nom pluriel construit désigne ce qui est consacré. « Les choses saintes » reste proche de l’hébreu et évite de réduire le référent aux seules offrandes.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: des fils d’Israël
  rationale: Cette traduction conserve la forme de l’ethnonyme hébreu tout en restant intelligible dans un registre biblique français digne.
- source_word: אֲשֶׁר יָרִימוּ
  choice: celles qu’ils élèvent
  rationale: Le hiphil de רום garde ici l’image concrète d’élever, tout en pouvant désigner la présentation d’une contribution consacrée.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל marque ici le destinataire ou le bénéficiaire cultuel; « pour » est naturel en français. Le nom divin est translittéré « Yahweh ».
- source_word: וְלֹא
  choice: Ils ne … pas
  rationale: Dans cette prescription, l’imparfait négatif exprime une interdiction. Le futur français convient au style législatif du passage; la conjonction initiale n’a pas besoin d’être rendue isolément dans ce verset.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom d’alliance sans le remplacer par un titre.
- issue: Étendue de קָדְשֵׁי
  choice: les choses saintes
  alternative: les offrandes saintes
  rationale: Le contexte peut viser des offrandes consacrées, mais le terme hébreu est plus large. La formulation choisie préserve cette amplitude sémantique.
translation_notes:
  register: Français international moderne, sobre et législatif. « Profaner » et « choses saintes » maintiennent le vocabulaire cultuel du Lévitique. La reprise « celles que » clarifie naturellement l’antécédent pluriel sans résoudre davantage la portée du relatif.
