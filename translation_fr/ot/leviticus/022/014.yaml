source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּֽי יֹאכַ֥ל קֹ֖דֶשׁ בִּ/שְׁגָגָ֑ה וְ/יָסַ֤ף חֲמִֽשִׁית/וֹ֙ עָלָ֔י/ו וְ/נָתַ֥ן לַ/כֹּהֵ֖ן אֶת הַ/קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/014.yaml
  text: And if a man eats a holy thing unintentionally[d][c][b][a], then he shall add a fifth to it and give the holy thing to the priest.
translation:
  language: fr
  text: Si un homme[a] mange par inadvertance[c] une chose consacrée[b], il y ajoutera un cinquième[d] et donnera au prêtre la chose consacrée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quelqu’un » ou « une personne ». L’hébreu dit littéralement « un homme », formulation juridique masculine qui peut avoir une portée générique.
    reason: lexical_alternative
  - marker: b
    text: La « chose consacrée » désigne ici une nourriture ou un bien saint réservé à l’usage des prêtres.
    reason: cultural_note
  - marker: c
    text: Ou « par erreur », « sans le faire exprès ».
    reason: lexical_alternative
  - marker: d
    text: 'Littéralement : « il lui ajoutera son cinquième », c’est-à-dire un cinquième de la chose ou de sa valeur.'
    reason: literal_rendering
lexical_decisions:
- source_word: וְאִישׁ
  choice: Si un homme
  rationale: אִישׁ est un nom masculin singulier. « Un homme » conserve la forme du texte hébreu, tout en pouvant avoir une portée générique dans cette formulation juridique.
- source_word: כִּי
  choice: si
  rationale: Dans cette loi casuistique, כִּי introduit le cas envisagé; « si » rend naturellement la condition.
- source_word: יֹאכַל
  choice: mange
  rationale: L’imparfait hébreu énonce ici le cas juridique. Le présent français convient à une proposition conditionnelle.
- source_word: קֹדֶשׁ
  choice: une chose consacrée / la chose consacrée
  rationale: Dans ce contexte, קֹדֶשׁ désigne une chose mise à part comme sainte, notamment une nourriture ou un bien réservé à l’usage sacerdotal. « Chose consacrée » reste assez large et sonne plus naturellement en français actuel que « chose sainte ».
- source_word: בִּשְׁגָגָה
  choice: par inadvertance
  rationale: Le terme signale une faute involontaire, non un acte délibéré. « Par inadvertance » exprime précisément cette distinction juridique.
- source_word: וְיָסַף
  choice: il y ajoutera
  rationale: Le verbe prescrit l’ajout dû en restitution; le futur français convient au style normatif sans être archaïque.
- source_word: חֲמִשִׁיתוֹ עָלָיו
  choice: un cinquième
  rationale: L’expression signifie littéralement qu’il faut ajouter le cinquième de la chose à celle-ci. La formulation concise évite la répétition maladroite de plusieurs pronoms tout en conservant le montant de la majoration.
- source_word: וְנָתַן
  choice: et donnera
  rationale: « Donnera » reste proche du sens ordinaire de נתן; le contexte indique qu’il s’agit d’une restitution.
- source_word: לַכֹּהֵן
  choice: au prêtre
  rationale: L’article hébreu renvoie au prêtre compétent ou à la catégorie sacerdotale concernée.
- source_word: אֶת הַקֹּדֶשׁ
  choice: la chose consacrée
  rationale: La répétition de « chose consacrée » préserve le lien lexical avec la première occurrence de קֹדֶשׁ et n’impose pas dans le texte principal la précision interprétative « sa valeur ».
theological_decisions:
- issue: Masculin singulier dans une formulation juridique
  choice: Conserver « un homme » dans le texte principal
  alternative: « quelqu’un » ou « une personne »
  rationale: Le texte source emploie אִישׁ au masculin singulier. Cette forme est conservée, sans nier qu’une formulation juridique de ce type puisse avoir une portée générique.
- issue: Nature de la chose à restituer
  choice: Rendre les deux occurrences de קֹדֶשׁ par « chose consacrée »
  alternative: « nourriture consacrée », « portion sacrée » ou « valeur de la chose consacrée »
  rationale: Le contexte concerne la consommation indue d’un bien consacré, mais le mot hébreu demeure large. La répétition française préserve cette largeur et la tension entre la chose consommée et ce qui doit être rendu, sans introduire explicitement « valeur » dans le texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe juridique reste concise. « Chose consacrée » évite l’étrangeté de « chose sainte » tout en préservant l’étendue sémantique de קֹדֶשׁ; « prêtre » est préféré à l’archaïque « sacrificateur ».
