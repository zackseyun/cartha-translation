source:
  edition: WLC
  text: כֹּ֛ל אֲשֶׁר בּ֥/וֹ מ֖וּם לֹ֣א תַקְרִ֑יבוּ כִּי לֹ֥א לְ/רָצ֖וֹן יִהְיֶ֥ה לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/020.yaml
  text: You shall not present anything that has a blemish[b][a], for it will not be accepted for you.
translation:
  language: fr
  text: Vous ne présenterez rien qui ait un défaut[a], car cela ne sera pas agréé pour vous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une imperfection ». Le terme hébreu désigne souvent un défaut physique qui disqualifie une offrande.
    reason: lexical_alternative
  - marker: b
    text: Ou « cela ne sera pas acceptable pour vous » ou « cela ne sera pas accepté pour vous ».
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּל אֲשֶׁר בּוֹ מוּם
  choice: rien qui ait un défaut
  rationale: Cette formulation française naturelle rend l’expression indéfinie et globale, littéralement « tout ce en quoi il y a un défaut », tout en conservant la portée absolue de l’interdiction.
- source_word: מוּם
  choice: défaut
  rationale: Dans les textes sacrificiels, le terme désigne une anomalie ou imperfection physique qui disqualifie une offrande. « Défaut » est clair en français moderne et convient au registre rituel.
- source_word: לֹא תַקְרִיבוּ
  choice: Vous ne présenterez pas
  rationale: Le hiphil de קרב désigne ici le fait d’amener ou de présenter quelque chose comme offrande. « Présenter » conserve cette nuance sans préciser indûment une étape particulière du rite.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’interdiction; « car » restitue sobrement le style juridique du passage.
- source_word: לֹא לְרָצוֹן יִהְיֶה לָכֶם
  choice: cela ne sera pas accepté en votre faveur
  rationale: Cette traduction exprime l’acceptation cultuelle devant Dieu et rend la valeur relationnelle de לָכֶם, « pour vous » ou « en votre faveur », sans réduire l’expression à la simple conformité à une norme.
theological_decisions:
- issue: Sens de l’acceptation cultuelle
  choice: accepté en votre faveur
  alternative: jugé acceptable pour vous / vous valoir l’agrément
  rationale: L’hébreu concerne l’accueil favorable de l’offrande et laisse entendre son effet pour ceux qui la présentent. La formulation retenue conserve cette dimension sacrificielle sans introduire de catégorie doctrinale ultérieure.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase garde la formulation générale de l’hébreu plutôt que d’ajouter explicitement « animal », que le contexte immédiat permet de comprendre. « En votre faveur » préserve la tension entre l’acceptabilité de l’offrande et son acceptation au bénéfice de ceux qui la présentent.
