id: LEV.22.3
reference: Leviticus 22:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֱמֹ֣ר אֲלֵ/הֶ֗ם לְ/דֹרֹ֨תֵי/כֶ֜ם כָּל אִ֣ישׁ אֲשֶׁר יִקְרַ֣ב מִ/כָּל זַרְעֲ/כֶ֗ם אֶל הַ/קֳּדָשִׁים֙ אֲשֶׁ֨ר יַקְדִּ֤ישׁוּ בְנֵֽי יִשְׂרָאֵל֙ לַֽ/יהוָ֔ה וְ/טֻמְאָת֖/וֹ עָלָ֑י/ו וְ/נִכְרְתָ֞ה הַ/נֶּ֧פֶשׁ הַ/הִ֛וא מִ/לְּ/פָנַ֖/י אֲנִ֥י יְהוָֽה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/003.yaml
  text: 'Say to them[a], throughout your generations: Any man from any of your offspring who comes near the holy things that the sons of Israel consecrate to Yahweh while his uncleanness is on him—that person shall be cut off from before me[c][b]. I am Yahweh.'
translation:
  language: fr
  text: 'Dis-leur : Dans toutes vos générations, tout homme parmi vos descendants qui s’approchera des choses saintes que les Israélites consacrent à Yahweh alors que son impureté est sur lui, cet homme sera retranché de devant moi[a]. Je suis Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « loin de ma présence ». « Sera retranché » est une formule de sanction liée à l’alliance ; la manière exacte dont ce retranchement s’accomplit est discutée.
    reason: La note signale à la fois une variante naturelle pour מִלְּפָנַי et l’indétermination réelle de la formule pénale, sans trancher entre mort, exclusion ou autre sanction.
lexical_decisions:
- source_word: אֱמֹר אֲלֵהֶם
  choice: Dis-leur
  rationale: L’impératif singulier s’adresse à Moïse. « Dis-leur » est direct, naturel et fidèle.
- source_word: לְדֹרֹתֵיכֶם
  choice: Dans toutes vos générations
  rationale: Cette formule juridique indique que la prescription demeure applicable au fil des générations.
- source_word: כָּל אִישׁ
  choice: tout homme
  rationale: Dans le contexte immédiat, le cas juridique vise un membre masculin de la descendance sacerdotale d’Aaron; la formulation conserve donc le masculin explicite.
- source_word: מִכָּל זַרְעֲכֶם
  choice: parmi vos descendants
  rationale: « Descendants » exprime clairement la lignée désignée par זרע sans recourir au littéral « semence ».
- source_word: יִקְרַב
  choice: s’approchera
  rationale: Le verbe קרב garde ici sa valeur spatiale et rituelle d’approche des réalités sacrées.
- source_word: הַקֳּדָשִׁים
  choice: les choses saintes
  rationale: Cette expression conserve l’extension assez large du pluriel hébreu, sans le limiter artificiellement aux offrandes ou aux dons.
- source_word: יַקְדִּישׁוּ
  choice: consacrent
  rationale: Le causatif de קדשׁ signifie mettre à part comme saint; « consacrer » convient au registre cultuel.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette formulation française naturelle désigne fidèlement le peuple correspondant à l’expression hébraïque littérale « fils d’Israël ».
- source_word: לַיהוָה / יְהוָה
  choice: à Yahweh / Je suis Yahweh
  rationale: Le nom divin est transcrit « Yahweh » afin de représenter directement le tétragramme.
- source_word: וְטֻמְאָתוֹ עָלָיו
  choice: alors que son impureté est sur lui
  rationale: La formulation préserve l’image hébraïque d’un état d’impureté reposant encore sur l’homme, plutôt que de l’aplanir en « alors qu’il est impur ».
- source_word: וְנִכְרְתָה
  choice: sera retranchée
  rationale: « Retrancher » conserve la formule juridique et d’alliance sans préciser un mode de sanction que le verset ne définit pas.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: cette personne
  rationale: Dans cette formule juridique, נפש désigne l’individu; « personne » est idiomatique et ne réduit pas le mot au sens de « l’âme ».
- source_word: מִלְּפָנַי
  choice: de devant moi
  rationale: Cette traduction formelle garde l’image de l’éloignement hors de la présence divine et évite de confondre cette expression avec un simple retranchement communautaire.
theological_decisions:
- issue: Sens de la formule pénale וְנִכְרְתָה
  choice: sera retranchée
  alternative: sera mise à mort; sera exclue de la communauté; sera supprimée du peuple de l’alliance
  rationale: Le mécanisme précis du retranchement est discuté et n’est pas défini dans ce verset. La traduction maintient donc l’indétermination du texte.
- issue: Portée de מִלְּפָנַי
  choice: de devant moi
  alternative: loin de ma présence
  rationale: Les deux formulations expriment une exclusion de la présence de Dieu. La formulation plus proche de l’hébreu préserve l’image sans l’interpréter davantage.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: La transcription « Yahweh » représente le nom d’alliance présent dans le texte hébreu et suit la décision doctrinale fournie.
translation_notes:
  register: Français international moderne, digne et juridique. La syntaxe reste proche de la casuistique sacerdotale tout en demeurant lisible. « Choses saintes », « impureté est sur lui » et « retranchée de devant moi » conservent délibérément les images et l’ampleur sémantique de l’hébreu.
