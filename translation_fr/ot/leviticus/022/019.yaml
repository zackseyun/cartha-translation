translation:
  language: fr
  text: Pour être agréé, il doit s’agir d’un mâle sans défaut, pris parmi le gros bétail, les moutons ou les chèvres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִרְצֹנְכֶם
  choice: Pour être agréé
  rationale: 'Exprime ici la finalité cultuelle de l’offrande : elle doit pouvoir être acceptée. La formulation conserve l’orientation vers l’agrément sans alourdir la phrase.'
- source_word: תָּמִים
  choice: sans défaut
  rationale: Dans le contexte sacrificiel, le terme désigne un animal intact, exempt de défaut disqualifiant. « Sans défaut » est naturel et précis en français biblique contemporain.
- source_word: זָכָר
  choice: un mâle
  rationale: Correspond directement au sexe requis pour l’animal offert.
- source_word: בַּבָּקָר בַּכְּשָׂבִים וּבָעִזִּים
  choice: pris parmi le gros bétail, les moutons ou les chèvres
  rationale: Rend clairement les trois catégories animales. « Gros bétail » désigne les bovins et évite l’ambiguïté française de « bétail » employé seul.
theological_decisions:
- issue: Sens de לִרְצֹנְכֶם
  choice: Pour être agréé
  alternative: Pour que vous soyez agréés
  rationale: Le contexte immédiat porte sur les conditions d’acceptabilité de l’offrande. La traduction choisie laisse implicite l’objet exact de l’agrément, comme l’expression hébraïque concise, sans en faire explicitement l’agrément des offrants.
- issue: Portée de תָּמִים
  choice: sans défaut
  alternative: intact
  rationale: Le cadre rituel appelle une qualité sacrificielle objective, non une notion morale. « Sans défaut » communique cette exigence sans introduire une interprétation doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. La structure prescriptive est conservée, avec une légère explicitation syntaxique (« pris parmi ») nécessaire au naturel français.
