base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/024.yaml
  text: You shall not present to Yahweh anything with bruised[a], crushed, torn, or cut testicles, and in your land you shall not do this.
translation:
  language: fr
  text: Vous ne présenterez à Yahweh aucun animal aux testicules meurtris, écrasés, arrachés ou coupés[a] ; vous ne ferez pas cela dans votre pays.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu énumère littéralement quatre états — « meurtri, écrasé, arraché ou coupé » — sans nommer explicitement l’organe atteint ; le contexte indique les testicules de l’animal.
    reason: objet implicite et précision lexicale
  - marker: b
    text: 'L’expression hébraïque est elliptique : littéralement, « dans votre pays, vous ne ferez pas ». Le référent de « cela » n’est pas précisé ; la clause peut viser les mutilations énumérées, ou être comprise plus étroitement en lien avec l’offrande.'
    reason: ambiguïté syntaxique
lexical_decisions:
- source_word: מָעוּךְ
  choice: meurtris
  rationale: Le participe désigne une lésion causée par pression. « Meurtris » le distingue du terme suivant, plus fort, rendu par « écrasés ».
- source_word: כָתוּת
  choice: écrasés
  rationale: Le mot évoque ce qui a été battu ou broyé ; « écrasés » exprime concrètement la gravité de la lésion.
- source_word: נָתוּק
  choice: arrachés
  rationale: Le terme décrit ce qui est détaché par arrachement. « Arrachés » conserve cette nuance sans atténuer la violence de l’acte.
- source_word: כָרוּת
  choice: coupés
  rationale: Issu du verbe « couper, retrancher », le terme décrit ici une mutilation par incision ou sectionnement.
- source_word: תַקְרִיבוּ
  choice: présenterez
  rationale: Dans le contexte sacrificiel, le hiphil signifie présenter ou apporter comme offrande ; « présenter » ne réduit pas l’acte au seul brûlement sur l’autel.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La forme française « Yahweh » représente directement le nom divin dans le texte source.
- source_word: בְאַרְצְכֶם
  choice: dans votre pays
  rationale: L’expression désigne le territoire où vit Israël. « Dans votre pays » est naturel en français moderne tout en conservant la portée territoriale.
- source_word: תַעֲשׂוּ
  choice: vous ne pratiquerez pas cela
  rationale: Le verbe « faire » est elliptique. « Pratiquer cela » renvoie naturellement aux actes de mutilation précédemment énumérés sans préciser davantage leur portée.
- source_word: objet implicite des quatre participes
  choice: testicules
  rationale: Les quatre participes sont employés sans nom exprimé, mais le contexte des défauts propres aux animaux mâles indique les organes sexuels. « Testicules » est anatomiquement clair et non euphémistique.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: « Yahweh » rend explicitement le tétragramme et suit la convention du projet indiquée dans la couche de consultation.
- issue: Portée de וּבְאַרְצְכֶם לֹא תַעֲשׂוּ
  choice: interdiction de pratiquer ces mutilations dans le pays
  alternative: interdiction d’y offrir de tels animaux, ou de les préparer pour le sacrifice
  rationale: Le verbe « faire » reste large et elliptique. Le renvoi le plus immédiat porte sur les lésions énumérées, mais une note signale l’ellipse au lieu de masquer la difficulté.
translation_notes:
  register: Français international moderne, direct et digne. Le vocabulaire anatomique précis évite les euphémismes archaïques. Le futur à valeur injonctive convient au registre légal du Lévitique, et le point-virgule maintient le lien entre les deux interdictions.
