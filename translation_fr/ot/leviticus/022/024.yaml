  terminology: « Yahweh » est cohérent avec la convention fournie. « Testicules » est précis, non euphémistique et approprié au contexte. Les termes « meurtris », « écrasés », « arrachés » et « coupés » sont compréhensibles et suffisamment distincts sans prétendre résoudre davantage les nuances exactes des quatre termes hébreux.
