id: LEV.22.30
reference: Leviticus 22:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בַּ/יּ֤וֹם הַ/הוּא֙ יֵאָכֵ֔ל לֹֽא תוֹתִ֥ירוּ מִמֶּ֖/נּוּ עַד בֹּ֑קֶר אֲנִ֖י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/030.yaml
  text: It shall be eaten on that same day[a]; you shall leave none of it until morning[b]. I am Yahweh.
translation:
  language: fr
  text: Il sera mangé ce jour-là[a] ; vous n’en laisserez rien jusqu’au matin. Je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce même jour » — le contexte souligne que la consommation doit avoir lieu le jour de l’offrande.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: La locution signifie littéralement « ce jour-là ». Cette formulation française est naturelle et conserve la référence temporelle sans ajouter explicitement « même ».
- source_word: יֵאָכֵל
  choice: Il sera mangé
  rationale: Le niphal imparfait a ici une valeur passive et prescriptive. Le futur français maintient la forme passive et le ton juridique.
- source_word: לֹא תוֹתִירוּ מִמֶּנּוּ
  choice: vous n’en laisserez rien
  rationale: Le hiphil de יתר exprime le fait de laisser un reste. « Vous n’en laisserez rien » rend naturellement la prohibition, le pronom « en » reprenant ce qui doit être mangé.
- source_word: עַד בֹּקֶר
  choice: jusqu’au matin
  rationale: Cette expression temporelle indique qu’aucun reste ne doit être conservé pendant la nuit.
- source_word: אֲנִי יְהוָה
  choice: Je suis Yahweh
  rationale: La formule hébraïque sans copule est rendue idiomatiquement avec « suis », et le nom divin est translittéré « Yahweh » conformément à la couche de consultation mise à jour.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel d’alliance plutôt que de le remplacer par un titre.
- issue: Force de la prescription יֵאָכֵל
  choice: Il sera mangé
  alternative: Il devra être mangé
  rationale: Le futur passif français préserve le caractère prescriptif et la forme passive sans rendre l’obligation plus explicite que ne le fait la morphologie hébraïque.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur de prescription conserve le ton législatif du passage. La ponctuation distingue clairement le commandement de la formule divine finale.
