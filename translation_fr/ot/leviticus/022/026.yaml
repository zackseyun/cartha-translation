lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol de דבר introduit un nouvel acte de parole dans le récit. « Parla » rend naturellement la formule solennelle et récurrente de l’adresse divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre, conformément au texte hébreu, plutôt que remplacé par un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition indique ici le destinataire de la parole; « à » est l’équivalent français naturel.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Dans cette formule introductive, l’infinitif « en disant » annonce les paroles qui suivent. En français actuel, les deux-points remplissent naturellement cette fonction sans alourdir la phrase.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le nom divin YHWH. « Yahweh » en préserve le caractère de nom propre, tandis que la note signale le rendu traditionnel.
translation_notes:
  register: Français moderne, digne et concis. Les deux-points rendent idiomatiquement la formule hébraïque לֵאמֹר et relient ce verset à la parole directe du verset suivant.
