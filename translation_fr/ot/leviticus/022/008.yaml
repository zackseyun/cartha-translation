- from: Il ne mangera pas d’un animal trouvé mort ou déchiqueté par des bêtes sauvages[a], car il se rendrait impur par lui. Je suis Yahweh.
  to: Il ne mangera ni d’une bête morte ni d’une bête déchirée par des bêtes sauvages[a], pour ne pas se rendre impur par elle. Je suis Yahweh.
