    issue: Valeur de לְטָמְאָה בָּהּ
    rationale: « Car il se rendrait impur » présente une cause et introduit une nuance conditionnelle que l’hébreu n’exprime pas ainsi. « Pour ne pas se rendre impur par elle » rend directement la finalité/résultat évité dans une interdiction française naturelle.
  - severity: low
    issue: Intensité de « déchiqueté »
    rationale: טְרֵפָה désigne une bête déchirée ou mise à mort par un prédateur; « déchiqueté » peut suggérer une mutilation plus poussée. « Déchirée par des bêtes sauvages » reste précis sans surtraduire.
  - severity: low
    issue: Formulation de la première catégorie
    rationale: « Une bête morte » est une formulation française plus directe et suffisamment contextuelle pour נְבֵלָה; la note explicite la mort naturelle/sans abattage.
