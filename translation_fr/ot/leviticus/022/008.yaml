  text: נְבֵלָ֧ה וּ/טְרֵפָ֛ה לֹ֥א יֹאכַ֖ל לְ/טָמְאָה בָ֑/הּ אֲנִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/008.yaml
  text: He shall not eat an animal found dead or torn by beasts[a], making himself unclean by it. I am Yahweh.
translation:
  language: fr
  text: Il ne mangera ni d’une bête morte ni d’une bête déchirée par des bêtes sauvages[a], pour ne pas se rendre impur par elle. Je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il ne mangera ni de ce qui est mort naturellement ni de ce qui a été déchiré par des bêtes sauvages. »'
    reason: Alternative lexicale explicitant, pour « bête morte », la mort naturelle plutôt qu’un abattage régulier.
lexical_decisions:
- source_word: נְבֵלָה
  choice: un animal trouvé mort
  rationale: Le nom désigne ici la dépouille d’un animal mort sans abattage régulier. Cette formulation est claire en français moderne et convient au contexte des règles alimentaires.
- source_word: וּטְרֵפָה
  choice: ou déchiqueté par des bêtes sauvages
  rationale: Le terme désigne un animal mis en pièces par un prédateur. L’agent implicite est explicité pour produire un français naturel.
- source_word: לֹא יֹאכַל
  choice: Il ne mangera pas
  rationale: L’imparfait hébreu nié exprime ici une interdiction juridique. Le futur français conserve la force normative dans un registre digne.
- source_word: לְטָמְאָה בָהּ
  choice: car il se rendrait impur par lui
  rationale: L’infinitif avec ל indique le résultat ou le but de l’acte interdit. « Se rendre impur » préserve le vocabulaire rituel de טמא, tandis que « car » rend clairement le rapport logique.
- source_word: אֲנִי יְהוָה
  choice: Je suis Yahweh
  rationale: Le nom divin est transcrit « Yahweh », conformément à sa présence explicite dans le texte hébreu et à la couche de consultation actualisée.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: La transcription maintient le nom propre de l’alliance sans lui substituer un titre traditionnel.
- issue: Nature de l’impureté
  choice: se rendrait impur
  alternative: se souillerait
  rationale: « Impur » conserve le sens rituel du terme hébreu sans suggérer exclusivement une faute morale.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur prescriptive convient au contexte juridique. Le pronom « lui » reprend « animal » et respecte le singulier de בָהּ.
