source:
  edition: WLC
  text: נֶ֚פֶשׁ אֲשֶׁ֣ר תִּגַּע בּ֔/וֹ וְ/טָמְאָ֖ה עַד הָ/עָ֑רֶב וְ/לֹ֤א יֹאכַל֙ מִן הַ/קֳּדָשִׁ֔ים כִּ֛י אִם רָחַ֥ץ בְּשָׂר֖/וֹ בַּ/מָּֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/006.yaml
  text: The person who touches it shall be unclean until the evening[b][a], and shall not eat any of the holy things unless he has washed his body with water.
translation:
  language: fr
  text: La personne qui le touche sera impure jusqu’au soir et ne mangera rien de ce qui est saint[a], à moins d’avoir lavé son corps avec de l’eau[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des offrandes sacrées » ou « des choses consacrées ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « lavé sa chair dans l’eau ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: la personne
  rationale: Dans ce contexte juridique, le nom désigne un individu, et non une « âme » distincte du corps. « La personne » conserve aussi le singulier du texte.
- source_word: אֲשֶׁר תִּגַּע בּוֹ
  choice: qui le touche
  rationale: Le féminin du verbe s’accorde grammaticalement avec נֶפֶשׁ. Le pronom renvoie à la source d’impureté mentionnée dans le contexte précédent; « le » préserve ce renvoi sans préciser davantage la nature de l’antécédent.
- source_word: וְטָמְאָה עַד הָעָרֶב
  choice: sera impure jusqu’au soir
  rationale: La formule décrit l’état d’impureté rituelle qui résulte du contact et sa durée. « Jusqu’au soir » est l’expression française naturelle dans ce type de prescription.
- source_word: וְלֹא יֹאכַל
  choice: et ne mangera rien
  rationale: Le futur français convient au registre normatif de la loi. L’ajout de « rien » permet d’exprimer naturellement avec la suite la valeur partitive de מִן.
- source_word: מִן הַקֳּדָשִׁים
  choice: de ce qui est saint
  rationale: Le pluriel substantivé désigne les réalités consacrées, ici envisagées comme nourriture. Cette formulation reste claire sans réduire explicitement le terme aux seules offrandes.
- source_word: כִּי אִם
  choice: à moins d’avoir
  rationale: La locution introduit la condition nécessaire avant de pouvoir manger ce qui est saint.
- source_word: רָחַץ בְּשָׂרוֹ בַּמָּיִם
  choice: lavé son corps avec de l’eau
  rationale: בָּשָׂר signifie littéralement « chair », mais désigne ici concrètement le corps. Cette formulation moderne conserve l’action physique et la mention de l’eau.
theological_decisions:
- issue: Nature de l’impureté
  choice: impureté rituelle
  alternative: impureté morale
  rationale: Le contexte porte sur l’aptitude cultuelle à manger les choses saintes après un contact impur et un lavage. « Impure » conserve le vocabulaire rituel sans suggérer une faute morale que le verset n’énonce pas.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le ton normatif du texte juridique tout en évitant un calque lourd de la syntaxe hébraïque.
