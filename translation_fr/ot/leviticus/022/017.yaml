lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר dans cette formule narrative introduit une nouvelle prise de parole. « Parla » conserve la solennité de la formule hébraïque tout en restant naturel en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre afin de préserver le nom divin présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition introduit ici le destinataire de la parole ; « à » est l’équivalent français idiomatique.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et immédiatement reconnaissable.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Dans cette formule introductive, l’infinitif annonce le discours direct qui suit. « En ces termes » exprime naturellement cette fonction en français sans reproduire le tour peu idiomatique « disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: L’hébreu porte explicitement le tétragramme. « Yahweh » le conserve comme nom personnel et évite de remplacer silencieusement le nom par un titre ; une note signale les autres usages de traduction.
translation_notes:
  register: Français international moderne, clair et digne. La formule « parla à Moïse en ces termes » garde la cadence solennelle de l’introduction hébraïque tout en annonçant naturellement la suite du discours.
