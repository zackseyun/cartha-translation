  verdict: revise
  source_fidelity: 'Le sens de la prescription est bien rendu : les trois catégories animales, la période de sept jours auprès de la mère, l’admissibilité dès le huitième jour et la destination à Yahweh sont conservés. « Bovin » rend prudemment שׁוֹר comme terme d’espèce. Le rendu d’אִשֶּׁה doit toutefois être ajusté : « faite par le feu » peut suggérer qu’une offrande est fabriquée au moyen du feu, plutôt que caractérisée comme offrande sacrificielle par le feu.'
