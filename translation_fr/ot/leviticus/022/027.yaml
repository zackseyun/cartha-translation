  terminology: Yahweh est maintenu conformément au choix éditorial. « Offrande par le feu » conserve la portée cultuelle d’אִשֶּׁה sans imposer la lecture « offrande alimentaire ». La note emploie « offrande alimentaire », expression française plus précise et plus naturelle que « mets offert », tout en signalant le caractère discuté de cette analyse.
  issues:
