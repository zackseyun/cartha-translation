source:
  edition: WLC
  text: שׁ֣וֹר אוֹ כֶ֤שֶׂב אוֹ עֵז֙ כִּ֣י יִוָּלֵ֔ד וְ/הָיָ֛ה שִׁבְעַ֥ת יָמִ֖ים תַּ֣חַת אִמּ֑/וֹ וּ/מִ/יּ֤וֹם הַ/שְּׁמִינִי֙ וָ/הָ֔לְאָה יֵרָצֶ֕ה לְ/קָרְבַּ֥ן אִשֶּׁ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/027.yaml
  text: When an ox or a sheep or a goat is born[a], it shall remain seven days under its mother, and from the eighth day onward it shall be accepted as a food offering to Yahweh.
translation:
  language: fr
  text: Quand un bovin, un mouton ou une chèvre naîtra, il restera sept jours auprès de sa mère. À partir du huitième jour, il sera agréé comme offrande par le feu[a] à Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme offrande alimentaire ». Le terme hébreu désigne une offrande présentée par le feu sacrificiel ; son interprétation précise est discutée.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: un bovin
  rationale: Le terme désigne ici un animal de l’espèce bovine sans imposer le sens français plus étroit de « bœuf », qui peut évoquer un mâle castré.
- source_word: כֶשֶׂב
  choice: un mouton
  rationale: Dans cette liste d’espèces admises au sacrifice, le nom désigne un ovin sans nécessairement préciser qu’il s’agit d’un agneau.
- source_word: עֵז
  choice: une chèvre
  rationale: Le nom sert ici à désigner l’espèce caprine; « chèvre » conserve le genre grammatical du terme sans ajouter de précision étrangère au contexte.
- source_word: כִּי יִוָּלֵד
  choice: quand … naîtra
  rationale: Dans cette prescription, כִּי introduit le cas envisagé, et le nifal de ילד exprime la naissance.
- source_word: וְהָיָה שִׁבְעַת יָמִים תַּחַת אִמּוֹ
  choice: il restera sept jours sous sa mère
  rationale: « Restera » rend naturellement la durée exprimée, tandis que « sous sa mère » conserve l’image concrète de l’hébreu, liée au jeune animal encore auprès de sa mère et nourri par elle.
- source_word: וּמִיּוֹם הַשְּׁמִינִי וָהָלְאָה
  choice: À partir du huitième jour
  rationale: Cette formulation française exprime clairement le point de départ et la continuité implicite de « dès le huitième jour et au-delà ».
- source_word: יֵרָצֶה
  choice: il sera agréé
  rationale: Le nifal de רצה indique ici que l’animal recevra l’agrément requis pour l’usage sacrificiel.
- source_word: לְקָרְבַּן אִשֶּׁה
  choice: comme offrande faite par le feu
  rationale: קָרְבָּן désigne ce qui est présenté en offrande, et אִשֶּׁה caractérise une offrande liée au feu sacrificiel. Cette traduction évite de trancher en faveur de l’interprétation discutée « nourriture offerte ».
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition marque le destinataire de l’offrande, et le nom divin est transcrit « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La transcription « Yahweh » conserve le nom propre divin présent dans le texte hébreu plutôt que de le remplacer par un titre.
- issue: Sens sacrificiel de אִשֶּׁה
  choice: offrande faite par le feu
  alternative: mets offert
  rationale: Le lien avec le feu sacrificiel est explicité sans présenter comme certaine l’étymologie ou l’interprétation alimentaire du terme.
translation_notes:
  register: Français international moderne, clair et digne. La tournure juridique reste concise. « Sous sa mère » conserve volontairement l’image hébraïque, malgré son caractère moins idiomatique que « auprès de sa mère ».
