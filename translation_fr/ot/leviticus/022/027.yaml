  - severity: low
    issue: « sous sa mère »
    rationale: Le calque est possible, mais il est inhabituel en français moderne et risque d’être compris spatialement. « Auprès de sa mère » rend le sens contextuel sans modifier la règle.
  - severity: low
    issue: 'Note : « comme mets offert »'
    rationale: « Mets offert » n’est pas une formulation terminologique naturelle en français pour l’alternative proposée. « Offrande alimentaire » est plus clair, tout en maintenant l’ambiguïté lexicale.
