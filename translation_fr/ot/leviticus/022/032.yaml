id: LEV.22.32
reference: Leviticus 22:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹ֤א תְחַלְּלוּ֙ אֶת שֵׁ֣ם קָדְשִׁ֔/י וְ/נִ֨קְדַּשְׁתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/032.yaml
  text: And you shall not profane my holy name[a], and I will be sanctified among the sons of Israel. I am Yahweh[b], who sanctifies you.
translation:
  language: fr
  text: Ne profanez pas mon saint nom, et je serai reconnu comme saint[a] au milieu des Israélites[b]. Je suis Yahweh, celui qui vous sanctifie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je manifesterai ma sainteté », « je serai traité comme saint » ou, plus littéralement, « je serai sanctifié ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « les fils d’Israël », expression habituelle désignant le peuple d’Israël.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְחַלְּלוּ
  choice: profanez
  rationale: Le piel de חלל exprime ici le fait de désacraliser ou de traiter comme ordinaire ce qui est saint. « Profaner » conserve avec concision la portée cultuelle et théologique du terme.
- source_word: שֵׁם קָדְשִׁי
  choice: mon saint nom
  rationale: Cette formulation française naturelle conserve à la fois la notion de nom et celle de sainteté portée par la construction hébraïque.
- source_word: וְנִקְדַּשְׁתִּי
  choice: et je serai reconnu comme saint
  rationale: Le nifal de קדשׁ indique ici que Yahweh sera manifesté ou tenu pour saint. « Reconnu comme saint » évite de suggérer que Dieu deviendrait saint tout en conservant la valeur passive et l'ambiguïté entre manifestation et reconnaissance.
- source_word: בְּתוֹךְ
  choice: au milieu de
  rationale: Cette expression garde clairement la valeur locative de l'hébreu tout en restant naturelle en français.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Bien que la forme littérale soit « les fils d’Israël », l’expression désigne conventionnellement ici l’ensemble du peuple d’Israël. « Les Israélites » est précis, inclusif quant au référent et naturel en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel du texte hébreu au lieu de lui substituer un titre.
- source_word: מְקַדִּשְׁכֶם
  choice: celui qui vous sanctifie
  rationale: Le participe présente l’action caractéristique ou continue de Yahweh. « Sanctifie » garde le vocabulaire de la sainteté et la précision théologique de la racine קדשׁ.
theological_decisions:
- issue: Sens passif ou déclaratif de וְנִקְדַּשְׁתִּי
  choice: je serai reconnu comme saint
  alternative: je serai sanctifié / je manifesterai ma sainteté / je serai traité comme saint
  rationale: La traduction retenue préserve l’idée que la sainteté de Yahweh doit être reconnue ou manifestée parmi son peuple, sans laisser entendre qu’une sainteté lui serait conférée.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte porte le nom propre divin. Sa translittération préserve cette donnée textuelle et l’identité d’alliance exprimée dans le passage.
- issue: Portée collective de בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël / les enfants d’Israël / le peuple d’Israël
  rationale: La locution hébraïque, grammaticalement masculine, fonctionne comme une désignation conventionnelle de toute la communauté d’Israël. Le choix français rend clairement ce référent collectif.
translation_notes:
  register: Français international moderne, direct et digne. L’impératif « Ne profanez pas » rend naturellement l’interdiction hébraïque. La coordination par « et » respecte le waw sans imposer une relation adversative ou finale absente de la forme explicite du texte.
