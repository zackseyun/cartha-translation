  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Yahweh[a] parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH ». Traditionnellement remplacé par « le Seigneur » ; autre transcription française courante : « Yahvé ».'
    reason: Signaler la forme hébraïque du nom divin, son rendu traditionnel et une transcription française courante.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר dans cette formule narrative introduit une nouvelle parole divine. « Parla » en garde la valeur formelle, tandis que la tournure française complète évite de reproduire mécaniquement le doublet hébreu « parla… en disant ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin YHWH. « Yahweh » le représente directement plutôt que de lui substituer le titre traditionnel « le Seigneur ».
- source_word: אֶל
  choice: à
  rationale: La préposition indique ici le destinataire de la parole et se rend naturellement par « à ».
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française usuelle du nom hébreu מֹשֶׁה.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L'infinitif לֵאמֹר introduit le contenu de la parole. « En ces termes » est une formule française naturelle et digne qui remplit cette fonction sans le calque pesant « en disant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le Tétragramme. La traduction conserve le nom personnel tout en signalant en note la tradition qui le remplace par un titre.
translation_notes:
  register: Français international moderne, clair et digne. La formule « parla à Moïse en ces termes » conserve la solennité de l'introduction hébraïque tout en restant idiomatique.
