  naturalness: Le français est globalement digne et compréhensible, mais la coordination « qu’ils se tiennent… qu’ils me consacrent, et qu’ils ne profanent » est grammaticalement et sémantiquement fautive dans ce contexte. Le rattachement explicite de la relative aux choses saintes est naturel en français moderne.
  terminology: « Choses saintes », « profaner », « saint nom » et « Yahweh » conviennent. « Se tenir à l’écart » est une option recevable pour le nifal de נזר ; la note conserve les alternatives pertinentes.
