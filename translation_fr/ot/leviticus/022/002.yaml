source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/יִנָּֽזְרוּ֙ מִ/קָּדְשֵׁ֣י בְנֵֽי יִשְׂרָאֵ֔ל וְ/לֹ֥א יְחַלְּל֖וּ אֶת שֵׁ֣ם קָדְשִׁ֑/י אֲשֶׁ֨ר הֵ֧ם מַקְדִּשִׁ֛ים לִ֖/י אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/002.yaml
  text: Speak to Aaron and to his sons[a], that they keep themselves from the holy things of the sons of Israel, and not profane my holy name, which they sanctify for me[c][b]. I am Yahweh.
translation:
  language: fr
  text: 'Parle à Aaron et à ses fils : qu’ils se tiennent à l’écart[a] des choses saintes que les fils d’Israël[b] me consacrent[c], et qu’ils ne profanent pas mon saint nom. Je suis Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’ils se séparent des » ou « qu’ils s’abstiennent des » choses saintes.
    reason: lexical_alternative
  - marker: b
    text: « Les fils d’Israël » reproduit l’expression hébraïque traditionnelle ; on peut aussi traduire « le peuple d’Israël » ou « les Israélites ».
    reason: lexical_alternative
  - marker: c
    text: En hébreu, cette proposition relative suit « mon saint nom », mais elle se rapporte le plus naturellement aux choses saintes que les fils d’Israël consacrent à Yahweh.
    reason: syntactic_clarification
lexical_decisions:
- source_word: דַּבֵּר
  choice: Parle
  rationale: L’impératif piel de דבר introduit ici l’ordre divin donné à Moïse. « Parle » est direct, courant et proche de la forme hébraïque.
- source_word: וְיִנָּזְרוּ
  choice: qu’ils se tiennent à l’écart
  rationale: Le nifal de נזר exprime ici l’idée de se séparer ou de s’abstenir à l’égard des réalités saintes. Cette formulation française rend clairement la valeur réflexive sans préciser au-delà du texte la circonstance d’exclusion.
- source_word: מִקָּדְשֵׁי
  choice: des choses saintes
  rationale: Cette expression conserve l’étendue cultuelle de קָדְשֵׁי. « Offrandes saintes » serait plus explicite, mais aussi plus restrictif.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: des fils d’Israël
  rationale: La formulation garde l’expression nationale et conventionnelle de l’hébreu, tandis qu’une note indique les équivalents français plus idiomatiques.
- source_word: יְחַלְּלוּ
  choice: profanent
  rationale: Le piel de חלל désigne, dans ce contexte de sainteté, l’action de traiter comme profane ou de porter atteinte au caractère sacré.
- source_word: שֵׁם קָדְשִׁי
  choice: mon saint nom
  rationale: Rendu idiomatique et exact de la construction hébraïque, qui conserve toute la portée théologique du nom divin.
- source_word: אֲשֶׁר הֵם מַקְדִּשִׁים לִי
  choice: qu’ils me consacrent
  rationale: « Consacrer » exprime naturellement l’action de rendre ou de déclarer saint pour Dieu. La place de la proposition en français la rattache aux « choses saintes », conformément au sens syntaxique et contextuel le plus probable.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre divin plutôt que remplacé par le titre traditionnel « le Seigneur ».
theological_decisions:
- issue: Référent de la proposition « qu’ils me consacrent »
  choice: La proposition se rapporte aux « choses saintes des fils d’Israël ».
  alternative: La proposition pourrait être rattachée, selon la proximité des mots dans l’ordre hébreu, à « mon saint nom ».
  rationale: Le contexte cultuel et l’emploi de מקדישׁים לִי conviennent le mieux aux choses saintes consacrées à Yahweh. La note documente le déplacement syntaxique effectué pour obtenir un français naturel sans masquer l’ordre de l’hébreu.
- issue: Portée de l’éloignement demandé aux prêtres
  choice: Le verset ordonne aux prêtres de se tenir à l’écart des choses saintes dans les situations visées par le contexte.
  alternative: Comprendre une séparation absolue et permanente de toutes les choses saintes.
  rationale: Une séparation absolue contredirait la fonction sacerdotale décrite dans le contexte. La traduction n’ajoute toutefois pas ici la condition d’impureté, explicitée dans les versets suivants.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation met en évidence le discours adressé à Aaron et à ses fils. Le vocabulaire cultuel « choses saintes », « consacrent » et « profanent » préserve les liens lexicaux autour de la sainteté sans ajouter de précision absente de ce verset.
