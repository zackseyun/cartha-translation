source:
  edition: WLC
  text: וּ/בָ֥א הַ/שֶּׁ֖מֶשׁ וְ/טָהֵ֑ר וְ/אַחַר֙ יֹאכַ֣ל מִן הַ/קֳּדָשִׁ֔ים כִּ֥י לַחְמ֖/וֹ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/007.yaml
  text: When the sun has set, he will be clean; and afterward he may eat from the holy things, because they are his food.
translation:
  language: fr
  text: Quand le soleil se sera couché, il sera pur. Ensuite, il pourra manger des choses saintes[a], car elles sont sa nourriture[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des offrandes sacrées ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « car c’est son pain ». Ici, « pain » désigne la nourriture qui lui revient parmi les portions sacrées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַשֶּׁמֶשׁ
  choice: Quand le soleil se sera couché
  rationale: L’expression hébraïque signifie littéralement que « le soleil vient », mais elle désigne idiomatiquement son coucher. Le futur antérieur rend naturellement en français l’antériorité de ce moment par rapport au retour à l’état de pureté.
- source_word: וְטָהֵר
  choice: il sera pur
  rationale: Dans ce contexte sacerdotal, le verbe indique le rétablissement de la pureté rituelle. « Pur » conserve le vocabulaire cultuel sans lui attribuer un sens moral absent du passage.
- source_word: וְאַחַר
  choice: Ensuite
  rationale: Ce terme marque l’étape suivante de la prescription. « Ensuite » exprime clairement et sobrement cet enchaînement.
- source_word: יֹאכַל
  choice: il pourra manger
  rationale: Dans cette prescription, l’imparfait hébreu exprime l’action désormais permise après le retour à la pureté. « Pourra » communique cette autorisation sans transformer le propos en ordre.
- source_word: מִן הַקֳּדָשִׁים
  choice: manger des choses saintes
  rationale: Le pluriel désigne les réalités ou portions consacrées. « Choses saintes » reste proche du terme hébreu et laisse ouverte la possibilité contextuelle de comprendre les offrandes sacrées.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison pour laquelle le prêtre peut en manger. « Car » convient au registre digne d’une prescription légale tout en restant courant.
- source_word: לַחְמוֹ הוּא
  choice: elles sont sa nourriture
  rationale: Le mot לֶחֶם signifie littéralement « pain », mais peut désigner plus largement la nourriture ou la subsistance. Le pronom pluriel français reprend naturellement « les choses saintes », tandis que la note conserve la forme singulière et l’image littérale de l’hébreu.
theological_decisions:
- issue: Nature de la pureté
  choice: pureté rituelle
  alternative: pureté morale ou spirituelle
  rationale: L’ensemble de Lévitique 22 traite de l’accès sacerdotal aux aliments consacrés après une souillure rituelle. La traduction emploie simplement « pur » et laisse le contexte cultuel en préciser le sens.
- issue: Statut des choses saintes comme nourriture sacerdotale
  choice: nourriture attribuée au prêtre
  alternative: pain au sens strict
  rationale: Dans ce contexte, le « pain » est la part sacrée qui assure la nourriture du prêtre. La traduction ne limite donc pas le terme à du pain matériel, mais la note signale la formulation littérale.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le vocabulaire cultuel de la sainteté et de la pureté, tout en explicitant naturellement la succession temporelle et la permission légale.
