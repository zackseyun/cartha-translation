source:
  edition: WLC
  text: וְ/כִֽי תִזְבְּח֥וּ זֶֽבַח תּוֹדָ֖ה לַ/יהוָ֑ה לִֽ/רְצֹנְ/כֶ֖ם תִּזְבָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/029.yaml
  text: And when you sacrifice a thank offering to Yahweh[a], you shall sacrifice it for your acceptance.
translation:
  language: fr
  text: Quand vous sacrifierez à Yahweh un sacrifice de reconnaissance, vous le sacrifierez pour qu’il soit agréé en votre faveur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כִי
  choice: Quand
  rationale: Dans cette prescription cultuelle, la conjonction introduit naturellement le cas où le sacrifice est offert; « Quand » restitue le sens temporel et casuistique sans lourdeur.
- source_word: תִזְבְּחוּ / תִּזְבָּחוּ
  choice: vous sacrifierez / vous le sacrifierez
  rationale: Le verbe זבח désigne ici l’acte de sacrifier. Sa répétition est conservée afin de respecter l’insistance de l’hébreu.
- source_word: זֶבַח תּוֹדָה
  choice: un sacrifice de reconnaissance
  rationale: La construction désigne un sacrifice caractérisé par l’action de grâce. « Sacrifice de reconnaissance » est clair, digne et courant dans le registre biblique français.
- source_word: לַ/יהוָה
  choice: à Yahweh
  rationale: La préposition marque le destinataire du sacrifice, et le nom divin est translittéré conformément au texte source.
- source_word: לִ/רְצֹנְכֶם
  choice: de manière à être agréés
  rationale: Dans ce contexte sacrificiel, רָצוֹן concerne l’agrément obtenu devant Dieu. Cette formulation française exprime que les offrants doivent être agréés, tout en évitant de comprendre l’expression comme leur préférence personnelle.
theological_decisions:
- issue: Référent de l’agrément dans לִרְצֹנְכֶם
  choice: de manière à être agréés
  alternative: pour qu’il soit agréé en votre faveur
  rationale: Le suffixe de deuxième personne plurielle oriente littéralement l’expression vers l’agrément des offrants (« pour votre agrément »), même si celui-ci passe par l’acceptation correcte du sacrifice. La traduction retient cette orientation sans développer davantage l’implicite cultuel.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahweh » le représente directement plutôt que de le remplacer par un titre.
translation_notes:
  register: Français moderne, sobre et cultuel. La répétition de « sacrifierez » reproduit volontairement celle du texte hébreu; « reconnaissance » exprime ici l’action de grâce adressée à Dieu.
