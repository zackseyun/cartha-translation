id: LEV.22.21
reference: Leviticus 22:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יַקְרִ֤יב זֶֽבַח שְׁלָמִים֙ לַ/יהוָ֔ה לְ/פַלֵּא נֶ֨דֶר֙ א֣וֹ לִ/נְדָבָ֔ה בַּ/בָּקָ֖ר א֣וֹ בַ/צֹּ֑אן תָּמִ֤ים יִֽהְיֶה֙ לְ/רָצ֔וֹן כָּל מ֖וּם לֹ֥א יִהְיֶה בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/021.yaml
  text: And if a man presents a sacrifice of peace offerings to Yahweh[a], to fulfill a vow or as a freewill offering, from the herd or from the flock, it shall be without blemish to be accepted[b]; there shall be no defect in it.
translation:
  language: fr
  text: Si un homme présente à Yahweh un sacrifice de paix[a], pour accomplir un vœu[b] ou comme offrande volontaire, pris dans le gros ou le petit bétail, l’animal devra être sans défaut pour être agréé ; il ne devra avoir aucun défaut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de communion ». L’expression hébraïque désigne une catégorie de sacrifices liée à la paix, à l’intégrité et au partage d’un repas sacrificiel.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour exécuter un vœu », c’est-à-dire pour s’acquitter de l’offrande promise.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Si un homme
  rationale: La formulation juridique conditionnelle est rendue par « si ». Le masculin singulier אִישׁ est conservé par « un homme ».
- source_word: יַקְרִיב
  choice: présente
  rationale: Dans le contexte sacrificiel, le hifil de קרב désigne l’action de présenter une offrande ; « présente » reste naturel et précis.
- source_word: זֶבַח שְׁלָמִים
  choice: un sacrifice de paix
  rationale: Cette expression française conserve le lien lexical avec la paix et distingue la catégorie sacrificielle sans imposer l’interprétation plus explicite de « communion ».
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le nom divin יהוה est translittéré afin de représenter directement le nom propre présent dans le texte hébreu.
- source_word: לְפַלֵּא נֶדֶר
  choice: pour accomplir un vœu
  rationale: Dans cette législation sacrificielle, l’expression désigne l’exécution de l’engagement pris par un vœu. « Accomplir » est idiomatique sans effacer la nuance d’exécution.
- source_word: אוֹ לִנְדָבָה
  choice: ou comme offrande volontaire
  rationale: נְדָבָה désigne une offrande librement consentie, distincte de celle qui acquitte un vœu.
- source_word: בַּבָּקָר אוֹ בַצֹּאן
  choice: pris dans le gros ou le petit bétail
  rationale: בקר et צאן désignent respectivement les bovins et les troupeaux de petit bétail, notamment ovins et caprins. La formulation française restitue ces deux grandes catégories.
- source_word: תָּמִים יִהְיֶה לְרָצוֹן
  choice: l’animal devra être sans défaut pour être agréé
  rationale: תמים indique ici l’absence de défaut physique, tandis que לרצון exprime la condition d’acceptabilité de l’offrande.
- source_word: כָּל מוּם לֹא יִהְיֶה בּוֹ
  choice: il ne devra avoir aucune malformation
  rationale: מוּם désigne un défaut physique disqualifiant. « Malformation » évite une répétition lourde tout en maintenant la portée concrète de l’exigence.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte contient le nom propre divin. « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Sens de זֶבַח שְׁלָמִים
  choice: sacrifice de paix
  alternative: sacrifice de communion
  rationale: « Paix » préserve le lien lexical avec la racine שׁלם, tandis que « communion » explicite une dimension possible du sacrifice mais en réduit la richesse sémantique.
- issue: Sujet masculin de la règle juridique
  choice: un homme
  alternative: quelqu’un / une personne
  rationale: Le texte hébreu emploie אִישׁ au masculin singulier dans une formulation représentative ; la traduction conserve cette forme sans prétendre trancher ici toute la portée juridique de la règle.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde la structure juridique conditionnelle du texte tout en précisant « l’animal » pour éviter une ambiguïté référentielle. Les termes « gros bétail » et « petit bétail » relèvent d’un registre courant dans les textes agricoles et bibliques.
