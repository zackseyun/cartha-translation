id: LEV.22.16
reference: Leviticus 22:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִשִּׂ֤יאוּ אוֹתָ/ם֙ עֲוֺ֣ן אַשְׁמָ֔ה בְּ/אָכְלָ֖/ם אֶת קָדְשֵׁי/הֶ֑ם כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/016.yaml
  text: and so cause them to bear guilt requiring restitution by eating their holy things[c][b][a], for I am Yahweh who sanctifies them.
translation:
  language: fr
  text: Ils les chargeraient ainsi d’une faute exigeant réparation[a], quand ceux-ci mangeraient leurs offrandes saintes[b]. En effet, je suis Yahvé, celui qui les sanctifie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « feraient peser sur eux une culpabilité ». L’expression hébraïque est difficile et peut souligner la responsabilité encourue pour une faute exigeant réparation.'
    reason: lexical_alternative
  - marker: b
    text: Les « offrandes saintes » sont les dons ou les portions consacrés à Yahvé.
    reason: cultural_note
  - marker: c
    text: 'Ou : « qui les rend saints » ou « qui les consacre ». Le pronom « les » renvoie très probablement aux personnes concernées, mais l’hébreu ne répète pas explicitement son référent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשִּׂיאוּ אוֹתָם
  choice: Ils les chargeraient ainsi
  rationale: Le hiphil de נשׂא exprime ici le fait de faire porter une responsabilité à quelqu’un. Le conditionnel français prolonge naturellement l’interdiction et sa conséquence formulées au verset précédent, tandis que « ainsi » rend la valeur consécutive de la conjonction.
- source_word: עֲוֺן אַשְׁמָה
  choice: une faute exigeant réparation
  rationale: La combinaison des deux termes désigne une culpabilité liée à une faute cultuelle qui entraîne une obligation de réparation; cette formulation conserve à la fois la faute et sa conséquence juridique sans imposer explicitement la mention d’un sacrifice.
- source_word: בְּאָכְלָם
  choice: quand ceux-ci mangeraient
  rationale: La préposition ב avec l’infinitif construit peut indiquer la circonstance ou le moyen. Ici, une proposition temporelle est naturelle en français; « ceux-ci » distingue les personnes chargées de culpabilité du sujet implicite qui les y exposerait.
- source_word: קָדְשֵׁיהֶם
  choice: leurs offrandes saintes
  rationale: Littéralement « leurs choses saintes »; dans ce contexte lévitique, il s’agit des dons ou portions consacrés. « Offrandes saintes » est plus idiomatique en français tout en conservant leur caractère sacré.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin représenté par le tétragramme, plutôt qu’un remplacement par un titre.
- source_word: מְקַדְּשָׁם
  choice: celui qui les sanctifie
  rationale: Le participe piel de קדשׁ signifie « sanctifier, rendre saint, consacrer ». « Sanctifie » maintient le registre cultuel et théologique du Lévitique.
theological_decisions:
- issue: Référent du suffixe « les » dans מְקַדְּשָׁם
  choice: Conserver le pronom pluriel sans préciser son référent dans le texte principal
  alternative: Expliciter soit les personnes concernées, soit les offrandes saintes
  rationale: Le référent humain est le plus naturel dans le contexte, mais la syntaxe hébraïque ne le nomme pas de nouveau. Le pronom préserve cette formulation et évite de résoudre silencieusement une ambiguïté réelle.
- issue: Portée cultuelle de עֲוֺן אַשְׁמָה
  choice: faute exigeant réparation
  alternative: culpabilité; faute passible d’un sacrifice de réparation
  rationale: La formulation retenue exprime la responsabilité et l’exigence réparatrice propres au contexte sans identifier de manière trop étroite la réparation au seul sacrifice de culpabilité.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le langage cultuel de la faute, de la réparation, des offrandes saintes et de la sanctification, tout en évitant le calque peu naturel « iniquité de culpabilité ». Les pronoms maintiennent la cohésion avec le contexte immédiat et l’ambiguïté résiduelle du texte hébreu.
