source:
  edition: WLC
  text: וְ/כֹהֵ֗ן כִּֽי יִקְנֶ֥ה נֶ֨פֶשׁ֙ קִנְיַ֣ן כַּסְפּ֔/וֹ ה֖וּא יֹ֣אכַל בּ֑/וֹ וִ/ילִ֣יד בֵּית֔/וֹ הֵ֖ם יֹאכְל֥וּ בְ/לַחְמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/011.yaml
  text: But if a priest buys a person as his property with his money[a], he may eat of it[b], and those born in his house may eat of his food.
translation:
  language: fr
  text: Mais si un prêtre achète avec son argent une personne comme sa propriété[a], cette personne pourra manger de la nourriture sainte[b]. Ceux qui sont nés dans sa maison pourront eux aussi manger de sa nourriture.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une personne, acquisition de son argent »; c’est-à-dire une personne achetée avec son argent.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pourra en manger ». Le contexte indique qu’il s’agit de la nourriture sainte réservée aux prêtres et à leur maison.'
    reason: referent_clarification
lexical_decisions:
- source_word: וְ/כֹהֵן כִּי
  choice: Mais si un prêtre
  rationale: Dans la suite des cas juridiques, וְ marque ici le contraste avec l’exclusion énoncée au verset précédent, tandis que כִּי introduit le cas envisagé.
- source_word: יִקְנֶה נֶפֶשׁ
  choice: achète une personne
  rationale: קנה désigne ici une acquisition par achat, et נֶפֶשׁ une personne humaine, non une âme au sens immatériel.
- source_word: קִנְיַן כַּסְפּוֹ
  choice: avec son argent pour en faire sa propriété
  rationale: Cette formulation française explicite à la fois le moyen d’acquisition et le statut de propriété exprimé par la construction hébraïque, sans en atténuer la réalité juridique.
- source_word: הוּא יֹאכַל בּוֹ
  choice: cette personne pourra manger de la nourriture sainte
  rationale: הוּא renvoie à la personne achetée. Le référent implicite de בּוֹ est la nourriture consacrée mentionnée dans le contexte; le rendre explicitement évite une ambiguïté artificielle en français.
- source_word: וִילִיד בֵּיתוֹ
  choice: Ceux qui sont nés dans sa maison
  rationale: L’expression désigne collectivement les personnes nées dans la maisonnée, comme le confirment le pronom et le verbe pluriels qui suivent, sans que le français ait besoin de préciser davantage leur statut.
- source_word: הֵם יֹאכְלוּ
  choice: pourront eux aussi manger
  rationale: Dans ce texte juridique, l’imparfait hébreu exprime l’autorisation. « Eux aussi » restitue naturellement le pronom indépendant emphatique הֵם et le parallélisme avec la personne achetée.
- source_word: בְלַחְמוֹ
  choice: de sa nourriture
  rationale: לֶחֶם signifie littéralement « pain », mais désigne ici plus largement la nourriture sacerdotale attribuée au prêtre.
theological_decisions:
- issue: Rendre le statut de propriété lié à l’achat d’une personne
  choice: avec son argent pour en faire sa propriété
  alternative: qu’il a achetée avec son argent
  rationale: La traduction conserve explicitement la dimension de propriété de קִנְיַן כַּסְפּוֹ plutôt que de l’adoucir en simple relation de service. Cette transparence lexicale ne constitue pas une approbation morale de l’institution décrite.
- issue: Identifier le référent de la nourriture autorisée
  choice: de la nourriture sainte
  alternative: en manger
  rationale: Le pronom בּוֹ renvoie contextuellement aux aliments consacrés dont traite le passage. L’explicitation rend le français intelligible tout en maintenant la portée cultuelle du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire juridique reste direct afin de ne pas masquer la relation de propriété décrite par l’hébreu. La répétition de « cette personne » lève l’ambiguïté possible du pronom masculin, qui pourrait autrement sembler renvoyer au prêtre.
