review_pass:
  verdict: revise
  source_fidelity: La condition « veuve ou divorcée », l’absence de descendance, le retour à la maison paternelle et l’autorisation de manger sont bien rendus. « Descendant » au singulier est toutefois moins idiomatique et moins nettement collectif que זֶרַע dans ce contexte. « Personne étrangère au sacerdoce » risque de réduire la notion de זָר à l’absence de statut sacerdotal, alors que le terme vise plus largement une personne non admise à cette consommation.
  naturalness: La phrase est claire, mais « n’a pas de descendant » est plus naturel sous la forme « n’a pas de descendance ». « Divorcée » est le terme juridique moderne usuel et rend suffisamment le statut de גרושה sans l’association plus marquée de « répudiée ».
  terminology: « Nourriture » convient pour לֶחֶם, avec une note signalant « pain ». « Personne non autorisée » rend de façon accessible la portée cultuelle et juridique de זָר; la note précise qu’il ne s’agit pas nécessairement d’une origine étrangère.
  issues:
  - severity: medium
    issue: « descendant » au singulier
    rationale: Le mot hébreu זֶרַע est collectif et désigne la descendance ou des enfants. « N’a pas de descendance » restitue mieux cette portée en français naturel.
  - severity: medium
    issue: « personne étrangère au sacerdoce »
    rationale: Cette expression peut laisser entendre que tout non-prêtre est visé en tant que tel, alors que זָר désigne, dans cette règle d’accès, une personne extérieure au groupe admis à manger. « Personne non autorisée » est plus fidèle au fonctionnement juridique du terme.
  - severity: low
    issue: « répudiée »
    rationale: Le terme est possible dans un cadre ancien, mais « divorcée » est plus naturel en français international moderne et exprime le statut de גרושה sans ajouter une coloration sociale inutile.
