revisions:
- from: Mais si la fille d’un prêtre devient veuve ou est répudiée, qu’elle n’a pas de descendant et qu’elle retourne vivre dans la maison de son père comme dans sa jeunesse, elle pourra manger de la nourriture de son père[a]. Mais aucune personne étrangère au sacerdoce ne pourra en manger[b].
  to: Mais si une fille de prêtre devient veuve ou divorcée, n’a pas de descendance et retourne dans la maison de son père comme dans sa jeunesse, elle pourra manger de la nourriture de son père[a] ; mais aucune personne non autorisée ne pourra en manger[b].
  rationale: Les corrections améliorent la portée collective de « descendance », la terminologie moderne du statut marital et la précision de l’exclusion juridique, sans préciser au-delà du texte les catégories de personnes admises. Les ancres et leur contenu sont conservés et ajustés à la formulation révisée.
