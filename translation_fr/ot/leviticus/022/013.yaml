base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/013.yaml
  text: But if a priest’s daughter becomes a widow or divorced[a], and has no offspring, and returns to her father’s house as in her youth, she may eat from her father’s food[b]; but no outsider may eat of it.
translation:
  language: fr
  text: Mais si une fille de prêtre devient veuve ou divorcée, n’a pas de descendance et retourne dans la maison de son père comme dans sa jeunesse, elle pourra manger de la nourriture de son père[a] ; mais aucune personne non autorisée ne pourra en manger[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du pain de son père ». Ici, le mot « pain » désigne probablement plus largement la nourriture ou les provisions du foyer sacerdotal.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « aucun étranger ». Le terme hébreu désigne ici une personne qui ne fait pas partie du cercle autorisé à manger de cette nourriture, et non nécessairement une personne d’origine étrangère.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת כֹּהֵן כִּי תִהְיֶה
  choice: Mais si la fille d’un prêtre devient
  rationale: Le waw marque ici naturellement le contraste avec le verset précédent; כִּי introduit la situation conditionnelle, et היה décrit l’entrée dans l’état envisagé.
- source_word: אַלְמָנָה וּגְרוּשָׁה
  choice: veuve ou est répudiée
  rationale: Les deux statuts sont des possibilités alternatives dans cette règle. « Répudiée » rend le participe passif גרושה et convient au cadre juridique ancien sans lui substituer les catégories modernes du divorce.
- source_word: וְזֶרַע אֵין לָהּ
  choice: qu’elle n’a pas de descendant
  rationale: זֶרַע, littéralement « semence », désigne ici la descendance. Le singulier collectif « descendant » préserve une portée plus large que « enfant ».
- source_word: וְשָׁבָה אֶל בֵּית אָבִיהָ
  choice: qu’elle retourne vivre dans la maison de son père
  rationale: שׁוב exprime le retour; « vivre » explicite naturellement en français la réintégration au foyer paternel impliquée par le contexte, sans modifier la condition juridique.
- source_word: כִּנְעוּרֶיהָ
  choice: comme dans sa jeunesse
  rationale: La formulation conserve la comparaison avec sa situation antérieure au sein de la maison paternelle.
- source_word: מִלֶּחֶם אָבִיהָ תֹּאכֵל
  choice: elle pourra manger de la nourriture de son père
  rationale: לֶחֶם signifie littéralement « pain », mais peut désigner par métonymie la nourriture ou les provisions. Le futur français à valeur de permission convient à cette disposition juridique.
- source_word: וְכָל זָר
  choice: Mais aucune personne étrangère au sacerdoce
  rationale: Dans la législation sacerdotale, זָר désigne une personne extérieure au cercle autorisé, et non nécessairement quelqu’un d’une autre ethnie. Cette formulation évite l’ambiguïté moderne d’« étranger ».
- source_word: לֹא יֹאכַל בּוֹ
  choice: ne pourra en manger
  rationale: La négation exprime une interdiction juridique; le pronom « en » reprend la nourriture mentionnée auparavant.
theological_decisions:
- issue: Nature de la « nourriture du père »
  choice: Traduire לֶחֶם par « nourriture » tout en signalant le sens littéral en note.
  alternative: « pain »
  rationale: Le contexte de Lévitique 22 porte sur l’accès aux aliments sacrés attribués au prêtre. « Nourriture » rend l’emploi métonymique probable sans préciser davantage la catégorie des aliments.
- issue: Portée de זָר
  choice: « personne étrangère au sacerdoce »
  alternative: « étranger » ou « personne non autorisée »
  rationale: Le terme définit ici une exclusion cultuelle et juridique plutôt qu’ethnique. La traduction rend cette portée contextuelle sans introduire une catégorie confessionnelle ultérieure.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe juridique demeure lisible; « répudiée » conserve la perspective passive du texte ancien. Les deux appels de note [a] et [b] figurent dans le texte.
