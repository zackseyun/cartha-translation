  text: אִ֣ישׁ אִ֞ישׁ מִ/זֶּ֣רַע אַהֲרֹ֗ן וְ/ה֤וּא צָר֨וּעַ֙ א֣וֹ זָ֔ב בַּ/קֳּדָשִׁים֙ לֹ֣א יֹאכַ֔ל עַ֖ד אֲשֶׁ֣ר יִטְהָ֑ר וְ/הַ/נֹּגֵ֨עַ֙ בְּ/כָל טְמֵא נֶ֔פֶשׁ א֣וֹ אִ֔ישׁ אֲשֶׁר תֵּצֵ֥א מִמֶּ֖/נּוּ שִׁכְבַת זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/004.yaml
  text: Any man from the offspring of Aaron[a], if he is afflicted with a skin disease or has a discharge, shall not eat from the holy things until he becomes clean. And whoever touches anything unclean by a dead person, or a man from whom an emission of semen comes out[b],
translation:
  language: fr
  text: Tout homme parmi les descendants d’Aaron qui est atteint d’une affection de la peau[a] ou qui a un écoulement ne mangera pas des choses saintes jusqu’à ce qu’il devienne pur. De même, celui qui touche quoi que ce soit d’impur à cause d’un mort[b], ou un homme qui a une émission de sperme,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « lépreux ». Le terme hébreu désigne largement une affection de la peau entraînant l’impureté rituelle, et non nécessairement la lèpre moderne (maladie de Hansen).'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque est difficile. Elle peut aussi se comprendre comme « toute personne devenue impure au contact d’un mort »; elle renvoie à une impureté liée à un mort ou à un cadavre.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: Tout homme
  rationale: Le redoublement a une valeur distributive (« tout homme », « quiconque »); le masculin convient au contexte des descendants sacerdotaux d’Aaron.
- source_word: מִזֶּרַע אַהֲרֹן
  choice: parmi les descendants d’Aaron
  rationale: זֶרַע désigne ici la lignée; « descendants » exprime naturellement le sens généalogique.
- source_word: צָרוּעַ
  choice: atteint d’une affection de la peau
  rationale: Le terme désigne une affection entraînant l’impureté rituelle sans correspondre nécessairement à la lèpre moderne.
- source_word: זָב
  choice: a un écoulement
  rationale: Formulation concise et digne pour un écoulement corporel entraînant l’impureté rituelle.
- source_word: בַּקֳּדָשִׁים
  choice: des choses saintes
  rationale: Désigne les portions consacrées dont les prêtres pouvaient manger; la formulation conserve la généralité du pluriel hébreu.
- source_word: לֹא יֹאכַל
  choice: ne mangera pas
  rationale: Le futur français rend ici la prohibition du registre législatif.
- source_word: עַד אֲשֶׁר יִטְהָר
  choice: jusqu’à ce qu’il devienne pur
  rationale: Le verbe indique le passage à l’état de pureté rituelle, sans suggérer nécessairement une guérison médicale.
- source_word: וְהַנֹּגֵעַ
  choice: Il en va de même de celui qui touche
  rationale: Le participe substantivé introduit un autre cas de disqualification; cette formulation rend explicite la continuité syntaxique d’une liste qui se poursuit au verset suivant.
- source_word: בְּכָל טְמֵא נֶפֶשׁ
  choice: quelqu’un rendu impur par un mort
  rationale: L’expression difficile renvoie vraisemblablement à une personne porteuse d’une impureté liée à un cadavre; la note conserve l’autre analyse possible.
- source_word: שִׁכְבַת זָרַע
  choice: une émission de sperme
  rationale: Expression moderne, exacte et digne pour l’idiome hébreu relatif à l’émission séminale.
- source_word: תֵּצֵא מִמֶּנּוּ
  choice: qui a une émission
  rationale: Une tournure idiomatique française évite le calque lourd « dont sort une émission » tout en conservant le sens.
theological_decisions:
- issue: Terminologie de l’impureté rituelle et diagnostic médical
  choice: « affection de la peau » et « devienne pur »
  alternative: « lèpre » et « soit guéri/purifié »
  rationale: Le passage traite de l’aptitude rituelle du prêtre, non d’un diagnostic de maladie de Hansen ni d’une faute morale; le rendu maintient cette distinction.
- issue: Sujet masculin de la règle sacerdotale
  choice: « Tout homme parmi les descendants d’Aaron »
  alternative: « Toute personne » ou « quiconque »
  rationale: Le masculin est à la fois grammatical et contextuel, puisque le texte vise ici les hommes de la lignée sacerdotale d’Aaron.
- issue: Analyse de טְמֵא נֶפֶשׁ
  choice: Une personne rendue impure par contact avec un mort
  alternative: Une chose impure à cause d’un mort / un cadavre
  rationale: La syntaxe permet une certaine hésitation. Le choix principal s’accorde avec l’usage de l’expression pour l’impureté contractée auprès d’un mort, tandis que la note signale l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et législatif. Le verset formant une phrase inachevée qui se poursuit au verset 5, la virgule finale est conservée. « Il en va de même » clarifie en français la coordination des différents cas sans anticiper la conclusion du verset suivant.
