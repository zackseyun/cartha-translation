  variant: modern international French
source:
  edition: WLC
  text: אוֹ אִישׁ֙ אֲשֶׁ֣ר יִגַּ֔ע בְּ/כָל שֶׁ֖רֶץ אֲשֶׁ֣ר יִטְמָא ל֑/וֹ א֤וֹ בְ/אָדָם֙ אֲשֶׁ֣ר יִטְמָא ל֔/וֹ לְ/כֹ֖ל טֻמְאָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/005.yaml
  text: or a man who touches any swarming thing by which he becomes unclean[a], or a person by whom he becomes unclean[b], whatever his uncleanness.
translation:
  language: fr
  text: ou un homme qui touche n’importe quelle créature grouillante[a] qui le rend impur, ou une personne qui le rend impur, quelle que soit son impureté[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’importe quelle bête qui rampe ». Le terme hébreu désigne de petites créatures qui pullulent ou se déplacent près du sol.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu est condensé et dit littéralement « pour toute son impureté ». Dans le contexte, le possessif renvoie le plus naturellement à la personne touchée. Les formes masculines singulières ont ici une portée juridique générique.
    reason: lexical_and_grammatical_clarification
lexical_decisions:
- source_word: אוֹ
  choice: ou
  rationale: Conjonction disjonctive simple qui poursuit la liste commencée au verset précédent.
- source_word: אִישׁ
  choice: un homme
  rationale: Reflète le masculin singulier du texte source; dans cette formulation juridique, le terme a une portée générique.
- source_word: יִגַּע
  choice: touche
  rationale: Équivalent courant et précis de נגע dans les lois de pureté.
- source_word: בְּכָל שֶׁרֶץ
  choice: n’importe quelle créature grouillante
  rationale: שֶׁרֶץ désigne ici une catégorie générale de petites créatures qui pullulent ou se déplacent près du sol, sans permettre une identification zoologique plus précise.
- source_word: אֲשֶׁר יִטְמָא לוֹ
  choice: qui le rend impur
  rationale: Exprime naturellement en français que le contact avec la créature entraîne l’impureté rituelle de l’homme.
- source_word: בְאָדָם
  choice: un être humain
  rationale: אָדָם désigne ici une personne comme source humaine d’impureté; «être humain» conserve la portée générique sans imposer le sexe masculin.
- source_word: אֲשֶׁר יִטְמָא לוֹ לְכֹל טֻמְאָתוֹ
  choice: par lequel il devient impur, quelle que soit son impureté
  rationale: Conserve la construction compacte de l’hébreu ainsi que l’ambiguïté du possessif final, sans expliciter au-delà du texte la nature précise de l’impureté transmise.
- source_word: טֻמְאָה
  choice: impureté
  rationale: Terme français usuel dans le contexte rituel lévitique; il maintient le lien lexical avec «impur» et n’introduit pas une idée de culpabilité morale.
theological_decisions:
- issue: Nature de l’impureté dans la législation lévitique
  choice: Employer «impur / impureté» au sens rituel.
  alternative: Employer un vocabulaire moralisant tel que «souillé / souillure».
  rationale: Le passage traite de l’état rituel requis des prêtres, et non nécessairement d’une faute morale.
- issue: Référent du possessif dans «toute son impureté»
  choice: 'Conserver en français le possessif ambigu: «quelle que soit son impureté».'
  alternative: 'Préciser: «quelle que soit l’impureté de cette personne».'
  rationale: Le suffixe masculin singulier hébreu peut renvoyer grammaticalement à l’homme devenu impur ou à l’être humain touché; le contexte favorise souvent ce dernier, mais le texte reste condensé et ne justifie pas de supprimer toute ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase demeure un fragment coordonné au verset précédent. «Créature grouillante» préserve la catégorie ancienne sans familiarité excessive; «être humain» rend la portée générique de אָדָם. Les marqueurs [a] et [b] figurent dans le texte.
