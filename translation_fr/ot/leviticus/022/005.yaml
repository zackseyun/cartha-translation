revisions:
- from: ou un homme qui touche n’importe quelle créature grouillante[a] qui le rend impur, ou un être humain par lequel il devient impur, quelle que soit son impureté[b].
  to: ou un homme qui touche n’importe quelle créature grouillante[a] qui le rend impur, ou une personne qui le rend impur, quelle que soit son impureté[b].
  rationale: La révision remplace une tournure littérale mais raide par « une personne qui le rend impur », qui exprime clairement la relation causative du texte hébreu et s’accorde avec le rendu anglais audité. Elle conserve le langage d’impureté rituelle, la construction fragmentaire dépendant du verset précédent, les deux ancres de notes et une note prudente sur la construction condensée finale.
