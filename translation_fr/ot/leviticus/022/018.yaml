id: LEV.22.18
reference: Leviticus 22:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/אֶל֙ כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֣ישׁ אִישׁ֩ מִ/בֵּ֨ית יִשְׂרָאֵ֜ל וּ/מִן הַ/גֵּ֣ר בְּ/יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יַקְרִ֤יב קָרְבָּנ/וֹ֙ לְ/כָל נִדְרֵי/הֶם֙ וּ/לְ/כָל נִדְבוֹתָ֔/ם אֲשֶׁר יַקְרִ֥יבוּ לַ/יהוָ֖ה לְ/עֹלָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/018.yaml
  text: 'Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them: Any man from the house of Israel, or from the sojourners in Israel, who presents his offering for any of their vows or any of their freewill offerings[c][b], which they present to Yahweh as a burnt offering—'
translation:
  language: fr
  text: '« Parle à Aaron, à ses fils et à tous les Israélites[a]. Tu leur diras : Tout homme, qu’il soit de la maison d’Israël ou étranger résidant en Israël[b], qui présentera à Yahweh une offrande en holocauste, pour l’accomplissement de l’un de ses vœux ou à titre d’offrande volontaire[c] — »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tous les fils d’Israël ».'
    reason: La note conserve la forme hébraïque de l’expression collective rendue idiomatiquement par « tous les Israélites ».
  - marker: b
    text: 'Le terme hébreu désigne un non-Israélite qui vit au sein d’Israël sous l’ordre de sa communauté ; on peut aussi traduire : « l’immigré résidant en Israël ».'
    reason: Cette note explicite le statut durable exprimé par גֵּר et donne une autre traduction possible.
  - marker: c
    text: 'On peut aussi comprendre : « pour l’accomplissement de l’un de leurs vœux ou de leurs offrandes volontaires ». Les « vœux » peuvent désigner plus précisément des offrandes faites en accomplissement de vœux.'
    reason: La note signale l’ambiguïté de la relation entre les vœux, les offrandes volontaires et l’offrande présentée.
lexical_decisions:
- source_word: דַּבֵּר
  choice: Parle
  rationale: L’impératif piel introduit ici une instruction divine solennelle; « Parle » conserve directement la forme de l’ordre.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le terme hébreu est explicitement masculin et désigne, dans ce contexte sacerdotal, les fils d’Aaron.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: tous les Israélites
  rationale: Cette formulation rend naturellement en français moderne l’expression collective « tous les fils d’Israël », dont la forme littérale est signalée en note.
- source_word: אִישׁ אִישׁ
  choice: Tout homme
  rationale: La répétition distributive signifie « chaque homme » ou « tout homme »; ce choix conserve la formulation masculine du texte juridique.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: de la maison d’Israël
  rationale: La formulation préserve l’expression collective et identitaire « maison d’Israël ».
- source_word: הַגֵּר בְּיִשְׂרָאֵל
  choice: les étrangers établis en Israël
  rationale: גֵּר désigne un non-Israélite qui réside durablement au sein de la communauté; cette expression est claire en français actuel sans suggérer un simple visiteur.
- source_word: יַקְרִיב קָרְבָּנוֹ
  choice: présentera son offrande
  rationale: Dans le vocabulaire sacrificiel, le hifil de קרב signifie apporter ou présenter, tandis que קָרְבָּן est le terme général pour une offrande.
- source_word: לְכָל נִדְרֵיהֶם
  choice: pour l’un de leurs vœux
  rationale: Le texte associe l’offrande aux vœux sans préciser davantage la relation; la traduction conserve cette relative ouverture.
- source_word: נִדְבוֹתָם
  choice: leurs offrandes volontaires
  rationale: Le terme désigne la catégorie cultuelle des dons ou offrandes faits volontairement.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le nom divin יהוה est rendu comme nom propre, conformément à sa fonction dans le texte.
- source_word: לְעֹלָה
  choice: comme holocauste
  rationale: עֹלָה est le terme technique pour l’offrande entièrement consumée sur l’autel; « holocauste » est son équivalent cultuel français usuel.
theological_decisions:
- issue: Langage masculin représentatif dans l’instruction juridique
  choice: Tout homme
  alternative: Quiconque
  rationale: Le choix maintient le masculin explicite de אִישׁ אִישׁ sans déterminer au-delà du texte la portée juridique de la formule.
- issue: Forme du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La traduction par un nom propre rend visible le nom d’alliance présent dans le texte hébreu plutôt que de le remplacer par un titre.
- issue: Rapport entre les vœux et les offrandes
  choice: pour l’un de leurs vœux
  alternative: comme offrande liée à un vœu
  rationale: La préposition hébraïque permet une formulation générale; le texte principal évite donc de préciser excessivement la nature exacte du lien cultuel.
translation_notes:
  register: Français international moderne, digne et lisible, avec maintien du ton juridique sacerdotal. La phrase reste ouverte par un tiret parce que l’instruction se poursuit au verset suivant. Les changements du singulier (« tout homme », « son offrande ») au pluriel (« leurs », « qu’ils ») reflètent les alternances de nombre du texte hébreu.
