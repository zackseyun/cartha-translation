revisions:
- from: '« Parle à Aaron, à ses fils et à tous les Israélites[a]. Tu leur diras : Tout homme de la maison d’Israël ou parmi les étrangers établis en Israël[b] qui présentera son offrande pour l’un de leurs vœux ou pour l’une de leurs offrandes volontaires[c], qu’ils présentent à Yahweh comme holocauste — »'
  to: '« Parle à Aaron, à ses fils et à tous les Israélites[a]. Tu leur diras : Tout homme, qu’il soit de la maison d’Israël ou étranger résidant en Israël[b], qui présentera à Yahweh une offrande en holocauste, pour l’accomplissement de l’un de ses vœux ou à titre d’offrande volontaire[c] — »'
  rationale: La révision corrige une ambiguïté française qui altérait la relation cultuelle des termes coordonnés. Elle rend le singulier générique du gēr et de « tout homme » de manière idiomatique, maintient la fonction distributive de la législation et préserve l’ouverture syntaxique marquée par le tiret final.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:26:17Z'
review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend correctement les destinataires, la catégorie du gēr, l’offrande, les vœux, les offrandes volontaires, le nom divin et l’holocauste. Une correction sûre est toutefois nécessaire : « pour l’une de leurs offrandes volontaires » fait entendre qu’une offrande est présentée en vue d’une autre offrande. En hébreu, les offrandes volontaires constituent l’une des motivations ou catégories de l’offrande présentée. La reformulation conserve aussi la force distributive de אִישׁ אִישׁ sans l’alourdissement du passage du singulier au pluriel.'
  naturalness: Le français du projet est globalement moderne et digne, mais « de la maison d’Israël ou parmi les étrangers » manque de parallélisme et l’enchaînement « son offrande ... leurs vœux ... leurs offrandes ... qu’ils présentent » est inutilement heurté. La révision emploie une construction juridique française plus fluide tout en maintenant le caractère ouvert de la phrase, achevée au verset suivant.
  terminology: « Israélites », « étranger résidant », « offrande », « offrande volontaire », « Yahweh » et « holocauste » sont appropriés. « Étranger résidant » rend clairement le statut du גֵּר sans suggérer un visiteur occasionnel. « En holocauste » est le tour cultuel français le plus naturel pour לְעֹלָה.
  issues:
  - severity: medium
    issue: Relation mal formulée entre l’offrande présentée et les offrandes volontaires
    rationale: « présentera son offrande ... pour l’une de leurs offrandes volontaires » suggère une finalité qui ne correspond pas naturellement à la coordination hébraïque entre vœux et offrandes volontaires. « à titre d’offrande volontaire » restitue la catégorie cultuelle sans ajouter de sens.
  - severity: low
    issue: Parallélisme et cohérence des nombres
    rationale: « de la maison d’Israël ou parmi les étrangers » et les alternances rapprochées « son / leurs / qu’ils » sont grammaticalement possibles, mais moins naturels en français. Une formulation distributive au singulier reste fidèle à la portée générique de l’hébreu.
