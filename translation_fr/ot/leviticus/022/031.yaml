source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֙ מִצְוֺתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/031.yaml
  text: So you shall keep my commandments and do them[a]; I am Yahweh.
translation:
  language: fr
  text: Vous observerez donc mes commandements et vous les mettrez en pratique. Je suis Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH », traditionnellement rendu par « le SEIGNEUR » ou « l’Éternel » ; également transcrit « Yahvé ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Vous observerez donc
  rationale: Dans un contexte légal et d’alliance, שׁמר signifie garder ou observer. « Observer » est naturel en français avec « commandements ». « Donc » rend le lien discursif exprimé par וּ avec le contexte précédent.
- source_word: מִצְוֺתַי
  choice: mes commandements
  rationale: מִצְוָה désigne un commandement. Ce choix conserve le registre juridique et religieux du Lévitique.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: et vous les mettrez en pratique
  rationale: Littéralement, le texte dit « et vous les ferez ». « Les mettre en pratique » exprime idiomatiquement en français l’exécution concrète des commandements tout en maintenant la distinction entre les observer et les accomplir.
- source_word: אֲנִי יְהוָה
  choice: Je suis Yahweh
  rationale: La formule hébraïque d’auto-identification est conservée, et le nom divin יהוה est translittéré plutôt que remplacé par un titre.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / l’Éternel / Yahvé
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom d’alliance sous une forme translittérée, tandis que la note signale le rendu traditionnel et la variante française courante.
translation_notes:
  register: Français moderne, digne et accessible. La répétition des deux actions hébraïques est préservée par « observer » et « mettre en pratique », sans les réduire à un seul verbe.
