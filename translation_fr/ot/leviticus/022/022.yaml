base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/022.yaml
  text: Anything blind[a], broken, mutilated, or with a wart, scab, or skin disease, these you shall not present to Yahweh; and you shall not place any of them on the altar as a food offering to Yahweh.
translation:
  language: fr
  text: Vous ne présenterez pas à Yahvé d’animal aveugle, fracturé ou mutilé, ni d’animal ayant une verrue, des croûtes ou une maladie de peau. Vous n’en mettrez aucun sur l’autel comme offrande par le feu[a] pour Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « offrande de nourriture ». Le sens précis de l’hébreu אִשֶּׁה est discuté; le terme peut désigner une offrande liée au feu ou une offrande présentée comme nourriture sacrificielle.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַוֶּרֶת
  choice: aveugle
  rationale: Dans cette liste de défauts, le terme qualifie une bête impropre au sacrifice. « Aveugle » est direct et naturel en français.
- source_word: שָׁבוּר
  choice: ayant un membre fracturé
  rationale: Le participe désigne vraisemblablement une fracture corporelle. Cette formulation est plus explicite que le simple adjectif français « cassée ».
- source_word: חָרוּץ
  choice: mutilée
  rationale: Le mot évoque une partie du corps coupée ou fendue; « mutilée » exprime clairement ce défaut grave sans imposer une localisation précise.
- source_word: יַבֶּלֶת
  choice: verrue
  rationale: Le nom désigne une excroissance cutanée; « verrue » est l’équivalent moderne le plus accessible.
- source_word: גָרָב
  choice: croûtes
  rationale: Le terme désigne une affection cutanée visible. « Croûtes » demeure concret tout en évitant d’identifier avec certitude une maladie particulière comme la gale.
- source_word: יַלֶּפֶת
  choice: maladie de peau
  rationale: L’affection dermatologique exacte est incertaine; cette expression conserve le sens général sans fausse précision.
- source_word: תַקְרִיבוּ
  choice: présenterez
  rationale: Le hiphil de קרב a ici le sens cultuel de présenter une offrande devant Dieu.
- source_word: אִשֶּׁה
  choice: offrande de nourriture
  rationale: Dans le vocabulaire sacerdotal, le terme désigne une offrande destinée à l’autel et associée au feu. « Offrande de nourriture » rend sa fonction cultuelle sans la confondre avec une catégorie sacrificielle entièrement consumée; l’autre analyse est signalée en note.
- source_word: תִתְּנוּ מֵהֶם עַל הַמִּזְבֵּחַ
  choice: Vous n’en déposerez aucune sur l’autel
  rationale: Cette formulation française naturelle conserve l’action concrète de mettre sur l’autel ainsi que la valeur partitive de מֵהֶם.
- source_word: לַיהוָה
  choice: à Yahvé / pour Yahvé
  rationale: Le nom divin est rendu sous sa forme française courante « Yahvé ». La préposition ל se rend naturellement par « à » avec « présenter » et par « pour » dans la proposition finale.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: Yahweh; Jéhovah; le SEIGNEUR
  rationale: « Yahvé » est la forme française courante du nom propre divin et préserve le caractère personnel du tétragramme sans le remplacer par un titre.
- issue: Sens cultuel de אִשֶּׁה
  choice: offrande de nourriture
  alternative: offrande faite par le feu; offrande consumée
  rationale: Le terme peut mettre en avant la nourriture offerte sur l’autel ou son traitement par le feu. Le texte principal retient la première nuance et la note conserve l’autre analyse reconnue.
translation_notes:
  register: Français international moderne, clair et digne. « Bête » évite la répétition lourde d’« animal » tout en rendant explicite le référent sous-entendu de la liste. La syntaxe est légèrement réorganisée pour rester naturelle en français, sans atténuer l’interdiction cultuelle.
