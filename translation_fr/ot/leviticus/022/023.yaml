  text: וְ/שׁ֥וֹר וָ/שֶׂ֖ה שָׂר֣וּעַ וְ/קָל֑וּט נְדָבָה֙ תַּעֲשֶׂ֣ה אֹת֔/וֹ וּ/לְ/נֵ֖דֶר לֹ֥א יֵרָצֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/023.yaml
  text: But an ox or a sheep that has a limb too long or too short—you may make it a freewill offering[a], but for a vow it will not be accepted.
translation:
  language: fr
  text: Mais un bovin ou une bête du petit bétail présentant un membre trop long ou trop court, tu peux le présenter comme offrande volontaire[a] ; mais comme offrande votive, il ne sera pas agréé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus généralement : « difforme ou rabougri ». Les deux termes hébreux désignent probablement des disproportions corporelles opposées, mais leur sens anatomique précis est incertain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשׁוֹר
  choice: un bovin
  rationale: שׁוֹר désigne un animal de l’espèce bovine. « Un bovin » garde ici la valeur générique sans imposer le sexe ou le statut de l’animal.
- source_word: וָשֶׂה
  choice: ou une bête du petit bétail
  rationale: שֶׂה peut désigner un mouton ou une chèvre. Cette formulation conserve cette extension plutôt que de restreindre le terme au mouton.
- source_word: שָׂרוּעַ וְקָלוּט
  choice: qui a un membre trop long ou trop court
  rationale: Les deux termes semblent décrire des défauts opposés de proportion, probablement un membre allongé et un membre contracté ou trop court. La formulation concrète reste intelligible tout en signalant l’incertitude dans la note.
- source_word: נְדָבָה
  choice: offrande volontaire
  rationale: נְדָבָה désigne une offrande libre, non imposée par un engagement préalable.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: tu peux le présenter
  rationale: Littéralement « tu peux le faire », mais, dans ce contexte sacrificiel, le sens idiomatique est de présenter l’animal comme offrande.
- source_word: וּלְנֵדֶר
  choice: mais en accomplissement d’un vœu
  rationale: נֵדֶר désigne ici l’engagement votif dont l’offrande assure l’accomplissement. Cette formulation explicite naturellement la relation sans effacer le contraste avec l’offrande volontaire.
- source_word: לֹא יֵרָצֶה
  choice: il ne sera pas agréé
  rationale: Le niphal de רצה exprime l’acceptation favorable d’une offrande dans le cadre cultuel. « Agréé » rend cette nuance avec concision.
theological_decisions:
- issue: Sens précis de שָׂרוּעַ וְקָלוּט
  choice: un membre trop long ou trop court
  alternative: difforme ou rabougri ; présentant une disproportion corporelle
  rationale: Les termes paraissent former une paire opposée décrivant une disproportion physique, mais leur nuance anatomique exacte demeure incertaine. Le texte retient la lecture concrète probable et la note préserve une formulation plus générale.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète l’adresse législative hébraïque. « Bovin » et « bête du petit bétail » préservent la portée générique des catégories animales ; « agréé » maintient le registre cultuel sans lourdeur archaïque.
