    reason: lexical_alternative
  revision_rationale: La révision remplace une explicitation interprétative de la construction « pour un vœu » par « comme offrande votive », qui est idiomatique en français et plus proche de l’opposition hébraïque. Elle améliore aussi légèrement la syntaxe et reformule la note afin de préserver explicitement l’incertitude lexicale sans présenter une analyse anatomique disputée comme certaine.
