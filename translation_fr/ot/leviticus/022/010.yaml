  text: וְ/כָל זָ֖ר לֹא יֹ֣אכַל קֹ֑דֶשׁ תּוֹשַׁ֥ב כֹּהֵ֛ן וְ/שָׂכִ֖יר לֹא יֹ֥אכַל קֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/010.yaml
  text: No outsider may eat the holy thing[b][a]; a sojourner of a priest or a hired worker may not eat the holy thing.
translation:
  language: fr
  text: Aucune personne non autorisée ne mangera de ce qui est saint[a]. Une personne résidant chez un prêtre[b] ou un travailleur salarié ne mangeront pas de ce qui est saint.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la nourriture sainte » ou « d’une portion sacrée ». Le singulier hébreu désigne ici la nourriture provenant des offrandes et réservée à la consommation des prêtres.
    reason: lexical_alternative
  - marker: b
    text: 'L’expression hébraïque désigne un résident ou une personne attachée à la maison d’un prêtre. Autres traductions possibles : « le résident d’un prêtre », « le séjourneur d’un prêtre » ou « l’étranger résident d’un prêtre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָר
  choice: personne étrangère au sacerdoce
  rationale: Dans ce contexte sacerdotal, le terme désigne une personne qui n’appartient pas au cercle autorisé à consommer les portions saintes, et non nécessairement un étranger au sens ethnique.
- source_word: קֹדֶשׁ
  choice: ce qui est saint
  rationale: Cette formulation garde la valeur substantivée et singulière de l’hébreu tout en restant naturelle en français; le contexte montre qu’il s’agit de nourriture provenant des offrandes sacrées.
- source_word: תּוֹשַׁב כֹּהֵן
  choice: celui qui réside chez un prêtre
  rationale: La formulation exprime le lien de résidence ou de dépendance envers la maison d’un prêtre sans identifier cette personne à sa famille ni imposer avec certitude le statut d’étranger résident.
- source_word: שָׂכִיר
  choice: salarié
  rationale: Le mot désigne une personne engagée contre rémunération; « salarié » est bref, actuel et distinct du résident attaché à la maison.
- source_word: לֹא יֹאכַל
  choice: ne mangera
  rationale: Dans ce texte législatif, le futur négatif français rend naturellement l’interdiction exprimée par l’inaccompli hébreu avec négation.
- source_word: וְכָל
  choice: Aucune
  rationale: Avec la négation qui suit, « aucune » restitue idiomatiquement la portée universelle de l’interdiction.
theological_decisions:
- issue: Étendue de זָר
  choice: personne étrangère au sacerdoce
  alternative: étranger; profane; personne non autorisée
  rationale: Le choix évite de transformer l’interdiction cultuelle en distinction ethnique et laisse le contexte sacerdotal déterminer l’exclusion.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « ne mangera de ce qui est saint » conserve la structure juridique et l’insistance de l’hébreu. Les marqueurs sont placés immédiatement après les expressions qu’ils éclairent.
