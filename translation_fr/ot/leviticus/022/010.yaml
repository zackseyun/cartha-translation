  naturalness: 'La formulation révisée est plus idiomatique et cohérente : la coordination de deux sujets appelle le pluriel français (« ne mangeront pas »), et « personne résidant chez un prêtre » évite le masculin générique un peu raide de « celui qui réside ».'
