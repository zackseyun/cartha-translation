revisions:
- from: Aucune personne étrangère au sacerdoce ne mangera de ce qui est saint[a]. Ni celui qui réside chez un prêtre[b] ni un salarié ne mangera de ce qui est saint.
  to: Aucune personne non autorisée ne mangera de ce qui est saint[a]. Une personne résidant chez un prêtre[b] ou un travailleur salarié ne mangeront pas de ce qui est saint.
  rationale: La révision remplace une expression qui assimilait l’exclusion à une absence de statut sacerdotal par « personne non autorisée », plus fidèle à la fonction de זָר dans la réglementation des portions sacrées. Elle corrige aussi l’accord de la seconde proposition et nuance la note lexicale sur תּוֹשַׁב כֹּהֵן. Les deux occurrences de קֹדֶשׁ sont maintenues, conformément à la répétition du texte hébreu.
