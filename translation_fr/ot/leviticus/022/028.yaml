source:
  edition: WLC
  text: וְ/שׁ֖וֹר אוֹ שֶׂ֑ה אֹת֣/וֹ וְ/אֶת בְּנ֔/וֹ לֹ֥א תִשְׁחֲט֖וּ בְּ/י֥וֹם אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/028.yaml
  text: Whether an ox or a sheep, you shall not slaughter it and its young on one day.
translation:
  language: fr
  text: Qu’il s’agisse d’un bovin ou d’un animal du petit bétail, vous n’abattrez pas l’animal et son petit[a] le même jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son fils ». Dans ce contexte, l’expression désigne le petit de l’animal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: bovin
  rationale: Le terme désigne ici un animal de l’espèce bovine. « Bovin » évite de préciser indûment le sexe ou la fonction de l’animal, contrairement à « taureau » ou « bœuf » au sens strict.
- source_word: שֶׂה
  choice: bête du petit bétail
  rationale: Le mot peut désigner un mouton ou une chèvre. Cette formulation conserve cette étendue de sens sans la réduire au seul mouton, à l’agneau ou au chevreau.
- source_word: אֹתוֹ וְאֶת־בְּנוֹ
  choice: l’animal et son petit
  rationale: Cette formulation française naturelle rend le référent pronominal explicite et traduit בֵּן selon son emploi pour la progéniture animale, sans introduire l’idée de mère, absente de la formulation hébraïque.
- source_word: תִשְׁחֲטוּ
  choice: vous n’abattrez pas
  rationale: שׁחט désigne l’abattage d’un animal, notamment dans un cadre sacrificiel ou juridique. « Abattre » est précis et idiomatique en français.
- source_word: בְּיוֹם אֶחָד
  choice: le même jour
  rationale: Littéralement « en un seul jour » ; dans cette interdiction, « le même jour » exprime clairement et naturellement que les deux animaux ne doivent pas être abattus au cours d’une même journée.
- source_word: וְשׁוֹר אוֹ שֶׂה
  choice: Qu’il s’agisse d’un bovin ou d’une bête du petit bétail
  rationale: La tournure restitue naturellement en français l’introduction d’un nouveau cas juridique et l’alternative exprimée par אוֹ.
theological_decisions:
- issue: Sexe et relation de l’animal adulte avec le petit
  choice: Ne pas identifier explicitement l’animal adulte comme la mère
  alternative: « la mère et son petit »
  rationale: Même si le contexte peut suggérer une relation maternelle, le texte de ce verset dit littéralement « lui et son fils » et ne nomme pas explicitement la mère. La traduction conserve cette retenue.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe juridique reste claire sans calquer lourdement l’ordre hébreu. « Bête du petit bétail » est légèrement technique, mais préserve l’inclusion possible des ovins et des caprins.
