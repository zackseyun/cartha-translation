id: LEV.9.6
reference: Leviticus 9:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה זֶ֧ה הַ/דָּבָ֛ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה תַּעֲשׂ֑וּ וְ/יֵרָ֥א אֲלֵי/כֶ֖ם כְּב֥וֹד יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/006.yaml
  text: And Moses said[a], “This is the thing that Yahweh has commanded you to do, that the glory of Yahweh may appear to you.”
translation:
  language: fr
  text: 'Moïse dit : « Voici ce que Yahweh vous a commandé de faire, afin que la gloire de Yahweh vous apparaisse[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et la gloire de Yahweh vous apparaîtra. »'
    reason: La conjonction וְ et l’inaccompli וְיֵרָא peuvent introduire soit un but ou un résultat, soit une promesse coordonnée au futur.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Moïse dit
  rationale: Le waw consécutif fait progresser le récit. En français, la simple succession au passé composé est naturelle sans qu’il soit nécessaire d’ajouter « et » ou « alors ».
- source_word: זֶה הַדָּבָר
  choice: Voici ce que
  rationale: Cette formulation rend naturellement l’expression hébraïque concrète « ceci [est] la chose/parole » tout en introduisant clairement le contenu du commandement.
- source_word: צִוָּה
  choice: a commandé
  rationale: Le parfait hébreu présente le commandement comme déjà donné, et « commander » conserve sa force d’autorité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: תַּעֲשׂוּ
  choice: vous a commandé de faire
  rationale: Le pronom « vous » exprime l’adresse au pluriel et s’intègre naturellement à la construction française de « commander de faire ».
- source_word: וְיֵרָא
  choice: afin que ... vous apparaisse
  rationale: Le niphal à l’inaccompli après l’ordre peut exprimer le but ou le résultat. « Afin que » maintient le lien entre l’action prescrite et la manifestation divine.
- source_word: אֲלֵיכֶם
  choice: vous apparaisse
  rationale: Avec le verbe « apparaître », le complément hébreu אֶל est rendu idiomatiquement en français par un pronom indirect.
- source_word: כְּבוֹד יְהוָה
  choice: la gloire de Yahweh
  rationale: Cette traduction directe préserve l’expression biblique désignant la majesté divine manifestée.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme; « Yahweh » conserve le nom personnel plutôt que de le remplacer par un titre.
- issue: Valeur de la proposition finale וְיֵרָא אֲלֵיכֶם כְּבוֹד יְהוָה
  choice: 'but ou résultat : « afin que la gloire de Yahweh vous apparaisse »'
  alternative: 'coordination et promesse : « et la gloire de Yahweh vous apparaîtra »'
  rationale: La syntaxe hébraïque permet de relier la manifestation à l’action commandée comme but ou résultat, mais elle peut aussi annoncer directement ce qui arrivera. Le texte principal retient la première possibilité et la note conserve la seconde.
translation_notes:
  register: Français international moderne, clair et digne. « Voici ce que » évite le calque peu naturel « Ceci est la chose que », tandis que « afin que » garde le lien logique sans présenter la manifestation comme un effet mécanique.
