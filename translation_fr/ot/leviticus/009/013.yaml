  text: וְ/אֶת הָ/עֹלָ֗ה הִמְצִ֧יאוּ אֵלָ֛י/ו לִ/נְתָחֶ֖י/הָ וְ/אֶת הָ/רֹ֑אשׁ וַ/יַּקְטֵ֖ר עַל הַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/013.yaml
  text: And they brought the burnt offering to him[a], piece by piece, and the head[b]; and he burned them on the altar.
translation:
  language: fr
  text: Ils lui présentèrent l’holocauste morceau par morceau, ainsi que la tête, et il les fit fumer sur l’autel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: « Holocauste » est le terme sacrificiel français établi pour l’offrande entièrement consumée sur l’autel; il convient au contexte lévitique sans réduire le mot à son étymologie.
- source_word: הִמְצִיאוּ אֵלָיו
  choice: ils lui présentèrent
  rationale: Le hiphil de מצא exprime ici le fait de faire parvenir les portions à Aaron. « Présentèrent » rend naturellement la remise rituelle, tandis que « lui apportèrent » resterait également possible.
- source_word: לִנְתָחֶיהָ
  choice: morceau par morceau
  rationale: נֶתַח désigne une partie découpée de l’animal. Cette formulation française claire exprime la distribution en morceaux suggérée par le préfixe ל.
- source_word: הָרֹאשׁ
  choice: la tête
  rationale: Le terme anatomique est rendu directement; le texte distingue la tête des autres morceaux.
- source_word: וַיַּקְטֵר
  choice: il les fit fumer
  rationale: Dans le vocabulaire sacrificiel, קטר signifie faire brûler sur l’autel de manière à produire la fumée de l’offrande. « Fit fumer » conserve cette nuance cultuelle mieux que le simple « brûla ».
- source_word: עַל הַמִּזְבֵּחַ
  choice: sur l’autel
  rationale: Formulation cultuelle standard, précise et naturelle en français moderne.
theological_decisions: []
