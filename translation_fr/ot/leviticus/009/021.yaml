  text: וְ/אֵ֣ת הֶ/חָז֗וֹת וְ/אֵת֙ שׁ֣וֹק הַ/יָּמִ֔ין הֵנִ֧יף אַהֲרֹ֛ן תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צִוָּ֥ה מֹשֶֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/021.yaml
  text: And Aaron waved the breasts and the right thigh as a wave offering before Yahweh, just as Moses had commanded.
translation:
  language: fr
  text: Aaron fit le geste de présentation avec les poitrines et la cuisse droite devant Yahweh, comme Moïse l’avait ordonné.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶחָזוֹת
  choice: les poitrines
  rationale: Dans le contexte sacrificiel, חָזֶה désigne la portion de poitrine de l’animal. Le pluriel hébreu est conservé.
- source_word: שׁוֹק הַיָּמִין
  choice: la cuisse droite
  rationale: שׁוֹק désigne ici la partie supérieure ou entière de la patte réservée dans le rite; « cuisse droite » est naturel et conforme au vocabulaire sacrificiel français.
- source_word: הֵנִיף ... תְּנוּפָה
  choice: présenta ... en les balançant
  rationale: Le verbe et le nom apparentés décrivent une présentation rituelle effectuée par un mouvement de balancement. Cette formulation rend à la fois l’acte de présentation et son geste caractéristique sans lourde répétition.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי signifie « devant, en présence de »; le nom divin est translittéré « Yahweh » conformément à la forme explicite du texte hébreu.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: comme Moïse l’avait ordonné
  rationale: La tournure exprime la conformité de l’action d’Aaron à un ordre antérieur de Moïse; le plus-que-parfait le marque naturellement en français.
- source_word: וְאֵת ... וְאֵת
  choice: les poitrines et la cuisse droite
  rationale: La répétition de la marque hébraïque de l’objet direct coordonne simplement les deux éléments et n’appelle pas de répétition particulière en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » préserve ici le nom propre de l’alliance sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la terminologie concrète du sacrifice tout en explicitant naturellement le geste rituel exprimé par הֵנִיף תְּנוּפָה.
