  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א אַהֲרֹ֧ן אֶת יד/ו אֶל הָ/עָ֖ם וַֽ/יְבָרְכֵ֑/ם וַ/יֵּ֗רֶד מֵ/עֲשֹׂ֧ת הַֽ/חַטָּ֛את וְ/הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/022.yaml
  text: Then Aaron lifted up his hands toward the people and blessed them[a], and he came down from offering the sin offering, the burnt offering[c][b], and the peace offerings.
translation:
  language: fr
  text: Puis Aaron leva les mains vers le peuple et le bénit[a]. Il descendit après avoir offert le sacrifice pour le péché[b], l’holocauste et les sacrifices de paix[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sa main »; la forme hébraïque est au singulier, mais le geste est généralement compris comme consistant à lever les mains pour bénir.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le sacrifice de purification ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « les sacrifices de communion » ou « les sacrifices de bien-être ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: leva
  rationale: Avec « main(s) », נשׂא décrit le geste de lever ou d’élever; « leva » est naturel et précis en français.
- source_word: יָדוֹ
  choice: les mains
  rationale: La forme hébraïque transmise est au singulier (« sa main »), mais le geste de bénédiction est couramment compris comme impliquant les deux mains; l’alternative littérale est signalée en note.
- source_word: אֶל הָעָם
  choice: vers le peuple
  rationale: אֶל exprime ici l’orientation du geste en direction du peuple.
- source_word: וַיְבָרְכֵם
  choice: et le bénit
  rationale: ברך au piel signifie directement « bénir »; le pronom français singulier reprend naturellement le collectif « le peuple ».
- source_word: וַיֵּרֶד
  choice: Il descendit
  rationale: ירד signifie descendre; la formulation conserve le mouvement spatial sans préciser depuis quel emplacement, détail que le texte ne donne pas.
- source_word: מֵעֲשֹׂת
  choice: après avoir offert
  rationale: La construction מן + infinitif marque ici la transition après l’achèvement des actes sacrificiels; cette formulation est naturelle en français tout en conservant leur antériorité.
- source_word: הַחַטָּאת
  choice: le sacrifice pour le péché
  rationale: חטאת est un terme sacrificiel technique. « Sacrifice pour le péché » reste reconnaissable et évite que « sacrifice d’expiation » ne détermine trop étroitement sa fonction; « sacrifice de purification » demeure possible.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: « Holocauste » est le terme biblique français établi pour l’offrande entièrement consumée désignée par עֹלָה.
- source_word: הַשְּׁלָמִים
  choice: les sacrifices de paix
  rationale: שׁלמים est une catégorie sacrificielle technique; « sacrifices de paix » maintient la terminologie traditionnelle, tandis que la note conserve les nuances de communion et de bien-être.
theological_decisions:
- issue: Terminologie des sacrifices
  choice: Employer « sacrifice pour le péché », « holocauste » et « sacrifices de paix » dans le texte principal.
  alternative: « sacrifice de purification »; « offrande entièrement consumée »; « sacrifices de communion » ou « sacrifices de bien-être ».
  rationale: Ces désignations maintiennent des catégories distinctes et reconnaissables dans le Lévitique sans réduire leur portée théologique à une seule fonction. Les autres traductions plausibles sont conservées en notes.
- issue: Nombre de יָדוֹ dans le geste de bénédiction
  choice: Traduire idiomatiquement par « les mains ».
  alternative: « sa main »
  rationale: Le texte hébreu consonantique porte un singulier, mais le geste sacerdotal est naturellement compris au pluriel. La note préserve explicitement la forme source et son ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement resserrée pour éviter une coordination lourde, tout en conservant la séquence des actions. Les termes cultuels traditionnels sont maintenus lorsqu’ils restent intelligibles; les principales nuances lexicales figurent en notes.
