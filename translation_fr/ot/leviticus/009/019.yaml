source:
  edition: WLC
  text: וְ/אֶת הַ/חֲלָבִ֖ים מִן הַ/שּׁ֑וֹר וּ/מִן הָ/אַ֔יִל הָֽ/אַלְיָ֤ה וְ/הַֽ/מְכַסֶּה֙ וְ/הַ/כְּלָיֹ֔ת וְ/יֹתֶ֖רֶת הַ/כָּבֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/019.yaml
  text: 'and the fat pieces from the ox and from the ram: the fat tail[a], the covering fat, the kidneys, and the lobe of the liver.'
translation:
  language: fr
  text: 'ainsi que les parties grasses du taureau[a] et du bélier : la queue grasse, la graisse qui recouvre les entrailles, les reins et le lobe du foie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bœuf ». Le mot hébreu peut être rendu par « taureau » ou « bœuf » dans ce contexte sacrificiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הַחֲלָבִים
  choice: ainsi que les parties grasses
  rationale: La construction poursuit la liste commencée au verset précédent. Au pluriel, חֲלָבִים désigne ici les portions grasses réservées au sacrifice, et non la graisse en général.
- source_word: מִן הַשּׁוֹר
  choice: du taureau
  rationale: שׁוֹר désigne un bovin et, dans ce contexte sacrificiel, le mâle offert; « taureau » est naturel et précis, tandis que « bœuf » demeure une possibilité lexicale.
- source_word: וּמִן הָאַיִל
  choice: et du bélier
  rationale: אַיִל désigne sans ambiguïté le bélier dans ce contexte sacrificiel.
- source_word: הָאַלְיָה
  choice: la queue grasse
  rationale: Le terme désigne la queue chargée de graisse de certaines races de moutons, portion expressément prélevée pour l’offrande.
- source_word: וְהַמְכַסֶּה
  choice: la graisse qui recouvre les entrailles
  rationale: Le participe issu de כסה, « couvrir », renvoie dans les listes sacrificielles à la graisse qui enveloppe les organes internes; l’explicitation « les entrailles » rend la référence anatomique intelligible.
- source_word: וְהַכְּלָיֹת
  choice: les reins
  rationale: כְּלָיוֹת est le terme anatomique courant pour les reins.
- source_word: וְיֹתֶרֶת הַכָּבֵד
  choice: et le lobe du foie
  rationale: Cette expression anatomique désigne une partie ou un appendice du foie; « lobe du foie » est la formulation française moderne la plus claire sans imposer une identification anatomique plus précise.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve son caractère de continuation du verset précédent. Le vocabulaire sacrificiel est rendu concrètement sans technicité excessive.
