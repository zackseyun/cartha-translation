base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/004.yaml
  text: and an ox and a ram for peace offerings[a], to sacrifice before Yahweh, and a grain offering mixed with oil[b]; for today Yahweh will appear to you.
translation:
  language: fr
  text: ainsi qu’un bœuf et un bélier pour des sacrifices de communion[a], à offrir en sacrifice devant Yahweh, et une offrande de céréales mêlée à de l’huile ; car aujourd’hui Yahweh vous apparaîtra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifices de paix » ou « sacrifices de bien-être ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: bovin
  rationale: Le terme désigne une bête bovine sans imposer ici plus de précision sur le sexe ou la fonction ; « bovin » préserve cette généralité en français.
- source_word: אַיִל
  choice: bélier
  rationale: Le mot hébreu désigne précisément un bélier dans ce contexte sacrificiel.
- source_word: שְׁלָמִים
  choice: sacrifices de communion
  rationale: Cette expression rend la catégorie sacrificielle liée à la paix, au bien-être et à la communion, sans réduire son sens à une seule de ces dimensions.
- source_word: לִזְבֹּחַ
  choice: à offrir en sacrifice
  rationale: Cette formulation exprime clairement l’acte rituel de sacrifier plutôt que le seul abattage matériel.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » conserve le sens spatial et cultuel de לִפְנֵי, tandis que le nom divin est translittéré directement.
- source_word: מִנְחָה
  choice: offrande de céréales
  rationale: Dans la législation lévitique, le terme désigne l’offrande végétale préparée à partir de produits céréaliers.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: pétrie avec de l’huile
  rationale: Le participe décrit une préparation où la matière céréalière est intimement mélangée à l’huile ; « pétrie » est naturel dans ce contexte alimentaire et rituel.
- source_word: כִּי הַיּוֹם
  choice: car aujourd’hui
  rationale: « Car » marque le rapport causal et « aujourd’hui » maintient l’accent temporel explicite.
- source_word: נִרְאָה אֲלֵיכֶם
  choice: vous apparaîtra
  rationale: Bien que la forme soit un parfait niphal, le contexte immédiat lui donne une valeur imminente ou future.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le tétragramme ; « Yahweh » préserve le nom propre de l’alliance plutôt que de le remplacer par un titre.
- issue: Nature de la manifestation divine
  choice: Yahweh vous apparaîtra
  alternative: la gloire de Yahweh vous apparaîtra ; Yahweh vous est apparu
  rationale: Ce verset nomme Yahweh lui-même et non sa gloire ; le contexte annonce une manifestation encore imminente.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le lien avec la liste commencée au verset précédent. Le terme cultuel est explicité sans effacer sa pluralité sémantique.
