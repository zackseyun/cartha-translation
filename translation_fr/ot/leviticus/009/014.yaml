- from: Il lava les entrailles et la partie inférieure des pattes, puis il les fit partir en fumée[a] sur l’autel, par-dessus l’holocauste.
  to: Il lava les entrailles et les parties inférieures des pattes, puis il les fit monter en fumée[a] sur l’autel, par-dessus l’holocauste.
