    issue: Expression française peu idiomatique pour וַיַּקְטֵר
    rationale: « Il les fit partir en fumée » évoque un départ ou une disparition et ne constitue pas une formulation naturelle en français. « Il les fit monter en fumée » exprime l’action sacrificielle de manière claire et fidèle.
  - severity: low
    issue: Nombre et formulation de « la partie inférieure des pattes »
    rationale: La formulation au singulier est lourde après un pluriel implicite. Le pluriel « les parties inférieures des pattes » correspond mieux au référent et reste prudent sur l’anatomie exacte.
  - severity: low
    issue: Ancre de note mal placée
    rationale: La note porte sur le rendu de קטר, mais son marqueur est attaché à « pattes ». Il doit suivre « fumée ».
  revised_text: Il lava les entrailles et les parties inférieures des pattes, puis il les fit monter en fumée[a] sur l’autel, par-dessus l’holocauste.
  revised_footnotes:
