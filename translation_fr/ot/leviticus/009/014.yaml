  text: וַ/יִּרְחַ֥ץ אֶת הַ/קֶּ֖רֶב וְ/אֶת הַ/כְּרָעָ֑יִם וַ/יַּקְטֵ֥ר עַל הָ/עֹלָ֖ה הַ/מִּזְבֵּֽחָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/014.yaml
  text: He washed the entrails and the lower legs[a], and he burned them on the altar, on top of the burnt offering.
translation:
  language: fr
  text: Il lava les entrailles et les parties inférieures des pattes, puis il les fit monter en fumée[a] sur l’autel, par-dessus l’holocauste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il les brûla sur l’autel, par-dessus l’holocauste ».'
    reason: La forme causative de קטר désigne l’action cultuelle de faire monter une offrande en fumée sur l’autel ; « brûla » est une traduction plus générale possible.
lexical_decisions:
- source_word: וַיִּרְחַץ
  choice: il lava
  rationale: Le verbe רחץ désigne ici le lavage rituel à l’eau; « lava » est clair, naturel et précis.
- source_word: הַקֶּרֶב
  choice: les entrailles
  rationale: Dans le contexte sacrificiel, קֶרֶב renvoie aux parties internes de l’animal; « entrailles » est le terme français concret et usuel.
- source_word: הַכְּרָעָיִם
  choice: la partie inférieure des pattes
  rationale: כְּרָעַיִם désigne les pattes ou, plus précisément, leur partie inférieure. Cette formulation conserve la précision anatomique sans employer un terme technique rare.
- source_word: וַיַּקְטֵר
  choice: il les fit partir en fumée
  rationale: La forme causative de קטר, dans le langage sacerdotal, décrit l’action de faire monter en fumée une offrande sur l’autel, et non simplement de la brûler.
- source_word: עַל הָעֹלָה
  choice: par-dessus l’holocauste
  rationale: עַל indique ici que ces parties sont placées et consumées au-dessus de l’holocauste déjà présent sur l’autel.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: « Holocauste » est le terme sacrificiel français consacré pour עֹלָה, offrande entièrement brûlée.
- source_word: הַמִּזְבֵּחָה
  choice: sur l’autel
  rationale: Le ה directionnel et la construction contextuelle expriment le mouvement ou le placement vers l’autel; en français, « sur l’autel » rend naturellement le résultat de l’action.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La tournure « fit partir en fumée » maintient la nuance sacrificielle du verbe hébreu, tandis que « la partie inférieure des pattes » privilégie la précision anatomique. Le marqueur [a] est placé sur l’expression qu’il explique.
