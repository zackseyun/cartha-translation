source:
  edition: WLC
  text: וַ/יִּשְׁחַ֖ט אֶת הָ/עֹלָ֑ה וַ֠/יַּמְצִאוּ בְּנֵ֨י אַהֲרֹ֤ן אֵלָי/ו֙ אֶת הַ/דָּ֔ם וַ/יִּזְרְקֵ֥/הוּ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/012.yaml
  text: Then he slaughtered the burnt offering[a], and Aaron’s sons brought the blood to him, and he splashed it against the altar on all sides.
translation:
  language: fr
  text: Puis il égorgea l’holocauste. Les fils d’Aaron lui apportèrent le sang, et il le projeta contre l’autel, tout autour[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « il le lança contre l’autel, tout autour ». Le verbe hébreu évoque une projection du sang, et non une légère aspersion.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: Puis il égorgea
  rationale: Dans un contexte sacrificiel, שׁחט désigne l’égorgement rituel de l’animal. « Puis » rend naturellement la progression narrative marquée par le waw.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: עֹלָה est le terme sacrificiel désignant l’offrande entièrement consumée. « Holocauste » est l’équivalent cultuel établi en français biblique.
- source_word: וַיַּמְצִאוּ
  choice: lui apportèrent
  rationale: La forme causative exprime ici le fait de faire parvenir ou de présenter le sang à Aaron. « Lui apportèrent » est clair et naturel dans le déroulement du rite.
- source_word: בְּנֵי אַהֲרֹן
  choice: Les fils d’Aaron
  rationale: Cette formulation conserve explicitement l’identité familiale et sacerdotale des assistants.
- source_word: הַדָּם
  choice: le sang
  rationale: Le groupe nominal défini renvoie au sang de l’animal qui vient d’être égorgé, sans nécessiter d’explicitation.
- source_word: וַיִּזְרְקֵהוּ
  choice: il le projeta
  rationale: Dans les rites sacrificiels, זרק évoque une application du sang par projection, plus énergique qu’une légère aspersion. « Projeta » reste précis, digne et intelligible.
- source_word: עַל הַמִּזְבֵּחַ
  choice: contre l’autel
  rationale: Avec la projection du sang, « contre » exprime mieux le contact avec les côtés de l’autel que le simple et plus statique « sur ».
- source_word: סָבִיב
  choice: tout autour
  rationale: L’adverbe indique que le sang est appliqué autour de l’autel, sur son pourtour.
