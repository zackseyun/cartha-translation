  text: וַ/יֹּ֣אמֶר אֶֽל אַהֲרֹ֗ן קַח לְ֠/ךָ עֵ֣גֶל בֶּן בָּקָ֧ר לְ/חַטָּ֛את וְ/אַ֥יִל לְ/עֹלָ֖ה תְּמִימִ֑ם וְ/הַקְרֵ֖ב לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/002.yaml
  text: And he said to Aaron[a], “Take for yourself a calf, a son of the herd, for a sin offering, and a ram for a burnt offering, both without blemish, and present them before Yahweh.”
translation:
  language: fr
  text: 'Il dit à Aaron : « Prends pour toi un veau du gros bétail[a], en sacrifice pour le péché, et un bélier en holocauste, tous deux sans défaut, et présente-les devant Yahvé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « un veau, fils du gros bétail », c’est-à-dire un jeune bovin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le wayyiqtol poursuit le récit. En français, le passé simple rend naturellement cette progression sans imposer une nuance temporelle supplémentaire.
- source_word: קַח לְךָ
  choice: Prends pour toi
  rationale: Cette formulation conserve la nuance personnelle du datif לְךָ tout en restant naturelle en français.
- source_word: עֵגֶל בֶּן בָּקָר
  choice: un veau, un jeune bovin
  rationale: La traduction maintient l’apposition hébraïque tout en explicitant dans un français compréhensible qu’il s’agit d’un jeune animal du gros bétail.
- source_word: לְחַטָּאת
  choice: en sacrifice pour le péché
  rationale: Dans ce contexte cultuel, חַטָּאת désigne le sacrifice lié au péché, et non simplement le péché comme notion abstraite.
- source_word: וְאַיִל לְעֹלָה
  choice: et un bélier en holocauste
  rationale: אַיִל désigne un bélier, tandis que עֹלָה est le terme sacrificiel traditionnellement rendu par « holocauste » en français biblique.
- source_word: תְּמִימִם
  choice: tous deux sans défaut
  rationale: Le pluriel hébreu porte sur les deux animaux; « tous deux » rend cette portée explicite.
- source_word: וְהַקְרֵב
  choice: et présente-les
  rationale: Le hiphil de קרב signifie ici faire approcher ou présenter. « Présente-les » évite d’anticiper l’acte sacrificiel détaillé ensuite.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahvé
  rationale: La formule exprime la présence de Dieu, et le nom divin est rendu directement par « Yahvé ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » représente en français moderne la forme traditionnelle du nom propre divin et préserve sa fonction de nom d’alliance.
- issue: Sens sacrificiel de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice d’expiation
  rationale: « Pour le péché » garde le lien lexical avec le péché sans préciser à lui seul tout le mécanisme théologique du sacrifice; « d’expiation » serait plus interprétatif.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve l’enchaînement du récit et une partie de la saveur appositionnelle de l’hébreu, tout en évitant un calque obscur.
