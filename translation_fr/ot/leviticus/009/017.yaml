  text: וַ/יַּקְרֵב֮ אֶת הַ/מִּנְחָה֒ וַ/יְמַלֵּ֤א כַפּ/וֹ֙ מִמֶּ֔/נָּה וַ/יַּקְטֵ֖ר עַל הַ/מִּזְבֵּ֑חַ מִ/לְּ/בַ֖ד עֹלַ֥ת הַ/בֹּֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/017.yaml
  text: Then he presented the grain offering[a], filled his hand from it, and burned it on the altar, besides the morning burnt offering.
translation:
  language: fr
  text: Puis il présenta l’offrande de céréales, en prit une pleine poignée[a] et la fit brûler sur l’autel, en plus de l’holocauste du matin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il en remplit sa paume » ; l’expression décrit la portion de l’offrande qu’il prit dans sa main pour la faire brûler sur l’autel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: il présenta
  rationale: Dans ce contexte sacrificiel, le hifil de קרב signifie faire approcher ou présenter une offrande. « Présenta » rend naturellement l’acte rituel sans préciser davantage que l’hébreu.
- source_word: הַמִּנְחָה
  choice: l’offrande de céréales
  rationale: Dans la législation du Lévitique, מִנְחָה désigne l’offrande non sanglante faite de produits céréaliers, et non une offrande générique.
- source_word: וַיְמַלֵּא כַפּוֹ מִמֶּנָּה
  choice: en prit une pleine poignée
  rationale: Littéralement, l’expression signifie « il en remplit sa paume ». La formulation retenue communique clairement le geste concret consistant à prendre dans la main la portion destinée à l’autel.
- source_word: וַיַּקְטֵר
  choice: la fit brûler
  rationale: Le hifil de קטר désigne ici l’action de faire brûler une offrande sur l’autel, avec l’idée qu’elle monte en fumée. « La fit brûler » convient au contexte cultuel et renvoie clairement à l’offrande.
- source_word: עַל הַמִּזְבֵּחַ
  choice: sur l’autel
  rationale: Traduction locative courante et naturelle dans le contexte sacrificiel.
- source_word: מִלְּבַד
  choice: en plus de
  rationale: Ici, la préposition indique que l’offrande de céréales s’ajoute à l’holocauste régulier du matin.
- source_word: עֹלַת הַבֹּקֶר
  choice: l’holocauste du matin
  rationale: עֹלָה est le terme sacrificiel traditionnellement rendu par « holocauste », c’est-à-dire une offrande entièrement brûlée. La formulation est concise et courante en français biblique.
