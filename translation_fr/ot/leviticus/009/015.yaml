language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּקְרֵ֕ב אֵ֖ת קָרְבַּ֣ן הָ/עָ֑ם וַ/יִּקַּ֞ח אֶת שְׂעִ֤יר הַֽ/חַטָּאת֙ אֲשֶׁ֣ר לָ/עָ֔ם וַ/יִּשְׁחָטֵ֥/הוּ וַֽ/יְחַטְּאֵ֖/הוּ כָּ/רִאשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/015.yaml
  text: Then he presented the people's offering[a], and he took the goat of the sin offering that was for the people, and slaughtered it and offered it for sin, as with the first one.
translation:
  language: fr
  text: Puis il présenta l’offrande du peuple. Il prit le bouc destiné au sacrifice pour le péché du peuple, l’égorgea et accomplit avec lui le rite du sacrifice pour le péché[a], comme avec le premier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le traita comme sacrifice pour le péché ». Le verbe hébreu peut aussi évoquer une purification rituelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: il présenta
  rationale: Dans un contexte sacrificiel, le hifil de קרב signifie couramment faire approcher ou présenter une offrande. « Présenta » exprime naturellement le geste rituel sans l’identifier à toute la procédure sacrificielle.
- source_word: קָרְבַּן הָעָם
  choice: l’offrande du peuple
  rationale: קָרְבָּן est le terme général désignant ce qui est apporté ou présenté comme offrande; le complément הָעָם indique ici le peuple.
- source_word: שְׂעִיר הַחַטָּאת
  choice: le bouc destiné au sacrifice pour le péché
  rationale: שְׂעִיר désigne un bouc, et חַטָּאת désigne ici, dans ce contexte rituel, le sacrifice lié au péché plutôt que le péché abstrait.
- source_word: אֲשֶׁר לָעָם
  choice: du peuple
  rationale: Le ל marque le rapport au peuple, vraisemblablement comme bénéficiaire du sacrifice. Dans la phrase française, « du peuple » reste naturel et se rattache au sacrifice plutôt qu’à une simple possession de l’animal.
- source_word: וַיִּשְׁחָטֵהוּ
  choice: l’égorgea
  rationale: שׁחט est le verbe technique de l’abattage sacrificiel. « Égorgea » rend précisément le geste dans un français biblique actuel et digne.
- source_word: וַיְחַטְּאֵהוּ
  choice: accomplit avec lui le rite du sacrifice pour le péché
  rationale: Le piel de חטא peut décrire l’accomplissement du rite de purification ou du sacrifice pour le péché. Cette formulation évite de faire croire que le bouc lui-même est purifié, tout en conservant la portée rituelle du verbe.
- source_word: כָּרִאשׁוֹן
  choice: comme avec le premier
  rationale: L’expression renvoie au premier sacrifice pour le péché du chapitre et indique que le même traitement rituel fut appliqué.
theological_decisions:
- issue: Sens de חַטָּאת dans le contexte sacrificiel
  choice: « sacrifice pour le péché »
  alternative: « péché » ou « sacrifice d’expiation »
  rationale: Le contexte montre que le nom désigne le sacrifice. « Pour le péché » conserve le lien lexical avec le péché sans imposer au terme une théorie particulière de l’expiation.
- issue: Sens de וַיְחַטְּאֵהוּ
  choice: accomplissement du rite du sacrifice pour le péché avec le bouc
  alternative: « le purifia » ou « fit l’expiation avec lui »
  rationale: Le verbe est difficile et peut porter une nuance de purification rituelle. « Le purifia » rendrait ambigu l’objet de la purification, tandis que « fit l’expiation » introduirait ici un terme théologique plus précis que le verbe hébreu lui-même.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde la terminologie sacrificielle et la difficulté sémantique du verbe חטא, avec une note signalant l’autre nuance possible.
