  - severity: low
    issue: « il brûla » affaiblit légèrement la nuance rituelle de וַיַּקְטֵר.
    rationale: Le verbe désigne l’action de faire fumer/monter en fumée sur l’autel; cette formulation française est plus exacte et reste claire.
