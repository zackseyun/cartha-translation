  text: They placed the fat pieces on the breasts[a], and he burned the fat pieces on the altar.
translation:
  language: fr
  text: Ils placèrent les morceaux de graisse sur les poitrines des animaux, puis il les fit monter en fumée sur l’autel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: Ils placèrent
  rationale: Le verbe שׂים signifie couramment « mettre, placer, déposer ». « Placèrent » décrit naturellement et sans surinterprétation le geste rituel.
- source_word: הַחֲלָבִים
  choice: les morceaux de graisse
  rationale: Dans le contexte sacrificiel, le pluriel désigne les portions grasses prélevées pour être offertes. « Morceaux de graisse » rend le pluriel concret.
- source_word: עַל הֶחָזוֹת
  choice: sur les poitrines
  rationale: Dans la législation sacrificielle, חָזֶה désigne la poitrine de l’animal, considérée comme une portion déterminée.
- source_word: וַיַּקְטֵר
  choice: il brûla
  rationale: Dans le vocabulaire sacerdotal, קטר désigne l’action de faire brûler une offrande sur l’autel, avec l’idée qu’elle se consume en fumée. « Brûla » est clair et naturel, tandis que la note conserve la nuance plus précise.
- source_word: הַמִּזְבֵּחָה
  choice: sur l’autel
  rationale: La forme directionnelle est idiomatiquement comprise ici comme indiquant l’endroit où les portions sont brûlées, et non un simple mouvement vers l’autel.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. Le passage du sujet pluriel (« ils placèrent ») au sujet singulier (« il brûla ») est conservé conformément à l’hébreu. La répétition de « morceaux de graisse » reproduit celle du texte source et évite toute ambiguïté sur le complément du second verbe.
