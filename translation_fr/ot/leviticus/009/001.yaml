source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/יּ֣וֹם הַ/שְּׁמִינִ֔י קָרָ֣א מֹשֶׁ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו וּ/לְ/זִקְנֵ֖י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/001.yaml
  text: And it happened on the eighth day that Moses called Aaron and his sons and the elders of Israel[a].
translation:
  language: fr
  text: Le huitième jour, Moïse appela Aaron, ses fils et les anciens d’Israël.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « convoqua » ; le verbe hébreu peut aussi signifier « convoquer » dans ce contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Le huitième jour
  rationale: Dans ce contexte narratif, וַיְהִי marque la progression du récit. Une traduction française naturelle peut ne pas l’exprimer séparément, sans perdre l’indication temporelle portée par la proposition.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Le huitième jour
  rationale: Rend directement l’expression temporelle sans ajouter « après cela », absent de l’hébreu, même si le contexte suit les sept jours de consécration.
- source_word: קָרָא
  choice: appela
  rationale: Le verbe signifie couramment « appeler » et peut aussi, selon le contexte, avoir le sens de « convoquer ». « Appela » conserve le choix le plus direct.
- source_word: לְאַהֲרֹן
  choice: Aaron
  rationale: Forme française usuelle du nom propre.
- source_word: וּלְבָנָיו
  choice: ses fils
  rationale: Dans ce contexte sacerdotal, בנים désigne les fils d’Aaron, non ses enfants de manière générale.
- source_word: וּלְזִקְנֵי יִשְׂרָאֵל
  choice: les anciens d’Israël
  rationale: Expression française établie pour les responsables ou représentants reconnus d’Israël.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La tournure évite l’archaïsme « Il arriva que » tout en préservant la progression narrative et l’ambiguïté entre « appeler » et « convoquer ».
