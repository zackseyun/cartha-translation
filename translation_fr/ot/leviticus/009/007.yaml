  source_fidelity: 'Le sens de l’hébreu est bien rendu dans l’ensemble : l’approche de l’autel, les deux sacrifices d’Aaron, l’expiation pour Aaron et le peuple, puis l’offrande du peuple et l’expiation pour celui-ci sont tous préservés. Toutefois, « accomplis ainsi le rite d’expiation » explicite le « rite » et introduit « ainsi », absents du texte source.'
