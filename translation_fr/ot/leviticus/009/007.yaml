  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קְרַ֤ב אֶל הַ/מִּזְבֵּ֨חַ֙ וַ/עֲשֵׂ֞ה אֶת חַטָּֽאתְ/ךָ֙ וְ/אֶת עֹ֣לָתֶ֔/ךָ וְ/כַפֵּ֥ר בַּֽעַדְ/ךָ֖ וּ/בְעַ֣ד הָ/עָ֑ם וַ/עֲשֵׂ֞ה אֶת קָרְבַּ֤ן הָ/עָם֙ וְ/כַפֵּ֣ר בַּֽעֲדָ֔/ם כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/007.yaml
  text: And Moses said to Aaron[a], “Come near to the altar, and offer your sin offering and your burnt offering, and make atonement for yourself and for the people. Then offer the people's offering, and make atonement for them, just as Yahweh commanded.”
translation:
  language: fr
  text: 'Moïse dit à Aaron : « Approche-toi de l’autel et présente ton sacrifice pour le péché[a] et ton holocauste ; fais l’expiation pour toi-même et pour le peuple. Puis présente l’offrande du peuple et fais l’expiation pour eux, comme Yahweh l’a ordonné. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton sacrifice de purification ». Le terme hébreu peut désigner le sacrifice pour le péché, en mettant dans certains contextes l’accent sur la purification de l’impureté.
    reason: Alternative lexicale préservant l’étendue du sens de חַטָּאת.
lexical_decisions:
- source_word: קְרַב
  choice: Approche-toi
  rationale: L’impératif de קרב désigne ici l’action cultuelle de s’avancer vers l’autel. « Approche-toi » est direct, naturel et précis.
- source_word: הַמִּזְבֵּחַ
  choice: l’autel
  rationale: Désignation cultuelle standard, avec l’article défini conservé.
- source_word: וַעֲשֵׂה
  choice: présente
  rationale: Avec des sacrifices pour objets, עשה signifie accomplir ou offrir le sacrifice. « Présente » convient aux deux types d’offrandes et évite le calque peu naturel « fais ».
- source_word: חַטָּאתְךָ
  choice: ton sacrifice pour le péché
  rationale: Dans ce contexte sacrificiel, חַטָּאת désigne l’offrande liée au péché et à la purification. La formulation retenue est claire en français, tandis que l’autre nuance est conservée en note.
- source_word: עֹלָתֶךָ
  choice: ton holocauste
  rationale: « Holocauste » est le terme français établi pour l’offrande entièrement consumée désignée par עֹלָה.
- source_word: וְכַפֵּר
  choice: accomplis ainsi le rite d’expiation
  rationale: כפר exprime ici l’acte rituel effectué au moyen des sacrifices. Cette formulation préserve la portée cultuelle et théologique sans imposer une théorie particulière de l’expiation.
- source_word: בַּעַדְךָ וּבְעַד הָעָם
  choice: pour toi-même et pour le peuple
  rationale: בעד indique que le rite est accompli en faveur de personnes ou pour leur compte. « Pour » rend naturellement ce rapport en français.
- source_word: קָרְבַּן הָעָם
  choice: l’offrande du peuple
  rationale: קרבן est un terme général désignant ce qui est présenté comme offrande. Le complément « du peuple » préserve naturellement la relation du construit hébreu.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: comme Yahweh l’a ordonné
  rationale: La proposition exprime la conformité à l’ordre divin. « Yahweh » rend le nom personnel יהוה plutôt que de lui substituer un titre.
theological_decisions:
- issue: Sens de חַטָּאת dans le contexte sacrificiel
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le terme peut désigner l’offrande en rapport avec le péché tout en mettant, selon le contexte, l’accent sur la purification rituelle. Le texte principal retient une formulation française familière et exacte, et la note préserve l’autre nuance.
- issue: Portée de כפר
  choice: accomplir le rite d’expiation
  alternative: faire l’expiation
  rationale: Le verbe porte à la fois une dimension rituelle et théologique. La formulation choisie indique que le sujet accomplit le rite prescrit sans préciser indûment le mécanisme de l’expiation.
- issue: Objet de l’expiation dans בַּעַדְךָ וּבְעַד הָעָם
  choice: pour toi-même et pour le peuple
  alternative: en ta faveur et en faveur du peuple
  rationale: Le texte affirme que l’acte est accompli pour Aaron et le peuple, sans développer ici une doctrine plus précise de représentation ou de substitution.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire cultuel établi (« autel », « holocauste », « expiation ») est conservé, tandis que la syntaxe reste fluide. Le point-virgule clarifie que l’expiation résulte de la présentation des sacrifices sans ajouter une action étrangère au texte.
