  terminology: « Sacrifice pour le péché », « holocauste », « offrande », « expiation » et « Yahweh » sont cohérents avec les termes hébreux et avec les choix du projet. La note rend correctement l’alternative lexicale « sacrifice de purification ».
  issues:
