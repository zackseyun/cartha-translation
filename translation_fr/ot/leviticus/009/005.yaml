id: LEV.9.5
reference: Leviticus 9:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּקְח֗וּ אֵ֚ת אֲשֶׁ֣ר צִוָּ֣ה מֹשֶׁ֔ה אֶל פְּנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וַֽ/יִּקְרְבוּ֙ כָּל הָ֣/עֵדָ֔ה וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/005.yaml
  text: So they brought what Moses had commanded to the front of the tent of meeting, and all the congregation came near and stood before Yahweh.
translation:
  language: fr
  text: Ils apportèrent devant la tente de la rencontre ce que Moïse avait ordonné. Toute la communauté s’approcha et se tint devant Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Ils apportèrent
  rationale: Le verbe לָקַח signifie souvent « prendre », mais la destination exprimée par אֶל־פְּנֵי donne ici au déplacement le sens idiomatique d’« apporter ».
- source_word: אֵת אֲשֶׁר צִוָּה מֹשֶׁה
  choice: ce que Moïse avait ordonné
  rationale: La proposition relative désigne ce que Moïse avait prescrit auparavant; le plus-que-parfait rend naturellement l’antériorité dans le récit français.
- source_word: אֶל־פְּנֵי
  choice: devant
  rationale: Dans ce contexte, l’expression indique l’emplacement situé en face de la tente. « Devant » est naturel en français et reste distinct, par son complément, de la formule finale concernant Yahweh.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette traduction transparente conserve les deux éléments du syntagme hébreu et évite le terme plus traditionnel et moins immédiatement intelligible « tabernacle ».
- source_word: וַיִּקְרְבוּ
  choice: s’approcha
  rationale: Le verbe קָרַב exprime le fait de venir près. Le singulier s’accorde naturellement avec le collectif « toute la communauté ».
- source_word: כָּל־הָעֵדָה
  choice: Toute la communauté
  rationale: עֵדָה désigne ici la communauté d’Israël réunie. « Communauté » est courant, digne et moins marqué religieusement que « congrégation » en français international.
- source_word: וַיַּעַמְדוּ
  choice: se tint
  rationale: עָמַד signifie se tenir debout ou prendre place. « Se tint » convient au sujet collectif singulier et conserve la posture devant Dieu sans ajout interprétatif.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: L’expression garde à la fois sa dimension spatiale et cultuelle. Le tétragramme est transcrit « Yahweh », conformément à sa présence explicite dans le texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente directement le nom divin et suit la décision théologique fournie, sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. Deux phrases allègent la coordination hébraïque sans modifier la succession des actions. Le passé simple convient au registre narratif biblique soutenu tout en restant intelligible.
