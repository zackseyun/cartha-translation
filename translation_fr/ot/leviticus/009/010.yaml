  text: וְ/אֶת הַ/חֵ֨לֶב וְ/אֶת הַ/כְּלָיֹ֜ת וְ/אֶת הַ/יֹּתֶ֤רֶת מִן הַ/כָּבֵד֙ מִן הַ֣/חַטָּ֔את הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/010.yaml
  text: And the fat[a], the kidneys, and the lobe of the liver from the sin offering he turned into smoke on the altar, just as Yahweh had commanded Moses.
translation:
  language: fr
  text: Il fit monter en fumée sur l’autel la graisse, les rognons et le lobe du foie, prélevés sur le sacrifice pour le péché[a], comme Yahweh l’avait ordonné à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification ». Le terme hébreu peut souligner le rôle de ce sacrifice dans l’élimination de l’impureté aussi bien que dans le traitement du péché.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶב
  choice: la graisse
  rationale: Dans le contexte sacrificiel, le terme désigne la graisse, plus précisément les parties grasses réservées à l’autel. « La graisse » reste direct et naturel en français.
- source_word: כְּלָיֹת
  choice: les rognons
  rationale: « Rognons » est le terme anatomique usuel en français dans ce contexte rituel et conserve le détail concret de l’hébreu.
- source_word: יֹּתֶרֶת מִן־הַכָּבֵד
  choice: le lobe du foie
  rationale: La locution désigne une partie ou excroissance du foie retirée lors du sacrifice. « Le lobe du foie » est lisible et suffisamment proche de la formulation hébraïque.
- source_word: חַטָּאת
  choice: sacrifice pour le péché
  rationale: Cette désignation traditionnelle et intelligible conserve le lien explicite avec le péché; la nuance fonctionnelle de purification est signalée en note.
- source_word: הִקְטִיר
  choice: fit fumer
  rationale: Le hiphil de קטר désigne ici l’action de faire monter l’offrande en fumée sur l’autel, et non simplement de la brûler.
- source_word: הַמִּזְבֵּחָה
  choice: sur l’autel
  rationale: Même si la forme comporte une terminaison directionnelle, « sur l’autel » exprime idiomatiquement en français le lieu où les parties sacrificielles sont mises à fumer.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Sens cultuel de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le terme peut mettre en avant le péché ou la fonction purificatrice du sacrifice. Le rendu traditionnel demeure dans le texte, tandis que l’autre nuance légitime est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. L’ordre français place le verbe avant l’énumération pour éviter une phrase lourde, sans modifier les relations syntaxiques du texte hébreu.
