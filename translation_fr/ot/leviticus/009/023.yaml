id: LEV.9.23
reference: Leviticus 9:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּבֹ֨א מֹשֶׁ֤ה וְ/אַהֲרֹן֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וַ/יֵּ֣צְא֔וּ וַֽ/יְבָרֲכ֖וּ אֶת הָ/עָ֑ם וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֶל כָּל הָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/023.yaml
  text: Moses and Aaron went into the tent of meeting, and when they came out, they blessed the people. Then the glory of Yahweh appeared to all the people.
translation:
  language: fr
  text: Moïse et Aaron entrèrent dans la tente de la rencontre. Lorsqu’ils en sortirent, ils bénirent le peuple. Alors la gloire de Yahweh apparut à tout le peuple.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Rend naturellement l’expression cultuelle hébraïque tout en conservant l’idée d’un lieu où Dieu rencontre son peuple.
- source_word: וַיָּבֹא ... וַיֵּצְאוּ
  choice: entrèrent… sortirent
  rationale: Ces verbes français rendent clairement les mouvements successifs. Malgré la forme singulière de וַיָּבֹא, le sujet coordonné « Moïse et Aaron » et les verbes pluriels qui suivent indiquent que tous deux entrent.
- source_word: וַיְבָרֲכוּ
  choice: ils bénirent
  rationale: Traduction directe qui ne précise pas indûment la forme prise par la bénédiction.
- source_word: הָעָם / כָּל הָעָם
  choice: le peuple / tout le peuple
  rationale: Dans ce contexte, עָם désigne la communauté rassemblée; « peuple » est l’équivalent français le plus naturel.
- source_word: כְבוֹד יְהוָה
  choice: la gloire de Yahweh
  rationale: « Gloire » conserve l’idée de la manifestation visible et majestueuse de la présence divine, tandis que le nom propre יהוה est translittéré « Yahweh ».
- source_word: וַיֵּרָא
  choice: apparut
  rationale: Le nifal exprime ici une manifestation devenue visible; « apparut » convient au récit théophanique.
- source_word: אֶל כָּל הָעָם
  choice: à tout le peuple
  rationale: Après « apparut », la préposition אֶל se rend naturellement par « à », sans ajouter l’idée interprétative de « sous les yeux de ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le caractère de nom propre sans le remplacer par un titre.
- issue: Rapport temporel entre les propositions
  choice: Lorsqu’ils en sortirent… Alors…
  alternative: Ils sortirent et bénirent… et la gloire… apparut
  rationale: La succession des wayyiqtol marque la progression narrative. La formulation française explicite sobrement cette succession sans en faire une relation causale.
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « Tente de la rencontre » est maintenu en minuscules comme désignation descriptive à portée cultuelle.
