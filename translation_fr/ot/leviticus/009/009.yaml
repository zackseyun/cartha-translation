source:
  edition: WLC
  text: וַ֠/יַּקְרִבוּ בְּנֵ֨י אַהֲרֹ֣ן אֶת הַ/דָּם֮ אֵלָי/ו֒ וַ/יִּטְבֹּ֤ל אֶצְבָּע/וֹ֙ בַּ/דָּ֔ם וַ/יִּתֵּ֖ן עַל קַרְנ֣וֹת הַ/מִּזְבֵּ֑חַ וְ/אֶת הַ/דָּ֣ם יָצַ֔ק אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/009.yaml
  text: And Aaron’s sons brought the blood to him[a], and he dipped his finger in the blood and put it on the horns of the altar[c][b], and he poured out the blood at the base of the altar.
translation:
  language: fr
  text: Les fils d’Aaron lui apportèrent le sang[a]. Aaron trempa son doigt dans le sang, en mit sur les cornes de l’autel[b] et versa le sang à la base de l’autel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lui présentèrent le sang »; dans un cadre rituel, le verbe hébreu peut signifier « faire approcher » ou « présenter ».
    reason: lexical_alternative
  - marker: b
    text: Les « cornes » sont les saillies situées aux angles de l’autel.
    reason: cultural_note
  - marker: c
    text: Littéralement « vers le fondement de l’autel »; ou « vers la base de l’autel ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִבוּ
  choice: apportèrent
  rationale: Le hifil de קרב signifie « faire approcher, présenter ». « Apportèrent » exprime naturellement ici le geste des fils d’Aaron, tandis que la note conserve la nuance rituelle possible.
- source_word: בְּנֵי אַהֲרֹן
  choice: Les fils d’Aaron
  rationale: Rend directement la construction hébraïque et conserve l’identification familiale et sacerdotale.
- source_word: הַדָּם
  choice: le sang
  rationale: L’article défini est maintenu puisqu’il s’agit du sang précis du sacrifice déjà mentionné.
- source_word: אֵלָיו
  choice: lui
  rationale: Le pronom renvoie le plus naturellement à Aaron dans le contexte immédiat; le nom d’Aaron est repris dans la phrase suivante pour éviter toute ambiguïté en français.
- source_word: וַיִּטְבֹּל אֶצְבָּעוֹ
  choice: trempa son doigt
  rationale: « Tremper » rend clairement et naturellement l’action ponctuelle de טבל avec le doigt comme objet.
- source_word: וַיִּתֵּן עַל
  choice: en mit sur
  rationale: Le pronom « en » reprend le sang sans ajouter d’objet étranger; « mettre sur » conserve la simplicité du verbe נתן et sa relation avec עַל.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: les cornes de l’autel
  rationale: La désignation cultuelle concrète est conservée; une note explique qu’il s’agit des saillies aux angles de l’autel.
- source_word: יָצַק
  choice: versa
  rationale: Le verbe exprime l’action de verser un liquide; « versa » est précis et idiomatique.
- source_word: אֶת הַדָּם
  choice: le reste du sang
  rationale: L’hébreu répète « le sang ». Après qu’une petite quantité a été appliquée aux cornes, « le reste du sang » explicite naturellement en français la quantité versée sans modifier le déroulement du rite.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: au pied de l’autel
  rationale: יְסוֹד désigne le fondement ou la base. « Au pied de l’autel » est une formulation française naturelle pour l’endroit où le sang est versé, tandis que la note signale le sens plus formel.
theological_decisions:
- issue: Référent du pronom אֵלָיו
  choice: Le sang est apporté à Aaron.
  alternative: Le pronom pourrait théoriquement renvoyer à un autre élément implicite, par exemple l’autel.
  rationale: Aaron est le célébrant qui accomplit immédiatement les gestes suivants, tandis que ses fils l’assistent; il constitue donc l’antécédent contextuel le plus naturel. Ce choix grammatical n’impose aucune interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est légèrement segmentée pour éviter que le pronom « il » soit momentanément attribué aux fils d’Aaron. Le vocabulaire cultuel concret est conservé, avec de brèves notes explicatives.
