review_pass:
  verdict: revise
  source_fidelity: La reprise explicite d’« Aaron » clarifie correctement le référent de אֵלָיו et les actions rituelles sont rendues fidèlement. Toutefois, « le reste du sang » ajoute une précision absente de l’hébreu, qui répète simplement « le sang »; cette inférence doit être évitée.
  naturalness: Le français est clair, moderne et de registre approprié. « À la base de l’autel » est à la fois naturel et plus proche de יְסוֹד que « au pied de l’autel ».
  terminology: « Fils d’Aaron », « sang », « cornes de l’autel » et « base de l’autel » sont appropriés. La note sur les cornes explique utilement l’expression concrète sans l’interpréter excessivement.
  issues:
  - severity: medium
    issue: « le reste du sang »
    rationale: Le texte hébreu dit וְאֶת־הַדָּם, « et le sang », sans qualifier ce sang comme un reste. Même si le contexte rituel peut le suggérer, la traduction ne doit pas expliciter cette inférence.
  - severity: low
    issue: « au pied de l’autel »
    rationale: La formule est idiomatique, mais « à la base de l’autel » rend plus directement יְסוֹד (« base/fondement ») et évite une image corporelle qui n’est pas présente dans le terme hébreu.
  revised_text: Les fils d’Aaron lui apportèrent le sang[a]. Aaron trempa son doigt dans le sang, en mit sur les cornes de l’autel[b] et versa le sang à la base de l’autel[c].
