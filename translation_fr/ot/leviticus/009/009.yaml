revisions:
- from: Les fils d’Aaron lui apportèrent le sang[a]. Aaron trempa son doigt dans le sang et en mit sur les cornes de l’autel[b], puis il versa le reste du sang au pied de l’autel[c].
  to: Les fils d’Aaron lui apportèrent le sang[a]. Aaron trempa son doigt dans le sang, en mit sur les cornes de l’autel[b] et versa le sang à la base de l’autel[c].
  rationale: La révision supprime l’ajout interprétatif « le reste du » et rend יְסוֹד par « base », tout en conservant la clarté du référent Aaron et les notes lexicales et culturelles nécessaires.
