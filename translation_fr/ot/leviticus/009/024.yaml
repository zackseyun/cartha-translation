review_pass:
  verdict: revise
  source_fidelity: 'Le sens du verset est globalement bien rendu : le feu procède de Yahweh, consume les éléments sacrificiels, et le peuple réagit par une acclamation puis une prosternation. « De devant Yahweh » calque correctement לִפְנֵי, mais reste moins naturel en français moderne que « de la présence de Yahweh » ; cette dernière restitue le sens idiomatique sans éliminer l’origine divine du feu.'
  naturalness: Le passé simple et le registre narratif sont appropriés. « Un feu sortit de devant Yahweh » est compréhensible, mais légèrement raide. « Un feu sortit de la présence de Yahweh » est plus idiomatique dans un français international moderne. Le reste de la formulation est fluide.
  terminology: « Yahweh » correspond au nom divin du texte hébreu. « Offrande entièrement brûlée » rend de façon explicative et non confessionnelle עֹלָה ; « portions grasses » rend adéquatement les parties grasses sacrificielles désignées par חֲלָבִים. La note sur la clameur conserve utilement une possibilité lexicale sans imposer une nuance doctrinale.
  issues:
  - severity: low
    issue: 'Formulation légèrement calquée : « de devant Yahweh »'
    rationale: Bien que littérale, cette expression est moins naturelle en français contemporain. « De la présence de Yahweh » exprime ici naturellement מִלִּפְנֵי יהוה, qui désigne la provenance depuis la présence divine.
  revised_text: Alors un feu sortit de la présence de Yahweh et consuma sur l’autel l’offrande entièrement brûlée et les portions grasses. Tout le peuple le vit, poussa des cris de joie[a] et tomba face contre terre.
