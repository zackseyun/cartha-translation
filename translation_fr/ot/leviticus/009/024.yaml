revisions:
- from: Alors un feu sortit de devant Yahweh et consuma sur l’autel l’offrande entièrement brûlée et les portions grasses. Tout le peuple le vit, poussa des cris de joie[a] et tomba face contre terre.
  to: Alors un feu sortit de la présence de Yahweh et consuma sur l’autel l’offrande entièrement brûlée et les portions grasses. Tout le peuple le vit, poussa des cris de joie[a] et tomba face contre terre.
  rationale: La seule révision remplace un calque spatial quelque peu raide par une expression française naturelle qui conserve le sens contextuel de provenance depuis la présence de Yahweh. Aucun autre changement de sens n’est nécessaire.
