  text: וַ/תֵּ֤צֵא אֵשׁ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וַ/תֹּ֨אכַל֙ עַל הַ/מִּזְבֵּ֔חַ אֶת הָ/עֹלָ֖ה וְ/אֶת הַ/חֲלָבִ֑ים וַ/יַּ֤רְא כָּל הָ/עָם֙ וַ/יָּרֹ֔נּוּ וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/024.yaml
  text: And fire came out from before Yahweh and consumed on the altar the burnt offering and the fat portions[a]. And all the people saw[b], and they shouted for joy and fell on their faces.
translation:
  language: fr
  text: Alors un feu sortit de la présence de Yahweh et consuma sur l’autel l’offrande entièrement brûlée et les portions grasses. Tout le peuple le vit, poussa des cris de joie[a] et tomba face contre terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « poussa une clameur » ou « lança des cris de jubilation ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא אֵשׁ
  choice: un feu sortit
  rationale: Le verbe יצא exprime un mouvement vers l’extérieur. « Un feu sortit » restitue directement l’image narrative et convient naturellement au français.
- source_word: מִלִּפְנֵי יְהוָה
  choice: de devant Yahweh
  rationale: Cette formulation conserve l’image spatiale de לִפְנֵי tout en pouvant évoquer la présence divine, sans réduire l’expression à une interprétation abstraite.
- source_word: וַתֹּאכַל
  choice: consuma
  rationale: Pour un feu qui détruit une offrande, « consuma » est l’équivalent idiomatique du verbe signifiant littéralement « manger ».
- source_word: הָעֹלָה
  choice: l’offrande entièrement brûlée
  rationale: עֹלָה désigne le sacrifice intégralement offert par le feu. Cette traduction explicite sa particularité mieux que le terme français potentiellement obscur « holocauste ».
- source_word: הַחֲלָבִים
  choice: les portions grasses
  rationale: Le pluriel désigne les parties grasses déterminées de la victime sacrificielle, et non la graisse en général.
- source_word: וַיַּרְא כָּל הָעָם
  choice: Tout le peuple le vit
  rationale: Le pronom « le » renvoie naturellement à l’événement du feu consumant les offrandes et rend la phrase fluide en français.
- source_word: וַיָּרֹנּוּ
  choice: poussa des cris de joie
  rationale: רנן évoque ici une clameur sonore et jubilante. Le pluriel français rend naturellement la réaction collective.
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם
  choice: tomba face contre terre
  rationale: Cette expression actuelle conserve l’image concrète de la prosternation sans la remplacer par un terme interprétatif.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin. « Yahweh » le représente comme un nom propre plutôt que de le remplacer par un titre.
- issue: Nature de la réaction exprimée par וַיָּרֹנּוּ
  choice: poussa des cris de joie
  alternative: poussa une clameur
  rationale: Le verbe peut désigner une clameur retentissante ou jubilante. Le contexte soutient la joie, mais une note conserve la possibilité d’une formulation moins explicitement émotionnelle.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit. « Offrande entièrement brûlée » privilégie la clarté cultuelle; « face contre terre » garde la force visuelle de l’hébreu.
