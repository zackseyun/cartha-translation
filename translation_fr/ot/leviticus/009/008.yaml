  text: וַ/יִּקְרַ֥ב אַהֲרֹ֖ן אֶל הַ/מִּזְבֵּ֑חַ וַ/יִּשְׁחַ֛ט אֶת עֵ֥גֶל הַ/חַטָּ֖את אֲשֶׁר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/008.yaml
  text: Then Aaron came near to the altar and slaughtered the calf of the sin offering that was for himself[a].
translation:
  language: fr
  text: Alors Aaron s’approcha de l’autel et égorgea le veau du sacrifice pour le péché qui le concernait[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le veau du sacrifice de purification ». Le terme hébreu peut désigner le sacrifice associé à l’élimination du péché et de l’impureté.'
    reason: Alternative lexicale préservant la nuance purificatrice possible de חטאת.
lexical_decisions:
- source_word: וַיִּקְרַב
  choice: s’approcha
  rationale: Le verbe קרב exprime ici le mouvement concret d’Aaron vers l’autel. « S’approcha » est naturel et précis en français moderne.
- source_word: הַמִּזְבֵּחַ
  choice: l’autel
  rationale: Équivalent français usuel de מזבח dans un contexte sacrificiel.
- source_word: וַיִּשְׁחַט
  choice: égorgea
  rationale: Dans le contexte sacrificiel, שחט désigne l’abattage par égorgement. Ce verbe est plus précis que « tua » et idiomatique en français.
- source_word: עֵגֶל
  choice: le veau
  rationale: עגל désigne un jeune bovin; « veau » est ici la traduction directe et correspond à l’animal prescrit dans le contexte.
- source_word: הַחַטָּאת
  choice: le sacrifice pour le péché
  rationale: Dans la législation sacrificielle, חטאת désigne la catégorie de sacrifice associée au péché, tout en pouvant mettre l’accent sur la purification. « Sacrifice pour le péché » est clair en français et évite de réduire le terme à une simple offrande non animale.
- source_word: אֲשֶׁר לוֹ
  choice: qui était pour lui-même
  rationale: La formule distingue le sacrifice d’Aaron de ceux offerts pour le peuple. « Pour lui-même » rend explicitement sa destination sans suggérer seulement une relation de propriété.
theological_decisions:
- issue: Sens de חטאת dans le contexte sacrificiel sacerdotal
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le terme hébreu nomme ici une catégorie sacrificielle liée au traitement du péché et de l’impureté. La traduction principale conserve l’appellation traditionnelle liée au péché, tandis que la note signale la nuance purificatrice sans trancher une question interprétative débattue.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe suit la progression narrative hébraïque, tandis que « égorgea » conserve la précision rituelle. Le marqueur [a] figure dans le texte principal.
