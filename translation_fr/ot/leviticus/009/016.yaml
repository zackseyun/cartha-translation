  text: וַ/יַּקְרֵ֖ב אֶת הָ/עֹלָ֑ה וַֽ/יַּעֲשֶׂ֖/הָ כַּ/מִּשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/016.yaml
  text: And he presented the burnt offering and offered it according to the ordinance[a].
translation:
  language: fr
  text: Il présenta l’holocauste et l’offrit selon le rite prescrit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « conformément à ce qui était prescrit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: présenta
  rationale: Le hiphil de קרב signifie « faire approcher » ou « présenter ». Dans ce contexte sacrificiel, « présenta » conserve le geste rituel sans le confondre avec l’accomplissement du sacrifice exprimé ensuite.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: עֹלָה désigne l’offrande entièrement brûlée. « Holocauste » est le terme sacrificiel traditionnel et précis en français biblique, encore intelligible dans ce contexte.
- source_word: וַיַּעֲשֶׂהָ
  choice: l’accomplit
  rationale: עשה est un verbe large, « faire, exécuter ». « L’accomplit » exprime ici l’exécution du rite sans lui attribuer un geste technique plus précis que ne le fait l’hébreu.
- source_word: כַּמִּשְׁפָּט
  choice: selon la règle prescrite
  rationale: מִשְׁפָּט désigne ici la norme réglant la procédure sacrificielle. Cette formulation garde sa valeur normative tout en restant naturelle en français.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La phrase conserve la succession des deux actes du texte hébreu et le caractère normatif de la procédure cultuelle.
