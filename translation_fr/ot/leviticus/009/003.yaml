  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר קְח֤וּ שְׂעִיר עִזִּים֙ לְ/חַטָּ֔את וְ/עֵ֨גֶל וָ/כֶ֧בֶשׂ בְּנֵי שָׁנָ֛ה תְּמִימִ֖ם לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/003.yaml
  text: And to the sons of Israel you shall speak[a], saying, ‘Take a male goat for a sin offering, and a calf and a lamb, each a year old, without blemish, for a burnt offering.’
translation:
  language: fr
  text: 'Et tu diras aux fils d’Israël : « Prenez un bouc pour le sacrifice pour le péché[a], ainsi qu’un veau et un agneau, tous deux âgés d’un an et sans défaut, pour l’holocauste. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « sacrifice de purification » : dans les textes sacerdotaux, le mot hébreu חַטָּאת peut désigner un sacrifice ayant une fonction purificatrice.'
    reason: Alternative lexicale légitime pour le terme sacrificiel חַטָּאת.
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל
  choice: Tu diras aux fils d’Israël
  rationale: La tournure française intègre naturellement la conjonction et le destinataire à l’ordre adressé à Moïse. « Fils d’Israël » conserve la forme masculine du syntagme hébreu et sa valeur de désignation collective.
- source_word: תְּדַבֵּר לֵאמֹר
  choice: 'Tu diras … :'
  rationale: Le futur français exprime ici l’instruction, tandis que les deux-points rendent idiomatiquement l’introduction de la parole directe sans reproduire lourdement « en disant ».
- source_word: קְחוּ
  choice: Prenez
  rationale: Impératif pluriel direct, conforme au sens ordinaire de לקח; « apportez » ajouterait une idée de destination non exprimée par le verbe.
- source_word: שְׂעִיר עִזִּים
  choice: un bouc
  rationale: Le syntagme désigne un caprin mâle; « bouc » est précis, naturel et concis en français.
- source_word: לְ/חַטָּאת
  choice: pour le sacrifice pour le péché
  rationale: Dans ce contexte sacerdotal, חַטָּאת désigne une catégorie sacrificielle. Cette formulation demeure compréhensible tout en laissant paraître le rapport lexical au péché; l’autre analyse, « sacrifice de purification », est signalée en note.
- source_word: וְ/עֵגֶל וָ/כֶבֶשׂ
  choice: ainsi qu’un veau et un agneau
  rationale: « Veau » et « agneau » correspondent aux désignations usuelles des jeunes animaux; « ainsi que » relie naturellement les deux victimes destinées à l’holocauste après le premier sacrifice.
- source_word: בְּנֵי שָׁנָה
  choice: d’un an
  rationale: L’expression hébraïque porte sur le veau et l’agneau. En français, le singulier après chaque nom coordonné est naturel, et « tous deux » dans la suite rend explicite la portée distributive.
- source_word: תְּמִימִם
  choice: tous deux sans défaut
  rationale: Le pluriel montre que la qualification concerne le veau et l’agneau. « Sans défaut » est la formulation française précise dans le cadre sacrificiel.
- source_word: לְ/עֹלָה
  choice: pour l’holocauste
  rationale: « Holocauste » est le terme français établi pour l’offrande entièrement consumée, sans réduire le mot à sa seule étymologie ascendante.
theological_decisions:
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites; les enfants d’Israël
  rationale: Le choix conserve avec transparence la forme masculine plurielle de l’hébreu, employée ici comme désignation collective du peuple, sans en tirer une conclusion doctrinale sur les seuls destinataires masculins.
- issue: Rendu cultuel de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le terme désigne clairement ici une offrande rituelle, mais sa nuance exacte peut être décrite soit par son rapport au péché, soit par sa fonction purificatrice. Le texte principal retient la formulation la plus immédiatement reconnaissable et la note préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe évite le calque « tu parleras… en disant » tout en conservant la force directive. Le vocabulaire sacrificiel reste précis et relativement traditionnel; la note rend visible l’ambiguïté fonctionnelle de חַטָּאת.
