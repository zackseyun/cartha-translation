  text: וַ/יִּשְׁחַ֤ט אֶת הַ/שּׁוֹר֙ וְ/אֶת הָ/אַ֔יִל זֶ֥בַח הַ/שְּׁלָמִ֖ים אֲשֶׁ֣ר לָ/עָ֑ם וַ֠/יַּמְצִאוּ בְּנֵ֨י אַהֲרֹ֤ן אֶת הַ/דָּם֙ אֵלָ֔י/ו וַ/יִּזְרְקֵ֥/הוּ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/018.yaml
  text: Then he slaughtered the ox and the ram[a], the sacrifice of peace offerings that was for the people. Aaron’s sons brought the blood to him, and he splashed it on the altar all around.
translation:
  language: fr
  text: Puis il égorgea le taureau et le bélier du sacrifice de communion[a] destiné au peuple. Les fils d’Aaron lui apportèrent le sang, et il le projeta contre l’autel, tout autour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de paix » ou « sacrifice de bien-être ». Le terme hébreu שְׁלָמִים évoque la paix, l’intégrité et la communion.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: Puis il égorgea
  rationale: Le waw consécutif fait avancer le récit. « Puis » exprime naturellement la succession, et « égorger » est le terme sacrificiel précis.
- source_word: הַשּׁוֹר
  choice: le taureau
  rationale: שׁוֹר désigne un bovin; dans ce contexte sacrificiel, « taureau » est le terme français naturel et cohérent avec l’animal offert.
- source_word: הָאַיִל
  choice: le bélier
  rationale: אַיִל désigne précisément un bélier.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: le sacrifice de communion
  rationale: « Sacrifice de communion » rend en français actuel la dimension relationnelle du rite, sans réduire le champ de שְׁלָמִים, qui évoque aussi la paix et le bien-être; ces nuances sont signalées en note.
- source_word: אֲשֶׁר לָעָם
  choice: destiné au peuple
  rationale: Cette formulation concise rend la destination ou la fonction du sacrifice en faveur du peuple sans préciser davantage la relation exprimée par ל.
- source_word: וַיַּמְצִאוּ ... אֵלָיו
  choice: lui apportèrent
  rationale: Dans la procédure sacrificielle, le verbe décrit l’action d’apporter ou de présenter le sang à l’officiant. Le pronom conserve la formulation hébraïque et renvoie clairement à Aaron.
- source_word: וַיִּזְרְקֵהוּ
  choice: il le projeta
  rationale: זָרַק désigne ici une application énergique du sang sur ou contre l’autel, plutôt qu’une légère aspersion. « Projeter » évite de confondre ce geste avec les rites exprimés par d’autres verbes hébreux souvent rendus par « asperger ».
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: contre l’autel, tout autour
  rationale: Dans ce contexte rituel, עַל indique que le sang atteint la surface de l’autel, et סָבִיב précise qu’il est appliqué sur son pourtour.
theological_decisions:
- issue: Sens de שְׁלָמִים
  choice: sacrifice de communion
  alternative: sacrifice de paix; sacrifice de bien-être
  rationale: Aucun équivalent français unique ne porte toutes les associations de la racine שׁלם. Le texte retient une désignation cultuelle claire, tandis que la note préserve les autres nuances authentiques sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. Le vocabulaire sacrificiel reste concret et précis; la phrase conserve la progression narrative et le pronom référant à Aaron.
