source:
  edition: WLC
  text: וְ/אֶת הַ/בָּשָׂ֖ר וְ/אֶת הָ/ע֑וֹר שָׂרַ֣ף בָּ/אֵ֔שׁ מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/011.yaml
  text: But the flesh and the hide he burned with fire outside the camp[a].
translation:
  language: fr
  text: Mais il brûla la chair et la peau au feu, hors du camp[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et il brûla la chair et la peau dans le feu, à l’extérieur du camp. »'
    reason: Variante lexicale et discursive possible pour וְ et בָּאֵשׁ, avec une autre formulation naturelle de מִחוּץ לַמַּחֲנֶה.
lexical_decisions:
- source_word: וְ/אֶת
  choice: Mais
  rationale: La conjonction וְ poursuit le récit, tandis que אֵת marque le complément d’objet direct et ne se traduit pas. « Mais » rend naturellement le contraste discursif avec ce qui vient d’être brûlé sur l’autel au verset précédent; « Et » demeure possible.
- source_word: הַ/בָּשָׂר
  choice: la chair
  rationale: בָּשָׂר désigne ici la chair de l’animal. « Chair » convient au registre sacrificiel et évite de suggérer de la viande destinée à être consommée.
- source_word: הָ/עוֹר
  choice: la peau
  rationale: עוֹר désigne la peau de l’animal. En français courant, « peau » est plus naturel et précis ici que « cuir », qui pourrait évoquer une matière déjà préparée.
- source_word: שָׂרַף
  choice: il brûla
  rationale: Le verbe exprime simplement l’action de brûler. Le passé simple convient au récit suivi et n’ajoute aucune nuance d’anéantissement absente du verbe lui-même.
- source_word: בָּ/אֵשׁ
  choice: au feu
  rationale: La préposition בְּ avec אֵשׁ indique ici le moyen ou l’élément employé pour brûler. « Au feu » est une formulation française naturelle qui reste proche de l’expression hébraïque.
- source_word: מִ/חוּץ לַ/מַּחֲנֶה
  choice: hors du camp
  rationale: L’expression situe l’action au-delà des limites du camp. « Hors du camp » conserve avec concision sa portée géographique et rituelle.
theological_decisions:
- issue: Langage de destruction rituelle dans le contexte sacrificiel
  choice: Décrire concrètement la combustion de la chair et de la peau hors du camp.
  alternative: Formuler le verset de manière à mettre en avant des associations typologiques ultérieures.
  rationale: Le texte hébreu énonce une procédure sacerdotale. La traduction n’y introduit aucun symbolisme théologique qui ne soit pas explicitement exprimé dans ce verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple maintient le registre narratif biblique sans archaïsme marqué. La formulation conserve le contraste avec le verset précédent tout en signalant en note la valeur simplement additive possible de וְ.
