id: LEV.11.35
reference: Leviticus 11:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ֠/כֹל אֲשֶׁר יִפֹּ֨ל מִ/נִּבְלָתָ֥/ם עָלָי/ו֮ יִטְמָא֒ תַּנּ֧וּר וְ/כִירַ֛יִם יֻתָּ֖ץ טְמֵאִ֣ים הֵ֑ם וּ/טְמֵאִ֖ים יִהְי֥וּ לָ/כֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/035.yaml
  text: And anything on which any part of their carcass falls shall become unclean[a]. Whether oven or hearth, it must be broken down; they are unclean[b], and they shall be unclean for you.
translation:
  language: fr
  text: 'Tout objet sur lequel tombera une partie de leurs cadavres deviendra impur[a]. Tout four ou foyer de cuisson[b] devra être démoli : ces installations sont impures et seront impures pour vous.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de leur cadavre ». L’hébreu peut employer ici le singulier dans un sens collectif et désigne le cadavre des animaux concernés par les règles de pureté.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne une installation de cuisson, peut-être un fourneau, un support pour marmites ou une structure comparable à un foyer.
    reason: cultural_note
lexical_decisions:
- source_word: מִנִּבְלָתָם
  choice: une partie de leurs cadavres
  rationale: נְבֵלָה désigne ici le cadavre d’un animal dans le contexte des règles de pureté. La préposition מִן a une valeur partitive, rendue explicitement par « une partie de ». Le pluriel français est naturel avec le suffixe « leurs », tout en conservant le sens collectif possible de l’hébreu.
- source_word: יִפֹּל
  choice: tombera
  rationale: L’imparfait hébreu énonce un cas général dans un texte juridique. Le futur français convient à la formulation d’une règle applicable chaque fois que le cas se présente.
- source_word: עָלָיו יִטְמָא
  choice: sur lequel … deviendra impur
  rationale: La formulation exprime l’entrée de l’objet dans un état d’impureté rituelle à la suite du contact avec le cadavre.
- source_word: תַּנּוּר
  choice: four
  rationale: Le terme désigne un four destiné notamment à la cuisson du pain ; « four » est l’équivalent moderne le plus clair.
- source_word: כִירַיִם
  choice: foyer de cuisson
  rationale: Le mot désigne une installation servant à la cuisson, peut-être un fourneau, un support pour marmites ou une structure comparable à un foyer. « Foyer de cuisson » reste clair sans préciser excessivement sa forme.
- source_word: יֻתָּץ
  choice: devra être démoli
  rationale: Le passif exprime la destruction obligatoire de l’installation contaminée. « Devra être démoli » communique nettement cette obligation juridique.
- source_word: טְמֵאִים הֵם
  choice: ces installations sont impures
  rationale: Le démonstratif explicite en français le référent pluriel, le four et le foyer, tout en conservant le terme biblique clé « impur ».
- source_word: וּטְמֵאִים יִהְיוּ לָכֶם
  choice: et le resteront pour vous
  rationale: La reprise pronominale évite une lourde répétition tout en conservant l’idée que ces installations demeurent à considérer comme impures par les destinataires.
theological_decisions:
- issue: Nature de l’impureté dans la législation lévitique
  choice: impur
  alternative: rituellement impur
  rationale: Le contexte indique une impureté rituelle et non une faute morale. Le terme simple « impur » préserve toutefois la terminologie biblique et sa cohérence sans ajouter une qualification interprétative dans le texte.
- issue: Portée de « pour vous »
  choice: conserver « pour vous »
  alternative: vous devrez les considérer comme impures
  rationale: La traduction littérale maintient la relation exprimée par לָכֶם sans décider si elle souligne principalement le statut des objets ou l’obligation faite aux Israélites de les tenir pour impurs.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase juridique est formulée naturellement au futur. « Tout four ou foyer de cuisson » rend les deux catégories de manière générique, tandis que « ces installations » clarifie le pluriel hébreu sans introduire de détail technique incertain.
