  text: מִ/כָּל הָ/אֹ֜כֶל אֲשֶׁ֣ר יֵאָכֵ֗ל אֲשֶׁ֨ר יָב֥וֹא עָלָ֛י/ו מַ֖יִם יִטְמָ֑א וְ/כָל מַשְׁקֶה֙ אֲשֶׁ֣ר יִשָּׁתֶ֔ה בְּ/כָל כְּלִ֖י יִטְמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/034.yaml
  text: Any food that may be eaten[a], on which water comes, becomes unclean; and any drink that may be drunk in any vessel becomes unclean.
translation:
  language: fr
  text: Toute nourriture qui peut être mangée[a] devient impure si de l’eau entre en contact avec elle ; toute boisson qui peut être bue dans n’importe quel récipient devient impure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « toute nourriture qui est mangée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל הָאֹכֶל
  choice: Toute nourriture
  rationale: La construction partitive et généralisante désigne toute nourriture relevant de la catégorie envisagée; cette formulation est naturelle en français juridique.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: qui peut être mangée
  rationale: Le niphal à l’inaccompli peut qualifier ce qui est destiné ou propre à être mangé, tout en laissant en note la lecture plus littérale « qui est mangée ».
- source_word: אֲשֶׁר יָבֹא עָלָיו מַיִם
  choice: si de l’eau tombe dessus
  rationale: La tournure conditionnelle rend naturellement la condition légale; « tombe dessus » conserve l’image de l’eau qui vient sur la nourriture sans préciser d’agent.
- source_word: יִטְמָא
  choice: devient impure
  rationale: Dans ce contexte rituel, le verbe indique l’entrée dans un état d’impureté; « devient impure » exprime clairement ce changement d’état.
- source_word: מַשְׁקֶה אֲשֶׁר יִשָּׁתֶה
  choice: boisson qui peut être bue
  rationale: « Boisson » désigne naturellement ce qui se boit, et le passif modal maintient le parallélisme avec la nourriture.
- source_word: בְּכָל כְּלִי
  choice: dans un récipient quelconque
  rationale: כְּלִי est ici un récipient ou contenant; « quelconque » restitue la portée distributive de כָּל sans employer le plus archaïque « vase ».
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. « Impure » maintient le vocabulaire rituel du Lévitique. Deux phrases remplacent le point-virgule afin d’alléger la lecture sans modifier le parallélisme juridique.
