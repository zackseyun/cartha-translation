  source_fidelity: La formulation française doit conserver la seconde occurrence de « dans les eaux » (בַּמַּיִם), avant la précision « dans les mers et dans les cours d’eau ». Le remplacement de « tout ce qui est dans les eaux » par « tout ce qui vit dans l’eau » ajoute une restriction explicite qui n’est pas formulée dans le texte source.
  naturalness: La révision demeure naturelle en français international moderne. « Tout ce qui se trouve dans les eaux » évite l’ajout de « vit » tout en gardant une formulation fluide; la reprise finale au singulier est grammaticalement cohérente avec « tout ce qui ».
  terminology: « Nageoires » et « écailles » sont exacts et idiomatiques. « Cours d’eau » est un rendu prudent et suffisamment large de נְחָלִים; la note conserve utilement l’alternative « rivières ».
