source:
  edition: WLC
  text: אֶת זֶה֙ תֹּֽאכְל֔וּ מִ/כֹּ֖ל אֲשֶׁ֣ר בַּ/מָּ֑יִם כֹּ֣ל אֲשֶׁר ל/וֹ֩ סְנַפִּ֨יר וְ/קַשְׂקֶ֜שֶׂת בַּ/מַּ֗יִם בַּ/יַּמִּ֛ים וּ/בַ/נְּחָלִ֖ים אֹתָ֥/ם תֹּאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/009.yaml
  text: 'These you may eat from all that are in the waters: whatever in the waters[a], in the seas and in the streams, has fins and scales—these you may eat.'
translation:
  language: fr
  text: 'Voici ce que vous pouvez manger parmi tout ce qui se trouve dans les eaux : tout ce qui, dans les eaux, dans les mers et dans les cours d’eau[a], a des nageoires et des écailles, vous pouvez le manger.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rivières ». Le mot hébreu peut désigner des ruisseaux, des cours d’eau ou des oueds, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת זֶה
  choice: Voici ce que
  rationale: Le démonstratif singulier introduit la catégorie permise. « Voici ce que » en conserve la valeur présentative tout en étant naturel en français.
- source_word: תֹּאכְלוּ ... תֹּאכֵלוּ
  choice: vous pouvez manger ... vous pouvez le manger
  rationale: Dans cette instruction alimentaire, l’imparfait hébreu exprime ce qui est permis plutôt qu’une obligation de manger.
- source_word: מִכֹּל אֲשֶׁר בַּמָּיִם
  choice: parmi tout ce qui vit dans l’eau
  rationale: « Parmi » rend la valeur partitive de מִן. L’ajout idiomatique de « vit » explicite sans modifier le référent que le passage classe parmi les animaux aquatiques.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: des nageoires et des écailles
  rationale: Les deux singuliers collectifs hébreux se rendent naturellement au pluriel en français dans une description zoologique.
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: dans les mers et dans les cours d’eau[a]
  rationale: « Mers » correspond directement à יַמִּים. « Cours d’eau » est une formulation française large qui convient à נְחָלִים sans le limiter aux seules rivières permanentes.
- source_word: אֹתָם תֹּאכֵלוּ
  choice: vous pouvez le manger
  rationale: Le pronom singulier français reprend naturellement « tout ce qui »; la reprise finale conserve l’insistance de l’hébreu.
