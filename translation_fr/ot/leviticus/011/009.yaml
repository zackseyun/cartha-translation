  - severity: low
    issue: « Tout ce qui vit dans l’eau » explicite et resserre le référent.
    rationale: Le texte hébreu dit « tout ce qui est/se trouve dans les eaux », sans le verbe « vivre ». La catégorie concerne bien des êtres aquatiques dans son contexte, mais il n’est pas nécessaire d’ajouter cette précision.
