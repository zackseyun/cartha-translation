source:
  edition: WLC
  text: זֹ֣את תּוֹרַ֤ת הַ/בְּהֵמָה֙ וְ/הָ/ע֔וֹף וְ/כֹל֙ נֶ֣פֶשׁ הַֽ/חַיָּ֔ה הָ/רֹמֶ֖שֶׂת בַּ/מָּ֑יִם וּ/לְ/כָל נֶ֖פֶשׁ הַ/שֹּׁרֶ֥צֶת עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/046.yaml
  text: This is the law concerning the livestock[a], the birds, every living creature that moves in the waters[c][b], and every creature that swarms on the earth.
translation:
  language: fr
  text: Voici la loi[a] concernant les animaux terrestres[b], les oiseaux, tout être vivant qui se déplace dans les eaux, et tout être qui grouille sur la terre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’instruction concernant » ; le mot hébreu peut désigner un enseignement faisant autorité aussi bien qu’une loi.
    reason: lexical_alternative
  - marker: b
    text: Ou « le bétail » ; le terme hébreu désigne la catégorie des animaux terrestres et peut, selon le contexte, évoquer particulièrement les bêtes domestiques.
    reason: lexical_scope
  - marker: c
    text: Ou « sur le sol » ; le mot hébreu peut signifier la terre, le pays ou le sol selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: la loi concernant
  rationale: Dans ce résumé des règles précédentes, תּוֹרָה désigne un ensemble d’instructions faisant autorité. « La loi concernant » est naturel en français et conserve cette portée normative.
- source_word: הַבְּהֵמָה
  choice: les animaux
  rationale: בְּהֵמָה désigne ici la catégorie des bêtes terrestres examinée plus haut. « Les animaux » est plus courant et plus large que « le bétail », qui pourrait exclure les espèces non domestiques mentionnées dans le chapitre.
- source_word: הָעוֹף
  choice: les oiseaux
  rationale: Bien que עוֹף puisse englober plus largement les êtres ailés, « les oiseaux » est la désignation naturelle de cette catégorie dans le contexte.
- source_word: כֹל נֶפֶשׁ הַחַיָּה
  choice: tout être vivant
  rationale: L’expression hébraïque désigne un être animé. Cette traduction évite le contresens moderne que produirait ici « toute âme vivante ».
- source_word: הָרֹמֶשֶׂת
  choice: qui se déplace
  rationale: Le participe de רמש évoque le mouvement d’animaux, souvent petits. Pour des êtres aquatiques, « se déplace » est idiomatique et ne confond pas ce verbe avec שׁרץ dans la proposition suivante.
- source_word: בַּמָּיִם
  choice: dans les eaux
  rationale: Le pluriel français conserve la forme et la tonalité de l’hébreu tout en restant naturel.
- source_word: וּלְכָל נֶפֶשׁ
  choice: et tout être
  rationale: « Être » rend נֶפֶשׁ dans son sens concret d’être animé et évite une répétition française inutile de « vivant ».
- source_word: הַשֹּׁרֶצֶת
  choice: qui grouille
  rationale: שׁרץ décrit le mouvement foisonnant de petites créatures. « Grouille » exprime directement cette nuance et distingue le terme de רמש.
- source_word: עַל הָאָרֶץ
  choice: sur la terre
  rationale: « La terre » conserve la portée générale de אֶרֶץ et forme le contraste voulu avec « les eaux ».
theological_decisions:
- issue: Sens de נֶפֶשׁ dans les expressions zoologiques
  choice: être vivant / être
  alternative: âme vivante / âme
  rationale: Dans ce contexte, נֶפֶשׁ désigne la créature animée entière, et non une composante immatérielle distincte. La traduction retenue préserve le sens concret sans imposer une anthropologie théologique étrangère au passage.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure récapitulative du texte hébreu. « Grouille » est concret et courant, tandis que la distinction entre רמש et שׁרץ est maintenue.
