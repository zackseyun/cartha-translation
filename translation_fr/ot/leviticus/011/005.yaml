id: LEV.11.5
reference: Leviticus 11:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶת הַ/שָּׁפָ֗ן כִּֽי מַעֲלֵ֤ה גֵרָה֙ ה֔וּא וּ/פַרְסָ֖ה לֹ֣א יַפְרִ֑יס טָמֵ֥א ה֖וּא לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/005.yaml
  text: And the rock badger[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: fr
  text: Quant au daman[a], puisqu’il rumine, mais n’a pas le sabot fendu, il est impur pour vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « daman des rochers » (hyrax).'
    reason: Précision zoologique et alternative lexicale pour הַשָּׁפָן.
lexical_decisions:
- source_word: הַשָּׁפָן
  choice: le daman
  rationale: Le terme désigne très probablement le daman des rochers, petit mammifère vivant dans les régions rocheuses. « Daman » est le nom zoologique courant et précis en français moderne.
- source_word: כִּי
  choice: puisqu’il
  rationale: La conjonction introduit ici la raison de la classification; « puisque » exprime naturellement ce rapport causal.
- source_word: מַעֲלֵה גֵרָה
  choice: rumine
  rationale: Cette formulation idiomatique française rend l’expression hébraïque qui signifie littéralement « faire remonter la nourriture ruminée ».
- source_word: וּפַרְסָה לֹא יַפְרִיס
  choice: mais n’a pas le sabot fendu
  rationale: La tournure exprime clairement l’absence d’un sabot divisé, critère de la législation alimentaire; « mais » rend l’opposition implicite dans l’enchaînement des deux critères.
- source_word: טָמֵא
  choice: impur
  rationale: Dans le contexte de Lévitique 11, « impur » désigne le statut rituel défini par la loi, sans attribuer à l’animal une faute morale.
- source_word: לָכֶם
  choice: pour vous
  rationale: Cette expression conserve l’application de la classification à la communauté à laquelle la loi est adressée.
theological_decisions:
- issue: Nature de טָמֵא dans la législation alimentaire du Lévitique
  choice: « impur », au sens du statut rituel
  alternative: « moralement impur » ou « mauvais »
  rationale: Le contexte classe les animaux selon les catégories cultuelles de pur et d’impur; il ne porte pas de jugement moral sur l’animal.
translation_notes:
  register: Français international moderne, naturel et digne. La structure juridique est conservée, tandis que « quant au » assure la continuité syntaxique avec la liste du contexte. Le terme zoologique « daman » est précis mais peut être peu connu, d’où la note.
