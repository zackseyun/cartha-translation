source:
  edition: WLC
  text: וְ/אֶת הַ֠/חֲזִיר כִּֽי מַפְרִ֨יס פַּרְסָ֜ה ה֗וּא וְ/שֹׁסַ֥ע שֶׁ֨סַע֙ פַּרְסָ֔ה וְ/ה֖וּא גֵּרָ֣ה לֹֽא יִגָּ֑ר טָמֵ֥א ה֖וּא לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/007.yaml
  text: And the pig[a], because it has a divided hoof and splits the hoof, but does not chew the cud[b], is unclean to you.
translation:
  language: fr
  text: Quant au porc, parce qu’il a le sabot fendu, complètement divisé, mais qu’il ne rumine pas, il est impur pour vous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֲזִיר
  choice: le porc
  rationale: « Porc » est le terme courant et digne en français moderne pour désigner l’animal en tant qu’espèce.
- source_word: כִּי
  choice: bien que
  rationale: Dans la logique des critères énoncés au verset 3, la proposition introduit ici le trait que le porc possède, opposé au critère qu’il ne remplit pas. « Bien que » rend naturellement cette valeur concessive contextuelle.
- source_word: מַפְרִיס פַּרְסָה ... וְשֹׁסַע שֶׁסַע פַּרְסָה
  choice: ait le sabot divisé, fendu en deux
  rationale: 'La formulation conserve les deux expressions hébraïques étroitement liées : la division du sabot et la précision qu’il est entièrement fendu.'
- source_word: גֵּרָה לֹא יִגָּר
  choice: il ne rumine pas
  rationale: « Ruminer » est l’expression française usuelle qui rend clairement l’idiome hébreu signifiant littéralement faire remonter la nourriture ruminée.
- source_word: טָמֵא הוּא לָכֶם
  choice: il est impur pour vous
  rationale: « Impur » exprime la catégorie rituelle et alimentaire du contexte lévitique sans lui attribuer en soi une faute morale; « pour vous » maintient le rapport aux destinataires.
theological_decisions:
- issue: Portée de טָמֵא dans la législation alimentaire
  choice: impur au sens rituel et alimentaire
  alternative: souillé ou moralement mauvais
  rationale: Dans Lévitique 11, le terme classe les animaux par rapport aux prescriptions données à Israël. La traduction ne doit pas transformer cette classification rituelle en jugement moral sur l’animal.
translation_notes:
  register: Français international moderne, naturel et digne. La structure concessive explicite le contraste contextuel entre le critère satisfait et celui qui ne l’est pas, tandis que la double description du sabot reste perceptible.
