id: LEV.11.23
reference: Leviticus 11:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כֹל֙ שֶׁ֣רֶץ הָ/ע֔וֹף אֲשֶׁר ל֖/וֹ אַרְבַּ֣ע רַגְלָ֑יִם שֶׁ֥קֶץ ה֖וּא לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/023.yaml
  text: But every winged swarming thing that has four feet is detestable to you[a][b].
translation:
  language: fr
  text: Mais toute créature grouillante ailée[a] qui a quatre pattes[b] vous est répugnante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « petite bête qui vole ». L’expression hébraïque désigne largement les créatures volantes qui pullulent, surtout les insectes.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « quatre pieds » ; en français, on parle habituellement des « pattes » d’un insecte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: Mais toute
  rationale: 'La conjonction וְ peut signifier « et », mais le contexte marque ici un contraste avec l’exception énoncée au verset précédent. כֹל a une valeur distributive : « toute ».'
- source_word: שֶׁרֶץ הָעֹוף
  choice: créature grouillante ailée
  rationale: L’expression désigne largement les petites créatures volantes qui pullulent, en particulier les insectes. Cette formulation conserve la catégorie hébraïque sans la réduire explicitement au terme zoologique « insecte ».
- source_word: אֲשֶׁר לוֹ
  choice: qui a
  rationale: Rendu français direct et naturel de la construction relative hébraïque.
- source_word: אַרְבַּע רַגְלָיִם
  choice: quatre pattes
  rationale: רַגְלַיִם peut désigner les pieds ou les pattes. Pour des créatures ailées de ce type, « pattes » est le terme français courant tout en restant fidèle à l’image du texte.
- source_word: שֶׁקֶץ הוּא לָכֶם
  choice: vous est répugnante
  rationale: La proposition nominale affirme que cette créature est, pour les destinataires, répugnante ou détestable. Le présent conserve la forme déclarative du texte et évite d’assimiler sans nuance שֶׁקֶץ à un simple terme technique d’impureté.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Créature grouillante ailée » maintient la catégorie générale de l’hébreu, tandis que « vous est répugnante » exprime naturellement la qualification alimentaire et rituelle sans ajouter de précision doctrinale.
