source:
  edition: WLC
  text: אַל תְּשַׁקְּצוּ֙ אֶת נַפְשֹׁ֣תֵי/כֶ֔ם בְּ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֑ץ וְ/לֹ֤א תִֽטַּמְּאוּ֙ בָּ/הֶ֔ם וְ/נִטְמֵתֶ֖ם בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/043.yaml
  text: Do not make yourselves detestable by any swarming thing that swarms[a], and do not make yourselves unclean by them, so that you do not become unclean by them.
translation:
  language: fr
  text: Ne vous rendez pas abominables par aucune créature qui grouille[a]. Ne vous rendez pas impurs par elles, et vous deviendrez impurs par elles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par aucune créature rampante ». L’hébreu désigne la vaste catégorie des créatures qui grouillent ou pullulent; il ne s’agit pas seulement de celles qui rampent.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁקְּצוּ
  choice: vous rendez pas détestables
  rationale: Le verbe שׁקץ exprime le fait de rendre détestable ou répugnant. La tournure réflexive française rend l’objet נַפְשֹׁתֵיכֶם sans confondre ce terme avec le vocabulaire de l’impureté qui suit.
- source_word: נַפְשֹׁתֵיכֶם
  choice: vous
  rationale: Dans cette construction, נֶפֶשׁ désigne la personne elle-même plutôt qu’une âme envisagée séparément; « vous » est donc l’équivalent idiomatique.
- source_word: בְּכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: par toutes ces petites bêtes qui pullulent
  rationale: שׁרץ désigne largement de petites créatures qui grouillent ou pullulent. « Petites bêtes qui pullulent » conserve la catégorie générale et fait écho au verbe hébreu sans suggérer uniquement le déplacement en rampant.
- source_word: תִטַּמְּאוּ
  choice: vous rendez pas impurs
  rationale: La forme réflexive indique que les destinataires se rendraient impurs par ces créatures. « Impurs » convient au cadre rituel du Lévitique et se distingue de « détestables ».
- source_word: בָּהֶם / בָּם
  choice: par elles
  rationale: La préposition indique ici le moyen par lequel l’impureté est contractée; la répétition française préserve l’insistance du texte hébreu.
- source_word: וְנִטְמֵתֶם
  choice: de peur de devenir impurs
  rationale: Après les interdictions, la coordination introduit naturellement en français le résultat redouté. Cette formulation conserve la valeur d’avertissement sans transformer l’impureté en culpabilité morale.
theological_decisions:
- issue: Terminologie de l’impureté dans la législation de sainteté
  choice: impurs
  alternative: souillés
  rationale: טמא renvoie ici à l’impureté dans les catégories rituelles et communautaires du Lévitique. « Impurs » est précis et courant; « souillés » risquerait d’accentuer indûment une faute morale.
- issue: Valeur de וְנִטְמֵתֶם après les interdictions
  choice: de peur de devenir impurs
  alternative: et vous deviendrez impurs
  rationale: Le contexte permet de comprendre la dernière proposition comme le résultat à éviter. « De peur de » exprime cette relation tout en laissant intacte la gravité effective de l’impureté encourue.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « impurs par elles » est maintenue pour refléter l’insistance hébraïque. « Petites bêtes » est naturel en français et, associé à « pullulent », conserve l’étendue de la catégorie zoologique.
