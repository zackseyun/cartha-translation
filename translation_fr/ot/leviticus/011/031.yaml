reference: Leviticus 11:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֵ֛לֶּה הַ/טְּמֵאִ֥ים לָ/כֶ֖ם בְּ/כָל הַ/שָּׁ֑רֶץ כָּל הַ/נֹּגֵ֧עַ בָּ/הֶ֛ם בְּ/מֹתָ֖/ם יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/031.yaml
  text: These are unclean for you among all the swarming things[b][a]. Everyone who touches them when they are dead shall be unclean until the evening.
translation:
  language: fr
  text: Ce sont là, parmi toutes les créatures qui grouillent, celles qui sont impures pour vous.[a] Quiconque les touche quand elles sont mortes[b] sera impur jusqu’au soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi toutes les créatures grouillantes ». Le terme hébreu désigne largement des créatures qui grouillent ou pullulent.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans leur mort » ; il s’agit de les toucher alors qu’elles sont mortes.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: celles-ci
  rationale: Le démonstratif pluriel renvoie aux animaux qui viennent d’être énumérés; « celles-ci » assure une reprise naturelle en français.
- source_word: הַטְּמֵאִים לָכֶם
  choice: sont impures pour vous
  rationale: Le prédicat désigne leur statut d’impureté rituelle à l’égard d’Israël. « Impures » est clair et usuel dans le contexte lévitique, tandis que « pour vous » conserve la relation exprimée par le datif.
- source_word: בְּכָל הַשָּׁרֶץ
  choice: parmi toutes les petites bêtes qui grouillent
  rationale: שֶׁרֶץ désigne largement de petites créatures qui grouillent ou pullulent. Cette formulation française reste concrète sans imposer une classification zoologique plus précise que l’hébreu.
- source_word: כָּל הַנֹּגֵעַ
  choice: Quiconque les touche
  rationale: La construction a une portée distributive et générale; « quiconque » restitue avec concision cette valeur juridique.
- source_word: בְּמֹתָם
  choice: quand elles sont mortes
  rationale: L’expression vise le contact avec ces bêtes à l’état mort, et non seulement l’instant où elles meurent.
- source_word: יִטְמָא
  choice: sera impur
  rationale: L’imparfait hébreu exprime ici le statut rituel résultant du contact; le futur convient au registre normatif du passage.
- source_word: עַד הָעָרֶב
  choice: jusqu’au soir
  rationale: Cette expression française naturelle rend exactement la limite temporelle de l’impureté.
theological_decisions: []
