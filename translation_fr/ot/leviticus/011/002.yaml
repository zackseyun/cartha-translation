source:
  edition: WLC
  text: דַּבְּר֛וּ אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֹ֤את הַֽ/חַיָּה֙ אֲשֶׁ֣ר תֹּאכְל֔וּ מִ/כָּל הַ/בְּהֵמָ֖ה אֲשֶׁ֥ר עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/002.yaml
  text: Speak to the sons of Israel[a], saying[c][b], ‘These are the living creatures that you may eat from among all the animals that are on the earth.’
translation:
  language: fr
  text: 'Parlez aux Israélites[a] et dites : « Voici les animaux[b] que vous pouvez manger parmi tous les animaux qui sont sur la terre[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils d’Israël » ; on peut aussi traduire : « aux enfants d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, l’hébreu emploie le singulier : « Voici l’animal ». Ce singulier a ici un sens collectif et introduit les catégories énumérées ensuite.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « qui sont sur la terre ferme ». L’expression distingue les animaux terrestres des autres catégories traitées dans ce chapitre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: Parlez
  rationale: L’impératif est au pluriel et s’adresse, dans le contexte, à Moïse et Aaron. « Parlez » conserve directement cette forme.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aux Israélites
  rationale: L’expression signifie littéralement « aux fils d’Israël », mais « aux Israélites » exprime naturellement en français moderne l’ensemble du peuple sans modifier le référent collectif.
- source_word: לֵאמֹר
  choice: et dites
  rationale: Cet infinitif introduit les paroles rapportées. La coordination « et dites » est plus naturelle en français actuel que le calque « en disant ».
- source_word: זֹאת הַחַיָּה
  choice: Voici les êtres vivants
  rationale: Le démonstratif et le nom sont formellement au singulier, mais le syntagme a ici une valeur collective et classificatoire, développée par la liste qui suit. Le pluriel français rend clairement cette portée tout en la signalant en note.
- source_word: אֲשֶׁר תֹּאכְלוּ
  choice: que vous pouvez manger
  rationale: Dans ce contexte juridique, l’imparfait hébreu exprime ce dont la consommation est permise, plutôt qu’une simple prédiction.
- source_word: מִכָּל
  choice: parmi tous
  rationale: La préposition marque une sélection à l’intérieur de l’ensemble des animaux.
- source_word: הַבְּהֵמָה
  choice: les animaux
  rationale: Ici, le terme désigne largement les animaux terrestres. « Animaux » est clair et n’impose pas le sens plus étroit de « bétail ».
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: qui sont sur la terre
  rationale: La proposition situe cette catégorie sur la terre ferme, par contraste avec les créatures aquatiques abordées ensuite.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure « et dites » évite un calque hébraïque pesant, tandis que « Voici les êtres vivants » restitue naturellement la valeur collective du singulier hébreu sans dissimuler sa forme grammaticale, précisée en note.
