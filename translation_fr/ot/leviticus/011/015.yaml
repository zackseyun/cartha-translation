lexical_decisions:
- source_word: אֵת
  choice: '[non traduit séparément]'
  rationale: Cette particule marque le complément d’objet direct et n’a normalement pas d’équivalent autonome en français.
- source_word: כָּל
  choice: tous les
  rationale: Avec un nom collectif dans cette liste, כָּל exprime l’ensemble des représentants de la catégorie; « tous les corbeaux » est naturel en français.
- source_word: עֹרֵב
  choice: corbeaux
  rationale: Le terme désigne ordinairement le corbeau, mais peut ici couvrir plus largement les oiseaux de la famille des corvidés; le sens standard est conservé dans le texte.
- source_word: לְמִינוֹ
  choice: selon leur espèce
  rationale: Cette formule classificatoire fréquente dans les textes sacerdotaux est rendue clairement sans lui imposer la précision de la taxonomie moderne. Le possessif pluriel s’accorde naturellement avec « tous les corbeaux ».
