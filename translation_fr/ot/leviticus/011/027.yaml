  text: וְ/כֹ֣ל הוֹלֵ֣ךְ עַל כַּפָּ֗י/ו בְּ/כָל הַֽ/חַיָּה֙ הַ/הֹלֶ֣כֶת עַל אַרְבַּ֔ע טְמֵאִ֥ים הֵ֖ם לָ/כֶ֑ם כָּל הַ/נֹּגֵ֥עַ בְּ/נִבְלָתָ֖/ם יִטְמָ֥א עַד הָ/עָֽרֶב׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/027.yaml
  text: And every one that walks on its paws, among all the animals that walk on four feet, they are unclean to you. Everyone who touches their carcass shall be unclean until the evening.
translation:
  language: fr
  text: Tout animal qui marche sur ses pattes, parmi tous les animaux qui marchent à quatre pattes, est impur pour vous. Quiconque touchera leur cadavre[a] sera impur jusqu’au soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie un nom au singulier, « cadavre », avec un suffixe pluriel ; l’expression a un sens collectif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל הוֹלֵךְ
  choice: Tous les animaux qui marchent
  rationale: Le singulier distributif hébreu désigne ici une catégorie d’animaux. Le pluriel français s’accorde naturellement avec le prédicat pluriel טְמֵאִים הֵם.
- source_word: עַל כַּפָּיו
  choice: sur la plante de leurs pattes
  rationale: כַּף désigne la paume ou la surface inférieure d’un membre. Dans ce contexte animal, cette formulation conserve la précision anatomique mieux que le simple « sur leurs pattes ».
- source_word: בְּכָל הַחַיָּה הַהֹלֶכֶת עַל אַרְבַּע
  choice: parmi ceux qui marchent à quatre pattes
  rationale: חַיָּה renvoie ici aux animaux terrestres; le pronom « ceux » évite une répétition lourde tout en gardant la portée collective de l’hébreu.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: sont impurs pour vous
  rationale: « Impurs » exprime le statut rituel réglementé dans le Lévitique, sans suggérer en premier lieu une faute morale.
- source_word: כָּל הַנֹּגֵעַ
  choice: Quiconque touchera
  rationale: Cette tournure rend la portée distributive et juridique de la formule hébraïque.
- source_word: בְּנִבְלָתָם
  choice: leur cadavre
  rationale: נְבֵלָה désigne le corps mort d’un animal. Le singulier hébreu accompagné d’un suffixe pluriel a ici une valeur collective.
- source_word: יִטְמָא עַד הָעָרֶב
  choice: sera impur jusqu’au soir
  rationale: Le futur français convient à la prescription juridique et conserve la terminologie du statut rituel.
theological_decisions:
- issue: Terminologie de la pureté rituelle
  choice: impur
  alternative: souillé
  rationale: Le verset concerne un statut rituel temporaire, non une culpabilité morale. « Impur » est précis et usuel en français biblique moderne.
translation_notes:
  register: Français moderne, digne et juridique. La répétition relative aux pattes est conservée parce qu’elle appartient à la classification du texte hébreu; le pluriel rend naturellement l’alternance hébraïque entre le singulier distributif et le prédicat pluriel.
