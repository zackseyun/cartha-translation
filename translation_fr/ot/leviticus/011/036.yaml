  yaml_path: translation/ot/leviticus/011/036.yaml
  text: However[a], a spring or a cistern collecting water shall remain clean, but whoever touches their carcass shall be unclean.
translation:
  language: fr
  text: Toutefois, une source ou une citerne contenant une réserve d’eau[a] sera pure ; mais celui qui touchera leur carcasse sera impur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un rassemblement d’eaux ». L’expression hébraïque מִקְוֵה מַיִם désigne une eau réunie, une réserve d’eau ou un bassin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Toutefois
  rationale: Introduit l’exception à la règle d’impureté énoncée juste avant, sans donner au terme une valeur excessivement restrictive.
- source_word: מַעְיָן
  choice: source
  rationale: Désigne une source naturelle d’eau ; « source » est le terme français courant et précis.
- source_word: בּוֹר
  choice: citerne
  rationale: Dans ce contexte, désigne un réservoir creusé ou construit pour recueillir l’eau ; « citerne » est plus précis que « fosse » ou « puits ».
- source_word: מִקְוֵה מַיִם
  choice: où l’eau s’accumule
  rationale: Rend naturellement en français l’idée d’une masse ou réserve d’eau rassemblée, tout en laissant la note signaler la formulation plus littérale.
- source_word: יִהְיֶה טָהוֹר
  choice: restera pure
  rationale: Le contexte indique que la source ou la citerne n’est pas rendue impure par le contact évoqué au verset précédent ; « restera » explicite cette continuité implicite.
- source_word: נֹגֵעַ
  choice: celui qui touchera
  rationale: Le participe est employé comme substantif générique et désigne toute personne qui entre en contact avec la carcasse.
- source_word: נִבְלָתָם
  choice: leur carcasse
  rationale: נְבֵלָה désigne le corps mort d’un animal. Le singulier français conserve ici la valeur collective de la forme hébraïque avec suffixe pluriel.
- source_word: יִטְמָא
  choice: sera impur
  rationale: Formulation française naturelle correspondant au vocabulaire rituel de pureté dans le Lévitique.
theological_decisions:
- issue: Terminologie de la pureté rituelle
  choice: pure / impur
  alternative: propre / souillé
  rationale: « Pur / impur » est en français la terminologie claire et habituelle des prescriptions rituelles du Lévitique, sans transformer cette catégorie cultuelle en jugement moral.
- issue: Continuité de l’état de pureté de l’eau
  choice: restera pure
  alternative: sera pure
  rationale: Le contexte immédiat présente ce cas comme une exception à la contamination décrite au verset précédent. « Restera » exprime cette implication contextuelle sans ajouter de nouvelle règle.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le contraste juridique du texte hébreu et emploie le vocabulaire rituel traditionnel « pur / impur ».
