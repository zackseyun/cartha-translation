source:
  edition: WLC
  text: וְ/אֶת אֵ֨לֶּה֙ תְּשַׁקְּצ֣וּ מִן הָ/ע֔וֹף לֹ֥א יֵאָכְל֖וּ שֶׁ֣קֶץ הֵ֑ם אֶת הַ/נֶּ֨שֶׁר֙ וְ/אֶת הַ/פֶּ֔רֶס וְ/אֵ֖ת הָ/עָזְנִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/013.yaml
  text: 'And these from among the birds you shall regard as detestable[a]; they shall not be eaten; they are detestable: the eagle, the vulture[c][b], and the black vulture.'
translation:
  language: fr
  text: 'Parmi les oiseaux, voici ceux que vous considérerez comme détestables : ils ne doivent pas être mangés ; ils sont détestables : l’aigle[a], le gypaète barbu[b] et le vautour noir[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les noms d’oiseaux de cette liste ne peuvent pas toujours être identifiés avec certitude. Le mot traduit par « aigle » peut désigner plus largement un grand rapace, voire un vautour.
    reason: lexical_alternative
  - marker: b
    text: Identification incertaine. On peut aussi traduire par « vautour barbu » ; des traductions anciennes emploient « orfraie ».
    reason: lexical_alternative
  - marker: c
    text: Identification incertaine. Des traductions anciennes proposent « balbuzard » ; certains spécialistes pensent à une espèce d’aigle ou de vautour.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁקְּצוּ
  choice: vous considérerez comme détestables
  rationale: Le piel de שׁקץ exprime le fait de tenir quelque chose pour répugnant ou prohibé dans le cadre alimentaire cultuel, plutôt qu’un simple sentiment de dégoût.
- source_word: מִן הָעוֹף
  choice: parmi les oiseaux
  rationale: La préposition מִן a ici une valeur partitive, et עוֹף désigne naturellement les oiseaux dans cette liste alimentaire.
- source_word: לֹא יֵאָכְלוּ
  choice: on ne les mangera pas
  rationale: Cette tournure française rend naturellement la forme passive et la valeur prescriptive de l’imparfait hébreu.
- source_word: שֶׁקֶץ
  choice: détestables
  rationale: Le terme désigne ce qui est tenu pour répugnant ou tabou dans les prescriptions alimentaires; « détestables » conserve cette force sans le réduire à la seule impureté.
- source_word: הַנֶּשֶׁר
  choice: l’aigle
  rationale: « Aigle » est l’équivalent traditionnel et plausible, bien que le nom hébreu puisse désigner plus largement un grand rapace, notamment un vautour.
- source_word: הַפֶּרֶס
  choice: le gypaète barbu
  rationale: פֶּרֶס est souvent identifié au gypaète barbu, rapace également appelé vautour barbu; l’identification zoologique demeure toutefois incertaine.
- source_word: הָעָזְנִיָּה
  choice: le vautour noir
  rationale: Cette identification moderne est plausible dans le contexte des grands rapaces charognards, mais le nom hébreu n’est pas déterminable avec certitude.
theological_decisions:
- issue: Portée de « détestables » dans la loi alimentaire
  choice: Conserver le vocabulaire évaluatif de שׁקץ
  alternative: Traduire par « impurs »
  rationale: Le texte emploie שׁקץ et non le terme habituel pour « impur »; la traduction évite donc de confondre deux catégories lexicales tout en gardant la portée cultuelle du contexte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le caractère prescriptif et la répétition emphatique de « détestables ». Les termes zoologiques sont lisibles, tandis que les notes signalent explicitement les incertitudes d’identification.
