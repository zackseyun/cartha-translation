id: LEV.11.6
reference: Leviticus 11:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶת הָ/אַרְנֶ֗בֶת כִּֽי מַעֲלַ֤ת גֵּרָה֙ הִ֔וא וּ/פַרְסָ֖ה לֹ֣א הִפְרִ֑יסָה טְמֵאָ֥ה הִ֖וא לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/006.yaml
  text: And the hare[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: fr
  text: Et le lièvre[a], parce qu’il rumine mais n’a pas le sabot fendu, est impur pour vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lapin ». Le mot hébreu אַרְנֶבֶת est traditionnellement compris comme désignant le lièvre, mais certains lui donnent un sens plus large.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְנֶבֶת
  choice: le lièvre
  rationale: Le terme hébreu אַרְנֶבֶת désigne traditionnellement le lièvre dans les listes bibliques d’animaux. « Lapin » reste une possibilité, mais « lièvre » est l’identification zoologique la plus établie.
- source_word: כִּי
  choice: parce que
  rationale: כִּי introduit ici la raison du classement de l’animal; « parce que » rend clairement cette valeur causale en français moderne.
- source_word: מַעֲלַת גֵּרָה
  choice: il rumine
  rationale: L’expression signifie littéralement « faire remonter la nourriture ». « Ruminer » est l’équivalent français naturel et traditionnel du critère formulé dans la législation alimentaire, sans ajouter d’explication zoologique au texte.
- source_word: וּפַרְסָה לֹא הִפְרִיסָה
  choice: mais n’a pas le sabot fendu
  rationale: La conjonction est rendue par « mais » pour exprimer naturellement le contraste entre les deux critères. « Avoir le sabot fendu » est une formulation française claire et idiomatique qui reste proche de l’hébreu.
- source_word: טְמֵאָה הִוא לָכֶם
  choice: est impur pour vous
  rationale: Dans ce contexte, טָמֵא relève de la classification rituelle des aliments. « Impur pour vous » conserve à la fois le terme biblique et la portée adressée à la communauté, sans paraphrase excessive.
theological_decisions:
- issue: Nature de l’impureté dans la législation alimentaire du Lévitique
  choice: impur dans le cadre rituel
  alternative: moralement mauvais ou souillé
  rationale: Le verset classe l’animal selon les règles alimentaires données à Israël; il ne lui attribue pas une faute ou une qualité morale. Le texte garde néanmoins le terme biblique général « impur » plutôt que d’expliciter cette interprétation dans le corps du verset.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de la structure causale et contrastive de l’hébreu tout en étant naturelle en français.
