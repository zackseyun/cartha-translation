revisions:
- from: Tout animal qui se déplace sur le ventre[a], tout animal qui se déplace à quatre pattes, jusqu’à tout animal qui a de nombreuses pattes, parmi toutes les petites bêtes qui pullulent sur la terre, vous n’en mangerez pas, car elles sont répugnantes[b].
  to: Tout animal qui se déplace sur le ventre[a], tout animal qui se déplace à quatre pattes, même tout animal ayant de nombreuses pattes, parmi toutes les petites créatures qui grouillent sur la terre, vous n’en mangerez pas, car ils sont détestables[b].
  rationale: La révision remplace une expression française ambiguë et peu idiomatique par une coordination inclusive, rapproche le rendu de שֶׁרֶץ הַשֹּׁרֵץ de son sens de créatures grouillantes, et emploie « détestables » pour שֶׁקֶץ. Les notes sont conservées avec des ancres valides.
