language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּל֩ הוֹלֵ֨ךְ עַל גָּח֜ וְ/כֹ֣ל הוֹלֵ֣ךְ עַל אַרְבַּ֗ע עַ֚ד כָּל מַרְבֵּ֣ה רַגְלַ֔יִם לְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ לֹ֥א תֹאכְל֖וּ/ם כִּי שֶׁ֥קֶץ הֵֽם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/042.yaml
  text: Anything that goes on its belly[a], and anything that goes on four feet, even every creature with many feet, among all the swarming things that swarm on the earth—you shall not eat them[c][b], for they are detestable.
translation:
  language: fr
  text: Tout animal qui se déplace sur le ventre[a], tout animal qui se déplace à quatre pattes, même tout animal ayant de nombreuses pattes, parmi toutes les petites créatures qui grouillent sur la terre, vous n’en mangerez pas, car ils sont détestables[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui rampe sur le ventre ».
    reason: lexical_alternative
  - marker: b
    text: Ou « une abomination ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: tout animal
  rationale: Le terme est distributif et introduit plusieurs catégories. L’ajout contextuel d’« animal » évite en français le tour lourd « tout ce qui » sans restreindre le référent.
- source_word: הוֹלֵךְ עַל גָּח
  choice: qui se déplace sur le ventre
  rationale: Cette formulation garde le mode de locomotion exprimé par l’hébreu sans imposer le verbe plus interprétatif « ramper ».
- source_word: הוֹלֵךְ עַל אַרְבַּע
  choice: qui se déplace à quatre pattes
  rationale: Expression française naturelle qui restitue concrètement le déplacement sur quatre membres.
- source_word: עַד כָּל מַרְבֵּה רַגְלַיִם
  choice: jusqu’à tout animal qui a de nombreuses pattes
  rationale: « Jusqu’à » conserve la valeur extensive possible de עַד, qui élargit l’énumération aux animaux pourvus de nombreuses pattes.
- source_word: לְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: parmi toutes les petites bêtes qui pullulent
  rationale: « Petites bêtes » rend de manière accessible la classe désignée par שֶׁרֶץ, tandis que « pullulent » préserve autant que possible la répétition étymologique du nom et du participe hébreux.
- source_word: עַל הָאָרֶץ
  choice: sur la terre
  rationale: Traduction directe qui peut désigner ici la surface terrestre, sans réduire explicitement le sens au seul sol.
- source_word: לֹא תֹאכְלֻם
  choice: vous n’en mangerez pas
  rationale: Le futur à valeur prescriptive convient au registre juridique français et le pronom « en » reprend naturellement les catégories énumérées.
- source_word: שֶׁקֶץ
  choice: répugnantes
  rationale: Le terme exprime ici le caractère détestable et prohibé de ces animaux dans le cadre alimentaire; « répugnantes » conserve cette force sans ajouter une qualification doctrinale.
theological_decisions:
- issue: Nature de l’interdiction dans la législation de pureté
  choice: Formuler directement l’interdiction alimentaire dans son contexte lévitique, sans commentaire sur sa permanence.
  alternative: La présenter soit comme une règle morale intemporelle, soit comme un simple tabou culturel.
  rationale: Le texte hébreu énonce une prohibition alimentaire, mais ne tranche pas à lui seul les débats canoniques ou doctrinaux ultérieurs sur son applicabilité.
- issue: Portée de שֶׁקֶץ
  choice: « répugnantes »
  alternative: « une abomination »
  rationale: Le choix retenu exprime fortement l’aversion rituelle et alimentaire du contexte sans importer toutes les connotations théologiques que peut prendre « abomination » ailleurs.
translation_notes:
  register: Français international moderne, clair et digne. Le futur prescriptif maintient le ton juridique. La répétition hébraïque שֶׁרֶץ הַשֹּׁרֵץ est partiellement reflétée par « petites bêtes qui pullulent », sans produire une tournure artificielle.
