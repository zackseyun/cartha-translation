source:
  edition: WLC
  text: וְ/שֶׁ֖קֶץ יִהְי֣וּ לָ/כֶ֑ם מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וְ/אֶת נִבְלָתָ֖/ם תְּשַׁקֵּֽצוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/011.yaml
  text: And they shall be detestable to you; you shall not eat any of their flesh[a], and you shall regard their carcasses as detestable.
translation:
  language: fr
  text: Et ils seront détestables pour vous[a] ; vous ne mangerez pas de leur chair et vous tiendrez leurs cadavres pour détestables.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une chose abominable » ; le terme hébreu désigne ici quelque chose de rituellement répugnant ou détestable dans le cadre des prescriptions alimentaires.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶץ
  choice: détestables
  rationale: Le nom désigne ici ce qui doit inspirer une forte répulsion dans le cadre rituel des prescriptions alimentaires. La tournure adjectivale est naturelle en français et évite de confondre ce terme avec le vocabulaire hébreu ordinaire de l’impureté.
- source_word: יִהְיוּ לָכֶם
  choice: ils seront détestables pour vous
  rationale: La formulation conserve le datif לָכֶם, qui exprime la manière dont les Israélites doivent considérer ces animaux.
- source_word: מִבְּשָׂרָם
  choice: rien de leur chair
  rationale: 'Après le verbe négatif « manger », la préposition מִן a une valeur partitive : aucune portion de leur chair ne doit être mangée.'
- source_word: לֹא תֹאכֵלוּ
  choice: vous ne mangerez pas
  rationale: Le futur français convient à la formulation prescriptive d’un texte légal et demeure clair dans ce contexte.
- source_word: נִבְלָתָם
  choice: leurs cadavres
  rationale: נְבֵלָה désigne le corps mort d’un animal. « Cadavres » est précis et idiomatique dans ce contexte.
- source_word: תְּשַׁקֵּצוּ
  choice: vous tiendrez … pour détestables
  rationale: Le verbe intensif, apparenté à שֶׁקֶץ, demande de considérer ou traiter ces cadavres comme détestables. Cette traduction reprend le même vocabulaire sans réduire l’expression à un simple sentiment de dégoût.
theological_decisions:
- issue: Nature du langage employé dans la législation alimentaire
  choice: Employer « détestables » dans son sens rituel et normatif
  alternative: Employer « abominables » ou « impurs »
  rationale: Le passage établit une distinction alimentaire propre à l’alliance. « Détestables » conserve la forte appréciation négative du texte sans l’assimiler au terme technique habituellement rendu par « impur » ni lui imposer une catégorie morale plus large.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « détestables » reproduit le lien lexical entre le nom שֶׁקֶץ et le verbe תְּשַׁקֵּצוּ. Le point-virgule maintient l’enchaînement serré des trois propositions hébraïques.
