base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/019.yaml
  text: and the stork[a], the heron according to its kind, and the hoopoe[c][b], and the bat.
translation:
  language: fr
  text: la cigogne, le héron selon son espèce[a], la huppe[b] et la chauve-souris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification exacte du terme hébreu est incertaine ; il pourrait désigner un ibis ou un autre échassier.
    reason: lexical_alternative
  - marker: b
    text: 'Traduction traditionnelle : « vanneau » ; le terme hébreu désigne plus probablement la huppe.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲסִידָה
  choice: cigogne
  rationale: Identification traditionnelle et largement admise; « cigogne » est le nom français courant et convient à cette liste d’animaux.
- source_word: אֲנָפָה
  choice: héron
  rationale: L’identification zoologique exacte reste incertaine, mais « héron » est une équivalence traditionnelle, plausible dans ce contexte et immédiatement compréhensible.
- source_word: לְמִינָהּ
  choice: selon ses espèces
  rationale: La formule classe avec le héron les variétés apparentées. Le pluriel français exprime naturellement cette portée collective, même si le nom hébreu מִין est au singulier.
- source_word: דּוּכִיפַת
  choice: huppe
  rationale: Les données lexicales et zoologiques modernes favorisent la huppe plutôt que le vanneau des traductions anciennes.
- source_word: עֲטַלֵּף
  choice: chauve-souris
  rationale: L’identification est sûre. La liste suit les catégories d’observation du monde ancien et inclut donc la chauve-souris parmi les créatures volantes.
- source_word: וְאֵת / וְאֶת
  choice: virgules, puis « et » devant le dernier élément
  rationale: Le français naturel n’a pas d’équivalent du marqueur d’objet direct אֵת et n’exige pas la répétition de « et » à chaque élément de la liste.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe de liste reste fluide tout en conservant la formule classificatoire hébraïque. Le verset étant la continuation d’une phrase commencée auparavant, il débute par une minuscule.
