source:
  edition: WLC
  text: מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וּ/בְ/נִבְלָתָ֖/ם לֹ֣א תִגָּ֑עוּ טְמֵאִ֥ים הֵ֖ם לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/008.yaml
  text: You shall not eat any of their flesh[a], and you shall not touch their carcasses; they are unclean to you.
translation:
  language: fr
  text: 'Vous ne mangerez pas de leur chair et vous ne toucherez pas leurs cadavres : ils sont impurs pour vous.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבְּשָׂרָם
  choice: de leur chair
  rationale: 'La préposition מִן a ici une valeur partitive : aucune portion de leur chair ne doit être mangée. « Chair » conserve le sens corporel de בָּשָׂר sans le réduire à la viande considérée comme aliment.'
- source_word: לֹא תֹאכֵלוּ
  choice: vous ne mangerez pas
  rationale: Le futur français convient au style prescriptif de la législation biblique et exprime clairement l’interdiction.
- source_word: וּבְנִבְלָתָם
  choice: leurs cadavres
  rationale: נְבֵלָה désigne le corps mort d’un animal. « Cadavres » est clair en français et évite les sens secondaires de « carcasses ».
- source_word: לֹא תִגָּעוּ
  choice: vous ne toucherez pas
  rationale: Le verbe נגע signifie directement « toucher » ou « entrer en contact avec ». La formulation retenue reste concise et laisse le contexte préciser la portée rituelle.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: ils sont impurs pour vous
  rationale: « Impurs » exprime la catégorie rituelle de טָמֵא, tandis que « pour vous » conserve la relation marquée par לָכֶם sans ajouter d’interprétation.
theological_decisions:
- issue: Nature de l’impureté dans les prescriptions alimentaires du Lévitique
  choice: impurs
  alternative: souillés
  rationale: « Impurs » désigne naturellement une catégorie rituelle dans ce contexte. La traduction n’assimile pas cette impureté à une faute morale et ne tranche pas la question de l’application ultérieure de ces prescriptions.
translation_notes:
  register: Français international moderne, sobre et digne. Le futur négatif maintient la tonalité juridique du passage sans archaïsme marqué. La répétition de « vous ne » reproduit le parallélisme des deux interdictions.
