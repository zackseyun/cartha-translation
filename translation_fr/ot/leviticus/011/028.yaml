source:
  edition: WLC
  text: וְ/הַ/נֹּשֵׂא֙ אֶת נִבְלָתָ֔/ם יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֣א עַד הָ/עָ֑רֶב טְמֵאִ֥ים הֵ֖מָּה לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/028.yaml
  text: Whoever carries their carcass shall wash his clothes and be unclean until the evening[a]. They are unclean for you.
translation:
  language: fr
  text: Celui qui porte leur cadavre[a] lavera ses vêtements et sera impur jusqu’au soir. Ils sont impurs pour vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs cadavres ». L’hébreu peut se comprendre distributivement à propos des animaux concernés.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֹּשֵׂא
  choice: Celui qui transportera
  rationale: Le participe avec article a une valeur générique dans cette prescription. « Celui qui » conserve cette formulation juridique générale, et le futur exprime naturellement l’obligation en français.
- source_word: נִבְלָתָם
  choice: leur cadavre
  rationale: נְבֵלָה désigne ici le cadavre d’un animal. Le suffixe pluriel renvoie aux animaux mentionnés dans le contexte, tandis que le singulier peut se comprendre distributivement.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: lavera ses vêtements
  rationale: Dans ce texte législatif, l’inaccompli a une valeur prescriptive. Le futur français rend cette force avec dignité et naturel.
- source_word: וְטָמֵא
  choice: et sera impur
  rationale: La proposition indique l’état rituel qui résulte du contact. « Impur » maintient ici la terminologie technique sans suggérer nécessairement une faute morale.
- source_word: עַד הָעָרֶב
  choice: jusqu’au soir
  rationale: Cette tournure française naturelle correspond précisément à l’expression hébraïque avec article.
- source_word: טְמֵאִים הֵמָּה לָכֶם
  choice: Ils sont impurs pour vous
  rationale: La phrase récapitule le statut rituel des animaux concernés. « Pour vous » conserve la valeur de לָכֶם sans l’expliciter au-delà du texte.
theological_decisions:
- issue: Terminologie de l’impureté rituelle
  choice: impur
  alternative: souillé
  rationale: Dans la législation du Lévitique, טמא désigne une catégorie rituelle. « Impur » est le terme français courant et technique qui évite d’introduire une culpabilité morale absente du passage.
translation_notes:
  register: Français international moderne, clair et digne. Le futur simple garde la portée prescriptive du style juridique. Le terme « impur » est employé de manière cohérente pour la catégorie rituelle lévitique.
