source:
  edition: WLC
  text: וְ/כָל כְּלִי חֶ֔רֶשׂ אֲשֶׁר יִפֹּ֥ל מֵ/הֶ֖ם אֶל תּוֹכ֑/וֹ כֹּ֣ל אֲשֶׁ֧ר בְּ/תוֹכ֛/וֹ יִטְמָ֖א וְ/אֹת֥/וֹ תִשְׁבֹּֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/033.yaml
  text: And every earthenware vessel into which any of them falls—everything that is in it shall become unclean[a], and you shall break it.
translation:
  language: fr
  text: 'Tout récipient en terre cuite dans lequel tombera l’un d’eux : tout ce qui s’y trouve deviendra impur, et vous briserez le récipient.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּלִי חֶרֶשׂ
  choice: récipient en terre cuite
  rationale: כְּלִי désigne ici un objet servant de contenant, et חֶרֶשׂ précise qu’il est fait de terre cuite. « Récipient en terre cuite » est naturel en français moderne et conserve la précision matérielle pertinente pour la règle rituelle.
- source_word: יִפֹּל מֵהֶם
  choice: tombera l’un d’eux
  rationale: Le pronom pluriel renvoie aux animaux mentionnés dans le contexte précédent. « L’un d’eux » rend simplement la valeur distributive de l’hébreu sans préciser davantage que le texte.
- source_word: אֶל תּוֹכוֹ
  choice: dans lequel
  rationale: תּוֹךְ désigne l’intérieur. Dans ce contexte, « dans lequel » exprime naturellement le mouvement vers l’intérieur du récipient.
- source_word: כֹּל אֲשֶׁר בְּתוֹכוֹ
  choice: tout ce qui s’y trouve
  rationale: Cette formulation française idiomatique préserve la portée globale de כֹּל et désigne l’ensemble du contenu du récipient.
- source_word: יִטְמָא
  choice: deviendra impur
  rationale: Le verbe décrit l’état d’impureté rituelle résultant de la chute dans le récipient. « Impur » est le terme français courant dans le contexte des lois de pureté du Lévitique.
- source_word: וְאֹתוֹ תִשְׁבֹּרוּ
  choice: et vous briserez le récipient
  rationale: La reprise explicite de « récipient » évite en français toute ambiguïté sur l’antécédent du pronom hébreu emphatique אֹתוֹ. « Briserez » conserve la force de l’instruction sans surtraduire.
