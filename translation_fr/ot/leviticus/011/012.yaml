id: LEV.11.12
reference: Leviticus 11:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּ֣ל אֲשֶׁ֥ר אֵֽין ל֛/וֹ סְנַפִּ֥יר וְ/קַשְׂקֶ֖שֶׂת בַּ/מָּ֑יִם שֶׁ֥קֶץ ה֖וּא לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/012.yaml
  text: Everything in the water that does not have fins and scales is detestable to you[a].
translation:
  language: fr
  text: Tout ce qui, dans l’eau, n’a ni nageoires ni écailles est pour vous une chose répugnante[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une chose détestable » ou « une abomination ». Dans ce contexte de prescriptions alimentaires, le mot hébreu שֶׁקֶץ désigne ce qui est rituellement répugnant et doit être rejeté.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Tout ce qui
  rationale: Cette tournure française naturelle conserve la portée globale de כֹּל et introduit clairement la proposition relative marquée par אֲשֶׁר.
- source_word: אֵין לוֹ
  choice: n’a ni… ni…
  rationale: La construction existentielle négative exprime ici l’absence des deux caractéristiques requises. En français, « n’a ni nageoires ni écailles » rend cette relation de manière idiomatique.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: nageoires ni écailles
  rationale: Bien que les noms hébreux soient au singulier générique, le pluriel est naturel en français pour décrire les caractéristiques d’animaux aquatiques.
- source_word: בַּמָּיִם
  choice: dans l’eau
  rationale: מַיִם a une forme plurielle en hébreu, mais le singulier collectif « l’eau » est ici la formulation française courante.
- source_word: שֶׁקֶץ
  choice: une chose répugnante
  rationale: Dans ce contexte de prescriptions alimentaires, le terme désigne ce qui doit inspirer le rejet et être tenu pour rituellement inadmissible. Cette formulation conserve le prédicat nominal hébreu sans le confondre avec le vocabulaire distinct de l’impureté.
- source_word: הוּא לָכֶם
  choice: est pour vous
  rationale: Le pronom indépendant soutient la proposition nominale, rendue en français par la copule « est »; לָכֶם indique que cette qualification vaut pour les destinataires.
theological_decisions:
- issue: Terminologie du statut rituel exprimé par שֶׁקֶץ dans les lois alimentaires
  choice: une chose répugnante
  alternative: une abomination; une chose détestable; une chose impure
  rationale: « Une chose répugnante » garde la forte idée de rejet attachée à שֶׁקֶץ et la forme nominale de l’hébreu. « Impure » risquerait de confondre ce mot avec une autre famille de termes hébreux, tandis qu’« abomination » peut paraître plus archaïque ou évoquer en français d’autres contextes théologiques.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la portée générale du texte, son cadre aquatique et la force rituelle de שֶׁקֶץ, sans employer « impur », qui traduirait un terme différent.
