source:
  edition: WLC
  text: כִּ֣י אֲנִ֣י יְהוָ֗ה הַֽ/מַּעֲלֶ֤ה אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לִ/הְיֹ֥ת לָ/כֶ֖ם לֵ/אלֹהִ֑ים וִ/הְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָֽנִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/045.yaml
  text: For I am Yahweh[a], who brought you up from the land of Egypt to be your God. And you shall be holy[b], because I am holy.
translation:
  language: fr
  text: Car je suis Yahvé, celui qui vous a fait monter[a] du pays d’Égypte pour être votre Dieu. Et vous serez saints, car je suis saint.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui vous fait monter ». L’hébreu emploie un participe, bien que l’exode évoqué soit un événement passé.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Translittération française courante du nom divin, qui préserve son caractère de nom propre dans cette formule d’alliance.
- source_word: הַמַּעֲלֶה
  choice: celui qui vous a fait monter
  rationale: Le participe désigne littéralement « celui qui fait monter ». Le passé convient naturellement à l’événement accompli de l’exode, tandis que « fait monter » conserve l’image hébraïque de la montée hors d’Égypte.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: du pays d’Égypte
  rationale: Conserve le nom explicite « pays » et la formule traditionnelle liée à l’exode.
- source_word: לִהְיֹת לָכֶם לֵאלֹהִים
  choice: pour être votre Dieu
  rationale: Rend naturellement en français la formule relationnelle d’alliance, sans la réduire à une simple accession au statut de Dieu.
- source_word: וִהְיִיתֶם קְדֹשִׁים
  choice: Vous serez saints
  rationale: Préserve la forme verbale et sa force injonctive dans le contexte, avec un ton d’alliance plus direct que la paraphrase « vous devez donc être saints ».
- source_word: כִּי קָדוֹשׁ אָנִי
  choice: car je suis saint
  rationale: Le second כִּי donne le fondement de la sainteté demandée au peuple. « Car » exprime ce lien causal dans un registre digne et courant.
theological_decisions:
- issue: Fondement de la sainteté dans l’alliance
  choice: La sainteté demandée à Israël est fondée sur l’identité de Yahvé, son action lors de l’exode et sa relation avec le peuple comme son Dieu.
  alternative: Limiter l’énoncé à une prescription de pureté rituelle sans portée plus largement liée à l’alliance.
  rationale: Même si le contexte immédiat concerne les aliments purs et impurs, le verset rattache explicitement l’exigence à l’exode, à la relation « votre Dieu » et à la sainteté propre de Yahvé.
- issue: Valeur temporelle du participe הַמַּעֲלֶה
  choice: Le rendre au passé en référence à l’exode accompli.
  alternative: 'Employer le présent : « celui qui vous fait monter » ou « qui vous fait sortir ».'
  rationale: Le participe hébreu peut présenter Yahvé selon son action caractéristique, mais le contexte historique rend le passé plus naturel en français. La note conserve l’autre possibilité sans transformer le participe en accompli morphologique.
translation_notes:
  register: Français international moderne, clair et digne. « Celui qui » permet de rendre le participe défini sans la tournure grammaticalement lourde « moi qui vous ai fait monter ». Le futur « vous serez » conserve la solennité injonctive sans ajouter un connecteur logique absent du texte.
