  text: You may eat any animal that has a split hoof[a], completely divided[b], and that chews the cud.
translation:
  language: fr
  text: Parmi les animaux, vous pourrez manger tout animal dont le sabot est fendu et entièrement divisé[a], et qui rumine[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui fend le sabot et qui divise une division de sabots ». L’hébreu emploie deux expressions apparentées pour indiquer que le sabot doit être véritablement divisé.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « qui fait remonter le cud » ; c’est-à-dire qui rumine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: tout animal
  rationale: Le terme a ici une valeur distributive et introduit la catégorie des animaux permis. « Tout animal » est naturel dans une formulation juridique en français.
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: qui a le sabot fendu
  rationale: Cette expression décrit littéralement l’action de fendre le sabot. La formulation retenue exprime clairement et naturellement le caractère physique visé.
- source_word: וְשֹׁסַעַת שֶׁסַע פְּרָסֹת
  choice: entièrement divisé
  rationale: La seconde expression apparentée précise que le sabot doit présenter une séparation réelle et complète. Le participe s’accorde avec « sabot ».
- source_word: מַעֲלַת גֵּרָה
  choice: qui rumine
  rationale: L’expression hébraïque signifie littéralement « qui fait remonter la nourriture ruminée ». « Ruminer » est le terme français courant et précis pour ce comportement.
- source_word: בַּבְּהֵמָה
  choice: Parmi les animaux
  rationale: Dans ce contexte classificatoire, בְּהֵמָה désigne les animaux terrestres considérés par la loi alimentaire. « Animaux » évite de limiter indûment le sens au bétail domestique.
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: vous pourrez manger
  rationale: Dans cette loi alimentaire, l’imparfait hébreu exprime une autorisation plutôt qu’une obligation de consommer. Le futur de permission est naturel en français.
