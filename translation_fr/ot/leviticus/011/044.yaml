  text: כִּ֣י אֲנִ֣י יְהוָה֮ אֱלֹֽהֵי/כֶם֒ וְ/הִתְקַדִּשְׁתֶּם֙ וִ/הְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָ֑נִי וְ/לֹ֤א תְטַמְּאוּ֙ אֶת נַפְשֹׁ֣תֵי/כֶ֔ם בְּ/כָל הַ/שֶּׁ֖רֶץ הָ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/044.yaml
  text: For I am Yahweh your God[a]. Consecrate yourselves therefore, and be holy, for I am holy[b]. And you shall not defile yourselves with any swarming thing that moves on the earth.
translation:
  language: fr
  text: Car je suis Yahweh, votre Dieu. Consacrez-vous donc[a] et soyez saints, car je suis saint. Vous ne vous rendrez pas impurs[b] par aucune créature grouillante qui se déplace sur la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sanctifiez-vous ». Le verbe hébreu est réfléchi et signifie se mettre à part comme saint.
    reason: lexical_alternative
  - marker: b
    text: 'Le mot hébreu rendu par « vous » peut aussi désigner les personnes ou les vies. Autre traduction possible : « vous ne vous souillerez pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre; la forme « Yahweh » préserve directement le tétragramme et reste identifiable en français international.
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: Consacrez-vous donc
  rationale: 'Le hitpael de קדשׁ a ici une valeur réfléchie: le peuple doit se mettre à part pour Dieu. L’impératif français rend la force injonctive du contexte, et « donc » exprime l’enchaînement avec l’affirmation précédente.'
- source_word: וִהְיִיתֶם קְדֹשִׁים
  choice: et soyez saints
  rationale: Cette formulation naturelle conserve le lien lexical et théologique entre la sainteté demandée au peuple et celle de Dieu.
- source_word: תְטַמְּאוּ אֶת נַפְשֹׁתֵיכֶם
  choice: vous ne vous rendrez pas impurs
  rationale: Le piel de טמא indique le fait de devenir ou de se rendre impur. Le réfléchi français rend idiomatiquement נַפְשֹׁתֵיכֶם sans suggérer une opposition technique entre l’âme et le corps.
- source_word: שֶּׁרֶץ הָרֹמֵשׂ
  choice: bête grouillante qui se déplace
  rationale: « Bête grouillante » rend la catégorie des petites créatures qui pullulent, tandis que « qui se déplace » conserve la portée assez large du participe רמשׂ sans préciser indûment leur mode de locomotion.
- source_word: עַל הָאָרֶץ
  choice: sur la terre
  rationale: Rendu direct de l’expression hébraïque; « sur le sol » demeure possible selon la nuance contextuelle.
theological_decisions:
- issue: Rapport entre la sainteté de Dieu et celle exigée du peuple
  choice: Employer « saints/saint » dans les deux propositions
  alternative: Rendre l’un ou les deux emplois par « mis à part »
  rationale: La répétition du même vocabulaire de sainteté fonde explicitement l’obligation du peuple dans la sainteté propre de Dieu; la conserver évite d’affaiblir ce lien.
- issue: Sens de נַפְשֹׁתֵיכֶם
  choice: Le rendre par le pronom réfléchi « vous »
  alternative: « vos âmes », « vos vies » ou « vos personnes »
  rationale: Dans cette construction, le mot désigne les personnes elles-mêmes. « Vous » évite d’introduire une anthropologie dualiste absente du passage.
- issue: Force du dernier verbe
  choice: « Vous ne vous rendrez pas impurs »
  alternative: « Ne vous rendez pas impurs »
  rationale: Le futur négatif français conserve la forme solennelle et normative de l’interdiction hébraïque sans changer son caractère prescriptif.
translation_notes:
  register: Français international actuel, clair et digne. La formulation garde le parallélisme de la sainteté, le ton normatif du passage et le vocabulaire rituel de l’impureté sans archaïsme inutile.
