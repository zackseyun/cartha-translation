translation:
  language: fr
  text: la chevêche[a], le cormoran et le grand-duc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification exacte de ces oiseaux est incertaine. « Chevêche », « cormoran » et « grand-duc » sont des équivalents traditionnels ou proposés par les spécialistes. Pour les termes hébreux correspondants, on propose aussi respectivement « chouette » ou « petit-duc », « pélican », et « hibou » ou « hibou grand-duc ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכּוֹס
  choice: la chevêche
  rationale: Le mot désigne ici un oiseau impur dont l’espèce exacte demeure incertaine. « Chevêche » rend de façon naturelle en français l’identification traditionnelle d’une petite chouette, tout en laissant l’incertitude au pied de page.
- source_word: הַשָּׁלָךְ
  choice: le cormoran
  rationale: L’identification est discutée, mais « cormoran » est une proposition traditionnelle et plausible pour un oiseau aquatique plongeur. La possibilité du pélican est signalée en note.
- source_word: הַיַּנְשׁוּף
  choice: le grand-duc
  rationale: Le terme semble désigner un oiseau nocturne, probablement un grand hibou. « Grand-duc » est idiomatique et précis en français, sans dissimuler l’incertitude zoologique signalée en note.
- source_word: וְאֶת
  choice: et
  rationale: La répétition de la conjonction et du marqueur d’objet poursuit l’énumération précédente. Une ponctuation française naturelle, avec « et » avant le dernier élément, en conserve la fonction.
