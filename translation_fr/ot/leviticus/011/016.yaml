  text: and the ostrich[a], and the hawk, and the gull, and the falcon according to its kind,
translation:
  language: fr
  text: ainsi que l’autruche[a], le faucon, la mouette et l’épervier, selon son espèce.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification de plusieurs oiseaux dans ce verset est incertaine. Parmi les autres traductions traditionnelles figurent « hibou » pour « autruche », « engoulevent » ou « chouette » pour « faucon », « coucou » pour « mouette », et « faucon » pour « épervier ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: l’autruche
  rationale: L’expression signifie littéralement « fille de la ya‘anah », mais elle fonctionne ici comme un nom d’oiseau. L’identification traditionnelle et lexicographiquement probable est l’autruche, sans reprendre le calque hébreu peu naturel en français.
- source_word: הַתַּחְמָס
  choice: le faucon
  rationale: L’espèce exacte est incertaine. « Faucon » désigne naturellement en français un rapace et permet de distinguer ce terme de הַנֵּץ dans la même liste.
- source_word: הַשָּׁחַף
  choice: la mouette
  rationale: L’identification reste incertaine, mais « mouette » est une équivalence moderne largement retenue et évite l’ancien « coucou », moins vraisemblable lexicalement.
- source_word: הַנֵּץ
  choice: l’épervier
  rationale: Le mot désigne un oiseau de proie, souvent compris comme un épervier ou un faucon. « Épervier » conserve cette portée tout en distinguant les deux rapaces nommés dans le verset.
- source_word: לְמִינֵהוּ
  choice: selon ses espèces
  rationale: La formule classe l’oiseau avec les diverses espèces ou variétés qui lui sont rattachées. Le pluriel français est idiomatique dans une liste zoologique, même si le suffixe hébreu est formellement singulier.
- source_word: וְאֵת / וְאֶת
  choice: ainsi que / et
  rationale: La conjonction et le marqueur d’objet direct poursuivent la liste commencée au verset précédent. « Ainsi que » rend cette continuité au début du verset, tandis que « et » introduit naturellement le dernier élément en français.
