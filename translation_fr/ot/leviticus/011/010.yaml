  text: וְ/כֹל֩ אֲשֶׁ֨ר אֵֽין ל֜/וֹ סְנַפִּ֣יר וְ/קַשְׂקֶ֗שֶׂת בַּ/יַּמִּים֙ וּ/בַ/נְּחָלִ֔ים מִ/כֹּל֙ שֶׁ֣רֶץ הַ/מַּ֔יִם וּ/מִ/כֹּ֛ל נֶ֥פֶשׁ הַ/חַיָּ֖ה אֲשֶׁ֣ר בַּ/מָּ֑יִם שֶׁ֥קֶץ הֵ֖ם לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/010.yaml
  text: But everything in the seas and in the streams that does not have fins and scales[b][a], among all the swarming things in the waters and among all the living creatures that are in the waters—they are detestable to you.
translation:
  language: fr
  text: Mais tout ce qui, dans les mers et les cours d’eau[a], ne possède pas à la fois des nageoires et des écailles — parmi tout ce qui pullule dans les eaux et parmi tous les êtres vivants qui s’y trouvent — est détestable pour vous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les rivières » ou « les torrents ». Le mot hébreu désigne largement des cours d’eau, parfois saisonniers.
    reason: lexical_alternative
  - marker: b
    text: Ou « est pour vous une abomination ». Dans cette prescription alimentaire, le terme hébreu désigne ce qui est rituellement répugnant ou détestable.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: Mais tout ce qui
  rationale: Le וְ introduit ici le cas opposé à celui du verset précédent. « Mais » rend cette valeur contrastive, tandis que « tout ce qui » conserve la portée générale de כֹל.
- source_word: אֲשֶׁר אֵין לוֹ
  choice: qui … n’a
  rationale: Cette formulation française naturelle exprime directement l’absence des caractéristiques requises.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: ni nageoires ni écailles
  rationale: Dans une phrase négative, la corrélation française « ni… ni… » indique clairement l’absence des deux caractéristiques, sans transformer leur association en alternative.
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: dans les mers et les cours d’eau
  rationale: « Mers » rend יַמִּים. « Cours d’eau » couvre naturellement la gamme de נְחָלִים, qui peut désigner des rivières, des torrents ou des oueds.
- source_word: מִכֹּל שֶׁרֶץ הַמַּיִם
  choice: parmi les créatures qui pullulent dans les eaux
  rationale: שֶׁרֶץ désigne ce qui grouille ou pullule. « Créatures qui pullulent » reste concret et compréhensible, et « parmi » rend la valeur partitive de מִן.
- source_word: וּמִכֹּל נֶפֶשׁ הַחַיָּה
  choice: ou parmi tous les êtres vivants
  rationale: נֶפֶשׁ הַחַיָּה désigne ici largement les êtres animés. « Êtres vivants » évite le contresens moderne que pourrait susciter une traduction littérale par « âmes vivantes ».
- source_word: אֲשֶׁר בַּמָּיִם
  choice: qui s’y trouvent
  rationale: Le pronom « y » reprend naturellement « dans les eaux » sans répétition lourde, tout en conservant la localisation aquatique.
- source_word: שֶׁקֶץ הֵם לָכֶם
  choice: est détestable pour vous
  rationale: La phrase nominale hébraïque attribue à ces créatures un statut répugnant pour Israël. Le singulier français s’accorde avec le collectif « tout ce qui »; « détestable » garde la force rituelle et juridique du terme sans lui ajouter une qualification morale générale.
theological_decisions:
- issue: Terminologie du statut rituel dans les prescriptions alimentaires
  choice: détestable
  alternative: une abomination
  rationale: Dans ce contexte, שֶׁקֶץ exprime une répulsion liée au classement alimentaire de l’alliance. « Détestable » en restitue la force sans faire de cette désignation rituelle un jugement moral universel sur les créatures concernées.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la portée exhaustive du texte et ses deux grandes catégories de vie aquatique, tout en réorganisant légèrement leur articulation avec « que ce soit… ou… » pour éviter une construction française ambiguë ou pesante.
