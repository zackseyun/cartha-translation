  yaml_path: translation/ot/leviticus/011/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying to them,
translation:
  language: fr
  text: 'Yahweh[a] parla à Moïse et à Aaron. Il leur dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque du nom divin et sa traduction traditionnelle.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le waw consécutif introduit un nouvel événement narratif. « Parla » convient à la formule solennelle d’introduction d’une parole divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Cette forme rend directement le nom divin יהוה plutôt que de lui substituer un titre.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: à Moïse et à Aaron
  rationale: La préposition אֶל désigne les destinataires de la parole. En français, sa non-répétition devant Aaron est naturelle et ne change pas le sens.
- source_word: לֵאמֹר
  choice: 'Il leur dit :'
  rationale: L’infinitif לֵאמֹר introduit le contenu de la parole. Une nouvelle proposition avec deux-points rend cette fonction de manière claire et idiomatique en français.
- source_word: אֲלֵהֶם
  choice: leur
  rationale: Le pronom pluriel est conservé afin de préciser que la parole suivante s’adresse à Moïse et à Aaron.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le tétragramme comme nom propre. « Yahweh » préserve cette fonction, tandis que « le SEIGNEUR » représente la lecture traditionnelle de substitution.
translation_notes:
  register: Français moderne, international et digne. La construction hébraïque « parla… en disant » est rendue idiomatiquement par deux phrases, tout en conservant explicitement le pronom pluriel אֲלֵהֶם.
