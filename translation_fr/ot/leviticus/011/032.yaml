source:
  edition: WLC
  text: וְ/כֹ֣ל אֲשֶׁר יִפֹּל עָלָי/ו֩ מֵ/הֶ֨ם בְּ/מֹתָ֜/ם יִטְמָ֗א מִ/כָּל כְּלִי עֵץ֙ א֣וֹ בֶ֤גֶד אוֹ עוֹר֙ א֣וֹ שָׂ֔ק כָּל כְּלִ֕י אֲשֶׁר יֵעָשֶׂ֥ה מְלָאכָ֖ה בָּ/הֶ֑ם בַּ/מַּ֧יִם יוּבָ֛א וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/032.yaml
  text: And everything on which any of them falls when they are dead shall become unclean—from any wooden vessel or garment or skin or sackcloth, any vessel with which work is done. It shall be put into the water, and it shall be unclean until the evening; then it shall be clean.
translation:
  language: fr
  text: 'Tout objet sur lequel tombera l’un d’eux une fois mort deviendra impur : objet en bois, vêtement, peau ou étoffe de sac, tout objet dont on se sert pour un travail. On le mettra dans l’eau[a] ; il restera impur jusqu’au soir, puis il sera pur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « On l’immergera dans l’eau. » L’hébreu dit littéralement : « On l’amènera dans l’eau. »'
    reason: Alternative lexicale préservant la formulation concrète et l’ambiguïté du verbe hébreu.
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר יִפֹּל עָלָיו מֵהֶם
  choice: Tout objet sur lequel tombera l’un d’eux
  rationale: « Tout objet » exprime naturellement la portée générale de כֹּל dans ce contexte matériel. « L’un d’eux » rend la valeur distributive de מֵהֶם et renvoie aux animaux mentionnés au verset précédent.
- source_word: בְּמֹתָם
  choice: une fois mort
  rationale: Cette formulation idiomatique exprime l’état ou le moment de la mort et s’accorde avec « l’un d’eux », sans réduire le sens au seul instant où l’animal meurt.
- source_word: יִטְמָא
  choice: deviendra impur
  rationale: Le verbe indique l’entrée dans un état d’impureté rituelle provoquée par le contact.
- source_word: מִכָּל כְּלִי עֵץ א֣וֹ בֶגֶד אוֹ עוֹר א֣וֹ שָׂק
  choice: objet en bois, vêtement, peau ou étoffe de sac
  rationale: La liste désigne des catégories d’objets ou de matériaux. « Objet » garde à כְּלִי sa portée large ; « étoffe de sac » désigne clairement le tissu grossier nommé שָׂק sans suggérer nécessairement un vêtement de deuil.
- source_word: כָּל כְּלִי אֲשֶׁר יֵעָשֶׂה מְלָאכָה בָּהֶם
  choice: tout objet dont on se sert pour un travail
  rationale: La tournure française rend le passif hébreu de façon naturelle et conserve la fonction utilitaire de l’objet sans limiter מְלָאכָה à une activité technique précise.
- source_word: בַּמַּיִם יוּבָא
  choice: On le mettra dans l’eau
  rationale: Le hofal de בוא signifie littéralement « être amené dans ». Dans ce contexte de purification, « mettre dans l’eau » est clair et fidèle, tandis que l’immersion complète demeure une interprétation possible signalée en note.
- source_word: וְטָמֵא עַד הָעֶרֶב וְטָהֵר
  choice: il restera impur jusqu’au soir, puis il sera pur
  rationale: « Restera » rend la durée de l’état d’impureté après la mise dans l’eau ; « puis » explicite sobrement la succession temporelle indiquée par la coordination hébraïque.
theological_decisions:
- issue: Nature de l’impureté
  choice: Employer « impur/pur » au sens rituel et juridique
  alternative: « souillé/nettoyé » ou un vocabulaire de faute morale
  rationale: Dans cette législation lévitique, טמא et טהר décrivent avant tout un statut rituel. « Impur/pur » préserve cette catégorie sans introduire une culpabilité morale absente du verset.
- issue: Étendue de l’action de l’eau
  choice: Traduire littéralement le mouvement dans l’eau sans affirmer explicitement une immersion complète
  alternative: « On l’immergera dans l’eau »
  rationale: Le texte dit que l’objet sera « amené/mis dans l’eau ». L’immersion est plausible dans le contexte, mais le verbe lui-même ne l’impose pas sans ambiguïté ; elle est donc conservée en note comme autre traduction possible.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la cadence juridique du passage tout en évitant les archaïsmes. Le deux-points introduit naturellement la liste des catégories d’objets.
