  text: to distinguish between the unclean and the clean[a], and between the creature that may be eaten and the creature that may not be eaten.
translation:
  language: fr
  text: pour distinguer entre ce qui est impur et ce qui est pur, et entre l’animal qu’il est permis de manger et l’animal qu’il est interdit de manger.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַבְדִּיל
  choice: pour distinguer
  rationale: L’infinitif exprime ici le but ou le résultat de l’enseignement précédent. « Distinguer » convient au discernement légal demandé dans les prescriptions alimentaires.
- source_word: בֵּין ... וּבֵין
  choice: entre… et…, et entre… et…
  rationale: La répétition hébraïque structure deux oppositions parallèles; la formulation française en conserve clairement la construction.
- source_word: הַטָּמֵא
  choice: ce qui est impur
  rationale: Dans le Lévitique, le terme désigne une catégorie rituelle et légale, non un jugement de valeur morale intrinsèque.
- source_word: הַטָּהֹר
  choice: ce qui est pur
  rationale: « Pur » est le correspondant français naturel d’« impur » dans le vocabulaire rituel du Lévitique.
- source_word: הַחַיָּה
  choice: l’animal
  rationale: Dans ce résumé des règles alimentaires, חַיָּה désigne les êtres animaux concernés. « Animal » est naturel en français et n’en limite pas le sens aux seuls animaux sauvages.
- source_word: הַנֶּאֱכֶלֶת
  choice: qui peut être mangé
  rationale: Le participe niphal désigne ici l’animal autorisé ou propre à la consommation, plutôt que la simple possibilité matérielle de le manger.
- source_word: אֲשֶׁר לֹא תֵאָכֵל
  choice: qui ne peut pas être mangé
  rationale: Dans ce contexte légal, la tournure exprime l’interdiction alimentaire et forme un contraste direct avec « qui peut être mangé ».
theological_decisions:
- issue: Terminologie de la pureté rituelle dans la loi lévitique
  choice: Traduire טָמֵא/טָהֹר par « impur/pur » dans leur sens rituel et légal.
  alternative: « souillé/pur » ou une formulation explicitement morale
  rationale: Le verset récapitule les catégories alimentaires établies dans le chapitre. « Impur/pur » préserve cette classification sans suggérer que les animaux concernés seraient moralement mauvais.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la structure parallèle de l’hébreu. « Animal » est plus idiomatique que « être vivant » dans ce contexte alimentaire, tandis que « peut/ne peut pas être mangé » rend l’autorisation et l’interdiction sans archaïsme.
