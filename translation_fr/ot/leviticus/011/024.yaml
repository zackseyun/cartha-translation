  text: וּ/לְ/אֵ֖לֶּה תִּטַּמָּ֑אוּ כָּל הַ/נֹּגֵ֥עַ בְּ/נִבְלָתָ֖/ם יִטְמָ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/024.yaml
  text: 'And by these you shall become unclean: everyone who touches their carcass shall be unclean until the evening[a][b].'
translation:
  language: fr
  text: 'À cause de ceux-ci, vous deviendrez impurs : quiconque touchera leur cadavre sera impur jusqu’au soir[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « En ce qui concerne ceux-ci, vous deviendrez impurs. » La formule d’ouverture peut introduire plus généralement la catégorie qui suit, plutôt que d’indiquer strictement la cause par laquelle on devient impur.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu porte littéralement « leur cadavre », avec un nom singulier et un suffixe pluriel. On peut aussi traduire : « leurs cadavres ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאֵלֶּה
  choice: par ceux-ci
  rationale: La préposition לְ avec le démonstratif peut indiquer le domaine concerné ou le moyen. Dans ce contexte, « par ceux-ci » rend naturellement le fait que le contact avec ces animaux entraîne l’impureté, tout en laissant les autres nuances en note.
- source_word: תִּטַּמָּאוּ
  choice: vous vous rendrez impurs
  rationale: La forme verbale exprime l’entrée dans un état d’impureté rituelle. Cette tournure française marque le résultat sans suggérer une faute morale.
- source_word: כָּל הַנֹּגֵעַ
  choice: quiconque touchera
  rationale: Le participe singulier précédé de כָּל a une portée générale. « Quiconque » conserve cette universalité dans un registre juridique naturel.
- source_word: בְּנִבְלָתָם
  choice: leur cadavre
  rationale: נְבֵלָה désigne ici le cadavre d’un animal. Le nom hébreu est au singulier avec un suffixe pluriel; le français peut conserver ce singulier distributif, l’alternative plurielle étant signalée en note.
- source_word: יִטְמָא
  choice: sera impur
  rationale: Le verbe au singulier s’accorde avec le sujet générique. « Sera impur » exprime clairement l’état rituel qui résulte du contact.
- source_word: עַד הָעָרֶב
  choice: jusqu’au soir
  rationale: Cette expression indique la durée de l’impureté rituelle et correspond à l’usage français naturel.
theological_decisions:
- issue: Nature de l’impureté dans la législation de sainteté
  choice: Employer « impur » pour désigner un état rituel
  alternative: Employer « souillé »
  rationale: Le verset traite de l’impureté rituelle causée par le contact avec un cadavre animal, non d’une culpabilité morale. « Impur » préserve cette catégorie cultuelle sans ajouter de condamnation morale.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire juridique et rituel reste précis; le futur convient au style prescriptif du passage.
