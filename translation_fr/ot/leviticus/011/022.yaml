base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/022.yaml
  text: 'These of them you may eat: the locust according to its kind[a], and the bald locust according to its kind, and the cricket according to its kind, and the grasshopper according to its kind.'
translation:
  language: fr
  text: 'Parmi eux, voici ceux que vous pouvez manger : le criquet selon son espèce, le solam[a] selon son espèce, le hargol[a] selon son espèce et la sauterelle selon son espèce.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification exacte de plusieurs noms hébreux d’insectes dans cette liste est incertaine. « Solam » et « hargol » transcrivent les termes hébreux ; des traductions traditionnelles proposent notamment diverses sortes de criquets, ainsi que « grillon » pour hargol.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה מֵהֶם
  choice: Parmi eux, voici ceux
  rationale: Cette formulation naturelle en français introduit clairement le sous-ensemble autorisé parmi les insectes ailés mentionnés auparavant.
- source_word: תֹּאכֵלוּ
  choice: vous pouvez manger
  rationale: Dans ce contexte législatif, l’inaccompli exprime une permission plutôt qu’une obligation.
- source_word: הָאַרְבֶּה
  choice: le criquet
  rationale: אַרְבֶּה est le terme hébreu courant désignant le criquet, notamment le criquet grégaire ou migrateur.
- source_word: לְמִינוֹ / לְמִינֵהוּ
  choice: selon ses espèces
  rationale: La formule classe chaque insecte avec les variétés qui lui sont apparentées; le pluriel « espèces » est idiomatique en français dans ce type d’énumération.
- source_word: הַסָּלְעָם
  choice: le solam
  rationale: L’identification zoologique est incertaine. La translittération évite de présenter comme assurée une équivalence conjecturale.
- source_word: הַחַרְגֹּל
  choice: le hargol
  rationale: L’identification précise reste incertaine; la translittération préserve le nom distinct employé dans l’hébreu sans imposer « grillon » ou une autre espèce discutée.
- source_word: הֶחָגָב
  choice: la sauterelle
  rationale: חָגָב désigne couramment un insecte sauteur de type sauterelle; ce choix le distingue naturellement de אַרְבֶּה, rendu par « criquet ».
theological_decisions: []
