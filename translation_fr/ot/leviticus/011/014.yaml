lexical_decisions:
- source_word: הַדָּאָה
  choice: le milan
  rationale: Ce nom d’oiseau est d’identification incertaine. « Milan » est un terme français courant désignant un rapace et correspond à une interprétation lexicale plausible; l’incertitude est signalée en note.
- source_word: הָאַיָּה
  choice: le faucon
  rationale: Le mot désigne un rapace, traditionnellement identifié au faucon ou au milan. « Faucon » distingue naturellement les deux noms hébreux successifs sans masquer l’incertitude zoologique.
- source_word: לְמִינָהּ
  choice: selon son espèce
  rationale: Cette formulation conserve le sens classificatoire de l’hébreu et reste naturelle en français moderne.
- source_word: וְאֶת ... וְאֶת
  choice: le ... et le ...
  rationale: La marque de l’objet direct אֵת n’a pas d’équivalent à rendre en français; les conjonctions et les articles sont représentés naturellement dans la liste.
