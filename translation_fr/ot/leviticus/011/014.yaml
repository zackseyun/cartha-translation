translation:
  language: fr
  text: le milan[a] et le faucon, selon son espèce,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification précise de ces oiseaux est incertaine; on pourrait aussi traduire le premier par « vautour » et le second par « milan ».
