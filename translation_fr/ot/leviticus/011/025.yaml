  text: וְ/כָל הַ/נֹּשֵׂ֖א מִ/נִּבְלָתָ֑/ם יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/025.yaml
  text: And everyone who carries any of their carcasses shall wash his clothes and be unclean until the evening[a].
translation:
  language: fr
  text: Et quiconque transporte l’une de leurs carcasses devra laver ses vêtements et sera impur jusqu’au soir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « transporte quelque chose provenant de leurs carcasses ». La préposition hébraïque מִן peut être rendue plus formellement par « de »; « l’une de leurs carcasses » exprime naturellement la portée distributive dans ce contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל הַ/נֹּשֵׂא
  choice: Et quiconque transporte
  rationale: וְ rattache la règle au contexte précédent. כָּל suivi du participe a une portée distributive; « quiconque » l’exprime naturellement en français. נָשָׂא désigne ici le fait de porter ou de transporter.
- source_word: מִ/נִּבְלָתָ/ם
  choice: une partie de leur cadavre
  rationale: 'נְבֵלָה désigne la dépouille d’un animal. La préposition מִן a ici une valeur partitive probable: l’impureté résulte du transport d’une partie quelconque de la dépouille. Le singulier « leur cadavre » suit la forme hébraïque, dont le suffixe pluriel renvoie aux animaux mentionnés auparavant.'
- source_word: יְכַבֵּס בְּגָדָי/ו
  choice: devra laver ses vêtements
  rationale: L’imparfait hébreu exprime ici une obligation légale. « Devra laver » garde cette force prescriptive dans un français moderne; « vêtements » est le terme courant correspondant à בְּגָדִים.
- source_word: וְ/טָמֵא
  choice: et sera impur
  rationale: Dans cette législation, טָמֵא désigne une impureté rituelle et non une faute morale. Le futur français exprime la conséquence juridique de l’acte.
- source_word: עַד הָ/עָרֶב
  choice: jusqu’au soir
  rationale: Cette expression indique la limite temporelle de l’état d’impureté; « jusqu’au soir » est la formulation française naturelle et précise.
theological_decisions:
- issue: Formes masculines singulières dans une règle de portée générale
  choice: « quiconque… ses vêtements… sera impur »
  alternative: « toute personne… ses vêtements… sera impure »
  rationale: L’hébreu présente un individu représentatif au masculin singulier. « Quiconque » conserve la portée universelle sans passer au pluriel, tandis que « impur » maintient l’accord masculin de l’énoncé source.
- issue: Nature de l’impureté
  choice: Employer « impur » au sens cultuel
  alternative: Employer un terme suggérant une faute morale ou une saleté physique
  rationale: Le contexte de Lévitique 11 concerne le statut rituel temporaire résultant du contact avec une dépouille, non une condamnation morale.
translation_notes:
  register: Français international moderne, digne et lisible. Le tour « quiconque » convient au registre juridique du passage sans être archaïque. « Cadavre » est conservé pour la dépouille animale; « impur » relève explicitement du vocabulaire rituel du contexte.
