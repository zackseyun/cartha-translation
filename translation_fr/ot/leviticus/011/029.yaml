base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/029.yaml
  text: 'And these are unclean for you among the swarming things that swarm on the earth: the mole-rat[a], and the mouse, and the great lizard according to its kind.'
translation:
  language: fr
  text: 'Voici ceux qui sont impurs pour vous parmi les animaux qui grouillent sur la terre : le rat-taupe[a], la souris et le grand lézard, selon son espèce.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification précise de חֹלֶד et de צָב est incertaine. Pour חֹלֶד, les traductions traditionnelles proposent notamment « belette » ou « taupe »; pour צָב, « tortue » ou simplement « lézard ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: Voici ceux qui sont
  rationale: Le démonstratif hébreu est morphologiquement singulier, mais il introduit une liste de plusieurs animaux. Cette formulation française naturelle conserve sa fonction présentative sans imposer un singulier maladroit.
- source_word: לָכֶם
  choice: pour vous
  rationale: 'La préposition marque ici la relation avec les destinataires de la législation : ces animaux sont impurs pour Israël.'
- source_word: הַטָּמֵא
  choice: impurs
  rationale: « Impur » est le terme français courant et précis dans le cadre des prescriptions lévitiques relatives à la pureté rituelle.
- source_word: בַּשֶּׁרֶץ הַשֹּׁרֵץ
  choice: parmi les petites bêtes qui pullulent
  rationale: Cette traduction garde la répétition de la même racine hébraïque par le lien sémantique entre « petites bêtes » et « pullulent », tout en évitant le sens trop étroit que pourrait suggérer « reptiles ».
- source_word: עַל הָאָרֶץ
  choice: sur la terre
  rationale: La formule désigne ici le domaine terrestre ou la surface du sol; « sur la terre » restitue directement l’expression hébraïque.
- source_word: הַחֹלֶד
  choice: le rat-taupe
  rationale: L’identification zoologique est incertaine. « Rat-taupe » constitue une proposition moderne plausible pour ce petit animal terrestre, tandis que les équivalents traditionnels sont signalés en note.
- source_word: הָעַכְבָּר
  choice: la souris
  rationale: « Souris » est l’équivalent usuel de עַכְבָּר, qui peut plus largement désigner de petits rongeurs apparentés.
- source_word: הַצָּב
  choice: le grand lézard
  rationale: L’espèce exacte demeure incertaine. Dans cette liste de petits animaux terrestres, un grand lézard est une identification plausible, sans que la traduction prétende à une certitude zoologique.
- source_word: לְמִינֵהוּ
  choice: selon son espèce
  rationale: Cette formule classificatoire traditionnelle restitue clairement le sens taxinomique de מִין et garde le singulier du suffixe hébreu.
