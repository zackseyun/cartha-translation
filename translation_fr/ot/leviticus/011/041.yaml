id: LEV.11.41
reference: Leviticus 11:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ שֶׁ֥קֶץ ה֖וּא לֹ֥א יֵאָכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/041.yaml
  text: And every swarming thing that swarms on the earth is detestable[b][a]; it shall not be eaten.
translation:
  language: fr
  text: Et toute créature qui grouille[a] sur la terre est une chose abominable[b] ; elle ne doit pas être mangée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « créature rampante ». Le terme hébreu désigne largement de petites créatures qui grouillent ou se déplacent près du sol.
    reason: lexical_alternative
  - marker: b
    text: Ou « est répugnante ». Le terme désigne ici ce qui est rituellement abominable et interdit comme nourriture.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Et toute
  rationale: « Et » maintient le lien avec les prescriptions précédentes, tandis que « toute » conserve la portée générale de כָּל.
- source_word: הַ/שֶּׁרֶץ הַ/שֹּׁרֵץ
  choice: créature qui grouille
  rationale: שֶׁרֶץ et le participe apparenté שׁרץ désignent une petite créature caractérisée par son déplacement en masse ou près du sol. La répétition littérale « la créature grouillante qui grouille » serait peu naturelle en français ; cette formulation conserve l'idée centrale, et la note signale l'autre rendu possible.
- source_word: עַל הָ/אָ֑רֶץ
  choice: sur la terre
  rationale: Dans le contexte du chapitre, אָרֶץ désigne le domaine terrestre, par contraste avec les eaux et les airs. « Sur la terre » reste naturel et suffisamment large.
- source_word: שֶׁ֥קֶץ
  choice: répugnante
  rationale: Le terme qualifie ici ces créatures de répugnantes et impropres à la consommation dans le cadre rituel. « Répugnante » communique clairement cette valeur sans donner au mot un sens moral plus large que le contexte.
- source_word: ה֖וּא
  choice: est
  rationale: La tournure attributive française rend naturellement la prédication hébraïque ; le pronom indépendant hébreu renforce l'affirmation sans exiger un pronom distinct en français.
- source_word: לֹ֥א יֵאָכֵֽל
  choice: elle ne doit pas être mangée
  rationale: Le nifal exprime une interdiction passive. « Ne doit pas être mangée » garde le registre normatif tout en étant plus courant en français moderne que « ne sera pas mangée ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation évite la répétition peu idiomatique « créature grouillante qui grouille », tout en conservant le mouvement caractéristique du terme hébreu et le registre prescriptif de la dernière proposition.
