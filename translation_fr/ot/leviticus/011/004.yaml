id: LEV.11.4
reference: Leviticus 11:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַ֤ךְ אֶת זֶה֙ לֹ֣א תֹֽאכְל֔וּ מִֽ/מַּעֲלֵי֙ הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֖י הַ/פַּרְסָ֑ה אֶֽת הַ֠/גָּמָל כִּֽי מַעֲלֵ֨ה גֵרָ֜ה ה֗וּא וּ/פַרְסָה֙ אֵינֶ֣/נּוּ מַפְרִ֔יס טָמֵ֥א ה֖וּא לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/004.yaml
  text: 'Nevertheless[a], you shall not eat these from among those that chew the cud or from among those that divide the hoof: the camel, because it chews the cud but does not divide the hoof[b]; it is unclean to you.'
translation:
  language: fr
  text: 'Cependant, parmi les animaux qui ruminent[a] ou qui ont le sabot fendu, vous ne mangerez pas les suivants : le chameau, car il rumine, mais il n’a pas le sabot fendu. Il est impur pour vous[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui font remonter ce qu’ils ont avalé ».'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire qu’il est considéré comme impur pour Israël dans le cadre de ces lois alimentaires.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Cependant
  rationale: Marque la restriction apportée à la règle générale du verset précédent, dans un français naturel et digne.
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: parmi les animaux qui ruminent
  rationale: L’expression hébraïque signifie littéralement « faire remonter ce qui a été avalé ». « Ruminer » est l’équivalent français courant dans cette classification alimentaire, tandis qu’une note conserve l’image littérale.
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה
  choice: ou qui ont le sabot fendu
  rationale: Le ו coordonne ici deux groupes dont les exemples qui suivent ne possèdent qu’un des deux critères. « Ou » rend clairement cette portée, et « avoir le sabot fendu » est l’expression française usuelle.
- source_word: הַגָּמָל
  choice: le chameau
  rationale: Équivalent direct du nom de l’animal.
- source_word: כִּי מַעֲלֵה גֵרָה הוּא
  choice: car il rumine
  rationale: Rend de façon concise le premier critère que le chameau remplit selon la classification du texte.
- source_word: וּפַרְסָה אֵינֶנּוּ מַפְרִיס
  choice: mais il n’a pas le sabot fendu
  rationale: Le contraste explicite montre que le chameau ne remplit pas le second critère. La formulation française est naturelle sans ajouter d’explication zoologique.
- source_word: טָמֵא הוּא לָכֶם
  choice: Il est impur pour vous
  rationale: « Impur » conserve le terme central du vocabulaire lévitique, et « pour vous » maintient l’orientation juridique envers les destinataires.
theological_decisions:
- issue: Nature de l’impureté dans les lois alimentaires du Lévitique
  choice: impur
  alternative: rituellement impur
  rationale: Le texte principal garde toute la portée du terme hébreu טָמֵא sans la réduire d’emblée à une catégorie explicitement « rituelle ». La note situe néanmoins cette qualification dans les lois alimentaires données à Israël.
translation_notes:
  register: Français international moderne, clair et soutenu. La phrase est restructurée avec « les suivants » afin de rendre lisible l’énumération hébraïque. « Ruminer » et « sabot fendu » sont les expressions usuelles, tandis que les notes préservent le sens littéral et le cadre légal.
