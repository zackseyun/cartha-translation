  variant: modern international French
source:
  edition: WLC
  text: וְ/הָֽ/אֹכֵל֙ מִ/נִּבְלָתָ֔/הּ יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֣א עַד הָ/עָ֑רֶב וְ/הַ/נֹּשֵׂא֙ אֶת נִבְלָתָ֔/הּ יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/040.yaml
  text: And the one who eats any of its carcass shall wash his clothes and be unclean until the evening[b][a], and the one who carries its carcass shall wash his clothes and be unclean until the evening.
translation:
  language: fr
  text: Celui qui mangera une partie de sa carcasse[a] lavera ses vêtements et sera impur jusqu’au soir[b]. Celui qui transportera sa carcasse lavera ses vêtements et sera impur jusqu’au soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement: «mangera de sa carcasse»; l’expression hébraïque peut désigner une partie quelconque de celle-ci.'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire impur au sens des règles de pureté rituelle d’Israël.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֹכֵל
  choice: Celui qui mangera
  rationale: Le participe avec article est substantivé et désigne de manière générale toute personne accomplissant l’action. Le futur français convient au style prescriptif des lois bibliques.
- source_word: מִנִּבְלָתָהּ
  choice: une partie de sa carcasse
  rationale: La préposition מִן a ici une valeur partitive. Cette formulation française naturelle exprime qu’il s’agit de manger de la carcasse, sans suggérer nécessairement sa totalité.
- source_word: נְבֵלָה / נִבְלָתָהּ
  choice: carcasse
  rationale: Dans cette législation concernant les animaux, le terme désigne le corps d’un animal mort; «carcasse» est plus précis que «cadavre».
- source_word: יְכַבֵּס בְּגָדָיו
  choice: lavera ses vêtements
  rationale: L’imparfait hébreu a une force prescriptive dans ce contexte juridique. Le futur rend naturellement cette prescription en français moderne.
- source_word: וְטָמֵא
  choice: et sera impur
  rationale: La proposition indique l’état d’impureté qui en résulte. «Impur» conserve le terme de la source sans ajouter l’explication «rituellement» dans le corps du texte.
- source_word: עַד הָעָרֶב
  choice: jusqu’au soir
  rationale: Formule française naturelle et fidèle pour la limite temporelle exprimée par l’hébreu.
- source_word: הַנֹּשֵׂא
  choice: Celui qui transportera
  rationale: Le participe substantivé est générique et parallèle à הָאֹכֵל. «Transporter» exprime ici clairement le fait de porter la carcasse.
- source_word: אֶת נִבְלָתָהּ
  choice: sa carcasse
  rationale: Le nom muni du suffixe renvoie naturellement à l’animal mentionné dans le contexte.
theological_decisions:
- issue: Nature de l’impureté
  choice: Traduire טָמֵא par «impur» et expliquer le sens rituel en note.
  alternative: «rituellement impur» dans le texte principal
  rationale: Le contexte relève des règles de pureté d’Israël, mais le mot «rituellement» n’est pas explicite dans l’hébreu. La note éclaire le cadre sans développer le texte.
- issue: Genre grammatical de la formulation juridique
  choice: 'Employer le masculin singulier générique: «Celui qui… ses vêtements».'
  alternative: Employer une formulation plurielle ou explicitement inclusive.
  rationale: L’hébreu présente des participes et des suffixes masculins singuliers à valeur représentative. La formulation française conserve cette structure juridique sans limiter la portée de la règle aux hommes.
translation_notes:
  register: Français international moderne, clair et digne. Le futur simple maintient la cadence juridique traditionnelle tout en restant naturel. Les deux propositions parallèles de l’hébreu sont conservées.
