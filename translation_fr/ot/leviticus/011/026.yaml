id: LEV.11.26
reference: Leviticus 11:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְֽ/כָל הַ/בְּהֵמָ֡ה אֲשֶׁ֣ר הִוא֩ מַפְרֶ֨סֶת פַּרְסָ֜ה וְ/שֶׁ֣סַע אֵינֶ֣/נָּה שֹׁסַ֗עַת וְ/גֵרָה֙ אֵינֶ֣/נָּה מַעֲלָ֔ה טְמֵאִ֥ים הֵ֖ם לָ/כֶ֑ם כָּל הַ/נֹּגֵ֥עַ בָּ/הֶ֖ם יִטְמָֽא־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/026.yaml
  text: As for every animal that has a divided hoof[a], but does not split the hoof completely and does not chew the cud, they are unclean to you. Everyone who touches them shall be unclean.
translation:
  language: fr
  text: Quant à tout animal qui a le sabot divisé, mais dont le sabot n’est pas complètement fendu[a], et qui ne rumine pas, ces animaux sont impurs pour vous. Quiconque les touche deviendra impur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « ne fend pas une fente » ; en hébreu, l’emploi d’un nom et d’un verbe de même racine souligne l’idée d’un sabot véritablement fendu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָל הַבְּהֵמָה
  choice: Quant à tout animal
  rationale: Le לְ préfixé introduit ici la catégorie examinée. « Quant à » restitue naturellement cette valeur thématique, et « animal » rend בְּהֵמָה dans un français moderne et général.
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: qui a le sabot divisé
  rationale: L’expression désigne un animal dont le sabot présente une division. Cette formulation est plus naturelle en français que le calque verbal « qui divise le sabot ».
- source_word: וְשֶׁסַע אֵינֶנָּה שֹׁסַעַת
  choice: mais dont le sabot n’est pas complètement fendu[a]
  rationale: La construction associant un nom et un verbe de même racine précise ou renforce l’idée d’une véritable séparation du sabot. « Complètement fendu » exprime cette nuance sans imposer une description zoologique plus détaillée que l’hébreu.
- source_word: וְגֵרָה אֵינֶנָּה מַעֲלָה
  choice: et qui ne rumine pas
  rationale: Littéralement, l’animal « ne fait pas remonter la nourriture ruminée ». « Ruminer » est l’équivalent zoologique français courant et exact.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: ces animaux sont impurs pour vous
  rationale: Le pluriel hébreu reprend la catégorie collective introduite au singulier. « Ces animaux » évite en français une rupture d’accord obscure. « Impurs » conserve la catégorie rituelle, tandis que « pour vous » maintient la perspective légale et communautaire de לָכֶם.
- source_word: כָּל הַנֹּגֵעַ בָּהֶם
  choice: Quiconque les touche
  rationale: Le participe singulier précédé de כָּל exprime une règle générale. « Quiconque » est naturel, précis et adapté au registre juridique.
- source_word: יִטְמָא
  choice: deviendra impur
  rationale: L’imparfait hébreu énonce la conséquence du contact. « Deviendra impur » met clairement en évidence l’entrée dans un état d’impureté rituelle.
theological_decisions:
- issue: Terminologie de la pureté dans la législation lévitique
  choice: impur
  alternative: souillé
  rationale: Le contexte porte sur un statut rituel, non nécessairement sur une faute morale. « Impur » est le terme français clair et consacré pour cette catégorie, tandis que « souillé » risquerait d’évoquer davantage une contamination physique ou morale.
translation_notes:
  register: Français international moderne, clair et digne, avec un registre juridique sobre. La reprise par « ces animaux » rend intelligible le passage du singulier collectif au pluriel dans l’hébreu sans modifier la portée de la règle.
