  text: וְ/אֶת הַ/תִּנְשֶׁ֥מֶת וְ/אֶת הַ/קָּאָ֖ת וְ/אֶת הָ/רָחָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/018.yaml
  text: the owl, the pelican, and the carrion vulture;
translation:
  language: fr
  text: la chouette[a], le pélican[b] et le vautour percnoptère[c] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’espèce d’oiseau désignée par le terme hébreu est incertaine.
    reason: Éviter de présenter comme certaine une identification zoologique discutée.
  - marker: b
    text: 'Ou peut-être : un autre grand oiseau des régions désertiques ; identification incertaine.'
    reason: Le sens zoologique exact de qāʾat reste débattu.
  - marker: c
    text: L’identification au vautour percnoptère est probable, mais non certaine.
    reason: Signaler honnêtement le degré d’incertitude lexicale.
lexical_decisions:
- source_word: הַתִּנְשֶׁמֶת (tinšemet)
  choice: la chouette
  rationale: Le terme désigne ici un oiseau impur, mais son identification précise demeure incertaine. « Chouette » conserve l’interprétation traditionnelle sans prétendre déterminer l’espèce.
- source_word: הַקָּאָת (qāʾat)
  choice: le pélican
  rationale: Équivalent traditionnel et plausible d’un oiseau associé aux lieux désolés, bien que l’identification zoologique ne soit pas certaine.
- source_word: הָרָחָם (rāḥām)
  choice: le vautour percnoptère
  rationale: L’identification au percnoptère d’Égypte est couramment proposée et convient mieux que le terme général « vautour », tout en restant à signaler comme probable plutôt que certaine.
