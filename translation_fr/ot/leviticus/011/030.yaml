  text: the gecko[a], the monitor lizard, the lizard, the sand lizard, and the chameleon.
translation:
  language: fr
  text: le gecko[a], le varan, le lézard, le lézard des sables et le caméléon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’identification exacte de plusieurs animaux de ce verset est incertaine. Parmi les propositions traditionnelles et modernes figurent : pour « gecko », « furet » ou « musaraigne »; pour « varan », « caméléon »; pour « lézard des sables », « scinque » ou, selon une ancienne tradition, « escargot »; et pour « caméléon », « taupe » ou une autre sorte de lézard.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָקָה
  choice: le gecko
  rationale: L’identification zoologique précise est incertaine. Dans cette liste de petites bêtes qui se déplacent sur le sol, un reptile paraît plus probable qu’un mammifère; « gecko » constitue un équivalent moderne plausible.
- source_word: הַכֹּחַ
  choice: le varan
  rationale: Le terme semble désigner un grand lézard. « Varan » est naturel et précis en français moderne, sans le confondre avec les autres reptiles de la liste.
- source_word: הַלְּטָאָה
  choice: le lézard
  rationale: Une désignation générique convient puisque l’espèce exacte ne peut pas être établie avec certitude.
- source_word: הַחֹמֶט
  choice: le lézard des sables
  rationale: Dans cette liste, l’identification comme reptile est plus cohérente que l’ancienne proposition « escargot ». « Lézard des sables » reste toutefois une identification plausible, non certaine.
- source_word: הַתִּנְשָׁמֶת
  choice: le caméléon
  rationale: Bien que ce mot hébreu désigne un oiseau dans un autre contexte, il figure ici parmi les petites bêtes terrestres; « caméléon » est une identification contextuelle courante, mais incertaine.
