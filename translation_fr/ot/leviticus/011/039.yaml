review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : condition, mort d’un animal admis pour l’alimentation, contact avec son cadavre et impureté jusqu’au soir. Toutefois, « qui vous servent de nourriture » peut suggérer des bêtes effectivement utilisées comme nourriture, alors que l’hébreu les classe comme propres/autorisées à l’alimentation. La note dite « plus littéralement » n’est pas assez littérale, car elle introduit « comme » absent de l’hébreu.'
  naturalness: La formulation est claire et de registre juridique naturel. « Parmi les bêtes dont vous pouvez vous nourrir » est plus idiomatique en français moderne tout en exprimant mieux la catégorie visée.
  terminology: « Cadavre », « impur » et « jusqu’au soir » conviennent au contexte des lois de pureté. Le texte laisse, comme l’hébreu, la qualification rituelle d’« impur » portée par le contexte.
  issues:
  - severity: low
    issue: Nuance de classification alimentaire
    rationale: « Qui vous servent de nourriture » décrit plus spontanément une fonction ou un usage effectif. « Dont vous pouvez vous nourrir » rend plus précisément l’idée d’animaux permis comme nourriture.
  - severity: low
    issue: Note littérale imprécise
    rationale: La formulation « qui est pour vous comme nourriture » n’est pas une restitution littérale exacte de לָכֶם לְאָכְלָה. La note doit indiquer « qui est pour vous comme nourriture » seulement comme paraphrase, ou mieux donner « qui est pour vous pour nourriture » avec une explication de l’idiome.
  revised_text: Et si l’une des bêtes dont vous pouvez vous nourrir meurt[a], celui qui touche son cadavre sera impur jusqu’au soir.
  revised_footnotes:
