  text: וְ/כִ֤י יָמוּת֙ מִן הַ/בְּהֵמָ֔ה אֲשֶׁר הִ֥יא לָ/כֶ֖ם לְ/אָכְלָ֑ה הַ/נֹּגֵ֥עַ בְּ/נִבְלָתָ֖/הּ יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/039.yaml
  text: And if any of the livestock that may be used for food dies[a], the one who touches its carcass shall be unclean until the evening.
translation:
  language: fr
  text: Et si l’une des bêtes dont vous pouvez vous nourrir meurt[a], celui qui touche son cadavre sera impur jusqu’au soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « qui est pour vous pour nourriture ». L’expression hébraïque désigne les animaux admis comme nourriture.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Et si
  rationale: Conserve à la fois le lien avec les prescriptions précédentes et la valeur conditionnelle de l’expression hébraïque.
- source_word: יָמוּת
  choice: meurt
  rationale: Dans cette proposition conditionnelle, l’imparfait hébreu s’exprime naturellement par le présent en français.
- source_word: מִן הַבְּהֵמָה
  choice: une des bêtes
  rationale: Rend la valeur partitive de מִן. « Bêtes » désigne ici les animaux domestiques concernés, sans élargir indûment à tous les animaux.
- source_word: אֲשֶׁר הִיא לָכֶם לְאָכְלָה
  choice: qui vous servent de nourriture
  rationale: Formulation française naturelle qui maintient l’idée d’animaux destinés ou reconnus comme nourriture, plutôt que de décrire simplement l’acte de les manger.
- source_word: הַנֹּגֵעַ
  choice: celui qui touche
  rationale: Reproduit clairement le participe substantivé hébreu.
- source_word: בְּנִבְלָתָהּ
  choice: son cadavre
  rationale: נְבֵלָה désigne le corps mort de l’animal. « Cadavre » est précis et naturel dans ce contexte de pureté rituelle.
- source_word: יִטְמָא
  choice: sera impur
  rationale: Exprime l’état d’impureté rituelle résultant du contact, dans une formulation juridique claire.
- source_word: עַד הָעָרֶב
  choice: jusqu’au soir
  rationale: Rend de façon idiomatique la formule temporelle hébraïque avec son article défini.
theological_decisions:
- issue: Nature de l’impureté
  choice: impur
  alternative: deviendra impur rituellement
  rationale: Le contexte législatif indique l’impureté rituelle; l’ajout de « rituellement » n’est pas nécessaire dans le texte et expliciterait ce que l’hébreu laisse au contexte.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche de la formulation juridique hébraïque tout en étant naturelle; « jusqu’au soir » reprend la formule usuelle des lois de pureté.
