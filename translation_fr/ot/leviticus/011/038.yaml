source:
  edition: WLC
  text: וְ/כִ֤י יֻתַּן מַ֨יִם֙ עַל זֶ֔רַע וְ/נָפַ֥ל מִ/נִּבְלָתָ֖/ם עָלָ֑י/ו טָמֵ֥א ה֖וּא לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/038.yaml
  text: But if water is put on the seed[a], and any of their carcasses falls on it, it is unclean to you.
translation:
  language: fr
  text: Mais si l’on met de l’eau sur la semence et que l’un de leurs cadavres[a] tombe sur elle, elle est impure pour vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dépouilles ». Le mot hébreu désigne le cadavre d’un animal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Mais si
  rationale: Introduit un cas conditionnel qui contraste avec celui du verset précédent.
- source_word: יֻתַּן מַיִם עַל זֶרַע
  choice: si l’on met de l’eau sur la semence
  rationale: La tournure impersonnelle française rend naturellement le passif hébreu sans ajouter l’idée plus interprétative d’« humidifier ».
- source_word: וְנָפַל
  choice: et que … tombe
  rationale: Le présent convient au style juridique d’un cas général et s’enchaîne naturellement avec la condition.
- source_word: מִנִּבְלָתָם
  choice: l’un de leurs cadavres
  rationale: Le מן est compris au sens partitif. נְבֵלָה désigne le cadavre d’un animal; « cadavre » convient au contexte des lois de pureté.
- source_word: עָלָיו
  choice: dessus
  rationale: Renvoie à la semence et évite une répétition lourde.
- source_word: טָמֵא הוּא לָכֶם
  choice: elle est impure pour vous
  rationale: « Impure » exprime ici une catégorie rituelle, non une faute morale. Le pronom féminin renvoie naturellement à « la semence » en français.
theological_decisions:
- issue: Nature de l’impureté
  choice: impureté rituelle (« impure »)
  alternative: souillée
  rationale: Le contexte porte sur le statut lévitique de pureté; « impure » conserve cette catégorie sans suggérer nécessairement une culpabilité morale.
translation_notes:
  register: Français moderne, clair et digne. La formulation impersonnelle « si l’on met » est idiomatique, et « elle » reprend sans ambiguïté « la semence ».
