id: LEV.11.20
reference: Leviticus 11:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּ֚ל שֶׁ֣רֶץ הָ/ע֔וֹף הַ/הֹלֵ֖ךְ עַל אַרְבַּ֑ע שֶׁ֥קֶץ ה֖וּא לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/020.yaml
  text: Every swarming winged creature that walks on four feet is detestable to you[a][b][c].
translation:
  language: fr
  text: Toute petite créature ailée[a] qui se déplace sur quatre pattes[b] vous est répugnante[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute petite créature volante ». Le mot hébreu peut désigner largement les êtres qui volent, et non seulement les oiseaux.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « qui va sur quatre ». L’expression décrit un déplacement sur quatre pattes; les versets suivants font exception pour certains insectes munis de pattes adaptées au saut.
    reason: cultural_note
  - marker: c
    text: Ou « est une abomination pour vous ». Ici, le terme désigne ce qui est rituellement répugnant dans le cadre des prescriptions alimentaires.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Toute
  rationale: Le singulier distributif exprime que chaque membre de cette catégorie est concerné.
- source_word: שֶׁרֶץ
  choice: petite créature
  rationale: Le nom désigne ici une petite bête qui pullule ou grouille. « Petite créature » reste naturel et digne, sans reprendre le traditionnel « reptile », trompeur dans ce contexte.
- source_word: הָעוֹף
  choice: ailée
  rationale: עוֹף peut désigner largement ce qui vole, et non seulement les oiseaux. « Ailée » convient ici aux insectes visés par le contexte sans réduire le terme à une catégorie zoologique moderne.
- source_word: הַהֹלֵךְ
  choice: qui se déplace
  rationale: Le participe décrit le mode habituel de locomotion. « Se déplace » évite de suggérer trop strictement une démarche humaine tout en conservant le sens de הלך.
- source_word: עַל אַרְבַּע
  choice: sur quatre pattes
  rationale: Cette expression rend de près l’hébreu « sur quatre » et désigne la locomotion au moyen de quatre membres; les versets suivants précisent l’exception relative à certaines pattes sauteuses.
- source_word: שֶׁקֶץ
  choice: répugnante
  rationale: Dans les prescriptions alimentaires, le terme désigne ce qui doit inspirer le dégoût et être rejeté sur le plan rituel. « Répugnante » conserve cette force sans imposer les connotations morales plus larges d’« abominable ».
- source_word: לָכֶם
  choice: vous est
  rationale: 'La construction exprime la relation à Israël: ces créatures doivent être tenues pour répugnantes par les destinataires.'
theological_decisions:
- issue: Portée rituelle de שֶׁקֶץ
  choice: vous est répugnante
  alternative: est une abomination pour vous
  rationale: Le choix maintient la forte désapprobation propre aux lois alimentaires sans transformer explicitement cette qualification rituelle en jugement moral général.
translation_notes:
  register: Français international moderne, clair et digne. « Petite créature ailée » évite le faux sens zoologique de « reptile volant »; « pattes » convient mieux que « pieds » aux animaux concernés.
