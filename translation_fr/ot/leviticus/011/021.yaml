  text: אַ֤ךְ אֶת זֶה֙ תֹּֽאכְל֔וּ מִ/כֹּל֙ שֶׁ֣רֶץ הָ/ע֔וֹף הַ/הֹלֵ֖ךְ עַל אַרְבַּ֑ע אֲשֶׁר לא כְרָעַ֨יִם֙ מִ/מַּ֣עַל לְ/רַגְלָ֔י/ו לְ/נַתֵּ֥ר בָּ/הֵ֖ן עַל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/021.yaml
  text: 'Yet these you may eat from all the swarming things that fly[b][a], that go on all fours: those that have jointed legs above their feet to hop on the ground with them.'
translation:
  language: fr
  text: Toutefois, parmi toutes les petites bêtes ailées qui se déplacent à quatre pattes, vous pourrez manger celles qui ont[a], au-dessus de leurs pieds, des pattes pour sauter[b] sur le sol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le texte écrit, la tradition textuelle hébraïque porte littéralement « qui n’ont pas de pattes » ; la lecture traditionnelle, confirmée par le contexte et les versions anciennes, est « qui ont des pattes ».
    reason: textual_variant
  - marker: b
    text: Ou « des pattes sauteuses » ; le terme hébreu désigne ici les pattes spécialisées qui servent à sauter.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Toutefois
  rationale: Marque l’exception à l’interdiction précédente tout en conservant un contraste naturel en français moderne.
- source_word: אֶת זֶה תֹּאכְלוּ
  choice: vous pourrez manger celles
  rationale: Dans ce contexte juridique, l’imparfait hébreu exprime une permission. Le singulier formel introduit une catégorie, d’où le pluriel idiomatique en français.
- source_word: מִכֹּל שֶׁרֶץ הָעוֹף
  choice: parmi toutes les petites bêtes ailées qui pullulent
  rationale: שֶׁרֶץ désigne des créatures qui grouillent ou pullulent, tandis que הָעוֹף précise ici qu’elles sont ailées. Cette formulation conserve la catégorie zoologique large sans employer « oiseaux ».
- source_word: הַהֹלֵךְ עַל אַרְבַּע
  choice: qui marchent à quatre pattes
  rationale: Rend directement la description hébraïque du déplacement, même si elle ne correspond pas à la terminologie zoologique moderne des insectes.
- source_word: אֲשֶׁר לוֹא כְרָעַיִם
  choice: celles qui ont des pattes articulées
  rationale: Le texte écrit porte לֹא (« ne… pas »), mais la lecture traditionnelle לוֹ (« qui a »), le contexte et les versions anciennes soutiennent le sens positif. כְרָעַיִם désigne ici les pattes spécialisées servant au saut.
- source_word: מִמַּעַל לְרַגְלָיו
  choice: au-dessus de leurs pieds
  rationale: Conserve l’image anatomique du texte, selon laquelle les membres sauteurs sont placés au-dessus des pieds ordinaires.
- source_word: לְנַתֵּר בָּהֵן עַל הָאָרֶץ
  choice: leur permettant de sauter sur le sol
  rationale: Exprime naturellement en français la fonction de ces pattes et le mouvement décrit par le verbe hébreu.
theological_decisions: []
