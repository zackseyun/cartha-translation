  text: וְ/כִ֤י יִפֹּל֙ מִ/נִּבְלָתָ֔/ם עַל כָּל זֶ֥רַע זֵר֖וּעַ אֲשֶׁ֣ר יִזָּרֵ֑עַ טָה֖וֹר הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/037.yaml
  text: And if any of their carcass falls on any seed for sowing that is to be sown[a], it is clean.
translation:
  language: fr
  text: Et si une partie de l’une de leurs carcasses[a] tombe sur une semence destinée à être semée, celle-ci est pure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu « de leur carcasse » peut être compris de façon partitive (« une partie de l’une de leurs carcasses ») ou collectivement (« quelque chose provenant de leurs carcasses »).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Et si
  rationale: Introduit un nouveau cas juridique tout en maintenant le lien avec les prescriptions précédentes.
- source_word: יִפֹּל
  choice: tombe
  rationale: Dans cette formulation conditionnelle, le présent français exprime naturellement le cas envisagé.
- source_word: מִנִּבְלָתָם
  choice: une partie de leur cadavre
  rationale: La préposition מִן a ici une valeur partitive. Le singulier « cadavre » respecte la forme hébraïque, tandis que « une partie de » rend la construction intelligible en français.
- source_word: כָּל זֶרַע זֵרוּעַ אֲשֶׁר יִזָּרֵעַ
  choice: une semence destinée à être semée
  rationale: « Une semence » a une valeur indéfinie dans ce cas juridique; « destinée à être semée » restitue le caractère prospectif de la proposition et la répétition sémantique de la racine liée aux semailles sans produire une lourdeur artificielle.
- source_word: טָהוֹר הוּא
  choice: celle-ci est pure
  rationale: « Celle-ci » renvoie sans ambiguïté à la semence. « Pure » est le terme français usuel pour la catégorie rituelle opposée à « impure » dans le Lévitique; le texte hébreu dit simplement qu’elle est pure, sans expliciter « reste ».
theological_decisions:
- issue: Nature de la pureté affirmée
  choice: pure
  alternative: propre
  rationale: Le contexte concerne le statut rituel, non la propreté matérielle. « Pure » conserve cette distinction sans ajouter d’explication doctrinale.
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve le caractère casuistique de la loi, évite une répétition peu naturelle autour de « semer » et explicite seulement ce qui est nécessaire pour rendre la construction partitive hébraïque intelligible.
