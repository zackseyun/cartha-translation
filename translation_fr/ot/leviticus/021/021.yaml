  text: כָּל אִ֞ישׁ אֲשֶׁר בּ֣/וֹ מ֗וּם מִ/זֶּ֨רַע֙ אַהֲרֹ֣ן הַ/כֹּהֵ֔ן לֹ֣א יִגַּ֔שׁ לְ/הַקְרִ֖יב אֶת אִשֵּׁ֣י יְהוָ֑ה מ֣וּם בּ֔/וֹ אֵ֚ת לֶ֣חֶם אֱלֹהָ֔י/ו לֹ֥א יִגַּ֖שׁ לְ/הַקְרִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/021.yaml
  text: No man from the offspring of Aaron the priest who has a defect shall come near to offer the food offerings of Yahweh[a]. A defect is in him[b]; he shall not come near to offer the bread of his God.
translation:
  language: fr
  text: 'Aucun homme de la descendance d’Aaron, le prêtre, qui a un défaut ne s’approchera pour offrir les offrandes consumées par le feu de Yahweh[a]. Il a un défaut : il ne s’approchera pas pour offrir le pain de son Dieu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les offrandes alimentaires de Yahweh ».
    reason: lexical_alternative
  - marker: b
    text: « Le pain de son Dieu » est une expression sacerdotale désignant la nourriture présentée à Dieu en sacrifice ; on peut aussi traduire « la nourriture de son Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ ... לֹא
  choice: Aucun homme ... ne
  rationale: La combinaison de כָּל אִישׁ avec la négation exprime une interdiction universelle. « Aucun homme » conserve le masculin requis par le contexte des prêtres descendants d’Aaron.
- source_word: מִזֶּרַע אַהֲרֹן הַכֹּהֵן
  choice: de la descendance du prêtre Aaron
  rationale: זֶרַע désigne ici la lignée. Cette formulation est naturelle en français et rattache clairement le titre de prêtre à Aaron.
- source_word: מוּם
  choice: défaut
  rationale: Dans ce contexte sacerdotal, le terme désigne une particularité corporelle entraînant l’exclusion de certaines fonctions cultuelles. « Défaut » traduit sobrement le terme juridique sans ajouter une qualification absente de l’hébreu.
- source_word: יִגַּשׁ
  choice: s’approchera
  rationale: Le verbe désigne l’approche cultuelle en vue du service sacrificiel. La même traduction est conservée lors de sa répétition.
- source_word: לְהַקְרִיב
  choice: pour offrir
  rationale: Dans le contexte sacrificiel, le hifil de קרב signifie présenter ou offrir une offrande.
- source_word: אִשֵּׁי יְהוָה
  choice: les mets présentés à Yahweh
  rationale: אִשֶּׁה est un terme sacrificiel traditionnellement associé au feu, mais il peut désigner ce qui est présenté à Dieu comme nourriture. « Mets présentés » maintient le parallèle avec לֶחֶם tout en évitant de préciser un mode de combustion que le terme ne décrit pas nécessairement à lui seul.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu directement par « Yahweh ».
- source_word: לֶחֶם אֱלֹהָיו
  choice: le pain de son Dieu
  rationale: לֶחֶם signifie littéralement « pain » et sert ici d’expression sacerdotale pour la nourriture sacrificielle présentée à Dieu. Le sens concret est conservé dans le texte et expliqué en note.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Portée de l’expression אִשֵּׁי יְהוָה
  choice: les mets présentés à Yahweh
  alternative: les offrandes consumées par le feu pour Yahweh
  rationale: Le contexte établit un parallèle avec « le pain de son Dieu ». Le texte principal conserve cette imagerie alimentaire, tandis que la traduction traditionnelle liée au feu est signalée en note afin de préserver l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation juridique reste ferme, la répétition de « défaut » et de « s’approchera » reproduit la structure insistante de l’hébreu, et les deux notes rendent explicites les principaux enjeux lexicaux sans résoudre artificiellement leur ambiguïté.
