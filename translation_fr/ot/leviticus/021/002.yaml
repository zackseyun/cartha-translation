  text: כִּ֚י אִם לִ/שְׁאֵר֔/וֹ הַ/קָּרֹ֖ב אֵלָ֑י/ו לְ/אִמּ֣/וֹ וּ/לְ/אָבִ֔י/ו וְ/לִ/בְנ֥/וֹ וּ/לְ/בִתּ֖/וֹ וּ/לְ/אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/002.yaml
  text: 'except for his close relative who is nearest to him: for his mother[a], for his father, for his son, for his daughter, and for his brother—'
translation:
  language: fr
  text: 'si ce n’est pour le parent[a] qui lui est le plus proche : pour sa mère, pour son père, pour son fils, pour sa fille et pour son frère —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu שְׁאֵר signifie littéralement « chair » et peut désigner un parent proche ; on pourrait aussi traduire par « parent par le sang ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: si ce n’est pour
  rationale: Dans ce contexte juridique, l’expression introduit une exception à l’interdiction du verset précédent. Cette tournure rend naturellement sa valeur restrictive en français.
- source_word: שְׁאֵרוֹ
  choice: son proche parent
  rationale: שְׁאֵר désigne ici un membre de la parenté proche, avec le sens concret sous-jacent de « chair ». « Proche parent » est clair et naturel, tandis que la note conserve l’image hébraïque.
- source_word: הַקָּרֹב אֵלָיו
  choice: celui qui lui est le plus proche
  rationale: Cette formulation exprime la proximité familiale marquée par קָרֹב sans la réduire à une simple proximité affective ou géographique.
- source_word: לְאִמּוֹ וּלְאָבִיו וְלִבְנוֹ וּלְבִתּוֹ וּלְאָחִיו
  choice: pour sa mère, pour son père, pour son fils, pour sa fille et pour son frère
  rationale: La répétition de « pour » reproduit la chaîne des prépositions לְ et maintient la précision de l’énumération juridique.
