  text: וְ/לֹֽא יְחַלֵּ֥ל זַרְע֖/וֹ בְּ/עַמָּ֑י/ו כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשֽׁ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/015.yaml
  text: He shall not profane his offspring among his people[c][b][a], for I am Yahweh who sanctifies him.
translation:
  language: fr
  text: Il ne profanera pas sa descendance parmi son peuple[a], car moi, Yahweh, je le sanctifie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne souillera pas sa descendance » ou « ne déshonorera pas sa descendance ». Dans ce contexte, la violation des règles matrimoniales entraînerait la profanation de sa lignée au sein du peuple.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: Ou « qui le rend saint » ou « qui le consacre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַלֵּל
  choice: profanera
  rationale: Le piel de חלל signifie ici rendre profane ce qui doit être saint. « Profaner » conserve précisément le vocabulaire de sainteté propre au contexte sacerdotal.
- source_word: זַרְעוֹ
  choice: sa descendance
  rationale: זֶרַע désigne ici la postérité ou la lignée issue du grand prêtre. « Sa descendance » est naturel en français moderne et maintient la portée généalogique sans le littéralisme ambigu de « sa semence ».
- source_word: בְּעַמָּיו
  choice: au milieu de son peuple
  rationale: La préposition ב avec עַם et le suffixe masculin singulier situe la profanation dans le peuple auquel il appartient. « Au milieu de son peuple » restitue directement ce cadre communautaire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » conserve le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: מְקַדְּשׁוֹ
  choice: qui le sanctifie
  rationale: Le participe piel de קדשׁ exprime l’action de rendre saint ou de mettre à part comme saint. « Sanctifie » préserve le lien lexical avec la sainteté et la portée continue du participe.
theological_decisions:
- issue: Portée de la profanation de la descendance
  choice: Conserver la formulation générale selon laquelle le grand prêtre ne doit pas profaner sa descendance au milieu de son peuple.
  alternative: Préciser qu’un mariage interdit disqualifierait sa lignée du sacerdoce.
  rationale: Le contexte immédiat concerne les restrictions matrimoniales du grand prêtre, mais le verset ne formule pas explicitement une disqualification sacerdotale. La traduction garde donc l’expression plus large du texte hébreu sans résoudre cette implication dans le corps du verset.
- issue: Référent du suffixe dans מְקַדְּשׁוֹ
  choice: « le » renvoie au prêtre, que Yahweh sanctifie.
  alternative: Comprendre la proposition comme visant plus largement la sanctification attachée à sa fonction ou à sa lignée.
  rationale: Le suffixe masculin singulier renvoie le plus naturellement au grand prêtre, sujet de la prescription. La traduction conserve ce référent grammatical sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur à valeur prescriptive correspond au style juridique du passage. « Profaner » et « sanctifier » maintiennent l’opposition lexicale et théologique du texte hébreu.
