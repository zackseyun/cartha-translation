base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/020.yaml
  text: or hunchbacked[a], or dwarfed, or with a defect in his eye, or with an itch, or with scabs[d][c][b], or with crushed testicles.
translation:
  language: fr
  text: ou bossu[a], ou chétif[b], ou atteint d’une anomalie à l’œil[c], ou atteint d’une affection cutanée irritante, ou atteint d’une affection cutanée squameuse[d], ou ayant les testicules écrasés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ayant le dos courbé »; le terme désigne probablement une déformation du dos.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu est incertain; il peut désigner une personne de très petite taille, frêle ou amaigrie.
    reason: lexical_alternative
  - marker: c
    text: Ou « ayant une tache dans l’œil »; la nature exacte de l’anomalie oculaire est incertaine.
    reason: lexical_alternative
  - marker: d
    text: Les deux termes hébreux désignent probablement des affections cutanées différentes, mais leurs diagnostics modernes précis sont incertains.
    reason: cultural_note
lexical_decisions:
- source_word: גִבֵּן
  choice: bossu
  rationale: Le terme désigne vraisemblablement une déformation ou une courbure marquée du dos. « Bossu » est direct, courant et adapté à cette liste de caractéristiques physiques.
- source_word: דַק
  choice: chétif
  rationale: Le sens exact est incertain; dans ce contexte, le mot peut évoquer une constitution anormalement petite, frêle ou amaigrie. « Chétif » conserve cette relative indétermination mieux qu’un diagnostic précis.
- source_word: תְּבַלֻּל בְּעֵינוֹ
  choice: atteint d’une anomalie à l’œil
  rationale: L’expression indique une atteinte oculaire, peut-être une tache visible, mais sa nature médicale exacte demeure incertaine. La formulation générale évite une précision injustifiée.
- source_word: גָרָב
  choice: affection cutanée irritante
  rationale: Le terme désigne une maladie ou irritation de la peau, traditionnellement associée à des démangeaisons ou à la gale. Cette traduction reste intelligible sans imposer un diagnostic moderne.
- source_word: יַלֶּפֶת
  choice: affection cutanée squameuse
  rationale: Ce second terme cutané paraît distinct du précédent et peut évoquer une éruption, des croûtes ou des squames. La traduction marque la distinction tout en reconnaissant l’incertitude médicale.
- source_word: מְרוֹחַ אָשֶׁךְ
  choice: ayant les testicules écrasés
  rationale: L’expression se rapporte explicitement à une lésion des testicules. La traduction conserve le caractère concret et anatomique de l’hébreu sans recourir à un euphémisme.
- source_word: אוֹ
  choice: ou
  rationale: La conjonction répétée introduit chaque élément de la liste; sa répétition est conservée pour respecter la structure du texte.
theological_decisions:
- issue: Terminologie des particularités corporelles dans une loi concernant le service sacerdotal
  choice: Employer un langage physique direct, sans atténuation euphemistique ni jugement moral ajouté.
  alternative: Employer des euphémismes ou des diagnostics médicaux techniques.
  rationale: Le verset énumère des états corporels ayant une incidence sur l’accès à certaines fonctions sacerdotales; il ne les présente pas comme des fautes morales. La traduction doit préserver cette distinction et ne pas résoudre artificiellement l’incertitude lexicale.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe répétitive de l’énumération hébraïque est maintenue. Les termes médicaux trop précis et les formulations moralisantes sont évités.
