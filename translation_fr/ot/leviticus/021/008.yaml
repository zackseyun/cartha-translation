id: LEV.21.8
reference: Leviticus 21:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/קִדַּשְׁתּ֔/וֹ כִּֽי אֶת לֶ֥חֶם אֱלֹהֶ֖י/ךָ ה֣וּא מַקְרִ֑יב קָדֹשׁ֙ יִֽהְיֶה לָּ֔/ךְ כִּ֣י קָד֔וֹשׁ אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/008.yaml
  text: You shall treat him as holy[a], because he offers the food of your God. He shall be holy to you, for I, Yahweh who sanctify you, am holy.
translation:
  language: fr
  text: Tu le traiteras comme saint, car il offre la nourriture de ton Dieu[a]. Il sera saint pour toi, car moi, Yahweh, qui vous sanctifie, je suis saint.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le pain de ton Dieu ». Ici, le « pain » désigne probablement, de façon plus générale, les offrandes alimentaires présentées à Dieu.'
    reason: alternative lexicale et clarification du sens cultuel
lexical_decisions:
- source_word: וְקִדַּשְׁתּוֹ
  choice: Tu le traiteras comme saint
  rationale: Le piel de קדשׁ avec suffixe objet signifie mettre à part comme saint ou tenir pour saint. Dans cette adresse à Israël au sujet du prêtre, « traiter comme saint » exprime naturellement l’attitude commandée sans suggérer que le peuple accomplit lui-même un rite de consécration.
- source_word: לֶחֶם אֱלֹהֶיךָ
  choice: la nourriture de ton Dieu
  rationale: לֶחֶם signifie littéralement « pain », mais peut désigner plus largement la nourriture, notamment les offrandes alimentaires dans le contexte sacerdotal. La traduction principale rend ce sens cultuel plus large, tandis que la note conserve l’image littérale.
- source_word: מַקְרִיב
  choice: il offre
  rationale: Dans un contexte sacrificiel, le participe hiphil de קרב désigne l’action de présenter une offrande à Dieu. « Offre » est ici clair, naturel et précis.
- source_word: קָדֹשׁ יִהְיֶה לָּךְ
  choice: Il sera saint pour toi
  rationale: Cette formulation conserve la répétition de « saint » ainsi que la relation exprimée par לְ entre le prêtre et la personne à qui le commandement s’adresse.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, ce qui préserve son caractère de nom propre dans le texte hébreu.
- source_word: מְקַדִּשְׁכֶם
  choice: qui vous sanctifie
  rationale: Le participe de קדשׁ reprend la racine employée au début du verset. « Sanctifie » conserve ce lien lexical et indique que c’est Yahweh qui rend son peuple saint.
theological_decisions:
- issue: Sens cultuel de לֶחֶם אֱלֹהֶיךָ
  choice: la nourriture de ton Dieu
  alternative: le pain de ton Dieu
  rationale: Le contexte concerne le service sacrificiel du prêtre ; « nourriture » rend donc probablement mieux l’extension cultuelle du mot, sans effacer son sens littéral, signalé en note.
- issue: Répétition de la racine קדשׁ
  choice: saint / sanctifie
  alternative: consacré / consacre
  rationale: 'Le choix retenu maintient la cohésion théologique du verset : le prêtre doit être tenu pour saint, cette exigence étant fondée sur la sainteté de Yahweh et sur son action sanctifiante.'
- issue: Passage du singulier au pluriel dans l’adresse
  choice: « ton / toi » puis « vous »
  alternative: uniformiser toute l’adresse au singulier ou au pluriel
  rationale: L’hébreu passe réellement du singulier dans אֱלֹהֶיךָ et לָּךְ au pluriel dans מְקַדִּשְׁכֶם. Le français conserve cette variation plutôt que de l’harmoniser silencieusement.
translation_notes:
  register: Français international actuel, digne et accessible. Le tutoiement singulier traduit l’adresse grammaticale au singulier dans la majeure partie du verset, tandis que « vous sanctifie » préserve le passage final au pluriel. La formulation conserve les répétitions de « saint » et le nom divin Yahweh.
