  text: or a man who has a broken foot or a broken hand,[a]
translation:
  language: fr
  text: ou un homme qui a le pied cassé ou la main cassée,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un homme qui a une fracture du pied ou une fracture de la main ».
    reason: Alternative lexicale plus formelle, qui rend שֶׁבֶר par le nom « fracture ».
lexical_decisions:
- source_word: אוֹ
  choice: ou
  rationale: Conjonction disjonctive simple qui poursuit la liste des défauts physiques.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom masculin singulier désigne ici un homme appartenant au cadre sacerdotal masculin du passage.
- source_word: אֲשֶׁר יִהְיֶה בוֹ
  choice: qui a
  rationale: La tournure hébraïque signifie littéralement « en qui il y a »; « qui a » est son équivalent idiomatique naturel en français.
- source_word: שֶׁבֶר
  choice: cassé
  rationale: Le nom désigne une fracture. La tournure courante « le pied cassé » ou « la main cassée » restitue naturellement cette condition sans adopter un registre trop clinique.
- source_word: רָגֶל
  choice: pied
  rationale: « Pied » est le sens direct et ordinaire du terme; rien dans le contexte n'impose le sens élargi « jambe ».
- source_word: שֶׁבֶר יָד
  choice: la main cassée
  rationale: Cette traduction conserve la répétition de « fracture » sous une forme française naturelle et rend יָד par son sens direct « main », sans l'élargir à « bras ».
