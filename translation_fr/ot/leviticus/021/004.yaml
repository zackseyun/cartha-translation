  text: He shall not defile himself as a husband among his people[a], and so profane himself.
translation:
  language: fr
  text: Il ne se rendra pas impur comme mari parmi les siens et ne se profanera pas ainsi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Il ne se rendra pas impur en homme de haut rang parmi son peuple et ne se profanera pas ainsi. » La proposition hébraïque est difficile ; certains y voient plus généralement l’interdiction de se rendre impur en raison de sa position éminente au sein du peuple, plutôt qu’une référence précise au mari.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִטַּמָּא
  choice: se rendra impur
  rationale: Le hitpael à l’inaccompli de טמא désigne ici l’impureté rituelle contractée au contact d’un mort. « Se rendre impur » est naturel en français et conserve explicitement la catégorie rituelle.
- source_word: בַּעַל
  choice: mari
  rationale: Dans cette proposition difficile, le sens relationnel « mari » s’accorde avec le contexte immédiat, qui énumère les proches pour lesquels un prêtre peut contracter l’impureté funéraire. Le mot peut toutefois aussi désigner un maître ou un homme de haut rang.
- source_word: בְּעַמָּיו
  choice: parmi les siens
  rationale: Littéralement « parmi ses peuples/son peuple ». Dans ce contexte familial et funéraire, « les siens » rend naturellement l’appartenance au groupe de parenté sans préciser davantage que l’hébreu.
- source_word: לְהֵחַלּוֹ
  choice: se profanant ainsi
  rationale: L’infinitif construit exprime ici probablement le résultat ou le but. « Se profaner » maintient le vocabulaire de la distinction entre saint et profane propre au contexte sacerdotal.
theological_decisions:
- issue: Interprétation de la proposition difficile בַּעַל בְּעַמָּיו
  choice: Le prêtre ne doit pas se rendre impur en qualité de mari parmi les siens.
  alternative: 'Il ne se rendra pas impur en homme de haut rang parmi son peuple ; ou, plus généralement : il ne se rendra pas impur parmi son peuple, de peur de se profaner.'
  rationale: La syntaxe hébraïque est condensée et son interprétation demeure incertaine. Le sens courant « mari » pour בַּעַל et le contexte des exceptions fondées sur la parenté soutiennent le texte principal, mais les autres lectures importantes sont conservées en note.
translation_notes:
  register: Français moderne, digne et accessible. « Parmi les siens » exprime idiomatiquement la nuance de groupe familial ou communautaire, tandis que la note préserve l’ambiguïté réelle de l’hébreu.
