  source_fidelity: Le texte principal retient de façon recevable le sens relationnel possible de בַּעַל (« mari »), tout en conservant en note l’importante lecture « homme de haut rang / chef ». La construction infinitive לְהֵחַלּוֹ exprime la conséquence ou le résultat de l’impureté et ne se rend pas au mieux par le participe français « se profanant ainsi », qui laisse le lien logique insuffisamment explicite.
  naturalness: « En tant que mari parmi les siens » est compréhensible mais un peu administratif. « Comme mari parmi les siens » est plus direct dans un registre biblique français moderne. Une seconde proposition verbale négative est également plus naturelle que le participe final.
