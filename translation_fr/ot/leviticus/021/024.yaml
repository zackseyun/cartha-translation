  text: So Moses spoke to Aaron and to his sons and to all the sons of Israel[a].
translation:
  language: fr
  text: Moïse parla à Aaron, à ses fils et à tous les Israélites[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël » ; traduction traditionnelle : « les enfants d’Israël ». Il s’agit d’une désignation habituelle du peuple d’Israël.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla donc
  rationale: Le wayyiqtol fait progresser le récit et, à la fin de cette section, peut avoir une valeur conclusive. « Parla donc » rend cette nuance dans un français naturel.
- source_word: אֶל
  choice: à
  rationale: La préposition introduit ici les destinataires de la parole de Moïse ; « à » est la tournure française directe.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le nom est un pluriel masculin avec suffixe de troisième personne masculine singulière et désigne précisément les fils d’Aaron.
- source_word: כָּל
  choice: tous
  rationale: כָּל englobe ici l’ensemble du groupe désigné ensuite.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Littéralement « les fils d’Israël », cette expression hébraïque est une désignation collective habituelle du peuple. « Les Israélites » transmet naturellement sa référence en français moderne, tandis que la forme littérale est signalée en note.
theological_decisions:
- issue: Rendu de la désignation d’alliance בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël ; les enfants d’Israël
  rationale: Aucun enjeu doctrinal particulier n’impose une traduction littérale. Dans cet emploi collectif, l’expression désigne le peuple d’Israël dans son ensemble ; « les Israélites » est clair et idiomatique, tandis que la note conserve la forme hébraïque et sa portée traditionnelle.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition hébraïque de אֶל est allégée après le premier complément conformément à l’usage français, sans perte de sens.
