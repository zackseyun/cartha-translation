  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה אֱמֹ֥ר אֶל הַ/כֹּהֲנִ֖ים בְּנֵ֣י אַהֲרֹ֑ן וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם לְ/נֶ֥פֶשׁ לֹֽא יִטַּמָּ֖א בְּ/עַמָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/001.yaml
  text: 'And Yahweh said to Moses[a], “Speak to the priests, the sons of Aaron[b], and say to them: None shall make himself unclean for a dead person among his people,”'
translation:
  language: fr
  text: 'Yahweh dit à Moïse : « Parle aux prêtres, fils d’Aaron, et dis-leur : Aucun d’eux ne se rendra impur pour un mort parmi les siens.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour une personne » ; dans ce contexte de pureté rituelle, le terme hébreu désigne une personne morte, c’est-à-dire un cadavre. La dernière expression peut aussi se traduire par « parmi son peuple » ou « parmi ses proches ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱמֹר ... וְאָמַרְתָּ
  choice: Parle… et dis-leur
  rationale: Conserve la répétition du verbe אמר tout en produisant une formulation française naturelle.
- source_word: הַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: les prêtres, fils d’Aaron
  rationale: Rend l’apposition hébraïque et préserve la désignation familiale sans imposer ici le sens plus large de « descendants ».
- source_word: לְנֶפֶשׁ
  choice: au contact d’un mort
  rationale: Dans cette loi de pureté, נֶפֶשׁ désigne idiomatiquement une personne morte; l’ajout contextuel « au contact de » explicite la manière habituelle de contracter cette impureté sans employer le mot trompeur « âme ».
- source_word: יִטַּמָּא
  choice: ne se rendra impur
  rationale: Exprime la nuance réflexive et l’impureté rituelle, sans suggérer nécessairement une faute morale.
- source_word: בְּעַמָּיו
  choice: parmi les siens
  rationale: Rend naturellement l’idée d’appartenance au peuple ou au groupe de parenté du prêtre, tandis que les versets suivants précisent les proches concernés.
theological_decisions:
- issue: Nature de l’impureté dans la législation sacerdotale
  choice: 'Employer le vocabulaire de l’impureté rituelle : « ne se rendra impur »'
  alternative: « ne se souillera pas »
  rationale: Le contexte concerne l’impureté contractée à cause d’un mort, et non directement une corruption morale.
- issue: Portée du sujet implicite de יִטַּמָּא
  choice: « Aucun d’eux » renvoie collectivement aux prêtres interpellés
  alternative: « Il ne se rendra pas impur »
  rationale: Le verbe hébreu est au singulier distributif après une adresse plurielle; « aucun d’eux » rend clairement cette portée en français.
translation_notes:
  register: Français moderne, digne et accessible. La tournure « aucun d’eux » rend le singulier distributif hébreu dans l’adresse collective. « Au contact d’un mort » privilégie la clarté contextuelle; la note conserve l’idiome et l’ambiguïté de בְּעַמָּיו.
