  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/016.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Yahweh parla à Moïse[a] en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement remplacé par un titre tel que « le Seigneur ».'
    reason: Signaler la forme hébraïque du nom divin et son rendu traditionnel.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר dans cette formule narrative introduit une nouvelle parole divine. « Parla » conserve cette valeur tout en restant naturel et digne en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte hébreu porte directement le nom divin YHWH. La forme « Yahweh » le rend comme un nom propre plutôt que de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition indique ici le destinataire de la parole ; « à » est l’équivalent français idiomatique.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom hébreu מֹשֶׁה.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Dans une formule introductive de discours, « en ces termes » annonce naturellement en français le contenu de la parole qui suit, sans reproduire le calque peu idiomatique « disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le verset emploie le tétragramme comme nom propre. « Yahweh » préserve explicitement ce nom, tandis que « le SEIGNEUR » lui substitue un titre et que « Jéhovah » repose sur une vocalisation tardive.
translation_notes:
  register: Français international moderne, naturel et digne. La formule « parla à Moïse en ces termes » conserve la solennité de l’introduction hébraïque tout en évitant le calque « disant ».
