  text: לֶ֣חֶם אֱלֹהָ֔י/ו מִ/קָּדְשֵׁ֖י הַ/קֳּדָשִׁ֑ים וּ/מִן הַ/קֳּדָשִׁ֖ים יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/022.yaml
  text: He may eat the food of his God[a], from the most holy things and from the holy things.
translation:
  language: fr
  text: Il peut manger la nourriture de son Dieu[a], aussi bien des choses très saintes que des choses saintes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le pain de son Dieu ». Ici, « pain » désigne de manière générale les portions alimentaires réservées aux prêtres.'
    reason: alternative lexicale et explication de l’emploi idiomatique
lexical_decisions:
- source_word: לֶחֶם
  choice: nourriture
  rationale: Bien que le nom signifie littéralement « pain », il désigne ici, dans le contexte sacrificiel et sacerdotal, les portions alimentaires consacrées en général. « Nourriture » évite de limiter le sens au pain proprement dit.
- source_word: אֱלֹהָיו
  choice: de son Dieu
  rationale: Le suffixe masculin singulier renvoie au prêtre. Cette formulation conserve le rapport possessif et l’expression d’alliance de l’hébreu.
- source_word: מִקָּדְשֵׁי הַקֳּדָשִׁים
  choice: des choses très saintes
  rationale: La construction exprime le degré supérieur de sainteté et désigne la catégorie cultuelle des biens très saints. Cette traduction maintient la distinction juridique sans ajouter explicitement « offrandes ».
- source_word: וּמִן הַקֳּדָשִׁים
  choice: que des choses saintes
  rationale: Cette seconde expression désigne l’autre catégorie de biens consacrés. La répétition de « saintes » préserve le lien lexical avec la première catégorie.
- source_word: יֹאכֵל
  choice: Il pourra manger
  rationale: 'Dans ce contexte légal, l’imparfait exprime une permission : malgré son infirmité, le prêtre conserve le droit de manger les portions consacrées. « Pourra » marque cette autorisation sans en faire une obligation.'
theological_decisions:
- issue: Valeur de l’imparfait יֹאכֵל dans la législation sacerdotale
  choice: permission (« il pourra manger »)
  alternative: futur simple (« il mangera ») ou obligation (« il devra manger »)
  rationale: Le contexte oppose les fonctions interdites au prêtre atteint d’une infirmité à son droit maintenu de consommer les portions sacrées. La valeur permissive rend cette tension juridique sans imposer une obligation absente du passage.
translation_notes:
  register: Français international moderne, clair et digne. « Aussi bien… que… » rend naturellement la double provenance exprimée en hébreu, tandis que « choses très saintes » et « choses saintes » conserve la distinction cultuelle sans surinterprétation.
