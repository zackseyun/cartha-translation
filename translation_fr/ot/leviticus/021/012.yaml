  text: וּ/מִן הַ/מִּקְדָּשׁ֙ לֹ֣א יֵצֵ֔א וְ/לֹ֣א יְחַלֵּ֔ל אֵ֖ת מִקְדַּ֣שׁ אֱלֹהָ֑י/ו כִּ֡י נֵ֠זֶר שֶׁ֣מֶן מִשְׁחַ֧ת אֱלֹהָ֛י/ו עָלָ֖י/ו אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/012.yaml
  text: And he shall not go out from the sanctuary[a], nor shall he profane the sanctuary of his God, because the consecration of the anointing oil of his God is upon him. I am Yahweh.
translation:
  language: fr
  text: Il ne sortira pas du sanctuaire et ne profanera pas le sanctuaire de son Dieu, car il porte sur lui la consécration[a] de l’huile d’onction de son Dieu. Je suis Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « le diadème de l’huile d’onction de son Dieu est sur lui ». Le mot hébreu peut désigner un diadème ou la consécration.'
    reason: alternative lexicale
lexical_decisions:
- source_word: וּמִן הַמִּקְדָּשׁ לֹא יֵצֵא
  choice: Il ne sortira pas du sanctuaire
  rationale: מִקְדָּשׁ désigne ici le lieu saint, le sanctuaire. Le futur à valeur prescriptive rend naturellement l’imparfait hébreu dans ce texte législatif, tandis que « sortira » conserve le sens concret de יָצָא.
- source_word: וְלֹא יְחַלֵּל
  choice: et ne profanera pas
  rationale: Au piel, חלל exprime ici l’action de traiter comme profane ce qui est saint. « Profaner » maintient clairement le contraste cultuel propre au Lévitique.
- source_word: אֵת מִקְדַּשׁ אֱלֹהָיו
  choice: le sanctuaire de son Dieu
  rationale: La répétition de « sanctuaire » reproduit l’insistance de l’hébreu et la construction possessive est rendue directement.
- source_word: נֵזֶר
  choice: la consécration
  rationale: נֵזֶר peut désigner un diadème ou l’état distinctif de consécration. Dans ce contexte sacerdotal, « consécration » exprime naturellement le statut conféré par l’onction, tout en conservant en note le sens concret possible de « diadème ».
- source_word: שֶׁמֶן מִשְׁחַת אֱלֹהָיו
  choice: l’huile d’onction de son Dieu
  rationale: Cette formulation française restitue clairement la chaîne construite hébraïque et emploie le terme cultuel usuel « huile d’onction ».
- source_word: עָלָיו
  choice: repose sur lui
  rationale: « Repose sur lui » rend la présence durable exprimée par עָלָיו dans un français naturel et solennel.
- source_word: אֲנִי יְהוָה
  choice: Je suis Yahvé
  rationale: Le nom divin personnel יהוה est translittéré sous la forme française courante « Yahvé », et la formule d’autorité récurrente du Lévitique est conservée.
theological_decisions:
- issue: Sens de נֵזֶר appliqué au grand prêtre
  choice: « la consécration » dans le texte principal
  alternative: « le diadème de l’huile d’onction de son Dieu »
  rationale: Le contexte donne à נֵזֶר la valeur du statut consacré attaché à l’onction, sans exclure l’image concrète du diadème. Le texte principal privilégie une formulation intelligible en français, et la note préserve l’ambiguïté lexicale réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe législative demeure ferme, la répétition de « sanctuaire » est conservée, et l’ambiguïté de נֵזֶר est signalée sans être effacée.
