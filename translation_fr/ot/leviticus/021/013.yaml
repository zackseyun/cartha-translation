lexical_decisions:
- source_word: וְהוּא
  choice: Il
  rationale: Le pronom indépendant explicite et met légèrement en relief le sujet dans la continuité du discours. En français, « Il » suffit naturellement; la coordination est portée par le contexte.
- source_word: אִשָּׁה
  choice: pour femme une femme
  rationale: Dans cette construction avec לקח, אִשָּׁה désigne la femme épousée. La tournure « prendre pour femme » rend explicitement le sens matrimonial tout en conservant l’idiome hébreu.
- source_word: בִּבְתוּלֶיהָ
  choice: vierge
  rationale: L’hébreu exprime littéralement l’état de virginité. Le français naturel rend ici cet état par l’adjectif « vierge », tandis que la formulation littérale est signalée en note.
- source_word: יִקָּח
  choice: prendra
  rationale: Le futur français convient à la prescription légale et préserve le verbe « prendre » de l’idiome matrimonial hébreu.
theological_decisions:
- issue: Terminologie matrimoniale dans la législation sacerdotale
  choice: Conserver l’idiome « prendre pour femme »
  alternative: Il épousera une vierge
  rationale: Cette formulation maintient la texture juridique et l’idiome matrimonial de l’hébreu sans ajouter de précision doctrinale.
- issue: Expression de la virginité
  choice: une femme vierge
  alternative: une femme dans sa virginité
  rationale: La traduction principale privilégie un français actuel et clair; la note conserve la forme plus littérale et l’ambiguïté de formulation du texte source.
translation_notes:
  register: Français moderne, digne et juridique. La tournure « prendre pour femme » reste compréhensible et conserve l’idiome du texte hébreu; l’adjectif « vierge » évite une formulation principale inutilement raide.
