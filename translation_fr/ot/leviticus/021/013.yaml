  text: And he shall take a wife in her virginity[a].
translation:
  language: fr
  text: Il prendra pour femme une vierge[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une femme dans sa virginité ».'
