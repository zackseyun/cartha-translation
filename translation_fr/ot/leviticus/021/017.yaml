source:
  edition: WLC
  text: דַּבֵּ֥ר אֶֽל אַהֲרֹ֖ן לֵ/אמֹ֑ר אִ֣ישׁ מִֽ/זַּרְעֲ/ךָ֞ לְ/דֹרֹתָ֗/ם אֲשֶׁ֨ר יִהְיֶ֥ה ב/וֹ֙ מ֔וּם לֹ֣א יִקְרַ֔ב לְ/הַקְרִ֖יב לֶ֥חֶם אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/017.yaml
  text: 'Speak to Aaron[b][a], saying: Any man from your offspring throughout their generations who has a defect shall not come near to offer the food of his God.'
translation:
  language: fr
  text: '« Parle à Aaron en ces termes : Dans toutes les générations à venir, tout homme parmi tes descendants qui a un défaut[a] ne s’approchera pas pour offrir la nourriture[b] de son Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un défaut corporel ». Dans ce contexte, le mot hébreu moum désigne un défaut physique qui exclut de cette fonction sacerdotale.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « le pain de son Dieu ». Dans ce contexte sacerdotal, ce terme désigne plus largement la nourriture offerte en sacrifice.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־אַהֲרֹן לֵאמֹר
  choice: Parle à Aaron et dis-lui
  rationale: Rend naturellement en français la formule hébraïque d’introduction du discours, sans conserver le calque lourd « en disant ».
- source_word: אִישׁ מִזַּרְעֲךָ
  choice: tout homme parmi tes descendants
  rationale: Le masculin est pertinent ici, puisque la disposition concerne les descendants mâles d’Aaron susceptibles d’exercer le service sacerdotal; « descendants » exprime naturellement l’idée de lignée portée par זֶרַע.
- source_word: לְדֹרֹתָם
  choice: dans toutes les générations à venir
  rationale: Exprime l’application durable de la règle aux générations successives de la lignée d’Aaron.
- source_word: אֲשֶׁר יִהְיֶה בוֹ מוּם
  choice: qui présente un défaut
  rationale: Formulation française actuelle et concise pour l’expression littérale « en qui il y aura un défaut »; le contexte sacerdotal indique un défaut physique entraînant cette restriction cultuelle.
- source_word: לֹא יִקְרַב
  choice: ne s’approchera pas
  rationale: Conserve le langage technique de l’approche du sanctuaire ainsi que la force normative de l’imparfait négatif.
- source_word: לְהַקְרִיב
  choice: pour offrir
  rationale: Dans le contexte sacrificiel, le hifil de קרב désigne l’action de présenter une offrande; « offrir » est l’équivalent français le plus idiomatique.
- source_word: לֶחֶם אֱלֹהָיו
  choice: la nourriture de son Dieu
  rationale: לֶחֶם signifie littéralement « pain », mais désigne ici plus largement la nourriture offerte dans le culte sacrificiel; une note conserve le sens littéral.
theological_decisions:
- issue: Restriction cultuelle concernant les prêtres présentant un défaut physique
  choice: Présenter la règle comme une interdiction de s’approcher afin d’accomplir cette fonction sacerdotale précise.
  alternative: Employer une formulation pouvant suggérer une exclusion générale de la communauté ou une faute morale.
  rationale: Le verset réglemente l’exercice d’une fonction cultuelle; il ne formule aucun jugement sur la culpabilité, la dignité ou l’appartenance à l’alliance de la personne concernée.
- issue: Portée de לֶחֶם אֱלֹהָיו
  choice: « la nourriture de son Dieu », avec le sens littéral en note
  alternative: « le pain de son Dieu »
  rationale: Le terme garde son image alimentaire tout en désignant, dans ce contexte sacerdotal, les aliments sacrificiels de manière plus large que le seul pain.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le vocabulaire cultuel de l’approche et de l’offrande, tout en évitant le calque hébraïque peu naturel « en disant ». Les notes précisent les deux expressions dont le sens contextuel dépasse leur rendu le plus littéral.
