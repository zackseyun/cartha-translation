reference: Leviticus 21:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: קְדֹשִׁ֤ים יִהְיוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם וְ/לֹ֣א יְחַלְּל֔וּ שֵׁ֖ם אֱלֹהֵי/הֶ֑ם כִּי֩ אֶת אִשֵּׁ֨י יְהוָ֜ה לֶ֧חֶם אֱלֹהֵי/הֶ֛ם הֵ֥ם מַקְרִיבִ֖ם וְ/הָ֥יוּ קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/006.yaml
  text: They shall be holy to their God and shall not profane the name of their God[a], because they present the food offerings of Yahweh, the food of their God; therefore they shall be holy.
translation:
  language: fr
  text: Ils seront saints pour leur Dieu et ne profaneront pas le nom de leur Dieu, car ils offrent les offrandes consumées par le feu de Yahweh, la nourriture de leur Dieu[a] ; et ils seront saints.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « les offrandes consumées par le feu de Yahweh, le pain de leur Dieu » ; « pain » peut ici désigner la nourriture au sens large.'
    reason: Conserver la formulation cultuelle littérale et la portée sémantique de לֶחֶם.
lexical_decisions:
- source_word: קְדֹשִׁים / קֹדֶשׁ
  choice: saints
  rationale: Le même champ lexical de la sainteté encadre le verset. « Saints » préserve cette répétition et l’opposition lévitique entre ce qui est saint et ce qui est profané.
- source_word: יִהְיוּ / וְהָיוּ
  choice: ils seront
  rationale: Dans ce contexte prescriptif, le futur français exprime naturellement l’obligation légale tout en restant proche des formes hébraïques.
- source_word: לֵאלֹהֵיהֶם
  choice: pour leur Dieu
  rationale: La préposition ל marque ici la relation de consécration à Dieu. « Pour leur Dieu » est plus naturel en français moderne que « à leur Dieu » après « saints ».
- source_word: יְחַלְּלוּ
  choice: profaneront
  rationale: Le piel de חלל désigne le fait de rendre profane ou de traiter comme commun. « Profaner » conserve précisément le contraste cultuel avec la sainteté.
- source_word: אִשֵּׁי יְהוָה
  choice: les offrandes consumées par le feu de Yahweh
  rationale: אִשֶּׁה est un terme sacrificiel lié aux offrandes faites par le feu. Cette formulation reste compréhensible tout en conservant la dimension cultuelle et l’ambiguïté du rapport exprimé par « de Yahweh ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin יהוה. Sa translittération préserve le nom propre au lieu de lui substituer un titre.
- source_word: לֶחֶם אֱלֹהֵיהֶם
  choice: la nourriture de leur Dieu
  rationale: לֶחֶם signifie littéralement « pain », mais peut désigner plus largement la nourriture dans ce contexte sacrificiel. La traduction principale évite de faire penser uniquement à du pain cuit, tandis que la note conserve le sens littéral.
- source_word: מַקְרִיבִם
  choice: ils présentent
  rationale: Le participe hiphil de קרב évoque le fait d’apporter ou de présenter une offrande. « Présentent » rend l’action sacrificielle sans répétition maladroite avec « offrandes ».
- source_word: וְהָיוּ קֹדֶשׁ
  choice: ils seront donc saints
  rationale: Le ו peut être compris comme marquant ici la conséquence de la fonction sacerdotale énoncée dans la proposition causale. « Donc » rend ce lien naturel en français sans supprimer la reprise finale de la sainteté.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu emploie explicitement le tétragramme. « Yahweh » conserve le nom personnel et évite de le remplacer par un titre.
- issue: Sens de l’expression cultuelle אִשֵּׁי יְהוָה לֶחֶם אֱלֹהֵיהֶם
  choice: les offrandes consumées par le feu de Yahweh, la nourriture de leur Dieu
  alternative: les mets de Yahweh, le pain de leur Dieu
  rationale: La traduction choisie fait entendre à la fois le caractère sacrificiel des אִשִּׁים et l’image de nourriture portée par לֶחֶם, sans laisser entendre que Dieu aurait besoin de manger. La formulation plus littérale est signalée en note.
- issue: Valeur du dernier ו dans וְהָיוּ קֹדֶשׁ
  choice: donc
  alternative: et
  rationale: Le contexte causal permet une lecture consécutive, mais la simple coordination reste possible. Le choix principal explicite sobrement le rapport entre le service sacerdotal et l’exigence de sainteté.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « saints » est volontaire, car elle structure le verset hébreu. Le vocabulaire cultuel demeure précis sans recourir à des tournures archaïques.
