source:
  edition: WLC
  text: וּ/בַת֙ אִ֣ישׁ כֹּהֵ֔ן כִּ֥י תֵחֵ֖ל לִ/זְנ֑וֹת אֶת אָבִ֨י/הָ֙ הִ֣יא מְחַלֶּ֔לֶת בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/009.yaml
  text: And the daughter of a priest[a], if she profanes herself by prostituting herself, profanes her father[b]; she shall be burned with fire.
translation:
  language: fr
  text: Et si la fille d’un prêtre se profane en se prostituant[a], elle profane son père ; elle sera brûlée au feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « commence à se prostituer ». Le verbe hébreu peut signifier « commencer » dans certains contextes, mais il est ici compris au sens de « se profaner », en lien avec le verbe « profane » dans la proposition suivante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת אִישׁ כֹּהֵן
  choice: Et si la fille d’un prêtre
  rationale: L’expression signifie littéralement « la fille d’un homme prêtre », soit, en français naturel, « la fille d’un prêtre ». Le ו initial est conservé par « Et », tandis que כִּי introduit ici le cas juridique conditionnel rendu par « si ».
- source_word: תֵחֵל לִזְנוֹת
  choice: se profane en se prostituant
  rationale: 'Dans ce contexte de sainteté sacerdotale, תֵחֵל est compris comme une forme de חלל, « être profané / se profaner », plutôt que comme « commencer ». L’infinitif לִזְנוֹת précise la manière : elle se profane en se livrant à la prostitution.'
- source_word: אֶת אָבִיהָ הִיא מְחַלֶּלֶת
  choice: elle profane son père
  rationale: Le participe piel מְחַלֶּלֶת exprime l’action de profaner. Répéter « profane » maintient le lien lexical et cultuel avec תֵחֵל sans l’affaiblir en simple déshonneur social.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: elle sera brûlée par le feu
  rationale: Le niphal exprime la peine prescrite sous une forme passive. Cette traduction conserve la formulation judiciaire et ne précise pas au-delà du texte les modalités ou le moment de la combustion.
theological_decisions:
- issue: Maintien du vocabulaire de la profanation dans une loi sur la sainteté sacerdotale
  choice: Employer « se profane » puis « profane »
  alternative: Employer « se déshonore », « se souille » ou « déshonore son père »
  rationale: La répétition française reflète la racine חלל dans les deux propositions et préserve la portée cultuelle propre au contexte sacerdotal, sans réduire le propos à la réputation familiale.
- issue: Nature précise de la peine
  choice: Traduire littéralement « elle sera brûlée par le feu »
  alternative: Préciser qu’elle sera exécutée par le feu ou que son corps sera brûlé après sa mort
  rationale: Le verset prescrit la combustion sans en expliciter ici la séquence exacte. La traduction conserve cette indétermination au lieu de la résoudre à partir d’autres textes ou traditions.
translation_notes:
  register: Français international moderne, solennel et juridique sans archaïsme. La syntaxe reste proche de l’hébreu, tout en étant naturelle ; la répétition de « profane » est volontaire pour préserver le vocabulaire de la sainteté sacerdotale.
