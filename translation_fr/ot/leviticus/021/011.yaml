  text: וְ/עַ֛ל כָּל נַפְשֹׁ֥ת מֵ֖ת לֹ֣א יָבֹ֑א לְ/אָבִ֥י/ו וּ/לְ/אִמּ֖/וֹ לֹ֥א יִטַּמָּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/011.yaml
  text: He shall not go near any dead body[a]; he shall not make himself unclean even for his father or for his mother.
translation:
  language: fr
  text: Il ne s’approchera d’aucun cadavre[a] et ne se rendra pas impur, pas même pour son père ou sa mère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « corps d’un mort ». Littéralement, « personnes mortes » ; dans les lois de pureté, l’expression désigne un cadavre humain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל כָּל נַפְשֹׁת מֵת לֹא יָבֹא
  choice: Il ne s’approchera d’aucun cadavre
  rationale: Avec בוא et עַל, l’expression désigne ici le fait de s’approcher d’un mort dans le cadre des lois de pureté. Sous la négation, כָּל se rend naturellement par « aucun ». נַפְשֹׁת מֵת est un idiome désignant un corps humain mort, non l’âme d’un défunt.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: même pour son père ou sa mère
  rationale: 'La préposition לְ marque ici le cas ou le motif concerné. « Même » restitue l’insistance implicite : l’interdiction vaut jusque pour les parents les plus proches. En français, « ou » exprime clairement la portée distributive.'
- source_word: לֹא יִטַּמָּא
  choice: ne se rendra impur
  rationale: La forme verbale est réflexive. « Se rendre impur » conserve la catégorie lévitique de l’impureté sans la transformer en faute morale.
theological_decisions:
- issue: Terminologie de l’impureté rituelle
  choice: impur
  alternative: souillé ; rituellement impur
  rationale: « Impur » maintient la catégorie biblique propre aux lois de pureté. « Souillé » risquerait de moraliser le propos, tandis que « rituellement » expliciterait dans le texte principal une donnée fournie par le contexte.
translation_notes:
  register: Français international moderne, clair et digne. La formulation juridique au futur conserve la force normative du texte, tandis que « cadavre » rend directement l’idiome hébreu sans suggérer que l’âme serait impure.
