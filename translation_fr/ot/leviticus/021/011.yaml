  source_fidelity: 'Le sens de l’hébreu est bien rendu : l’interdiction porte sur toute dépouille humaine et s’applique aussi au père et à la mère. « Cadavre » convient au sens idiomatique de נַפְשֹׁת מֵת dans les lois de pureté.'
  naturalness: La seconde négation doit employer « pas » en français moderne courant. « Ne se rendra impur » est possible dans un registre archaïsant ou très littéraire, mais ne correspond pas au français international moderne visé. « Pas même » rend naturellement l’insistance contextuelle de la mention des parents.
  terminology: '« Se rendre impur » préserve adéquatement la notion d’impureté rituelle sans la moraliser. « Cadavre » est clair et exact. La note doit toutefois corriger son littéral : « personne d’un mort » ne reflète pas naturellement la construction hébraïque ; « personnes mortes » est une approximation littérale plus intelligible.'
