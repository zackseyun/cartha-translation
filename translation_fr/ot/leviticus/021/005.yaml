  text: לֹֽא יקרחה קָרְחָה֙ בְּ/רֹאשָׁ֔/ם וּ/פְאַ֥ת זְקָנָ֖/ם לֹ֣א יְגַלֵּ֑חוּ וּ/בִ֨/בְשָׂרָ֔/ם לֹ֥א יִשְׂרְט֖וּ שָׂרָֽטֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/005.yaml
  text: They shall not make a bald patch on their head[a], nor shave off the edge of their beard, nor make cuts in their flesh.
translation:
  language: fr
  text: Ils ne se feront pas de zone chauve sur la tête, ils ne raseront pas le bord de leur barbe[a] et ils ne se feront pas d’incisions dans leur chair.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les coins de leur barbe ». Le terme hébreu peut désigner un bord, un côté ou un coin.
    reason: Alternative lexicale préservant l’imprécision spatiale du terme hébreu.
lexical_decisions:
- source_word: יִקְרְחוּ קָרְחָה
  choice: se feront de tonsure
  rationale: Le couple verbe-nom désigne l’action volontaire de créer une zone dépourvue de cheveux, et non la calvitie naturelle. « Se faire une tonsure » exprime cette action concrète en français clair sans ajouter le motif rituel.
- source_word: בְּרֹאשָׁם
  choice: sur la tête
  rationale: Le nom hébreu est au singulier avec un suffixe pluriel et s’entend distributivement. Le singulier français est naturel avec le sujet pluriel.
- source_word: פְאַת זְקָנָם
  choice: le bord de leur barbe
  rationale: פֵּאָה peut désigner un bord, un côté ou un coin. « Bord » conserve l’image concrète sans préciser indûment la forme exacte du rasage.
- source_word: יְגַלֵּחוּ
  choice: raseront
  rationale: La forme intensive indique ici l’enlèvement des poils par rasage. Le complément « le bord de leur barbe » rend le sens de manière naturelle sans qu’il soit nécessaire d’ajouter « entièrement ».
- source_word: וּבִבְשָׂרָם
  choice: dans la chair
  rationale: Cette formulation garde le caractère physique et concret de בָּשָׂר, plutôt que de l’atténuer par « sur le corps ».
- source_word: יִשְׂרְטוּ שָׂרָטֶת
  choice: se feront pas d’incisions
  rationale: Le couple verbe-nom évoque des entailles volontaires pratiquées dans le corps. « Se faire des incisions » est précis, compréhensible et non clinique à l’excès.
theological_decisions:
- issue: Nature de l’interdiction
  choice: Présenter les trois interdictions corporelles concrètement, sans en préciser le motif.
  alternative: Ajouter qu’il s’agit de pratiques de deuil ou de gestes accomplis pour un mort, d’après Lévitique 19.28 et Deutéronome 14.1.
  rationale: Ce verset ne donne pas lui-même ce motif. L’ajouter au texte principal importerait une explication tirée de passages parallèles et réduirait la portée formelle de l’énoncé.
translation_notes:
  register: Français moderne, sobre et digne. La coordination répétée maintient la structure des trois interdictions. « Tonsure » désigne ici une zone volontairement dégarnie et non une calvitie naturelle; aucun contexte funéraire absent du verset n’est ajouté.
