reference: Leviticus 21:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַלְמָנָ֤ה וּ/גְרוּשָׁה֙ וַ/חֲלָלָ֣ה זֹנָ֔ה אֶת אֵ֖לֶּה לֹ֣א יִקָּ֑ח כִּ֛י אִם בְּתוּלָ֥ה מֵ/עַמָּ֖י/ו יִקַּ֥ח אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/014.yaml
  text: 'He shall not take these as wife: a widow[a], or a divorced woman, or a defiled woman, or a prostitute. Rather, he shall take a virgin from his own people as wife.'
translation:
  language: fr
  text: Il ne prendra pour épouse ni veuve, ni femme divorcée, ni femme profanée[a], ni prostituée. Mais il prendra pour épouse seulement une vierge de son peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « femme rendue profane ». Le terme hébreu désigne ici une femme dont le statut est considéré comme incompatible avec les exigences de sainteté propres au sacerdoce.
    reason: Alternative lexicale et clarification prudente du sens statutaire du terme hébreu חֲלָלָה.
lexical_decisions:
- source_word: אַלְמָנָה
  choice: veuve
  rationale: Équivalent français direct et naturel du nom hébreu dans cette liste de femmes que le grand prêtre ne peut épouser.
- source_word: גְרוּשָׁה
  choice: femme divorcée
  rationale: Le terme désigne une femme renvoyée par son mari, donc divorcée; cette formulation moderne conserve clairement le sens juridique et matrimonial.
- source_word: חֲלָלָה
  choice: femme profanée
  rationale: Dans la législation sacerdotale, le terme qualifie une femme dont le statut est tenu pour incompatible avec la sainteté requise. «Profanée» conserve le lien lexical avec l’opposition entre saint et profane sans préciser indûment la cause de ce statut.
- source_word: זֹנָה
  choice: prostituée
  rationale: Équivalent courant et direct dans ce contexte; il évite les termes français vieillis ou inutilement péjoratifs.
- source_word: אֶת אֵלֶּה לֹא יִקָּח
  choice: Il ne prendra pour épouse ni…
  rationale: La tournure explicite le sens matrimonial de «prendre» et transforme naturellement le démonstratif collectif en une énumération française introduite par «ni».
- source_word: כִּי אִם
  choice: uniquement
  rationale: 'Après l’interdiction, l’expression marque une restriction forte: aucune autre catégorie que celle qui suit n’est permise.'
- source_word: בְּתוּלָה
  choice: une vierge
  rationale: Dans cette règle matrimoniale, le terme désigne précisément une femme vierge; «jeune fille» serait moins explicite.
- source_word: מֵעַמָּיו
  choice: de son peuple
  rationale: Cette formulation naturelle indique que l’épouse doit venir du groupe auquel il appartient, sans ajouter une définition ethnique ou tribale absente du verset.
- source_word: אִשָּׁה
  choice: pour épouse
  rationale: Le nom précise la fonction matrimoniale; «prendre pour épouse» est une expression française claire et digne.
theological_decisions:
- issue: Sens de חֲלָלָה dans les restrictions matrimoniales sacerdotales
  choice: femme profanée
  alternative: femme déshonorée; femme rendue profane; femme dont le statut est incompatible avec la sainteté sacerdotale
  rationale: Le mot relève ici du vocabulaire de la sainteté et de la profanation. «Femme profanée» maintient cette dimension cultuelle et statutaire sans réduire le terme à une faute sexuelle précise ni expliquer ce que le texte laisse implicite.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de «pour épouse» encadre les deux parties du verset et rend explicite l’idiome matrimonial hébreu. Le vocabulaire juridique demeure accessible, tandis que la note préserve la nuance cultuelle difficile de חֲלָלָה.
