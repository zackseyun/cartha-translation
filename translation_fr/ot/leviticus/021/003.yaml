source:
  edition: WLC
  text: וְ/לַ/אֲחֹת֤/וֹ הַ/בְּתוּלָה֙ הַ/קְּרוֹבָ֣ה אֵלָ֔י/ו אֲשֶׁ֥ר לֹֽא הָיְתָ֖ה לְ/אִ֑ישׁ לָ֖/הּ יִטַּמָּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/003.yaml
  text: and for his virgin sister who is near to him[a], who has not belonged to a man, he may make himself unclean.
translation:
  language: fr
  text: Et pour sa sœur vierge[a], qui lui est proche et qui n’a pas été unie à un homme, il pourra se rendre impur pour elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la proche de lui ». L’expression souligne une proximité avec son frère, sans en préciser davantage la nature.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/אֲחֹתוֹ
  choice: et pour sa sœur
  rationale: La conjonction et la préposition ajoutent la sœur aux proches pour lesquels le prêtre peut contracter l’impureté; le suffixe possessif est rendu par « sa ».
- source_word: הַבְּתוּלָה
  choice: vierge
  rationale: Le terme désigne ici directement une vierge et précise le statut de la sœur concernée.
- source_word: הַקְּרוֹבָה אֵלָיו
  choice: sa proche parente
  rationale: L’expression indique une proximité familiale. « Sa proche parente » est naturel en français et évite de suggérer seulement une proximité affective ou géographique.
- source_word: אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: qui n’a pas été unie à un homme
  rationale: L’expression hébraïque est idiomatique et peut viser le mariage ou l’union avec un homme. Cette formulation naturelle conserve volontairement cette latitude sans employer le possessif « appartenir », peu approprié ici en français moderne.
- source_word: לָהּ
  choice: pour elle
  rationale: 'Le pronom reprend la sœur et se rattache à יִטַּמָּא : c’est pour elle que le prêtre peut se rendre impur.'
- source_word: יִטַּמָּא
  choice: il pourra se rendre impur
  rationale: Dans ce contexte juridique, la forme exprime l’autorisation de contracter une impureté rituelle au contact du corps, non une corruption morale.
theological_decisions:
- issue: Nature de l’impureté dans la loi sacerdotale
  choice: « se rendre impur », compris comme une impureté rituelle
  alternative: « se souiller »
  rationale: Le contexte porte sur l’impureté contractée auprès d’un mort. « Se rendre impur » maintient la catégorie rituelle sans suggérer que le geste permis serait une faute morale.
- issue: Portée de l’expression אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: « qui n’a pas été unie à un homme »
  alternative: « qui n’a pas eu de mari » ou « qui n’a pas eu de relations avec un homme »
  rationale: L’hébreu peut évoquer l’entrée dans une union conjugale ou sexuelle. Le texte principal préserve cette tension au lieu de réduire l’expression au seul mariage ou au seul rapport sexuel.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste liée au verset précédent, d’où l’initiale « et ». Le vocabulaire juridique et rituel est conservé sans archaïsme inutile.
