id: LEV.21.23
reference: Leviticus 21:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַ֣ךְ אֶל הַ/פָּרֹ֜כֶת לֹ֣א יָבֹ֗א וְ/אֶל הַ/מִּזְבֵּ֛חַ לֹ֥א יִגַּ֖שׁ כִּֽי מ֣וּם בּ֑/וֹ וְ/לֹ֤א יְחַלֵּל֙ אֶת מִקְדָּשַׁ֔/י כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/023.yaml
  text: However[a], he shall not go in to the veil or come near the altar, because there is a defect in him, so that he may not profane my sanctuaries[c][b]; for I am Yahweh who sanctifies them.
translation:
  language: fr
  text: Toutefois, il n’ira pas jusqu’au voile[a] et ne s’approchera pas de l’autel, car il a un défaut physique[b], afin qu’il ne profane pas mes sanctuaires[c] ; car je suis Yahweh, qui les sanctifie[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rideau ». Le terme hébreu désigne le voile du sanctuaire.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « car il y a un défaut en lui ». Il s’agit ici d’un défaut corporel entraînant une restriction rituelle, et non d’une faute morale.
    reason: lexical_alternative
  - marker: c
    text: L’hébreu porte le pluriel « mes sanctuaires » ; certaines traductions emploient le singulier « mon sanctuaire ».
    reason: lexical_alternative
  - marker: d
    text: Le pronom « les » peut renvoyer à « mes sanctuaires » ; dans le contexte sacerdotal, il peut aussi renvoyer aux prêtres.
    reason: referential_ambiguity
lexical_decisions:
- source_word: אַךְ
  choice: Toutefois
  rationale: Introduit une restriction par rapport à l’autorisation donnée au verset précédent, dans un français naturel et digne.
- source_word: הַפָּרֹכֶת
  choice: le voile
  rationale: Désigne le rideau cultuel du sanctuaire; « voile » conserve le terme traditionnel tout en restant compréhensible.
- source_word: יָבֹא אֶל
  choice: ira jusqu’à
  rationale: Dans ce contexte spatial, exprime l’accès interdit à la zone du voile sans suggérer qu’on entre dans le voile lui-même.
- source_word: הַמִּזְבֵּחַ
  choice: l’autel
  rationale: Équivalent français usuel dans le contexte sacrificiel.
- source_word: יִגַּשׁ
  choice: s’approchera
  rationale: Rend naturellement le langage sacerdotal de l’approche cultuelle.
- source_word: מוּם בּוֹ
  choice: il a un défaut physique
  rationale: Le terme désigne ici une particularité corporelle entraînant une restriction rituelle, non une faute morale.
- source_word: יְחַלֵּל
  choice: profanera
  rationale: Préserve l’opposition sacerdotale entre ce qui est saint et ce qui est traité comme profane.
- source_word: מִקְדָּשַׁי
  choice: mes sanctuaires
  rationale: Conserve le pluriel explicite du texte hébreu plutôt que de le ramener silencieusement au singulier.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel au lieu de lui substituer un titre.
- source_word: מְקַדְּשָׁם
  choice: qui les sanctifie
  rationale: Le suffixe masculin pluriel renvoie le plus naturellement aux « sanctuaires », son antécédent grammatical immédiat.
theological_decisions:
- issue: Référent du suffixe dans מְקַדְּשָׁם
  choice: « les » renvoie aux sanctuaires
  alternative: Le suffixe pourrait renvoyer plus largement aux prêtres ou au peuple.
  rationale: L’antécédent pluriel le plus proche est « mes sanctuaires », et ce référent correspond au contexte immédiat des espaces saints.
- issue: Portée de מוּם dans cette loi sacerdotale
  choice: défaut physique entraînant une restriction cultuelle
  alternative: tare; infirmité; défaut
  rationale: Le passage établit une condition d’accès au service sacerdotal; il ne qualifie ni la moralité ni la valeur humaine de la personne.
- issue: Lien entre l’interdiction d’approcher et la profanation
  choice: Deux propositions coordonnées, la seconde exprimant la conséquence cultuelle évitée
  alternative: Traduire explicitement par « afin qu’il ne profane pas » ou « de peur qu’il ne profane »
  rationale: L’hébreu emploie simplement וְלֹא suivi de l’inaccompli. La coordination française préserve cette sobriété sans imposer une nuance finale plus précise que la forme source.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le vocabulaire cultuel (« voile », « autel », « profaner », « sanctifier »), le pluriel inhabituel de « sanctuaires » et la coordination sobre de l’hébreu. Les notes explicitent les variantes lexicales et empêchent de comprendre le défaut physique comme une faute morale.
