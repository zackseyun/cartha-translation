id: LEV.21.18
reference: Leviticus 21:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֥י כָל אִ֛ישׁ אֲשֶׁר בּ֥/וֹ מ֖וּם לֹ֣א יִקְרָ֑ב אִ֤ישׁ עִוֵּר֙ א֣וֹ פִסֵּ֔חַ א֥וֹ חָרֻ֖ם א֥וֹ שָׂרֽוּעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/018.yaml
  text: 'For no man who has a defect shall come near: a blind man[a], or a lame man, or one with a disfigured face[d][c][b], or one with a limb too long.'
translation:
  language: fr
  text: 'En effet, aucun homme ayant un défaut corporel[a] ne s’approchera[b] : qu’il soit aveugle ou boiteux, qu’il ait le visage déformé[c] ou un membre démesuré[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne ici un défaut physique qui empêche un descendant d’Aaron d’exercer certaines fonctions sacerdotales.
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, « s’approcher » signifie s’avancer pour accomplir le service sacerdotal.
    reason: cultural_note
  - marker: c
    text: Le terme hébreu est rare. Il pourrait désigner plus précisément un nez mutilé ou malformé.
    reason: lexical_alternative
  - marker: d
    text: Le terme hébreu peut désigner un membre allongé, déformé ou disproportionné.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: En effet
  rationale: La conjonction introduit ici l’explication de l’interdiction formulée au verset précédent. « En effet » rend naturellement cette valeur explicative.
- source_word: כָל אִישׁ אֲשֶׁר בּוֹ מוּם
  choice: aucun homme ayant un défaut corporel
  rationale: Littéralement « tout homme en qui se trouve un défaut » ; avec la négation qui suit, la tournure française naturelle est « aucun homme ». Le contexte concerne les hommes de la lignée d’Aaron et מוּם désigne ici une particularité physique disqualifiante pour le service sacerdotal.
- source_word: לֹא יִקְרָב
  choice: ne s’approchera
  rationale: Le verbe קרב conserve son sens cultuel d’approcher afin d’exercer le service sacerdotal, sans que cette précision contextuelle soit ajoutée directement au corps du texte.
- source_word: אִישׁ עִוֵּר
  choice: qu’il soit aveugle
  rationale: Formulation française claire et actuelle, intégrée naturellement à l’énumération.
- source_word: פִסֵּחַ
  choice: boiteux
  rationale: Le terme désigne une personne atteinte dans sa marche. « Boiteux » est précis et évite une formulation inutilement péjorative.
- source_word: חָרֻם
  choice: qu’il ait le visage déformé
  rationale: Ce terme rare évoque probablement une mutilation ou une malformation, peut-être plus précisément du nez. La traduction garde une portée générale afin de ne pas imposer une précision incertaine.
- source_word: שָׂרוּעַ
  choice: un membre démesuré
  rationale: Le mot semble désigner une partie du corps allongée ou disproportionnée. « Un membre démesuré » exprime ce sens probable tout en préservant l’incertitude lexicale.
theological_decisions:
- issue: Portée de l’interdiction liée aux particularités physiques
  choice: Présenter l’interdiction comme une condition cultuelle régissant l’approche sacerdotale.
  alternative: Comprendre le verset comme une exclusion sociale générale ou comme un jugement sur la valeur morale de la personne.
  rationale: Dans son contexte, le texte traite des conditions requises des descendants mâles d’Aaron pour s’approcher dans le cadre du service sacerdotal. Il ne formule aucun jugement sur leur dignité personnelle ni sur leur état moral.
translation_notes:
  register: Français international moderne, digne et accessible. La structure « qu’il soit… qu’il ait… » rend l’énumération naturelle sans durcir le ton. Les termes rares sont traduits sobrement, et leur incertitude est explicitée en notes.
