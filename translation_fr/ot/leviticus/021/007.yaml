  terminology: '« Saint » préserve le vocabulaire cultuel central de קדוש. « Profanée » est un choix prudent pour חללה : il maintient l’ambiguïté du terme et sa dimension de statut, sans lui attribuer une définition juridique ultérieure ni le réduire à une impureté rituelle. « Répudiée » convient au cadre social ancien et demeure intelligible.'
