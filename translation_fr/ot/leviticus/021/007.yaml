  source_fidelity: 'Le texte rend fidèlement les deux interdictions matrimoniales : זֹנָה (« prostituée »), חֲלָלָה (« femme profanée ») et גְּרוּשָׁה מֵאִישָׁהּ (« femme répudiée/divorcée de son mari »). « Épouser » exprime naturellement, dans ce contexte, le sens matrimonial de יִקָּחוּ (« prendre [pour femme] »). La finale « car chacun d’eux est saint pour son Dieu » rend de manière claire et juste le singulier distributif כִּי קָדוֹשׁ הוּא לֵאלֹהָיו, dont l’antécédent est chaque prêtre visé par le pluriel précédent.'
