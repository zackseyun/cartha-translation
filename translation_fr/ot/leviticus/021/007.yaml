source:
  edition: WLC
  text: אִשָּׁ֨ה זֹנָ֤ה וַ/חֲלָלָה֙ לֹ֣א יִקָּ֔חוּ וְ/אִשָּׁ֛ה גְּרוּשָׁ֥ה מֵ/אִישָׁ֖/הּ לֹ֣א יִקָּ֑חוּ כִּֽי קָדֹ֥שׁ ה֖וּא לֵ/אלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/007.yaml
  text: They shall not take a woman who is a prostitute or defiled, and they shall not take a woman divorced from her husband, for he is holy to his God.
translation:
  language: fr
  text: Ils n’épouseront ni une prostituée ni une femme profanée, et ils n’épouseront pas non plus une femme répudiée par son mari, car chacun d’eux est saint pour son Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִקָּחוּ
  choice: épouseront
  rationale: Dans ce contexte matrimonial, l’hébreu « prendre » signifie prendre pour femme ; « épouser » exprime naturellement cette valeur en français moderne.
- source_word: אִשָּׁה זֹנָה
  choice: une prostituée
  rationale: Rend directement la désignation hébraïque d’une femme qui se livre à la prostitution, sans ajouter de qualification morale absente du texte.
- source_word: חֲלָלָה
  choice: une femme profanée
  rationale: Conserve le lien avec la racine חלל, qui évoque la profanation ou la perte d’un statut sacré, sans réduire le terme à une catégorie juridique ultérieure ni le confondre avec une simple impureté rituelle.
- source_word: גְּרוּשָׁה מֵאִישָׁהּ
  choice: une femme répudiée par son mari
  rationale: Traduit littéralement l’idée d’une femme renvoyée ou divorcée de son mari ; « répudiée » convient au cadre social ancien tout en restant intelligible.
- source_word: קָדֹשׁ
  choice: saint
  rationale: Préserve le vocabulaire central de la sainteté sacerdotale dans le Lévitique.
theological_decisions:
- issue: Passage du pluriel « ils n’épouseront pas » au singulier « il est saint »
  choice: car chacun d’eux est saint pour son Dieu
  alternative: car il est saint pour son Dieu
  rationale: Le singulier hébreu a une valeur distributive et renvoie au prêtre concerné. La formulation française clarifie ce passage grammatical sans changer la portée du texte ni laisser croire que « il » désigne le mari de la femme répudiée.
- issue: Portée de חֲלָלָה
  choice: femme profanée
  alternative: femme souillée
  rationale: « Profanée » maintient la dimension de statut cultuel suggérée par la racine, tandis que « souillée » pourrait imposer une idée d’impureté physique ou morale plus précise que l’hébreu.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « ils n’épouseront » reprend l’insistance syntaxique de l’hébreu, tandis que « chacun d’eux » rend explicitement le singulier distributif final.
