  text: וְ/הַ/כֹּהֵן֩ הַ/גָּד֨וֹל מֵ/אֶחָ֜י/ו אֲֽשֶׁר יוּצַ֥ק עַל רֹאשׁ֣/וֹ שֶׁ֤מֶן הַ/מִּשְׁחָה֙ וּ/מִלֵּ֣א אֶת יָד֔/וֹ לִ/לְבֹּ֖שׁ אֶת הַ/בְּגָדִ֑ים אֶת רֹאשׁ/וֹ֙ לֹ֣א יִפְרָ֔ע וּ/בְגָדָ֖י/ו לֹ֥א יִפְרֹֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/010.yaml
  text: And the high priest, who is greater than his brothers[a], on whose head the anointing oil has been poured and whose hand has been filled to wear the garments, shall not let his head hang loose[b], nor shall he tear his garments.
translation:
  language: fr
  text: Le grand prêtre, le plus éminent parmi ses frères, sur la tête duquel a été versée l’huile d’onction et dont on a rempli la main[a] afin qu’il revête les vêtements, ne laissera pas sa chevelure défaite[b] et ne déchirera pas ses vêtements.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dont on a rempli la main ». Cette expression hébraïque désigne l’installation ou la consécration d’une personne au service sacerdotal.'
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu évoque le fait de laisser sa chevelure défaite ou négligée, signe habituel de deuil.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֹּהֵן הַגָּדוֹל מֵאֶחָיו
  choice: le grand prêtre, le plus éminent de ses frères
  rationale: « Grand prêtre » désigne naturellement en français la fonction sacerdotale suprême; « le plus éminent de ses frères » conserve la valeur comparative de מִן et la référence masculine aux autres prêtres.
- source_word: יוּצַק עַל רֹאשׁוֹ שֶׁמֶן הַמִּשְׁחָה
  choice: sur la tête duquel on a versé l’huile d’onction
  rationale: Cette formulation conserve l’image concrète du versement sur la tête ainsi que la valeur rituelle de « l’huile d’onction ».
- source_word: וּמִלֵּא אֶת יָדוֹ
  choice: dont on a rempli la main
  rationale: Le texte principal garde l’expression cultuelle hébraïque, tandis qu’une note en explique le sens d’installation dans la fonction sacerdotale.
- source_word: לִלְבֹּשׁ אֶת הַבְּגָדִים
  choice: pour qu’il revête les vêtements
  rationale: « Revêtir » rend naturellement l’action de porter les vêtements officiels sans ajouter « sacerdotaux », absent de l’expression hébraïque.
- source_word: אֶת רֹאשׁוֹ לֹא יִפְרָע
  choice: il ne laissera pas ses cheveux en désordre
  rationale: Le français explicite la chevelure, impliquée par l’expression hébraïque concernant la tête, et exprime un signe traditionnel de deuil sans archaïsme.
- source_word: וּבְגָדָיו לֹא יִפְרֹם
  choice: et ne déchirera pas ses vêtements
  rationale: Rendu direct et actuel du geste de déchirer ses vêtements en signe de deuil.
theological_decisions:
- issue: Sens de l’expression d’installation מִלֵּא אֶת יָדוֹ
  choice: Conserver « dont on a rempli la main » dans le texte et expliquer l’idiome en note.
  alternative: « qui a été consacré » ou « qui a été établi dans sa fonction »
  rationale: La formulation retenue préserve l’image rituelle propre au texte hébreu sans imposer un vocabulaire confessionnel; la note assure l’intelligibilité.
- issue: Portée de מֵאֶחָיו
  choice: « le plus éminent de ses frères »
  alternative: « choisi parmi ses frères »
  rationale: La préposition marque vraisemblablement ici la comparaison et le rang supérieur plutôt que la seule provenance; « frères » maintient la désignation masculine du groupe sacerdotal concerné.
- issue: Sens de l’interdiction אֶת רֹאשׁוֹ לֹא יִפְרָע
  choice: « il ne laissera pas ses cheveux en désordre »
  alternative: « il ne découvrira pas sa tête »
  rationale: Le contexte des rites de deuil et l’usage du verbe favorisent l’idée d’une chevelure laissée libre ou négligée. La note signale la nuance concrète sans éliminer la difficulté de l’expression.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la solennité de la prescription rituelle, tandis que les notes éclairent l’idiome d’installation et l’expression ambiguë relative à la tête ou à la chevelure.
