base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/016.yaml
  text: And the priest shall burn its memorial portion from its crushed grain and from its oil[a], with all its frankincense—an offering made by fire to Yahweh.
translation:
  language: fr
  text: 'Le prêtre fera monter en fumée la portion commémorative de l’offrande, qu’il prélèvera du grain concassé[a] et de l’huile, avec tout son encens : c’est une offrande par le feu pour Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « grains grossièrement broyés » ; le terme hébreu désigne des grains écrasés ou concassés préparés pour l’offrande végétale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: fera fumer
  rationale: Dans le contexte sacrificiel, le hiphil de קטר désigne l’action de brûler sur l’autel afin que l’offrande monte en fumée. « Fera fumer » conserve cette image rituelle avec naturel.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Équivalent français courant et précis de כהן dans la législation cultuelle.
- source_word: אַזְכָּרָתָהּ
  choice: sa portion commémorative
  rationale: אַזְכָּרָה est ici le terme technique désignant la partie représentative de l’offrande végétale brûlée sur l’autel. « Portion commémorative » préserve à la fois l’idée de portion et celle de mémorial sans en préciser indûment la portée théologique.
- source_word: מִגִּרְשָׂהּ
  choice: prélevée sur le grain concassé
  rationale: גרש désigne des grains écrasés ou grossièrement broyés. « Grain concassé » est clair en français moderne, tandis que « prélevée sur » explicite la fonction partitive de מן.
- source_word: וּמִשַּׁמְנָהּ
  choice: et sur l’huile
  rationale: Le second מן est coordonné au premier et indique que la portion brûlée est également prise de l’huile. La répétition de « sur » rend cette relation partitive explicite.
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: avec tout son encens
  rationale: 'Dans cette instruction sacrificielle, על exprime l’accompagnement : la portion commémorative est brûlée avec la totalité de l’encens.'
- source_word: אִשֶּׁה
  choice: une offrande consumée par le feu
  rationale: אִשֶּׁה est un terme sacrificiel désignant une offrande présentée au moyen du feu. Cette formulation française est intelligible et évite l’ambiguïté de « mets ».
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: Le lamed marque ici la destination ou la consécration de l’offrande. Le nom divin יהוה est rendu directement par « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Portée de אַזְכָּרָה
  choice: portion commémorative
  alternative: portion de mémorial
  rationale: Le terme peut évoquer le mémorial ou le rappel devant Dieu, mais le verset n’en explicite pas le mécanisme théologique. La traduction retient le terme cultuel sans résoudre cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le vocabulaire sacrificiel et la structure partitive du texte hébreu sans lourdeur excessive.
