- from: 'Le prêtre fera fumer sa portion commémorative, prélevée sur le grain concassé[a] et sur l’huile, avec tout son encens : c’est une offrande consumée par le feu pour Yahweh.'
  to: 'Le prêtre fera monter en fumée la portion commémorative de l’offrande, qu’il prélèvera du grain concassé[a] et de l’huile, avec tout son encens : c’est une offrande par le feu pour Yahweh.'
  rationale: La révision conserve la structure et l’ambiguïté cultuelle du texte hébreu tout en corrigeant la relation partitive en français. Elle remplace une expression légèrement lourde par une formulation rituelle moderne et naturelle, et emploie « offrande par le feu » pour le terme technique אִשֶּׁה.
