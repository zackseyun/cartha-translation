id: LEV.2.12
reference: Leviticus 2:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: קָרְבַּ֥ן רֵאשִׁ֛ית תַּקְרִ֥יבוּ אֹתָ֖/ם לַ/יהוָ֑ה וְ/אֶל הַ/מִּזְבֵּ֥חַ לֹא יַעֲל֖וּ לְ/רֵ֥יחַ נִיחֹֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/012.yaml
  text: As an offering of firstfruits you may present them to Yahweh[b][a], but they must not go up on the altar as a pleasing aroma.
translation:
  language: fr
  text: Vous pourrez les présenter à Yahweh comme offrande de prémices[a], mais ils ne devront pas monter sur l’autel comme un parfum agréable[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une offrande de prémices » ou « une offrande des premiers produits ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils ne monteront pas vers l’autel pour un parfum agréable » ; dans ce contexte, il s’agit de les brûler sur l’autel comme offrande agréée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבַּן רֵאשִׁית
  choice: offrande de prémices
  rationale: Cette expression restitue naturellement la relation entre קָרְבַּן, « offrande », et רֵאשִׁית, ici les premiers produits consacrés à Dieu, tout en conservant l’autre analyse possible signalée en note.
- source_word: תַּקְרִיבוּ
  choice: vous pourrez présenter
  rationale: 'Le hiphil de קרב désigne la présentation cultuelle d’une offrande. Le futur à valeur permissive convient au contraste contextuel : ces produits peuvent être présentés à Yahweh, mais non brûlés sur l’autel.'
- source_word: אֹתָם
  choice: les
  rationale: Le pronom masculin pluriel renvoie aux produits contenant du levain ou du miel mentionnés au verset précédent.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל marque ici la destination ou la dédicace de l’offrande, et le nom divin יהוה est translittéré « Yahweh ».
- source_word: וְאֶל הַמִּזְבֵּחַ לֹא יַעֲלוּ
  choice: mais ils ne devront pas monter sur l’autel
  rationale: « Mais » rend le contraste contextuel. « Monter sur l’autel » conserve l’image concrète du verbe עלה sans dissimuler son emploi cultuel, expliqué en note.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: en parfum agréable
  rationale: Cette formulation française naturelle maintient la métaphore consacrée de l’odeur associée à une offrande agréée.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme יהוה. « Yahweh » préserve le nom propre d’alliance sans le remplacer par un titre.
- issue: Portée cultuelle de לֹא יַעֲלוּ
  choice: ne devront pas monter sur l’autel
  alternative: ne devront pas être offerts sur l’autel
  rationale: La traduction retient l’image verbale de la montée, tout en laissant la note préciser qu’il s’agit, dans ce contexte, de la combustion sacrificielle sur l’autel.
translation_notes:
  register: Français international moderne, sobre et digne. Le futur modal « pourrez » exprime la permission donnée par le contexte, tandis que « ne devront pas » marque clairement l’interdiction. La formulation conserve l’image hébraïque de la montée sur l’autel et explicite seulement son sens cultuel en note.
