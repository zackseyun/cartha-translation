  text: וְ/הַ/נּוֹתֶ֨רֶת֙ מִן הַ/מִּנְחָ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו קֹ֥דֶשׁ קָֽדָשִׁ֖ים מֵ/אִשֵּׁ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/003.yaml
  text: And what is left of the grain offering shall be for Aaron and for his sons[a], a most holy portion from the food offerings of Yahweh.
translation:
  language: fr
  text: 'Ce qui restera de l’offrande de céréales sera pour Aaron et ses fils : c’est une part très sainte des offrandes consumées par le feu pour Yahvé.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des mets offerts à Yahvé ». Le terme hébreu est une désignation technique d’offrandes sacrificielles ; son lien avec le feu est également possible.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת
  choice: Ce qui restera
  rationale: Le participe substantivé désigne la partie restante de l’offrande. Le futur convient au contexte prescriptif et donne une formulation naturelle en français.
- source_word: מִן הַמִּנְחָה
  choice: de l’offrande de céréales
  rationale: Dans Lévitique 2, מִנְחָה désigne précisément l’offrande végétale préparée avec des céréales, plutôt qu’un don générique.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: sera pour Aaron et ses fils
  rationale: La préposition לְ exprime ici l’attribution aux prêtres. Cette formulation française est claire sans renforcer le texte en parlant explicitement de propriété.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: une part très sainte
  rationale: La construction intensive indique le degré suprême de sainteté dans le système cultuel. « Part » explicite naturellement que cette qualification porte sur le reste de l’offrande, sans évoquer à tort le lieu appelé le Saint des saints.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: parmi les offrandes faites par le feu à Yahvé
  rationale: אִשֶּׁה est un terme sacrificiel associé au feu. « Parmi » rend la valeur classificatrice possible de מִן, tandis que la note conserve l’autre compréhension courante du terme comme mets présentés à Dieu.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » représente le nom divin plutôt que de lui substituer un titre.
theological_decisions:
- issue: Qualification cultuelle קֹדֶשׁ קָדָשִׁים
  choice: une part très sainte
  alternative: une chose très sainte ; saint des saints
  rationale: Le texte classe le reste de l’offrande au plus haut degré de sainteté. La traduction évite de confondre cette catégorie avec une partie du sanctuaire.
- issue: Sens du terme sacrificiel אִשֵּׁי
  choice: les offrandes faites par le feu à Yahvé
  alternative: les mets offerts à Yahvé
  rationale: Le lien étymologique et rituel avec le feu est exprimé dans le texte, mais l’emploi technique pouvant désigner les mets sacrificiels reste signalé en note, sans trancher excessivement l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire cultuel reste précis sans archaïsme. Le nom divin est rendu par « Yahvé ». La note est placée après l’expression qu’elle explique.
