    issue: « parmi les offrandes faites par le feu à Yahvé »
    rationale: La préposition « parmi » présente surtout une inclusion dans une catégorie, tandis que מֵאִשֵּׁי יְהוָה rattache la part restante aux offrandes de Yahvé. En outre, « faites par le feu » est une formulation française moins naturelle pour le terme sacrificiel. « Des offrandes consumées par le feu pour Yahvé » conserve la nuance de feu tout en exprimant plus clairement le lien.
  revised_text: 'Ce qui restera de l’offrande de céréales sera pour Aaron et ses fils : c’est une part très sainte des offrandes consumées par le feu pour Yahvé.[a]'
