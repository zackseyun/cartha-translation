id: LEV.2.4
reference: Leviticus 2:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כִ֥י תַקְרִ֛ב קָרְבַּ֥ן מִנְחָ֖ה מַאֲפֵ֣ה תַנּ֑וּר סֹ֣לֶת חַלּ֤וֹת מַצֹּת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֥ים בַּ/שָּֽׁמֶן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/004.yaml
  text: 'And if you bring near an offering of a grain offering baked in an oven[a], it shall be of fine flour: unleavened cakes mixed with oil, or unleavened wafers anointed with oil.'
translation:
  language: fr
  text: 'Si tu présentes une offrande de céréales cuite au four, elle sera faite de fleur de farine : des gâteaux sans levain pétris avec de l’huile, ou[a] des galettes fines sans levain enduites d’huile.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et ». Il s’agit vraisemblablement ici d’une autre forme possible de l’offrande cuite au four.'
    reason: La conjonction hébraïque est ו (« et »), mais son rôle dans cette liste peut être compris comme l’introduction d’une option alternative.
lexical_decisions:
- source_word: וְכִי
  choice: Si
  rationale: Dans cette série de prescriptions, la formule introduit un nouveau cas conditionnel. En français, « Si » rend naturellement la relation avec le contexte sans alourdir la phrase par un « Et » peu idiomatique.
- source_word: תַקְרִב קָרְבַּן
  choice: tu présentes une offrande
  rationale: Le hiphil de קרב exprime l’action d’amener ou de présenter quelque chose devant Dieu. « Présenter une offrande » conserve ce sens cultuel tout en évitant la répétition peu naturelle « approcher une offrande ».
- source_word: מִנְחָה
  choice: offrande de céréales
  rationale: Dans Lévitique 2, le terme désigne la catégorie rituelle préparée à partir de farine et d’huile. Cette traduction en indique clairement la nature dans un français moderne.
- source_word: מַאֲפֵה תַנּוּר
  choice: cuite au four
  rationale: La locution désigne ici le mode de cuisson de l’offrande. La formulation française est concise et idiomatique.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: Le mot désigne une farine fine et de qualité. « Fleur de farine » est précis, compréhensible et adapté au registre biblique sans être archaïque.
- source_word: חַלּוֹת מַצּוֹת
  choice: gâteaux sans levain
  rationale: חַלּוֹת désigne des pains ou gâteaux façonnés, et מַצּוֹת précise qu’ils sont sans levain. « Gâteaux » les distingue des galettes fines mentionnées ensuite.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: pétris avec de l’huile
  rationale: Le participe indique que l’huile est incorporée à la préparation. « Pétris avec de l’huile » exprime naturellement cette opération culinaire.
- source_word: רְקִיקֵי מַצּוֹת
  choice: galettes fines sans levain
  rationale: רְקִיקִים désigne des pièces minces de pâte cuite. « Galettes fines » est plus naturel en français moderne que « gaufrettes » dans ce contexte rituel.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: enduites d’huile
  rationale: Le participe de משׁח décrit ici l’application d’huile sur un aliment. « Enduites » communique le geste concret sans suggérer à tort qu’il s’agit nécessairement d’une onction de consécration.
theological_decisions:
- issue: Sens cultuel de מִנְחָה
  choice: offrande de céréales
  alternative: offrande, don ou tribut
  rationale: Dans ce chapitre, les ingrédients et les modes de préparation montrent qu’il s’agit d’une catégorie sacrificielle à base de produits céréaliers. La traduction retenue préserve cette spécificité sans ajouter d’interprétation doctrinale.
- issue: Relation entre les deux formes de préparation reliées par ו
  choice: ou, avec une note signalant l’hébreu littéral
  alternative: et
  rationale: Le contexte énumère vraisemblablement deux formes possibles de l’offrande cuite au four. « Ou » rend cette fonction distributive en français, tandis que la note conserve l’ambiguïté formelle du texte hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La terminologie rituelle reste précise, tandis que les opérations culinaires sont exprimées dans un langage courant. Le tutoiement suit l’adresse directe au singulier du texte hébreu.
