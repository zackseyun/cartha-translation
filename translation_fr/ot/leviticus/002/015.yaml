  yaml_path: translation/ot/leviticus/002/015.yaml
  text: And you shall put oil on it[a], and place frankincense on it; it is a grain offering.
translation:
  language: fr
  text: 'Tu mettras de l’huile dessus[a] et tu y placeras de l’encens : c’est une offrande de céréales.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu mettras de l’huile dessus et tu y déposeras de l’encens. » Les verbes hébreux sont des termes courants qui peuvent désigner le fait de mettre, de placer ou d’appliquer les éléments sur l’offrande.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Tu verseras
  rationale: Le verbe נתן a un sens large (« donner, mettre, placer »). Avec l’huile, « verser » exprime naturellement l’application sur l’offrande sans préciser une modalité absente du contexte immédiat.
- source_word: עָלֶיהָ
  choice: dessus / y
  rationale: La préposition על avec suffixe féminin singulier indique que l’huile et l’encens sont placés sur l’offrande décrite au verset précédent. Ces formulations évitent une répétition lourde en français.
- source_word: שֶׁמֶן
  choice: huile
  rationale: L’hébreu dit simplement « huile ». Même s’il s’agit vraisemblablement d’huile d’olive dans ce contexte rituel, la traduction n’ajoute pas cette précision.
- source_word: וְשַׂמְתָּ
  choice: tu déposeras
  rationale: שׂים signifie couramment « mettre, placer ». « Déposer » convient à la pose intentionnelle de l’encens et distingue naturellement ce geste de l’application de l’huile.
- source_word: לְבֹנָה
  choice: encens
  rationale: לְבֹנָה désigne précisément l’oliban, couramment appelé « encens » en français biblique et usuel. Le contexte ne vise pas l’encens au sens générique d’un mélange aromatique.
- source_word: מִנְחָה
  choice: offrande de céréales
  rationale: Dans la législation sacrificielle du Lévitique, מִנְחָה désigne l’offrande préparée à partir de produits céréaliers, et non une offrande quelconque.
- source_word: הִוא
  choice: c’est
  rationale: Le pronom féminin identifie simplement ce qui vient d’être décrit comme une offrande de céréales.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le futur à valeur prescriptive rend naturellement l’instruction rituelle. « Offrande de céréales » est clair pour le grand public tout en conservant la catégorie sacrificielle du texte.
