  text: וְ/אִם מִנְחַ֥ת מַרְחֶ֖שֶׁת קָרְבָּנֶ֑/ךָ סֹ֥לֶת בַּ/שֶּׁ֖מֶן תֵּעָשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/007.yaml
  text: And if your offering is a grain offering from a pan[a], it shall be made of fine flour with oil.
translation:
  language: fr
  text: Et si ton offrande est une offrande de céréales préparée dans une poêle[a], elle sera faite de fleur de farine avec de l’huile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plat de cuisson », « poêle profonde » ou « casserole » ; le type exact de récipient désigné par le terme hébreu est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Et si
  rationale: La conjonction suivie de la particule conditionnelle introduit un nouveau cas dans la série d’instructions et en préserve l’enchaînement.
- source_word: מִנְחַת
  choice: offrande de céréales
  rationale: Dans Lévitique 2, מִנְחָה désigne l’offrande composée de produits céréaliers plutôt qu’un don générique.
- source_word: מַרְחֶשֶׁת
  choice: poêle
  rationale: Le terme désigne un récipient de cuisson dont la forme exacte est incertaine; « poêle » reste naturel et suffisamment général en français moderne.
- source_word: קָרְבָּנֶךָ
  choice: ton offrande
  rationale: קָרְבָּן désigne ce qui est présenté à Dieu; « offrande » rend naturellement le terme et son suffixe possessif singulier.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: Expression française consacrée pour une farine très fine, ici ingrédient cultuel de l’offrande.
- source_word: בַּשֶּׁמֶן
  choice: avec de l’huile
  rationale: La préposition indique ici l’accompagnement ou la matière employée, sans imposer explicitement l’idée plus précise de mélange.
- source_word: תֵּעָשֶׂה
  choice: elle sera faite
  rationale: Le passif conserve la forme du niphal et le ton prescriptif de l’instruction.
theological_decisions: []
