source:
  edition: WLC
  text: וְ/הַ/נּוֹתֶ֨רֶת֙ מִן הַ/מִּנְחָ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו קֹ֥דֶשׁ קָֽדָשִׁ֖ים מֵ/אִשֵּׁ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/010.yaml
  text: And what remains of the grain offering shall be for Aaron and for his sons[a], most holy from the food offerings of Yahweh.
translation:
  language: fr
  text: 'Ce qui reste de l’offrande de céréales reviendra à Aaron et à ses fils : c’est une part très sainte provenant des offrandes offertes par le feu à Yahweh.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « une part très sainte provenant des offrandes alimentaires de Yahweh ».'
    reason: Le terme hébreu אִשֶּׁה peut être rendu soit par une expression qui met en avant la présentation par le feu, soit, dans le vocabulaire sacrificiel, par « offrande alimentaire ».
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת
  choice: Ce qui reste
  rationale: Le participe avec article est substantivé et désigne la portion restante; cette tournure est naturelle en français moderne.
- source_word: מִן הַמִּנְחָה
  choice: de l’offrande de céréales
  rationale: Dans Lévitique 2, מִנְחָה désigne précisément l’offrande végétale préparée à partir de produits céréaliers, et non une offrande générique.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: sera pour Aaron et ses fils
  rationale: La préposition לְ marque ici l’attribution; le futur français rend naturellement la portée prescriptive du texte.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: une part très sainte
  rationale: L’expression intensive hébraïque indique le degré suprême de sainteté. « Une part » explicite sobrement le référent sans assimiler l’expression au lieu appelé « Saint des saints ».
- source_word: מֵאִשֵּׁי
  choice: parmi les offrandes consumées
  rationale: Le terme אִשֶּׁה désigne une offrande présentée sur le feu. « Consumées » conserve ce cadre sacrificiel sans suggérer que l’offrande entière est nécessairement brûlée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rapport exprimé par מֵאִשֵּׁי יְהוָה
  choice: parmi les offrandes consumées pour Yahweh
  alternative: provenant des offrandes faites par le feu à Yahweh
  rationale: Le מִן peut exprimer l’appartenance à une catégorie ou la provenance. La traduction principale indique que la part sacerdotale relève des offrandes présentées sur le feu, tandis que la note conserve l’autre articulation possible.
- issue: Valeur de קֹדֶשׁ קָדָשִׁים
  choice: une part très sainte
  alternative: très saint
  rationale: L’ajout explicatif « une part » identifie le reste de l’offrande comme référent, sans introduire de doctrine supplémentaire; l’intensité de l’idiome hébreu est maintenue.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire sacrificiel reste concret; « offrande de céréales » évite l’ambiguïté d’« offrande végétale », et le nom divin est translittéré « Yahweh ».
