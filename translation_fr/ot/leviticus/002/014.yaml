  verdict: revise
  source_fidelity: Le texte rend correctement la condition, le nom divin, l’offrande de prémices, ainsi que les deux descriptions successives de la céréale préparée. La répétition de תקריב est conservée. « Épis frais », « grillés au feu » et « grains concassés de la nouvelle récolte » sont des équivalents défendables des termes hébreux, dont la délimitation précise demeure discutée.
  naturalness: 'La formulation « tu présenteras comme offrande de tes prémices » est lourde et ambiguë en français : elle peut faire entendre que l’offrande est faite “comme” des prémices plutôt qu’être l’offrande constituée des prémices. Une formulation appositive avec deux-points rend plus naturellement la syntaxe descriptive de l’hébreu.'
  terminology: « Yahweh », « offrande », « prémices » et « nouvelle récolte » conviennent au registre biblique français moderne. « Offrande des prémices » est plus idiomatique que « offrande de prémices » dans ce contexte, tout en gardant le sens cultuel.
