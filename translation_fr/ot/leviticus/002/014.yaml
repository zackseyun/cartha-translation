  - severity: low
    issue: 'Note formulée de façon peu naturelle : « récolte fraîche »'
    rationale: En français, « nouvelle récolte » est plus idiomatique ici. La note peut présenter les variantes lexicales sans affirmer une résolution excessive de l’ambiguïté entre céréale verte/fraîche et grain de la nouvelle récolte.
