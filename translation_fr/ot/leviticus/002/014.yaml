source:
  edition: WLC
  text: וְ/אִם תַּקְרִ֛יב מִנְחַ֥ת בִּכּוּרִ֖ים לַ/יהוָ֑ה אָבִ֞יב קָל֤וּי בָּ/אֵשׁ֙ גֶּ֣רֶשׂ כַּרְמֶ֔ל תַּקְרִ֕יב אֵ֖ת מִנְחַ֥ת בִּכּוּרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/014.yaml
  text: And if you present to Yahweh an offering of firstfruits, you shall present your offering of firstfruits as fresh heads of grain roasted in the fire, crushed kernels from the fresh grain.
translation:
  language: fr
  text: 'Si tu présentes à Yahweh une offrande des prémices, tu présenteras l’offrande de tes prémices : des épis frais grillés au feu, des grains concassés de la nouvelle récolte.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « du grain vert grillé au feu, des grains concassés de la nouvelle récolte ». Les termes hébreux peuvent désigner des céréales encore fraîches ou le grain de la récolte nouvelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחַת
  choice: offrande
  rationale: Dans Lévitique 2, מִנְחָה désigne techniquement une offrande faite de produits végétaux. « Offrande » reste naturel ici, tandis que la suite précise qu’il s’agit de céréales.
- source_word: בִּכּוּרִים / בִּכּוּרֶיךָ
  choice: prémices / tes prémices
  rationale: Le terme désigne les premiers produits mûrs consacrés à Dieu. « Prémices » est précis, digne et bien établi dans le vocabulaire biblique français.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le texte hébreu porte le nom divin יהוה; « Yahweh » le rend comme nom propre, conformément à la couche de consultation anglaise révisée.
- source_word: אָבִיב
  choice: épis frais
  rationale: אָבִיב évoque la céréale encore fraîche dans l’épi, au début de sa maturité. « Épis frais » conserve l’image agricole sans suggérer qu’elle est simplement verte.
- source_word: קָלוּי בָּאֵשׁ
  choice: grillés au feu
  rationale: Cette expression décrit la préparation des épis par exposition au feu. « Grillés au feu » est idiomatique et concret en français moderne.
- source_word: גֶּרֶשׂ
  choice: grains concassés
  rationale: Le nom désigne des grains brisés ou grossièrement broyés. « Grains concassés » est précis et courant.
- source_word: כַּרְמֶל
  choice: de la nouvelle récolte
  rationale: Dans ce contexte, כַּרְמֶל renvoie à une production céréalière fraîche ou nouvellement mûre, non au nom de lieu. « Nouvelle récolte » exprime naturellement ce sens contextuel.
- source_word: תַּקְרִיב ... תַּקְרִיב
  choice: présentes ... tu présenteras
  rationale: La répétition du hifil de קרב est conservée afin de rendre le geste rituel consistant à apporter et présenter l’offrande.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le caractère de nom propre et suit la décision doctrinale fournie, sans substituer un titre.
- issue: Nature de מִנְחָה
  choice: offrande
  alternative: offrande de céréales
  rationale: Le contexte indique clairement une offrande céréalière, mais le terme hébreu reste « offrande » et reçoit ici la qualification « de prémices ». Le choix évite d’alourdir la formulation tout en laissant les matières énumérées préciser sa nature.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier correspond aux verbes hébreux à la deuxième personne du masculin singulier. La syntaxe répétitive de « présenter » est maintenue pour refléter le texte source, et la note conserve l’incertitude lexicale entourant אָבִיב et כַּרְמֶל.
