  rationale: La révision restitue le pronom « n’en » correspondant à מִמֶּנּוּ et remplace une expression susceptible d’exagérer la portée de אִשֶּׁה par « offrande par le feu ». Les ancres de notes demeurent attachées respectivement au terme cultuel et à « miel ».
