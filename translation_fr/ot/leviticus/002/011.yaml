  text: כָּל הַ/מִּנְחָ֗ה אֲשֶׁ֤ר תַּקְרִ֨יבוּ֙ לַ/יהוָ֔ה לֹ֥א תֵעָשֶׂ֖ה חָמֵ֑ץ כִּ֤י כָל שְׂאֹר֙ וְ/כָל דְּבַ֔שׁ לֹֽא תַקְטִ֧ירוּ מִמֶּ֛/נּוּ אִשֶּׁ֖ה לַֽ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/011.yaml
  text: Every grain offering that you present to Yahweh shall not be made with leaven[b][a], for you shall not burn any leaven or any honey from it as a food offering to Yahweh.
translation:
  language: fr
  text: Aucune offrande de céréales que vous présenterez à Yahweh ne sera préparée avec du levain. En effet, vous n’en ferez brûler sur l’autel ni levain ni miel[b] comme offrande par le feu[a] pour Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « offrande faite par le feu ». Le terme hébreu désigne une offrande présentée sur l’autel en la brûlant.
    reason: lexical_alternative
  - marker: b
    text: Dans l’usage ancien, le mot traduit par « miel » pouvait aussi désigner un sirop de fruits, et pas seulement le miel d’abeilles.
    reason: cultural_note
lexical_decisions:
- source_word: הַמִּנְחָה
  choice: offrande de céréales
  rationale: Dans Lévitique 2, מִנְחָה désigne précisément l’offrande préparée à partir de farine ou de produits céréaliers; cette formulation est claire et actuelle.
- source_word: תַּקְרִיבוּ
  choice: vous présenterez
  rationale: Le hiphil de קרב exprime ici l’action cultuelle d’apporter et de présenter l’offrande devant Dieu.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le tétragramme est rendu par le nom divin « Yahweh », et la préposition marque le destinataire de l’offrande.
- source_word: תֵעָשֶׂה חָמֵץ
  choice: ne sera préparée avec du levain
  rationale: Cette formulation française naturelle exprime l’interdiction de préparer l’offrande sous une forme levée.
- source_word: שְׂאֹר / חָמֵץ
  choice: levain
  rationale: « Levain » conserve la portée générale et cultuelle des termes hébreux sans les réduire à la levure commerciale moderne.
- source_word: דְּבַשׁ
  choice: miel
  rationale: « Miel » est le sens lexical usuel; une note signale que l’usage ancien pouvait aussi englober certains sirops de fruits.
- source_word: לֹא תַקְטִירוּ
  choice: vous ne ferez brûler sur l’autel
  rationale: Le hiphil de קטר désigne la combustion sacrificielle qui fait monter la fumée; la mention de l’autel explicite naturellement le cadre cultuel.
- source_word: אִשֶּׁה
  choice: sacrifice consumé par le feu
  rationale: Cette expression rend la catégorie cultuelle d’une offrande brûlée sur l’autel sans supposer que le mot signifie littéralement « nourriture ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve ici le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Terminologie cultuelle de אִשֶּׁה
  choice: sacrifice consumé par le feu
  alternative: offrande faite par le feu
  rationale: Le choix principal est idiomatique en français tout en indiquant clairement la combustion sur l’autel; l’alternative plus littérale est donnée en note.
- issue: Rapport de מִמֶּנּוּ avec le levain, le miel ou l’offrande
  choice: ne pas surcharger le texte français d’un antécédent explicite
  alternative: vous n’en ferez rien brûler / vous ne ferez brûler aucune part de cette offrande
  rationale: Le pronom hébreu est singulier et son rattachement exact n’est pas entièrement transparent. La formulation retenue conserve l’interdiction centrale sans trancher artificiellement son antécédent.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe impérative est ferme sans être archaïque; les termes cultuels sont précis, et les deux appels de note [a] et [b] figurent à l’endroit correspondant dans le texte.
