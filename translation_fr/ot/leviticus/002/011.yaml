    issue: Omission de la valeur de מִמֶּנּוּ dans la seconde phrase.
    rationale: Le texte hébreu contient un pronom singulier, le plus naturellement rapporté à l’offrande de céréales. Le rendre par « n’en » conserve ce lien sans ajouter d’interprétation théologique.
  - severity: medium
    issue: « Sacrifice consumé par le feu » est trop spécifique pour אִשֶּׁה.
    rationale: Cette expression peut évoquer une offrande entièrement consumée. Le terme hébreu désigne une offrande faite par combustion sur l’autel; « offrande par le feu » est plus sûr et correspond à la note proposée.
