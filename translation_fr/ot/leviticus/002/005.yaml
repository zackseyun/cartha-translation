  rationale: La révision explicite la cuisson associée à la mahavet, modernise « fleur de farine » en « farine fine » et conserve l’ambiguïté lexicale de l’ustensile dans la note. Le sens prescriptif, les ingrédients et l’absence de levain sont préservés.
