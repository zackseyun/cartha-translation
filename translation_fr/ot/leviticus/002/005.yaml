    rationale: L’expression est compréhensible, mais « farine fine » est plus naturelle et transmet directement la qualité indiquée par סֹלֶת.
  revised_text: Si l’offrande que tu présentes est une offrande de céréales cuite sur une plaque de cuisson, elle sera faite de farine fine mélangée à l’huile et sans levain.
