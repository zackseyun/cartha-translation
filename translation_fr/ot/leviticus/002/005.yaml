  source_fidelity: 'La traduction rend correctement les éléments essentiels : l’offrande céréalière, l’adresse à la deuxième personne, la farine fine mêlée d’huile et l’exigence d’absence de levain. Toutefois, « est préparée » affaiblit le rapport plus concret de l’hébreu à l’ustensile de cuisson ; « cuite sur » le rend plus fidèlement sans trancher la forme précise de la mahavet.'
  naturalness: « Farine fine » est plus courant et immédiatement clair en français international moderne que « fleur de farine ». La reprise explicite « l’offrande que tu présentes » permet aussi une phrase française fluide tout en conservant la relation entre qorbanka et minchah.
  terminology: « Offrande de céréales » est approprié pour מִנְחָה dans ce contexte. « Plaque de cuisson » est une solution prudente pour מַחֲבַת ; la note maintient l’alternative d’une poêle plate sans prétendre identifier l’ustensile avec certitude.
