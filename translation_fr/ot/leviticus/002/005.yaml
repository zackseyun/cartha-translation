source:
  edition: WLC
  text: וְ/אִם מִנְחָ֥ה עַל הַֽ/מַּחֲבַ֖ת קָרְבָּנֶ֑/ךָ סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן מַצָּ֥ה תִהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/005.yaml
  text: And if your offering is a grain offering on the griddle[a], it shall be of fine flour mixed with oil, unleavened.
translation:
  language: fr
  text: Si l’offrande que tu présentes est une offrande de céréales cuite sur une plaque de cuisson, elle sera faite de farine fine mélangée à l’huile et sans levain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָה
  choice: offrande de céréales
  rationale: Dans Lévitique 2, le terme désigne précisément une offrande composée de farine ou de produits céréaliers, et non un don quelconque.
- source_word: עַל הַמַּחֲבַת
  choice: préparée sur une plaque
  rationale: Le nom hébreu désigne une surface ou un ustensile plat servant à la cuisson. « Plaque » reste naturel en français et évite de préciser indûment sa forme exacte; « préparée » explicite sobrement la relation exprimée par la préposition.
- source_word: קָרְבָּנְךָ
  choice: ton offrande
  rationale: Le suffixe de deuxième personne est conservé par « ton ». Dans la phrase française, « offrande » rend à la fois la présentation cultuelle et son identification comme offrande de céréales, sans répétition lourde.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: Cette expression française établie désigne une farine fine et de qualité, conformément au terme cultuel hébreu.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: mélangée à l’huile
  rationale: Le participe indique que la farine est combinée avec de l’huile sans imposer une méthode plus précise telle que le pétrissage.
- source_word: מַצָּה
  choice: sans levain
  rationale: L’adjectif qualifie ici l’offrande et exige l’absence de levain; la formulation française est claire sans transformer le mot en nom désignant un pain distinct.
- source_word: תִהְיֶה
  choice: elle sera faite
  rationale: Le futur français conserve la valeur prescriptive de l’imparfait hébreu dans ce contexte légal; « faite » permet une construction française naturelle avec l’ingrédient indiqué.
theological_decisions: []
