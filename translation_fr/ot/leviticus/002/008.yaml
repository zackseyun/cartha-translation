- from: Tu apporteras à Yahweh[a] l’offrande de céréales préparée de l’une de ces manières. Tu la présenteras au prêtre, et celui-ci l’approchera de l’autel.
  to: Tu apporteras à Yahweh[a] l’offrande de céréales préparée de l’une de ces manières. Tu la remettras au prêtre, qui l’approchera de l’autel.
  rationale: 'La révision rend explicitement la succession la plus naturelle des sujets indiquée par les formes verbales hébraïques : l’adorateur remet l’offrande au prêtre, puis le prêtre l’approche de l’autel. Elle conserve le futur prescriptif, le nom divin et l’ambiguïté limitée de la préposition בפני Yahweh.'
