  text: וְ/הֵבֵאתָ֣ אֶת הַ/מִּנְחָ֗ה אֲשֶׁ֧ר יֵעָשֶׂ֛ה מֵ/אֵ֖לֶּה לַ/יהוָ֑ה וְ/הִקְרִיבָ/הּ֙ אֶל הַ/כֹּהֵ֔ן וְ/הִגִּישָׁ֖/הּ אֶל הַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/008.yaml
  text: And you shall bring the grain offering that is made from these things to Yahweh[a], and he shall present it to the priest, and he shall bring it near to the altar.
translation:
  language: fr
  text: Tu apporteras à Yahweh[a] l’offrande de céréales préparée de l’une de ces manières. Tu la remettras au prêtre, qui l’approchera de l’autel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour Yahweh ». La préposition hébraïque peut exprimer soit la direction, soit la consécration.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: Tu apporteras
  rationale: Le hifil de בוא, avec le waw, exprime ici une prescription adressée à une personne au masculin singulier. Le futur français convient au style juridique et rituel.
- source_word: הַמִּנְחָה
  choice: l’offrande de céréales
  rationale: Dans Lévitique 2, מִנְחָה désigne précisément une offrande préparée à partir de produits céréaliers, et non une offrande générique.
- source_word: אֲשֶׁר יֵעָשֶׂה מֵאֵלֶּה
  choice: préparée de l’une de ces manières
  rationale: Le passif de עשה indique la préparation; מֵאֵלֶּה renvoie naturellement aux différentes préparations décrites juste avant. Cette formulation française restitue ce renvoi sans répéter leurs détails.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le nom divin יהוה est translittéré « Yahweh ». La préposition ל marque ici soit la destination rituelle, soit la consécration de l’offrande; « à » convient au mouvement exprimé dans la phrase, avec une note signalant l’autre nuance.
- source_word: וְהִקְרִיבָהּ אֶל הַכֹּהֵן
  choice: Tu la présenteras au prêtre
  rationale: Le hifil de קרב signifie faire approcher ou présenter. La continuité de l’adresse à la deuxième personne indique que l’adorateur remet l’offrande au prêtre.
- source_word: וְהִגִּישָׁהּ אֶל הַמִּזְבֵּחַ
  choice: et celui-ci l’approchera de l’autel
  rationale: Le hifil de נגשׁ exprime l’action de faire approcher. « Celui-ci » rend explicite en français le changement naturel de sujet vers le prêtre, sans confondre cette étape avec la présentation précédente.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme, nom propre du Dieu d’Israël. « Yahweh » en conserve la fonction de nom personnel.
- issue: Valeur de la préposition ל devant le nom divin
  choice: à Yahweh
  alternative: pour Yahweh
  rationale: La préposition peut exprimer aussi bien la destination que la consécration. Le texte principal retient « à » en harmonie avec le mouvement rituel, tandis que la note préserve explicitement la nuance de destination bénéfactive ou de dédicace.
translation_notes:
  register: Français moderne, clair et digne, avec le futur prescriptif propre aux instructions rituelles. « Offrande de céréales » est précis et accessible. L’expression « celui-ci » clarifie le changement de sujet requis par la séquence rituelle.
