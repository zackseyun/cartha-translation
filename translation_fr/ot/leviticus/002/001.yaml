id: LEV.2.1
reference: Leviticus 2:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נֶ֗פֶשׁ כִּֽי תַקְרִ֞יב קָרְבַּ֤ן מִנְחָה֙ לַֽ/יהוָ֔ה סֹ֖לֶת יִהְיֶ֣ה קָרְבָּנ֑/וֹ וְ/יָצַ֤ק עָלֶ֨י/הָ֙ שֶׁ֔מֶן וְ/נָתַ֥ן עָלֶ֖י/הָ לְבֹנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/001.yaml
  text: When a person presents a grain offering to Yahweh[a], his offering shall be of fine flour[b], and he shall pour oil on it and put frankincense on it.
translation:
  language: fr
  text: Si quelqu’un présente à Yahvé[a] une offrande de céréales[b], son offrande sera faite de farine fine. Il versera de l’huile dessus et y déposera de l’encens[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte le nom divin יהוה (YHWH), traditionnellement rendu aussi par « le SEIGNEUR »; « Yahweh » est une autre transcription.
    reason: divine_name
  - marker: b
    text: Le mot hébreu מִנְחָה peut désigner ailleurs un don ou un tribut; dans ce contexte cultuel, il s’agit d’une offrande végétale, ici composée de farine fine.
    reason: lexical_and_cultural_note
  - marker: c
    text: Il s’agit de l’oliban, une résine aromatique brûlée comme encens.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: quelqu’un
  rationale: Dans cette prescription cultuelle, le mot désigne une personne prise individuellement, et non l’âme au sens métaphysique. « Quelqu’un » restitue naturellement la portée générale du singulier.
- source_word: תַקְרִיב
  choice: présente
  rationale: Le hifil de קרב exprime ici le fait d’apporter ou de présenter quelque chose comme offrande. « Présente » convient au cadre cultuel sans surtraduire le geste.
- source_word: קָרְבַּן מִנְחָה
  choice: une offrande de céréales
  rationale: קָרְבַּן est le terme général pour ce qui est apporté en offrande, tandis que מִנְחָה désigne ici l’offrande végétale caractéristique de Lévitique 2. La formulation française précise sa nature sans la confondre avec un sacrifice animal.
- source_word: לַיהוָה
  choice: à Yahvé
  rationale: La préposition ל est rendue par « à », et le nom divin יהוה est représenté comme nom propre plutôt que remplacé silencieusement par un titre.
- source_word: סֹלֶת
  choice: farine fine
  rationale: Le terme désigne une farine de qualité, finement moulue. « Farine fine » est clair en français moderne et évite l’éventuelle ambiguïté de « fleur de farine ».
- source_word: יִהְיֶה קָרְבָּנוֹ
  choice: son offrande sera faite de
  rationale: La tournure explicite en français la composition de l’offrande indiquée par l’hébreu, tout en conservant le suffixe singulier de קָרְבָּנוֹ.
- source_word: וְיָצַק עָלֶיהָ שֶׁמֶן
  choice: Il versera de l’huile dessus
  rationale: Le parfait avec waw poursuit ici l’instruction cultuelle. Le futur normatif français en garde la valeur, et « dessus » renvoie à l’offrande.
- source_word: וְנָתַן עָלֶיהָ לְבֹנָה
  choice: et y déposera de l’encens
  rationale: לְבֹנָה désigne l’oliban, résine aromatique employée comme encens. « Encens » est le terme courant et intelligible; « y déposera » rend le placement sur l’offrande.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR; Yahweh
  rationale: Le texte hébreu porte directement le tétragramme. « Yahvé » est une forme française reconnue qui maintient le caractère de nom propre; la note signale les conventions concurrentes sans prétendre fixer avec certitude la vocalisation ancienne.
- issue: Genre et singulier dans la prescription légale
  choice: quelqu’un… son offrande… il versera… déposera
  alternative: une personne… son offrande… elle versera; quiconque… versera
  rationale: נֶפֶשׁ est grammaticalement féminin et commande d’abord תַקְרִיב au féminin, mais les verbes suivants sont masculins singuliers et le suffixe de קָרְבָּנוֹ est masculin. « Quelqu’un » permet de conserver le singulier représentatif et la progression grammaticale du texte sans donner à נֶפֶשׁ un sens métaphysique.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase garde la forme d’une prescription au singulier. Le vocabulaire cultuel reste accessible; les termes plus techniques et les variantes de traduction sont placés en notes.
