  text: Break it into pieces and pour oil on it[a]; it is a grain offering.
translation:
  language: fr
  text: 'Brise-la en morceaux et verse de l’huile dessus[a] : c’est une offrande de céréales.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « émiette-la » ou « brise-la en fragments ». L’hébreu souligne que l’offrande est réduite en petits morceaux avant que l’huile y soit versée.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּת֤וֹת אֹתָהּ פִּתִּים
  choice: Brise-la en morceaux
  rationale: L’infinitif absolu de פתת a ici une valeur impérative, et le nom pluriel פִּתִּים exprime le résultat de l’action. « Brise-la en morceaux » est naturel en français et conserve le pronom féminin renvoyant à l’offrande cuite mentionnée dans le contexte.
- source_word: וְיָצַקְתָּ
  choice: puis verse
  rationale: Le parfait qal à la deuxième personne masculine singulière, précédé de waw dans cette suite d’instructions, a une valeur directive. « Puis » rend clairement l’enchaînement des gestes.
- source_word: עָלֶיהָ
  choice: dessus
  rationale: La préposition עַל avec suffixe indique que l’huile est versée sur l’offrande. « Dessus » évite une répétition pronominale lourde et reste précis.
- source_word: שָׁמֶן
  choice: huile
  rationale: L’hébreu dit simplement « huile ». Préciser « huile d’olive » ajouterait une information culturellement probable, mais non exprimée dans ce verset.
- source_word: מִנְחָה
  choice: offrande de céréales
  rationale: Dans Lévitique 2, מִנְחָה désigne l’offrande préparée à partir de produits céréaliers. Cette formulation est claire et contextuellement précise.
- source_word: הִוא
  choice: c’est
  rationale: Le pronom indépendant identifie ce qui vient d’être décrit. « C’est » rend naturellement cette prédication en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. L’impératif singulier et la succession procédurale sont maintenus; le féminin de « la » reprend naturellement l’offrande cuite du contexte.
