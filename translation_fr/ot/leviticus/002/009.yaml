review_pass:
  verdict: revise
  source_fidelity: 'Le sens rituel est globalement juste : le prêtre retire une portion représentative de l’offrande de céréales et la fait brûler sur l’autel. Toutefois, « c’est une offrande » transforme maladroitement la formule nominale hébraïque en commentaire explicatif et relie moins nettement l’apposition sacrificielle à la portion brûlée. « De l’offrande » rend plus directement מן que « sur l’offrande ».'
  naturalness: Le français est sobre et intelligible, mais « dont l’odeur est agréable » est moins idiomatique et moins proche de la formule cultuelle que « au parfum agréable ». « Faire brûler » est également plus naturel et précis ici que « faire fumer ».
  terminology: « Offrande de céréales », « part commémorative », « autel » et « Yahvé » conviennent. « Offrande par le feu » rend de manière établie et non surinterprétative אִשֶּׁה. La note conserve l’alternative « offrande alimentaire » sans imposer une analyse étymologique ou théologique.
  issues:
  - severity: medium
    issue: La formule « c’est une offrande consumée par le feu » explicite et réorganise l’apposition hébraïque.
    rationale: Le texte dit littéralement, après l’acte de combustion, « offrande par le feu, parfum agréable pour Yahvé ». Une formulation appositionnelle française préserve mieux le lien syntaxique et cultuel.
  - severity: low
    issue: « sur l’offrande de céréales » et « dont l’odeur est agréable » sont moins directs et moins naturels.
    rationale: « De l’offrande » reproduit clairement le partitif ; « au parfum agréable pour Yahvé » rend la formule רֵיחַ נִיחֹחַ en français courant tout en conservant son imagerie.
  revised_text: 'Puis le prêtre prélèvera de l’offrande de céréales sa part commémorative et la fera brûler sur l’autel : une offrande par le feu[a], au parfum agréable pour Yahvé.'
  revised_footnotes:
