revisions:
- from: 'Puis le prêtre prélèvera sur l’offrande de céréales sa part commémorative et la fera fumer sur l’autel : c’est une offrande consumée par le feu[a], dont l’odeur est agréable à Yahvé.'
  to: 'Puis le prêtre prélèvera de l’offrande de céréales sa part commémorative et la fera brûler sur l’autel : une offrande par le feu[a], au parfum agréable pour Yahvé.'
  rationale: La révision rend plus directement le partitif hébreu, conserve la formule sacrificielle sous forme d’apposition et emploie une expression française plus idiomatique pour le « parfum agréable ». Elle préserve, en note, l’alternative lexicale pertinente pour אִשֶּׁה.
