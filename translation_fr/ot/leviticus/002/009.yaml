    text: Ou « une offrande alimentaire, au parfum agréable pour Yahvé ».
    reason: Alternative lexicale pour אִשֶּׁה, terme sacrificiel traditionnellement compris comme une offrande faite par le feu, mais parfois rendu par « offrande alimentaire ».
  revision_rationale: La révision rend plus directement le partitif hébreu, conserve la formule sacrificielle sous forme d’apposition et emploie une expression française plus idiomatique pour le « parfum agréable ». Elle préserve, en note, l’alternative lexicale pertinente pour אִשֶּׁה.
