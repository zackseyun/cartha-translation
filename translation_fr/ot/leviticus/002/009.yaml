  text: וְ/הֵרִ֨ים הַ/כֹּהֵ֤ן מִן הַ/מִּנְחָה֙ אֶת אַזְכָּ֣רָתָ֔/הּ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/009.yaml
  text: Then the priest shall lift up from the grain offering its memorial portion and burn it on the altar[a], a food offering, a pleasing aroma to Yahweh.
translation:
  language: fr
  text: 'Puis le prêtre prélèvera de l’offrande de céréales sa part commémorative et la fera brûler sur l’autel : une offrande par le feu[a], au parfum agréable pour Yahvé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une offrande alimentaire, au parfum agréable pour Yahvé ».
    reason: Alternative lexicale pour אִשֶּׁה, terme sacrificiel traditionnellement compris comme une offrande faite par le feu, mais parfois rendu par « offrande alimentaire ».
lexical_decisions:
- source_word: וְהֵרִים
  choice: prélèvera
  rationale: Dans ce contexte rituel, le hiphil de רום désigne l’action de retirer une partie de l’offrande pour la présenter. « Prélèvera » exprime naturellement en français à la fois la séparation et la destination cultuelle de cette portion.
- source_word: מִן הַמִּנְחָה
  choice: sur l’offrande de céréales
  rationale: En Lévitique 2, מִנְחָה désigne précisément l’offrande préparée à partir de produits céréaliers. La construction française « prélever sur » rend idiomatiquement la relation partitive introduite par מִן.
- source_word: אֶת אַזְכָּרָתָהּ
  choice: sa part commémorative
  rationale: Dans le vocabulaire sacrificiel, אַזְכָּרָה est la portion représentative brûlée sur l’autel. « Part commémorative » indique clairement qu’il s’agit d’une partie de l’offrande tout en conservant la notion de mémorial.
- source_word: וְהִקְטִיר הַמִּזְבֵּחָה
  choice: et la fera fumer sur l’autel
  rationale: Le hiphil de קטר évoque ici la combustion sacrificielle produisant de la fumée. « Fera fumer » conserve cette image plus précisément que le simple verbe « brûler », tandis que « sur l’autel » rend naturellement la forme directive הַמִּזְבֵּחָה.
- source_word: אִשֵּׁה
  choice: une offrande consumée par le feu
  rationale: Le terme cultuel désigne une offrande remise à Dieu par combustion. Cette formulation française reste proche de l’acte rituel sans trancher l’étymologie discutée du mot; l’autre compréhension possible comme « mets offert » est signalée en note.
- source_word: רֵיחַ נִיחֹחַ
  choice: dont l’odeur est agréable
  rationale: Cette expression sacrificielle fixe présente l’offrande comme agréée par Dieu au moyen d’une image olfactive. La formulation est naturelle en français moderne et conserve l’anthropomorphisme du texte.
- source_word: לַיהוָה
  choice: à Yahvé
  rationale: Le tétragramme est rendu par le nom personnel « Yahvé », plutôt que remplacé par un titre, afin de représenter explicitement le texte hébreu.
theological_decisions:
- issue: Sens de la formule sacrificielle אִשֵּׁה רֵיחַ נִיחֹחַ
  choice: une offrande consumée par le feu, dont l’odeur est agréable à Yahvé
  alternative: un mets offert, d’une odeur agréable à Yahvé
  rationale: Le texte principal met en avant le moyen rituel, la combustion, tout en maintenant l’image biblique de l’odeur agréable. La note préserve l’analyse lexicale possible d’אִשֵּׁה comme offrande de nourriture ou mets divin, sans imposer une interprétation théologique ultérieure.
translation_notes:
  register: Français international actuel, sobre et cultuel. « Prélèvera », « part commémorative » et « fera fumer » gardent la précision rituelle sans archaïsme. La syntaxe en deux membres conserve le lien étroit entre l’acte sacerdotal et la formule sacrificielle.
