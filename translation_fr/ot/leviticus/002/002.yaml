  text: וֶֽ/הֱבִיאָ֗/הּ אֶל בְּנֵ֣י אַהֲרֹן֮ הַ/כֹּהֲנִים֒ וְ/קָמַ֨ץ מִ/שָּׁ֜ם מְלֹ֣א קֻמְצ֗/וֹ מִ/סָּלְתָּ/הּ֙ וּ/מִ/שַּׁמְנָ֔/הּ עַ֖ל כָּל לְבֹנָתָ֑/הּ וְ/הִקְטִ֨יר הַ/כֹּהֵ֜ן אֶת אַזְכָּרָתָ/הּ֙ הַ/מִּזְבֵּ֔חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/002.yaml
  text: He shall bring it to Aaron’s sons[a], the priests, and he shall take from there a handful of its fine flour and some of its oil, with all of its frankincense. Then the priest shall burn its memorial portion on the altar, a food offering, a pleasing aroma to Yahweh.
translation:
  language: fr
  text: Il l’apportera aux fils d’Aaron, les prêtres. L’un d’eux prendra de là une pleine poignée de sa fleur de farine, avec de son huile, et tout son encens. Puis le prêtre fera fumer sur l’autel sa part commémorative, comme une offrande par le feu, dont l’odeur est agréable à Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  choice: Il l’apportera
  rationale: Le hiphil de בוא exprime ici l’action d’apporter l’offrande; le futur français convient au style prescriptif du passage.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: aux fils d’Aaron, les prêtres
  rationale: La formulation conserve à la fois le lien familial et l’apposition qui identifie les officiants comme prêtres.
- source_word: וְקָמַץ ... מְלֹא קֻמְצוֹ
  choice: L’un d’eux prendra une pleine poignée
  rationale: Le changement implicite de sujet, du présentateur à un prêtre, est rendu explicitement en français; «pleine poignée» restitue מְלֹא קֻמְצוֹ plus précisément qu’une simple «poignée».
- source_word: מִסָּלְתָּהּ וּמִשַּׁמְנָהּ
  choice: de la fleur de farine et de l’huile qui la composent
  rationale: סֹלֶת désigne une farine fine, idiomatiquement «fleur de farine». Les suffixes féminins renvoient à l’offrande végétale; la tournure française évite l’ambiguïté artificielle de possessifs inanimés.
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: avec tout son encens
  rationale: La totalité de l’encens accompagnant l’offrande est incluse dans la part prélevée.
- source_word: וְהִקְטִיר
  choice: fera fumer
  rationale: Dans le langage sacrificiel, le hiphil de קטר désigne le fait de faire monter en fumée sur l’autel; cette traduction préserve davantage cette nuance que le simple verbe «brûler».
- source_word: אַזְכָּרָתָהּ
  choice: cette part commémorative
  rationale: Le terme technique désigne la portion représentative brûlée sur l’autel; «part commémorative» maintient sa fonction cultuelle sans l’expliquer excessivement.
- source_word: אִשֵּׁה
  choice: un sacrifice consumé par le feu
  rationale: Le terme cultuel est lié au feu, mais son étymologie et sa portée exacte sont discutées. Cette formulation naturelle conserve explicitement le mode sacrificiel sans importer l’interprétation «offrande alimentaire».
- source_word: רֵיחַ נִיחֹחַ
  choice: d’une odeur agréable
  rationale: Cette expression sacrificielle indique une odeur reçue favorablement; la formulation est naturelle, digne et préserve la métaphore.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Yahvé
  rationale: Le texte porte directement le tétragramme. «Yahweh» le traite comme le nom divin plutôt que de le remplacer par un titre.
- issue: Sens du terme sacrificiel אִשֵּׁה
  choice: un sacrifice consumé par le feu
  alternative: un mets offert; une offrande faite par le feu
  rationale: Le contexte affirme clairement la combustion sur l’autel, tandis que le sens lexical précis du substantif demeure débattu. Le choix conserve l’élément assuré sans imposer l’image théologique d’une nourriture divine.
- issue: Référent du sujet de וְקָמַץ
  choice: L’un d’eux, c’est-à-dire un des prêtres
  alternative: Le présentateur prendra
  rationale: La proximité de «les prêtres», le sujet explicite «le prêtre» dans la proposition suivante et la procédure sacrificielle soutiennent le prêtre comme agent du prélèvement.
translation_notes:
  register: Français international actuel, sobre et liturgiquement digne. La syntaxe a été légèrement segmentée pour rendre clair le changement de sujet implicite. «Fleur de farine», «faire fumer» et «part commémorative» maintiennent le vocabulaire cultuel sans archaïsme excessif.
