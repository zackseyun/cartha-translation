base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/013.yaml
  text: And every offering of your grain offering you shall season with salt[a]. You shall not let the salt of the covenant of your God be lacking from your grain offering[c][b]; with all your offerings you shall offer salt.
translation:
  language: fr
  text: Toute offrande de céréales, tu la saleras avec du sel[a]. Tu ne laisseras pas le sel de l’alliance de ton Dieu être absent de ton offrande de céréales[b] ; avec toutes tes offrandes, tu présenteras du sel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Avec du sel, tu saleras toute offrande de ton offrande de céréales. »'
    reason: Précision sur la construction hébraïque associant le nom « sel » au verbe « saler ».
  - marker: b
    text: L’expression « le sel de l’alliance de ton Dieu » est conservée littéralement. Dans le contexte sacrificiel, elle est souvent associée à la fidélité et à la permanence de l’alliance, sans que le verset en explicite lui-même le symbolisme.
    reason: Note culturelle qui signale une association interprétative sans la présenter comme une explication fournie par le texte.
  - marker: c
    text: 'Ou : « sur toutes tes offrandes, tu présenteras du sel ».'
    reason: Variante possible pour la préposition hébraïque עַל.
lexical_decisions:
- source_word: קָרְבַּן
  choice: offrande
  rationale: Terme sacrificiel général, rendu par le mot français courant et digne « offrande ».
- source_word: מִנְחָה
  choice: offrande de céréales
  rationale: Dans Lévitique 2, le terme désigne précisément l’offrande végétale préparée à partir de produits céréaliers ; cette traduction conserve la spécificité cultuelle.
- source_word: בַּמֶּלַח תִּמְלָח
  choice: tu saleras
  rationale: Le français « saler » rend directement et naturellement la construction hébraïque qui associe le nom « sel » au verbe « saler » ; la tournure littérale est signalée en note.
- source_word: תַשְׁבִּית
  choice: tu ne laisseras pas … manquer
  rationale: Le hiphil de שבת exprime ici le fait de faire cesser, d’ôter ou de laisser faire défaut ; cette formulation claire conserve la force de l’interdiction.
- source_word: מֶלַח בְּרִית אֱלֹהֶיךָ
  choice: le sel de l’alliance de ton Dieu
  rationale: La chaîne nominale hébraïque et son image cultuelle sont conservées sans en imposer une interprétation symbolique.
- source_word: מֵעַל
  choice: à
  rationale: Avec « manquer », le français idiomatique emploie « manquer à » ; le rapport du sel à l’offrande reste explicite.
- source_word: עַל כָּל קָרְבָּנְךָ
  choice: avec toutes tes offrandes
  rationale: « Avec » exprime naturellement en français l’accompagnement requis, tandis que la possibilité plus concrète « sur » est conservée en note.
- source_word: תַּקְרִיב
  choice: tu présenteras
  rationale: Dans le vocabulaire sacrificiel, le hiphil de קרב signifie présenter ou offrir ; « présenter » garde l’action cultuelle tout en évitant une répétition pesante de « offrande/offrir ».
theological_decisions:
- issue: Faut-il expliquer la portée symbolique du « sel de l’alliance » ?
  choice: Conserver littéralement « le sel de l’alliance de ton Dieu » dans le texte
  alternative: le sel qui représente l’alliance de ton Dieu
  rationale: Le texte affirme cette expression sans en expliciter le symbolisme. La traduction préserve donc l’image et sa tension théologique plutôt que de la résoudre par une paraphrase.
- issue: Rapport exact exprimé par עַל entre le sel et les offrandes dans la dernière proposition
  choice: avec toutes tes offrandes
  alternative: sur toutes tes offrandes
  rationale: La préposition peut indiquer l’accompagnement ou une position concrète. Le texte principal privilégie le français naturel sans exclure la lecture plus littérale, donnée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reproduit l’adresse hébraïque. Le vocabulaire sacrificiel reste précis sans employer de termes archaïques comme « oblation ».
