id: LEV.15.26
reference: Leviticus 15:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כָּל הַ/מִּשְׁכָּ֞ב אֲשֶׁר תִּשְׁכַּ֤ב עָלָי/ו֙ כָּל יְמֵ֣י זוֹבָ֔/הּ כְּ/מִשְׁכַּ֥ב נִדָּתָ֖/הּ יִֽהְיֶה לָּ֑/הּ וְ/כָֽל הַ/כְּלִי֙ אֲשֶׁ֣ר תֵּשֵׁ֣ב עָלָ֔י/ו טָמֵ֣א יִהְיֶ֔ה כְּ/טֻמְאַ֖ת נִדָּתָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/026.yaml
  text: Every bed on which she lies during all the days of her discharge shall be to her like the bed of her menstruation[a], and every vessel on which she sits shall be unclean[b], like the uncleanness of her menstruation.
translation:
  language: fr
  text: Tout lit sur lequel elle se couchera pendant tous les jours de son écoulement sera pour elle comme le lit de ses règles[a]. Tout objet sur lequel elle s’assiéra sera impur[b], comme l’impureté de ses règles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme le lit de son impureté menstruelle ». Le terme hébreu peut désigner les règles ainsi que l’état de séparation rituelle qui leur est associé.
    reason: lexical_alternative
  - marker: b
    text: 'Le terme traduit par « objet » est très général : il peut désigner une chose ou un article sur lequel elle s’assied, et pas seulement un récipient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁכָּב
  choice: lit
  rationale: Le terme désigne ici l’endroit où l’on se couche; « lit » est naturel et précis dans ce contexte rituel.
- source_word: כָּל יְמֵי זוֹבָהּ
  choice: pendant toute la durée de son écoulement
  rationale: זוֹב désigne dans ce passage un écoulement corporel; cette formulation rend naturellement l’expression temporelle hébraïque.
- source_word: כְּמִשְׁכַּב נִדָּתָהּ
  choice: comme le lit de ses règles
  rationale: נִדָּה renvoie ici à l’état menstruel et à la séparation rituelle qui lui est associée; « ses règles » est clair et courant en français moderne.
- source_word: יִהְיֶה לָּהּ
  choice: sera pour elle
  rationale: Cette formulation conserve la construction hébraïque qui attribue au lit, relativement à la femme, le même statut que durant ses règles.
- source_word: כְּלִי
  choice: objet
  rationale: כְּלִי est un terme large désignant un article, un ustensile ou un objet. Ici, « objet » évite de suggérer à tort qu’il s’agit seulement d’un récipient.
- source_word: טָמֵא
  choice: impur
  rationale: Dans la législation lévitique, le terme exprime un statut d’impureté rituelle et non une faute morale.
- source_word: כְּטֻמְאַת נִדָּתָהּ
  choice: comme lors de ses règles
  rationale: La formulation française évite une lourde répétition tout en conservant la comparaison avec l’impureté rituelle liée aux règles.
theological_decisions:
- issue: Nature de l’impureté dans la législation lévitique
  choice: Employer « impur » au sens rituel.
  alternative: « souillé » ou une formulation pouvant évoquer une faute morale
  rationale: Le verset définit un statut rituel au sein des lois de pureté d’Israël; il ne porte pas de jugement sur la culpabilité morale de la femme.
- issue: Sens de נִדָּה
  choice: Traduire concrètement par « règles », avec une note sur l’état d’impureté rituelle associé.
  alternative: « impureté menstruelle » dans le corps du texte
  rationale: Le référent physiologique est clair dans le contexte, mais le mot hébreu peut aussi englober l’état de séparation rituelle; la note préserve cette nuance sans alourdir le texte.
translation_notes:
  register: Français international moderne, sobre et digne. Le futur normatif convient au registre législatif. « Écoulement » conserve la précision corporelle du contexte; « règles » est plus naturel que « menstruation » dans cette construction. Les marqueurs [a] et [b] figurent tous deux dans le texte.
