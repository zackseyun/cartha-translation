source:
  edition: WLC
  text: וְ/כֹ֨ל אֲשֶׁ֤ר יִגַּע בּ/וֹ֙ הַ/זָּ֔ב וְ/יָדָ֖י/ו לֹא שָׁטַ֣ף בַּ/מָּ֑יִם וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/011.yaml
  text: And everyone whom the man with the discharge touches[a], without having washed his hands in water, shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: fr
  text: Si l’homme atteint d’un écoulement touche quelqu’un sans s’être rincé les mains dans l’eau[a], la personne touchée lavera ses vêtements, se lavera dans l’eau et sera impure jusqu’au soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La construction hébraïque est condensée; elle peut aussi se rendre plus littéralement : « Toute personne que touche l’homme atteint d’un écoulement, alors qu’il ne s’est pas rincé les mains dans l’eau… »'
    reason: alternative_syntax
lexical_decisions:
- source_word: הַזָּב
  choice: l’homme atteint d’un écoulement
  rationale: Le participe substantivé désigne ici un homme ayant un écoulement corporel. Cette formulation garde la référence masculine du contexte légal tout en restant claire et actuelle.
- source_word: יִגַּע בּוֹ
  choice: touche quelqu’un
  rationale: Le verbe נגע construit avec ב exprime un contact physique. La restructuration de la phrase rend explicite, en français naturel, la personne qui est touchée.
- source_word: וְיָדָיו לֹא שָׁטַף בַּמָּיִם
  choice: sans s’être rincé les mains dans l’eau
  rationale: שטף évoque le rinçage ou le lavage à grande eau. « Rincer » maintient une distinction utile avec רחץ, employé ensuite pour le lavage du corps. Le sujet sous-entendu est l’homme atteint d’un écoulement.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: lavera ses vêtements
  rationale: כבס désigne couramment le lavage des vêtements. Le futur français exprime naturellement la prescription légale.
- source_word: וְרָחַץ בַּמַּיִם
  choice: se lavera dans l’eau
  rationale: רחץ renvoie ici au lavage du corps. « Se lavera dans l’eau » est naturel et le distingue du lavage des vêtements.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: sera impure jusqu’au soir
  rationale: טמא désigne une impureté rituelle, non une faute morale. L’accord au féminin suit « la personne touchée ».
- source_word: כֹל אֲשֶׁר
  choice: quelqu’un / la personne touchée
  rationale: La construction distributive vise toute personne concernée. La reprise explicite évite une longue relative peu naturelle en français.
theological_decisions:
- issue: Nature de l’impureté dans la législation de pureté du Lévitique
  choice: impure
  alternative: souillée
  rationale: Le passage traite d’un état rituel temporaire causé par le contact, avec lavage prescrit et terme fixé au soir. « Impure » préserve cette catégorie cultuelle sans suggérer une culpabilité morale.
- issue: Sujet du rinçage des mains
  choice: l’homme atteint d’un écoulement
  alternative: la personne touchée
  rationale: Le suffixe masculin pluriel de « ses mains » et le verbe masculin singulier s’enchaînent le plus naturellement avec הַזָּב, l’homme atteint d’un écoulement. La note signale toutefois la difficulté de rattachement que peut présenter la construction hébraïque condensée.
translation_notes:
  register: Français international moderne, clair et digne. La phrase hébraïque a été restructurée en une proposition conditionnelle afin d’identifier naturellement l’auteur du contact et la personne soumise aux prescriptions, sans modifier la portée de la loi.
