source:
  edition: WLC
  text: וְ/הַ/נֹּגֵ֖עַ בִּ/בְשַׂ֣ר הַ/זָּ֑ב יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/007.yaml
  text: Whoever touches the flesh of the man with the discharge shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: fr
  text: Quiconque touche la chair de l’homme qui a un écoulement lavera ses vêtements, se lavera dans l’eau[a] et sera impur jusqu’au soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le corps de l’homme qui a un écoulement ». L’hébreu dit littéralement « la chair de celui qui a un écoulement ».
    reason: Alternative lexicale permettant de préciser que « chair » peut désigner ici le corps physique.
lexical_decisions:
- source_word: וְהַנֹּגֵעַ
  choice: Quiconque touche
  rationale: Le participe substantivé avec l’article a une portée générale dans cette prescription. « Quiconque touche » exprime naturellement cette valeur juridique en français.
- source_word: בִּבְשַׂר
  choice: la chair de
  rationale: בָּשָׂר signifie littéralement « chair » et peut désigner concrètement le corps. Le choix principal conserve ici l’expression hébraïque, tandis que « corps » est signalé comme possibilité en note.
- source_word: הַזָּב
  choice: l’homme qui a un écoulement
  rationale: Le participe masculin singulier désigne, dans ce contexte, l’homme atteint de l’écoulement corporel décrit au début du chapitre. Cette formulation est claire sans préciser davantage la nature de l’écoulement.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: lavera ses vêtements
  rationale: Le verbe désigne couramment le lavage des vêtements. Le futur français convient au style prescriptif des lois bibliques tout en restant naturel.
- source_word: וְרָחַץ בַּמַּיִם
  choice: se lavera dans l’eau
  rationale: רָחַץ indique ici le lavage du corps. « Se lavera dans l’eau » rend explicitement le sens réfléchi et suit de près la construction hébraïque, sans imposer l’idée moderne d’un bain complet.
- source_word: וְטָמֵא
  choice: et sera impur
  rationale: טָמֵא désigne ici l’état d’impureté rituelle. « Impur » est précis en français et n’implique pas en lui-même une faute morale.
- source_word: עַד הָעָרֶב
  choice: jusqu’au soir
  rationale: Cette expression française naturelle reproduit la limite temporelle fixée par l’hébreu.
theological_decisions:
- issue: Nature de l’impureté
  choice: Rendre טָמֵא par « impur » au sens rituel, sans langage de culpabilité morale.
  alternative: « souillé » ou « rituellement impur »
  rationale: Dans Lévitique 15, le contact entraîne un statut d’impureté au sein du système cultuel d’Israël. « Impur » préserve la catégorie biblique sans suggérer que le contact constitue nécessairement un péché; l’ajout « rituellement » expliciterait une dimension contextuelle absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur simple maintient le ton prescriptif du passage. « Écoulement » conserve la formulation médicale générale du contexte, et « impur » préserve la terminologie rituelle sans connotation automatique de faute morale.
