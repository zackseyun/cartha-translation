  text: וְ/כָל בֶּ֣גֶד וְ/כָל ע֔וֹר אֲשֶׁר יִהְיֶ֥ה עָלָ֖י/ו שִׁכְבַת זָ֑רַע וְ/כֻבַּ֥ס בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/017.yaml
  text: And every garment and every skin on which there is an emission of semen shall be washed with water and be unclean until the evening[a][b].
translation:
  language: fr
  text: Tout vêtement et toute peau[a] sur lesquels il y aura une émission de sperme[b] seront lavés dans l’eau et seront impurs jusqu’au soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot peut aussi désigner du cuir ou un objet fait de peau animale.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « du sperme ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד
  choice: vêtement
  rationale: Terme français courant et assez large pour désigner une pièce d’habillement, tout en conservant le concret du texte hébreu.
- source_word: עוֹר
  choice: peau
  rationale: Équivalent direct de l’hébreu. Dans ce contexte, il s’agit probablement d’une peau animale ou d’un objet qui en est fait; « cuir » serait plus interprétatif.
- source_word: אֲשֶׁר יִהְיֶה עָלָיו
  choice: sur lesquels il y aura
  rationale: Rend la construction locative hébraïque et la valeur juridique/prospective de l’imparfait, dans un français naturel.
- source_word: שִׁכְבַת זָרַע
  choice: une émission de sperme
  rationale: Rend explicitement l’idiome hébreu, qui désigne du sperme émis, et convient au contexte des règles de pureté.
- source_word: וְכֻבַּס
  choice: seront lavés
  rationale: Le passif exprime l’instruction légale sans préciser l’agent. Le pluriel français reprend ensemble « vêtement » et « peau ».
- source_word: בַּמַּיִם
  choice: dans l’eau
  rationale: Rend naturellement la préposition hébraïque dans le contexte d’un lavage; « avec de l’eau » serait également possible.
- source_word: וְטָמֵא
  choice: et resteront impurs
  rationale: Exprime la persistance de l’état rituel jusqu’au soir après le lavage. Le pluriel s’accorde avec les deux catégories d’objets.
- source_word: עַד הָעָרֶב
  choice: jusqu’au soir
  rationale: Formulation française idiomatique et fidèle à la limite temporelle indiquée par l’hébreu.
theological_decisions:
- issue: Nature de l’impureté dans la législation lévitique
  choice: Rendre טָמֵא par « impurs » au sens rituel, sans suggérer une faute morale.
  alternative: « souillés » ou « rituellement impurs »
  rationale: Le contexte traite d’un statut de pureté cultuelle. « Impurs » conserve la catégorie du texte sans ajouter une explication doctrinale; « rituellement » expliciterait ce qui demeure implicite.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la structure juridique du verset, tout en employant un futur naturel en français. Les marqueurs de notes [a] et [b] figurent dans le texte.
