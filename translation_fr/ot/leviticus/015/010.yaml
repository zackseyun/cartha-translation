  text: וְ/כָל הַ/נֹּגֵ֗עַ בְּ/כֹל֙ אֲשֶׁ֣ר יִהְיֶ֣ה תַחְתָּ֔י/ו יִטְמָ֖א עַד הָ/עָ֑רֶב וְ/הַ/נּוֹשֵׂ֣א אוֹתָ֔/ם יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/010.yaml
  text: And everyone who touches anything that was under him shall be unclean until the evening[a], and whoever carries them shall wash his clothes and bathe in water[b], and be unclean until the evening.
translation:
  language: fr
  text: Quiconque touche tout ce qui se trouvait sous lui[a] sera impur jusqu’au soir. Celui qui porte ces objets[b] lavera ses vêtements, se lavera dans l’eau et sera impur jusqu’au soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « tout ce qui se trouve sous lui ». L’hébreu emploie une forme qui peut se rendre plus littéralement au présent, mais le contexte peut viser ce qui se trouvait auparavant sous l’homme atteint d’un écoulement.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « les porte ». Le pronom pluriel renvoie collectivement aux objets concernés par ce qui se trouvait sous lui.'
    reason: cross_reference
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: Quiconque touche
  rationale: Le participe désigne ici toute personne qui entre physiquement en contact avec l’objet; « quiconque touche » exprime naturellement la portée générale de la prescription.
- source_word: בְּכֹל אֲשֶׁר יִהְיֶה תַחְתָּיו
  choice: un objet qui se sera trouvé sous lui
  rationale: Le tour français explicite la référence à une chose tout en conservant le rapport spatial. Le futur antérieur convient au contexte procédural, où l’objet a été sous l’homme avant d’être touché, sans masquer dans la note la valeur plus littérale possible.
- source_word: יִטְמָא
  choice: sera impur
  rationale: Dans les lois de pureté, טמא indique l’état rituel d’impureté; « sera impur » garde le registre normatif sans employer un futur archaïsant.
- source_word: עַד הָעָרֶב
  choice: jusqu’au soir
  rationale: Formulation française idiomatique qui correspond directement à l’expression hébraïque.
- source_word: הַנּוֹשֵׂא אֹתָם
  choice: Celui qui porte ces objets
  rationale: נשא signifie ici porter ou transporter. Le démonstratif rend intelligible le pronom masculin pluriel hébreu, dont l’antécédent est collectif et implicite.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: lavera ses vêtements
  rationale: « Vêtements » est courant, précis et digne; le futur restitue la force prescriptive de la forme verbale.
- source_word: וְרָחַץ בַּמַּיִם
  choice: se lavera à l’eau
  rationale: Dans cette formule de purification, רחץ désigne le lavage de la personne. La tournure pronominale française le fait comprendre sans ajouter explicitement « le corps », absent de l’hébreu.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: et sera impur jusqu’au soir
  rationale: La répétition conserve la structure et l’insistance juridique du texte hébreu.
theological_decisions:
- issue: Nature de l’impureté
  choice: impur
  alternative: souillé
  rationale: « Impur » est le terme français établi dans ce contexte rituel et n’assimile pas cette condition réglementaire à une faute morale.
translation_notes:
  register: Français international moderne, clair et soutenu. Le futur simple maintient la portée législative sans archaïsme; les répétitions essentielles du texte source sont conservées.
