  to: Quiconque touche tout ce qui se trouvait sous lui[a] sera impur jusqu’au soir. Celui qui porte ces objets[b] lavera ses vêtements, se lavera dans l’eau et sera impur jusqu’au soir.
  rationale: La révision remplace le futur antérieur artificiel par un imparfait contextuel naturel, rétablit la portée indéfinie de l’hébreu avec « tout ce qui », et améliore la formulation du lavage sans modifier le sens ni la structure de la prescription. Les deux notes conservent l’alternative temporelle et expliquent l’antécédent collectif du pronom pluriel.
