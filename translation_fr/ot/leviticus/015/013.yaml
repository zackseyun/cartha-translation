base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/013.yaml
  text: And when the man with the discharge is cleansed from his discharge[a], then he shall count seven days for his cleansing, and wash his clothes and bathe his body in living water; then he shall be clean.
translation:
  language: fr
  text: Lorsque l’homme atteint d’un écoulement sera purifié de son écoulement, il comptera sept jours pour sa purification, lavera ses vêtements et lavera son corps dans de l’eau vive[a] ; alors il sera pur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « eau vivante » ; c’est-à-dire de l’eau de source ou courante.'
    reason: Précision lexicale sur l’expression hébraïque מַיִם חַיִּים.
lexical_decisions:
- source_word: הַזָּב
  choice: l’homme atteint d’un écoulement
  rationale: Le participe substantivé désigne ici l’homme souffrant de l’écoulement corporel décrit dans ce chapitre. Cette formulation reste précise, naturelle et conforme au contexte masculin.
- source_word: יִטְהַר מִזּוֹבוֹ
  choice: en sera purifié
  rationale: Le verbe exprime le passage à l’état de pureté rituelle après la cessation de l’écoulement. Le pronom « en » évite une répétition pesante tout en gardant le lien explicite avec l’écoulement.
- source_word: וְסָפַר לוֹ שִׁבְעַת יָמִים
  choice: il comptera sept jours
  rationale: La tournure rend directement l’instruction procédurale et conserve le registre juridique du passage.
- source_word: לְטָהֳרָתוֹ
  choice: pour sa purification
  rationale: « Purification » désigne clairement le processus rituel sans suggérer que l’écoulement constitue en lui-même une faute morale.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: lavera ses vêtements
  rationale: Traduction directe et idiomatique de l’action prescrite sur les vêtements.
- source_word: וְרָחַץ בְּשָׂרוֹ
  choice: se baignera le corps
  rationale: בָּשָׂר signifie littéralement « chair », mais « corps » convient mieux en français actuel pour une ablution complète. « Se baignera le corps » distingue cette action du lavage des vêtements.
- source_word: בְּמַיִם חַיִּים
  choice: dans de l’eau vive
  rationale: La traduction littérale préserve l’expression hébraïque et son image, tandis que la note en précise le sens concret dans cette prescription.
- source_word: וְטָהֵר
  choice: alors il sera pur
  rationale: « Alors » explicite naturellement l’aboutissement de la séquence rituelle, et « pur » désigne ici l’état rituel obtenu.
theological_decisions:
- issue: Rendre le vocabulaire de pureté rituelle sans lui donner un sens de culpabilité morale
  choice: Employer « purifié », « purification » et « pur » au sens rituel
  alternative: Employer « nettoyé », « nettoyage » et « propre »
  rationale: Le passage traite du statut rituel lié à un écoulement corporel, non d’une culpabilité morale explicitement affirmée. Le vocabulaire de la pureté conserve cette catégorie propre au Lévitique.
- issue: Interprétation de מַיִם חַיִּים
  choice: Conserver « eau vive » dans le texte et expliquer l’expression en note
  alternative: Traduire directement par « eau courante » ou « eau fraîche »
  rationale: « Eau vive » rend formellement l’hébreu et préserve son expression imagée sans lui imposer ici une lecture théologique ultérieure. La note donne le sens pratique probable.
