revisions:
- from: 'Voici en quoi consistera son impureté due à cet écoulement : que son corps laisse couler l’écoulement[a] ou qu’il le retienne, c’est son impureté.'
  to: 'Voici quelle sera son impureté lors de son écoulement : si son corps laisse couler son écoulement[a] ou si son corps est obstrué par son écoulement, c’est là son impureté.'
  rationale: La révision conserve le caractère rituel de « impureté », la retenue anatomique du texte et les deux cas alternatifs. Elle remplace une causalité indue par « lors de », rétablit le corps comme sujet dans les deux membres et rend l’obstruction sans attribuer une action volontaire à l’homme. La note préserve à la fois le terme littéral « chair » et l’ambiguïté de la dernière construction hébraïque.
