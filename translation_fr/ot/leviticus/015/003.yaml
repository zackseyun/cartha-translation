  text: וְ/זֹ֛את תִּהְיֶ֥ה טֻמְאָת֖/וֹ בְּ/זוֹב֑/וֹ רָ֣ר בְּשָׂר֞/וֹ אֶת זוֹב֗/וֹ אֽוֹ הֶחְתִּ֤ים בְּשָׂר/וֹ֙ מִ/זּוֹב֔/וֹ טֻמְאָת֖/וֹ הִֽוא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/003.yaml
  text: 'And this shall be his uncleanness in his discharge: whether his body runs with his discharge[a], or his body is stopped up from his discharge, it is his uncleanness.'
translation:
  language: fr
  text: 'Voici quelle sera son impureté lors de son écoulement : si son corps laisse couler son écoulement[a] ou si son corps est obstrué par son écoulement, c’est là son impureté.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « si sa chair coule son écoulement, ou si sa chair est obstruée par/de son écoulement ». Le terme hébreu rendu par « corps » est littéralement « chair » et désigne ici la réalité corporelle concernée. La nuance exacte de la relation exprimée dans le second membre est discutée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֻמְאָתוֹ
  choice: son impureté
  rationale: Le nom désigne ici l’état d’impureté rituelle défini par la législation lévitique. « Impureté » est le terme français courant et précis dans ce contexte cultuel.
- source_word: זוֹב
  choice: écoulement
  rationale: Dans ce contexte, le mot désigne un écoulement corporel anormal, vraisemblablement génital. « Écoulement » est clair, sobre et suffisamment clinique.
- source_word: רָר
  choice: laisse couler
  rationale: Le verbe exprime l’émission ou le flux de l’écoulement. Cette formulation rend naturellement en français le contraste avec sa rétention.
- source_word: בְּשָׂרוֹ
  choice: son corps
  rationale: Littéralement « sa chair » ; ici, le mot vise la partie corporelle concernée, voire l’organe génital. « Son corps » demeure naturel sans préciser davantage que l’hébreu.
- source_word: הֶחְתִּים
  choice: le retienne
  rationale: La forme évoque la fermeture ou l’obstruction qui empêche l’écoulement de sortir. « Le retienne » exprime cet état de manière idiomatique tout en préservant le contraste avec « laisse couler ».
- source_word: מִזּוֹבוֹ
  choice: qu’il le retienne
  rationale: Le pronom « le » reprend l’écoulement ; la formulation française condense la construction hébraïque littérale « soit fermé à cause/de son écoulement » sans trancher le mécanisme physiologique.
- source_word: וְזֹאת תִּהְיֶה
  choice: Voici en quoi consistera
  rationale: Cette tournure conserve la valeur prospective de la formule juridique tout en produisant un français naturel.
- source_word: אוֹ
  choice: que ... ou que
  rationale: La construction présente deux états alternatifs auxquels s’applique la même qualification rituelle.
theological_decisions:
- issue: Nature de l’impureté
  choice: Employer « impureté » sans qualification morale
  alternative: « souillure » ou explicitation comme faute morale
  rationale: Le contexte relève de l’impureté rituelle et corporelle ; le texte ne présente pas ici cet état comme une faute morale.
- issue: Référent de בשר
  choice: « corps » dans le texte, avec « chair » en note
  alternative: Préciser « organe génital »
  rationale: L’hébreu reste indirect. « Corps » préserve cette retenue, tandis que la note signale le sens littéral et la portée corporelle du terme.
translation_notes:
  register: Français international moderne, sobre et digne, adapté au registre juridique et rituel du Lévitique. La phrase maintient les deux situations physiologiques envisagées par l’hébreu sans préciser au-delà du texte la partie du corps concernée.
