source:
  edition: WLC
  text: דַּבְּרוּ֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/אֲמַרְתֶּ֖ם אֲלֵ/הֶ֑ם אִ֣ישׁ אִ֗ישׁ כִּ֤י יִהְיֶה֙ זָ֣ב מִ/בְּשָׂר֔/וֹ זוֹב֖/וֹ טָמֵ֥א הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/002.yaml
  text: 'Speak to the sons of Israel and say to them: When any man has a discharge from his body[b][a], his discharge is unclean.'
translation:
  language: fr
  text: '« Parlez aux fils d’Israël[a] et dites-leur : Quand un homme a un écoulement de son corps[b], son écoulement est impur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux Israélites » ; littéralement « aux fils d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de sa chair ».
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: Parlez
  rationale: L’impératif pluriel introduit solennellement l’instruction divine adressée à Moïse et Aaron ; « Parlez » conserve la forme directe de l’hébreu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction formelle conserve l’expression hébraïque et sa désignation traditionnelle du peuple, tout en signalant en note l’équivalent courant « les Israélites ».
- source_word: וַאֲמַרְתֶּם אֲלֵהֶם
  choice: et dites-leur
  rationale: Rend naturellement la formule séquentielle de commandement et maintient le parallélisme avec « Parlez ».
- source_word: אִישׁ אִישׁ
  choice: un homme
  rationale: La répétition distributive signifie « tout homme » ou « un homme, quel qu’il soit ». Dans ce contexte physiologique masculin, « un homme » est précis et idiomatique.
- source_word: כִּי יִהְיֶה זָב
  choice: Quand un homme a un écoulement
  rationale: Dans cette formulation juridique de cas, כִּי introduit une situation envisagée ; « quand » convient mieux que le conditionnel « si ». « A un écoulement » exprime clairement le participe זָב.
- source_word: מִבְּשָׂרוֹ
  choice: provenant de son corps
  rationale: בָּשָׂר signifie littéralement « chair », mais désigne ici le corps, probablement la partie génitale. « Corps » reste clair sans préciser davantage que le texte.
- source_word: זוֹבוֹ
  choice: son écoulement
  rationale: Le nom est apparenté au participe זָב ; répéter « écoulement » conserve ce lien lexical et la précision juridique.
- source_word: טָמֵא
  choice: impur
  rationale: Dans les lois lévitiques, le terme désigne l’impureté rituelle et non nécessairement une faute morale. « Impur » est le terme français courant et précis.
theological_decisions:
- issue: Nature de l’impureté exprimée par טָמֵא
  choice: impur
  alternative: souillé
  rationale: « Impur » traduit le statut rituel sans suggérer automatiquement une culpabilité morale ; « souillé » risquerait d’ajouter une connotation morale ou matérielle.
- issue: Référent du pronom הוּא dans זוֹבוֹ טָמֵא הוּא
  choice: son écoulement est impur
  alternative: il est impur à cause de son écoulement
  rationale: Le nom זוֹב (« écoulement ») et le pronom הוּא sont tous deux masculins, de sorte que la syntaxe peut rattacher l’impureté à l’écoulement ; le contexte permet aussi de comprendre que l’homme est impur. Le texte principal suit l’accord immédiat, et la note conserve l’autre lecture.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le ton juridique et solennel du Lévitique, tout en employant le vocabulaire corporel sobre d’un contexte rituel et médical.
