    issue: La note b affirme que « de sa chair » peut désigner plus précisément les organes génitaux.
    rationale: בְּשָׂרוֹ signifie littéralement « sa chair » et, dans le contexte, désigne le corps de l’homme comme origine de l’écoulement. Le contexte des versets suivants peut orienter vers un écoulement génital, mais le mot lui-même ne spécifie pas « ses organes génitaux » dans ce verset. La note introduit donc une précision anatomique non exprimée par le texte.
  - severity: low
    issue: La note c présente comme alternative une reformulation qui attribue directement l’impureté à l’homme.
    rationale: L’accord grammatical immédiat de הוּא avec זוֹבוֹ soutient « son écoulement est impur ». La reformulation proposée est une conséquence contextuelle possible, mais elle n’est pas une alternative de traduction aussi directe et risque de brouiller la syntaxe du verset.
  revised_text: '« Parlez aux fils d’Israël[a] et dites-leur : Quand un homme a un écoulement de son corps[b], son écoulement est impur. »'
  revised_footnotes:
