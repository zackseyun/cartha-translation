  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִֽקַּֽח ל/וֹ֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה וּ/בָ֣א לִ/פְנֵ֣י יְהוָ֗ה אֶל פֶּ֨תַח֙ אֹ֣הֶל מוֹעֵ֔ד וּ/נְתָנָ֖/ם אֶל הַ/כֹּהֵֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/014.yaml
  text: And on the eighth day he shall take for himself two turtledoves or two young pigeons[a], and he shall come before Yahweh at the entrance of the tent of meeting and give them to the priest.
translation:
  language: fr
  text: Le huitième jour, il prendra deux tourterelles ou deux jeunes pigeons, viendra devant Yahweh, à l’entrée de la tente de la rencontre, et les donnera au prêtre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: Le huitième jour
  rationale: Le français naturel n’a pas besoin de rendre la conjonction initiale par « et » dans cette suite de prescriptions; la valeur temporelle et séquentielle est conservée.
- source_word: יִקַּח לוֹ
  choice: il prendra pour lui
  rationale: Le futur convient à l’instruction légale en français, et « pour lui » conserve explicitement le datif לוֹ.
- source_word: שְׁתֵּי תֹרִים
  choice: deux tourterelles
  rationale: תֹרִים désigne des tourterelles, terme usuel et précis en français.
- source_word: אוֹ שְׁנֵי בְּנֵי יוֹנָה
  choice: ou deux jeunes pigeons
  rationale: L’expression hébraïque littérale « fils de pigeon/colombe » désigne idiomatiquement de jeunes pigeons destinés à l’offrande.
- source_word: וּבָא לִפְנֵי יְהוָה
  choice: Il viendra devant Yahweh
  rationale: Le parfait consécutif poursuit la séquence prescriptive; « devant » rend directement לִפְנֵי, et le nom divin est translittéré.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: à l’entrée de la tente de la rencontre
  rationale: « À l’entrée » exprime naturellement la destination et le lieu visés par אֶל פֶּתַח; « tente de la rencontre » rend de façon transparente אֹהֶל מוֹעֵד.
- source_word: וּנְתָנָם אֶל הַכֹּהֵן
  choice: et les donnera au prêtre
  rationale: Cette formulation simple conserve l’objet pluriel et le transfert direct au prêtre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le caractère de nom propre, tandis que la note signale le rendu traditionnel.
translation_notes:
  register: Français international moderne, clair et digne. Les phrases sont séparées pour éviter une coordination trop lourde, sans modifier la succession rituelle du texte hébreu.
