revisions:
- from: Le huitième jour, il prendra pour lui deux tourterelles ou deux jeunes pigeons. Il viendra devant Yahweh[a], à l’entrée de la tente de la rencontre, et les donnera au prêtre.
  to: Le huitième jour, il prendra deux tourterelles ou deux jeunes pigeons, viendra devant Yahweh, à l’entrée de la tente de la rencontre, et les donnera au prêtre.
  rationale: Révision limitée à l’idiomaticité française de « il prendra pour lui » et à la clarification de la note. La séquence rituelle, les espèces d’oiseaux, le nom divin, le lieu et la remise des oiseaux au prêtre sont conservés. L’ambiguïté syntaxique modérée concernant la venue « devant Yahweh » à l’entrée de la tente est préservée.
