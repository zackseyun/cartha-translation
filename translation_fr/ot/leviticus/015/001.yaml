source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/001.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: fr
  text: 'Puis Yahweh[a] parla à Moïse et à Aaron en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Puis … parla
  rationale: Le wayyiqtol fait progresser le récit. « Puis » en exprime naturellement la succession, et « parla » rend דבר tout en restant distinct de לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin יהוה, plutôt que substitution par un titre.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: à Moïse et à Aaron
  rationale: Le français coordonne naturellement les deux destinataires; la préposition répétée dans l’hébreu est conservée devant chaque nom.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: Cette formule introduit le discours direct qui suit. « En ces termes » est idiomatique en français et les deux-points signalent que les paroles commencent au verset suivant.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve au lieu de lui substituer le titre traditionnel, tout en signalant celui-ci en note.
translation_notes:
  register: Français moderne, digne et courant. La tournure « en ces termes » évite le calque peu naturel « disant » et introduit clairement le discours à venir.
