source:
  edition: WLC
  text: וְ/כָל הַ/מֶּרְכָּ֗ב אֲשֶׁ֨ר יִרְכַּ֥ב עָלָ֛י/ו הַ/זָּ֖ב יִטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/009.yaml
  text: And every saddle on which the man with the discharge rides shall be unclean[a].
translation:
  language: fr
  text: Et toute selle sur laquelle monte l’homme qui a un écoulement sera impure[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute chose sur laquelle il monte » ; le terme hébreu peut désigner plus largement ce que l’on chevauche, et non seulement une selle au sens strict.
    reason: alternative lexicale
lexical_decisions:
- source_word: וְ/כָל
  choice: Et toute
  rationale: וְ relie cette prescription aux précédentes, tandis que כָּל a ici une portée distributive. « Et toute » conserve naturellement ces deux éléments.
- source_word: הַ/מֶּרְכָּב
  choice: selle
  rationale: מֶרְכָּב désigne ce sur quoi l’on monte ou que l’on chevauche. Dans ce contexte de contact personnel et d’impureté rituelle, « selle » est le terme français le plus naturel, tout en laissant en note la portée potentiellement plus large du mot hébreu.
- source_word: אֲשֶׁר יִרְכַּב עָלָיו
  choice: sur laquelle monte
  rationale: Cette formulation rend directement la proposition relative et la valeur spatiale de עַל, dans un français naturel et concis.
- source_word: הַ/זָּב
  choice: l’homme qui a un écoulement
  rationale: Le participe substantivé masculin זָב désigne ici l’homme atteint de l’écoulement corporel évoqué dans le chapitre. La formulation reste claire sans préciser au-delà du texte la nature exacte de cet écoulement.
- source_word: יִטְמָא
  choice: sera impure
  rationale: Le qal de טמא énonce le statut rituel de l’objet. « Sera impure » convient au genre féminin de « selle » et évite de transformer cette impureté rituelle en faute morale.
theological_decisions:
- issue: Nature de l’impureté dans le Lévitique
  choice: Rendre טמא par « impure » au sens rituel et juridique.
  alternative: « souillée » ou « deviendra impure »
  rationale: Le verset traite d’un statut rituel lié à un écoulement corporel, sans affirmer une culpabilité morale. « Impure » est précis et bien établi en français biblique moderne.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe juridique reste concise, et la note préserve l’étendue sémantique de מֶרְכָּב.
