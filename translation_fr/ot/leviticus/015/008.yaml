id: LEV.15.8
reference: Leviticus 15:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כִֽי יָרֹ֛ק הַ/זָּ֖ב בַּ/טָּה֑וֹר וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/008.yaml
  text: And if the man with the discharge spits on a clean person[a], he shall wash his clothes and bathe in water[b], and he shall be unclean until the evening.
translation:
  language: fr
  text: Si l’homme qui a un écoulement crache sur une personne pure[a], celle-ci lavera ses vêtements, se baignera dans l’eau et sera impure jusqu’au soir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire une personne rituellement pure.
    reason: cultural_note
  - marker: b
    text: Il s’agit d’une impureté rituelle, et non nécessairement d’une faute morale.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: Si
  rationale: Introduit un nouveau cas conditionnel dans la série de prescriptions. En français, « Si » suffit naturellement à rendre la condition; la continuité assurée par ו n’exige pas ici un « Et ».
- source_word: יָרֹק
  choice: crache sur
  rationale: Le verbe signifie « cracher »; la préposition ב devant la personne visée est naturellement rendue par « sur ».
- source_word: הַזָּב
  choice: l’homme qui a un écoulement
  rationale: Désigne la personne masculine atteinte de l’écoulement traité dans le contexte. Cette formulation reste claire et évite un substantif médical ou stigmatisant.
- source_word: בַּטָּהוֹר
  choice: sur une personne pure
  rationale: L’adjectif substantivé désigne ici quelqu’un en état de pureté rituelle. « Personne » explicite naturellement le référent sans changer le sens.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: celle-ci lavera ses vêtements
  rationale: Le sujet implicite est la personne pure sur laquelle l’homme a craché. « Celle-ci » lève l’ambiguïté que créerait le masculin « il » en français.
- source_word: וְרָחַץ בַּמַּיִם
  choice: se baignera dans l’eau
  rationale: Dans ce contexte rituel, רָחַץ indique le lavage du corps. La tournure pronominale française exprime naturellement cette action.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: et sera impure jusqu’au soir
  rationale: Décrit un état d’impureté rituelle temporaire. « Jusqu’au soir » rend directement la formule temporelle courante du Lévitique.
theological_decisions:
- issue: Vocabulaire de la pureté
  choice: pure / impure au sens rituel
  alternative: propre / impur; purifiée / souillée
  rationale: Le passage règle un statut rituel et ne porte pas en lui-même un jugement de culpabilité morale. « Pure / impure » est précis et idiomatique en français biblique moderne.
- issue: Sujet des actions de lavage et d’impureté
  choice: La personne sur laquelle il a craché
  alternative: L’homme qui a l’écoulement
  rationale: La syntaxe et la logique des lois de contact indiquent que les verbes suivants concernent « la personne pure ». Le pronom « celle-ci » explicite ce rattachement sans ajouter une interprétation doctrinale.
translation_notes:
  register: Français moderne, international et digne. La formulation juridique reste simple; « celle-ci » clarifie le changement de sujet implicite. Les termes « pure » et « impure » sont conservés, avec des notes qui précisent leur portée rituelle.
