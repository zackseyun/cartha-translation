  text: וְ/הַ/יֹּשֵׁב֙ עַֽל הַ/כְּלִ֔י אֲשֶׁר יֵשֵׁ֥ב עָלָ֖י/ו הַ/זָּ֑ב יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/006.yaml
  text: Whoever sits on the object on which the man with the discharge sat shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: fr
  text: Quiconque s’assiéra sur l’objet[a] sur lequel l’homme atteint d’un écoulement se sera assis lavera ses vêtements, se lavera dans l’eau et sera impur jusqu’au soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « récipient », « ustensile » ou « article » ; le terme hébreu peut désigner divers objets.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיֹּשֵׁב
  choice: Quiconque s’assiéra
  rationale: Le participe substantivé désigne de manière générale toute personne qui s’assied. Le futur français convient au registre juridique et à la portée générique de la prescription.
- source_word: הַכְּלִי
  choice: l’objet
  rationale: כְּלִי peut désigner un récipient, un ustensile, un article ou, plus largement, un objet. Ici, « objet » conserve cette extension sans supposer une forme particulière.
- source_word: אֲשֶׁר יֵשֵׁב עָלָיו
  choice: sur lequel … se sera assis
  rationale: La proposition relative renvoie au fait antérieur que l’homme atteint d’un écoulement s’est assis sur l’objet. Le futur antérieur rend clairement cette antériorité dans la formulation juridique française.
- source_word: הַזָּב
  choice: l’homme atteint d’un écoulement
  rationale: Le participe substantivé masculin désigne, dans cette section, un homme ayant un écoulement corporel. Cette formulation explicite le référent masculin sans préciser au-delà du texte la nature de l’écoulement.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: lavera ses vêtements
  rationale: כִּבֵּס désigne couramment le lavage des vêtements. Le futur garde une formulation juridique naturelle en français.
- source_word: וְרָחַץ בַּמַּיִם
  choice: se lavera dans l’eau
  rationale: Dans ce contexte de pureté, רָחַץ indique le lavage du corps. « Se lavera dans l’eau » reste proche de la formulation hébraïque et se distingue du lavage des vêtements.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: et sera impur jusqu’au soir
  rationale: La formule indique le statut d’impureté et sa limite temporelle. « Impur » traduit directement le vocabulaire rituel sans lui ajouter une qualification interprétative.
theological_decisions:
- issue: Nature de l’impureté
  choice: « impur » sans ajout explicatif
  alternative: « rituellement impur » ou « souillé »
  rationale: Le contexte relève des lois de pureté, sans affirmer en lui-même une culpabilité morale. « Impur » préserve la concision et évite aussi bien l’ajout interprétatif de « rituellement » que la connotation potentiellement plus forte de « souillé ».
- issue: Référence masculine de הַזָּב
  choice: « l’homme atteint d’un écoulement »
  alternative: « la personne atteinte d’un écoulement »
  rationale: La section et les formes hébraïques visent explicitement un référent masculin; la traduction conserve cette donnée grammaticale et contextuelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur simple exprime naturellement la prescription juridique; le futur antérieur marque l’action préalable de l’homme atteint d’un écoulement. La répétition de « sur » est conservée pour la précision du rapport spatial.
