id: LEV.15.28
reference: Leviticus 15:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִֽם טָהֲרָ֖ה מִ/זּוֹבָ֑/הּ וְ/סָ֥פְרָה לָּ֛/הּ שִׁבְעַ֥ת יָמִ֖ים וְ/אַחַ֥ר תִּטְהָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/028.yaml
  text: But if she is cleansed from her discharge[a], then she shall count seven days for herself, and after that she shall be clean.
translation:
  language: fr
  text: Mais si elle est purifiée de son écoulement[a], elle comptera pour elle-même sept jours ; après cela, elle sera pure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « si elle devient pure de son écoulement… après cela, elle sera purifiée ». L’hébreu emploie le même radical dans les deux propositions : d’abord pour la cessation de l’écoulement, puis pour le statut rituel qui en résulte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: La conjonction suivie de la particule conditionnelle introduit le cas qui contraste avec la situation précédente. « Mais si » rend clairement ce lien en français.
- source_word: טָהֲרָה מִזּוֹבָהּ
  choice: elle est purifiée de son écoulement
  rationale: Le verbe טהר décrit ici la sortie de l’état lié à l’écoulement. « Purifiée » maintient le vocabulaire de pureté rituelle, tandis que « écoulement » désigne clairement la manifestation corporelle visée par la législation.
- source_word: וְסָפְרָה לָּהּ שִׁבְעַת יָמִים
  choice: elle comptera pour elle-même sept jours
  rationale: La formulation conserve la valeur procédurale du verbe ainsi que le pronom datif לָּהּ, qui indique que ce décompte concerne sa propre période de purification.
- source_word: וְאַחַר
  choice: après cela
  rationale: Cette expression marque naturellement l’étape qui suit le décompte des sept jours.
- source_word: תִּטְהָר
  choice: elle sera pure
  rationale: Le même radical טהר exprime ici le statut rituel atteint après les sept jours. « Sera pure » distingue ce résultat de la cessation préalable de l’écoulement.
theological_decisions:
- issue: Terminologie de la pureté rituelle
  choice: Employer « purifiée » et « pure » au sens rituel
  alternative: Employer « nettoyée » et « propre » ou reformuler uniquement par la cessation de l’écoulement
  rationale: Lévitique 15 traite d’un statut rituel associé aux écoulements corporels, non d’une faute morale. Le vocabulaire choisi conserve cette catégorie sans suggérer une condamnation éthique.
- issue: Double emploi du radical טהר
  choice: Distinguer la sortie de l’état lié à l’écoulement (« est purifiée de ») du statut obtenu après sept jours (« sera pure »)
  alternative: Traduire les deux occurrences de façon strictement identique
  rationale: Le même radical hébreu apparaît dans les deux propositions, mais le contexte lui donne d’abord une valeur liée à la cessation de l’écoulement, puis celle du statut rituel qui en résulte après le délai prescrit. La note préserve cette tension lexicale.
translation_notes:
  register: Français moderne, clair et digne, avec une syntaxe juridique simple. Le terme « écoulement » est précis sans être inutilement technique. La répétition du champ lexical de la pureté reflète le texte hébreu et demeure explicitement rituelle.
