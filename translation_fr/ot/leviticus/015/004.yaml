  text: כָּל הַ/מִּשְׁכָּ֗ב אֲשֶׁ֨ר יִשְׁכַּ֥ב עָלָ֛י/ו הַ/זָּ֖ב יִטְמָ֑א וְ/כָֽל הַ/כְּלִ֛י אֲשֶׁר יֵשֵׁ֥ב עָלָ֖י/ו יִטְמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/004.yaml
  text: Every bed on which the man with the discharge lies shall be unclean[a], and every vessel on which he sits shall be unclean.
translation:
  language: fr
  text: Tout lit sur lequel se couche l’homme qui a un écoulement sera impur, et tout objet[a] sur lequel il s’assied sera impur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner de manière générale un objet, un article, un ustensile ou un récipient.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּב
  choice: lit
  rationale: מִשְׁכָּב désigne ici ce sur quoi l’on se couche. « Lit » est l’équivalent français le plus naturel dans ce contexte, sans exclure que le terme hébreu puisse avoir un sens plus général.
- source_word: הַזָּב
  choice: l’homme qui a un écoulement
  rationale: Le participe substantivé masculin זָב désigne, dans ce passage, un homme ayant un écoulement corporel. Cette formulation conserve le genre grammatical et le référent masculin du contexte sans ajouter de diagnostic.
- source_word: יִשְׁכַּב עָלָיו
  choice: sur lequel se couche
  rationale: La tournure française rend naturellement la proposition relative hébraïque et le présent exprime bien la portée générale de cette règle.
- source_word: יִטְמָא
  choice: sera impur
  rationale: Le qal de טמא énonce ici le statut d’impureté qui résulte du contact. « Sera impur » conserve la formulation juridique et n’ajoute aucune connotation de faute morale.
- source_word: הַכְּלִי
  choice: objet
  rationale: כְּלִי est un terme large pouvant désigner un objet, un article, un ustensile ou un récipient. Puisqu’il s’agit ici de quelque chose sur quoi l’homme peut s’asseoir, « objet » est plus naturel et moins trompeur en français que « récipient » ou « vase ».
- source_word: יֵשֵׁב עָלָיו
  choice: sur lequel il s’assied
  rationale: ישׁב avec עַל signifie ici « s’asseoir sur ». Le présent convient au caractère général de la prescription.
theological_decisions:
- issue: Nature de l’impureté
  choice: impur
  alternative: rituellement impur ; souillé
  rationale: Le contexte concerne le statut d’impureté lévitique, et non nécessairement une culpabilité morale. « Impur » traduit directement le texte sans ajouter l’adverbe interprétatif « rituellement » ni employer « souillé », qui peut suggérer davantage une corruption morale.
- issue: Genre du sujet
  choice: l’homme qui a un écoulement / il
  alternative: la personne qui a un écoulement
  rationale: Les formes hébraïques sont au masculin singulier et le contexte immédiat traite d’un écoulement masculin. La traduction maintient donc explicitement ce référent.
translation_notes:
  register: Français moderne, clair et digne. Le présent dans les propositions relatives exprime une situation générale, tandis que le futur « sera impur » marque la conséquence juridique. La répétition finale de « sera impur » reproduit l’équilibre de la phrase hébraïque.
