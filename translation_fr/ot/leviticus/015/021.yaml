id: LEV.15.21
reference: Leviticus 15:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כָל הַ/נֹּגֵ֖עַ בְּ/מִשְׁכָּבָ֑/הּ יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/021.yaml
  text: And everyone who touches her bed shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: fr
  text: Quiconque touche son lit doit laver ses vêtements et se laver dans l’eau[a] ; il sera impur jusqu’au soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’endroit où elle se couche » ou « sa couche ». Le terme hébreu désigne l’endroit où elle s’allonge.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: Quiconque touche
  rationale: La construction généralisante avec le participe désigne toute personne qui touche. « Quiconque touche » est naturel en français et conserve la portée universelle.
- source_word: בְּמִשְׁכָּבָהּ
  choice: son lit
  rationale: מִשְׁכָּב désigne ici l’endroit où elle se couche, concrètement son lit. La note conserve les autres nuances possibles.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: doit laver ses vêtements
  rationale: כבס désigne spécifiquement le lavage des vêtements. « Doit » rend clairement la valeur prescriptive de cette législation.
- source_word: וְרָחַץ בַּמַּיִם
  choice: et se laver dans l’eau
  rationale: רחץ désigne ici le lavage du corps. La forme pronominale évite de suggérer qu’il s’agit encore des vêtements.
- source_word: וְטָמֵא
  choice: il sera impur
  rationale: טמא exprime un état d’impureté rituelle. « Impur » est précis et n’implique pas en lui-même une faute morale.
- source_word: עַד הָעָרֶב
  choice: jusqu’au soir
  rationale: Cette expression indique la durée de l’état d’impureté et se rend naturellement ainsi en français moderne.
theological_decisions:
- issue: Nature de l’impureté
  choice: Rendre טמא par « impur » dans son sens rituel
  alternative: « souillé » ou « impur moralement »
  rationale: Le contexte porte sur les règles de pureté rituelle. La traduction ne doit pas transformer cet état en culpabilité morale.
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve le caractère prescriptif du texte juridique sans archaïsme ; « impur » maintient la catégorie rituelle du passage.
