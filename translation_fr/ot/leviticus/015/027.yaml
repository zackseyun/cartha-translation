id: LEV.15.27
reference: Leviticus 15:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כָל הַ/נּוֹגֵ֥עַ בָּ֖/ם יִטְמָ֑א וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/027.yaml
  text: And everyone who touches them shall be unclean[a], and he shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: fr
  text: Quiconque les touche sera impur[a]. Il lavera ses vêtements, se lavera dans l’eau et restera impur jusqu’au soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit des objets associés à son impureté dans le contexte précédent, notamment ce sur quoi elle s’est couchée ou assise.
    reason: Renvoi au contexte permettant d’identifier le référent du pronom « les ».
lexical_decisions:
- source_word: וְ/כָל הַ/נּוֹגֵעַ
  choice: Quiconque les touche
  rationale: כָּל suivi du participe substantivé exprime ici une totalité indéfinie. « Quiconque » est naturel en français et conserve la portée générale.
- source_word: בָּם
  choice: les
  rationale: Le suffixe masculin pluriel renvoie aux objets mentionnés dans le contexte précédent. Le pronom conserve cette référence sans l’expliciter excessivement dans le texte.
- source_word: יִטְמָא
  choice: sera impur
  rationale: Dans ce contexte lévitique, טמא désigne l’impureté rituelle. « Impur » maintient cette catégorie sans suggérer automatiquement une faute morale.
- source_word: וְ/כִבֶּס בְּגָדָי/ו
  choice: Il lavera ses vêtements
  rationale: כבס désigne le lavage des vêtements. Cette formulation est claire, actuelle et fidèle.
- source_word: וְ/רָחַץ בַּ/מַּיִם
  choice: se lavera dans l’eau
  rationale: רחץ désigne ici le lavage du corps. Le tour pronominal est idiomatique en français et « dans l’eau » représente explicitement בַּמַּיִם.
- source_word: וְ/טָמֵא עַד הָ/עָרֶב
  choice: et restera impur jusqu’au soir
  rationale: La clause indique la persistance de l’état d’impureté jusqu’au soir. « Restera » rend naturellement en français la valeur résultante de la coordination hébraïque.
theological_decisions:
- issue: Nature de l’impureté dans le Lévitique
  choice: Employer « impur » au sens rituel
  alternative: Employer « souillé »
  rationale: Le passage réglemente la pureté rituelle. « Impur » préserve la catégorie cultuelle sans transformer le contact en faute morale.
- issue: Référent du pronom בָּם
  choice: Conserver le pronom « les » dans le texte et préciser son référent en note
  alternative: Insérer « ces objets » dans le texte principal
  rationale: Le pronom hébreu renvoie au contexte antérieur, mais son référent exact n’est pas répété dans ce verset. La note éclaire le lecteur sans supprimer cette dépendance contextuelle.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation garde le vocabulaire rituel du Lévitique tout en évitant des tournures inutilement archaïques.
