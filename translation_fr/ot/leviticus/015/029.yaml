source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י תִּֽקַּֽח לָ/הּ֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה וְ/הֵבִיאָ֤ה אוֹתָ/ם֙ אֶל הַ/כֹּהֵ֔ן אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/029.yaml
  text: And on the eighth day she shall take for herself two turtledoves or two young pigeons[a], and bring them to the priest at the entrance of the tent of meeting.
translation:
  language: fr
  text: Le huitième jour, elle prendra pour elle deux tourterelles ou deux jeunes pigeons, et elle les apportera au prêtre, à l’entrée de la tente de la rencontre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: Le huitième jour
  rationale: La conjonction ו marque ici la suite des prescriptions; il n’est pas nécessaire de la rendre par « et » en français, où l’enchaînement est naturel sans connecteur.
- source_word: תִּקַּח לָהּ
  choice: elle prendra pour elle
  rationale: Le futur exprime naturellement l’obligation dans ce texte juridique. « Pour elle » conserve la nuance bénéficiaire ou réflexive de לָהּ.
- source_word: שְׁתֵּי תֹרִים
  choice: deux tourterelles
  rationale: « Tourterelles » est le terme français courant et traditionnel correspondant à תֹרִים dans le vocabulaire sacrificiel.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: deux jeunes pigeons
  rationale: La locution littérale « fils de pigeon/colombe » désigne des pigeonneaux; « jeunes pigeons » est précis et immédiatement compréhensible.
- source_word: וְהֵבִיאָה אֹתָם
  choice: et elle les apportera
  rationale: Dans la suite juridique, la forme verbale coordonnée garde une valeur prescriptive. La répétition du sujet rend la phrase française claire et digne.
- source_word: אֶל הַכֹּהֵן
  choice: au prêtre
  rationale: L’article désigne le prêtre officiant dans le cadre rituel.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: à l’entrée de la tente de la rencontre
  rationale: Le second אֶל est conservé par « à ». « Entrée » traduit naturellement פֶּתַח, et « tente de la rencontre » rend אֹהֶל מוֹעֵד en soulignant le lieu assigné à la rencontre.
