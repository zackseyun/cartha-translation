source:
  edition: WLC
  text: וְ/הַ/דָּוָה֙ בְּ/נִדָּתָ֔/הּ וְ/הַ/זָּב֙ אֶת זוֹב֔/וֹ לַ/זָּכָ֖ר וְ/לַ/נְּקֵבָ֑ה וּ/לְ/אִ֕ישׁ אֲשֶׁ֥ר יִשְׁכַּ֖ב עִם טְמֵאָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/033.yaml
  text: and for the woman who is sick in her menstrual impurity, and for the one who has a discharge, whether male or female, and for a man who lies with an unclean woman.
translation:
  language: fr
  text: ainsi que pour la femme qui a ses règles[a], pour toute personne qui a un écoulement, homme ou femme, et pour l’homme qui couche avec une femme rituellement impure[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu peut aussi évoquer « la femme indisposée pendant son impureté menstruelle ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « rituellement impure » désigne un état défini par la loi lévitique, et non une faute ou une impureté morale.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּוָה בְּנִדָּתָהּ
  choice: la femme qui a ses règles
  rationale: Dans ce contexte lévitique, l’expression désigne la femme pendant son état menstruel. Cette formulation française est naturelle et précise, tandis qu’une note conserve la nuance d’affliction ou d’indisposition portée par הַדָּוָה.
- source_word: הַזָּב אֶת־זוֹבוֹ
  choice: toute personne qui a un écoulement
  rationale: La tournure hébraïque associe le participe à un nom de même racine. Le français verbalise naturellement l’idée. « Toute personne » convient puisque la suite étend explicitement cette catégorie à l’homme comme à la femme.
- source_word: לַזָּכָר וְלַנְּקֵבָה
  choice: homme ou femme
  rationale: La paire précise que les prescriptions relatives aux écoulements concernent les deux sexes. Cette formulation idiomatique évite le calque « pour le mâle et pour la femelle ».
- source_word: אֲשֶׁר יִשְׁכַּב עִם
  choice: qui couche avec
  rationale: Cette expression conserve l’euphémisme sexuel de l’hébreu dans un français actuel et digne.
- source_word: טְמֵאָה
  choice: une femme rituellement impure
  rationale: L’adjectif féminin désigne ici un état d’impureté selon les règles lévitiques. L’ajout de « rituellement » empêche une lecture morale dépréciative sans changer la catégorie visée.
theological_decisions:
- issue: Nature de l’impureté
  choice: Employer « rituellement impure » et comprendre l’état menstruel dans le cadre des règles de pureté lévitiques.
  alternative: Employer simplement « impure », formulation susceptible d’être comprise comme un jugement moral.
  rationale: Le passage classe des états corporels et leurs conséquences rituelles; il ne porte pas de jugement sur la valeur morale de la personne.
- issue: Portée de la catégorie הַזָּב
  choice: « toute personne qui a un écoulement, homme ou femme »
  alternative: « l’homme qui a un écoulement »
  rationale: Bien que הַזָּב soit morphologiquement masculin singulier, la précision לַזָּכָר וְלַנְּקֵבָה indique expressément que la catégorie couvre l’homme et la femme.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure récapitulative du verset, qui poursuit une proposition commencée au verset précédent. « Avoir ses règles » est direct sans être familier; « couche avec » maintient l’euphémisme de l’hébreu.
