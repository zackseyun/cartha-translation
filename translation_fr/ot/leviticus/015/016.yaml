  text: וְ/אִ֕ישׁ כִּֽי תֵצֵ֥א מִמֶּ֖/נּוּ שִׁכְבַת זָ֑רַע וְ/רָחַ֥ץ בַּ/מַּ֛יִם אֶת כָּל בְּשָׂר֖/וֹ וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/016.yaml
  text: And if a man has an emission of semen[b][a], he shall wash all his flesh in water and be unclean until the evening.
translation:
  language: fr
  text: Si un homme a une émission de sperme[a], il lavera tout son corps dans l’eau et sera impur[b] jusqu’au soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un écoulement séminal »; littéralement « une émission de semence ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « impur » désigne un état d’impureté rituelle dans le cadre des lois de pureté du Lévitique, et non nécessairement une culpabilité morale.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ
  choice: un homme
  rationale: Le contexte vise expressément une émission corporelle masculine; « un homme » conserve cette précision.
- source_word: כִּי
  choice: si
  rationale: Dans cette formulation juridique casuistique, כִּי introduit le cas envisagé; « si » convient naturellement.
- source_word: תֵצֵא מִמֶּנּוּ שִׁכְבַת זָרַע
  choice: a une émission de sperme
  rationale: Cette formulation française actuelle exprime clairement l’écoulement désigné par l’hébreu, littéralement « une émission de semence sort de lui », sans lourdeur.
- source_word: וְרָחַץ בַּמַּיִם אֶת כָּל בְּשָׂרוֹ
  choice: il lavera tout son corps dans l’eau
  rationale: « Tout son corps » rend idiomatiquement כָּל בְּשָׂרוֹ (« toute sa chair »), tandis que « dans l’eau » conserve la valeur naturelle de la préposition בְּ avec le verbe laver.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: et sera impur jusqu’au soir
  rationale: « Impur » est le terme usuel du vocabulaire lévitique de pureté; la durée prescrite est conservée sans ajout interprétatif.
theological_decisions:
- issue: Nature de טָמֵא dans les lois de pureté
  choice: impur, au sens rituel indiqué en note
  alternative: moralement souillé ou coupable
  rationale: Le contexte traite du statut de pureté lié aux écoulements corporels et ne présente pas l’émission comme une faute morale. Le texte principal garde néanmoins le terme biblique concis « impur ».
translation_notes:
  register: Français international moderne, clair et digne. La formulation juridique reste concise; « tout son corps » évite le calque peu naturel « toute sa chair ». Les marqueurs de notes sont placés immédiatement après les expressions qu’ils expliquent.
