id: LEV.15.31
reference: Leviticus 15:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִזַּרְתֶּ֥ם אֶת בְּנֵי יִשְׂרָאֵ֖ל מִ/טֻּמְאָתָ֑/ם וְ/לֹ֤א יָמֻ֨תוּ֙ בְּ/טֻמְאָתָ֔/ם בְּ/טַמְּאָ֥/ם אֶת מִשְׁכָּנִ֖/י אֲשֶׁ֥ר בְּ/תוֹכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/031.yaml
  text: Thus you shall warn the sons of Israel about their uncleanness[a], so that they may not die in their uncleanness by defiling my tabernacle, which is among them.
translation:
  language: fr
  text: Vous avertirez les Israélites au sujet de leur impureté[a], afin qu’ils ne meurent pas dans leur impureté en rendant impur mon tabernacle, qui est au milieu d’eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de leur état d’impureté » ; il s’agit ici de l’impureté rituelle.'
    reason: Précision lexicale visant à empêcher une lecture exclusivement morale du terme.
lexical_decisions:
- source_word: וְהִזַּרְתֶּם
  choice: Vous avertirez
  rationale: Le hifil de זהר exprime ici l’avertissement ou la mise en garde; le futur à valeur prescriptive convient au contexte légal.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette désignation collective idiomatique rend naturellement l’hébreu « fils d’Israël » en français moderne sans limiter le groupe aux hommes.
- source_word: מִטֻּמְאָתָם
  choice: au sujet de leur impureté
  rationale: Avec le verbe d’avertissement, מן indique ici ce contre quoi ou à propos de quoi la mise en garde est donnée.
- source_word: טֻמְאָה
  choice: impureté
  rationale: « Impureté » est le terme français courant pour la catégorie rituelle lévitique et n’implique pas nécessairement une faute morale.
- source_word: וְלֹא יָמֻתוּ
  choice: afin qu’ils ne meurent pas
  rationale: La tournure explicite la finalité préventive de l’avertissement.
- source_word: בְּטֻמְאָתָם
  choice: dans leur impureté
  rationale: Le préfixe ב indique la condition dans laquelle la mort surviendrait; la formulation conserve cette relation sans la réduire explicitement à une causalité.
- source_word: בְּטַמְּאָם
  choice: en rendant impur
  rationale: L’infinitif construit de טמא avec ב exprime la circonstance ou le moyen; cette traduction conserve la relation causative avec le tabernacle.
- source_word: מִשְׁכָּנִי
  choice: mon tabernacle
  rationale: Dans le Pentateuque, מִשְׁכָּן désigne concrètement la demeure cultuelle mobile; « tabernacle » préserve ce référent.
- source_word: אֲשֶׁר בְּתוֹכָם
  choice: qui est au milieu d’eux
  rationale: Cette formulation restitue l’accent sur la présence de la demeure divine au sein d’Israël.
theological_decisions:
- issue: Nature de l’impureté
  choice: Employer « impureté » comme catégorie rituelle.
  alternative: Comprendre le terme comme une faute morale ou le traduire par « souillure ».
  rationale: Le contexte porte sur les états d’impureté réglementés en Lévitique et sur leur effet cultuel; il ne faut pas les assimiler silencieusement au péché moral.
- issue: Rapport entre l’impureté, la mort et le tabernacle
  choice: Conserver « dans leur impureté » et présenter la profanation du tabernacle comme la circonstance entraînant le danger.
  alternative: Rendre explicitement « mourir à cause de leur impureté » ou reformuler la phrase en jugement moral général.
  rationale: Les prépositions hébraïques laissent une certaine tension entre état, moyen et circonstance; la traduction évite de préciser davantage que le texte.
- issue: Désignation collective בְּנֵי יִשְׂרָאֵל
  choice: Traduire par « les Israélites ».
  alternative: « les fils d’Israël »
  rationale: En français actuel, « les Israélites » désigne naturellement l’ensemble du peuple concerné par ces prescriptions, tandis que le calque « fils d’Israël » pourrait être compris comme exclusivement masculin.
translation_notes:
  register: Français international moderne, digne et direct. Le futur prescriptif convient au discours légal. La répétition d’« impureté » est conservée pour refléter la cohésion terminologique de l’hébreu; « tabernacle » maintient le référent cultuel concret.
