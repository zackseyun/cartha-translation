  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִשָּׁ֡ה כִּֽי יָזוּב֩ ז֨וֹב דָּמָ֜/הּ יָמִ֣ים רַבִּ֗ים בְּ/לֹא֙ עֶת נִדָּתָ֔/הּ א֥וֹ כִֽי תָז֖וּב עַל נִדָּתָ֑/הּ כָּל יְמֵ֞י ז֣וֹב טֻמְאָתָ֗/הּ כִּ/ימֵ֧י נִדָּתָ֛/הּ תִּהְיֶ֖ה טְמֵאָ֥ה הִֽוא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/025.yaml
  text: If a woman has a discharge of blood for many days[a], not at the time of her menstrual impurity, or if she has a discharge beyond her menstrual impurity, all the days of her unclean discharge she shall be unclean[b], as in the days of her menstrual impurity.
translation:
  language: fr
  text: Si une femme a un écoulement de sang pendant de nombreux jours, en dehors du temps de son impureté menstruelle[a], ou si son écoulement se prolonge au-delà de son impureté menstruelle[b], elle sera impure pendant tous les jours de son écoulement impur, comme aux jours de son impureté menstruelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en dehors du temps de ses règles ». Le terme hébreu englobe l’état d’impureté rituelle associé aux règles, et non seulement le saignement.
    reason: lexical_alternative
  - marker: b
    text: Ou « si elle a un écoulement en plus de son impureté menstruelle », c’est-à-dire un écoulement qui se poursuit au-delà de la période menstruelle normale.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָזוּב / תָזוּב + זוֹב
  choice: a un écoulement / son écoulement se prolonge
  rationale: La combinaison du verbe et du nom issus de זוּב désigne un écoulement corporel anormal. « Écoulement » est naturel en français moderne et convient au contexte légal et corporel; « se prolonge » exprime ici la valeur contextuelle de עַל.
- source_word: דָּמָהּ
  choice: de sang
  rationale: Le suffixe signifie littéralement « son sang »; après « écoulement », « de sang » est la formulation française idiomatique.
- source_word: יָמִים רַבִּים
  choice: pendant de nombreux jours
  rationale: Cette formulation exprime clairement la durée sans transformer l’expression en durée indéterminée.
- source_word: בְּלֹא עֶת נִדָּתָהּ
  choice: en dehors du temps de son impureté menstruelle
  rationale: La tournure conserve à la fois la notion temporelle de עֵת et la dimension rituelle de נִדָּה, qui ne désigne pas seulement le saignement.
- source_word: נִדָּה
  choice: impureté menstruelle
  rationale: Dans ce contexte lévitique, le terme renvoie à l’état d’impureté rituelle associé aux règles. Cette traduction garde cette dimension explicite sans suggérer une faute morale.
- source_word: עַל נִדָּתָהּ
  choice: se prolonge au-delà de son impureté menstruelle
  rationale: Dans ce contexte, עַל peut indiquer que l’écoulement continue au-delà de la période menstruelle normale; la note conserve l’autre nuance possible, celle de l’addition.
- source_word: כָּל יְמֵי זֹב טֻמְאָתָהּ
  choice: pendant tous les jours de son écoulement impur
  rationale: La formulation restitue la durée, l’écoulement et son statut rituel, tout en restant lisible en français.
- source_word: טְמֵאָה
  choice: impure
  rationale: « Impure » est le terme français usuel pour la catégorie rituelle lévitique et n’implique pas en lui-même une culpabilité morale.
- source_word: כִּימֵי נִדָּתָהּ
  choice: comme aux jours de son impureté menstruelle
  rationale: La comparaison indique que son statut durant l’écoulement anormal est identique à celui qui correspond à l’impureté menstruelle.
theological_decisions:
- issue: Rendre le vocabulaire de pureté rituelle sans laisser entendre une culpabilité morale
  choice: Employer « impure » et « impureté menstruelle » comme termes de statut rituel
  alternative: Employer seulement « règles » ou « menstruation », sans mention explicite de l’impureté
  rationale: Le verset traite de l’impureté rituelle dans la législation lévitique, non d’une faute personnelle. La formulation choisie préserve cette catégorie cultuelle.
translation_notes:
  register: Français international moderne, digne et direct. Le vocabulaire corporel reste explicite sans être cru; la répétition d’« impureté menstruelle » maintient la cohérence juridique et rituelle du texte hébreu.
