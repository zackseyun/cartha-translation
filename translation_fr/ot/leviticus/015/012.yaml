id: LEV.15.12
reference: Leviticus 15:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/כְלִי חֶ֛רֶשׂ אֲשֶׁר יִגַּע בּ֥/וֹ הַ/זָּ֖ב יִשָּׁבֵ֑ר וְ/כָל כְּלִי עֵ֔ץ יִשָּׁטֵ֖ף בַּ/מָּֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/012.yaml
  text: And an earthen vessel that the one with the discharge touches shall be broken[c][b][a], and every wooden vessel shall be rinsed with water.
translation:
  language: fr
  text: Un récipient en terre cuite[a] que touche l’homme atteint d’un écoulement[b] devra être brisé, et tout récipient en bois devra être rincé à l’eau[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « récipient en argile » ou « poterie ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « celui qui a l’écoulement » : terme technique des lois de pureté désignant ici un homme affecté d’un écoulement corporel.'
    reason: cultural_note
  - marker: c
    text: Ou « lavé dans l’eau ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: récipient en terre cuite
  rationale: כְלִי désigne ici un récipient ou ustensile, et חֶרֶשׂ précise qu’il est fait de terre cuite. Cette formulation française naturelle conserve la distinction de matériau essentielle à la règle de pureté.
- source_word: אֲשֶׁר יִגַּע בּוֹ
  choice: que touche
  rationale: Le qal de נגע signifie directement « toucher ». Le présent français convient à la portée générale de cette prescription légale.
- source_word: הַזָּב
  choice: l’homme atteint d’un écoulement
  rationale: Le participe substantivé masculin זָב est un terme technique des lois de pureté pour la personne affectée d’un écoulement corporel; le contexte immédiat concerne un homme.
- source_word: יִשָּׁבֵר
  choice: devra être brisé
  rationale: Le niphal exprime ici une instruction légale passive. « Devra être brisé » rend clairement son caractère obligatoire en français moderne.
- source_word: כָל כְּלִי עֵץ
  choice: tout récipient en bois
  rationale: La traduction reprend « récipient » pour כְלִי afin de conserver le parallélisme avec le récipient en terre cuite, tout en indiquant précisément le matériau.
- source_word: יִשָּׁטֵף בַּמָּיִם
  choice: devra être rincé à l’eau
  rationale: שטף évoque un lavage ou rinçage à l’eau. « Rincé à l’eau » convient naturellement à un récipient et distingue cette action d’un lavage plus complet.
