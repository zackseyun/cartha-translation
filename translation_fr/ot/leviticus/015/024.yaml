  text: וְ/אִ֡ם שָׁכֹב֩ יִשְׁכַּ֨ב אִ֜ישׁ אֹתָ֗/הּ וּ/תְהִ֤י נִדָּתָ/הּ֙ עָלָ֔י/ו וְ/טָמֵ֖א שִׁבְעַ֣ת יָמִ֑ים וְ/כָל הַ/מִּשְׁכָּ֛ב אֲשֶׁר יִשְׁכַּ֥ב עָלָ֖י/ו יִטְמָֽא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/024.yaml
  text: If a man indeed lies with her[a], and her menstrual impurity comes upon him, he shall be unclean seven days, and every bed on which he lies shall be unclean.
translation:
  language: fr
  text: Si un homme couche avec elle[a] et que son impureté menstruelle vient sur lui, il sera impur pendant sept jours, et tout lit sur lequel il se couchera sera impur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement : « a des relations sexuelles avec elle ». L’expression hébraïque dit littéralement : « si un homme couche assurément avec elle »; la répétition du verbe souligne l’affirmation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכֹב יִשְׁכַּב
  choice: couche effectivement
  rationale: La construction infinitif absolu + imparfait intensifie l’idée verbale. « couche effectivement » conserve cette insistance tout en restant naturelle; avec « avec elle », l’expression désigne clairement une relation sexuelle.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom masculin singulier désigne ici un homme adulte; la traduction directe convient au contexte.
- source_word: אֹתָהּ
  choice: avec elle
  rationale: Le pronom objet renvoie à la femme mentionnée dans le contexte; intégré à l’idiome français « coucher avec elle ».
- source_word: נִדָּתָהּ
  choice: son impureté menstruelle
  rationale: Dans les lois de pureté du Lévitique, נִדָּה désigne l’état d’impureté rituelle lié aux règles, et non seulement le phénomène biologique.
- source_word: וּתְהִי ... עָלָיו
  choice: se transmette à lui
  rationale: Littéralement, « soit sur lui ». Cette formulation française rend naturellement l’idée contextuelle selon laquelle l’homme se trouve atteint par cette impureté, sans suggérer une faute morale.
- source_word: וְטָמֵא
  choice: il sera impur
  rationale: Dans la conséquence de cette proposition conditionnelle juridique, le parfait exprime l’état qui en résulte.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: Rend directement la durée indiquée par l’hébreu.
- source_word: הַמִּשְׁכָּב
  choice: lit
  rationale: Le nom désigne un endroit où l’on s’allonge; « lit » est ici le terme français courant et précis.
- source_word: אֲשֶׁר יִשְׁכַּב עָלָיו
  choice: sur lequel il se couchera
  rationale: La proposition relative est rendue au futur pour correspondre à la conséquence juridique envisagée et conserve l’image du fait de s’allonger sur le lit.
- source_word: יִטְמָא
  choice: sera impur
  rationale: L’imparfait énonce ici la conséquence dans le cadre légal; « sera impur » est clair et cohérent avec la première occurrence.
theological_decisions:
- issue: Rendre le vocabulaire de l’impureté rituelle sans lui attribuer une culpabilité morale
  choice: Employer « impur » et « impureté menstruelle » comme termes relevant de la pureté rituelle
  alternative: Employer « souillé », « pollution » ou une formulation évoquant une faute morale
  rationale: Lévitique 15 traite d’un état rituel lié aux écoulements corporels. Le verset ne qualifie pas explicitement cet état de faute morale; la traduction évite donc d’ajouter cette idée.
- issue: Nature du rapport entre l’impureté de la femme et l’état de l’homme
  choice: « se transmette à lui »
  alternative: « soit sur lui » ou « vienne sur lui »
  rationale: L’hébreu conserve l’image « être sur lui », mais le contexte indique que l’homme partage alors l’état d’impureté menstruelle durant sept jours. « se transmette à lui » explicite seulement cette relation rituelle sans en préciser davantage le mécanisme.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le caractère juridique de la phrase tout en évitant un vocabulaire clinique ou moralement chargé. « Effectivement » rend l’intensification hébraïque, tandis que la note explicite l’idiome sexuel.
