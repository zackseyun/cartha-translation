id: LEV.15.18
reference: Leviticus 15:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִשָּׁ֕ה אֲשֶׁ֨ר יִשְׁכַּ֥ב אִ֛ישׁ אֹתָ֖/הּ שִׁכְבַת זָ֑רַע וְ/רָחֲצ֣וּ בַ/מַּ֔יִם וְ/טָמְא֖וּ עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/018.yaml
  text: If a man lies with a woman and has an emission of semen[b][a], both of them shall wash in water and be unclean until the evening.
translation:
  language: fr
  text: Si un homme couche avec une femme et a une émission de sperme[a], tous deux se laveront dans l’eau et seront impurs[b] jusqu’au soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec émission de semence ». L’expression hébraïque désigne précisément une émission de sperme.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire rituellement impurs.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִשָּׁה אֲשֶׁר יִשְׁכַּב אִישׁ אֹתָהּ
  choice: Si un homme couche avec une femme
  rationale: Dans ce contexte juridique, la construction introduit un cas envisagé. « Coucher avec » rend naturellement l’idiome sexuel שׁכב tout en conservant le registre sobre et digne du texte.
- source_word: שִׁכְבַת זָרַע
  choice: a une émission de sperme
  rationale: La locution désigne ici précisément une émission séminale. Cette formulation est claire en français moderne et évite le littéralisme obscur « semence ».
- source_word: וְרָחֲצוּ בַמַּיִם
  choice: tous deux se laveront dans l’eau
  rationale: Le verbe au pluriel vise les deux partenaires. « Tous deux » explicite ce référent, tandis que « se laveront dans l’eau » reste proche du sens général de רחץ sans préciser indûment le mode du lavage.
- source_word: וְטָמְאוּ
  choice: seront impurs
  rationale: Dans le Lévitique, טמא indique un état d’impureté rituelle. Le texte principal conserve le terme bref « impurs » sans introduire l’idée de faute morale.
- source_word: עַד הָעָרֶב
  choice: jusqu’au soir
  rationale: Cette expression française naturelle reproduit directement la limite temporelle indiquée par l’hébreu.
theological_decisions:
- issue: Nature de l’impureté dans la législation lévitique
  choice: Rendre טמא par « impurs » et préciser en note qu’il s’agit d’impureté rituelle.
  alternative: « rituellement impurs » dans le corps du texte
  rationale: Le verset décrit un état temporaire lié aux règles de pureté, non une culpabilité morale. La traduction ne doit donc pas suggérer que la relation sexuelle mentionnée constitue en elle-même un péché.
translation_notes:
  register: Français international moderne, sobre et digne. Le futur simple maintient la tonalité prescriptive de la loi, tandis que le vocabulaire corporel reste précis sans être clinique à l’excès.
