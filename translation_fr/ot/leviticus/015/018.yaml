  source_fidelity: Le texte rend fidèlement la casuistique de וְאִשָּׁה אֲשֶׁר (« Si un homme… avec une femme »), l’idiome sexuel יִשְׁכַּב… אֹתָהּ (« couche avec »), et la précision שִׁכְבַת זָרַע (« une émission de sperme »). Le pluriel de וְרָחֲצוּ et de וְטָמְאוּ est correctement explicité par « tous deux ». « Jusqu’au soir » restitue exactement la borne temporelle indiquée.
