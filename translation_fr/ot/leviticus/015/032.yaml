source:
  edition: WLC
  text: זֹ֥את תּוֹרַ֖ת הַ/זָּ֑ב וַ/אֲשֶׁ֨ר תֵּצֵ֥א מִמֶּ֛/נּוּ שִׁכְבַת זֶ֖רַע לְ/טָמְאָה בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/032.yaml
  text: 'This is the law for the one with a discharge[a], and for him from whom an emission of semen goes out, making him unclean by it:'
translation:
  language: fr
  text: 'Telle est la loi concernant l’homme qui a un écoulement, et celui de qui sort une émission de sperme, le rendant impur :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת תּוֹרַת
  choice: Telle est la loi concernant
  rationale: La formule récapitulative lévitique est rendue dans un français naturel et digne. « Loi » exprime ici la prescription régissant ces cas.
- source_word: הַזָּב
  choice: l’homme qui a un écoulement
  rationale: Le participe substantivé désigne la personne atteinte d’un écoulement corporel. Dans ce contexte masculin, précisé par la mention du sperme, « l’homme » est naturel et exact.
- source_word: וַאֲשֶׁר תֵּצֵא מִמֶּנּוּ
  choice: et celui dont sort
  rationale: Cette formulation conserve la construction relative et l’image concrète de quelque chose qui sort de la personne.
- source_word: שִׁכְבַת זֶרַע
  choice: une émission de sperme
  rationale: L’expression hébraïque désigne une émission séminale. Ce choix est clair, actuel et précis, sans recourir à un euphémisme archaïque.
- source_word: לְטָמְאָה בָהּ
  choice: qui le rend impur
  rationale: L’infinitif indique ici l’effet de l’émission sur l’homme. La formulation française exprime clairement l’impureté rituelle qui en résulte.
theological_decisions:
- issue: Nature de l’impureté
  choice: « impur » sans qualification ajoutée
  alternative: « rituellement impur »
  rationale: Le vocabulaire lévitique concerne l’impureté cultuelle, mais le texte hébreu dit simplement « impur ». Ne pas ajouter « rituellement » préserve la concision et laisse le contexte définir la catégorie.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la forme d’une rubrique récapitulative et le deux-points final, puisque le verset introduit encore les catégories mentionnées aux versets suivants.
