source:
  edition: WLC
  text: וְ/אִשָּׁה֙ כִּֽי תִהְיֶ֣ה זָבָ֔ה דָּ֛ם יִהְיֶ֥ה זֹבָ֖/הּ בִּ/בְשָׂרָ֑/הּ שִׁבְעַ֤ת יָמִים֙ תִּהְיֶ֣ה בְ/נִדָּתָ֔/הּ וְ/כָל הַ/נֹּגֵ֥עַ בָּ֖/הּ יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/019.yaml
  text: When a woman has a discharge[a], and her discharge in her body is blood, she shall remain in her menstrual impurity seven days[b], and everyone who touches her shall be unclean until evening.
translation:
  language: fr
  text: Lorsqu’une femme a un écoulement et que l’écoulement qu’elle a dans son corps[a] est du sang, elle sera en état d’impureté menstruelle pendant sept jours[b]. Quiconque la touchera sera impur jusqu’au soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans sa chair ».'
    reason: lexical_alternative
  - marker: b
    text: L’« impureté menstruelle » désigne ici un statut d’impureté rituelle selon la loi lévitique, et non nécessairement une faute morale.
    reason: cultural_note
lexical_decisions:
- source_word: זָבָה / זֹבָהּ
  choice: a un écoulement / cet écoulement
  rationale: Le verbe זוּב désigne ici un flux ou écoulement corporel. « Écoulement » est naturel en français moderne et maintient le lien lexical entre les deux occurrences.
- source_word: דָּם
  choice: du sang
  rationale: Rend directement le terme hébreu et précise la nature de l’écoulement.
- source_word: בִּבְשָׂרָהּ
  choice: dans son corps
  rationale: בשר signifie littéralement « chair », mais désigne ici le corps de la femme. « Dans son corps » respecte la préposition ב tout en restant idiomatique; la formulation plus littérale est signalée en note.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: Expression temporelle directe; « pendant » donne en français la durée naturellement impliquée par l’hébreu.
- source_word: בְנִדָּתָהּ
  choice: en état d’impureté menstruelle
  rationale: Dans la législation lévitique, נִדָּה désigne ici le statut rituel associé aux règles, et non seulement le phénomène biologique.
- source_word: וְכָל הַנֹּגֵעַ בָּהּ
  choice: Quiconque la touchera
  rationale: Le participe précédé de כל exprime une règle générale. Le futur convient au registre juridique français.
- source_word: יִטְמָא
  choice: sera impur
  rationale: Rend le statut d’impureté rituelle exprimé par טמא sans introduire l’idée d’une faute morale.
- source_word: עַד הָעָרֶב
  choice: jusqu’au soir
  rationale: Formulation française naturelle et fidèle à la limite temporelle du texte.
theological_decisions:
- issue: Distinguer l’impureté rituelle de la culpabilité morale
  choice: Employer « impureté menstruelle » et « impur » comme termes de statut rituel
  alternative: « souillure », qui pourrait suggérer une faute ou une dégradation morale
  rationale: Le contexte de Lévitique 15 traite des catégories rituelles. La traduction ne doit pas faire de la menstruation une faute morale.
- issue: Relation syntaxique entre l’écoulement et le corps
  choice: « cet écoulement dans son corps est du sang »
  alternative: « un écoulement de sang provenant de son corps »
  rationale: La formulation retenue conserve autant que possible la préposition hébraïque « dans » et la structure qui précise ensuite que l’écoulement est du sang, sans imposer la lecture directionnelle « provenant de ».
translation_notes:
  register: Français international moderne, sobre et digne. Le futur exprime naturellement la portée juridique de la prescription. Les termes techniques sont conservés, mais explicités par une note afin d’éviter une lecture morale étrangère au contexte immédiat.
