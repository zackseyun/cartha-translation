id: LEV.15.5
reference: Leviticus 15:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִ֕ישׁ אֲשֶׁ֥ר יִגַּ֖ע בְּ/מִשְׁכָּב֑/וֹ יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/005.yaml
  text: And a man who touches his bed shall wash his clothes and bathe in water[b][a], and he shall be unclean until the evening.
translation:
  language: fr
  text: L’homme qui touchera son lit[a] lavera ses vêtements, se lavera dans l’eau et sera impur[b] jusqu’au soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa couche » ou « l’endroit où il s’est couché ». Le terme hébreu peut désigner plus largement le lieu où une personne s’est étendue, et pas seulement un lit construit.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire impur selon les règles de pureté rituelle.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אִישׁ אֲשֶׁר
  choice: L’homme qui
  rationale: אִישׁ est un nom masculin singulier, « homme ». La tournure relative française exprime naturellement la portée de la disposition légale.
- source_word: יִגַּע
  choice: touchera
  rationale: Le verbe נגע signifie ici « toucher, entrer en contact avec ». Le futur français convient à l’énoncé prescriptif sans l’alourdir.
- source_word: בְּ/מִשְׁכָּב/וֹ
  choice: son lit
  rationale: מִשְׁכָּב désigne le lieu où l’on se couche, souvent un lit ou une couche. « Son lit » est concis et naturel; la note conserve l’extension possible du terme.
- source_word: יְכַבֵּס בְּגָדָי/ו
  choice: lavera ses vêtements
  rationale: כִּבֵּס désigne le lavage des vêtements, et בְּגָדָיו en précise l’objet. Cette formulation est claire et actuelle.
- source_word: וְ/רָחַץ בַּ/מַּיִם
  choice: se lavera dans l’eau
  rationale: רחץ désigne ici le lavage du corps. Le réfléchi français l’explicite naturellement, tandis que « dans l’eau » rend la préposition בְּ sans préciser un mode d’ablution que le texte ne précise pas.
- source_word: וְ/טָמֵא
  choice: et sera impur
  rationale: טָמֵא exprime un état d’impureté au sens des règles lévitiques. « Impur » conserve la catégorie propre au texte sans l’assimiler à une faute morale.
- source_word: עַד הָ/עָרֶב
  choice: jusqu’au soir
  rationale: Expression française naturelle qui rend exactement la limite temporelle indiquée par l’hébreu.
theological_decisions:
- issue: Nature de l’impureté dans les lois lévitiques
  choice: Conserver « impur » dans le texte et préciser en note qu’il s’agit du statut défini par les règles de pureté rituelle.
  alternative: Traduire directement « rituellement impur » ou « en état d’impureté rituelle ».
  rationale: Le mot טָמֵא nomme ici un statut cultuel et non une culpabilité morale. Le terme bref « impur » respecte la formulation hébraïque, tandis que la note prévient une lecture morale étrangère au contexte.
translation_notes:
  register: Français international moderne, sobre et digne. Le futur simple maintient le registre juridique naturel du passage. Les répétitions nécessaires sont conservées, sans archaïsmes tels que « quiconque » ou « souillé ».
