id: LEV.15.20
reference: Leviticus 15:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כֹל֩ אֲשֶׁ֨ר תִּשְׁכַּ֥ב עָלָ֛י/ו בְּ/נִדָּתָ֖/הּ יִטְמָ֑א וְ/כֹ֛ל אֲשֶׁר תֵּשֵׁ֥ב עָלָ֖י/ו יִטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/020.yaml
  text: And everything on which she lies during her menstrual impurity shall be unclean[a], and everything on which she sits shall be unclean.
translation:
  language: fr
  text: Tout ce sur quoi elle se couchera pendant son impureté menstruelle[a] sera impur, et tout ce sur quoi elle s’assiéra sera impur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pendant ses règles ». Le terme hébreu comprend ici l’idée d’impureté rituelle associée aux menstruations, et non seulement celle du cycle physiologique.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדָּה
  choice: impureté menstruelle
  rationale: Dans ce contexte de lois de pureté, le terme désigne l’état d’impureté rituelle lié aux règles, et non une faute morale. Cette formulation conserve à la fois la dimension menstruelle et la catégorie rituelle.
- source_word: תִּשְׁכַּב
  choice: elle se couchera
  rationale: Le verbe décrit le fait de s’allonger ou de se coucher sur quelque chose, sans impliquer nécessairement le sommeil.
- source_word: תֵּשֵׁב
  choice: elle s’assiéra
  rationale: Le verbe désigne directement le fait de s’asseoir sur un objet.
- source_word: עָלָיו
  choice: sur quoi
  rationale: Dans les deux propositions relatives, cette formulation française naturelle conserve le rapport spatial avec l’objet placé sous elle.
- source_word: יִטְמָא
  choice: sera impur
  rationale: Le terme exprime ici un état d’impureté rituelle dans le cadre légal du Lévitique, sans connotation de culpabilité morale.
- source_word: וְכֹל אֲשֶׁר
  choice: tout ce sur quoi
  rationale: Cette traduction rend la portée globale de la construction hébraïque tout en formant une proposition relative idiomatique en français.
theological_decisions:
- issue: Nature de l’impureté dans les lois lévitiques de pureté
  choice: Employer le vocabulaire de l’impureté rituelle sans suggérer une faute morale
  alternative: Employer une formulation pouvant faire penser à une souillure morale ou à un péché
  rationale: Le verset traite du statut rituel associé aux règles dans le système de pureté d’Israël; il ne présente pas les menstruations comme une faute morale.
translation_notes:
  register: Français international moderne, clair et digne. Le futur conserve la formulation normative de la loi. « Impur » est maintenu comme terme technique du système rituel lévitique.
