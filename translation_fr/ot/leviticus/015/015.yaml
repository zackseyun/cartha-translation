base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/015.yaml
  text: The priest shall offer them[a], one as a sin offering and the other as a burnt offering, and the priest shall make atonement for him before Yahweh because of his discharge.
translation:
  language: fr
  text: Le prêtre les offrira, l’un comme sacrifice pour le péché[a] et l’autre comme holocauste. Le prêtre fera l’expiation pour lui devant Yahvé, à cause de son écoulement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sacrifice de purification ». Le terme hébreu peut désigner ici l’offrande destinée à ôter une impureté rituelle, et pas seulement une offrande liée à une faute morale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה אֹתָם
  choice: les offrira
  rationale: Dans ce contexte sacrificiel, עשה désigne l’accomplissement rituel de l’offrande des deux oiseaux mentionnés au verset précédent. « Les offrira » est naturel et précis en français.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Équivalent français courant de כהן dans la législation cultuelle.
- source_word: אֶחָד חַטָּאת
  choice: l’un comme sacrifice pour le péché
  rationale: Cette formulation conserve le terme sacrificiel traditionnel tout en signalant en note la valeur plus spécifiquement purificatrice de חטאת dans ce contexte d’impureté rituelle.
- source_word: וְהָאֶחָד עֹלָה
  choice: et l’autre comme holocauste
  rationale: « Holocauste » est le terme français établi pour l’offrande entièrement consumée désignée par עֹלָה.
- source_word: וְכִפֶּר עָלָיו
  choice: accomplira pour lui le rite d’expiation
  rationale: Cette expression rend la portée cultuelle de כפר sans imposer une théorie particulière de son mécanisme. La tournure « pour lui » correspond à עַל avec le pronom.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahvé
  rationale: Traduction directe, naturelle et solennelle de l’expression cultuelle indiquant que le rite est accompli en présence de Yahvé.
- source_word: מִזּוֹבוֹ
  choice: à cause de son écoulement
  rationale: Dans ce contexte, מן indique la cause ou l’impureté en raison de laquelle l’expiation rituelle est accomplie. « Écoulement » reprend le vocabulaire médical et rituel du passage.
theological_decisions:
- issue: Sens de חַטָּאת dans un contexte d’impureté rituelle
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: חטאת peut désigner une offrande qui traite l’impureté rituelle, sans impliquer ici une faute morale personnelle. Le rendu traditionnel reste dans le texte, tandis que la note préserve la nuance cultuelle essentielle.
- issue: Rendu de כפר
  choice: accomplir pour lui le rite d’expiation
  alternative: faire l’expiation pour lui
  rationale: Le choix retenu explicite sobrement qu’il s’agit d’un acte rituel et conserve la tension théologique du terme sans réduire son sens à une seule conception de l’expiation.
translation_notes:
  register: Français moderne, international et digne, avec le vocabulaire cultuel établi (« prêtre », « holocauste », « expiation »). La phrase reste accessible tout en distinguant implicitement impureté rituelle et culpabilité morale.
