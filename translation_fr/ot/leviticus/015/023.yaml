source:
  edition: WLC
  text: וְ/אִ֨ם עַֽל הַ/מִּשְׁכָּ֜ב ה֗וּא א֧וֹ עַֽל הַ/כְּלִ֛י אֲשֶׁר הִ֥וא יֹשֶֽׁבֶת עָלָ֖י/ו בְּ/נָגְע/וֹ ב֑/וֹ יִטְמָ֖א עַד הָ/עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/023.yaml
  text: And if it is on the bed or on the item on which she sits[a], when he touches it he shall be unclean until the evening.
translation:
  language: fr
  text: Et si cela est sur le lit ou sur l’objet[a] sur lequel elle s’assied, quiconque y touche sera impur jusqu’au soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’ustensile » ou « le récipient ». Le mot hébreu כְּלִי peut désigner divers objets, instruments ou récipients.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Et si
  rationale: Conserve à la fois le lien avec la prescription précédente et la valeur conditionnelle de l’expression hébraïque.
- source_word: עַל הַמִּשְׁכָּב
  choice: sur le lit
  rationale: מִשְׁכָּב désigne couramment un lit ou un endroit où l’on se couche; « lit » est ici clair et naturel.
- source_word: הוּא
  choice: il se trouve
  rationale: Le pronom masculin singulier renvoie à un élément implicite dans le contexte. « Il se trouve » rend la construction intelligible sans préciser davantage ce référent que ne le fait l’hébreu.
- source_word: עַל הַכְּלִי
  choice: sur l’objet
  rationale: כְּלִי est un terme étendu pouvant désigner un objet, un ustensile, un récipient ou un équipement. « Objet » convient au contexte sans restreindre indûment le sens.
- source_word: אֲשֶׁר הִוא יֹשֶׁבֶת עָלָיו
  choice: sur lequel elle s’assied
  rationale: Rend directement la proposition relative et la valeur habituelle ou descriptive du participe hébreu.
- source_word: בְּנָגְעוֹ בוֹ
  choice: celui qui le touche
  rationale: La tournure française exprime naturellement la circonstance temporelle et l’acteur masculin singulier du texte hébreu, tout en évitant un enchaînement obscur de pronoms.
- source_word: יִטְמָא
  choice: sera impur
  rationale: Dans cette législation, l’imparfait indique le statut rituel qui résulte du contact. Le futur français est naturel dans une formulation juridique.
- source_word: עַד הָעָרֶב
  choice: jusqu’au soir
  rationale: Formule française usuelle qui correspond exactement à la limite temporelle exprimée en hébreu.
theological_decisions:
- issue: Sens de טָמֵא dans les lois de pureté du Lévitique
  choice: impur
  alternative: rituellement impur; souillé
  rationale: Le terme décrit ici un statut rituel, sans impliquer nécessairement une faute morale. « Impur » conserve la sobriété du texte et le vocabulaire biblique courant.
- issue: Référent du pronom הוּא
  choice: maintenir le référent implicite par « il se trouve »
  alternative: expliciter « le sang » ou « l’écoulement »
  rationale: L’hébreu emploie un pronom masculin singulier dont le référent n’est pas nommé dans cette phrase. La traduction évite de trancher silencieusement cette difficulté en ajoutant un nom absent du texte.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve le caractère juridique du passage, tout en rendant plus naturel l’enchaînement des pronoms. L’ambiguïté du référent initial n’est pas résolue par un ajout interprétatif.
