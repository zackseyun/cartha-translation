  text: וְ/עָשָׂ֤ה הַ/כֹּהֵן֙ אֶת הָ/אֶחָ֣ד חַטָּ֔את וְ/אֶת הָ/אֶחָ֖ד עֹלָ֑ה וְ/כִפֶּ֨ר עָלֶ֤י/הָ הַ/כֹּהֵן֙ לִ/פְנֵ֣י יְהוָ֔ה מִ/זּ֖וֹב טֻמְאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/030.yaml
  text: Then the priest shall offer one as a sin offering and the other as a burnt offering, and the priest shall make atonement for her before Yahweh because of her unclean discharge.
translation:
  language: fr
  text: Le prêtre offrira l’un en sacrifice pour le péché[a] et l’autre en holocauste. Le prêtre fera expiation pour elle devant Yahweh, à cause de son écoulement impur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « sacrifice de purification » : le terme hébreu חַטָּאת peut souligner ici la fonction purificatrice de l’offrande.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: offrira
  rationale: Dans ce contexte sacrificiel, le verbe général « faire » désigne idiomatiquement l’action d’offrir les deux sacrifices.
- source_word: הָאֶחָד חַטָּאת
  choice: l’un en sacrifice pour le péché
  rationale: חַטָּאת désigne ici une catégorie sacrificielle. « Sacrifice pour le péché » est une formulation française claire et traditionnelle, tandis que la fonction purificatrice est signalée en note.
- source_word: וְאֶת־הָאֶחָד עֹלָה
  choice: et l’autre en holocauste
  rationale: עֹלָה désigne le sacrifice entièrement brûlé; « holocauste » est le terme cultuel français usuel. La répétition de הָאֶחָד prend naturellement le sens distributif « l’un… l’autre ».
- source_word: וְכִפֶּר עָלֶיהָ
  choice: fera pour elle le rite d’expiation
  rationale: Cette formulation conserve la portée rituelle de כפר et évite de laisser entendre que le prêtre expie personnellement ses fautes; עָלֶיהָ est rendu par « pour elle ».
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » conserve le cadre cultuel de לִפְנֵי, et le nom divin est transcrit « Yahweh ».
- source_word: מִזּוֹב טֻמְאָתָהּ
  choice: à cause de son écoulement impur
  rationale: זוֹב désigne un écoulement corporel et טֻמְאָה son caractère impur. Cette tournure française naturelle conserve ici la valeur causale de מִן sans reproduire maladroitement le littéralisme « écoulement de son impureté ».
theological_decisions:
- issue: Rendu de יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme; sa transcription préserve le nom divin de l’alliance.
- issue: Rendu sacrificiel de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le terme nomme ici une catégorie d’offrande et peut mettre en relief soit le péché, soit la purification rituelle. Le rendu principal emploie l’appellation française la plus reconnue, sans supprimer l’autre nuance, conservée en note.
- issue: Nature de l’impureté et expiation
  choice: langage rituel sans assimilation explicite à une faute morale
  alternative: formulation laissant entendre une faute personnelle
  rationale: Le contexte concerne un écoulement corporel rendant rituellement impur. « Rite d’expiation » conserve la force cultuelle de כפר sans résoudre indûment le rapport entre purification et expiation.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase est divisée en deux pour alléger la coordination hébraïque tout en conservant la répétition emphatique du prêtre. Le vocabulaire cultuel « holocauste » et « rite d’expiation » préserve la précision lévitique.
