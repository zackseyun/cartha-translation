  text: וְ/כָל הַ/נֹּגֵ֔עַ בְּ/כָל כְּלִ֖י אֲשֶׁר תֵּשֵׁ֣ב עָלָ֑י/ו יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/022.yaml
  text: And everyone who touches any object on which she sits shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: fr
  text: Quiconque touchera un objet sur lequel elle s’assied lavera ses vêtements, se lavera dans l’eau et sera impur jusqu’au soir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un ustensile », « un récipient » ou « un article ». Le mot hébreu כְּלִי peut désigner divers objets ou ustensiles.
    reason: alternative lexicale
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: Quiconque touchera
  rationale: Le participe substantivé avec כָל désigne toute personne concernée. « Quiconque » exprime naturellement en français la portée générale de la règle.
- source_word: בְּכָל כְּלִי
  choice: un objet
  rationale: כְּלִי est un terme large pouvant désigner un objet, un ustensile, un récipient ou un article. Ici, « objet » convient au contexte de ce sur quoi l’on s’assied sans restreindre indûment le sens.
- source_word: אֲשֶׁר תֵּשֵׁב עָלָיו
  choice: sur lequel elle se sera assise
  rationale: Le féminin renvoie à la femme du contexte précédent. Le futur antérieur situe son action avant le contact envisagé par la prescription.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: lavera ses vêtements
  rationale: כִּבֵּס appliqué aux vêtements désigne leur lavage. Le futur français garde ici la valeur prescriptive de la formulation juridique.
- source_word: וְרָחַץ בַּמַּיִם
  choice: se lavera dans l’eau
  rationale: רָחַץ désigne ici le lavage du corps. La tournure pronominale rend ce sens clairement et naturellement, sans ajouter l’idée plus précise d’un bain par immersion.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: et sera impur jusqu’au soir
  rationale: « Impur » désigne la condition rituelle prescrite par le texte, tandis que « jusqu’au soir » exprime simplement sa durée.
theological_decisions:
- issue: Nature de l’impureté dans la législation de Lévitique
  choice: Rendre טָמֵא par « impur » sans vocabulaire de culpabilité morale.
  alternative: « souillé » ou « impur rituellement »
  rationale: Le passage décrit un statut rituel résultant d’un contact, non une faute morale. « Impur » conserve la catégorie cultuelle sans explicitation interprétative dans le corps du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le futur a valeur prescriptive, conformément au registre juridique du passage. La note conserve l’étendue lexicale de כְּלִי.
