base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/052.yaml
  text: He shall burn the garment[a], or the warp or the woof in wool or in linen, or any article of leather in which the infection is, for it is a destructive skin disease[b]; it shall be burned in the fire.
translation:
  language: fr
  text: 'Il brûlera le vêtement, ou la chaîne ou la trame, en laine ou en lin[a], ou tout objet en cuir dans lequel se trouve l’atteinte. En effet, il s’agit d’une atteinte destructrice[b] : l’objet sera brûlé au feu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « chaîne » et la « trame » sont respectivement les fils longitudinaux et transversaux d’un tissu.
    reason: Précision sur des termes techniques de tissage.
  - marker: b
    text: Le mot hébreu צָרַעַת (tsaraath), traditionnellement traduit par « lèpre », désigne une catégorie rituelle plus large que la lèpre au sens médical moderne; il peut aussi s’appliquer aux vêtements et aux maisons.
    reason: Précision culturelle et lexicale nécessaire pour éviter une identification médicale anachronique.
lexical_decisions:
- source_word: וְשָׂרַף
  choice: Il brûlera
  rationale: Dans cette suite de prescriptions légales, le parfait précédé de la conjonction exprime l’action prescrite qui vient ensuite. Le futur français convient au style normatif du passage.
- source_word: הַבֶּגֶד
  choice: le vêtement
  rationale: « Vêtement » rend le terme général בגד dans un registre clair et digne.
- source_word: הַשְּׁתִי ... הָעֵרֶב
  choice: la chaîne ou la trame
  rationale: Ce sont les deux termes techniques usuels en français pour les fils longitudinaux et transversaux d’un tissu.
- source_word: בַּצֶּמֶר ... בַפִּשְׁתִּים
  choice: de laine ou de lin
  rationale: Cette formulation française naturelle indique la matière des fils ou du tissu sans confondre le lin textile avec la plante brute.
- source_word: כָּל כְּלִי הָעוֹר
  choice: tout objet en cuir
  rationale: כְּלִי peut désigner largement un objet, un ustensile ou un article. « Objet en cuir » évite de restreindre indûment le sens à un récipient.
- source_word: אֲשֶׁר יִהְיֶה בוֹ הַנָּגַע
  choice: dans lequel se trouve l’atteinte
  rationale: נגע désigne ici la marque ou l’atteinte constatée. « Atteinte » reste observable et neutre, sans imposer un diagnostic médical moderne.
- source_word: צָרַעַת מַמְאֶרֶת
  choice: une affection destructrice
  rationale: צָרַעַת désigne dans ce chapitre une catégorie plus vaste que la lèpre moderne et s’applique aussi aux textiles et aux maisons. מַמְאֶרֶת qualifie son caractère dommageable, persistant ou corrosif; « destructrice » préserve cette portée sans surinterprétation médicale.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: l’objet sera brûlé au feu
  rationale: Le passif exprime le résultat obligatoire. L’ajout explicatif de « l’objet » évite en français un pronom dont l’antécédent varierait en genre parmi les éléments énumérés.
theological_decisions:
- issue: Sens de צָרַעַת dans les lois lévitiques de pureté
  choice: affection
  alternative: lèpre
  rationale: Le mot hébreu ne correspond pas exactement à la maladie de Hansen et peut qualifier des atteintes touchant des personnes, des textiles ou des maisons. « Affection » conserve une catégorie générale, tandis que la note signale le terme traditionnel sans transformer le texte en diagnostic moderne.
translation_notes:
  register: Français international moderne, clair et normatif. Les termes techniques « chaîne » et « trame » sont conservés et expliqués en note. Le redoublement final de l’ordre de brûler, présent dans l’hébreu, est maintenu.
