  to: 'Il brûlera le vêtement, ou la chaîne ou la trame, en laine ou en lin[a], ou tout objet en cuir dans lequel se trouve l’atteinte. En effet, il s’agit d’une atteinte destructrice[b] : l’objet sera brûlé au feu.'
  rationale: La révision supprime le pronom « qu’elles », dont l’accord restreignait indûment la mention de la laine ou du lin à la chaîne et à la trame. Elle conserve l’ambiguïté syntaxique modérée de l’hébreu et sa terminologie non médicale, tout en clarifiant la note sur צָרַעַת.
