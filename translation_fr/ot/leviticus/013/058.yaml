language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הַ/בֶּ֡גֶד אֽוֹ הַ/שְּׁתִ֨י אוֹ הָ/עֵ֜רֶב אֽוֹ כָל כְּלִ֤י הָ/עוֹר֙ אֲשֶׁ֣ר תְּכַבֵּ֔ס וְ/סָ֥ר מֵ/הֶ֖ם הַ/נָּ֑גַע וְ/כֻבַּ֥ס שֵׁנִ֖ית וְ/טָהֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/058.yaml
  text: But the garment[a], or the warp, or the woof, or any article of leather that you wash, and the infection departs from them, shall be washed a second time and be clean.
translation:
  language: fr
  text: 'Quant au vêtement, aux fils de chaîne ou de trame, ou à tout objet en cuir que tu auras lavé : si l’atteinte en a disparu, il sera lavé une seconde fois, et il sera pur.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבֶּגֶד
  choice: le vêtement
  rationale: בגד désigne couramment un vêtement ou une pièce d’étoffe. « Vêtement » convient au contexte et reste naturel en français moderne.
- source_word: הַשְּׁתִי
  choice: les fils de chaîne
  rationale: שׁתי désigne les fils disposés dans le sens de la longueur sur le métier à tisser. L’ajout de « fils de » rend le terme technique immédiatement compréhensible.
- source_word: הָעֵרֶב
  choice: les fils de trame
  rationale: ערב, en paire avec שׁתי, désigne les fils transversaux du tissu. « Fils de trame » est l’équivalent technique courant en français.
- source_word: כָל כְּלִי הָעוֹר
  choice: tout objet en cuir
  rationale: כלי est un terme large pouvant désigner un objet, un ustensile ou un article. « Objet en cuir » évite de le restreindre à un récipient.
- source_word: תְּכַבֵּס
  choice: que tu auras lavé
  rationale: Le piel de כבס désigne ici le lavage d’un textile ou d’un objet. Le futur antérieur français situe naturellement ce lavage avant la constatation qui suit, tout en conservant l’adresse à la deuxième personne du singulier.
- source_word: הַנָּגַע
  choice: l’atteinte
  rationale: נגע désigne ici le phénomène visible qui affecte le matériau, sans permettre de l’identifier précisément selon des catégories scientifiques modernes. « Atteinte » reste assez large et s’accorde au vocabulaire rituel du chapitre.
- source_word: וְסָר מֵהֶם
  choice: si l’atteinte en a disparu
  rationale: 'Bien que l’hébreu coordonne littéralement les propositions par ו, le rapport logique est conditionnel dans cette procédure : lorsque le lavage a fait disparaître l’atteinte, un second lavage est prescrit. « En » reprend sans lourdeur l’objet concerné.'
- source_word: וְכֻבַּס שֵׁנִית
  choice: il sera lavé une seconde fois
  rationale: Le passif de כבס suivi de שׁנית exprime clairement la répétition prescrite du lavage.
- source_word: וְטָהֵר
  choice: et il sera pur
  rationale: טהר indique ici l’état de pureté reconnu dans le cadre rituel. « Pur » préserve cette valeur mieux que le seul sens matériel de « propre ».
theological_decisions:
- issue: Valeur de טהר dans la législation sur la pureté
  choice: il sera pur
  alternative: il sera propre
  rationale: Le contexte porte sur le statut rituel de l’objet après traitement, et non simplement sur sa propreté physique. « Pur » conserve cette catégorie sans ajouter d’interprétation confessionnelle.
- issue: Rapport logique exprimé par וְסָר
  choice: si l’atteinte en a disparu
  alternative: et l’atteinte en a disparu
  rationale: La coordination hébraïque peut porter une condition implicite dans une instruction procédurale. Le français exige ici une articulation plus explicite pour éviter de présenter la disparition comme automatique dans tous les cas.
translation_notes:
  register: Français international moderne, digne et direct. Les termes textiles précis « fils de chaîne » et « fils de trame » évitent un vocabulaire archaïque. La tournure « Quant à… » structure la longue série d’objets, tandis que le singulier « il » reprend distributivement chacun des éléments introduits par « ou ».
