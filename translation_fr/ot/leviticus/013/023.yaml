source:
  edition: WLC
  text: וְ/אִם תַּחְתֶּ֜י/הָ תַּעֲמֹ֤ד הַ/בַּהֶ֨רֶת֙ לֹ֣א פָשָׂ֔תָה צָרֶ֥בֶת הַ/שְּׁחִ֖ין הִ֑וא וְ/טִהֲר֖/וֹ הַ/כֹּהֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/023.yaml
  text: But if the bright spot remains in its place and has not spread[a], it is the scar of the boil, and the priest shall pronounce him clean.
translation:
  language: fr
  text: Mais si la tache claire reste à sa place et ne s’étend pas[a], c’est la cicatrice du furoncle. Le prêtre le déclarera pur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « se tient sous elle »; l’expression hébraïque indique que la tache reste localisée au lieu de s’étendre.'
    reason: alternative lexicale et explicitation de l’idiome
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit le cas opposé à celui du verset précédent; « Mais si » rend naturellement ce contraste conditionnel.
- source_word: תַּחְתֶּיהָ תַּעֲמֹד
  choice: reste à sa place
  rationale: L’expression signifie littéralement « se tient sous elle », mais indique ici que la tache demeure localisée au lieu de s’étendre.
- source_word: הַבַּהֶרֶת
  choice: la tache claire
  rationale: Désigne une marque cutanée claire ou brillante observable, sans imposer un diagnostic médical moderne.
- source_word: לֹא פָשָׂתָה
  choice: ne s’étend pas
  rationale: Le verbe décrit régulièrement, dans ce chapitre, l’extension d’une affection cutanée.
- source_word: צָרֶבֶת הַשְּׁחִין
  choice: la cicatrice du furoncle
  rationale: צָרֶבֶת désigne ici la marque laissée par l’inflammation, et שְׁחִין une éruption ou un furoncle.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: Le prêtre le déclarera pur
  rationale: Dans ce contexte sacerdotal, le verbe exprime une déclaration de statut rituel, non l’action de guérir ou de nettoyer.
theological_decisions:
- issue: Pureté rituelle ou guérison médicale
  choice: « Le prêtre le déclarera pur »
  alternative: « Le prêtre le purifiera »
  rationale: Le prêtre constate et déclare le statut rituel de la personne; le texte ne lui attribue pas une guérison physique.
translation_notes:
  register: Français international moderne, clair et digne. « Tache claire » conserve le caractère visuel du signe; « furoncle » est courant et précis; « déclarera pur » maintient la distinction entre constat sacerdotal et traitement médical.
