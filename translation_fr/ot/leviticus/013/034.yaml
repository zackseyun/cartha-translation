  text: וְ/רָאָה֩ הַ/כֹּהֵ֨ן אֶת הַ/נֶּ֜תֶק בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וְ֠/הִנֵּה לֹא פָשָׂ֤ה הַ/נֶּ֨תֶק֙ בָּ/ע֔וֹר וּ/מַרְאֵ֕/הוּ אֵינֶ֥/נּוּ עָמֹ֖ק מִן הָ/ע֑וֹר וְ/טִהַ֤ר אֹת/וֹ֙ הַ/כֹּהֵ֔ן וְ/כִבֶּ֥ס בְּגָדָ֖י/ו וְ/טָהֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/034.yaml
  text: Then the priest shall examine the scaly infection on the seventh day[a], and if the scaly infection has not spread in the skin and its appearance is not deeper than the skin, the priest shall pronounce him clean[c][b]. He shall wash his clothes and be clean.
translation:
  language: fr
  text: Le septième jour, le prêtre examinera l’affection du cuir chevelu ou de la barbe[a]. Si elle ne s’est pas étendue dans la peau et si son aspect ne paraît pas plus enfoncé que le reste de la peau[b], le prêtre déclarera la personne pure[c]. Celle-ci lavera ses vêtements, et elle sera pure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu neteq désigne une affection particulière du cuir chevelu ou de la barbe. On le traduit traditionnellement par « teigne », sans qu’il soit possible de l’identifier avec certitude à une maladie moderne précise.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « son apparence n’est pas plus profonde que la peau ». Il s’agit d’un critère d’examen sacerdotal : la zone atteinte ne semble pas enfoncée sous le niveau de la peau environnante.'
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « le prêtre le rendra pur ». Ici, cela signifie que le prêtre prononce officiellement un verdict de pureté, non qu’il guérisse l’affection.'
    reason: alternative_reading
lexical_decisions:
- source_word: נֶתֶק
  choice: affection du cuir chevelu ou de la barbe
  rationale: Dans Lévitique 13, le terme désigne une affection particulière touchant la tête ou la barbe. Cette formulation reste compréhensible sans assimiler le terme hébreu à un diagnostic médical moderne précis.
- source_word: פָשָׂה
  choice: s’est étendue
  rationale: Dans ce contexte d’examen, le verbe décrit la propagation de l’affection sur la peau.
- source_word: בָּעוֹר
  choice: sur la peau
  rationale: En français courant, « s’étendre sur la peau » exprime naturellement la propagation visible dans la zone cutanée, sans modifier le critère diagnostique.
- source_word: מַרְאֵהוּ אֵינֶנּוּ עָמֹק מִן הָעוֹר
  choice: ne paraît pas plus profonde que la peau
  rationale: Le mot מַרְאֶה concerne l’apparence visible. « Ne paraît pas » conserve cette dimension d’observation et évite de présenter comme mesure anatomique ce qui relève de l’examen visuel.
- source_word: וְטִהַר אֹתוֹ הַכֹּהֵן
  choice: le prêtre déclarera la personne pure
  rationale: Dans cette procédure sacerdotale, le prêtre rend un verdict officiel de pureté; il ne guérit pas lui-même l’affection.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: Celle-ci lavera ses vêtements
  rationale: La reprise par « celle-ci » désigne sans ambiguïté la personne examinée, et « vêtements » convient au registre légal et rituel.
- source_word: וְטָהֵר
  choice: et elle sera pure
  rationale: Le verbe final indique l’état de pureté qui suit le lavage des vêtements.
- source_word: וְהִנֵּה
  choice: Si
  rationale: Dans la formule d’inspection, וְהִנֵּה introduit le constat dont dépend le verdict. La construction conditionnelle est naturelle en français.
- source_word: וְרָאָה
  choice: examinera
  rationale: Le prêtre procède à une inspection officielle; « examinera » rend mieux cette fonction que le simple verbe « voir ».
theological_decisions:
- issue: Nature de l’action sacerdotale dans la législation sur la pureté
  choice: Le prêtre déclare officiellement la personne pure.
  alternative: Le prêtre la purifie.
  rationale: Dans ce cadre juridique et rituel, טהר exprime l’attribution d’un statut de pureté. Cette traduction évite de laisser entendre que le prêtre guérit médicalement la personne ou produit lui-même sa purification.
translation_notes:
  register: Français international moderne, clair et digne. La formulation évite le diagnostic anachronique « teigne » dans le corps du texte, tout en le signalant en note. « La personne » et « celle-ci » rendent le référent humain sans imposer un masculin générique absent du contexte immédiat.
