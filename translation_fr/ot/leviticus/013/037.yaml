source:
  edition: WLC
  text: וְ/אִם בְּ/עֵינָי/ו֩ עָמַ֨ד הַ/נֶּ֜תֶק וְ/שֵׂעָ֨ר שָׁחֹ֧ר צָֽמַח בּ֛/וֹ נִרְפָּ֥א הַ/נֶּ֖תֶק טָה֣וֹר ה֑וּא וְ/טִהֲר֖/וֹ הַ/כֹּהֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/037.yaml
  text: But if in his sight the scaly eruption has remained unchanged[a], and black hair has grown in it, the scaly eruption is healed; he is clean, and the priest shall pronounce him clean.
translation:
  language: fr
  text: Mais si, à ses yeux, la plaque squameuse est restée telle quelle et que des poils noirs y ont poussé, la plaque squameuse est guérie. Il est pur, et le prêtre le déclarera pur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le prêtre le purifiera ». Dans ce contexte, le verbe hébreu désigne la décision officielle du prêtre qui reconnaît la personne comme pure.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  choice: à ses yeux
  rationale: Cette expression conserve le point de vue de celui qui examine, ici le prêtre, sans transformer l’observation en simple opinion subjective.
- source_word: עָמַד
  choice: est restée telle quelle
  rationale: Dans ce contexte d’examen, le verbe indique que la lésion n’a pas évolué ou ne s’est pas étendue. Cette formulation est naturelle en français tout en gardant ce sens.
- source_word: הַנֶּתֶק
  choice: la plaque squameuse
  rationale: Le terme désigne une affection particulière du cuir chevelu ou de la barbe. « Plaque squameuse » reste descriptif et évite le terme « teigne », qui pourrait suggérer trop précisément un diagnostic moderne.
- source_word: שֵׂעָר שָׁחֹר
  choice: des poils noirs
  rationale: « Poils » convient à la fois au cuir chevelu et à la barbe, tandis que « noirs » rend directement l’adjectif hébreu.
- source_word: צָמַח בּוֹ
  choice: y ont poussé
  rationale: Le pronom adverbial « y » exprime naturellement en français que les poils ont poussé dans la zone atteinte.
- source_word: נִרְפָּא
  choice: est guérie
  rationale: Le passif indique que l’affection est désormais guérie; l’accord au féminin renvoie à « plaque squameuse ».
- source_word: טָהוֹר הוּא
  choice: Il est pur
  rationale: Le pronom renvoie à la personne examinée. « Pur » est le terme français usuel pour le statut rituel dans le Lévitique.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: et le prêtre le déclarera pur
  rationale: Dans ce cadre juridique et rituel, le prêtre constate officiellement l’état de pureté après la guérison; il ne produit pas lui-même la guérison.
theological_decisions:
- issue: Nature de l’action du prêtre dans la reconnaissance de la pureté rituelle
  choice: le prêtre le déclarera pur
  alternative: le prêtre le purifiera
  rationale: Le texte distingue la guérison déjà constatée de la décision officielle qui suit. Cette traduction n’attribue donc pas au prêtre l’action de guérir ou de rendre physiquement sain.
translation_notes:
  register: Français moderne, clair et digne. La formulation descriptive « plaque squameuse » évite un diagnostic médical moderne trop précis. Le marqueur de note est placé après la proposition qu’il explique.
