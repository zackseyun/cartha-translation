  yaml_path: translation/ot/leviticus/013/011.yaml
  text: it is a chronic skin disease in the skin of his body[a], and the priest shall pronounce him unclean; he shall not isolate him, for he is unclean.
translation:
  language: fr
  text: C’est une affection cutanée de longue date, présente sur la peau de son corps[a]. Le prêtre le déclarera impur. Il ne l’isolera pas, car il est impur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une affection cutanée persistante ». Les traductions traditionnelles rendent souvent צָרַעַת par « lèpre », mais, dans le Lévitique, le terme hébreu recouvre un ensemble d’affections plus large que la lèpre moderne.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַעַת
  choice: affection cutanée
  rationale: Le terme hébreu désigne dans le Lévitique diverses affections graves touchant la peau, sans correspondre précisément à la maladie de Hansen. « Affection cutanée » évite cette fausse précision médicale.
- source_word: נוֹשֶׁנֶת
  choice: ancienne
  rationale: Le participe indique une affection déjà ancienne ou installée. « Ancienne » conserve sobrement le sens temporel de l’hébreu sans imposer la notion médicale plus précise de chronicité.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: sur la peau de son corps
  rationale: « Corps » est plus naturel que « chair » dans ce contexte physique, et « sur la peau » constitue une formulation idiomatique en français.
- source_word: וְטִמְּאוֹ
  choice: le déclarera impur
  rationale: Dans cette procédure sacerdotale, le prêtre constate et proclame un statut rituel plutôt qu’il ne rend la personne impure.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Traduction directe et usuelle de la fonction cultuelle.
- source_word: לֹא יַסְגִּרֶנּוּ
  choice: Il ne l’isolera pas
  rationale: Le verbe évoque la mise à l’écart destinée à l’observation. « Isoler » est clair et actuel, sans la connotation médicale moderne de « mettre en quarantaine ».
- source_word: כִּי טָמֵא הוּא
  choice: car il est impur
  rationale: La proposition causale explique qu’aucune période supplémentaire d’isolement diagnostique n’est nécessaire.
theological_decisions:
- issue: Traduction du vocabulaire de l’impureté rituelle
  choice: impur
  alternative: souillé
  rationale: « Impur » exprime le statut rituel et juridique dans le Lévitique sans suggérer ici une culpabilité morale personnelle. Il permet aussi une traduction cohérente de טמא.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le caractère sacerdotal et juridique du diagnostic tout en évitant une identification médicale anachronique.
