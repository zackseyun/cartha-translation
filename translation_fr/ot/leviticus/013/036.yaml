  text: וְ/רָאָ֨/הוּ֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה פָּשָׂ֥ה הַ/נֶּ֖תֶק בָּ/ע֑וֹר לֹֽא יְבַקֵּ֧ר הַ/כֹּהֵ֛ן לַ/שֵּׂעָ֥ר הַ/צָּהֹ֖ב טָמֵ֥א הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/036.yaml
  text: And if the priest examines him[a], and behold, the scaly infection has spread in the skin, the priest need not look for the yellow hair; he is unclean.
translation:
  language: fr
  text: 'Si le prêtre l’examine et constate que l’affection squameuse[a] s’est étendue sur la peau, il n’a pas besoin de rechercher des poils jaunes : cette personne est impure.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne une affection squameuse touchant particulièrement la tête ou la barbe ; il est souvent traduit par « teigne », mais son identification médicale exacte reste incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ הַכֹּהֵן
  choice: Si le prêtre l’examine
  rationale: Dans ce contexte de diagnostic sacerdotal, ראה désigne un examen plutôt qu’un simple regard. Le contexte donne à la proposition une valeur conditionnelle naturelle en français.
- source_word: וְהִנֵּה
  choice: et constate que
  rationale: Cette tournure restitue naturellement en français la découverte signalée par הִנֵּה, sans conserver l’archaïsme « voici » dans une procédure d’examen.
- source_word: פָּשָׂה
  choice: s’est étendue
  rationale: Le verbe indique la progression de l’affection sur la peau.
- source_word: הַנֶּתֶק
  choice: la teigne
  rationale: Dans Lévitique 13, נתק désigne une affection particulière de la tête ou de la barbe, associée à une perte ou altération des cheveux et des poils. « Teigne » est le terme français traditionnel et accessible, sans prétendre établir un diagnostic médical moderne précis.
- source_word: בָּעוֹר
  choice: sur la peau
  rationale: « Sur la peau » est plus idiomatique en français que « dans la peau » pour décrire l’extension visible d’une affection.
- source_word: לֹא יְבַקֵּר הַכֹּהֵן
  choice: il n’a pas besoin de rechercher la présence de
  rationale: La négation indique qu’aucune vérification supplémentaire de ce signe diagnostique n’est nécessaire une fois l’extension constatée.
- source_word: לַשֵּׂעָר הַצָּהֹב
  choice: poil jaune
  rationale: Dans le contexte de la tête ou de la barbe, שֵׂעָר peut désigner cheveux ou poils. Le singulier collectif hébreu est conservé par « poil ».
- source_word: טָמֵא הוּא
  choice: cet homme est impur
  rationale: Le pronom renvoie à la personne examinée. « Impur » exprime son statut rituel selon la législation lévitique.
theological_decisions:
- issue: Portée de טָמֵא dans la loi de pureté
  choice: impur
  alternative: souillé
  rationale: Le terme indique ici un statut rituel et communautaire, non une culpabilité morale. « Impur » est précis et usuel en français biblique moderne.
- issue: Référent de הוּא
  choice: cet homme
  alternative: elle est impure
  rationale: Le contexte de l’examen sacerdotal et la construction au masculin indiquent que le verdict porte sur la personne atteinte, et non seulement sur l’affection.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le caractère procédural du texte légal tout en évitant les tournures archaïques. Le deux-points met nettement en relief le verdict sacerdotal.
