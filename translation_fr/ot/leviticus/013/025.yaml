  text: וְ/רָאָ֣ה אֹתָ֣/הּ הַ/כֹּהֵ֡ן וְ/הִנֵּ֣ה נֶהְפַּךְ֩ שֵׂעָ֨ר לָבָ֜ן בַּ/בַּהֶ֗רֶת וּ/מַרְאֶ֨/הָ֙ עָמֹ֣ק מִן הָ/ע֔וֹר צָרַ֣עַת הִ֔וא בַּ/מִּכְוָ֖ה פָּרָ֑חָה וְ/טִמֵּ֤א אֹת/וֹ֙ הַ/כֹּהֵ֔ן נֶ֥גַע צָרַ֖עַת הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/025.yaml
  text: And the priest shall examine it[a], and behold, the hair in the bright spot has turned white and its appearance is deeper than the skin, it is a skin disease that has broken out in the burn scar; and the priest shall pronounce him unclean. It is an infection of skin disease.
translation:
  language: fr
  text: 'Le prêtre l’examinera, et voici que les poils de la tache brillante sont devenus blancs et qu’elle paraît plus profonde que la peau : c’est une affection cutanée[a] qui s’est déclarée à l’endroit de la brûlure. Le prêtre le déclarera impur : c’est une atteinte liée à une affection cutanée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hébreu tsaraʿat, terme général désignant une affection cutanée; traditionnellement traduit par « lèpre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: examinera
  rationale: Dans ce contexte de diagnostic sacerdotal, le verbe désigne une inspection officielle, et non le simple fait de voir.
- source_word: בַּהֶרֶת
  choice: tache brillante
  rationale: Cette expression concrète rend la clarté visible de la lésion sans lui attribuer un diagnostic médical moderne.
- source_word: נֶהְפַּךְ שֵׂעָר לָבָן
  choice: les poils … sont devenus blancs
  rationale: Le passé composé restitue naturellement le changement d’état exprimé par le verbe hébreu.
- source_word: מַרְאֶהָ עָמֹק מִן־הָעוֹר
  choice: elle paraît plus profonde que la peau
  rationale: Cette formulation française naturelle conserve le caractère visuel du signe diagnostique.
- source_word: צָרַעַת
  choice: affection cutanée
  rationale: Le terme hébreu recouvre une catégorie plus large que la maladie de Hansen; ce choix évite l’identification médicale anachronique suggérée par « lèpre ».
- source_word: מִכְוָה
  choice: à l’endroit de la brûlure
  rationale: Le nom peut désigner la brûlure ou la zone qu’elle a laissée; la formulation française préserve cette portée sans imposer l’idée précise d’une cicatrice.
- source_word: פָּרָחָה
  choice: s’est déclarée
  rationale: Dans ce contexte cutané, le verbe décrit l’apparition ou l’éruption de l’affection.
- source_word: טִמֵּא אֹתוֹ
  choice: déclarera cet homme impur
  rationale: Le prêtre rend un verdict rituel autorisé; il ne cause pas lui-même l’impureté.
- source_word: נֶגַע צָרַעַת
  choice: une lésion d’affection cutanée
  rationale: « Lésion » exprime la marque ou atteinte visible désignée par נֶגַע, tandis que le complément maintient explicitement son rapport avec צָרַעַת.
theological_decisions:
- issue: Sens de צָרַעַת dans la législation sur la pureté
  choice: affection cutanée
  alternative: lèpre
  rationale: Le mot hébreu ne correspond pas exclusivement à la lèpre moderne; une désignation plus large respecte la catégorie rituelle et dermatologique du texte sans diagnostic anachronique.
- issue: Portée de טִמֵּא אֹתוֹ
  choice: déclarera cet homme impur
  alternative: rendra cet homme impur
  rationale: La formule exprime ici le verdict sacerdotal établi à partir des signes observés, sans affirmer que la déclaration produit causalement l’état d’impureté.
translation_notes:
  register: Français international moderne, clair et digne. La formulation juridique au futur convient au cadre législatif. La tournure conditionnelle rend naturellement la valeur diagnostique de וְהִנֵּה en français, sans conserver le calque pesant « et voici ».
