  text: וְ/רָאָה֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה פָּשְׂתָ֥ה הַ/מִּסְפַּ֖חַת בָּ/ע֑וֹר וְ/טִמְּא֥/וֹ הַ/כֹּהֵ֖ן צָרַ֥עַת הִֽוא׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/008.yaml
  text: And the priest shall examine him[a], and behold, if the scaly eruption has spread on the skin, the priest shall pronounce him unclean; it is leprosy.
translation:
  language: fr
  text: 'Le prêtre l’examinera et, si l’éruption squameuse s’est étendue sur la peau, il le déclarera impur : c’est une affection cutanée[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu tsaraat, traditionnellement traduit par « lèpre », désigne dans le Lévitique une catégorie d’affections cutanées plus large que la lèpre moderne.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: l’examinera
  rationale: Dans ce contexte de diagnostic sacerdotal, le verbe désigne une inspection officielle, et non le simple fait de voir.
- source_word: וְהִנֵּה
  choice: si
  rationale: La formule introduit ici le constat dont dépend la décision; « si » en exprime naturellement la valeur conditionnelle en français.
- source_word: פָּשְׂתָה
  choice: s’est étendue
  rationale: Le verbe indique la progression de l’affection sur la peau, critère diagnostique central dans ce passage.
- source_word: הַמִּסְפַּחַת
  choice: l’éruption squameuse
  rationale: Cette formulation désigne clairement une manifestation cutanée superficielle sans la réduire à une simple croûte.
- source_word: בָּעוֹר
  choice: sur la peau
  rationale: Rendu français naturel du lieu où l’éruption s’étend.
- source_word: וְטִמְּאוֹ
  choice: il le déclarera impur
  rationale: Le prêtre constate et prononce officiellement un statut rituel; il ne rend pas causalement la personne impure.
- source_word: צָרַעַת
  choice: une affection de type tsaraat
  rationale: Le terme hébreu couvre un ensemble d’affections et ne correspond pas exactement à la lèpre moderne; la translittération qualifiée préserve sa portée propre dans le Lévitique.
- source_word: הִוא
  choice: c’est
  rationale: La proposition identifie l’éruption constatée comme relevant de la tsaraat.
theological_decisions:
- issue: Sens de צָרַעַת dans la législation de pureté du Lévitique
  choice: une affection de type tsaraat
  alternative: la lèpre; une maladie de peau
  rationale: « Lèpre » risque d’identifier à tort le terme à la maladie de Hansen, tandis que « maladie de peau » peut paraître trop générale et purement médicale. La formulation retenue préserve la catégorie rituelle et diagnostique du texte, avec une note explicative.
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe juridique reste concise; « déclarera impur » conserve la fonction officielle du prêtre. L’interjection littérale « voici » n’est pas reproduite, sa fonction de constat conditionnel étant rendue par « si ».
