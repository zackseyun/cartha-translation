  text: And if a garment has in it an outbreak of leprosy[a], in a wool garment or in a linen garment,
translation:
  language: fr
  text: Si un vêtement présente une atteinte de lèpre[a], qu’il soit de laine ou de lin,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu tsaraat, traditionnellement traduit par « lèpre », désigne ici une catégorie rituelle plus large d’atteintes, y compris celles qui touchent des vêtements; il ne désigne donc pas précisément la maladie de Hansen moderne.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֶּגֶד
  choice: un vêtement
  rationale: בגד désigne un vêtement ou une pièce d’habillement. Malgré l’article hébreu, l’indéfini convient naturellement à l’énoncé casuistique générique en français.
- source_word: כִּי יִהְיֶה בוֹ
  choice: si … apparaît sur
  rationale: כִּי suivi de l’imparfait introduit ici un cas juridique. Avec un signe visible affectant un textile, « apparaît sur » rend naturellement la présence locative exprimée par בוֹ sans suggérer que l’atteinte se trouve seulement à l’intérieur du tissu.
- source_word: נֶגַע צָרָעַת
  choice: une atteinte de lèpre
  rationale: נגע désigne dans ce contexte une atteinte ou lésion observable, tandis que צרעת nomme une catégorie rituelle plus large que la maladie de Hansen. La formulation garde le terme traditionnel tout en évitant d’identifier précisément le phénomène textile à la lèpre moderne.
- source_word: בְּבֶגֶד צֶמֶר
  choice: sur un vêtement de laine
  rationale: La préposition ב est rendue de façon locative par « sur », idiomatique pour une atteinte visible affectant un vêtement; צמר désigne la laine.
- source_word: אוֹ בְּבֶגֶד פִּשְׁתִּים
  choice: ou sur un vêtement de lin
  rationale: La répétition de « sur un vêtement » conserve la structure explicite de l’hébreu. פשתים désigne ici le lin comme matière textile.
theological_decisions:
- issue: Portée de צָרָעַת appliqué à un vêtement
  choice: Conserver « lèpre » avec une note explicative
  alternative: moisissure; contamination; affection maligne
  rationale: Le phénomène ne correspond pas nécessairement à la maladie de Hansen et touche ici un textile. Toutefois, remplacer le terme par un diagnostic précis résoudrait indûment une catégorie hébraïque dont la nature exacte demeure incertaine.
translation_notes:
  register: Français moderne, clair et digne, avec une syntaxe casuistique naturelle. La répétition « sur un vêtement » suit la structure hébraïque et prépare la suite de la prescription.
