  text: וְ/רָאָ֥ה הַ/כֹּהֵ֖ן אֶת הַ/נָּ֑גַע וְ/הִסְגִּ֥יר אֶת הַ/נֶּ֖גַע שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/050.yaml
  text: And the priest shall examine the diseased area[b][a], and he shall isolate the diseased area for seven days.
translation:
  language: fr
  text: Le prêtre examinera la zone atteinte[a], puis il l’isolera[b] pendant sept jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’atteinte », « la tache » ou, selon la traduction traditionnelle, « la plaie ». Le terme hébreu désigne la marque ou la partie affectée que le prêtre examine, sans correspondre nécessairement à une catégorie médicale moderne précise.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « l’enfermera ». Il s’agit d’une mise à l’écart temporaire en vue de l’observer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: examinera
  rationale: Dans cette procédure sacerdotale, ראה ne désigne pas un simple regard, mais un examen officiel de la zone concernée.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Équivalent courant de כֹּהֵן; l’article défini hébreu est conservé.
- source_word: הַנָּגַע / הַנֶּגַע
  choice: la zone atteinte / la
  rationale: נגע désigne ici la marque ou la partie affectée soumise à l’examen, sans identifier nécessairement une maladie précise selon les catégories médicales modernes. Le pronom reprend naturellement le même référent en français.
- source_word: וְהִסְגִּיר
  choice: puis il la tiendra isolée
  rationale: Le hifil de סגר exprime la mise à l’écart ou l’enfermement temporaire en vue d’une nouvelle observation. « Tiendra isolée » est naturel et évite de suggérer trop précisément une quarantaine médicale moderne.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: Rendu temporel idiomatique et exact de la durée indiquée.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le futur simple restitue la valeur procédurale de la forme verbale hébraïque. « Puis » marque naturellement la succession des actes sans ajouter de contenu interprétatif important.
