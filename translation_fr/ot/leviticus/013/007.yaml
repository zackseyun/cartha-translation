  source_fidelity: La proposition rend bien l’intensif פָּשֹׂה תִפְשֶׂה, la localisation « sur la peau » et la nouvelle comparution devant le prêtre. Toutefois, « en vue d’être déclaré pur » interprète de façon plus étroite לְטָהֳרָתוֹ (« pour sa purification / sa purité rituelle »). Une formulation plus littérale préserve mieux la nuance procédurale sans exclure l’aspect déclaratif.
  naturalness: Le français est globalement naturel et de registre approprié. « Après s’être présenté au prêtre » est plus fluide que l’explicitation « après que l’homme s’est présenté », sans perte de l’antécédent. Le déplacement des appels de note auprès des expressions concernées améliore également la lisibilité.
  terminology: « Éruption squameuse » est un bon équivalent moderne et prudent pour מִסְפַּחַת. « Purification » est préférable dans le texte courant pour conserver le terme rituel sans imposer que l’action soit exclusivement une déclaration; la note peut préciser le cadre de la reconnaissance de pureté rituelle.
