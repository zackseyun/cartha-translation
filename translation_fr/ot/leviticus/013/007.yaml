  text: וְ/אִם פָּשֹׂ֨ה תִפְשֶׂ֤ה הַ/מִּסְפַּ֨חַת֙ בָּ/ע֔וֹר אַחֲרֵ֧י הֵרָאֹת֛/וֹ אֶל הַ/כֹּהֵ֖ן לְ/טָהֳרָת֑/וֹ וְ/נִרְאָ֥ה שֵׁנִ֖ית אֶל הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/007.yaml
  text: But if the scaly eruption indeed spreads on the skin after he has shown himself to the priest for his cleansing[c][b][a], then he shall appear before the priest a second time.
translation:
  language: fr
  text: Mais si l’éruption squameuse[a] s’étend bel et bien[b] sur la peau après s’être présenté au prêtre pour sa purification[c], il se présentera une seconde fois au prêtre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’éruption », « l’affection cutanée » ou, traditionnellement, « la dartre ». Le terme hébreu désigne une affection superficielle de la peau soumise à examen.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu renforce le verbe : « si l’éruption s’étend certainement » ou « s’étend bel et bien ».'
    reason: lexical_alternative
  - marker: c
    text: Littéralement « pour sa purification ». Dans cette procédure, l’examen sacerdotal concerne la reconnaissance de la pureté rituelle.
    reason: cultural_note
lexical_decisions:
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: s’étend bel et bien
  rationale: L’infinitif absolu suivi de l’imparfait intensifie le verbe. « Bel et bien » conserve cette insistance dans un français naturel.
- source_word: הַמִּסְפַּחַת
  choice: l’éruption squameuse
  rationale: Le terme désigne ici une affection cutanée superficielle soumise à l’examen du prêtre. Cette expression est plus précise que le traditionnel « dartre » et évite l’idée moderne d’une croûte de plaie.
- source_word: בָּעוֹר
  choice: sur la peau
  rationale: Cette formulation rend naturellement la localisation de l’affection sans ajouter de possessif absent de l’hébreu.
- source_word: אַחֲרֵי הֵרָאֹתוֹ
  choice: après que l’homme s’est présenté
  rationale: Dans ce contexte d’inspection, le nifal de ראה exprime le fait de se montrer ou de se présenter afin d’être examiné.
- source_word: לְטָהֳרָתוֹ
  choice: en vue d’être déclaré pur
  rationale: Dans Lévitique 13, il s’agit de l’examen conduisant à une décision sacerdotale de pureté rituelle, et non nécessairement d’un acte qui rend physiquement pur.
- source_word: וְנִרְאָה שֵׁנִית אֶל הַכֹּהֵן
  choice: il se présentera une deuxième fois au prêtre
  rationale: Le contexte juridique donne à la forme verbale une valeur prescriptive ou consécutive et exige un nouvel examen.
theological_decisions:
- issue: Sens de לְטָהֳרָתוֹ dans la procédure sacerdotale
  choice: en vue d’être déclaré pur
  alternative: pour sa purification / pour être purifié
  rationale: Le passage porte sur le constat et la déclaration de pureté rituelle par le prêtre. La traduction retenue évite de suggérer que le premier examen accomplit nécessairement une purification.
translation_notes:
  register: Français international moderne, digne et accessible. « L’homme » explicite sobrement le sujet masculin indiqué par les suffixes hébreux. L’ordre des notes suit leur point d’ancrage dans le texte.
