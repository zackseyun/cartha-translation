revisions:
- from: Mais si l’éruption squameuse s’étend bel et bien sur la peau après que l’homme s’est présenté au prêtre en vue d’être déclaré pur[a][b][c], il se présentera une deuxième fois au prêtre.
  to: Mais si l’éruption squameuse[a] s’étend bel et bien[b] sur la peau après s’être présenté au prêtre pour sa purification[c], il se présentera une seconde fois au prêtre.
  rationale: La révision conserve les choix lexicaux solides du projet, mais remplace l’interprétation restrictive « être déclaré pur » par « sa purification », plus proche de l’hébreu et compatible avec le contexte rituel. Les appels de note sont repositionnés à l’expression qu’ils expliquent.
