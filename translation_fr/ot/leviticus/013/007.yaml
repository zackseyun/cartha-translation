    rationale: « En vue d’être déclaré pur » met au premier plan une déclaration sacerdotale qui est contextuellement justifiée, mais le mot hébreu signifie plus largement « pour sa purification ». Le texte principal devrait conserver cette portée, la note pouvant expliciter la procédure.
  - severity: low
    issue: Appels de notes groupés après une seule expression
    rationale: Les notes a et b portent respectivement sur « l’éruption squameuse » et « s’étend bel et bien », mais sont actuellement toutes deux placées après « déclaré pur ». Les placer au point d’ancrage correspondant rend leur rattachement non ambigu.
