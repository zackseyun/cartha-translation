  text: וְ/אִ֣ם יִרְאֶ֣/נָּה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה אֵֽין בָּ/הּ֙ שֵׂעָ֣ר לָבָ֔ן וּ/שְׁפָלָ֥ה אֵינֶ֛/נָּה מִן הָ/ע֖וֹר וְ/הִ֣יא כֵהָ֑ה וְ/הִסְגִּיר֥/וֹ הַ/כֹּהֵ֖ן שִׁבְעַ֥ת יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/021.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in it, and it is not deeper than the skin, but it is dim, then the priest shall isolate him for seven days.
translation:
  language: fr
  text: Mais si le prêtre l’examine et constate qu’il n’y a pas de poil blanc sur la tache, qu’elle n’est pas en creux par rapport à la peau et qu’elle est pâle, le prêtre isolera[a] cet homme pendant sept jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le tiendra à l’écart ». Le verbe hébreu désigne la mise à l’isolement d’une personne afin de l’observer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit le cas conditionnel opposé au diagnostic précédent et rend naturellement la progression du texte.
- source_word: יִרְאֶנָּה
  choice: l’examine
  rationale: Le verbe signifie littéralement « voir », mais désigne ici l’inspection diagnostique effectuée par le prêtre.
- source_word: וְהִנֵּה
  choice: et constate
  rationale: Dans cette formule d’inspection, cette tournure française attire l’attention sur le résultat observé sans conserver un « voici » peu naturel.
- source_word: אֵין בָּהּ שֵׂעָר לָבָן
  choice: il n’y a pas de poil blanc sur la tache
  rationale: Rend clairement le critère observé; « la tache » explicite le référent féminin sans le confondre avec la personne.
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: elle n’est pas en creux par rapport à la peau
  rationale: Conserve l’image spatiale d’une lésion abaissée ou enfoncée, dans un français naturel.
- source_word: וְהִיא כֵהָה
  choice: elle est pâle
  rationale: כֵהָה décrit ici un aspect atténué, peu marqué ou terne; « pâle » convient à l’observation visuelle d’une tache cutanée.
- source_word: וְהִסְגִּירוֹ
  choice: le prêtre isolera cet homme
  rationale: Le verbe indique une mise à l’écart sous observation; le suffixe masculin renvoie à la personne, ce que « cet homme » rend sans ambiguïté.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: Rendu français standard de la durée prescrite.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et procédural. La syntaxe regroupe les trois constatations diagnostiques tout en conservant leur ordre. « Cet homme » explicite le changement de référent entre la tache féminine et la personne masculine.
