source:
  edition: WLC
  text: אָדָ֗ם כִּֽי יִהְיֶ֤ה בְ/עוֹר בְּשָׂר/וֹ֙ שְׂאֵ֤ת אֽוֹ סַפַּ֨חַת֙ א֣וֹ בַהֶ֔רֶת וְ/הָיָ֥ה בְ/עוֹר בְּשָׂר֖/וֹ לְ/נֶ֣גַע צָרָ֑עַת וְ/הוּבָא֙ אֶל אַהֲרֹ֣ן הַ/כֹּהֵ֔ן א֛וֹ אֶל אַחַ֥ד מִ/בָּנָ֖י/ו הַ/כֹּהֲנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/002.yaml
  text: When a man has on the skin of his body a swelling[a], or a scab, or a bright spot, and it becomes on the skin of his body an infection of skin disease, then he shall be brought to Aaron the priest, or to one of his sons the priests.
translation:
  language: fr
  text: Lorsqu’une personne aura sur la peau de son corps une tuméfaction, une croûte ou une tache claire, et que cela deviendra sur la peau de son corps une lésion d’affection cutanée[a], elle sera amenée au prêtre Aaron ou à l’un de ses fils, les prêtres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traduction traditionnelle : « une lésion de lèpre » ou « une affection lépreuse ». Le terme hébreu צָרָעַת (tsaraat) désigne plus largement une catégorie d’affections touchant notamment la peau et ne doit pas être automatiquement assimilé à la maladie de Hansen moderne.'
    reason: Signaler la traduction traditionnelle tout en évitant une identification médicale anachronique.
lexical_decisions:
- source_word: אָדָם
  choice: une personne
  rationale: Le nom introduit ici un cas juridique générique. « Une personne » exprime naturellement cette portée en français moderne sans limiter inutilement le cas aux hommes.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: sur la peau de son corps / sur sa peau
  rationale: La première occurrence conserve l’expression anatomique concrète; la seconde est légèrement allégée pour éviter une répétition pesante en français tout en gardant le même référent.
- source_word: שְׂאֵת
  choice: une tuméfaction
  rationale: Le terme désigne une zone surélevée de la peau. « Tuméfaction » rend précisément cette idée sans poser de diagnostic particulier.
- source_word: סַפַּחַת
  choice: une croûte
  rationale: Le référent dermatologique exact est incertain; « croûte » conserve le sens concret traditionnel d’une lésion superficielle sans précision médicale excessive.
- source_word: בַּהֶרֶת
  choice: une tache claire
  rationale: Le mot indique une marque brillante ou pâle. « Tache claire » reste large et naturel sans la définir nécessairement comme blanche.
- source_word: לְנֶגַע צָרָעַת
  choice: une lésion de maladie cutanée
  rationale: נֶגַע désigne une atteinte ou lésion, tandis que צָרָעַת recouvre une catégorie biblique d’affections qui ne correspond pas automatiquement à la maladie de Hansen. La formulation évite un diagnostic moderne trompeur.
- source_word: וְהוּבָא
  choice: elle sera amenée
  rationale: Le futur passif conserve la forme et la portée procédurale de l’instruction hébraïque.
- source_word: אַהֲרֹן הַכֹּהֵן
  choice: au prêtre Aaron
  rationale: Cette tournure française naturelle conserve le nom et la fonction d’Aaron.
- source_word: אַחַד מִבָּנָיו הַכֹּהֲנִים
  choice: à l’un de ses fils, les prêtres
  rationale: La formulation maintient à la fois le lien familial et l’apposition qui identifie les fils comme prêtres.
theological_decisions:
- issue: Traduction de צָרָעַת
  choice: maladie cutanée
  alternative: lèpre ; affection de type tsaraat
  rationale: Le terme hébreu désigne une catégorie biblique plus large que la lèpre moderne. Le traduire par « maladie cutanée » évite d’assimiler sans fondement cette affection à la maladie de Hansen, tandis que la note conserve la traduction traditionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la structure du cas juridique et le passif procédural, tout en allégeant une répétition anatomique à la seconde occurrence.
