  rationale: 'La révision améliore deux points de français sans modifier le sens : « deviendra » rend plus directement la fonction de וְהָיָה, et « lésion d’affection cutanée » exprime plus naturellement le rapport entre נֶגַע et צָרָעַת. La répétition de « sur la peau de son corps » reflète aussi les deux occurrences de l’expression hébraïque.'
