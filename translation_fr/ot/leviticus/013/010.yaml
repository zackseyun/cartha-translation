  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה שְׂאֵת לְבָנָה֙ בָּ/ע֔וֹר וְ/הִ֕יא הָפְכָ֖ה שֵׂעָ֣ר לָבָ֑ן וּ/מִֽחְיַ֛ת בָּשָׂ֥ר חַ֖י בַּ/שְׂאֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/010.yaml
  text: and the priest examines him[a], and behold, there is a white swelling in the skin, and it has turned the hair white, and there is raw flesh in the swelling[b],
translation:
  language: fr
  text: 'Le prêtre l’examine[a], et voici : il y a sur la peau une tuméfaction blanche ; elle a fait blanchir les poils, et il y a de la chair à vif dans la tuméfaction[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le prêtre voit » ; dans ce contexte, il procède à un examen de la lésion.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de la chair vivante » ; l’expression désigne du tissu vivant et exposé au milieu de la lésion.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: l’examine
  rationale: Dans ce contexte de diagnostic rituel, le verbe désigne une inspection attentive plutôt qu’un simple regard.
- source_word: וְהִנֵּה
  choice: s’il y a
  rationale: Dans la formulation française d’un cas juridique, cette tournure rend naturellement la constatation introduite par הִנֵּה, sans conserver un « voici » artificiel.
- source_word: שְׂאֵת
  choice: tuméfaction
  rationale: Le terme désigne ici une lésion cutanée surélevée. « Tuméfaction » est précis et reste compréhensible dans ce contexte médical.
- source_word: בָּעוֹר
  choice: sur la peau
  rationale: Le français décrit idiomatiquement une lésion visible comme étant « sur la peau », même si la préposition hébraïque peut être rendue littéralement par « dans ».
- source_word: וְהִיא הָפְכָה שֵׂעָר לָבָן
  choice: qu’elle a fait blanchir les poils
  rationale: Le pronom féminin renvoie à la tuméfaction; la formulation conserve cette relation grammaticale et le rôle diagnostique du changement de couleur.
- source_word: וּמִחְיַת בָּשָׂר חַי
  choice: de la chair à vif apparaît
  rationale: Cette expression française naturelle désigne le tissu vivant et exposé signalé par l’hébreu, sans l’étrangeté de « chair vivante ».
- source_word: בַּשְׂאֵת
  choice: dans la tuméfaction
  rationale: La préposition situe le tissu à vif à l’intérieur de la lésion et la répétition assure la cohérence terminologique.
