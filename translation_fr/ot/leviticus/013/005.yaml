  text: וְ/רָאָ֣/הוּ הַ/כֹּהֵן֮ בַּ/יּ֣וֹם הַ/שְּׁבִיעִי֒ וְ/הִנֵּ֤ה הַ/נֶּ֨גַע֙ עָמַ֣ד בְּ/עֵינָ֔י/ו לֹֽא פָשָׂ֥ה הַ/נֶּ֖גַע בָּ/ע֑וֹר וְ/הִסְגִּיר֧/וֹ הַ/כֹּהֵ֛ן שִׁבְעַ֥ת יָמִ֖ים שֵׁנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/005.yaml
  text: And the priest shall examine him on the seventh day[a], and behold, if the spot has remained unchanged in his sight and the spot has not spread in the skin[c][b], then the priest shall isolate him for seven days a second time.
translation:
  language: fr
  text: Le septième jour, le prêtre l’examinera. S’il constate que la lésion[a] lui paraît inchangée[b] et qu’elle ne s’est pas étendue sur la peau, il l’isolera[c] de nouveau pendant sept jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’atteinte » ou « la marque ». Le mot hébreu néga désigne ici la manifestation visible examinée par le prêtre, sans correspondre nécessairement à une maladie définie par la médecine moderne.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « s’est tenue à ses yeux », expression indiquant qu’elle semblait inchangée au prêtre.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou « le tiendra à l’écart »; plus littéralement : « l’enfermera ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: le prêtre l’examinera
  rationale: Dans cette procédure sacerdotale, ראה désigne une observation attentive en vue d’un constat; « examiner » rend mieux cette valeur que le simple « voir ».
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Le septième jour
  rationale: Formulation temporelle française naturelle, qui conserve le moment précis du nouvel examen.
- source_word: וְהִנֵּה
  choice: S’il constate que
  rationale: Dans cette prescription, וְהִנֵּה introduit le résultat observé. La tournure conditionnelle explicite naturellement en français le rapport entre le constat et la mesure qui suit, sans modifier le fond.
- source_word: הַנֶּגַע
  choice: la lésion
  rationale: Le terme נגע désigne ici la manifestation visible soumise à l’examen sacerdotal. « Lésion » est concret sans identifier abusivement une maladie moderne précise.
- source_word: עָמַד בְּעֵינָיו
  choice: lui paraît inchangée
  rationale: Cette expression signifie littéralement que la lésion « s’est tenue à ses yeux »; elle indique qu’aux yeux du prêtre son aspect n’a pas changé.
- source_word: לֹא פָשָׂה הַנֶּגַע בָּעוֹר
  choice: elle ne s’est pas étendue sur la peau
  rationale: פשׂה exprime la propagation ou l’extension de la lésion. « Sur la peau » est idiomatique en français dans ce contexte d’observation cutanée.
- source_word: וְהִסְגִּירוֹ
  choice: il l’isolera
  rationale: Le verbe signifie fermer, enfermer ou tenir à l’écart. « Isoler » exprime clairement la séparation prescrite sans lui donner la précision médicale moderne de « mettre en quarantaine ».
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: de nouveau pendant sept jours
  rationale: Cette formulation indique clairement qu’une seconde période complète de sept jours est prescrite.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation suit le caractère procédural du passage tout en évitant un vocabulaire médical anachronique. Les reprises pronominales allègent la phrase sans obscurcir que la lésion est le sujet de l’extension et la personne celui de l’isolement.
