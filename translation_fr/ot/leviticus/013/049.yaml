source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/נֶּ֜גַע יְרַקְרַ֣ק א֣וֹ אֲדַמְדָּ֗ם בַּ/בֶּגֶד֩ א֨וֹ בָ/ע֜וֹר אֽוֹ בַ/שְּׁתִ֤י אוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר נֶ֥גַע צָרַ֖עַת ה֑וּא וְ/הָרְאָ֖ה אֶת הַ/כֹּהֵֽן׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/049.yaml
  text: And if the spot is greenish or reddish in the garment[a], or in the leather, or in the warp or in the woof, or in any article of leather, it is a diseased spot of skin disease[b], and it shall be shown to the priest.
translation:
  language: fr
  text: Si la tache est verdâtre ou rougeâtre sur le vêtement, sur le cuir, sur la chaîne ou la trame, ou sur tout objet en cuir, c’est une atteinte de tsaraat[a] ; elle devra être montrée au prêtre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu tsaraat désigne dans le Lévitique une catégorie d’atteintes constatées sur la peau, les vêtements ou le cuir. Traditionnellement traduit par « lèpre », il ne correspond pas précisément à la maladie moderne appelée lèpre.
    reason: Précision sur un terme rituel et physique sans équivalent français exact.
lexical_decisions:
- source_word: נֶגַע
  choice: tache / atteinte
  rationale: Le mot désigne ici une zone visible anormale sur un textile ou du cuir. « Tache » convient à l’observation matérielle, tandis que « atteinte » exprime sa qualification dans la catégorie rituelle.
- source_word: יְרַקְרַק
  choice: verdâtre
  rationale: La forme intensive ou redoublée indique une teinte tirant sur le vert sans imposer une nuance plus précise.
- source_word: אֲדַמְדָּם
  choice: rougeâtre
  rationale: La forme redoublée évoque une coloration tirant sur le rouge plutôt qu’un rouge pur.
- source_word: בֶּגֶד
  choice: vêtement
  rationale: Ce terme courant correspond au sens contextuel de pièce textile susceptible d’être portée.
- source_word: עוֹר
  choice: cuir
  rationale: Dans cette liste d’objets, il s’agit de peau animale employée comme matériau plutôt que de peau vivante.
- source_word: שְׁתִי
  choice: chaîne
  rationale: Terme textile français désignant les fils longitudinaux d’un tissu.
- source_word: עֵרֶב
  choice: trame
  rationale: Terme textile français désignant les fils transversaux entrecroisés avec la chaîne.
- source_word: כְּלִי עוֹר
  choice: objet en cuir
  rationale: Rendu naturel et assez large pour tout ustensile ou article fabriqué en cuir.
- source_word: נֶגַע צָרַעַת
  choice: une atteinte de tsaraat
  rationale: La translittération conserve la catégorie rituelle propre au Lévitique, laquelle peut toucher des personnes, des textiles ou du cuir, sans l’assimiler à tort à la lèpre moderne ni à une maladie exclusivement cutanée.
- source_word: וְהָרְאָה אֶת־הַכֹּהֵן
  choice: elle devra être montrée au prêtre
  rationale: Le passif français respecte la forme hébraïque, qui laisse implicite la personne chargée de présenter la tache.
theological_decisions:
- issue: Traduction de צָרַעַת dans la législation sacerdotale
  choice: tsaraat
  alternative: lèpre ; maladie de peau ; moisissure
  rationale: Dans Lévitique 13, cette catégorie peut concerner la peau humaine, les textiles et le cuir. « Lèpre » suggérerait à tort la maladie de Hansen, « maladie de peau » ne convient pas aux matériaux, et « moisissure » préciserait une cause que le texte ne nomme pas. La translittération, expliquée en note, préserve l’étendue et la tension du terme source.
translation_notes:
  register: Français international actuel, clair et digne. Les termes techniques « chaîne » et « trame » sont usuels en tissage. La répétition de « sur » clarifie la portée de chaque élément de l’énumération. Le futur passif à valeur prescriptive convient au registre législatif.
