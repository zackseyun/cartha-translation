id: LEV.13.22
reference: Leviticus 13:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם פָּשֹׂ֥ה תִפְשֶׂ֖ה בָּ/ע֑וֹר וְ/טִמֵּ֧א הַ/כֹּהֵ֛ן אֹת֖/וֹ נֶ֥גַע הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/022.yaml
  text: But if it does spread in the skin[a], the priest shall pronounce him unclean[b]; it is an infection.
translation:
  language: fr
  text: 'Mais si elle s’étend effectivement sur la peau, le prêtre le déclarera impur : c’est une affection[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une plaie », « une lésion » ou « une marque ». Le terme hébreu est large et ne correspond pas exactement à une catégorie médicale moderne.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit le cas contraire à celui du verset précédent ; « mais si » restitue naturellement la valeur contrastive de la conjonction.
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: elle s’étend effectivement
  rationale: L’infinitif absolu suivi de l’imparfait renforce le verbe. « Effectivement » exprime cette insistance sans suggérer nécessairement une propagation continue.
- source_word: בָּעוֹר
  choice: sur la peau
  rationale: עוֹר désigne la peau ; en français, une lésion ou une marque s’étend naturellement « sur la peau ».
- source_word: וְטִמֵּא הַכֹּהֵן אֹתוֹ
  choice: le prêtre le déclarera impur
  rationale: Dans cette procédure sacerdotale, le piel de טמא indique une déclaration officielle du statut d’impureté, et non le fait de rendre la personne impure.
- source_word: נֶגַע
  choice: une atteinte
  rationale: Le terme désigne largement une affection ou une zone atteinte, sans correspondre exactement à une catégorie médicale moderne. « Atteinte » conserve cette généralité.
- source_word: הִוא
  choice: c’est
  rationale: La proposition nominale identifie le phénomène décrit comme une atteinte ; « c’est » est idiomatique en français.
theological_decisions:
- issue: Nature de la déclaration sacerdotale d’impureté
  choice: Le prêtre déclare officiellement la personne impure.
  alternative: Le prêtre la rend impure.
  rationale: Le contexte juridique et sacerdotal présente une constatation autorisée du statut rituel, non une production causale de l’impureté par la parole du prêtre.
translation_notes:
  register: Français international moderne, clair et digne. Le pronom féminin « elle » reprend la manifestation cutanée décrite dans le contexte précédent. Le futur simple convient à la formulation prescriptive de la loi.
