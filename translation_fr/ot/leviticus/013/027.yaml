  text: וְ/רָאָ֥/הוּ הַ/כֹּהֵ֖ן בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֑י אִם פָּשֹׂ֤ה תִפְשֶׂה֙ בָּ/ע֔וֹר וְ/טִמֵּ֤א הַ/כֹּהֵן֙ אֹת֔/וֹ נֶ֥גַע צָרַ֖עַת הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/027.yaml
  text: And the priest shall examine him on the seventh day. If it has indeed spread in the skin, the priest shall pronounce him unclean; it is an infection of skin disease.
translation:
  language: fr
  text: 'Le prêtre l’examinera le septième jour. Si la lésion s’est effectivement étendue sur la peau, le prêtre le déclarera impur : c’est une affection de tsaraath[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Terme hébreu traditionnellement rendu par « lèpre ». Il désigne dans les lois de pureté une catégorie d’affections qui ne correspond pas nécessairement à la lèpre moderne (maladie de Hansen).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: l’examinera
  rationale: Dans ce contexte de diagnostic sacerdotal, ראה désigne une inspection et non le simple fait de voir.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: le septième jour
  rationale: Rendu temporel direct et idiomatique en français moderne.
- source_word: אִם פָּשֹׂה תִפְשֶׂה
  choice: si la lésion s’est effectivement étendue
  rationale: « effectivement » restitue l’intensification produite par l’infinitif absolu suivi du verbe conjugué; le sujet implicite est explicité par « la lésion ».
- source_word: בָּעוֹר
  choice: sur la peau
  rationale: En français courant, une lésion cutanée s’étend naturellement « sur la peau »; עוֹר signifie peau.
- source_word: וְטִמֵּא ... אֹתוֹ
  choice: le prêtre le déclarera impur
  rationale: Le prêtre rend un verdict rituel; il ne cause pas lui-même l’impureté.
- source_word: נֶגַע
  choice: affection
  rationale: Le terme désigne ici une atteinte ou lésion observable; « affection » évite la précision microbiologique indue d’« infection ».
- source_word: צָרַעַת
  choice: tsaraath
  rationale: La translittération préserve la catégorie hébraïque, qui ne correspond pas exactement à une maladie moderne unique; une note l’explique.
- source_word: הִוא
  choice: c’est
  rationale: Le pronom féminin identifie la condition constatée; « c’est » est naturel en français.
theological_decisions:
- issue: Traduction de צָרַעַת dans la législation sur la pureté rituelle
  choice: tsaraath
  alternative: lèpre; maladie de peau
  rationale: « Lèpre » risque d’identifier à tort la condition à la maladie de Hansen, tandis que « maladie de peau » est trop étroit puisque le même terme s’applique ailleurs à des vêtements et à des maisons. La translittération conserve la catégorie ancienne et la note en précise la portée.
- issue: Fonction du verdict sacerdotal
  choice: déclarera impur
  alternative: rendra impur
  rationale: La formulation exprime une constatation officielle relevant de la pureté rituelle, sans attribuer au prêtre la production causale de l’état d’impureté.
translation_notes:
  register: Français international moderne, clair et digne. Le futur conserve la formulation prescriptive. « Affection de type tsaraath » évite l’expression maladroite « infection de maladie de peau » et ne donne pas au terme hébreu une précision médicale anachronique.
