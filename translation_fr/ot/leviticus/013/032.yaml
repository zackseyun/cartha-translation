  text: וְ/רָאָ֨ה הַ/כֹּהֵ֣ן אֶת הַ/נֶּגַע֮ בַּ/יּ֣וֹם הַ/שְּׁבִיעִי֒ וְ/הִנֵּה֙ לֹא פָשָׂ֣ה הַ/נֶּ֔תֶק וְ/לֹא הָ֥יָה ב֖/וֹ שֵׂעָ֣ר צָהֹ֑ב וּ/מַרְאֵ֣ה הַ/נֶּ֔תֶק אֵ֥ין עָמֹ֖ק מִן הָ/עֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/032.yaml
  text: And the priest shall examine the diseased area on the seventh day[a], and behold, if the scaly infection has not spread, and there is no yellow hair in it, and the appearance of the scaly infection is not deeper than the skin,
translation:
  language: fr
  text: Le septième jour, le prêtre examinera la zone atteinte. Si l’affection squameuse[a] ne s’est pas étendue, s’il n’y a pas de poil jaune à l’intérieur et si elle ne paraît pas plus profonde que la peau,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne une affection particulière, généralement squameuse, du cuir chevelu ou de la barbe; on l’a aussi traduit par « teigne » ou « dartre » selon les époques.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: examinera
  rationale: Dans ce contexte de diagnostic rituel, le verbe désigne un examen attentif plutôt qu’un simple regard.
- source_word: הַנֶּגַע
  choice: la zone atteinte
  rationale: Cette expression rend le terme général désignant la partie affectée sans lui imposer un diagnostic médical moderne.
- source_word: וְהִנֵּה
  choice: Si
  rationale: Dans l’enchaînement juridique, le marqueur introduit les constatations dont dépend la suite de la procédure; une formulation conditionnelle est naturelle en français moderne.
- source_word: הַנֶּתֶק
  choice: l’affection squameuse
  rationale: Le terme désigne ici une affection particulière du cuir chevelu ou de la barbe. Cette traduction reste descriptive sans l’assimiler à une maladie moderne précise.
- source_word: לֹא פָשָׂה
  choice: ne s’est pas étendue
  rationale: Le verbe indique que l’affection ne s’est pas propagée sur la peau.
- source_word: שֵׂעָר צָהֹב
  choice: poil jaune
  rationale: Dans une affection du cuir chevelu ou de la barbe, « poil » couvre naturellement le cheveu et le poil de barbe tout en conservant la couleur diagnostique.
- source_word: אֵין עָמֹק מִן הָעוֹר
  choice: ne paraît pas plus profonde que la peau
  rationale: L’ajout de « paraît » exprime qu’il s’agit de l’apparence observée, conformément à מַרְאֵה, sans affirmer une profondeur anatomique mesurée.
