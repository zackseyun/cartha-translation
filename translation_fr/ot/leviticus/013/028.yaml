base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/028.yaml
  text: But if the bright spot remains in its place and has not spread in the skin[a], and it is faded, it is the swelling from the burn, and the priest shall pronounce him clean, for it is the scar of the burn.
translation:
  language: fr
  text: Mais si la tache brillante reste au même endroit[a], sans s’étendre sur la peau, et qu’elle est moins brillante, c’est une enflure due à la brûlure. Le prêtre le déclarera pur, car c’est la cicatrice de la brûlure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la tache brillante se tient sous elle ». Dans ce contexte, l’expression indique qu’elle demeure stationnaire au lieu de s’étendre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְתֶּיהָ תַעֲמֹד
  choice: reste au même endroit
  rationale: L’expression signifie ici que la tache demeure stationnaire plutôt que de s’étendre. Cette formulation naturelle conserve le sens diagnostique; la lecture plus littérale est signalée en note.
- source_word: הַבַּהֶרֶת
  choice: la tache brillante
  rationale: Le terme désigne une décoloration claire ou brillante visible lors de l’examen de la peau.
- source_word: לֹא פָשְׂתָה בָעוֹר
  choice: sans s’étendre sur la peau
  rationale: Le verbe exprime la propagation d’une lésion; en français médical courant, une lésion s’étend sur la peau.
- source_word: כֵהָה
  choice: elle pâlit
  rationale: L’adjectif indique que la tache perd de son éclat ou de son intensité. La tournure verbale est naturelle en français.
- source_word: שְׂאֵת הַמִּכְוָה
  choice: une boursouflure due à la brûlure
  rationale: שְׂאֵת désigne une élévation ou enflure de la peau; «boursouflure» rend clairement cet aspect visible, tandis que «due à» exprime le rapport avec la brûlure.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: Le prêtre le déclarera pur
  rationale: Dans ce contexte d’examen sacerdotal, le verbe indique un verdict de pureté et non une action qui rend physiquement pur.
- source_word: צָרֶבֶת הַמִּכְוָה
  choice: la cicatrice de la brûlure
  rationale: צָרֶבֶת désigne la marque ou cicatrice laissée par la brûlure; «cicatrice» est précis et courant.
theological_decisions:
- issue: Nature de la pureté prononcée
  choice: «le déclarera pur»
  alternative: «le purifiera»
  rationale: Le contexte législatif décrit le constat et le verdict du prêtre. La traduction évite de suggérer qu’il guérit ou transforme lui-même l’état de la personne.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire reste concret et accessible, avec une formulation diagnostique naturelle. Le marqueur [a] figure dans le texte principal.
