review_pass:
  verdict: revise
  source_fidelity: 'Le sens principal est bien rendu : la tache ne se propage pas, son aspect est atténué, elle est liée à la brûlure, et le prêtre prononce un verdict de pureté. Toutefois, « qu’elle pâlit » peut suggérer un changement en cours, alors que כֵהָה décrit son état observé (« elle est pâle / moins brillante »).'
  naturalness: Le français est clair et d’un registre approprié. « Enflure » est plus neutre et plus usuel que « boursouflure » dans cette description diagnostique. La note peut mieux présenter le littéral sans donner l’impression que « reste sous elle » est une formulation française autonome.
  terminology: « Tache brillante », « peau », « brûlure », « le déclarera pur » et « cicatrice » conviennent. « Le déclarera pur » préserve correctement la fonction déclarative du verbe sacerdotal.
  issues:
  - severity: low
    issue: Valeur stative de כֵהָה
    rationale: « Elle pâlit » peut se comprendre comme un processus (« elle est en train de pâlir »). L’hébreu qualifie la tache telle qu’elle apparaît lors de l’examen. « Elle est moins brillante » rend cet état avec naturel et sans surinterprétation.
  - severity: low
    issue: Choix de « boursouflure »
    rationale: Le terme français peut être expressif ou imprécis. « Enflure » rend plus sobrement שְׂאֵת, une élévation ou un gonflement cutané.
  - severity: low
    issue: Formulation de la note littérale
    rationale: La note actuelle isole « reste sous elle », ce qui est difficilement intelligible en français. Il est préférable d’indiquer le sujet dans le littéral, puis d’expliquer l’interprétation contextuelle.
  revised_text: Mais si la tache brillante reste au même endroit[a], sans s’étendre sur la peau, et qu’elle est moins brillante, c’est une enflure due à la brûlure. Le prêtre le déclarera pur, car c’est la cicatrice de la brûlure.
