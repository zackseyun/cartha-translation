revisions:
- from: Mais si la tache brillante reste au même endroit[a], sans s’étendre sur la peau, et qu’elle pâlit, c’est une boursouflure due à la brûlure. Le prêtre le déclarera pur, car c’est la cicatrice de la brûlure.
  to: Mais si la tache brillante reste au même endroit[a], sans s’étendre sur la peau, et qu’elle est moins brillante, c’est une enflure due à la brûlure. Le prêtre le déclarera pur, car c’est la cicatrice de la brûlure.
  rationale: La révision maintient l’analyse contextuelle de l’expression « se tenir sous elle » et conserve le verdict sacerdotal de pureté. Elle remplace une formulation potentiellement dynamique par une description stative et adopte un terme cutané plus neutre pour l’élévation liée à la brûlure.
