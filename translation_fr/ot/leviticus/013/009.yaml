id: LEV.13.9
reference: Leviticus 13:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: נֶ֣גַע צָרַ֔עַת כִּ֥י תִהְיֶ֖ה בְּ/אָדָ֑ם וְ/הוּבָ֖א אֶל הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/009.yaml
  text: When an infection of leprosy is in a person[a], then he shall be brought to the priest.
translation:
  language: fr
  text: Lorsqu’une personne présente une affection cutanée[a], elle sera amenée au prêtre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu צָרַעַת est traditionnellement traduit par « lèpre », mais il désigne probablement diverses affections de la peau plutôt que précisément la lèpre au sens médical moderne.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע צָרַעַת
  choice: affection cutanée
  rationale: Dans le contexte d’une personne examinée en Lévitique 13, l’expression désigne une atteinte visible de la peau. « Affection cutanée » est naturel en français moderne et évite d’identifier à tort צָרַעַת à la seule maladie de Hansen.
- source_word: כִּי תִהְיֶה בְּאָדָם
  choice: Lorsqu’une personne présente
  rationale: כִּי introduit ici un cas de figure juridique. La restructuration idiomatique avec « présente » exprime qu’une affection se trouve chez une personne sans suggérer qu’elle vient nécessairement d’apparaître.
- source_word: וְהוּבָא
  choice: elle sera amenée
  rationale: Le passif hébreu indique que la personne doit être amenée dans la suite de la procédure. Le futur français conserve la formulation prescriptive sans préciser qui l’amène.
- source_word: אֶל הַכֹּהֵן
  choice: au prêtre
  rationale: L’article défini hébreu désigne le prêtre chargé de l’examen dans cette procédure.
theological_decisions:
- issue: Portée de צָרַעַת
  choice: affection cutanée, avec note
  alternative: lèpre
  rationale: « Lèpre » est la traduction traditionnelle, mais elle risque une identification médicale trop étroite avec la maladie de Hansen. Dans ce contexte humain, « affection cutanée » transmet la fonction dermatologique du terme tout en signalant en note son incertitude historique.
- issue: Valeur générique de אָדָם
  choice: personne
  alternative: homme
  rationale: אָדָם désigne ici tout être humain susceptible d’être examiné, sans restriction explicite au sexe masculin. « Personne » rend naturellement cette portée générique en français; le féminin de « elle » est un simple accord grammatical.
translation_notes:
  register: Français international moderne, clair et digne. La phrase juridique hébraïque est légèrement restructurée pour être naturelle en français, tout en conservant la condition, le passif procédural et le prêtre défini.
