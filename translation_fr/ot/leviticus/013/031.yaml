  to: Si le prêtre examine la lésion due à une affection squameuse[a], et qu’elle ne paraît pas plus profonde que la peau et ne présente pas de poil noir, le prêtre isolera cette lésion pendant sept jours.
  rationale: La révision évite d’identifier avec trop de certitude נֶתֶק à la teigne au sens médical moderne, tout en maintenant une formulation française claire et descriptive. Elle conserve tous les éléments diagnostiques et la répétition fonctionnelle du prêtre dans la décision d’isolement.
