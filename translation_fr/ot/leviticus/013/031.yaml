  verdict: revise
  source_fidelity: Le projet rend correctement la structure conditionnelle, l’examen sacerdotal, le critère visuel (« ne paraît pas plus profonde que la peau »), l’absence de poil noir et l’isolement de sept jours. Toutefois, « teigne » désigne aujourd’hui une affection fongique précise et risque donc de surdéterminer le terme hébreu נֶתֶק, dont l’identification médicale reste incertaine.
  naturalness: La phrase est globalement naturelle, mais « sans qu’il y ait de poil noir » laisse le lieu de l’absence moins explicite que l’hébreu (« en elle »). Une formulation où la lésion « ne présente pas de poil noir » est plus fluide et plus précise.
  terminology: « Lésion » convient pour נֶגַע. « Affection squameuse », accompagnée d’une note signalant l’incertitude et les équivalents traditionnels, est plus neutre que « teigne » pour נֶתֶק. « Isolera » rend bien le placement temporaire à l’écart, sans imposer une terminologie médicale moderne trop spécifique.
