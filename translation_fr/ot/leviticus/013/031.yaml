  text: וְ/כִֽי יִרְאֶ֨ה הַ/כֹּהֵ֜ן אֶת נֶ֣גַע הַ/נֶּ֗תֶק וְ/הִנֵּ֤ה אֵין מַרְאֵ֨/הוּ֙ עָמֹ֣ק מִן הָ/ע֔וֹר וְ/שֵׂעָ֥ר שָׁחֹ֖ר אֵ֣ין בּ֑/וֹ וְ/הִסְגִּ֧יר הַ/כֹּהֵ֛ן אֶת נֶ֥גַע הַ/נֶּ֖תֶק שִׁבְעַ֥ת יָמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/031.yaml
  text: And if the priest examines the diseased area of the scaly outbreak[a], and indeed its appearance is not deeper than the skin and there is no black hair in it, then the priest shall isolate the diseased area of the scaly outbreak for seven days.
translation:
  language: fr
  text: Si le prêtre examine la lésion due à une affection squameuse[a], et qu’elle ne paraît pas plus profonde que la peau et ne présente pas de poil noir, le prêtre isolera cette lésion pendant sept jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu désigne une affection particulière, touchant notamment le cuir chevelu ou la barbe et souvent associée à une perte de poils; son identification médicale exacte est incertaine. On le traduit aussi par « teigne », « dartre » ou « affection squameuse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי יִרְאֶה
  choice: Si le prêtre examine
  rationale: Dans cette formulation de cas juridique, וְכִי introduit la condition, tandis que ראה désigne ici l’inspection effectuée par le prêtre.
- source_word: נֶגַע
  choice: lésion
  rationale: Le mot désigne une zone corporelle visible et atteinte. « Lésion » est précis, actuel et suffisamment large dans ce contexte d’examen.
- source_word: נֶתֶק
  choice: teigne
  rationale: Le terme désigne dans ce chapitre une affection particulière de la tête ou de la barbe, associée notamment à la perte de poils. « Teigne » est le terme traditionnel français le plus concis, mais son identification médicale exacte demeure incertaine, d’où la note.
- source_word: וְהִנֵּה
  choice: et constate que
  rationale: La formule attire l’attention sur le résultat de l’examen; en français juridique et diagnostique, « constate que » rend naturellement cette fonction.
- source_word: אֵין מַרְאֵהוּ עָמֹק מִן־הָעוֹר
  choice: elle ne paraît pas plus profonde que la peau
  rationale: Cette traduction conserve l’idée d’apparence exprimée par מַרְאֵהוּ et la comparaison littérale, sans transformer l’observation visuelle en diagnostic certain.
- source_word: שֵׂעָר שָׁחֹר
  choice: poil noir
  rationale: Le singulier collectif hébreu désigne la pilosité dans la zone examinée; « poil noir » maintient exactement le critère de couleur.
- source_word: וְהִסְגִּיר
  choice: il isolera
  rationale: Dans ces prescriptions, le verbe indique une mise à l’écart temporaire en vue d’une nouvelle observation. « Isolera » est clair et évite les connotations modernes plus étroites de « mise en quarantaine ».
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: Formulation temporelle naturelle en français avec le verbe « isoler ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe de cas juridique est allégée sans perdre la condition ni les critères visuels. « Paraît » préserve la distinction entre l’apparence observée et la réalité de la lésion.
