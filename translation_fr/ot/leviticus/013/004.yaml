base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/004.yaml
  text: But if the bright spot is white in the skin of his flesh[a], and its appearance is not deeper than the skin, and its hair has not turned white[c][b], then the priest shall isolate the affected area for seven days.
translation:
  language: fr
  text: Mais si la tache claire est blanche dans la peau de son corps[a], qu’elle ne paraît pas plus profonde que la peau et que les poils qui s’y trouvent ne sont pas devenus blancs, le prêtre isolera la lésion[b] pendant sept jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « la tache brillante » ou « la plaque claire » : le terme hébreu désigne ici une marque cutanée claire ou brillante.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu désigne l’atteinte ou la lésion examinée par le prêtre. L’isolement est temporaire et permet son observation.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהֶרֶת
  choice: tache claire
  rationale: Le terme désigne ici une marque cutanée visible caractérisée par sa clarté ou son éclat. « Tache claire » est naturel en français et la distingue de l’enflure mentionnée au verset précédent.
- source_word: לְבָנָה
  choice: blanche
  rationale: L’adjectif indique simplement la couleur de la tache.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: sur la peau de son corps
  rationale: En contexte anatomique, בשר désigne le corps. Cette formulation française naturelle préserve la référence explicite à la peau sans employer l’expression ambiguë « peau de sa chair ».
- source_word: וְעָמֹק אֵין מַרְאֶהָ מִן הָעוֹר
  choice: elle ne paraît pas plus profonde que la peau
  rationale: La tournure conserve le caractère visuel de מראה et le critère diagnostique d’une profondeur apparente par rapport à la peau.
- source_word: וּשְׂעָרָהּ לֹא הָפַךְ לָבָן
  choice: les poils qui s’y trouvent ne sont pas devenus blancs
  rationale: Le singulier collectif hébreu peut désigner la pilosité de la zone. Le pluriel est idiomatique en français, et « devenus blancs » exprime clairement le changement d’état.
- source_word: וְהִסְגִּיר
  choice: isolera
  rationale: Le verbe indique une mise à l’écart temporaire en vue d’une nouvelle observation. « Isoler » est clair, actuel et moins médicalement chargé que « mettre en quarantaine ».
- source_word: אֶת הַנֶּגַע
  choice: la zone atteinte
  rationale: נגע peut désigner l’atteinte ou la lésion examinée. « Zone atteinte » évite de diagnostiquer prématurément une maladie et rend concrètement l’objet de l’inspection sacerdotale.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: Cette expression rend naturellement en français la durée prescrite.
