  text: וְ/אִם פָּר֨וֹחַ תִּפְרַ֤ח הַ/צָּרַ֨עַת֙ בָּ/ע֔וֹר וְ/כִסְּתָ֣ה הַ/צָּרַ֗עַת אֵ֚ת כָּל ע֣וֹר הַ/נֶּ֔גַע מֵ/רֹאשׁ֖/וֹ וְ/עַד רַגְלָ֑י/ו לְ/כָל מַרְאֵ֖ה עֵינֵ֥י הַ/כֹּהֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/012.yaml
  text: And if the skin disease breaks out all over the skin[a], and the skin disease covers all the skin of the affected person from his head to his feet, as far as the priest can see[b],
translation:
  language: fr
  text: Mais si l’affection cutanée s’étend sur toute la peau[a] et couvre toute la peau de la personne atteinte, de la tête aux pieds, sur toute la surface visible au prêtre[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu tsaraat désigne dans le Lévitique diverses affections entraînant une impureté rituelle; il ne faut pas l’identifier trop étroitement à la lèpre moderne (maladie de Hansen).
    reason: cultural_note
  - marker: b
    text: 'Plus littéralement : « toute la peau de l’affection ». L’expression hébraïque désigne ici la peau de la personne touchée par l’affection.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרוֹחַ תִּפְרַח
  choice: s’étend sur toute
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’idée de propagation. En français, « s’étend sur toute » exprime naturellement l’extension généralisée dans ce contexte.
- source_word: הַצָּרַעַת
  choice: l’affection cutanée
  rationale: Le terme hébreu désigne diverses affections entraînant une impureté rituelle et ne correspond pas précisément à la maladie de Hansen. « Affection cutanée » reste claire sans imposer un diagnostic moderne.
- source_word: בָּעוֹר
  choice: sur toute la peau
  rationale: La préposition décrit ici la surface corporelle touchée; « sur toute la peau » convient au contexte de propagation généralisée.
- source_word: וְכִסְּתָה
  choice: couvre
  rationale: Dans cette proposition conditionnelle, le parfait avec waw se rend naturellement au présent et indique l’étendue de l’affection.
- source_word: אֵת כָּל עוֹר הַנֶּגַע
  choice: toute la peau de la personne atteinte
  rationale: Littéralement, « toute la peau de l’affection ». La formulation retenue explicite naturellement que la peau de la personne est touchée, tandis qu’une note conserve l’expression plus formelle.
- source_word: מֵרֹאשׁוֹ וְעַד רַגְלָיו
  choice: de la tête aux pieds
  rationale: Cette tournure française naturelle conserve le mérisme hébreu exprimant la totalité du corps.
- source_word: לְכָל מַרְאֵה עֵינֵי הַכֹּהֵן
  choice: partout où le prêtre peut voir
  rationale: Cette formulation idiomatique rend l’étendue entière qui est visible aux yeux du prêtre lors de son examen.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase demeure ouverte, conformément à la syntaxe conditionnelle qui se poursuit au verset suivant. « Affection cutanée » évite l’anachronisme médical de « lèpre »; « personne atteinte » restitue le référent sans lourdeur.
