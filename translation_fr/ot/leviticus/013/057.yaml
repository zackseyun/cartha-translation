source:
  edition: WLC
  text: וְ/אִם תֵּרָאֶ֨ה ע֜וֹד בַּ֠/בֶּגֶד אֽוֹ בַ/שְּׁתִ֤י אֽוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר פֹּרַ֖חַת הִ֑וא בָּ/אֵ֣שׁ תִּשְׂרְפֶ֔/נּוּ אֵ֥ת אֲשֶׁר בּ֖/וֹ הַ/נָּֽגַע־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/057.yaml
  text: But if it appears again in the garment[a], or in the warp, or in the woof, or in any article of leather, it is a spreading outbreak[b]; you shall burn in the fire whatever has the infection in it.
translation:
  language: fr
  text: Mais si l’atteinte réapparaît sur le vêtement, dans la chaîne, dans la trame ou sur tout objet en cuir, elle se propage. Tu brûleras au feu l’objet où se trouve l’atteinte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu désigne ici une zone atteinte ou contaminée; il est traditionnellement rendu par « plaie », « fléau » ou « tache suspecte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּרָאֶה עוֹד
  choice: réapparaît
  rationale: Le niphal de ראה exprime ici le fait de redevenir visible, et עוֹד indique la récurrence après le traitement décrit dans le contexte.
- source_word: בֶּגֶד
  choice: vêtement
  rationale: Terme courant pour une pièce d’habillement ou de tissu; « vêtement » assure la cohérence avec le vocabulaire du chapitre.
- source_word: שְׁתִי ... עֵרֶב
  choice: la chaîne ou la trame
  rationale: Ce sont les termes techniques français usuels pour les fils longitudinaux et transversaux d’un tissu.
- source_word: כְּלִי עוֹר
  choice: tout objet en cuir
  rationale: Rend naturellement l’expression large qui désigne un objet fabriqué en peau ou en cuir, sans en préciser indûment la fonction.
- source_word: פֹּרַחַת הִוא
  choice: c’est qu’elle s’étend
  rationale: Le participe de פרח, littéralement associé au fait de bourgeonner, décrit ici la progression active de l’atteinte. La tournure française relie clairement cette constatation à sa réapparition.
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: Tu brûleras au feu
  rationale: Conserve la deuxième personne du singulier et le ton prescriptif de la procédure légale.
- source_word: אֵת אֲשֶׁר בּוֹ הַנָּגַע
  choice: tout ce qui porte l’atteinte
  rationale: Rend la relative hébraïque de manière idiomatique tout en indiquant que l’objet où se trouve la zone atteinte doit être détruit.
- source_word: הַנָּגַע
  choice: l’atteinte
  rationale: Terme suffisamment large pour ce mot technique du Lévitique, sans imposer un diagnostic médical moderne ni le sens courant de « fléau ».
