  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֧ה בְ/עוֹר בְּשָׂרָ֛/ם בֶּהָרֹ֖ת כֵּה֣וֹת לְבָנֹ֑ת בֹּ֥הַק ה֛וּא פָּרַ֥ח בָּ/ע֖וֹר טָה֥וֹר הֽוּא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/039.yaml
  text: and the priest examines, and behold, on the skin of their flesh there are dull white spots, it is a harmless rash that has broken out on the skin; he is clean.
translation:
  language: fr
  text: 'Le prêtre examinera : voici que, sur la peau de leur corps, il y a des taches d’un blanc terne ; c’est une éruption cutanée[a] apparue sur la peau. Cette personne est pure.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une affection de la peau » ou « une tache mouchetée ». Le terme hébreu désigne une affection cutanée qui, contrairement aux atteintes plus graves examinées dans ce chapitre, ne rend pas impur.
    reason: Le terme hébreu בֹּהַק est rare et son équivalent médical précis demeure incertain.
lexical_decisions:
- source_word: וְרָאָה הַכֹּהֵן
  choice: Le prêtre examinera
  rationale: Dans cette procédure sacerdotale, ראה désigne une inspection plutôt qu’un simple regard. Le futur convient au style législatif français.
- source_word: בְעוֹר בְּשָׂרָם
  choice: sur la peau de leur corps
  rationale: Cette formulation conserve l’image concrète de l’hébreu et le suffixe pluriel, qui renvoie dans le contexte précédent à l’homme ou à la femme.
- source_word: בֶּהָרֹת כֵּהוֹת לְבָנֹת
  choice: des taches d’un blanc terne
  rationale: « Taches » rend les marques visibles, tandis que « d’un blanc terne » exprime leur blancheur atténuée, opposée à une lésion plus éclatante.
- source_word: בֹּהַק
  choice: une éruption cutanée
  rationale: Le terme rare désigne ici une affection cutanée qui n’entraîne pas l’impureté. Cette traduction reste compréhensible sans proposer un diagnostic médical moderne trop précis.
- source_word: פָּרַח בָּעוֹר
  choice: qui est apparue sur la peau
  rationale: Dans le contexte dermatologique, פרח décrit l’apparition ou l’éclosion d’une affection sur la peau.
- source_word: טָהוֹר הוּא
  choice: cette personne est pure
  rationale: « Pure » conserve la catégorie rituelle et juridique du Lévitique. « Cette personne » rend le référent singulier de manière naturelle et inclut l’homme comme la femme mentionnés au verset précédent.
theological_decisions:
- issue: Nature du verdict sacerdotal
  choice: cette personne est pure
  alternative: elle est rituellement pure
  rationale: Le verdict porte sur le statut de pureté prévu par la loi cultuelle, non sur la moralité ni sur une guérison médicale. Le contexte permet de laisser cette dimension implicite sans ajouter « rituellement » au texte.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde la structure d’un constat sacerdotal tout en évitant l’archaïsme « voici ». Le point-virgule distingue le diagnostic du verdict de pureté.
