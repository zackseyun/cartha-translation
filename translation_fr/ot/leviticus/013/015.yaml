  text: וְ/רָאָ֧ה הַ/כֹּהֵ֛ן אֶת הַ/בָּשָׂ֥ר הַ/חַ֖י וְ/טִמְּא֑/וֹ הַ/בָּשָׂ֥ר הַ/חַ֛י טָמֵ֥א ה֖וּא צָרַ֥עַת הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/015.yaml
  text: When the priest sees the raw flesh[a], he shall pronounce him unclean. The raw flesh is unclean[c][b]; it is a skin disease.
translation:
  language: fr
  text: Quand le prêtre verra la chair à vif[a], il le déclarera impur[b]. La chair à vif est impure ; c’est une affection de la peau[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « la chair vivante » ; traditionnellement rendu par « la chair à vif ».'
    reason: lexical_alternative
  - marker: b
    text: Le prêtre prononce ici un verdict officiel concernant l’état d’impureté rituelle de la personne.
    reason: lexical_clarification
  - marker: c
    text: 'Traditionnellement : « la lèpre ». Le terme hébreu désigne plus largement une affection ou une altération de la peau, et non précisément la maladie aujourd’hui appelée lèpre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: Quand … verra
  rationale: Dans cette procédure juridique, le waw suivi du qatal poursuit la séquence des actes prescrits. Une proposition temporelle rend naturellement cette fonction en français.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Traduction habituelle de כֹּהֵן dans le Lévitique ; c’est le prêtre qui procède à l’examen rituel.
- source_word: הַבָּשָׂר הַחַי
  choice: la chair à vif
  rationale: L’expression signifie littéralement « la chair vivante ». Dans le contexte de l’examen d’une lésion, « la chair à vif » désigne clairement et naturellement le tissu vivant mis à nu.
- source_word: וְטִמְּאוֹ
  choice: il le déclarera impur
  rationale: Au piel, dans la législation sacerdotale, טמא exprime ici le verdict officiel du prêtre sur l’état rituel de la personne, plutôt que l’action de la rendre impure.
- source_word: טָמֵא הוּא
  choice: est impure
  rationale: « Impur » conserve la catégorie rituelle propre au Lévitique. L’accord au féminin suit « chair » en français.
- source_word: צָרַעַת
  choice: une affection de la peau
  rationale: Le terme hébreu recouvre une catégorie plus large que la maladie de Hansen moderne. Cette formulation évite une identification médicale trop précise tout en restant naturelle et compréhensible.
theological_decisions:
- issue: Sens de צָרַעַת dans les lois de pureté du Lévitique
  choice: une affection de la peau
  alternative: la lèpre
  rationale: « Lèpre » risquerait d’identifier à tort cette catégorie rituelle à la seule maladie de Hansen. La traduction retenue préserve la portée générale du terme sans transformer le verdict sacerdotal en diagnostic médical moderne.
translation_notes:
  register: Français international moderne, clair et digne. « Chair à vif » reste concret et accessible ; « déclarera impur » conserve le caractère juridique et rituel de l’acte sacerdotal. Les répétitions de l’hébreu sont maintenues.
