  text: וְ/רָאָ֣ה הַ/כֹּהֵ֣ן אֶת הַ/נֶּ֣גַע בְּ/עֽוֹר הַ֠/בָּשָׂר וְ/שֵׂעָ֨ר בַּ/נֶּ֜גַע הָפַ֣ךְ לָבָ֗ן וּ/מַרְאֵ֤ה הַ/נֶּ֨גַע֙ עָמֹק֙ מֵ/ע֣וֹר בְּשָׂר֔/וֹ נֶ֥גַע צָרַ֖עַת ה֑וּא וְ/רָאָ֥/הוּ הַ/כֹּהֵ֖ן וְ/טִמֵּ֥א אֹתֽ/וֹ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/003.yaml
  text: And the priest shall examine the diseased spot on the skin of the body[a], and if the hair in the spot has turned white and the appearance of the spot is deeper than the skin of his body, it is a diseased spot of skin disease; when the priest has examined him, he shall pronounce him unclean.
translation:
  language: fr
  text: Le prêtre examinera la lésion sur la peau du corps. Si les poils dans la lésion sont devenus blancs et si la lésion paraît plus profonde que la peau de son corps, c’est une lésion de maladie de peau[a]. Après l’examen, le prêtre déclarera cette personne impure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « une lésion de lèpre » ou « une atteinte lépreuse ». Le mot hébreu צָרַעַת désigne une catégorie plus large que la lèpre au sens médical moderne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: lésion
  rationale: Dans ce contexte d’examen visuel, le mot désigne une zone cutanée atteinte. « Lésion » est précis, naturel et n’impose pas un diagnostic médical particulier.
- source_word: בְּעוֹר הַבָּשָׂר
  choice: sur la peau du corps
  rationale: Cette formulation française actuelle conserve les deux éléments anatomiques sans l’archaïsme ni les connotations possibles de « chair ».
- source_word: שֵׂעָר
  choice: poils
  rationale: Sur la peau du corps, le pluriel « poils » est plus idiomatique et anatomiquement précis que « cheveux » ou le collectif « poil ».
- source_word: הָפַךְ לָבָן
  choice: sont devenus blancs
  rationale: Le parfait décrit un changement ayant abouti à l’état observé lors de l’examen.
- source_word: מַרְאֵה הַנֶּגַע עָמֹק
  choice: la lésion paraît plus profonde
  rationale: « Paraît » rend מַרְאֵה et préserve le caractère visuel du constat, sans affirmer une profondeur mesurée.
- source_word: נֶגַע צָרַעַת
  choice: une lésion de maladie de peau
  rationale: Cette expression garde les deux substantifs hébreux et évite d’identifier anachroniquement צָרַעַת à la seule maladie de Hansen.
- source_word: וְרָאָהוּ
  choice: Après l’avoir examinée
  rationale: Le suffixe peut grammaticalement renvoyer à la lésion ou à la personne. Le féminin français reprend ici la lésion, objet explicite de l’examen, tout en laissant la décision finale porter sur la personne.
- source_word: וְטִמֵּא אֹתוֹ
  choice: le prêtre déclarera cette personne impure
  rationale: Dans cette procédure légale et rituelle, le prêtre prononce un statut; il ne rend pas la personne impure par son action.
theological_decisions:
- issue: Sens de צָרַעַת dans la législation de pureté
  choice: maladie de peau
  alternative: lèpre
  rationale: Le terme hébreu couvre une catégorie ancienne plus large que la lèpre moderne, ou maladie de Hansen. Le choix principal évite une équivalence médicale trop étroite, tandis que la note conserve le rendu traditionnel.
- issue: Portée de וְטִמֵּא אֹתוֹ
  choice: déclarera cette personne impure
  alternative: la rendra impure
  rationale: La formulation exprime le verdict rituel du prêtre sans suggérer qu’il cause lui-même l’impureté.
- issue: Référent du suffixe dans וְרָאָהוּ
  choice: la lésion
  alternative: la personne examinée
  rationale: La forme hébraïque est ambiguë quant au genre du référent, mais la lésion est l’objet immédiat de ראה dans la première proposition. Le français explicite ce lien sans modifier le référent personnel de אֹתוֹ dans le verdict final.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe juridique demeure perceptible, mais la longue phrase hébraïque est répartie en trois phrases pour faciliter la lecture. « Impure » conserve ici son sens rituel.
