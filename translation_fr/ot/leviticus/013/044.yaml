  text: אִישׁ צָר֥וּעַ ה֖וּא טָמֵ֣א ה֑וּא טַמֵּ֧א יְטַמְּאֶ֛/נּוּ הַ/כֹּהֵ֖ן בְּ/רֹאשׁ֥/וֹ נִגְעֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/044.yaml
  text: He is a leprous man; he is unclean[a]. The priest shall surely pronounce him unclean; his disease is on his head.
translation:
  language: fr
  text: 'C’est un homme atteint d’une affection de peau[a] ; il est impur. Le prêtre devra impérativement le déclarer impur : son affection se situe sur sa tête.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traduction traditionnelle : « un homme lépreux ». Le terme hébreu désigne l’affection de peau examinée dans ce chapitre, qui ne correspond pas nécessairement à la lèpre moderne (maladie de Hansen).'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom masculin singulier désigne ici un homme dans le cas juridique examiné.
- source_word: צָרוּעַ
  choice: atteint d’une affection de peau
  rationale: Le terme désigne la personne touchée par l’affection examinée dans ce chapitre. Cette formulation évite de l’identifier à tort à la seule maladie de Hansen.
- source_word: טָמֵא הוּא
  choice: il est impur
  rationale: Dans le Lévitique, טָמֵא indique le statut d’impureté rituelle ; « impur » est l’équivalent français courant et précis dans ce contexte.
- source_word: טַמֵּא יְטַמְּאֶנּוּ
  choice: devra sans faute le déclarer impur
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’énoncé. Dans cette procédure, le prêtre reconnaît officiellement le statut de l’homme plutôt qu’il ne le rend impur.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Désignation usuelle du ministre chargé de l’examen et de la déclaration rituelle.
- source_word: בְּרֹאשׁוֹ
  choice: sur sa tête
  rationale: La préposition situe l’affection sur la tête ; la traduction conserve la formulation générale de l’hébreu sans préciser davantage « cuir chevelu ».
- source_word: נִגְעוֹ
  choice: son affection
  rationale: נֶגַע désigne ici l’atteinte ou la lésion diagnostiquée. « Affection » reste naturel, cohérent et sans connotation épidémique trompeuse.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure « C’est un homme atteint… » reflète l’insistance de l’hébreu, tandis que « sans faute » rend l’intensification verbale sans suggérer que le prêtre produit lui-même l’impureté.
