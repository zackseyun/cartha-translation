source:
  edition: WLC
  text: א֣וֹ בָשָׂ֔ר כִּֽי יִהְיֶ֥ה בְ/עֹר֖/וֹ מִכְוַת אֵ֑שׁ וְֽ/הָיְתָ֞ה מִֽחְיַ֣ת הַ/מִּכְוָ֗ה בַּהֶ֛רֶת לְבָנָ֥ה אֲדַמְדֶּ֖מֶת א֥וֹ לְבָנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/024.yaml
  text: Or if the body has on its skin a burn from fire[a], and the raw flesh of the burn becomes a bright spot, reddish-white or white[b],
translation:
  language: fr
  text: Ou si une personne[a] a sur sa peau une brûlure causée par le feu, et que la chair vive[b] à l’endroit de la brûlure devient une tache brillante, blanche et rougeâtre, ou blanche,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « chair »; le mot hébreu désigne ici la personne ou son corps dans le cadre de cet examen de la peau.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque désigne du tissu vivant ou à vif apparaissant dans la zone brûlée.
    reason: cultural_note
lexical_decisions:
- source_word: אוֹ
  choice: Ou si
  rationale: Introduit un autre cas dans la série de diagnostics et rend explicitement en français la valeur conditionnelle du contexte juridique.
- source_word: בָשָׂר
  choice: une personne
  rationale: Le mot signifie couramment « chair », mais désigne ici la personne dont la peau porte la brûlure. Cette formulation évite en français l’expression peu naturelle « une chair a sur sa peau ».
- source_word: בְעֹרוֹ
  choice: a sur la peau
  rationale: Rend naturellement la localisation de la brûlure sur la peau de la personne concernée.
- source_word: מִכְוַת אֵשׁ
  choice: une brûlure causée par le feu
  rationale: Exprime clairement le rapport entre la brûlure et sa cause.
- source_word: מִחְיַת הַמִּכְוָה
  choice: la chair vive à l’endroit de la brûlure
  rationale: מִחְיָה désigne ici le tissu vivant ou à vif visible dans la zone brûlée; « à l’endroit de » rend mieux la relation locale que l’ambigu « de la brûlure ».
- source_word: בַּהֶרֶת
  choice: une tache brillante
  rationale: Dans Lévitique 13, le terme désigne une zone cutanée visiblement claire ou brillante servant de signe diagnostique.
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: d’un blanc rougeâtre
  rationale: Préserve la coloration mixte exprimée par les deux adjectifs hébreux sans la réduire soit au blanc soit au rouge.
- source_word: אוֹ לְבָנָה
  choice: ou blanc
  rationale: Conserve simplement l’autre possibilité de couleur énoncée dans le texte.
theological_decisions: []
