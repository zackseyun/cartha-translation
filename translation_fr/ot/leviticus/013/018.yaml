  text: Lorsqu’une personne a sur la peau un furoncle et que celui-ci est guéri,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָשָׂר
  choice: une personne
  rationale: Littéralement « chair », mais le terme désigne ici la personne considérée dans son corps. « Une personne » est naturel en français juridique et médical et évite le tour peu idiomatique « une chair ».
- source_word: כִּי
  choice: lorsque
  rationale: כִּי introduit ici un cas prévu par la loi. « Lorsque » convient au style procédural tout en laissant ouverte la possibilité générale exprimée par la condition.
- source_word: יִהְיֶה בּוֹ בְעֹרוֹ
  choice: a sur la peau
  rationale: La formulation française regroupe naturellement le verbe d’existence et les deux indications locatives hébraïques. Pour une lésion cutanée, « sur la peau » est plus idiomatique que « dans sa peau ».
- source_word: שְׁחִין
  choice: un furoncle
  rationale: שְׁחִין désigne une lésion inflammatoire ou un abcès cutané. « Furoncle » est ici un équivalent français courant et précis, sans imposer le sens plus large d’« ulcère ».
- source_word: וְנִרְפָּא
  choice: qui guérit
  rationale: Le niphal de רפא peut exprimer soit un passif, soit un processus intransitif. « Qui guérit » est naturel en français et conserve ici l’idée que le furoncle se résorbe.
