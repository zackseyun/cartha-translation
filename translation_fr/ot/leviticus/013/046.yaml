  verdict: revise
  source_fidelity: 'La structure et les termes essentiels sont bien rendus : נגע est conservé comme une affection non spécifiée, l’impureté est répétée, et l’exclusion est située hors du camp. Toutefois, « à l’écart » atténue la valeur de בָּדָד (« seul, isolé »). « Vivra seul » restitue plus directement la séparation prescrite. La note culturelle de l’audit anglais sur « impur » est également utile et doit être ancrée au terme concerné.'
  naturalness: « Tant que l’affection sera sur lui » est plus idiomatique que « Pendant tout le temps où… », tout en gardant la portée durable de כל ימי. « Il vivra seul » est naturel en français international moderne et s’enchaîne clairement avec « sa demeure sera hors du camp ».
  terminology: « Affection », « impur », « camp » et « demeure » conviennent au registre biblique moderne. « Impur » est maintenu sans qualifier le texte principal de « rituellement » ; la note explicative évite une lecture indûment morale.
