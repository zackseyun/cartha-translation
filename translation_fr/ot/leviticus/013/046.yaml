revisions:
- from: Pendant tout le temps où l’affection sera sur lui[a], il sera impur. Il est impur. Il habitera à l’écart ; sa demeure sera hors du camp.
  to: Tant que l’affection sera sur lui[a], il sera impur[b]. Il est impur. Il vivra seul ; sa demeure sera hors du camp.
  rationale: La révision renforce la fidélité à בָּדָד par « vivra seul », améliore légèrement la fluidité de la première proposition et rétablit une note culturelle ancrée au terme « impur ». Elle ne précise pas la nature médicale de l’affection et ne résout pas le statut d’impureté selon une interprétation confessionnelle.
