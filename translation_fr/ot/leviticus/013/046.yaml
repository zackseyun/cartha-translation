source:
  edition: WLC
  text: כָּל יְמֵ֞י אֲשֶׁ֨ר הַ/נֶּ֥גַע בּ֛/וֹ יִטְמָ֖א טָמֵ֣א ה֑וּא בָּדָ֣ד יֵשֵׁ֔ב מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה מוֹשָׁבֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/046.yaml
  text: All the days that the disease is in him[a], he shall be unclean. He is unclean. He shall live alone[b]; his dwelling shall be outside the camp.
translation:
  language: fr
  text: Tant que l’affection sera sur lui[a], il sera impur[b]. Il est impur. Il vivra seul ; sa demeure sera hors du camp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’atteinte » ou « la plaie ». Le terme hébreu est large et désigne ici l’état diagnostiqué décrit dans ce chapitre.
    reason: lexical_alternative
  - marker: b
    text: « Impur » désigne ici un statut d’impureté lévitique dans le cadre de la loi, et non nécessairement une culpabilité morale.
    reason: cultural_note
lexical_decisions:
- source_word: הַנֶּגַע
  choice: l’affection
  rationale: נֶגַע est un terme large désignant une atteinte ou une affection. Dans Lévitique 13, « affection » reste naturel en français tout en évitant de préciser indûment la nature médicale de l’état diagnostiqué.
- source_word: בּוֹ
  choice: sur lui
  rationale: La préposition peut signifier « en lui » ou « sur lui ». Avec une affection cutanée visible, « sur lui » rend directement l’expression hébraïque sans imposer une conception interne de la maladie.
- source_word: יִטְמָא
  choice: il sera impur
  rationale: Le qal imparfait de טמא exprime ici le statut d’impureté dans une prescription juridique. Le futur français convient à cette portée normative.
- source_word: טָמֵא הוּא
  choice: Il est impur
  rationale: La proposition nominale réaffirme avec insistance le statut de la personne. Une phrase distincte conserve cette répétition emphatique.
- source_word: בָּדָד
  choice: à l’écart
  rationale: בָּדָד indique la séparation et la solitude. « À l’écart » exprime naturellement l’isolement prescrit sans suggérer nécessairement une solitude humaine absolue.
- source_word: יֵשֵׁב
  choice: il habitera
  rationale: ישב peut signifier s’asseoir, demeurer ou habiter. Dans ce contexte relatif au lieu de résidence, « habitera » est précis et idiomatique.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: hors du camp
  rationale: Cette formulation concise et traditionnelle rend clairement l’exclusion de l’espace du camp.
- source_word: מוֹשָׁבוֹ
  choice: sa demeure
  rationale: מוֹשָׁב désigne le lieu où l’on demeure. « Sa demeure » conserve le sens concret et correspond au registre juridique et digne du passage.
theological_decisions:
- issue: Nature de l’impureté dans Lévitique 13
  choice: Traduire טמא par « impur » sans ajouter de qualificatif dans le texte principal.
  alternative: « rituellement impur » ou « cérémoniellement impur »
  rationale: Le verset énonce un statut d’impureté selon la loi lévitique, sans déclarer explicitement une culpabilité morale. Garder simplement « impur » préserve la catégorie biblique et sa portée sans la réduire par une explication ajoutée.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « il sera impur. Il est impur » est maintenue pour préserver l’insistance de l’hébreu. « À l’écart » rend la séparation prescrite de façon naturelle, tandis que « hors du camp » conserve le cadre concret du texte.
