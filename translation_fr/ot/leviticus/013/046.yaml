    rationale: Le mot hébreu exprime le fait d’être seul ou séparé. « À l’écart » peut seulement indiquer un emplacement distinct, tandis que « vivra seul » conserve explicitement la solitude prescrite.
  - severity: low
    issue: La note expliquant le statut d’« impur » manque dans le jeu de notes français.
    rationale: L’audit anglais fournit une clarification culturelle pertinente. L’ajouter avec un ancrage après « impur » précise que le statut lévitique n’équivaut pas nécessairement à une culpabilité morale, sans surinterpréter le texte.
