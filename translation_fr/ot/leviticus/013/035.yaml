id: LEV.13.35
reference: Leviticus 13:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם פָּשֹׂ֥ה יִפְשֶׂ֛ה הַ/נֶּ֖תֶק בָּ/ע֑וֹר אַחֲרֵ֖י טָהֳרָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/035.yaml
  text: But if the scaly eruption does spread in the skin after his cleansing,[a]
translation:
  language: fr
  text: Mais si la plaque squameuse s’étend bel et bien sur la peau après qu’il a été déclaré pur,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la teigne ». Le terme hébreu désigne une affection particulière de la tête ou de la barbe décrite dans ce chapitre, probablement accompagnée de squames et d’une altération ou d’une perte des poils.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: La conjonction introduit ici un cas conditionnel contrastant avec la procédure précédente ; « Mais si » est naturel en français et conserve cette nuance.
- source_word: פָּשֹׂה יִפְשֶׂה
  choice: s’étend bel et bien
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’idée verbale. « bel et bien » rend cette insistance sans suggérer nécessairement une grande étendue ni une progression continue.
- source_word: הַנֶּתֶק
  choice: la plaque squameuse
  rationale: Dans Lévitique 13, נֶתֶק désigne une affection particulière de la tête ou de la barbe, associée à une altération des poils et probablement à des squames. « Plaque squameuse » décrit une lésion visible dans un français moderne sans prétendre poser un diagnostic médical précis.
- source_word: בָּעוֹר
  choice: sur la peau
  rationale: עוֹר signifie « peau ». Avec un verbe d’extension appliqué à une lésion, « sur la peau » est plus idiomatique en français que « dans la peau » tout en conservant le sens contextuel.
- source_word: אַחֲרֵי
  choice: après
  rationale: Rend directement le sens temporel de la préposition.
- source_word: טָהֳרָתוֹ
  choice: après qu’il a été déclaré pur
  rationale: Dans cette procédure d’examen, le terme renvoie à son statut de pureté reconnu précédemment. Cette formulation évite de laisser entendre une guérison physique ou une purification morale.
theological_decisions:
- issue: Sens rituel de טָהֳרָתוֹ
  choice: après qu’il a été déclaré pur
  alternative: après sa purification
  rationale: Le contexte concerne une décision sacerdotale relative à la pureté rituelle. La traduction retenue explicite ce cadre sans transformer la pureté en notion morale ni affirmer qu’un rite de purification est nécessairement visé.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire reste descriptif plutôt que diagnostique ; la syntaxe conserve la condition et l’emphase de l’hébreu.
