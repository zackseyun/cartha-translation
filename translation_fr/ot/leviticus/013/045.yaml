  text: וְ/הַ/צָּר֜וּעַ אֲשֶׁר בּ֣/וֹ הַ/נֶּ֗גַע בְּגָדָ֞י/ו יִהְי֤וּ פְרֻמִים֙ וְ/רֹאשׁ/וֹ֙ יִהְיֶ֣ה פָר֔וּעַ וְ/עַל שָׂפָ֖ם יַעְטֶ֑ה וְ/טָמֵ֥א טָמֵ֖א יִקְרָֽא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/045.yaml
  text: As for the one with the skin disease[a], in whom the infection is, his clothes shall be torn, his head shall be left unkempt, he shall cover his mustache, and he shall cry out, ‘Unclean, unclean!’
translation:
  language: fr
  text: 'Celui qui est atteint d’une affection cutanée et qui présente cette lésion aura ses vêtements déchirés et ses cheveux défaits. Il se couvrira la moustache[a] et criera : « Impur ! Impur ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la lèvre supérieure ». La formule hébraïque peut désigner la lèvre supérieure ou la zone de la moustache, que la personne devait couvrir comme signe public de son état.
    reason: alternative lexicale
lexical_decisions:
- source_word: הַצָּרוּעַ
  choice: la personne atteinte d’une affection cutanée
  rationale: Le terme désigne une personne touchée par la catégorie d’affections cutanées examinées dans ce chapitre, sans permettre de l’identifier précisément à la maladie de Hansen. Cette formulation évite donc le terme moderne et trop spécifique « lépreux ».
- source_word: הַנֶּגַע
  choice: la lésion
  rationale: Dans ce contexte d’examen cutané, נֶגַע désigne la manifestation visible de l’affection. « Lésion » est naturel en français et n’introduit pas l’idée moderne d’une infection microbienne.
- source_word: בְּגָדָיו יִהְיוּ פְרֻמִים
  choice: aura les vêtements déchirés
  rationale: La formulation conserve le signe public de détresse exprimé par des vêtements déchirés, tout en employant un français courant et digne.
- source_word: וְרֹאשׁוֹ יִהְיֶה פָרוּעַ
  choice: les cheveux défaits
  rationale: פָרוּעַ évoque ici une chevelure laissée libre, en désordre ou négligée, non une tête nécessairement découverte. « Cheveux défaits » préserve cette image sans la surinterpréter.
- source_word: וְעַל שָׂפָם יַעְטֶה
  choice: se couvrira la moustache
  rationale: שָׂפָם peut désigner la moustache ou la région de la lèvre supérieure. La traduction retient l’expression concrète traditionnelle et signale l’autre possibilité en note.
- source_word: וְטָמֵא טָמֵא יִקְרָא
  choice: 'criera : « Impure ! Impure ! »'
  rationale: Le verbe indique une proclamation publique, et la répétition est conservée pour son insistance. Le féminin s’accorde grammaticalement avec « la personne », sans modifier le sens du statut rituel.
theological_decisions:
- issue: Nature de l’impureté en Lévitique 13
  choice: « Impure » comme déclaration de statut rituel et public
  alternative: « Souillée » ou une formulation suggérant une faute morale
  rationale: טָמֵא désigne ici l’état d’impureté reconnu par la loi cultuelle, avec ses conséquences communautaires; le texte n’attribue pas nécessairement une culpabilité morale à la personne.
- issue: Identification médicale de צָרַעַת
  choice: « affection cutanée » sans diagnostic moderne précis
  alternative: « lèpre » au sens de maladie de Hansen
  rationale: La catégorie décrite en Lévitique est plus large que le diagnostic moderne de la maladie de Hansen. La traduction conserve l’indétermination médicale du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le futur normatif rend les imparfaits hébreux de prescription. « La personne » permet une formulation naturelle sans enfermer la catégorie légale dans un diagnostic médical moderne; l’adjectif proclamé est donc accordé au féminin. Le marqueur [a] est placé sur l’expression qu’explique réellement la note.
