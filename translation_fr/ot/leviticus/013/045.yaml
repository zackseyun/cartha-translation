  terminology: « Affection cutanée », « lésion », « vêtements déchirés », « cheveux défaits » et « impur » conservent respectivement l’indétermination médicale, la manifestation/atteinte concernée, les signes prescrits et le statut rituel. « Impur » ne doit pas être compris comme une accusation morale.
