  text: וְ/כִֽי יִהְיֶ֤ה בַ/קָּרַ֨חַת֙ א֣וֹ בַ/גַּבַּ֔חַת נֶ֖גַע לָבָ֣ן אֲדַמְדָּ֑ם צָרַ֤עַת פֹּרַ֨חַת֙ הִ֔וא בְּ/קָרַחְתּ֖/וֹ א֥וֹ בְ/גַבַּחְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/042.yaml
  text: But if there is on the bald head or on the bald forehead a white-reddish diseased spot[b][a], it is a spreading skin disease on his bald head or on his bald forehead.
translation:
  language: fr
  text: Mais si une lésion d’un blanc rougeâtre apparaît sur la zone dégarnie à l’arrière de la tête ou sur le front dégarni[b], c’est une affection cutanée[a] qui s’étend sur la zone dégarnie à l’arrière de sa tête ou sur son front dégarni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, selon la traduction traditionnelle, « lèpre ». Le terme hébreu désigne plus largement diverses affections ou anomalies de la peau et ne doit pas être identifié strictement à la maladie de Hansen.
    reason: lexical_alternative
  - marker: b
    text: Les deux termes hébreux distinguent la calvitie à l’arrière de la tête de celle de la partie frontale.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: Mais si
  rationale: Introduit un nouveau cas conditionnel en contraste avec le cas précédent.
- source_word: בַקָּרַחַת ... בַגַּבַּחַת
  choice: sur la partie chauve de la tête ... sur le front dégarni
  rationale: Rend en français naturel les deux localisations distinctes de la calvitie, la première étant traditionnellement comprise comme la partie arrière ou supérieure de la tête et la seconde comme la partie frontale.
- source_word: נֶגַע
  choice: lésion
  rationale: Désigne ici une marque corporelle visible soumise à l’examen; « lésion » reste descriptif sans imposer un diagnostic médical moderne précis.
- source_word: לָבָן אֲדַמְדָּם
  choice: d’un blanc rougeâtre
  rationale: Conserve l’ordre des qualificatifs hébreux et exprime une coloration blanche teintée de rouge.
- source_word: צָרַעַת
  choice: affection cutanée
  rationale: Évite d’identifier abusivement le terme hébreu à la seule maladie de Hansen, tout en exprimant clairement son domaine dans ce contexte.
- source_word: פֹּרַחַת
  choice: qui s’étend
  rationale: Le participe décrit une affection qui se développe ou se propage; cette formulation est claire et médicalement neutre.
- source_word: בְּקָרַחְתּוֹ ... בְגַבַּחְתּוֹ
  choice: sur la partie chauve de sa tête ... sur son front dégarni
  rationale: Conserve les suffixes possessifs et répète les deux localisations mentionnées dans le diagnostic.
theological_decisions:
- issue: Portée du terme צָרַעַת
  choice: affection cutanée
  alternative: lèpre
  rationale: Le terme biblique couvre diverses atteintes ou anomalies et ne correspond pas strictement à la maladie de Hansen; la traduction ne doit pas introduire une identification médicale anachronique.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde la structure conditionnelle du texte juridique, distingue les deux zones de calvitie et évite une précision médicale étrangère au terme hébreu.
