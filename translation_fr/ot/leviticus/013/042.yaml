  to: Mais si une lésion d’un blanc rougeâtre apparaît sur la zone dégarnie à l’arrière de la tête ou sur le front dégarni[b], c’est une affection cutanée[a] qui s’étend sur la zone dégarnie à l’arrière de sa tête ou sur son front dégarni.
