  source_fidelity: La structure conditionnelle, la lésion « d’un blanc rougeâtre », la désignation non anachronique de צָרַעַת et l’idée de propagation rendent fidèlement l’hébreu. La première zone de calvitie doit toutefois être explicitement située à l’arrière de la tête, en contraste avec la zone frontale.
