source:
  edition: WLC
  text: וְ/רָאָ֨ה הַ/כֹּהֵ֜ן אַחֲרֵ֣י הֻכַּבֵּ֣ס אֶת הַ/נֶּ֗גַע וְ֠/הִנֵּה לֹֽא הָפַ֨ךְ הַ/נֶּ֤גַע אֶת עֵינ/וֹ֙ וְ/הַ/נֶּ֣גַע לֹֽא פָשָׂ֔ה טָמֵ֣א ה֔וּא בָּ/אֵ֖שׁ תִּשְׂרְפֶ֑/נּוּ פְּחֶ֣תֶת הִ֔וא בְּ/קָרַחְתּ֖/וֹ א֥וֹ בְ/גַבַּחְתּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/055.yaml
  text: Then the priest shall examine it after the diseased area has been washed[a], and if the diseased area has not changed its appearance and the diseased area has not spread, it is unclean. You shall burn it in the fire; it is a corrosive spot[c][b], whether on its worn side or on its bare side.
translation:
  language: fr
  text: 'Le prêtre examinera la partie atteinte après qu’elle aura été lavée. Si la partie atteinte n’a pas changé d’aspect[a] et ne s’est pas étendue, l’objet est impur. Tu le brûleras au feu : c’est une détérioration corrosive[b], qu’elle se trouve sur l’envers ou sur l’endroit[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’a pas changé de couleur ». L’expression hébraïque dit littéralement « n’a pas changé son œil » et renvoie à l’apparence visible.
    reason: lexical_alternative
  - marker: b
    text: Ou « une atteinte qui ronge ». Le sens précis du terme hébreu est incertain; il désigne une détérioration destructrice de la matière.
    reason: lexical_alternative
  - marker: c
    text: La dernière expression est difficile. Elle signifie littéralement « dans sa calvitie ou dans son front dégarni »; appliquée ici à une étoffe ou à du cuir, elle désigne probablement l’une ou l’autre face ou surface de l’objet.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: Le prêtre examinera
  rationale: Dans le contexte des diagnostics sacerdotaux, ראה désigne une inspection attentive plutôt qu’une simple perception visuelle.
- source_word: אַחֲרֵי הֻכַּבֵּס
  choice: après qu’elle aura été lavée
  rationale: La forme passive de כבס indique que la partie ou la matière atteinte a été soumise au lavage.
- source_word: הַנֶּגַע
  choice: la partie atteinte
  rationale: נגע désigne ici la zone affectée de l’étoffe ou du cuir; cette formulation évite d’imposer un diagnostic médical moderne.
- source_word: לֹא הָפַךְ ... אֶת עֵינוֹ
  choice: n’a pas changé d’aspect
  rationale: L’expression littérale « changer son œil » renvoie à l’apparence visible, éventuellement à la couleur, sans nécessairement s’y limiter.
- source_word: לֹא פָשָׂה
  choice: ne s’est pas étendue
  rationale: פשה exprime l’extension ou la propagation de l’atteinte.
- source_word: טָמֵא הוּא
  choice: l’objet est impur
  rationale: « Impur » est le terme français usuel pour l’état rituel désigné dans la législation lévitique; « l’objet » explicite le référent matériel du pronom hébreu.
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: Tu le brûleras au feu
  rationale: Le verbe à la deuxième personne masculine singulière formule directement l’instruction juridique.
- source_word: פְּחֶתֶת
  choice: une détérioration corrosive
  rationale: Le terme évoque un processus destructeur qui ronge la matière; cette traduction reste descriptive sans identifier précisément le phénomène.
- source_word: בְּקָרַחְתּוֹ א֥וֹ בְגַבַּחְתּוֹ
  choice: sur l’envers ou sur l’endroit
  rationale: Les deux termes, empruntés au vocabulaire de la calvitie, désignent probablement ici deux faces ou surfaces opposées de la matière. « Envers » et « endroit » rendent cette opposition de manière intelligible tout en signalant l’incertitude en note.
