  text: וְ/אִם֙ מִ/פְּאַ֣ת פָּנָ֔י/ו יִמָּרֵ֖ט רֹאשׁ֑/וֹ גִּבֵּ֥חַ ה֖וּא טָה֥וֹר הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/041.yaml
  text: And if the front of his head becomes bald[a], he is bald on the forehead; he is clean.
translation:
  language: fr
  text: Si le devant de sa tête se dégarnit, il est chauve à l’avant de la tête ; il est pur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִפְּאַת פָּנָיו
  choice: sur le devant de sa tête
  rationale: L’expression associe littéralement l’idée de bord ou de côté à celle de face. Dans ce contexte anatomique, elle désigne la région antérieure du cuir chevelu, par contraste avec la calvitie mentionnée au verset précédent.
- source_word: יִמָּרֵט רֹאשׁוֹ
  choice: ses cheveux tombent
  rationale: Le niphal de מרט décrit ici la tête qui se dégarnit. Cette formulation française naturelle exprime la perte des cheveux sans suggérer nécessairement qu’ils ont été arrachés.
- source_word: גִּבֵּחַ
  choice: il a le front dégarni
  rationale: Ce terme désigne spécifiquement une calvitie frontale et se distingue du mot employé au verset précédent pour une calvitie à l’arrière ou au sommet du crâne.
- source_word: טָהוֹר
  choice: pur
  rationale: Dans la législation du Lévitique, le terme indique le statut rituel de la personne. « Pur » est la formulation française traditionnelle et naturelle dans l’opposition biblique pur/impur, sans impliquer ici une qualité morale.
theological_decisions:
- issue: Terminologie du statut rituel dans les lois de pureté
  choice: pur
  alternative: non souillé / déclaré pur
  rationale: Le diagnostic porte sur le statut rituel et non sur la valeur morale de la personne. « Pur » conserve la catégorie lévitique et l’opposition avec « impur » employée dans le contexte.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase explicite naturellement la chute des cheveux tout en conservant la distinction anatomique entre calvitie frontale et calvitie postérieure.
