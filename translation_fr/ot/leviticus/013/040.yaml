  text: וְ/אִ֕ישׁ כִּ֥י יִמָּרֵ֖ט רֹאשׁ֑/וֹ קֵרֵ֥חַ ה֖וּא טָה֥וֹר הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/040.yaml
  text: If a man loses the hair of his head[a], he is bald; he is clean.
translation:
  language: fr
  text: Si un homme perd les cheveux de sa tête[a], il est chauve ; il est pur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « devient dégarni ». Le verbe hébreu peut désigner le fait de devenir dégarni ou d’être dépouillé de ses cheveux ; le texte principal conserve la distinction verbale avant « il est chauve ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: un homme
  rationale: Le nom hébreu est masculin singulier et introduit ici un cas juridique concernant le corps d’un homme.
- source_word: כִּי
  choice: si
  rationale: Dans ce contexte juridique et diagnostique, כִּי introduit un cas conditionnel.
- source_word: יִמָּרֵט
  choice: perd les cheveux
  rationale: Le niphal de מרט exprime le fait de devenir dégarni ou d’être dépouillé de ses cheveux, sans préciser ici la cause. Cette formulation garde aussi la distinction avec le prédicat suivant, « il est chauve ».
- source_word: רֹאשׁוֹ
  choice: de sa tête
  rationale: Cette expression rend explicitement le rapport avec la tête et précise l’endroit de la perte des cheveux.
- source_word: קֵרֵחַ
  choice: chauve
  rationale: Cet adjectif énonce simplement et naturellement l’état qui en résulte.
- source_word: טָהוֹר
  choice: pur
  rationale: Dans Lévitique 13, le terme désigne le statut rituel opposé à l’impureté ; « pur » est la formulation française traditionnelle et contextuellement claire.
- source_word: הוּא ... הוּא
  choice: il est… il est
  rationale: Les deux pronoms renforcent les deux prédications ; les deux propositions sont donc conservées.
theological_decisions:
- issue: Terminologie du statut rituel dans la législation lévitique
  choice: pur
  alternative: non impur / sans impureté
  rationale: Le verset statue sur la pureté rituelle et non sur l’innocence morale. « Pur » maintient la catégorie cultuelle sans assimiler la calvitie à une faute.
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve la structure du cas juridique, la répétition hébraïque et la distinction entre la perte des cheveux et l’état de calvitie.
