  text: וְ/רָאָה֩ הַ/כֹּהֵ֨ן אֹת֜/וֹ בַּ/יּ֣וֹם הַ/שְּׁבִיעִי֮ שֵׁנִית֒ וְ/הִנֵּה֙ כֵּהָ֣ה הַ/נֶּ֔גַע וְ/לֹא פָשָׂ֥ה הַ/נֶּ֖גַע בָּ/ע֑וֹר וְ/טִהֲר֤/וֹ הַ/כֹּהֵן֙ מִסְפַּ֣חַת הִ֔יא וְ/כִבֶּ֥ס בְּגָדָ֖י/ו וְ/טָהֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/006.yaml
  text: Then the priest shall examine him again on the seventh day[a], and if the infection has faded and the infection has not spread in the skin, the priest shall pronounce him clean; it is a scaly eruption. He shall wash his clothes and be clean.
translation:
  language: fr
  text: 'Le septième jour, le prêtre l’examinera de nouveau. S’il constate que l’atteinte s’est atténuée et ne s’est pas étendue sur la peau, il le déclarera pur : c’est une éruption cutanée[a]. L’homme lavera ses vêtements et sera pur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le terme hébreu désigne une éruption cutanée relativement limitée, mais sa nature exacte est incertaine. On traduit aussi : « dartre » ou « plaque squameuse ».'
    reason: Alternative lexicale et incertitude quant au type précis d’affection cutanée.
lexical_decisions:
- source_word: וְרָאָה
  choice: l’examinera
  rationale: Dans ce contexte de diagnostic sacerdotal, le verbe désigne une inspection officielle plutôt que le simple fait de voir.
- source_word: שֵׁנִית
  choice: de nouveau
  rationale: L’adverbe indique que le prêtre répète l’examen; cette formulation est naturelle en français moderne.
- source_word: כֵּהָה
  choice: s’est atténuée
  rationale: Le terme indique que l’aspect de l’atteinte est devenu moins marqué ou moins visible, sans nécessairement signifier sa disparition.
- source_word: הַנֶּגַע
  choice: l’atteinte
  rationale: Ce choix désigne de manière accessible l’anomalie cutanée observée, sans lui attribuer abusivement une cause infectieuse précise.
- source_word: פָשָׂה
  choice: ne s’est pas étendue
  rationale: Dans la législation sur les affections de la peau, le verbe décrit leur extension à la surface de la peau.
- source_word: בָּעוֹר
  choice: sur la peau
  rationale: Cette tournure idiomatique en français rend la localisation cutanée exprimée par l’hébreu.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: il le déclarera pur
  rationale: Le prêtre rend un verdict officiel de pureté rituelle; il n’effectue pas ici une guérison physique.
- source_word: מִסְפַּחַת
  choice: une éruption cutanée
  rationale: Le mot désigne une affection cutanée relativement limitée, mais sa nature exacte reste incertaine; le choix évite une précision médicale anachronique.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: L’homme lavera ses vêtements
  rationale: Le sujet implicite est la personne examinée. « Vêtements » est naturel et digne en français moderne.
- source_word: וְטָהֵר
  choice: et sera pur
  rationale: La proposition indique le statut rituel résultant après le lavage, et non nécessairement une guérison médicale.
theological_decisions:
- issue: Verdict de pureté rituelle ou guérison physique
  choice: « il le déclarera pur » et « sera pur »
  alternative: « il le purifiera » ou « il sera guéri »
  rationale: Le passage porte sur l’évaluation sacerdotale du statut rituel. La traduction n’attribue au prêtre ni une purification matérielle ni un acte de guérison.
translation_notes:
  register: Français international moderne, clair et digne. « Atteinte » évite le diagnostic moderne trop précis suggéré par « infection ». La répétition du pronom dans « il le déclarera pur » garde le prêtre comme sujet, tandis que « L’homme » explicite ensuite le sujet implicite du lavage.
