  text: וְ/רָאָ֨/הוּ֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה נֶהְפַּ֥ךְ הַ/נֶּ֖גַע לְ/לָבָ֑ן וְ/טִהַ֧ר הַ/כֹּהֵ֛ן אֶת הַ/נֶּ֖גַע טָה֥וֹר הֽוּא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/017.yaml
  text: And the priest shall examine it[a], and behold, the diseased spot has turned white; then the priest shall pronounce the spot clean[c][b]; it is clean.
translation:
  language: fr
  text: 'Le prêtre examinera la lésion[a] et constatera qu’elle est devenue blanche. Alors, le prêtre déclarera la lésion pure[b] : elle est pure[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la zone atteinte ». Le terme hébreu désigne la partie visible soumise à l’examen sacerdotal, sans préciser un diagnostic médical moderne.
    reason: lexical_alternative
  - marker: b
    text: Ou « déclarera que la lésion est pure ». Le prêtre rend ici un verdict de pureté après l’examen ; il ne guérit pas la lésion.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement en hébreu : « pur, il est ». Le pronom est masculin, conformément au nom hébreu נֶגַע ; le français emploie le féminin pour s’accorder avec « lésion ».'
    reason: source_form
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: Le prêtre l’examinera
  rationale: Le verbe ראה signifie littéralement « voir », mais, dans cette procédure sacerdotale, il désigne l’examen attentif de la zone atteinte. Le suffixe pronominal est rendu par « l’ ».
- source_word: וְהִנֵּה
  choice: et constatera que
  rationale: הִנֵּה attire l’attention sur le résultat visible de l’examen. « Constatera que » en restitue naturellement la valeur observationnelle en français moderne.
- source_word: הַנֶּגַע
  choice: la lésion
  rationale: נֶגַע désigne ici la zone atteinte et visible soumise à l’examen, sans correspondre nécessairement à un diagnostic médical moderne. « Lésion » reste concret tout en évitant une précision pathologique injustifiée.
- source_word: נֶהְפַּךְ ... לְלָבָן
  choice: est devenue blanche
  rationale: Le nifal de הפך exprime ici un changement d’état; cette formulation française rend clairement le changement de couleur.
- source_word: וְטִהַר הַכֹּהֵן
  choice: le prêtre déclarera la lésion pure
  rationale: Dans Lévitique 13, le prêtre rend un verdict sur l’état de pureté après examen; il ne guérit ni ne nettoie physiquement la lésion.
- source_word: טָהוֹר הוּא
  choice: elle est pure
  rationale: La proposition hébraïque énonce directement le verdict final. Le féminin français s’accorde avec « la lésion », tandis que l’hébreu emploie un pronom masculin accordé avec נֶגַע.
theological_decisions:
- issue: Nature de l’action sacerdotale dans la législation sur la pureté
  choice: Le prêtre déclare la lésion pure.
  alternative: Le prêtre purifie la lésion.
  rationale: Le contexte présente le prêtre comme celui qui examine et prononce un statut rituel, non comme celui qui produit une guérison ou accomplit ici une purification matérielle.
translation_notes:
  register: Français international moderne, clair et digne. La formulation procédurale reste précise; « constatera que » rend de façon naturelle la force observationnelle de וְהִנֵּה, et « pure » conserve le vocabulaire rituel du passage.
