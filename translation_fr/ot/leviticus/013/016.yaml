  yaml_path: translation/ot/leviticus/013/016.yaml
  text: Or if the raw flesh turns back and becomes white[a], then he shall come to the priest.
translation:
  language: fr
  text: Ou si la chair à vif[a] redevient blanche, il se présentera au prêtre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la chair vivante ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ כִּי
  choice: Ou si
  rationale: אוֹ introduit un autre cas dans la procédure, tandis que כִּי lui donne ici une valeur conditionnelle.
- source_word: יָשׁוּב ... וְנֶהְפַּךְ לְלָבָן
  choice: redevient blanche
  rationale: Cette formulation française naturelle exprime à la fois le retour ou renversement de l’état précédent et le changement de couleur indiqué par le texte hébreu.
- source_word: הַבָּשָׂר הַחַי
  choice: la chair à vif
  rationale: Littéralement « la chair vivante » ; dans ce diagnostic cutané, l’expression désigne de la chair vive ou à vif. Le choix retenu est clair en français moderne, tandis que le sens littéral est conservé en note.
- source_word: וּבָא אֶל הַכֹּהֵן
  choice: il se présentera au prêtre
  rationale: Rend naturellement, dans ce contexte procédural, le mouvement vers le prêtre chargé de l’examen, sans ajouter une précision absente du texte.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. « Chair à vif » rend le diagnostic compréhensible sans technicisme, et « se présentera au prêtre » convient au registre légal et rituel du passage.
