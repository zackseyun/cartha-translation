    rationale: Le texte dit simplement « à l’endroit du furoncle ». Même si le contexte immédiat évoque une lésion antérieure, le verset ne formule pas lui-même ce repère au passé.
  - severity: low
    issue: Nuance chromatique condensée
    rationale: « D’un blanc rougeâtre » est possible, mais « blanche et rougeâtre » conserve plus visiblement les deux adjectifs successifs de l’hébreu.
  - severity: low
    issue: Formulation et note sur la présentation
    rationale: « S’il se forme » est plus naturel en français. La note doit présenter l’alternative « paraître/se montrer devant le prêtre » sans qualifier « auprès du prêtre » de littéral, car cette formulation française n’est pas littérale.
