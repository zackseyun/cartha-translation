  to: S’il se forme, à l’endroit du furoncle, une enflure blanche ou une tache brillante blanche et rougeâtre, celle-ci sera montrée au prêtre.[a]
  rationale: La révision retire l’antériorité ajoutée, explicite les deux qualificatifs de couleur et emploie une construction conditionnelle française naturelle. Elle conserve l’ambiguïté du nifal de « voir » dans la note tout en donnant dans le texte le sens procédural le plus probable.
