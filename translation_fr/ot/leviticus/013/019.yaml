review_pass:
  verdict: revise
  source_fidelity: La structure conditionnelle française est recevable dans cette prescription, mais « où se trouvait » introduit explicitement une antériorité qui n’est pas exprimée dans ce verset. La double qualification de la tache (« blanche » et « rougeâtre ») doit rester explicite.
  naturalness: La formulation proposée est globalement claire, mais « s’il apparaît une enflure » est moins idiomatique que « s’il se forme une enflure », et le pronom « la » peut avoir un antécédent moins net après l’alternative entre deux lésions.
  terminology: « Enflure » et « tache brillante » distinguent utilement les deux termes dermatologiques hébreux. « Blanche et rougeâtre » rend plus directement les deux adjectifs que « d’un blanc rougeâtre ».
