  text: and in the place of the boil there develops a white swelling or a reddish-white bright spot[a], then it shall be shown to the priest.
translation:
  language: fr
  text: S’il se forme, à l’endroit du furoncle, une enflure blanche ou une tache brillante blanche et rougeâtre, celle-ci sera montrée au prêtre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elle paraîtra devant le prêtre ». Littéralement, l’hébreu dit qu’elle « sera vue » au prêtre; dans ce contexte, il peut s’agir de sa présentation pour examen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: s’il apparaît
  rationale: Dans cette loi diagnostique, היה introduit l’apparition d’un nouveau signe à l’emplacement du furoncle. La tournure conditionnelle française rend naturellement la relation avec la présentation au prêtre.
- source_word: בִּמְקוֹם הַשְּׁחִין
  choice: À l’endroit où se trouvait le furoncle
  rationale: Cette formulation locative est naturelle en français et indique que la lésion précédente s’est résorbée, conformément au contexte du verset 18.
- source_word: שְׂאֵת לְבָנָה
  choice: une enflure blanche
  rationale: שְׂאֵת désigne ici une lésion surélevée; « enflure » est clair et conserve la distinction avec la tache brillante.
- source_word: בַהֶרֶת לְבָנָה אֲדַמְדָּמֶת
  choice: une tache brillante d’un blanc rougeâtre
  rationale: בַהֶרֶת désigne une zone cutanée claire ou brillante. אֲדַמְדָּמֶת qualifie la blancheur d’une nuance rougeâtre, sans effacer la combinaison inhabituelle du texte.
- source_word: וְנִרְאָה אֶל הַכֹּהֵן
  choice: on la présentera au prêtre
  rationale: Le nifal de ראה peut signifier « être vu » ou « apparaître »; dans ce contexte procédural, il s’agit de présenter la lésion à l’examen du prêtre.
