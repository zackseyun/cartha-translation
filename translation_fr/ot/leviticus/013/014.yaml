source:
  edition: WLC
  text: וּ/בְ/י֨וֹם הֵרָא֥וֹת בּ֛/וֹ בָּשָׂ֥ר חַ֖י יִטְמָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/014.yaml
  text: But on the day living flesh appears in it, he shall be unclean.
translation:
  language: fr
  text: Mais le jour où de la chair vive apparaîtra sur lui, il sera impur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְיוֹם
  choice: Mais dès que
  rationale: Littéralement « et au jour où » ; dans ce contexte prescriptif, l’expression introduit le moment où la condition se réalise. « Dès que » rend naturellement cette valeur temporelle, tandis que « mais » préserve le contraste avec le verset précédent.
- source_word: בָּשָׂר חַי
  choice: de la chair vive
  rationale: Désigne de la chair à vif ou saine apparaissant au milieu de la zone blanchie ; « chair vive » conserve la formulation concrète et traditionnelle sans préciser davantage que l’hébreu.
- source_word: בּוֹ
  choice: dans la tache
  rationale: Le pronom masculin singulier renvoie vraisemblablement au phénomène cutané décrit dans le contexte. L’explicitation « la tache » évite en français l’ambiguïté selon laquelle la chair apparaîtrait dans l’homme, conformément au sens contextuel retenu par la révision anglaise « in it ».
- source_word: יִטְמָא
  choice: cet homme sera impur
  rationale: La forme verbale signifie « il sera impur ». L’ajout de « cet homme » explicite le sujet humain en français sans ajouter de contenu doctrinal.
theological_decisions:
- issue: Nature de l’impureté
  choice: sera impur
  alternative: sera déclaré impur
  rationale: L’hébreu emploie le verbe simple « devenir/être impur », et non la forme sacerdotale causative « déclarer impur ». La traduction conserve donc l’énoncé direct sans transformer ici l’impureté rituelle en simple verdict.
translation_notes:
  register: Français moderne, clair et digne. La tournure évite le calque peu naturel « au jour où » tout en gardant le contraste et la précision rituelle du texte hébreu.
