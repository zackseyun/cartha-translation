source:
  edition: WLC
  text: וְ/אִם֮ רָאָ֣ה הַ/כֹּהֵן֒ וְ/הִנֵּה֙ כֵּהָ֣ה הַ/נֶּ֔גַע אַחֲרֵ֖י הֻכַּבֵּ֣ס אֹת֑/וֹ וְ/קָרַ֣ע אֹת֗/וֹ מִן הַ/בֶּ֨גֶד֙ א֣וֹ מִן הָ/ע֔וֹר א֥וֹ מִן הַ/שְּׁתִ֖י א֥וֹ מִן הָ/עֵֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/056.yaml
  text: But if the priest examines it[a], and behold, the spot has faded after it was washed, then he shall tear it out of the garment, or out of the leather, or out of the warp, or out of the woof.
translation:
  language: fr
  text: Mais si le prêtre l’examine et constate que la tache s’est atténuée après le lavage, il l’arrachera du vêtement, du cuir, de la chaîne ou de la trame.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit la suite conditionnelle de la procédure tout en marquant un léger contraste avec le cas précédent.
- source_word: רָאָה הַכֹּהֵן
  choice: le prêtre l’examine
  rationale: Dans ce contexte juridique d’inspection, « examine » exprime naturellement l’acte d’évaluation indiqué littéralement par « voit ».
- source_word: וְהִנֵּה
  choice: et constate que
  rationale: Rend la valeur de mise en évidence de la formule hébraïque dans un français procédural naturel, sans recourir à l’archaïsme « voici ».
- source_word: כֵּהָה הַנֶּגַע
  choice: la tache s’est atténuée
  rationale: כֵּהָה indique que l’altération est devenue moins marquée; « tache » désigne clairement la zone affectée sur une matière.
- source_word: אַחֲרֵי הֻכַּבֵּס אֹתוֹ
  choice: après le lavage
  rationale: Formulation concise qui conserve l’idée que l’objet a été lavé, sans imposer en français un pronom dont l’antécédent matériel varierait en genre.
- source_word: וְקָרַע אֹתוֹ
  choice: il l’arrachera
  rationale: Le pronom renvoie à la tache, c’est-à-dire à la partie atteinte; « arracher » exprime son retrait hors de l’objet mieux que le simple verbe « déchirer ».
- source_word: מִן הַבֶּגֶד
  choice: du vêtement
  rationale: Équivalent courant et précis de בֶּגֶד dans ce contexte.
- source_word: מִן הָעוֹר
  choice: du cuir
  rationale: Le contexte matériel indique une peau travaillée ou un objet en cuir, non la peau humaine.
- source_word: מִן הַשְּׁתִי
  choice: de la chaîne
  rationale: Terme textile français usuel pour les fils disposés dans le sens longitudinal.
- source_word: מִן הָעֵרֶב
  choice: de la trame
  rationale: Terme textile français usuel pour les fils transversaux, formant la paire technique « chaîne et trame ».
