  yaml_path: translation/ot/leviticus/013/054.yaml
  text: Then the priest shall command them to wash the thing in which the infection is[b][a], and he shall quarantine it for seven days a second time.
translation:
  language: fr
  text: Alors le prêtre ordonnera de laver l’objet où se trouve l’atteinte[a], puis il l’isolera[b] de nouveau pendant sept jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ce dans quoi se trouve l’atteinte ». L’expression hébraïque reste générale et désigne l’article atteint qui est en cours d’examen.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le tiendra enfermé »; le verbe désigne ici la mise à l’écart de l’objet pour observation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה הַכֹּהֵן
  choice: Alors le prêtre ordonnera
  rationale: Le waw avec le parfait poursuit ici la procédure légale. « Alors » rend naturellement la succession des étapes, et le futur exprime la prescription.
- source_word: וְכִבְּסוּ
  choice: de laver
  rationale: La troisième personne du pluriel renvoie à des exécutants non précisés. La construction « ordonnera de laver » reste naturelle en français sans ajouter d’agents absents de l’hébreu.
- source_word: אֵת אֲשֶׁר בּוֹ הַנָּגַע
  choice: l’objet où se trouve l’atteinte
  rationale: La tournure relative hébraïque est volontairement générale et désigne l’article examiné dans le contexte. « Objet » conserve cette portée large; « atteinte » convient à un textile ou à du cuir sans imposer une explication médicale.
- source_word: וְהִסְגִּירוֹ
  choice: puis il l’isolera
  rationale: Le verbe signifie fermer ou tenir à l’écart en vue d’un nouvel examen. « Isoler » exprime clairement la procédure sans la connotation médicale moderne plus étroite de « mettre en quarantaine ».
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: de nouveau pendant sept jours
  rationale: Cette formulation indique naturellement la répétition de la période complète de sept jours.
