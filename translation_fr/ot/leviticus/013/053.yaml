  text: וְ/אִם֮ יִרְאֶ֣ה הַ/כֹּהֵן֒ וְ/הִנֵּה֙ לֹא פָשָׂ֣ה הַ/נֶּ֔גַע בַּ/בֶּ֕גֶד א֥וֹ בַ/שְּׁתִ֖י א֣וֹ בָ/עֵ֑רֶב א֖וֹ בְּ/כָל כְּלִי עֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/053.yaml
  text: But if the priest examines it[a], and behold, the infection has not spread in the garment, or in the warp, or in the woof, or in any article of leather,
translation:
  language: fr
  text: Mais si le prêtre examine l’objet et constate que l’atteinte ne s’est pas étendue sur le vêtement, sur la chaîne ou sur la trame, ni sur aucun objet en cuir,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit la suite conditionnelle tout en marquant le contraste avec le cas précédent.
- source_word: יִרְאֶה הַכֹּהֵן וְהִנֵּה
  choice: le prêtre examine l’objet et constate
  rationale: Dans ce contexte d’inspection officielle, « examine » exprime la valeur contextuelle de ראה; « constate » rend naturellement וְהִנֵּה comme introduction au résultat observé.
- source_word: לֹא פָשָׂה הַנֶּגַע
  choice: l’atteinte ne s’est pas étendue
  rationale: « Atteinte » désigne la zone ou l’altération concernée sans imposer un diagnostic médical moderne; « ne s’est pas étendue » rend le développement spatial exprimé par פשה.
- source_word: בַּבֶּגֶד
  choice: sur le vêtement
  rationale: « Vêtement » est le terme usuel du passage; « sur » convient naturellement en français à une atteinte visible touchant une matière.
- source_word: בַשְּׁתִי
  choice: sur la chaîne
  rationale: Terme textile précis désignant les fils longitudinaux d’un tissu.
- source_word: בָעֵרֶב
  choice: sur la trame
  rationale: Terme textile moderne et précis désignant les fils transversaux; il forme en français le couple conventionnel « chaîne et trame ».
- source_word: בְּכָל כְּלִי עוֹר
  choice: sur aucun objet en cuir
  rationale: כְּלִי a ici le sens général d’objet ou d’article; « en cuir » désigne naturellement une peau travaillée. Après la négation, « aucun » rend idiomatiquement la portée de כָּל.
