  source_fidelity: 'Le texte rend correctement la séquence diagnostique hébraïque : examen sacerdotal, apparence paraissant plus profonde que la peau, poil jaune et fin dans la zone, déclaration d’impureté, puis identification comme נתק et comme צָרַעַת de la tête ou de la barbe. La tournure conditionnelle française avec « si » exprime naturellement la valeur de constat introduite par וְהִנֵּה sans ajouter de certitude médicale.'
  naturalness: Le français est clair, moderne et d’un registre approprié à une prescription rituelle. « Zone atteinte », « déclarera la personne impure » et « affection cutanée » sont lisibles et évitent à la fois l’archaïsme et une médicalisation excessive.
  terminology: « Teigne » est un équivalent français traditionnel et intelligible pour נתק ; la note signale à juste titre que l’identification médicale demeure incertaine. « Affection cutanée » rend prudemment צָרַעַת et la note écarte correctement l’assimilation automatique à la maladie de Hansen. La distinction entre le diagnostic sacerdotal et une action causative est bien maintenue.
