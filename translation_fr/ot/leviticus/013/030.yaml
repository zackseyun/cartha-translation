  variant: modern international French
source:
  edition: WLC
  text: וְ/רָאָ֨ה הַ/כֹּהֵ֜ן אֶת הַ/נֶּ֗גַע וְ/הִנֵּ֤ה מַרְאֵ֨/הוּ֙ עָמֹ֣ק מִן הָ/ע֔וֹר וּ/ב֛/וֹ שֵׂעָ֥ר צָהֹ֖ב דָּ֑ק וְ/טִמֵּ֨א אֹת֤/וֹ הַ/כֹּהֵן֙ נֶ֣תֶק ה֔וּא צָרַ֧עַת הָ/רֹ֛אשׁ א֥וֹ הַ/זָּקָ֖ן הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/030.yaml
  text: And the priest shall examine the diseased area[a], and behold, its appearance is deeper than the skin, and in it is thin yellow hair, then the priest shall pronounce him unclean; it is an itch[b], a skin disease of the head or of the beard.
translation:
  language: fr
  text: 'Le prêtre examinera la zone atteinte : si elle paraît plus profonde que la peau et qu’elle contient du poil jaune et fin, le prêtre déclarera la personne impure. C’est une teigne[a], une affection cutanée[b] de la tête ou de la barbe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne une affection particulière de la tête ou de la barbe, traditionnellement appelée « teigne » ; son identification médicale exacte est incertaine.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu traditionnellement traduit par « lèpre » désigne une catégorie étendue d’affections et ne correspond pas nécessairement à la maladie de Hansen.
    reason: cultural_note
lexical_decisions:
- source_word: נֶגַע
  choice: zone atteinte
  rationale: Dans ce contexte d’examen, le mot désigne la partie visible du corps qui présente une anomalie. « Zone atteinte » est naturel et évite les connotations trompeuses de « plaie » ou de « fléau ».
- source_word: מַרְאֵהוּ עָמֹק מִן־הָעוֹר
  choice: elle paraît plus profonde que la peau
  rationale: Cette formulation restitue le critère visuel exprimé par l’hébreu sans affirmer médicalement que l’affection pénètre réellement sous la peau.
- source_word: שֵׂעָר צָהֹב דַּק
  choice: du poil jaune et fin
  rationale: « Jaune » rend צָהֹב et « fin » rend דַּק. Le singulier collectif « du poil » convient à la pilosité de la tête ou de la barbe.
- source_word: וְטִמֵּא אֹתוֹ
  choice: le prêtre déclarera la personne impure
  rationale: Le prêtre prononce ici un constat d’impureté rituelle ; il ne rend pas lui-même la personne impure. « La personne » exprime naturellement en français la portée humaine du pronom hébreu.
- source_word: נֶתֶק
  choice: teigne
  rationale: « Teigne » est le terme français traditionnel pour cette affection localisée à la tête ou à la barbe. Le référent médical exact restant incertain, une note empêche de l’identifier sans réserve à la teigne moderne.
- source_word: צָרַעַת
  choice: affection cutanée
  rationale: Le terme hébreu couvre une catégorie plus large que la maladie de Hansen moderne. « Affection cutanée » évite l’anachronisme de « lèpre » tout en restant clair.
- source_word: הָרֹאשׁ אוֹ הַזָּקָן
  choice: de la tête ou de la barbe
  rationale: La formulation suit étroitement les deux localisations nommées dans le texte sans remplacer interprétativement « tête » par « cuir chevelu ».
theological_decisions:
- issue: Nature de l’impureté prononcée par le prêtre
  choice: déclarera la personne impure
  alternative: rendra la personne impure
  rationale: Le contexte législatif présente une décision sacerdotale sur l’état rituel de la personne, non l’action de lui communiquer une impureté.
translation_notes:
  register: Français international moderne, clair et digne. La phrase transforme וְהִנֵּה en une condition française naturelle (« si »), puisque le mot introduit ici le résultat éventuel de l’examen. Le vocabulaire médical reste volontairement non technique afin de ne pas imposer un diagnostic moderne au texte ancien.
