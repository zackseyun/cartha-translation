  naturalness: « Le prêtre l’examinera et constatera que » est moderne, naturel et conserve la portée procédurale sans transformer la phrase en proposition conditionnelle. « Sur sa calvitie postérieure ou sur sa calvitie antérieure » est clair dans ce contexte et permet de rendre la distinction lexicale avec une note de prudence.
  terminology: « Tuméfaction » et « affection » sont appropriés et ne surdéterminent pas le diagnostic. « D’un blanc rougeâtre » rend convenablement la combinaison chromatique. « Affection cutanée de la peau du corps » restitue explicitement עוֹר בָּשָׂר, sans imposer « lèpre ».
