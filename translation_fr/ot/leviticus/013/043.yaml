base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/043.yaml
  text: and the priest examines him, and behold, the swelling of the disease is whitish-red on his bald head or on his bald forehead, like the appearance of a skin disease on the flesh,
translation:
  language: fr
  text: Le prêtre l’examinera et constatera que la tuméfaction de l’affection est d’un blanc rougeâtre sur sa calvitie postérieure ou sur sa calvitie antérieure[b], semblable à l’aspect d’une affection cutanée de la peau du corps[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traditionnellement traduit par « lèpre » désigne dans le Lévitique diverses affections graves de la peau, et pas seulement la maladie de Hansen.
    reason: lexical_alternative
  - marker: b
    text: Les deux mots hébreux désignant la calvitie semblent distinguer la partie arrière de la tête de sa partie avant.
    reason: cultural_note
lexical_decisions:
- source_word: וְרָאָה אֹתוֹ הַכֹּהֵן
  choice: Le prêtre l’examinera
  rationale: Dans cette procédure sacerdotale, ראה désigne une observation diagnostique; le futur français convient à la formulation d’une prescription légale.
- source_word: וְהִנֵּה
  choice: S’il constate que
  rationale: Cette tournure naturelle en français restitue la découverte signalée par הִנֵּה dans le cadre conditionnel de la procédure, sans l’interjection archaïsante « voici ».
- source_word: שְׂאֵת הַנֶּגַע
  choice: la tuméfaction de l’affection
  rationale: שְׂאֵת désigne une lésion en relief; « tuméfaction » conserve cette idée. נֶגַע est rendu par « affection », terme suffisamment large pour ne pas imposer un diagnostic moderne précis.
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: d’un blanc rougeâtre
  rationale: La formulation conserve la couleur blanche qualifiée par une nuance rougeâtre, conformément à l’ordre et à la morphologie de l’hébreu.
- source_word: בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ
  choice: sur la partie arrière ou la partie avant de son crâne dégarni
  rationale: Les deux termes désignent vraisemblablement deux zones distinctes de calvitie, à l’arrière et à l’avant de la tête; la traduction rend explicitement ce contraste probable tout en le signalant en note.
- source_word: כְּמַרְאֵה צָרַעַת עוֹר בָּשָׂר
  choice: semblable à l’aspect d’une affection cutanée sur le corps
  rationale: « Semblable à l’aspect » préserve la comparaison diagnostique. « Affection cutanée » évite l’identification trompeuse à la seule maladie de Hansen, et « sur le corps » exprime naturellement עוֹר בָּשָׂר dans ce contexte.
theological_decisions:
- issue: Identification de צָרַעַת
  choice: affection cutanée
  alternative: lèpre
  rationale: Le terme biblique couvre une catégorie plus large que la maladie moderne appelée lèpre; ne pas l’identifier précisément préserve la portée du texte hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit le caractère procédural du passage. « Tuméfaction » est un terme médical courant assez précis pour exprimer une lésion en relief, tandis qu’« affection » évite un diagnostic anachronique. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
