  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: fr
  text: 'Yahweh[a] parla à Moïse et à Aaron en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH ». Traditionnellement rendu par « le SEIGNEUR » dans de nombreuses traductions françaises.'
    reason: Signaler la forme hébraïque du nom divin et l'autre convention de traduction courante.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר dans cette formule narrative introduit une prise de parole divine. « Parla » est naturel et conserve la distinction possible avec le verbe plus courant « dire ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre, conformément au texte hébreu, plutôt que remplacé par un titre.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: à Moïse et à Aaron
  rationale: La préposition marque les deux destinataires. En français, il n'est pas nécessaire de répéter « à » devant le second nom pour rendre clairement la coordination.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'Cet infinitif introduit le contenu du discours qui suit. « En ces termes : » restitue naturellement sa fonction en français et assure la liaison avec le verset suivant.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » en préserve la fonction de nom personnel sans lui substituer un titre ; la note signale la convention traditionnelle.
translation_notes:
  register: 'Français moderne, digne et fluide. Le passé simple convient à l''ouverture narrative et « en ces termes : » introduit clairement la parole développée au verset suivant.'
