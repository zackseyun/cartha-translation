  text: א֤וֹ בִֽ/שְׁתִי֙ א֣וֹ בְ/עֵ֔רֶב לַ/פִּשְׁתִּ֖ים וְ/לַ/צָּ֑מֶר א֣וֹ בְ/ע֔וֹר א֖וֹ בְּ/כָל מְלֶ֥אכֶת עֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/048.yaml
  text: or in the warp or in the woof of the linen or of the wool[a], or in leather[c][b], or in any article made of leather—
translation:
  language: fr
  text: ou dans la chaîne ou dans la trame, qu’elles soient de lin ou de laine[a], ou dans une peau, ou dans tout objet en cuir[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la chaîne ou dans la trame, pour le lin et pour la laine »; il peut s’agir de fils ou d’une étoffe de l’une ou l’autre matière.'
    reason: lexical_ambiguity
  - marker: b
    text: 'Plus formellement : « dans tout ouvrage de peau ». Le même mot hébreu peut désigner une peau ou du cuir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתִי
  choice: chaîne
  rationale: Terme textile français standard désignant les fils longitudinaux d’un tissu; il forme avec « trame » la paire technique naturelle.
- source_word: עֵרֶב
  choice: trame
  rationale: Désigne les fils transversaux passés entre les fils de chaîne. « Trame » est le terme moderne courant en français.
- source_word: לַפִּשְׁתִּים
  choice: de lin
  rationale: Le nom peut désigner le lin comme plante ou matière; dans ce contexte textile, « lin » désigne naturellement les fils ou l’étoffe issus de cette fibre.
- source_word: וְלַצָּמֶר
  choice: ou de laine
  rationale: צֶמֶר désigne la laine; la coordination française explicite l’alternative entre les deux matières.
- source_word: עוֹר
  choice: peau
  rationale: Le mot hébreu désigne une peau animale et peut, selon son état ou son usage, correspondre à « peau » ou « cuir ». Dans la première occurrence isolée, « peau » conserve l’étendue sémantique du terme.
- source_word: בְּכָל מְלֶאכֶת עוֹר
  choice: dans tout objet en cuir
  rationale: מְלָאכָה désigne ici un produit façonné. « Objet en cuir » rend clairement l’idée d’un article fabriqué à partir d’une peau.
- source_word: אוֹ ... אוֹ
  choice: ou… ou
  rationale: La répétition marque les différents supports possibles; elle est conservée autant que le permet un français naturel.
