  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֨ה כִסְּתָ֤ה הַ/צָּרַ֨עַת֙ אֶת כָּל בְּשָׂר֔/וֹ וְ/טִהַ֖ר אֶת הַ/נָּ֑גַע כֻּלּ֛/וֹ הָפַ֥ךְ לָבָ֖ן טָה֥וֹר הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/013.yaml
  text: and the priest examines him[a], and behold, the skin disease has covered all his flesh, then he shall pronounce the affected person clean; all of it has turned white[b]; he is clean.
translation:
  language: fr
  text: 'Le prêtre l’examinera et, si l’affection de la peau a couvert tout son corps, il déclarera pur celui qui en est atteint[a]. Tout est devenu blanc : il est pur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, le prêtre « déclarera pur le mal » ou « la marque »; le verdict de pureté concerne la personne qui en est atteinte.
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָאָה
  choice: examinera
  rationale: Dans ce contexte de constat sacerdotal, le verbe désigne un examen plutôt qu’un simple regard; le futur convient à la formulation juridique française.
- source_word: הַצָּרַעַת
  choice: l’affection de la peau
  rationale: צָרַעַת recouvre ici une catégorie plus large que la lèpre moderne; cette expression évite une identification médicale trompeuse.
- source_word: אֶת כָּל בְּשָׂרוֹ
  choice: tout son corps
  rationale: Bien que בָּשָׂר signifie littéralement « chair », le contexte vise toute la surface corporelle; « tout son corps » est naturel et précis en français.
- source_word: וְטִהַר אֶת הַנָּגַע
  choice: il déclarera pur celui qui en est atteint
  rationale: Le piel de טהר exprime un verdict de pureté, non une guérison. L’objet hébreu est littéralement l’affection ou la marque, mais la décision porte sur la personne qui la présente.
- source_word: כֻּלּוֹ הָפַךְ לָבָן
  choice: tout est devenu blanc
  rationale: La formulation conserve l’accent sur la totalité et le changement de couleur sans préciser abusivement le référent du pronom hébreu.
- source_word: טָהוֹר הוּא
  choice: il est pur
  rationale: « Pur » est le terme français usuel dans le système de pureté du Lévitique; aucun ajout tel que « rituellement » n’est nécessaire.
theological_decisions:
- issue: Identification de צָרַעַת
  choice: l’affection de la peau
  alternative: la lèpre
  rationale: Le terme hébreu ne correspond pas nécessairement à la maladie de Hansen et désigne plusieurs atteintes dans le Lévitique; la traduction évite donc une précision médicale anachronique.
- issue: Nature de l’action sacerdotale exprimée par וְטִהַר
  choice: il déclarera pur celui qui en est atteint
  alternative: il purifiera l’affection
  rationale: Le prêtre rend un verdict de pureté; il ne soigne pas ni ne produit lui-même la purification. La formulation française rend explicite la personne concernée tout en signalant en note la construction hébraïque.
- issue: Relation logique de כֻּלּוֹ הָפַךְ לָבָן
  choice: Puisque tout est devenu blanc
  alternative: Tout est devenu blanc
  rationale: Le contexte et l’asyndète permettent de comprendre cette proposition comme le motif du verdict. « Puisque » rend cette relation naturellement, sans modifier le critère énoncé.
translation_notes:
  register: Français international moderne, digne et accessible. « Affection de la peau » évite le terme médicalement trompeur « lèpre ». La tournure juridique au futur maintient le style procédural du passage.
