review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : inspection sacerdotale, atteinte cutanée couvrant entièrement le corps, déclaration de pureté et blanchiment complet. Toutefois, « Puisque » introduit explicitement une relation causale que l''hébreu énonce sans connecteur causal, et la note qualifie à tort d''« littérale » une formulation française grammaticalement inadéquate (« déclarera pure l’affection »).'
  naturalness: Le français est moderne et globalement naturel. « Tout est devenu blanc » conserve utilement l'ambiguïté du pronom hébreu, mais gagne à être détaché de l'inférence causale ajoutée par « Puisque ».
  terminology: « Affection de la peau » évite à juste titre l'anachronisme médical de « lèpre ». « Pur » et « déclarera pur » conviennent au registre des règles de pureté du Lévitique. La note doit employer « mal » ou « marque » sans lui attribuer artificiellement un accord féminin dans la construction française.
  issues:
  - severity: medium
    issue: Ajout de « Puisque »
    rationale: כֻּלּוֹ הָפַךְ לָבָן est une affirmation explicative juxtaposée (« tout entier est devenu blanc »), non une proposition introduite par un marqueur causal. La causalité est contextuellement compréhensible, mais ne doit pas être imposée dans le texte.
  - severity: medium
    issue: Note présentée comme littérale mais grammaticalement et lexicalement imprécise
    rationale: L'objet hébreu est הַנֶּגַע, « le mal / l'atteinte / la marque », masculin. « Il déclarera pure l’affection » n'est ni une citation littérale ni une formulation française correcte. La note doit signaler que l'objet grammatical est le mal ou la marque, tandis que le verdict concerne la personne.
  revised_text: 'Le prêtre l’examinera et, si l’affection de la peau a couvert tout son corps, il déclarera pur celui qui en est atteint[a]. Tout est devenu blanc : il est pur.'
  revised_footnotes:
  - marker: a
    text: Littéralement, le prêtre « déclarera pur le mal » ou « la marque »; le verdict de pureté concerne la personne qui en est atteinte.
    reason: alternative_reading
  revision_rationale: La révision retire la causalité explicitement ajoutée par « Puisque » tout en gardant la juxtaposition explicative du texte hébreu et son ambiguïté quant au référent de « tout ». Elle corrige aussi la note afin qu'elle rende exactement la construction hébraïque sans faute d'accord ni fausse littéralité. Le reste de la terminologie et le futur juridique sont conservés.
