revisions:
- from: Le prêtre l’examinera et, si l’affection de la peau a couvert tout son corps, il déclarera pur celui qui en est atteint[a]. Puisque tout est devenu blanc, il est pur.
  to: 'Le prêtre l’examinera et, si l’affection de la peau a couvert tout son corps, il déclarera pur celui qui en est atteint[a]. Tout est devenu blanc : il est pur.'
  rationale: La révision retire la causalité explicitement ajoutée par « Puisque » tout en gardant la juxtaposition explicative du texte hébreu et son ambiguïté quant au référent de « tout ». Elle corrige aussi la note afin qu'elle rende exactement la construction hébraïque sans faute d'accord ni fausse littéralité. Le reste de la terminologie et le futur juridique sont conservés.
