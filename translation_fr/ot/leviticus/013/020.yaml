  to: 'Le prêtre l’examinera : son aspect paraît enfoncé sous le niveau de la peau et les poils qui s’y trouvent sont devenus blancs ; le prêtre le déclarera impur. C’est une manifestation d’une maladie de peau[a] qui s’est déclarée dans le furoncle.'
