source:
  edition: WLC
  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה מַרְאֶ֨/הָ֙ שָׁפָ֣ל מִן הָ/ע֔וֹר וּ/שְׂעָרָ֖/הּ הָפַ֣ךְ לָבָ֑ן וְ/טִמְּא֧/וֹ הַ/כֹּהֵ֛ן נֶֽגַע צָרַ֥עַת הִ֖וא בַּ/שְּׁחִ֥ין פָּרָֽחָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/020.yaml
  text: And the priest shall examine it[a], and behold, its appearance is deeper than the skin, and its hair has turned white; then the priest shall pronounce him unclean. It is an outbreak of leprosy; it has broken out in the boil.
translation:
  language: fr
  text: 'Le prêtre l’examinera : son aspect paraît enfoncé sous le niveau de la peau et les poils qui s’y trouvent sont devenus blancs ; le prêtre le déclarera impur. C’est une manifestation d’une maladie de peau[a] qui s’est déclarée dans le furoncle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu צָרַעַת, traditionnellement traduit par « lèpre », désigne probablement dans le Lévitique diverses affections graves de la peau, et non exclusivement la maladie de Hansen moderne.
    reason: Préciser la portée du terme hébreu et éviter une identification médicale anachronique.
lexical_decisions:
- source_word: וְרָאָה
  choice: l’examinera
  rationale: Dans ce contexte de diagnostic sacerdotal, ראה désigne une inspection attentive plutôt qu’un simple regard.
- source_word: וְהִנֵּה
  choice: si
  rationale: Dans cette procédure conditionnelle, le marqueur attire l’attention sur les signes constatés. Le français naturel exprime ici cette valeur par « si », sans l’archaïsme de « voici ».
- source_word: מַרְאֶהָ שָׁפָל מִן־הָעוֹר
  choice: son aspect paraît enfoncé sous le niveau de la peau
  rationale: Cette formulation rend l’apparence déprimée de la zone atteinte, tout en conservant la nuance d’observation visuelle portée par מַרְאֶה.
- source_word: וּשְׂעָרָהּ הָפַךְ לָבָן
  choice: les poils qui s’y trouvent sont devenus blancs
  rationale: Le suffixe renvoie à la zone atteinte. Cette tournure évite l’ambiguïté peu naturelle de « ses poils » en français.
- source_word: וְטִמְּאוֹ
  choice: le prêtre déclarera cet homme impur
  rationale: Le prêtre établit officiellement le statut rituel de la personne ; il ne la rend pas physiquement impure.
- source_word: נֶגַע צָרַעַת
  choice: une atteinte de maladie de peau
  rationale: נגע désigne ici une atteinte ou lésion manifeste, tandis que צרעת couvre dans le Lévitique un ensemble plus large que la maladie de Hansen moderne.
- source_word: בַּשְּׁחִין
  choice: dans le furoncle
  rationale: שְׁחִין désigne un furoncle ou une inflammation cutanée ; « furoncle » est précis et courant.
- source_word: פָּרָחָה
  choice: s’est déclarée
  rationale: Le verbe évoque ici l’apparition ou l’éruption de la maladie dans le furoncle, sans affirmer nécessairement qu’elle s’est étendue ailleurs.
theological_decisions:
- issue: Sens de צָרַעַת dans les règles de pureté du Lévitique
  choice: maladie de peau
  alternative: lèpre
  rationale: « Lèpre » risquerait d’identifier à tort צָרַעַת à la seule maladie de Hansen. La formulation retenue préserve la portée plus large du terme dans le texte hébreu, tandis que la note signale la traduction traditionnelle.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le caractère procédural du diagnostic sacerdotal, tout en évitant les tournures archaïques et une précision médicale que l’hébreu ne permet pas.
