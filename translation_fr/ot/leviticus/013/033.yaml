  text: then he shall shave himself[a], but he shall not shave the scaly spot[b]; and the priest shall isolate the scaly spot for seven days a second time.
translation:
  language: fr
  text: Il se rasera, mais il ne rasera pas la zone atteinte[a]. Le prêtre mettra de nouveau à l’isolement la personne atteinte pendant sept jours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne une affection particulière de la tête ou de la barbe, probablement accompagnée de chute des poils. La zone touchée ne doit pas être rasée; il est probable que cela permette au prêtre de l’examiner après le rasage des alentours.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: 'Littéralement : « le prêtre isolera la zone atteinte ». Dans ce contexte, la mise à l’écart concerne vraisemblablement la personne qui présente cette affection.'
    reason: textual_clarification
lexical_decisions:
- source_word: וְהִתְגַּלָּח
  choice: Il se rasera
  rationale: 'Le hitpael de גלח a ici un sens réfléchi : la personne se rase ou se fait raser. Le futur français convient à l’instruction légale et procédurale.'
- source_word: הַנֶּתֶק
  choice: la zone atteinte
  rationale: נֶתֶק désigne dans ce chapitre une affection particulière du cuir chevelu ou de la barbe, notamment associée à la chute des poils. « Zone atteinte » reste clair sans réduire le terme à un symptôme incertain comme les démangeaisons ou les squames.
- source_word: וְאֶת הַנֶּתֶק לֹא יְגַלֵּחַ
  choice: mais il ne rasera pas la zone atteinte
  rationale: L’objet direct est la zone touchée elle-même. La traduction conserve cette formulation sans préciser, au-delà de l’hébreu, qu’il faudrait raser autour.
- source_word: וְהִסְגִּיר
  choice: isolera
  rationale: Dans Lévitique 13, le verbe indique une mise à l’écart temporaire en vue d’une nouvelle observation. « Isoler » est moderne et évite les connotations médicales plus étroites de « mettre en quarantaine ».
- source_word: שֵׁנִית
  choice: de nouveau
  rationale: L’adverbe indique qu’une deuxième période de sept jours est imposée. « De nouveau » est naturel en français et exprime clairement la répétition.
