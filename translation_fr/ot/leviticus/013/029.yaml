  text: When a man or a woman has an infection on the head or on the beard[b][a],
translation:
  language: fr
  text: Lorsqu’un homme ou une femme a une lésion[a] sur la tête[b] ou dans la barbe,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une affection », « une maladie » ou « une marque » ; le terme hébreu néga‘ désigne largement, dans le Lévitique, une lésion ou une atteinte visible examinée par le prêtre.
    reason: lexical_alternative
  - marker: b
    text: Hébreu « tête » ; dans ce contexte, il pourrait s’agir plus précisément du cuir chevelu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ ... אִשָּׁה
  choice: un homme ou une femme
  rationale: L’hébreu nomme explicitement les deux sexes; la traduction conserve cette formulation plutôt que de la réduire à un terme générique.
- source_word: כִּי
  choice: Lorsqu’
  rationale: Dans cette formulation juridique, כִּי introduit le cas à examiner. « Lorsqu’ » exprime naturellement cette valeur conditionnelle en français.
- source_word: יִהְיֶה בּוֹ
  choice: présente
  rationale: Littéralement, la tournure signifie qu’une affection « est en/sur » la personne. « Présente » est idiomatique dans un contexte d’examen et n’implique pas de diagnostic moderne précis.
- source_word: נָגַע
  choice: lésion
  rationale: Dans Lévitique 13, נֶגַע est un terme large désignant une atteinte ou une marque visible soumise à l’examen du prêtre. « Lésion » convient au contexte sans identifier abusivement une maladie ou une infection moderne.
- source_word: בְּ/רֹאשׁ
  choice: à la tête
  rationale: Le mot hébreu désigne la tête. Le contexte peut viser plus précisément le cuir chevelu, mais le texte source emploie le terme plus large.
- source_word: בְ/זָקָן
  choice: à la barbe
  rationale: זָקָן signifie « barbe ». La tournure « à la barbe » indique naturellement en français la zone où se trouve la lésion.
theological_decisions: []
