revisions:
- from: Le septième jour, il examinera l’atteinte. Si elle s’est étendue sur le vêtement, sur les fils de chaîne ou de trame, ou sur le cuir, quel que soit l’usage auquel ce cuir est destiné[b], cette atteinte est une tsaraat destructrice[a] ; l’objet est impur.
  to: Le septième jour, il examinera l’atteinte. Si elle s’est étendue sur le vêtement, sur les fils de chaîne ou de trame, sur le cuir ou sur tout objet fabriqué en cuir[b], cette atteinte est une tsaraat destructrice[a] ; elle est impure.
  rationale: La révision rend explicitement la portée de la clause relative au cuir et rétablit l’atteinte comme référent de l’impureté finale. Elle conserve les choix terminologiques solides du projet, notamment la translittération « tsaraat », sans médicaliser ni doctrinaliser le texte.
