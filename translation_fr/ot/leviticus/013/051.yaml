  text: וְ/רָאָ֨ה אֶת הַ/נֶּ֜גַע בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י כִּֽי פָשָׂ֤ה הַ/נֶּ֨גַע֙ בַּ֠/בֶּגֶד אֽוֹ בַ/שְּׁתִ֤י אֽוֹ בָ/עֵ֨רֶב֙ א֣וֹ בָ/ע֔וֹר לְ/כֹ֛ל אֲשֶׁר יֵעָשֶׂ֥ה הָ/ע֖וֹר לִ/מְלָאכָ֑ה צָרַ֧עַת מַמְאֶ֛רֶת הַ/נֶּ֖גַע טָמֵ֥א הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/051.yaml
  text: On the seventh day he shall examine the infection[a], and if the infection has spread in the garment, or in the warp, or in the woof, or in the leather, in anything for which leather is made for work, the infection is a destructive skin disease[c][b]; it is unclean.
translation:
  language: fr
  text: Le septième jour, il examinera l’atteinte. Si elle s’est étendue sur le vêtement, sur les fils de chaîne ou de trame, sur le cuir ou sur tout objet fabriqué en cuir[b], cette atteinte est une tsaraat destructrice[a] ; elle est impure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu tsaraat, traditionnellement traduit par « lèpre », désigne dans le Lévitique plusieurs sortes d’atteintes rendant impur ; il peut aussi s’appliquer aux vêtements et au cuir.
    reason: Préciser la portée du terme technique sans l’assimiler à une maladie moderne déterminée.
  - marker: b
    text: Littéralement, « sur le cuir, pour tout ce que le cuir est travaillé en ouvrage ».
    reason: Signaler la formulation hébraïque générale, qui inclut les objets fabriqués en cuir.
lexical_decisions:
- source_word: וְרָאָה
  choice: il examinera
  rationale: Dans cette procédure sacerdotale, le verbe désigne une inspection attentive plutôt que le simple fait de voir.
- source_word: הַנֶּגַע
  choice: l’atteinte
  rationale: Ce terme convient à une zone affectée sur un vêtement ou du cuir sans imposer à tort un diagnostic médical moderne.
- source_word: פָשָׂה
  choice: s’est étendue
  rationale: Le verbe indique que l’atteinte a gagné du terrain ; le féminin reprend naturellement « atteinte ».
- source_word: בֶּגֶד
  choice: vêtement
  rationale: Rend le sens courant du nom tout en conservant le cadre juridique du passage.
- source_word: שְׁתִי ... עֵרֶב
  choice: fils de chaîne ou de trame
  rationale: Ce sont les termes techniques français usuels pour les fils longitudinaux et transversaux d’un tissu.
- source_word: עוֹר
  choice: cuir
  rationale: Le contexte vise une peau travaillée et destinée à la fabrication ou à un usage pratique.
- source_word: לְכֹל אֲשֶׁר יֵעָשֶׂה הָעוֹר לִמְלָאכָה
  choice: quel que soit l’usage auquel ce cuir est destiné
  rationale: Cette formulation française naturelle conserve la portée générale de la construction hébraïque, qui englobe tout emploi du cuir.
- source_word: צָרַעַת מַמְאֶרֶת
  choice: une tsaraat destructrice
  rationale: La translittération préserve le terme technique de la législation lévitique, lequel ne correspond pas exactement à la lèpre moderne et peut affecter des matériaux ; « destructrice » exprime le caractère nuisible ou rongeant de מַמְאֶרֶת.
- source_word: טָמֵא הוּא
  choice: l’objet est impur
  rationale: Le pronom hébreu renvoie à ce qui est examiné. « Impur » exprime ici le statut cultuel, tandis que « l’objet » lève une ambiguïté peu naturelle en français.
theological_decisions:
- issue: Sens de צָרַעַת dans les lois de pureté du Lévitique
  choice: tsaraat
  alternative: lèpre ; maladie de peau ; affection qui rend impur
  rationale: Le mot hébreu couvre diverses atteintes et s’applique ici à un vêtement ou à du cuir. Le conserver sous une forme translittérée évite de l’identifier à la maladie de Hansen ou de parler improprement d’une maladie de peau sur un objet.
- issue: Portée de טָמֵא
  choice: impur
  alternative: rituellement impur
  rationale: Le contexte lévitique indique déjà qu’il s’agit d’un statut cultuel. L’ajout de « rituellement » serait explicatif plutôt que directement présent dans le texte.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le caractère procédural de la loi, emploie le vocabulaire textile français standard et évite aussi bien l’archaïsme « lèpre » pour les matériaux qu’un diagnostic médical anachronique.
