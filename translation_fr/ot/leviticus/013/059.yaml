id: LEV.13.59
reference: Leviticus 13:59
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זֹ֠את תּוֹרַ֨ת נֶֽגַע צָרַ֜עַת בֶּ֥גֶד הַ/צֶּ֣מֶר א֣וֹ הַ/פִּשְׁתִּ֗ים א֤וֹ הַ/שְּׁתִי֙ א֣וֹ הָ/עֵ֔רֶב א֖וֹ כָּל כְּלִי ע֑וֹר לְ/טַהֲר֖/וֹ א֥וֹ לְ/טַמְּאֽ/וֹ־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/059.yaml
  text: This is the law for an outbreak of leprous disease in a wool garment or a linen garment[a], or in the warp or the woof, or in any leather article, for pronouncing it clean or pronouncing it unclean.
translation:
  language: fr
  text: Voici la loi concernant une atteinte de lèpre[a] sur un vêtement de laine ou de lin, sur les fils de chaîne ou de trame, ou sur tout objet en cuir, afin de le déclarer pur ou impur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traditionnellement rendu par « lèpre » ne désigne pas nécessairement la maladie de Hansen; dans ce chapitre, il peut aussi s'appliquer à des vêtements, au cuir et aux maisons.
    reason: Clarifier la portée non strictement médicale de צָרַעַת et éviter une identification anachronique.
lexical_decisions:
- source_word: תּוֹרַת
  choice: la loi concernant
  rationale: Dans cette formule récapitulative sacerdotale, תּוֹרָה désigne la règle ou la procédure qui régit les cas précédents. « La loi concernant » rend naturellement le rapport construit.
- source_word: נֶגַע צָרַעַת
  choice: une atteinte de lèpre
  rationale: נֶגַע désigne ici une manifestation visible affectant une matière, tandis que צָרַעַת nomme la catégorie rituelle traditionnelle. « Atteinte » convient mieux à un objet que « maladie »; la note empêche d'assimiler le terme à un diagnostic moderne précis.
- source_word: בֶּגֶד הַצֶּמֶר א֣וֹ הַפִּשְׁתִּים
  choice: un vêtement de laine ou de lin
  rationale: Le mot « vêtement » gouverne naturellement les deux matières dans la construction hébraïque et n'a pas besoin d'être répété en français.
- source_word: הַשְּׁתִי ... הָעֵרֶב
  choice: les fils de chaîne ou de trame
  rationale: « Chaîne » et « trame » sont les termes textiles français usuels; l'ajout de « fils » les rend immédiatement compréhensibles.
- source_word: כָּל כְּלִי עוֹר
  choice: tout objet en cuir
  rationale: כְּלִי est un terme général pour un objet, un article ou un ustensile. « Objet en cuir » reste naturel et suffisamment large.
- source_word: לְטַהֲרוֹ א֥וֹ לְטַמְּאוֹ
  choice: afin de le déclarer pur ou impur
  rationale: Dans ce cadre légal sacerdotal, les verbes indiquent l'établissement d'un statut rituel plutôt qu'un nettoyage ou une souillure matériels. « Déclarer » conserve cette valeur juridique et rituelle.
theological_decisions:
- issue: Sens de צָרַעַת lorsqu'il affecte des textiles ou du cuir
  choice: atteinte de lèpre, avec note explicative
  alternative: moisissure; maladie de peau; tsaraat
  rationale: Le terme hébreu couvre une catégorie rituelle plus large que la maladie de Hansen et s'applique ici à des objets. La formulation retenue préserve le lien traditionnel avec « lèpre » sans imposer un diagnostic médical moderne; la note explicite la portée du terme.
translation_notes:
  register: Français international moderne, sobre et juridique. « Voici la loi concernant » conserve la formule récapitulative; « fils de chaîne ou de trame » emploie la terminologie textile courante sans archaïsme.
