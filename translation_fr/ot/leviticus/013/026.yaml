source:
  edition: WLC
  text: וְ/אִ֣ם יִרְאֶ֣/נָּה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה אֵֽין בַּ/בֶּהֶ֨רֶת֙ שֵׂעָ֣ר לָבָ֔ן וּ/שְׁפָלָ֥ה אֵינֶ֛/נָּה מִן הָ/ע֖וֹר וְ/הִ֣וא כֵהָ֑ה וְ/הִסְגִּיר֥/וֹ הַ/כֹּהֵ֖ן שִׁבְעַ֥ת יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/026.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in the bright spot, and it is not deeper than the skin, but it is faded[b], then the priest shall isolate him seven days.
translation:
  language: fr
  text: Mais si le prêtre l’examine et constate qu’il n’y a pas de poil blanc dans la tache claire, qu’elle n’est pas en creux par rapport à la peau[a] et qu’elle est terne, le prêtre isolera cette personne pendant sept jours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elle n’est pas plus basse que la peau », c’est-à-dire qu’elle ne paraît pas enfoncée par rapport à la peau qui l’entoure.
    reason: lexical_alternative
  - marker: b
    text: Ou « mettra cette personne à l’écart », « la gardera à l’isolement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֶנָּה
  choice: l’examine
  rationale: Le verbe signifie littéralement « voir », mais, dans ce contexte de constat sacerdotal, « examiner » exprime naturellement l’inspection formelle sans ajouter de diagnostic médical moderne.
- source_word: וְהִנֵּה
  choice: et constate que
  rationale: Cette formulation française restitue la force constatative du marqueur hébreu dans une phrase naturelle, plutôt que le calque plus solennel « et voici ».
- source_word: בַּבֶּהֶרֶת
  choice: dans la tache claire
  rationale: Le nom désigne ici une marque cutanée visible, claire ou brillante. « Tache claire » conserve cette nuance sans identifier abusivement une affection médicale précise.
- source_word: שֵׂעָר לָבָן
  choice: de poil blanc
  rationale: Le singulier collectif hébreu est rendu par un singulier de masse naturel en français dans la tournure négative.
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: elle n’est pas en creux par rapport à la peau
  rationale: L’adjectif exprime une position basse ou déprimée. « En creux » rend clairement le critère visuel tout en évitant de suggérer une profondeur interne mesurée.
- source_word: כֵהָה
  choice: elle est terne
  rationale: Le terme indique un aspect atténué, peu vif. « Terne » convient à l’apparence d’une marque et préserve cette nuance sans la confondre avec sa couleur claire.
- source_word: וְהִסְגִּירוֹ
  choice: le prêtre isolera cette personne
  rationale: Le verbe signifie fermer, retenir ou mettre à l’écart. « Isoler » décrit sobrement la mesure d’observation sans importer toutes les connotations sanitaires modernes de « mettre en quarantaine ». « Cette personne » explicite naturellement le référent humain du suffixe masculin.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: Rendu direct et idiomatique de la durée indiquée.
