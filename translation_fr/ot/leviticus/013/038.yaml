source:
  edition: WLC
  text: וְ/אִישׁ֙ אֽוֹ אִשָּׁ֔ה כִּֽי יִהְיֶ֥ה בְ/עוֹר בְּשָׂרָ֖/ם בֶּהָרֹ֑ת בֶּהָרֹ֖ת לְבָנֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/038.yaml
  text: And if a man or a woman has bright spots on the skin of the body[a], white bright spots,
translation:
  language: fr
  text: Si un homme ou une femme présente sur la peau de son corps des taches claires, des taches blanches[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des taches d’un blanc éclatant » (pour l’ensemble de l’expression).'
    reason: La construction peut être comprise comme une expression renforcée décrivant des taches nettement ou vivement blanches.
lexical_decisions:
- source_word: וְ/אִישׁ ... אִשָּׁה
  choice: un homme ou une femme
  rationale: La formulation nomme explicitement les deux sexes et convient au style casuistique du passage.
- source_word: כִּי יִהְיֶה
  choice: si ... présente
  rationale: Dans ce contexte de diagnostic légal, כִּי introduit un cas éventuel. « Présente » exprime naturellement en français l’apparition de signes cutanés.
- source_word: בְּעוֹר בְּשָׂרָם
  choice: sur la peau de son corps
  rationale: Cette formulation conserve à la fois עוֹר, « peau », et la référence corporelle de בָּשָׂר. Le possessif singulier se rapporte distributivement à l’homme ou à la femme.
- source_word: בֶּהָרֹת
  choice: taches claires
  rationale: Le nom désigne ici des marques cutanées claires ou brillantes. « Taches claires » est précis, naturel et non diagnostique en français moderne.
- source_word: בֶּהָרֹת לְבָנֹת
  choice: des taches blanches
  rationale: La reprise de « taches » préserve la répétition hébraïque, tandis que « blanches » rend explicitement לְבָנֹת.
