source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֣ם אֶת מִשְׁמַרְתִּ֗/י לְ/בִלְתִּ֨י עֲשׂ֜וֹת מֵ/חֻקּ֤וֹת הַ/תּֽוֹעֵבֹת֙ אֲשֶׁ֣ר נַעֲשׂ֣וּ לִ/פְנֵי/כֶ֔ם וְ/לֹ֥א תִֽטַּמְּא֖וּ בָּ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/030.yaml
  text: So you shall keep my charge[a], so as not to practice any of the abominable statutes that were practiced before you, and you shall not make yourselves unclean by them. I am Yahweh your God.
translation:
  language: fr
  text: Vous observerez mes prescriptions, afin de ne pratiquer aucune des coutumes abominables[a] qui se pratiquaient avant vous ; vous ne vous rendrez pas impurs par elles. Je suis Yahweh, votre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pratiques prescrites abominables » ou « règles abominables ». Le terme hébreu peut désigner des usages établis ou des pratiques prescrites, et pas seulement des lois formelles.
    reason: alternative lexicale
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אֶת־מִשְׁמַרְתִּי
  choice: Vous observerez donc mes prescriptions
  rationale: Le couple שׁמר / מִשְׁמֶרֶת exprime ici l’observance vigilante de ce que Dieu confie ou prescrit. « Observer mes prescriptions » est naturel en français juridique et cultuel, tout en conservant la force directive de l’imparfait hébreu.
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: afin de ne pratiquer
  rationale: La construction marque le but ou la prévention. « Pratiquer » convient aux comportements coutumiers visés et évite le français peu naturel « faire des coutumes ».
- source_word: מֵחֻקּוֹת הַתּוֹעֵבֹת
  choice: aucune des coutumes abominables
  rationale: Le מִן partitif justifie « aucune des ». חֻקּוֹת peut désigner des usages établis aussi bien que des règles formelles; dans ce contexte, « coutumes » s’accorde avec des comportements répétés. « Abominables » maintient la forte réprobation de תּוֹעֵבֹת.
- source_word: אֲשֶׁר נַעֲשׂוּ לִפְנֵיכֶם
  choice: qui se pratiquaient avant vous
  rationale: Le passif renvoie aux usages des peuples antérieurs. « Avant vous » conserve la formulation concise tout en exprimant naturellement l’antériorité dans le pays.
- source_word: וְלֹא תִטַּמְּאוּ בָּהֶם
  choice: et de ne pas vous rendre impurs par elles
  rationale: La tournure pronominale rend la valeur réflexive du verbe, tandis que « par elles » conserve la valeur instrumentale de בָּהֶם.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Je suis Yahweh, votre Dieu
  rationale: La formule d’auto-identification de l’alliance est conservée, et le nom divin יהוה est translittéré « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom propre de l’alliance. « Yahweh » le représente comme un nom plutôt que de le remplacer par un titre.
- issue: Portée morale et cultuelle de תּוֹעֵבֹת
  choice: abominables
  alternative: détestables
  rationale: « Abominables » restitue la forte qualification négative du texte sans préciser davantage si la répulsion est morale, cultuelle ou les deux.
- issue: Nature des חֻקּוֹת condamnées
  choice: coutumes
  alternative: lois / prescriptions
  rationale: Dans ce contexte, le mot vise les pratiques établies des peuples précédents. « Coutumes » évite de laisser entendre que Dieu reconnaît ces comportements comme des lois légitimes, tout en préservant dans la note l’éventail lexical.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le ton direct de l’instruction d’alliance. La répétition « pratiquer… se pratiquaient » reflète la répétition hébraïque de עשה et souligne la continuité des comportements interdits.
