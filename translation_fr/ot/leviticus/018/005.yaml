  text: וּ/שְׁמַרְתֶּ֤ם אֶת חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֔/י אֲשֶׁ֨ר יַעֲשֶׂ֥ה אֹתָ֛/ם הָ/אָדָ֖ם וָ/חַ֣י בָּ/הֶ֑ם אֲנִ֖י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/005.yaml
  text: So you shall keep my statutes and my judgments[a], which if a man does them, he shall live by them[b]. I am Yahweh.
translation:
  language: fr
  text: Vous observerez donc mes prescriptions et mes règles. L’homme[a] qui les met en pratique vivra par elles[b]. Je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « l’homme » est un singulier représentatif qui désigne toute personne.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vivra en elles ». La préposition hébraïque peut indiquer le moyen (« par elles ») ou la sphère dans laquelle on vit.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Vous observerez donc
  rationale: Le qatal précédé de la conjonction a ici une valeur injonctive dans le discours juridique. « Observer » exprime naturellement en français l’obéissance fidèle à des prescriptions, et « donc » rend le lien avec le contexte précédent.
- source_word: חֻקֹּתַי
  choice: mes prescriptions
  rationale: חֻקּוֹת désigne des dispositions établies. « Prescriptions » conserve le caractère normatif du terme sans le confondre avec מִשְׁפָּטִים.
- source_word: מִשְׁפָּטַי
  choice: mes règles
  rationale: מִשְׁפָּטִים désigne ici des règles ou dispositions juridiques. « Règles » est clair en français moderne et maintient une distinction lexicale avec « prescriptions ».
- source_word: אֲשֶׁר יַעֲשֶׂה אֹתָם
  choice: qui les mettra en pratique
  rationale: L’expression hébraïque signifie littéralement « qui les fera ». « Mettre en pratique » transmet clairement l’idée d’accomplir concrètement les commandements sans ajouter d’interprétation théologique.
- source_word: הָאָדָם
  choice: L’homme
  rationale: Le singulier הָאָדָם a ici une valeur représentative et ne vise pas un individu déterminé. « L’homme » conserve la forme du texte source; une note précise sa portée générique.
- source_word: וָחַי
  choice: vivra
  rationale: Le verbe חיה exprime la vie résultant de la mise en pratique. Le simple futur « vivra » préserve la portée ouverte de cette vie sans la limiter à la longévité, à la vie dans le pays ou à la vie éternelle.
- source_word: בָּהֶם
  choice: par elles
  rationale: '« Par elles » rend la lecture instrumentale naturelle de la préposition ב et s’accorde avec les deux noms féminins français. Une note conserve l’autre possibilité, celle de la sphère: « en les observant » ou « en elles ».'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré comme nom propre plutôt que remplacé par un titre.
theological_decisions:
- issue: Portée de « vivra par elles »
  choice: Conserver la formulation large « vivra par elles »
  alternative: Préciser qu’il vivra longtemps, qu’il vivra dans l’alliance ou qu’il obtiendra la vie éternelle
  rationale: L’hébreu ne détermine pas explicitement la nature ou l’étendue de la vie promise. La traduction laisse donc intacte cette tension théologique.
- issue: Valeur représentative de הָאָדָם
  choice: « L’homme » avec une note explicative
  alternative: « toute personne » ou « quiconque »
  rationale: La traduction conserve le singulier représentatif du texte tout en indiquant clairement dans la note qu’il inclut toute personne.
- issue: Valeur de la préposition ב dans בָּהֶם
  choice: « par elles » dans le texte
  alternative: « en elles » ou « en les observant »
  rationale: La préposition peut exprimer le moyen ou la sphère. Le texte principal retient l’expression française la plus naturelle, tandis que la note signale l’ambiguïté réelle.
translation_notes:
  register: Français moderne, clair et digne. La formulation juridique demeure perceptible sans archaïsme. La seconde phrase réorganise légèrement la proposition relative hébraïque afin de produire une syntaxe française naturelle tout en conservant la relation entre mise en pratique et vie.
