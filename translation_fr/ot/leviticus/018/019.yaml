id: LEV.18.19
reference: Leviticus 18:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶל אִשָּׁ֖ה בְּ/נִדַּ֣ת טֻמְאָתָ֑/הּ לֹ֣א תִקְרַ֔ב לְ/גַלּ֖וֹת עֶרְוָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/019.yaml
  text: You shall not approach a woman during her menstrual uncleanness to uncover her nakedness[a].
translation:
  language: fr
  text: Tu ne t’approcheras pas d’une femme pendant son impureté menstruelle[a], pour découvrir sa nudité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici le vocabulaire de l’impureté rituelle liée aux règles.
    reason: Précision lexicale sur la catégorie de pureté exprimée par נִדָּה et טֻמְאָה.
lexical_decisions:
- source_word: וְ/אֶל אִשָּׁה
  choice: d’une femme
  rationale: Avec le verbe קָרַב, la préposition אֶל forme ici l’expression « s’approcher de ». אִשָּׁה est compris au sens générique de « femme », sans marque possessive imposant « épouse ».
- source_word: בְּ/נִדַּת טֻמְאָתָהּ
  choice: pendant son impureté menstruelle
  rationale: נִדָּה désigne ici l’état lié aux règles, tandis que טֻמְאָה appartient au vocabulaire lévitique de l’impureté rituelle. Cette formulation reste claire en français moderne tout en conservant cette catégorie.
- source_word: לֹא תִקְרַב
  choice: Tu ne t’approcheras pas
  rationale: L’imparfait hébreu précédé de לֹא exprime une interdiction juridique. Le futur français convient au registre législatif et préserve l’idée de s’approcher dans une intention sexuelle donnée par le contexte.
- source_word: לְ/גַלּוֹת
  choice: pour découvrir
  rationale: L’infinitif introduit le but de l’approche. « Découvrir » maintient l’euphémisme juridique récurrent du chapitre sans l’expliciter davantage que l’hébreu.
- source_word: עֶרְוָתָהּ
  choice: sa nudité
  rationale: « Nudité » rend עֶרְוָה et conserve l’expression biblique « découvrir la nudité », employée comme euphémisme sexuel dans Lévitique 18.
theological_decisions:
- issue: Faut-il présenter טֻמְאָה comme une impureté rituelle ou comme un simple état physiologique ?
  choice: Conserver la notion d’impureté menstruelle et préciser sa portée rituelle en note.
  alternative: pendant ses règles
  rationale: טֻמְאָה relève du système lévitique de pureté rituelle. La réduire au seul phénomène physiologique effacerait une catégorie explicite du texte, tandis que la traduction retenue n’ajoute aucun jugement moral ou médical.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur d’interdiction maintient le ton juridique. L’euphémisme « découvrir sa nudité » est conservé afin de ne pas résoudre plus explicitement que le texte hébreu la portée sexuelle de la formule.
