reference: Leviticus 18:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֶרְוַ֥ת אָבִ֛י/ךָ וְ/עֶרְוַ֥ת אִמְּ/ךָ֖ לֹ֣א תְגַלֵּ֑ה אִמְּ/ךָ֣ הִ֔וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/007.yaml
  text: You shall not uncover the nakedness of your father[a], that is, the nakedness of your mother. She is your mother; you shall not uncover her nakedness.
translation:
  language: fr
  text: 'Tu ne découvriras pas la nudité de ton père[a], c’est-à-dire celle de ta mère. Elle est ta mère : tu ne découvriras pas sa nudité.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Tu ne découvriras pas la nudité de ton père et la nudité de ta mère. » La suite du verset précise que l’interdiction vise la mère : « Elle est ta mère. »'
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָהּ
  choice: la nudité de / sa nudité
  rationale: Dans Lévitique 18, l’expression גלה ערוה est une formule juridique euphémistique désignant des relations sexuelles interdites. « Nudité » conserve cette image récurrente sans l’expliciter davantage que l’hébreu.
- source_word: תְגַלֵּה / תְגַלֶּה
  choice: tu ne découvriras pas
  rationale: Le piel de גלה associé à עֶרְוָה forme la formule d’interdiction répétée dans ce chapitre. « Découvrir la nudité » en préserve à la fois l’image et le registre juridique.
- source_word: אָבִיךָ
  choice: ton père
  rationale: Traduction directe du terme de parenté avec suffixe masculin singulier de deuxième personne.
- source_word: וְעֶרְוַת אִמְּךָ
  choice: c’est-à-dire celle de ta mère
  rationale: La coordination hébraïque peut être comprise comme explicative, ce que soutient la phrase suivante, « Elle est ta mère ». « Celle » évite une répétition pesante tout en gardant clairement « nudité » comme référent.
- source_word: אִמְּךָ הִוא
  choice: Elle est ta mère
  rationale: Le pronom féminin singulier renvoie à la mère et souligne son identité dans la formulation juridique.
theological_decisions:
- issue: Sens de « la nudité de ton père »
  choice: 'La seconde expression est rendue comme une explication : « c’est-à-dire celle de ta mère » Manque ponctuation?'
  alternative: « la nudité de ton père et la nudité de ta mère »
  rationale: La dernière proposition, « Elle est ta mère », indique que la mère est le référent immédiat de l’interdiction et permet de comprendre l’atteinte à sa nudité comme une atteinte à celle du père. Une note conserve toutefois la coordination formelle de l’hébreu et l’ambiguïté qu’elle peut porter.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier reflète l’adresse hébraïque au masculin singulier. La formule « découvrir la nudité » conserve l’euphémisme juridique récurrent du chapitre.
