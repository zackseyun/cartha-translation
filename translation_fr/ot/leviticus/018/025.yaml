  text: וַ/תִּטְמָ֣א הָ/אָ֔רֶץ וָ/אֶפְקֹ֥ד עֲוֺנָ֖/הּ עָלֶ֑י/הָ וַ/תָּקִ֥א הָ/אָ֖רֶץ אֶת יֹשְׁבֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/025.yaml
  text: So the land became unclean[a], and I punished its iniquity upon it[c][b], and the land vomited out its inhabitants.
translation:
  language: fr
  text: Le pays est donc devenu impur[a]. Je lui ai demandé compte de sa faute[b], et le pays a vomi ses habitants[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a été souillé ». Le verbe hébreu peut décrire le pays comme devenu impur ou comme ayant été souillé.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « j’ai visité sa faute sur lui » ; il s’agit d’un idiome signifiant que Dieu demande compte de la faute et la sanctionne.'
    reason: lexical_alternative
  - marker: c
    text: Ou « a rejeté ». L’hébreu emploie l’image concrète du vomissement pour décrire l’expulsion des habitants du pays.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּטְמָא
  choice: est devenu impur
  rationale: Le verbe טמא décrit ici l’état d’impureté dans lequel le pays est entré à cause des pratiques mentionnées dans le contexte. « Est devenu impur » conserve la valeur résultative sans préciser à tort si le pays s’est souillé lui-même ou a été souillé.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans Lévitique 18, אֶרֶץ désigne le territoire habité, en particulier le pays de Canaan, plutôt que la terre entière. « Le pays » convient donc mieux que « la terre ».
- source_word: וָאֶפְקֹד עֲוֺנָהּ עָלֶיהָ
  choice: Je lui ai demandé compte de sa faute
  rationale: Avec עָוֹן, פקד exprime ici l’intervention judiciaire par laquelle Dieu demande compte d’une faute et la sanctionne. Cette formulation française rend l’idiome naturellement tout en maintenant l’action directe de Dieu.
- source_word: עֲוֺנָהּ
  choice: sa faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou les conséquences qu’elle entraîne. « Faute » garde le poids moral du terme dans un français actuel sans trancher en faveur de la seule culpabilité ou de la seule peine.
- source_word: וַתָּקִא
  choice: a vomi
  rationale: קיא signifie concrètement « vomir ». Le choix conserve la personnification frappante du pays qui rejette ses habitants, plutôt que d’atténuer l’image par « a expulsé ».
- source_word: יֹשְׁבֶיהָ
  choice: ses habitants
  rationale: Le participe de ישב désigne collectivement ceux qui habitent le pays. « Ses habitants » est concis, naturel et fidèle.
theological_decisions:
- issue: Personnification du pays face à la souillure
  choice: Conserver l’image selon laquelle le pays « a vomi ses habitants ».
  alternative: Le pays a expulsé ses habitants.
  rationale: L’hébreu personnifie volontairement le pays et relie ainsi la faute, l’impureté, le jugement divin et l’expulsion. Une formulation atténuée ferait perdre cette tension théologique et cette image concrète.
- issue: Sens judiciaire de וָאֶפְקֹד עֲוֺנָהּ עָלֶיהָ
  choice: Je lui ai demandé compte de sa faute.
  alternative: J’ai puni sa faute sur lui.
  rationale: La traduction retenue exprime l’intervention judiciaire de Dieu sans produire une tournure française obscure. Elle préserve aussi la latitude sémantique de עָוֹן, qui peut évoquer la faute, la culpabilité et sa conséquence pénale.
translation_notes:
  register: Français international moderne, clair et digne. « Pays » précise le cadre territorial de Lévitique 18. « Demander compte » rend l’idiome judiciaire sans archaïsme excessif, tandis que « a vomi » maintient volontairement la vigueur de la métaphore hébraïque.
