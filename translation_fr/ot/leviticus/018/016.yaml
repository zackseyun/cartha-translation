  yaml_path: translation/ot/leviticus/018/016.yaml
  text: You shall not uncover the nakedness of your brother’s wife[a]; it is your brother’s nakedness.
translation:
  language: fr
  text: 'Tu ne découvriras pas la nudité de la femme de ton frère[a] : c’est la nudité de ton frère.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement : « Tu n’auras pas de relations sexuelles avec la femme de ton frère. » L’hébreu emploie l’expression « découvrir la nudité ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: la nudité de
  rationale: Dans Lévitique 18, עֶרְוָה, avec le verbe גלה, appartient à une expression juridique euphémique désignant l’exposition sexuelle ou les relations sexuelles interdites. « Découvrir la nudité de » conserve l’image, le registre légal et la répétition de l’hébreu.
- source_word: אֵשֶׁת אָחִיךָ
  choice: la femme de ton frère
  rationale: אֵשֶׁת, état construit de אִשָּׁה, suivi de « ton frère », désigne ici son épouse. En français biblique et juridique, « la femme de ton frère » exprime naturellement ce lien matrimonial.
- source_word: לֹא תְגַלֵּה
  choice: tu ne découvriras pas
  rationale: L’imparfait précédé de לֹא formule une interdiction. Le futur français à valeur prescriptive maintient le registre législatif de l’hébreu sans ajouter de nuance étrangère.
- source_word: עֶרְוַת אָחִיךָ הִוא
  choice: c’est la nudité de ton frère
  rationale: Cette formulation conserve l’identification juridique et sexuelle exprimée par l’hébreu ainsi que la répétition de עֶרְוָה, sans la remplacer par une explication interprétative.
theological_decisions:
- issue: Faut-il expliciter l’expression euphémique comme une interdiction directe des relations sexuelles ?
  choice: Conserver dans le texte l’expression hébraïque « découvrir la nudité »
  alternative: Tu n’auras pas de relations sexuelles avec la femme de ton frère
  rationale: L’hébreu emploie délibérément une expression juridique euphémique. La conserver respecte la forme du texte, sa dignité et la cohérence terminologique de Lévitique 18; une note en donne le sens explicite.
translation_notes:
  register: Français moderne, digne et juridique. Le tutoiement singulier correspond à l’adresse masculine singulière du texte hébreu. Le futur prohibitif est naturel dans un corpus législatif, tandis que la note clarifie l’euphémisme ancien.
