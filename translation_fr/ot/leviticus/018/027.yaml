id: LEV.18.27
reference: Leviticus 18:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֚י אֶת כָּל הַ/תּוֹעֵבֹ֣ת הָ/אֵ֔ל עָשׂ֥וּ אַנְשֵֽׁי הָ/אָ֖רֶץ אֲשֶׁ֣ר לִ/פְנֵי/כֶ֑ם וַ/תִּטְמָ֖א הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/027.yaml
  text: For the men of the land who were before you did all these abominations[a], and the land became unclean.
translation:
  language: fr
  text: Car les habitants du pays qui vous ont précédés ont commis toutes ces pratiques abominables, et le pays est devenu impur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le pays a été souillé ».'
    reason: Alternative lexicale possible pour וַתִּטְמָא, qui peut exprimer le fait de devenir impur ou d'être souillé.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde l'interdiction ou l'avertissement précédent et conserve naturellement la valeur explicative du connecteur hébreu.
- source_word: כָּל הַתּוֹעֵבֹת הָאֵל
  choice: toutes ces pratiques abominables
  rationale: Rend la forte réprobation morale et cultuelle de תּוֹעֵבָה. « Pratiques » convient à des actes que les habitants ont accomplis, sans réduire le terme à un domaine exclusivement rituel.
- source_word: עָשׂוּ
  choice: ont commis
  rationale: Dans ce contexte, « commettre des pratiques abominables » est plus naturel en français que le calque « faire des abominations », tout en conservant le sens courant de עשה.
- source_word: אַנְשֵׁי הָאָרֶץ
  choice: les habitants du pays
  rationale: Bien que אַנְשֵׁי signifie littéralement « hommes de », l'expression désigne collectivement la population antérieure du territoire. « Habitants » restitue cette fonction idiomatique sans affirmer que seuls les hommes de sexe masculin sont visés.
- source_word: אֲשֶׁר לִפְנֵיכֶם
  choice: qui vous ont précédés
  rationale: Exprime clairement et sobrement l'antériorité temporelle des anciens habitants par rapport aux destinataires.
- source_word: וַתִּטְמָא
  choice: est devenu impur
  rationale: 'Préserve la valeur résultative du verbe : les actes ont rendu le pays impur. Le masculin s''accorde avec « pays » en français.'
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Le contexte vise le territoire habité avant Israël, non la terre entière. « Pays » est ici naturel en français et maintient la portée géographique et théologique du terme.
theological_decisions:
- issue: Nature de l'impureté du pays
  choice: le pays est devenu impur
  alternative: le pays a été souillé
  rationale: La formulation conserve le lien établi par le texte entre les actes humains et l'impureté du territoire, sans décider si cette impureté doit être comprise comme exclusivement rituelle, morale ou métaphorique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le lien explicatif « Car » et emploie une formulation idiomatique sans atténuer la force réprobatrice du texte.
