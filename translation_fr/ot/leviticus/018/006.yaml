  text: אִ֥ישׁ אִישׁ֙ אֶל כָּל שְׁאֵ֣ר בְּשָׂר֔/וֹ לֹ֥א תִקְרְב֖וּ לְ/גַלּ֣וֹת עֶרְוָ֑ה אֲנִ֖י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/006.yaml
  text: No man among you shall approach any close relative of his flesh to uncover nakedness[a]; I am Yahweh.
translation:
  language: fr
  text: Aucun de vous ne s’approchera d’une personne de sa proche parenté afin de découvrir sa nudité[a]. Je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « découvrir la nudité ». Dans ce chapitre, cette expression juridique désigne une exposition sexuelle ou des relations sexuelles interdites avec une personne de sa proche parenté.
    reason: Clarification de l’idiome hébraïque sans le remplacer ni restreindre indûment son référent dans le texte principal.
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: Aucun de vous
  rationale: Le redoublement a une valeur distributive (« chacun »). Avec la négation, « Aucun de vous » exprime naturellement en français la portée individuelle et générale de l’interdiction.
- source_word: שְׁאֵר בְּשָׂרוֹ
  choice: une proche parente
  rationale: L’expression désigne ici une femme étroitement apparentée, comme le montre la série d’interdictions qui suit. « Proche parente » est naturel et précis, sans conserver artificiellement l’image hébraïque de la chair.
- source_word: לֹא תִקְרְבוּ
  choice: ne s’approchera
  rationale: Le verbe au pluriel s’accorde avec la portée distributive du sujet. Dans ce contexte juridique, le futur français formule dignement une interdiction, tout en conservant l’euphémisme « s’approcher ».
- source_word: לְגַלּוֹת עֶרְוָה
  choice: pour découvrir sa nudité
  rationale: La traduction conserve l’expression juridique récurrente du chapitre, qui évoque une exposition sexuelle ou des relations sexuelles interdites. Une note en explicite la portée sans effacer l’image du texte source.
- source_word: אֲנִי יְהוָה
  choice: Je suis Yahweh
  rationale: La formule d’auto-identification divine est conservée, et le nom propre יהוה est translittéré « Yahweh » conformément à la couche de consultation fournie.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le caractère de nom propre et évite de le remplacer par un titre.
- issue: Degré d’explicitation de l’expression sexuelle
  choice: conserver « découvrir sa nudité » dans le texte principal
  alternative: avoir des relations sexuelles avec elle
  rationale: L’expression hébraïque structure les interdictions du chapitre et peut englober l’exposition sexuelle aussi bien que les relations sexuelles. La conserver maintient cette portée et cette tension, tandis que la note aide le lecteur moderne.
translation_notes:
  register: Français international moderne, sobre et juridique. « Aucun de vous » rend naturellement la construction distributive; « proche parente » anticipe correctement les parentes féminines énumérées dans les versets suivants. La formulation reste digne et accessible, avec l’explication nécessaire reportée en note.
