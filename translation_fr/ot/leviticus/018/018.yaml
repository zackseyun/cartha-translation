  source_fidelity: 'Le sens juridique central est bien rendu : il s’agit de prendre la sœur d’une femme alors que celle-ci vit encore, dans une situation de rivalité. Toutefois, « avoir des relations sexuelles avec elle » explicite correctement l’euphémisme, mais abandonne l’expression technique lévitique « découvrir la nudité ». Une formulation française qui conserve cet idiome, tout en restant intelligible, est préférable pour l’équivalence optimale.'
  naturalness: Le français est globalement naturel et le registre juridique convient. Cependant, dans « pour en faire sa rivale », les référents de « en » et de « sa » sont légèrement moins transparents qu’avec « faire d’elle la rivale de sa sœur ».
  terminology: « Prendre une femme », « rivale » et « du vivant de » conviennent. « Découvrir sa nudité » est une expression biblique française établie pour le syntagme hébreu וגלה ערוה ; elle préserve le réseau terminologique du Lévitique sans imposer une interprétation doctrinale.
