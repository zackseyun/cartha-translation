  text: וְ/אִשָּׁ֥ה אֶל אֲחֹתָ֖/הּ לֹ֣א תִקָּ֑ח לִ/צְרֹ֗ר לְ/גַלּ֧וֹת עֶרְוָתָ֛/הּ עָלֶ֖י/הָ בְּ/חַיֶּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/018.yaml
  text: And you shall not take a woman in addition to her sister as a rival wife[a], to uncover her nakedness while her sister is still alive.
translation:
  language: fr
  text: Tu ne prendras pas une femme en plus de sa sœur, pour faire d’elle la rivale de sa sœur en découvrant sa nudité du vivant de celle-ci.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu ne prendras pas une femme à côté de sa sœur, pour susciter une rivalité. » L’hébreu est concis. « Découvrir sa nudité » est une expression qui désigne des relations sexuelles. Le verset interdit de prendre la sœur d’une femme comme épouse supplémentaire tant que la première sœur est en vie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה
  choice: une femme
  rationale: אִשָּׁה peut désigner une femme ou une épouse. Dans ce contexte juridique, « prendre une femme » porte naturellement un sens matrimonial sans qu’il soit nécessaire de traduire explicitement « épouse ».
- source_word: אֶל אֲחֹתָהּ
  choice: en plus de sa sœur
  rationale: L’expression compacte indique qu’une femme est prise en relation avec sa sœur, qui est déjà l’épouse. « En plus de » rend clairement cette addition sans confondre cette expression avec לִצְרֹר, qui précise la rivalité.
- source_word: לֹא תִקָּח
  choice: tu ne prendras pas
  rationale: Cette formulation conserve le ton juridique solennel de l’interdiction hébraïque tout en restant naturelle en français biblique moderne.
- source_word: לִצְרֹר
  choice: pour en faire sa rivale
  rationale: L’infinitif exprime ici le fait de placer les deux sœurs dans une relation de rivalité. La formulation française rend cette force résultative sans imposer le terme « coépouse » dans le texte.
- source_word: לְגַלּוֹת עֶרְוָתָהּ
  choice: avoir des relations sexuelles avec elle
  rationale: Littéralement « découvrir sa nudité », expression lévitique désignant les rapports sexuels. Une traduction sémantique évite en français moderne le contresens possible d’une simple exposition du corps.
- source_word: עָלֶיהָ בְּחַיֶּיהָ
  choice: du vivant de sa sœur
  rationale: La construction indique que l’interdiction vaut pendant la vie de la première sœur. La répétition de « sa sœur » clarifie en français l’antécédent du pronom féminin.
theological_decisions:
- issue: Portée de l’interdiction concernant le mariage avec deux sœurs
  choice: Le verset interdit de prendre la sœur d’une femme comme épouse supplémentaire du vivant de la première, les plaçant ainsi en situation de rivalité.
  alternative: Comprendre le verset comme une interdiction absolue d’épouser deux sœurs, même successivement après la mort de la première, ou comme une interdiction générale de toute union produisant une rivalité.
  rationale: La mention explicite « durant sa vie » limite directement la situation envisagée, tandis que לִצְרֹר décrit la rivalité créée entre les sœurs. La traduction ne généralise donc pas au-delà de cette formulation.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur d’interdiction maintient le registre juridique. L’euphémisme hébreu relatif à la nudité est rendu par son sens sexuel afin d’éviter une lecture littérale trompeuse, tandis que la note conserve l’ambiguïté syntaxique de la formulation hébraïque.
