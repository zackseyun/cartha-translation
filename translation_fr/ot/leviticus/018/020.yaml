  yaml_path: translation/ot/leviticus/018/020.yaml
  text: You shall not have sexual relations[a] with your neighbor’s wife and so defile yourself with her.
translation:
  language: fr
  text: Tu n’auras pas de relations sexuelles[a] avec la femme de ton prochain, au point de te souiller avec elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « Tu ne donneras pas ton épanchement comme semence à la femme de ton prochain. »'
    reason: source_idiom
lexical_decisions:
- source_word: אֵשֶׁת עֲמִיתְךָ
  choice: la femme de ton prochain
  rationale: Dans ce contexte juridique, עָמִית désigne un autre membre de la communauté. « Ton prochain » est naturel en français biblique moderne sans limiter le sens à un voisin géographique.
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ לְזָרַע
  choice: Tu n’auras pas de relations sexuelles
  rationale: La tournure hébraïque évoque littéralement le fait de donner son épanchement comme semence et fonctionne ici comme une expression désignant les rapports sexuels. Le sens est rendu clairement dans le texte, tandis que l’image originale est conservée en note.
- source_word: לְטָמְאָה בָהּ
  choice: car tu te rendrais impur avec elle
  rationale: L’infinitif exprime la souillure qui résulterait de l’acte interdit. « Impur » conserve le vocabulaire lévitique sans préciser indûment s’il s’agit exclusivement d’une impureté rituelle.
theological_decisions:
- issue: Nature de l’interdit et de l’impureté
  choice: Interdiction d’avoir des relations sexuelles avec la femme de son prochain, acte par lequel l’homme se rendrait impur.
  alternative: Conserver dans le texte la formulation anatomique littérale ou qualifier explicitement l’impureté de « rituelle ».
  rationale: L’expression hébraïque désigne clairement l’acte sexuel, mais לְטָמְאָה conserve une portée de souillure que le texte ne réduit pas explicitement à une seule catégorie. La traduction rend donc l’acte intelligible tout en maintenant cette tension.
translation_notes:
  register: Tutoiement singulier conforme à l’adresse juridique hébraïque. Style direct, actuel et digne. « Relations sexuelles » rend l’interdit sans archaïsme ni euphémisme obscur; « se rendre impur » maintient le vocabulaire caractéristique du Lévitique.
