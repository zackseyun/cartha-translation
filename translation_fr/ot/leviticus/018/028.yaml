reference: Leviticus 18:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹֽא תָקִ֤יא הָ/אָ֨רֶץ֙ אֶתְ/כֶ֔ם בְּ/טַֽמַּאֲ/כֶ֖ם אֹתָ֑/הּ כַּ/אֲשֶׁ֥ר קָאָ֛ה אֶת הַ/גּ֖וֹי אֲשֶׁ֥ר לִ/פְנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/028.yaml
  text: so that the land will not vomit you out when you defile it[a], as it vomited out the nation that was before you.
translation:
  language: fr
  text: afin que le pays ne vous vomisse[a] pas lorsque vous le rendrez impur, comme il a vomi la nation qui vous a précédés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rejette ». L’hébreu emploie l’image frappante d’un pays qui vomit ses habitants à cause de sa souillure.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקִיא / קָאָה
  choice: vomisse / a vomi
  rationale: 'Le verbe hébreu emploie une image volontairement saisissante : le pays expulse ses habitants comme on vomit. « Vomir » conserve cette personnification et cette force mieux que le plus abstrait « rejeter ».'
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte, le terme désigne le pays de Canaan plutôt que la terre entière. « Le pays » est donc précis et naturel en français.
- source_word: בְּטַמַּאֲכֶם אֹתָהּ
  choice: lorsque vous le rendrez impur
  rationale: 'La construction avec ב et l’infinitif peut exprimer le temps ou la circonstance. Cette formulation naturelle conserve le sens causatif du piel de טמא : rendre le pays impur, le souiller.'
- source_word: הַגּוֹי
  choice: la nation
  rationale: Le singulier collectif désigne le groupe humain qui habitait auparavant le pays. « La nation » respecte cette forme sans introduire la nuance ultérieure de « païens ».
- source_word: אֲשֶׁר לִפְנֵיכֶם
  choice: qui vous a précédés
  rationale: L’expression indique que cette nation occupait le pays avant les destinataires. Cette tournure exprime clairement l’antériorité en français moderne.
- source_word: וְלֹא
  choice: afin que… ne… pas
  rationale: Dans la continuité de l’avertissement précédent, la coordination négative prend une valeur de but ou de conséquence redoutée. « Afin que » rend cette relation de façon claire, tout en gardant la dépendance syntaxique du verset.
theological_decisions:
- issue: Personnification du pays comme agent de l’expulsion
  choice: Conserver le pays comme sujet grammatical du verbe « vomir ».
  alternative: Expliciter que Dieu chasse les habitants du pays.
  rationale: L’hébreu présente directement le pays comme réagissant à l’impureté. Garder cette image préserve la théologie propre au passage, où la souillure morale atteint le pays et entraîne l’expulsion, sans ajouter une explication absente de ce verset.
translation_notes:
  register: Français international moderne, digne et accessible. L’ouverture par « afin que » conserve le lien syntaxique avec le contexte précédent. Le verbe cru mais fidèle « vomir » est maintenu en raison de la force délibérée de l’image hébraïque.
