source:
  edition: WLC
  text: וּ/מִֽ/זַּרְעֲ/ךָ֥ לֹא תִתֵּ֖ן לְ/הַעֲבִ֣יר לַ/מֹּ֑לֶךְ וְ/לֹ֧א תְחַלֵּ֛ל אֶת שֵׁ֥ם אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/021.yaml
  text: And you shall not give any of your offspring to make them pass over to Molech, and you shall not profane the name of your God. I am Yahweh.
translation:
  language: fr
  text: Tu ne donneras aucun de tes descendants pour le faire passer à Molek[a], et tu ne profaneras pas le nom de ton Dieu. Je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de ta semence ». On peut aussi traduire : « aucun de tes enfants ». Il s’agit d’un rite associé à Molek ; nombreux sont ceux qui y voient un sacrifice d’enfant, souvent décrit ailleurs comme le fait de faire « passer par le feu ».'
    reason: Préciser à la fois la portée de זֶרַע et le sens rituel probable de l’expression, sans introduire dans le texte principal des éléments qui ne sont pas explicitement formulés dans ce verset.
lexical_decisions:
- source_word: וּמִזַּרְעֲךָ
  choice: aucun de tes descendants
  rationale: זֶרַע signifie littéralement « semence », mais désigne ici la descendance. Avec la négation, « aucun de » restitue naturellement la valeur partitive de מִן sans limiter le terme à une tranche d’âge.
- source_word: תִתֵּן
  choice: tu ne livreras
  rationale: נתן signifie ordinairement « donner ». Dans le contexte de ce rite interdit, « livrer » reste proche de ce sens tout en étant plus naturel en français que « donner » lorsqu’une personne est remise à une divinité.
- source_word: לְהַעֲבִיר
  choice: pour le faire passer
  rationale: La forme causative de עבר signifie « faire passer ». Le pronom singulier reprend distributivement « aucun de tes descendants » et conserve l’expression hébraïque sans ajouter explicitement le feu ni le sacrifice.
- source_word: לַמֹּלֶךְ
  choice: à Molek
  rationale: La vocalisation massorétique et l’interprétation traditionnelle conduisent à comprendre le terme comme le nom propre de la divinité associée au rite. La graphie française « Molek » représente directement la consonne finale hébraïque.
- source_word: תְחַלֵּל
  choice: tu ne profaneras pas
  rationale: Au piel, חלל signifie couramment « profaner, rendre profane ». « Profaner » convient au registre cultuel et à l’objet « le nom de ton Dieu ».
- source_word: שֵׁם אֱלֹהֶיךָ
  choice: le nom de ton Dieu
  rationale: Cette formulation naturelle et solennelle conserve le poids théologique du « nom », qui exprime l’honneur et la réputation révélée de Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
theological_decisions:
- issue: Nature de l’interdiction liée à Molek
  choice: Conserver dans le texte l’expression « livrer… pour le faire passer » sans préciser le moyen ni la finalité exacte du rite.
  alternative: « sacrifier l’un de tes enfants à Molek » ou « faire passer par le feu »
  rationale: Le verset mentionne le fait de donner et de faire passer, mais ne nomme explicitement ni le feu ni le sacrifice. La note expose l’interprétation probable sans l’imposer au texte principal.
- issue: Référent de זֶרַע dans cette loi
  choice: descendants
  alternative: enfants ; semence
  rationale: « Descendants » rend le sens familial de זֶרַע sans restreindre indûment sa portée, tandis que la note conserve le sens littéral et l’équivalent courant.
translation_notes:
  register: Français international actuel, digne et direct. Le futur à valeur injonctive convient au style juridique biblique. L’expression hébraïque du rite est volontairement conservée, avec son ambiguïté explicitée en note.
