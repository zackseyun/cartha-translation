id: LEV.18.4
reference: Leviticus 18:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֶת מִשְׁפָּטַ֧/י תַּעֲשׂ֛וּ וְ/אֶת חֻקֹּתַ֥/י תִּשְׁמְר֖וּ לָ/לֶ֣כֶת בָּ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/004.yaml
  text: You shall do my judgments[a], and you shall keep my statutes, to walk in them. I am Yahweh your God.
translation:
  language: fr
  text: Vous appliquerez mes règles de droit et vous observerez mes prescriptions, afin de marcher selon elles[a]. Je suis Yahweh, votre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « marcher en elles ». Cette expression hébraïque désigne le fait de régler sa conduite sur ces commandements. On pourrait aussi traduire : « afin de vivre selon elles ».'
    reason: Précision sur l’idiome hébreu et indication d’une autre traduction possible.
lexical_decisions:
- source_word: מִשְׁפָּטַי
  choice: mes règles de droit
  rationale: מִשְׁפָּט désigne ici des décisions ou normes juridiques. « Règles de droit » conserve cette portée légale tout en restant distinct de חֻקֹּתַי.
- source_word: תַּעֲשׂוּ
  choice: vous appliquerez
  rationale: Dans ce contexte légal, עשה demande la mise en pratique effective. « Appliquer » est plus naturel en français que « faire » avec « règles de droit ».
- source_word: חֻקֹּתַי
  choice: mes prescriptions
  rationale: חֻקָּה désigne ce qui est prescrit ou établi. « Prescriptions » rend clairement cette nuance et évite de confondre le terme avec מִשְׁפָּטַי.
- source_word: תִּשְׁמְרוּ
  choice: vous observerez
  rationale: שׁמר signifie garder, veiller sur et, dans un cadre d’alliance, observer soigneusement. « Observer » est l’expression française naturelle pour l’obéissance à des prescriptions.
- source_word: לָלֶכֶת בָּהֶם
  choice: afin de marcher selon elles
  rationale: La formulation conserve la métaphore de הלך, qui décrit la conduite habituelle, tout en employant « selon elles » pour rendre l’expression intelligible en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: La forme construite munie du suffixe de deuxième personne du pluriel signifie directement « votre Dieu ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin. Le transcrire préserve sa fonction de nom d’alliance au lieu de lui substituer un titre.
- issue: Portée de לָלֶכֶת בָּהֶם
  choice: afin de marcher selon elles
  alternative: afin de vivre selon elles
  rationale: Le choix principal préserve la métaphore hébraïque de la marche comme conduite de vie, sans résoudre l’expression en une paraphrase interprétative.
translation_notes:
  register: Français international actuel, digne et accessible. Le parallélisme juridique est maintenu par « règles de droit » et « prescriptions », tandis que « marcher » conserve l’image concrète du texte source.
