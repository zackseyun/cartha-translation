  source_fidelity: Le sens central est bien rendu, notamment le caractère indéterminé de la sanction par « sera retranché ». Toutefois, la formulation au singulier (« quiconque… sera… son peuple ») absorbe la reprise explicite au pluriel « les personnes qui les commettent » et la note ne porte pas sur l’expression juridiquement ambiguë וְנִכְרְתוּ, alors que c’est l’ambiguïté déterminante du verset.
  naturalness: « En effet » et « pratiques abominables » sont compréhensibles, mais « Car » convient mieux à la liaison argumentative de כִּי et « abominations » rend directement le terme hébreu sans périphrase. Une formulation plurielle est à la fois naturelle et plus proche de la construction finale du texte source.
  terminology: « Retranchés » est le meilleur équivalent français traditionnel et non interprétatif de la formule légale hébraïque. « Abominations » doit être conservé dans le texte; la note doit expliciter l’incertitude sur le mode du retranchement, non redéfinir תּוֹעֵבוֹת.
