  text: כִּ֚י כָּל אֲשֶׁ֣ר יַעֲשֶׂ֔ה מִ/כֹּ֥ל הַ/תּוֹעֵב֖וֹת הָ/אֵ֑לֶּה וְ/נִכְרְת֛וּ הַ/נְּפָשׁ֥וֹת הָ/עֹשֹׂ֖ת מִ/קֶּ֥רֶב עַמָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/029.yaml
  text: For whoever does any of all these abominations[a], the persons who do them shall be cut off from among their people.
translation:
  language: fr
  text: Car toutes les personnes qui commettront l’une quelconque de ces abominations[a] seront retranchées du milieu de leur peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « seront retranchées ». Cette formule ne précise pas le mode exact du jugement; elle peut être comprise comme la mort, l’exclusion de la communauté ou un jugement divin.
    reason: précision_lexicale
lexical_decisions:
- source_word: כִּי
  choice: En effet
  rationale: Introduit ici la justification solennelle des interdictions précédentes; « En effet » rend naturellement cette valeur explicative en français.
- source_word: כָּל אֲשֶׁר
  choice: quiconque
  rationale: Rend de façon concise et naturelle la portée universelle de la tournure relative indéfinie.
- source_word: יַעֲשֶׂה
  choice: commet
  rationale: Dans ce contexte juridique et moral, « commet » s’emploie naturellement pour l’accomplissement des actes interdits, sans ajouter une notion absente du texte.
- source_word: מִכֹּל הַתּוֹעֵבוֹת הָאֵלֶּה
  choice: l’une de toutes ces pratiques abominables
  rationale: Conserve à la fois la valeur partitive de מִן et la portée globale de כֹּל; « pratiques abominables » désigne clairement les actes énumérés dans le contexte.
- source_word: וְנִכְרְתוּ
  choice: sera retranché
  rationale: Préserve l’idiome juridique et communautaire de la racine כרת au passif, sans préciser indûment le mode du jugement.
- source_word: הַנְּפָשׁוֹת הָעֹשֹׂת
  choice: quiconque commet
  rationale: La reprise hébraïque, littéralement « les personnes qui les font », est intégrée au singulier collectif français après « quiconque », ce qui évite une répétition lourde sans perdre la référence personnelle.
- source_word: מִקֶּרֶב עַמָּם
  choice: du milieu de son peuple
  rationale: Rend la formule d’appartenance communautaire de manière idiomatique tout en conservant l’image spatiale du texte hébreu.
theological_decisions:
- issue: Sens de la peine exprimée par וְנִכְרְתוּ ... מִקֶּרֶב עַמָּם
  choice: sera retranché du milieu de son peuple
  alternative: sera mis à mort; sera exclu de la communauté
  rationale: La formule hébraïque ne précise pas si le retranchement désigne directement une mort infligée, un jugement divin ou une exclusion communautaire. Le texte principal conserve donc l’expression ouverte, et la note signale les principales interprétations.
translation_notes:
  register: Français international moderne, solennel et accessible. La syntaxe évite la répétition littérale de « quiconque… les personnes qui… » tout en maintenant la portée universelle et juridique du verset.
