source:
  edition: WLC
  text: עֶרְוַ֥ת אִשָּׁ֛ה וּ/בִתָּ֖/הּ לֹ֣א תְגַלֵּ֑ה אֶֽת בַּת בְּנָ֞/הּ וְ/אֶת בַּת בִּתָּ֗/הּ לֹ֤א תִקַּח֙ לְ/גַלּ֣וֹת עֶרְוָתָ֔/הּ שַׁאֲרָ֥ה הֵ֖נָּה זִמָּ֥ה הִֽוא־־־־
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/017.yaml
  text: You shall not uncover the nakedness of a woman and her daughter[a]. You shall not take her son's daughter or her daughter's daughter to uncover her nakedness; they are close relatives[c][b]. It is depravity.
translation:
  language: fr
  text: 'Tu ne dévoileras pas la nudité d’une femme et de sa fille. Tu ne prendras ni la fille de son fils ni la fille de sa fille pour dévoiler sa nudité[a] : elles sont ses proches parentes. C’est une infamie[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Dévoiler la nudité » est une expression hébraïque désignant ici des relations sexuelles interdites.
    reason: cultural_note
  - marker: b
    text: 'Ou : « un acte scandaleux », « une conduite honteuse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... תְגַלֵּה
  choice: dévoiler la nudité de
  rationale: Conserve l’idiome juridique récurrent du Lévitique, qui désigne ici des relations sexuelles interdites, tout en restant intelligible en français.
- source_word: אִשָּׁה
  choice: une femme
  rationale: Le nom peut signifier « femme » ou « épouse » ; le sens plus large évite de limiter indûment la portée de la loi au mariage.
- source_word: תִקַּח
  choice: prendre
  rationale: Le verbe peut impliquer une union matrimoniale ou sexuelle. « Prendre » préserve sa portée sans la réduire au mariage, tandis que la proposition suivante précise le caractère sexuel de l’interdit.
- source_word: בַּת בְּנָהּ / בַּת בִּתָּהּ
  choice: la fille de son fils / la fille de sa fille
  rationale: Ces formulations rendent explicitement les deux lignées indiquées par les constructions de parenté hébraïques.
- source_word: שַׁאֲרָה הֵנָּה
  choice: elles sont de proches parentes
  rationale: שְׁאֵר désigne ici la parenté charnelle proche ; cette formulation française exprime clairement le lien de sang sans employer le calque obscur « sa chair ».
- source_word: זִמָּה
  choice: une infamie
  rationale: Le terme condamne un acte scandaleux et moralement odieux, particulièrement dans le domaine sexuel. « Infamie » conserve la gravité juridique et morale sans surinterprétation technique.
theological_decisions:
- issue: Référent du suffixe singulier dans לְגַלּוֹת עֶרְוָתָהּ
  choice: Conserver « sa nudité » sans expliciter davantage le référent.
  alternative: Comprendre distributivement la nudité de chacune des descendantes, ou rapporter explicitement le suffixe à la femme initiale.
  rationale: Le suffixe féminin singulier renvoie le plus naturellement à la femme initiale, mais la formulation hébraïque ne développe pas cette logique. Le pronom français maintient le lien et l’ambiguïté du texte.
- issue: Portée de תִקַּח dans cette loi
  choice: « prendre »
  alternative: « épouser » ou « prendre pour femme »
  rationale: Le texte vise une transgression sexuelle fondée sur la parenté et ne doit pas être limité sans nécessité au seul contrat matrimonial.
translation_notes:
  register: Français international moderne, sobre et juridique. Le futur à valeur d’interdiction (« tu ne… pas ») respecte le style législatif biblique. Les expressions de parenté restent explicites afin de préserver la précision du texte hébreu.
