source:
  edition: WLC
  text: וְ/אֶ֨ת זָכָ֔ר לֹ֥א תִשְׁכַּ֖ב מִשְׁכְּבֵ֣י אִשָּׁ֑ה תּוֹעֵבָ֖ה הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/022.yaml
  text: You shall not lie with a male as with a woman[a]; it is an abomination.
translation:
  language: fr
  text: Tu ne coucheras pas avec un homme comme on couche avec une femme[a] ; c’est une abomination.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les couchers d’une femme », expression hébraïque désignant les rapports sexuels avec une femme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכָר
  choice: un homme
  rationale: Le terme désigne ici une personne de sexe masculin. En français courant, « un homme » est plus naturel et plus digne pour parler d’une personne que « un mâle », sans ajouter de précision absente de l’hébreu.
- source_word: תִשְׁכַּב
  choice: tu ne coucheras pas
  rationale: Le verbe שׁכב signifie littéralement « se coucher », mais fonctionne ici comme un euphémisme sexuel clair. « Coucher avec » conserve cette image et son sens sexuel en français naturel.
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: comme on couche avec une femme
  rationale: L’expression hébraïque littérale, « les couchers d’une femme », est idiomatique et désigne les rapports sexuels avec une femme. La formulation retenue restitue naturellement la comparaison sans en réduire ni en élargir la portée.
- source_word: תּוֹעֵבָה
  choice: une abomination
  rationale: « Abomination » rend la forte condamnation exprimée par תּוֹעֵבָה et correspond au registre solennel du code de sainteté.
- source_word: הִוא
  choice: c’est
  rationale: Le pronom féminin renvoie à l’acte interdit, qualifié d’abomination. « C’est » forme en français une prédication naturelle et directe.
theological_decisions:
- issue: Portée de l’interdiction dans le contexte du code de sainteté
  choice: Présenter directement l’interdiction de l’acte sexuel décrit entre personnes de sexe masculin, sans lui ajouter de restriction cultuelle ou liée à l’exploitation.
  alternative: Limiter l’interdiction à une pratique cultuelle, abusive ou exploitante particulière.
  rationale: Le verset ne fournit aucun qualificatif qui limiterait explicitement l’interdiction à l’une de ces situations. La traduction conserve donc la formulation propre au texte, sans développer une catégorie doctrinale plus large ni introduire une limitation absente.
translation_notes:
  register: Français moderne, clair et solennel. Le futur à valeur impérative (« tu ne coucheras pas ») conserve la forme traditionnelle et juridique de l’interdiction biblique. « Homme » est préféré à « mâle », trop clinique en français lorsqu’il désigne une personne.
