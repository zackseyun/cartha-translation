source:
  edition: WLC
  text: אַל תִּֽטַּמְּא֖וּ בְּ/כָל אֵ֑לֶּה כִּ֤י בְ/כָל אֵ֨לֶּה֙ נִטְמְא֣וּ הַ/גּוֹיִ֔ם אֲשֶׁר אֲנִ֥י מְשַׁלֵּ֖חַ מִ/פְּנֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/024.yaml
  text: Do not make yourselves unclean by any of these things[a], for by all these things the nations that I am driving out before you became unclean.
translation:
  language: fr
  text: Ne vous rendez pas impurs par l’une de ces choses[a], car c’est par toutes ces choses que les nations que je chasse devant vous sont devenues impures.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne vous souillez par aucune de ces choses… les nations… ont été souillées. »'
    reason: Alternative lexicale pour טמא et possibilité d’un sens passif pour le niphal final.
lexical_decisions:
- source_word: אַל תִּטַּמְּאוּ
  choice: Ne vous rendez impurs
  rationale: La négation אַל avec l’inaccompli exprime une interdiction, et le hitpael de טמא implique les personnes elles-mêmes dans l’acte. Cette formulation conserve le vocabulaire lévitique de l’impureté.
- source_word: בְּכָל אֵלֶּה
  choice: par aucune de ces pratiques
  rationale: Sous la portée de la négation, כָּל se rend naturellement par « aucune ». Le contexte renvoie aux pratiques interdites énumérées auparavant; « par » exprime le moyen par lequel l’impureté est contractée.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici le motif de l’interdiction; « car » maintient clairement ce lien explicatif.
- source_word: בְכָל אֵלֶּה נִטְמְאוּ
  choice: c’est par toutes ces pratiques que se sont rendues impures
  rationale: La tournure emphatique française fait écho à la reprise de בְכָל אֵלֶּה. Le niphal de טמא indique l’entrée dans un état d’impureté; le pronominal français l’exprime naturellement sans nier la possibilité d’un sens passif.
- source_word: הַגּוֹיִם
  choice: les nations
  rationale: Dans ce contexte, le terme désigne les peuples non israélites occupant le pays. « Les nations » est précis et évite l’anachronisme possible de « les païens ».
- source_word: אֲשֶׁר אֲנִי מְשַׁלֵּחַ
  choice: que je chasse
  rationale: Dans le contexte du jugement et de la prise du pays, שׁלח exprime l’expulsion plutôt qu’un simple envoi.
- source_word: מִפְּנֵיכֶם
  choice: devant vous
  rationale: Cette expression conserve l’image spatiale de peuples retirés devant l’avancée d’Israël, dans un français biblique clair et actuel.
theological_decisions:
- issue: Vocabulaire de l’impureté rituelle et morale en Lévitique 18
  choice: impurs / rendues impures
  alternative: souillés / ont été souillées
  rationale: « Impur » préserve la catégorie lévitique טמא et son articulation entre dimensions rituelle et morale. « Souiller » est possible, mais plus chargé et moins apte à maintenir la cohérence terminologique du livre.
- issue: Voix du niphal נִטְמְאוּ
  choice: se sont rendues impures
  alternative: ont été rendues impures
  rationale: Le niphal peut exprimer un état résultant ou un sens passif. La formulation retenue rend naturellement l’entrée dans l’impureté provoquée par ces pratiques, tandis que la note conserve explicitement l’autre possibilité sans préciser indûment l’agent.
translation_notes:
  register: Français international moderne, digne et accessible. « Pratiques » explicite le référent contextuel de « toutes ces choses » sans ajouter une catégorie étrangère au passage. La répétition « pratiques » et « impures » reproduit la cohésion lexicale de l’hébreu.
