revisions:
- from: Ne vous rendez impurs par aucune de ces pratiques[a], car c’est par toutes ces pratiques que se sont rendues impures les nations que je chasse devant vous.
  to: Ne vous rendez pas impurs par l’une de ces choses[a], car c’est par toutes ces choses que les nations que je chasse devant vous sont devenues impures.
  rationale: La révision remplace l’explicitation contextuelle « pratiques » par « choses », qui correspond directement à אֵלֶּה, tout en conservant la référence aux actes précédemment énumérés. Elle maintient « impur » comme terme cohérent pour טמא, améliore la syntaxe négative française et rend le niphal final par « sont devenues impures », formulation idiomatique qui préserve l’état résultant et l’ambiguïté de voix.
