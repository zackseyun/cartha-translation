  timestamp: '2026-07-14T12:24:56Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : interdiction de contracter l’impureté, motif fondé sur l’impureté des nations, et expulsion devant Israël. Toutefois, « pratiques » interprète et resserre le référent plus général « ces choses », et le niphal final est mieux rendu en français par un verbe résultatif non réflexif.'
  naturalness: « Ne vous rendez impurs par aucune de ces pratiques » est compréhensible, mais la négation est plus naturelle avec « ne vous rendez pas impurs par l’une de ces choses ». La dislocation emphatique suivie de l’inversion (« c’est par… que se sont rendues impures les nations ») est lourde en français moderne.
  terminology: « impur » convient très bien pour טמא et doit être maintenu aux deux occurrences. « Sont devenues impures » rend naturellement le résultat exprimé par le niphal sans imposer un agent ni transformer inutilement la forme en réflexif.
  issues:
  - severity: medium
    issue: Ajout interprétatif de « pratiques »
    rationale: כָּל־אֵלֶּה signifie littéralement « toutes ces choses ». Le contexte permet de comprendre qu’il s’agit des actes précédemment énumérés, mais « choses » préserve mieux la formulation et son amplitude.
  - severity: medium
    issue: Rendu réflexif du niphal final
    rationale: « Se sont rendues impures » suggère plus fortement une action réflexive que le niphal נִטְמְאוּ, qui exprime ici l’entrée dans un état d’impureté et peut aussi être compris passivement. « Sont devenues impures » conserve cette nuance sans la surinterpréter.
  - severity: low
    issue: Tournure française alourdie
    rationale: La construction emphatique avec inversion du sujet est moins fluide que l’ordre direct, sans gain nécessaire de fidélité.
  revised_text: Ne vous rendez pas impurs par l’une de ces choses[a], car c’est par toutes ces choses que les nations que je chasse devant vous sont devenues impures.
