base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/023.yaml
  text: And with any animal you shall not give your lying[a] to become unclean with it, and a woman shall not stand before an animal to mate with it[c][b]; it is a perversion.
translation:
  language: fr
  text: 'Tu ne coucheras avec aucun animal, te rendant impur avec lui[a]. Une femme ne se placera pas devant un animal afin que l’animal la monte[b] : c’est une perversion[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu ne donneras pas ton coucher pour devenir impur avec lui ». L’expression désigne ici un rapport sexuel avec un animal.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « afin de s’accoupler avec elle ». L’hébreu emploie le verbe de la monte sexuelle et présente la femme comme objet de l’action.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « un bouleversement de l’ordre » ou « une confusion ». Le mot hébreu désigne une grave transgression de l’ordre convenable, notamment dans le domaine sexuel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל בְּהֵמָה
  choice: avec aucune bête
  rationale: בְּהֵמָה désigne ici un animal, souvent domestique, et כָּל donne à l’interdiction une portée exhaustive. Dans une phrase négative, « aucune bête » rend naturellement cet ensemble en français.
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ
  choice: tu ne coucheras
  rationale: L’hébreu dit littéralement « tu ne donneras pas ton coucher/ta couche », idiome sexuel qui serait obscur et peu naturel s’il était calqué en français. « Coucher avec » conserve l’image verbale et exprime clairement le rapport sexuel sans en préciser davantage la physiologie.
- source_word: לְטָמְאָה בָהּ
  choice: te rendant impur avec elle
  rationale: La formulation garde la catégorie biblique d’impureté et laisse ouverte la nuance de but ou de conséquence portée par l’infinitif hébreu, sans la réduire à une impureté seulement rituelle.
- source_word: וְאִשָּׁה
  choice: une femme
  rationale: אִשָּׁה est générique ici et ne signifie pas nécessairement « épouse ».
- source_word: לֹא תַעֲמֹד לִפְנֵי בְהֵמָה
  choice: ne se placera pas devant une bête
  rationale: « Se placer devant » rend naturellement la posture volontaire exprimée par « se tenir devant » dans ce contexte.
- source_word: לְרִבְעָהּ
  choice: pour qu’elle la monte
  rationale: Le verbe רבע désigne ici la monte sexuelle. Le suffixe féminin fait de la femme l’objet de l’action; la construction choisie préserve explicitement cette orientation.
- source_word: תֶּבֶל
  choice: une perversion
  rationale: Le terme qualifie une transgression grave de l’ordre convenable, particulièrement dans un contexte sexuel. « Perversion » rend cette portée morale plus justement que « confusion » en français actuel.
theological_decisions:
- issue: Portée de l’impureté exprimée par טמא
  choice: te rendant impur avec elle
  alternative: pour devenir impur avec elle / en te souillant avec elle
  rationale: Cette formulation conserve la notion biblique d’impureté sans décider qu’elle serait exclusivement cérémonielle ni la remplacer par une catégorie doctrinale ultérieure.
- issue: Qualification de l’acte par תֶּבֶל
  choice: c’est une perversion
  alternative: c’est une confusion / c’est un bouleversement de l’ordre
  rationale: « Perversion » maintient le jugement moral et l’idée d’un ordre gravement transgressé; « confusion » évoquerait aujourd’hui surtout une incertitude mentale.
- issue: Orientation grammaticale de לְרִבְעָהּ
  choice: pour qu’elle la monte
  alternative: pour s’accoupler avec elle
  rationale: Le suffixe féminin présente la femme comme objet de la monte. La traduction explicite cette relation grammaticale sans ajouter de détail absent du texte.
translation_notes:
  register: Français international moderne, direct et digne. Le texte principal privilégie une expression sexuelle claire mais non crue. Le tutoiement singulier correspond à l’adresse masculine singulière de la première proposition; la seconde conserve la mention explicite de la femme.
