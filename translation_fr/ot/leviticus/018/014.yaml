source:
  edition: WLC
  text: עֶרְוַ֥ת אֲחִֽי אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה אֶל אִשְׁתּ/וֹ֙ לֹ֣א תִקְרָ֔ב דֹּדָֽתְ/ךָ֖ הִֽוא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/014.yaml
  text: You shall not uncover the nakedness of your father's brother; you shall not approach his wife[a]. She is your aunt.
translation:
  language: fr
  text: Tu ne découvriras pas la nudité du frère de ton père ; tu ne t’approcheras pas de sa femme[a]. Elle est ta tante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « t’approcher de » ; dans cette formule juridique sur l’inceste, le verbe a une portée sexuelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: la nudité de
  rationale: Dans Lévitique 18, l’expression « découvrir la nudité » est une formule juridique désignant des relations sexuelles interdites. La traduction conserve l’image concrète et la cohérence de la formule hébraïque sans la remplacer par une paraphrase.
- source_word: אֲחִי אָבִיךָ
  choice: du frère de ton père
  rationale: Cette formulation naturelle suit précisément la chaîne de possession hébraïque et indique sans ambiguïté qu’il s’agit de l’oncle paternel.
- source_word: לֹא תְגַלֵּה
  choice: Tu ne découvriras pas
  rationale: Le futur à valeur d’interdiction convient au registre juridique français et conserve le verbe de la formule hébraïque « découvrir la nudité ».
- source_word: אֶל אִשְׁתּוֹ לֹא תִקְרָב
  choice: tu ne t’approcheras pas de sa femme
  rationale: Le verbe קרב signifie littéralement « s’approcher ». Dans ce contexte, il a une portée sexuelle, mais la traduction maintient l’euphémisme sobre de l’hébreu et en précise le sens dans une note.
- source_word: דֹּדָתְךָ
  choice: ta tante
  rationale: דּוֹדָה désigne ici la tante par alliance, comme l’explicite la proposition précédente. « Ta tante » est l’équivalent français direct et naturel.
- source_word: הִוא
  choice: Elle est
  rationale: 'Le pronom forme une proposition nominale simple : « elle est ta tante ». Aucun connecteur causal n’est ajouté, afin de ne pas rendre l’explication plus explicite que dans l’hébreu.'
theological_decisions:
- issue: Rendu de la formule juridique relative aux relations sexuelles interdites
  choice: Conserver « découvrir la nudité » dans le texte principal.
  alternative: Paraphraser par « avoir des relations sexuelles avec ».
  rationale: La formule imagée revient dans tout le chapitre. La conserver respecte sa cohérence littéraire et juridique tout en laissant visible la manière de s’exprimer du texte source.
- issue: Identification précise du lien de parenté
  choice: Employer « ta tante » après avoir précisé « la femme du frère de ton père ».
  alternative: Répéter « la femme du frère de ton père » ou écrire « ta tante paternelle par alliance ».
  rationale: L’hébreu emploie le terme ordinaire signifiant « tante ». La proposition précédente suffit à préciser qu’il s’agit ici d’une tante par alliance.
translation_notes:
  register: Français international moderne, sobre et juridique. Le tutoiement singulier correspond à l’adresse masculine singulière de l’hébreu. La formulation conserve l’euphémisme et la répétition conceptuelle du texte source.
