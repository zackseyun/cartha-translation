source:
  edition: WLC
  text: עֶרְוַ֨ת בַּת אֵ֤שֶׁת אָבִ֨י/ךָ֙ מוֹלֶ֣דֶת אָבִ֔י/ךָ אֲחוֹתְ/ךָ֖ הִ֑וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/011.yaml
  text: You shall not uncover the nakedness of your father's wife's daughter[a], born to your father; she is your sister.
translation:
  language: fr
  text: 'Tu ne découvriras pas la nudité de la fille de la femme de ton père, engendrée par ton père : elle est ta sœur[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elle est ta demi-sœur ». L’hébreu dit littéralement : « elle est ta sœur » ; la description précédente précise le lien de parenté.'
    reason: Alternative lexicale explicitant la relation sans l’imposer dans le texte principal.
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָהּ
  choice: la nudité de… / sa nudité
  rationale: Dans Lévitique 18, עֶרְוָה appartient à la formule juridique et sexuelle « découvrir la nudité ». Cette traduction conserve l’idiome, la dignité du registre et la cohérence avec les versets voisins.
- source_word: בַּת
  choice: la fille
  rationale: Terme de parenté direct, rendu sans explicitation supplémentaire.
- source_word: אֵשֶׁת אָבִיךָ
  choice: la femme de ton père
  rationale: Cette formulation reproduit la relation explicitement exprimée en hébreu. « Ta belle-mère » serait plus interprétatif et pourrait obscurcir le lien précis décrit par le verset.
- source_word: מוֹלֶדֶת אָבִיךָ
  choice: engendrée par ton père
  rationale: La formule indique la filiation biologique du côté paternel. « Engendrée par » est précis, grammaticalement naturel en français et évite l’expression peu idiomatique « née de ton père ».
- source_word: אֲחוֹתְךָ הִוא
  choice: elle est ta sœur
  rationale: L’hébreu dit littéralement « elle est ta sœur » sans ajouter « demi- ». La description précédente précise la relation.
- source_word: לֹא תְגַלֶּה
  choice: Tu ne découvriras pas
  rationale: Cette tournure conserve la formule prohibitive juridique du chapitre tout en restant claire en français moderne.
theological_decisions:
- issue: Faut-il préciser « demi-sœur » dans le texte principal ?
  choice: Conserver « elle est ta sœur » et laisser la description précédente définir le lien familial.
  alternative: elle est ta demi-sœur
  rationale: Le verset qualifie d’abord cette femme comme fille de la femme du père et engendrée par le père, puis conclut simplement qu’elle est une sœur. Ajouter « demi- » dans le texte principal résoudrait explicitement ce que l’hébreu laisse à la description généalogique.
translation_notes:
  register: Français international moderne, clair et digne, avec maintien de la formule juridique répétée dans Lévitique 18. Le deux-points rend naturellement la proposition explicative finale de l’hébreu.
