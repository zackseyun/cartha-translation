  yaml_path: translation/ot/leviticus/018/012.yaml
  text: You shall not uncover the nakedness of your father's sister[b][a]; she is your father's flesh.
translation:
  language: fr
  text: 'Tu ne découvriras pas la nudité de la sœur de ton père[a] : elle est une proche parente de ton père[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « découvrir la nudité de » est une formule juridique qui désigne ici une exposition sexuelle ou des relations sexuelles interdites.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « elle est la chair de ton père » ; autrement dit, elle est sa parente par le sang.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרְוַת … לֹא תְגַלֵּה
  choice: Tu ne découvriras pas la nudité de…
  rationale: Conserve la formule juridique récurrente de Lévitique 18 sans la remplacer dans le texte par une explicitation plus large comme « avoir des relations sexuelles avec ».
- source_word: אֲחוֹת אָבִיךָ
  choice: la sœur de ton père
  rationale: Rend directement le lien de parenté exprimé en hébreu et reste naturel en français moderne.
- source_word: שְׁאֵר אָבִיךָ
  choice: la proche parente de ton père
  rationale: Dans ce contexte de parenté, שְׁאֵר désigne une proximité de chair ou de sang. « Proche parente » communique clairement la portée juridique, tandis que la note conserve l'image littérale de la chair.
- source_word: הִוא
  choice: elle est
  rationale: Reproduit simplement l'identification emphatique de cette femme comme appartenant au degré de parenté interdit.
theological_decisions:
- issue: Rendu de l'expression juridique relative à l'inceste
  choice: Maintenir « découvrir la nudité de » dans le texte principal.
  alternative: Expliciter par « avoir des relations sexuelles avec ».
  rationale: La formulation hébraïque est fixe et juridique dans Lévitique 18. La conserver respecte la cohérence du chapitre et évite de préciser au-delà des mots du texte, tout en expliquant son sens dans une note.
- issue: Portée de שְׁאֵר dans la formule de parenté
  choice: « proche parente » dans le texte, avec « chair » en note.
  alternative: « elle est la chair de ton père » dans le texte principal.
  rationale: Le français littéral « chair de ton père » est possible, mais ambigu et peu naturel ici. « Proche parente » transmet la fonction de l'expression sans effacer son image source, signalée en note.
translation_notes:
  register: Français international moderne, digne et direct. Le futur à valeur d'interdiction (« Tu ne découvriras pas ») préserve le ton législatif. Les deux notes suivent l'ordre d'apparition de leurs marqueurs dans le texte.
