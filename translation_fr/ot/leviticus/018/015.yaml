source:
  edition: WLC
  text: עֶרְוַ֥ת כַּלָּֽתְ/ךָ֖ לֹ֣א תְגַלֵּ֑ה אֵ֤שֶׁת בִּנְ/ךָ֙ הִ֔וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/015.yaml
  text: You shall not uncover the nakedness of your daughter-in-law[a]; she is your son's wife; you shall not uncover her nakedness.
translation:
  language: fr
  text: Tu ne découvriras pas la nudité de ta belle-fille[a]. Elle est la femme de ton fils ; tu ne découvriras pas sa nudité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « découvrir la nudité » ; cette expression hébraïque récurrente dans Lévitique désigne ici des relations sexuelles interdites.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: la nudité de
  rationale: Dans Lévitique 18, l’expression « découvrir la nudité » est une formule juridique euphémistique désignant des relations sexuelles interdites. La conserver respecte la cohérence lexicale et littéraire du chapitre.
- source_word: כַּלָּתְךָ
  choice: ta belle-fille
  rationale: Le nom avec suffixe de deuxième personne du masculin singulier désigne directement la femme du fils de l’interlocuteur ; « belle-fille » est le terme de parenté français naturel dans ce contexte.
- source_word: תְגַלֵּה / תְגַלֶּה
  choice: tu ne découvriras pas
  rationale: Le piel de גלה associé à עֶרְוָה constitue la formule d’interdiction récurrente du chapitre. Le futur à valeur injonctive rend naturellement la prohibition en français tout en préservant l’image hébraïque.
- source_word: אֵשֶׁת בִּנְךָ
  choice: la femme de ton fils
  rationale: Cette proposition explique le lien familial qui fonde l’interdiction. La formulation est claire et suit étroitement l’hébreu.
- source_word: הִוא
  choice: elle est
  rationale: Le pronom reprend et identifie avec insistance la femme qui vient d’être nommée. « Elle est » restitue sobrement cette fonction explicative.
- source_word: עֶרְוָתָהּ
  choice: sa nudité
  rationale: La répétition préserve le style juridique de l’hébreu et la formule caractéristique du chapitre.
theological_decisions:
- issue: Rendu de l’expression « découvrir la nudité » dans le contexte d’une interdiction sexuelle
  choice: Conserver l’euphémisme « découvrir la nudité » dans le texte.
  alternative: Rendre explicitement par « avoir des relations sexuelles avec » ou « coucher avec ».
  rationale: L’hébreu emploie une formule juridique stable dans tout Lévitique 18. La conserver maintient les liens internes du chapitre et évite d’aplanir une expression volontairement euphémistique, tandis qu’une note en précise la portée.
translation_notes:
  register: Français moderne, digne et direct. Le tutoiement singulier correspond à l’adresse hébraïque au masculin singulier. La répétition finale et l’euphémisme juridique ont été conservés.
