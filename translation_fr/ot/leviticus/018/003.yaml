id: LEV.18.3
reference: Leviticus 18:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כְּ/מַעֲשֵׂ֧ה אֶֽרֶץ מִצְרַ֛יִם אֲשֶׁ֥ר יְשַׁבְתֶּם בָּ֖/הּ לֹ֣א תַעֲשׂ֑וּ וּ/כְ/מַעֲשֵׂ֣ה אֶֽרֶץ כְּנַ֡עַן אֲשֶׁ֣ר אֲנִי֩ מֵבִ֨יא אֶתְ/כֶ֥ם שָׁ֨מָּ/ה֙ לֹ֣א תַעֲשׂ֔וּ וּ/בְ/חֻקֹּתֵי/הֶ֖ם לֹ֥א תֵלֵֽכוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/003.yaml
  text: You shall not do as they do in the land of Egypt[a], where you lived, and you shall not do as they do in the land of Canaan, where I am bringing you[b]. You shall not walk in their statutes.
translation:
  language: fr
  text: Vous ne ferez pas ce qui se fait dans le pays d’Égypte[a], où vous avez habité, et vous ne ferez pas ce qui se fait dans le pays de Canaan, où je vous conduis. Vous ne suivrez pas leurs prescriptions[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon les actes du pays d’Égypte »; de même pour le pays de Canaan. L’expression hébraïque désigne les pratiques qui ont cours dans ces pays.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vous ne vous conformerez pas à leurs coutumes »; littéralement : « vous ne marcherez pas dans leurs prescriptions ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַעֲשֵׂה
  choice: ce qui se fait dans
  rationale: L’expression hébraïque signifie littéralement « selon l’acte / la pratique de ». Cette tournure française naturelle conserve l’idée des pratiques caractéristiques des habitants sans attribuer littéralement des actes au territoire.
- source_word: אֶרֶץ מִצְרַיִם
  choice: le pays d’Égypte
  rationale: « Pays d’Égypte » restitue explicitement אֶרֶץ et maintient l’accent géographique dans un français courant.
- source_word: אֲשֶׁר יְשַׁבְתֶּם בָּהּ
  choice: où vous avez habité
  rationale: La relative situe le séjour passé d’Israël en Égypte; le passé composé convient au français moderne et respecte l’accompli hébreu.
- source_word: לֹא תַעֲשׂוּ
  choice: vous ne ferez pas
  rationale: Le futur négatif exprime avec dignité et naturel une interdiction juridique adressée à la collectivité.
- source_word: וּכְמַעֲשֵׂה אֶרֶץ כְּנַעַן
  choice: et vous ne ferez pas ce qui se fait dans le pays de Canaan
  rationale: La répétition reproduit le parallélisme hébreu tout en explicitant idiomatiquement les pratiques des habitants.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: où je vous conduis
  rationale: Le participe מֵבִיא présente l’action divine comme en cours ou imminente. « Je vous conduis » exprime naturellement le déplacement vers cette destination.
- source_word: וּבְחֻקֹּתֵיהֶם
  choice: leurs prescriptions
  rationale: חֻקּוֹת désigne des règles, usages fixés ou prescriptions. « Prescriptions » conserve leur caractère normatif sans suggérer nécessairement un code étatique.
- source_word: לֹא תֵלֵכוּ
  choice: vous ne suivrez pas
  rationale: Le verbe signifie littéralement « marcher », mais avec בְ et des prescriptions il exprime le fait de se conformer à elles. « Suivre » rend clairement cette valeur en français moderne.
theological_decisions:
- issue: Faut-il attribuer littéralement les actes aux pays ou expliciter les pratiques de leurs habitants ?
  choice: « ce qui se fait dans le pays d’Égypte / de Canaan »
  alternative: « selon les pratiques du pays d’Égypte / de Canaan »
  rationale: Cette formulation garde l’idiome centré sur les pays tout en faisant comprendre que l’interdiction vise les conduites qui y ont cours, non le territoire lui-même.
- issue: 'Comment rendre חֻקֹּתֵיהֶם : prescriptions, coutumes ou lois ?'
  choice: « prescriptions »
  alternative: « coutumes »
  rationale: « Prescriptions » préserve la force normative du terme et son contraste implicite avec les prescriptions divines du contexte. La note signale l’autre nuance possible sans réduire le terme à de simples habitudes sociales.
- issue: Faut-il conserver littéralement la métaphore « marcher dans » ?
  choice: « suivre »
  alternative: « marcher selon »
  rationale: En français actuel, « suivre des prescriptions » transmet directement la métaphore hébraïque de la conduite réglée sans imposer une tournure obscure. Aucun contenu doctrinal supplémentaire n’est introduit.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme des deux interdictions est maintenu. Le futur négatif convient au registre juridique biblique sans archaïsme marqué; « ce qui se fait » et « suivre » rendent naturellement les deux idiomes hébreux.
