  text: וּ/שְׁמַרְתֶּ֣ם אַתֶּ֗ם אֶת חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֔/י וְ/לֹ֣א תַעֲשׂ֔וּ מִ/כֹּ֥ל הַ/תּוֹעֵבֹ֖ת הָ/אֵ֑לֶּה הָֽ/אֶזְרָ֔ח וְ/הַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/026.yaml
  text: But you yourselves shall keep my statutes and my judgments[a], and you shall not do any of these abominations, neither the native-born nor the sojourner who sojourns among you.
translation:
  language: fr
  text: Mais vous, vous observerez mes prescriptions et mes règles, et vous ne commettrez aucune de ces abominations, que ce soit le natif du pays ou l’étranger qui réside parmi vous[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le résident étranger qui séjourne parmi vous ».
    reason: Alternative lexicale pour גֵּר הַגָּר בְּתוֹכְכֶם; « résident étranger » rend le statut de non-natif établi dans la communauté, et « séjourne » reproduit le lien lexical entre le nom et le participe hébreux.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אַתֶּם
  choice: Mais vous, vous observerez
  rationale: Le verbe שׁמר, dans un contexte juridique et d’alliance, signifie « garder » au sens d’« observer ». Le pronom indépendant אַתֶּם renforce le sujet; la tournure française « vous, vous » conserve cette insistance. « Mais » rend la valeur contrastive probable du waw dans le contexte.
- source_word: חֻקֹּתַי
  choice: mes prescriptions
  rationale: חֻקִּים désigne des dispositions établies. « Prescriptions » conserve la portée normative tout en restant naturel en français moderne.
- source_word: מִשְׁפָּטַי
  choice: mes règles
  rationale: מִשְׁפָּטִים peut désigner des décisions, normes ou règles de droit. Ici, « règles » exprime clairement leur fonction juridique sans suggérer uniquement des verdicts judiciaires.
- source_word: וְלֹא תַעֲשׂוּ מִכֹּל הַתּוֹעֵבֹת הָאֵלֶּה
  choice: et vous ne commettrez aucune de ces abominations
  rationale: Avec la négation, מִכֹּל a le sens idiomatique d’« aucune de ». « Commettre » convient en français aux actes interdits désignés par תּוֹעֵבוֹת et en conserve la forte condamnation morale et cultuelle.
- source_word: הָאֶזְרָח
  choice: l’autochtone
  rationale: אֶזְרָח désigne le membre natif du pays ou de la communauté, par contraste avec le résident d’origine étrangère. « Autochtone » rend ce statut sans ajouter explicitement une identité absente du terme.
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: l’étranger qui réside parmi vous
  rationale: גֵּר est un non-natif établi au sein de la communauté. « Étranger qui réside » restitue à la fois son origine extérieure et le caractère durable de sa présence; « parmi vous » rend בְּתוֹכְכֶם.
theological_decisions:
- issue: Portée de l’interdiction pour l’autochtone et le résident étranger
  choice: L’interdiction vise explicitement aussi bien l’autochtone que l’étranger résidant au sein de la communauté.
  alternative: La proposition finale peut être comprise comme une simple précision en apposition sur les personnes concernées, sans accent particulier sur leur égalité.
  rationale: La syntaxe rattache הָאֶזְרָח et הַגֵּר à l’interdiction formulée au pluriel. La traduction maintient les deux catégories côte à côte sans tirer de conclusion théologique supplémentaire.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La répétition « vous, vous » est volontaire afin de conserver l’emphase de אַתֶּם. « Abominations » maintient la force évaluative du texte source; le marqueur de note est placé sur l’expression qu’il explique.
