  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Yahweh parla à Moïse en ces termes[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en disant ».'
    reason: Le français « en ces termes » exprime idiomatiquement la fonction introductive de לֵאמֹר; la note conserve sa forme plus littérale.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol de דבר fait progresser le récit et introduit une nouvelle parole divine. « Parla » rend précisément le verbe dans une formule narrative française naturelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֶל־מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל désigne ici le destinataire de la parole; « à Moïse » est l’équivalent français direct et idiomatique.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Cet infinitif introduit le contenu du discours. « En ces termes » restitue naturellement sa fonction en français et prépare les paroles qui suivent, sans ajouter de contenu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le nom propre divin. Le conserver sous la forme « Yahweh » distingue ce nom du titre אֲדֹנָי et reste au plus près de la donnée hébraïque.
translation_notes:
  register: Français international moderne, digne et accessible. La formule narrative demeure concise; les deux-points annoncent directement le discours du verset suivant.
