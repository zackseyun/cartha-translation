  yaml_path: translation/ot/leviticus/018/008.yaml
  text: You shall not uncover the nakedness of your father's wife[a]; it is your father's nakedness.
translation:
  language: fr
  text: 'Tu ne découvriras pas la nudité de la femme de ton père[a] : c’est la nudité de ton père.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement : « Tu n’auras pas de relations sexuelles avec la femme de ton père. » L’hébreu dit littéralement : « découvrir la nudité de ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: la nudité de
  rationale: Dans Lévitique 18, ce nom appartient à la formule juridique répétée « dévoiler la nudité de », euphémisme désignant des relations sexuelles interdites. La traduction conserve l’image et la cohérence du chapitre.
- source_word: אֵשֶׁת אָבִיךָ
  choice: la femme de ton père
  rationale: Le nom אֵשֶׁת en construction avec « ton père » désigne son épouse. En français biblique courant, « la femme de ton père » exprime naturellement ce lien conjugal sans ajouter une précision absente du texte.
- source_word: לֹא תְגַלֵּה
  choice: Tu ne dévoileras pas
  rationale: L’imparfait nié exprime ici une interdiction juridique. « Tu ne dévoileras pas » garde la forme solennelle de la loi et reprend la métaphore hébraïque.
- source_word: עֶרְוַת אָבִיךָ הִוא
  choice: c’est la nudité de ton père
  rationale: Le pronom féminin renvoie grammaticalement à עֶרְוַת, « nudité ». « C’est » est donc naturel en français et évite de faire du pronom une désignation de la femme.
theological_decisions:
- issue: Faut-il expliciter l’euphémisme comme une interdiction d’avoir des relations sexuelles ?
  choice: Conserver dans le texte principal la formule « dévoiler la nudité »
  alternative: Tu n’auras pas de relations sexuelles avec la femme de ton père
  rationale: La formule hébraïque est récurrente dans ce chapitre et appartient au registre propre de la loi. La conserver respecte sa cohérence et son caractère euphémique, tandis qu’une note en donne le sens explicite.
translation_notes:
  register: Français moderne, digne et accessible. Le futur à valeur d’interdiction rend le style juridique du passage. « Dévoiler la nudité » préserve l’euphémisme hébraïque et sa répétition structurante dans Lévitique 18.
