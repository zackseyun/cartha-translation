  yaml_path: translation/ot/leviticus/018/013.yaml
  text: You shall not uncover the nakedness of your mother's sister[b][a], for she is your mother's close relative.
translation:
  language: fr
  text: Tu ne découvriras pas la nudité de la sœur de ta mère[a], car elle est une parente proche de ta mère[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus explicite : « Tu n’auras pas de relations sexuelles avec la sœur de ta mère. » L’hébreu dit littéralement : « Tu ne découvriras pas la nudité de la sœur de ta mère. »'
    reason: lexical_alternative
  - marker: b
    text: « Parente proche » traduit l’hébreu שְׁאֵר, un terme de parenté qui désigne un membre de la parenté proche.
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת ... לֹא תְגַלֵּה
  choice: Tu ne découvriras pas la nudité de
  rationale: Conserve l’euphémisme juridique récurrent de Lévitique 18 et son registre solennel; le sens sexuel de l’expression est explicité en note.
- source_word: אֲחוֹת אִמְּךָ
  choice: la sœur de ta mère
  rationale: Rend directement la relation de parenté exprimée par l’état construit, sans la réduire au terme plus général « tante ».
- source_word: כִּי
  choice: car
  rationale: Introduit naturellement, dans un registre juridique, le motif de l’interdiction.
- source_word: שְׁאֵר אִמְּךָ
  choice: une proche parente de ta mère
  rationale: שְׁאֵר désigne ici une proche parente liée par la chair; cette formulation française est claire et préserve la référence explicite à la mère.
- source_word: הִוא
  choice: elle est
  rationale: Reproduit simplement le sujet féminin de la proposition explicative.
theological_decisions:
- issue: Rendu de l’euphémisme juridique relatif aux relations sexuelles interdites
  choice: Maintenir dans le texte « découvrir la nudité de »
  alternative: Traduire explicitement « avoir des relations sexuelles avec »
  rationale: L’expression hébraïque est une formule juridique répétée dans Lévitique 18. La conserver maintient la cohérence littéraire et la retenue du texte, tandis qu’une note en précise le sens.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur à valeur injonctive (« Tu ne découvriras pas ») maintient la formulation législative traditionnelle sans archaïsme marqué. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
