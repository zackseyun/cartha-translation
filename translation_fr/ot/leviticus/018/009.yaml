id: LEV.18.9
reference: Leviticus 18:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֶרְוַ֨ת אֲחֽוֹתְ/ךָ֤ בַת אָבִ֨י/ךָ֙ א֣וֹ בַת אִמֶּ֔/ךָ מוֹלֶ֣דֶת בַּ֔יִת א֖וֹ מוֹלֶ֣דֶת ח֑וּץ לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/ן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/009.yaml
  text: You shall not uncover the nakedness of your sister[a], whether your father's daughter or your mother's daughter, born in the household or born outside it.
translation:
  language: fr
  text: Tu ne découvriras pas la nudité de ta sœur, qu’elle soit fille de ton père ou fille de ta mère, née au sein du foyer ou en dehors de celui-ci[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « née dans la maison ou née au-dehors ». L’hébreu oppose la maison ou le foyer à ce qui est extérieur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן
  choice: la nudité de…
  rationale: Dans Lévitique 18, עֶרְוָה appartient à la formule juridique désignant la nudité sexuelle dans le cadre des relations interdites. « Découvrir la nudité » conserve cet idiome sans le réduire à la honte ni l’expliciter davantage que l’hébreu.
- source_word: אֲחוֹתְךָ
  choice: ta sœur
  rationale: Terme direct de parenté; le tutoiement singulier conserve l’adresse masculine individuelle et le style juridique du chapitre.
- source_word: בַת אָבִיךָ / בַת אִמֶּךָ
  choice: fille de ton père / fille de ta mère
  rationale: Cette formulation parallèle garde la précision classificatoire de l’hébreu et inclut les sœurs ayant le même père ou la même mère.
- source_word: מוֹלֶדֶת
  choice: née
  rationale: Dans ce contexte, le terme qualifie simplement celle qui est née dans l’un ou l’autre cadre indiqué; « née » est clair et naturel.
- source_word: בַּיִת
  choice: au sein du foyer
  rationale: Dans l’opposition avec חוּץ, בַּיִת peut désigner la maison ou, plus largement, la sphère domestique. « Au sein du foyer » rend naturellement cette portée sociale et familiale.
- source_word: חוּץ
  choice: en dehors de celui-ci
  rationale: Le terme forme un contraste avec בַּיִת. Le pronom explicite en français le cadre de référence sans décider si celui-ci désigne strictement la maison ou plus largement le foyer.
- source_word: לֹא תְגַלֶּה
  choice: Tu ne découvriras pas
  rationale: Le futur à valeur d’interdiction convient au registre législatif biblique en français et préserve l’expression idiomatique liée à עֶרְוָה.
- source_word: אוֹ ... אוֹ
  choice: qu’elle soit… ou…
  rationale: Cette tournure française exprime naturellement les deux possibilités énumérées par l’hébreu.
theological_decisions:
- issue: Étendue de la parenté interdite
  choice: L’interdiction concerne la sœur, qu’elle soit fille du même père ou de la même mère, et quel que soit son lieu ou cadre de naissance.
  alternative: Les derniers qualificatifs peuvent être compris comme distinguant des sœurs élevées ou nées dans le foyer de celles nées ailleurs, éventuellement en lien avec différentes configurations familiales.
  rationale: La formulation hébraïque élargit la catégorie de « sœur » au lieu de la restreindre. La traduction conserve cette portée générale sans introduire de catégories juridiques ou familiales que le verset ne formule pas explicitement.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier et le futur prohibitif maintiennent le registre juridique du passage. La répétition sobre de « fille de » préserve le parallélisme de l’hébreu.
