source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/002.yaml
  text: Speak to the sons of Israel and say to them[b][a], ‘I am Yahweh your God.’
translation:
  language: fr
  text: 'Parle aux fils d’Israël[a] et dis-leur : « Je suis Yahweh[b], votre Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux enfants d’Israël » ou « aux Israélites ». L’hébreu dit littéralement « aux fils d’Israël », expression familiale liée à l’alliance qui désigne le peuple d’Israël.
    reason: lexical_alternative
  - marker: b
    text: Hébreu YHWH, traditionnellement rendu par « le Seigneur ».
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: Parle
  rationale: L’impératif introduit l’ordre divin adressé à Moïse. « Parle » rend directement le verbe hébreu et convient au registre solennel du passage.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: L’expression signifie littéralement « fils d’Israël » et désigne collectivement, dans un cadre familial et d’alliance, le peuple d’Israël.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: et dis-leur
  rationale: Cette formulation conserve la coordination, la seconde personne du singulier et la cadence directe de l’hébreu.
- source_word: אֲנִי
  choice: Je suis
  rationale: Le pronom indépendant reçoit naturellement la copule en français dans cette formule d’identification.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer le titre traditionnel « le Seigneur ».
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Dans son rapport à Yahweh, אֱלֹהִים a ici un sens singulier; le suffixe de deuxième personne masculine plurielle est rendu par « votre ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel de l’alliance sans le remplacer par un titre.
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les enfants d’Israël; les Israélites
  rationale: Le choix conserve l’expression familiale masculine du texte hébreu tout en laissant entendre son emploi collectif pour le peuple de l’alliance.
translation_notes:
  register: Français international moderne, naturel et digne. L’impératif au singulier s’adresse à Moïse; « fils d’Israël » conserve la formulation familiale du texte source. Les appels de notes suivent les éléments auxquels ils se rapportent.
