  text: עֶרְוַ֤ת בַּת בִּנְ/ךָ֙ א֣וֹ בַֽת בִּתְּ/ךָ֔ לֹ֥א תְגַלֶּ֖ה עֶרְוָתָ֑/ן כִּ֥י עֶרְוָתְ/ךָ֖ הֵֽנָּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/010.yaml
  text: You shall not uncover the nakedness of your son's daughter or of your daughter's daughter[b][a], for their nakedness is your own.
translation:
  language: fr
  text: Tu ne découvriras pas la nudité de la fille de ton fils ni celle de la fille de ta fille[a], car elles sont ta nudité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus explicite : « Tu n’auras pas de relations sexuelles avec la fille de ton fils ni avec la fille de ta fille. » L’expression hébraïque signifie littéralement « découvrir la nudité de ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « car elles sont ta nudité ». Cette formule exprime le lien de parenté étroit qui motive l’interdit sexuel.'
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן / עֶרְוָתְךָ
  choice: nudité / leur nudité / ta propre nudité
  rationale: Le mot עֶרְוָה et l’expression juridique גלה ערוה sont rendus de façon cohérente par « nudité » et « découvrir la nudité ». Cette formulation conserve l’euphémisme sexuel répété dans Lévitique 18, tandis que la note en explicite le sens.
- source_word: בַּת בִּנְךָ
  choice: la fille de ton fils
  rationale: Cette formulation reproduit précisément le lien de parenté indiqué par l’hébreu et demeure naturelle en français.
- source_word: בַת בִּתְּךָ
  choice: la fille de ta fille
  rationale: Le parallélisme avec « la fille de ton fils » préserve la structure bilatérale et la précision juridique du texte source.
- source_word: לֹא תְגַלֶּה
  choice: Tu ne découvriras pas
  rationale: Le futur à valeur d’interdiction convient au registre juridique biblique en français et conserve la formule structurante du chapitre.
- source_word: כִּי
  choice: car
  rationale: « Car » exprime clairement la justification introduite par כִּי dans un registre digne et naturel.
- source_word: הֵנָּה
  choice: elles sont
  rationale: Le pronom féminin pluriel renvoie directement aux deux petites-filles mentionnées et maintient la prédication du texte massorétique.
theological_decisions:
- issue: Sens de la justification finale כִּי עֶרְוָתְךָ הֵנָּה
  choice: car elles sont ta propre nudité
  alternative: car leur nudité est la tienne
  rationale: La formulation retenue suit la syntaxe hébraïque, qui identifie les descendantes elles-mêmes à la « nudité » du destinataire. Elle préserve ainsi la logique familiale du texte sans la remplacer dans le corps du verset par une explication telle que « elles sont ta propre chair ».
translation_notes:
  register: Français international moderne, sobre et juridique. Le tutoiement et le futur d’interdiction assurent la cohérence avec le discours législatif adressé à Israël. L’idiome « découvrir la nudité » est conservé pour respecter la répétition structurante de Lévitique 18, avec une explicitation en note.
