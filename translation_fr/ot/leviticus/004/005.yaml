source:
  edition: WLC
  text: וְ/לָקַ֛ח הַ/כֹּהֵ֥ן הַ/מָּשִׁ֖יחַ מִ/דַּ֣ם הַ/פָּ֑ר וְ/הֵבִ֥יא אֹת֖/וֹ אֶל אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/005.yaml
  text: And the anointed priest shall take some of the bull's blood and bring it into the tent of meeting[a][b].
translation:
  language: fr
  text: Le prêtre qui a reçu l’onction prendra une partie du sang du taureau[a] et l’apportera dans la tente de la rencontre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement, « du sang du taureau ». La préposition hébraïque a probablement ici un sens partitif : le prêtre prélève une certaine quantité de sang.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « vers la tente de la rencontre » ou « à la tente de la rencontre ». « Dans » tient compte du contexte rituel, puisque les gestes suivants ont lieu à l’intérieur du sanctuaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: prendra
  rationale: Dans cette procédure sacrificielle, le waw suivi du qatal exprime l’étape suivante de l’instruction. Le futur français rend naturellement cette valeur prescriptive et séquentielle.
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: le prêtre qui a reçu l’onction
  rationale: Cette formulation conserve le sens de מָשִׁיחַ, « oint », tout en étant plus naturelle en français courant que « le prêtre oint ». Elle désigne ici le prêtre dans son statut rituellement consacré sans remplacer le libellé hébreu par le titre interprétatif « grand prêtre ».
- source_word: מִדַּם הַפָּר
  choice: une partie du sang du taureau
  rationale: 'La préposition מִן a vraisemblablement un sens partitif : le prêtre prélève une quantité du sang, non sa totalité. « Une partie du sang » explicite ce sens en français naturel.'
- source_word: וְהֵבִיא אֹתוֹ
  choice: et l’apportera
  rationale: Le pronom objet renvoie au sang qui vient d’être prélevé. Le futur poursuit la formulation prescriptive de la procédure.
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: אֶל signifie normalement « vers, à », mais le contexte rituel et les gestes décrits ensuite indiquent une entrée dans le sanctuaire. « Tente de la rencontre » rend de façon claire et établie אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Traduction de הַכֹּהֵן הַמָּשִׁיחַ dans un contexte chrétien
  choice: le prêtre qui a reçu l’onction
  alternative: le prêtre consacré ; le grand prêtre ; le prêtre oint
  rationale: La traduction préserve la notion explicite d’onction sans substituer le titre interprétatif « grand prêtre » et sans charger cette désignation lévitique d’une portée christologique étrangère au verset.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit le déroulement de la procédure sacrificielle. « Qui a reçu l’onction » évite à la fois l’étrangeté de « prêtre oint » en français courant et l’ajout interprétatif de « grand prêtre ».
