id: LEV.4.22
reference: Leviticus 4:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲשֶׁ֥ר נָשִׂ֖יא יֶֽחֱטָ֑א וְ/עָשָׂ֡ה אַחַ֣ת מִ/כָּל מִצְוֺת֩ יְהוָ֨ה אֱלֹהָ֜י/ו אֲשֶׁ֧ר לֹא תֵעָשֶׂ֛ינָה בִּ/שְׁגָגָ֖ה וְ/אָשֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/022.yaml
  text: When a leader sins and unintentionally does one of any of the things that Yahweh his God has commanded not to be done[a], and becomes guilty[b],
translation:
  language: fr
  text: Lorsqu’un chef[a] pèche et commet involontairement[b] l’un des actes que Yahweh, son Dieu, a commandé de ne pas commettre, il devient coupable,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prince », « dirigeant » ou « responsable » ; l’hébreu נָשִׂיא désigne un chef reconnu de la communauté.
    reason: lexical_alternative
  - marker: b
    text: Ou « par erreur » ou « par inadvertance » ; l’hébreu désigne ici une faute non intentionnelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׂיא
  choice: chef
  rationale: Dans ce contexte, le terme désigne un dirigeant reconnu de la communauté, sans impliquer nécessairement un prince au sens dynastique moderne.
- source_word: יֶחֱטָא
  choice: pèche
  rationale: Le verbe français direct conserve le sens religieux ordinaire de חטא.
- source_word: וְעָשָׂה אַחַת מִכָּל
  choice: en faisant involontairement l’une des choses
  rationale: 'Cette formulation naturelle conserve le sens partitif : une action interdite parmi l’ensemble visé.'
- source_word: מִצְוֺת יְהוָה אֱלֹהָיו
  choice: que Yahweh, son Dieu, a commandé
  rationale: La formulation déploie naturellement le sens de « commandements » devant la proposition relative et conserve le suffixe personnel « son Dieu ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin présent dans le texte hébreu.
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: de ne pas faire
  rationale: Cette tournure française exprime clairement la portée prohibitive du passif hébreu, en lien avec les commandements.
- source_word: בִּשְׁגָגָה
  choice: involontairement
  rationale: Dans la législation sacrificielle, le mot désigne une faute commise sans intention, par erreur ou inadvertance.
- source_word: וְאָשֵׁם
  choice: et qu’il devient ainsi coupable
  rationale: Le verbe décrit l’état de culpabilité qui résulte de l’acte; « ainsi » rend explicitement, sans excès, ce rapport de conséquence.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le nom propre divin; « Yahweh » le préserve au lieu de lui substituer un titre.
- issue: Nature de la faute et culpabilité
  choice: faute involontaire entraînant la culpabilité
  alternative: faute seulement lorsqu’elle est consciente
  rationale: Le texte maintient ensemble l’absence d’intention exprimée par בִּשְׁגָגָה et l’état réel de culpabilité exprimé par וְאָשֵׁם, sans effacer cette tension.
translation_notes:
  register: Français international moderne, clair et digne. « Chef » convient au cadre communautaire et évite les connotations monarchiques de « prince ». La phrase demeure ouverte, comme l’hébreu, sur la prescription sacrificielle qui suit.
