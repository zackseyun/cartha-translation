source:
  edition: WLC
  text: א֚וֹ הוֹדַ֣ע אֵלָ֔י/ו חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א וְ/הֵבִ֨יא קָרְבָּנ֜/וֹ שְׂעִירַ֤ת עִזִּים֙ תְּמִימָ֣ה נְקֵבָ֔ה עַל חַטָּאת֖/וֹ אֲשֶׁ֥ר חָטָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/028.yaml
  text: Or if the sin that he has committed is made known to him[b][a], then he shall bring as his offering for the sin that he has committed a female goat without blemish.
translation:
  language: fr
  text: Ou bien, si le péché qu’il a commis est porté à sa connaissance[a], il apportera une chèvre sans défaut comme offrande pour le péché qu’il a commis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vient à sa connaissance » ou « lui est signalé ». Le passif hébreu peut évoquer aussi bien une prise de conscience personnelle que le fait d’être informé par quelqu’un.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֚וֹ
  choice: Ou bien, si
  rationale: א֚וֹ introduit un autre cas dans la série de prescriptions; en français, « Ou bien, si » explicite naturellement la valeur conditionnelle portée par la proposition.
- source_word: הוֹדַע אֵלָיו
  choice: est porté à sa connaissance
  rationale: Le hophal de ידע exprime ici le fait que le péché vient à la connaissance de la personne. Cette tournure conserve la voix passive sans préciser si elle le découvre elle-même ou si quelqu’un l’en informe.
- source_word: חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: le péché qu’il a commis
  rationale: Dans les deux occurrences, חַטָּאתוֹ désigne la faute commise, et non le sacrifice offert pour cette faute.
- source_word: וְהֵבִיא קָרְבָּנוֹ
  choice: il apportera comme offrande
  rationale: Le parfait avec waw poursuit la prescription légale. Le futur français exprime naturellement l’action exigée dans ce cadre conditionnel.
- source_word: שְׂעִירַת עִזִּים ... נְקֵבָה
  choice: une chèvre, une femelle
  rationale: « Chèvre » rend naturellement la femelle de la chèvre, tandis que l’apposition « une femelle » maintient l’insistance explicite de נְקֵבָה dans le texte hébreu.
- source_word: תְּמִימָה
  choice: sans défaut
  rationale: Expression française courante et précise dans le contexte sacrificiel pour un animal exempt de tare.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: pour le péché qu’il a commis
  rationale: עַל indique ici le rapport entre l’offrande et la faute qui la motive; « pour » le rend sans préciser davantage la nature théologique de ce rapport.
theological_decisions:
- issue: Sens de חַטָּאת dans le contexte sacrificiel
  choice: « péché » dans les deux occurrences
  alternative: Rendre la seconde occurrence par « sacrifice pour le péché » ou « sacrifice d’expiation »
  rationale: L’offrande elle-même est déjà désignée par קָרְבָּנוֹ et identifiée comme une chèvre. Les deux occurrences de חַטָּאתוֹ renvoient donc ici à la faute commise.
- issue: Mode par lequel la faute devient connue
  choice: Maintenir une formulation passive ouverte
  alternative: « il se rend compte de son péché » ou « on l’informe de son péché »
  rationale: Le passif hébreu n’indique pas si la personne prend elle-même conscience de sa faute ou si un tiers la lui signale; la traduction ne tranche pas cette ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la structure juridique conditionnelle et la répétition du péché commis. L’apposition « une femelle » préserve l’insistance du texte source malgré la redondance naturelle avec « chèvre ».
