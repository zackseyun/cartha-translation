id: LEV.4.27
reference: Leviticus 4:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם נֶ֧פֶשׁ אַחַ֛ת תֶּחֱטָ֥א בִ/שְׁגָגָ֖ה מֵ/עַ֣ם הָ/אָ֑רֶץ בַּ֠/עֲשֹׂתָ/הּ אַחַ֨ת מִ/מִּצְוֺ֧ת יְהוָ֛ה אֲשֶׁ֥ר לֹא תֵעָשֶׂ֖ינָה וְ/אָשֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/027.yaml
  text: And if one person from the common people sins unintentionally by doing one of Yahweh’s commandments that must not be done, and becomes guilty,
translation:
  language: fr
  text: Si une personne parmi les membres ordinaires du peuple[a] pèche involontairement en faisant l’une des choses que les commandements de Yahweh interdisent, et devient coupable[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « parmi le peuple du pays ». Ici, l’expression désigne un membre ordinaire de la communauté, par contraste avec un prêtre ou un chef dans les lois voisines.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « est coupable » ou « encourt la culpabilité ». Le verbe hébreu peut exprimer l’entrée dans un état de culpabilité ou le fait de porter cette culpabilité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אַחַת
  choice: une personne
  rationale: Dans cette formulation juridique, נֶפֶשׁ désigne un individu plutôt que l’âme comme composante de l’être humain. « Une personne » conserve le singulier et reste naturel en français.
- source_word: תֶּחֱטָא
  choice: pèche
  rationale: Le verbe חטא est le terme courant pour commettre un péché; la forme verbale directe est précise et concise.
- source_word: בִשְׁגָגָה
  choice: involontairement
  rationale: Le terme indique ici une faute commise sans intention, nuance juridique importante dans la législation sacrificielle.
- source_word: מֵעַם הָאָרֶץ
  choice: parmi les membres ordinaires du peuple
  rationale: Dans le contexte, l’expression désigne un membre ordinaire de la communauté, par contraste avec le prêtre consacré, l’ensemble de la communauté et le chef mentionnés dans les cas voisins. Une note conserve la traduction plus littérale.
- source_word: בַּעֲשֹׂתָהּ אַחַת מִמִּצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: en faisant l’une des choses interdites par les commandements de Yahweh
  rationale: Cette formulation française rend le partitif et la valeur prohibitive de la proposition relative sans l’expression peu naturelle « un commandement qui ne doit pas être fait ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וְאָשֵׁם
  choice: et devient coupable
  rationale: Cette expression présente la culpabilité comme l’état résultant de l’acte, tout en laissant à la note les autres nuances possibles du verbe אשם.
theological_decisions:
- issue: Portée de מֵעַם הָאָרֶץ dans la législation sacrificielle
  choice: parmi les membres ordinaires du peuple
  alternative: parmi le peuple du pays
  rationale: Le contexte oppose ici l’Israélite ordinaire aux catégories traitées auparavant. Le choix principal explicite cette fonction juridique et sociale sans donner à « pays » un sens territorial ou politique indu; la note préserve la forme littérale.
- issue: Valeur de וְאָשֵׁם
  choice: et devient coupable
  alternative: et est coupable / et encourt une culpabilité
  rationale: Le texte peut décrire l’entrée dans un état de culpabilité ou le fait de porter cette culpabilité. Le texte principal garde le mouvement de l’acte vers son résultat, sans préciser davantage la nature théologique de cette culpabilité.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe juridique conditionnelle est conservée, ainsi que la virgule finale qui indique que la phrase se poursuit au verset suivant. Les termes techniques sont rendus sans archaïsme inutile.
