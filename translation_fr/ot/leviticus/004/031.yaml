  text: וְ/אֶת כָּל חֶלְבָּ֣/הּ יָסִ֗יר כַּ/אֲשֶׁ֨ר הוּסַ֣ר חֵלֶב֮ מֵ/עַ֣ל זֶ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֤יר הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָ֑ה וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/031.yaml
  text: And he shall remove all its fat[a], just as the fat is removed from the sacrifice of peace offerings, and the priest shall burn it on the altar as a pleasing aroma to Yahweh. And the priest shall make atonement for him[b], and he will be forgiven.
translation:
  language: fr
  text: Il retirera toute sa graisse, comme on retire la graisse du sacrifice de communion[a]. Le prêtre la fera brûler sur l’autel, en odeur agréable pour le SEIGNEUR[b]. Le prêtre fera l’expiation pour lui, et il sera pardonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de paix ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « YHWH ». L’expression « en odeur agréable » est une formule sacrificielle indiquant que l’offrande est agréée par le SEIGNEUR.'
    reason: cultural_note
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  choice: sa graisse / la graisse
  rationale: Le terme désigne la graisse sacrificielle retirée puis brûlée sur l’autel. « Graisse » est l’équivalent français direct, sans ajouter la précision interprétative « parties grasses ».
- source_word: יָסִיר
  choice: retirera
  rationale: Le hiphil de סור exprime ici l’action d’enlever. Le futur français convient au registre prescriptif de cette section législative.
- source_word: כַּאֲשֶׁר הוּסַר
  choice: comme on retire
  rationale: La tournure renvoie à une procédure sacrificielle établie. Le présent générique avec « on » est naturel en français et conserve la comparaison sans rigidité excessive.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: sacrifice de communion
  rationale: שְׁלָמִים désigne une catégorie sacrificielle associée à l’intégrité, à la paix et à la communion. « Sacrifice de communion » est compréhensible en français moderne; « sacrifice de paix » demeure une traduction possible et figure en note.
- source_word: וְהִקְטִיר
  choice: fera brûler
  rationale: Dans le contexte sacrificiel, le verbe désigne la combustion sur l’autel. Le causatif « fera brûler » rend naturellement l’action rituelle du prêtre.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: en odeur agréable
  rationale: Cette formule sacrificielle traditionnelle exprime l’agrément de l’offrande devant Dieu tout en conservant l’image olfactive du texte hébreu.
- source_word: לַיהוָה
  choice: pour le SEIGNEUR
  rationale: Le tétragramme est rendu par « le SEIGNEUR », convention française largement intelligible; la note signale explicitement le nom hébreu YHWH.
- source_word: וְכִפֶּר עָלָיו
  choice: le prêtre accomplira ainsi le rite d’expiation en sa faveur
  rationale: Cette formulation conserve le langage cultuel de כפר tout en restant claire pour un lectorat moderne. « En sa faveur » rend עָלָיו sans préciser un mécanisme théologique absent du verset.
- source_word: וְנִסְלַח לוֹ
  choice: et il sera pardonné
  rationale: Le passif préserve le résultat exprimé par le niphal de סלח sans nommer explicitement l’agent du pardon, comme le fait l’hébreu.
theological_decisions:
- issue: Lien entre le rite d’expiation sacerdotal et le pardon
  choice: « le prêtre accomplira ainsi le rite d’expiation en sa faveur, et il sera pardonné »
  alternative: « le prêtre fera l’expiation pour lui, et le pardon lui sera accordé »
  rationale: Le texte relie directement l’acte rituel accompli par le prêtre au pardon reçu, sans exposer davantage son mécanisme. La traduction maintient ce lien et cette réserve théologique.
- issue: Désignation du sacrifice שְׁלָמִים
  choice: sacrifice de communion
  alternative: sacrifice de paix
  rationale: Les deux expressions reflètent des aspects réels du terme hébreu. Le texte retient la formulation plus immédiatement évocatrice de la dimension partagée du sacrifice, tout en conservant l’autre lecture en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur garde la force prescriptive du passage. La terminologie cultuelle essentielle (« autel », « sacrifice », « rite d’expiation ») est conservée, tandis que la syntaxe reste naturelle. « Ainsi » explicite légèrement le rapport procédural entre l’offrande et l’expiation, sans développer de causalité doctrinale.
