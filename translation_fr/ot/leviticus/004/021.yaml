  text: וְ/הוֹצִ֣יא אֶת הַ/פָּ֗ר אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וְ/שָׂרַ֣ף אֹת֔/וֹ כַּ/אֲשֶׁ֣ר שָׂרַ֔ף אֵ֖ת הַ/פָּ֣ר הָ/רִאשׁ֑וֹן חַטַּ֥את הַ/קָּהָ֖ל הֽוּא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/021.yaml
  text: He shall bring the bull outside the camp and burn it[a], just as he burned the first bull. It is the sin offering for the assembly.
translation:
  language: fr
  text: Il fera sortir le taureau hors du camp et le brûlera, comme il a brûlé le premier taureau. C’est le sacrifice pour le péché[a] de l’assemblée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification ». Le terme hébreu peut souligner le rôle du sacrifice dans la purification aussi bien que dans le traitement du péché.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: Il fera sortir
  rationale: Le hiphil de יצא exprime ici l’action de faire sortir ou d’emporter le taureau; « fera sortir » est direct et naturel en français.
- source_word: הַפָּר
  choice: le taureau
  rationale: פַּר désigne un taureau, éventuellement jeune; « taureau » est précis sans ajouter une nuance d’âge incertaine.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: hors du camp
  rationale: La séquence prépositionnelle indique un déplacement au-delà des limites du camp; « hors du camp » conserve cette orientation et convient au registre biblique moderne.
- source_word: וְשָׂרַף אֹתוֹ
  choice: et le brûlera
  rationale: שׂרף est le verbe courant « brûler »; le futur coordonné rend naturellement la prescription hébraïque.
- source_word: כַּאֲשֶׁר שָׂרַף
  choice: comme il a brûlé
  rationale: כַּאֲשֶׁר introduit une comparaison avec la procédure précédente; « comme » exprime clairement cette correspondance.
- source_word: הַפָּר הָרִאשׁוֹן
  choice: le premier taureau
  rationale: רִאשׁוֹן renvoie au taureau décrit auparavant; la traduction littérale demeure claire dans le contexte.
- source_word: חַטַּאת
  choice: sacrifice pour le péché
  rationale: Dans ce contexte rituel, חַטָּאת désigne l’offrande sacrificielle liée au péché. « Sacrifice pour le péché » est intelligible en français courant et évite que « offrande » soit compris comme un simple don.
- source_word: הַקָּהָל
  choice: l’assemblée
  rationale: קָהָל désigne ici la collectivité réunie; « assemblée » préserve la dimension communautaire sans imposer un vocabulaire ecclésiastique.
- source_word: הוּא
  choice: C’est
  rationale: Le pronom établit une identification prédicative; « C’est » rend cette fonction avec naturel et peut viser l’acte sacrificiel ou le taureau comme sacrifice.
theological_decisions:
- issue: Traduction de חַטַּאת dans la législation sacrificielle
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le terme peut mettre en avant le traitement du péché ou la purification rituelle. Le texte identifie ici le taureau comme sacrifice de la collectivité; la traduction principale retient la formulation traditionnelle et accessible, tandis que la note préserve l’autre nuance reconnue.
translation_notes:
  register: Français international moderne, clair et digne. La structure prescriptive et la comparaison avec le premier taureau sont conservées; la formulation évite le jargon technique tout en maintenant l’ambiguïté cultuelle de חַטַּאת dans une note.
