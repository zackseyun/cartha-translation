  source_fidelity: 'Le sens sacrificiel est bien rendu : יוּרַם décrit le prélèvement des portions grasses, et וְהִקְטִירָם leur combustion rituelle sur l’autel. Toutefois, la première phrase française, introduite par « comme », ne peut pas constituer à elle seule une phrase autonome. La note doit aussi refléter le singulier du verbe hébreu, qui renvoie collectivement à la graisse plutôt qu’aux portions au pluriel.'
  naturalness: « Sacrifice de communion », « taureau », « le prêtre » et « l’autel de l’holocauste » sont naturels dans un registre biblique moderne. La réunion des deux propositions en une phrase rétablit une syntaxe française fluide sans ajouter de sens.
