  text: just as it is removed from the ox of the sacrifice of peace offerings[a], and the priest shall burn them on the altar of burnt offering.
translation:
  language: fr
  text: comme on les prélève sur le taureau du sacrifice de communion[a], le prêtre les fera brûler sur l’autel de l’holocauste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « comme [la graisse] est élevée du taureau du sacrifice de communion ». Le verbe hébreu évoque à la fois l’élévation et le prélèvement des parties destinées à être offertes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: Introduit naturellement en français la comparaison avec la procédure déjà prescrite pour le sacrifice de communion.
- source_word: יוּרַם
  choice: on les prélève
  rationale: Le hophal de רום signifie littéralement « être élevé », mais désigne ici le prélèvement sur l’animal des parties grasses mentionnées au verset précédent. Le pluriel explicite leur référent en français.
- source_word: מִשּׁוֹר
  choice: sur le taureau
  rationale: שׁוֹר désigne un bovin; dans ce contexte sacrificiel, « taureau » est précis et naturel.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: le sacrifice de communion
  rationale: Rend l’expression sacrificielle comme une unité et exprime sa dimension relationnelle sans réduire שְׁלָמִים au seul sens de paix.
- source_word: וְהִקְטִירָם
  choice: les fera brûler
  rationale: Dans le vocabulaire sacrificiel, le hiphil de קטר désigne la combustion des parts offertes sur l’autel; le pronom renvoie aux parties grasses du verset précédent.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Équivalent français courant du ministre cultuel.
- source_word: עַל מִזְבַּח הָעֹלָה
  choice: sur l’autel de l’holocauste
  rationale: Formulation française consacrée pour l’autel où l’holocauste est offert.
theological_decisions:
- issue: Sens de זֶבַח הַשְּׁלָמִים
  choice: sacrifice de communion
  alternative: sacrifice de paix
  rationale: « Sacrifice de communion » est une désignation cultuelle française claire et largement compréhensible; elle évite de faire de l’offrande un simple sacrifice destiné à obtenir la paix, tout en laissant la note lexicale hors du corps du texte.
translation_notes:
  register: Français moderne, sobre et liturgiquement digne. La reprise « les » relie explicitement ce verset aux parties grasses énumérées au verset précédent. La phrase est scindée en deux pour éviter une coordination lourde en français.
