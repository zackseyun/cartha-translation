source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֣י יִשְׂרָאֵ֘ל לֵ/אמֹר֒ נֶ֗פֶשׁ כִּֽי תֶחֱטָ֤א בִ/שְׁגָגָה֙ מִ/כֹּל֙ מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/עָשָׂ֕ה מֵ/אַחַ֖ת מֵ/הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a person sins unintentionally in regard to any of the commandments of Yahweh concerning things that should not be done, and does one of them[b],'
translation:
  language: fr
  text: '« Parle aux Israélites[a] et dis-leur : Si une personne pèche involontairement[b] à l’égard de l’un quelconque des commandements de Yahweh qui interdisent certains actes, et commet l’un de ces actes, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils d’Israël »; on peut aussi traduire : « aux enfants d’Israël » ou « au peuple d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « par erreur », « par inadvertance ». L’hébreu désigne ici un péché qui n’est pas commis délibérément dans un esprit de défi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר
  choice: Parle aux Israélites et dis-leur
  rationale: Cette formulation française naturelle rend l’impératif et la formule hébraïque introduisant le discours, sans reproduire littéralement le redondant « en disant ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Dans ce contexte collectif, l’expression désigne le peuple d’Israël. « Les Israélites » est clair, inclusif et idiomatique en français moderne; le sens littéral est signalé en note.
- source_word: נֶפֶשׁ
  choice: une personne
  rationale: Dans cette prescription juridique, נֶפֶשׁ désigne un individu, non spécialement l’âme comme composante immatérielle.
- source_word: תֶחֱטָא
  choice: pèche
  rationale: Rend directement le verbe חטא tout en conservant le caractère moral et cultuel de la faute.
- source_word: בִשְׁגָגָה
  choice: involontairement
  rationale: Le terme évoque une faute commise par inadvertance ou par erreur, par opposition à un acte délibéré de défi.
- source_word: מִכֹּל מִצְוֺת יְהוָה
  choice: à l’égard de l’un quelconque des commandements de Yahweh
  rationale: La tournure exprime le rapport entre le péché et l’un quelconque des commandements concernés, sans imposer au préfixe מן le sens plus fort de « contre ».
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: qui interdisent certains actes
  rationale: Cette formulation française explicite naturellement la force impersonnelle de « qui ne doivent pas être faits » et rattache la proposition aux commandements.
- source_word: וְעָשָׂה מֵאַחַת מֵהֵנָּה
  choice: et qu’elle commette l’un de ces actes
  rationale: La reprise renvoie clairement aux actes interdits qui viennent d’être mentionnés et conserve la continuation de la condition juridique.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le tétragramme, nom propre de Dieu. « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Nature du péché visé par בִשְׁגָגָה
  choice: faute involontaire
  alternative: faute commise par erreur
  rationale: Le verset traite d’un péché non prémédité; la traduction évite toutefois de minimiser sa réalité ou sa portée en le réduisant à une simple maladresse.
translation_notes:
  register: Français international moderne, clair et digne, avec une syntaxe juridique lisible. Le verset demeure ouvert, comme dans l’hébreu, puisqu’il introduit une condition dont la suite vient aux versets suivants.
