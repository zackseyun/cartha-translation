revisions:
- from: Si quelqu’un amène comme présent un agneau destiné au sacrifice pour le péché[a], il amènera une femelle sans défaut.
  to: S’il apporte un agneau comme offrande pour le sacrifice pour le péché[a], il devra apporter une femelle sans défaut.
  rationale: La révision remplace des formulations indirectes par une syntaxe française plus naturelle, conserve la distinction entre l’offrande générale (קָרְבָּן) et le sacrifice pour le péché (חַטָּאת), et maintient en note l’ambiguïté lexicale reconnue. « Femelle sans défaut » correspond directement aux deux qualifications hébraïques.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:23:01Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens essentiel est rendu, y compris l’animal, son emploi sacrificiel, l’exigence d’une femelle et l’absence de défaut. Toutefois, « destiné au sacrifice pour le péché » explicite inutilement une relation que l’hébreu exprime plus simplement par « comme offrande pour », et « présent » atténue le sens technique de קָרְבָּן dans ce contexte cultuel.
  naturalness: La phrase proposée est compréhensible, mais l’enchaînement « comme présent un agneau destiné au sacrifice » est moins idiomatique et plus lourd que nécessaire. « Apporter ... comme offrande pour le sacrifice pour le péché » est naturel en français moderne tout en conservant les deux niveaux lexicaux du texte.
  terminology: « Sacrifice pour le péché » convient comme rendu traditionnel de חַטָּאת; la note préserve à juste titre l’alternative « sacrifice de purification ». « Offrande » est préférable à « présent » pour קָרְבָּן dans une prescription sacrificielle.
  issues:
  - severity: medium
    issue: « présent » pour קָרְבָּנוֹ et « destiné au sacrifice pour le péché » pour לְחַטָּאת
    rationale: Dans ce contexte, « offrande » est le terme français cultuel usuel pour l’offrande apportée, tandis que « destiné au » transforme une relation syntaxique simple en formulation indirecte et pesante.
  - severity: low
    issue: Reprise finale du verbe sans objet explicite
    rationale: « Il amènera une femelle sans défaut » est intelligible, mais « il devra apporter une femelle sans défaut » exprime plus naturellement en français la force prescriptive et l’exigence finale.
  revised_text: S’il apporte un agneau comme offrande pour le sacrifice pour le péché[a], il devra apporter une femelle sans défaut.
  revised_footnotes:
