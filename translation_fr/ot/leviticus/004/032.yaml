  text: וְ/אִם כֶּ֛בֶשׂ יָבִ֥יא קָרְבָּנ֖/וֹ לְ/חַטָּ֑את נְקֵבָ֥ה תְמִימָ֖ה יְבִיאֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/032.yaml
  text: And if he brings a lamb as his offering for a sin offering[a], he shall bring a female without blemish.
translation:
  language: fr
  text: S’il apporte un agneau comme offrande pour le sacrifice pour le péché[a], il devra apporter une femelle sans défaut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification ». Le terme hébreu חַטָּאת peut désigner le sacrifice qui concerne le péché et l’impureté rituelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Si quelqu’un
  rationale: Introduit naturellement en français un cas alternatif dans la suite des prescriptions; le sujet indéfini explicite le référent du verbe hébreu à la troisième personne.
- source_word: כֶּבֶשׂ
  choice: un agneau
  rationale: Désigne ici un ovin du petit bétail; « agneau » est le terme sacrificiel usuel et convient à la précision ultérieure concernant le sexe.
- source_word: יָבִיא
  choice: amène
  rationale: Le hiphil de בוא exprime concrètement le fait d’amener l’animal; ce choix conserve aussi la répétition du verbe à la fin du verset.
- source_word: קָרְבָּנוֹ
  choice: comme présent
  rationale: קָרְבָּן désigne ce qui est apporté ou présenté à Dieu. « Présent » distingue ici l’apport général de la catégorie sacrificielle précisée ensuite.
- source_word: לְחַטָּאת
  choice: destiné au sacrifice pour le péché
  rationale: Rend la destination de l’animal et le nom de la catégorie sacrificielle, tout en signalant en note la nuance possible de purification.
- source_word: נְקֵבָה
  choice: une femelle
  rationale: Exprime directement le sexe exigé pour l’animal.
- source_word: תְמִימָה
  choice: sans défaut
  rationale: Dans les lois sacrificielles, תמים qualifie un animal exempt de défaut; cette formulation est précise et naturelle en français moderne.
- source_word: יְבִיאֶנָּה
  choice: il amènera
  rationale: Conserve la reprise insistante du verbe hébreu et la valeur prescriptive de la forme verbale; le complément féminin est explicité par la proposition qui suit.
theological_decisions:
- issue: Sens de חַטָּאת dans la législation sacrificielle
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le terme désigne traditionnellement le sacrifice lié au péché, mais peut mettre l’accent sur la purification du sanctuaire ou de la personne. La traduction principale demeure immédiatement intelligible, tandis que la note préserve cette nuance réelle sans trancher excessivement.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition d’« amener » reflète celle du texte hébreu. « Présent » évite la répétition immédiate d’« offrande » et conserve la distinction entre קָרְבָּן, terme général, et חַטָּאת, catégorie sacrificielle précise.
