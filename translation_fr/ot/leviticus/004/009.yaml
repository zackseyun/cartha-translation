base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/009.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, along with the kidneys, he shall remove it.
translation:
  language: fr
  text: les deux reins, la graisse qui est sur eux et sur les lombes, et l’appendice situé sur le foie[a] ; il enlèvera cet appendice avec les reins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le lobe du foie ». Le terme hébreu désignant cette partie anatomique est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: les deux reins
  rationale: Expression anatomique directe qui conserve le nombre explicite de l’hébreu.
- source_word: הַחֵלֶב
  choice: la graisse
  rationale: Dans les prescriptions sacrificielles, le terme désigne les parties grasses réservées à l’offrande. « Graisse » est clair et courant en français moderne.
- source_word: אֲשֶׁר עֲלֵיהֶן אֲשֶׁר עַל הַכְּסָלִים
  choice: qui les recouvre du côté des lombes
  rationale: Cette formulation naturelle rattache la graisse aux reins et situe la portion concernée dans la région des lombes, sans alourdir la double relative hébraïque.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: l’appendice situé sur le foie
  rationale: Le terme anatomique יוֹתֶרֶת est incertain. « Appendice » évite de préciser indûment qu’il s’agit d’un lobe, tandis que « situé sur » rend la préposition עַל.
- source_word: עַל הַכְּלָיוֹת
  choice: avec les reins
  rationale: Dans cette formule rituelle, l’expression indique que l’appendice doit être retiré avec les reins; cette lecture convient mieux au geste décrit qu’un « sur » strictement spatial.
- source_word: יְסִירֶנָּה
  choice: il enlèvera cet appendice
  rationale: Le suffixe féminin singulier renvoie naturellement à יוֹתֶרֶת, nom féminin. La répétition explicite de « cet appendice » lève en français une ambiguïté grammaticale sans modifier le référent probable.
