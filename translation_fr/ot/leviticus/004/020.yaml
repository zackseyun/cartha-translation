revisions:
- from: Il fera de ce taureau exactement ce qu’il a fait du taureau offert en sacrifice pour le péché[a] ; il fera de même pour lui. Le prêtre accomplira pour eux le rite d’expiation, et ils seront pardonnés.
  to: Il traitera ce taureau comme il a traité le taureau du sacrifice pour le péché[a] ; il le traitera ainsi. Le prêtre fera l’expiation pour eux, et ils seront pardonnés.
  rationale: La révision rend plus directement l’identification du « taureau du sacrifice pour le péché », conserve la répétition procédurale de l’hébreu dans un français naturel, et traduit כפר sans explicitation supplémentaire. La note maintient l’ambiguïté lexicale reconnue de חטאת.
