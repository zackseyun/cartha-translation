  text: וְ/עָשָׂ֣ה לַ/פָּ֔ר כַּ/אֲשֶׁ֤ר עָשָׂה֙ לְ/פַ֣ר הַֽ/חַטָּ֔את כֵּ֖ן יַעֲשֶׂה לּ֑/וֹ וְ/כִפֶּ֧ר עֲלֵ/הֶ֛ם הַ/כֹּהֵ֖ן וְ/נִסְלַ֥ח לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/020.yaml
  text: He shall do with the bull just as he did with the bull of the sin offering; so he shall do with it. And the priest shall make atonement for them[a], and they shall be forgiven.
translation:
  language: fr
  text: Il traitera ce taureau comme il a traité le taureau du sacrifice pour le péché[a] ; il le traitera ainsi. Le prêtre fera l’expiation pour eux, et ils seront pardonnés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification ». Le terme hébreu peut désigner le sacrifice qui traite le péché en opérant une purification.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה לַפָּר
  choice: Il fera de ce taureau
  rationale: Le verbe עשה avec ל décrit ici ce que l’officiant doit faire à l’égard de l’animal. Cette tournure française est naturelle dans une instruction rituelle.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: exactement ce qu’il a fait
  rationale: כַּאֲשֶׁר établit une correspondance avec la procédure précédente ; « exactement » rend explicite la conformité demandée sans ajouter d’étape au rite.
- source_word: לְפַר הַחַטָּאת
  choice: du taureau offert en sacrifice pour le péché
  rationale: La formulation identifie clairement l’animal du rite précédemment décrit et évite une construction nominale trop lourde en français.
- source_word: הַחַטָּאת
  choice: sacrifice pour le péché
  rationale: Dans ce contexte sacrificiel, חטאת désigne l’offrande qui traite le péché. La traduction traditionnelle et immédiatement compréhensible est retenue dans le texte, tandis que la valeur de purification est signalée en note.
- source_word: כֵּן יַעֲשֶׂה לּוֹ
  choice: il fera de même pour lui
  rationale: כֵּן marque l’identité de procédure. Le pronom masculin singulier renvoie au taureau ; « pour lui » conserve cette référence, même si « avec lui » serait également idiomatique.
- source_word: וְכִפֶּר עֲלֵהֶם הַכֹּהֵן
  choice: Le prêtre accomplira pour eux le rite d’expiation
  rationale: כפר est un terme cultuel central. « Accomplir le rite d’expiation » exprime son caractère rituel, tandis que « pour eux » rend la portée représentative de עֲלֵהֶם.
- source_word: וְנִסְלַח לָהֶם
  choice: et ils seront pardonnés
  rationale: Le nifal de סלח exprime ici le pardon accordé comme résultat du rite. La tournure personnelle est claire et naturelle en français moderne.
theological_decisions:
- issue: Sens de חטאת dans la législation sacrificielle
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le terme hébreu peut mettre en avant soit le péché auquel le sacrifice répond, soit la purification qu’il produit. Le texte principal retient l’expression française la plus connue sans éliminer l’autre nuance, conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition procédurale de l’hébreu est largement conservée, de même que le vocabulaire cultuel d’« expiation » et la tension lexicale entre péché et purification.
