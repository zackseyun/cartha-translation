  text: וְ/סָמַ֤ךְ יָד/וֹ֙ עַל רֹ֣אשׁ הַ/שָּׂעִ֔יר וְ/שָׁחַ֣ט אֹת֔/וֹ בִּ/מְק֛וֹם אֲשֶׁר יִשְׁחַ֥ט אֶת הָ/עֹלָ֖ה לִ/פְנֵ֣י יְהוָ֑ה חַטָּ֖את הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/024.yaml
  text: And he shall lay his hand on the head of the goat and slaughter it in the place where they slaughter the burnt offering before Yahweh[a]. It is a sin offering.
translation:
  language: fr
  text: Il posera la main sur la tête du bouc et l’égorgera à l’endroit où l’on égorge l’holocauste devant Yahvé. C’est un sacrifice pour le péché[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un sacrifice de purification ». Le terme hébreu חַטָּאת peut désigner le péché ou l’offrande associée à l’élimination de l’impureté ou du péché.'
    reason: Alternative lexicale préservant l’étendue sémantique du terme cultuel hébreu.
lexical_decisions:
- source_word: וְסָמַךְ יָדוֹ
  choice: Il posera la main
  rationale: Dans le rituel sacrificiel, l’expression désigne le geste consistant à poser sa main sur l’animal. Le singulier « la main » respecte l’hébreu et sonne naturellement en français.
- source_word: עַל רֹאשׁ הַשָּׂעִיר
  choice: sur la tête du bouc
  rationale: שָׂעִיר désigne ici un caprin mâle; « bouc » conserve cette précision contextuelle.
- source_word: וְשָׁחַט אֹתוֹ
  choice: et l’égorgera
  rationale: שׁחט est le verbe usuel de l’abattage rituel. « Égorgea » exprime précisément ce geste sacrificiel en français.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: à l’endroit où l’on égorge
  rationale: La tournure active impersonnelle rend naturellement l’imparfait hébreu actif sans introduire un sujet déterminé absent du texte.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: « Holocauste » est le terme français traditionnel et toujours intelligible pour l’offrande entièrement consumée.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahvé
  rationale: « Devant » rend directement לִפְנֵי, et « Yahvé » représente le nom divin יהוה sous sa forme française courante.
- source_word: חַטָּאת הוּא
  choice: C’est un sacrifice pour le péché
  rationale: La proposition classe l’animal ou le rite comme חַטָּאת. Cette formulation est claire en français tout en permettant de signaler en note l’autre compréhension cultuelle du terme.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » est la forme française usuelle qui conserve le caractère de nom propre.
- issue: Sens cultuel de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le terme peut désigner le péché ainsi que l’offrande liée à son traitement rituel et à la purification. Le rendu principal reste transparent et établi, tandis que la note préserve l’alternative sans trancher abusivement.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur normatif convient au style législatif. Le vocabulaire sacrificiel précis (« bouc », « égorger », « holocauste ») est maintenu sans lourdeur archaïque.
