source:
  edition: WLC
  text: וְ/אֶת כָּל חֵ֛לֶב פַּ֥ר הַֽ/חַטָּ֖את יָרִ֣ים מִמֶּ֑/נּוּ אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה עַל הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/008.yaml
  text: 'And he shall remove from it all the fat of the sin offering bull: the fat that covers the entrails and all the fat that is on the entrails,[a]'
translation:
  language: fr
  text: 'Il prélèvera sur le taureau offert pour le péché toute la graisse : la graisse qui recouvre les entrailles et toute celle qui est sur les entrailles.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le taureau offert pour la purification ». Le terme hébreu חַטָּאת peut désigner à la fois le péché et le sacrifice associé à l’élimination de l’impureté ou du péché.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: toute
  rationale: Conserve la portée exhaustive de l’hébreu pour l’ensemble de la graisse prescrite.
- source_word: חֵלֶב
  choice: graisse
  rationale: Rendu direct et naturel du terme désignant ici les parties grasses réservées au sacrifice.
- source_word: פַּר הַחַטָּאת
  choice: le taureau offert pour le péché
  rationale: Exprime naturellement en français que le taureau est destiné à ce sacrifice, sans laisser entendre qu’il serait lui-même qualifié de péché.
- source_word: יָרִים מִמֶּנּוּ
  choice: il prélèvera sur le taureau
  rationale: Dans cette procédure sacrificielle, le verbe signifie enlever ou séparer les parties prescrites; «prélever» rend précisément cette action et explicite sans ambiguïté le référent du pronom.
- source_word: הַמְכַסֶּה
  choice: qui recouvre
  rationale: Le participe décrit la position de la graisse; la proposition relative est naturelle en français.
- source_word: קֶרֶב
  choice: entrailles
  rationale: Terme concret, courant et suffisamment précis dans ce contexte anatomique sacrificiel.
- source_word: אֲשֶׁר עַל הַקֶּרֶב
  choice: qui est sur les entrailles
  rationale: Préserve la relation spatiale exprimée par עַל et la distingue de la graisse qui les recouvre.
theological_decisions:
- issue: Traduction de חַטָּאת dans le contexte sacrificiel
  choice: offert pour le péché
  alternative: offert pour la purification
  rationale: «Sacrifice pour le péché» demeure le rendu français traditionnel et largement intelligible, tandis que la note conserve l’autre valeur cultuelle possible du terme hébreu sans trancher silencieusement la tension lexicale.
translation_notes:
  register: Français international moderne, clair et digne. «Prélever» convient au registre rituel sans être technique; la répétition de «entrailles» suit la structure insistante de l’hébreu.
