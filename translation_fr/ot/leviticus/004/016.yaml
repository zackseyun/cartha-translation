id: LEV.4.16
reference: Leviticus 4:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הֵבִ֛יא הַ/כֹּהֵ֥ן הַ/מָּשִׁ֖יחַ מִ/דַּ֣ם הַ/פָּ֑ר אֶל אֹ֖הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/016.yaml
  text: Then the anointed priest shall bring some of the bull's blood into the tent of meeting[a][b].
translation:
  language: fr
  text: Puis le prêtre qui a reçu l’onction apportera une partie du sang du taureau[a] dans la tente de la rencontre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « du sang du taureau ». La préposition hébraïque a probablement un sens partitif : seule une partie du sang est apportée à l’intérieur.'
    reason: lexical_alternative
  - marker: b
    text: 'Traduction traditionnelle : « la tente d’assignation » ou « le tabernacle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Puis … apportera
  rationale: Le parfait hiphil précédé de la conjonction poursuit la séquence des prescriptions rituelles. « Puis » exprime naturellement cette progression en français.
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: le prêtre qui a reçu l’onction
  rationale: Dans ce contexte sacerdotal, הַמָּשִׁיחַ désigne le prêtre établi dans sa fonction par l’onction. Cette formulation reste claire en français moderne sans transformer le terme en titre messianique.
- source_word: מִדַּם הַפָּר
  choice: une partie du sang du taureau
  rationale: 'La préposition מִן a vraisemblablement ici un sens partitif : le prêtre n’emporte à l’intérieur qu’une partie du sang. « Taureau » rend פַּר sans ajouter une indication d’âge que ce verset n’exige pas.'
- source_word: אֶל
  choice: dans
  rationale: Avec le verbe de mouvement et la tente comme destination, « dans » rend l’entrée dans l’espace sacré impliquée par le rite, plutôt que le simple mouvement vers celui-ci.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette expression traduit directement le nom hébreu du sanctuaire tout en restant transparente pour un lectorat moderne.
theological_decisions:
- issue: Sens de הַמָּשִׁיחַ dans un contexte sacerdotal
  choice: qui a reçu l’onction
  alternative: oint ; consacré ; Messie
  rationale: Le mot décrit ici le prêtre investi de sa charge par l’onction. « Messie » introduirait à tort un titre christologique, tandis que « consacré » ferait disparaître la référence explicite à l’onction.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe suit clairement la progression de la procédure rituelle, et le vocabulaire conserve les images cultuelles du texte hébreu sans archaïsme inutile.
