source:
  edition: WLC
  text: וְ/אֶת ע֤וֹר הַ/פָּר֙ וְ/אֶת כָּל בְּשָׂר֔/וֹ עַל רֹאשׁ֖/וֹ וְ/עַל כְּרָעָ֑י/ו וְ/קִרְבּ֖/וֹ וּ/פִרְשֽׁ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/011.yaml
  text: But the hide of the bull[a], and all its flesh[c][b], with its head and with its legs and its entrails and its dung—
translation:
  language: fr
  text: Mais la peau du taureau, toute sa chair, avec sa tête, ses pattes, ses entrailles et ses excréments —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹר
  choice: peau
  rationale: Dans ce contexte sacrificiel, « peau » désigne naturellement l'enveloppe retirée de l'animal et correspond directement au terme hébreu.
- source_word: הַפָּר
  choice: le taureau
  rationale: פַּר désigne un taureau, éventuellement un jeune taureau ; le contexte immédiat a déjà identifié l'animal et « taureau » suffit en français.
- source_word: כָּל בְּשָׂרוֹ
  choice: toute sa chair
  rationale: « Chair » conserve le caractère concret et anatomique de בָּשָׂר sans le réduire à de la viande destinée à l'alimentation.
- source_word: עַל רֹאשׁוֹ
  choice: avec sa tête
  rationale: Dans cette énumération, עַל marque l'inclusion des différentes parties ; « avec » est plus naturel en français que le sens spatial « sur ».
- source_word: וְעַל כְּרָעָיו
  choice: ses pattes
  rationale: כְּרָעַיִם désigne les membres ou pattes de l'animal ; « pattes » convient mieux que « jambes » pour un bovin.
- source_word: וְקִרְבּוֹ
  choice: ses entrailles
  rationale: Dans l'anatomie sacrificielle, קֶרֶב désigne les parties internes ; « entrailles » est précis, courant et concret.
- source_word: וּפִרְשׁוֹ
  choice: ses excréments
  rationale: פֶּרֶשׁ désigne les matières fécales contenues dans l'animal ; « excréments » est exact et digne en français moderne.
