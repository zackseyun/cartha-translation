revisions:
- from: Il emportera tout le taureau hors du camp, dans un endroit pur[a], là où l’on déverse les cendres, et il le brûlera au feu sur du bois. C’est là où l’on déverse les cendres qu’il sera brûlé.
  to: Il emportera tout le taureau dans un lieu pur[a], hors du camp, au lieu où l’on déverse les cendres, et le brûlera sur du bois, dans le feu ; c’est au lieu où l’on déverse les cendres qu’il sera brûlé.
  rationale: La révision est stylistique et syntaxique, sans changement de sens. Elle conserve l’intégralité du taureau, le caractère pur du lieu, sa situation hors du camp, la désignation répétée du lieu de déversement des cendres, ainsi que le bois et le feu comme éléments distincts de la combustion.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:22:58Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : le taureau entier est transporté hors du camp vers un lieu pur et y est brûlé. Une légère révision améliore toutefois l’ordre des compléments, la formulation du lieu de déversement des cendres et la correspondance de « sur du bois, dans le feu » avec עַל עֵצִים בָּאֵשׁ.'
  naturalness: « C’est là où l’on déverse les cendres qu’il sera brûlé » est compréhensible, mais moins naturel et moins soigné que « c’est au lieu où l’on déverse les cendres qu’il sera brûlé ». La ponctuation et l’ordre révisés rendent aussi la phrase prescriptive plus fluide en français international moderne.
  terminology: « Lieu pur » convient dans ce contexte cultuel, avec une note qui précise la portée rituelle sans la surinterpréter. La périphrase « le lieu où l’on déverse les cendres » préserve utilement l’absence de précision sur la forme matérielle du site. « Sur du bois, dans le feu » maintient les deux éléments de l’hébreu.
  issues:
  - severity: low
    issue: Formulation finale peu idiomatique
    rationale: La tournure « C’est là où... » est moins naturelle en registre soigné que « C’est au lieu où... », tout en gardant l’emphase et la répétition du lieu.
  - severity: low
    issue: Ordre des compléments liés à la combustion
    rationale: « Au feu sur du bois » peut se comprendre, mais « sur du bois, dans le feu » rend plus distinctement les deux compléments hébreux, עַל עֵצִים et בָּאֵשׁ.
  - severity: low
    issue: Organisation des indications de lieu
    rationale: 'Placer « dans un lieu pur » avant « hors du camp » reflète plus directement la construction : un lieu pur situé hors du camp, puis son identification comme lieu de déversement des cendres.'
  revised_text: Il emportera tout le taureau dans un lieu pur[a], hors du camp, au lieu où l’on déverse les cendres, et le brûlera sur du bois, dans le feu ; c’est au lieu où l’on déverse les cendres qu’il sera brûlé.
  revised_footnotes:
