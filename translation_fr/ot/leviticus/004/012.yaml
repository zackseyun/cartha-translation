base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/012.yaml
  text: He shall bring out the whole bull to a clean place[a] outside the camp, to the ash dump, and burn it on wood in the fire[b]; it shall be burned at the ash dump.
translation:
  language: fr
  text: Il emportera tout le taureau dans un lieu pur[a], hors du camp, au lieu où l’on déverse les cendres, et le brûlera sur du bois, dans le feu ; c’est au lieu où l’on déverse les cendres qu’il sera brûlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire un lieu rituellement pur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: Il emportera
  rationale: Le hiphil de יצא exprime ici le fait de faire sortir ou d’emporter hors d’un lieu. « Emportera » convient au déplacement de l’animal entier et reste naturel dans une prescription.
- source_word: כָּל הַפָּר
  choice: tout le taureau
  rationale: כָּל avec le nom défini souligne que l’animal entier doit être emporté.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: hors du camp
  rationale: Cette formulation claire et traditionnelle indique un emplacement au-delà des limites du camp.
- source_word: מָקוֹם טָהוֹר
  choice: un endroit pur
  rationale: Dans le Lévitique, טָהוֹר renvoie souvent à la pureté rituelle. « Pur » conserve cette nuance plus justement que « propre », qui évoquerait surtout l’hygiène en français moderne.
- source_word: שֶׁפֶךְ הַדֶּשֶׁן
  choice: là où l’on déverse les cendres
  rationale: La formulation rend explicitement le lieu désigné où les cendres sont versées, sans imposer l’image d’un tas, d’une fosse ou d’une décharge que l’hébreu ne précise pas.
- source_word: וְשָׂרַף אֹתוֹ
  choice: et il le brûlera
  rationale: שׂרף signifie simplement « brûler » ; le futur français convient au style prescriptif du passage.
- source_word: עַל עֵצִים בָּאֵשׁ
  choice: au feu sur du bois
  rationale: Cette tournure française naturelle conserve à la fois le bois servant de combustible et le feu dans lequel l’animal est brûlé.
- source_word: עַל שֶׁפֶךְ הַדֶּשֶׁן יִשָּׂרֵף
  choice: C’est là où l’on déverse les cendres qu’il sera brûlé
  rationale: La construction emphatique restitue la répétition juridique et l’insistance de l’hébreu sur le lieu prescrit.
theological_decisions:
- issue: Nuance rituelle de טָהוֹר
  choice: un endroit pur
  alternative: un endroit rituellement pur
  rationale: Le contexte cultuel rend probable la pureté rituelle. Le texte principal conserve le terme « pur », tandis qu’une note explicite cette nuance sans ajouter un qualificatif absent de l’hébreu.
- issue: Nature du lieu désigné par שֶׁפֶךְ הַדֶּשֶׁן
  choice: là où l’on déverse les cendres
  alternative: le dépôt de cendres
  rationale: La traduction descriptive préserve exactement l’idée d’un emplacement destiné au versement des cendres et évite de préciser sans preuve sa forme matérielle.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition du lieu des cendres est maintenue pour respecter l’insistance du texte légal hébreu. Le marqueur [a] figure bien dans le texte principal.
