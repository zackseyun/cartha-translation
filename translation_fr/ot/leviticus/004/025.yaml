id: LEV.4.25
reference: Leviticus 4:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֤ם הַֽ/חַטָּאת֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת דָּמ֣/וֹ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד מִזְבַּ֥ח הָ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/025.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out the rest of its blood at the base of the altar of burnt offering.
translation:
  language: fr
  text: Puis le prêtre prendra avec son doigt une partie du sang du sacrifice pour le péché[a] et en mettra sur les cornes de l’autel des holocaustes. Il versera le reste du sang au pied de l’autel des holocaustes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification ». Le terme hébreu peut désigner le sacrifice associé à l’élimination de l’impureté aussi bien qu’au péché.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Puis le prêtre prendra
  rationale: Le waw suivi du qatal poursuit la séquence des prescriptions rituelles. « Puis » rend naturellement en français la succession des gestes.
- source_word: מִדַּם
  choice: une partie du sang
  rationale: 'La préposition מִן a ici une valeur partitive : seule une partie du sang est prise pour être appliquée avec le doigt.'
- source_word: הַחַטָּאת
  choice: le sacrifice pour le péché
  rationale: Dans ce contexte cultuel, חַטָּאת désigne le sacrifice lié au péché plutôt que le péché abstrait. Cette formulation est claire en français tout en laissant en note l’autre compréhension possible, « sacrifice de purification ».
- source_word: בְּאֶצְבָּעוֹ
  choice: avec son doigt
  rationale: La préposition בְּ marque ici le moyen employé par le prêtre.
- source_word: וְנָתַן עַל
  choice: et en mettra sur
  rationale: Cette tournure conserve le caractère concret du geste et le pronom « en » renvoie naturellement à une partie du sang.
- source_word: קַרְנֹת
  choice: les cornes
  rationale: Le terme désigne les saillies en forme de corne aux angles de l’autel ; « cornes » est le terme cultuel conventionnel et précis.
- source_word: מִזְבַּח הָעֹלָה
  choice: l’autel des holocaustes
  rationale: Cette expression désigne l’autel extérieur associé aux sacrifices entièrement brûlés. « Autel des holocaustes » est une formulation française établie et intelligible.
- source_word: וְאֶת דָּמוֹ יִשְׁפֹּךְ
  choice: Il versera le reste du sang
  rationale: Après le prélèvement partiel exprimé par מִדַּם, « le reste » explicite l’enchaînement impliqué par l’hébreu sans ajouter une nouvelle étape au rite.
- source_word: אֶל יְסוֹד
  choice: au pied
  rationale: יְסוֹד désigne la base ou le soubassement de l’autel. « Au pied » exprime naturellement en français le lieu où le sang est versé.
theological_decisions:
- issue: Traduction de חַטָּאת dans la législation sacrificielle
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le terme hébreu peut désigner le péché ou le sacrifice associé à son traitement rituel et à la purification. Ici, il désigne clairement le sacrifice. La traduction principale garde son lien lexical avec le péché, tandis que la note préserve l’autre analyse reconnue sans imposer une théorie particulière de l’expiation.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur simple convient au style prescriptif de la législation rituelle. « Sacrifice pour le péché » est plus transparent pour le grand public que le terme technique « sacrifice d’expiation », qui pourrait aussi réduire la portée du mot hébreu.
