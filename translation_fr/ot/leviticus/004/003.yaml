source:
  edition: WLC
  text: אִ֣ם הַ/כֹּהֵ֧ן הַ/מָּשִׁ֛יחַ יֶחֱטָ֖א לְ/אַשְׁמַ֣ת הָ/עָ֑ם וְ/הִקְרִ֡יב עַ֣ל חַטָּאת/וֹ֩ אֲשֶׁ֨ר חָטָ֜א פַּ֣ר בֶּן בָּקָ֥ר תָּמִ֛ים לַ/יהוָ֖ה לְ/חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/003.yaml
  text: If the anointed priest sins[a], bringing guilt on the people, then he shall present for the sin that he has committed a bull, a son of the herd, without blemish[b], to Yahweh as a sin offering.
translation:
  language: fr
  text: Si le prêtre oint[a] pèche et rend ainsi le peuple coupable[b], il présentera à Yahvé, pour le péché qu’il a commis, un taureau pris parmi le gros bétail, sans défaut, en sacrifice pour le péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le grand prêtre oint ». L’hébreu dit littéralement « le prêtre oint ».
    reason: alternative_reading
  - marker: b
    text: Littéralement « pour la culpabilité du peuple ». La formule hébraïque, très condensée, peut indiquer que le péché du prêtre entraîne une culpabilité qui atteint le peuple.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: le prêtre oint
  rationale: Rend directement « le prêtre, l’oint » sans ajouter le titre interprétatif de grand prêtre.
- source_word: יֶחֱטָא
  choice: pèche
  rationale: Dans la proposition conditionnelle introduite par אִם, le présent français exprime naturellement le cas envisagé par la loi.
- source_word: לְאַשְׁמַת הָעָם
  choice: rend ainsi le peuple coupable
  rationale: Exprime la conséquence collective indiquée par la formule hébraïque condensée, sans préciser davantage le mécanisme de cette culpabilité.
- source_word: וְהִקְרִיב
  choice: il présentera
  rationale: Dans un contexte sacrificiel, le verbe désigne l’action d’amener ou de présenter l’offrande.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: pour le péché qu’il a commis
  rationale: Conserve le lien explicite entre l’offrande et le péché commis, tout en évitant en français la répétition littérale « le péché qu’il a péché ».
- source_word: פַּר בֶּן בָּקָר
  choice: un taureau pris parmi le gros bétail
  rationale: Représente les deux éléments de l’expression hébraïque sans imposer l’idée d’un très jeune animal ni produire le calque peu naturel « fils du gros bétail ».
- source_word: תָּמִים
  choice: sans défaut
  rationale: Formule française claire et consacrée pour l’intégrité physique exigée d’un animal offert.
- source_word: לַיהוָה
  choice: à Yahvé
  rationale: Reproduit le nom divin יהוה sous sa forme française courante plutôt que de le remplacer par un titre.
- source_word: לְחַטָּאת
  choice: en sacrifice pour le péché
  rationale: Dans cette législation, חַטָּאת désigne l’offrande rituelle liée au péché; cette formulation reste claire sans confondre l’offrande avec le péché lui-même.
theological_decisions:
- issue: Faut-il expliciter que הַכֹּהֵן הַמָּשִׁיחַ désigne le grand prêtre ?
  choice: le prêtre oint
  alternative: le grand prêtre oint
  rationale: Le contexte peut viser le grand prêtre, mais le texte hébreu dit littéralement « le prêtre oint » et n’emploie pas ici un titre distinct signifiant « grand prêtre ».
- issue: Comment rendre la portée collective de לְאַשְׁמַת הָעָם ?
  choice: rend ainsi le peuple coupable
  alternative: pour la culpabilité du peuple
  rationale: La formulation retenue fait entendre que le péché du prêtre entraîne une culpabilité touchant le peuple, tout en préservant l’indétermination du rapport précis exprimé par l’hébreu.
translation_notes:
  register: Français international actuel, digne et lisible. La syntaxe juridique conditionnelle est conservée, tandis que les expressions sacrificielles sont rendues dans un français naturel. Les notes maintiennent l’ambiguïté concernant le titre du prêtre et la portée exacte de la culpabilité collective.
