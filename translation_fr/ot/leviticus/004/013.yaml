id: LEV.4.13
reference: Leviticus 4:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִ֨ם כָּל עֲדַ֤ת יִשְׂרָאֵל֙ יִשְׁגּ֔וּ וְ/נֶעְלַ֣ם דָּבָ֔ר מֵ/עֵינֵ֖י הַ/קָּהָ֑ל וְ֠/עָשׂוּ אַחַ֨ת מִ/כָּל מִצְוֺ֧ת יְהוָ֛ה אֲשֶׁ֥ר לֹא תֵעָשֶׂ֖ינָה וְ/אָשֵֽׁמוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/013.yaml
  text: And if the whole congregation of Israel sins unintentionally[a], and the matter is hidden from the eyes of the assembly, and they do one of all the things that Yahweh has commanded not to be done, and they become guilty[d][c][b],
translation:
  language: fr
  text: Si toute la communauté d’Israël commet involontairement une faute[a], si l’affaire échappe à l’attention de l’assemblée[b] et si elle fait l’une des choses que Yahweh a ordonné de ne pas faire, elle devient coupable[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu désigne ici une faute commise par erreur ou inadvertance, et non un acte de défi délibéré.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « qu’une affaire soit cachée aux yeux de l’assemblée ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « elle se rend coupable ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  choice: la communauté d’Israël
  rationale: עֵדָה désigne ici l’ensemble collectif d’Israël. « Communauté » est naturel en français moderne et permet de distinguer ce terme de הַקָּהָל, rendu ensuite par « assemblée ».
- source_word: יִשְׁגּוּ
  choice: commet involontairement une faute
  rationale: Dans la législation sacrificielle de Lévitique 4, שׁגה désigne une faute commise par erreur ou inadvertance, et non une rébellion délibérée. La formulation française explicite cette valeur contextuelle.
- source_word: וְנֶעְלַם דָּבָר מֵעֵינֵי הַקָּהָל
  choice: que l’affaire échappe à l’attention de l’assemblée
  rationale: Cette formulation rend idiomatiquement l’idée qu’une affaire reste hors de la perception collective, tout en conservant « assemblée » pour קָהָל.
- source_word: וְעָשׂוּ אַחַת מִכָּל מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: qu’elle fasse l’une des choses que Yahweh a commandé de ne pas faire
  rationale: La phrase exprime l’accomplissement d’un acte appartenant à l’ensemble des actes prohibés par les commandements de Yahweh. Cette tournure reste proche de la syntaxe hébraïque sans devenir obscure en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré comme nom propre plutôt que remplacé par un titre.
- source_word: וְאָשֵׁמוּ
  choice: qu’elle devienne coupable
  rationale: Le verbe indique l’entrée dans un état de culpabilité ou de responsabilité à la suite de la faute, sans anticiper sur le rite d’expiation décrit ensuite.
theological_decisions:
- issue: Nature de la faute exprimée par שׁגה
  choice: faute involontaire
  alternative: égarement ou erreur
  rationale: Le contexte de Lévitique 4 oppose cette catégorie aux actes de défi délibéré. « Involontairement » préserve la catégorie juridique et cultuelle du passage.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte source emploie le nom divin; sa translittération préserve sa fonction de nom propre.
- issue: Portée collective de la culpabilité
  choice: la communauté agit et devient coupable comme sujet collectif
  alternative: chaque Israélite devient individuellement coupable
  rationale: Les verbes hébreux ont pour sujet collectif « toute la communauté d’Israël ». La traduction n’individualise donc pas une culpabilité que le verset présente collectivement.
translation_notes:
  register: Français international moderne, clair et digne, avec une syntaxe juridique lisible. « Communauté » et « assemblée » maintiennent la distinction entre עֵדָה et קָהָל. Le féminin singulier reprend naturellement le nom collectif « communauté », malgré les verbes pluriels de l’hébreu.
