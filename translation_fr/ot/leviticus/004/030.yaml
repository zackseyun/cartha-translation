  text: וְ/לָקַ֨ח הַ/כֹּהֵ֤ן מִ/דָּמָ/הּ֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת כָּל דָּמָ֣/הּ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/030.yaml
  text: And the priest shall take some of its blood with his finger and put it on the horns of the altar of burnt offering[c][b][a], and he shall pour out all its blood at the base of the altar.
translation:
  language: fr
  text: Le prêtre prendra avec son doigt une partie du sang[a] de la chèvre et en mettra sur les cornes de l’autel des holocaustes[b]. Puis il versera tout son sang à la base de l’autel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de son sang ». L’expression hébraïque a probablement ici un sens partitif : le prêtre en prend une partie pour l’appliquer à l’autel.'
    reason: lexical_alternative
  - marker: b
    text: Les « cornes » sont des saillies en forme de corne situées aux angles de l’autel.
    reason: cultural_note
  - marker: c
    text: Bien que l’hébreu dise « tout son sang », la succession des gestes indique qu’il s’agit du sang qui reste après l’application d’une partie sur les cornes de l’autel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Le prêtre prendra
  rationale: Dans cette procédure rituelle, le qatal précédé du waw exprime une prescription séquentielle; le futur français rend naturellement cette valeur.
- source_word: מִדָּמָהּ
  choice: une partie du sang de la chèvre
  rationale: La préposition מִן a vraisemblablement ici un sens partitif. Le suffixe féminin renvoie à la chèvre mentionnée au verset précédent; l’explicitation évite en français une référence pronominale peu claire.
- source_word: בְּאֶצְבָּעוֹ
  choice: avec son doigt
  rationale: Le beth est instrumental et indique le moyen employé pour prendre et appliquer le sang.
- source_word: וְנָתַן
  choice: et en mettra
  rationale: נתן signifie couramment « donner, mettre ». Le pronom « en » reprend le sang et produit une formulation française naturelle sans préciser davantage le geste.
- source_word: עַל קַרְנֹת מִזְבַּח הָעֹלָה
  choice: sur les cornes de l’autel des holocaustes
  rationale: « Cornes » conserve le terme cultuel concret; « autel des holocaustes » est l’expression française usuelle pour cet autel.
- source_word: וְאֶת כָּל דָּמָהּ יִשְׁפֹּךְ
  choice: Puis il versera tout son sang
  rationale: La traduction maintient כָּל, « tout », au lieu de substituer dans le texte « le reste », tout en marquant la succession des actes par « Puis ».
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: au pied de l’autel
  rationale: Dans ce contexte cultuel, יְסוֹד désigne la partie inférieure ou base de l’autel; « au pied » est clair et idiomatique en français.
theological_decisions:
- issue: Valeur des formes verbales dans l’instruction rituelle
  choice: 'Futur prescriptif : « prendra… mettra… versera »'
  alternative: 'Passé narratif : « prit… mit… versa »'
  rationale: Le contexte légal et rituel décrit ce que le prêtre doit faire, non un événement historique unique.
- issue: Désignation des appendices de l’autel
  choice: Conserver « cornes »
  alternative: Employer « coins » ou « saillies »
  rationale: Le mot hébreu désigne précisément les projections en forme de corne; le conserver préserve l’image cultuelle sans imposer une interprétation symbolique.
- issue: Rapport entre « une partie du sang » et « tout son sang »
  choice: Conserver dans le texte la formulation hébraïque « tout son sang » et expliquer la séquence en note
  alternative: Traduire directement « le reste de son sang »
  rationale: La séquence indique qu’il s’agit du sang restant, mais le texte hébreu emploie כָּל, « tout ». La note rend l’implicite sans effacer la tension de formulation.
translation_notes:
  register: Français moderne, international et digne. La syntaxe demeure simple et procédurale. « Chèvre » explicite l’antécédent féminin fourni par le contexte immédiat; « holocaustes » conserve le terme cultuel français établi, et les notes éclairent les éléments matériels ou ambigus sans surcharger le verset.
