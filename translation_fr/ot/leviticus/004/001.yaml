  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Yahweh[a] parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, le tétragramme ; également transcrit « Yahvé » ou « Jéhovah ».'
    reason: Signaler la forme hébraïque du nom divin et ses principales transcriptions françaises.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר introduit ici une nouvelle prise de parole divine. « Parla » préserve la nuance du verbe et la formule narrative récurrente, tout en restant naturel en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre plutôt que remplacé par un titre. La forme « Yahweh » suit directement la translittération retenue par le projet.
- source_word: אֶל
  choice: à
  rationale: La préposition introduit le destinataire de la parole ; « à » est son équivalent français naturel dans cette construction.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Le nom personnel est rendu selon sa forme française traditionnelle et courante.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif לֵאמֹר introduit le contenu du discours. « En ces termes » remplit naturellement cette fonction en français et évite le calque pesant « en disant », sans supprimer l’introduction formelle de la parole.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Yahvé ; Jéhovah ; le Seigneur
  rationale: Le texte hébreu emploie explicitement le tétragramme. Le rendre par « Yahweh » préserve le caractère personnel du nom divin sans lui substituer un titre ; la note signale les autres formes connues.
translation_notes:
  register: Français moderne, sobre et digne. La tournure « parla à Moïse en ces termes » conserve la solennité de la formule hébraïque tout en étant plus idiomatique que « parla à Moïse, disant ».
