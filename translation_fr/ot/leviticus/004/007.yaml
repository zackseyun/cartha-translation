revisions:
- from: Le prêtre mettra une partie du sang sur les cornes de l’autel de l’encens aromatique[b], devant Yahweh, dans la tente de la rencontre. Puis il versera tout le sang du taureau[a] au pied de l’autel de l’holocauste, qui se trouve à l’entrée de la tente de la rencontre.
  to: Le prêtre mettra une partie du sang sur les cornes de l’autel de l’encens aromatique[b], qui se trouve devant Yahweh dans la tente de la rencontre. Puis il versera tout le sang du taureau[a] à la base de l’autel de l’holocauste, qui se trouve à l’entrée de la tente de la rencontre.
  rationale: La révision rattache explicitement à l’autel de l’encens la relative indiquant sa situation devant Yahweh dans la tente de la rencontre. Elle remplace aussi « au pied » par « à la base », plus proche de יסוד. La formulation littérale « tout le sang du taureau » et sa note contextuelle sont maintenues afin de ne pas intégrer au texte une explicitation que l’hébreu n’exprime pas.
