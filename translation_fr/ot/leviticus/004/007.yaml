source:
  edition: WLC
  text: וְ/נָתַן֩ הַ/כֹּהֵ֨ן מִן הַ/דָּ֜ם עַל קַ֠רְנוֹת מִזְבַּ֨ח קְטֹ֤רֶת הַ/סַּמִּים֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר בְּ/אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֣ת כָּל דַּ֣ם הַ/פָּ֗ר יִשְׁפֹּךְ֙ אֶל יְסוֹד֙ מִזְבַּ֣ח הָ/עֹלָ֔ה אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/007.yaml
  text: And the priest shall put some of the blood on the horns of the altar of fragrant incense before Yahweh[a], which is in the tent of meeting, and he shall pour out all the bull’s blood at the base of the altar of burnt offering[b], which is at the entrance of the tent of meeting.
translation:
  language: fr
  text: Le prêtre mettra une partie du sang sur les cornes de l’autel de l’encens aromatique[b], qui se trouve devant Yahweh dans la tente de la rencontre. Puis il versera tout le sang du taureau[a] à la base de l’autel de l’holocauste, qui se trouve à l’entrée de la tente de la rencontre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « tout le sang du taureau »; dans le contexte, il s’agit de ce qui reste après qu’une partie du sang a été mise sur les cornes de l’autel.
    reason: Précision contextuelle sur une formulation littérale susceptible de paraître contradictoire.
  - marker: b
    text: 'Ou plus simplement : « l’autel de l’encens ».'
    reason: Variante lexicale plus concise pour le nom de cet autel.
lexical_decisions:
- source_word: וְנָתַן הַכֹּהֵן מִן הַדָּם
  choice: Le prêtre mettra une partie du sang
  rationale: 'Le verbe נתן signifie ici « mettre » ou « déposer », et מן a une valeur partitive : le prêtre n’emploie à cet endroit qu’une partie du sang.'
- source_word: עַל קַרְנוֹת
  choice: sur les cornes
  rationale: « Cornes » conserve le terme cultuel concret désignant les parties saillantes aux angles de l’autel.
- source_word: מִזְבַּח קְטֹרֶת הַסַּמִּים
  choice: l’autel de l’encens aromatique
  rationale: Cette formulation rend à la fois l’autel de l’encens et la nuance de substances odoriférantes portée par סַּמִּים.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » préserve la dimension spatiale et liturgique de l’expression, tandis que le nom divin est translittéré.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Traduction claire et établie du lieu où Yahweh rencontre son peuple; elle reste plus transparente en français moderne que « tente d’assignation ».
- source_word: וְאֵת כָּל דַּם הַפָּר
  choice: tout le sang du taureau
  rationale: Cette traduction suit formellement le texte hébreu. Le contexte implique le sang restant après l’application précédente, précision signalée en note plutôt qu’intégrée au texte.
- source_word: יִשְׁפֹּךְ אֶל יְסוֹד
  choice: il versera … au pied
  rationale: שׁפך décrit l’action de verser, et יְסוֹד désigne la base ou le soubassement de l’autel; « au pied » est naturel en français dans ce contexte.
- source_word: מִזְבַּח הָעֹלָה
  choice: l’autel de l’holocauste
  rationale: « Holocauste » est le terme cultuel français courant pour l’offrande entièrement consumée, sans ajouter de précision absente de l’hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin personnel; sa translittération le distingue d’un simple titre et suit la convention éditoriale fournie.
- issue: Portée de כָּל דַּם הַפָּר après l’emploi préalable d’une partie du sang
  choice: tout le sang du taureau, avec une note contextuelle
  alternative: tout le reste du sang du taureau
  rationale: L’hébreu dit littéralement « tout le sang du taureau », alors que la séquence rituelle indique qu’il s’agit de ce qui reste. Le texte conserve la formulation source et la note explique la tension apparente sans la résoudre silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. Le futur prescriptif convient à l’instruction rituelle. Deux phrases évitent une coordination trop lourde. Les termes cultuels traditionnels « cornes » et « holocauste » sont conservés parce qu’ils sont précis et encore largement compréhensibles.
