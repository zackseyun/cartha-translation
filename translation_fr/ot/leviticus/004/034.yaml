  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֤ם הַֽ/חַטָּאת֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת כָּל דָּמָ֣/הּ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/034.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out all its blood at the base of the altar.
translation:
  language: fr
  text: Puis le prêtre prendra avec son doigt un peu du sang du sacrifice pour le péché[a] et en mettra sur les cornes de l’autel de l’holocauste. Il versera tout le sang du sacrifice au pied de l’autel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification ». Le terme hébreu peut désigner le sacrifice offert en rapport avec le péché et la purification rituelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Puis … prendra
  rationale: Le waw suivi du qatal poursuit la séquence des prescriptions rituelles. « Puis » rend naturellement l’enchaînement, et le futur français exprime ici l’instruction normative.
- source_word: מִדַּם הַחַטָּאת
  choice: un peu du sang du sacrifice pour le péché
  rationale: 'La préposition מִן a ici une valeur partitive : seule une partie du sang est prise. חַטָּאת désigne dans ce contexte le sacrifice offert en rapport avec le péché.'
- source_word: בְּאֶצְבָּעוֹ
  choice: avec son doigt
  rationale: La préposition בְּ marque l’instrument employé par le prêtre.
- source_word: וְנָתַן
  choice: et en mettra
  rationale: « Mettre » rend simplement נתן dans ce geste rituel ; le pronom « en » reprend naturellement le sang en français sans prétendre que toute la quantité prise est nécessairement appliquée.
- source_word: עַל קַרְנֹת מִזְבַּח הָעֹלָה
  choice: sur les cornes de l’autel de l’holocauste
  rationale: Cette formulation conserve l’image cultuelle des « cornes » et emploie le terme français traditionnel et précis « holocauste » pour עֹלָה.
- source_word: וְאֶת כָּל דָּמָהּ
  choice: tout le sang de l’animal
  rationale: Le suffixe féminin renvoie à la victime sacrificielle. « De l’animal » évite en français l’ambiguïté de « son sang », qui pourrait faire croire qu’il s’agit du sang du prêtre. Le texte hébreu dit littéralement « tout son sang », même si le contexte implique ce qui demeure après l’application.
- source_word: יִשְׁפֹּךְ
  choice: Il versera
  rationale: « Verser » exprime l’évacuation rituelle délibérée du sang plutôt qu’un renversement accidentel.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: au pied de l’autel
  rationale: יְסוֹד désigne la base ou le soubassement. « Au pied de l’autel » est naturel et clair en français moderne.
theological_decisions:
- issue: Traduction de חַטָּאת dans la législation sacrificielle
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Dans ce contexte, le mot désigne certainement une offrande sacrificielle, mais sa dénomination peut souligner soit son rapport au péché, soit sa fonction purificatrice. Le texte principal retient la formulation française reconnaissable « sacrifice pour le péché », tandis que la note préserve l’autre analyse sans trancher abusivement.
translation_notes:
  register: Français international moderne, clair et digne. Le futur simple conserve la force prescriptive de la procédure. La terminologie cultuelle traditionnelle (« prêtre », « cornes », « autel », « holocauste ») est maintenue lorsqu’elle reste intelligible.
