id: LEV.4.29
reference: Leviticus 4:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/סָמַךְ֙ אֶת יָד֔/וֹ עַ֖ל רֹ֣אשׁ הַֽ/חַטָּ֑את וְ/שָׁחַט֙ אֶת הַ֣/חַטָּ֔את בִּ/מְק֖וֹם הָ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/029.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter the sin offering in the place of the burnt offering[a].
translation:
  language: fr
  text: Il posera la main sur la tête du sacrifice pour le péché et égorgera celui-ci à l’endroit où l’on égorge l’holocauste.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification ». Le terme hébreu חַטָּאת peut désigner le sacrifice associé au péché et à la purification.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת יָדוֹ
  choice: Il posera la main
  rationale: Dans ce contexte rituel, סמך désigne le geste consistant à poser ou appuyer la main sur l’animal. Le singulier « la main » respecte יָדוֹ, et le futur rend naturellement en français la valeur prescriptive de la procédure.
- source_word: עַל רֹאשׁ
  choice: sur la tête de
  rationale: Traduction directe et naturelle de la relation spatiale exprimée par עַל.
- source_word: הַחַטָּאת
  choice: le sacrifice pour le péché
  rationale: Le nom חטאת désigne ici l’animal offert dans le rite associé au péché. « Sacrifice pour le péché » est clair en français courant et évite que « offrande » suggère seulement un don non animal; l’autre analyse, « sacrifice de purification », est conservée en note.
- source_word: וְשָׁחַט
  choice: et égorgera
  rationale: שחט est le terme technique désignant l’abattage rituel d’un animal. « Égorger » exprime précisément l’acte sacrificiel en français biblique moderne.
- source_word: בִּמְקוֹם הָעֹלָה
  choice: à l’endroit où l’on égorge l’holocauste
  rationale: Littéralement « à l’endroit de l’holocauste ». La formulation explicite naturellement que le même lieu d’abattage est visé, conformément au contexte rituel, sans confondre ce sacrifice avec l’holocauste.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: « Holocauste » est l’équivalent technique français courant de עֹלָה, sacrifice entièrement consumé sur l’autel.
theological_decisions:
- issue: Sens sacrificiel de חטאת
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le terme peut désigner le péché ou le sacrifice lié au péché et à la purification. Le contexte impose le sens sacrificiel, mais ne justifie pas de réduire sa portée à une seule explication théologique; l’alternative est donc signalée en note.
- issue: Valeur verbale de la séquence וְסָמַךְ ... וְשָׁחַט
  choice: 'futur prescriptif : « Il posera… et égorgera »'
  alternative: 'passé narratif : « Il posa… et égorgea »'
  rationale: Bien que les formes hébraïques puissent avoir une morphologie narrative, elles poursuivent ici des instructions rituelles. Le futur simple est la manière française naturelle de rendre cette prescription.
translation_notes:
  register: Français international moderne, digne et accessible. La terminologie sacrificielle reste précise; « celui-ci » évite une répétition lourde tout en gardant clairement pour objet le sacrifice pour le péché.
