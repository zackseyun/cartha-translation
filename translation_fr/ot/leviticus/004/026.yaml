review_pass:
  verdict: revise
  source_fidelity: La séquence rituelle, la totalité de la graisse, l’autel, la comparaison avec le sacrifice de communion et le pardon final sont bien rendus. Toutefois, « à cause de son péché » exprime surtout une causalité; dans cette construction, מִן marque plus précisément le péché dont l’expiation est faite. « De son péché » conserve mieux ce rapport sans trancher au-delà du texte.
  naturalness: Le français est globalement fluide et d’un registre approprié. « Faire l’expiation » est une formulation française biblique claire et plus directe que « accomplir le rite d’expiation », où « rite » est ajouté au texte.
  terminology: « Graisse », « autel », « sacrifice de communion », « expiation » et le passif « il lui sera pardonné » sont cohérents avec le registre cultuel. La note sur חַטָּאת préserve utilement l’alternative lexicale.
  issues:
  - severity: low
    issue: Nuance de מֵחַטָּאתוֹ
    rationale: « À cause de son péché » est possible dans un sens large, mais peut présenter le péché comme simple cause de l’acte. « De son péché » reflète plus étroitement le complément de séparation/objet associé à l’expiation.
  - severity: low
    issue: Ajout interprétatif de « rite »
    rationale: Le verbe כפר désigne l’acte d’expiation, mais le substantif « rite » n’est pas exprimé. Une formulation directe évite cet ajout sans perdre la dimension cultuelle.
  revised_text: Il fera brûler toute la graisse de l’animal sur l’autel, comme la graisse du sacrifice de communion[a]. Ainsi, le prêtre fera l’expiation pour lui, de son péché[b], et il lui sera pardonné.
  revised_footnotes:
