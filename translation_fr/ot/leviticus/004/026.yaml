  text: וְ/אֶת כָּל חֶלְבּ/וֹ֙ יַקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה כְּ/חֵ֖לֶב זֶ֣בַח הַ/שְּׁלָמִ֑ים וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן מֵ/חַטָּאת֖/וֹ וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/026.yaml
  text: And he shall burn all its fat on the altar[a], like the fat of the sacrifice of peace offerings. Thus the priest shall make atonement for him for his sin[b], and he shall be forgiven.
translation:
  language: fr
  text: Il fera brûler toute la graisse de l’animal sur l’autel, comme la graisse du sacrifice de communion[a]. Ainsi, le prêtre fera l’expiation pour lui, de son péché[b], et il lui sera pardonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de paix » ou « sacrifice de bien-être ».
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut signifier « péché » ou « sacrifice pour le péché »; ici, il désigne très probablement le péché de cet homme.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבּוֹ
  choice: la graisse de l’animal
  rationale: חֵלֶב désigne ici les parties grasses réservées à la combustion rituelle. Expliciter « de l’animal » rend clairement le suffixe masculin singulier en français.
- source_word: יַקְטִיר
  choice: fera brûler
  rationale: Au hiphil, קטר désigne dans ce contexte l’action de brûler la matière sacrificielle sur l’autel pour la faire monter en fumée. « Faire brûler » est naturel et conserve la valeur causative.
- source_word: הַמִּזְבֵּחָה
  choice: sur l’autel
  rationale: Bien que la forme comporte un hé directionnel, l’usage français idiomatique pour cette action sacrificielle est « brûler sur l’autel ».
- source_word: כְּחֵלֶב זֶבַח הַשְּׁלָמִים
  choice: comme la graisse du sacrifice de communion
  rationale: שְׁלָמִים désigne une catégorie sacrificielle associée à la paix, au bien-être et à la communion. « Sacrifice de communion » est compréhensible en français moderne et convient au singulier זֶבַח.
- source_word: וְכִפֶּר עָלָיו
  choice: Le prêtre accomplira ainsi le rite d’expiation pour cet homme
  rationale: כפר, dans les textes sacerdotaux, décrit l’acte rituel qui traite la faute et rétablit la relation. « Accomplir le rite d’expiation » préserve le caractère cultuel sans imposer une théorie particulière; « pour cet homme » clarifie le référent pronominal.
- source_word: מֵחַטָּאתוֹ
  choice: à cause de son péché
  rationale: חַטָּאת peut désigner le péché ou le sacrifice pour le péché. Ici, la mention de l’homme et du pardon favorise le sens de faute; la préposition מִן est rendue naturellement par « à cause de ».
- source_word: וְנִסְלַח לוֹ
  choice: et il lui sera pardonné
  rationale: Cette tournure conserve la construction impersonnelle et le passif divin du texte hébreu, sans nommer explicitement l’auteur du pardon.
theological_decisions:
- issue: Sens du terme sacrificiel שְׁלָמִים
  choice: sacrifice de communion
  alternative: sacrifice de paix; sacrifice de bien-être
  rationale: Le terme évoque la paix, l’intégrité ou le bien-être, ainsi que la communion exprimée dans le repas sacrificiel. Le choix principal est naturel en français biblique moderne, tandis que la note préserve l’étendue sémantique.
- issue: Sens de חַטָּאת dans מֵחַטָּאתוֹ
  choice: son péché
  alternative: son sacrifice pour le péché
  rationale: Le même nom hébreu peut désigner la faute ou l’offrande qui la traite. La construction « pour lui », suivie de la promesse de pardon, favorise ici la faute personnelle, sans supprimer l’autre possibilité lexicale.
- issue: Sujet implicite du pardon
  choice: il lui sera pardonné
  alternative: il sera pardonné
  rationale: Le passif hébreu laisse l’agent inexprimé. La formulation française maintient cette retenue et n’ajoute pas explicitement « Dieu », bien que le contexte l’implique.
translation_notes:
  register: Français international moderne, digne et accessible. La terminologie cultuelle reste précise sans devenir technique à l’excès. La formulation conserve le passif divin et signale les ambiguïtés lexicales authentiques en notes.
