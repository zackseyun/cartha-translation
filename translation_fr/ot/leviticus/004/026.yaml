revisions:
- from: Il fera brûler toute la graisse de l’animal sur l’autel, comme la graisse du sacrifice de communion[a]. Le prêtre accomplira ainsi le rite d’expiation pour cet homme, à cause de son péché[b], et il lui sera pardonné.
  to: Il fera brûler toute la graisse de l’animal sur l’autel, comme la graisse du sacrifice de communion[a]. Ainsi, le prêtre fera l’expiation pour lui, de son péché[b], et il lui sera pardonné.
  rationale: La révision rend plus exactement le lien entre l’expiation et « son péché », tout en conservant l’ambiguïté lexicale en note. Elle supprime l’ajout de « rite » et maintient le passif divin non explicité de la clause finale.
