  text: וְ/אֵ֥ת כָּל חֶלְבּ֖/וֹ יָרִ֣ים מִמֶּ֑/נּוּ וְ/הִקְטִ֖יר הַ/מִּזְבֵּֽחָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/019.yaml
  text: And he shall remove all its fat from it and burn it on the altar[a].
translation:
  language: fr
  text: Il retirera de l’animal toute sa graisse et la fera brûler sur l’autel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « la fera monter en fumée sur l’autel ». Le verbe hébreu désigne ici l’action de faire brûler une offrande dans un contexte sacrificiel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת כָּל חֶלְבּוֹ
  choice: toute sa graisse
  rationale: כָּל exprime la totalité, et חֶלְבּוֹ désigne ici les parties grasses de l’animal réservées au rite sacrificiel.
- source_word: יָרִים מִמֶּנּוּ
  choice: Il retirera de l’animal
  rationale: Le hiphil de רום exprime ici l’action d’enlever ou de prélever la graisse. La répétition pronominale littérale (« sa graisse de lui ») serait peu naturelle en français; « de l’animal » clarifie le référent sans modifier le sens.
- source_word: וְהִקְטִיר
  choice: et la fera brûler
  rationale: Dans le vocabulaire sacrificiel sacerdotal, le verbe désigne le fait de faire monter l’offrande en fumée. « Faire brûler » reste naturel en français tout en distinguant l’acte rituel d’une simple combustion.
- source_word: הַמִּזְבֵּחָה
  choice: sur l’autel
  rationale: 'Avec le verbe sacrificiel, la terminaison directionnelle se rend idiomatiquement par le lieu où la graisse est consumée : « sur l’autel ».'
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le futur prescriptif convient à la suite des instructions rituelles. « De l’animal » évite une tournure pronominale ambiguë et lourde en français.
