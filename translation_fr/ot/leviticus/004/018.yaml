source:
  edition: WLC
  text: וּ/מִן הַ/דָּ֞ם יִתֵּ֣ן עַל קַרְנֹ֣ת הַ/מִּזְבֵּ֗חַ אֲשֶׁר֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר בְּ/אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֣ת כָּל הַ/דָּ֗ם יִשְׁפֹּךְ֙ אֶל יְסוֹד֙ מִזְבַּ֣ח הָ/עֹלָ֔ה אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/018.yaml
  text: And from the blood he shall put some on the horns of the altar that is before Yahweh[a], which is in the tent of meeting, and all the blood he shall pour out at the base of the altar of burnt offering, which is at the entrance of the tent of meeting.
translation:
  language: fr
  text: Il mettra du sang sur les cornes de l’autel qui est devant Yahweh, dans la tente de la rencontre, puis il versera tout le sang au pied de l’autel de l’holocauste, qui est à l’entrée de la tente de la rencontre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן הַדָּם
  choice: un peu du sang
  rationale: Le syntagme hébreu est partitif (« du sang »). L’ajout de « un peu » rend ce sens naturel en français et marque le contraste avec « tout le sang » dans la suite du verset.
- source_word: יִתֵּן
  choice: il mettra
  rationale: Le verbe נתן signifie couramment « donner, mettre, placer ». « Mettra » reste direct et naturel sans ajouter la nuance technique de « appliquera ».
- source_word: קַרְנֹת הַמִּזְבֵּחַ
  choice: les cornes de l’autel
  rationale: « Cornes » conserve l’image et la terminologie cultuelle concrète du texte hébreu.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: qui est devant Yahweh
  rationale: « Devant » garde à la fois la relation spatiale et l’idée de présence portée par לִפְנֵי.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette expression rend les deux éléments de l’hébreu et désigne clairement le sanctuaire où a lieu la rencontre cultuelle.
- source_word: וְאֵת כָּל הַדָּם
  choice: puis il versera tout le sang
  rationale: Le texte dit littéralement « tout le sang », et non « le reste du sang » ; cette formulation est donc conservée malgré le sens contextuel du sang restant.
- source_word: יִשְׁפֹּךְ
  choice: il versera
  rationale: « Verser » est l’équivalent français naturel de שׁפך dans cette procédure rituelle.
- source_word: אֶל יְסוֹד
  choice: au pied
  rationale: Pour un autel, « au pied » exprime naturellement la partie basse ou la base visée par יְסוֹד.
- source_word: מִזְבַּח הָעֹלָה
  choice: l’autel de l’holocauste
  rationale: « Holocauste » est le terme français établi pour l’offrande entièrement consumée désignée par עֹלָה.
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: qui est à l’entrée de la tente de la rencontre
  rationale: « À l’entrée » rend simplement et précisément la localisation exprimée par פֶּתַח.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le préserve explicitement, sans le remplacer par un titre.
- issue: Portée de « tout le sang » après l’emploi partiel du sang
  choice: tout le sang
  alternative: tout le reste du sang
  rationale: Le contexte implique ce qui reste, mais l’hébreu maintient l’expression « tout le sang ». La traduction conserve cette formulation et sa tension apparente plutôt que de l’expliciter.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase suit clairement les étapes du rite tout en évitant un style inutilement archaïque. « Tente de la rencontre », « cornes de l’autel » et « holocauste » conservent la terminologie cultuelle.
