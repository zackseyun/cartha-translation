  to: Il retirera toute sa graisse, comme on retire la graisse de l’agneau dans le sacrifice de paix. Le prêtre fera brûler ces morceaux sur l’autel, par-dessus les offrandes consumées pour Yahweh[a]. Ainsi, le prêtre fera l’expiation pour lui, au sujet du péché qu’il a commis, et il lui sera pardonné.
  rationale: La révision supprime deux explicitations non requises (« rite » et « cet homme ») et rend la relation au péché de façon plus neutre. Elle conserve le pluriel de l’objet brûlé, le nom divin Yahweh et la note nécessaire sur l’expression sacrificielle technique ainsi que sur la portée possiblement spatiale ou associative de « par-dessus ».
