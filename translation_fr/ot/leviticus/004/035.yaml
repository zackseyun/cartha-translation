source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבָּ֣/ה יָסִ֗יר כַּ/אֲשֶׁ֨ר יוּסַ֥ר חֵֽלֶב הַ/כֶּשֶׂב֮ מִ/זֶּ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֨יר הַ/כֹּהֵ֤ן אֹתָ/ם֙ הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן עַל חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א וְ/נִסְלַ֥ח לֽ/וֹ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/035.yaml
  text: And he shall remove all its fat[a], just as the fat of the lamb is removed from the sacrifice of peace offerings, and the priest shall burn them on the altar, on the food offerings of Yahweh. Thus the priest shall make atonement for him concerning the sin that he committed, and he shall be forgiven.
translation:
  language: fr
  text: Il retirera toute sa graisse, comme on retire la graisse de l’agneau dans le sacrifice de paix. Le prêtre fera brûler ces morceaux sur l’autel, par-dessus les offrandes consumées pour Yahweh[a]. Ainsi, le prêtre fera l’expiation pour lui, au sujet du péché qu’il a commis, et il lui sera pardonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec les offrandes faites par le feu à Yahweh ». L’expression hébraïque est un terme sacrificiel technique; la relation exprimée par « par-dessus » peut aussi se comprendre comme une association aux autres offrandes.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  choice: graisse
  rationale: Le terme désigne la graisse de l’animal réservée au rite. « Graisse » en conserve le sens concret sans ajouter dans le texte l’explication « morceaux de graisse ».
- source_word: יָסִיר / יוּסַר
  choice: retirera / on retire
  rationale: Dans cette procédure sacrificielle, le verbe désigne l’enlèvement de la graisse; « retirer » est précis et naturel en français.
- source_word: הַכֶּשֶׂב
  choice: agneau
  rationale: Dans ce contexte cultuel, le terme désigne vraisemblablement l’agneau plutôt que le mouton au sens générique.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: sacrifice de paix
  rationale: Cette formulation conserve la catégorie sacrificielle traditionnelle et la relation lexicale avec l’idée de paix, sans réduire le terme à une seule fonction telle que la communion.
- source_word: וְהִקְטִיר
  choice: fera brûler
  rationale: Le verbe décrit ici la combustion rituelle sur l’autel; la tournure factitive convient à l’action du prêtre et reste idiomatique.
- source_word: אֹתָם
  choice: ces morceaux
  rationale: Le pronom hébreu est au pluriel et renvoie aux diverses parties de graisse. « Ces morceaux » rend ce pluriel naturellement malgré le collectif singulier « graisse » en français.
- source_word: עַל אִשֵּׁי יְהוָה
  choice: par-dessus les offrandes consumées pour Yahweh
  rationale: « Par-dessus » rend la valeur spatiale probable de עַל dans la procédure, tandis que « offrandes consumées » exprime le terme sacrificiel אִשִּׁים sans l’assimiler simplement au feu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin présent dans l’hébreu plutôt que de lui substituer un titre.
- source_word: וְכִפֶּר עָלָיו
  choice: accomplira le rite d’expiation pour cet homme
  rationale: La formulation garde la portée cultuelle de כפר sans imposer une théorie systématique particulière; l’ajout de « rite » rend clairement l’action sacerdotale en français courant.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: à cause du péché qu’il a commis
  rationale: Cette tournure française naturelle indique le péché concerné tout en évitant la répétition hébraïque peu idiomatique « le péché qu’il a péché ».
- source_word: וְנִסְלַח לוֹ
  choice: et il lui sera pardonné
  rationale: Cette construction préserve l’impersonnalité du passif hébreu et ne précise pas explicitement l’agent du pardon.
theological_decisions:
- issue: Langage de l’expiation sacrificielle
  choice: accomplira le rite d’expiation pour cet homme
  alternative: fera l’expiation pour lui
  rationale: Le texte décrit l’acte rituel du prêtre et son résultat sans définir le mécanisme théologique de l’expiation. La formulation choisie garde cette amplitude tout en étant claire en français.
- issue: Nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte source emploie le tétragramme comme nom propre; « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Résultat du sacrifice et pardon
  choice: il lui sera pardonné
  alternative: son péché lui sera pardonné
  rationale: Le passif impersonnel respecte la formulation concise de l’hébreu et n’explicite ni l’agent ni une théorie du pardon que le verset laisse implicites.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur normatif convient aux prescriptions rituelles. « Cet homme » clarifie le référent masculin sans lourdeur, et « ces morceaux » permet de respecter le pluriel hébreu אֹתָם.
