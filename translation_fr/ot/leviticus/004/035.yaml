  naturalness: Le français est globalement moderne et naturel. « Faire l’expiation pour lui » est plus direct et moins explicatif que « accomplir le rite d’expiation pour cet homme », tout en restant digne et accessible. « Au sujet du péché » reflète bien la relation exprimée par עַל sans faire de celle-ci une causalité plus étroite.
