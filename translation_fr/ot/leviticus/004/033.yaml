id: LEV.4.33
reference: Leviticus 4:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/סָמַךְ֙ אֶת יָד֔/וֹ עַ֖ל רֹ֣אשׁ הַֽ/חַטָּ֑את וְ/שָׁחַ֤ט אֹתָ/הּ֙ לְ/חַטָּ֔את בִּ/מְק֕וֹם אֲשֶׁ֥ר יִשְׁחַ֖ט אֶת הָ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/033.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter it for a sin offering in the place where the burnt offering is slaughtered[a].
translation:
  language: fr
  text: Il posera la main sur la tête de l’offrande pour le péché et l’égorgera comme offrande pour le péché à l’endroit où l’on égorge l’holocauste[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « offrande de purification » pour les deux occurrences d’« offrande pour le péché »; le terme hébreu peut désigner l’offrande qui traite le péché et l’impureté rituelle.
    reason: Alternative lexicale significative pour חטאת.
lexical_decisions:
- source_word: וְסָמַךְ
  choice: Il posera
  rationale: Dans le contexte sacrificiel, סמך désigne le geste rituel consistant à poser ou appuyer la main sur l’animal. « Posera » est naturel et n’impose pas une interprétation symbolique.
- source_word: יָדוֹ
  choice: la main
  rationale: L’hébreu emploie le singulier avec un suffixe masculin singulier; le français exprime naturellement la possession corporelle avec l’article défini après un sujet explicite.
- source_word: עַל רֹאשׁ
  choice: sur la tête
  rationale: Traduction directe et idiomatique de la préposition et du nom.
- source_word: הַחַטָּאת / לְחַטָּאת
  choice: l’offrande pour le péché / comme offrande pour le péché
  rationale: חטאת désigne ici le sacrifice lié au traitement du péché et de l’impureté. « Offrande pour le péché » est clair et reconnaissable; la seconde occurrence exprime la destination ou la fonction de l’animal.
- source_word: וְשָׁחַט אֹתָהּ
  choice: et l’égorgera
  rationale: שׁחט est le verbe technique de l’abattage sacrificiel; « égorger » rend précisément le geste, tandis que le pronom féminin renvoie à l’offrande.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: à l’endroit où l’on égorge
  rationale: La tournure impersonnelle « l’on » rend la valeur procédurale du verbe hébreu à la troisième personne du masculin singulier sans désigner arbitrairement un agent particulier.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: Dans le vocabulaire sacrificiel français, « holocauste » est le terme traditionnel et concis pour עֹלָה, sacrifice entièrement brûlé.
theological_decisions:
- issue: Sens de חטאת dans la législation sacrificielle
  choice: offrande pour le péché
  alternative: offrande de purification
  rationale: Le terme peut désigner à la fois une offrande concernant le péché et un rite de purification. Le texte principal retient la formulation française la plus immédiatement compréhensible, tandis que la note préserve l’autre nuance importante.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation suit le caractère prescriptif du texte et conserve le singulier « la main ». Le vocabulaire sacrificiel reste précis sans expliciter la symbolique du geste.
