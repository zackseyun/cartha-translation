revisions:
- from: Les anciens de la communauté poseront leurs mains sur la tête du taureau devant Yahweh, puis on égorgera le taureau devant Yahweh.[a]
  to: Les anciens de la communauté poseront leurs mains sur la tête du taureau devant Yahweh, et l’on égorgera[a] le taureau devant Yahweh.
  rationale: La révision remplace « puis » par la coordination neutre « et » et déplace l’ancre auprès du verbe concerné. Elle conserve « l’on égorgera », rendu français naturel qui maintient l’action active et l’agent non spécifié, tout en laissant la singularité inhabituelle du verbe hébreu explicitée en note.
