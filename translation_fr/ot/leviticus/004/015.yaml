  text: וְ֠/סָמְכוּ זִקְנֵ֨י הָ/עֵדָ֧ה אֶת יְדֵי/הֶ֛ם עַל רֹ֥אשׁ הַ/פָּ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ/שָׁחַ֥ט אֶת הַ/פָּ֖ר לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/015.yaml
  text: And the elders of the congregation shall lay their hands on the head of the bull before Yahweh[a], and the bull shall be slaughtered before Yahweh.
translation:
  language: fr
  text: Les anciens de la communauté poseront leurs mains sur la tête du taureau devant Yahweh, et l’on égorgera[a] le taureau devant Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu passe ici du pluriel « les anciens » à un verbe au singulier, sans préciser qui égorge le taureau. Autre traduction possible : « et il égorgera le taureau devant Yahweh ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָמְכוּ
  choice: poseront
  rationale: Dans le contexte sacrificiel, סמך désigne le geste rituel consistant à poser ou appuyer les mains sur l’animal. « Poseront leurs mains » est naturel et précis en français.
- source_word: זִקְנֵי הָעֵדָה
  choice: les anciens de la communauté
  rationale: « Anciens » rend זִקְנֵי, tandis que « communauté » exprime ici עֵדָה comme collectivité d’Israël, dans un français actuel et non confessionnel.
- source_word: אֶת יְדֵיהֶם
  choice: leurs mains
  rationale: Le pluriel explicite de l’hébreu est conservé.
- source_word: עַל רֹאשׁ הַפָּר
  choice: sur la tête du taureau
  rationale: Rendu direct de l’expression spatiale; « taureau » traduit simplement פַּר.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » rend naturellement לִפְנֵי dans le cadre cultuel, et le nom divin est translittéré.
- source_word: וְשָׁחַט
  choice: puis on égorgera
  rationale: Le verbe hébreu passe au singulier sans sujet nominal explicite. Le pronom indéfini « on » conserve l’acteur non identifié sans attribuer artificiellement l’action aux anciens; « égorger » désigne précisément l’abattage sacrificiel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; sa translittération le distingue d’un titre.
- issue: Passage du sujet pluriel à un verbe singulier en וְשָׁחַט
  choice: on égorgera
  alternative: il égorgera / le taureau sera égorgé
  rationale: Le français indéfini signale un agent humain non précisé et évite aussi bien d’identifier arbitrairement un « il » que d’effacer entièrement l’actif hébreu. Une note documente le changement de nombre.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire rituel reste concret; « communauté » évite une coloration ecclésiastique excessive. Le marqueur de note est placé après la proposition concernée.
