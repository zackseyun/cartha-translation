source:
  edition: WLC
  text: וְ/טָבַ֧ל הַ/כֹּהֵ֛ן אֶצְבָּע֖/וֹ מִן הַ/דָּ֑ם וְ/הִזָּ֞ה שֶׁ֤בַע פְּעָמִים֙ לִ/פְנֵ֣י יְהוָ֔ה אֵ֖ת פְּנֵ֥י הַ/פָּרֹֽכֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/017.yaml
  text: Then the priest shall dip his finger in some of the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain.
translation:
  language: fr
  text: Puis le prêtre trempera son doigt dans le sang et en fera sept aspersions devant Yahweh, en direction du rideau[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « voile ». Le terme hébreu désigne le rideau du sanctuaire qui séparait les espaces sacrés.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְטָבַל
  choice: Puis … trempera
  rationale: Le verbe טבל signifie « tremper, immerger ». Le futur français convient à la portée prescriptive de cette séquence rituelle, et « puis » exprime l’enchaînement marqué par le waw.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Équivalent courant de כֹּהֵן dans la législation sacrificielle; l’article défini est conservé.
- source_word: אֶצְבָּעוֹ
  choice: son doigt
  rationale: Rendu direct du nom singulier avec suffixe possessif.
- source_word: מִן הַדָּם
  choice: dans le sang
  rationale: Après « tremper », le français emploie naturellement « dans ». Le contexte indique qu’il s’agit d’une quantité prise sur l’ensemble du sang, sans que « dans le sang » suggère l’immersion de toute la main.
- source_word: וְהִזָּה
  choice: fera … l’aspersion de ce sang
  rationale: Dans les rites sacerdotaux, נזה désigne l’action d’asperger. Le complément « de ce sang », implicite en hébreu, est explicité pour assurer la clarté en français.
- source_word: שֶׁבַע פְּעָמִים
  choice: sept fois
  rationale: Traduction directe du numéral et du nom pluriel.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי signifie ici « devant, en présence de ». Le nom divin est translittéré afin de conserver le nom propre présent dans le texte hébreu.
- source_word: אֵת פְּנֵי הַפָּרֹכֶת
  choice: face au rideau
  rationale: L’expression évoque littéralement la face ou le devant du rideau. « Face au rideau » est naturel en français et préserve l’orientation spatiale du geste.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom personnel plutôt que de lui substituer un titre.
- issue: Traduction de פָּרֹכֶת
  choice: rideau
  alternative: voile
  rationale: Le terme désigne le rideau du sanctuaire qui délimite l’espace sacré. « Rideau » est clair en français moderne, tandis que « voile » demeure une possibilité traditionnelle signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe procédurale reste fluide, et le vocabulaire rituel est conservé sans archaïsme inutile.
