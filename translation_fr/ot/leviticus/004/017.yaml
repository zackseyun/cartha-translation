revisions:
- from: Puis le prêtre trempera son doigt dans le sang et fera sept fois l’aspersion de ce sang devant Yahweh, face au rideau[a].
  to: Puis le prêtre trempera son doigt dans le sang et en fera sept aspersions devant Yahweh, en direction du rideau[a].
  rationale: La révision conserve la séquence prescriptive et le caractère implicite, mais contextuellement évident, du sang aspergé. Elle remplace une construction française pesante par une expression rituelle idiomatique et précise que l’aspersion est dirigée vers le rideau, sans surinterpréter la fonction cultuelle du geste.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:23:18Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens rituel est globalement fidèle : le prêtre trempe son doigt dans le sang, accomplit le geste à sept reprises devant Yahweh et en direction du rideau. « Face au rideau » peut toutefois décrire la position du prêtre plutôt que la direction ou la cible de l’aspersion exprimée par אֵת פְּנֵי הַפָּרֹכֶת.'
  naturalness: « Fera sept fois l’aspersion de ce sang » est compréhensible, mais lourd et moins idiomatique en français moderne. « En fera sept aspersions » est plus fluide tout en conservant le registre rituel sobre.
  terminology: « Yahweh », « prêtre », « sang », « aspersions » et « rideau » conviennent. La note conserve correctement « voile » comme alternative lexicale. Sa formulation peut être rendue plus précise et naturelle.
  issues:
  - severity: medium
    issue: Ambiguïté spatiale de « face au rideau »
    rationale: L’hébreu « vers/devant la face du rideau » situe l’aspersion en direction du rideau. En français, « face au rideau » peut plus spontanément qualifier l’orientation du prêtre. « En direction du rideau » rend mieux la relation du geste au rideau.
  - severity: low
    issue: Formulation lourde de l’action d’aspersion
    rationale: « fera sept fois l’aspersion de ce sang » surcharge la phrase et explicite « ce sang » de manière peu naturelle. Le pronom « en » reprend clairement le sang déjà mentionné.
  - severity: low
    issue: Note explicative légèrement imprécise dans sa syntaxe
    rationale: Dire que le rideau « séparait l’espace sacré » laisse inachevée l’idée de séparation. « séparait les espaces sacrés » est plus clair sans ajouter d’interprétation doctrinale.
  revised_text: Puis le prêtre trempera son doigt dans le sang et en fera sept aspersions devant Yahweh, en direction du rideau[a].
  revised_footnotes:
  - marker: a
    text: Ou « voile ». Le terme hébreu désigne le rideau du sanctuaire qui séparait les espaces sacrés.
    reason: lexical_alternative
  revision_rationale: La révision conserve la séquence prescriptive et le caractère implicite, mais contextuellement évident, du sang aspergé. Elle remplace une construction française pesante par une expression rituelle idiomatique et précise que l’aspersion est dirigée vers le rideau, sans surinterpréter la fonction cultuelle du geste.
