id: LEV.4.6
reference: Leviticus 4:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/טָבַ֧ל הַ/כֹּהֵ֛ן אֶת אֶצְבָּע֖/וֹ בַּ/דָּ֑ם וְ/הִזָּ֨ה מִן הַ/דָּ֜ם שֶׁ֤בַע פְּעָמִים֙ לִ/פְנֵ֣י יְהוָ֔ה אֶת פְּנֵ֖י פָּרֹ֥כֶת הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/006.yaml
  text: The priest shall dip his finger in the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain of the sanctuary.
translation:
  language: fr
  text: Le prêtre trempera son doigt dans le sang et fera sept aspersions avec une partie du sang devant Yahweh, en direction du rideau du sanctuaire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la face du rideau du lieu saint »; on peut aussi comprendre : « sur le devant du rideau du lieu saint ».'
    reason: La construction hébraïque אֶת־פְּנֵי et la portée de הַקֹּדֶשׁ permettent une formulation plus littérale et une légère ambiguïté quant au point exact visé par l’aspersion.
lexical_decisions:
- source_word: וְטָבַל
  choice: trempera
  rationale: Le waw suivi du qatal poursuit ici la série d’instructions rituelles. Le futur français convient au style prescriptif du contexte.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Nom défini au singulier désignant l’officiant du rite.
- source_word: אֶצְבָּעוֹ בַּדָּם
  choice: son doigt dans le sang
  rationale: Le suffixe marque la troisième personne du masculin singulier, et ב indique ici la substance dans laquelle le doigt est plongé.
- source_word: וְהִזָּה מִן־הַדָּם
  choice: fera des aspersions avec une partie du sang
  rationale: 'À la forme hiphil, נזה désigne l’aspersion rituelle. מן a naturellement une valeur partitive : seule une partie du sang est aspergée.'
- source_word: שֶׁבַע פְּעָמִים
  choice: sept aspersions
  rationale: La formulation française exprime naturellement les sept occurrences de l’acte, sans modifier leur nombre.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי exprime la position ou l’orientation cultuelle en présence de Yahweh; le nom divin est translittéré.
- source_word: אֶת־פְּנֵי פָּרֹכֶת הַקֹּדֶשׁ
  choice: en direction du rideau du sanctuaire
  rationale: L’expression désigne l’orientation de l’aspersion vers la face antérieure du rideau sacré. Cette formulation française évite de suggérer avec certitude que le sang touche le rideau.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le caractère propre du nom divin.
- issue: Rapport spatial entre l’aspersion et פָּרֹכֶת הַקֹּדֶשׁ
  choice: en direction du rideau du sanctuaire
  alternative: sur le devant du rideau du lieu saint
  rationale: La construction avec אֶת־פְּנֵי peut évoquer la face du rideau ou une orientation vers celui-ci. Le texte principal conserve l’orientation sans affirmer que le rideau reçoit directement le sang; la note signale la formulation plus littérale.
translation_notes:
  register: Français international moderne, clair et digne. Le futur maintient le registre des prescriptions rituelles. « Aspersions » conserve la précision cultuelle tout en restant compréhensible; « rideau » est plus courant que « voile » dans ce contexte architectural.
