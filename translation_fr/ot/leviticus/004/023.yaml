id: LEV.4.23
reference: Leviticus 4:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֽוֹ הוֹדַ֤ע אֵלָי/ו֙ חַטָּאת֔/וֹ אֲשֶׁ֥ר חָטָ֖א בָּ֑/הּ וְ/הֵבִ֧יא אֶת קָרְבָּנ֛/וֹ שְׂעִ֥יר עִזִּ֖ים זָכָ֥ר תָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/023.yaml
  text: or if the sin that he has committed is made known to him[a], then he shall bring as his offering a male goat without blemish.
translation:
  language: fr
  text: ou si le péché qu’il a commis est porté à sa connaissance[a], il apportera comme offrande un bouc mâle sans défaut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « ou si son péché, qu’il a commis, lui est fait connaître ».'
    reason: La note conserve la structure plus formelle de l’hébreu et le possessif attaché à « péché ».
lexical_decisions:
- source_word: אֽוֹ
  choice: ou si
  rationale: La conjonction disjonctive poursuit l’alternative juridique commencée au verset précédent; « si » explicite naturellement en français la condition sous-entendue.
- source_word: הוֹדַע אֵלָיו
  choice: est porté à sa connaissance
  rationale: 'Cette formulation passive préserve la valeur causative-passive du hofal de ידע : quelqu’un ou quelque chose lui fait connaître sa faute, plutôt qu’il ne la découvre nécessairement par lui-même.'
- source_word: חַטָּאתוֹ
  choice: le péché
  rationale: Le terme désigne ici la faute commise, et non le sacrifice pour le péché, comme l’indique la proposition relative qui suit.
- source_word: אֲשֶׁר חָטָא בָּהּ
  choice: qu’il a commis
  rationale: Cette tournure française rend clairement la proposition qui précise le péché concerné; la préposition hébraïque est idiomatique avec le verbe « pécher » et n’a pas besoin d’être reproduite séparément.
- source_word: וְהֵבִיא
  choice: il apportera
  rationale: Dans ce contexte juridique, le parfait précédé de waw énonce la conséquence prescrite. Le futur français convient au registre normatif sans alourdir la phrase.
- source_word: קָרְבָּנוֹ
  choice: comme offrande
  rationale: קָרְבָּן désigne ce qui est présenté à Dieu. « Offrande » est courant, accessible et adapté au vocabulaire sacrificiel.
- source_word: שְׂעִיר עִזִּים זָכָר
  choice: un bouc mâle
  rationale: שְׂעִיר עִזִּים désigne un bouc, tandis que זָכָר précise explicitement son sexe. Malgré la légère redondance en français, « mâle » conserve cette précision du texte source.
- source_word: תָּמִים
  choice: sans défaut
  rationale: Expression française claire et consacrée pour un animal sacrificiel exempt de tare.
theological_decisions:
- issue: Sens de חַטָּאת dans ce verset
  choice: le péché, c’est-à-dire la faute commise
  alternative: le sacrifice pour le péché
  rationale: Bien que חַטָּאת puisse désigner soit le péché, soit le sacrifice pour le péché dans le Lévitique, la relative « qu’il a commis » montre qu’il s’agit ici de la faute. L’offrande est ensuite désignée séparément par קָרְבָּנוֹ.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le passif du texte hébreu et le caractère prescriptif de la loi, tout en évitant une syntaxe inutilement lourde.
