source:
  edition: WLC
  text: וְ/נֽוֹדְעָה֙ הַֽ/חַטָּ֔את אֲשֶׁ֥ר חָטְא֖וּ עָלֶ֑י/הָ וְ/הִקְרִ֨יבוּ הַ/קָּהָ֜ל פַּ֤ר בֶּן בָּקָר֙ לְ/חַטָּ֔את וְ/הֵבִ֣יאוּ אֹת֔/וֹ לִ/פְנֵ֖י אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/014.yaml
  text: and the sin that they committed becomes known[a], then the assembly shall present a bull, a son of the herd, as a sin offering and bring it before the tent of meeting.
translation:
  language: fr
  text: Lorsque le péché qu’ils ont commis vient à être connu[a], l’assemblée présentera un taureau du troupeau comme sacrifice pour le péché et l’amènera devant la tente de la rencontre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le même mot hébreu, חַטָּאת (ḥaṭṭā’t), apparaît deux fois dans ce verset : il signifie d’abord « péché », puis « sacrifice pour le péché ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֽוֹדְעָה
  choice: vient à être connu
  rationale: Le niphal de ידע exprime ici le fait que la faute devient connue, sans préciser qui la découvre; cette tournure conserve cette indétermination.
- source_word: הַחַטָּאת
  choice: le péché
  rationale: La relative « qu’ils ont commis » impose ici le sens de faute ou péché, et non celui de sacrifice.
- source_word: אֲשֶׁר חָטְאוּ עָלֶיהָ
  choice: qu’ils ont commis
  rationale: Cette formulation française naturelle identifie le péché précis; la préposition hébraïque על n’a pas besoin d’être rendue séparément.
- source_word: הַקָּהָל
  choice: l’assemblée
  rationale: « Assemblée » exprime le groupe constitué dans ce contexte communautaire et cultuel, sans connotation ecclésiale indue.
- source_word: וְהִקְרִיבוּ
  choice: présentera
  rationale: Dans un contexte sacrificiel, le hiphil de קרב désigne la présentation de l’animal; ce choix le distingue du verbe suivant, « amènera ».
- source_word: פַּר בֶּן בָּקָר
  choice: un taureau, un animal du gros bétail
  rationale: La formulation rend à la fois פַּר et l’expression classificatoire בֶּן בָּקָר sans suggérer nécessairement, comme « jeune taureau », un âge que le contexte ne précise pas nettement.
- source_word: לְחַטָּאת
  choice: en sacrifice pour le péché
  rationale: La seconde occurrence de חַטָּאת désigne ici la catégorie sacrificielle; cette expression française est claire et conserve son lien lexical avec « péché ».
- source_word: וְהֵבִיאוּ אֹתוֹ
  choice: et l’amènera
  rationale: Le singulier français s’accorde naturellement avec le sujet collectif « l’assemblée »; le pronom renvoie au taureau.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: devant la tente de la rencontre
  rationale: Traduction directe du lieu cultuel, qui évite le terme plus traditionnel et interprétatif « tabernacle ».
theological_decisions:
- issue: Double sens de חַטָּאת dans le même verset
  choice: Traduire la première occurrence par « péché » et la seconde par « sacrifice pour le péché »
  alternative: Employer uniformément « péché », « sacrifice pour le péché » ou « sacrifice de purification »
  rationale: Le contexte impose d’abord la faute commise, puis le sacrifice prescrit. La distinction contextuelle assure l’intelligibilité tout en signalant par une note qu’un même mot hébreu est employé.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste liée au contexte précédent par « et que… ». Le futur prescriptif rend la valeur juridique du passage, tandis que « vient à être connu » préserve l’absence d’agent exprimé dans l’hébreu.
