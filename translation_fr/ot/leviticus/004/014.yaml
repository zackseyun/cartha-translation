  to: Lorsque le péché qu’ils ont commis vient à être connu[a], l’assemblée présentera un taureau du troupeau comme sacrifice pour le péché et l’amènera devant la tente de la rencontre.
  rationale: 'La révision corrige la syntaxe française et remplace une apposition lourde par une expression idiomatique. Elle maintient le sens passif-inchoatif de וְנוֹדְעָה, la distinction lexicale essentielle entre péché et sacrifice pour le péché, ainsi que le référent du pronom « l’ » : le taureau.'
