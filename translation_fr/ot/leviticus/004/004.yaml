id: LEV.4.4
reference: Leviticus 4:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הֵבִ֣יא אֶת הַ/פָּ֗ר אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד לִ/פְנֵ֣י יְהוָ֑ה וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹ֣אשׁ הַ/פָּ֔ר וְ/שָׁחַ֥ט אֶת הַ/פָּ֖ר לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/004.yaml
  text: He shall bring the bull to the entrance of the tent of meeting before Yahweh[b][a], and he shall lay his hand on the head of the bull and slaughter the bull before Yahweh.
translation:
  language: fr
  text: Il amènera le taureau à l’entrée de la tente de la Rencontre[a], devant Yahweh[b]. Il posera sa main sur la tête du taureau et l’égorgera devant Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’ouverture de la tente de la Rencontre ».
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque peut aussi se rendre par « en présence de Yahweh ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Il amènera
  rationale: Le hifil de בוא exprime ici l’action prescrite d’amener l’animal. Le futur français convient naturellement aux instructions rituelles du contexte.
- source_word: הַפָּר
  choice: le taureau
  rationale: פַּר désigne un taureau, souvent destiné au sacrifice. Le verset ne précise pas explicitement qu’il est jeune.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à l’entrée de la tente de la Rencontre
  rationale: פֶּתַח désigne l’ouverture ou l’entrée. « Tente de la Rencontre » rend de façon claire et cohérente le nom du sanctuaire אֹהֶל מוֹעֵד.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי peut signifier « devant » ou « en présence de ». La formulation concise « devant Yahweh » conserve l’expression cultuelle hébraïque sans en réduire le sens.
- source_word: וְסָמַךְ אֶת יָדוֹ עַל רֹאשׁ הַפָּר
  choice: Il posera sa main sur la tête du taureau
  rationale: סמך décrit le geste rituel consistant à poser ou appuyer la main sur l’animal. « Posera sa main » exprime le geste sans lui attribuer une signification théologique que le verset n’explicite pas.
- source_word: וְשָׁחַט
  choice: et l’égorgera
  rationale: שׁחט est le verbe technique employé pour l’abattage rituel. « Égорger » est précis et idiomatique en français dans un contexte sacrificiel; le pronom évite une répétition lourde tout en gardant le taureau comme référent explicite.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le Tétragramme. « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Signification de l’imposition de la main
  choice: Décrire uniquement le geste physique
  alternative: Expliciter une identification avec l’animal ou un transfert de culpabilité
  rationale: Ce verset prescrit le geste sans en expliquer toute la portée. La traduction préserve cette retenue et n’impose pas une interprétation doctrinale.
translation_notes:
  register: Français international actuel, clair et digne. Le futur simple marque naturellement la prescription rituelle. Le vocabulaire conserve la précision cultuelle sans archaïsme inutile ni ajout interprétatif.
