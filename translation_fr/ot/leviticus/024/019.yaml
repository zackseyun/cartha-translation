  text: וְ/אִ֕ישׁ כִּֽי יִתֵּ֥ן מ֖וּם בַּ/עֲמִית֑/וֹ כַּ/אֲשֶׁ֣ר עָשָׂ֔ה כֵּ֖ן יֵעָ֥שֶׂה לּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/019.yaml
  text: And if a man inflicts an injury on his fellow[a], just as he has done[b], so it shall be done to him.
translation:
  language: fr
  text: Si un homme inflige une blessure[a] à son prochain, on lui fera ce qu’il a fait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « donne un défaut physique à son semblable ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Si un homme
  rationale: Dans cette formulation juridique casuistique, כִּי introduit naturellement une condition. « Un homme » conserve le singulier masculin du texte hébreu.
- source_word: יִתֵּן מוּם
  choice: inflige une blessure
  rationale: L’expression signifie littéralement « donner un défaut/une infirmité ». Dans le contexte d’un dommage corporel causé à autrui, « infliger une blessure » rend clairement et naturellement sa portée juridique.
- source_word: בַּעֲמִיתוֹ
  choice: à son prochain
  rationale: עָמִית désigne un semblable ou un membre de la même communauté. « Son prochain » est naturel en français biblique moderne et conserve la dimension relationnelle du terme.
- source_word: כַּאֲשֶׁר עָשָׂה כֵּן יֵעָשֶׂה לּוֹ
  choice: on lui fera ce qu’il a fait
  rationale: Cette formulation française concise maintient la stricte correspondance entre l’acte et la sanction. Le tour impersonnel « on lui fera » rend le passif hébreu sans désigner un vengeur privé.
theological_decisions:
- issue: Formulation de la loi du talion dans un cadre juridique
  choice: Présenter une règle impersonnelle de rétribution proportionnée
  alternative: Formuler le verset comme une autorisation de vengeance personnelle
  rationale: Le passif hébreu énonce la conséquence juridique sans préciser l’agent. La traduction conserve cette indétermination et n’ajoute aucune idée de vengeance privée.
translation_notes:
  register: Français moderne, clair et digne, avec une formulation juridique concise. « Prochain » reste courant et approprié au contexte communautaire; la note conserve l’image concrète de מוּם.
