id: LEV.24.21
reference: Leviticus 24:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/מַכֵּ֥ה בְהֵמָ֖ה יְשַׁלְּמֶ֑/נָּה וּ/מַכֵּ֥ה אָדָ֖ם יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/021.yaml
  text: And whoever strikes down an animal shall make restitution for it[a], but whoever strikes down a man shall be put to death.
translation:
  language: fr
  text: Celui qui tue un animal devra le remplacer, mais celui qui tue un être humain sera mis à mort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַכֵּה
  choice: celui qui tue
  rationale: Le participe hifil de נכה désigne ici celui qui porte un coup mortel. Dans ce contexte, « tue » exprime naturellement en français l’issue fatale présupposée par la réparation exigée pour l’animal et la peine de mort prononcée pour l’être humain.
- source_word: בְהֵמָה
  choice: un animal
  rationale: Le terme désigne ici un animal, souvent domestique. « Animal » est clair, actuel et suffisamment large.
- source_word: יְשַׁלְּמֶנָּה
  choice: devra le remplacer
  rationale: Le piel de שלם exprime la compensation intégrale; dans le contexte immédiat (v. 18), celle-ci consiste à donner une vie pour une vie. « Le remplacer » rend concrètement cette restitution, et le pronom masculin respecte le genre français d’« animal ».
- source_word: אָדָם
  choice: un être humain
  rationale: Dans l’opposition avec l’animal, אָדָם désigne une personne humaine sans distinction nécessaire de sexe. « Un être humain » restitue cette portée en français moderne.
- source_word: יוּמָת
  choice: sera mis à mort
  rationale: La forme hofal exprime une mise à mort subie, ici comme sanction judiciaire. « Sera mis à mort » conserve précisément ce passif juridique.
theological_decisions:
- issue: Portée de אָדָם dans la formulation juridique
  choice: un être humain
  alternative: un homme
  rationale: Bien que le nom soit morphologiquement masculin singulier, אָדָם oppose ici l’humain à l’animal et peut désigner toute personne. Le français « être humain » préserve cette portée sans limiter indûment l’application de la loi aux hommes de sexe masculin.
translation_notes:
  register: Formulation juridique concise, digne et naturelle en français international moderne. Le futur à valeur prescriptive (« devra », « sera ») rend la force normative de l’hébreu sans archaïsme.
