  text: מִשְׁפַּ֤ט אֶחָד֙ יִהְיֶ֣ה לָ/כֶ֔ם כַּ/גֵּ֥ר כָּ/אֶזְרָ֖ח יִהְיֶ֑ה כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/022.yaml
  text: There shall be one standard of judgment for you, for the sojourner as for the native, for I am the LORD your God.
translation:
  language: fr
  text: 'Une même règle de droit s’appliquera à vous : elle sera la même pour l’immigré que pour l’Israélite de naissance, car je suis le SEIGNEUR, votre Dieu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפָּט אֶחָד
  choice: une même règle de droit
  rationale: L’expression désigne ici une norme juridique unique et égale pour tous, et non simplement un verdict particulier. Cette formulation française rend la portée normative de מִשְׁפָּט dans le contexte.
- source_word: גֵּר
  choice: immigré
  rationale: Le terme désigne un étranger établi au sein de la communauté. « Immigré » est actuel et compréhensible, sans suggérer un simple voyageur de passage.
- source_word: אֶזְרָח
  choice: Israélite de naissance
  rationale: Dans ce contraste avec גֵּר, le mot désigne le membre autochtone de la communauté d’Israël. L’explicitation évite l’ambiguïté moderne de « citoyen » et rend le cadre historique.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: La graphie en petites capitales suit la convention française courante qui signale le nom divin YHWH sans imposer une vocalisation discutée.
theological_decisions:
- issue: Égalité juridique entre l’immigré et l’Israélite de naissance
  choice: La même règle de droit s’applique aux deux groupes.
  alternative: « Vous aurez un même jugement »
  rationale: Le contexte législatif indique une norme juridique commune. La traduction conserve l’affirmation d’une justice impartiale sans étendre artificiellement sa portée au-delà du cadre du verset.
translation_notes:
  register: Français international moderne, digne et direct. Le futur normatif restitue la force prescriptive de l’hébreu. La répétition « une même… la même » conserve l’insistance du texte tout en restant naturelle.
