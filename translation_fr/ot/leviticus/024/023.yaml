  to: Moïse parla aux Israélites, et ils firent sortir hors du camp celui qui avait maudit[a] et le lapidèrent à coups de pierres. Les Israélites firent ainsi ce que Yahweh avait ordonné à Moïse.
  rationale: La révision supprime une inférence non exprimée (« donc »), rétablit une coordination narrative explicite, précise le mouvement vers l’extérieur par « hors du camp » et restitue idiomatiquement l’expression hébraïque de la lapidation. Elle conserve le choix lexical prudent « celui qui avait maudit », le nom divin « Yahweh » et l’ancre de note existante.
