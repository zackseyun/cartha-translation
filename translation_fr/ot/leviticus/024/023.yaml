  source_fidelity: La traduction rend correctement la structure narrative, les sujets (« Moïse », puis « les Israélites »), le déplacement hors du camp, la lapidation et la formule finale d’obéissance. « Donc » n’a toutefois pas d’équivalent explicite dans l’hébreu. La coordination par une relative (« qui firent sortir ») est possible, mais elle atténue inutilement la succession verbale explicite du texte source. « À coups de pierres » restitue de façon idiomatique l’explicitation hébraïque de la pierre.
  naturalness: Le français est globalement naturel et de registre biblique moderne. Une coordination directe est plus claire et plus fluide que la relative après « les Israélites ». « Hors du camp » exprime sans ambiguïté la destination extérieure. « Le lapidèrent à coups de pierres » est idiomatique et conserve la plénitude de l’expression hébraïque.
  terminology: « Israélites », « celui qui avait maudit » et « Yahweh » sont cohérents avec les choix annoncés. La note offre à juste titre « le blasphémateur » comme possibilité contextuelle sans l’imposer dans le texte. Son explication peut employer « celui qui avait maudit » afin de correspondre exactement au repère contextuel et au choix du texte principal.
