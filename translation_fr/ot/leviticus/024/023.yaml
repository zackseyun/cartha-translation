base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/023.yaml
  text: So Moses spoke to the sons of Israel[a], and they brought the one who had cursed outside the camp and stoned him with stones. Thus the sons of Israel did as Yahweh had commanded Moses.
translation:
  language: fr
  text: Moïse parla aux Israélites, et ils firent sortir hors du camp celui qui avait maudit[a] et le lapidèrent à coups de pierres. Les Israélites firent ainsi ce que Yahweh avait ordonné à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le blasphémateur ». Le participe hébreu signifie littéralement « celui qui maudit » et renvoie à l’homme qui, dans le contexte précédent, avait maudit le Nom divin.
    reason: Alternative lexicale et précision contextuelle.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le piel de דבר signifie couramment « parler ». Le passé simple convient au récit suivi en français.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette expression hébraïque désigne ici collectivement le peuple d’Israël. « Les Israélites » est naturel, précis et inclusif en français moderne.
- source_word: וַיּוֹצִיאוּ ... מִחוּץ לַמַּחֲנֶה
  choice: firent sortir du camp
  rationale: Le hiphil de יצא exprime l’action de faire sortir. Cette formulation française rend clairement le déplacement vers l’extérieur du camp.
- source_word: הַמְקַלֵּל
  choice: celui qui avait maudit
  rationale: Le participe de קלל renvoie à l’homme qui avait maudit le Nom dans le contexte précédent. Cette traduction conserve le sens lexical direct sans imposer dans le texte le terme plus interprétatif « blasphémateur ».
- source_word: וַיִּרְגְּמוּ אֹתוֹ אָבֶן
  choice: le lapidèrent
  rationale: En français, « lapider » exprime naturellement et complètement la mise à mort à coups de pierres; ajouter « avec des pierres » serait redondant et peu idiomatique.
- source_word: עָשׂוּ כַּאֲשֶׁר צִוָּה
  choice: firent ainsi ce que ... avait ordonné
  rationale: La tournure résume l’obéissance à un ordre antérieur; le plus-que-parfait marque naturellement cette antériorité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom divin personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Faut-il rendre הַמְקַלֵּל par le terme théologiquement plus marqué « le blasphémateur » ?
  choice: celui qui avait maudit
  alternative: le blasphémateur
  rationale: Bien que le contexte concerne une malédiction prononcée contre le Nom divin, le mot hébreu est le participe du verbe קלל, « maudire ». Le texte principal garde donc cette valeur lexicale et la note signale l’interprétation contextuelle possible.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple maintient le registre biblique soutenu sans archaïsme. La coordination « qui firent sortir » évite une répétition lourde tout en conservant clairement les Israélites comme sujet.
