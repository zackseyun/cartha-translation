    issue: « sans faute » pour מות יומת
    rationale: Cette expression française évoque l’absence de faute ou d’intention coupable, non la certitude ou l’insistance de la formule hébraïque. Elle doit être remplacée.
  - severity: low
    issue: « une personne humaine »
    rationale: La formulation est redondante et moins naturelle que « toute personne »; elle rend aussi moins clairement la portée distributive de כל.
  revised_text: Et si un homme frappe à mort toute personne[a], il sera certainement mis à mort.
