source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּ֥י יַכֶּ֖ה כָּל נֶ֣פֶשׁ אָדָ֑ם מ֖וֹת יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/017.yaml
  text: And if a man strikes down any human being[b][a], he shall surely be put to death.
translation:
  language: fr
  text: Et si un homme frappe à mort toute personne[a], il sera certainement mis à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toute vie d’un humain ». Ici, le mot hébreu désigne une personne, ou une vie humaine, et non spécialement une « âme » immatérielle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Et si un homme
  rationale: Le וְ relie cette règle au contexte précédent; כִּי introduit ici la condition. אִישׁ est un nom masculin singulier, rendu explicitement par « un homme ».
- source_word: יַכֶּה
  choice: frappe à mort
  rationale: Le hiphil de נכה signifie littéralement « frapper », mais l’objet et la sanction montrent qu’il s’agit ici d’un coup mortel. « Frappe à mort » conserve l’image concrète sans laisser croire qu’une simple blessure entraîne cette peine.
- source_word: כָּל נֶפֶשׁ אָדָם
  choice: une personne humaine
  rationale: נֶפֶשׁ désigne ici la personne vivante, non une âme immatérielle; אָדָם qualifie cette vie ou personne comme humaine. En français courant, « une personne humaine » rend clairement le référent concret.
- source_word: מוֹת יוּמָת
  choice: il sera mis à mort sans faute
  rationale: L’infinitif absolu suivi de la forme verbale passive renforce la certitude ou le caractère impératif de la sanction. La tournure conserve aussi le passif de la formule juridique hébraïque.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans כָּל נֶפֶשׁ אָדָם
  choice: personne humaine
  alternative: vie humaine; âme humaine
  rationale: Dans cette loi d’homicide, le syntagme désigne l’être humain tué. Traduire par « âme » introduirait une distinction anthropologique que le texte n’énonce pas ici.
- issue: Portée de אִישׁ
  choice: un homme
  alternative: quiconque; une personne
  rationale: Le texte source emploie le masculin singulier אִישׁ. Le conserver respecte sa forme, sans prétendre que la victime, désignée par אָדָם, soit nécessairement masculine.
- issue: Force de מוֹת יוּמָת
  choice: sera mis à mort sans faute
  alternative: devra être mis à mort; sera certainement mis à mort
  rationale: La formule intensive affirme fermement la peine tout en laissant subsister la tension entre certitude formulée et obligation juridique.
translation_notes:
  register: Français international moderne, sobre et juridique. « Frappe à mort » explicite l’issue fatale impliquée par le contexte; « sans faute » donne à la formule pénale son intensité sans employer le terme plus administratif « exécuter ».
