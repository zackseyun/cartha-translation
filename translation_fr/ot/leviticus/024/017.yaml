- from: Et si un homme frappe à mort une personne humaine[a], il sera mis à mort sans faute.
  to: Et si un homme frappe à mort toute personne[a], il sera certainement mis à mort.
  rationale: La révision remplace une expression pénale française sémantiquement inexacte par une formulation qui rend l’intensité de la formule hébraïque, et emploie « toute personne », plus naturel et plus précis dans ce contexte légal. La note conserve l’alternative lexicale sans imposer une anthropologie étrangère au texte.
