  text: וַ/יַּנִּיחֻ֖/הוּ בַּ/מִּשְׁמָ֑ר לִ/פְרֹ֥שׁ לָ/הֶ֖ם עַל פִּ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/012.yaml
  text: So they put him in custody[a], to clarify for them according to the word of Yahweh.
translation:
  language: fr
  text: Ils le placèrent sous garde, afin qu’il leur soit clairement indiqué, conformément à la parole de Yahweh, ce qu’il fallait faire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « afin de préciser pour eux selon la bouche de Yahweh ». Il ne précise explicitement ni ce qui doit être clarifié ni qui doit le clarifier. Le contexte indique qu’il s’agit de savoir quelle conduite ou quelle décision est requise.'
    reason: ambiguïté syntaxique et alternative lexicale
lexical_decisions:
- source_word: וַיַּנִּיחֻהוּ
  choice: Ils le placèrent donc
  rationale: Le causatif de נוח signifie ici « placer, mettre ». « Donc » rend naturellement la progression narrative du waw consécutif.
- source_word: בַּמִּשְׁמָר
  choice: sous garde
  rationale: מִשְׁמָר désigne ici une garde surveillée ou une détention. « Sous garde » reste naturel et ne précise pas indûment la forme de l’enfermement.
- source_word: לִפְרֹשׁ לָהֶם
  choice: afin que la chose leur soit clairement précisée
  rationale: פרשׁ peut signifier « rendre clair, expliquer, préciser distinctement ». L’hébreu ne nomme pas expressément ce qui doit être précisé ni l’agent de cette clarification; « la chose » conserve cette relative indétermination, tandis que la note signale la formulation littérale.
- source_word: עַל־פִּי
  choice: conformément à la parole de
  rationale: L’expression signifie littéralement « selon la bouche de » et marque ici la conformité à une déclaration divine faisant autorité. « Conformément à la parole de » en garde à la fois la dimension verbale et l’autorité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin, plutôt que par un titre de substitution.
theological_decisions:
- issue: Identité de l’agent et contenu de la clarification
  choice: 'Formulation passive et objet général : « que la chose leur soit clairement précisée »'
  alternative: « pour que Yahweh leur indique clairement ce qu’il fallait faire »
  rationale: L’alternative exprime bien le sens contextuel, mais l’hébreu laisse l’agent du verbe et son objet direct implicites. La formulation retenue évite de résoudre silencieusement cette ellipse.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin personnel; sa translittération préserve cette donnée du texte source.
translation_notes:
  register: Français international moderne, sobre et digne. « Sous garde » convient au cadre juridique sans introduire le vocabulaire plus institutionnel de l’incarcération moderne. Le tour passif maintient l’ellipse de l’hébreu.
