source:
  edition: WLC
  text: וְ/נֹקֵ֤ב שֵׁם יְהוָה֙ מ֣וֹת יוּמָ֔ת רָג֥וֹם יִרְגְּמוּ ב֖/וֹ כָּל הָ/עֵדָ֑ה כַּ/גֵּר֙ כָּֽ/אֶזְרָ֔ח בְּ/נָקְב/וֹ שֵׁ֖ם יוּמָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/016.yaml
  text: Whoever blasphemes the name of Yahweh shall surely be put to death[a]; all the congregation shall certainly stone him[b]. The sojourner as well as the native-born—when he blasphemes the Name—shall be put to death.
translation:
  language: fr
  text: Celui qui blasphème le nom de Yahweh sera mis à mort[a] ; toute l’assemblée le lapidera. Qu’il soit résident étranger ou Israélite de naissance, s’il blasphème le Nom[b], il sera mis à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi signifier « prononcer distinctement » ou, dans ce contexte, « maudire ». Son sens précis dans cette expression est discuté.
    reason: lexical_alternative
  - marker: b
    text: Ici, l’hébreu dit simplement « le Nom », désignation révérencielle du nom divin.
    reason: cultural_note
lexical_decisions:
- source_word: וְנֹקֵב / בְּנָקְבוֹ
  choice: blasphème / s’il blasphème
  rationale: Dans ce contexte juridique, נָקַב désigne vraisemblablement un emploi profanateur du nom divin. « Blasphémer » rend naturellement cette portée sans réduire nécessairement l’infraction à la simple prononciation ; l’ambiguïté lexicale est signalée en note.
- source_word: שֵׁם יְהוָה
  choice: le nom de Yahweh
  rationale: שֵׁם signifie « nom » et le tétragramme est transcrit « Yahweh », ce qui préserve le nom divin présent dans le texte source.
- source_word: מוֹת יוּמָת
  choice: sera mis à mort
  rationale: La construction infinitif absolu + verbe conjugué renforce la certitude et l’obligation de la peine. En français juridique naturel, le futur passif exprime fermement la sentence sans tournure artificielle.
- source_word: רָגוֹם יִרְגְּמוּ בוֹ
  choice: le lapidera
  rationale: Le verbe signifie lapider. Le sujet singulier collectif « toute l’assemblée » appelle naturellement le singulier en français ; la force emphatique de la construction hébraïque ressort du caractère catégorique de l’énoncé.
- source_word: כָּל הָעֵדָה
  choice: toute l’assemblée
  rationale: עֵדָה désigne ici la collectivité d’Israël considérée comme corps assemblé, notamment dans un cadre public et judiciaire.
- source_word: כַּגֵּר כָּאֶזְרָח
  choice: qu’il soit résident étranger ou Israélite de naissance
  rationale: גֵּר est l’étranger établi parmi Israël, non un simple voyageur. אֶזְרָח désigne le membre autochtone du peuple ; « Israélite de naissance » explicite le contraste dans ce contexte sans recourir au terme moderne ambigu « citoyen ».
- source_word: שֵׁם
  choice: le Nom
  rationale: Employé absolument dans la dernière proposition, « le Nom » fonctionne comme une désignation révérencielle du nom divin ; la majuscule rend cet emploi en français.
- source_word: יוּמָת
  choice: il sera mis à mort
  rationale: Le passif hébreu est conservé afin de rendre la formule judiciaire, plutôt que le simple résultat « il mourra ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve ici le nom propre révélé au lieu de le remplacer par un titre.
- issue: Sens de נקב associé au nom divin
  choice: blasphémer
  alternative: prononcer ; maudire
  rationale: Le contexte immédiat concerne un usage outrageant et passible de mort. « Blasphémer » communique cette profanation sans affirmer que toute simple prononciation du nom constitue le délit. La polysémie réelle du verbe demeure indiquée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe juridique demeure catégorique, mais les redoublements intensifs hébreux sont rendus idiomatiquement plutôt que calqués. « Résident étranger » précise le statut durable du גֵּר ; « Israélite de naissance » rend le contraste contextuel avec l’autochtone.
