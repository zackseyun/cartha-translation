  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Puis Yahvé parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Puis … parla
  rationale: Le wayyiqtol fait progresser le récit. « Puis » exprime naturellement cette succession en français moderne, et « parla » rend le verbe דבר au passé simple, conformément au registre narratif.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu par la forme française courante du nom divin, plutôt que par la substitution traditionnelle « le SEIGNEUR ».
- source_word: אֶל מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל désigne ici le destinataire de la parole; « à Moïse » est l’expression française naturelle.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Cet infinitif introduit le discours direct. « En ces termes » en restitue la fonction idiomatiquement et avec dignité, sans la lourdeur de « disant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le nom divin. « Yahvé » en préserve le caractère de nom propre dans une forme établie en français, tandis que « le SEIGNEUR » reflète la tradition de lecture substitutive.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient à la narration biblique écrite; les deux-points annoncent directement la parole qui suit au verset suivant.
