  text: בְּ/י֨וֹם הַ/שַּׁבָּ֜ת בְּ/י֣וֹם הַ/שַּׁבָּ֗ת יַֽעַרְכֶ֛/נּוּ לִ/פְנֵ֥י יְהוָ֖ה תָּמִ֑יד מֵ/אֵ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל בְּרִ֥ית עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/008.yaml
  text: Every Sabbath day he shall arrange it before Yahweh continually[c][b][a], from the sons of Israel as an everlasting covenant.
translation:
  language: fr
  text: Chaque sabbat[a], il les disposera devant Yahweh, continuellement[b], de la part des fils d’Israël, comme une alliance perpétuelle[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Le jour du sabbat, le jour du sabbat », tournure qui signifie « chaque sabbat » ou « sabbat après sabbat ».'
    reason: lexical_alternative
  - marker: b
    text: Ici, « continuellement » désigne une observance régulière et permanente, renouvelée chaque sabbat.
    reason: clarification
  - marker: c
    text: 'Littéralement : « alliance perpétuelle ». Le rattachement précis de cette expression est condensé en hébreu.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם הַשַּׁבָּת בְּיוֹם הַשַּׁבָּת
  choice: Chaque sabbat
  rationale: 'La répétition hébraïque a une valeur distributive et exprime la récurrence : sabbat après sabbat.'
- source_word: יַעַרְכֶנּוּ
  choice: il les disposera
  rationale: Le verbe ערך signifie disposer ou mettre en ordre. Le suffixe singulier hébreu reprend collectivement l’ensemble des pains; le pluriel français renvoie naturellement aux pains du contexte immédiat.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: Expression cultuelle indiquant que les pains sont présentés en présence de Yahweh; le nom divin est translittéré.
- source_word: תָּמִיד
  choice: continuellement
  rationale: Dans ce cadre rituel, le terme marque la permanence de l’observance régulière, dont la cadence hebdomadaire vient d’être précisée.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: ils proviendront des fils d’Israël
  rationale: מֵאֵת indique ici la provenance. La formulation explicite en français le rapport syntaxique tout en conservant l’expression masculine collective « fils d’Israël ».
- source_word: בְּרִית עוֹלָם
  choice: en vertu d’une alliance perpétuelle
  rationale: Cette formulation préserve le vocabulaire proprement covenantal sans ajouter l’idée interprétative d’« obligation »; la préposition ב peut exprimer le cadre ou le fondement de cette disposition.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel dans une forme française courante.
- issue: Expression collective בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: Israélites
  rationale: Le choix conserve la forme généalogique et masculine du texte hébreu, employée ici au sens collectif.
- issue: Rapport syntaxique de בְּרִית עוֹלָם
  choice: en vertu d’une alliance perpétuelle
  alternative: comme une alliance perpétuelle
  rationale: L’hébreu est très condensé et permet plusieurs rattachements. Le texte principal exprime l’alliance comme cadre durable de la fourniture et de la présentation des pains, tandis que la note signale une traduction plus formelle.
translation_notes:
  register: Français international moderne, digne et lisible. « Disposer » convient au geste rituel sans archaïsme excessif. Les deux-points clarifient la relation entre l’action sacerdotale et la provenance des pains sans effacer l’ambiguïté, signalée en note, de la dernière expression.
