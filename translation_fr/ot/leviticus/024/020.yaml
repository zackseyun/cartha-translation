  text: שֶׁ֚בֶר תַּ֣חַת שֶׁ֔בֶר עַ֚יִן תַּ֣חַת עַ֔יִן שֵׁ֖ן תַּ֣חַת שֵׁ֑ן כַּ/אֲשֶׁ֨ר יִתֵּ֥ן מוּם֙ בָּֽ/אָדָ֔ם כֵּ֖ן יִנָּ֥תֶן בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/020.yaml
  text: fracture for fracture[a], eye for eye, tooth for tooth; as he inflicts an injury on a person[b], so it shall be inflicted on him.
translation:
  language: fr
  text: fracture pour fracture, œil pour œil, dent pour dent ; comme il inflige une lésion[a] à une personne[b], ainsi une lésion lui sera infligée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une atteinte physique » ou « une défiguration ». L’hébreu dit littéralement « donner un défaut/une atteinte », idiome rendu ici par « inflige une lésion ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit « à un être humain ». Le singulier a ici une valeur représentative dans cette règle juridique.
    reason: cultural_note
lexical_decisions:
- source_word: שֶׁבֶר
  choice: fracture
  rationale: Dans ce contexte juridique de dommages corporels, le nom désigne une cassure ou une fracture. « Fracture » est précis et conserve le parallélisme concret de la formule.
- source_word: תַּחַת
  choice: pour
  rationale: Dans la formule talionique, le terme exprime la correspondance ou l’équivalence. « Pour » est la tournure française consacrée et naturelle dans « œil pour œil ».
- source_word: עַיִן
  choice: œil
  rationale: Terme anatomique direct, conservé littéralement dans la formule juridique.
- source_word: שֵׁן
  choice: dent
  rationale: Terme anatomique direct, conservé littéralement dans la formule juridique.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: Introduit la comparaison entre le dommage causé et la conséquence imposée, avec une formulation française concise.
- source_word: יִתֵּן מוּם
  choice: inflige une lésion
  rationale: L’hébreu emploie littéralement « donner » avec מוּם. En français, « infliger une lésion » rend naturellement cet idiome de causalité tout en gardant son caractère physique et juridique.
- source_word: מוּם
  choice: lésion
  rationale: Le mot peut désigner un défaut, une atteinte physique ou une défiguration. Ici, « lésion » convient à un dommage corporel causé à autrui sans réduire le sens à un défaut esthétique.
- source_word: אָדָם
  choice: personne
  rationale: Dans cette règle juridique, le singulier représente tout être humain. « Personne » exprime naturellement cette portée générique en français moderne.
- source_word: כֵּן
  choice: ainsi
  rationale: Marque la conséquence correspondante et maintient la symétrie solennelle de la disposition juridique.
- source_word: יִנָּתֶן בּוֹ
  choice: une lésion lui sera infligée
  rationale: Le passif hébreu est conservé. La reprise explicite de « lésion » évite en français un pronom ambigu et maintient le lien avec le dommage mentionné.
theological_decisions:
- issue: Nature de la formule du talion
  choice: Conserver littéralement « fracture pour fracture, œil pour œil, dent pour dent ».
  alternative: Traduire par « une réparation proportionnelle au dommage » ou « une lésion équivalente à la lésion ».
  rationale: L’hébreu formule concrètement une réciprocité. La traduction ne doit pas décider si son application juridique exigeait une atteinte corporelle identique ou une compensation équivalente ; cette question relève de l’interprétation.
- issue: Portée de אָדָם
  choice: personne
  alternative: homme
  rationale: Dans ce cas de jurisprudence, אָדָם désigne génériquement un être humain. « Personne » rend cette portée sans introduire une restriction masculine absente du contexte.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme juridique traditionnel est conservé, tandis que la seconde proposition explicite « une lésion » afin d’éviter une tournure passive obscure en français.
