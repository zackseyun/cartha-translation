base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/009.yaml
  text: It shall belong to Aaron and to his sons[a], and they shall eat it in a holy place, because it is most holy to him from the food offerings of Yahweh, a permanent statute.
translation:
  language: fr
  text: 'Elle appartiendra à Aaron et à ses fils, et ils la mangeront dans un lieu saint, car c’est pour lui une chose très sainte parmi les offrandes consumées par le feu pour Yahweh[a] : c’est une prescription perpétuelle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les offrandes offertes par le feu à Yahweh ». Le terme hébreu désigne traditionnellement les offrandes présentées par le feu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לְאַהֲרֹן וּלְבָנָיו
  choice: Elle appartiendra à Aaron et à ses fils
  rationale: Le verbe היה suivi de לְ exprime ici l’attribution ou la possession. « Appartiendra » rend clairement cette valeur juridique. Le féminin singulier « Elle » respecte la forme hébraïque et renvoie à l’offrande ou à la portion évoquée dans le contexte.
- source_word: וַאֲכָלֻהוּ
  choice: et ils la mangeront
  rationale: La forme poursuit l’instruction cultuelle avec une valeur prescriptive. Le futur français convient au style juridique du passage.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: dans un lieu saint
  rationale: L’hébreu est sans article et ne désigne pas nécessairement la pièce appelée « le Lieu saint ». L’indéfini préserve cette portée.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: une chose très sainte
  rationale: L’expression hébraïque est un superlatif. Cette formulation naturelle évite de la confondre avec le « Saint des saints », espace du sanctuaire.
- source_word: הוּא לוֹ
  choice: elle est pour lui
  rationale: Le singulier de לֹו est conservé, même après la mention d’Aaron et de ses fils, afin de ne pas lisser la grammaire du texte.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: parmi les offrandes consumées pour Yahweh
  rationale: אִשֶּׁה désigne traditionnellement une offrande présentée par le feu. « Offrandes consumées » évoque cette présentation cultuelle sans suggérer que Dieu se nourrit littéralement. La préposition מִן a ici une valeur partitive, rendue par « parmi ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: חָק עוֹלָם
  choice: une prescription perpétuelle
  rationale: L’expression désigne une règle cultuelle durable. « Prescription perpétuelle » est actuelle, précise et digne.
theological_decisions:
- issue: Référent du singulier לֹו après « Aaron et ses fils »
  choice: Conserver le singulier par « pour lui »
  alternative: Employer « pour eux » afin d’harmoniser avec l’ensemble des prêtres
  rationale: Le texte hébreu reste au singulier, probablement en présentant Aaron comme représentant de la lignée sacerdotale. La traduction conserve cette tension grammaticale sans l’expliquer dans le corps du verset.
- issue: Portée de קֹדֶשׁ קָדָשִׁים
  choice: « une chose très sainte »
  alternative: « le Saint des saints » ou « une sainteté des saintetés »
  rationale: Dans ce contexte, l’expression qualifie le statut cultuel de la portion sacerdotale et ne nomme pas une pièce du sanctuaire.
translation_notes:
  register: Français international moderne, au registre digne et juridique. La syntaxe reste fluide tout en conservant le singulier inattendu « pour lui ». Le marqueur de note [a] est placé sur l’expression qu’il explique.
