source:
  edition: WLC
  text: עַ֚ל הַ/מְּנֹרָ֣ה הַ/טְּהֹרָ֔ה יַעֲרֹ֖ךְ אֶת הַ/נֵּר֑וֹת לִ/פְנֵ֥י יְהוָ֖ה תָּמִֽיד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/004.yaml
  text: On the pure lampstand he shall arrange the lamps before Yahweh continually[a].
translation:
  language: fr
  text: Sur le chandelier pur, il disposera continuellement les lampes devant Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « régulièrement ». Le terme hébreu peut désigner une action maintenue de façon constante ou accomplie avec régularité.
    reason: ambiguïté lexicale de תָּמִיד
lexical_decisions:
- source_word: עַל הַמְּנֹרָה
  choice: sur le porte-lampes
  rationale: La préposition עַל indique ici la position des lampes par rapport au support, et מְנוֹרָה désigne le porte-lampes du sanctuaire plutôt qu’une simple lampe.
- source_word: הַטְּהֹרָה
  choice: pur
  rationale: Dans ce contexte sacerdotal, l’adjectif qualifie le porte-lampes comme rituellement pur, avec aussi une possible référence à la pureté de sa matière.
- source_word: יַעֲרֹךְ
  choice: il disposera
  rationale: Le verbe ערך exprime l’action de mettre en ordre ou de disposer; « disposera » reste naturel tout en conservant l’idée d’un agencement réglé.
- source_word: הַנֵּרוֹת
  choice: les lampes
  rationale: Le pluriel désigne les lampes individuelles placées sur le porte-lampes.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי est une expression cultuelle signifiant « devant » ou « en présence de », tandis que le nom divin est rendu directement par « Yahweh ».
- source_word: תָּמִיד
  choice: continuellement
  rationale: Dans les textes sacerdotaux, תָּמִיד peut exprimer une continuité régulière et durable; « continuellement » préserve cette portée sans explicitation excessive.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » conserve le nom propre plutôt que de lui substituer un titre.
- issue: Portée de תָּמִיד
  choice: continuellement
  alternative: régulièrement
  rationale: Le terme peut décrire soit une permanence, soit l’accomplissement régulier et constant du rite. Le choix principal conserve la formulation la plus directe, tandis que la note signale la nuance possible.
translation_notes:
  register: Français moderne, sobre et cultuel. « Porte-lampes » traduit la fonction de la menorah sans recourir à une translittération moins immédiatement transparente; « disposer » rend l’action ordonnée prescrite au prêtre.
