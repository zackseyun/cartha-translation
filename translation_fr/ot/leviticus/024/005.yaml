  text: And you shall take fine flour and bake it into twelve loaves[b][a]; each loaf shall be of two-tenths of an ephah.
translation:
  language: fr
  text: Tu prendras de la farine fine et tu la feras cuire au four pour en faire douze pains[a] ; chaque pain sera fait avec deux dixièmes d’épha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « douze galettes ». Le terme hébreu désigne des unités de pain cuit, notamment dans un contexte rituel.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « deux dixièmes ». Dans le langage sacerdotal des mesures, il s’agit de deux dixièmes d’épha pour chaque pain.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Tu prendras
  rationale: Dans cette suite d’instructions, le parfait qal précédé de la conjonction a une valeur prescriptive. Le futur français exprime naturellement cet ordre.
- source_word: סֹלֶת
  choice: farine fine
  rationale: Terme cultuel désignant une farine raffinée employée pour les offrandes et les pains sacrés, sans préciser explicitement la céréale.
- source_word: וְאָפִיתָ אֹתָהּ
  choice: tu en feras cuire
  rationale: Le pronom féminin renvoie à la farine. Cette formulation idiomatique relie clairement la matière aux pains obtenus, tout en conservant le sens de « cuire au four ».
- source_word: שְׁתֵּים עֶשְׂרֵה חַלּוֹת
  choice: douze pains
  rationale: חַלּוֹת désigne ici des unités de pain cuit dans un cadre rituel. « Pains » est clair et naturel en français moderne, tandis que « gâteaux » pourrait suggérer à tort une pâtisserie sucrée.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: deux dixièmes d’épha
  rationale: Le texte dit littéralement « deux dixièmes » ; dans le système de mesures sacerdotal, l’unité sous-entendue est l’épha. L’expliciter rend la quantité intelligible sans masquer l’ellipse hébraïque, signalée en note.
- source_word: יִהְיֶה הַחַלָּה הָאֶחָת
  choice: chaque pain contiendra
  rationale: Littéralement, « le pain unique sera », tournure distributive indiquant que la mesure vaut pour chacun des douze pains. « Chaque pain » restitue ce sens en français idiomatique.
