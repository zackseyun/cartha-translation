    rationale: Le verbe hébreu אָפָה signifie spécifiquement cuire au four. « Faire cuire » peut couvrir d’autres modes de cuisson; « cuire au four » est une correction sûre et exacte.
  - severity: low
    issue: « chaque pain contiendra deux dixièmes d’épha » est légèrement imprécis dans sa formulation.
    rationale: La mesure désigne la quantité de farine assignée à chaque pain. « Chaque pain sera fait avec deux dixièmes d’épha » exprime plus directement la relation de composition tout en préservant la portée distributive.
  revised_text: Tu prendras de la farine fine et tu la feras cuire au four pour en faire douze pains[a] ; chaque pain sera fait avec deux dixièmes d’épha[b].
