  text: וַ/יֵּצֵא֙ בֶּן אִשָּׁ֣ה יִשְׂרְאֵלִ֔ית וְ/הוּא֙ בֶּן אִ֣ישׁ מִצְרִ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּנָּצוּ֙ בַּֽ/מַּחֲנֶ֔ה בֶּ֚ן הַ/יִּשְׂרְאֵלִ֔ית וְ/אִ֖ישׁ הַ/יִּשְׂרְאֵלִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/010.yaml
  text: The son of an Israelite woman[a], and he was the son of an Egyptian man, went out among the sons of Israel[b]; and in the camp the son of the Israelite woman and an Israelite man fought.
translation:
  language: fr
  text: Le fils d’une femme israélite et d’un homme égyptien sortit parmi les fils d’Israël[a]. Dans le camp, le fils de la femme israélite et un homme israélite se battirent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les Israélites ». L’hébreu dit littéralement « parmi les fils d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Ou « se querellèrent ». Le verbe peut désigner une dispute ou un combat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: sortit
  rationale: Le verbe indique un mouvement de sortie sans préciser le point de départ. « Sortit » conserve cette indétermination et la progression narrative.
- source_word: בֶּן אִשָּׁה יִשְׂרְאֵלִית וְהוּא בֶּן אִישׁ מִצְרִי
  choice: Le fils d’une femme israélite et d’un homme égyptien
  rationale: Cette formulation française naturelle conserve l’identification du personnage par sa mère israélite et son père égyptien, tout en allégeant la reprise littérale de « il était le fils de ».
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: parmi les fils d’Israël
  rationale: « Parmi » rend la valeur spatiale de בְּתוֹךְ. « Fils d’Israël » préserve l’expression collective et traditionnelle du texte hébreu; « Israélites » reste une possibilité plus idiomatique.
- source_word: וַיִּנָּצוּ
  choice: se battirent
  rationale: Le verbe peut désigner une querelle ou un affrontement. « Se battirent » convient à l’escalade du récit sans préciser la forme exacte de l’affrontement.
- source_word: בַּמַּחֲנֶה
  choice: Dans le camp
  rationale: Rendu locatif direct et naturel de מַחֲנֶה.
- source_word: בֶּן הַיִּשְׂרְאֵלִית
  choice: le fils de l’Israélite
  rationale: La désignation répétée est maintenue pour son effet d’identification. Le féminin de « Israélite » est clair grâce à l’article contracté et au contexte immédiat.
- source_word: וְאִישׁ הַיִּשְׂרְאֵלִי
  choice: et un homme israélite
  rationale: Cette expression rend explicitement אִישׁ et marque le contraste ethnique établi dans le texte.
theological_decisions:
- issue: Désignation collective בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: La formulation retenue garde le contact avec l’expression hébraïque genrée qui sert ici de désignation nationale, sans en faire une affirmation excluant les femmes du peuple.
translation_notes:
  register: Français international moderne, sobre et digne. La première phrase est légèrement restructurée pour être naturelle en français, tout en conservant les deux filiations. La répétition de « fils » dans la seconde phrase respecte l’insistance narrative du texte source.
