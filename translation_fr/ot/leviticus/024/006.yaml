source:
  edition: WLC
  text: וְ/שַׂמְתָּ֥ אוֹתָ֛/ם שְׁתַּ֥יִם מַֽעֲרָכ֖וֹת שֵׁ֣שׁ הַֽ/מַּעֲרָ֑כֶת עַ֛ל הַ/שֻּׁלְחָ֥ן הַ/טָּהֹ֖ר לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/006.yaml
  text: And you shall place them in two rows[a], six in each row[b], on the pure table before Yahweh.
translation:
  language: fr
  text: Tu les placeras en deux rangées[a], six par rangée, sur la table pure[b], devant Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en deux dispositions » ou « en deux piles »; le terme hébreu désigne un arrangement ordonné des pains.
    reason: lexical_alternative
  - marker: b
    text: Ou « la table rituellement propre »; l'adjectif hébreu exprime ici la pureté cultuelle, et non seulement la propreté matérielle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Tu les placeras
  rationale: Le verbe שׂוּם signifie couramment « mettre, poser, placer ». Le futur français convient à la formulation prescriptive et conserve la deuxième personne du masculin singulier; le pronom « les » traduit אוֹתָם et renvoie aux douze pains du verset précédent.
- source_word: שְׁתַּיִם מַעֲרָכוֹת
  choice: en deux rangées
  rationale: מַעֲרָכָה désigne un ensemble ordonné ou une disposition. Dans le contexte des pains disposés sur une table, « rangées » est naturel et exprime clairement leur organisation, sans exclure les autres configurations matériellement possibles.
- source_word: שֵׁשׁ הַמַּעֲרָכֶת
  choice: six par rangée
  rationale: 'La formulation hébraïque, littéralement « six, la rangée », a ici une valeur distributive : chacune des deux dispositions comprend six pains. « Six par rangée » l''exprime avec concision en français.'
- source_word: עַל הַשֻּׁלְחָן הַטָּהֹר
  choice: sur la table pure
  rationale: עַל signifie ici « sur ». Dans ce contexte cultuel, טָהוֹר évoque la pureté rituelle plutôt qu'une simple propreté matérielle; « pure » en préserve la portée.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי signifie « devant, en présence de ». « Devant Yahweh » est une formulation concise et naturelle qui conserve directement le nom divin יהוה.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahweh » représente le nom propre sans le remplacer par un titre.
- issue: Sens cultuel de הַטָּהֹר
  choice: la table pure
  alternative: la table propre
  rationale: Le contexte du sanctuaire favorise le sens rituel de טָהוֹר. « Pure » rend cette dimension sans réduire l'adjectif à la propreté physique.
translation_notes:
  register: Français international moderne, clair et digne. La formulation prescriptive est rendue au futur, selon un usage naturel dans les instructions légales. « Rangées » privilégie la lisibilité tout en maintenant en note l'ambiguïté concrète du terme hébreu.
