source:
  edition: WLC
  text: הוֹצֵ֣א אֶת הַֽ/מְקַלֵּ֗ל אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וְ/סָמְכ֧וּ כָֽל הַ/שֹּׁמְעִ֛ים אֶת יְדֵי/הֶ֖ם עַל רֹאשׁ֑/וֹ וְ/רָגְמ֥וּ אֹת֖/וֹ כָּל הָ/עֵדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/014.yaml
  text: Bring the one who cursed outside the camp[a], and let all who heard lay their hands on his head[b], and let all the congregation stone him.
translation:
  language: fr
  text: Fais sortir du camp celui qui a maudit[a]. Que tous ceux qui l’ont entendu posent leurs mains sur sa tête[b], puis que toute l’assemblée le lapide.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le blasphémateur » ou « celui qui a blasphémé ». L’hébreu dit littéralement « celui qui a maudit ».'
    reason: alternative_reading
  - marker: b
    text: Ici, l’imposition des mains marque probablement l’identification officielle du coupable par les témoins ; certains y voient aussi une portée symbolique.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹצֵא
  choice: Fais sortir
  rationale: L’impératif au hifil de יצא signifie faire sortir quelqu’un. « Fais sortir » rend directement la valeur causative et s’accorde naturellement avec « du camp ».
- source_word: הַמְקַלֵּל
  choice: celui qui a maudit
  rationale: Le participe de קלל désigne ici l’auteur précis de la malédiction. Cette formulation conserve le sens lexical sans introduire dans le texte principal l’interprétation plus spécifique « blasphémateur ».
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: du camp
  rationale: Avec « faire sortir », le français idiomatique exprime la destination extérieure par « sortir du camp » ; l’idée d’être conduit hors de l’espace communautaire est pleinement conservée.
- source_word: וְסָמְכוּ
  choice: Que … posent
  rationale: La suite verbale prolonge la force directive de l’impératif initial. « Poser les mains sur » est la tournure française naturelle pour ce geste, sans en imposer une interprétation symbolique.
- source_word: כָל הַשֹּׁמְעִים
  choice: tous ceux qui l’ont entendu
  rationale: Le participe désigne les personnes ayant entendu les paroles incriminées. Le pronom « l’ » explicite en français l’objet contextuel, à savoir l’homme qui a parlé, sans préciser davantage le contenu entendu.
- source_word: יְדֵיהֶם עַל רֹאשׁוֹ
  choice: leurs mains sur sa tête
  rationale: La formulation respecte le pluriel hébreu « leurs mains » ainsi que le singulier « sa tête ».
- source_word: וְרָגְמוּ אֹתוֹ
  choice: le lapide
  rationale: רגם est le verbe usuel pour la mise à mort par jets de pierres. « Lapider » est précis, courant dans le registre biblique et suffisamment intelligible.
- source_word: כָל הָעֵדָה
  choice: toute l’assemblée
  rationale: עֵדָה désigne ici l’ensemble de la communauté réunie. « Toute l’assemblée » garde la dimension collective et officielle sans employer un terme confessionnel marqué.
theological_decisions:
- issue: 'Désignation du coupable : personne ayant maudit ou blasphémateur'
  choice: celui qui a maudit
  alternative: le blasphémateur / celui qui a blasphémé
  rationale: Le terme hébreu est un participe de קלל, « maudire ». Le contexte concerne le nom divin, mais traduire directement par « blasphémateur » préciserait dans le texte principal une interprétation que le lexème seul n’impose pas.
- issue: Signification de l’imposition des mains
  choice: Conserver seulement le geste littéral dans le texte principal
  alternative: L’expliquer comme identification judiciaire du coupable ou comme transfert symbolique de culpabilité
  rationale: Le verset ordonne le geste sans en donner explicitement la signification. La traduction ne tranche donc pas entre ses possibles fonctions judiciaire et symbolique.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe impérative est répartie en deux phrases pour une lecture naturelle. « Assemblée » préserve le caractère collectif et officiel de עֵדָה ; « lapider » conserve la précision juridique du verbe hébreu.
