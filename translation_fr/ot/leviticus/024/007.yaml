review_pass:
  verdict: revise
  source_fidelity: 'Le sens de l’hébreu est globalement bien rendu : l’encens pur est placé sur les deux rangées et il a, par rapport aux pains, la fonction d’אַזְכָּרָה, comme offrande à Yahweh. « Chaque rangée » est défendable dans ce contexte, le singulier collectif désignant chacune des deux dispositions. La formulation révisée rend plus nettement l’apposition cultuelle entre « mémorial » et « offrande par le feu ».'
  naturalness: 'La phrase proposée est compréhensible, mais « Il servira, pour le pain, de portion commémorative, une offrande faite par le feu » est syntaxiquement lourde. « Offrande faite par le feu » n’est pas idiomatique en français : l’expression décrit une offrande présentée/brûlée par le feu, non une offrande fabriquée par le feu.'
  terminology: « Encens pur », « mémorial », « offrande par le feu » et « Yahweh » conviennent au registre cultuel biblique. « Mémorial » préserve le terme technique sans imposer une explication théologique; la note explicite sobrement sa fonction représentative.
  issues:
  - severity: medium
    issue: Formulation française maladroite de l’offrande
    rationale: « Une offrande faite par le feu » peut suggérer qu’elle est produite par le feu. « Offrande par le feu » est à la fois plus idiomatique et plus proche de la catégorie cultuelle אִשֶּׁה.
  - severity: low
    issue: Enchaînement syntaxique de la seconde phrase
    rationale: Le déplacement de « pour le pain » après « mémorial » et l’introduction de deux-points clarifient que l’encens constitue le mémorial relatif aux pains et que ce mémorial est une offrande pour Yahweh.
  revised_text: 'Tu déposeras de l’encens pur sur chaque rangée[a]. Il servira de mémorial pour le pain : une offrande par le feu pour Yahweh[b].'
