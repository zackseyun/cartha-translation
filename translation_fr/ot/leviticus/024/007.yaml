revisions:
- from: Tu déposeras de l’encens pur sur chaque rangée[a]. Il servira, pour le pain, de portion commémorative, une offrande faite par le feu pour Yahweh[b].
  to: 'Tu déposeras de l’encens pur sur chaque rangée[a]. Il servira de mémorial pour le pain : une offrande par le feu pour Yahweh[b].'
  rationale: La révision améliore la syntaxe française et remplace une expression ambiguë par la formulation cultuelle usuelle « offrande par le feu », sans modifier le sens ni lever l’ambiguïté inhérente au vocabulaire sacrificiel. Les deux ancres et leurs notes sont conservées.
