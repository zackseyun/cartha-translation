  text: וְ/נָתַתָּ֥ עַל הַֽ/מַּעֲרֶ֖כֶת לְבֹנָ֣ה זַכָּ֑ה וְ/הָיְתָ֤ה לַ/לֶּ֨חֶם֙ לְ/אַזְכָּרָ֔ה אִשֶּׁ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/007.yaml
  text: And you shall put pure frankincense on each row[a], and it shall be for the bread as a memorial portion[b], a food offering to Yahweh.
translation:
  language: fr
  text: 'Tu déposeras de l’encens pur sur chaque rangée[a]. Il servira de mémorial pour le pain : une offrande par le feu pour Yahweh[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sur la disposition ordonnée » ; dans ce contexte, il s’agit des deux rangées de pains.'
    reason: lexical_alternative
  - marker: b
    text: L’encens était brûlé comme portion représentative des pains.
    reason: cultic_clarification
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Tu déposeras
  rationale: Dans cette instruction rituelle, le parfait avec waw exprime un commandement. Le futur français convient au style législatif, et « déposer » rend naturellement l’idée de placer l’encens sur les pains.
- source_word: עַל הַמַּעֲרֶכֶת
  choice: sur chaque rangée
  rationale: מַעֲרֶכֶת désigne une disposition ordonnée. Le contexte immédiat mentionne deux rangées de pains ; le singulier a donc ici une valeur distributive.
- source_word: לְבֹנָה זַכָּה
  choice: de l’encens pur
  rationale: לְבֹנָה désigne l’oliban, couramment appelé « encens » en français biblique, et זַכָּה en précise la pureté requise pour le rite.
- source_word: וְהָיְתָה לַלֶּחֶם
  choice: Il servira, pour le pain
  rationale: Le pronom français renvoie à l’encens. « Servira » exprime la fonction cultuelle introduite par le verbe être et la préposition לְ.
- source_word: לְאַזְכָּרָה
  choice: de portion commémorative
  rationale: אַזְכָּרָה est un terme sacrificiel désignant la part représentative offerte devant Dieu. « Portion commémorative » garde cette fonction technique sans la réduire à un simple souvenir mental.
- source_word: אִשֶּׁה
  choice: une offrande faite par le feu
  rationale: Dans le vocabulaire sacerdotal, אִשֶּׁה désigne une offrande présentée par combustion. Cette formulation française conserve le lien explicite avec le feu sans supposer que le mot signifie simplement « nourriture ».
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition marque ici le destinataire de l’offrande. Le nom divin יהוה est transcrit « Yahweh » afin de préserver le nom propre présent dans le texte hébreu.
theological_decisions:
- issue: Sens cultuel de לְאַזְכָּרָה
  choice: portion commémorative
  alternative: mémorial
  rationale: Le terme désigne ici l’encens brûlé comme part représentative des pains. La traduction choisie conserve la dimension de commémoration devant Dieu sans préciser indûment le mécanisme théologique de ce mémorial.
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre יהוה ; sa transcription permet de le distinguer du titre אֲדֹנָי et suit l’orientation fournie pour ce projet.
translation_notes:
  register: Français international moderne, clair et digne. Le futur simple maintient le ton prescriptif des instructions rituelles. « Encens » est plus immédiatement compréhensible que « oliban », tandis que les termes techniques nécessaires sont expliqués sans développer une interprétation confessionnelle.
