  text: מִ/חוּץ֩ לְ/פָרֹ֨כֶת הָ/עֵדֻ֜ת בְּ/אֹ֣הֶל מוֹעֵ֗ד יַעֲרֹךְ֩ אֹת֨/וֹ אַהֲרֹ֜ן מֵ/עֶ֧רֶב עַד בֹּ֛קֶר לִ/פְנֵ֥י יְהוָ֖ה תָּמִ֑יד חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/003.yaml
  text: Outside the veil of the testimony[a], in the tent of meeting, Aaron shall arrange it from evening until morning before Yahweh continually[c][b]. It is a permanent statute throughout your generations.
translation:
  language: fr
  text: À l’extérieur du voile du Témoignage[a], dans la tente de la Rencontre, Aaron la disposera du soir au matin devant Yahweh, continuellement[b]. C’est une prescription permanente[c] dans toutes vos générations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du rideau du Témoignage ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « continuellement » désigne l’observance régulière du rite, accomplie « du soir au matin ».
    reason: cultural_note
  - marker: c
    text: Ou « une prescription perpétuelle » ou « une prescription pour toujours ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִחוּץ לְפָרֹכֶת הָעֵדֻת
  choice: À l’extérieur du voile du Témoignage
  rationale: La tournure indique une position hors du voile intérieur. « Voile » convient au contexte du sanctuaire, et « Témoignage » conserve le terme cultuel sans l’expliciter davantage.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: Rendu français courant et précis de la désignation du sanctuaire mobile où Yahweh rencontre Israël.
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: la disposera
  rationale: Le verbe ערך signifie mettre en ordre ou disposer dans ce contexte rituel. Le pronom féminin français reprend naturellement « la lampe » du verset précédent, bien que le pronom hébreu soit grammaticalement masculin.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: du soir au matin
  rationale: Expression française naturelle qui conserve exactement la durée indiquée.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » préserve l’expression cultuelle de présence, tandis que le nom divin est translittéré Yahweh.
- source_word: תָּמִיד
  choice: continuellement
  rationale: Le mot exprime ici la continuité régulière de l’observance, encadrée par la précision « du soir au matin ».
- source_word: חֻקַּת עוֹלָם
  choice: une prescription permanente
  rationale: « Prescription » convient à une règle cultuelle imposée; « permanente » exprime sa durée sans trancher au-delà de la formule hébraïque.
- source_word: לְדֹרֹתֵיכֶם
  choice: pour toutes vos générations
  rationale: Cette formulation idiomatique exprime l’application de la prescription à la succession des générations.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin lui-même; sa translittération préserve sa fonction de nom propre plutôt que de lui substituer un titre.
- issue: Portée de תָּמִיד
  choice: continuellement
  alternative: régulièrement
  rationale: « Continuellement » conserve la force du terme tout en laissant « du soir au matin » préciser la forme concrète de cette continuité rituelle.
- issue: Durée de חֻקַּת עוֹלָם
  choice: prescription permanente
  alternative: prescription perpétuelle
  rationale: « Permanente » rend la force durable de עוֹלָם en français actuel, sans résoudre artificiellement les questions théologiques relatives à la portée de l’ordonnance.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit de près l’ordre hébreu tout en restant naturelle. Les termes cultuels « voile », « Témoignage » et « tente de la rencontre » sont conservés sans paraphrase doctrinale.
