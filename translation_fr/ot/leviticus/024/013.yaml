lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Alors … parla
  rationale: Le waw consécutif fait progresser le récit. « Alors » exprime naturellement la succession, et « parla » rend דבר tout en préparant l’énoncé qui suit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֶל־מֹשֶׁה
  choice: à Moïse
  rationale: Cette formulation française courante rend directement la préposition אֶל et le nom מֹשֶׁה.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Dans cette formule introductive, l’infinitif « disant » serait peu naturel en français moderne. « En ces termes » annonce clairement les paroles rapportées au verset suivant sans en préciser d’avance le contenu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le tétragramme, nom propre divin. La translittération préserve cette donnée du texte source sans la remplacer par un titre.
translation_notes:
  register: Français international moderne, simple et digne. La tournure conserve la formule solennelle d’introduction du discours tout en évitant le calque peu idiomatique « disant ».
