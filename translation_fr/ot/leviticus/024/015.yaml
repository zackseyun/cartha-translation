  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר אִ֥ישׁ אִ֛ישׁ כִּֽי יְקַלֵּ֥ל אֱלֹהָ֖י/ו וְ/נָשָׂ֥א חֶטְאֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/015.yaml
  text: And you shall speak to the sons of Israel, saying, ‘If any man curses his God, then he shall bear his sin.
translation:
  language: fr
  text: 'Tu parleras aux Israélites[a] en disant : « Si un homme maudit son Dieu, il portera son péché[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils d’Israël » ; l’expression désigne collectivement le peuple d’Israël.'
    reason: lexical_alternative
  - marker: b
    text: « Porter son péché » est une expression hébraïque qui signifie en assumer la culpabilité ou la responsabilité.
    reason: idiom_clarification
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל
  choice: Tu parleras aux Israélites
  rationale: La conjonction hébraïque assure ici la continuité du discours sans exiger un « et » initial en français. « Israélites » désigne naturellement l’ensemble des בְּנֵי יִשְׂרָאֵל, littéralement les « fils d’Israël ».
- source_word: תְּדַבֵּר לֵ/אמֹר
  choice: en disant
  rationale: La tournure conserve la formule introductive de citation tout en restant naturelle dans un texte juridique français.
- source_word: אִישׁ אִישׁ
  choice: un homme
  rationale: 'La répétition hébraïque a une valeur distributive : tout homme pris individuellement. Dans la proposition conditionnelle française, « si un homme » en communique naturellement la force tout en conservant le sujet masculin singulier du texte.'
- source_word: כִּי
  choice: si
  rationale: Dans cette formulation juridique, כִּי introduit le cas envisagé et se rend naturellement par une condition.
- source_word: יְקַלֵּל
  choice: maudit
  rationale: Le piel de קלל signifie ici maudire ou traiter avec mépris. « Maudit » conserve le sens direct sans anticiper le délit plus précisément formulé au verset suivant.
- source_word: אֱלֹהָיו
  choice: son Dieu
  rationale: Le possessif est expressément présent dans l’hébreu. La traduction ne le remplace ni par « Dieu » seul ni par le nom divin.
- source_word: וְ/נָשָׂא חֶטְאוֹ
  choice: il portera son péché
  rationale: La formulation maintient l’image juridique hébraïque de porter son péché, qui peut englober la culpabilité et la responsabilité qui en découle, sans réduire silencieusement cette expression à la seule peine.
theological_decisions:
- issue: Portée de אֱלֹהָיו
  choice: son Dieu
  alternative: l’Éternel ; Dieu
  rationale: Le possessif et le terme générique sont conservés, car ce verset ne formule pas encore l’infraction particulière concernant le Nom exposée au verset suivant.
- issue: Sens de « porter son péché »
  choice: Conserver l’expression dans le texte et en expliciter la portée en note
  alternative: porter sa culpabilité ; subir la peine de son péché ; répondre de son péché
  rationale: L’idiome peut évoquer à la fois la culpabilité contractée et la responsabilité ou les conséquences correspondantes. La traduction évite de trancher plus étroitement que l’hébreu.
- issue: Sujet juridique distributif
  choice: si un homme
  alternative: si quelqu’un ; quiconque
  rationale: Cette formulation rend la portée distributive de אִישׁ אִישׁ tout en conservant sa forme masculine singulière.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur simple maintient le ton normatif de la prescription légale. La citation est introduite de manière fluide, sans archaïsmes inutiles.
