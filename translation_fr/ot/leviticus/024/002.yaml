source:
  edition: WLC
  text: צַ֞ו אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֨וּ אֵלֶ֜י/ךָ שֶׁ֣מֶן זַ֥יִת זָ֛ךְ כָּתִ֖ית לַ/מָּא֑וֹר לְ/הַעֲלֹ֥ת נֵ֖ר תָּמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/002.yaml
  text: Command the sons of Israel that they bring to you pure oil of beaten olives for the light[b][a], to keep a lamp burning continually.
translation:
  language: fr
  text: Ordonne aux fils d’Israël[a] de t’apporter de l’huile d’olive pure, obtenue à partir d’olives pilées[b], pour l’éclairage, afin d’entretenir continuellement une lampe allumée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux Israélites » ou « au peuple d’Israël ». L’hébreu dit littéralement « aux fils d’Israël », désignation collective conventionnelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « de l’huile d’olive pure, issue d’olives broyées ». L’hébreu qualifie l’huile de pure et indique un procédé de concassage ou de broyage.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: Ordonne
  rationale: L’impératif de צוה introduit un ordre direct. « Ordonne » en conserve clairement l’autorité.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: Cette formulation rend littéralement la désignation conventionnelle et collective « fils d’Israël », tout en signalant en note les équivalents français plus idiomatiques.
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: de t’apporter
  rationale: Bien que לקח signifie couramment « prendre », la construction avec « vers toi » exprime ici l’action d’apporter ou de fournir quelque chose au destinataire.
- source_word: שֶׁמֶן זַיִת זָךְ כָּתִית
  choice: de l’huile d’olive pure, obtenue à partir d’olives pilées
  rationale: Cette formulation naturelle en français conserve la matière première, la pureté de l’huile et le procédé indiqué par כָּתִית.
- source_word: לַמָּאוֹר
  choice: pour l’éclairage
  rationale: « Pour l’éclairage » exprime naturellement la fonction de l’huile sans identifier מָאוֹר au porte-lampes lui-même.
- source_word: לְהַעֲלֹת נֵר
  choice: afin de maintenir […] une lampe allumée
  rationale: L’expression hébraïque signifie faire brûler ou entretenir une lampe. Cette traduction idiomatique communique la fonction durable précisée par תָּמִיד.
- source_word: תָּמִיד
  choice: constamment
  rationale: Dans ce contexte cultuel, le mot indique la continuité ou la régularité durable du service de la lampe; « constamment » préserve cette portée sans la préciser excessivement.
theological_decisions:
- issue: Désignation collective genrée בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / le peuple d’Israël
  rationale: Le texte hébreu emploie littéralement une expression masculine plurielle devenue une désignation collective d’alliance. Le texte principal en garde la forme, tandis que la note évite de laisser entendre qu’elle exclut nécessairement le reste du peuple.
- issue: Portée de תָּמִיד dans le service cultuel
  choice: constamment
  alternative: régulièrement
  rationale: Le terme peut décrire une continuité aussi bien qu’un service régulier et récurrent. « Constamment » suit la formulation directe du verset sans développer ici les modalités précisées par le contexte voisin.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’ordre hébreu, mais les expressions idiomatiques « apporter » et « maintenir une lampe allumée » évitent un calque obscur. L’apostrophe typographique et les formulations lexicales sont adaptées à une publication biblique courante.
