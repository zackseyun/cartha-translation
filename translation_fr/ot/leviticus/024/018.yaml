  text: וּ/מַכֵּ֥ה נֶֽפֶשׁ בְּהֵמָ֖ה יְשַׁלְּמֶ֑/נָּה נֶ֖פֶשׁ תַּ֥חַת נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/018.yaml
  text: 'And whoever strikes down an animal shall make restitution for it: life for life[a].'
translation:
  language: fr
  text: 'Celui qui tue un animal devra le remplacer : vie pour vie[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « vie pour vie ». Dans ce contexte de restitution pour un animal, cette formule exprime une compensation équivalente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַכֵּה נֶפֶשׁ בְּהֵמָה
  choice: Celui qui tue un animal
  rationale: Le participe hiphil de נכה énonce ici un cas juridique général. Avec נֶפֶשׁ בְּהֵמָה comme objet, l’action est mortelle ; « tue un animal » exprime ce sens naturellement en français sans suggérer une simple blessure.
- source_word: בְּהֵמָה
  choice: un animal
  rationale: Le terme désigne ici un animal, dans un contexte de bien possédé. « Animal » reste général et correspond à la formulation de la loi.
- source_word: יְשַׁלְּמֶנָּה
  choice: devra le remplacer
  rationale: Au piel, שלם exprime la compensation ou la restitution. Dans ce contexte précis, le suffixe féminin renvoie à l’animal ; « le remplacer » rend clairement l’obligation de fournir une compensation équivalente, sans la réduire explicitement à une somme d’argent.
- source_word: נֶפֶשׁ תַּחַת נָפֶשׁ
  choice: vie pour vie
  rationale: Cette formule concise conserve le parallélisme juridique hébreu et son ambiguïté quant au mécanisme exact de la compensation.
theological_decisions:
- issue: Portée de la formule de compensation dans une loi concernant un animal
  choice: Conserver « vie pour vie » tout en faisant comprendre que l’auteur du dommage doit remplacer l’animal tué.
  alternative: Comprendre la formule comme l’exigence plus précise de livrer nécessairement un autre animal, ou comme une compensation monétaire ou matérielle équivalente.
  rationale: Le verbe שלם impose une restitution, mais le texte ne précise pas davantage sa modalité. La traduction garde donc la formule hébraïque sans importer un mécanisme juridique particulier.
translation_notes:
  register: Français moderne, clair et digne, avec la tournure juridique « devra ». « Tue » évite l’ambiguïté française de « frappe », qui pourrait évoquer une blessure non mortelle ; « remplacer » rend idiomatiquement la restitution exigée.
