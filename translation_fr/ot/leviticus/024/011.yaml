  text: וַ֠/יִּקֹּב בֶּן הָֽ/אִשָּׁ֨ה הַ/יִּשְׂרְאֵלִ֤ית אֶת הַ/שֵּׁם֙ וַ/יְקַלֵּ֔ל וַ/יָּבִ֥יאוּ אֹת֖/וֹ אֶל מֹשֶׁ֑ה וְ/שֵׁ֥ם אִמּ֛/וֹ שְׁלֹמִ֥ית בַּת דִּבְרִ֖י לְ/מַטֵּה דָֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/011.yaml
  text: The son of the Israelite woman blasphemed the Name and cursed[a], and they brought him to Moses. Now his mother's name was Shelomith daughter of Dibri, of the tribe of Dan.
translation:
  language: fr
  text: Le fils de la femme israélite prononça distinctement le Nom, puis le maudit[a]. On l’amena à Moïse. Sa mère s’appelait Shelomith, fille de Dibri, de la tribu de Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « blasphéma le Nom et le maudit ». Le verbe hébreu peut signifier « prononcer distinctement » ou, dans ce contexte, désigner l’acte de blasphémer.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקֹּב
  choice: prononça distinctement
  rationale: Le verbe נקב peut exprimer l’action de désigner ou d’énoncer explicitement. Avec « le Nom », puis le verbe distinct וַיְקַלֵּל, cette formulation préserve la succession des deux actes sans réduire le premier d’emblée à « blasphémer ».
- source_word: אֶת הַשֵּׁם
  choice: le Nom
  rationale: Dans ce contexte, l’expression définie désigne avec révérence le nom divin. La majuscule le signale sans introduire le tétragramme dans le texte.
- source_word: וַיְקַלֵּל
  choice: puis proféra une malédiction
  rationale: Le piel de קלל signifie couramment « maudire ». Cette tournure est naturelle en français lorsque l’objet de la malédiction n’est pas explicitement répété en hébreu, et « puis » rend clairement la succession narrative.
- source_word: וַיָּבִיאוּ אֹתוֹ אֶל מֹשֶׁה
  choice: On l’amena à Moïse
  rationale: Le pluriel hébreu a un sujet non précisé. Le pronom indéfini « on » rend naturellement cette indétermination en français.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sa mère s’appelait
  rationale: Formulation française courante et concise pour l’information généalogique introduite en incise par l’hébreu.
- source_word: שְׁלֹמִית בַּת דִּבְרִי
  choice: Shelomith, fille de Dibri
  rationale: Les noms propres sont translittérés et la filiation est rendue directement.
- source_word: לְמַטֵּה דָן
  choice: de la tribu de Dan
  rationale: Cette expression idiomatique indique l’appartenance tribale.
theological_decisions:
- issue: Sens de נקב devant « le Nom » dans un contexte de blasphème
  choice: Le rendre par l’énonciation explicite du Nom, suivie d’une malédiction distincte.
  alternative: « blasphéma le Nom et proféra une malédiction »
  rationale: L’hébreu emploie deux verbes, נקב et קלל. Les distinguer conserve l’ambiguïté lexicale du premier ainsi que la tension juridique et théologique du récit, sans préciser au-delà du texte la forme exacte de la malédiction.
translation_notes:
  register: Français international moderne, clair et digne. « Le Nom » conserve la désignation révérencielle; « On l’amena » rend naturellement le sujet pluriel non exprimé; la note maintient ouverte l’ambiguïté de נקב.
