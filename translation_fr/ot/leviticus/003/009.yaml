source:
  edition: WLC
  text: וְ/הִקְרִ֨יב מִ/זֶּ֣בַח הַ/שְּׁלָמִים֮ אִשֶּׁ֣ה לַ/יהוָה֒ חֶלְבּ/וֹ֙ הָ/אַלְיָ֣ה תְמִימָ֔ה לְ/עֻמַּ֥ת הֶ/עָצֶ֖ה יְסִירֶ֑/נָּה וְ/אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/009.yaml
  text: 'And from the sacrifice of peace offerings he shall present an offering made by fire to Yahweh: its fat[a], the whole fat tail, which he shall remove close to the backbone, and the fat that covers the entrails, and all the fat that is on the entrails[c][b],'
translation:
  language: fr
  text: 'Du sacrifice de communion[a], il présentera à Yahvé une offrande consumée par le feu : sa graisse, la queue grasse tout entière[b], qu’il détachera près de la colonne vertébrale[c], ainsi que la graisse qui recouvre les entrailles et toute la graisse qui se trouve sur elles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « sacrifice de paix » ou « sacrifice de bien-être ».'
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de la large queue riche en graisse de certaines races de moutons offertes en sacrifice.
    reason: cultural_note
  - marker: c
    text: 'Ou : « en face de la colonne vertébrale » ou « à la base de l’épine dorsale ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח הַשְּׁלָמִים
  choice: sacrifice de communion
  rationale: Dans ce contexte rituel, שְׁלָמִים désigne une catégorie de sacrifice associée à la paix, au bien-être et à la communion. « Sacrifice de communion » est naturel en français et évoque le repas partagé propre à cette offrande, sans réduire le terme à une seule nuance.
- source_word: אִשֶּׁה
  choice: offrande consumée par le feu
  rationale: Le terme désigne une offrande destinée à l’autel et livrée au feu. Cette formulation française exprime clairement le procédé rituel sans suggérer qu’il s’agit d’une nourriture humaine ordinaire.
- source_word: לַיהוָה
  choice: à Yahvé
  rationale: Le texte hébreu porte explicitement le nom divin יהוה. « Yahvé » est la forme française courante qui représente ce nom propre plutôt que de le remplacer par un titre.
- source_word: חֶלְבּוֹ
  choice: sa graisse
  rationale: Le possessif hébreu renvoie à l’animal offert, et la suite précise les parties grasses réservées à l’autel.
- source_word: הָאַלְיָה תְמִימָה
  choice: la queue grasse tout entière
  rationale: אַלְיָה désigne la large queue adipeuse de certaines races ovines, et תְמִימָה précise qu’elle doit être prélevée entière.
- source_word: לְעֻמַּת הֶעָצֶה
  choice: près de la colonne vertébrale
  rationale: La préposition décrit le point où la queue est détachée par rapport à l’épine dorsale. La formulation reste lisible tout en signalant cette relation anatomique.
- source_word: יְסִירֶנָּה
  choice: qu’il détachera
  rationale: Le hiphil de סור exprime ici l’action d’enlever ou de retirer la queue de l’animal. « Détacher » convient naturellement au geste anatomique décrit.
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: la graisse qui recouvre les entrailles
  rationale: Dans ce contexte sacrificiel, קֶרֶב désigne les organes internes ou entrailles. La traduction conserve l’image concrète de la graisse qui les enveloppe.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: toute la graisse qui se trouve sur elles
  rationale: Cette formulation maintient la distinction entre la graisse qui recouvre les entrailles et l’ensemble de celle qui y est attachée, tout en évitant une répétition française trop lourde.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte présente le Tétragramme comme un nom propre. « Yahvé » le rend directement en français et permet au lecteur de reconnaître le nom divin, tandis que « le SEIGNEUR » représente la tradition de substitution à la lecture.
- issue: Portée de שְׁלָמִים
  choice: sacrifice de communion
  alternative: sacrifice de paix / sacrifice de bien-être
  rationale: Le terme peut évoquer paix, intégrité, bien-être et communion. Le texte ne permet pas d’isoler une seule de ces nuances; la traduction principale retient l’appellation rituelle française « sacrifice de communion », et la note préserve les autres possibilités.
translation_notes:
  register: Français international moderne, digne et concret. La syntaxe suit l’énumération rituelle de l’hébreu tout en restant fluide. Les termes anatomiques sont compréhensibles sans technicité excessive, et les ambiguïtés lexicales réelles sont conservées dans les notes.
