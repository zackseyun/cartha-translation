  edition: WLC
  text: וְ/הִקְטִירָ֥/ם הַ/כֹּהֵ֖ן הַ/מִּזְבֵּ֑חָ/ה לֶ֤חֶם אִשֶּׁה֙ לְ/רֵ֣יחַ נִיחֹ֔חַ כָּל חֵ֖לֶב לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/016.yaml
  text: And the priest shall burn them on the altar as food[a], an offering made by fire for a pleasing aroma[c][b]. All the fat belongs to Yahweh.
translation:
  language: fr
  text: Le prêtre les fera brûler sur l’autel comme nourriture[a], une offrande consumée par le feu, à l’odeur agréable[b]. Toute la graisse est pour Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme offrande de nourriture »; littéralement « nourriture d’une offrande consumée par le feu ».
    reason: lexical_alternative
  - marker: b
    text: Ou « à l’odeur apaisante » ou « à l’odeur plaisante ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירָם
  choice: Le prêtre les fera brûler
  rationale: Le hifil de קטר désigne ici l’action de brûler les portions sacrificielles sur l’autel afin qu’elles montent en fumée. Le pronom « les » conserve le suffixe masculin pluriel et renvoie aux portions mentionnées dans le contexte.
- source_word: הַמִּזְבֵּחָה
  choice: sur l’autel
  rationale: Le hé directionnel ou locatif désigne ici naturellement l’autel comme lieu où les portions sont brûlées.
- source_word: לֶחֶם אִשֶּׁה
  choice: comme nourriture, une offrande consumée par le feu
  rationale: לֶחֶם a ici le sens large de « nourriture » plutôt que celui, trop étroit, de « pain ». אִשֶּׁה désigne une offrande livrée au feu; la formulation française conserve les deux éléments sans faire croire qu’il s’agit nécessairement de pain.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: à l’odeur agréable
  rationale: Cette formule sacrificielle exprime une odeur reçue favorablement. La traduction garde l’image concrète et sa valeur cultuelle sans l’expliquer davantage dans le texte.
- source_word: כָּל חֵלֶב
  choice: Toute la graisse
  rationale: כָּל donne une portée globale à חֵלֶב et vise, dans ce contexte, l’ensemble des parties grasses réservées dans le sacrifice.
- source_word: לַיהוָה
  choice: est pour Yahweh
  rationale: La préposition ל marque ici la destination ou la consécration. « Est pour » reste proche de l’hébreu et préserve une légère ouverture entre appartenance et destination cultuelle.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » représente le nom divin plutôt que de le remplacer par un titre.
- issue: Portée de לְרֵיחַ נִיחֹחַ
  choice: à l’odeur agréable
  alternative: à l’odeur apaisante
  rationale: La traduction conserve la métaphore sacrificielle et l’idée d’agrément sans préciser si ניחוח met surtout l’accent sur l’apaisement ou sur le caractère plaisant.
- issue: Sens de לַיהוָה
  choice: Toute la graisse est pour Yahweh
  alternative: Toute la graisse appartient à Yahweh
  rationale: « Est pour » suit plus formellement la construction prépositionnelle et ne tranche pas inutilement entre destination sacrificielle, consécration et appartenance.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve le vocabulaire sacrificiel concret tout en évitant l’archaïsme « mets ». La ponctuation clarifie l’apposition entre « nourriture » et « offrande consumée par le feu ».
