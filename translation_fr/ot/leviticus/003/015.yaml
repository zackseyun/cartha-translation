  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys[b], he shall remove.
translation:
  language: fr
  text: 'les deux reins, la graisse qui les recouvre et qui se trouve sur les lombes, et l’appendice sur le foie[a] : il l’enlèvera avec les reins[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le lobe du foie ». Le terme hébreu désignant cette partie anatomique est incertain.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sur les reins ». Ici, l’expression signifie probablement que cette partie est enlevée avec les reins.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: les deux reins
  rationale: L’expression désigne sans ambiguïté les deux reins dans l’anatomie sacrificielle.
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵהֶן
  choice: la graisse qui les recouvre
  rationale: חֵלֶב désigne ici la graisse réservée au sacrifice; «recouvre» rend naturellement la relation spatiale exprimée par עַל sans suggérer toute la graisse de l’animal.
- source_word: אֲשֶׁר עַל הַכְּסָלִים
  choice: celle qui est sur les lombes
  rationale: כְּסָלִים renvoie à la région des lombes ou des flancs; «lombes» conserve le repère anatomique traditionnel.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: l’appendice du foie
  rationale: Le référent anatomique précis de יֹתֶרֶת est incertain. «Appendice» exprime une partie saillante associée au foie sans identification moderne trop précise.
- source_word: עַל הַכְּלָיֹת
  choice: avec les reins
  rationale: Dans cette formule rituelle, la préposition indique vraisemblablement que cette partie doit être retirée en même temps que les reins; une note conserve le sens spatial littéral.
- source_word: יְסִירֶנָּה
  choice: il l’enlèvera
  rationale: Le hiphil de סור exprime ici l’action prescrite de retirer cette partie; le futur français convient au registre juridique du passage.
