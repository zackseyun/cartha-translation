  register: Français international moderne, digne et clair. La phrase reste un fragment coordonné à la prescription commencée aux versets précédents. La ponctuation met en évidence que le pronom singulier de «il l’enlèvera» renvoie à l’appendice du foie, tandis que les autres éléments appartiennent à la liste.
