id: LEV.3.12
reference: Leviticus 3:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִ֥ם עֵ֖ז קָרְבָּנ֑/וֹ וְ/הִקְרִיב֖/וֹ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/012.yaml
  text: But if his offering is a goat[a], then he shall present it before Yahweh.
translation:
  language: fr
  text: Si son offrande est une chèvre, il la présentera devant Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, le nom divin, traditionnellement rendu par « le SEIGNEUR »; autre forme : « Yahvé ».'
    reason: Signaler la forme hébraïque et les principaux usages de traduction du nom divin.
lexical_decisions:
- source_word: וְאִם
  choice: Si
  rationale: La conjonction suivie de la condition introduit un nouveau cas dans la série d’instructions. En français, « Si » suffit naturellement, sans créer un contraste plus marqué que l’hébreu.
- source_word: עֵז
  choice: une chèvre
  rationale: Le nom désigne une chèvre. L’article indéfini est nécessaire en français, et le singulier correspond à l’hébreu.
- source_word: קָרְבָּנוֹ
  choice: son offrande
  rationale: קָרְבָּן est un terme général pour ce qui est apporté et présenté à Dieu. « Offrande » conserve cette portée mieux que le terme plus étroit « sacrifice ».
- source_word: וְהִקְרִיבוֹ
  choice: il la présentera
  rationale: Le hiphil de קרב signifie faire approcher ou présenter, ici dans un contexte sacrificiel. Le futur français rend naturellement la valeur prescriptive de la forme verbale.
- source_word: לִפְנֵי
  choice: devant
  rationale: Ce terme exprime ici la présentation dans la présence de Yahweh; « devant » est à la fois concis, idiomatique et fidèle au langage cultuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » préserve le nom divin personnel exprimé par le tétragramme, au lieu de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » en préserve la fonction de nom propre, tandis que la note signale l’usage traditionnel français.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la structure conditionnelle et le vocabulaire cultuel sans lourdeur archaïque. Le pronom féminin « la » reprend naturellement « une chèvre ».
