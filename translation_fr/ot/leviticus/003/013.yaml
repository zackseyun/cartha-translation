  yaml_path: translation/ot/leviticus/003/013.yaml
  text: And he shall lay his hand on its head and slaughter it before the tent of meeting[a], and the sons of Aaron shall throw its blood against the altar all around.
translation:
  language: fr
  text: Il posera sa main sur la tête de l’animal et l’égorgera devant la tente de la Rencontre, et les fils d’Aaron projetteront[a] son sang contre l’autel, tout autour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aspergeront l’autel de son sang tout autour ». Le verbe hébreu désigne ici la projection du sang sur l’autel et peut être rendu de plusieurs façons.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת־יָדוֹ
  choice: Il posera sa main
  rationale: « Poser sa main » rend naturellement le geste rituel exprimé par סמך יד, tout en conservant le singulier explicite de יָדוֹ.
- source_word: עַל־רֹאשׁוֹ
  choice: sur la tête de l’animal
  rationale: Le suffixe renvoie à l’animal offert. La formulation explicite le référent en français et évite que « sa tête » soit momentanément compris comme celle de l’offrant.
- source_word: וְשָׁחַט אֹתוֹ
  choice: et l’égorgera
  rationale: Dans ce contexte sacrificiel, שׁחט désigne l’abattage par égorgement. « Égorge » est précis, courant et plus rituellement spécifique que « tue ».
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: devant la tente de la rencontre
  rationale: « Devant » conserve le sens spatial de לִפְנֵי. « Tente de la rencontre » rend le nom cultuel אֹהֶל מוֹעֵד de façon transparente et digne en français moderne.
- source_word: וְזָרְקוּ
  choice: projetteront
  rationale: זרק décrit ici l’application du sang à l’autel par un mouvement de projection. « Projetteront » restitue cette action sans la confondre d’emblée avec les gestes que d’autres verbes hébreux peuvent exprimer.
- source_word: בְּנֵי אַהֲרֹן
  choice: les fils d’Aaron
  rationale: Cette formulation conserve la désignation sacerdotale et la relation de filiation exprimées par le construit hébreu.
- source_word: אֶת־דָּמוֹ
  choice: son sang
  rationale: Le suffixe renvoie à l’animal sacrifié ; « son sang » est la tournure française naturelle.
- source_word: עַל־הַמִּזְבֵּחַ סָבִיב
  choice: contre l’autel, tout autour
  rationale: Avec זרק, « contre l’autel » exprime une application dirigée vers ses côtés. « Tout autour » conserve la portée distributive de סָבִיב.
