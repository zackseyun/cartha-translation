base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/010.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: fr
  text: ainsi que les deux reins, la graisse qui est sur eux, celle qui est sur les lombes, et l’appendice[a] qui est sur le foie, qu’il enlèvera avec les reins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le lobe qui est sur le foie ». Le terme hébreu désignant cette partie anatomique (יֹתֶרֶת) est incertain ; « appendice » évite de donner une précision excessive.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: les deux reins
  rationale: Le terme désigne clairement les reins dans l’anatomie sacrificielle.
- source_word: הַחֵלֶב
  choice: la graisse
  rationale: Dans ce contexte lévitique, le mot désigne la graisse interne réservée à l’offrande; « graisse » est le terme français courant et précis sans technicité excessive.
- source_word: אֲשֶׁר עֲלֵהֶן
  choice: qui les recouvre
  rationale: Cette formulation naturelle exprime la position de la graisse sur les reins tout en conservant le lien de la proposition relative.
- source_word: הַכְּסָלִים
  choice: les lombes
  rationale: Le mot désigne la région des lombes ou des flancs; « lombes » convient au registre anatomique et rituel du passage.
- source_word: הַיֹּתֶרֶת
  choice: l’appendice
  rationale: L’identification anatomique exacte est incertaine. « Appendice » préserve cette incertitude mieux que « lobe », plus spécifique.
- source_word: עַל הַכָּבֵד
  choice: qui est sur le foie
  rationale: La formulation conserve la relation spatiale large exprimée par עַל sans préciser indûment que cette partie serait fixée au foie.
- source_word: עַל הַכְּלָיֹת יְסִירֶנָּה
  choice: qu’il enlèvera avec les reins
  rationale: Dans cette formule sacrificielle, la préposition associe l’ablation de l’appendice à celle des reins, et le hiphil de סור signifie « enlever ».
