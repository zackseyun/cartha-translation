  text: וְ/הִקְטִיר֥/וֹ הַ/כֹּהֵ֖ן הַ/מִּזְבֵּ֑חָ/ה לֶ֥חֶם אִשֶּׁ֖ה לַ/יהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/011.yaml
  text: The priest shall burn it on the altar as food[a], an offering made by fire to Yahweh.
translation:
  language: fr
  text: 'Le prêtre le fera brûler sur l’autel : c’est la nourriture d’une offrande par le feu pour Yahweh[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du pain d’une offrande par le feu pour Yahweh ». Ici, « pain » désigne de manière imagée la nourriture offerte sur l’autel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירוֹ
  choice: le fera fumer
  rationale: Le hifil de קטר désigne, dans le contexte sacrificiel, l’action de brûler une offrande sur l’autel pour la faire monter en fumée. « Le fera fumer » conserve cette nuance tout en restant naturel en français.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Équivalent français courant de כֹּהֵן dans le contexte cultuel.
- source_word: הַמִּזְבֵּחָה
  choice: sur l’autel
  rationale: Le hé directionnel associé à l’autel se rend naturellement par « sur l’autel », lieu où la part sacrificielle est brûlée.
- source_word: לֶחֶם
  choice: une nourriture
  rationale: Bien que לֶחֶם signifie souvent « pain », le terme désigne ici, par idiome sacrificiel, la nourriture ou part offerte sur l’autel. La note conserve le sens littéral.
- source_word: אִשֶּׁה
  choice: une offrande consumée par le feu
  rationale: Ce terme sacrificiel technique désigne une offrande présentée au moyen du feu. « Consumée par le feu » exprime clairement le procédé rituel sans imposer une étymologie incertaine.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל marque ici la destination ou la dédicace de l’offrande; « pour » est idiomatique en français. Le nom divin est rendu par « Yahweh » conformément à la couche de consultation fournie.
theological_decisions:
- issue: Sens de l’expression sacrificielle לֶחֶם אִשֶּׁה
  choice: une nourriture, une offrande consumée par le feu
  alternative: le pain d’une offrande consumée par le feu
  rationale: La formulation principale communique l’idiome cultuel sans laisser entendre qu’il s’agit nécessairement de pain matériel ni que Dieu aurait physiquement besoin de nourriture. La note signale néanmoins la forme littérale et préserve l’image du texte hébreu.
translation_notes:
  register: Français moderne, international et digne. La formulation suit de près la syntaxe hébraïque tout en explicitant naturellement l’idiome sacrificiel; « faire fumer » conserve la nuance propre au verbe cultuel.
