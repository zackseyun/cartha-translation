language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִקְרִיב֙ מִ/זֶּ֣בַח הַ/שְּׁלָמִ֔ים אִשֶּׁ֖ה לַ/יהוָ֑ה אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/003.yaml
  text: And from the sacrifice of peace offerings he shall present as a food offering to Yahweh the fat that covers the entrails[a], and all the fat that is on the entrails,
translation:
  language: fr
  text: 'Du sacrifice de communion[b], il présentera à Yahweh une offrande consumée par le feu[a] : la graisse qui recouvre les entrailles et toute la graisse qui se trouve sur les entrailles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « offrande faite par le feu »; le terme peut aussi être compris comme un mets offert à Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « sacrifice de paix » ou « sacrifice de bien-être ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: il présentera
  rationale: Le hifil de קרב désigne ici l’acte rituel de présenter une offrande. « Présentera » conserve cette valeur sans imposer une répétition inutile du verbe « offrir ».
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: du sacrifice de communion
  rationale: זֶבַח désigne un sacrifice avec abattage, et שְׁלָמִים une catégorie sacrificielle associée à la paix, au bien-être et à la communion. « Sacrifice de communion » exprime naturellement en français la dimension de repas partagé, tandis qu’une note conserve les autres rendus possibles.
- source_word: אִשֶּׁה
  choice: une offrande consumée par le feu
  rationale: Dans la législation sacerdotale, אִשֶּׁה désigne une offrande livrée au feu de l’autel. Ce rendu est clair, concret et évite de trancher en faveur de la seule interprétation « nourriture offerte ».
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », conformément à sa fonction de nom divin dans le texte hébreu.
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: la graisse qui recouvre les entrailles
  rationale: חֵלֶב désigne les parties grasses réservées au rite; קֶרֶב renvoie ici aux viscères de l’animal. « Entrailles » est précis et naturel dans ce contexte anatomique.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: toute la graisse qui se trouve sur les entrailles
  rationale: La formulation distingue la graisse qui enveloppe les entrailles de l’ensemble de celle qui y adhère. La répétition d’« entrailles » préserve la précision du texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve sa fonction de nom propre sans le remplacer par un titre.
- issue: Sens sacrificiel de אִשֶּׁה
  choice: offrande consumée par le feu
  alternative: mets offert; offrande faite par le feu
  rationale: Le terme est lié aux offrandes placées sur l’autel, mais son sens précis fait l’objet de formulations diverses. Le texte principal met en avant l’action du feu, et la note signale l’interprétation cultuelle comme nourriture offerte à Dieu.
- issue: Valeur de שְׁלָמִים
  choice: sacrifice de communion
  alternative: sacrifice de paix; sacrifice de bien-être
  rationale: Le terme peut évoquer la paix, l’intégrité ou le bien-être, tandis que le rite comporte une dimension de repas partagé. « Communion » convient au contexte sacrificiel sans effacer les autres nuances, indiquées en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase suit l’ordre logique de l’hébreu, avec deux-points pour introduire les parties grasses constituant l’offrande. Le vocabulaire rituel reste précis sans archaïsme.
