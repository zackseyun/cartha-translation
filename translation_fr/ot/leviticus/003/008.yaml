source:
  edition: WLC
  text: וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹ֣אשׁ קָרְבָּנ֔/וֹ וְ/שָׁחַ֣ט אֹת֔/וֹ לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ֠/זָרְקוּ בְּנֵ֨י אַהֲרֹ֧ן אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/008.yaml
  text: He shall lay his hand on the head of his offering and slaughter it before the tent of meeting[a], and Aaron’s sons shall throw its blood against the altar all around.
translation:
  language: fr
  text: Il posera la main sur la tête de son offrande et l’égorgera devant la tente de la Rencontre. Les fils d’Aaron projetteront[a] son sang contre l’autel, tout autour de l’autel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « feront jaillir son sang » ou « lanceront son sang » ; le verbe hébreu désigne une projection énergique du sang dans le cadre du rite, et non une légère aspersion.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: Il posera
  rationale: Dans les instructions sacrificielles, סמך avec « la main sur la tête » désigne le geste rituel consistant à poser ou appuyer la main. « Posera » est naturel et précis sans imposer un degré de pression.
- source_word: יָדוֹ
  choice: la main
  rationale: Le nom singulier avec suffixe masculin singulier signifie littéralement « sa main » ; en français, « il posera la main » exprime naturellement la possession.
- source_word: רֹאשׁ
  choice: la tête
  rationale: Sens anatomique courant dans ce contexte sacrificiel.
- source_word: קָרְבָּנוֹ
  choice: son offrande
  rationale: קָרְבָּן désigne ce qui est présenté ou apporté à Dieu. « Offrande » conserve cette portée générale sans réduire le terme au seul acte d’immolation.
- source_word: וְשָׁחַט
  choice: et l’égorgera
  rationale: שׁחט est le terme technique de l’abattage rituel d’un animal. « Égorger » rend clairement le mode d’immolation dans un français biblique actuel.
- source_word: לִפְנֵי
  choice: devant
  rationale: Rend l’expression spatiale et cultuelle « devant, en présence de » de façon concise et idiomatique.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la Rencontre
  rationale: Rendu établi et transparent du nom du sanctuaire, מוֹעֵד évoquant ici le lieu assigné de rencontre.
- source_word: וְזָרְקוּ
  choice: projetteront
  rationale: זרק décrit une application énergique du sang par un geste de projection. « Projetteront » évite l’idée trop douce d’une simple aspersion.
- source_word: בְּנֵי אַהֲרֹן
  choice: Les fils d’Aaron
  rationale: Le texte hébreu nomme explicitement les fils d’Aaron ; cette formulation en conserve la précision familiale et masculine.
- source_word: דָּמוֹ
  choice: son sang
  rationale: Le suffixe renvoie à l’animal offert. En français, « son sang » est la formulation naturelle, sans ambiguïté dans le contexte.
- source_word: עַל הַמִּזְבֵּחַ
  choice: contre l’autel
  rationale: Avec זרק, « contre l’autel » exprime mieux le sang projeté sur ses surfaces que le simple emplacement « sur l’autel ».
- source_word: סָבִיב
  choice: tout autour
  rationale: Indique que l’application du sang se fait autour de l’autel, sur son pourtour.
theological_decisions:
- issue: Imposition de la main dans le rite sacrificiel
  choice: 'Décrire simplement le geste : « posera la main »'
  alternative: Employer « appuiera la main » ou expliciter un transfert de culpabilité ou une identification
  rationale: Le verset prescrit le geste sans en donner ici l’interprétation théologique. La traduction ne doit donc pas ajouter une signification doctrinale non exprimée.
- issue: Désignation בְּנֵי אַהֲרֹן
  choice: « Les fils d’Aaron »
  alternative: « Les descendants d’Aaron » ou « les prêtres »
  rationale: L’hébreu dit précisément « les fils d’Aaron ». Une généralisation effacerait la formulation et la relation familiale du texte source.
- issue: Nature de l’application rituelle du sang
  choice: « projetteront son sang contre l’autel »
  alternative: « aspergeront l’autel de son sang »
  rationale: Le verbe זרק évoque une projection énergique. « Asperger » pourrait suggérer un geste plus léger ou confondre cette action avec d’autres rites sanguins.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit le déroulement rituel de l’hébreu. « Tente de la Rencontre » est conservé comme désignation cultuelle, et « égorgera » rend concrètement le terme technique de l’immolation.
