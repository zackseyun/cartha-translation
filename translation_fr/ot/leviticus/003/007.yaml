source:
  edition: WLC
  text: אִם כֶּ֥שֶׂב הֽוּא מַקְרִ֖יב אֶת קָרְבָּנ֑/וֹ וְ/הִקְרִ֥יב אֹת֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/007.yaml
  text: If he is presenting a sheep as his offering[a], then he shall present it before Yahweh.
translation:
  language: fr
  text: Si c’est un mouton qu’il présente comme offrande[a], il le présentera devant Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si c’est un agneau qu’il présente comme offrande ».'
    reason: כֶּשֶׂב peut désigner un mouton, notamment un jeune mouton ou un agneau ; cette variante préserve la possibilité lexicale sans préciser indûment l’âge dans le texte principal.
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit le cas conditionnel suivant dans les prescriptions sacrificielles.
- source_word: כֶּשֶׂב
  choice: mouton
  rationale: Le terme désigne un ovin et peut, selon le contexte, se comprendre comme un agneau. « Mouton » conserve ici la portée générale sans préciser indûment l’âge.
- source_word: הוּא מַקְרִיב
  choice: c’est ... qu’il présente
  rationale: La construction française met en relief l’animal, comme le pronom explicite et le participe hébreux, tout en restant naturelle.
- source_word: קָרְבָּנוֹ
  choice: comme offrande
  rationale: קָרְבָּן est le terme général pour ce qui est apporté ou présenté à Dieu; « offrande » convient mieux que le terme plus étroit « sacrifice ».
- source_word: וְהִקְרִיב אֹתוֹ
  choice: il le présentera
  rationale: Dans ce contexte juridique, la forme verbale exprime l’instruction qui découle du cas énoncé. Le pronom renvoie au mouton.
- source_word: לִפְנֵי
  choice: devant
  rationale: Rend directement l’expression spatiale et cultuelle de présentation en présence de Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel tout en employant sa transcription française courante.
translation_notes:
  register: Français moderne, digne et accessible. La tournure clivée restitue naturellement la mise en relief hébraïque; le futur a ici une valeur prescriptive.
