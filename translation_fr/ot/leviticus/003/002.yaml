  text: וְ/סָמַ֤ךְ יָד/וֹ֙ עַל רֹ֣אשׁ קָרְבָּנ֔/וֹ וּ/שְׁחָט֕/וֹ פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/זָרְק֡וּ בְּנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֲנִ֧ים אֶת הַ/דָּ֛ם עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/002.yaml
  text: He shall lay his hand on the head of his offering and slaughter it at the entrance of the tent of meeting[a], and Aaron’s sons, the priests[b], shall throw the blood against the altar all around.
translation:
  language: fr
  text: Il posera la main sur la tête de son offrande et l’égorgera à l’entrée de la tente de la rencontre[a] ; les fils d’Aaron, les prêtres, projetteront[b] le sang contre l’autel, tout autour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à l’ouverture de la tente de la rencontre ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « aspergeront le sang sur l’autel, tout autour ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ יָדוֹ
  choice: Il posera la main
  rationale: Dans le contexte sacrificiel, סמך désigne l’action de poser ou d’appuyer la main sur l’animal. « Poser la main » est naturel en français et laisse ouverte la question du degré de pression.
- source_word: עַל רֹאשׁ קָרְבָּנוֹ
  choice: sur la tête de son offrande
  rationale: Cette formulation conserve le sens concret de רֹאשׁ et le caractère général de קָרְבָּן, sans le réduire au terme plus étroit de « sacrifice ».
- source_word: וּשְׁחָטוֹ
  choice: et l’égorgera
  rationale: Pour un animal sacrificiel, שׁחט désigne la mise à mort par égorgement. Ce verbe français exprime précisément l’action rituelle sans employer le terme générique « tuer ».
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à l’entrée de la tente de la rencontre
  rationale: פֶּתַח désigne l’entrée ou l’ouverture. « Tente de la rencontre » rend אֹהֶל מוֹעֵד de manière transparente et conforme à son rôle de lieu où Dieu rencontre son peuple.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: les fils d’Aaron, les prêtres
  rationale: La tournure préserve l’apposition hébraïque qui identifie les fils d’Aaron comme les prêtres.
- source_word: וְזָרְקוּ
  choice: projetteront
  rationale: זרק décrit ici le geste de lancer ou de projeter le sang. « Projeter » convient au registre rituel et évite « asperger », qui pourrait suggérer une autre modalité d’application.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: contre l’autel, tout autour
  rationale: Avec זרק, « contre l’autel » exprime le mouvement du sang vers ses surfaces; « tout autour » conserve la portée circonférentielle de סָבִיב.
theological_decisions:
- issue: Modalité de l’application rituelle du sang
  choice: projetteront le sang contre l’autel, tout autour
  alternative: aspergeront le sang sur l’autel tout autour
  rationale: Le choix retient le sens usuel de זרק, « lancer/projeter », sans l’assimiler à un geste d’aspersion exprimé ailleurs par un vocabulaire rituel distinct.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche de l’hébreu tout en séparant les deux étapes rituelles en deux phrases pour une lecture naturelle. Aucun terme confessionnel propre à une tradition particulière n’est introduit.
