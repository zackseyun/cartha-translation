  terminology: « Petit bétail », « sacrifice de paix », « Yahweh » et « sans défaut » sont des rendus recevables et cohérents avec le texte source. La note conserve correctement « sacrifice de communion » comme possibilité lexicale, sans trancher indûment la portée de שְׁלָמִים.
