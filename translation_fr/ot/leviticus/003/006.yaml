  text: וְ/אִם מִן הַ/צֹּ֧אן קָרְבָּנ֛/וֹ לְ/זֶ֥בַח שְׁלָמִ֖ים לַ/יהוָ֑ה זָכָר֙ א֣וֹ נְקֵבָ֔ה תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/006.yaml
  text: And if his offering for a sacrifice of peace offerings to Yahweh is from the flock[a], male or female, he shall offer it without blemish.
translation:
  language: fr
  text: Et si son offrande destinée à un sacrifice de paix pour Yahweh est prise parmi le petit bétail, il offrira un mâle ou une femelle sans défaut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de communion ». Le terme hébreu שְׁלָמִים, traditionnellement rendu par « sacrifice de paix », peut aussi évoquer le bien-être partagé ou la communion exprimée dans le repas sacrificiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Et si
  rationale: Conserve à la fois le lien avec les prescriptions précédentes et la valeur conditionnelle.
- source_word: מִן הַצֹּאן
  choice: provient du petit bétail
  rationale: צֹאן désigne collectivement les ovins et les caprins; «petit bétail» est précis sans limiter indûment le terme à une seule espèce.
- source_word: קָרְבָּנוֹ
  choice: son offrande
  rationale: קָרְבָּן est le terme cultuel courant pour ce qui est présenté en offrande.
- source_word: לְזֶבַח שְׁלָמִים
  choice: destinée à un sacrifice de paix
  rationale: Rend זֶבַח comme «sacrifice» et conserve pour שְׁלָמִים l’appellation traditionnelle «paix», tout en signalant en note la portée plus large possible du terme.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: Le lamed exprime ici la destination ou la dédicace du sacrifice; le nom divin est translittéré comme nom propre.
- source_word: זָכָר אוֹ נְקֵבָה
  choice: mâle ou femelle
  rationale: Reproduit directement la distinction sexuelle exigée pour l’animal.
- source_word: תָּמִים
  choice: sans défaut
  rationale: Dans le contexte sacrificiel, תָּמִים qualifie un animal exempt de tare; «sans défaut» est naturel et précis en français moderne.
- source_word: יַקְרִיבֶנּוּ
  choice: il offrira un animal
  rationale: Le hiphil de קרב signifie présenter ou offrir dans le cadre cultuel. La reprise nominale évite que le pronom français ne paraisse renvoyer grammaticalement à «offrande» plutôt qu’à l’animal mâle ou femelle.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; «Yahweh» le traite comme le nom propre divin plutôt que de le remplacer par un titre.
- issue: Portée de שְׁלָמִים
  choice: sacrifice de paix
  alternative: sacrifice de communion
  rationale: «Paix» préserve l’appellation traditionnelle et son lien possible avec l’idée de plénitude ou de bien-être, tandis qu’une note maintient ouverte la dimension de communion liée au repas sacrificiel.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase suit l’ordre du texte hébreu autant que le permet un français naturel; les tirets isolent clairement «mâle ou femelle» comme qualification de l’animal.
