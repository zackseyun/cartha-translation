id: LEV.3.1
reference: Leviticus 3:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם זֶ֥בַח שְׁלָמִ֖ים קָרְבָּנ֑/וֹ אִ֤ם מִן הַ/בָּקָר֙ ה֣וּא מַקְרִ֔יב אִם זָכָר֙ אִם נְקֵבָ֔ה תָּמִ֥ים יַקְרִיבֶ֖/נּוּ לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/001.yaml
  text: If his offering is a sacrifice of peace offerings[a], if he offers it from the herd, whether male or female[b], he shall offer it without blemish before Yahweh.
translation:
  language: fr
  text: Si son offrande est un sacrifice de paix[a], s’il offre un animal du gros bétail, mâle ou femelle, il l’offrira sans défaut devant Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de communion ». L’hébreu porte littéralement « sacrifice de paix », avec un pluriel dans le nom hébreu de cette catégorie d’offrandes.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח שְׁלָמִים
  choice: un sacrifice de paix
  rationale: זֶבַח désigne explicitement un sacrifice, tandis que שְׁלָמִים en précise le type. « Sacrifice de paix » conserve la formulation cultuelle traditionnelle sans réduire le champ sémantique à la seule communion.
- source_word: קָרְבָּנוֹ
  choice: son offrande
  rationale: קָרְבָּן désigne ce qui est présenté ou apporté à Dieu. « Offrande » est naturel, précis et adapté au contexte sacrificiel.
- source_word: מִן הַבָּקָר
  choice: en prenant une bête du gros bétail
  rationale: בָּקָר désigne ici les bovins. Cette formulation indique clairement qu’un animal est choisi parmi le gros bétail, sans suggérer que tout le troupeau est offert.
- source_word: מַקְרִיב / יַקְרִיבֶנּוּ
  choice: présente / présentera
  rationale: Le hiphil de קרב signifie, dans ce contexte cultuel, faire approcher ou présenter comme offrande. « Présenter » garde cette nuance tout en restant idiomatique en français.
- source_word: אִם זָכָר אִם נְקֵבָה
  choice: mâle ou femelle
  rationale: La construction corrélative autorise l’un ou l’autre sexe. La formulation française est concise et non ambiguë.
- source_word: תָּמִים
  choice: sans défaut
  rationale: Dans les prescriptions sacrificielles, תָּמִים qualifie un animal exempt de tare ou de défaut. « Sans défaut » exprime clairement cette exigence.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי signifie « devant » ou « en présence de ». Le nom divin יהוה est rendu par « Yahweh » afin de conserver le nom propre présent dans le texte hébreu.
theological_decisions:
- issue: Désignation de l’offrande שְׁלָמִים
  choice: sacrifice de paix
  alternative: sacrifice de communion ; sacrifice d’offrandes de paix
  rationale: « Sacrifice de paix » respecte l’appellation traditionnelle et laisse subsister les notions possibles de paix, de bien-être et d’intégrité. « Communion » explicite un aspect réel mais plus interprétatif.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » le rend comme nom propre sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. La répétition du verbe « présenter » reflète celle de la racine קרב dans l’hébreu. « Gros bétail » est employé au sens usuel de bovins.
