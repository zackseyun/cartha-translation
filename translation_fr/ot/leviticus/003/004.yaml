  text: וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵ/הֶ֔ן אֲשֶׁ֖ר עַל הַ/כְּסָלִ֑ים וְ/אֶת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד עַל הַ/כְּלָי֖וֹת יְסִירֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys, he shall remove.
translation:
  language: fr
  text: ainsi que les deux reins et la graisse qui les recouvre, celle qui est sur les flancs, et le prolongement[a] qui se trouve sur le foie ; il enlèvera ce prolongement avec les reins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le lobe du foie ». Le terme hébreu désignant cette partie anatomique est incertain ; « prolongement » évite de donner une précision que le texte ne permet pas d’établir avec certitude.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: les deux reins
  rationale: Le terme désigne clairement les reins comme organes anatomiques dans les prescriptions sacrificielles.
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵהֶן
  choice: la graisse qui les recouvre
  rationale: Dans ce contexte, חֵלֶב désigne les parties grasses réservées au sacrifice. « Qui les recouvre » exprime naturellement leur position sur les reins.
- source_word: אֲשֶׁר עַל הַכְּסָלִים
  choice: celle qui est sur les flancs
  rationale: כְּסָלִים désigne la région des flancs ou des lombes. « Flancs » est précis, actuel et adapté au contexte anatomique.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: le prolongement qui se trouve sur le foie
  rationale: Le terme anatomique יוֹתֶרֶת est incertain. « Prolongement » reste intelligible sans imposer l’identification plus précise de « lobe ».
- source_word: עַל הַכְּלָיוֹת יְסִירֶנָּה
  choice: il enlèvera ce prolongement avec les reins
  rationale: La formulation rend la valeur prescriptive du verbe et comprend la locution comme indiquant que cette partie doit être retirée avec les reins. La reprise explicite de « ce prolongement » évite une ambiguïté pronominale en français.
