source:
  edition: WLC
  text: חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בְּ/כֹ֖ל מֽוֹשְׁבֹתֵי/כֶ֑ם כָּל חֵ֥לֶב וְ/כָל דָּ֖ם לֹ֥א תֹאכֵֽלוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/017.yaml
  text: 'It shall be a permanent statute throughout your generations, in all your dwellings: you shall eat neither any fat nor any blood.'
translation:
  language: fr
  text: 'C’est une prescription permanente[a], de génération en génération, dans tous vos lieux d’habitation : vous ne mangerez ni graisse ni sang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une prescription perpétuelle » ou « une prescription valable pour toujours ». Dans les formules juridiques, le mot hébreu עוֹלָם désigne souvent une validité durable et continue.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקַּת
  choice: prescription
  rationale: « Prescription » exprime une règle fixée et normative, tout en restant naturel dans un contexte légal en français moderne.
- source_word: עוֹלָם
  choice: permanente
  rationale: Dans cette formule légale, le terme indique une validité durable et continue; « permanente » en conserve la force sans imposer à l’expression une portée métaphysique absolue.
- source_word: לְדֹרֹתֵיכֶם
  choice: de génération en génération
  rationale: Cette tournure française idiomatique exprime clairement la continuité de la prescription au fil des générations.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: partout où vous habiterez
  rationale: Cette formulation naturelle rend la portée de la règle dans tous les lieux de résidence, sans le caractère légèrement figé de « dans toutes vos demeures ».
- source_word: כָּל חֵלֶב
  choice: ni graisse
  rationale: Sous la négation coordonnée, le français exprime naturellement l’interdiction générale sans article; le contexte sacrificiel donne à « graisse » son sens cultuel.
- source_word: וְכָל דָּם
  choice: ni sang
  rationale: Le parallélisme avec « ni graisse » rend de façon idiomatique et complète l’interdiction portant sur tout sang.
- source_word: לֹא תֹאכֵלוּ
  choice: vous ne mangerez ni… ni…
  rationale: Le futur à valeur impérative convient au style législatif biblique et la coordination « ni… ni… » porte correctement la négation sur les deux objets.
theological_decisions:
- issue: Durée de la prescription exprimée par עוֹלָם
  choice: prescription permanente
  alternative: prescription perpétuelle / prescription pour toujours
  rationale: La formule affirme la validité durable de la règle dans le cadre de l’alliance, à travers les générations et les lieux de résidence. « Permanente » préserve cette force tout en laissant intacte l’étendue exacte que l’idiome juridique attribue à עוֹלָם.
translation_notes:
  register: Français international moderne, clair et digne. Le présentatif « C’est » donne une formulation naturelle, tandis que le futur « vous ne mangerez » maintient le ton normatif. Le vocabulaire conserve le caractère légal et cultuel du verset sans archaïsme inutile.
