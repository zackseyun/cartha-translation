  text: וְ/הִקְרִ֤יב מִמֶּ֨/נּוּ֙ קָרְבָּנ֔/וֹ אִשֶּׁ֖ה לַֽ/יהוָ֑ה אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/014.yaml
  text: 'And from it he shall present his offering[a], a food offering to Yahweh: the fat that covers the entrails, and all the fat that is on the entrails,'
translation:
  language: fr
  text: 'Il présentera de cet animal son offrande[a] par le feu pour Yahweh : la graisse qui recouvre les entrailles et toute la graisse qui est sur les entrailles,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une offrande de nourriture ». Le sens précis du terme hébreu est discuté; dans les contextes sacrificiels, il est traditionnellement rendu par « offrande par le feu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: Il présentera
  rationale: Le hiphil de קרב désigne ici l’action rituelle de présenter une offrande; « présentera » reste naturel tout en conservant cette nuance.
- source_word: מִמֶּנּוּ
  choice: de cet animal
  rationale: Le pronom renvoie à l’animal sacrificiel mentionné dans le contexte. L’explicitation évite l’ambiguïté que créerait en français « de lui ».
- source_word: קָרְבָּנוֹ
  choice: son offrande
  rationale: קָרְבָּן est un terme sacrificiel technique, rendu clairement et couramment par « offrande ».
- source_word: אִשֶּׁה
  choice: un sacrifice consumé par le feu
  rationale: Le terme désigne une offrande destinée au feu. Cette formulation française conserve le lien étymologique et rituel avec le feu sans imposer l’interprétation plus débattue de « nourriture offerte ».
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל marque ici le destinataire du sacrifice; « pour » convient naturellement en français. Le nom divin est translittéré « Yahweh ».
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: la graisse qui recouvre les entrailles
  rationale: La formulation traduit directement la relation anatomique exprimée par le participe מְכַסֶּה.
- source_word: וְאֵת כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: et toute la graisse qui y adhère
  rationale: Dans ce contexte anatomique, עַל indique la graisse située sur les entrailles; « y adhère » est précis et idiomatique, tout en évitant la répétition lourde d’« entrailles ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » préserve le nom propre d’alliance sans le remplacer par un titre.
- issue: Sens de אִשֶּׁה
  choice: un sacrifice consumé par le feu
  alternative: une offrande de nourriture
  rationale: Le sens exact et l’étymologie du terme font débat. Le rendu retenu conserve son association manifeste au feu dans le rituel lévitique, tandis que la note signale l’autre compréhension importante.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit le déroulement rituel du texte hébreu; « entrailles » conserve la précision concrète du vocabulaire sacrificiel.
