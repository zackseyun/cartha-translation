base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/005.yaml
  text: And Aaron’s sons shall burn it on the altar[a], on top of the burnt offering that is on the wood that is on the fire. It is a food offering, a pleasing aroma to Yahweh.
translation:
  language: fr
  text: Les fils d’Aaron le feront brûler sur l’autel, sur l’holocauste qui est sur le bois qui est sur le feu. C’est une offrande consumée par le feu[a], dont l’odeur est agréable à Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une offrande par le feu ».'
    reason: Alternative lexicale pour le terme sacrificiel hébreu אִשֶּׁה.
lexical_decisions:
- source_word: וְהִקְטִירוּ
  choice: feront fumer
  rationale: Le hiphil de קטר, dans le contexte sacrificiel, désigne l’action de brûler la part offerte afin qu’elle monte en fumée. « Feront fumer » conserve cette nuance mieux que le simple « brûleront ».
- source_word: אֹתוֹ
  choice: le
  rationale: Le pronom objet renvoie à la portion du sacrifice de communion décrite au verset précédent.
- source_word: בְנֵי אַהֲרֹן
  choice: Les fils d’Aaron
  rationale: Traduction directe et naturelle du syntagme construit, qui conserve à la fois le lien familial et la fonction sacerdotale implicite.
- source_word: הַמִּזְבֵּחָה
  choice: sur l’autel
  rationale: Le hé directionnel exprime ici la destination du geste rituel; « sur l’autel » est l’expression française naturelle.
- source_word: עַל הָעֹלָה
  choice: par-dessus l’holocauste
  rationale: עַל indique le plus naturellement une superposition. « Holocauste » est le terme français établi pour עֹלָה dans le vocabulaire lévitique.
- source_word: אֲשֶׁר עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: placé sur le bois qui est sur le feu
  rationale: La formulation garde l’enchaînement spatial précis de l’hébreu tout en évitant une répétition trop lourde en français.
- source_word: אִשֵּׁה
  choice: un sacrifice consumé par le feu
  rationale: Le terme technique désigne une offrande présentée par combustion. Cette traduction rend explicitement le moyen sacrificiel sans imposer l’interprétation « nourriture offerte ».
- source_word: רֵיחַ נִיחֹחַ
  choice: dont l’odeur est agréable
  rationale: Cette expression sacrificielle indique que l’offrande est agréée par Dieu. La formulation est naturelle et conserve l’image olfactive sans ajouter l’idée d’apaisement.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le nom divin יהוה est rendu par « Yahweh », et la préposition ל marque ici le destinataire auquel l’offrande est agréable.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: L’emploi du nom propre « Yahweh » représente directement le tétragramme et évite de le remplacer par un titre.
- issue: Sens du terme sacrificiel אִשֵּׁה
  choice: sacrifice consumé par le feu
  alternative: offrande alimentaire; mets offert; sacrifice par le feu
  rationale: La forme et l’étymologie du terme sont discutées. Dans ce contexte, la combustion sur l’autel est explicite; « sacrifice consumé par le feu » conserve ce lien sans affirmer que Dieu consomme littéralement une nourriture.
- issue: Portée de רֵיחַ נִיחֹחַ
  choice: dont l’odeur est agréable à Yahweh
  alternative: une odeur apaisante pour Yahweh
  rationale: « Agréable » exprime l’acceptation divine sans suggérer nécessairement que l’odeur calme une colère, nuance que le contexte immédiat n’explicite pas.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’ordre rituel et les relations spatiales du texte hébreu, tout en allégeant légèrement la répétition des relatives. Aucun marqueur de note n’est requis puisqu’aucune note n’est ajoutée.
