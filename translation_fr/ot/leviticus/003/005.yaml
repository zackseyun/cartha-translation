    rationale: Bien que le verbe reflète la montée de fumée impliquée par הקטיר, cette tournure peut évoquer le fait de produire de la fumée plutôt que l’acte sacrificiel de brûler l’offrande sur l’autel.
  - severity: low
    issue: « Par-dessus l’holocauste » est spatialement moins précis que « sur l’holocauste ».
    rationale: Le השני עַל indique ici le placement de l’offrande sur l’holocauste déjà disposé sur le bois ; « par-dessus » peut suggérer une position surélevée ou seulement générale.
  - severity: low
