review_pass:
  verdict: revise
  source_fidelity: Le projet rend correctement les principaux termes et l’agencement rituel. Toutefois, « par-dessus l’holocauste » peut suggérer une position au-dessus plutôt qu’un dépôt directement sur l’holocauste ; « sur l’holocauste » reproduit plus exactement עַל. « Feront fumer » est possible comme calque explicatif de הקטיר, mais il est peu idiomatique dans le français moderne ; « feront brûler » est clair dans ce contexte et ne perd pas la fonction rituelle.
  naturalness: La syntaxe générale est compréhensible, mais « feront fumer » et « C’est un sacrifice consumé par le feu » sont moins naturels ici. « Ils le feront brûler » et « C’est une offrande consumée par le feu » sont plus fluides, tout en gardant le registre rituel.
  terminology: « Holocauste » convient pour עֹלָה, et « Yahweh » rend explicitement יהוה. Pour אִשֶּׁה, « offrande consumée par le feu » est une solution prudente ; une note conserve l’alternative traditionnelle « offrande par le feu » sans trancher une question lexicale discutée.
