  text: אֵ֠לֶּה הַֽ/חֻקִּ֣ים וְ/הַ/מִּשְׁפָּטִים֮ וְ/הַ/תּוֹרֹת֒ אֲשֶׁר֙ נָתַ֣ן יְהוָ֔ה בֵּינ֕/וֹ וּ/בֵ֖ין בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֥ר סִינַ֖י בְּ/יַד מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/046.yaml
  text: These are the statutes and the judgments and the laws that Yahweh gave between himself and the sons of Israel at Mount Sinai by the hand of Moses[a][b].
translation:
  language: fr
  text: Voici les prescriptions, les règles de droit et les lois que Yahweh a données pour régir les relations entre lui-même et les fils d’Israël[a], au mont Sinaï, par l’intermédiaire de Moïse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « par la main de Moïse », expression qui signifie « par l’intermédiaire de Moïse ».'
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: Voici
  rationale: Introduit naturellement en français moderne l’énoncé récapitulatif désigné par le démonstratif hébreu.
- source_word: הַחֻקִּים
  choice: les prescriptions
  rationale: Rend l’idée de dispositions fixées et conserve le registre juridique et cultuel du terme.
- source_word: הַמִּשְׁפָּטִים
  choice: les règles de droit
  rationale: Exprime la dimension de décisions ou normes juridiques tout en distinguant ce terme des prescriptions et des lois qui l’entourent.
- source_word: הַתּוֹרֹת
  choice: les lois
  rationale: Dans cette série juridique, le pluriel désigne des ensembles d’instructions faisant autorité; « lois » convient au contexte récapitulatif.
- source_word: אֲשֶׁר נָתַן
  choice: que … a données
  rationale: Reproduit directement le verbe נָתַן, « donner », sans expliciter davantage la nature de l’acte d’alliance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בֵּינוֹ וּבֵין בְּנֵי יִשְׂרָאֵל
  choice: entre lui et les fils d’Israël
  rationale: Conserve la construction relationnelle « entre… et… » ainsi que la forme ethnocovenantale littérale « fils d’Israël ».
- source_word: בְּהַר סִינַי
  choice: au mont Sinaï
  rationale: Formulation française idiomatique pour situer la promulgation au Sinaï.
- source_word: בְּיַד מֹשֶׁה
  choice: par l’intermédiaire de Moïse
  rationale: Rend clairement l’idiome hébreu de médiation; sa forme littérale est signalée en note.
theological_decisions:
- issue: Traduction du nom d’alliance יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le tétragramme; la translittération préserve le nom propre sans le remplacer par un titre.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le texte principal garde la forme hébraïque masculine plurielle traditionnelle, tandis que la note fournit son équivalent collectif idiomatique.
- issue: Relation exprimée par נָתַן … בֵּינוֹ וּבֵין
  choice: a données entre lui et
  alternative: a établies entre lui et
  rationale: La formulation retenue conserve le verbe concret « donner » et la construction relationnelle du texte, sans résoudre implicitement leur tension en choisissant « établir ».
translation_notes:
  register: Français international moderne, digne et accessible. La triade juridique est conservée avec trois termes distincts. La tournure légèrement marquée « données entre lui et » reflète délibérément la construction hébraïque, tandis que l’idiome final est explicité dans la traduction et documenté en note.
