  text: And I will set my dwelling place among you, and my soul will not abhor you.
translation:
  language: fr
  text: Je placerai ma demeure au milieu de vous, et mon âme ne vous prendra pas en aversion.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁכָּנִי
  choice: ma demeure
  rationale: Le nom מִשְׁכָּן désigne ici le lieu où Dieu demeure parmi son peuple; « demeure » garde ce sens tout en restant naturel en français moderne.
- source_word: בְּתוֹכְכֶם
  choice: au milieu de vous
  rationale: Rend directement l’idée de présence au sein de la communauté.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: La mention explicite de נֶפֶשׁ est conservée afin de respecter la formulation anthropomorphique et la tension du texte source.
- source_word: תִגְעַל ... אֶתְכֶם
  choice: ne vous prendra pas en aversion
  rationale: געל exprime une forte répulsion ou un rejet. Cette tournure française est digne et naturelle, sans atténuer la force du verbe.
theological_decisions:
- issue: Anthropomorphisme divin dans נַפְשִׁי
  choice: mon âme
  alternative: je ne vous prendrai pas en aversion
  rationale: Le texte hébreu attribue explicitement une נֶפֶשׁ à Dieu. La traduction la conserve au lieu de résoudre ou d’effacer cette formulation théologiquement marquée.
translation_notes:
  register: Français international moderne, clair et digne. La structure parallèle des deux propositions et la première personne divine sont préservées.
