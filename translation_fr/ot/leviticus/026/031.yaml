source:
  edition: WLC
  text: וְ/נָתַתִּ֤י אֶת עָֽרֵי/כֶם֙ חָרְבָּ֔ה וַ/הֲשִׁמּוֹתִ֖י אֶת מִקְדְּשֵׁי/כֶ֑ם וְ/לֹ֣א אָרִ֔יחַ בְּ/רֵ֖יחַ נִיחֹֽחֲ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/031.yaml
  text: And I will make your cities a ruin[a], and I will lay waste your sanctuaries, and I will not smell the pleasing aroma of your offerings.
translation:
  language: fr
  text: Je réduirai vos villes en ruines, je dévasterai vos sanctuaires et je ne sentirai pas le parfum agréable de vos offrandes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je ne sentirai pas votre parfum agréable ». Cette expression sacrificielle évoque l’accueil favorable des offrandes par Dieu ; « de vos offrandes » est explicité pour plus de clarté.'
    reason: Précision littérale et explication de l’expression sacrificielle.
lexical_decisions:
- source_word: וְנָתַתִּי אֶת־עָרֵיכֶם חָרְבָּה
  choice: Je réduirai vos villes en ruines
  rationale: Littéralement, la construction signifie « je ferai de vos villes une ruine ». « Réduire en ruines » exprime naturellement en français l’action causative et l’état de dévastation.
- source_word: וַהֲשִׁמּוֹתִי
  choice: je dévasterai
  rationale: Le hifil de שמם exprime le fait de rendre désolé. « Dévaster » est actuel, direct et conserve la force du verbe.
- source_word: מִקְדְּשֵׁיכֶם
  choice: vos sanctuaires
  rationale: Le pluriel désigne des lieux consacrés. « Sanctuaires » en préserve à la fois le nombre et le sens cultuel.
- source_word: וְלֹא אָרִיחַ
  choice: je ne respirerai pas
  rationale: Le verbe évoque littéralement l’action de sentir une odeur. « Respirer l’odeur » conserve cette image anthropomorphique tout en étant plus naturel ici que « sentir », qui pourrait suggérer une simple incapacité à percevoir.
- source_word: בְּרֵיחַ נִיחֹחֲכֶם
  choice: l’odeur apaisante de vos offrandes
  rationale: רֵיחַ נִיחֹחַ est une formule sacrificielle. « Odeur apaisante » conserve son image et sa nuance traditionnelle; « de vos offrandes » explicite le référent cultuel implicite afin d’éviter que « votre odeur » soit compris comme l’odeur des personnes elles-mêmes.
theological_decisions:
- issue: Faut-il remplacer l’image sensorielle par l’idée explicite du refus des sacrifices ?
  choice: Conserver « je ne respirerai pas l’odeur apaisante »
  alternative: « je n’accepterai pas vos offrandes »
  rationale: L’hébreu emploie expressément le langage de l’odorat et la formule sacrificielle de l’« odeur apaisante ». Garder cette image préserve la texture anthropomorphique et cultuelle sans réduire le propos à son interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme des jugements est conservé, de même que le pluriel « sanctuaires » et l’image sensorielle du texte hébreu.
