  text: וְ/נָתַתִּ֤י פָנַ/י֙ בָּ/כֶ֔ם וְ/נִגַּפְתֶּ֖ם לִ/פְנֵ֣י אֹיְבֵי/כֶ֑ם וְ/רָד֤וּ בָ/כֶם֙ שֹֽׂנְאֵי/כֶ֔ם וְ/נַסְתֶּ֖ם וְ/אֵין רֹדֵ֥ף אֶתְ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/017.yaml
  text: And I will set my face against you[a], and you will be struck down before your enemies; those who hate you will rule over you[c][b], and you will flee when no one is pursuing you.
translation:
  language: fr
  text: Je tournerai ma face contre vous[a], et vous serez défaits devant vos ennemis. Ceux qui vous haïssent vous domineront, et vous fuirez sans que personne ne vous poursuive[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expression hébraïque indiquant que Dieu s’oppose résolument à eux pour les juger.
    reason: cultural_note
  - marker: b
    text: 'Ou : « vous fuirez alors même que personne ne vous poursuivra ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי פָנַי בָכֶם
  choice: Je tournerai ma face contre vous
  rationale: Cette formulation conserve l’image hébraïque de la face de Dieu résolument dirigée contre le peuple en jugement. « Face » garde la portée personnelle et relationnelle de l’expression, tandis qu’une note en explicite le sens idiomatique.
- source_word: וְנִגַּפְתֶּם
  choice: vous serez défaits
  rationale: Dans ce contexte militaire, le nifal exprime le fait d’être battu ou vaincu. « Défaits » est naturel, précis et n’impose pas nécessairement l’idée que tous seront tués.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: devant vos ennemis
  rationale: Rendu direct de l’expression spatiale et militaire, qui peut évoquer la défaite face aux ennemis.
- source_word: וְרָדוּ בָכֶם
  choice: domineront sur vous
  rationale: רדה désigne ici l’exercice d’un pouvoir sur le peuple. « Domineront sur vous » rend la subjugation hostile sans ajouter une cruauté particulière que le verset ne précise pas.
- source_word: שֹׂנְאֵיכֶם
  choice: ceux qui vous haïssent
  rationale: Le participe désigne explicitement les personnes qui haïssent le peuple et préserve la distinction avec « vos ennemis » dans la proposition précédente.
- source_word: וְנַסְתֶּם
  choice: vous fuirez
  rationale: « Fuir » est le verbe français courant et précis pour exprimer la fuite provoquée par la peur ou la défaite.
- source_word: וְאֵין רֹדֵף אֶתְכֶם
  choice: sans que personne vous poursuive
  rationale: Cette tournure naturelle exprime que la fuite aura lieu en l’absence de tout poursuivant. La note conserve la possibilité d’une nuance concessive.
theological_decisions:
- issue: Langage anthropomorphique décrivant le jugement divin
  choice: 'Conserver l’image : « Je tournerai ma face contre vous »'
  alternative: « Je m’opposerai à vous »
  rationale: L’image hébraïque présente l’opposition de Dieu comme une prise de position personnelle dans le cadre de l’alliance. La remplacer entièrement par une abstraction affaiblirait cette dimension littéraire et théologique.
- issue: Nature du pouvoir exercé par ceux qui haïssent Israël
  choice: « domineront sur vous »
  alternative: « régneront sur vous »
  rationale: « Dominer » communique clairement la subjugation dans ce contexte de malédiction, sans préciser indûment la forme politique ni le degré de violence de cette autorité.
translation_notes:
  register: Français moderne, digne et accessible. L’expression imagée « tourner ma face contre » est volontairement plus littéraire que le reste du verset afin de préserver l’anthropomorphisme hébraïque; elle est immédiatement éclairée par une note. « Défaits » situe naturellement la scène dans un contexte militaire, et « ceux qui vous haïssent » maintient la distinction lexicale avec « vos ennemis ».
