source:
  edition: WLC
  text: וְ/הִשְׁלַחְתִּ֨י בָ/כֶ֜ם אֶת חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/שִׁכְּלָ֣ה אֶתְ/כֶ֔ם וְ/הִכְרִ֨יתָה֙ אֶת בְּהֶמְתְּ/כֶ֔ם וְ/הִמְעִ֖יטָה אֶתְ/כֶ֑ם וְ/נָשַׁ֖מּוּ דַּרְכֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/022.yaml
  text: And I will send against you the wild animals of the field[a], and they will bereave you, cut off your livestock, reduce your number[c][b], and your roads will become desolate.
translation:
  language: fr
  text: J’enverrai contre vous les animaux sauvages, qui vous priveront de vos enfants[a], extermineront votre bétail et réduiront votre nombre. Vos routes deviendront désertes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vous priveront » ; le verbe hébreu évoque la perte des enfants et le deuil qui en résulte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁלַחְתִּי בָכֶם
  choice: J’enverrai contre vous
  rationale: Le hiphil de שלח exprime simplement l’envoi, et ב marque ici l’hostilité. Cette formulation conserve clairement l’action divine et sa portée punitive.
- source_word: חַיַּת הַשָּׂדֶה
  choice: les animaux sauvages
  rationale: La construction désigne collectivement les animaux terrestres vivant à l’état sauvage. En français actuel, « animaux sauvages » rend naturellement le sens sans le tour plus traditionnel « bêtes des champs ».
- source_word: וְשִׁכְּלָה אֶתְכֶם
  choice: qui vous priveront de vos enfants
  rationale: Au piel, שׁכל signifie rendre quelqu’un privé de ses enfants. Le français exige de préciser le complément implicite pour communiquer naturellement cet idiome hébreu.
- source_word: וְהִכְרִיתָה אֶת בְּהֶמְתְּכֶם
  choice: extermineront votre bétail
  rationale: הכרית exprime ici la suppression ou la destruction complète, tandis que בְּהֵמָה désigne les animaux domestiques. « Extermineront votre bétail » est idiomatique et conserve la gravité du jugement.
- source_word: וְהִמְעִיטָה אֶתְכֶם
  choice: réduiront votre nombre
  rationale: Le hiphil de מעט signifie rendre peu nombreux. Cette formulation exprime clairement la diminution de la population.
- source_word: וְנָשַׁמּוּ דַּרְכֵיכֶם
  choice: Vos routes deviendront désertes
  rationale: Dans ce contexte de dépeuplement, דְּרָכִים désigne probablement les routes ou voies de circulation, et נשׁם leur état d’abandon ou de désolation.
theological_decisions:
- issue: Complément implicite du verbe שׁכל
  choice: Expliciter « de vos enfants » dans le texte
  alternative: Traduire littéralement « vous endeuilleront » ou « vous priveront », sans préciser la perte
  rationale: Bien que le mot « enfants » ne soit pas exprimé séparément en hébreu, il appartient au sens conventionnel du verbe dans cette construction. L’explicitation rend l’idiome intelligible sans ajouter une affirmation étrangère au texte.
- issue: Référent de דַּרְכֵיכֶם
  choice: Comprendre le terme comme les routes concrètes
  alternative: Traduire « vos chemins » ou comprendre les « voies » au sens figuré
  rationale: La diminution de la population et l’effondrement de la vie sociale favorisent ici le sens concret de routes désertées, sans exclure entièrement l’ambivalence lexicale générale du terme.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase est divisée en deux pour éviter une coordination lourde. « Bétail » et « routes » sont courants et précis ; « extermineront » maintient la force du jugement exprimé par le verbe hébreu.
