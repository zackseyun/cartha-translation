  text: וַ/אֲכַלְתֶּ֥ם יָשָׁ֖ן נוֹשָׁ֑ן וְ/יָשָׁ֕ן מִ/פְּנֵ֥י חָדָ֖שׁ תּוֹצִֽיאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/010.yaml
  text: You will eat old stores long kept[a], and you will clear out the old because of the new.
translation:
  language: fr
  text: Vous mangerez de vieilles réserves conservées depuis longtemps[a], et vous retirerez les anciennes réserves à cause des nouvelles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « Vous mangerez de l’ancien, longtemps conservé, et vous retirerez l’ancien à cause du nouveau. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: Vous mangerez
  rationale: Dans la suite des bénédictions de l’alliance, le parfait qal précédé de waw a une valeur future. Le futur simple rend naturellement cette promesse en français.
- source_word: יָשָׁן
  choice: de vieilles réserves
  rationale: L’adjectif « ancien » est employé substantivement et désigne les produits conservés des récoltes précédentes. « Réserves » explicite l’objet sous-entendu sans le limiter au grain.
- source_word: נוֹשָׁן
  choice: conservées depuis longtemps
  rationale: Cette forme souligne l’ancienneté des réserves. La formulation retenue exprime une longue conservation sans la nuance péjorative que pourrait avoir « rassises ».
- source_word: וְיָשָׁן
  choice: les anciennes
  rationale: Le second emploi est également substantivé et renvoie aux réserves déjà mentionnées. Le féminin pluriel assure cette reprise naturelle en français.
- source_word: מִפְּנֵי
  choice: à cause des
  rationale: 'La locution marque ici la cause ou le déplacement : les anciennes réserves sont sorties en raison de l’arrivée des nouvelles. « À cause de » conserve cette relation sans ajouter explicitement l’idée de faire de la place.'
- source_word: חָדָשׁ
  choice: les nouvelles
  rationale: L’adjectif substantivé désigne les produits de la nouvelle récolte. Le féminin pluriel reprend naturellement « réserves » sans sur-préciser la nature des produits.
- source_word: תּוֹצִיאוּ
  choice: vous sortirez
  rationale: Le hiphil de יצא signifie littéralement « faire sortir » ou « sortir ». Cette traduction préserve l’image concrète du texte tout en restant claire en français.
theological_decisions: []
