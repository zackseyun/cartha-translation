revisions:
- from: Vous mangerez de vieilles réserves, conservées depuis longtemps[a], et vous sortirez les anciennes à cause des nouvelles.
  to: Vous mangerez de vieilles réserves conservées depuis longtemps[a], et vous retirerez les anciennes réserves à cause des nouvelles.
  rationale: La révision remplace le transitif peu idiomatique « sortirez » par « retirerez », qui rend clairement le déplacement des anciennes provisions, et harmonise la reprise explicite de « réserves ». Elle supprime également une virgule qui séparait inutilement le nom de sa précision participiale. Le sens causal compact de מִפְּנֵי est préservé.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:25:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens futur de la promesse est correctement rendu. « Réserves » représente de manière raisonnable les adjectifs substantivés désignant les produits entreposés, et « conservées depuis longtemps » rend bien l’intensif נוֹשָׁן. Le second verbe est un hiphil de יצא (« faire sortir, retirer ») : « retirerez » est plus fidèle au mouvement causatif et plus idiomatique ici que « sortirez ».'
  naturalness: La première proposition est naturelle sans la virgule entre « réserves » et le participe restrictif. Dans la seconde, « sortir les anciennes » est moins idiomatique en français moderne, surtout sans complément de lieu ; « retirer les anciennes réserves » est clair et conserve l’image du déplacement causé par l’arrivée des nouvelles.
  terminology: Le choix de « réserves » est cohérent dans les deux membres et évite de limiter indûment le référent au grain. La relation de מִפְּנֵי est conservée par « à cause des », sans imposer une interprétation doctrinale ou expliciter au-delà du nécessaire l’idée de faire de la place.
  issues:
  - severity: medium
    issue: « Vous sortirez les anciennes » est peu naturel et rend insuffisamment le causatif de תּוֹצִיאוּ.
    rationale: En français, « sortir » employé transitivement est possible mais sonne ici elliptique et peut évoquer le fait de faire sortir des personnes. « Retirer » exprime naturellement l’enlèvement des anciennes réserves et correspond au hiphil (« faire sortir »).
  - severity: low
    issue: Virgule inutile avant « conservées depuis longtemps ».
    rationale: Le participe précise de quelles réserves il s’agit ; sans virgule, la formulation est plus fluide et plus directement liée au substantif.
  revised_text: Vous mangerez de vieilles réserves conservées depuis longtemps[a], et vous retirerez les anciennes réserves à cause des nouvelles.
  revised_footnotes:
  - marker: a
    text: 'Ou, plus formellement : « Vous mangerez de l’ancien, longtemps conservé, et vous retirerez l’ancien à cause du nouveau. »'
    reason: lexical_alternative
  revision_rationale: La révision remplace le transitif peu idiomatique « sortirez » par « retirerez », qui rend clairement le déplacement des anciennes provisions, et harmonise la reprise explicite de « réserves ». Elle supprime également une virgule qui séparait inutilement le nom de sa précision participiale. Le sens causal compact de מִפְּנֵי est préservé.
