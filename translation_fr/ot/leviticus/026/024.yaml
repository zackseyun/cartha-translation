source:
  edition: WLC
  text: וְ/הָלַכְתִּ֧י אַף אֲנִ֛י עִמָּ/כֶ֖ם בְּ/קֶ֑רִי וְ/הִכֵּיתִ֤י אֶתְ/כֶם֙ גַּם אָ֔נִי שֶׁ֖בַע עַל חַטֹּאתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/024.yaml
  text: then I also will walk contrary to you[b][a], and I myself will strike you sevenfold for your sins.
translation:
  language: fr
  text: Alors, moi aussi, je marcherai contre vous[a], et moi aussi, je vous frapperai sept fois plus[b] à cause de vos péchés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je marcherai avec vous dans l’hostilité » ou « je m’opposerai à vous ». Le terme hébreu traduit par « contre » revient plusieurs fois dans Lévitique 26 pour décrire l’opposition réciproque entre Israël et le Seigneur.
    reason: lexical_alternative
  - marker: b
    text: Ou « sept fois » ou « au septuple ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַכְתִּי
  choice: alors ... je marcherai
  rationale: Le verbe הלך signifie littéralement « marcher » ou « aller ». « Marcher » conserve le motif verbal répété dans ce chapitre, tandis que « alors » rend la progression conditionnelle des avertissements.
- source_word: אַף אֲנִי
  choice: moi aussi
  rationale: Cette combinaison souligne que le Seigneur répondra à son tour à l’opposition du peuple.
- source_word: עִמָּכֶם בְּקֶרִי
  choice: contre vous
  rationale: L’expression associe littéralement « avec vous » au terme rare קרי. En français, « marcher contre vous » exprime naturellement l’opposition réciproque et maintient le verbe « marcher ».
- source_word: וְהִכֵּיתִי אֶתְכֶם
  choice: et je vous frapperai
  rationale: נכה désigne ici l’action punitive de frapper. Ce choix est direct, actuel et conserve la force du texte.
- source_word: גַּם אָ֔נִי
  choice: moi-même
  rationale: La seconde insistance sur le sujet divin met en relief son intervention personnelle; « moi-même » rend cette emphase sans lourdeur excessive.
- source_word: שֶׁבַע
  choice: au septuple
  rationale: « Au septuple » conserve l’intensification rhétorique du nombre sept sans imposer une lecture exclusivement arithmétique.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: à cause de vos péchés
  rationale: La préposition עַל indique ici le motif du châtiment. « À cause de » rend explicitement ce rapport causal.
theological_decisions:
- issue: Sens de בְּקֶרִי dans les déclarations réciproques concernant Israël et le Seigneur
  choice: contre vous
  alternative: avec hostilité / en opposition à vous
  rationale: Le choix préserve le thème de l’opposition réciproque dans l’alliance sans réduire le mot rare à un état émotionnel précis.
- issue: Portée de la formule de châtiment שֶׁבַע
  choice: au septuple
  alternative: sept fois
  rationale: La formulation conserve à la fois la valeur numérique du sept et sa fonction d’intensification dans cette série d’avertissements, sans trancher entre une mesure strictement arithmétique et une expression rhétorique.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le motif répété de la « marche » ainsi que l’intensité de l’action punitive, tout en signalant les principales ambiguïtés lexicales.
