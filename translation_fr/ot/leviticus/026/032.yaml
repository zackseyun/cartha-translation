source:
  edition: WLC
  text: וַ/הֲשִׁמֹּתִ֥י אֲנִ֖י אֶת הָ/אָ֑רֶץ וְ/שָֽׁמְמ֤וּ עָלֶ֨י/הָ֙ אֹֽיְבֵי/כֶ֔ם הַ/יֹּשְׁבִ֖ים בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/032.yaml
  text: And I myself will lay the land waste[a], and your enemies who dwell in it will be appalled at it.
translation:
  language: fr
  text: Moi-même, je dévasterai le pays, et vos ennemis qui y habiteront en seront consternés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en resteront stupéfaits » ou « en seront horrifiés ». Le verbe hébreu peut exprimer la stupeur mêlée d’effroi que provoque une dévastation.
    reason: alternative lexicale
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  choice: je dévasterai
  rationale: Le causatif de שׁמם exprime l’action de rendre désert ou dévasté. « Je dévasterai » restitue clairement cette force en français actuel.
- source_word: אֲנִי
  choice: Moi-même
  rationale: Le pronom indépendant renforce le sujet déjà indiqué par la forme verbale. « Moi-même » conserve cette insistance.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte de sanctions liées à l’alliance, le terme désigne le territoire où vit Israël, et non la terre entière. « Le pays » est naturel et contextuellement précis.
- source_word: וְשָׁמְמוּ
  choice: en seront consternés
  rationale: Au qal, שׁמם peut décrire la stupeur ou l’effroi provoqués par une dévastation. Avec les ennemis pour sujet, « consternés » exprime leur réaction sans faire d’eux les personnes dévastées.
- source_word: עָלֶיהָ
  choice: en
  rationale: Avec שׁמם, עַל introduit ici ce qui provoque la consternation. Le pronom adverbial « en » renvoie naturellement à l’état du pays.
- source_word: אֹיְבֵיכֶם
  choice: vos ennemis
  rationale: Traduction directe de la construction possessive.
- source_word: הַיֹּשְׁבִים בָּהּ
  choice: qui y habiteront
  rationale: Le participe de ישׁב désigne ceux qui résident dans le pays. Le futur convient au cadre prophétique des sanctions annoncées et indique que les ennemis l’occuperont alors.
theological_decisions:
- issue: Référent de הָאָרֶץ dans le contexte des sanctions de l’alliance
  choice: le pays
  alternative: la terre
  rationale: Le contexte immédiat concerne le territoire d’Israël soumis à la dévastation. « Le pays » évite d’étendre le jugement à toute la terre sans appui contextuel.
translation_notes:
  register: Français international moderne, sobre et digne. L’ordre initial « Moi-même » préserve l’emphase hébraïque; « consternés » reste courant tout en convenant à la gravité de l’annonce.
