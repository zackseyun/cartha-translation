id: LEV.26.14
reference: Leviticus 26:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם לֹ֥א תִשְׁמְע֖וּ לִ֑/י וְ/לֹ֣א תַעֲשׂ֔וּ אֵ֥ת כָּל הַ/מִּצְוֺ֖ת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/014.yaml
  text: But if you do not listen to me and do not do all these commandments,[a]
translation:
  language: fr
  text: Mais si vous ne m’écoutez pas et ne mettez pas en pratique tous ces commandements,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne m’obéissez pas ». Le verbe hébreu peut désigner une écoute qui conduit à l’obéissance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Dans le contexte, la conjonction introduit la condition opposée aux bénédictions précédentes; « Mais si » exprime naturellement ce contraste.
- source_word: תִשְׁמְעוּ לִי
  choice: vous ne m’écoutez pas
  rationale: שׁמע construit avec ל désigne une écoute attentive qui implique souvent l’obéissance. « M’écoutez » conserve l’image hébraïque sans confondre cette proposition avec celle qui porte sur la mise en pratique.
- source_word: וְלֹא תַעֲשׂוּ
  choice: et ne mettez pas en pratique
  rationale: Dans ce contexte juridique, עשה signifie accomplir les commandements. « Mettre en pratique » est plus naturel en français actuel que le calque « faire des commandements », tout en exprimant fidèlement l’action demandée.
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: tous ces commandements
  rationale: Cette formulation rend directement כָּל, le nom מִצְוֺת et le démonstratif הָאֵלֶּה, avec le registre d’alliance et de loi du passage.
theological_decisions:
- issue: Faut-il rendre שׁמע ל par « écouter » ou expliciter « obéir » ?
  choice: m’écoutez
  alternative: m’obéissez
  rationale: Le verbe hébreu associe l’écoute à l’obéissance, mais la proposition suivante mentionne séparément la mise en pratique des commandements. « M’écoutez » préserve cette distinction et la tension propre au texte.
translation_notes:
  register: Français international moderne, simple et digne. « Mettre en pratique » évite un calque peu idiomatique tout en conservant le sens juridique et concret de עשה.
