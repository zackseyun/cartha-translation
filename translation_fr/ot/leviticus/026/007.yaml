  text: וּ/רְדַפְתֶּ֖ם אֶת אֹיְבֵי/כֶ֑ם וְ/נָפְל֥וּ לִ/פְנֵי/כֶ֖ם לֶ/חָֽרֶב־
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/007.yaml
  text: You will pursue your enemies[a], and they will fall before you by the sword.
translation:
  language: fr
  text: Vous poursuivrez vos ennemis, et ils tomberont devant vous par l’épée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à l’épée ». La préposition hébraïque peut exprimer le résultat (« livrés à l’épée ») ou le moyen (« par l’épée »).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְדַפְתֶּם
  choice: Vous poursuivrez
  rationale: Le verbe רדף signifie couramment « poursuivre » ou « prendre en chasse ». « Poursuivre » restitue clairement le contexte militaire sans surtraduction.
- source_word: אֹיְבֵיכֶם
  choice: vos ennemis
  rationale: Le nom אֹיֵב est le terme hébreu usuel pour désigner un ennemi, et le suffixe de deuxième personne du pluriel est rendu par « vos ».
- source_word: וְנָפְלוּ
  choice: et ils tomberont
  rationale: נפל signifie littéralement « tomber ». Dans un contexte de bataille, il peut impliquer la défaite ou la mort, mais « tomberont » conserve l’image hébraïque et sa portée.
- source_word: לִפְנֵיכֶם
  choice: devant vous
  rationale: לִפְנֵי avec suffixe signifie ici « devant » ou « en présence de ». « Devant vous » est naturel en français et convient au contexte militaire.
- source_word: לֶחָרֶב
  choice: sous les coups de l’épée
  rationale: La construction לְ avec חֶרֶב indique ici le moyen ou l’issue de la chute au combat. Cette formulation française exprime naturellement la mort ou la défaite par l’épée, sans effacer l’image concrète du texte.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le futur garde la forme de promesse du passage, tandis que « tomberont » préserve l’image militaire de l’hébreu sans préciser au-delà du texte si chaque ennemi est tué ou simplement vaincu.
