  text: אֲנִ֞י יְהוָ֣ה אֱלֹֽהֵי/כֶ֗ם אֲשֶׁ֨ר הוֹצֵ֤אתִי אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם מִֽ/הְיֹ֥ת לָ/הֶ֖ם עֲבָדִ֑ים וָ/אֶשְׁבֹּר֙ מֹטֹ֣ת עֻלְּ/כֶ֔ם וָ/אוֹלֵ֥ךְ אֶתְ/כֶ֖ם קֽוֹמְמִיּֽוּת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/013.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt, from being their servants[c][b]; I broke the bars of your yoke and made you walk upright.
translation:
  language: fr
  text: Je suis Yahweh, votre Dieu, qui vous ai fait sortir du pays d’Égypte pour vous libérer de leur esclavage.[a] J’ai brisé les barres de votre joug[b] et je vous ai fait marcher la tête haute.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin que vous ne soyez plus leurs esclaves ». Littéralement, « hors d’être pour eux des esclaves ».'
    reason: La construction hébraïque décrit la délivrance hors de la condition d’esclavage ; le français peut aussi l’exprimer comme le fait de ne plus être leurs esclaves.
  - marker: b
    text: 'Ou : « les perches » de votre joug.'
    reason: Le terme hébreu désigne les pièces rigides, telles que des barres ou des perches, qui composent le joug.
  - marker: c
    text: 'Ou : « debout » ou « redressés ».'
    reason: Le terme hébreu évoque une posture droite, image concrète de la libération et de la dignité restaurée.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel employé dans le texte hébreu.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Dans cette formule d’alliance, le pluriel morphologique désigne le Dieu unique d’Israël; le possessif pluriel français correspond aux destinataires.
- source_word: הוֹצֵאתִי ... מֵאֶרֶץ מִצְרַיִם
  choice: je vous ai fait sortir du pays d’Égypte
  rationale: Le hiphil de יצא exprime l’action de faire sortir; cette formulation naturelle conserve clairement le motif de l’Exode.
- source_word: מִהְיֹת לָהֶם עֲבָדִים
  choice: afin que vous ne soyez plus leurs esclaves
  rationale: La formulation rend naturellement la délivrance hors de la condition servile. « Esclaves » exprime ici sans l’atténuer l’asservissement imposé par l’Égypte.
- source_word: וָאֶשְׁבֹּר
  choice: J’ai brisé
  rationale: « Briser » rend directement שבר et maintient Dieu comme sujet explicite de la libération.
- source_word: מֹטֹת עֻלְּכֶם
  choice: les barres de votre joug
  rationale: מוֹטוֹת désigne les barres ou pièces rigides du joug; « barres » conserve l’image concrète de l’asservissement détruit.
- source_word: וָאוֹלֵךְ אֶתְכֶם
  choice: je vous ai fait marcher
  rationale: Cette tournure conserve la valeur causative du hiphil de הלך au lieu de l’aplatir en un simple « je vous ai conduits ».
- source_word: קוֹמְמִיּוּת
  choice: la tête haute
  rationale: L’expression française communique naturellement la posture redressée et la dignité retrouvée suggérées par le terme, tandis qu’une note signale le rendu plus formel.
theological_decisions:
- issue: Statut des Israélites en Égypte
  choice: esclaves
  alternative: serviteurs
  rationale: Le contexte est celui d’un asservissement oppressif dont Yahweh délivre Israël; « serviteurs » atténuerait indûment cette condition.
- issue: Valeur de מִהְיֹת dans la délivrance
  choice: afin que vous ne soyez plus
  alternative: vous arrachant à la condition d’esclaves
  rationale: Le français choisi exprime clairement le résultat visé par la sortie d’Égypte. La note préserve la possibilité de comprendre plus directement la préposition comme une séparation d’avec un état antérieur.
- issue: Image finale de la libération
  choice: je vous ai fait marcher la tête haute
  alternative: je vous ai fait marcher redressés
  rationale: Le choix principal garde le mouvement causatif et exprime en français courant la posture de personnes libérées. Il ne transforme pas cette dignité retrouvée en affirmation abstraite de justice morale.
translation_notes:
  register: Français international moderne, digne et accessible. Les deux-points rendent naturellement la proposition relative hébraïque après la formule d’identité divine. « La tête haute » est idiomatique sans être familier; les notes conservent les nuances plus formelles des images hébraïques.
