source:
  edition: WLC
  text: וְ/הִשִּׂ֨יג לָ/כֶ֥ם דַּ֨יִשׁ֙ אֶת בָּצִ֔יר וּ/בָצִ֖יר יַשִּׂ֣יג אֶת זָ֑רַע וַ/אֲכַלְתֶּ֤ם לַחְמְ/כֶם֙ לָ/שֹׂ֔בַע וִֽ/ישַׁבְתֶּ֥ם לָ/בֶ֖טַח בְּ/אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/005.yaml
  text: Your threshing will last for you until the grape harvest, and the grape harvest will last until sowing; and you will eat your bread to the full and live securely in your land.
translation:
  language: fr
  text: Votre battage durera jusqu’aux vendanges, et vos vendanges jusqu’aux semailles. Vous mangerez votre pain à satiété et vous habiterez en sécurité dans votre pays.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִשִּׂיג ... דַּיִשׁ אֶת־בָּצִיר
  choice: Le battage se prolongera ... jusqu’aux vendanges
  rationale: Le verbe נשׂג exprime littéralement l’idée d’atteindre ou de rejoindre. Dans ce contexte d’abondance agricole, « se prolongera jusqu’à » rend naturellement le chevauchement des saisons de travail.
- source_word: וּבָצִיר יַשִּׂיג אֶת־זָרַע
  choice: les vendanges jusqu’aux semailles
  rationale: La reprise elliptique de « se prolongera » respecte le parallélisme hébreu tout en restant fluide en français.
- source_word: וַאֲכַלְתֶּם לַחְמְכֶם לָשֹׂבַע
  choice: Vous mangerez votre pain à satiété
  rationale: « Pain » conserve le terme concret לֶחֶם, et « à satiété » rend l’idée de manger jusqu’à être rassasié.
- source_word: וִישַׁבְתֶּם לָבֶטַח
  choice: vous habiterez en sécurité
  rationale: ישׁב signifie ici habiter ou demeurer, tandis que לָבֶטַח indique une situation de confiance et de sécurité.
- source_word: בְּאַרְצְכֶם
  choice: dans votre pays
  rationale: « Pays » rend אֶרֶץ de façon naturelle dans le contexte du territoire où Israël doit habiter; « terre » resterait également possible.
theological_decisions: []
