source:
  edition: WLC
  text: וְ/הִתְהַלַּכְתִּי֙ בְּ/ת֣וֹכְ/כֶ֔ם וְ/הָיִ֥יתִי לָ/כֶ֖ם לֵֽ/אלֹהִ֑ים וְ/אַתֶּ֖ם תִּהְיוּ לִ֥/י לְ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/012.yaml
  text: I will walk among you and will be your God[a], and you will be my people.
translation:
  language: fr
  text: Je marcherai au milieu de vous[a] ; je serai votre Dieu, et vous serez mon peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je circulerai parmi vous. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְהַלַּכְתִּי
  choice: Je marcherai
  rationale: Le hitpael de הלך exprime ici le déplacement et la présence active de Dieu parmi son peuple. « Marcherai » conserve l’image concrète du texte, tandis que « habiterai » préciserait davantage que le verbe hébreu.
- source_word: בְּתוֹכְכֶם
  choice: au milieu de vous
  rationale: Cette expression désigne une présence au sein de la communauté. « Au milieu de vous » est naturel en français et évite le sens d’intériorité que pourrait suggérer « en vous ».
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: je serai votre Dieu
  rationale: Cette formulation française idiomatique restitue la formule d’alliance et sa force relationnelle sans la lourdeur de « je serai Dieu pour vous ».
- source_word: לֵאלֹהִים
  choice: Dieu
  rationale: Dans ce contexte d’alliance, אֱלֹהִים désigne le Dieu d’Israël, d’où la majuscule et l’absence d’article indéfini.
- source_word: וְאַתֶּם תִּהְיוּ לִי לְעָם
  choice: et vous serez mon peuple
  rationale: « Mon peuple » rend naturellement en français la relation réciproque exprimée par la construction hébraïque, sans en modifier la portée.
theological_decisions:
- issue: Rendu de la formule d’alliance
  choice: je serai votre Dieu, et vous serez mon peuple
  alternative: je serai Dieu pour vous, et vous serez pour moi un peuple
  rationale: Le choix retenu préserve la réciprocité de la formule d’alliance et sa portée relationnelle, dans un français courant et digne, sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international moderne, simple et digne. Le point-virgule articule la présence divine et la formule réciproque de l’alliance. La note conserve la nuance itérative ou de déplacement du hitpael sans alourdir le texte principal.
