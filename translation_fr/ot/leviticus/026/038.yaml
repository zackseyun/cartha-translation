source:
  edition: WLC
  text: וַ/אֲבַדְתֶּ֖ם בַּ/גּוֹיִ֑ם וְ/אָכְלָ֣ה אֶתְ/כֶ֔ם אֶ֖רֶץ אֹיְבֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/038.yaml
  text: You will perish among the nations[a], and the land of your enemies will consume you.
translation:
  language: fr
  text: Vous périrez parmi les nations, et le pays de vos ennemis vous dévorera.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲבַדְתֶּם
  choice: vous périrez
  rationale: Le qal de אבד exprime ici, dans la suite des malédictions de l’alliance, la ruine ou la disparition. « Vous périrez » garde cette gravité sans préciser indûment le mode de destruction.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: גּוֹיִם désigne les nations ou les peuples. « Parmi les nations » est naturel en français et convient au contexte de dispersion, sans introduire la nuance plus tardive de « païens ».
- source_word: וְאָכְלָה
  choice: vous dévorera
  rationale: Le verbe אכל signifie littéralement « manger ». Avec « le pays » pour sujet, « dévorera » conserve clairement et avec force la personnification métaphorique du texte hébreu.
- source_word: אֶתְכֶם
  choice: vous
  rationale: La marque de l’objet direct munie du suffixe de deuxième personne masculine plurielle est rendue naturellement par « vous ».
- source_word: אֶרֶץ
  choice: le pays
  rationale: Dans l’expression אֶרֶץ אֹיְבֵיכֶם et le contexte d’exil, « le pays » désigne naturellement le territoire où vivent les ennemis. Ce choix évite l’ambiguïté possible de « terre » en français tout en conservant le sens contextuel.
- source_word: אֹיְבֵיכֶם
  choice: de vos ennemis
  rationale: Cette construction nominale est rendue directement et naturellement par « de vos ennemis ».
theological_decisions:
- issue: Force métaphorique du pays qui mange les exilés
  choice: Conserver l’image en disant que le pays des ennemis « vous dévorera ».
  alternative: 'Paraphraser : « le pays de vos ennemis vous anéantira » ou « vous consumera ».'
  rationale: L’hébreu emploie le verbe ordinaire « manger » avec le pays comme sujet. « Dévorera » préserve la violence, la personnification et la tension poétique de la malédiction, sans expliquer précisément de quelle manière les exilés périront.
translation_notes:
  register: Français moderne, international et digne. La phrase reste brève et solennelle. « Pays » est plus idiomatique que « terre » pour un territoire ennemi, tandis que « dévorera » maintient sans note nécessaire la métaphore explicite de l’hébreu.
