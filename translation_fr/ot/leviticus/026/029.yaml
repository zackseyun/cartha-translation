  text: And you will eat the flesh of your sons, and you will eat the flesh of your daughters.
translation:
  language: fr
  text: Vous mangerez la chair de vos fils, et vous mangerez la chair de vos filles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: Vous mangerez
  rationale: Le qal à la deuxième personne du masculin pluriel, dans la suite des malédictions de l’alliance, a ici une valeur prédictive. Le futur français la rend naturellement, sans ajouter « alors ».
- source_word: בְּשַׂר
  choice: la chair
  rationale: « Chair » rend directement בָּשָׂר et conserve la dureté concrète de l’annonce, contrairement à « viande », qui aurait une connotation culinaire et atténuerait l’horreur.
- source_word: בְּנֵיכֶם
  choice: de vos fils
  rationale: Le masculin pluriel est conservé, puisque le membre parallèle nomme explicitement les filles.
- source_word: וּבְשַׂר
  choice: et ... la chair
  rationale: La répétition de « chair » est maintenue afin de préserver le parallélisme et l’insistance de l’hébreu.
- source_word: בְּנֹתֵיכֶם
  choice: de vos filles
  rationale: Traduction directe qui préserve le couple explicite « fils / filles » du texte source.
- source_word: תֹּאכֵלוּ
  choice: vous mangerez
  rationale: Le second verbe, répété en hébreu, est également répété en français pour conserver l’emphase et la structure parallèle.
theological_decisions:
- issue: Formulation d’une malédiction de l’alliance annonçant le cannibalisme
  choice: 'Annonce prédictive directe : « Vous mangerez la chair de vos fils… de vos filles. »'
  alternative: Une formulation atténuée ou euphémisée
  rationale: Le texte présente sans détour cette conséquence extrême du jugement. La traduction en conserve la gravité sans lui ajouter d’explication théologique.
translation_notes:
  register: Français moderne, international et digne. La formulation reste volontairement directe et sobre. Le parallélisme hébreu est préservé par la répétition de « vous mangerez la chair ».
