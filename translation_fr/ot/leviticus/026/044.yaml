id: LEV.26.44
reference: Leviticus 26:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַף גַּם זֹ֠את בִּֽ/הְיוֹתָ֞/ם בְּ/אֶ֣רֶץ אֹֽיְבֵי/הֶ֗ם לֹֽא מְאַסְתִּ֤י/ם וְ/לֹֽא גְעַלְתִּי/ם֙ לְ/כַלֹּתָ֔/ם לְ/הָפֵ֥ר בְּרִיתִ֖/י אִתָּ֑/ם כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/044.yaml
  text: Yet even then[a], when they are in the land of their enemies, I will not reject them, and I will not abhor them so as to destroy them, to break my covenant with them[c][b]; for I am Yahweh their God.
translation:
  language: fr
  text: Pourtant, même alors, quand ils seront dans le pays de leurs ennemis, je ne les rejetterai pas et je ne les prendrai pas en horreur au point de les anéantir[a] et de rompre mon alliance avec eux. En effet, je suis Yahweh, leur Dieu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les exterminer », « en finir avec eux » ou « les consumer entièrement ».'
    reason: lexical_alternative
  - marker: b
    text: « Yahweh » transcrit le nom divin représenté en hébreu par les quatre lettres YHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַף גַּם זֹאת
  choice: Pourtant, même alors
  rationale: La combinaison marque une forte concession en lien avec les jugements précédents. Cette formulation idiomatique exprime que, même dans cette situation, l’engagement divin demeure.
- source_word: בִּהְיוֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: quand ils seront dans le pays de leurs ennemis
  rationale: L’infinitif construit précédé de ב indique la circonstance temporelle. Le futur convient au cadre prospectif de l’exil annoncé.
- source_word: לֹא מְאַסְתִּים
  choice: je ne les rejetterai pas
  rationale: מָאַס exprime ici le rejet ou la répudiation. « Rejeter » rend clairement la dimension relationnelle et liée à l’alliance.
- source_word: וְלֹא גְעַלְתִּים
  choice: je ne les prendrai pas en horreur
  rationale: גָּעַל désigne une vive répulsion. « Prendre en horreur » conserve cette force dans un français actuel et digne.
- source_word: לְכַלֹּתָם
  choice: au point de les anéantir
  rationale: L’infinitif en ל peut exprimer ici le résultat ou la finalité des verbes précédents. « Au point de » rend le seuil de destruction totale sans imposer trop étroitement une seule nuance syntaxique.
- source_word: לְהָפֵר בְּרִיתִי אִתָּם
  choice: et de rompre mon alliance avec eux
  rationale: הֵפֵר appliqué à une alliance signifie la rompre, l’annuler ou la rendre sans effet. « Rompre mon alliance » est naturel et précis.
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיהֶם
  choice: En effet, je suis Yahweh, leur Dieu
  rationale: כִּי introduit le fondement de la déclaration précédente. Le nom divin est translittéré « Yahweh », et la ponctuation française clarifie l’apposition.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme. La translittération préserve le nom d’alliance sans lui substituer un titre.
- issue: Valeur temporelle des formes qatal מְאַסְתִּים et גְעַלְתִּים
  choice: 'futur : « je ne les rejetterai pas… je ne les prendrai pas en horreur »'
  alternative: 'passé composé : « je ne les ai pas rejetés… »'
  rationale: Bien que les verbes soient morphologiquement au qatal, le contexte présente la situation annoncée du peuple chez ses ennemis et l’engagement divin qui y demeurera valable. Le futur français communique cette portée prospective sans prétendre que le qatal équivaut mécaniquement à un futur.
- issue: Rapport des infinitifs לְכַלֹּתָם et לְהָפֵר
  choice: 'résultat ou finalité : « au point de les anéantir et de rompre… »'
  alternative: 'deux finalités indépendantes : « afin de les anéantir, afin de rompre… »'
  rationale: La formulation retenue rattache les deux infinitifs au refus divin exprimé par les verbes précédents, tout en conservant leur parallélisme et le lien entre anéantissement du peuple et rupture de l’alliance.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme négatif de l’hébreu est conservé, tandis que « au point de » rend naturellement la portée des infinitifs. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
