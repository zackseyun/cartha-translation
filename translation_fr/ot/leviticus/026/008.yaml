source:
  edition: WLC
  text: וְ/רָדְפ֨וּ מִ/כֶּ֤ם חֲמִשָּׁה֙ מֵאָ֔ה וּ/מֵאָ֥ה מִ/כֶּ֖ם רְבָבָ֣ה יִרְדֹּ֑פוּ וְ/נָפְל֧וּ אֹיְבֵי/כֶ֛ם לִ/פְנֵי/כֶ֖ם לֶ/חָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/008.yaml
  text: Five of you will chase a hundred[a], and a hundred of you will chase ten thousand[b], and your enemies will fall before you by the sword.
translation:
  language: fr
  text: Cinq d’entre vous en poursuivront cent[a], et cent d’entre vous en poursuivront dix mille[b] ; vos ennemis tomberont devant vous sous l’épée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en pourchasseront cent » ; de même dans la proposition suivante.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut désigner « dix mille » ou « une multitude » ; ici, « dix mille » correspond au parallélisme numérique.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָדְפוּ / יִרְדֹּפוּ
  choice: poursuivront
  rationale: Le verbe רדף signifie poursuivre ou pourchasser. « Poursuivre » est naturel en français actuel et convient au contexte militaire sans ajouter l’idée explicite de capture.
- source_word: מִכֶּם
  choice: d’entre vous
  rationale: 'La préposition מן a ici un sens partitif : cinq, puis cent, pris parmi le peuple.'
- source_word: חֲמִשָּׁה מֵאָה
  choice: Cinq d’entre vous en poursuivront cent
  rationale: La formulation rend directement le rapport numérique du texte hébreu ; le pronom « en » évite une répétition lourde tout en désignant implicitement des adversaires.
- source_word: רְבָבָה
  choice: dix mille
  rationale: Le nom peut désigner dix mille ou une multitude innombrable. La valeur numérique précise convient au parallélisme croissant avec cent.
- source_word: וְנָפְלוּ
  choice: tomberont
  rationale: Ce choix conserve l’image concrète et sobre du verbe נפל dans un contexte de combat.
- source_word: אֹיְבֵיכֶם
  choice: vos ennemis
  rationale: Équivalent français direct du nom אֹיֵב dans cette promesse militaire.
- source_word: לִפְנֵיכֶם
  choice: devant vous
  rationale: L’expression française « tomber devant vous » reproduit l’image hébraïque d’une défaite infligée en présence du peuple.
- source_word: לֶחָרֶב
  choice: sous l’épée
  rationale: Dans ce contexte militaire, la préposition ל marque le moyen ou la puissance qui cause leur chute. « Sous l’épée » conserve l’image tout en restant idiomatique et solennel.
theological_decisions:
- issue: Promesse militaire de bénédiction dans le cadre de l’alliance
  choice: Conserver la promesse concrète d’une victoire extrêmement disproportionnée.
  alternative: Transformer les nombres en une affirmation générale de courage ou de succès.
  rationale: Le texte énonce directement des rapports numériques et la chute des ennemis. La traduction ne doit ni atténuer cette promesse ni décider si les nombres sont rhétoriques ou strictement littéraux.
translation_notes:
  register: Français international moderne, digne et lisible. La structure parallèle et l’image militaire sont conservées. Le point-virgule marque la progression vers la conséquence finale sans alourdir la phrase.
