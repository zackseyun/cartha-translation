source:
  edition: WLC
  text: אַף אֲנִ֗י אֵלֵ֤ךְ עִמָּ/ם֙ בְּ/קֶ֔רִי וְ/הֵבֵאתִ֣י אֹתָ֔/ם בְּ/אֶ֖רֶץ אֹיְבֵי/הֶ֑ם אוֹ אָ֣ז יִכָּנַ֗ע לְבָבָ/ם֙ הֶֽ/עָרֵ֔ל וְ/אָ֖ז יִרְצ֥וּ אֶת עֲוֺנָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/041.yaml
  text: I too will walk contrary to them and bring them into the land of their enemies[a]; or then their uncircumcised heart will be humbled[e][d][c][b], and then they will accept the punishment for their iniquity.
translation:
  language: fr
  text: Moi aussi, je marcherai contre eux[a] et je les conduirai dans le pays de leurs ennemis. Ou alors[b], leur cœur incirconcis[c] s’humiliera, et alors ils accepteront la peine due à leur faute[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je marcherai avec eux dans l’opposition » ; cette formule reprend le langage des malédictions de l’alliance dans ce chapitre.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit « ou alors ». La construction est difficile et peut introduire le moment où leur cœur s’humilie.
    reason: alternative_reading
  - marker: c
    text: « Cœur incirconcis » est une métaphore liée à l’alliance qui évoque l’obstination et l’impureté intérieures.
    reason: cultural_note
  - marker: d
    text: 'Autres traductions possibles : « ils répareront leur faute » ou « ils subiront la conséquence de leur faute ». L’expression hébraïque évoque le fait d’accepter ou de porter la peine due.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַף אֲנִי
  choice: Moi aussi
  rationale: 'La tournure hébraïque souligne la réciprocité de l’action divine : puisqu’ils se sont opposés à Dieu, lui aussi agira envers eux en conséquence.'
- source_word: אֵלֵךְ עִמָּם בְּקֶרִי
  choice: je marcherai contre eux
  rationale: Cette formulation conserve l’image répétée dans le chapitre et rend קֶרִי comme une attitude d’opposition, sans l’aplatir en simple hostilité abstraite.
- source_word: וְהֵבֵאתִי אֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: je les conduirai dans le pays de leurs ennemis
  rationale: Le hiphil de בוא exprime ici le fait de faire venir ou de conduire. « Dans le pays de leurs ennemis » rend naturellement le cadre de l’exil.
- source_word: אוֹ אָז
  choice: Ou alors
  rationale: La syntaxe hébraïque est difficile. « Ou alors » maintient la valeur disjonctive et la tension du texte au lieu de la transformer silencieusement en condition explicite.
- source_word: יִכָּנַע
  choice: s’humiliera
  rationale: Avec le cœur pour sujet, le niphal de כנע évoque l’abaissement intérieur. La forme pronominale est naturelle en français tout en restant compatible avec l’idée d’être humilié ou soumis.
- source_word: לְבָבָם הֶעָרֵל
  choice: leur cœur incirconcis
  rationale: La métaphore d’alliance est conservée littéralement afin de préserver son poids théologique et ses liens avec d’autres textes bibliques.
- source_word: וְאָז יִרְצוּ אֶת עֲוֺנָם
  choice: ils accepteront la peine due à leur faute
  rationale: L’expression désigne ici le fait d’assumer ou de subir la conséquence due à la faute. Cette formulation évite de suggérer qu’ils produiraient eux-mêmes une expiation méritoire.
theological_decisions:
- issue: Métaphore de l’incirconcision appliquée au cœur
  choice: Conserver « leur cœur incirconcis »
  alternative: « leur cœur obstiné » ou « leur cœur impénitent »
  rationale: Le texte emploie une métaphore liée à l’alliance, plus riche qu’une simple description psychologique. La conserver évite de réduire sa portée et maintient les échos avec le Deutéronome et les prophètes.
- issue: Sens de יִרְצוּ אֶת עֲוֺנָם
  choice: « ils accepteront la peine due à leur faute »
  alternative: « ils répareront leur faute » ou « leur faute sera acquittée »
  rationale: Le contexte porte sur l’acceptation ou le règlement de la conséquence judiciaire de la faute, sans préciser un mécanisme doctrinal d’expiation. La traduction garde cette tension.
- issue: Relation logique introduite par אוֹ אָז
  choice: Conserver la disjonction par « Ou alors »
  alternative: 'Introduire une condition explicite : « si alors » ou « jusqu’à ce que »'
  rationale: L’hébreu est syntaxiquement difficile. Une traduction disjonctive préserve l’ambiguïté réelle plutôt que de fixer une relation logique non explicitée.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve les images bibliques de « marcher contre » et du « cœur incirconcis ». « Faute » rend ici עָוֹן de façon naturelle, tandis que « la peine due » explicite sobrement sa conséquence judiciaire. La ponctuation maintient l’énigmatique « Ou alors » sans résoudre artificiellement la syntaxe.
