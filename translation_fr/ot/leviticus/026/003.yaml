source:
  edition: WLC
  text: אִם בְּ/חֻקֹּתַ֖/י תֵּלֵ֑כוּ וְ/אֶת מִצְוֺתַ֣/י תִּשְׁמְר֔וּ וַ/עֲשִׂיתֶ֖ם אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/003.yaml
  text: If you walk in my statutes and keep my commandments and do them,[a]
translation:
  language: fr
  text: Si vous marchez selon mes prescriptions[a] et observez mes commandements et les mettez en pratique,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « suivez mes prescriptions ». L’hébreu dit littéralement « marchez dans mes prescriptions », un idiome d’alliance désignant une vie conduite en accord avec elles.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit explicitement la condition qui ouvre la formulation d’alliance. « Si » en conserve la force conditionnelle.
- source_word: בְּחֻקֹּתַי
  choice: selon mes prescriptions
  rationale: חֻקּוֹת désigne des prescriptions établies. Avec הלך, la préposition ב exprime ici la règle selon laquelle la conduite doit s’ordonner. « Prescriptions » maintient la nuance juridique et covenantale.
- source_word: תֵּלֵכוּ
  choice: vous marchez
  rationale: Le verbe signifie littéralement « marcher » et désigne, dans cet emploi, la manière de vivre. Conserver la métaphore maintient la texture de l’hébreu tout en restant intelligible en français.
- source_word: מִצְוֺתַי
  choice: mes commandements
  rationale: מִצְוָה désigne un commandement ou un ordre. « Commandements » convient au registre juridique du passage et se distingue naturellement de « prescriptions ».
- source_word: תִּשְׁמְרוּ
  choice: vous gardez
  rationale: Dans un contexte juridique, שׁמר signifie garder ou observer des commandements. « Garder » préserve l’image de vigilance et demeure naturel dans ce registre biblique.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: et les mettez en pratique
  rationale: L’expression désigne l’accomplissement concret des commandements. « Mettre en pratique » rend clairement cette dimension active sans ajouter de contenu.
theological_decisions:
- issue: Expression de l’obéissance dans l’alliance
  choice: Conserver la métaphore « marcher selon mes prescriptions »
  alternative: suivre mes prescriptions / vivre selon mes prescriptions
  rationale: L’hébreu associe une image de marche à la conduite conforme aux prescriptions divines. La formulation retenue préserve cette image et sa portée éthique sans réduire l’obéissance à une notion abstraite.
- issue: Portée de la condition
  choice: Répéter « si » devant le deuxième verbe
  alternative: Si vous marchez selon mes prescriptions, gardez mes commandements et les mettez en pratique
  rationale: En français, sans la répétition, « gardez » pourrait être compris comme un impératif. Le second « si » rend sans ambiguïté la coordination des conditions exprimées en hébreu, sans modifier leur contenu.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore biblique de la marche est conservée, tandis que « selon » évite le calque peu naturel « dans mes prescriptions ». La virgule finale est maintenue puisque le verset ouvre la proposition conditionnelle poursuivie au verset suivant.
