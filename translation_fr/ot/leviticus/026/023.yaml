  text: וְ/אִ֨ם בְּ/אֵ֔לֶּה לֹ֥א תִוָּסְר֖וּ לִ֑/י וַ/הֲלַכְתֶּ֥ם עִמִּ֖/י קֶֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/023.yaml
  text: And if by these things you are not corrected by me[a], but walk contrary to me,
translation:
  language: fr
  text: Si, par tout cela, vous ne vous laissez pas corriger par moi et que vous vous opposez à moi[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « marcher avec moi qeri ». Le sens précis de qeri dans cette expression est discuté ; il peut désigner une attitude d’opposition, de conduite contraire ou d’hostilité.'
    reason: L’expression hébraïque est rare et son sens précis demeure discuté ; la note préserve sa forme et son éventail sémantique.
lexical_decisions:
- source_word: בְּאֵלֶּה
  choice: par tout cela
  rationale: La préposition ב est comprise comme instrumentale et renvoie aux jugements précédemment décrits. « Par tout cela » conserve ce lien sans ajouter un nom absent de l’hébreu.
- source_word: תִוָּסְרוּ לִי
  choice: vous ne vous laissez pas corriger par moi
  rationale: Le niphal de יסר exprime ici une correction ou une discipline qui devrait produire un changement. La tournure pronominale française indique que la correction a lieu mais n’est pas accueillie, tandis que « par moi » rend naturellement la relation à Dieu exprimée par לִי.
- source_word: וַהֲלַכְתֶּם
  choice: mais que vous continuez
  rationale: Le verbe « marcher » décrit idiomatiquement une manière persistante de se conduire. « Continuez » restitue cette conduite durable, et « mais » marque le contraste avec la correction refusée.
- source_word: עִמִּי קֶרִי
  choice: à vous opposer à moi
  rationale: Cette expression rare de Lévitique 26 associe littéralement « avec moi » à un nom évoquant l’hostilité ou l’opposition. La formulation choisie est naturelle en français et conserve la dimension relationnelle et antagoniste.
theological_decisions:
- issue: Sens de l’expression d’alliance עִמִּי קֶרִי
  choice: vous opposer à moi
  alternative: vous conduire envers moi avec hostilité
  rationale: L’expression présente Israël comme persistant dans une relation d’opposition à l’Éternel. La traduction ne réduit pas cette attitude à une simple faute ponctuelle et n’introduit aucune catégorie théologique étrangère au texte.
translation_notes:
  register: Français international moderne, clair et digne. La proposition reste ouverte par une virgule, conformément à la continuité syntaxique avec le verset suivant.
