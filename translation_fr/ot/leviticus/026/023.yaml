    rationale: Le verbe hébreu « marcher » peut décrire une conduite habituelle, mais la traduction peut conserver ce sens sans ajouter le verbe « continuer ».
  - severity: medium
    issue: La note qualifie de littérale une formulation qui introduit « dans l’hostilité ».
    rationale: L’ordre et les mots de l’hébreu correspondent plutôt à « marcher avec moi qeri ». Il convient de distinguer la forme littérale de l’explication sémantique de qeri.
