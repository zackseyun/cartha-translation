  source_fidelity: 'Le sens du verset est bien rendu : la rupture de l’approvisionnement en pain, la cuisson par dix femmes dans un seul four, la restitution du pain au poids et l’absence de rassasiement correspondent à la séquence hébraïque. « Ce qui soutient votre pain » est toutefois sémantiquement maladroit : le pain est lui-même ce qui soutient la vie; l’idiome vise l’approvisionnement en pain.'
