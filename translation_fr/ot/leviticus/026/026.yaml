  text: בְּ/שִׁבְרִ֣/י לָ/כֶם֮ מַטֵּה לֶחֶם֒ וְ֠/אָפוּ עֶ֣שֶׂר נָשִׁ֤ים לַחְמְ/כֶם֙ בְּ/תַנּ֣וּר אֶחָ֔ד וְ/הֵשִׁ֥יבוּ לַחְמְ/כֶ֖ם בַּ/מִּשְׁקָ֑ל וַ/אֲכַלְתֶּ֖ם וְ/לֹ֥א תִשְׂבָּֽעוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/026.yaml
  text: When I break your supply of bread[a], ten women will bake your bread in a single oven and return your bread by weight; and you will eat, but you will not be satisfied.
translation:
  language: fr
  text: Quand je briserai votre approvisionnement en pain[a], dix femmes cuiront votre pain dans un seul four et vous rendront votre pain au poids. Vous mangerez, mais vous ne serez pas rassasiés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le bâton du pain », expression désignant l’approvisionnement en pain qui assure la subsistance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׁבְרִי
  choice: Quand je briserai
  rationale: L’infinitif construit précédé de בְּ introduit une proposition temporelle. « Briserai » conserve l’image forte du jugement annoncé.
- source_word: מַטֵּה לֶחֶם
  choice: ce qui soutient votre pain
  rationale: L’expression signifie littéralement « le bâton du pain ». Cette formulation garde l’image du soutien tout en rendant intelligible l’idée de la ressource nourricière.
- source_word: וְאָפוּ עֶשֶׂר נָשִׁים
  choice: dix femmes cuiront
  rationale: Le sujet féminin explicite est conservé, et le parfait coordonné reçoit sa valeur future dans la suite des conséquences annoncées.
- source_word: בְּתַנּוּר אֶחָד
  choice: dans un seul four
  rationale: '« Un seul » souligne la pénurie : le pain de dix foyers peut être cuit dans le même four.'
- source_word: וְהֵשִׁיבוּ לַחְמְכֶם בַּמִּשְׁקָל
  choice: et vous le rendront au poids
  rationale: Le hiphil de שׁוב exprime ici le fait de rendre le pain après sa cuisson; « au poids » conserve l’image du rationnement imposé par la disette.
- source_word: וְלֹא תִשְׂבָּעוּ
  choice: mais vous ne serez pas rassasiés
  rationale: שׂבע désigne le fait d’avoir mangé à satiété. « Rassasiés » est précis, naturel et explicitement lié à la faim.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La syntaxe conserve la progression du jugement et l’image concrète de la pénurie, sans transformer l’idiome en une paraphrase générale comme « vos réserves de nourriture ».
