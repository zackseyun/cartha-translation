source:
  edition: WLC
  text: וְ/כָשְׁל֧וּ אִישׁ בְּ/אָחִ֛י/ו כְּ/מִ/פְּנֵי חֶ֖רֶב וְ/רֹדֵ֣ף אָ֑יִן וְ/לֹא תִֽהְיֶ֤ה לָ/כֶם֙ תְּקוּמָ֔ה לִ/פְנֵ֖י אֹֽיְבֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/037.yaml
  text: They will stumble over one another as if before a sword[a], though no one is pursuing[b]; and you will have no power to stand before your enemies.
translation:
  language: fr
  text: Ils trébucheront les uns sur les autres, comme devant l’épée, sans que personne les poursuive ; et vous ne pourrez pas tenir devant vos ennemis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָשְׁלוּ
  choice: Ils trébucheront
  rationale: Le verbe כשל évoque le fait de trébucher ou de chanceler ; « trébucher » conserve l’image concrète de la panique.
- source_word: אִישׁ בְּאָחִיו
  choice: les uns sur les autres
  rationale: Littéralement « un homme contre son frère » ; la tournure distributive décrit ici des personnes qui se heurtent mutuellement dans la panique.
- source_word: כְּמִפְּנֵי חֶרֶב
  choice: comme devant l’épée
  rationale: Cette formulation reste proche de la comparaison hébraïque sans ajouter explicitement l’idée de fuite, que le contexte permet toutefois d’inférer.
- source_word: וְרֹדֵף אָיִן
  choice: alors même que personne ne les poursuivra
  rationale: L’hébreu affirme l’absence de poursuivant ; « alors même que » rend naturellement le contraste implicite avec leur panique.
- source_word: וְלֹא תִהְיֶה לָכֶם תְּקוּמָה
  choice: vous ne pourrez pas tenir
  rationale: תְּקוּמָה désigne ici la capacité de se maintenir, de résister ou de tenir ferme face à l’ennemi.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: devant vos ennemis
  rationale: Traduction directe et naturelle de לפני dans un contexte d’affrontement.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’image militaire et le contraste entre une panique sans poursuivant réel et l’incapacité à résister aux ennemis.
