source:
  edition: WLC
  text: וְ/הֵבֵאתִ֨י עֲלֵי/כֶ֜ם חֶ֗רֶב נֹקֶ֨מֶת֙ נְקַם בְּרִ֔ית וְ/נֶאֱסַפְתֶּ֖ם אֶל עָרֵי/כֶ֑ם וְ/שִׁלַּ֤חְתִּי דֶ֨בֶר֙ בְּ/ת֣וֹכְ/כֶ֔ם וְ/נִתַּתֶּ֖ם בְּ/יַד אוֹיֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/025.yaml
  text: And I will bring against you a sword executing the vengeance of the covenant[a], and you will be gathered into your cities. Then I will send pestilence among you, and you will be given into the hand of the enemy.
translation:
  language: fr
  text: Je ferai venir contre vous l’épée qui exécutera la vengeance de l’alliance[a], et vous serez rassemblés dans vos villes. Alors, j’enverrai la peste au milieu de vous, et vous serez livrés au pouvoir de l’ennemi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « qui exercera la vengeance liée à l’alliance », « qui vengera l’alliance » ou, de façon plus explicite, « qui exécutera le châtiment prévu par l’alliance ». L’hébreu emploie une formule emphatique, littéralement proche de « une épée vengeant la vengeance de l’alliance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי עֲלֵיכֶם
  choice: Je ferai venir contre vous
  rationale: Le hifil de בוא exprime ici la causation, et עַל prend dans ce contexte de jugement le sens hostile de « contre ».
- source_word: חֶרֶב נֹקֶמֶת נְקַם בְּרִית
  choice: l’épée qui exécutera la vengeance de l’alliance
  rationale: La tournure française conserve le lien judiciaire entre l’épée, la vengeance et l’alliance. Le participe suivi du nom de même racine est emphatique en hébreu; « exécutera la vengeance » en restitue la force sans produire la lourdeur de « vengera la vengeance ».
- source_word: וְנֶאֱסַפְתֶּם אֶל עָרֵיכֶם
  choice: et vous vous regrouperez dans vos villes
  rationale: Le nifal de אסף peut avoir une valeur moyenne ou passive. Dans le contexte d’un siège, il décrit le rassemblement ou le repli de la population à l’intérieur des villes; « vous vous regrouperez » reste naturel tout en évitant de préciser qui les y rassemble.
- source_word: וְשִׁלַּחְתִּי דֶבֶר בְּתוֹכְכֶם
  choice: Alors, j’enverrai la peste au milieu de vous
  rationale: דֶבֶר désigne une épidémie meurtrière dans les formules de malédiction; « la peste » est clair et digne en français. « Alors » rend la progression contextuelle du waw.
- source_word: וְנִתַּתֶּם בְּיַד אוֹיֵב
  choice: et vous serez livrés au pouvoir de l’ennemi
  rationale: Le nifal de נתן indique ici que le peuple sera livré à l’ennemi. L’expression בְּיַד est un idiome de domination; « au pouvoir de » en communique naturellement le sens en français moderne.
theological_decisions:
- issue: Sens de « la vengeance de l’alliance »
  choice: Conserver la formule comme désignation du jugement lié à l’alliance
  alternative: « la vengeance pour l’alliance » ou « le châtiment prévu par l’alliance »
  rationale: 'Le rapport construit entre נְקַם et בְּרִית permet plusieurs nuances proches: vengeance fondée sur l’alliance, exercée pour elle ou constituée par ses sanctions. La formulation retenue préserve cette tension plutôt que de la résoudre.'
translation_notes:
  register: Français international moderne, clair et soutenu. « L’épée », « la peste » et « l’alliance » maintiennent la gravité du registre biblique sans archaïsme. La note conserve l’emphase et l’ambiguïté de la formule hébraïque.
