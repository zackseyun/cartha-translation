  terminology: « Sabbats » convient, avec une note précisant qu’il s’agit dans ce contexte du repos sabbatique de la terre, particulièrement des années sabbatiques. « Désolation » est préférable à « dévastée » pour refléter le nom hébreu et préserver le registre biblique moderne.
