  source_fidelity: 'Le sens général est fidèle : le pays est sujet des deux verbes, la durée de la désolation est totale, et la référence aux sabbats antérieurs durant l’occupation du pays est conservée. Toutefois, « où elle sera dévastée » transforme de façon moins directe le syntagme nominal hébreu « les jours de sa désolation », et « prendre le repos » ne rend pas naturellement la reprise verbale de שׁבת.'
