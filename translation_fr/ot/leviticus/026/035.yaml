  text: כָּל יְמֵ֥י הָשַּׁמָּ֖/ה תִּשְׁבֹּ֑ת אֵ֣ת אֲשֶׁ֧ר לֹֽא שָׁבְתָ֛ה בְּ/שַׁבְּתֹתֵי/כֶ֖ם בְּ/שִׁבְתְּ/כֶ֥ם עָלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/035.yaml
  text: All the days of its desolation it shall rest—the rest that it did not have during your Sabbaths[b][a], while you were dwelling on it.
translation:
  language: fr
  text: Tous les jours de sa désolation, elle se reposera — du repos dont elle n’avait pas joui pendant vos sabbats[a], alors que vous y habitiez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « vos sabbats » désigne les repos sabbatiques dus à la terre, notamment les années sabbatiques mentionnées dans le contexte.
    reason: cross_reference
lexical_decisions:
- source_word: כָּל יְמֵי הָשַּׁמָּה
  choice: Durant tous les jours où elle sera dévastée
  rationale: Cette formulation rend la totalité de la période exprimée par כָּל יְמֵי et comprend הָשַּׁמָּה comme l’état de dévastation du pays. La reprise pronominale « elle » renvoie à la terre, de genre féminin en hébreu comme en français.
- source_word: תִּשְׁבֹּת ... לֹא שָׁבְתָה
  choice: 'elle se reposera : elle prendra le repos qu’elle n’a pas pris'
  rationale: La traduction conserve la répétition du verbe שׁבת et son contraste temporel. « Prendre le repos » explicite naturellement en français la construction objet אֵת אֲשֶׁר sans effacer l’écho verbal.
- source_word: בְּשַׁבְּתֹתֵיכֶם
  choice: pendant vos sabbats
  rationale: « Sabbats » reste proche du pluriel hébreu et préserve son lien avec les repos sabbatiques dus à la terre dans le contexte immédiat.
- source_word: בְּשִׁבְתְּכֶם עָלֶיהָ
  choice: lorsque vous habitiez sur elle
  rationale: L’infinitif construit exprime la circonstance temporelle du séjour d’Israël sur la terre. « Sur elle » garde explicite le référent féminin du suffixe hébreu.
theological_decisions:
- issue: Sens de « vos sabbats »
  choice: Conserver « vos sabbats » dans le texte et préciser en note qu’il s’agit ici des repos sabbatiques dus à la terre.
  alternative: Traduire directement « pendant vos années sabbatiques ».
  rationale: Le pluriel hébreu est plus large dans sa forme, tandis que le contexte de Lévitique 26.34-35 vise particulièrement les périodes de repos de la terre. La note permet de respecter à la fois la formulation et le contexte.
translation_notes:
  register: Français moderne, digne et accessible. Le futur exprime la conséquence annoncée. Les deux occurrences liées à la racine hébraïque « se reposer » sont maintenues afin de préserver l’insistance du texte.
