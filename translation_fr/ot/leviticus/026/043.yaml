  text: וְ/הָ/אָרֶץ֩ תֵּעָזֵ֨ב מֵ/הֶ֜ם וְ/תִ֣רֶץ אֶת שַׁבְּתֹתֶ֗י/הָ בָּ/הְשַׁמָּ/ה֙ מֵ/הֶ֔ם וְ/הֵ֖ם יִרְצ֣וּ אֶת עֲוֺנָ֑/ם יַ֣עַן וּ/בְ/יַ֔עַן בְּ/מִשְׁפָּטַ֣/י מָאָ֔סוּ וְ/אֶת חֻקֹּתַ֖/י גָּעֲלָ֥ה נַפְשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/043.yaml
  text: But the land will be abandoned by them and will enjoy its Sabbaths while it lies desolate without them[a], and they will accept the punishment for their iniquity, because—indeed, because—they rejected my judgments and their soul abhorred my statutes.
translation:
  language: fr
  text: Mais le pays sera abandonné par eux et jouira de ses sabbats pendant qu’il restera dévasté, sans eux. Quant à eux, ils subiront la peine de leur faute[a], parce que, oui, parce qu’ils ont rejeté mes jugements et ont eu mes prescriptions en horreur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils accepteront leur faute » ou « ils expieront leur faute ». L’expression hébraïque peut se comprendre de plusieurs façons ; elle est rendue ici dans son sens judiciaire, conformément au contexte des sanctions de l’alliance.
    reason: Ambiguïté lexicale et judiciaire de יִרְצוּ אֶת עֲוֺנָם.
lexical_decisions:
- source_word: תֵּעָזֵב
  choice: sera délaissé
  rationale: Le nifal exprime l’état du pays laissé par ses habitants. « Délaissé » conserve le passif et convient au départ forcé du peuple.
- source_word: וְתִרֶץ אֶת שַׁבְּתֹתֶיהָ
  choice: jouira de ses sabbats
  rationale: Dans ce contexte, le verbe indique que le pays reçoit enfin les repos sabbatiques qui lui étaient dus; cette formulation garde aussi le vocabulaire de l’alliance.
- source_word: בָּהְשַׁמָּה מֵהֶם
  choice: pendant qu’il restera dévasté, sans eux
  rationale: La tournure rend à la fois l’état de désolation du pays et l’absence de ses habitants.
- source_word: יִרְצוּ אֶת עֲוֺנָם
  choice: ils subiront la peine de leur faute
  rationale: Dans le cadre des sanctions de l’alliance, l’expression désigne vraisemblablement le fait de porter ou d’acquitter la conséquence judiciaire de la faute. Une note conserve les autres compréhensions possibles.
- source_word: יַעַן וּבְיַעַן
  choice: parce que — oui, parce que —
  rationale: La répétition rend l’insistance inhabituelle de la locution causale hébraïque.
- source_word: בְּמִשְׁפָּטַי
  choice: mes règles
  rationale: Le terme désigne ici les règles ou décisions normatives de l’alliance; « règles » est clair en français moderne et reste distinct de « prescriptions ».
- source_word: חֻקֹּתַי
  choice: mes prescriptions
  rationale: « Prescriptions » rend naturellement les dispositions établies et maintient une distinction lexicale avec מִשְׁפָּטַי.
- source_word: גָּעֲלָה נַפְשָׁם
  choice: ils ont eu … en horreur
  rationale: La construction idiomatique française communique pleinement le profond dégoût exprimé par געל. Le collectif נַפְשָׁם n’est pas calqué par « leur âme », formulation peu naturelle ici.
theological_decisions:
- issue: Sens de עָוֹן dans יִרְצוּ אֶת עֲוֺנָם
  choice: 'la conséquence pénale: « ils subiront la peine de leur faute »'
  alternative: « ils accepteront leur faute » ou « ils expieront leur faute »
  rationale: Le contexte immédiat porte sur le jugement de l’alliance, l’exil et les sabbats rendus au pays. Le sens pénal est donc probable, sans faire de cette souffrance une expiation méritoire. La note signale néanmoins l’ambiguïté réelle de l’idiome.
- issue: Expression anthropologique גָּעֲלָה נַפְשָׁם
  choice: 'tournure personnelle idiomatique: « ils ont eu … en horreur »'
  alternative: 'calque: « leur âme a eu … en horreur »'
  rationale: נֶפֶשׁ peut désigner la personne elle-même. Le français idiomatique évite ici de suggérer une doctrine particulière de la composition humaine.
translation_notes:
  register: Français international moderne, digne et accessible. « Sabbats » préserve le terme d’alliance; « pays » reprend le référent territorial de הָאָרֶץ. La ponctuation met en relief la causalité emphatique sans alourdir excessivement la phrase.
