id: LEV.26.30
reference: Leviticus 26:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִשְׁמַדְתִּ֞י אֶת בָּמֹֽתֵי/כֶ֗ם וְ/הִכְרַתִּי֙ אֶת חַמָּ֣נֵי/כֶ֔ם וְ/נָֽתַתִּי֙ אֶת פִּגְרֵי/כֶ֔ם עַל פִּגְרֵ֖י גִּלּוּלֵי/כֶ֑ם וְ/גָעֲלָ֥ה נַפְשִׁ֖/י אֶתְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/030.yaml
  text: And I will destroy your high places[a], and cut down your incense altars, and place your corpses on the carcasses of your idols[b], and my soul will abhor you.
translation:
  language: fr
  text: Je détruirai vos hauts lieux et j’abattrai vos autels à encens[a] ; je déposerai vos cadavres sur les cadavres de vos idoles[b], et mon âme vous prendra en horreur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos piliers solaires ». Le terme hébreu désigne des objets liés à un culte illicite ; leur forme et leur fonction exactes sont discutées.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie deux fois le même mot, « cadavres », pour les personnes et pour leurs idoles, soulignant que celles-ci sont sans vie et vouées au déshonneur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁמַדְתִּי
  choice: Je détruirai
  rationale: Le hiphil de שׁמד exprime ici la destruction des installations cultuelles ; « détruire » est fort, naturel et précis.
- source_word: בָּמֹתֵיכֶם
  choice: vos hauts lieux
  rationale: במות désigne couramment des lieux de culte, souvent aménagés sur des hauteurs ; « hauts lieux » est l’équivalent français consacré et demeure intelligible.
- source_word: וְהִכְרַתִּי
  choice: j’abattrai
  rationale: כרת signifie littéralement couper ou retrancher. Devant des objets cultuels, « abattre » conserve l’image d’une destruction physique.
- source_word: חַמָּנֵיכֶם
  choice: vos autels à encens
  rationale: חמנים désigne des objets cultuels dont la forme et la fonction exactes sont discutées, parfois associés au soleil ou à l’encens. La traduction fonctionnelle est lisible, avec l’autre possibilité signalée en note.
- source_word: וְנָתַתִּי
  choice: je déposerai
  rationale: נתן peut signifier mettre ou placer. « Déposer » convient à la disposition intentionnelle des cadavres sur les idoles, sans atténuer l’image.
- source_word: פִּגְרֵיכֶם עַל פִּגְרֵי גִּלּוּלֵיכֶם
  choice: vos cadavres sur les cadavres de vos idoles
  rationale: La répétition de פגר est conservée afin de faire ressortir l’assimilation déshonorante des idoles à des corps morts et impuissants.
- source_word: גִּלּוּלֵיכֶם
  choice: vos idoles
  rationale: גלולים est un terme méprisant pour les idoles. « Idoles » donne clairement le référent ; la violence dépréciative ressort aussi de l’image des cadavres.
- source_word: וְגָעֲלָה נַפְשִׁי אֶתְכֶם
  choice: et mon âme vous prendra en horreur
  rationale: La formulation conserve explicitement נפשי, « mon âme », et rend געלה par une expression française actuelle qui communique une répulsion intense.
theological_decisions:
- issue: Expression anthropopathique de la répulsion divine
  choice: mon âme vous prendra en horreur
  alternative: je vous prendrai en horreur
  rationale: Le texte attribue explicitement cette répulsion à « mon âme ». Maintenir cette formulation préserve la force rhétorique et la tension théologique du texte au lieu de la simplifier.
translation_notes:
  register: Français international moderne, digne et direct. La structure en série des jugements est conservée, ainsi que la répétition volontaire de « cadavres » et l’expression anthropopathique « mon âme ».
