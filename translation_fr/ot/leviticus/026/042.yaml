id: LEV.26.42
reference: Leviticus 26:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/זָכַרְתִּ֖י אֶת בְּרִיתִ֣/י יַעֲק֑וֹב וְ/אַף֩ אֶת בְּרִיתִ֨/י יִצְחָ֜ק וְ/אַ֨ף אֶת בְּרִיתִ֧/י אַבְרָהָ֛ם אֶזְכֹּ֖ר וְ/הָ/אָ֥רֶץ אֶזְכֹּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/042.yaml
  text: Then I will remember my covenant with Jacob[a], and also my covenant with Isaac, and also my covenant with Abraham I will remember; and I will remember the land.
translation:
  language: fr
  text: Alors je me souviendrai de mon alliance avec Jacob[a], et aussi de mon alliance avec Isaac ; et aussi de mon alliance avec Abraham, je me souviendrai, et je me souviendrai du pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et je me souviendrai ». La conjonction hébraïque peut se traduire simplement par « et » ; « alors » marque le lien du verset avec le contexte précédent.'
    reason: alternative lexicale et lien discursif
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: Alors je me souviendrai
  rationale: Le verbe זכר garde son sens explicite de « se souvenir », tout en impliquant, dans un contexte d’alliance, une disposition à agir. « Alors » exprime naturellement le lien avec le contexte conditionnel précédent ; la valeur plus littérale « Et » est signalée en note.
- source_word: בְּרִיתִי
  choice: mon alliance
  rationale: בְּרִית désigne ici l’engagement liant Dieu aux patriarches ; « alliance » est l’équivalent français établi et précis.
- source_word: יַעֲקֹב / יִצְחָק / אַבְרָהָם
  choice: Jacob / Isaac / Abraham
  rationale: 'Les noms sont rendus selon leur forme française biblique courante, dans l’ordre hébreu inversé : Jacob, Isaac, Abraham.'
- source_word: וְאַף
  choice: et aussi
  rationale: Cette expression conserve à la fois la coordination et la valeur additive, légèrement emphatique, de אַף.
- source_word: אֶזְכֹּר
  choice: je me souviendrai
  rationale: La répétition du verbe est maintenue afin de préserver l’insistance rhétorique de l’hébreu, notamment après Abraham puis à propos du pays.
- source_word: וְהָאָרֶץ
  choice: et du pays
  rationale: Dans ce contexte d’alliance, הָאָרֶץ désigne le pays promis. « Le pays » est naturel en français et évite que « la terre » soit compris comme la planète ou le sol.
theological_decisions:
- issue: Ordre et mise en relief des alliances patriarcales
  choice: Conserver l’ordre Jacob, Isaac, Abraham et répéter « mon alliance » pour chaque patriarche.
  alternative: Employer l’ordre chronologique Abraham, Isaac, Jacob, ou condenser en « mon alliance avec Abraham, Isaac et Jacob ».
  rationale: L’ordre inversé et la répétition appartiennent à la forme intentionnelle du texte hébreu ; les conserver évite d’y substituer une formule traditionnelle plus lisse.
- issue: Sens du souvenir divin
  choice: Traduire par « je me souviendrai » sans expliciter l’action qui peut en découler.
  alternative: « Je m’en souviendrai et j’agirai » ou « je renouvellerai ».
  rationale: Dans les contextes d’alliance, le souvenir divin comporte une portée active, mais le texte emploie simplement זכר. La traduction préserve donc cette tension sans ajouter une interprétation.
- issue: Réitération de « je me souviendrai »
  choice: Maintenir la reprise marquée après Abraham ainsi que devant « le pays ».
  alternative: Lisser la phrase en coordonnant simplement les trois alliances et le pays sous un seul verbe.
  rationale: La répétition produit une insistance réelle dans l’hébreu et distingue particulièrement l’alliance avec Abraham puis le souvenir du pays.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe volontairement répétitive reflète l’insistance de l’hébreu. Le point-virgule aide à rendre lisible la reprise emphatique du verbe sans la supprimer.
