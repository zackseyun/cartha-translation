  text: וְ/שָׁבַרְתִּ֖י אֶת גְּא֣וֹן עֻזְּ/כֶ֑ם וְ/נָתַתִּ֤י אֶת שְׁמֵי/כֶם֙ כַּ/בַּרְזֶ֔ל וְ/אֶֽת אַרְצְ/כֶ֖ם כַּ/נְּחֻשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/019.yaml
  text: And I will break the pride of your strength[b][a], and I will make your heavens like iron and your land like bronze.
translation:
  language: fr
  text: Je briserai l’orgueil de votre force, et je rendrai votre ciel[a] pareil au fer et votre terre pareille au bronze[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vos cieux ». En hébreu, le mot est au pluriel, forme souvent employée pour désigner le ciel au-dessus de la terre.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « cuivre ». Le terme hébreu peut désigner le cuivre ou le bronze.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבַרְתִּי
  choice: Je briserai
  rationale: Le verbe שׁבר signifie couramment « briser ». Ce choix conserve la vigueur de l’image sans l’intensifier inutilement.
- source_word: גְּאוֹן עֻזְּכֶם
  choice: l’orgueil que vous tirez de votre force
  rationale: גָּאוֹן peut exprimer l’orgueil, l’élévation ou la majesté, et עֹז la force ou la puissance. Cette formulation française naturelle préserve ici l’idée négative d’une confiance orgueilleuse fondée sur la force.
- source_word: וְנָתַתִּי
  choice: et je rendrai
  rationale: Bien que נתן signifie littéralement « donner » ou « placer », la construction exprime ici le fait de rendre le ciel et la terre semblables à des métaux durs.
- source_word: שְׁמֵיכֶם
  choice: votre ciel
  rationale: L’hébreu emploie la forme plurielle « vos cieux », mais celle-ci désigne ici le ciel au-dessus du pays. Le singulier est l’expression française courante dans ce contexte agricole.
- source_word: כַּבַּרְזֶל
  choice: pareil au fer
  rationale: La comparaison évoque un ciel dur et inflexible, qui ne donne pas de pluie, tout en maintenant l’image du texte.
- source_word: אַרְצְכֶם
  choice: votre terre
  rationale: אֶרֶץ peut désigner la terre, le pays ou le sol. « Votre terre » convient à la fois au cadre territorial et au contexte agricole.
- source_word: כַּנְּחֻשָׁה
  choice: pareille au bronze
  rationale: נְחֻשָׁה peut désigner le cuivre ou le bronze. « Bronze » correspond à l’usage biblique courant et conserve l’image d’une terre dure et improductive.
theological_decisions:
- issue: Portée métaphorique de la malédiction
  choice: Conserver l’image d’un ciel semblable au fer et d’une terre semblable au bronze, évocatrice de sécheresse et de stérilité.
  alternative: Expliciter directement que le ciel ne donnera plus de pluie et que le sol ne produira plus.
  rationale: Le contexte des malédictions de l’alliance soutient l’idée de sécheresse et de stérilité agricole, mais le verset l’exprime par une métaphore qu’il convient de préserver.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe reste proche de l’image hébraïque, tandis que « l’orgueil que vous tirez de votre force » évite une tournure nominale peu naturelle en français.
