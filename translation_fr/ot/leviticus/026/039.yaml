source:
  edition: WLC
  text: וְ/הַ/נִּשְׁאָרִ֣ים בָּ/כֶ֗ם יִמַּ֨קּוּ֙ בַּֽ/עֲוֺנָ֔/ם בְּ/אַרְצֹ֖ת אֹיְבֵי/כֶ֑ם וְ/אַ֛ף בַּ/עֲוֺנֹ֥ת אֲבֹתָ֖/ם אִתָּ֥/ם יִמָּֽקּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/039.yaml
  text: And those of you who remain will waste away in the lands of your enemies because of their iniquity[b][a]; and also because of the iniquities of their fathers with them they will waste away.
translation:
  language: fr
  text: Ceux d’entre vous qui resteront dépériront[a] à cause de leur faute dans les pays de vos ennemis. Ils dépériront aussi à cause des fautes de leurs pères, qui sont avec eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se consumeront » ou « tomberont en décrépitude » ; le verbe hébreu évoque le dépérissement ou la décomposition sous le jugement.
    reason: lexical_alternative
  - marker: b
    text: La construction hébraïque est concise et ambiguë. « Avec eux » peut indiquer que les fautes de leurs pères demeurent avec eux, ou qu’ils dépérissent sous le poids ou les effets persistants de ces fautes.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַנִּשְׁאָרִים בָּכֶם
  choice: Ceux d’entre vous qui resteront
  rationale: Le participe désigne les personnes laissées en vie après le jugement, et בָּכֶם les présente comme appartenant au peuple directement interpellé.
- source_word: יִמַּקּוּ
  choice: dépériront
  rationale: Le nifal de מקק évoque le fait de se consumer, de dépérir ou de se décomposer sous le jugement. « Dépérir » est naturel en français et convient aux deux occurrences.
- source_word: בַּעֲוֺנָם
  choice: à cause de leur faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou ses conséquences. Ici, la préposition ב est comprise dans un sens causal, sans effacer l’éventail sémantique du nom.
- source_word: בְּאַרְצֹת אֹיְבֵיכֶם
  choice: dans les pays de leurs ennemis
  rationale: « Pays » rend naturellement le pluriel hébreu et correspond au contexte de dispersion en territoires étrangers. Le passage de « vos » à « leurs » suit le changement syntaxique vers la troisième personne en français.
- source_word: וְאַף
  choice: aussi
  rationale: Ce terme ajoute et intensifie le second motif du dépérissement sans exiger une tournure française lourde.
- source_word: בַּעֲוֺנֹת אֲבֹתָם
  choice: à cause des fautes de leurs pères
  rationale: Le pluriel « fautes » est conservé, de même que l’image des « pères », qui peut désigner les générations précédentes sans imposer une reformulation interprétative.
- source_word: אִתָּם
  choice: qui sont avec eux
  rationale: Cette formulation rattache naturellement « avec eux » aux fautes des pères tout en conservant l’idée, concise dans l’hébreu, que ces fautes accompagnent encore les survivants. Une note signale l’ambiguïté de la construction.
theological_decisions:
- issue: Faute personnelle et fautes des générations précédentes
  choice: Conserver distinctement leur propre faute et les fautes de leurs pères comme causes du dépérissement.
  alternative: Limiter le second membre aux seules conséquences historiques des fautes ancestrales, ou l’expliquer comme une répétition personnelle des mêmes fautes.
  rationale: Le texte nomme explicitement les deux réalités. La traduction ne doit ni supprimer la dimension intergénérationnelle du jugement ni définir plus précisément que l’hébreu le rapport entre culpabilité personnelle et fautes ancestrales.
translation_notes:
  register: Français international moderne, sobre et digne. « Dépérir » restitue la gravité de la malédiction sans archaïsme excessif. La répétition du verbe, présente dans l’hébreu, est maintenue. Les marqueurs [a] et [b] figurent tous deux dans le texte.
