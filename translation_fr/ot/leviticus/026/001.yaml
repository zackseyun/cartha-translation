id: LEV.26.1
reference: Leviticus 26:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹֽא תַעֲשׂ֨וּ לָ/כֶ֜ם אֱלִילִ֗ם וּ/פֶ֤סֶל וּ/מַצֵּבָה֙ לֹֽא תָקִ֣ימוּ לָ/כֶ֔ם וְ/אֶ֣בֶן מַשְׂכִּ֗ית לֹ֤א תִתְּנוּ֙ בְּ/אַרְצְ/כֶ֔ם לְ/הִֽשְׁתַּחֲוֺ֖ת עָלֶ֑י/הָ כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/001.yaml
  text: You shall not make idols for yourselves[a], and you shall not set up for yourselves a carved image or a standing stone, and you shall not place a figured stone in your land to bow down to it[b], for I am Yahweh your God.
translation:
  language: fr
  text: Vous ne vous ferez pas d’idoles ; vous ne dresserez pour vous-mêmes ni statue sculptée ni pierre levée, et vous ne placerez dans votre pays aucune pierre ornée de figures[a] pour vous prosterner devant elle. Car je suis Yahweh[b], votre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pierre sculptée » ou « pierre figurée ». Le sens précis de l’expression hébraïque אֶבֶן מַשְׂכִּית est discuté ; elle désigne une pierre associée à un culte interdit.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : YHWH ; traditionnellement rendu par « le Seigneur » ou « l’Éternel ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִילִם
  choice: idoles
  rationale: Le terme désigne des idoles et peut comporter une nuance péjorative d’inanité. « Idoles » est clair, actuel et adéquat dans cette interdiction.
- source_word: פֶסֶל
  choice: statue sculptée
  rationale: Le nom désigne une représentation façonnée, notamment par la taille. Cette formulation concrète la distingue des autres objets cultuels énumérés.
- source_word: מַצֵּבָה
  choice: pierre levée
  rationale: Le terme désigne un monument ou une pierre dressée verticalement. « Pierre levée » est concret et n’ajoute pas explicitement une fonction cultuelle au nom lui-même.
- source_word: אֶבֶן מַשְׂכִּית
  choice: pierre ornée de figures
  rationale: L’expression semble désigner une pierre portant une représentation gravée, sculptée ou figurée. Le sens précis restant discuté, une note conserve les principales possibilités.
- source_word: תַעֲשׂוּ לָכֶם
  choice: vous ne vous ferez pas
  rationale: La tournure française rend naturellement le verbe « faire » et la valeur réfléchie ou bénéficiaire de לָכֶם.
- source_word: תָקִימוּ לָכֶם
  choice: vous ne dresserez pour vous-mêmes
  rationale: Le hifil de קום signifie ici ériger ou dresser. « Pour vous-mêmes » maintient explicitement לָכֶם.
- source_word: תִתְּנוּ בְּאַרְצְכֶם
  choice: vous ne placerez dans votre pays
  rationale: « Placer » rend naturellement נתן dans ce contexte locatif, tandis que « dans votre pays » conserve le cadre territorial de l’alliance.
- source_word: לְהִשְׁתַּחֲוֺת עָלֶיהָ
  choice: pour vous prosterner devant elle
  rationale: L’infinitif exprime le but. « Se prosterner devant » rend l’acte corporel de révérence sans réduire silencieusement l’expression au seul concept abstrait d’adoration.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin conserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Car je suis Yahweh, votre Dieu
  rationale: כִּי introduit ici le fondement de l’interdiction. « Car » convient au registre juridique et solennel de la formule d’alliance.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ou l’Éternel
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom d’alliance, tandis que la note signale les substitutions françaises traditionnelles.
- issue: Distinction entre les objets cultuels interdits
  choice: idoles, statue sculptée, pierre levée et pierre ornée de figures
  alternative: regrouper tous les termes sous « idoles » ou « images »
  rationale: L’hébreu accumule plusieurs termes distincts. Les différencier respecte la précision de l’interdiction sans attribuer à chacun une fonction théologique plus précise que ne le permet le lexique.
- issue: Référent de עָלֶיהָ après אֶבֶן
  choice: devant elle, en référence à la pierre
  alternative: sur elle
  rationale: La préposition עַל peut parfois être comprise spatialement, mais avec השתחוה elle désigne vraisemblablement ici l’objet devant lequel on se prosterne. La possibilité lexicale ne justifie pas de rendre la phrase par « adorer sur elle » dans le texte principal.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve l’accumulation juridique de l’hébreu tout en employant une ponctuation française lisible. Les termes désignant les divers objets restent distincts, et les incertitudes lexicales sont signalées en note.
