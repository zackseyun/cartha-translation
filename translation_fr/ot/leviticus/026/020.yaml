  text: וְ/תַ֥ם לָ/רִ֖יק כֹּחֲ/כֶ֑ם וְ/לֹֽא תִתֵּ֤ן אַרְצְ/כֶם֙ אֶת יְבוּלָ֔/הּ וְ/עֵ֣ץ הָ/אָ֔רֶץ לֹ֥א יִתֵּ֖ן פִּרְיֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/020.yaml
  text: Your strength will be spent in vain[a], and your land will not yield its produce, and the trees of the land will not yield their fruit.
translation:
  language: fr
  text: Votre force s’épuisera en vain[a], et votre terre ne donnera pas son produit, et les arbres de la terre ne donneront pas leurs fruits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Votre force sera épuisée pour rien. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַם
  choice: s’épuiseront
  rationale: Le verbe תמם exprime ici l’épuisement ou la consommation complète des forces. « S’épuiseront » est naturel en français et conserve cette idée.
- source_word: לָרִיק
  choice: en vain
  rationale: L’expression indique qu’un effort reste sans résultat. « En vain » en rend clairement la portée dans ce contexte de malédiction de l’alliance.
- source_word: כֹּחֲכֶם
  choice: vos forces
  rationale: כח désigne la force ou la vigueur. Le pluriel idiomatique français « vos forces » convient particulièrement au travail agricole évoqué.
- source_word: תִתֵּן
  choice: donnera
  rationale: Le sens premier du verbe נתן est « donner ». Cette formulation reste naturelle avec la terre et les arbres tout en conservant l’image hébraïque répétée.
- source_word: אַרְצְכֶם
  choice: votre terre
  rationale: Dans ce contexte, ארץ désigne le sol cultivé appartenant au peuple; « votre terre » est précis et naturel.
- source_word: יְבוּלָהּ
  choice: ses récoltes
  rationale: יבול désigne ce que produit la terre. « Ses récoltes » est immédiatement compréhensible et convient au contexte agricole, sans limiter le propos à une culture particulière.
- source_word: וְעֵץ הָאָרֶץ
  choice: les arbres du pays
  rationale: Le singulier עץ a ici une valeur collective, naturellement rendue au pluriel en français. Dans ce second emploi, הארץ renvoie au territoire, d’où « du pays », qui évite aussi la répétition maladroite de « terre ».
- source_word: פִּרְיוֹ
  choice: leurs fruits
  rationale: Le suffixe hébreu est singulier parce qu’il s’accorde avec le collectif עץ. Le français emploie le pluriel « leurs fruits » en accord avec « les arbres ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « donner » reproduit celle du verbe hébreu, tandis que le deux-points explicite naturellement le rapport entre l’effort inutile et l’absence de production. Le marqueur [a] figure dans le texte.
