source:
  edition: WLC
  text: וּ/פָנִ֣יתִי אֲלֵי/כֶ֔ם וְ/הִפְרֵיתִ֣י אֶתְ/כֶ֔ם וְ/הִרְבֵּיתִ֖י אֶתְ/כֶ֑ם וַ/הֲקִימֹתִ֥י אֶת בְּרִיתִ֖/י אִתְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/009.yaml
  text: And I will turn toward you and make you fruitful and multiply you[a], and I will establish my covenant with you.
translation:
  language: fr
  text: Je me tournerai vers vous[a], je vous rendrai féconds et je vous multiplierai, et j’établirai mon alliance avec vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je porterai sur vous un regard favorable ». L’hébreu dit littéralement « Je me tournerai vers vous », expression qui implique ici la faveur divine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתִי אֲלֵיכֶם
  choice: Je me tournerai vers vous
  rationale: Cette formulation conserve l’image concrète du verbe פנה et la direction exprimée par אֶל. Dans ce contexte de bénédiction, elle implique un regard favorable sans l’expliciter à la place du texte.
- source_word: וְהִפְרֵיתִי אֶתְכֶם
  choice: je vous rendrai féconds
  rationale: Le hiphil de פרה est causatif. « Rendre féconds » exprime naturellement cette causalité et conserve le vocabulaire biblique de la fécondité.
- source_word: וְהִרְבֵּיתִי אֶתְכֶם
  choice: je vous multiplierai
  rationale: Le hiphil de רבה signifie rendre nombreux ou multiplier. Ce choix préserve la formule biblique associant fécondité et multiplication.
- source_word: וַהֲקִימֹתִי אֶת־בְּרִיתִי
  choice: j’établirai mon alliance
  rationale: Le hiphil de קום avec בְּרִית peut exprimer l’établissement ou la confirmation d’une alliance. « Établir mon alliance » reste proche de la formulation hébraïque et conserve sa portée relationnelle et théologique.
- source_word: אִתְּכֶם
  choice: avec vous
  rationale: La préposition marque ici les partenaires de l’alliance; « avec vous » est direct et idiomatique en français.
theological_decisions:
- issue: Expliciter ou non la faveur impliquée par le fait que Dieu se tourne vers son peuple
  choice: Conserver « Je me tournerai vers vous » dans le texte principal
  alternative: Je porterai sur vous un regard favorable
  rationale: Le contexte indique clairement la faveur divine, mais le verbe hébreu décrit littéralement l’action de se tourner. La traduction garde cette image tout en signalant son sens contextuel en note.
- issue: Rendre la formule de fécondité et de multiplication
  choice: je vous rendrai féconds et je vous multiplierai
  alternative: je vous rendrai féconds et nombreux
  rationale: La formulation retenue conserve l’écho reconnaissable de la bénédiction biblique et la structure causative des deux verbes.
- issue: Valeur de וַהֲקִימֹתִי dans la formule d’alliance
  choice: j’établirai mon alliance
  alternative: je confirmerai mon alliance / je maintiendrai mon alliance
  rationale: Le verbe peut évoquer l’établissement effectif ou la confirmation de l’alliance. Le choix principal suit de près la tournure hébraïque sans trancher davantage que le contexte ne l’exige.
translation_notes:
  register: Français moderne, international et digne. La syntaxe conserve le rythme cumulatif de la promesse hébraïque, tandis que les termes « féconds », « multiplierai » et « alliance » maintiennent les principaux échos bibliques.
