  - severity: low
    issue: Ancrage et contenu de note à ajuster
    rationale: La note actuelle oppose « jouira » au texte principal, alors que « jouira de ses sabbats » constitue la formulation française directe et naturelle. L’alternative compensatoire doit être formulée comme telle.
  revised_text: Alors la terre jouira de ses sabbats pendant tous les jours de sa désolation, tandis que vous serez dans le pays de vos ennemis ; alors la terre se reposera et jouira de ses sabbats[a].
