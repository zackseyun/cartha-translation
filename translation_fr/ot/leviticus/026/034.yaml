  text: אָז֩ תִּרְצֶ֨ה הָ/אָ֜רֶץ אֶת שַׁבְּתֹתֶ֗י/הָ כֹּ֚ל יְמֵ֣י הֳשַׁמָּ֔/ה וְ/אַתֶּ֖ם בְּ/אֶ֣רֶץ אֹיְבֵי/כֶ֑ם אָ֚ז תִּשְׁבַּ֣ת הָ/אָ֔רֶץ וְ/הִרְצָ֖ת אֶת שַׁבְּתֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/034.yaml
  text: Then the land will enjoy its Sabbaths all the days of its desolation[a], while you are in the land of your enemies; then the land will rest and enjoy its Sabbaths.
translation:
  language: fr
  text: Alors la terre jouira de ses sabbats pendant tous les jours de sa désolation, tandis que vous serez dans le pays de vos ennemis ; alors la terre se reposera et jouira de ses sabbats[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rattrapera ses sabbats ». Le verbe hébreu peut exprimer ici le fait de recevoir ce qui était dû.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Marque la conséquence temporelle du jugement annoncé et conserve la reprise au début des deux propositions.
- source_word: תִּרְצֶה / וְהִרְצָת
  choice: recevra la compensation pour
  rationale: Dans ce contexte, רצה indique que la terre obtient ce qui lui était dû au titre des sabbats négligés. Cette formulation française exprime le sens compensatoire tout en évitant de prêter principalement à la terre un sentiment de plaisir.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Désigne ici le territoire d’Israël. « La terre » est la formulation biblique française naturelle dans ce contexte, sans suggérer nécessairement la planète entière.
- source_word: אֶת שַׁבְּתֹתֶיהָ
  choice: pour ses sabbats
  rationale: Renvoie aux repos sabbatiques dus à la terre, notamment aux années sabbatiques. « Sabbats » préserve la formulation concise et la répétition de l’hébreu.
- source_word: כֹּל יְמֵי הֳשַׁמָּה
  choice: pendant tous les jours où elle restera dévastée
  rationale: Rend toute la durée de l’état de désolation de la terre dans un français naturel, en explicitant que le suffixe se rapporte à elle.
- source_word: וְאַתֶּם בְּאֶרֶץ אֹיְבֵיכֶם
  choice: tandis que vous serez dans le pays de vos ennemis
  rationale: La proposition est circonstancielle et décrit la période durant laquelle la terre demeure dévastée.
- source_word: תִּשְׁבַּת
  choice: se reposera
  rationale: Le verbe שבת évoque ici la cessation de la culture de la terre et son repos sabbatique.
theological_decisions:
- issue: Rapport de la terre à ses sabbats durant l’exil
  choice: La terre reçoit durant sa désolation la compensation correspondant aux repos sabbatiques qui lui étaient dus.
  alternative: La terre « jouira de » ses sabbats ou « prendra plaisir à » ses sabbats.
  rationale: Le contexte des sanctions de l’alliance soutient une nuance de satisfaction d’une dette ou de compensation, mais la note conserve l’autre valeur lexicale possible sans imposer une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La structure répétitive de l’hébreu est maintenue, de même que la personnification de la terre. « Pays » est employé pour le territoire des ennemis afin d’éviter une répétition française ambiguë avec « la terre » comme sujet principal.
