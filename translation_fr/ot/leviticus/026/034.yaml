revisions:
- from: Alors, pendant tous les jours où elle restera dévastée, tandis que vous serez dans le pays de vos ennemis, la terre recevra la compensation pour ses sabbats[a] ; alors la terre se reposera et recevra la compensation pour ses sabbats.
  to: Alors la terre jouira de ses sabbats pendant tous les jours de sa désolation, tandis que vous serez dans le pays de vos ennemis ; alors la terre se reposera et jouira de ses sabbats[a].
  rationale: La révision remplace une expression française abstraite et peu naturelle par « jouira de ses sabbats », qui rend directement le verbe hébreu dans son emploi traditionnel et idiomatique. La note conserve sans l’imposer la lecture contextuelle de compensation ou de récupération. La répétition lexicale, le repos de la terre et la proposition circonstancielle relative à l’exil sont maintenus.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:25:53Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens de רצה dans ce contexte est celui de l’obtention ou de la récupération des repos sabbatiques dus à la terre. « Recevra la compensation pour ses sabbats » explicite ce sens, mais sa construction est moins fidèle à la personnification et à la formulation compacte de l’hébreu. « Jouira de ses sabbats » est une traduction française établie et directe, tout en laissant une note signaler la nuance compensatoire. La répétition de רצה et celle de « ses sabbats » sont conservées.
  naturalness: '« Recevra la compensation pour ses sabbats » est lourd et peu idiomatique : on reçoit normalement une compensation pour un préjudice, non « pour ses sabbats ». « Jouira de ses sabbats » est naturel dans un registre biblique moderne et digne. Le déplacement de « Alors » devant le sujet rend également la structure plus lisible.'
  terminology: « La terre », « sabbats », « pays de vos ennemis » et « se reposera » conviennent. La note doit présenter « rattrapera ses sabbats » comme option compensatoire, plutôt que de faire de « jouira » une simple alternative à une expression française maladroite.
  issues:
