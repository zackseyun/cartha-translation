id: LEV.26.2
reference: Leviticus 26:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֶת שַׁבְּתֹתַ֣/י תִּשְׁמֹ֔רוּ וּ/מִקְדָּשִׁ֖/י תִּירָ֑אוּ אֲנִ֖י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/002.yaml
  text: You shall keep my Sabbaths and revere my sanctuary[a]; I am Yahweh.
translation:
  language: fr
  text: Vous observerez mes sabbats et vous révérerez mon sanctuaire[a]. Je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous craindrez mon sanctuaire » ou « vous éprouverez une crainte respectueuse devant mon sanctuaire ». Le verbe hébreu peut exprimer la crainte, la révérence ou un profond respect mêlé d’émerveillement, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: mes sabbats
  rationale: Le pluriel avec suffixe de première personne est conservé. « Mes sabbats » peut englober l’ensemble des temps sabbatiques consacrés à Yahweh, sans le réduire explicitement au seul sabbat hebdomadaire.
- source_word: תִּשְׁמֹרוּ
  choice: vous observerez
  rationale: Dans le contexte des prescriptions cultuelles, שׁמר signifie garder avec soin et mettre en pratique. « Observer » est naturel en français pour des jours sacrés et conserve la portée d’obéissance du verbe.
- source_word: וּמִקְדָּשִׁי
  choice: et mon sanctuaire
  rationale: מִקְדָּשׁ désigne un lieu saint ou sanctuaire. « Mon sanctuaire » est l’équivalent français courant et respecte le suffixe possessif.
- source_word: תִּירָאוּ
  choice: vous révérerez
  rationale: ירא peut exprimer la crainte, le respect religieux ou l’émerveillement mêlé de crainte. Avec le sanctuaire pour objet, « révérer » communique naturellement le profond respect sacré sans effacer les autres nuances, signalées en note.
- source_word: אֲנִי יְהוָה
  choice: Je suis Yahweh
  rationale: La formule hébraïque d’auto-identification est rendue directement, et le tétragramme est translittéré comme nom propre plutôt que remplacé par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel dans la formule d’autorité qui conclut le commandement.
- issue: Portée de ירא à propos du sanctuaire
  choice: révérer
  alternative: craindre ; éprouver une crainte respectueuse devant
  rationale: Le verbe conserve une tension entre crainte et respect sacré. « Révérer » convient au contexte cultuel, tandis que la note maintient visibles les autres valeurs lexicales possibles.
translation_notes:
  register: Français international moderne, digne et direct. Le futur à valeur injonctive rend naturellement les formes verbales hébraïques de commandement. « Sabbats » et « sanctuaire » conservent le vocabulaire cultuel précis, tandis que la note explicite l’ambivalence de ירא.
