  text: וְ/הִתְוַדּ֤וּ אֶת עֲוֺנָ/ם֙ וְ/אֶת עֲוֺ֣ן אֲבֹתָ֔/ם בְּ/מַעֲלָ֖/ם אֲשֶׁ֣ר מָֽעֲלוּ בִ֑/י וְ/אַ֕ף אֲשֶׁר הָֽלְכ֥וּ עִמִּ֖/י בְּ/קֶֽרִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/040.yaml
  text: But if they confess their iniquity and the iniquity of their fathers[a], in the unfaithfulness by which they were unfaithful to me, and also that they walked contrary to me[b],
translation:
  language: fr
  text: Mais s’ils reconnaissent leur faute et celle de leurs pères, dans leur infidélité envers moi, lorsqu’ils m’ont trahi[a], et aussi qu’ils ont agi envers moi avec hostilité[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « dans leur trahison, par laquelle ils m’ont trahi ». L’hébreu emploie un nom et un verbe de même racine pour souligner la rupture de fidélité.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « se sont conduits envers moi en opposition ». Le terme hébreu rendu par « avec hostilité » est difficile; il revient plusieurs fois dans ce chapitre pour décrire une conduite d’opposition ou d’hostilité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: Mais s’ils reconnaissent
  rationale: Le hitpael de ידה signifie ici reconnaître ou confesser sa faute. Dans l’enchaînement conditionnel du passage, « s’ils reconnaissent » rend naturellement la valeur contextuelle; « Mais » marque la transition avec la situation décrite auparavant.
- source_word: עֲוֺנָם
  choice: leur faute
  rationale: עָוֹן désigne ici une conduite coupable à reconnaître. « Faute » garde la dimension morale tout en étant plus courant en français moderne que « iniquité ».
- source_word: עֲוֺן אֲבֹתָם
  choice: celle de leurs pères
  rationale: La reprise pronominale évite une lourde répétition tout en conservant explicitement le terme masculin ancestral אבות, « pères ».
- source_word: בְּמַעֲלָם אֲשֶׁר מָעֲלוּ בִי
  choice: dans l’infidélité par laquelle ils m’ont été infidèles
  rationale: Le nom מַעַל et le verbe apparenté מָעַל soulignent ensemble la rupture de fidélité. La formulation française conserve volontairement cette répétition lexicale et la dimension relationnelle de l’expression.
- source_word: וְאַף אֲשֶׁר
  choice: et aussi qu’ils
  rationale: La tournure ajoute un autre élément à ce qui doit être reconnu; « et aussi que » en préserve la coordination.
- source_word: הָלְכוּ עִמִּי בְּקֶרִי
  choice: se sont conduits envers moi en adversaires
  rationale: הלך décrit ici la conduite, et קֶרִי, terme difficile propre à ce chapitre, évoque une attitude contraire, opposée ou hostile. « En adversaires » exprime ce rapport d’opposition sans prétendre lever entièrement l’incertitude lexicale.
theological_decisions:
- issue: La reconnaissance collective de la faute des pères
  choice: Conserver « leur faute et celle de leurs pères » sans l’atténuer.
  alternative: « leurs fautes et celles de leurs ancêtres » ou une formulation limitée aux conséquences des fautes passées
  rationale: L’hébreu place explicitement leur propre faute à côté de celle de leurs pères. La traduction maintient cette dimension collective et historique sans ajouter d’explication doctrinale sur la transmission de la culpabilité.
translation_notes:
  register: Français international moderne, digne et accessible. « Reconnaissent leur faute » est naturel sans affaiblir l’aveu moral; « pères » conserve la précision du texte hébreu. La répétition « infidélité / infidèles » est maintenue malgré sa légère lourdeur afin de refléter l’insistance de l’original. La virgule finale signale que la phrase se poursuit au verset suivant.
