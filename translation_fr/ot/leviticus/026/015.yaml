id: LEV.26.15
reference: Leviticus 26:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם בְּ/חֻקֹּתַ֣/י תִּמְאָ֔סוּ וְ/אִ֥ם אֶת מִשְׁפָּטַ֖/י תִּגְעַ֣ל נַפְשְׁ/כֶ֑ם לְ/בִלְתִּ֤י עֲשׂוֹת֙ אֶת כָּל מִצְוֺתַ֔/י לְ/הַפְרְ/כֶ֖ם אֶת בְּרִיתִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/015.yaml
  text: and if you reject my statutes[a], and if your soul abhors my judgments, so that you do not do all my commandments, thereby breaking my covenant[c][b],
translation:
  language: fr
  text: et si vous rejetez mes prescriptions, si vous avez mes ordonnances en horreur au point de ne pas mettre en pratique tous mes commandements, rompant ainsi mon alliance,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּחֻקֹּתַי
  choice: mes prescriptions
  rationale: « Prescriptions » exprime des dispositions établies et conserve le registre juridique de חֻקִּים, tout en restant naturel en français moderne.
- source_word: תִּמְאָסוּ
  choice: vous rejetez
  rationale: מאס indique un rejet pouvant comporter du mépris; « rejetez » est clair et convient à l’avertissement relatif à l’alliance.
- source_word: מִשְׁפָּטַי
  choice: mes règles
  rationale: מִשְׁפָּטִים désigne ici les règles ou décisions normatives de Dieu. « Règles » distingue ce terme de « prescriptions » et de « commandements » sans suggérer principalement des verdicts judiciaires.
- source_word: תִּגְעַל נַפְשְׁכֶם
  choice: vous avez … en horreur
  rationale: L’expression idiomatique, dont נַפְשְׁכֶם est le sujet grammatical, exprime une aversion profonde. En français, « vous avez … en horreur » restitue naturellement cette intensité; l’expression hébraïque littérale est signalée en note.
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: au point de ne pas mettre en pratique
  rationale: La formulation rend la valeur résultative possible de la construction et relie clairement l’aversion à la désobéissance.
- source_word: כָּל מִצְוֺתַי
  choice: tous mes commandements
  rationale: « Commandements » est le terme français précis et traditionnel pour מִצְוֹת dans ce contexte juridique et relatif à l’alliance.
- source_word: לְהַפְרְכֶם
  choice: rompant ainsi
  rationale: Le hiphil de פרר exprime la rupture ou l’annulation de l’alliance. « Rompant ainsi » fait ressortir le lien entre le refus d’obéir et cette rupture, sans trancher excessivement entre but et conséquence.
- source_word: בְּרִיתִי
  choice: mon alliance
  rationale: « Alliance » est le terme français établi et précis pour בְּרִית dans le cadre théologique et juridique du passage.
theological_decisions:
- issue: Maintien explicite du terme anthropologique נֶפֶשׁ dans une expression idiomatique
  choice: vous avez mes règles en horreur, avec indication littérale en note
  alternative: votre être tout entier a mes règles en horreur / votre âme a mes règles en horreur
  rationale: נֶפֶשׁ est bien le sujet grammatical, mais « votre âme a … en horreur » sonne peu naturel et peut évoquer en français une anthropologie technique étrangère à l’idiome. Le texte courant transmet l’aversion profonde, tandis que la note préserve la forme hébraïque et son ambiguïté anthropologique.
- issue: Différenciation des termes de la loi de l’alliance
  choice: prescriptions / règles / commandements / alliance
  alternative: décrets / ordonnances / commandements / alliance
  rationale: Le verset accumule des termes distincts. Des équivalents français différenciés en conservent la texture juridique sans les fondre en une seule catégorie.
- issue: Rapport logique de לְהַפְרְכֶם avec la désobéissance
  choice: rompant ainsi mon alliance
  alternative: afin de rompre mon alliance / de manière à violer mon alliance
  rationale: La formulation française conserve une certaine ouverture entre résultat et intention, tout en présentant la rupture de l’alliance comme liée au refus de pratiquer les commandements.
translation_notes:
  register: Français moderne, digne et accessible. La coordination et la virgule finale sont conservées parce que le verset appartient à une protase qui se poursuit au verset suivant. Les quatre termes juridiques sont distingués sans lourdeur excessive.
