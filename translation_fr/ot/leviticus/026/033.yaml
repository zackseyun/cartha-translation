source:
  edition: WLC
  text: וְ/אֶתְ/כֶם֙ אֱזָרֶ֣ה בַ/גּוֹיִ֔ם וַ/הֲרִיקֹתִ֥י אַחֲרֵי/כֶ֖ם חָ֑רֶב וְ/הָיְתָ֤ה אַרְצְ/כֶם֙ שְׁמָמָ֔ה וְ/עָרֵי/כֶ֖ם יִהְי֥וּ חָרְבָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/033.yaml
  text: And I will scatter you among the nations[a], and I will draw out the sword after you; and your land will become a desolation, and your cities will become ruins.
translation:
  language: fr
  text: Je vous disperserai parmi les nations et je dégainerai l’épée à votre poursuite. Votre pays sera dévasté et vos villes seront en ruine.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱזָרֶה
  choice: je vous disperserai
  rationale: Le hiphil de זרה exprime ici la dispersion du peuple. « Disperser » est naturel en français et convient au contexte d’exil imposé comme jugement.
- source_word: בַגּוֹיִם
  choice: parmi les nations
  rationale: גּוֹיִם désigne ici les nations étrangères au milieu desquelles le peuple sera dispersé. « Nations » conserve le sens géopolitique sans ajouter de connotations ultérieures.
- source_word: וַהֲרִיקֹתִי ... חָרֶב
  choice: je dégainerai l’épée
  rationale: L’expression idiomatique signifie tirer l’épée de son fourreau. « Dégainer l’épée » restitue clairement et concrètement l’image militaire en français moderne.
- source_word: אַחֲרֵיכֶם
  choice: à votre poursuite
  rationale: Littéralement « derrière vous » ou « après vous » ; dans ce contexte hostile, l’expression indique une poursuite armée. « À votre poursuite » rend ce sens sans ambiguïté artificielle.
- source_word: אַרְצְכֶם
  choice: votre pays
  rationale: אֶרֶץ peut désigner la terre ou le pays. Ici, « votre pays » convient à l’opposition avec la dispersion parmi les nations et se lit naturellement.
- source_word: שְׁמָמָה
  choice: dévasté
  rationale: Le nom décrit un état de désolation. La tournure adjectivale « sera dévasté » est idiomatique en français et conserve pleinement le résultat du jugement.
- source_word: חָרְבָּה
  choice: en ruine
  rationale: Le terme désigne un état de ruine ou de dévastation. Avec des villes comme sujet, « seront en ruine » est précis et naturel.
theological_decisions:
- issue: Le jugement d’alliance sous la forme de la dispersion et de la poursuite militaire
  choice: 'Conserver l’action divine directe à la première personne : « Je vous disperserai… je dégainerai »'
  alternative: Employer une formulation passive ou impersonnelle qui atténuerait l’action divine
  rationale: L’hébreu attribue explicitement ces jugements à Dieu. La traduction maintient cette force théologique sans l’adoucir ni l’amplifier.
translation_notes:
  register: Français moderne, international et digne. La formulation reste directe et solennelle, avec un parallélisme clair entre la dévastation du pays et la ruine des villes.
