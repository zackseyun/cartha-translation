  edition: WLC
  text: וְ/הָלַכְתִּ֥י עִמָּ/כֶ֖ם בַּ/חֲמַת קֶ֑רִי וְ/יִסַּרְתִּ֤י אֶתְ/כֶם֙ אַף אָ֔נִי שֶׁ֖בַע עַל חַטֹּאתֵי/כֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/028.yaml
  text: then I also will walk contrary to you in furious hostility[b][a], and I myself will discipline you sevenfold for your sins.
translation:
  language: fr
  text: alors moi aussi, je marcherai contre vous avec une hostilité furieuse[a], et je vous corrigerai moi-même au septuple à cause de vos péchés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « dans la fureur de l’opposition » ; traditionnellement : « je marcherai contre vous avec fureur ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « je vous châtierai sept fois pour vos péchés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַכְתִּי
  choice: je marcherai
  rationale: Le verbe הלך signifie littéralement « marcher, aller ». Conserver « marcher » maintient l’image relationnelle et la formulation répétée des malédictions d’alliance dans ce chapitre.
- source_word: עִמָּכֶם
  choice: contre vous
  rationale: La préposition עם signifie normalement « avec », mais, associée ici à קֶרִי, elle exprime une relation devenue adverse. « Contre vous » rend naturellement cette force en français.
- source_word: בַּחֲמַת קֶרִי
  choice: avec une hostilité furieuse
  rationale: חֵמָה évoque la fureur ou la colère ardente, tandis que קֶרִי est un terme difficile propre à cette section, désignant vraisemblablement une attitude d’opposition ou d’hostilité. Cette formulation est claire sans effacer l’intensité de l’hébreu; une traduction plus formelle figure en note.
- source_word: וְיִסַּרְתִּי
  choice: je vous corrigerai
  rationale: יסר peut désigner l’action de corriger, discipliner ou châtier. « Corriger » conserve la possibilité d’une discipline corrective tout en restant suffisamment fort dans ce contexte de jugement.
- source_word: אַף אֲנִי
  choice: moi aussi ... moi-même
  rationale: La formulation hébraïque souligne fortement le sujet divin. La combinaison « moi aussi » et « moi-même » transmet cette insistance dans un français naturel.
- source_word: שֶׁבַע
  choice: au septuple
  rationale: Le nombre « sept » fonctionne ici adverbialement et exprime l’intensification du jugement. « Au septuple » est concis et préserve cette valeur, tandis que « sept fois » reste possible.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: à cause de vos péchés
  rationale: עַל indique ici le motif ou le fondement de la correction. « À cause de vos péchés » rend explicitement ce lien causal.
theological_decisions:
- issue: Nature de la réponse divine dans la malédiction d’alliance
  choice: Conserver à la fois le langage d’opposition (« je marcherai contre vous ») et celui de correction (« je vous corrigerai »).
  alternative: Tout rendre en termes exclusivement punitifs (« je vous punirai »), ou atténuer l’opposition en simple mécontentement.
  rationale: L’hébreu associe une posture relationnelle adverse, exprimée par הלך avec עם et קֶרִי, à יסר, terme qui peut inclure la correction disciplinaire. Garder les deux aspects évite de réduire le texte soit à une pure rétribution, soit à une simple désapprobation.
translation_notes:
  register: Français international moderne, digne et direct. L’image biblique de la marche est conservée; « hostilité furieuse » rend lisible une expression hébraïque difficile, et les variantes plus formelles ou plus punitives sont signalées en notes.
