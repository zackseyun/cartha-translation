review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : Dieu annonce qu’il fera venir terreur, maladie débilitante et fièvre, suivies d’un échec agricole dont profiteront les ennemis. Toutefois, « vos graines » et le pronom pluriel « les » réduisent le singulier collectif זַרְעֲכֶם (« votre semence », c’est-à-dire ce qui est semé / la récolte) à des graines individuelles. La formulation concernant נֶפֶשׁ doit aussi être plus idiomatique en français sans perdre l’idée d’un dépérissement vital.'
  naturalness: « Feront dépérir votre vie » est peu naturel en français contemporain. « Vous feront dépérir » exprime clairement l’effet sur la vitalité de la personne. « Je vous infligerai ceci » est également plus direct et idiomatique que « voici ce que je vous ferai », tout en conservant la force de l’annonce.
  terminology: « Maladie qui fait dépérir » évite à juste titre un diagnostic médical trop précis. « Semence » est le terme agricole exact dans ce contexte et peut désigner collectivement la production semée ; il convient mieux que « graines ».
  issues:
  - severity: medium
    issue: « Vos graines » / « les mangeront » rend le collectif hébreu au pluriel.
    rationale: זַרְעֲכֶם est un singulier collectif, désignant la semence ou, par extension, la production issue des semailles. En français, « votre semence ... la mangeront » préserve mieux cette référence collective.
  - severity: low
    issue: « Feront dépérir votre vie » est maladroit.
    rationale: La construction est intelligible mais non idiomatique. « Vous feront dépérir » rend naturellement l’idée de vitalité qui s’épuise, sans imposer le sens théologique d’« âme ».
  - severity: low
    issue: La note c qualifie de littérale une formulation qui ne l’est pas pleinement.
    rationale: Le texte hébreu dit littéralement que les afflictions « consument les yeux et font dépérir la vie »; la note doit éviter d’ajouter des possessifs ou une flexion qui donnent une impression de citation stricte.
  revised_text: 'Moi aussi, je vous infligerai ceci : je ferai venir sur vous une terreur soudaine[a], la maladie qui fait dépérir[b] et la fièvre, qui épuiseront vos yeux et vous feront dépérir[c]. Vous sèmerez votre semence en vain, et vos ennemis la mangeront.'
