  text: אַף אֲנִ֞י אֶֽעֱשֶׂה זֹּ֣את לָ/כֶ֗ם וְ/הִפְקַדְתִּ֨י עֲלֵי/כֶ֤ם בֶּֽהָלָה֙ אֶת הַ/שַּׁחֶ֣פֶת וְ/אֶת הַ/קַּדַּ֔חַת מְכַלּ֥וֹת עֵינַ֖יִם וּ/מְדִיבֹ֣ת נָ֑פֶשׁ וּ/זְרַעְתֶּ֤ם לָ/רִיק֙ זַרְעֲ/כֶ֔ם וַ/אֲכָלֻ֖/הוּ אֹיְבֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/016.yaml
  text: 'I also will do this to you: I will appoint over you sudden terror[a], wasting disease and fever, consuming the eyes and draining the life; and you will sow your seed in vain[c][b], and your enemies will eat it.'
translation:
  language: fr
  text: 'Moi aussi, je vous infligerai ceci : je ferai venir sur vous une terreur soudaine[a], la maladie qui fait dépérir[b] et la fièvre, qui épuiseront vos yeux et vous feront dépérir[c]. Vous sèmerez votre semence en vain, et vos ennemis la mangeront.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je mettrai sur vous la terreur ». Le verbe hébreu peut exprimer l’idée d’imposer un fléau ou de le faire venir sur quelqu’un.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne une maladie qui fait dépérir, mais son identification exacte est incertaine.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « qui consument les yeux et font dépérir la vie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף אֲנִי אֶעֱשֶׂה זֹּאת לָכֶם
  choice: Moi aussi, voici ce que je vous ferai
  rationale: « Moi aussi » conserve l’emphase et la valeur de riposte de אַף אֲנִי; la tournure française est naturelle et rend l’action dirigée contre les destinataires.
- source_word: וְהִפְקַדְתִּי עֲלֵיכֶם בֶּהָלָה
  choice: je ferai venir sur vous une terreur soudaine
  rationale: Le hiphil de פקד peut exprimer l’idée d’imposer ou de faire venir un jugement. Cette formulation française est claire tout en gardant l’image d’un fléau envoyé sur le peuple.
- source_word: הַשַּׁחֶפֶת
  choice: la maladie qui fait dépérir
  rationale: Le mal précis demeure incertain. Cette traduction décrit son effet sans l’identifier abusivement à la tuberculose ni employer l’ancien terme ambigu « consomption ».
- source_word: הַקַּדַּחַת
  choice: la fièvre
  rationale: Le nom désigne une chaleur fébrile; « fièvre » est l’équivalent moderne le plus direct.
- source_word: מְכַלּוֹת עֵינַיִם וּמְדִיבֹת נָפֶשׁ
  choice: qui épuiseront vos yeux et feront dépérir votre vie
  rationale: La formulation conserve les deux effets parallèles. נֶפֶשׁ désigne ici la vie ou la vitalité de la personne, sans présupposer une anthropologie dualiste.
- source_word: וּזְרַעְתֶּם לָרִיק זַרְעֲכֶם
  choice: Vous sèmerez vos graines en vain
  rationale: « En vain » rend directement לָרִיק, tandis que « graines » évite en français moderne l’ambiguïté reproductive de « semence ».
- source_word: וַאֲכָלֻהוּ אֹיְבֵיכֶם
  choice: et vos ennemis les mangeront
  rationale: Le waw est rendu directement par « et ». Le pronom pluriel français renvoie naturellement aux graines, alors que le suffixe hébreu singulier collectif reprend זֶרַע.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans l’énoncé de malédiction
  choice: vie
  alternative: âme
  rationale: Dans ce contexte de maladie et de dépérissement, נֶפֶשׁ évoque la vie ou la vitalité de la personne. « Vie » préserve cette portée sans introduire une conception doctrinale particulière de l’âme.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le parallélisme menaçant du texte hébreu, sans diagnostic médical trop précis. Les futurs marquent clairement les conséquences de la désobéissance dans le contexte des malédictions de l’alliance.
