revisions:
- from: 'Moi aussi, voici ce que je vous ferai : je ferai venir sur vous une terreur soudaine[a], la maladie qui fait dépérir[b] et la fièvre, qui épuiseront vos yeux et feront dépérir votre vie[c]. Vous sèmerez vos graines en vain, et vos ennemis les mangeront.'
  to: 'Moi aussi, je vous infligerai ceci : je ferai venir sur vous une terreur soudaine[a], la maladie qui fait dépérir[b] et la fièvre, qui épuiseront vos yeux et vous feront dépérir[c]. Vous sèmerez votre semence en vain, et vos ennemis la mangeront.'
  rationale: La révision conserve les choix prudents concernant les maladies et נֶפֶשׁ, tout en corrigeant la référence agricole collective et en améliorant l’idiome français. Les ancres de notes restent attachées aux unités lexicales qu’elles expliquent.
