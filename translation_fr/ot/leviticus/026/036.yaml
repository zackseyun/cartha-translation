source:
  edition: WLC
  text: וְ/הַ/נִּשְׁאָרִ֣ים בָּ/כֶ֔ם וְ/הֵבֵ֤אתִי מֹ֨רֶךְ֙ בִּ/לְבָבָ֔/ם בְּ/אַרְצֹ֖ת אֹיְבֵי/הֶ֑ם וְ/רָדַ֣ף אֹתָ֗/ם ק֚וֹל עָלֶ֣ה נִדָּ֔ף וְ/נָס֧וּ מְנֻֽסַת חֶ֛רֶב וְ/נָפְל֖וּ וְ/אֵ֥ין רֹדֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/036.yaml
  text: As for those of you who remain, I will bring faintness into their hearts in the lands of their enemies, and the sound of a driven leaf will pursue them; they will flee as one flees from the sword, and they will fall when no one is pursuing.
translation:
  language: fr
  text: Quant à ceux d’entre vous qui resteront, je mettrai la peur dans leur cœur, dans les pays de leurs ennemis. Le bruissement d’une feuille agitée[a] les poursuivra ; ils fuiront comme on fuit devant l’épée et tomberont sans que personne les poursuive.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’une feuille emportée par le vent ».'
    reason: Alternative lexicale explicitant l’agent vraisemblable de נִדָּף, que l’hébreu ne nomme pas.
lexical_decisions:
- source_word: הַנִּשְׁאָרִים בָּכֶם
  choice: ceux d’entre vous qui resteront
  rationale: Rend naturellement le participe désignant ceux qui subsistent après le jugement, tout en conservant l’adresse directe exprimée par בכם.
- source_word: וְהֵבֵאתִי מֹרֶךְ בִּלְבָבָם
  choice: je mettrai la terreur dans leur cœur
  rationale: מֹרֶךְ évoque ici l’effondrement du courage et la peur paralysante. « La terreur » est idiomatique en français et convient à la panique décrite ensuite ; le singulier collectif « cœur » reste naturel.
- source_word: בְּאַרְצֹת אֹיְבֵיהֶם
  choice: dans les pays de leurs ennemis
  rationale: Le pluriel אַרְצֹת est maintenu par « pays », terme plus naturel ici que « terres » pour des territoires d’exil.
- source_word: קוֹל עָלֶה נִדָּף
  choice: le bruit d’une feuille emportée
  rationale: קוֹל désigne le bruit entendu ; נִדָּף présente la feuille comme poussée ou emportée sans nommer explicitement le vent. Une note donne l’explicitation courante.
- source_word: וְרָדַף אֹתָם
  choice: les poursuivra
  rationale: Conserve la personnification saisissante selon laquelle un simple bruit agit comme un poursuivant.
- source_word: וְנָסוּ מְנֻסַת חֶרֶב
  choice: ils fuiront comme on fuit devant l’épée
  rationale: Exprime clairement la manière de leur fuite et rend devant l’épée l’idée de fuite face à une menace armée.
- source_word: וְנָפְלוּ וְאֵין רֹדֵף
  choice: tomberont sans que personne les poursuive
  rationale: Préserve la brièveté de נפל et son ambiguïté entre chute, effondrement et défaite, ainsi que l’ironie de l’absence de poursuivant réel.
theological_decisions:
- issue: Nature du jugement décrit
  choice: Une terreur intérieure suscitée par Dieu pendant l’exil, entraînant une panique sans menace réelle
  alternative: Une poursuite militaire extérieure réelle ou un simple malaise métaphorique
  rationale: Le texte attribue explicitement à Dieu l’état intérieur de faiblesse ou de terreur, puis décrit la fuite provoquée par un bruit insignifiant. La traduction maintient l’action divine et la dimension psychologique sans ajouter de catégorie doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation en deux phrases clarifie la progression entre la terreur intérieure et ses effets. La formulation conserve l’image poétique, la personnification du bruit et l’ambiguïté de « tomber ».
