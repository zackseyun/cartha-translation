revisions:
- from: Quant à ceux d’entre vous qui resteront, je mettrai la terreur dans leur cœur, dans les pays de leurs ennemis. Le bruit d’une feuille emportée[a] les poursuivra ; ils fuiront comme on fuit devant l’épée et tomberont sans que personne les poursuive.
  to: Quant à ceux d’entre vous qui resteront, je mettrai la peur dans leur cœur, dans les pays de leurs ennemis. Le bruissement d’une feuille agitée[a] les poursuivra ; ils fuiront comme on fuit devant l’épée et tomberont sans que personne les poursuive.
  rationale: La révision limite l’intensité de l’état intérieur à la « peur », formulation française naturelle qui couvre la crainte et la perte de courage exprimées par מֹרֶךְ sans surinterpréter. Elle rend aussi plus clairement le son d’une feuille en mouvement par « bruissement », tout en préservant dans le texte l’absence d’agent explicite et dans la note l’alternative « par le vent ».
