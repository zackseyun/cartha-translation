source:
  edition: WLC
  text: וְ/אִ֨ם עַד אֵ֔לֶּה לֹ֥א תִשְׁמְע֖וּ לִ֑/י וְ/יָסַפְתִּי֙ לְ/יַסְּרָ֣ה אֶתְ/כֶ֔ם שֶׁ֖בַע עַל חַטֹּאתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/018.yaml
  text: And if[a], despite these things, you do not listen to me[b], then I will continue to discipline you sevenfold for your sins.
translation:
  language: fr
  text: Et si, malgré tout cela[a], vous ne m’écoutez pas, je continuerai à vous corriger sept fois plus pour vos péchés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après tout cela » ou « en dépit de tout cela » ; l’expression hébraïque indique que la désobéissance persiste malgré les jugements précédents.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sept » ; on peut aussi comprendre « sept fois ». Le nombre peut désigner une sanction intensifiée plutôt qu’un compte strictement numérique.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Et si
  rationale: Conserve à la fois le lien avec les avertissements précédents et la structure conditionnelle.
- source_word: עַד אֵלֶּה
  choice: malgré tout cela
  rationale: Dans ce contexte, l’expression indique que la désobéissance persiste en dépit des jugements précédents, plutôt qu’une limite temporelle.
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: vous ne m’écoutez pas
  rationale: Préserve l’image auditive du verbe שׁמע tout en laissant entendre, dans le contexte de l’alliance, l’idée d’une obéissance qui devrait en découler.
- source_word: וְיָסַפְתִּי
  choice: je continuerai
  rationale: Rend la poursuite et l’aggravation des sanctions déjà annoncées sans reproduire littéralement l’idée peu naturelle d’« ajouter ».
- source_word: לְיַסְּרָה אֶתְכֶם
  choice: à vous corriger
  rationale: Le verbe יסר associe correction et sanction. « Corriger » maintient cette tension mieux que « punir », purement rétributif, tandis que « châtier » serait moins courant en français moderne.
- source_word: שֶׁבַע
  choice: au septuple
  rationale: Le nombre fonctionne ici adverbialement et peut exprimer une intensification complète de la sanction. « Au septuple » reste concis et conserve l’image numérique.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: pour vos péchés
  rationale: Exprime naturellement le motif de la correction et maintient le lien causal du syntagme hébreu.
theological_decisions:
- issue: Nature de יָסַר dans le contexte des sanctions de l’alliance
  choice: corriger
  alternative: punir ; châtier
  rationale: Les sanctions sont réellement punitives, mais elles ont aussi une visée corrective dans le cadre de l’alliance. « Corriger » préserve cette tension sans réduire le terme à la seule rétribution.
- issue: Portée de שֶׁבַע
  choice: au septuple
  alternative: sept fois
  rationale: Le texte peut évoquer soit une mesure numériquement multipliée par sept, soit une forte intensification conventionnellement exprimée par le nombre sept. La traduction conserve l’image, et la note maintient l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. « Vous corriger » garde à la sanction sa dimension punitive et corrective ; « au septuple » préserve l’image hébraïque sans imposer une lecture strictement arithmétique.
