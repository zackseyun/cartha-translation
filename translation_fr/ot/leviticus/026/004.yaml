id: LEV.26.4
reference: Leviticus 26:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נָתַתִּ֥י גִשְׁמֵי/כֶ֖ם בְּ/עִתָּ֑/ם וְ/נָתְנָ֤ה הָ/אָ֨רֶץ֙ יְבוּלָ֔/הּ וְ/עֵ֥ץ הַ/שָּׂדֶ֖ה יִתֵּ֥ן פִּרְיֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/004.yaml
  text: then I will give you your rains in their season[a], and the land will yield its produce[b], and the tree of the field will give their fruit.
translation:
  language: fr
  text: alors je vous donnerai les pluies en leur saison[a] ; la terre donnera ses récoltes, et les arbres des champs[b] donneront leurs fruits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au moment voulu » ou « en temps voulu ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie ici le singulier « l’arbre des champs » avec une valeur collective.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: je vous donnerai
  rationale: Le verbe נתן signifie couramment « donner ». Le complément « vous » explicite naturellement en français que ces pluies sont accordées au peuple, conformément au suffixe de גִשְׁמֵיכֶם.
- source_word: גִשְׁמֵיכֶם
  choice: les pluies
  rationale: Le pluriel hébreu désigne les pluies saisonnières nécessaires à l’agriculture. Le français peut conserver ce pluriel sans lourdeur.
- source_word: בְּעִתָּם
  choice: en leur saison
  rationale: Cette formulation maintient le suffixe pluriel renvoyant aux pluies et exprime qu’elles arrivent au moment approprié.
- source_word: וְנָתְנָה הָאָרֶץ
  choice: la terre donnera
  rationale: La traduction conserve la répétition intentionnelle de נתן dans le verset. « La terre » convient au contexte agricole et territorial.
- source_word: יְבוּלָהּ
  choice: ses récoltes
  rationale: יְבוּל désigne ce que la terre produit. « Récoltes » est concret, naturel en français moderne et adapté au contexte agricole.
- source_word: וְעֵץ הַשָּׂדֶה
  choice: les arbres des champs
  rationale: Le singulier hébreu a une valeur collective. Le pluriel français en restitue naturellement le sens générique sans limiter la promesse à un seul arbre.
- source_word: יִתֵּן פִּרְיוֹ
  choice: donneront leurs fruits
  rationale: « Donner » préserve la répétition de נתן, tandis que le pluriel s’accorde avec la formulation collective naturelle en français.
theological_decisions:
- issue: Bénédiction agricole liée à l’alliance
  choice: Présenter directement la promesse divine de pluies opportunes et de fécondité agricole.
  alternative: Généraliser le texte en promesse universelle de prospérité matérielle, ou spiritualiser les bénédictions.
  rationale: Le contexte immédiat concerne concrètement les pluies, les récoltes et les fruits dans le cadre des bénédictions de l’alliance. La traduction ne doit ni élargir ni spiritualiser cette promesse.
translation_notes:
  register: Français international moderne, clair et digne. La structure coordonnée et la triple reprise de « donner » reflètent la formulation hébraïque, tandis que le pluriel « les arbres des champs » rend naturellement en français le singulier collectif.
