id: LEV.26.6
reference: Leviticus 26:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נָתַתִּ֤י שָׁלוֹם֙ בָּ/אָ֔רֶץ וּ/שְׁכַבְתֶּ֖ם וְ/אֵ֣ין מַחֲרִ֑יד וְ/הִשְׁבַּתִּ֞י חַיָּ֤ה רָעָה֙ מִן הָ/אָ֔רֶץ וְ/חֶ֖רֶב לֹא תַעֲבֹ֥ר בְּ/אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/006.yaml
  text: And I will give peace in the land[a], and you will lie down, with no one making you afraid. And I will remove harmful beasts from the land[b], and the sword will not pass through your land.
translation:
  language: fr
  text: Je donnerai la paix dans le pays ; vous vous coucherez sans que personne vous effraie. Je ferai disparaître du pays les animaux dangereux[a], et l’épée[b] ne traversera pas votre pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les bêtes sauvages ». L’expression hébraïque désigne des animaux qui constituent une menace.
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, « l’épée » représente la guerre ou une invasion armée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Je donnerai
  rationale: Le verbe נתן signifie couramment « donner ». Cette formulation exprime directement que Dieu accorde la bénédiction promise ; la conjonction initiale peut rester implicite en français dans la continuité du passage.
- source_word: שָׁלוֹם
  choice: la paix
  rationale: שָׁלוֹם peut désigner la paix, le bien-être ou l’intégrité. Ici, « la paix » convient au contexte concret de sécurité tout en gardant une portée plus large.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: אֶרֶץ désigne ici le territoire accordé à Israël. « Pays » rend naturellement ce sens territorial en français moderne.
- source_word: וּשְׁכַבְתֶּם
  choice: vous vous coucherez
  rationale: שׁכב signifie littéralement « se coucher ». Cette traduction conserve l’image d’un repos rendu possible par la sécurité.
- source_word: וְאֵין מַחֲרִיד
  choice: sans que personne vous effraie
  rationale: Le participe מַחֲרִיד désigne ce qui provoque l’effroi. La formulation française garde cette valeur causative sans alourdir la phrase.
- source_word: וְהִשְׁבַּתִּי
  choice: Je ferai disparaître
  rationale: La forme causative de שׁבת signifie « faire cesser ». Dans ce contexte, « faire disparaître » exprime clairement que ces animaux ne menaceront plus le pays.
- source_word: חַיָּה רָעָה
  choice: les animaux dangereux
  rationale: חַיָּה désigne un animal, et רָעָה le qualifie ici selon le mal ou le danger qu’il cause, non selon une culpabilité morale.
- source_word: וְחֶרֶב
  choice: et l’épée
  rationale: חֶרֶב signifie littéralement « épée » et fonctionne ici comme une image de la guerre ou d’une invasion armée. Conserver l’image respecte la formulation hébraïque.
- source_word: לֹא תַעֲבֹר בְּאַרְצְכֶם
  choice: ne traversera pas votre pays
  rationale: עבר signifie « passer, traverser ». Cette traduction conserve l’image d’une force armée qui ne pénétrera pas dans le territoire d’Israël.
theological_decisions:
- issue: Portée de la paix promise
  choice: Une sécurité liée à l’alliance et vécue concrètement dans le pays, comprenant l’absence de peur, de menace animale et d’invasion armée.
  alternative: Une paix purement intérieure ou, à l’inverse, exclusivement politique.
  rationale: Les images du repos sans crainte, des animaux dangereux et de l’épée donnent à la promesse une portée matérielle et collective, sans exclure le bien-être plus large suggéré par שָׁלוֹם.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation articule les trois aspects de la promesse sans effacer leur parallélisme. « Pays » maintient l’ancrage territorial, tandis que « l’épée » conserve la figure hébraïque, explicitée en note.
