  text: וְ/אִם תֵּֽלְכ֤וּ עִמִּ/י֙ קֶ֔רִי וְ/לֹ֥א תֹאב֖וּ לִ/שְׁמֹ֣עַֽ לִ֑/י וְ/יָסַפְתִּ֤י עֲלֵי/כֶם֙ מַכָּ֔ה שֶׁ֖בַע כְּ/חַטֹּאתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/021.yaml
  text: And if you walk contrary to me and are not willing to listen to me[b][a], then I will continue to strike you sevenfold according to your sins.
translation:
  language: fr
  text: Si vous vous conduisez envers moi avec hostilité[a] et que vous ne voulez pas m’écouter, alors je vous frapperai encore sept fois plus, à la mesure de vos péchés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en opposition à moi ». L’expression hébraïque, littéralement « marcher avec moi en qéri », est difficile ; dans ce chapitre, elle désigne une attitude d’opposition ou d’hostilité plutôt qu’une conduite laissée au hasard.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire plus littéralement : « j’ajouterai contre vous des coups, au septuple, selon vos péchés ».'
    reason: alternative_reading
lexical_decisions:
- source_word: קֶרִי
  choice: avec hostilité
  rationale: Dans la formule répétée de Lévitique 26, ce terme difficile décrit une attitude d’opposition à Dieu. « Avec hostilité » exprime cette disposition sans retenir le sens de hasard, peu probable ici.
- source_word: תֵּלְכוּ עִמִּי קֶרִי
  choice: vous vous conduisez envers moi avec hostilité
  rationale: Le verbe « marcher » désigne idiomatiquement la conduite. La formulation française rend naturellement l’attitude durable d’opposition exprimée par l’hébreu.
- source_word: תֹאבוּ
  choice: ne vouliez pas
  rationale: Le verbe porte sur la volonté et indique ici un refus persistant, et non une simple incapacité à entendre.
- source_word: לִשְׁמֹעַ לִי
  choice: m’écouter
  rationale: « Écouter » conserve le sens lexical tout en laissant présente l’idée contextuelle d’obéissance.
- source_word: וְיָסַפְתִּי
  choice: encore
  rationale: Le verbe signifie littéralement « ajouter ». Dans cette série de sanctions croissantes, « encore » indique qu’un nouveau châtiment vient s’ajouter aux précédents.
- source_word: מַכָּה
  choice: je vous frapperai
  rationale: Le nom désigne un coup, une atteinte ou une plaie. La tournure verbale est naturelle en français et ne réduit pas le terme à une forme particulière de fléau.
- source_word: שֶׁבַע
  choice: sept fois
  rationale: Le nombre est employé adverbialement dans la formule répétée du chapitre et marque l’intensification du châtiment.
- source_word: כְּחַטֹּאתֵיכֶם
  choice: à la mesure de vos péchés
  rationale: La préposition כ exprime ici une correspondance ou une proportion. Cette formulation préserve mieux cette nuance que le simple causal « à cause de vos péchés ».
theological_decisions:
- issue: Nature de la formule de sanction de l’alliance
  choice: Présenter le verset comme l’intensification du jugement divin, en correspondance avec les péchés du peuple, sans préciser la forme de l’atteinte.
  alternative: Traduire מַכָּה par « fléau » ou rendre כְּחַטֹּאתֵיכֶם seulement par « à cause de vos péchés ».
  rationale: Le texte annonce une aggravation des sanctions de l’alliance, mais le terme מַכָּה reste assez large. La traduction conserve aussi la relation de mesure suggérée par la préposition hébraïque.
translation_notes:
  register: Français international moderne, courant et digne. La tournure « vous vous conduisez » transpose l’emploi idiomatique de « marcher », tandis que « m’écouter » maintient sans l’expliciter entièrement la nuance d’obéissance.
