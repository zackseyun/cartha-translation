source:
  edition: WLC
  text: וְ/זָכַרְתִּ֥י לָ/הֶ֖ם בְּרִ֣ית רִאשֹׁנִ֑ים אֲשֶׁ֣ר הוֹצֵֽאתִי אֹתָ/ם֩ מֵ/אֶ֨רֶץ מִצְרַ֜יִם לְ/עֵינֵ֣י הַ/גּוֹיִ֗ם לִ/הְיֹ֥ת לָ/הֶ֛ם לֵ/אלֹהִ֖ים אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/045.yaml
  text: 'But I will remember for them the covenant with their forefathers, whom I brought out from the land of Egypt in the sight of the nations, to be their God: I am Yahweh.'
translation:
  language: fr
  text: Mais je me souviendrai en leur faveur de l’alliance conclue avec leurs ancêtres[a], ceux que j’ai fait sortir du pays d’Égypte sous les yeux des nations, afin que je sois leur Dieu. Je suis Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec les premiers » ou « avec ceux d’autrefois ». L’hébreu dit littéralement « l’alliance [avec] les premiers » ; la proposition suivante les présente comme ceux que Dieu a fait sortir d’Égypte.
    reason: Signaler le caractère elliptique de l’expression hébraïque et l’alternative lexicale, sans identifier ces personnes de façon indue aux seuls patriarches.
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: Mais je me souviendrai
  rationale: Le וְ marque ici une reprise contrastive après l’annonce du jugement. « Mais » rend ce mouvement discursif, tandis que le futur conserve la valeur du verbe.
- source_word: לָהֶם
  choice: en leur faveur
  rationale: Cette formulation conserve la préposition ל et indique que ce souvenir agit au bénéfice du peuple, plutôt que de signifier simplement « je me souviendrai d’eux ».
- source_word: בְּרִית רִאשֹׁנִים
  choice: l’alliance conclue avec leurs devanciers
  rationale: רִאשֹׁנִים, adjectif masculin pluriel employé comme substantif, désigne les personnes d’autrefois auxquelles se rapporte la proposition suivante. « Devanciers » préserve mieux cette nuance que « ancêtres », qui pourrait suggérer exclusivement les patriarches. « Conclue avec » explicite en français la relation elliptique entre « alliance » et ces personnes.
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם
  choice: ceux que j’ai fait sortir
  rationale: La proposition relative vise les personnes désignées par רִאשֹׁנִים, et non l’alliance. La reprise par « ceux » lève naturellement en français toute ambiguïté grammaticale indésirable.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: du pays d’Égypte
  rationale: Expression française naturelle qui conserve la formule historique et géographique de l’Exode.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: sous les yeux des nations
  rationale: Rendu proche de l’image hébraïque, soulignant que la sortie d’Égypte s’est accomplie publiquement, devant les autres peuples.
- source_word: לִהְיֹת לָהֶם לֵאלֹהִים
  choice: afin d’être leur Dieu
  rationale: Cette traduction naturelle conserve à la fois la finalité exprimée par לִהְיֹת et la formule d’alliance.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française courante du nom divin, qui le rend comme nom propre plutôt que de lui substituer le titre « le Seigneur ».
theological_decisions:
- issue: Référent de בְּרִית רִאשֹׁנִים
  choice: L’alliance conclue avec les devanciers d’Israël, identifiés par la suite comme ceux que Dieu a fait sortir d’Égypte.
  alternative: « L’alliance avec leurs ancêtres » ou « l’alliance des premiers »
  rationale: La construction hébraïque est concise, mais le pluriel personnel repris par אֹתָם (« eux ») dans la proposition relative renvoie à une génération antérieure. « Devanciers » évite de confondre sans justification cette génération de l’Exode avec les seuls patriarches, tout en maintenant la portée historique et collective.
- issue: Rapport entre le souvenir divin et les bénéficiaires
  choice: Dieu se souvient de l’alliance en faveur du peuple présent.
  alternative: Dieu se souvient simplement du peuple lui-même.
  rationale: 'Le complément לָהֶם est conservé séparément de l’objet « l’alliance » : le souvenir porte sur l’alliance et s’exerce au bénéfice des destinataires.'
translation_notes:
  register: Français international moderne, digne et accessible. « Sous les yeux » conserve l’image concrète de l’hébreu; « ceux que » clarifie le rattachement de la proposition relative. Le nom divin est rendu par « Yahvé », forme usuelle en français.
