revisions:
- from: Mais je me souviendrai en leur faveur de l’alliance conclue avec leurs devanciers[a], ceux que j’ai fait sortir du pays d’Égypte sous les yeux des nations afin d’être leur Dieu. Je suis Yahvé.
  to: Mais je me souviendrai en leur faveur de l’alliance conclue avec leurs ancêtres[a], ceux que j’ai fait sortir du pays d’Égypte sous les yeux des nations, afin que je sois leur Dieu. Je suis Yahvé.
  rationale: La révision remplace un terme français peu usuel par « ancêtres », qui est naturel et garde la portée collective et historique du pluriel hébreu. Elle clarifie également que Dieu est le sujet de la finalité « être leur Dieu », tout en conservant l’ordre, le registre et les principales images du texte source.
