  text: וְ/אִ֨ם בְּ/זֹ֔את לֹ֥א תִשְׁמְע֖וּ לִ֑/י וַ/הֲלַכְתֶּ֥ם עִמִּ֖/י בְּ/קֶֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/027.yaml
  text: But if in spite of this you will not listen to me[a], and you walk contrary to me[b],
translation:
  language: fr
  text: Mais si, malgré cela[a], vous ne m’écoutez pas et que vous vous conduisez envers moi avec hostilité[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en dépit de cela » ou « malgré tout cela ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « vous marchez avec moi dans l’hostilité ». Le mot hébreu traduit par « hostilité » est rare et son sens exact est discuté ; dans ce chapitre, il évoque une conduite opposée à Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit une nouvelle étape conditionnelle et adversative dans la progression des avertissements de l’alliance.
- source_word: בְּזֹאת
  choice: malgré cela
  rationale: Renvoie aux mesures disciplinaires précédentes avec une valeur concessive naturelle en français.
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: vous ne m’écoutez pas
  rationale: Préserve l’image auditive de שׁמע tout en laissant entendre l’obéissance attendue.
- source_word: וַהֲלַכְתֶּם עִמִּי
  choice: vous vous conduisez envers moi
  rationale: Exprime en français courant l’emploi idiomatique de הלך pour la conduite, tout en conservant la dimension relationnelle de עִמִּי.
- source_word: בְּקֶרִי
  choice: avec hostilité
  rationale: Le terme rare קֶרִי désigne ici une attitude d’opposition; « avec hostilité » est clair sans réduire la formule à la seule désobéissance.
theological_decisions:
- issue: Formule d’avertissement liée à l’alliance en Lévitique 26
  choice: vous vous conduisez envers moi avec hostilité
  alternative: vous marchez en opposition avec moi
  rationale: La formulation retenue conserve l’idée d’une conduite relationnelle hostile envers Dieu, sans se limiter à « désobéir », tout en restant naturelle en français moderne. La note signale l’expression hébraïque plus littérale et l’incertitude lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. « Vous » correspond au pluriel adressé au peuple. La phrase demeure ouverte par une virgule, conformément à la continuité syntaxique avec le verset suivant.
