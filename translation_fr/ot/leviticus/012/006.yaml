source:
  edition: WLC
  text: וּ/בִ/מְלֹ֣את יְמֵ֣י טָהֳרָ֗/הּ לְ/בֵן֮ א֣וֹ לְ/בַת֒ תָּבִ֞יא כֶּ֤בֶשׂ בֶּן שְׁנָת/וֹ֙ לְ/עֹלָ֔ה וּ/בֶן יוֹנָ֥ה אוֹ תֹ֖ר לְ/חַטָּ֑את אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵֽן׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/006.yaml
  text: And when the days of her purification are completed[a], whether for a son or for a daughter, she shall bring a year-old lamb for a burnt offering, and a young pigeon or a turtledove for a sin offering, to the priest at the entrance of the tent of meeting.
translation:
  language: fr
  text: Lorsque les jours de sa purification seront achevés, que ce soit pour un fils ou pour une fille, elle apportera un agneau d’un an en holocauste, ainsi qu’un jeune pigeon ou une tourterelle en sacrifice pour le péché[a], au prêtre, à l’entrée de la tente de la Rencontre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en sacrifice de purification ». Le terme hébreu peut désigner l’offrande qui sert à ôter une impureté rituelle, et non seulement un sacrifice lié à une faute morale.
    reason: Alternative lexicale importante dans ce contexte de purification rituelle.
lexical_decisions:
- source_word: וּבִמְלֹאת
  choice: Lorsque… seront achevés
  rationale: La préposition suivie de l’infinitif construit de מלא marque l’achèvement d’une période. Cette formulation rend naturellement la valeur temporelle et prescriptive du contexte.
- source_word: יְמֵי טָהֳרָהּ
  choice: les jours de sa purification
  rationale: טָהֳרָה désigne ici la purification ou le retour à l’état de pureté rituelle; « purification » conserve précisément cette catégorie lévitique.
- source_word: לְבֵן אוֹ לְבַת
  choice: que ce soit pour un fils ou pour une fille
  rationale: Cette tournure française explicite naturellement que la prescription vaut dans les deux cas mentionnés.
- source_word: תָּבִיא
  choice: elle apportera
  rationale: L’imparfait hébreu a ici une valeur prescriptive. Le futur français convient au registre juridique biblique sans ajouter une insistance étrangère au texte.
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: un agneau d’un an
  rationale: L’expression désigne un agneau dans sa première année ou âgé d’environ un an; la formulation retenue est concise et courante en français.
- source_word: לְעֹלָה
  choice: en holocauste
  rationale: עֹלָה est le terme sacrificiel technique désignant une offrande entièrement consumée. « Holocauste » est le terme biblique français établi.
- source_word: וּבֶן יוֹנָה אוֹ תֹר
  choice: ainsi qu’un jeune pigeon ou une tourterelle
  rationale: בֶּן יוֹנָה désigne un jeune pigeon, tandis que תֹר désigne spécifiquement une tourterelle. « Ainsi que » relie naturellement les deux offrandes requises.
- source_word: לְחַטָּאת
  choice: en sacrifice pour le péché
  rationale: חַטָּאת est le terme sacrificiel traditionnellement rendu ainsi, mais il peut aussi désigner une offrande de purification, particulièrement dans ce contexte rituel; cette possibilité est signalée en note.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד אֶל הַכֹּהֵן
  choice: au prêtre, à l’entrée de la tente de la Rencontre
  rationale: 'La formulation conserve l’ordre final de l’hébreu: les offrandes sont apportées au prêtre, dont le lieu de service est précisé ensuite.'
theological_decisions:
- issue: Sens de חַטָּאת dans le contexte de la purification après l’accouchement
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le rendu principal maintient le terme sacrificiel français traditionnel et sa cohérence dans le Lévitique. La note préserve toutefois la portée rituelle possible du mot et évite de laisser entendre que l’accouchement constitue en lui-même une faute morale.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire cultuel établi (« purification », « holocauste », « sacrifice pour le péché », « tente de la Rencontre ») est conservé, avec une note pour préserver l’ambiguïté réelle de חַטָּאת.
