  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Yahweh[a] parla à Moïse :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; aussi rendu par « le SEIGNEUR » ou « Jéhovah ».'
    reason: Signaler la forme hébraïque du nom divin et des rendus alternatifs, avec un ancrage sur « Yahweh ».
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol de דבר fait progresser le récit et introduit une parole divine. « Parla » rend naturellement cette formule narrative en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » représente le nom divin YHWH au lieu de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition désigne ici le destinataire de la parole ; « à » est l’équivalent français naturel.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom hébreu מֹשֶׁה.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Dans cette formule, l’infinitif introduit le contenu du discours direct. En français moderne, les deux-points remplissent naturellement cette fonction sans la lourdeur de « en disant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre et évite de le remplacer silencieusement par un titre ; la note signale les autres usages de traduction.
translation_notes:
  register: 'Français international moderne, simple et digne. La formule hébraïque de parole est rendue idiomatiquement : le passé simple convient à l’avancée narrative, et les deux-points introduisent le discours annoncé au verset suivant.'
