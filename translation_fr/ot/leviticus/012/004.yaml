id: LEV.12.4
reference: Leviticus 12:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/שְׁלֹשִׁ֥ים יוֹם֙ וּ/שְׁלֹ֣שֶׁת יָמִ֔ים תֵּשֵׁ֖ב בִּ/דְמֵ֣י טָהֳרָ֑ה בְּ/כָל קֹ֣דֶשׁ לֹֽא תִגָּ֗ע וְ/אֶל הַ/מִּקְדָּשׁ֙ לֹ֣א תָבֹ֔א עַד מְלֹ֖את יְמֵ֥י טָהֳרָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/004.yaml
  text: Then she shall remain for thirty-three days in the blood of her purification. She shall not touch any holy thing[a], and she shall not come into the sanctuary, until the days of her purification are completed.
translation:
  language: fr
  text: Puis elle restera encore trente-trois jours dans le sang de sa purification[a]. Elle ne touchera à rien de saint et n’entrera pas dans le sanctuaire jusqu’à ce que les jours de sa purification soient accomplis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans les sangs de purification ». L’expression hébraïque désigne vraisemblablement la période qui suit l’accouchement, associée au saignement et à la purification rituelle.'
    reason: La formule hébraïque est inhabituelle et ambiguë ; la note en donne la forme littérale et le référent contextuel probable.
lexical_decisions:
- source_word: וּ/שְׁלֹשִׁים יוֹם וּ/שְׁלֹשֶׁת יָמִים
  choice: encore trente-trois jours
  rationale: L’hébreu compte littéralement « trente jours et trois jours ». Le français naturel dit « trente-trois jours » ; « encore » marque la continuation de la période décrite au verset précédent.
- source_word: תֵּשֵׁב
  choice: elle restera
  rationale: Dans ce contexte légal, ישׁב indique le maintien dans un état pendant une durée, plutôt que l’action physique de s’asseoir.
- source_word: בִּ/דְמֵי טָהֳרָה
  choice: dans le sang de sa purification
  rationale: Cette formulation conserve l’image concrète et difficile de l’hébreu, où דְמֵי est morphologiquement pluriel mais peut désigner le sang. Le possessif est explicité d’après le contexte et le suffixe de la fin du verset.
- source_word: בְּ/כָל קֹדֶשׁ לֹא תִגָּע
  choice: elle ne touchera à rien de saint
  rationale: La tournure française « toucher à » convient à l’interdiction portant sur toute chose sainte et préserve l’étendue de כָּל.
- source_word: וְ/אֶל הַ/מִּקְדָּשׁ לֹא תָבֹא
  choice: et n’entrera pas dans le sanctuaire
  rationale: Bien que בוא signifie littéralement « venir », « entrer dans » exprime naturellement en français le mouvement vers l’intérieur du sanctuaire marqué par אֶל.
- source_word: עַד מְלֹאת יְמֵי טָהֳרָהּ
  choice: jusqu’à ce que les jours de sa purification soient accomplis
  rationale: La proposition temporelle rend idiomatiquement l’idée d’achèvement exprimée par מלא, tout en conservant le vocabulaire cultuel de la purification.
theological_decisions:
- issue: Rendre la terminologie de pureté rituelle sans suggérer une faute morale
  choice: purification
  alternative: purification rituelle / purification corporelle
  rationale: Le passage règle le statut cultuel après l’accouchement. « Purification » garde cette catégorie sans attribuer à la femme une culpabilité morale que le verset n’énonce pas.
- issue: Préserver l’expression difficile « sang de purification »
  choice: dans le sang de sa purification
  alternative: pendant la période de purification liée à son saignement
  rationale: Le texte principal conserve la tension et l’image hébraïques ; la note explique le sens probable sans remplacer le texte par une interprétation plus précise que l’original.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur simple maintient le ton normatif de la prescription. La formulation conserve la terminologie cultuelle et l’étrangeté réelle de l’expression hébraïque sans lui donner une portée morale.
