  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם נְקֵבָ֣ה תֵלֵ֔ד וְ/טָמְאָ֥ה שְׁבֻעַ֖יִם כְּ/נִדָּתָ֑/הּ וְ/שִׁשִּׁ֥ים יוֹם֙ וְ/שֵׁ֣שֶׁת יָמִ֔ים תֵּשֵׁ֖ב עַל דְּמֵ֥י טָהֳרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/005.yaml
  text: But if she gives birth to a female child[a], then she shall be unclean for two weeks, as in her menstruation[b]; and for sixty-six days she shall remain in the blood of purification.
translation:
  language: fr
  text: Mais si elle met au monde une fille, elle sera impure pendant deux semaines, comme lors de ses règles[a] ; puis, pendant soixante-six jours, elle restera dans le sang de purification[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus explicitement : « comme pendant son impureté menstruelle ». L’hébreu compare l’état rituel qui suit l’accouchement à celui qui est associé aux règles.'
    reason: lexical_alternative
  - marker: b
    text: L’expression « sang de purification » désigne le sang associé à la période prescrite de purification après l’accouchement ; elle n’implique pas une faute morale.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit le cas contrasté de la naissance d’une fille par rapport au verset précédent ; « Mais si » rend naturellement cette articulation en français.
- source_word: נְקֵבָה תֵלֵד
  choice: elle met au monde une fille
  rationale: נְקֵבָה désigne ici un enfant de sexe féminin. « Une fille » est naturel dans le contexte d’un accouchement, tandis que « met au monde » rend clairement ילד.
- source_word: וְטָמְאָה
  choice: elle sera impure
  rationale: Exprime le statut rituel résultant de l’accouchement. Le terme biblique « impure » est conservé sans ajouter dans le texte le qualificatif interprétatif « rituellement ».
- source_word: שְׁבֻעַיִם
  choice: pendant deux semaines
  rationale: La forme duelle désigne ici deux semaines ; cette formulation est précise et idiomatique en français.
- source_word: כְּנִדָּתָהּ
  choice: comme lors de ses règles
  rationale: נִדָּה renvoie ici à l’état ou à la période associés aux menstruations. Cette formulation française est actuelle et claire, tout en laissant la note expliciter la comparaison rituelle.
- source_word: וְשִׁשִּׁים יוֹם וְשֵׁשֶׁת יָמִים
  choice: puis, pendant soixante-six jours
  rationale: Réunit naturellement en français les deux éléments du nombre hébreu. « Puis » marque la succession des périodes indiquée par le contexte.
- source_word: תֵּשֵׁב
  choice: elle restera
  rationale: Le verbe signifie littéralement « s’asseoir, demeurer » ; dans ce contexte juridique, il indique la continuation dans un état ou une période.
- source_word: עַל דְּמֵי טָהֳרָה
  choice: dans le sang de purification
  rationale: Rend de façon transparente l’expression hébraïque, littéralement « sangs de purification », tout en employant le singulier idiomatique en français. L’expression demeure volontairement légèrement technique, comme dans la source.
theological_decisions:
- issue: Nature de l’impureté après l’accouchement
  choice: Employer « impure » au sens du statut rituel prescrit par le Lévitique
  alternative: « rituellement impure » ou « en état d’impureté rituelle »
  rationale: Le texte traite de l’accès cultuel et non d’une faute morale. Garder le terme simple préserve le vocabulaire de la source, tandis que la note empêche une lecture culpabilisante.
- issue: Sens de « sang de purification »
  choice: Conserver l’expression cultuelle sans la transformer en affirmation de culpabilité morale
  alternative: « le temps de la purification de son sang » ou « la période des pertes de sang liées à sa purification »
  rationale: La construction hébraïque est concise et peut désigner le sang associé à la période de purification. Une reformulation plus explicite résoudrait une expression que le texte laisse technique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste juridique sans être archaïque. Les termes rituels « impure » et « purification » sont conservés pour assurer la transparence avec l’hébreu, et les notes préviennent toute confusion avec une culpabilité morale.
