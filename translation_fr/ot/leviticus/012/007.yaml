id: LEV.12.7
reference: Leviticus 12:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִקְרִיב֞/וֹ לִ/פְנֵ֤י יְהוָה֙ וְ/כִפֶּ֣ר עָלֶ֔י/הָ וְ/טָהֲרָ֖ה מִ/מְּקֹ֣ר דָּמֶ֑י/הָ זֹ֤את תּוֹרַת֙ הַ/יֹּלֶ֔דֶת לַ/זָּכָ֖ר א֥וֹ לַ/נְּקֵבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/007.yaml
  text: And he shall present it before Yahweh and make atonement for her[a], and she shall be cleansed from the source of her blood. This is the law for the woman who gives birth, whether to a male or to a female.
translation:
  language: fr
  text: Il le présentera devant Yahweh et fera l’expiation pour elle. Elle sera alors purifiée de la source de son sang[a]. Telle est la loi concernant la femme qui accouche, que ce soit d’un garçon ou d’une fille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de son écoulement de sang ». L’hébreu dit littéralement « de la source de son sang ».
    reason: L’expression hébraïque conserve l’image d’une source, mais peut désigner contextuellement l’écoulement sanguin consécutif à l’accouchement.
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: Il le présentera
  rationale: Le hiphil de קרב, avec suffixe objet masculin singulier, décrit l’acte par lequel le prêtre présente devant Dieu l’élément sacrificiel évoqué dans le contexte. « Présentera » garde le sens cultuel sans ajouter de précision absente du verset.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: La formule cultuelle signifie « devant » ou « en présence de » Dieu. Le nom divin יהוה est rendu par « Yahweh » afin de conserver le nom propre du texte hébreu.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: fera l’expiation pour elle
  rationale: Dans ce contexte sacerdotal, כפר désigne l’expiation accomplie au moyen du sacrifice. Cette formulation conserve le langage rituel sans imposer une théorie particulière de l’expiation.
- source_word: וְטָהֲרָה
  choice: Elle sera alors purifiée
  rationale: 'Le verbe exprime ici le résultat de l’action sacerdotale : la femme retrouve l’état de pureté rituelle. Le passif français rend naturellement ce résultat; « alors » explicite sobrement la succession indiquée par la construction hébraïque.'
- source_word: מִמְּקֹר דָּמֶיהָ
  choice: de la source de son sang
  rationale: מָקוֹר signifie littéralement « source » ou « fontaine ». L’expression conserve l’image hébraïque, tout en signalant en note le sens contextuel possible de l’écoulement sanguin.
- source_word: זֹאת תּוֹרַת
  choice: Telle est la loi concernant
  rationale: תּוֹרָה désigne ici la prescription rituelle applicable au cas décrit. « Loi » convient à la formule récurrente du Lévitique, et « concernant » donne une tournure française naturelle.
- source_word: הַיֹּלֶדֶת
  choice: la femme qui accouche
  rationale: Le participe désigne explicitement la femme en situation d’enfantement. Cette traduction est précise et courante en français moderne.
- source_word: לַזָּכָר אֹו לַנְּקֵבָה
  choice: que ce soit d’un garçon ou d’une fille
  rationale: L’hébreu emploie les termes « mâle » et « femelle ». Pour des êtres humains, « garçon » et « fille » est plus naturel en français tout en préservant exactement l’alternative sexuelle exprimée.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » maintient le nom propre de l’alliance sans le remplacer par un titre.
- issue: Portée de l’expiation et de la purification après l’accouchement
  choice: Conserver le vocabulaire rituel d’expiation et de purification
  alternative: Reformuler en termes de pardon moral
  rationale: Le contexte concerne la pureté cultuelle liée au sang après l’accouchement. La traduction ne transforme donc pas cette prescription rituelle en affirmation explicite de culpabilité morale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la formulation légale du Lévitique, tandis que « garçon ou fille » évite le caractère clinique de « mâle ou femelle » en français courant. Le marqueur [a] est placé immédiatement après l’expression qu’il explique.
