lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: Le huitième jour
  rationale: Le français exprime naturellement cette indication temporelle sans conjonction initiale. L’article défini rend l’hébreu בַּיּוֹם הַשְּׁמִינִי de manière claire et actuelle.
- source_word: יִמּוֹל
  choice: on circoncira
  rationale: Le niphal imperfectif a ici une valeur prescriptive et une forme passive. La tournure française avec « on » garde l’agent indéterminé et exprime naturellement l’instruction légale, tandis que la note signale la forme hébraïque.
- source_word: בְּשַׂר עָרְלָתוֹ
  choice: la chair de son prépuce
  rationale: Cette traduction conserve la chaîne nominale hébraïque et son expression corporelle concrète, sans réduire simplement le syntagme à « il ».
