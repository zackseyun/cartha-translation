id: LEV.12.2
reference: Leviticus 12:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אִשָּׁה֙ כִּ֣י תַזְרִ֔יעַ וְ/יָלְדָ֖ה זָכָ֑ר וְ/טָֽמְאָה֙ שִׁבְעַ֣ת יָמִ֔ים כִּ/ימֵ֛י נִדַּ֥ת דְּוֺתָ֖/הּ תִּטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a woman conceives and gives birth to a male child, then she shall be unclean seven days[c][b]; she shall be unclean as in the days of her menstrual impurity.'
translation:
  language: fr
  text: 'Parle aux Israélites et dis : Si[a] une femme devient enceinte et met au monde un garçon[b], elle sera impure[c] pendant sept jours ; elle sera impure comme pendant la période d’impureté liée à ses règles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Lorsqu’une femme devient enceinte ». Dans cette formulation juridique, la particule hébraïque peut exprimer soit une condition, soit un cas attendu.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « met au monde un mâle ».'
    reason: lexical_alternative
  - marker: c
    text: Il s’agit ici d’un état d’impureté rituelle associé aux règles, et non d’une faute morale.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette désignation nationale rend naturellement en français moderne l’expression hébraïque littérale « fils d’Israël » et vise ici l’ensemble du peuple.
- source_word: אִשָּׁה
  choice: une femme
  rationale: Le terme est générique dans cette prescription légale ; rien n’impose ici le sens plus précis d’« épouse ».
- source_word: כִּי
  choice: si
  rationale: La particule introduit un cas juridique. « Si » en conserve la formulation conditionnelle, bien que « lorsque » soit également possible.
- source_word: תַזְרִיעַ
  choice: devient enceinte
  rationale: Le hiphil de זרע évoque littéralement la production de semence, mais l’expression désigne ici la conception. « Devient enceinte » est clair et naturel en français actuel.
- source_word: וְיָלְדָה זָכָר
  choice: et met au monde un garçon
  rationale: Cette formulation française naturelle conserve la référence explicite au sexe masculin de l’enfant.
- source_word: וְטָמְאָה / תִּטְמָא
  choice: elle sera impure
  rationale: La répétition de l’hébreu est conservée. Le qualificatif explicatif « rituellement » n’est pas ajouté au texte principal, puisque le contexte législatif indique déjà la nature de cette impureté.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: Rend directement la durée indiquée.
- source_word: נִדַּת דְּוֺתָהּ
  choice: la période d’impureté liée à ses règles
  rationale: Cette expression rend le sens menstruel et le statut d’impureté de façon compréhensible en français moderne, sans employer les termes vieillis « indisposition » ou « flux ».
theological_decisions:
- issue: Nature de טמא dans la législation de pureté
  choice: impure
  alternative: rituellement impure
  rationale: Le cadre est celui de la pureté rituelle, mais le verbe hébreu énonce simplement l’impureté. Le texte principal conserve cette concision, tandis que la note en précise la portée.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël
  rationale: L’expression hébraïque est une désignation collective conventionnelle du peuple. « Les Israélites » en restitue la portée nationale sans suggérer que seuls les hommes sont concernés.
translation_notes:
  register: Français international moderne, clair et digne. Le verset conserve la structure juridique et la répétition hébraïque de « elle sera impure », tout en évitant les formulations menstruelles vieillies.
