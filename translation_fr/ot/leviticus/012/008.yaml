  text: וְ/אִם לֹ֨א תִמְצָ֣א יָדָ/הּ֮ דֵּ֣י שֶׂה֒ וְ/לָקְחָ֣ה שְׁתֵּֽי תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֶחָ֥ד לְ/עֹלָ֖ה וְ/אֶחָ֣ד לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלֶ֛י/הָ הַ/כֹּהֵ֖ן וְ/טָהֵֽרָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/008.yaml
  text: But if she cannot afford a lamb[a], then she shall take two turtledoves or two young pigeons, one for a burnt offering and one for a sin offering; and the priest shall make atonement for her, and she shall be clean.
translation:
  language: fr
  text: Mais si elle n’a pas les moyens de se procurer un agneau, elle prendra deux tourterelles ou deux jeunes pigeons, l’un pour l’holocauste et l’autre pour le sacrifice pour le péché[a]. Le prêtre fera expiation pour elle, et elle sera pure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification » ; dans ce contexte, ce sacrifice concerne l’impureté rituelle qui suit l’accouchement.
    reason: Alternative lexicale et clarification du contexte rituel de חַטָּאת.
lexical_decisions:
- source_word: תִמְצָא יָדָהּ דֵּי שֶׂה
  choice: elle n’a pas les moyens de se procurer un agneau
  rationale: L’expression hébraïque, littéralement « sa main ne trouve pas de quoi [obtenir] un agneau », désigne l’insuffisance des ressources. Cette formulation française en exprime naturellement le sens économique.
- source_word: שֶׂה
  choice: un agneau
  rationale: Dans ce contexte sacrificiel et à la lumière du verset précédent, « agneau » est le terme naturel et précis.
- source_word: שְׁתֵּי תֹרִים
  choice: deux tourterelles
  rationale: Le terme hébreu désigne spécifiquement des tourterelles, et non des colombidés en général.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: deux jeunes pigeons
  rationale: L’expression signifie littéralement « deux petits de pigeon » et désigne de jeunes pigeons.
- source_word: עֹלָה
  choice: holocauste
  rationale: « Holocauste » est le terme biblique français établi pour l’offrande entièrement consumée, tout en restant intelligible dans ce contexte.
- source_word: חַטָּאת
  choice: sacrifice pour le péché
  rationale: Cette traduction conserve la désignation sacrificielle habituelle de חַטָּאת. Comme le contexte concerne l’impureté rituelle après l’accouchement plutôt qu’une faute morale explicite, l’autre traduction possible est signalée en note.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: Le prêtre fera pour elle le rite d’expiation
  rationale: Cette formulation préserve la portée cultuelle de כפר et son complément « pour elle », sans préciser indûment le mécanisme théologique.
- source_word: וְטָהֵרָה
  choice: elle sera pure
  rationale: Le verbe indique ici le rétablissement de la pureté rituelle. La formulation est concise et fidèle.
theological_decisions:
- issue: Traduction de חַטָּאת dans le contexte de la purification après l’accouchement
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le texte conserve dans le corps du verset la désignation sacrificielle traditionnelle, sans assimiler pour autant l’accouchement à une faute morale. La note maintient la lecture fonctionnelle « sacrifice de purification », particulièrement pertinente dans ce contexte rituel.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire sacrificiel établi (« holocauste », « rite d’expiation ») est conservé, tandis que l’idiome économique hébreu est rendu de façon naturelle. La note évite que « sacrifice pour le péché » soit compris comme affirmant une faute morale liée à l’accouchement.
