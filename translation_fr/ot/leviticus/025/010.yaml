source:
  edition: WLC
  text: וְ/קִדַּשְׁתֶּ֗ם אֵ֣ת שְׁנַ֤ת הַ/חֲמִשִּׁים֙ שָׁנָ֔ה וּ/קְרָאתֶ֥ם דְּר֛וֹר בָּ/אָ֖רֶץ לְ/כָל יֹשְׁבֶ֑י/הָ יוֹבֵ֥ל הִוא֙ תִּהְיֶ֣ה לָ/כֶ֔ם וְ/שַׁבְתֶּ֗ם אִ֚ישׁ אֶל אֲחֻזָּת֔/וֹ וְ/אִ֥ישׁ אֶל מִשְׁפַּחְתּ֖/וֹ תָּשֻֽׁבוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/010.yaml
  text: And you shall consecrate the fiftieth year[a], and proclaim liberty in the land to all its inhabitants. It shall be a jubilee for you, and each of you shall return to his property[d][c][b], and each of you shall return to his family.
translation:
  language: fr
  text: Vous consacrerez la cinquantième année et proclamerez la libération[a] dans le pays pour tous ses habitants. Ce sera pour vous un jubilé. Chacun de vous retournera sur sa propriété[b], et chacun de vous retournera dans sa famille[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la liberté ». Le mot hébreu désigne ici une libération officiellement proclamée à l’occasion du jubilé.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans sa possession ». Il s’agit notamment d’un domaine foncier héréditaire.
    reason: lexical_alternative
  - marker: c
    text: Ou « dans son clan »; le terme hébreu peut désigner un groupe familial étendu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתֶּם
  choice: Vous consacrerez
  rationale: Le piel de קדשׁ signifie ici « consacrer », c’est-à-dire mettre à part comme saint. « Consacrer » garde la portée cultuelle tout en restant naturel en français moderne.
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: la cinquantième année
  rationale: Cette construction numérique hébraïque désigne idiomatiquement la cinquantième année.
- source_word: וּקְרָאתֶם דְּרוֹר
  choice: et proclamerez la libération
  rationale: דְּרוֹר désigne ici une libération officiellement proclamée dans le cadre du jubilé. « Libération » exprime mieux l’acte concret de remise en liberté et de restauration que le seul état abstrait de « liberté ».
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: La préposition ב indique directement le lieu. L’étendue générale de la proclamation ressort déjà de « tous ses habitants ».
- source_word: לְכָל יֹשְׁבֶיהָ
  choice: pour tous ses habitants
  rationale: Le participe substantivé de ישׁב désigne ceux qui habitent le pays. « Pour » convient naturellement en français à la proclamation d’une libération accordée à ses bénéficiaires.
- source_word: יוֹבֵל הִוא תִּהְיֶה לָכֶם
  choice: Ce sera pour vous un jubilé
  rationale: Dans Lévitique 25, יוֹבֵל est le terme technique désignant l’institution jubilaire, et non simplement la corne ou sa sonnerie.
- source_word: וְשַׁבְתֶּם ... תָּשֻׁבוּ
  choice: retournera ... retournera
  rationale: La répétition de שוב est conservée afin de maintenir l’insistance du texte sur le retour et la restauration.
- source_word: אִישׁ
  choice: chacun de vous
  rationale: אִישׁ est masculin singulier dans sa forme, mais distributif dans ces deux propositions adressées à un groupe à la deuxième personne du pluriel. « Chacun de vous » en restitue naturellement la force sans faire disparaître l’individualisation.
- source_word: אֶל אֲחֻזָּתוֹ
  choice: dans sa propriété
  rationale: אֲחֻזָּה désigne une possession foncière, notamment le bien familial héréditaire. « Propriété » est clair; la préposition française « dans » convient au retour sur un domaine.
- source_word: אֶל מִשְׁפַּחְתּוֹ
  choice: dans sa famille
  rationale: מִשְׁפָּחָה peut désigner la famille ou un groupe de parenté plus large. « Famille » demeure accessible tout en laissant l’alternative « clan » en note.
theological_decisions:
- issue: Portée distributive de אִישׁ dans une loi adressée au peuple
  choice: chacun de vous
  alternative: chaque homme
  rationale: La forme hébraïque est masculine, mais sa fonction est distributive et elle s’insère dans une adresse à la deuxième personne du pluriel. La formulation retenue exprime chaque membre du groupe sans ajouter une restriction masculine que le contexte juridique n’exige pas nécessairement.
- issue: Sens technique de יוֹבֵל
  choice: jubilé
  alternative: corne de bélier
  rationale: Dans ce contexte, le mot nomme l’institution de la cinquantième année. Le traduire par l’instrument servant à l’annoncer réduirait indûment son sens contextuel.
- issue: Nature de la libération désignée par דְּרוֹר
  choice: libération
  alternative: liberté
  rationale: Le contexte associe la proclamation à la remise en liberté et au rétablissement des personnes dans leur propriété et leur groupe familial. « Libération » conserve cette dimension institutionnelle sans préciser au-delà du texte toutes ses modalités.
translation_notes:
  register: Français international moderne, digne et lisible. Le futur de prescription rend la force juridique des formes hébraïques. La répétition « chacun de vous retournera » reproduit volontairement la structure et l’insistance de l’original.
