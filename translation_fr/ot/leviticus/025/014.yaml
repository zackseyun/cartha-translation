review_pass:
  verdict: revise
  source_fidelity: Le sens commercial de מִמְכָּר, de מִיַּד et de ינה est bien visé. Toutefois, « l’un l’autre » transforme la formulation distributive איש את־אחיו en une injonction explicitement réciproque et efface les deux termes relationnels du texte. Une formulation distributive française peut les conserver sans lourdeur.
  naturalness: « Que nul ne lèse son frère » est une tournure juridique claire et naturelle en français moderne. « Votre prochain » rend plus idiomatiquement עָמִית que « compatriote », qui évoque plus étroitement la nationalité moderne.
  terminology: « Léser » convient bien au tort prohibé dans le cadre d’une transaction. « Prochain » et « frère » préservent respectivement la solidarité communautaire exprimée par עמית et par אח, sans imposer une interprétation confessionnelle.
  issues:
  - severity: medium
    issue: La formule « ne vous lésez pas l’un l’autre » ne reflète pas explicitement la construction distributive איש את־אחיו.
    rationale: L’hébreu dit littéralement « qu’un homme ne lèse pas son frère ». Bien que l’application soit communautaire, le français peut conserver cette forme sans modifier la portée.
  - severity: low
    issue: « Compatriote » est plus restrictif et plus moderne dans ses connotations que עָמִית.
    rationale: Le terme désigne un membre du même groupe ou de la même communauté. « Prochain » est l’équivalent français biblique et juridique le plus établi ici.
  revised_text: Si vous vendez un bien à votre prochain, ou si vous achetez quelque chose de lui, que nul ne lèse son frère.[a]
  revised_footnotes:
