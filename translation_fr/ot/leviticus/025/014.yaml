source:
  edition: WLC
  text: וְ/כִֽי תִמְכְּר֤וּ מִמְכָּר֙ לַ/עֲמִיתֶ֔/ךָ א֥וֹ קָנֹ֖ה מִ/יַּ֣ד עֲמִיתֶ֑/ךָ אַל תּוֹנ֖וּ אִ֥ישׁ אֶת אָחִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/014.yaml
  text: And if you sell something to your neighbor[a], or buy from your neighbor, no man shall oppress his brother.
translation:
  language: fr
  text: Si vous vendez un bien à votre prochain, ou si vous achetez quelque chose de lui, que nul ne lèse son frère.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qu’un homme ne lèse son frère ». Le verbe peut désigner le fait de causer un tort ou de tirer injustement avantage de quelqu’un, notamment dans une transaction commerciale.'
    reason: Précision lexicale et conservation de la formulation distributive hébraïque.
lexical_decisions:
- source_word: וְכִי
  choice: Si
  rationale: Dans ce texte juridique, la tournure introduit un cas éventuel. « Si » est naturel en français et le lien avec le contexte n’exige pas de rendre ו séparément.
- source_word: תִמְכְּרוּ מִמְכָּר
  choice: vous vendez un bien
  rationale: Le nom מִמְכָּר désigne ce qui est vendu ou l’objet d’une vente. « Un bien » exprime clairement la transaction sans la lourdeur de « concluez une vente ».
- source_word: לַעֲמִיתֶךָ / עֲמִיתֶךָ
  choice: à votre compatriote / de lui
  rationale: עָמִית désigne ici un membre de la même communauté. « Compatriote » convient au cadre d’Israël; le pronom « lui » évite une répétition pesante tout en gardant le même référent.
- source_word: אוֹ קָנֹה מִיַּד
  choice: ou si vous achetez quelque chose de lui
  rationale: L’infinitif absolu קָנֹה se coordonne au verbe précédent. L’expression מִיַּד indique la provenance dans la transaction; le français idiomatique n’a pas besoin de conserver littéralement « de la main de ».
- source_word: אַל תּוֹנוּ
  choice: ne vous lésez pas
  rationale: Dans ce contexte commercial, ינה exprime le fait de causer un tort ou de tirer injustement avantage d’autrui. « Léser » conserve la portée juridique et économique sans suggérer nécessairement une oppression politique ou violente.
- source_word: אִישׁ אֶת־אָחִיו
  choice: l’un l’autre
  rationale: La construction distributive signifie littéralement « un homme, son frère », mais fonctionne comme une interdiction réciproque au sein de la communauté. « L’un l’autre » rend ce sens naturellement en français.
theological_decisions:
- issue: Portée communautaire des termes masculins אִישׁ et אָחִיו
  choice: Rendre la relation réciproque par « l’un l’autre »
  alternative: « que personne ne lèse son frère »
  rationale: Les formes hébraïques sont masculines, mais leur emploi dans cette règle juridique est distributif et communautaire. La formulation choisie restitue la portée de l’interdiction sans limiter artificiellement son application, tandis que la note conserve la forme plus littérale.
- issue: Nature du tort interdit par ינה
  choice: « léser » avec une note précisant l’avantage injuste
  alternative: « opprimer » ou « exploiter »
  rationale: Le contexte immédiat porte sur une vente ou un achat. « Léser » préserve le caractère moral et juridique du tort sans fixer plus précisément que le texte la forme de l’abus.
translation_notes:
  register: Français moderne, clair et digne, avec une formulation juridique directe. « Compatriote » marque l’appartenance à la même communauté; « léser » convient au contexte commercial. La répétition de עָמִית est allégée par un pronom, et l’idiome « de la main de » est rendu selon l’usage français.
