revisions:
- from: Si vous vendez un bien à votre compatriote, ou si vous achetez quelque chose de lui, ne vous lésez pas l’un l’autre.[a]
  to: Si vous vendez un bien à votre prochain, ou si vous achetez quelque chose de lui, que nul ne lèse son frère.[a]
  rationale: La révision conserve le sens transactionnel du verset et le terme juridique « léser », tout en rendant plus fidèlement et plus naturellement la prohibition distributive. Elle remplace « compatriote » par « prochain », qui correspond mieux à la solidarité communautaire d’עָמִית, et adapte la note à la formulation révisée.
