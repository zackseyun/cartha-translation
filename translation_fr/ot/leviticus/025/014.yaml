    text: 'Littéralement : « qu’un homme ne lèse son frère ». Le verbe peut désigner le fait de causer un tort ou de tirer injustement avantage de quelqu’un, notamment dans une transaction commerciale.'
    reason: Précision lexicale et conservation de la formulation distributive hébraïque.
  revision_rationale: La révision conserve le sens transactionnel du verset et le terme juridique « léser », tout en rendant plus fidèlement et plus naturellement la prohibition distributive. Elle remplace « compatriote » par « prochain », qui correspond mieux à la solidarité communautaire d’עָמִית, et adapte la note à la formulation révisée.
