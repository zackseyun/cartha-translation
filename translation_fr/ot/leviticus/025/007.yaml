  yaml_path: translation/ot/leviticus/025/007.yaml
  text: And for your livestock[a], and for the wild animals that are in your land, all its produce shall be for food.
translation:
  language: fr
  text: À ton bétail et aux animaux sauvages qui sont dans ta terre, toute sa production servira de nourriture.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Toute sa production sera pour manger » ou « pour être mangée ». Le pronom « sa » renvoie à la terre.'
    reason: La note conserve la tournure concrète de l’hébreu et explicite l’antécédent du suffixe féminin.
lexical_decisions:
- source_word: לִבְהֶמְתְּךָ
  choice: à ton bétail
  rationale: בְּהֵמָה désigne ici collectivement les animaux domestiques appartenant au destinataire. « Bétail » rend clairement le contraste avec les animaux sauvages.
- source_word: לַחַיָּה
  choice: aux animaux sauvages
  rationale: Dans son opposition au bétail, חַיָּה désigne les animaux non domestiqués. Cette expression est concrète et naturelle en français moderne.
- source_word: אֲשֶׁר בְּאַרְצְךָ
  choice: qui vivent dans ton pays
  rationale: La proposition relative qualifie les animaux sauvages. « Vivent » explicite naturellement en français la relation exprimée par « être dans », tandis que « pays » convient ici au territoire habité et cultivé.
- source_word: כָּל תְּבוּאָתָהּ
  choice: tout ce qu’elle produira
  rationale: תְּבוּאָה désigne la production ou le rendement de la terre, et le suffixe féminin renvoie à celle-ci. La formulation verbale est idiomatique et conserve cette référence.
- source_word: תִּהְיֶה ... לֶאֱכֹל
  choice: servira de nourriture
  rationale: La construction indique que toute la production sera disponible pour être mangée. « Servira de nourriture » rend naturellement cette destination en français.
theological_decisions: []
