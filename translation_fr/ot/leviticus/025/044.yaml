source:
  edition: WLC
  text: וְ/עַבְדְּ/ךָ֥ וַ/אֲמָתְ/ךָ֖ אֲשֶׁ֣ר יִהְיוּ לָ֑/ךְ מֵ/אֵ֣ת הַ/גּוֹיִ֗ם אֲשֶׁר֙ סְבִיבֹ֣תֵי/כֶ֔ם מֵ/הֶ֥ם תִּקְנ֖וּ עֶ֥בֶד וְ/אָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/044.yaml
  text: As for your male servant and your female servant who may belong to you[a], from the nations that are around you[b], from them you may buy a male servant and a female servant.
translation:
  language: fr
  text: Quant aux esclaves, hommes et femmes, qui vous appartiendront[a], vous pourrez les acheter parmi les nations qui vous entourent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui seront à vous ».'
    reason: Précision sur la formulation possessive de l’hébreu.
  - marker: b
    text: Il s’agit des peuples non israélites établis autour d’Israël.
    reason: Clarification du référent contextuel de « nations ».
lexical_decisions:
- source_word: עַבְדְּךָ וַאֲמָתְךָ
  choice: les esclaves, hommes et femmes
  rationale: Dans ce cadre juridique d’achat et d’appartenance, « esclaves » exprime plus exactement le statut de dépendance que « serviteurs ». La précision « hommes et femmes » maintient la distinction entre les deux termes hébreux.
- source_word: אֲשֶׁר יִהְיוּ לָךְ
  choice: qui vous appartiendront
  rationale: La proposition exprime l’appartenance juridique des personnes concernées. Le futur français restitue naturellement l’imparfait hébreu sans transformer la phrase en commandement.
- source_word: מֵאֵת הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: parmi les nations qui vous entourent
  rationale: גּוֹיִם désigne ici les peuples non israélites voisins. « Nations » reste neutre et évite la coloration religieuse ou néotestamentaire que pourrait prendre « païens ».
- source_word: מֵהֶם תִּקְנוּ
  choice: vous pourrez les acheter parmi
  rationale: קנה signifie acquérir ou acheter. Le contexte législatif accorde une permission plutôt qu’il n’ordonne un achat; « pourrez » en rend la valeur permissive. La reprise française par « les » évite la lourdeur de la répétition hébraïque tout en gardant les nations comme source de l’acquisition.
- source_word: עֶבֶד וְאָמָה
  choice: des esclaves, hommes et femmes
  rationale: La paire singulière hébraïque a une portée générique et distingue les deux sexes. La formulation collective française transmet cette portée de manière claire et actuelle.
theological_decisions:
- issue: Désignation de l’esclavage dans un texte juridique
  choice: Employer « esclaves » plutôt que « serviteurs »
  alternative: « serviteurs et servantes »
  rationale: Le verset parle explicitement de personnes achetées et appartenant à quelqu’un. Traduire par « serviteurs » pourrait atténuer cette réalité juridique et sociale.
- issue: Valeur de תִּקְנוּ
  choice: 'Interprétation permissive : « vous pourrez les acheter »'
  alternative: 'Interprétation prescriptive : « vous les achèterez »'
  rationale: Dans la législation environnante, la phrase autorise une source d’acquisition; elle n’impose pas aux Israélites d’acheter des esclaves.
translation_notes:
  register: Français international moderne, sobre et juridique. La formulation évite les termes archaïques « servante » ou « esclave femme » et conserve explicitement la réalité de l’esclavage ainsi que la distinction entre hommes et femmes.
