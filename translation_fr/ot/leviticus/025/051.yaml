  text: אִם ע֥וֹד רַבּ֖וֹת בַּ/שָּׁנִ֑ים לְ/פִי/הֶן֙ יָשִׁ֣יב גְּאֻלָּת֔/וֹ מִ/כֶּ֖סֶף מִקְנָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/051.yaml
  text: If many years still remain[a], in proportion to them he shall repay his redemption price from the money of his purchase.
translation:
  language: fr
  text: S’il reste encore beaucoup d’années, il remboursera, en proportion de ces années, le prix de son rachat[a], calculé sur le prix auquel il a été acheté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « son rachat ». Le nom hébreu peut désigner l’acte de rachat, mais il désigne probablement ici la somme à rembourser.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: S’il
  rationale: Introduit naturellement en français la condition qui distingue ce cas juridique.
- source_word: עוֹד רַבּוֹת בַּשָּׁנִים
  choice: reste encore beaucoup d’années
  rationale: Le verbe « reste » explicite en français courant l’idée elliptique portée par « encore » et « beaucoup d’années ».
- source_word: לְפִיהֶן
  choice: en proportion de ces années
  rationale: Rend l’expression idiomatique hébraïque « selon leur bouche » et précise que le calcul dépend du nombre d’années restantes.
- source_word: יָשִׁיב
  choice: il remboursera
  rationale: Le hiphil de שוב exprime ici la restitution d’une somme dans un contexte financier et juridique.
- source_word: גְּאֻלָּתוֹ
  choice: le prix de son rachat
  rationale: Dans ce calcul financier, le nom désigne concrètement la somme due pour obtenir le rachat, plutôt que le seul acte abstrait.
- source_word: מִכֶּסֶף מִקְנָתוֹ
  choice: à partir du prix payé pour son acquisition
  rationale: Rend le sens littéral de la somme versée lors de l’acquisition tout en indiquant clairement qu’elle sert de base au calcul proportionnel.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve la structure conditionnelle et le caractère juridique du verset, tout en évitant l’expression peu naturelle « argent de son achat ».
