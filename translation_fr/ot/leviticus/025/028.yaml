revisions:
- from: Mais s’il n’a pas les moyens de lui verser la somme nécessaire, le bien qu’il a vendu restera entre les mains de l’acheteur jusqu’à l’année du jubilé. Lors du jubilé, le bien sera libéré, et l’homme retrouvera sa propriété.[a]
  to: Mais s’il n’a pas les moyens de racheter le bien, le bien qu’il a vendu restera entre les mains de l’acheteur jusqu’à l’année du jubilé ; au jubilé, il sortira de la possession de l’acheteur, et l’homme retrouvera sa propriété.[a]
  rationale: La révision élimine l’ambiguïté française inutile concernant le destinataire d’un versement, rend explicitement mais sobrement la sortie du bien de la possession de l’acheteur, et corrige la formulation de la lecture alternative. Le texte principal conserve la lecture contextuellement probable selon laquelle le vendeur retrouve son bien, tandis que la note préserve l’autre analyse grammaticale possible.
