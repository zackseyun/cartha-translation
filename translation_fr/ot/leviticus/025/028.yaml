  text: וְ/אִ֨ם לֹֽא מָֽצְאָ֜ה יָד֗/וֹ דֵּי֮ הָשִׁ֣יב ל/וֹ֒ וְ/הָיָ֣ה מִמְכָּר֗/וֹ בְּ/יַד֙ הַ/קֹּנֶ֣ה אֹת֔/וֹ עַ֖ד שְׁנַ֣ת הַ/יּוֹבֵ֑ל וְ/יָצָא֙ בַּ/יֹּבֵ֔ל וְ/שָׁ֖ב לַ/אֲחֻזָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/028.yaml
  text: But if his hand does not find enough to restore it to him[a], then what he sold shall remain in the hand of the one who bought it until the year of Jubilee; and it shall go out in the Jubilee, and he shall return to his property.
translation:
  language: fr
  text: Mais s’il n’a pas les moyens de racheter le bien, le bien qu’il a vendu restera entre les mains de l’acheteur jusqu’à l’année du jubilé ; au jubilé, il sortira de la possession de l’acheteur, et l’homme retrouvera sa propriété.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et le bien lui reviendra comme propriété ». Le dernier verbe hébreu peut avoir pour sujet le bien vendu plutôt que le vendeur.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָצְאָה יָדוֹ
  choice: il n’a pas les moyens
  rationale: L’expression hébraïque emploie la « main » comme image des ressources disponibles. En français moderne, la traduction idiomatique exprime clairement l’incapacité financière sans obscurcir la règle juridique.
- source_word: דֵּי הָשִׁיב לוֹ
  choice: de lui verser la somme nécessaire
  rationale: Dans le contexte du rachat foncier, il s’agit de fournir au détenteur du bien la somme suffisante pour le racheter. Cette formulation française rend explicite le mécanisme financier sans réduire הָשִׁיב à un simple remboursement.
- source_word: מִמְכָּרוֹ
  choice: le bien qu’il a vendu
  rationale: Le nom peut désigner la vente ou la chose vendue. Les propositions suivantes montrent que le référent est le bien foncier demeurant en possession de l’acheteur.
- source_word: בְּיַד הַקֹּנֶה אֹתוֹ
  choice: entre les mains de l’acheteur
  rationale: Cette formulation conserve l’image juridique hébraïque de la main comme possession ou maîtrise, tout en étant naturelle en français.
- source_word: שְׁנַת הַיּוֹבֵל
  choice: l’année du jubilé
  rationale: Expression française claire et traditionnelle qui correspond directement à la construction hébraïque.
- source_word: וְיָצָא בַּיּוֹבֵל
  choice: Lors du jubilé, le bien sera libéré
  rationale: Le verbe signifie littéralement « sortir ». Dans cette règle foncière, la forme passive « sera libéré » exprime naturellement que le bien sort de la possession de l’acheteur, sans anticiper entièrement la proposition suivante.
- source_word: וְשָׁב לַאֲחֻזָּתוֹ
  choice: l’homme retrouvera sa propriété
  rationale: Le verbe masculin singulier est compris comme ayant pour sujet le vendeur ou propriétaire initial. « Retrouvera » rend en français naturel son retour à la jouissance de son domaine héréditaire.
theological_decisions:
- issue: Référent du sujet de וְשָׁב
  choice: 'Le vendeur ou propriétaire initial est le sujet : « l’homme retrouvera sa propriété »'
  alternative: 'Le bien vendu est le sujet : « il retournera dans sa propriété » ou « il lui reviendra comme propriété »'
  rationale: Le sujet n’est pas exprimé et le masculin singulier peut grammaticalement renvoyer soit à l’homme, soit au bien vendu. Le contexte du jubilé favorise le retour du propriétaire à son domaine, mais l’autre analyse reste véritablement possible et est donc signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le langage juridique demeure concret. L’idiome hébreu de la main est conservé dans « entre les mains » lorsqu’il est naturel, mais rendu par son sens dans « il n’a pas les moyens ». Le marqueur de note est placé après la proposition concernée.
