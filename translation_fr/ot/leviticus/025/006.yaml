base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/006.yaml
  text: The Sabbath produce of the land shall be for you for food—for you[a], for your male servant, for your female servant, for your hired worker[b], and for your resident foreigner who dwells with you.
translation:
  language: fr
  text: 'Ce que la terre produira pendant son année sabbatique vous servira de nourriture : à toi, à ton esclave, homme ou femme, à ton salarié et à tes résidents étrangers qui séjournent avec toi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le sabbat de la terre sera pour vous pour nourriture ». Il s’agit de ce que la terre produit pendant son année de repos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת הָאָרֶץ
  choice: ce que la terre produira pendant son sabbat
  rationale: Dans ce contexte, l’expression littérale « sabbat de la terre » désigne par métonymie les produits spontanés disponibles durant le repos sabbatique. La formulation française explicite ce référent sans perdre le lien avec le sabbat.
- source_word: לָכֶם לְאָכְלָה
  choice: vous servira de nourriture
  rationale: Rend naturellement en français la destination exprimée par לְאָכְלָה, tout en conservant le pluriel communautaire de לָכֶם.
- source_word: עַבְדְּךָ וְלַאֲמָתֶךָ
  choice: ton esclave, homme ou femme
  rationale: Les deux termes hébreux désignent respectivement un esclave masculin et une esclave féminine. Cette formulation conserve le statut servile et la distinction de sexe sans lourdeur excessive.
- source_word: שְׂכִירְךָ
  choice: ton salarié
  rationale: Le terme désigne une personne engagée contre rémunération, distincte de l’esclave domestique.
- source_word: תוֹשָׁבְךָ הַגָּרִים עִמָּךְ
  choice: le résident étranger qui séjourne chez toi
  rationale: תוֹשָׁב désigne ici un résident non autochtone; le participe הַגָּרִים précise qu’il séjourne auprès du destinataire.
theological_decisions:
- issue: Distinction entre esclaves et travailleur rémunéré dans la législation israélite
  choice: Traduire עבד/אמה par « esclave, homme ou femme » et שׂכיר par « salarié ».
  alternative: Employer indistinctement « serviteur » pour ces catégories.
  rationale: Le texte distingue des statuts sociaux et économiques précis; les confondre atténuerait une différence présente dans l’hébreu.
- issue: Référent de « sabbat de la terre »
  choice: Exprimer dans le texte les produits de la terre durant son sabbat.
  alternative: Conserver littéralement « le sabbat de la terre vous servira de nourriture ».
  rationale: Le contexte indique que ce qui est mangé est la production de l’année sabbatique, non le repos lui-même; la métonymie est rendue explicitement sans ajout doctrinal.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier est conservé dans l’énumération après le pluriel collectif « vous », conformément au passage de לָכֶם à לְךָ dans l’hébreu. Le marqueur de note est placé à la fin de la phrase.
