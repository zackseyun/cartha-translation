    issue: Le relatif est au singulier (« qui séjourne chez toi »), alors que l’hébreu porte le participe pluriel הַגָּרִים.
    rationale: Le français doit rendre ce pluriel par « tes résidents étrangers qui séjournent avec toi ». Cela correspond aussi à עִמָּךְ, « avec toi », plutôt qu’à l’expression plus domestiquée « chez toi ».
  - severity: low
    issue: La note dit « comme nourriture ».
    rationale: 'La préposition לְ dans לְאָכְלָה exprime la destination ou l’usage : « pour nourriture ». « Comme nourriture » est moins exact et moins idiomatique dans une formulation littérale.'
