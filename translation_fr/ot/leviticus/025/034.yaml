id: LEV.25.34
reference: Leviticus 25:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּֽ/שְׂדֵ֛ה מִגְרַ֥שׁ עָרֵי/הֶ֖ם לֹ֣א יִמָּכֵ֑ר כִּֽי אֲחֻזַּ֥ת עוֹלָ֛ם ה֖וּא לָ/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/034.yaml
  text: But the field of pastureland belonging to their cities must not be sold[b][a], for it is their permanent possession.
translation:
  language: fr
  text: Mais les terres de pâturage[a] de leurs villes ne doivent pas être vendues, car elles sont leur propriété permanente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « terres communes » ou « espaces non bâtis ». Le mot hébreu désigne les terrains entourant les villes lévitiques.
    reason: lexical_alternative
  - marker: b
    text: Ou « propriété perpétuelle ». Ici, le terme hébreu traduit par « permanente » souligne le caractère durable et non aliénable de ces terres.
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׂדֵה
  choice: Mais les terres
  rationale: Le nom שָׂדֶה désigne un champ ou une terre. Le pluriel français « les terres » exprime naturellement la valeur collective du singulier hébreu dans ce contexte. La conjonction est rendue par « Mais » pour marquer le contraste avec la disposition précédente concernant les maisons des villes lévitiques.
- source_word: מִגְרַשׁ
  choice: de pâturage
  rationale: מִגְרָשׁ désigne l’espace non bâti entourant une ville, notamment destiné aux troupeaux. « Terres de pâturage » est clair en français moderne, tandis qu’une note conserve les autres nuances possibles.
- source_word: עָרֵיהֶם
  choice: de leurs villes
  rationale: Cette formulation restitue simplement et fidèlement le rapport construit avec les villes appartenant aux Lévites.
- source_word: לֹא יִמָּכֵר
  choice: ne doivent pas être vendues
  rationale: Le niphal de מכר est passif, « être vendu ». « Ne doivent pas être vendues » exprime clairement la portée juridique de l’interdiction en français contemporain.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici la raison de l’interdiction.
- source_word: אֲחֻזַּת עוֹלָם
  choice: propriété permanente
  rationale: אֲחֻזָּה désigne une propriété foncière ou un bien possédé, et עוֹלָם souligne ici son caractère durable et non aliénable. « Propriété permanente » évite de transformer cette règle foncière en affirmation abstraite sur l’éternité.
- source_word: הוּא לָהֶם
  choice: elles sont leur
  rationale: La tournure française accorde le pronom avec « les terres », choisi pour rendre le singulier collectif hébreu, et exprime naturellement l’appartenance.
theological_decisions:
- issue: Portée de עוֹלָם dans la législation foncière d’Israël
  choice: propriété permanente
  alternative: propriété perpétuelle / propriété pour toujours
  rationale: Dans ce contexte juridique, עוֹלָם indique le statut durable et non transférable du bien dans l’ordre de l’alliance. « Permanente » préserve cette force sans imposer une affirmation métaphysique plus forte que le contexte.
translation_notes:
  register: Français international moderne, clair et digne. La formulation juridique reste ferme sans employer le tour plus archaïque « ne seront pas vendues ». Le pluriel « les terres » rend naturellement le singulier collectif hébreu.
