  text: אַחֲרֵ֣י נִמְכַּ֔ר גְּאֻלָּ֖ה תִּהְיֶה לּ֑/וֹ אֶחָ֥ד מֵ/אֶחָ֖י/ו יִגְאָלֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/048.yaml
  text: After he has been sold[a], he may be redeemed; one of his brothers may redeem him.
translation:
  language: fr
  text: Après qu’il aura été vendu[a], il pourra être racheté ; l’un de ses frères pourra le racheter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, dans un sens plus large : « l’un de ses proches parents pourra le racheter ». L’hébreu dit littéralement « l’un de ses frères » et désigne un membre masculin de la famille agissant comme proche parent rédempteur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי נִמְכַּר
  choice: Après qu’il aura été vendu
  rationale: La préposition temporelle suivie du nifal de מכר situe le droit de rachat après la vente. Le futur antérieur convient naturellement au cadre législatif français.
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: il pourra être racheté
  rationale: La construction nominale et existentielle signifie qu’un rachat demeure possible pour lui. La formulation verbale est naturelle en français tout en conservant la portée juridique de גאל.
- source_word: אֶחָד מֵאֶחָיו
  choice: l’un de ses frères
  rationale: Cette traduction conserve le masculin pluriel explicite du texte hébreu et l’idée d’un membre choisi parmi ses frères.
- source_word: יִגְאָלֶנּוּ
  choice: pourra le racheter
  rationale: Le verbe גאל désigne ici l’action du proche qui rachète la personne vendue. « Racheter » rend clairement ce sens juridique en français.
theological_decisions:
- issue: Portée du terme אֶחָיו
  choice: ses frères
  alternative: ses proches parents
  rationale: Le texte dit littéralement « ses frères » et les versets suivants précisent différents degrés de parenté. Le texte principal préserve donc le terme masculin sans l’élargir silencieusement.
- issue: Force de la disposition de rachat
  choice: pourra être racheté
  alternative: sera racheté
  rationale: Le verset établit la possibilité ou le droit de rachat, non la certitude qu’un rachat aura effectivement lieu.
translation_notes:
  register: Français moderne, clair et digne, avec une syntaxe adaptée au style législatif. La répétition de « racheter » reflète celle de la racine hébraïque גאל et assure la cohésion juridique du verset.
