language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אוֹ דֹד֞/וֹ א֤וֹ בֶן דֹּד/וֹ֙ יִגְאָלֶ֔/נּוּ אֽוֹ מִ/שְּׁאֵ֧ר בְּשָׂר֛/וֹ מִ/מִּשְׁפַּחְתּ֖/וֹ יִגְאָלֶ֑/נּוּ אֽוֹ הִשִּׂ֥יגָה יָד֖/וֹ וְ/נִגְאָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/049.yaml
  text: or his uncle[a], or his uncle’s son, may redeem him; or one of his close blood relatives from his clan may redeem him; or if his hand prospers[b], he may redeem himself.
translation:
  language: fr
  text: soit son oncle, soit son cousin[a], pourra le racheter ; ou bien l’un de ses proches parents de son clan pourra le racheter. Ou encore, s’il en acquiert les moyens[b], il pourra se racheter lui-même.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le fils de son oncle ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « si sa main atteint » ; c’est-à-dire s’il parvient à disposer de ressources suffisantes.'
    reason: idiom_explanation
lexical_decisions:
- source_word: דֹדוֹ
  choice: son oncle
  rationale: Dans cette loi de rachat familial, דּוֹד désigne l’oncle.
- source_word: בֶן דֹּדוֹ
  choice: son cousin[a]
  rationale: Littéralement « le fils de son oncle » ; « cousin » est l’équivalent naturel en français moderne, tandis que la note conserve la formulation hébraïque.
- source_word: יִגְאָלֶנּוּ
  choice: pourra le racheter
  rationale: Le verbe גאל désigne ici le rachat exercé par un parent. « Racheter » maintient le vocabulaire juridique et théologique du chapitre, et « pourra » rend la possibilité prévue par la loi.
- source_word: מִשְּׁאֵר בְּשָׂרוֹ
  choice: l’un de ses proches parents
  rationale: L’expression idiomatique évoque un parent proche, lié par la chair. Cette formulation française est naturelle sans effacer la proximité familiale.
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: de son clan
  rationale: מִשְׁפָּחָה désigne ici le groupe familial élargi plutôt que le seul foyer immédiat.
- source_word: הִשִּׂיגָה יָדוֹ
  choice: s’il en acquiert les moyens[b]
  rationale: L’expression hébraïque signifie que ses ressources deviennent suffisantes. Une traduction littérale de l’image de la main serait obscure en français ; la note la signale.
- source_word: וְנִגְאָל
  choice: il pourra se racheter lui-même
  rationale: 'La forme hébraïque est passive, « il sera racheté », mais la condition portant sur ses propres moyens lui donne ici un sens contextuellement réfléchi : il peut assurer son propre rachat.'
theological_decisions:
- issue: Vocabulaire du rachat familial
  choice: Employer « racheter » pour le groupe lexical גאל.
  alternative: libérer moyennant paiement
  rationale: « Racheter » préserve l’unité juridique et théologique du vocabulaire de Lévitique 25 sans réduire l’acte à une simple transaction commerciale.
- issue: Interprétation contextuelle de וְנִגְאָל
  choice: « il pourra se racheter lui-même »
  alternative: « il sera racheté »
  rationale: La morphologie est passive, mais le sujet vient d’acquérir les moyens nécessaires ; le contexte indique donc un rachat effectué avec ses propres ressources. La traduction explicite cette valeur sans lui attribuer nécessairement l’exécution matérielle de la transaction.
- issue: Expression idiomatique הִשִּׂיגָה יָדוֹ
  choice: « s’il en acquiert les moyens » avec conservation de l’image en note
  alternative: « si sa main atteint »
  rationale: Le calque de l’image hébraïque n’est pas intelligible spontanément en français moderne. Le sens économique est donné dans le texte, et la forme concrète de l’hébreu est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. La structure répétitive des possibilités de rachat est conservée, tout en employant « cousin » et une expression idiomatique naturelle pour les ressources suffisantes.
