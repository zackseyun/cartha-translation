  source_fidelity: 'Le texte rend fidèlement les deux interdictions parallèles : l’argent ne doit pas être prêté « à intérêt » (בְּנֶשֶׁךְ), et la nourriture ne doit pas être fournie afin d’en retirer un gain/supplément (בְּמַרְבִּית). « Prêter » dans le premier membre est contextuellement justifié, tandis que « donner » conserve la formulation directe du second membre. L’implicite du bénéficiaire dans le second membre est naturellement repris par « lui » en français.'
