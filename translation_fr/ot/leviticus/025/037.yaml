id: LEV.25.37
reference: Leviticus 25:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֶ֨ת כַּסְפְּ/ךָ֔ לֹֽא תִתֵּ֥ן ל֖/וֹ בְּ/נֶ֑שֶׁךְ וּ/בְ/מַרְבִּ֖ית לֹא תִתֵּ֥ן אָכְלֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/037.yaml
  text: You shall not lend him your money at interest[b][a], nor give him your food for increase.
translation:
  language: fr
  text: Tu ne lui prêteras pas ton argent[a] à intérêt, et tu ne lui donneras pas de ta nourriture pour en tirer un profit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton argent métal ». Le mot hébreu peut désigner aussi bien l’argent métal que l’argent servant de monnaie; ici, le contexte est celui d’un prêt.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « avec une augmentation »; le terme hébreu peut désigner un surplus, un gain ou un profit tiré de ce qui est fourni.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפְּךָ (כֶּסֶף)
  choice: ton argent
  rationale: Dans ce contexte économique et juridique, כֶּסֶף désigne l’argent employé dans un prêt, bien que son sens concret premier soit « argent (métal) ».
- source_word: תִתֵּן לוֹ
  choice: tu ne lui prêteras pas / tu ne lui donneras pas
  rationale: Avec « argent » et « intérêt », נתן prend naturellement le sens contextuel de « prêter »; avec « nourriture », le sens direct « donner » convient et préserve la variation de l’hébreu.
- source_word: בְּנֶשֶׁךְ
  choice: à intérêt
  rationale: נֶשֶׁךְ désigne l’intérêt prélevé sur un prêt. « À intérêt » est clair et actuel, tandis que « à usure » pourrait suggérer à tort un taux seulement excessif.
- source_word: וּבְמַרְבִּית
  choice: pour en tirer un profit
  rationale: מַרְבִּית désigne une augmentation, un gain ou un surplus obtenu sur ce qui est fourni. Cette formulation exprime naturellement en français le gain recherché sur la nourriture sans le confondre avec le terme précédent rendu par « intérêt ».
- source_word: אָכְלֶךָ
  choice: de ta nourriture
  rationale: אָכֶל signifie directement « nourriture ». Le partitif français est naturel après « donner » et n’altère pas le sens du possessif hébreu.
- source_word: לֹא ... לֹא
  choice: Tu ne… pas, et tu ne… pas
  rationale: La répétition des deux négations est conservée afin de rendre les deux interdictions parallèles et le ton juridique du texte.
theological_decisions:
- issue: Portée de l’interdiction concernant le gain
  choice: Conserver deux termes distincts, « intérêt » pour נֶשֶׁךְ et « profit » pour מַרְבִּית
  alternative: Uniformiser les deux expressions sous « intérêt » ou « usure »
  rationale: Le parallélisme rapproche les deux pratiques sans imposer qu’elles soient lexicalement identiques. La traduction maintient donc la tension entre intérêt sur l’argent et gain ou surplus sur la nourriture.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur d’interdiction conserve le registre juridique du passage. La formulation évite « usure », qui peut aujourd’hui évoquer uniquement un intérêt excessif, sens plus étroit que celui de l’hébreu.
