source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֗ת שַׁבַּ֤ת שַׁבָּתוֹן֙ יִהְיֶ֣ה לָ/אָ֔רֶץ שַׁבָּ֖ת לַ/יהוָ֑ה שָֽׂדְ/ךָ֙ לֹ֣א תִזְרָ֔ע וְ/כַרְמְ/ךָ֖ לֹ֥א תִזְמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/004.yaml
  text: But in the seventh year there shall be a sabbath of complete rest for the land[a], a sabbath to Yahweh. You shall not sow your field, and you shall not prune your vineyard.
translation:
  language: fr
  text: Mais, la septième année, ce sera pour la terre un sabbat de repos complet[a], un sabbat pour Yahweh. Tu n’ensemenceras pas ton champ et tu ne tailleras pas ta vigne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un sabbat de cessation totale ». L’expression hébraïque intensifie l’idée d’un arrêt complet.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: Mais, la septième année
  rationale: La conjonction ו peut signifier « et » ou marquer ici le contraste avec les six années de culture mentionnées au verset précédent. « Mais » rend clairement cette progression en français naturel.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: un sabbat de repos complet
  rationale: La combinaison des deux termes intensifie l’idée de cessation. Cette formulation conserve le mot « sabbat » et exprime l’arrêt total sans archaïsme.
- source_word: יִהְיֶה לָאָרֶץ
  choice: ce sera pour la terre
  rationale: Cette tournure respecte la construction hébraïque, qui présente la terre comme bénéficiaire de ce repos, tout en restant idiomatique en français.
- source_word: שַׁבָּת לַיהוָה
  choice: un sabbat pour Yahweh
  rationale: 'La préposition ל marque ici la destination ou la consécration : le repos est consacré à Yahweh.'
- source_word: שָׂדְךָ לֹא תִזְרָע
  choice: Tu n’ensemenceras pas ton champ
  rationale: Le singulier masculin de l’instruction légale est conservé par « tu ». « Ensemencer » exprime précisément l’activité agricole visée.
- source_word: וְכַרְמְךָ לֹא תִזְמֹר
  choice: et tu ne tailleras pas ta vigne
  rationale: Dans le contexte viticole, זמר désigne la taille de la vigne. La répétition de la négation reproduit clairement les deux interdictions parallèles.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom divin plutôt que de le remplacer par un titre, conformément à la décision doctrinale actualisée fournie.
- issue: Nature du repos de la terre
  choice: un sabbat de repos complet
  alternative: un repos agricole ordinaire
  rationale: Le redoublement שַׁבַּת שַׁבָּתוֹן présente l’arrêt comme un repos sabbatique intensifié et consacré à Yahweh, et non comme une simple technique agricole.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement conserve l’adresse juridique au singulier du texte hébreu. « Sabbat » reste en minuscule puisqu’il caractérise ici le repos de la terre plutôt que le nom propre du jour hebdomadaire.
