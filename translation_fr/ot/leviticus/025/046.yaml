base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/046.yaml
  text: You may pass them on as an inheritance to your sons after you[a], to inherit as a possession permanently; from them you may exact labor. But over your brothers, the sons of Israel[b], no man shall rule over his brother harshly.
translation:
  language: fr
  text: Vous pourrez les transmettre en héritage à vos fils après vous[a], pour en faire une propriété héréditaire à perpétuité ; vous pourrez leur imposer le travail. Quant à vos frères, les fils d’Israël[b], nul ne dominera son frère avec dureté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous pourrez les léguer à vos fils après vous comme propriété héréditaire ».'
    reason: lexical_alternative
  - marker: b
    text: « Frères » et « fils d’Israël » rendent directement les termes masculins de parenté en hébreu ; la loi présente ici les autres Israélites comme des membres de la même famille d’alliance.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְנַחֲלְתֶּם
  choice: vous pourrez les transmettre en héritage
  rationale: Le hithpael de נחל exprime ici la transmission de personnes comme bien héréditaire. Cette formulation française est naturelle tout en conservant la portée juridique.
- source_word: לִבְנֵיכֶם אַחֲרֵיכֶם
  choice: à vos fils après vous
  rationale: בנים signifie littéralement « fils » ; le masculin explicite du langage successoral hébreu est conservé.
- source_word: לָרֶשֶׁת אֲחֻזָּה
  choice: afin qu’ils en héritent comme d’une propriété
  rationale: 'La formulation maintient les deux idées présentes dans l’hébreu : l’héritage et la possession juridiquement détenue.'
- source_word: לְעֹלָם
  choice: permanente
  rationale: Dans ce contexte juridique, עוֹלָם désigne le caractère durable ou perpétuel du statut, sans nécessairement évoquer une éternité métaphysique.
- source_word: בָּהֶם תַּעֲבֹדוּ
  choice: vous pourrez leur imposer le travail
  rationale: Le verbe עבד décrit ici un travail exigé de personnes détenues comme propriété. « Imposer le travail » rend clairement la contrainte sans l’atténuer.
- source_word: וּבְאַחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: Mais parmi vos frères, les fils d’Israël
  rationale: La traduction préserve le contraste, la désignation de parenté et l’apposition de l’hébreu.
- source_word: אִישׁ בְּאָחִיו
  choice: aucun homme ... sur son frère
  rationale: 'Cette tournure française exprime naturellement la portée distributive de אִישׁ בְּאָחִיו : chaque Israélite dans sa relation avec son frère.'
- source_word: לֹא תִרְדֶּה בוֹ
  choice: ne dominera ... sur
  rationale: רדה signifie exercer sa domination ou son pouvoir. « Dominer sur » conserve ici la force relationnelle et juridique du verbe.
- source_word: בְּפָרֶךְ
  choice: durement
  rationale: פרך évoque une dureté oppressive dans le cadre du travail forcé. « Durement » reste sobre, direct et idiomatique.
theological_decisions:
- issue: Langage de parenté dans la législation sociale d’Israël
  choice: Conserver « frères » et « fils d’Israël ».
  alternative: Employer « compatriotes israélites » ou « membres de votre peuple ».
  rationale: Les termes masculins de parenté structurent explicitement l’obligation légale en termes de solidarité d’alliance ; les conserver évite d’effacer cette image.
- issue: Rendu explicite de la condition servile et patrimoniale
  choice: Maintenir le vocabulaire d’héritage, de propriété et de travail imposé.
  alternative: Employer un vocabulaire plus atténué de service ou de domesticité.
  rationale: L’hébreu présente sans détour des personnes comme possession héréditaire et comme main-d’œuvre contrainte. La traduction ne doit pas adoucir cette réalité sociale et morale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe juridique demeure lisible, tandis que le vocabulaire de propriété et de travail contraint reste explicite. Les termes masculins du texte source sont conservés là où ils participent à la formulation juridique et à l’image de parenté.
