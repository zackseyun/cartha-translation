revisions:
- from: Vous pourrez les transmettre en héritage à vos fils après vous[a], afin qu’ils en héritent comme d’une propriété permanente ; vous pourrez leur imposer le travail. Mais parmi vos frères, les fils d’Israël[b], aucun homme ne dominera durement sur son frère.
  to: Vous pourrez les transmettre en héritage à vos fils après vous[a], pour en faire une propriété héréditaire à perpétuité ; vous pourrez leur imposer le travail. Quant à vos frères, les fils d’Israël[b], nul ne dominera son frère avec dureté.
  rationale: La révision supprime l’ambiguïté de « afin qu’ils en héritent » en rendant directement la notion de possession héréditaire. Elle améliore aussi l’articulation du contraste et la syntaxe de l’interdiction, sans modifier le sens juridique ni atténuer la réalité du travail contraint et de la propriété héréditaire.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:25:51Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend bien la transmission héréditaire, le caractère durable de la possession, le travail imposé et l’interdiction d’une domination oppressive envers les Israélites. Toutefois, « afin qu’ils en héritent » introduit un antécédent pronominal peu net et transforme inutilement la construction hébraïque de possession héréditaire.
  naturalness: Le français est globalement moderne et clair. « Quant à vos frères » rend plus naturellement le contraste juridique que « Mais parmi vos frères », et « dominer son frère avec dureté » est plus idiomatique que « dominer durement sur son frère ».
  terminology: « Fils », « frères », « fils d’Israël », « propriété héréditaire », « travail » et « dureté » préservent les termes et les enjeux juridiques du texte, sans atténuer sa description de l’asservissement patrimonial.
  issues:
  - severity: medium
    issue: « afin qu’ils en héritent comme d’une propriété permanente »
    rationale: La formulation rend le référent de « en » ambigu et alourdit la syntaxe. לָרֶשֶׁת אֲחֻזָּה exprime directement l’acquisition ou la détention comme possession héréditaire ; « pour en faire une propriété héréditaire » est plus clair et conserve les deux dimensions.
  - severity: low
    issue: « Mais parmi vos frères » et « dominera durement sur son frère »
    rationale: Le contraste porte sur le traitement des frères israélites, non principalement sur le lieu ou le groupe. « Quant à vos frères » et « dominer son frère avec dureté » sont plus naturels en français tout en préservant la portée distributive de איש באחיו.
  revised_text: Vous pourrez les transmettre en héritage à vos fils après vous[a], pour en faire une propriété héréditaire à perpétuité ; vous pourrez leur imposer le travail. Quant à vos frères, les fils d’Israël[b], nul ne dominera son frère avec dureté.
  revised_footnotes:
