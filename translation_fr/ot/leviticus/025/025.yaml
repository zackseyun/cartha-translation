base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/025.yaml
  text: If your brother becomes poor and sells some of his property[b][a], then his nearest kinsman-redeemer shall come and redeem what his brother has sold.
translation:
  language: fr
  text: Si ton frère tombe dans la pauvreté et vend une partie de sa propriété héréditaire[a], alors son plus proche parent viendra et rachètera ce que son frère a vendu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « propriété héréditaire » est le bien foncier familial transmis au sein d’Israël.
    reason: cultural_note
  - marker: b
    text: 'Le terme hébreu désigne le proche parent qui a le droit, et dans ce cadre la responsabilité, de racheter le bien familial. On peut aussi comprendre : « pourra venir et racheter ce que son frère a vendu ».'
    reason: lexical_and_modal_alternative
lexical_decisions:
- source_word: יָמוּךְ
  choice: tombe dans la pauvreté
  rationale: Le verbe exprime une dégradation de la situation économique. Cette formulation est naturelle en français moderne et convient au cadre juridique.
- source_word: אָחִיךָ
  choice: ton frère
  rationale: Le texte hébreu emploie littéralement « frère ». Dans cette loi, le terme peut désigner un membre du peuple d’Israël, mais le lien familial explicite du texte source est conservé.
- source_word: מֵאֲחֻזָּתוֹ
  choice: une partie de sa propriété héréditaire
  rationale: Dans ce contexte, אֲחֻזָּה désigne un bien foncier familial reçu en possession dans le cadre du partage du pays, et non un bien quelconque.
- source_word: גֹאֲלוֹ הַקָּרֹב אֵלָיו
  choice: son plus proche parent ayant droit de rachat
  rationale: גֹּאֵל désigne ici le proche parent habilité, et normalement tenu, à récupérer un bien familial aliéné. La formulation française rend à la fois la parenté et la fonction juridique sans employer le terme potentiellement ambigu « rédempteur ».
- source_word: וּבָא ... וְגָאַל
  choice: viendra racheter
  rationale: La succession verbale énonce l’intervention attendue du proche parent dans cette loi casuistique. « Racheter » restitue ici concrètement l’action juridique exprimée par גאל.
- source_word: אֵת מִמְכַּר אָחִיו
  choice: ce que son frère a vendu
  rationale: מִמְכָּר peut désigner la vente ou le bien vendu. Cette formulation idiomatique conserve cette référence concrète sans lourdeur.
theological_decisions:
- issue: Portée du terme de parenté אָחִיךָ
  choice: ton frère
  alternative: ton compatriote israélite
  rationale: Le contexte peut étendre le terme à un membre de la communauté d’Israël, mais traduire par « frère » préserve l’image de parenté choisie par l’hébreu.
- issue: Traduction du vocabulaire de גאל
  choice: parent ayant droit de rachat / racheter
  alternative: rédempteur / rédimer
  rationale: Dans cette disposition foncière, la traduction retenue rend clairement le rôle juridique et familial. Elle ne supprime pas la portée du concept biblique, explicitée en note, mais évite en français moderne une lecture exclusivement spirituelle de « rédempteur ».
- issue: Force des verbes וּבָא וְגָאַל
  choice: viendra racheter
  alternative: pourra venir racheter
  rationale: La formulation principale conserve la force directe de la séquence verbale hébraïque dans l’énoncé légal. Une note signale la lecture modale possible, afin de ne pas effacer l’ambiguïté entre prescription attendue et droit reconnu.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier conserve l’adresse juridique hébraïque. « Parent ayant droit de rachat » privilégie l’intelligibilité tout en maintenant la fonction précise du גֹּאֵל; les notes donnent le contexte foncier et la nuance modale.
