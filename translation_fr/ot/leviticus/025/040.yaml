source:
  edition: WLC
  text: כְּ/שָׂכִ֥יר כְּ/תוֹשָׁ֖ב יִהְיֶ֣ה עִמָּ֑/ךְ עַד שְׁנַ֥ת הַ/יֹּבֵ֖ל יַעֲבֹ֥ד עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/040.yaml
  text: He shall be with you like a hired worker[a], like a sojourner; he shall serve with you until the year of jubilee.
translation:
  language: fr
  text: Il sera chez toi comme un travailleur salarié, comme un résident[a]. Il travaillera chez toi jusqu’à l’année du jubilé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un résident étranger ». Le terme hébreu désigne une personne établie en résidence; selon le contexte, il peut désigner un résident venu d’ailleurs.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּשָׂכִיר
  choice: comme un travailleur salarié
  rationale: שָׂכִיר désigne une personne engagée contre salaire. « Travailleur salarié » est actuel et souligne ici un statut distinct de celui d’un esclave.
- source_word: כְּתוֹשָׁב
  choice: comme un résident étranger
  rationale: תּוֹשָׁב désigne un non-Israélite établi parmi les Israélites. « Résident étranger » exprime clairement cette catégorie sociale et juridique; « résident temporaire » reste possible.
- source_word: יִהְיֶה עִמָּךְ
  choice: il sera chez toi
  rationale: Cette formulation naturelle conserve l’idée de présence auprès de la personne à qui la loi s’adresse, sans ajouter une relation de propriété.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: jusqu’à l’année du jubilé
  rationale: « L’année du jubilé » est la désignation française usuelle de l’année de libération réglementée dans Lévitique 25.
- source_word: יַעֲבֹד עִמָּךְ
  choice: il travaillera chez toi
  rationale: Dans ce contexte, עבד décrit le travail accompli sous l’autorité du maître de maison. « Travaillera » évite de réintroduire l’idée d’esclavage que le contexte immédiat exclut, tandis que « chez toi » rend naturellement עִמָּךְ.
theological_decisions:
- issue: Statut de l’Israélite appauvri placé au service d’un autre
  choice: Un travailleur salarié et protégé, non traité comme un esclave
  alternative: Le décrire comme un serviteur qui sert son maître
  rationale: Les versets 39 à 43 distinguent explicitement cet Israélite d’un esclave et limitent son service dans le temps. La traduction conserve cette distinction sans effacer le rapport de dépendance économique.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de עִמָּךְ est rendue par « chez toi », formulation idiomatique qui maintient le cadre domestique sans suggérer que le travailleur est une propriété.
