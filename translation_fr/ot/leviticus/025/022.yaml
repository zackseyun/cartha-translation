  text: וּ/זְרַעְתֶּ֗ם אֵ֚ת הַ/שָּׁנָ֣ה הַ/שְּׁמִינִ֔ת וַ/אֲכַלְתֶּ֖ם מִן הַ/תְּבוּאָ֣ה יָשָׁ֑ן עַ֣ד הַ/שָּׁנָ֣ה הַ/תְּשִׁיעִ֗ת עַד בּוֹא֙ תְּב֣וּאָתָ֔/הּ תֹּאכְל֖וּ יָשָֽׁן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/022.yaml
  text: And you shall sow in the eighth year and eat from the old produce until the ninth year; until its produce comes in[a], you shall eat the old.
translation:
  language: fr
  text: Vous sèmerez la huitième année et vous mangerez de l’ancienne récolte jusqu’à la neuvième année. Jusqu’à ce que sa récolte arrive, vous mangerez de l’ancienne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire de l’ancienne récolte. À la fin du verset, l’hébreu dit simplement « ancienne », le mot « récolte » étant sous-entendu d’après le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְרַעְתֶּם
  choice: Vous sèmerez
  rationale: 'Le parfait qal précédé de la conjonction prend ici, dans ce contexte prescriptif, une valeur future : l’ensemencement reprendra la huitième année.'
- source_word: מִן הַתְּבוּאָה יָשָׁן
  choice: de l’ancienne récolte
  rationale: תְּבוּאָה désigne la production agricole ou la récolte, et יָשָׁן indique qu’elle provient d’une année antérieure. Cette formulation est naturelle en français tout en restant proche de l’hébreu.
- source_word: עַד הַשָּׁנָה הַתְּשִׁיעִת
  choice: jusqu’à la neuvième année
  rationale: Traduction directe de la limite temporelle exprimée par עַד et l’ordinal défini.
- source_word: עַד בּוֹא תְּבוּאָתָהּ
  choice: Jusqu’à ce que sa récolte arrive
  rationale: Le suffixe féminin renvoie le plus naturellement à la neuvième année. « Arrive » conserve l’image simple du verbe בוא sans préciser davantage le moment où la récolte devient disponible.
- source_word: תֹּאכְלוּ יָשָׁן
  choice: vous mangerez de l’ancienne
  rationale: L’adjectif substantivé reprend elliptiquement la récolte ancienne. Le maintien de cette ellipse préserve la répétition concise de l’hébreu, avec une note pour éviter toute obscurité.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le futur rend la valeur prescriptive et prospective du passage. « Récolte » est préféré à « produit » ou « production » pour son naturel dans un contexte agricole. L’ellipse finale est conservée afin de reproduire la concision et la répétition de l’hébreu.
