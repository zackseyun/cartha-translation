  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כִֽי יָמ֥וּךְ אָחִ֛י/ךָ עִמָּ֖/ךְ וְ/נִמְכַּר לָ֑/ךְ לֹא תַעֲבֹ֥ד בּ֖/וֹ עֲבֹ֥דַת עָֽבֶד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/039.yaml
  text: And if your brother becomes poor with you and sells himself to you[b][a], you shall not make him serve as a servant.
translation:
  language: fr
  text: Si ton frère tombe dans la pauvreté auprès de toi et se vend à toi[b], tu ne lui feras pas faire un travail d’esclave[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu ne le feras pas travailler d’un travail d’esclave ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « et est vendu à toi » ; la forme hébraïque est passive, mais, dans ce contexte, elle peut désigner un homme pauvre qui se vend lui-même pour entrer au service d’un autre.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִי
  choice: Si
  rationale: Introduit naturellement en français le cas conditionnel; la coordination hébraïque n’exige pas ici un « Et » explicite.
- source_word: יָמוּךְ
  choice: tombe dans la pauvreté
  rationale: Exprime le passage à une situation d’appauvrissement, avec un français courant et digne.
- source_word: אָחִיךָ
  choice: ton frère
  rationale: Conserve le terme familial littéral, qui désigne ici un membre de la communauté d’Israël sans effacer cette formulation.
- source_word: עִמָּךְ
  choice: auprès de toi
  rationale: Préserve la relation exprimée par l’hébreu tout en évitant l’expression française ambiguë « devient pauvre avec toi ».
- source_word: וְנִמְכַּר לָךְ
  choice: et se vend à toi
  rationale: Rend la valeur contextuelle de la forme passive hébraïque dans cette loi concernant une personne pauvre qui entre au service d’un autre; une note conserve la possibilité d’une traduction formellement passive.
- source_word: לֹא תַעֲבֹד בּוֹ עֲבֹדַת עָבֶד
  choice: tu ne lui imposeras pas un travail d’esclave
  rationale: Rend explicitement l’idée de faire accomplir à quelqu’un le travail propre à un esclave, sans laisser entendre que toute forme de service est interdite.
theological_decisions:
- issue: Statut et travail dans la législation sur le service pour dette
  choice: travail d’esclave
  alternative: service de serviteur; le faire servir comme esclave
  rationale: עֲבֹדַת עָבֶד désigne le travail ou service caractéristique d’un esclave. « Travail d’esclave » conserve la force sociale du terme sans euphémisme et maintient la distinction contextuelle entre l’entrée au service d’autrui et le traitement réservé à un esclave.
- issue: Voix de וְנִמְכַּר
  choice: se vend à toi
  alternative: est vendu à toi
  rationale: Le contexte de pauvreté favorise l’idée d’une vente de soi pour dette, mais la forme hébraïque est passive; cette ambiguïté est donc signalée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, naturel et digne. Tutoiement singulier conservé pour correspondre aux formes hébraïques adressées à l’individu. Les marqueurs suivent immédiatement les segments concernés.
