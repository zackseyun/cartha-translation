id: LEV.25.55
reference: Leviticus 25:55
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי לִ֤/י בְנֵֽי יִשְׂרָאֵל֙ עֲבָדִ֔ים עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/055.yaml
  text: For the sons of Israel are my servants[a]; they are my servants, whom I brought out of the land of Egypt[b]. I am Yahweh your God.
translation:
  language: fr
  text: Car les fils d’Israël[a] sont mes esclaves[b] ; ils sont mes esclaves, eux que j’ai fait sortir du pays d’Égypte. Je suis Yahvé, votre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire les Israélites, les descendants d’Israël.
    reason: Clarifie la portée collective de l’expression hébraïque littérale « les fils d’Israël ».
  - marker: b
    text: Ou « serviteurs ». Le terme hébreu désigne des personnes attachées au service d’un maître ; ici, il souligne qu’Israël appartient à Yahvé plutôt qu’à des maîtres humains.
    reason: Préserve l’étendue sémantique du terme et explicite le contraste déterminant dans le contexte.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde les dispositions précédentes et conserve naturellement la valeur explicative de la conjonction.
- source_word: לִי
  choice: mes
  rationale: La préposition avec suffixe exprime ici l’appartenance ; le possessif français est idiomatique avec « esclaves ».
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Conserve l’expression familiale et collective de l’hébreu sans la neutraliser ; une formulation collective plus courante est signalée en note.
- source_word: עֲבָדִים / עֲבָדַי
  choice: esclaves / mes esclaves
  rationale: Dans le contexte du jubilé, le terme souligne un état de dépendance et l’appartenance exclusive d’Israël à Yahvé, par opposition à la possession durable par des maîtres humains. La répétition préserve l’insistance de l’hébreu.
- source_word: אֲשֶׁר הוֹצֵאתִי אוֹתָם
  choice: eux que j’ai fait sortir
  rationale: « Faire sortir » rend directement le hiphil de יצא et reprend la formule caractéristique de l’exode ; « eux » donne en français le relief porté par la proposition relative.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: du pays d’Égypte
  rationale: Formulation française naturelle qui conserve la formule géographique traditionnelle du récit de l’exode.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Translittération française courante du nom divin, distinguée du titre « Seigneur ».
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Rend directement la formule d’alliance avec le possessif pluriel.
theological_decisions:
- issue: Sens de עבד dans un contexte d’appartenance à Yahvé et de limitation de l’asservissement humain
  choice: esclaves
  alternative: serviteurs
  rationale: '« Esclaves » maintient la force juridique et le contraste du passage : les Israélites ne peuvent appartenir définitivement à des maîtres humains, puisqu’ils appartiennent à Yahvé. La note préserve l’autre valeur lexicale possible et prévient l’assimilation automatique aux formes modernes d’esclavage racial.'
- issue: Portée de l’expression masculine collective בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le texte principal conserve l’image généalogique du texte source, tandis que la note indique clairement sa portée collective.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve la répétition emphatique du texte hébreu. « Yahvé » rend explicitement le nom divin ; « pays d’Égypte » reprend la formule biblique sans archaïsme marqué.
