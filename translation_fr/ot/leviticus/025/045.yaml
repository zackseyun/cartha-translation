  text: וְ֠/גַם מִ/בְּנֵ֨י הַ/תּוֹשָׁבִ֜ים הַ/גָּרִ֤ים עִמָּ/כֶם֙ מֵ/הֶ֣ם תִּקְנ֔וּ וּ/מִ/מִּשְׁפַּחְתָּ/ם֙ אֲשֶׁ֣ר עִמָּ/כֶ֔ם אֲשֶׁ֥ר הוֹלִ֖ידוּ בְּ/אַרְצְ/כֶ֑ם וְ/הָי֥וּ לָ/כֶ֖ם לַֽ/אֲחֻזָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/045.yaml
  text: You may also buy from the sons of the sojourners who reside with you[a], and from their families who are with you, whom they have fathered in your land[b]; and they shall become your possession.
translation:
  language: fr
  text: Vous pourrez aussi en acheter parmi les enfants des résidents étrangers qui vivent avec vous[a], ainsi que parmi les membres de leurs familles qui sont avec vous et que ces résidents étrangers ont engendrés dans votre pays. Ils deviendront votre propriété[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parmi les descendants des résidents étrangers qui habitent au milieu de vous ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « comme possession » ; dans ce contexte juridique, il s’agit d’une propriété transmissible par héritage.
    reason: lexical_and_legal_clarification
lexical_decisions:
- source_word: וְגַם מִבְּנֵי
  choice: Vous pourrez aussi en acheter parmi les enfants
  rationale: Le tour français exprime naturellement la permission portée par le contexte juridique et rend בְּנֵי au sens collectif de descendants ou enfants, sans le limiter aux seuls fils.
- source_word: הַתּוֹשָׁבִים הַגָּרִים עִמָּכֶם
  choice: des résidents étrangers qui vivent avec vous
  rationale: Les deux termes désignent ici des non-Israélites établis au milieu d’Israël. « Résidents étrangers » conserve la catégorie juridique tout en restant clair en français moderne.
- source_word: מֵהֶם תִּקְנוּ
  choice: en acheter parmi
  rationale: קנה a ici son sens commercial direct. « Acheter » ne masque pas la réalité de l’institution décrite.
- source_word: וּמִמִּשְׁפַּחְתָּם אֲשֶׁר עִמָּכֶם
  choice: ainsi que parmi les membres de leurs familles qui sont avec vous
  rationale: L’ajout explicite de « membres » rend en français le fait que l’achat porte sur des personnes issues de ces familles, et non sur les familles comme unités abstraites.
- source_word: אֲשֶׁר הוֹלִידוּ בְּאַרְצְכֶם
  choice: qu’ils ont engendrés dans votre pays
  rationale: Le hiphil de ילד signifie « engendrer ». Le masculin pluriel « engendrés » garde le lien avec les membres des familles sans introduire une précision absente du texte.
- source_word: וְהָיוּ לָכֶם לַאֲחֻזָּה
  choice: Ils deviendront votre propriété
  rationale: אֲחֻזָּה désigne une possession durable ou transmissible. Dans ce cadre légal appliqué à des personnes, « propriété » exprime clairement le statut juridique sans l’adoucir.
theological_decisions:
- issue: Langage d’achat et de propriété appliqué à des personnes
  choice: Conserver les termes directs « acheter » et « propriété »
  alternative: Employer « acquérir », « possession » ou « serviteurs »
  rationale: Le texte hébreu présente sans détour un achat et un statut de possession durable. Une formulation euphémisée atténuerait indûment la tension morale et théologique du passage.
- issue: Portée de בְּנֵי
  choice: « enfants », avec une note signalant le sens possible de « descendants »
  alternative: « fils » ou « descendants » dans le corps du texte
  rationale: « Enfants » reste proche de l’image hébraïque tout en étant inclusif et naturel; la note préserve la portée généalogique possible.
translation_notes:
  register: Français international moderne, sobre et juridique. La formulation demeure digne mais ne dissimule ni l’achat de personnes ni leur statut de propriété. Le pluriel « vous » correspond à l’adresse collective d’Israël.
