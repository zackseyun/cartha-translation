source:
  edition: WLC
  text: אַל תִּקַּ֤ח מֵֽ/אִתּ/וֹ֙ נֶ֣שֶׁךְ וְ/תַרְבִּ֔ית וְ/יָרֵ֖אתָ מֵֽ/אֱלֹהֶ֑י/ךָ וְ/חֵ֥י אָחִ֖י/ךָ עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/036.yaml
  text: Do not take interest or profit from him[a], but fear your God[b], and let your brother live with you.
translation:
  language: fr
  text: Ne lui prends ni intérêt ni bénéfice[a]. Crains ton Dieu, et que ton frère vive auprès de toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « supplément » ou « gain » pour « bénéfice » ; l’hébreu associe deux termes voisins désignant ce qui est prélevé sur un emprunteur pauvre.
    reason: lexical_alternative
  - marker: b
    text: Ici, « ton frère » désigne un membre de la même communauté d’alliance, pas nécessairement un frère biologique.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּקַּח
  choice: Ne lui prends pas
  rationale: 'אַל suivi de l’inaccompli exprime une interdiction directe. La négation est ici portée par la coordination « ni… ni… » : « Ne lui prends ni… ni… ».'
- source_word: מֵאִתּוֹ
  choice: lui
  rationale: Dans la tournure française « prendre quelque chose à quelqu’un », le pronom indirect rend naturellement l’idée de prélever ces sommes sur lui.
- source_word: נֶשֶׁךְ
  choice: intérêt
  rationale: Le nom désigne l’intérêt exigé sur un prêt. « Usure » risquerait de suggérer uniquement un taux excessif et serait moins exact en français actuel.
- source_word: וְתַרְבִּית
  choice: bénéfice
  rationale: Associé à נֶשֶׁךְ, ce terme désigne un supplément ou gain retiré du prêt. « Bénéfice » conserve sa portée économique sans identifier artificiellement les deux termes.
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: Crains ton Dieu
  rationale: La formulation garde l’impératif éthique et la relation d’alliance exprimée par « ton Dieu ». Une nouvelle phrase rend l’enchaînement naturel sans imposer au waw une valeur adversative.
- source_word: וְחֵי
  choice: et laisse … vivre
  rationale: Cette formulation respecte la coordination hébraïque et rend naturellement la valeur volitive du verbe, sans ajouter explicitement une relation de but.
- source_word: אָחִיךָ
  choice: ton frère
  rationale: Le rendu littéral préserve l’image familiale et la portée communautaire du terme dans cette législation; une note précise qu’il ne s’agit pas nécessairement d’un frère biologique.
- source_word: עִמָּךְ
  choice: auprès de toi
  rationale: L’expression évoque la possibilité de continuer à vivre aux côtés du destinataire, au sein de la même communauté; « auprès de toi » est idiomatique et légèrement plus explicite que « avec toi ».
theological_decisions:
- issue: Portée sociale et communautaire de אָחִיךָ
  choice: ton frère
  alternative: ton compatriote israélite / ton proche
  rationale: « Ton frère » conserve le langage familial du texte et sa force d’alliance, sans réduire le référent à un lien biologique; la portée communautaire est signalée en note.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier conserve l’adresse personnelle de l’hébreu. La coordination et la valeur volitive de la dernière proposition sont maintenues sans expliciter un rapport de finalité.
