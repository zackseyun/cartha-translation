source:
  edition: WLC
  text: בִּ/שְׁנַ֥ת הַ/יּוֹבֵ֖ל הַ/זֹּ֑את תָּשֻׁ֕בוּ אִ֖ישׁ אֶל אֲחֻזָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/013.yaml
  text: In this Year of Jubilee[a], each of you shall return to his property.
translation:
  language: fr
  text: En cette année du jubilé, chacun de vous retournera dans sa propriété[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans sa possession ».'
    reason: Alternative lexicale possible pour אֲחֻזָּה, qui peut désigner ce que quelqu’un possède ou détient.
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל הַזֹּאת
  choice: En cette année du jubilé
  rationale: La préposition בְּ a ici une valeur temporelle. L’ordre français place naturellement le démonstratif devant « année du jubilé », qui désigne l’année spéciale instituée dans ce chapitre.
- source_word: תָּשֻׁבוּ אִישׁ
  choice: chacun de vous retournera
  rationale: Le verbe est à la deuxième personne du pluriel, tandis que אִישׁ distribue l’instruction à chaque membre du groupe. La formulation française conserve à la fois l’adresse collective et l’application individuelle.
- source_word: אֶל אֲחֻזָּתוֹ
  choice: à sa propriété
  rationale: אֶל marque la direction, et אֲחֻזָּה désigne ici le bien détenu, notamment la propriété foncière familiale. « Propriété » est clair et actuel sans expliciter davantage que l’hébreu.
theological_decisions:
- issue: Valeur distributive et forme masculine de אִישׁ
  choice: chacun de vous
  alternative: chaque homme
  rationale: Dans ce contexte juridique, אִישׁ est distributif. « Chacun de vous » rend cette fonction et maintient le singulier représentatif, sans restreindre artificiellement la portée du commandement aux seuls hommes.
translation_notes:
  register: Français moderne, sobre et juridique. « Jubilé » est conservé comme terme institutionnel traditionnel et intelligible dans le contexte de Lévitique 25.
