source:
  edition: WLC
  text: וְ/עָרֵי֙ הַ/לְוִיִּ֔ם בָּתֵּ֖י עָרֵ֣י אֲחֻזָּתָ֑/ם גְּאֻלַּ֥ת עוֹלָ֖ם תִּהְיֶ֥ה לַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/032.yaml
  text: As for the cities of the Levites[a], the houses in the cities of their possession may be redeemed permanently by the Levites.
translation:
  language: fr
  text: Quant aux villes des Lévites, les maisons situées dans les villes qu’ils possèdent pourront en tout temps être rachetées par les Lévites.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « Les Lévites disposeront d’un droit perpétuel de rachat. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עָרֵי
  choice: Quant aux villes
  rationale: La conjonction introduit ici un nouveau cas dans la législation. « Quant aux villes » marque naturellement ce changement de sujet en français.
- source_word: הַ/לְוִיִּם
  choice: des Lévites
  rationale: L’état construit exprime l’appartenance ou l’association des villes aux Lévites.
- source_word: בָּתֵּי עָרֵי אֲחֻזָּתָם
  choice: les maisons situées dans les villes qu’ils possèdent
  rationale: Cette formulation française explicite le rapport locatif implicite entre les maisons et les villes, tout en conservant le sens juridique de אֲחֻזָּה comme possession foncière.
- source_word: גְּאֻלַּת
  choice: être rachetées
  rationale: Le nom « rachat », associé à « sera », établit ici la possibilité ou le droit de racheter. La tournure verbale rend cette portée juridique clairement en français.
- source_word: עוֹלָם
  choice: toujours
  rationale: Dans ce contexte légal, le terme désigne un droit durable, sans limitation de temps, plutôt qu’une notion abstraite d’infini.
- source_word: תִּהְיֶה לַ/לְוִיִּם
  choice: pourront … être rachetées par les Lévites
  rationale: L’imparfait hébreu énonce une disposition légale, et la préposition ל indique que ce droit appartient aux Lévites. La formulation française exprime ensemble la faculté juridique et ses bénéficiaires.
theological_decisions:
- issue: Portée juridique de la clause de rachat des maisons lévitiques
  choice: Le texte accorde aux Lévites un droit permanent de racheter les maisons situées dans leurs villes.
  alternative: 'Rendre formellement la proposition nominale : « un droit perpétuel de rachat appartiendra aux Lévites ».'
  rationale: Il s’agit avant tout d’une question juridique et lexicale. La formulation principale communique clairement la faculté durable de rachat sans transformer cette disposition en obligation, tandis que la note conserve la structure plus formelle de l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. « Quant aux » convient au changement de cas juridique; « pourront toujours être rachetées » évite un style excessivement technique tout en maintenant la permanence du droit.
