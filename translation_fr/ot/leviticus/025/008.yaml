  text: וְ/סָפַרְתָּ֣ לְ/ךָ֗ שֶׁ֚בַע שַׁבְּתֹ֣ת שָׁנִ֔ים שֶׁ֥בַע שָׁנִ֖ים שֶׁ֣בַע פְּעָמִ֑ים וְ/הָי֣וּ לְ/ךָ֗ יְמֵי֙ שֶׁ֚בַע שַׁבְּתֹ֣ת הַ/שָּׁנִ֔ים תֵּ֥שַׁע וְ/אַרְבָּעִ֖ים שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/008.yaml
  text: You shall count for yourself seven sabbaths of years[a], seven years seven times, and the days of the seven sabbaths of years shall be for you forty-nine years.
translation:
  language: fr
  text: Tu compteras pour toi sept sabbats d’années[a], sept années, sept fois ; les jours de ces sept sabbats d’années totaliseront quarante-neuf ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sept semaines d’années ». L’hébreu dit littéralement « sept sabbats d’années » et désigne sept cycles de sept ans.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפַרְתָּ
  choice: Tu compteras
  rationale: Le verbe ספר signifie ici compter ou dénombrer. Le futur à valeur prescriptive rend naturellement l’instruction en français.
- source_word: לְךָ
  choice: pour toi
  rationale: Cette formulation conserve le pronom datif explicite de l’hébreu sans l’interpréter comme un réfléchi appuyé.
- source_word: שֶׁבַע שַׁבְּתֹת שָׁנִים
  choice: sept sabbats d’années
  rationale: La traduction maintient l’image hébraïque et son lien avec l’année sabbatique; une note indique l’autre compréhension possible, « semaines d’années ».
- source_word: שֶׁבַע שָׁנִים שֶׁבַע פְּעָמִים
  choice: sept années sept fois
  rationale: La répétition et l’ordre des éléments hébreux sont conservés, tout en restant intelligibles en français.
- source_word: וְהָיוּ לְךָ
  choice: feront pour toi
  rationale: Le verbe « faire » exprime naturellement en français le total obtenu, tout en conservant la référence explicite au destinataire.
- source_word: יְמֵי
  choice: les jours de
  rationale: Le terme concret « jours » est maintenu plutôt que remplacé par « durée » ou « période ».
- source_word: שֶׁבַע שַׁבְּתֹת הַשָּׁנִים
  choice: les sept sabbats d’années
  rationale: La reprise lexicale de la première expression est conservée pour respecter la structure du verset.
- source_word: תֵּשַׁע וְאַרְבָּעִים שָׁנָה
  choice: quarante-neuf ans
  rationale: L’ordre du nombre est adapté à l’usage moderne du français.
theological_decisions: []
