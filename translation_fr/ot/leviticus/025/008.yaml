  source_fidelity: 'Le texte conserve les éléments essentiels de l’hébreu : l’injonction de compter, les sept « sabbats d’années », la répétition « sept années, sept fois », la mention des « jours » et le total de quarante-neuf ans. Le datif לךָ est exprimé dans la première proposition ; sa répétition finale, idiomatique en hébreu, n’a pas besoin d’être reproduite de façon non naturelle en français.'
  naturalness: '« Les jours des sept sabbats d’années feront pour toi quarante-neuf ans » n’est pas une tournure française naturelle : des jours ne « font » pas un nombre d’années dans cet emploi. « Totaliseront » exprime clairement le résultat du calcul tout en conservant « les jours ». Une virgule rend aussi la répétition numérique plus lisible.'
