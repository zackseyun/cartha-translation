revisions:
- from: Mais les maisons des villages qui ne sont pas entourés d’une muraille seront considérées comme des champs du pays[a]. Elles pourront être rachetées, et, lors du jubilé, elles seront libérées[b].
  to: 'Mais les maisons des villages qui n’ont pas de muraille autour d’eux seront assimilées aux champs du pays[a] : elles auront un droit de rachat, et elles sortiront au jubilé[b].'
  rationale: La révision améliore la syntaxe française et rend plus exactement le vocabulaire juridique du texte. Elle remplace l’image potentiellement trompeuse de la « libération » par l’idiome plus fidèle « sortiront », explicité sans déterminer au-delà du verset à qui le bien revient.
