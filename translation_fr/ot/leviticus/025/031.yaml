  - severity: medium
    issue: 'Note b: « reviendra à son détenteur antérieur »'
    rationale: Le verset ne nomme pas un « détenteur antérieur ». Cette explicitation peut introduire une précision juridique non exprimée et doit être remplacée par une formulation plus neutre.
  - severity: low
    issue: « considérées comme des champs du pays »
    rationale: La tournure est compréhensible mais peu idiomatique, puisque des maisons ne sont pas littéralement des champs. « Assimilées aux champs du pays » conserve la comparaison légale tout en étant naturel.
