base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/031.yaml
  text: But the houses of the villages that have no wall around them shall be regarded as the fields of the land[a]; redemption shall be available for them[b], and in the Jubilee they shall go out.
translation:
  language: fr
  text: 'Mais les maisons des villages qui n’ont pas de muraille autour d’eux seront assimilées aux champs du pays[a] : elles auront un droit de rachat, et elles sortiront au jubilé[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sera compté comme le champ du pays ». Ces maisons de village relèvent donc du même régime juridique que les terres rurales, et non de celui des maisons situées dans une ville fortifiée.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « lors du jubilé, il sortira ». Dans ce contexte juridique, le bien sort du régime de vente au jubilé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָתֵּי הַחֲצֵרִים
  choice: les maisons des villages
  rationale: Le construit בָּתֵּי signifie « les maisons de », et חֲצֵרִים désigne ici des villages ou établissements ruraux; « villages » est naturel en français, tandis que l’absence de muraille est précisée ensuite.
- source_word: אֲשֶׁר אֵין לָהֶם חֹמָה סָבִיב
  choice: qui ne sont pas entourés d’une muraille
  rationale: Cette formulation française rend clairement l’absence d’une muraille tout autour des villages, sans alourdir la phrase.
- source_word: עַל שְׂדֵה הָאָרֶץ יֵחָשֵׁב
  choice: seront considérées comme des champs du pays
  rationale: Le singulier hébreu exprime une catégorie juridique, mais le français reprend naturellement « maisons » au pluriel. « Champs du pays » conserve l’image et indique que ces maisons relèvent du régime des terres rurales.
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: elles pourront être rachetées
  rationale: La tournure exprime l’existence durable d’un droit de rachat; cette formulation est claire et idiomatique en français.
- source_word: וּבַיֹּבֵל יֵצֵא
  choice: lors du jubilé, elles seront libérées
  rationale: יֵצֵא signifie littéralement « sortira », mais, dans ce cadre juridique, il s’agit de la libération du bien et de son retour lors du jubilé. « Seront libérées » préserve le vocabulaire de sortie sans rendre la phrase obscure.
