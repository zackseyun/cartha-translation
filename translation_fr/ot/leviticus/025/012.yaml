- from: Car c’est une année de jubilé ; elle sera sainte pour vous. Vous mangerez directement des champs ce qu’ils produiront[a].
  to: Car c’est une année de jubilé ; elle sera sainte pour vous. Vous mangerez les produits du champ[a].
