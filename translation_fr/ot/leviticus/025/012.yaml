source:
  edition: WLC
  text: כִּ֚י יוֹבֵ֣ל הִ֔וא קֹ֖דֶשׁ תִּהְיֶ֣ה לָ/כֶ֑ם מִן הַ֨/שָּׂדֶ֔ה תֹּאכְל֖וּ אֶת תְּבוּאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/012.yaml
  text: For it is a jubilee; it shall be holy to you[a]. From the field you shall eat its produce.
translation:
  language: fr
  text: Car c’est une année de jubilé ; elle sera sainte pour vous. Vous mangerez les produits du champ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa production », « son rendement » ou « ses récoltes ». Le terme hébreu désigne ce que le champ produit.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’instruction précédente et conserve naturellement la valeur explicative de la conjonction.
- source_word: יוֹבֵל
  choice: année de jubilé
  rationale: Dans Lévitique 25, le mot désigne la cinquantième année particulière, et non la corne de bélier ; l’ajout de « année » rend le référent explicite et idiomatique en français.
- source_word: קֹדֶשׁ תִּהְיֶה לָכֶם
  choice: elle sera sainte pour vous
  rationale: Préserve la force religieuse et covenantale de קֹדֶשׁ ainsi que la relation exprimée par לָכֶם, sans réduire la notion à une simple particularité civile.
- source_word: מִן הַשָּׂדֶה
  choice: directement des champs
  rationale: Exprime la provenance et rend explicite, sans modifier le sens contextuel, que la nourriture est prise sur place plutôt qu’issue d’une récolte organisée et stockée.
- source_word: תֹּאכְלוּ
  choice: vous mangerez
  rationale: Le futur français convient à la valeur prescriptive de l’imparfait hébreu dans ce texte juridique.
- source_word: תְּבוּאָתָהּ
  choice: ce qu’ils produiront
  rationale: Rend le produit ou rendement que le champ fait venir, dans un français actuel, tout en évitant de suggérer nécessairement des cultures issues d’un travail agricole régulier.
theological_decisions:
- issue: La sainteté de l’année du jubilé
  choice: elle sera sainte pour vous
  alternative: elle sera sacrée pour vous / elle sera mise à part pour vous
  rationale: « Sainte » maintient le vocabulaire théologique fort de קֹדֶשׁ et attribue bien cette qualité à l’année elle-même, dans son rapport avec le peuple, sans expliquer à tort toute la portée de cette sainteté.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation juridique reste ferme sans archaïsme. Le passage au pluriel « des champs » avec « ils » est idiomatique, tandis que la note conserve les principales possibilités lexicales du terme agricole.
