id: LEV.25.18
reference: Leviticus 25:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶם֙ אֶת חֻקֹּתַ֔/י וְ/אֶת מִשְׁפָּטַ֥/י תִּשְׁמְר֖וּ וַ/עֲשִׂיתֶ֣ם אֹתָ֑/ם וִֽ/ישַׁבְתֶּ֥ם עַל הָ/אָ֖רֶץ לָ/בֶֽטַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/018.yaml
  text: So you shall carry out my statutes and keep my judgments[a], and do them[c][b], and you shall dwell in the land securely.
translation:
  language: fr
  text: Vous mettrez en pratique mes prescriptions[a], vous observerez mes règles et vous les appliquerez[b]. Vous habiterez alors en sécurité dans le pays[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots hébreux rendus par « prescriptions » et « règles » désignent deux catégories juridiques distinctes; on pourrait aussi traduire « décrets » et « ordonnances ».
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu répète le verbe « faire » : littéralement, « vous ferez mes prescriptions, vous observerez mes règles et vous les ferez ».'
    reason: lexical_alternative
  - marker: c
    text: Il s’agit du pays où Israël doit s’établir.
    reason: cultural_note
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: mes prescriptions
  rationale: Le terme désigne des dispositions prescrites. « Prescriptions » conserve sa portée juridique et cultuelle tout en restant naturel en français moderne.
- source_word: מִשְׁפָּטַי
  choice: mes règles
  rationale: Dans ce contexte juridique, le terme renvoie à des règles ou décisions de droit. « Règles » est clair et permet de le distinguer de חֻקֹּתַי sans alourdir la phrase.
- source_word: תִּשְׁמְרוּ
  choice: vous observerez
  rationale: Dans un contexte d’alliance et de loi, שׁמר signifie garder au sens de respecter ou observer. « Observer » est l’expression française naturelle pour des règles.
- source_word: וַעֲשִׂיתֶם ... אֹתָם
  choice: mettrez en pratique ... les appliquerez
  rationale: L’hébreu emploie deux fois le verbe עשה. La variation française préserve l’insistance sur l’obéissance concrète sans produire une répétition maladroite.
- source_word: וִישַׁבְתֶּם
  choice: vous habiterez
  rationale: Le verbe exprime ici une habitation durable dans le pays. « Habiter » est courant et convient au contexte territorial.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte, le mot désigne le territoire où Israël doit habiter. « Le pays » est naturel en français et conserve cette référence territoriale.
- source_word: לָבֶטַח
  choice: en sécurité
  rationale: Le terme exprime la sûreté et l’absence de menace. « En sécurité » rend clairement ce sens avec le verbe « habiter ».
theological_decisions:
- issue: Lien entre l’obéissance et l’habitation en sécurité dans le pays
  choice: La formulation présente l’habitation sûre comme la conséquence de l’obéissance d’Israël dans le cadre de l’alliance et du pays.
  alternative: Lire ce verset comme une promesse générale de sécurité personnelle accordée à tout croyant en toute situation.
  rationale: Le texte hébreu relie directement l’observation des prescriptions et des règles à l’habitation dans « le pays ». La traduction maintient ce cadre sans étendre la promesse au-delà de ce que dit le verset.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la distinction entre les deux termes juridiques, l’insistance de la répétition hébraïque et le lien logique marqué par « alors », tout en évitant un calque peu naturel.
