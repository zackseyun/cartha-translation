id: LEV.25.24
reference: Leviticus 25:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בְ/כֹ֖ל אֶ֣רֶץ אֲחֻזַּתְ/כֶ֑ם גְּאֻלָּ֖ה תִּתְּנ֥וּ לָ/אָֽרֶץ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/024.yaml
  text: And in all the land of your possession[b][a], you shall grant redemption for the land.
translation:
  language: fr
  text: Dans tout le pays dont vous avez la possession[a], vous accorderez un droit de rachat pour les terres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « possession » désigne ici le patrimoine foncier reçu en partage par les Israélites.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « vous donnerez un rachat à la terre » ; le terme peut désigner le rachat lui-même ou le droit de racheter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכֹל
  choice: Dans tout
  rationale: La tournure introduit une règle applicable à l’ensemble du territoire. En français, le simple « Dans tout » suffit; la conjonction initiale n’a pas besoin d’être reproduite isolément dans ce verset.
- source_word: אֶרֶץ
  choice: le territoire
  rationale: Dans la première occurrence, אֶרֶץ désigne le territoire foncier possédé par Israël, et non la terre entière. « Territoire » convient naturellement avec l’idée de propriété collective.
- source_word: אֲחֻזַּתְכֶם
  choice: qui est votre propriété
  rationale: אֲחֻזָּה désigne ici une possession foncière, notamment le patrimoine reçu en partage. Cette formulation conserve le sens juridique sans ajouter explicitement la notion d’hérédité.
- source_word: גְּאֻלָּה
  choice: un droit de rachat
  rationale: Dans ce contexte légal, le nom désigne le rachat d’une terre aliénée et peut inclure la faculté reconnue de la récupérer contre paiement. « Droit de rachat » rend clairement cette portée sans lui donner un sens doctrinal ultérieur.
- source_word: תִּתְּנוּ
  choice: vous accorderez
  rationale: Le verbe signifie littéralement « vous donnerez ». Avec « droit de rachat », « accorderez » est la formulation juridique française la plus naturelle.
- source_word: לָאָרֶץ
  choice: pour les terres
  rationale: La préposition marque ici ce à quoi s’applique le rachat. Le pluriel français exprime naturellement la valeur collective de « la terre » dans cette législation foncière.
theological_decisions:
- issue: Nature du commandement relatif aux terres patrimoniales vendues
  choice: Le texte ordonne de reconnaître un droit de rachat applicable aux terres du patrimoine d’Israël.
  alternative: 'Traduire plus littéralement et de manière moins explicite : « vous donnerez un rachat à la terre ».'
  rationale: Le contexte de Lévitique 25 traite de la récupération des biens fonciers vendus. La formulation retenue exprime cette disposition juridique tout en évitant d’importer dans גְּאֻלָּה un sens théologique étranger au passage.
translation_notes:
  register: Français international moderne, clair et digne. La formulation juridique reste accessible, tandis que les notes préservent la tournure concrète et l’ambiguïté lexicale de l’hébreu.
