source:
  edition: WLC
  text: וְ/אִם מְעַ֞ט נִשְׁאַ֧ר בַּ/שָּׁנִ֛ים עַד שְׁנַ֥ת הַ/יֹּבֵ֖ל וְ/חִשַּׁב ל֑/וֹ כְּ/פִ֣י שָׁנָ֔י/ו יָשִׁ֖יב אֶת גְּאֻלָּתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/052.yaml
  text: But if few years remain until the Year of Jubilee, then he shall calculate with him; according to his years he shall repay his redemption.
translation:
  language: fr
  text: Mais s’il ne reste que peu d’années jusqu’à l’année du Jubilé, il fera le calcul avec son maître ; il remboursera le prix de son rachat en proportion des années qui restent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְעַט נִשְׁאַר בַּשָּׁנִים
  choice: s’il ne reste que peu d’années
  rationale: Le nifal de שׁאר exprime ce qui reste, et מְעַט quantifie ici les années. Cette tournure est naturelle en français et conserve la condition juridique.
- source_word: שְׁנַת הַיּוֹבֵל
  choice: l’année du Jubilé
  rationale: « Jubilé » est le terme français établi pour l’institution de Lévitique 25 ; la majuscule signale sa désignation institutionnelle.
- source_word: וְחִשַּׁב לוֹ
  choice: il fera le calcul avec son maître
  rationale: חשב désigne ici un calcul financier. Le pronom « lui » renvoie, d’après le contexte immédiat, à l’acquéreur devenu maître ; expliciter ce référent évite une ambiguïté pronominale peu naturelle en français.
- source_word: כְּפִי שָׁנָיו
  choice: en proportion des années qui restent
  rationale: כְּפִי marque une proportion. Dans le contexte, les « années » sont celles qui restent jusqu’au Jubilé ; l’explicitation rend la règle intelligible sans en modifier le sens.
- source_word: יָשִׁיב אֶת גְּאֻלָּתוֹ
  choice: il remboursera le prix de son rachat
  rationale: Le hifil de שוב signifie ici rendre ou rembourser, tandis que גְּאֻלָּה désigne concrètement la somme nécessaire au rachat. « Prix de son rachat » exprime naturellement cette valeur financière en français.
