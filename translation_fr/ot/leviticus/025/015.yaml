id: LEV.25.15
reference: Leviticus 25:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/מִסְפַּ֤ר שָׁנִים֙ אַחַ֣ר הַ/יּוֹבֵ֔ל תִּקְנֶ֖ה מֵ/אֵ֣ת עֲמִיתֶ֑/ךָ בְּ/מִסְפַּ֥ר שְׁנֵֽי תְבוּאֹ֖ת יִמְכָּר לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/015.yaml
  text: According to the number of years after the Jubilee[a], you shall buy from your fellow; according to the number of years of crops he shall sell to you.
translation:
  language: fr
  text: Tu achèteras à ton prochain en fonction du nombre d’années écoulées depuis le jubilé ; il te vendra en fonction du nombre d’années de récolte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon le nombre d’années de produits [du sol] ». Le prix dépend du nombre d’années productives restant avant le prochain jubilé, et non d’un transfert définitif de la terre.'
    reason: Précision lexicale et contexte juridique du cycle jubilaire.
lexical_decisions:
- source_word: בְּמִסְפַּר שָׁנִים אַחַר הַיּוֹבֵל
  choice: en fonction du nombre d’années écoulées depuis le jubilé
  rationale: La préposition בְּ avec מִסְפַּר indique ici la mesure servant de base à la transaction. « Écoulées depuis » exprime naturellement en français la relation temporelle marquée par אַחַר, sans modifier le principe juridique.
- source_word: תִּקְנֶה
  choice: tu achèteras
  rationale: Le futur français convient à l’imparfait hébreu employé comme prescription légale et préserve l’adresse à la deuxième personne du singulier.
- source_word: מֵאֵת עֲמִיתֶךָ
  choice: à ton prochain
  rationale: עָמִית désigne ici l’autre membre de la communauté avec lequel se fait la transaction. « Prochain » reste concis et n’ajoute aucune précision ethnique absente du terme.
- source_word: בְּמִסְפַּר שְׁנֵי תְבוּאֹת
  choice: en fonction du nombre d’années de récolte
  rationale: שְׁנֵי תְבוּאֹת désigne littéralement des années de produit ou de récoltes. Cette formulation conserve le lien entre la valeur de la vente et les années productives.
- source_word: יִמְכָּר לָךְ
  choice: il te vendra
  rationale: Cette formulation reproduit la troisième personne du singulier et maintient le parallélisme juridique avec « tu achèteras ».
theological_decisions:
- issue: Nature de la vente foncière dans le cycle jubilaire
  choice: Conserver l’expression concrète « nombre d’années de récolte » et expliquer en note son incidence économique
  alternative: Paraphraser directement « selon le nombre d’années qui restent jusqu’au prochain jubilé »
  rationale: Le texte évoque explicitement les années de récolte sans formuler lui-même toute l’explication. La traduction préserve cette formulation, tandis que la note apporte le contexte nécessaire sans résoudre silencieusement le rapport entre années écoulées et années restantes.
translation_notes:
  register: Français international moderne, sobre et juridique. Le tutoiement singulier suit les formes hébraïques de deuxième personne ; le point-virgule conserve le parallélisme des deux propositions.
