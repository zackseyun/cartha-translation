id: LEV.25.29
reference: Leviticus 25:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יִמְכֹּ֤ר בֵּית מוֹשַׁב֙ עִ֣יר חוֹמָ֔ה וְ/הָיְתָה֙ גְּאֻלָּת֔/וֹ עַד תֹּ֖ם שְׁנַ֣ת מִמְכָּר֑/וֹ יָמִ֖ים תִּהְיֶ֥ה גְאֻלָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/029.yaml
  text: If a man sells a house for dwelling in a walled city[a], its redemption may be made until the completion of a full year from its sale; its right of redemption shall last for days, that is, a full year.
translation:
  language: fr
  text: Si un homme vend une maison d’habitation dans une ville entourée de murailles, le droit de la racheter subsistera jusqu’à ce qu’une année complète se soit écoulée depuis sa vente ; ce droit de rachat durera un an entier[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des jours » ; dans cet emploi juridique, cette expression désigne la durée d’une année entière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Si un homme
  rationale: Dans cette formulation juridique, כִּי introduit un cas conditionnel et אִישׁ désigne au singulier l’homme concerné par la disposition.
- source_word: בֵּית מוֹשַׁב
  choice: une maison d’habitation
  rationale: Le groupe construit désigne une maison servant de résidence ; cette formulation naturelle conserve cette précision.
- source_word: עִיר חוֹמָה
  choice: une ville entourée de murailles
  rationale: L’expression désigne une ville pourvue d’une enceinte, plutôt qu’une ville simplement fortifiée au sens large.
- source_word: גְּאֻלָּתוֹ
  choice: le droit de la racheter / ce droit de rachat
  rationale: Dans ce contexte foncier, גְּאֻלָּה renvoie à la faculté légale de reprendre le bien vendu. Le pronom féminin reprend naturellement « maison » en français.
- source_word: עַד תֹּם שְׁנַת מִמְכָּרוֹ
  choice: jusqu’à ce qu’une année complète se soit écoulée depuis sa vente
  rationale: Il s’agit d’une année entière comptée à partir de la vente, non de la fin de l’année civile.
- source_word: יָמִים
  choice: un an entier
  rationale: Dans cet emploi juridique, le pluriel « jours » exprime la durée d’une année complète ; la note conserve la forme littérale.
