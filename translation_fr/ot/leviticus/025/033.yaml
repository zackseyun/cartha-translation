    rationale: 'Cette analyse est possible en abstraction, mais elle est moins probable dans le contexte de la disposition sur le droit de rachat des Lévites et fait porter la règle sur un acheteur non lévite. Le texte principal doit suivre la lecture partitive : « l’un des Lévites ».'
  - severity: medium
    issue: « reviendra à son propriétaire » explicite le destinataire du retour.
    rationale: וְיָצָא signifie littéralement « sortira »; dans ce cadre il exprime la libération ou réversion du bien au Jubilé, sans nommer ici « son propriétaire ». Cette formulation peut aussi être ambiguë, le propriétaire pouvant désigner l’acheteur.
  - severity: medium
    issue: « la ville où celui-ci possède un domaine » individualise et paraphrase la relation d’אֲחֻזָּתוֹ.
    rationale: Le verset motive la règle par la possession des Lévites dans les villes d’Israël. « une ville de leur propriété » rend le lien juridique sans suggérer qu’un seul Lévite possède la ville.
