  text: וַ/אֲשֶׁ֤ר יִגְאַל֙ מִן הַ/לְוִיִּ֔ם וְ/יָצָ֧א מִמְכַּר בַּ֛יִת וְ/עִ֥יר אֲחֻזָּת֖/וֹ בַּ/יֹּבֵ֑ל כִּ֣י בָתֵּ֞י עָרֵ֣י הַ/לְוִיִּ֗ם הִ֚וא אֲחֻזָּתָ֔/ם בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/033.yaml
  text: And if one of the Levites redeems it[a], then the sale of the house in the city of his possession shall be released in the Jubilee[b]; for the houses of the cities of the Levites are their possession among the sons of Israel.
translation:
  language: fr
  text: Si l’un des Lévites rachète un bien[a], la vente d’une maison dans une ville de leur propriété sera libérée au Jubilé[b] ; car les maisons des villes des Lévites constituent leur propriété au milieu des fils d’Israël[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu peut aussi être compris : « ce qui est racheté des Lévites ». Dans le contexte, la lecture « l’un des Lévites » est la plus naturelle.'
    reason: ambiguity
  - marker: b
    text: 'Littéralement : « sortira au Jubilé ». Il s’agit de la libération ou de la réversion du bien vendu à l’échéance du Jubilé.'
    reason: lexical_alternative
  - marker: c
    text: L’expression hébraïque « fils d’Israël » désigne collectivement le peuple d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר יִגְאַל מִן הַלְוִיִּם
  choice: Si quelqu’un rachète un bien à l’un des Lévites
  rationale: La construction hébraïque est condensée et peut faire de מִן une marque de provenance (« à l’un des Lévites ») ou une expression partitive (« quelqu’un parmi les Lévites »). Le texte principal retient la provenance, bien adaptée au contexte de la vente immobilière, et la note conserve l’autre analyse.
- source_word: וְיָצָא
  choice: reviendra à son propriétaire
  rationale: Le verbe signifie littéralement « sortira ». Dans la législation du Jubilé, le bien sort de la possession de l’acquéreur et revient à son détenteur antérieur. La formulation française explicite cet effet juridique sans effacer l’image hébraïque, signalée en note.
- source_word: מִמְכַּר בַּיִת וְעִיר אֲחֻזָּתוֹ
  choice: la maison vendue dans la ville où celui-ci possède un domaine
  rationale: La syntaxe hébraïque est très resserrée. Le contexte porte sur les maisons des villes lévitiques ; la formulation française relie donc la maison vendue à la ville où se trouve le domaine du Lévite, sans prétendre que toute la ville lui appartient.
- source_word: בַּיֹּבֵל
  choice: lors du Jubilé
  rationale: « Jubilé » désigne ici l’institution et l’échéance juridique du retour des biens.
- source_word: בָתֵּי עָרֵי הַלְוִיִּם
  choice: les maisons situées dans les villes des Lévites
  rationale: Cette formulation rend naturellement la chaîne de construits et précise la relation locative attendue dans le contexte.
- source_word: הִוא אֲחֻזָּתָם
  choice: constituent leur domaine
  rationale: אֲחֻזָּה désigne une propriété foncière durable, souvent héréditaire. « Domaine » garde ici la valeur juridique et foncière du terme.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: au milieu des fils d’Israël
  rationale: Traduction formelle de l’expression collective et conventionnelle בְּנֵי יִשְׂרָאֵל ; une note indique son sens usuel.
theological_decisions:
- issue: Portée de מִן הַלְוִיִּם
  choice: un bien racheté à l’un des Lévites
  alternative: si quelqu’un parmi les Lévites rachète le bien
  rationale: Les deux analyses grammaticales sont possibles. Le texte principal suit la lecture de provenance, qui s’accorde bien avec une règle concernant l’acquisition d’un bien lévitique par autrui ; la variante partitive est conservée explicitement en note.
- issue: Désignation בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: peuple d’Israël
  rationale: La traduction formelle garde l’expression d’alliance au masculin grammatical, tandis que la note en explicite la portée collective sans imposer une lecture confessionnelle.
translation_notes:
  register: Français international moderne, juridique mais accessible. « Racheter », « domaine » et « Jubilé » maintiennent le vocabulaire technique du passage ; la phrase est légèrement explicitée pour rendre lisible la syntaxe hébraïque très comprimée.
