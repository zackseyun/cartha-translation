revisions:
- from: Si quelqu’un rachète un bien à l’un des Lévites[a], la maison vendue dans la ville où celui-ci possède un domaine reviendra à son propriétaire lors du Jubilé[b] ; car les maisons situées dans les villes des Lévites constituent leur domaine au milieu des fils d’Israël[c].
  to: Si l’un des Lévites rachète un bien[a], la vente d’une maison dans une ville de leur propriété sera libérée au Jubilé[b] ; car les maisons des villes des Lévites constituent leur propriété au milieu des fils d’Israël[c].
  rationale: La révision adopte dans le texte la lecture contextuellement la plus solide de l’ouverture, tout en conservant en note l’ambiguïté syntaxique réelle. Elle évite d’ajouter un « propriétaire » non exprimé et rend אחֻזָּה par « propriété », terme français juridique et suffisamment large. Les trois appels de note sont conservés et correctement ancrés.
