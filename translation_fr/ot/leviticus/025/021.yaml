  text: וְ/צִוִּ֤יתִי אֶת בִּרְכָתִ/י֙ לָ/כֶ֔ם בַּ/שָּׁנָ֖ה הַ/שִּׁשִּׁ֑ית וְ/עָשָׂת֙ אֶת הַ/תְּבוּאָ֔ה לִ/שְׁלֹ֖שׁ הַ/שָּׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/021.yaml
  text: Then I will command my blessing for you in the sixth year[a], and it will produce the yield for three years.
translation:
  language: fr
  text: Alors, j’ordonnerai à ma bénédiction de venir sur vous pendant la sixième année, et elle produira la récolte[a] pour trois ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les produits agricoles » ou « le rendement » (hébreu : tevuʾah).'
    reason: Alternative lexicale pour תבואה, qui désigne la production agricole ou son rendement.
lexical_decisions:
- source_word: וְצִוִּיתִי
  choice: Alors, je décréterai
  rationale: Le verbe צוה exprime ici un ordre ou un décret divin. « Je décréterai » en conserve la force tout en restant naturel avec « ma bénédiction » ; « alors » rend la fonction contextuelle de la conjonction, puisque la phrase répond à la question anticipée au verset précédent.
- source_word: בִּרְכָתִי
  choice: ma bénédiction
  rationale: Le nom désigne la faveur accordée par Dieu, dont l’effet concret sera l’abondance agricole décrite dans la suite du verset.
- source_word: לָכֶם
  choice: pour vous
  rationale: La préposition ל marque ici les bénéficiaires de la bénédiction.
- source_word: בַּשָּׁנָה הַשִּׁשִּׁית
  choice: la sixième année
  rationale: Cette expression temporelle situe directement la bénédiction dans la sixième année du cycle sabbatique.
- source_word: וְעָשָׂת
  choice: et elle donnera
  rationale: Le féminin singulier renvoie naturellement à « ma bénédiction ». Dans ce contexte agricole, « donnera » exprime idiomatiquement le résultat productif sans introduire un sujet absent du texte.
- source_word: הַתְּבוּאָה
  choice: une récolte
  rationale: תבואה désigne le produit ou rendement agricole. « Une récolte » est clair, courant et adapté au contexte.
- source_word: לִשְׁלֹשׁ הַשָּׁנִים
  choice: pour trois ans
  rationale: La formule indique que la récolte assurera la provision pendant trois années, sans qu’il soit nécessaire d’ajouter explicitement « suffisante ».
theological_decisions:
- issue: Nature de la bénédiction promise
  choice: Un décret divin précis produisant une provision agricole extraordinaire
  alternative: Une simple affirmation générale de la providence divine
  rationale: La première personne « je décréterai » et l’expression « ma bénédiction » présentent cette abondance comme l’effet d’une intervention divine déterminée.
- issue: Référent du sujet féminin dans וְעָשָׂת
  choice: La bénédiction donnera la récolte
  alternative: La sixième année ou la terre produira la récolte
  rationale: « Ma bénédiction », féminin singulier et sujet saillant, fournit l’antécédent grammatical le plus direct. La formulation française préserve cette relation sans exclure que l’effet se réalise concrètement dans la terre durant la sixième année.
translation_notes:
  register: Français international moderne, digne et accessible. « Décréterai » conserve la force souveraine du verbe hébreu sans employer la tournure peu naturelle « commander ma bénédiction ». La phrase reste concise et maintient le lien grammatical entre la bénédiction et la récolte.
