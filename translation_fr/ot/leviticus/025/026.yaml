  source_fidelity: La formulation proposée explicite correctement le rôle foncier du גֹּאֵל, mais elle fusionne les deux verbes hébreux successifs (« ses ressources deviennent suffisantes » et « il trouve »). « Acquière ... les moyens de réunir la somme » modifie cette progression et introduit une relation de moyen à but qui n’est pas exprimée ainsi dans le texte.
