source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּ֛י לֹ֥א יִֽהְיֶה לּ֖/וֹ גֹּאֵ֑ל וְ/הִשִּׂ֣יגָה יָד֔/וֹ וּ/מָצָ֖א כְּ/דֵ֥י גְאֻלָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/026.yaml
  text: But if a man has no redeemer[a], and his hand attains enough and he finds sufficient means for his redemption[b],
translation:
  language: fr
  text: Mais si un homme n’a pas de proche parent ayant le droit de rachat[a], et que ses ressources deviennent suffisantes, et qu’il trouve de quoi effectuer son rachat,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne ici un proche parent ayant le droit ou la responsabilité de racheter un bien familial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ כִּי
  choice: Mais si un homme
  rationale: Dans cette loi casuistique, כִּי introduit une condition. « Mais » marque naturellement le contraste avec le cas précédent, et אִישׁ reste rendu au masculin singulier.
- source_word: לֹא יִהְיֶה לּוֹ גֹּאֵל
  choice: n’a personne pour racheter son bien[a]
  rationale: La tournure hébraïque signifie littéralement qu’il n’a pas de גֹּאֵל. Dans le contexte foncier, il s’agit d’un proche habilité ou tenu de racheter le bien familial; cette formulation explicite l’action sans donner à « rédempteur » un sens religieux étranger au passage.
- source_word: וְהִשִּׂיגָה יָדוֹ
  choice: qu’il acquière lui-même les moyens
  rationale: Littéralement, « sa main atteint ». L’expression idiomatique indique que ses ressources deviennent suffisantes. « Lui-même » souligne que, faute de proche pouvant intervenir, le vendeur obtient personnellement les moyens requis.
- source_word: וּמָצָא כְּדֵי גְאֻלָּתוֹ
  choice: de réunir la somme nécessaire à son rachat
  rationale: מָצָא peut ici exprimer le fait de trouver ou d’obtenir, כְּדֵי la quantité suffisante, et גְאֻלָּה le rachat du bien. « Réunir la somme nécessaire » produit une formulation française naturelle et juridiquement claire.
theological_decisions:
- issue: Référent du suffixe dans גְאֻלָּתוֹ
  choice: « son rachat », compris comme le rachat de son bien
  alternative: « le racheter lui-même » ou « le rachat de celui-ci »
  rationale: La forme hébraïque porte un suffixe masculin singulier qui renvoie grammaticalement à l’homme, tandis que le contexte concerne le rachat de la propriété vendue. Le texte principal conserve « son rachat » tout en explicitant auparavant « son bien », sans transformer l’opération foncière en délivrance personnelle.
translation_notes:
  register: Français moderne, digne et lisible. La phrase reste ouverte par une virgule afin de se poursuivre au verset 27. L’idiome hébreu « sa main atteint » est rendu selon son sens économique plutôt que littéralement.
