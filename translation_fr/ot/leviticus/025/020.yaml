theological_decisions:
- issue: Rapport logique introduit par הֵן
  choice: puisque
  alternative: voici que / en effet
  rationale: Dans cette question anticipée, la particule présente le fait invoqué comme motif de l’inquiétude. « Puisque » rend naturellement ce rapport sans ajouter d’interprétation théologique.
translation_notes:
  register: Français moderne, clair et digne. Le futur « ne sèmerons pas » et « ne récolterons pas » correspond au contexte prescriptif de l’année sabbatique; la question directe est conservée.
