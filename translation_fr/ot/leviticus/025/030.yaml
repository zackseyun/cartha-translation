id: LEV.25.30
reference: Leviticus 25:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִ֣ם לֹֽא יִגָּאֵ֗ל עַד מְלֹ֣את ל/וֹ֮ שָׁנָ֣ה תְמִימָה֒ וְ֠/קָם הַ/בַּ֨יִת אֲשֶׁר בָּ/עִ֜יר אֲשֶׁר לא חֹמָ֗ה לַ/צְּמִיתֻ֛ת לַ/קֹּנֶ֥ה אֹת֖/וֹ לְ/דֹרֹתָ֑י/ו לֹ֥א יֵצֵ֖א בַּ/יֹּבֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/030.yaml
  text: But if it is not redeemed before a full year is completed for it[a], then the house that is in a city that has no wall shall pass permanently to the one who bought it, throughout his generations[b]; it shall not go out in the Jubilee.
translation:
  language: fr
  text: Mais si elle n’est pas rachetée avant qu’une année entière ne soit écoulée, la maison située dans une ville fortifiée[a] sera définitivement la propriété de celui qui l’a achetée et de ses descendants. Elle ne sera pas libérée lors du Jubilé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte consonantique porte « qui n’a pas de muraille », mais la lecture massorétique traditionnelle est « qui a une muraille ». Cette dernière correspond au contraste avec les villages sans muraille au verset 31.
    reason: textual_variant
  - marker: b
    text: Autrement dit, la maison ne revient pas à la famille du premier propriétaire pendant l’année du Jubilé.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגָּאֵל
  choice: est rachetée
  rationale: Le niphal de גאל désigne ici le rachat légal d’un bien par son ancien propriétaire ou son représentant. « Rachetée » maintient la terminologie juridique et théologique du chapitre.
- source_word: עַד מְלֹאת לוֹ שָׁנָה תְמִימָה
  choice: avant l’achèvement d’une année entière
  rationale: La formule fixe la limite du droit de rachat à une année complète. Le pronom hébreu n’a pas besoin d’être reproduit en français, où il alourdirait inutilement la phrase.
- source_word: וְקָם ... לַצְּמִיתֻת
  choice: restera définitivement acquise
  rationale: Le verbe signifie littéralement « se tiendra » ou « sera confirmé »; associé à לַצְּמִיתֻת, il indique que la vente devient juridiquement définitive. Cette formulation française exprime clairement cet effet légal.
- source_word: הַבַּיִת אֲשֶׁר בָּעִיר אֲשֶׁר לא חֹמָה
  choice: la maison située dans une ville entourée d’une muraille
  rationale: La lecture massorétique traditionnelle (qeré) comprend לו, « qui a une muraille », conformément au contraste avec les villages sans muraille au verset 31. La graphie consonantique לא est signalée en note afin de préserver la variante textuelle.
- source_word: לַקֹּנֶה אֹתוֹ לְדֹרֹתָיו
  choice: à celui qui l’a achetée et à ses descendants
  rationale: La formule indique que le droit de propriété se poursuit dans la lignée de l’acheteur. « À ses descendants » rend naturellement en français le sens héréditaire de « pour ses générations ».
- source_word: לֹא יֵצֵא בַּיּוֹבֵל
  choice: elle ne sera pas libérée lors du Jubilé
  rationale: יצא signifie littéralement « sortir », mais désigne ici la libération du bien et son retour au patrimoine familial lors du Jubilé. « Ne sera pas libérée » conserve le vocabulaire juridique du contexte sans rendre l’expression française obscure.
- source_word: יּוֹבֵל
  choice: Jubilé
  rationale: « Jubilé » est le terme français biblique usuel pour l’institution légale exposée en Lévitique 25.
theological_decisions:
- issue: Caractère définitif de la vente d’une maison dans une ville fortifiée
  choice: Après l’expiration de l’année de rachat, la maison demeure définitivement la propriété de l’acheteur et de sa lignée, sans retour au Jubilé.
  alternative: Rendre וְקָם de façon strictement littérale par « la maison se tiendra », sans expliciter l’effet juridique.
  rationale: La combinaison de וְקָם, לַצְּמִיתֻת, לְדֹרֹתָיו et לֹא יֵצֵא בַּיּוֹבֵל établit clairement le caractère définitif et héréditaire de la vente.
- issue: Ville avec ou sans muraille
  choice: Suivre la lecture massorétique traditionnelle « qui a une muraille », tout en signalant la graphie consonantique en note.
  alternative: 'Suivre la graphie consonantique à la lettre : « une ville qui n’a pas de muraille ».'
  rationale: Le qeré לו (« qui a »), le régime juridique exposé aux versets 29-30 et le contraste explicite avec les villages sans muraille au verset 31 soutiennent fortement la lecture « entourée d’une muraille ». La note conserve néanmoins la véritable donnée textuelle.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le cadre juridique du passage tout en évitant le calque obscur « se tiendra à perpétuité ». « Jubilé » est capitalisé comme nom de l’institution.
