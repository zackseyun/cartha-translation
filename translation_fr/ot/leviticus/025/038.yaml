source:
  edition: WLC
  text: אֲנִ֗י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֶתְ/כֶ֖ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם לָ/תֵ֤ת לָ/כֶם֙ אֶת אֶ֣רֶץ כְּנַ֔עַן לִ/הְי֥וֹת לָ/כֶ֖ם לֵ/אלֹהִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/038.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to give you the land of Canaan, to be your God.
translation:
  language: fr
  text: Je suis Yahweh, votre Dieu[a], qui vous ai fait sortir du pays d’Égypte pour vous donner le pays de Canaan et être votre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de préserver le nom personnel de Dieu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Malgré sa forme morphologiquement plurielle, אֱלֹהִים désigne ici le Dieu unique d’Israël dans la formule d’alliance.
- source_word: הוֹצֵאתִי אֶתְכֶם
  choice: je vous ai fait sortir
  rationale: Le hifil de יצא signifie « faire sortir » ou « conduire hors de » ; la formulation retenue est naturelle en français et conserve la valeur causative.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: du pays d’Égypte
  rationale: Le terme אֶרֶץ est explicitement traduit par « pays », formulation française naturelle dans ce contexte.
- source_word: לָתֵת לָכֶם אֶת אֶרֶץ כְּנַעַן
  choice: pour vous donner le pays de Canaan
  rationale: L’infinitif avec ל exprime ici le but de la sortie d’Égypte ; « pour » le rend clairement.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: être votre Dieu
  rationale: Cette formule d’alliance exprime une relation d’appartenance et d’engagement ; « être votre Dieu » en est le rendu français idiomatique.
- source_word: אֲנִי
  choice: Je suis
  rationale: La proposition nominale hébraïque d’identification exige naturellement le verbe « être » en français.
theological_decisions:
- issue: Rendu du nom d’alliance יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le nom divin. « Yahweh » conserve ce nom, tandis que la note signale le rendu traditionnel par un titre.
- issue: Rendu de la formule d’alliance לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: être votre Dieu
  alternative: être Dieu pour vous ; devenir votre Dieu
  rationale: Le choix retenu exprime la relation d’alliance sans laisser entendre un changement dans l’être de Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’auto-identification divine, le rappel de l’Exode, le don du pays et la formule d’alliance, tout en évitant un calque hébraïque pesant.
