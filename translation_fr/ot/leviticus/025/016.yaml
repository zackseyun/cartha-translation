  text: לְ/פִ֣י רֹ֣ב הַ/שָּׁנִ֗ים תַּרְבֶּה֙ מִקְנָת֔/וֹ וּ/לְ/פִי֙ מְעֹ֣ט הַ/שָּׁנִ֔ים תַּמְעִ֖יט מִקְנָת֑/וֹ כִּ֚י מִסְפַּ֣ר תְּבוּאֹ֔ת ה֥וּא מֹכֵ֖ר לָֽ/ךְ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/016.yaml
  text: In proportion to the greater number of years you shall increase its purchase price[a], and in proportion to the fewer number of years you shall reduce its purchase price, because he is selling to you a number of harvests.
translation:
  language: fr
  text: Plus le nombre d’années est grand, plus tu augmenteras le prix d’achat ; moins le nombre d’années est grand, plus tu réduiras le prix d’achat, car il te vend un certain nombre de récoltes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traduit par « récoltes » peut aussi désigner les produits de la terre ou les rendements.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפִי רֹב הַשָּׁנִים
  choice: Plus le nombre d’années sera grand
  rationale: La tournure comparative « plus… plus… » exprime naturellement en français la proportion indiquée par לְפִי et la quantité supérieure d’années.
- source_word: תַּרְבֶּה מִקְנָתוֹ
  choice: plus tu augmenteras le prix d’achat
  rationale: Le hiphil de רבה indique une augmentation, et מִקְנָה désigne ici, dans le contexte de l’évaluation, le prix de la transaction.
- source_word: וּלְפִי מְעֹט הַשָּׁנִים
  choice: moins le nombre d’années sera grand
  rationale: Cette formulation française établit le parallèle proportionnel avec le premier membre sans alourdir le texte par « le nombre inférieur d’années ».
- source_word: תַּמְעִיט מִקְנָתוֹ
  choice: plus tu réduiras le prix d’achat
  rationale: Le hiphil de מעט signifie diminuer ou réduire ; « réduire le prix d’achat » est clair dans ce cadre juridique et commercial.
- source_word: כִּי מִסְפַּר תְּבוּאֹת הוּא מֹכֵר לָךְ
  choice: car c’est un certain nombre de récoltes qu’il te vend
  rationale: La construction emphatique rend explicite l’objet réel de la transaction. « Récoltes » restitue concrètement תְּבוּאוֹת, qui peut aussi désigner les productions ou rendements.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La structure corrélative « plus… plus… / moins… plus… » communique clairement la règle proportionnelle, tandis que le singulier « tu » et « il » conserve l’adresse juridique individuelle de l’hébreu.
