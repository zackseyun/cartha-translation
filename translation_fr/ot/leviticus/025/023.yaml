source:
  edition: WLC
  text: וְ/הָ/אָ֗רֶץ לֹ֤א תִמָּכֵר֙ לִ/צְמִתֻ֔ת כִּי לִ֖/י הָ/אָ֑רֶץ כִּֽי גֵרִ֧ים וְ/תוֹשָׁבִ֛ים אַתֶּ֖ם עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/023.yaml
  text: The land must not be sold permanently[a], because the land is mine[b]. For you are strangers and sojourners with me.
translation:
  language: fr
  text: La terre ne doit pas être vendue définitivement[a], car la terre est à moi. En effet, vous êtes des étrangers et des résidents auprès de moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à perpétuité » ou « de manière irrévocable ».
    reason: lexical_alternative
  - marker: b
    text: L’expression « étrangers et résidents » indique que les Israélites vivent sur une terre qui appartient à Dieu, sans en être les propriétaires absolus.
    reason: cultural_note
lexical_decisions:
- source_word: תִמָּכֵר
  choice: ne doit pas être vendue
  rationale: Le nifal imparfait de מכר a ici, dans un texte juridique, une valeur passive et prohibitive. Cette formulation française rend naturellement l’interdiction tout en conservant la voix passive.
- source_word: לִצְמִתֻת
  choice: définitivement
  rationale: צְמִתֻת désigne ici une aliénation durable et irrévocable. « Définitivement » est clair en français moderne et convient au contexte foncier.
- source_word: כִּי לִי הָאָרֶץ
  choice: car la terre est à moi
  rationale: Le premier כִּי introduit le motif de l’interdiction. « Est à moi » exprime directement et naturellement la revendication divine de propriété.
- source_word: גֵרִים
  choice: immigrés
  rationale: גֵר désigne des personnes établies dans un pays qui n’est pas le leur et dont le statut y demeure dépendant. « Immigrés » rend cette situation résidentielle sans suggérer de simples visiteurs.
- source_word: וְתוֹשָׁבִים
  choice: et des résidents temporaires
  rationale: תּוֹשָׁב désigne un résident sans droit héréditaire permanent sur le sol. Associé à גֵר, ce choix souligne le caractère non absolu de l’occupation de la terre.
- source_word: עִמָּדִי
  choice: chez moi
  rationale: עם avec le suffixe de première personne signifie littéralement « avec moi ». Dans ce contexte de propriété foncière, « chez moi » est une expression française naturelle qui conserve l’idée que les Israélites résident sur le domaine de Dieu.
theological_decisions:
- issue: Nature du rapport d’Israël à la terre
  choice: La terre appartient à Dieu, tandis qu’Israël y réside sous son autorité, sans droit de propriété absolu.
  alternative: Comprendre le verset comme une simple réglementation socio-économique, ou lui faire affirmer une dépossession absolue dépassant le cadre du jubilé.
  rationale: L’affirmation explicite « la terre est à moi » donne un fondement théologique à l’interdiction. La traduction préserve à la fois sa portée juridique et la dépendance d’Israël, sans développer un système doctrinal ultérieur.
translation_notes:
  register: Français international moderne, digne et accessible. « Immigrés » et « résidents temporaires » rendent distinctement les deux statuts hébreux; « chez moi » exprime naturellement עִמָּדִי dans le contexte de la propriété divine.
