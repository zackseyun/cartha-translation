    issue: « immigrés » pour גֵרִים
    rationale: Le mot évoque des catégories administratives et politiques modernes. Dans cette paire juridique et sociale, « étrangers » rend plus sobrement le statut de non-propriétaires originels.
  - severity: medium
    issue: « résidents temporaires » pour תוֹשָׁבִים
    rationale: Le terme désigne un résident ou habitant, souvent sans droit foncier héréditaire, mais sa temporalité n’est pas explicitement affirmée par le mot lui-même. « Résidents » conserve l’ambiguïté.
  - severity: low
    issue: « chez moi » pour עִמָּדִי
    rationale: Cette expression est naturelle mais interprète « avec moi » en termes de domicile ou de domaine. « Auprès de moi » garde la relation exprimée par l’hébreu avec moins d’explicitation.
