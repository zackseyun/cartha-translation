  source_fidelity: La prohibition de vente permanente et le motif de la propriété divine sont bien rendus. Toutefois, « immigrés » est anachronique et socio-administratif pour גֵרִים, tandis que « chez moi » interprète et reformule plus librement עִמָּדִי (« avec moi »). « Étrangers et résidents auprès de moi » préserve mieux les deux termes et leur relation à Dieu.
  naturalness: La formulation révisée reste naturelle dans un français moderne, digne et accessible. « Étrangers et résidents » est plus idiomatique et moins chargé administrativement que « immigrés et résidents temporaires ».
  terminology: « Étrangers » et « résidents » distinguent adéquatement גֵרִים et תוֹשָׁבִים sans imposer que le second groupe soit nécessairement temporaire. « Auprès de moi » rend de façon fluide la relation exprimée par עִמָּדִי, sans élargir le sens.
  issues:
