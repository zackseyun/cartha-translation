source:
  edition: WLC
  text: וְ/חִשַּׁב֙ אֶת שְׁנֵ֣י מִמְכָּר֔/וֹ וְ/הֵשִׁיב֙ אֶת הָ֣/עֹדֵ֔ף לָ/אִ֖ישׁ אֲשֶׁ֣ר מָֽכַר ל֑/וֹ וְ/שָׁ֖ב לַ/אֲחֻזָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/027.yaml
  text: then he shall calculate the years since its sale and return the surplus to the man to whom he sold it, and he shall return to his property.
translation:
  language: fr
  text: Il calculera alors les années écoulées depuis la vente, rendra le surplus[a] à l’homme à qui il avait vendu le bien et retournera dans sa propriété[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le reste » ou « l’excédent ». Il s’agit du montant correspondant aux années qui restent jusqu’au jubilé, après déduction des années écoulées depuis la vente.
    reason: lexical_alternative
  - marker: b
    text: Ici, la « propriété » est une terre détenue comme patrimoine familial en Israël.
    reason: cultural_note
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: il comptera
  rationale: Le verbe חִשֵּׁב exprime ici un calcul destiné à fixer le prix de rachat. « Compter » est naturel en français avec des années et convient au cadre juridique.
- source_word: שְׁנֵי מִמְכָּרוֹ
  choice: les années écoulées depuis la vente
  rationale: Littéralement, « les années de sa vente ». Dans ce contexte, il s’agit des années écoulées depuis la vente, qui servent à calculer la somme à restituer.
- source_word: וְהֵשִׁיב
  choice: rendra
  rationale: Le hifil de שׁוב signifie faire revenir ou restituer. « Rendra » exprime clairement la restitution de la somme tout en conservant le lien lexical avec le retour final.
- source_word: הָעֹדֵף
  choice: le surplus
  rationale: Le terme désigne ce qui reste après le calcul, c’est-à-dire la part du prix correspondant aux années encore à courir.
- source_word: לָאִישׁ אֲשֶׁר מָכַר לוֹ
  choice: à l’homme à qui il avait vendu le bien
  rationale: Cette formulation conserve la référence personnelle de אִישׁ et explicite en français l’objet sous-entendu de la vente.
- source_word: וְשָׁב
  choice: puis il retournera
  rationale: Le qal de שׁוב marque le retour du vendeur après le rachat. « Puis » rend naturellement la succession des actes prescrits.
- source_word: לַאֲחֻזָּתוֹ
  choice: dans sa propriété
  rationale: אֲחֻזָּה désigne ici une propriété foncière détenue comme patrimoine familial. « Propriété » reste lisible, tandis que la note précise la portée historique du terme.
theological_decisions:
- issue: Portée de אֲחֻזָּה dans la législation du jubilé
  choice: propriété
  alternative: possession héréditaire
  rationale: Le terme renvoie à la terre attribuée à une famille en Israël, et non à un bien quelconque. Le texte principal adopte une expression française fluide sans effacer cette dimension, qui est explicitée en note.
translation_notes:
  register: Français international moderne, clair et digne, avec un futur de prescription adapté au registre juridique. « Le bien » explicite seulement l’objet sous-entendu de la vente; les notes préservent les nuances économique et foncière du texte hébreu.
