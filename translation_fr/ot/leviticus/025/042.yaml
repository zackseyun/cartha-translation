source:
  edition: WLC
  text: כִּֽי עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם לֹ֥א יִמָּכְר֖וּ מִמְכֶּ֥רֶת עָֽבֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/042.yaml
  text: For they are my servants[a], whom I brought out from the land of Egypt[b]; they shall not be sold as servants are sold.
translation:
  language: fr
  text: Car ils sont mes esclaves[a], que j’ai fait sortir du pays d’Égypte ; ils ne seront pas vendus comme on vend un esclave[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « mes serviteurs ». Le mot hébreu peut désigner un esclave ou un serviteur ; ici, le contexte souligne l’appartenance à Dieu et interdit la vente comme celle d’un esclave ordinaire.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils ne seront pas vendus selon la vente d’un esclave », c’est-à-dire à la manière d’une transaction ordinaire portant sur un esclave.'
    reason: literal_rendering
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la prescription précédente et conserve clairement la valeur explicative de la conjonction.
- source_word: עֲבָדַי הֵם
  choice: ils sont mes esclaves
  rationale: Le nom עֶבֶד avec le suffixe de première personne exprime ici une appartenance et une condition de dépendance. « Esclaves » préserve la force sociojuridique du passage, tandis que le pronom explicite הֵם donne du relief à l’affirmation.
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם
  choice: eux que j’ai fait sortir
  rationale: « Faire sortir » rend naturellement la forme causative et reprend la formule biblique de la délivrance hors d’Égypte. Le pronom disloqué « eux » restitue l’accent porté par la proposition relative.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: du pays d’Égypte
  rationale: Formulation française courante et fidèle de l’expression géographique.
- source_word: לֹא יִמָּכְרוּ
  choice: ils ne seront pas vendus
  rationale: Le passif et la valeur prohibitive de la forme verbale sont conservés dans un registre juridique naturel.
- source_word: מִמְכֶּרֶת עָבֶד
  choice: comme on vend un esclave
  rationale: Cette tournure rend de façon idiomatique le type ou le mode de vente désigné par l’expression hébraïque, sans réduire celle-ci à une simple comparaison abstraite.
theological_decisions:
- issue: Sens de עֶבֶד dans l’affirmation de l’appartenance d’Israël à Dieu
  choice: esclaves
  alternative: serviteurs
  rationale: Le contexte fonde l’interdiction de vendre un Israélite comme un bien servile sur son appartenance préalable à Dieu après l’exode. « Esclaves » maintient cette tension juridique et théologique, sans adoucir le vocabulaire ; une note signale néanmoins l’autre traduction lexicalement possible.
translation_notes:
  register: Français moderne, digne et direct. « Car » maintient le lien argumentatif avec le verset précédent ; le point-virgule conserve la progression logique de la phrase. Le vocabulaire explicite évite d’atténuer la réalité juridique évoquée par le texte.
