id: LEV.25.41
reference: Leviticus 25:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יָצָא֙ מֵֽ/עִמָּ֔/ךְ ה֖וּא וּ/בָנָ֣י/ו עִמּ֑/וֹ וְ/שָׁב֙ אֶל מִשְׁפַּחְתּ֔/וֹ וְ/אֶל אֲחֻזַּ֥ת אֲבֹתָ֖י/ו יָשֽׁוּב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/041.yaml
  text: Then he and his sons with him shall go out from you[b][a], and he shall return to his clan and return to the property of his fathers.
translation:
  language: fr
  text: Alors il sortira de chez toi, lui et ses fils avec lui. Il retournera dans son clan[a] et retournera dans la propriété de ses pères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa famille »; le terme hébreu peut désigner un groupe familial élargi ou un clan.
    reason: lexical_alternative
  - marker: b
    text: Ou « la possession de ses pères » ou « sa propriété ancestrale ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא מֵעִמָּךְ
  choice: Alors il sortira de chez toi
  rationale: Le verbe concret « sortir » est conservé sans expliciter davantage la libération du service, tandis que « de chez toi » rend naturellement מֵעִמָּךְ en français dans ce contexte domestique et juridique.
- source_word: הוּא וּבָנָיו עִמּוֹ
  choice: lui et ses fils avec lui
  rationale: La formulation maintient l’insistance de l’hébreu ainsi que son vocabulaire masculin explicite.
- source_word: וְשָׁב ... יָשׁוּב
  choice: Il retournera ... et retournera
  rationale: La répétition de la racine שׁוב est préservée afin de garder l’accent du texte sur le rétablissement de l’homme dans son groupe familial et son patrimoine.
- source_word: מִשְׁפַּחְתּוֹ
  choice: son clan
  rationale: Dans ce cadre de parenté et de propriété foncière, מִשְׁפָּחָה désigne vraisemblablement un groupe familial plus large que la famille immédiate.
- source_word: אֲחֻזַּת אֲבֹתָיו
  choice: la propriété de ses pères
  rationale: « Propriété » exprime la possession foncière ou héréditaire, et « de ses pères » conserve l’expression généalogique masculine de l’hébreu.
theological_decisions:
- issue: Formulation masculine de la parenté
  choice: ses fils ... ses pères
  alternative: ses enfants ... ses ancêtres
  rationale: L’hébreu emploie ici des formes explicitement masculines, pertinentes dans ce cadre juridique de filiation et de patrimoine; elles sont donc conservées.
- issue: Portée sociojuridique de la sortie
  choice: il sortira de chez toi
  alternative: il sera libéré de ton service
  rationale: Le contexte implique la fin d’une servitude pour dette, mais le texte emploie le verbe concret « sortir ». La traduction évite d’inscrire dans le corps du verset une explicitation qui relève du contexte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement de l’hébreu, avec deux phrases pour une lecture naturelle. La répétition de « retournera » est volontaire.
