id: LEV.25.19
reference: Leviticus 25:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נָתְנָ֤ה הָ/אָ֨רֶץ֙ פִּרְיָ֔/הּ וַ/אֲכַלְתֶּ֖ם לָ/שֹׂ֑בַע וִֽ/ישַׁבְתֶּ֥ם לָ/בֶ֖טַח עָלֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/019.yaml
  text: The land will yield its fruit[a], and you will eat your fill and live securely on it.
translation:
  language: fr
  text: La terre donnera ses fruits, vous mangerez à satiété et vous y habiterez[a] en sécurité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous y vivrez ». Le verbe hébreu peut signifier « habiter », « demeurer » ou « vivre » dans un lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנָה
  choice: donnera
  rationale: Le verbe נתן signifie littéralement « donner ». Avec la terre pour sujet et les fruits pour objet, « donnera » conserve l’image hébraïque tout en étant naturel en français.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Dans le contexte de Lévitique 25, le mot désigne la terre où Israël habite et qu’il cultive. « La terre » convient au contexte agricole sans élargir le sens à la planète.
- source_word: פִּרְיָהּ
  choice: ses fruits
  rationale: פְּרִי désigne le fruit et, par extension, les produits de la terre. Le pluriel français « ses fruits » exprime naturellement la production agricole tout en gardant l’image concrète du texte.
- source_word: וַאֲכַלְתֶּם לָשֹׂבַע
  choice: vous mangerez à satiété
  rationale: שֹׂבַע exprime le rassasiement. « Manger à satiété » restitue précisément l’idée de manger jusqu’à être rassasié dans un registre courant et digne.
- source_word: וִישַׁבְתֶּם
  choice: vous y habiterez
  rationale: ישב peut signifier « habiter », « demeurer » ou « vivre » dans un lieu. « Habiter » souligne ici l’établissement durable sur la terre.
- source_word: לָבֶטַח
  choice: en sécurité
  rationale: בֶּטַח évoque une condition de sûreté et de confiance. « En sécurité » est une formulation française directe et naturelle.
- source_word: עָלֶיהָ
  choice: y
  rationale: Le pronom renvoie à la terre. Avec « habiter », l’adverbe pronominal « y » est la tournure idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve l’image de la terre qui donne ses fruits et rend explicitement le rassasiement et la sécurité, sans ajouter d’interprétation théologique.
