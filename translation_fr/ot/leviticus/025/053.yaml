source:
  edition: WLC
  text: כִּ/שְׂכִ֥יר שָׁנָ֛ה בְּ/שָׁנָ֖ה יִהְיֶ֣ה עִמּ֑/וֹ לֹֽא יִרְדֶּ֥/נּֽוּ בְּ/פֶ֖רֶךְ לְ/עֵינֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/053.yaml
  text: Like a hired worker year by year he shall be with him[a]; he shall not rule over him harshly in your sight.
translation:
  language: fr
  text: Il sera avec lui comme un salarié, d’année en année[a]. Celui-ci ne le dominera pas avec dureté sous tes yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comme un salarié, année après année, il sera avec lui. »'
    reason: La disposition des mots peut être rendue plus près de l’hébreu ; שָׁנָה בְּשָׁנָה peut aussi se traduire par « année après année ».
lexical_decisions:
- source_word: כִּשְׂכִיר
  choice: comme un salarié
  rationale: Le préfixe כְּ exprime ici la comparaison (« comme »), et שָׂכִיר désigne une personne engagée contre salaire, par opposition à un esclave. « Salarié » est clair et actuel en français international.
- source_word: שָׁנָה בְּשָׁנָה
  choice: d’année en année
  rationale: Cette expression distributive décrit un statut reconduit et évalué année après année; la formulation française est naturelle et conserve cette portée.
- source_word: יִהְיֶה עִמּוֹ
  choice: il sera chez lui
  rationale: L’hébreu signifie littéralement « il sera avec lui ». Dans ce rapport de service, « chez lui » rend naturellement la relation sans ajouter explicitement le verbe « servir ».
- source_word: לֹא יִרְדֶּנּוּ
  choice: celui-ci ne le dominera pas
  rationale: רדה signifie exercer la domination ou l’autorité sur quelqu’un. « Dominer » conserve la force du terme et évite d’ajouter une idée de travail forcé qui n’est pas exprimée par le verbe lui-même.
- source_word: בְּפֶרֶךְ
  choice: avec dureté
  rationale: Le nom désigne une domination ou un traitement sévère, voire impitoyable. « Avec dureté » convient naturellement au verbe « dominer » et maintient la portée éthique de l’interdiction.
- source_word: לְעֵינֶיךָ
  choice: sous tes yeux
  rationale: La formule conserve l’image concrète des yeux et indique que le traitement a lieu au vu de la personne interpellée, qui ne doit pas le tolérer.
theological_decisions:
- issue: Statut de l’Israélite au service d’un propriétaire étranger résident
  choice: Son statut est comparé à celui d’un salarié, sans le désigner ici comme esclave.
  alternative: Le rendre par « serviteur à gages » ou employer un vocabulaire explicite d’esclavage.
  rationale: Le texte encadre son traitement au moyen d’une comparaison avec le שָׂכִיר, travailleur engagé contre salaire. Cette traduction préserve la protection juridique et le caractère temporaire du statut dans le contexte, sans effacer la situation de dépendance décrite dans le chapitre.
- issue: Référents des pronoms masculins
  choice: « Celui-ci » désigne le maître, tandis que « le » désigne l’Israélite dépendant.
  alternative: Répéter explicitement « son maître » afin de supprimer toute ambiguïté.
  rationale: Le contexte permet d’identifier les référents. « Celui-ci » rend le changement de sujet plus clair en français sans introduire un nom absent du texte hébreu.
translation_notes:
  register: Français international moderne, digne et direct. « Salarié » distingue nettement le travailleur engagé de l’esclave; « sous tes yeux » conserve l’image hébraïque et la responsabilité du témoin interpellé.
