  text: שֵׁ֤שׁ שָׁנִים֙ תִּזְרַ֣ע שָׂדֶ֔/ךָ וְ/שֵׁ֥שׁ שָׁנִ֖ים תִּזְמֹ֣ר כַּרְמֶ֑/ךָ וְ/אָסַפְתָּ֖ אֶת תְּבוּאָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/003.yaml
  text: For six years you shall sow your field[a], and for six years you shall prune your vineyard and gather its produce.
translation:
  language: fr
  text: Pendant six ans, tu ensemenceras ton champ, et pendant six ans, tu tailleras ta vigne et tu en récolteras le produit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le rendement ». Le mot hébreu peut désigner plus généralement le produit agricole.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשׁ שָׁנִים
  choice: pendant six ans
  rationale: L’accusatif de durée indique la période durant laquelle l’action se poursuit. « Pendant six ans » exprime clairement cette valeur temporelle en français naturel.
- source_word: תִּזְרַע
  choice: tu ensemenceras
  rationale: Dans ce texte législatif, l’imparfait hébreu a une valeur prescriptive. Le futur français convient à l’énoncé d’une instruction, et « ensemencer » exprime naturellement l’action de semer un champ.
- source_word: שָׂדֶךָ
  choice: ton champ
  rationale: שָׂדֶה désigne ici une étendue cultivée, et non le pays ou le territoire au sens large. « Champ » préserve cette précision agricole.
- source_word: תִּזְמֹר
  choice: tu tailleras
  rationale: Dans le contexte d’une vigne, זמר désigne précisément la taille des sarments. « Tailler » est le terme agricole français usuel.
- source_word: כַּרְמֶךָ
  choice: ta vigne
  rationale: En français courant, « vigne » peut désigner le terrain planté de ceps aussi bien que la culture elle-même; ce choix est naturel et précis dans ce contexte.
- source_word: וְאָסַפְתָּ
  choice: et tu en récolteras
  rationale: אָסַף signifie rassembler ou recueillir. Avec des produits agricoles, « récolter » rend naturellement l’action sans modifier son sens contextuel.
- source_word: תְּבוּאָתָהּ
  choice: les produits
  rationale: תְּבוּאָה désigne ce que la terre ou la culture produit. Le pluriel français « les produits » conserve la portée agricole générale du terme, tandis que le pronom « en » rend le suffixe possessif sans imposer une identification trop explicite de son antécédent.
