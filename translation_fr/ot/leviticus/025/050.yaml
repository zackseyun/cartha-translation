id: LEV.25.50
reference: Leviticus 25:50
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/חִשַּׁב֙ עִם קֹנֵ֔/הוּ מִ/שְּׁנַת֙ הִמָּ֣כְר/וֹ ל֔/וֹ עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/הָיָ֞ה כֶּ֤סֶף מִמְכָּר/וֹ֙ בְּ/מִסְפַּ֣ר שָׁנִ֔ים כִּ/ימֵ֥י שָׂכִ֖יר יִהְיֶ֥ה עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/050.yaml
  text: He shall calculate with his buyer from the year he sold himself to him until the year of jubilee[a], and the price of his sale shall be according to the number of years[b]; like the days of a hired worker he shall be with him.
translation:
  language: fr
  text: 'Il fera le compte avec celui qui l’a acheté, depuis l’année où il s’est vendu à lui jusqu’à l’année du jubilé[a]. Le prix de sa vente sera proportionnel au nombre d’années : il sera à son service comme un salarié[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « depuis l’année de sa vente à lui ». Le contexte indique que cet homme s’est vendu comme serviteur.'
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « comme les jours d’un salarié, il sera avec lui ». La comparaison concerne la manière de compter la durée et la valeur de son service.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: Il fera le compte
  rationale: Le verbe désigne ici un calcul financier en vue du rachat. « Faire le compte » est naturel en français et convient au contexte juridique.
- source_word: עִם קֹנֵהוּ
  choice: avec celui qui l’a acheté
  rationale: Cette formulation rend clairement le participe קֹנֵהוּ et évite la tournure moins naturelle « avec son acheteur » lorsqu’une personne est l’objet de la transaction.
- source_word: מִשְּׁנַת הִמָּכְרוֹ לוֹ
  choice: depuis l’année où il s’est vendu à lui
  rationale: Le contexte immédiat indique que l’Israélite s’est vendu comme serviteur. La formulation française explicite ce sens réfléchi tout en conservant le complément « à lui ».
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: jusqu’à l’année du jubilé
  rationale: « Jubilé » est le terme français traditionnel et intelligible pour l’institution juridique désignée par יוֹבֵל.
- source_word: וְהָיָה כֶּסֶף מִמְכָּרוֹ
  choice: Le prix de sa vente sera calculé
  rationale: כֶּסֶף désigne ici la valeur monétaire de la transaction. L’ajout de « calculé », implicite dans la continuité de la phrase, produit une formulation juridique française claire.
- source_word: בְּמִסְפַּר שָׁנִים
  choice: d’après le nombre d’années
  rationale: La préposition indique que la valeur est établie proportionnellement au nombre d’années concernées.
- source_word: כִּימֵי שָׂכִיר יִהְיֶה עִמּוֹ
  choice: son temps chez lui sera considéré comme celui d’un salarié
  rationale: La construction hébraïque est condensée et littéralement proche de « comme les jours d’un salarié, il sera avec lui ». Cette formulation restitue naturellement la comparaison de durée et de statut sans suggérer une propriété perpétuelle.
theological_decisions:
- issue: Nature du service de la personne vendue
  choice: La comparaison avec le salarié est conservée comme déterminant la manière d’évaluer son temps de service.
  alternative: 'Traduire littéralement : « il sera avec lui comme les jours d’un salarié ».'
  rationale: Le texte établit une comparaison juridique sans effacer la réalité de la vente ni assimiler entièrement le serviteur à un salarié ordinaire.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire juridique demeure concret; « salarié » rend שָׂכִיר sans archaïsme, tandis que « jubilé » conserve le terme biblique établi.
