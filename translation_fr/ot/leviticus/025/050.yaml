- from: 'Il fera le compte avec celui qui l’a acheté, depuis l’année où il s’est vendu à lui jusqu’à l’année du jubilé[a]. Le prix de sa vente sera calculé d’après le nombre d’années : son temps chez lui sera considéré comme celui d’un salarié[b].'
  to: 'Il fera le compte avec celui qui l’a acheté, depuis l’année où il s’est vendu à lui jusqu’à l’année du jubilé[a]. Le prix de sa vente sera proportionnel au nombre d’années : il sera à son service comme un salarié[b].'
