source:
  edition: WLC
  text: וְ/כִ֣י תַשִּׂ֗יג יַ֣ד גֵּ֤ר וְ/תוֹשָׁב֙ עִמָּ֔/ךְ וּ/מָ֥ךְ אָחִ֖י/ךָ עִמּ֑/וֹ וְ/נִמְכַּ֗ר לְ/גֵ֤ר תּוֹשָׁב֙ עִמָּ֔/ךְ א֥וֹ לְ/עֵ֖קֶר מִשְׁפַּ֥חַת גֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/047.yaml
  text: If the means of a resident foreigner among you become sufficient[a], and your brother beside him becomes poor and sells himself to the resident foreigner among you, or to a member of the foreigner’s clan,
translation:
  language: fr
  text: Si un étranger établi parmi vous devient prospère, et que ton frère, qui est auprès de lui, s’appauvrit et se vend à cet étranger établi parmi vous, ou à un membre de la famille d’un étranger[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la souche — ou au rejeton — de la famille d’un étranger ». L’expression hébraïque est difficile ; le texte donne son sens probable.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׂיג יַד
  choice: acquiert des moyens
  rationale: L’expression idiomatique, littéralement « sa main atteint », désigne l’acquisition de ressources financières suffisantes. « Acquiert des moyens » rend naturellement cette progression économique.
- source_word: גֵּר וְתוֹשָׁב
  choice: étranger établi
  rationale: Les deux termes décrivent ici un non-Israélite qui réside durablement au sein de la communauté. « Étranger établi » exprime à la fois son statut extérieur et sa résidence, sans suggérer un simple voyageur.
- source_word: וּמָךְ
  choice: s’appauvrit
  rationale: Le verbe indique un passage à la pauvreté; la forme pronominale française rend clairement cette dégradation de situation.
- source_word: אָחִיךָ
  choice: ton frère
  rationale: La traduction littérale conserve la force familiale et éthique du vocabulaire de l’alliance; dans ce contexte, il s’agit d’un compatriote israélite.
- source_word: עִמּוֹ
  choice: qui vit auprès de lui
  rationale: La formule situe le frère pauvre dans la proximité de l’étranger devenu prospère. Cette formulation française reste naturelle tout en conservant le rapport exprimé par « avec lui/auprès de lui ».
- source_word: וְנִמְכַּר
  choice: se vend
  rationale: Bien que la forme hébraïque puisse être traduite passivement par « est vendu », le contexte juridique de l’endettement permet le sens réfléchi « se vend », sans ajouter explicitement la notion de service.
- source_word: לְעֵקֶר מִשְׁפַּחַת גֵּר
  choice: à un membre de la famille d’un étranger
  rationale: עֵקֶר est rare et difficile; dans ce contexte, il semble désigner une personne issue du groupe familial. Le texte principal donne le sens probable en français clair, tandis que la note conserve l’alternative plus littérale.
theological_decisions:
- issue: Langage de parenté israélite dans la loi sociale
  choice: ton frère
  alternative: ton compatriote israélite / ton parent
  rationale: « Ton frère » préserve la formulation familiale du texte et sa portée éthique, sans réduire le lien à une simple catégorie civique.
- issue: Nature de la vente exprimée par וְנִמְכַּר
  choice: se vend
  alternative: est vendu
  rationale: Le contexte traite d’une personne appauvrie entrant dans une dépendance économique. Le réfléchi rend le sens contextuel probable, tandis que le passif demeure grammaticalement possible.
translation_notes:
  register: Français international moderne, sobre et juridique. Le tutoiement singulier correspond à l’adresse communautaire hébraïque. La phrase reste ouverte par une virgule, comme dans la source, puisque la disposition juridique se poursuit au verset suivant.
