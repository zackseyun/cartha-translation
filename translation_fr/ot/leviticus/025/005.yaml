source:
  edition: WLC
  text: אֵ֣ת סְפִ֤יחַ קְצִֽירְ/ךָ֙ לֹ֣א תִקְצ֔וֹר וְ/אֶת עִנְּבֵ֥י נְזִירֶ֖/ךָ לֹ֣א תִבְצֹ֑ר שְׁנַ֥ת שַׁבָּת֖וֹן יִהְיֶ֥ה לָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/005.yaml
  text: You shall not reap the aftergrowth of your harvest[a], and you shall not gather the grapes of your unpruned vine[c][b]; it shall be a year of complete rest for the land.
translation:
  language: fr
  text: Tu ne moissonneras pas ce qui aura poussé spontanément après ta moisson[a], et tu ne vendangeras pas les raisins de ta vigne laissée sans taille[b]. Ce sera pour la terre une année de repos complet[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les repousses de ta moisson » : il s’agit de ce qui pousse de soi-même à partir des semences de la récolte précédente.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « les raisins de ta vigne séparée » ; l’expression hébraïque désigne ici une vigne laissée sans entretien ni taille pendant l’année sabbatique.
    reason: lexical_alternative
  - marker: c
    text: Ou « une année sabbatique » ou « une année de repos solennel ».
    reason: lexical_alternative
lexical_decisions:
- source_word: סְפִיחַ קְצִירְךָ
  choice: ce qui aura poussé spontanément après ta moisson
  rationale: סְפִיחַ désigne la végétation qui repousse d’elle-même à partir des semences de la récolte précédente. Cette formulation française explicite la croissance spontanée tout en maintenant son lien avec la moisson antérieure.
- source_word: תִקְצֹר
  choice: tu ne moissonneras pas
  rationale: Le verbe désigne spécifiquement l’action de moissonner les produits des champs.
- source_word: עִנְּבֵי נְזִירֶךָ
  choice: les raisins de ta vigne laissée sans taille
  rationale: עִנְּבֵי signifie « raisins », tandis que נְזִירֶךָ désigne ici la vigne laissée à part, sans entretien ni taille pendant l’année sabbatique. La formulation évite l’obscur « vigne séparée » et ne suggère pas à tort un vœu de naziréat.
- source_word: תִבְצֹר
  choice: tu ne vendangeras pas
  rationale: En contexte viticole, vendanger rend précisément le fait de récolter les raisins et produit un parallélisme naturel avec moissonner.
- source_word: שְׁנַת שַׁבָּתוֹן
  choice: une année de repos complet
  rationale: שַׁבָּתוֹן exprime un repos sabbatique marqué ou complet. Cette traduction en communique la force en français courant sans réduire l’expression à une simple désignation calendaire.
- source_word: לָאָרֶץ
  choice: pour la terre
  rationale: Dans ce contexte, אֶרֶץ désigne la terre cultivée qui doit bénéficier du repos prescrit.
theological_decisions:
- issue: Rendre la terminologie de l’année sabbatique sans lui imposer des associations doctrinales ou liturgiques ultérieures
  choice: Ce sera pour la terre une année de repos complet
  alternative: Ce sera une année sabbatique pour la terre ; ce sera pour la terre une année de repos solennel
  rationale: Le choix conserve le motif théologique du repos sabbatique et la valeur intensive de שַׁבָּתוֹן, tout en restant clair pour un lectorat moderne et sans ajouter d’interprétation étrangère au texte.
translation_notes:
  register: Français international moderne, naturel et digne. Les verbes agricoles précis « moissonner » et « vendanger » conservent le parallélisme du texte. Le tutoiement singulier reproduit l’adresse hébraïque au membre individuel de la communauté.
