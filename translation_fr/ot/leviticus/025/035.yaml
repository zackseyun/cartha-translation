    rationale: Le texte source porte גֵּר וְתוֹשָׁב, avec « et ». Puisque la relation exacte des deux désignations est discutée, « ou » interprète et réduit l’ambiguïté. La coordination est préférable ; la note peut signaler les analyses possibles.
  - severity: low
