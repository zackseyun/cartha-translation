base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/035.yaml
  text: If your brother becomes poor and his hand falters beside you[a], then you shall support him[b]; so that he may live beside you as a resident foreigner or a temporary resident.
translation:
  language: fr
  text: Si ton frère s’appauvrit et que ses ressources s’épuisent auprès de toi[a], tu le soutiendras, afin qu’il vive auprès de toi comme un étranger résident et un résident temporaire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et que sa main faiblisse auprès de toi » ; cette image évoque la perte de ses moyens et l’incapacité de subvenir à ses besoins.'
    reason: lexical_alternative
  - marker: b
    text: 'La syntaxe hébraïque est condensée. Autre compréhension possible : « tu le soutiendras — l’étranger résident et le résident temporaire — afin qu’il vive auprès de toi ». Les deux désignations peuvent aussi former une expression composée.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִי יָמוּךְ
  choice: Si … s’appauvrit
  rationale: La tournure introduit un cas conditionnel, et le verbe décrit ici une dégradation de la situation économique.
- source_word: אָחִיךָ
  choice: ton frère
  rationale: Le terme de parenté est conservé. Dans ce contexte, il désigne un membre de la communauté d’Israël sans qu’il soit nécessaire de remplacer l’image familiale par une paraphrase.
- source_word: וּמָטָה יָדוֹ עִמָּךְ
  choice: que sa main faiblisse auprès de toi
  rationale: La formulation garde la métaphore hébraïque de la main qui perd sa force, tout en indiquant la proximité sociale par « auprès de toi ». Une note en explicite le sens économique.
- source_word: וְהֶחֱזַקְתָּ בּוֹ
  choice: tu le soutiendras
  rationale: Le hifil de חזק exprime ici l’action de maintenir ou d’aider concrètement une personne dont les ressources défaillent.
- source_word: גֵּר
  choice: immigré
  rationale: Le mot désigne un étranger établi au sein de la société israélite. « Immigré » est actuel et fait ressortir cette résidence parmi la population locale.
- source_word: וְתוֹשָׁב
  choice: résident temporaire
  rationale: Cette expression distingue un autre statut de résidence, moins stable, de celui du גֵּר.
- source_word: וָחַי עִמָּךְ
  choice: afin qu’il puisse vivre auprès de toi
  rationale: Le contexte permet de comprendre la proposition comme le résultat recherché du soutien. « Auprès de toi » reprend le cadre relationnel et communautaire de עִמָּךְ.
theological_decisions:
- issue: Portée de « ton frère »
  choice: Conserver le terme familial littéral.
  alternative: « ton compatriote » ou « un membre de ton peuple »
  rationale: Le texte fonde l’obligation d’entraide sur une relation de fraternité. La traduction ne remplace pas cette image par une définition interprétative.
- issue: Rattachement de « immigré et résident temporaire »
  choice: 'Rattacher l’expression à la manière dont le frère démuni peut vivre auprès du destinataire : « comme un immigré ou un résident temporaire ».'
  alternative: 'Comprendre ces mots comme des bénéficiaires supplémentaires : « tu le soutiendras, ainsi que l’immigré et le résident temporaire » ; ou traduire les deux termes comme une seule catégorie.'
  rationale: La syntaxe hébraïque est condensée et admet plusieurs analyses. Le texte principal suit un rattachement contextuellement cohérent, tandis que la note maintient l’autre lecture possible.
translation_notes:
  register: Français international actuel, digne et directement compréhensible. Le tutoiement singulier reflète les formes hébraïques. La métaphore de la main est maintenue dans le texte et expliquée en note ; l’ambiguïté syntaxique de la fin du verset est signalée sans imposer une lecture confessionnelle.
