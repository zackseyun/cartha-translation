  verdict: revise
  source_fidelity: La protase et l’injonction sont bien rendues dans l’ensemble. Toutefois, « que sa main faiblisse auprès de toi » est une transposition très littérale mais peu idiomatique en français ; l’expression hébraïque décrit la défaillance des moyens de subsistance. À la fin, le texte hébreu coordonne גֵּר et תּוֹשָׁב ; « ou » dans le texte principal résout indûment une question de rapport entre les deux termes. Une coordination française conserve mieux la formulation source, tandis que la note expose l’autre analyse syntaxique.
  naturalness: « Si ton frère s’appauvrit et que ses ressources s’épuisent auprès de toi » est naturel, conserve le cadre relationnel de עִמָּךְ et rend le sens de l’idiome sans introduire une métaphore française forcée. « Étranger résident » est plus précis et moins anachroniquement administratif qu’« immigré » pour גֵּר.
  terminology: « Ton frère » et « tu le soutiendras » conviennent. « Étranger résident » rend bien גֵּר dans ce contexte juridique et social ; « résident temporaire » rend convenablement תּוֹשָׁב. La juxtaposition coordonnée des deux catégories est maintenue dans le texte, sans trancher si elles constituent une expression composée ou une indication de statut.
