    issue: Rendu trop littéral et peu naturel de l’idiome « sa main faiblisse »
    rationale: Bien que grammatical après « et que », « que sa main faiblisse auprès de toi » n’est pas une formulation française idiomatique pour une perte de moyens. Le sens économique de l’expression hébraïque doit être rendu clairement dans le texte, sans dépendre entièrement de la note.
