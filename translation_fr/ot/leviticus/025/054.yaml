source:
  edition: WLC
  text: וְ/אִם לֹ֥א יִגָּאֵ֖ל בְּ/אֵ֑לֶּה וְ/יָצָא֙ בִּ/שְׁנַ֣ת הַ/יֹּבֵ֔ל ה֖וּא וּ/בָנָ֥י/ו עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/054.yaml
  text: But if he is not redeemed by these means[a], then he and his sons with him shall go out in the year of Jubilee.
translation:
  language: fr
  text: Mais s’il n’est pas racheté par ces moyens[a], il sortira l’année du jubilé, lui et ses fils avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par celles-ci », en référence aux dispositions de rachat exposées dans les versets précédents.'
    reason: Alternative lexicale et clarification du référent.
lexical_decisions:
- source_word: וְאִם
  choice: Mais s’il
  rationale: Introduit la suite conditionnelle des dispositions précédentes, avec une légère opposition aux possibilités de rachat déjà énoncées.
- source_word: יִגָּאֵל
  choice: est racheté
  rationale: Le nifal de גאל désigne ici le fait d’être libéré par le mécanisme légal du rachat; « racheté » conserve ce sens juridique et théologique.
- source_word: בְּאֵלֶּה
  choice: de l’une de ces manières
  rationale: Le démonstratif renvoie aux modalités de rachat exposées dans les versets précédents. Cette formulation rend le renvoi naturel en français sans en préciser excessivement la portée.
- source_word: וְיָצָא
  choice: il sortira
  rationale: Reproduit l’image juridique hébraïque de la sortie, qui signifie ici la fin de la servitude, plutôt que de la remplacer par une explicitation complète.
- source_word: בִּשְׁנַת הַיֹּבֵל
  choice: l’année du jubilé
  rationale: Formulation française naturelle pour le repère temporel légal, en conservant le terme consacré « jubilé ».
- source_word: הוּא וּבָנָיו עִמּוֹ
  choice: lui et ses fils avec lui
  rationale: Conserve l’insistance du pronom indépendant ainsi que le masculin explicite de בנים et l’idée d’une sortie commune du foyer.
theological_decisions:
- issue: Portée du terme familial בָנָיו
  choice: ses fils
  alternative: ses enfants
  rationale: L’hébreu emploie explicitement le masculin pluriel « fils »; la traduction ne l’élargit donc pas silencieusement à « enfants ».
- issue: Nature de la sortie au jubilé
  choice: il sortira
  alternative: il sera libéré
  rationale: Le sens contextuel est bien la libération de la servitude, mais conserver l’expression concrète de l’hébreu évite de résoudre par paraphrase toute la portée juridique de « sortir ».
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la formulation juridique hébraïque tout en étant idiomatique; « jubilé » est conservé comme terme biblique reconnu.
