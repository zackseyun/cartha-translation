  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּ֤י תָבֹ֨אוּ֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר אֲנִ֖י נֹתֵ֣ן לָ/כֶ֑ם וְ/שָׁבְתָ֣ה הָ/אָ֔רֶץ שַׁבָּ֖ת לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/002.yaml
  text: Speak to the sons of Israel and say to them, ‘When you come into the land that I am giving to you, then the land shall keep a Sabbath to Yahweh.
translation:
  language: fr
  text: 'Parle aux Israélites[a] et dis-leur : « Quand vous entrerez dans le pays que je vous donne, la terre observera un sabbat pour Yahweh[b][c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils d’Israël » ; on peut aussi traduire : « aux enfants d’Israël » ou « aux descendants d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la terre se reposera d’un repos sabbatique pour Yahweh ». L’hébreu personnifie la terre comme observant le sabbat.'
    reason: lexical_alternative
  - marker: c
    text: « Yahweh » transcrit le nom divin YHWH.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Parle
  rationale: L’impératif piel introduit une instruction divine directe. « Parle » conserve la forme et la solennité simples de l’hébreu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aux Israélites
  rationale: Littéralement « aux fils d’Israël ». En français actuel, « aux Israélites » désigne naturellement l’ensemble du peuple sans suggérer que seuls les hommes sont concernés.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: et dis-leur
  rationale: Cette formulation garde la succession des deux verbes de parole caractéristique des instructions légales.
- source_word: כִּי תָבֹאוּ
  choice: Quand vous entrerez
  rationale: כִּי a ici une valeur temporelle, et בוא avec אֶל exprime l’entrée dans le pays. Le futur français convient à cette situation attendue.
- source_word: אֶל הָאָרֶץ
  choice: dans le pays
  rationale: Dans la proposition d’entrée, « le pays » est l’expression française naturelle pour le territoire donné à Israël.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: que je vous donne
  rationale: Le participe נֹתֵן présente le don divin comme actuel ou imminent. Le présent français conserve cette perspective.
- source_word: וְשָׁבְתָה הָאָרֶץ
  choice: la terre observera
  rationale: Le verbe שבת signifie cesser ou se reposer et personnifie ici la terre comme pratiquant le sabbat. « Observera » maintient l’idée d’une observance instituée.
- source_word: שַׁבָּת
  choice: un sabbat
  rationale: Le nom désigne ici un repos sabbatique consacré, non un simple arrêt d’activité.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל marque ici la destination ou la consécration du sabbat à Yahweh. « Pour » est idiomatique en français.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » rend le nom propre de l’alliance sans le remplacer par un titre.
- issue: Nature du repos de la terre
  choice: la terre observera un sabbat
  alternative: la terre se reposera pendant un sabbat
  rationale: La formulation retenue conserve la personnification et le lien lexical entre le verbe שבת et le nom שַׁבָּת, sans réduire le commandement à une simple cessation agricole.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « Parle… et dis-leur » est conservée pour respecter la cadence juridique de l’hébreu. « Pays » désigne naturellement le territoire à l’entrée, tandis que « terre » met en relief le sol soumis au repos sabbatique ; les deux rendent הָאָרֶץ selon leur fonction contextuelle.
