  text: יוֹבֵ֣ל הִ֗וא שְׁנַ֛ת הַ/חֲמִשִּׁ֥ים שָׁנָ֖ה תִּהְיֶ֣ה לָ/כֶ֑ם לֹ֣א תִזְרָ֔עוּ וְ/לֹ֤א תִקְצְרוּ֙ אֶת סְפִיחֶ֔י/הָ וְ/לֹ֥א תִבְצְר֖וּ אֶת נְזִרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/011.yaml
  text: It is a Jubilee[a]; the fiftieth year shall be for you. You shall not sow, and you shall not reap its volunteer growth[c][b], and you shall not gather the grapes of its unpruned vines.
translation:
  language: fr
  text: 'C’est un jubilé : la cinquantième année sera pour vous. Vous ne sèmerez pas, vous ne moissonnerez pas ce qui aura poussé spontanément[b] et vous ne vendangerez pas les raisins des vignes laissées sans taille[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Ou : « ce qui aura poussé de soi-même ».'
    reason: Le terme hébreu désigne une pousse ou une récolte spontanée, produite sans nouvelles semailles.
  - marker: c
    text: 'Ou : « les raisins de ses vignes non taillées ».'
    reason: Le terme hébreu évoque ici des vignes laissées sans entretien ni taille ; la formulation alternative conserve plus directement le suffixe possessif hébreu.
lexical_decisions:
- source_word: יוֹבֵל
  choice: jubilé
  rationale: Dans Lévitique 25, le terme désigne l’année jubilaire instituée, et non la corne de bélier qui sert à la proclamer. « Jubilé » est le terme français établi.
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: cette cinquantième année
  rationale: Formulation française naturelle qui identifie l’année en question comme la cinquantième tout en maintenant son lien avec le jubilé.
- source_word: תִּהְיֶה לָכֶם
  choice: Ce sera pour vous
  rationale: Conserve la valeur prédicative et le datif hébreu sans ajouter l’idée plus forte de propriété.
- source_word: לֹא תִזְרָעוּ
  choice: Vous ne sèmerez pas
  rationale: Le futur français convient au commandement formulé dans ce texte juridique.
- source_word: לֹא תִקְצְרוּ
  choice: vous ne moissonnerez pas
  rationale: Distingue la récolte des céréales de la vendange exprimée dans la proposition suivante.
- source_word: סְפִיחֶיהָ
  choice: ce qui y poussera spontanément
  rationale: Désigne la végétation ou la récolte qui pousse d’elle-même, sans semailles. La tournure est claire en français courant.
- source_word: לֹא תִבְצְרוּ
  choice: vous ne vendangerez pas
  rationale: Le verbe hébreu concerne spécifiquement la récolte des raisins; « vendanger » restitue précisément ce sens.
- source_word: נְזִרֶיהָ
  choice: les raisins des vignes laissées sans taille
  rationale: Dans ce contexte viticole, le terme renvoie à la production de vignes laissées à l’abandon ou non taillées. Le complément « raisins » est rendu explicite en français comme objet naturel de « vendanger ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le futur garde la force juridique des interdictions. « Vendanger » apporte la précision viticole du verbe hébreu, tandis que les notes signalent la syntaxe marquée de l’ouverture et les principales possibilités lexicales.
