source:
  edition: WLC
  text: לֹא תִרְדֶּ֥ה ב֖/וֹ בְּ/פָ֑רֶךְ וְ/יָרֵ֖אתָ מֵ/אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/043.yaml
  text: You shall not rule over him harshly[a], but you shall fear your God.
translation:
  language: fr
  text: Tu ne le domineras pas avec dureté[a], mais tu craindras ton Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec rigueur », « impitoyablement ». L’expression hébraïque évoque l’exercice d’une autorité avec une dureté accablante.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִרְדֶּה בּוֹ
  choice: tu ne le traiteras pas
  rationale: Le verbe רדה exprime l’exercice d’une autorité ou d’une domination. Dans ce contexte juridique, « traiter » associé à « avec dureté » rend naturellement en français la manière d’exercer cette autorité sur l’homme placé en service, sans introduire un vocabulaire politique artificiel.
- source_word: בְּפָרֶךְ
  choice: avec dureté
  rationale: פָרֶךְ désigne une rigueur accablante, voire impitoyable. « Avec dureté » reste proche de la forme prépositionnelle hébraïque et convient au registre juridique du passage.
- source_word: וְיָרֵאתָ
  choice: mais tu craindras
  rationale: La conjonction signifie formellement « et », mais elle introduit ici le comportement qui doit s’opposer au traitement sévère interdit. « Mais » explicite ce contraste naturel en français sans ajouter une idée étrangère.
- source_word: מֵאֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Après ירא, la préposition מִן introduit idiomatiquement l’objet de la crainte. Le français dit naturellement « craindre ton Dieu ».
theological_decisions:
- issue: Fonction de la crainte de Dieu dans l’interdiction
  choice: « mais tu craindras ton Dieu » présente la révérence envers Dieu comme ce qui limite l’exercice de l’autorité sur autrui.
  alternative: « et tu craindras ton Dieu », coordination plus formelle.
  rationale: 'Le choix contrastif préserve la logique éthique du texte : l’autorité humaine ne doit pas devenir oppressive, parce que celui qui l’exerce demeure lui-même responsable devant Dieu.'
translation_notes:
  register: Français moderne, digne et direct. Le futur à valeur injonctive conserve la formulation juridique. « Traiter avec dureté » est plus idiomatique que « dominer avec dureté » tout en maintenant le lien entre autorité et conduite oppressive.
