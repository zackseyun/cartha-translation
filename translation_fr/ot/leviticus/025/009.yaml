  text: וְ/הַֽעֲבַרְתָּ֞ שׁוֹפַ֤ר תְּרוּעָה֙ בַּ/חֹ֣דֶשׁ הַ/שְּׁבִעִ֔י בֶּ/עָשׂ֖וֹר לַ/חֹ֑דֶשׁ בְּ/יוֹם֙ הַ/כִּפֻּרִ֔ים תַּעֲבִ֥ירוּ שׁוֹפָ֖ר בְּ/כָל אַרְצְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/009.yaml
  text: Then you shall sound a trumpet blast in the seventh month[a], on the tenth day of the month[b]. On the Day of Atonement you shall sound the trumpet throughout all your land.
translation:
  language: fr
  text: Tu feras retentir une sonnerie de shofar[a], le septième mois, le dixième jour du mois. Le jour de l’Expiation[b], vous ferez retentir le shofar dans tout votre pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le shofar est un instrument à vent fait d’une corne, traditionnellement souvent compris comme une corne de bélier.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte littéralement « jour des expiations » (au pluriel). Cette fête est couramment appelée en français « le jour de l’Expiation ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: Tu feras retentir
  rationale: Le hiphil de עבר signifie littéralement « faire passer », mais, avec שׁוֹפָר, il désigne idiomatiquement le fait d’en faire circuler le son. « Faire retentir » exprime naturellement cette image en français.
- source_word: שׁוֹפַר תְּרוּעָה
  choice: le son du shofar
  rationale: שׁוֹפָר désigne une trompe faite d’une corne, tandis que תְּרוּעָה désigne ici son signal sonore éclatant. La formulation française évite de confondre l’instrument avec une trompette métallique et reste accessible grâce à la note.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: le septième mois
  rationale: Rendu temporel direct et idiomatique de la préposition ב avec le groupe nominal.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: le dixième jour du mois
  rationale: L’expression signifie littéralement « au dixième du mois » ; l’ajout de « jour » explicite naturellement l’idiome sans en modifier le sens.
- source_word: בְּיוֹם הַכִּפֻּרִים
  choice: Le jour des Expiations
  rationale: Cette désignation française conserve le pluriel morphologique de הַכִּפֻּרִים tout en nommant clairement la fête cultuelle.
- source_word: תַּעֲבִירוּ שׁוֹפָר
  choice: vous ferez retentir le shofar
  rationale: La même expression idiomatique est reprise, tout en respectant le passage du singulier « tu » au pluriel « vous » présent dans l’hébreu.
- source_word: בְּכָל אַרְצְכֶם
  choice: dans tout votre pays
  rationale: Cette expression rend l’étendue exhaustive du signal sur l’ensemble du territoire concerné.
theological_decisions:
- issue: Désignation de יוֹם הַכִּפֻּרִים
  choice: le jour des Expiations
  alternative: le jour de l’Expiation
  rationale: Le pluriel « Expiations » reflète plus directement la forme hébraïque sans imposer une interprétation théologique de ce pluriel. Une note indique l’appellation française également courante au singulier.
translation_notes:
  register: Français international moderne, clair et digne. La traduction maintient le changement de nombre entre l’ordre initial adressé au singulier (« tu ») et sa reprise au pluriel (« vous »), ainsi que le pluriel hébreu dans le nom de la fête.
