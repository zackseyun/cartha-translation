  yaml_path: translation/ot/leviticus/025/017.yaml
  text: And no man shall oppress his neighbor[a], but you shall fear your God, for I am Yahweh your God.
translation:
  language: fr
  text: Qu’aucun homme ne fasse aucun tort[a] à son prochain ; tu craindras ton Dieu, car je suis Yahvé, votre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne le lèse pas », « ne l’exploite pas » ou « ne l’opprime pas ». Le verbe hébreu peut désigner le fait de léser quelqu’un ou de tirer injustement avantage de lui, notamment dans les relations sociales ou économiques.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹנוּ
  choice: fasse de tort
  rationale: Dans ce contexte juridique et économique, le hifil de ינה désigne le fait de léser quelqu’un ou de tirer injustement avantage de lui. « Faire du tort » conserve la portée générale du verbe, tandis que la note signale les nuances plus fortes possibles.
- source_word: אִישׁ
  choice: aucun homme
  rationale: 'Le masculin singulier a ici une valeur distributive : chaque homme au sein de la communauté est visé. La tournure « qu’aucun homme » reproduit naturellement cette force.'
- source_word: עֲמִיתוֹ
  choice: son prochain
  rationale: עָמִית désigne un pair ou un autre membre de la communauté. « Son prochain » exprime clairement la relation sociale et éthique sans la réduire à la proximité géographique.
- source_word: וְיָרֵאתָ
  choice: Tu craindras
  rationale: Le texte passe à la deuxième personne du singulier. Le français conserve ce changement d’adresse et rend la crainte révérencielle due à Dieu.
- source_word: מֵאֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Après ירא, la préposition מן introduit idiomatiquement l’objet de la crainte; en français, on dit simplement « craindre ton Dieu ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin YHWH et le rend comme un nom propre plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Le suffixe pluriel final s’adresse à l’ensemble de la communauté. « Votre Dieu » préserve le contraste avec le singulier « ton Dieu » qui précède.
- source_word: כִּי
  choice: car
  rationale: '« Car » rend sobrement la valeur causale de כִּי : l’identité de Yahvé fonde le commandement.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. La traduction française « Yahvé » préserve le nom personnel au lieu de le remplacer par un titre.
- issue: Masculin distributif de אִישׁ
  choice: aucun homme
  alternative: personne
  rationale: La formulation retenue conserve le masculin explicite du texte tout en exprimant sa portée distributive dans la communauté.
- issue: Alternance entre l’adresse au singulier et au pluriel
  choice: « ton Dieu » puis « votre Dieu »
  alternative: 'uniformiser au pluriel : « votre Dieu » dans les deux cas'
  rationale: L’hébreu passe réellement du singulier dans וְיָרֵאתָ מֵאֱלֹהֶיךָ au pluriel dans אֱלֹהֵיכֶם. La traduction garde cette alternance sans l’expliquer ni la lisser.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe juridique reste claire pour un lectorat général. L’alternance hébraïque entre le singulier et le pluriel est volontairement conservée.
