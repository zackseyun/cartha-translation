  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה בְּ/הַ֥ר סִינַ֖י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/001.yaml
  text: And Yahweh spoke to Moses on Mount Sinai[a], saying,
translation:
  language: fr
  text: 'Yahvé parla à Moïse au mont Sinaï en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר désigne l’acte de parler; le passé simple convient au registre narratif français et l’enchaînement hébreu n’exige pas de rendre ו par « et ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française courante « Yahvé » représente directement le nom divin יהוה plutôt que de lui substituer un titre.
- source_word: אֶל־מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל introduit ici le destinataire de la parole; « à Moïse » est l’équivalent français naturel.
- source_word: בְּהַר סִינַי
  choice: sur le mont Sinaï
  rationale: La préposition ב est locative; « sur le mont Sinaï » exprime naturellement le lieu en français.
- source_word: לֵאמֹר
  choice: 'Il dit :'
  rationale: L’infinitif לֵאמֹר introduit les paroles qui suivent. Une nouvelle proposition avec deux-points est plus naturelle en français que le calque « en disant ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le tétragramme, un nom propre. « Yahvé » en conserve la fonction et constitue sa forme française moderne usuelle, sans remplacer le nom par un titre.
translation_notes:
  register: 'Français moderne, digne et accessible. Le passé simple maintient le ton narratif biblique sans lourdeur; la segmentation « Il dit : » introduit clairement le discours du verset suivant.'
