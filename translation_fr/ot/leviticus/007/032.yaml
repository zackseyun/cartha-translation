id: LEV.7.32
reference: Leviticus 7:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֵת֙ שׁ֣וֹק הַ/יָּמִ֔ין תִּתְּנ֥וּ תְרוּמָ֖ה לַ/כֹּהֵ֑ן מִ/זִּבְחֵ֖י שַׁלְמֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/032.yaml
  text: And you shall give the right thigh as a contribution to the priest from your sacrifices of peace offerings[a][b][c].
translation:
  language: fr
  text: Vous donnerez au prêtre, comme contribution, la cuisse droite prélevée sur vos sacrifices de communion[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la patte droite ».
    reason: lexical_alternative
  - marker: b
    text: Ou « comme offrande »; traditionnellement, « comme offrande élevée ».
    reason: lexical_alternative
  - marker: c
    text: Ou « sacrifices de paix » ou « sacrifices de bien-être ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹק
  choice: cuisse
  rationale: Le terme désigne ici la partie supérieure de la patte de l’animal; « cuisse » est précis et naturel dans ce contexte sacrificiel.
- source_word: הַיָּמִין
  choice: droite
  rationale: Le texte précise explicitement le côté droit de la portion réservée.
- source_word: תִּתְּנוּ
  choice: vous donnerez
  rationale: Le futur français exprime naturellement la valeur prescriptive de l’imparfait hébreu dans une instruction légale.
- source_word: תְרוּמָה
  choice: comme contribution
  rationale: Le nom désigne une portion mise à part et remise au prêtre; « contribution » reste compréhensible sans introduire l’expression traditionnelle mais obscure « offrande élevée ».
- source_word: לַכֹּהֵן
  choice: au prêtre
  rationale: Rend directement le destinataire au singulier.
- source_word: מִזִּבְחֵי
  choice: prélevée sur vos sacrifices
  rationale: La préposition מִן marque la provenance de la portion; « prélevée sur » explicite naturellement ce rapport en français.
- source_word: שַׁלְמֵיכֶם
  choice: sacrifices de communion
  rationale: « Communion » rend la dimension relationnelle des שְׁלָמִים et constitue une appellation française intelligible; les autres nuances possibles sont conservées en note.
- source_word: וְאֵת
  choice: Vous
  rationale: Le waw relie cette prescription au contexte précédent, mais son rendu explicite par « et » n’est pas nécessaire en français; le marqueur d’objet direct n’a pas d’équivalent.
theological_decisions:
- issue: Sens de שְׁלָמִים
  choice: sacrifices de communion
  alternative: sacrifices de paix; sacrifices de bien-être
  rationale: Le terme hébreu possède un champ sémantique large lié à la paix, à l’intégrité et à la communion. Le texte principal retient une désignation française naturelle, tandis que la note préserve les autres lectures légitimes.
translation_notes:
  register: Français international moderne, sobre et prescriptif. La formulation conserve la précision anatomique et rituelle tout en évitant un vocabulaire archaïque dans le texte principal; les variantes traditionnelles et sémantiques figurent en notes.
