  variant: modern international French
source:
  edition: WLC
  text: זֹ֣את מִשְׁחַ֤ת אַהֲרֹן֙ וּ/מִשְׁחַ֣ת בָּנָ֔י/ו מֵ/אִשֵּׁ֖י יְהוָ֑ה בְּ/יוֹם֙ הִקְרִ֣יב אֹתָ֔/ם לְ/כַהֵ֖ן לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/035.yaml
  text: This is the anointed portion of Aaron and the anointed portion of his sons from the food offerings of Yahweh[b][a], on the day when he presented them to serve as priests to Yahweh.
translation:
  language: fr
  text: Voici la part d’Aaron et la part de ses fils[a], provenant des offrandes offertes par le feu à Yahweh[b], le jour où il les présenta afin qu’ils exercent la fonction sacerdotale au service de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « part d’onction ». Le terme hébreu est apparenté au mot « onction » et désigne ici vraisemblablement la part sacerdotale attribuée lors de la consécration.
    reason: lexical_alternative
  - marker: b
    text: 'Traditionnellement : « offrandes faites par le feu à Yahweh ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁחַת
  choice: part attribuée
  rationale: Dans ce contexte de parts sacerdotales, le terme désigne vraisemblablement la part accordée à Aaron et à ses fils lors de leur consécration. « Part attribuée » exprime cette idée sans réduire le mot au seul rite de l’onction; une note conserve le lien lexical avec l’onction.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: sur les offrandes consumées de Yahweh
  rationale: אִשֶּׁה désigne une offrande destinée au feu de l’autel. « Offrandes consumées » est idiomatique et évite l’expression ambiguë « offrandes de feu ». La préposition מִן exprime ici la provenance de la part prélevée sur ces offrandes.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: בְּיוֹם
  choice: depuis le jour où
  rationale: Dans le contexte de l’attribution durable décrite au verset suivant, la locution peut marquer le point de départ temporel. Cette valeur reste proche de la formulation hébraïque.
- source_word: הִקְרִיב אֹתָם
  choice: il les présenta
  rationale: Le hifil de קרב signifie faire approcher ou présenter. Comme le complément désigne Aaron et ses fils, « présenta » évite de suggérer qu’ils furent eux-mêmes offerts en sacrifice.
- source_word: לְכַהֵן לַיהוָה
  choice: pour qu’ils exercent le sacerdoce au service de Yahweh
  rationale: כהן désigne l’exercice de la fonction sacerdotale, et le second ל marque celui au service duquel cette fonction est exercée.
theological_decisions:
- issue: Sens cultuel de מִשְׁחַת
  choice: part attribuée, avec une note signalant le lien possible avec l’onction
  alternative: part d’onction / onction
  rationale: Le contexte immédiat récapitule les parts revenant aux prêtres sur les sacrifices. Le choix principal rend donc l’allocation cultuelle, tandis que la note préserve l’étymologie et l’ambiguïté associées à la consécration par l’onction.
- issue: Valeur temporelle de בְּיוֹם
  choice: depuis le jour où
  alternative: le jour où
  rationale: Le verset suivant parle d’une prescription durable; « depuis » comprend le jour de la présentation comme le commencement de ce droit. La valeur ponctuelle « le jour où » demeure possible, mais elle s’intègre moins naturellement au résumé des parts sacerdotales.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « part attribuée » reproduit celle de l’hébreu. « Exercer le sacerdoce » garde la précision institutionnelle du verbe כהן sans employer une tournure archaïque.
