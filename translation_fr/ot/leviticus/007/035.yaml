  naturalness: Le texte révisé conserve un français moderne et sobre. « Exercer la fonction sacerdotale au service de Yahweh » rend clairement la finalité de l’installation sans suggérer un sacrifice des personnes concernées.
  terminology: « Part » rend le sens contextuel de מִשְׁחַת tout en maintenant, en note, le lien lexical avec l’onction. « Offrandes offertes par le feu » est plus fidèle au terme cultuel que « offrandes consumées ». « Yahweh » est conservé de façon cohérente.
