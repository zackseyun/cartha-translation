  to: Voici la part d’Aaron et la part de ses fils[a], provenant des offrandes offertes par le feu à Yahweh[b], le jour où il les présenta afin qu’ils exercent la fonction sacerdotale au service de Yahweh.
  rationale: La révision corrige la valeur temporelle de בְּיוֹם et rend explicitement la provenance introduite par מִן. Elle remplace « consumées » par une formulation qui reflète le sens cultuel d’אִשֶּׁה sans surinterpréter l’étendue de la combustion. La répétition de « part » suit celle du texte hébreu, tandis que la note conserve l’alternative « part d’onction ».
