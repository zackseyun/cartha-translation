id: LEV.7.9
reference: Leviticus 7:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כָל מִנְחָ֗ה אֲשֶׁ֤ר תֵּֽאָפֶה֙ בַּ/תַּנּ֔וּר וְ/כָל נַעֲשָׂ֥ה בַ/מַּרְחֶ֖שֶׁת וְ/עַֽל מַחֲבַ֑ת לַ/כֹּהֵ֛ן הַ/מַּקְרִ֥יב אֹתָ֖/הּ ל֥/וֹ תִֽהְיֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/009.yaml
  text: And every grain offering that is baked in the oven[a], and everything prepared in a pan or on a griddle, shall belong to the priest who presents it.
translation:
  language: fr
  text: Toute offrande de céréales cuite au four, ainsi que toute offrande préparée dans une poêle ou sur une plaque de cuisson[a], appartiendra au prêtre qui la présente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les deux termes hébreux désignent probablement des ustensiles de cuisson différents, peut-être une poêle profonde et une poêle plate.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: offrande de céréales
  rationale: Dans le contexte sacrificiel du Lévitique, le terme désigne une offrande faite de produits céréaliers plutôt qu’un don quelconque.
- source_word: תֵּאָפֶה בַּתַּנּוּר
  choice: cuite au four
  rationale: Cette formulation française rend naturellement la forme passive du verbe et la cuisson dans un four.
- source_word: נַעֲשָׂה
  choice: préparée
  rationale: Le verbe hébreu est général (« faite »), mais « préparée » convient au contexte alimentaire sans préciser indûment le mode de cuisson.
- source_word: מַרְחֶשֶׁת
  choice: poêle
  rationale: Le mot désigne un ustensile de cuisson, probablement plus profond que celui mentionné ensuite, mais sa forme exacte demeure incertaine.
- source_word: מַחֲבַת
  choice: plaque de cuisson
  rationale: Ce terme semble désigner un ustensile ou une surface de cuisson plus plate; ce choix maintient la distinction probable entre les deux récipients.
- source_word: לַכֹּהֵן … לוֹ תִהְיֶה
  choice: appartiendra au prêtre
  rationale: La construction exprime ici l’attribution légale de l’offrande au prêtre; cette tournure est claire et naturelle en français moderne.
- source_word: הַמַּקְרִיב אֹתָהּ
  choice: qui la présente
  rationale: Dans le cadre sacrificiel, le hifil de קרב signifie présenter ou offrir; « présente » conserve le sens rituel sans lourdeur.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe juridique de l’attribution au prêtre est conservée, tandis que l’incertitude sur la forme précise des deux ustensiles est signalée en note.
