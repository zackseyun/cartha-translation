  variant: modern international French
source:
  edition: WLC
  text: הַ/מַּקְרִ֞יב אֶת דַּ֧ם הַ/שְּׁלָמִ֛ים וְ/אֶת הַ/חֵ֖לֶב מִ/בְּנֵ֣י אַהֲרֹ֑ן ל֧/וֹ תִהְיֶ֛ה שׁ֥וֹק הַ/יָּמִ֖ין לְ/מָנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/033.yaml
  text: The one from among the sons of Aaron who presents the blood of the peace offerings and the fat—to him the right thigh shall belong as his portion.
translation:
  language: fr
  text: Celui des fils d’Aaron qui présente le sang des sacrifices de paix[a] et la graisse recevra la cuisse droite comme sa part.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifices de communion ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּקְרִיב
  choice: qui présente
  rationale: Le participe hiphil de קרב désigne ici celui qui apporte ou présente rituellement l’offrande. « Présente » est naturel en français et conserve la valeur cultuelle sans suggérer que le prêtre immole nécessairement lui-même la victime.
- source_word: דַּם
  choice: le sang
  rationale: Traduction directe et usuelle dans les prescriptions sacrificielles.
- source_word: הַשְּׁלָמִים
  choice: les sacrifices de paix
  rationale: Cette expression conserve le lien lexical traditionnel avec la paix et l’intégrité. « Sacrifices de communion » demeure une autre traduction possible, signalée en note.
- source_word: הַחֵלֶב
  choice: la graisse
  rationale: Traduction littérale appropriée au contexte, où sont visées les parties grasses réservées par les prescriptions sacrificielles.
- source_word: מִבְּנֵי אַהֲרֹן
  choice: celui des fils d’Aaron
  rationale: Cette tournure française naturelle exprime la sélection d’un membre parmi les fils d’Aaron tout en conservant l’expression familiale et masculine du texte hébreu.
- source_word: לוֹ תִהְיֶה
  choice: recevra
  rationale: Dans ce contexte juridique de répartition, le français « recevra » exprime naturellement l’attribution à ce prêtre. L’idée d’appartenance est complétée par « comme sa part ».
- source_word: שׁוֹק הַיָּמִין
  choice: la cuisse droite
  rationale: שׁוֹק désigne ici la partie de la patte attribuée au prêtre; « cuisse » est précis et conforme à l’usage sacrificiel.
- source_word: לְמָנָה
  choice: comme sa part
  rationale: Le nom מָנָה désigne une part assignée. Cette formulation rend clairement l’idée de portion attribuée.
theological_decisions:
- issue: Traduction de בְּנֵי אַהֲרֹן dans la législation sacerdotale
  choice: les fils d’Aaron
  alternative: les descendants d’Aaron
  rationale: L’hébreu emploie une expression masculine et familiale concrète pour les prêtres concernés. La traduction la conserve sans la généraliser en « famille » ni expliciter « descendants », même si la fonction sacerdotale se transmet dans la lignée.
- issue: Sens de הַשְּׁלָמִים
  choice: sacrifices de paix
  alternative: sacrifices de communion
  rationale: Le terme peut être compris à partir de la paix, de l’intégrité ou de la communion créée par le repas sacrificiel. Le texte principal maintient la correspondance lexicale traditionnelle, tandis que la note préserve l’autre interprétation courante.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase suit l’ordre logique du français plutôt que de reproduire la dislocation hébraïque; le vocabulaire sacrificiel reste concret et accessible.
