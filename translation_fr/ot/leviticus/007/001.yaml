id: LEV.7.1
reference: Leviticus 7:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת הָ/אָשָׁ֑ם קֹ֥דֶשׁ קָֽדָשִׁ֖ים הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/001.yaml
  text: 'This is the law of the guilt offering: it is most holy[a].'
translation:
  language: fr
  text: 'Voici la loi du sacrifice de réparation[a] : c’est une chose très sainte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de culpabilité » ou « sacrifice de compensation ». Le mot hébreu ’asham désigne un sacrifice associé à la culpabilité et à la réparation.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Voici
  rationale: La conjonction suivie du démonstratif introduit ici une nouvelle prescription. « Voici » marque naturellement cette présentation en français, sans ajouter une valeur temporelle absente de l’hébreu.
- source_word: תּוֹרַת
  choice: la loi du
  rationale: Dans ce contexte cultuel, תּוֹרָה désigne la prescription qui régit ce sacrifice. « La loi du » reste proche de la construction hébraïque et s’inscrit dans le vocabulaire du Lévitique.
- source_word: הָאָשָׁם
  choice: sacrifice de réparation
  rationale: אָשָׁם désigne une catégorie sacrificielle liée à la culpabilité, mais aussi à la réparation ou restitution qui l’accompagne. « Sacrifice de réparation » rend clairement sa fonction cultuelle en français moderne, tandis que l’autre nuance est conservée en note.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: une chose très sainte
  rationale: Cette construction superlative classe le sacrifice au degré le plus élevé de sainteté. « Une chose très sainte » est naturel et évite de confondre l’expression avec le lieu appelé le Saint des saints.
- source_word: הוּא
  choice: c’est
  rationale: Le pronom masculin singulier sert ici de copule et renvoie au sacrifice; « c’est » introduit idiomatiquement sa classification cultuelle.
theological_decisions:
- issue: Traduction du terme sacrificiel אָשָׁם
  choice: sacrifice de réparation
  alternative: sacrifice de culpabilité; sacrifice de compensation
  rationale: Le terme associe la culpabilité à une obligation de réparation et nomme un sacrifice lévitique précis. La traduction principale met en relief la réparation sans réduire le rite à une interprétation doctrinale; la note préserve les autres nuances lexicales légitimes.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve le caractère prescriptif du verset et la catégorie cultuelle de sainteté, tout en évitant un calque obscur.
