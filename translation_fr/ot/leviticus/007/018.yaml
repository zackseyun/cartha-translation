source:
  edition: WLC
  text: וְ/אִ֣ם הֵאָכֹ֣ל יֵ֠אָכֵל מִ/בְּשַׂר זֶ֨בַח שְׁלָמָ֜י/ו בַּ/יּ֣וֹם הַ/שְּׁלִישִׁי֮ לֹ֣א יֵרָצֶה֒ הַ/מַּקְרִ֣יב אֹת֗/וֹ לֹ֧א יֵחָשֵׁ֛ב ל֖/וֹ פִּגּ֣וּל יִהְיֶ֑ה וְ/הַ/נֶּ֛פֶשׁ הָ/אֹכֶ֥לֶת מִמֶּ֖/נּוּ עֲוֺנָ֥/הּ תִּשָּֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/018.yaml
  text: But if any of the flesh of his peace offering is eaten on the third day[a], it will not be accepted; it will not be credited to the one who offers it. It will be an abhorrent thing[b], and the person who eats from it will bear his guilt.
translation:
  language: fr
  text: Mais si l’on mange une partie de la viande de son sacrifice de paix[a], le troisième jour, celui-ci ne sera pas agréé et ne sera pas compté en faveur de celui qui l’offre. Ce sera une chose répugnante[b], et la personne qui en mangera portera sa faute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de communion » ou « sacrifice de bien-être ».
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu est un terme sacrificiel technique désignant ce qui est devenu inacceptable et répugnant; on pourrait aussi traduire « viande souillée » ou « chose immonde ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit une condition qui contraste avec la règle précédente.
- source_word: הֵאָכֹל יֵאָכֵל
  choice: si l’on mange
  rationale: La construction intensive hébraïque est rendue par une formulation conditionnelle naturelle en français; le contexte porte suffisamment l’insistance.
- source_word: מִבְּשַׂר
  choice: une partie de la viande
  rationale: Exprime clairement la valeur partitive de la préposition מִן dans un français courant.
- source_word: זֶבַח שְׁלָמָיו
  choice: son sacrifice de paix
  rationale: Conserve l’appellation traditionnelle et le champ sémantique de paix, d’intégrité et de bien-être associé à שְׁלָמִים.
- source_word: לֹא יֵרָצֶה
  choice: ne sera pas agréé
  rationale: Dans le contexte sacrificiel, le nifal de רצה désigne l’acceptation favorable du sacrifice.
- source_word: לֹא יֵחָשֵׁב לוֹ
  choice: ne sera pas compté en faveur de
  rationale: Préserve la nuance de calcul ou d’imputation de חשב avec ל, tout en restant idiomatique.
- source_word: פִּגּוּל
  choice: une chose répugnante
  rationale: Rend la force négative de ce terme sacrificiel rare sans lui attribuer une définition technique plus étroite que ne le permet le contexte.
- source_word: וְהַנֶּפֶשׁ
  choice: et la personne
  rationale: נפש désigne ici l’individu responsable, non une âme séparée du corps.
- source_word: עֲוֺנָהּ תִּשָּׂא
  choice: portera sa faute
  rationale: Reproduit l’image juridique de porter sa faute, laquelle peut inclure la responsabilité des conséquences qui en découlent.
theological_decisions:
- issue: Désignation de זֶבַח שְׁלָמִים
  choice: sacrifice de paix
  alternative: sacrifice de communion; sacrifice de bien-être
  rationale: Le terme désigne une catégorie sacrificielle précise. La formulation retenue reste proche de l’hébreu et de l’usage biblique reçu, tandis que la note conserve les autres nuances possibles.
- issue: Portée de עֲוֺנָהּ תִּשָּׂא
  choice: portera sa faute
  alternative: portera la peine de sa faute
  rationale: La formulation française maintient l’ambiguïté de l’idiome hébreu entre culpabilité et responsabilité pénale, sans la résoudre en faveur d’une seule interprétation.
- issue: Référent générique de נֶפֶשׁ
  choice: la personne… sa faute
  alternative: celui ou celle qui en mangera… sa faute
  rationale: Le nom hébreu vise toute personne concernée. Le français permet ici une formulation générique naturelle sans ajouter une distinction de sexe absente de l’énoncé.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la progression juridique du verset, et les termes techniques sont expliqués sans alourdir le texte principal.
