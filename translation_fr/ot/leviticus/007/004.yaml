  register: Français international moderne, sobre et digne. La syntaxe s’inscrit naturellement dans l’énumération commencée au verset précédent. « Du côté des lombes » allège la répétition littérale de « sur » tout en conservant la localisation anatomique; la note maintient l’incertitude entourant יוֹתֶרֶת.
