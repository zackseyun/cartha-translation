base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: fr
  text: ainsi que les deux reins, la graisse qui est sur eux, qui se trouve sur les lombes, et l’appendice sur le foie[a], qu’il enlèvera avec les reins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le lobe sur le foie » ; le terme hébreu désignant cette partie anatomique est technique, et son référent précis fait débat.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: les deux reins
  rationale: Dans l’anatomie sacrificielle, כְּלָיוֹת désigne clairement les reins; le terme français courant convient sans archaïsme.
- source_word: הַחֵלֶב
  choice: la graisse
  rationale: Dans le contexte sacrificiel du Lévitique, חֵלֶב désigne les parties grasses réservées à l’offrande; « graisse » est clair et naturel.
- source_word: אֲשֶׁר עֲלֵיהֶן
  choice: qui est sur eux
  rationale: Cette formulation rend directement la relation exprimée par עַל sans préciser davantage qu’elle les recouvre.
- source_word: הַכְּסָלִים
  choice: les lombes
  rationale: כְּסָלִים désigne la région anatomique des lombes ou des flancs, près des reins; « lombes » conserve cette précision anatomique.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: l’appendice du foie
  rationale: יוֹתֶרֶת est un terme anatomique technique dont le référent exact demeure discuté; « appendice » reste concret sans imposer une identification trop précise, et « du foie » est naturel en français pour עַל הַכָּבֵד.
- source_word: עַל הַכְּלָיֹת יְסִירֶנָּה
  choice: qu’il enlèvera avec les reins
  rationale: Le verbe hiphil de סור prescrit le retrait de cette partie, tandis que עַל הַכְּלָיֹת exprime ici son retrait conjoint avec les reins.
theological_decisions: []
