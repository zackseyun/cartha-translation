reference: Leviticus 7:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֚י כָּל אֹכֵ֣ל חֵ֔לֶב מִן הַ֨/בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֥יב מִמֶּ֛/נָּה אִשֶּׁ֖ה לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הָ/אֹכֶ֖לֶת מֵֽ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/025.yaml
  text: For anyone who eats fat from an animal from which an offering made by fire is presented to Yahweh[b][a], the person who eats it shall be cut off from his people.
translation:
  language: fr
  text: Car toute personne qui mange de la graisse provenant d’un animal dont on présente une offrande consumée par le feu au SEIGNEUR[a], cette personne sera retranchée du milieu de son peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une offrande alimentaire ». Le terme hébreu désigne une offrande livrée au feu sur l’autel.
    reason: lexical_alternative
  - marker: b
    text: '« Sera retranchée » conserve la formule juridique hébraïque. La nature exacte de la sanction est débattue: elle peut évoquer l’exclusion, la mort ou un jugement divin.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit le motif de l’interdiction précédente; « Car » conserve clairement ce lien logique.
- source_word: כָּל אֹכֵל
  choice: toute personne qui mange
  rationale: Cette formulation française naturelle garde la portée universelle et indéfinie de l’expression hébraïque.
- source_word: חֵלֶב
  choice: graisse
  rationale: Le terme désigne ici la graisse animale, notamment les parties grasses réservées dans le cadre sacrificiel.
- source_word: מִן הַבְּהֵמָה
  choice: provenant d’un animal
  rationale: בְּהֵמָה désigne un animal domestique susceptible d’être offert; « animal » est clair sans ajouter une précision absente du verset.
- source_word: אֲשֶׁר יַקְרִיב מִמֶּנָּה
  choice: dont on présente
  rationale: Le verbe hébreu est actif avec un sujet singulier indéfini. Le pronom « on » rend naturellement cette valeur en français et maintient le lien avec l’animal.
- source_word: אִשֶּׁה
  choice: une offrande consumée par le feu
  rationale: Cette expression rend le terme sacrificiel en indiquant son rapport au feu de l’autel, sans le limiter silencieusement à une offrande alimentaire.
- source_word: לַיהוָה
  choice: au SEIGNEUR
  rationale: La forme en petites capitales représente conventionnellement le nom divin יהוה en français biblique tout en le distinguant du titre ordinaire « Seigneur ».
- source_word: וְנִכְרְתָה
  choice: sera retranchée
  rationale: « Retrancher » conserve la formule juridique et covenantale hébraïque sans décider si la sanction désigne l’exclusion, la mort ou un jugement divin.
- source_word: הַנֶּפֶשׁ הָאֹכֶלֶת
  choice: cette personne
  rationale: Dans ce contexte juridique, נֶפֶשׁ désigne l’individu. La reprise démonstrative est idiomatique en français et met en relief le sujet de la sanction.
- source_word: מֵעַמֶּיהָ
  choice: du milieu de son peuple
  rationale: Le suffixe féminin s’accorde grammaticalement avec נֶפֶשׁ, mais la personne visée est générique. « Son peuple » conserve le singulier sans attribuer un sexe à l’auteur de l’acte.
theological_decisions:
- issue: Sens de la formule de sanction וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: sera retranchée du milieu de son peuple
  alternative: sera exclue de son peuple; sera mise à mort
  rationale: 'Le mécanisme exact de cette sanction est débattu: elle peut évoquer l’exclusion communautaire, une mort prématurée ou un jugement divin. La traduction préserve l’image juridique de l’hébreu plutôt que de trancher la question.'
- issue: Genre de la personne visée par la loi
  choice: toute personne ... son peuple
  alternative: tout homme ... son peuple; cette personne ... son propre peuple
  rationale: Le féminin grammatical du suffixe dépend de נֶפֶשׁ et ne précise pas que l’auteur de l’acte est une femme. La formulation choisie demeure générique tout en gardant le singulier du texte.
- issue: Représentation du nom divin יהוה
  choice: le SEIGNEUR
  alternative: YHWH; Yahvé
  rationale: « le SEIGNEUR » suit la convention française largement intelligible qui signale le tétragramme par la typographie, sans imposer une vocalisation reconstruite.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe juridique demeure solennelle sans être archaïque. La répétition de « personne » reflète l’insistance de l’hébreu, et les notes préservent les ambiguïtés lexicale et pénale.
