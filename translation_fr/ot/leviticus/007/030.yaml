source:
  edition: WLC
  text: יָדָ֣י/ו תְּבִיאֶ֔ינָה אֵ֖ת אִשֵּׁ֣י יְהוָ֑ה אֶת הַ/חֵ֤לֶב עַל הֶֽ/חָזֶה֙ יְבִיאֶ֔/נּוּ אֵ֣ת הֶ/חָזֶ֗ה לְ/הָנִ֥יף אֹת֛/וֹ תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/030.yaml
  text: 'His own hands shall bring the food offerings of the LORD: he shall bring the fat with the breast, to wave the breast as a wave offering before the LORD.'
translation:
  language: fr
  text: Ses propres mains apporteront les offrandes consumées par le feu pour le SEIGNEUR ; il apportera la graisse sur la poitrine, afin d’offrir la poitrine par le rite de l’offrande balancée devant le SEIGNEUR.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדָיו
  choice: de ses propres mains
  rationale: La tournure souligne que l’offrant doit apporter personnellement les éléments du sacrifice.
- source_word: אִשֵּׁי יְהוָה
  choice: les offrandes consumées par le feu pour le SEIGNEUR
  rationale: אִשֶּׁה désigne ici les offrandes destinées au feu sacrificiel; «pour le SEIGNEUR» rend le complément divin sans suggérer qu’elles lui servent de nourriture.
- source_word: הַחֵלֶב עַל־הֶחָזֶה
  choice: la graisse avec la poitrine
  rationale: La préposition עַל peut exprimer la position ou l’association; dans cette instruction rituelle, «avec» donne naturellement le fait d’apporter ensemble la graisse et la poitrine.
- source_word: לְהָנִיף ... תְּנוּפָה
  choice: afin de présenter ... par le geste d’élévation
  rationale: La racine נוף et le nom apparenté décrivent un geste rituel de présentation, traditionnellement compris comme un mouvement devant le sanctuaire; cette formulation évite le peu naturel «agiter en offrande agitée».
- source_word: לִפְנֵי יְהוָה
  choice: devant le SEIGNEUR
  rationale: Équivalent direct et idiomatique de l’expression cultuelle hébraïque.
theological_decisions:
- issue: Nature des אִשֵּׁי יְהוָה
  choice: offrandes consumées par le feu pour le SEIGNEUR
  alternative: mets offerts au SEIGNEUR
  rationale: Le choix conserve le lien explicite avec le feu sacrificiel tout en évitant de présenter Dieu comme dépendant d’une nourriture matérielle.
- issue: Sens précis du rite de תְּנוּפָה
  choice: présenter ... par le geste d’élévation
  alternative: faire le geste de présentation / balancer comme offrande balancée
  rationale: Le mouvement exact n’est pas décrit dans le verset. La traduction nomme donc le rite sans en imposer une reconstruction trop précise.
translation_notes:
  register: Français moderne, international et digne. La phrase garde la répétition structurante de «il apportera» et le vocabulaire cultuel, tout en évitant des calques obscurs.
