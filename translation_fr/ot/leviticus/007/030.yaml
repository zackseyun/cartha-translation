revisions:
- from: 'Il apportera de ses propres mains les offrandes consumées par le feu pour le SEIGNEUR : il apportera la graisse avec la poitrine, afin de présenter la poitrine devant le SEIGNEUR par le geste d’élévation.'
  to: Ses propres mains apporteront les offrandes consumées par le feu pour le SEIGNEUR ; il apportera la graisse sur la poitrine, afin d’offrir la poitrine par le rite de l’offrande balancée devant le SEIGNEUR.
  rationale: La révision rétablit « sur la poitrine » pour la relation exprimée par עַל et remplace le « geste d’élévation », inexact pour תְּנוּפָה, par une désignation cultuelle qui conserve l’idée de balancement tout en ne prétendant pas reconstruire précisément le mouvement rituel.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:23:16Z'
review_pass:
  verdict: revise
  source_fidelity: 'La traduction doit conserver la relation spatiale de עַל (« sur la poitrine »), plutôt que l’association vague « avec ». Elle doit aussi distinguer le rite de תְּנוּפָה d’un simple « geste d’élévation » : le texte évoque un rite de balancement/présentation, sans en définir la gestuelle exacte.'
  naturalness: La formulation révisée reste claire et digne en français moderne. « Ses propres mains apporteront » rend l’insistance de l’hébreu; « rite de l’offrande balancée » est un terme cultuel explicatif et plus exact que « geste d’élévation ».
  terminology: « Offrandes consumées par le feu pour le SEIGNEUR » rend אִשֵּׁי יהוה sans reprendre l’interprétation anglaise « food offerings ». « Poitrine » rend correctement חָזֶה dans ce contexte sacrificiel. Le SEIGNEUR est conservé pour le tétragramme.
  issues:
  - severity: medium
    issue: « avec la poitrine » affaiblit עַל־הֶחָזֶה.
    rationale: La préposition עַל indique ici que la graisse est apportée sur la poitrine; cette précision rituelle ne devrait pas être neutralisée en simple accompagnement.
  - severity: high
    issue: « par le geste d’élévation » ne rend pas adéquatement תְּנוּפָה.
    rationale: Le terme désigne le rite généralement caractérisé par un balancement ou une présentation. « Élévation » risque de confondre ce rite avec une offrande élevée et impose un geste différent.
  revised_text: Ses propres mains apporteront les offrandes consumées par le feu pour le SEIGNEUR ; il apportera la graisse sur la poitrine, afin d’offrir la poitrine par le rite de l’offrande balancée devant le SEIGNEUR.
  revised_footnotes: []
