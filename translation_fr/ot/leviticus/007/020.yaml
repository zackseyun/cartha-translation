id: LEV.7.20
reference: Leviticus 7:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הַ/נֶּ֜פֶשׁ אֲשֶׁר תֹּאכַ֣ל בָּשָׂ֗ר מִ/זֶּ֤בַח הַ/שְּׁלָמִים֙ אֲשֶׁ֣ר לַ/יהוָ֔ה וְ/טֻמְאָת֖/וֹ עָלָ֑י/ו וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/020.yaml
  text: But the person who eats meat from the sacrifice of peace offerings that belongs to Yahweh while his uncleanness is on him—that person shall be cut off from his people[a].
translation:
  language: fr
  text: Mais si une personne mange de la viande du sacrifice de communion qui appartient à l’Éternel alors qu’elle est en état d’impureté, cette personne sera retranchée de son peuple[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sera exclue de son peuple ». L’expression « sera retranchée » peut désigner une exclusion ou la mort, mais l’hébreu ne précise pas ici comment la sanction s’accomplit.
    reason: Préserver l’ambiguïté juridique et théologique de la formule hébraïque.
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: une personne
  rationale: Dans ce texte juridique, נֶפֶשׁ désigne l’individu tout entier, et non une âme immatérielle. « Une personne » est naturel et inclusif en français moderne.
- source_word: תֹּאכַל
  choice: mange
  rationale: L’imparfait hébreu énonce ici un cas général de droit casuistique; le présent français après « si » en rend naturellement la portée.
- source_word: בָּשָׂר
  choice: de la viande
  rationale: Dans le contexte de la consommation d’un sacrifice, « viande » exprime clairement le sens concret de בָּשָׂר.
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: du sacrifice de communion
  rationale: שְׁלָמִים désigne une catégorie sacrificielle associée à la communion et au repas partagé. « Sacrifice de communion » est compréhensible et évite de réduire le terme à une simple idée de paix.
- source_word: אֲשֶׁר לַיהוָה
  choice: qui appartient à l’Éternel
  rationale: La formulation marque l’appartenance sacrée du sacrifice à YHWH. « Appartient à » rend explicitement cette relation sans ajouter d’interprétation.
- source_word: טֻמְאָתוֹ עָלָיו
  choice: alors qu’elle est en état d’impureté
  rationale: L’expression hébraïque dit littéralement que son impureté est sur lui. Cette formulation française en transmet clairement la condition rituelle sans suggérer une faute morale générale.
- source_word: וְנִכְרְתָה
  choice: sera retranchée
  rationale: Le passif de כרת est une formule juridique grave. « Sera retranchée » en préserve l’image et l’indétermination quant au moyen précis de la sanction.
- source_word: מֵעַמֶּיהָ
  choice: de son peuple
  rationale: Le suffixe féminin s’accorde grammaticalement avec נֶפֶשׁ. « Son peuple » reste neutre quant au sexe de la personne et rend la relation communautaire.
theological_decisions:
- issue: Portée de la formule וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: sera retranchée de son peuple
  alternative: sera exclue de son peuple; mourra ou sera mise à mort
  rationale: L’hébreu affirme une suppression grave du milieu communautaire, mais ne précise pas ici s’il s’agit d’exclusion, de mort humaine ou d’un jugement divin. La traduction conserve donc cette ambiguïté et la note présente les principales possibilités sans en imposer une.
- issue: Nature de l’impureté
  choice: en état d’impureté
  alternative: avec son impureté sur elle
  rationale: Dans ce contexte lévitique, טֻמְאָה relève de l’impureté rituelle. La formulation choisie évite de transformer implicitement cette catégorie cultuelle en jugement moral.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure inclusive « une personne… elle » suit le genre grammatical de « personne ». « Éternel » représente le nom divin YHWH selon l’usage biblique français courant; « sacrifice de communion » maintient un terme cultuel intelligible.
