id: LEV.7.27
reference: Leviticus 7:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כָּל נֶ֖פֶשׁ אֲשֶׁר תֹּאכַ֣ל כָּל דָּ֑ם וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵֽ/עַמֶּֽי/הָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/027.yaml
  text: Every person who eats any blood—that person shall be cut off from his people[a][b].
translation:
  language: fr
  text: Toute personne[a] qui mange du sang, quel qu’il soit, sera retranchée de son peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « âme ». Ici, le mot hébreu néfèsh désigne la personne elle-même.
    reason: lexical_alternative
  - marker: b
    text: L’expression « sera retranchée » est une formule habituelle de sanction liée à l’alliance. Elle peut évoquer l’exclusion de la communauté ou un jugement divin, sans que l’hébreu précise ici de quelle manière elle s’accomplit.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: personne
  rationale: Dans ce contexte juridique, נֶפֶשׁ désigne l’individu tout entier, et non spécialement une « âme » distincte du corps. « Personne » est naturel et précis en français moderne.
- source_word: תֹּאכַל
  choice: mange
  rationale: L’inaccompli dans la proposition relative exprime ici un cas général. Le présent français rend naturellement la portée générale de la règle.
- source_word: כָּל דָּם
  choice: du sang, quel qu’il soit
  rationale: 'Avec le nom non comptable דָּם, כָּל a une valeur distributive : il s’agit de sang de quelque sorte que ce soit, plutôt que de la totalité du sang.'
- source_word: וְנִכְרְתָה
  choice: sera retranchée
  rationale: Le passif « sera retranchée » conserve la formule juridique et d’alliance associée au niphal de כרת, sans préciser indûment la manière dont la sanction s’accomplit.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: sera retranchée
  rationale: La reprise hébraïque, littéralement « cette personne », souligne l’identité du contrevenant. En français, le sujet déjà exprimé demeure clair sans une répétition lourde, tandis que la sanction reste emphatique.
- source_word: מֵעַמֶּיהָ
  choice: de son peuple
  rationale: Le suffixe féminin s’accorde grammaticalement avec נֶפֶשׁ et ne limite pas la règle aux femmes. « Son peuple » désigne naturellement la communauté à laquelle appartient la personne.
theological_decisions:
- issue: Sens de la sanction d’alliance exprimée par כרת au niphal
  choice: Conserver la formule « sera retranchée » sans en préciser le mode.
  alternative: « sera mise à mort », « sera exclue de la communauté » ou « sera détruite par Dieu »
  rationale: La formule hébraïque est concise et peut évoquer l’exclusion de la communauté ou un jugement divin. Le verset ne précise pas ici comment la sanction est exécutée; la traduction préserve donc cette ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. Le présent « mange » exprime une règle générale; le futur passif « sera retranchée » conserve la force juridique de la sanction. La tournure « du sang, quel qu’il soit » rend explicitement la valeur distributive de כָּל tout en restant naturelle.
