id: LEV.7.16
reference: Leviticus 7:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם נֶ֣דֶר א֣וֹ נְדָבָ֗ה זֶ֚בַח קָרְבָּנ֔/וֹ בְּ/י֛וֹם הַקְרִיב֥/וֹ אֶת זִבְח֖/וֹ יֵאָכֵ֑ל וּ/מִֽ/מָּחֳרָ֔ת וְ/הַ/נּוֹתָ֥ר מִמֶּ֖/נּוּ יֵאָכֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/016.yaml
  text: But if the sacrifice of his offering is a vow or a freewill offering[a], it shall be eaten on the day he presents his sacrifice, and on the next day what remains of it may be eaten.
translation:
  language: fr
  text: Mais si le sacrifice qu’il présente est une offrande liée à un vœu[a] ou une offrande volontaire, il sera mangé le jour où il offrira son sacrifice. Le lendemain, ce qui en restera pourra encore être mangé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une offrande votive ». L’hébreu distingue ici le sacrifice lié à un vœu de l’offrande faite volontairement.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶדֶר
  choice: une offrande liée à un vœu
  rationale: Dans ce contexte sacrificiel, le terme désigne un sacrifice motivé par un vœu ou offert pour l’accomplir. Cette formulation explicite le lien sans confondre le vœu lui-même avec l’offrande.
- source_word: נְדָבָה
  choice: une offrande volontaire
  rationale: Le terme désigne une offrande faite librement, par opposition à celle qui est liée à un vœu. « Offrande volontaire » est clair et naturel en français contemporain.
- source_word: זֶבַח קָרְבָּנוֹ
  choice: le sacrifice qu’il présente
  rationale: La formulation rend à la fois l’idée de sacrifice (זֶבַח) et celle d’une offrande apportée ou présentée (קָרְבָּן), sans produire le tour lourd « le sacrifice de son offrande ».
- source_word: בְּיוֹם הַקְרִיבוֹ
  choice: le jour où il offrira
  rationale: Le hifil de קרב désigne ici l’action de présenter une offrande à Dieu. « Offrir » est le verbe cultuel le plus naturel dans cette proposition.
- source_word: יֵאָכֵל
  choice: il sera mangé / pourra encore être mangé
  rationale: La même forme passive apparaît deux fois. La première traduction conserve le ton prescriptif; la seconde exprime la permission de consommer les restes le lendemain, force impliquée par le contexte légal.
- source_word: וּמִמָּחֳרָת
  choice: Le lendemain
  rationale: Cette expression désigne le jour suivant. Le français détache naturellement cette indication temporelle en tête de phrase.
- source_word: וְהַנּוֹתָר מִמֶּנּוּ
  choice: ce qui en restera
  rationale: Le participe désigne ce qui reste du sacrifice après le premier jour. La formulation est précise et idiomatique.
theological_decisions:
- issue: Distinction entre le sacrifice lié à un vœu et l’offrande volontaire
  choice: Maintenir deux catégories distinctes
  alternative: Comprendre les deux expressions comme deux désignations équivalentes d’une offrande facultative
  rationale: La conjonction אוֹ et les deux termes hébreux présentent deux motivations ou catégories différentes; la traduction ne les fusionne donc pas.
translation_notes:
  register: Français moderne, clair et digne, avec un vocabulaire cultuel accessible. La structure hébraïque est légèrement réorganisée pour éviter une tournure artificielle, tout en conservant les notions de sacrifice, d’offrande présentée, de vœu et de don volontaire.
