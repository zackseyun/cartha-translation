review_pass:
  verdict: revise
  source_fidelity: La clause temporelle hébraïque signifie explicitement « le jour où il les oignit ». Le brouillon « il leur donna l’onction » affaiblit et reformule indûment le verbe précis משח (« oindre »). La relation selon laquelle les parts sont données aux prêtres à partir des Israélites est conservée plus clairement par une tournure passive.
  naturalness: « C’est ce que » assure un lien français naturel avec les parts mentionnées au contexte précédent. « Que cela leur soit donné par les Israélites » est clair, idiomatique et évite l’ambiguïté de « ordonna aux Israélites de leur donner ». « Les oignit » est un terme rituel exact et recevable dans un registre biblique moderne.
  terminology: « Yahweh », « oignit », « prescription perpétuelle » et « générations » rendent avec justesse le nom divin, le rite d’onction et la formule juridique durable. La note sur « Israélites » conserve l’alternative littérale sans surcharger le texte.
  issues:
  - severity: medium
    issue: « il leur donna l’onction » ne rend pas exactement le verbe hébreu « il les oignit ».
    rationale: Le texte décrit l’action d’oindre les prêtres, non l’attribution abstraite d’une onction.
  - severity: low
    issue: La formulation « ordonna aux Israélites de leur donner » peut momentanément laisser moins explicite l’antécédent des biens donnés.
    rationale: Une tournure passive avec « cela » reprend clairement les parts sacerdotales du contexte tout en préservant le sens.
  - severity: low
    issue: La note b développe une interprétation temporelle au-delà de la simple alternative lexicale.
    rationale: Une note brève proposant « permanente » suffit et évite de présenter « à durée indéfinie » comme une glose nécessaire.
  revised_text: 'C’est ce que Yahweh ordonna que cela leur soit donné par les Israélites[a], le jour où il les oignit : une prescription perpétuelle[b] pour toutes leurs générations.'
