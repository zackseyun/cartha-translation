source:
  edition: WLC
  text: אֲשֶׁר֩ צִוָּ֨ה יְהוָ֜ה לָ/תֵ֣ת לָ/הֶ֗ם בְּ/יוֹם֙ מָשְׁח֣/וֹ אֹתָ֔/ם מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/036.yaml
  text: which Yahweh commanded to be given to them from the sons of Israel on the day he anointed them—an everlasting statute throughout their generations[a][b].
translation:
  language: fr
  text: 'C’est ce que Yahweh ordonna que cela leur soit donné par les Israélites[a], le jour où il les oignit : une prescription perpétuelle[b] pour toutes leurs générations.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « permanente ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: C’est ce que
  rationale: La formule reprend naturellement en français les parts sacerdotales mentionnées dans le contexte précédent, tout en conservant la fonction relative de l’hébreu.
- source_word: צִוָּה
  choice: ordonna
  rationale: Le verbe exprime un commandement divin ayant force d’autorité et de loi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: לָתֵת לָהֶם מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: ordonna aux Israélites de leur donner
  rationale: Cette formulation française exprime naturellement que les parts doivent provenir des Israélites. Elle évite le tour lourd « ordonna qu’elles leur soient données de la part des fils d’Israël » ; la forme littérale du groupe nominal est signalée en note.
- source_word: בְּיוֹם מָשְׁחוֹ אֹתָם
  choice: le jour où il leur donna l’onction
  rationale: La formulation garde la référence concrète à l’onction, sans l’élargir au seul concept de consécration. Le sujet implicite est naturellement Yahweh dans cette construction.
- source_word: חֻקַּת עוֹלָם
  choice: une prescription perpétuelle
  rationale: « Prescription » convient au cadre juridique et cultuel ; « perpétuelle » conserve la portée durable de עוֹלָם sans développer une thèse métaphysique sur l’éternité.
- source_word: לְדֹרֹתָם
  choice: pour toutes leurs générations
  rationale: Cette expression restitue l’application continue de la prescription au fil des générations, dans un français clair et proche de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » préserve le nom propre sans lui substituer un titre.
- issue: Portée de עוֹלָם dans la législation sacerdotale
  choice: perpétuelle
  alternative: éternelle ; permanente
  rationale: « Perpétuelle » maintient la force juridique durable de la formule, précisée par « pour toutes leurs générations », sans trancher des questions théologiques ultérieures que le verset ne traite pas.
translation_notes:
  register: Français international moderne, digne et accessible. Le tour « C’est ce que » assure le lien avec le verset précédent. « Donner l’onction » conserve le geste rituel précis, tandis que « prescription perpétuelle » maintient le registre juridique de la Torah.
