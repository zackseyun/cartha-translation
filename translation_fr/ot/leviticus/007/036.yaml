  to: 'C’est ce que Yahweh ordonna que cela leur soit donné par les Israélites[a], le jour où il les oignit : une prescription perpétuelle[b] pour toutes leurs générations.'
  rationale: La révision rétablit le sens concret de l’onction et clarifie, sans explicitation doctrinale, que les parts destinées aux prêtres proviennent des Israélites. Elle maintient le lien contextuel, le registre juridique et la portée générationnelle de la formule hébraïque.
