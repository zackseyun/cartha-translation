  yaml_path: translation/ot/leviticus/007/017.yaml
  text: But what remains of the meat of the sacrifice on the third day shall be burned in the fire[a].
translation:
  language: fr
  text: Mais, le troisième jour, ce qui restera de la viande du sacrifice sera brûlé au feu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: Mais ce qui restera
  rationale: La conjonction poursuit la prescription précédente avec une légère valeur contrastive, tandis que le participe substantivé désigne naturellement ce qui reste.
- source_word: מִבְּשַׂר
  choice: de la viande
  rationale: Dans ce contexte de nourriture sacrificielle, « viande » est plus naturel en français moderne que « chair », tout en gardant le sens concret.
- source_word: הַזָּבַח
  choice: du sacrifice
  rationale: Le terme désigne ici le sacrifice, notamment l’animal sacrifié; « sacrifice » est la formulation cultuelle la plus directe.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: le troisième jour
  rationale: Cette expression temporelle rend directement l’hébreu et reste idiomatique en français.
- source_word: בָּאֵשׁ
  choice: au feu
  rationale: « Brûler au feu » est une tournure française naturelle qui exprime le moyen de destruction indiqué par la préposition hébraïque.
- source_word: יִשָּׂרֵף
  choice: sera brûlé
  rationale: Le futur passif conserve la forme passive et la portée prescriptive de l’imparfait hébreu dans ce contexte juridique.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le ton prescriptif du texte légal sans archaïsme. Aucune note n’est nécessaire, car « viande » rend clairement בשר dans ce contexte et l’alternative « chair » n’ajoute pas ici d’ambiguïté substantielle.
