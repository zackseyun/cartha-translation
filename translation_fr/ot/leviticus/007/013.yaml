source:
  edition: WLC
  text: עַל חַלֹּת֙ לֶ֣חֶם חָמֵ֔ץ יַקְרִ֖יב קָרְבָּנ֑/וֹ עַל זֶ֖בַח תּוֹדַ֥ת שְׁלָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/013.yaml
  text: Along with cakes of leavened bread[a], he shall present his offering with the sacrifice of his peace offerings of thanksgiving.
translation:
  language: fr
  text: Avec des gâteaux de pain levé, il présentera son offrande avec son sacrifice de communion[a] en action de grâce.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de paix » ou « sacrifice de bien-être ».
    reason: Alternatives lexicales pour שְׁלָמִים, terme sacrificiel associé à la paix, au bien-être et à la communion.
lexical_decisions:
- source_word: עַל
  choice: avec / en même temps que
  rationale: Dans ses deux emplois, עַל exprime ici l’accompagnement ou l’association, non une position physique. La variation française évite une répétition lourde tout en gardant le lien entre les pains, l’offrande et le sacrifice.
- source_word: חַלֹּת לֶחֶם חָמֵץ
  choice: des gâteaux de pain levé
  rationale: חַלּוֹת désigne des gâteaux ou pains préparés pour l’offrande, et חָמֵץ précise qu’ils sont levés, par contraste avec les préparations sans levain des versets précédents.
- source_word: יַקְרִיב
  choice: il présentera
  rationale: Le hiphil de קרב signifie, en contexte cultuel, faire approcher ou présenter une offrande. « Présentera » est naturel et distingue le verbe du nom קָרְבָּן.
- source_word: קָרְבָּנוֹ
  choice: son offrande
  rationale: קָרְבָּן est le terme général pour ce qui est apporté et présenté à Dieu; « offrande » en est l’équivalent français courant.
- source_word: זֶבַח
  choice: sacrifice
  rationale: Dans la législation sacrificielle, זֶבַח désigne un sacrifice impliquant l’immolation; « sacrifice » convient ici sans alourdir la formulation.
- source_word: תּוֹדַת
  choice: offert en reconnaissance
  rationale: תּוֹדָה exprime ici l’action de grâce ou la reconnaissance qui caractérise le sacrifice. Cette formulation naturelle conserve sa valeur circonstancielle dans la chaîne construite.
- source_word: שְׁלָמָיו
  choice: son sacrifice de communion
  rationale: שְׁלָמִים est un terme sacrificiel associé à l’intégrité, à la paix et au repas partagé. « Sacrifice de communion » rend bien la dimension relationnelle sans réduire le mot à un seul aspect; les autres possibilités sont signalées en note.
theological_decisions:
- issue: Traduction du terme sacrificiel שְׁלָמִים
  choice: sacrifice de communion
  alternative: sacrifice de paix; sacrifice de prospérité ou de bien-être
  rationale: Le terme hébreu possède un champ sémantique qui touche à la paix, à l’intégrité et à la communion manifestée par un sacrifice partagé. Le texte principal retient une expression française claire, tandis que la note préserve les autres nuances possibles sans imposer une interprétation confessionnelle.
- issue: Rapport entre תּוֹדָה et שְׁלָמִים
  choice: un sacrifice de communion offert en reconnaissance
  alternative: un sacrifice de reconnaissance parmi ses sacrifices de communion
  rationale: La chaîne construite peut être comprise comme désignant la catégorie particulière du sacrifice de communion motivé par la reconnaissance. La formulation retenue garde ce rapport sans résoudre au-delà de ce que permet l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la terminologie cultuelle nécessaire, mais évite les archaïsmes tels que « oblation ». Le singulier français « sacrifice de communion » correspond à la construction hébraïque זֶבַח ... שְׁלָמָיו, malgré la forme plurielle du terme technique שְׁלָמִים.
