  text: כִּי֩ אֶת חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה לָקַ֨חְתִּי֙ מֵ/אֵ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל מִ/זִּבְחֵ֖י שַׁלְמֵי/הֶ֑ם וָ/אֶתֵּ֣ן אֹ֠תָ/ם לְ/אַהֲרֹ֨ן הַ/כֹּהֵ֤ן וּ/לְ/בָנָי/ו֙ לְ/חָק עוֹלָ֔ם מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/034.yaml
  text: For I have taken the breast of the wave offering and the thigh of the contribution from the sons of Israel[a], from their sacrifices of peace offerings[c][b], and I have given them to Aaron the priest and to his sons as a permanent statute from the sons of Israel.
translation:
  language: fr
  text: Car j’ai prélevé, sur les sacrifices de paix des fils d’Israël[a], la poitrine présentée par balancement et la cuisse prélevée comme contribution[c], et je les ai données au prêtre Aaron et à ses fils, à titre de droit perpétuel prélevé sur les fils d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Israélites ». L’hébreu dit littéralement « des fils d’Israël », désignation collective habituelle du peuple.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement, selon une traduction traditionnelle : « la poitrine de balancement et la cuisse d’élévation ». Les deux expressions désignent des portions associées à des gestes rituels distincts.'
    reason: cultic_terminology
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: la poitrine destinée au geste de présentation
  rationale: חֲזֵה désigne la poitrine de l’animal, tandis que תְּנוּפָה renvoie au geste rituel de présentation, traditionnellement compris comme un mouvement de balancement. Cette formulation reste naturelle en français et distingue ce rite de la contribution.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: la cuisse prélevée en contribution
  rationale: שׁוֹק désigne ici la cuisse ou partie supérieure de la patte. תְּרוּמָה est une portion mise à part, probablement élevée rituellement ; « contribution » exprime clairement sa fonction sans employer un archaïsme.
- source_word: לָקַחְתִּי
  choice: j’ai pris
  rationale: Le parfait présente l’acte divin qui fonde la règle expliquée par כִּי ; le passé composé convient au français actuel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction conserve la forme de la désignation collective et covenantale hébraïque ; « les Israélites » est signalé comme équivalent idiomatique.
- source_word: זִבְחֵי שַׁלְמֵיהֶם
  choice: leurs sacrifices de paix
  rationale: La formulation maintient à la fois זֶבַח, « sacrifice », et la catégorie שְׁלָמִים. « Sacrifices de paix » préserve la proximité lexicale sans réduire le rite à la seule communion.
- source_word: וָאֶתֵּן אֹתָם
  choice: et je les ai données
  rationale: Le passé composé prolonge naturellement l’acte fondateur exprimé par « j’ai pris ». L’accord au féminin pluriel reprend « la poitrine » et « la cuisse ».
- source_word: לְחָק עוֹלָם
  choice: comme une prescription permanente
  rationale: חֹק est une règle fixée ou prescription ; עוֹלָם marque ici sa durée indéfinie et durable. « Permanente » est actuelle et intelligible.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: due par les fils d’Israël
  rationale: Dans la proposition finale, מֵאֵת indique l’origine de cette part sacerdotale. « Due par » rend sa force juridique plus naturellement qu’une seconde occurrence de « prise aux ».
theological_decisions:
- issue: Désignation covenantale בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: La forme littérale conserve la désignation traditionnelle du peuple sans empêcher de préciser en note son sens collectif.
- issue: Sens de שְׁלָמִים
  choice: sacrifices de paix
  alternative: sacrifices de communion
  rationale: « Paix » maintient le lien lexical traditionnel et laisse ouverte la portée exacte de cette catégorie sacrificielle ; « communion » explicite davantage une fonction possible du rite.
- issue: Distinction entre תְּנוּפָה et תְּרוּמָה
  choice: geste de présentation / contribution
  alternative: offrande balancée / offrande élevée
  rationale: Le texte emploie deux termes cultuels distincts. La traduction les différencie sans affirmer avec une précision excessive la mécanique de chaque geste rituel.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure juridique et causale du verset, tout en évitant les expressions cultuelles archaïques. Les termes techniques et leurs variantes sont expliqués en notes.
