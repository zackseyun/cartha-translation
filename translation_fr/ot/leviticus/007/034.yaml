revisions:
- from: Car j’ai pris aux fils d’Israël[a], sur leurs sacrifices de paix[b], la poitrine destinée au geste de présentation et la cuisse prélevée en contribution[c], et je les ai données au prêtre Aaron et à ses fils, comme une prescription permanente due par les fils d’Israël.
  to: Car j’ai prélevé, sur les sacrifices de paix des fils d’Israël[a], la poitrine présentée par balancement et la cuisse prélevée comme contribution[c], et je les ai données au prêtre Aaron et à ses fils, à titre de droit perpétuel prélevé sur les fils d’Israël.
  rationale: La révision conserve la causalité, la double provenance « des fils d’Israël / sur leurs sacrifices de paix », la distinction des deux portions et l’attribution durable à Aaron et à ses fils. Elle supprime une nuance de destination non exprimée et rend plus clairement le droit sacerdotal perpétuel. La note b est conservée dans le jeu complet de notes, bien que l’ancre ne soit pas nécessaire dans le texte puisque la note c porte déjà sur les deux désignations cultuelles ; une harmonisation éditoriale ultérieure des ancres peut être envisagée.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:23:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'La structure fondamentale est bien rendue, ainsi que la distinction entre les deux portions cultuelles. Toutefois, « destinée au geste de présentation » introduit une nuance de destination absente de l’hébreu : חֲזֵה הַתְּנוּפָה qualifie directement la poitrine par le rite/présentation. La finale « prescription permanente due par » est moins précise : le contexte désigne le droit perpétuel accordé aux prêtres et provenant des fils d’Israël.'
  naturalness: Le français est globalement clair, mais « la poitrine destinée au geste de présentation » et « comme une prescription permanente due par les fils d’Israël » sont lourds. « poitrine présentée par balancement » et « à titre de droit perpétuel prélevé sur les fils d’Israël » sont plus naturels tout en restant formels.
  terminology: « Sacrifices de paix » est un choix défendable et cohérent pour שְׁלָמִים. « Balancement » et « contribution » distinguent de manière utile תְּנוּפָה et תְּרוּמָה, sans figer indûment les détails du geste rituel. « Droit perpétuel » rend mieux חֹק עוֹלָם dans ce contexte d’attribution sacerdotale.
  issues:
  - severity: medium
    issue: Nuance ajoutée dans « destinée au geste de présentation »
    rationale: Le syntagme hébreu ne dit pas que la poitrine est destinée à un geste ; il la désigne comme la poitrine associée à la tenoupha. Une formulation qualificative directe préserve mieux le texte.
  - severity: medium
    issue: « prescription permanente due par les fils d’Israël » rend imprécis le statut de la portion
    rationale: La clause finale exprime le droit durable conféré à Aaron et à ses fils, provenant des fils d’Israël. « Droit perpétuel prélevé sur » rend à la fois l’attribution et la provenance sans introduire une obligation juridique plus large.
  revised_text: Car j’ai prélevé, sur les sacrifices de paix des fils d’Israël[a], la poitrine présentée par balancement et la cuisse prélevée comme contribution[c], et je les ai données au prêtre Aaron et à ses fils, à titre de droit perpétuel prélevé sur les fils d’Israël.
  revised_footnotes:
