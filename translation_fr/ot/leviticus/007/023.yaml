source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר כָּל חֵ֜לֶב שׁ֥וֹר וְ/כֶ֛שֶׂב וָ/עֵ֖ז לֹ֥א תֹאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/023.yaml
  text: 'Speak to the sons of Israel[a], saying: You shall not eat any fat of an ox, a sheep, or a goat.'
translation:
  language: fr
  text: 'Parle aux Israélites[a] et dis-leur : Vous ne mangerez aucune graisse de bœuf, de mouton ou de chèvre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Parle
  rationale: L’impératif piel masculin singulier adresse à Moïse un ordre direct. « Parle » conserve la formule juridique fréquente du Lévitique.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aux Israélites
  rationale: L’expression signifie littéralement « aux fils d’Israël », mais désigne collectivement le peuple d’Israël. « Aux Israélites » est naturel, précis et inclusif en français moderne.
- source_word: לֵאמֹר
  choice: et dis-leur
  rationale: L’infinitif hébreu introduit les paroles à transmettre. Dans cette formule, « et dis-leur » est plus idiomatique en français que le calque « en disant ».
- source_word: כָּל
  choice: aucune
  rationale: Sous la portée de la négation et devant un nom massif, « aucune graisse » exprime naturellement la totalité visée par l’interdiction.
- source_word: חֵלֶב
  choice: graisse
  rationale: Le terme désigne ici la graisse animale, notamment les parties grasses concernées par la législation sacrificielle. « Graisse » reste clair sans restreindre indûment le sens.
- source_word: שׁוֹר
  choice: bœuf
  rationale: Le mot désigne un bovin. « Bœuf » est le terme générique courant dans une liste d’animaux domestiques, sans imposer ici « taureau ».
- source_word: כֶשֶׂב
  choice: mouton
  rationale: Le terme désigne de manière générale un animal de l’espèce ovine. « Mouton » préserve cette valeur générique sans préciser à tort « agneau » ou « bélier ».
- source_word: עֵז
  choice: chèvre
  rationale: Dans cette liste de bétail, le terme usuel désigne la chèvre comme catégorie animale. Le français emploie naturellement « chèvre ».
- source_word: לֹא תֹאכֵלוּ
  choice: Vous ne mangerez
  rationale: L’imparfait hébreu nié formule une interdiction collective. Le futur français convient au registre juridique biblique tout en restant intelligible.
theological_decisions:
- issue: Portée de l’interdiction concernant חֵלֶב
  choice: Conserver le terme général « graisse » sans préciser davantage dans le corps du verset.
  alternative: Traduire par « graisse réservée » ou « graisse sacrificielle ».
  rationale: Le contexte législatif détermine les parties grasses visées, mais le verset emploie simplement חֵלֶב. Ajouter une qualification résoudrait une question interprétative que le texte laisse implicite.
translation_notes:
  register: Français international moderne, clair et digne. La formule hébraïque est rendue idiomatiquement par « Parle… et dis-leur », tandis que le futur « Vous ne mangerez » maintient la force juridique de l’interdiction.
