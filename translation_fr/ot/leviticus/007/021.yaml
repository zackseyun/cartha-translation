id: LEV.7.21
reference: Leviticus 7:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נֶ֜פֶשׁ כִּֽי תִגַּ֣ע בְּ/כָל טָמֵ֗א בְּ/טֻמְאַ֤ת אָדָם֙ א֣וֹ בִּ/בְהֵמָ֣ה טְמֵאָ֗ה א֚וֹ בְּ/כָל שֶׁ֣קֶץ טָמֵ֔א וְ/אָכַ֛ל מִ/בְּשַׂר זֶ֥בַח הַ/שְּׁלָמִ֖ים אֲשֶׁ֣ר לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/021.yaml
  text: And if a person touches anything unclean—whether human uncleanness[a], or an unclean animal, or any unclean detestable thing—and eats some of the flesh of the sacrifice of peace offerings that belongs to Yahweh[b], that person shall be cut off from his people.
translation:
  language: fr
  text: Si une personne touche quoi que ce soit d’impur — une impureté humaine, un animal impur ou toute chose répugnante et impure — puis mange de la chair du sacrifice de paix qui appartient au SEIGNEUR[a], cette personne sera retranchée de son peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le SEIGNEUR représente ici le nom divin hébreu YHWH.
    reason: divine_name
  - marker: b
    text: « Sera retranchée » est une formule de sanction liée à l’alliance. Elle peut évoquer l’exclusion ou un jugement divin; l’hébreu ne précise pas ici comment cette sanction s’accomplit.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: personne
  rationale: Dans ce contexte juridique, le terme désigne un individu, non une « âme » immatérielle. « Personne » est naturel et conserve la portée générale de la loi.
- source_word: תִגַּע
  choice: touche
  rationale: Le verbe exprime ici le contact qui communique l’impureté rituelle; « touche » le rend directement.
- source_word: בְּכָל טָמֵא
  choice: quoi que ce soit d’impur
  rationale: Cette formulation idiomatique conserve la portée large et indéfinie de l’hébreu.
- source_word: טֻמְאַת אָדָם
  choice: une impureté humaine
  rationale: L’expression désigne une impureté liée à un être humain; elle ne vise pas spécialement un homme de sexe masculin.
- source_word: בִּבְהֵמָה טְמֵאָה
  choice: un animal impur
  rationale: « Animal » rend clairement le terme générique בְּהֵמָה dans cette liste de sources d’impureté.
- source_word: שֶׁקֶץ טָמֵא
  choice: chose répugnante et impure
  rationale: « Répugnante » conserve la forte nuance de rejet attachée à שֶׁקֶץ, tandis que « impure » maintient explicitement la catégorie rituelle.
- source_word: וְאָכַל מִבְּשַׂר
  choice: puis mange de la chair
  rationale: « De la chair » exprime naturellement la valeur partitive de מִן. « Puis » clarifie la succession logique sans changer la condition juridique.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: sacrifice de paix
  rationale: Cette expression reste proche de la désignation sacrificielle hébraïque et évite de réduire d’emblée son sens à la seule communion ou au partage.
- source_word: אֲשֶׁר לַיהוָה
  choice: qui appartient au SEIGNEUR
  rationale: La tournure exprime clairement que le sacrifice est consacré à YHWH et lui appartient.
- source_word: יהוה
  choice: le SEIGNEUR
  rationale: Les petites capitales représentent la convention française traditionnelle employée pour le nom divin YHWH, tout en permettant de signaler le nom dans une note.
- source_word: וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: sera retranchée de son peuple
  rationale: « Retranchée » préserve la formule solennelle de sanction sans préciser un mode d’exécution que le texte hébreu ne donne pas.
theological_decisions:
- issue: Portée exacte de la sanction וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: sera retranchée de son peuple
  alternative: sera exclue de son peuple; sera mise à mort
  rationale: La formule peut évoquer l’exclusion ou un jugement divin, éventuellement mortel, mais ce verset n’en précise pas le mécanisme. La traduction conserve donc cette tension.
- issue: Sens sacrificiel de שְׁלָמִים
  choice: sacrifice de paix
  alternative: sacrifice de communion; sacrifice de bien-être
  rationale: « Paix » maintient le lien lexical possible avec la plénitude et le bien-être sans imposer que la communion soit à elle seule le sens du terme.
translation_notes:
  register: Français international actuel, clair et digne. Le vocabulaire rituel reste cohérent (« impur », « sacrifice », « chair »), tandis que la syntaxe est allégée pour une lecture naturelle. Le féminin de « retranchée » s’accorde avec « personne » et ne limite pas la loi aux femmes.
