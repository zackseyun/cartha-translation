id: LEV.7.5
reference: Leviticus 7:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִקְטִ֨יר אֹתָ֤/ם הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה אִשֶּׁ֖ה לַ/יהוָ֑ה אָשָׁ֖ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/005.yaml
  text: The priest shall burn them on the altar as a food offering to Yahweh[b][a]; it is a guilt offering.
translation:
  language: fr
  text: Le prêtre les fera fumer sur l’autel en offrande consumée par le feu pour Yahweh ; c’est un sacrifice de réparation.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de culpabilité » ; traditionnellement, « sacrifice pour le délit » ou « sacrifice de culpabilité » selon les versions. Le terme hébreu désigne une offrande liée à la culpabilité et à la réparation.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: fera fumer
  rationale: Le hiphil de קטר, dans le contexte sacrificiel, désigne l’action de faire monter en fumée sur l’autel. « Fera fumer » conserve cette image plus précisément que le simple « brûlera ».
- source_word: אֹתָם
  choice: les
  rationale: Le pronom objet masculin pluriel renvoie aux parties du sacrifice mentionnées dans le contexte immédiat.
- source_word: הַכֹּהֵן
  choice: Le prêtre
  rationale: Rendu direct du nom défini singulier dans la législation cultuelle.
- source_word: הַמִּזְבֵּחָה
  choice: sur l’autel
  rationale: Bien que la forme directionnelle puisse littéralement suggérer « vers l’autel », l’action sacrificielle consiste à faire fumer les morceaux sur l’autel.
- source_word: אִשֶּׁה
  choice: une offrande consumée par le feu
  rationale: Ce terme technique désigne une offrande présentée par le feu. Cette formulation française reste claire et distingue le terme de l’holocauste, autre catégorie sacrificielle.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition marque ici la destination ou la consécration de l’offrande à Yahweh.
- source_word: אָשָׁם
  choice: sacrifice de réparation
  rationale: Dans le Lévitique, אָשָׁם nomme une catégorie sacrificielle liée à la culpabilité et, dans plusieurs cas, à la réparation. « Sacrifice de réparation » est naturel en français et met en valeur sa fonction cultuelle sans le confondre avec l’état abstrait de culpabilité.
- source_word: הוּא
  choice: c’est
  rationale: 'Le pronom forme une proposition nominale qui classe explicitement le rite : « c’est un sacrifice de réparation ».'
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » représente le nom propre et évite de le remplacer par un titre.
- issue: Sens du terme sacrificiel אָשָׁם
  choice: sacrifice de réparation
  alternative: sacrifice de culpabilité
  rationale: Le terme associe culpabilité et réparation. Le choix retenu exprime la catégorie rituelle dans un français naturel, tandis qu’une note préserve l’autre traduction légitime.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « fera fumer » conserve l’imagerie sacrificielle hébraïque ; « offrande consumée par le feu » explicite le terme technique אִשֶּׁה sans employer une formulation archaïque.
