  text: כַּֽ/חַטָּאת֙ כָּֽ/אָשָׁ֔ם תּוֹרָ֥ה אַחַ֖ת לָ/הֶ֑ם הַ/כֹּהֵ֛ן אֲשֶׁ֥ר יְכַפֶּר בּ֖/וֹ ל֥/וֹ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/007.yaml
  text: 'Like the sin offering[a], so the guilt offering: there is one law for them[c][b]. The priest who makes atonement with it shall have it.'
translation:
  language: fr
  text: 'Comme le sacrifice pour le péché, ainsi le sacrifice de réparation : une même loi[a] s’applique à tous les deux. Le prêtre qui fait l’expiation avec ce sacrifice l’aura[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu torah peut aussi signifier « instruction » ou « règle » dans ce contexte.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le prêtre qui fait l’expiation avec lui l’aura ». Le pronom renvoie au sacrifice de réparation, employé comme moyen d’expiation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחַטָּאת כָּאָשָׁם
  choice: Il en va du sacrifice de réparation comme du sacrifice pour le péché
  rationale: Les deux préfixes comparatifs כ établissent une correspondance entre les deux sacrifices. Cette formulation française naturelle conserve l’idée que le sacrifice de réparation est soumis au même régime que le sacrifice pour le péché.
- source_word: תּוֹרָה אַחַת לָהֶם
  choice: une même loi s’applique à tous les deux
  rationale: תּוֹרָה désigne ici la règle ou l’instruction cultuelle. « Une même loi » garde la force juridique du contexte, tandis que « tous les deux » explicite sans ajout de sens le référent duel du pluriel לָהֶם.
- source_word: הַכֹּהֵן אֲשֶׁר יְכַפֵּר בּוֹ
  choice: le prêtre qui accomplit par son moyen le rite d’expiation
  rationale: Le verbe כפר conserve sa portée cultuelle avec « accomplir le rite d’expiation ». Le ב instrumental est rendu par « par son moyen » et renvoie au sacrifice, sans introduire un bénéficiaire absent de la proposition hébraïque.
- source_word: לוֹ יִהְיֶה
  choice: Le sacrifice appartiendra au prêtre
  rationale: L’idiome hébreu exprime l’attribution ou la possession. La restructuration de la phrase précise naturellement en français l’antécédent du pronom tout en conservant le droit du prêtre officiant sur le sacrifice.
theological_decisions:
- issue: Portée de כפר dans la législation sacrificielle
  choice: accomplit le rite d’expiation
  alternative: fait l’expiation
  rationale: « Expiation » préserve la portée théologique et cultuelle du verbe sans imposer une théorie particulière. L’ajout de « rite » indique qu’il s’agit ici de l’acte sacerdotal prescrit, non d’une explication du mécanisme de l’expiation.
translation_notes:
  register: Français international actuel, clair et digne. La structure comparative hébraïque est rendue idiomatiquement, et le vocabulaire sacrificiel demeure précis sans surcharge confessionnelle.
