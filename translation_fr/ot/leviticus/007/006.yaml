id: LEV.7.6
reference: Leviticus 7:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כָּל זָכָ֥ר בַּ/כֹּהֲנִ֖ים יֹאכְלֶ֑/נּוּ בְּ/מָק֤וֹם קָדוֹשׁ֙ יֵאָכֵ֔ל קֹ֥דֶשׁ קָֽדָשִׁ֖ים הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/006.yaml
  text: Every male among the priests may eat it[a]; it shall be eaten in a holy place[b]. It is most holy.
translation:
  language: fr
  text: Tout mâle parmi les prêtres pourra en manger[a]. On le mangera dans un lieu saint. C’est une chose très sainte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en mangera ». L’hébreu peut se comprendre comme une prescription, mais il indique vraisemblablement ici que tout mâle appartenant au groupe des prêtres est autorisé à en manger.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sainteté des saintetés », expression hébraïque qui marque le degré le plus élevé de sainteté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זָכָר בַּכֹּהֲנִים
  choice: Tout mâle parmi les prêtres
  rationale: La formulation conserve la valeur distributive de כָּל, la précision sexuelle de זָכָר et l’appartenance au groupe sacerdotal exprimée par בַּכֹּהֲנִים.
- source_word: יֹאכְלֶנּוּ
  choice: pourra en manger
  rationale: Dans ce contexte juridique, l’imparfait exprime vraisemblablement le droit accordé à chaque homme appartenant au groupe sacerdotal, plutôt qu’un simple futur.
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: dans un lieu saint
  rationale: Le nom est sans article ; l’indéfini évite d’identifier indûment ce lieu au sanctuaire proprement dit.
- source_word: יֵאָכֵל
  choice: On le mangera
  rationale: Cette tournure française rend naturellement le passif hébreu tout en conservant la force prescriptive de la disposition.
- source_word: קֹדֶשׁ קָדָשִׁים הוּא
  choice: C’est une chose très sainte
  rationale: L’expression superlative hébraïque désigne le degré le plus élevé de sainteté appliqué ici à la part sacrificielle ; « une chose » explicite le référent sans le redéfinir comme un lieu.
theological_decisions:
- issue: Restriction de la consommation aux personnes de sexe masculin appartenant au sacerdoce
  choice: Tout mâle parmi les prêtres pourra en manger
  alternative: Tout prêtre pourra en manger
  rationale: Le texte hébreu mentionne explicitement זָכָר, « mâle » ; généraliser à tous les prêtres effacerait une restriction cultuelle formulée dans le texte.
- issue: Valeur modale de יֹאכְלֶנּוּ
  choice: pourra en manger
  alternative: en mangera / doit en manger
  rationale: Le contexte des lois sacrificielles permet de comprendre la forme comme une autorisation ou un droit. Une note conserve toutefois la possibilité d’une formulation plus directement prescriptive.
translation_notes:
  register: Français international moderne, clair et digne. « Mâle » est retenu malgré sa tonalité juridique afin de reproduire avec précision la distinction sexuelle du texte, sans introduire la notion d’âge impliquée par « homme ». La répétition de « saint » maintient le vocabulaire cultuel du verset.
