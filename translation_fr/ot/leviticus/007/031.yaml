  text: וְ/הִקְטִ֧יר הַ/כֹּהֵ֛ן אֶת הַ/חֵ֖לֶב הַ/מִּזְבֵּ֑חָ/ה וְ/הָיָה֙ הֶֽ/חָזֶ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/031.yaml
  text: The priest shall burn the fat on the altar[a], and the breast shall belong to Aaron and to his sons.
translation:
  language: fr
  text: Le prêtre fera fumer la graisse sur l’autel[a], et la poitrine appartiendra à Aaron et à ses fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « brûlera la graisse sur l’autel pour la faire monter en fumée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: fera fumer
  rationale: Dans le contexte sacrificiel, le hiphil de קטר désigne l’action de brûler une offrande de manière à la faire monter en fumée. « Fera fumer » conserve cette nuance cultuelle tout en restant naturel en français.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Équivalent français courant de כֹּהֵן dans le contexte du culte; le singulier hébreu est maintenu.
- source_word: הַחֵלֶב
  choice: la graisse
  rationale: Dans la législation sacrificielle du Lévitique, חֵלֶב désigne les parties grasses réservées à l’autel.
- source_word: הַמִּזְבֵּחָה
  choice: sur l’autel
  rationale: Bien que la forme directionnelle puisse littéralement évoquer un mouvement vers l’autel, le contexte rituel indique que la graisse y est brûlée; « sur l’autel » exprime naturellement cette action en français.
- source_word: וְהָיָה
  choice: appartiendra
  rationale: L’expression indique ici l’attribution de la portion sacerdotale. « Appartiendra » rend explicitement cette valeur juridique et possessive.
- source_word: הֶחָזֶה
  choice: la poitrine
  rationale: Dans les prescriptions sacrificielles, חָזֶה désigne la poitrine de l’animal attribuée aux prêtres.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: à Aaron et à ses fils
  rationale: Le lamed marque ici l’attribution ou la possession; cette formulation française conserve la structure et le sens du texte.
theological_decisions: []
