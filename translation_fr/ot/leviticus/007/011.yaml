id: LEV.7.11
reference: Leviticus 7:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת זֶ֣בַח הַ/שְּׁלָמִ֑ים אֲשֶׁ֥ר יַקְרִ֖יב לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/011.yaml
  text: This is the law of the sacrifice of peace offerings that one shall present to Yahweh:[a]
translation:
  language: fr
  text: 'Voici la loi du sacrifice de paix[a] que l’on présentera à Yahweh :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de communion » ou « sacrifice de bien-être » ; traditionnellement « sacrifice de paix ».
    reason: Le terme hébreu שְׁלָמִים possède une riche gamme de sens comprenant la paix, l’intégrité, le bien-être et la communion liée au repas sacrificiel.
lexical_decisions:
- source_word: וְ/זֹאת
  choice: Voici
  rationale: Le démonstratif introduit une nouvelle section. « Voici » est naturel dans une formulation légale française et rend la fonction présentative sans ajouter un marqueur temporel absent de l’hébreu.
- source_word: תּוֹרַת
  choice: la loi du
  rationale: Dans les textes sacerdotaux, תּוֹרָה désigne une prescription rituelle. « La loi du » conserve la valeur juridique et la relation construite avec le groupe nominal suivant.
- source_word: זֶבַח
  choice: sacrifice
  rationale: זֶבַח désigne ici une offrande sacrificielle impliquant normalement l’abattage. « Sacrifice » est précis, courant et adapté au contexte cultuel.
- source_word: הַ/שְּׁלָמִים
  choice: de paix
  rationale: שְׁלָמִים est un terme sacrificiel technique lié aux notions de paix, d’intégrité et de bien-être. « Sacrifice de paix » maintient l’expression traditionnelle française, tandis qu’une note signale d’autres rendus possibles.
- source_word: אֲשֶׁר יַקְרִיב
  choice: que l’on présentera
  rationale: Le hiphil de קרב signifie ici présenter ou apporter une offrande. Le futur français convient au caractère prescriptif de l’imparfait hébreu, et « l’on » rend générique le sujet masculin singulier sans en restreindre la portée.
- source_word: לַ/יהוָה
  choice: à Yahweh
  rationale: La préposition ל indique le destinataire du sacrifice, et le nom divin יהוה est rendu directement par « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » préserve le nom propre d’alliance sans le remplacer par un titre.
- issue: Rendu du terme sacrificiel שְׁלָמִים
  choice: sacrifice de paix
  alternative: sacrifice de communion ; sacrifice de bien-être
  rationale: Le terme évoque la paix, l’intégrité et le bien-être, et peut aussi être associé au repas partagé. Le rendu traditionnel est conservé dans le texte, sans réduire cette richesse sémantique, que la note explicite.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve le caractère prescriptif du passage sacerdotal tout en évitant un sujet inutilement masculin. Les deux-points annoncent les prescriptions qui suivent.
