    '
  naturalness: « Il en présentera » est plus naturel et plus proche du verbe hébreu. « Une part » est plus idiomatique et plus précis dans ce contexte cultuel que « une pièce », qui peut évoquer un objet matériel non spécifié. La phrase demeure accessible en français international moderne.
  terminology: « SEIGNEUR », « contribution », « projette » et « sacrifices de paix » constituent des choix défendables. « Projette » conserve utilement la valeur de זרק sans réduire le geste à une aspersion fine. Les notes maintiennent les principales alternatives sans imposer une lecture doctrinale.
