  text: וְ/הִקְרִ֨יב מִמֶּ֤/נּוּ אֶחָד֙ מִ/כָּל קָרְבָּ֔ן תְּרוּמָ֖ה לַ/יהוָ֑ה לַ/כֹּהֵ֗ן הַ/זֹּרֵ֛ק אֶת דַּ֥ם הַ/שְּׁלָמִ֖ים ל֥/וֹ יִהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/014.yaml
  text: And from it he shall present one from each offering as a contribution to Yahweh[c][b][a]; it shall belong to the priest who sprinkles the blood of the peace offerings.
translation:
  language: fr
  text: Il en présentera une part de chaque offrande à titre de contribution pour le SEIGNEUR[a]. Elle reviendra au prêtre qui projette[b] le sang des sacrifices de paix[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme part prélevée pour le SEIGNEUR ». Le terme hébreu désigne une portion mise à part pour Dieu et attribuée au prêtre.
    reason: lexical_alternative
  - marker: b
    text: Ou « asperge » ou « lance ». Le verbe hébreu décrit la projection rituelle du sang.
    reason: lexical_alternative
  - marker: c
    text: On peut aussi traduire « sacrifices de communion » ou « sacrifices de bien-être ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: Il prélèvera
  rationale: Le hiphil de קרב signifie normalement « présenter » ou « apporter » une offrande. Avec מִמֶּנּוּ et תְּרוּמָה, « prélever » exprime naturellement en français le geste consistant à prendre une part de l’ensemble pour la présenter à Dieu.
- source_word: מִמֶּנּוּ
  choice: sur cet ensemble
  rationale: Le suffixe singulier renvoie collectivement aux éléments du sacrifice d’action de grâce mentionnés juste avant. Cette formulation conserve cette référence collective sans suggérer qu’une seule pièce est en vue.
- source_word: אֶחָד מִכָּל קָרְבָּן
  choice: une pièce de chaque offrande
  rationale: Le texte dit littéralement « un de chaque offrande ». « Une pièce » explicite seulement l’élément sous-entendu par le contexte des pains, tout en gardant la valeur distributive de מִכָּל.
- source_word: תְּרוּמָה
  choice: contribution
  rationale: Le terme désigne une part prélevée, consacrée au SEIGNEUR puis attribuée au prêtre. « Contribution » est clair en français moderne, tandis que « offrande élevée » peut laisser croire qu’un geste rituel précis est toujours impliqué.
- source_word: לַיהוָה
  choice: pour le SEIGNEUR
  rationale: La préposition ל marque ici la destination ou la consécration. « Pour » est idiomatique en français; le nom divin est rendu selon la convention française traditionnelle par « le SEIGNEUR ».
- source_word: הַזֹּרֵק
  choice: qui projette
  rationale: Le participe de זרק décrit l’action de lancer ou projeter le sang dans le rite sacrificiel. « Projette » reste proche du geste hébreu et évite de réduire celui-ci à une fine aspersion.
- source_word: אֶת דַּם הַשְּׁלָמִים
  choice: le sang des sacrifices de paix
  rationale: « Sacrifices de paix » conserve une désignation traditionnelle de la catégorie שְׁלָמִים sans limiter son sens à la seule communion ni l’élargir à une notion abstraite de bien-être.
- source_word: לוֹ יִהְיֶה
  choice: Elle reviendra au prêtre
  rationale: L’expression indique l’attribution et le droit de possession. Le pronom féminin reprend naturellement « contribution » en français.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: le SEIGNEUR
  alternative: Yahvé
  rationale: « Le SEIGNEUR » suit l’usage biblique français largement reçu et signale le nom divin sans imposer une vocalisation moderne particulière.
- issue: Sens de שְׁלָמִים
  choice: sacrifices de paix
  alternative: sacrifices de communion
  rationale: Le terme peut évoquer paix, intégrité, bien-être et repas partagé. Le choix principal préserve la catégorie traditionnelle, tandis que la note maintient les autres nuances légitimes.
- issue: Nature de la תְּרוּמָה
  choice: contribution
  alternative: offrande élevée
  rationale: Le passage insiste sur une part mise à part pour Dieu et attribuée au prêtre. La traduction ne présente pas comme certaine une reconstruction particulière du geste rituel.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe juridique et cultuelle demeure nette sans multiplier les termes techniques. « Une pièce » rend explicite le référent contextuel des pains, et les notes préservent les principales ambiguïtés lexicales.
