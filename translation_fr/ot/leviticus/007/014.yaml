  - severity: low
    issue: « Il prélèvera » pour וְהִקְרִיב
    rationale: Le contexte suppose bien la sélection d’une part, mais le verbe hébreu désigne directement l’action de présenter/apporter comme offrande. « Présentera » préserve mieux ce sens.
  - severity: low
    issue: « une pièce »
    rationale: Le français « pièce » est moins naturel pour une portion de pain ou d’offrande et peut inutilement matérialiser un objet que l’hébreu laisse implicite. « Une part » convient mieux.
