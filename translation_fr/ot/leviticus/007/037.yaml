id: LEV.7.37
reference: Leviticus 7:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זֹ֣את הַ/תּוֹרָ֗ה לָֽ/עֹלָה֙ לַ/מִּנְחָ֔ה וְ/לַֽ/חַטָּ֖את וְ/לָ/אָשָׁ֑ם וְ/לַ֨/מִּלּוּאִ֔ים וּ/לְ/זֶ֖בַח הַ/שְּׁלָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/037.yaml
  text: This is the law for the burnt offering[a], the grain offering, the sin offering, the guilt offering, the ordination offering[d][c][b], and the sacrifice of peace offerings.
translation:
  language: fr
  text: Voici la loi concernant l’holocauste, l’offrande de céréales, le sacrifice pour le péché[a], le sacrifice de réparation[b], les rites d’ordination[c] et le sacrifice de paix[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification ». Le terme hébreu peut mettre l’accent aussi bien sur l’élimination de l’impureté que sur le traitement du péché.
    reason: lexical_alternative
  - marker: b
    text: Ou « sacrifice de culpabilité ». Le terme hébreu peut souligner la responsabilité encourue et la réparation exigée.
    reason: lexical_alternative
  - marker: c
    text: Ou « rites de consécration » ou « sacrifice de consécration ». Le terme hébreu est au pluriel et désigne les procédures d’installation des prêtres.
    reason: lexical_alternative
  - marker: d
    text: Ou « sacrifice de communion » ou « sacrifice de bien-être ».
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: Voici la loi
  rationale: La proposition hébraïque nominale introduit ici un récapitulatif. « Voici la loi » est une formulation française naturelle et solennelle; dans ce contexte, תּוֹרָה désigne la prescription qui régit les sacrifices énumérés.
- source_word: לָעֹלָה
  choice: concernant l’holocauste
  rationale: Le préfixe ל indique ici le domaine auquel s’applique la loi. עֹלָה désigne le sacrifice entièrement brûlé; « holocauste » est le terme cultuel français consacré.
- source_word: לַמִּנְחָה
  choice: l’offrande de céréales
  rationale: Dans le Lévitique, מִנְחָה désigne l’offrande non sanglante préparée à partir de produits céréaliers. Cette formulation est claire en français moderne.
- source_word: וְלַחַטָּאת
  choice: le sacrifice pour le péché
  rationale: חַטָּאת peut désigner le péché ou le sacrifice qui traite le péché et l’impureté. La formulation retenue reste intelligible sans effacer l’autre nuance, signalée en note.
- source_word: וְלָאָשָׁם
  choice: le sacrifice de réparation
  rationale: אָשָׁם évoque la culpabilité ou la responsabilité qui appelle souvent une réparation. « Sacrifice de réparation » rend bien cette dimension compensatoire.
- source_word: וְלַמִּלּוּאִים
  choice: les rites d’ordination
  rationale: Le pluriel מִלּוּאִים, littéralement lié à l’action de « remplir », désigne dans le contexte sacerdotal les procédures d’installation ou de consécration. Le pluriel français respecte la forme et la portée probablement plus large du terme hébreu.
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: le sacrifice de paix
  rationale: זֶבַח signifie « sacrifice », tandis que שְׁלָמִים désigne une catégorie associée à la paix, à la communion et au bien-être. « Sacrifice de paix » conserve la terminologie traditionnelle et la structure hébraïque.
theological_decisions:
- issue: Portée de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le terme peut viser à la fois le traitement du péché et l’élimination de l’impureté rituelle. Le texte principal retient l’expression française familière, tandis que la note préserve la nuance de purification.
- issue: Portée de אָשָׁם
  choice: sacrifice de réparation
  alternative: sacrifice de culpabilité
  rationale: Le choix principal souligne la responsabilité et la compensation requise sans nier la dimension de culpabilité, conservée en note.
- issue: Nature des מִלּוּאִים
  choice: rites d’ordination
  alternative: sacrifice de consécration
  rationale: Le pluriel hébreu peut englober l’ensemble des procédures d’installation sacerdotale plutôt qu’une seule offrande; la traduction évite donc de réduire indûment sa portée.
- issue: Sens de שְׁלָמִים
  choice: sacrifice de paix
  alternative: sacrifice de communion ou de bien-être
  rationale: Le terme possède un champ sémantique qui touche à la paix, à l’intégrité, au bien-être et à la communion. La note maintient cette amplitude sans imposer une interprétation théologique unique.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la forme récapitulative du verset et son vocabulaire cultuel, tout en expliquant en notes les termes hébreux dont le champ sémantique ne correspond pas exactement à une seule expression française.
