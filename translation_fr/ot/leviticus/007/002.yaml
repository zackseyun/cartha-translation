source:
  edition: WLC
  text: בִּ/מְק֗וֹם אֲשֶׁ֤ר יִשְׁחֲטוּ֙ אֶת הָ֣/עֹלָ֔ה יִשְׁחֲט֖וּ אֶת הָ/אָשָׁ֑ם וְ/אֶת דָּמ֛/וֹ יִזְרֹ֥ק עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/002.yaml
  text: In the place where they slaughter the burnt offering[a], they shall slaughter the guilt offering, and he shall splash its blood against the altar all around.
translation:
  language: fr
  text: À l’endroit où l’on égorge l’holocauste, on égorgera le sacrifice de réparation[a], et l’on projettera son sang sur tout le pourtour de l’autel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de culpabilité » ou « sacrifice de compensation ». Le terme hébreu évoque à la fois la culpabilité et la réparation du tort commis.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: À l’endroit où
  rationale: Rend naturellement et précisément la construction locative hébraïque.
- source_word: יִשְׁחֲטוּ / יִשְׁחֲטוּ
  choice: l’on égorge / on égorgera
  rationale: Dans un contexte sacrificiel, « égorger » désigne précisément la mise à mort rituelle; le futur français exprime ici la prescription.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: Terme français consacré pour l’offrande entièrement consumée; il reste concis et adapté au registre cultuel.
- source_word: הָאָשָׁם
  choice: le sacrifice de réparation
  rationale: אָשָׁם désigne à la fois la culpabilité et le sacrifice lié à sa réparation. Cette formulation fait entendre la dimension réparatrice sans réduire le terme à un simple dédommagement.
- source_word: דָּמוֹ
  choice: en … le sang
  rationale: Le pronom « en » rattache clairement le sang à l’animal offert, dans un français naturel.
- source_word: יִזְרֹק
  choice: projettera
  rationale: זָרַק décrit ici l’application du sang par projection, plus énergique qu’une simple aspersion.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: contre l’autel, tout autour
  rationale: « Contre » convient au mouvement de projection, et « tout autour » préserve la portée circonférentielle de סָבִיב.
theological_decisions:
- issue: Sens du terme sacrificiel אָשָׁם
  choice: sacrifice de réparation
  alternative: sacrifice de culpabilité; sacrifice de compensation
  rationale: Le terme associe culpabilité et réparation. Le choix principal conserve la catégorie sacrificielle tout en faisant ressortir sa dimension réparatrice; la note maintient les autres nuances possibles.
- issue: Sujet implicite de יִזְרֹק
  choice: le prêtre
  alternative: il
  rationale: Le singulier hébreu renvoie, dans la procédure sacrificielle, au ministre qui applique le sang. L’explicitation rend le français intelligible sans modifier l’action rituelle.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le vocabulaire sacrificiel et la succession procédurale du texte hébreu, avec une explicitation minimale du sujet sacerdotal.
