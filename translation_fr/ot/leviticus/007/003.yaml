source:
  edition: WLC
  text: וְ/אֵ֥ת כָּל חֶלְבּ֖/וֹ יַקְרִ֣יב מִמֶּ֑/נּוּ אֵ֚ת הָֽ/אַלְיָ֔ה וְ/אֶת הַ/חֵ֖לֶב הַֽ/מְכַסֶּ֥ה אֶת הַ/קֶּֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/003.yaml
  text: 'And from it he shall present all its fat: the fat tail and the fat that covers the entrails[a][b].'
translation:
  language: fr
  text: 'Il en présentera toute la graisse : la queue grasse[b] et la graisse qui couvre les entrailles[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les organes internes ».
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de la queue adipeuse du mouton, une partie grasse précise destinée au sacrifice.
    reason: cultural_note
lexical_decisions:
- source_word: חֶלְבּוֹ / הַחֵלֶב
  choice: sa graisse / la graisse
  rationale: Dans le contexte sacrificiel, חֵלֶב désigne les graisses réservées à l’offrande. « Graisse » est le terme français direct et usuel.
- source_word: יַקְרִיב
  choice: présentera
  rationale: Le hifil de קרב signifie ici présenter une partie sacrificielle. « Présentera » conserve le sens rituel sans préciser davantage l’étape du sacrifice.
- source_word: מִמֶּנּוּ
  choice: en
  rationale: Le suffixe renvoie naturellement à l’animal sacrifié. Dans « Il en présentera », le pronom français exprime avec naturel le sens de « de celui-ci ».
- source_word: הָאַלְיָה
  choice: la queue grasse
  rationale: אַלְיָה désigne la queue adipeuse du mouton, partie précise et recherchée dans ce cadre sacrificiel.
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: qui couvre les entrailles
  rationale: קֶרֶב renvoie ici aux organes internes ou viscères de l’animal. « Entrailles » est concret, intelligible et adapté à la description anatomique.
- source_word: כָּל
  choice: toute
  rationale: כָּל souligne la totalité des graisses sacrificielles désignées.
