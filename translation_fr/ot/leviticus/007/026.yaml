id: LEV.7.26
reference: Leviticus 7:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כָל דָּם֙ לֹ֣א תֹאכְל֔וּ בְּ/כֹ֖ל מוֹשְׁבֹתֵי/כֶ֑ם לָ/ע֖וֹף וְ/לַ/בְּהֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/026.yaml
  text: And you shall not eat any blood in any of your dwellings[b][a], whether from bird or from animal.
translation:
  language: fr
  text: Vous ne mangerez aucun sang, où que vous habitiez[a], qu’il provienne d’un oiseau ou d’un animal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans toutes vos habitations » ou « dans tous vos lieux de résidence ».'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « pour l’oiseau et pour l’animal » ; il s’agit du sang appartenant à ces catégories ou provenant d’elles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל דָּם
  choice: aucun sang
  rationale: 'Avec la négation, כָּל a une valeur distributive : « ne manger aucun sang ». La conjonction initiale relie cette interdiction aux prescriptions précédentes, mais il n’est pas nécessaire de la rendre par « et » en français courant.'
- source_word: לֹא תֹאכְלוּ
  choice: vous ne mangerez
  rationale: Le yiqtol à la deuxième personne du pluriel exprime ici une interdiction juridique. Le futur français conserve la force prescriptive dans un registre digne et naturel.
- source_word: בְּ/כֹל מוֹשְׁבֹתֵי/כֶם
  choice: où que vous habitiez
  rationale: Cette formulation idiomatique rend la portée distributive de בְּכֹל et le sens de מוֹשָׁב comme lieu d’habitation ou établissement.
- source_word: לָ/עוֹף וְ/לַ/בְּהֵמָה
  choice: qu’il provienne d’un oiseau ou d’un animal
  rationale: Le לְ indique ici les catégories auxquelles le sang appartient. « Provienne de » explicite naturellement cette relation en français, tandis que « ou » présente les deux catégories visées par l’interdiction.
theological_decisions:
- issue: Portée de l’interdiction concernant le sang
  choice: L’interdiction vise tout sang provenant d’oiseaux ou d’animaux, partout où les Israélites habitent.
  alternative: Rendre plus littéralement la fin par « pour l’oiseau et pour l’animal », sans expliciter la relation d’origine.
  rationale: La syntaxe hébraïque énumère le plus naturellement les catégories animales dont le sang ne doit pas être consommé. La traduction n’ajoute aucune justification théologique étrangère au verset.
translation_notes:
  register: Français international moderne, clair et digne. Le futur d’interdiction maintient le ton juridique. Les notes signalent les formulations hébraïques plus littérales sans alourdir le texte principal.
