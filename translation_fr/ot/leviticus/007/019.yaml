  text: וְ/הַ/בָּשָׂ֞ר אֲשֶׁר יִגַּ֤ע בְּ/כָל טָמֵא֙ לֹ֣א יֵֽאָכֵ֔ל בָּ/אֵ֖שׁ יִשָּׂרֵ֑ף וְ/הַ֨/בָּשָׂ֔ר כָּל טָה֖וֹר יֹאכַ֥ל בָּשָֽׂר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/019.yaml
  text: But the meat that touches anything unclean must not be eaten; it must be burned in the fire. And as for the meat, anyone who is clean may eat meat.
translation:
  language: fr
  text: Mais la viande qui touche quoi que ce soit d’impur[a] ne devra pas être mangée ; elle sera brûlée au feu. Quant à la viande, toute personne pure pourra en manger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui entre en contact avec une chose impure ». L’hébreu a un sens large et renvoie ici à l’impureté rituelle.
    reason: Alternative lexicale ; elle explicite que l’expression hébraïque vise largement ce qui est rituellement impur, sans préciser la nature de l’objet ou de la réalité en cause.
lexical_decisions:
- source_word: וְהַבָּשָׂר
  choice: Mais la viande
  rationale: Dans ce contexte sacrificiel, בָּשָׂר désigne la viande de l’offrande. « Mais » marque naturellement le contraste avec la consommation permise.
- source_word: אֲשֶׁר יִגַּע בְּכָל טָמֵא
  choice: qui aura touché quoi que ce soit d’impur
  rationale: Le verbe exprime le contact, et כָּל טָמֵא couvre largement toute réalité rituellement impure sans la préciser davantage.
- source_word: לֹא יֵאָכֵל
  choice: ne devra pas être mangée
  rationale: Cette tournure passive rend clairement la force prohibitive de l’imparfait nifal dans un français juridique actuel.
- source_word: בָּאֵשׁ יִשָּׂרֵף
  choice: elle sera brûlée au feu
  rationale: La formulation conserve l’image concrète du feu ainsi que la valeur prescriptive du passif hébreu.
- source_word: וְהַבָּשָׂר
  choice: Quant à la viande
  rationale: La reprise nominale introduit le contraste entre la viande devenue impure et celle qui peut être consommée.
- source_word: כָּל טָהוֹר
  choice: toute personne pure
  rationale: L’adjectif substantivé désigne ici toute personne se trouvant dans un état de pureté rituelle.
- source_word: יֹאכַל בָּשָׂר
  choice: pourra en manger
  rationale: L’imparfait a ici une valeur permissive. Le pronom « en » renvoie naturellement à la viande déjà mentionnée et évite une répétition lourde.
theological_decisions:
- issue: Sens de טָמֵא et טָהוֹר dans la législation sacrificielle
  choice: « impur » et « pure » au sens rituel, sans explicitation dans le corps du verset
  alternative: « souillé » et « pur », ou ajout explicite de « rituellement »
  rationale: Dans ce cadre lévitique, ces termes indiquent avant tout un statut rituel. La traduction conserve cette catégorie sans l’assimiler à une faute morale ni surcharger le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La construction légale reste nette sans archaïsmes ; « viande » convient au contexte alimentaire et sacrificiel, tandis que la note préserve l’étendue de l’expression hébraïque.
