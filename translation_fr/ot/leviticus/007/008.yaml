source:
  edition: WLC
  text: וְ/הַ֨/כֹּהֵ֔ן הַ/מַּקְרִ֖יב אֶת עֹ֣לַת אִ֑ישׁ ע֤וֹר הָֽ/עֹלָה֙ אֲשֶׁ֣ר הִקְרִ֔יב לַ/כֹּהֵ֖ן ל֥/וֹ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/008.yaml
  text: And the priest who presents a man's burnt offering shall have for himself the skin of the burnt offering that he has presented[a][b].
translation:
  language: fr
  text: Quant au prêtre qui présente l’holocauste d’un homme, la peau[a] de l’holocauste qu’il a présenté lui appartiendra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire la peau de l’animal.
    reason: source_transparency
  - marker: b
    text: 'Littéralement : « sera au prêtre, à lui ».'
    reason: source_transparency
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Rendu courant et précis de כֹּהֵן dans la législation sacrificielle; l’article défini est conservé.
- source_word: הַמַּקְרִיב / הִקְרִיב
  choice: présente / a présenté
  rationale: Le hiphil de קרב a ici le sens cultuel de présenter une offrande. « Présenter » conserve cette nuance rituelle, tandis que le passé composé exprime l’action accomplie.
- source_word: עֹלַת אִישׁ
  choice: l’holocauste d’un homme
  rationale: עֹלָה désigne l’offrande entièrement brûlée; אִישׁ est un nom masculin singulier et demeure explicitement rendu.
- source_word: עֹור
  choice: la peau
  rationale: Le terme désigne la peau de l’animal. « Peau » est naturel en français moderne; « cuir » pourrait suggérer une peau déjà traitée.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: « Holocauste » est le terme français consacré pour cette catégorie sacrificielle, sans imposer ici une paraphrase étymologique telle qu’« offrande qui monte ».
- source_word: אֲשֶׁר הִקְרִיב
  choice: qu’il a présenté
  rationale: La proposition relative se rattache naturellement à l’holocauste et identifie celui que ce prêtre a présenté.
- source_word: לַכֹּהֵן לוֹ יִהְיֶה
  choice: lui appartiendra
  rationale: Cette formulation française rend naturellement l’hébreu littéral « sera au prêtre, à lui » et indique que la peau revient au prêtre officiant.
theological_decisions:
- issue: Rendu du genre de אִישׁ
  choice: d’un homme
  alternative: de quelqu’un / d’une personne
  rationale: L’hébreu emploie explicitement le masculin singulier אִישׁ. Le conserver évite de neutraliser sans nécessité la formulation du texte source.
- issue: Terminologie cultuelle de עֹלָה
  choice: holocauste
  alternative: offrande entièrement brûlée / offrande qui monte
  rationale: « Holocauste » est le terme traditionnel et intelligible dans le contexte sacrificiel biblique; les autres rendus explicitent soit le rite, soit l’étymologie, mais s’éloignent davantage du terme cultuel établi.
- issue: Bénéficiaire de la peau
  choice: lui appartiendra
  alternative: sera pour le prêtre, pour lui
  rationale: Le redoublement hébreu souligne que la peau revient au prêtre qui officie. Le français idiomatique exprime cette attribution par « lui appartiendra » sans en modifier la portée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe « Quant au prêtre… » clarifie le thème initial sans effacer la relation entre le prêtre officiant, l’holocauste et la peau qui lui revient. Les deux appels de note [a] et [b] figurent dans le texte.
