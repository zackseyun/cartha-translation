id: LEV.7.38
reference: Leviticus 7:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה בְּ/הַ֣ר סִינָ֑י בְּ/י֨וֹם צַוֺּת֜/וֹ אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל לְ/הַקְרִ֧יב אֶת קָרְבְּנֵי/הֶ֛ם לַ/יהוָ֖ה בְּ/מִדְבַּ֥ר סִינָֽי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/038.yaml
  text: which Yahweh commanded Moses on Mount Sinai[a], on the day when he commanded the sons of Israel to present their offerings to Yahweh in the wilderness of Sinai.
translation:
  language: fr
  text: que Yahweh prescrivit à Moïse sur le mont Sinaï, le jour où il ordonna aux fils d’Israël[a] de présenter leurs offrandes à Yahweh dans le désert du Sinaï.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux Israélites » ou « au peuple d’Israël ». L’hébreu dit littéralement « aux fils d’Israël ».
    reason: Signaler les équivalents collectifs naturels tout en expliquant la formulation littérale retenue dans le texte.
lexical_decisions:
- source_word: אֲשֶׁר
  choice: que
  rationale: Introduit une proposition relative qui renvoie aux prescriptions récapitulées au verset précédent et conserve le caractère syntaxiquement dépendant du verset.
- source_word: צִוָּה
  choice: prescrivit
  rationale: Dans ce contexte légal et cultuel, « prescrire » exprime naturellement l’autorité du commandement tout en permettant au relatif « que » de reprendre les règles précédentes.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin יהוה plutôt que de lui substituer un titre.
- source_word: בְּהַר סִינָי
  choice: sur le mont Sinaï
  rationale: Rend directement la localisation indiquée par בְּהַר dans un français naturel.
- source_word: בְּיוֹם צַוֹּתוֹ
  choice: le jour où il ordonna
  rationale: Transforme naturellement en proposition verbale française l’infinitif construit muni du suffixe pronominal, tout en gardant la référence temporelle explicite.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Conserve la forme familiale et masculine explicite de l’hébreu; une note fournit les équivalents collectifs usuels.
- source_word: לְהַקְרִיב
  choice: de présenter
  rationale: Dans le contexte sacrificiel, le hifil de קרב désigne l’action d’apporter ou de présenter une offrande; « présenter » évite la répétition d’« offrir des offrandes ».
- source_word: קָרְבְּנֵיהֶם
  choice: leurs offrandes
  rationale: קרבן est ici un terme générique englobant les diverses catégories d’offrandes récapitulées dans le passage.
- source_word: בְּמִדְבַּר סִינָי
  choice: dans le désert du Sinaï
  rationale: « Désert du Sinaï » est l’expression géographique française courante et rend clairement מִדְבַּר סִינָי.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre au lieu de le remplacer par un titre.
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / le peuple d’Israël
  rationale: Le choix principal garde la métaphore familiale et le genre grammatical de l’hébreu, sans nier la valeur collective de l’expression, signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase demeure une proposition relative dépendant du contexte précédent, comme en hébreu. Le passé simple convient au registre narratif et législatif écrit.
