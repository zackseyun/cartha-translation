id: LEV.7.24
reference: Leviticus 7:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/חֵ֤לֶב נְבֵלָה֙ וְ/חֵ֣לֶב טְרֵפָ֔ה יֵעָשֶׂ֖ה לְ/כָל מְלָאכָ֑ה וְ/אָכֹ֖ל לֹ֥א תֹאכְלֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/024.yaml
  text: But the fat of an animal that dies naturally[a], and the fat of one torn by beasts, may be used for any work[b]; but you must certainly not eat it.
translation:
  language: fr
  text: La graisse d’une bête morte sans avoir été abattue[a], ou celle d’une bête déchiquetée par un animal sauvage[b], pourra servir à n’importe quel usage, mais vous ne devrez en aucun cas la manger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une bête trouvée morte ». Le terme hébreu désigne un animal mort sans avoir été convenablement abattu.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu peut aussi se traduire plus littéralement par « une bête déchirée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: graisse
  rationale: Terme français courant et exact pour la graisse animale dans les lois alimentaires et sacrificielles; « suif » serait ici trop technique et pourrait évoquer un produit déjà préparé.
- source_word: נְבֵלָה
  choice: une bête morte sans avoir été abattue
  rationale: Dans ce contexte juridique, le terme désigne la dépouille d’un animal mort autrement que par un abattage approprié. Cette formulation exprime clairement le statut de l’animal sans supposer qu’il est nécessairement mort de causes naturelles.
- source_word: טְרֵפָה
  choice: une bête déchiquetée par un animal sauvage
  rationale: Le terme évoque un animal mis en pièces par un prédateur. La formulation rend explicite l’agent probable tout en restant naturelle en français.
- source_word: יֵעָשֶׂה לְכָל מְלָאכָה
  choice: pourra servir à n’importe quel usage
  rationale: Le nifal exprime ici l’autorisation d’employer cette graisse à des fins autres qu’alimentaires. « Servir à n’importe quel usage » est naturel et conserve la portée générale de l’hébreu.
- source_word: וְאָכֹל לֹא תֹאכְלֻהוּ
  choice: mais vous ne devrez en aucun cas la manger
  rationale: La construction avec infinitif absolu renforce l’interdiction. « En aucun cas » restitue nettement cette insistance en français moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la distinction entre l’usage non alimentaire permis et l’interdiction alimentaire catégorique. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils expliquent.
