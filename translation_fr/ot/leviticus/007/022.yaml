lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le waw consécutif suivi de דבר ouvre ici une nouvelle unité de discours législatif. « Parla » rend distinctement le verbe et convient à la formule introductive.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La forme française « Yahweh » transcrit le nom divin יהוה au lieu de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition introduit le destinataire de la parole ; « à » est l’équivalent idiomatique en français.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et actuelle du nom hébreu מֹשֶׁה.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Dans cette formule d’introduction, l’infinitif לֵאמֹר annonce les paroles qui suivent. « En ces termes » est naturel en français et évite le calque pesant « en disant ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. Le rendre par « Yahweh » préserve le nom personnel tout en signalant en note la convention française traditionnelle.
translation_notes:
  register: Français international moderne, digne et fluide. La tournure « en ces termes » conserve la fonction introductive de לֵאמֹר sans reproduire servilement la syntaxe hébraïque.
