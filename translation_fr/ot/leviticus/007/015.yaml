id: LEV.7.15
reference: Leviticus 7:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בְשַׂ֗ר זֶ֚בַח תּוֹדַ֣ת שְׁלָמָ֔י/ו בְּ/י֥וֹם קָרְבָּנ֖/וֹ יֵאָכֵ֑ל לֹֽא יַנִּ֥יחַ מִמֶּ֖/נּוּ עַד בֹּֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/015.yaml
  text: And the flesh of the sacrifice of his thanksgiving peace offering shall be eaten on the day of his offering[b][a]; he shall not leave any of it until morning.
translation:
  language: fr
  text: La viande de son sacrifice de paix offert en action de grâce[a] sera mangée le jour où il le présente ; il n’en laissera rien jusqu’au matin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de son sacrifice de communion offert en action de grâce » ; plus littéralement : « du sacrifice d’action de grâce de ses sacrifices de paix ».'
    reason: La chaîne construite hébraïque est dense, et שְׁלָמִים peut aussi être rendu par « sacrifices de communion ».
lexical_decisions:
- source_word: וּבְשַׂר
  choice: La viande
  rationale: בָּשָׂר désigne ici la partie comestible de l’animal sacrifié. « Viande » est naturel et précis en français moderne dans ce contexte rituel.
- source_word: זֶבַח תּוֹדַת שְׁלָמָיו
  choice: de son sacrifice de paix offert en action de grâce
  rationale: La formulation présente l’action de grâce comme la fonction ou la sous-catégorie du sacrifice de paix, tout en conservant le terme cultuel « sacrifice de paix ». Elle exprime naturellement en français la chaîne construite dense de l’hébreu.
- source_word: בְּיוֹם קָרְבָּנוֹ
  choice: le jour où il le présente
  rationale: Le nom verbal avec suffixe masculin singulier renvoie à la présentation du sacrifice par l’offrant. La proposition verbale est plus naturelle en français que « au jour de son offrande » et garde le référent humain du suffixe.
- source_word: יֵאָכֵל
  choice: sera mangée
  rationale: Le niphal exprime ici un passif à valeur prescriptive. Le futur français conserve cette formulation législative sans l’alourdir par une paraphrase.
- source_word: לֹא יַנִּיחַ מִמֶּנּוּ
  choice: il n’en laissera rien
  rationale: Cette tournure idiomatique rend le verbe causatif « laisser » et מִמֶּנּוּ, en indiquant clairement qu’aucune portion ne doit rester.
- source_word: עַד בֹּקֶר
  choice: jusqu’au matin
  rationale: Rendu temporel direct et idiomatique.
theological_decisions:
- issue: Désignation de la catégorie sacrificielle שְׁלָמִים
  choice: sacrifice de paix
  alternative: sacrifice de communion
  rationale: « Sacrifice de paix » maintient une désignation cultuelle proche de l’hébreu et favorise la cohérence lexicale dans le Lévitique. « Sacrifice de communion » explicite davantage une interprétation de la fonction du rite.
- issue: Rapport entre תּוֹדָה et שְׁלָמִים
  choice: un sacrifice de paix offert en action de grâce
  alternative: un sacrifice d’action de grâce faisant partie de ses sacrifices de paix
  rationale: Le texte présente l’action de grâce comme un type ou une fonction du sacrifice de paix. La formulation retenue rend ce rapport sans définir davantage la théologie du rite.
translation_notes:
  register: Français international moderne, clair et digne. Le futur conserve le ton prescriptif de la législation cultuelle. Le terme traditionnel « sacrifice de paix » est maintenu, avec une autre traduction signalée en note.
