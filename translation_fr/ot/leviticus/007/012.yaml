source:
  edition: WLC
  text: אִ֣ם עַל תּוֹדָה֮ יַקְרִיבֶ/נּוּ֒ וְ/הִקְרִ֣יב עַל זֶ֣בַח הַ/תּוֹדָ֗ה חַלּ֤וֹת מַצּוֹת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֣ים בַּ/שָּׁ֑מֶן וְ/סֹ֣לֶת מֻרְבֶּ֔כֶת חַלֹּ֖ת בְּלוּלֹ֥ת בַּ/שָּֽׁמֶן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/012.yaml
  text: If he offers it as a thanksgiving offering[a], then with the sacrifice of thanksgiving he shall offer unleavened loaves mixed with oil, unleavened wafers anointed with oil[c][b], and cakes of fine flour well mixed with oil.
translation:
  language: fr
  text: S’il la présente comme offrande de reconnaissance[a], il présentera, avec le sacrifice de reconnaissance, des pains sans levain pétris avec de l’huile, des galettes sans levain enduites d’huile, ainsi que des pains de fleur de farine bien travaillée[b], pétris avec de l’huile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « offrande d’action de grâce ». Le mot hébreu désigne ici une offrande apportée en signe de reconnaissance.
    reason: lexical_alternative
  - marker: b
    text: Le procédé de préparation indiqué par le terme hébreu traduit par « bien travaillée » est incertain.
    reason: cultural_note
lexical_decisions:
- source_word: תּוֹדָה
  choice: offrande de reconnaissance
  rationale: Dans ce contexte sacrificiel, le terme désigne une offrande apportée pour exprimer la reconnaissance; cette formulation est naturelle en français moderne et garde la valeur spécifique du sacrifice.
- source_word: יַקְרִיבֶנּוּ
  choice: il la présente
  rationale: Le hifil de קרב signifie ici présenter une offrande. « Présenter » rend naturellement l’acte cultuel sans répéter trop lourdement « offrir ».
- source_word: זֶבַח הַתּוֹדָה
  choice: le sacrifice de reconnaissance
  rationale: Cette formulation conserve clairement la relation construite de l’hébreu entre le sacrifice et sa fonction de reconnaissance.
- source_word: חַלּוֹת מַצּוֹת
  choice: des pains sans levain
  rationale: חַלּוֹת désigne des pains ou gâteaux de pain, et מַצּוֹת précise qu’ils sont sans levain.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: pétris avec de l’huile
  rationale: Dans la préparation du pain, « pétris avec de l’huile » exprime idiomatiquement l’incorporation de l’huile indiquée par בלל.
- source_word: רְקִיקֵי מַצּוֹת
  choice: des galettes sans levain
  rationale: רְקִיקִים désigne des pièces de pain minces; « galettes » est plus naturel et culinairement clair que « gaufrettes » en français.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: enduites d’huile
  rationale: Le participe de משׁח signifie littéralement ointes ou enduites. Dans ce contexte alimentaire, « enduites » préserve l’action concrète sans suggérer à tort une onction personnelle ou cérémonielle.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: Expression française établie pour une farine fine et de qualité employée dans les offrandes.
- source_word: מֻרְבֶּכֶת
  choice: bien travaillée
  rationale: Le procédé culinaire exact reste incertain. « Bien travaillée » conserve l’idée d’une préparation élaborée sans préciser indûment qu’elle était bouillie, trempée ou seulement mélangée.
- source_word: חַלֹּת בְּלוּלֹת בַּשָּׁמֶן
  choice: des pains ... pétris avec de l’huile
  rationale: Le dernier groupe décrit de nouveau des pains auxquels l’huile est incorporée; la formulation conserve cette structure malgré l’incertitude liée au terme précédent.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire sacrificiel reste précis, tandis que les termes culinaires sont rendus de façon naturelle. L’incertitude de מֻרְבֶּכֶת est conservée et signalée en note.
