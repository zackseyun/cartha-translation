  timestamp: '2026-07-14T12:23:37Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : l’impératif, l’adresse aux fils d’Israël, l’acte cultuel de présenter, la double mention de l’Éternel et la relation entre l’offrande et le sacrifice de paix sont conservés. Toutefois, « prélevée sur » introduit plus explicitement l’idée d’un prélèvement matériel que le פשוט מִן (« de / provenant de ») n’énonce ici à lui seul.'
  naturalness: Le français est fluide, moderne et d’un registre juridique-cultuel approprié. « Parle aux fils d’Israël et dis-leur » est idiomatique, bien que « en ces termes » reproduise plus directement la formule d’introduction du discours.
  terminology: « Fils d’Israël », « l’Éternel », « offrande » et « sacrifice de paix » sont des rendus cohérents et naturels. La note qui présente « sacrifice d’actions de paix » comme formulation traditionnelle n’est pas adéquate en français moderne ; « sacrifice de communion » constitue l’alternative usuelle.
  issues:
  - severity: low
    issue: « prélevée sur son sacrifice de paix » est légèrement plus explicite que le texte source.
    rationale: La préposition מִן exprime que l’offrande vient du sacrifice de paix, sans préciser à ce verset l’opération de prélèvement. « provenant de » conserve la relation sans ajouter ce détail rituel.
  - severity: medium
    issue: La formulation de la note b sur l’alternative traditionnelle est imprécise.
    rationale: « Sacrifice d’actions de paix » n’est pas l’appellation française traditionnelle ou courante de שְׁלָמִים. « Sacrifice de communion » est l’alternative établie et ne doit pas être qualifiée de « traditionnellement » si cette qualification est appliquée à une expression non usuelle.
