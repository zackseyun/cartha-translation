revisions:
- from: 'Parle aux fils d’Israël[a] et dis-leur : Celui qui présente à l’Éternel son sacrifice de paix[b] apportera à l’Éternel son offrande, prélevée sur son sacrifice de paix.'
  to: 'Parle aux fils d’Israël[a] en ces termes : Celui qui présente à l’Éternel son sacrifice de paix[b] apportera à l’Éternel son offrande provenant de son sacrifice de paix.'
  rationale: La révision remplace une expression qui pouvait surinterpréter la préposition « de » par une formulation française fidèle à sa valeur de provenance. Elle corrige également la note terminologique tout en maintenant le choix principal « sacrifice de paix », qui préserve le lien lexical avec שׁלמים. La formule introductive est légèrement resserrée afin de refléter naturellement « parle … en disant ».
