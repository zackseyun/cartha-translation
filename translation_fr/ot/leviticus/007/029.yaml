source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַ/מַּקְרִ֞יב אֶת זֶ֤בַח שְׁלָמָי/ו֙ לַ/יהוָ֔ה יָבִ֧יא אֶת קָרְבָּנ֛/וֹ לַ/יהוָ֖ה מִ/זֶּ֥בַח שְׁלָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/029.yaml
  text: 'Speak to the sons of Israel[b][a], saying: The one who presents his peace sacrifice to Yahweh shall bring his offering to Yahweh from his peace sacrifice.'
translation:
  language: fr
  text: 'Parle aux fils d’Israël[a] en ces termes : Celui qui présente à l’Éternel son sacrifice de paix[b] apportera à l’Éternel son offrande provenant de son sacrifice de paix.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les enfants d’Israël » ou « les Israélites ». L’hébreu dit littéralement « les fils d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Ou « son sacrifice de communion ». Le terme hébreu désigne une catégorie de sacrifices liée à la paix, au bien-être et à la communion.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר ... לֵאמֹר
  choice: Parle ... et dis-leur
  rationale: Cette tournure française naturelle conserve l’impératif et introduit explicitement l’instruction directe.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Rend formellement l’expression hébraïque masculine plurielle tout en gardant son sens collectif et allianceux.
- source_word: הַמַּקְרִיב
  choice: Celui qui présente
  rationale: Le hiphil de קרב exprime ici l’action cultuelle d’apporter ou de présenter une offrande; « présente » garde cette nuance sans se confondre avec le sacrifice lui-même.
- source_word: זֶבַח שְׁלָמָיו
  choice: son sacrifice de paix
  rationale: « Sacrifice » rend זֶבַח et « de paix » maintient le lien lexical de שְׁלָמִים avec la paix et le bien-être; le singulier français désigne naturellement cette catégorie rituelle.
- source_word: לַיהוָה
  choice: à l’Éternel
  rationale: Convention française courante et digne pour le tétragramme, distincte du titre « Seigneur ».
- source_word: יָבִיא
  choice: apportera
  rationale: Le futur français prend ici une valeur prescriptive adaptée au contexte juridique.
- source_word: קָרְבָּנוֹ
  choice: son offrande
  rationale: Terme général, clair et usuel pour ce qui est apporté devant Dieu.
- source_word: מִזֶּבַח שְׁלָמָיו
  choice: prélevée sur son sacrifice de paix
  rationale: 'Explicite en français la relation partitive marquée par מִן : l’offrande apportée provient du sacrifice de paix.'
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: l’Éternel
  alternative: Yahvé
  rationale: « L’Éternel » est une convention française largement reconnue pour le nom divin; « Yahvé » rendrait plus directement sa forme reconstruite. Le choix évite de le réduire au simple titre « Seigneur ».
- issue: Terminologie de שְׁלָמִים
  choice: sacrifice de paix
  alternative: sacrifice de communion
  rationale: « Sacrifice de paix » préserve le rapport lexical avec שׁלם sans imposer que la communion soit l’unique portée théologique du rite.
- issue: Adresse collective genrée
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le texte hébreu dit formellement « les fils d’Israël »; la note signale les équivalents collectifs possibles sans neutraliser silencieusement la formulation source.
translation_notes:
  register: Français international moderne, digne et lisible. Le tour juridique reste prescriptif sans archaïsme marqué. Les répétitions de « à l’Éternel » et « sacrifice de paix » sont conservées parce qu’elles structurent l’instruction hébraïque.
