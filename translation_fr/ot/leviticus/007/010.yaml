base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/010.yaml
  text: And every grain offering mixed with oil[a], or dry, shall belong to all the sons of Aaron, each alike with his brother.
translation:
  language: fr
  text: Toute offrande de céréales, mélangée à l’huile ou sèche, appartiendra à tous les fils d’Aaron, à chacun autant qu’à son frère.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un homme comme son frère ». Cette expression hébraïque indique que chacun des fils d’Aaron recevra une part égale.'
    reason: Précision sur l’idiome distributif hébreu et sur le sens de la formulation française.
lexical_decisions:
- source_word: מִנְחָה
  choice: offrande de céréales
  rationale: Dans le contexte sacrificiel du Lévitique, le terme désigne l’offrande faite de produits céréaliers plutôt qu’une offrande générique.
- source_word: בְלוּלָה בַשֶּׁמֶן
  choice: mélangée à l’huile
  rationale: Cette formulation rend naturellement en français le participe passif décrivant la préparation de l’offrande.
- source_word: חֲרֵבָה
  choice: sèche
  rationale: L’adjectif est conservé dans sa concision et maintient le contraste lexical avec l’offrande mélangée à l’huile, sans expliciter excessivement « sans huile ».
- source_word: לְכָל בְּנֵי אַהֲרֹן תִּהְיֶה
  choice: appartiendra à tous les fils d’Aaron
  rationale: Le tour avec לְ et היה exprime ici l’attribution ou la possession; le futur français convient à la prescription juridique.
- source_word: בְּנֵי אַהֲרֹן
  choice: fils d’Aaron
  rationale: La désignation masculine est maintenue, car elle renvoie dans ce cadre juridique aux prêtres issus d’Aaron.
- source_word: אִישׁ כְּאָחִיו
  choice: à chacun comme à son frère
  rationale: La formulation conserve l’image comparative et la valeur distributive de l’expression hébraïque, tandis que la note précise qu’elle implique une répartition égale.
theological_decisions:
- issue: Langage masculin relatif au sacerdoce
  choice: fils d’Aaron… chacun… son frère
  alternative: descendants d’Aaron… à parts égales
  rationale: Le texte hébreu emploie explicitement des termes masculins de parenté dans une règle sacerdotale; les conserver évite de neutraliser le référent historique et juridique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe juridique reste concise; « offrande de céréales » est accessible et précis dans le contexte cultuel.
