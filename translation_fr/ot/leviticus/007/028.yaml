lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol de דבר ouvre une nouvelle unité de discours. Le passé simple convient au registre narratif français et distingue « parler » de אמר, « dire ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre afin de conserver le nom divin présent dans le texte hébreu.
- source_word: אֶל־מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל désigne ici le destinataire de la parole; « à Moïse » est l’expression française naturelle.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'Dans cette formule introductive, l’infinitif de אמר annonce les paroles qui suivent. « En ces termes : » évite le calque peu naturel « disant » et prépare clairement le discours direct.'
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme, nom propre du Dieu d’Israël. « Yahweh » le conserve plutôt que de lui substituer un titre traditionnel.
translation_notes:
  register: Français international moderne, digne et naturel. Le passé simple maintient le ton narratif biblique sans archaïsme excessif; les deux-points signalent que le discours commence au verset suivant.
