reference: Leviticus 16:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה אַחֲרֵ֣י מ֔וֹת שְׁנֵ֖י בְּנֵ֣י אַהֲרֹ֑ן בְּ/קָרְבָתָ֥/ם לִ/פְנֵי יְהוָ֖ה וַ/יָּמֻֽתוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/001.yaml
  text: And Yahweh spoke to Moses after the death of Aaron’s two sons[a], when they came near before Yahweh and died.
translation:
  language: fr
  text: Yahweh parla à Moïse après la mort des deux fils d’Aaron, lorsqu’ils s’approchèrent de Yahweh[a] et moururent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « lors de leur approche devant Yahweh ».'
    reason: La note rend compte de la construction nominale hébraïque et de la précision « devant Yahweh », tout en permettant un français courant dans le texte.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר, dans cette formule narrative introduisant une parole divine, se rend naturellement par « parla ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin, et non remplacé par un titre.
- source_word: אַחֲרֵי מוֹת
  choice: après la mort
  rationale: Cette construction signifie idiomatiquement « après la mort de » ; le singulier désigne ici l’événement au cours duquel les deux fils sont morts.
- source_word: שְׁנֵי בְּנֵי אַהֲרֹן
  choice: les deux fils d’Aaron
  rationale: Cette formulation française restitue clairement la chaîne construite, le lien familial et le nombre.
- source_word: בְּקָרְבָתָם
  choice: lorsqu’ils s’approchèrent
  rationale: La préposition ב devant l’infinitif construit, muni du suffixe de troisième personne du pluriel, a ici une valeur temporelle. « S’approchèrent » conserve aussi la portée cultuelle possible de קרב.
- source_word: לִפְנֵי יְהוָה
  choice: de la présence de Yahweh
  rationale: Cette formulation française naturelle conserve l’idée de se tenir ou de venir devant Yahweh, sans réduire l’expression à une simple proximité physique.
- source_word: וַיָּמֻתוּ
  choice: et moururent
  rationale: La coordination directe préserve la brièveté et la succession narrative de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme ; « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Portée de l’approche devant Yahweh
  choice: lorsqu’ils s’approchèrent de la présence de Yahweh
  alternative: lorsqu’ils se présentèrent devant Yahweh
  rationale: Le choix retenu maintient l’idée d’approche exprimée par קרב ainsi que la référence à la présence divine, sans préciser davantage la nature ni la causalité de cette approche.
translation_notes:
  register: Français moderne, digne et lisible. La syntaxe suit de près l’enchaînement hébreu tout en évitant le tour peu naturel « s’approcher devant ». Le rapport entre l’approche et la mort reste simplement temporel, sans ajout explicite de causalité.
