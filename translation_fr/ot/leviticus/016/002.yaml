source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה דַּבֵּר֮ אֶל אַהֲרֹ֣ן אָחִי/ךָ֒ וְ/אַל יָבֹ֤א בְ/כָל עֵת֙ אֶל הַ/קֹּ֔דֶשׁ מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת אֶל פְּנֵ֨י הַ/כַּפֹּ֜רֶת אֲשֶׁ֤ר עַל הָ/אָרֹן֙ וְ/לֹ֣א יָמ֔וּת כִּ֚י בֶּֽ/עָנָ֔ן אֵרָאֶ֖ה עַל הַ/כַּפֹּֽרֶת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/002.yaml
  text: And Yahweh said to Moses[a], “Tell Aaron your brother that he must not come at just any time into the Holy Place, inside the veil, before the atonement cover that is on the ark, so that he may not die. For I will appear in the cloud over the atonement cover.”
translation:
  language: fr
  text: 'Yahweh dit à Moïse : « Dis à ton frère Aaron de ne pas entrer à n’importe quel moment dans le lieu saint, au-delà du voile, devant le couvercle d’expiation[a] qui est sur l’arche, afin qu’il ne meure pas. Car j’apparaîtrai dans la nuée au-dessus du couvercle d’expiation. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « propitiatoire », traduction traditionnelle du terme désignant le couvercle de l’arche associé aux rites d’expiation.
    reason: alternative lexicale traditionnelle
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: דַּבֵּר אֶל אַהֲרֹן אָחִיךָ
  choice: Dis à ton frère Aaron
  rationale: Cette formulation française naturelle conserve la force de l’impératif et exprime clairement le lien familial indiqué par l’hébreu.
- source_word: וְאַל יָבֹא בְכָל עֵת
  choice: de ne pas entrer à n’importe quel moment
  rationale: La négation porte sur un accès sans restriction, et non sur une entrée continuelle. La formulation retenue rend clairement cette interdiction en français courant.
- source_word: הַקֹּדֶשׁ
  choice: le lieu saint
  rationale: Dans ce contexte, le terme désigne l’espace sacré intérieur. « Le lieu saint » reste compréhensible et proche de la désignation hébraïque.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: au-delà du voile
  rationale: L’expression situe l’espace du côté intérieur du voile. « Au-delà du voile » est idiomatique en français et évite de surinterpréter l’orientation spatiale.
- source_word: הַכַּפֹּרֶת
  choice: le couvercle d’expiation
  rationale: Ce choix désigne concrètement le couvercle de l’arche tout en conservant son association avec les rites d’expiation. Le terme traditionnel « propitiatoire » est signalé en note.
- source_word: הָאָרֹן
  choice: l’arche
  rationale: Le texte hébreu dit simplement « l’arche » ; aucun complément comme « de l’alliance » n’est ajouté.
- source_word: וְלֹא יָמוּת
  choice: afin qu’il ne meure pas
  rationale: La formulation rend la conséquence à éviter sans employer le tour aujourd’hui soutenu ou vieilli « de peur qu’il ne meure ».
- source_word: כִּי בֶעָנָן אֵרָאֶה
  choice: Car j’apparaîtrai dans la nuée
  rationale: « Car » introduit la raison de l’interdiction, tandis que le futur rend naturellement la forme verbale hébraïque dans ce contexte déclaratif.
theological_decisions:
- issue: Sens cultuel de כַּפֹּרֶת
  choice: couvercle d’expiation
  alternative: propitiatoire
  rationale: La traduction retenue garde ensemble l’objet concret placé sur l’arche et sa fonction dans le rite d’expiation, sans imposer au lecteur un terme théologique peu transparent. Le terme français traditionnel est conservé en note.
- issue: Portée de בְּכָל עֵת
  choice: interdiction d’entrer à n’importe quel moment
  alternative: ne pas entrer en tout temps
  rationale: Le contexte porte sur l’accès non autorisé au sanctuaire intérieur. La formulation choisie exprime cette restriction sans suggérer qu’Aaron y entrait continuellement.
- issue: Valeur de la présence divine dans la nuée
  choice: j’apparaîtrai dans la nuée
  alternative: j’apparais dans la nuée
  rationale: Le futur convient à l’avertissement et à la déclaration divine en français, tout en laissant intacte l’affirmation selon laquelle Yahweh se manifeste au-dessus du couvercle.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement de l’hébreu sans reproduire ses tournures de manière artificielle. Le vocabulaire cultuel est explicité avec sobriété, et le terme traditionnel est préservé en note.
