source:
  edition: WLC
  text: וְ/אֵ֛ת חֵ֥לֶב הַֽ/חַטָּ֖את יַקְטִ֥יר הַ/מִּזְבֵּֽחָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/025.yaml
  text: And he shall burn the fat of the sin offering on the altar[a].
translation:
  language: fr
  text: Il fera fumer sur l’autel la graisse du sacrifice pour le péché[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification ». Le terme hébreu peut désigner le sacrifice servant à la purification du péché ou de l’impureté.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: Il
  rationale: La conjonction rattache cette prescription à la séquence rituelle précédente. En français, elle peut rester implicite afin d’éviter un « Et » peu naturel, tandis que le pronom reprend naturellement le prêtre mentionné dans le contexte.
- source_word: חֵלֶב
  choice: la graisse
  rationale: Le terme désigne la graisse sacrificielle réservée à l’autel. « La graisse » traduit directement l’hébreu sans ajouter l’idée explicite de portions.
- source_word: הַחַטָּאת
  choice: du sacrifice pour le péché
  rationale: Dans la législation sacrificielle, le terme désigne couramment le sacrifice lié au péché. Cette formulation est claire en français moderne et évite que « offrande » soit compris comme un simple don; l’autre valeur fonctionnelle, « sacrifice de purification », est conservée en note.
- source_word: יַקְטִיר
  choice: fera fumer
  rationale: Le hifil de קטר désigne l’action rituelle de faire brûler une matière sur l’autel de manière à la faire monter en fumée. « Fera fumer » conserve cette nuance sacrificielle mieux que le simple « brûlera ».
- source_word: הַמִּזְבֵּחָה
  choice: sur l’autel
  rationale: Bien que la forme comporte un suffixe directionnel, le contexte exige en français le lieu où la graisse est consumée; « sur l’autel » est l’expression idiomatique.
theological_decisions:
- issue: Traduction de חַטָּאת dans la législation sacrificielle
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le mot hébreu peut désigner le péché ou le sacrifice associé à l’expiation et à la purification. Le texte principal retient l’expression traditionnelle et immédiatement intelligible, sans exclure la dimension purificatrice, signalée en note.
translation_notes:
  register: Français international moderne, simple et digne. La formulation « fera fumer » maintient la précision cultuelle de l’hébreu; la note préserve l’ambiguïté fonctionnelle de חַטָּאת.
