source:
  edition: WLC
  text: וְ/נָשָׂ֨א הַ/שָּׂעִ֥יר עָלָ֛י/ו אֶת כָּל עֲוֺנֹתָ֖/ם אֶל אֶ֣רֶץ גְּזֵרָ֑ה וְ/שִׁלַּ֥ח אֶת הַ/שָּׂעִ֖יר בַּ/מִּדְבָּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/022.yaml
  text: The goat shall carry on itself all their iniquities to a cut-off land[a], and he shall send the goat away into the wilderness.
translation:
  language: fr
  text: Le bouc portera sur lui toutes leurs fautes jusqu’à une terre retranchée[a], et il enverra le bouc dans le désert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une terre isolée », « une terre inaccessible » ou « une terre désolée ». Le terme hébreu désigne probablement un lieu séparé ou éloigné des régions habitées.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂא
  choice: portera
  rationale: Le verbe נשׂא signifie ici « porter » et conserve l’image concrète du bouc chargé des fautes.
- source_word: הַשָּׂעִיר
  choice: le bouc
  rationale: שׂעיר désigne ici un bouc; ce terme français précis et naturel convient au contexte rituel.
- source_word: עָלָיו
  choice: sur lui
  rationale: La préposition avec suffixe indique que les fautes reposent sur le bouc; « sur lui » suit naturellement le genre grammatical de « bouc ».
- source_word: כָּל עֲוֺנֹתָם
  choice: toutes leurs fautes
  rationale: עָוֹן peut désigner la faute, l’iniquité ou la culpabilité. « Fautes » garde ici la portée morale et cultuelle sans suggérer uniquement le sentiment de culpabilité.
- source_word: אֶל אֶרֶץ גְּזֵרָה
  choice: jusqu’à une terre isolée
  rationale: גְּזֵרָה est rare et évoque vraisemblablement un lieu coupé ou séparé. « Terre isolée » exprime cette idée en français naturel tout en maintenant l’incertitude dans une note.
- source_word: וְשִׁלַּח
  choice: puis l’homme lâchera
  rationale: שׁלח désigne ici l’action de laisser partir ou d’envoyer le bouc. « Lâchera » convient au geste rituel. Le sujet masculin singulier implicite renvoie naturellement à l’homme mentionné au verset précédent.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne une région sauvage, aride et inhabitée; « désert » est courant et naturel dans ce contexte.
theological_decisions:
- issue: Image du bouc portant les fautes
  choice: Conserver l’affirmation concrète selon laquelle le bouc porte sur lui les fautes du peuple.
  alternative: Paraphraser par « emportera leurs péchés » ou « enlèvera leurs péchés ».
  rationale: Le texte hébreu présente une image rituelle de transfert et d’éloignement. La formulation retenue préserve cette image sans lui imposer une interprétation doctrinale ultérieure.
- issue: Sens de אֶרֶץ גְּזֵרָה
  choice: Traduire par « une terre isolée » dans le texte principal.
  alternative: « une terre coupée du monde », « une terre inaccessible » ou « une terre désolée ».
  rationale: L’expression hébraïque est rare et son sens exact demeure incertain. « Isolée » rend l’idée probable de séparation tout en évitant de trancher abusivement entre les nuances possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en étant idiomatique. « Puis » explicite simplement la succession des deux actions coordonnées; « l’homme » rétablit le sujet implicite d’après le contexte immédiat.
