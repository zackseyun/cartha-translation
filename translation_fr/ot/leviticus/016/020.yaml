base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/020.yaml
  text: When he has finished making atonement for the sanctuary[a], the tent of meeting, and the altar[c][b], he shall present the live goat.
translation:
  language: fr
  text: Quand il aura fini de faire l’expiation[a] pour le sanctuaire[b], la tente de la rencontre et l’autel, il présentera[c] le bouc vivant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, « faire l’expiation » peut aussi désigner l’accomplissement d’une purification rituelle.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le lieu saint ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « il fera approcher » ; c’est-à-dire qu’il le présentera pour l’étape suivante du rite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה מִכַּפֵּר
  choice: Quand il aura fini de faire l’expiation
  rationale: La tournure temporelle exprime naturellement l’achèvement préalable du rite avant l’action suivante; « faire l’expiation » conserve le terme cultuel sans en préciser excessivement le mécanisme.
- source_word: הַקֹּדֶשׁ
  choice: le sanctuaire
  rationale: Dans le contexte du jour des Expiations, le mot désigne l’espace sacré; « sanctuaire » est clair et digne en français moderne, tout en laissant possible « lieu saint ».
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette formulation rend directement les deux éléments de l’expression hébraïque et demeure compréhensible en français courant.
- source_word: הַמִּזְבֵּחַ
  choice: l’autel
  rationale: Équivalent français direct du terme cultuel.
- source_word: וְהִקְרִיב
  choice: il présentera
  rationale: Le verbe signifie littéralement « faire approcher »; ici, « présenter » exprime naturellement l’introduction du bouc dans l’étape rituelle suivante.
- source_word: הַשָּׂעִיר הֶחָי
  choice: le bouc vivant
  rationale: Cette expression concise maintient le contraste avec le bouc déjà immolé.
theological_decisions:
- issue: Sens de כפר appliqué aux espaces sacrés
  choice: faire l’expiation
  alternative: effectuer la purification rituelle
  rationale: Le verbe peut évoquer ici la purification ou la purgation du sanctuaire, mais « faire l’expiation » conserve sa portée cultuelle plus large sans imposer une théorie particulière; une note signale l’autre nuance.
- issue: Identification de הַקֹּדֶשׁ
  choice: le sanctuaire
  alternative: le lieu saint
  rationale: « Sanctuaire » indique clairement l’espace sacré dans ce contexte, sans trancher plus précisément que ne le fait le terme hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe suit clairement la succession des rites, et les termes cultuels traditionnels sont conservés sans archaïsme inutile.
