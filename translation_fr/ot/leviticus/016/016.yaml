  variant: modern international French
source:
  edition: WLC
  text: וְ/כִפֶּ֣ר עַל הַ/קֹּ֗דֶשׁ מִ/טֻּמְאֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/מִ/פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/כֵ֤ן יַעֲשֶׂה֙ לְ/אֹ֣הֶל מוֹעֵ֔ד הַ/שֹּׁכֵ֣ן אִתָּ֔/ם בְּ/ת֖וֹךְ טֻמְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/016.yaml
  text: Thus he shall make atonement for the sanctuary because of the uncleannesses of the sons of Israel and because of their transgressions[a], for all their sins[c][b]; and so he shall do for the tent of meeting that dwells with them in the midst of their uncleannesses.
translation:
  language: fr
  text: Il fera l’expiation[c] pour le sanctuaire[a], à cause des impuretés des Israélites[b], de leurs transgressions et de tous leurs péchés. Il fera de même pour la tente de la rencontre, qui demeure avec eux au milieu de leurs impuretés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le lieu saint ». Dans ce contexte rituel, l’hébreu הַקֹּדֶשׁ peut désigner le sanctuaire ou le lieu saint.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « des fils d’Israël », expression qui désigne ici collectivement les Israélites.
    reason: lexical_alternative
  - marker: c
    text: Dans ce contexte du jour des Expiations, « faire l’expiation » comporte aussi l’idée de purifier le sanctuaire de l’impureté et du péché.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: Il fera ainsi l’expiation
  rationale: Dans ce contexte rituel du jour des Expiations, כפר désigne l’acte qui traite à la fois l’impureté et le péché. « Faire l’expiation » conserve cette portée cultuelle sans la réduire à la seule purification.
- source_word: עַל הַקֹּדֶשׁ
  choice: pour le sanctuaire
  rationale: הַקֹּדֶשׁ désigne ici l’espace sacré concerné par le rite. « Sanctuaire » est naturel en français et ne précise pas indûment une subdivision particulière.
- source_word: מִטֻּמְאֹת
  choice: à cause des impuretés
  rationale: Avec כפר, la préposition מִן présente ici les impuretés comme le motif ou la cause du rite. Le pluriel « impuretés » préserve la forme et la catégorie rituelle de l’hébreu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: des Israélites
  rationale: « Israélites » exprime naturellement en français la désignation collective בְּנֵי יִשְׂרָאֵל, sans laisser entendre qu’il s’agit uniquement des hommes adultes.
- source_word: וּמִפִּשְׁעֵיהֶם
  choice: et de leurs transgressions
  rationale: פשע évoque une faute grave, voire une rébellion. « Transgressions » en conserve la gravité morale sans imposer dans chaque cas la nuance explicite de révolte.
- source_word: לְכָל חַטֹּאתָם
  choice: pour tous leurs péchés
  rationale: Dans le parallélisme avec les impuretés et les transgressions, חטאות désigne le plus naturellement les péchés plutôt que les sacrifices pour le péché. La formulation garde la relation syntaxique distincte exprimée par לְ.
- source_word: וְכֵן יַעֲשֶׂה
  choice: Il fera de même
  rationale: Cette expression indique que le rite correspondant doit aussi être accompli pour la tente de la rencontre.
- source_word: לְאֹהֶל מוֹעֵד
  choice: pour la tente de la rencontre
  rationale: Cette traduction transparente de אֹהֶל מוֹעֵד conserve l’image de la tente et sa fonction de lieu de rencontre, sans recourir au terme traditionnel moins immédiatement clair « tabernacle ».
- source_word: הַשֹּׁכֵן אִתָּם
  choice: qui demeure avec eux
  rationale: Le participe שׁכן qualifie la tente et souligne sa présence durable avec le peuple. « Demeure avec eux » préserve cette nuance relationnelle et locative.
- source_word: בְּתוֹךְ טֻמְאֹתָם
  choice: au milieu de leurs impuretés
  rationale: La formulation conserve la métaphore spatiale et le contraste théologique entre la présence du sanctuaire et les impuretés du peuple.
theological_decisions:
- issue: Portée de כפר dans le contexte du jour des Expiations
  choice: faire l’expiation
  alternative: purifier; débarrasser de l’impureté
  rationale: Le rite concerne à la fois la contamination rituelle du sanctuaire et les péchés du peuple. « Faire l’expiation » maintient cette ampleur cultuelle et théologique, tandis que la note signale la dimension purificatrice.
- issue: Référent de בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël; le peuple d’Israël
  rationale: L’expression hébraïque désigne collectivement la communauté d’Israël. Le français idiomatique « les Israélites » inclut naturellement l’ensemble du peuple sans modifier le référent.
- issue: Sens de חַטֹּאתָם
  choice: leurs péchés
  alternative: leurs sacrifices pour le péché
  rationale: Le parallélisme avec « impuretés » et « transgressions » favorise le sens de fautes commises. Traduire par « sacrifices pour le péché » introduirait ici un objet rituel que le contexte syntaxique n’exige pas.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire cultuel nécessaire (« expiation », « sanctuaire », « impuretés », « transgressions ») est conservé, avec des notes pour les principales possibilités lexicales. La répétition d’« impuretés » et la tension entre la demeure sacrée et l’impureté du peuple sont maintenues.
