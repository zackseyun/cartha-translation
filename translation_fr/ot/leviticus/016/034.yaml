source:
  edition: WLC
  text: וְ/הָֽיְתָה זֹּ֨את לָ/כֶ֜ם לְ/חֻקַּ֣ת עוֹלָ֗ם לְ/כַפֵּ֞ר עַל בְּנֵ֤י יִשְׂרָאֵל֙ מִ/כָּל חַטֹּאתָ֔/ם אַחַ֖ת בַּ/שָּׁנָ֑ה וַ/יַּ֕עַשׂ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/034.yaml
  text: This shall be for you a permanent statute[a], to make atonement for the sons of Israel for all their sins once in the year[b]. And he did as Yahweh commanded Moses.
translation:
  language: fr
  text: 'Ce sera pour vous une prescription permanente : faire expiation pour les fils d’Israël[a], pour tous leurs péchés[b], une fois par an. Il fit comme Yahweh l’avait ordonné à Moïse.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites » ou « le peuple d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Ou « de tous leurs péchés », formulation qui peut souligner la nuance de purification.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה זֹּאת לָכֶם
  choice: Ce sera pour vous
  rationale: Rend directement la formulation juridique prospective de l’hébreu dans un français actuel et digne.
- source_word: לְחֻקַּת עוֹלָם
  choice: une prescription permanente
  rationale: חֻקָּה désigne une règle établie, et עוֹלָם marque ici sa durée continue dans le cadre de l’alliance. « Prescription permanente » conserve la portée juridique sans archaïsme inutile.
- source_word: לְכַפֵּר
  choice: faire l’expiation
  rationale: Dans le contexte sacerdotal de Lévitique 16, כפר désigne l’acte rituel d’expiation. La tournure retenue préserve ce vocabulaire cultuel central.
- source_word: עַל בְּנֵי יִשְׂרָאֵל
  choice: pour les fils d’Israël
  rationale: La préposition exprime ici l’action accomplie en faveur du groupe désigné littéralement comme les « fils d’Israël ». Une formulation collective plus idiomatique est signalée en note.
- source_word: מִכָּל חַטֹּאתָם
  choice: pour tous leurs péchés
  rationale: Cette formulation française naturelle relie l’expiation à l’ensemble de leurs péchés. La valeur possible de séparation ou de purification portée par מִן est conservée en note.
- source_word: אַחַת בַּשָּׁנָה
  choice: une fois par an
  rationale: Rend naturellement l’idiome hébreu indiquant une périodicité annuelle.
- source_word: וַיַּעַשׂ
  choice: Il agit
  rationale: Le verbe hébreu a un sujet masculin singulier implicite. « Il agit » le laisse implicite en français au lieu d’introduire un nom absent du verset.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: comme Yahweh l’avait ordonné à Moïse
  rationale: Exprime la conformité de l’action à l’ordre divin transmis à Moïse et rend directement le nom divin יהוה par « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom d’alliance sans le remplacer par un titre.
- issue: Portée de l’expiation en מִכָּל חַטֹּאתָם
  choice: pour tous leurs péchés
  alternative: de tous leurs péchés
  rationale: La traduction principale exprime naturellement ce à quoi se rapporte l’expiation, tandis que l’alternative peut davantage évoquer la purification ou la délivrance des péchés. La note préserve cette tension lexicale.
- issue: Identification du sujet de וַיַּעַשׂ
  choice: 'sujet masculin laissé implicite : « Il »'
  alternative: Aaron agit
  rationale: Le contexte peut orienter vers Aaron, mais le verset ne le nomme pas. La traduction évite donc d’expliciter une identification absente de l’hébreu.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La structure juridique et le vocabulaire cultuel sont conservés, tout en employant l’expression idiomatique « une fois par an ». Le sujet masculin de la dernière phrase demeure non identifié, comme dans l’hébreu.
