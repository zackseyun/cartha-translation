  text: וְ/הִזָּ֨ה עָלָ֧י/ו מִן הַ/דָּ֛ם בְּ/אֶצְבָּע֖/וֹ שֶׁ֣בַע פְּעָמִ֑ים וְ/טִהֲר֣/וֹ וְ/קִדְּשׁ֔/וֹ מִ/טֻּמְאֹ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/019.yaml
  text: He shall sprinkle some of the blood on it with his finger seven times[c][b][a], and cleanse it and consecrate it from the uncleannesses of the sons of Israel.
translation:
  language: fr
  text: Avec son doigt, il aspergera sept fois l’autel de sang, puis il le purifiera[a] et le consacrera[b] des impuretés des fils d’Israël[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le rendra rituellement pur ». Le verbe hébreu est un terme sacerdotal courant désignant le passage à l’état de pureté rituelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « le sanctifiera », c’est-à-dire le mettra à part comme saint.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « les fils d’Israël » ; l’expression désigne collectivement les Israélites, le peuple d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: il aspergera
  rationale: Le hiphil de נזה désigne ici l’aspersion rituelle du sang. « Asperger » est le verbe français précis et courant dans ce contexte sacerdotal.
- source_word: עָלָיו
  choice: l’autel
  rationale: Le pronom renvoie à l’autel mentionné au verset précédent. La reprise explicite de l’antécédent évite en français une formulation maladroite comme « asperger dessus ».
- source_word: מִן־הַדָּם
  choice: d’une partie du sang
  rationale: 'La préposition מִן a ici une valeur partitive : le prêtre prélève du sang disponible pour en asperger l’autel.'
- source_word: בְּאֶצְבָּעוֹ
  choice: avec son doigt
  rationale: Le beth instrumental indique le moyen employé.
- source_word: שֶׁבַע פְּעָמִים
  choice: sept fois
  rationale: La formulation conserve exactement la répétition rituelle prescrite.
- source_word: וְטִהֲרוֹ
  choice: il le purifiera
  rationale: Dans le langage sacerdotal, טהר signifie rendre rituellement pur. « Purifier » exprime clairement cette action sans lui donner un sens moral intérieur.
- source_word: וְקִדְּשׁוֹ
  choice: il le consacrera
  rationale: קדש signifie ici mettre l’autel à part comme saint. « Consacrer » est précis, naturel et moins technique que « sanctifier ».
- source_word: מִטֻּמְאֹת
  choice: des impuretés
  rationale: Le pluriel est conservé. « Impuretés » rend la catégorie rituelle sans suggérer simplement de la saleté physique.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette expression reproduit la forme masculine collective de l’hébreu tout en restant familière dans le registre biblique français.
theological_decisions:
- issue: La purification rituelle de l’autel
  choice: L’autel est purifié des impuretés rituelles d’Israël, puis consacré.
  alternative: Employer « nettoyer » ou comprendre les verbes comme une transformation morale ou spirituelle.
  rationale: Le passage décrit l’effet d’un rite sacerdotal sur un objet du sanctuaire. « Purifier » et « consacrer » préservent ce cadre cultuel sans importer la notion d’une conversion morale.
- issue: Portée de מִטֻּמְאֹת sur les deux verbes
  choice: Rattacher explicitement « des impuretés » à « purifier », tout en présentant la consécration comme le second résultat du même geste.
  alternative: Traduire littéralement « le purifiera et le consacrera des impuretés », formulation possible en structure mais peu naturelle en français moderne.
  rationale: La syntaxe hébraïque associe les deux effets rituels avant de nommer les impuretés dont l’autel est dégagé. La formulation française préserve les deux effets sans produire une construction obscure.
- issue: Traduction de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites ; le peuple d’Israël
  rationale: La traduction principale garde la forme masculine collective du texte hébreu; une note fournit les équivalents collectifs plus idiomatiques.
translation_notes:
  register: Français international moderne, sobre et digne. La première phrase explicite l’antécédent du pronom hébreu (« l’autel »), tandis que « Par là » relie naturellement l’aspersion à ses deux effets rituels. Les termes sacerdotaux restent accessibles sans effacer leur précision.
