revisions:
- from: Avec son doigt, il aspergera l’autel sept fois d’une partie du sang. Par là, il le purifiera[a] des impuretés des fils d’Israël[c] et le consacrera[b].
  to: Avec son doigt, il aspergera sept fois l’autel de sang, puis il le purifiera[a] et le consacrera[b] des impuretés des fils d’Israël[c].
  rationale: La révision remplace le calque « d’une partie du sang » par le partitif français idiomatique « de sang » et réunit les deux verbes finaux dans une construction qui reflète plus directement leur coordination en hébreu. Elle conserve l’ambiguïté syntaxique selon laquelle le complément « des impuretés des fils d’Israël » suit l’ensemble « purifiera et consacrera », sans lui imposer une portée doctrinale.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:26:01Z'
