  verdict: revise
  source_fidelity: La traduction rend correctement l’aspersion rituelle, l’instrument (« avec son doigt »), le nombre de sept occurrences, ainsi que la purification et la consécration de l’autel. Toutefois, « d’une partie du sang » est un calque partitif pesant en français ; « du sang » exprime naturellement la même valeur. La relation finale aux impuretés est mieux conservée en maintenant les deux verbes dans une même proposition, sans faire de « Par là » un ajout interprétatif.
  naturalness: Le français est globalement clair et de registre approprié. « Aspergera l’autel sept fois d’une partie du sang » est toutefois moins idiomatique que « aspergera sept fois l’autel de sang ». La reprise « Par là » est compréhensible mais inutile ; une phrase coordonnée suit plus directement le mouvement de l’hébreu.
  terminology: « Asperger », « purifier », « consacrer » et « impuretés » sont des équivalents justes dans le registre rituel sacerdotal. « Les fils d’Israël » respecte la forme explicite de l’hébreu et la note en explique l’emploi collectif.
