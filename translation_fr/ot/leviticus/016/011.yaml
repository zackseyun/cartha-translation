base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/011.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household[b]; then he shall slaughter the bull of the sin offering that is for himself.
translation:
  language: fr
  text: Aaron présentera le taureau du sacrifice pour le péché qui lui est destiné[a] et fera l’expiation pour lui-même et pour sa maisonnée[b] ; puis il égorgera le taureau du sacrifice pour le péché qui lui est destiné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le taureau destiné au sacrifice pour le péché ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pour lui-même et pour sa maison » ; ici, la « maison » désigne les personnes de sa maisonnée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: présentera
  rationale: Le hiphil de קרב signifie couramment « faire approcher, présenter » dans un contexte sacrificiel. « Présentera » convient au rite sans anticiper l’immolation mentionnée ensuite.
- source_word: פַּר הַחַטָּאת
  choice: le taureau du sacrifice pour le péché
  rationale: Cette formulation rend le rapport construit entre le taureau et le sacrifice, tout en employant une terminologie sacrificielle claire en français moderne.
- source_word: אֲשֶׁר לוֹ
  choice: qui est pour lui
  rationale: Dans ce contexte rituel, la formule indique que l’animal est destiné à Aaron et offert en sa faveur, plutôt qu’elle ne souligne sa simple possession. La formulation conserve aussi une légère ambiguïté du tour hébreu.
- source_word: וְכִפֶּר
  choice: fera l’expiation
  rationale: Dans les textes sacerdotaux, כפר désigne l’accomplissement rituel de l’expiation. Cette traduction consacrée n’impose pas de théorie particulière quant à son mécanisme.
- source_word: בַּעֲדוֹ וּבְעַד בֵּיתוֹ
  choice: pour lui-même et pour sa maisonnée
  rationale: בעד exprime l’idée d’agir en faveur de quelqu’un. « Maisonnée » rend ici ביתו comme l’ensemble des personnes de sa maison, et non le bâtiment.
- source_word: וְשָׁחַט
  choice: puis il égorgera
  rationale: שׁחט est le terme usuel pour l’immolation d’un animal. « Puis » exprime naturellement la succession indiquée par la coordination hébraïque.
- source_word: פַּר הַחַטָּאת אֲשֶׁר לוֹ
  choice: le taureau du sacrifice pour le péché qui est pour lui
  rationale: La répétition de l’expression est conservée afin de respecter l’insistance et la précision rituelles de l’hébreu.
theological_decisions:
- issue: Traduction du vocabulaire sacrificiel de כפר
  choice: fera l’expiation
  alternative: accomplira le rite d’expiation ; effectuera la purification
  rationale: « Faire l’expiation » préserve le sens sacerdotal traditionnel sans réduire le verbe à la seule purification ni introduire une conception doctrinale ultérieure du mécanisme de l’expiation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la progression rituelle de l’hébreu. « Maisonnée » évite de faire comprendre qu’Aaron accomplit l’expiation pour un bâtiment, tandis que la note conserve l’expression littérale.
