source:
  edition: WLC
  text: וְ/הַ/שָּׂעִ֗יר אֲשֶׁר֩ עָלָ֨ה עָלָ֤י/ו הַ/גּוֹרָל֙ לַ/עֲזָאזֵ֔ל יָֽעֳמַד חַ֛י לִ/פְנֵ֥י יְהוָ֖ה לְ/כַפֵּ֣ר עָלָ֑י/ו לְ/שַׁלַּ֥ח אֹת֛/וֹ לַ/עֲזָאזֵ֖ל הַ/מִּדְבָּֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/010.yaml
  text: But the goat on which the lot for Azazel fell shall be presented alive before Yahweh[a], to make atonement over it[b], to send it away into the wilderness to Azazel.
translation:
  language: fr
  text: Mais le bouc sur lequel est tombé le sort pour Azazel sera présenté vivant devant Yahweh[a], afin de faire l’expiation sur lui[b] et de l’envoyer à Azazel, dans le désert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « pour le bouc émissaire ». Le sens du terme hébreu « Azazel » est discuté : il peut s’agir d’un nom propre ou d’un terme associé à l’éloignement.'
    reason: alternative_reading
  - marker: b
    text: Ou « afin de faire l’expiation pour lui ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשָּׂעִיר
  choice: Mais le bouc
  rationale: שָׂעִיר désigne ici un bouc. « Mais » marque naturellement le contraste avec le bouc offert en sacrifice au verset précédent.
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל
  choice: sur lequel est tombé le sort
  rationale: Cette formulation française idiomatique rend l’expression hébraïque désignant le résultat du tirage au sort.
- source_word: לַעֲזָאזֵל
  choice: pour Azazel
  rationale: Le sens de עֲזָאזֵל est controversé. La translittération préserve l’ambiguïté au lieu d’imposer l’interprétation traditionnelle « bouc émissaire ».
- source_word: יָעֳמַד חַי
  choice: sera présenté vivant
  rationale: Le hophal de עמד exprime ici le fait que le bouc est placé ou présenté devant Yahweh; cette tournure est naturelle en français et conserve la valeur causative-passive.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » rend directement לִפְנֵי dans ce cadre rituel; « Yahweh » représente explicitement le nom divin יהוה.
- source_word: לְכַפֵּר עָלָיו
  choice: afin d’accomplir sur lui le rite d’expiation
  rationale: « Accomplir le rite d’expiation » exprime clairement la valeur cultuelle de כפר, tandis que « sur lui » maintient la préposition עַל sans décider si le bouc est bénéficiaire ou support rituel.
- source_word: לְשַׁלַּח אֹתוֹ
  choice: et de l’envoyer
  rationale: L’infinitif indique le but; « envoyer » convient au déplacement du bouc vers sa destination.
- source_word: הַמִּדְבָּרָה
  choice: dans le désert
  rationale: La terminaison directionnelle indique un mouvement vers le désert; « dans » le rend naturellement en français.
theological_decisions:
- issue: Sens de עֲזָאזֵל
  choice: Azazel, translittéré
  alternative: le bouc émissaire; l’élimination complète
  rationale: Le mot peut désigner un nom propre, un lieu ou une notion liée à l’éloignement. La translittération conserve cette incertitude réelle, et la note signale l’autre lecture importante.
- issue: Valeur de לְכַפֵּר עָלָיו
  choice: accomplir sur lui le rite d’expiation
  alternative: faire l’expiation pour lui
  rationale: « Sur lui » respecte la préposition hébraïque et évite de préciser indûment si l’expiation est faite au bénéfice du bouc ou rituellement sur lui.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en étant naturelle; les ambiguïtés concernant Azazel et la portée de l’expiation sont expressément préservées.
