review_pass:
  verdict: revise
  source_fidelity: Le texte rend correctement le contraste, le bouc, le sort « pour Azazel », la présentation vivante devant Yahweh et l’envoi vers le désert. Toutefois, « accomplir sur lui le rite d’expiation » ajoute « rite », absent de l’hébreu, et affaiblit la correspondance directe avec לְכַפֵּר. « Faire l’expiation sur lui » est à la fois plus fidèle et suffisamment intelligible, tout en préservant la portée discutée de עָלָיו.
  naturalness: La formulation est globalement naturelle en français moderne. La révision allège la périphrase cultuelle sans perdre le registre solennel. « À Azazel, dans le désert » place plus clairement les deux compléments de destination sans identifier indûment Azazel au désert.
  terminology: « Bouc », « sort », « Azazel », « Yahweh », « expiation » et « désert » sont appropriés. La translittération d’Azazel conserve à juste titre l’ambiguïté du terme. La note sur l’alternative « bouc émissaire » reste utile.
  issues:
  - severity: low
    issue: Ajout interprétatif de « rite » dans « accomplir sur lui le rite d’expiation ».
    rationale: Le substantif « rite » ne correspond à aucun terme explicite dans לְכַפֵּר עָלָיו. Il est préférable de rendre directement l’expression par « faire l’expiation sur lui », ce qui maintient aussi la préposition « sur ».
  - severity: low
    issue: 'Enchaînement final légèrement ambigu : « dans le désert, à Azazel ».'
    rationale: L’ordre « à Azazel, dans le désert » reflète plus clairement les deux expressions hébraïques successives, sans trancher la nature d’Azazel.
  revised_text: Mais le bouc sur lequel est tombé le sort pour Azazel sera présenté vivant devant Yahweh[a], afin de faire l’expiation sur lui[b] et de l’envoyer à Azazel, dans le désert.
  revised_footnotes:
