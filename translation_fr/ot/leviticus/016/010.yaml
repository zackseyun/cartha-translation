revisions:
- from: Mais le bouc sur lequel est tombé le sort pour Azazel sera présenté vivant devant Yahweh[a], afin d’accomplir sur lui le rite d’expiation[b] et de l’envoyer dans le désert, à Azazel.
  to: Mais le bouc sur lequel est tombé le sort pour Azazel sera présenté vivant devant Yahweh[a], afin de faire l’expiation sur lui[b] et de l’envoyer à Azazel, dans le désert.
  rationale: La révision supprime l’ajout lexical « rite » et emploie une formulation française directe qui correspond plus étroitement à « faire expiation sur lui ». Elle clarifie aussi l’ordre des compléments finals tout en conservant l’ambiguïté textuelle concernant Azazel.
