    text: 'Ou « pour le bouc émissaire ». Le sens du terme hébreu « Azazel » est discuté : il peut s’agir d’un nom propre ou d’un terme associé à l’éloignement.'
    reason: alternative_reading
  - marker: b
    text: Ou « afin de faire l’expiation pour lui ».
    reason: lexical_alternative
  revision_rationale: La révision supprime l’ajout lexical « rite » et emploie une formulation française directe qui correspond plus étroitement à « faire expiation sur lui ». Elle clarifie aussi l’ordre des compléments finals tout en conservant l’ambiguïté textuelle concernant Azazel.
