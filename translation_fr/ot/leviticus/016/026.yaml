revisions:
- from: Celui qui aura conduit le bouc jusqu’à Azazel[a] lavera ses vêtements et se lavera le corps dans l’eau. Après cela, il pourra rentrer dans le camp.
  to: Celui qui envoie le bouc à Azazel[a] lavera ses vêtements et se lavera le corps dans l’eau. Après cela, il pourra entrer dans le camp.
  rationale: La révision rend le participe hébreu par un présent substantivé, évite de préciser indûment qu’Azazel est un lieu atteint, et emploie « entrer » pour le verbe d’entrée dans le camp. La note continue de signaler loyalement les lectures concurrentes sans trancher le débat.
