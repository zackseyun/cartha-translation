  text: וְ/הַֽ/מְשַׁלֵּ֤חַ אֶת הַ/שָּׂעִיר֙ לַֽ/עֲזָאזֵ֔ל יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/רָחַ֥ץ אֶת בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/אַחֲרֵי כֵ֖ן יָב֥וֹא אֶל הַֽ/מַּחֲנֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/026.yaml
  text: The one who sends the goat away to Azazel shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp.
translation:
  language: fr
  text: Celui qui envoie le bouc à Azazel[a] lavera ses vêtements et se lavera le corps dans l’eau. Après cela, il pourra entrer dans le camp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour Azazel ». Le sens du terme hébreu est discuté. Il peut être compris comme un nom propre ou une désignation, ou interprété de manière fonctionnelle comme se rapportant à l’éloignement ou au « bouc émissaire ».
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַמְשַׁלֵּחַ
  choice: Celui qui aura conduit…
  rationale: Le participe substantivé désigne la personne chargée d’éloigner le bouc. Le futur antérieur français situe naturellement cette action avant les ablutions prescrites.
- source_word: הַשָּׂעִיר
  choice: le bouc
  rationale: שָׂעִיר désigne ici le bouc mâle déjà identifié dans le rituel; « bouc » est précis et idiomatique.
- source_word: לַעֲזָאזֵל
  choice: jusqu’à Azazel
  rationale: La translittération conserve l’ambiguïté du terme contesté. Dans le contexte de l’envoi du bouc, « jusqu’à » exprime naturellement la destination sans définir ce qu’est Azazel.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: lavera ses vêtements
  rationale: Formulation claire et actuelle de l’expression rituelle prescrivant le lavage des vêtements.
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ בַּמָּיִם
  choice: et se lavera le corps dans l’eau
  rationale: « Le corps » rend naturellement בָּשָׂר dans ce contexte d’ablution, tandis que « dans l’eau » maintient la formulation hébraïque.
- source_word: וְאַחֲרֵי כֵן
  choice: Après cela
  rationale: Marque clairement la succession temporelle imposée par le rite.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: il pourra rentrer dans le camp
  rationale: Le verbe exprime ici l’entrée rendue possible après les ablutions. « Rentrer » convient puisqu’il s’agit du retour au camp après en être sorti.
theological_decisions:
- issue: Sens de לַעֲזָאזֵל dans le rituel du jour des expiations
  choice: Conserver « Azazel » comme désignation translittérée
  alternative: pour l’éloignement; comme bouc émissaire; vers une figure du désert
  rationale: L’identité ou le sens d’Azazel demeure discuté. La translittération évite d’imposer une interprétation étymologique, rituelle ou théologique que le verset lui-même ne précise pas.
translation_notes:
  register: Français moderne, digne et accessible. Le futur conserve la tonalité prescriptive du texte légal; « pourra rentrer » explicite sobrement la permission rituelle consécutive aux ablutions.
