  verdict: revise
  source_fidelity: Le texte hébreu désigne substantivement la personne qui envoie le bouc à/vers Azazel, puis énonce les ablutions et l’entrée ultérieure dans le camp. « Aura conduit ... jusqu’à » transforme inutilement le participe en action achevée et ajoute l’idée d’une arrivée à un lieu, alors que le sens précis de לַעֲזָאזֵל demeure disputé.
  naturalness: La formulation révisée est naturelle en français moderne et conserve le registre prescriptif et rituel du passage. « Entrer dans le camp » correspond plus directement à אֶל־הַמַּחֲנֶה que « rentrer dans le camp », sans présupposer davantage que ne le fait le texte.
  terminology: « Bouc », « Azazel », « vêtements », « corps » et « camp » conviennent. La translittération d’« Azazel » préserve à juste titre l’ambiguïté du terme. La note est reformulée afin de présenter les possibilités sans laisser entendre qu’une étymologie ou une interprétation particulière est établie.
  issues:
  - severity: medium
    issue: « Celui qui aura conduit le bouc jusqu’à Azazel »
    rationale: Le futur antérieur ne rend pas bien le participe substantivé (« celui qui envoie ») et « jusqu’à » ajoute une destination localisée et atteinte. Le préfixe ל־ et le référent d’Azazel étant disputés, « à Azazel » conserve mieux l’ambiguïté.
  - severity: low
    issue: « rentrer dans le camp »
    rationale: Bien que cohérent avec le contexte, « rentrer » explicite un retour; le verbe hébreu signifie directement « entrer/venir dans ». « Entrer dans le camp » est plus fidèle.
  - severity: low
    issue: Formulation de la note sur « bouc émissaire »
    rationale: La tournure « d’où l’expression traditionnelle » peut suggérer une dérivation établie. Il vaut mieux présenter cette compréhension comme une interprétation possible parmi d’autres.
  revised_text: Celui qui envoie le bouc à Azazel[a] lavera ses vêtements et se lavera le corps dans l’eau. Après cela, il pourra entrer dans le camp.
  revised_footnotes:
