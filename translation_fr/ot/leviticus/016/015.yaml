  text: וְ/שָׁחַ֞ט אֶת שְׂעִ֤יר הַֽ/חַטָּאת֙ אֲשֶׁ֣ר לָ/עָ֔ם וְ/הֵבִיא֙ אֶת דָּמ֔/וֹ אֶל מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת וְ/עָשָׂ֣ה אֶת דָּמ֗/וֹ כַּ/אֲשֶׁ֤ר עָשָׂה֙ לְ/דַ֣ם הַ/פָּ֔ר וְ/הִזָּ֥ה אֹת֛/וֹ עַל הַ/כַּפֹּ֖רֶת וְ/לִ/פְנֵ֥י הַ/כַּפֹּֽרֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/015.yaml
  text: Then he shall slaughter the goat of the sin offering that is for the people[a], and bring its blood inside the veil, and do with its blood as he did with the blood of the bull, and sprinkle it on the atonement cover and before the mercy seat.
translation:
  language: fr
  text: 'Il égorgera ensuite le bouc du sacrifice pour le péché destiné au peuple. Il apportera son sang derrière le voile et fera avec ce sang ce qu’il a fait avec celui du taureau : il en fera l’aspersion sur le couvercle d’expiation[a] et devant celui-ci.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « le propitiatoire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: Il égorgera ensuite
  rationale: Le verbe désigne l’abattage rituel. Le futur français convient à la suite d’instructions, et « ensuite » rend la progression marquée par le waw.
- source_word: שְׂעִיר הַחַטָּאת אֲשֶׁר לָעָם
  choice: le bouc du sacrifice pour le péché destiné au peuple
  rationale: « Bouc » rend שְׂעִיר dans ce contexte, tandis que « sacrifice pour le péché » exprime la fonction cultuelle de חַטָּאת. « Destiné au peuple » distingue cet animal du taureau offert pour Aaron.
- source_word: וְהֵבִיא אֶת דָּמוֹ אֶל מִבֵּית לַפָּרֹכֶת
  choice: Il apportera son sang derrière le voile
  rationale: La tournure spatiale hébraïque désigne l’espace situé au-delà du voile. « Derrière le voile » est naturel en français et indique clairement l’entrée dans le sanctuaire intérieur.
- source_word: וְעָשָׂה אֶת דָּמוֹ כַּאֲשֶׁר עָשָׂה לְדַם הַפָּר
  choice: fera avec ce sang ce qu’il a fait avec celui du taureau
  rationale: La formulation conserve l’ellipse de l’hébreu tout en rendant explicite en français la comparaison entre les deux rites sanglants.
- source_word: וְהִזָּה אֹתוֹ
  choice: il en fera l’aspersion
  rationale: « Faire l’aspersion » est un terme cultuel français précis et compréhensible; le pronom « en » renvoie sans ambiguïté au sang.
- source_word: עַל הַכַּפֹּרֶת וְלִפְנֵי הַכַּפֹּרֶת
  choice: sur le couvercle d’expiation et devant celui-ci
  rationale: « Couvercle » identifie l’objet comme le dessus de l’arche, et « d’expiation » préserve le lien lexical et rituel avec la racine כפר. « Devant celui-ci » évite une répétition lourde tout en maintenant la distinction spatiale entre « sur » et « devant ».
theological_decisions:
- issue: Traduction de הַכַּפֹּרֶת
  choice: le couvercle d’expiation
  alternative: le propitiatoire
  rationale: La traduction choisie décrit concrètement l’objet et conserve sa fonction dans le rite d’expiation, sans imposer une interprétation confessionnelle. Le terme français traditionnel est signalé en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur maintient la valeur prescriptive du passage. La terminologie cultuelle reste précise sans archaïsme inutile.
