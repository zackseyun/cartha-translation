  text: וְ/אֵת֩ פַּ֨ר הַֽ/חַטָּ֜את וְ/אֵ֣ת שְׂעִ֣יר הַֽ/חַטָּ֗את אֲשֶׁ֨ר הוּבָ֤א אֶת דָּמָ/ם֙ לְ/כַפֵּ֣ר בַּ/קֹּ֔דֶשׁ יוֹצִ֖יא אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֑ה וְ/שָׂרְפ֣וּ בָ/אֵ֔שׁ אֶת עֹרֹתָ֥/ם וְ/אֶת בְּשָׂרָ֖/ם וְ/אֶת פִּרְשָֽׁ/ם׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/027.yaml
  text: And the bull for the sin offering and the goat for the sin offering, whose blood was brought in to make atonement in the sanctuary, he shall bring out to outside the camp, and they shall burn their hides, their flesh, and their dung in the fire.
translation:
  language: fr
  text: Quant au taureau du sacrifice pour le péché et au bouc du sacrifice pour le péché, dont le sang a été apporté dans le sanctuaire pour faire l’expiation, il les fera sortir hors du camp[a], et ils brûleront au feu leurs peaux, leur chair et leurs excréments[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici un verbe au singulier (« il fera sortir »), puis passe au pluriel pour l’action de brûler (« ils brûleront »).
    reason: cultural_note
  - marker: b
    text: Ou « leur fumier ». Le mot hébreu désigne les matières excrémentielles contenues dans les animaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר הַחַטָּאת / שְׂעִיר הַחַטָּאת
  choice: taureau du sacrifice pour le péché / bouc du sacrifice pour le péché
  rationale: Rend clairement la catégorie sacrificielle חַטָּאת dans un français actuel, tout en conservant le parallélisme hébreu.
- source_word: הוּבָא אֶת־דָּמָם
  choice: dont le sang a été apporté dans le sanctuaire
  rationale: Le passif de בוא indique que leur sang a été introduit dans l’espace sacré; «dans le sanctuaire» explicite naturellement la direction suggérée par le contexte.
- source_word: לְכַפֵּר בַּקֹּדֶשׁ
  choice: pour faire l’expiation dans le sanctuaire
  rationale: «Faire l’expiation» conserve le vocabulaire cultuel de כפר sans réduire son sens à la seule purification; הַקֹּדֶשׁ désigne ici le sanctuaire.
- source_word: יוֹצִיא אֶל־מִחוּץ לַמַּחֲנֶה
  choice: on les fera sortir hors du camp
  rationale: Le causatif singulier est rendu de façon impersonnelle et naturelle; «hors du camp» exprime à la fois le mouvement et la destination.
- source_word: וְשָׂרְפוּ בָאֵשׁ
  choice: puis on brûlera au feu
  rationale: Le pluriel hébreu à sujet non exprimé se prête à un «on» indéfini en français. «Au feu» garde l’expression instrumentale ou locative du texte.
- source_word: עֹרֹתָם
  choice: leur peau
  rationale: Pour des carcasses animales, «peau» est le terme français courant et exact; le singulier collectif distributif est naturel après les deux animaux.
- source_word: בְּשָׂרָם
  choice: leur chair
  rationale: «Chair» est le terme cultuel précis et usuel pour les tissus des animaux sacrifiés.
- source_word: פִּרְשָׁם
  choice: leurs excréments
  rationale: Le terme désigne les matières excrémentielles plutôt que les entrailles en général; «excréments» est exact et digne.
theological_decisions:
- issue: Sens cultuel de חַטָּאת et כפר
  choice: sacrifice pour le péché; faire l’expiation
  alternative: sacrifice de purification; accomplir la purification
  rationale: Les choix retenus sont accessibles et traditionnels sans imposer une théorie particulière de l’expiation. Ils préservent la fonction rituelle du passage.
- issue: Passage du singulier יוֹצִיא au pluriel וְשָׂרְפוּ
  choice: on les fera sortir… puis on brûlera
  alternative: il les fera sortir… puis ils brûleront
  rationale: Le français impersonnel garde l’indétermination des agents et évite d’attribuer avec certitude la première action à Aaron. Une note signale toutefois le changement de nombre présent dans l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La formulation impersonnelle avec «on» convient au style prescriptif et conserve l’indétermination des sujets. Les marqueurs de notes [a] et [b] figurent dans le texte.
