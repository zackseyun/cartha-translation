  naturalness: Le texte est globalement naturel et de registre approprié. « Il les fera sortir … et ils brûleront » reste clair dans le style législatif et rend visible l’alternance de nombre sans identifier indûment les agents.
  terminology: « sacrifice pour le péché », « faire l’expiation », « sanctuaire », « chair » et « excréments » sont des choix recevables. « Leurs peaux » reflète plus directement le pluriel hébreu pour les peaux des deux animaux.
