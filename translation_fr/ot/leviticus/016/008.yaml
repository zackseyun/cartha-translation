id: LEV.16.8
reference: Leviticus 16:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נָתַ֧ן אַהֲרֹ֛ן עַל שְׁנֵ֥י הַ/שְּׂעִירִ֖ם גּוֹרָל֑וֹת גּוֹרָ֤ל אֶחָד֙ לַ/יהוָ֔ה וְ/גוֹרָ֥ל אֶחָ֖ד לַ/עֲזָאזֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/008.yaml
  text: 'And Aaron shall cast lots over the two goats: one lot for Yahweh and one lot for Azazel[a].'
translation:
  language: fr
  text: 'Aaron tirera au sort entre les deux boucs : un lot pour le SEIGNEUR et un lot pour Azazel[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un lot pour le bouc émissaire ». Le sens du terme hébreu « Azazel » est discuté : il peut être compris comme un nom propre, comme la fonction du bouc ou comme un terme lié à l’éloignement.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַן
  choice: tirera au sort
  rationale: Le verbe signifie littéralement « donner, mettre », mais son emploi avec « lots » décrit ici l’acte rituel de tirer au sort. Cette formulation est naturelle en français.
- source_word: עַל שְׁנֵי הַשְּׂעִירִם
  choice: entre les deux boucs
  rationale: Littéralement « sur les deux boucs ». En français, « tirer au sort entre les deux boucs » exprime clairement que le tirage sert à leur attribuer les deux destinations, sans modifier le sens du rite.
- source_word: גּוֹרָלוֹת
  choice: au sort
  rationale: Dans cette construction, le pluriel désigne le procédé rituel du tirage au sort; les résultats distincts sont ensuite désignés par « un lot ».
- source_word: גּוֹרָל אֶחָד
  choice: un lot
  rationale: La répétition de cette expression marque l’attribution distincte de chacun des deux boucs.
- source_word: לַיהוָה
  choice: pour le SEIGNEUR
  rationale: Le tétragramme est rendu selon la convention française traditionnelle par « le SEIGNEUR »; la préposition indique l’attribution du lot.
- source_word: לַעֲזָאזֵל
  choice: pour Azazel
  rationale: Le terme hébreu étant très discuté, sa translittération conserve l’ambiguïté entre nom propre, fonction du bouc et idée d’éloignement.
theological_decisions:
- issue: Sens de עֲזָאזֵל dans le rituel du jour des expiations
  choice: Conserver « Azazel » comme translittération dans le texte principal
  alternative: « le bouc émissaire », « l’éloignement complet » ou une figure liée au désert
  rationale: Le verset ne permet pas de déterminer avec certitude si le mot désigne un être, une destination, la fonction du bouc ou son éloignement. La translittération préserve cette tension sans imposer une interprétation.
translation_notes:
  register: Français international moderne, clair et digne. Le futur simple rend la prescription rituelle. « Boucs » précise naturellement le sexe indiqué par le nom hébreu. La formulation évite de trancher le sens controversé d’Azazel.
