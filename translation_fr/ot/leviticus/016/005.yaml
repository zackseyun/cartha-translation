id: LEV.16.5
reference: Leviticus 16:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/מֵ/אֵ֗ת עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל יִקַּ֛ח שְׁנֵֽי שְׂעִירֵ֥י עִזִּ֖ים לְ/חַטָּ֑את וְ/אַ֥יִל אֶחָ֖ד לְ/עֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/005.yaml
  text: And from the congregation of the sons of Israel he shall take two male goats for a sin offering and one ram for a burnt offering[a][b].
translation:
  language: fr
  text: Il prendra de la communauté des fils d’Israël[a] deux boucs pour un sacrifice pour le péché[b] et un bélier pour un holocauste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « des Israélites » ou « du peuple d’Israël ». Hébreu : « des fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « un sacrifice de purification ». Dans le Lévitique, le terme hébreu חַטָּאת peut désigner le sacrifice qui traite le péché et l’impureté rituelle.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵאֵת
  choice: de
  rationale: La préposition indique la provenance des animaux. En français, la continuité avec le verset précédent n’exige pas de rendre mécaniquement la conjonction וְ par « et ».
- source_word: עֲדַת
  choice: communauté
  rationale: עֵדָה désigne ici la collectivité d’Israël. « Communauté » est naturel en français moderne et convient au contexte cultuel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression masculine représentative de l’hébreu, qui désigne collectivement le peuple d’Israël. Une note donne les équivalents idiomatiques.
- source_word: יִקַּח
  choice: il prendra
  rationale: L’imparfait hébreu a ici une valeur prescriptive. Le futur français exprime naturellement l’instruction rituelle.
- source_word: שְׁנֵי שְׂעִירֵי עִזִּים
  choice: deux boucs
  rationale: Le groupe nominal désigne deux caprins mâles. « Boucs » exprime clairement et avec concision l’espèce et le sexe.
- source_word: לְחַטָּאת
  choice: pour un sacrifice pour le péché
  rationale: Dans ce contexte sacrificiel, חַטָּאת désigne l’offrande rituelle et non simplement le péché abstrait. Cette traduction reste transparente, tandis que la fonction purificatrice possible est signalée en note.
- source_word: וְאַיִל אֶחָד
  choice: et un bélier
  rationale: אַיִל désigne précisément un bélier. En français, l’article indéfini exprime naturellement ici l’unité indiquée par אֶחָד.
- source_word: לְעֹלָה
  choice: pour un holocauste
  rationale: « Holocauste » est le terme français traditionnel et précis pour l’offrande entièrement brûlée désignée par עֹלָה.
theological_decisions:
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / le peuple d’Israël
  rationale: Le texte principal préserve la forme explicite de l’hébreu sans nier sa portée collective; la note indique les formulations idiomatiques possibles.
- issue: Sens cultuel de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le terme peut mettre en jeu à la fois le traitement du péché et celui de l’impureté rituelle. Le choix principal conserve l’appellation française largement reconnue, et la note maintient ouverte la nuance purificatrice.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de l’instruction rituelle hébraïque, avec des termes cultuels compréhensibles et établis.
