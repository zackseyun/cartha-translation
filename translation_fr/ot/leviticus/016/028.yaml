  text: וְ/הַ/שֹּׂרֵ֣ף אֹתָ֔/ם יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/רָחַ֥ץ אֶת בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/אַחֲרֵי כֵ֖ן יָב֥וֹא אֶל הַֽ/מַּחֲנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/028.yaml
  text: The one who burns them shall wash his clothes and bathe his body in water[b][a], and afterward he may come into the camp.
translation:
  language: fr
  text: Celui qui les brûle lavera ses vêtements et se lavera le corps dans l’eau[a]. Après cela, il pourra rentrer dans le camp[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sa chair ». Dans cette formule de lavage rituel, il s’agit de son corps.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il rentrera dans le camp ». Le verbe hébreu peut exprimer un simple futur, mais il indique probablement ici que le retour est permis après la purification.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַשֹּׂרֵף
  choice: Celui qui les brûlera
  rationale: Le participe substantivé avec l’article désigne la personne chargée de brûler les restes mentionnés au verset précédent. En français normatif, le futur convient naturellement à cette prescription rituelle.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom objet renvoie au taureau et au bouc, ou à leurs restes, dans le contexte immédiat.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: lavera ses vêtements
  rationale: L’imparfait hébreu a ici une valeur prescriptive. Le futur français conserve le ton législatif tout en restant naturel.
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ בַּמָּיִם
  choice: et baignera son corps dans l’eau
  rationale: בשר signifie littéralement « chair », mais désigne ici le corps dans une formule de purification par lavage. « Baignera son corps » distingue cette action du lavage des vêtements.
- source_word: וְאַחֲרֵי כֵן
  choice: Après cela
  rationale: Cette locution marque clairement la succession entre les ablutions requises et le retour au camp.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: il pourra rentrer dans le camp
  rationale: Dans ce contexte rituel, le verbe indique vraisemblablement que le retour est permis après la purification. « Rentrer » exprime naturellement une réintégration dans le camp sans ajouter d’idée étrangère au contexte.
theological_decisions:
- issue: Valeur rituelle de la proposition finale
  choice: '« il pourra rentrer dans le camp » : permission de revenir après la purification'
  alternative: '« il rentrera dans le camp » : simple futur ou prescription'
  rationale: L’enchaînement du passage présente le lavage comme la condition préalable au retour. La formulation permissive rend cette logique, tout en signalant en note que la forme hébraïque peut aussi se lire comme un futur simple.
translation_notes:
  register: Français international moderne, clair et digne. Le futur garde la tonalité prescriptive du texte législatif; « vêtements », « corps » et « rentrer dans le camp » sont courants sans être familiers. Les appels de notes suivent immédiatement les segments concernés.
