  text: וְ/הִקְרִ֤יב אַהֲרֹן֙ אֶת הַ/שָּׂעִ֔יר אֲשֶׁ֨ר עָלָ֥ה עָלָ֛י/ו הַ/גּוֹרָ֖ל לַ/יהוָ֑ה וְ/עָשָׂ֖/הוּ חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/009.yaml
  text: Then Aaron shall present the goat on which the lot for Yahweh fell[a], and make it a sin offering.
translation:
  language: fr
  text: Puis Aaron présentera le bouc sur lequel le sort pour Yahweh est tombé[a], et il en fera un sacrifice pour le péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « le bouc sur lequel est monté le sort pour Yahweh ».'
    reason: La construction hébraïque emploie le verbe « monter » à propos du sort ; le texte principal utilise l’expression française idiomatique « le sort est tombé sur ».
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: présentera
  rationale: Dans ce contexte rituel, le verbe désigne le fait d’amener l’animal devant Yahweh en vue du sacrifice. « Présentera » conserve cette étape sans anticiper l’acte d’offrir exprimé par la suite.
- source_word: הַשָּׂעִיר
  choice: le bouc
  rationale: שׂעיר désigne ici un caprin mâle. « Bouc » est précis, naturel en français et adapté au vocabulaire sacrificiel.
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל
  choice: sur lequel le sort … est tombé
  rationale: « Le sort est tombé sur » rend naturellement l’idiome hébreu עלה עליו הגורל et exprime l’attribution obtenue par tirage au sort.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל marque la destination ou l’attribution du bouc, tandis que le nom divin est rendu explicitement par « Yahweh ».
- source_word: וְעָשָׂהוּ חַטָּאת
  choice: et il en fera un sacrifice pour le péché
  rationale: Dans la législation sacrificielle, חטאת désigne ici le sacrifice destiné au traitement rituel du péché. La formulation française conserve le verbe « faire » tout en explicitant le sens cultuel.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel d’alliance et distingue celui-ci d’un simple titre.
- issue: Sens sacrificiel de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice d’expiation
  rationale: « Sacrifice pour le péché » reste proche de la désignation hébraïque sans imposer dans le nom du sacrifice une théorie particulière de son mécanisme. « Sacrifice d’expiation » est traditionnel, mais interprète davantage.
translation_notes:
  register: Français moderne, digne et accessible. « Bouc » précise le sexe de l’animal; « sacrifice pour le péché » privilégie la transparence sur le terme traditionnel « sacrifice d’expiation ».
