  to: Il revêtira la tunique sacrée en lin et portera sur son corps les sous-vêtements de lin ; il nouera autour de lui la ceinture de lin et enroulera autour de sa tête le turban de lin. Ce sont des vêtements sacrés. Il se lavera le corps avec de l’eau, puis les revêtira.
  rationale: La révision limite les changements à une tournure française plus naturelle pour le turban tout en préservant l’idée d’enroulement du verbe hébreu, et supprime une note dont le prétendu littéral est imprécis et ne signale aucune ambiguïté textuelle pertinente. L’ordre lavage-habillement est conservé.
