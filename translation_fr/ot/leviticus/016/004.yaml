  naturalness: Le français est globalement moderne et clair. « Il s’enveloppera la tête du turban » est cependant moins idiomatique que « enroulera ... autour de sa tête ».
  terminology: « Tunique », « sous-vêtements », « ceinture », « turban » et « vêtements sacrés » sont appropriés au registre cultuel sans archaïsme ni surinterprétation. « Sacrés » rend bien קדש dans ce contexte.
