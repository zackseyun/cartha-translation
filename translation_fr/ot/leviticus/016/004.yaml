source:
  edition: WLC
  text: כְּתֹֽנֶת בַּ֨ד קֹ֜דֶשׁ יִלְבָּ֗שׁ וּ/מִֽכְנְסֵי בַד֮ יִהְי֣וּ עַל בְּשָׂר/וֹ֒ וּ/בְ/אַבְנֵ֥ט בַּד֙ יַחְגֹּ֔ר וּ/בְ/מִצְנֶ֥פֶת בַּ֖ד יִצְנֹ֑ף בִּגְדֵי קֹ֣דֶשׁ הֵ֔ם וְ/רָחַ֥ץ בַּ/מַּ֛יִם אֶת בְּשָׂר֖/וֹ וּ/לְבֵשָֽׁ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/004.yaml
  text: He shall put on the holy linen tunic[a], and the linen undergarments shall be on his body; he shall tie the linen sash around himself and wrap the linen turban around himself. These are holy garments[b]. He shall wash his body with water then put them on.
translation:
  language: fr
  text: Il revêtira la tunique sacrée en lin et portera sur son corps les sous-vêtements de lin ; il nouera autour de lui la ceinture de lin et enroulera autour de sa tête le turban de lin. Ce sont des vêtements sacrés. Il se lavera le corps avec de l’eau, puis les revêtira.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּתֹנֶת בַּד קֹדֶשׁ
  choice: la tunique sacrée en lin
  rationale: La construction désigne une tunique de lin mise à part pour le service cultuel. « Tunique » est précis et courant ; « sacrée » rend naturellement קֹדֶשׁ dans ce contexte.
- source_word: מִכְנְסֵי בַד
  choice: les sous-vêtements de lin
  rationale: Le terme désigne le vêtement couvrant le bas du corps et porté contre la peau. « Sous-vêtements » est moderne et digne, contrairement à des termes archaïques ou trop familiers.
- source_word: עַל בְּשָׂרוֹ
  choice: sur son corps
  rationale: Bien que בָּשָׂר signifie littéralement « chair », « corps » exprime ici clairement et sans connotation étrangère le contact direct du vêtement avec la personne.
- source_word: אַבְנֵט בַּד יַחְגֹּר
  choice: il nouera autour de lui la ceinture de lin
  rationale: אַבְנֵט désigne la ceinture ou l’écharpe sacerdotale ; « ceinture » est clair en français, et « nouera autour de lui » restitue l’action de se ceindre.
- source_word: מִצְנֶפֶת בַּד יִצְנֹף
  choice: il s’enveloppera la tête du turban de lin
  rationale: מִצְנֶפֶת est la coiffure sacerdotale et le verbe apparenté évoque son enroulement. La formulation française conserve ce trait concret sans lourdeur excessive.
- source_word: בִּגְדֵי קֹדֶשׁ
  choice: des vêtements sacrés
  rationale: La phrase qualifie ces vêtements de mis à part pour le service divin. « Sacrés » est idiomatique en français contemporain et n’ajoute aucune symbolique ultérieure.
- source_word: וְרָחַץ בַּמַּיִם אֶת בְּשָׂרוֹ
  choice: Il se lavera le corps avec de l’eau
  rationale: Cette formulation conserve la mention explicite du corps et de l’eau tout en restant naturelle en français.
- source_word: וּלְבֵשָׁם
  choice: puis les revêtira
  rationale: Le suffixe renvoie aux vêtements. « Puis » exprime la succession logique de la purification et de l’habillement portée par la coordination hébraïque dans cette instruction.
theological_decisions:
- issue: Nature de la sainteté des vêtements
  choice: « vêtements sacrés » au sens cultuel
  alternative: « vêtements saints »
  rationale: Le texte les présente comme réservés au service sacerdotal sans expliciter de symbolisme doctrinal supplémentaire. « Sacrés » rend ce statut naturellement en français.
- issue: Sens de בְּשָׂרוֹ dans le rite
  choice: « son corps »
  alternative: « sa chair »
  rationale: Dans ce contexte concret d’habillement et de lavage, « corps » communique le sens référentiel sans introduire les connotations théologiques que « chair » pourrait recevoir ailleurs.
- issue: Ordre entre le lavage et l’habillement
  choice: « puis les revêtira »
  alternative: « et les revêtira »
  rationale: 'La formulation explicite la succession prescrite sans développer son sens théologique : le lavage précède l’action de revêtir les vêtements.'
translation_notes:
  register: Français international moderne, digne et accessible. Le futur prescriptif convient au discours légal. Les termes vestimentaires sont précis sans archaïsme ; la répétition du lin est maintenue comme dans l’hébreu.
