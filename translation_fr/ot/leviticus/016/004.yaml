    rationale: « Il s’enveloppera la tête du turban de lin » est compréhensible, mais sonne forcé. « Il enroulera autour de sa tête le turban de lin » est plus naturel et conserve la nuance d’enroulement de יִצְנֹף.
  - severity: low
    issue: 'Note « Littéralement : vêtements de sainteté »'
    rationale: בִּגְדֵי קֹדֶשׁ signifie directement « vêtements saints/sacrés » (littéralement, « vêtements de sainteté » serait une explicitation grammaticale maladroite, non un littéral utile). La note n’apporte donc pas d’alternative fidèle et peut être supprimée.
  revised_text: Il revêtira la tunique sacrée en lin et portera sur son corps les sous-vêtements de lin ; il nouera autour de lui la ceinture de lin et enroulera autour de sa tête le turban de lin. Ce sont des vêtements sacrés. Il se lavera le corps avec de l’eau, puis les revêtira.
