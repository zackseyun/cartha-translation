  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household.
translation:
  language: fr
  text: Aaron présentera le taureau du sacrifice pour le péché qui est pour lui-même[a], et il fera l’expiation pour lui-même et pour sa maisonnée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le taureau du sacrifice de purification ». Le terme hébreu חַטָּאת peut désigner le sacrifice pour le péché et, dans certains contextes, mettre l’accent sur la purification rituelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: présentera
  rationale: Dans un contexte sacrificiel, le verbe désigne le fait d’amener ou de présenter l’offrande. « Présentera » reste naturel en français et n’anticipe pas l’accomplissement de tout le sacrifice.
- source_word: פַּר
  choice: le taureau
  rationale: פַּר désigne un taureau, victime précise déjà introduite dans la procédure rituelle.
- source_word: הַחַטָּאת
  choice: le sacrifice pour le péché
  rationale: Dans cette législation sacrificielle, חַטָּאת désigne l’offrande plutôt que le péché abstrait. Cette formulation française est claire et conserve le lien lexical avec le péché.
- source_word: אֲשֶׁר לוֹ
  choice: qu’il offre pour lui-même
  rationale: La formule distingue l’offrande d’Aaron de celle du peuple et indique sa destination. L’ajout verbal explicite ce rapport de façon idiomatique sans changer la fonction du taureau.
- source_word: וְכִפֶּר
  choice: et il fera l’expiation
  rationale: « Faire l’expiation » préserve la portée rituelle et théologique de כפר sans préciser au-delà de l’hébreu le mécanisme de l’acte.
- source_word: בַּעֲדוֹ
  choice: pour lui-même
  rationale: La préposition בעד marque ici le bénéficiaire ou la personne au nom de laquelle l’acte est accompli.
- source_word: וּבְעַד בֵּיתוֹ
  choice: et pour sa maisonnée
  rationale: בַּיִת vise ici le groupe familial rattaché à Aaron, et non son habitation matérielle. « Maisonnée » exprime cette dimension collective.
theological_decisions:
- issue: Sens de חַטָּאת dans la législation sacrificielle
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le contexte indique une offrande sacrificielle. La traduction principale conserve la désignation traditionnelle et transparente, tandis que la note signale l’interprétation qui met l’accent sur la purification rituelle.
- issue: Portée de בֵּיתוֹ
  choice: sa maisonnée
  alternative: sa maison
  rationale: Le terme hébreu désigne vraisemblablement la famille ou le groupe domestique d’Aaron, plutôt qu’un bâtiment, sans imposer de conclusion doctrinale ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe procédurale au futur respecte le contexte des prescriptions rituelles; le vocabulaire cultuel demeure reconnaissable sans archaïsme inutile.
