revisions:
- from: Aaron présentera le taureau destiné au sacrifice pour le péché qu’il offre pour lui-même[a], et il fera l’expiation pour lui-même et pour sa maisonnée.
  to: Aaron présentera le taureau du sacrifice pour le péché qui est pour lui-même[a], et il fera l’expiation pour lui-même et pour sa maisonnée.
  rationale: La révision remplace la relative interprétative « qu’il offre pour lui-même » par « qui est pour lui-même », plus proche de אֲשֶׁר־לוֹ et distincte du verbe principal « présentera ». Elle supprime aussi la redondance tout en préservant le registre rituel, la terminologie sacrificielle et l’alternative lexicale en note.
