  to: Aaron posera ses deux mains sur la tête du bouc vivant et confessera sur lui toutes les fautes des fils d’Israël[a], toutes leurs transgressions et tous leurs péchés. Il les placera sur la tête du bouc, puis l’enverra dans le désert par l’intermédiaire d’un homme désigné pour cette tâche[b].
  rationale: La révision se limite à rendre plus directement le verbe « envoyer » et l’expression d’agence « par la main de ». Elle ne modifie ni la portée du rite, ni la triple série des termes relatifs au péché, ni l’ambiguïté lexicale signalée par la note.
