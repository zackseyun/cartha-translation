source:
  edition: WLC
  text: וְ/סָמַ֨ךְ אַהֲרֹ֜ן אֶת שְׁתֵּ֣י יד/ו עַ֨ל רֹ֣אשׁ הַ/שָּׂעִיר֮ הַ/חַי֒ וְ/הִתְוַדָּ֣ה עָלָ֗י/ו אֶת כָּל עֲוֺנֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת כָּל פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/נָתַ֤ן אֹתָ/ם֙ עַל רֹ֣אשׁ הַ/שָּׂעִ֔יר וְ/שִׁלַּ֛ח בְּ/יַד אִ֥ישׁ עִתִּ֖י הַ/מִּדְבָּֽרָ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/021.yaml
  text: And Aaron shall lay both his hands on the head of the live goat[a], and confess over it all the iniquities of the sons of Israel, and all their transgressions, all their sins, and put them on the head of the goat[b], and send it away into the wilderness by the hand of a man appointed for the task.
translation:
  language: fr
  text: Aaron posera ses deux mains sur la tête du bouc vivant et confessera sur lui toutes les fautes des fils d’Israël[a], toutes leurs transgressions et tous leurs péchés. Il les placera sur la tête du bouc, puis l’enverra dans le désert par l’intermédiaire d’un homme désigné pour cette tâche[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « les fils d’Israël »; l’expression désigne ici collectivement les Israélites, le peuple d’Israël.
    reason: Préciser la portée collective de l’expression hébraïque tout en conservant sa forme dans le texte.
  - marker: b
    text: L’expression hébraïque est difficile; elle peut désigner un homme prêt, affecté à cette mission ou approprié pour l’occasion.
    reason: Préserver l’incertitude lexicale entourant עִתִּי plutôt que de présenter une seule interprétation comme certaine.
lexical_decisions:
- source_word: וְסָמַךְ
  choice: posera
  rationale: Dans le contexte sacrificiel, סמך désigne le geste rituel consistant à poser les mains sur l’animal. « Posera » est naturel et n’ajoute pas l’idée incertaine d’une forte pression.
- source_word: שְׁתֵּי יָדוֹ
  choice: ses deux mains
  rationale: Rend explicitement le nombre deux, important dans ce rite, en français courant.
- source_word: הַשָּׂעִיר הַחַי
  choice: le bouc vivant
  rationale: Identifie celui des deux boucs qui demeure en vie; « bouc » est ici plus précis que « chèvre ».
- source_word: וְהִתְוַדָּה עָלָיו
  choice: confessera sur lui
  rationale: Préserve la confession prononcée au-dessus du bouc dans le cadre du geste rituel. Le masculin convient naturellement à « bouc ».
- source_word: עֲוֺנֹת
  choice: fautes
  rationale: « Fautes » exprime les torts ou culpabilités visés par עָוֹן tout en restant distinct de « transgressions » et de « péchés ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Conserve l’expression filiale et formellement masculine de l’hébreu; une note précise sa portée collective.
- source_word: פִּשְׁעֵיהֶם
  choice: leurs transgressions
  rationale: Le terme évoque la rupture ou la rébellion; « transgressions » maintient sa force et la distinction au sein de la série.
- source_word: לְכָל חַטֹּאתָם
  choice: tous leurs péchés
  rationale: Dans cette énumération cumulative, le ל peut introduire une catégorie récapitulative; cette formulation française claire conserve la triple série sans imposer un rapport causal.
- source_word: וְנָתַן אֹתָם
  choice: Il les placera
  rationale: Exprime concrètement le transfert rituel des fautes, transgressions et péchés sur la tête du bouc.
- source_word: וְשִׁלַּח
  choice: fera envoyer celui-ci
  rationale: Le sujet grammatical demeure Aaron, tandis que l’homme désigné assure concrètement la conduite du bouc; la tournure causative rend cette articulation sans confondre les rôles.
- source_word: בְּיַד אִישׁ עִתִּי
  choice: sous la conduite d’un homme désigné pour cette tâche
  rationale: ביד marque ici l’intermédiaire ou la prise en charge. Le rare עִתִּי peut évoquer un homme prêt, affecté ou approprié à l’occasion; le texte retient une formulation fonctionnelle et signale l’incertitude en note.
- source_word: הַמִּדְבָּרָה
  choice: dans le désert
  rationale: La finale directionnelle indique un mouvement vers le désert. « Désert » est immédiatement compréhensible en français moderne sans préciser indûment la nature du terrain.
theological_decisions:
- issue: Maintien des trois termes relatifs au péché
  choice: fautes / transgressions / péchés
  alternative: iniquités / rébellions / péchés
  rationale: L’accumulation de trois quasi-synonymes souligne l’étendue totale du mal d’Israël. Des termes distincts en français préservent cette plénitude rhétorique sans prétendre fixer des catégories théologiques étanches.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël, avec note de portée collective
  alternative: les Israélites / le peuple d’Israël
  rationale: La traduction principale conserve la forme filiale du texte source, tandis que la note évite de laisser entendre que seules les personnes de sexe masculin sont concernées.
- issue: Caractère rituel du placement des péchés sur le bouc
  choice: Il les placera sur la tête du bouc
  alternative: Il en chargera le bouc
  rationale: La formulation concrète suit l’image du texte sans expliquer le mécanisme de transfert ni importer une théorie particulière de l’expiation.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur rend la prescription rituelle dans son contexte légal. La phrase a été divisée en deux pour la lisibilité, sans supprimer la succession des gestes. Les marqueurs [a] et [b] figurent dans le texte aux endroits concernés.
