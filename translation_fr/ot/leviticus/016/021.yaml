  source_fidelity: 'Le texte rend fidèlement la succession rituelle, les deux mains, le bouc vivant, la triple énumération des manquements et l’envoi vers le désert. La formulation « fera envoyer » ajoute toutefois une nuance causative que le piel שִׁלַּח n’exige pas : Aaron est le sujet qui envoie le bouc, l’expression suivante indiquant l’agent intermédiaire.'
  naturalness: Le français est globalement clair, digne et naturel. « Il l’enverra ... par l’intermédiaire d’un homme » est plus direct et plus idiomatique que « fera envoyer celui-ci ... sous la conduite d’un homme », tout en restant proche de l’hébreu.
  terminology: « Bouc vivant », « fils d’Israël », « transgressions » et « péchés » sont appropriés. « Fautes » est un choix moderne acceptable pour עֲוֺנוֹת et maintient une distinction rhétorique sans prétendre imposer des catégories fixes. La note sur עִתִּי préserve correctement l’incertitude du terme.
  issues:
