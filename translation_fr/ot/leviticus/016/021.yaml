    issue: « fera envoyer celui-ci » sur-interprète légèrement le verbe principal.
    rationale: וְשִׁלַּח signifie « il enverra / renverra ». La mention « par la main d’un homme » exprime l’intermédiaire; elle ne nécessite pas une périphrase causative en français.
  - severity: low
    issue: « sous la conduite d’un homme » est plus explicatif que l’expression d’agence hébraïque.
    rationale: La préposition בְּיַד est rendue plus près du texte et plus souplement par « par l’intermédiaire d’un homme », sans exclure que cet homme conduise effectivement le bouc.
