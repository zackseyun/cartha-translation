  text: וּ/בָ֤א אַהֲרֹן֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וּ/פָשַׁט֙ אֶת בִּגְדֵ֣י הַ/בָּ֔ד אֲשֶׁ֥ר לָבַ֖שׁ בְּ/בֹא֣/וֹ אֶל הַ/קֹּ֑דֶשׁ וְ/הִנִּיחָ֖/ם שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/023.yaml
  text: Then Aaron shall come into the tent of meeting and take off the linen garments that he put on when he went into the holy place[a], and he shall leave them there.
translation:
  language: fr
  text: Puis Aaron entrera dans la tente de la rencontre et retirera les vêtements de lin qu’il avait revêtus en entrant dans le lieu saint[a], et il les laissera là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sanctuaire » ; compte tenu du contexte plus large du jour des expiations, certains comprennent plus précisément « le lieu très saint ».
    reason: alternative_reading
lexical_decisions:
- source_word: וּבָא
  choice: Puis Aaron entrera
  rationale: Dans cette prescription rituelle, le qatal précédé de waw marque l’étape suivante de la procédure. Le futur français exprime naturellement cette valeur séquentielle.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette expression désigne la structure cultuelle où a lieu la rencontre avec Dieu. « Tente de la rencontre » en conserve le sens sans la transformer en nom propre.
- source_word: וּפָשַׁט
  choice: Il retirera
  rationale: Le verbe signifie ici enlever un vêtement. « Retirer » est naturel, digne et moins abrupt que « se dépouiller de ».
- source_word: בִּגְדֵי הַבָּד
  choice: les vêtements de lin
  rationale: Cette formulation rend clairement le nom des vêtements et la matière prescrite pour le rite.
- source_word: אֲשֶׁר לָבַשׁ
  choice: qu’il avait mis
  rationale: Le plus-que-parfait français marque que ces vêtements ont été revêtus avant l’entrée évoquée et avant leur retrait.
- source_word: בְּבֹאוֹ
  choice: pour entrer
  rationale: Dans le contexte, la tournure française exprime naturellement le lien entre le fait de revêtir ces vêtements et l’entrée dans l’espace saint. Elle évite le peu naturel « lors de son entrée » tout en conservant le mouvement indiqué par בוא.
- source_word: הַקֹּדֶשׁ
  choice: le lieu saint
  rationale: L’hébreu dit littéralement « le saint » ou « le [lieu] saint ». Cette traduction reste générique et ne précise pas dans le corps du texte qu’il s’agit nécessairement du lieu très saint.
- source_word: וְהִנִּיחָם שָׁם
  choice: et il les laissera là
  rationale: Cette formulation rend simplement l’action de déposer ou de laisser les vêtements sur place, sans préciser une manière que le texte n’indique pas.
theological_decisions:
- issue: Référent de הַקֹּדֶשׁ
  choice: le lieu saint
  alternative: le sanctuaire ; le lieu très saint
  rationale: Le terme hébreu de ce verset ne comporte pas la désignation plus complète du compartiment le plus intérieur. Le texte principal conserve donc sa portée générale, tandis qu’une note signale les interprétations contextuelles possibles.
translation_notes:
  register: Français international moderne, clair et digne. Le futur maintient le caractère prescriptif et séquentiel du passage. La division en deux phrases allège une longue coordination hébraïque sans modifier l’enchaînement rituel.
