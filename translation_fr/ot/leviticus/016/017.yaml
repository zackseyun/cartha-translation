  text: וְ/כָל אָדָ֞ם לֹא יִהְיֶ֣ה בְּ/אֹ֣הֶל מוֹעֵ֗ד בְּ/בֹא֛/וֹ לְ/כַפֵּ֥ר בַּ/קֹּ֖דֶשׁ עַד צֵאת֑/וֹ וְ/כִפֶּ֤ר בַּעֲד/וֹ֙ וּ/בְעַ֣ד בֵּית֔/וֹ וּ/בְעַ֖ד כָּל קְהַ֥ל יִשְׂרָאֵֽל־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/017.yaml
  text: And no man shall be in the tent of meeting when he enters to make atonement in the holy place, until he comes out. And he shall make atonement for himself, and for his household, and for all the assembly of Israel.
translation:
  language: fr
  text: Personne ne sera dans la tente de la rencontre lorsqu’il y entrera pour faire l’expiation dans le sanctuaire, jusqu’à ce qu’il en sorte. Il fera l’expiation pour lui-même, pour sa maison et pour toute l’assemblée d’Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָל אָדָם
  choice: personne (dans une proposition négative)
  rationale: Dans la tournure hébraïque כָל אָדָם לֹא, le sens naturel est qu’aucun être humain ne doit être présent. « Personne » exprime clairement cette interdiction universelle en français moderne sans introduire une restriction au sexe masculin.
- source_word: אֹהֶל מוֹעֵד
  choice: tente de la rencontre
  rationale: Traduction transparente de l’expression désignant la tente où se déroule la rencontre cultuelle; elle reste naturelle et évite le terme moins immédiatement compréhensible « assignation ».
- source_word: לְכַפֵּר / וְכִפֶּר
  choice: faire l’expiation
  rationale: Cette formulation conserve le vocabulaire cultuel et théologique du verbe כפר dans ce contexte rituel, ainsi que sa répétition dans le verset.
- source_word: בַּקֹּדֶשׁ
  choice: dans le sanctuaire
  rationale: Le substantif désigne ici l’espace sacré où s’accomplit le rite. « Sanctuaire » préserve une certaine latitude quant à la délimitation précise de cet espace dans la tente.
- source_word: בֵּיתוֹ
  choice: sa maison
  rationale: « Maison » conserve le champ sémantique de בַּיִת, qui peut englober le foyer et les membres de la maisonnée, sans le réduire explicitement à la seule famille.
- source_word: קְהַל יִשְׂרָאֵל
  choice: l’assemblée d’Israël
  rationale: Équivalent formel et idiomatique de קהל, approprié au rassemblement collectif d’Israël.
theological_decisions:
- issue: Portée de l’exclusion dans la tente
  choice: Personne ne sera dans la tente de la rencontre
  alternative: Aucun homme ne sera dans la tente de la rencontre
  rationale: L’hébreu אָדָם peut désigner l’être humain en général; dans cette interdiction cultuelle, la formulation française inclusive rend le mieux la portée universelle sans modifier le sens.
- issue: Sens cultuel de כפר
  choice: faire l’expiation pour
  alternative: obtenir le pardon pour / accomplir le rite d’expiation en faveur de
  rationale: « Faire l’expiation » maintient la formulation cultuelle du texte sans préciser au-delà de l’hébreu le mécanisme ou l’effet théologique du rite.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit étroitement la progression de l’hébreu tout en évitant les lourdeurs. La répétition de « faire l’expiation » est volontaire, car elle structure le verset.
