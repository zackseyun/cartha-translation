revisions:
- from: Il accomplira ainsi le rite d’expiation[a] pour le sanctuaire saint, pour la tente de la Rencontre et pour l’autel. Il accomplira le rite d’expiation pour les prêtres et pour tout le peuple de l’assemblée[b].
  to: Il fera ainsi l’expiation[a] pour le sanctuaire sacré, pour la tente de la Rencontre et pour l’autel. Il fera l’expiation pour les prêtres et pour tout le peuple de l’assemblée[b].
  rationale: La révision remplace deux formulations moins idiomatiques par des équivalents français plus directs. Elle maintient la même expression pour les sancta et les personnes, conformément à la répétition du verbe hébreu, et conserve l’ambiguïté cultuelle de כפר grâce à la note.
