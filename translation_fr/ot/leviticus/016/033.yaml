review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est fidèle : le verset énumère les réalités cultuelles et les personnes pour lesquelles le כהן doit accomplir כפר. Toutefois, « sanctuaire saint » est un calque peu idiomatique et « rite d’expiation » ajoute « rite », absent du verbe hébreu, tout en affaiblissant la répétition verbale directe.'
  naturalness: « Faire l’expiation pour » est une formulation française claire, de registre biblique accessible, et s’applique de façon uniforme aux lieux sacrés comme aux personnes. « Le sanctuaire sacré » est naturel sans imposer l’identification au Saint des saints.
  terminology: « Tente de la Rencontre », « autel », « prêtres » et « peuple de l’assemblée » sont appropriés. Le terme « expiation » conserve la portée cultuelle de כפר; la note peut signaler l’aspect de purification/élimination de l’impureté sans le substituer au texte.
  issues:
  - severity: medium
    issue: « le sanctuaire saint »
    rationale: La juxtaposition est grammaticalement possible mais sonne comme un calque et n’est pas naturelle en français moderne. « le sanctuaire sacré » rend l’expression hébraïque de manière plus idiomatique sans surdéterminer le référent comme « le lieu très saint ».
  - severity: low
    issue: « accomplira le rite d’expiation »
    rationale: Cette paraphrase introduit le nom « rite », qui ne figure pas explicitement dans le texte. « fera l’expiation » est plus direct, préserve la répétition de כפר et reste naturel dans ce contexte cultuel.
  revised_text: Il fera ainsi l’expiation[a] pour le sanctuaire sacré, pour la tente de la Rencontre et pour l’autel. Il fera l’expiation pour les prêtres et pour tout le peuple de l’assemblée[b].
