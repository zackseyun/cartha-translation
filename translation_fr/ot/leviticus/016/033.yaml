source:
  edition: WLC
  text: וְ/כִפֶּר֙ אֶת מִקְדַּ֣שׁ הַ/קֹּ֔דֶשׁ וְ/אֶת אֹ֧הֶל מוֹעֵ֛ד וְ/אֶת הַ/מִּזְבֵּ֖חַ יְכַפֵּ֑ר וְ/עַ֧ל הַ/כֹּהֲנִ֛ים וְ/עַל כָּל עַ֥ם הַ/קָּהָ֖ל יְכַפֵּֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/033.yaml
  text: Thus he shall make atonement for the Holy Sanctuary[a], and for the Tent of Meeting, and for the altar[b]; and he shall make atonement for the priests and for all the people of the assembly.
translation:
  language: fr
  text: Il fera ainsi l’expiation[a] pour le sanctuaire sacré, pour la tente de la Rencontre et pour l’autel. Il fera l’expiation pour les prêtres et pour tout le peuple de l’assemblée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « purification ». Dans ce contexte cultuel, le verbe hébreu peut souligner autant l’élimination de l’impureté que l’expiation.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tout le peuple de la communauté ». L’hébreu désigne le peuple appartenant à l’assemblée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר / יְכַפֵּר
  choice: accomplir le rite d’expiation
  rationale: Le verbe כפר possède ici un sens cultuel technique qui concerne aussi bien les lieux et objets sacrés que les personnes. Cette formulation française garde cette unité rituelle sans imposer une théorie particulière de l’expiation.
- source_word: מִקְדַּשׁ הַקֹּדֶשׁ
  choice: le sanctuaire saint
  rationale: Cette traduction conserve l’association explicite de « sanctuaire » et de « sainteté » sans identifier nécessairement l’expression au seul lieu très saint.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la Rencontre
  rationale: Désignation traditionnelle, transparente et fidèle à l’image ainsi qu’à la fonction exprimées par l’hébreu.
- source_word: הַמִּזְבֵּחַ
  choice: l’autel
  rationale: Équivalent français direct et usuel du terme cultuel.
- source_word: עַל
  choice: pour
  rationale: Avec כפר, « pour » exprime naturellement en français la personne ou la réalité au bénéfice de laquelle le rite est accompli.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent français standard du pluriel hébreu.
- source_word: כָּל עַם הַקָּהָל
  choice: tout le peuple de l’assemblée
  rationale: La formulation maintient la double référence au peuple et à la communauté assemblée, au lieu de réduire l’expression à « tout le peuple ».
theological_decisions:
- issue: Portée du verbe כפר appliqué aux réalités sacrées et aux personnes
  choice: Employer la même expression « accomplir le rite d’expiation » pour le sanctuaire, la tente, l’autel, les prêtres et le peuple.
  alternative: Traduire par « purifier » pour les lieux et objets, mais par « faire l’expiation » pour les personnes.
  rationale: La répétition du même verbe hébreu unit délibérément toutes ces réalités dans une seule action rituelle. Une variation des verbes en français interpréterait plus précisément que ne le fait le texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Rite d’expiation » explicite la valeur cultuelle du verbe et permet de l’appliquer naturellement aux lieux, aux objets et aux personnes. La répétition française conserve le parallélisme essentiel sans reproduire une syntaxe hébraïque lourde.
