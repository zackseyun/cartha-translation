  to: Car, en ce jour, l’expiation sera faite pour vous[a], afin de vous purifier ; devant Yahweh[b], vous serez purs de tous vos péchés.
  rationale: La révision remplace « sera accomplie » par « sera faite », expression française plus naturelle pour le rite d’expiation tout en préservant le passif qui ne spécifie pas le sujet hébreu. La dernière proposition est réordonnée pour une lecture plus fluide, sans modifier son sens ni effacer la référence à la purification devant Yahweh.
