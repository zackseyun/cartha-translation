  text: כִּֽי בַ/יּ֥וֹם הַ/זֶּ֛ה יְכַפֵּ֥ר עֲלֵי/כֶ֖ם לְ/טַהֵ֣ר אֶתְ/כֶ֑ם מִ/כֹּל֙ חַטֹּ֣אתֵי/כֶ֔ם לִ/פְנֵ֥י יְהוָ֖ה תִּטְהָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/030.yaml
  text: For on this day atonement shall be made for you to cleanse you[b][a]; from all your sins before Yahweh you shall be clean.
translation:
  language: fr
  text: Car, en ce jour, l’expiation sera faite pour vous[a], afin de vous purifier ; devant Yahweh[b], vous serez purs de tous vos péchés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il accomplira l’expiation pour vous ». Le verbe hébreu est au masculin singulier, mais le sujet n’est pas exprimé dans cette proposition.'
    reason: lexical_alternative
  - marker: b
    text: Hébreu YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication qui fonde les prescriptions précédentes concernant le jour des Expiations.
- source_word: בַיּוֹם הַזֶּה
  choice: en ce jour
  rationale: Rend directement la tournure temporelle et son démonstratif, dans un registre rituel digne mais actuel.
- source_word: יְכַפֵּר עֲלֵיכֶם
  choice: l’expiation sera accomplie pour vous
  rationale: Conserve le sens cultuel de כפר et la valeur bénéficiaire de עַל, tout en évitant d’imposer dans le texte principal un sujet que cette proposition hébraïque ne nomme pas.
- source_word: לְטַהֵר אֶתְכֶם
  choice: afin de vous purifier
  rationale: Exprime naturellement le but ou le résultat visé par l’expiation et maintient la notion de purification rituelle.
- source_word: מִכֹּל חַטֹּאתֵיכֶם
  choice: de tous vos péchés
  rationale: Dans cette formule de purification appliquée au peuple, חַטֹּאת désigne les péchés plutôt que les sacrifices pour le péché.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: Rend לִפְנֵי par une expression concise de présence et conserve le nom divin personnel.
- source_word: תִּטְהָרוּ
  choice: vous serez purs
  rationale: Traduit le qal comme l’état de pureté qui résulte de l’action précédente, distinguant ainsi « purifier » de « être purs ».
theological_decisions:
- issue: Sujet non exprimé de יְכַפֵּר
  choice: 'tournure passive : « l’expiation sera accomplie »'
  alternative: « il accomplira l’expiation »
  rationale: Le verbe hébreu est actif, masculin singulier, mais son sujet n’est pas exprimé dans cette proposition. Le passif français préserve cette indétermination sans exclure l’agent suggéré par le contexte.
- issue: Sens cultuel de כפר
  choice: « expiation »
  alternative: « rite d’expiation » ou « pardon »
  rationale: « Expiation » garde la catégorie cultuelle du texte sans la réduire au seul pardon ni préciser un modèle théologique absent du verset.
- issue: Nom divin יְהוָה
  choice: « Yahweh »
  alternative: « le SEIGNEUR »
  rationale: La forme « Yahweh » représente le nom divin du texte hébreu; la traduction traditionnelle est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire cultuel « expiation » et « purifier » est conservé, tandis que la syntaxe reste accessible. La séparation en deux phrases fait ressortir le résultat final sans supprimer le lien logique du verset.
