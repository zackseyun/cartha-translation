  terminology: « Expiation », « purifier », « péchés », « purs » et « Yahweh » sont des choix précis, d’un registre moderne et digne, sans introduire d’interprétation doctrinale supplémentaire. Les notes sont pertinentes et leurs ancres sont correctement placées.
