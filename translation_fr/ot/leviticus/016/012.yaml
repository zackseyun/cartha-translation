    rationale: Après « ses deux mains pleines », le pronom pluriel peut grammaticalement renvoyer aux mains, alors que l’hébreu décrit le transport de l’encensoir et de l’encens. « Il portera le tout » exprime clairement l’ensemble des objets préparés.
