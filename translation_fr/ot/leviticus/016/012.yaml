  text: וְ/לָקַ֣ח מְלֹֽא הַ֠/מַּחְתָּה גַּֽחֲלֵי אֵ֞שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וּ/מְלֹ֣א חָפְנָ֔י/ו קְטֹ֥רֶת סַמִּ֖ים דַּקָּ֑ה וְ/הֵבִ֖יא מִ/בֵּ֥ית לַ/פָּרֹֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/012.yaml
  text: And he shall take a full censer of coals of fire from upon the altar before Yahweh[a], and both the fullness of his hands of finely ground fragrant incense, and bring it inside the veil.
translation:
  language: fr
  text: Il prendra sur l’autel qui est devant Yahweh un encensoir plein de charbons ardents, ainsi que ses deux mains pleines d’encens aromatique finement broyé, et il portera le tout derrière le rideau[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à l’intérieur du rideau ». L’expression hébraïque désigne l’espace situé au-delà du rideau, c’est-à-dire le sanctuaire intérieur.'
    reason: Variante lexicale et clarification spatiale de l’expression hébraïque condensée.
lexical_decisions:
- source_word: וְלָקַח
  choice: Il prendra
  rationale: Dans cette prescription rituelle, le parfait précédé de וְ poursuit la série d’instructions et reçoit naturellement en français une valeur de futur prescriptif.
- source_word: מְלֹא הַמַּחְתָּה
  choice: un encensoir plein
  rationale: L’expression signifie littéralement « la contenance de l’encensoir ». Cette formulation française conserve à la fois le récipient et l’idée qu’il est rempli.
- source_word: גַּחֲלֵי אֵשׁ
  choice: charbons ardents
  rationale: Littéralement « charbons de feu » ; « charbons ardents » en exprime naturellement le sens concret en français moderne.
- source_word: מֵעַל הַמִּזְבֵּחַ מִלִּפְנֵי יְהוָה
  choice: sur l’autel qui est devant Yahweh
  rationale: 'La formulation garde le détail spatial : les charbons sont pris sur l’autel, lequel se trouve devant Yahweh.'
- source_word: וּמְלֹא חָפְנָיו
  choice: ainsi que ses deux mains pleines
  rationale: Le duel חָפְנָיו renvoie aux deux mains réunies ; la traduction rend explicitement cette quantité sans recourir à une mesure moderne.
- source_word: קְטֹרֶת סַמִּים דַּקָּה
  choice: d’encens aromatique finement broyé
  rationale: סַמִּים désigne ici des substances odorantes et דַּקָּה leur état finement réduit ; la formulation demeure précise et naturelle.
- source_word: וְהֵבִיא
  choice: et il les apportera
  rationale: Le hiphil de בוא indique qu’il fait entrer ou apporte les éléments mentionnés ; « les » explicite en français l’encensoir et l’encens.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: derrière le rideau
  rationale: Dans ce contexte, l’expression désigne le déplacement jusque dans l’espace situé au-delà du rideau séparant le sanctuaire intérieur.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom divin personnel ; « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Destination derrière le rideau
  choice: derrière le rideau
  alternative: à l’intérieur du rideau
  rationale: La tournure hébraïque condensée indique l’entrée dans l’espace au-delà du rideau. La traduction principale exprime ce mouvement sans préciser davantage la théologie ou la configuration du sanctuaire.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur simple conserve le ton prescriptif. « Encensoir », « autel » et « rideau » fournissent le vocabulaire rituel nécessaire sans archaïsme excessif.
