  to: Il prendra sur l’autel qui est devant Yahweh un encensoir plein de charbons ardents, ainsi que ses deux mains pleines d’encens aromatique finement broyé, et il portera le tout derrière le rideau[a].
  rationale: La seule correction concerne la clarté référentielle en français. L’ordre initial des compléments est aussi légèrement réorganisé pour faire dépendre sans ambiguïté « sur l’autel qui est devant Yahweh » de la prise des charbons. Le contenu rituel et la portée du texte hébreu sont préservés.
