  text: וְ/הָיְתָ֥ה לָ/כֶ֖ם לְ/חֻקַּ֣ת עוֹלָ֑ם בַּ/חֹ֣דֶשׁ הַ֠/שְּׁבִיעִי בֶּֽ/עָשׂ֨וֹר לַ/חֹ֜דֶשׁ תְּעַנּ֣וּ אֶת נַפְשֹֽׁתֵי/כֶ֗ם וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ הָֽ/אֶזְרָ֔ח וְ/הַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/029.yaml
  text: 'And this shall be for you a permanent statute: in the seventh month[a], on the tenth day of the month, you shall humble yourselves, and you shall do no work, whether the native-born or the sojourner who sojourns among you.'
translation:
  language: fr
  text: 'Ce sera pour vous une prescription perpétuelle : le dixième jour du septième mois, vous vous humilierez[a] et vous ne ferez aucun travail, que vous soyez autochtone ou étranger résidant parmi vous.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « vous vous affligerez ». Cette expression est traditionnellement comprise comme incluant le jeûne.'
    reason: Signaler le sens plus littéral de l’idiome hébraïque et son association traditionnelle avec le jeûne, sans restreindre le texte principal à cette seule pratique.
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Ce sera
  rationale: Cette formule juridique introduit une règle durable et renvoie naturellement aux prescriptions qui précèdent.
- source_word: לְחֻקַּת עוֹלָם
  choice: une prescription perpétuelle
  rationale: חֻקָּה désigne une règle prescrite, et עוֹלָם souligne ici son caractère durable dans le cadre de l’alliance.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: le dixième jour du septième mois
  rationale: Cette formulation française naturelle conserve exactement la date indiquée par les deux expressions calendaires hébraïques.
- source_word: תְּעַנּוּ אֶת נַפְשֹׁתֵיכֶם
  choice: vous vous humilierez
  rationale: Le piel de ענה associé à נֶפֶשׁ exprime l’abaissement de soi ou les privations. Cette traduction conserve la portée générale de l’expression sans la réduire au seul jeûne.
- source_word: וְכָל מְלָאכָה לֹא תַעֲשׂוּ
  choice: vous ne ferez aucun travail
  rationale: מְלָאכָה désigne ici le travail ou l’activité laborieuse; la formulation est claire, naturelle et juridiquement ferme.
- source_word: הָאֶזְרָח
  choice: l’autochtone
  rationale: אֶזְרָח désigne le membre natif de la communauté, par opposition à l’étranger qui y réside.
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: l’étranger qui réside parmi vous
  rationale: גֵּר désigne un étranger établi au sein de la société israélite. Le verbe « réside » restitue la répétition de la racine hébraïque sans lourdeur excessive.
theological_decisions:
- issue: Sens du commandement d’abaissement de soi au jour des Expiations
  choice: vous vous humilierez
  alternative: vous vous imposerez des privations; vous jeûnerez
  rationale: L’expression hébraïque a une portée plus large qu’un acte rituel unique. Le jeûne en est une compréhension traditionnelle, mais le préciser dans le texte principal réduirait indûment l’ambiguïté du texte source.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe juridique reste solennelle sans archaïsmes. « Autochtone » et « étranger qui réside parmi vous » maintiennent le contraste légal du texte hébraïque dans une langue compréhensible aujourd’hui.
