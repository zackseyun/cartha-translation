review_pass:
  verdict: revise
  source_fidelity: Le sens rituel et les deux localisations sont bien rendus. Une légère révision rend toutefois plus explicite la préposition עַל (« sur ») dans la première aspersion et conserve plus naturellement la relation instrumentale du doigt.
  naturalness: Le français est clair et d’un registre approprié. « Asperger le devant » est possible, mais « asperger ... sur le devant » est plus transparent et correspond mieux à la construction spatiale hébraïque. La répétition de « du couvercle de l’arche » évite toute ambiguïté référentielle dans une formulation autonome.
  terminology: « Couvercle de l’arche » est un choix concret, neutre et fidèle pour כַּפֹּרֶת. La note conserve utilement « propitiatoire » comme terme traditionnel et « couvercle d’expiation » comme alternative, sans faire dépendre le texte principal d’une interprétation doctrinale.
  issues:
  - severity: low
    issue: La première localisation ne rend pas explicitement עַל (« sur »).
    rationale: Dans « il en aspergera le devant du couvercle », le français peut comprendre correctement l’application du sang, mais « sur le devant du couvercle » exprime sans équivoque l’aspersion sur sa surface, conformément à עַל פְּנֵי.
  - severity: low
    issue: La seconde occurrence de « le couvercle » peut être explicitée.
    rationale: Le référent est clair dans le contexte immédiat, mais répéter « le couvercle de l’arche » donne une formulation indépendante plus précise sans ajouter de sens.
  revised_text: Il prendra du sang du taureau et en aspergera, avec son doigt, le devant du couvercle de l’arche, du côté de l’est. Puis, devant le couvercle de l’arche, il aspergera sept fois du sang avec son doigt.
  revised_footnotes:
  - marker: a
    text: 'Traditionnellement « propitiatoire » ; autre traduction possible : « couvercle d’expiation ». Le terme hébreu désigne le couvercle de l’arche, associé au rite d’expiation.'
    reason: Alternative lexicale et précision cultuelle pour הַכַּפֹּרֶת.
  revision_rationale: 'La révision est minimale : elle maintient le futur procédural, le partitif (« du sang »), l’instrument (« avec son doigt »), l’orientation vers l’est, la distinction entre l’aspersion sur le couvercle et celle devant lui, ainsi que les sept aspersions. Elle améliore seulement l’explicitation spatiale et la cohérence référentielle.'
