base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/014.yaml
  text: And he shall take some of the bull's blood and sprinkle it with his finger on the front of the mercy seat[a], eastward; and before the mercy seat he shall sprinkle some of the blood with his finger seven times.
translation:
  language: fr
  text: Il prendra du sang du taureau et en aspergera, avec son doigt, le devant du couvercle de l’arche, du côté de l’est. Puis, devant le couvercle de l’arche, il aspergera sept fois du sang avec son doigt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: Il prendra
  rationale: Dans cette prescription rituelle, la forme verbale poursuit l’énoncé de la procédure à accomplir ; le futur français l’exprime naturellement.
- source_word: מִדַּם הַפָּר
  choice: du sang du taureau
  rationale: 'La préposition מִן a ici une valeur partitive : le prêtre prélève une partie du sang du taureau.'
- source_word: וְהִזָּה / יַזֶּה
  choice: aspergera
  rationale: Dans le vocabulaire rituel sacerdotal, נזה désigne l’application d’un liquide par aspersion. « Asperger » est précis et naturel en français.
- source_word: בְאֶצְבָּעוֹ
  choice: avec son doigt
  rationale: La préposition בְּ indique ici le moyen employé pour accomplir l’aspersion.
- source_word: עַל פְּנֵי הַכַּפֹּרֶת קֵדְמָה
  choice: le devant du couvercle de l’arche, du côté de l’est
  rationale: Cette formulation conserve la distinction spatiale entre l’aspersion faite sur le devant du couvercle, orienté vers l’est, et celle faite ensuite devant celui-ci.
- source_word: הַכַּפֹּרֶת
  choice: le couvercle de l’arche
  rationale: כַּפֹּרֶת désigne l’objet placé sur l’arche. « Couvercle de l’arche » en indique clairement la réalité concrète sans imposer une étymologie débattue ; le terme cultuel traditionnel est signalé en note.
- source_word: שֶׁבַע פְּעָמִים
  choice: sept fois
  rationale: Le nombre et la répétition, importants dans la procédure rituelle, sont conservés explicitement.
- source_word: מִן הַדָּם
  choice: du sang
  rationale: 'La tournure française exprime naturellement la valeur partitive de מִן : une certaine quantité du sang sert aux aspersions.'
theological_decisions:
- issue: Traduction de הַכַּפֹּרֶת
  choice: couvercle de l’arche
  alternative: propitiatoire ; couvercle d’expiation
  rationale: Le mot désigne le couvercle de l’arche, lieu central du rite d’expiation. Le choix principal rend l’objet concret intelligible sans trancher la relation lexicale et théologique exacte avec l’expiation. La note préserve les deux désignations cultuelles possibles.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe procédurale reste sobre ; « asperger » conserve le registre rituel sans archaïsme excessif.
