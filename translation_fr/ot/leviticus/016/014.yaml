revisions:
- from: Il prendra du sang du taureau et, avec son doigt, il en aspergera le devant du couvercle de l’arche[a], du côté de l’est. Puis, devant le couvercle, il aspergera sept fois du sang avec son doigt.
  to: Il prendra du sang du taureau et en aspergera, avec son doigt, le devant du couvercle de l’arche, du côté de l’est. Puis, devant le couvercle de l’arche, il aspergera sept fois du sang avec son doigt.
  rationale: 'La révision est minimale : elle maintient le futur procédural, le partitif (« du sang »), l’instrument (« avec son doigt »), l’orientation vers l’est, la distinction entre l’aspersion sur le couvercle et celle devant lui, ainsi que les sept aspersions. Elle améliore seulement l’explicitation spatiale et la cohérence référentielle.'
