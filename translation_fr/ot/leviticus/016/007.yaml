  text: וְ/לָקַ֖ח אֶת שְׁנֵ֣י הַ/שְּׂעִירִ֑ם וְ/הֶעֱמִ֤יד אֹתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/007.yaml
  text: And he shall take the two goats and set them before Yahweh at the entrance of the tent of meeting[a].
translation:
  language: fr
  text: Il prendra les deux boucs et les placera devant Yahvé, à l’entrée de la tente de la rencontre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: Il prendra
  rationale: Dans cette suite d’instructions rituelles, le parfait avec waw exprime l’action prescrite suivante; le futur français convient naturellement.
- source_word: שְׁנֵי הַשְּׂעִירִם
  choice: les deux boucs
  rationale: שָׂעִיר désigne ici un caprin mâle; «boucs» conserve cette précision en français courant.
- source_word: וְהֶעֱמִיד אֹתָם
  choice: et les placera
  rationale: Le hiphil de עמד signifie faire tenir debout ou placer. «Placera» restitue concrètement l’action sans ajouter l’idée plus interprétative de présentation cultuelle.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahvé
  rationale: לִפְנֵי marque ici la position ou la présence devant Dieu; le nom divin est rendu explicitement par «Yahvé».
- source_word: פֶּתַח
  choice: à l’entrée de
  rationale: פֶּתַח désigne l’ouverture ou l’entrée d’un lieu; cette formulation est naturelle dans ce contexte spatial.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette traduction conserve les éléments du syntagme hébreu et désigne le sanctuaire mobile sans substituer un terme architectural ultérieur.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. «Yahvé» représente le nom propre en français et évite de le remplacer silencieusement par un titre.
translation_notes:
  register: Français international moderne, digne et direct. Le futur garde le caractère prescriptif de la procédure rituelle; «boucs» précise naturellement le sexe indiqué par le terme hébreu.
