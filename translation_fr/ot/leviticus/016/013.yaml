source:
  edition: WLC
  text: וְ/נָתַ֧ן אֶֽת הַ/קְּטֹ֛רֶת עַל הָ/אֵ֖שׁ לִ/פְנֵ֣י יְהוָ֑ה וְ/כִסָּ֣ה עֲנַ֣ן הַ/קְּטֹ֗רֶת אֶת הַ/כַּפֹּ֛רֶת אֲשֶׁ֥ר עַל הָ/עֵד֖וּת וְ/לֹ֥א יָמֽוּת־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/013.yaml
  text: And he shall put the incense on the fire before Yahweh[a], so that the cloud of the incense may cover the mercy seat that is over the testimony, so that he may not die.
translation:
  language: fr
  text: Il mettra l’encens sur le feu devant Yahweh, afin que le nuage d’encens couvre le couvercle d’expiation[a] qui est au-dessus du Témoignage, et qu’il ne meure pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « propitiatoire ». Le mot hébreu désigne le couvercle de l’arche, particulièrement dans son rôle au cours des rites d’expiation.
    reason: Alternative lexicale traditionnelle pour הַכַּפֹּרֶת.
lexical_decisions:
- source_word: וְנָתַן
  choice: Il mettra
  rationale: Dans cette prescription rituelle, la forme verbale exprime l’action ordonnée à accomplir; le futur français convient naturellement au style législatif.
- source_word: הַקְּטֹרֶת
  choice: l’encens
  rationale: Le nom désigne l’encens employé dans le sanctuaire; cette traduction est exacte et naturelle sans expliciter sa composition.
- source_word: עַל הָאֵשׁ
  choice: sur le feu
  rationale: La préposition indique que l’encens est déposé sur le feu, c’est-à-dire sur les braises ardentes mentionnées dans le contexte.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: La formule exprime la présence cultuelle de Yahweh et conserve le nom divin personnel.
- source_word: וְכִסָּה
  choice: afin que … couvre
  rationale: 'La construction indique ici le but ou le résultat recherché: le nuage doit couvrir le couvercle.'
- source_word: עֲנַן הַקְּטֹרֶת
  choice: le nuage d’encens
  rationale: Cette expression française conserve l’image et rend naturellement la relation entre le nuage et l’encens.
- source_word: הַכַּפֹּרֶת
  choice: le couvercle d’expiation
  rationale: Le terme désigne le couvercle de l’arche dans sa fonction centrale au rite d’expiation. Cette formulation est plus transparente pour le lecteur moderne que le traditionnel « propitiatoire ».
- source_word: אֲשֶׁר עַל הָעֵדוּת
  choice: qui est au-dessus du Témoignage
  rationale: La traduction reste proche de l’expression hébraïque sans ajouter explicitement les tables ou le document d’alliance.
- source_word: וְלֹא יָמוּת
  choice: et qu’il ne meure pas
  rationale: Coordonné au premier but introduit par « afin que », le subjonctif exprime la conséquence protectrice recherchée sans archaïsme.
theological_decisions:
- issue: Traduction de הַכַּפֹּרֶת dans le contexte du sanctuaire et de l’expiation
  choice: couvercle d’expiation
  alternative: propitiatoire
  rationale: Le choix principal identifie concrètement l’objet et sa fonction rituelle sans réduire le terme à une abstraction. Le terme traditionnel « propitiatoire » demeure signalé en note.
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération conserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- issue: Relation entre les deux dernières propositions
  choice: 'but ou résultat recherché: le nuage couvre le couvercle et le prêtre ne meurt pas'
  alternative: 'simple succession: le nuage couvrira le couvercle et il ne mourra pas'
  rationale: Le contexte prescriptif favorise une relation finale, tout en laissant subsister la tension entre but et conséquence dans la formulation française.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur garde la tonalité prescriptive du passage; « Témoignage » est maintenu comme terme cultuel, sans ajout explicatif dans le corps du verset.
