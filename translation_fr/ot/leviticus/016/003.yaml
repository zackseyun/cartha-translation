id: LEV.16.3
reference: Leviticus 16:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/זֹ֛את יָבֹ֥א אַהֲרֹ֖ן אֶל הַ/קֹּ֑דֶשׁ בְּ/פַ֧ר בֶּן בָּקָ֛ר לְ/חַטָּ֖את וְ/אַ֥יִל לְ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/003.yaml
  text: 'With this Aaron shall enter the Holy Place: with a bull from the herd for a sin offering[b][a], and a ram for a burnt offering.'
translation:
  language: fr
  text: 'Voici comment Aaron entrera dans le sanctuaire : avec un jeune taureau pris dans le gros bétail, destiné à un sacrifice pour le péché[a], et un bélier destiné à un holocauste.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification ». Le terme hébreu peut souligner la purification rituelle aussi bien que le rapport au péché.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּזֹאת
  choice: Voici comment
  rationale: La préposition ב avec le démonstratif זֹאת introduit ici la manière ou les moyens prescrits. « Voici comment » est naturel en français juridique et annonce clairement les éléments qui suivent.
- source_word: יָבֹא
  choice: entrera
  rationale: L’inaccompli a ici une valeur prescriptive dans un contexte législatif. Le futur français exprime naturellement la procédure imposée sans suggérer une simple prédiction.
- source_word: אֶל־הַקֹּדֶשׁ
  choice: dans le sanctuaire
  rationale: Dans le contexte du jour des expiations, le terme désigne l’espace sacré intérieur où Aaron doit pénétrer. « Sanctuaire » est digne et naturel, tandis que le contexte immédiat en précise la portée.
- source_word: בְּפַר בֶּן־בָּקָר
  choice: avec un jeune taureau pris dans le gros bétail
  rationale: פַר désigne un jeune taureau, et l’expression idiomatique בֶּן־בָּקָר le rattache au gros bétail. Cette formulation française reste précise sans reproduire littéralement l’étrange « fils du gros bétail ».
- source_word: לְחַטָּאת
  choice: destiné à un sacrifice pour le péché
  rationale: Dans la législation sacrificielle, חַטָּאת désigne couramment le sacrifice associé au péché, tout en pouvant mettre l’accent sur la purification rituelle. Le rendu principal conserve la terminologie reconnue et une note signale l’autre nuance.
- source_word: וְאַיִל
  choice: et un bélier
  rationale: אַיִל désigne sans ambiguïté un bélier.
- source_word: לְעֹלָה
  choice: destiné à un holocauste
  rationale: עֹלָה est le terme consacré pour l’offrande entièrement brûlée. « Holocauste » demeure le terme biblique français courant pour ce sacrifice.
theological_decisions:
- issue: Portée cultuelle de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le rendu traditionnel garde visible le rapport lexical au péché, tandis que la note préserve la fonction de purification rituelle du sacrifice sans trancher exclusivement entre ces deux dimensions.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe procédurale « Voici comment… » convient au contexte législatif. « Gros bétail » restitue l’idiome bovin avec naturel; « holocauste » maintient la terminologie cultuelle française usuelle.
