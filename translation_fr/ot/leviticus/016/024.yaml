  text: וְ/רָחַ֨ץ אֶת בְּשָׂר֤/וֹ בַ/מַּ֨יִם֙ בְּ/מָק֣וֹם קָד֔וֹשׁ וְ/לָבַ֖שׁ אֶת בְּגָדָ֑י/ו וְ/יָצָ֗א וְ/עָשָׂ֤ה אֶת עֹֽלָת/וֹ֙ וְ/אֶת עֹלַ֣ת הָ/עָ֔ם וְ/כִפֶּ֥ר בַּעֲד֖/וֹ וּ/בְעַ֥ד הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/024.yaml
  text: He shall wash his body with water in a holy place[a], put on his garments, come out, and offer his burnt offering and the burnt offering of the people[c][b], and make atonement for himself and for the people.
translation:
  language: fr
  text: Il lavera son corps[a] avec de l’eau dans un lieu saint[b], remettra ses vêtements, sortira, offrira son holocauste et celui du peuple, puis fera l’expiation[c] pour lui-même et pour le peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sa chair ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit « dans un lieu saint », pas nécessairement « dans le Lieu saint », c’est-à-dire un espace précis du sanctuaire.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « fera expiation » ; dans certains contextes rituels, le verbe peut aussi évoquer une purification.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחַץ
  choice: Il lavera
  rationale: Dans cette suite d’instructions rituelles, le parfait avec waw exprime l’étape prescrite suivante; le futur français la rend naturellement.
- source_word: בְּשָׂרוֹ
  choice: son corps
  rationale: Littéralement «sa chair»; dans le contexte d’un lavage rituel, «son corps» est plus naturel en français moderne et évite des connotations étrangères au contexte.
- source_word: בַּמַּיִם
  choice: avec de l’eau
  rationale: Cette formulation rend idiomatiquement en français le moyen du lavage exprimé par la préposition hébraïque.
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: dans un lieu saint
  rationale: Le nom «lieu» n’a pas d’article en hébreu; cette traduction évite de désigner à tort le «Lieu saint» comme espace technique précis du sanctuaire.
- source_word: וְלָבַשׁ אֶת־בְּגָדָיו
  choice: remettra ses vêtements
  rationale: Après avoir ôté les vêtements de lin pour se laver, il revêt ses vêtements; «remettra» exprime naturellement cette reprise sans alourdir la phrase.
- source_word: וְיָצָא
  choice: sortira
  rationale: Le verbe indique le déplacement hors du lieu où le lavage et le changement de vêtements ont eu lieu.
- source_word: וְעָשָׂה
  choice: offrira
  rationale: Avec l’holocauste pour complément, «offrir» est le verbe sacrificiel idiomatique en français.
- source_word: עֹלָתוֹ וְאֶת־עֹלַת הָעָם
  choice: son holocauste et celui du peuple
  rationale: «Holocauste» est le terme français traditionnel et précis pour עֹלָה; «celui du peuple» évite une répétition tout en maintenant le parallèle.
- source_word: וְכִפֶּר
  choice: fera l’expiation
  rationale: Cette expression conserve la portée rituelle large de כפר sans imposer une théorie particulière du mécanisme de l’expiation.
- source_word: בַּעֲדוֹ וּבְעַד הָעָם
  choice: pour lui-même et pour le peuple
  rationale: «Pour» rend de manière concise et naturelle la valeur représentative de בְּעַד.
theological_decisions:
- issue: Sens de כפר dans la législation sacrificielle du Lévitique
  choice: fera l’expiation
  alternative: fera propitiation; accomplira la purification rituelle
  rationale: «Faire l’expiation» garde l’étendue sémantique du terme dans le contexte du jour des Expiations, sans le réduire exclusivement à l’apaisement, au pardon ou à la purification.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit clairement la succession des actes rituels. «Lieu saint» reste en minuscules afin de préserver l’indétermination de l’hébreu, tandis que «holocauste» maintient le registre sacrificiel usuel.
