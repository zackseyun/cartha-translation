    rationale: L’idiome désigne l’installation ou l’investiture dans le service sacerdotal. « Investi » communique directement cette notion en français moderne.
  - severity: low
    issue: « Accomplira le rite d’expiation » explicite « rite ».
    rationale: Le contexte est rituel, mais כפר est rendu plus directement par « fera l’expiation », sans ajout lexical.
