  naturalness: La phrase révisée emploie le futur simple, plus naturel pour une prescription générale en français. « Investi » est idiomatique pour l’accès à une fonction et est plus précis que « établi » dans ce contexte. L’apposition finale est conservée, conformément à l’hébreu.
  terminology: « Prêtre », « oint », « investi », « expiation », « vêtements de lin » et « vêtements sacrés » sont cohérents avec le registre sacerdotal et ne surinterprètent pas le texte. « Investi » évite une terminologie confessionnelle spécifique tout en exprimant l’idiome de l’investiture.
