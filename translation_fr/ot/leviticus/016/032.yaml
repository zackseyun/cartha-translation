  text: וְ/כִפֶּ֨ר הַ/כֹּהֵ֜ן אֲשֶׁר יִמְשַׁ֣ח אֹת֗/וֹ וַ/אֲשֶׁ֤ר יְמַלֵּא֙ אֶת יָד֔/וֹ לְ/כַהֵ֖ן תַּ֣חַת אָבִ֑י/ו וְ/לָבַ֛שׁ אֶת בִּגְדֵ֥י הַ/בָּ֖ד בִּגְדֵ֥י הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/032.yaml
  text: And the priest who is anointed and whose hand is filled to serve as priest in place of his father shall make atonement[a], and he shall put on the linen garments, the holy garments.
translation:
  language: fr
  text: Le prêtre qui sera oint et investi[a] pour exercer le sacerdoce à la place de son père fera l’expiation et revêtira les vêtements de lin, les vêtements sacrés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à qui l’on remplira la main », expression hébraïque désignant l’investiture dans le service sacerdotal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: accomplira le rite d’expiation
  rationale: Dans ce contexte rituel sacerdotal, כפר désigne l’accomplissement du rite prescrit qui produit l’expiation ou la purification. Cette formulation française reste claire sans préciser davantage son mécanisme.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Le texte hébreu dit simplement « le prêtre » et l’identifie ensuite par son onction, son investiture et sa succession; il n’emploie pas ici le titre explicite de « grand prêtre ».
- source_word: אֲשֶׁר יִמְשַׁח אֹתוֹ
  choice: qui aura été oint
  rationale: Le passif convient au français et présente l’onction comme la qualification du successeur. Le futur antérieur exprime naturellement une action préalable à l’exercice décrit.
- source_word: וַאֲשֶׁר יְמַלֵּא אֶת יָדוֹ
  choice: et établi[a]
  rationale: L’expression littérale « remplir sa main » est un idiome d’investiture sacerdotale. « Établi » en transmet le sens institutionnel en français courant, tandis que la note conserve l’image hébraïque.
- source_word: לְכַהֵן
  choice: pour exercer le sacerdoce
  rationale: L’infinitif exprime l’exercice officiel de la fonction sacerdotale. Cette tournure est naturelle et digne en français.
- source_word: תַּחַת אָבִיו
  choice: à la place de son père
  rationale: תחת marque ici la succession ou le remplacement dans la fonction héréditaire.
- source_word: וְלָבַשׁ
  choice: et revêtira
  rationale: Le verbe décrit l’action de se vêtir; « revêtira » convient au registre rituel sans être obscur.
- source_word: בִּגְדֵי הַבָּד
  choice: les vêtements de lin
  rationale: בד désigne ici le lin des vêtements sacerdotaux.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: les vêtements sacrés
  rationale: La seconde expression est en apposition et qualifie les vêtements de lin comme réservés au service sacré.
theological_decisions:
- issue: Traduire הַכֹּהֵן par « prêtre » ou expliciter « grand prêtre »
  choice: le prêtre
  alternative: le grand prêtre
  rationale: Le contexte concerne le successeur dans la charge suprême, mais le texte hébreu conserve le terme général et le définit par une description. La traduction n’ajoute donc pas un titre absent.
- issue: Rendre littéralement ou idiomatiquement « remplir sa main »
  choice: établi, avec une note sur l’expression hébraïque
  alternative: dont on aura rempli la main; consacré; investi
  rationale: Une traduction strictement littérale serait opaque en français. « Établi » communique l’investiture dans la fonction sans introduire une terminologie confessionnelle particulière; la note assure la transparence.
- issue: Portée de כפר dans le rituel
  choice: accomplira le rite d’expiation
  alternative: fera l’expiation; procédera à la purification rituelle
  rationale: Le terme peut associer expiation et purification dans les textes sacerdotaux. La formulation retenue préserve le langage traditionnel d’expiation tout en signalant qu’il s’agit de l’acte rituel prescrit.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la désignation « le prêtre », la succession paternelle et l’apposition finale de l’hébreu, tout en rendant de façon intelligible l’idiome d’investiture.
