  to: Le prêtre qui sera oint et investi[a] pour exercer le sacerdoce à la place de son père fera l’expiation et revêtira les vêtements de lin, les vêtements sacrés.
  rationale: La révision supprime l’antériorité non exigée par l’hébreu, rend l’idiome d’investiture avec un terme français précis et maintient en note l’image hébraïque. Elle conserve la désignation non explicitée de « le prêtre », la succession paternelle et la double désignation appositionnelle des vêtements.
