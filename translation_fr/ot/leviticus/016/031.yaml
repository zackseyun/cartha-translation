  naturalness: « C’est pour vous un sabbat de repos complet » est naturel dans un registre biblique moderne et conserve « sabbat » comme terme cultuel. « Prescription perpétuelle » est une collocation juridique et biblique plus idiomatique et plus proche de חֻקַּת עוֹלָם que « prescription permanente ».
