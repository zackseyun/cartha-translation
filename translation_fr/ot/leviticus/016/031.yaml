  text: שַׁבַּ֨ת שַׁבָּת֥וֹן הִיא֙ לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם חֻקַּ֖ת עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/031.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall humble yourselves; it is a permanent statute.
translation:
  language: fr
  text: C’est pour vous un sabbat de repos complet ; vous vous imposerez des privations[a]. C’est une prescription perpétuelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous vous humilierez » ou « vous vous affligerez ». Cette expression est traditionnellement comprise comme incluant le jeûne et le renoncement à soi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת
  choice: sabbat
  rationale: Le terme est conservé comme désignation cultuelle précise de la Torah, plutôt que d’être réduit à l’idée générale d’un jour de repos.
- source_word: שַׁבָּתוֹן
  choice: repos complet
  rationale: Cette formulation rend la force intensive de שַׁבַּת שַׁבָּתוֹן en français moderne sans recourir à une répétition peu naturelle.
- source_word: הִיא לָכֶם
  choice: Ce sera pour vous
  rationale: Le futur convient au caractère prescriptif du contexte tout en conservant l’adresse à la communauté.
- source_word: וְעִנִּיתֶם
  choice: vous vous humilierez
  rationale: Le verbe exprime ici l’abaissement de soi et les privations associés au jour des Expiations. Cette traduction maintient la portée générale de l’expression hébraïque sans la limiter explicitement au jeûne.
- source_word: נַפְשֹׁתֵיכֶם
  choice: vous-mêmes, exprimé par le pronom réfléchi « vous vous »
  rationale: Dans cette construction, נֶפֶשׁ désigne idiomatiquement la personne elle-même. Une traduction littérale par « vos âmes » risquerait de suggérer une distinction anthropologique étrangère à l’expression.
- source_word: חֻקַּת עוֹלָם
  choice: une prescription permanente
  rationale: Cette expression communique clairement la force juridique durable de la formule législative hébraïque.
theological_decisions:
- issue: Portée du commandement d’abaissement de soi au jour des Expiations
  choice: vous vous humilierez
  alternative: vous vous imposerez des privations ; vous jeûnerez
  rationale: L’hébreu emploie l’expression générale ענה + נפשׁ et non un verbe signifiant directement « jeûner ». Le texte principal conserve donc cette portée plus large, tandis que la note signale les privations et l’interprétation traditionnelle incluant le jeûne.
translation_notes:
  register: Français international moderne, digne et accessible. « Sabbat » conserve le vocabulaire cultuel de la Torah ; « repos complet » explicite l’intensité de la formule hébraïque. La formulation évite à la fois l’archaïsme « humilier vos âmes » et une identification trop étroite avec le seul jeûne.
