  text: וְ/יָצָ֗א אֶל הַ/מִּזְבֵּ֛חַ אֲשֶׁ֥ר לִ/פְנֵֽי יְהוָ֖ה וְ/כִפֶּ֣ר עָלָ֑י/ו וְ/לָקַ֞ח מִ/דַּ֤ם הַ/פָּר֙ וּ/מִ/דַּ֣ם הַ/שָּׂעִ֔יר וְ/נָתַ֛ן עַל קַרְנ֥וֹת הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/018.yaml
  text: Then he shall go out to the altar that is before Yahweh and make atonement for it[a], and he shall take some of the bull's blood and some of the goat's blood and put it on the horns of the altar all around.
translation:
  language: fr
  text: Puis il sortira vers l’autel qui est devant Yahweh et accomplira sur cet autel le rite d’expiation[a]. Il prendra du sang du taureau et du sang du bouc, et en mettra sur les cornes de l’autel, tout autour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le purifiera rituellement » ; dans les rites sacerdotaux, le verbe hébreu peut exprimer une purification.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: Puis il sortira
  rationale: Le waw suivi du qatal poursuit la suite des actes prescrits. Le futur français convient au déroulement rituel et conserve le mouvement vers l’extérieur depuis le sanctuaire intérieur.
- source_word: הַמִּזְבֵּחַ אֲשֶׁר לִפְנֵי יְהוָה
  choice: l’autel qui est devant Yahweh
  rationale: La formulation reste proche de l’hébreu et situe l’autel dans l’espace cultuel, devant Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וְכִפֶּר עָלָיו
  choice: fera pour lui le rite d’expiation
  rationale: Cette expression française naturelle conserve le sens cultuel de כפר appliqué à l’autel, tout en laissant la note signaler sa dimension de purification.
- source_word: וְלָקַח מִדַּם הַפָּר וּמִדַּם הַשָּׂעִיר
  choice: Il prendra du sang du taureau et du sang du bouc
  rationale: Le partitif « du sang » rend les deux emplois de מִן. « Bouc » exprime naturellement en français le mâle désigné par שָׂעִיר.
- source_word: וְנָתַן עַל קַרְנוֹת הַמִּזְבֵּחַ סָבִיב
  choice: et en mettra sur les cornes de l’autel, tout autour
  rationale: « En » reprend naturellement le sang des deux animaux sans imposer explicitement l’idée d’un mélange; « tout autour » rend סָבִיב.
theological_decisions:
- issue: Sens de כפר dans un contexte rituel sacerdotal
  choice: fera pour lui le rite d’expiation
  alternative: le purifiera rituellement
  rationale: « Rite d’expiation » préserve la portée sacrificielle traditionnelle du verbe sans définir une théorie particulière de l’expiation. La note maintient visible la nuance réelle de purification cultuelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur marque la prescription rituelle. « Taureau » et « bouc » sont précis sans alourdir le texte; la syntaxe évite de trancher si les deux sangs sont explicitement mélangés.
