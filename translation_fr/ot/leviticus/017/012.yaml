  text: עַל כֵּ֤ן אָמַ֨רְתִּי֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל כָּל נֶ֥פֶשׁ מִ/כֶּ֖ם לֹא תֹ֣אכַל דָּ֑ם וְ/הַ/גֵּ֛ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶ֖ם לֹא יֹ֥אכַל דָּֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/012.yaml
  text: Therefore I said to the sons of Israel[a], ‘No person among you shall eat blood[b], and the sojourner who sojourns among you shall not eat blood.’
translation:
  language: fr
  text: 'C’est pourquoi j’ai dit aux fils d’Israël[a] : « Aucun de vous ne mangera de sang, et l’étranger qui réside parmi vous[b] ne mangera pas de sang. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux enfants d’Israël » ou « aux Israélites ». L’hébreu dit littéralement « aux fils d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Le terme désigne ici un étranger établi durablement au sein de la communauté d’Israël, par opposition à un visiteur de passage. On peut aussi traduire « résident étranger ».
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette locution exprime la conclusion tirée de la raison donnée au verset précédent concernant la vie et le sang.
- source_word: אָמַרְתִּי
  choice: j’ai dit
  rationale: Le passé composé est naturel en français moderne et rend l’accompli hébreu dans ce contexte de discours législatif.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: Cette formulation conserve l’expression masculine du texte hébreu et son appellation traditionnelle, sans la réduire explicitement aux seuls hommes.
- source_word: כָּל נֶפֶשׁ מִכֶּם
  choice: Aucun de vous
  rationale: נֶפֶשׁ désigne ici une personne; cette tournure idiomatique restitue clairement la portée distributive de l’interdiction.
- source_word: לֹא תֹאכַל דָּם
  choice: ne mangera de sang
  rationale: Le futur à valeur prescriptive convient au registre juridique et conserve l’expression concrète « manger du sang ».
- source_word: הַגֵּר
  choice: l’immigré
  rationale: גֵּר désigne ici un non-Israélite établi au sein de la communauté, et non un simple visiteur ou un étranger extérieur au pays.
- source_word: הַגָּר בְּתוֹכְכֶם
  choice: qui réside parmi vous
  rationale: La relative rend naturellement le participe hébreu et souligne la résidence durable au milieu d’Israël.
- source_word: לֹא יֹאכַל דָּם
  choice: ne mangera pas de sang
  rationale: La répétition applique explicitement au résident non israélite la même interdiction qu’aux Israélites.
theological_decisions:
- issue: Désignation collective genrée לִבְנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  alternative: aux Israélites / aux enfants d’Israël
  rationale: Le choix maintient la forme masculine représentative de l’hébreu sans en tirer une exclusion théologique des femmes.
- issue: Statut du גֵּר
  choice: l’immigré qui réside parmi vous
  alternative: l’étranger / l’étranger résident
  rationale: La formulation indique qu’il s’agit d’un non-Israélite intégré comme résident à la vie juridique de la communauté, sans lui attribuer davantage que le texte ne dit.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur exprime ici une interdiction légale. La répétition du mot « sang » et le parallélisme entre l’Israélite et l’immigré sont conservés.
