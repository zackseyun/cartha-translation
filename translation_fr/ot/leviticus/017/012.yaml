review_pass:
  verdict: revise
  source_fidelity: Le sens de l’interdiction et son extension aux בני ישראל comme au גֵּר sont correctement rendus. Toutefois, « immigré » évoque en français contemporain les catégories migratoires modernes et affaiblit la notion juridique ancienne d’un étranger résident. « Étranger qui réside parmi vous » est plus fidèle à גֵּר et à la répétition participiale הַגָּר.
  naturalness: La phrase est claire, idiomatique et conserve le registre législatif. Le futur a une valeur prescriptive naturelle dans ce contexte. La révision proposée améliore la précision sans alourdir la formulation.
  terminology: « Fils d’Israël » correspond à l’expression hébraïque et convient ici. « Étranger » qualifié par « qui réside parmi vous » rend mieux גֵּר que « immigré ». La note doit être ancrée au terme qu’elle explique, non à la dernière occurrence de « sang ».
