    issue: « l’immigré » pour הַגֵּר
    rationale: En français international moderne, « immigré » renvoie volontiers à une personne ayant migré dans un cadre contemporain. Le terme hébreu désigne plus précisément un étranger résident intégré à la communauté; la relative « qui réside parmi vous » permet de conserver cette nuance.
