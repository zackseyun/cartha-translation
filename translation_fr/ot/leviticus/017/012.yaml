  rationale: La révision remplace un terme moderne potentiellement anachronique par une expression qui rend plus exactement le statut du גֵּר, tout en gardant la relative correspondant à הַגָּר בְּתוֹכְכֶם. Elle déplace également la note culturelle vers son référent lexical. Le parallélisme et la répétition de l’interdiction de manger du sang sont préservés.
