id: LEV.17.9
reference: Leviticus 17:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶל פֶּ֜תַח אֹ֤הֶל מוֹעֵד֙ לֹ֣א יְבִיאֶ֔/נּוּ לַ/עֲשׂ֥וֹת אֹת֖/וֹ לַ/יהוָ֑ה וְ/נִכְרַ֛ת הָ/אִ֥ישׁ הַ/ה֖וּא מֵ/עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/009.yaml
  text: and does not bring it to the entrance of the tent of meeting to offer it to Yahweh[b][a], that man shall be cut off from his people.
translation:
  language: fr
  text: et ne l’amène pas à l’entrée de la tente de la rencontre pour l’offrir à Yahweh[a], cet homme sera retranché de son peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « pour le faire pour Yahweh »; dans ce contexte, l’expression hébraïque désigne la présentation du sacrifice.'
    reason: lexical_alternative
  - marker: b
    text: « Sera retranché » est une formule juridique dont la peine exacte n’est pas précisée ici; elle peut évoquer l’exclusion de la communauté de l’alliance ou un jugement direct de Dieu.
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  choice: entrée
  rationale: Le terme désigne l’ouverture ou le lieu d’accès; « entrée » est naturel et précis dans le contexte du sanctuaire.
- source_word: אֹהֶל מוֹעֵד
  choice: tente de la rencontre
  rationale: Cette expression désigne le sanctuaire sous forme de tente où Yahweh rencontre son peuple; cette formulation reste transparente en français moderne.
- source_word: יְבִיאֶנּוּ
  choice: l’amène
  rationale: Le suffixe renvoie à l’animal sacrificiel mentionné dans le contexte précédent. Le verbe concret « amener » convient mieux à un animal que « apporter ».
- source_word: לַעֲשׂוֹת אֹתוֹ לַיהוָה
  choice: pour l’offrir à Yahweh
  rationale: Littéralement « pour le faire pour Yahweh », mais, dans ce contexte sacrificiel, עשה désigne idiomatiquement l’accomplissement ou la présentation du sacrifice.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וְנִכְרַת
  choice: sera retranché
  rationale: Le niphal de כרת constitue ici une formule juridique dont le mode précis d’exécution n’est pas indiqué; « sera retranché » conserve cette indétermination.
- source_word: הָאִישׁ הַהוּא
  choice: cet homme
  rationale: La formulation restitue le masculin singulier concret et le style juridique du texte hébreu.
- source_word: מֵעַמָּיו
  choice: de son peuple
  rationale: Cette expression rend sobrement la séparation d’avec la communauté à laquelle appartient le coupable, sans préciser davantage la nature de la peine.
theological_decisions:
- issue: Sens de la peine exprimée par וְנִכְרַת
  choice: Conserver la formule « sera retranché » sans préciser le mécanisme de la peine.
  alternative: « sera mis à mort », « sera exclu de la communauté » ou « sera détruit »
  rationale: La formule juridique hébraïque ne détermine pas ici s’il s’agit de mort, d’exclusion communautaire ou d’un jugement divin direct. La traduction préserve donc cette tension.
- issue: Rendu de הָאִישׁ הַהוּא
  choice: « cet homme »
  alternative: « cette personne » ou « celui-là »
  rationale: Le texte source emploie une expression juridique au masculin singulier; le rendu choisi en conserve la forme et la précision.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le lien avec le verset précédent. « Tente de la rencontre » privilégie la transparence du syntagme hébreu, tandis que « sera retranché » maintient volontairement l’ambiguïté juridique du texte.
