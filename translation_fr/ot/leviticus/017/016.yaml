  text: But if he does not wash his clothes and does not bathe his body[b][a], then he shall bear his guilt.
translation:
  language: fr
  text: Mais s’il ne lave pas ses vêtements et ne lave pas son corps[a], il portera sa faute[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sa chair ». Ici, l’expression désigne son corps.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il en portera la culpabilité » ou « il en subira les conséquences ». L’expression juridique hébraïque peut inclure à la fois la culpabilité et ses conséquences.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Mais s’il
  rationale: La conjonction introduit le cas contraire par rapport à la procédure de purification énoncée au verset précédent. « Mais s’il » rend naturellement cette nuance en français.
- source_word: יְכַבֵּס
  choice: lave ses vêtements
  rationale: Le piel de כבס désigne normalement le lavage de vêtements. L’objet, sous-entendu en hébreu, est repris du verset précédent pour que la phrase soit claire en français.
- source_word: וּבְשָׂרוֹ לֹא יִרְחָץ
  choice: ne se lave pas le corps
  rationale: בשר signifie littéralement « chair », mais désigne ici le corps soumis au lavage rituel. Cette formulation française est naturelle et distingue le lavage du corps de celui des vêtements.
- source_word: וְנָשָׂא
  choice: il portera
  rationale: Dans cette construction conditionnelle juridique, le verbe exprime la conséquence du manquement. Le futur français convient au caractère normatif du texte.
- source_word: עֲוֹנוֹ
  choice: la responsabilité de sa faute
  rationale: עון peut désigner la faute, la culpabilité ou les conséquences qui en découlent. Cette formulation conserve la dimension de responsabilité sans réduire l’expression à la faute morale seule ni à une peine précisément définie.
theological_decisions:
- issue: Sens de la formule juridique וְנָשָׂא עֲוֹנוֹ
  choice: il portera la responsabilité de sa faute
  alternative: il portera sa faute ; il subira la peine due à sa faute
  rationale: La formule hébraïque peut englober à la fois la culpabilité et ses conséquences. La traduction maintient cette tension sans préciser une sanction que le texte ne nomme pas.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe juridique reste concise. La répétition de « lave » correspond au parallélisme hébreu, tandis que « ses vêtements » explicite l’objet sous-entendu d’après le contexte immédiat.
