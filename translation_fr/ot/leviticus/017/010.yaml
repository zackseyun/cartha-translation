  source_fidelity: Le sens général est bien rendu, y compris l’opposition divine et la formule pénale volontairement non explicitée. Toutefois, « ou parmi les immigrés » ne correspond pas syntaxiquement à la coordination hébraïque de deux catégories individuelles et transforme inutilement le singulier גֵּר en pluriel. « Étranger qui réside parmi eux » rend plus exactement le résident non israélite.
  naturalness: La phrase révisée est plus naturelle et juridiquement nette en français moderne. « Tournerai mon visage contre » conserve l’image hébraïque dans une formulation française plus usuelle que « tournerai ma face ».
  terminology: '« Étranger qui réside parmi eux » est préférable à « immigrés établis au milieu d’eux » : il évite un pluriel non requis et le registre administratif contemporain d’« immigré », tout en conservant le statut de résident étranger. « Retrancher » préserve correctement l’ambiguïté de la sanction.'
