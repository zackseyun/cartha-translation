  text: וְ/אִ֨ישׁ אִ֜ישׁ מִ/בֵּ֣ית יִשְׂרָאֵ֗ל וּ/מִן הַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם אֲשֶׁ֥ר יֹאכַ֖ל כָּל דָּ֑ם וְ/נָתַתִּ֣י פָנַ֗/י בַּ/נֶּ֨פֶשׁ֙ הָ/אֹכֶ֣לֶת אֶת הַ/דָּ֔ם וְ/הִכְרַתִּ֥י אֹתָ֖/הּ מִ/קֶּ֥רֶב עַמָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/010.yaml
  text: And any man from the house of Israel[a], or from the sojourner who sojourns among them, who eats any blood—I will set my face against the person who eats the blood[c][b], and I will cut him off from among his people.
translation:
  language: fr
  text: Si un homme de la maison d’Israël, ou un étranger qui réside parmi eux[a], mange quelque sang que ce soit, je tournerai mon visage contre la personne qui mange le sang[b] et je la retrancherai du milieu de son peuple[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque désigne un étranger qui réside au sein de la communauté, et non un simple voyageur de passage.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « l’être qui mange » ; ici, le mot hébreu désigne la personne elle-même.'
    reason: lexical_alternative
  - marker: c
    text: « Retrancher » est une formule de sanction liée à l’alliance. Ce verset ne précise pas s’il s’agit de la mort, de l’exclusion ou d’une autre forme de jugement divin.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ אִישׁ
  choice: Si un homme
  rationale: Le redoublement idiomatique exprime une portée distributive (« tout homme », « quiconque »). Dans cette formule juridique masculine, « un homme » reste naturel en français et prépare la condition.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: de la maison d’Israël
  rationale: Conserve la formule collective et juridique de l’hébreu sans la réduire au simple nom « Israël ».
- source_word: וּמִן הַגֵּר הַגָּר בְּתוֹכָם
  choice: ou parmi les immigrés établis au milieu d’eux
  rationale: גֵּר désigne un non-Israélite résidant durablement dans la communauté, plutôt qu’un étranger de passage. Le pluriel collectif rend la construction française naturelle tout en gardant l’idée de résidence.
- source_word: אֲשֶׁר יֹאכַל כָּל דָּם
  choice: mange du sang, quel qu’il soit
  rationale: Le verbe ordinaire « manger » traduit directement יֹאכַל. La tournure « quel qu’il soit » exprime clairement la portée totale de כָּל דָּם.
- source_word: וְנָתַתִּי פָנַי
  choice: je tournerai ma face contre
  rationale: Préserve l’image anthropomorphique et l’idiome de l’opposition divine, dans une formulation française intelligible et digne.
- source_word: בַּנֶּפֶשׁ הָאֹכֶלֶת
  choice: contre la personne qui mange
  rationale: Dans ce contexte juridique, נֶפֶשׁ désigne l’individu fautif. « Personne » évite d’introduire ici une conception métaphysique particulière de l’âme.
- source_word: אֶת הַדָּם
  choice: ce sang
  rationale: Le démonstratif reprend naturellement en français le sang qui vient d’être mentionné, tout en rendant la détermination de l’hébreu.
- source_word: וְהִכְרַתִּי אֹתָהּ
  choice: et je la retrancherai
  rationale: « Retrancher » conserve la formule d’alliance sans décider si la sanction est la mort, l’exclusion ou une autre intervention divine. Le pronom féminin reprend grammaticalement « la personne ».
- source_word: מִקֶּרֶב עַמָּהּ
  choice: du milieu de son peuple
  rationale: Rend directement l’idée d’exclusion hors du groupe auquel appartient la personne, sans préciser davantage la nature de ce lien collectif.
theological_decisions:
- issue: Sens de la formule pénale וְהִכְרַתִּי (« je retrancherai »)
  choice: Conserver « retrancher » sans préciser le mode du jugement.
  alternative: Mettre à mort, exclure de la communauté, ou supprimer par un jugement divin.
  rationale: Le verset annonce un grave jugement lié à l’alliance, mais ne définit pas ici son mécanisme. La traduction maintient cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe conditionnelle rend naturellement la formule juridique hébraïque. Les images de la « face » divine et du « retranchement » sont conservées afin de préserver la force et l’ambiguïté du texte source.
