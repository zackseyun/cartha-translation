revisions:
- from: Car la vie de la chair est dans le sang, et moi, je vous l’ai donné sur l’autel pour accomplir le rite d’expiation pour vos vies[a] ; car c’est le sang qui accomplit l’expiation par la vie[b].
  to: Car la vie de la chair est dans le sang, et moi, je vous l’ai donné sur l’autel afin de faire expiation pour vos vies[a] ; car c’est le sang qui fait expiation par la vie[b].
  rationale: La révision retire l’ajout non exprimé de « rite » et emploie « faire expiation » pour les deux occurrences de כפר. Elle conserve l’emphase de « moi », le choix cohérent de « vie » pour נפש et la formulation volontairement compacte « par la vie » dans la proposition finale, avec une note qui présente une explicitation possible sans l’imposer.
