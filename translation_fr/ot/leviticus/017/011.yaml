    rationale: לְכַפֵּר désigne l’action d’expiation; le substantif « rite » n’est pas présent dans l’hébreu. Cet ajout est évitable et introduit une précision cultuelle supplémentaire.
  - severity: low
    issue: Incohérence entre les deux rendus de כפר.
    rationale: « Accomplir le rite d’expiation » puis « accomplit l’expiation » ne reproduit pas aussi clairement la répétition du même lexème hébreu. Employer « faire expiation » aux deux endroits améliore la cohérence.
