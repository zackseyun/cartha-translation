id: LEV.17.11
reference: Leviticus 17:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י נֶ֣פֶשׁ הַ/בָּשָׂר֮ בַּ/דָּ֣ם הִוא֒ וַ/אֲנִ֞י נְתַתִּ֤י/ו לָ/כֶם֙ עַל הַ/מִּזְבֵּ֔חַ לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶ֑ם כִּֽי הַ/דָּ֥ם ה֖וּא בַּ/נֶּ֥פֶשׁ יְכַפֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/011.yaml
  text: For the life of the flesh is in the blood[a], and I have given it to you on the altar to make atonement for your lives[b], for it is the blood that makes atonement by the life.
translation:
  language: fr
  text: Car la vie de la chair est dans le sang, et moi, je vous l’ai donné sur l’autel afin de faire expiation pour vos vies[a] ; car c’est le sang qui fait expiation par la vie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu néfèsh peut désigner la vie, l’être vivant ou la personne ; ici, le contexte indique la vie.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « car le sang fait expiation au moyen de la vie qui est en lui ».'
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: vie
  rationale: Dans ce contexte sacrificiel, le terme désigne la vie qui anime la chair plutôt qu’une âme immatérielle. « Vie » maintient aussi le lien lexical entre les trois emplois du terme dans le verset.
- source_word: הַבָּשָׂר
  choice: la chair
  rationale: Rendu direct et usuel de בָּשָׂר, désignant ici la chair vivante des créatures.
- source_word: בַּדָּם
  choice: dans le sang
  rationale: 'La préposition בְּ avec l’article exprime naturellement ici la localisation ou la sphère : la vie de la chair est dans le sang.'
- source_word: נְתַתִּיו לָכֶם
  choice: je vous l’ai donné
  rationale: Le passé composé exprime naturellement en français l’acte accompli dont la disposition demeure valable.
- source_word: עַל הַמִּזְבֵּחַ
  choice: sur l’autel
  rationale: Formulation française naturelle qui conserve précisément le cadre cultuel.
- source_word: לְכַפֵּר
  choice: pour accomplir le rite d’expiation
  rationale: Dans le Lévitique, כפר désigne l’action cultuelle qui traite le péché ou l’impureté. Cette tournure reste intelligible et évite d’imposer une théorie particulière du mécanisme expiatoire.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: pour vos vies
  rationale: Le choix maintient la cohérence avec les autres emplois de נֶפֶשׁ dans le verset et n’introduit pas une distinction entre corps et âme absente de l’hébreu.
- source_word: כִּי הַדָּם הוּא
  choice: car c’est le sang qui
  rationale: La construction française rend à la fois la valeur explicative de כִּי et la mise en relief portée par הוּא.
- source_word: בַּנֶּפֶשׁ
  choice: par la vie
  rationale: La formule conserve la concision et l’ambiguïté de l’hébreu, où בְּ peut être compris de façon instrumentale ou causale, sans expliciter dans le texte ce que l’original laisse compact.
- source_word: יְכַפֵּר
  choice: accomplit l’expiation
  rationale: Cette formulation reprend le vocabulaire cultuel de la première occurrence de כפר et préserve la cohérence interne du verset.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans la législation sacrificielle
  choice: « vie » dans tout le verset
  alternative: « âme » ou « personne »
  rationale: L’argument du verset repose sur la vie associée au sang. « Âme » pourrait suggérer une anthropologie dualiste que l’hébreu n’impose pas ici.
- issue: Valeur de בַּנֶּפֶשׁ dans la proposition finale
  choice: « par la vie »
  alternative: « à cause de la vie » ou « au moyen de la vie qui est en lui »
  rationale: La syntaxe hébraïque est dense et discutée. Le texte principal garde une formulation marquée qui ne tranche pas entièrement entre moyen et fondement, tandis qu’une note donne l’explicitation possible.
- issue: Portée cultuelle de כפר
  choice: « accomplir le rite d’expiation » / « accomplit l’expiation »
  alternative: « faire propitiation » ou « pardonner »
  rationale: « Expiation » rend la fonction cultuelle sans préciser si l’accent théologique doit porter exclusivement sur la propitiation, la purification ou une autre dimension.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « vie » et d’« expiation » est volontaire afin de préserver les liens lexicaux de l’hébreu. « Et moi » garde l’emphase du pronom divin explicite. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
