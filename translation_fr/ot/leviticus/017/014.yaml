source:
  edition: WLC
  text: כִּֽי נֶ֣פֶשׁ כָּל בָּשָׂ֗ר דָּמ֣/וֹ בְ/נַפְשׁ/וֹ֮ הוּא֒ וָֽ/אֹמַר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל דַּ֥ם כָּל בָּשָׂ֖ר לֹ֣א תֹאכֵ֑לוּ כִּ֣י נֶ֤פֶשׁ כָּל בָּשָׂר֙ דָּמ֣/וֹ הִ֔וא כָּל אֹכְלָ֖י/ו יִכָּרֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/014.yaml
  text: For the life of all flesh is its blood[a]; in its life it is. So I said to the sons of Israel, ‘You shall not eat the blood of any flesh[b], for the life of all flesh is its blood.’ Everyone who eats it shall be cut off.
translation:
  language: fr
  text: 'Car la vie de tout être de chair, c’est son sang : son sang est dans sa vie[a]. C’est pourquoi j’ai dit aux Israélites[b] : « Vous ne mangerez le sang d’aucun être de chair, car la vie de tout être de chair, c’est son sang. » Quiconque en mangera sera retranché.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu, formulation condensée : « son sang, dans sa vie, il est ». On peut aussi comprendre : « son sang est sa vie ».'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « aux fils d’Israël », c’est-à-dire aux Israélites.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: vie
  rationale: Dans ce contexte alimentaire et sacrificiel, le terme désigne la vie qui anime l’être de chair, et non une « âme » immatérielle. « Vie » préserve le fondement du rapport entre le sang et la vie.
- source_word: בָּשָׂר
  choice: être de chair
  rationale: Cette formulation conserve l’image hébraïque de la chair tout en indiquant naturellement en français qu’il s’agit d’un être vivant, et non de la viande considérée isolément.
- source_word: דָּם / דָּמוֹ
  choice: sang / son sang
  rationale: Le rendu direct est nécessaire, puisque le sang constitue à la fois l’objet de l’interdiction et le fondement de celle-ci.
- source_word: בְנַפְשׁוֹ הוּא
  choice: il est indissociable de sa vie
  rationale: La construction hébraïque est très condensée et peut se comprendre comme situant le sang dans la vie ou comme l’identifiant à elle. Le français exprime leur lien étroit sans effacer l’ambiguïté, signalée en note.
- source_word: וָאֹמַר
  choice: C’est pourquoi j’ai dit
  rationale: 'Le contexte donne au waw une valeur argumentative : le principe concernant la vie et le sang fonde l’interdiction adressée à Israël.'
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aux Israélites
  rationale: Formulation moderne et naturelle pour désigner collectivement les fils d’Israël, sans suggérer que seuls les hommes sont concernés.
- source_word: לֹא תֹאכֵלוּ
  choice: Vous ne mangerez
  rationale: Le futur à valeur d’interdiction convient au registre juridique et solennel du passage.
- source_word: כָּל אֹכְלָיו
  choice: Quiconque en mangera
  rationale: Le singulier distributif hébreu vise toute personne qui mangerait le sang ; « quiconque » rend clairement cette portée générale.
- source_word: יִכָּרֵת
  choice: sera retranché
  rationale: Ce rendu traditionnel conserve la force juridique et théologique de la formule sans préciser indûment s’il s’agit de mort, d’exclusion communautaire ou d’un jugement divin.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans son rapport au sang
  choice: « vie », le sang étant présenté comme indissociable de la vie de l’être de chair
  alternative: « âme », dans un sens métaphysique, ou identification absolument littérale du sang et de la vie
  rationale: Le verset fonde l’interdiction sur le rapport vital entre le sang et la créature. « Vie » évite d’introduire une anthropologie doctrinale étrangère au contexte, tandis que la note conserve les diverses possibilités syntaxiques.
- issue: Nature de la peine exprimée par יִכָּרֵת
  choice: « sera retranché », sans autre précision
  alternative: « sera mis à mort », « sera exclu » ou « sera supprimé de la communauté »
  rationale: La formule hébraïque ne précise pas ici le mécanisme de la sanction. Le texte français préserve donc cette tension juridique et théologique.
translation_notes:
  register: Français international moderne, digne et accessible. « Être de chair » maintient l’image biblique sans l’ambiguïté courante de « chair » prise au sens de viande. La répétition concernant la vie et le sang est conservée, ainsi que la formule juridique « sera retranché ».
