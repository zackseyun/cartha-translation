source:
  edition: WLC
  text: וְ/אֶל פֶּ֜תַח אֹ֣הֶל מוֹעֵד֮ לֹ֣א הֱבִיא/וֹ֒ לְ/הַקְרִ֤יב קָרְבָּן֙ לַֽ/יהוָ֔ה לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה דָּ֣ם יֵחָשֵׁ֞ב לָ/אִ֤ישׁ הַ/הוּא֙ דָּ֣ם שָׁפָ֔ךְ וְ/נִכְרַ֛ת הָ/אִ֥ישׁ הַ/ה֖וּא מִ/קֶּ֥רֶב עַמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/004.yaml
  text: 'and has not brought it to the entrance of the tent of meeting to present it as an offering to Yahweh before the tabernacle of Yahweh[a], blood shall be imputed to that man: he has shed blood[c][b], and that man shall be cut off from among his people.'
translation:
  language: fr
  text: 'et ne l’a pas amené à l’entrée de la tente de la rencontre pour le présenter en offrande à Yahweh, devant la demeure de Yahweh, le sang sera mis au compte de cet homme[a] : il a versé le sang. Cet homme sera retranché du milieu de son peuple[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le sang sera compté à cet homme »; l’expression indique qu’il est tenu pour responsable d’avoir versé le sang.'
    reason: lexical_alternative
  - marker: b
    text: Ici, « retranché » ne précise pas si la sanction est la mort, l’expulsion ou une autre forme d’exclusion du peuple.
    reason: cultural_note
lexical_decisions:
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: l’entrée de la tente de la rencontre
  rationale: « Entrée » rend naturellement פֶּתַח. « Tente de la rencontre » conserve le sens de la désignation cultuelle אֹהֶל מוֹעֵד dans un français clair.
- source_word: הֱבִיאוֹ
  choice: ne l’a pas amené
  rationale: Le hiphil de בוא signifie « amener/apporter »; le pronom renvoie à l’animal abattu mentionné au verset précédent.
- source_word: לְהַקְרִיב קָרְבָּן
  choice: pour le présenter en offrande
  rationale: הקריב exprime ici l’action de présenter ou d’approcher dans un cadre sacrificiel; cette formulation évite la répétition peu naturelle « offrir une offrande ».
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La translittération représente explicitement le nom divin יהוה présent dans le texte hébreu.
- source_word: לִפְנֵי מִשְׁכַּן יְהוָה
  choice: devant la demeure de Yahweh
  rationale: לִפְנֵי a son sens spatial de « devant » et מִשְׁכָּן désigne la demeure sanctuaire; « demeure » rend aussi le lien avec la racine hébraïque sans imposer le terme traditionnel « tabernacle ».
- source_word: דָּם יֵחָשֵׁב לָאִישׁ הַהוּא
  choice: le sang sera mis au compte de cet homme
  rationale: Cette formulation reproduit l’image comptable et judiciaire du texte hébreu tout en restant intelligible en français; elle ne remplace pas silencieusement « sang » par l’interprétation « culpabilité de sang ».
- source_word: דָּם שָׁפָךְ
  choice: il a versé le sang
  rationale: Expression française naturelle et proche de l’idiome hébreu désignant un acte de sang.
- source_word: וְנִכְרַת
  choice: sera retranché
  rationale: « Retranché » conserve la métaphore et l’indétermination de la formule juridique et allianceuse hébraïque.
- source_word: מִקֶּרֶב עַמּוֹ
  choice: du milieu de son peuple
  rationale: Rendu direct de la formule d’exclusion, naturel dans ce registre juridique solennel.
theological_decisions:
- issue: Portée juridique de דָּם יֵחָשֵׁב
  choice: le sang sera mis au compte de cet homme
  alternative: cet homme sera tenu pour coupable de meurtre
  rationale: Le choix conserve à la fois le mot « sang » et l’idée d’imputation. La note explicite la portée juridique sans effacer l’image du texte.
- issue: Nature de la peine exprimée par וְנִכְרַת
  choice: sera retranché
  alternative: sera mis à mort / sera exclu
  rationale: Le verset ne précise pas si le retranchement correspond à la mort, à l’expulsion ou à une autre forme d’exclusion de l’alliance; la traduction maintient cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase demeure liée au cas juridique commencé au verset précédent. Le nom divin est translittéré « Yahweh ». Les formulations « mis au compte » et « retranché » préservent les images juridiques hébraïques ainsi que leur part d’ambiguïté.
