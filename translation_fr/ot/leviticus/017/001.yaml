  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Yahweh parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol de דבר introduit un nouvel acte de parole dans le récit. « Parla » convient à la formule solennelle et se distingue naturellement de l’introduction du contenu qui suit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin יהוה. « Yahweh » le rend comme nom propre plutôt que de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition introduit ici le destinataire de la parole ; « à » est l’équivalent français naturel.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: « Moïse » est la forme française conventionnelle du nom hébreu מֹשֶׁה.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Dans cette formule, l’infinitif לֵאמֹר introduit le contenu du discours. « En ces termes » transmet cette fonction en français moderne sans la lourdeur de « disant ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le verset emploie explicitement le tétragramme comme nom personnel. Le rendre par « Yahweh » préserve cette donnée du texte source, tandis que « le SEIGNEUR » relève de la tradition de substitution liturgique.
translation_notes:
  register: Français moderne, digne et naturel. La formule hébraïque est conservée dans sa solennité, mais l’hébraïsme peu idiomatique « disant » est rendu fonctionnellement par « en ces termes ».
