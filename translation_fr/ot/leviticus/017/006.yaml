base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/006.yaml
  text: And the priest shall throw the blood against the altar of Yahweh at the entrance of the tent of meeting[b][a], and shall burn the fat as a pleasing aroma to Yahweh.
translation:
  language: fr
  text: Le prêtre projettera[a] le sang contre l’autel de Yahweh, à l’entrée de la tente de la Rencontre, et il fera fumer la graisse comme un parfum agréable à Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « aspergera le sang sur l’autel » ou « lancera le sang contre l’autel ». Le verbe hébreu désigne ici l’application rituelle du sang par le prêtre.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « en odeur apaisante » ; on traduit aussi : « comme un parfum apaisant » ou « comme une odeur agréable ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרַק
  choice: projettera
  rationale: Dans le rituel sacrificiel, זָרַק désigne l’application du sang à l’autel par un geste de projection. « Projettera » conserve la force du mouvement sans suggérer une simple aspersion légère.
- source_word: עַל מִזְבַּח יְהוָה
  choice: contre l’autel de Yahweh
  rationale: Avec זָרַק, עַל indique ici la surface vers laquelle le sang est projeté. « Contre » exprime naturellement ce mouvement en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu par sa translittération usuelle afin de conserver le nom personnel présent dans le texte hébreu.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à l’entrée de la tente de la rencontre
  rationale: פֶּתַח désigne l’entrée ou l’ouverture, et אֹהֶל מוֹעֵד le lieu où se fait la rencontre fixée; cette formulation est claire et naturelle en français moderne.
- source_word: וְהִקְטִיר
  choice: fera fumer
  rationale: Dans le vocabulaire sacerdotal, le verbe désigne l’action de brûler sur l’autel de manière à faire monter la fumée. « Fera fumer » préserve cette nuance rituelle.
- source_word: הַחֵלֶב
  choice: la graisse
  rationale: Le terme désigne les parties grasses réservées à la combustion sur l’autel.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: comme un parfum agréable
  rationale: Cette formule sacrificielle décrit une odeur accueillie favorablement par Dieu. « Parfum agréable » est idiomatique, digne et accessible.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin; sa translittération maintient la distinction entre un nom personnel et un titre.
- issue: Portée de רֵיחַ נִיחֹחַ
  choice: un parfum agréable
  alternative: un parfum apaisant
  rationale: « Agréable » exprime l’acceptation divine sans imposer l’idée que le sacrifice calmerait une colère; « apaisant » demeure une possibilité lexicale signalée en note.
translation_notes:
  register: Français international moderne, sobre et liturgiquement digne. Le futur exprime la prescription rituelle. « Faire fumer » conserve la précision du vocabulaire sacrificiel hébreu, tandis que les notes maintiennent les principales ambiguïtés lexicales.
