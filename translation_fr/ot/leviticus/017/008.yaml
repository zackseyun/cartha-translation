  text: וַ/אֲלֵ/הֶ֣ם תֹּאמַ֔ר אִ֥ישׁ אִישׁ֙ מִ/בֵּ֣ית יִשְׂרָאֵ֔ל וּ/מִן הַ/גֵּ֖ר אֲשֶׁר יָג֣וּר בְּ/תוֹכָ֑/ם אֲשֶׁר יַעֲלֶ֥ה עֹלָ֖ה אוֹ זָֽבַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/008.yaml
  text: 'And you shall say to them: Any man from the house of Israel[a], or from the sojourner who sojourns among them[b], who offers up a burnt offering or a sacrifice—'
translation:
  language: fr
  text: 'Tu leur diras : Tout homme de la maison d’Israël[a], ou tout étranger résidant au milieu d’eux[b], qui offrira un holocauste ou un sacrifice —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie littéralement une expression masculine redoublée (« homme, homme »), tournure juridique signifiant « chaque homme » ou « tout homme » considéré individuellement.
    reason: lexical_alternative
  - marker: b
    text: Ou « étranger en séjour ». Le terme hébreu désigne ici un non-Israélite établi au milieu d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲלֵהֶם תֹּאמַר
  choice: Tu leur diras
  rationale: Le waw relie cette instruction à ce qui précède, tandis que l’imparfait a ici une valeur directive. En français, la continuité est suffisamment portée par le contexte et par la formulation législative au futur.
- source_word: אִישׁ אִישׁ
  choice: Tout homme
  rationale: 'Le redoublement du nom masculin est une tournure distributive du langage juridique hébreu : il vise chaque homme pris individuellement.'
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: de la maison d’Israël
  rationale: Cette formulation conserve l’expression collective et identitaire « maison d’Israël » ainsi que la valeur d’appartenance de la préposition.
- source_word: וּמִן הַגֵּר אֲשֶׁר יָגוּר בְּתוֹכָם
  choice: ou tout étranger résidant au milieu d’eux
  rationale: גֵּר désigne ici un non-Israélite établi dans la communauté. « Étranger résidant » exprime naturellement en français son statut et maintient le lien lexical entre le nom גֵּר et le verbe גּוּר.
- source_word: אֲשֶׁר יַעֲלֶה
  choice: qui offrira
  rationale: À la forme causative et avec des objets sacrificiels, עלה signifie faire monter une offrande, donc l’offrir. Le futur convient au cas juridique envisagé.
- source_word: עֹלָה
  choice: un holocauste
  rationale: « Holocauste » est le terme sacrificiel français établi pour l’offrande entièrement consumée sur l’autel.
- source_word: אוֹ זָבַח
  choice: ou un sacrifice
  rationale: Le terme désigne ici une offrande animale sacrifiée, distinguée de l’holocauste. « Sacrifice » reste précis et naturel dans ce contexte.
theological_decisions:
- issue: Expression distributive masculine אִישׁ אִישׁ
  choice: Tout homme
  alternative: Toute personne ; quiconque
  rationale: Le texte emploie explicitement un nom masculin singulier redoublé dans une formule juridique distributive. La traduction conserve cette forme sans en restreindre davantage la portée.
- issue: Statut du גֵּר
  choice: étranger résidant
  alternative: immigré ; étranger en séjour
  rationale: Le mot désigne un non-Israélite vivant durablement au sein d’Israël et soumis aux règles cultuelles concernées. « Étranger résidant » évite aussi bien l’idée d’un simple visiteur que des catégories administratives modernes trop précises.
translation_notes:
  register: Français international moderne, sobre et digne, avec un registre législatif clair. « Maison d’Israël » et « holocauste » conservent la terminologie biblique établie. Le tiret final maintient la phrase ouverte, puisque la conséquence juridique se poursuit au verset suivant.
