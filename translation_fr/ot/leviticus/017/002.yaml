source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/אֶל֙ כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵי/הֶ֑ם זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/002.yaml
  text: Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them, ‘This is the thing that Yahweh has commanded[b], saying,’
translation:
  language: fr
  text: 'Parle à Aaron, à ses fils et à tous les Israélites[a], et dis-leur : « Voici ce que Yahweh a ordonné[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « tous les fils d’Israël »; on traduit aussi traditionnellement « tous les enfants d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi désigner une « parole », une « chose » ou une « affaire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Parle
  rationale: L’impératif piel masculin singulier adresse à Moïse un ordre direct. « Parle » conserve cette force et la formule d’introduction du discours.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le nom masculin pluriel avec suffixe renvoie ici précisément aux fils d’Aaron, membres de la lignée sacerdotale, et non à ses enfants en général.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: tous les Israélites
  rationale: Dans cet emploi, l’expression familiale « fils d’Israël » fonctionne comme désignation collective du peuple. « Tous les Israélites » en restitue naturellement la portée sans suggérer que seuls les hommes sont concernés; la forme littérale est signalée en note.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: et dis-leur
  rationale: Cette tournure coordonne naturellement le second ordre au premier tout en conservant la progression du texte hébreu.
- source_word: זֶה הַדָּבָר
  choice: Voici ce que
  rationale: Dans cette formule introductive, דָּבָר peut désigner une parole, une chose ou une prescription. « Voici ce que » est idiomatique en français et laisse le contenu précis se déployer dans les versets suivants.
- source_word: צִוָּה
  choice: a ordonné
  rationale: Le parfait de צוה présente l’ordre divin comme donné. Le passé composé convient naturellement à l’introduction de son contenu encore normatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte source.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif introduit le contenu de l’ordre. En français actuel, les deux-points rendent plus naturellement cette fonction qu’un calque comme « en disant ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve sans lui substituer un titre.
- issue: Portée de בני ישראל
  choice: tous les Israélites
  alternative: tous les fils d’Israël
  rationale: L’expression est ici l’ethnonyme collectif d’Israël. Le rendu choisi évite une restriction masculine indue, tandis que la note conserve la forme familiale littérale.
- issue: Valeur de זה הדבר dans la formule divine
  choice: Voici ce que Yahweh a ordonné
  alternative: Voici la parole que Yahweh a ordonnée
  rationale: דבר garde une certaine latitude sémantique. Le français choisi introduit sobrement le contenu de l’ordre sans imposer exclusivement le sens de « parole », « chose » ou « prescription ».
translation_notes:
  register: Français international moderne, direct et digne. La répétition hébraïque « parle… et dis-leur » est conservée. Les deux-points rendent idiomatiquement לֵאמֹר et indiquent que le discours se poursuit au verset suivant; le guillemet ouvrant n’est donc pas refermé dans ce verset isolé.
