  text: וְ/כָל נֶ֗פֶשׁ אֲשֶׁ֨ר תֹּאכַ֤ל נְבֵלָה֙ וּ/טְרֵפָ֔ה בָּ/אֶזְרָ֖ח וּ/בַ/גֵּ֑ר וְ/כִבֶּ֨ס בְּגָדָ֜י/ו וְ/רָחַ֥ץ בַּ/מַּ֛יִם וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/015.yaml
  text: And every person who eats an animal found dead or one torn by beasts[a], whether native or sojourner, shall wash his clothes and bathe in water, and he shall be unclean until the evening[b]; then he shall be clean.
translation:
  language: fr
  text: Toute personne qui mange d’un animal trouvé mort ou déchiqueté par une bête sauvage[a], qu’elle soit Israélite de naissance ou étrangère résidente[b], devra laver ses vêtements et se laver dans l’eau ; elle sera impure jusqu’au soir, puis elle sera pure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’un cadavre d’animal ou d’un animal déchiré ». Le premier terme hébreu désigne la carcasse d’un animal mort autrement que par l’abattage requis.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « autochtone ou étrangère résidente ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: personne
  rationale: Dans ce contexte juridique, le mot désigne un individu, non l’âme comme composante immatérielle.
- source_word: נְבֵלָה
  choice: la chair d’un animal trouvé mort
  rationale: Le terme désigne la carcasse d’un animal mort sans abattage régulier; l’ajout de « la chair » rend naturellement en français l’objet du verbe « manger ».
- source_word: טְרֵפָה
  choice: déchiqueté par une bête sauvage
  rationale: Le mot évoque un animal mis en pièces par un prédateur; cette formulation conserve la cause implicite et reste claire.
- source_word: בָּאֶזְרָח
  choice: Israélite de naissance
  rationale: Le terme désigne ici le membre autochtone de la communauté d’Israël; cette formulation évite l’ambiguïté moderne de « citoyen ».
- source_word: בַגֵּר
  choice: étrangère résidente
  rationale: גֵּר désigne une personne étrangère établie au sein de la communauté, et non une simple voyageuse.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: lavera ses vêtements
  rationale: Formulation française naturelle qui exprime l’exigence rituelle.
- source_word: וְרָחַץ בַּמַּיִם
  choice: se lavera dans l’eau
  rationale: Le verbe renvoie au lavage du corps; la traduction reste proche de l’hébreu sans préciser un mode d’immersion non explicité.
- source_word: וְטָמֵא עַד הָעֶרֶב
  choice: elle sera impure jusqu’au soir
  rationale: « Impure » exprime le statut rituel temporaire sans suggérer la saleté physique ni confondre ce statut avec une faute morale.
- source_word: וְטָהֵר
  choice: puis elle sera pure
  rationale: « Puis » explicite sobrement la succession temporelle marquée par la dernière proposition.
theological_decisions:
- issue: Nature de l’impureté dans la législation lévitique
  choice: Employer « impure/pure » au sens rituel.
  alternative: « souillée/purifiée » ou « non pure/pure »
  rationale: Le passage décrit un statut cultuel temporaire après la consommation d’une carcasse; il ne faut pas transformer implicitement ce statut en condamnation morale.
- issue: Portée de la dernière proposition
  choice: Conserver l’affirmation « puis elle sera pure » sans ajouter de condition.
  alternative: « après quoi elle sera pure » ou une formulation faisant dépendre explicitement la purification du lavage et du soir
  rationale: L’hébreu présente une séquence de lavage, d’impureté jusqu’au soir, puis de pureté, sans développer davantage le rapport précis entre ces éléments.
translation_notes:
  register: Français international moderne, clair et digne. Le féminin grammatical des pronoms reprend « personne » et ne limite pas la règle aux femmes. La phrase est divisée en deux pour améliorer la lisibilité tout en conservant la succession juridique de l’hébreu.
