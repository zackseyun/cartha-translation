revisions:
- from: Toute personne qui mange la chair d’un animal trouvé mort ou déchiqueté par une bête sauvage[a], qu’elle soit Israélite de naissance ou étrangère résidente[b], lavera ses vêtements et se lavera dans l’eau. Elle sera impure jusqu’au soir, puis elle sera pure.
  to: Toute personne qui mange d’un animal trouvé mort ou déchiqueté par une bête sauvage[a], qu’elle soit Israélite de naissance ou étrangère résidente[b], devra laver ses vêtements et se laver dans l’eau ; elle sera impure jusqu’au soir, puis elle sera pure.
  rationale: La révision retire l’ajout non nécessaire de « la chair », conserve la distinction rituelle entre les deux catégories animales et améliore la note lexicale correspondante. Elle ne modifie ni la portée juridique ni la séquence rituelle du verset.
