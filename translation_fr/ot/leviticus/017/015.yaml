review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : la règle concerne toute personne, qu’elle soit native ou étrangère résidente, qui consomme une bête relevant des catégories נְבֵלָה et טְרֵפָה, avec lavage des vêtements et du corps, impureté jusqu’au soir, puis pureté. Toutefois, « la chair » n’est pas exprimé par l’hébreu et resserre inutilement l’objet sur la viande, alors que נְבֵלָה désigne l’animal mort/cadavre comme catégorie rituelle. « Trouvé mort » reste une manière française intelligible de rendre cette catégorie, précisée en note.'
  naturalness: La formulation est claire et de registre juridique moderne. « Toute personne » avec reprise au féminin est grammaticalement possible, mais le texte révisé maintient cette cohérence. « Se lavera dans l’eau » est naturel et n’impose pas un rite d’immersion absent du texte.
  terminology: « Impure » et « pure » conviennent pour le statut rituel. « Israélite de naissance » et « étrangère résidente » rendent de façon explicite le contraste entre l’autochtone israélite et le gēr établi parmi le peuple. La note a est reformulée afin de présenter une alternative française réelle et d’éviter l’explication imprécise « sans avoir été abattu », qui ne couvre pas nécessairement toutes les circonstances envisagées par נְבֵלָה.
  issues:
  - severity: low
    issue: Ajout de « la chair »
    rationale: Le texte hébreu dit littéralement qu’une personne « mange » une נְבֵלָה ou une טְרֵפָה. Même si l’ajout est idiomatique, « la chair » n’est pas nécessaire et réduit le référent de la catégorie rituelle ; « mange d’un animal » est plus proche sans être lourd.
  - severity: low
    issue: Note a peu naturelle et lexicalement trop étroite
    rationale: La formulation « de la carcasse d’un animal ou de celle d’un animal déchiqueté » est maladroite, et l’explication par l’absence d’abattage ne décrit pas exhaustivement le terme. Une note plus directe distingue le « cadavre/carcasse » de l’animal déchiré.
