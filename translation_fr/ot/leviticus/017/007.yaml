  verdict: revise
  source_fidelity: Le sens cultuel de שְׂעִירִם est correctement rendu par « démons-boucs », avec une note qui préserve les alternatives. Le futur prohibitif, la possession (« leurs sacrifices »), la métaphore sexuelle et la durée statutaire sont maintenus. « Derrière lesquels » est toutefois un calque peu naturel de אַחֲרֵי dans cette construction.
  naturalness: « Ils ne sacrifieront plus leurs sacrifices » et surtout « derrière lesquels ils se prostituent » sont lourds en français contemporain. « Ils n’offriront plus leurs sacrifices » est l’expression cultuelle française usuelle; « à la suite desquels ils se prostituent » rend l’image de poursuite avec une syntaxe idiomatique.
  terminology: « Démons-boucs » est un choix défendable et non confessionnel pour le référent vraisemblablement surnaturel. « Prescription permanente » convient au registre juridique; la note sur les équivalents de עוֹלָם est adéquate.
