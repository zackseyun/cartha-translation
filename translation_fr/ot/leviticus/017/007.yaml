  text: וְ/לֹא יִזְבְּח֥וּ עוֹד֙ אֶת זִבְחֵי/הֶ֔ם לַ/שְּׂעִירִ֕ם אֲשֶׁ֛ר הֵ֥ם זֹנִ֖ים אַחֲרֵי/הֶ֑ם חֻקַּ֥ת עוֹלָ֛ם תִּֽהְיֶה זֹּ֥את לָ/הֶ֖ם לְ/דֹרֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/007.yaml
  text: They shall no longer sacrifice their sacrifices to the goat-demons, after which they prostitute themselves. This shall be a permanent statute for them throughout their generations.
translation:
  language: fr
  text: Ils n’offriront plus leurs sacrifices aux démons-boucs[a], à la suite desquels ils se prostituent[b]. Ce sera pour eux une prescription permanente[c], de génération en génération.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux idoles en forme de boucs » ou « aux satyres » ; le terme hébreu désigne des êtres associés aux boucs dans un contexte de culte illicite.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à la suite desquels ils se prostituent » ; il s’agit d’une métaphore de l’infidélité religieuse ou de l’idolâtrie.'
    reason: cultural_note
  - marker: c
    text: Ou « une prescription perpétuelle » ou « une prescription pour toujours ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְבְּחוּ ... זִבְחֵיהֶם
  choice: sacrifieront ... leurs sacrifices
  rationale: La tournure juridique négative est rendue par le futur normatif, et la répétition étymologique de la racine זבח est conservée en français.
- source_word: עוֹד
  choice: ne ... plus
  rationale: 'Avec la négation, le terme interdit la continuation ou la reprise d''une pratique : « ne ... plus » est naturel et précis.'
- source_word: לַשְּׂעִירִם
  choice: aux démons-boucs
  rationale: Dans ce contexte cultuel, שׂעירים désigne vraisemblablement des êtres associés à la forme du bouc, et non de simples animaux. Cette formulation évite la coloration gréco-romaine de « satyres ».
- source_word: זֹנִים אַחֲרֵיהֶם
  choice: derrière lesquels ils se prostituent
  rationale: La traduction maintient à la fois l'expression hébraïque de poursuite (« derrière ») et la métaphore sexuelle forte de l'infidélité religieuse.
- source_word: חֻקַּת עוֹלָם
  choice: une prescription permanente
  rationale: « Prescription » convient au registre juridique de חֻקָּה, tandis que « permanente » exprime la durée durable de עוֹלָם sans imposer une précision métaphysique étrangère à la formule.
- source_word: לְדֹרֹתָם
  choice: de génération en génération
  rationale: Cette expression française naturelle communique l'application continue aux générations successives.
theological_decisions:
- issue: Référent de שְּׂעִירִם dans le culte illicite
  choice: des êtres démoniaques figurés comme des boucs (« démons-boucs »)
  alternative: boucs, idoles en forme de boucs, satyres
  rationale: Le contexte de sacrifices illicites et la métaphore d'infidélité cultuelle favorisent un référent surnaturel ou idolâtre. La note conserve les principales possibilités lexicales.
- issue: Force de la métaphore זֹנִים אַחֲרֵיהֶם
  choice: conserver explicitement « ils se prostituent »
  alternative: ils sont infidèles; ils se livrent à l'idolâtrie
  rationale: L'hébreu emploie une image sexuelle délibérément forte pour l'infidélité religieuse; l'expliciter abstraitement affaiblirait le texte.
- issue: Portée temporelle de חֻקַּת עוֹלָם
  choice: prescription permanente
  alternative: prescription perpétuelle; prescription éternelle
  rationale: La formulation rend le caractère durable de l'ordonnance tout en préservant la portée idiomatique possible de עוֹלָם dans un cadre légal et générationnel.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur a une valeur normative. La répétition « sacrifieront leurs sacrifices » et la métaphore crue de la prostitution sont volontairement conservées afin de refléter la forme et la force de l'hébreu.
