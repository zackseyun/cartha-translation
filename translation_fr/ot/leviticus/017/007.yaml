    issue: Calque syntaxique « derrière lesquels ils se prostituent »
    rationale: Bien que « derrière » puisse reproduire formellement אַחֲרֵי, la tournure est peu idiomatique ici et risque d’être comprise spatialement. « À la suite desquels » conserve l’idée de poursuivre un objet de culte tout en étant naturel.
  - severity: low
    issue: Collocation « sacrifier leurs sacrifices »
    rationale: La répétition reproduit la racine hébraïque, mais elle est inutilement pesante en français. « Offrir leurs sacrifices » rend précisément l’acte cultuel et conserve le nom ainsi que le possessif.
  - severity: low
    issue: 'Note a : « êtres à l’apparence de boucs » paraît plus précise que le lexème'
    rationale: Le terme peut désigner des êtres caprins ou velus et son référent exact est discuté. « Êtres associés aux boucs » préserve mieux cette incertitude.
