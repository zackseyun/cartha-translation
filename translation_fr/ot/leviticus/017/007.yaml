revisions:
- from: Ils ne sacrifieront plus leurs sacrifices aux démons-boucs[a], derrière lesquels ils se prostituent[b]. Ce sera pour eux une prescription permanente[c], de génération en génération.
  to: Ils n’offriront plus leurs sacrifices aux démons-boucs[a], à la suite desquels ils se prostituent[b]. Ce sera pour eux une prescription permanente[c], de génération en génération.
  rationale: 'La révision améliore la fluidité du français sans modifier le sens : « offrir des sacrifices » est la collocation cultuelle normale, et « à la suite desquels » restitue la relation exprimée par אַחֲרֵי sans le calque maladroit « derrière lesquels ». Les notes continuent de signaler les options lexicales et l’emploi métaphorique, tout en formulant avec davantage de prudence l’incertitude sur שְׂעִירִם.'
