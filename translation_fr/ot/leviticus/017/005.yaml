  to: afin que les fils d’Israël amènent leurs sacrifices, qu’ils offrent en pleine campagne, et les apportent à Yahweh, à l’entrée de la tente de la Rencontre, au prêtre, pour les offrir comme sacrifices de paix[a] à Yahweh.
  rationale: La révision resserre la syntaxe française, rend explicitement la direction vers le prêtre et améliore la formulation de la catégorie sacrificielle, sans ajouter d’interprétation ni altérer la séquence du texte hébreu.
