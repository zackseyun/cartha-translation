id: LEV.17.5
reference: Leviticus 17:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְמַעַן֩ אֲשֶׁ֨ר יָבִ֜יאוּ בְּנֵ֣י יִשְׂרָאֵ֗ל אֶֽת זִבְחֵי/הֶם֮ אֲשֶׁ֣ר הֵ֣ם זֹבְחִים֮ עַל פְּנֵ֣י הַ/שָּׂדֶה֒ וֶֽ/הֱבִיאֻ֣/ם לַֽ/יהוָ֗ה אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵ֑ן וְ/זָ֨בְח֜וּ זִבְחֵ֧י שְׁלָמִ֛ים לַֽ/יהוָ֖ה אוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/005.yaml
  text: so that the sons of Israel may bring their sacrifices that they are sacrificing in the open field[a], and bring them to Yahweh at the entrance of the tent of meeting, to the priest[b], and sacrifice them as peace offerings to Yahweh.
translation:
  language: fr
  text: afin que les fils d’Israël amènent leurs sacrifices, qu’ils offrent en pleine campagne, et les apportent à Yahweh, à l’entrée de la tente de la Rencontre, au prêtre, pour les offrir comme sacrifices de paix[a] à Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifices de communion » ou « sacrifices de bien-être ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  choice: afin que
  rationale: Rend naturellement en français la valeur finale de la locution hébraïque et rattache le verset à l’instruction précédente.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Conserve l’expression familiale et le masculin grammatical de l’hébreu, tout en restant intelligible en français biblique moderne.
- source_word: זִבְחֵיהֶם אֲשֶׁר הֵם זֹבְחִים
  choice: les sacrifices qu’ils offrent
  rationale: Évite en français la répétition lourde « les sacrifices qu’ils sacrifient » tout en maintenant le sens cultuel de זבח.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: en pleine campagne
  rationale: Rend idiomatiquement l’idée d’un lieu ouvert, hors du sanctuaire, plutôt qu’une traduction littérale obscure de « sur la face du champ ».
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Transcrit le nom divin יהוה au lieu de le remplacer par un titre.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: l’entrée de la tente de la rencontre
  rationale: Rend le lieu cultuel de façon claire; « rencontre » exprime la fonction de מוֹעֵד dans cette désignation.
- source_word: אֶל הַכֹּהֵן
  choice: auprès du prêtre
  rationale: Préserve l’article défini hébreu et indique que les sacrifices sont conduits au prêtre officiant.
- source_word: זִבְחֵי שְׁלָמִים
  choice: sacrifices de paix
  rationale: Conserve le lien lexical avec la paix, l’intégrité et le bien-être, ainsi que la désignation traditionnelle de cette catégorie sacrificielle.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre de l’alliance plutôt que de lui substituer un titre.
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le choix garde l’image familiale et le marquage masculin du texte hébreu sans décider que l’expression vise exclusivement les hommes.
- issue: Sens de זִבְחֵי שְׁלָמִים
  choice: sacrifices de paix
  alternative: sacrifices de communion / sacrifices de bien-être
  rationale: L’expression désigne une catégorie cultuelle dont la portée inclut paix, intégrité, bien-être et communion; le texte principal retient une formulation traditionnelle et une note préserve les autres nuances possibles.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe finale est légèrement restructurée pour éviter une coordination ambiguë et rendre clair que les mêmes sacrifices sont amenés au sanctuaire puis offerts comme sacrifices de paix.
