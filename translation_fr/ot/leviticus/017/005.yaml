    issue: « auprès du prêtre »
    rationale: 'La préposition אֶל marque ici la destination : les sacrifices sont apportés au prêtre officiant. « Au prêtre » est plus direct et plus fidèle que « auprès du prêtre », qui indique surtout la proximité.'
  - severity: low
    issue: Double emploi peu naturel de « apportent » puis « amènent »
    rationale: La répétition des verbes de mouvement hébreux peut être maintenue sans lourdeur en français par « amènent leurs sacrifices ... et les apportent à Yahweh ».
  - severity: low
    issue: « en sacrifices de paix »
    rationale: « Comme sacrifices de paix » exprime plus naturellement en français la classification cultuelle portée par זִבְחֵי שְׁלָמִים.
