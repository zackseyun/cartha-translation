source:
  edition: WLC
  text: אִ֥ישׁ אִישׁ֙ מִ/בֵּ֣ית יִשְׂרָאֵ֔ל אֲשֶׁ֨ר יִשְׁחַ֜ט שׁ֥וֹר אוֹ כֶ֛שֶׂב אוֹ עֵ֖ז בַּֽ/מַּחֲנֶ֑ה א֚וֹ אֲשֶׁ֣ר יִשְׁחַ֔ט מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/003.yaml
  text: Any man from the house of Israel who slaughters an ox or a sheep or a goat in the camp[a], or who slaughters it outside the camp—
translation:
  language: fr
  text: Tout homme[a] de la maison d’Israël qui égorge un bovin, un mouton ou une chèvre dans le camp, ou qui l’égorge en dehors du camp —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « homme, homme » ; cette expression distributive signifie ici « tout homme » et vise de manière générique tout membre concerné de la société israélite.
    reason: Préciser la forme idiomatique de l’hébreu et la portée générique du masculin.
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: Tout homme
  rationale: Le redoublement forme une expression distributive signifiant « tout homme » ou « chacun ». La formulation conserve la forme masculine de l’hébreu tout en signalant en note sa portée générique dans cette règle.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: de la maison d’Israël
  rationale: Cette traduction conserve l’expression collective et nationale de l’hébreu, sans la réduire au simple terme « Israélite ».
- source_word: יִשְׁחַט
  choice: égorge
  rationale: Le verbe désigne l’abattage d’un animal, notamment dans un cadre sacrificiel. « Égorge » exprime précisément cet acte en français biblique actuel sans employer le terme plus général « tue ».
- source_word: שׁוֹר
  choice: un bovin
  rationale: Le nom désigne ici une bête de gros bétail sans imposer le sexe ni la castration que pourrait suggérer « bœuf » dans son sens technique moderne.
- source_word: כֶשֶׂב
  choice: un mouton
  rationale: Le terme désigne une bête ovine et ne suppose pas nécessairement un jeune animal ; « mouton » préserve cette portée générique.
- source_word: עֵז
  choice: une chèvre
  rationale: Rendu courant du terme désignant un caprin dans les listes sacrificielles.
- source_word: בַּמַּחֲנֶה
  choice: dans le camp
  rationale: Expression locative directe, naturelle et précise en français.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: en dehors du camp
  rationale: Rend clairement le lieu de l’abattage situé à l’extérieur du camp.
- source_word: אֲשֶׁר ... אֲשֶׁר
  choice: qui… ou qui
  rationale: La répétition du relatif maintient le parallélisme juridique des deux possibilités énoncées.
- source_word: '[objet implicite après le second יִשְׁחַט]'
  choice: l’égorge
  rationale: Le pronom reprend naturellement en français l’un des animaux déjà énumérés et explicite l’objet sous-entendu en hébreu sans ajouter de contenu.
theological_decisions: []
