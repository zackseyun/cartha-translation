revisions:
- from: Tout homme parmi les fils d’Israël, ou parmi les étrangers qui résident au milieu d’eux[a], qui prend à la chasse un animal sauvage ou un oiseau qu’il est permis de manger, en répandra le sang et le couvrira de terre[b].
  to: Tout homme d’entre les fils d’Israël, ou tout étranger qui réside au milieu d’eux[a], qui chasse du gibier — animal sauvage ou oiseau — qu’il est permis de manger, en répandra le sang et le couvrira de terre[b].
  rationale: La révision améliore l’idiomaticité de la formulation sur la chasse, rend le singulier du terme hébreu pour l’étranger et clarifie avec précision la portée de l’ambiguïté signalée en note. Le sens juridique et rituel du verset est inchangé.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:25:00Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens prescriptif, les catégories de gibier et l’instruction concernant le sang sont correctement rendus. Le suffixe final hébreu se rapporte le plus naturellement au sang, tout en laissant une ambiguïté grammaticale qui doit être décrite comme telle dans la note, non comme une ambiguïté du français traduit.
  naturalness: Le texte est globalement fluide. « Chasse du gibier » est plus idiomatique et plus directement équivalent à la construction hébraïque que « prend à la chasse ». La formulation au singulier « l’étranger qui réside » reflète mieux le singulier hébreu et demeure naturelle en français juridique.
  terminology: « Fils d’Israël », « étranger résidant » et « terre » sont appropriés. « Étranger résidant » conserve la catégorie sociale et juridique de גר sans recourir à une terminologie administrative moderne.
  issues:
  - severity: low
    issue: La note b présente « poussière ou terre » comme une traduction littérale et formule l’ambiguïté sans préciser qu’elle appartient à l’hébreu.
    rationale: עָפָר recouvre le champ de la poussière/terre meuble, mais le texte ne comporte pas « ou ». En français, « le couvrira » renvoie nécessairement au sang; seule la construction hébraïque permet éventuellement de rattacher le suffixe au gibier.
  - severity: low
    issue: « prend à la chasse » est moins naturel que « chasse du gibier ».
    rationale: La construction יָצוּד צֵיד est une expression verbale-nominale de chasse; « chasser du gibier » la rend avec une formulation française courante.
  revised_text: Tout homme d’entre les fils d’Israël, ou tout étranger qui réside au milieu d’eux[a], qui chasse du gibier — animal sauvage ou oiseau — qu’il est permis de manger, en répandra le sang et le couvrira de terre[b].
