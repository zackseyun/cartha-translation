  text: וְ/אִ֨ישׁ אִ֜ישׁ מִ/בְּנֵ֣י יִשְׂרָאֵ֗ל וּ/מִן הַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם אֲשֶׁ֨ר יָצ֜וּד צֵ֥יד חַיָּ֛ה אוֹ ע֖וֹף אֲשֶׁ֣ר יֵאָכֵ֑ל וְ/שָׁפַךְ֙ אֶת דָּמ֔/וֹ וְ/כִסָּ֖/הוּ בֶּ/עָפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/013.yaml
  text: And any man from the sons of Israel[a], or from the sojourner who sojourns among them, who hunts game—whether wild animal or bird—that may be eaten[b], shall pour out its blood and cover it with earth.
translation:
  language: fr
  text: Tout homme d’entre les fils d’Israël, ou tout étranger qui réside au milieu d’eux[a], qui chasse du gibier — animal sauvage ou oiseau — qu’il est permis de manger, en répandra le sang et le couvrira de terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque désigne un non-Israélite établi au sein de la communauté.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne la poussière ou la terre meuble. Le pronom renvoie très probablement au sang ; dans l’hébreu, il peut aussi être compris comme renvoyant au gibier.
    reason: textual_ambiguity
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: Tout homme
  rationale: Le redoublement exprime une valeur distributive. « Tout homme » la rend naturellement tout en conservant la formulation masculine du texte hébreu.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: parmi les fils d’Israël
  rationale: Cette formulation conserve l’image familiale et l’expression d’alliance בני ישראל, sans la réduire au simple ethnonyme « Israélites ».
- source_word: הַגֵּר הַגָּר בְּתוֹכָם
  choice: les étrangers qui résident au milieu d’eux
  rationale: גר désigne ici des non-Israélites établis au sein de la communauté. La répétition française « étrangers qui résident » reflète de façon lisible le nom et le verbe apparentés en hébreu.
- source_word: יָצוּד צֵיד
  choice: prend à la chasse
  rationale: La construction associant le verbe « chasser » et le nom « gibier » décrit une prise de chasse. « Prend à la chasse » est idiomatique et permet d’introduire directement les deux catégories de gibier.
- source_word: חַיָּה אוֹ עוֹף
  choice: un animal sauvage ou un oiseau
  rationale: Dans ce contexte de chasse, חיה désigne un animal sauvage plutôt qu’un animal au sens général; עוף est naturellement rendu par « oiseau ».
- source_word: אֲשֶׁר יֵאָכֵל
  choice: qu’il est permis de manger
  rationale: 'Le niphal a ici une valeur passive et permissive: il s’agit d’espèces admises comme nourriture, et non simplement d’animaux physiquement comestibles.'
- source_word: וְשָׁפַךְ אֶת־דָּמוֹ
  choice: en répandra le sang
  rationale: Dans cette prescription juridique, la forme verbale exprime une obligation. Le pronom « en » rattache clairement le sang à l’animal ou à l’oiseau capturé.
- source_word: וְכִסָּהוּ בֶּעָפָר
  choice: le couvrira de terre
  rationale: Le suffixe renvoie le plus naturellement au sang qui vient d’être mentionné. עפר désigne ici la terre meuble ou la poussière; « terre » convient naturellement au geste prescrit.
theological_decisions:
- issue: Référent du suffixe dans וְכִסָּהוּ
  choice: Le sang doit être couvert de terre.
  alternative: L’animal capturé doit être couvert ou enterré.
  rationale: Le sang est l’antécédent immédiat et le référent le plus naturel. La note signale néanmoins l’autre rattachement grammatical possible au lieu de masquer entièrement l’ambiguïté du suffixe.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe juridique reste ferme sans archaïsme; les termes concrets de la chasse et du traitement du sang sont conservés.
