  naturalness: Le français est clair et de registre juridique-biblique approprié. « De tout ce qui lui appartient » est plus idiomatique dans cette construction. « Très sainte » restitue naturellement le superlatif hébreu.
  terminology: « Chose vouée » et « voue » conservent utilement le lien lexical de חרם/החרים, tandis que la note préserve la nuance d’interdit et de destruction possible sans l’imposer. Pour représenter explicitement le tétragramme dans un français biblique international, « le SEIGNEUR » est préférable à « l’Éternel », qui constitue une interprétation traditionnelle plutôt qu’une représentation du nom divin.
