id: LEV.27.28
reference: Leviticus 27:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַךְ כָּל חֵ֡רֶם אֲשֶׁ֣ר יַחֲרִם֩ אִ֨ישׁ לַֽ/יהוָ֜ה מִ/כָּל אֲשֶׁר ל֗/וֹ מֵ/אָדָ֤ם וּ/בְהֵמָה֙ וּ/מִ/שְּׂדֵ֣ה אֲחֻזָּת֔/וֹ לֹ֥א יִמָּכֵ֖ר וְ/לֹ֣א יִגָּאֵ֑ל כָּל חֵ֕רֶם קֹֽדֶשׁ קָֽדָשִׁ֥ים ה֖וּא לַ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/028.yaml
  text: However[a], every devoted thing that a man devotes to Yahweh from all that belongs to him—whether human or animal, or from the field of his inherited property—shall not be sold or redeemed. Every devoted thing is most holy to Yahweh.
translation:
  language: fr
  text: Toutefois, toute chose vouée[a] qu’un homme voue au SEIGNEUR, de tout ce qui lui appartient — qu’il s’agisse d’un être humain, d’un animal ou d’un champ de sa propriété héréditaire — ne doit être ni vendue ni rachetée. Toute chose vouée est très sainte pour le SEIGNEUR.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici ḥèrem, terme technique désignant ce qui est irrévocablement mis à part pour le SEIGNEUR. Selon le contexte, il peut aussi évoquer une mise sous interdit ou une consécration entraînant la destruction.
    reason: Signaler l’étendue sémantique d’un terme juridique et théologique que « vouée » ne restitue pas entièrement.
lexical_decisions:
- source_word: אַךְ
  choice: Toutefois
  rationale: Marque la restriction ou le contraste avec les dispositions précédentes concernant les biens voués qui pouvaient être rachetés.
- source_word: חֵרֶם / יַחֲרִם
  choice: chose vouée / voue
  rationale: Conserve le lien entre le nom et le verbe hébreux et exprime la mise à part irrévocable pour l’Éternel, sans imposer dans le texte principal l’idée de destruction, qui n’est pas explicitée ici.
- source_word: אִישׁ
  choice: un homme
  rationale: Respecte le masculin singulier du style juridique hébreu, employé avec une portée représentative.
- source_word: לַיהוָה
  choice: à l’Éternel / pour l’Éternel
  rationale: Rend le nom divin YHWH selon une forme française courante et distingue naturellement la destination de l’acte de consécration de la relation exprimée dans la dernière proposition.
- source_word: מִכָּל אֲשֶׁר לוֹ
  choice: parmi tout ce qui lui appartient
  rationale: Exprime clairement que la chose vouée provient de l’ensemble des biens appartenant à l’homme.
- source_word: מֵאָדָם וּבְהֵמָה
  choice: un être humain, un animal
  rationale: Préserve l’opposition catégorielle entre l’humain et l’animal sans réduire אָדָם à un individu masculin.
- source_word: וּמִשְּׂדֵה אֲחֻזָּתוֹ
  choice: ou un champ de sa propriété héréditaire
  rationale: Rend la nuance juridique d’un fonds reçu en patrimoine familial, caractéristique de אֲחֻזָּה dans le Lévitique.
- source_word: לֹא יִמָּכֵר וְלֹא יִגָּאֵל
  choice: ne doit être ni vendue ni rachetée
  rationale: Formule clairement la double interdiction juridique tout en conservant le vocabulaire technique du rachat employé dans le chapitre.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: très sainte
  rationale: Rend naturellement en français le superlatif hébreu désignant le plus haut degré de sainteté.
theological_decisions:
- issue: Sens de חֵרֶם dans ce contexte juridique
  choice: « chose vouée » dans le texte principal
  alternative: « chose vouée à la destruction » ou « chose frappée d’interdit »
  rationale: Le groupe lexical חרם peut désigner une mise à part sous interdit allant parfois jusqu’à la destruction. Ici, le verset souligne surtout le caractère irrévocable de la consécration, l’interdiction de vendre ou de racheter et la très grande sainteté de la chose. La note maintient donc ouverte la portée plus sévère du terme.
- issue: Masculin générique du langage juridique
  choice: « un homme » pour אִישׁ
  alternative: « quelqu’un » ou « une personne »
  rationale: Le texte source emploie explicitement un masculin singulier dans une formulation juridique représentative; la traduction le conserve.
- issue: Statut des êtres humains mentionnés parmi ce qui appartient à l’homme
  choice: traduction littérale de la catégorie « un être humain » sans explication ajoutée
  alternative: préciser « esclave » ou déterminer le sort de la personne vouée
  rationale: Le verset ne précise ni l’identité juridique exacte de l’être humain concerné ni les modalités de cette consécration. La traduction préserve cette tension sans importer une solution interprétative.
translation_notes:
  register: Français international actuel, clair et digne. La répétition « chose vouée… voue » reflète volontairement le nom et le verbe apparentés en hébreu. Les tirets structurent l’énumération sans alourdir la phrase juridique.
