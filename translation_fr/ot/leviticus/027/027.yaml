base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/027.yaml
  text: But if it is among the unclean animals[a], then he shall redeem it at your valuation and add a fifth of it to it; and if it is not redeemed[b], then it shall be sold at your valuation.
translation:
  language: fr
  text: Mais s’il s’agit d’un animal impur[a], il pourra le racheter pour la valeur que tu auras fixée, en y ajoutant un cinquième. S’il n’est pas racheté, il sera vendu pour la valeur que tu auras fixée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit d’un animal rituellement impur, c’est-à-dire impropre à être offert en sacrifice.
    reason: Clarification du sens cultuel de l’adjectif hébreu.
lexical_decisions:
- source_word: בַּבְּהֵמָה הַטְּמֵאָה
  choice: s’il s’agit d’un animal impur
  rationale: La construction classe l’animal consacré parmi les animaux rituellement impurs. Cette formulation française exprime naturellement cette appartenance à une catégorie sans suggérer une impureté physique.
- source_word: וּפָדָה
  choice: son propriétaire pourra le racheter
  rationale: פדה désigne ici le rachat d’un bien consacré. La possibilité de ne pas le racheter, explicitement envisagée ensuite, favorise « pourra » plutôt qu’un ordre absolu. Le propriétaire est explicité d’après la situation juridique du passage.
- source_word: בְעֶרְכֶּךָ
  choice: au prix que tu auras fixé
  rationale: עֵרֶךְ désigne l’estimation officielle établie par le prêtre. Cette tournure garde l’adresse à la deuxième personne du singulier et sonne plus naturellement que « selon ton estimation ».
- source_word: וְיָסַף חֲמִשִׁתוֹ עָלָיו
  choice: en y ajoutant un cinquième
  rationale: L’expression hébraïque prescrit d’ajouter un cinquième à la valeur fixée, soit vingt pour cent de celle-ci. La formulation française est concise et fidèle à l’opération décrite.
- source_word: וְאִם לֹא יִגָּאֵל
  choice: s’il n’est pas racheté
  rationale: Le nifal laisse l’agent inexprimé; le passif français préserve cette indétermination.
- source_word: וְנִמְכַּר
  choice: il sera vendu
  rationale: Le nifal a ici la valeur d’un passif juridique exprimant la procédure applicable.
theological_decisions:
- issue: Sens de « impur »
  choice: Comprendre l’adjectif au sens d’impureté rituelle.
  alternative: Le comprendre comme une souillure physique ou morale.
  rationale: Dans le cadre lévitique, la catégorie détermine l’aptitude sacrificielle de l’animal; elle ne porte pas ici un jugement moral sur celui-ci.
- issue: Caractère obligatoire ou facultatif du rachat
  choice: Présenter le rachat comme une possibilité.
  alternative: « Il devra le racheter », comme prescription absolue.
  rationale: La proposition suivante prévoit expressément que l’animal puisse ne pas être racheté et soit alors vendu. « Pourra » rend cette articulation juridique sans supprimer la force de la procédure prescrite en cas de rachat.
translation_notes:
  register: Français international moderne, clair et digne. « Racheter » maintient le vocabulaire juridique du passage; « au prix que tu auras fixé » rend l’estimation sacerdotale tout en conservant l’adresse au singulier.
