source:
  edition: WLC
  text: וְ/חִשַּׁב ל֣/וֹ הַ/כֹּהֵ֗ן אֵ֚ת מִכְסַ֣ת הָֽ/עֶרְכְּ/ךָ֔ עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/נָתַ֤ן אֶת הָ/עֶרְכְּ/ךָ֙ בַּ/יּ֣וֹם הַ/ה֔וּא קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/023.yaml
  text: then the priest shall calculate for him the proportion of your valuation up to the Year of Jubilee[a], and on that day he shall give your valuation as a holy offering to Yahweh.
translation:
  language: fr
  text: Alors le prêtre calculera pour lui la part de ton estimation, jusqu’à l’année du Jubilé. Ce jour-là, l’homme donnera ce montant comme offrande sainte à Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « une chose sainte pour Yahweh ».'
    reason: Le texte hébreu emploie la formule concise קֹדֶשׁ לַיהוָה; la note en préserve le rendu formel sans l’explicitation cultuelle « offrande ».
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: Alors … calculera
  rationale: Le piel de חשׁב exprime ici le calcul d’un montant. « Alors » marque naturellement la suite de la prescription précédente.
- source_word: לּוֹ
  choice: pour lui
  rationale: Le pronom au datif indique que le prêtre effectue le calcul pour l’homme concerné.
- source_word: מִכְסַת
  choice: la part
  rationale: מִכְסָה désigne ici la fraction proportionnelle de la valeur totale, déterminée selon le temps restant jusqu’au Jubilé.
- source_word: הָעֶרְכְּךָ
  choice: la valeur que tu as fixée / le montant de cette valeur
  rationale: עֵרֶךְ est le terme technique du chapitre pour une valeur fixée. La première formulation conserve le suffixe de deuxième personne; la reprise naturelle « cette valeur » évite une lourdeur en français.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: jusqu’à l’année du Jubilé
  rationale: La formule indique le terme servant au calcul proportionnel. La majuscule signale l’institution du Jubilé.
- source_word: וְנָתַן
  choice: l’homme donnera
  rationale: נתן signifie largement « donner ». Le sujet est implicite en hébreu; le contexte désigne l’homme pour qui le prêtre vient de calculer le montant.
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Rendu direct et idiomatique de l’expression temporelle.
- source_word: קֹדֶשׁ לַיהוָה
  choice: comme offrande sainte à Yahweh
  rationale: La formule qualifie le montant donné de consacré à Yahweh. « Offrande » explicite sobrement sa fonction cultuelle; le rendu plus formel figure en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Sujet implicite de וְנָתַן
  choice: L’homme concerné donne le montant.
  alternative: Le prêtre donne le montant.
  rationale: Le prêtre est chargé du calcul, tandis que le contexte de Lévitique 27 présente l’auteur de la consécration comme celui qui verse la valeur. Nommer « l’homme » évite qu’en français le pronom « il » soit attribué par erreur au prêtre.
- issue: Sens cultuel de קֹדֶשׁ לַיהוָה
  choice: « comme offrande sainte à Yahweh »
  alternative: « chose sainte pour Yahweh »
  rationale: Le texte affirme la consécration du montant à Yahweh sans préciser davantage le type de rite. « Offrande » rend cette fonction dans un français naturel, tandis que la note conserve la forme plus littérale.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire technique du chapitre est conservé sans lourdeur; « Jubilé » et « Yahweh » maintiennent les désignations institutionnelle et personnelle du texte source.
