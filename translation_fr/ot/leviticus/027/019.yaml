revisions:
- from: Mais si celui qui a consacré le champ[a] le rachète effectivement, il ajoutera un cinquième au montant de ton estimation[b], et le champ lui sera acquis[c].
  to: Mais si celui qui a consacré le champ[a] le rachète effectivement, il ajoutera au montant de ton estimation un cinquième de ce montant[b], et le champ lui appartiendra[c].
  rationale: La révision remplace une formulation qui suggérait une acquisition par une expression française qui marque l’appartenance juridiquement confirmée. Elle rend aussi explicite que le cinquième est calculé sur le montant de l’estimation. Les ancres de notes et leur ordre sont conservés.
