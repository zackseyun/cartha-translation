source:
  edition: WLC
  text: וְ/אִם גָּאֹ֤ל יִגְאַל֙ אֶת הַ/שָּׂדֶ֔ה הַ/מַּקְדִּ֖ישׁ אֹת֑/וֹ וְ֠/יָסַף חֲמִשִׁ֧ית כֶּֽסֶף עֶרְכְּ/ךָ֛ עָלָ֖י/ו וְ/קָ֥ם לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/019.yaml
  text: But if the one who consecrated it indeed redeems the field[a], then he shall add a fifth of your valuation money to it[c][b], and it shall remain his.
translation:
  language: fr
  text: Mais si celui qui a consacré le champ[a] le rachète effectivement, il ajoutera au montant de ton estimation un cinquième de ce montant[b], et le champ lui appartiendra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « voué » ou « sanctifié ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un cinquième de l’argent de ton estimation ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « il se tiendra pour lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit une condition qui contraste avec le cas précédent tout en poursuivant la même législation.
- source_word: גָּאֹל יִגְאַל
  choice: le rachète effectivement
  rationale: L’infinitif absolu suivi de l’imparfait renforce l’idée verbale. « Effectivement » conserve cette insistance sans transformer la proposition en expression d’un simple souhait.
- source_word: הַשָּׂדֶה
  choice: le champ
  rationale: Désigne précisément le champ consacré dont traite le contexte, plutôt qu’une terre au sens large.
- source_word: הַמַּקְדִּישׁ אֹתוֹ
  choice: celui qui a consacré le champ
  rationale: Le participe désigne la personne qui a mis le champ à part dans un cadre cultuel. La répétition de « le champ » évite en français une succession ambiguë de pronoms.
- source_word: וְיָסַף
  choice: il ajoutera
  rationale: Dans cette formulation juridique, la forme exprime la prescription qui s’applique lorsque la condition est remplie.
- source_word: חֲמִשִׁית
  choice: un cinquième
  rationale: Expression juridique précise et naturelle en français.
- source_word: כֶּסֶף עֶרְכְּךָ
  choice: au montant de ton estimation
  rationale: Rend le sens monétaire de « l’argent de ton estimation » en conservant la deuxième personne du singulier adressée à l’autorité chargée de l’évaluation.
- source_word: עָלָיו
  choice: au montant
  rationale: Le cinquième vient s’ajouter à la somme estimée; la construction française explicite naturellement ce rapport.
- source_word: וְקָם לוֹ
  choice: le champ lui sera acquis
  rationale: Dans ce contexte juridique, l’expression indique que le champ est confirmé comme appartenant à celui qui le rachète, tout en gardant la nuance de résultat établi.
theological_decisions:
- issue: Valeur cultuelle du verbe הקדישׁ
  choice: consacré
  alternative: voué ; sanctifié
  rationale: « Consacré » exprime qu’un bien est mis à part dans un cadre sacré, sans réduire l’acte à un don profane ni imposer une terminologie confessionnelle particulière.
- issue: Force juridique de la suite verbale
  choice: futur à valeur prescriptive et résultative (« ajoutera », « sera acquis »)
  alternative: futur purement prédictif ; récit au passé
  rationale: Le chapitre présente des dispositions légales. Le français emploie naturellement le futur pour énoncer ce qui doit se faire et le résultat juridique qui en découle.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste juridique sans archaïsmes; « effectivement » préserve l’insistance de la construction hébraïque, et « lui sera acquis » rend son résultat légal sans effacer l’image littérale signalée en note.
