id: LEV.27.3
reference: Leviticus 27:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֤ה עֶרְכְּ/ךָ֙ הַ/זָּכָ֔ר מִ/בֶּן֙ עֶשְׂרִ֣ים שָׁנָ֔ה וְ/עַ֖ד בֶּן שִׁשִּׁ֣ים שָׁנָ֑ה וְ/הָיָ֣ה עֶרְכְּ/ךָ֗ חֲמִשִּׁ֛ים שֶׁ֥קֶל כֶּ֖סֶף בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/003.yaml
  text: And your valuation for the male from twenty years old up to sixty years old shall be fifty shekels of silver[a], according to the sanctuary shekel.
translation:
  language: fr
  text: L’estimation que tu fixeras pour un homme âgé de vingt à soixante ans sera de cinquante sicles d’argent, selon le sicle du sanctuaire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: l’estimation que tu fixeras
  rationale: עֵרֶךְ désigne ici le montant fixé dans le cadre légal et cultuel des vœux, non la valeur intrinsèque de la personne. Cette formulation rend aussi explicitement le suffixe de deuxième personne.
- source_word: הַזָּכָר
  choice: un homme
  rationale: Dans cette catégorie d’âge adulte, « un homme » exprime naturellement en français le masculin singulier servant à définir la catégorie, sans neutraliser la distinction de sexe présente dans l’hébreu.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וְעַד בֶּן שִׁשִּׁים שָׁנָה
  choice: âgé de vingt à soixante ans
  rationale: Cette tournure française naturelle rend l’intervalle d’âge indiqué par l’idiome hébreu sans préciser davantage que le texte les limites exactes de la catégorie.
- source_word: חֲמִשִּׁים שֶׁקֶל כֶּסֶף
  choice: cinquante sicles d’argent
  rationale: Rendu traditionnel mais toujours intelligible de l’expression de poids et de métal, qui conserve l’unité antique plutôt que de lui substituer une équivalence moderne incertaine.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: selon le sicle du sanctuaire
  rationale: La préposition introduit ici l’étalon de mesure. « Du sanctuaire » rend la référence cultuelle de הַקֹּדֶשׁ plus précisément qu’un simple adjectif « sacré ».
- source_word: וְהָיָה ... וְהָיָה
  choice: sera
  rationale: Le futur français exprime naturellement la prescription légale dans ce contexte, sans la lourdeur d’une tournure juridique archaïsante.
theological_decisions:
- issue: Catégorie d’évaluation distinguée selon le sexe
  choice: un homme
  alternative: un individu de sexe masculin
  rationale: Le texte distingue explicitement les catégories selon le sexe et l’âge. Le masculin est donc conservé, mais formulé dans un français naturel plutôt que dans un langage administratif.
- issue: Nature de עֵרֶךְ en Lévitique 27
  choice: l’estimation que tu fixeras
  alternative: la valeur
  rationale: Il s’agit d’un montant réglementaire associé à un vœu, et non d’une affirmation sur la dignité personnelle ou d’un prix marchand. « Estimation » maintient cette portée cultuelle et juridique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe place d’abord l’estimation afin de conserver le thème de l’hébreu, tout en évitant un calque maladroit. « Sicle » est maintenu comme terme biblique désignant l’unité ancienne, et « selon » indique clairement l’étalon du sanctuaire.
