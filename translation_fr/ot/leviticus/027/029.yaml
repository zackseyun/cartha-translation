source:
  edition: WLC
  text: כָּל חֵ֗רֶם אֲשֶׁ֧ר יָחֳרַ֛ם מִן הָ/אָדָ֖ם לֹ֣א יִפָּדֶ֑ה מ֖וֹת יוּמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/029.yaml
  text: No devoted thing that is devoted from man may be redeemed[b][a]; it must surely be put to death.
translation:
  language: fr
  text: Toute personne vouée à l’interdit parmi les humains ne pourra être rachetée ; elle devra certainement être mise à mort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵרֶם
  choice: personne vouée à l’interdit
  rationale: Dans ce contexte, la précision מִן־הָאָדָם montre que le référent est humain. « Vouée à l’interdit » conserve le caractère technique, cultuel et irrévocable de חֵרֶם sans réduire d’emblée le terme à la seule idée de destruction.
- source_word: יָחֳרַם
  choice: vouée à l’interdit
  rationale: Cette formulation maintient le lien lexical avec חֵרֶם et rend l’idée d’une mise sous interdit sacré ; la proposition finale en explicite l’issue mortelle.
- source_word: מִן־הָאָדָם
  choice: parmi les humains
  rationale: La préposition מן exprime ici l’appartenance à la catégorie humaine. Cette traduction est plus naturelle et plus précise en français que le calque « de l’homme ».
- source_word: יִפָּדֶה
  choice: ne pourra être rachetée
  rationale: פדה signifie racheter ou libérer moyennant rançon. « Racheter » convient au cadre légal et cultuel du chapitre 27.
- source_word: מוֹת יוּמָת
  choice: elle sera mise à mort, oui, mise à mort
  rationale: Le redoublement français rend l’intensification produite par l’infinitif absolu suivi du verbe conjugué, tout en conservant la valeur passive de la formule hébraïque.
theological_decisions:
- issue: Sens de חֵרֶם lorsqu’il concerne un être humain
  choice: Conserver la notion technique de mise sous interdit tout en rendant explicite le référent humain.
  alternative: « Toute personne vouée à la destruction » ou « quiconque est frappé d’interdit »
  rationale: Le texte associe un statut sacré-juridique exprimé par חרם à l’interdiction du rachat et à une formule de mise à mort. La traduction ne doit ni masquer le référent humain ni réduire silencieusement חרם à une simple condamnation pénale.
- issue: Force de מוֹת יוּמָת
  choice: Rendre explicitement l’intensification par « mise à mort, oui, mise à mort ».
  alternative: « devra certainement être mise à mort »
  rationale: Cette formulation préserve à la fois l’insistance sémitique et la voix passive, sans préciser un agent que l’hébreu ne nomme pas.
translation_notes:
  register: Français international moderne, juridique et cultuel, mais accessible. « Personne » évite le calque obscur « chose vouée parmi les hommes » et respecte le référent humain imposé par le contexte. La répétition finale donne une solennité conforme à la formule hébraïque.
