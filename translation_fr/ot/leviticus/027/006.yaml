source:
  edition: WLC
  text: וְ/אִ֣ם מִ/בֶּן חֹ֗דֶשׁ וְ/עַד֙ בֶּן חָמֵ֣שׁ שָׁנִ֔ים וְ/הָיָ֤ה עֶרְכְּ/ךָ֙ הַ/זָּכָ֔ר חֲמִשָּׁ֥ה שְׁקָלִ֖ים כָּ֑סֶף וְ/לַ/נְּקֵבָ֣ה עֶרְכְּ/ךָ֔ שְׁלֹ֥שֶׁת שְׁקָלִ֖ים כָּֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/006.yaml
  text: If it is from a month old up to five years old, your valuation for the male shall be five shekels of silver, and for the female your valuation shall be three shekels of silver.
translation:
  language: fr
  text: S’il s’agit d’un enfant âgé d’un mois à cinq ans, la valeur fixée pour un garçon sera de cinq sicles d’argent, et celle fixée pour une fille sera de trois sicles d’argent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן חֹדֶשׁ וְעַד בֶּן חָמֵשׁ שָׁנִים
  choice: âgé d’un mois à cinq ans
  rationale: Cette formulation naturelle en français rend l’expression hébraïque d’âge et conserve les deux limites de la tranche prévue par la loi, sans expliciter davantage l’inclusion exacte de la borne supérieure.
- source_word: עֶרְכְּךָ
  choice: la valeur fixée
  rationale: Dans Lévitique 27, le terme désigne le montant réglementaire attribué dans le cadre d’un vœu. « Valeur fixée » restitue cette idée plus naturellement que « ton estimation » et permet de rendre le suffixe de deuxième personne comme l’acte de fixation prévu par l’instruction.
- source_word: הַזָּכָר / לַנְּקֵבָה
  choice: pour un garçon / pour une fille
  rationale: La tranche d’âge va d’un mois à cinq ans ; les termes français liés à l’enfance sont donc naturels et expriment ici la distinction de sexe portée par l’hébreu, sans suggérer un statut social.
- source_word: חֲמִשָּׁה שְׁקָלִים כָּסֶף / שְׁלֹשֶׁת שְׁקָלִים כָּסֶף
  choice: cinq sicles d’argent / trois sicles d’argent
  rationale: « Sicle » est le terme français traditionnel et précis pour l’unité de poids et de valeur biblique ; « d’argent » conserve la matière expressément indiquée.
- source_word: וְהָיָה
  choice: sera
  rationale: Le futur français convient au registre prescriptif de cette disposition légale et reste fluide.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne, avec un registre juridique accessible. La répétition hébraïque de עֶרְכְּךָ est reflétée par « celle fixée » dans le second membre, ce qui évite une lourdeur tout en maintenant le parallélisme.
