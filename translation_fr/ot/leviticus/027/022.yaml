source:
  edition: WLC
  text: וְ/אִם֙ אֶת שְׂדֵ֣ה מִקְנָת֔/וֹ אֲשֶׁ֕ר לֹ֖א מִ/שְּׂדֵ֣ה אֲחֻזָּת֑/וֹ יַקְדִּ֖ישׁ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/022.yaml
  text: But if he consecrates to Yahweh a field of his purchase[a], which is not from the field of his inherited property,
translation:
  language: fr
  text: Mais s’il consacre à Yahweh un champ qu’il a acheté, qui ne fait pas partie de sa propriété héréditaire,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Mais s’il
  rationale: Introduit un nouveau cas conditionnel en continuité avec le précédent, tout en marquant un léger contraste.
- source_word: שְׂדֵה מִקְנָתוֹ
  choice: un champ qu’il a acheté
  rationale: Rend naturellement en français le champ acquis par achat, par opposition au patrimoine foncier reçu en héritage.
- source_word: אֲשֶׁר לֹא מִשְּׂדֵה אֲחֻזָּתוֹ
  choice: qui ne fait pas partie de sa propriété héréditaire
  rationale: Exprime clairement que le champ acheté ne provient pas de la propriété ancestrale détenue à titre héréditaire.
- source_word: יַקְדִּישׁ
  choice: il consacre
  rationale: Conserve la portée cultuelle et juridique du fait de mettre un bien à part comme saint pour Yahweh.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Rend directement le nom divin יהוה et la relation indiquée par la préposition ל.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le tétragramme; « Yahweh » préserve le nom propre d’alliance sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « qu’il a acheté » évite le calque peu naturel « champ de son acquisition », tandis que « propriété héréditaire » maintient la distinction juridique centrale. La phrase demeure ouverte, conformément à la syntaxe du verset qui se poursuit au verset suivant.
