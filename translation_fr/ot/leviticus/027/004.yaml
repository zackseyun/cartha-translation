  text: But if it is a female[a], then your valuation shall be thirty shekels.
translation:
  language: fr
  text: Mais s’il s’agit d’une personne de sexe féminin, ton estimation sera de trente sicles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Dans le contexte, la conjonction introduit le cas contrasté par rapport au verset précédent; « Mais si » exprime naturellement cette opposition.
- source_word: נְקֵבָה הִוא
  choice: c’est une personne de sexe féminin
  rationale: Le terme hébreu désigne le sexe féminin, tandis que le contexte porte sur l’évaluation d’une personne. Cette formulation reste précise et naturelle sans réduire le sens à « femme ».
- source_word: וְהָיָה
  choice: sera
  rationale: Dans cette formulation juridique, le verbe introduit le résultat prescrit de la condition.
- source_word: עֶרְכְּךָ
  choice: la valeur que tu fixeras
  rationale: Le nom désigne ici la valeur assignée dans le cadre d’un vœu; la tournure française rend également le suffixe de deuxième personne masculine singulière.
- source_word: שְׁלֹשִׁים שָׁקֶל
  choice: trente sicles
  rationale: Le nombre est rendu directement et le nom de l’unité, singulier après un nombre en hébreu, prend naturellement le pluriel en français. Le texte ne précise pas ici « d’argent ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne, avec une formulation juridique naturelle. « Personne de sexe féminin » explicite le référent humain fourni par le contexte immédiat tout en conservant la portée sexuelle de נְקֵבָה.
