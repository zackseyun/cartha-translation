  text: בִּ/שְׁנַ֤ת הַ/יּוֹבֵל֙ יָשׁ֣וּב הַ/שָּׂדֶ֔ה לַ/אֲשֶׁ֥ר קָנָ֖/הוּ מֵ/אִתּ֑/וֹ לַ/אֲשֶׁר ל֖/וֹ אֲחֻזַּ֥ת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/024.yaml
  text: In the year of jubilee the field shall return to the one from whom it was bought[a], to the one to whom the possession of the land belongs.
translation:
  language: fr
  text: L’année du jubilé, le champ retournera à celui auprès de qui il l’avait acheté[a], à celui à qui appartient le domaine foncier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « auprès de qui il l’avait acheté ». Le sujet de « avait acheté » n’est pas exprimé en hébreu. L’expression finale désigne le titulaire de la possession foncière.'
    reason: Clarifie la construction hébraïque et le référent implicite sans substituer au point de vue de l’achat celui de la vente ni expliciter indûment le statut héréditaire.
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל
  choice: L’année du jubilé
  rationale: La construction temporelle avec בְּ est rendue naturellement en français sans préposition. « Jubilé » désigne ici l’institution légale propre à Lévitique.
- source_word: יָשׁוּב הַשָּׂדֶה
  choice: le champ retournera
  rationale: L’imparfait hébreu énonce la conséquence juridique à venir. Le futur français est naturel et conserve cette valeur normative dans le contexte.
- source_word: לַאֲשֶׁר קָנָהוּ מֵאִתּוֹ
  choice: à celui qui l’avait vendu
  rationale: Littéralement, la proposition signifie « à celui auprès de qui il l’avait acquis ». Puisque le champ retourne à l’ancien détenteur, « celui qui l’avait vendu » exprime clairement la relation sans introduire dans le texte français un sujet acheteur ambigu.
- source_word: לַאֲשֶׁר לוֹ אֲחֻזַּת הָאָרֶץ
  choice: celui à qui revient la propriété foncière
  rationale: אֲחֻזָּה désigne une possession ou tenure foncière, particulièrement dans le régime israélite des lots familiaux. Cette formulation garde le sens juridique sans rendre explicitement « héréditaire » dans le corps du verset.
theological_decisions:
- issue: Nature de אֲחֻזַּת הָאָרֶץ dans la législation du jubilé
  choice: « la propriété foncière », avec l’idée du lot familial précisée en note
  alternative: « le domaine héréditaire » ou « la propriété ancestrale »
  rationale: Le contexte du jubilé concerne bien le patrimoine familial, mais אֲחֻזָּה désigne directement une possession foncière. Le texte principal conserve ce sens juridique général et la note explicite la portée contextuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la répétition explicative de l’hébreu (« à celui…, celui à qui… »), tout en employant un vocabulaire juridique compréhensible.
