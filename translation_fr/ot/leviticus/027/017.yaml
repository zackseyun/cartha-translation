source:
  edition: WLC
  text: אִם מִ/שְּׁנַ֥ת הַ/יֹּבֵ֖ל יַקְדִּ֣ישׁ שָׂדֵ֑/הוּ כְּ/עֶרְכְּ/ךָ֖ יָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/017.yaml
  text: If he consecrates his field from the year of jubilee[a], your valuation shall stand.
translation:
  language: fr
  text: S’il consacre son champ à partir de l’année du jubilé, ton estimation restera valable.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: S’il
  rationale: Introduit naturellement en français la condition de ce cas juridique.
- source_word: מִשְּׁנַת הַיֹּבֵל
  choice: dès l’année du jubilé
  rationale: La préposition מִן marque ici le point de départ; « dès » exprime clairement que l’évaluation vaut lorsque la consécration commence l’année du jubilé.
- source_word: יַקְדִּישׁ
  choice: consacre
  rationale: Le hifil de קדשׁ signifie mettre à part comme saint; « consacrer » préserve la portée cultuelle du geste.
- source_word: שָׂדֵהוּ
  choice: son champ
  rationale: Rend directement le nom et son suffixe possessif.
- source_word: כְּעֶרְכְּךָ
  choice: l’estimation que tu en as faite
  rationale: Formulation française naturelle qui conserve la deuxième personne et renvoie à l’estimation prescrite dans le contexte.
- source_word: יָקוּם
  choice: restera valable
  rationale: Dans ce cadre juridique et administratif, קום indique que l’estimation demeure en vigueur.
theological_decisions:
- issue: Verbe cultuel désignant la mise à part du champ
  choice: consacre
  alternative: dédie
  rationale: « Consacre » maintient explicitement l’idée de mise à part comme sainte sans préciser au-delà de l’hébreu le bénéficiaire de l’acte.
translation_notes:
  register: Français moderne, digne et accessible, avec une tournure juridique claire. « Jubilé » reste en minuscule comme nom de l’institution; aucune note n’est nécessaire, car « consacre » restitue directement la nuance cultuelle.
