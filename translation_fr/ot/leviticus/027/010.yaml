source:
  edition: WLC
  text: לֹ֣א יַחֲלִיפֶ֗/נּוּ וְ/לֹֽא יָמִ֥יר אֹת֛/וֹ ט֥וֹב בְּ/רָ֖ע אוֹ רַ֣ע בְּ/ט֑וֹב וְ/אִם הָמֵ֨ר יָמִ֤יר בְּהֵמָה֙ בִּ/בְהֵמָ֔ה וְ/הָֽיָה ה֥וּא וּ/תְמוּרָת֖/וֹ יִֽהְיֶה קֹּֽדֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/010.yaml
  text: He shall not replace it or exchange it[a], good for bad or bad for good; and if he does indeed exchange one animal for another[b], then both it and its substitute shall be holy.
translation:
  language: fr
  text: Il ne devra ni le remplacer ni l’échanger[a], un bon contre un mauvais ou un mauvais contre un bon. Mais s’il échange vraiment un animal contre un autre[b], l’animal initial et son substitut seront tous deux saints.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici deux verbes proches mais distincts, rendus par « remplacer » et « échanger ».
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu renforce le verbe : littéralement, « si vraiment il échange » ou « s’il échange bel et bien ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲלִיפֶנּוּ
  choice: on ne la remplacera
  rationale: Le hiphil de חלף désigne ici le remplacement de l’animal voué par un autre. « Remplacer » garde une distinction naturelle avec le verbe מוּר qui suit.
- source_word: יָמִיר אֹתוֹ
  choice: ni ne l’échangera
  rationale: מוּר exprime l’échange ou la substitution d’un animal à un autre. « Échanger » convient au contexte juridique et préserve la succession de deux verbes distincts.
- source_word: טוֹב בְּרָע אוֹ רַע בְּטוֹב
  choice: une bonne contre une mauvaise ou une mauvaise contre une bonne
  rationale: Les adjectifs sont substantivés et renvoient à la bête, nom féminin en français. « Contre » rend naturellement le rapport d’échange marqué par ב.
- source_word: וְאִם הָמֵר יָמִיר
  choice: Si toutefois on échange effectivement
  rationale: L’infinitif absolu suivi du verbe conjugué souligne la réalité ou l’insistance de l’échange. « Effectivement » transmet cette emphase en français actuel.
- source_word: בְּהֵמָה בִּבְהֵמָה
  choice: un animal contre un autre
  rationale: Cette formulation idiomatique exprime clairement la substitution réciproque sans reproduire gauchement « animal contre animal ».
- source_word: וְהָיָה הוּא וּתְמוּרָתוֹ
  choice: l’animal et celui qui lui a été substitué seront tous deux
  rationale: Le pronom vise l’animal initial et תְּמוּרָה l’animal substitué. La formulation explicite les deux référents et rend sans ambiguïté leur statut commun.
- source_word: קֹדֶשׁ
  choice: saints
  rationale: קֹדֶשׁ indique ici le statut sacré de ce qui appartient à Dieu. « Saints » est direct et conserve le vocabulaire théologique du texte.
theological_decisions:
- issue: Statut de l’animal initial et de l’animal substitué après un échange interdit
  choice: Les deux animaux deviennent saints.
  alternative: Seul l’animal substitué deviendrait saint, ou le texte signalerait seulement l’invalidité de l’échange.
  rationale: La proposition « lui et son substitut seront saints » attribue explicitement le statut sacré aux deux animaux; « tous deux » rend cette dualité manifeste sans ajouter de conséquence doctrinale étrangère au verset.
translation_notes:
  register: Français international moderne, digne et juridique sans archaïsme. Le pronom indéfini « on » rend la prescription générale; les formes féminines de la première phrase reprennent naturellement « la bête » du contexte immédiat. Les marqueurs [a] et [b] figurent dans le texte.
