revisions:
- from: On ne la remplacera ni ne l’échangera[a], une bonne contre une mauvaise ou une mauvaise contre une bonne. Si toutefois on échange effectivement un animal contre un autre[b], l’animal et celui qui lui a été substitué seront tous deux saints.
  to: Il ne devra ni le remplacer ni l’échanger[a], un bon contre un mauvais ou un mauvais contre un bon. Mais s’il échange vraiment un animal contre un autre[b], l’animal initial et son substitut seront tous deux saints.
  rationale: La révision harmonise le genre grammatical autour d’« animal », conserve la distinction lexicale présente dans l’hébreu et remplace « toutefois » par une expression de l’emphase verbale. Elle garde les deux marqueurs de note à leurs emplacements et préserve l’affirmation selon laquelle les deux animaux sont saints.
