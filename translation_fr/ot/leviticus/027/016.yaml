source:
  edition: WLC
  text: וְ/אִ֣ם מִ/שְּׂדֵ֣ה אֲחֻזָּת֗/וֹ יַקְדִּ֥ישׁ אִישׁ֙ לַֽ/יהוָ֔ה וְ/הָיָ֥ה עֶרְכְּ/ךָ֖ לְ/פִ֣י זַרְע֑/וֹ זֶ֚רַע חֹ֣מֶר שְׂעֹרִ֔ים בַּ/חֲמִשִּׁ֖ים שֶׁ֥קֶל כָּֽסֶף׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/016.yaml
  text: 'If a man consecrates to Yahweh part of the field of his possession[a], then your valuation shall be according to its seed requirement: fifty shekels of silver for the seed of a homer of barley.'
translation:
  language: fr
  text: 'Si un homme consacre à Yahweh une partie du champ de sa propriété héréditaire[a], tu l’évalueras d’après la quantité de semence nécessaire : cinquante sicles d’argent pour un homer de semence d’orge.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « une partie du champ de son patrimoine ». L’expression hébraïque désigne une terre détenue comme possession familiale héréditaire, et la préposition hébraïque מן (« de, parmi ») indique qu’il s’agit seulement d’une partie du champ.'
    reason: Précision lexicale et juridique sur מִשְּׂדֵה אֲחֻזָּתוֹ.
lexical_decisions:
- source_word: מִשְּׂדֵה אֲחֻזָּתוֹ
  choice: une partie du champ qui constitue sa propriété héréditaire
  rationale: La préposition מִן suggère qu’il s’agit d’une partie du champ. אֲחֻזָּה désigne ici un bien foncier détenu durablement, normalement dans le cadre de l’héritage familial.
- source_word: יַקְדִּישׁ
  choice: consacre
  rationale: Dans Lévitique 27, le verbe désigne la mise à part d’un bien comme chose sainte offerte à Dieu, dans un contexte d’estimation et de rachat.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom hébreu est masculin singulier et présente le cas juridique sous une forme représentative.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Cette forme rend directement le nom divin יהוה employé dans le texte hébreu.
- source_word: עֶרְכְּךָ
  choice: ton estimation
  rationale: Le terme désigne l’évaluation réglementaire du bien; le possessif singulier conserve l’adresse directe de l’hébreu.
- source_word: לְפִי זַרְעוֹ
  choice: en fonction de la quantité de semence nécessaire
  rationale: La valeur du champ dépend de la quantité de semence requise pour l’ensemencer, et non de sa production ou de sa descendance.
- source_word: זֶרַע חֹמֶר שְׂעֹרִים
  choice: un homer de semence d’orge
  rationale: Le homer est ici une mesure de capacité appliquée à l’orge destinée aux semailles; la formulation française garde cette unité technique tout en restant claire.
- source_word: בַּחֲמִשִּׁים שֶׁקֶל כָּסֶף
  choice: cinquante sicles d’argent
  rationale: La formule indique le montant d’évaluation correspondant à la quantité de semence mentionnée.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme; « Yahweh » préserve sa fonction de nom propre.
- issue: Valeur représentative du masculin אִישׁ
  choice: un homme
  alternative: quelqu’un
  rationale: La traduction conserve le masculin singulier du cas juridique sans nier sa portée représentative.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire cultuel (« consacre ») et les unités anciennes (« sicles », « homer ») sont conservés; le sens agricole de la base d’évaluation est explicité sans convertir les mesures.
