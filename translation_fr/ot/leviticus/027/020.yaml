id: LEV.27.20
reference: Leviticus 27:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם לֹ֤א יִגְאַל֙ אֶת הַ/שָּׂדֶ֔ה וְ/אִם מָכַ֥ר אֶת הַ/שָּׂדֶ֖ה לְ/אִ֣ישׁ אַחֵ֑ר לֹ֥א יִגָּאֵ֖ל עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/020.yaml
  text: But if he does not redeem the field[a], or if he has sold the field to another man, it may not be redeemed again.
translation:
  language: fr
  text: Mais s’il ne rachète pas le champ, ou s’il vend le champ à un autre homme[a], le champ ne pourra plus être racheté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à une autre personne ». L’hébreu dit littéralement : « à un autre homme ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais s’il / ou s’il
  rationale: La première occurrence poursuit le cas précédent en introduisant une éventualité contraire; la seconde coordonne une autre condition. « Mais si… ou si… » rend clairement la logique juridique en français, même si le second וְאִם peut aussi se comprendre « et si ».
- source_word: יִגְאַל / יִגָּאֵל
  choice: rachète / être racheté
  rationale: Dans cette réglementation sur un bien consacré, גאל désigne le rachat du champ. « Racheter » est naturel en français juridique courant et conserve le lien entre les formes active et passive.
- source_word: הַשָּׂדֶה
  choice: le champ
  rationale: Le nom désigne le champ précis dont il est question dans les versets précédents, non un territoire ou la terre au sens large.
- source_word: מָכַר
  choice: vend
  rationale: Après אִם, l’accompli hébreu présente l’éventualité d’une vente comme condition juridiquement décisive. Le présent français convient naturellement dans une proposition conditionnelle.
- source_word: לְאִישׁ אַחֵר
  choice: à un autre homme
  rationale: אִישׁ est ici un nom masculin singulier. « Un autre homme » en reflète directement la forme, bien que l’expression puisse avoir une portée juridique générique.
- source_word: עוֹד
  choice: plus
  rationale: Avec la négation, עוֹד indique que le rachat ne sera désormais plus possible. « Ne pourra plus » exprime clairement cette conséquence juridique.
theological_decisions:
- issue: Portée du masculin dans la formulation juridique
  choice: un autre homme
  alternative: une autre personne
  rationale: La traduction conserve le masculin explicite אִישׁ sans exclure la possibilité que la règle ait une portée générique.
- issue: Valeur juridico-sacrale de גאל
  choice: racheter
  alternative: reprendre / récupérer
  rationale: « Racheter » rend le mécanisme légal appliqué à un bien consacré sans ajouter une interprétation doctrinale étrangère au contexte.
- issue: Relation entre les deux conditions introduites par וְאִם
  choice: ou s’il
  alternative: et s’il
  rationale: Dans le déroulement juridique, « ou » présente les éventualités qui aboutissent à l’impossibilité d’un rachat ultérieur. La coordination hébraïque permet toutefois aussi la lecture cumulative « et si », signalée en note.
translation_notes:
  register: Français moderne, clair et digne, avec une formulation juridique accessible. La répétition finale de « le champ » évite l’ambiguïté du pronom « il ». Toutefois, la note [b] doit être appelée dans le texte si elle est conservée.
