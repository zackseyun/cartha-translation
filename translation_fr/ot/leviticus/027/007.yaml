  text: וְ֠/אִם מִ/בֶּן שִׁשִּׁ֨ים שָׁנָ֤ה וָ/מַ֨עְלָ/ה֙ אִם זָכָ֔ר וְ/הָיָ֣ה עֶרְכְּ/ךָ֔ חֲמִשָּׁ֥ה עָשָׂ֖ר שָׁ֑קֶל וְ/לַ/נְּקֵבָ֖ה עֲשָׂרָ֥ה שְׁקָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/007.yaml
  text: And if from sixty years old and upward[a], if male, then your valuation shall be fifteen shekels[b], and for the female ten shekels.
translation:
  language: fr
  text: Si la personne est âgée de soixante ans ou plus, si c’est un homme, ton estimation sera de quinze sicles[a] ; si c’est une femme, elle sera de dix sicles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sicle est une unité de poids employée ici comme unité de valeur.
    reason: cultural_clarification
lexical_decisions:
- source_word: מִבֶּן שִׁשִּׁים שָׁנָה וָמַעְלָה
  choice: âgée de soixante ans ou plus
  rationale: Cette tournure française naturelle exprime exactement le seuil d’âge inclusif indiqué par l’expression hébraïque.
- source_word: זָכָר
  choice: un homme
  rationale: Dans ce barème portant sur des personnes âgées d’au moins soixante ans, « homme » est naturel en français et conserve l’opposition de sexe avec « femme ».
- source_word: עֶרְכְּךָ
  choice: la valeur que tu fixeras
  rationale: Le terme désigne ici la valeur réglementaire assignée dans le cadre d’un vœu. Cette formulation rend le suffixe de deuxième personne et le sens technique sans suggérer la valeur intrinsèque de la personne.
- source_word: חֲמִשָּׁה עָשָׂר שָׁקֶל
  choice: quinze sicles
  rationale: Traduction directe du nombre et de l’unité de poids monétaire biblique.
- source_word: לַנְּקֵבָה
  choice: si c’est une femme
  rationale: Cette formulation française restitue clairement le cas correspondant au sexe féminin et forme un parallèle naturel avec « si c’est un homme ».
- source_word: עֲשָׂרָה שְׁקָלִים
  choice: dix sicles
  rationale: Traduction directe du nombre et de l’unité.
theological_decisions:
- issue: Nature de la « valeur » attribuée à la personne
  choice: la valeur que tu fixeras
  alternative: ta valeur estimée
  rationale: Le contexte législatif concerne un montant réglementaire lié à un vœu, non un jugement sur la dignité ou la valeur intrinsèque de la personne.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe explicite « la personne » pour éviter une tournure impersonnelle, tandis que le tutoiement conserve l’adresse singulière du texte hébreu. Le point-virgule met en relief les deux montants parallèles.
