  yaml_path: translation/ot/leviticus/027/031.yaml
  text: But if a man redeems any of his tithe[a], he shall add a fifth to it.
translation:
  language: fr
  text: Mais si un homme rachète[a] une partie de sa dîme, il y ajoutera un cinquième.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « et si, rachetant, un homme rachète », une construction qui souligne le verbe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: La conjonction suivie de la particule conditionnelle introduit un nouveau cas dans la série de prescriptions. « Mais si » rend naturellement cette transition conditionnelle.
- source_word: גָּאֹל יִגְאַל
  choice: rachète effectivement
  rationale: L’infinitif absolu suivi de l’imparfait du même verbe renforce l’idée verbale. « Effectivement » conserve cette insistance sans donner à la tournure une valeur de volonté qu’elle n’exprime pas explicitement.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom hébreu est masculin singulier et s’emploie ici de manière générique dans un texte juridique; la traduction en conserve la forme explicite.
- source_word: מִמַּעַשְׂרוֹ
  choice: une partie de sa dîme
  rationale: 'La préposition מִן a ici un sens partitif : le rachat porte sur une portion de ce qui constitue sa dîme.'
- source_word: חֲמִשִׁיתוֹ
  choice: un cinquième
  rationale: Le terme désigne une cinquième partie, soit un supplément de vingt pour cent.
- source_word: יֹסֵף עָלָיו
  choice: il y ajoutera
  rationale: Le hifil de יסף signifie « ajouter », et עַל indique ici l’ajout au montant principal. Le pronom français « y » renvoie naturellement à la valeur de la portion rachetée.
