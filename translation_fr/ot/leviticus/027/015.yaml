  text: וְ/אִ֨ם הַ/מַּקְדִּ֔ישׁ יִגְאַ֖ל אֶת בֵּית֑/וֹ וְ֠/יָסַף חֲמִישִׁ֧ית כֶּֽסֶף עֶרְכְּ/ךָ֛ עָלָ֖י/ו וְ/הָ֥יָה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/015.yaml
  text: And if the one who consecrated it redeems his house[a], then he shall add a fifth of the silver of your valuation to it[b], and it shall be his.
translation:
  language: fr
  text: Si celui qui a consacré sa maison[a] la rachète, il ajoutera un cinquième à la valeur en argent que tu as fixée[b], et elle lui appartiendra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dédié sa maison » ou « sanctifié sa maison ».
    reason: lexical_alternative
  - marker: b
    text: Il s’agit d’ajouter un cinquième à la valeur en argent établie par le prêtre.
    reason: cultural_note
lexical_decisions:
- source_word: הַמַּקְדִּישׁ
  choice: celui qui a consacré
  rationale: Le participe désigne celui qui a mis la maison à part comme chose sainte. « Consacré » conserve la portée cultuelle et juridique du contexte.
- source_word: יִגְאַל
  choice: veut la racheter
  rationale: Dans cette construction conditionnelle, le verbe exprime le rachat du bien par son ancien propriétaire. « Racheter » est le terme français naturel dans ce cadre juridique et sacré; l’ajout de « veut » explicite sans en changer le sens la condition exprimée en hébreu.
- source_word: בֵּיתוֹ
  choice: sa maison
  rationale: « Maison » rend précisément le bien immobilier visé et convient au registre juridique du passage.
- source_word: וְיָסַף
  choice: il ajoutera
  rationale: La forme verbale énonce l’action requise lorsque la condition est remplie. Le futur français convient à cette prescription conditionnelle.
- source_word: חֲמִישִׁית
  choice: un cinquième
  rationale: Traduction directe de la fraction, plus conforme au registre biblique et juridique que « vingt pour cent ».
- source_word: כֶּסֶף עֶרְכְּךָ
  choice: la valeur en argent que tu as fixée
  rationale: Cette formulation française naturelle conserve la mention concrète de l’argent et le singulier de l’adresse au responsable de l’évaluation.
- source_word: עָלָיו
  choice: à la valeur
  rationale: La préposition indique que le cinquième est ajouté au montant évalué; répéter « à la valeur » rend clairement cette relation en français.
- source_word: וְהָיָה לוֹ
  choice: elle lui appartiendra
  rationale: 'La clause exprime le résultat juridique du rachat: la maison redevient la propriété de celui qui paie.'
theological_decisions:
- issue: Terminologie cultuelle appliquée à une maison mise à part pour Dieu
  choice: consacré
  alternative: dédié; sanctifié
  rationale: « Consacré » préserve à la fois le caractère sacré et la dimension juridique de l’acte, sans introduire de nuance doctrinale étrangère au contexte.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conditionnelle est naturelle, tandis que les termes « consacré », « racheter » et « un cinquième » maintiennent le registre cultuel et juridique du Lévitique.
