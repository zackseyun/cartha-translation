id: LEV.27.18
reference: Leviticus 27:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם אַחַ֣ר הַ/יֹּבֵל֮ יַקְדִּ֣ישׁ שָׂדֵ/הוּ֒ וְ/חִשַּׁב ל֨/וֹ הַ/כֹּהֵ֜ן אֶת הַ/כֶּ֗סֶף עַל פִּ֤י הַ/שָּׁנִים֙ הַ/נּ֣וֹתָרֹ֔ת עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/נִגְרַ֖ע מֵֽ/עֶרְכֶּֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/018.yaml
  text: But if he consecrates his field after the Jubilee[a], then the priest shall calculate the money for him according to the years remaining until the year of Jubilee[c][b], and it shall be deducted from your valuation.
translation:
  language: fr
  text: Mais s’il consacre son champ après le jubilé[a], le prêtre calculera pour lui la somme[b] en fonction du nombre d’années qui restent jusqu’à l’année du jubilé, et cette somme sera déduite de ton estimation[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « après l’année du jubilé ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le prêtre en évaluera le prix pour lui » ; littéralement : « calculera pour lui l’argent » (ou « l’argent-métal »).'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « et ton estimation sera réduite d’autant » ; littéralement : « et il sera retranché de ton estimation » — le sujet sous-entendu peut renvoyer à la somme calculée.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: אַחַר הַיֹּבֵל
  choice: après le jubilé
  rationale: אַחַר exprime la postériorité temporelle, et הַיֹּבֵל désigne ici le jubilé, institution et année définies dans le contexte du Lévitique.
- source_word: יַקְדִּישׁ
  choice: consacre
  rationale: Le verbe קדשׁ indique que le champ est mis à part comme chose sainte ; « consacre » conserve cette dimension cultuelle tout en restant naturel en français.
- source_word: שָׂדֵהוּ
  choice: son champ
  rationale: Le suffixe possessif indique sans ambiguïté qu’il s’agit du champ de l’homme concerné.
- source_word: וְחִשַּׁב לוֹ הַכֹּהֵן אֶת הַכֶּסֶף
  choice: le prêtre calculera pour lui la somme
  rationale: חשב signifie ici calculer ou déterminer par calcul, tandis que הַכֶּסֶף désigne la somme d’argent résultant de l’estimation.
- source_word: עַל פִּי הַשָּׁנִים הַנּוֹתָרֹת
  choice: en fonction du nombre d’années qui restent
  rationale: L’expression עַל־פִּי marque la base du calcul ; cette formulation française rend clairement le caractère proportionnel de l’estimation.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: jusqu’à l’année du jubilé
  rationale: La formule précise le terme de la période prise en compte dans le calcul.
- source_word: וְנִגְרַע מֵעֶרְכֶּךָ
  choice: et cette somme sera déduite de ton estimation
  rationale: Le nifal de גרע exprime une diminution ou une déduction. « Cette somme » explicite en français le référent monétaire probable sans changer le mécanisme légal, et « ton » conserve le suffixe de deuxième personne du singulier.
theological_decisions:
- issue: Maintien de la deuxième personne du singulier dans מֵעֶרְכֶּךָ
  choice: de ton estimation
  alternative: de l’estimation
  rationale: Le texte hébreu emploie explicitement un suffixe de deuxième personne masculine singulière. Le conserver respecte l’adresse juridique directe et le lien avec l’estimation prescrite dans le contexte.
- issue: Terminologie cultuelle pour יַקְדִּישׁ
  choice: consacre
  alternative: dédie
  rationale: « Consacre » exprime mieux la mise à part sacrée du bien dans le cadre légal et cultuel du chapitre, sans ajouter de précision doctrinale.
- issue: Référent sous-entendu de וְנִגְרַע
  choice: cette somme sera déduite
  alternative: ton estimation sera réduite d’autant
  rationale: L’hébreu laisse le sujet grammatical implicite. Le contexte immédiat favorise la somme calculée, mais l’autre formulation rend le même effet juridique et préserve une légère ambiguïté quant à la manière d’exprimer la réduction.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe juridique reste perceptible sans devenir lourde. « Jubilé » est conservé comme terme biblique établi ; la deuxième personne du singulier est maintenue conformément à l’hébreu.
