source:
  edition: WLC
  text: לֹ֧א יְבַקֵּ֛ר בֵּֽין ט֥וֹב לָ/רַ֖ע וְ/לֹ֣א יְמִירֶ֑/נּוּ וְ/אִם הָמֵ֣ר יְמִירֶ֔/נּוּ וְ/הָֽיָה ה֧וּא וּ/תְמוּרָת֛/וֹ יִֽהְיֶה קֹ֖דֶשׁ לֹ֥א יִגָּאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/033.yaml
  text: He shall not inspect whether it is good or bad[a], nor shall he exchange it; and if he does in fact exchange it, then both it and its substitute shall be holy[b]; it shall not be redeemed.
translation:
  language: fr
  text: On ne fera pas de distinction entre un bon animal et un mauvais[a], et on ne le remplacera pas. Et si on le remplace bel et bien, l’animal et celui qui lui est substitué seront tous deux saints[b] ; ils ne pourront pas être rachetés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « on n’examinera pas entre bon et mauvais ». L’expression hébraïque désigne le fait de trier les animaux selon leur qualité.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu souligne l’action : « si vraiment on le remplace » ou « s’il le remplace bel et bien ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַקֵּר / בֵּין טוֹב לָרַע
  choice: faire de distinction entre une bonne bête et une mauvaise
  rationale: Le piel de בקר, avec l’expression « entre bon et mauvais », désigne ici l’examen qualitatif visant à sélectionner un animal parmi ceux de la dîme. Cette formulation française restitue clairement l’interdiction de trier.
- source_word: יְמִירֶנּוּ / הָמֵר יְמִירֶנּוּ
  choice: la remplacer / si toutefois on la remplace
  rationale: La racine מור est le terme juridique pour substituer un animal à un autre. « Remplacer » est naturel en français, tandis que « si toutefois » rend l’insistance de l’infinitif absolu associé au verbe conjugué.
- source_word: תְמוּרָתוֹ
  choice: celle qui lui est substituée
  rationale: La formule désigne l’autre bête mise à la place de la première et évite l’ambiguïté que pourrait avoir le nom abstrait « substitution ».
- source_word: קֹדֶשׁ
  choice: saintes
  rationale: Dans ce contexte lévitique, le mot qualifie des animaux consacrés à Dieu. « Saintes » maintient le registre cultuel et théologique du texte.
- source_word: לֹא יִגָּאֵל
  choice: elles ne pourront pas être rachetées
  rationale: Le niphal de גאל exprime ici l’impossibilité juridique de racheter les animaux consacrés. Le pluriel explicite que l’interdiction finale porte sur les deux bêtes devenues saintes.
theological_decisions:
- issue: Portée cultuelle de la consécration et du rachat
  choice: Employer « saintes » et « rachetées » dans leur sens juridique et cultuel.
  alternative: Employer les termes plus généraux « sacrées » et « reprises contre paiement ».
  rationale: Le verset traite du statut d’animaux consacrés dans le culte d’Israël. Ces choix préservent la force sacrale du vocabulaire sans lui imposer une lecture doctrinale ultérieure.
- issue: Référent de l’interdiction finale au singulier hébreu
  choice: 'Rendre au pluriel : « elles ne pourront pas être rachetées ».'
  alternative: 'Conserver un singulier formel : « elle ne pourra pas être rachetée ».'
  rationale: Après la substitution interdite, le texte déclare saintes la bête initiale et sa remplaçante. En français, le pluriel rend naturellement la portée collective du singulier juridique hébreu, sans limiter arbitrairement l’interdiction à l’une des deux.
translation_notes:
  register: Français moderne, clair et digne, avec une formulation impersonnelle adaptée au style juridique. « Bête » explicite le référent animal fourni par le contexte immédiat, et le vocabulaire « saintes / rachetées » maintient le registre cultuel de Lévitique.
