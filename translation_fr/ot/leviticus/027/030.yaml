id: LEV.27.30
reference: Leviticus 27:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כָל מַעְשַׂ֨ר הָ/אָ֜רֶץ מִ/זֶּ֤רַע הָ/אָ֨רֶץ֙ מִ/פְּרִ֣י הָ/עֵ֔ץ לַ/יהוָ֖ה ה֑וּא קֹ֖דֶשׁ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/030.yaml
  text: Every tithe of the land[a], from the seed of the land and from the fruit of the tree, belongs to Yahweh; it is holy to Yahweh.
translation:
  language: fr
  text: Toute dîme de la terre, qu’elle provienne des semences de la terre ou des fruits des arbres, appartient à Yahweh ; elle est consacrée à Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל מַעְשַׂר הָאָרֶץ
  choice: Toute dîme de la terre
  rationale: Avec un nom singulier, כָּל a ici une valeur distributive. « Toute dîme » est naturel en français et conserve le terme cultuel מַעְשַׂר. Dans ce contexte agricole, הָאָרֶץ désigne la terre qui produit les récoltes.
- source_word: מִזֶּרַע הָאָרֶץ
  choice: qu’elle provienne des semences de la terre
  rationale: La préposition מִן indique ici l’origine ou la provenance de la dîme. « Semences » préserve l’image concrète de זֶרַע tout en convenant au sens collectif du terme.
- source_word: מִפְּרִי הָעֵץ
  choice: ou des fruits des arbres
  rationale: Le second מִן coordonne une autre provenance. Les pluriels français rendent naturellement les singuliers collectifs hébreux « fruit » et « arbre ».
- source_word: לַיהוָה הוּא
  choice: appartient à Yahweh
  rationale: Le לְ marque ici l’appartenance ou la destination consacrée. « Appartient à » explicite avec naturel la proposition nominale hébraïque.
- source_word: קֹדֶשׁ לַיהוָה
  choice: elle est consacrée à Yahweh
  rationale: קֹדֶשׁ indique que la dîme est mise à part pour Yahweh. « Consacrée » exprime ici clairement cette sainteté cultuelle sans ajouter le degré superlatif absent de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel divin plutôt que de lui substituer un titre.
- issue: Sens de קֹדֶשׁ dans la formule קֹדֶשׁ לַיהוָה
  choice: consacrée à Yahweh
  alternative: sainte pour Yahweh
  rationale: Le contexte concerne la mise à part cultuelle de la dîme. « Consacrée » communique ce sens en français courant, tandis que « sainte pour » serait plus formel mais moins idiomatique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe distributive « qu’elle provienne… ou… » clarifie que la règle englobe les deux catégories de produits agricoles, sans réduire זֶרַע au seul grain.
