  - severity: low
    issue: « la valeur que tu fixeras » est plus interprétatif et moins concis que nécessaire.
    rationale: עֶרְכְּךָ signifie littéralement « ton estimation/ta valeur d’estimation » dans ce contexte cultuel. « Ton estimation » conserve le suffixe de deuxième personne et le terme technique de manière plus directe.
  revised_text: Si la personne est âgée de cinq à vingt ans, ton estimation sera de vingt sicles pour une personne de sexe masculin et de dix sicles pour une personne de sexe féminin.
