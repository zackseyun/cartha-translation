  verdict: revise
  source_fidelity: La tranche de cinq à vingt ans, l’estimation adressée à la deuxième personne et les montants en sicles sont correctement rendus. Toutefois, « garçon » et « fille » ne couvrent pas sans difficulté toute la tranche, qui va jusqu’à vingt ans; l’hébreu emploie des catégories de sexe (« le mâle / la femelle »), non des termes désignant spécifiquement des enfants.
  naturalness: La phrase est claire et de registre approprié. « Ton estimation » est plus direct et plus proche de עֶרְכְּךָ que « la valeur que tu fixeras ». « Personne de sexe masculin/féminin » reste neutre et intelligible dans ce barème juridique, sans l’ambiguïté d’âge de « garçon/fille ».
  terminology: « Sicle » est le terme français usuel pour le שקל biblique. Les catégories « personne de sexe masculin » et « personne de sexe féminin » rendent fidèlement les catégories sexuées du texte sans les restreindre indûment à l’enfance.
