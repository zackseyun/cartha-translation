source:
  edition: WLC
  text: וְ/אִ֨ם מִ/בֶּן חָמֵ֜שׁ שָׁנִ֗ים וְ/עַד֙ בֶּן עֶשְׂרִ֣ים שָׁנָ֔ה וְ/הָיָ֧ה עֶרְכְּ/ךָ֛ הַ/זָּכָ֖ר עֶשְׂרִ֣ים שְׁקָלִ֑ים וְ/לַ/נְּקֵבָ֖ה עֲשֶׂ֥רֶת שְׁקָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/005.yaml
  text: And if it is from five years old up to twenty years old, your valuation shall be twenty shekels for the male and ten shekels for the female.
translation:
  language: fr
  text: Si la personne est âgée de cinq à vingt ans, ton estimation sera de vingt sicles pour une personne de sexe masculin et de dix sicles pour une personne de sexe féminin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Si
  rationale: Le français juridique exprime naturellement la continuité d’une série de cas par « Si », sans devoir reproduire mécaniquement la conjonction hébraïque.
- source_word: מִבֶּן חָמֵשׁ שָׁנִים וְעַד בֶּן עֶשְׂרִים שָׁנָה
  choice: est âgée de cinq à vingt ans
  rationale: Cette formulation française naturelle rend l’intervalle d’âge exprimé par l’idiome hébreu avec בֶּן et conserve l’inclusion des bornes sans l’alourdir.
- source_word: וְהָיָה עֶרְכְּךָ
  choice: la valeur que tu fixeras sera
  rationale: עֵרֶךְ désigne ici la valeur réglementaire attribuée dans le cadre d’un vœu; la proposition relative restitue le suffixe de deuxième personne et évite le terme moins courant « estimation ».
- source_word: הַזָּכָר
  choice: un garçon
  rationale: Dans la tranche d’âge de cinq à vingt ans, « garçon » est plus naturel que « mâle » et désigne clairement la catégorie de sexe visée, sans transformer le singulier juridique en groupe pluriel.
- source_word: עֶשְׂרִים שְׁקָלִים
  choice: vingt sicles
  rationale: Le nom historique de l’unité de poids et de valeur est conservé plutôt que converti en monnaie moderne.
- source_word: וְלַנְּקֵבָה
  choice: pour une fille
  rationale: « Fille » forme avec « garçon » une paire naturelle dans cette catégorie d’âge et rend la catégorie féminine singulière du texte.
- source_word: עֲשֶׂרֶת שְׁקָלִים
  choice: dix sicles
  rationale: Traduction directe du nombre et de l’unité, préservant le contraste tarifaire du texte.
theological_decisions:
- issue: Expression des catégories fondées sur le sexe dans un barème cultuel et juridique
  choice: un garçon ... une fille
  alternative: le masculin ... le féminin; un individu de sexe masculin ... un individu de sexe féminin
  rationale: Le contexte d’âge rend « garçon » et « fille » naturels en français moderne. Ces termes conservent les deux catégories singulières du barème sans étendre le propos à une affirmation générale sur la valeur sociale des personnes.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste juridique sans archaïsme; « sicle » conserve la réalité historique. Aucun appel de note n’est nécessaire.
