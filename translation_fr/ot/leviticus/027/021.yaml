source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/שָּׂדֶ֜ה בְּ/צֵאת֣/וֹ בַ/יֹּבֵ֗ל קֹ֛דֶשׁ לַֽ/יהוָ֖ה כִּ/שְׂדֵ֣ה הַ/חֵ֑רֶם לַ/כֹּהֵ֖ן תִּהְיֶ֥ה אֲחֻזָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/021.yaml
  text: But the field[a], when it is released in the Jubilee, shall be holy to Yahweh, like a field devoted to destruction; it shall be the priest’s possession.
translation:
  language: fr
  text: Mais le champ, lorsqu’il sera libéré au jubilé, sera consacré à Yahvé, comme un champ frappé d’interdit[a] ; il sera la propriété du prêtre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un champ voué à l’interdit ». Le terme hébreu désigne quelque chose qui est voué irrévocablement à Yahvé et soustrait à l’usage humain ordinaire ; selon le contexte, il peut aussi impliquer la destruction.
    reason: Conserver l’étendue sémantique de חֵרֶם et signaler une autre traduction possible sans trancher silencieusement.
lexical_decisions:
- source_word: וְהָיָה הַשָּׂדֶה
  choice: Mais… le champ… il sera
  rationale: Le waw poursuit le cas juridique tout en marquant ici le contraste avec la possibilité de rachat évoquée au verset précédent. « Mais » rend naturellement cette articulation.
- source_word: בְּצֵאתוֹ בַיֹּבֵל
  choice: quand, au jubilé, le champ sera libéré
  rationale: Littéralement « lors de sa sortie au jubilé ». Dans ce contexte foncier, la « sortie » désigne la libération du bien au jubilé ; cette formulation française exprime le sens juridique sans reproduire un hébraïsme obscur.
- source_word: קֹדֶשׁ לַיהוָה
  choice: consacré à Yahvé
  rationale: La formule indique que le champ est mis à part comme appartenant à YHWH. « Consacré » est naturel en français et exprime ici la sainteté d’affectation.
- source_word: כִּשְׂדֵה הַחֵרֶם
  choice: comme un champ voué par interdit
  rationale: חֵרֶם désigne ce qui est irrévocablement voué à Dieu et soustrait à l’usage ordinaire. « Voué par interdit » conserve la gravité et la particularité juridique du terme sans imposer que la destruction soit l’unique nuance dans ce passage.
- source_word: לַכֹּהֵן תִּהְיֶה אֲחֻזָּתוֹ
  choice: il sera la propriété du prêtre
  rationale: Le lamed marque l’attribution au prêtre, et אֲחֻזָּה désigne une possession foncière. La formulation française rend directement le nouvel état juridique du champ.
theological_decisions:
- issue: Sens de חֵרֶם dans cette loi de consécration
  choice: champ voué par interdit
  alternative: champ voué à la destruction ; champ frappé d’interdit ; champ voué irrévocablement
  rationale: Le mot peut associer consécration irrévocable, retrait de l’usage humain et, selon le contexte, destruction. Ici, la comparaison porte surtout sur le statut définitif du champ. Le texte principal garde le terme juridique sévère sans réduire son sens à la destruction, et la note explicite l’ambiguïté.
- issue: Rendu du tétragramme יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: « Yahvé » représente le nom divin personnel présent dans le texte hébreu, sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, sobre et juridique. « Jubilé » conserve le terme traditionnel bien établi. La syntaxe reste claire à l’oral comme à l’écrit, tandis que la note explique le terme technique « voué par interdit ».
