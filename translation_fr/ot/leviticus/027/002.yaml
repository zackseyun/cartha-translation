  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם אִ֕ישׁ כִּ֥י יַפְלִ֖א נֶ֑דֶר בְּ/עֶרְכְּ/ךָ֥ נְפָשֹׁ֖ת לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man makes a special vow, involving the valuation of persons to Yahweh,'
translation:
  language: fr
  text: '« Parle aux Israélites et dis-leur : Si un homme prononce un vœu spécial concernant l’estimation de personnes pour Yahweh[a], »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, formulation incertaine : « selon ton estimation de personnes pour Yahweh ». Il s’agit, dans les versets suivants, de personnes auxquelles est attribuée une valeur fixée.'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: Parle aux Israélites
  rationale: « Israélites » rend naturellement en français moderne l’expression collective littérale « fils d’Israël », sans en changer le référent.
- source_word: אִישׁ
  choice: un homme
  rationale: Le masculin singulier de la formulation juridique est conservé, tout en gardant sa portée représentative dans ce contexte légal.
- source_word: יַפְלִא נֶדֶר
  choice: prononce un vœu spécial
  rationale: Le hifil de פלא marque ici le caractère particulier ou exceptionnel du vœu; « prononcer un vœu » est une tournure française naturelle.
- source_word: בְּעֶרְכְּךָ נְפָשֹׁת
  choice: concernant des personnes estimées
  rationale: La construction hébraïque est difficile. Le contexte des versets suivants indique une estimation tarifée de personnes; cette formulation transmet ce sens sans attribuer artificiellement l’évaluation à celui qui fait le vœu.
- source_word: נְפָשֹׁת
  choice: personnes
  rationale: Dans ce cadre juridique, le terme désigne des êtres humains, et non des « âmes » au sens immatériel.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition exprime la destination ou la consécration du vœu, tandis que le nom divin est rendu directement par « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte explicitement le tétragramme; sa translittération préserve le nom d’alliance sans le remplacer par un titre.
- issue: Portée du masculin juridique אִישׁ
  choice: un homme
  alternative: quelqu’un / une personne
  rationale: Le genre grammatical de la formulation source est maintenu sans nier sa possible portée juridique représentative.
- issue: Rapport entre le vœu et l’estimation des personnes
  choice: un vœu spécial concernant des personnes estimées
  alternative: un vœu spécial selon ton estimation des personnes
  rationale: La syntaxe de בְּעֶרְכְּךָ est obscure. Le choix principal s’appuie sur les évaluations prescrites dans la suite du chapitre, tout en signalant l’autre lecture en note.
translation_notes:
  register: Français international moderne, digne et lisible. La formule « Israélites » évite le calque peu naturel « fils d’Israël ». La virgule finale est conservée puisque le verset introduit la prescription développée au verset suivant.
