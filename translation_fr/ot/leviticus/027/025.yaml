  yaml_path: translation/ot/leviticus/027/025.yaml
  text: And every valuation of yours shall be by the sanctuary shekel[a]; the shekel shall be twenty gerahs.
translation:
  language: fr
  text: Toute estimation que tu feras sera établie selon le sicle du sanctuaire[a] ; le sicle sera de vingt guéras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « selon le sicle sacré ». L’hébreu désigne le sicle étalon utilisé pour les estimations liées au sanctuaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: estimation que tu feras
  rationale: Dans Lévitique 27, עֵרֶךְ désigne la valeur officiellement fixée dans le cadre des vœux et des consécrations. Cette formulation conserve le suffixe de deuxième personne tout en étant plus naturelle en français que « ton estimation ».
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: selon le sicle du sanctuaire
  rationale: La préposition indique ici la norme de référence, et l’expression désigne le sicle étalon employé pour les évaluations liées au sanctuaire.
- source_word: גֵּרָה
  choice: guéras
  rationale: La guéra est une petite unité de poids sans équivalent français direct ; sa translittération traditionnelle permet de préserver la mesure ancienne.
- source_word: עֶשְׂרִים גֵּרָה יִהְיֶה הַשָּׁקֶל
  choice: le sicle vaudra vingt guéras
  rationale: Cette tournure française exprime clairement la définition métrologique donnée par l’hébreu, sans convertir la mesure.
- source_word: וְכָל
  choice: Toute
  rationale: 'Le quantificateur a une valeur distributive : chacune des estimations doit suivre cette norme. La conjonction n’a pas besoin d’être rendue séparément en français dans ce verset autonome.'
- source_word: יִהְיֶה
  choice: sera établie / vaudra
  rationale: L’imparfait hébreu a ici une portée prescriptive dans un texte légal. Le futur français conserve cette force, avec un verbe adapté à chacun des deux contextes.
theological_decisions: []
