  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Yahweh[a] parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le Seigneur ».'
    reason: Signaler la forme hébraïque du nom divin et sa traduction traditionnelle.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר dans cette formule narrative désigne une prise de parole. « Parla » est naturel en français et évite la redondance avec l’introduction du discours qui suit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin YHWH. « Yahweh » le restitue comme nom propre plutôt que de lui substituer le titre traditionnel « le Seigneur ».
- source_word: אֶל
  choice: à
  rationale: La préposition introduit ici le destinataire de la parole et se rend naturellement par « à ».
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française usuelle du nom biblique.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Cet infinitif introduit le contenu de la parole. La formule française « en ces termes » en exprime naturellement la fonction, sans le calque lourd « en disant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le Tétragramme comme nom propre. Le conserver sous la forme « Yahweh » distingue le nom divin du titre אֲדֹנָי et maintient l’information explicite de la source.
translation_notes:
  register: Français moderne, clair et digne. La formule « parla à Moïse en ces termes » convient à l’introduction solennelle d’un discours divin tout en restant idiomatique.
