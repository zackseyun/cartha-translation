id: LEV.27.9
reference: Leviticus 27:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֧יבוּ מִמֶּ֛/נָּה קָרְבָּ֖ן לַֽ/יהוָ֑ה כֹּל֩ אֲשֶׁ֨ר יִתֵּ֥ן מִמֶּ֛/נּוּ לַ/יהוָ֖ה יִֽהְיֶה קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/009.yaml
  text: And if it is an animal from which they present an offering to Yahweh[a], everything that one gives from it to Yahweh shall be holy.
translation:
  language: fr
  text: Et s’il s’agit d’un animal dont on présente une offrande à Yahweh[a], tout ce qu’on en donnera à Yahweh sera saint.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dont on peut présenter une offrande à Yahweh ». La formulation hébraïque peut désigner soit un animal dont une offrande est effectivement présentée, soit un animal apte à être présenté en offrande.'
    reason: ambiguïté syntaxique et lexicale
lexical_decisions:
- source_word: וְאִם
  choice: Et s’il s’agit de
  rationale: Introduit une nouvelle condition dans la suite des prescriptions. Cette tournure conserve la valeur connective de וְ tout en étant naturelle en français juridique courant.
- source_word: בְּהֵמָה
  choice: un animal
  rationale: Terme générique désignant ici un animal dans un contexte sacrificiel. « Animal » est clair, moderne et suffisamment large.
- source_word: אֲשֶׁר יַקְרִיבוּ מִמֶּנָּה קָרְבָּן לַיהוָה
  choice: dont on présente une offrande à Yahweh
  rationale: Le hiphil de קרב exprime couramment l’action d’approcher ou de présenter dans le culte sacrificiel, tandis que מִמֶּנָּה indique que l’offrande provient de l’animal. Le pronom indéfini « on » rend naturellement le sujet pluriel non précisé.
- source_word: קָרְבָּן
  choice: offrande
  rationale: Équivalent français usuel et compréhensible du terme sacrificiel, sans la coloration archaïque d’« oblation ».
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », conformément à sa fonction de nom divin dans le texte hébreu.
- source_word: כֹּל אֲשֶׁר יִתֵּן מִמֶּנּוּ
  choice: tout ce qu’on en donnera
  rationale: Le singulier hébreu a une valeur générale et indéfinie. « On » évite d’introduire un référent masculin particulier, et « en » reprend naturellement l’animal.
- source_word: יִהְיֶה קֹדֶשׁ
  choice: sera saint
  rationale: Exprime le statut de consécration cultuelle. « Saint » conserve le registre théologique du terme קֹדֶשׁ et s’accorde avec le pronom neutre de sens « tout ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme. La translittération « Yahweh » préserve son caractère de nom propre d’alliance sans le remplacer par un titre.
- issue: Portée de la proposition relative sur l’animal
  choice: un animal dont on présente effectivement une offrande
  alternative: un animal apte à servir d’offrande
  rationale: La syntaxe hébraïque permet de comprendre soit une présentation effective, soit l’appartenance à une catégorie d’animaux pouvant être présentés. Le texte principal garde la lecture la plus directe, et la note conserve l’autre possibilité sans trancher la tension.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le caractère juridique de la prescription sans archaïsmes, tout en maintenant le vocabulaire cultuel et théologique du texte.
