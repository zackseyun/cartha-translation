source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יַקְדִּ֨שׁ אֶת בֵּית֥/וֹ קֹ֨דֶשׁ֙ לַֽ/יהוָ֔ה וְ/הֶעֱרִיכ/וֹ֙ הַ/כֹּהֵ֔ן בֵּ֥ין ט֖וֹב וּ/בֵ֣ין רָ֑ע כַּ/אֲשֶׁ֨ר יַעֲרִ֥יךְ אֹת֛/וֹ הַ/כֹּהֵ֖ן כֵּ֥ן יָקֽוּם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/014.yaml
  text: And if a man consecrates his house as holy to Yahweh[a], then the priest shall assess it, whether good or bad; as the priest assesses it[b], so it shall stand.
translation:
  language: fr
  text: Si un homme consacre sa maison à Yahweh comme bien sacré, le prêtre en estimera la valeur, qu’elle soit de bonne ou de mauvaise qualité[a]. Selon l’estimation que le prêtre en fera[b], elle sera maintenue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « entre bon et mauvais » ; il s’agit de l’état ou de la qualité de la maison pris en compte dans son estimation.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « l’évaluera ». Le même verbe hébreu est répété pour désigner l’estimation officielle faite par le prêtre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Si un homme
  rationale: La construction introduit un cas juridique hypothétique. « Si un homme » conserve le singulier masculin de אִישׁ tout en étant naturel en français.
- source_word: יַקְדִּשׁ
  choice: consacre
  rationale: Le hifil de קדשׁ signifie ici mettre un bien à part en lui conférant un statut sacré. « Consacrer » convient au contexte cultuel et juridique.
- source_word: בֵּיתוֹ
  choice: sa maison
  rationale: Dans ce contexte d’estimation d’un bien, בַּיִת désigne la maison en tant que propriété plutôt que le foyer au sens affectif.
- source_word: קֹדֶשׁ לַיהוָה
  choice: à Yahweh comme chose sainte
  rationale: Cette formulation exprime explicitement que la maison est mise à part pour Yahweh, tout en gardant la valeur nominale de קֹדֶשׁ.
- source_word: וְהֶעֱרִיכוֹ / יַעֲרִיךְ
  choice: en estimera la valeur / l’estimera
  rationale: Dans Lévitique 27, ערך désigne l’établissement officiel d’une valeur par le prêtre. « Estimer la valeur » est clair et idiomatique en français moderne.
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: qu’elle soit de bonne ou de mauvaise qualité
  rationale: L’expression oppose les deux extrêmes de l’état ou de la qualité du bien à prendre en compte dans l’estimation.
- source_word: כֵּן יָקוּם
  choice: telle sera sa valeur
  rationale: קום indique ici que l’estimation du prêtre demeure établie et fait autorité. La formulation française explicite le référent implicite sans modifier la portée juridique.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », ce qui préserve sa fonction de nom divin dans le texte source.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » conserve le nom propre plutôt que de le remplacer par un titre.
- issue: Caractère contraignant de l’estimation sacerdotale
  choice: telle sera sa valeur
  alternative: ainsi en sera-t-il
  rationale: Le contexte immédiat porte sur l’estimation d’une maison consacrée. La traduction indique que la valeur fixée par le prêtre est celle qui demeure en vigueur, sans attribuer au prêtre un pouvoir plus large que celui exprimé par le verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le style juridique du cas hypothétique est conservé, ainsi que la répétition du verbe d’estimation. Les marqueurs de notes sont placés sur les expressions qu’ils expliquent.
