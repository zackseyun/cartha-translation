  text: וְ/כָל מַעְשַׂ֤ר בָּקָר֙ וָ/צֹ֔אן כֹּ֥ל אֲשֶׁר יַעֲבֹ֖ר תַּ֣חַת הַ/שָּׁ֑בֶט הָֽ/עֲשִׂירִ֕י יִֽהְיֶה קֹּ֖דֶשׁ לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/032.yaml
  text: And every tithe of the herd and the flock[a], every tenth animal that passes under the rod[b], shall be holy to Yahweh.
translation:
  language: fr
  text: Toute dîme de gros ou de petit bétail, toute dixième bête qui passera sous le bâton, sera consacrée à Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל מַעְשַׂר
  choice: Toute dîme
  rationale: « Dîme » rend le terme juridique désignant le dixième mis à part; « toute » conserve la portée générale de la règle.
- source_word: בָּקָר וָצֹאן
  choice: de gros ou de petit bétail
  rationale: בקר désigne ici collectivement les bovins, tandis que צאן englobe le petit bétail, notamment les moutons et les chèvres. Cette paire française est précise et naturelle.
- source_word: כֹּל אֲשֶׁר יַעֲבֹר תַּחַת הַשָּׁבֶט
  choice: toute … qui passera sous la houlette
  rationale: La tournure distributive vise les bêtes passant une à une sous le bâton du berger afin d’être comptées. Le futur français convient au caractère prescriptif de la disposition.
- source_word: הָעֲשִׂירִי
  choice: dixième bête
  rationale: L’hébreu dit littéralement « la dixième »; « bête » explicite sobrement le référent implicite sans ajouter de contenu.
- source_word: יִהְיֶה קֹּדֶשׁ
  choice: sera consacrée
  rationale: Dans ce contexte juridique, la formule indique qu’une bête appartient désormais au domaine sacré. « Consacrée » exprime naturellement cette mise à part, tout en conservant sa portée cultuelle.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition marque l’appartenance ou la destination de la bête consacrée, et le nom divin est transcrit « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le tétragramme; la transcription « Yahweh » préserve le nom propre d’alliance sans le remplacer par un titre.
- issue: Rendu de קֹדֶשׁ dans la formule juridique
  choice: sera consacrée à Yahweh
  alternative: sera sainte pour Yahweh
  rationale: « Consacrée » indique clairement pour le lecteur moderne la mise à part et l’appartenance cultuelle de la bête. L’idée de sainteté n’est pas réduite à une qualité morale.
- issue: Explicitation du référent de הָעֲשִׂירִי
  choice: dixième bête
  alternative: la dixième
  rationale: Le féminin français exige un référent intelligible; le contexte immédiat montre sans ambiguïté qu’il s’agit de chaque dixième animal compté.
translation_notes:
  register: Français international moderne, digne et accessible. « Gros ou petit bétail » conserve la distinction des deux catégories animales; « houlette » maintient l’image pastorale, expliquée en note. « C’est-à-dire » rend explicite la relation d’apposition entre la dîme et chaque dixième bête.
