review_pass:
  verdict: revise
  source_fidelity: 'Le sens de base est bien rendu : la dîme concerne le gros et le petit bétail, et chaque dixième bête passant sous le bâton est vouée à Yahweh. Toutefois, « c’est-à-dire » présente comme une simple reformulation ce qui est plutôt une précision appositionnelle dans l''hébreu, et « houlette » désigne plus spécifiquement un bâton de berger recourbé, nuance non imposée par שֵׁבֶט.'
  naturalness: Le français est globalement naturel et digne. « Bâton » est plus neutre, international et exact dans ce contexte que « houlette ». La juxtaposition par virgule reflète mieux la structure juridique de la phrase.
  terminology: « Dîme », « gros ou petit bétail », « consacrée » et « Yahweh » conviennent. « Consacrée à Yahweh » rend adéquatement la mise à part cultuelle exprimée par קֹדֶשׁ לַיהוה.
  issues:
  - severity: low
    issue: « c’est-à-dire » interprète trop fortement le lien entre les deux segments.
    rationale: L'hébreu enchaîne « toute dîme de gros et de petit bétail » et « tout ce qui passe sous le bâton, le dixième ». Il précise le mode de détermination de la dîme, sans employer une formule explicative équivalente à « c’est-à-dire ».
  - severity: low
    issue: « houlette » est plus spécifique que le terme hébreu.
    rationale: שֵׁבֶט signifie ici un bâton/une verge utilisée pour faire passer et compter les animaux. « Bâton » conserve l'image sans introduire la forme particulière de la houlette.
  revised_text: Toute dîme de gros ou de petit bétail, toute dixième bête qui passera sous le bâton, sera consacrée à Yahweh.
  revised_footnotes:
  - marker: a
    text: Ou « verge ». Les bêtes passaient une à une sous le bâton afin d’être comptées ; chaque dixième était mise à part.
    reason: cultural_note
  revision_rationale: La révision remplace une explicitation interprétative par une apposition fidèle à la syntaxe et emploie « bâton », terme plus général pour שֵׁבֶט. La note conserve l'explication culturelle et l'alternative lexicale. L'ancre est maintenue sur « bâton ».
