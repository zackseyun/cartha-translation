revisions:
- from: Toute dîme de gros ou de petit bétail, c’est-à-dire toute dixième bête qui passera sous la houlette[a], sera consacrée à Yahweh.
  to: Toute dîme de gros ou de petit bétail, toute dixième bête qui passera sous le bâton, sera consacrée à Yahweh.
  rationale: La révision remplace une explicitation interprétative par une apposition fidèle à la syntaxe et emploie « bâton », terme plus général pour שֵׁבֶט. La note conserve l'explication culturelle et l'alternative lexicale. L'ancre est maintenue sur « bâton ».
