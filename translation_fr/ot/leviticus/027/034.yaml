id: LEV.27.34
reference: Leviticus 27:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֵ֣לֶּה הַ/מִּצְוֺ֗ת אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֖ר סִינָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/034.yaml
  text: These are the commandments that Yahweh commanded Moses for the sons of Israel at Mount Sinai[a].
translation:
  language: fr
  text: Voici les commandements que Yahweh donna à Moïse pour les fils d’Israël[a], sur le mont Sinaï.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux fils d’Israël »; l’expression peut aussi se rendre naturellement par « aux Israélites ».
    reason: La préposition אֶל peut ici être comprise comme indiquant les destinataires directs (« aux ») ou ceux pour qui les commandements sont confiés à Moïse (« pour »).
lexical_decisions:
- source_word: אֵלֶּה הַמִּצְוֺת
  choice: Voici les commandements
  rationale: « Voici » introduit naturellement en français la formule récapitulative finale, tandis que « commandements » conserve la force juridique de מִצְוֹת.
- source_word: אֲשֶׁר צִוָּה
  choice: que … donna
  rationale: Avec « commandements » comme complément, « donna » exprime en français courant l’acte de prescrire sans la lourdeur de « les commandements que … commanda », tout en conservant le sens de צִוָּה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin יהוה; sa translittération préserve le nom propre plutôt que de lui substituer un titre.
- source_word: אֶת מֹשֶׁה
  choice: à Moïse
  rationale: Même si אֶת marque formellement l’objet direct de צִוָּה, la tournure française idiomatique avec « donner des commandements » exige « à Moïse ».
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: pour les fils d’Israël
  rationale: « Pour » indique que les commandements confiés à Moïse sont destinés à Israël. « Fils d’Israël » conserve la forme masculine et la désignation collective de l’hébreu; la note signale les autres lectures possibles de אֶל.
- source_word: בְּהַר סִינָי
  choice: sur le mont Sinaï
  rationale: « Sur le mont Sinaï » est la formulation française naturelle pour la localisation exprimée par בְּ dans cette expression.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte hébreu emploie le Tétragramme comme nom propre. « Yahweh » le représente directement sans remplacer le nom par un titre.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites; le peuple d’Israël
  rationale: La traduction conserve la forme masculine plurielle de l’expression hébraïque, qui fonctionne ici comme désignation collective du peuple et ne limite pas nécessairement les destinataires aux hommes.
- issue: Relation exprimée par אֶל après צִוָּה
  choice: pour
  alternative: à
  rationale: La construction peut désigner soit les destinataires auxquels Moïse doit communiquer les commandements, soit ceux au bénéfice desquels ils lui sont confiés. Le texte retient « pour » et la note préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation évite le calque pesant « les commandements que Yahweh commanda » tout en maintenant le caractère juridique et conclusif du verset. Le nom propre « Yahweh » et l’expression « fils d’Israël » sont conservés.
