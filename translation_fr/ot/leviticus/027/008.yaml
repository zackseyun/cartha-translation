base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/008.yaml
  text: But if he is too poor for your valuation[a], then he shall be made to stand before the priest, and the priest shall assess him[b]; the priest shall assess him according to what the one making the vow can afford.
translation:
  language: fr
  text: Mais s’il est trop pauvre pour s’acquitter de la valeur que tu as fixée[a], on le présentera au prêtre, et le prêtre l’évaluera. Le prêtre l’évaluera selon les moyens de celui qui a fait le vœu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque peut se rendre plus littéralement par « s’il est trop pauvre par rapport à ta valeur fixée » ; elle signifie ici que la personne n’a pas les moyens de s’acquitter de cette somme.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « selon ce que peut atteindre la main de celui qui a fait le vœu », expression hébraïque qui désigne ses moyens financiers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָךְ ... מֵעֶרְכֶּךָ
  choice: trop pauvre pour payer le montant que tu as fixé
  rationale: מָךְ désigne une personne de condition modeste ou appauvrie. Avec מֵעֶרְכֶּךָ, le contexte indique qu’elle n’a pas les moyens de verser la valeur prescrite. Cette formulation rend clairement ce rapport tout en conservant la deuxième personne du suffixe hébreu.
- source_word: וְהֶעֱמִידוֹ לִפְנֵי הַכֹּהֵן
  choice: on le fera se tenir devant le prêtre
  rationale: Le hifil de עמד signifie littéralement « faire tenir debout ». Le pronom indéfini « on » évite d’attribuer à un acteur précis l’action dont le sujet n’est pas exprimé dans l’hébreu.
- source_word: וְהֶעֱרִיךְ אֹתוֹ ... יַעֲרִיכֶנּוּ
  choice: le prêtre l’évaluera ... fixera sa valeur
  rationale: Dans Lévitique 27, ערך est le terme technique employé pour déterminer la valeur monétaire liée à un vœu. La variation française évite une répétition pesante tout en maintenant le même acte juridique.
- source_word: עַל פִּי אֲשֶׁר תַּשִּׂיג יַד הַנֹּדֵר
  choice: en fonction des moyens de celui qui a fait le vœu
  rationale: L’expression « ce que la main atteint » est un idiome hébreu désignant les ressources ou la capacité financière. « En fonction des moyens » en transmet naturellement le sens en français.
- source_word: הַנֹּדֵר
  choice: celui qui a fait le vœu
  rationale: Le participe désigne l’auteur du vœu. Cette expression est courante et plus immédiatement compréhensible qu’un terme technique comme « vouant ».
