  text: אַךְ בְּכ֞וֹר אֲשֶׁר יְבֻכַּ֤ר לַֽ/יהוָה֙ בִּ/בְהֵמָ֔ה לֹֽא יַקְדִּ֥ישׁ אִ֖ישׁ אֹת֑/וֹ אִם שׁ֣וֹר אִם שֶׂ֔ה לַֽ/יהוָ֖ה הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/026.yaml
  text: However[a], a firstborn among the livestock, which as a firstborn belongs to Yahweh, no man may consecrate; whether an ox or a sheep[b], it belongs to Yahweh.
translation:
  language: fr
  text: Toutefois, personne ne consacrera un premier-né parmi le bétail qui appartient à Yahweh en tant que premier-né. Qu’il s’agisse d’un bovin ou d’un animal du petit bétail[a], il appartient à Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut désigner un mouton ou une chèvre.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Toutefois
  rationale: Introduit une restriction aux règles précédentes et rend naturellement la valeur adversative ou exceptive du terme.
- source_word: בְּכוֹר
  choice: le premier-né
  rationale: Désigne ici le premier-né d’un animal domestique, sans recourir à un terme français archaïque.
- source_word: אֲשֶׁר יְבֻכַּר לַיהוָה בִּבְהֵמָה
  choice: d’un animal qui, en tant que premier-né, appartient à Yahweh
  rationale: Le passif de בכר exprime ici le statut de premier-né. La formulation française explicite que ce statut fonde l’appartenance à Yahweh, sans présenter la primogéniture comme un acte humain.
- source_word: לֹא יַקְדִּישׁ אִישׁ אֹתוֹ
  choice: personne ne consacrera
  rationale: Le hiphil de קדש a le sens cultuel de consacrer ou vouer. « Personne » rend naturellement en français la portée générique de אִישׁ.
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: Que ce soit un bovin ou une bête du petit bétail
  rationale: La construction signifie « que ce soit… ou… ». « Bovin » couvre ici שׁוֹר, tandis que « bête du petit bétail » conserve l’étendue de שֶׂה, qui peut désigner un mouton ou une chèvre.
- source_word: לַיהוָה הוּא
  choice: il appartient à Yahweh
  rationale: Rend clairement la relation d’appartenance ou le droit de Yahweh exprimé par la construction avec ל.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel au lieu de le remplacer par un titre.
theological_decisions:
- issue: Pourquoi le premier-né ne peut pas être consacré par un vœu
  choice: Il ne peut pas faire l’objet d’une nouvelle consécration, puisqu’il appartient déjà à Yahweh en raison de son statut de premier-né.
  alternative: Son statut de premier-né constitue en lui-même une consécration, sans insister sur l’idée d’appartenance juridique.
  rationale: La proposition finale, « il appartient à Yahweh », présente explicitement le droit préalable de Yahweh et explique l’interdiction.
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve le vocabulaire cultuel de la consécration, emploie « personne » pour la valeur générique de אִישׁ et évite de réduire שֶׂה au seul mouton.
