  to: Toutefois, personne ne consacrera un premier-né parmi le bétail qui appartient à Yahweh en tant que premier-né. Qu’il s’agisse d’un bovin ou d’un animal du petit bétail[a], il appartient à Yahweh.
  rationale: 'La révision corrige l’ambiguïté syntaxique sans modifier le sens : le premier-né concerné appartient déjà à Yahweh du fait de son statut. Elle maintient le vocabulaire de consécration, la portée générique de « personne », la distinction bovin/petit bétail et l’ambiguïté lexicale de שׂה signalée en note.'
