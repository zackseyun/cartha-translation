    issue: Antécédent ambigu de la relative dans « le premier-né d’un animal qui, en tant que premier-né, appartient à Yahweh »
    rationale: La relative semble qualifier « animal », alors que l’hébreu qualifie le premier-né. « Un premier-né parmi le bétail qui appartient à Yahweh en tant que premier-né » restitue plus clairement la portée de אשר יבכר ליהוה בבהמה.
  revised_text: Toutefois, personne ne consacrera un premier-né parmi le bétail qui appartient à Yahweh en tant que premier-né. Qu’il s’agisse d’un bovin ou d’un animal du petit bétail[a], il appartient à Yahweh.
