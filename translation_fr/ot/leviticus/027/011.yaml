  text: וְ/אִם֙ כָּל בְּהֵמָ֣ה טְמֵאָ֔ה אֲ֠שֶׁר לֹא יַקְרִ֧יבוּ מִמֶּ֛/נָּה קָרְבָּ֖ן לַֽ/יהוָ֑ה וְ/הֶֽעֱמִ֥יד אֶת הַ/בְּהֵמָ֖ה לִ/פְנֵ֥י הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/011.yaml
  text: But if it is any unclean animal from which they may not present an offering to Yahweh[a], then he shall set the animal before the priest,
translation:
  language: fr
  text: Mais si c’est un animal impur dont on ne peut présenter une offrande à Yahweh, il placera l’animal devant le prêtre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Mais s’il s’agit de
  rationale: Introduit un nouveau cas conditionnel en contraste avec celui des animaux offerts en sacrifice; cette tournure est naturelle dans un texte juridique français.
- source_word: כָּל בְּהֵמָה טְמֵאָה
  choice: un animal impur
  rationale: כָּל devant un nom singulier a ici une valeur indéfinie. « Impur » exprime le statut rituel de טָמֵא, non une saleté physique.
- source_word: אֲשֶׁר לֹא יַקְרִיבוּ מִמֶּנָּה קָרְבָּן
  choice: dont on ne peut pas présenter une offrande
  rationale: Le pronom « on » rend la troisième personne du pluriel à valeur générale et impersonnelle. « Dont » conserve le rapport exprimé par מִמֶּנָּה, tandis que « présenter une offrande » garde la nuance cultuelle de הקריב et קָרְבָּן.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Transcrit le nom divin יהוה conformément à la couche de consultation mise à jour et préserve sa fonction de nom propre.
- source_word: וְהֶעֱמִיד
  choice: on placera
  rationale: Le hifil de עמד signifie faire tenir ou mettre en position. « Placer » convient naturellement à la présentation de l’animal au prêtre; le futur français exprime l’instruction légale.
- source_word: לִפְנֵי הַכֹּהֵן
  choice: devant le prêtre
  rationale: Rendu direct et idiomatique, qui conserve le cadre formel de l’évaluation sacerdotale annoncée au verset suivant.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme comme nom propre. « Yahweh » le distingue d’un titre et suit la décision théologique fournie.
- issue: Nature de l’impureté de l’animal
  choice: impur
  alternative: malpropre
  rationale: Dans ce contexte sacrificiel, טְמֵאָה désigne une inaptitude rituelle à servir d’offrande, et non un défaut d’hygiène.
translation_notes:
  register: Français international moderne, clair et digne. La formulation impersonnelle « on » restitue sans lourdeur le pluriel général de l’hébreu. Le futur a valeur prescriptive, courante dans la langue juridique française.
