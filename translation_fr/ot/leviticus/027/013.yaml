source:
  edition: WLC
  text: וְ/אִם גָּאֹ֖ל יִגְאָלֶ֑/נָּה וְ/יָסַ֥ף חֲמִישִׁת֖/וֹ עַל עֶרְכֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/013.yaml
  text: But if he does redeem it[a], then he shall add a fifth to your valuation.
translation:
  language: fr
  text: Mais s’il la rachète[a], il ajoutera un cinquième à la valeur que tu as estimée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « la rachète bel et bien ». L’hébreu associe un infinitif absolu à un verbe conjugué pour renforcer l’idée verbale.'
    reason: La note préserve l’emphase de la construction hébraïque sans alourdir le français du texte principal.
lexical_decisions:
- source_word: וְאִם
  choice: Mais s’il
  rationale: La conjonction introduit ici une condition en contraste avec le cas énoncé au verset précédent. « Mais s’il » rend naturellement cet enchaînement.
- source_word: גָּאֹל יִגְאָלֶנָּה
  choice: la rachète
  rationale: Le verbe גאל désigne ici le rachat du bien consacré. Le pronom féminin renvoie à la bête impure mentionnée auparavant. La construction emphatique est signalée en note, car une traduction appuyée dans le corps du texte serait moins naturelle en français.
- source_word: וְיָסַף
  choice: il ajoutera
  rationale: Dans cette disposition juridique, la forme verbale exprime la conséquence obligatoire de la condition. Le futur français convient au style normatif du passage.
- source_word: חֲמִישִׁתוֹ
  choice: un cinquième
  rationale: Le terme indique une majoration d’un cinquième. Dans ce contexte, il s’agit d’ajouter le cinquième correspondant à la valeur estimée.
- source_word: עַל עֶרְכֶּךָ
  choice: à ton estimation
  rationale: עַל marque ici l’ajout à la somme évaluée, et le suffixe de deuxième personne du singulier est conservé par « ton », l’adresse visant le responsable de l’estimation.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne, avec une formulation juridique naturelle. Le féminin « la » maintient le renvoi à la bête impure du contexte précédent, et le tutoiement conserve l’adresse singulière de l’hébreu.
