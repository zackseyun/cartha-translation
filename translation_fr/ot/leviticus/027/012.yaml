    rationale: La formule כֵּן יִהְיֶה signifie littéralement « ainsi il en sera ». Elle implique que l’évaluation fixée fait autorité dans ce cadre, mais « définitive » ajoute une nuance d’irrévocabilité qui n’est pas explicitement formulée.
  - severity: low
    issue: Note littérale insuffisamment précise sur la construction hébraïque
    rationale: La note doit signaler que le texte massorétique porte formellement « ton évaluation », suivi de « le prêtre », sans présenter trop catégoriquement une résolution syntaxique disputée.
