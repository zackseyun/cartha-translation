  text: and the priest shall assess it[a], whether good or bad; as the priest assesses it, so it shall be.
translation:
  language: fr
  text: Le prêtre l’évaluera, qu’il soit de bonne ou de mauvaise qualité. Telle sera l’évaluation du prêtre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Selon ton évaluation, le prêtre, ainsi il en sera. » Le texte porte formellement « ton évaluation » ; dans le contexte, il s’agit vraisemblablement de l’évaluation du prêtre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱרִיךְ
  choice: estimera sa valeur
  rationale: Le hifil de ערך désigne ici l’action de fixer la valeur d’un animal voué. Cette formulation est claire en français moderne et convient au contexte juridique.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Traduction usuelle de כֹּהֵן; l’article défini hébreu est conservé.
- source_word: אֹתָהּ
  choice: sa valeur
  rationale: Le pronom féminin singulier renvoie à la bête mentionnée au verset précédent. Le français reprend naturellement ce référent dans la locution « estimer sa valeur ».
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: selon qu’il est de bonne ou de mauvaise qualité
  rationale: Cette formulation idiomatique exprime l’évaluation de l’animal d’après sa qualité, tout en conservant les deux pôles « bon » et « mauvais » du texte hébreu.
- source_word: כְּעֶרְכְּךָ הַכֹּהֵן
  choice: La valeur fixée par le prêtre
  rationale: Le texte massorétique comporte littéralement un suffixe de deuxième personne (« selon ton estimation »), suivi de « le prêtre ». Le contexte indique que l’estimation officielle du prêtre est visée; une note préserve l’irrégularité de la formulation hébraïque.
- source_word: כֵּן יִהְיֶה
  choice: sera définitive
  rationale: Dans cette disposition juridique, la formule établit que l’estimation du prêtre fait autorité. « Sera définitive » communique naturellement cette force contraignante.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible, avec une formulation juridique claire. Le masculin « il » reprend « l’animal » du verset précédent. La note conserve l’étrangeté grammaticale et l’ambiguïté formelle du texte hébreu.
