  text: וְ/הֶעֱרִ֤יךְ הַ/כֹּהֵן֙ אֹתָ֔/הּ בֵּ֥ין ט֖וֹב וּ/בֵ֣ין רָ֑ע כְּ/עֶרְכְּ/ךָ֥ הַ/כֹּהֵ֖ן כֵּ֥ן יִהְיֶֽה׃
base_translation:
