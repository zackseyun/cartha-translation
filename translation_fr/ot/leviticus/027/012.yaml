revisions:
- from: Le prêtre estimera sa valeur, selon qu’il est de bonne ou de mauvaise qualité. La valeur fixée par le prêtre sera définitive.[a]
  to: Le prêtre l’évaluera, qu’il soit de bonne ou de mauvaise qualité. Telle sera l’évaluation du prêtre.[a]
  rationale: La révision maintient le sens de l’évaluation sacerdotale obligatoire, tout en évitant d’ajouter l’idée explicite d’une décision « définitive ». Elle rend la structure conclusive du texte par « Telle sera » et préserve dans la note l’irrégularité ou l’ambiguïté formelle de la construction massorétique.
  reviewer_model: gpt-5.6-terra
