  text: וְ/הֵבִ֤יא אֹתָ/ם֙ אֶל הַ/כֹּהֵ֔ן וְ/הִקְרִ֛יב אֶת אֲשֶׁ֥ר לַ/חַטָּ֖את רִאשׁוֹנָ֑ה וּ/מָלַ֧ק אֶת רֹאשׁ֛/וֹ מִ/מּ֥וּל עָרְפּ֖/וֹ וְ/לֹ֥א יַבְדִּֽיל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/008.yaml
  text: And he shall bring them to the priest[a], and he shall present first the one for the sin offering, and he shall pinch off its head from the front of its neck[c][b], but he shall not sever it.
translation:
  language: fr
  text: Il apportera les deux oiseaux au prêtre, et celui-ci présentera d’abord celui qui est destiné au sacrifice pour le péché[a]. Il lui tordra la tête[b] au niveau de la nuque, mais sans la détacher[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut aussi être rendu par « sacrifice de purification » dans les lois sacrificielles du Lévitique.
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu désigne le geste rituel appliqué à un oiseau; il est aussi traduit par « pincer » ou « rompre ». La localisation, littéralement par rapport à la nuque, est difficile.
    reason: lexical_alternative
  - marker: c
    text: La tête ne devait pas être entièrement séparée du corps.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵבִיא אֹתָם אֶל הַכֹּהֵן
  choice: Il apportera les deux oiseaux au prêtre
  rationale: Le pronom pluriel renvoie aux deux oiseaux mentionnés au verset précédent. La répétition explicite de « les deux oiseaux » rend le référent immédiatement clair en français.
- source_word: וְהִקְרִיב
  choice: et celui-ci présentera
  rationale: Dans le contexte sacrificiel, le hiphil de קרב désigne la présentation rituelle de l’offrande. « Celui-ci » indique naturellement que le prêtre accomplit désormais le rite, sans ajouter de qualification absente de l’hébreu.
- source_word: אֶת אֲשֶׁר לַחַטָּאת רִאשׁוֹנָה
  choice: d’abord celui qui est destiné au sacrifice pour le péché
  rationale: Cette formulation conserve à la fois l’ordre prescrit par רִאשׁוֹנָה et la destination cultuelle de l’un des deux oiseaux.
- source_word: חַטָּאת
  choice: sacrifice pour le péché
  rationale: חַטָּאת désigne ici l’offrande sacrificielle liée au péché et à la purification. La traduction principale reste accessible, tandis qu’une note conserve l’autre analyse lexicale possible.
- source_word: וּמָלַק
  choice: Il lui pincera la tête
  rationale: מלק est un verbe technique propre au traitement rituel d’un oiseau. « Pincer » évoque l’action manuelle sans suggérer, à tort, une décapitation complète.
- source_word: מִמּוּל עָרְפּוֹ
  choice: du côté de la nuque
  rationale: עֹרֶף désigne la nuque ou l’arrière du cou, tandis que מִמּוּל situe l’action en face de cette zone ou de son côté. La formulation française garde cette difficulté spatiale sans imposer la lecture moins sûre « devant le cou ».
- source_word: וְלֹא יַבְדִּיל
  choice: mais sans la détacher
  rationale: Le verbe בדל signifie séparer. Ici, l’interdiction précise que la tête ne doit pas être entièrement séparée du corps.
theological_decisions:
- issue: Sens cultuel de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Les deux désignations rendent des aspects réels du terme dans le Lévitique. Le texte principal emploie la formulation française la plus transparente sans exclure l’accent rituel sur la purification, signalé en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe distingue naturellement la personne qui apporte les oiseaux du prêtre qui accomplit le geste rituel. Le vocabulaire reste concret, tandis que les notes préservent les difficultés lexicales et rituelles de l’hébreu.
