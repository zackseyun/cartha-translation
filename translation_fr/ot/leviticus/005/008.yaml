revisions:
- from: Il apportera les deux oiseaux au prêtre, et celui-ci présentera d’abord celui qui est destiné au sacrifice pour le péché[a]. Il lui pincera la tête du côté de la nuque[b], mais sans la détacher[c].
  to: Il apportera les deux oiseaux au prêtre, et celui-ci présentera d’abord celui qui est destiné au sacrifice pour le péché[a]. Il lui tordra la tête[b] au niveau de la nuque, mais sans la détacher[c].
  rationale: La révision remplace une orientation latérale non établie par « au niveau de la nuque », qui reste lisible tout en préservant la difficulté de la locution hébraïque. Elle adopte « tordra la tête », expression française plus naturelle pour le geste rituel, et précise la note correspondante. Le sens selon lequel la tête ne doit pas être complètement séparée est conservé.
