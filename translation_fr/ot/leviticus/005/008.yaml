    issue: Formulation française peu naturelle pour מלק
    rationale: « Pincer la tête » ne décrit pas naturellement en français l’action rituelle sur le cou/la tête de l’oiseau. « Tordre la tête » rend mieux le verbe technique tout en étant encadré par l’interdiction de la détacher.
  - severity: low
