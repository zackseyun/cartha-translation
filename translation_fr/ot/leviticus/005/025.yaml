reference: Leviticus 5:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶת אֲשָׁמ֥/וֹ יָבִ֖יא לַ/יהוָ֑ה אַ֣יִל תָּמִ֧ים מִן הַ/צֹּ֛אן בְּ/עֶרְכְּ/ךָ֥ לְ/אָשָׁ֖ם אֶל הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/025.yaml
  text: 'And he shall bring his guilt offering to Yahweh: a flawless ram from the flock[a], according to your valuation, as a guilt offering[b], to the priest.'
translation:
  language: fr
  text: 'Il apportera à Yahweh son sacrifice de réparation[a] : un bélier sans défaut pris dans le petit bétail, d’après ton estimation, comme sacrifice de réparation, au prêtre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut désigner la culpabilité, la réparation due ou le sacrifice offert en réparation.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשָׁמוֹ
  choice: son sacrifice de réparation
  rationale: Dans ce contexte sacrificiel, אָשָׁם désigne vraisemblablement l’offrande apportée en réparation d’une faute. Cette formulation française conserve à la fois la dimension cultuelle et la dimension réparatrice du terme.
- source_word: יָבִיא
  choice: il apportera
  rationale: L’imparfait hiphil a ici une valeur prescriptive. Le futur français exprime naturellement cette instruction juridique.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », conformément à sa présence explicite dans le texte hébreu.
- source_word: אַיִל תָּמִים
  choice: un bélier sans défaut
  rationale: « Bélier » rend précisément אַיִל, et « sans défaut » exprime clairement l’intégrité requise de l’animal destiné au sacrifice.
- source_word: מִן הַצֹּאן
  choice: pris dans le petit bétail
  rationale: צֹאן désigne collectivement le petit bétail, principalement les moutons et les chèvres. Le mot אַיִל précise déjà qu’il s’agit ici d’un mouton mâle.
- source_word: בְּעֶרְכְּךָ
  choice: d’après ton estimation
  rationale: La traduction conserve le suffixe de deuxième personne du singulier et le sens juridique d’évaluation.
- source_word: לְאָשָׁם
  choice: comme sacrifice de réparation
  rationale: La préposition לְ marque ici la destination ou la fonction du bélier, tandis que אָשָׁם désigne la catégorie sacrificielle.
- source_word: אֶל הַכֹּהֵן
  choice: au prêtre
  rationale: Cette expression indique que l’animal doit être présenté au prêtre officiant.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le nom divin; sa translittération préserve le caractère personnel du nom sans le remplacer par un titre.
- issue: Double emploi de אָשָׁם
  choice: sacrifice de réparation aux deux occurrences
  alternative: offrande de culpabilité / réparation à la première occurrence
  rationale: Dans cette prescription sacrificielle, les deux emplois renvoient au même rite, tout en gardant l’arrière-plan de culpabilité et de réparation. Une note signale cette amplitude sémantique plutôt que d’imposer artificiellement deux référents distincts.
translation_notes:
  register: Français international moderne, clair et digne. Le futur conserve la tonalité prescriptive du droit rituel; « petit bétail » maintient la précision du vocabulaire pastoral biblique.
