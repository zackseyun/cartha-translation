revisions:
- from: Il fera du second oiseau un holocauste, selon la règle prescrite[a]. Le prêtre accomplira ainsi le rite d’expiation pour lui, à cause du péché qu’il a commis, et il lui sera pardonné[b].
  to: Il offrira le second oiseau en holocauste, selon la règle prescrite[a]. Le prêtre fera l’expiation pour lui, pour le péché qu’il a commis, et il lui sera pardonné[b].
  rationale: 'La révision conserve les référents et le registre sacrificiel du projet tout en resserrant la formulation sur l’hébreu : l’oiseau est offert en holocauste, le prêtre « fait l’expiation » pour l’offrant, et le pardon demeure formulé au passif sans agent explicite. Les deux ancres de notes sont préservées et correspondent au texte révisé.'
