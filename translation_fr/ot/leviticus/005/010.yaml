  text: וְ/אֶת הַ/שֵּׁנִ֛י יַעֲשֶׂ֥ה עֹלָ֖ה כַּ/מִּשְׁפָּ֑ט וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן מֵ/חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א וְ/נִסְלַ֥ח לֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/010.yaml
  text: And he shall prepare the second as a burnt offering according to the ordinance[a], and the priest shall make atonement for him for the sin that he committed[b], and he shall be forgiven.
translation:
  language: fr
  text: Il offrira le second oiseau en holocauste, selon la règle prescrite[a]. Le prêtre fera l’expiation pour lui, pour le péché qu’il a commis, et il lui sera pardonné[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « selon la procédure prescrite ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie une formule passive qui laisse implicite celui qui accorde le pardon.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֵּׁנִי
  choice: le second oiseau
  rationale: L’adjectif ordinal renvoie au second des deux oiseaux mentionnés dans le contexte précédent. L’ajout explicatif « oiseau » rend le référent naturel en français sans modifier le sens.
- source_word: יַעֲשֶׂה עֹלָה
  choice: fera … un holocauste
  rationale: La tournure française « faire de [l’oiseau] un holocauste » suit de près la construction hébraïque tout en exprimant clairement l’action sacrificielle.
- source_word: עֹלָה
  choice: holocauste
  rationale: Terme français traditionnel et précis pour l’offrande entièrement brûlée désignée par עֹלָה dans le Lévitique.
- source_word: כַּמִּשְׁפָּט
  choice: selon la règle prescrite
  rationale: מִשְׁפָּט désigne ici la norme ou procédure cultuelle établie. Cette formulation est claire et conserve l’idée d’une prescription réglementaire.
- source_word: וְכִפֶּר עָלָיו
  choice: accomplira ainsi le rite d’expiation pour lui
  rationale: Cette expression conserve la catégorie sacrificielle de כפר et indique que le prêtre agit en faveur de la personne, sans réduire le terme à la seule purification ni préciser un mécanisme doctrinal.
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: à cause du péché qu’il a commis
  rationale: La préposition מִן exprime ici le rapport entre l’expiation et la faute concernée. « À cause de » est idiomatique et évite le calque obscur « de son péché qu’il a péché ».
- source_word: וְנִסְלַח לוֹ
  choice: et il lui sera pardonné
  rationale: La formulation impersonnelle passive est naturelle en français et maintient l’agent divin implicite, comme dans l’hébreu.
theological_decisions:
- issue: Rendre le langage sacerdotal de l’expiation sans lui imposer une définition doctrinale ultérieure
  choice: accomplira ainsi le rite d’expiation pour lui
  alternative: le purifiera / obtiendra son pardon
  rationale: Le verbe כפר appartient au vocabulaire sacrificiel standard. « Accomplir le rite d’expiation » préserve sa portée cultuelle sans le limiter à la purification ni confondre l’action sacerdotale avec l’acte de pardonner.
- issue: Préserver la formule passive du pardon
  choice: il lui sera pardonné
  alternative: le SEIGNEUR lui pardonnera
  rationale: L’hébreu laisse volontairement l’auteur du pardon implicite. La formulation retenue conserve cette réserve théologique et grammaticale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement formelle pour convenir au contexte rituel. « Holocauste » est conservé comme terme sacrificiel biblique établi; la note sur la procédure éclaire כַּמִּשְׁפָּט sans alourdir le texte.
