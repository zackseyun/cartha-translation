lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol de דבר introduit un nouvel acte de parole dans le récit. « Parla » convient à la formule récurrente de communication divine et garde un registre digne sans archaïsme.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu comme un nom propre plutôt que remplacé par le titre « le Seigneur ». « Yahvé » est la forme francisée courante du nom divin.
- source_word: אֶל
  choice: à
  rationale: La préposition introduit ici le destinataire de la parole ; « à » est son équivalent français naturel.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française établie du nom hébreu משה.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: 'L’infinitif construit introduit le contenu du discours qui suit. « En ces termes : » rend naturellement cette fonction en français tout en maintenant le lien avec la citation du verset suivant.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le tétragramme. Le rendre par un nom propre préserve cette donnée du texte, tandis que « le Seigneur » substituerait un titre au nom.
translation_notes:
  register: 'Français moderne, sobre et digne. La formule « en ces termes : » évite le calque peu naturel « disant » et prépare explicitement la parole directe du verset suivant.'
