reference: Leviticus 5:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָה֮ כִּֽי יֶחֱטָ֣א וְ/אָשֵׁם֒ וְ/הֵשִׁ֨יב אֶת הַ/גְּזֵלָ֜ה אֲשֶׁ֣ר גָּזָ֗ל א֤וֹ אֶת הָ/עֹ֨שֶׁק֙ אֲשֶׁ֣ר עָשָׁ֔ק א֚וֹ אֶת הַ/פִּקָּד֔וֹן אֲשֶׁ֥ר הָפְקַ֖ד אִתּ֑/וֹ א֥וֹ אֶת הָ/אֲבֵדָ֖ה אֲשֶׁ֥ר מָצָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/023.yaml
  text: And it shall be[a], when he sins and becomes guilty, that he shall restore what he took by robbery, or what he extorted, or the deposit that was entrusted to him, or the lost thing that he found[c][b],
translation:
  language: fr
  text: S’il pèche et se rend coupable[a], il restituera ce qu’il a pris par vol, ce qu’il a obtenu par extorsion[b], le dépôt qui lui avait été confié ou l’objet perdu qu’il a trouvé[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Lorsqu’il aura péché et se sera rendu coupable ». La formule juridique hébraïque peut introduire soit une condition (« si »), soit un cas attendu (« lorsque »). Le dernier verbe peut aussi se traduire par « encourt une culpabilité ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ce qu’il a obtenu par oppression » ou « ce qu’il a détourné ». Le terme hébreu peut désigner l’appropriation ou la rétention oppressive ou frauduleuse du bien d’autrui.
    reason: lexical_alternative
  - marker: c
    text: Ou « le bien perdu qu’il a trouvé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: S’il
  rationale: Cette formule juridique introduit le cas envisagé. « S’il » est naturel en français juridique moderne, tandis que la note conserve la possibilité de comprendre « lorsqu’il ».
- source_word: יֶחֱטָא
  choice: pèche
  rationale: Le verbe חטא exprime explicitement le péché; cette traduction en maintient la portée morale et religieuse.
- source_word: וְאָשֵׁם
  choice: se rend coupable
  rationale: Le verbe indique ici l’état de culpabilité ou la responsabilité encourue, sans imposer l’idée plus étroite d’une simple prise de conscience subjective.
- source_word: וְהֵשִׁיב
  choice: il restituera
  rationale: Dans ce contexte légal, « restituer » exprime précisément la remise du bien à son propriétaire et le futur porte clairement la force de l’obligation.
- source_word: הַגְּזֵלָה אֲשֶׁר גָּזָל
  choice: ce qu’il a pris par vol
  rationale: Cette formulation naturelle rend le couple étymologique hébreu désignant un bien pris illicitement, sans reproduire une répétition maladroite en français.
- source_word: הָעֹשֶׁק אֲשֶׁר עָשָׁק
  choice: ce qu’il a obtenu par extorsion
  rationale: Le couple nominal et verbal peut désigner l’appropriation ou la rétention oppressive du bien d’autrui. « Extorsion » convient au contexte patrimonial, et la note signale l’éventail sémantique.
- source_word: הַפִּקָּדוֹן אֲשֶׁר הָפְקַד אִתּוֹ
  choice: le dépôt qui lui avait été confié
  rationale: Il s’agit d’un bien remis à la garde de quelqu’un. « Dépôt » est précis, et « confié » rend explicitement la relation de confiance.
- source_word: הָאֲבֵדָה אֲשֶׁר מָצָא
  choice: l’objet perdu qu’il a trouvé
  rationale: La formulation suit directement l’hébreu tout en restant idiomatique; « bien perdu » demeure une possibilité plus juridique.
theological_decisions:
- issue: 'Sens de וְאָשֵׁם : culpabilité objective ou prise de conscience de la culpabilité'
  choice: se rend coupable
  alternative: reconnaît sa culpabilité
  rationale: Dans cette formule, le verbe exprime d’abord le fait d’encourir la culpabilité. Traduire par une prise de conscience résoudrait trop étroitement une nuance que le contexte plus large peut seulement laisser entendre.
translation_notes:
  register: Français international moderne, clair et digne, avec une syntaxe de prescription juridique naturelle. Le parallélisme de l’énumération hébraïque est conservé sans répétitions étymologiques artificielles.
