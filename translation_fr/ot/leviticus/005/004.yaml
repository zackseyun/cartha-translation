revisions:
- from: Ou si quelqu’un prononce à la légère un serment, de ses lèvres, pour faire du mal ou du bien — quoi qu’un être humain puisse déclarer par serment — sans en avoir conscience[a], puis qu’il s’en rende compte et se trouve coupable dans l’un de ces cas[b],
  to: Ou si quelqu’un s’engage par serment, en parlant à la légère[a], à faire du mal ou du bien — quoi qu’une personne puisse déclarer par serment —, et que cela lui échappe, puis qu’il en prenne ensuite conscience, il est alors coupable dans l’un de ces cas,
  rationale: 'Révision de la syntaxe et du registre, avec conservation de l’ouverture conditionnelle du verset. Le texte conserve l’ambiguïté du référent de « cela » et ne fait pas de la prise de conscience la cause théologique de la culpabilité. Le marqueur [b] doit toutefois être ancré dans le texte après « cela lui échappe » ; le texte révisé ci-dessus doit donc se lire ainsi : « ... et que cela lui échappe[b], puis qu’il en prenne ensuite conscience ... ».'
