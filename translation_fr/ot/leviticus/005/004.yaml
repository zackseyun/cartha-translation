source:
  edition: WLC
  text: א֣וֹ נֶ֡פֶשׁ כִּ֣י תִשָּׁבַע֩ לְ/בַטֵּ֨א בִ/שְׂפָתַ֜יִם לְ/הָרַ֣ע א֣וֹ לְ/הֵיטִ֗יב לְ֠/כֹל אֲשֶׁ֨ר יְבַטֵּ֧א הָ/אָדָ֛ם בִּ/שְׁבֻעָ֖ה וְ/נֶעְלַ֣ם מִמֶּ֑/נּוּ וְ/הוּא יָדַ֥ע וְ/אָשֵׁ֖ם לְ/אַחַ֥ת מֵ/אֵֽלֶּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/004.yaml
  text: Or if a person swears rashly with his lips to do evil or to do good—whatever a man may utter in an oath—and it is hidden from him[a], and then he comes to know it and becomes guilty in one of these matters[b],
translation:
  language: fr
  text: Ou si quelqu’un s’engage par serment, en parlant à la légère[a], à faire du mal ou du bien — quoi qu’une personne puisse déclarer par serment —, et que cela lui échappe, puis qu’il en prenne ensuite conscience, il est alors coupable dans l’un de ces cas,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut aussi signifier simplement « exprimer » ou « proférer ». Dans ce contexte, elle peut évoquer une parole irréfléchie.
    reason: alternative lexicale
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: quelqu’un
  rationale: Dans cette formulation juridique, le nom désigne un individu, non l’âme comme composante immatérielle. « Quelqu’un » introduit naturellement le cas hypothétique.
- source_word: תִשָּׁבַע
  choice: prononce un serment
  rationale: Le nifal de שׁבע désigne ici l’action de jurer. Cette formulation française est claire et s’accorde bien avec la mention des lèvres.
- source_word: לְבַטֵּא בִשְׂפָתַיִם
  choice: à la légère un serment, de ses lèvres
  rationale: בטא signifie fondamentalement exprimer ou prononcer. Le contexte permet la nuance d’une parole irréfléchie, rendue par « à la légère », tandis que « de ses lèvres » conserve l’image hébraïque.
- source_word: לְהָרַע אוֹ לְהֵיטִיב
  choice: pour faire du mal ou du bien
  rationale: La large opposition entre mal et bien est préservée sans restreindre la nature de l’engagement.
- source_word: לְכֹל אֲשֶׁר יְבַטֵּא הָאָדָם בִּשְׁבֻעָה
  choice: quoi qu’un être humain puisse déclarer par serment
  rationale: La proposition généralise le cas à tout contenu possible d’un serment. « Un être humain » rend le sens générique de הָאָדָם sans suggérer que la règle ne concernerait que les hommes.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: sans en avoir conscience
  rationale: Cette tournure française naturelle exprime le fait que la chose échappe à la connaissance de la personne, tout en évitant l’étrange calque « cela lui est caché ».
- source_word: וְהוּא יָדַע
  choice: puis qu’il s’en rende compte
  rationale: Le contexte indique une prise de conscience postérieure à l’ignorance précédente. Le subjonctif poursuit naturellement la construction casuistique ouverte par « si ».
- source_word: וְאָשֵׁם
  choice: se trouve coupable
  rationale: Le verbe indique l’état de culpabilité ou la responsabilité encourue. « Se trouve coupable » préserve cette valeur sans affirmer que la prise de conscience crée à elle seule la faute.
- source_word: לְאַחַת מֵאֵלֶּה
  choice: dans l’un de ces cas
  rationale: L’expression renvoie aux situations juridiques énumérées dans le contexte immédiat.
theological_decisions:
- issue: Moment et nature de la culpabilité
  choice: « puis qu’il s’en rende compte et se trouve coupable »
  alternative: « puis qu’il s’en rende compte et devienne coupable »
  rationale: L’hébreu associe la prise de conscience et la culpabilité, mais ne tranche pas explicitement la question de savoir si la personne devient coupable à ce moment-là ou reconnaît alors une culpabilité déjà encourue. « Se trouve coupable » conserve mieux cette tension.
- issue: Portée de הָאָדָם dans la formulation juridique
  choice: « un être humain »
  alternative: « un homme »
  rationale: Ici, הָאָדָם est un singulier représentatif désignant n’importe quelle personne. Le français générique « être humain » en préserve la portée universelle sans importer une limitation sexuelle absente du cas juridique.
translation_notes:
  register: Français international moderne, clair et digne, avec une syntaxe juridique naturelle. Le verset reste ouvert, conformément à sa fonction de proposition conditionnelle poursuivie au verset suivant. Les marqueurs [a] et [b] figurent dans le texte.
