  naturalness: « Prononce à la légère un serment, de ses lèvres » est lourd et peu idiomatique. « S’engage par serment, en parlant à la légère » est plus naturel tout en conservant la dimension verbale. La syntaxe conditionnelle est également régularisée.
  terminology: « Quelqu’un » et « une personne » rendent naturellement les désignations génériques נֶפֶשׁ et הָאָדָם dans un français juridique moderne. « Coupable » conserve le registre juridique approprié. Les renvois de notes sont replacés auprès des expressions qu’ils expliquent.
