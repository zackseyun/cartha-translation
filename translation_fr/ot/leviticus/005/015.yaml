  terminology: « Yahweh », « choses saintes », « bélier sans défaut », « petit bétail », « sicles d'argent » et « sicle du sanctuaire » sont appropriés. « Sacrifice de réparation » est un rendu défendable de אָשָׁם dans ce contexte; la note conserve utilement les options traditionnelles.
