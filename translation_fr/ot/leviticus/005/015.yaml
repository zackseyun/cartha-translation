  source_fidelity: 'Le sens fondamental est bien rendu : faute involontaire touchant les choses saintes de Yahweh, bélier sans défaut, évaluation en sicles selon l''étalon sacré, et sacrifice de réparation. Toutefois, « son sacrifice de réparation » rend plus directement אֲשָׁמוֹ (« son sacrifice de réparation / son offrande de réparation ») que l''incise « en sacrifice de réparation ».'
