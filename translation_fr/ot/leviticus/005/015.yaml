source:
  edition: WLC
  text: נֶ֚פֶשׁ כִּֽי תִמְעֹ֣ל מַ֔עַל וְ/חָֽטְאָה֙ בִּ/שְׁגָגָ֔ה מִ/קָּדְשֵׁ֖י יְהוָ֑ה וְ/הֵבִיא֩ אֶת אֲשָׁמ֨/וֹ לַֽ/יהוָ֜ה אַ֧יִל תָּמִ֣ים מִן הַ/צֹּ֗אן בְּ/עֶרְכְּ/ךָ֛ כֶּֽסֶף שְׁקָלִ֥ים בְּ/שֶֽׁקֶל הַ/קֹּ֖דֶשׁ לְ/אָשָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/015.yaml
  text: 'If a person acts unfaithfully and sins unintentionally in regard to the holy things of Yahweh[a], he shall bring his compensation offering to Yahweh: an unblemished ram from the flock, according to your valuation in silver shekels, by the sanctuary shekel[b], for a guilt offering.'
translation:
  language: fr
  text: '« Si quelqu’un commet une infidélité et pèche involontairement à l’égard des choses saintes de Yahweh, il apportera à Yahweh son sacrifice de réparation : un bélier sans défaut pris du petit bétail, selon ton estimation, en sicles d’argent, d’après le sicle du sanctuaire[b], comme sacrifice de réparation[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi traduire « sacrifice de culpabilité » ou « sacrifice pour la faute ». Le terme hébreu אָשָׁם peut désigner aussi bien la responsabilité liée à la faute que le sacrifice qui y apporte réparation.
    reason: lexical_alternative
  - marker: b
    text: Le « sicle du sanctuaire » était l’étalon de poids employé pour les évaluations sacrées.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: quelqu’un
  rationale: Dans cette formulation juridique, le mot désigne une personne quelconque plutôt que l’âme comme composante de l’être humain.
- source_word: תִמְעֹל מַעַל
  choice: commet une infidélité
  rationale: La construction verbe-nom exprime une violation grave d’une obligation sacrée ; cette tournure conserve l’idée de déloyauté sans surtraduire.
- source_word: וְחָטְאָה בִשְׁגָגָה
  choice: et pèche involontairement
  rationale: בִשְׁגָגָה indique une faute commise sans intention, et non une rébellion délibérée.
- source_word: מִקָּדְשֵׁי יְהוָה
  choice: à l’égard des choses saintes de Yahweh
  rationale: La formulation garde la portée assez large de קָדְשֵׁי et ne réduit pas arbitrairement l’expression à une catégorie précise de biens ou de redevances sacrés.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אֲשָׁמוֹ / לְאָשָׁם
  choice: sacrifice de réparation
  rationale: אָשָׁם peut désigner à la fois la responsabilité encourue et le sacrifice qui y remédie. Ici, le contexte de biens sacrés et d’évaluation monétaire met particulièrement en relief la réparation.
- source_word: אַיִל תָּמִים מִן הַצֹּאן
  choice: un bélier sans défaut pris du petit bétail
  rationale: תָּמִים signifie sans défaut dans le contexte sacrificiel, et צֹאן désigne collectivement le petit bétail.
- source_word: בְּעֶרְכְּךָ כֶּסֶף שְׁקָלִים
  choice: d’une valeur en sicles d’argent fixée par toi
  rationale: Cette formulation française naturelle conserve l’évaluation exprimée à la deuxième personne du singulier et n’ajoute aucun nombre absent du texte massorétique.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: selon le sicle du sanctuaire
  rationale: L’expression désigne l’étalon de poids employé pour les évaluations sacrées.
theological_decisions:
- issue: Sens du terme sacrificiel אָשָׁם
  choice: sacrifice de réparation
  alternative: sacrifice de culpabilité ; sacrifice pour la faute
  rationale: Le contexte associe l’offense aux choses saintes, à une évaluation en argent et, dans la suite, à une restitution. « Réparation » rend cette dimension sans nier la culpabilité, tandis que la note conserve les autres traductions défendables.
- issue: Sujet singulier de la règle juridique
  choice: quelqu’un … il apportera
  alternative: la personne … apportera ; quiconque … devra apporter
  rationale: Le singulier représentatif de l’hébreu est maintenu, sans limiter la règle aux hommes.
- issue: Portée de מִקָּדְשֵׁי יְהוָה
  choice: à l’égard des choses saintes de Yahweh
  alternative: contre les biens consacrés à Yahweh ; en prenant sur les choses saintes de Yahweh
  rationale: La préposition et l’expression permettent plusieurs nuances. La traduction retenue préserve leur généralité au lieu de préciser sans nécessité le mécanisme exact de l’offense.
translation_notes:
  register: Français international moderne, clair et digne, avec une syntaxe juridique au singulier. « Petit bétail » conserve la catégorie pastorale ancienne ; « sicle » maintient l’unité de poids historique. Le point-virgule distingue l’énoncé final qui classe explicitement le sacrifice.
