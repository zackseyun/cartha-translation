id: LEV.5.18
reference: Leviticus 5:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ֠/הֵבִיא אַ֣יִל תָּמִ֧ים מִן הַ/צֹּ֛אן בְּ/עֶרְכְּ/ךָ֥ לְ/אָשָׁ֖ם אֶל הַ/כֹּהֵ֑ן וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן עַ֣ל שִׁגְגָת֧/וֹ אֲשֶׁר שָׁגָ֛ג וְ/ה֥וּא לֹֽא יָדַ֖ע וְ/נִסְלַ֥ח לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/018.yaml
  text: He shall bring to the priest a ram without blemish from the flock[a], according to your valuation, for a guilt offering; and the priest shall make atonement for him concerning the error that he committed unintentionally, though he did not know it[b], and he shall be forgiven.
translation:
  language: fr
  text: Il amènera au prêtre un bélier sans défaut pris du petit bétail, selon ton estimation, comme sacrifice de réparation[a]. Le prêtre fera l’expiation pour lui au sujet de la faute qu’il a commise par inadvertance, sans le savoir[b], et il lui sera pardonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme sacrifice de culpabilité ». L’hébreu אָשָׁם désigne une catégorie sacrificielle particulière, associée à la culpabilité et à la réparation.
    reason: lexical_alternative
  - marker: b
    text: Ou « au sujet de son péché involontaire ». L’hébreu souligne qu’il s’agit d’une faute commise par inadvertance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Il amènera
  rationale: Dans cette prescription juridique, la forme verbale exprime l’action requise. « Il amènera » conserve le style normatif tout en restant naturel en français.
- source_word: אַיִל תָּמִים
  choice: un bélier sans défaut
  rationale: אַיִל désigne précisément un bélier, et תָּמִים, dans le contexte sacrificiel, indique l’absence de défaut physique.
- source_word: מִן הַצֹּאן
  choice: pris du petit bétail
  rationale: צֹאן est un terme collectif désignant principalement les ovins et les caprins. Puisque l’animal est déjà précisé comme un bélier, « petit bétail » rend fidèlement la catégorie générale.
- source_word: בְּעֶרְכְּךָ
  choice: selon ton estimation
  rationale: La formulation conserve la deuxième personne du texte hébreu et l’idée d’une valeur officiellement estimée, sans préciser un évaluateur que le verset ne nomme pas explicitement.
- source_word: לְאָשָׁם
  choice: comme sacrifice de réparation
  rationale: אָשָׁם désigne ici une catégorie sacrificielle particulière. « Sacrifice de réparation » met en valeur sa fonction réparatrice et demeure compréhensible, tandis que « sacrifice de culpabilité » reste une traduction possible.
- source_word: וְכִפֶּר עָלָיו
  choice: Le prêtre accomplira pour lui le rite d’expiation
  rationale: Cette formulation rend l’action cultuelle de כפר et la relation exprimée par עָלָיו, tout en évitant de réduire le terme à une seule théorie de l’expiation.
- source_word: עַל שִׁגְגָתוֹ אֲשֶׁר שָׁגָג
  choice: au sujet de la faute qu’il a commise par inadvertance
  rationale: La traduction maintient le lien entre le nom שְׁגָגָה et le verbe apparenté שָׁגַג, tous deux soulignant le caractère involontaire de la faute.
- source_word: וְהוּא לֹא יָדַע
  choice: sans le savoir
  rationale: Cette expression française naturelle restitue l’absence de connaissance qui caractérise la faute comme involontaire.
- source_word: וְנִסְלַח לוֹ
  choice: et il lui sera pardonné
  rationale: Le passif préserve la formulation discrète du texte hébreu quant à l’agent du pardon et rend clairement le résultat du rite.
theological_decisions:
- issue: Traduction de la catégorie sacrificielle אָשָׁם
  choice: sacrifice de réparation
  alternative: sacrifice de culpabilité
  rationale: Le terme nomme une offrande précise du système lévitique. « Réparation » fait ressortir sa dimension compensatoire sans nier son rapport à la culpabilité; la variante est signalée afin de préserver l’étendue du terme.
- issue: Traduction de כפר
  choice: accomplir pour lui le rite d’expiation
  alternative: faire l’expiation pour lui
  rationale: Le texte décrit l’action sacerdotale conduisant au pardon. La formulation retenue garde le poids cultuel et théologique du verbe sans imposer une explication doctrinale particulière de son mécanisme.
- issue: Agent du pardon dans וְנִסְלַח לוֹ
  choice: 'forme passive : « il lui sera pardonné »'
  alternative: Dieu lui pardonnera
  rationale: L’hébreu ne nomme pas explicitement l’agent. Le passif français conserve cette retenue plutôt que d’expliciter ce que le verset laisse implicite.
translation_notes:
  register: Français international moderne, clair et digne. Le style prescriptif de la loi lévitique est conservé, avec un vocabulaire cultuel accessible. La répétition sémantique de l’hébreu autour de l’erreur involontaire est rendue sans lourdeur excessive.
