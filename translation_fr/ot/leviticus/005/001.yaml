id: LEV.5.1
reference: Leviticus 5:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נֶ֣פֶשׁ כִּֽי תֶחֱטָ֗א וְ/שָֽׁמְעָה֙ ק֣וֹל אָלָ֔ה וְ/ה֣וּא עֵ֔ד א֥וֹ רָאָ֖ה א֣וֹ יָדָ֑ע אִם ל֥וֹא יַגִּ֖יד וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/001.yaml
  text: If a person sins[a] because he hears a public adjuration and he is a witness—whether he has seen or otherwise knows—and he does not report it[b], then he shall bear his guilt.
translation:
  language: fr
  text: Si quelqu’un pèche et entend une adjuration publique[a], et qu’il est témoin d’un fait — qu’il l’ait vu ou qu’il en ait connaissance —, s’il ne le déclare pas, il portera sa faute[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « a entendu la voix d’une imprécation » ou « d’un serment » ; il s’agit ici d’une formule solennelle appelant les témoins à se faire connaître.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « portera son iniquité » ; l’expression indique qu’il demeure responsable de la faute commise en retenant son témoignage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: quelqu’un
  rationale: Dans cette formulation juridique, נֶפֶשׁ désigne une personne. « Quelqu’un » est naturel en français moderne et n’introduit pas le sens métaphysique que pourrait suggérer « une âme ».
- source_word: תֶחֱטָא
  choice: pèche
  rationale: Le verbe חטא présente ici un manquement coupable. « Pèche » conserve à la fois sa portée morale et juridique.
- source_word: וְשָׁמְעָה קוֹל אָלָה
  choice: a entendu une adjuration publique
  rationale: L’expression désigne, dans ce contexte légal, l’audition d’une formule solennelle appelant les témoins à se faire connaître. « Adjuration publique » communique cette fonction sans réduire אָלָה à un simple serment personnel.
- source_word: וְהוּא עֵד
  choice: il est témoin d’un fait
  rationale: Cette formulation exprime clairement le statut de témoin de la personne concernée. « D’un fait » fournit en français le complément implicite sans préciser indûment une procédure judiciaire.
- source_word: אוֹ רָאָה אוֹ יָדָע
  choice: qu’il l’ait vu ou qu’il en ait connaissance
  rationale: Les deux verbes couvrent la connaissance acquise par la vue ou d’une autre manière. La formulation française préserve cette distinction.
- source_word: אִם לֹא יַגִּיד
  choice: s’il ne le déclare pas
  rationale: Le hiphil de נגד signifie faire connaître ou déclarer. « Le déclare » convient au cadre légal tout en restant plus large que « témoigne ».
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: il portera sa faute
  rationale: La traduction conserve l’image hébraïque de porter sa faute et laisse subsister son association avec la culpabilité et ses conséquences.
theological_decisions:
- issue: Lien entre l’audition de l’adjuration et le péché
  choice: « pèche alors qu’il a entendu »
  alternative: « pèche parce qu’il entend » ou « pèche en entendant »
  rationale: Le texte enchaîne les propositions par וְ sans affirmer que le simple fait d’entendre constitue le péché. « Alors qu’il a entendu » rattache la faute au refus ultérieur de déclarer ce que la personne sait, sans transformer explicitement la coordination en causalité.
- issue: Représentation du genre dans la loi casuistique
  choice: Employer « quelqu’un » puis le masculin singulier de référence
  alternative: Employer « une personne » puis le féminin singulier
  rationale: Le cas vise toute personne, sans restriction de sexe. En français, « quelqu’un » suivi du masculin singulier permet une formulation juridique naturelle sans pluraliser le singulier hébreu ni tirer une conclusion théologique du genre grammatical.
- issue: Portée de « porter sa faute »
  choice: Conserver l’expression sans la réduire à la peine seule
  alternative: « subira le châtiment de sa faute »
  rationale: L’idiome peut englober la culpabilité et ses conséquences. La traduction littéraire « portera sa faute » préserve cette densité et évite de résoudre l’expression en une notion uniquement pénale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la forme conditionnelle du cas juridique, tandis que les tirets rendent lisible l’incise précisant les deux modes de connaissance. Les termes « adjuration », « témoin », « déclarer » et « faute » maintiennent le registre cultuel et légal sans archaïsme excessif.
