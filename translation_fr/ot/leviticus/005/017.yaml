language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם נֶ֨פֶשׁ֙ כִּ֣י תֶֽחֱטָ֔א וְ/עָֽשְׂתָ֗ה אַחַת֙ מִ/כָּל מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/לֹֽא יָדַ֥ע וְ/אָשֵׁ֖ם וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/017.yaml
  text: And if a person sins and does any one of all the things that by Yahweh’s commandments must not be done[a], though he did not know it[b], then he is guilty and shall bear his iniquity.
translation:
  language: fr
  text: Si quelqu’un pèche et fait l’une des choses que les commandements de Yahweh interdisent, sans le savoir, il est coupable et portera sa faute.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « portera sa faute ». L’expression hébraïque peut désigner le fait d’assumer la culpabilité ou les conséquences de la faute.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: quelqu’un
  rationale: Dans cette disposition juridique, נֶפֶשׁ désigne une personne individuelle. « Quelqu’un » est naturel en français moderne et évite le contresens possible de « une âme ».
- source_word: תֶחֱטָא
  choice: pèche
  rationale: Le verbe חטא désigne ici le fait de commettre un péché ou une infraction; « pèche » conserve directement le vocabulaire moral et cultuel du texte.
- source_word: וְעָשְׂתָה אַחַת מִכָּל מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: en faisant l’une des choses que les commandements de Yahweh interdisent
  rationale: Cette formulation rend le sens distributif de אַחַת מִכָּל et la force prohibitive de אֲשֶׁר לֹא תֵעָשֶׂינָה, sans reproduire une syntaxe hébraïque lourde en français.
- source_word: וְלֹא יָדַע
  choice: même sans le savoir
  rationale: La formule exprime l’ignorance de l’infraction. « Même sans le savoir » rend clairement le contraste entre ignorance et culpabilité.
- source_word: וְאָשֵׁם
  choice: il est coupable
  rationale: אָשֵׁם indique ici l’état de culpabilité ou l’obligation encourue après l’acte; « il est coupable » reste concis et laisse ouverte la nuance de responsabilité juridique.
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: portera la responsabilité de sa faute
  rationale: L’expression idiomatique נשׂא עון évoque le fait d’assumer la faute, sa charge ou ses conséquences. Cette traduction française garde l’image de la charge avec « portera » tout en rendant explicitement sa portée juridique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » conserve le nom propre d’alliance plutôt que de le remplacer par un titre.
- issue: Culpabilité malgré l’ignorance
  choice: même sans le savoir, il est coupable
  alternative: sans s’en rendre compte, il devient passible de culpabilité
  rationale: Le texte affirme conjointement l’ignorance et la culpabilité; la traduction préserve cette tension sans expliquer ni atténuer la responsabilité.
- issue: Sens de נשׂא עון
  choice: portera la responsabilité de sa faute
  alternative: portera sa faute
  rationale: L’idiome peut viser la charge de la faute, la culpabilité encourue ou ses conséquences. Le texte principal privilégie un français intelligible, tandis que la note conserve l’éventail sémantique.
translation_notes:
  register: 'Français international moderne, clair et digne. La phrase juridique a été allégée sans supprimer la séquence essentielle : infraction, ignorance, culpabilité et responsabilité. Le masculin singulier « il » reprend naturellement le pronom indéfini « quelqu’un ».'
