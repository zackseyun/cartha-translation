revisions:
- from: Si quelqu’un pèche en faisant l’une des choses que les commandements de Yahweh interdisent, même sans le savoir, il est coupable et portera la responsabilité de sa faute.[a]
  to: Si quelqu’un pèche et fait l’une des choses que les commandements de Yahweh interdisent, sans le savoir, il est coupable et portera sa faute.[a]
  rationale: La révision remplace l’explicitation interprétative « la responsabilité de sa faute » par le rendu direct « sa faute », qui préserve l’image et l’amplitude sémantique de l’idiome hébreu. Elle allège aussi « même sans le savoir » en « sans le savoir » pour rester au plus près de la coordination source. Le reste du texte est conservé.
