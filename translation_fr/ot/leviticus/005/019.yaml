reference: Leviticus 5:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָשָׁ֖ם ה֑וּא אָשֹׁ֥ם אָשַׁ֖ם לַ/יהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/019.yaml
  text: It is a guilt offering[a]; he has indeed incurred guilt against Yahweh.
translation:
  language: fr
  text: C’est un sacrifice de réparation[a] ; il s’est bel et bien rendu coupable envers Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « C’est un sacrifice de réparation ; il est assurément coupable envers Yahvé. » En hébreu, le nom traduit par « sacrifice de réparation » et le verbe « se rendre coupable » viennent de la même racine ; le verbe est en outre répété sous deux formes pour marquer l’insistance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשָׁם
  choice: sacrifice de réparation
  rationale: Dans ce contexte sacrificiel, le nom désigne l’offrande prescrite en cas de culpabilité. « Sacrifice de réparation » est naturel en français et met en valeur la dimension réparatrice de ce sacrifice, sans réduire le terme à la seule culpabilité intérieure.
- source_word: הוּא
  choice: C’est
  rationale: Le pronom a ici une fonction prédicative et identifie le sacrifice. « C’est » rend cette construction avec naturel en français.
- source_word: אָשֹׁם אָשַׁם
  choice: s’est bel et bien rendu coupable
  rationale: L’infinitif absolu suivi du verbe de même racine renforce l’affirmation. « Bel et bien » exprime cette insistance, tandis que « s’est rendu coupable » conserve l’idée d’une culpabilité réellement encourue.
- source_word: לַיהוָה
  choice: envers Yahvé
  rationale: Avec le verbe אָשַׁם, la préposition ל marque ici la culpabilité de la personne par rapport à Yahvé. « Envers » exprime cette relation sans imposer aussi fortement que « contre » l’idée d’une hostilité directe.
- source_word: יהוה
  choice: Yahvé
  rationale: La forme « Yahvé », courante et immédiatement reconnaissable en français, représente explicitement le nom divin plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Rattachement de לַיהוָה dans la proposition finale
  choice: La personne a réellement contracté une culpabilité envers Yahvé.
  alternative: Le sacrifice est un sacrifice de réparation offert à Yahvé.
  rationale: La position de לַיהוָה et l’expression verbale intensive אָשֹׁם אָשַׁם favorisent son rattachement à la culpabilité de la personne. « Envers » préserve toutefois une certaine latitude quant à la nuance exacte de cette relation.
- issue: Lien entre le nom אָשָׁם et le verbe אָשַׁם
  choice: Employer « sacrifice de réparation » puis « se rendre coupable ».
  alternative: Répéter un même radical français, au prix d’une formulation peu naturelle.
  rationale: L’hébreu joue sur une même racine, mais le français ne dispose pas d’un équivalent naturel qui désigne à la fois le sacrifice et l’état de culpabilité. La note signale donc ce lien lexical important.
translation_notes:
  register: Français moderne, clair et digne. « Bel et bien » rend l’emphase hébraïque dans une tournure courante sans alourdir la phrase. Le point-virgule maintient le rapport étroit entre la nature du sacrifice et la culpabilité qui le motive.
