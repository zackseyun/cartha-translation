  text: אֽוֹ מָצָ֧א אֲבֵדָ֛ה וְ/כִ֥חֶשׁ בָּ֖/הּ וְ/נִשְׁבַּ֣ע עַל שָׁ֑קֶר עַל אַחַ֗ת מִ/כֹּ֛ל אֲשֶׁר יַעֲשֶׂ֥ה הָ/אָדָ֖ם לַ/חֲטֹ֥א בָ/הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/022.yaml
  text: or he finds lost property and lies about it and swears falsely—about any one of all the things that a man may do to sin by them—
translation:
  language: fr
  text: ou s’il trouve un objet perdu, ment à son sujet et jure faussement au sujet de l’une quelconque de toutes les choses que l’être humain peut faire pour pécher par elles —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבֵדָה
  choice: un objet perdu
  rationale: Le nom désigne ici un bien égaré ou perdu que quelqu’un trouve; cette formulation est naturelle et précise en français.
- source_word: וְכִחֶשׁ בָּהּ
  choice: ment à son sujet
  rationale: Le verbe peut exprimer le mensonge ou la dénégation; dans ce contexte, il s’agit de nier mensongèrement ce qui concerne l’objet trouvé.
- source_word: וְנִשְׁבַּע עַל־שָׁקֶר
  choice: fait un faux serment
  rationale: Rend directement l’acte de jurer mensongèrement, sans ajouter de précision absente du texte.
- source_word: הָאָדָם
  choice: un être humain
  rationale: Ici, le terme est générique et vise toute personne, non spécifiquement un homme de sexe masculin.
- source_word: לַחֲטֹא בָהֵנָּה
  choice: par lesquels un être humain peut pécher
  rationale: Conserve le lien instrumental ou circonstanciel du préfixe ב tout en produisant une phrase idiomatique en français.
theological_decisions:
- issue: Portée de הָאָדָם
  choice: un être humain
  alternative: un homme
  rationale: La proposition formule une généralité sur les actes humains qui rendent coupable; le français inclusif au sens générique transmet mieux cette portée sans modifier la théologie.
- issue: Rapport syntaxique de la clause finale
  choice: en commettant l’un quelconque de tous les actes par lesquels un être humain peut pécher
  alternative: à propos de l’une quelconque de toutes les choses qu’un homme peut faire pour pécher par elles
  rationale: La formulation choisie préserve la portée récapitulative de עַל אַחַת מִכֹּל tout en évitant un calque français obscur.
translation_notes:
  register: Français moderne, international et digne. Le verset reste syntaxiquement ouvert, avec des tirets, puisqu’il se poursuit dans le verset suivant. Aucun marqueur de note n’est requis.
