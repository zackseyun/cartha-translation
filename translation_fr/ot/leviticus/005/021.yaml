    text: Ou « d’un gage »; le sens exact de l’expression hébraïque est incertain.
    reason: L’expression תְשׂוּמֶת יָד est rare et peut désigner un objet remis à quelqu’un, notamment comme gage.
  revision_rationale: La révision maintient les choix solides du projet et sa syntaxe juridique, tout en évitant de transformer le « vol/spoliation » en simple bien volé et de restreindre l’oppression/exploitation à l’extorsion. L’ambiguïté lexicale de l’expression « bien remis entre ses mains » demeure signalée par la note.
