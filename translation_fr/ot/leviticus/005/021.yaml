  variant: modern international French
source:
  edition: WLC
  text: נֶ֚פֶשׁ כִּ֣י תֶחֱטָ֔א וּ/מָעֲלָ֥ה מַ֖עַל בַּ/יהוָ֑ה וְ/כִחֵ֨שׁ בַּ/עֲמִית֜/וֹ בְּ/פִקָּד֗וֹן אֽוֹ בִ/תְשׂ֤וּמֶת יָד֙ א֣וֹ בְ/גָזֵ֔ל א֖וֹ עָשַׁ֥ק אֶת עֲמִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/021.yaml
  text: If a person sins and commits a breach of faith against Yahweh by deceiving his neighbor about a security entrusted to him[a], or a pledge, or through robbery, or if he has oppressed his neighbor,
translation:
  language: fr
  text: Si quelqu’un pèche et commet une infidélité envers Yahweh en trompant son prochain au sujet d’un dépôt, d’un bien remis entre ses mains[a] ou d’un vol, ou s’il a opprimé son prochain,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’un gage »; le sens exact de l’expression hébraïque est incertain.
    reason: L’expression תְשׂוּמֶת יָד est rare et peut désigner un objet remis à quelqu’un, notamment comme gage.
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: quelqu’un
  rationale: Dans ce texte juridique, le mot désigne une personne, non l’âme comme composante intérieure. « Quelqu’un » introduit naturellement le cas hypothétique en français.
- source_word: כִּי תֶחֱטָא
  choice: Si quelqu’un pèche
  rationale: Ici, כִּי suivi de l’imparfait ouvre une disposition casuistique; « si » convient au style juridique conditionnel.
- source_word: וּמָעֲלָה מַעַל
  choice: et commet une infidélité
  rationale: La construction avec verbe et nom de même racine souligne un acte de déloyauté grave. « Commet une infidélité » garde sa portée relationnelle et religieuse sans recourir à un terme juridique vieilli.
- source_word: בַּיהוָה
  choice: envers Yahweh
  rationale: La préposition présente le tort fait au prochain comme une infidélité dirigée envers Yahweh. Le nom divin est translittéré.
- source_word: וְכִחֵשׁ
  choice: en trompant
  rationale: Le verbe peut signifier nier, mentir ou agir faussement. « Tromper » convient à l’ensemble des affaires patrimoniales énumérées.
- source_word: בַּעֲמִיתוֹ
  choice: son prochain
  rationale: עָמִית désigne un autre membre de la communauté. « Prochain » est clair, digne et conserve la dimension relationnelle du terme.
- source_word: בְּפִקָּדוֹן
  choice: au sujet d’un dépôt
  rationale: Le nom désigne un bien confié à la garde de quelqu’un. « Dépôt » est l’équivalent juridique français le plus direct.
- source_word: בִתְשׂוּמֶת יָד
  choice: d’un bien remis entre ses mains
  rationale: L’expression, littéralement liée à une « mise/remise de main », est rare et incertaine. Cette formulation conserve l’image d’un objet confié tout en restant compréhensible; une autre interprétation est signalée en note.
- source_word: בְגָזֵל
  choice: d’un bien volé
  rationale: Le nom peut désigner le vol commis par force ou le bien ainsi pris. Dans la série des objets au sujet desquels une personne trompe son prochain, « un bien volé » donne une syntaxe française cohérente sans exclure l’acte de spoliation.
- source_word: עָשַׁק אֶת עֲמִיתוֹ
  choice: s’il extorque quelque chose à son prochain
  rationale: Dans ce contexte économique, le verbe évoque le fait d’obtenir ou de retenir injustement le bien d’autrui. « Extorquer quelque chose à » exprime concrètement cette atteinte, l’objet implicite étant explicité en français.
theological_decisions:
- issue: Un tort économique envers le prochain est présenté comme une infidélité envers Dieu
  choice: commet une infidélité envers Yahweh en trompant son prochain
  alternative: agit de manière infidèle à l’égard de Yahweh et trompe son prochain
  rationale: 'La formulation maintient le lien syntaxique et théologique explicite du texte: la fraude envers autrui constitue simultanément une infidélité envers Yahweh.'
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération rend directement le nom propre présent dans le texte hébreu et suit la convention éditoriale fournie.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve la virgule finale parce que la disposition juridique se poursuit au verset suivant. Le masculin grammatical de « son prochain » reprend le sujet indéfini « quelqu’un » sans préciser le sexe de la personne.
