lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר dans cette formule narrative introduit une nouvelle parole divine. « Parla » est naturel et distinct de la formule לֵאמֹר qui suit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre, conformément au texte hébreu, plutôt que remplacé par un titre.
- source_word: אֶל מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל désigne ici le destinataire de la parole; « à Moïse » est l’équivalent français courant.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'Cette formule introduit le contenu du discours qui suit. En français moderne, « en ces termes : » évite le calque lourd « en disant » et signale naturellement la continuation.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin. « Yahweh » en conserve la valeur de nom propre sans substituer un titre traditionnel.
translation_notes:
  register: 'Français moderne, digne et direct. La tournure « en ces termes : » rend idiomatiquement la formule hébraïque d’introduction au discours et prépare la suite au verset suivant.'
