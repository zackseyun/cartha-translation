source:
  edition: WLC
  text: וְ/הָיָ֥ה כִֽי יֶאְשַׁ֖ם לְ/אַחַ֣ת מֵ/אֵ֑לֶּה וְ/הִ֨תְוַדָּ֔ה אֲשֶׁ֥ר חָטָ֖א עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/005.yaml
  text: And it shall be[a], when he becomes guilty in one of these matters[b], that he shall confess what he has sinned in regard to it.
translation:
  language: fr
  text: Quand[a] quelqu’un se sera rendu coupable[b] dans l’un de ces cas, il confessera ce en quoi il a péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « S’il arrive que ». La conjonction hébraïque peut introduire ici soit une circonstance attendue, soit une condition.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « aura encouru une culpabilité ». Le verbe hébreu souligne la culpabilité ou la responsabilité juridique, sans désigner nécessairement la prise de conscience de la faute.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Quand
  rationale: La formule introduit la situation juridique dans laquelle s’applique la prescription. « Quand » rend naturellement la valeur circonstancielle, tandis que la variante conditionnelle est signalée en note.
- source_word: יֶאְשַׁם
  choice: se sera rendu coupable
  rationale: Le verbe אשם exprime ici le fait d’encourir une culpabilité ou une responsabilité juridique, et non nécessairement la prise de conscience intérieure de la faute.
- source_word: לְאַחַת מֵאֵלֶּה
  choice: dans l’un de ces cas
  rationale: L’expression renvoie aux situations énumérées auparavant. « Cas » convient au contexte légal et reste naturel en français.
- source_word: וְהִתְוַדָּה
  choice: il confessera
  rationale: Le hitpael de ידה désigne ici l’aveu de la faute. Le futur français conserve la valeur prescriptive de la formulation légale.
- source_word: אֲשֶׁר חָטָא עָלֶיהָ
  choice: le péché qu’il a commis à ce sujet
  rationale: Cette formulation française explicite naturellement le contenu de la confession tout en conservant, par « à ce sujet », le lien du suffixe féminin avec le cas concerné.
theological_decisions:
- issue: Culpabilité juridique ou prise de conscience subjective
  choice: se sera rendu coupable
  alternative: se rendra compte de sa culpabilité
  rationale: Le texte hébreu affirme l’état de culpabilité ou la responsabilité encourue; il ne mentionne pas explicitement une prise de conscience. La traduction évite donc d’ajouter cet élément psychologique.
translation_notes:
  register: Français moderne, digne et accessible. L’ajout de « quelqu’un » évite le masculin générique pesant tout en gardant la portée générale de la prescription. La cadence juridique est préservée sans reproduire littéralement la formule hébraïque וְהָיָה.
