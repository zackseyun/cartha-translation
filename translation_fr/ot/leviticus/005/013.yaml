  text: וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן עַל חַטָּאת֧/וֹ אֲשֶׁר חָטָ֛א מֵֽ/אַחַ֥ת מֵ/אֵ֖לֶּה וְ/נִסְלַ֣ח ל֑/וֹ וְ/הָיְתָ֥ה לַ/כֹּהֵ֖ן כַּ/מִּנְחָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/013.yaml
  text: Thus the priest shall make atonement for him for his sin that he committed in any one of these matters[a], and he shall be forgiven. And it shall belong to the priest, like the grain offering.
translation:
  language: fr
  text: Ainsi, le prêtre fera l’expiation pour lui, pour le péché qu’il a commis dans l’un de ces cas, et il lui sera pardonné.[a] Elle reviendra au prêtre, comme l’offrande de céréales.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie une forme passive et ne précise pas explicitement qui accorde le pardon.
    reason: ambiguïté théologique et grammaticale
  - marker: b
    text: 'Littéralement : « elle sera au prêtre, comme l’offrande de céréales ». Le sujet féminin est implicite; il renvoie à l’offrande évoquée dans le contexte immédiat.'
    reason: référent implicite et formulation littérale
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו הַכֹּהֵן
  choice: le prêtre fera pour lui le rite d’expiation
  rationale: Dans la législation sacerdotale, כפר désigne l’action rituelle qui procure l’expiation. « Faire pour lui le rite d’expiation » est naturel en français et évite d’imposer une théorie particulière de l’expiation.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: pour le péché qu’il a commis
  rationale: Le relatif associé au verbe חטא indique ici la faute commise plutôt que le sacrifice pour le péché.
- source_word: מֵאַחַת מֵאֵלֶּה
  choice: dans l’un de ces cas
  rationale: La formule renvoie aux situations énumérées auparavant et conserve le sens partitif de l’hébreu.
- source_word: וְנִסְלַח לוֹ
  choice: et il lui sera pardonné
  rationale: Cette tournure conserve le passif hébreu et ne nomme pas explicitement celui qui pardonne.
- source_word: וְהָיְתָה לַכֹּהֵן
  choice: Ce qui reste appartiendra au prêtre
  rationale: Le féminin singulier renvoie vraisemblablement à l’offrande mentionnée au verset précédent. Le contexte précise que la part non brûlée revient au prêtre; « ce qui reste » explicite sobrement ce référent contextuel.
- source_word: כַּמִּנְחָה
  choice: comme dans le cas de l’offrande de céréales
  rationale: מִנְחָה désigne ici l’offrande de céréales. La comparaison porte sur le traitement de la part sacerdotale, d’où cette formulation française naturelle.
theological_decisions:
- issue: Formule de pardon après le rite sacrificiel
  choice: et il lui sera pardonné
  alternative: et son péché lui sera pardonné
  rationale: Le nifal וְנִסְלַח avec לוֹ ne nomme pas explicitement l’auteur du pardon. La formulation retenue préserve ce passif et cette réserve théologique.
- issue: Référent implicite de וְהָיְתָה
  choice: Ce qui reste appartiendra au prêtre
  alternative: Elle appartiendra au prêtre
  rationale: Le sujet féminin est implicite et se rapporte probablement à l’offrande de farine du contexte immédiat. L’explicitation du reste destiné au prêtre rend le sens intelligible sans identifier une portion différente.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire rituel est conservé, tandis que les référents implicites sont clarifiés avec prudence. Tous les marqueurs de note figurent dans le texte.
