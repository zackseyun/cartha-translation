id: LEV.5.6
reference: Leviticus 5:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הֵבִ֣יא אֶת אֲשָׁמ֣/וֹ לַ/יהוָ֡ה עַ֣ל חַטָּאת/וֹ֩ אֲשֶׁ֨ר חָטָ֜א נְקֵבָ֨ה מִן הַ/צֹּ֥אן כִּשְׂבָּ֛ה אֽוֹ שְׂעִירַ֥ת עִזִּ֖ים לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן מֵ/חַטָּאתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/006.yaml
  text: 'and he shall bring his guilt offering to Yahweh for his sin that he has committed: a female from the flock[a], a lamb or a female goat, for a sin offering[b]; and the priest shall make atonement for him for his sin.'
translation:
  language: fr
  text: 'Il apportera à Yahweh son sacrifice de réparation[a] pour le péché qu’il a commis : une femelle du petit bétail, une brebis ou une chèvre, comme sacrifice pour le péché. Le prêtre fera pour lui l’expiation de son péché[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son offrande pour sa culpabilité » ou « son sacrifice de culpabilité ». Le terme hébreu אשם est associé à la culpabilité et à la réparation, tandis que l’animal est ensuite présenté comme un « sacrifice pour le péché ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, la préposition peut évoquer une expiation qui délivre la personne « de son péché » ou l’en éloigne.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Il apportera
  rationale: Dans ce texte législatif, la forme verbale exprime une prescription. Le futur français convient naturellement à ce registre.
- source_word: אֲשָׁמוֹ
  choice: son sacrifice de réparation
  rationale: אשם peut désigner la culpabilité, la réparation ou le sacrifice qui y est associé. « Sacrifice de réparation » est idiomatique en français et maintient la distinction avec חטאת plus loin dans le verset.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La traduction rend explicitement le nom divin יהוה par « Yahweh ».
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: pour le péché qu’il a commis
  rationale: עַל indique ici le motif ou l’occasion du sacrifice; cette formulation française conserve la répétition conceptuelle du péché sans reproduire maladroitement la construction apparentée de l’hébreu.
- source_word: נְקֵבָה מִן הַצֹּאן
  choice: une femelle du petit bétail
  rationale: צאן désigne collectivement les ovins et les caprins. « Petit bétail » est précis dans ce contexte, et « femelle » préserve l’indication explicite du sexe.
- source_word: כִּשְׂבָּה
  choice: une agnelle
  rationale: Le terme désigne une jeune brebis; « agnelle » exprime naturellement en français l’espèce et le sexe.
- source_word: אוֹ שְׂעִירַת עִזִּים
  choice: ou une chèvre
  rationale: La construction désigne une femelle de l’espèce caprine. « Chèvre » porte déjà cette indication en français courant.
- source_word: לְחַטָּאת
  choice: comme sacrifice pour le péché
  rationale: Dans le vocabulaire sacrificiel, חטאת peut désigner le sacrifice lié au péché ou à la purification. Cette traduction garde le terme « péché » et laisse subsister sa juxtaposition avec le sacrifice de réparation.
- source_word: וְכִפֶּר עָלָיו
  choice: Le prêtre fera pour lui l’expiation
  rationale: La formule conserve la portée cultuelle de כפר sans imposer une théorie particulière du mécanisme de l’expiation.
- source_word: מֵחַטָּאתוֹ
  choice: de son péché
  rationale: Après כפר, מן peut marquer le rapport au péché ou suggérer que l’expiation en délivre. La formulation retenue est naturelle tout en signalant en note la nuance littérale.
theological_decisions:
- issue: Juxtaposition de אשם et חטאת dans le même verset
  choice: « sacrifice de réparation » pour אשם et « sacrifice pour le péché » pour חטאת
  alternative: Employer une désignation générique pour אשם, ou rendre חטאת par « sacrifice de purification »
  rationale: Le texte hébreu juxtapose délibérément deux termes sacrificiels. Les distinguer évite d’effacer cette tension lexicale, sans trancher si חטאת doit être compris principalement sous l’angle du péché ou de la purification.
- issue: Valeur de מן dans מֵחַטָּאתוֹ
  choice: « de son péché » dans le texte, avec la nuance « loin de son péché » indiquée en note
  alternative: « à cause de son péché » ou « pour son péché »
  rationale: La construction permet à la fois une relation avec la faute et une nuance d’éloignement ou de délivrance. La traduction ne doit pas transformer cette nuance grammaticale en affirmation doctrinale plus précise.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération française « Yahweh » distingue le nom propre divin du titre « Seigneur ».
translation_notes:
  register: Français international moderne, clair et digne. Le futur conserve la force prescriptive du texte légal. « Petit bétail » fournit la précision pastorale nécessaire, tandis que les termes sacrificiels restent distincts afin de préserver la formulation et la tension de l’hébreu.
