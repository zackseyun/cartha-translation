source:
  edition: WLC
  text: וְ/הִזָּ֞ה מִ/דַּ֤ם הַ/חַטָּאת֙ עַל קִ֣יר הַ/מִּזְבֵּ֔חַ וְ/הַ/נִּשְׁאָ֣ר בַּ/דָּ֔ם יִמָּצֵ֖ה אֶל יְס֣וֹד הַ/מִּזְבֵּ֑חַ חַטָּ֖את הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/009.yaml
  text: And he shall sprinkle some of the blood of the sin offering on the side of the altar[a], and the rest of the blood shall be drained out at the base of the altar; it is a sin offering.
translation:
  language: fr
  text: Il aspergera une partie du sang du sacrifice pour le péché sur le côté de l’autel[a], puis le reste du sang sera exprimé à la base de l’autel. C’est un sacrifice pour le péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification », ici et à la fin du verset. Le terme hébreu חַטָּאת peut désigner le sacrifice offert à cause du péché, en mettant l’accent sur sa fonction purificatrice.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: Il aspergera
  rationale: Le hifil de נזה désigne ici l’application rituelle du sang par aspersion. « Asperger » est naturel en français et convient au contexte sacrificiel.
- source_word: מִדַּם
  choice: une partie du sang
  rationale: 'La préposition מִן a ici un sens partitif : seule une partie du sang est appliquée à ce stade du rite.'
- source_word: הַחַטָּאת
  choice: le sacrifice pour le péché
  rationale: Dans ce contexte, חַטָּאת désigne le sacrifice lié au péché. Cette formulation est claire en français moderne tout en laissant visible, en note, sa fonction purificatrice.
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: sur le côté de l’autel
  rationale: קִיר signifie littéralement « mur » ou « paroi » ; pour un autel, « côté » exprime naturellement la surface visée.
- source_word: וְהַנִּשְׁאָר בַּדָּם
  choice: puis le reste du sang
  rationale: Le participe nifal de שׁאר désigne ce qui demeure. « Le reste du sang » est direct et idiomatique.
- source_word: יִמָּצֶה
  choice: sera pressé
  rationale: Le nifal de מצה évoque l’extraction du sang restant par pression, particulièrement adaptée au traitement d’un oiseau dans le contexte immédiat. « Sera pressé » préserve cette action plus précisément que « sera versé ».
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: contre la base de l’autel
  rationale: יְסוֹד désigne la base ou le soubassement. La préposition אֶל marque ici la direction vers cette partie de l’autel ; avec l’action de presser, « contre » est naturel.
- source_word: חַטָּאת הוּא
  choice: C’est un sacrifice pour le péché
  rationale: La proposition classe explicitement l’offrande dans la catégorie חַטָּאת et reprend la même désignation que précédemment.
theological_decisions:
- issue: Traduction de חַטָּאת dans la législation sacrificielle
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le terme peut mettre en avant le rapport au péché aussi bien que la fonction purificatrice du rite. Le texte principal retient la désignation traditionnelle et intelligible « sacrifice pour le péché », tandis que la note conserve l’autre nuance sans trancher la tension lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur conserve la forme prescriptive de la procédure rituelle. « Asperger », « côté » et « base » donnent une description concrète sans technicité excessive.
