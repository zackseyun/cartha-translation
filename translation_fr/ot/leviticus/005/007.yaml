id: LEV.5.7
reference: Leviticus 5:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם לֹ֨א תַגִּ֣יע יָד/וֹ֮ דֵּ֣י שֶׂה֒ וְ/הֵבִ֨יא אֶת אֲשָׁמ֜/וֹ אֲשֶׁ֣ר חָטָ֗א שְׁתֵּ֥י תֹרִ֛ים אֽוֹ שְׁנֵ֥י בְנֵֽי יוֹנָ֖ה לַֽ/יהוָ֑ה אֶחָ֥ד לְ/חַטָּ֖את וְ/אֶחָ֥ד לְ/עֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/007.yaml
  text: But if his means do not suffice for a sheep[a], then he shall bring as his guilt offering for the sin that he committed two turtledoves or two young pigeons to Yahweh, one for a sin offering and one for a burnt offering.
translation:
  language: fr
  text: 'Mais si ses ressources ne lui permettent pas d’offrir un mouton, il apportera à Yahweh, comme offrande de réparation pour le péché qu’il a commis, deux tourterelles ou deux jeunes pigeons : l’un comme sacrifice pour le péché[a] et l’autre comme holocauste.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sacrifice de purification ». Dans les contextes sacrificiels, le mot hébreu חַטָּאת peut désigner un sacrifice lié au péché ou destiné à la purification.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַגִּיע יָדוֹ דֵּי שֶׂה
  choice: si ses ressources ne lui permettent pas d’offrir un mouton
  rationale: L’expression idiomatique évoque littéralement la main qui n’atteint pas de quoi obtenir un animal. Cette formulation naturelle en français conserve clairement l’idée de moyens financiers insuffisants.
- source_word: אֲשָׁמוֹ
  choice: comme offrande de réparation
  rationale: Dans ce contexte sacrificiel, אָשָׁם désigne l’offrande apportée en lien avec une faute. « Offrande de réparation » exprime sa fonction cultuelle sans réduire le mot au seul sentiment de culpabilité.
- source_word: אֲשֶׁר חָטָא
  choice: pour le péché qu’il a commis
  rationale: Cette tournure française explicite naturellement l’objet implicite du verbe hébreu et rattache l’offrande à la faute commise.
- source_word: שְׁתֵּי תֹרִים
  choice: deux tourterelles
  rationale: « Tourterelles » est l’équivalent zoologique et sacrificiel usuel de תֹרִים.
- source_word: שְׁנֵי בְנֵי יוֹנָה
  choice: deux jeunes pigeons
  rationale: L’expression hébraïque, littéralement « deux fils de pigeon/colombe », désigne idiomatiquement de jeunes pigeons.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La translittération rend explicitement le nom divin יהוה présent dans le texte hébreu.
- source_word: לְחַטָּאת
  choice: comme sacrifice pour le péché
  rationale: Dans cette législation sacrificielle, חַטָּאת désigne l’offrande liée au traitement du péché ou de l’impureté. La traduction principale conserve l’appellation traditionnelle tout en signalant l’autre compréhension en note.
- source_word: לְעֹלָה
  choice: comme holocauste
  rationale: « Holocauste » est le terme français établi pour le sacrifice entièrement brûlé désigné par עֹלָה.
theological_decisions:
- issue: Sens sacrificiel de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le contexte juridique et sacrificiel, ainsi que l’association avec l’holocauste, favorisent dans le texte principal la désignation traditionnelle. La note préserve toutefois l’interprétation fonctionnelle selon laquelle ce sacrifice sert plus précisément à la purification.
- issue: Valeur de אָשָׁם dans ce verset
  choice: offrande de réparation
  alternative: offrande de culpabilité
  rationale: Le terme désigne ici ce que la personne apporte à la suite de sa faute. « Réparation » met en valeur la fonction de l’offrande, tandis que « culpabilité » pourrait être compris principalement comme un état intérieur.
translation_notes:
  register: Français international moderne, clair et digne. La structure de la phrase reste proche de la progression hébraïque, tandis que les idiomes économiques et sacrificiels sont rendus sous une forme naturelle pour un lectorat général.
