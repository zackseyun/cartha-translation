  text: וֶ/הֱבִיאָ/הּ֮ אֶל הַ/כֹּהֵן֒ וְ/קָמַ֣ץ הַ/כֹּהֵ֣ן מִ֠מֶּ/נָּה מְל֨וֹא קֻמְצ֜/וֹ אֶת אַזְכָּרָתָ/ה֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה חַטָּ֖את הִֽוא־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/012.yaml
  text: Then he shall bring it to the priest[a], and the priest shall take from it a handful as its memorial portion and burn it on the altar, in addition to the food offerings of Yahweh[b]. It is a sin offering.
translation:
  language: fr
  text: Il l’apportera au prêtre, et le prêtre en prendra une pleine poignée comme part commémorative et la fera fumer sur l’autel, sur les offrandes consumées par le feu pour Yahweh. C’est une offrande pour le péché[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « C’est une offrande de purification. » Le terme hébreu peut désigner l’offrande qui traite le péché par un rite de purification.'
    reason: alternative_reading
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  choice: Il l’apportera
  rationale: Le hiphil de בוא avec suffixe féminin renvoie à l’offrande de farine du contexte précédent. Le futur français convient au style prescriptif de la loi.
- source_word: וְקָמַץ ... מְלֹא קֻמְצוֹ
  choice: en prendra une pleine poignée
  rationale: קמץ désigne ici le geste rituel consistant à prélever ce que contient la main. « Une pleine poignée » rend plus précisément מְלֹא que le simple « une poignée », tout en restant naturel.
- source_word: אֶת אַזְכָּרָתָהּ
  choice: comme part commémorative
  rationale: אַזְכָּרָה est le terme cultuel désignant la portion représentative brûlée sur l’autel. « Part commémorative » conserve cette fonction sans la surinterpréter.
- source_word: וְהִקְטִיר
  choice: Il la fera fumer
  rationale: Le hiphil de קטר, en contexte sacrificiel, signifie faire monter en fumée sur l’autel. Cette formulation conserve davantage l’image hébraïque que le seul verbe « brûler ».
- source_word: עַל אִשֵּׁי יְהוָה
  choice: par-dessus les offrandes consumées par le feu pour Yahweh
  rationale: « Par-dessus » conserve le sens spatial ordinaire de עַל, tandis que « offrandes consumées par le feu » rend le terme sacrificiel אִשֶּׁה sans introduire l’interprétation « nourriture ». La préposition « pour » marque leur destination cultuelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin, qui préserve ici le nom propre plutôt que de lui substituer un titre.
- source_word: חַטָּאת הִוא
  choice: C’est une offrande pour le péché
  rationale: Dans cette formule sacrificielle, חַטָּאת désigne la catégorie de l’offrande liée au péché. Cette traduction reste intelligible et laisse en note l’autre compréhension fonctionnelle importante.
theological_decisions:
- issue: Sens sacrificiel de חַטָּאת
  choice: offrande pour le péché
  alternative: offrande de purification
  rationale: Le terme peut désigner une offrande traitant le péché tout en mettant en jeu une fonction de purification. Le texte principal retient la désignation traditionnelle et transparente, tandis que la note préserve l’alternative sans résoudre la tension.
- issue: Rapport exprimé par עַל entre la part commémorative et les אִשֵּׁי יְהוָה
  choice: par-dessus
  alternative: en plus des
  rationale: Le sens spatial de עַל est directement possible dans le cadre de l’autel. « En plus des » est contextuellement défendable, mais explicite une relation additive que l’hébreu ne tranche pas nécessairement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe prescriptive est fluide; les termes cultuels indispensables sont conservés avec une note limitée à l’ambiguïté théologiquement significative.
