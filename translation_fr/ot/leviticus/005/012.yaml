  to: Il l’apportera au prêtre, et le prêtre en prendra une pleine poignée comme part commémorative et la fera fumer sur l’autel, sur les offrandes consumées par le feu pour Yahweh. C’est une offrande pour le péché[a].
  rationale: La révision remplace « par-dessus » par « sur » afin de ne pas préciser indûment la relation exprimée par עַל, tout en conservant l’image cultuelle. Elle réunit les deux actions du prêtre dans la même proposition, conformément à l’enchaînement du texte hébreu. La note sur חַטָּאת est maintenue, car « offrande de purification » demeure une alternative lexicale et théologique pertinente.
