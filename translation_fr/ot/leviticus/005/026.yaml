  text: וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן לִ/פְנֵ֥י יְהוָ֖ה וְ/נִסְלַ֣ח ל֑/וֹ עַל אַחַ֛ת מִ/כֹּ֥ל אֲשֶֽׁר יַעֲשֶׂ֖ה לְ/אַשְׁמָ֥ה בָֽ/הּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/026.yaml
  text: And the priest shall make atonement for him before Yahweh[a], and he will be forgiven for any one of all the things by which one may incur guilt.
translation:
  language: fr
  text: Le prêtre accomplira pour lui le rite d’expiation devant Yahweh, et le pardon lui sera accordé pour l’une quelconque des choses qu’il ferait et par lesquelles il se rendrait coupable.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « pour l’une de toutes les choses qu’il ferait pour se rendre coupable par elle ». La tournure hébraïque est elliptique; « par lesquelles il se rendrait coupable » en exprime le sens dans la traduction.'
    reason: Préserve la formulation condensée de אֲשֶׁר יַעֲשֶׂה לְאַשְׁמָה בָהּ et explique la relation entre l’acte et la culpabilité.
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו
  choice: fera pour lui le rite d’expiation
  rationale: Le piel de כפר, construit avec על pour désigner le bénéficiaire, exprime ici l’accomplissement rituel de l’expiation en sa faveur. Cette formulation garde le sens cultuel tout en restant claire en français.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Traduction directe du nom défini dans son contexte cultuel.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי marque la présence devant Dieu dans le cadre du sanctuaire, et le tétragramme est rendu par le nom Yahweh.
- source_word: וְנִסְלַח לוֹ
  choice: et il lui sera pardonné
  rationale: Le nifal de סלח exprime le pardon reçu, tandis que cette tournure conserve Dieu comme auteur implicite du pardon sans le préciser davantage.
- source_word: עַל אַחַת מִכֹּל
  choice: pour l’une quelconque de toutes les choses
  rationale: 'La formulation préserve la valeur distributive : n’importe quel cas particulier appartenant à l’ensemble des actes visés.'
- source_word: אֲשֶׁר יַעֲשֶׂה לְאַשְׁמָה בָהּ
  choice: qu’il aura faites et qui l’auront rendu coupable
  rationale: Cette formulation française explicite naturellement le rapport entre l’acte accompli et la culpabilité encourue, sans confondre ici אָשָׁם avec le sacrifice de réparation.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme, rendu ici par le nom propre Yahweh afin de préserver le nom d’alliance.
- issue: Auteur implicite du pardon
  choice: 'forme passive : « il lui sera pardonné »'
  alternative: « Dieu lui pardonnera »
  rationale: L’hébreu emploie une forme passive et laisse l’auteur du pardon implicite; la traduction conserve cette retenue théologique.
translation_notes:
  register: Français moderne, international et digne. « Rite d’expiation » signale clairement le contexte sacrificiel; le futur rend la suite prescriptive et son résultat. Le marqueur [a] est placé après la proposition qu’il précise.
