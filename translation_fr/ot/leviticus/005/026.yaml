revisions:
- from: Le prêtre fera pour lui le rite d’expiation devant Yahweh, et il lui sera pardonné pour l’une quelconque de toutes les choses qu’il aura faites et qui l’auront rendu coupable.[a]
  to: Le prêtre accomplira pour lui le rite d’expiation devant Yahweh, et le pardon lui sera accordé pour l’une quelconque des choses qu’il ferait et par lesquelles il se rendrait coupable.[a]
  rationale: La révision améliore la clarté référentielle et le français moderne, tout en maintenant le sens sacrificiel, la passivité du pardon et la portée générale de la clause hébraïque. Le marqueur de note reste attaché à la proposition finale qu’il éclaire.
