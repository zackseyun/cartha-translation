    text: 'Litt. : « pour l’une de toutes les choses qu’il ferait pour se rendre coupable par elle ». La tournure hébraïque est elliptique; « par lesquelles il se rendrait coupable » en exprime le sens dans la traduction.'
    reason: Préserve la formulation condensée de אֲשֶׁר יַעֲשֶׂה לְאַשְׁמָה בָהּ et explique la relation entre l’acte et la culpabilité.
  revision_rationale: La révision améliore la clarté référentielle et le français moderne, tout en maintenant le sens sacrificiel, la passivité du pardon et la portée générale de la clause hébraïque. Le marqueur de note reste attaché à la proposition finale qu’il éclaire.
