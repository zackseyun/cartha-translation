id: LEV.5.2
reference: Leviticus 5:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: א֣וֹ נֶ֗פֶשׁ אֲשֶׁ֣ר תִּגַּע֮ בְּ/כָל דָּבָ֣ר טָמֵא֒ אוֹ֩ בְ/נִבְלַ֨ת חַיָּ֜ה טְמֵאָ֗ה א֤וֹ בְּ/נִבְלַת֙ בְּהֵמָ֣ה טְמֵאָ֔ה א֕וֹ בְּ/נִבְלַ֖ת שֶׁ֣רֶץ טָמֵ֑א וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא טָמֵ֖א וְ/אָשֵֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/002.yaml
  text: Or if a person touches any unclean thing—whether the carcass of an unclean wild animal[a], or the carcass of unclean livestock, or the carcass of an unclean swarming creature—and it is hidden from him, and he is unclean and becomes guilty[b],
translation:
  language: fr
  text: Ou si une personne touche quelque chose d’impur — que ce soit le cadavre d’un animal sauvage impur, le cadavre d’un animal domestique impur ou le cadavre d’une créature grouillante impure — sans s’en rendre compte[a], elle est impure et devient coupable[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et cela lui est caché » ; autrement dit, la personne n’en a pas conscience.'
    reason: lexical_alternative
  - marker: b
    text: Il s’agit ici de la culpabilité ou de la responsabilité liée à l’état d’impureté ; le contact avec un cadavre n’est pas nécessairement présenté comme un mal moral intentionnel.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: une personne
  rationale: Dans ce contexte juridique, le terme désigne un individu, et non l’âme immatérielle. « Une personne » est naturel, précis et inclusif en français moderne.
- source_word: תִּגַּע בְּ
  choice: touche
  rationale: Le verbe נגע construit avec בְּ exprime ici un contact physique. « Touche » est direct et suffisamment formel.
- source_word: כָל דָּבָר טָמֵא
  choice: une chose quelconque qui est impure
  rationale: דָּבָר a un sens large et introduit la catégorie précisée par les exemples suivants. Cette formulation conserve cette portée générale.
- source_word: נִבְלַת
  choice: le cadavre de
  rationale: Dans les lois de pureté du Lévitique, נְבֵלָה désigne le corps mort d’un animal. « Cadavre » est le terme français courant et précis.
- source_word: חַיָּה טְמֵאָה
  choice: un animal sauvage impur
  rationale: חַיָּה contraste ici avec בְּהֵמָה et désigne un animal sauvage terrestre.
- source_word: בְּהֵמָה טְמֵאָה
  choice: un animal domestique impur
  rationale: בְּהֵמָה désigne ici les quadrupèdes domestiques. Cette traduction maintient clairement le contraste avec l’animal sauvage.
- source_word: שֶׁרֶץ טָמֵא
  choice: une petite bête grouillante impure
  rationale: שֶׁרֶץ désigne de petites créatures qui pullulent, grouillent ou rampent. « Petite bête grouillante » rend la catégorie de manière compréhensible sans la réduire aux seuls reptiles.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: sans s’en rendre compte
  rationale: L’expression signifie littéralement que la chose lui est cachée, donc que la personne n’en a pas conscience. La traduction française exprime naturellement cette idée, tandis que la note conserve l’image hébraïque.
- source_word: וְהוּא טָמֵא
  choice: elle est impure
  rationale: La proposition énonce le statut rituel de la personne. La coordination reste simple, sans préciser davantage le rapport logique.
- source_word: וְאָשֵׁם
  choice: et devient coupable
  rationale: Dans ce contexte juridique, אָשֵׁם indique qu’une culpabilité ou responsabilité est encourue. « Devient coupable » conserve la progression exprimée par le texte.
theological_decisions:
- issue: Nature de l’impureté
  choice: Traduire טָמֵא par « impur » et présenter l’impureté comme un statut rituel.
  alternative: « souillé » ou « pécheur »
  rationale: Le verset traite de l’impureté contractée au contact d’un cadavre animal, et ne qualifie pas ce contact de mal moral intentionnel.
- issue: Portée de la culpabilité
  choice: Conserver « devient coupable » et expliquer en note sa portée juridique et cultuelle.
  alternative: « commet un péché » ou « est moralement mauvais »
  rationale: אָשֵׁם exprime une culpabilité ou responsabilité encourue, mais le contexte ne permet pas d’assimiler simplement l’impureté rituelle à une faute morale délibérée.
- issue: Genre grammatical
  choice: Employer « une personne », puis le pronom « elle ».
  alternative: Employer « quelqu’un », puis le pronom « il »
  rationale: En français, le féminin de « elle » s’accorde grammaticalement avec « personne » sans limiter le référent aux femmes. Le caractère générique du sujet est ainsi préservé naturellement.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure juridique et l’énumération de l’hébreu, tout en rendant idiomatiquement l’absence de conscience. « Impur » est préféré à « souillé » pour le vocabulaire cultuel du Lévitique.
