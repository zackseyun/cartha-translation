id: LEV.5.11
reference: Leviticus 5:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם לֹא֩ תַשִּׂ֨יג יָד֜/וֹ לִ/שְׁתֵּ֣י תֹרִ֗ים אוֹ֮ לִ/שְׁנֵ֣י בְנֵי יוֹנָה֒ וְ/הֵבִ֨יא אֶת קָרְבָּנ֜/וֹ אֲשֶׁ֣ר חָטָ֗א עֲשִׂירִ֧ת הָ/אֵפָ֛ה סֹ֖לֶת לְ/חַטָּ֑את לֹא יָשִׂ֨ים עָלֶ֜י/הָ שֶׁ֗מֶן וְ/לֹא יִתֵּ֤ן עָלֶ֨י/הָ֙ לְבֹנָ֔ה כִּ֥י חַטָּ֖את הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/011.yaml
  text: But if his means are not sufficient for two turtledoves or two young pigeons[a], then he shall bring as his offering for the sin that he has committed a tenth of an ephah of fine flour for a sin offering. He shall put no oil on it and place no frankincense on it, because it is a sin offering.
translation:
  language: fr
  text: Mais si ses moyens ne lui permettent pas d’offrir deux tourterelles ou deux jeunes pigeons[a], il apportera, comme offrande pour le péché qu’il a commis, un dixième d’épha de farine fine, en offrande pour le péché. Il n’y mettra ni huile ni encens, car c’est une offrande pour le péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « si sa main n’atteint pas » ; expression hébraïque signifiant que ses moyens sont insuffisants.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׂיג יָדוֹ
  choice: ses moyens ne lui permettent pas d’offrir
  rationale: L’expression signifie littéralement que « sa main n’atteint pas » et désigne ici l’insuffisance des ressources. La formulation française exprime clairement cette condition économique tout en gardant la relation avec ce que la personne doit apporter.
- source_word: תֹרִים
  choice: tourterelles
  rationale: Le terme désigne précisément les tourterelles dans ce contexte sacrificiel.
- source_word: בְנֵי יוֹנָה
  choice: jeunes pigeons
  rationale: L’expression, littéralement « fils de pigeon/colombe », désigne de jeunes pigeons.
- source_word: קָרְבָּנוֹ
  choice: offrande
  rationale: Le mot désigne largement ce qui est présenté à Dieu; « offrande » convient aussi au substitut végétal prescrit ici.
- source_word: אֲשֶׁר חָטָא
  choice: pour le péché qu’il a commis
  rationale: Cette formulation rend explicitement et naturellement en français le rapport entre l’offrande et la faute commise.
- source_word: עֲשִׂירִת הָאֵפָה
  choice: un dixième d’épha
  rationale: L’unité ancienne est conservée plutôt que remplacée par une conversion moderne approximative.
- source_word: סֹלֶת
  choice: farine fine
  rationale: Cette expression claire et actuelle désigne la farine finement moulue destinée aux offrandes.
- source_word: לְחַטָּאת
  choice: en offrande pour le péché
  rationale: Dans les prescriptions sacrificielles, חַטָּאת désigne ici l’offrande liée au péché plutôt que le péché lui-même.
- source_word: לֹא יָשִׂים עָלֶיהָ שֶׁמֶן וְלֹא יִתֵּן עָלֶיהָ לְבֹנָה
  choice: Il n’y mettra ni huile ni encens
  rationale: La coordination négative française rend avec concision les deux interdictions parallèles. « Encens » est le terme courant pour la résine aromatique לְבֹנָה dans le culte.
- source_word: כִּי חַטָּאת הִיא
  choice: car c’est une offrande pour le péché
  rationale: La proposition donne la raison de l’absence d’huile et d’encens et maintient la classification rituelle de l’offrande.
theological_decisions:
- issue: Sens de חַטָּאת dans le contexte sacrificiel
  choice: offrande pour le péché
  alternative: péché
  rationale: Le mot peut désigner soit la faute, soit l’offrande associée à celle-ci. Ici, les instructions portent sur l’objet apporté; la valeur sacrificielle est donc retenue sans ajouter de catégorie doctrinale ultérieure.
- issue: Expression de la concession accordée à la personne pauvre
  choice: ses moyens ne lui permettent pas d’offrir
  alternative: sa main n’atteint pas
  rationale: Le sens économique et la force de la prescription légale sont rendus clairement, tandis que le sens littéral de l’image hébraïque est conservé en note.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition d’« offrande pour le péché » est conservée afin de refléter l’insistance et la classification rituelle du texte hébreu. Le marqueur [a] est placé immédiatement après la condition qu’explique la note.
