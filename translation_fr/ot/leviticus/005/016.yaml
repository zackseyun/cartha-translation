revisions:
- from: Il donnera en réparation ce dont il a privé le sanctuaire[a], y ajoutera un cinquième et remettra le tout au prêtre. Le prêtre fera pour lui le rite d’expiation avec le bélier du sacrifice de réparation[b], et il lui sera pardonné.
  to: Il fera restitution pour la faute commise à l’égard des choses saintes[a], y ajoutera un cinquième et le donnera au prêtre. Le prêtre fera l’expiation pour lui avec le bélier du sacrifice de réparation[b], et il lui sera pardonné.
  rationale: La révision remplace «le sanctuaire» par «les choses saintes», ce qui respecte l’étendue du terme hébreu sans imposer un référent architectural. Elle rend la restitution juridiquement intelligible tout en évitant de déterminer au-delà du texte la nature exacte du manquement. «Faire l’expiation pour lui» est une formulation française naturelle et proche de l’expression sacrificielle hébraïque. Les deux ancres de note sont conservées et la note a est corrigée.
  reviewer_model: gpt-5.6-terra
