  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֵ֣ת אֲשֶׁר֩ חָטָ֨א מִן הַ/קֹּ֜דֶשׁ יְשַׁלֵּ֗ם וְ/אֶת חֲמִֽישִׁת/וֹ֙ יוֹסֵ֣ף עָלָ֔י/ו וְ/נָתַ֥ן אֹת֖/וֹ לַ/כֹּהֵ֑ן וְ/הַ/כֹּהֵ֗ן יְכַפֵּ֥ר עָלָ֛י/ו בְּ/אֵ֥יל הָ/אָשָׁ֖ם וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/016.yaml
  text: He shall make restitution for what he sinned against from the holy thing[a], and he shall add a fifth to it and give it to the priest. Then the priest shall make atonement for him with the ram of the guilt offering[b], and he shall be forgiven.
translation:
  language: fr
  text: Il fera restitution pour la faute commise à l’égard des choses saintes[a], y ajoutera un cinquième et le donnera au prêtre. Le prêtre fera l’expiation pour lui avec le bélier du sacrifice de réparation[b], et il lui sera pardonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : «ce par quoi il a péché concernant les choses saintes». Il s’agit d’une restitution pour une faute touchant à des biens ou à des parts consacrés, par exemple ce qui a été pris ou retenu indûment.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : «sacrifice de culpabilité». Le terme hébreu peut évoquer à la fois la culpabilité et la réparation qui l’accompagne.'
    reason: alternative_reading
lexical_decisions:
- source_word: חָטָא מִן הַקֹּדֶשׁ
  choice: ce dont il a privé le sanctuaire
  rationale: Dans ce contexte juridique, l’expression vise une faute portant sur des biens ou redevances sacrés. Cette formulation française exprime idiomatiquement la privation ou la retenue indue sans réduire nécessairement הַקֹּדֶשׁ à un bâtiment.
- source_word: יְשַׁלֵּם
  choice: donnera en réparation
  rationale: Le piel de שלם désigne ici la restitution de ce qui est dû; «en réparation» conserve la portée juridique et prépare le lien avec le sacrifice appelé אָשָׁם.
- source_word: חֲמִישִׁתוֹ יוֹסֵף עָלָיו
  choice: y ajoutera un cinquième
  rationale: Rend clairement la majoration d’un cinquième ajoutée à la valeur principale, dans un français naturel.
- source_word: לַכֹּהֵן
  choice: au prêtre
  rationale: Traduction directe du destinataire de la restitution augmentée.
- source_word: יְכַפֵּר עָלָיו
  choice: fera pour lui le rite d’expiation
  rationale: Dans le cadre sacrificiel, כפר désigne l’action rituelle qui traite la faute. La formulation reste accessible tout en évitant de préciser au-delà du texte le mécanisme théologique.
- source_word: בְּאֵיל הָאָשָׁם
  choice: avec le bélier du sacrifice de réparation
  rationale: אָשָׁם associe ici culpabilité et réparation. «Sacrifice de réparation» met en relief la restitution caractéristique du passage, tandis qu’une note conserve l’autre terminologie courante.
- source_word: וְנִסְלַח לוֹ
  choice: et il lui sera pardonné
  rationale: Le passif hébreu est conservé; il exprime le pardon accordé sans nommer explicitement l’agent.
theological_decisions:
- issue: Sens du terme sacrificiel אָשָׁם
  choice: sacrifice de réparation
  alternative: sacrifice de culpabilité
  rationale: Le terme peut mettre en avant à la fois la culpabilité contractée et la réparation exigée. Le contexte immédiat insiste sur la restitution et la majoration d’un cinquième; la variante traditionnelle est signalée en note.
- issue: Agent du pardon dans וְנִסְלַח לוֹ
  choice: passif impersonnel «il lui sera pardonné»
  alternative: «Dieu lui pardonnera»
  rationale: Le texte hébreu ne nomme pas l’agent. Le passif préserve cette retenue tout en laissant entendre, dans le contexte cultuel, que le pardon vient de Dieu.
translation_notes:
  register: Français international moderne, juridique et cultuel sans archaïsmes inutiles. «Le sanctuaire» est employé ici comme désignation naturelle de ce qui appartient au domaine sacré, et la note préserve la formulation plus large de l’hébreu. Le rythme en deux phrases distingue la restitution matérielle du rite sacerdotal et du pardon.
