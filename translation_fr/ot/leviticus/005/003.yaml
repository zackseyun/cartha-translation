source:
  edition: WLC
  text: א֣וֹ כִ֤י יִגַּע֙ בְּ/טֻמְאַ֣ת אָדָ֔ם לְ/כֹל֙ טֻמְאָת֔/וֹ אֲשֶׁ֥ר יִטְמָ֖א בָּ֑/הּ וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא יָדַ֖ע וְ/אָשֵֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/003.yaml
  text: Or if he touches human uncleanness—any uncleanness by which one becomes unclean—and it is hidden from him, and then he comes to know it, he is guilty.
translation:
  language: fr
  text: Ou si quelqu’un touche une impureté humaine[a] — toute impureté par laquelle on devient impur — et qu’elle lui est restée cachée[b], puis qu’il l’apprend, il est coupable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une impureté provenant d’une personne ». Il s’agit ici d’une impureté rituelle ayant une personne pour source.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et qu’elle lui est cachée » ; c’est-à-dire qu’il n’en avait pas connaissance au moment du contact.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגַּע בְּ
  choice: touche
  rationale: Le verbe נגע construit avec ב désigne ici un contact physique; « touche » est direct et naturel en français.
- source_word: טֻמְאַת אָדָם
  choice: une impureté provenant d’une personne
  rationale: טֻמְאָה désigne l’impureté rituelle dans ce contexte légal, et אָדָם indique ici une source humaine. Cette formulation évite que « impureté humaine » soit comprise comme un défaut moral propre à l’humanité.
- source_word: לְכֹל טֻמְאָתוֹ
  choice: toute impureté
  rationale: La formule étend la règle à toute forme d’impureté rattachée à la personne qui en est la source, sans reproduire lourdement le suffixe hébreu.
- source_word: אֲשֶׁר יִטְמָא בָּהּ
  choice: qui peut le rendre impur
  rationale: La relative précise l’effet de cette impureté. « Peut le rendre impur » exprime naturellement en français la portée générale de l’imparfait hébreu.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: et que cela lui échappe
  rationale: Le niphal de עלם indique que le fait échappe à sa connaissance. Cette tournure française conserve l’idée d’une ignorance initiale sans être artificiellement littérale.
- source_word: וְהוּא יָדַע
  choice: puis qu’il en prend conscience
  rationale: Dans la séquence, la personne découvre après coup ce qu’elle ignorait. « Puis » explicite cette progression contextuelle sans modifier son sens.
- source_word: וְאָשֵׁם
  choice: il devient coupable
  rationale: Dans ce cadre juridique et sacrificiel, אשם exprime le fait d’encourir une culpabilité ou une responsabilité. « Devient coupable » rend la conséquence dans la séquence du cas légal.
theological_decisions:
- issue: Nature de טֻמְאָה dans la législation lévitique
  choice: Employer « impureté » au sens rituel, sans moraliser le terme.
  alternative: souillure; état de péché
  rationale: Le verset traite d’un état rituel contracté par contact, et non nécessairement d’un mal moral intrinsèque.
- issue: Sens générique de אָדָם
  choice: Rendre le terme par « une personne » dans l’expression indiquant la source de l’impureté.
  alternative: un homme; l’être humain
  rationale: אָדָם est générique ici et ne désigne pas spécialement un individu de sexe masculin.
- issue: Portée de וְאָשֵׁם
  choice: Conserver l’affirmation de culpabilité sans préciser davantage la nature exacte de la responsabilité.
  alternative: il doit offrir un sacrifice de réparation; il porte son péché
  rationale: Le verbe établit une culpabilité ou une responsabilité, mais ce verset seul ne développe pas encore son traitement sacrificiel.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la forme conditionnelle du cas légal tout en évitant les calques lourds. « Impur » et « impureté » maintiennent la terminologie rituelle cohérente du Lévitique.
