revisions:
- from: Ou s’il touche une impureté provenant d’une personne[a] — toute impureté qui peut le rendre impur — et que cela lui échappe[b], puis qu’il en prend conscience, il devient coupable.
  to: Ou si quelqu’un touche une impureté humaine[a] — toute impureté par laquelle on devient impur — et qu’elle lui est restée cachée[b], puis qu’il l’apprend, il est coupable.
  rationale: La révision remplace la formulation ambiguë « puis qu’il en prend conscience » par une séquence temporelle claire (« puis qu’il l’apprend ») et restitue le caractère générique de la relative hébraïque. Elle maintient l’ambiguïté inhérente au texte quant aux modalités précises de l’ignorance, sans ajouter d’interprétation doctrinale.
