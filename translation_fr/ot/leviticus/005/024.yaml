base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/024.yaml
  text: or anything about which he swore falsely—he shall repay it in full[a], and shall add a fifth to it. He shall give it to the one to whom it belongs on the day of his guilt offering.
translation:
  language: fr
  text: ou toute chose au sujet de laquelle il aura juré faussement. Il la restituera intégralement et y ajoutera un cinquième. Il la remettra à celui à qui elle appartient le jour de sa culpabilité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le jour de son sacrifice de réparation ». Le terme hébreu peut désigner la culpabilité ou, dans ce contexte rituel, le sacrifice de réparation qui y est associé.'
    reason: alternative_reading
lexical_decisions:
- source_word: א֠וֹ מִכֹּל אֲשֶׁר
  choice: ou tout autre bien au sujet duquel
  rationale: La formule poursuit l’énumération précédente et garde sa portée générale. Dans ce contexte de restitution, « bien » explicite naturellement qu’il s’agit de ce qui appartient à autrui, tandis que « au sujet duquel » reprend la construction avec עַל.
- source_word: יִשָּׁבַע עָלָיו לַשֶּׁקֶר
  choice: il a prêté un faux serment
  rationale: Cette formulation française courante exprime directement l’acte de jurer mensongèrement au sujet du bien concerné.
- source_word: וְשִׁלַּם אֹתוֹ בְּרֹאשׁוֹ
  choice: Il le restituera intégralement
  rationale: L’expression juridique littérale « selon son principal » désigne la restitution de la totalité du bien ou de sa valeur initiale.
- source_word: וַחֲמִשִׁתָיו יֹסֵף עָלָיו
  choice: et y ajoutera un cinquième
  rationale: La formule prescrit un supplément égal au cinquième de la valeur restituée.
- source_word: לַאֲשֶׁר הוּא לוֹ יִתְּנֶנּוּ
  choice: Il le remettra à celui à qui il appartient
  rationale: Cette tournure rend clairement l’idiome hébreu d’appartenance et le transfert effectif de la restitution au propriétaire légitime.
- source_word: בְּיוֹם אַשְׁמָתוֹ
  choice: le jour de son sacrifice de réparation
  rationale: Dans le cadre sacrificiel immédiat du Lévitique, אַשָׁם peut désigner le sacrifice lié à la culpabilité. « Sacrifice de réparation » exprime à la fois sa fonction cultuelle et son lien avec la réparation exigée.
theological_decisions:
- issue: Sens de אַשְׁמָתוֹ dans la formule temporelle finale
  choice: son sacrifice de réparation
  alternative: sa culpabilité ; le jour où il se reconnaîtra coupable
  rationale: Le mot peut renvoyer soit à la culpabilité, soit au sacrifice qui lui correspond. Le contexte rituel favorise ici le sens sacrificiel, mais l’ambiguïté réelle de l’hébreu est conservée dans une note plutôt que supprimée.
translation_notes:
  register: Français international moderne, sobre et juridique. « Prêter un faux serment », « restituer intégralement » et « celui à qui il appartient » restent naturels pour un large public tout en conservant la précision du texte légal. Le marqueur de note est placé immédiatement après l’expression ambiguë qu’il explique.
