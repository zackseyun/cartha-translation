  source_fidelity: La restriction ajoutée par « tout autre bien » ne correspond pas à מִכֹּל אֲשֶׁר, qui reste général (« toute chose / quoi que ce soit »), et « autre » n’est pas exprimé. La formule finale בְּיוֹם אַשְׁמָתוֹ signifie littéralement « le jour de sa culpabilité »; le contexte rend possible une référence au sacrifice, mais le texte hébreu emploie ici le nom de la culpabilité plutôt que le terme usuel du sacrifice.
  naturalness: La restitution et le supplément d’un cinquième sont formulés dans un français moderne, clair et juridique. « Le jour de sa culpabilité » est légèrement formel, mais naturel dans ce cadre légal et plus fidèle; la note présente l’interprétation cultuelle possible.
  terminology: « Restituer intégralement », « ajouter un cinquième » et « sacrifice de réparation » sont appropriés. Le sacrifice de réparation doit toutefois être relégué en note à cette occurrence afin de ne pas résoudre sans indication l’ambiguïté de אַשְׁמָתוֹ.
