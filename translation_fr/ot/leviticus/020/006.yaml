source:
  edition: WLC
  text: וְ/הַ/נֶּ֗פֶשׁ אֲשֶׁ֨ר תִּפְנֶ֤ה אֶל הָֽ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים לִ/זְנ֖וֹת אַחֲרֵי/הֶ֑ם וְ/נָתַתִּ֤י אֶת פָּנַ/י֙ בַּ/נֶּ֣פֶשׁ הַ/הִ֔וא וְ/הִכְרַתִּ֥י אֹת֖/וֹ מִ/קֶּ֥רֶב עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/006.yaml
  text: And the person who turns to the mediums and to the spiritists[a], to prostitute himself after them[c][b], I will set my face against that person and cut him off from among his people.
translation:
  language: fr
  text: Quant à la personne qui se tourne vers les médiums et les devins[a] pour se prostituer en les suivant[b], je me tournerai contre elle et je la retrancherai du milieu de son peuple[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les deux termes hébreux désignent des personnes liées à la consultation des morts ou des esprits et à un savoir occulte. Le premier peut aussi être compris comme désignant les esprits eux-mêmes.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pour se prostituer à leur suite » ; cette métaphore exprime l’infidélité envers Dieu que constitue le recours à ces pratiques.'
    reason: lexical_alternative
  - marker: c
    text: « Retrancher » est une formule juridique traditionnelle. Le texte ne précise pas ici si le jugement prend la forme de la mort, d’une intervention divine ou d’une exclusion.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: une personne
  rationale: Dans ce contexte juridique, נֶפֶשׁ désigne l’individu tout entier, non une âme immatérielle. « Une personne » est naturel et précis en français moderne.
- source_word: תִּפְנֶה
  choice: se tourne vers
  rationale: Le verbe פנה exprime littéralement le fait de se tourner vers quelqu’un et, ici, celui de rechercher son aide. La formulation conserve l’image hébraïque tout en restant idiomatique.
- source_word: הָאֹבֹת
  choice: les médiums
  rationale: אוֹב peut désigner un esprit évoqué ou la personne qui le consulte ou l’évoque. Dans cette construction parallèle à un autre nom de praticiens, « médiums » rend clairement le référent humain probable sans masquer l’incertitude lexicale, signalée en note.
- source_word: הַיִּדְּעֹנִים
  choice: les devins
  rationale: יִדְּעֹנִי désigne des praticiens associés à un savoir occulte et apparaît souvent avec אוֹב. « Devins » est compréhensible en français courant, sans employer « spirites », terme susceptible d’évoquer spécifiquement le spiritisme moderne.
- source_word: לִזְנוֹת אַחֲרֵיהֶם
  choice: pour se prostituer en les suivant
  rationale: La traduction maintient la métaphore sexuelle explicite de זנה et rend אחר par l’idée de suivre. Elle préserve ainsi la force de l’image d’infidélité au lieu de la réduire à une simple désobéissance.
- source_word: וְנָתַתִּי אֶת־פָּנַי בַּנֶּפֶשׁ הַהִוא
  choice: je tournerai ma face contre cette personne
  rationale: Cette formulation conserve l’image hébraïque de la face de Dieu dirigée contre quelqu’un en signe d’opposition et de jugement.
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: et je la retrancherai
  rationale: « Retrancher » préserve la formule judiciaire כרת sans déterminer abusivement le mode précis du jugement. Le pronom féminin suit le genre grammatical de « personne » en français.
- source_word: מִקֶּרֶב עַמּוֹ
  choice: du milieu de son peuple
  rationale: La formulation reproduit la dimension communautaire de l’expression hébraïque et demeure claire en français.
theological_decisions:
- issue: Maintien de la métaphore de la prostitution pour l’infidélité envers Dieu
  choice: pour se prostituer en les suivant
  alternative: pour lui être infidèle en les suivant
  rationale: Le texte emploie explicitement זנה, métaphore forte de prostitution ou d’infidélité sexuelle. La conserver maintient la portée relationnelle et théologique du recours aux pratiques occultes.
- issue: Sens de la sanction exprimée par כרת
  choice: je la retrancherai du milieu de son peuple
  alternative: je l’exclurai de son peuple / je la ferai mourir
  rationale: Le mécanisme exact de cette sanction n’est pas précisé ici et fait l’objet de débats. « Retrancher » en conserve la gravité et l’indétermination, sans imposer l’expulsion sociale ou la mort comme seule interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe juridique reste directe. Les images hébraïques de la prostitution, de la face tournée contre quelqu’un et du retranchement sont conservées, avec des notes pour les ambiguïtés lexicales et judiciaires.
