  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת אֵ֣שֶׁת אָבִ֔י/ו עֶרְוַ֥ת אָבִ֖י/ו גִּלָּ֑ה מֽוֹת יוּמְת֥וּ שְׁנֵי/הֶ֖ם דְּמֵי/הֶ֥ם בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/011.yaml
  text: If a man lies with his father's wife[a], he has uncovered his father's nakedness; both of them shall surely be put to death[b]; their blood is on them.
translation:
  language: fr
  text: Si un homme couche avec la femme de son père, il a découvert la nudité de son père[a]. Tous deux seront certainement mis à mort ; leur sang est sur eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « découvrir la nudité » est une formule consacrée du Lévitique pour désigner une relation sexuelle interdite. Ici, elle qualifie le fait de coucher avec la femme du père.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « leur sang est sur eux ». Cette formule juridique signifie qu’ils portent eux-mêmes la responsabilité de leur mort.'
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Si un homme
  rationale: Dans cette formulation juridique casuistique, la conjonction suivie du nom et du relatif introduit naturellement une condition. « Un homme » conserve le sujet masculin précis de l’hébreu.
- source_word: יִשְׁכַּב אֶת
  choice: couche avec
  rationale: Dans ce contexte de législation sexuelle, l’expression désigne une relation sexuelle. « Couche avec » est idiomatique en français moderne tout en gardant une sobriété adaptée au registre juridique.
- source_word: אֵשֶׁת אָבִיו
  choice: la femme de son père
  rationale: Cette traduction suit exactement la désignation hébraïque. « Sa belle-mère » serait plus étroit et introduirait un terme de parenté absent du texte.
- source_word: עֶרְוַת אָבִיו גִּלָּה
  choice: il découvre la nudité de son père
  rationale: La formulation conserve l’expression caractéristique du Lévitique et ses liens avec les autres interdits sexuels, sans la réduire à une paraphrase interprétative.
- source_word: מוֹת יוּמְתוּ
  choice: seront certainement mis à mort
  rationale: L’infinitif absolu associé au verbe conjugué renforce la certitude de la peine. « Certainement » rend cette emphase sans préciser un mode d’exécution.
- source_word: שְׁנֵיהֶם
  choice: Tous deux
  rationale: La formulation explicite que la peine concerne les deux personnes impliquées.
- source_word: דְּמֵיהֶם בָּם
  choice: leur sang retombe sur eux
  rationale: Cette expression juridique attribue aux coupables eux-mêmes la responsabilité de leur mort. « Retombe sur eux » restitue en français le sens idiomatique de la préposition tout en conservant l’image du sang.
theological_decisions:
- issue: Rendu de l’expression sexuelle et juridique propre au code de sainteté
  choice: il découvre la nudité de son père
  alternative: il déshonore sexuellement son père
  rationale: Le maintien de l’image hébraïque préserve la tension de l’expression et les correspondances internes avec Lévitique 18 et 20, plutôt que de fixer le sens dans une seule paraphrase.
- issue: Sujet masculin de la loi
  choice: Si un homme
  alternative: Si quelqu’un
  rationale: L’hébreu vise ici explicitement un homme et décrit l’acte par rapport à la femme de son père ; une formulation neutre effacerait cette précision.
- issue: Responsabilité exprimée par la formule du sang
  choice: leur sang retombe sur eux
  alternative: ils sont responsables de leur propre mort
  rationale: La traduction conserve la métaphore juridique biblique sans transformer directement la formule en commentaire doctrinal.
translation_notes:
  register: Français international moderne, digne et direct. Le registre juridique est maintenu sans archaïsmes inutiles. L’expression « découvrir la nudité » est volontairement conservée afin de respecter l’idiome lévitique, tandis que les notes en explicitent le sens.
