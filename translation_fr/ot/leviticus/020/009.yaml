  yaml_path: translation/ot/leviticus/020/009.yaml
  text: For any man who curses his father or his mother shall surely be put to death[a]; he has cursed his father and his mother[c][b]; his blood is on him.
translation:
  language: fr
  text: Car tout homme[a] qui maudit son père ou sa mère[b] sera certainement mis à mort. Il a maudit son père et sa mère ; son sang est sur lui[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu répète « homme » : « un homme, un homme », tournure distributive qui signifie « tout homme » ou « quiconque ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu porte littéralement « son père et sa mère ». Dans cette première proposition, « ou » fait ressortir le sens juridique : maudire l’un ou l’autre parent suffit à encourir la peine.'
    reason: lexical_alternative
  - marker: c
    text: Ou « son sang retombe sur lui ». Cette expression hébraïque signifie qu’il porte lui-même la responsabilité de sa mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: En effet
  rationale: La particule introduit ici l’explication ou le fondement juridique de la prescription précédente ; « En effet » en conserve la force explicative.
- source_word: אִישׁ אִישׁ
  choice: tout homme
  rationale: 'Le redoublement forme une expression distributive : tout homme, quel qu’il soit. Cette formulation conserve aussi le masculin grammatical de l’hébreu.'
- source_word: יְקַלֵּל / קִלֵּל
  choice: maudit / a maudit
  rationale: Le piel de קלל désigne ici le fait de prononcer une malédiction contre quelqu’un, et non simplement de lui manquer de respect.
- source_word: אָבִיו וְאֶת אִמּוֹ
  choice: son père ou sa mère / son père et sa mère
  rationale: 'Dans l’énoncé de la règle, « ou » rend clairement le sens juridique distributif : maudire l’un ou l’autre parent entraîne la peine. Dans la reprise qui motive la sentence, « et » conserve la coordination hébraïque.'
- source_word: מוֹת יוּמָת
  choice: sera certainement mis à mort
  rationale: L’infinitif absolu suivi du verbe conjugué renforce la certitude de la peine ; la tournure passive en maintient le caractère judiciaire.
- source_word: דָּמָיו בּוֹ
  choice: son sang est sur lui
  rationale: La traduction conserve l’image juridique hébraïque, qui attribue au coupable la responsabilité de sa propre mort, sans réduire le mot « sang » à une seule explicitation.
theological_decisions:
- issue: Portée du masculin distributif אִישׁ אִישׁ
  choice: tout homme
  alternative: quiconque
  rationale: « Tout homme » reflète la forme masculine du texte tout en exprimant sa portée distributive, sans ajouter de restriction doctrinale absente du passage.
- issue: Formule de responsabilité דָּמָיו בּוֹ
  choice: son sang est sur lui
  alternative: il est responsable de sa propre mort
  rationale: La formulation retenue préserve l’image et sa tension entre sang versé, culpabilité et responsabilité judiciaire, tandis que l’alternative expliciterait seulement l’une de ses dimensions.
translation_notes:
  register: Français international moderne, sobre et juridique. « Sera certainement mis à mort » conserve l’emphase hébraïque ; « son sang est sur lui » maintient volontairement l’image biblique, éclairée par une note.
