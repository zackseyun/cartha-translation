source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת דֹּ֣דָת֔/וֹ עֶרְוַ֥ת דֹּד֖/וֹ גִּלָּ֑ה חֶטְאָ֥/ם יִשָּׂ֖אוּ עֲרִירִ֥ים יָמֻֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/020.yaml
  text: If a man lies with his aunt[a], he has uncovered his uncle’s nakedness. They shall bear their sin[b]; they shall die childless.
translation:
  language: fr
  text: Si un homme couche avec la femme de son oncle, il a découvert la nudité de son oncle[a]. Tous deux porteront leur péché[b] ; ils mourront sans enfants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il a découvert la nudité de son oncle ». Dans le Lévitique, cette expression désigne ici la violation d’un lien familial interdit par une relation sexuelle avec la femme de l’oncle.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « leur culpabilité ». L’expression hébraïque peut désigner aussi bien le péché que la culpabilité ou la responsabilité qui en découle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Si un homme
  rationale: La conjonction et le relatif introduisent ici un nouveau cas juridique. « Si un homme » restitue naturellement la formulation casuistique tout en conservant le masculin singulier du texte.
- source_word: יִשְׁכַּב אֶת
  choice: couche avec
  rationale: Dans ce contexte, שׁכב est l’expression usuelle désignant les relations sexuelles. « Coucher avec » reste idiomatique en français moderne sans paraphrase explicative.
- source_word: דֹּדָתוֹ
  choice: sa tante
  rationale: Le terme désigne la femme de l’oncle. « Sa tante » est l’équivalent français naturel, tandis que la proposition suivante précise le lien avec l’oncle.
- source_word: עֶרְוַת דֹּדוֹ גִּלָּה
  choice: il a découvert la nudité de son oncle
  rationale: La traduction conserve l’expression lévitique délibérément indirecte et le parfait hébreu, sans remplacer l’image par une explication interprétative.
- source_word: חֶטְאָם יִשָּׂאוּ
  choice: Tous deux porteront leur péché
  rationale: Le verbe et le suffixe sont au pluriel et englobent les deux partenaires. « Porter leur péché » préserve l’idiome hébreu, tandis que la note signale le sens possible de culpabilité ou de responsabilité encourue.
- source_word: עֲרִירִים יָמֻתוּ
  choice: ils mourront sans enfants
  rationale: Cette formulation rend les deux éléments de la sanction avec concision, sans préciser si l’absence d’enfants précède la mort ou signifie l’absence de descendance survivante.
theological_decisions:
- issue: Portée de la sanction עֲרִירִים יָמֻתוּ
  choice: ils mourront sans enfants
  alternative: ils mourront privés de descendance / ils mourront sans descendance survivante
  rationale: L’hébreu énonce un état ou un résultat sans en expliquer le mécanisme. La traduction conserve cette indétermination et n’ajoute aucune théorie particulière sur l’exécution de la sanction.
- issue: Sens de חֶטְאָם dans l’expression « porter leur péché »
  choice: péché dans le texte, avec « culpabilité » en note
  alternative: ils porteront leur culpabilité
  rationale: חטא peut désigner l’acte fautif ou la culpabilité et la responsabilité qui en découlent. Garder « péché » dans le texte et signaler l’autre possibilité préserve la tension lexicale.
translation_notes:
  register: Français international moderne, sobre et juridique. « Coucher avec » demeure compréhensible et digne dans ce contexte. L’idiome de la « nudité de son oncle » est conservé dans le corps du texte et brièvement éclairé en note.
