  text: וְ/לֹ֤א תֵֽלְכוּ֙ בְּ/חֻקֹּ֣ת הַ/גּ֔וֹי אֲשֶׁר אֲנִ֥י מְשַׁלֵּ֖חַ מִ/פְּנֵי/כֶ֑ם כִּ֤י אֶת כָּל אֵ֨לֶּה֙ עָשׂ֔וּ וָ/אָקֻ֖ץ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/023.yaml
  text: And you shall not walk in the statutes of the nation that I am driving out before you[a], because they did all these things[c][b], and I loathed them.
translation:
  language: fr
  text: Vous ne suivrez pas les prescriptions[a] du peuple que je chasse de devant vous[b], car ils ont fait toutes ces choses, et je les ai eus en horreur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « coutumes » : le terme hébreu peut désigner des pratiques établies aussi bien que des règles fixées.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « que j’envoie loin de devant vous » ; dans ce contexte, il s’agit de l’expulser du pays.
    reason: lexical_alternative
  - marker: c
    text: Ou « je les ai pris en dégoût » ou « je les ai détestés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵלְכוּ בְּחֻקֹּת
  choice: vous ne suivrez pas les coutumes
  rationale: Le verbe « marcher » exprime ici la conduite. En français courant, « suivre les coutumes » rend naturellement l’idée de conformer sa manière de vivre aux pratiques établies, tout en conservant la portée normative de חֻקּוֹת dans une note.
- source_word: הַגּוֹי
  choice: le peuple
  rationale: Le singulier hébreu désigne collectivement la population qui doit être dépossédée. « Peuple » permet aussi de comprendre naturellement le pluriel « ils » de la proposition suivante, sans introduire la connotation néotestamentaire de « païens ».
- source_word: אֲשֶׁר אֲנִי מְשַׁלֵּחַ מִפְּנֵיכֶם
  choice: que je chasse de devant vous
  rationale: Dans ce contexte, שׁלח désigne l’expulsion hors du pays, et מִפְּנֵיכֶם signifie littéralement « de devant vous ». La formulation retenue conserve à la fois le mouvement d’expulsion et l’image spatiale.
- source_word: כִּי אֶת כָּל אֵלֶּה עָשׂוּ
  choice: car ils ont fait toutes ces choses
  rationale: כִּי introduit la cause. Le démonstratif renvoie aux actes interdits énumérés dans le contexte immédiat; la traduction reste volontairement générale comme l’hébreu.
- source_word: וָאָקֻץ בָּם
  choice: et je les ai eus en horreur
  rationale: קוץ exprime une vive répulsion. « Avoir en horreur » transmet cette force en français digne et intelligible; le pronom pluriel garde comme référent immédiat les membres du peuple, sans réduire explicitement la répulsion divine aux seuls actes.
theological_decisions:
- issue: Objet de la répulsion divine
  choice: je les ai eus en horreur
  alternative: leurs pratiques m’ont inspiré de l’horreur
  rationale: Le suffixe בָּם renvoie grammaticalement au groupe humain évoqué, même si la cause donnée est l’ensemble de ses actes. La traduction ne remplace donc pas les personnes par leurs seules pratiques et préserve la tension du texte.
- issue: Force du langage affectif appliqué à Dieu
  choice: avoir en horreur
  alternative: détester / prendre en dégoût
  rationale: La formulation conserve la forte répulsion morale exprimée par קוץ, sans l’atténuer en simple désapprobation ni développer une explication doctrinale étrangère au verset.
translation_notes:
  register: Français international moderne, direct et digne. Le futur à valeur d’interdiction garde le ton législatif. « Suivre les coutumes » évite le calque peu naturel « marcher dans les prescriptions », tandis que « de devant vous » conserve volontairement l’image spatiale hébraïque.
