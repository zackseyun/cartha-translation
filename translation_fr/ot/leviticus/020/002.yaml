  - severity: low
    issue: « l’un de ses descendants »
    rationale: Le terme זרע désigne littéralement la semence, ici la descendance ou les enfants. « L’un » n’est pas exigé par le texte et individualise légèrement davantage l’expression; « de sa descendance » conserve mieux sa formulation.
