  text: וְ/אֶל בְּנֵ֣י יִשְׂרָאֵ֘ל תֹּאמַר֒ אִ֣ישׁ אִישׁ֩ מִ/בְּנֵ֨י יִשְׂרָאֵ֜ל וּ/מִן הַ/גֵּ֣ר הַ/גָּ֣ר בְּ/יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יִתֵּ֧ן מִ/זַּרְע֛/וֹ לַ/מֹּ֖לֶךְ מ֣וֹת יוּמָ֑ת עַ֥ם הָ/אָ֖רֶץ יִרְגְּמֻ֥/הוּ בָ/אָֽבֶן־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/002.yaml
  text: 'And you shall say to the sons of Israel: Any man from the sons of Israel[a], or from the sojourner who sojourns in Israel, who gives any of his offspring to Molech shall surely be put to death[c][b]; the people of the land shall stone him with stones.'
translation:
  language: fr
  text: 'Tu diras aux Israélites : Tout homme, qu’il soit Israélite ou étranger résidant en Israël[a], qui donne de sa descendance[b] à Molek[c] sera certainement mis à mort. Les gens du pays le lapideront.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie un nom et un verbe de même racine : littéralement, « l’étranger qui séjourne en Israël ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu signifie littéralement « semence » ; il désigne ici la descendance, c’est-à-dire les enfants.
    reason: lexical_alternative
  - marker: c
    text: Molek est traditionnellement compris comme le nom ou le titre d’une divinité associée au sacrifice d’enfants. Certains comprennent plutôt le terme comme la désignation d’un type d’offrande.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette formulation rend naturellement en français moderne l’expression hébraïque littérale « fils d’Israël » et désigne ici l’ensemble du peuple.
- source_word: אִישׁ אִישׁ
  choice: Tout homme
  rationale: 'Le redoublement hébraïque a une valeur distributive : il vise chaque homme sans exception.'
- source_word: הַגֵּר הַגָּר בְּיִשְׂרָאֵל
  choice: étranger résidant en Israël
  rationale: גֵּר désigne un étranger installé au sein de la communauté. Le français évite la répétition étymologique de l’hébreu tout en en conservant le sens dans le texte et la signale en note.
- source_word: יִתֵּן מִזַּרְעוֹ לַמֹּלֶךְ
  choice: livre l’un de ses descendants à Molek
  rationale: « Livrer » convient à la remise cultuelle exprimée par נתן sans ajouter les modalités absentes du verset. זֶרַע signifie littéralement « semence » et désigne ici la descendance.
- source_word: מוֹת יוּמָת
  choice: sera mis à mort sans faute
  rationale: La construction infinitif absolu plus verbe conjugué renforce le caractère certain et impératif de la peine judiciaire.
- source_word: עַם הָאָרֶץ
  choice: les gens du pays
  rationale: Cette expression conserve la référence collective aux habitants chargés d’exécuter la sentence, sans lui attribuer ici un sens sociologique tardif.
- source_word: יִרְגְּמֻהוּ בָאָבֶן
  choice: le lapideront
  rationale: Le verbe français « lapider » exprime naturellement et complètement l’exécution au moyen de pierres; reproduire « avec des pierres » serait redondant en français.
theological_decisions:
- issue: Sens de לַמֹּלֶךְ et nature de l’acte
  choice: Molek est présenté dans le texte principal comme le destinataire nommé de l’acte cultuel.
  alternative: Le terme peut être compris comme le nom d’un type d’offrande plutôt que comme celui d’une divinité.
  rationale: La lecture traditionnelle comme nom propre est directe dans ce contexte, mais la note conserve l’incertitude philologique. La traduction n’ajoute ni « sacrifice » ni « par le feu », détails que ce verset ne formule pas explicitement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe juridique reste solennelle sans calquer inutilement les répétitions hébraïques. « Molek » suit une translittération française courante de מֹלֶךְ; les ambiguïtés réelles sont conservées en note.
