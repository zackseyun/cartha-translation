  verdict: revise
  source_fidelity: 'La formulation « sera mis à mort sans faute » ne rend pas la construction hébraïque מות יומת, qui marque la certitude ou le caractère impératif de la peine, non l’absence de faute. Le reste suit globalement le sens du texte : l’inclusion de l’Israélite et de l’étranger résident, la remise de la descendance à Molek et la lapidation par les gens du pays.'
  naturalness: Le français est généralement naturel et d’un registre juridique approprié. « Sera certainement mis à mort » est à la fois idiomatique et fidèle. « Donner de sa descendance » conserve la portée non spécifiée de זרע sans imposer « l’un », qui peut être plus individualisant que l’hébreu.
  terminology: « Israélites », « étranger résidant », « Molek » et « lapider » conviennent au français international moderne. La note sur Molek préserve correctement l’alternative interprétative sans l’introduire dans le texte principal.
