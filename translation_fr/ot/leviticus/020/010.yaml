source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִנְאַף֙ אֶת אֵ֣שֶׁת אִ֔ישׁ אֲשֶׁ֥ר יִנְאַ֖ף אֶת אֵ֣שֶׁת רֵעֵ֑/הוּ מֽוֹת יוּמַ֥ת הַ/נֹּאֵ֖ף וְ/הַ/נֹּאָֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/010.yaml
  text: If a man commits adultery with another man's wife—if he commits adultery with his neighbor's wife—the adulterer and the adulteress shall surely be put to death[a].
translation:
  language: fr
  text: Si un homme commet l’adultère avec la femme d’un autre homme — s’il commet l’adultère avec la femme de son prochain —, l’homme et la femme qui ont commis l’adultère seront certainement mis à mort[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec la femme d’un homme… avec la femme de son prochain ». La répétition renforce et précise l’infraction dans le style juridique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Si un homme
  rationale: Dans cette formulation juridique casuistique, la conjonction, le nom et le relatif introduisent un cas conditionnel. « Si un homme » est naturel en français tout en conservant le masculin singulier explicite.
- source_word: יִנְאַף
  choice: commet un adultère
  rationale: Le verbe נאף désigne précisément l’adultère. Cette expression française est claire, actuelle et juridiquement précise.
- source_word: אֶת אֵשֶׁת אִישׁ
  choice: avec la femme d’un autre homme
  rationale: Le sens littéral est « avec la femme d’un homme ». « D’un autre homme » explicite naturellement en français qu’elle est mariée à quelqu’un d’autre sans modifier la nature de l’infraction.
- source_word: אֲשֶׁר יִנְאַף אֶת אֵשֶׁת רֵעֵהוּ
  choice: s’il commet un adultère avec la femme de son prochain
  rationale: La répétition hébraïque est conservée comme reprise explicative et emphatique propre au style légal. « Prochain » rend רֵעַ au sens de membre de la communauté, et non seulement de voisin géographique.
- source_word: מוֹת יוּמַת
  choice: seront certainement mis à mort
  rationale: L’infinitif absolu suivi du verbe conjugué renforce la certitude de la peine. « Certainement » transmet cette emphase sans préciser un mode d’exécution absent du verset.
- source_word: הַנֹּאֵף וְהַנֹּאָפֶת
  choice: l’homme adultère et la femme adultère
  rationale: Les participes substantivés masculin et féminin désignent distinctement les deux coupables. Cette formulation symétrique est plus immédiatement compréhensible en français courant que « l’adultère et l’adultère » ou le rare substantif féminin « adultéresse ».
theological_decisions:
- issue: Langage juridique genré
  choice: Maintien de « un homme » et désignation explicite de l’homme et de la femme adultères.
  alternative: « Si quelqu’un commet un adultère… les deux seront mis à mort. »
  rationale: L’hébreu marque explicitement le genre dans l’exposé du cas et dans la désignation des deux personnes condamnées. La traduction conserve cette précision plutôt que de la neutraliser.
- issue: Formule de peine capitale
  choice: « seront certainement mis à mort » sans indication du procédé.
  alternative: « seront exécutés » ou mention d’un mode précis d’exécution.
  rationale: Le texte impose avec emphase la peine de mort, mais ce verset n’en indique pas le moyen. La traduction n’ajoute aucun détail issu d’autres textes ou traditions.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme répétitif de la formulation légale hébraïque est volontairement préservé. « Femme adultère » évite le substantif rare « adultéresse » tout en maintenant la distinction masculin-féminin du texte source.
