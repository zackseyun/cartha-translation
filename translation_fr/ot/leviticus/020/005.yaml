  text: וְ/שַׂמְתִּ֨י אֲנִ֧י אֶת פָּנַ֛/י בָּ/אִ֥ישׁ הַ/ה֖וּא וּ/בְ/מִשְׁפַּחְתּ֑/וֹ וְ/הִכְרַתִּ֨י אֹת֜/וֹ וְ/אֵ֣ת כָּל הַ/זֹּנִ֣ים אַחֲרָ֗י/ו לִ/זְנ֛וֹת אַחֲרֵ֥י הַ/מֹּ֖לֶךְ מִ/קֶּ֥רֶב עַמָּֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/005.yaml
  text: then I myself will set my face against that man and against his family[a], and I will cut off him and all who prostitute themselves after him by prostituting themselves after Molech[b], from among their people.
translation:
  language: fr
  text: Alors, moi-même, je tournerai mon visage contre cet homme et contre sa famille, et je retrancherai[a] du milieu de leur peuple cet homme ainsi que tous ceux qui se prostituent à sa suite, en se prostituant à la suite du Molek[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Retrancher » est une expression de jugement d’alliance; le texte ne précise pas ici si ce retranchement s’accomplit par la mort, l’exclusion ou une autre forme d’élimination divine.
    reason: lexical_alternative
  - marker: b
    text: Ou « en se prostituant après le Molek ». Le verbe hébreu emploie métaphoriquement le langage de la prostitution pour parler de l’infidélité idolâtre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי אֲנִי אֶת־פָּנַי
  choice: alors moi-même, je tournerai ma face contre
  rationale: L’expression hébraïque décrit une opposition résolue. « Tourner ma face contre » conserve l’image biblique, tandis que « moi-même » rend l’insistance de אֲנִי.
- source_word: בָּאִישׁ הַהוּא
  choice: cet homme
  rationale: אִישׁ désigne ici l’homme coupable évoqué au verset précédent; le masculin singulier est conservé.
- source_word: וּבְמִשְׁפַּחְתּוֹ
  choice: et contre sa famille
  rationale: מִשְׁפָּחָה peut désigner une famille ou un groupe de parenté plus large. « Famille » est naturel et laisse ouverte cette étendue.
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: je retrancherai ... cet homme
  rationale: Le hifil de כרת est une formule de jugement d’alliance. « Retrancher » en conserve la force sans préciser un mécanisme que ce verset ne définit pas.
- source_word: וְאֵת כָּל־הַזֹּנִים אַחֲרָיו
  choice: ainsi que tous ceux qui se prostituent à sa suite
  rationale: זנה garde la métaphore sexuelle de l’infidélité idolâtre; אַחֲרָיו indique que d’autres suivent l’homme dans sa faute.
- source_word: לִזְנוֹת אַחֲרֵי הַמֹּלֶךְ
  choice: en se prostituant avec le Molek
  rationale: L’infinitif précise leur conduite idolâtre. En français, « se prostituer avec » exprime naturellement la relation infidèle visée, tout en évitant l’ambiguïté de « à la suite du Molek ».
- source_word: הַמֹּלֶךְ
  choice: le Molek
  rationale: Le texte porte l’article défini. « Molek » conserve la désignation traditionnelle sans l’identifier à une autre divinité.
- source_word: מִקֶּרֶב עַמָּם
  choice: du milieu de leur peuple
  rationale: La formule indique le retrait hors de la communauté; le suffixe pluriel de עַמָּם est rendu par « leur » et se rapporte à l’ensemble des personnes retranchées.
theological_decisions:
- issue: Métaphore sexuelle appliquée à l’idolâtrie
  choice: se prostituent / en se prostituant
  alternative: se rendent infidèles / pratiquent l’idolâtrie
  rationale: La formulation conserve la métaphore volontairement forte de זנה et sa répétition, sans la réduire à une explication abstraite.
- issue: Portée du jugement exprimé par כרת
  choice: retrancherai
  alternative: ferai mourir / exclurai / détruirai
  rationale: Le verset annonce un jugement divin, mais n’en précise pas ici le mode exact. « Retrancher » préserve cette indétermination.
- issue: Nature du Molek
  choice: le Molek
  alternative: Molek comme nom propre sans article / Milkom
  rationale: La traduction maintient la désignation du texte hébreu sans trancher davantage la question de savoir s’il s’agit strictement d’un nom divin ou d’un titre cultuel.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « se prostituer » reproduit la rhétorique hébraïque. « Retrancher » et l’image de la face sont maintenus comme formulations bibliques porteuses d’une ambiguïté réelle.
