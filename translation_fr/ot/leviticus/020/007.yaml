id: LEV.20.7
reference: Leviticus 20:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִ֨תְקַדִּשְׁתֶּ֔ם וִ/הְיִיתֶ֖ם קְדֹשִׁ֑ים כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/007.yaml
  text: Consecrate yourselves[a], and be holy, because I am Yahweh your God.
translation:
  language: fr
  text: Consacrez-vous[a] et soyez saints, car je suis Yahweh, votre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Sanctifiez-vous » ou « Rendez-vous saints ». Le verbe hébreu est réfléchi et appelle Israël à se consacrer activement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: Consacrez-vous
  rationale: 'Le hitpael de קדשׁ a ici une valeur réfléchie et exhortative : Israël est appelé à se consacrer activement. « Consacrez-vous » distingue cette action du commandement suivant, « soyez saints ».'
- source_word: וִהְיִיתֶם
  choice: et soyez
  rationale: La forme de היה coordonnée au premier ordre se comprend naturellement comme un second commandement. « Et soyez » en restitue clairement la force en français actuel.
- source_word: קְדֹשִׁים
  choice: saints
  rationale: « Saints » conserve la portée cultuelle, relationnelle et morale de קדושׁ dans le contexte de l'alliance, sans la réduire à la seule idée de mise à part.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit le fondement du commandement. « Car » exprime avec naturel et dignité cette relation causale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: 'Malgré sa forme morphologique plurielle, אֱלֹהִים désigne ici, avec le suffixe de deuxième personne du pluriel, le Dieu unique d''Israël : « votre Dieu ».'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom d'alliance au lieu de lui substituer un titre.
- issue: Rapport entre la consécration humaine et la sainteté
  choice: 'Deux injonctions coordonnées : « Consacrez-vous et soyez saints »'
  alternative: 'Une relation de but : « Consacrez-vous afin d''être saints »'
  rationale: La coordination hébraïque laisse les deux propositions côte à côte. La traduction ne transforme donc pas explicitement la seconde en résultat ou en but de la première.
translation_notes:
  register: Français international moderne, simple et digne. « Consacrez-vous » est naturel dans un registre biblique courant et maintient la distinction lexicale avec « soyez saints ». Le nom Yahweh est conservé conformément au texte source.
