id: LEV.20.8
reference: Leviticus 20:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֙ אֶת חֻקֹּתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/008.yaml
  text: You shall keep my statutes and do them. I am Yahweh[a], who sanctifies you.
translation:
  language: fr
  text: Vous respecterez mes prescriptions et vous les mettrez en pratique. Je suis Yahweh, celui qui vous sanctifie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celui qui vous rend saints ».'
    reason: Alternative française plus explicite pour le sens causatif de מְקַדִּשְׁכֶם.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Vous respecterez
  rationale: שׁמר signifie ici garder ou observer des prescriptions. « Respecter » est naturel en français juridique et exprime leur observance effective.
- source_word: חֻקֹּתַי
  choice: mes prescriptions
  rationale: חֻקָּה désigne des règles établies. « Prescriptions » conserve la nuance légale tout en restant courant en français moderne.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: et vous les mettrez en pratique
  rationale: Littéralement « et vous les ferez » ; avec des lois pour objet, עשׂה appelle leur accomplissement concret. « Mettre en pratique » est idiomatique et précis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: מְקַדִּשְׁכֶם
  choice: celui qui vous sanctifie
  rationale: Le participe piel de קדשׁ présente l'action caractéristique ou continue de Yahweh. « Sanctifie » préserve le vocabulaire biblique de la sainteté.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » en conserve la fonction de nom personnel sans le remplacer par un titre.
- issue: Rendu de מְקַדִּשְׁכֶם dans le contexte d'alliance
  choice: celui qui vous sanctifie
  alternative: celui qui vous rend saints ; celui qui vous consacre
  rationale: « Sanctifie » maintient le lien lexical avec la sainteté et laisse intactes les dimensions cultuelle, relationnelle et morale du terme, sans les réduire à une seule.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur à valeur injonctive convient au discours légal. « Mettre en pratique » évite le calque peu naturel « les faire », tandis que « sanctifie » conserve le terme théologique traditionnel, explicité en note.
