  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Yahweh parla à Moïse[a] en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque du nom divin et son rendu traditionnel.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol au piel de דבר ouvre une nouvelle unité de discours. « Parla » convient à cette formule narrative solennelle et reste naturel en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre afin de préserver le nom divin présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition introduit ici le destinataire de la parole ; « à » est l’équivalent français idiomatique.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Dans cette formule d’introduction, l’infinitif לֵאמֹר annonce directement les paroles qui suivent. « En ces termes » restitue naturellement cette fonction en français sans le calque lourd « en disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: L’hébreu porte explicitement le tétragramme. « Yahweh » conserve le caractère de nom propre et représente la vocalisation savante la plus courante, tandis que « le SEIGNEUR » relève d’une substitution traditionnelle et « Jéhovah » d’une forme historiquement hybride.
translation_notes:
  register: Français moderne, international et digne. La formule « parla à Moïse en ces termes » est naturelle dans le registre biblique contemporain et introduit clairement le discours du verset suivant.
