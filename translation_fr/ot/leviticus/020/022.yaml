  text: וּ/שְׁמַרְתֶּ֤ם אֶת כָּל חֻקֹּתַ/י֙ וְ/אֶת כָּל מִשְׁפָּטַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/לֹא תָקִ֤יא אֶתְ/כֶם֙ הָ/אָ֔רֶץ אֲשֶׁ֨ר אֲנִ֜י מֵבִ֥יא אֶתְ/כֶ֛ם שָׁ֖מָּ/ה לָ/שֶׁ֥בֶת בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/022.yaml
  text: So you shall keep all my statutes and all my judgments and do them[b][a], so that the land to which I am bringing you to dwell in it may not vomit you out.
translation:
  language: fr
  text: Vous observerez donc toutes mes prescriptions et toutes mes règles[b], et vous les mettrez en pratique, afin que le pays où je vous conduis pour y habiter ne vous vomisse pas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne vous vomisse pas ». Cette image très forte présente le pays comme expulsant ses habitants lorsqu’il est souillé.'
    reason: Précision sur la métaphore hébraïque et sa personnification.
  - marker: b
    text: 'Ou : « toutes mes lois et toutes mes ordonnances ». L’hébreu emploie deux termes juridiques distincts : חֻקּוֹת et מִשְׁפָּטִים.'
    reason: Signaler une autre manière possible de rendre les deux termes légaux sans effacer leur distinction.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Vous observerez donc
  rationale: Dans ce contexte d’alliance et de loi, שׁמר signifie observer fidèlement. « Donc » rend le lien logique avec l’avertissement précédent, tandis que le futur français garde la force d’une injonction solennelle.
- source_word: חֻקֹּתַי
  choice: mes prescriptions
  rationale: חֻקָּה désigne ce qui est prescrit ou établi. « Prescriptions » est actuel, digne et distinct de מִשְׁפָּטִים.
- source_word: מִשְׁפָּטַי
  choice: mes règles
  rationale: Dans cette série juridique, מִשְׁפָּטִים renvoie aux règles ou décisions normatives. « Règles » reste compréhensible en français moderne sans confondre les deux termes hébreux.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: et vous les mettrez en pratique
  rationale: Avec des prescriptions comme objet, עשה signifie les accomplir concrètement. Cette formulation est plus naturelle en français que le calque « les faire ».
- source_word: וְלֹא תָקִיא אֶתְכֶם
  choice: ne vous vomisse pas
  rationale: קיא signifie littéralement vomir. Le choix conserve sans l’atténuer la personnification saisissante du pays qui expulse ses habitants souillés.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: אֶרֶץ désigne ici le territoire où Israël doit s’établir. « Pays » convient naturellement à cette destination territoriale en français.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: où je vous conduis
  rationale: La tournure française rend naturellement la destination et la forme participiale hébraïque, qui présente l’action divine comme en cours.
- source_word: לָשֶׁבֶת בָּהּ
  choice: pour y habiter
  rationale: ישׁב signifie ici habiter ou s’établir. « Pour y habiter » restitue clairement la valeur de but de l’infinitif et évite la répétition lourde « dans lequel… en lui ».
theological_decisions:
- issue: Maintien de la métaphore de l’expulsion par le pays
  choice: Le pays est personnifié comme pouvant « vomir » ses habitants.
  alternative: Le pays pourrait être dit les « rejeter » ou les « expulser ».
  rationale: Le verbe hébreu est volontairement concret et violent. Le conserver maintient la gravité du rapport entre souillure, sainteté et maintien dans le pays sans expliquer davantage le mécanisme théologique.
- issue: Distinction entre חֻקּוֹת et מִשְׁפָּטִים
  choice: « prescriptions » et « règles »
  alternative: « lois » et « ordonnances »
  rationale: Deux termes français distincts reflètent les deux catégories juridiques du texte, sans prétendre leur attribuer une différence technique plus précise que celle que garantit le contexte.
- issue: Nuance de וְלֹא après l’injonction
  choice: « afin que… ne… pas »
  alternative: « et le pays ne vous vomira pas »
  rationale: La formulation finale exprime naturellement en français le but ou le résultat recherché, tout en préservant la tension d’un avertissement conditionnel plutôt que d’en faire une promesse absolue.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le futur injonctif convient au discours légal biblique. « Mettre en pratique » évite un calque maladroit, tandis que « vomir » conserve délibérément la vigueur de l’image originale. Les appels de notes [b] et [a] sont placés immédiatement après les expressions concernées.
