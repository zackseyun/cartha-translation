source:
  edition: WLC
  text: וְ/אִשָּׁ֗ה אֲשֶׁ֨ר תִּקְרַ֤ב אֶל כָּל בְּהֵמָה֙ לְ/רִבְעָ֣ה אֹתָ֔/הּ וְ/הָרַגְתָּ֥ אֶת הָ/אִשָּׁ֖ה וְ/אֶת הַ/בְּהֵמָ֑ה מ֥וֹת יוּמָ֖תוּ דְּמֵי/הֶ֥ם בָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/016.yaml
  text: If a woman approaches any animal to mate with it[a], you shall kill the woman and the animal. They shall surely be put to death[b]; their blood is on them.
translation:
  language: fr
  text: Si une femme s’approche d’un animal, quel qu’il soit, pour s’accoupler avec lui[a], tu tueras la femme et l’animal. Ils seront certainement mis à mort[b] ; leur sang retombe sur eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour coucher avec lui ». Le verbe hébreu désigne ici précisément un rapport sexuel et évoque littéralement la monte.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « leur sang est sur eux » : ils portent eux-mêmes la responsabilité de leur mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְרַב
  choice: s’approche
  rationale: Le verbe קרב signifie concrètement « s’approcher ». Le but sexuel étant exprimé par l’infinitif qui suit, il ne faut pas surtraduire ce verbe.
- source_word: כָּל בְּהֵמָה
  choice: un animal, quel qu’il soit
  rationale: בְּהֵמָה est un terme générique désignant un animal, et כָּל donne ici une portée indéfinie ou exhaustive. Cette formulation est naturelle en français moderne.
- source_word: לְרִבְעָה אֹתָהּ
  choice: pour s’accoupler avec lui
  rationale: Dans ce contexte, רבע désigne explicitement un rapport sexuel avec un animal, avec l’image concrète de la monte. « S’accoupler avec » est clair et concis sans ajouter de commentaire.
- source_word: וְהָרַגְתָּ
  choice: tu feras mourir
  rationale: Cette tournure conserve l’adresse à la deuxième personne du singulier et la valeur prescriptive du texte juridique, tout en étant idiomatique dans un registre biblique français digne.
- source_word: מוֹת יוּמָתוּ
  choice: Ils seront certainement mis à mort
  rationale: L’infinitif absolu suivi du verbe conjugué renforce la certitude et la force de la peine. « Certainement » rend cette intensification sans ambiguïté.
- source_word: דְּמֵיהֶם בָּם
  choice: leur sang retombe sur eux
  rationale: Cette formulation garde l’image du sang tout en exprimant naturellement en français que la responsabilité de leur mort leur incombe.
theological_decisions:
- issue: Formulation d’une sanction juridique sévère concernant un rapport sexuel avec un animal
  choice: 'Exprimer directement l’acte et la peine, sans atténuation : « pour s’accoupler avec lui… Ils seront certainement mis à mort »'
  alternative: Employer l’euphémisme « coucher avec lui » ou la formulation plus technique « avoir des rapports sexuels avec lui »
  rationale: Le texte est une prescription pénale explicite. La traduction doit en préserver la clarté et la gravité sans ajouter de jugement doctrinal ni masquer la nature de l’acte.
- issue: Responsabilité exprimée par l’idiome du sang
  choice: leur sang retombe sur eux
  alternative: ils portent la responsabilité de leur mort
  rationale: Le choix principal préserve l’image hébraïque et sa tension juridico-morale, tandis que la note explicite le sens de l’idiome sans le substituer au texte.
translation_notes:
  register: Français international moderne, clair et digne, avec un registre juridique ferme. Le tutoiement singulier conserve la forme hébraïque. Les répétitions de « la femme et l’animal » puis « ils » sont maintenues, ainsi que l’image du sang, afin de préserver la structure et la force du texte source.
