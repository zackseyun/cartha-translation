  text: וְ/עֶרְוַ֨ת אֲח֧וֹת אִמְּ/ךָ֛ וַ/אֲח֥וֹת אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה כִּ֧י אֶת שְׁאֵר֛/וֹ הֶעֱרָ֖ה עֲוֺנָ֥/ם יִשָּֽׂאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/019.yaml
  text: You shall not uncover the nakedness of your mother's sister or of your father's sister[a], for he has laid bare his own flesh[b]; they shall bear their iniquity.
translation:
  language: fr
  text: Tu ne découvriras pas la nudité de la sœur de ta mère ni de la sœur de ton père, car il a mis à nu l’une de ses parentes proches[a] ; ils porteront leur faute[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « sa chair ». Le terme hébreu désigne ici une proche parente, une parente de sang.
    reason: lexical_alternative
  - marker: b
    text: « Porter leur faute » peut aussi signifier « porter leur culpabilité » ou « subir les conséquences de leur faute ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת … לֹא תְגַלֵּה
  choice: tu ne dévoileras pas la nudité
  rationale: Conserve l’expression juridique et sexuelle caractéristique du Lévitique, sans la réduire à une paraphrase explicative comme « avoir des relations sexuelles ».
- source_word: אֲחוֹת אִּמְךָ וַאֲחוֹת אָבִיךָ
  choice: la sœur de ta mère ni celle de la sœur de ton père
  rationale: Reproduit directement les termes de parenté hébreux. La coordination « ni… ni… » est naturelle en français sous la portée de la négation.
- source_word: שְׁאֵרוֹ
  choice: sa propre chair
  rationale: Préserve la métaphore concrète de la chair employée pour désigner une proche parente et maintient le langage biblique de la parenté.
- source_word: הֶעֱרָה
  choice: il a mis à nu
  rationale: Rend le sens d’exposer ou de dénuder tout en évitant de répéter « dévoiler » et en conservant la formulation imagée de l’hébreu.
- source_word: עֲוֺנָם יִשָּׂאוּ
  choice: ils porteront leur faute
  rationale: Conserve l’expression hébraïque compacte, qui peut englober la faute, la culpabilité et les conséquences qui en découlent.
theological_decisions:
- issue: Passage du singulier au pluriel entre la justification et la sanction
  choice: « il a mis à nu sa propre chair ; ils porteront leur faute »
  alternative: 'Uniformiser au pluriel : « ils ont mis à nu leur propre chair ; ils porteront leur faute »'
  rationale: L’hébreu passe de formes singulières dans la proposition explicative à des formes plurielles dans la sanction. La traduction maintient cette variation plutôt que de l’harmoniser, laissant ouverte sa portée juridique exacte.
- issue: Degré d’explicitation de l’euphémisme sexuel
  choice: Conserver « dévoiler la nudité »
  alternative: Traduire explicitement par « avoir des relations sexuelles avec »
  rationale: L’expression imagée structure les interdictions sexuelles du contexte et leur cohérence littéraire. La conserver respecte la forme du texte sans imposer une interprétation plus étroite dans le corps du verset.
translation_notes:
  register: Français international moderne, sobre et juridique. Le futur à valeur d’interdiction garde la solennité de la formulation légale. La répétition partielle des liens de parenté privilégie la clarté, tandis que « celle » évite une lourdeur inutile.
