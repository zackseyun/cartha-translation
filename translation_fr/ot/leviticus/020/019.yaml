    issue: « Sa propre chair » est ambigu et potentiellement inexact en français.
    rationale: Dans l’usage français courant, l’expression renvoie au propre corps du sujet (« il a mis à nu son propre corps »). Dans ce contexte, le terme hébreu שְׁאֵרוֹ renvoie à une proche parente, littéralement à sa « chair » au sens de parenté. Une explicitation minimale est nécessaire pour éviter le contresens.
  - severity: low
