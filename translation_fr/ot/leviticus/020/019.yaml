review_pass:
  verdict: revise
  source_fidelity: La structure juridique, les liens de parenté, le passage du singulier (« il ») au pluriel (« ils ») et l’idiome de la sanction sont globalement bien conservés. Cependant, « sa propre chair » en français désigne normalement le corps de l’homme lui-même, alors que שְׁאֵרוֹ désigne ici sa proche parente / sa parente de sang. Cette formulation risque donc de produire un contresens. La version révisée rend le référent de parenté dans le texte et conserve le littéral dans la note.
  naturalness: « Découvrir la nudité » est la formulation biblique française usuelle et naturelle pour cet idiome juridique. « La sœur de ta mère ni la sœur de ton père » est plus fluide que la reprise par « celle de ». « L’une de ses parentes proches » évite l’ambiguïté corporelle de « sa propre chair » tout en gardant une formulation sobre.
  terminology: « Découvrir la nudité », « parentes proches » et « porteront leur faute » conviennent au registre juridique et biblique du passage. La note explique que le mot hébreu est littéralement lié à la « chair » et peut désigner la parenté de sang. La variation singulier/pluriel du texte hébreu est maintenue sans en déduire une doctrine ou une répartition juridique précise.
  issues:
