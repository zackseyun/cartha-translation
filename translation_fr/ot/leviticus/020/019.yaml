  rationale: La révision remplace une expression française susceptible de faire comprendre que l’homme a exposé son propre corps par une expression qui rend le sens de parenté du terme hébreu. Elle adopte aussi l’idiome biblique français établi « découvrir la nudité ». Elle préserve l’euphémisme sexuel, le registre légal, l’ambiguïté relative au mode de sanction et le décalage du singulier au pluriel.
