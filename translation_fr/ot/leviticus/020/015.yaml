source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִתֵּ֧ן שְׁכָבְתּ֛/וֹ בִּ/בְהֵמָ֖ה מ֣וֹת יוּמָ֑ת וְ/אֶת הַ/בְּהֵמָ֖ה תַּהֲרֹֽגוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/015.yaml
  text: If a man has sexual intercourse with an animal, he must surely be put to death, and you shall kill the animal.
translation:
  language: fr
  text: Si un homme a des rapports sexuels avec un animal[a], il sera mis à mort ; vous tuerez l’animal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « donne son coucher avec un animal » ; idiome hébreu désignant des rapports sexuels.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom est masculin singulier et désigne ici précisément un homme, tandis que le verset suivant traite séparément le cas d’une femme.
- source_word: אֲשֶׁר
  choice: si
  rationale: Dans cette formulation juridique casuistique, la proposition relative hébraïque a une valeur conditionnelle que le français exprime naturellement par « si ».
- source_word: יִתֵּן שְׁכָבְתּוֹ
  choice: a des rapports sexuels
  rationale: Cette expression idiomatique, littéralement « donne son coucher », désigne clairement l’acte sexuel. La formulation retenue est naturelle et explicite en français moderne.
- source_word: בִּבְהֵמָה
  choice: avec un animal
  rationale: בְּהֵמָה désigne un animal ; « animal » est le terme courant et exact en français moderne.
- source_word: מוֹת יוּמָת
  choice: il sera mis à mort
  rationale: La construction associant l’infinitif absolu au verbe conjugué marque ici la certitude et la force obligatoire de la peine capitale. Dans ce contexte légal, « il sera mis à mort » l’exprime avec dignité sans ajouter un adverbe peu naturel.
- source_word: וְאֶת־הַבְּהֵמָה תַּהֲרֹגוּ
  choice: vous tuerez aussi l’animal
  rationale: Le pluriel « vous » conserve l’adresse collective du verbe hébreu. « Aussi » rend explicite en français la coordination qui applique la mise à mort à l’animal également.
theological_decisions:
- issue: Spécificité sexuelle de l’auteur de l’acte
  choice: « un homme », avec une référence masculine précise
  alternative: « une personne », compris de manière générique
  rationale: Le texte emploie le nom masculin אִישׁ et le verset suivant présente séparément le cas d’une femme. Une formulation générique effacerait cette organisation juridique du passage.
translation_notes:
  register: Français international moderne, clair et digne. La formulation juridique reste ferme, sans archaïsmes. Le marqueur [a] est placé immédiatement après l’expression expliquée.
