id: LEV.20.18
reference: Leviticus 20:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ֠/אִישׁ אֲשֶׁר יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה דָּוָ֗ה וְ/גִלָּ֤ה אֶת עֶרְוָתָ/הּ֙ אֶת מְקֹרָ֣/הּ הֶֽעֱרָ֔ה וְ/הִ֕יא גִּלְּתָ֖ה אֶת מְק֣וֹר דָּמֶ֑י/הָ וְ/נִכְרְת֥וּ שְׁנֵי/הֶ֖ם מִ/קֶּ֥רֶב עַמָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/018.yaml
  text: If a man lies with a woman during her menstrual impurity and uncovers her nakedness—he has laid bare her flow[c][b][a], and she has uncovered the flow of her blood—both of them shall be cut off from among their people.
translation:
  language: fr
  text: Si un homme couche avec une femme pendant son impureté menstruelle[a] et découvre sa nudité — il a mis à nu sa source[b], et elle a découvert la source de son sang —, tous deux seront retranchés du milieu de leur peuple[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pendant qu’elle a ses règles ». Le terme hébreu évoque aussi l’impureté rituelle liée aux menstruations dans le Lévitique.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « sa source ». Dans ce contexte, « source » est une expression euphémique désignant l’origine du flux de sang.
    reason: lexical_alternative
  - marker: c
    text: « Être retranché » est une formule juridique courante dans la Torah. Le texte ne précise pas ici de quelle manière ce retranchement s’accomplit.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: un homme
  rationale: Le masculin singulier désigne ici précisément le partenaire masculin dans cette formulation juridique.
- source_word: יִשְׁכַּב אֶת אִשָּׁה
  choice: couche avec une femme
  rationale: Cette expression française naturelle conserve l’idiome hébreu désignant les rapports sexuels et convient au registre juridique du passage.
- source_word: דָּוָה
  choice: pendant son impureté menstruelle
  rationale: Le terme désigne la menstruation avec la dimension d’impureté rituelle propre au contexte du Lévitique.
- source_word: גִלָּה אֶת עֶרְוָתָהּ
  choice: découvre sa nudité
  rationale: Rend littéralement l’idiome lévitique relatif à l’exposition sexuelle illicite et préserve sa cohérence dans le livre.
- source_word: מְקֹרָהּ הֶעֱרָה
  choice: il a mis à nu sa source
  rationale: Conserve l’image hébraïque de la « source » et le parallélisme avec la proposition suivante, sans expliciter davantage que le texte.
- source_word: וְהִיא גִּלְּתָה אֶת מְקוֹר דָּמֶיהָ
  choice: et elle a découvert la source de son sang
  rationale: Préserve le parallélisme hébreu, la participation de la femme et l’image euphémique de la source du sang.
- source_word: וְנִכְרְתוּ
  choice: seront retranchés
  rationale: Formule juridique et alliance courante dans la Torah; elle laisse ouverte la manière précise dont la sanction est appliquée.
- source_word: מִקֶּרֶב עַמָּם
  choice: du milieu de leur peuple
  rationale: Reproduit clairement le cadre communautaire de la formule hébraïque sans le réduire à une institution particulière.
theological_decisions:
- issue: Nature de l’état exprimé par דָּוָה
  choice: impureté menstruelle
  alternative: pendant qu’elle a ses règles
  rationale: Le choix retenu exprime à la fois la réalité menstruelle et le statut rituel pertinent dans le contexte du Lévitique, sans suggérer une maladie générique.
- issue: Sens de la formule de sanction וְנִכְרְתוּ
  choice: seront retranchés
  alternative: seront exécutés; seront exclus de la communauté; mourront sans descendance
  rationale: Le texte ne précise pas ici le mode d’application de la sanction. La formulation traditionnelle préserve cette ambiguïté juridique et théologique.
- issue: Image de la « source »
  choice: conserver l’euphémisme corporel du texte
  alternative: expliciter par « flux menstruel »
  rationale: La formulation hébraïque associe une image anatomique et la source du sang. La traduction la maintient, avec une note explicative, afin de ne pas effacer sa tension ni sa pudeur.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve les idiomes juridiques et corporels du Lévitique tout en les rendant compréhensibles grâce aux notes. Le parallélisme des deux propositions centrales et l’ambiguïté de la sanction sont maintenus.
