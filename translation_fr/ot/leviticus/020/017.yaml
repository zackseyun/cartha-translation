source:
  edition: WLC
  text: וְ/אִ֣ישׁ אֲשֶׁר יִקַּ֣ח אֶת אֲחֹת֡/וֹ בַּת אָבִ֣י/ו א֣וֹ בַת אִ֠מּ/וֹ וְ/רָאָ֨ה אֶת עֶרְוָתָ֜/הּ וְ/הִֽיא תִרְאֶ֤ה אֶת עֶרְוָת/וֹ֙ חֶ֣סֶד ה֔וּא וְ/נִ֨כְרְת֔וּ לְ/עֵינֵ֖י בְּנֵ֣י עַמָּ֑/ם עֶרְוַ֧ת אֲחֹת֛/וֹ גִּלָּ֖ה עֲוֺנ֥/וֹ יִשָּֽׂא־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/017.yaml
  text: If a man takes his sister[a], his father's daughter or his mother's daughter, and sees her nakedness, and she sees his nakedness, it is a disgrace, and they shall be cut off in the sight of the sons of their people. He has uncovered his sister's nakedness[b]; he shall bear his guilt.
translation:
  language: fr
  text: Si un homme prend sa sœur, fille de son père ou fille de sa mère, et voit sa nudité, et si elle voit la sienne, c’est une infamie[a]. Ils seront retranchés[b] sous les yeux des membres de leur peuple. Il a découvert la nudité de sa sœur ; il portera sa faute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le mot hébreu traduit par « infamie » a ici un sens négatif rare : « honte » ou « acte honteux ». Ailleurs, il désigne généralement la bonté ou l’amour fidèle.'
    reason: lexical_alternative
  - marker: b
    text: « Ils seront retranchés » conserve la formule juridique hébraïque sans préciser s’il s’agit de la mort, de l’exclusion ou d’une autre forme de mise à l’écart.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: un homme
  rationale: Conserve le masculin singulier de la formulation juridique hébraïque.
- source_word: יִקַּח
  choice: prend
  rationale: Rend le verbe dans son sens premier sans préciser s’il s’agit d’un mariage ou de relations sexuelles ; la suite du verset définit la transgression.
- source_word: אֲחֹתוֹ בַּת אָבִיו אוֹ בַת אִמּוֹ
  choice: sa sœur, fille de son père ou fille de sa mère
  rationale: Conserve l’explication appositive et inclut explicitement les sœurs de même père ou de même mère.
- source_word: וְרָאָה אֶת עֶרְוָתָהּ וְהִיא תִרְאֶה אֶת עֶרְוָתוֹ
  choice: voit sa nudité et qu’elle voit sa nudité à lui
  rationale: Préserve l’image et l’idiome juridique hébreux de la nudité, tout en distinguant clairement les deux référents en français.
- source_word: חֶסֶד
  choice: une infamie
  rationale: Dans cet emploi négatif exceptionnel, le mot désigne un acte honteux ou déshonorant, et non la bonté ou l’amour fidèle qui constituent son sens habituel.
- source_word: וְנִכְרְתוּ
  choice: ils seront retranchés
  rationale: Conserve la formule juridique biblique et son ambiguïté quant au mode précis de la sanction.
- source_word: לְעֵינֵי בְּנֵי עַמָּם
  choice: sous les yeux des gens de leur peuple
  rationale: Rend l’expression de manière naturelle tout en conservant son caractère public et communautaire.
- source_word: גִּלָּה
  choice: a découvert
  rationale: Maintient l’idiome récurrent du Lévitique concernant la nudité dans les interdits sexuels.
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: il portera sa faute
  rationale: Préserve la formule juridique et théologique, qui englobe la culpabilité et ses conséquences sans réduire le sens à la seule peine.
theological_decisions:
- issue: Sens de חֶסֶד dans ce verset
  choice: 'sens négatif : « une infamie »'
  alternative: « une honte » ou « un acte honteux » ; le sens habituel « bonté/amour fidèle » ne convient pas ici
  rationale: Le contexte légal et punitif impose ici le rare sens négatif, sans effacer le caractère exceptionnel de cet emploi.
- issue: Portée de la peine exprimée par וְנִכְרְתוּ
  choice: conserver « ils seront retranchés » sans définir le mécanisme
  alternative: mise à mort, exclusion ou autre forme de suppression
  rationale: La formule hébraïque ne précise pas ici la modalité exacte ; la traduction garde donc cette tension au lieu de trancher une question débattue.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la formulation juridique hébraïque, mais « sa nudité à lui » lève une ambiguïté référentielle propre au français. Les idiomes « découvrir la nudité », « être retranché » et « porter sa faute » sont conservés pour maintenir les liens lexicaux et la portée théologique du texte.
