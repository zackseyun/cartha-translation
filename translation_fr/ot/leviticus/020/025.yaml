revisions:
- from: Vous ferez donc la distinction entre l’animal pur et l’animal impur, entre l’oiseau impur et l’oiseau pur. Vous[a] ne vous rendrez pas abominables[b] par un animal, par un oiseau ou par tout ce qui rampe sur le sol et que j’ai mis à part pour vous comme impur.
  to: Vous ferez donc la distinction entre l’animal pur et l’animal impur, entre l’oiseau impur et l’oiseau pur. Vous[a] ne vous rendez pas abominables[b] par un animal, par un oiseau ou par tout ce qui rampe sur le sol et que j’ai désigné pour vous comme impur.
  rationale: La révision corrige une glose de note peu exacte et lève une légère ambiguïté dans la dernière proposition. Le présent injonctif « ne vous rendez pas » reflète naturellement la valeur impérative du texte hébreu. Les catégories rituelles et la distinction entre le verbe lié à l’abomination et le vocabulaire de l’impureté sont conservées.
