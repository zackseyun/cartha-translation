  text: וְ/הִבְדַּלְתֶּ֞ם בֵּֽין הַ/בְּהֵמָ֤ה הַ/טְּהֹרָה֙ לַ/טְּמֵאָ֔ה וּ/בֵין הָ/ע֥וֹף הַ/טָּמֵ֖א לַ/טָּהֹ֑ר וְ/לֹֽא תְשַׁקְּצ֨וּ אֶת נַפְשֹֽׁתֵי/כֶ֜ם בַּ/בְּהֵמָ֣ה וּ/בָ/ע֗וֹף וּ/בְ/כֹל֙ אֲשֶׁ֣ר תִּרְמֹ֣שׂ הָֽ/אֲדָמָ֔ה אֲשֶׁר הִבְדַּ֥לְתִּי לָ/כֶ֖ם לְ/טַמֵּֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/025.yaml
  text: So you shall distinguish between the clean animal and the unclean[a], and between the unclean bird and the clean; and you shall not make yourselves detestable by the animal or by the bird or by anything that creeps on the ground[b], which I have set apart for you as unclean.
translation:
  language: fr
  text: Vous ferez donc la distinction entre l’animal pur et l’animal impur, entre l’oiseau impur et l’oiseau pur. Vous[a] ne vous rendez pas abominables[b] par un animal, par un oiseau ou par tout ce qui rampe sur le sol et que j’ai désigné pour vous comme impur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « vos personnes »; l’expression hébraïque signifie ici « vous-mêmes ».
    reason: lexical_alternative
  - marker: b
    text: Ou « répugnants ». Le verbe hébreu appartient au champ de ce qui est abominable ou répugnant; ce n’est pas le verbe habituel signifiant « devenir impur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתֶּם
  choice: Vous ferez donc la distinction
  rationale: Le hifil de בדל exprime l’action d’établir ou de maintenir une distinction. « Faire la distinction » est naturel en français et « donc » rend ici la continuité logique du contexte.
- source_word: הַבְּהֵמָה
  choice: animal
  rationale: Le terme désigne ici une catégorie générale d’animaux terrestres; « animal » est actuel et moins restrictif que « bétail ».
- source_word: הַטְּהֹרָה / הַטְּמֵא / הַטְּמֵאָה / הַטָּהֹר
  choice: pur / impur
  rationale: Ces termes rendent les catégories rituelles du Lévitique sans les réduire à des notions morales ou hygiéniques. En français biblique moderne, « pur/impur » est plus idiomatique que « propre/illéger » ou « souillé » dans ce contexte.
- source_word: הָעוֹף
  choice: oiseau
  rationale: Bien que le terme puisse englober plus largement les créatures volantes, « oiseau » convient naturellement au contexte des classifications alimentaires.
- source_word: וְלֹא תְשַׁקְּצוּ
  choice: vous ne vous rendrez pas abominables
  rationale: Le piel de שׁקץ appartient au champ de ce qui est abominable ou répugnant. Cette formulation conserve la valeur causative et réflexive sans la confondre avec le vocabulaire spécifique de l’impureté.
- source_word: אֶת נַפְשֹׁתֵיכֶם
  choice: vous
  rationale: Dans cette construction, נֶפֶשׁ désigne les personnes elles-mêmes. Le pronom réfléchi français exprime naturellement cet emploi sans suggérer que seule une composante immatérielle serait concernée.
- source_word: בַּבְּהֵמָה וּבָעוֹף
  choice: par un animal, par un oiseau
  rationale: La préposition indique ici le moyen ou ce par quoi les Israélites se rendraient abominables.
- source_word: וּבְכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: ou par tout ce qui rampe sur le sol
  rationale: רמשׂ évoque le déplacement au ras du sol. La formulation reste large et ne lui impose pas la nuance de pullulement associée à un autre vocabulaire hébreu.
- source_word: אֲשֶׁר הִבְדַּלְתִּי לָכֶם לְטַמֵּא
  choice: que j’ai mis à part pour vous comme impur
  rationale: « Mis à part » reprend le sens de בדל, tandis que « comme impur » exprime la désignation classificatoire portée par לְטַמֵּא.
theological_decisions:
- issue: Catégories rituelles ou paraphrase moralisante
  choice: pur/impur comme catégories de pureté propres à l’alliance
  alternative: moralement bon/mauvais ou sain/malsain
  rationale: Le verset porte sur les distinctions de pureté prescrites à Israël. La traduction conserve ces catégories sans leur attribuer une explication morale, médicale ou hygiénique absente du texte.
- issue: Sens de נֶפֶשׁ dans אֶת נַפְשֹׁתֵיכֶם
  choice: les personnes elles-mêmes, rendu par le réfléchi « vous »
  alternative: vos âmes
  rationale: L’hébreu vise ici les personnes dans leur totalité; « vos âmes » risquerait d’introduire une distinction anthropologique que le passage n’exige pas.
- issue: Rapport entre שׁקץ et טמא
  choice: distinguer « se rendre abominable » de la catégorie « impur »
  alternative: traduire les deux notions par le vocabulaire de la souillure
  rationale: Le texte emploie deux racines différentes. Maintenir cette différence préserve la tension entre l’état jugé abominable et la classification rituelle des animaux.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « animal » et « oiseau » rend explicites les deux membres des oppositions hébraïques. « Abominables » est soutenu mais courant dans un contexte cultuel; la note fournit l’alternative plus concrète « répugnants ».
