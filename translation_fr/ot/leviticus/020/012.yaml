source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת כַּלָּת֔/וֹ מ֥וֹת יוּמְת֖וּ שְׁנֵי/הֶ֑ם תֶּ֥בֶל עָשׂ֖וּ דְּמֵי/הֶ֥ם בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/012.yaml
  text: If a man lies with his daughter-in-law[a], both of them shall surely be put to death. They have committed perversion[b]; their blood is upon them.
translation:
  language: fr
  text: Si un homme couche avec la femme de son fils, ils seront tous les deux mis à mort. Ils ont commis une infamie[a] ; leur sang est sur eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une confusion », « une perversion » ou « un acte honteux ». Le terme hébreu תֶּבֶל désigne ici un acte moralement désordonné et infâme.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque signifie que les condamnés portent eux-mêmes la responsabilité de leur mort.
    reason: idiom_explanation
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Si un homme
  rationale: Dans cette formule juridique, l’ensemble introduit naturellement le cas envisagé par « Si un homme », plutôt que par une proposition relative plus littérale.
- source_word: יִשְׁכַּב אֶת
  choice: couche avec
  rationale: Il s’agit ici de l’expression hébraïque usuelle désignant des rapports sexuels. « Coucher avec » reste clair, actuel et proche de l’image du texte source.
- source_word: כַּלָּתוֹ
  choice: la femme de son fils
  rationale: כַּלָּה désigne ici précisément l’épouse du fils. Cette formulation évite l’ambiguïté moderne de « belle-fille », qui peut aussi désigner la fille du conjoint.
- source_word: מוֹת יוּמְתוּ שְׁנֵיהֶם
  choice: ils seront tous les deux mis à mort
  rationale: La construction emphatique infinitif absolu + verbe conjugué exprime la certitude et la force de la sentence. En français juridique naturel, le futur passif, renforcé par « tous les deux », rend fermement le décret sans tournure artificielle.
- source_word: תֶּבֶל עָשׂוּ
  choice: Ils ont commis une infamie
  rationale: תֶּבֶל qualifie l’acte de profondément désordonné et honteux dans ce contexte légal. « Commettre une infamie » exprime cette condamnation morale sans préciser abusivement la nature du désordre.
- source_word: דְּמֵיהֶם בָּם
  choice: leur sang retombe sur eux
  rationale: Cette formulation française conserve l’image du sang tout en exprimant naturellement que les coupables portent eux-mêmes la responsabilité de leur mort.
theological_decisions:
- issue: Sujet masculin de la loi
  choice: « un homme »
  alternative: « quelqu’un » ou « une personne »
  rationale: Le texte hébreu désigne explicitement un homme et la relation interdite avec la femme de son fils. Le genre du sujet appartient donc au contenu du cas juridique.
- issue: Caractérisation morale de תֶּבֶל
  choice: « une infamie »
  alternative: « une confusion », « une perversion » ou « un acte honteux »
  rationale: Le terme hébreu porte lui-même un jugement moral marqué. « Infamie » maintient ce poids sans réduire le mot à une catégorie doctrinale ou psychologique plus précise que le texte.
- issue: Responsabilité exprimée par la formule du sang
  choice: 'Conserver l’image : « leur sang retombe sur eux »'
  alternative: 'Expliciter : « ils sont responsables de leur propre mort »'
  rationale: L’image juridique et théologique du sang fait partie de la formulation hébraïque. La conserver préserve sa force, tandis que la note en explicite la portée.
translation_notes:
  register: Français international moderne, clair et digne. « La femme de son fils » privilégie la précision familiale ; « couche avec » conserve l’euphémisme transparent de l’hébreu. La sentence reste solennelle sans archaïsmes juridiques.
