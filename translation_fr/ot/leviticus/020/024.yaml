  text: וָ/אֹמַ֣ר לָ/כֶ֗ם אַתֶּם֮ תִּֽירְשׁ֣וּ אֶת אַדְמָתָ/ם֒ וַ/אֲנִ֞י אֶתְּנֶ֤/נָּה לָ/כֶם֙ לָ/רֶ֣שֶׁת אֹתָ֔/הּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ אֲנִי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁר הִבְדַּ֥לְתִּי אֶתְ/כֶ֖ם מִן הָֽ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/024.yaml
  text: But I said to you[a], ‘You shall possess their land, and I myself will give it to you to possess’—a land flowing with milk and honey. I am Yahweh your God[d][c][b], who has separated you from the peoples.
translation:
  language: fr
  text: 'Mais je vous ai dit : « C’est vous qui prendrez possession de leur terre[a], et moi, je vous la donnerai pour que vous en preniez possession » : un pays ruisselant de lait et de miel.[b] Je suis Yahweh[c], votre Dieu, qui vous ai séparés des peuples.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « hériterez de leur terre […] pour que vous en héritiez ». Le verbe hébreu peut exprimer aussi bien l’héritage que la prise de possession.'
    reason: lexical_alternative
  - marker: b
    text: L’expression « un pays ruisselant de lait et de miel » évoque l’abondance et la fertilité.
    reason: cultural_note
  - marker: c
    text: 'Hébreu : YHWH, traditionnellement rendu par « le SEIGNEUR ».'
    reason: alternative_reading
  - marker: d
    text: 'Ou : « qui vous ai mis à part des peuples ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Mais je vous ai dit
  rationale: Le waw fait progresser le discours, tandis que « mais » exprime naturellement le contraste avec ce qui précède dans le contexte.
- source_word: תִּירְשׁוּ / לָרֶשֶׁת
  choice: prendre possession / preniez possession
  rationale: Le verbe ירשׁ peut signifier hériter ou prendre possession. Cette formulation conserve ici sa nuance territoriale active ainsi que la répétition du verbe hébreu.
- source_word: אַדְמָתָם
  choice: leur terre
  rationale: Dans ce contexte territorial, אדמה désigne la terre appartenant aux peuples précédemment mentionnés.
- source_word: וַאֲנִי
  choice: et moi
  rationale: Le pronom indépendant met le locuteur divin en relief; « et moi » restitue cette insistance avec naturel.
- source_word: אֶתְּנֶנָּה
  choice: je vous la donnerai
  rationale: Le suffixe féminin renvoie à la terre, présentée comme un don futur de Dieu.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: un pays ruisselant de lait et de miel
  rationale: Cette expression imagée traditionnelle évoque l’abondance et la fertilité; « pays » distingue naturellement אֶרֶץ de אַדְמָה dans la phrase.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: הִבְדַּלְתִּי
  choice: vous ai séparés
  rationale: בדל exprime directement l’action de séparer ou de mettre à part et reprend le thème des distinctions établi dans ce chapitre.
- source_word: הָעַמִּים
  choice: les peuples
  rationale: « Les peuples » rend le pluriel עמים sans lui imposer la nuance politique que pourrait suggérer « les nations ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve explicitement, tandis que « le SEIGNEUR » représente la substitution traditionnelle.
- issue: Nature de la distinction d’Israël
  choice: qui vous ai séparés des peuples
  alternative: qui vous ai mis à part des peuples
  rationale: La traduction garde le langage concret de la séparation sans préciser davantage sa portée théologique; « mis à part » demeure une possibilité lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La construction « C’est vous qui… et moi… » restitue l’opposition emphatique entre le rôle du peuple et le don divin. La répétition de « prendre possession » conserve le parallélisme hébreu malgré une légère lourdeur voulue.
