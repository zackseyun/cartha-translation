source:
  edition: WLC
  text: וִ/הְיִ֤יתֶם לִ/י֙ קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אֲנִ֣י יְהוָ֑ה וָ/אַבְדִּ֥ל אֶתְ/כֶ֛ם מִן הָֽ/עַמִּ֖ים לִ/הְי֥וֹת לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/026.yaml
  text: You shall be holy to me[a], because I, Yahweh, am holy, and I have separated you from the peoples to be mine.
translation:
  language: fr
  text: Vous serez saints pour moi, car moi, Yahweh, je suis saint, et je vous ai séparés des peuples[a] pour que vous soyez à moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des nations ». Le mot hébreu עַמִּים peut désigner des « peuples » ou, selon le contexte, des « nations ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וִהְיִיתֶם
  choice: Vous serez
  rationale: Le parfait qal précédé de la conjonction prend ici, dans ce contexte d’exhortation légale et d’alliance, une valeur prospective et injonctive. « Vous serez » conserve à la fois l’exigence et le résultat attendu, sans alourdir la phrase par un « et » initial.
- source_word: לִי קְדֹשִׁים
  choice: saints pour moi
  rationale: « Saints » rend קְדֹשִׁים sans réduire la notion à la seule pureté morale ou à la seule mise à part cultuelle. « Pour moi » exprime naturellement en français la relation marquée par לִי.
- source_word: כִּי קָדוֹשׁ אֲנִי יְהוָה
  choice: car moi, Yahweh, je suis saint
  rationale: « Car » marque clairement le fondement causal. La construction disloquée « moi, Yahweh, je » conserve l’insistance de l’hébreu sur le locuteur divin tout en restant intelligible en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre plutôt que remplacé par un titre, afin de préserver le nom divin présent dans le texte source.
- source_word: וָאַבְדִּל אֶתְכֶם
  choice: et je vous ai séparés
  rationale: Le verbe בדל désigne l’action de séparer ou de distinguer. Le passé composé exprime une action accomplie dont les effets demeurent, et maintient la distinction lexicale avec קדש, rendu par « saint ».
- source_word: מִן הָעַמִּים
  choice: des peuples
  rationale: עַמִּים désigne des collectivités humaines et peut se traduire par « peuples » ou « nations ». « Peuples » est ici le terme français le plus large et le plus proche du pluriel hébreu.
- source_word: לִהְיוֹת לִי
  choice: pour que vous soyez à moi
  rationale: L’infinitif précédé de ל exprime ici le but ou le résultat de la séparation. « Être à moi » conserve directement le langage d’appartenance et d’alliance.
theological_decisions:
- issue: Exprimer la sainteté d’Israël sans la réduire à la moralité ni à la séparation rituelle
  choice: Conserver « saints » pour קדש et « séparés » pour בדל
  alternative: Traduire les deux notions par « mis à part » ou moraliser קדש par « purs »
  rationale: Le verset relie la sainteté du peuple à celle de Yahweh, puis emploie un autre verbe pour la séparation d’avec les peuples. Deux termes distincts préservent à la fois leur rapport et leur différence.
- issue: Rendre le nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ou Jéhovah
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » le présente comme nom d’alliance sans lui substituer un titre.
- issue: Rendre la relation d’appartenance exprimée par לִי
  choice: « pour moi » au début et « à moi » à la fin
  alternative: Employer partout « m’appartenir » ou « être mien »
  rationale: Les deux formulations françaises gardent le mouvement du texte, de la sainteté orientée vers Dieu à l’appartenance qui résulte de la séparation, sans imposer une explication doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe légèrement solennelle « moi, Yahweh, je suis saint » garde l’emphase de l’hébreu. Le marqueur de note est placé après « peuples », le terme auquel la variante lexicale se rapporte.
