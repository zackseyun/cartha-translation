  text: If a man lies with a male as one lies with a woman[a], both of them have done an abomination; they shall surely be put to death[b]; their blood is on them.
translation:
  language: fr
  text: Si un homme couche avec un mâle comme avec une femme[a], tous deux ont commis une abomination. Ils seront certainement mis à mort[b] ; leur sang retombera sur eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les couchers d’une femme », expression hébraïque désignant les rapports sexuels avec une femme.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « leur sang est sur eux », formule qui signifie qu’ils portent eux-mêmes la responsabilité de leur mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Si un homme
  rationale: Dans cette formulation juridique casuistique, l’ensemble introduit naturellement une condition. « Si un homme » rend ce fonctionnement sans reproduire mécaniquement la conjonction hébraïque.
- source_word: יִשְׁכַּב אֶת
  choice: couche avec
  rationale: Dans ce contexte, שׁכב est un idiome courant désignant les rapports sexuels. « Coucher avec » est naturel en français moderne et reste proche de l’image hébraïque.
- source_word: זָכָר
  choice: un mâle
  rationale: זָכָר signifie « mâle », terme distinct de אִישׁ, « homme ». Ce choix conserve la distinction lexicale explicite du texte source, malgré son caractère moins courant en français.
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: comme on couche avec une femme
  rationale: Le pluriel littéral « les couchers d’une femme » est un idiome désignant les rapports sexuels avec une femme. La formulation choisie en communique le sens tout en conservant l’expression comparative.
- source_word: תּוֹעֵבָה
  choice: une abomination
  rationale: תּוֹעֵבָה est un terme fortement marqué dans le langage moral et cultuel de l’Ancien Testament. « Abomination » en préserve le poids et la cohérence intertextuelle.
- source_word: עָשׂוּ שְׁנֵיהֶם
  choice: tous deux ont commis
  rationale: La formulation garde l’insistance explicite sur les deux participants. En français, « commettre une abomination » est plus idiomatique que « faire une abomination ».
- source_word: מוֹת יוּמָתוּ
  choice: Ils seront mis à mort, oui, mis à mort
  rationale: L’infinitif absolu suivi de la forme verbale passive renforce la certitude ou l’intensité de la peine. La répétition française avec « oui » rend cette emphase sans transformer la construction en simple obligation.
- source_word: דְּמֵיהֶם בָּם
  choice: leur sang retombe sur eux
  rationale: Cet idiome attribue aux intéressés la responsabilité de leur mort. « Leur sang retombe sur eux » est intelligible en français tout en maintenant l’image du sang et la portée juridico-morale.
theological_decisions:
- issue: Traduction d’une prescription juridique moralement et culturellement controversée
  choice: Décrire directement l’acte visé par les termes hébreux, sans l’atténuer ni l’élargir à une catégorie identitaire moderne.
  alternative: Employer des expressions générales comme « actes homosexuels » ou une terminologie fondée sur l’identité ou l’orientation.
  rationale: Le texte hébreu formule une règle à propos d’un acte précis et ne présente pas une catégorie psychologique ou identitaire moderne. La traduction conserve donc la portée propre de l’énoncé sans commentaire doctrinal ajouté.
- issue: Distinction entre אִישׁ et זָכָר
  choice: Conserver « homme » puis « mâle ».
  alternative: Employer « homme » dans les deux cas ou neutraliser l’un des termes.
  rationale: Le texte utilise deux noms différents et explicitement masculins. Maintenir cette distinction respecte la précision lexicale de la source, même si « mâle » est stylistiquement plus marqué en français.
- issue: Sens de דְּמֵיהֶם בָּם
  choice: Traduire l’image par « leur sang retombe sur eux » et signaler en note la possibilité d’expliciter la culpabilité liée au sang.
  alternative: Traduire directement « ils portent la responsabilité de leur mort » ou « leur culpabilité de sang est sur eux ».
  rationale: L’expression hébraïque associe l’image concrète du sang à l’attribution de responsabilité. Le texte principal préserve cette tension, tandis que la note explicite l’autre rendu possible.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La formulation juridique reste ferme sans recourir à un vocabulaire identitaire contemporain. « Mâle » est volontairement conservé pour refléter la distinction hébraïque entre אִישׁ et זָכָר. La tournure emphatique de la peine évite l’archaïsme « ils mourront certainement » tout en représentant l’infinitif absolu.
