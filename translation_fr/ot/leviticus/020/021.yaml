  text: וְ/אִ֗ישׁ אֲשֶׁ֥ר יִקַּ֛ח אֶת אֵ֥שֶׁת אָחִ֖י/ו נִדָּ֣ה הִ֑וא עֶרְוַ֥ת אָחִ֛י/ו גִּלָּ֖ה עֲרִירִ֥ים יִהְיֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/021.yaml
  text: And if a man takes his brother’s wife[a], it is uncleanness; he has uncovered his brother’s nakedness[b]. They shall be childless.
translation:
  language: fr
  text: 'Et si un homme prend la femme de son frère, c’est une impureté[a] : il a découvert la nudité de son frère. Ils seront sans enfants[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une souillure ». Le terme hébreu peut désigner une impureté de nature rituelle ou morale.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, selon une interprétation du jugement : « Ils mourront sans enfants. » L’hébreu dit plus littéralement : « Ils seront sans enfants », sans préciser comment ce jugement s’accomplira.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Et si un homme
  rationale: La conjonction relie ce cas aux lois précédentes, tandis que la relative avec l’imparfait a ici une valeur conditionnelle. Cette formulation conserve à la fois l’enchaînement et le caractère casuistique.
- source_word: יִקַּח אֶת אֵשֶׁת אָחִיו
  choice: prend la femme de son frère
  rationale: לקח signifie littéralement « prendre » et peut, dans ce contexte, évoquer une union conjugale. La formulation retenue préserve cette portée sans préciser davantage la forme de l’union.
- source_word: נִדָּה הִוא
  choice: c’est une souillure
  rationale: נִדָּה peut désigner une impureté rituelle ou morale. Le pronom français « ce » rapporte le jugement à l’union ou à l’acte, sans qualifier personnellement la femme d’impure.
- source_word: עֶרְוַת אָחִיו גִּלָּה
  choice: il a découvert la nudité de son frère
  rationale: Traduction formelle de l’expression lévitique consacrée qui désigne des relations sexuelles interdites, tout en maintenant sa cohérence intertextuelle.
- source_word: עֲרִירִים יִהְיוּ
  choice: Ils seront sans enfants
  rationale: L’adjectif pluriel עֲרִירִים exprime l’absence d’enfants, et le verbe pluriel vise les deux personnes. La traduction n’ajoute aucun mécanisme précis d’exécution du jugement.
theological_decisions:
- issue: Portée du jugement עֲרִירִים יִהְיוּ
  choice: Ils seront sans enfants
  alternative: Ils mourront sans enfants
  rationale: L’hébreu affirme directement qu’ils seront sans enfants, mais ne dit pas explicitement qu’ils mourront ainsi. La traduction conserve cette indétermination au lieu d’intégrer une interprétation du mode d’accomplissement.
- issue: Rapport avec les autres dispositions bibliques concernant la femme d’un frère
  choice: la femme de son frère
  alternative: la femme de son frère encore vivant
  rationale: Le verset ne précise pas ici si le frère est vivant ou mort. La traduction n’ajoute donc aucune restriction destinée à harmoniser explicitement ce texte avec la loi du lévirat.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe juridique reste claire; l’expression « découvrir la nudité » est conservée comme idiome caractéristique du Lévitique. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils expliquent.
