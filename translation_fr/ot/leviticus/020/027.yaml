revisions:
- from: Si un homme ou une femme est médium[a] ou pratique la divination par les esprits[b], cette personne sera mise à mort sans faute. On la lapidera à coups de pierres. Son sang retombera sur elle[c].
  to: Si un homme ou une femme est médium[a] ou devin[b], cette personne devra être mise à mort. On la lapidera à coups de pierres. Elle sera responsable de sa mort[c].
  rationale: La révision remplace le faux sens créé par « sans faute » par « devra être mise à mort », rend les deux substantifs hébreux par deux désignations parallèles de personnes, et clarifie la formule finale sans attribuer au texte une lecture doctrinale. Le singulier distributif (« cette personne », « la », « elle ») correspond naturellement au français après « un homme ou une femme »; la note c conserve le pluriel et l’image de l’hébreu.
