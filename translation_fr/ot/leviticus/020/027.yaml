    issue: « sans faute » pour מות יומת
    rationale: Cette expression française signifie normalement « de façon irréprochable » et ne communique ni la certitude ni le caractère impératif de la mise à mort exprimés par l’infinitif absolu suivi du verbe.
  - severity: medium
    issue: « pratique la divination par les esprits » pour יִדְּעֹנִי
    rationale: Le mot hébreu est ici un substantif parallèle à אוֹב. Cette paraphrase impose une analyse de la pratique et une association explicite aux esprits qui ne sont pas formulées ainsi dans ce terme.
  - severity: low
    issue: 'Note b : « esprit de divination »'
    rationale: Cette alternative ne représente pas clairement le sens usuel de יִדְּעֹנִי dans ce contexte et risque de brouiller la distinction entre les deux termes hébreux.
