base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/027.yaml
  text: And a man or a woman[a], if there is in them a medium or a spiritist, shall surely be put to death; they shall stone them with stones[c][b]. Their blood is on them.
translation:
  language: fr
  text: Si un homme ou une femme est médium[a] ou devin[b], cette personne devra être mise à mort. On la lapidera à coups de pierres. Elle sera responsable de sa mort[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut désigner l’esprit associé à la consultation des morts ou, par extension, la personne qui le consulte.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne un praticien de divination ou de consultation des esprits. On peut aussi traduire par « spirite » ou « nécromancien », selon l’analyse du terme dans son contexte.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « Leur sang est sur eux. » Cette formule juridique indique qu’ils portent la responsabilité de leur propre mort.'
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אֽוֹ אִשָּׁה
  choice: Si un homme ou une femme
  rationale: Conserve la mention explicite des deux sexes. Dans ce contexte juridique, la conjonction initiale introduit naturellement le cas envisagé et n’a pas besoin d’être rendue par « et ».
- source_word: כִּי יִהְיֶה בָהֶם
  choice: est … ou pratique
  rationale: La tournure hébraïque est littéralement « s’il se trouve en eux », avec un verbe singulier et un pronom pluriel renvoyant distributivement à l’homme ou à la femme. Le français exprime plus naturellement le cas juridique au singulier, sans trancher davantage que le contexte sur la nature exacte du phénomène.
- source_word: אוֹב
  choice: médium
  rationale: Dans ce cadre légal, le terme peut désigner un esprit lié à la consultation des morts ou, par extension, la personne qui sert de médium. « Médium » est actuel, compréhensible et adapté au contexte, tandis qu’une note conserve l’ambiguïté lexicale.
- source_word: יִדְּעֹנִי
  choice: pratique la divination par les esprits
  rationale: Le terme est associé à la recherche d’un savoir occulte par les esprits. Cette formulation évite « sorcier », qui évoque facilement l’imaginaire fantastique moderne, et rend clairement la pratique visée.
- source_word: מוֹת יוּמָתוּ
  choice: sera mise à mort sans faute
  rationale: Rend la construction intensive formée de l’infinitif absolu et du verbe conjugué, qui exprime ici la certitude et le caractère impératif de la peine capitale.
- source_word: בָּאֶבֶן יִרְגְּמוּ אֹתָם
  choice: On la lapidera à coups de pierres
  rationale: « Lapider » exprime précisément le mode d’exécution, et « à coups de pierres » maintient la mention explicite de l’instrument dans l’hébreu. Le singulier reprend naturellement « cette personne » en français.
- source_word: דְּמֵיהֶם בָּם
  choice: Son sang retombera sur elle
  rationale: Conserve l’image du sang tout en employant une formule française intelligible qui attribue à la personne condamnée la responsabilité juridique de sa mort.
theological_decisions:
- issue: Sens des termes relatifs à la consultation des esprits
  choice: Employer « médium » et « pratique la divination par les esprits » dans le texte principal
  alternative: Traduire par « esprit de revenant » et « esprit de divination », ou par « nécromancien » et « devin »
  rationale: Les substantifs hébreux peuvent désigner soit des entités spirituelles, soit les personnes ou pratiques qui leur sont associées. Le contexte pénal vise manifestement la personne concernée, mais ne permet pas d’établir avec certitude toute la taxonomie ancienne; les notes maintiennent donc l’ambiguïté réelle.
- issue: Formulation explicite homme-femme
  choice: Conserver « un homme ou une femme »
  alternative: Employer le terme général « quiconque »
  rationale: Le texte hébreu nomme expressément les deux sexes; la traduction garde cette forme sans la neutraliser.
- issue: Responsabilité exprimée par la formule du sang
  choice: Maintenir l’image dans « Son sang retombera sur elle »
  alternative: Expliciter directement « Elle sera responsable de sa propre mort »
  rationale: La formule juridique attribue la responsabilité de la peine au coupable. Le maintien de la métaphore préserve la force et la tension du texte, tandis que la note en explique la fonction.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La formulation juridique reste ferme; « cette personne » évite une rupture entre le couple générique « un homme ou une femme » et les pronoms français. Les termes occultes sont rendus sans vocabulaire archaïque ni associations issues de la fantasy moderne.
