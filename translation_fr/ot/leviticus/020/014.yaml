source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִקַּ֧ח אֶת אִשָּׁ֛ה וְ/אֶת אִמָּ֖/הּ זִמָּ֣ה הִ֑וא בָּ/אֵ֞שׁ יִשְׂרְפ֤וּ אֹת/וֹ֙ וְ/אֶתְ/הֶ֔ן וְ/לֹא תִהְיֶ֥ה זִמָּ֖ה בְּ/תוֹכְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/014.yaml
  text: If a man takes a woman and her mother[a], it is depravity. They shall burn him and them with fire[c][b], so that there will not be depravity among you.
translation:
  language: fr
  text: Si un homme prend une femme et sa mère[a], c’est une infamie[b]. On brûlera par le feu l’homme et les deux femmes[c], afin qu’il n’y ait pas d’infamie parmi vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « épouse une femme et sa mère ». Dans ce contexte juridique, le verbe hébreu traduit par « prend » peut évoquer le mariage, sans toutefois le préciser expressément.
    reason: lexical_alternative
  - marker: b
    text: Ou « conduite honteuse », « dépravation » ou « outrage ». Le terme hébreu désigne ici une grave faute sexuelle.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « lui et elles » ; « elles » désigne la femme et sa mère.'
    reason: translation_clarity
lexical_decisions:
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom hébreu est masculin singulier et désigne ici l’homme qui commet l’acte interdit.
- source_word: יִקַּח
  choice: prend
  rationale: Le verbe signifie littéralement « prendre » et peut, dans un contexte juridique, désigner une union matrimoniale. « Prend » conserve l’étendue de sens de l’hébreu sans imposer explicitement l’idée de mariage.
- source_word: אִשָּׁה
  choice: une femme
  rationale: Le terme peut signifier « femme » ou « épouse ». Le rendu « une femme » évite de préciser un statut matrimonial que la formulation hébraïque ne marque pas expressément.
- source_word: זִמָּה
  choice: infamie
  rationale: Dans la législation sexuelle du Lévitique, le mot qualifie un acte gravement honteux et moralement répréhensible. « Infamie » restitue cette forte condamnation dans un registre actuel et digne.
- source_word: בָּאֵשׁ יִשְׂרְפוּ
  choice: on les brûlera par le feu
  rationale: La tournure française impersonnelle garde la formulation juridique active de l’hébreu sans introduire un agent absent du texte. « Par le feu » exprime le moyen indiqué par la préposition hébraïque.
- source_word: אֹתוֹ וְאֶתְהֶן
  choice: lui et les deux femmes
  rationale: L’hébreu dit littéralement « lui et elles » ; le pronom féminin pluriel renvoie à la femme et à sa mère. Le français explicite ce référent pour éviter toute ambiguïté.
- source_word: וְלֹא תִהְיֶה זִמָּה בְּתוֹכְכֶם
  choice: afin qu’il n’y ait pas d’infamie parmi vous
  rationale: « Afin que » rend naturellement la portée finale de la clause, et « parmi vous » correspond à l’idée de ce qui se trouve au sein de la communauté.
theological_decisions:
- issue: Nature de la relation exprimée par « prend une femme et sa mère »
  choice: Conserver la formulation large « prend une femme et sa mère ».
  alternative: « épouse une femme et sa mère » ou « prend pour femmes une femme et sa mère »
  rationale: Le verbe לקח peut évoquer le mariage dans un contexte juridique, mais aucun terme matrimonial explicite n’apparaît ici. Le rendu retenu préserve cette ambiguïté au lieu de restreindre le texte à une seule définition juridique.
- issue: Forme de la peine prescrite
  choice: 'Employer une formulation active impersonnelle : « On les brûlera par le feu ».'
  alternative: « Lui et elles seront brûlés par le feu. »
  rationale: Le verbe hébreu est actif à la troisième personne du pluriel. La tournure avec « on » est naturelle en français juridique et n’ajoute aucune précision sur les exécuteurs.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de la formulation juridique hébraïque, tandis que « on » et l’explicitation « les deux femmes » assurent une lecture naturelle et sans ambiguïté.
