source:
  edition: WLC
  text: וְ/אִ֡ם הַעְלֵ֣ם יַעְלִימֽוּ֩ עַ֨ם הָ/אָ֜רֶץ אֶת עֵֽינֵי/הֶם֙ מִן הָ/אִ֣ישׁ הַ/ה֔וּא בְּ/תִתּ֥/וֹ מִ/זַּרְע֖/וֹ לַ/מֹּ֑לֶךְ לְ/בִלְתִּ֖י הָמִ֥ית אֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/004.yaml
  text: But if the people of the land deliberately close their eyes to that man when he gives some of his offspring to Molech[a], so as not to put him to death[c][b],
translation:
  language: fr
  text: Mais si le peuple du pays ferme délibérément les yeux[a] sur cet homme, lorsqu’il donne l’un de ses enfants[b] à Molek[c], afin de ne pas le mettre à mort,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « cachent leurs yeux de cet homme »; il s’agit de l’ignorer volontairement et complètement.
    reason: lexical_alternative
  - marker: b
    text: « Enfants » traduit littéralement « semence »; le terme désigne ici l’un de ses enfants.
    reason: lexical_alternative
  - marker: c
    text: Molek peut désigner une divinité ou un type de rite sacrificiel impliquant des enfants; selon une autre lecture, le mot pourrait signifier « le roi ».
    reason: alternative_reading
lexical_decisions:
- source_word: הַעְלֵם יַעְלִימוּ
  choice: ferme délibérément les yeux
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’action. Associée à « leurs yeux », l’expression désigne le fait d’ignorer volontairement; cette formulation française conserve l’image et sa valeur intensive.
- source_word: עַם הָאָרֶץ
  choice: le peuple du pays
  rationale: Dans ce contexte juridique, l’expression désigne la population du pays ou de la communauté, sans impliquer nécessairement une classe sociale particulière.
- source_word: אֶת עֵינֵיהֶם מִן הָאִישׁ הַהוּא
  choice: les yeux sur cet homme
  rationale: L’hébreu dit littéralement « leurs yeux loin de cet homme ». L’expression idiomatique française « fermer les yeux sur » en restitue naturellement le sens.
- source_word: בְּתִתּוֹ מִזַּרְעוֹ
  choice: lorsqu’il livre quelqu’un de sa descendance
  rationale: 'La préposition מִן a ici une valeur partitive: il s’agit de l’un de ses descendants, et non nécessairement de toute sa descendance. « Livre » convient à l’acte cultuel exprimé par « donner » sans préciser au-delà du texte la forme exacte du rite.'
- source_word: לַמֹּלֶךְ
  choice: à Molek
  rationale: Dans Lévitique 18:21 et 20:2-5, la vocalisation massorétique et le contexte cultuel favorisent le nom ou la désignation « Molek ». La translittération évite de trancher dans le corps du texte la nature exacte du référent.
- source_word: לְבִלְתִּי הָמִית אֹתוֹ
  choice: afin de ne pas le mettre à mort
  rationale: La construction exprime le but ou le résultat du refus d’agir. « Mettre à mort » correspond au registre juridique du passage.
theological_decisions:
- issue: Identification du référent לַמֹּלֶךְ
  choice: Molek
  alternative: le roi
  rationale: Le contexte immédiat soutient fortement la désignation cultuelle « Molek », mais la note conserve l’autre lecture philologiquement possible et ne définit pas avec certitude s’il s’agit d’une divinité ou du nom d’un rite.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure conditionnelle inachevée du verset, qui se poursuit au verset suivant. L’image hébraïque des yeux est maintenue sous une forme idiomatique française, tandis que les ambiguïtés liées à « Molek » sont signalées en note.
