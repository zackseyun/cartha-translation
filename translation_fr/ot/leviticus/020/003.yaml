  text: וַ/אֲנִ֞י אֶתֵּ֤ן אֶת פָּנַ/י֙ בָּ/אִ֣ישׁ הַ/ה֔וּא וְ/הִכְרַתִּ֥י אֹת֖/וֹ מִ/קֶּ֣רֶב עַמּ֑/וֹ כִּ֤י מִ/זַּרְע/וֹ֙ נָתַ֣ן לַ/מֹּ֔לֶךְ לְמַ֗עַן טַמֵּא֙ אֶת מִקְדָּשִׁ֔/י וּ/לְ/חַלֵּ֖ל אֶת שֵׁ֥ם קָדְשִֽׁ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/003.yaml
  text: I myself will set my face against that man and cut him off from among his people[a], because he has given some of his offspring to Molech, so as to defile my sanctuary and to profane my holy name.
translation:
  language: fr
  text: Moi-même, je tournerai mon visage contre cet homme et je le retrancherai du milieu de son peuple, parce qu’il a donné l’un de ses descendants à Molek[a], afin de souiller mon sanctuaire et de profaner mon saint nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parce qu’il a sacrifié l’un de ses enfants à Molek ». Littéralement, l’hébreu dit : « parce qu’il a donné l’un de ses descendants à Molek » ; le sens sacrificiel ressort du contexte plus large.'
    reason: Alternative lexicale et explicitation contextuelle de l’acte envers Molek.
lexical_decisions:
- source_word: וַאֲנִי
  choice: Moi-même
  rationale: Le pronom indépendant est emphatique et souligne l’intervention personnelle de Dieu.
- source_word: אֶתֵּן אֶת־פָּנַי בָּאִישׁ הַהוּא
  choice: je tournerai ma face contre cet homme
  rationale: Cette formulation française conserve l’image hébraïque et exprime clairement l’opposition divine délibérée.
- source_word: וְהִכְרַתִּי אֹתוֹ מִקֶּרֶב עַמּוֹ
  choice: et je le retrancherai du milieu de son peuple
  rationale: « Retrancher » préserve la portée judiciaire de כרת sans préciser abusivement la forme du châtiment; « du milieu de » reflète מקרב.
- source_word: מִזַּרְעוֹ
  choice: l’un de ses descendants
  rationale: Le מן partitif indique qu’il s’agit d’une partie de sa descendance; au singulier collectif, « l’un de ses descendants » est naturel en français et convient au contexte.
- source_word: נָתַן לַמֹּלֶךְ
  choice: a donné … à Molek
  rationale: Le verbe signifie littéralement « donner »; cette traduction n’explicite pas dans le texte principal le sacrifice que le contexte laisse entendre.
- source_word: לְמַעַן טַמֵּא
  choice: souillant ainsi
  rationale: למען peut exprimer ici le but ou le résultat. Cette tournure française maintient ce lien sans attribuer avec certitude une intention psychologique explicite.
- source_word: מִקְדָּשִׁי
  choice: mon sanctuaire
  rationale: « Sanctuaire » est le terme français précis et usuel dans ce contexte cultuel.
- source_word: וּלְחַלֵּל אֶת־שֵׁם קָדְשִׁי
  choice: et profanant mon saint nom
  rationale: « Profaner » rend la gravité cultuelle et théologique de חלל appliqué au nom de Dieu.
- source_word: אִישׁ
  choice: homme
  rationale: Le terme désigne ici un contrevenant masculin singulier déterminé; « cet homme » conserve cette précision.
theological_decisions:
- issue: Nature de l’acte accompli pour Molek
  choice: Conserver « a donné l’un de ses descendants à Molek » dans le texte principal.
  alternative: « a sacrifié l’un de ses enfants à Molek »
  rationale: Le contexte indique fortement une offrande sacrificielle d’enfant, mais le verbe de ce verset est simplement « donner ». La formulation choisie respecte cette donnée lexicale et la note explicite l’interprétation contextuelle.
- issue: Sens de לְמַעַן devant les deux infinitifs
  choice: Employer « souillant ainsi … et profanant » pour laisser ouverte une nuance de résultat ou d’effet visé.
  alternative: « afin de souiller … et de profaner »
  rationale: למען marque souvent le but, mais une formulation strictement finale pourrait suggérer que souiller le sanctuaire était l’intention consciente directe de l’offrant. Le français choisi conserve le lien causal-téléologique sans trancher excessivement.
- issue: Nature du jugement exprimé par כרת
  choice: Traduire par « retrancherai » sans préciser davantage.
  alternative: « ferai mourir » ou « exclurai »
  rationale: La formule peut porter une sanction divine grave, mais le verset n’en précise pas ici le mécanisme. « Retrancher » garde la tension judiciaire et théologique.
translation_notes:
  register: Français international moderne, digne et lisible. L’image de la face divine et le verbe judiciaire « retrancher » sont conservés pour leur poids théologique, tandis que la syntaxe reste naturelle. Le nom מֹלֶךְ est translittéré « Molek », forme proche de l’hébreu.
