base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/025.yaml
  text: Then he took the fat[a], and the fat tail, and all the fat that was on the entrails, and the lobe of the liver, and the two kidneys with their fat, and the right thigh.
translation:
  language: fr
  text: Puis il prit la graisse, la queue grasse, toute la graisse qui est sur les entrailles, le lobe du foie[a], les deux reins avec leur graisse, et la cuisse droite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’appendice du foie ». Le terme hébreu désigne une partie précise retirée au cours du rite sacrificiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Puis il prit
  rationale: Le waw consécutif fait progresser le récit; « Puis » exprime naturellement la succession en français.
- source_word: הַחֵלֶב
  choice: la graisse
  rationale: Équivalent courant du terme sacrificiel désignant les parties grasses réservées.
- source_word: הָאַלְיָה
  choice: la queue grasse
  rationale: Le terme désigne la queue riche en graisse des moutons à large queue, et non une queue quelconque.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: toute la graisse qui recouvre les entrailles
  rationale: קֶרֶב renvoie ici aux organes internes; « recouvre » rend idiomatiquement la relation spatiale exprimée par עַל.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: le lobe du foie
  rationale: Formulation française claire pour la partie précise du foie retirée lors du rite; l'identification anatomique exacte demeure discutée et fait l'objet d'une note.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: les deux reins
  rationale: Équivalent anatomique direct qui préserve explicitement le nombre.
- source_word: חֶלְבְּהֶן
  choice: avec leur graisse
  rationale: Cette formulation relie naturellement aux reins la graisse qui leur est associée.
- source_word: שׁוֹק הַיָּמִין
  choice: la cuisse droite
  rationale: שׁוֹק désigne une portion de la patte, souvent comprise ici comme la cuisse dans le contexte du découpage sacrificiel.
