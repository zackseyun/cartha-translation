    issue: Référent de « avec lui » ambigu en français
    rationale: Dans « Aaron et ses fils avec lui », le pronom peut grammaticalement sembler renvoyer à un autre élément ou produire une légère lourdeur. Le pronom hébreu renvoie naturellement à Aaron; « ses fils avec Aaron » le rend sans ambiguïté.
  - severity: low
    issue: « destiné au sacrifice » ajoute une nuance de destination
    rationale: פַּר הַחַטָּאת est littéralement le taureau du sacrifice/offrande חטאת. « Destiné au » reste compréhensible, mais « du sacrifice pour le péché » reproduit plus directement le lien syntaxique sans ajouter l’idée de destination.
