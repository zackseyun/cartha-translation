  text: קַ֤ח אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו אִתּ֔/וֹ וְ/אֵת֙ הַ/בְּגָדִ֔ים וְ/אֵ֖ת שֶׁ֣מֶן הַ/מִּשְׁחָ֑ה וְ/אֵ֣ת פַּ֣ר הַֽ/חַטָּ֗את וְ/אֵת֙ שְׁנֵ֣י הָֽ/אֵילִ֔ים וְ/אֵ֖ת סַ֥ל הַ/מַּצּֽוֹת־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/002.yaml
  text: Take Aaron and his sons with him[a], and the garments, and the anointing oil, and the bull of the sin offering, and the two rams, and the basket of unleavened bread.
translation:
  language: fr
  text: Prends Aaron et ses fils avec Aaron, ainsi que les vêtements, l’huile d’onction, le taureau du sacrifice pour le péché[a], les deux béliers et la corbeille de pains sans levain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le taureau du sacrifice de purification ». Le terme hébreu peut désigner le sacrifice associé au péché et à la purification rituelle.
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  choice: Prends
  rationale: Impératif masculin singulier de לקח. « Prends » rend directement l’ordre sans ajouter une idée de déplacement que le contexte seul pourrait préciser.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Transcription française traditionnelle du nom propre.
- source_word: בָּנָיו אִתּוֹ
  choice: ses fils avec lui
  rationale: Conserve explicitement אִתּוֹ, dont le pronom renvoie naturellement à Aaron, même si la tournure garde une légère redondance conforme à l’hébreu.
- source_word: הַבְּגָדִים
  choice: les vêtements
  rationale: Terme courant et digne qui préserve la valeur générale de בגד sans introduire le terme plus technique « ornements sacerdotaux ».
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: l’huile d’onction
  rationale: Expression française naturelle correspondant au groupe construit « huile d’onction » et conservant sa portée rituelle.
- source_word: פַּר הַחַטָּאת
  choice: le taureau destiné au sacrifice pour le péché
  rationale: פַּר désigne un taureau et חַטָּאת, dans ce contexte sacrificiel, l’offrande liée au péché ou à la purification. « Destiné au » exprime naturellement le rapport entre l’animal et le sacrifice.
- source_word: שְׁנֵי הָאֵילִים
  choice: les deux béliers
  rationale: Équivalence directe du numéral et du nom dans un contexte sacrificiel.
- source_word: סַל הַמַּצּוֹת
  choice: la corbeille de pains sans levain
  rationale: « Pains sans levain » rend le pluriel מַצּוֹת sans préciser indûment leur forme; « corbeille » est naturel pour סַל.
theological_decisions:
- issue: Sens de חַטָּאת dans le vocabulaire sacrificiel
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le contexte exige le sens d’une offrande sacrificielle, mais le terme peut mettre en jeu à la fois le péché et la purification rituelle. Le texte principal retient la formulation traditionnelle et largement intelligible, tandis que la note préserve l’autre analyse reconnue.
translation_notes:
  register: Français international moderne, clair et digne. La coordination hébraïque répétée est allégée par « ainsi que » et par une énumération naturelle, tandis que « ses fils avec lui » conserve une précision explicite de l’original.
