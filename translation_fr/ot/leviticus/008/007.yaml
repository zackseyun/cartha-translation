  text: וַ/יִּתֵּ֨ן עָלָ֜י/ו אֶת הַ/כֻּתֹּ֗נֶת וַ/יַּחְגֹּ֤ר אֹת/וֹ֙ בָּֽ/אַבְנֵ֔ט וַ/יַּלְבֵּ֤שׁ אֹת/וֹ֙ אֶֽת הַ/מְּעִ֔יל וַ/יִּתֵּ֥ן עָלָ֖י/ו אֶת הָ/אֵפֹ֑ד וַ/יַּחְגֹּ֣ר אֹת֗/וֹ בְּ/חֵ֨שֶׁב֙ הָֽ/אֵפֹ֔ד וַ/יֶּאְפֹּ֥ד ל֖/וֹ בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/007.yaml
  text: And he put the tunic on him[a], and fastened him with the sash, and clothed him with the robe, and put the ephod on him, and fastened it on him with the skillfully woven band of the ephod[b], and tied the ephod to him with it.
translation:
  language: fr
  text: Il lui mit la tunique, le ceignit de la ceinture, le revêtit de la robe, lui mit l’éphod, le ceignit de la bande ouvragée de l’éphod[a], puis attacha l’éphod à lui au moyen de celle-ci[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la bande décorée de l’éphod » ou « la ceinture de l’éphod ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu employé ici est rare et dérive du mot « éphod » ; il indique probablement que l’éphod fut maintenu sur Aaron au moyen de sa bande.
    reason: cultural_note
lexical_decisions:
- source_word: כֻּתֹּנֶת
  choice: tunique
  rationale: Désigne le vêtement sacerdotal de base porté près du corps ; « tunique » est précis, courant et adapté au contexte antique.
- source_word: אַבְנֵט
  choice: ceinture
  rationale: Il s’agit d’une bande d’étoffe nouée autour de la taille. « Ceinture » est ici plus naturel en français moderne que « écharpe » ou « baudrier ».
- source_word: מְעִיל
  choice: robe
  rationale: Désigne le vêtement extérieur porté par-dessus la tunique ; « robe » conserve le caractère ample et cérémoniel du vêtement.
- source_word: אֵפֹד
  choice: éphod
  rationale: Ce vêtement sacerdotal spécialisé n’a pas d’équivalent français exact ; la translittération préserve sa spécificité cultuelle.
- source_word: חֵשֶׁב הָאֵפֹד
  choice: bande tissée de l’éphod
  rationale: Dans ce contexte, חֵשֶׁב désigne la bande intégrée ou associée à l’éphod et servant à le maintenir. « Bande tissée » exprime sa forme et sa confection sans lui imposer une description trop précise.
- source_word: וַיַּחְגֹּר אֹתוֹ בָּאַבְנֵט
  choice: noua la ceinture autour de sa taille
  rationale: חגר décrit l’action de ceindre quelqu’un. Cette formulation française actuelle rend clairement le geste sans recourir à l’expression vieillie « le ceignit ».
- source_word: וַיֶּאְפֹּד לוֹ בּוֹ
  choice: l’attacha sur lui avec elle
  rationale: Le verbe rare, formé sur אֵפֹד, décrit vraisemblablement la fixation de l’éphod sur Aaron au moyen de sa bande ; le pronom final renvoie à cette bande.
theological_decisions:
- issue: Terminologie des vêtements sacerdotaux
  choice: Conserver le terme technique « éphod » tout en traduisant les vêtements plus courants par « tunique », « ceinture » et « robe ».
  alternative: Décrire l’éphod comme un « vêtement semblable à un tablier » ou un « gilet sacerdotal ».
  rationale: Le texte décrit un rite d’investiture précis. La translittération évite de réduire l’éphod à une forme vestimentaire incertaine, tandis que les autres termes restent immédiatement compréhensibles.
- issue: Sens du verbe dénominatif וַיֶּאְפֹּד
  choice: Le comprendre comme l’action d’attacher l’éphod à Aaron au moyen de sa bande.
  alternative: 'Rendre plus littéralement mais obscurément : « il l’éphoda avec elle » ou reprendre simplement « il le ceignit ».'
  rationale: Le contexte immédiat indique que la bande sert à maintenir l’éphod. La traduction explicite cette relation fonctionnelle tout en signalant dans une note que le verbe hébreu est rare.
translation_notes:
  register: Français international moderne, digne et lisible. La succession des gestes rituels est conservée, mais la phrase est divisée en deux pour éviter une accumulation lourde. « Noua la ceinture autour de sa taille » rend l’action concrètement, et la répétition d’« éphod » limite l’ambiguïté des pronoms.
