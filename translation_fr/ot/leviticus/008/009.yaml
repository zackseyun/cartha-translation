id: LEV.8.9
reference: Leviticus 8:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם אֶת הַ/מִּצְנֶ֖פֶת עַל רֹאשׁ֑/וֹ וַ/יָּ֨שֶׂם עַֽל הַ/מִּצְנֶ֜פֶת אֶל מ֣וּל פָּנָ֗י/ו אֵ֣ת צִ֤יץ הַ/זָּהָב֙ נֵ֣זֶר הַ/קֹּ֔דֶשׁ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/009.yaml
  text: And he put the turban on his head[a], and on the front of the turban he placed the gold plate, the holy crown, just as Yahweh had commanded Moses.
translation:
  language: fr
  text: Il posa le turban sur sa tête, puis il plaça sur le devant du turban la plaque d’or, le diadème sacré[a], exactement comme Yahweh l’avait ordonné à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la couronne sainte ».
    reason: Alternative lexicale pour נֵזֶר הַקֹּדֶשׁ, qui peut être rendu par « diadème sacré » ou, plus littéralement, par « couronne sainte ».
lexical_decisions:
- source_word: מִצְנֶפֶת
  choice: turban
  rationale: Désigne la coiffure particulière du grand prêtre. « Turban » est précis, courant en français et adapté au contexte des vêtements sacerdotaux.
- source_word: אֶל מוּל פָּנָיו
  choice: sur le devant du turban
  rationale: L’expression situe l’ornement sur la partie antérieure de la coiffure. Cette formulation française évite de laisser croire que la plaque était simplement placée devant Aaron sans être fixée au turban.
- source_word: צִיץ
  choice: plaque
  rationale: Bien que le mot puisse désigner ailleurs une fleur ou un ornement floral, il désigne ici l’objet d’or fixé au turban sacerdotal, décrit en Exode 28.36.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: le diadème sacré
  rationale: L’expression apposée identifie la plaque comme l’emblème consacré de la fonction sacerdotale. « Diadème » convient à un insigne porté sur la tête, tandis que « sacré » exprime naturellement הַקֹּדֶשׁ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme conserve le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: וַיָּשֶׂם ... וַיָּשֶׂם
  choice: posa… plaça
  rationale: Les deux formes reprennent le même verbe hébreu. Une légère variation en français rend distinctement l’action de coiffer Aaron puis celle de fixer la plaque, sans changer le sens fondamental.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: exactement comme Yahweh l’avait ordonné à Moïse
  rationale: « Exactement comme » fait ressortir la conformité aux instructions divines; le plus-que-parfait situe naturellement en français l’ordre avant son exécution.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le nom divin. « Yahweh » en préserve le caractère personnel et évite de le remplacer par un titre.
- issue: Valeur de נֵזֶר הַקֹּדֶשׁ
  choice: le diadème sacré
  alternative: la couronne sainte
  rationale: Le contexte sacerdotal présente la plaque comme un insigne consacré plutôt que comme une couronne royale ordinaire. La variante littérale reste signalée en note afin de préserver l’étendue lexicale de נֵזֶר.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’enchaînement narratif hébreu tout en évitant une répétition pesante. Le marqueur de note est placé après l’expression qu’il explique.
