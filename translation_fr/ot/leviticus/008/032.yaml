  text: And what remains of the meat and of the bread you shall burn with fire[a].
translation:
  language: fr
  text: Vous brûlerez dans le feu ce qui restera de la viande[a] et du pain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la chair » au lieu de « de la viande ». Le mot hébreu signifie littéralement « chair », mais il désigne ici la chair d’un animal offert en sacrifice et destinée à être mangée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: ce qui restera
  rationale: Le participe niphal substantivé désigne ce qui subsiste. Le futur français convient naturellement à cette instruction portant sur les restes après le repas rituel.
- source_word: בַּבָּשָׂר
  choice: de la viande
  rationale: בָּשָׂר signifie littéralement « chair », mais désigne ici la chair animale destinée à être mangée; « viande » est donc le terme français courant le plus précis dans ce contexte sacrificiel.
- source_word: וּבַלָּחֶם
  choice: et du pain
  rationale: לֶחֶם est le terme usuel pour le pain; la construction française coordonnée conserve le parallélisme avec « de la viande ».
- source_word: בָּאֵשׁ
  choice: dans le feu
  rationale: La préposition ב peut exprimer ici la sphère ou le moyen. « Dans le feu » est une formulation française naturelle qui reste proche de l’image hébraïque.
- source_word: תִּשְׂרֹפוּ
  choice: vous brûlerez
  rationale: L’imparfait hébreu à la deuxième personne du pluriel a une valeur directive dans ce contexte légal. Le futur français exprime dignement et naturellement cette prescription.
