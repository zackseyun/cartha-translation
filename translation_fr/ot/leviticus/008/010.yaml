source:
  edition: WLC
  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת שֶׁ֣מֶן הַ/מִּשְׁחָ֔ה וַ/יִּמְשַׁ֥ח אֶת הַ/מִּשְׁכָּ֖ן וְ/אֶת כָּל אֲשֶׁר בּ֑/וֹ וַ/יְקַדֵּ֖שׁ אֹתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/010.yaml
  text: Then Moses took the anointing oil and anointed the tabernacle and all that was in it[a], and consecrated them.
translation:
  language: fr
  text: Puis Moïse prit l’huile d’onction, en oignit le tabernacle et tout ce qui s’y trouvait, et les consacra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les sanctifia » ou « les rendit saints ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Puis Moïse prit
  rationale: Le wayyiqtol fait progresser le récit. « Puis » en exprime naturellement la succession, tandis que « prit » conserve le sens simple du verbe.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: l’huile d’onction
  rationale: Cette construction désigne l’huile employée pour l’onction. « Huile d’onction » est l’expression française courante et n’ajoute pas ici l’adjectif « sainte », absent du verset.
- source_word: וַיִּמְשַׁח
  choice: en oignit
  rationale: « Oindre » est le terme rituel précis. Le pronom « en » indique naturellement en français que Moïse employa cette huile pour oindre le tabernacle et son contenu.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: « Tabernacle » est le terme technique établi pour la demeure-sanctuaire dans ce contexte cultuel.
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: tout ce qui s’y trouvait
  rationale: Cette formulation française naturelle exprime l’ensemble du contenu et du mobilier du tabernacle sans restreindre la portée de l’hébreu.
- source_word: וַיְקַדֵּשׁ אֹתָם
  choice: et les consacra
  rationale: Dans ce contexte sacerdotal, קדשׁ signifie mettre à part comme saint. « Consacrer » rend clairement cette action rituelle; le pluriel renvoie au tabernacle et à tout ce qui s’y trouvait.
theological_decisions:
- issue: Sens de קדשׁ dans un contexte rituel sacerdotal
  choice: les consacra
  alternative: les sanctifia / les rendit saints
  rationale: « Consacra » exprime la mise à part cultuelle sans imposer une nuance doctrinale ultérieure. Une note conserve les autres formulations possibles du sens hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « en oignit » évite une répétition lourde tout en maintenant explicitement le lien avec l’huile d’onction. Le terme cultuel établi « tabernacle » est conservé.
