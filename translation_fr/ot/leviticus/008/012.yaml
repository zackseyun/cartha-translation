  text: Then he poured some of the anointing oil on Aaron’s head and anointed him to consecrate him.
translation:
  language: fr
  text: Puis il versa de l’huile d’onction sur la tête d’Aaron et l’oignit pour le consacrer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצֹק
  choice: Puis il versa
  rationale: Le verbe יצק désigne couramment l’action de verser un liquide. « Puis » rend naturellement la progression narrative du waw consécutif.
- source_word: מִשֶּׁמֶן הַמִּשְׁחָה
  choice: de l’huile d’onction
  rationale: 'La préposition מִן a ici une valeur partitive : Moïse verse une certaine quantité de l’huile destinée à l’onction. En français, l’article partitif « de l’ » exprime ce sens sans ajout explicatif.'
- source_word: עַל רֹאשׁ אַהֲרֹן
  choice: sur la tête d’Aaron
  rationale: Rendu direct et idiomatique de la relation locative exprimée par עַל.
- source_word: וַיִּמְשַׁח אֹתוֹ
  choice: et lui donna l’onction
  rationale: Cette formulation française distingue naturellement l’acte rituel de l’action précédente consistant à verser l’huile, tout en conservant le sens cultuel de משׁח.
- source_word: לְקַדְּשׁוֹ
  choice: pour le consacrer
  rationale: Dans le cadre de l’installation sacerdotale, קדשׁ signifie mettre à part pour le service sacré. « Consacrer » rend précisément cette fonction.
theological_decisions:
- issue: Sens de קדשׁ dans le contexte de l’installation sacerdotale
  choice: pour le consacrer
  alternative: pour le sanctifier / pour le rendre saint
  rationale: Le contexte décrit la mise à part rituelle d’Aaron en vue du service sacerdotal. « Consacrer » préserve cette portée cultuelle et vocationnelle sans imposer une interprétation doctrinale ultérieure.
translation_notes:
  register: Français moderne, clair et digne. « Huile d’onction », « donner l’onction » et « consacrer » maintiennent le vocabulaire rituel du passage tout en restant compréhensibles.
