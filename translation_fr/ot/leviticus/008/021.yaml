base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/021.yaml
  text: He washed the entrails and the legs with water[a], and Moses burned the whole ram on the altar. It was a burnt offering for a pleasing aroma, a food offering to Yahweh, just as Yahweh had commanded Moses.
translation:
  language: fr
  text: Il lava avec de l’eau les entrailles et les pattes, puis Moïse fit brûler tout le bélier sur l’autel. C’était un holocauste à l’odeur agréable, une offrande consumée par le feu pour Yahweh, comme Yahweh l’avait ordonné à Moïse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: les entrailles
  rationale: Désigne les parties internes de l’animal sacrifié. « Entrailles » est concret, naturel et précis dans ce contexte rituel.
- source_word: הַכְּרָעַיִם
  choice: les pattes
  rationale: Désigne les membres, notamment les parties inférieures, de l’animal. Pour un bélier, « pattes » est plus idiomatique en français courant que « jambes ».
- source_word: רָחַץ בַּמָּיִם
  choice: lava dans l’eau
  rationale: Reproduit le geste rituel explicite et la mention de l’eau dans l’hébreu.
- source_word: וַיַּקְטֵר ... אֶת כָּל הָאַיִל
  choice: fit entièrement fumer le bélier
  rationale: Le verbe cultuel désigne l’action de faire monter l’offrande en fumée sur l’autel; « entièrement » rend כָּל sans suggérer que le feu n’aurait fait que brûler superficiellement l’animal.
- source_word: הַמִּזְבֵּחָה
  choice: sur l’autel
  rationale: Rend naturellement la valeur locative de la forme hébraïque dans ce contexte sacrificiel.
- source_word: עֹלָה
  choice: holocauste
  rationale: Terme français consacré pour l’offrande entièrement brûlée, clair dans un contexte biblique et cultuel.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: d’une odeur agréable
  rationale: Préserve la métaphore sensorielle et l’idée d’une offrande agréée, sans l’expliciter théologiquement au-delà du texte.
- source_word: אִשֶּׁה
  choice: une offrande consumée par le feu
  rationale: Rend la dérivation et le sens cultuel liés au feu sans adopter « offrande alimentaire », interprétation possible mais moins directement transparente en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: comme Yahweh l’avait ordonné à Moïse
  rationale: Rend la conformité exacte à l’ordre divin et emploie le plus-que-parfait naturel dans la narration française.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom personnel et évite de le remplacer silencieusement par un titre.
- issue: Portée de לְרֵיחַ נִיחֹחַ
  choice: d’une odeur agréable
  alternative: d’une odeur apaisante
  rationale: Ce rendu conserve la métaphore cultuelle de l’odeur agréable sans préciser de manière indue si elle décrit l’agrément, l’apaisement ou les deux.
- issue: Sens de אִשֶּׁה
  choice: une offrande consumée par le feu
  alternative: un aliment offert à Yahweh
  rationale: Le terme est discuté et peut être associé soit au feu, soit à la nourriture sacrificielle. Le choix retenu suit le sens cultuel traditionnel lié au feu sans importer l’image de nourriture dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe suit le déroulement rituel du texte hébreu. « Fit entièrement fumer » maintient la nuance sacrificielle de וַיַּקְטֵר, tandis que « holocauste » conserve la terminologie biblique française usuelle.
