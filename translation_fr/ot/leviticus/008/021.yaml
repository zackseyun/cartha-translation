revisions:
- from: Il lava dans l’eau les entrailles et les pattes, puis Moïse fit entièrement fumer le bélier sur l’autel. C’était un holocauste, d’une odeur agréable, une offrande consumée par le feu pour Yahweh, comme Yahweh l’avait ordonné à Moïse.
  to: Il lava avec de l’eau les entrailles et les pattes, puis Moïse fit brûler tout le bélier sur l’autel. C’était un holocauste à l’odeur agréable, une offrande consumée par le feu pour Yahweh, comme Yahweh l’avait ordonné à Moïse.
  rationale: 'Révision limitée à la fluidité et à la précision du français : remplacement du calque peu naturel « fit entièrement fumer » par « fit brûler tout le bélier », emploi de « avec de l’eau », et intégration plus fluide de la formule « odeur agréable ». Le sens sacrificiel, le nom divin et l’ambiguïté lexicale de אִשֶּׁה sont préservés.'
