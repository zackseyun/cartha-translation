id: LEV.8.14
reference: Leviticus 8:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּגֵּ֕שׁ אֵ֖ת פַּ֣ר הַֽ/חַטָּ֑את וַ/יִּסְמֹ֨ךְ אַהֲרֹ֤ן וּ/בָנָי/ו֙ אֶת יְדֵי/הֶ֔ם עַל רֹ֖אשׁ פַּ֥ר הַֽ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/014.yaml
  text: Then he brought near the bull of the sin offering[a], and Aaron and his sons laid their hands on the head of the bull of the sin offering.
translation:
  language: fr
  text: Puis il fit approcher le taureau du sacrifice pour le péché[a], et Aaron et ses fils posèrent leurs mains sur la tête du taureau du sacrifice pour le péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « présenta » ou « fit avancer » au lieu de « fit approcher ».
    reason: Alternative lexicale pour וַיַּגֵּשׁ, dont le sens rituel peut être exprimé comme une approche ou une présentation.
lexical_decisions:
- source_word: וַיַּגֵּשׁ
  choice: fit approcher
  rationale: Le hifil de נגשׁ exprime ici le fait d’amener ou de présenter l’animal dans le cadre du rite. « Fit approcher » conserve cette nuance causative et rituelle en français naturel.
- source_word: פַּר
  choice: taureau
  rationale: Dans ce contexte sacrificiel, פַּר désigne un taureau. Le verset seul n’exige pas de préciser qu’il est jeune.
- source_word: הַחַטָּאת
  choice: sacrifice pour le péché
  rationale: Dans la législation sacrificielle, חַטָּאת désigne ici non le péché lui-même, mais le sacrifice offert à son sujet. Cette formulation est claire et évite de confondre l’animal avec une simple offrande non sacrificielle.
- source_word: וַיִּסְמֹךְ
  choice: posèrent
  rationale: Dans le rituel sacrificiel, סמך décrit le geste de poser ou d’appuyer la main sur l’animal. « Posèrent » rend l’action sans préciser un degré de pression que le contexte n’explicite pas.
- source_word: יְדֵיהֶם
  choice: leurs mains
  rationale: Le pluriel hébreu est conservé et désigne collectivement les mains d’Aaron et de ses fils.
- source_word: עַל רֹאשׁ
  choice: sur la tête
  rationale: Cette expression spatiale directe décrit avec précision le geste rituel dans un français actuel.
theological_decisions:
- issue: Signification de l’imposition des mains dans le rite sacrificiel
  choice: Décrire simplement le geste sans en intégrer l’interprétation théologique dans le texte.
  alternative: Expliciter une identification avec l’animal, un transfert de culpabilité ou la désignation de l’animal pour le sacrifice.
  rationale: Le verset rapporte l’acte rituel mais n’en explique pas explicitement le mécanisme théologique. La traduction préserve donc cette tension interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « taureau du sacrifice pour le péché » suit celle de l’hébreu et maintient la précision rituelle.
