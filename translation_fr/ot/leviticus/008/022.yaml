source:
  edition: WLC
  text: וַ/יַּקְרֵב֙ אֶת הָ/אַ֣יִל הַ/שֵּׁנִ֔י אֵ֖יל הַ/מִּלֻּאִ֑ים וַֽ/יִּסְמְכ֞וּ אַהֲרֹ֧ן וּ/בָנָ֛י/ו אֶת יְדֵי/הֶ֖ם עַל רֹ֥אשׁ הָ/אָֽיִל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/022.yaml
  text: Then he brought near the second ram[a], the ram of ordination, and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: fr
  text: Puis il fit approcher le deuxième bélier[a], le bélier d’investiture, et Aaron et ses fils posèrent leurs mains sur la tête du bélier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le bélier de consécration ». L’expression hébraïque est un terme sacerdotal technique désignant le rite d’installation dans la fonction.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Puis il fit approcher
  rationale: Le hiphil de קרב signifie « faire approcher, présenter ». « Fit approcher » conserve la formulation rituelle et rend la progression narrative du waw consécutif.
- source_word: הָאַיִל הַשֵּׁנִי
  choice: le deuxième bélier
  rationale: אַיִל désigne un bélier et הַשֵּׁנִי est l’ordinal « deuxième » ; la formulation identifie directement le second bélier de la cérémonie.
- source_word: אֵיל הַמִּלֻּאִים
  choice: le bélier d’investiture
  rationale: מִלֻּאִים, littéralement associé à l’idée de « remplir », est ici un terme sacerdotal technique désignant l’installation dans la fonction. « Investiture » exprime clairement en français moderne l’entrée officielle d’Aaron et de ses fils dans le sacerdoce.
- source_word: וַיִּסְמְכוּ
  choice: posèrent
  rationale: Dans le rituel sacrificiel, סמך décrit le geste de poser ou d’appuyer les mains sur l’animal. « Posèrent » est naturel et précis dans ce contexte.
- source_word: אֶת יְדֵיהֶם
  choice: leurs mains
  rationale: Le texte hébreu emploie explicitement le pluriel, conservé en français.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: sur la tête du bélier
  rationale: Traduction directe et idiomatique de la préposition et du groupe nominal, qui restitue clairement le geste rituel.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Aaron et ses fils
  rationale: בָּנִים désigne ici les fils d’Aaron qui sont installés avec lui dans la fonction sacerdotale.
theological_decisions:
- issue: Traduction du terme sacerdotal technique מִלֻּאִים
  choice: le bélier d’investiture
  alternative: le bélier de consécration
  rationale: Les deux traductions sont possibles. « Investiture » met en relief l’installation officielle d’Aaron et de ses fils dans leur fonction sacerdotale, sans effacer la dimension de consécration ; l’autre possibilité est signalée en note afin de préserver la portée du terme.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe suit la séquence rituelle de l’hébreu, tandis que « investiture » rend intelligible le terme technique sans recourir au calque obscur « remplissage ».
