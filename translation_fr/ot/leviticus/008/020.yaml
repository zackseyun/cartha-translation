  yaml_path: translation/ot/leviticus/008/020.yaml
  text: Then he cut the ram into its pieces[a], and Moses burned the head, the pieces, and the suet in smoke.
translation:
  language: fr
  text: Le bélier fut découpé en morceaux, et Moïse fit monter en fumée la tête, les morceaux et la graisse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la graisse interne ». Le terme hébreu désigne une partie grasse de l’animal offert; son emplacement exact est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: le bélier
  rationale: Dans ce contexte sacrificiel, אַיִל désigne précisément un bélier.
- source_word: נִתַּח לִנְתָחָיו
  choice: découpa… en morceaux
  rationale: La construction avec le verbe et le nom apparenté exprime le dépeçage de l’animal; cette formulation est naturelle en français.
- source_word: וַיַּקְטֵר
  choice: fit partir en fumée
  rationale: Le hiphil de קטר désigne ici l’action cultuelle de faire brûler sur l’autel de manière que l’offrande monte en fumée, et non simplement de la brûler.
- source_word: הָרֹאשׁ
  choice: la tête
  rationale: Équivalent anatomique direct.
- source_word: הַנְּתָחִים
  choice: les morceaux
  rationale: Le terme reprend le nom apparenté employé dans la première proposition et désigne les parties découpées.
- source_word: הַפָּדֶר
  choice: la graisse
  rationale: פָּדֶר désigne une partie grasse de l’animal sacrificiel. « La graisse » conserve la portée du terme sans préciser de façon incertaine qu’il s’agit de la queue grasse.
