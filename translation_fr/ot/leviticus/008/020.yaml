  rationale: La révision rétablit le passif de la première proposition, afin de ne pas introduire un agent absent du texte hébreu, et remplace une expression française moins naturelle par « fit monter en fumée », qui conserve la valeur cultuelle de l’action. La note maintient prudemment l’incertitude concernant l’identification anatomique de פָּדֶר.
