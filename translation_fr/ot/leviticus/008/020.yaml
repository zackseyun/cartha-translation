  naturalness: « Fit partir en fumée » est intelligible, mais « fit monter en fumée » est plus idiomatique et plus établi dans le registre biblique moderne. La tournure passive initiale est à la fois naturelle et fidèle au texte source.
  terminology: « Bélier », « morceaux », « tête » et « graisse » conviennent. Pour פָּדֶר, « graisse » évite de préciser indûment une queue grasse; la note signale sobrement l’incertitude anatomique.
