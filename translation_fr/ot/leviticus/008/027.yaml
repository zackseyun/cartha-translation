  text: וַ/יִּתֵּ֣ן אֶת הַ/כֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְ/עַ֖ל כַּפֵּ֣י בָנָ֑י/ו וַ/יָּ֧נֶף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/027.yaml
  text: He put all of it into the palms of Aaron and into the palms of his sons[a], and he waved them as a wave offering before Yahweh.
translation:
  language: fr
  text: Il plaça le tout dans les paumes d’Aaron et dans celles de ses fils[a], puis il les agita devant Yahweh en geste de présentation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur les paumes d’Aaron et sur les paumes de ses fils ». La préposition hébraïque signifie « sur », mais le contexte évoque des portions déposées dans leurs mains ouvertes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Il plaça
  rationale: Dans ce contexte rituel, נתן décrit le dépôt matériel des portions dans les mains, sans suggérer principalement un transfert de propriété.
- source_word: אֶת הַכֹּל
  choice: le tout
  rationale: L’expression reprend l’ensemble des portions mentionnées au verset précédent et conserve la portée globale de l’hébreu.
- source_word: עַל כַּפֵּי אַהֲרֹן וְעַל כַּפֵּי בָנָיו
  choice: dans les paumes d’Aaron et dans celles de ses fils
  rationale: Bien que עַל signifie littéralement « sur », « dans les paumes » exprime naturellement en français le dépôt dans des mains ouvertes ou creusées. La reprise par « celles » évite une lourdeur sans effacer le parallélisme ni le terme masculin précis « fils ».
- source_word: וַיָּנֶף אֹתָם תְּנוּפָה
  choice: il l’agita … en geste de présentation
  rationale: Le verbe נוף au hiphil et le nom תְּנוּפָה désignent le mouvement rituel par lequel l’offrande est présentée. « Agita » conserve l’idée d’un mouvement réel, tandis que « geste de présentation » en indique la fonction cultuelle. Le singulier « l’ » reprend naturellement en français « le tout », bien que l’hébreu emploie un pronom pluriel pour les différentes portions.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » rend directement la formule de présence cultuelle לִפְנֵי, et « Yahweh » représente le nom divin יהוה.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le nom propre est conservé sous la forme française courante « Yahweh », conformément à l’orientation du projet et sans le remplacer par un titre.
- issue: Sens rituel de תנופה
  choice: geste de présentation
  alternative: offrande balancée
  rationale: La formulation retenue exprime à la fois le mouvement et sa fonction de présentation, sans trancher avec une précision mécanique que le terme hébreu ne donne pas.
- issue: Référent du pronom אֹתָם
  choice: les portions désignées collectivement par « le tout »
  alternative: Aaron et ses fils
  rationale: La syntaxe et le déroulement du rite indiquent que ce sont les éléments déposés dans les paumes qui sont agités, non les personnes.
translation_notes:
  register: Français international moderne, sobre et digne. Le vocabulaire concret (« plaça », « paumes », « agita ») rend l’action accessible, tandis que « geste de présentation » conserve la portée rituelle sans recourir à une expression française artificielle.
