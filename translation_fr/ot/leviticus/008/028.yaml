  text: וַ/יִּקַּ֨ח מֹשֶׁ֤ה אֹתָ/ם֙ מֵ/עַ֣ל כַּפֵּי/הֶ֔ם וַ/יַּקְטֵ֥ר הַ/מִּזְבֵּ֖חָ/ה עַל הָ/עֹלָ֑ה מִלֻּאִ֥ים הֵם֙ לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֥ה ה֖וּא לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/028.yaml
  text: Then Moses took them from their palms and burned them on the altar[a], on top of the burnt offering. They were an ordination offering for a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: fr
  text: Puis Moïse les prit de leurs mains et les fit monter en fumée sur l’autel, sur l’holocauste. C’étaient des offrandes d’investiture[a], comme un parfum agréable ; c’était une offrande consumée par le feu[b] pour Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « offrandes de consécration ». Le terme hébreu désigne les offrandes employées lors du rite d’installation des prêtres.
    reason: lexical_alternative
  - marker: b
    text: Ou « offrande faite par le feu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe לקח désigne ici l’action concrète de prendre les portions présentées, dans la suite du récit rituel.
- source_word: מֵעַל כַּפֵּיהֶם
  choice: de leurs paumes
  rationale: כַּף désigne précisément la paume ou le creux de la main. Cette formulation reste naturelle en français tout en conservant le geste rituel décrit.
- source_word: וַיַּקְטֵר
  choice: les fit fumer
  rationale: Au hiphil, קטר désigne dans le contexte sacrificiel le fait de faire monter l’offrande en fumée sur l’autel. « Les fit fumer » rend cette valeur plus précisément que le simple « brûla ».
- source_word: הַמִּזְבֵּחָה
  choice: sur l’autel
  rationale: Le hé directionnel indique ici l’endroit où les portions sont déposées et brûlées; le français idiomatique demande « sur l’autel ».
- source_word: עַל הָעֹלָה
  choice: par-dessus l’holocauste
  rationale: עַל exprime le plus naturellement la position au-dessus ou sur l’holocauste déjà placé sur l’autel.
- source_word: מִלֻּאִים
  choice: offrandes d’investiture
  rationale: מִלֻּאִים est un terme technique du rite d’installation des prêtres, lié à l’expression « remplir la main ». « Investiture » communique cette fonction sans évoquer indûment les formes ecclésiastiques postérieures.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: à l’odeur agréable
  rationale: Cette expression sacrificielle traditionnelle indique que l’offrande est agréée. La formulation française est claire et ne développe pas au-delà de l’image hébraïque.
- source_word: אִשֶּׁה
  choice: offrande consumée par le feu
  rationale: Le terme sacerdotal désigne une offrande présentée par le feu. Cette traduction explicite le mode sacrificiel sans adopter l’interprétation plus indirecte « offrande alimentaire ».
- source_word: לַיהוָה
  choice: pour Yahvé
  rationale: La préposition ל marque le destinataire de l’offrande, et « Yahvé » représente en français moderne le nom divin יהוה.
theological_decisions:
- issue: Sens du terme sacerdotal מִלֻּאִים
  choice: offrandes d’investiture
  alternative: offrandes de consécration
  rationale: Le contexte est celui de l’installation d’Aaron et de ses fils. « Investiture » met en avant l’entrée officielle dans leur fonction, tandis que l’alternative « consécration » reste possible et est signalée en note.
- issue: Interprétation de אִשֶּׁה
  choice: offrande consumée par le feu
  alternative: offrande faite par le feu
  rationale: Le mot est un terme sacrificiel dont la nuance exacte est discutée. La traduction retenue exprime clairement le rapport au feu sans introduire la lecture interprétative « nourriture offerte »; une formulation plus littérale est conservée en note.
- issue: Alternance du pluriel הֵם et du singulier הוּא
  choice: C’étaient des offrandes… C’était une offrande…
  alternative: C’était une offrande d’investiture… une offrande consumée par le feu…
  rationale: La formulation conserve le passage grammatical du pluriel au singulier dans l’hébreu, sans chercher à l’aplanir silencieusement.
translation_notes:
  register: Français international actuel, clair et digne. Le vocabulaire sacrificiel traditionnel « autel » et « holocauste » est conservé pour sa précision. « Les fit fumer » restitue concrètement l’action cultuelle, tandis que « investiture » rend accessible le terme technique sacerdotal.
