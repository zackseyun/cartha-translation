  naturalness: « Prendre de leurs paumes » et surtout « les fit fumer » sont compréhensibles, mais peu naturels dans un français biblique moderne. « De leurs mains » et « les fit monter en fumée » sont plus idiomatiques sans perte pertinente de sens. « Comme un parfum agréable » rend naturellement la formule sacrificielle לריח ניחח.
  terminology: « Offrandes d’investiture » est défendable pour מִלֻּאִים dans ce contexte d’installation sacerdotale. « Offrande consumée par le feu » rend de manière claire le terme technique אִשֶּׁה, dont l’étymologie et la nuance précise demeurent discutées. Les ancres de notes sont placées sur les termes qu’elles éclairent.
  issues:
