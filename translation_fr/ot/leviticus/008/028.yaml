  - severity: low
    issue: « de leurs paumes »
    rationale: Le mot « paumes » reflète bien כַּף, mais « prendre [quelque chose] de leurs paumes » est raide en français. « De leurs mains » est l’expression usuelle dans ce geste rituel.
  - severity: low
    issue: « par-dessus l’holocauste » et « à l’odeur agréable »
    rationale: « Sur l’holocauste » exprime plus directement la position rituelle indiquée par עַל. « Comme un parfum agréable » est une formulation française plus naturelle pour la formule consacrée לריח ניחח.
