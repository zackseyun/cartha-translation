- from: 'Moïse dit à Aaron et à ses fils : « Faites cuire la viande à l’entrée de la tente de la rencontre. C’est là que vous la mangerez, avec le pain qui se trouve dans la corbeille des offrandes d’investiture[a], comme je l’ai ordonné en disant : “Aaron et ses fils les mangeront.” »'
  to: 'Moïse dit à Aaron et à ses fils : « Faites cuire la viande à l’entrée de la tente de la rencontre. Vous y mangerez la viande et le pain qui se trouve dans la corbeille des offrandes d’investiture[a], comme je l’ai ordonné en disant : “Aaron et ses fils la mangeront.” »'
  rationale: La révision rétablit le singulier de la dernière reprise pronominale, conformément au texte hébreu, et explicite dans la première instruction que la viande et le pain sont tous deux consommés. Elle ne modifie ni le sens rituel ni la terminologie retenue.
