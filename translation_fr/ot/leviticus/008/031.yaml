  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל אַהֲרֹ֣ן וְ/אֶל בָּנָ֗י/ו בַּשְּׁל֣וּ אֶת הַ/בָּשָׂר֮ פֶּ֣תַח אֹ֣הֶל מוֹעֵד֒ וְ/שָׁם֙ תֹּאכְל֣וּ אֹת֔/וֹ וְ/אֶ֨ת הַ/לֶּ֔חֶם אֲשֶׁ֖ר בְּ/סַ֣ל הַ/מִּלֻּאִ֑ים כַּ/אֲשֶׁ֤ר צִוֵּ֨יתִי֙ לֵ/אמֹ֔ר אַהֲרֹ֥ן וּ/בָנָ֖י/ו יֹאכְלֻֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/031.yaml
  text: And Moses said to Aaron and to his sons[a], “Boil the meat at the entrance of the tent of meeting, and there eat it and the bread that is in the basket of ordination offerings, just as I commanded, saying, ‘Aaron and his sons shall eat it.’”
translation:
  language: fr
  text: 'Moïse dit à Aaron et à ses fils : « Faites cuire la viande à l’entrée de la tente de la rencontre. Vous y mangerez la viande et le pain qui se trouve dans la corbeille des offrandes d’investiture[a], comme je l’ai ordonné en disant : “Aaron et ses fils la mangeront.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la corbeille des offrandes de consécration ». Le terme hébreu désigne ce qui est associé au rite d’installation des prêtres dans leur fonction.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשְּׁלוּ
  choice: Faites cuire
  rationale: Le verbe peut désigner le fait de cuire, souvent en faisant bouillir dans un contexte sacrificiel. « Faites cuire » reste naturel en français et n’impose pas un mode de cuisson plus précis que ne l’exige ici le contexte.
- source_word: הַבָּשָׂר
  choice: la viande
  rationale: Dans ce contexte alimentaire et rituel, « viande » rend naturellement la partie comestible de l’animal sacrifié.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à l’entrée de la tente de la rencontre
  rationale: Cette formulation conserve le lieu cultuel indiqué par l’hébreu et emploie une désignation claire et digne.
- source_word: וְשָׁם תֹּאכְלוּ אֹתוֹ
  choice: C’est là que vous la mangerez
  rationale: La tournure française met en relief le lieu, comme le fait שָׁם dans l’hébreu.
- source_word: הַלֶּחֶם
  choice: le pain
  rationale: Le terme désigne ici le pain associé au rite d’investiture sacerdotale.
- source_word: סַל הַמִּלֻּאִים
  choice: la corbeille des offrandes d’investiture
  rationale: מִלֻּאִים renvoie au rite d’installation d’Aaron et de ses fils dans leur fonction sacerdotale. « Investiture » exprime ce cadre sans évoquer exclusivement les usages ecclésiastiques ultérieurs du mot « ordination ».
- source_word: כַּאֲשֶׁר צִוֵּיתִי לֵאמֹר
  choice: comme je l’ai ordonné en disant
  rationale: Cette traduction conserve la structure formelle de l’hébreu, y compris l’introduction de la parole citée.
- source_word: יֹאכְלֻהוּ
  choice: les mangeront
  rationale: L’imparfait hébreu a ici une valeur directive dans une parole rapportée. Le futur français conserve cette force dans le cadre d’un ordre cité; le pluriel reprend naturellement la viande et le pain.
theological_decisions:
- issue: Sens de מִלֻּאִים dans le contexte de l’installation sacerdotale
  choice: offrandes d’investiture
  alternative: offrandes de consécration
  rationale: Le terme se rapporte au rite par lequel Aaron et ses fils sont installés dans leur charge. « Investiture » communique cette fonction précise, tandis que « consécration » demeure une possibilité légitime signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct demeure formel sans archaïsmes. « Tente de la rencontre » est transparent et conserve la portée cultuelle de l’expression hébraïque.
