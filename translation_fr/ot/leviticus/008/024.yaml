  text: וַ/יַּקְרֵ֞ב אֶת בְּנֵ֣י אַהֲרֹ֗ן וַ/יִּתֵּ֨ן מֹשֶׁ֤ה מִן הַ/דָּם֙ עַל תְּנ֤וּךְ אָזְנָ/ם֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָדָ/ם֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְלָ֖/ם הַ/יְמָנִ֑ית וַ/יִּזְרֹ֨ק מֹשֶׁ֧ה אֶת הַ/דָּ֛ם עַל הַֽ/מִּזְבֵּ֖חַ סָבִֽיב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/024.yaml
  text: Then he brought Aaron’s sons near, and Moses put some of the blood on the lobe of their right ear, on the thumb of their right hand, and on the big toe of their right foot. Then Moses threw the blood against the altar all around.
translation:
  language: fr
  text: Puis il fit approcher les fils d’Aaron. Moïse mit du sang sur le lobe de leur oreille droite, sur le pouce de leur main droite et sur le gros orteil de leur pied droit. Ensuite, Moïse projeta le sang contre l’autel, tout autour.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: il fit approcher
  rationale: Le hiphil de קרב exprime ici le fait d’amener ou de faire avancer les fils d’Aaron; cette formulation naturelle conserve la valeur causative.
- source_word: תְּנוּךְ
  choice: lobe
  rationale: Dans ce contexte rituel, le terme désigne le lobe ou l’extrémité de l’oreille; «lobe» est clair et traditionnel sans surcharge explicative.
- source_word: בֹּהֶן יָד
  choice: pouce de la main
  rationale: בֹּהֶן appliqué à la main désigne le pouce.
- source_word: בֹּהֶן רֶגֶל
  choice: gros orteil du pied
  rationale: בֹּהֶן appliqué au pied désigne le gros orteil.
- source_word: וַיִּזְרֹק
  choice: projeta
  rationale: זרק décrit l’action rituelle de lancer ou projeter le sang contre l’autel; «projeta» restitue ce mouvement sans suggérer une simple aspersion légère.
- source_word: סָבִיב
  choice: tout autour
  rationale: L’adverbe indique que le sang fut projeté sur les côtés de l’autel, sur son pourtour.
theological_decisions:
- issue: Portée symbolique de l’application du sang aux membres droits
  choice: Ne pas expliciter de symbolisme dans le texte
  alternative: Ajouter une interprétation concernant l’ouïe, le service ou la conduite
  rationale: Le verset décrit le rite sans en donner ici l’interprétation; l’ajout d’une symbolique résoudrait abusivement une question théologique laissée implicite.
- issue: Nature de l’action exercée sur le sang à l’autel
  choice: «projeta le sang contre l’autel»
  alternative: «aspergea l’autel de sang»
  rationale: Le choix conserve la force du verbe hébreu et évite d’imposer l’image plus précise d’une fine aspersion.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de «droite» est maintenue pour refléter la structure rituelle précise de l’hébreu. «Puis» et «Ensuite» rendent clairement la progression narrative sans alourdir la phrase.
