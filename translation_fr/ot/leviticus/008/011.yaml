source:
  edition: WLC
  text: וַ/יַּ֥ז מִמֶּ֛/נּוּ עַל הַ/מִּזְבֵּ֖חַ שֶׁ֣בַע פְּעָמִ֑ים וַ/יִּמְשַׁ֨ח אֶת הַ/מִּזְבֵּ֜חַ וְ/אֶת כָּל כֵּלָ֗י/ו וְ/אֶת הַ/כִּיֹּ֛ר וְ/אֶת כַּנּ֖/וֹ לְ/קַדְּשָֽׁ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/011.yaml
  text: He sprinkled some of it on the altar seven times[a], and he anointed the altar and all its utensils, and the basin and its stand[b], to consecrate them.
translation:
  language: fr
  text: Il en aspergea l’autel sept fois[a], puis il oignit l’autel et tous ses ustensiles, ainsi que la cuve et son support[b], afin de les consacrer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom « en » renvoie à l’huile d’onction mentionnée au verset précédent ; l’hébreu dit littéralement « de celle-ci » ou « d’elle ».
    reason: Précision du référent pronominal implicite dans l’hébreu.
  - marker: b
    text: 'Ou : « le bassin et sa base ».'
    reason: Autres équivalents possibles pour les deux éléments du mobilier cultuel.
lexical_decisions:
- source_word: וַיַּז מִמֶּנּוּ
  choice: Il en aspergea
  rationale: Le verbe נזה au hiphil désigne ici l’aspersion rituelle. Le pronom adverbial « en » rend naturellement מִמֶּנּוּ (« de cette huile ») en français sans préciser davantage que le contexte.
- source_word: הַמִּזְבֵּחַ
  choice: l’autel
  rationale: Équivalent français courant et précis de מִזְבֵּחַ dans le contexte sacrificiel.
- source_word: שֶׁבַע פְּעָמִים
  choice: sept fois
  rationale: Rend directement l’expression indiquant la répétition du geste rituel.
- source_word: וַיִּמְשַׁח
  choice: Il consacra par l’onction
  rationale: Cette formulation conserve le geste concret de l’onction tout en produisant une phrase française naturelle avec la série des objets, et évite l’ambiguïté moderne possible du verbe « oindre » appliqué à des objets.
- source_word: כָּל כֵּלָיו
  choice: tous ses ustensiles
  rationale: כְּלִי désigne les objets ou instruments associés à l’autel; « ustensiles » est actuel, accessible et adapté au mobilier cultuel.
- source_word: הַכִּיֹּר
  choice: la cuve
  rationale: כִּיּוֹר désigne la cuve destinée aux ablutions dans l’enceinte du sanctuaire. « Cuve » est clair et moins archaïque que « bassin d’airain » ou « cuve des ablutions ».
- source_word: כַּנּוֹ
  choice: son support
  rationale: כֵּן désigne ici la structure sur laquelle repose la cuve; « support » est précis et naturel.
- source_word: לְקַדְּשָׁם
  choice: consacra
  rationale: 'L’infinitif לְקַדְּשָׁם exprime le but de l’onction: mettre ces objets à part comme saints pour le service cultuel. L’intégration du but dans « consacra par l’onction » évite la lourdeur de « les oignit pour les consacrer » sans perdre le sens.'
theological_decisions:
- issue: Terminologie du rite de consécration
  choice: Employer « consacra par l’onction »
  alternative: « oignit … afin de les consacrer » ou « sanctifia »
  rationale: La traduction garde ensemble le geste rituel de משׁח et la finalité exprimée par קדשׁ, sans introduire de portée doctrinale ultérieure. « Sanctifier » serait plus formel mais moins immédiatement clair pour beaucoup de lecteurs.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire rituel est conservé sans archaïsmes inutiles. La division en deux phrases allège la longue coordination hébraïque tout en maintenant l’ordre des actions et des objets.
