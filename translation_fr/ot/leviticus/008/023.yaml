source:
  edition: WLC
  text: וַ/יִּשְׁחָ֓ט וַ/יִּקַּ֤ח מֹשֶׁה֙ מִ/דָּמ֔/וֹ וַ/יִּתֵּ֛ן עַל תְּנ֥וּךְ אֹֽזֶן אַהֲרֹ֖ן הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/023.yaml
  text: And he slaughtered it[a], and Moses took some of its blood and put it on the lobe of Aaron’s right ear, and on the thumb of his right hand, and on the big toe of his right foot.
translation:
  language: fr
  text: Il l’égorgea, puis Moïse prit de son sang et en mit sur le lobe de l’oreille droite d’Aaron[a], sur le pouce de sa main droite et sur le gros orteil de son pied droit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’extrémité de l’oreille droite d’Aaron ».'
    reason: Alternative lexicale pour תְּנוּךְ אֹזֶן, dont la désignation anatomique exacte peut être comprise comme le lobe ou l’extrémité extérieure de l’oreille.
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: Il l’égorgea
  rationale: Dans ce contexte sacrificiel, « égorger » exprime plus précisément la mise à mort rituelle que le terme général « tuer ». Le pronom objet reprend naturellement l’animal mentionné dans le contexte immédiat.
- source_word: מִדָּמוֹ
  choice: de son sang
  rationale: Cette tournure française indique naturellement que Moïse prélève une partie du sang, sans suggérer qu’il le prend en totalité.
- source_word: תְּנוּךְ אֹזֶן
  choice: le lobe de l’oreille
  rationale: « Lobe » est une désignation naturelle et claire de la partie extérieure visée, tout en signalant en note l’autre traduction possible, « extrémité ».
- source_word: הַיְמָנִית
  choice: droite / droit
  rationale: L’adjectif français s’accorde avec chaque membre du corps et rend directement l’indication du côté droit.
- source_word: בֹּהֶן יָדוֹ
  choice: le pouce de sa main
  rationale: Pour la main, בֹּהֶן désigne précisément le pouce.
- source_word: בֹּהֶן רַגְלוֹ
  choice: le gros orteil de son pied
  rationale: Pour le pied, בֹּהֶן désigne le gros orteil; la traduction conserve cette précision anatomique.
- source_word: וַיִּתֵּן עַל
  choice: en mit sur
  rationale: Cette formulation courante rend l’action d’appliquer une partie du sang sur les membres indiqués sans ajouter d’interprétation rituelle.
theological_decisions:
- issue: Application rituelle du sang sacrificiel aux extrémités du corps d’Aaron
  choice: Décrire simplement le geste rituel
  alternative: Introduire dans le texte sa signification symbolique ou consécratoire
  rationale: Le verset rapporte l’acte sans en expliciter ici la portée symbolique; la traduction n’ajoute donc aucune interprétation théologique.
translation_notes:
  register: Français international moderne, sobre et digne. La coordination fluide conserve la progression narrative, et le vocabulaire anatomique reste immédiatement compréhensible.
