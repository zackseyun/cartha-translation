  yaml_path: translation/ot/leviticus/008/006.yaml
  text: Then Moses brought Aaron and his sons near and washed them with water.
translation:
  language: fr
  text: Puis Moïse fit approcher Aaron et ses fils, et il les lava avec de l’eau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: fit approcher
  rationale: Le hifil de קרב signifie « faire approcher » ou « amener près ». « Fit approcher » conserve le mouvement concret vers le lieu du rite et convient au contexte de consécration.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Forme française traditionnelle et courante du nom.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Dans ce contexte, בנים désigne les fils d’Aaron appelés à la prêtrise ; « ses fils » est précis et naturel.
- source_word: וַיִּרְחַץ
  choice: il les lava
  rationale: רחץ signifie laver ou baigner. « Il les lava » rend clairement l’action rituelle sans préciser une étendue du lavage que le texte ne précise pas.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom objet renvoie ensemble à Aaron et à ses fils.
- source_word: בַּמָּיִם
  choice: avec de l’eau
  rationale: La préposition ב indique ici naturellement le moyen employé ; « avec de l’eau » est l’expression française idiomatique.
- source_word: וַ
  choice: Puis
  rationale: Le waw narratif fait progresser la séquence. « Puis » en restitue la valeur dans un français moderne et fluide.
