source:
  edition: WLC
  text: כַּ/אֲשֶׁ֥ר עָשָׂ֖ה בַּ/יּ֣וֹם הַ/זֶּ֑ה צִוָּ֧ה יְהוָ֛ה לַ/עֲשֹׂ֖ת לְ/כַפֵּ֥ר עֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/034.yaml
  text: Just as has been done on this day[a], Yahweh has commanded to be done, to make atonement for you.
translation:
  language: fr
  text: Tout comme cela a été fait aujourd’hui[a], Yahweh a ordonné de le faire afin de faire l’expiation pour vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comme cela a été fait en ce jour, ainsi Yahweh a ordonné de le faire afin de faire l’expiation pour vous. »'
    reason: Variante syntaxique et lexicale qui rend plus littéralement בַּיּוֹם הַזֶּה et explicite la corrélation comparative.
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Tout comme
  rationale: Introduit une comparaison avec les actes rituels qui viennent d’être accomplis. « Tout comme » conserve nettement la valeur comparative dans un français naturel.
- source_word: עָשָׂה
  choice: cela a été fait
  rationale: Bien que la forme soit à la troisième personne du masculin singulier, l’agent n’est pas exprimé et le verbe renvoie idiomatiquement au rituel accompli. La tournure passive évite d’imposer un sujet.
- source_word: בַּיּוֹם הַזֶּה
  choice: aujourd’hui
  rationale: Expression temporelle désignant le jour présent du rituel. « Aujourd’hui » est direct, naturel et exact dans ce contexte.
- source_word: צִוָּה
  choice: a ordonné
  rationale: Le passé composé exprime un ordre donné dont l’exécution demeure actuelle dans le contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: לַעֲשֹׂת
  choice: que cela soit fait
  rationale: Reprend le verbe עשה et maintient l’agent indéterminé, tout en exprimant clairement que Yahweh a prescrit l’accomplissement de ces actes.
- source_word: לְכַפֵּר
  choice: afin d’accomplir le rite d’expiation
  rationale: Dans ce contexte sacerdotal, כפר désigne l’acte rituel d’expiation. Cette formulation reste compréhensible tout en évitant de réduire le terme à une théorie particulière de l’expiation.
- source_word: עֲלֵיכֶם
  choice: pour vous
  rationale: 'Avec כפר, la préposition על indique ici les bénéficiaires de l’acte rituel : « pour vous » est concis et idiomatique.'
theological_decisions:
- issue: Sens de כפר dans un contexte sacrificiel
  choice: accomplir le rite d’expiation pour vous
  alternative: faire l’expiation pour vous ; faire propitiation pour vous
  rationale: « Expiation » conserve le sens cultuel établi sans préciser indûment le mécanisme théologique. La mention du « rite » rend l’expression naturelle en français et ancre le terme dans son contexte sacerdotal ; « propitiation » serait plus étroit et potentiellement interprétatif.
- issue: Agent non exprimé des actes rituels
  choice: 'tournures passives : « cela a été fait » et « que cela soit fait »'
  alternative: « il a fait » et « faire »
  rationale: Le masculin singulier hébreu permet formellement un sujet personnel, mais le contexte peut employer עשה avec un agent laissé implicite. La traduction ne force donc pas l’identification de cet agent.
translation_notes:
  register: Français international actuel, digne et accessible. La formulation conserve le vocabulaire sacerdotal d’« expiation », tout en clarifiant qu’il s’agit ici d’un acte rituel. Le nom divin est rendu par « Yahweh ».
