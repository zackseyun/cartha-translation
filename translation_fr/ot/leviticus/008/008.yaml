source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם עָלָ֖י/ו אֶת הַ/חֹ֑שֶׁן וַ/יִּתֵּן֙ אֶל הַ/חֹ֔שֶׁן אֶת הָ/אוּרִ֖ים וְ/אֶת הַ/תֻּמִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/008.yaml
  text: And he placed the breastpiece on him[b][a], and he put the Urim and the Thummim into the breastpiece.
translation:
  language: fr
  text: Il lui mit le pectoral[a], puis il mit dans le pectoral l’Ourim et le Toummim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la pièce de poitrine ». Le mot hébreu חֹשֶׁן désigne la pièce portée sur la poitrine du grand prêtre; il ne s’agit pas nécessairement d’une armure.
    reason: lexical_alternative
  - marker: b
    text: « Ourim » et « Toummim » sont des termes rituels hébreux traditionnellement translittérés. Leur forme exacte et leur mode d’utilisation restent incertains.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Il plaça
  rationale: Le verbe שׂוּם signifie couramment « mettre, placer ». « Plaça » convient au contexte cérémoniel de l’habillement d’Aaron et permet une légère variation naturelle avec le verbe suivant.
- source_word: עָלָיו
  choice: sur lui
  rationale: 'La préposition עַל avec suffixe a ici un sens spatial : le pectoral est posé sur Aaron.'
- source_word: הַחֹשֶׁן
  choice: le pectoral
  rationale: חֹשֶׁן désigne la pièce portée sur la poitrine par le grand prêtre. « Pectoral » est le terme français biblique et cultuel usuel, sans évoquer nécessairement une pièce d’armure. Le même terme est conservé aux deux occurrences.
- source_word: וַיִּתֵּן
  choice: il mit
  rationale: נָתַן peut signifier « donner, mettre, placer ». Ici, il s’agit de déposer les objets dans le pectoral; « mit » rend naturellement ce sens.
- source_word: אֶל הַחֹשֶׁן
  choice: dans le pectoral
  rationale: Bien que אֶל exprime souvent une direction vers, le contexte indique l’introduction ou le dépôt des objets dans le pectoral. En français, « dans » est naturel et suffisamment précis.
- source_word: הָאוּרִים
  choice: l’ourim
  rationale: אוּרִים est un terme rituel technique dont la forme et le fonctionnement exacts restent incertains. La translittération évite une interprétation spéculative telle que « lumières ».
- source_word: הַתֻּמִּים
  choice: le toummim
  rationale: תֻּמִּים est le terme rituel associé à אוּרִים. La translittération préserve la désignation hébraïque sans imposer le sens conjectural de « perfections ».
theological_decisions:
- issue: Rendu des objets sacerdotaux אוּרִים וְתֻּמִּים
  choice: Translittérer par « l’ourim et le toummim »
  alternative: « les lumières et les perfections » ou « les sorts sacrés »
  rationale: Leur nature exacte demeure incertaine, même s’ils sont associés à la consultation sacerdotale. La translittération conserve la spécificité du texte et son ambiguïté sans imposer une explication disputée.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit les deux actions successives de l’hébreu, tandis que « puis » rend naturellement leur enchaînement. Les termes techniques sont expliqués sans résoudre leur incertitude.
