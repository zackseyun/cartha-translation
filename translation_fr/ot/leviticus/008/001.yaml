lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Puis … parla
  rationale: Le waw consécutif fait progresser le récit; « Puis » exprime naturellement cette succession, tandis que « parla » rend דבר et reste distinct de la formule לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin YHWH; « Yahweh » le rend comme nom propre au lieu de lui substituer un titre.
- source_word: אֶל מֹשֶׁה
  choice: à Moïse
  rationale: אֶל introduit ici le destinataire de la parole; « à Moïse » est l’expression française naturelle.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'Cette formule introduit le discours direct qui suit. « En ces termes : » est idiomatique en français et évite le calque lourd « en disant ».'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. La forme « Yahweh » préserve le caractère personnel du nom tout en signalant en note la tradition française et une autre translittération connue.
translation_notes:
  register: 'Français moderne, digne et fluide. La tournure « en ces termes : » annonce naturellement les paroles du verset suivant; le passé simple convient au registre narratif biblique sans être archaïque.'
