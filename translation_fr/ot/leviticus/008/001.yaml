  text: 'Puis Yahweh[a] parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH »; traditionnellement rendu par « le SEIGNEUR ». Une autre translittération est « Jéhovah ».'
