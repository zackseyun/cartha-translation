source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל הָ/עֵדָ֑ה זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/005.yaml
  text: And Moses said to the congregation[a], “This is the thing that Yahweh has commanded to be done.”
translation:
  language: fr
  text: 'Moïse dit à l’assemblée : « Voici ce que Yahweh a ordonné de faire. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait progresser le récit. En français, le passé simple rend naturellement cette succession narrative sans qu’il soit nécessaire d’ajouter systématiquement « et ».
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: הָעֵדָה
  choice: l’assemblée
  rationale: עֵדָה désigne ici la communauté d’Israël réunie. « Assemblée » convient au rassemblement présent et reste naturel en français moderne.
- source_word: זֶה הַדָּבָר אֲשֶׁר
  choice: Voici ce que
  rationale: Cette tournure française idiomatique restitue la construction démonstrative et relative hébraïque sans le calque lourd « Ceci est la chose que ».
- source_word: צִוָּה
  choice: a ordonné
  rationale: Le parfait désigne un ordre donné auparavant et pertinent pour l’action présente. Le passé composé l’exprime naturellement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom divin employé directement dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לַעֲשׂוֹת
  choice: de faire
  rationale: L’infinitif hébreu est formellement actif. En français, « ce que Yahweh a ordonné de faire » est naturel et peut garder non exprimé l’agent de l’action.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le représente directement, tandis que « le SEIGNEUR » lui substituerait un titre.
- issue: Agent implicite de לַעֲשׂוֹת
  choice: de faire
  alternative: qui doit être fait
  rationale: L’hébreu emploie un infinitif actif sans sujet explicite. Le français « de faire » préserve cette indétermination et évite de transformer explicitement la construction en passif.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation est fluide à l’oral comme à l’écrit et conserve le caractère déclaratif de la parole de Moïse.
