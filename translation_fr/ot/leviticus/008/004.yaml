id: LEV.8.4
reference: Leviticus 8:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/תִּקָּהֵל֙ הָֽ/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/004.yaml
  text: And Moses did as Yahweh commanded him[a], and the congregation assembled at the entrance to the tent of meeting.
translation:
  language: fr
  text: Moïse fit ce que Yahweh lui avait ordonné, et la communauté se rassembla[a] à l’entrée de la tente de la rencontre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la communauté fut rassemblée ». La forme hébraïque peut décrire la communauté qui se réunit ou être comprise au passif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fit
  rationale: Dans ce contexte d’obéissance à un ordre, « fit » rend naturellement le sens large de עשה.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: ce que […] avait ordonné
  rationale: Cette formulation française exprime clairement la conformité de l’action de Moïse à l’ordre divin, tout en conservant la force autoritative de צוה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin exprimé directement par le tétragramme dans le texte hébreu.
- source_word: אֹתוֹ
  choice: lui
  rationale: Le pronom objet renvoie à Moïse ; avec « ordonner », le français emploie naturellement le complément indirect « lui ».
- source_word: וַתִּקָּהֵל
  choice: se rassembla
  rationale: Le nifal de קהל décrit ici la communauté qui se réunit ; la tournure pronominale est naturelle en français et laisse en note la possibilité d’une lecture passive.
- source_word: הָעֵדָה
  choice: la communauté
  rationale: עֵדָה désigne collectivement la communauté d’Israël. « Communauté » est actuel, clair et adapté au contexte du Pentateuque.
- source_word: אֶל פֶּתַח
  choice: à l’entrée
  rationale: Bien que אֶל marque le mouvement vers un lieu, « se rassembler à l’entrée » exprime naturellement en français la destination atteinte.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette traduction conserve à la fois la réalité physique de la tente et sa fonction de lieu de rencontre assigné.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte le nom propre divin ; « Yahweh » le rend directement sans lui substituer un titre.
- issue: Valeur du nifal וַתִּקָּהֵל
  choice: la communauté se rassembla
  alternative: la communauté fut rassemblée
  rationale: La forme peut se rendre par un pronominal à sens de rassemblement ou par un passif. Le texte principal adopte l’expression française la plus naturelle, tandis que la note préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, simple et digne. La phrase conserve la succession narrative de l’hébreu et évite un vocabulaire confessionnel marqué.
