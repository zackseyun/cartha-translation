  text: וּ/מִ/סַּ֨ל הַ/מַּצּ֜וֹת אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָ֗ה לָ֠קַח חַלַּ֨ת מַצָּ֤ה אַחַת֙ וְֽ/חַלַּ֨ת לֶ֥חֶם שֶׁ֛מֶן אַחַ֖ת וְ/רָקִ֣יק אֶחָ֑ד וַ/יָּ֨שֶׂם֙ עַל הַ֣/חֲלָבִ֔ים וְ/עַ֖ל שׁ֥וֹק הַ/יָּמִֽין׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/026.yaml
  text: And from the basket of unleavened bread that was before Yahweh[a], he took one unleavened cake, one cake of bread with oil, and one wafer, and put them on the fat portions and on the right thigh.
translation:
  language: fr
  text: Du panier des pains sans levain qui était devant Yahweh, il prit un gâteau sans levain, un gâteau à l’huile[a] et une galette, puis il les posa sur les morceaux gras et sur la cuisse droite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un gâteau de pain avec de l’huile ». L’expression hébraïque associe ce pain à l’huile, mais ne précise pas exactement comment celle-ci était utilisée.
    reason: L’expression לֶחֶם שֶׁמֶן permet plusieurs compréhensions proches quant au mode de préparation; la note évite de privilégier indûment l’idée d’un pain pétri à l’huile.
lexical_decisions:
- source_word: מִסַּל הַמַּצּוֹת
  choice: du panier des pains sans levain
  rationale: La préposition מִן indique la provenance, et מַצּוֹת désigne ici les pains sans levain contenus dans le panier rituel.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: La formule cultuelle situe le panier dans la présence de Dieu; le nom divin est rendu directement par « Yahweh ».
- source_word: חַלַּת מַצָּה אַחַת
  choice: un gâteau sans levain
  rationale: חַלָּה désigne une pièce de pain ou un gâteau; « gâteau sans levain » distingue naturellement cet élément rituel.
- source_word: חַלַּת לֶחֶם שֶׁמֶן אַחַת
  choice: un gâteau de pain préparé avec de l’huile
  rationale: La construction associe le pain à l’huile sans préciser clairement si celle-ci était incorporée, versée ou appliquée autrement. Cette formulation conserve cette indétermination.
- source_word: רָקִיק אֶחָד
  choice: une galette
  rationale: רָקִיק désigne un pain mince; « galette » est naturel en français et convient mieux ici que « gaufrette », qui évoquerait un aliment moderne.
- source_word: הַחֲלָבִים
  choice: les morceaux gras
  rationale: Dans ce contexte sacrificiel, le pluriel désigne les parties grasses déterminées de l’animal, et non la graisse en général.
- source_word: שׁוֹק הַיָּמִין
  choice: la cuisse droite
  rationale: שׁוֹק désigne la partie supérieure ou entière de la patte offerte; « cuisse » est une désignation française traditionnelle et précise dans ce contexte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » préserve le nom personnel d’alliance plutôt que de le remplacer par un titre.
translation_notes:
  register: Français moderne, clair et digne, avec le vocabulaire rituel concret du passage. Le marqueur de note est placé après l’expression réellement concernée, celle du pain préparé avec de l’huile.
