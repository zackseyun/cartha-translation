  text: And he slaughtered it[a], and Moses threw the blood against the altar all around.
translation:
  language: fr
  text: Il l’égorgea, puis Moïse projeta le sang contre l’autel, tout autour.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lança le sang contre l’autel, sur tous ses côtés ». Le verbe hébreu désigne une application énergique du sang sacrificiel, et non une légère aspersion.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: Il l’égorgea
  rationale: Dans un contexte sacrificiel, שׁחט désigne l’abattage rituel d’un animal. Le pronom « l’ » reprend l’animal mentionné au verset précédent, comme l’exige le français.
- source_word: וַיִּזְרֹק
  choice: projeta
  rationale: זרק décrit ici une application énergique du sang sur l’autel. « Projeta » conserve l’idée de mouvement et évite que « aspergea » soit compris comme une légère pulvérisation.
- source_word: הַדָּם
  choice: le sang
  rationale: Traduction directe du nom défini.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: הַמִּזְבֵּחַ
  choice: l’autel
  rationale: Équivalent français usuel de מִזְבֵּחַ dans le contexte sacrificiel.
- source_word: סָבִיב
  choice: tout autour
  rationale: Cette expression rend la répartition du sang sur le pourtour ou les différents côtés de l’autel.
