source:
  edition: WLC
  text: וְ/אֵ֥ת כָּל הָ/עֵדָ֖ה הַקְהֵ֑ל אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/003.yaml
  text: And assemble all the congregation at the entrance of the tent of meeting[a].
translation:
  language: fr
  text: Rassemble toute la communauté à l’entrée de la tente de la rencontre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi traduire « tente de la Rencontre » ou « tente de la réunion ».
    reason: L’expression hébraïque אֹהֶל מוֹעֵד associe la tente à la rencontre ou au rendez-vous fixé; plusieurs formulations françaises sont possibles.
lexical_decisions:
- source_word: וְ/אֵת
  choice: '[connecteur non exprimé]'
  rationale: וְ enchaîne ce commandement au précédent et אֵת marque le complément d’objet défini. Dans un verset français isolé, commencer directement par l’impératif est plus naturel sans altérer le sens.
- source_word: כָּל
  choice: toute
  rationale: Avec le nom défini singulier, כָּל exprime la totalité de la communauté.
- source_word: הָעֵדָה
  choice: la communauté
  rationale: עֵדָה désigne ici collectivement la communauté d’Israël. « Communauté » est courant, digne et évite la coloration ecclésiale que « congrégation » peut avoir en français.
- source_word: הַקְהֵל
  choice: Rassemble
  rationale: L’impératif hifil de קהל ordonne à Moïse de faire venir et réunir le groupe; « rassemble » l’exprime naturellement en français.
- source_word: אֶל פֶּתַח
  choice: à l’entrée
  rationale: Dans cette construction spatiale, « à l’entrée » rend idiomatiquement le lieu vers lequel la communauté doit être rassemblée.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette expression désigne la tente où a lieu la rencontre fixée avec Dieu. « Tente de la rencontre » conserve cette valeur tout en restant claire en français moderne.
theological_decisions: []
