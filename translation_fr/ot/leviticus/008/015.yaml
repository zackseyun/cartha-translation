revisions:
- from: Il l’égorgea. Moïse prit du sang et en mit avec son doigt sur les cornes de l’autel, tout autour. Il purifia ainsi l’autel[a]. Puis il versa le reste du sang au pied de l’autel et consacra celui-ci, afin d’accomplir sur lui le rite d’expiation[b].
  to: Il l’égorgea. Moïse prit le sang et en mit, avec son doigt, sur les cornes de l’autel, tout autour. Il purifia l’autel[a]. Il versa le sang au pied de l’autel et consacra l’autel, afin de faire expiation pour lui[b].
  rationale: La révision retire les ajouts interprétatifs non marqués, rétablit l’article défini du sang, et adopte une formulation française plus naturelle pour l’expiation accomplie à l’égard de l’autel. Les notes conservent l’ambiguïté lexicale et rituelle de חטא et de כפר sans attribuer de faute morale à l’autel.
