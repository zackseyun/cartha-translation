  text: וַ/יִּשְׁחָ֗ט וַ/יִּקַּ֨ח מֹשֶׁ֤ה אֶת הַ/דָּם֙ וַ֠/יִּתֵּן עַל קַרְנ֨וֹת הַ/מִּזְבֵּ֤חַ סָבִיב֙ בְּ/אֶצְבָּע֔/וֹ וַ/יְחַטֵּ֖א אֶת הַ/מִּזְבֵּ֑חַ וְ/אֶת הַ/דָּ֗ם יָצַק֙ אֶל יְס֣וֹד הַ/מִּזְבֵּ֔חַ וַֽ/יְקַדְּשֵׁ֖/הוּ לְ/כַפֵּ֥ר עָלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/015.yaml
  text: And he slaughtered it, and Moses took the blood and put it on the horns of the altar all around with his finger, and he purified the altar, and he poured out the blood at the base of the altar and consecrated it to make atonement for it.
translation:
  language: fr
  text: Il l’égorgea. Moïse prit le sang et en mit, avec son doigt, sur les cornes de l’autel, tout autour. Il purifia l’autel[a]. Il versa le sang au pied de l’autel et consacra l’autel, afin de faire expiation pour lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il purifia rituellement l’autel » ou « il nettoya l’autel ». Dans ce contexte rituel, le verbe hébreu désigne une purification et non l’action de faire pécher.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « afin de le purifier rituellement ». Littéralement, le verbe hébreu exprime l’accomplissement de l’expiation « sur » l’autel ; dans ce contexte sacrificiel, il peut désigner une purification rituelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: Il l’égorgea
  rationale: Dans un contexte sacrificiel, שׁחט désigne l’égorgement rituel de l’animal; le pronom reprend naturellement le taureau du verset précédent.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: les cornes de l’autel
  rationale: Expression cultuelle précise désignant les saillies en forme de cornes aux angles de l’autel.
- source_word: סָבִיב
  choice: tout autour
  rationale: Rend la portée distributive de l’application du sang sur les différentes cornes de l’autel.
- source_word: בְּאֶצְבָּעוֹ
  choice: avec son doigt
  rationale: Reproduit clairement le singulier et la valeur instrumentale de l’expression hébraïque.
- source_word: וַיְחַטֵּא אֶת־הַמִּזְבֵּחַ
  choice: Il purifia ainsi l’autel
  rationale: Au piel, dans ce contexte sacerdotal, חטא exprime la purification rituelle, non l’action de faire pécher; « ainsi » relie naturellement cette purification au geste précédent.
- source_word: וְאֶת־הַדָּם יָצַק אֶל־יְסוֹד הַמִּזְבֵּחַ
  choice: Puis il versa le reste du sang au pied de l’autel
  rationale: « Au pied » est naturel en français pour יסוד dans la terminologie de l’autel. « Le reste » explicite sans ambiguïté qu’il s’agit du sang non appliqué aux cornes.
- source_word: וַיְקַדְּשֵׁהוּ
  choice: et consacra celui-ci
  rationale: קדשׁ signifie ici rendre l’autel saint, le mettre à part pour son usage sacré; « celui-ci » évite une confusion avec le sang.
- source_word: לְכַפֵּר עָלָיו
  choice: afin d’accomplir sur lui le rite d’expiation
  rationale: Cette formulation conserve la force cultuelle de כפר et la relation marquée par עַל, tout en évitant de suggérer que l’autel serait un agent moral ayant péché.
theological_decisions:
- issue: Sens de חטא dans le rite sacerdotal
  choice: Il purifia ainsi l’autel
  alternative: Il nettoya rituellement l’autel
  rationale: Le verbe décrit l’élimination rituelle de l’impureté; « purifier » est digne, courant et ne prête pas de péché moral à l’autel.
- issue: Sens et construction de כפר על appliqué à l’autel
  choice: afin d’accomplir sur lui le rite d’expiation
  alternative: afin de faire l’expiation pour lui; afin de le purger rituellement
  rationale: L’hébreu garde l’autel comme objet du rite. La traduction principale préserve la préposition « sur » et la tension cultuelle sans réduire כפר à une théorie particulière de l’expiation.
translation_notes:
  register: Français international moderne, sobre et digne. Les phrases ont été légèrement segmentées pour la lisibilité. Le vocabulaire rituel traditionnel (« autel », « consacra », « expiation ») est conservé, avec des notes pour éclairer les termes hébreux polysémiques.
