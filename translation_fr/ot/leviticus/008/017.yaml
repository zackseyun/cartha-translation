  text: וְ/אֶת הַ/פָּ֤ר וְ/אֶת עֹר/וֹ֙ וְ/אֶת בְּשָׂר֣/וֹ וְ/אֶת פִּרְשׁ֔/וֹ שָׂרַ֣ף בָּ/אֵ֔שׁ מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/017.yaml
  text: But the bull[a], along with its hide, its flesh, and its dung, he burned with fire outside the camp[b], just as Yahweh had commanded Moses.
translation:
  language: fr
  text: Mais il brûla au feu, hors du camp, le taureau avec sa peau, sa chair et ses excréments[a], comme Yahweh l’avait ordonné à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : sa bouse.'
    reason: Variante lexicale concrète pour פֶּרֶשׁ; « excréments » est plus général et naturel, tandis que « bouse » précise qu’il s’agit de ceux d’un bovin.
lexical_decisions:
- source_word: הַפָּר
  choice: le taureau
  rationale: פַּר désigne un taureau, éventuellement un jeune taureau. Le contexte sacrificiel n’est pas ajouté explicitement au nom dans ce verset.
- source_word: עֹרוֹ
  choice: sa peau
  rationale: עוֹר désigne la peau de l’animal. « Sa peau » est précis et naturel en français moderne; « son cuir » pourrait suggérer une peau déjà traitée.
- source_word: בְּשָׂרוֹ
  choice: sa chair
  rationale: בָּשָׂר signifie ici la chair de l’animal. « Chair » conserve le registre sacrificiel sans réduire le sens à de la viande destinée à être mangée.
- source_word: פִּרְשׁוֹ
  choice: ses excréments
  rationale: פֶּרֶשׁ désigne concrètement les excréments, et non de simples déchets ou l’ensemble des entrailles.
- source_word: שָׂרַף בָּאֵשׁ
  choice: il brûla au feu
  rationale: Cette formulation conserve le verbe « brûler » et la mention explicite du feu dans l’hébreu, tout en restant intelligible dans un registre biblique digne.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: hors du camp
  rationale: Rendu français courant et précis de l’emplacement extérieur au camp.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: comme … l’avait ordonné
  rationale: La tournure exprime la conformité de l’action à l’ordre antérieur. Le pronom « l’ » reprend l’action commandée sans ajouter de contenu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit comme un nom propre plutôt que remplacé par un titre.
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: le taureau avec sa peau, sa chair et ses excréments
  rationale: « Avec » restitue naturellement en français l’énumération cumulative des objets marqués en hébreu, sans alourdir la phrase par la répétition de « et ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte porte directement le tétragramme; la transcription « Yahweh » préserve le nom propre sans lui substituer un titre.
translation_notes:
  register: Français international moderne, clair et digne. L’ordre de la phrase place d’abord le verbe et son sujet implicite afin d’éviter une dislocation lourde, tout en conservant tous les éléments du texte hébreu. « Au feu » maintient l’insistance explicite de בָּאֵשׁ.
