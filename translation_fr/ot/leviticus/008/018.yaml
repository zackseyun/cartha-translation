source:
  edition: WLC
  text: וַ/יַּקְרֵ֕ב אֵ֖ת אֵ֣יל הָ/עֹלָ֑ה וַֽ/יִּסְמְכ֞וּ אַהֲרֹ֧ן וּ/בָנָ֛י/ו אֶת יְדֵי/הֶ֖ם עַל רֹ֥אשׁ הָ/אָֽיִל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/018.yaml
  text: Then he brought near the ram of the burnt offering[b][a], and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: fr
  text: Puis Moïse fit approcher[a] le bélier destiné à l’holocauste, et Aaron et ses fils posèrent[b] leurs mains sur la tête du bélier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « présenta » ou « amena ».
    reason: lexical_alternative
  - marker: b
    text: Ou « appuyèrent ». Le verbe hébreu désigne ici le geste rituel accompli sur un animal offert en sacrifice.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Puis Moïse fit approcher
  rationale: Le hiphil de קרב signifie « faire approcher » ou « présenter ». « Fit approcher » conserve l’image et la portée rituelle de l’hébreu. Le nom « Moïse », implicite dans le pronom hébreu, est explicité d’après le contexte immédiat pour assurer la clarté en français.
- source_word: אֵיל
  choice: bélier
  rationale: Terme français courant et précis pour le mouton mâle désigné par l’hébreu.
- source_word: הָעֹלָה
  choice: destiné à l’holocauste
  rationale: עֹלָה est le terme sacrificiel traditionnellement rendu par « holocauste ». « Destiné à » exprime naturellement en français que ce bélier est celui de l’holocauste, sans suggérer qu’il ne constitue qu’un élément accessoire de l’offrande.
- source_word: וַיִּסְמְכוּ
  choice: posèrent
  rationale: Dans ce contexte sacrificiel, סמך désigne le geste rituel consistant à poser ou appuyer les mains sur l’animal. « Posèrent » est naturel en français et ne surcharge pas le geste d’une interprétation théologique.
- source_word: יְדֵיהֶם
  choice: leurs mains
  rationale: Le pluriel explicite de l’hébreu est conservé.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: sur la tête du bélier
  rationale: Traduction directe, claire et idiomatique de la locution prépositionnelle hébraïque.
theological_decisions:
- issue: Signification du geste rituel d’imposition des mains
  choice: posèrent leurs mains sur la tête du bélier
  alternative: appuyèrent leurs mains sur la tête du bélier
  rationale: Le verset décrit le geste sans en préciser ici la signification. La traduction n’introduit donc ni transfert de culpabilité ni identification, mais laisse cette question ouverte au contexte biblique.
translation_notes:
  register: Français international moderne, digne et accessible. « Holocauste » est conservé comme terme sacrificiel biblique établi. La syntaxe reste proche de l’hébreu tout en évitant une formulation artificielle.
