id: LEV.8.13
reference: Leviticus 8:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּקְרֵ֨ב מֹשֶׁ֜ה אֶת בְּנֵ֣י אַהֲרֹ֗ן וַ/יַּלְבִּשֵׁ֤/ם כֻּתֳּנֹת֙ וַ/יַּחְגֹּ֤ר אֹתָ/ם֙ אַבְנֵ֔ט וַ/יַּחֲבֹ֥שׁ לָ/הֶ֖ם מִגְבָּע֑וֹת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/013.yaml
  text: Then Moses brought Aaron’s sons near[a], and clothed them with tunics, and girded them with sashes, and bound caps on them[c][b], just as Yahweh had commanded Moses.
translation:
  language: fr
  text: Puis Moïse fit approcher les fils d’Aaron[a] ; il les revêtit de tuniques, leur noua une ceinture[b] et leur fixa des coiffes sur la tête, comme Yahweh l’avait ordonné à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « présenta les fils d’Aaron ». Dans ce contexte rituel, le verbe hébreu peut signifier « faire approcher » ou « présenter ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « leur noua une ceinture » : chacun des fils reçut sa ceinture sacerdotale.'
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: fit approcher
  rationale: Le hiphil de קרב signifie « faire approcher » ou, dans un cadre rituel, « présenter ». « Fit approcher » conserve le mouvement et la portée rituelle sans les préciser excessivement.
- source_word: בְּנֵי אַהֲרֹן
  choice: les fils d’Aaron
  rationale: Rendu direct et naturel de la construction hébraïque.
- source_word: וַיַּלְבִּשֵׁם כֻּתֳּנֹת
  choice: les revêtit de tuniques
  rationale: Le hiphil de לבשׁ exprime le fait d’habiller quelqu’un, et כֻּתֳּנֹת désigne ici les longues tuniques sacerdotales.
- source_word: וַיַּחְגֹּר אֹתָם אַבְנֵט
  choice: leur noua une ceinture
  rationale: 'חגר désigne l’action de ceindre ou d’attacher autour de la taille. Le singulier אַבְנֵט a vraisemblablement une valeur distributive : une ceinture pour chacun.'
- source_word: וַיַּחֲבֹשׁ לָהֶם מִגְבָּעוֹת
  choice: leur fixa des coiffes sur la tête
  rationale: חבשׁ évoque ici la fixation d’une coiffure, et מִגְבָּעוֹת désigne les couvre-chefs des prêtres ordinaires, distincts de celui du grand prêtre.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: comme Yahweh le lui avait ordonné
  rationale: Cette formule récurrente souligne la conformité de l’action de Moïse à l’ordre divin. Le pronom « le » reprend l’ensemble des actes prescrits.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin conserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » en conserve la fonction de nom propre, tandis que « le SEIGNEUR » représente la substitution traditionnelle.
- issue: Portée rituelle de וַיַּקְרֵב
  choice: fit approcher
  alternative: présenta
  rationale: « Fit approcher » préserve le sens verbal concret ainsi que sa possible portée cultuelle, sans imposer l’interprétation plus technique de « présenta ».
translation_notes:
  register: Français international moderne, sobre et digne. La succession des gestes est rendue naturellement tout en conservant le vocabulaire de l’investiture sacerdotale. « Coiffes » distingue les couvre-chefs des prêtres de la coiffure particulière d’Aaron.
