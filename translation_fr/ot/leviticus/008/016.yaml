base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/016.yaml
  text: He took all the fat that was on the entrails[a], the lobe of the liver, the two kidneys and their fat[b], and Moses burned them on the altar.
translation:
  language: fr
  text: Il prit toute la graisse qui recouvrait les entrailles, le lobe du foie[a], les deux reins et leur graisse. Puis Moïse les brûla[b] sur l’autel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’appendice du foie » ; le terme hébreu désigne probablement une partie du foie retirée lors de la préparation du sacrifice.
    reason: lexical_alternative
  - marker: b
    text: Dans un contexte sacrificiel, le verbe hébreu peut plus précisément signifier « faire monter en fumée » ou « offrir en fumée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Il prit
  rationale: Le wayyiqtol de לקח exprime l’action suivante du récit. « Il prit » est naturel en français moderne sans qu’il soit nécessaire de rendre mécaniquement la conjonction initiale.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: toute la graisse qui recouvrait les entrailles
  rationale: חֵלֶב désigne ici les parties grasses réservées au sacrifice, et קֶרֶב les parties internes de l’animal. « Recouvrait » rend naturellement la relation exprimée par עַל dans ce contexte anatomique.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: le lobe du foie
  rationale: L’expression désigne une partie précise du foie retirée lors de la préparation sacrificielle. « Le lobe du foie » est clair et usuel, tandis que l’identification anatomique exacte demeure discutée et est signalée en note.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: les deux reins
  rationale: Traduction anatomique directe qui conserve explicitement le duel hébreu.
- source_word: חֶלְבְּהֶן
  choice: la graisse qui les entourait
  rationale: Le suffixe renvoie aux deux reins. Cette formulation idiomatique précise la disposition anatomique implicite sans modifier les éléments offerts.
- source_word: וַיַּקְטֵר
  choice: fit brûler le tout
  rationale: Dans le vocabulaire sacrificiel, קטר signifie faire brûler sur l’autel, avec l’idée de transformer l’offrande en fumée. « Le tout » reprend clairement l’ensemble des parties énumérées.
- source_word: הַמִּזְבֵּחָה
  choice: sur l’autel
  rationale: La terminaison directionnelle ou locative indique ici le lieu où les parties sont brûlées. « Sur l’autel » est la formulation française naturelle.
