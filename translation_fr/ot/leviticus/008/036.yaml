  text: וַ/יַּ֥עַשׂ אַהֲרֹ֖ן וּ/בָנָ֑י/ו אֵ֚ת כָּל הַ/דְּבָרִ֔ים אֲשֶׁר צִוָּ֥ה יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/036.yaml
  text: And Aaron and his sons did all the things that Yahweh had commanded through Moses[a].
translation:
  language: fr
  text: Aaron et ses fils firent tout ce que Yahweh avait ordonné par l’intermédiaire de Moïse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main de Moïse », expression hébraïque signifiant « par l’intermédiaire de Moïse » ou « par Moïse en tant que médiateur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: firent
  rationale: Le verbe עשה résume ici l’obéissance d’Aaron et de ses fils. « Firent » est direct, naturel et reste proche de la formulation hébraïque.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Aaron et ses fils
  rationale: Le nom propre suit la forme française traditionnelle, et בָּנָיו désigne précisément les fils d’Aaron dans ce contexte sacerdotal.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: tout ce que
  rationale: דְּבָרִים peut désigner des paroles, des choses ou des prescriptions. Dans ce résumé d’actions accomplies, « tout ce que » rend naturellement l’ensemble des ordres sans imposer un sens exclusivement verbal.
- source_word: צִוָּה
  choice: avait ordonné
  rationale: Le plus-que-parfait indique avec naturel que l’ordre de Yahweh précède son exécution par Aaron et ses fils.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom divin personnel plutôt que remplacé par un titre.
- source_word: בְּיַד מֹשֶׁה
  choice: par l’intermédiaire de Moïse
  rationale: L’expression hébraïque signifie littéralement « par la main de Moïse » et exprime ici l’agence ou la médiation. Cette formulation en transmet clairement le sens en français moderne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le caractère de nom propre sans le remplacer par un titre.
- issue: Rôle de Moïse dans la transmission du commandement
  choice: par l’intermédiaire de Moïse
  alternative: par la main de Moïse
  rationale: Cette formulation présente Moïse comme l’agent ou le médiateur du commandement divin, tout en évitant de reproduire littéralement un idiome hébraïque peu naturel en français.
translation_notes:
  register: Français international moderne, simple et digne. La phrase conserve la sobriété narrative de l’hébreu ; « tout ce que » évite le tour peu naturel « toutes les choses que » tout en maintenant l’idée d’une obéissance complète.
