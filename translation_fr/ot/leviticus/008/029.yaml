revisions:
- from: Puis Moïse prit la poitrine et la balança devant Yahweh en geste de présentation. Elle constitua la part de Moïse sur le bélier d’investiture[a], comme Yahweh l’avait ordonné à Moïse.
  to: Puis Moïse prit la poitrine et la présenta devant Yahweh en faisant le geste de présentation. Elle revint à Moïse comme part du bélier d’investiture[a], comme Yahweh l’avait ordonné à Moïse.
  rationale: La révision rend explicitement et naturellement l'action rituelle exprimée par le verbe נוּף et le nom תְּנוּפָה, sans réduire celle-ci à une présentation abstraite. Elle remplace aussi « sur le bélier » par « du bélier », conformément à la préposition hébraïque מִן. Le reste du texte, y compris le nom divin et le terme « investiture », est conservé.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:24:00Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèle. Toutefois, « en geste de présentation » ne rend pas idiomatiquement la construction hébraïque וַיְנִיפֵהוּ תְּנוּפָה, qui décrit l'exécution d'un geste rituel de présentation avec la poitrine. De plus, « sur le bélier » est moins exact que « du bélier », puisque מִן introduit la provenance de la part attribuée.
  naturalness: '« La balança ... en geste de présentation » est maladroit en français moderne : on ne dit normalement pas qu''un objet est balancé « en geste ». « La présenta ... en faisant le geste de présentation » est clair, naturel et conserve le caractère rituel du mouvement.'
  terminology: « Yahweh », « poitrine », « investiture » et « part » sont appropriés. « Geste de présentation » convient comme désignation intelligible du rite de תְּנוּפָה, à condition de l'intégrer syntaxiquement comme un geste accompli. La note conserve correctement l'alternative « consécration ».
  issues:
  - severity: medium
    issue: Formulation rituelle maladroite
    rationale: « la balança devant Yahweh en geste de présentation » ne construit pas naturellement en français et brouille le rapport entre le mouvement rituel et son nom hébreu cognat.
  - severity: low
    issue: Préposition « sur le bélier »
    rationale: מֵאֵיל signifie « du / provenant du bélier ». « La part de Moïse du bélier » est plus fidèle et plus idiomatique que « sur le bélier ».
  revised_text: Puis Moïse prit la poitrine et la présenta devant Yahweh en faisant le geste de présentation. Elle revint à Moïse comme part du bélier d’investiture[a], comme Yahweh l’avait ordonné à Moïse.
  revised_footnotes:
  - marker: a
    text: Ou « bélier de consécration ».
    reason: lexical_alternative
