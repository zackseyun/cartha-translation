source:
  edition: WLC
  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת הֶ֣/חָזֶ֔ה וַ/יְנִיפֵ֥/הוּ תְנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה מֵ/אֵ֣יל הַ/מִּלֻּאִ֗ים לְ/מֹשֶׁ֤ה הָיָה֙ לְ/מָנָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/029.yaml
  text: Then Moses took the breast and waved it as a wave offering before Yahweh. It was Moses' portion from the ram of ordination[a], just as Yahweh had commanded Moses.
translation:
  language: fr
  text: Puis Moïse prit la poitrine et la présenta devant Yahweh en faisant le geste de présentation. Elle revint à Moïse comme part du bélier d’investiture[a], comme Yahweh l’avait ordonné à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bélier de consécration ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Puis Moïse prit
  rationale: Le wayyiqtol fait progresser le récit. « Puis » exprime naturellement la succession, tandis que « prit » rend directement le verbe לָקַח.
- source_word: הֶחָזֶה
  choice: la poitrine
  rationale: Dans le vocabulaire sacrificiel, חָזֶה désigne la poitrine de l’animal, portion déterminée du sacrifice.
- source_word: וַיְנִיפֵהוּ תְנוּפָה
  choice: la balança […] en geste de présentation
  rationale: Le verbe נוּף et le nom apparenté תְּנוּפָה évoquent le mouvement rituel de balancement par lequel l’offrande est présentée. La formulation française conserve à la fois le mouvement et sa fonction cultuelle.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: La préposition exprime une présentation dans la présence de Yahweh; « devant » est concis et idiomatique.
- source_word: מֵאֵיל הַמִּלֻּאִים
  choice: sur le bélier d’investiture
  rationale: אֵיל signifie « bélier ». Dans le contexte de l’installation sacerdotale, מִלֻּאִים désigne l’investiture ou la consécration. « Sur » indique naturellement que cette part est prélevée sur l’animal.
- source_word: לְמֹשֶׁה הָיָה לְמָנָה
  choice: Elle constitua la part de Moïse
  rationale: מָנָה désigne une part attribuée. Le pronom féminin reprend naturellement « la poitrine » en français.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: comme Yahweh l’avait ordonné à Moïse
  rationale: Cette formule indique que l’acte accompli est conforme à un commandement divin antérieur; le plus-que-parfait rend clairement cette antériorité.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom personnel plutôt que de lui substituer un titre.
- issue: Sens cultuel de מִלֻּאִים
  choice: investiture
  alternative: consécration
  rationale: Dans Lévitique 8, le terme concerne l’entrée officielle d’Aaron et de ses fils dans leur charge sacerdotale. « Investiture » met en valeur cette installation sans exclure la dimension de consécration, signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. « Geste de présentation » est employé comme terme rituel compréhensible, tandis que « balança » maintient explicitement le mouvement exprimé par la racine hébraïque נוּף.
