id: LEV.8.35
reference: Leviticus 8:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/פֶתַח֩ אֹ֨הֶל מוֹעֵ֜ד תֵּשְׁב֨וּ יוֹמָ֤ם וָ/לַ֨יְלָה֙ שִׁבְעַ֣ת יָמִ֔ים וּ/שְׁמַרְתֶּ֛ם אֶת מִשְׁמֶ֥רֶת יְהוָ֖ה וְ/לֹ֣א תָמ֑וּתוּ כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/035.yaml
  text: And you shall stay at the entrance of the tent of meeting day and night for seven days[a], and keep the charge of Yahweh, so that you may not die; for so I have been commanded.
translation:
  language: fr
  text: Vous resterez à l’entrée de la tente de la rencontre jour et nuit pendant sept jours, et vous observerez la consigne de Yahweh, afin de ne pas mourir[a], car c’est ainsi que j’en ai reçu l’ordre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et vous ne mourrez pas » ; autre possibilité : « de peur que vous ne mouriez ».'
    reason: La coordination וְלֹא suivie de l’imparfait peut être comprise comme une conséquence évitée, une affirmation coordonnée ou un avertissement.
lexical_decisions:
- source_word: וּ/פֶתַח אֹהֶל מוֹעֵד
  choice: à l’entrée de la tente de la rencontre
  rationale: פֶתַח désigne l’entrée ou l’ouverture. « À l’entrée » est naturel en français et אֹהֶל מוֹעֵד est rendu par la désignation cultuelle transparente « tente de la rencontre ».
- source_word: תֵּשְׁבוּ
  choice: vous resterez
  rationale: Dans ce contexte rituel, ישב exprime le fait de demeurer sur place plutôt que l’action littérale de s’asseoir. « Resterez » rend clairement la durée imposée.
- source_word: יוֹמָם וָלַיְלָה שִׁבְעַת יָמִים
  choice: jour et nuit pendant sept jours
  rationale: « Jour et nuit » conserve le mérisme de continuité, tandis que « pendant » introduit naturellement la durée en français.
- source_word: וּ/שְׁמַרְתֶּם אֶת מִשְׁמֶרֶת יְהוָה
  choice: et vous observerez la consigne de Yahweh
  rationale: La construction שמר + משמרת désigne l’observation d’une prescription ou d’un devoir confié. « Observer la consigne » garde la portée obligatoire et cultuelle sans la lourdeur de « garder la garde ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וְ/לֹא תָמֻתוּ
  choice: afin de ne pas mourir
  rationale: La proposition peut exprimer la conséquence évitée par l’obéissance. Cette formulation française rend naturellement cette valeur sans effacer les autres analyses possibles, signalées en note.
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: car c’est ainsi que j’en ai reçu l’ordre
  rationale: Le passif indique que Moïse rapporte l’ordre qui lui a été donné. La tournure française est idiomatique et conserve la référence de כֵן à ce qui précède.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom propre et évite de le remplacer par un titre.
- issue: Valeur de l’avertissement de mort
  choice: afin de ne pas mourir
  alternative: et vous ne mourrez pas ; de peur que vous ne mouriez
  rationale: La coordination hébraïque peut exprimer la conséquence négative évitée par l’obéissance, mais elle permet aussi une lecture plus strictement coordonnée. Le texte retient la formulation la plus naturelle dans le contexte et la note préserve l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur à valeur injonctive convient au discours prescriptif. Le vocabulaire cultuel reste précis sans calque hébraïque opaque.
