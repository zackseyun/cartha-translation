  text: וּ/מִ/פֶּתַח֩ אֹ֨הֶל מוֹעֵ֜ד לֹ֤א תֵֽצְאוּ֙ שִׁבְעַ֣ת יָמִ֔ים עַ֚ד י֣וֹם מְלֹ֔את יְמֵ֖י מִלֻּאֵי/כֶ֑ם כִּ֚י שִׁבְעַ֣ת יָמִ֔ים יְמַלֵּ֖א אֶת יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/033.yaml
  text: And you shall not go out from the entrance of the tent of meeting for seven days[a], until the day the days of your ordination are completed, for he will ordain you for seven days.
translation:
  language: fr
  text: Vous ne sortirez pas de l’entrée de la tente de la Rencontre pendant sept jours, jusqu’au jour où s’achèveront les jours de votre investiture, car, pendant sept jours, il accomplira votre investiture[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il remplira vos mains », expression hébraïque désignant l’investiture ou l’installation de quelqu’un dans le service sacerdotal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִפֶּתַח
  choice: de l’entrée
  rationale: פֶּתַח désigne l’ouverture ou l’entrée. « Entrée » est naturel en français moderne et conserve le repère spatial; la conjonction וּ est rendue implicitement, puisque commencer par « Et » serait lourd dans ce contexte.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Traduction transparente de la désignation du sanctuaire, plus proche de l’hébreu que le terme traditionnel « tabernacle ».
- source_word: לֹא תֵצְאוּ
  choice: vous ne sortirez pas
  rationale: Le futur à valeur injonctive convient au registre légal et solennel du passage sans être archaïque.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: Cette formulation exprime naturellement en français la durée pendant laquelle l’interdiction demeure en vigueur.
- source_word: עַד יוֹם מְלֹאת יְמֵי מִלֻּאֵיכֶם
  choice: jusqu’au jour où s’achèveront les jours de votre investiture
  rationale: La formulation conserve l’expression hébraïque redondante « le jour où… les jours », tout en exprimant clairement l’idée d’achèvement. « Investiture » désigne ici l’installation officielle dans la fonction sacerdotale.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de l’interdiction dans un registre soutenu mais courant.
- source_word: יְמַלֵּא אֶת יֶדְכֶם
  choice: il vous conférera l’investiture
  rationale: L’expression signifie littéralement « il remplira votre main », idiome technique relatif à l’installation des prêtres. Le sens est donné dans le texte, tandis que la forme imagée est signalée en note.
theological_decisions:
- issue: Rendu de l’idiome sacerdotal מלא את־יד
  choice: il vous conférera l’investiture
  alternative: il remplira votre main
  rationale: La traduction idiomatique communique clairement l’installation dans la charge sacerdotale et évite en français une image opaque. La note conserve l’accès à la formulation hébraïque et à son lien avec מִלֻּאִים.
- issue: Identification de l’agent de l’investiture
  choice: maintenir le pronom « il »
  alternative: expliciter « Moïse » ou employer « on »
  rationale: L’hébreu emploie un verbe à la troisième personne du masculin singulier sans nommer de nouveau le sujet dans ce verset. Le pronom préserve cette forme sans ajouter une identification explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve une part de la répétition solennelle de l’hébreu, tandis que l’idiome sacerdotal est rendu par son sens dans le texte et documenté en note.
