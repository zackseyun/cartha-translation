revisions:
- from: Vous ne sortirez pas de l’entrée de la tente de la rencontre pendant sept jours, jusqu’au jour où s’achèveront les jours de votre investiture, car pendant sept jours il vous conférera l’investiture[a].
  to: Vous ne sortirez pas de l’entrée de la tente de la Rencontre pendant sept jours, jusqu’au jour où s’achèveront les jours de votre investiture, car, pendant sept jours, il accomplira votre investiture[a].
  rationale: La révision corrige le pluriel dans la restitution littérale de l’idiome et affine le verbe final afin de rendre l’accomplissement de l’investiture sacerdotale sur sept jours. Elle ne précise pas l’identité de l’agent, qui demeure implicite dans l’hébreu, et conserve la répétition entre « jours de votre investiture » et « accomplira votre investiture ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:23:51Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est fidèle : l’interdiction de sortir, sa durée de sept jours, l’achèvement des jours d’investiture et la motivation finale sont tous conservés. L’idiome technique « remplir la/les main(s) » est correctement rendu par son sens dans le texte et expliqué en note. La note doit toutefois employer le pluriel, conformément au suffixe hébreu de deuxième personne du pluriel.'
  naturalness: Le français est globalement clair, solennel et naturel. « Il vous conférera l’investiture » est possible, mais « accomplira votre investiture » rend plus directement l’accomplissement rituel étalé sur sept jours et évite de suggérer uniquement l’octroi ponctuel d’une charge.
  terminology: « Tente de la Rencontre » est une désignation transparente et cohérente du sanctuaire ; la majuscule à « Rencontre » marque utilement son statut de titre. « Investiture » convient dans ce contexte d’installation sacerdotale. La note conserve à juste titre l’idiome hébreu sans l’imposer dans le texte courant.
  issues:
  - severity: low
    issue: 'La note traduit littéralement ידכם au singulier : « votre main ».'
    rationale: Le suffixe est pluriel (« vos mains »). Même si « main » peut parfois être collectif dans l’explication d’un idiome, le pluriel est ici la restitution littérale exacte et s’accorde avec le destinataire pluriel.
  - severity: low
    issue: « Il vous conférera l’investiture » peut évoquer l’octroi ponctuel d’un statut davantage que l’accomplissement du rite pendant sept jours.
    rationale: Le verbe hébreu, dans cet idiome sacerdotal, désigne l’installation/ordination elle-même. « Accomplira votre investiture » conserve l’agent implicite, le lien avec « jours de votre investiture » et la dimension rituelle de l’action.
  revised_text: Vous ne sortirez pas de l’entrée de la tente de la Rencontre pendant sept jours, jusqu’au jour où s’achèveront les jours de votre investiture, car, pendant sept jours, il accomplira votre investiture[a].
