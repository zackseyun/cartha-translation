  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָ֗ה וּ/מִן הַ/דָּם֮ אֲשֶׁ֣ר עַל הַ/מִּזְבֵּחַ֒ וַ/יַּ֤ז עַֽל אַהֲרֹן֙ עַל בְּגָדָ֔י/ו וְ/עַל בָּנָ֛י/ו וְ/עַל בִּגְדֵ֥י בָנָ֖י/ו אִתּ֑/וֹ וַ/יְקַדֵּ֤שׁ אֶֽת אַהֲרֹן֙ אֶת בְּגָדָ֔י/ו וְ/אֶת בָּנָ֛י/ו וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו אִתּֽ/וֹ־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/030.yaml
  text: Then Moses took some of the anointing oil and some of the blood that was on the altar[a], and sprinkled it on Aaron, on his garments, on his sons, and on the garments of his sons with him; so he consecrated Aaron, his garments, his sons, and the garments of his sons with him.
translation:
  language: fr
  text: Puis Moïse prit de l’huile d’onction et du sang qui était sur l’autel. Il en fit l’aspersion sur Aaron, sur ses vêtements, sur ses fils qui étaient avec lui et sur leurs vêtements. Il consacra ainsi Aaron, ses vêtements, ses fils qui étaient avec lui et leurs vêtements.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח ... מִשֶּׁמֶן ... וּמִן הַדָּם
  choice: prit de l’huile ... et du sang
  rationale: Les deux מִן indiquent que Moïse prélève une partie de chacune des substances. En français, l’article partitif exprime naturellement cette valeur.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: huile d’onction
  rationale: Cette expression française courante et digne conserve le sens rituel de מִשְׁחָה sans surinterprétation.
- source_word: הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: du sang qui était sur l’autel
  rationale: La proposition relative traduit directement אֲשֶׁר עַל et précise la provenance du sang.
- source_word: וַיַּז
  choice: Il en fit l’aspersion
  rationale: Le hifil de נזה désigne ici l’aspersion rituelle. Le pronom « en » reprend ensemble l’huile et le sang sans imposer l’idée non explicitée d’un mélange.
- source_word: בְּגָדָיו
  choice: ses vêtements
  rationale: « Vêtements » convient au registre rituel tout en restant actuel et moins interprétatif que « ornements sacerdotaux ».
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le masculin pluriel hébreu désigne précisément les fils d’Aaron participant à la consécration sacerdotale.
- source_word: בִּגְדֵי בָנָיו אִתּוֹ
  choice: ses fils qui étaient avec lui et leurs vêtements
  rationale: Cette formulation française rattache naturellement אִתּוֹ aux fils présents avec Aaron et évite l’expression obscure « les vêtements de ses fils avec lui », tout en conservant tous les participants et objets nommés.
- source_word: וַיְקַדֵּשׁ
  choice: Il consacra ainsi
  rationale: Dans ce contexte d’installation sacerdotale, « consacrer » exprime la mise à part pour le service sacré. « Ainsi » rend le lien entre l’aspersion et son résultat sans exagérer la causalité.
theological_decisions:
- issue: Sens de קדשׁ dans le rite d’installation sacerdotale
  choice: consacra
  alternative: sanctifia / rendit saint
  rationale: « Consacra » communique ici la mise à part rituelle d’Aaron, de ses fils et de leurs vêtements pour le service sacré, sans importer une catégorie doctrinale ultérieure.
- issue: Référence genrée aux descendants d’Aaron
  choice: ses fils
  alternative: ses enfants
  rationale: Le texte hébreu emploie explicitement le masculin pluriel et vise les fils d’Aaron ordonnés au sacerdoce.
- issue: Référent de אִתּוֹ (« avec lui »)
  choice: les fils qui étaient avec Aaron
  alternative: maintenir la formulation littérale ambiguë « les vêtements de ses fils avec lui »
  rationale: La proximité syntaxique permet de comprendre que les fils sont avec Aaron; la formulation retenue rend cette relation intelligible en français. Elle ne précise pas davantage l’identité du référent pronominal dans le texte principal, où « lui » renvoie naturellement à Aaron.
translation_notes:
  register: 'Français international moderne, digne et accessible. La répétition de la liste dans la seconde phrase est conservée afin de refléter l’insistance rituelle de l’hébreu. Aucune note n’est ajoutée: la note anglaise fournie ne correspond pas à son appel placé après « autel » et ne repose pas sur une variante du texte hébreu.'
