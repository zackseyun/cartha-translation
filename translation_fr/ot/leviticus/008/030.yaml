  source_fidelity: 'Le texte rend fidèlement la succession des actions et tous les éléments de la liste hébraïque : prélèvement d’une partie de l’huile d’onction et du sang sur l’autel, aspersion d’Aaron, de ses vêtements, de ses fils et de leurs vêtements, puis consécration de ce même ensemble. Les partitifs français rendent naturellement les deux emplois de מִן. « Il en fit l’aspersion » restitue l’objet implicite de וַיַּז sans affirmer que l’huile et le sang auraient été mélangés.'
  naturalness: Le français est actuel, clair et adapté au registre rituel sans être inutilement archaïque. La reprise explicative « ses fils qui étaient avec lui et sur leurs vêtements » est fluide et évite une construction française pesante tout en conservant les référents du texte.
  terminology: « Huile d’onction », « aspersion », « autel », « vêtements », « fils » et « consacra » sont des choix précis et cohérents avec le contexte sacerdotal. « Consacra » rend convenablement וַיְקַדֵּשׁ dans ce cadre rituel sans surcharger le texte d’une interprétation confessionnelle.
