  text: For six days you shall gather it[a], but on the seventh day, a Sabbath[c][b], there will be none.
translation:
  language: fr
  text: 'Pendant six jours, vous la ramasserez, mais le septième jour est un sabbat[a] : il n’y en aura pas ce jour-là[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le septième jour, sabbat ».'
    reason: lexical_alternative
  - marker: b
    text: 'C’est-à-dire : il n’y aura pas de manne ce jour-là.'
    reason: clarification
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Pendant six jours
  rationale: La construction signifie idiomatiquement « six jours »; « pendant » exprime naturellement en français la durée de la collecte.
- source_word: תִּלְקְטֻהוּ
  choice: vous la ramasserez
  rationale: Le verbe לקט désigne ici l’action de ramasser ou recueillir la manne; le suffixe masculin singulier est rendu par « la » selon le genre français de « manne », référent donné par le contexte.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: mais le septième jour
  rationale: Le waw peut signifier simplement « et », mais le contraste entre les six jours et le septième justifie naturellement « mais ».
- source_word: שַׁבָּת
  choice: qui est un sabbat
  rationale: Le nom sans article est en apposition à « le septième jour ». La relative permet de conserver cette identification dans un français naturel sans transformer le terme en « jour de repos ».
- source_word: לֹא יִהְיֶה בּוֹ
  choice: il n’y en aura pas
  rationale: Littéralement, « il n’y en aura pas en/sur lui ». Le pronom בּוֹ renvoie au jour; en français, sa valeur temporelle est déjà portée par « le septième jour », tandis que « en » reprend sans la nommer la manne attendue.
theological_decisions:
- issue: Traduction de שַׁבָּת avant la révélation au Sinaï
  choice: un sabbat
  alternative: le sabbat ; un jour de repos
  rationale: L’absence d’article et l’apposition favorisent « un sabbat ». Ce choix conserve la formulation du texte sans lui imposer une définition liturgique plus développée ni réduire le terme à une simple paraphrase.
translation_notes:
  register: Français international moderne, simple et digne. « Ramasser » convient à la collecte de la manne; « sabbat » conserve le terme théologiquement chargé du texte hébreu. Les marqueurs [a] et [b] figurent tous deux dans le corps du verset.
