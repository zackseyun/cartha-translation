  text: When the layer of dew had gone up[a], behold, on the surface of the wilderness was a fine, flaky thing, fine as frost on the ground.
translation:
  language: fr
  text: Quand la couche de rosée s’était levée, voici qu’à la surface du désert il y avait quelque chose de fin, de floconneux[a], aussi fin que le givre sur le sol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’aspect écailleux » ou « granuleux » ; le sens précis du rare terme hébreu est incertain et peut décrire la texture ou l’apparence.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל
  choice: se fut levée
  rationale: Le verbe עלה signifie littéralement « monter ». Cette formulation conserve l’image hébraïque sans préciser que la rosée s’est évaporée ou dissipée.
- source_word: שִׁכְבַת הַטָּל
  choice: la couche de rosée
  rationale: שִׁכְבָה désigne ici une couche ou une masse étendue; « couche de rosée » est clair et naturel en français.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: La tournure attire l’attention sur la découverte soudaine, comme la particule hébraïque הִנֵּה, tout en restant idiomatique en français actuel.
- source_word: עַל פְּנֵי הַמִּדְבָּר
  choice: à la surface du désert
  rationale: פְּנֵי exprime la face ou la surface. Dans ce contexte, « désert » rend naturellement מִדְבָּר sans imposer une description climatique plus précise que le texte.
- source_word: דַּק
  choice: fin / aussi fin
  rationale: La répétition rend les deux occurrences de דַּק et maintient l’insistance descriptive du texte hébreu.
- source_word: מְחֻסְפָּס
  choice: en flocons
  rationale: Ce terme hébreu très rare semble décrire l’aspect ou la texture de la substance, mais son sens précis demeure incertain. « En flocons » donne une représentation plausible sans l’ériger en certitude.
- source_word: דַּק כַּכְּפֹר
  choice: aussi fin que du givre
  rationale: La comparaison est conservée explicitement; « givre » rend כְּפֹר de manière concise et visuelle.
- source_word: עַל הָאָרֶץ
  choice: sur le sol
  rationale: Dans cette description concrète, « sol » est le sens contextuel naturel de אֶרֶץ.
