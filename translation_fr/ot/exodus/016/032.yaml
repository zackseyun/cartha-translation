  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה זֶ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֔ה מְלֹ֤א הָ/עֹ֨מֶר֙ מִמֶּ֔/נּוּ לְ/מִשְׁמֶ֖רֶת לְ/דֹרֹתֵי/כֶ֑ם לְמַ֣עַן יִרְא֣וּ אֶת הַ/לֶּ֗חֶם אֲשֶׁ֨ר הֶאֱכַ֤לְתִּי אֶתְ/כֶם֙ בַּ/מִּדְבָּ֔ר בְּ/הוֹצִיאִ֥/י אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/032.yaml
  text: 'And Moses said[a], “This is the thing that Yahweh has commanded: Let a full omer of it be kept throughout your generations, so that they may see the bread with which I fed you in the wilderness, when I brought you out from the land of Egypt.”'
translation:
  language: fr
  text: 'Moïse dit : « Voici ce que Yahweh a ordonné : Qu’on en garde un omer entier[a] au fil de vos générations, afin qu’elles voient le pain dont je vous ai nourris dans le désert, quand je vous ai fait sortir du pays d’Égypte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’omer était une ancienne mesure de capacité.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: Moïse dit
  rationale: Le wayyiqtol poursuit le récit et introduit le discours direct ; le passé simple donne en français une narration naturelle et digne sans exiger un « Et » initial.
- source_word: זֶה הַדָּבָר אֲשֶׁר צִוָּה
  choice: Voici ce que … a ordonné
  rationale: Cette formulation française rend naturellement l’expression introductive « voici la chose que » tout en conservant la force prescriptive de צוה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle en français du nom divin personnel représenté par le tétragramme.
- source_word: מְלֹא הָעֹמֶר מִמֶּנּוּ
  choice: un plein omer
  rationale: מְלֹא indique la pleine contenance de la mesure ; l’unité ancienne est conservée et expliquée en note.
- source_word: לְמִשְׁמֶרֶת
  choice: qu’on en garde
  rationale: Le nom de destination exprime ici la conservation ou la mise en réserve ; une tournure verbale est plus naturelle en français.
- source_word: לְדֹרֹתֵיכֶם
  choice: au fil de vos générations
  rationale: L’expression désigne la succession durable des générations, et non seulement une conservation momentanée.
- source_word: לְמַעַן יִרְאוּ
  choice: afin qu’elles voient
  rationale: Le féminin pluriel renvoie explicitement et naturellement aux « générations » en français, tout en maintenant la proposition de but.
- source_word: הַלֶּחֶם אֲשֶׁר הֶאֱכַלְתִּי אֶתְכֶם
  choice: le pain dont je vous ai nourris
  rationale: « Pain » conserve le terme concret לֶחֶם, tandis que le hiphil de אכל est rendu par « nourrir ».
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: Dans le contexte de l’Exode, « désert » est le terme français courant et naturel pour מִדְבָּר.
- source_word: בְּהוֹצִיאִי אֶתְכֶם מֵאֶרֶץ מִצְרָיִם
  choice: quand je vous ai fait sortir du pays d’Égypte
  rationale: La construction infinitive est temporelle ; « faire sortir » garde la valeur causative du verbe et « pays d’Égypte » correspond précisément à אֶרֶץ מִצְרָיִם.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom divin personnel ; sa transcription le distingue du titre אֲדֹנָי et préserve cette donnée du texte source.
- issue: Identité du locuteur dans « je vous ai nourris » et « je vous ai fait sortir »
  choice: Maintien de la première personne telle quelle
  alternative: Expliciter « moi, Yahweh »
  rationale: La citation passe sans rupture explicite du commandement rapporté à la parole divine à la première personne. La traduction conserve cette forme et sa tension discursive sans ajouter une identification absente de l’hébreu.
translation_notes:
  register: Français international moderne, clair et soutenu. La syntaxe reste proche de l’hébreu sans calque pesant ; l’unité ancienne et le nom divin sont conservés.
