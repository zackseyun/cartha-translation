  text: And the sons of Israel did so[a], and they gathered, some more and some less.
translation:
  language: fr
  text: 'Les Israélites firent ainsi : ils en ramassèrent, les uns beaucoup, les autres peu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « celui qui en ramassait beaucoup et celui qui en ramassait peu » (les formes hébraïques peuvent aussi décrire l’action en cours).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: firent ainsi
  rationale: Cette expression renvoie à l’instruction précédente. « Firent ainsi » est naturel, digne et conserve la valeur de עשה avec כן.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: L’expression désigne collectivement le peuple d’Israël. En français moderne, « les Israélites » est plus naturel que le calque « les fils d’Israël » et inclut ici l’ensemble de la communauté.
- source_word: וַיִּלְקְטוּ
  choice: ils en ramassèrent
  rationale: לקט signifie ramasser ou recueillir, notamment de la nourriture. Le pronom « en » reprend naturellement la manne mentionnée dans le contexte.
- source_word: הַמַּרְבֶּה וְהַמַּמְעִיט
  choice: les uns beaucoup, les autres peu
  rationale: Les participes substantivés opposent celui qui ramasse beaucoup à celui qui ramasse peu. Cette formulation française rend clairement la distribution au sein du groupe sans imposer un sujet masculin singulier.
