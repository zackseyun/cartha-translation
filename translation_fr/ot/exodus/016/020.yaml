  terminology: « Moïse », « certains hommes », « vers » et « se mit en colère contre eux » conviennent au registre narratif moderne. La note b doit porter sur l’apparition des vers, conformément à l’hébreu et à la piste d’audit anglaise, non sur l’odeur.
