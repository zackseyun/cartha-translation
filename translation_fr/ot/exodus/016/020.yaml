  source_fidelity: 'La traduction rend correctement la désobéissance envers Moïse, le fait que certains hommes aient gardé une partie de la manne jusqu’au matin, l’apparition des vers et la colère de Moïse. Toutefois, « cela devint infect » est sémantiquement imprécis : infect qualifie couramment ce qui est contaminé ou répugnant, tandis que le verbe hébreu signifie explicitement « puer ».'
