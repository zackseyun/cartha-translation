  text: וְ/לֹא שָׁמְע֣וּ אֶל מֹשֶׁ֗ה וַ/יּוֹתִ֨רוּ אֲנָשִׁ֤ים מִמֶּ֨/נּוּ֙ עַד בֹּ֔קֶר וַ/יָּ֥רֻם תּוֹלָעִ֖ים וַ/יִּבְאַ֑שׁ וַ/יִּקְצֹ֥ף עֲלֵ/הֶ֖ם מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/020.yaml
  text: But they did not listen to Moses[a], and some men left some of it until morning, and it bred worms and stank[b]; and Moses was angry with them.
translation:
  language: fr
  text: Mais ils n’écoutèrent pas Moïse[a], et certains hommes en laissèrent jusqu’au matin. Des vers s’y développèrent[b], et la manne se mit à puer. Moïse se mit en colère contre eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne tinrent pas compte de Moïse ». En hébreu, l’expression peut désigner un refus d’écouter qui implique la désobéissance.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « des vers y apparurent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ אֶל מֹשֶׁה
  choice: n’écoutèrent pas Moïse
  rationale: שׁמע avec אֶל signifie écouter ou prêter attention à quelqu’un, avec ici une implication de désobéissance. « N’écoutèrent pas » conserve le sens direct sans expliciter excessivement « n’obéirent pas ».
- source_word: וַיּוֹתִרוּ ... מִמֶּנּוּ
  choice: certains hommes en laissèrent
  rationale: Le hiphil de יתר exprime l’action de laisser subsister ou de garder une partie. La tournure pronominale française est naturelle et renvoie clairement à la manne.
- source_word: אֲנָשִׁים
  choice: certains hommes
  rationale: Le nom est masculin pluriel et désigne ici un sous-ensemble indéfini. « Certains hommes » en respecte la forme et la fonction contextuelle.
- source_word: עַד בֹּקֶר
  choice: jusqu’au matin
  rationale: Rendu temporel direct et idiomatique en français.
- source_word: וַיָּרֻם תּוֹלָעִים
  choice: des vers s’y développèrent
  rationale: L’expression décrit l’apparition ou la prolifération de vers dans la manne. Cette formulation française est claire et proche de l’image hébraïque.
- source_word: וַיִּבְאַשׁ
  choice: cela devint infect
  rationale: Le verbe signifie devenir puant ou exhaler une mauvaise odeur. « Devint infect » est naturel, vigoureux et évite l’ambiguïté moderne possible de « puer » quant au registre.
- source_word: וַיִּקְצֹף עֲלֵהֶם
  choice: Moïse se mit en colère contre eux
  rationale: קצף exprime la colère; « se mit en colère » rend la progression narrative du wayyiqtol, et « contre eux » correspond naturellement à עֲלֵהֶם.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe est divisée en phrases courtes pour rendre clairement la succession des actes et de leurs conséquences, sans atténuer la désobéissance ni la colère de Moïse.
