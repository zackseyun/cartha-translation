  text: And they gathered it morning by morning[a], each according to what he could eat; but when the sun grew hot, it melted.
translation:
  language: fr
  text: Ils la ramassaient matin après matin, chacun selon ce qu’il pouvait manger[a] ; mais quand le soleil devenait chaud, elle fondait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « chacun selon la bouche de ce qu’il mangeait », c’est-à-dire en proportion de ce que chacun pouvait manger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְקְטוּ
  choice: ils la ramassaient
  rationale: Le verbe לקט désigne l’action de ramasser ou de recueillir, notamment de la nourriture. L’imparfait français exprime naturellement l’action répétée indiquée par le contexte et la locution distributive suivante.
- source_word: אֹתוֹ
  choice: la
  rationale: Le pronom objet renvoie à la manne mentionnée dans le contexte précédent. Le féminin français s’accorde avec « manne », sans répéter le nom absent de l’hébreu.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: matin après matin
  rationale: La répétition hébraïque a une valeur distributive et itérative. « Matin après matin » la conserve dans un français naturel et actuel.
- source_word: אִישׁ
  choice: chacun
  rationale: Employé distributivement, אִישׁ désigne ici chaque membre du peuple. « Chacun » rend cette fonction naturellement sans ajouter une restriction masculine que le français n’exige pas dans ce contexte collectif.
- source_word: כְּפִי אָכְלוֹ
  choice: selon ce qu’il pouvait manger
  rationale: L’expression signifie littéralement « selon la bouche de son manger » et indique la quantité correspondant à la capacité ou au besoin alimentaire de chacun. La formulation choisie rend l’idiome sans l’aplatir en simple quantité prescrite.
- source_word: וְחַם הַשֶּׁמֶשׁ
  choice: mais quand le soleil devenait brûlant
  rationale: Le verbe חם indique que le soleil devient chaud. La subordination temporelle restitue la séquence narrative, tandis que « mais » marque naturellement le contraste avec le ramassage matinal.
- source_word: וְנָמָס
  choice: elle fondait
  rationale: מסס signifie fondre ou se dissoudre. « Fondait » est le terme courant approprié pour la manne sous l’effet de la chaleur, et l’imparfait correspond à la situation répétée.
theological_decisions: []
translation_notes:
  register: Français international moderne, courant et digne. La répétition « matin après matin » préserve l’insistance distributive de l’hébreu. Le pronom féminin renvoie contextuellement à la manne, sans introduire son nom dans le corps du verset.
