  text: וַ/יִּרְא֣וּ בְנֵֽי יִשְׂרָאֵ֗ל וַ/יֹּ֨אמְר֜וּ אִ֤ישׁ אֶל אָחִי/ו֙ מָ֣ן ה֔וּא כִּ֛י לֹ֥א יָדְע֖וּ מַה ה֑וּא וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֲלֵ/הֶ֔ם ה֣וּא הַ/לֶּ֔חֶם אֲשֶׁ֨ר נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם לְ/אָכְלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/015.yaml
  text: When the sons of Israel saw it[a], they said to one another, “What is it?” For they did not know what it was. And Moses said to them[b], “It is the bread that Yahweh has given you to eat.”
translation:
  language: fr
  text: 'Quand les Israélites le virent, ils se dirent les uns aux autres[a] : « Qu’est-ce que c’est ? »[b] En effet, ils ne savaient pas ce que c’était. Moïse leur dit : « C’est le pain que Yahweh vous a donné à manger. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « un homme à son frère », expression idiomatique qui signifie ici « les uns aux autres ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque traduite par « Qu’est-ce que c’est ? » est traditionnellement mise en relation avec le nom « manne ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette désignation française naturelle rend ici l’ensemble du peuple désigné par l’expression hébraïque littérale « les fils d’Israël », sans donner à tort l’impression que seuls les hommes sont concernés.
- source_word: אִישׁ אֶל אָחִיו
  choice: les uns aux autres
  rationale: L’expression hébraïque signifie littéralement « un homme à son frère », mais fonctionne comme un idiome de réciprocité. La traduction retenue en communique naturellement le sens.
- source_word: מָן הוּא
  choice: Qu’est-ce que c’est ?
  rationale: 'Dans le contexte, מָן est compris comme une expression interrogative, ce que confirme la proposition suivante : ils ne savaient pas ce que c’était. Cette formulation française préserve la progression narrative.'
- source_word: לֹא יָדְעוּ מַה הוּא
  choice: ils ne savaient pas ce que c’était
  rationale: Traduction directe et idiomatique de la proposition explicative, qui précise la raison de leur question.
- source_word: הוּא הַלֶּחֶם
  choice: C’est le pain
  rationale: Le pronom suivi du nom identifie la substance observée. « C’est le pain » est naturel en français et conserve cette valeur d’identification.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de conserver le nom personnel présent dans le texte hébreu.
- source_word: לְאָכְלָה
  choice: à manger
  rationale: 'Cette tournure française concise exprime naturellement le but de ce don : servir de nourriture au peuple.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. La translittération « Yahweh » conserve le nom divin plutôt que de lui substituer un titre.
- issue: Interprétation de מָן comme question ou comme nom propre
  choice: Qu’est-ce que c’est ?
  alternative: C’est de la manne ; Manne ?
  rationale: La proposition explicative qui suit indique que les Israélites ignoraient ce qu’était la substance. Le mot fonctionne donc ici comme une question, tout en préparant le nom traditionnel « manne » ; ce lien est signalé en note sans être imposé au texte principal.
translation_notes:
  register: Français international moderne, naturel et digne. « Les Israélites » est préféré au calque « les fils d’Israël » pour désigner clairement tout le peuple. Les deux notes sont placées immédiatement après les expressions qu’elles expliquent.
