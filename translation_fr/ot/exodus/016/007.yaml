  text: וּ/בֹ֗קֶר וּ/רְאִיתֶם֙ אֶת כְּב֣וֹד יְהוָ֔ה בְּ/שָׁמְע֥/וֹ אֶת תְּלֻנֹּתֵי/כֶ֖ם עַל יְהוָ֑ה וְ/נַ֣חְנוּ מָ֔ה כִּ֥י תלונו עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/007.yaml
  text: And in the morning you will see the glory of Yahweh[a], because he has heard your grumblings against Yahweh. And what are we, that you grumble against us?
translation:
  language: fr
  text: Le matin, vous verrez la gloire de Yahweh, parce qu’il a entendu[a] vos murmures contre Yahweh. Et nous, que sommes-nous, pour que vous murmuriez contre nous ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quand il entend vos murmures contre Yahweh ». La construction hébraïque peut avoir une valeur temporelle aussi bien que causale.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בֹקֶר
  choice: Le matin
  rationale: Le nom précédé de la conjonction a ici une valeur adverbiale temporelle. « Le matin » est naturel en français et le lien séquentiel reste assuré par le contexte.
- source_word: וּ/רְאִיתֶם
  choice: vous verrez
  rationale: Dans cette séquence prédictive, la forme verbale exprime un événement futur. Le futur simple en restitue clairement la valeur.
- source_word: כְּבוֹד יְהוָה
  choice: la gloire de Yahweh
  rationale: כָּבוֹד désigne ici la manifestation éclatante et pleine de poids de la présence divine. « La gloire de Yahweh » conserve la formulation théologique et le nom propre.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin plutôt que de lui substituer un titre.
- source_word: בְּ/שָׁמְע/וֹ
  choice: parce qu’il a entendu
  rationale: La préposition ב avec l’infinitif construit peut avoir une valeur causale ou temporelle. La valeur causale explique ici la manifestation de la gloire de Yahweh; l’autre possibilité est signalée en note.
- source_word: תְּלֻנֹּתֵי/כֶם
  choice: vos murmures
  rationale: Le terme désigne des plaintes répétées et hostiles. « Murmures » garde cette nuance négative tout en restant compréhensible en français moderne.
- source_word: עַל יְהוָה
  choice: contre Yahweh
  rationale: Avec le vocabulaire de la plainte, עַל marque la personne visée; « contre » rend cette orientation hostile.
- source_word: וְ/נַחְנוּ מָה
  choice: Et nous, que sommes-nous
  rationale: La question rhétorique souligne l’insignifiance de Moïse et d’Aaron par rapport à Yahweh. « Et » reproduit simplement la coordination hébraïque.
- source_word: כִּי תלונו
  choice: pour que vous murmuriez
  rationale: כִּי introduit ici la portée de la question rhétorique. La tournure française « que sommes-nous pour que… ? » est naturelle et conserve le lien avec le nom « murmures ».
- source_word: עָלֵינוּ
  choice: contre nous
  rationale: La plainte est dirigée contre Moïse et Aaron; « contre nous » maintient aussi le parallélisme avec « contre Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. Employer « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Valeur causale ou temporelle de בְּשָׁמְעוֹ
  choice: parce qu’il a entendu
  alternative: quand il entendra
  rationale: La lecture causale exprime naturellement que la manifestation de la gloire répond aux murmures entendus par Yahweh. La syntaxe hébraïque permet aussi une lecture temporelle, conservée en note afin de ne pas effacer l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. « Murmures » conserve la tonalité réprobatrice du texte et permet de maintenir la cohésion entre le nom et le verbe. La question finale garde sa force rhétorique sans expliciter davantage le contraste.
