source:
  edition: WLC
  text: רְא֗וּ כִּֽי יְהוָה֮ נָתַ֣ן לָ/כֶ֣ם הַ/שַּׁבָּת֒ עַל כֵּ֠ן ה֣וּא נֹתֵ֥ן לָ/כֶ֛ם בַּ/יּ֥וֹם הַ/שִּׁשִּׁ֖י לֶ֣חֶם יוֹמָ֑יִם שְׁב֣וּ אִ֣ישׁ תַּחְתָּ֗י/ו אַל יֵ֥צֵא אִ֛ישׁ מִ/מְּקֹמ֖/וֹ בַּ/יּ֥וֹם הַ/שְּׁבִיעִֽי־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/029.yaml
  text: See[a], for Yahweh has given you the Sabbath; therefore on the sixth day he gives you bread for two days. Let each man stay in his place; let no man go out from his place on the seventh day.
translation:
  language: fr
  text: 'Voyez : Yahweh vous a donné le sabbat. C’est pourquoi, le sixième jour, il vous donne du pain pour deux jours. Que chacun reste là où il est ; que personne ne sorte de l’endroit où il se trouve le septième jour.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְאוּ
  choice: Voyez
  rationale: L’impératif pluriel appelle les Israélites à constater et à reconnaître ce qui suit. « Voyez » conserve sa force directe.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, sans lui substituer un titre.
- source_word: נָתַן לָכֶם הַשַּׁבָּת
  choice: vous a donné le sabbat
  rationale: Le parfait présente le sabbat comme un don déjà accordé à la communauté.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette locution exprime la conséquence de manière naturelle et explicite en français moderne.
- source_word: נֹתֵן
  choice: il vous donne
  rationale: Le participe décrit ici l’action présente ou habituelle par laquelle Yahweh assure la provision du sixième jour.
- source_word: לֶחֶם יוֹמָיִם
  choice: du pain pour deux jours
  rationale: Cette formulation naturelle conserve le terme concret « pain » et le sens littéral de provision couvrant deux jours.
- source_word: שְׁבוּ אִישׁ תַּחְתָּיו
  choice: Que chacun reste là où il est
  rationale: ישב signifie ici rester ou demeurer, et תַּחְתָּיו désigne idiomatiquement l’endroit où chacun se trouve.
- source_word: אַל יֵצֵא אִישׁ מִמְּקֹמוֹ
  choice: que personne ne sorte de chez lui
  rationale: Le jussif négatif exprime une interdiction. « Personne » rend naturellement en français la portée distributive de אִישׁ, tandis que « de chez lui » exprime ici le lieu propre à chacun.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: le septième jour
  rationale: La formulation suffit à identifier le jour dans la séquence, sans ajout explicatif.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme ; « Yahweh » préserve le nom personnel plutôt que de le remplacer par un titre.
- issue: Portée du masculin distributif אִישׁ
  choice: chacun / personne
  alternative: chaque homme / qu’aucun homme
  rationale: Dans ces deux propositions, אִישׁ distribue l’ordre à tous les membres de la communauté. Les tournures françaises inclusives rendent cette portée sans laisser entendre que seuls les hommes sont concernés.
- issue: Étendue de l’interdiction du septième jour
  choice: ne sorte de chez lui
  alternative: ne quitte sa place
  rationale: Le verset interdit à chacun de sortir de son propre lieu dans le contexte précis de la collecte de la manne. La traduction conserve l’ordre sans en tirer une règle plus large que le texte lui-même.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La ponctuation sépare nettement le constat, sa conséquence et les deux injonctions. « Sabbat » prend la minuscule conformément à l’usage français courant.
