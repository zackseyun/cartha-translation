review_pass:
  verdict: revise
  source_fidelity: 'Le rendu suit bien la structure et le sens du texte hébreu : l’appel à reconnaître (« Voyez »), le don du sabbat, la provision de deux jours et les deux injonctions distributives sont conservés. Toutefois, « de chez lui » restreint מִמְּקֹמוֹ (« de son lieu / de l’endroit où il est ») au domicile, restriction absente de l’hébreu.'
  naturalness: Le français est moderne, clair et d’un registre approprié. « Reste là où il est » est naturel. La seconde injonction est plus exacte et tout aussi idiomatique avec « ne sorte pas de l’endroit où il se trouve ».
  terminology: « Yahweh » restitue correctement le tétragramme, et « le sabbat » est conforme à l’usage français courant. « Chacun » et « personne » rendent naturellement la valeur distributive de אִישׁ sans imposer une lecture limitée aux hommes.
  issues:
