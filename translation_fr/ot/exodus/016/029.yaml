    issue: « de chez lui » pour מִמְּקֹמוֹ
    rationale: « Chez lui » signifie normalement le domicile ou la maison, alors que מָקוֹם désigne plus largement le lieu ou l’endroit où se trouve chacun. Cette précision indue modifie la portée spatiale de l’ordre.
