revisions:
- from: 'Voyez : Yahweh vous a donné le sabbat. C’est pourquoi, le sixième jour, il vous donne du pain pour deux jours. Que chacun reste là où il est ; que personne ne sorte de chez lui le septième jour.'
  to: 'Voyez : Yahweh vous a donné le sabbat. C’est pourquoi, le sixième jour, il vous donne du pain pour deux jours. Que chacun reste là où il est ; que personne ne sorte de l’endroit où il se trouve le septième jour.'
  rationale: La révision remplace uniquement « de chez lui », qui ajoutait la notion de domicile, par « de l’endroit où il se trouve », afin de rendre la portée non spécifiée de מִמְּקֹמוֹ tout en conservant un français naturel et l’effet distributif des deux injonctions.
