id: EXO.16.16
reference: Exodus 16:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זֶ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֔ה לִקְט֣וּ מִמֶּ֔/נּוּ אִ֖ישׁ לְ/פִ֣י אָכְל֑/וֹ עֹ֣מֶר לַ/גֻּלְגֹּ֗לֶת מִסְפַּר֙ נַפְשֹׁ֣תֵי/כֶ֔ם אִ֛ישׁ לַ/אֲשֶׁ֥ר בְּ/אָהֳל֖/וֹ תִּקָּֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/016.yaml
  text: 'This is the word that Yahweh has commanded: ‘Gather from it[a], each man according to his eating; an omer per person, according to the number of your persons. Each man shall take for those who are in his tent.’'
translation:
  language: fr
  text: 'Voici ce que Yahweh a ordonné : « Ramassez-en, chacun selon ce qu’il mange : un omer par personne, d’après le nombre de personnes que vous êtes. Chacun en prendra pour ceux qui sont dans sa tente. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶה הַדָּבָר אֲשֶׁר צִוָּה
  choice: Voici ce que … a ordonné
  rationale: La formule présente le contenu du commandement. Cette tournure française naturelle restitue la valeur de דָּבָר sans imposer le calque moins idiomatique « la parole que ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est conservé sous forme translittérée plutôt que remplacé par un titre.
- source_word: לִקְטוּ מִמֶּנּוּ
  choice: Ramassez-en
  rationale: לקט désigne ici l’action de recueillir la manne; le pronom français « en » reprend naturellement ce dont il faut ramasser une quantité.
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: chacun selon ce qu’il mange
  rationale: אִישׁ a une valeur distributive, et l’expression indique la quantité consommée ou nécessaire à chacun. La formulation garde le singulier masculin du texte tout en restant idiomatique.
- source_word: עֹמֶר לַגֻּלְגֹּלֶת
  choice: un omer par personne
  rationale: עֹמֶר est une mesure ancienne précise, conservée par translittération. לַגֻּלְגֹּלֶת signifie littéralement « par tête », ici au sens distributif de « par personne ».
- source_word: מִסְפַּר נַפְשֹׁתֵיכֶם
  choice: d’après le nombre de personnes que vous êtes
  rationale: נֶפֶשׁ désigne ici des personnes comptées, non une composante immatérielle appelée « âme ». La tournure française exprime clairement le nombre total des personnes concernées.
- source_word: אִישׁ לַאֲשֶׁר בְּאָהֳלוֹ תִּקָּחוּ
  choice: Chacun en prendra pour ceux qui sont dans sa tente
  rationale: La formulation préserve l’image concrète de la tente et la distribution individuelle. Le futur français porte ici la valeur prescriptive du commandement.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom propre divin; sa translittération préserve cette donnée au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset conserve « omer » comme nom de mesure ancienne; aucune note n’est nécessaire ici, puisque le sens distributif de לַגֻּלְגֹּלֶת est rendu directement par « par personne ».
