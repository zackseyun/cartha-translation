  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/דַבֵּ֤ר אַהֲרֹן֙ אֶל כָּל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל וַ/יִּפְנ֖וּ אֶל הַ/מִּדְבָּ֑ר וְ/הִנֵּה֙ כְּב֣וֹד יְהוָ֔ה נִרְאָ֖ה בֶּ/עָנָֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/010.yaml
  text: And it happened[a], as Aaron spoke to the whole congregation of the sons of Israel, that they turned toward the wilderness, and behold[b], the glory of Yahweh appeared in the cloud.
translation:
  language: fr
  text: Et il arriva que, pendant qu’Aaron parlait à toute la communauté des fils d’Israël[a], ils se tournèrent vers le désert. Et voici que la gloire de Yahweh apparut dans la nuée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de toute la communauté des Israélites ». L’hébreu dit littéralement « des fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Et il arriva que
  rationale: Cette formule conserve la fonction narrative du wayyiqtol de היה et l’enchaînement avec le contexte, dans un français digne sans recourir à l’archaïque « il advint ».
- source_word: כְּדַבֵּר אַהֲרֹן
  choice: pendant qu’Aaron parlait
  rationale: La préposition כ avec l’infinitif construit exprime ici la simultanéité; l’imparfait français rend naturellement l’action en cours.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: toute la communauté des fils d’Israël
  rationale: עֵדָה désigne la communauté rassemblée, tandis que « fils d’Israël » maintient l’expression filiale explicite de l’hébreu. Une formulation plus idiomatique est signalée en note.
- source_word: וַיִּפְנוּ אֶל הַמִּדְבָּר
  choice: ils se tournèrent vers le désert
  rationale: פנה avec אֶל décrit un mouvement d’orientation en direction du désert; « se tourner vers » le restitue sans ajouter l’idée d’un déplacement.
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: La particule attire soudainement l’attention sur la manifestation qui suit. « Voici que » en conserve la force déictique et solennelle tout en restant compréhensible.
- source_word: כְּבוֹד יְהוָה
  choice: la gloire de Yahweh
  rationale: כָּבוֹד désigne ici la gloire divine rendue manifeste, et le génitif hébreu est conservé directement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre divin plutôt que remplacé par un titre.
- source_word: נִרְאָה
  choice: apparut
  rationale: Le niphal de ראה a ici le sens intransitif de devenir visible; « apparut » convient à cette manifestation sans préciser davantage sa nature.
- source_word: בֶּעָנָן
  choice: dans la nuée
  rationale: L’article hébreu indique une réalité définie. « La nuée » conserve cette détermination et le registre de la manifestation divine dans le récit du désert.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » préserve le nom personnel sans lui substituer un titre.
- issue: Traduction de בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: Israélites; enfants d’Israël
  rationale: La formulation principale garde l’image filiale et le masculin pluriel du texte hébreu. La note fournit l’équivalent collectif idiomatique sans effacer la forme de la source.
- issue: Nature de la manifestation dans la nuée
  choice: la gloire de Yahweh apparut dans la nuée
  alternative: la gloire de Yahweh fut vue dans la nuée
  rationale: Le niphal permet une formulation liée à la visibilité, mais « apparut » exprime la manifestation sans décider si l’accent porte sur l’acte divin de se montrer ou sur la perception du peuple.
translation_notes:
  register: Français international moderne, narratif et digne. « Et il arriva que » et « voici que » conservent la cadence et la mise en relief de l’hébreu sans archaïsme excessif. « Nuée » maintient le registre biblique de la manifestation divine; la syntaxe générale reste accessible à la lecture publique.
