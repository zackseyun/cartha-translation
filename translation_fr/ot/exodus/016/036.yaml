  text: An omer is a tenth of an ephah[a].
translation:
  language: fr
  text: L’omer correspond à un dixième d’épha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’omer et l’épha sont d’anciennes mesures hébraïques de capacité pour les matières sèches. Ce verset précise qu’un omer équivaut à un dixième d’épha.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֹמֶר
  choice: l’omer
  rationale: עֹמֶר désigne une ancienne unité de mesure pour les matières sèches. La translittération « omer » évite une conversion moderne approximative; l’article défini hébreu est naturellement conservé dans cette phrase de définition.
- source_word: עֲשִׂרִית
  choice: un dixième
  rationale: Le terme indique ici une fraction, soit un dixième de l’unité nommée ensuite.
- source_word: הָאֵיפָה
  choice: d’épha
  rationale: אֵיפָה est une autre ancienne mesure de capacité pour les matières sèches. La translittération « épha » préserve le terme historique sans lui attribuer une équivalence moderne incertaine.
- source_word: הוּא
  choice: correspond à
  rationale: Le pronom sert de copule dans cette proposition nominale. « correspond à » exprime clairement en français la relation quantitative définie par le verset.
- source_word: וְ
  choice: non exprimé séparément
  rationale: La conjonction introduit ici une précision explicative. En français, aucune liaison initiale n’est nécessaire dans cette phrase autonome.
