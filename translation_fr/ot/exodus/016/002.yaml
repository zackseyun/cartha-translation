  text: And the whole congregation of the sons of Israel grumbled against Moses and against Aaron in the wilderness[a].
translation:
  language: fr
  text: Toute la communauté des fils d’Israël murmura contre Moïse et Aaron dans le désert[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Israélites » ; traditionnellement, « des enfants d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלּוֹנוּ
  choice: se mit à protester
  rationale: Le verbe לוּן/לִין, dans ce contexte, exprime une plainte collective dirigée contre des responsables. « Protester contre » est naturel en français actuel et conserve la dimension d’opposition, tandis que la tournure inchoative rend la forme narrative hébraïque.
- source_word: כָּל עֲדַת
  choice: toute la communauté
  rationale: כָּל marque la totalité et עֵדָה désigne ici la collectivité d’Israël. « Toute la communauté » est clair, actuel et mieux adapté à ce récit que « toute la congrégation », qui peut évoquer surtout une assemblée cultuelle.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: des fils d’Israël
  rationale: La traduction garde la formulation masculine et généalogique de l’hébreu tout en laissant en note l’équivalent ethnique plus idiomatique.
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: contre Moïse et Aaron
  rationale: Dans un contexte de plainte, עַל désigne les personnes visées et possède une valeur adversative. En français, la répétition de « contre » n’est pas nécessaire pour conserver le sens.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne une région inculte et peu habitée. « Désert » est le terme français courant et traditionnel dans le récit de l’Exode, sans impliquer nécessairement une étendue de sable.
theological_decisions:
- issue: Désignation collective בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites ; les enfants d’Israël
  rationale: Le texte principal préserve la forme masculine et généalogique de l’hébreu, qui désigne collectivement le peuple issu d’Israël. La note signale les formulations française idiomatique et traditionnelle sans effacer la forme source.
translation_notes:
  register: Français international moderne, narratif et digne. « Communauté » évite la coloration ecclésiale possible de « congrégation ». « Se mit à protester » exprime une plainte collective hostile sans recourir à l’archaïsme « murmurer ». Le marqueur [a] figure bien dans le texte principal.
