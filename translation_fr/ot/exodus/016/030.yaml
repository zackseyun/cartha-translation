  text: So the people rested on the seventh day[a].
translation:
  language: fr
  text: Le peuple se reposa donc le septième jour[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cessa » ; le verbe est de même racine que le mot « sabbat ». Traduire par « observa le sabbat » serait plus interprétatif.
    reason: Alternative lexicale et préservation du lien étymologique avec le sabbat.
lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  choice: se reposa
  rationale: Le qal wayyiqtol de שׁבת exprime le fait de cesser une activité ou de se reposer. Dans ce contexte, « se reposa » est naturel en français et conserve le lien avec le repos du sabbat sans développer le sens en « observa le sabbat ».
- source_word: הָעָם
  choice: le peuple
  rationale: עָם désigne ici collectivement la communauté d’Israël; « le peuple » est la formulation française courante et appropriée au récit.
- source_word: בַּיּוֹם הַשְּׁבִעִי
  choice: le septième jour
  rationale: Pour une indication temporelle portant sur un jour précis, le français emploie naturellement le groupe nominal sans préposition.
- source_word: וַ
  choice: Ainsi
  rationale: Le waw consécutif fait progresser le récit et présente ici la conduite du peuple comme la conséquence de l’instruction précédente; « Ainsi » rend ce lien de manière fluide.
theological_decisions:
- issue: Faut-il expliciter l’observance du sabbat dans le verbe?
  choice: Traduire par « se reposa »
  alternative: « observa le sabbat » ou « cessa toute activité »
  rationale: Le verbe hébreu indique que le peuple cessa ou se reposa; la portée sabbatique ressort déjà du contexte et de la mention du septième jour. La traduction évite donc une expansion interprétative.
translation_notes:
  register: Français international moderne, simple et digne. Le singulier « se reposa » s’accorde avec le nom collectif « le peuple ». « Ainsi » marque naturellement la conséquence sans alourdir la phrase.
