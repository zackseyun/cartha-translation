  text: And Moses said, “Eat it today, because today is a Sabbath to the LORD; today you will not find it in the field.”
translation:
  language: fr
  text: 'Moïse dit : « Mangez-la aujourd’hui, car aujourd’hui est un sabbat pour le SEIGNEUR ; aujourd’hui, vous n’en trouverez pas dans la campagne. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִכְלֻהוּ
  choice: Mangez-la
  rationale: L’impératif pluriel s’adresse au peuple ; le pronom féminin reprend naturellement « la manne » en français.
- source_word: שַׁבָּת
  choice: un sabbat
  rationale: Le terme désigne ici le jour de repos consacré au SEIGNEUR ; sa translittération française est courante et précise.
- source_word: לַיהוָה
  choice: pour le SEIGNEUR
  rationale: La préposition ל marque ici l’orientation ou la consécration au tétragramme ; « le SEIGNEUR » suit la convention française traditionnelle.
- source_word: בַּשָּׂדֶה
  choice: dans la campagne
  rationale: Dans ce contexte de collecte de la manne hors du camp, שָׂדֶה désigne l’espace ouvert environnant plutôt qu’un champ cultivé précis.
theological_decisions:
- issue: Nature du sabbat
  choice: « un sabbat pour le SEIGNEUR »
  alternative: « le sabbat du SEIGNEUR »
  rationale: La formulation conserve la construction hébraïque et l’idée d’un repos consacré au SEIGNEUR, sans ajouter d’explication doctrinale.
translation_notes:
  register: Français moderne, clair et digne. La triple répétition de « aujourd’hui » est conservée pour reproduire l’insistance du texte hébreu.
