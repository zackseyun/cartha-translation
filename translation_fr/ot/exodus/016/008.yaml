  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה בְּ/תֵ֣ת יְהוָה֩ לָ/כֶ֨ם בָּ/עֶ֜רֶב בָּשָׂ֣ר לֶ/אֱכֹ֗ל וְ/לֶ֤חֶם בַּ/בֹּ֨קֶר֙ לִ/שְׂבֹּ֔עַ בִּ/שְׁמֹ֤עַ יְהוָה֙ אֶת תְּלֻנֹּ֣תֵי/כֶ֔ם אֲשֶׁר אַתֶּ֥ם מַלִּינִ֖ם עָלָ֑י/ו וְ/נַ֣חְנוּ מָ֔ה לֹא עָלֵ֥י/נוּ תְלֻנֹּתֵי/כֶ֖ם כִּ֥י עַל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/008.yaml
  text: And Moses said[a], “When Yahweh gives you meat to eat in the evening and bread in the morning to the full, because Yahweh hears your grumblings that you are grumbling against him—what are we? Your grumblings are not against us, but against Yahweh.”
translation:
  language: fr
  text: 'Moïse dit : « Quand Yahweh vous donnera, le soir, de la viande à manger et, le matin, du pain à satiété, puisqu’il entend vos récriminations que vous formulez contre lui — que sommes-nous ? Vos récriminations ne sont pas dirigées contre nous, mais contre Yahweh. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּתֵת
  choice: Quand … donnera
  rationale: La préposition ב avec l’infinitif construit de נתן exprime ici une circonstance temporelle. Le futur convient à l’annonce de la provision imminente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu, au lieu de le remplacer par un titre.
- source_word: בָּשָׂר
  choice: viande
  rationale: Dans ce contexte alimentaire, « viande » est le terme français courant et précis.
- source_word: לֶחֶם
  choice: pain
  rationale: Le sens concret ordinaire convient au contexte et préserve l’image associée à la manne.
- source_word: לִשְׂבֹּעַ
  choice: à satiété
  rationale: Cette expression rend de manière concise l’idée de manger jusqu’à être rassasié.
- source_word: בִּשְׁמֹעַ
  choice: parce qu’il aura entendu
  rationale: 'La construction infinitive a ici une valeur causale : la provision répond aux récriminations entendues par Yahweh. Le futur antérieur s’accorde naturellement avec « donnera ».'
- source_word: תְּלֻנֹּתֵיכֶם / מַלִּינִם
  choice: vos récriminations, que vous ne cessez de formuler
  rationale: « Récriminations » exprime des plaintes hostiles et répétées. La tournure verbale maintient l’insistance créée en hébreu par le nom et le verbe apparentés sans produire une répétition artificielle en français.
- source_word: וְנַחְנוּ מָה
  choice: Que sommes-nous ?
  rationale: Le texte hébreu dit littéralement « que », soulignant l’insignifiance de Moïse et d’Aaron comme cibles des plaintes.
- source_word: לֹא עָלֵינוּ תְלֻנֹּתֵיכֶם כִּי עַל יְהוָה
  choice: Vos récriminations ne sont pas dirigées contre nous, mais contre Yahweh
  rationale: Le prédicat explicité est nécessaire en français, et « mais » rend le contraste porté ici par כִּי.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom propre sans le remplacer par un titre confessionnel traditionnel.
- issue: Cible réelle des récriminations d’Israël
  choice: contre Yahweh
  alternative: au sujet de Yahweh
  rationale: Avec le vocabulaire de la plainte, la préposition עַל marque ici une orientation hostile. La traduction conserve l’accusation théologique du texte sans l’atténuer.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase temporelle initiale reste en suspens, comme dans l’hébreu, et les points de suspension signalent cette rupture avant la question rhétorique. « Récriminations » est plus soutenu que « plaintes », mais rend mieux la nuance accusatrice et répétée du passage.
