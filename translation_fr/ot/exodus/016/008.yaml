revisions:
- from: 'Moïse dit : « Quand Yahweh vous donnera, le soir, de la viande à manger et, le matin, du pain à satiété, parce qu’il aura entendu vos récriminations, que vous ne cessez de formuler contre lui[a]… Que sommes-nous ? Vos récriminations ne sont pas dirigées contre nous, mais contre Yahweh. »'
  to: 'Moïse dit : « Quand Yahweh vous donnera, le soir, de la viande à manger et, le matin, du pain à satiété, puisqu’il entend vos récriminations que vous formulez contre lui — que sommes-nous ? Vos récriminations ne sont pas dirigées contre nous, mais contre Yahweh. »'
  rationale: La révision conserve la structure volontairement abrupte du texte hébreu et sa question rhétorique, tout en évitant de présenter l’écoute de Yahweh comme nécessairement antérieure au don. Elle retire une intensification non explicite et reformule la note pour rendre compte fidèlement de la répétition lexicale hébraïque en français naturel.
