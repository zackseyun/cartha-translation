source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ אֲלֵ/הֶ֜ם בְּנֵ֣י יִשְׂרָאֵ֗ל מִֽי יִתֵּ֨ן מוּתֵ֤/נוּ בְ/יַד יְהוָה֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/שִׁבְתֵּ֨/נוּ֙ עַל סִ֣יר הַ/בָּשָׂ֔ר בְּ/אָכְלֵ֥/נוּ לֶ֖חֶם לָ/שֹׂ֑בַע כִּֽי הוֹצֵאתֶ֤ם אֹתָ֨/נוּ֙ אֶל הַ/מִּדְבָּ֣ר הַ/זֶּ֔ה לְ/הָמִ֛ית אֶת כָּל הַ/קָּהָ֥ל הַ/זֶּ֖ה בָּ/רָעָֽב־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/003.yaml
  text: And the sons of Israel said to them[a], “If only we had died by the hand of Yahweh in the land of Egypt, when we sat by the pots of meat, when we ate bread to the full[c][b]. For you have brought us out into this wilderness to kill this whole assembly with hunger.”
translation:
  language: fr
  text: 'Les Israélites leur dirent : « Si seulement nous étions morts de la main de Yahweh au pays d’Égypte, quand nous étions assis près des marmites de viande et que nous mangions du pain à satiété ! Car vous nous avez fait sortir dans ce désert pour faire mourir de faim toute cette assemblée. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Équivalent français naturel de l’expression collective « fils d’Israël »; il désigne le peuple sans exclure les femmes et les enfants compris dans le groupe.
- source_word: מִי יִתֵּן מוּתֵנוּ
  choice: Si seulement nous étions morts
  rationale: L’expression idiomatique introduit un souhait irréel; l’imparfait après « si seulement » est naturel en français moderne.
- source_word: בְיַד יְהוָה
  choice: par la main de Yahweh
  rationale: Conserve l’image hébraïque de la main comme agent de la mort ainsi que le nom divin personnel.
- source_word: בְּשִׁבְתֵּנוּ עַל סִיר הַבָּשָׂר
  choice: quand nous étions assis près des marmites de viande
  rationale: Rend la proposition temporelle et l’image concrète de récipients où cuisait la viande; « près de » exprime ici naturellement עַל.
- source_word: בְּאָכְלֵנוּ לֶחֶם לָשֹׂבַע
  choice: que nous mangions du pain à satiété
  rationale: Préserve le parallélisme temporel et le sens de rassasiement de לָשֹׂבַע.
- source_word: הַמִּדְבָּר הַזֶּה
  choice: ce désert
  rationale: « Désert » est l’équivalent français courant de מִדְבָּר dans ce contexte de région inhabitée et aride.
- source_word: לְהָמִית ... בָּרָעָב
  choice: pour faire mourir de faim
  rationale: Reproduit la construction causative et indique naturellement en français le moyen exprimé par « par la faim ».
- source_word: כָּל הַקָּהָל הַזֶּה
  choice: toute cette assemblée
  rationale: « Assemblée » conserve la portée collective de קָהָל sans imposer une terminologie ecclésiale particulière.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin YHWH; « Yahweh » le représente comme nom propre plutôt que de lui substituer un titre.
- issue: Désignation collective בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël
  rationale: Dans ce contexte, l’expression hébraïque désigne collectivement le peuple. Le gentilé français est précis, naturel et ne laisse pas entendre que seuls les hommes parlent ou sont concernés.
- issue: Agent de la mort souhaitée
  choice: par la main de Yahweh
  alternative: par Yahweh
  rationale: 'Le maintien de « la main » préserve l’image et la tension du reproche: les Israélites disent qu’ils auraient préféré mourir sous l’action de Yahweh en Égypte.'
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le discours reste accusateur et conserve l’hyperbole nostalgique du peuple. Le parallélisme des deux propositions en « quand » est rendu sans archaïsme; « marmites de viande » garde l’image concrète du texte.
