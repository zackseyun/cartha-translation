  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶֽל אַהֲרֹ֔ן אֱמֹ֗ר אֶֽל כָּל עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל קִרְב֖וּ לִ/פְנֵ֣י יְהוָ֑ה כִּ֣י שָׁמַ֔ע אֵ֖ת תְּלֻנֹּתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/009.yaml
  text: Then Moses said to Aaron[a], “Say to all the congregation of the sons of Israel, ‘Come near before Yahweh[b], for he has heard your grumblings.’”
translation:
  language: fr
  text: 'Moïse dit alors à Aaron : « Dis à toute la communauté des Israélites : “Approchez-vous de Yahweh, car il a entendu vos murmures.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit alors
  rationale: Le waw consécutif fait progresser le récit; « dit alors » exprime naturellement cette succession en français.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: toute la communauté des Israélites
  rationale: « Communauté » restitue le caractère collectif de עֵדָה, tandis que « Israélites » rend idiomatiquement בְּנֵי יִשְׂרָאֵל sans donner à tort l'impression que seuls les hommes sont visés.
- source_word: קִרְבוּ
  choice: Approchez-vous
  rationale: L'impératif exprime ici le mouvement vers la présence divine; cette formulation est claire, actuelle et conserve la portée concrète du verbe.
- source_word: לִפְנֵי יְהוָה
  choice: de Yahweh
  rationale: Après « approchez-vous », la préposition française « de » exprime naturellement l'idée de s'avancer devant ou dans la présence de Yahweh.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l'ordre donné et « car » convient au registre soutenu mais accessible du discours.
- source_word: שָׁמַע
  choice: il a entendu
  rationale: Le passé composé rend l'action accomplie dont l'effet demeure pertinent au moment de l'appel.
- source_word: תְּלֻנֹּתֵיכֶם
  choice: vos murmures
  rationale: « Murmures » conserve l'idée de plaintes répétées et réprobatrices caractéristique du récit du désert, sans employer une tournure vieillie.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom propre divin; « Yahweh » le rend directement plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et fluide. Le discours direct imbriqué est conservé; « communauté des Israélites » privilégie la clarté contemporaine tout en maintenant la dimension corporative du texte.
