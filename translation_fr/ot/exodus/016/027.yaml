  text: וַֽ/יְהִי֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י יָצְא֥וּ מִן הָ/עָ֖ם לִ/לְקֹ֑ט וְ/לֹ֖א מָצָֽאוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/027.yaml
  text: And it happened on the seventh day that some of the people went out to gather[a], but they found none.
translation:
  language: fr
  text: Le septième jour, quelques-uns du peuple sortirent pour en ramasser, mais ils ne trouvèrent rien.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Le septième jour
  rationale: La formule narrative introduit l’événement suivant. En français moderne, son apport est naturellement porté par l’ouverture temporelle, sans calque lourd comme « Et il arriva ».
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: le septième jour
  rationale: Rendu direct de l’expression temporelle, sans ajouter « de la semaine », absent de l’hébreu.
- source_word: יָצְאוּ
  choice: sortirent
  rationale: Le verbe exprime ici le mouvement hors du camp ou du lieu d’habitation.
- source_word: מִן הָעָם
  choice: quelques-uns parmi le peuple
  rationale: 'Le syntagme a une valeur partitive : seule une partie du peuple agit. Cette formulation conserve aussi explicitement l’idée de provenance au sein du peuple.'
- source_word: לִלְקֹט
  choice: pour en ramasser
  rationale: Le verbe signifie recueillir ou ramasser. Le pronom « en » reprend naturellement la manne, objet compris grâce au contexte, sans l’ajouter explicitement.
- source_word: וְלֹא מָצָאוּ
  choice: mais ils ne trouvèrent rien
  rationale: Littéralement « et ils ne trouvèrent pas » ; « mais » rend l’opposition implicite entre leur intention et l’échec de leur recherche, tandis que « rien » complète naturellement la phrase en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple convient au récit biblique écrit sans archaïsme marqué. La syntaxe évite le calque hébraïque « Et il arriva » tout en maintenant la progression narrative.
