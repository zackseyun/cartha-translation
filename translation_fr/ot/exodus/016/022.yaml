  - severity: low
    issue: Formulation quantitative potentiellement équivoque
    rationale: « Deux fois plus de pain » est souvent compris comme « le double », mais peut recevoir une lecture arithmétique non uniforme. « Une double quantité de pain », immédiatement précisée par « deux omers par personne », rend directement מִשְׁנֶה.
