  yaml_path: translation/ot/exodus/016/022.yaml
  text: And it happened on the sixth day that they gathered twice as much bread[a], two omers for each person, and all the leaders of the congregation came and told Moses.
translation:
  language: fr
  text: Le sixième jour, ils ramassèrent une double quantité de pain[a], soit deux omers par personne. Tous les responsables de la communauté vinrent en informer Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’omer était une unité de mesure de capacité pour les denrées sèches dans l’ancien Israël.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשִּׁשִּׁי
  choice: Le sixième jour
  rationale: En français narratif moderne, la simple indication temporelle rend naturellement la transition introduite par וַיְהִי, sans calque lourd tel que « il arriva que ».
- source_word: לָקְטוּ
  choice: ils ramassèrent
  rationale: Dans le contexte de la manne recueillie au sol, « ramasser » est précis, naturel et concret.
- source_word: לֶחֶם מִשְׁנֶה
  choice: deux fois plus de pain
  rationale: Conserve « pain » pour לֶחֶם et exprime naturellement la quantité double indiquée par מִשְׁנֶה, explicitée ensuite par deux omers.
- source_word: שְׁנֵי הָעֹמֶר לָאֶחָד
  choice: soit deux omers par personne
  rationale: « Par personne » rend clairement la valeur distributive de לָאֶחָד; « soit » introduit l'explication quantitative sans modifier le sens.
- source_word: כָּל נְשִׂיאֵי הָעֵדָה
  choice: tous les responsables de la communauté
  rationale: « Responsables » désigne naturellement les dirigeants reconnus, tandis que « communauté » convient au groupe d'Israël assemblé sans connotation institutionnelle moderne trop étroite.
- source_word: וַיָּבֹאוּ ... וַיַּגִּידוּ לְמֹשֶׁה
  choice: vinrent le rapporter à Moïse
  rationale: Préserve le mouvement exprimé par « vinrent » et rend נגד par « rapporter », approprié pour transmettre à Moïse un fait constaté.
