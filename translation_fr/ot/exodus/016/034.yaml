  text: As Yahweh commanded Moses[a], so Aaron placed it before the testimony for safekeeping.
translation:
  language: fr
  text: Comme Yahweh l’a ordonné à Moïse, Aaron le déposa devant le Témoignage[a], afin qu’il soit conservé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant le témoignage de l’alliance ». Le mot hébreu traduit par « Témoignage » est un terme technique lié au sanctuaire ; il peut désigner plus précisément les tablettes de l’alliance ou ce qui leur est associé.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Comme
  rationale: Introduit la conformité de l’action d’Aaron au commandement divin précédent, dans un français naturel.
- source_word: צִוָּה
  choice: avait ordonné
  rationale: Préserve la force d’autorité du verbe et l’antériorité du commandement par rapport à l’action d’Aaron.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu.
- source_word: אֶל מֹשֶׁה
  choice: à Moïse
  rationale: Rend explicitement et naturellement le complément introduit par אֶל.
- source_word: וַיַּנִּיחֵהוּ
  choice: Aaron le déposa
  rationale: « Déposa » exprime ici le placement intentionnel de l’objet dans le lieu prévu pour sa conservation; le pronom renvoie au récipient de manne mentionné au verset précédent.
- source_word: לִפְנֵי
  choice: devant
  rationale: Conserve le sens spatial ou cultuel sans préciser davantage l’emplacement.
- source_word: הָעֵדֻת
  choice: le Témoignage
  rationale: Maintient le terme technique du sanctuaire, susceptible de désigner les tables de l’alliance ou ce qui leur est associé, sans trancher silencieusement.
- source_word: לְמִשְׁמָרֶת
  choice: afin qu’il soit conservé
  rationale: Exprime clairement la finalité de garde durable sans ajouter l’idée de mémorial, absente de ce verset.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le nom divin; sa transcription préserve cette référence personnelle et alliancielle.
- issue: Référent cultuel de הָעֵדֻת
  choice: le Témoignage
  alternative: le témoignage de l’alliance
  rationale: Le terme hébreu est technique mais son référent précis peut être les tables de l’alliance ou ce qui leur est associé; la traduction principale conserve cette latitude.
translation_notes:
  register: Français international moderne, digne et accessible. La majuscule à « Témoignage » signale son emploi comme terme cultuel technique sans imposer un référent plus précis que l’hébreu.
