id: EXO.16.6
reference: Exodus 16:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ וְ/אַהֲרֹ֔ן אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל עֶ֕רֶב וִֽ/ידַעְתֶּ֕ם כִּ֧י יְהוָ֛ה הוֹצִ֥יא אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/006.yaml
  text: Then Moses and Aaron said to all the sons of Israel[a], “At evening you will know that Yahweh brought you out from the land of Egypt.”
translation:
  language: fr
  text: 'Alors Moïse et Aaron dirent à tous les Israélites[a] : « Ce soir, vous saurez que c’est Yahweh qui vous a fait sortir du pays d’Égypte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à tous les fils d’Israël » ; on peut aussi traduire : « à tous les enfants d’Israël ».'
    reason: La note conserve la forme masculine et généalogique de l’expression hébraïque, tandis que le texte principal emploie le gentilé collectif naturel en français.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... dirent
  rationale: Le waw consécutif fait avancer le récit. « Alors » restitue naturellement cette progression, et le pluriel français s’accorde avec le sujet composé « Moïse et Aaron ».
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Moïse et Aaron
  rationale: Formes françaises usuelles des noms bibliques.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: à tous les Israélites
  rationale: Littéralement « à tous les fils d’Israël ». Dans ce contexte collectif, « Israélites » est une formulation actuelle et naturelle qui désigne clairement l’ensemble du peuple sans laisser entendre que seuls les hommes sont visés. Une note conserve la forme hébraïque.
- source_word: עֶרֶב
  choice: Ce soir
  rationale: Le nom est employé comme indication temporelle. Dans la situation narrative, « ce soir » exprime naturellement le soir à venir sans alourdir la phrase.
- source_word: וִידַעְתֶּם
  choice: vous saurez
  rationale: Le futur simple rend directement le sens prospectif du verbe et reste naturel en français moderne.
- source_word: כִּי
  choice: que c’est ... qui
  rationale: כִּי introduit ici le contenu de ce qu’Israël saura. La tournure clivée française met naturellement en relief Yahweh comme auteur de la délivrance, conformément à l’ordre et à la portée de la proposition hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre divin plutôt que remplacé par un titre.
- source_word: הוֹצִיא אֶתְכֶם
  choice: vous a fait sortir
  rationale: Le hiphil de יצא signifie « faire sortir » ou, idiomatiquement, « conduire hors de ». Le passé composé convient à un acte accompli dont les effets structurent la situation présente.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: du pays d’Égypte
  rationale: « Pays » rend explicitement אֶרֶץ, tandis que « d’Égypte » restitue la provenance marquée par מִן.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve sa fonction de nom personnel, sans lui substituer un titre ni adopter la forme traditionnelle « Jéhovah ».
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu tout en évitant le calque. « Ce soir » et « Israélites » favorisent une lecture immédiate ; la note signale la formulation littérale.
