- from: 'Moïse dit à Aaron : « Prends un récipient[a], mets-y une pleine mesure d’omer de manne et dépose-le devant Yahweh, afin qu’il soit conservé de génération en génération. »'
  to: 'Moïse dit à Aaron : « Prends un récipient[a], mets-y un omer entier de manne et dépose-le devant Yahweh, afin qu’il soit conservé de génération en génération. »'
  rationale: 'La seule modification du texte remplace une tournure française maladroite par « un omer entier de manne », qui rend clairement la quantité complète indiquée dans le texte hébreu. Le reste est maintenu : le récipient demeure générique, la note lexicale est conservée, et le dépôt devant Yahweh ainsi que la conservation durable restent explicites.'
