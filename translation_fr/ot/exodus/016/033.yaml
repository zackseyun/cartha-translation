  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קַ֚ח צִנְצֶ֣נֶת אַחַ֔ת וְ/תֶן שָׁ֥מָּ/ה מְלֹֽא הָ/עֹ֖מֶר מָ֑ן וְ/הַנַּ֤ח אֹת/וֹ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/מִשְׁמֶ֖רֶת לְ/דֹרֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/033.yaml
  text: And Moses said to Aaron[a], “Take one jar, and put an omerful of manna in it, and place it before Yahweh, to be kept throughout your generations.”
translation:
  language: fr
  text: 'Moïse dit à Aaron : « Prends un récipient[a], mets-y un omer entier de manne et dépose-le devant Yahweh, afin qu’il soit conservé de génération en génération. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une jarre »; le terme hébreu désigne un contenant dont la forme exacte n’est pas précisée.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִנְצֶנֶת
  choice: récipient
  rationale: Le nom désigne un contenant sans en préciser sûrement la forme ni la matière. « Récipient » préserve cette généralité; « jarre » reste une possibilité signalée en note.
- source_word: מְלֹא הָעֹמֶר
  choice: une pleine mesure d’omer
  rationale: Cette formulation conserve à la fois l’idée de plénitude exprimée par מְלֹא et le nom de la mesure ancienne, l’omer.
- source_word: מָן
  choice: manne
  rationale: Terme français traditionnel, courant et immédiatement reconnaissable pour la substance désignée dans le contexte.
- source_word: וְתֶן שָׁמָּה
  choice: mets-y
  rationale: L’adverbe « là » renvoie naturellement au récipient qui vient d’être mentionné; « mets-y » explicite cette relation sans ajouter de contenu.
- source_word: וְהַנַּח אֹתוֹ
  choice: dépose-le
  rationale: Le verbe exprime l’action de poser ou placer. Le pronom masculin renvoie naturellement au récipient contenant la manne.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » rend de façon concise l’idée de présence exprimée par לִפְנֵי, tandis que le nom divin est translittéré.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération préserve le nom personnel divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לְמִשְׁמֶרֶת
  choice: afin qu’il soit conservé
  rationale: Le nom exprime ici la garde ou la préservation comme but de l’action.
- source_word: לְדֹרֹתֵיכֶם
  choice: de génération en génération
  rationale: Expression française naturelle qui communique la conservation au fil des générations successives.
- source_word: קַח ... אַחַת
  choice: Prends un récipient
  rationale: En français, l’article indéfini rend naturellement l’idée d’un seul récipient dans cette instruction, sans lourdeur.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » en préserve la fonction de nom propre.
- issue: Référent du pronom dans וְהַנַּח אֹתוֹ
  choice: le récipient contenant la manne (« dépose-le »)
  alternative: la manne ou son contenu (« dépose-la »)
  rationale: Le pronom hébreu masculin singulier s’accorde naturellement avec צִנְצֶנֶת, traité comme le récipient mentionné, tandis que מָן peut aussi être masculin. Le contexte favorise le dépôt du récipient devant Yahweh, mais la construction conserve une légère ambiguïté référentielle.
translation_notes:
  register: Français international moderne, clair et digne. La formulation évite l’archaïsme tout en conservant l’omer comme mesure ancienne et Yahweh comme nom propre. Le marqueur [a] figure immédiatement après le terme concerné.
