  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שָׁמַ֗עְתִּי אֶת תְּלוּנֹּת֮ בְּנֵ֣י יִשְׂרָאֵל֒ דַּבֵּ֨ר אֲלֵ/הֶ֜ם לֵ/אמֹ֗ר בֵּ֤ין הָֽ/עַרְבַּ֨יִם֙ תֹּאכְל֣וּ בָשָׂ֔ר וּ/בַ/בֹּ֖קֶר תִּשְׂבְּעוּ לָ֑חֶם וִֽ/ידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/012.yaml
  text: I have heard the grumblings of the sons of Israel[a]. Speak to them, saying, ‘Between the evenings you shall eat meat, and in the morning you shall be filled with bread[b], and you shall know that I am Yahweh your God.’
translation:
  language: fr
  text: 'J’ai entendu les murmures des Israélites. Dis-leur : « Au crépuscule[a], vous mangerez de la viande, et le matin vous mangerez du pain à satiété. Alors vous saurez que je suis Yahweh, votre Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « entre les deux soirs », expression désignant la période du crépuscule.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: J’ai entendu
  rationale: Le parfait exprime ici une action accomplie dont les effets sont immédiats; le passé composé est naturel en français.
- source_word: תְּלוּנֹּת
  choice: les murmures
  rationale: Le terme évoque des plaintes répétées et mécontentes; « murmures » conserve cette nuance dans un registre biblique encore courant.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Dans cette désignation collective idiomatique, « les Israélites » est naturel et précis en français; une traduction littérale par « fils d’Israël » risquerait de désigner seulement les hommes.
- source_word: דַּבֵּר אֲלֵהֶם לֵאמֹר
  choice: 'Dis-leur :'
  rationale: Cette formulation française rend directement l’introduction hébraïque de la parole sans le calque lourd « parle-leur en disant ».
- source_word: בֵּין הָעַרְבַּיִם
  choice: Au crépuscule
  rationale: L’expression hébraïque signifie littéralement « entre les deux soirs » et désigne la période du crépuscule; la note conserve sa forme particulière.
- source_word: תֹּאכְלוּ בָשָׂר
  choice: vous mangerez de la viande
  rationale: Dans un contexte alimentaire, בָשָׂר signifie naturellement « viande »; l’imparfait hébreu a ici une valeur future.
- source_word: תִּשְׂבְּעוּ לָחֶם
  choice: vous mangerez du pain à satiété
  rationale: Cette tournure idiomatique exprime concrètement le fait d’être rassasié de pain, sans suggérer seulement une satisfaction abstraite.
- source_word: וִידַעְתֶּם
  choice: Alors vous saurez
  rationale: Le parfait précédé du waw exprime ici le résultat de la provision annoncée; « alors » explicite naturellement ce rapport.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Malgré sa forme morphologique plurielle, אֱלֹהִים désigne ici au singulier le Dieu d’Israël.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël
  rationale: L’expression fonctionne ici comme une désignation collective de la communauté d’Israël. « Israélites » évite de réduire involontairement cette communauté aux seuls hommes, tout en restant fidèle au référent.
- issue: Lien entre la provision et la connaissance de Yahweh
  choice: Alors vous saurez
  alternative: et vous saurez
  rationale: Le contexte permet une nuance résultative, mais non une explication doctrinale plus poussée; « alors » la marque sans définir la nature exacte de cette reconnaissance.
translation_notes:
  register: Français international moderne, digne et accessible. Syntaxe directe pour l’introduction du discours; « murmures » conserve la tonalité de plainte répétée. Le nom Yahweh est maintenu comme nom propre.
