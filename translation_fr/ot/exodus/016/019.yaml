  text: 'Moïse leur dit : « Que personne n’en garde jusqu’au matin. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait progresser le récit. En français narratif, le passé simple « dit » rend naturellement cette succession sans qu’il soit nécessaire d’ajouter systématiquement « et ».
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et usuelle du nom propre.
- source_word: אֲלֵהֶם
  choice: leur
  rationale: Le pronom objet indirect rend directement la préposition אֶל avec le suffixe de troisième personne du masculin pluriel.
- source_word: אִישׁ אַל
  choice: Que personne ne
  rationale: אִישׁ a ici une valeur distributive et générique. « Que personne ne » exprime clairement que l’interdiction s’applique à chacun, dans un français naturel.
- source_word: יוֹתֵר
  choice: garde
  rationale: Dans le contexte de la manne, le verbe signifie laisser subsister ou conserver une quantité pour plus tard. « Garder » exprime naturellement cette conservation.
- source_word: מִמֶּנּוּ
  choice: en
  rationale: Le pronom « en » reprend de manière idiomatique la manne et traduit la relation partitive exprimée par מִן.
- source_word: עַד בֹּקֶר
  choice: jusqu’au matin
  rationale: Rend directement la limite temporelle indiquée par עַד et correspond à l’usage français courant.
