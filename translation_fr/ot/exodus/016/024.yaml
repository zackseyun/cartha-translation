base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/024.yaml
  text: So they left it until morning[a], just as Moses had commanded, and it did not stink, nor were there any worms in it.
translation:
  language: fr
  text: Ils le laissèrent jusqu’au matin, comme Moïse l’avait ordonné. Il ne dégagea pas de mauvaise odeur et il ne s’y trouva pas de vers.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’asticots ». Le nom hébreu peut désigner de manière générale de petites créatures vermiformes associées à la décomposition.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנִּיחוּ אֹתוֹ
  choice: Ils le laissèrent
  rationale: Dans ce contexte, le causatif de נוח exprime le fait de laisser ou de mettre de côté la manne pour la nuit. « Ils le laissèrent » est naturel et conserve le pronom singulier renvoyant à ce qui avait été gardé.
- source_word: עַד הַבֹּקֶר
  choice: jusqu’au matin
  rationale: Expression temporelle idiomatique en français moderne.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: comme Moïse l’avait ordonné
  rationale: « Comme » rend la conformité à l’ordre, et le plus-que-parfait marque naturellement que l’ordre précédait l’action.
- source_word: הִבְאִישׁ
  choice: devint infect
  rationale: Le verbe signifie devenir puant ou mauvais. « Devint infect » exprime clairement l’altération et la mauvaise odeur sans se limiter à la seule putréfaction.
- source_word: רִמָּה
  choice: vers
  rationale: Le nom peut désigner des vers ou, plus précisément, des asticots. « Vers » préserve la portée générale du terme hébreu.
- source_word: לֹא הָיְתָה בּוֹ
  choice: il n’y eut pas de vers en lui
  rationale: Cette formulation conserve la construction existentielle et le pronom singulier du texte hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La coordination en deux phrases allège la syntaxe tout en conservant l’enchaînement du texte hébreu. Le marqueur de note est placé après « en lui », puisque la note porte sur « vers ».
