  rationale: La révision retire une explicitation non nécessaire dans le texte courant et corrige la note b afin qu’elle exprime une alternative de construction du groupe nominal plutôt qu’une proposition ajoutée. Les autres choix conservent fidèlement le sens et l’incertitude lexicale de l’hébreu.
