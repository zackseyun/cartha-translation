  text: The house of Israel called its name manna[a], and it was like white coriander seed[c][b], and its taste was like wafers with honey.
translation:
  language: fr
  text: La maison d’Israël lui donna le nom de manne[a]. Elle ressemblait à de la graine de coriandre blanche[b], et son goût était celui d’une galette au miel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'En hébreu : man ; traditionnellement rendu par « manne » en français.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à de la graine de coriandre, blanche ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « d’une fine galette au miel » ; le terme hébreu désigne une sorte de galette ou de pâtisserie mince.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ בֵית יִשְׂרָאֵל אֶת־שְׁמוֹ
  choice: La maison d’Israël donna à cette nourriture le nom de
  rationale: La formulation conserve l’expression collective « maison d’Israël » et l’acte explicite de nommer. « Cette nourriture » explicite naturellement en français le référent du suffixe hébreu sans modifier son identité.
- source_word: מָן
  choice: manne
  rationale: « Manne » est la forme française traditionnelle et immédiatement reconnaissable du terme hébreu man.
- source_word: כְּזֶרַע גַּד לָבָן
  choice: ressemblait à de la graine de coriandre blanche
  rationale: 'Cette traduction rend les trois éléments du syntagme hébreu : la comparaison, la graine et l’identification courante de גַּד comme coriandre. La place de « blanche » conserve une légère ambiguïté syntaxique, signalée en note.'
- source_word: וְטַעְמוֹ
  choice: et son goût
  rationale: « Goût » est l’équivalent français direct et naturel de טַעַם dans une description alimentaire.
- source_word: כְּצַפִּיחִת בִּדְבָשׁ
  choice: était celui d’une galette au miel
  rationale: צַפִּיחִת désigne vraisemblablement une galette ou pâtisserie mince, mais sa forme exacte est incertaine. « Galette au miel » est idiomatique et préserve la comparaison de goût.
