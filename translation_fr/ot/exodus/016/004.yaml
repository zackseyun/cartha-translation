  to: 'Alors Yahweh dit à Moïse : « Voici, je vais faire pleuvoir pour vous du pain du ciel. Le peuple sortira et ramassera chaque jour la ration nécessaire pour ce jour-là[a]. Ainsi, je le mettrai à l’épreuve pour voir s’il marchera selon mon enseignement[b] ou non. »'
  rationale: La révision précise la contrainte quotidienne exprimée par l’idiome hébreu et rétablit de manière idiomatique la métaphore de « marcher » dans l’enseignement divin. Elle conserve le singulier collectif pour « le peuple », le choix non confessionnel « Yahweh » et l’ambiguïté lexicale de תּוֹרָה signalée en note.
