  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הִנְ/נִ֨י מַמְטִ֥יר לָ/כֶ֛ם לֶ֖חֶם מִן הַ/שָּׁמָ֑יִם וְ/יָצָ֨א הָ/עָ֤ם וְ/לָֽקְטוּ֙ דְּבַר י֣וֹם בְּ/יוֹמ֔/וֹ לְמַ֧עַן אֲנַסֶּ֛/נּוּ הֲ/יֵלֵ֥ךְ בְּ/תוֹרָתִ֖/י אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/004.yaml
  text: Then Yahweh said to Moses[a], “Behold, I am raining bread from heaven for you, and the people shall go out and gather a day's portion each day, so that I may test them[c][b], whether they will walk in my law or not.”
translation:
  language: fr
  text: 'Alors Yahweh dit à Moïse : « Voici, je vais faire pleuvoir pour vous du pain du ciel. Le peuple sortira et ramassera chaque jour la ration nécessaire pour ce jour-là[a]. Ainsi, je le mettrai à l’épreuve pour voir s’il marchera selon mon enseignement[b] ou non. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la chose d’un jour en son jour », c’est-à-dire la quantité nécessaire chaque jour, ramassée ce jour-là.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ma loi ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin de l’alliance au lieu de le remplacer par un titre.
- source_word: הִנְנִי מַמְטִיר
  choice: Voici, je vais faire pleuvoir
  rationale: « Voici » conserve la solennité de l’annonce, et la tournure prospective rend naturellement en français la valeur imminente du participe hébreu.
- source_word: לֶחֶם מִן הַשָּׁמָיִם
  choice: du pain du ciel
  rationale: Conserve le nom concret « pain » et l’expression source, importante dans la suite de la tradition biblique.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: jour après jour, la quantité nécessaire pour la journée
  rationale: 'Exprime clairement l’idiome hébreu : la ration requise chaque jour doit être recueillie ce jour-là.'
- source_word: לְמַעַן אֲנַסֶּנּוּ
  choice: Ainsi, je le mettrai à l’épreuve
  rationale: Le pronom singulier hébreu renvoie au nom collectif « le peuple »; le singulier français préserve cet accord.
- source_word: הֲיֵלֵךְ בְּתוֹרָתִי
  choice: pour savoir s’il suivra mon enseignement
  rationale: « Suivre » rend naturellement la métaphore de la marche comme conduite, tandis qu’« enseignement » garde ici la portée de תּוֹרָה sans présupposer exclusivement le code sinaïtique.
- source_word: אִם לֹא
  choice: ou non
  rationale: Achève naturellement en français la question indirecte portant sur la conduite future du peuple.
theological_decisions:
- issue: Sens de תּוֹרָה avant la promulgation au Sinaï
  choice: mon enseignement
  alternative: ma loi
  rationale: « Enseignement » rend la portée fondamentale de תּוֹרָה et convient à l’instruction divine immédiate donnée dans ce contexte, sans effacer la possibilité du sens plus juridique signalée en note.
- issue: Métaphore de la marche dans הֲיֵלֵךְ
  choice: s’il suivra
  alternative: s’il marchera selon
  rationale: La formulation choisie communique en français moderne l’idée de régler sa conduite sur l’enseignement divin, sans la réduire au seul verbe « obéir ».
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la solennité de l’annonce divine tout en évitant des calques peu naturels. Le peuple demeure grammaticalement singulier, comme dans l’hébreu.
