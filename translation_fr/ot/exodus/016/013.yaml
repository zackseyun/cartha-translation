  yaml_path: translation/ot/exodus/016/013.yaml
  text: And in the evening the quail came up and covered the camp[a], and in the morning a layer of dew was around the camp.
translation:
  language: fr
  text: Le soir, les cailles arrivèrent et couvrirent le camp. Le matin, il y avait une couche de rosée tout autour du camp.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: Le soir
  rationale: La formule narrative introduit le moment de l’événement. « Le soir » est naturel en français moderne sans alourdir le récit par « il arriva que ».
- source_word: וַתַּעַל הַשְּׂלָו
  choice: les cailles arrivèrent
  rationale: Le nom singulier hébreu a ici une valeur collective. Le verbe עלה signifie littéralement « monter », mais, appliqué à l’arrivée des cailles, « arrivèrent » rend naturellement le mouvement vers le camp sans suggérer qu’elles montaient depuis un lieu précis.
- source_word: וַתְּכַס אֶת־הַמַּחֲנֶה
  choice: couvrirent le camp
  rationale: Cette formulation conserve directement l’image du verbe כסה et rend מַחֲנֶה par le terme courant « camp ».
- source_word: וּבַבֹּקֶר
  choice: Le matin
  rationale: Cette expression marque simplement le moment suivant dans la séquence narrative.
- source_word: הָיְתָה שִׁכְבַת הַטַּל
  choice: il y avait une couche de rosée
  rationale: La tournure existentielle française rend clairement la construction hébraïque et le sens concret de שִׁכְבָה, une couche ou étendue déposée.
- source_word: סָבִיב לַמַּחֲנֶה
  choice: tout autour du camp
  rationale: « Tout autour » exprime naturellement la disposition circulaire indiquée par סָבִיב.
