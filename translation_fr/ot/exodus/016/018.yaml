  text: וַ/יָּמֹ֣דּוּ בָ/עֹ֔מֶר וְ/לֹ֤א הֶעְדִּיף֙ הַ/מַּרְבֶּ֔ה וְ/הַ/מַּמְעִ֖יט לֹ֣א הֶחְסִ֑יר אִ֥ישׁ לְ/פִֽי אָכְל֖/וֹ לָקָֽטוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/018.yaml
  text: When they measured it by the omer[a], the one who gathered much had nothing left over, and the one who gathered little had no lack; each one gathered according to what he could eat.
translation:
  language: fr
  text: 'Ils mesurèrent ce qu’ils avaient ramassé avec l’omer : celui qui en avait ramassé beaucoup n’eut rien de trop, et celui qui en avait ramassé peu ne manqua de rien[a]. Chacun en avait ramassé selon ce qu’il pouvait manger.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celui qui en avait beaucoup n’en eut pas trop, et celui qui en avait peu ne manqua de rien ».'
    reason: La formulation hébraïque permet de comprendre les participes soit comme renvoyant au fait de ramasser beaucoup ou peu, soit plus simplement au fait d’avoir beaucoup ou peu lors de la mesure.
lexical_decisions:
- source_word: וַיָּמֹדּוּ
  choice: Ils mesurèrent
  rationale: Le wayyiqtol fait progresser le récit. Le passé simple convient au registre narratif biblique moderne, et « mesurer » rend directement מדד.
- source_word: בָעֹמֶר
  choice: avec l’omer
  rationale: עֹמֶר désigne ici une unité ou mesure de capacité. « Avec l’omer » conserve l’unité ancienne sans conversion et exprime naturellement l’instrument ou l’étalon de mesure.
- source_word: הֶעְדִּיף
  choice: n’eut rien de trop
  rationale: Le verbe exprime l’excédent ou le surplus. Cette formulation française est concise et maintient le contraste avec « ne manqua de rien ».
- source_word: הַמַּרְבֶּה
  choice: celui qui en avait ramassé beaucoup
  rationale: Le participe signifie formellement « celui qui multiplie/augmente », mais le contexte immédiat porte sur le ramassage de la manne. L’explicitation par « ramassé » rend ce référent clair sans modifier le sens.
- source_word: הֶחְסִיר
  choice: ne manqua de rien
  rationale: Le verbe signifie être en manque ou avoir moins que nécessaire. Cette tournure idiomatique préserve le parallélisme antithétique.
- source_word: הַמַּמְעִיט
  choice: celui qui en avait ramassé peu
  rationale: Comme pour הַמַּרְבֶּה, « ramassé » explicite l’action sous-entendue par le contexte et maintient la symétrie de la phrase.
- source_word: אִישׁ
  choice: Chacun
  rationale: אִישׁ a ici une valeur distributive et ne vise pas exclusivement les hommes adultes. « Chacun » préserve cette distribution individuelle en français naturel.
- source_word: לְפִי אָכְלוֹ
  choice: selon ce qu’il pouvait manger
  rationale: L’expression, littéralement liée à « la bouche de son manger », indique la quantité correspondant à la consommation de chacun. La formulation choisie est claire et naturelle sans la réduire explicitement à l’appétit.
- source_word: לָקָטוּ
  choice: en avait ramassé
  rationale: לקט est le verbe courant du récit pour recueillir la manne. Le plus-que-parfait relie naturellement le ramassage antérieur au constat effectué lors de la mesure.
theological_decisions:
- issue: Singulier distributif genré dans אִישׁ ... אָכְלוֹ
  choice: « Chacun ... ce qu’il pouvait manger »
  alternative: « Chaque homme ... selon sa consommation » ou « Tous ... ce qu’ils pouvaient manger »
  rationale: Le masculin singulier hébreu fonctionne distributivement. « Chacun » évite de restreindre indûment le propos aux hommes, tandis que « il » conserve en français l’accord singulier et la perspective individuelle du texte.
- issue: Valeur des participes הַמַּרְבֶּה et הַמַּמְעִיט
  choice: Les rapporter explicitement à la quantité ramassée
  alternative: « celui qui en avait beaucoup » et « celui qui en avait peu »
  rationale: Le contexte favorise nettement le ramassage, mais la forme hébraïque reste plus concise et peut décrire la personne qui a beaucoup ou peu. La variante est donc signalée sans imposer une portée doctrinale au contraste.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple soutient le registre narratif sans archaïsme marqué. « Omer » est conservé comme nom de l’ancienne mesure; le contexte immédiat indique sa fonction. Le marqueur de note est placé après l’ensemble du contraste auquel la variante se rapporte.
