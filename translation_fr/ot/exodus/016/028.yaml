id: EXO.16.28
reference: Exodus 16:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה עַד אָ֨נָה֙ מֵֽאַנְתֶּ֔ם לִ/שְׁמֹ֥ר מִצְוֺתַ֖/י וְ/תוֹרֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/028.yaml
  text: Then Yahweh said to Moses[a], “How long will you refuse to keep my commandments and my laws?”
translation:
  language: fr
  text: 'Alors Yahweh dit à Moïse : « Jusqu’à quand refuserez-vous d’observer mes commandements et mes lois[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes instructions ». Le mot hébreu torot, pluriel de torah, peut désigner aussi bien des instructions faisant autorité que des lois.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit. « Alors » exprime naturellement cette succession en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin יהוה au lieu de lui substituer un titre.
- source_word: עַד אָנָה
  choice: Jusqu’à quand
  rationale: Cette tournure française naturelle conserve la force temporelle et rhétorique de la réprimande.
- source_word: מֵאַנְתֶּם
  choice: refuserez-vous
  rationale: 'Dans cette question de reproche, le futur français exprime idiomatiquement la persistance du refus : « jusqu’à quand continuerez-vous à refuser ? »'
- source_word: לִשְׁמֹר
  choice: d’observer
  rationale: Avec des commandements, שׁמר signifie les respecter ou les mettre en pratique. « Observer » convient au registre normatif sans être servilement littéral.
- source_word: מִצְוֺתַי
  choice: mes commandements
  rationale: Le terme désigne des prescriptions faisant autorité ; « commandements » conserve ici sa portée juridique et alliancélle.
- source_word: וְתוֹרֹתָי
  choice: et mes lois
  rationale: En parallèle avec « mes commandements », « mes lois » rend clairement la force normative du pluriel תורות, tandis que son sens plus large d’instructions est signalé en note.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte hébreu emploie explicitement le tétragramme ; « Yahweh » en conserve la fonction de nom propre.
- issue: Sens de תּוֹרָה au pluriel avec suffixe de première personne
  choice: mes lois
  alternative: mes instructions
  rationale: Le contexte de désobéissance et le parallélisme avec « commandements » favorisent la portée normative de « lois », sans exclure le sens d’enseignements autorisés, conservé dans la note.
translation_notes:
  register: Français international moderne, naturel et digne. Le vouvoiement pluriel rend clairement la deuxième personne masculine plurielle de מֵאַנְתֶּם. La formulation conserve le caractère direct de la réprimande divine.
