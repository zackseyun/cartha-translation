lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol de דבר fait avancer le récit et introduit une nouvelle prise de parole. « Parla » rend précisément le verbe sans anticiper le contenu de la déclaration.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin YHWH. « Yahweh » le représente comme nom propre plutôt que de le remplacer par le titre traditionnel « le SEIGNEUR ».
- source_word: אֶל־מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל désigne ici le destinataire de la parole ; « à Moïse » est l’expression française naturelle.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Cette formule introduit les paroles directes qui suivent. « En ces termes » évite le calque peu naturel « disant » tout en conservant sa fonction introductive.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. La traduction retient le nom propre et signale en note le rendu traditionnel, sans confondre un nom avec un titre.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au fil narratif écrit. Les deux-points préparent naturellement la parole directe du verset suivant ; « en ces termes » rend idiomatiquement la formule hébraïque לֵאמֹר.
