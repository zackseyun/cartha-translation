id: EXO.16.1
reference: Exodus 16:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּסְעוּ֙ מֵֽ/אֵילִ֔ם וַ/יָּבֹ֜אוּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ אֶל מִדְבַּר סִ֔ין אֲשֶׁ֥ר בֵּין אֵילִ֖ם וּ/בֵ֣ין סִינָ֑י בַּ/חֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י לְ/צֵאתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/001.yaml
  text: They set out from Elim[a], and the whole congregation of the sons of Israel came to the wilderness of Sin, which is between Elim and Sinai[b], on the fifteenth day of the second month after they had gone out from the land of Egypt.
translation:
  language: fr
  text: Ils partirent d’Élim, et toute la communauté des Israélites[a] arriva au désert de Sîn[b], situé entre Élim et le Sinaï, le quinzième jour du deuxième mois après leur sortie du pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des fils d’Israël ». Cette désignation nationale habituelle peut désigner tout le peuple d’Israël, et non uniquement les hommes.'
    reason: lexical_alternative
  - marker: b
    text: '« Sîn » est ici un nom de lieu : il désigne le désert de Sîn et ne doit pas être confondu avec le Sinaï.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans les récits de déplacement au désert, נסע évoque la levée du camp et la mise en route. « Partirent » rend naturellement ce mouvement en français moderne.
- source_word: מֵאֵילִם
  choice: d’Élim
  rationale: אֵילִם est un nom de lieu, transcrit selon l’usage français.
- source_word: וַיָּבֹאוּ
  choice: arriva
  rationale: Le verbe בוא exprime ici l’aboutissement du déplacement. Le singulier s’accorde naturellement avec le sujet collectif « toute la communauté ».
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: toute la communauté des Israélites
  rationale: עֵדָה désigne la communauté rassemblée. « Israélites » rend de façon idiomatique le nom collectif בְּנֵי יִשְׂרָאֵל, littéralement « fils d’Israël », qui englobe ici l’ensemble du peuple.
- source_word: אֶל מִדְבַּר סִין
  choice: au désert de Sîn
  rationale: מִדְבָּר désigne une région désertique ou sauvage. סִין est un toponyme, transcrit « Sîn » pour le distinguer visuellement du mot français « sin », inexistant comme terme moral courant mais susceptible d’être confondu dans d’autres langues.
- source_word: אֲשֶׁר בֵּין אֵילִם וּבֵין סִינָי
  choice: situé entre Élim et le Sinaï
  rationale: La proposition relative localise le désert. « Situé » explicite naturellement en français la relation géographique sans ajouter d’information.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשֵּׁנִי
  choice: le quinzième jour du deuxième mois
  rationale: Cette formulation française courante reproduit précisément la date hébraïque.
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרָיִם
  choice: après leur sortie du pays d’Égypte
  rationale: L’infinitif construit sert de point de référence chronologique. « Après leur sortie » conserve l’événement de l’exode comme repère et rend la phrase concise et naturelle.
theological_decisions: []
translation_notes:
