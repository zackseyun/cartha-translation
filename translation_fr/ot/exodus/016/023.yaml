    issue: « un repos complet » pour שַׁבָּתוֹן
    rationale: Cette expression peut évoquer avant tout l'intensité ou la totalité du repos. Le terme hébreu désigne ici une cessation solennelle, à portée cultuelle; « repos solennel » en préserve mieux la nuance.
  - severity: low
    issue: Ajout de « Puis »
    rationale: La conjonction ajoute une progression temporelle explicite là où le texte coordonne simplement les instructions. Elle peut être omise sans perte de naturel.
  - severity: low
    issue: La répétition verbale est moins directement perceptible dans « faites cuire ... ce que vous avez à cuire »
    rationale: La formulation est acceptable, mais l'ordre « ce que vous allez cuire..., cuisez-le... » reflète plus clairement la structure emphatique objet relatif + impératif.
