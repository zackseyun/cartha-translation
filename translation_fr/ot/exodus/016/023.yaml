  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם ה֚וּא אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה שַׁבָּת֧וֹן שַׁבַּת קֹ֛דֶשׁ לַֽ/יהוָ֖ה מָחָ֑ר אֵ֣ת אֲשֶׁר תֹּאפ֞וּ אֵפ֗וּ וְ/אֵ֤ת אֲשֶֽׁר תְּבַשְּׁלוּ֙ בַּשֵּׁ֔לוּ וְ/אֵת֙ כָּל הָ֣/עֹדֵ֔ף הַנִּ֧יחוּ לָ/כֶ֛ם לְ/מִשְׁמֶ֖רֶת עַד הַ/בֹּֽקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/023.yaml
  text: 'And he said to them[a], “This is what Yahweh has spoken: Tomorrow is a solemn rest, a holy Sabbath to Yahweh. What you will bake, bake; and what you will boil, boil; and all that is left over[b], set aside for yourselves to be kept until the morning.”'
translation:
  language: fr
  text: 'Il leur dit : « Voici ce que Yahweh a déclaré : Demain sera un repos solennel, un sabbat saint consacré à Yahweh. Ce que vous allez cuire au four, cuisez-le au four ; et ce que vous allez faire bouillir, faites-le bouillir. Tout ce qui restera, mettez-le de côté pour vous, afin de le garder jusqu’au matin. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Il leur dit
  rationale: Rend naturellement le wayyiqtol narratif et l’introduction du discours direct, sans ajouter de lien temporel absent du texte.
- source_word: הוּא אֲשֶׁר דִּבֶּר יְהוָה
  choice: Voici ce que Yahweh a déclaré
  rationale: « Voici ce que » reprend la question en cours, tandis que le passé composé exprime une parole divine déjà prononcée et toujours pertinente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: שַׁבָּתוֹן
  choice: un repos complet
  rationale: Le nom désigne une cessation marquée ou intégrale; « repos complet » reste clair en français moderne et conserve sa force.
- source_word: שַׁבַּת קֹדֶשׁ לַיהוָה
  choice: un sabbat saint consacré à Yahweh
  rationale: Conserve à la fois le caractère sacré du sabbat et son orientation vers Yahweh; « consacré » explicite naturellement la valeur relationnelle de לְ en français.
- source_word: אֵת אֲשֶׁר תֹּאפוּ אֵפוּ
  choice: Faites cuire au four ce que vous avez à cuire au four
  rationale: Préserve la répétition emphatique de la racine hébraïque tout en donnant une formulation française compréhensible.
- source_word: וְאֵת אֲשֶׁר תְּבַשְּׁלוּ בַּשֵּׁלוּ
  choice: et faites bouillir ce que vous avez à faire bouillir
  rationale: Retient le sens concret probable de בשל et reproduit le parallélisme emphatique du texte.
- source_word: כָּל הָעֹדֵף
  choice: tout ce qui restera
  rationale: Désigne naturellement en contexte la quantité restante ou excédentaire après la préparation.
- source_word: הַנִּיחוּ לָכֶם
  choice: mettez de côté pour vous
  rationale: Exprime l’action intentionnelle de réserver et conserve le complément לָכֶם.
- source_word: לְמִשְׁמֶרֶת עַד הַבֹּקֶר
  choice: afin de le garder jusqu’au matin
  rationale: Rend clairement le but de la mise en réserve et sa durée.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; la forme « Yahweh » maintient la distinction entre le nom personnel divin et un titre.
- issue: Relation du sabbat à Yahweh dans שַׁבַּת קֹדֶשׁ לַיהוָה
  choice: un sabbat saint consacré à Yahweh
  alternative: un sabbat saint pour Yahweh
  rationale: « Consacré à » exprime idiomatiquement l’appartenance ou l’orientation cultuelle sans imposer une interprétation confessionnelle supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition des verbes « cuire au four » et « faire bouillir » est conservée parce qu’elle porte l’emphase de l’hébreu. Aucun marqueur de note n’est nécessaire, car les principales nuances peuvent être rendues directement dans le texte.
