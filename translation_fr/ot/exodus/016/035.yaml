  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל אָֽכְל֤וּ אֶת הַ/מָּן֙ אַרְבָּעִ֣ים שָׁנָ֔ה עַד בֹּאָ֖/ם אֶל אֶ֣רֶץ נוֹשָׁ֑בֶת אֶת הַ/מָּן֙ אָֽכְל֔וּ עַד בֹּאָ֕/ם אֶל קְצֵ֖ה אֶ֥רֶץ כְּנָֽעַן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/035.yaml
  text: And the sons of Israel ate the manna forty years[a], until they came to an inhabited land[c][b]; they ate the manna until they came to the border of the land of Canaan.
translation:
  language: fr
  text: Les Israélites[a] mangèrent la manne pendant quarante ans, jusqu’à leur arrivée dans un pays habité[b] ; ils mangèrent la manne jusqu’à leur arrivée à l’extrémité du pays de Canaan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël », désignation traditionnelle de l’ensemble du peuple d’Israël.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une terre habitée » ou « un pays établi » ; l’expression s’oppose au désert et désigne un territoire où l’on vit de manière établie.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « à la limite », « au bord » ou « à la frontière du pays de Canaan ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Les Israélites
  rationale: Cette désignation collective rend naturellement en français moderne l’expression hébraïque littérale « les fils d’Israël », qui désigne ici l’ensemble du peuple, et non uniquement les hommes.
- source_word: אָכְלוּ
  choice: mangèrent
  rationale: Le qatal qal résume rétrospectivement une action prolongée ; le passé simple convient au registre narratif biblique soutenu et reste clair.
- source_word: הַמָּן
  choice: la manne
  rationale: « Manne » est la désignation française traditionnelle et courante de מָן ; l’article défini hébreu est conservé.
- source_word: אַרְבָּעִים שָׁנָה
  choice: pendant quarante ans
  rationale: La préposition « pendant » explicite naturellement la valeur durative de l’expression hébraïque sans en modifier le sens.
- source_word: עַד בֹּאָם
  choice: jusqu’à leur arrivée
  rationale: Cette tournure nominale reproduit sobrement la construction hébraïque avec infinitif et suffixe ; elle évite de préciser indûment s’il s’agit d’entrer pleinement dans le territoire.
- source_word: אֶל אֶרֶץ נוֹשָׁבֶת
  choice: dans une région habitée
  rationale: Le participe niphal נוֹשָׁבֶת décrit un territoire habité ou peuplé, par contraste avec le désert. « Région » évite en français la répétition immédiate de « pays » tout en gardant la portée géographique de אֶרֶץ.
- source_word: קְצֵה אֶרֶץ כְּנָעַן
  choice: aux confins du pays de Canaan
  rationale: קְצֵה peut désigner l’extrémité, le bord ou la frontière. « Aux confins » préserve cette latitude géographique sans imposer l’idée d’une ligne frontalière précisément définie.
theological_decisions:
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: Les Israélites
  alternative: Les fils d’Israël
  rationale: Dans ce contexte collectif, l’hébreu désigne tout le peuple. La formulation retenue évite que le français moderne ne restreigne à tort le référent aux seuls hommes, tandis qu’une note conserve la forme littérale et sa valeur traditionnelle.
- issue: Localisation exprimée par קְצֵה
  choice: aux confins du pays de Canaan
  alternative: à la frontière du pays de Canaan
  rationale: Le terme hébreu peut évoquer le bord, l’extrémité ou la limite. Le choix retenu maintient cette indétermination plutôt que de préciser la nature politique ou topographique de la limite.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le ton narratif biblique ; « Israélites » est plus naturel et plus exact dans sa portée collective que le calque « fils d’Israël ». Les deux propositions parallèles de l’hébreu sont conservées, de même que la répétition de « la manne ».
