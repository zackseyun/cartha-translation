base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/005.yaml
  text: And on the sixth day[a], when they prepare what they bring in, it will be twice as much as what they gather day by day.
translation:
  language: fr
  text: Le sixième jour, lorsqu’ils prépareront ce qu’ils auront rapporté, ce sera le double[a] de ce qu’ils ramassent chaque jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce sera une double portion par rapport à ce qu’ils ramassent chaque jour ».'
    reason: Alternative lexicale possible pour מִשְׁנֶה et עַל, qui peut être formulée comme une portion double mise en rapport avec la collecte quotidienne.
lexical_decisions:
- source_word: וְהָיָה
  choice: il y en aura
  rationale: Dans cette instruction orientée vers l’avenir, la forme introduit le résultat attendu. Cette tournure française exprime naturellement l’existence d’une quantité déterminée.
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: Le sixième jour
  rationale: Rendu temporel direct, sans ajouter « de la semaine », qui n’est pas explicite dans l’hébreu.
- source_word: וְהֵכִינוּ
  choice: lorsqu’ils prépareront
  rationale: La subordonnée temporelle relie clairement la préparation au sixième jour tout en conservant l’orientation future de l’instruction.
- source_word: אֵת אֲשֶׁר יָבִיאוּ
  choice: ce qu’ils auront rapporté
  rationale: Le verbe désigne ici ce que les Israélites auront apporté après la collecte. Le futur antérieur explicite naturellement en français l’antériorité de cet apport par rapport à la préparation.
- source_word: וְהָיָה מִשְׁנֶה
  choice: il y en aura le double
  rationale: מִשְׁנֶה indique une quantité double. « Le double » est précis, idiomatique et moins interprétatif que « une double portion ».
- source_word: עַל אֲשֶׁר
  choice: de ce que
  rationale: Avec מִשְׁנֶה, la préposition introduit la quantité de référence. La construction française « le double de » rend naturellement ce rapport de mesure.
- source_word: יִלְקְטוּ
  choice: ils ramassent
  rationale: לקט signifie recueillir ou ramasser ce qui se trouve au sol ; « ramasser » convient précisément au contexte de la manne.
- source_word: יוֹם יוֹם
  choice: jour après jour
  rationale: Cette expression restitue la valeur distributive et répétée de la redondance hébraïque.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la progression temporelle de l’hébreu et évite d’ajouter « de la semaine ». « Jour après jour » maintient le rythme distributif de יוֹם יוֹם.
