  text: וַ/יַּ֧עַשׂ בְּצַלְאֵ֛ל אֶת הָ/אָרֹ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֨יִם וָ/חֵ֜צִי אָרְכּ֗/וֹ וְ/אַמָּ֤ה וָ/חֵ֨צִי֙ רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/001.yaml
  text: Bezalel made the ark of acacia wood. Its length was two and a half cubits[a], its width one and a half cubits, and its height one and a half cubits.
translation:
  language: fr
  text: Betsaléel fit l’arche en bois d’acacia. Elle mesurait deux coudées et demie de long, une coudée et demie de large et une coudée et demie de haut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « coffre ». Le terme hébreu peut désigner plus généralement un coffre, mais, dans le contexte du tabernacle, « arche » est le rendu le plus précis.
    reason: Alternative lexicale de אָרוֹן, conformément à l’ambiguïté du terme et à l’audit anglais.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fit
  rationale: Le verbe עשה signifie couramment « faire ». Le passé simple convient au registre narratif biblique tout en restant naturel et digne.
- source_word: בְּצַלְאֵל
  choice: Betsaléel
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: הָאָרֹן
  choice: l’arche
  rationale: אָרוֹן peut désigner un coffre, mais, dans le contexte du sanctuaire, « arche » est le terme français établi et contextuellement précis.
- source_word: עֲצֵי שִׁטִּים
  choice: en bois d’acacia
  rationale: La construction hébraïque désigne le matériau ; « en bois d’acacia » est clair et idiomatique en français.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: deux coudées et demie
  rationale: La mesure ancienne est conservée sans conversion, et l’accord de « demie » avec « coudées » respecte l’usage français.
- source_word: אָרְכּוֹ
  choice: de long
  rationale: Cette formulation dimensionnelle est plus naturelle en français courant que « sa longueur était de », sans perte de sens.
- source_word: וְאַמָּה וָחֵצִי
  choice: une coudée et demie
  rationale: Rendu direct et idiomatique de la mesure répétée pour la largeur et la hauteur.
- source_word: רָחְבּוֹ
  choice: de large
  rationale: Rendu français naturel de la dimension transversale.
- source_word: קֹמָתוֹ
  choice: de haut
  rationale: Rendu français naturel de la dimension verticale de l’objet.
