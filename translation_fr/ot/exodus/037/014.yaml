  text: The rings were beside the frame, as holders for the poles to carry the table.
translation:
  language: fr
  text: Les anneaux étaient placés près de l’encadrement et servaient de supports aux barres avec lesquelles on portait la table.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֻמַּת הַמִּסְגֶּרֶת
  choice: près de l’encadrement
  rationale: לְעֻמַּת exprime ici la proximité ou la correspondance spatiale avec l’encadrement; « près de » convient au contexte matériel sans imposer le sens plus précis « en face de ». « Encadrement » rend naturellement מִסְגֶּרֶת dans la description de la table.
- source_word: בָּתִּים לַבַּדִּים
  choice: servaient de supports aux barres
  rationale: Le pluriel בָּתִּים, littéralement « maisons », désigne des logements ou supports destinés à recevoir les barres. Cette formulation française exprime clairement leur fonction.
- source_word: לָשֵׂאת אֶת־הַשֻּׁלְחָן
  choice: avec lesquelles on portait la table
  rationale: 'L’infinitif לָשֵׂאת indique la fonction des barres: permettre le transport de la table. La relative est naturelle en français et conserve ce rapport instrumental.'
