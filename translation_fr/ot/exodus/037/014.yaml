  text: לְ/עֻמַּת֙ הַ/מִּסְגֶּ֔רֶת הָי֖וּ הַ/טַּבָּעֹ֑ת בָּתִּים֙ לַ/בַּדִּ֔ים לָ/שֵׂ֖את אֶת הַ/שֻּׁלְחָֽן־׃
