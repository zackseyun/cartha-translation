  yaml_path: translation/ot/exodus/037/025.yaml
  text: He made the altar of incense of acacia wood. Its length was one cubit[a], and its width one cubit—it was square—and its height was two cubits. Its horns were of one piece with it.
translation:
  language: fr
  text: Il fit l’autel de l’encens en bois d’acacia. Il avait une coudée de long sur une coudée de large — il était carré — et deux coudées de haut. Ses cornes faisaient corps avec lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol poursuit le récit par une action passée. En français moderne, l’omission de la conjonction initiale donne une narration fluide sans effacer la succession des actions.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: l’autel de l’encens
  rationale: Cette formulation rend directement la relation construite (« autel de l’encens ») et désigne clairement la fonction cultuelle de l’objet.
- source_word: עֲצֵי שִׁטִּים
  choice: en bois d’acacia
  rationale: « Bois d’acacia » est la désignation moderne, claire et usuelle du matériau, contrairement à une simple translittération.
- source_word: אַמָּה
  choice: une coudée
  rationale: Le maintien de l’unité ancienne évite une conversion moderne faussement précise et conserve la couleur historique du texte.
- source_word: אָרְכּוֹ ... רָחְבּוֹ ... קֹמָתוֹ
  choice: Il avait une coudée de long sur une coudée de large … et deux coudées de haut
  rationale: Cette tournure dimensionnelle est naturelle en français et restitue explicitement les suffixes possessifs renvoyant à l’autel.
- source_word: רָבוּעַ
  choice: il était carré
  rationale: L’adjectif prédicatif est rendu par une proposition complète, claire et idiomatique.
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: Ses cornes faisaient corps avec lui
  rationale: L’expression indique que les cornes appartenaient intégralement à la structure de l’autel plutôt que d’y être rapportées; « faisaient corps avec lui » l’exprime naturellement sans préciser davantage le procédé de fabrication.
