  text: and a bulb under two branches from it[a], and a bulb under two branches from it, and a bulb under two branches from it, for the six branches coming out from it.
translation:
  language: fr
  text: Un renflement[a] sous deux branches qui en sortaient, un renflement sous deux branches qui en sortaient, et un renflement sous deux branches qui en sortaient, pour les six branches qui en sortaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « bouton » : élément ornemental arrondi du porte-lampes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַפְתֹּר
  choice: renflement
  rationale: Dans la description du porte-lampes, le terme désigne un élément ornemental arrondi. « Renflement » évoque naturellement une forme bombée faisant corps avec l'ouvrage, sans suggérer une pièce rapportée.
- source_word: תַּחַת
  choice: sous
  rationale: La préposition indique directement que chaque ornement se trouve au-dessous du point de départ d'une paire de branches.
- source_word: שְׁנֵי הַקָּנִים
  choice: paire de branches
  rationale: קָנֶה désigne ici les bras latéraux du porte-lampes; « branches » conserve son imagerie végétale. Le singulier collectif « chaque paire » rend clairement la répartition des trois renflements sous les six branches.
- source_word: מִמֶּנָּה
  choice: qui en sortaient
  rationale: Le pronom féminin renvoie au porte-lampes. « En » conserve cette reprise sans ajouter explicitement un référent absent du verset.
- source_word: לְשֵׁשֶׁת הַקָּנִים
  choice: pour les six branches
  rationale: Cette formulation conserve la valeur récapitulative de la préposition לְ et relie les trois emplacements aux six branches latérales.
- source_word: הַיֹּצְאִים מִמֶּנָּה
  choice: qui en sortaient
  rationale: Le participe décrit les branches comme issues du porte-lampes; l'imparfait convient à la description narrative de l'objet achevé.
