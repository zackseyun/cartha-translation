  yaml_path: translation/ot/exodus/037/012.yaml
  text: He made for it a frame a handbreadth wide all around[b][a], and he made a gold molding around its frame.
translation:
  language: fr
  text: Il lui fit tout autour un cadre d’un palme de large[a], et il fit tout autour de ce cadre une bordure décorative en or[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un palme correspond approximativement à la largeur d’une main, soit environ 7,5 cm.
    reason: measurement_clarification
  - marker: b
    text: Ou « une moulure en or » ou, traditionnellement, « une couronne d’or ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגֶּרֶת
  choice: cadre
  rationale: Le terme désigne ici l’encadrement structurel de la table. « Cadre » est naturel en français moderne et convient au contexte de fabrication.
- source_word: טֹפַח
  choice: large d’un palme
  rationale: Le nom indique une unité de longueur correspondant à la largeur d’une main. L’ajout de « large » explicite naturellement en français la dimension du cadre.
- source_word: סָבִיב
  choice: tout autour
  rationale: Cette expression rend clairement l’idée d’un élément qui entoure l’objet sur tous ses côtés.
- source_word: זֵר
  choice: bordure décorative
  rationale: Dans la description du mobilier du sanctuaire, le mot désigne une garniture périphérique, probablement ornementale. « Bordure décorative » évite le sens royal que « couronne » évoquerait aujourd’hui.
- source_word: זָהָב
  choice: en or
  rationale: La tournure française « en or » exprime naturellement la matière dont la bordure est faite.
- source_word: לְמִסְגַּרְתּוֹ
  choice: de ce cadre
  rationale: Le préfixe relationnel et le suffixe possessif rattachent la bordure au cadre déjà mentionné. La formulation française l’exprime sans imposer une localisation technique plus précise que l’hébreu.
