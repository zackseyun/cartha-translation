source:
  edition: WLC
  text: כַּפְתֹּרֵי/הֶ֥ם וּ/קְנֹתָ֖/ם מִמֶּ֣/נָּה הָי֑וּ כֻּלָּ֛/הּ מִקְשָׁ֥ה אַחַ֖ת זָהָ֥ב טָהֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/022.yaml
  text: Their buds and their branches were of one piece with it[c][b][a]; all of it was one hammered work of pure gold.
translation:
  language: fr
  text: Leurs boutons et leurs branches étaient d’une seule pièce avec le chandelier[a] ; le tout était un seul ouvrage martelé en or pur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « étaient issus d’elle » ; c’est-à-dire qu’ils faisaient corps avec le chandelier.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « le tout, martelé d’une seule pièce en or pur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: leurs boutons
  rationale: Dans la description du chandelier, le terme désigne des ornements arrondis liés au décor végétal. « Boutons » conserve à la fois la forme et l’image florale, sans évoquer à tort des boutons mécaniques.
- source_word: וּקְנֹתָם
  choice: et leurs branches
  rationale: Bien que קָנֶה signifie couramment « roseau » ou « tige », il désigne ici les bras saillants du chandelier ; « branches » est le terme français naturel dans ce contexte.
- source_word: מִמֶּנָּה הָיוּ
  choice: étaient d’une seule pièce avec le chandelier
  rationale: Littéralement « étaient issus d’elle ». La formulation française exprime clairement que les ornements et les branches faisaient corps avec le chandelier, sans être des pièces rapportées.
- source_word: כֻּלָּהּ
  choice: le tout
  rationale: Le féminin singulier renvoie au chandelier dans son ensemble ; « le tout » restitue l’idée globale avec concision.
- source_word: מִקְשָׁה אַחַת
  choice: un seul ouvrage martelé
  rationale: מִקְשָׁה désigne un objet façonné au marteau, tandis que אַחַת souligne son unité. Cette traduction préserve les deux éléments.
- source_word: זָהָב טָהוֹר
  choice: en or pur
  rationale: Formulation française usuelle et exacte pour la matière indiquée dans les textes du sanctuaire.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Chandelier » explicite le référent implicite du pronom féminin hébreu et maintient la terminologie traditionnelle compréhensible du mobilier du sanctuaire. Les deux occurrences de « seul » rendent distinctement l’unité de construction exprimée par מִמֶּנָּה et אַחַת.
