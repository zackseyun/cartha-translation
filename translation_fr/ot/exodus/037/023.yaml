  text: He made its seven lamps[a], its tongs[b], and its firepans of pure gold.
translation:
  language: fr
  text: Il fit ses sept lampes, ses pinces[a] et ses cendriers[b], le tout en or pur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « mouchettes » : le terme hébreu désigne un instrument servant à manipuler ou à entretenir les mèches.'
    reason: lexical_alternative
  - marker: b
    text: Ou « récipients » ou « brasiers ». Dans ce contexte, il s’agit probablement de petits contenants associés au chandelier.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol de עשה poursuit le récit; le passé simple convient au registre narratif français et la conjonction peut rester implicite.
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: ses sept lampes
  rationale: נֵרֹת désigne des lampes, et le suffixe féminin singulier renvoie au chandelier; l’ordre nombre-nom est naturel en français.
- source_word: מַלְקָחֶיהָ
  choice: ses pinces[a]
  rationale: Le terme désigne un instrument servant à saisir ou à entretenir les mèches. « Pinces » reste concret et moins interprétatif que « mouchettes ».
- source_word: מַחְתֹּתֶיהָ
  choice: ses porte-cendres[b]
  rationale: Dans le contexte du chandelier, il s’agit vraisemblablement de petits récipients destinés aux résidus des mèches, plutôt que de braseros liés à l’autel.
- source_word: זָהָב טָהוֹר
  choice: le tout en or pur
  rationale: Cette formulation française naturelle indique clairement que la matière s’applique aux lampes et aux deux catégories d’accessoires.
