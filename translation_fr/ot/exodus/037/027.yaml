  text: And he made for it two rings of gold under its rim[a], on its two side frames, on its two sides[b], as holders for poles with which to carry it.
translation:
  language: fr
  text: Il fit pour l’autel deux anneaux d’or, sous sa bordure[a], sur ses deux pièces latérales, sur ses deux côtés[b], comme logements pour les barres destinées à porter l’autel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sous sa moulure ». Le mot hébreu זֵר désigne la bordure décorative qui entourait le haut.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu juxtapose deux expressions proches : « sur ses deux pièces latérales, sur ses deux côtés ». La traduction conserve cette répétition.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁתֵּי טַבְּעֹת זָהָב
  choice: deux anneaux d’or
  rationale: טַבְּעֹת désigne ici les anneaux métalliques fixés au mobilier sacré; le complément de matière se rend naturellement par « d’or ».
- source_word: עָשָׂה ל/וֹ
  choice: Il lui fit
  rationale: Le suffixe renvoie à l’autel décrit dans le contexte. « Lui fit » exprime avec naturel en français l’idée de faire ces anneaux pour cet objet.
- source_word: מִ/תַּחַת לְ/זֵר/וֹ
  choice: sous sa bordure
  rationale: זֵר désigne la bordure décorative qui entoure le haut du meuble. « Bordure » est clair et évite le sens royal que pourrait suggérer « couronne ».
- source_word: עַל שְׁתֵּי צַלְעֹתָי/ו
  choice: sur ses deux pièces latérales
  rationale: צלע peut désigner un côté, une côte ou une pièce structurelle latérale. « Pièces latérales » garde ce sens concret tout en le distinguant du terme plus ordinaire צִדָּיו qui suit.
- source_word: עַל שְׁנֵי צִדָּי/ו
  choice: sur ses deux côtés
  rationale: צד est le terme courant pour « côté ». La répétition avec l’expression précédente est conservée, conformément à l’hébreu.
- source_word: לְ/בָתִּים לְ/בַדִּים
  choice: pour servir de supports aux barres
  rationale: בָּתִּים signifie littéralement « maisons », mais désigne ici les logements ou supports recevant les barres. « Supports » est naturel et intelligible.
- source_word: לָ/שֵׂאת אֹת/וֹ בָּ/הֶם
  choice: avec lesquelles on le porterait
  rationale: L’infinitif indique la fonction des barres et בָּהֶם leur rôle instrumental. Le conditionnel traduit naturellement en français cette destination dans une description de fabrication.
