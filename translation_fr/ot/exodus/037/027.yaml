  source_fidelity: 'Le sens des anneaux d’or placés sous la bordure, sur les deux éléments latéraux et sur les deux côtés, comme logements pour les barres de portage, est globalement bien rendu. Toutefois, le suffixe de לוֹ renvoie à l’autel : en français, « Il lui fit » est ambigu et peu naturel pour un objet. Expliciter l’antécédent contextuel (« l’autel ») est une correction sûre. « Afin de le porter » rend plus directement le but de l’infinitif hébreu que le conditionnel « on le porterait ».'
  naturalness: La phrase est claire, mais « Il lui fit » sonne inhabituel et peut momentanément faire comprendre un référent humain. « Logements » est plus précis que « supports » pour des anneaux qui reçoivent les barres, tout en restant naturel dans une description d’objet.
  terminology: « Bordure », « pièces latérales », « côtés » et « barres » préservent convenablement les distinctions et la répétition du texte hébreu. Le terme « logements » traduit de façon appropriée la fonction de לְבָתִּים sans introduire une interprétation doctrinale.
