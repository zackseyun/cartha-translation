  text: וַ/יָּבֵ֤א אֶת הַ/בַּדִּים֙ בַּ/טַּבָּעֹ֔ת עַ֖ל צַלְעֹ֣ת הָ/אָרֹ֑ן לָ/שֵׂ֖את אֶת הָ/אָרֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/005.yaml
  text: And he put the poles into the rings on the sides of the ark, to carry the ark.
translation:
  language: fr
  text: Il introduisit les barres dans les anneaux placés sur les côtés de l’arche, afin de porter l’arche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֵא
  choice: introduisit
  rationale: Dans cette construction, le verbe בוא décrit l’action de faire entrer les barres dans les anneaux. « Introduisit » exprime clairement ce mouvement en français sans ajouter de détail absent du texte.
- source_word: הַבַּדִּים
  choice: les barres
  rationale: בַּדִּים désigne les longues pièces servant au transport du mobilier sacré. « Barres » est le terme français courant et précis dans ce contexte.
- source_word: בַּטַּבָּעֹת
  choice: dans les anneaux
  rationale: La préposition ב indique ici que les barres sont placées à l’intérieur des anneaux. « Dans les anneaux » est idiomatique en français.
- source_word: עַל צַלְעֹת הָאָרֹן
  choice: placés sur les côtés de l’arche
  rationale: צְלָעוֹת peut désigner les côtés ou éléments latéraux. « Les côtés » convient naturellement au coffre sacré; « placés » explicite sans ambiguïté que les anneaux, et non les barres, se trouvent sur ces côtés.
- source_word: הָאָרֹן
  choice: l’arche
  rationale: אָרוֹן désigne ici le coffre sacré du sanctuaire. « Arche » est le terme français consacré et demeure compréhensible dans le contexte biblique.
- source_word: לָשֵׂאת
  choice: afin de porter
  rationale: L’infinitif construit de נשׂא exprime le but. « Afin de porter » restitue explicitement cette valeur finale dans un registre naturel et digne.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la répétition de « l’arche » présente dans l’hébreu et évite le terme vieilli « brancards ».
