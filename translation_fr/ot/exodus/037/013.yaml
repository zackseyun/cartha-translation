  text: He cast four gold rings for it and put the rings on the four corners at its four feet[a].
translation:
  language: fr
  text: Il coula quatre anneaux d’or pour elle et plaça les anneaux aux quatre coins qui se trouvaient à ses quatre pieds[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux quatre coins correspondant à ses quatre pieds ».
    reason: L’expression hébraïque relie les quatre coins aux quatre pieds sans préciser entièrement la nature de ce lien spatial ou structurel.
lexical_decisions:
- source_word: וַיִּצֹק
  choice: coula
  rationale: Dans ce contexte de fabrication d’objets métalliques, le verbe désigne le coulage du métal en fusion plutôt qu’une simple action de verser.
- source_word: לוֹ
  choice: pour elle
  rationale: Le suffixe renvoie à la table mentionnée dans le contexte immédiat; le féminin français suit le genre de « table ».
- source_word: טַבְּעֹת
  choice: anneaux
  rationale: Terme français courant et précis pour les pièces circulaires destinées à recevoir les barres de transport.
- source_word: זָהָב
  choice: d’or
  rationale: Désignation directe de la matière, rendue naturellement en français.
- source_word: וַיִּתֵּן
  choice: plaça
  rationale: Rend l’action de disposer les anneaux sans ajouter l’idée plus précise de les fixer.
- source_word: עַל
  choice: aux
  rationale: La contraction « aux » exprime ici naturellement le positionnement des anneaux aux coins; la proposition qui suit précise leur emplacement.
- source_word: פֵּאֹת
  choice: coins
  rationale: Dans la description d’un meuble, le terme désigne le plus naturellement ses quatre extrémités ou coins.
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: près de ses quatre pieds
  rationale: Cette formulation conserve le rapport spatial entre les coins et les quatre pieds de la table, sans préciser plus que l’hébreu la nature exacte de ce rapport.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Coula » emploie le vocabulaire courant du travail du métal; « plaça » reste proche du geste décrit. La répétition de « anneaux » est conservée comme dans l’hébreu, et la note maintient l’ambiguïté du rapport entre les coins et les pieds.
