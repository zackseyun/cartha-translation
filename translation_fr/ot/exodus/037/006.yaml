  text: וַ/יַּ֥עַשׂ כַּפֹּ֖רֶת זָהָ֣ב טָה֑וֹר אַמָּתַ֤יִם וָ/חֵ֨צִי֙ אָרְכָּ֔/הּ וְ/אַמָּ֥ה וָ/חֵ֖צִי רָחְבָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/006.yaml
  text: He made the mercy seat of pure gold; its length was two and a half cubits[a], and its width a cubit and a half.
translation:
  language: fr
  text: Il fit le couvercle d’expiation[a] en or pur. Il mesurait deux coudées et demie de long et une coudée et demie de large.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le propitiatoire ». Le terme hébreu désigne le couvercle d’or de l’arche et évoque l’expiation.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol de עשה exprime ici l’action suivante du récit. « Il fit » est naturel en français et le sujet renvoie à Betsaléel dans le contexte.
- source_word: כַּפֹּרֶת
  choice: le couvercle d’expiation
  rationale: Ce terme technique désigne le couvercle d’or de l’arche, étroitement associé au rite d’expiation. Cette formulation moderne rend à la fois l’objet concret et sa portée cultuelle; le terme traditionnel « propitiatoire » est conservé en note.
- source_word: זָהָב טָהוֹר
  choice: en or pur
  rationale: Cette tournure française exprime naturellement la matière dont l’objet est fait.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: deux coudées et demie
  rationale: Rendu idiomatique de la mesure hébraïque; « demie » s’accorde avec « coudées ».
- source_word: אָרְכָּהּ
  choice: de long
  rationale: Le suffixe renvoie au couvercle d’expiation. L’expression française « mesurer … de long » rend naturellement la proposition nominale hébraïque.
- source_word: וְאַמָּה וָחֵצִי
  choice: et une coudée et demie
  rationale: Reproduit précisément la seconde mesure tout en suivant l’usage français.
- source_word: רָחְבָּהּ
  choice: de large
  rationale: Dans la construction « mesurer … de large », cette expression rend clairement la largeur indiquée par le texte.
theological_decisions:
- issue: Rendu de כַּפֹּרֶת dans le contexte cultuel
  choice: couvercle d’expiation
  alternative: propitiatoire; couvercle
  rationale: « Couvercle » seul perdrait l’association explicite du terme avec l’expiation, tandis que « propitiatoire » est traditionnel mais peu transparent pour beaucoup de lecteurs modernes. « Couvercle d’expiation » préserve la réalité matérielle et la portée cultuelle sans préciser davantage le mécanisme théologique.
translation_notes:
  register: Français moderne, clair et digne. La seconde phrase reformule les deux propositions nominales de mesure selon l’expression française naturelle « mesurer… de long… de large », sans modifier les dimensions.
