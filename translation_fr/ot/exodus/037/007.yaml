  text: וַ/יַּ֛עַשׂ שְׁנֵ֥י כְרֻבִ֖ים זָהָ֑ב מִקְשָׁה֙ עָשָׂ֣ה אֹתָ֔/ם מִ/שְּׁנֵ֖י קְצ֥וֹת הַ/כַּפֹּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/007.yaml
  text: He made two cherubim of gold; he made them of hammered work[a], from the two ends of the mercy seat.
translation:
  language: fr
  text: Il fit deux chérubins en or ; il les fit au marteau, à partir des deux extrémités du propitiatoire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du couvercle d’expiation ». Le terme hébreu désigne le couvercle de l’arche, associé à l’expiation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le waw consécutif fait progresser le récit. En français moderne, « Il fit » suffit ici sans rendre systématiquement la conjonction.
- source_word: שְׁנֵי כְרֻבִים
  choice: deux chérubins
  rationale: « Chérubins » est le pluriel français établi et conserve l’imagerie cultuelle précise du tabernacle.
- source_word: זָהָב
  choice: en or
  rationale: Le nom indique la matière ; « en or » est la formulation française naturelle.
- source_word: מִקְשָׁה
  choice: en métal martelé
  rationale: Le terme désigne un ouvrage façonné au marteau. Cette traduction exprime le procédé sans réduire le sens à l’interprétation « d’une seule pièce ».
- source_word: עָשָׂה אֹתָם
  choice: il les fit
  rationale: La répétition du verbe עשה est maintenue afin de refléter l’insistance du texte hébreu sur la fabrication.
- source_word: מִשְּׁנֵי קְצוֹת
  choice: aux deux extrémités
  rationale: Dans ce contexte spatial et artisanal, le français naturel situe les chérubins aux deux extrémités. Le préfixe מִן peut évoquer leur provenance depuis ces extrémités, mais « depuis » serait moins idiomatique ici.
- source_word: הַכַּפֹּרֶת
  choice: le propitiatoire
  rationale: « Propitiatoire » est le terme français biblique établi pour le couvercle d’or de l’arche associé à l’expiation. Une note donne une formulation descriptive plus immédiatement transparente.
theological_decisions:
- issue: Traduction de הַכַּפֹּרֶת dans le contexte du sanctuaire
  choice: le propitiatoire
  alternative: le couvercle d’expiation
  rationale: Le terme désigne le couvercle de l’arche dans sa fonction cultuelle liée à l’expiation. « Propitiatoire » préserve la terminologie biblique française reçue sans trancher davantage la portée théologique du mot ; la note fournit l’alternative descriptive.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve la répétition de « fit » présente dans l’hébreu, tandis que « en métal martelé » explicite naturellement le procédé de fabrication sans ajouter l’idée contestable d’une pièce séparée ou monobloc.
