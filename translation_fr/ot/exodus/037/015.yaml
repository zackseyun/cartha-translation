  text: וַ/יַּ֤עַשׂ אֶת הַ/בַּדִּים֙ עֲצֵ֣י שִׁטִּ֔ים וַ/יְצַ֥ף אֹתָ֖/ם זָהָ֑ב לָ/שֵׂ֖את אֶת הַ/שֻּׁלְחָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/015.yaml
  text: He made the poles of acacia wood and overlaid them with gold, to carry the table.
translation:
  language: fr
  text: Il fit les barres en bois d’acacia et les recouvrit d’or, pour porter la table.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol poursuit la séquence narrative. En français, le passé simple rend naturellement cette action successive sans qu’il soit nécessaire d’ajouter « et ».
- source_word: הַבַּדִּים
  choice: les barres
  rationale: בַּדִּים désigne ici les longues pièces servant à transporter le mobilier sacré. « Barres » est le terme courant dans ce contexte en français biblique moderne.
- source_word: עֲצֵי שִׁטִּים
  choice: en bois d’acacia
  rationale: La construction hébraïque désigne le matériau. « En bois d’acacia » est précis, naturel et immédiatement compréhensible.
- source_word: וַיְצַף אֹתָם זָהָב
  choice: et les recouvrit d’or
  rationale: Dans ce contexte artisanal, צפה indique l’application d’un revêtement métallique. « Recouvrir d’or » conserve le sens sans imposer une technique plus précise que le texte.
- source_word: לָשֵׂאת
  choice: pour porter
  rationale: L’infinitif construit avec ל exprime ici la finalité des barres. « Pour porter » la restitue directement.
- source_word: הַשֻּׁלְחָן
  choice: la table
  rationale: Traduction directe de שֻׁלְחָן ; le contexte identifie déjà la table sacrée, sans qu’il faille l’expliciter dans le verset.
