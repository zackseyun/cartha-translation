  text: one cherub from one end on this side[a], and one cherub from one end on that side; from the mercy seat he made the cherubim on its two ends.
translation:
  language: fr
  text: un chérubin à l’une de ses extrémités, de ce côté-ci, et un chérubin à l’autre extrémité, de ce côté-là ; il fit les chérubins, en les tirant du propitiatoire[a], à ses deux extrémités.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le couvercle » ou « le couvercle d’expiation » ; l’hébreu kapporet désigne le couvercle d’or de l’arche.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרוּב
  choice: chérubin
  rationale: Le terme français établi conserve la désignation précise de ces êtres associés à l’arche sans recourir à une paraphrase spéculative.
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: à une extrémité, de ce côté-ci… à l’autre extrémité, de ce côté-là
  rationale: Cette formulation naturelle rend la disposition symétrique indiquée par les extrémités et les démonstratifs opposés.
- source_word: הַכַּפֹּרֶת
  choice: le propitiatoire
  rationale: Terme cultuel français traditionnel désignant le couvercle d’or de l’arche; une note donne les équivalents plus descriptifs afin de préserver la portée et l’ambiguïté lexicales.
- source_word: מִן הַכַּפֹּרֶת עָשָׂה
  choice: Il fit … d’une seule pièce avec le propitiatoire
  rationale: Dans ce contexte de fabrication, la préposition מן indique que les chérubins étaient travaillés à même le propitiatoire; «d’une seule pièce avec» exprime clairement cette continuité matérielle, en accord avec le passage parallèle d’Exode 25.19.
- source_word: מִשְּׁנֵי קְצוֹתָיו
  choice: à ses deux extrémités
  rationale: Rend naturellement en français la localisation des chérubins par rapport au propitiatoire.
theological_decisions:
- issue: Traduction de הַכַּפֹּרֶת dans le contexte du sanctuaire
  choice: propitiatoire
  alternative: couvercle; couvercle d’expiation
  rationale: «Propitiatoire» préserve la valeur cultuelle traditionnelle du terme sans réduire l’objet à sa seule forme matérielle. La note signale les autres traductions possibles sans imposer une interprétation doctrinale particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de «chérubin» et la symétrie spatiale de l’hébreu sont conservées; la seconde phrase explicite sobrement la continuité matérielle impliquée par le contexte de fabrication.
