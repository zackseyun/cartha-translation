  text: He made the holy anointing oil and the pure fragrant incense[b][a], the work of a perfumer.
translation:
  language: fr
  text: Il fit l’huile d’onction sacrée et l’encens aromatique pur[a], œuvre d’un parfumeur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’encens d’aromates » ou « l’encens composé d’aromates ». L’expression hébraïque désigne littéralement un encens fait de substances aromatiques.
    reason: lexical_alternative
  - marker: b
    text: Ou « préparé par un parfumeur ». L’hébreu souligne le travail spécialisé d’un artisan expert dans la composition de mélanges aromatiques.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol de עשה exprime ici une action passée achevée dans la suite narrative. « Il fit » est direct et digne.
- source_word: שֶׁמֶן הַמִּשְׁחָה קֹדֶשׁ
  choice: l’huile sainte destinée à l’onction
  rationale: Cette formulation rend à la fois la fonction d’onction exprimée par מִשְׁחָה et le caractère consacré indiqué par קֹדֶשׁ, dans un français naturel.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: l’encens aromatique
  rationale: L’expression désigne un encens composé de substances odorantes. « Encens aromatique » transmet clairement cette idée sans lourdeur littérale.
- source_word: טָהוֹר
  choice: pur
  rationale: Dans ce contexte cultuel et matériel, טָהוֹר qualifie naturellement l’encens comme pur.
- source_word: מַעֲשֵׂה רֹקֵחַ
  choice: œuvre d’un parfumeur
  rationale: Le syntagme nominal souligne la fabrication experte par un spécialiste des mélanges aromatiques. « Œuvre d’un parfumeur » en conserve la forme et la nuance artisanale.
