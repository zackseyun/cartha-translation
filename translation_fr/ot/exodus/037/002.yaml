  text: He overlaid it with pure gold[a], inside and outside, and made for it a surrounding border of gold.
translation:
  language: fr
  text: Il le plaqua d’or pur, à l’intérieur comme à l’extérieur, et lui fit tout autour une bordure d’or.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une moulure d’or tout autour » ou « un rebord d’or autour de l’objet ». Le mot hébreu זֵר désigne un élément décoratif qui fait le tour de l’objet.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַפֵּהוּ
  choice: Il le plaqua
  rationale: Au piel, צפה désigne ici l’application d’un revêtement métallique sur un objet. « Plaquer d’or » est précis et naturel dans un contexte d’artisanat.
- source_word: זָהָב טָהוֹר
  choice: d’or pur
  rationale: L’expression désigne un or exempt d’impuretés ; « or pur » est la formulation française courante et fidèle.
- source_word: מִבַּיִת וּמִחוּץ
  choice: à l’intérieur comme à l’extérieur
  rationale: Cette tournure rend clairement les deux surfaces concernées tout en conservant leur contraste spatial.
- source_word: וַיַּעַשׂ לוֹ
  choice: et lui fit
  rationale: Le pronom introduit par ל désigne l’objet auquel la bordure est destinée. « Lui fit » conserve cette relation sans alourdir la phrase.
- source_word: זֵר זָהָב
  choice: une bordure d’or
  rationale: Dans le mobilier du sanctuaire, זֵר désigne un élément décoratif qui borde et entoure l’objet. « Bordure » reste accessible et ne lui attribue pas une forme plus précise que l’hébreu.
- source_word: סָבִיב
  choice: tout autour
  rationale: Cette expression naturelle restitue l’idée d’un élément qui fait le tour de l’objet.
