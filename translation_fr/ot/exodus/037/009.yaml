revisions:
- from: Les chérubins avaient les ailes déployées vers le haut et abritaient de leurs ailes le couvercle de l’expiation[a]. Ils se faisaient face, et leur visage était tourné vers le couvercle de l’expiation.
  to: Les chérubins avaient les ailes déployées vers le haut, couvrant de leurs ailes le couvercle de l’expiation[a]. Leurs visages étaient tournés l’un vers l’autre ; les visages des chérubins étaient tournés vers le couvercle de l’expiation.
  rationale: La révision corrige le singulier injustifié de « visage » et rend plus directement l’action des ailes couvrant la kapporet. Elle conserve la répétition explicite, présente en hébreu, des visages et du couvercle de l’expiation, sans trancher davantage la portée théologique du terme.
