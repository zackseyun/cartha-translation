base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/009.yaml
  text: The cherubim had their wings spread upward[a], overshadowing the mercy seat with their wings, and their faces were toward one another; the faces of the cherubim were toward the mercy seat.
translation:
  language: fr
  text: Les chérubins avaient les ailes déployées vers le haut, couvrant de leurs ailes le couvercle de l’expiation[a]. Leurs visages étaient tournés l’un vers l’autre ; les visages des chérubins étaient tournés vers le couvercle de l’expiation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le propitiatoire » ; plus littéralement, « le couvercle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּרֻבִים
  choice: les chérubins
  rationale: Conserve le terme traditionnel et précis désignant ces êtres célestes, avec le pluriel français courant.
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: avaient les ailes déployées vers le haut
  rationale: Rend naturellement la construction participiale et indique clairement la direction dans laquelle les ailes s’étendaient.
- source_word: סֹכְכִים בְּכַנְפֵיהֶם עַל
  choice: abritaient de leurs ailes
  rationale: Le verbe décrit une couverture protectrice exercée au-dessus de l’objet. « Abritaient » évite la répétition maladroite de « couvraient le couvercle » sans suggérer nécessairement une dissimulation totale.
- source_word: הַכַּפֹּרֶת
  choice: le couvercle de l’expiation
  rationale: Cette expression désigne clairement le couvercle sacré de l’arche tout en conservant sa portée cultuelle. Elle est plus immédiatement compréhensible en français moderne que le seul terme technique « propitiatoire ».
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: Ils se faisaient face
  rationale: Rend en français idiomatique la formule réciproque littérale « chacun vers son frère ».
- source_word: אֶל הַכַּפֹּרֶת הָיוּ פְּנֵי הַכְּרֻבִים
  choice: leur visage était tourné vers le couvercle de l’expiation
  rationale: Maintient la mention explicite de l’orientation des visages vers le couvercle ainsi que la répétition présente dans l’hébreu.
theological_decisions:
- issue: Traduction de הַכַּפֹּרֶת dans le contexte du sanctuaire
  choice: le couvercle de l’expiation
  alternative: le propitiatoire ; le couvercle
  rationale: Le choix principal conserve à la fois la réalité matérielle du couvercle de l’arche et sa fonction cultuelle, sans imposer une théorie particulière de l’expiation. La note fournit le terme français traditionnel et la traduction plus strictement matérielle.
translation_notes:
  register: 'Français moderne, clair et digne. La formulation conserve la répétition du couvercle de l’expiation et la double orientation des chérubins : l’un vers l’autre et vers le couvercle.'
