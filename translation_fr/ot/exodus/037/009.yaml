    reason: lexical_alternative
  revision_rationale: La révision corrige le singulier injustifié de « visage » et rend plus directement l’action des ailes couvrant la kapporet. Elle conserve la répétition explicite, présente en hébreu, des visages et du couvercle de l’expiation, sans trancher davantage la portée théologique du terme.
