  yaml_path: translation/ot/exodus/037/010.yaml
  text: He made the table of acacia wood; its length was two cubits[a], its width one cubit, and its height one and a half cubits.
translation:
  language: fr
  text: Il fit la table en bois d’acacia. Elle avait deux coudées[a] de long, une coudée de large et une coudée et demie de haut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La coudée était une ancienne mesure de longueur fondée sur la longueur de l’avant-bras; sa valeur exacte pouvait varier.
    reason: historical_measurement
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol fait avancer le récit par une action passée. « Il fit » est direct, naturel et fidèle au sens de עשה.
- source_word: הַשֻּׁלְחָן
  choice: la table
  rationale: Le nom désigne clairement la table du sanctuaire, et l’article défini hébreu est conservé.
- source_word: עֲצֵי שִׁטִּים
  choice: en bois d’acacia
  rationale: La construction hébraïque désigne le matériau. « En bois d’acacia » est l’expression française courante et transparente.
- source_word: אַמָּתַיִם אָרְכּוֹ
  choice: deux coudées de long
  rationale: Cette formulation idiomatique rend exactement la longueur indiquée tout en conservant l’unité ancienne.
- source_word: וְאַמָּה רָחְבּוֹ
  choice: une coudée de large
  rationale: La largeur d’une coudée est exprimée dans une tournure française naturelle, parallèle aux deux autres dimensions.
- source_word: וְאַמָּה וָחֵצִי קֹמָתוֹ
  choice: une coudée et demie de haut
  rationale: La formulation suit précisément l’expression hébraïque « une coudée et une moitié » et rend קֹמָה par la dimension verticale appropriée à un objet.
