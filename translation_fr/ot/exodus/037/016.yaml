  register: Français international moderne, clair et digne. La syntaxe suit étroitement l’ordre du texte hébreu, tandis que « le tout en or pur » évite une fin de phrase ambiguë en français. La note conserve l’incertitude réelle concernant plusieurs termes de vaisselle cultuelle.
