base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/016.yaml
  text: 'He made the utensils that were on the table: its plates[a], its cups, its pitchers, and its bowls with which the drink offering was poured out, of pure gold.'
translation:
  language: fr
  text: 'Il fit les ustensiles qui étaient sur la table : ses plats[a], ses coupes, ses pichets et les bols avec lesquels la libation était versée, le tout en or pur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses assiettes, ses petits bols, ses aiguières et ses récipients ». Plusieurs noms de récipients employés dans ce verset sont rares ou propres à ce contexte ; leurs équivalents exacts restent donc incertains.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּלִים
  choice: les ustensiles
  rationale: Le terme כְּלִים désigne largement des objets, instruments ou récipients. « Ustensiles » convient naturellement ici à l’ensemble des objets associés à la table.
- source_word: אֲשֶׁר עַל הַשֻּׁלְחָן
  choice: qui étaient sur la table
  rationale: Cette formulation suit directement l’expression hébraïque « qui [étaient] sur la table » sans la transformer en indication fonctionnelle.
- source_word: קְעָרֹתָיו
  choice: ses plats
  rationale: קְעָרָה désigne couramment un plat ou une assiette. « Plats » est concret, naturel et adapté au contexte.
- source_word: כַּפֹּתָיו
  choice: ses coupes
  rationale: Dans ce contexte cultuel, כַּפּוֹת désigne de petits récipients. « Coupes » rend cette idée sans employer un terme technique ou archaïque.
- source_word: מְנַקִּיֹּתָיו
  choice: ses aiguières
  rationale: Ce terme rare semble désigner des récipients liés au service ou au versement. « Aiguières » exprime vraisemblablement cette fonction, tout en laissant l’incertitude lexicale à la note.
- source_word: הַקְּשָׂוֹת
  choice: les bols
  rationale: Le terme désigne ici des récipients associés à la libation. L’article défini, plutôt qu’un possessif, respecte la forme hébraïque.
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: avec lesquels la libation était versée
  rationale: Le passif singulier יֻסַּךְ est conservé par « était versée ». « La libation » explicite sobrement le sens cultuel du verbe נסך.
- source_word: זָהָב טָהוֹר
  choice: le tout en or pur
  rationale: La formule finale porte sur l’ensemble des ustensiles énumérés. « Le tout en or pur » rend cette portée clairement et naturellement en français.
