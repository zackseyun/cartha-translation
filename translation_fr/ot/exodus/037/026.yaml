  text: He overlaid it with pure gold—its top[a], its sides all around, and its horns—and he made for it a gold molding all around.
translation:
  language: fr
  text: Il le revêtit d’or pur — le dessus, les parois tout autour et les cornes — et il lui fit une bordure d’or tout autour[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une couronne d’or tout autour ». Le terme hébreu désigne une bordure ou une moulure ornementale faisant le tour de l’objet.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַף
  choice: il le plaqua
  rationale: Dans ce contexte d’artisanat, le verbe désigne l’application d’un revêtement métallique sur un objet en bois. « Plaquer d’or » est précis et naturel en français.
- source_word: זָהָב טָהוֹר
  choice: d’or pur
  rationale: Cette expression rend directement la qualité du matériau dans un français courant et digne.
- source_word: גַּגּוֹ
  choice: le dessus
  rationale: Bien que le nom puisse désigner un toit, il s’agit ici de la surface supérieure d’un petit autel; « le dessus » convient naturellement à cet objet.
- source_word: קִירֹתָיו
  choice: les parois
  rationale: Le terme signifie littéralement les murs ou parois; « parois » désigne clairement les surfaces verticales de ce mobilier.
- source_word: סָבִיב
  choice: tout autour
  rationale: Cette formulation conserve l’idée d’un pourtour complet et reste idiomatique en français moderne.
- source_word: קַרְנֹתָיו
  choice: les cornes
  rationale: Le terme cultuel désigne les saillies placées aux angles de l’autel. La traduction littérale conserve le vocabulaire biblique établi.
- source_word: זֵר
  choice: une bordure
  rationale: Le mot désigne ici un élément ornemental entourant l’objet. « Bordure » est clair et évite que « couronne » soit comprise comme une coiffure royale.
