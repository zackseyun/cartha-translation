  text: He made it and all its utensils from a talent of pure gold[a].
translation:
  language: fr
  text: Il fit le chandelier et tous ses ustensiles avec un talent d’or pur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ses récipients » ou « tous ses accessoires ». Le terme hébreu כֵּלִים désigne de manière générale les objets ou instruments associés au chandelier.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּכָּר
  choice: un talent
  rationale: Dans le contexte de la construction du sanctuaire, le terme désigne l’unité de poids appelée « talent ». Le français biblique courant conserve ce nom de mesure.
- source_word: זָהָב טָהוֹר
  choice: or pur
  rationale: Cette expression rend directement la qualité matérielle de l’or et convient naturellement au contexte artisanal.
- source_word: עָשָׂה
  choice: Il fit
  rationale: Le verbe courant « faire » restitue sobrement עשה. Le passé simple convient au registre narratif digne du passage.
- source_word: אֹתָהּ
  choice: le chandelier
  rationale: Le pronom suffixe féminin renvoie au chandelier mentionné dans le contexte. La reprise nominale évite en français l’ambiguïté possible du pronom « le » au début d’un verset isolé.
- source_word: וְאֵת כָּל כֵּלֶיהָ
  choice: et tous ses ustensiles
  rationale: כֵּלִים est un terme large désignant les objets, récipients ou instruments associés au chandelier. « Ustensiles » est clair et naturel, tout en laissant d’autres nuances en note.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche de l’hébreu, mais l’antécédent « le chandelier » est explicité pour assurer la clarté hors contexte. Le marqueur de note est placé après la proposition entière.
