  text: He made the poles of acacia wood and overlaid them with gold.
translation:
  language: fr
  text: Il fit les barres en bois d’acacia et les recouvrit d’or.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le qal wayyiqtol de עשה exprime ici l’action narrative successive. « Il fit » est naturel et fidèle dans ce récit de fabrication.
- source_word: הַבַּדִּים
  choice: les barres
  rationale: Dans le contexte du mobilier du sanctuaire, בַּדִּים désigne les longues pièces servant au transport. « Barres » est le terme français usuel dans ce contexte.
- source_word: עֲצֵי שִׁטִּים
  choice: en bois d’acacia
  rationale: La construction hébraïque désigne la matière employée ; « en bois d’acacia » est clair et idiomatique en français moderne.
- source_word: וַיְצַף
  choice: et les recouvrit
  rationale: Dans ce contexte artisanal, צפה signifie couvrir une surface d’un matériau. « Recouvrir d’or » rend naturellement l’idée sans préciser une technique non exprimée.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom objet masculin pluriel renvoie aux barres.
- source_word: זָהָב
  choice: d’or
  rationale: Après צפה, le nom indique la matière du revêtement ; le français emploie naturellement « recouvrir d’or ».
