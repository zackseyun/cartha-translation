translation:
  language: fr
  text: Le chandelier portait quatre coupes en forme de fleurs d’amandier[a], avec ses boutons et ses fleurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quatre coupes à motif d’amandier, avec ses renflements et ses fleurs ».
    reason: La forme précise du motif « d’amandier » et la nuance de כַּפְתֹּרֶיהָ peuvent être rendues respectivement comme un décor d’amandier et comme des renflements ornementaux.
lexical_decisions:
- source_word: וּ/בַ/מְּנֹרָה
  choice: Le chandelier portait
  rationale: La préposition situe les ornements sur le chandelier. Cette formulation française naturelle exprime qu’ils en faisaient partie, sans suggérer qu’ils se trouvaient à l’intérieur.
- source_word: אַרְבָּעָה
  choice: quatre
  rationale: Rend directement le nombre cardinal qui détermine le nom masculin pluriel suivant.
- source_word: גְבִעִים
  choice: coupes
  rationale: Le terme désigne ici des éléments décoratifs en forme de coupe. « Coupes » est précis, courant et adapté à la description du chandelier.
- source_word: מְשֻׁקָּדִים
  choice: façonnées en fleurs d’amandier
  rationale: Le participe décrit vraisemblablement des coupes travaillées selon un motif de fleur d’amandier. La formulation conserve l’image végétale tout en restant claire.
- source_word: כַּפְתֹּרֶיהָ
  choice: ses boutons
  rationale: Dans la description du sanctuaire, le mot désigne des renflements ornementaux. « Boutons » s’accorde avec le motif floral et demeure compréhensible, sans imposer une identification technique trop précise.
- source_word: וּ/פְרָחֶיהָ
  choice: et ses fleurs
  rationale: Le nom désigne des fleurs ou des floraisons. « Fleurs » évite une répétition lourde tout en conservant l’imagerie du texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et concret. « Le chandelier portait » rend naturellement la relation spatiale. La reprise au singulier « ses » suit les suffixes hébreux, qui renvoient au chandelier. « Avec » explicite en français le rapport appositionnel très condensé de l’hébreu sans trancher davantage la forme exacte des ornements.
