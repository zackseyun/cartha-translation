  text: He overlaid it with pure gold[a], and made for it a gold molding all around.
translation:
  language: fr
  text: Il la recouvrit d’or pur et lui fit une bordure d’or tout autour.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַף
  choice: recouvrit
  rationale: Dans ce contexte d’ameublement cultuel, le verbe désigne l’application d’un revêtement métallique sur un objet. « Recouvrir » est naturel en français et exprime clairement cette opération.
- source_word: אֹתוֹ
  choice: la
  rationale: Le pronom objet renvoie à la table mentionnée au verset précédent, nom féminin en français.
- source_word: זָהָב טָהוֹר
  choice: d’or pur
  rationale: Cette expression désigne un or de grande pureté; « or pur » est la formulation française courante et précise.
- source_word: וַיַּעַשׂ לוֹ
  choice: lui fit
  rationale: Le pronom introduit par ל indique que la bordure est faite pour la table. « Lui fit » conserve cette relation avec concision.
- source_word: זֵר
  choice: bordure
  rationale: Le terme désigne ici un élément façonné qui longe le pourtour de la table. « Bordure » reste concret et compréhensible, tout en évitant l’image potentiellement trompeuse d’une couronne royale.
- source_word: זָהָב
  choice: d’or
  rationale: Le nom indique simplement le matériau de la bordure.
- source_word: סָבִיב
  choice: tout autour
  rationale: Cette locution française naturelle rend l’idée d’un élément entourant complètement l’objet.
