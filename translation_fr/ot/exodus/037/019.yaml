base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/019.yaml
  text: Three almond-blossom-shaped cups were on the one branch[a], with bulb and flower; and three almond-blossom-shaped cups were on one branch, with bulb and flower[b]. So it was for the six branches coming out from the lampstand.
translation:
  language: fr
  text: Sur un bras, il y avait trois coupes en forme de fleurs d’amandier[a], avec un renflement[b] et une fleur ; et sur un autre bras, trois coupes en forme de fleurs d’amandier, avec un renflement et une fleur. Il en était ainsi pour les six bras qui sortaient du porte-lampes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « trois coupes façonnées comme des fleurs d’amandier ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot rendu par « renflement » peut aussi être traduit par « bouton » ou « pommeau » ; il désigne un élément ornemental arrondi du porte-lampes.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבִעִים
  choice: coupes
  rationale: Le nom désigne ici des éléments ornementaux en forme de coupe ; « coupes » est naturel, clair et non excessivement technique.
- source_word: מְשֻׁקָּדִים
  choice: en forme de fleurs d’amandier
  rationale: Dans la description du porte-lampes, le terme évoque un décor façonné à la manière de fleurs d’amandier ; cette formulation explicite naturellement le motif floral.
- source_word: קָנֶה
  choice: bras
  rationale: Dans ce contexte, le mot désigne chacun des éléments latéraux du porte-lampes. « Bras » est le terme français usuel et évite l’image trompeuse d’un roseau.
- source_word: כַּפְתֹּר
  choice: bouton
  rationale: Le terme désigne un ornement arrondi. « Bouton » conserve à la fois l’idée d’une protubérance et la cohérence du décor végétal, tout en laissant en note l’alternative « renflement ».
- source_word: פֶרַח
  choice: fleur
  rationale: Le nom désigne directement un ornement floral ; « fleur » est simple et précis.
- source_word: כֵּן
  choice: Il en était ainsi
  rationale: Cette expression résume clairement que le même agencement s’appliquait à l’ensemble des six bras.
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: qui sortaient du porte-lampes
  rationale: La formulation conserve l’image des bras issus de la structure centrale sans ajouter une précision absente du texte.
- source_word: מְנֹרָה
  choice: porte-lampes
  rationale: Le mot désigne le support portant les lampes. « Porte-lampes » est transparent en français moderne et évite une translittération inutile.
