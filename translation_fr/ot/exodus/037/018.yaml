  text: וְ/שִׁשָּׁ֣ה קָנִ֔ים יֹצְאִ֖ים מִ/צִּדֶּ֑י/הָ שְׁלֹשָׁ֣ה קְנֵ֣י מְנֹרָ֗ה מִ/צִּדָּ/הּ֙ הָֽ/אֶחָ֔ד וּ/שְׁלֹשָׁה֙ קְנֵ֣י מְנֹרָ֔ה מִ/צִּדָּ֖/הּ הַ/שֵּׁנִֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/018.yaml
  text: 'And six branches were coming out from its sides: three branches of the lampstand from its one side[b][a], and three branches of the lampstand from its second side.'
translation:
  language: fr
  text: 'Six branches sortaient de ses côtés : trois branches du porte-lampes d’un côté et trois branches du porte-lampes de l’autre côté.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָנִים / קְנֵי
  choice: branches
  rationale: Dans le contexte du porte-lampes, le terme désigne des tiges qui se ramifient à partir de l’axe central. « Branches » conserve cette image et reste naturel en français.
- source_word: יֹצְאִים
  choice: sortaient
  rationale: Le participe décrit les six branches comme se déployant vers l’extérieur depuis le porte-lampes. L’imparfait convient à la description d’un objet achevé dans ce récit.
- source_word: מִצִּדֶּיהָ / מִצִּדָּהּ
  choice: de ses côtés / d’un côté ... de l’autre côté
  rationale: « Côté » rend directement צד. Dans la reprise distributive, « d’un côté ... de l’autre côté » exprime naturellement en français l’opposition hébraïque entre « le premier/l’un » et « le second ».
- source_word: מְנֹרָה
  choice: porte-lampes
  rationale: Le mot désigne ici le support portant plusieurs lampes dans le sanctuaire. « Porte-lampes » traduit le nom commun sans recourir à la translittération « ménorah ».
- source_word: הָאֶחָד ... הַשֵּׁנִי
  choice: d’un côté ... de l’autre côté
  rationale: Cette formulation française naturelle conserve la répartition symétrique entre les deux côtés; une note signale l’expression plus littérale « de son premier côté ... de son second côté ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La structure descriptive et la symétrie du texte hébreu sont conservées, tandis que la formulation distributive est rendue de manière idiomatique.
