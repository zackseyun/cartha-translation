  text: He cast for it four rings of gold on its four feet[c][b][a], with two rings on one side and two rings on the other side.
translation:
  language: fr
  text: 'Il coula pour elle quatre anneaux d’or, sur ses quatre pieds[a] : deux anneaux sur un côté et deux anneaux sur l’autre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses quatre coins » ou « ses quatre points d’appui » ; le terme hébreu peut désigner des pieds, des extrémités inférieures ou des supports.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  choice: Il coula
  rationale: Dans le contexte du travail du métal, יצק désigne l’action de couler du métal en fusion dans un moule. « Couler » est ici précis et naturel en français.
- source_word: לוֹ
  choice: pour elle
  rationale: Le suffixe renvoie à l’arche, nom féminin en français ; le genre grammatical français exige donc « elle », sans modifier le référent hébreu.
- source_word: טַבְּעֹת זָהָב
  choice: anneaux d’or
  rationale: Cette formulation française naturelle correspond directement au groupe nominal hébreu.
- source_word: פַּעֲמֹתָיו
  choice: ses quatre pieds
  rationale: Le terme peut désigner des pieds, des extrémités inférieures ou des points d’appui. « Pieds » en donne le sens le plus direct dans la description d’un meuble, tout en conservant les autres possibilités en note.
- source_word: צַלְעוֹ
  choice: un côté
  rationale: צלע désigne couramment le côté d’un objet ou d’une construction ; « côté » est l’équivalent français usuel.
- source_word: הָאֶחָת … הַשֵּׁנִית
  choice: un côté … l’autre
  rationale: Littéralement, l’hébreu dit « le côté premier/l’un … le côté second ». La tournure retenue exprime naturellement en français la répartition entre les deux côtés.
