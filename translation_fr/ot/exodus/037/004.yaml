translation:
  language: fr
  text: Il fit des barres en bois d’acacia et les recouvrit d’or.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le qal wayyiqtol de עשה exprime l’action narrative « il fit ». Le français courant n’a pas besoin de rendre explicitement le ו initial dans cet enchaînement.
- source_word: בַּדֵּי
  choice: des barres
  rationale: Dans le contexte du mobilier du sanctuaire, בַּד désigne les longues pièces servant au transport. « Barres » est le terme français usuel et précis, sans l’explicitation interprétative de « barres de transport ».
- source_word: עֲצֵי שִׁטִּים
  choice: en bois d’acacia
  rationale: La chaîne construite désigne du bois provenant de l’acacia. Cette formulation est naturelle et accessible en français moderne.
- source_word: וַיְצַף
  choice: et les recouvrit
  rationale: Dans ce contexte artisanal, le piel de צפה signifie couvrir ou plaquer d’un matériau. « Recouvrir d’or » rend clairement l’opération sans suggérer nécessairement une technique moderne de placage.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom objet masculin pluriel renvoie aux barres.
- source_word: זָהָב
  choice: d’or
  rationale: L’or est la matière dont les barres sont recouvertes; la construction française idiomatique est « recouvrir d’or ».
