source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ אֶת הַ/מְּנֹרָ֖ה זָהָ֣ב טָה֑וֹר מִקְשָׁ֞ה עָשָׂ֤ה אֶת הַ/מְּנֹרָה֙ יְרֵכָ֣/הּ וְ/קָנָ֔/הּ גְּבִיעֶ֛י/הָ כַּפְתֹּרֶ֥י/הָ וּ/פְרָחֶ֖י/הָ מִמֶּ֥/נָּה הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/017.yaml
  text: He made the lampstand of pure gold[a]. He made the lampstand of hammered work; its base and its shaft, its cups, its buds[b], and its blossoms were of one piece with it.
translation:
  language: fr
  text: 'Il fit le porte-lampes en or pur. Il fit le porte-lampes d’une seule pièce martelée[a] : son pied et sa tige, ses coupes, ses boutons[b] et ses fleurs faisaient corps avec lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en ouvrage martelé ». Le terme hébreu désigne un objet métallique façonné au marteau dans une seule masse.
    reason: lexical_alternative
  - marker: b
    text: Ou « ses bourgeons ». Le terme hébreu désigne des ornements en forme de protubérances ; « boutons » préserve à la fois leur forme et le motif végétal du porte-lampes.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרָה
  choice: porte-lampes
  rationale: Le terme désigne ici le support cultuel portant plusieurs lampes, et non une lampe isolée. « Porte-lampes » évite l’anachronisme de bougies que peut suggérer « chandelier ».
- source_word: זָהָב טָהוֹר
  choice: or pur
  rationale: Dans la description d’un matériau, טָהוֹר indique un or pur ou raffiné ; « or pur » est l’équivalent français naturel.
- source_word: מִקְשָׁה
  choice: d’une seule pièce martelée
  rationale: Le mot décrit un ouvrage métallique façonné au marteau dans une masse unique. Cette formulation rend à la fois le procédé de fabrication et le caractère monobloc confirmé par la fin du verset.
- source_word: יְרֵכָהּ
  choice: son pied
  rationale: Bien que le sens concret premier soit « cuisse/côté », le mot désigne ici la partie inférieure qui soutient le porte-lampes.
- source_word: קָנָהּ
  choice: sa tige
  rationale: Le singulier renvoie à l’élément central vertical. « Tige » convient à la structure tout en maintenant discrètement l’imagerie végétale.
- source_word: גְּבִיעֶיהָ
  choice: ses coupes
  rationale: Le terme désigne les éléments décoratifs en forme de coupe ; « coupes » est précis et courant dans ce contexte.
- source_word: כַּפְתֹּרֶיהָ
  choice: ses boutons
  rationale: Le mot désigne des saillies ornementales arrondies. « Boutons » conserve leur forme et peut s’intégrer au motif végétal, sans imposer entièrement l’interprétation « bourgeons ».
- source_word: פְרָחֶיהָ
  choice: ses fleurs
  rationale: Le terme désigne clairement des ornements floraux ; « fleurs » est direct, naturel et précis.
- source_word: מִמֶּנָּה הָיוּ
  choice: faisaient corps avec lui
  rationale: L’expression indique que les différents éléments provenaient du porte-lampes lui-même et n’étaient pas rapportés séparément.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: Il fit ... Il fit
  rationale: La répétition simple du verbe « faire » reproduit la structure hébraïque sans variation stylistique artificielle.
theological_decisions: []
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe conserve la répétition de l’hébreu, tandis que « porte-lampes » décrit clairement l’objet sans évoquer des bougies. Les termes décoratifs restent concrets et accessibles.
