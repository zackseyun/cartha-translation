  text: And Joshua overcame Amalek and his people with the sword[a].
translation:
  language: fr
  text: Josué vainquit Amalec et son peuple par l’épée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus formelle : « au fil de l’épée ». L’hébreu dit littéralement « à la bouche de l’épée », expression qui désigne une défaite infligée au combat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹשׁ
  choice: vainquit
  rationale: Le verbe חלש peut exprimer l’idée d’affaiblir ou de prendre le dessus sur quelqu’un. Dans ce récit de bataille, « vainquit » rend naturellement l’issue du combat sans suggérer l’anéantissement total.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: עֲמָלֵק
  choice: Amalec
  rationale: Forme française usuelle du nom propre, qui désigne ici Amalec envisagé avec ses forces.
- source_word: עַמּוֹ
  choice: son peuple
  rationale: עַם signifie normalement « peuple ». Dans ce contexte militaire, il s’agit vraisemblablement des combattants d’Amalec, mais « son peuple » préserve la formulation hébraïque sans la préciser indûment.
- source_word: לְפִי חָרֶב
  choice: par l’épée
  rationale: L’expression hébraïque signifie littéralement « à la bouche de l’épée » et désigne une défaite infligée par les armes. « Par l’épée » est clair, naturel et fidèle à la valeur de l’idiome.
