  text: וַ/יִּקְרָא֙ שֵׁ֣ם הַ/מָּק֔וֹם מַסָּ֖ה וּ/מְרִיבָ֑ה עַל רִ֣יב בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/עַ֨ל נַסֹּתָ֤/ם אֶת יְהוָה֙ לֵ/אמֹ֔ר הֲ/יֵ֧שׁ יְהוָ֛ה בְּ/קִרְבֵּ֖/נוּ אִם אָֽיִן־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/007.yaml
  text: And he called the name of the place Massah and Meribah[a], because of the quarreling of the sons of Israel and because they tested Yahweh, saying[c][b], “Is Yahweh among us or not?”
translation:
  language: fr
  text: 'Il donna à ce lieu le nom de Massa et Meriba[a], à cause de la dispute des fils d’Israël[b] et parce qu’ils avaient mis Yahvé à l’épreuve en disant : « Yahvé est-il au milieu de nous ou non ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Massa » évoque en hébreu la mise à l’épreuve, et « Meriba » la dispute ou la contestation.
    reason: Jeu de mots étymologique essentiel à l’explication des noms de lieux.
  - marker: b
    text: L’expression « fils d’Israël » désigne ici collectivement les Israélites.
    reason: Clarification de la portée collective de l’expression hébraïque.
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: Il donna à ce lieu le nom de
  rationale: Le verbe קרא suivi de שֵׁם exprime ici l’attribution d’un nom. Cette tournure française naturelle conserve explicitement la formule de dénomination hébraïque.
- source_word: מַסָּה וּמְרִיבָה
  choice: Massa et Meriba
  rationale: Ces noms de lieux sont translittérés selon leur forme française usuelle. Leurs liens avec les mots hébreux désignant la mise à l’épreuve et la dispute sont signalés en note.
- source_word: עַל רִיב
  choice: à cause de la dispute
  rationale: La préposition עַל introduit la raison de la dénomination, tandis que רִיב désigne une dispute, une querelle ou une contestation. Le singulier « la dispute » respecte la forme du texte source.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La traduction conserve la formulation hébraïque et son lien avec le nom d’Israël, tout en précisant en note qu’elle désigne collectivement les Israélites.
- source_word: וְעַל נַסֹּתָם אֶת יְהוָה
  choice: et parce qu’ils avaient mis Yahvé à l’épreuve
  rationale: Le piel de נסה signifie mettre à l’épreuve ou tester. Le plus-que-parfait rend naturellement en français l’action antérieure qui motive l’attribution du nom, sans modifier le rapport causal.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu par la forme française courante du nom divin, plutôt que remplacé par un titre comme « le Seigneur ».
- source_word: הֲיֵשׁ יְהוָה בְּקִרְבֵּנוּ אִם אָיִן
  choice: Yahvé est-il au milieu de nous, oui ou non ?
  rationale: « Au milieu de nous » restitue בְּקִרְבֵּנוּ et garde l’idée de présence au sein de la communauté. « Oui ou non ? » rend clairement l’alternative elliptique אִם אָיִן en français actuel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom propre divin. La forme « Yahvé », usuelle en français, le préserve au lieu de lui substituer un titre.
- issue: Désignation collective בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: La formulation littérale est maintenue dans le texte, mais une note indique sa portée collective afin qu’elle ne soit pas comprise comme visant seulement certains hommes.
- issue: Portée de la question sur la présence divine
  choice: Yahvé est-il au milieu de nous, oui ou non ?
  alternative: Yahvé est-il parmi nous ou non ?
  rationale: La traduction conserve sans l’atténuer la mise en doute de la présence de Yahvé au sein du peuple, qui constitue précisément l’épreuve évoquée par le verset.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est naturelle sans effacer la formule de dénomination, les noms propres hébreux ni la tension de la question finale.
