  text: וַ/יַּ֣עַשׂ יְהוֹשֻׁ֗עַ כַּ/אֲשֶׁ֤ר אָֽמַר ל/וֹ֙ מֹשֶׁ֔ה לְ/הִלָּחֵ֖ם בַּ/עֲמָלֵ֑ק וּ/מֹשֶׁה֙ אַהֲרֹ֣ן וְ/ח֔וּר עָל֖וּ רֹ֥אשׁ הַ/גִּבְעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/010.yaml
  text: So Joshua did as Moses had told him[a], to fight against Amalek; and Moses, Aaron, and Hur went up to the top of the hill.
translation:
  language: fr
  text: 'Josué fit ce que Moïse lui avait dit : il combattit Amalek[a]. Moïse, Aaron et Hour montèrent au sommet de la colline.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « Amalek »; ce nom peut désigner ici le peuple descendant d’Amalek, c’est-à-dire les Amalécites.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ יְהוֹשֻׁעַ כַּאֲשֶׁר אָמַר לוֹ מֹשֶׁה
  choice: Josué fit ce que Moïse lui avait dit
  rationale: La tournure française exprime naturellement l'idée que Josué exécuta l'instruction donnée auparavant par Moïse, tout en restant proche de la construction hébraïque.
- source_word: לְהִלָּחֵם בַּעֲמָלֵק
  choice: il combattit Amalek
  rationale: L'infinitif hébreu précise le contenu de l'instruction exécutée. Une proposition coordonnée serait ambiguë en français; « il combattit » rend clairement l'action de Josué. Le nom propre « Amalek » est conservé plutôt que remplacé dans le texte par l'interprétation « les Amalécites ».
- source_word: עָלוּ
  choice: montèrent
  rationale: Ce verbe rend simplement et naturellement le mouvement vers un lieu élevé.
- source_word: רֹאשׁ הַגִּבְעָה
  choice: au sommet de la colline
  rationale: Littéralement « la tête de la colline »; « sommet » restitue l'idiome hébreu dans un français actuel et digne.
- source_word: יְהוֹשֻׁעַ / מֹשֶׁה / אַהֲרֹן / חוּר
  choice: Josué / Moïse / Aaron / Hour
  rationale: Formes françaises bibliques usuelles des noms propres.
theological_decisions:
- issue: Référent d’Amalek
  choice: Conserver « Amalek » dans le texte
  alternative: les Amalécites
  rationale: L'hébreu emploie le nom עֲמָלֵק, qui peut désigner ici collectivement le peuple issu d'Amalek. La traduction garde la forme du texte et signale l'interprétation collective en note.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation évite un calque maladroit tout en conservant le nom « Amalek » et son ambiguïté référentielle.
