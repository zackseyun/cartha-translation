base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/015.yaml
  text: And Moses built an altar and called its name[a], “Yahweh Is My Banner.”
translation:
  language: fr
  text: 'Moïse construisit un autel et lui donna ce nom[a] : « Yahweh est ma bannière. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Yahweh ma bannière »; on peut aussi traduire « Yahweh est mon étendard ». Ce nom présente vraisemblablement Yahweh comme le signe autour duquel Israël se rassemble et sous lequel il remporte la victoire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: construisit
  rationale: Le verbe בנה exprime directement l’action de bâtir. « Construisit » convient naturellement à un autel dans un récit au passé.
- source_word: מִזְבֵּחַ
  choice: autel
  rationale: מִזְבֵּחַ est le terme courant désignant un lieu consacré aux sacrifices ou au culte.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: lui donna ce nom
  rationale: Cette formulation française naturelle rend fidèlement l’expression hébraïque « il appela son nom » sans produire un calque maladroit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin יהוה. La translittération « Yahweh » préserve ici le nom personnel plutôt que de lui substituer un titre.
- source_word: נִסִּי
  choice: est ma bannière
  rationale: נִסִּי signifie littéralement « ma bannière » ou « mon étendard ». La copule « est », sous-entendue dans la proposition nominale hébraïque, est nécessaire en français; « bannière » conserve l’image d’un signe de ralliement.
theological_decisions:
- issue: Traduction du nom divin יהוה dans le nom commémoratif de l’autel
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu emploie explicitement le tétragramme. Garder « Yahweh » préserve le nom propre présent dans le texte, sans remplacer celui-ci par un titre.
- issue: Rapport exprimé par le nom יהוה נִסִּי
  choice: Yahweh est ma bannière
  alternative: Yahweh, ma bannière
  rationale: L’hébreu est une proposition nominale sans copule exprimée. Le français appelle naturellement « est », tout en conservant la métaphore et sans préciser davantage comment Yahweh est associé à la bannière.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple convient au registre narratif biblique écrit. « Lui donna ce nom » évite le calque peu naturel « appela son nom », tandis que la citation conserve la forme solennelle du nom commémoratif.
