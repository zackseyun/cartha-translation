source:
  edition: WLC
  text: וַ֠/יִּסְעוּ כָּל עֲדַ֨ת בְּנֵֽי יִשְׂרָאֵ֧ל מִ/מִּדְבַּר סִ֛ין לְ/מַסְעֵי/הֶ֖ם עַל פִּ֣י יְהוָ֑ה וַֽ/יַּחֲנוּ֙ בִּ/רְפִידִ֔ים וְ/אֵ֥ין מַ֖יִם לִ/שְׁתֹּ֥ת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/001.yaml
  text: Then the whole congregation of the sons of Israel set out from the wilderness of Sin by stages[a], according to the command of Yahweh, and camped at Rephidim[b]; but there was no water for the people to drink.
translation:
  language: fr
  text: Toute la communauté des Israélites partit du désert de Sîn, par étapes, selon l’ordre de Yahweh, et ils campèrent à Refidim. Mais il n’y avait pas d’eau à boire pour le peuple.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: partit
  rationale: Dans un récit de déplacement, נסע désigne le fait de lever le camp et de se mettre en route. « Partit » est naturel en français moderne; la progression du voyage est ensuite explicitée par « avançant par étapes ».
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: toute la communauté des Israélites
  rationale: עֵדָה désigne ici la communauté prise collectivement. « Israélites » rend naturellement l’expression idiomatique בְּנֵי יִשְׂרָאֵל sans suggérer que seuls les hommes sont concernés.
- source_word: מִמִּדְבַּר סִין
  choice: du désert de Sîn
  rationale: מִדְבָּר peut désigner un désert ou une région sauvage. « Désert » est le terme français courant dans ce contexte; l’accent de « Sîn » aide à distinguer ce toponyme.
- source_word: לְמַסְעֵיהֶם
  choice: avançant par étapes
  rationale: Le pluriel מַסָּעִים évoque les étapes successives d’un itinéraire. Cette formulation claire conserve cette progression sans alourdir la phrase.
- source_word: עַל פִּי יְהוָה
  choice: selon l’ordre de Yahweh
  rationale: Littéralement « selon la bouche de Yahweh », עַל־פִּי est un idiome exprimant la conformité à un ordre ou à une directive.
- source_word: וַיַּחֲנוּ בִּרְפִידִים
  choice: puis elle établit son camp à Refidim
  rationale: חנה signifie camper ou établir son camp. Le singulier reprend naturellement le collectif « communauté »; « puis » marque la succession narrative portée par le waw.
- source_word: וְאֵין מַיִם לִשְׁתֹּת הָעָם
  choice: Mais il n’y avait pas d’eau à boire pour le peuple
  rationale: Le waw a ici une valeur adversative naturelle après l’installation du camp. « D’eau à boire pour le peuple » restitue clairement la construction infinitive hébraïque.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin, non un titre. « Yahweh » le représente directement et évite de le remplacer silencieusement par « le SEIGNEUR ».
translation_notes:
  register: Français international moderne, digne et fluide. La formulation garde la dimension collective du peuple, la progression par étapes et le contraste final, sans archaïsmes ni explicitation doctrinale.
