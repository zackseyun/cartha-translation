  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה כְּתֹ֨ב זֹ֤את זִכָּרוֹן֙ בַּ/סֵּ֔פֶר וְ/שִׂ֖ים בְּ/אָזְנֵ֣י יְהוֹשֻׁ֑עַ כִּֽי מָחֹ֤ה אֶמְחֶה֙ אֶת זֵ֣כֶר עֲמָלֵ֔ק מִ/תַּ֖חַת הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/014.yaml
  text: Then Yahweh said to Moses[a], “Write this as a memorial in the book, and put it in Joshua’s hearing[c][b], for I will surely blot out the remembrance of Amalek from under heaven.”
translation:
  language: fr
  text: 'Alors Yahweh dit à Moïse : « Écris ceci comme mémorial dans le livre[a], et fais-le entendre à Josué[b], car j’effacerai bel et bien[c] le souvenir d’Amalec de sous le ciel. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un livre » ou « dans le rouleau »; l’hébreu dit littéralement « dans le livre ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « mets-le aux oreilles de Josué », c’est-à-dire : fais-le-lui entendre ou récite-le-lui.'
    reason: lexical_alternative
  - marker: c
    text: La tournure hébraïque traduite par « j’effacerai bel et bien » est emphatique.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin plutôt que de lui substituer un titre.
- source_word: זֹאת זִכָּרוֹן
  choice: ceci dans le livre pour qu’on s’en souvienne
  rationale: Rend la fonction mémorielle de l’écrit dans un français naturel, tout en maintenant le contraste avec le souvenir d’Amalec qui sera effacé.
- source_word: בַּסֵּפֶר
  choice: dans le livre
  rationale: Conserve l’article défini de l’hébreu; « dans un livre » ou « dans le rouleau » restent possibles selon la portée de l’article et le support envisagé.
- source_word: וְשִׂים בְּאָזְנֵי יְהוֹשֻׁעַ
  choice: et fais-le entendre à Josué
  rationale: Exprime naturellement l’idiome littéral « mets-le aux oreilles de Josué », qui commande de lui communiquer oralement le contenu.
- source_word: מָחֹה אֶמְחֶה
  choice: oui, j’effacerai complètement
  rationale: L’infinitif absolu suivi du verbe conjugué donne une valeur emphatique; « oui » et « complètement » rendent cette insistance en français courant.
- source_word: זֵכֶר עֲמָלֵק
  choice: le souvenir d’Amalec
  rationale: Rend directement l’idée de mémoire ou de souvenir et préserve le contraste avec l’écrit destiné à perpétuer le souvenir de l’événement.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: de dessous le ciel
  rationale: Conserve l’image et la portée universelle de l’expression hébraïque.
theological_decisions:
- issue: Rendu du nom divin
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; la translittération préserve le nom personnel sans le remplacer par un titre.
- issue: Portée de l’effacement promis
  choice: le souvenir d’Amalec
  alternative: la mémoire d’Amalec; le nom d’Amalec
  rationale: Le choix reste proche de זֵכֶר et n’explicite pas davantage la manière historique ou eschatologique dont cette parole s’accomplira.
translation_notes:
  register: 'Français international moderne, digne et accessible. La formulation privilégie une équivalence optimale : elle naturalise l’idiome concernant les oreilles de Josué, tout en conservant le nom Yahweh, l’article de « le livre », l’emphase de la promesse et l’image « de dessous le ciel ».'
