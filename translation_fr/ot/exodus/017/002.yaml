  text: וַ/יָּ֤רֶב הָ/עָם֙ עִם מֹשֶׁ֔ה וַ/יֹּ֣אמְר֔וּ תְּנוּ לָ֥/נוּ מַ֖יִם וְ/נִשְׁתֶּ֑ה וַ/יֹּ֤אמֶר לָ/הֶם֙ מֹשֶׁ֔ה מַה תְּרִיבוּ/ן֙ עִמָּדִ֔/י מַה תְּנַסּ֖וּ/ן אֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/002.yaml
  text: So the people quarreled with Moses and said[a], “Give us water so that we may drink.” And Moses said to them[b], “Why do you quarrel with me? Why do you test Yahweh?”
translation:
  language: fr
  text: 'Le peuple se querella avec Moïse et dit : « Donnez-nous de l’eau à boire. » Moïse leur répondit : « Pourquoi vous querellez-vous avec moi ? Pourquoi mettez-vous Yahvé à l’épreuve ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֶב
  choice: se querella
  rationale: Le verbe ריב exprime une dispute ou une contestation. « Se quereller avec » est naturel en français et conserve la dimension conflictuelle du terme.
- source_word: הָעָם
  choice: le peuple
  rationale: L’hébreu dit simplement « le peuple » ; préciser « d’Israël » ajouterait une information contextuelle absente du verset.
- source_word: עִם מֹשֶׁה
  choice: avec Moïse
  rationale: La préposition עִם signifie formellement « avec » et la tournure française « se quereller avec » rend naturellement l’opposition.
- source_word: תְּנוּ לָנוּ מַיִם וְנִשְׁתֶּה
  choice: Donnez-nous de l’eau à boire
  rationale: Cette formulation française concise rend l’impératif et la finalité exprimée par le cohortatif, sans lourdeur.
- source_word: מַה תְּרִיבוּן עִמָּדִי
  choice: Pourquoi vous querellez-vous avec moi ?
  rationale: Dans cette réprimande, מַה a le sens idiomatique de « pourquoi ». La reprise de « se quereller » préserve le lien lexical avec le début du verset.
- source_word: מַה תְּנַסּוּן
  choice: Pourquoi mettez-vous … à l’épreuve ?
  rationale: Le piel de נסה signifie « éprouver, mettre à l’épreuve ». La locution française exprime clairement l’idée de soumettre Dieu à un test et convient mieux ici que le potentiellement ambigu « tester ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le texte porte directement le nom divin YHWH. « Yahvé » est sa forme française traditionnelle et reconnaissable, tout en préservant le nom propre plutôt qu’en le remplaçant par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Employer « Yahvé » conserve dans le corps du texte le nom d’alliance présent en hébreu. La forme française usuelle est préférée à l’anglicisme « Yahweh ».
- issue: Portée de נסה appliqué à Dieu
  choice: mettre Yahvé à l’épreuve
  alternative: tester Yahvé
  rationale: 'La traduction garde la tension théologique : la querelle avec Moïse revient à soumettre Dieu lui-même à une épreuve. Elle n’atténue pas l’accusation en simple plainte.'
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme des deux questions est conservé, ainsi que la répétition de la racine ריב. Le pluriel « Donnez » correspond à l’impératif hébreu adressé à Moïse, probablement envisagé comme représentant de l’autorité ; il est maintenu sans explicitation.
