base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/016.yaml
  text: And he said[a], “A hand is upon the throne of Yah; Yahweh will have war with Amalek from generation to generation.”
translation:
  language: fr
  text: 'Il dit : « Une main est sur le trône de Yah[a] ; Yahweh sera en guerre contre Amalek de génération en génération. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est difficile et elliptique ; littéralement : « Une main sur le trône de Yah. » On peut aussi comprendre : « une main contre le trône de Yah » ou, moins probablement, prendre כֵּס au sens d’« étendard ».'
    reason: Lecture alternative d’une proposition hébraïque syntaxiquement condensée et contestée.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le wayyiqtol poursuit le récit avec un sujet masculin singulier que l’hébreu ne renomme pas ; le pronom implicite est donc conservé en français.
- source_word: כִּי
  choice: non exprimé séparément
  rationale: La particule introduit ici une parole dont la première proposition est elliptique. La ponctuation du discours direct en rend naturellement la fonction sans imposer un « car » ou un « parce que » trop interprétatif.
- source_word: יָד
  choice: Une main
  rationale: Le nom est sans article. L’indéfini respecte cette forme et ne précise pas à qui appartient la main.
- source_word: עַל
  choice: sur
  rationale: C’est le sens spatial le plus direct de la préposition. Le sens « contre » demeure possible dans cette expression difficile, mais il est signalé en note plutôt qu’introduit dans le texte.
- source_word: כֵּס
  choice: trône
  rationale: Cette forme inhabituelle est très probablement une graphie abrégée ou défective apparentée à כִּסֵּא, « trône ». Le sens « étendard » est lexicalement moins probable.
- source_word: יָהּ
  choice: Yah
  rationale: La forme courte du nom divin est distinguée du tétragramme יהוה employé immédiatement après.
- source_word: מִלְחָמָה לַיהוָה
  choice: Yahweh sera en guerre
  rationale: La proposition nominale présente la guerre comme celle de Yahweh. Le futur convient à la portée durable explicitée par « de génération en génération », tout en évitant une paraphrase plus forte telle que « mènera le combat ».
- source_word: בַּעֲמָלֵק
  choice: contre Amalek
  rationale: Dans un contexte de guerre, בְּ marque ici l’adversaire. « Contre » exprime clairement cette relation en français.
- source_word: מִדֹּר דֹּר
  choice: de génération en génération
  rationale: Cette expression idiomatique décrit une continuité à travers les générations successives et possède un équivalent français direct et naturel.
theological_decisions:
- issue: Distinction entre יָהּ et יהוה dans le même verset
  choice: Rendre יָהּ par « Yah » et יהוה par « Yahweh »
  alternative: Rendre les deux formes par « le Seigneur »
  rationale: Le texte emploie délibérément la forme courte Yah, puis le tétragramme complet. Les distinguer préserve cette particularité du texte source.
- issue: Sens de la proposition elliptique כִּי יָד עַל כֵּס יָהּ
  choice: « Une main est sur le trône de Yah »
  alternative: « Une main est levée contre le trône de Yah » ou « Une main est sur l’étendard de Yah »
  rationale: L’hébreu est fortement condensé et son sens exact est contesté. La traduction principale suit les valeurs lexicales les plus directes sans identifier la main ni transformer explicitement le geste en serment ou en attaque ; la note conserve les autres lectures importantes.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure volontairement concise « Une main est sur le trône de Yah » conserve l’étrangeté et l’ambiguïté de l’hébreu, tandis que « sera en guerre contre » reste naturel sans surinterpréter la proposition nominale.
