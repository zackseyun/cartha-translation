review_pass:
  verdict: revise
  source_fidelity: 'La première proposition elliptique est rendue avec retenue et la note conserve adéquatement les principales lectures alternatives. La seconde proposition est bien comprise comme l''annonce d''une guerre durable de Yahweh contre Amalek. Toutefois, « Il dit » au passé composé/présent narratif hybride est moins fidèle au wayyiqtol narratif que « Il dit »? En français biblique moderne, « Il dit » peut être un présent narratif, mais dans ce contexte isolé « Il dit » est possible. La correction nécessaire concerne surtout la cohérence interne: la décision lexicale pour בַּעֲמָלֵק indique « contre Amalek », alors que le texte porte déjà « contre Amalek »; aucune divergence. Le texte est source-fidèle.'
  naturalness: Le français est naturel, sobre et conserve volontairement l'ellipse. « Yahweh sera en guerre contre Amalek » est idiomatique, mais « Yahweh sera en guerre avec Amalek » refléterait plus littéralement la construction anglaise sans être préférable en français; « contre » est plus naturel et explicite en contexte guerrier.
  terminology: '« Yah » et « Yahweh » distinguent correctement les deux formes divines. « Trône », « guerre », « Amalek » et « de génération en génération » sont appropriés. Une correction sûre est nécessaire: la référence de note [a] est collée à « Yah » alors que la note porte sur l''ensemble de la proposition elliptique; l''ancrage doit suivre la proposition, après « Yah », ce qui est déjà son emplacement typographique. Aucun changement sémantique requis. Cependant, « Il dit » est grammaticalement correct mais le passé narratif « Il dit » n''est pas une correction. '
  issues:
  - severity: low
    issue: Ponctuation de l'appel de note
    rationale: L'appel [a] placé immédiatement après « Yah » peut être lu comme ne concernant que le nom divin, alors que la note explique toute la proposition elliptique. Le placer après la proposition, avant le point-virgule, rend sa portée plus claire sans modifier le sens.
  revised_text: 'Il dit : « Une main est sur le trône de Yah[a] ; Yahweh sera en guerre contre Amalek de génération en génération. »'
  revised_footnotes:
  - marker: a
    text: 'L’hébreu est difficile et elliptique ; littéralement : « Une main sur le trône de Yah. » On peut aussi comprendre : « une main contre le trône de Yah » ou, moins probablement, prendre כֵּס au sens d’« étendard ».'
    reason: Lecture alternative d’une proposition hébraïque syntaxiquement condensée et contestée.
  revision_rationale: 'La traduction ne requiert pas de modification textuelle substantielle : elle respecte l''ellipse de l''hébreu, distingue Yah de Yahweh et traduit correctement la guerre durable contre Amalek. L''appel de note est maintenu à la fin de la proposition elliptique afin d''indiquer qu''il porte sur celle-ci dans son ensemble. La soumission est classée « revise » uniquement pour formaliser cette clarification d''ancrage, sans changement de sens.'
