  text: וְ/הָיָ֗ה כַּ/אֲשֶׁ֨ר יָרִ֥ים מֹשֶׁ֛ה יָד֖/וֹ וְ/גָבַ֣ר יִשְׂרָאֵ֑ל וְ/כַ/אֲשֶׁ֥ר יָנִ֛יחַ יָד֖/וֹ וְ/גָבַ֥ר עֲמָלֵֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/011.yaml
  text: And whenever Moses raised his hand[a], Israel prevailed; and whenever he let down his hand[b], Amalek prevailed.
translation:
  language: fr
  text: Chaque fois que Moïse levait la main[a], Israël prenait l’avantage ; et chaque fois qu’il la laissait retomber[b], Amalec prenait l’avantage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quand Moïse levait la main […] quand il la laissait retomber ». La construction hébraïque peut être rendue plus formellement par « quand », mais le contexte indique une action répétée pendant le combat.'
    reason: lexical_alternative
  - marker: b
    text: Le verbe traduit par « laissait retomber » peut aussi signifier « faisait reposer » ou « abaissait ». Le contraste avec « levait la main » favorise ici cette formulation.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כַּאֲשֶׁר
  choice: Chaque fois que
  rationale: La construction introduit ici une circonstance répétée au cours du combat. « Chaque fois que » exprime naturellement cette valeur itérative en français.
- source_word: יָרִים
  choice: levait
  rationale: Le hifil de רום signifie « élever, lever ». L’imparfait convient à l’action répétée dans le récit et n’ajoute pas l’idée d’un maintien prolongé.
- source_word: יָדוֹ
  choice: la main
  rationale: Le texte hébreu dit précisément « sa main ». Dans la seconde proposition, le pronom « la » évite une répétition lourde tout en gardant le même référent.
- source_word: וְגָבַר
  choice: prenait l’avantage
  rationale: גבר indique qu’un camp devient ou se montre plus fort. Dans ce contexte militaire fluctuant, « prenait l’avantage » est naturel et évite de suggérer une victoire définitive.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française consacrée du nom du peuple.
- source_word: יָנִיחַ
  choice: laissait retomber
  rationale: Le hifil de נוח peut signifier « faire reposer, poser, abaisser ». En contraste avec « levait », « laissait retomber » rend clairement le mouvement sans imposer l’idée que Moïse posait sa main sur un support.
- source_word: עֲמָלֵק
  choice: Amalec
  rationale: Forme française biblique usuelle du nom du peuple.
theological_decisions: []
