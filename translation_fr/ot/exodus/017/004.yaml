source:
  edition: WLC
  text: וַ/יִּצְעַ֤ק מֹשֶׁה֙ אֶל יְהוָ֣ה לֵ/אמֹ֔ר מָ֥ה אֶעֱשֶׂ֖ה לָ/עָ֣ם הַ/זֶּ֑ה ע֥וֹד מְעַ֖ט וּ/סְקָלֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/004.yaml
  text: So Moses cried out to Yahweh[a], saying, “What shall I do with this people? A little more, and they will stone me!”
translation:
  language: fr
  text: 'Alors Moïse cria vers Yahweh : « Que vais-je faire avec ce peuple ? Encore un peu[a], et ils me lapideront ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « encore un peu »; l’expression indique que la menace est imminente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: cria vers
  rationale: Le verbe צעק exprime ici un appel pressant, lancé dans la détresse, plutôt qu’une simple prise de parole.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin, et non remplacé par un titre.
- source_word: לֵאמֹר
  choice: ponctuation introduisant le discours direct
  rationale: En français actuel, les deux-points introduisent naturellement les paroles de Moïse sans qu’il soit nécessaire de traduire mécaniquement « en disant ».
- source_word: מָה אֶעֱשֶׂה
  choice: Que vais-je faire
  rationale: Cette formulation naturelle conserve la délibération urgente exprimée par la forme verbale hébraïque.
- source_word: לָעָם הַזֶּה
  choice: avec ce peuple
  rationale: Dans ce contexte, le ל marque la relation entre l’action envisagée et le peuple. « Avec ce peuple » rend idiomatiquement la question sans préciser si l’action serait faite pour lui ou à son égard.
- source_word: עוֹד מְעַט
  choice: Encore un peu
  rationale: Cette expression concise reste proche de l’hébreu et indique que le passage à la violence est imminent.
- source_word: וּסְקָלֻנִי
  choice: et ils me lapideront
  rationale: Le verbe סקל désigne une attaque ou une mise à mort à coups de pierres; dans cette construction, l’accompli exprime le résultat imminent, rendu naturellement par le futur en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Portée de ל dans לָעָם הַזֶּה
  choice: avec ce peuple
  alternative: pour ce peuple / à ce peuple
  rationale: La préposition permet plusieurs nuances relationnelles. Le choix retenu conserve l’indétermination du texte et évite de présenter Moïse soit uniquement comme bienfaiteur, soit comme menaçant le peuple.
translation_notes:
  register: Français international moderne, direct et digne. « Cria vers » conserve la direction de l’appel vers Dieu tout en exprimant la détresse. La syntaxe du discours direct est allégée conformément à l’usage français actuel.
