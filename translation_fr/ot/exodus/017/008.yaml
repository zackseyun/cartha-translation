  yaml_path: translation/ot/exodus/017/008.yaml
  text: Then Amalek came and fought with Israel at Rephidim[a].
translation:
  language: fr
  text: Alors Amalec vint et combattit Israël à Rephidim[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « combattit avec Israël » ; dans ce contexte, la préposition hébraïque désigne Israël comme la partie adverse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Alors … vint
  rationale: Le waw consécutif fait avancer le récit. « Alors » exprime naturellement la succession, tandis que « vint » rend simplement le verbe בוא.
- source_word: עֲמָלֵק
  choice: Amalec
  rationale: Forme française traditionnelle et intelligible du nom propre. Ici, le nom désigne collectivement le peuple amalécite.
- source_word: וַיִּלָּחֶם
  choice: combattre
  rationale: Le nifal de לחם signifie ici livrer combat. La construction « vint combattre » est naturelle en français et évite une coordination inutile.
- source_word: עִם
  choice: Israël comme complément direct de « combattre »
  rationale: La préposition signifie littéralement « avec », mais, dans un contexte de combat, elle marque la partie adverse. En français, « combattre Israël » exprime clairement ce rapport sans imposer l’ambiguïté moderne de « combattre avec Israël », qui pourrait signifier combattre à ses côtés.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française usuelle du nom du peuple.
- source_word: בִּרְפִידִם
  choice: à Rephidim
  rationale: La préposition ב indique ici le lieu. « À » convient naturellement à un campement ou à un site.
