base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/003.yaml
  text: And there the people thirsted for water, and the people grumbled against Moses and said, “Why is this—that you brought us up from Egypt to kill me and my children and my livestock with thirst?”
translation:
  language: fr
  text: 'Là, le peuple eut soif, faute d’eau. Le peuple protesta contre Moïse et dit : « Pourquoi donc nous as-tu fait monter d’Égypte pour me faire mourir de soif, avec mes enfants et mes troupeaux ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְמָא ... לַמַּיִם
  choice: eut soif, faute d’eau
  rationale: Exprime naturellement en français le manque d’eau indiqué par la construction hébraïque, sans réduire la soif à un simple désir.
- source_word: וַיָּלֶן ... עַל־מֹשֶׁה
  choice: se mit à protester contre Moïse
  rationale: Le verbe לון décrit ici une plainte hostile dirigée contre Moïse ; « protester » est courant et conserve cette force.
- source_word: הֶעֱלִיתָנוּ מִמִּצְרַיִם
  choice: nous as-tu fait monter d’Égypte
  rationale: Conserve l’image géographique et narrative récurrente de la montée hors d’Égypte.
- source_word: מִקְנַי
  choice: mes troupeaux
  rationale: Dans ce contexte, le nom collectif désigne le bétail possédé ; « troupeaux » est naturel en français.
- source_word: בַּצָּמָא
  choice: de soif
  rationale: La préposition marque ici la cause ou le moyen de la mort ; l’expression française idiomatique est « mourir de soif ».
theological_decisions:
- issue: Passage du collectif « le peuple » au singulier « me / mes » dans la parole
  choice: Conserver « me », « mes enfants » et « mes troupeaux »
  alternative: 'Harmoniser au pluriel : « nous, nos enfants et nos troupeaux »'
  rationale: Le texte hébreu présente réellement ce changement de nombre. Le conserver respecte sa forme rhétorique et évite une harmonisation non nécessaire.
- issue: Valeur de לָמָּה זֶּה suivi d’un accompli
  choice: « Pourquoi nous as-tu fait monter d’Égypte ? Est-ce pour… ? »
  alternative: « Pourquoi est-ce que tu nous as fait monter d’Égypte pour… ? »
  rationale: Cette formulation française restitue l’accusation et la finalité imputée à Moïse, tout en évitant le calque peu naturel « Pourquoi ceci — que… ».
translation_notes:
  register: Français international moderne, narratif et digne. La répétition hébraïque de « le peuple » est légèrement allégée par un pronom, tandis que le changement intentionnel du pluriel collectif au singulier représentatif est préservé.
