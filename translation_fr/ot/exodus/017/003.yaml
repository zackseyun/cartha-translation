  naturalness: Le français est clair et moderne. « Eut soif, faute d’eau » est naturel, bien que « faute d’eau » explicite le rapport exprimé par לַמַּיִם. Une formulation plus directe de la plainte est à la fois plus idiomatique et plus proche de la syntaxe source.
  terminology: « Moïse », « faire monter d’Égypte », « enfants » et « troupeaux » conviennent. « Protesta contre » rend ici correctement la plainte hostile dirigée contre Moïse, sans l’aspect ajouté de « se mit à ».
