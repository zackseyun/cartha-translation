  text: הִנְ/נִ֣י עֹמֵד֩ לְ/פָנֶ֨י/ךָ שָּׁ֥ם עַֽל הַ/צּוּר֮ בְּ/חֹרֵב֒ וְ/הִכִּ֣יתָ בַ/צּ֗וּר וְ/יָצְא֥וּ מִמֶּ֛/נּוּ מַ֖יִם וְ/שָׁתָ֣ה הָ/עָ֑ם וַ/יַּ֤עַשׂ כֵּן֙ מֹשֶׁ֔ה לְ/עֵינֵ֖י זִקְנֵ֥י יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/006.yaml
  text: Behold[a], I will stand before you there on the rock at Horeb, and you shall strike the rock, and water will come out from it, and the people will drink. And Moses did so in the sight of the elders of Israel.
translation:
  language: fr
  text: 'Voici, je me tiendrai là devant toi, sur le rocher à Horeb[a]. Tu frapperas le rocher : de l’eau en sortira, et le peuple boira. Moïse fit ainsi sous les yeux des anciens d’Israël.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Voici, je me tiens là devant toi, sur le rocher à Horeb. » Le participe hébreu peut s’entendre au présent.'
    reason: alternative lexicale et aspectuelle
lexical_decisions:
- source_word: הִנְנִי
  choice: Voici que je
  rationale: « Voici que » attire solennellement l’attention sur la déclaration divine tout en restant naturel en français moderne.
- source_word: עֹמֵד
  choice: me tiendrai
  rationale: Le participe décrit l’action de se tenir debout ou de se trouver en un lieu. Dans la suite prospective des instructions, le futur exprime naturellement l’action imminente, sans effacer la possibilité d’une lecture au présent, signalée en note.
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: Équivalent direct et idiomatique qui indique la position de Dieu par rapport à Moïse.
- source_word: עַל הַצּוּר
  choice: sur le rocher
  rationale: La préposition et le nom désignent naturellement une position sur le rocher; cette traduction conserve l’image frappante du texte.
- source_word: בְּחֹרֵב
  choice: à Horeb
  rationale: « À » est la préposition française usuelle devant ce nom de lieu.
- source_word: וְהִכִּיתָ בַצּוּר
  choice: Tu frapperas le rocher
  rationale: Le futur français peut porter ici la valeur directive de la forme hébraïque, dans un registre biblique digne mais intelligible.
- source_word: וְיָצְאוּ מִמֶּנּוּ מַיִם
  choice: de l’eau en sortira
  rationale: Cette formulation restitue directement le mouvement hors du rocher sans ajouter l’idée plus précise de jaillissement ou d’écoulement.
- source_word: וְשָׁתָה הָעָם
  choice: et le peuple boira
  rationale: 'Le futur conserve la progression simple du résultat annoncé: l’eau sort, puis le peuple boit.'
- source_word: וַיַּעַשׂ כֵּן
  choice: Moïse fit ainsi
  rationale: Formule française concise et soutenue correspondant au résumé narratif hébreu.
- source_word: לְעֵינֵי
  choice: sous les yeux de
  rationale: Expression idiomatique qui maintient l’idée de visibilité et de témoignage public.
theological_decisions:
- issue: Valeur temporelle du participe divin עֹמֵד
  choice: je me tiendrai
  alternative: je me tiens
  rationale: Le contexte d’instructions et d’actions imminentes favorise le futur en français, mais le participe hébreu permet aussi une compréhension présente; la note conserve cette ambiguïté.
- issue: Lien syntaxique de « sur le rocher »
  choice: Dieu se tiendra devant Moïse, sur le rocher à Horeb
  alternative: Dieu se tiendra devant Moïse, près du rocher à Horeb
  rationale: La syntaxe relie le plus naturellement « là, sur le rocher, à Horeb » à la position de Dieu. L’image est conservée sans explication théologique ajoutée.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici que » conserve la solennité de la prise de parole divine; les futurs rendent naturellement la séquence d’instruction et de résultat. La ponctuation par deux-points clarifie le rapport entre le geste commandé et son résultat sans ajouter de causalité étrangère au texte.
