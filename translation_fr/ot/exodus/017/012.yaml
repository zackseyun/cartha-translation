base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/012.yaml
  text: But Moses’ hands were heavy[a], so they took a stone and put it under him, and he sat on it. And Aaron and Hur supported his hands, one on this side and one on that side, so his hands remained steady until the sun set.
translation:
  language: fr
  text: Mais les mains de Moïse étaient lourdes. Alors ils prirent une pierre, la placèrent sous lui, et il s’assit dessus. Aaron et Hour soutinrent ses mains, l’un d’un côté, l’autre de l’autre côté. Ainsi, ses mains restèrent fermes[a] jusqu’au coucher du soleil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « stables » ou « constantes ». Le nom hébreu peut aussi exprimer la fidélité ; ici, il décrit la fermeté physique des mains de Moïse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידֵי מֹשֶׁה כְּבֵדִים
  choice: les mains de Moïse étaient lourdes
  rationale: La formulation conserve l’image concrète de l’hébreu. Dans le contexte, la lourdeur implique la fatigue, sans qu’il soit nécessaire de l’expliciter.
- source_word: וַיִּקְחוּ
  choice: ils prirent
  rationale: Le sujet pluriel reste indéterminé dans l’hébreu; la traduction n’identifie donc pas explicitement Aaron et Hour comme agents.
- source_word: אֶבֶן
  choice: une pierre
  rationale: « Pierre » est le sens courant du nom hébreu et convient à l’objet placé sous Moïse pour lui servir de siège.
- source_word: תָּמְכוּ בְיָדָיו
  choice: soutinrent ses mains
  rationale: Cette traduction rend directement le soutien physique exprimé par le verbe et maintient la répétition de « mains ».
- source_word: מִזֶּה אֶחָד וּמִזֶּה אֶחָד
  choice: l’un d’un côté et l’autre de l’autre
  rationale: Formulation française naturelle qui conserve la disposition distributive d’Aaron et de Hour de part et d’autre de Moïse.
- source_word: וַיְהִי יָדָיו אֱמוּנָה
  choice: ses mains restèrent fermes
  rationale: Dans ce contexte de fatigue et de soutien corporel, אֱמוּנָה décrit la fermeté ou la stabilité des mains. « Restèrent » exprime naturellement la durée du résultat.
- source_word: עַד בֹּא הַשָּׁמֶשׁ
  choice: jusqu’au coucher du soleil
  rationale: Équivalent français idiomatique de la venue ou du déclin du soleil, qui indique clairement le terme de l’action.
theological_decisions:
- issue: Sens de אֱמוּנָה appliqué aux mains de Moïse
  choice: fermeté physique
  alternative: stabilité, constance ou fidélité
  rationale: Le contexte immédiat porte sur la fatigue de Moïse et le soutien physique apporté par Aaron et Hour. « Fermes » convient à la scène tout en laissant une note signaler l’étendue sémantique du nom hébreu, sans introduire ici une abstraction théologique.
translation_notes:
  register: Français international moderne, narratif et digne. Les tournures restent accessibles, sans archaïsmes; « Hour » suit la forme française biblique courante du nom חוּר.
