  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲבֹר֙ לִ/פְנֵ֣י הָ/עָ֔ם וְ/קַ֥ח אִתְּ/ךָ֖ מִ/זִּקְנֵ֣י יִשְׂרָאֵ֑ל וּ/מַטְּ/ךָ֗ אֲשֶׁ֨ר הִכִּ֤יתָ בּ/וֹ֙ אֶת הַ/יְאֹ֔ר קַ֥ח בְּ/יָדְ/ךָ֖ וְ/הָלָֽכְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/005.yaml
  text: Then Yahweh said to Moses[a], “Pass on before the people, and take with you some of the elders of Israel. Take in your hand your staff with which you struck the Nile[b], and go.”
translation:
  language: fr
  text: 'Yahweh dit à Moïse : « Passe devant le peuple et prends avec toi quelques-uns des anciens d’Israël. Prends en main ton bâton, celui avec lequel tu as frappé le Nil[a], et va. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Fleuve » ; dans l’Exode, ce terme désigne généralement le Nil.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: עֲבֹר לִפְנֵי הָעָם
  choice: Passe devant le peuple
  rationale: Cette formulation conserve le mouvement exprimé par עבר et le sens spatial de לִפְנֵי, sans préciser davantage que le texte.
- source_word: וְקַח אִתְּךָ מִזִּקְנֵי יִשְׂרָאֵל
  choice: et prends avec toi quelques-uns des anciens d’Israël
  rationale: 'La préposition מִן a ici une valeur partitive : Moïse doit choisir des anciens au sein du groupe, non nécessairement les prendre tous.'
- source_word: וּמַטְּךָ
  choice: ton bâton
  rationale: « Bâton » est le terme français courant et naturel pour מַטֶּה dans ce contexte.
- source_word: אֲשֶׁר הִכִּיתָ בּוֹ אֶת הַיְאֹר
  choice: celui avec lequel tu as frappé le Nil
  rationale: Le pronom relatif reprend le bâton, בּוֹ exprime l’instrument, et יְאֹר désigne ici le Nil dans le cadre égyptien.
- source_word: קַח בְּיָדְךָ
  choice: Prends en main
  rationale: La répétition de קַח est maintenue et l’expression française rend naturellement l’ordre de saisir le bâton.
- source_word: וְהָלָכְתָּ
  choice: et va
  rationale: La forme poursuit la série d’ordres et se rend naturellement par un impératif en français.
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le passé simple convient au registre narratif biblique français moderne ; la succession narrative est suffisamment portée par le contexte.
theological_decisions:
- issue: Rendu du nom divin YHWH
  choice: Yahweh
  alternative: Jéhovah
  rationale: Cette translittération représente le nom divin du texte hébreu sans le remplacer par le titre « le Seigneur ».
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond au discours direct de Dieu à Moïse. La structure impérative et la répétition de « prends » suivent étroitement l’enchaînement hébreu sans produire une tournure artificielle.
