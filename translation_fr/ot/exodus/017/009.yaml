source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֤ה אֶל יְהוֹשֻׁ֨עַ֙ בְּחַר לָ֣/נוּ אֲנָשִׁ֔ים וְ/צֵ֖א הִלָּחֵ֣ם בַּ/עֲמָלֵ֑ק מָחָ֗ר אָנֹכִ֤י נִצָּב֙ עַל רֹ֣אשׁ הַ/גִּבְעָ֔ה וּ/מַטֵּ֥ה הָ/אֱלֹהִ֖ים בְּ/יָדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/009.yaml
  text: And Moses said to Joshua[a], “Choose men for us and go out; fight against Amalek. Tomorrow I will stand on the top of the hill[b], with the staff of God in my hand.”
translation:
  language: fr
  text: 'Moïse dit à Josué : « Choisis-nous des hommes et va combattre Amalec[a]. Demain, je me tiendrai au sommet de la colline[b], le bâton de Dieu à la main. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « livre bataille à Amalec ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sur la tête de la colline », expression hébraïque signifiant « au sommet de la colline ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le passé simple fait progresser naturellement le récit en français et rend la valeur narrative du wayyiqtol sans surcharger la coordination.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom hébreu.
- source_word: בְּחַר לָנוּ אֲנָשִׁים
  choice: Choisis-nous des hommes
  rationale: Rend directement בחר, le bénéficiaire לָנוּ et אֲנָשִׁים, qui désigne ici vraisemblablement des hommes destinés au combat.
- source_word: וְצֵא הִלָּחֵם בַּעֲמָלֵק
  choice: et va combattre Amalec
  rationale: En français, « va combattre » exprime naturellement le mouvement vers le combat et l'impératif militaire. « Amalec » peut désigner collectivement le peuple ennemi dans ce contexte.
- source_word: מָחָר אָנֹכִי נִצָּב
  choice: Demain, je me tiendrai
  rationale: Le participe נִצָּב reçoit une valeur future du fait de מָחָר ; « je me tiendrai » conserve l'idée de prendre et garder une position.
- source_word: עַל רֹאשׁ הַגִּבְעָה
  choice: au sommet de la colline
  rationale: רֹאשׁ signifie littéralement « tête », mais forme ici une expression spatiale idiomatique désignant le sommet.
- source_word: וּמַטֵּה הָאֱלֹהִים בְּיָדִי
  choice: le bâton de Dieu à la main
  rationale: La proposition nominale finale est rattachée naturellement à la posture de Moïse. « Bâton de Dieu » préserve le syntagme construit, et « à la main » est l'expression française idiomatique correspondant à בְּיָדִי.
theological_decisions:
- issue: Sens de הָאֱלֹהִים dans מַטֵּה הָאֱלֹהִים
  choice: le bâton de Dieu
  alternative: le bâton divin
  rationale: Le génitif explicite respecte la formulation hébraïque et les emplois antérieurs dans l'Exode, sans ajouter d'interprétation sur la nature ou la propriété du bâton.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct reste concis et martial. Les marqueurs de notes sont placés immédiatement après les expressions qu'ils éclairent.
