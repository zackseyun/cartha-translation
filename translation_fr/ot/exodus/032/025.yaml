    issue: Formulation française peu idiomatique et pronom ambigu dans « car Aaron l’avait laissé sans retenue ».
    rationale: Le pronom renvoie vraisemblablement au peuple, mais la construction est moins naturelle que la reprise explicite de « le peuple » et peut momentanément laisser incertaine la relation syntaxique.
  - severity: low
    issue: La note b utilise « lui », alors que le référent est collectivement le peuple.
    rationale: Même si « peuple » est grammaticalement singulier, la formulation explicite « le peuple » évite toute hésitation avec Aaron et reflète mieux le suffixe pluriel hébreu dans son référent collectif.
  revised_text: Quand Moïse vit que le peuple était sans retenue — car Aaron avait laissé le peuple sans retenue[a], l’exposant ainsi au mépris de ses adversaires[b] —
