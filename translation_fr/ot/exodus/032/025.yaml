  source_fidelity: Le rendu saisit correctement la double occurrence de פרע (« sans retenue ») et l’idée d’opprobre devant des adversaires. Toutefois, « l’avait laissé sans retenue » est peu idiomatique en français et rend moins clairement l’idée qu’Aaron a laissé le peuple dans cet état. La formulation révisée conserve la répétition lexicale sans surinterpréter le désordre comme une nudité ou une débauche précises.
  naturalness: « Le peuple était sans retenue » est naturel; répéter le nom dans « Aaron avait laissé le peuple sans retenue » évite le pronom à référent potentiellement flottant et améliore sensiblement la lisibilité. « L’exposant ainsi » exprime de façon fluide le résultat indiqué par לְשִׁמְצָה.
  terminology: « Mépris » rend adéquatement l’opprobre ou la dérision de שִׁמְצָה; la note conserve l’alternative plus imagée de « risée ». « Adversaires » rend bien ceux qui se dressent contre le peuple. Les notes emploient désormais « le peuple » de manière cohérente, sans ambiguïté pronominale.
  issues:
