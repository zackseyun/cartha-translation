  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֤רְא מֹשֶׁה֙ אֶת הָ/עָ֔ם כִּ֥י פָרֻ֖עַ ה֑וּא כִּֽי פְרָעֹ֣/ה אַהֲרֹ֔ן לְ/שִׁמְצָ֖ה בְּ/קָמֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/025.yaml
  text: When Moses saw that the people were out of control—for Aaron had let them get out of control[b][a], for a derision among those who rose against them—
translation:
  language: fr
  text: Quand Moïse vit que le peuple était sans retenue — car Aaron avait laissé le peuple sans retenue[a], l’exposant ainsi au mépris de ses adversaires[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « livré au désordre » ou « déchaîné ». L’hébreu répète la même racine pour décrire l’état du peuple et l’action d’Aaron.
    reason: lexical_alternative
  - marker: b
    text: Ou « faisant du peuple la risée de ceux qui se dressaient contre lui ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Quand Moïse vit
  rationale: Le waw consécutif fait progresser le récit; « Quand » relie naturellement cette constatation à l’action qui suit.
- source_word: הָעָם
  choice: le peuple
  rationale: Le terme désigne ici la communauté d’Israël rassemblée dans le camp.
- source_word: כִּי פָרֻעַ הוּא
  choice: que le peuple était sans retenue
  rationale: La forme issue de פרע décrit un peuple dont les contraintes ont été relâchées, livré au désordre. « Sans retenue » reste naturel sans préciser abusivement la nature de ce désordre.
- source_word: כִּי פְרָעֹה אַהֲרֹן
  choice: car Aaron l’avait laissé sans retenue
  rationale: La répétition de « sans retenue » reproduit autant que possible celle de la racine פרע et attribue à Aaron la responsabilité indiquée par l’hébreu sans suggérer nécessairement une intention délibérée.
- source_word: לְשִׁמְצָה
  choice: l’exposant ainsi au mépris
  rationale: שִׁמְצָה évoque l’opprobre, le mépris ou les railleries. Cette formulation française exprime naturellement le résultat produit aux yeux des adversaires.
- source_word: בְּקָמֵיהֶם
  choice: de ses adversaires
  rationale: Le participe de קום désigne littéralement ceux qui se dressent contre eux; « adversaires » rend clairement ce sens dans le contexte.
theological_decisions:
- issue: Nuance morale et sociale de פרע
  choice: sans retenue / laissé sans retenue
  alternative: livré au désordre; hors de contrôle; dénudé ou exposé
  rationale: Le contexte indique une perte de contrôle et de retenue sous la responsabilité d’Aaron. Traduire par « nu » ou « dénudé » imposerait un sens plus précis que ne l’exige ce verset.
- issue: Portée de לְשִׁמְצָה בְּקָמֵיהֶם
  choice: l’exposant ainsi au mépris de ses adversaires
  alternative: pour être la risée de ceux qui se dressaient contre eux
  rationale: La formulation retenue préserve l’idée d’opprobre devant les ennemis sans trancher entre mépris, raillerie et réputation honteuse; la note conserve l’autre expression possible.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « sans retenue » conserve le jeu lexical hébreu; la phrase demeure suspendue par un tiret final, puisque le verset prépare l’action du verset suivant.
