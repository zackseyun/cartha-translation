  text: וַ/יַּשְׁכִּ֨ימוּ֙ מִֽ/מָּחֳרָ֔ת וַ/יַּעֲל֣וּ עֹלֹ֔ת וַ/יַּגִּ֖שׁוּ שְׁלָמִ֑ים וַ/יֵּ֤שֶׁב הָ/עָם֙ לֶֽ/אֱכֹ֣ל וְ/שָׁת֔וֹ וַ/יָּקֻ֖מוּ לְ/צַחֵֽק׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/006.yaml
  text: And they rose early the next day and offered burnt offerings and brought peace offerings. Then the people sat down to eat and drink[a], and rose up to revel.
translation:
  language: fr
  text: Le lendemain, ils se levèrent de bon matin, offrirent des holocaustes et présentèrent des sacrifices de paix. Puis le peuple s’assit pour manger et boire, et se leva pour se livrer aux réjouissances.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour jouer » ou « pour faire la fête ». Le verbe hébreu peut désigner le jeu, les célébrations ou des réjouissances débridées ; ici, le contexte suggère une fête désordonnée plutôt qu’un divertissement innocent.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ מִמָּחֳרָת
  choice: Le lendemain, ils se levèrent de bon matin
  rationale: Le hiphil de שׁכם exprime le fait de se lever tôt, et מִמָּחֳרָת situe l’action au jour suivant. Cette formulation française conserve les deux éléments sans archaïsme.
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: offrirent des holocaustes
  rationale: Dans ce contexte sacrificiel, עלה avec עֹלָה désigne l’offrande de sacrifices entièrement consumés. « Holocaustes » est le terme cultuel français établi.
- source_word: וַיַּגִּשׁוּ שְׁלָמִים
  choice: présentèrent des sacrifices de paix
  rationale: נגשׁ signifie ici apporter ou présenter, tandis que שְׁלָמִים désigne une catégorie de sacrifices associée à la paix et à la communion. « Sacrifices de paix » préserve la désignation traditionnelle sans développer une interprétation particulière.
- source_word: וַיֵּשֶׁב הָעָם לֶאֱכֹל וְשָׁתוֹ
  choice: le peuple s’assit pour manger et boire
  rationale: La formulation rend directement la succession narrative et les infinitifs de but ou d’activité, dans un français naturel.
- source_word: וַיָּקֻמוּ לְצַחֵק
  choice: se leva pour se livrer aux réjouissances
  rationale: צחק possède ici une gamme de sens allant de jouer ou rire à festoyer avec excès. Dans le contexte du veau d’or, « se livrer aux réjouissances » suggère une fête débridée sans introduire explicitement une conduite sexuelle que le verset seul n’impose pas.
theological_decisions:
- issue: Nuance de לְצַחֵק dans l’épisode du veau d’or
  choice: se livrer aux réjouissances
  alternative: jouer ; faire la fête
  rationale: Le contexte idolâtre, le repas sacrificiel et le jugement qui suit donnent probablement au verbe une portée plus négative qu’un simple jeu. La traduction retenue conserve cette tension morale tout en évitant de préciser abusivement la nature des actes.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire sacrificiel traditionnel (« holocaustes », « sacrifices de paix ») est conservé pour la précision et la continuité terminologique. Le marqueur de note est placé sur l’expression ambiguë qu’il explique.
