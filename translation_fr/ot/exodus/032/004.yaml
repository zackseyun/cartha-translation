base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/004.yaml
  text: And he took it from their hands and fashioned it with a graving tool[a], and he made it into a cast calf. Then they said, “These are your gods, Israel[d][c][b], who brought you up from the land of Egypt.”
translation:
  language: fr
  text: 'Il le prit de leurs mains, le façonna avec un outil à graver[a] et en fit un veau coulé en métal. Puis ils dirent[b] : « Voici tes dieux[c], Israël, qui t’ont fait monter du pays d’Égypte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec un burin », « avec un stylet » ou « avec un ciseau » ; le sens exact du terme hébreu est discuté.
    reason: lexical_alternative
  - marker: b
    text: Certaines traditions textuelles anciennes portent « il dit » au lieu de « ils dirent ».
    reason: textual_variant
  - marker: c
    text: L’hébreu porte littéralement « Voici tes dieux ». La traduction traditionnelle « Voici ton dieu » tient probablement compte du fait qu’il n’y a qu’un seul veau.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח מִיָּדָם
  choice: Il le prit de leurs mains
  rationale: Le verbe לָקַח signifie ici « prendre » ou « recevoir ». Le pronom reprend l’or remis au verset précédent, tandis que « de leurs mains » suit la formulation hébraïque.
- source_word: וַיָּצַר אֹתוֹ בַּחֶרֶט
  choice: le façonna avec un outil à graver
  rationale: יָצַר exprime l’action délibérée de façonner. Le sens précis de חֶרֶט est discuté; « outil à graver » conserve l’idée d’un instrument artisanal sans identifier abusivement un outil moderne précis.
- source_word: עֵגֶל מַסֵּכָה
  choice: un veau de métal coulé
  rationale: עֵגֶל désigne un veau et מַסֵּכָה une représentation obtenue par fonte ou coulage. Cette formulation est naturelle en français et conserve le procédé de fabrication.
- source_word: וַיֹּאמְרוּ
  choice: ils dirent
  rationale: Le texte massorétique porte sans ambiguïté une forme verbale plurielle. La variante au singulier est signalée en note.
- source_word: אֵלֶּה אֱלֹהֶיךָ
  choice: Voici tes dieux
  rationale: Le démonstratif אֵלֶּה et la forme אֱלֹהֶיךָ sont morphologiquement pluriels. Le français maintient ce pluriel malgré la présence d’une seule statue.
- source_word: אֲשֶׁר הֶעֱלוּךָ מֵאֶרֶץ מִצְרָיִם
  choice: qui t’ont fait monter du pays d’Égypte
  rationale: Le causatif de עָלָה signifie littéralement « faire monter ». La traduction garde cet idiome biblique et le pluriel verbal correspondant à « dieux ».
theological_decisions:
- issue: Pluriel ou singulier dans l’acclamation adressée à Israël
  choice: « Voici tes dieux, Israël »
  alternative: « Voici ton dieu, Israël »
  rationale: Les formes du texte massorétique sont plurielles. Les conserver évite d’harmoniser le texte avec l’unique veau et maintient la tension rhétorique du passage.
- issue: Responsabilité d’Aaron dans la fabrication
  choice: Attribuer directement à Aaron les actions de prendre, façonner et faire
  alternative: Présenter Aaron comme simple receveur de l’or ou surveillant du travail
  rationale: Les verbes hébreux ont tous le même sujet masculin singulier et lui attribuent directement la fabrication; la traduction ne doit pas atténuer cette responsabilité.
translation_notes:
  register: Français international moderne, sobre et narratif. La formulation conserve l’enchaînement des actions et la responsabilité directe d’Aaron, tout en employant un vocabulaire artisanal compréhensible. Le pluriel surprenant de l’acclamation est maintenu plutôt que résolu.
