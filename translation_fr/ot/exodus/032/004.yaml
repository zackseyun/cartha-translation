  to: 'Il le prit de leurs mains, le façonna avec un outil à graver[a] et en fit un veau coulé en métal. Puis ils dirent[b] : « Voici tes dieux[c], Israël, qui t’ont fait monter du pays d’Égypte. »'
  rationale: La seule modification remplace une tournure française moins naturelle par « un veau coulé en métal ». Elle ne modifie ni la fabrication attribuée à Aaron, ni le caractère coulé de l’image, ni la syntaxe séquentielle du texte hébreu. Le déplacement de l’ancre [c] la rattache directement à l’expression plurielle qu’elle explique.
