  yaml_path: translation/ot/exodus/032/029.yaml
  text: And Moses said, “Today ordain yourselves to the LORD, for each man has been against his son and against his brother, so that he may bestow a blessing on you today.”
translation:
  language: fr
  text: 'Moïse dit : « Consacrez-vous aujourd’hui au SEIGNEUR[a], car chacun s’est opposé à son fils et à son frère[b], afin qu’il vous accorde aujourd’hui une bénédiction. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Remplissez aujourd’hui vos mains pour le SEIGNEUR », expression hébraïque désignant une consécration ou une investiture.'
    reason: Signaler l’idiome concret et le caractère actif de l’impératif sous-jacent à la traduction fonctionnelle.
  - marker: b
    text: 'L’hébreu est elliptique : « car chacun [est] contre son fils et contre son frère ». Le contexte évoque une action contre des proches, sans exprimer ici le verbe.'
    reason: Préserver l’ellipse grammaticale et éviter d’imposer dans le texte principal un acte précis absent de cette proposition.
lexical_decisions:
- source_word: מִלְאוּ יֶדְכֶם
  choice: Recevez … l’investiture
  rationale: L’expression hébraïque signifie littéralement « remplissez votre main » et sert ici de formule d’installation ou de consécration. « Recevez l’investiture » rend l’idiome en français actuel sans effacer sa portée cultuelle.
- source_word: לַיהוָה
  choice: pour le SEIGNEUR
  rationale: La préposition marque ici la destination ou l’appartenance de l’investiture. Le tétragramme est rendu conformément à l’usage français largement reconnu par « le SEIGNEUR ».
- source_word: בְּרָכָה
  choice: une bénédiction
  rationale: Le substantif désigne une faveur ou bénédiction accordée; le français conserve ici le vocabulaire théologique général du texte.
theological_decisions:
- issue: Lien entre l’investiture et l’action contre les proches
  choice: chacun au prix de son fils ou de son frère
  alternative: car chacun s’est dressé contre son fils et contre son frère
  rationale: La proposition hébraïque est elliptique et ne contient aucun verbe exprimé. La formulation retenue garde le coût familial indiqué par le contexte sans ajouter explicitement « tuer » ni transformer l’ellipse en affirmation plus précise que la source.
- issue: Sujet implicite de « accorde »
  choice: il
  alternative: le SEIGNEUR
  rationale: L’hébreu ne répète pas le sujet. Le pronom renvoie naturellement au SEIGNEUR tout en conservant la forme implicite du texte.
translation_notes:
  register: Français international, actuel et digne. « Recevez l’investiture » est plus naturel que le calque « remplissez vos mains » et plus précis ici que le seul « consacrez-vous ». La phrase garde la solennité du discours direct et évite d’expliciter davantage que l’hébreu la violence envers les proches.
