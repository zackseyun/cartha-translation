source:
  edition: WLC
  text: וַ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל הָ/עָ֔ם אַתֶּ֥ם חֲטָאתֶ֖ם חֲטָאָ֣ה גְדֹלָ֑ה וְ/עַתָּה֙ אֶֽעֱלֶ֣ה אֶל יְהוָ֔ה אוּלַ֥י אֲכַפְּרָ֖ה בְּעַ֥ד חַטַּאתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/030.yaml
  text: And it happened on the next day that Moses said to the people[a], “You have sinned a great sin. And now I will go up to Yahweh; perhaps I can make atonement for your sin.”
translation:
  language: fr
  text: 'Le lendemain, Moïse dit au peuple : « Vous avez commis un grand péché[a]. Maintenant, je vais monter vers Yahweh ; peut-être pourrai-je faire l’expiation pour votre péché. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Vous avez péché un grand péché », tournure qui souligne la gravité de la faute.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Le lendemain
  rationale: Cette formulation française naturelle exprime la succession narrative et le jour qui suit les événements précédents, sans reproduire lourdement la formule hébraïque d’introduction.
- source_word: וַיֹּאמֶר מֹשֶׁה אֶל הָעָם
  choice: Moïse dit au peuple
  rationale: אמר avec אֶל désigne ici une parole adressée à un groupe ; « dit au peuple » est direct et idiomatique.
- source_word: אַתֶּם חֲטָאתֶם חֲטָאָה גְדֹלָה
  choice: Vous avez commis un grand péché
  rationale: Le pronom initial « Vous » conserve l’accent porté sur les destinataires. « Commettre un péché » est naturel en français, tandis que « grand péché » maintient la gravité et la portée théologique de l’expression apparentée hébraïque.
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Marque clairement le passage du constat de la faute à l’action que Moïse envisage.
- source_word: אֶעֱלֶה אֶל יְהוָה
  choice: je vais monter vers Yahweh
  rationale: עלה décrit la montée de Moïse vers la présence de Dieu sur la montagne. Le futur proche convient naturellement à une intention immédiate.
- source_word: אוּלַי
  choice: peut-être
  rationale: Préserve explicitement l’incertitude et l’espoir liés au résultat de l’intercession.
- source_word: אֲכַפְּרָה
  choice: pourrai-je faire l’expiation
  rationale: Le piel de כפר désigne ici l’action de faire l’expiation. Associé à « peut-être », le verbe au conditionnement potentiel évite de présenter le résultat comme certain.
- source_word: בְּעַד חַטַּאתְכֶם
  choice: pour votre péché
  rationale: בְּעַד exprime ici l’intervention en faveur d’autrui ; la formulation concise « pour votre péché » est claire dans ce contexte.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom personnel de Dieu plutôt que de lui substituer un titre.
- issue: Portée de la déclaration de Moïse au sujet de l’expiation
  choice: peut-être pourrai-je faire l’expiation pour votre péché
  alternative: peut-être obtiendrai-je l’expiation de votre péché
  rationale: La formulation retenue conserve à la fois le sens actif du verbe hébreu et l’incertitude introduite par אוּלַי, sans garantir l’efficacité de l’intercession de Moïse ni résoudre la tension théologique du passage.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe demeure fluide à l’oral comme à l’écrit ; le terme théologique « expiation » est conservé parce qu’il correspond précisément au contexte intercessif et cultuel.
