  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ אַהֲרֹ֔ן פָּֽרְקוּ֙ נִזְמֵ֣י הַ/זָּהָ֔ב אֲשֶׁר֙ בְּ/אָזְנֵ֣י נְשֵׁי/כֶ֔ם בְּנֵי/כֶ֖ם וּ/בְנֹתֵי/כֶ֑ם וְ/הָבִ֖יאוּ אֵלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/002.yaml
  text: And Aaron said to them[a], “Take off the rings of gold that are in the ears of your wives, your sons, and your daughters, and bring them to me.”
translation:
  language: fr
  text: 'Aaron leur dit[a] : « Enlevez les anneaux d’or qui sont aux oreilles de vos femmes, de vos fils et de vos filles, et apportez-les-moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Arrachez les anneaux d’or… » Le verbe hébreu peut évoquer le fait d’ôter ou de détacher les bijoux avec force.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם אַהֲרֹן
  choice: Aaron leur dit
  rationale: Le waw consécutif fait avancer le récit; en français, l’enchaînement se rend naturellement sans ajouter nécessairement « et ». Le pronom explicite אֲלֵהֶם est conservé par « leur ».
- source_word: פָּרְקוּ
  choice: Enlevez
  rationale: Le verbe peut exprimer une action énergique, comme arracher ou détacher, mais il désigne ici le retrait de bijoux portés aux oreilles. « Enlevez » est clair et naturel; la nuance plus forte est conservée en note.
- source_word: נִזְמֵי הַזָּהָב
  choice: les anneaux d’or
  rationale: נֶזֶם désigne un anneau pouvant être porté au nez ou à l’oreille. Puisque la suite précise qu’ils sont aux oreilles, « anneaux » évite une redondance et préserve la portée du nom.
- source_word: אֲשֶׁר בְּאָזְנֵי
  choice: qui sont aux oreilles de
  rationale: Cette formulation rend directement la localisation indiquée par בְּ tout en restant idiomatique en français.
- source_word: נְשֵׁיכֶם
  choice: vos femmes
  rationale: Dans ce contexte familial, le terme désigne vraisemblablement les épouses. « Vos femmes » est une formulation française courante qui conserve cette relation.
- source_word: בְּנֵיכֶם וּבְנֹתֵיכֶם
  choice: vos fils et vos filles
  rationale: La traduction maintient les deux catégories familiales explicitement nommées en hébreu.
- source_word: וְהָבִיאוּ אֵלָי
  choice: et apportez-les-moi
  rationale: L’impératif et le complément directionnel sont rendus directement; « les » reprend clairement les anneaux.
