  yaml_path: translation/ot/exodus/032/033.yaml
  text: And Yahweh said to Moses[a], “Whoever has sinned against me[b], I will blot him out of my book.”
translation:
  language: fr
  text: 'Alors Yahweh dit à Moïse : « Celui qui a péché contre moi, je l’effacerai de mon livre.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « mon livre » peut désigner le registre de Dieu où figurent ceux qui sont sous sa garde ; certains y voient plus précisément « le livre de vie ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait avancer le récit. « Alors » exprime naturellement cette progression en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel au lieu de lui substituer un titre.
- source_word: אֶל מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל introduit ici le destinataire de la parole, et « Moïse » est la forme française usuelle du nom.
- source_word: מִי אֲשֶׁר
  choice: Celui qui
  rationale: La tournure introduit une relative indéfinie. « Celui qui » est naturel en français et permet de conserver le singulier représentatif du texte hébreu.
- source_word: חָטָא לִי
  choice: a péché contre moi
  rationale: Avec לִי, le péché est présenté comme dirigé contre Dieu. Le passé composé convient à la faute accomplie dans ce contexte.
- source_word: אֶמְחֶנּוּ
  choice: c’est lui que j’effacerai
  rationale: מחה désigne ici l’effacement d’une personne d’un registre. La dislocation emphatique rend clairement la reprise masculine singulière de « celui qui ».
- source_word: מִסִּפְרִי
  choice: de mon livre
  rationale: סֵפֶר signifie « livre » ou « registre »; « mon livre » conserve la métaphore sans préciser indûment la nature du document.
theological_decisions:
- issue: Nature de « mon livre »
  choice: Conserver la formulation non précisée « mon livre ».
  alternative: « le livre de vie », « le registre des vivants » ou « le registre de l’alliance »
  rationale: L’hébreu dit seulement « mon livre ». La traduction préserve donc l’ambiguïté et la tension théologique sans imposer une interprétation particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe emphatique « c’est lui que » reflète le contraste entre l’offre de Moïse au verset précédent et la responsabilité de celui qui a péché.
