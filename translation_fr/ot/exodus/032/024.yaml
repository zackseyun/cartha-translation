  naturalness: Le français est moderne, clair et d’un registre biblique sobre. « Que tous ceux qui ont de l’or l’enlèvent » est une formulation légèrement soutenue mais naturelle et appropriée au discours rapporté. « Je l’ai jeté au feu » et « ce veau en est sorti » sont idiomatiques.
