  text: וָ/אֹמַ֤ר לָ/הֶם֙ לְ/מִ֣י זָהָ֔ב הִתְפָּרָ֖קוּ וַ/יִּתְּנוּ לִ֑/י וָ/אַשְׁלִכֵ֣/הוּ בָ/אֵ֔שׁ וַ/יֵּצֵ֖א הָ/עֵ֥גֶל הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/024.yaml
  text: And I said to them[a], ‘Whoever has gold, take it off.’ So they gave it to me, and I threw it into the fire, and this calf came out.
translation:
  language: fr
  text: 'Je leur ai dit[a] : « Que tous ceux qui ont de l’or l’enlèvent. » Ils me l’ont donné ; je l’ai jeté au feu, et ce veau en est sorti.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Je leur ai dit : “Qui a de l’or ? Enlevez-le.” » L’hébreu dit littéralement : « À qui de l’or ? Défaites-vous-en. »'
    reason: Alternative lexicale et syntaxique pour לְמִי זָהָב הִתְפָּרָקוּ.
lexical_decisions:
- source_word: וָאֹמַר
  choice: Je leur ai dit
  rationale: Le wayyiqtol poursuit le récit et introduit les paroles rapportées d’Aaron. En français, le passé composé convient naturellement au récit oral direct dans ce contexte.
- source_word: לְמִי זָהָב
  choice: Que tous ceux qui ont de l’or
  rationale: L’expression signifie littéralement « à qui [il y a] de l’or ». Cette formulation française rend sa valeur possessive et indéfinie sans imposer une question au texte.
- source_word: הִתְפָּרָקוּ
  choice: l’enlèvent
  rationale: Le hitpael de פרק désigne ici le fait de se défaire des objets d’or portés sur soi. « Enlever » est naturel et laisse l’objet implicite, comme en hébreu.
- source_word: וַיִּתְּנוּ לִי
  choice: Ils me l’ont donné
  rationale: Le pronom singulier reprend collectivement l’or mentionné auparavant. La phrase conserve simplement la progression narrative.
- source_word: וָאַשְׁלִכֵהוּ בָאֵשׁ
  choice: je l’ai jeté au feu
  rationale: שלך signifie jeter ou lancer. « Jeter au feu » est une tournure française idiomatique exprimant le mouvement vers le feu.
- source_word: וַיֵּצֵא
  choice: en est sorti
  rationale: Le verbe signifie « sortir ». Le pronom « en » reprend naturellement le feu en français et préserve la présentation évasive de l’événement.
- source_word: הָעֵגֶל הַזֶּה
  choice: ce veau
  rationale: עגל désigne un veau ou un jeune taureau. « Veau » est précis, courant dans ce récit et n’ajoute pas la notion de métal fondu absente du verset.
theological_decisions:
- issue: Le récit évasif d’Aaron sur l’origine de l’idole
  choice: Rapporter ses paroles sans ajouter de qualificatif interprétatif.
  alternative: Expliciter dans le texte qu’Aaron ment, ironise ou prétend à une apparition miraculeuse.
  rationale: Le verset donne les paroles d’Aaron sans commenter directement leur véracité. La formulation retenue laisse au contexte le soin d’en révéler le caractère évasif.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours d’Aaron reste direct et sobre ; l’ironie narrative n’est ni amplifiée ni supprimée.
