  text: וְ/עַתָּ֖ה אִם תִּשָּׂ֣א חַטָּאתָ֑/ם וְ/אִם אַ֕יִן מְחֵ֣/נִי נָ֔א מִֽ/סִּפְרְ/ךָ֖ אֲשֶׁ֥ר כָּתָֽבְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/032.yaml
  text: But now[a], if you will forgive their sin—but if not[b], please blot me out of your book that you have written.
translation:
  language: fr
  text: Mais maintenant, si tu pardonnes leur péché[a]… Sinon, je t’en prie, efface-moi de ton livre, celui que tu as écrit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque signifie littéralement « lever » ou « porter leur péché »; elle peut aussi se traduire par « enlever leur péché » ou « leur pardonner ».
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu ne précise pas la nature de ce « livre »; il peut s’agir d’un registre divin des vivants ou, par extension, du livre de la vie.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mais maintenant
  rationale: Introduit avec urgence la supplication de Moïse et marque, dans le contexte, un tournant contrastif.
- source_word: תִּשָּׂא חַטָּאתָם
  choice: tu pardonnes leur péché
  rationale: L’expression hébraïque emploie littéralement le verbe « lever/porter » avec « péché »; en français courant, « pardonner le péché » en exprime naturellement le sens idiomatique.
- source_word: וְאִם אַיִן
  choice: Sinon
  rationale: Rend de façon concise et naturelle la condition négative elliptique « et si [il n’en est] pas [ainsi] ».
- source_word: מְחֵנִי נָא
  choice: je t’en prie, efface-moi
  rationale: « Effacer » convient à l’image d’un nom retiré d’un livre, tandis que « je t’en prie » restitue la particule de supplication נָא.
- source_word: מִסִּפְרְךָ
  choice: de ton livre
  rationale: סֵפֶר peut désigner un livre, un rouleau ou un registre; « livre » demeure naturel et préserve l’indétermination du référent.
- source_word: אֲשֶׁר כָּתָבְתָּ
  choice: celui que tu as écrit
  rationale: La reprise par « celui » évite en français une ambiguïté momentanée sur l’antécédent et souligne que Dieu lui-même a écrit ce livre.
theological_decisions:
- issue: Nature de « ton livre »
  choice: ton livre
  alternative: ton registre / le livre de la vie
  rationale: L’hébreu ne précise pas la nature exacte de ce livre. La traduction conserve donc cette tension sans l’identifier explicitement au livre de la vie ni à un registre des vivants.
- issue: Interruption de la première condition
  choice: points de suspension après « leur péché »
  alternative: compléter par « pardonne-le » ou « alors… »
  rationale: La proposition hébraïque est laissée en suspens. Les points de suspension préservent cette rupture expressive sans ajouter une conséquence absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au discours direct adressé à Dieu. L’ellipse hébraïque est conservée par des points de suspension, et le référent du « livre » reste volontairement indéterminé.
