base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/035.yaml
  text: Then Yahweh struck the people with a plague because of what they did with the calf that Aaron made[a].
translation:
  language: fr
  text: Alors Yahweh frappa le peuple à cause de ce qu’ils avaient fait avec le veau qu’Aaron avait fabriqué[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Alors Yahweh frappa le peuple d’un fléau à cause de ce qu’ils avaient fait avec le veau qu’Aaron avait fabriqué. » Le verbe hébreu peut désigner le fait de frapper ou d’infliger une atteinte; il ne nomme pas explicitement un fléau dans ce verset.'
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: frappa … d’un fléau
  rationale: Le verbe נָגַף exprime ici une atteinte punitive de la part de Dieu et peut désigner une affliction de type fléau. Cette formulation française rend à la fois l’idée de frapper et la nature probable du jugement, sans affirmer que des personnes sont nécessairement mortes.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La transcription du nom divin préserve le nom personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: הָעָם
  choice: le peuple
  rationale: Le nom collectif désigne ici le peuple d’Israël; « le peuple » est le rendu français naturel.
- source_word: עַל אֲשֶׁר
  choice: à cause de ce que
  rationale: La préposition suivie de la proposition relative a une valeur causale; cette tournure la restitue clairement en français moderne.
- source_word: עָשׂוּ
  choice: ils avaient fait
  rationale: Le verbe עשה peut signifier « faire » ou « fabriquer ». Le sens général « faire » convient ici à la conduite coupable du peuple à l’égard du veau et évite de lui attribuer sans nuance la fabrication matérielle que la proposition suivante rapporte à Aaron.
- source_word: הָעֵגֶל
  choice: le veau
  rationale: Le nom signifie « veau ». Le qualificatif « d’or », vrai dans le contexte, n’est pas exprimé dans ce verset et n’est donc pas ajouté.
- source_word: אֲשֶׁר עָשָׂה אַהֲרֹן
  choice: qu’Aaron avait fabriqué
  rationale: La proposition relative identifie Aaron comme celui qui a fabriqué le veau. Le plus-que-parfait marque naturellement en français l’antériorité de cette fabrication.
theological_decisions:
- issue: Nature du jugement divin exprimé par וַיִּגֹּף
  choice: « frappa le peuple d’un fléau »
  alternative: « frappa le peuple »
  rationale: Le verbe hébreu ne nomme pas séparément l’instrument du jugement, mais son champ sémantique permet une atteinte de type fléau. Le texte principal explicite cette nuance probable, tandis que la note conserve le rendu plus général afin de ne pas effacer l’ambiguïté lexicale.
- issue: Responsabilité respective du peuple et d’Aaron
  choice: « ce qu’ils avaient fait avec le veau qu’Aaron avait fabriqué »
  alternative: « parce qu’ils avaient fabriqué le veau qu’Aaron avait fabriqué »
  rationale: Le pluriel עָשׂוּ attribue au peuple une action coupable liée au veau, tandis que le singulier עָשָׂה attribue explicitement sa fabrication à Aaron. La formulation retenue maintient cette tension sans identifier artificiellement les deux actions.
translation_notes:
  register: Français international moderne, clair et digne. « Fabriquer » distingue naturellement la confection de l’objet de la conduite plus générale du peuple. La répétition de « fait/fabriqué » reflète la structure hébraïque tout en restant idiomatique.
