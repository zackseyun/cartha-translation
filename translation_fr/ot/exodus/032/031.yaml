  text: וַ/יָּ֧שָׁב מֹשֶׁ֛ה אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר אָ֣נָּ֗א חָטָ֞א הָ/עָ֤ם הַ/זֶּה֙ חֲטָאָ֣ה גְדֹלָ֔ה וַ/יַּֽעֲשׂ֥וּ לָ/הֶ֖ם אֱלֹהֵ֥י זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/031.yaml
  text: Then Moses returned to Yahweh and said[a], “Please, this people has sinned a great sin, and they have made gods of gold for themselves.”
translation:
  language: fr
  text: 'Moïse retourna auprès de Yahweh et dit : « Je t’en prie, ce peuple a commis un grand péché : ils se sont fait des dieux en or[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un dieu en or ». L’hébreu porte la forme plurielle « des dieux en or », mais certains la comprennent ici au singulier à cause du contexte plus large, qui parle du veau d’or.
    reason: Alternative lexicale et ambiguïté de nombre dans le contexte.
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: retourna
  rationale: Le verbe שׁוב indique ici que Moïse revient auprès de Yahweh après avoir été avec le peuple. « Retourna » est précis et naturel en français.
- source_word: אֶל יְהוָה
  choice: auprès de Yahweh
  rationale: La préposition אֶל marque la direction du retour, tandis que « auprès de » exprime naturellement le fait de revenir en présence de Yahweh. Le nom divin est translittéré « Yahweh ».
- source_word: אָנָּא
  choice: Je t’en prie
  rationale: La particule exprime une supplication pressante. « Je t’en prie » restitue le ton d’intercession de Moïse dans un français actuel et digne.
- source_word: חָטָא הָעָם הַזֶּה
  choice: ce peuple a commis
  rationale: Le verbe hébreu est au singulier avec le nom collectif « peuple ». « A commis » convient idiomatiquement avec « péché » en français et présente l’acte accompli.
- source_word: חֲטָאָה גְדֹלָה
  choice: un grand péché
  rationale: 'Cette formulation conserve le vocabulaire du péché ainsi que la force de la construction hébraïque apparentée : littéralement, « pécher un grand péché ».'
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: ils se sont fait
  rationale: Le passage soudain au pluriel dans le verbe hébreu est conservé après le collectif singulier « ce peuple ». Le pronom réfléchi rend la nuance de לָהֶם, « pour eux-mêmes ».
- source_word: אֱלֹהֵי זָהָב
  choice: des dieux en or
  rationale: La forme hébraïque est morphologiquement plurielle. « En or » est la manière idiomatique d’indiquer la matière en français, sans effacer l’ambiguïté contextuelle signalée en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom divin personnel plutôt que de le remplacer par un titre.
- issue: Nombre grammatical de אֱלֹהֵי זָהָב
  choice: des dieux en or
  alternative: un dieu en or
  rationale: Le pluriel formel de l’hébreu est maintenu dans le texte principal. Le contexte immédiat du veau d’or peut toutefois conduire à comprendre un référent singulier ; cette possibilité est donc conservée en note sans trancher silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. Le changement du singulier (« ce peuple a commis ») au pluriel (« ils se sont fait ») reflète volontairement celui du texte hébreu. La ponctuation française met en relief l’explication du grand péché sans ajouter de contenu.
