  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּ֞ה לֵ֣ךְ נְחֵ֣ה אֶת הָ/עָ֗ם אֶ֤ל אֲשֶׁר דִּבַּ֨רְתִּי֙ לָ֔/ךְ הִנֵּ֥ה מַלְאָכִ֖/י יֵלֵ֣ךְ לְ/פָנֶ֑י/ךָ וּ/בְ/י֣וֹם פָּקְדִ֔/י וּ/פָקַדְתִּ֥י עֲלֵי/הֶ֖ם חַטָּאתָֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/034.yaml
  text: But now go, lead the people to where I have spoken to you. Look, my angel will go before you; but on the day when I call them to account, I will call them to account for their sin.
translation:
  language: fr
  text: Maintenant, va, conduis le peuple vers le lieu dont je t’ai parlé. Voici, mon ange marchera devant toi. Mais le jour où je leur demanderai des comptes, je leur demanderai des comptes pour leur péché.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Rend naturellement la transition hébraïque; le contraste est suffisamment porté par la nouvelle injonction sans ajouter « mais ».
- source_word: נְחֵה
  choice: conduis
  rationale: Équivalent direct et idiomatique de l’impératif « guider, conduire ».
- source_word: הִנֵּה
  choice: Voici
  rationale: Conserve le marqueur discursif qui attire l’attention, dans un registre biblique encore compréhensible en français moderne.
- source_word: מַלְאָכִי
  choice: mon ange
  rationale: Préserve le sens littéral de « mon messager/ange » et l’ambiguïté liée à l’identité de cet envoyé.
- source_word: יֵלֵךְ לְפָנֶיךָ
  choice: marchera devant toi
  rationale: Expression française naturelle qui conserve l’image spatiale et la fonction de guide.
- source_word: בְּיוֹם פָּקְדִי
  choice: le jour où je leur demanderai des comptes
  rationale: Le verbe פקד désigne ici une intervention de Dieu pour faire rendre compte; cette formulation exprime le jugement sans réduire le terme au seul sens de « punir ».
- source_word: וּפָקַדְתִּי עֲלֵיהֶם חַטָּאתָם
  choice: je leur demanderai des comptes pour leur péché
  rationale: Reproduit la répétition de la racine פקד et rattache explicitement la reddition de comptes à leur péché.
theological_decisions:
- issue: Identité de מַלְאָכִי
  choice: mon ange
  alternative: mon messager
  rationale: « Ange » est le terme français conventionnel tout en laissant ouverte l’identité précise de l’envoyé divin.
- issue: Portée judiciaire de פקד
  choice: demander des comptes
  alternative: punir
  rationale: La formulation retenue maintient la dimension de jugement et de responsabilité sans identifier d’emblée toute intervention judiciaire à l’exécution de la peine.
- issue: Nombre de חַטָּאתָם
  choice: leur péché
  alternative: leurs péchés
  rationale: Le nom hébreu est morphologiquement au singulier avec suffixe pluriel et vise ici la faute collective liée au veau d’or.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition judiciaire de פקד est volontairement conservée. « Voici » maintient la solennité du discours sans archaïsme excessif.
