  text: וַ/יַּֽעֲשׂ֥וּ בְנֵֽי לֵוִ֖י כִּ/דְבַ֣ר מֹשֶׁ֑ה וַ/יִּפֹּ֤ל מִן הָ/עָם֙ בַּ/יּ֣וֹם הַ/ה֔וּא כִּ/שְׁלֹ֥שֶׁת אַלְפֵ֖י אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/028.yaml
  text: And the sons of Levi did according to the word of Moses[a], and about three thousand men from among the people fell that day.
translation:
  language: fr
  text: Les fils de Lévi agirent conformément à la parole de Moïse, et environ trois mille hommes parmi le peuple tombèrent[a] ce jour-là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement « tombèrent », tournure courante pour évoquer le fait de mourir ou d’être abattu. Autre traduction : « furent tués ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: agirent
  rationale: Le verbe עשה a ici le sens général d’agir ou de faire. « Agirent conformément à » rend naturellement la construction hébraïque sans expliciter davantage l’action.
- source_word: בְנֵי לֵוִי
  choice: les fils de Lévi
  rationale: Cette traduction conserve l’expression familiale littérale de l’hébreu. « Les Lévites » serait possible, mais reformulerait légèrement le texte.
- source_word: כִּדְבַר מֹשֶׁה
  choice: conformément à la parole de Moïse
  rationale: « Parole » conserve le terme hébreu דָּבָר, qui désigne ici l’ordre ou l’instruction donnée par Moïse, tandis que « conformément à » en exprime clairement la portée.
- source_word: וַיִּפֹּל
  choice: tombèrent
  rationale: Le verbe hébreu signifie littéralement « tomber » et constitue ici une tournure évoquant la mort. Le conserver préserve la gravité et la formulation du récit sans introduire un verbe plus explicite que celui du texte.
- source_word: מִן הָעָם
  choice: parmi le peuple
  rationale: 'Cette formulation exprime la valeur partitive de מִן : les hommes tombés constituaient une partie du peuple.'
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Expression française naturelle et exacte pour situer l’événement dans le temps.
- source_word: כִּשְׁלֹשֶׁת אַלְפֵי אִישׁ
  choice: environ trois mille hommes
  rationale: Le préfixe כ־ indique une approximation, rendue par « environ ». « Hommes » correspond à אִישׁ dans ce dénombrement.
theological_decisions:
- issue: Formulation des morts dans ce contexte de jugement
  choice: environ trois mille hommes parmi le peuple tombèrent ce jour-là
  alternative: environ trois mille hommes du peuple furent tués ce jour-là
  rationale: L’hébreu emploie « tomber » plutôt qu’un verbe signifiant explicitement « tuer ». La traduction retenue préserve cette formulation et n’explicite pas davantage la cause dans le corps du texte.
translation_notes:
  register: Français international actuel, au registre narratif digne. Le passé simple convient au récit écrit. La formulation reste proche de l’hébreu tout en demeurant claire pour un lectorat général.
