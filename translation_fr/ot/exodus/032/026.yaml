  text: וַ/יַּעֲמֹ֤ד מֹשֶׁה֙ בְּ/שַׁ֣עַר הַֽ/מַּחֲנֶ֔ה וַ/יֹּ֕אמֶר מִ֥י לַ/יהוָ֖ה אֵלָ֑/י וַ/יֵּאָסְפ֥וּ אֵלָ֖י/ו כָּל בְּנֵ֥י לֵוִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/026.yaml
  text: Then Moses stood at the gate of the camp and said[a], “Whoever is for Yahweh[b], come to me.” And all the sons of Levi gathered to him.
translation:
  language: fr
  text: 'Moïse se tint alors à la porte du camp et dit : « Qui est pour Yahweh ? Qu’il vienne à moi ! »[a] Tous les fils de Lévi[b] se rassemblèrent auprès de lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Qui est pour Yahweh ? À moi ! » Le verbe « vienne » est sous-entendu en hébreu.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tous les Lévites ». Littéralement : « tous les fils de Lévi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: se tint
  rationale: Le verbe עמד décrit ici Moïse prenant une position à un endroit précis. « Se tint » est naturel et digne, sans ajouter l’idée militaire que pourrait suggérer « prit position ».
- source_word: בְּשַׁעַר הַמַּחֲנֶה
  choice: à l’entrée du camp
  rationale: שַׁעַר désigne une porte ou un passage d’entrée. Pour un camp, « à l’entrée » donne en français moderne l’image concrète la plus naturelle.
- source_word: מִי לַיהוָה
  choice: Qui est pour Yahweh ?
  rationale: La formulation conserve la question elliptique de l’hébreu et le sens d’adhésion ou de loyauté porté par ל.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: אֵלַי
  choice: Qu’il vienne à moi !
  rationale: L’hébreu dit littéralement « À moi ! ». Le verbe de mouvement implicite est explicité afin que l’appel soit clair et idiomatique en français.
- source_word: וַיֵּאָסְפוּ אֵלָיו
  choice: se rassemblèrent auprès de lui
  rationale: Le niphal de אסף exprime le rassemblement, tandis que אֶל indique le mouvement vers Moïse. « Auprès de lui » rend naturellement le résultat de ce mouvement.
- source_word: כָּל בְּנֵי לֵוִי
  choice: Tous les fils de Lévi
  rationale: Cette traduction conserve l’expression généalogique et tribale explicite de l’hébreu; « tous les Lévites » serait plus fluide, mais moins formellement proche.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin. « Yahweh » préserve ce nom au lieu de le remplacer par un titre.
- issue: Portée de מִי לַיהוָה
  choice: Qui est pour Yahweh ?
  alternative: Qui appartient à Yahweh ?
  rationale: « Être pour » préserve l’ambiguïté entre appartenance, fidélité et prise de parti dans ce contexte de crise, sans réduire la formule à une seule nuance.
- issue: Désignation tribale בְּנֵי לֵוִי
  choice: Tous les fils de Lévi
  alternative: Tous les Lévites
  rationale: La formulation retenue garde le langage masculin de filiation employé par le texte source sans lui imposer une reformulation neutre.
translation_notes:
  register: Français international moderne, sobre et narratif. La question brève suivie de l’appel conserve la vigueur de l’hébreu, tandis que l’explicitation minimale du verbe sous-entendu assure une lecture naturelle.
