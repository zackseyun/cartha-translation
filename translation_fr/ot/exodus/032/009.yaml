  yaml_path: translation/ot/exodus/032/009.yaml
  text: And Yahweh said to Moses[a], “I have seen this people, and behold, it is a stiff-necked people.”
translation:
  language: fr
  text: 'Et Yahweh dit à Moïse : « J’ai vu ce peuple, et voici que c’est un peuple à la nuque raide[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « obstiné ». L’expression hébraïque emploie l’image d’une nuque raide pour évoquer l’obstination ou la résistance.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit directement le nom divin dans une forme française usuelle, au lieu de le remplacer par un titre.
- source_word: וַיֹּאמֶר
  choice: Et … dit
  rationale: Reproduit sobrement l’enchaînement narratif du wayyiqtol, naturel en français biblique moderne.
- source_word: רָאִיתִי
  choice: J’ai vu
  rationale: Le passé composé exprime une observation accomplie dont découle le constat présent.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Conserve le collectif singulier et la nuance de mise à distance portée par le démonstratif.
- source_word: וְהִנֵּה
  choice: c’est vraiment
  rationale: Rend ici la force d’insistance et de constat de הִנֵּה dans un français actuel, sans l’archaïsme de « voici » devant une proposition nominale.
- source_word: קְשֵׁה עֹרֶף
  choice: à la nuque raide
  rationale: Préserve la métaphore hébraïque de l’obstination plutôt que de la réduire directement à son interprétation.
- source_word: הוּא
  choice: c’est
  rationale: La tournure présentative française reprend naturellement le sujet collectif singulier עַם.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; sa translittération préserve le nom propre sans le remplacer par un titre.
- issue: Portée de l’expression קְשֵׁה עֹרֶף
  choice: Conserver l’image « à la nuque raide »
  alternative: « obstiné » ou « rebelle »
  rationale: L’image désigne l’obstination ou la résistance, mais le texte ne précise pas davantage ici ; la conserver évite de résoudre silencieusement sa portée.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste proche de l’hébreu tout en évitant une formulation artificielle ; la métaphore centrale est conservée et expliquée en note.
