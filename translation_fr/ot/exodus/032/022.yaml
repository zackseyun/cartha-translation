  text: וַ/יֹּ֣אמֶר אַהֲרֹ֔ן אַל יִ֥חַר אַ֖ף אֲדֹנִ֑/י אַתָּה֙ יָדַ֣עְתָּ אֶת הָ/עָ֔ם כִּ֥י בְ/רָ֖ע הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/022.yaml
  text: And Aaron said[a], “Do not let my lord’s anger burn hot. You know the people, that they are set on evil.”
translation:
  language: fr
  text: 'Aaron dit : « Que la colère de mon seigneur ne s’enflamme pas ! Tu sais bien que ce peuple est porté au mal[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est enclin au mal » ou « se tourne vers le mal ». L’expression hébraïque est idiomatique et présente le peuple comme caractérisé par le mal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le passé simple convient au récit français et introduit directement la réponse d’Aaron sans préciser davantage la relation temporelle.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: אַל יִחַר אַף
  choice: Que la colère de … ne s’enflamme pas
  rationale: Cette formulation conserve l’image hébraïque de la colère qui brûle tout en restant digne et intelligible en français.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Il s’agit ici d’une adresse respectueuse à Moïse, non d’un titre divin ; la minuscule évite cette confusion.
- source_word: אַתָּה יָדַעְתָּ
  choice: Tu sais bien
  rationale: L’adverbe « bien » rend naturellement l’insistance apportée par le pronom sujet explicite אַתָּה.
- source_word: הָעָם
  choice: ce peuple
  rationale: Le démonstratif est naturel dans cette adresse à Moïse au sujet du peuple présent et reprend correctement le collectif hébreu.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce que Moïse sait.
- source_word: בְרָע הוּא
  choice: est porté au mal
  rationale: L’expression hébraïque est idiomatique et caractérise le peuple collectivement par son inclination au mal, sans préciser si celle-ci est permanente ou seulement manifeste dans la situation.
theological_decisions:
- issue: Sens de אֲדֹנִי dans l’adresse d’Aaron
  choice: mon seigneur
  alternative: mon maître ; seigneur
  rationale: Le destinataire est Moïse. La minuscule et le possessif préservent la déférence humaine sans attribuer à Moïse un titre divin.
- issue: Portée morale de בְרָע הוּא
  choice: est porté au mal
  alternative: est enclin au mal ; se livre au mal
  rationale: La traduction exprime une disposition caractéristique sans transformer la remarque d’Aaron en affirmation doctrinale plus générale sur la nature humaine.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La tournure déférente à la troisième personne (« Que la colère de mon seigneur… ») conserve la solennité de l’adresse hébraïque ; « Tu sais bien » restitue ensuite son passage direct à la deuxième personne.
