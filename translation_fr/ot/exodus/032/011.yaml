  text: וַ/יְחַ֣ל מֹשֶׁ֔ה אֶת פְּנֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו וַ/יֹּ֗אמֶר לָ/מָ֤ה יְהוָה֙ יֶחֱרֶ֤ה אַפְּ/ךָ֙ בְּ/עַמֶּ֔/ךָ אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/כֹ֥חַ גָּד֖וֹל וּ/בְ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/011.yaml
  text: But Moses pleaded with Yahweh his God and said[a], “Why, Yahweh, should your anger burn against your people[b], whom you brought out of the land of Egypt with great power and with a strong hand?”
translation:
  language: fr
  text: 'Mais Moïse supplia[a] Yahweh, son Dieu : « Pourquoi, Yahweh, ta colère s’enflammerait-elle contre ton peuple, que tu as fait sortir du pays d’Égypte avec une grande puissance et une main forte[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « chercha la face de Yahweh » ; expression hébraïque signifiant rechercher sa faveur ou le supplier avec insistance.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « d’une main puissante ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַל אֶת־פְּנֵי
  choice: supplia
  rationale: L’expression hébraïque, littéralement liée au fait de rechercher la face ou la faveur de quelqu’un, désigne ici une supplication pressante. « Supplia » en rend naturellement la force en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהָיו
  choice: son Dieu
  rationale: Le possessif singulier exprime clairement la relation entre Moïse et Dieu dans ce contexte.
- source_word: יֶחֱרֶה אַפְּךָ
  choice: ta colère s’enflammerait-elle
  rationale: Cette formulation conserve l’image hébraïque de la colère qui brûle tout en restant naturelle en français; le conditionnel rend la portée interrogative et persuasive de l’appel.
- source_word: בְּעַמֶּךָ
  choice: contre ton peuple
  rationale: Avec le vocabulaire de la colère, la préposition indique ici la personne contre laquelle elle est dirigée.
- source_word: אֲשֶׁר הוֹצֵאתָ מֵאֶרֶץ מִצְרַיִם
  choice: que tu as fait sortir du pays d’Égypte
  rationale: La formulation préserve l’expression caractéristique de l’Exode ainsi que la mention explicite du pays d’Égypte.
- source_word: בְּכֹחַ גָּדוֹל
  choice: avec une grande puissance
  rationale: La préposition a une valeur instrumentale, et « grande puissance » rend directement l’intensité de l’hébreu.
- source_word: וּבְיָד חֲזָקָה
  choice: et d’une main forte
  rationale: « Main forte » reproduit l’image hébraïque traditionnelle et demeure claire en français moderne.
theological_decisions:
- issue: Langage anthropomorphique de la colère divine
  choice: ta colère s’enflammerait-elle
  alternative: te mettrais-tu en colère
  rationale: Le choix conserve l’image de la chaleur présente dans l’hébreu sans la surlittéraliser ni atténuer la tension du plaidoyer de Moïse.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le nom personnel est conservé de manière transparente, sans le remplacer par un titre.
- issue: Intercession de Moïse auprès de Dieu
  choice: supplia Yahweh
  alternative: chercha à apaiser Yahweh
  rationale: « Supplia » exprime la demande insistante sans décider que l’action de Moïse manipule Dieu ou produit nécessairement un changement en lui.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la cadence solennelle de l’intercession, l’image de la colère qui s’enflamme et celle de la main forte, tout en rendant idiomatiquement l’expression hébraïque concernant la face.
