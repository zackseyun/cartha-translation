base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/016.yaml
  text: The tablets were the work of God[a], and the writing was the writing of God, engraved on the tablets.
translation:
  language: fr
  text: Les tablettes étaient l’œuvre de Dieu[a], et l’écriture était l’écriture de Dieu, gravée sur les tablettes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « l’ouvrage de Dieu… l’inscription de Dieu ». L’hébreu emploie une tournure répétitive : « œuvre de Dieu… écriture de Dieu » ; le terme correspondant à « écriture » apparaît deux fois.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלֻּחֹת
  choice: les tablettes
  rationale: Le nom désigne ici les tablettes de l’alliance. « Tablettes » est naturel en français moderne; la pierre, connue par le contexte, n’est pas explicitement mentionnée dans ce verset.
- source_word: מַעֲשֵׂה אֱלֹהִים
  choice: l’œuvre de Dieu
  rationale: Cette formulation conserve la tournure nominale hébraïque et l’attribution emphatique de l’ouvrage à Dieu.
- source_word: הֵמָּה
  choice: étaient
  rationale: Le pronom indépendant hébreu a une valeur emphatique; en français, la structure copulative exprime naturellement le sens sans ajouter « elles ».
- source_word: הַמִּכְתָּב
  choice: l’écriture
  rationale: Le terme désigne ce qui est écrit ou l’écriture elle-même. Ce choix permet aussi de conserver la répétition du texte hébreu.
- source_word: מִכְתַּב אֱלֹהִים
  choice: l’écriture de Dieu
  rationale: La répétition nominale est maintenue afin de préserver l’insistance rhétorique de l’hébreu et l’attribution directe à Dieu.
- source_word: הוּא
  choice: était
  rationale: Le pronom hébreu est récapitulatif ou emphatique. La copule suffit dans une formulation française idiomatique.
- source_word: חָרוּת
  choice: gravée
  rationale: Le mot indique une écriture incisée. « Gravée » convient précisément à une inscription portée sur des tablettes de pierre.
- source_word: עַל הַלֻּחֹת
  choice: sur les tablettes
  rationale: La préposition a ici son sens locatif direct.
- source_word: וְ
  choice: et
  rationale: La conjonction relie les deux affirmations du verset. La conjonction initiale n’est pas rendue séparément, car le français n’exige pas ici de marqueur discursif ajouté.
theological_decisions:
- issue: L’origine des tablettes et de leur inscription
  choice: Les tablettes elles-mêmes et l’écriture qu’elles portent sont toutes deux présentées comme l’œuvre de Dieu.
  alternative: 'Formulation verbale possible : « les tablettes avaient été faites par Dieu, et l’écriture avait été écrite par Dieu ».'
  rationale: Les expressions nominales de l’hébreu sont conservées plutôt que transformées en verbes passifs. Cela maintient l’attribution emphatique à Dieu sans préciser davantage le mode de son action.
translation_notes:
  register: 'Français international moderne, digne et accessible. La répétition inhabituelle de « l’écriture » est volontaire : elle reproduit l’insistance du texte hébreu plutôt que de la lisser.'
