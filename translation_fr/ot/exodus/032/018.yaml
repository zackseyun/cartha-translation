source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֵ֥ין קוֹל֙ עֲנ֣וֹת גְּבוּרָ֔ה וְ/אֵ֥ין ק֖וֹל עֲנ֣וֹת חֲלוּשָׁ֑ה ק֣וֹל עַנּ֔וֹת אָנֹכִ֖י שֹׁמֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/018.yaml
  text: And he said[a], “It is not the sound of a cry of victory, and it is not the sound of a cry of defeat; I hear the sound of singing.”
translation:
  language: fr
  text: 'Il répondit : « Ce n’est ni le bruit d’un cri de victoire ni le bruit d’un cri de défaite ; c’est le bruit de chants que j’entends[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le bruit de cris que j’entends ». Les formes hébraïques issues de ענה peuvent désigner une réponse vocale, des cris ou, ici, des chants.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il répondit
  rationale: Dans l’échange avec Josué, le verbe narratif introduit la réplique de Moïse ; « répondit » est naturel en français et n’ajoute aucun contenu à ses paroles.
- source_word: קוֹל
  choice: bruit
  rationale: « Bruit » convient au son indistinct provenant du camp et évite de suggérer une voix articulée.
- source_word: עֲנוֹת / עַנּוֹת
  choice: cri / chants
  rationale: Associé à la victoire et à la défaite, le terme désigne naturellement un cri collectif ; dans la dernière proposition, sa forme et le contexte festif permettent de comprendre des chants, tout en conservant l’autre possibilité en note.
- source_word: גְּבוּרָה
  choice: victoire
  rationale: Dans l’opposition de tonalité militaire avec חֲלוּשָׁה, le mot évoque ici le cri des vainqueurs plutôt que la force abstraite.
- source_word: חֲלוּשָׁה
  choice: défaite
  rationale: Bien que lié littéralement à la faiblesse, le terme désigne dans ce contraste le sort des vaincus.
- source_word: אֵין
  choice: ce n’est ni… ni…
  rationale: Cette construction française exprime naturellement les deux négations parallèles de l’hébreu.
- source_word: אָנֹכִי שֹׁמֵעַ
  choice: que j’entends
  rationale: Le présent rend directement la perception actuelle exprimée par le pronom et le participe hébreux.
theological_decisions: []
