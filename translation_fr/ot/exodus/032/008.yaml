  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔/ם עָשׂ֣וּ לָ/הֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה וַ/יִּשְׁתַּֽחֲווּ ל/וֹ֙ וַ/יִּזְבְּחוּ ל֔/וֹ וַ/יֹּ֣אמְר֔וּ אֵ֤לֶּה אֱלֹהֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הֶֽעֱל֖וּ/ךָ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/008.yaml
  text: They have quickly turned aside from the way that I commanded them. They have made for themselves a cast image of a calf[a], and have bowed down to it and sacrificed to it, and said, ‘These are your gods, Israel, who brought you up from the land of Egypt.’
translation:
  language: fr
  text: 'Ils se sont vite détournés du chemin que je leur avais ordonné de suivre. Ils se sont fabriqué un veau en métal fondu, se sont prosternés devant lui et lui ont offert des sacrifices. Ils ont dit : « Voici tes dieux, Israël[a], qui t’ont fait monter du pays d’Égypte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Voici ton dieu, Israël, qui t’a fait monter du pays d’Égypte. » L’hébreu dit littéralement « Voici tes dieux », bien qu’il soit question ici d’un seul veau.
    reason: alternative_reading
lexical_decisions:
- source_word: סָרוּ מַהֵר
  choice: se sont vite détournés
  rationale: Cette formulation exprime une déviation rapide et conserve l’image d’un abandon du chemin prescrit.
- source_word: מִן הַדֶּרֶךְ אֲשֶׁר צִוִּיתִם
  choice: du chemin que je leur avais ordonné de suivre
  rationale: L’ajout idiomatique « de suivre » rend la construction naturelle en français tout en maintenant la métaphore du chemin de l’obéissance.
- source_word: עָשׂוּ לָהֶם
  choice: se sont fabriqué
  rationale: 'Le pronom réfléchi rend la nuance de לָהֶם : ils ont produit cette idole pour eux-mêmes.'
- source_word: עֵגֶל מַסֵּכָה
  choice: un veau en métal fondu
  rationale: מַסֵּכָה désigne un objet métallique obtenu par fonte ou coulage ; cette expression française indique à la fois la forme du veau et son mode de fabrication.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: se sont prosternés devant lui
  rationale: Le choix conserve le geste corporel précis plutôt que de le réduire au terme plus général « adorer ».
- source_word: וַיִּזְבְּחוּ לוֹ
  choice: lui ont offert des sacrifices
  rationale: La formulation rend clairement l’acte cultuel et son destinataire.
- source_word: אֵלֶּה אֱלֹהֶיךָ
  choice: Voici tes dieux
  rationale: Le démonstratif et le nom sont explicitement pluriels en hébreu ; le texte principal préserve cette tension malgré le veau unique.
- source_word: הֶעֱלוּךָ
  choice: t’ont fait monter
  rationale: Le causatif de עלה est conservé, avec son image de montée et ses résonances dans la formule de l’exode.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: du pays d’Égypte
  rationale: Rendu direct et naturel de la provenance exprimée par מִן.
theological_decisions:
- issue: Nombre grammatical dans אֵלֶּה אֱלֹהֶיךָ
  choice: 'Maintenir le pluriel : « Voici tes dieux, Israël »'
  alternative: « Voici ton dieu, Israël »
  rationale: La morphologie hébraïque est nettement plurielle, tandis que le contexte ne mentionne qu’un seul veau. Le texte principal conserve cette tension et la note signale la lecture contextuelle au singulier.
- issue: Portée de וַיִּשְׁתַּחֲווּ
  choice: « se sont prosternés devant lui »
  alternative: « l’ont adoré »
  rationale: Le rendu choisi préserve l’action physique décrite par le verbe et laisse la succession des actes cultuels exprimer elle-même l’idolâtrie.
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé porte le récit accusatoire, tandis que le plus-que-parfait marque naturellement l’antériorité du commandement. « Devant lui » et les pronoms personnels conviennent en français à une représentation animée personnifiée.
