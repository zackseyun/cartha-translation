base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/010.yaml
  text: Now leave me alone[a], so that my anger may burn against them and I may consume them[b]; and I will make you into a great nation.
translation:
  language: fr
  text: Maintenant, laisse-moi tranquille[a], afin que ma colère s’enflamme contre eux et que je les consume[b] ; puis je ferai de toi une grande nation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « laisse-moi ».
    reason: lexical_alternative
  - marker: b
    text: Ou « je les détruis[e] ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Ce marqueur discursif introduit l’ordre immédiat et fait progresser la parole. « Maintenant » est direct et naturel en français moderne.
- source_word: הַנִּיחָה לִּי
  choice: laisse-moi faire
  rationale: Dans cet idiome, le causatif de נוח signifie cesser de retenir ou laisser quelqu’un agir. « Laisse-moi faire » exprime naturellement en français le mouvement implicite vers l’action, sans préciser la nature de l’intervention de Moïse.
- source_word: וְיִחַר אַפִּי
  choice: ma colère s’enflammera
  rationale: L’expression idiomatique décrit littéralement la colère qui brûle. Cette formulation conserve l’image hébraïque, tandis que le futur après l’impératif rend ici la conséquence ou le résultat envisagé.
- source_word: בָהֶם
  choice: contre eux
  rationale: Avec la colère, « contre eux » rend naturellement en français l’orientation hostile indiquée par la préposition hébraïque.
- source_word: וַאֲכַלֵּם
  choice: je les anéantirai
  rationale: Au piel, כלה signifie mener à son terme, exterminer ou anéantir. « Anéantir » communique clairement la menace de destruction totale dans un français actuel et digne.
- source_word: וְאֶעֱשֶׂה אוֹתְךָ לְגוֹי גָּדוֹל
  choice: Puis je ferai de toi une grande nation
  rationale: La construction signifie faire de quelqu’un ce que désigne le complément. « Faire de toi une grande nation » est idiomatique et garde l’écho des promesses patriarcales sans ajout explicatif.
theological_decisions:
- issue: Langage anthropopathique de la colère divine
  choice: Conserver l’image de la colère de Dieu qui s’enflamme.
  alternative: Atténuer l’expression en « je serai en colère contre eux ».
  rationale: L’hébreu emploie une image vive. La conserver respecte la force narrative ainsi que la tension théologique liée à la sainteté et au jugement divins.
- issue: Portée de l’impératif הַנִּיחָה לִּי face à l’intercession de Moïse
  choice: Rendre un ordre véritable, sans expliquer s’il constitue aussi une invitation implicite à intercéder.
  alternative: Traduire de manière à présenter explicitement l’ordre comme une invitation à l’intercession.
  rationale: Le verset formule directement un ordre, une menace de jugement et une promesse. Une lecture rhétorique ou invitationnelle relève de l’interprétation et ne doit pas être intégrée au texte.
- issue: Lien syntaxique après l’impératif
  choice: Employer les deux-points puis des futurs, laissant la colère et l’anéantissement apparaître comme ce qui suivra si Moïse laisse Dieu agir.
  alternative: Employer explicitement « afin que », qui présente le déchaînement de la colère comme le but de l’ordre.
  rationale: Le waw hébreu peut porter une nuance de conséquence ou de finalité. La ponctuation française préserve cette relation sans la réduire à une seule catégorie logique.
translation_notes:
  register: Français international moderne, digne et accessible. « Ma colère s’enflammera » maintient l’image source; « laisse-moi faire » évite le tour plus ambigu en français « laisse-moi » employé seul. Les notes signalent les principales possibilités lexicales sans résoudre les questions d’interprétation.
