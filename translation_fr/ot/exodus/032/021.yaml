    issue: 'Calque peu naturel : « tu aies fait venir sur lui un si grand péché »'
    rationale: La construction reproduit trop directement l’image hébraïque et reste maladroite en français moderne. Elle peut aussi laisser entendre qu’un « péché » est un objet déplacé plutôt que l’acte fautif dans lequel Aaron a impliqué le peuple.
