translation:
  language: fr
  text: 'Moïse dit à Aaron : « Qu’est-ce que ce peuple t’a fait pour que tu l’aies entraîné dans un si grand péché ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol poursuit le récit au passé ; en français, « dit » rend naturellement la forme narrative sans qu’il soit nécessaire d’ajouter « et ».
- source_word: מֶה עָשָׂה לְךָ הָעָם הַזֶּה
  choice: Qu’est-ce que ce peuple t’a fait
  rationale: La tournure française conserve la question, le complément « à toi » porté par « t’ » et le démonstratif הַזֶּה, dont « ce peuple » peut aussi garder la nuance de mise à distance.
- source_word: כִּי
  choice: pour que
  rationale: Dans cette question de reproche, « pour que » exprime naturellement en français le rapport entre ce que le peuple aurait fait à Aaron et l’acte grave qui en aurait résulté, sans affirmer que le peuple en était réellement la cause.
- source_word: הֵבֵאתָ עָלָיו
  choice: tu aies fait venir sur lui
  rationale: Cette formulation conserve le causatif de בוא et l’image de quelque chose amené sur le peuple. Le subjonctif passé convient après la question introduite par « pour que » et présente l’acte comme accompli.
- source_word: עָלָיו
  choice: sur lui
  rationale: Le pronom hébreu est masculin singulier et renvoie collectivement à הָעָם, « le peuple ». Le français permet de conserver exactement ce singulier collectif.
- source_word: חֲטָאָה גְדֹלָה
  choice: un si grand péché
  rationale: « Péché » rend directement חֲטָאָה. Dans le reproche interrogatif, « si grand » traduit avec naturel la force qualitative de גְדֹלָה sans préciser davantage la nature de la culpabilité.
theological_decisions:
- issue: Responsabilité d’Aaron dans le péché du peuple
  choice: Aaron est présenté comme ayant fait venir un grand péché sur le peuple.
  alternative: Aaron a entraîné le peuple dans un grand péché / a fait peser une grande culpabilité sur lui.
  rationale: La formulation retenue maintient l’accusation morale directe du texte tout en évitant de préciser si חֲטָאָה désigne principalement l’acte pécheur, l’état de culpabilité ou ses conséquences.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation garde l’image causative de l’hébreu et son singulier collectif. « Faire venir sur lui » est légèrement solennel, mais reste intelligible et permet de ne pas remplacer l’image du texte par une explication interprétative.
