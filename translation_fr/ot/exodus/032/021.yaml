  rationale: La révision conserve la question, le démonstratif dépréciatif ou distanciant de « ce peuple », la responsabilité directe d’Aaron et la gravité du péché. « L’avoir entraîné dans un si grand péché » est une équivalence contextuelle française naturelle de l’accusation selon laquelle Aaron a fait venir un grand péché sur le peuple, sans trancher davantage la nature précise de la culpabilité.
