base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/007.yaml
  text: Then Yahweh said to Moses[a], “Go down, because your people, whom you brought up from the land of Egypt, have corrupted themselves.”
translation:
  language: fr
  text: 'Alors Yahweh dit à Moïse : « Va, descends, car ton peuple, que tu as fait monter du pays d’Égypte, s’est corrompu[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a agi de manière corrompue ». Le verbe hébreu peut souligner soit la corruption qui en résulte, soit la conduite corrompue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Alors … dit
  rationale: Le waw consécutif fait avancer le récit. « Alors » marque naturellement la succession, et « dit » convient à l’introduction d’un discours direct en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: לֶךְ רֵד
  choice: Va, descends
  rationale: Les deux impératifs hébreux sont conservés. « Va, descends » restitue leur forme et l’urgence de l’ordre sans les réduire à un seul verbe.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le motif de l’ordre. « Car » est clair, naturel et digne dans ce discours.
- source_word: שִׁחֵת
  choice: s’est corrompu
  rationale: Dans ce contexte, le verbe exprime la corruption morale coupable du peuple. Le pronominal français traduit naturellement la portée résultative ou réflexive possible.
- source_word: עַמְּךָ
  choice: ton peuple
  rationale: Le nom collectif signifie « peuple ». Le possessif adressé à Moïse est conservé, car il participe à la force rhétorique du reproche.
- source_word: אֲשֶׁר הֶעֱלֵיתָ
  choice: que tu as fait monter
  rationale: La formulation causative rend précisément le hifil de עלה et maintient l’image géographique et narrative de la montée hors d’Égypte.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: du pays d’Égypte
  rationale: Cette expression reflète pleinement l’hébreu tout en étant idiomatique en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Portée de שִׁחֵת
  choice: s’est corrompu
  alternative: a agi de manière corrompue
  rationale: Le choix principal conserve la force de dégradation morale et la responsabilité du peuple. Une note maintient l’autre analyse possible, centrée sur sa conduite corrompue.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe de Yahweh à Moïse. La ponctuation conserve l’enchaînement énergique des deux impératifs.
