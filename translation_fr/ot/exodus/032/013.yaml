source:
  edition: WLC
  text: זְכֹ֡ר לְ/אַבְרָהָם֩ לְ/יִצְחָ֨ק וּ/לְ/יִשְׂרָאֵ֜ל עֲבָדֶ֗י/ךָ אֲשֶׁ֨ר נִשְׁבַּ֣עְתָּ לָ/הֶם֮ בָּ/ךְ֒ וַ/תְּדַבֵּ֣ר אֲלֵ/הֶ֔ם אַרְבֶּה֙ אֶֽת זַרְעֲ/כֶ֔ם כְּ/כוֹכְבֵ֖י הַ/שָּׁמָ֑יִם וְ/כָל הָ/אָ֨רֶץ הַ/זֹּ֜את אֲשֶׁ֣ר אָמַ֗רְתִּי אֶתֵּן֙ לְ/זַרְעֲ/כֶ֔ם וְ/נָחֲל֖וּ לְ/עֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/013.yaml
  text: Remember Abraham[a], Isaac, and Israel, your servants, to whom you swore by yourself and said to them, ‘I will multiply your offspring like the stars of the heavens, and all this land that I have spoken of I will give to your offspring, and they shall inherit it forever.’
translation:
  language: fr
  text: 'Souviens-toi d’Abraham, d’Isaac et d’Israël[a], tes serviteurs, à qui tu as juré par toi-même et à qui tu as dit : « Je rendrai vos descendants aussi nombreux que les étoiles du ciel. Tout ce pays dont j’ai parlé, je le donnerai à vos descendants, et ils en hériteront pour toujours. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Israël est le nom donné au patriarche Jacob. Le texte hébreu porte ici « Israël ».
    reason: Identification du personnage et préservation du nom explicitement attesté dans le texte source.
lexical_decisions:
- source_word: זְכֹר
  choice: Souviens-toi
  rationale: L’impératif s’adresse à Dieu dans l’intercession de Moïse. « Souviens-toi » est l’équivalent français naturel et conserve l’appel à la fidélité de l’alliance sans l’expliciter davantage.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיִשְׂרָאֵל
  choice: d’Abraham, d’Isaac et d’Israël
  rationale: Le texte hébreu nomme explicitement Israël, et non Jacob. Le maintien de ce nom préserve la résonance liée au nom reçu par le patriarche.
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Dans ce contexte, עבד désigne les patriarches dans leur relation de service envers Dieu, non leur condition sociale d’esclaves.
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ לָהֶם בָּךְ
  choice: à qui tu as juré par toi-même
  rationale: La formulation rend l’idée que Dieu lui-même est la garantie de son serment et conserve la force réfléchie de בָּךְ.
- source_word: וַתְּדַבֵּר אֲלֵהֶם
  choice: et à qui tu as dit
  rationale: « Dire » introduit naturellement une citation directe en français. La répétition de « à qui » clarifie le rattachement aux patriarches.
- source_word: אַרְבֶּה אֶת זַרְעֲכֶם
  choice: Je rendrai vos descendants aussi nombreux
  rationale: Le hiphil de רבה exprime ici l’accroissement numérique. « Descendants » communique clairement le sens collectif de זרע et s’accorde avec le verbe pluriel qui suit plus loin.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: que les étoiles du ciel
  rationale: Après « aussi nombreux », « que » rend naturellement la comparaison. « Les étoiles du ciel » est une expression française claire et digne.
- source_word: וְכָל הָאָרֶץ הַזֹּאת
  choice: Tout ce pays
  rationale: Le démonstratif désigne le pays promis dont il est question. « Pays » évite l’ambiguïté possible de « terre » tout en gardant la portée territoriale.
- source_word: אֲשֶׁר אָמַרְתִּי
  choice: dont j’ai parlé
  rationale: Cette traduction respecte la relative comme une proposition distincte et n’y incorpore pas par anticipation le verbe suivant, « je donnerai ».
- source_word: אֶתֵּן לְזַרְעֲכֶם
  choice: je le donnerai à vos descendants
  rationale: L’imparfait hébreu a ici une valeur future dans la promesse citée. Le pronom « le » reprend naturellement « pays ».
- source_word: וְנָחֲלוּ לְעֹלָם
  choice: et ils en hériteront pour toujours
  rationale: Le pluriel « ils » reflète le verbe hébreu pluriel, tandis que « en hériter » est la construction idiomatique française avec « hériter de ». « Pour toujours » conserve la durée forte de לְעֹלָם.
theological_decisions:
- issue: Emploi d’« Israël » plutôt que « Jacob » pour désigner le patriarche
  choice: Conserver « Israël » dans le texte principal
  alternative: Jacob
  rationale: L’hébreu porte explicitement « Israël ». Remplacer ce nom par « Jacob » interpréterait le texte et atténuerait la portée du nom d’alliance dans l’intercession de Moïse.
- issue: Formule de serment בָּךְ
  choice: par toi-même
  alternative: par ta propre personne
  rationale: « Par toi-même » exprime clairement que Dieu se porte lui-même garant du serment, sans ajouter d’explication doctrinale au texte.
- issue: Rapport entre אֲשֶׁר אָמַרְתִּי et אֶתֵּן
  choice: 'Maintenir deux propositions distinctes : « dont j’ai parlé, je le donnerai »'
  alternative: que j’ai dit que je donnerais
  rationale: La solution retenue conserve la succession formelle de la relative puis de la promesse au futur, sans fondre le contenu du second verbe dans la première proposition.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement divin est conservé, conformément à l’adresse hébraïque au singulier. La citation est formulée naturellement sans effacer la structure ni la tension du texte source.
