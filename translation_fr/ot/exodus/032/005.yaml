source:
  edition: WLC
  text: וַ/יַּ֣רְא אַהֲרֹ֔ן וַ/יִּ֥בֶן מִזְבֵּ֖חַ לְ/פָנָ֑י/ו וַ/יִּקְרָ֤א אַֽהֲרֹן֙ וַ/יֹּאמַ֔ר חַ֥ג לַ/יהוָ֖ה מָחָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/005.yaml
  text: When Aaron saw it[a], he built an altar before it. Then Aaron proclaimed and said, “Tomorrow will be a feast to Yahweh.”
translation:
  language: fr
  text: 'Quand Aaron vit cela, il bâtit un autel devant lui[a]. Puis Aaron proclama : « Demain, il y aura une fête en l’honneur de Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant Aaron ». Le pronom hébreu peut grammaticalement renvoyer à Aaron, mais le contexte désigne plus probablement le veau.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא
  choice: Quand Aaron vit cela
  rationale: Le verbe signifie « voir ». « Cela » reprend naturellement le veau fabriqué au verset précédent, tandis que « quand » exprime ici de façon idiomatique la progression temporelle du récit.
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: il bâtit un autel
  rationale: Traduction directe et naturelle de בנה avec מזבח, dans un registre narratif digne.
- source_word: לְפָנָיו
  choice: devant lui
  rationale: Le suffixe hébreu masculin singulier renvoie très probablement au veau, également masculin en hébreu. Le français « lui » conserve toutefois l’ambiguïté grammaticale de l’original au lieu de la résoudre silencieusement.
- source_word: וַיִּקְרָא אַהֲרֹן וַיֹּאמַר
  choice: Puis Aaron proclama
  rationale: La formule littérale « appela et dit » introduit ici une annonce publique. « Proclama » en restitue naturellement la force sans la redondance peu idiomatique de « proclama et dit ».
- source_word: חַג
  choice: une fête
  rationale: חַג désigne une célébration cultuelle. « Fête » est courant, concis et n’ajoute pas l’idée plus précise d’un pèlerinage.
- source_word: לַיהוָה
  choice: en l’honneur de Yahweh
  rationale: La préposition לְ marque ici l’orientation ou la dédicace de la fête. « En l’honneur de » est idiomatique en français et préserve explicitement le nom divin יהוה.
- source_word: מָחָר
  choice: Demain, il y aura
  rationale: La proposition nominale hébraïque exige en français une tournure verbale ; « il y aura » convient naturellement à une proclamation annonçant une fête.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » représente le nom propre de l’alliance sans le remplacer par un titre.
- issue: Référent du suffixe dans לְפָנָיו
  choice: Le veau est le référent contextuellement le plus probable, tout en conservant « lui » dans le texte.
  alternative: Aaron lui-même
  rationale: Le veau nouvellement fabriqué est le référent narratif le plus cohérent. Cependant, la morphologie permet grammaticalement de rapporter le suffixe à Aaron ; la note signale donc cette possibilité réelle.
translation_notes:
  register: Français international moderne, naturel et digne. La traduction évite la lourdeur de « proclama et dit », rend explicite la valeur de l’annonce avec « il y aura » et conserve dans le corps du texte l’ambiguïté pronominale de לְפָנָיו, précisée en note.
