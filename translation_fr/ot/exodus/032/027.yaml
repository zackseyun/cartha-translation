  text: וַ/יֹּ֣אמֶר לָ/הֶ֗ם כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שִׂ֥ימוּ אִישׁ חַרְבּ֖/וֹ עַל יְרֵכ֑/וֹ עִבְר֨וּ וָ/שׁ֜וּבוּ מִ/שַּׁ֤עַר לָ/שַׁ֨עַר֙ בַּֽ/מַּחֲנֶ֔ה וְ/הִרְג֧וּ אִֽישׁ אֶת אָחִ֛י/ו וְ/אִ֥ישׁ אֶת רֵעֵ֖/הוּ וְ/אִ֥ישׁ אֶת קְרֹבֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/027.yaml
  text: 'And he said to them[a], “Thus says Yahweh, the God of Israel: Each man, put his sword on his thigh. Pass through and return from gate to gate throughout the camp, and each man kill his brother, and each man his companion, and each man his neighbor.”'
translation:
  language: fr
  text: 'Il leur dit : « Ainsi parle Yahweh, le Dieu d’Israël : Que chacun mette son épée au côté. Parcourez le camp en allant et venant d’une porte à l’autre, et que chacun tue son frère, son compagnon et son proche[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « son parent proche ». L’hébreu désigne littéralement « celui qui lui est proche ».'
    reason: Alternative lexicale maintenant l’ambiguïté entre proximité relationnelle et parenté.
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: Il leur dit
  rationale: Le wayyiqtol poursuit naturellement le récit. En français moderne, le passé simple convient au registre narratif biblique sans exiger un « et » initial.
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Cette formule consacrée conserve la solennité et l’autorité de la formule de messager hébraïque tout en restant naturelle en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rendu direct de la construction hébraïque qui identifie Yahweh comme le Dieu d’Israël.
- source_word: שִׂימוּ אִישׁ חַרְבּוֹ עַל יְרֵכוֹ
  choice: Que chacun mette son épée au côté
  rationale: « Au côté » exprime naturellement en français le geste de s’armer, tandis que « chacun » préserve la valeur distributive de אִישׁ.
- source_word: עִבְרוּ וָשׁוּבוּ מִשַּׁעַר לָשַׁעַר בַּמַּחֲנֶה
  choice: Parcourez le camp en allant et venant d’une porte à l’autre
  rationale: Cette formulation rend les deux impératifs de mouvement, leur possible valeur répétée et l’étendue du déplacement dans le camp, sans produire un calque obscur.
- source_word: וְהִרְגוּ
  choice: tue
  rationale: « Tuer » est l’équivalent moderne, direct et non euphémistique du verbe hébreu.
- source_word: אִישׁ אֶת אָחִיו וְאִישׁ אֶת רֵעֵהוּ וְאִישׁ אֶת קְרֹבוֹ
  choice: que chacun tue son frère, son compagnon et son proche
  rationale: « Chacun » conserve la distribution individuelle, tandis que la série française maintient les trois relations nommées. « Proche » garde la largeur sémantique de קָרוֹב.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Valeur distributive et genre de אִישׁ
  choice: chacun
  alternative: chaque homme
  rationale: Dans ce commandement adressé aux Lévites, אִישׁ distribue l’action individu par individu. Le français « chacun », grammaticalement masculin et naturel dans ce contexte, conserve cette force sans la lourdeur répétée de « chaque homme ».
- issue: Portée de קְרֹבוֹ
  choice: son proche
  alternative: son parent proche
  rationale: Le mot peut désigner une personne proche, notamment un parent. Le texte ne précise pas ici le type exact de proximité; « proche » maintient cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et direct. Le présent « Ainsi parle » conserve la formule solennelle; le passé simple sert la narration. La violence du commandement n’est ni atténuée ni amplifiée.
