  yaml_path: translation/ot/exodus/032/003.yaml
  text: So all the people took off the gold rings that were in their ears and brought them to Aaron[a][b].
translation:
  language: fr
  text: Alors tout le peuple retira[a] les anneaux d’or[b] qu’il avait aux oreilles et les apporta à Aaron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « arracha » ou « se dépouilla de ses anneaux ». Le verbe hébreu peut suggérer un retrait énergique.
    reason: lexical_alternative
  - marker: b
    text: Ou « les boucles d’oreilles en or ». Le terme hébreu traduit par « anneaux » peut désigner ici des ornements d’oreille.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּרְקוּ
  choice: retira
  rationale: Le hitpael de פרק exprime ici le fait que les membres du peuple enlèvent eux-mêmes leurs ornements. « Retira » est naturel en français et laisse ouverte la possibilité d’un geste énergique, signalée en note.
- source_word: כָּל הָעָם
  choice: tout le peuple
  rationale: Cette expression désigne collectivement la communauté rassemblée. Le singulier collectif français permet ensuite les pronoms « il » et « les » de manière fluide.
- source_word: נִזְמֵי הַזָּהָב
  choice: les anneaux d’or
  rationale: נֶזֶם désigne un anneau ornemental pouvant être porté à l’oreille ou au nez. « Anneaux d’or » conserve cette largeur lexicale, tandis que la proposition suivante précise leur emplacement.
- source_word: אֲשֶׁר בְּאָזְנֵיהֶם
  choice: qu’il avait aux oreilles
  rationale: Cette formulation française naturelle rend la proposition relative hébraïque et situe clairement les anneaux aux oreilles du peuple, pris collectivement.
- source_word: וַיָּבִיאוּ אֶל אַהֲרֹן
  choice: et les apporta à Aaron
  rationale: Le verbe signifie « apporter ». Le pronom « les » reprend explicitement les anneaux; le singulier verbal s’accorde naturellement avec le collectif « tout le peuple ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le singulier collectif « tout le peuple » est maintenu avec une concordance grammaticale au singulier. Les notes préservent les nuances lexicales de פרק et de נֶזֶם sans alourdir le verset.
