base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/020.yaml
  text: He took the calf that they had made[a], burned it with fire, ground it until it was fine, scattered it on the surface of the water, and made the sons of Israel drink it.
translation:
  language: fr
  text: Il prit le veau qu’ils avaient fabriqué, le brûla au feu, le broya jusqu’à ce qu’il soit réduit en fine poussière, la répandit à la surface de l’eau et en fit boire aux fils d’Israël.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux Israélites ». L’hébreu dit littéralement « aux fils d’Israël », désignation habituelle du peuple dans son ensemble.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵגֶל
  choice: le veau
  rationale: עֵגֶל désigne un jeune bovin; « le veau » est ici la désignation naturelle et traditionnelle de l’idole.
- source_word: אֲשֶׁר עָשׂוּ
  choice: qu’ils avaient fabriqué
  rationale: Le plus-que-parfait marque naturellement en français l’action antérieure, et « fabriquer » convient à la confection d’un objet cultuel.
- source_word: וַיִּשְׂרֹף בָּאֵשׁ
  choice: le brûla au feu
  rationale: Cette formulation rend concrètement le verbe et בָּאֵשׁ, tout en restant idiomatique et digne.
- source_word: וַיִּטְחַן עַד אֲשֶׁר דָּק
  choice: le réduisit par broyage en une fine poussière
  rationale: טחן exprime l’action de broyer et דק le résultat très fin; cette formulation explicite le résultat sans perdre le procédé.
- source_word: וַיִּזֶר עַל פְּנֵי הַמַּיִם
  choice: la répandit à la surface de l’eau
  rationale: זרה indique ici la dispersion de la matière broyée, et עַל־פְּנֵי conserve l’image de la surface de l’eau.
- source_word: וַיַּשְׁקְ אֶת בְּנֵי יִשְׂרָאֵל
  choice: en fit boire aux fils d’Israël
  rationale: Le causatif de שׁקה est rendu par « fit boire »; « en » renvoie à l’eau contenant la poussière, tandis que « fils d’Israël » conserve la forme de la désignation hébraïque.
theological_decisions:
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: La traduction principale conserve la formulation généalogique et communautaire explicite de l’hébreu, sans décider qu’elle vise seulement les hommes; la note indique son emploi collectif usuel.
translation_notes:
  register: Français international moderne, narratif et digne. La succession rapide des actions est conservée. Le pronom « la » reprend « une fine poussière », et « en fit boire » évite de suggérer que la matière sèche aurait été bue séparément de l’eau.
