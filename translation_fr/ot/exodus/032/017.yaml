  text: When Joshua heard the sound of the people as they shouted[a], he said to Moses, “There is the sound of war in the camp.”
translation:
  language: fr
  text: 'Lorsque Josué entendit le bruit du peuple qui criait[a], il dit à Moïse : « C’est un bruit de guerre dans le camp. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « dans son cri » ou « dans sa clameur ». Le suffixe singulier hébreu se rapporte au nom collectif « peuple » ; l’expression évoque ses cris bruyants.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: entendit
  rationale: Le qal wayyiqtol de שׁמע exprime ici la perception auditive dans la suite narrative.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom.
- source_word: קוֹל
  choice: bruit
  rationale: Dans les deux occurrences, קוֹל désigne une rumeur audible plutôt qu’une parole articulée. « Bruit » convient naturellement à la clameur du peuple et au bruit supposé de la guerre.
- source_word: הָעָם בְּרֵעֹה
  choice: que faisait le peuple en poussant des cris
  rationale: La tournure rend naturellement la voix collective du peuple et l’idée d’une clameur forte. Le suffixe singulier hébreu s’accorde avec le nom collectif עָם.
- source_word: וַיֹּאמֶר אֶל־מֹשֶׁה
  choice: il dit à Moïse
  rationale: Formule narrative française simple et fidèle; « Moïse » suit l’usage français établi.
- source_word: קוֹל מִלְחָמָה
  choice: un bruit de guerre
  rationale: La construction nominal hébraïque signifie littéralement « bruit de guerre ». L’article français indéfini convient à l’identification faite par Josué.
- source_word: בַּמַּחֲנֶה
  choice: dans le camp
  rationale: Rendu direct et idiomatique du lieu désigné par מַחֲנֶה.
