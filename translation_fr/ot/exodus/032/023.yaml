  text: וַ/יֹּ֣אמְרוּ לִ֔/י עֲשֵׂה לָ֣/נוּ אֱלֹהִ֔ים אֲשֶׁ֥ר יֵלְכ֖וּ לְ/פָנֵ֑י/נוּ כִּי זֶ֣ה מֹשֶׁ֣ה הָ/אִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֨/נוּ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה הָ֥יָה לֽ/וֹ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/023.yaml
  text: And they said to me[a], ‘Make gods for us, which will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.’
translation:
  language: fr
  text: 'Ils m’ont dit : « Fais pour nous des dieux[a] qui marcheront devant nous, car ce Moïse, l’homme qui nous a fait monter du pays d’Égypte, nous ne savons pas ce qui lui est arrivé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Fais pour nous un dieu qui marchera devant nous ». Bien que ce verset emploie un nom pouvant être compris au pluriel avec un verbe pluriel (« des dieux… marcheront »), certains traduisent au singulier en raison de l’image du veau dans le contexte.
    reason: Lecture alternative due à l’ambivalence possible de אֱלֹהִים et au contraste entre la grammaire plurielle du verset et l’image singulière du contexte.
lexical_decisions:
- source_word: וַיֹּאמְרוּ לִי
  choice: Ils m’ont dit
  rationale: Le wayyiqtol fait progresser le récit. Le passé composé est naturel en français moderne dans le discours narratif et le complément לִי est rendu explicitement.
- source_word: עֲשֵׂה לָנוּ
  choice: Fais-nous
  rationale: L’impératif de עשה signifie ici « faire, fabriquer ». La construction française « fais-nous » exprime naturellement le bénéficiaire indiqué par לָנוּ.
- source_word: אֱלֹהִים
  choice: des dieux
  rationale: Le nom אֱלֹהִים peut être singulier ou pluriel, mais le verbe pluriel יֵלְכוּ appuie fortement le pluriel dans ce verset. Cette traduction conserve la tension avec l’image unique du veau dans le contexte.
- source_word: אֲשֶׁר יֵלְכוּ לְפָנֵינוּ
  choice: qui marcheront devant nous
  rationale: Le pluriel « marcheront » reflète directement יֵלְכוּ. « Marcher devant » garde l’image hébraïque d’une divinité qui précède et guide le peuple.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de la demande. « Car » convient au registre digne du discours direct sans être archaïque.
- source_word: זֶה מֹשֶׁה הָאִישׁ
  choice: ce Moïse, l’homme
  rationale: « Ce Moïse » préserve la nuance distanciée du démonstratif זֶה; l’apposition « l’homme » représente הָאִישׁ sans l’omettre.
- source_word: אֲשֶׁר הֶעֱלָנוּ מֵאֶרֶץ מִצְרַיִם
  choice: qui nous a fait monter du pays d’Égypte
  rationale: Cette formulation rend le causatif de עלה et l’expression complète « du pays d’Égypte ». Elle conserve l’idiome spatial de l’hébreu plutôt que de le réduire à « fait sortir ».
- source_word: לֹא יָדַעְנוּ
  choice: nous ne savons pas
  rationale: Le parfait décrit ici un état de non-savoir qui demeure au moment de la parole; le présent est l’équivalent français naturel.
- source_word: מֶה הָיָה לוֹ
  choice: ce qui lui est arrivé
  rationale: Cette expression française actuelle rend naturellement l’interrogation hébraïque sur le sort de Moïse.
theological_decisions:
- issue: Valeur singulière ou plurielle de אֱלֹהִים dans le rapport d’Aaron
  choice: 'Pluriel : « des dieux »'
  alternative: 'Singulier : « un dieu »'
  rationale: Le verbe יֵלְכוּ est explicitement pluriel et favorise donc « des dieux ». Le singulier demeure possible à la lumière du veau unique dans le contexte, mais l’adopter dans le texte principal atténuerait une tension réelle de la formulation hébraïque.
translation_notes:
  register: Français international moderne, clair et digne. Le texte conserve les traits saillants de l’hébreu — « ce Moïse », « fait monter », et surtout l’accord pluriel — sans lourdeur excessive. Le passé composé convient à la parole d’Aaron rapportant immédiatement les propos du peuple.
