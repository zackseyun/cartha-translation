  text: וַֽ/יְהִ֗י כַּ/אֲשֶׁ֤ר קָרַב֙ אֶל הַֽ/מַּחֲנֶ֔ה וַ/יַּ֥רְא אֶת הָ/עֵ֖גֶל וּ/מְחֹלֹ֑ת וַ/יִּֽחַר אַ֣ף מֹשֶׁ֗ה וַ/יַּשְׁלֵ֤ךְ מ/יד/ו אֶת הַ/לֻּחֹ֔ת וַ/יְשַׁבֵּ֥ר אֹתָ֖/ם תַּ֥חַת הָ/הָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/019.yaml
  text: And as soon as he came near the camp and saw the calf and the dancing[a], Moses' anger burned, and he threw the tablets from his hands and shattered them at the foot of the mountain.
translation:
  language: fr
  text: Lorsqu’il approcha du camp et qu’il vit le veau et les danses, la colère de Moïse s’enflamma. Il jeta les tablettes qu’il tenait en main et les brisa au pied de la montagne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Lorsqu’il
  rationale: La formule narrative introduit ici le moment où survient l’action suivante. « Lorsqu’il » restitue naturellement la valeur temporelle sans conserver le tour hébreu plus lourd « et il arriva que ».
- source_word: קָרַב אֶל הַמַּחֲנֶה
  choice: approcha du camp
  rationale: קָרַב exprime le fait de s’approcher ou d’arriver près de quelque chose. « Approcha du camp » est précis et naturel en français.
- source_word: וַיַּרְא אֶת הָעֵגֶל וּמְחֹלֹת
  choice: et qu’il vit le veau et les danses
  rationale: רָאָה est le verbe ordinaire « voir ». Le pluriel מְחֹלֹת désigne des danses; le pluriel concret est naturel en français et évite le terme plus interprétatif « réjouissances ».
- source_word: וַיִּחַר אַף מֹשֶׁה
  choice: la colère de Moïse s’enflamma
  rationale: Cette formulation conserve l’image vive de l’idiome hébreu, où la colère « brûle », tout en restant idiomatique et digne en français moderne.
- source_word: וַיַּשְׁלֵךְ מִיָּדוֹ אֶת הַלֻּחֹת
  choice: Il jeta les tablettes qu’il tenait en main
  rationale: Le texte hébreu dit littéralement qu’il jeta les tablettes « de sa main ». La relative explicite naturellement en français qu’elles étaient en sa possession sans modifier le sens.
- source_word: וַיְשַׁבֵּר אֹתָם
  choice: et les brisa
  rationale: שָׁבַר signifie « briser ». Ce choix direct rend la violence de l’acte sans ajouter l’idée plus spécifique d’un éclatement en fragments.
- source_word: תַּחַת הָהָר
  choice: au pied de la montagne
  rationale: Dans ce cadre topographique, « au pied de la montagne » rend naturellement תַּחַת, littéralement « sous, en dessous de », et situe clairement l’action.
