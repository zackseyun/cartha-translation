  text: לָ/מָּה֩ יֹאמְר֨וּ מִצְרַ֜יִם לֵ/אמֹ֗ר בְּ/רָעָ֤ה הֽוֹצִיאָ/ם֙ לַ/הֲרֹ֤ג אֹתָ/ם֙ בֶּֽ/הָרִ֔ים וּ֨/לְ/כַלֹּתָ֔/ם מֵ/עַ֖ל פְּנֵ֣י הָֽ/אֲדָמָ֑ה שׁ֚וּב מֵ/חֲר֣וֹן אַפֶּ֔/ךָ וְ/הִנָּחֵ֥ם עַל הָ/רָעָ֖ה לְ/עַמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/012.yaml
  text: Why should the Egyptians say[a], ‘He brought them out with evil intent, to kill them in the mountains and to wipe them off the face of the earth’? Turn from your burning anger[c][b], and relent concerning the harm intended for your people.
translation:
  language: fr
  text: 'Pourquoi les Égyptiens diraient-ils[a] : « Il les a fait sortir avec de mauvaises intentions, pour les tuer dans les montagnes et les faire disparaître de la surface de la terre[b] » ? Détourne-toi de ta colère ardente et reviens sur le malheur que tu veux infliger à ton peuple[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pourquoi les Égyptiens pourraient-ils dire » ou « Pourquoi laisser les Égyptiens dire ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « les exterminer de la surface de la terre ». Le verbe hébreu exprime leur destruction complète.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « renonce au malheur destiné à ton peuple » ou « change d’avis au sujet du désastre qui menace ton peuple ». L’hébreu emploie, dans la supplication de Moïse, un langage humain et relationnel à propos de Dieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָמָּה יֹאמְרוּ מִצְרַיִם
  choice: Pourquoi les Égyptiens diraient-ils
  rationale: La tournure interrogative au conditionnel rend naturellement en français la portée rhétorique de לָמָּה avec l’imparfait hébreu.
- source_word: בְּרָעָה
  choice: avec de mauvaises intentions
  rationale: Dans l’accusation prêtée aux Égyptiens, l’expression désigne le dessein mauvais qu’ils attribueraient à Dieu, et non simplement une conséquence néfaste.
- source_word: הוֹצִיאָם
  choice: il les a fait sortir
  rationale: Le factitif français correspond au hiphil de יצא et reprend le vocabulaire courant du récit de l’Exode.
- source_word: לַהֲרֹג אֹתָם
  choice: pour les tuer
  rationale: L’infinitif exprime ici le but; cette formulation est directe et actuelle.
- source_word: בֶּהָרִים
  choice: dans les montagnes
  rationale: Rendu formel du pluriel, approprié au cadre montagneux du désert.
- source_word: וּלְכַלֹּתָם מֵעַל פְּנֵי הָאֲדָמָה
  choice: et les faire disparaître de la surface de la terre
  rationale: Le piel de כלה exprime une destruction complète; « faire disparaître » s’accorde naturellement avec l’expression « de la surface de la terre ».
- source_word: שׁוּב מֵחֲרוֹן אַפֶּךָ
  choice: Renonce à ton ardente colère
  rationale: « Renonce à » exprime l’appel à se détourner de cette colère, tandis que « ardente » conserve l’image hébraïque de sa chaleur.
- source_word: וְהִנָּחֵם עַל הָרָעָה לְעַמֶּךָ
  choice: et reviens sur le malheur que tu veux infliger à ton peuple
  rationale: Cette formulation rend l’appel à ne pas mettre à exécution le malheur annoncé. La relative explicite la destination marquée par לְ sans qualifier moralement l’action divine de « mal ».
theological_decisions:
- issue: Langage anthropopathique de וְהִנָּחֵם appliqué à Dieu
  choice: reviens sur
  alternative: renonce au malheur / change d’avis au sujet du malheur / repens-toi du malheur
  rationale: « Reviens sur » conserve la force réelle de la supplication de Moïse et le langage relationnel du texte sans suggérer que Dieu aurait commis une faute morale. La tension théologique n’est pas supprimée.
- issue: Sens de הָרָעָה à propos de l’action annoncée par Dieu
  choice: le malheur que tu veux infliger
  alternative: le désastre / le mal / la calamité
  rationale: « Malheur » désigne ici le jugement destructeur menaçant le peuple sans prêter à Dieu un mal moral. « Que tu veux infliger » rend en français le caractère projeté de l’action ainsi que son orientation vers le peuple.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le mouvement de la supplication de Moïse. « Ardente colère » préserve la métaphore hébraïque sans archaïsme; « reviens sur » conserve l’audace du langage anthropopathique.
