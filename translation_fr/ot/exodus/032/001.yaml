  text: וַ/יַּ֣רְא הָ/עָ֔ם כִּֽי בֹשֵׁ֥שׁ מֹשֶׁ֖ה לָ/רֶ֣דֶת מִן הָ/הָ֑ר וַ/יִּקָּהֵ֨ל הָ/עָ֜ם עַֽל אַהֲרֹ֗ן וַ/יֹּאמְר֤וּ אֵלָי/ו֙ ק֣וּם עֲשֵׂה לָ֣/נוּ אֱלֹהִ֗ים אֲשֶׁ֤ר יֵֽלְכוּ֙ לְ/פָנֵ֔י/נוּ כִּי זֶ֣ה מֹשֶׁ֣ה הָ/אִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֨/נוּ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה הָ֥יָה לֽ/וֹ־־־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/001.yaml
  text: When the people saw that Moses was taking a long time to come down from the mountain[a], the people gathered around Aaron and said to him, “Get up, make gods for us that will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.”
translation:
  language: fr
  text: 'Quand le peuple vit que Moïse tardait à descendre de la montagne, il se rassembla autour d’Aaron et lui dit : « Debout ! Fais pour nous des dieux qui iront devant nous[a]. Car ce Moïse, l’homme qui nous a fait monter du pays d’Égypte, nous ne savons pas ce qui lui est arrivé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un dieu qui ira devant nous ». Certains comprennent ici אֱלֹהִים au singulier parce que la suite du récit se concentre sur une seule image de veau ; toutefois, la forme hébraïque et le verbe qui l’accompagne sont au pluriel.
    reason: alternative_reading
lexical_decisions:
- source_word: בֹשֵׁשׁ
  choice: tardait
  rationale: Le verbe exprime le retard ou la lenteur de Moïse à redescendre. « Tardait à » est naturel en français moderne et rend directement la perception du peuple.
- source_word: לָרֶדֶת מִן הָהָר
  choice: à descendre de la montagne
  rationale: Cette formulation conserve le mouvement indiqué par l’hébreu et l’article défini de « la montagne ».
- source_word: וַיִּקָּהֵל ... עַל אַהֲרֹן
  choice: il se rassembla autour d’Aaron
  rationale: « Autour d’Aaron » décrit naturellement l’attroupement sans imposer le sens plus hostile de « contre Aaron », bien que le contexte implique une pression.
- source_word: קוּם
  choice: Debout !
  rationale: L’impératif est brusque et pressant. « Debout ! » conserve cette force dans un français actuel et digne.
- source_word: עֲשֵׂה לָנוּ
  choice: Fais-nous
  rationale: Cette tournure française idiomatique signifie « fais pour nous » et conserve le bénéficiaire exprimé par לָנוּ.
- source_word: אֱלֹהִים
  choice: des dieux
  rationale: Le nom est de forme plurielle et le verbe יֵלְכוּ qui suit est lui aussi pluriel. Le pluriel est donc retenu dans le texte, tandis que la lecture singulière est signalée en note.
- source_word: אֲשֶׁר יֵלְכוּ לְפָנֵינוּ
  choice: qui marcheront devant nous
  rationale: La proposition relative et l’accord pluriel sont préservés. « Marcher devant » exprime clairement la fonction de guide demandée.
- source_word: זֶה מֹשֶׁה הָאִישׁ
  choice: ce Moïse, l’homme
  rationale: La formulation garde l’apposition hébraïque et son ton distancié, voire dédaigneux.
- source_word: הֶעֱלָנוּ מֵאֶרֶץ מִצְרַיִם
  choice: nous a fait monter du pays d’Égypte
  rationale: « Faire monter » rend formellement le hifil de עלה et conserve l’expression exodique ainsi que la mention complète du pays d’Égypte.
- source_word: מֶה הָיָה לוֹ
  choice: ce qui lui est arrivé
  rationale: Cette expression idiomatique française rend clairement la question portant sur le sort de Moïse, sans archaïsme.
theological_decisions:
- issue: Faut-il rendre אֱלֹהִים au singulier ou au pluriel ?
  choice: 'Pluriel : « des dieux »'
  alternative: 'Singulier : « un dieu »'
  rationale: 'La grammaire immédiate favorise le pluriel : אֱלֹהִים est de forme plurielle et יֵלְכוּ signifie « ils marcheront ». Le récit se concentrant ensuite sur une seule statue de veau, la lecture singulière demeure possible et est conservée en note plutôt que résolue silencieusement.'
translation_notes:
  register: Français international moderne, naturel et digne. La répétition hébraïque de « le peuple » est allégée par le pronom « il » afin d’éviter une lourdeur peu naturelle, sans modifier le référent. Le discours conserve son caractère abrupt et la tension entre la grammaire plurielle et le veau unique du récit.
