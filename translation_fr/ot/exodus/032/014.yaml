source:
  edition: WLC
  text: וַ/יִּנָּ֖חֶם יְהוָ֑ה עַל הָ֣/רָעָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר לַ/עֲשׂ֥וֹת לְ/עַמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/014.yaml
  text: And Yahweh relented concerning the harm that he had spoken of doing to his people[a][b].
translation:
  language: fr
  text: Alors Yahweh renonça au malheur qu’il avait déclaré vouloir infliger à son peuple[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « changea d’avis » ou « regretta » au sujet du désastre qu’il avait annoncé vouloir infliger à son peuple.
    reason: alternative_reading
  - marker: b
    text: L’hébreu porte littéralement « le mal » ou « le désastre » ; ici, il s’agit du malheur annoncé, et non d’un mal moral en Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: renonça
  rationale: Le niphal de נחם exprime ici l’abandon d’une action annoncée. « Renonça » rend naturellement le revirement narratif sans préciser outre mesure comment celui-ci doit être compris sur le plan théologique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: עַל הָרָעָה
  choice: au malheur
  rationale: Avec נחם, la préposition עַל introduit ce à quoi l’on renonce. Dans ce contexte de jugement annoncé, רָעָה désigne un malheur ou un désastre, non un mal moral commis par Dieu.
- source_word: אֲשֶׁר דִּבֶּר
  choice: qu’il avait déclaré
  rationale: Cette formulation renvoie clairement à l’action que Yahweh avait précédemment annoncée.
- source_word: לַעֲשׂוֹת
  choice: vouloir infliger
  rationale: L’infinitif « faire » prend pour objet le malheur annoncé. « Infliger » explicite en français naturel le rapport entre ce malheur et le peuple qui devait le subir, sans changer le sens contextuel.
- source_word: לְעַמּוֹ
  choice: à son peuple
  rationale: La préposition désigne le peuple comme destinataire affecté par le malheur annoncé.
theological_decisions:
- issue: Description anthropopathique de Dieu par וַיִּנָּחֶם
  choice: Traduire dans le texte principal par « renonça »
  alternative: « changea d’avis » ou « regretta »
  rationale: Le récit présente un abandon réel du jugement annoncé en réponse à l’intercession. « Renonça » préserve cette tension sans imposer une explication doctrinale de la connaissance ou de l’immutabilité divines; les autres sens possibles sont signalés en note.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase reste proche de la structure hébraïque tout en évitant la tournure peu naturelle « faire du malheur à ». Les deux marqueurs de note figurent dans le texte principal.
