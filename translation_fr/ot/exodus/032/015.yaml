base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/015.yaml
  text: Then Moses turned and went down from the mountain[a], with the two tablets of the testimony in his hand, tablets written on both their sides; on this side and on that they were written.
translation:
  language: fr
  text: Moïse se retourna et descendit de la montagne, tenant dans sa main les deux tablettes du témoignage, des tablettes écrites sur leurs deux faces ; elles étaient écrites d’un côté comme de l’autre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֶן
  choice: se retourna
  rationale: Le verbe פנה marque ici le changement de direction de Moïse avant sa descente. « Se retourna » est naturel en français et n’ajoute pas de mouvement qui ne soit impliqué par le contexte.
- source_word: וַיֵּרֶד
  choice: descendit
  rationale: ירד signifie « descendre ». Le passé simple convient au registre narratif biblique tout en restant clair en français moderne.
- source_word: הָהָר
  choice: la montagne
  rationale: Dans le contexte du Sinaï, « la montagne » est la désignation naturelle et attendue de הַר.
- source_word: שְׁנֵי לֻחֹת
  choice: les deux tablettes
  rationale: לֻחוֹת désigne des tablettes. Le matériau n’est pas précisé dans ce verset, donc « de pierre » n’est pas ajouté.
- source_word: הָעֵדֻת
  choice: du témoignage
  rationale: « Témoignage » préserve le sens lexical et la portée théologique du terme עֵדוּת sans le réduire à une simple désignation documentaire.
- source_word: בְּיָדוֹ
  choice: tenant à la main
  rationale: Cette formulation française naturelle conserve le singulier de l’hébreu et exprime clairement que Moïse portait les tablettes.
- source_word: לֻחֹת כְּתֻבִים
  choice: Les tablettes étaient écrites
  rationale: כתב signifie ici « écrites ». Cette traduction conserve le vocabulaire simple de l’hébreu plutôt que d’introduire « gravées ».
- source_word: מִשְּׁנֵי עֶבְרֵיהֶם
  choice: sur leurs deux faces
  rationale: Pour des tablettes, « faces » rend clairement et idiomatiquement les deux surfaces désignées par עֲבָרִים.
- source_word: מִזֶּה וּמִזֶּה
  choice: d’un côté comme de l’autre
  rationale: Cette expression française restitue la distribution emphatique de l’hébreu entre les deux côtés.
- source_word: הֵם כְּתֻבִים
  choice: elles étaient écrites
  rationale: La répétition est maintenue afin de préserver l’insistance du texte hébreu.
theological_decisions:
- issue: Traduction de עֵדוּת dans l’expression « tablettes du témoignage »
  choice: du témoignage
  alternative: de l’alliance
  rationale: « Du témoignage » conserve la terminologie propre au texte et sa résonance d’attestation de l’alliance, sans expliciter celle-ci au-delà de la formulation hébraïque.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple soutient le style du récit. La répétition finale de « écrites » est volontairement conservée, et aucun détail matériel tel que « de pierre » n’est importé du contexte voisin.
