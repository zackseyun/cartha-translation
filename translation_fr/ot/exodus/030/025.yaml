  text: וְ/עָשִׂ֣יתָ אֹת֗/וֹ שֶׁ֚מֶן מִשְׁחַת קֹ֔דֶשׁ רֹ֥קַח מִרְקַ֖חַת מַעֲשֵׂ֣ה רֹקֵ֑חַ שֶׁ֥מֶן מִשְׁחַת קֹ֖דֶשׁ יִהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/025.yaml
  text: And you shall make it a holy anointing oil[a], a perfume blended by the work of a perfumer; it shall be a holy anointing oil.
translation:
  language: fr
  text: Tu en feras une huile sainte pour l’onction[a], un parfum composé selon l’art d’un parfumeur ; ce sera une huile sainte pour l’onction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une huile d’onction consacrée ». L’hébreu peut exprimer la sainteté de l’huile ou son affectation à une onction sacrée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu en feras
  rationale: Dans ce contexte prescriptif, le parfait précédé de la conjonction a valeur de directive. « Tu en feras » rend naturellement cette force et rattache la préparation aux ingrédients du verset précédent.
- source_word: אֹתוֹ
  choice: en
  rationale: Le pronom objet renvoie à la préparation issue des ingrédients déjà énumérés. En français, « en faire » exprime ce rapport plus naturellement qu’un calque avec « la » ou « cela ».
- source_word: שֶׁמֶן מִשְׁחַת קֹדֶשׁ
  choice: une huile sainte pour l’onction
  rationale: Cette formulation rend la chaîne construite et conserve à la fois la fonction d’onction et le caractère sacré de l’huile. Elle est répétée à la fin du verset comme en hébreu.
- source_word: רֹקַח מִרְקַחַת
  choice: une préparation parfumée
  rationale: Les termes apparentés évoquent une composition aromatique obtenue par mélange. « Préparation parfumée » transmet ce sens sans imposer la consistance d’un onguent ni produire en français une répétition artificielle.
- source_word: מַעֲשֵׂה רֹקֵחַ
  choice: œuvre d’un parfumeur
  rationale: L’expression désigne le travail spécialisé d’un artisan qui compose des substances aromatiques. « Parfumeur » convient au contexte et « œuvre » préserve la tournure nominale hébraïque.
- source_word: יִהְיֶה
  choice: ce sera
  rationale: L’imparfait de היה indique ici l’état résultant prescrit pour la préparation. « Ce sera » garde la portée déclarative de la formule.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et prescriptif. La formulation conserve la répétition finale de l’hébreu et le vocabulaire artisanal, tout en évitant les archaïsmes et une surinterprétation de la nature matérielle de la préparation.
