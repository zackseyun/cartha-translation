  text: And you shall make two gold rings for it under its molding[a]; on its two side panels you shall make them, on its two sides[c][b], and they shall be holders for poles with which to carry it.
translation:
  language: fr
  text: Tu lui feras deux anneaux d’or sous sa bordure[a]. Tu les feras sur ses deux côtés, sur ses deux flancs[b]. Ils serviront de logements pour les barres, afin de le porter avec elles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sous sa moulure » ou « sous son rebord » ; le mot hébreu זֵר désigne la bordure décorative entourant l’autel.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sur ses deux côtés … sur ses deux côtés » ; deux termes hébreux apparentés, dont la distinction précise est incertaine dans ce contexte, soulignent l’emplacement de part et d’autre.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « ils seront des maisons pour les barres », c’est-à-dire des logements destinés à recevoir les barres de transport.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: anneaux d’or
  rationale: טַבַּעַת désigne ici des anneaux servant à fixer les barres; « anneaux d’or » est naturel et conserve l’indication de matière.
- source_word: מִתַּחַת לְזֵרוֹ
  choice: sous sa bordure
  rationale: זֵר désigne la bordure décorative qui entoure l’autel. « Bordure » reste concret et convient au mobilier du sanctuaire, sans imposer une forme précise.
- source_word: צַלְעֹתָיו
  choice: panneaux latéraux
  rationale: צֵלָע peut désigner un côté, une structure latérale ou une nervure. Dans ce contexte de fabrication, « panneaux latéraux » exprime naturellement les éléments structuraux de chaque côté.
- source_word: עַל שְׁנֵי צִדָּיו
  choice: sur ses deux côtés
  rationale: La formule reprend l’emplacement bilatéral des anneaux. La répétition est conservée parce qu’elle appartient à la description hébraïque.
- source_word: וְהָיָה לְבָתִּים לְבַדִּים
  choice: Ils serviront de supports pour les barres
  rationale: בָּתִּים signifie littéralement « maisons », mais désigne ici des logements ou supports recevant les barres. Cette formulation rend clairement leur fonction.
- source_word: בַדִּים
  choice: barres
  rationale: Dans les instructions relatives au transport du mobilier sacré, בַּד désigne les longues barres utilisées pour porter l’objet. « Barres » est le terme français courant dans ce contexte.
- source_word: לָשֵׂאת אֹתוֹ בָּהֵמָּה
  choice: avec lesquelles on le portera
  rationale: La formulation rend à la fois le but et la valeur instrumentale de בָּהֵמָּה, qui renvoie aux barres.
- source_word: תַּעֲשֶׂה ... תַּעֲשֶׂה
  choice: Tu lui feras ... Tu les feras
  rationale: Le futur à valeur injonctive convient au style des instructions en français et préserve la répétition du verbe hébreu.
