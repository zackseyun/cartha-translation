  text: וְ/אַתָּ֣ה קַח לְ/ךָ֮ בְּשָׂמִ֣ים רֹאשׁ֒ מָר דְּרוֹר֙ חֲמֵ֣שׁ מֵא֔וֹת וְ/קִנְּמָן בֶּ֥שֶׂם מַחֲצִית֖/וֹ חֲמִשִּׁ֣ים וּ/מָאתָ֑יִם וּ/קְנֵה בֹ֖שֶׂם חֲמִשִּׁ֥ים וּ/מָאתָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/023.yaml
  text: 'And you[a], take for yourself the finest spices: five hundred shekels of flowing myrrh, and half as much—two hundred fifty—of fragrant cinnamon, and two hundred fifty of fragrant cane[b],'
translation:
  language: fr
  text: 'Quant à toi, prends les aromates les plus fins : cinq cents sicles de myrrhe qui s’écoule librement[a], la moitié de cette quantité — deux cent cinquante — de cannelle aromatique, et deux cent cinquante de roseau aromatique[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « myrrhe pure ». L’expression hébraïque désigne probablement une myrrhe qui s’écoule librement à l’état naturel.
    reason: lexical_alternative
  - marker: b
    text: Traditionnellement « cannelle douce » et « calamus doux ». L’hébreu désigne plus largement de la cannelle et un roseau aromatiques.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשָׂמִים רֹאשׁ
  choice: les aromates les plus fins
  rationale: בְּשָׂמִים désigne des substances aromatiques, tandis que רֹאשׁ a ici le sens idiomatique de « principal » ou « meilleur ». Cette formulation naturelle conserve la valeur qualitative de l’expression.
- source_word: מָר דְּרוֹר
  choice: myrrhe fluide
  rationale: מָר signifie « myrrhe » et דְּרוֹר évoque vraisemblablement une myrrhe qui s’écoule librement à l’état naturel. « Fluide » reste transparent sans trancher en faveur du sens plus interprétatif « pure ».
- source_word: חֲמֵשׁ מֵאוֹת
  choice: cinq cents sicles
  rationale: Le texte donne ici le nombre sans répéter l’unité, mais le sicle est précisé dans le contexte immédiat de la recette, au verset 24. L’ajout explicite évite toute ambiguïté en français.
- source_word: קִנְּמָן בֶּשֶׂם
  choice: cannelle aromatique
  rationale: קִנְּמָן désigne la cannelle et בֶּשֶׂם en souligne le caractère odorant. « Aromatique » convient mieux que « douce », qui pourrait évoquer la saveur.
- source_word: מַחֲצִיתוֹ
  choice: la moitié de cette quantité
  rationale: Le suffixe renvoie aux cinq cents sicles précédents. La formulation française explicite naturellement cette relation comparative.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: deux cent cinquante
  rationale: Le nombre précise en apposition ce que représente la moitié de cinq cents, conformément à la structure hébraïque.
- source_word: קְנֵה בֹשֶׂם
  choice: roseau aromatique
  rationale: קָנֶה signifie « roseau » ou « canne », et בֹשֶׂם le qualifie d’aromatique. « Roseau aromatique » demeure accessible et évite l’identification botanique plus précise, mais incertaine, « calamus ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. L’ouverture « Quant à toi » rend l’emphase du pronom hébreu. La phrase conserve la structure de la liste et sa ponctuation finale ouverte, puisque la recette se poursuit au verset suivant.
