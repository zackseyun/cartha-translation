source:
  edition: WLC
  text: זֶ֣ה יִתְּנ֗וּ כָּל הָ/עֹבֵר֙ עַל הַ/פְּקֻדִ֔ים מַחֲצִ֥ית הַ/שֶּׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ עֶשְׂרִ֤ים גֵּרָה֙ הַ/שֶּׁ֔קֶל מַחֲצִ֣ית הַ/שֶּׁ֔קֶל תְּרוּמָ֖ה לַֽ/יהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/013.yaml
  text: 'This is what everyone who passes over to those who are numbered shall give: half a shekel according to the sanctuary shekel (the shekel is twenty gerahs)[a], half a shekel as an offering to Yahweh.'
translation:
  language: fr
  text: 'Voici ce que donnera toute personne inscrite au recensement : un demi-sicle, selon le sicle du sanctuaire — le sicle vaut vingt guéras —, un demi-sicle en offrande à Yahweh.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « toute personne qui passe parmi les recensés »; l’expression hébraïque est un idiome de recensement désignant ceux qui entrent dans le dénombrement officiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה יִתְּנוּ
  choice: Voici ce que donnera
  rationale: La formule française conserve la valeur démonstrative de זֶה et rend l’imparfait prescriptif יִתְּנוּ dans un registre juridique naturel.
- source_word: כָּל הָעֹבֵר עַל הַפְּקֻדִים
  choice: toute personne qui passe au nombre des recensés
  rationale: Cette formulation maintient l’image hébraïque du passage tout en faisant comprendre l’idiome de recensement, sans le réduire simplement à « toute personne recensée ».
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: un demi-sicle
  rationale: Rendu français traditionnel, précis et intelligible de l’unité monétaire.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: selon le sicle du sanctuaire
  rationale: La préposition בְּ indique ici l’étalon de mesure; « sicle du sanctuaire » exprime clairement l’étalon cultuel.
- source_word: עֶשְׂרִים גֵּרָה הַשֶּׁקֶל
  choice: le sicle vaut vingt guéras
  rationale: Cette tournure française concise conserve la fonction explicative de la proposition hébraïque.
- source_word: תְּרוּמָה לַיהוָה
  choice: comme offrande prélevée pour Yahweh
  rationale: « Offrande prélevée » rend la notion de contribution mise à part portée par תְּרוּמָה; « pour » convient au bénéficiaire ou destinataire cultuel indiqué par לְ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Sens de l’expression censitaire כָּל הָעֹבֵר עַל הַפְּקֻדִים
  choice: toute personne qui passe au nombre des recensés
  alternative: toute personne recensée
  rationale: Le choix conserve à la fois l’image littérale du passage et son sens contextuel d’entrée dans le dénombrement officiel.
- issue: Valeur cultuelle de תְּרוּמָה
  choice: offrande prélevée
  alternative: contribution
  rationale: « Offrande prélevée » garde la dimension de mise à part cultuelle sans imposer le geste technique suggéré par certaines traductions traditionnelles.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le tétragramme comme nom propre; sa translittération préserve cette distinction.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur simple porte naturellement la valeur prescriptive. Les termes « sicle » et « guéra » sont conservés comme unités anciennes; l’incise explicite leur rapport. Le marqueur [a] est placé après la phrase à laquelle la note se rapporte.
