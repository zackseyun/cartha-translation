base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/034.yaml
  text: 'Then Yahweh said to Moses[a], “Take for yourself spices: stacte and onycha and galbanum, spices, and pure frankincense; they shall be in equal parts.”'
translation:
  language: fr
  text: 'Yahweh dit à Moïse : « Prends pour toi des aromates : du stacté, de l’onycha[a] et du galbanum, des aromates, ainsi que de l’oliban pur ; ils seront à parts égales. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification exacte du « stacté » et de l’« onycha » est incertaine ; les termes hébreux désignent vraisemblablement des ingrédients aromatiques particuliers, traditionnellement rendus ainsi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le contexte narratif suffit à exprimer la progression portée par le waw consécutif ; « dit » est naturel et digne en français moderne.
- source_word: קַח לְךָ
  choice: Prends pour toi
  rationale: Cette formulation conserve la nuance personnelle du complément לְךָ sans développer le sens au-delà de l’hébreu.
- source_word: סַמִּים
  choice: aromates
  rationale: Terme générique adapté à des substances odorantes destinées à la composition de l’encens ; sa répétition préserve celle du texte source.
- source_word: נָטָף
  choice: stacté
  rationale: Désignation française traditionnelle de cet ingrédient aromatique, dont l’identification exacte demeure incertaine.
- source_word: שְׁחֵלֶת
  choice: onycha
  rationale: Translittération traditionnelle qui évite de trancher une identification matérielle incertaine.
- source_word: חֶלְבְּנָה
  choice: galbanum
  rationale: Identification courante de cette gomme-résine aromatique et terme établi en français.
- source_word: לְבֹנָה זַכָּה
  choice: encens pur
  rationale: « Encens » est le terme français courant pour la résine d’oliban dans ce contexte biblique, et « pur » rend naturellement זַכָּה.
- source_word: בַּד בְּבַד
  choice: en quantités égales
  rationale: Cette expression rend clairement l’idée de proportions égales entre les ingrédients.
- source_word: יִהְיֶה
  choice: ils seront
  rationale: Le pluriel français reprend naturellement l’ensemble des ingrédients, malgré la forme verbale hébraïque au singulier collectif.
