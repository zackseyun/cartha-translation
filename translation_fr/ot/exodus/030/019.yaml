  text: Aaron and his sons shall wash their hands and their feet from it[a].
translation:
  language: fr
  text: Aaron et ses fils se laveront les mains et les pieds avec l’eau qui en provient[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « d’elle »; « elle » désigne la cuve mentionnée au verset précédent.'
    reason: Précise le référent contextuel et la valeur de מִמֶּנּוּ.
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: se laveront
  rationale: Dans ce contexte d’instructions cultuelles, la forme verbale a une valeur prescriptive. Le futur français exprime naturellement cette obligation tout en conservant le ton normatif du passage.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: וּבָנָיו
  choice: et ses fils
  rationale: Le terme désigne ici les fils d’Aaron qui exercent le sacerdoce; « fils » maintient donc la référence masculine précise du contexte.
- source_word: מִמֶּנּוּ
  choice: y
  rationale: Le pronom renvoie à la cuve mentionnée au verset précédent. « S’y laveront » est une formulation française naturelle pour indiquer qu’ils utiliseront cette cuve, tandis qu’une note explicite le sens plus littéral « à partir d’elle », c’est-à-dire avec l’eau qui en est tirée.
- source_word: אֶת יְדֵיהֶם
  choice: les mains
  rationale: Avec le verbe pronominal « se laver », le français emploie normalement l’article défini devant les parties du corps plutôt qu’un possessif.
- source_word: וְאֶת רַגְלֵיהֶם
  choice: et les pieds
  rationale: Traduction directe du second complément, coordonné au premier; l’article défini est idiomatique après « se laver ».
theological_decisions:
- issue: Référence masculine propre au sacerdoce
  choice: et ses fils
  alternative: et ses enfants
  rationale: Le contexte concerne Aaron et ses descendants masculins affectés au service sacerdotal. La formulation ne neutralise donc pas cette précision du texte.
translation_notes:
  register: Français international moderne, simple et digne. Le futur conserve la portée prescriptive de l’instruction. La tournure pronominale avec les articles définis est idiomatique en français.
