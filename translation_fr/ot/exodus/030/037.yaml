base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/037.yaml
  text: And the incense that you make according to its composition[a], you shall not make for yourselves[b]; it shall be holy to you for Yahweh.
translation:
  language: fr
  text: L’encens que tu prépareras selon sa composition[a], vous n’en préparerez pas pour vous-mêmes[b] ; il sera pour toi saint, consacré à Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon sa formule » ou « selon ses proportions ».
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire que ce mélange d’encens sacré ne devait pas être reproduit pour un usage ordinaire ou personnel.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַקְּטֹרֶת
  choice: Quant à l’encens
  rationale: Le nom désigne le mélange d’encens sacré décrit dans le contexte immédiat. La tournure « Quant à » restitue naturellement la mise en relief du syntagme hébreu placé en tête.
- source_word: אֲשֶׁר תַּעֲשֶׂה
  choice: que tu prépareras
  rationale: Le verbe עשה signifie littéralement « faire », mais « préparer » est plus naturel en français pour la confection d’un mélange d’encens. Le singulier « tu » est conservé.
- source_word: בְּמַתְכֻּנְתָּהּ
  choice: selon la même composition
  rationale: 'מַתְכֹּנֶת renvoie ici à la composition prescrite, possiblement à sa formule ou à ses proportions. « La même » explicite la valeur anaphorique du suffixe : la composition de l’encens sacré qui vient d’être décrit.'
- source_word: לֹא תַעֲשׂוּ לָכֶם
  choice: vous n’en préparerez pas pour vous-mêmes
  rationale: Le pluriel hébreu est préservé par « vous », tandis que « en » évite une répétition lourde. « Pour vous-mêmes » maintient la formulation du texte sans réduire explicitement l’interdiction au seul usage personnel.
- source_word: קֹדֶשׁ תִּהְיֶה לְךָ
  choice: Tu le considéreras comme saint
  rationale: Littéralement, « il sera saint pour toi ». Cette formulation française exprime naturellement le statut que le destinataire doit reconnaître à cet encens, sans affaiblir la notion de sainteté.
- source_word: לַיהוָה
  choice: consacré à Yahweh
  rationale: La préposition ל marque ici la destination ou l’appartenance sacrée. « Consacré à » rend cette relation clairement, et le nom divin יהוה est translittéré « Yahweh » conformément à la ligne éditoriale fournie.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom d’alliance au lieu de lui substituer un titre.
- issue: Relation entre la sainteté de l’encens et Yahweh
  choice: saint, consacré à Yahweh
  alternative: saint pour Yahweh
  rationale: Cette formulation conserve à la fois le prédicat קֹדֶשׁ, « saint », et la destination exprimée par לַיהוָה. Elle évite de laisser entendre que « saint » signifierait seulement « moralement pur ».
- issue: Alternance du singulier et du pluriel
  choice: tu prépareras / vous n’en préparerez pas / tu le considéreras
  alternative: uniformiser entièrement au singulier ou au pluriel
  rationale: L’hébreu passe réellement du singulier au pluriel puis au singulier. Le maintien de cette variation préserve une tension grammaticale du texte, où l’adresse individuelle encadre une interdiction visant la collectivité.
translation_notes:
  register: Français international moderne, clair et digne. « Encens », « saint » et « Yahweh » maintiennent le vocabulaire cultuel et théologique. La variation entre « tu » et « vous » reproduit délibérément le changement de nombre du texte hébreu.
