id: EXO.30.9
reference: Exodus 30:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹא תַעֲל֥וּ עָלָ֛י/ו קְטֹ֥רֶת זָרָ֖ה וְ/עֹלָ֣ה וּ/מִנְחָ֑ה וְ/נֵ֕סֶךְ לֹ֥א תִסְּכ֖וּ עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/009.yaml
  text: You shall not offer unauthorized incense on it[a], or a burnt offering, or a grain offering; and you shall not pour out a drink offering on it.
translation:
  language: fr
  text: Vous n’y ferez pas brûler d’encens non autorisé[a], ni d’holocauste, ni d’offrande de céréales, et vous n’y verserez pas d’offrande liquide.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « encens étranger ». L’adjectif hébreu peut désigner ici un encens qui ne correspond pas à ce qui est permis ou prescrit pour le culte.
    reason: Alternative lexicale préservant l’étendue sémantique de זָרָה.
lexical_decisions:
- source_word: תַעֲלוּ
  choice: ferez ... brûler
  rationale: Le hifil de עלה signifie littéralement « faire monter », mais, avec l’encens et dans un contexte d’autel, il désigne l’action de l’offrir en le faisant brûler. Cette formulation française rend à la fois l’acte concret et sa portée cultuelle.
- source_word: עָלָיו
  choice: y
  rationale: Le pronom renvoie à l’autel des parfums mentionné dans le contexte. « Y » restitue naturellement en français la relation spatiale « sur cet autel ».
- source_word: קְטֹרֶת
  choice: encens
  rationale: Le nom désigne l’encens; le contexte et le verbe suffisent à exprimer qu’il s’agit d’une offrande.
- source_word: זָרָה
  choice: non autorisé
  rationale: Dans ce contexte cultuel, זָרָה qualifie ce qui est étranger aux prescriptions, plutôt que ce qui serait simplement d’origine étrangère. « Non autorisé » communique clairement cette valeur normative.
- source_word: וְעֹלָה
  choice: ni d’holocauste
  rationale: Dans une série régie par une interdiction, le waw se rend naturellement par « ni ». « Holocauste » est le terme cultuel français établi pour l’offrande entièrement consumée.
- source_word: וּמִנְחָה
  choice: ni d’offrande de céréales
  rationale: Dans les textes sacerdotaux, מִנְחָה désigne couramment l’offrande non sanglante préparée avec des produits céréaliers. Cette expression est précise et accessible.
- source_word: וְנֵסֶךְ
  choice: offrande liquide
  rationale: Le nom désigne une offrande versée. « Offrande liquide » est plus immédiatement compréhensible en français courant que « libation », tout en conservant le sens rituel.
- source_word: תִסְּכוּ
  choice: verserez
  rationale: Le verbe נסך désigne ici l’action rituelle de verser une offrande liquide. « Verser » exprime directement ce geste en français naturel.
theological_decisions:
- issue: Valeur cultuelle de זָרָה appliqué à l’encens
  choice: encens non autorisé
  alternative: encens étranger / encens profane
  rationale: Le verset réglemente le culte rendu sur l’autel des parfums. « Non autorisé » préserve l’idée de ce qui n’est pas conforme aux prescriptions, sans réduire le terme à une origine ethnique étrangère ni préciser indûment la nature exacte de l’irrégularité.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit naturellement la série d’interdictions; les termes cultuels établis sont conservés lorsqu’ils restent largement intelligibles.
