  text: וְ/שָֽׁחַקְתָּ֣ מִמֶּ/נָּה֮ הָדֵק֒ וְ/נָתַתָּ֨ה מִמֶּ֜/נָּה לִ/פְנֵ֤י הָ/עֵדֻת֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד אֲשֶׁ֛ר אִוָּעֵ֥ד לְ/ךָ֖ שָׁ֑מָּ/ה קֹ֥דֶשׁ קָֽדָשִׁ֖ים תִּהְיֶ֥ה לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/036.yaml
  text: And you shall grind some of it very fine[a], and put some of it before the testimony in the tent of meeting, where I will meet with you. It shall be most holy for you.
translation:
  language: fr
  text: Tu en broieras une partie très finement et tu en déposeras une partie devant le témoignage, dans la tente de la Rencontre, là où je te rencontrerai. Ce sera pour vous très saint[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sainteté des saintetés ».'
    reason: La note signale la construction superlative hébraïque littérale derrière l’expression française idiomatique « très saint ».
lexical_decisions:
- source_word: וְשָׁחַקְתָּ
  choice: tu broieras
  rationale: Le verbe שׁחק désigne ici l’action de réduire le mélange d’encens en poudre. « Broyer » est précis, naturel en français et convient mieux à ce contexte rituel que « battre ».
- source_word: מִמֶּנָּה
  choice: en… une partie
  rationale: 'La construction est partitive : seule une portion du mélange doit être broyée, puis déposée. La reprise de « une partie » conserve les deux occurrences hébraïques.'
- source_word: הָדֵק
  choice: très finement
  rationale: Cette forme renforce l’action de broyer et indique une consistance très fine. L’adverbe français rend clairement cette valeur intensive.
- source_word: וְנָתַתָּה
  choice: et tu en déposeras
  rationale: נתן peut signifier mettre, placer ou déposer. « Déposer » exprime naturellement un placement intentionnel dans un cadre rituel.
- source_word: לִפְנֵי הָעֵדֻת
  choice: devant le témoignage
  rationale: Le texte hébreu nomme « le témoignage » sans préciser explicitement l’arche ou les tables. La traduction maintient ce terme cultuel sans en restreindre le référent.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la Rencontre
  rationale: Cette formulation rend l’appellation cultuelle habituelle tout en restant claire en français moderne. La majuscule à « Rencontre » signale qu’il s’agit du nom conventionnel de la tente.
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: là où je te rencontrerai
  rationale: Le nifal de יעד évoque ici la rencontre fixée entre Dieu et son interlocuteur. La traduction conserve le singulier de לְךָ et la valeur future.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: une chose très sainte
  rationale: La construction exprime le plus haut degré de sainteté. « Une chose très sainte » est idiomatique et permet de rendre clairement le statut du mélange sans lui attribuer un genre grammatical incertain dans cette phrase.
- source_word: תִּהְיֶה לָכֶם
  choice: ce sera pour vous
  rationale: Cette tournure préserve la relation exprimée par לָכֶם sans la transformer en affirmation explicite de possession; elle conserve aussi le passage du « te » singulier au « vous » pluriel.
theological_decisions:
- issue: Référent du « témoignage »
  choice: Conserver le terme cultuel « le témoignage ».
  alternative: « devant l’arche du témoignage » ou « devant les tables de l’alliance »
  rationale: Le verset ne nomme explicitement ni l’arche ni les tables. Garder le terme hébreu évite d’imposer un référent plus précis que celui du texte.
- issue: Expression superlative de la sainteté
  choice: Traduire קֹדֶשׁ קָדָשִׁים par « une chose très sainte » dans le texte principal.
  alternative: « une sainteté des saintetés »
  rationale: La formulation principale communique naturellement le superlatif hébreu en français moderne, tandis que la note conserve la structure littérale traditionnelle.
translation_notes:
  register: Français moderne, international et digne, avec tutoiement conforme au singulier hébreu adressé à Moïse. Le passage au pluriel dans « pour vous » est maintenu. Le vocabulaire cultuel reste précis sans expansion interprétative.
