translation:
  language: fr
  text: Tu feras les barres en bois d’acacia et tu les recouvriras d’or.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Le parfait qal précédé de la conjonction poursuit ici une série d’instructions et a une valeur prescriptive. Le futur français exprime naturellement cet ordre dans son contexte.
- source_word: הַבַּדִּים
  choice: les barres
  rationale: Dans les instructions concernant le mobilier sacré, בַּד désigne les longues pièces servant à son transport. « Barres » est courant et naturel en français; « brancards » serait plus explicite mais moins formellement proche.
- source_word: עֲצֵי שִׁטִּים
  choice: en bois d’acacia
  rationale: La construction hébraïque désigne le matériau. « Bois d’acacia » est la désignation française usuelle et compréhensible.
- source_word: וְצִפִּיתָ
  choice: et tu les couvriras
  rationale: Dans ce contexte artisanal, צפה signifie recouvrir ou plaquer un objet avec un matériau. « Couvrir d’or » est une formulation française naturelle qui conserve le sens sans imposer une technique précise.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom objet masculin pluriel renvoie directement aux barres; le français place naturellement le pronom avant le verbe.
- source_word: זָהָב
  choice: d’or
  rationale: Le français emploie idiomatiquement « couvrir d’or » pour indiquer le matériau du revêtement.
