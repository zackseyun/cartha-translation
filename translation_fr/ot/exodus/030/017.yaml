  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Yahweh[a] parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque du nom divin et son rendu traditionnel.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol de דבר fait progresser le récit. En français, le passé simple convient au registre narratif biblique et « parler » distingue le verbe de la formule introductive לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Cette translittération rend directement le nom divin יהוה au lieu de lui substituer un titre.
- source_word: אֶל־מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל désigne ici le destinataire de la parole ; « à » est l’équivalent français naturel. « Moïse » est la forme française usuelle du nom מֹשֶׁה.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Après un verbe de parole, cette formule hébraïque introduit le discours direct qui suit. « En ces termes » la rend avec naturel sans produire le calque peu idiomatique « disant ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le nom propre divin יהוה. « Yahweh » le préserve explicitement, tandis que « le SEIGNEUR » lui substitue un titre et que « Jéhovah » repose sur une vocalisation hybride plus tardive.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient le registre narratif soutenu sans archaïsme marqué ; les deux-points préparent la parole divine du verset suivant.
