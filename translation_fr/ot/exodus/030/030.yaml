  terminology: « Oindre » rend précisément משׁח; « consacrer » rend קדשׁ dans son cadre cultuel; « exercer le sacerdoce » rend כהן sans importer de cadre ecclésial ultérieur. « Ses fils » conserve le masculin explicite du texte source.
