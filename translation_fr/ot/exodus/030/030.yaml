  text: And you shall anoint Aaron and his sons, and you shall consecrate them to serve as priests to me.
translation:
  language: fr
  text: Tu oindras Aaron et ses fils, et tu les consacreras pour qu’ils exercent le sacerdoce à mon service.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּמְשָׁח
  choice: tu consacreras par l’onction
  rationale: Le verbe משׁח désigne ici l’application rituelle de l’huile en vue de l’investiture. « Consacrer par l’onction » exprime naturellement en français moderne à la fois le geste et sa fonction sacrée.
- source_word: וְקִדַּשְׁתָּ
  choice: tu les mettras à part
  rationale: Le piel de קדשׁ signifie rendre saint ou réserver à un usage sacré. « Mettre à part » conserve cette idée sans répéter « consacrer », déjà employé pour expliciter l’onction.
- source_word: לְכַהֵן
  choice: pour qu’ils exercent le sacerdoce
  rationale: La forme verbale de כהן signifie remplir la fonction de prêtre. Cette formulation française exprime clairement l’activité sacerdotale et son caractère officiel.
- source_word: לִי
  choice: pour moi
  rationale: La préposition ל marque ici le bénéficiaire et celui au service duquel le sacerdoce est exercé. « Pour moi » est naturel en français et reste proche du sens hébreu.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le texte hébreu désigne explicitement les fils d’Aaron, conformément au cadre de la lignée sacerdotale masculine.
- source_word: וְאֶת ... וְאֶת
  choice: Aaron et ses fils
  rationale: La répétition du marqueur d’objet direct coordonne les deux compléments. Le français les relie naturellement par « et », sans autre marque.
theological_decisions:
- issue: Vocabulaire cultuel de קדשׁ et כהן
  choice: « mettre à part » et « exercer le sacerdoce »
  alternative: « sanctifier » et « servir comme prêtres »
  rationale: Le choix retenu garde le cadre précis de l’investiture sacerdotale tout en employant un français actuel et digne, sans introduire de notions ecclésiastiques postérieures.
- issue: Rendu genré de בָּנָיו
  choice: « ses fils »
  alternative: « ses enfants »
  rationale: Le masculin est explicite dans la source et pertinent dans ce contexte de succession sacerdotale; il ne doit donc pas être neutralisé.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde la solennité de l’instruction divine. Le futur à valeur injonctive rend les formes verbales hébraïques dans ce contexte procédural.
