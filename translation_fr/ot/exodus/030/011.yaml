  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Yahvé parla à Moïse[a] en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, le nom divin, dont la prononciation ancienne n’est pas connue avec certitude. Il est traditionnellement rendu par « le SEIGNEUR » ; « Yahweh » est une autre translittération possible.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le wayyiqtol de דבר fait progresser le récit et introduit une nouvelle parole divine. « Parla » rend le verbe distinctement, tandis que la formule suivante est exprimée par « en ces termes ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française courante du nom divin transcrit le tétragramme comme un nom propre plutôt que de lui substituer le titre « le Seigneur ».
- source_word: אֶל
  choice: à
  rationale: La préposition indique ici le destinataire de la parole ; « à » est l’équivalent français naturel.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et actuelle du nom hébreu מֹשֶׁה.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif introduit le contenu de la parole qui suit. « En ces termes » reproduit naturellement cette fonction en français sans la tournure lourde « en disant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte directement le tétragramme. « Yahvé » conserve le caractère de nom propre, tandis que la note signale la substitution traditionnelle et l’incertitude de prononciation.
translation_notes:
  register: Français international moderne, sobre et digne. La formule « parla… en ces termes » est naturelle dans un contexte scripturaire et annonce clairement le discours du verset suivant.
