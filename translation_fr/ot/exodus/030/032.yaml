  text: עַל בְּשַׂ֤ר אָדָם֙ לֹ֣א יִיסָ֔ךְ וּ/בְ/מַ֨תְכֻּנְתּ֔/וֹ לֹ֥א תַעֲשׂ֖וּ כָּמֹ֑/הוּ קֹ֣דֶשׁ ה֔וּא קֹ֖דֶשׁ יִהְיֶ֥ה לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/032.yaml
  text: It shall not be poured on human flesh[a], and in its composition you shall not make any like it. It is holy; it shall be holy to you.
translation:
  language: fr
  text: Cette huile ne sera pas versée sur la chair d’un être humain, et vous ne préparerez pas une huile semblable selon sa composition. Elle est sainte ; elle sera sainte pour vous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִיסָךְ
  choice: on ne le versera
  rationale: Le nifal exprime ici l’application de l’huile par versement. Cette formulation conserve l’image concrète sans remplacer le verbe par le résultat rituel « oindre ».
- source_word: עַל בְּשַׂר אָדָם
  choice: sur le corps d’aucun être humain
  rationale: Littéralement « sur la chair d’un humain » ; אָדָם a ici une portée générique. « Corps » est plus naturel en français actuel dans cette interdiction d’appliquer l’huile à une personne ordinaire, tandis que la note conserve le sens littéral de בָּשָׂר.
- source_word: וּבְמַתְכֻּנְתּוֹ לֹא תַעֲשׂוּ כָּמֹהוּ
  choice: vous n’en reproduirez pas la composition
  rationale: מַתְכֻּנֶת désigne la composition déterminée par ses proportions ; la tournure française exprime naturellement l’interdiction de fabriquer un mélange identique.
- source_word: קֹדֶשׁ הוּא קֹדֶשׁ יִהְיֶה לָכֶם
  choice: Il est saint et restera saint pour vous
  rationale: « Saint » maintient le terme biblique central. « Restera » rend idiomatiquement יִהְיֶה dans ce contexte normatif, sans effacer la relation exprimée par לָכֶם.
theological_decisions:
- issue: Portée générique de אָדָם
  choice: être humain
  alternative: homme
  rationale: אָדָם ne désigne pas ici un homme de sexe masculin, mais l’être humain en général. « Être humain » préserve cette portée sans introduire une restriction absente de l’hébreu.
- issue: Sens de la sainteté de l’huile pour Israël
  choice: restera saint pour vous
  alternative: sera sacré à vos yeux
  rationale: La formulation conserve la sainteté objective de l’huile et sa relation normative envers les destinataires, sans réduire la phrase à leur perception subjective.
translation_notes:
  register: Français international moderne, digne et direct. Le futur à valeur prescriptive convient au contexte légal. La formulation évite le terme plus technique « formule » et le registre plus familier de « recette ».
