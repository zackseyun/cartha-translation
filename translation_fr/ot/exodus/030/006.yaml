  text: וְ/נָתַתָּ֤ה אֹת/וֹ֙ לִ/פְנֵ֣י הַ/פָּרֹ֔כֶת אֲשֶׁ֖ר עַל אֲרֹ֣ן הָ/עֵדֻ֑ת לִ/פְנֵ֣י הַ/כַּפֹּ֗רֶת אֲשֶׁר֙ עַל הָ֣/עֵדֻ֔ת אֲשֶׁ֛ר אִוָּעֵ֥ד לְ/ךָ֖ שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/006.yaml
  text: And you shall place it before the veil that is before the ark of the testimony[a], before the mercy seat that is over the testimony[b], where I will meet with you.
translation:
  language: fr
  text: Tu le placeras devant le voile qui est devant l’arche du Témoignage, devant le propitiatoire[a] qui est au-dessus du Témoignage, là où je te rencontrerai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le couvercle d’expiation ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Tu le placeras
  rationale: Le verbe נתן a ici le sens contextuel de mettre ou placer. Le futur français exprime naturellement l’instruction adressée à Moïse.
- source_word: לִפְנֵי
  choice: devant
  rationale: Ce choix rend clairement le rapport spatial et conserve la répétition du terme hébreu dans les deux propositions.
- source_word: הַפָּרֹכֶת
  choice: le voile
  rationale: « Voile » est le terme cultuel précis et usuel pour la séparation intérieure du sanctuaire.
- source_word: אֲרֹן הָעֵדֻת
  choice: l’arche du Témoignage
  rationale: Le texte porte עֵדוּת, « témoignage », et non בְּרִית, « alliance ». La majuscule indique ici le dépôt sacré désigné par ce terme.
- source_word: הַכַּפֹּרֶת
  choice: le propitiatoire
  rationale: Terme cultuel français consacré pour le couvercle d’or placé sur l’arche; une note donne une formulation descriptive plus immédiatement transparente.
- source_word: הָעֵדֻת
  choice: le Témoignage
  rationale: La répétition lexicale de l’hébreu est maintenue sans substituer « alliance », terme absent du verset.
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: là où je te rencontrerai
  rationale: Cette formulation rend le nifal de יעד comme une rencontre fixée par Dieu et conserve explicitement שָׁמָּה, « là ».
theological_decisions:
- issue: Sens cultuel de הַכַּפֹּרֶת
  choice: le propitiatoire
  alternative: le couvercle d’expiation
  rationale: « Propitiatoire » identifie traditionnellement et précisément l’objet sans développer dans le corps du texte une théorie particulière de l’expiation. La variante descriptive est signalée en note.
- issue: Désignation עֵדוּת dans la formule de l’arche
  choice: Témoignage
  alternative: alliance
  rationale: Le mot hébreu signifie « témoignage ». Employer « alliance » harmoniserait le passage avec une formule traditionnelle au lieu de traduire le lexème effectivement présent.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe répétitive du texte hébreu est conservée puisqu’elle précise la disposition spatiale des objets. « Propitiatoire » est un terme technique, mais établi; la note en explicite le sens. Le pronom « le » renvoie à l’autel de l’encens mentionné au verset précédent.
