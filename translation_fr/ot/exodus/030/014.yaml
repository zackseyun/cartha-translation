- from: Tous ceux qui passent parmi les recensés[a], depuis l’âge de vingt ans, donneront la contribution de Yahweh.
  to: Tous ceux qui passent parmi les recensés[a], à partir de l’âge de vingt ans, donneront la contribution destinée à Yahweh.
  rationale: La révision conserve l’ambiguïté procédurale de l’expression hébraïque dans le texte et la note, tout en clarifiant en français que la contribution est destinée à Yahweh. Elle formule aussi plus explicitement le seuil d’âge inclusif, sans modifier le sens.
