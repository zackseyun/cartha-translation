review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : le verset vise chaque personne associée au dénombrement, âgée de vingt ans et plus, et prescrit le versement de la contribution consacrée à Yahweh. Toutefois, « la contribution de Yahweh » est ambigu en français : il peut s’agir d’une contribution appartenant à Yahweh plutôt que d’une contribution qui lui est destinée. Le complément doit être explicité sans ajouter d’interprétation.'
  naturalness: « Tous ceux qui passent parmi les recensés » est lisible, quoique l’image reste volontairement inhabituelle; la note explique correctement l’idiome. « À partir de l’âge de vingt ans » exprime plus naturellement et sans équivoque le seuil inclusif et sa continuation au-delà.
  terminology: « Recensés », « contribution » et « Yahweh » conviennent. « Contribution destinée à Yahweh » rend clairement le génitif construct de תְּרוּמַת יְהוָה sans imposer le terme technique plus étroit d’« offrande ».
  issues:
  - severity: medium
    issue: Ambiguïté de « la contribution de Yahweh »
    rationale: Le syntagme français peut se comprendre comme une contribution possédée ou fournie par Yahweh. En hébreu, תְּרוּמַת יְהוָה désigne la contribution mise à part pour Yahweh; « destinée à Yahweh » rend cette relation clairement.
  - severity: low
    issue: Seuil d’âge formulé de façon moins explicite
    rationale: « Depuis l’âge de vingt ans » est possible, mais « à partir de l’âge de vingt ans » rend plus nettement la formule « vingt ans et au-dessus ».
  revised_text: Tous ceux qui passent parmi les recensés[a], à partir de l’âge de vingt ans, donneront la contribution destinée à Yahweh.
  revised_footnotes:
