source:
  edition: WLC
  text: כֹּ֗ל הָ/עֹבֵר֙ עַל הַ/פְּקֻדִ֔ים מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָ֑עְלָ/ה יִתֵּ֖ן תְּרוּמַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/014.yaml
  text: Everyone who passes over to those who are counted[a], from twenty years old and upward, shall give Yahweh’s contribution.
translation:
  language: fr
  text: Tous ceux qui passent parmi les recensés[a], à partir de l’âge de vingt ans, donneront la contribution destinée à Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « passent vers ceux qui sont dénombrés ». L’hébreu parle littéralement de passer par rapport aux recensés, probablement en référence à la procédure de recensement.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל הָעֹבֵר
  choice: Tous ceux qui passent
  rationale: כֹּל donne une portée distributive au participe הָעֹבֵר. Le pluriel français est naturel tout en conservant l’image concrète du passage.
- source_word: עַל הַפְּקֻדִים
  choice: parmi les recensés
  rationale: Dans ce contexte, הַפְּקֻדִים désigne les personnes dénombrées ou inscrites lors du recensement. Avec עֹבֵר עַל, « passent parmi » conserve l’idiome procédural sans le réduire à « sont recensés ».
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: depuis l’âge de vingt ans
  rationale: Cette formulation exprime naturellement en français le seuil inclusif de vingt ans et au-delà.
- source_word: יִתֵּן
  choice: donneront
  rationale: L’imparfait hébreu a ici une valeur prescriptive. Le futur français convient au registre juridique et s’accorde avec le sujet collectif rendu au pluriel.
- source_word: תְּרוּמַת
  choice: la contribution
  rationale: תְּרוּמָה désigne ce qui est prélevé et remis à Yahweh. « Contribution » convient particulièrement au paiement lié au recensement sans imposer une nuance rituelle plus étroite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le tétragramme; la translittération conserve le nom propre sans le remplacer par un titre.
- issue: Degré d’explicitation de l’idiome du recensement
  choice: passent parmi les recensés
  alternative: sont recensés
  rationale: Le choix retenu préserve l’image hébraïque du passage associée à la procédure de dénombrement, tout en indiquant clairement qu’il s’agit des personnes recensées.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve l’image inhabituelle du passage dans l’idiome hébreu, avec une note pour signaler son ambiguïté, et emploie un futur à valeur prescriptive adapté à une instruction juridique.
