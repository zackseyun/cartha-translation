  text: and the altar of burnt offering with all its utensils[a], and the basin with its stand.
translation:
  language: fr
  text: l’autel des holocaustes avec tous ses ustensiles, ainsi que la cuve avec son support.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: l’autel des holocaustes
  rationale: מִזְבַּח désigne l’autel et הָעֹלָה l’holocauste, sacrifice entièrement brûlé. « L’autel des holocaustes » est l’appellation française naturelle et consacrée, tout en préservant la terminologie sacrificielle.
- source_word: כָּל כֵּלָיו
  choice: tous ses ustensiles
  rationale: כְּלִי peut désigner un objet, un récipient ou un instrument. Dans ce contexte cultuel, « ustensiles » est clair et suffisamment large; le suffixe renvoie à l’autel.
- source_word: הַכִּיֹּר
  choice: la cuve
  rationale: כִּיּוֹר désigne ici le grand récipient destiné aux ablutions du sanctuaire. « Cuve » est moderne et convient mieux à cet équipement cultuel que le terme vieilli « bassin d’airain » ou « lavoir ».
- source_word: כַּנּוֹ
  choice: son support
  rationale: כֵּן désigne la structure sur laquelle repose la cuve. « Support » exprime sa fonction sans préciser indûment s’il s’agit d’un socle ou d’un pied.
- source_word: וְאֶת
  choice: avec … ainsi que
  rationale: La répétition de וְאֶת coordonne les objets d’une liste gouvernée par le contexte précédent. La variation « avec … ainsi que » produit une énumération naturelle en français sans donner de valeur lexicale au marqueur d’objet אֶת.
