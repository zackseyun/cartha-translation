  text: וְ/לָקַחְתָּ֞ אֶת כֶּ֣סֶף הַ/כִּפֻּרִ֗ים מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/נָתַתָּ֣ אֹת֔/וֹ עַל עֲבֹדַ֖ת אֹ֣הֶל מוֹעֵ֑ד וְ/הָיָה֩ לִ/בְנֵ֨י יִשְׂרָאֵ֤ל לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/016.yaml
  text: You shall take the atonement money from the sons of Israel and give it for the service of the tent of meeting[a], and it shall be for the sons of Israel as a memorial before Yahweh[b], to make atonement for your lives.
translation:
  language: fr
  text: Tu prendras l’argent de l’expiation des fils d’Israël[a] et tu le donneras pour le service de la tente de la rencontre. Cet argent sera pour les fils d’Israël un mémorial devant Yahweh, afin de faire l’expiation pour vos vies[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Israélites » ou « des enfants d’Israël ». L’hébreu dit littéralement « des fils d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « pour vos âmes ». Dans ce contexte, l’expression peut aussi désigner « vos vies » ou « vous-mêmes »; elle ne suppose pas une conception dualiste de l’être humain.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף הַכִּפֻּרִים
  choice: l’argent de l’expiation
  rationale: כֶּסֶף désigne ici l’argent versé lors du recensement, et הַכִּפֻּרִים le rattache à l’expiation. Cette formulation naturelle conserve la portée cultuelle du terme sans réduire d’emblée le paiement à une simple rançon.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: auprès des fils d’Israël
  rationale: מֵאֵת indique la provenance, tandis que בְּנֵי יִשְׂרָאֵל signifie formellement « fils d’Israël ». « Auprès de » convient idiomatiquement à la collecte d’une somme.
- source_word: עַל עֲבֹדַת אֹהֶל מוֹעֵד
  choice: pour le service de la tente de la rencontre
  rationale: עַל exprime ici l’affectation de l’argent; עֲבֹדָה désigne le service ou le travail lié au sanctuaire. « Tente de la rencontre » rend אֹהֶל מוֹעֵד sans suggérer seulement un horaire fixé.
- source_word: וְהָיָה ... לְזִכָּרוֹן
  choice: Il servira de mémorial
  rationale: זִכָּרוֹן désigne ce qui maintient le souvenir ou sert de rappel dans la présence divine. « Servira de mémorial » est clair et digne en français actuel.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: La formule signifie « dans la présence de » Dieu; « devant » conserve la formulation cultuelle concise de l’hébreu.
- source_word: לְכַפֵּר
  choice: afin de faire l’expiation
  rationale: Le piel de כפר appartient ici au vocabulaire cultuel. « Faire l’expiation » en préserve le sens sans préciser au-delà du texte le mécanisme théologique.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: pour vos vies
  rationale: נֶפֶשׁ désigne ici les personnes dans leur vie, et non une âme conçue comme partie immatérielle distincte. « Vos vies » convient au contexte du paiement protecteur lié au recensement.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » présente le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Désignation collective בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le choix principal conserve la forme masculine et généalogique de l’hébreu, qui désigne collectivement le peuple de l’alliance; la note signale les formulations françaises plus englobantes.
- issue: Portée de l’expiation liée au paiement
  choice: faire l’expiation pour vos vies
  alternative: faire expiation pour vous-mêmes
  rationale: La traduction maintient le vocabulaire cultuel et le passage de la troisième personne (« les fils d’Israël ») à la deuxième (« vos »), sans élaborer une théorie particulière de l’expiation.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète l’adresse à Moïse, tandis que « vos » reprend le pluriel hébreu visant les Israélites. Le vocabulaire cultuel « expiation », « service » et « mémorial » est conservé, mais la syntaxe reste accessible.
