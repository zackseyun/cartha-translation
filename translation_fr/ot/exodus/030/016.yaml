revisions:
- from: Tu prendras l’argent de l’expiation auprès des fils d’Israël[a] et tu le donneras pour le service de la tente de la rencontre. Il servira de mémorial pour les fils d’Israël devant Yahweh, afin de faire l’expiation pour vos vies[b].
  to: Tu prendras l’argent de l’expiation des fils d’Israël[a] et tu le donneras pour le service de la tente de la rencontre. Cet argent sera pour les fils d’Israël un mémorial devant Yahweh, afin de faire l’expiation pour vos vies[b].
  rationale: La révision corrige la glose erronée de la note b, améliore l’expression de la provenance de l’argent et explicite le référent de « cet argent ». Elle conserve le vocabulaire cultuel, le nom divin, l’ambiguïté contrôlée de נפשות et l’alternance source entre « fils d’Israël » et le possessif pluriel « vos ».
