    text: Ou « des Israélites » ou « des enfants d’Israël ». L’hébreu dit littéralement « des fils d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « pour vos âmes ». Dans ce contexte, l’expression peut aussi désigner « vos vies » ou « vous-mêmes »; elle ne suppose pas une conception dualiste de l’être humain.
    reason: lexical_alternative
  revision_rationale: La révision corrige la glose erronée de la note b, améliore l’expression de la provenance de l’argent et explicite le référent de « cet argent ». Elle conserve le vocabulaire cultuel, le nom divin, l’ambiguïté contrôlée de נפשות et l’alternance source entre « fils d’Israël » et le possessif pluriel « vos ».
