  text: וְ/קִדַּשְׁתָּ֣ אֹתָ֔/ם וְ/הָי֖וּ קֹ֣דֶשׁ קָֽדָשִׁ֑ים כָּל הַ/נֹּגֵ֥עַ בָּ/הֶ֖ם יִקְדָּֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/029.yaml
  text: You shall consecrate them[a], and they shall be most holy. Whatever touches them shall become holy.
translation:
  language: fr
  text: Tu les consacreras, et ils seront très saints. Tout ce qui les touchera deviendra saint.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְקִדַּשְׁתָּ
  choice: Tu les consacreras
  rationale: Au piel, קדשׁ signifie couramment consacrer, c’est-à-dire mettre à part comme saint. « Consacrer » est naturel et précis dans ce contexte cultuel.
- source_word: וְהָיוּ קֹדֶשׁ קָדָשִׁים
  choice: et ils seront très saints
  rationale: La construction קֹדֶשׁ קָדָשִׁים exprime le degré suprême de sainteté. Dans cet emploi prédicatif, « très saints » est clair et naturel, sans évoquer à tort le lieu appelé « Saint des saints ».
- source_word: כָּל הַנֹּגֵעַ בָּהֶם
  choice: Tout ce qui les touchera
  rationale: La tournure hébraïque est générique et peut viser une personne ou une chose. « Tout ce qui » en préserve la portée large.
- source_word: יִקְדָּשׁ
  choice: deviendra saint
  rationale: 'Le qal imparfait peut ici être compris dans un sens résultatif ou inchoatif : le contact entraîne l’entrée dans un état de sainteté. « Deviendra saint » rend explicitement ce changement d’état sans en préciser les conséquences.'
theological_decisions:
- issue: Nature de la sainteté acquise par contact
  choice: Le texte affirme que ce qui touche les objets consacrés devient saint, sans préciser si cette sainteté est bénéfique, dangereuse ou assortie de restrictions.
  alternative: Comprendre soit une consécration positive, soit l’entrée dans une sphère sacrée qui impose des restrictions ou présente un danger.
  rationale: L’hébreu dit simplement יִקְדָּשׁ. La traduction conserve cette tension rituelle et théologique au lieu de la résoudre à partir d’autres passages.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur simple maintient la portée prescriptive et résultative de l’instruction. Aucun marqueur de note n’est nécessaire, puisque le sens résultatif retenu est directement exprimé dans le texte.
