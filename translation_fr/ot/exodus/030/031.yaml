  text: And you shall speak to the sons of Israel, saying, ‘This shall be a holy anointing oil to me throughout your generations.’
translation:
  language: fr
  text: 'Tu diras aux Israélites : « Ce sera pour moi une huile d’onction sacrée, pour toutes vos générations. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Équivalent français naturel de l’expression littérale « les fils d’Israël » lorsqu’elle désigne collectivement le peuple.
- source_word: שֶׁמֶן מִשְׁחַת קֹדֶשׁ
  choice: une huile sainte destinée à l’onction
  rationale: 'Rend la chaîne nominale hébraïque en français clair : une huile consacrée, employée pour l’onction. Cette formulation évite l’ambiguïté peu naturelle de « huile d’onction sainte ».'
- source_word: לִי
  choice: pour moi
  rationale: Conserve explicitement le rapport au locuteur divin exprimé par לִי, sans le réduire à une simple idée d’appartenance.
- source_word: לְדֹרֹתֵיכֶם
  choice: de génération en génération
  rationale: Expression française idiomatique qui traduit la continuité à travers les générations du peuple.
theological_decisions:
- issue: Caractère sacré et destination divine de l’huile
  choice: « une huile sainte destinée à l’onction » et « pour moi »
  alternative: « mon huile sainte d’onction »
  rationale: Le texte distingue la sainteté de l’huile et son rapport à Dieu. La traduction retenue préserve ces deux éléments sans transformer לִי en simple possessif.
translation_notes:
  register: Français moderne, international et digne. « Tu diras » restitue naturellement l’instruction directe adressée à Moïse; les paroles à transmettre sont introduites par deux-points et guillemets français.
