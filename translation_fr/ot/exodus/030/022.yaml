lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Puis… parla
  rationale: Le waw consécutif fait progresser le récit, tandis que דִּבֵּר désigne ici l’acte de parler. Cette tournure est naturelle en français et convient à la formule récurrente du discours divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin יהוה comme un nom propre plutôt que de lui substituer le titre traditionnel « le SEIGNEUR ».
- source_word: אֶל־מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל marque le destinataire de la parole; « à Moïse » est l’équivalent français idiomatique.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'L’infinitif לֵאמֹר introduit le contenu du discours qui commence au verset suivant. « En ces termes : » restitue clairement cette fonction sans le calque peu naturel « disant ».'
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » préserve le nom personnel tout en laissant une note signaler le rendu traditionnel.
translation_notes:
  register: Français international moderne, sobre et digne. La formule hébraïque est rendue idiomatiquement; les deux-points annoncent la parole qui suit au verset 23.
