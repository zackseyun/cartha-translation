  text: וּ/בְ/הַעֲלֹ֨ת אַהֲרֹ֧ן אֶת הַ/נֵּרֹ֛ת בֵּ֥ין הָ/עֲרְבַּ֖יִם יַקְטִירֶ֑/נָּה קְטֹ֧רֶת תָּמִ֛יד לִ/פְנֵ֥י יְהוָ֖ה לְ/דֹרֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/008.yaml
  text: And when Aaron sets up the lamps at twilight[a], he shall burn it, a regular incense[b], before Yahweh throughout your generations.
translation:
  language: fr
  text: Quand Aaron disposera les lampes au crépuscule[a], il fera brûler de l’encens régulièrement[b] devant Yahweh, de génération en génération.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « entre les deux soirs », expression hébraïque désignant la période du soir ou du crépuscule.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un encens continuel » ou « un encens perpétuel ». Le terme hébreu peut souligner la régularité durable du rite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲלֹת
  choice: Quand … disposera
  rationale: La préposition suivie de l’infinitif construit introduit une proposition temporelle. Le hifil de עלה appliqué aux lampes peut évoquer le fait d’en faire monter la flamme, donc de les allumer, mais aussi leur préparation rituelle; « disposera » conserve cette nuance sans réduire le geste à l’allumage.
- source_word: הַנֵּרֹת
  choice: les lampes
  rationale: נֵרֹת désigne les lampes du mobilier du sanctuaire.
- source_word: בֵּין הָעַרְבַּיִם
  choice: au crépuscule
  rationale: L’expression signifie littéralement « entre les deux soirs » et désigne la période du soir ou du crépuscule. La formulation idiomatique est donnée dans le texte et le sens littéral en note.
- source_word: יַקְטִירֶנָּה
  choice: il en fera brûler
  rationale: Le hifil de קטר signifie faire fumer ou brûler comme offrande. Le suffixe féminin singulier renvoie à קְטֹרֶת, « encens »; le pronom « en » produit une formulation française naturelle et rattache l’action à l’encens nommé ensuite.
- source_word: קְטֹרֶת תָּמִיד
  choice: ce sera un encens offert régulièrement
  rationale: קְטֹרֶת désigne l’encens, tandis que תָּמִיד exprime ici la régularité durable du rite plutôt qu’une combustion ininterrompue. L’ajout explicatif « offert » rend naturellement en français le sens cultuel porté par le verbe.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי indique la présence cultuelle devant Dieu; le nom divin est translittéré « Yahweh ».
- source_word: לְדֹרֹתֵיכֶם
  choice: de génération en génération
  rationale: L’expression indique que la prescription demeure au fil des générations successives; cette tournure est naturelle en français moderne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » conserve le nom propre de l’alliance au lieu de lui substituer un titre.
- issue: Portée de תָּמִיד dans le rite de l’encens
  choice: offert régulièrement
  alternative: encens perpétuel; encens continuel
  rationale: Le contexte prescrit une action répétée à des moments déterminés, non nécessairement une combustion sans interruption. La note maintient l’autre nuance possible.
translation_notes:
  register: Français international moderne, clair et digne. Le futur convient à la prescription rituelle. « Disposera » préserve l’ambiguïté entre la préparation des lampes et leur allumage; les notes rendent visibles les expressions hébraïques dont la portée ne doit pas être artificiellement réduite.
