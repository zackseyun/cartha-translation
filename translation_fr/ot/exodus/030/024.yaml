lexical_decisions:
- source_word: קִדָּה
  choice: casse
  rationale: Le terme désigne la casse, une écorce aromatique employée en parfumerie. « Casse » est le nom français précis de cette substance.
- source_word: חֲמֵשׁ מֵאוֹת
  choice: cinq cents
  rationale: Rendu direct du nombre cardinal indiquant la quantité de casse.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: selon le sicle du sanctuaire
  rationale: La locution indique l’étalon de poids selon lequel la quantité doit être mesurée; cette formulation le préserve naturellement en français.
- source_word: שֶׁמֶן זַיִת
  choice: huile d’olive
  rationale: Équivalent idiomatique naturel en français de cette construction hébraïque.
- source_word: הִין
  choice: un hin
  rationale: Le nom de cette ancienne mesure de capacité est conservé afin de ne pas substituer une équivalence moderne incertaine.
- source_word: וְ
  choice: et / ainsi que
  rationale: Les conjonctions relient ces ingrédients à ceux de la liste précédente; la variation française évite une coordination lourde sans changer le rapport syntaxique.
