  text: וְ/צִפִּיתָ֨ אֹת֜/וֹ זָהָ֣ב טָה֗וֹר אֶת גַּגּ֧/וֹ וְ/אֶת קִירֹתָ֛י/ו סָבִ֖יב וְ/אֶת קַרְנֹתָ֑י/ו וְ/עָשִׂ֥יתָ לּ֛/וֹ זֵ֥ר זָהָ֖ב סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/003.yaml
  text: You shall overlay it with pure gold—its top[a], its walls all around, and its horns—and you shall make for it a gold molding all around.
translation:
  language: fr
  text: Tu le plaqueras d’or pur — son dessus, ses parois tout autour et ses cornes — et tu lui feras une moulure[a] d’or tout autour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bordure » ou « couronnement ». Le mot hébreu zēr peut désigner un rebord, une bordure ou une moulure évoquant une couronne.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ
  choice: tu le plaqueras
  rationale: Dans cette construction, צפה désigne l’application d’un revêtement métallique. « Plaquer d’or » exprime précisément cette opération en français moderne.
- source_word: זָהָב טָהוֹר
  choice: d’or pur
  rationale: L’expression désigne de l’or de grande pureté; « or pur » est l’équivalent français naturel et consacré.
- source_word: גַּגּוֹ
  choice: son dessus
  rationale: גג signifie souvent « toit », mais, pour un petit autel, il désigne ici sa surface supérieure; « dessus » est idiomatique et concret.
- source_word: קִירֹתָיו
  choice: ses parois
  rationale: Le terme signifie littéralement « ses murs ». « Parois » conserve l’image des surfaces verticales tout en convenant naturellement à un objet de mobilier cultuel.
- source_word: סָבִיב
  choice: tout autour
  rationale: Cette expression rend la disposition circulaire ou complète indiquée par l’adverbe hébreu.
- source_word: קַרְנֹתָיו
  choice: ses cornes
  rationale: Le terme cultuel désigne les saillies en forme de cornes aux angles de l’autel. Le rendu littéral préserve cette caractéristique importante.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: et tu lui feras
  rationale: Le pronom introduit par ל indique qu’un élément doit être réalisé pour l’autel; la tournure française « lui faire » le rend naturellement.
- source_word: זֵר זָהָב
  choice: une moulure d’or
  rationale: זֵר désigne une bordure saillante ou ornementale autour du mobilier sacré. « Moulure » décrit cette pièce sans imposer l’image royale que pourrait suggérer « couronne ».
- source_word: סָבִיב
  choice: tout autour
  rationale: La répétition est conservée afin de rendre celle de l’hébreu et de préciser que la moulure entourait l’autel.
theological_decisions:
- issue: Terminologie du mobilier cultuel
  choice: Conserver « cornes » et rendre זֵר par « moulure »
  alternative: Rendre זֵר par « couronne », « bordure » ou « rebord »
  rationale: Le verset décrit la fabrication de l’autel et n’affirme rien au sujet de la royauté. « Cornes » maintient le terme cultuel établi, tandis que « moulure » décrit clairement l’élément physique. La note conserve l’ambiguïté lexicale de זֵר.
translation_notes:
  register: Français international moderne, digne et concret. Le tutoiement injonctif correspond au discours direct de Dieu à Moïse. Les tirets structurent la liste des surfaces à plaquer sans alourdir la phrase.
