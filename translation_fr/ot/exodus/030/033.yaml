id: EXO.30.33
reference: Exodus 30:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִ֚ישׁ אֲשֶׁ֣ר יִרְקַ֣ח כָּמֹ֔/הוּ וַ/אֲשֶׁ֥ר יִתֵּ֛ן מִמֶּ֖/נּוּ עַל זָ֑ר וְ/נִכְרַ֖ת מֵ/עַמָּֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/033.yaml
  text: Whoever compounds any like it[a], or puts any of it on a stranger[b], shall be cut off from his people.
translation:
  language: fr
  text: Quiconque composera un mélange semblable ou en appliquera sur une personne non autorisée[a] sera retranché de son peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur un étranger », « sur une personne extérieure » ou « sur un profane ». Dans ce contexte cultuel, l’hébreu zar désigne généralement une personne qui n’est pas autorisée à recevoir ou à employer ce qui est sacré.
    reason: lexical_alternative
  - marker: b
    text: « Sera retranché de son peuple » est une formule juridique liée à l’alliance ; le texte ne précise pas ici la manière exacte dont cette sanction doit s’accomplir.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: Quiconque
  rationale: La tournure hébraïque, littéralement « un homme qui », a ici une portée juridique générale. « Quiconque » l’exprime naturellement en français.
- source_word: יִרְקַח
  choice: composera
  rationale: Le verbe רקח désigne la préparation d’un parfum ou d’un mélange aromatique. « Composer » conserve cette nuance technique et cultuelle.
- source_word: כָּמֹהוּ
  choice: un mélange semblable
  rationale: L’expression renvoie à l’huile d’onction sacrée décrite dans le contexte. Cette formulation rend la similitude sans préciser au-delà du texte qu’il s’agit d’une reproduction strictement identique.
- source_word: וַאֲשֶׁר יִתֵּן מִמֶּנּוּ
  choice: ou en appliquera
  rationale: Dans ce contexte, נתן suivi de מן signifie mettre ou appliquer une partie de cette huile. « En appliquera » est naturel en français et garde la valeur partitive du suffixe.
- source_word: עַל זָר
  choice: sur une personne non autorisée
  rationale: Dans cette loi cultuelle, זָר désigne une personne qui n’est pas habilitée à recevoir l’huile sacrée, plutôt qu’un étranger au sens ethnique.
- source_word: וְנִכְרַת
  choice: sera retranché
  rationale: « Être retranché » conserve la formule juridique et d’alliance sans déterminer le mode exact de la sanction.
- source_word: מֵעַמָּיו
  choice: de son peuple
  rationale: Cette traduction directe préserve l’idée d’une exclusion grave de la communauté à laquelle appartient le coupable.
theological_decisions:
- issue: Sens de זָר dans une loi cultuelle
  choice: personne non autorisée
  alternative: étranger ; personne extérieure ; profane
  rationale: Le contexte porte sur l’accès légitime à l’huile d’onction sacrée, non sur l’origine ethnique. La formulation retenue rend cette limite cultuelle sans introduire une catégorie confessionnelle particulière.
- issue: Portée de וְנִכְרַת מֵעַמָּיו
  choice: sera retranché de son peuple
  alternative: sera exclu de son peuple ; sera mis à mort
  rationale: L’hébreu emploie une formule juridique sévère sans indiquer ici si son exécution relève de la mort, d’un acte divin ou d’une exclusion communautaire. La traduction maintient cette indétermination.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe juridique reste concise. « Personne non autorisée » évite que « étranger » soit compris uniquement dans un sens ethnique, tandis que les variantes sont conservées en note.
