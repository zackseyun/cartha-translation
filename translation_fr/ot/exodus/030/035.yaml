id: EXO.30.35
reference: Exodus 30:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ אֹתָ/הּ֙ קְטֹ֔רֶת רֹ֖קַח מַעֲשֵׂ֣ה רוֹקֵ֑חַ מְמֻלָּ֖ח טָה֥וֹר קֹֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/035.yaml
  text: And you shall make it into incense[a], a perfume blended by the work of a perfumer, salted, pure[c][b], holy.
translation:
  language: fr
  text: Tu en feras un encens[a], un mélange aromatique préparé selon l’art du parfumeur, salé[b], pur et saint[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une composition parfumée » ou « un mélange aromatique ». L’hébreu souligne une préparation aromatique soigneusement composée.
    reason: lexical_alternative
  - marker: b
    text: Ou « mêlé de sel ». Le mot hébreu est dérivé de la racine qui désigne le sel.
    reason: lexical_alternative
  - marker: c
    text: Ou « sacré ». L’hébreu dit ici simplement « saint », et non « très saint ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ אֹתָהּ
  choice: Tu en feras
  rationale: Dans ce contexte d’instructions, la forme verbale exprime un ordre. « En » reprend naturellement en français les substances énumérées au verset précédent.
- source_word: קְטֹרֶת
  choice: un encens
  rationale: Le nom désigne ici la préparation aromatique sacrée destinée à être brûlée comme encens.
- source_word: רֹקַח מַעֲשֵׂה רוֹקֵחַ
  choice: un mélange aromatique préparé selon l’art du parfumeur
  rationale: Cette formulation rend à la fois l’idée d’une composition aromatique et celle du savoir-faire spécialisé du fabricant de parfums, sans reproduire lourdement la répétition de la racine hébraïque.
- source_word: מְמֻלָּח
  choice: salé
  rationale: Le participe passif dérivé de la racine liée au sel signifie le plus naturellement « salé »; le terme concret est conservé malgré une certaine ambiguïté lexicale.
- source_word: טָהוֹר
  choice: pur
  rationale: « Pur » convient au contexte matériel et cultuel et rend mieux la portée du terme que le français ordinaire « propre ».
- source_word: קֹדֶשׁ
  choice: saint
  rationale: Le mot indique que l’encens est mis à part pour Dieu. « Saint » traduit directement le terme sans lui donner la valeur renforcée de « très saint ».
theological_decisions:
- issue: Statut cultuel de l’encens
  choice: saint
  alternative: sacré; très saint
  rationale: L’hébreu porte simplement קֹדֶשׁ, « saint ». La traduction évite donc d’introduire ici la catégorie plus forte de « très saint », tout en conservant explicitement la consécration cultuelle.
translation_notes:
  register: Français international moderne, digne et direct. Le futur à valeur injonctive maintient le ton législatif. « Selon l’art du parfumeur » exprime naturellement le travail spécialisé évoqué par l’hébreu; les adjectifs finaux restent brefs et solennels.
