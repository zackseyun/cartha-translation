  text: And you shall make an altar for burning incense[a]; you shall make it of acacia wood.
translation:
  language: fr
  text: Tu feras un autel pour y brûler de l’encens[a] ; tu le feras en bois d’acacia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire plus brièvement : « un autel de l’encens » ou « un autel des parfums ». L’hébreu exprime littéralement l’idée d’un « autel pour brûler de l’encens ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Le qatal qal à la 2e personne masculine singulière, précédé de la conjonction dans une suite d’instructions, exprime ici une directive. Le futur français est naturel dans ce registre prescriptif.
- source_word: מִזְבֵּחַ
  choice: un autel
  rationale: « Autel » est l’équivalent français courant du nom hébreu ; l’article indéfini convient lors de l’introduction de cet objet.
- source_word: מִקְטַר קְטֹרֶת
  choice: destiné à brûler de l’encens
  rationale: Cette formulation rend explicitement la fonction indiquée par la construction hébraïque, sans la réduire d’emblée au titre plus compact « autel des parfums ».
- source_word: עֲצֵי שִׁטִּים
  choice: bois d’acacia
  rationale: La tournure hébraïque désigne du bois provenant d’acacias ; « bois d’acacia » est l’expression française naturelle et précise.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: tu le feras
  rationale: La reprise du verbe et le pronom objet sont conservés afin de refléter la reformulation insistante de l’instruction avant l’indication du matériau.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le futur prescriptif maintient le ton des instructions cultuelles, tandis que la répétition « tu feras… tu le feras » préserve la structure hébraïque.
