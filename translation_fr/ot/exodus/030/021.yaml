source:
  edition: WLC
  text: וְ/רָחֲצ֛וּ יְדֵי/הֶ֥ם וְ/רַגְלֵי/הֶ֖ם וְ/לֹ֣א יָמֻ֑תוּ וְ/הָיְתָ֨ה לָ/הֶ֧ם חָק עוֹלָ֛ם ל֥/וֹ וּ/לְ/זַרְע֖/וֹ לְ/דֹרֹתָֽ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/021.yaml
  text: They shall wash their hands and their feet[a], so that they may not die. This shall be a permanent statute for them[b], for him and for his offspring throughout their generations.
translation:
  language: fr
  text: Ils se laveront les mains et les pieds, afin de ne pas mourir. Ce sera pour eux une prescription permanente[a], pour lui[b] et pour sa descendance, de génération en génération.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prescription perpétuelle ». L’expression hébraïque חָק עוֹלָם est une formule juridique désignant une règle durable.
    reason: lexical_alternative
  - marker: b
    text: « Lui » désigne Aaron dans le contexte immédiat.
    reason: cross_reference
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: Ils se laveront
  rationale: Dans ce contexte juridique et rituel, la forme verbale coordonnée a une valeur injonctive. Le futur français exprime naturellement une prescription solennelle.
- source_word: יְדֵיהֶם וְרַגְלֵיהֶם
  choice: les mains et les pieds
  rationale: Traduction directe qui conserve la précision rituelle des deux parties du corps.
- source_word: וְלֹא יָמֻתוּ
  choice: afin de ne pas mourir
  rationale: Rend le lien de finalité ou de conséquence entre l’ablution prescrite et la menace de mort, sans réduire la clause à une simple prédiction.
- source_word: חָק עוֹלָם
  choice: une prescription permanente
  rationale: « Prescription » convient à une règle cultuelle imposée, tandis que « permanente » exprime la durée de la formule juridique sans trancher au-delà de sa portée contextuelle.
- source_word: לָהֶם
  choice: pour eux
  rationale: Conserve le pronom pluriel du texte hébreu et son renvoi aux prêtres concernés.
- source_word: לּוֹ
  choice: pour lui
  rationale: Préserve le pronom masculin singulier hébreu plutôt que d’expliciter silencieusement son référent, qui est Aaron dans le contexte immédiat.
- source_word: וּלְזַרְעוֹ
  choice: et pour sa descendance
  rationale: « Descendance » rend naturellement le collectif זֶרַע et désigne la lignée issue de l’homme mentionné.
- source_word: לְדֹרֹתָם
  choice: de génération en génération
  rationale: Formulation française idiomatique exprimant la continuité au fil des générations.
theological_decisions:
- issue: Durée de la prescription cultuelle exprimée par חָק עוֹלָם
  choice: prescription permanente
  alternative: prescription perpétuelle / prescription éternelle
  rationale: La formule hébraïque affirme le caractère durable de l’obligation. « Permanente » en conserve la force tout en évitant d’imposer une définition philosophique de l’éternité que le contexte juridique ne précise pas.
- issue: Référent du singulier לּוֹ
  choice: pour lui, avec identification d’Aaron en note
  alternative: pour Aaron dans le corps du texte
  rationale: Le pronom est maintenu afin de respecter la forme du texte source; la note clarifie le référent fourni par le contexte immédiat sans l’insérer dans le texte.
translation_notes:
  register: Français international moderne, clair et digne. Le futur prescriptif convient au style législatif. La formulation conserve l’alternance du pluriel (« pour eux ») et du singulier (« pour lui ») présente dans l’hébreu, ainsi que la tension du lien entre purification et mort.
