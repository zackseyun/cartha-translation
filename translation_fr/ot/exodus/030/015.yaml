source:
  edition: WLC
  text: הֶֽ/עָשִׁ֣יר לֹֽא יַרְבֶּ֗ה וְ/הַ/דַּל֙ לֹ֣א יַמְעִ֔יט מִֽ/מַּחֲצִ֖ית הַ/שָּׁ֑קֶל לָ/תֵת֙ אֶת תְּרוּמַ֣ת יְהוָ֔ה לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/015.yaml
  text: The rich shall not give more[a], and the poor shall not give less, than the half-shekel, when giving the contribution to Yahweh to make atonement for your lives.
translation:
  language: fr
  text: Le riche ne donnera pas plus d’un demi-sicle, et le pauvre ne donnera pas moins, lors de la remise de la contribution à Yahweh, pour faire l’expiation pour vos vies[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour vos personnes » ou « pour vos âmes ». Le mot hébreu néfesh peut désigner l’âme, la personne ou la vie ; dans ce contexte de paiement lié au recensement, il désigne probablement la vie ou la personne de ceux qui sont comptés.
    reason: 'Alternative lexicale : préserver l’étendue sémantique de נֶפֶשׁ.'
lexical_decisions:
- source_word: הֶעָשִׁיר
  choice: le riche
  rationale: L’adjectif défini est employé comme substantif et désigne ici le membre riche de la communauté, en contraste avec le pauvre.
- source_word: יַרְבֶּה
  choice: ne donnera pas plus
  rationale: Dans le contexte d’une contribution au montant fixé, le verbe signifie qu’il ne faut pas dépasser la somme prescrite.
- source_word: הַדַּל
  choice: le pauvre
  rationale: Le terme désigne une personne de faibles moyens économiques et forme l’opposition naturelle avec « le riche ».
- source_word: יַמְעִיט
  choice: ne donnera pas moins
  rationale: Cette formulation française rend le parallélisme juridique avec « ne donnera pas plus » et exprime clairement l’interdiction de verser une somme inférieure.
- source_word: מִמַּחֲצִית הַשָּׁקֶל
  choice: d’un demi-sicle
  rationale: Après « plus » et « moins », la préposition française « de » exprime naturellement la comparaison avec le montant fixe.
- source_word: לָתֵת
  choice: lorsqu’ils donneront
  rationale: L’infinitif situe la règle dans l’acte de remettre la contribution. Le pluriel français reprend ensemble le riche et le pauvre sans altérer la portée collective.
- source_word: תְּרוּמַת יְהוָה
  choice: la contribution destinée à Yahweh
  rationale: תְּרוּמָה désigne ici une contribution mise à part pour un usage sacré. « Destinée à » rend clairement la relation à Yahweh sans suggérer que la contribution lui appartiendrait au sens matériel ordinaire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: לְכַפֵּר
  choice: afin de faire l’expiation
  rationale: Le verbe appartient au langage cultuel. « Faire l’expiation » en conserve la portée sans imposer une théorie particulière de son mécanisme.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: pour vos vies
  rationale: Dans le contexte du paiement lié au recensement, נֶפֶשׁ renvoie vraisemblablement à la vie ou à la personne de ceux qui sont comptés, et non exclusivement à une âme immatérielle.
theological_decisions:
- issue: Traduction du nom divin YHWH
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte source porte le nom personnel יהוה. « Yahweh » le préserve explicitement et évite de le remplacer par un titre.
- issue: Sens de נֶפֶשׁ dans ce contexte d’expiation et de recensement
  choice: pour vos vies
  alternative: pour vos personnes ; pour vos âmes ; pour vous-mêmes
  rationale: Le contexte vise les personnes ou les vies des Israélites recensés. Cette traduction évite de transformer le verset en affirmation précise sur la constitution de l’être humain, tout en signalant en note l’ambiguïté lexicale réelle.
- issue: Portée de כפר
  choice: faire l’expiation
  alternative: faire propitiation ; obtenir le pardon ; verser une rançon
  rationale: « Faire l’expiation » conserve le langage cultuel et sa tension théologique sans réduire le terme à une explication unique du procédé.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme légal « ne donnera pas plus… ne donnera pas moins » est conservé. « Sicle » maintient l’unité monétaire ancienne, et « contribution » convient mieux au contexte qu’un terme exclusivement sacrificiel.
