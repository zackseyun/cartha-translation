  text: Whoever makes any like it to smell it shall be cut off from his people[a][b].
translation:
  language: fr
  text: Quiconque préparera un encens semblable pour en sentir le parfum sera retranché de son peuple[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour en respirer l’odeur » ou « pour en apprécier le parfum ». L’infinitif hébreu indique que cet encens est préparé afin d’en sentir personnellement la senteur.
    reason: lexical_alternative
  - marker: b
    text: « Sera retranché de son peuple » est une formule juridique courante. Selon le contexte, elle peut évoquer la mort, l’exclusion ou une intervention divine.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: Quiconque
  rationale: Dans cette formulation juridique, אִישׁ est générique et la proposition relative définit toute personne qui commet l’acte visé. « Quiconque » rend naturellement cette portée en français.
- source_word: יַעֲשֶׂה
  choice: préparera
  rationale: Le verbe עשה signifie largement « faire ». Puisqu’il s’agit ici de fabriquer un mélange d’encens, « préparer » est précis et naturel sans ajouter de détail absent du texte.
- source_word: כָמוֹהָ
  choice: de semblable
  rationale: L’expression renvoie à l’encens sacré décrit auparavant. « De semblable » préserve la possibilité d’un mélange comparable sans imposer qu’il soit rigoureusement identique.
- source_word: לְהָרִיחַ בָּהּ
  choice: pour en sentir le parfum
  rationale: L’infinitif indique le but personnel de la préparation. En français, « en sentir le parfum » rend idiomatiquement le verbe ריח avec בָּהּ tout en conservant l’idée de sentir ou d’apprécier cette senteur.
- source_word: וְנִכְרַת
  choice: sera retranché
  rationale: Le nifal de כרת constitue une formule juridique forte. « Sera retranché » en conserve la valeur traditionnelle sans décider s’il s’agit de mort, d’exclusion ou d’une intervention divine.
- source_word: מֵעַמָּיו
  choice: de son peuple
  rationale: עם désigne ici le peuple ou la communauté d’appartenance. « De son peuple » correspond directement à la formule juridique hébraïque.
theological_decisions:
- issue: Sens de la peine « sera retranché de son peuple »
  choice: Conserver la formule « sera retranché de son peuple » sans en préciser le mécanisme.
  alternative: « sera mis à mort », « sera exclu de la communauté » ou « sera supprimé par un jugement divin »
  rationale: La formule hébraïque est sévère, mais elle ne précise pas toujours la manière dont le retranchement s’accomplit. La traduction maintient donc l’ambiguïté juridique et théologique du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le ton juridique du passage. « Préparera » convient au contexte de composition de l’encens, tandis que « retranché » maintient volontairement l’indétermination de la sanction.
