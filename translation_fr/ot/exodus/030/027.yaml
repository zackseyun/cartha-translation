  text: וְ/אֶת הַ/שֻּׁלְחָן֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/אֶת הַ/מְּנֹרָ֖ה וְ/אֶת כֵּלֶ֑י/הָ וְ/אֵ֖ת מִזְבַּ֥ח הַ/קְּטֹֽרֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/027.yaml
  text: and the table and all its utensils[a], and the lampstand and its utensils, and the altar of incense,
translation:
  language: fr
  text: la table et tous ses ustensiles, le porte-lampes et ses ustensiles, ainsi que l’autel des parfums[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’autel de l’encens ».
    reason: Alternative lexicale pour מִזְבַּח הַקְּטֹרֶת ; la note est placée après l’expression qu’elle concerne.
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: la table
  rationale: Le nom hébreu signifie simplement « table » dans ce verset. Le contexte indique qu’il s’agit de la table sacrée du sanctuaire, sans que le texte répète sa désignation complète.
- source_word: כָּל כֵּלָיו
  choice: tous ses ustensiles
  rationale: כְּלִי peut désigner divers objets, récipients ou instruments. « Ustensiles » est ici naturel, suffisamment large et adapté au mobilier du sanctuaire.
- source_word: הַמְּנֹרָה
  choice: le porte-lampes
  rationale: Cette traduction rend la fonction de la מְנוֹרָה sans recourir à une translittération et sans évoquer à tort un chandelier portant des bougies.
- source_word: כֵּלֶיהָ
  choice: ses ustensiles
  rationale: Le même terme général כְּלִי est employé, avec un suffixe féminin renvoyant au porte-lampes.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: l’autel des parfums
  rationale: Le groupe construit désigne l’autel associé à l’encens aromatique. « Autel des parfums » est une formulation française établie et transparente.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La syntaxe conserve la forme d’une énumération poursuivie depuis le verset précédent. « Ainsi que » évite une succession lourde de « et » tout en maintenant la coordination hébraïque.
