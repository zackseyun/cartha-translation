  source_fidelity: 'Le sens de l’hébreu est globalement bien rendu : l’huile mentionnée auparavant est l’instrument de l’onction, et les deux objets sont la tente de la Rencontre et l’arche du témoignage. Toutefois, « faire l’onction sur » introduit une tournure moins directement fidèle à la construction verbale : le texte commande d’oindre ces objets avec l’huile.'
