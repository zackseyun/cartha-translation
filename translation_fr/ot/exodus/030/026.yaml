  terminology: « Oindre », « tente de la Rencontre », « arche » et « témoignage » sont des choix exacts et cohérents. La majuscule à « Rencontre » traite l’expression comme la désignation établie du sanctuaire. La note distingue correctement la formulation traditionnelle « arche de l’alliance » du lexique hébreu du verset.
