  text: With it you shall anoint the tent of meeting and the ark of the testimony[a].
translation:
  language: fr
  text: Tu en oindras la tente de la Rencontre et l’arche du témoignage[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, dans la formulation traditionnelle, « l’arche de l’alliance » ; l’hébreu dit ici « le témoignage ».
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: Tu en feras l’onction
  rationale: Le qatal qal à la 2e personne du masculin singulier, précédé de la conjonction, poursuit ici une série d’instructions. Cette formulation française exprime naturellement l’ordre futur et conserve le sens cultuel précis de משׁח.
- source_word: בּוֹ
  choice: en
  rationale: La préposition avec suffixe masculin singulier renvoie à l’huile d’onction mentionnée dans le contexte précédent. Dans « en faire l’onction », « en » marque naturellement le moyen employé.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Traduction française établie et transparente de la construction hébraïque, désignant la tente où a lieu la rencontre cultuelle.
- source_word: אֲרוֹן
  choice: l’arche
  rationale: Dans le contexte du sanctuaire, « arche » est le terme français conventionnel et exact pour le coffre sacré.
- source_word: הָעֵדֻת
  choice: du témoignage
  rationale: « Témoignage » rend directement עֵדוּת et préserve le terme effectivement employé dans l’hébreu sans le remplacer par « alliance ».
theological_decisions:
- issue: Traduction de אֲרוֹן הָעֵדֻת
  choice: l’arche du témoignage
  alternative: l’arche de l’alliance
  rationale: L’hébreu porte explicitement « témoignage ». La formulation familière « arche de l’alliance » interprète la réalité désignée, mais ne reproduit pas le choix lexical de ce verset; elle est donc signalée en note plutôt qu’introduite dans le texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Faire l’onction sur » évite l’éventuelle ambiguïté de « oindre la tente » tout en conservant le vocabulaire cultuel. Le tutoiement singulier correspond à la forme hébraïque adressée à Moïse.
