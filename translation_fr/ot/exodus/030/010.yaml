    issue: La note traduit מִדַּם par « avec une partie du sang ».
    rationale: La préposition מן signifie littéralement « de/à partir de » et, dans ce contexte, peut avoir une valeur instrumentale (« avec, au moyen de »), mais le texte ne précise pas qu’il ne s’agit que d’une partie du sang. Cette restriction ajoute un élément absent de l’hébreu.
