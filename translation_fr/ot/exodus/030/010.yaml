  text: וְ/כִפֶּ֤ר אַהֲרֹן֙ עַל קַרְנֹתָ֔י/ו אַחַ֖ת בַּ/שָּׁנָ֑ה מִ/דַּ֞ם חַטַּ֣את הַ/כִּפֻּרִ֗ים אַחַ֤ת בַּ/שָּׁנָה֙ יְכַפֵּ֤ר עָלָי/ו֙ לְ/דֹרֹ֣תֵי/כֶ֔ם קֹֽדֶשׁ קָֽדָשִׁ֥ים ה֖וּא לַ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/010.yaml
  text: Aaron shall make atonement on its horns once a year[a]. With the blood of the sin offering of atonement he shall make atonement for it once a year throughout your generations. It is most holy to Yahweh.
translation:
  language: fr
  text: Aaron accomplira le rite d’expiation sur les cornes de l’autel une fois par an. Avec le sang du sacrifice pour le péché offert pour l’expiation[a], il accomplira le rite d’expiation sur l’autel une fois par an, de génération en génération. Cet autel est très saint pour Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec le sang du sacrifice pour le péché des expiations » ; l’expression hébraïque « des expiations » est au pluriel.'
    reason: La note conserve le pluriel de הַכִּפֻּרִים et la construction hébraïque sans introduire l’idée non exprimée d’une partie du sang.
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר
  choice: accomplira le rite d’expiation
  rationale: Dans ce contexte sacerdotal, כפר désigne l’accomplissement rituel de l’expiation. Cette formulation française est plus précise et naturelle que le calque « fera expiation ».
- source_word: קַרְנֹתָיו
  choice: les cornes de l’autel
  rationale: Le suffixe renvoie à l’autel des parfums mentionné dans le contexte. La répétition explicite d’« autel » évite en français une ambiguïté pronominale.
- source_word: אַחַת בַּשָּׁנָה
  choice: une fois par an
  rationale: Équivalent français courant et exact de l’expression distributive hébraïque.
- source_word: מִדַּם
  choice: avec le sang
  rationale: La préposition מן a ici une valeur instrumentale dans le cadre du rite sacrificiel.
- source_word: חַטַּאת
  choice: sacrifice pour le péché
  rationale: Dans ce contexte cultuel, חטאת désigne l’offrande sacrificielle et non le péché abstrait.
- source_word: הַכִּפֻּרִים
  choice: offert pour l’expiation
  rationale: Cette tournure rend naturellement la fonction du sacrifice tout en signalant en note la construction littérale au pluriel.
- source_word: לְדֹרֹתֵיכֶם
  choice: de génération en génération
  rationale: Formulation française idiomatique exprimant la continuité de cette prescription parmi les générations successives.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: très saint
  rationale: Le redoublement construit un superlatif hébraïque. « Très saint » exprime le degré maximal de sainteté sans évoquer à tort le lieu appelé Saint des saints.
- source_word: לַיהוָה
  choice: pour Yahvé
  rationale: La préposition marque ici la relation ou la consécration à Yahvé; « pour » est naturel en français.
theological_decisions:
- issue: Rendu du tétragramme יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: « Yahvé » représente explicitement le nom divin dans un français biblique moderne et distingue celui-ci du titre אֲדֹנָי. La vocalisation exacte ancienne demeure toutefois incertaine.
- issue: Référent de קֹדֶשׁ קָדָשִׁים הוּא
  choice: Cet autel est très saint
  alternative: Ce rite est très saint
  rationale: Le pronom masculin singulier renvoie le plus naturellement à l’autel, également masculin en hébreu, qui demeure le référent de עָלָיו. L’explicitation française évite un pronom flottant.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire sacrificiel traditionnel est conservé, mais le verbe כפר est rendu par une expression rituelle explicite. Les référents implicites de l’hébreu sont précisés lorsque le français l’exige.
