  source_fidelity: 'Le sens général est fidèle : recensement, paiement individuel à Yahweh, rançon « pour sa vie » et prévention d’un fléau sont tous conservés. Toutefois, « selon ceux qui auront été recensés » traduit maladroitement לִפְקֻדֵיהֶם et introduit un antériorité (« auront été ») absente du texte. La formulation révisée rend le sens administratif de « selon leur dénombrement » sans le surinterpréter.'
