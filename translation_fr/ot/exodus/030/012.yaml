- from: Quand tu feras le recensement des fils d’Israël, selon ceux qui auront été recensés[a], chacun donnera à Yahweh une rançon pour sa vie[b] au moment où tu les recenseras, afin qu’aucun fléau ne les frappe lorsque tu les recenseras.
  to: Lorsque tu feras le recensement des fils d’Israël, selon leur dénombrement[a], chacun donnera à Yahweh une rançon pour sa vie[b] lorsque tu les dénombreras, afin qu’il n’y ait pas de fléau parmi eux lorsque tu les dénombreras.
  rationale: La révision corrige le rendu de לִפְקֻדֵיהֶם et la note associée, sans modifier le sens du passage. Elle maintient la répétition du vocabulaire du dénombrement, présente dans l’hébreu, et rend la dernière proposition de manière plus proche de « il n’y aura pas parmi eux de fléau ».
