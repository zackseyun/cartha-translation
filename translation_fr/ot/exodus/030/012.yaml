source:
  edition: WLC
  text: כִּ֣י תִשָּׂ֞א אֶת רֹ֥אשׁ בְּנֵֽי יִשְׂרָאֵ֘ל לִ/פְקֻדֵי/הֶם֒ וְ/נָ֨תְנ֜וּ אִ֣ישׁ כֹּ֧פֶר נַפְשׁ֛/וֹ לַ/יהוָ֖ה בִּ/פְקֹ֣ד אֹתָ֑/ם וְ/לֹא יִהְיֶ֥ה בָ/הֶ֛ם נֶ֖גֶף בִּ/פְקֹ֥ד אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/012.yaml
  text: When you take a census of the sons of Israel according to those numbered among them[a], then each man shall give to Yahweh a ransom for his life when you number them[c][b], so that there will be no plague among them when you number them.
translation:
  language: fr
  text: Lorsque tu feras le recensement des fils d’Israël, selon leur dénombrement[a], chacun donnera à Yahweh une rançon pour sa vie[b] lorsque tu les dénombreras, afin qu’il n’y ait pas de fléau parmi eux lorsque tu les dénombreras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « lorsque tu relèveras la tête des fils d’Israël selon leur dénombrement ». « Relever la tête » est ici un idiome qui signifie procéder à un recensement.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une rançon pour lui-même ». Ici, le mot hébreu néfesh désigne la vie ou la personne, et pas seulement l’« âme ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quand
  rationale: Dans cette instruction juridique, la particule introduit la circonstance attendue du recensement; « quand » convient mieux que l’hypothétique « si ».
- source_word: תִשָּׂא אֶת רֹאשׁ
  choice: tu feras le recensement
  rationale: L’expression signifie littéralement « relever la tête », mais fonctionne ici comme un idiome désignant le dénombrement officiel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: des fils d’Israël
  rationale: Cette formulation conserve l’expression familiale et la forme masculine de l’hébreu.
- source_word: לִפְקֻדֵיהֶם
  choice: selon ceux qui auront été recensés
  rationale: Le terme relève du vocabulaire administratif du dénombrement et de l’inscription; cette formulation garde ce lien tout en restant intelligible.
- source_word: וְנָתְנוּ אִישׁ
  choice: chacun donnera
  rationale: 'אִישׁ a ici une valeur distributive: chaque homme appartenant au groupe recensé doit verser la somme. « Chacun » rend naturellement cette force en français.'
- source_word: כֹּפֶר
  choice: une rançon
  rationale: Le mot désigne ici un paiement compensatoire destiné à préserver la personne du jugement.
- source_word: נַפְשׁוֹ
  choice: pour sa vie
  rationale: נֶפֶשׁ renvoie ici à la vie ou à la personne elle-même, sans imposer la notion plus tardive d’une âme immatérielle.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition marque le destinataire du paiement, et le nom divin est rendu directement par « Yahweh ».
- source_word: בִּפְקֹד אֹתָם
  choice: au moment où tu les recenseras
  rationale: L’infinitif construit avec בְּ indique la circonstance temporelle et maintient le lien lexical avec le recensement.
- source_word: נֶגֶף
  choice: fléau
  rationale: Le mot peut désigner un coup destructeur ou une calamité envoyée en jugement. « Fléau » préserve cette amplitude mieux que le sens médical plus étroit de « épidémie ».
- source_word: וְלֹא יִהְיֶה בָהֶם נֶגֶף
  choice: afin qu’aucun fléau ne les frappe
  rationale: La tournure exprime le résultat recherché par le versement de la rançon; cette formulation est naturelle et conserve l’idée d’une atteinte destructrice.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » représente le nom d’alliance sans le remplacer par un titre.
- issue: Sens de נַפְשׁוֹ dans la formule de rançon
  choice: pour sa vie
  alternative: pour lui-même; pour son âme
  rationale: Le contexte concerne la préservation de la vie de la personne recensée. « Âme » risquerait d’introduire une distinction anthropologique que le verset n’énonce pas.
- issue: Portée de נֶגֶף
  choice: fléau
  alternative: épidémie; coup
  rationale: Le terme évoque une atteinte destructrice, possiblement une mortalité collective, sans préciser nécessairement sa forme. « Fléau » conserve cette indétermination.
- issue: Expression genrée בְּנֵי יִשְׂרָאֵל / אִישׁ
  choice: les fils d’Israël ... chacun
  alternative: les Israélites ... chaque homme
  rationale: « Fils d’Israël » conserve la forme source. Dans la seconde expression, « chacun » rend la valeur distributive de אִישׁ sans suggérer que le mot « homme » est répété pour une raison théologique particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « recenser » est volontaire afin de reproduire la récurrence de la racine פקד. « Fléau » maintient l’ambiguïté du type exact de calamité. Les deux appels de note figurent dans le texte principal.
