    issue: « selon ceux qui auront été recensés »
    rationale: Cette expression est syntaxiquement et sémantiquement maladroite pour לִפְקֻדֵיהֶם ; le futur antérieur suggère que les personnes auraient déjà été recensées. Le terme désigne leur dénombrement/leur inscription au recensement.
  - severity: low
    issue: 'Note a : « selon leurs recensés »'
    rationale: La formulation française est incompréhensible. Une note littérale doit expliciter sans produire un groupe nominal non français.
