  terminology: « Yahweh », « fils d’Israël », « rançon », « vie » et « fléau » conviennent. « Fléau » préserve utilement l’indétermination de נֶגֶף. Les notes sont corrigées afin que l’alternative littérale soit compréhensible en français et que l’ancre a corresponde au segment révisé.
