  yaml_path: translation/ot/exodus/030/007.yaml
  text: Aaron shall burn fragrant incense on it morning by morning[a]; when he tends the lamps[b], he shall burn it.
translation:
  language: fr
  text: Aaron y fera brûler de l’encens aromatique chaque matin[a] ; lorsqu’il entretiendra les lampes[b], il le fera brûler.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « matin après matin ». La répétition hébraïque souligne la régularité quotidienne.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « lorsqu’il remettra les lampes en état ». Le verbe hébreu peut désigner plus précisément leur préparation, notamment l’ajustement des mèches.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: fera brûler
  rationale: Le hiphil de קטר, dans ce contexte cultuel, désigne l’action de faire monter l’offrande en fumée. « Faire brûler » est naturel en français et convient précisément à l’encens.
- source_word: עָלָיו
  choice: y
  rationale: Le pronom renvoie à l’autel des parfums mentionné juste avant. Le pronom adverbial « y » exprime naturellement en français le sens locatif « sur lui/sur cet autel ».
- source_word: קְטֹרֶת סַמִּים
  choice: de l’encens aromatique
  rationale: קְטֹרֶת désigne l’encens, tandis que סַמִּים évoque ses substances odoriférantes. « Encens aromatique » est clair et idiomatique sans réduire l’expression à une simple odeur agréable.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: chaque matin
  rationale: La répétition hébraïque a une valeur distributive et souligne la régularité quotidienne. « Chaque matin » restitue clairement cette fonction en français moderne.
- source_word: בְּהֵיטִיבוֹ
  choice: lorsqu’il entretiendra
  rationale: Dans ce contexte, le hiphil de יטב désigne la remise en état des lampes, notamment l’ajustement des mèches et leur préparation. « Entretenir » conserve l’étendue de l’action sans la limiter à une seule opération.
- source_word: הַנֵּרֹת
  choice: les lampes
  rationale: Le terme désigne les lampes du sanctuaire déjà connues par le contexte ; aucune explicitation supplémentaire n’est nécessaire.
- source_word: יַקְטִירֶנָּה
  choice: il le fera brûler
  rationale: Le suffixe féminin singulier reprend קְטֹרֶת, « encens ». En français, le pronom masculin « le » s’accorde avec « encens » et préserve cette reprise anaphorique.
