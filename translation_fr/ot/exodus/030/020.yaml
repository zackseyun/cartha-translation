  text: בְּ/בֹאָ֞/ם אֶל אֹ֧הֶל מוֹעֵ֛ד יִרְחֲצוּ מַ֖יִם וְ/לֹ֣א יָמֻ֑תוּ א֣וֹ בְ/גִשְׁתָּ֤/ם אֶל הַ/מִּזְבֵּ֨חַ֙ לְ/שָׁרֵ֔ת לְ/הַקְטִ֥יר אִשֶּׁ֖ה לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/020.yaml
  text: When they enter the tent of meeting[a], they shall wash with water, so that they may not die; or when they come near the altar to minister, to burn a food offering to Yahweh[b],
translation:
  language: fr
  text: Quand ils entreront dans la tente de la rencontre, ils se laveront avec de l’eau afin qu’ils ne meurent pas[a] ; ou lorsqu’ils s’approcheront de l’autel pour y accomplir leur service et y faire fumer une offrande par le feu pour Yahweh[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et ils ne mourront pas » ; ou : « de peur qu’ils ne meurent ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une offrande faite par le feu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבֹאָם
  choice: Quand ils entreront
  rationale: La préposition בְּ avec l’infinitif construit et le suffixe pronominal a ici une valeur temporelle. Le futur convient naturellement au contexte prescriptif français.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Rend le sanctuaire où a lieu la rencontre assignée avec Dieu, dans une formulation française claire et traditionnelle sans en faire un nom propre typographique.
- source_word: יִרְחֲצוּ מַיִם
  choice: ils se laveront avec de l’eau
  rationale: Le réfléchi explicite en français l’action de se laver, tandis que « avec de l’eau » conserve la mention expresse de מַיִם.
- source_word: וְלֹא יָמֻתוּ
  choice: afin de ne pas mourir
  rationale: Dans ce contexte, la coordination exprime naturellement le but ou le résultat attendu du lavage, tout en maintenant la sanction de mort.
- source_word: אוֹ
  choice: de même
  rationale: אוֹ introduit la seconde circonstance où le lavage est requis. « De même » rend ici plus clairement en français le parallélisme prescriptif que le simple « ou », susceptible de suggérer un choix exclusif.
- source_word: בְגִשְׁתָּם אֶל־הַמִּזְבֵּחַ
  choice: quand ils s’approcheront de l’autel
  rationale: נגשׁ désigne le fait de s’approcher, avec ici une portée à la fois physique et cultuelle.
- source_word: לְשָׁרֵת
  choice: pour y accomplir leur service
  rationale: La formulation exprime le service sacerdotal officiel sans employer « ministère », qui peut évoquer en français moderne une fonction ecclésiale ou gouvernementale.
- source_word: לְהַקְטִיר
  choice: faire fumer
  rationale: Le hiphil de קטר désigne techniquement le fait de faire monter l’offrande en fumée sur l’autel ; cette traduction est plus précise que le simple « brûler ».
- source_word: אִשֶּׁה
  choice: une offrande consumée par le feu
  rationale: Le terme cultuel désigne une offrande faite par le feu. Cette formulation évite de trancher en faveur de l’interprétation « offrande de nourriture ».
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: Le tétragramme est rendu directement par « Yahweh », conformément à sa fonction de nom divin dans le texte.
theological_decisions:
- issue: Valeur de וְלֹא יָמֻתוּ
  choice: afin de ne pas mourir
  alternative: et ils ne mourront pas ; de peur qu’ils ne meurent
  rationale: La traduction exprime la relation de but ou de conséquence suggérée par le contexte, mais une note conserve les lectures formellement plus proches de la coordination hébraïque.
- issue: Sens cultuel de אִשֶּׁה
  choice: une offrande consumée par le feu
  alternative: une offrande de nourriture
  rationale: Le choix maintient la référence au feu sans imposer l’analyse fonctionnelle du sacrifice comme nourriture divine.
- issue: Nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération préserve le nom d’alliance présent dans l’hébreu plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur porte la prescription. La virgule finale signale que la phrase se poursuit au verset suivant. Les marqueurs [a] et [b] figurent bien dans le texte principal.
