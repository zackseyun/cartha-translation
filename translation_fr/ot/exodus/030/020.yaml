revisions:
- from: Quand ils entreront dans la tente de la rencontre, ils se laveront avec de l’eau afin de ne pas mourir[a] ; de même, quand ils s’approcheront de l’autel pour y accomplir leur service et faire fumer une offrande consumée par le feu pour Yahweh[b],
  to: Quand ils entreront dans la tente de la rencontre, ils se laveront avec de l’eau afin qu’ils ne meurent pas[a] ; ou lorsqu’ils s’approcheront de l’autel pour y accomplir leur service et y faire fumer une offrande par le feu pour Yahweh[b],
  rationale: Le texte est corrigé uniquement là où « de même » ne rendait pas la conjonction אוֹ. La désignation de l’offrande est également resserrée en « offrande par le feu », formulation française naturelle et sémantiquement prudente. La ponctuation finale ouverte est maintenue conformément à la continuation syntaxique au verset suivant.
