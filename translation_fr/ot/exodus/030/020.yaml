review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire : אוֹ signifie « ou » et introduit la seconde circonstance dans laquelle le lavage est requis. « De même » remplace la disjonction hébraïque par une relation de comparaison. Le reste rend fidèlement la séquence cultuelle et conserve à juste titre la virgule finale, puisque la prescription se poursuit au verset suivant.'
  naturalness: Le français est globalement naturel et le futur convient au style prescriptif. « Ou lorsqu’ils… » est à la fois idiomatique et plus exact que « de même, quand ils… ». « Offrande par le feu » est une formulation cultuelle plus sobre que « offrande consumée par le feu », qui peut indûment suggérer que l’offrande entière est consumée.
  terminology: « Tente de la rencontre », « autel », « service » et « Yahweh » sont cohérents. Pour אִשֶּׁה, « offrande par le feu » préserve la désignation technique sans imposer l’interprétation « offrande de nourriture » ni affirmer une combustion totale.
  issues:
  - severity: medium
    issue: « De même » rend אוֹ.
    rationale: אוֹ est la conjonction disjonctive « ou ». Même si les deux cas relèvent de la même obligation, la traduction ne doit pas supprimer cette articulation explicite du texte hébreu.
  - severity: low
    issue: « Offrande consumée par le feu » est plus spécifique que אִשֶּׁה.
    rationale: Le terme désigne une offrande faite/par le feu ; il ne requiert pas en lui-même l’affirmation que l’offrande est entièrement consumée.
