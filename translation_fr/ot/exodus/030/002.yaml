  yaml_path: translation/ot/exodus/030/002.yaml
  text: Its length shall be a cubit[a], and its width a cubit; it shall be square, and its height shall be two cubits[b]. Its horns shall be of one piece with it.
translation:
  language: fr
  text: Il aura une coudée de long sur une coudée de large ; il sera carré et aura deux coudées de haut. Ses cornes feront corps avec lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « seront de lui » ; autrement dit, les cornes ne seront pas ajoutées séparément à l’autel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַמָּה
  choice: une coudée
  rationale: La coudée est l’unité ancienne indiquée par le texte. La conserver évite une conversion moderne artificiellement précise.
- source_word: אָרְכּוֹ
  choice: de long
  rationale: Dans l’énoncé des dimensions, cette tournure est naturelle en français moderne et exprime clairement la longueur de l’autel.
- source_word: רָחְבּוֹ
  choice: de large
  rationale: Cette formulation courante rend la largeur de l’autel sans lourdeur technique.
- source_word: רָבוּעַ
  choice: carré
  rationale: L’adjectif désigne une forme carrée ; « carré » est précis et immédiatement compréhensible.
- source_word: יִהְיֶה
  choice: il sera
  rationale: L’imparfait hébreu a ici une valeur prescriptive dans les instructions relatives au sanctuaire.
- source_word: אַמָּתַיִם
  choice: deux coudées
  rationale: La forme duelle indique explicitement une mesure de deux coudées.
- source_word: קֹמָתוֹ
  choice: de haut
  rationale: Dans ce contexte architectural, cette expression rend naturellement la hauteur.
- source_word: מִמֶּנּוּ
  choice: feront corps avec lui
  rationale: Littéralement « de lui », l’expression indique ici que les cornes appartiennent intégralement à la structure de l’autel et ne sont pas des pièces rapportées.
- source_word: קַרְנֹתָיו
  choice: ses cornes
  rationale: « Cornes » est le terme cultuel usuel pour les saillies placées aux angles de l’autel et préserve les liens avec les autres passages bibliques.
