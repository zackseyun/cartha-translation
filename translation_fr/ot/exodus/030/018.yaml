base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/018.yaml
  text: You shall make a bronze basin[a], with its stand of bronze, for washing; and you shall place it between the tent of meeting and the altar[c][b], and you shall put water there.
translation:
  language: fr
  text: Tu feras un bassin[a] en bronze[b], avec son socle[c] en bronze, pour les lavages. Tu le placeras entre la tente de la Rencontre et l’autel, et tu y mettras de l’eau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cuve » ; il s’agit du grand récipient utilisé pour les lavages au sanctuaire.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut aussi désigner le cuivre ou un alliage de cuivre, selon le contexte.
    reason: lexical_alternative
  - marker: c
    text: Ou « support ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּיּוֹר
  choice: bassin
  rationale: Désigne ici un grand récipient contenant l’eau destinée aux lavages rituels. « Bassin » est précis, naturel et accessible en français moderne.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Dans le contexte du sanctuaire, « bronze » est la traduction traditionnelle et plausible de ce terme, qui peut aussi désigner le cuivre ou un alliage de cuivre.
- source_word: כַּן
  choice: socle
  rationale: Le mot désigne le support sur lequel repose le bassin. « Socle » exprime naturellement cette fonction en français.
- source_word: לְרָחְצָה
  choice: pour se laver
  rationale: L’infinitif exprime le but. Cette formulation française, simple et naturelle, conserve la concision du texte sans préciser ici l’identité des personnes concernées.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la Rencontre
  rationale: Rendu français établi et intelligible du nom donné à la tente-sanctuaire où a lieu la rencontre avec Dieu.
- source_word: מִזְבֵּחַ
  choice: l’autel
  rationale: Traduction directe du terme désignant ici l’autel sacrificiel.
- source_word: שָׁמָּה
  choice: y
  rationale: L’adverbe signifie « là ». Après la mention du bassin et de son emplacement, « tu y mettras de l’eau » est la formulation française la plus naturelle; elle renvoie contextuellement au bassin.
- source_word: מַיִם
  choice: de l’eau
  rationale: Le nom hébreu, morphologiquement pluriel mais employé comme nom de matière, se rend naturellement au singulier en français.
- source_word: וְעָשִׂיתָ ... וְנָתַתָּ ... וְנָתַתָּ
  choice: Tu feras… Tu le placeras… tu y mettras
  rationale: Dans cette suite d’instructions, ces formes ont une valeur directive. Le futur français exprime clairement et dignement l’ordre donné.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le futur à valeur impérative maintient le ton des instructions cultuelles. « Rencontre » reçoit une majuscule pour signaler qu’il s’agit du nom traditionnel de la tente-sanctuaire, sans ajouter d’explication doctrinale.
