id: EXO.24.17
reference: Exodus 24:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/מַרְאֵה֙ כְּב֣וֹד יְהוָ֔ה כְּ/אֵ֥שׁ אֹכֶ֖לֶת בְּ/רֹ֣אשׁ הָ/הָ֑ר לְ/עֵינֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/017.yaml
  text: And the appearance of the glory of Yahweh was like a consuming fire on the top of the mountain in the sight of the sons of Israel[a][b].
translation:
  language: fr
  text: L’aspect de la gloire de Yahweh était comme un feu dévorant[a] au sommet de la montagne, sous les yeux des fils d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un feu qui consume ».
    reason: lexical_alternative
  - marker: b
    text: Ou « des enfants d’Israël » ou « des Israélites ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְאֵה
  choice: l’aspect
  rationale: Le nom désigne ici ce qui se donnait visiblement à voir. « L’aspect » rend cette manifestation perceptible sans suggérer une vision prophétique.
- source_word: כְּבוֹד
  choice: la gloire
  rationale: En lien avec la présence visible et éclatante de Dieu, « gloire » est le terme français consacré et contextuellement approprié.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: כְּאֵשׁ אֹכֶלֶת
  choice: comme un feu dévorant
  rationale: כְּ marque explicitement la comparaison, et le participe de אכל décrit idiomatiquement un feu qui dévore ou consume. « Feu dévorant » est naturel et vigoureux en français.
- source_word: בְּרֹאשׁ הָהָר
  choice: au sommet de la montagne
  rationale: Cette formulation française exprime clairement la position à la partie la plus haute de la montagne.
- source_word: לְעֵינֵי
  choice: sous les yeux de
  rationale: L’expression conserve l’accent visuel de l’idiome hébreu tout en étant naturelle en français moderne.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Ce choix reproduit la forme masculine plurielle et la désignation collective de l’hébreu; une formulation collective plus idiomatique est signalée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: YHWH ou « le Seigneur »
  rationale: Le texte emploie le nom propre divin. « Yahweh » en préserve le caractère personnel sans le remplacer par un titre.
- issue: Portée de la désignation בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites ou les enfants d’Israël
  rationale: Le rendu principal reste proche de la forme hébraïque et de sa désignation historique collective, sans trancher dans le texte même la question de son extension à l’ensemble du peuple.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste proche de l’hébreu tout en privilégiant des expressions françaises naturelles comme « au sommet » et « sous les yeux ».
