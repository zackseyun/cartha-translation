revisions:
- from: La gloire de Yahweh se posa sur le mont Sinaï, et la nuée le couvrit[a] pendant six jours. Le septième jour, il appela Moïse du milieu de la nuée[b].
  to: La gloire de Yahweh se posa sur le mont Sinaï, et la nuée le couvrit[a] pendant six jours. Le septième jour, il appela Moïse du milieu de la nuée[b].
  rationale: La traduction principale est conservée. La note a est corrigée pour respecter la différence grammaticale entre l'ambiguïté du suffixe hébreu et le pronom masculin français, qui sélectionne nécessairement le mont Sinaï. La note b est légèrement idiomatisée.
