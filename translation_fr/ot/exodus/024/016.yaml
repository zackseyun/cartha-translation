source:
  edition: WLC
  text: וַ/יִּשְׁכֹּ֤ן כְּבוֹד יְהוָה֙ עַל הַ֣ר סִינַ֔י וַ/יְכַסֵּ֥/הוּ הֶ/עָנָ֖ן שֵׁ֣שֶׁת יָמִ֑ים וַ/יִּקְרָ֧א אֶל מֹשֶׁ֛ה בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י מִ/תּ֥וֹךְ הֶ/עָנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/016.yaml
  text: And the glory of Yahweh settled on Mount Sinai[a], and the cloud covered it for six days[b]. On the seventh day he called to Moses from the midst of the cloud.
translation:
  language: fr
  text: La gloire de Yahweh se posa sur le mont Sinaï, et la nuée le couvrit[a] pendant six jours. Le septième jour, il appela Moïse du milieu de la nuée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu peut aussi se comprendre : « la nuée couvrit la gloire de Yahweh ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « de l’intérieur de la nuée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  choice: se posa
  rationale: Le verbe שכן décrit ici la gloire qui vient établir sa présence sur la montagne. « Se posa » conserve cette image concrète dans un français naturel, sans l’archaïsme de « demeura » pris au sens d’habiter.
- source_word: כְּבוֹד יְהוָה
  choice: la gloire de Yahweh
  rationale: « Gloire » rend כבוד dans ce contexte de manifestation visible et majestueuse de la présence divine; le nom personnel יהוה est translittéré « Yahweh ».
- source_word: עַל הַר סִינַי
  choice: sur le mont Sinaï
  rationale: Rendu idiomatique et précis de la localisation exprimée par עַל.
- source_word: וַיְכַסֵּהוּ
  choice: le couvrit
  rationale: 'Le pronom masculin singulier reproduit l’ambiguïté grammaticale de l’hébreu: son antécédent peut être « le mont Sinaï » ou, moins probablement, « la gloire ».'
- source_word: הֶעָנָן
  choice: la nuée
  rationale: « Nuée » est un terme français actuel mais soutenu, bien adapté au nuage théophanique défini du récit du Sinaï.
- source_word: שֵׁשֶׁת יָמִים
  choice: pendant six jours
  rationale: La préposition « pendant » exprime naturellement en français la durée portée en hébreu par l’accusatif temporel.
- source_word: וַיִּקְרָא אֶל־מֹשֶׁה
  choice: il appela Moïse
  rationale: « Appela » rend simplement קרא; en français, le complément direct est la tournure naturelle, là où l’hébreu emploie אֶל.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Le septième jour
  rationale: Formulation temporelle française naturelle qui conserve l’ordinal défini.
- source_word: מִתּוֹךְ הֶעָנָן
  choice: du milieu de la nuée
  rationale: Cette expression conserve l’idée d’une voix provenant de l’intérieur de la nuée, présente dans מִתּוֹךְ.
theological_decisions:
- issue: Sujet implicite de « il appela »
  choice: Le pronom « il » renvoie à Yahweh.
  alternative: La gloire de Yahweh pourrait être comprise comme sujet métonymique.
  rationale: Le déroulement de la théophanie au Sinaï indique que Yahweh appelle Moïse. Le pronom maintient toutefois la forme concise de l’hébreu sans répéter explicitement le nom divin.
- issue: Antécédent du suffixe dans וַיְכַסֵּהוּ
  choice: Le mont Sinaï est l’antécédent le plus probable.
  alternative: La nuée couvrit la gloire de Yahweh.
  rationale: Le tableau narratif et l’antécédent spatial favorisent la montagne, mais les deux noms possibles sont masculins en hébreu. Le pronom français « le » permet de ne pas effacer cette ambiguïté, qui est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Nuée » maintient le registre théophanique traditionnel sans rendre la phrase archaïque; la syntaxe reste simple et narrative.
