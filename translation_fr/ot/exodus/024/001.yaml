source:
  edition: WLC
  text: וְ/אֶל מֹשֶׁ֨ה אָמַ֜ר עֲלֵ֣ה אֶל יְהוָ֗ה אַתָּה֙ וְ/אַהֲרֹן֙ נָדָ֣ב וַ/אֲבִיה֔וּא וְ/שִׁבְעִ֖ים מִ/זִּקְנֵ֣י יִשְׂרָאֵ֑ל וְ/הִשְׁתַּחֲוִיתֶ֖ם מֵ/רָחֹֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/001.yaml
  text: Then he said to Moses[a], “Come up to Yahweh, you and Aaron, Nadab and Abihu, and seventy of the elders of Israel, and bow down from a distance.”
translation:
  language: fr
  text: 'Puis il dit à Moïse[a] : « Monte vers Yahweh, toi, Aaron, Nadab et Abihou, ainsi que soixante-dix des anciens d’Israël, et prosternez-vous à distance. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Puis il dit à Moïse : “Monte vers Yahweh.” » Le texte conserve cette formulation, bien que le locuteur paraisse être Yahweh; certaines traductions l’adaptent en « Monte vers moi » ou « Monte devant Yahweh ».'
    reason: La note signale la formulation hébraïque inhabituelle et les principales adaptations possibles sans résoudre la tension dans le texte principal.
lexical_decisions:
- source_word: וְ/אֶל מֹשֶׁה אָמַר
  choice: Puis il dit à Moïse
  rationale: La tournure hébraïque, littéralement « Et à Moïse il dit », ouvre une nouvelle parole tout en la reliant au contexte précédent. « Puis il dit à Moïse » est naturel en français et explicite le sujet masculin singulier exigé par l’usage français.
- source_word: עֲלֵה
  choice: Monte
  rationale: L’impératif de עלה exprime un mouvement vers le haut. « Monte » convient à l’invitation à s’approcher de la présence divine et reste plus naturel que « fais l’ascension ».
- source_word: אֶל יְהוָה
  choice: vers Yahweh
  rationale: La préposition אֶל marque ici la direction. « Vers » rend naturellement le mouvement d’approche. Le nom divin est translittéré « Yahweh », et la formulation inhabituelle est conservée sans être remplacée par « vers moi ».
- source_word: אַתָּה וְ/אַהֲרֹן נָדָב וַ/אֲבִיהוּא
  choice: toi, Aaron, Nadab et Abihou
  rationale: Le pronom explicite introduit et souligne le premier membre de la liste. « Toi » conserve cette emphase; les noms propres suivent leurs formes françaises usuelles.
- source_word: וְ/שִׁבְעִים מִ/זִּקְנֵי יִשְׂרָאֵל
  choice: ainsi que soixante-dix des anciens d’Israël
  rationale: 'La construction avec מִן est partitive : il s’agit de soixante-dix hommes pris parmi les anciens d’Israël. « Des anciens » préserve cette nuance.'
- source_word: וְ/הִשְׁתַּחֲוִיתֶם
  choice: et prosternez-vous
  rationale: Le verbe désigne l’action de se courber ou de se prosterner avec révérence. « Prosternez-vous » conserve clairement le geste physique et l’accord au pluriel, sans réduire d’emblée le sens au seul acte cultuel d’adoration.
- source_word: מֵ/רָחֹק
  choice: à distance
  rationale: L’expression indique que le groupe doit rester spatialement éloigné. « À distance » est une formulation française actuelle et concise.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » rend le nom propre divin plutôt que de le remplacer par un titre.
- issue: Formulation inhabituelle « Monte vers Yahweh » alors que le locuteur paraît être Yahweh
  choice: Conserver « vers Yahweh » dans le texte principal
  alternative: Monte vers moi; Monte devant Yahweh
  rationale: L’hébreu dit explicitement אֶל יְהוָה. Modifier la formulation dissiperait une tension référentielle que le texte source laisse subsister; elle est donc préservée et signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe de la liste est légèrement fluidifiée par « ainsi que », tandis que le pluriel de « prosternez-vous » reflète fidèlement le passage de l’impératif singulier adressé à Moïse à l’ordre donné à l’ensemble du groupe.
