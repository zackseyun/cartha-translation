  yaml_path: translation/ot/exodus/024/018.yaml
  text: Moses entered into the midst of the cloud and went up the mountain[a]. And Moses was on the mountain forty days and forty nights.
translation:
  language: fr
  text: Moïse entra au milieu de la nuée[a] et monta sur la montagne. Moïse fut sur la montagne quarante jours et quarante nuits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’intérieur de la nuée ». L’hébreu souligne que Moïse entra dans la nuée elle-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: entra
  rationale: Dans ce contexte, בוא décrit le mouvement de Moïse vers l’intérieur de la nuée. « Entra » exprime naturellement ce déplacement en français.
- source_word: בְּתוֹךְ
  choice: au milieu de
  rationale: תּוֹךְ désigne l’intérieur ou le milieu. « Au milieu de » souligne que Moïse pénètre dans la nuée elle-même, sans surcharger la phrase.
- source_word: הֶעָנָן
  choice: la nuée
  rationale: « Nuée » rend עָנָן dans un registre biblique digne et encore intelligible, tout en maintenant le lien avec la manifestation de la présence divine dans le récit.
- source_word: וַיַּעַל אֶל הָהָר
  choice: monta sur la montagne
  rationale: עלה exprime la montée et אֶל la direction. Cette formulation est naturelle en français et correspond à la localisation donnée dans la proposition suivante.
- source_word: וַיְהִי
  choice: resta
  rationale: Avec une indication de lieu suivie d’une durée, היה se rend naturellement par « resta ». Le choix exprime la continuité de la présence de Moïse sans ajouter l’idée volontaire de « demeurer ».
- source_word: בָּהָר
  choice: sur la montagne
  rationale: Dans ce contexte, la préposition ב indique la localisation de Moïse sur la montagne.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: quarante jours et quarante nuits
  rationale: Formulation française idiomatique et exacte de l’expression hébraïque de durée.
theological_decisions:
- issue: Image de la nuée associée à la présence divine
  choice: la nuée
  alternative: le nuage épais
  rationale: Le texte porte le nom ordinaire עָנָן avec l’article, sans adjectif signifiant « épais ». La traduction conserve l’image théophanique sans l’expliciter ni l’amplifier.
translation_notes:
  register: Français international moderne, naturel et digne. « Nuée » est retenu pour préserver l’image narrative et son registre biblique sans interprétation ajoutée; la note explicite la force spatiale de בְּתוֹךְ.
