  text: וְ/נִגַּ֨שׁ מֹשֶׁ֤ה לְ/בַדּ/וֹ֙ אֶל יְהוָ֔ה וְ/הֵ֖ם לֹ֣א יִגָּ֑שׁוּ וְ/הָ/עָ֕ם לֹ֥א יַעֲל֖וּ עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/002.yaml
  text: Moses alone shall come near to Yahweh[a], but they shall not come near, and the people shall not go up with him.
translation:
  language: fr
  text: Moïse seul s’approchera de Yahweh[a] ; eux ne s’approcheront pas, et le peuple ne montera pas avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, nom propre du Dieu d’Israël, rendu ici par « Yahweh ». Certaines traductions mettent « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque du nom divin et l’autre convention de traduction largement répandue.
lexical_decisions:
- source_word: וְנִגַּשׁ
  choice: s’approchera
  rationale: Le verbe נגשׁ exprime l’action de s’approcher. Le futur français convient à la valeur directive du contexte tout en gardant le ton solennel de l’hébreu.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom.
- source_word: לְבַדּוֹ
  choice: seul
  rationale: 'Marque clairement l’exclusivité : Moïse, à l’exclusion des autres, est autorisé à s’approcher.'
- source_word: אֶל יְהוָה
  choice: de Yahweh
  rationale: Avec le verbe pronominal français « s’approcher », la préposition naturelle est « de ». Le nom divin est translittéré « Yahweh » conformément à la donnée hébraïque et à la décision de projet fournie.
- source_word: וְהֵם
  choice: eux
  rationale: Le pronom indépendant est rendu par le pronom tonique « eux », qui souligne le contraste avec « Moïse seul » sans expliciter davantage l’antécédent.
- source_word: לֹא יִגָּשׁוּ
  choice: ne s’approcheront pas
  rationale: La répétition du même verbe français conserve le parallélisme et le contraste lexical de l’hébreu.
- source_word: וְהָעָם
  choice: et le peuple
  rationale: Rendu direct de הָעָם, sans ajouter « d’Israël », absent du verset.
- source_word: לֹא יַעֲלוּ
  choice: ne montera pas
  rationale: עלה désigne ici le mouvement vers le haut, dans le contexte de la montée sur la montagne. En français, le nom collectif singulier « le peuple » commande naturellement le singulier.
- source_word: עִמּוֹ
  choice: avec lui
  rationale: Rendu direct ; le pronom renvoie à Moïse.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahweh » conserve le caractère de nom propre et suit la décision doctrinale fournie, sans le remplacer dans le texte principal par un titre.
translation_notes:
  register: Français moderne, digne et accessible. Le futur conserve la valeur directive des formes verbales dans ce contexte. Le point-virgule rend nettement l’opposition entre l’approche permise à Moïse seul et l’interdiction faite aux autres.
