source:
  edition: WLC
  text: וַ/יָּבֹ֣א מֹשֶׁ֗ה וַ/יְסַפֵּ֤ר לָ/עָם֙ אֵ֚ת כָּל דִּבְרֵ֣י יְהוָ֔ה וְ/אֵ֖ת כָּל הַ/מִּשְׁפָּטִ֑ים וַ/יַּ֨עַן כָּל הָ/עָ֜ם ק֤וֹל אֶחָד֙ וַ/יֹּ֣אמְר֔וּ כָּל הַ/דְּבָרִ֛ים אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/003.yaml
  text: Then Moses came and told the people all the words of Yahweh and all the ordinances[a], and all the people answered with one voice and said, “All the words that Yahweh has spoken we will do.”
translation:
  language: fr
  text: 'Puis Moïse vint rapporter au peuple toutes les paroles de Yahweh et toutes les règles de droit[a]. Tout le peuple répondit d’une seule voix : « Nous ferons tout ce que Yahweh a dit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes les décisions de justice » ou « toutes les prescriptions ». Le mot hébreu mishpatim désigne ici des règles ou décisions juridiques liées à l’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Puis Moïse vint
  rationale: Le waw consécutif fait avancer le récit, et בוא signifie ici « venir ». « Puis » rend naturellement l’enchaînement narratif.
- source_word: וַיְסַפֵּר
  choice: rapporter
  rationale: Au piel, ספר signifie raconter ou rapporter. « Rapporter au peuple » exprime clairement la transmission détaillée des paroles reçues.
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: toutes les paroles de Yahweh
  rationale: « Paroles » conserve le sens concret de דְּבָרִים et le lien lexical avec la réponse du peuple, sans réduire ces paroles à de simples commandements.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » conserve le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: הַמִּשְׁפָּטִים
  choice: les règles de droit
  rationale: Dans ce contexte d’alliance, מִשְׁפָּטִים désigne des décisions ou prescriptions juridiques. « Règles de droit » est compréhensible en français moderne et garde la portée légale du terme.
- source_word: וַיַּעַן כָּל הָעָם קוֹל אֶחָד
  choice: Tout le peuple répondit d’une seule voix
  rationale: Cette formulation naturelle conserve l’image hébraïque de l’unanimité exprimée par « une seule voix ».
- source_word: כָּל הַדְּבָרִים אֲשֶׁר דִּבֶּר יְהוָה
  choice: tout ce que Yahweh a dit
  rationale: Cette tournure française idiomatique rend la totalité des paroles évoquées et maintient le lien avec l’acte de parler, sans lourde répétition.
- source_word: נַעֲשֶׂה
  choice: Nous ferons
  rationale: Le verbe עשה signifie littéralement « faire ». Cette traduction préserve la force de l’engagement sans expliciter par « obéir » ce qui demeure implicite.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom d’alliance au lieu de le remplacer par un titre.
- issue: Portée de l’engagement נַעֲשֶׂה
  choice: Nous ferons
  alternative: Nous obéirons
  rationale: « Nous ferons » suit le verbe hébreu et laisse au contexte le soin d’exprimer la dimension d’obéissance, sans ajouter une interprétation explicative.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le mouvement narratif et l’unanimité solennelle du peuple. « Règles de droit » privilégie la clarté juridique sans employer l’archaïsme « ordonnances ».
