  text: וְ/אֶל אֲצִילֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א שָׁלַ֖ח יָד֑/וֹ וַֽ/יֶּחֱזוּ֙ אֶת הָ֣/אֱלֹהִ֔ים וַ/יֹּאכְל֖וּ וַ/יִּשְׁתּֽוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/011.yaml
  text: But he did not stretch out his hand against the nobles of the sons of Israel; they saw God[a], and they ate and drank.
translation:
  language: fr
  text: Mais il ne porta pas la main sur les notables des fils d’Israël. Ils contemplèrent Dieu[a], puis ils mangèrent et burent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ils virent Dieu » : le verbe peut exprimer le fait de regarder avec attention ou de contempler.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל
  choice: sur
  rationale: Avec שָׁלַח יָד, la préposition marque ici la personne visée par un geste hostile. En français, « porter la main sur » exprime naturellement l’idée sans expliciter davantage le châtiment.
- source_word: אֲצִילֵי
  choice: les notables
  rationale: Le terme désigne les membres éminents ou choisis de la communauté. « Notables » est naturel en français moderne et convient à ces représentants d’Israël.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: des fils d’Israël
  rationale: Cette traduction conserve l’expression familiale de l’hébreu et sa forme masculine précise, sans la remplacer par une désignation collective plus interprétative.
- source_word: שָׁלַח יָדוֹ
  choice: il ne porta pas la main
  rationale: L’expression française « porter la main sur quelqu’un » restitue l’idiome hébreu, qui évoque une intervention violente ou punitive, tout en conservant l’image de la main.
- source_word: וַיֶּחֱזוּ
  choice: ils contemplèrent
  rationale: Le verbe חזה peut indiquer une vision soutenue ou le fait de regarder, de contempler. Ce choix rend sa nuance plus marquée que le simple verbe « voir » tout en restant naturel et digne.
- source_word: אֶת הָאֱלֹהִים
  choice: Dieu
  rationale: L’expression désigne ici le Dieu d’Israël. En français, le nom propre d’usage « Dieu » ne prend pas d’article dans cette construction.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: puis ils mangèrent et burent
  rationale: Les verbes successifs sont rendus simplement. « Puis » marque naturellement la progression narrative portée par le waw consécutif, sans surinterpréter la nature du repas.
theological_decisions:
- issue: Sujet de « ne porta pas la main »
  choice: Le pronom « il » renvoie implicitement à Dieu, conformément au contexte immédiat.
  alternative: Employer une tournure impersonnelle ou passive qui laisse le sujet inexprimé.
  rationale: L’hébreu n’énonce pas le sujet nominalement, mais le contexte l’identifie clairement à Dieu. Le pronom français clarifie la syntaxe sans ajouter une affirmation théologique étrangère au texte.
- issue: Nature de la rencontre divine
  choice: « Ils contemplèrent Dieu » affirme directement l’objet de leur vision.
  alternative: « Ils contemplèrent une manifestation de Dieu » ou « ils eurent une vision de Dieu ».
  rationale: Le texte hébreu dit directement qu’ils contemplèrent Dieu. Il ne convient pas d’atténuer cette affirmation afin de résoudre sa tension avec d’autres passages concernant la possibilité de voir Dieu.
translation_notes:
  register: Français international moderne, clair et digne. « Notables » évite la coloration féodale possible de « nobles ». « Porter la main sur » conserve l’image idiomatique et la menace implicite. Le passé simple convient au registre narratif biblique soutenu sans être archaïque.
