  text: וַ/יָּ֣קָם מֹשֶׁ֔ה וִ/יהוֹשֻׁ֖עַ מְשָׁרְת֑/וֹ וַ/יַּ֥עַל מֹשֶׁ֖ה אֶל הַ֥ר הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/013.yaml
  text: So Moses arose with Joshua his attendant[a], and Moses went up to the mountain of God.
translation:
  language: fr
  text: Alors Moïse se leva avec Josué, son assistant[a], et Moïse monta sur la montagne de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui était à son service ». Le terme hébreu désigne une personne qui sert quelqu’un et l’assiste ; ici, il présente vraisemblablement Josué comme l’assistant personnel de Moïse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le qal narratif de קום signifie couramment « se lever ». Cette formulation conserve la progression du récit sans préciser davantage s’il s’agit déjà du départ.
- source_word: וִיהוֹשֻׁעַ
  choice: Josué
  rationale: La forme française traditionnelle et courante du nom hébreu יְהוֹשֻׁעַ est retenue.
- source_word: מְשָׁרְתוֹ
  choice: son assistant
  rationale: Le participe de שׁרת désigne ici celui qui se tient au service personnel de Moïse. « Assistant » exprime naturellement le rôle de Josué sans suggérer l’esclavage ni une fonction religieuse institutionnelle.
- source_word: וַיַּעַל
  choice: monta
  rationale: עלה indique un mouvement vers le haut, ici en direction de la montagne. « Monta » est la formulation narrative française la plus naturelle.
- source_word: אֶל הַר הָאֱלֹהִים
  choice: vers la montagne de Dieu
  rationale: La préposition אֶל marque la direction, tandis que הַר הָאֱלֹהִים est rendu formellement par « la montagne de Dieu », sans expliciter son identité au-delà du texte.
theological_decisions:
- issue: Relation entre Moïse et Josué dans מְשָׁרְתוֹ
  choice: Josué est présenté comme l’assistant personnel de Moïse.
  alternative: « son serviteur » ou « celui qui était à son service »
  rationale: Le terme hébreu couvre plusieurs formes de service. Dans ce contexte narratif, il décrit l’accompagnement et le service personnel de Josué, sans imposer l’idée d’esclavage ni une charge cultuelle.
translation_notes:
  register: Français international moderne, sobre et narratif. La répétition de « Moïse » est conservée, comme dans l’hébreu, et « vers » rend explicitement la valeur directionnelle de אֶל.
