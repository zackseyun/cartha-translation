revisions:
- from: Il envoya de jeunes hommes parmi les fils d’Israël, et ils offrirent des holocaustes et sacrifièrent à Yahweh des taureaux en sacrifices de communion[a].
  to: Il envoya de jeunes hommes israélites, et ils offrirent des holocaustes et sacrifièrent à Yahweh des sacrifices de communion de taureaux[a].
  rationale: La révision retire la nuance additionnelle de sélection introduite par « parmi », tout en conservant explicitement que les personnes envoyées étaient des hommes. Elle clarifie aussi que les taureaux constituent les sacrifices de communion, sans modifier le sens ni l’ordre narratif du texte hébreu.
