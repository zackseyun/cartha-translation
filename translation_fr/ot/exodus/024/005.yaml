  text: וַ/יִּשְׁלַ֗ח אֶֽת נַעֲרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּֽעֲל֖וּ עֹלֹ֑ת וַֽ/יִּזְבְּח֞וּ זְבָחִ֧ים שְׁלָמִ֛ים לַ/יהוָ֖ה פָּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/005.yaml
  text: And he sent the young men of the sons of Israel[b][a], and they offered up burnt offerings and sacrificed peace offerings of bulls to Yahweh.
translation:
  language: fr
  text: Il envoya de jeunes hommes israélites, et ils offrirent des holocaustes et sacrifièrent à Yahweh des sacrifices de communion de taureaux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifices de paix » ou « sacrifices de bien-être ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Il envoya
  rationale: Le waw consécutif avec שׁלח poursuit simplement le récit de l’action de Moïse; « envoya » est direct et naturel.
- source_word: נַעֲרֵי בְּנֵי יִשְׂרָאֵל
  choice: de jeunes hommes parmi les fils d’Israël
  rationale: נַעַר désigne ici de jeunes hommes. « Parmi » exprime naturellement leur appartenance au groupe, tandis que « fils d’Israël » conserve la forme masculine de l’hébreu.
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: ils offrirent des holocaustes
  rationale: עלה avec עֹלָה constitue une expression sacrificielle; « offrir des holocaustes » est l’équivalent français établi et évite une littéralité artificielle.
- source_word: וַיִּזְבְּחוּ
  choice: et sacrifièrent
  rationale: Dans ce contexte cultuel, זבח signifie immoler ou offrir en sacrifice; « sacrifièrent » est concis et garde la distinction avec les holocaustes.
- source_word: זְבָחִים שְׁלָמִים
  choice: sacrifices de communion
  rationale: Cette expression désigne une catégorie sacrificielle liée à la paix, au bien-être et à un repas partagé. « Sacrifices de communion » est clair en français biblique moderne, sans réduire toute la portée du terme; les autres rendus possibles figurent en note.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le nom divin יהוה est rendu comme nom propre, conformément à sa présence explicite dans le texte hébreu.
- source_word: פָּרִים
  choice: des taureaux
  rationale: Le pluriel פָּרִים précise les animaux sacrifiés. Sa place avant « en sacrifices de communion » produit une syntaxe française naturelle tout en indiquant leur fonction sacrificielle.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » le présente comme le nom propre de l’alliance sans le remplacer par un titre.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le rendu principal conserve la formulation généalogique masculine de l’hébreu. Ici, les personnes envoyées sont en outre expressément de jeunes hommes, mais l’expression « fils d’Israël » désigne le peuple auquel ils appartiennent.
- issue: Sens de זְבָחִים שְׁלָמִים
  choice: sacrifices de communion
  alternative: sacrifices de paix; sacrifices de bien-être
  rationale: Le terme שְׁלָמִים admet plusieurs nuances liées à la paix, à l’intégrité, au bien-être et à la communion sacrificielle. La traduction principale reste naturelle, et la note préserve cette pluralité sémantique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase suit le mouvement narratif de l’hébreu, tout en évitant les calques peu naturels. Le vocabulaire sacrificiel demeure précis; une note conserve l’ambiguïté sémantique de שְׁלָמִים.
