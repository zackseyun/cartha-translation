  yaml_path: translation/ot/exodus/024/009.yaml
  text: Then Moses went up, and Aaron, Nadab, Abihu, and seventy of the elders of Israel.
translation:
  language: fr
  text: Alors Moïse, Aaron, Nadab, Abihou et soixante-dix des anciens d’Israël montèrent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: Alors … monta
  rationale: Le verbe עלה exprime un mouvement vers le haut. « Monta » est naturel en français et conserve ce sens sans ajouter « sur la montagne », élément implicite dans le contexte mais absent du verset.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom.
- source_word: וְאַהֲרֹן
  choice: ainsi qu’Aaron
  rationale: Cette coordination française fluide indique qu’Aaron accompagne Moïse, tout en évitant une succession maladroite de « et ».
- source_word: נָדָב
  choice: Nadab
  rationale: Translittération française usuelle du nom propre.
- source_word: וַאֲבִיהוּא
  choice: Abihou
  rationale: Forme française usuelle du nom propre.
- source_word: וְשִׁבְעִים
  choice: et soixante-dix
  rationale: Rend directement le nombre cardinal coordonné.
- source_word: מִזִּקְנֵי
  choice: des anciens
  rationale: 'La préposition מִן a ici une valeur partitive : il s’agit de soixante-dix hommes pris parmi les anciens. « Soixante-dix des anciens » exprime naturellement cette relation en français.'
- source_word: יִשְׂרָאֵל
  choice: d’Israël
  rationale: Forme française standard du nom national, qui précise l’appartenance des anciens.
