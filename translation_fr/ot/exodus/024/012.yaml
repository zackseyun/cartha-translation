source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲלֵ֥ה אֵלַ֛/י הָ/הָ֖רָ/ה וֶ/הְיֵה שָׁ֑ם וְ/אֶתְּנָ֨ה לְ/ךָ֜ אֶת לֻחֹ֣ת הָ/אֶ֗בֶן וְ/הַ/תּוֹרָה֙ וְ/הַ/מִּצְוָ֔ה אֲשֶׁ֥ר כָּתַ֖בְתִּי לְ/הוֹרֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/012.yaml
  text: Then Yahweh said to Moses[a], “Come up to me on the mountain and remain there, and I will give you the stone tablets, and the law and the commandment[b], which I have written for their instruction.”
translation:
  language: fr
  text: 'Puis Yahweh dit à Moïse : « Monte vers moi sur la montagne et reste là. Je te donnerai les tablettes de pierre, ainsi que la loi[a] et le commandement[b], que j’ai écrits pour les instruire. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’enseignement ». Le mot hébreu torah désigne souvent une instruction ou un enseignement, et pas seulement une loi au sens juridique.
    reason: lexical_alternative
  - marker: b
    text: L’expression « la loi et le commandement » peut désigner des instructions de l’alliance données avec les tablettes, ou préciser ce qui est écrit sur celles-ci.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: עֲלֵה אֵלַי הָהָרָה
  choice: Monte vers moi sur la montagne
  rationale: Cette formulation rend l’impératif de montée, le mouvement vers Yahweh et la destination indiquée par la forme directionnelle de « montagne », dans un français naturel.
- source_word: וֶהְיֵה שָׁם
  choice: et reste là
  rationale: Dans ce contexte, l’impératif de היה exprime une présence qui se prolonge; « reste là » est plus idiomatique que « sois là ».
- source_word: וְאֶתְּנָה לְךָ
  choice: Je te donnerai
  rationale: La forme cohortative exprime ici l’intention ou la promesse divine à la suite des impératifs.
- source_word: לֻחֹת הָאֶבֶן
  choice: les tablettes de pierre
  rationale: Cette expression claire et courante conserve explicitement la matière des tablettes de l’alliance.
- source_word: וְהַתּוֹרָה
  choice: la loi
  rationale: « Loi » est reconnaissable et naturel dans le contexte de l’alliance au Sinaï, tandis qu’une note conserve le sens plus large d’enseignement ou d’instruction que peut avoir תּוֹרָה.
- source_word: וְהַמִּצְוָה
  choice: le commandement
  rationale: Le singulier hébreu est maintenu sans l’interpréter d’emblée comme un collectif.
- source_word: אֲשֶׁר כָּתַבְתִּי
  choice: que j’ai écrits
  rationale: Le passé composé rend naturellement l’action accomplie dont le résultat demeure pertinent. L’accord masculin pluriel peut englober la liste mixte ou les deux noms masculins les plus proches, sans trancher entièrement leur relation syntaxique.
- source_word: לְהוֹרֹתָם
  choice: pour les instruire
  rationale: La tournure rend directement le but exprimé par l’infinitif causatif et maintient le pronom pluriel renvoyant au peuple d’Israël.
theological_decisions:
- issue: Rapport entre « la loi et le commandement » et « les tablettes de pierre »
  choice: 'Conserver les éléments coordonnés : « les tablettes de pierre, ainsi que la loi et le commandement »'
  alternative: Comprendre « la loi et le commandement » comme une apposition qui décrit uniquement le contenu des tablettes
  rationale: La coordination hébraïque permet plusieurs analyses. Le texte principal conserve la distinction formelle des termes, et la note signale l’incertitude sans limiter leur portée au Décalogue ni affirmer qu’il s’agit nécessairement d’instructions supplémentaires.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de la structure hébraïque tout en évitant les calques peu naturels. « Ainsi que » clarifie la coordination sans résoudre la portée exacte des différents éléments.
