source:
  edition: WLC
  text: וַ/יִּכְתֹּ֣ב מֹשֶׁ֗ה אֵ֚ת כָּל דִּבְרֵ֣י יְהוָ֔ה וַ/יַּשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וַ/יִּ֥בֶן מִזְבֵּ֖חַ תַּ֣חַת הָ/הָ֑ר וּ/שְׁתֵּ֤ים עֶשְׂרֵה֙ מַצֵּבָ֔ה לִ/שְׁנֵ֥ים עָשָׂ֖ר שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/004.yaml
  text: And Moses wrote down all the words of Yahweh[a]. He rose early in the morning and built an altar at the foot of the mountain[b], and twelve pillars for the twelve tribes of Israel.
translation:
  language: fr
  text: Moïse mit par écrit toutes les paroles de Yahweh. Il se leva tôt le matin, bâtit un autel au pied de la montagne[a] et dressa douze stèles[b] pour les douze tribus d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sous la montagne », c’est-à-dire à sa base.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « douze pierres dressées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: mit par écrit
  rationale: Le verbe כתב signifie « écrire ». « Mit par écrit » exprime naturellement en français la consignation des paroles prononcées, sans ajouter de contenu.
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: toutes les paroles de Yahweh
  rationale: דְּבָרִים désigne ici les paroles précédemment prononcées. « Paroles » conserve le sens direct sans réduire l’expression aux seuls commandements. Le nom divin est translittéré « Yahweh ».
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: Il se leva tôt le matin
  rationale: La forme causative de שׁכם a le sens idiomatique de « se lever tôt » ; « le matin » rend explicitement בַּבֹּקֶר.
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: bâtit un autel
  rationale: Rendu direct et naturel de בנה avec מִזְבֵּחַ, dans un registre digne et courant.
- source_word: תַּחַת הָהָר
  choice: au pied de la montagne
  rationale: Littéralement « sous la montagne » ; dans ce contexte spatial, l’expression française idiomatique désigne la base de la montagne.
- source_word: וּשְׁתֵּים עֶשְׂרֵה מַצֵּבָה
  choice: et dressa douze stèles
  rationale: מַצֵּבָה désigne une pierre dressée ou stèle. Le verbe « dressa », elliptique en hébreu, explicite naturellement en français l’action associée à ces pierres sans modifier leur fonction.
- source_word: לִשְׁנֵים עָשָׂר שִׁבְטֵי יִשְׂרָאֵל
  choice: pour les douze tribus d’Israël
  rationale: La préposition ל marque ici la correspondance ou la représentation ; « pour » préserve cette relation sans imposer une explication supplémentaire.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: YHWH ; le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom personnel divin plutôt que de lui substituer un titre.
- issue: Fonction des douze stèles
  choice: pour les douze tribus d’Israël
  alternative: représentant les douze tribus d’Israël
  rationale: « Pour » conserve la portée relativement ouverte de ל, tandis que « représentant » expliciterait davantage la fonction symbolique probable.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe narrative reste fluide tout en conservant l’enchaînement du texte hébreu. Les marqueurs [a] et [b] sont placés précisément après les expressions qu’ils documentent.
