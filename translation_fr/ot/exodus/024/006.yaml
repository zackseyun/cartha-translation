  yaml_path: translation/ot/exodus/024/006.yaml
  text: Moses took half of the blood and put it in basins[a], and half of the blood he threw against the altar.
translation:
  language: fr
  text: Moïse prit la moitié du sang et la mit dans des bassins ; puis il projeta l’autre moitié sur l’autel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « aspergea l’autel » ou « jeta le sang sur l’autel ». Dans les contextes sacrificiels, le verbe hébreu peut désigner une application du sang par projection.'
    reason: Alternative lexicale liée au sens du verbe sacrificiel זָרַק.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe לקח, dans cette suite narrative, exprime simplement l’action de prendre ; « prit » est l’équivalent français direct et naturel.
- source_word: חֲצִי הַדָּם
  choice: la moitié du sang
  rationale: Cette formulation rend clairement la construction partitive hébraïque.
- source_word: וַיָּשֶׂם
  choice: la mit
  rationale: Le verbe שׂים est un verbe général de placement ; avec « la moitié », le pronom féminin « la » donne une phrase française fluide.
- source_word: בָּאַגָּנֹת
  choice: dans des bassins
  rationale: אַגָּנֹת désigne ici des récipients destinés à contenir un liquide ; « bassins » convient au contexte sacrificiel tout en restant compréhensible.
- source_word: זָרַק
  choice: projeta
  rationale: Dans le contexte sacrificiel, זרק évoque une application énergique du sang plutôt qu’une fine aspersion ; « projeta » conserve cette force sans être maladroit en français.
- source_word: עַל הַמִּזְבֵּחַ
  choice: contre l’autel
  rationale: Avec « projeta », « contre l’autel » rend naturellement le mouvement du sang lancé sur la surface de l’autel.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française courante du nom hébreu מֹשֶׁה.
theological_decisions:
- issue: Mode d’application rituelle du sang
  choice: « projeta […] contre l’autel »
  alternative: « aspergea l’autel » ou « répandit sur l’autel »
  rationale: Le verbe hébreu permet plusieurs formulations dans les contextes sacrificiels. Le texte principal retient une expression énergique correspondant probablement au geste physique, sans lui ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. Le point-virgule distingue les deux opérations parallèles, tandis que « l’autre moitié » explicite naturellement en français que la seconde mention concerne le reste du même sang.
