  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת הַ/דָּ֔ם וַ/יִּזְרֹ֖ק עַל הָ/עָ֑ם וַ/יֹּ֗אמֶר הִנֵּ֤ה דַֽם הַ/בְּרִית֙ אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִמָּ/כֶ֔ם עַ֥ל כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/008.yaml
  text: Then Moses took the blood and threw it on the people[a], and said, “Behold[b], the blood of the covenant that Yahweh has made with you concerning all these words.”
translation:
  language: fr
  text: 'Moïse prit alors le sang et le lança sur le peuple[a]. Il dit : « Voici le sang de l’alliance que Yahweh a conclue avec vous sur la base de toutes ces paroles[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en aspergea le peuple ». Le verbe hébreu signifie plus littéralement « lancer » ou « projeter », mais il peut désigner l’application rituelle du sang dans un contexte sacrificiel.
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « au sujet de toutes ces paroles ». L’hébreu peut présenter ces paroles comme le fondement de l’alliance ou comme ce à quoi elle se rapporte.'
    reason: ambiguity
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit alors
  rationale: Le wayyiqtol poursuit la narration; « prit » rend simplement לקח, et « alors » marque naturellement la succession en français.
- source_word: הַדָּם
  choice: le sang
  rationale: L’article défini renvoie au sang sacrificiel déjà mentionné dans le contexte.
- source_word: וַיִּזְרֹק
  choice: le lança
  rationale: זרק signifie concrètement lancer ou projeter; cette traduction conserve sa force, tandis qu’une note signale le sens rituel possible « aspergea ».
- source_word: עַל הָעָם
  choice: sur le peuple
  rationale: עַל garde ici son sens spatial direct; la tournure est naturelle en français.
- source_word: הִנֵּה
  choice: Voici
  rationale: « Voici » exprime la présentation solennelle marquée par הִנֵּה sans recourir à une formulation archaïque.
- source_word: דַם הַבְּרִית
  choice: le sang de l’alliance
  rationale: La construction génitive est rendue directement, en préservant une expression importante dans le contexte biblique.
- source_word: כָּרַת
  choice: a conclue
  rationale: Dans l’expression idiomatique כּרת ברית, le français naturel dit « conclure une alliance »; le littéralisme « couper » serait obscur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: עִמָּכֶם
  choice: avec vous
  rationale: Rend directement la préposition et le suffixe masculin pluriel; le français ne marque pas ici davantage le pluriel.
- source_word: עַל כָּל הַדְּבָרִים הָאֵלֶּה
  choice: sur la base de toutes ces paroles
  rationale: Dans ce contexte, עַל relie la conclusion de l’alliance aux paroles qui en constituent le fondement; « paroles » conserve la portée de דְּבָרִים sans la réduire à « clauses ».
theological_decisions:
- issue: Expression idiomatique כָּרַת ... בְּרִית
  choice: l’alliance que Yahweh a conclue
  alternative: l’alliance que Yahweh a coupée
  rationale: « Conclure une alliance » restitue en français le sens reconnu de l’idiome hébreu. Traduire littéralement par « couper » créerait une obscurité absente pour le lecteur hébreu, même si le contexte sacrificiel peut expliquer l’origine de l’expression.
- issue: Rapport exprimé par עַל כָּל הַדְּבָרִים הָאֵלֶּה
  choice: sur la base de toutes ces paroles
  alternative: au sujet de toutes ces paroles
  rationale: La préposition peut exprimer le fondement ou le rapport. Le contexte de ratification favorise l’idée que les paroles énoncées fondent l’alliance, mais la note conserve l’autre nuance possible.
- issue: Rendu du nom יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; sa translittération préserve cette distinction sans substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici » conserve la solennité de la déclaration. « Lança » garde la vigueur concrète du verbe hébreu, avec clarification rituelle en note. « A conclue » est idiomatique en français et évite le calque opaque « a coupé une alliance ».
