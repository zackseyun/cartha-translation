  text: וַ/יִּקַּח֙ סֵ֣פֶר הַ/בְּרִ֔ית וַ/יִּקְרָ֖א בְּ/אָזְנֵ֣י הָ/עָ֑ם וַ/יֹּ֣אמְר֔וּ כֹּ֛ל אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶׂ֥ה וְ/נִשְׁמָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/007.yaml
  text: Then he took the Book of the Covenant and read it in the hearing of the people[a], and they said, “All that Yahweh has spoken we will do, and we will obey.”
translation:
  language: fr
  text: 'Puis il prit le livre de l’alliance et le lut devant le peuple. Ils dirent : « Tout ce que Yahweh a dit, nous le ferons et nous l’écouterons[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et nous obéirons ». Le verbe hébreu peut signifier « entendre, écouter » et, dans le contexte de l’alliance, « obéir ».'
    reason: Alternative lexicale préservant la double portée de שׁמע.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Puis il prit
  rationale: Le wayyiqtol fait progresser le récit ; « Puis » en restitue naturellement la succession.
- source_word: סֵפֶר הַבְּרִית
  choice: le livre de l’alliance
  rationale: Cette formulation conserve l’image concrète d’un document écrit et demeure idiomatique en français.
- source_word: וַיִּקְרָא בְּאָזְנֵי הָעָם
  choice: le lut devant le peuple
  rationale: Avec un document pour objet, קרא signifie ici « lire » ; « devant le peuple » exprime naturellement la lecture publique indiquée par l’idiome « aux oreilles du peuple ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel plutôt que de lui substituer un titre.
- source_word: נַעֲשֶׂה
  choice: nous le ferons
  rationale: עשה désigne concrètement l’action d’accomplir ce qui a été dit ; le pronom reprend naturellement « tout ce que » en français.
- source_word: וְנִשְׁמָע
  choice: et nous l’écouterons
  rationale: שמע peut signifier écouter et, dans le cadre de l’alliance, obéir. Le choix principal conserve la dimension auditive, particulièrement pertinente après la lecture publique, sans effacer la portée d’obéissance.
theological_decisions:
- issue: Sens de la réponse d’alliance וְנִשְׁמָע
  choice: et nous l’écouterons
  alternative: et nous obéirons
  rationale: Le verbe hébreu associe l’écoute à l’obéissance. La traduction principale préserve cette tension lexicale, tandis que la note explicite le sens possible d’obéissance.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation sépare la lecture de la réponse collective. « Livre de l’alliance » conserve la désignation traditionnelle et concrète du document.
