  text: וְ/אֶל הַ/זְּקֵנִ֤ים אָמַר֙ שְׁבוּ לָ֣/נוּ בָ/זֶ֔ה עַ֥ד אֲשֶׁר נָשׁ֖וּב אֲלֵי/כֶ֑ם וְ/הִנֵּ֨ה אַהֲרֹ֤ן וְ/חוּר֙ עִמָּ/כֶ֔ם מִי בַ֥עַל דְּבָרִ֖ים יִגַּ֥שׁ אֲלֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/014.yaml
  text: And to the elders he said[a], “Wait here for us until we return to you. And look, Aaron and Hur are with you. Whoever has a dispute, let him approach them.”
translation:
  language: fr
  text: 'Il dit aux anciens : « Attendez-nous ici jusqu’à ce que nous revenions auprès de vous. Voici qu’Aaron et Hour sont avec vous. Quiconque a un différend[a], qu’il s’adresse à eux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quiconque a une affaire à régler » ; ou « Quiconque a une cause ».'
    reason: L’expression בַעַל דְּבָרִים peut désigner celui qui porte un litige, une affaire ou une cause devant les responsables chargés de la juger.
lexical_decisions:
- source_word: הַזְּקֵנִים
  choice: les anciens
  rationale: Le terme désigne ici les anciens reconnus comme responsables de la communauté, et non simplement des hommes âgés.
- source_word: שְׁבוּ לָנוּ בָזֶה
  choice: Attendez-nous ici
  rationale: ישׁב signifie littéralement « s’asseoir, demeurer, rester ». Dans cette consigne, la tournure française « Attendez-nous ici » exprime naturellement l’ordre de rester sur place jusqu’au retour de Moïse et de son compagnon.
- source_word: עַד אֲשֶׁר נָשׁוּב אֲלֵיכֶם
  choice: jusqu’à ce que nous revenions auprès de vous
  rationale: La formulation garde la valeur temporelle de עַד אֲשֶׁר et le sens de retour porté par שוב.
- source_word: וְהִנֵּה
  choice: Voici
  rationale: « Voici » attire l’attention sur la présence d’Aaron et de Hour sans recourir à une formule archaïque.
- source_word: עִמָּכֶם
  choice: sont avec vous
  rationale: La préposition עִם exprime directement la présence et l’association.
- source_word: מִי בַעַל דְּבָרִים
  choice: Quiconque a un différend
  rationale: L’expression idiomatique désigne une personne engagée dans une affaire, une plainte ou un litige. « A un différend » rend clairement sa portée judiciaire tout en laissant en note une autre possibilité.
- source_word: יִגַּשׁ אֲלֵהֶם
  choice: qu’il s’adresse à eux
  rationale: Dans ce contexte, l’imparfait hébreu a une valeur directive. « S’adresser à eux » est plus naturel en français juridique courant que le calque spatial « s’approcher d’eux ».
theological_decisions:
- issue: Singulier générique dans une instruction judiciaire
  choice: Quiconque… qu’il s’adresse à eux
  alternative: Que toute personne… s’adresse à eux
  rationale: Le texte hébreu emploie un sujet générique singulier (מִי … יִגַּשׁ). La traduction conserve cette structure sans élargir ni restreindre la catégorie des personnes concernées.
translation_notes:
  register: Français international moderne, digne et accessible. « Hour » suit la forme française biblique courante du nom חוּר. La ponctuation met en valeur les trois consignes successives sans alourdir la phrase.
