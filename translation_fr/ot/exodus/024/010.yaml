  text: וַ/יִּרְא֕וּ אֵ֖ת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/תַ֣חַת רַגְלָ֗י/ו כְּ/מַעֲשֵׂה֙ לִבְנַ֣ת הַ/סַּפִּ֔יר וּ/כְ/עֶ֥צֶם הַ/שָּׁמַ֖יִם לָ/טֹֽהַר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/010.yaml
  text: And they saw the God of Israel[a], and under his feet was something like a pavement of sapphire stone[b], like the very heavens in clearness.
translation:
  language: fr
  text: Ils virent le Dieu d’Israël, et sous ses pieds, il y avait comme un pavement de saphir[a][b], aussi limpide que le ciel lui-même.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme l’ouvrage d’un pavement de saphir »; l’expression évoque une surface façonnée, semblable à un dallage ou à un pavement.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou peut-être : « lapis-lazuli »; l’identification exacte de סַפִּיר dans l’Antiquité est incertaine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: ils virent
  rationale: Le qal narratif de ראה exprime directement la perception visuelle. Cette formulation conserve sans l’atténuer l’affirmation du texte.
- source_word: אֵת אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: La construction désigne explicitement celui qu’ils voient; l’article défini est naturel en français et maintient cette identification précise.
- source_word: וְתַחַת רַגְלָיו
  choice: et sous ses pieds, il y avait
  rationale: תחת signifie « sous » ou « au-dessous de ». L’hébreu n’a pas de verbe dans cette proposition; « il y avait » est ajouté pour produire une phrase française naturelle tout en conservant le langage anthropomorphique.
- source_word: כְּמַעֲשֵׂה לִבְנַת
  choice: comme un pavement
  rationale: מַעֲשֶׂה évoque un ouvrage ou un travail façonné, et לִבְנָה une brique ou une dalle. « Comme un pavement » rend naturellement l’image d’une surface aménagée sous les pieds, sans suggérer une brique isolée.
- source_word: הַסַּפִּיר
  choice: de saphir
  rationale: « Saphir » maintient la traduction traditionnelle de סַפִּיר. L’identification minéralogique ancienne reste incertaine et peut aussi renvoyer au lapis-lazuli; cette possibilité est signalée en note.
- source_word: וּכְעֶצֶם הַשָּׁמַיִם
  choice: que le ciel lui-même
  rationale: 'עֶצֶם a ici une valeur intensive: il s’agit du ciel dans sa réalité même, et non littéralement de son « os ». Le singulier collectif « le ciel » est idiomatique en français.'
- source_word: לָטֹהַר
  choice: aussi limpide
  rationale: טֹהַר désigne la pureté ou la clarté. Dans cette description visuelle, « limpide » exprime clairement la qualité optique de la scène.
theological_decisions:
- issue: Vision anthropomorphique de Dieu
  choice: Conserver « Ils virent le Dieu d’Israël » et « sous ses pieds » sans atténuation interprétative.
  alternative: « Ils virent une manifestation du Dieu d’Israël » ou « ils virent l’endroit où se tenait le Dieu d’Israël ».
  rationale: L’hébreu affirme directement qu’ils voient le Dieu d’Israël et parle de ses pieds. Ajouter « manifestation » ou reformuler l’objet de la vision résoudrait une tension théologique que le texte lui-même laisse subsister.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La formulation reste proche de l’ordre et des images de l’hébreu, tout en explicitant la proposition nominale par « il y avait ». Les deux notes sont placées après « saphir », là où portent réellement les précisions lexicales.
