  yaml_path: translation/ot/exodus/024/015.yaml
  text: Then Moses went up onto the mountain[a], and the cloud covered the mountain.
translation:
  language: fr
  text: Puis Moïse monta sur la montagne[a], et le nuage couvrit la montagne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et Moïse monta jusqu’à la montagne. » La conjonction narrative hébraïque peut se rendre simplement par « et », et la préposition peut indiquer la destination (« jusqu’à ») ou, avec le verbe « monter », le mouvement sur la montagne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: monta
  rationale: Le verbe עלה exprime un mouvement vers le haut. « Monta » est direct, naturel et convient au récit sans suggérer nécessairement l’effort impliqué par « escalada ».
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom.
- source_word: אֶל
  choice: sur
  rationale: Avec le verbe « monter » et la montagne comme destination, « sur » exprime naturellement le mouvement vers la montagne et sur celle-ci. Le sens plus strict « vers » demeure possible et est signalé en note.
- source_word: הָהָר
  choice: la montagne
  rationale: Dans le contexte du Sinaï, הַר désigne naturellement « la montagne ».
- source_word: וַיְכַס
  choice: couvrit
  rationale: Le verbe כסה signifie directement « couvrir ». Le passé simple maintient un récit français digne et fluide.
- source_word: הֶעָנָן
  choice: la nuée
  rationale: « Nuée » est un terme français établi pour un nuage associé à une manifestation divine, tout en restant descriptif et sans ajouter « gloire » ni « de l’Éternel ».
- source_word: אֶת
  choice: '[marque de l’objet direct non traduite]'
  rationale: Cette particule hébraïque marquant l’objet direct défini n’a pas d’équivalent lexical à rendre en français.
- source_word: וַ
  choice: Alors / et
  rationale: Le waw narratif fait progresser la séquence. « Alors » convient au premier verbe, tandis que « et » relie naturellement la seconde action.
theological_decisions:
- issue: Nature de la nuée
  choice: Traduire simplement par « la nuée », sans expliciter sa signification divine.
  alternative: « la nuée de gloire » ou « la nuée de l’Éternel »
  rationale: Le texte hébreu nomme seulement la nuée. Le contexte l’associe à la présence divine, mais le verset n’ajoute ni « gloire » ni un nom divin.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient à la narration biblique écrite sans être archaïque. « Nuée » conserve la tonalité biblique et la portée contextuelle du terme sans surinterprétation.
