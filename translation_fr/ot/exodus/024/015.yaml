  - severity: low
    issue: La formulation de note « vers la montagne » affaiblit légèrement l’idée d’arrivée exprimée par אֶל dans ce contexte.
    rationale: « Vers » exprime surtout une orientation. « Jusqu’à la montagne » rend plus nettement la destination tout en laissant ouverte, en note, l’alternative à « sur la montagne ».
  revised_text: Puis Moïse monta sur la montagne[a], et le nuage couvrit la montagne.
