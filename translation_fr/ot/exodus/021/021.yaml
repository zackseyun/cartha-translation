  text: אַ֥ךְ אִם י֛וֹם א֥וֹ יוֹמַ֖יִם יַעֲמֹ֑ד לֹ֣א יֻקַּ֔ם כִּ֥י כַסְפּ֖/וֹ הֽוּא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/021.yaml
  text: However[a], if he survives for a day or two, he shall not be avenged[b], for he is his money.
translation:
  language: fr
  text: Toutefois, s’il reste en vie un jour ou deux, aucune vengeance ne sera exercée contre le maître[a], car cet esclave est son argent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aucune rétribution ne sera exercée contre lui ». Le verbe hébreu évoque plus précisément une vengeance ou une rétribution judiciaire qu’une punition au sens général.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « car il est son argent », formulation qui exprime la valeur économique de l’esclave pour son maître.'
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Toutefois
  rationale: Introduit l’exception ou la restriction apportée au cas juridique précédent, dans un français naturel et soutenu.
- source_word: יוֹם אוֹ יוֹמַיִם
  choice: un jour ou deux
  rationale: Rend directement l’expression temporelle hébraïque sans préciser davantage la durée.
- source_word: יַעֲמֹד
  choice: reste en vie
  rationale: Le sens littéral est « se tient », mais, dans ce contexte, il s’agit de demeurer vivant après les coups, sans nécessairement être rétabli.
- source_word: לֹא יֻקַּם
  choice: le maître ne fera pas l’objet d’une vengeance
  rationale: Le hophal de נקם exprime la vengeance ou la rétribution exercée contre quelqu’un. L’explicitation « le maître » clarifie le référent sans réduire le terme à une punition générique.
- source_word: כִּי
  choice: car
  rationale: Introduit sobrement la justification de la décision juridique.
- source_word: כַסְפּוֹ הוּא
  choice: cet esclave est son argent
  rationale: Conserve la formulation économique, abrupte et littérale du texte hébreu; « cet esclave » explicite le référent masculin du pronom.
theological_decisions:
- issue: Justification économique dans une loi relative à l’esclavage
  choice: Conserver « cet esclave est son argent »
  alternative: « il est sa propriété » ou « la perte est à sa charge »
  rationale: Le texte hébreu formule explicitement la justification en termes d’argent. La traduction ne l’atténue pas et laisse subsister sa dureté éthique.
- issue: Portée de la rétribution
  choice: « ne fera pas l’objet d’une vengeance »
  alternative: « ne sera pas puni »
  rationale: Le verbe hébreu désigne plus précisément la vengeance ou la rétribution judiciaire; « puni » serait plus général et pourrait effacer cette nuance.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le caractère juridique du passage et sa justification économique abrupte, tout en explicitant les référents pour éviter une ambiguïté artificielle en français.
