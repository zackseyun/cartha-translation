base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/037.yaml
  text: If a man steals an ox or a sheep and slaughters it or sells it[b][a], he shall repay five cattle for the ox and four sheep for the sheep.
translation:
  language: fr
  text: Si un homme vole un bovin ou une bête du petit bétail[a], et abat ou vend l’animal, il devra fournir cinq bovins en compensation du bovin et quatre bêtes du petit bétail en compensation de la bête du petit bétail[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu שֶׂה désigne une bête du petit bétail, qui peut être un mouton ou une chèvre.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il devra indemniser ». Le verbe hébreu exprime ici l’obligation juridique de fournir une compensation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Si
  rationale: Introduit la condition d’une loi casuistique; « si » restitue naturellement la structure condition-conséquence en français.
- source_word: יִגְנֹב
  choice: vole
  rationale: Rend directement גנב dans ce contexte juridique.
- source_word: אִישׁ
  choice: un homme
  rationale: Conserve le masculin singulier générique de l’hébreu.
- source_word: שׁוֹר
  choice: un bovin
  rationale: שׁוֹר désigne ici une tête de gros bétail sans imposer le sexe ni l’état de castration que pourraient suggérer « taureau » ou « bœuf ».
- source_word: שֶׂה
  choice: une bête du petit bétail
  rationale: Préserve l’étendue du terme, qui peut désigner un mouton ou une chèvre.
- source_word: וּטְבָחוֹ
  choice: puis l’abat
  rationale: טבח désigne l’abattage d’un animal plutôt qu’une mise à mort quelconque; « puis » rend naturellement la succession dans la condition sans durcir sa chronologie.
- source_word: מְכָרוֹ
  choice: ou la vend
  rationale: Rend directement מכר et son suffixe objet au présent juridique français.
- source_word: חֲמִשָּׁה בָקָר
  choice: cinq bovins
  rationale: בקר est un collectif désignant le gros bétail; « bovins » permet ici le dénombrement sans préciser indûment le sexe.
- source_word: יְשַׁלֵּם
  choice: il donnera en compensation
  rationale: Dans ce contexte légal, שלם exprime la restitution ou compensation due, et pas seulement un remboursement monétaire.
- source_word: תַּחַת
  choice: pour
  rationale: Exprime de façon idiomatique le remplacement compensatoire marqué par תחת.
- source_word: וְאַרְבַּע צֹאן
  choice: quatre bêtes du petit bétail
  rationale: Préserve le sens collectif de צאן, qui comprend ovins et caprins, et maintient la correspondance avec שֶׂה.
