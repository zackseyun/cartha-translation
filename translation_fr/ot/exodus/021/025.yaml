  text: burn for burn[a], wound for wound, bruise for bruise.
translation:
  language: fr
  text: brûlure pour brûlure, blessure pour blessure, meurtrissure pour meurtrissure[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « marque de coup pour marque de coup » ; le mot hébreu désigne la trace laissée par un coup.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּוִיָּה
  choice: brûlure
  rationale: Le nom désigne une brûlure ou la marque qu’elle laisse. « Brûlure » est concis, naturel et convient au parallélisme juridique.
- source_word: תַּחַת
  choice: pour
  rationale: Dans cette formule juridique, le terme exprime une correspondance ou une compensation. « Pour » restitue clairement et sobrement la structure répétée de l’hébreu.
- source_word: פֶּצַע
  choice: blessure
  rationale: Le mot désigne concrètement une plaie ou une blessure. « Blessure » garde cette portée générale sans la restreindre à une coupure.
- source_word: חַבּוּרָה
  choice: meurtrissure
  rationale: Le terme désigne la trace, l’enflure ou la contusion laissée par un coup. « Meurtrissure » est compréhensible, digne et préserve le lien avec un traumatisme corporel.
