  yaml_path: translation/ot/exodus/021/033.yaml
  text: And if a man opens a pit[a], or if a man digs a pit and does not cover it, and an ox or a donkey falls into it[b],
translation:
  language: fr
  text: Si un homme[b] ouvre une fosse[a], ou s’il creuse une fosse et ne la couvre pas, et qu’un bœuf ou un âne y tombe,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « découvre une fosse » ; le verbe hébreu signifie littéralement « ouvre » et peut désigner l’ouverture d’une fosse existante plutôt que le creusement d’une nouvelle fosse.
    reason: lexical_alternative
  - marker: b
    text: « Un homme » traduit la formule juridique hébraïque au masculin singulier אִישׁ, employée ici de manière générique.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִי
  choice: Si
  rationale: Introduit le cas juridique hypothétique. En français, « Si » suffit naturellement; le waw de liaison est rendu par l’enchaînement avec le contexte précédent plutôt que par un lourd « Et si ».
- source_word: יִפְתַּח
  choice: ouvre
  rationale: Reproduit le sens premier du verbe hébreu et maintient la distinction avec l’action de creuser dans la proposition suivante; il peut s’agir de découvrir une fosse existante.
- source_word: אִישׁ
  choice: un homme
  rationale: Conserve la formulation juridique hébraïque au masculin singulier, employée ici de manière générique.
- source_word: בּוֹר
  choice: une fosse
  rationale: Terme français large et naturel pour une excavation dangereuse; « citerne » serait trop spécifique dans ce contexte.
- source_word: א֠וֹ כִּי
  choice: ou si
  rationale: Présente le second cas possible, parallèle au premier.
- source_word: יִכְרֶה
  choice: creuse
  rationale: Rend simplement l’action de pratiquer une excavation et la distingue de l’ouverture d’une fosse existante.
- source_word: וְ/לֹא יְכַסֶּנּוּ
  choice: et ne la couvre pas
  rationale: Exprime concrètement l’absence de couverture protectrice; le pronom féminin reprend naturellement « fosse ».
- source_word: וְ/נָפַל
  choice: et que… tombe
  rationale: Poursuit la condition juridique en français idiomatique au subjonctif après la coordination de la proposition introduite par « si ».
- source_word: שָׁמָּה
  choice: y
  rationale: Le pronom adverbial français exprime naturellement le mouvement vers l’intérieur de la fosse.
- source_word: שּׁוֹר
  choice: un bœuf
  rationale: Désignation française traditionnelle et précise d’un bovin dans ce contexte juridique.
- source_word: א֥וֹ חֲמוֹר
  choice: ou un âne
  rationale: Terme moderne courant pour l’animal domestique visé.
