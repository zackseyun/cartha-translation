  text: וְ/כִֽי יִמְכֹּ֥ר אִ֛ישׁ אֶת בִּתּ֖/וֹ לְ/אָמָ֑ה לֹ֥א תֵצֵ֖א כְּ/צֵ֥את הָ/עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/007.yaml
  text: And if a man sells his daughter as a female servant[b][a], she shall not go out as the male servants go out.
translation:
  language: fr
  text: Si un homme vend sa fille comme esclave[a], elle ne sera pas libérée aux mêmes conditions que les esclaves hommes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme servante ». Le terme hébreu désigne une esclave ; « esclave » explicite ici son statut juridique.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « elle ne sortira pas comme sortent les esclaves ». Autrement dit, elle ne quitte pas son service selon les mêmes modalités que les esclaves hommes mentionnés dans la loi précédente.'
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִי
  choice: Si
  rationale: Introduit un nouveau cas conditionnel dans la série de lois. En français juridique courant, « Si » exprime naturellement la condition; il n’est pas nécessaire de rendre ו par « Et ».
- source_word: יִמְכֹּר
  choice: vend
  rationale: Le présent convient à l’énoncé général d’un cas juridique et traduit directement l’acte de vente.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom est masculin singulier et désigne ici le père ou chef de famille qui vend sa fille.
- source_word: בִּתּוֹ
  choice: sa fille
  rationale: Traduction directe du nom de parenté accompagné du suffixe masculin singulier.
- source_word: לְאָמָה
  choice: comme esclave
  rationale: אָמָה désigne une femme ou une jeune fille placée en esclavage ou en service lié. « Esclave » rend explicite son statut juridique sans l’atténuer par « servante ».
- source_word: לֹא תֵצֵא כְּצֵאת
  choice: elle ne sera pas libérée aux mêmes conditions
  rationale: Littéralement, le texte dit qu’elle ne « sortira » pas comme sortent les autres esclaves. Dans cette loi, sortir signifie être affranchi ou libéré du service; la formulation française rend clairement le sens juridique et la comparaison de manière.
- source_word: הָעֲבָדִים
  choice: les esclaves de sexe masculin
  rationale: Le contraste avec אָמָה et le contexte immédiat indiquent les esclaves hommes régis par la loi précédente. Cette formulation conserve la distinction sexuée déterminante dans le cas juridique.
theological_decisions:
- issue: Terminologie de l’esclavage dans la loi de l’alliance
  choice: Employer « esclave » plutôt que « servante » ou « domestique »
  alternative: « servante », « jeune servante » ou « domestique »
  rationale: La vente et les modalités de libération montrent que le statut de dépendance juridique est central. « Esclave » évite d’adoucir la réalité sociale décrite, sans porter de jugement supplémentaire absent du verset.
- issue: Nature différente de la libération de la fille
  choice: Dire qu’elle n’est pas libérée « aux mêmes conditions » que les esclaves de sexe masculin
  alternative: 'Traduire littéralement : « elle ne sortira pas comme sortent les esclaves »'
  rationale: Le verset établit une différence de modalités de sortie, précisée par les versets suivants; il ne dit pas à lui seul qu’elle ne pourra jamais être libérée. La traduction préserve cette tension et évite une conclusion absolue.
translation_notes:
  register: Français international moderne, clair et digne. La formulation juridique reste concise. « Être libérée » remplace l’hébraïsme peu naturel « sortir », tandis qu’une note conserve la forme littérale et explique le lien avec le cas précédent.
