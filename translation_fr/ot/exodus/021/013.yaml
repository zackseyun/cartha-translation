  source_fidelity: La formulation « l’a fait tomber entre ses mains » suggère que Dieu a livré la victime à l’auteur, nuance qui peut évoquer une remise intentionnelle et ne rend pas bien l’occurrence non préméditée exprimée par l’idiome אִנָּה לְיָדוֹ. « A fait que cela arrive par sa main » conserve la causalité providentielle et l’instrumentalité humaine sans introduire cette implication.
  naturalness: « Ne l’a pas guetté » est plus idiomatique et précis en français moderne que « ne lui a pas tendu de piège » pour le contraste juridique entre guet-apens/préméditation et acte non prémédité. « Désignerai un lieu » est naturel dans ce cadre légal.
  terminology: Dieu est le référent le plus probable de הָאֱלֹהִים ici. La révision maintient la tension du texte entre absence de préméditation et providence divine, sans la résoudre doctrinalement.
