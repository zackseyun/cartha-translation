  yaml_path: translation/ot/exodus/021/013.yaml
  text: But if he did not lie in wait[a], and God caused it to come into his hand, then I will appoint for you a place to which he may flee.
translation:
  language: fr
  text: Mais s’il ne l’a pas guetté et que Dieu a fait que cela arrive par sa main[a], je te désignerai un lieu où il pourra s’enfuir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Dieu l’a fait venir à sa main ». L’idiome indique que l’acte est survenu par son intermédiaire, sans préméditation, tout en l’inscrivant sous la providence de Dieu.'
    reason: Explicitation de l’idiome hébreu et de sa tension entre causalité divine et action humaine.
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: Mais s’il
  rationale: Introduit, par contraste avec le verset précédent, le cas conditionnel d’un homicide non prémédité.
- source_word: לֹא צָדָה
  choice: ne lui a pas tendu de piège
  rationale: Dans ce contexte juridique, צדה évoque l’action de guetter ou de préméditer, et non la chasse au sens propre.
- source_word: וְהָאֱלֹהִים
  choice: et que Dieu
  rationale: Le contexte décrit une occurrence relevant de la providence; le sens «juges» est ici moins probable.
- source_word: אִנָּה לְיָדוֹ
  choice: l’a fait tomber entre ses mains
  rationale: Cette expression française naturelle conserve l’image hébraïque de la main, la causalité divine et l’action humaine, sans introduire une préméditation.
- source_word: וְשַׂמְתִּי לְךָ מָקוֹם
  choice: je te fixerai un lieu
  rationale: «Fixer un lieu» exprime avec naturel la désignation officielle d’un refuge.
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: où il pourra s’enfuir
  rationale: Rend le déplacement vers le lieu et la possibilité légale de s’y réfugier.
theological_decisions:
- issue: Action divine dans un homicide non prémédité
  choice: Dieu l’a fait tomber entre ses mains
  alternative: Dieu a permis que cela arrive par sa main
  rationale: Le choix maintient l’affirmation forte de la causalité providentielle présente dans l’hébreu, tout en conservant la responsabilité instrumentale de l’auteur et l’absence de préméditation.
translation_notes:
  register: Français international moderne, clair et digne. Le pronom «l’» garde le référent implicite du contexte immédiat; «entre ses mains» préserve l’image source sans paraître artificiel.
