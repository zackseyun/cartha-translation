  text: If a ransom is imposed on him[a], then he shall give the redemption price for his life according to all that is imposed on him.
translation:
  language: fr
  text: Si une rançon lui est imposée[a], il versera le prix de rachat de sa vie, selon tout ce qui lui sera imposé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Si le paiement d’une rançon lui est imposé… » L’hébreu emploie deux termes distincts, de sens juridique voisin : כֹּפֶר (« rançon ») et פִּדְיֹן (« prix de rachat »).'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit le cas conditionnel qui fait suite à la règle précédente concernant la responsabilité du propriétaire du taureau.
- source_word: כֹּפֶר
  choice: une rançon
  rationale: Désigne une somme versée pour détourner une peine ou obtenir une libération. « Rançon » rend ici la valeur juridique du terme sans introduire un sens cultuel.
- source_word: יוּשַׁת עָלָיו
  choice: lui est imposée
  rationale: Le passif de שׁית avec עַל exprime l’imposition d’une obligation juridique; cette formulation est naturelle en français.
- source_word: וְנָתַן
  choice: il versera
  rationale: Exprime la conséquence juridique de la condition. « Verser » convient idiomatiquement à une somme d’argent tout en conservant la force prescriptive.
- source_word: פִּדְיֹן נַפְשׁוֹ
  choice: le prix de rachat de sa vie
  rationale: Préserve la distinction entre פִּדְיֹן, prix de libération ou de rachat, et כֹּפֶר, rançon; נֶפֶשׁ désigne ici la vie de la personne.
- source_word: כְּכֹל אֲשֶׁר יוּשַׁת עָלָיו
  choice: selon tout ce qui lui sera imposé
  rationale: Conserve l’idée de pleine conformité à la somme fixée ainsi que la répétition de l’expression juridique.
theological_decisions:
- issue: Nature du paiement dans un contexte où la peine de mort est encourue
  choice: Employer « rançon » et « prix de rachat » sans suggérer ni innocence morale ni expiation cultuelle.
  alternative: Rendre les deux termes par « amende », ou employer un vocabulaire plus explicitement expiatoire.
  rationale: Le paiement imposé judiciairement permet de racheter la vie du responsable au lieu de lui appliquer la peine autrement prévue. Le français conserve la terminologie juridique de délivrance sans lui ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le parallélisme juridique et distingue les deux termes hébreux tout en restant naturelle.
