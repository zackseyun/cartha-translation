source:
  edition: WLC
  text: וְ/הִגִּישׁ֤/וֹ אֲדֹנָי/ו֙ אֶל הָ֣/אֱלֹהִ֔ים וְ/הִגִּישׁ/וֹ֙ אֶל הַ/דֶּ֔לֶת א֖וֹ אֶל הַ/מְּזוּזָ֑ה וְ/רָצַ֨ע אֲדֹנָ֤י/ו אֶת אָזְנ/וֹ֙ בַּ/מַּרְצֵ֔עַ וַ/עֲבָד֖/וֹ לְ/עֹלָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/006.yaml
  text: then his master shall bring him to God[a], and shall bring him to the door or to the doorpost, and his master shall pierce his ear with an awl; and he shall serve him forever.
translation:
  language: fr
  text: alors son maître le fera venir devant Dieu[a], puis il le fera approcher de la porte ou du montant de la porte. Son maître lui percera l’oreille avec un poinçon, et il le servira pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « devant les juges » ou « devant l’autorité judiciaire ». Dans certains contextes juridiques, le mot hébreu אֱלֹהִים peut désigner des juges humains ou une autorité judiciaire.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִגִּישׁוֹ
  choice: le fera venir / le fera approcher
  rationale: Le hifil de נגשׁ exprime ici le fait de faire comparaître ou approcher quelqu’un. La variation française évite une répétition pesante tout en conservant les deux étapes de la procédure.
- source_word: אֲדֹנָיו
  choice: son maître
  rationale: Dans cette loi relative à la servitude, « maître » exprime naturellement le rapport social et juridique sans les connotations divines possibles de « seigneur ».
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Le sens premier est « Dieu ». Dans ce cadre juridique, « les juges » ou « l’autorité judiciaire » demeure toutefois une interprétation plausible, signalée en note afin de préserver l’ambiguïté.
- source_word: הַדֶּלֶת
  choice: la porte
  rationale: Équivalent français simple et concret du lieu rituel indiqué.
- source_word: הַמְּזוּזָה
  choice: le montant de la porte
  rationale: Cette formulation désigne précisément l’élément vertical de l’encadrement et reste immédiatement compréhensible.
- source_word: רָצַע
  choice: percera
  rationale: Le verbe désigne l’action de perforer l’oreille au moyen d’un outil pointu.
- source_word: אָזְנוֹ
  choice: l’oreille
  rationale: Traduction directe de la partie du corps mentionnée ; le pronom français est exprimé naturellement par « lui ».
- source_word: בַּמַּרְצֵעַ
  choice: avec un poinçon
  rationale: « Poinçon » est un terme français courant et précis pour l’instrument pointu servant à percer.
- source_word: וַעֲבָדוֹ
  choice: et il le servira
  rationale: La traduction conserve le verbe עבד et son complément personnel sans remplacer l’action par une nouvelle désignation de statut.
- source_word: לְעֹלָם
  choice: pour toujours
  rationale: Rendu direct de l’expression hébraïque. Dans ce contexte juridique humain, elle désigne naturellement une condition durable, en pratique à vie, sans qu’il soit nécessaire d’expliciter cette limite dans le texte.
theological_decisions:
- issue: Sens de הָאֱלֹהִים dans un contexte juridique
  choice: Dieu
  alternative: les juges / l’autorité judiciaire
  rationale: « Dieu » respecte le sens lexical le plus direct et peut évoquer une comparution devant Dieu dans un cadre sacré et judiciaire. La compréhension comme juges humains ou tribunal est ancienne et plausible ; elle est donc conservée en note plutôt qu’écartée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la succession juridique des actes. « Devant Dieu » rend mieux en français la comparution impliquée par אֶל הָאֱלֹהִים qu’un simple « à Dieu ». « Pour toujours » conserve la formulation forte du texte sans résoudre silencieusement sa portée contextuelle.
