  text: וְ/כִֽי יַכֶּה֩ אִ֨ישׁ אֶת עַבְדּ֜/וֹ א֤וֹ אֶת אֲמָת/וֹ֙ בַּ/שֵּׁ֔בֶט וּ/מֵ֖ת תַּ֣חַת יָד֑/וֹ נָקֹ֖ם יִנָּקֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/020.yaml
  text: And if a man strikes his male servant or his female servant with a rod[a], and the servant dies under his hand, he must surely be avenged.
translation:
  language: fr
  text: Si un homme frappe son esclave, homme ou femme, avec un bâton, et que cette personne meurt sous ses coups, elle devra certainement être vengée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le coupable devra certainement être puni ». L’hébreu dit plus littéralement : « elle devra certainement être vengée » ; il s’agit d’une formule juridique emphatique.'
    reason: Alternative lexicale et clarification de la formule juridique hébraïque.
lexical_decisions:
- source_word: וְ/כִֽי
  choice: Si
  rationale: Introduit naturellement en français une loi casuistique; la coordination hébraïque n’a pas besoin d’être reproduite par « Et » dans ce verset isolé.
- source_word: יַכֶּה
  choice: frappe
  rationale: Rend le sens large de נכה sans préciser davantage la manière; l’instrument est indiqué ensuite.
- source_word: אִישׁ
  choice: un homme
  rationale: Conserve le masculin singulier explicite du texte juridique hébreu.
- source_word: עַבְדּוֹ
  choice: son esclave
  rationale: Dans ce contexte légal, עבד désigne un statut d’asservissement plutôt qu’un simple service.
- source_word: אֲמָתוֹ
  choice: son esclave femme
  rationale: Désigne explicitement une femme réduite en esclavage tout en évitant le terme vieilli « servante » et l’ambiguïté possible de « esclave » sans précision.
- source_word: בַּשֵּׁבֶט
  choice: avec un bâton
  rationale: שבט désigne ici l’instrument utilisé pour frapper; « bâton » est courant et naturel en français moderne.
- source_word: וּ/מֵת תַּחַת יָד/וֹ
  choice: et que l’esclave meurt sous ses coups
  rationale: Le sujet est explicité afin d’éviter l’ambiguïté des pronoms français. « Sous ses coups » transmet idiomatiquement la mort immédiate sous l’action de celui qui frappe.
- source_word: נָקֹם יִנָּקֵם
  choice: il faudra certainement le venger
  rationale: Conserve le sens lexical de vengeance et la forte insistance produite par l’infinitif absolu suivi du verbe conjugué, sans préciser une peine que le verset ne nomme pas.
theological_decisions:
- issue: Nature de la conséquence juridique exprimée par נָקֹם יִנָּקֵם
  choice: il faudra certainement le venger
  alternative: le coupable devra certainement être puni
  rationale: L’hébreu impose avec insistance une action de vengeance judiciaire sans définir ici son mécanisme ni sa peine exacte. La formulation retenue préserve cette indétermination et la gravité juridique.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire nomme sans euphémisme la condition servile. La syntaxe juridique reste naturelle; la note conserve l’autre interprétation recevable de la sanction.
