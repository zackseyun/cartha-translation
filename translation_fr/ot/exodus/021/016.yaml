base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/016.yaml
  text: Whoever kidnaps a man and sells him[a], or he is found in his hand[b], shall surely be put to death.
translation:
  language: fr
  text: Celui qui enlève un homme et le vend[a], ou si l’homme est trouvé entre les mains de celui qui l’a enlevé[b], sera certainement mis à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vole un homme ». Dans ce contexte, il s’agit de l’enlèvement d’une personne.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans sa main », expression hébraïque qui signifie « en sa possession » ou « sous son contrôle ». La conjonction peut aussi se traduire par « et ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹנֵב
  choice: enlève
  rationale: Le verbe signifie littéralement « voler », mais avec un homme pour objet et dans le contexte de sa vente ou de sa détention, il désigne l’enlèvement d’une personne. « Enlève » exprime naturellement cette infraction en français moderne.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom hébreu est masculin singulier. « Un homme » conserve cette forme sans exclure la portée représentative possible de cette loi.
- source_word: וּמְכָרוֹ
  choice: et le vend
  rationale: Le suffixe masculin singulier renvoie à l’homme enlevé; cette formulation est directe et fidèle.
- source_word: וְנִמְצָא בְיָדוֹ
  choice: ou si l’homme est retrouvé en son pouvoir
  rationale: Littéralement « et il est trouvé dans sa main ». L’expression « en son pouvoir » restitue l’idiome hébreu de possession ou de contrôle. La répétition de « l’homme » évite en français l’ambiguïté du pronom, qui pourrait autrement désigner le ravisseur.
- source_word: מֹות יוּמָת
  choice: sera certainement mis à mort
  rationale: L’infinitif absolu suivi du verbe conjugué renforce la certitude de la peine. La tournure passive exprime une sentence judiciaire plutôt qu’une simple prédiction.
theological_decisions:
- issue: Portée de l’infraction légale
  choice: La peine s’applique à celui qui enlève un homme, que la victime ait déjà été vendue ou qu’elle soit encore retrouvée sous son contrôle.
  alternative: 'On peut comprendre la seconde proposition comme une circonstance cumulative : « et qu’il soit retrouvé en son pouvoir ».'
  rationale: 'Dans cette loi casuistique, la conjonction peut introduire deux situations possibles après l’enlèvement : la vente de la victime ou sa détention persistante. « Ou si » rend cette portée juridique sans effacer l’autre analyse possible, signalée en note.'
translation_notes:
  register: Français international moderne, clair et digne. « Enlève » est plus idiomatique que « vole » pour une personne, tandis que les notes préservent le sens littéral et l’ambiguïté de la conjonction. La formulation juridique reste solennelle sans employer un français archaïque.
