  text: וְ/אֵ֨לֶּה֙ הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר תָּשִׂ֖ים לִ/פְנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/001.yaml
  text: These are the judgments that you shall set before them:[a]
translation:
  language: fr
  text: 'Voici les règles de droit[a] que tu placeras devant eux :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jugements », « prescriptions » ou « ordonnances ». Le terme hébreu désigne ici des règles, des jugements ou des dispositions juridiques.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: « Voici » introduit naturellement en français moderne la nouvelle section tout en la reliant au contexte précédent, sans ajouter une valeur temporelle absente de l’hébreu.
- source_word: הַמִּשְׁפָּטִים
  choice: les règles de droit
  rationale: Dans ce contexte d’alliance et de jurisprudence, מִשְׁפָּטִים désigne des décisions ou dispositions juridiques. « Règles de droit » garde cette nuance mieux que le terme générique « lois » et sonne plus naturellement aujourd’hui que « ordonnances ».
- source_word: אֲשֶׁר
  choice: que
  rationale: Le pronom relatif « que » introduit naturellement la proposition relative en français.
- source_word: תָּשִׂים
  choice: tu placeras
  rationale: Le verbe שׂים signifie « mettre, placer, établir ». « Placer » conserve ici l’image concrète de l’hébreu et convient à la locution qui suit.
- source_word: לִפְנֵיהֶם
  choice: devant eux
  rationale: La locution signifie littéralement et idiomatiquement « devant eux », c’est-à-dire en leur présence et à leur intention.
theological_decisions:
- issue: Sens de מִשְׁפָּטִים dans le cadre des lois de l’alliance
  choice: règles de droit
  alternative: jugements ; prescriptions ; ordonnances ; lois
  rationale: Le choix conserve la portée juridico-casuiste du terme sans le réduire à l’idée moderne d’un verdict judiciaire ni lui donner une coloration confessionnelle particulière.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse singulière faite à Moïse. La formulation conserve l’image hébraïque « placer devant eux » et les deux-points annonçant les dispositions qui suivent.
