source:
  edition: WLC
  text: וְ/אִם אָס֖וֹן יִהְיֶ֑ה וְ/נָתַתָּ֥ה נֶ֖פֶשׁ תַּ֥חַת נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/023.yaml
  text: But if there is harm[a], then you shall give life for life.
translation:
  language: fr
  text: Mais s’il y a un dommage grave[a], tu donneras vie pour vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « malheur », « blessure grave » ou « mort ». Le terme hébreu peut désigner un dommage sérieux ou un désastre; selon les interprétations, le contexte évoque une atteinte grave en général ou, plus précisément, une issue fatale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais s’il
  rationale: La conjonction introduit une condition en contraste avec le cas précédent; « Mais s’il » rend naturellement cette opposition en français.
- source_word: אָסוֹן
  choice: un dommage grave
  rationale: Le nom désigne un malheur ou un dommage sérieux et peut, selon le contexte, aller jusqu’à une issue fatale. « Dommage grave » conserve cette amplitude sans imposer la mort comme seule lecture.
- source_word: יִהְיֶה
  choice: il y a
  rationale: Cette tournure existentielle rend simplement et naturellement en français l’idée qu’un dommage survient.
- source_word: וְנָתַתָּה
  choice: tu donneras
  rationale: Le verbe signifie littéralement « donner ». Cette formulation préserve le caractère juridique de l’énoncé sans suggérer à tort une simple compensation financière.
- source_word: נֶפֶשׁ
  choice: vie
  rationale: Dans cette formule juridique, נֶפֶשׁ désigne la vie plutôt que l’âme au sens abstrait.
- source_word: תַּחַת
  choice: pour
  rationale: Dans la formule talionique, la préposition exprime la substitution ou l’équivalence; « pour » est concis et idiomatique.
- source_word: נֶפֶשׁ
  choice: vie
  rationale: La répétition maintient la symétrie lexicale et juridique de l’hébreu.
theological_decisions:
- issue: Portée du dommage désigné par אָסוֹן
  choice: Employer « dommage grave » sans préciser qui le subit ni affirmer qu’il est nécessairement mortel.
  alternative: « malheur », « blessure grave » ou « mort »
  rationale: Le terme hébreu indique un dommage sérieux ou un désastre, mais ce verset ne tranche pas explicitement la question débattue de son référent ni celle d’une issue nécessairement fatale. La traduction et la note conservent cette tension.
translation_notes:
  register: Français international moderne, sobre et juridique. Le tutoiement singulier reflète la deuxième personne masculine singulière du texte hébreu. La formule « vie pour vie » conserve le parallélisme mémorable de l’original.
