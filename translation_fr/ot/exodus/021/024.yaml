lexical_decisions:
- source_word: עַיִן
  choice: œil
  rationale: Le nom désigne l’œil physique. L’absence d’article conserve en français la concision et le rythme de la formule juridique hébraïque.
- source_word: תַּחַת
  choice: pour
  rationale: Dans ce contexte juridique, תַּחַת exprime une correspondance ou une compensation équivalente, et non la position spatiale « sous ». « Pour » est naturel dans cette formule française et en préserve la portée concise.
- source_word: שֵׁן
  choice: dent
  rationale: Le nom signifie « dent ». La forme sans article respecte le parallélisme serré de l’hébreu.
- source_word: יָד
  choice: main
  rationale: Le sens courant est la main physique. Ce choix maintient la correspondance lexicale et la cadence de l’énumération.
- source_word: רֶגֶל
  choice: pied
  rationale: Même si רֶגֶל peut parfois désigner plus largement la jambe ou le membre inférieur, « pied » convient ici à la formule juridique et au parallélisme des parties du corps.
theological_decisions:
- issue: Nature de la formule juridique
  choice: 'Formulation concise d’une compensation proportionnée : « œil pour œil… pied pour pied »'
  alternative: Une explicitation telle que « la peine devra correspondre au dommage causé »
  rationale: L’hébreu juxtapose uniquement les noms des parties du corps reliés par תַּחַת. Une paraphrase explicative trancherait au-delà de la formulation du verset; la traduction conserve donc sa brièveté et sa tension juridique.
translation_notes:
  register: Français international moderne, sobre et digne. La formule traditionnelle « œil pour œil » est immédiatement compréhensible et reproduit le rythme lapidaire du texte hébreu.
