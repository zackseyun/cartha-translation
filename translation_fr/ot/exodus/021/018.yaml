  text: וְ/כִֽי יְרִיבֻ֣/ן אֲנָשִׁ֔ים וְ/הִכָּה אִישׁ֙ אֶת רֵעֵ֔/הוּ בְּ/אֶ֖בֶן א֣וֹ בְ/אֶגְרֹ֑ף וְ/לֹ֥א יָמ֖וּת וְ/נָפַ֥ל לְ/מִשְׁכָּֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/018.yaml
  text: If men quarrel and one strikes his neighbor with a stone or with his fist[a], and he does not die but is confined to bed,
translation:
  language: fr
  text: Si des hommes se querellent et que l’un frappe l’autre avec une pierre ou avec son poing, sans que celui-ci meure mais qu’il doive garder le lit,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: Si
  rationale: Introduit un cas juridique hypothétique; « si » convient naturellement au style casuistique français.
- source_word: יְרִיבֻן אֲנָשִׁים
  choice: des hommes se querellent
  rationale: ריב désigne une dispute ou une querelle susceptible ici de dégénérer en violence; « hommes » conserve la référence masculine explicite.
- source_word: וְהִכָּה אִישׁ אֶת רֵעֵהוּ
  choice: que l’un frappe l’autre
  rationale: Formulation française fluide qui individualise les deux participants sans répéter « homme »; רֵעֵהוּ désigne ici l’autre partie au conflit.
- source_word: בְּאֶבֶן
  choice: avec une pierre
  rationale: Rend directement le beth instrumental et le sens courant de אֶבֶן.
- source_word: אוֹ בְאֶגְרֹף
  choice: ou à coups de poing
  rationale: אֶגְרֹף signifie « poing »; cette tournure idiomatique française n’impose pas qu’il y ait eu un seul coup.
- source_word: וְלֹא יָמוּת
  choice: sans le tuer
  rationale: Exprime naturellement en français le résultat négatif de l’agression, tout en maintenant la victime comme référent.
- source_word: וְנָפַל לְמִשְׁכָּב
  choice: mais que le blessé soit obligé de garder le lit
  rationale: Littéralement « tombe au lit »; l’expression décrit une immobilisation au lit causée par les blessures. « Le blessé » clarifie le sujet sans résoudre une ambiguïté théologique.
theological_decisions: []
