id: EXO.21.28
reference: Exodus 21:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כִֽי יִגַּ֨ח שׁ֥וֹר אֶת אִ֛ישׁ א֥וֹ אֶת אִשָּׁ֖ה וָ/מֵ֑ת סָק֨וֹל יִסָּקֵ֜ל הַ/שּׁ֗וֹר וְ/לֹ֤א יֵאָכֵל֙ אֶת בְּשָׂר֔/וֹ וּ/בַ֥עַל הַ/שּׁ֖וֹר נָקִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/028.yaml
  text: And if an ox gores a man or a woman and he dies[a], the ox shall surely be stoned, and its flesh shall not be eaten; but the owner of the ox is clear.
translation:
  language: fr
  text: Si un bœuf encorne un homme ou une femme et que la personne meure, le bœuf devra être lapidé, et l’on ne mangera pas sa chair ; mais le propriétaire du bœuf ne sera pas tenu pour responsable.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sera quitte » ou « sera innocent ». Le terme hébreu indique ici que le propriétaire est dégagé de responsabilité ou de peine, sans en préciser davantage la nature.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Si
  rationale: Introduit naturellement en français une loi casuistique. Le lien avec le contexte est suffisamment porté par l’enchaînement des dispositions, sans qu’un « Et » initial soit nécessaire.
- source_word: יִגַּח
  choice: encorne
  rationale: Rend précisément l’action de frapper avec les cornes et convient au contexte juridique.
- source_word: שׁוֹר
  choice: bœuf
  rationale: Équivalent français traditionnel et suffisamment général dans ce contexte légal, sans préciser indûment le sexe comme le ferait « taureau ».
- source_word: אֶת אִישׁ אוֹ אֶת אִשָּׁה
  choice: un homme ou une femme
  rationale: Conserve la mention explicite des deux sexes dans l’hébreu.
- source_word: וָמֵת
  choice: et que la personne meure
  rationale: Évite en français l’incohérence d’un pronom masculin après « un homme ou une femme », tout en désignant clairement la victime encornée.
- source_word: סָקוֹל יִסָּקֵל
  choice: devra être lapidé
  rationale: Le tour injonctif exprime l’obligation juridique; le français n’a pas besoin d’un adverbe comme « certainement » pour rendre naturellement l’emphase de l’infinitif absolu.
- source_word: וְלֹא יֵאָכֵל אֶת בְּשָׂרוֹ
  choice: et l’on ne mangera pas sa chair
  rationale: Rend la construction passive hébraïque par un tour impersonnel français naturel et conserve le terme concret « chair ».
- source_word: וּבַעַל הַשּׁוֹר
  choice: mais le propriétaire du bœuf
  rationale: « Propriétaire » exprime clairement la relation juridique; « mais » met en évidence le contraste entre le sort de l’animal et celui de son propriétaire.
- source_word: נָקִי
  choice: ne sera pas tenu pour responsable
  rationale: Dans ce cadre juridique, le terme indique que le propriétaire est dégagé de responsabilité ou de peine. Cette formulation française est plus naturelle et plus claire que le calque « est quitte », sans définir précisément la nature de l’exemption.
theological_decisions:
- issue: Statut juridique du propriétaire du bœuf dans la dernière proposition
  choice: Le propriétaire n’est pas tenu pour responsable dans ce cas de base.
  alternative: Le propriétaire est innocent au sens moral, ou il est seulement exempté d’une peine capitale particulière.
  rationale: Le verset oppose la mise à mort de l’animal à l’absence de sanction contre son propriétaire, avant que les versets suivants traitent de la négligence connue. La traduction ne précise donc pas si l’exemption est morale, civile ou strictement pénale.
translation_notes:
  register: Français international moderne, clair et digne, avec un registre juridique accessible. Le point-virgule maintient le contraste interne du verset. Le marqueur de note est placé après la proposition qu’il éclaire.
