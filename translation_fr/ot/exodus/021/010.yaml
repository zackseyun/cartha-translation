  text: אִם אַחֶ֖רֶת יִֽקַּֽח ל֑/וֹ שְׁאֵרָ֛/הּ כְּסוּתָ֥/הּ וְ/עֹנָתָ֖/הּ לֹ֥א יִגְרָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/010.yaml
  text: If he takes another wife for himself[a], he shall not diminish her food, her clothing, or her marital rights.
translation:
  language: fr
  text: S’il prend une autre femme pour lui, il ne diminuera pas la nourriture, les vêtements ni les droits conjugaux[a] de la première femme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son intimité conjugale ». Le terme hébreu, rare, désigne ici l’obligation du mari en matière d’intimité dans le mariage.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: S’il
  rationale: La conjonction introduit la condition d’une loi casuistique. « Si » en conserve directement la forme.
- source_word: אַחֶרֶת יִקַּח לוֹ
  choice: prend une autre femme pour lui
  rationale: Dans ce contexte matrimonial, « prendre une femme » signifie la prendre pour épouse. « Pour lui » reflète לוֹ sans alourdir la formulation.
- source_word: שְׁאֵרָהּ
  choice: la nourriture … de la première
  rationale: Dans cette série d’obligations matérielles et conjugales, le terme désigne très probablement la nourriture ou la subsistance. « Nourriture » est clair et concret.
- source_word: כְּסוּתָהּ
  choice: les vêtements … de la première
  rationale: Le nom désigne ce qui couvre, donc les vêtements. Le pluriel collectif est naturel en français.
- source_word: וְעֹנָתָהּ
  choice: le droit conjugal[a] … de la première
  rationale: Le terme rare renvoie généralement à l’obligation d’intimité sexuelle dans le mariage. « Droit conjugal » garde le registre juridique et évite une formulation trop clinique, tandis que la note explicite le sens.
- source_word: לֹא יִגְרָע
  choice: il ne réduira en rien
  rationale: Le verbe signifie diminuer ou retrancher. Cette tournure française s’applique naturellement aux trois obligations énumérées.
theological_decisions:
- issue: Identification de la femme visée par les suffixes féminins
  choice: de la première
  alternative: sa nourriture, ses vêtements et son droit conjugal
  rationale: Les suffixes renvoient à la femme déjà mentionnée dans le contexte, par contraste avec « une autre ». L’explicitation française évite que les possessifs soient compris comme visant la nouvelle épouse, sans modifier la portée de la loi.
translation_notes:
  register: Français moderne, digne et accessible, avec une formulation juridique sobre. La répétition finale « de la première » clarifie le référent des trois suffixes hébreux.
