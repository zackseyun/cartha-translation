base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/005.yaml
  text: But if the servant plainly says[a], ‘I love my master, my wife, and my children[b]; I will not go out free,’
translation:
  language: fr
  text: 'Mais si l’esclave déclare expressément[a] : « J’aime mon maître, ma femme et mes fils[b] ; je ne partirai pas en homme libre »,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « affirme avec insistance ». L’hébreu associe un infinitif absolu au verbe conjugué afin de renforcer la déclaration.
    reason: lexical_alternative
  - marker: b
    text: Ou « mes enfants ». Le terme hébreu désigne littéralement des fils, mais peut, selon le contexte, avoir une portée plus générale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit une exception conditionnelle qui contraste avec la libération prévue dans le contexte précédent.
- source_word: אָמֹר יֹאמַר
  choice: déclare expressément
  rationale: La construction associant l’infinitif absolu au verbe conjugué souligne le caractère ferme et explicite de la déclaration.
- source_word: הָעֶבֶד
  choice: l’esclave
  rationale: Le contexte juridique porte sur une personne liée au service dont la libération est en jeu ; « esclave » rend clairement ce statut sans l’atténuer.
- source_word: אָהַבְתִּי
  choice: J’aime
  rationale: L’accompli hébreu exprime ici une affection établie qui demeure présente ; le présent est naturel en français.
- source_word: אֲדֹנִי
  choice: mon maître
  rationale: Dans ce cadre domestique et juridique, « maître » exprime adéquatement la relation d’autorité.
- source_word: אִשְׁתִּי
  choice: ma femme
  rationale: Traduction directe et naturelle du nom avec suffixe possessif.
- source_word: בָּנָי
  choice: mes enfants
  rationale: Le masculin pluriel signifie littéralement « mes fils », mais peut désigner collectivement la descendance dans ce contexte familial.
- source_word: לֹא אֵצֵא חָפְשִׁי
  choice: je ne partirai pas libre
  rationale: Préserve l’image hébraïque de sortir ou partir dans l’état d’homme libre, tout en restant compréhensible en français courant.
theological_decisions:
- issue: Traduction de עבד dans la législation israélite sur la servitude
  choice: esclave
  alternative: serviteur ; serviteur sous contrat
  rationale: La libération d’une personne astreinte au service est précisément l’enjeu du passage. « Esclave » maintient visible la réalité juridique de la dépendance sans imposer une harmonisation doctrinale.
- issue: Portée de בָּנַי
  choice: mes enfants
  alternative: mes fils
  rationale: Le contexte ne permet pas de déterminer si seuls des garçons sont visés. Le texte principal retient l’usage collectif possible, tandis que la note conserve le sens morphologique plus étroit.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le cadre juridique et la dureté du statut évoqué, sans archaïsme. Le futur « je ne partirai pas libre » maintient la forme de la déclaration hébraïque sans ajouter explicitement « je ne veux pas », bien que cette volonté soit impliquée par le contexte.
