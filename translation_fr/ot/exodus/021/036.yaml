source:
  edition: WLC
  text: א֣וֹ נוֹדַ֗ע כִּ֠י שׁ֣וֹר נַגָּ֥ח הוּא֙ מִ/תְּמ֣וֹל שִׁלְשֹׁ֔ם וְ/לֹ֥א יִשְׁמְרֶ֖/נּוּ בְּעָלָ֑י/ו שַׁלֵּ֨ם יְשַׁלֵּ֥ם שׁוֹר֙ תַּ֣חַת הַ/שּׁ֔וֹר וְ/הַ/מֵּ֖ת יִֽהְיֶה לּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/036.yaml
  text: Or if it was known that the ox was accustomed to gore from yesterday and the day before[a], and its owner did not keep it in, he must surely pay ox for ox[c][b], and the dead animal will be his.
translation:
  language: fr
  text: Ou bien, s’il était établi que le bœuf avait déjà l’habitude de donner des coups de corne[a] et que son propriétaire ne l’avait pas retenu, celui-ci devra donner un bœuf en compensation du bœuf tué, et la bête morte lui appartiendra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « depuis hier et avant-hier », expression hébraïque indiquant que ce comportement s’était déjà manifesté auparavant.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « et la carcasse lui appartiendra ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: א֣וֹ
  choice: Ou bien
  rationale: Introduit l’autre cas juridique envisagé après le verset précédent et conserve la valeur disjonctive.
- source_word: נוֹדַע כִּי
  choice: s’il était établi que
  rationale: Rend la tournure passive et impersonnelle dans un registre juridique naturel; כִּי introduit le contenu du fait établi.
- source_word: שׁוֹר
  choice: bœuf
  rationale: Terme français traditionnel et suffisamment large dans ce contexte de législation sur les bovins.
- source_word: נַגָּח
  choice: avait déjà l’habitude de donner des coups de corne
  rationale: Exprime une propension connue et répétée, plutôt qu’un acte isolé.
- source_word: מִתְּמוֹל שִׁלְשֹׁם
  choice: déjà
  rationale: Rend naturellement l’idiome hébreu désignant un comportement antérieur avéré; le sens littéral est conservé en note.
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: ne l’avait pas tenu sous garde
  rationale: שמר implique ici que le propriétaire devait surveiller et contenir l’animal dangereux.
- source_word: בְּעָלָיו
  choice: son propriétaire
  rationale: Équivalent moderne clair dans ce contexte de responsabilité légale.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: devra donner … en compensation
  rationale: L’infinitif absolu suivi de l’imparfait marque une obligation ferme; la formulation française exprime clairement la réparation imposée.
- source_word: שׁוֹר תַּחַת הַשּׁוֹר
  choice: un bœuf en compensation du bœuf tué
  rationale: תחת marque ici le remplacement compensatoire. L’ajout de « tué » explicite sans ambiguïté lequel des deux bœufs doit être remplacé.
- source_word: וְהַמֵּת יִהְיֶה לּוֹ
  choice: et la bête morte lui appartiendra
  rationale: Préserve la référence sobre à l’animal mort et le transfert de possession, sans préciser davantage l’identité du pronom.
theological_decisions:
- issue: Référent de לּוֹ (« lui ») dans la dernière proposition
  choice: Conserver le pronom « lui »
  alternative: Préciser « appartiendra au propriétaire responsable » ou « à l’autre propriétaire »
  rationale: Le texte hébreu ne nomme pas explicitement le bénéficiaire dans cette proposition. La traduction conserve cette concision et cette possible tension référentielle au lieu de la résoudre silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation juridique reste ferme sans archaïsme. « Donner des coups de corne » est plus naturel en français courant que le verbe rare « encorner »; « tenu sous garde » associe surveillance et maîtrise de l’animal.
