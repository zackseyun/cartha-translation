  source_fidelity: 'Le sens juridique du texte hébreu est bien rendu : cas alternatif, dangerosité antérieure connue, défaut de surveillance, compensation par un bœuf et attribution de l’animal mort. « Déjà » est une condensation acceptable de l’idiome « depuis hier et avant-hier », explicité en note. « Bœuf tué » explicite correctement le référent de הַמֵּת dans ce contexte.'
