source:
  edition: WLC
  text: אִם רָעָ֞ה בְּ/עֵינֵ֧י אֲדֹנֶ֛י/הָ אֲשֶׁר לא יְעָדָ֖/הּ וְ/הֶפְדָּ֑/הּ לְ/עַ֥ם נָכְרִ֛י לֹא יִמְשֹׁ֥ל לְ/מָכְרָ֖/הּ בְּ/בִגְד/וֹ בָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/008.yaml
  text: If she is displeasing in the eyes of her master[a], who has not designated her for himself, then he shall let her be redeemed. He has no right to sell her to a foreign people[b], since he has dealt deceitfully with her.
translation:
  language: fr
  text: Si elle déplaît à son maître, qui ne l’a pas destinée pour lui-même[a], il permettra qu’elle soit rachetée. Il n’a pas le droit de la vendre à un peuple étranger, puisqu’il a agi avec perfidie envers elle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre lecture possible : « qui l’a destinée — ou fiancée — pour lui-même ». La proposition hébraïque présente une difficulté textuelle et interprétative.'
    reason: textual_variant
  - marker: b
    text: 'Ou : « puisqu’il l’a trahie » ; littéralement, l’expression évoque une conduite déloyale ou perfide envers elle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה בְּעֵינֵי
  choice: déplaît à
  rationale: Cette formulation naturelle en français rend l’idiome hébreu sans suggérer que la jeune femme serait moralement mauvaise.
- source_word: אֲדֹנֶיהָ
  choice: son maître
  rationale: Dans ce cadre juridique, le terme désigne l’homme qui détient l’autorité légale sur elle; « maître » préserve ce rapport social sans employer un titre divin.
- source_word: יְעָדָהּ
  choice: l’a destinée à lui-même
  rationale: « Destiner » conserve la largeur du verbe, qui renvoie ici à une affectation en vue d’une union, sans imposer dans le texte principal le sens plus précis de « fiancer ».
- source_word: וְהֶפְדָּהּ
  choice: il permettra qu’elle soit rachetée
  rationale: Le hiphil indique ici qu’il doit permettre ou rendre possible son rachat, sans laisser entendre qu’il paie lui-même le prix.
- source_word: לְעַם נָכְרִי
  choice: à un peuple étranger
  rationale: La formulation garde la valeur collective de עַם et la distinction sociale exprimée par נָכְרִי.
- source_word: לֹא יִמְשֹׁל לְמָכְרָהּ
  choice: Il n’a pas le droit de la vendre
  rationale: Cette expression française rend clairement l’absence d’autorité ou de pouvoir juridique.
- source_word: בְּבִגְדוֹ בָהּ
  choice: puisqu’il a agi avec perfidie envers elle
  rationale: « Agir avec perfidie » exprime la déloyauté ou la trahison d’une obligation impliquée par בגד, dans un registre digne et actuel.
theological_decisions:
- issue: Ambiguïté textuelle et interprétative de יְעָדָהּ avec לא
  choice: qui ne l’a pas destinée à lui-même
  alternative: qui l’a destinée — ou fiancée — à lui-même
  rationale: Le texte massorétique présente une difficulté connue entre la lecture négative écrite et une tradition de lecture affirmative, tandis que le contexte peut préciser « destiner » au sens de « fiancer ». Le texte principal suit la forme négative fournie et la note conserve l’autre lecture sans résoudre artificiellement la tension.
translation_notes:
  register: Français international moderne, juridique mais accessible. La syntaxe reste digne et claire; l’idiome « mauvais à ses yeux » est rendu naturellement par « déplaît à », tandis que l’ambiguïté textuelle majeure est conservée en note.
