  text: וְ/אִם לִ/בְנ֖/וֹ יִֽיעָדֶ֑/נָּה כְּ/מִשְׁפַּ֥ט הַ/בָּנ֖וֹת יַעֲשֶׂה לָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/009.yaml
  text: But if he designates her for his son[a], he shall deal with her according to the rights of daughters.
translation:
  language: fr
  text: Mais s’il la destine à son fils, il la traitera conformément au droit applicable aux filles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « conformément à la coutume concernant les filles ». L’expression hébraïque peut désigner une règle de droit établie ou une pratique coutumière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais s’il
  rationale: Introduit un nouveau cas conditionnel en contraste avec celui du verset précédent; cette formulation convient au déroulement juridique du passage.
- source_word: לִבְנוֹ
  choice: à son fils
  rationale: Le ל indique ici la personne à laquelle la jeune femme est destinée dans le cadre d’une union; « à son fils » est naturel en français.
- source_word: יִיעָדֶנָּה
  choice: la destine
  rationale: Le verbe יעד désigne ici une affectation en vue d’une relation matrimoniale. « Destine » conserve la portée formelle sans préciser excessivement « fiance ».
- source_word: כְּמִשְׁפַּט
  choice: selon le droit
  rationale: Dans ce contexte juridique, מִשְׁפָּט peut désigner la règle établie, le statut ou les droits dus; « selon le droit » maintient cette force juridique.
- source_word: הַבָּנוֹת
  choice: des filles
  rationale: Rend directement le nom hébreu et renvoie au statut ou au traitement reconnu aux filles de la maison.
- source_word: יַעֲשֶׂה לָּהּ
  choice: il agira envers elle
  rationale: Rend la construction עשה + ל sans ajouter un contenu précis que le texte laisse implicite.
theological_decisions:
- issue: Nature de l’obligation envers la jeune femme destinée au fils
  choice: La formulation met au premier plan le droit ou le statut reconnu aux filles.
  alternative: Le syntagme peut viser plus largement la coutume ou la manière habituelle de traiter les filles, notamment lors d’un mariage.
  rationale: Le sens juridique de מִשְׁפָּט est important dans ce recueil de lois, mais l’hébreu permet aussi la nuance d’une pratique établie; la note conserve cette ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de la formulation juridique hébraïque tout en étant naturelle; la note préserve l’ambiguïté de מִשְׁפָּט.
