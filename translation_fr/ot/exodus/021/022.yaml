base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/022.yaml
  text: When men struggle together and strike a pregnant woman so that her children come out[a], but there is no harm, he shall surely be fined as the woman's husband imposes on him[c][b], and he shall pay according to the judges.
translation:
  language: fr
  text: Quand des hommes se battent et frappent une femme enceinte, de sorte que ses enfants sortent[a], mais sans qu’il y ait de dommage grave[b], l’un d’eux devra payer une amende, selon ce que lui imposera le mari de la femme, et il la versera conformément à la décision des juges[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ses enfants sortent ». L’expression peut désigner un accouchement prématuré; certaines traductions l’interprètent comme une fausse couche.'
    reason: lexical_alternative
  - marker: b
    text: Ou « malheur ». Dans ce verset pris isolément, l’hébreu ne précise pas si ce dommage concerne la mère, l’enfant ou l’un et l’autre.
    reason: alternative_reading
  - marker: c
    text: Ou « par décision judiciaire » ou « devant le tribunal ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Quand
  rationale: Introduit un cas juridique hypothétique. « Quand » convient au style casuistique français, sans exclure le sens conditionnel de « si ».
- source_word: יִנָּצוּ אֲנָשִׁים
  choice: des hommes se battent
  rationale: Le nifal de נצה décrit ici une altercation physique, et אֲנָשִׁים désigne explicitement des hommes. « Se battent » est naturel et précis en français courant.
- source_word: וְנָגְפוּ
  choice: heurtent
  rationale: Le verbe exprime le fait de porter un coup. « Heurtent » conserve l’action concrète sans présumer qu’un dommage grave en résulte.
- source_word: אִשָּׁה הָרָה
  choice: une femme enceinte
  rationale: Équivalent français moderne, clair et direct.
- source_word: וְיָצְאוּ יְלָדֶיהָ
  choice: de sorte que ses enfants sortent
  rationale: Cette formulation reste proche de l’expression hébraïque, littéralement « ses enfants sortent », et ne tranche pas entre naissance prématurée, expulsion ou fausse couche.
- source_word: אָסוֹן
  choice: dommage grave
  rationale: Le terme évoque un malheur ou un dommage sérieux. Cette traduction en exprime la gravité sans le limiter à la mort et sans préciser qui est atteint.
- source_word: עָנוֹשׁ יֵעָנֵשׁ
  choice: devra payer une amende
  rationale: L’infinitif absolu renforce l’obligation de sanction; le contexte précise qu’une somme est imposée puis versée. La tournure française exprime naturellement cette conséquence juridique.
- source_word: כַּאֲשֶׁר יָשִׁית עָלָיו
  choice: selon ce que lui imposera
  rationale: Rend l’idée de fixer ou d’imposer une pénalité à quelqu’un.
- source_word: בַּעַל הָאִשָּׁה
  choice: le mari de la femme
  rationale: Dans ce contexte, בַּעַל désigne le mari. La formulation reste explicite et proche de l’hébreu.
- source_word: וְנָתַן
  choice: il la versera
  rationale: Dans ce contexte financier, « verser » exprime plus précisément que « donner » le paiement de l’amende.
- source_word: בִּפְלִלִים
  choice: conformément à la décision des juges
  rationale: Le terme renvoie à l’autorité ou à l’arbitrage judiciaire. Cette formulation rend le rôle du jugement officiel dans le paiement.
theological_decisions:
- issue: Nature de la sortie des enfants et portée du dommage
  choice: Conserver l’expression « ses enfants sortent » et ne préciser ni l’issue de cette sortie ni la personne à laquelle s’applique le dommage grave.
  alternative: Traduire par « elle fait une fausse couche » ou « elle accouche prématurément », et rapporter le dommage soit uniquement à la mère, soit à la mère ou aux enfants.
  rationale: L’hébreu ne tranche pas explicitement ces questions dans ce verset. Une formulation ouverte préserve l’ambiguïté réelle du texte et évite d’imposer une conclusion doctrinale ou éthique.
translation_notes:
  register: Français international moderne, digne et accessible. Le style juridique demeure clair sans archaïsmes. La formulation proche de l’hébreu dans la proposition contestée est volontaire, et les principales interprétations sont signalées en notes.
