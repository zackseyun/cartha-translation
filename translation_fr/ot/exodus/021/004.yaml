    reason: Note culturelle explicitant l’expression idiomatique בְגַפּוֹ dans le contexte juridique immédiat, sans affirmer que les enfants ont été donnés par le maître.
  revision_rationale: La révision explicite l’idée d’enfantement portée par וְיָלְדָה et corrige la note pour qu’elle distingue ce que le maître donne explicitement (l’épouse) de ce qui résulte de l’union (les enfants). Le sens juridique, le contraste final et la formulation moderne sont conservés.
