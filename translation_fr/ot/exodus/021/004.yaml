revisions:
- from: Si son maître lui donne une épouse et qu’elle lui donne des fils ou des filles, l’épouse et ses enfants appartiendront à son maître, et lui partira seul.[a]
  to: Si son maître lui donne une épouse et qu’elle lui donne naissance à des fils ou à des filles, l’épouse et ses enfants appartiendront à son maître, et lui partira seul.[a]
  rationale: La révision explicite l’idée d’enfantement portée par וְיָלְדָה et corrige la note pour qu’elle distingue ce que le maître donne explicitement (l’épouse) de ce qui résulte de l’union (les enfants). Le sens juridique, le contraste final et la formulation moderne sont conservés.
