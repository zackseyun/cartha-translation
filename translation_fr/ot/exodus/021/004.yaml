base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/004.yaml
  text: If his master gives him a wife and she bears him sons or daughters[a], the wife and her children shall belong to her master[b], and he shall go out by himself.
translation:
  language: fr
  text: Si son maître lui donne une épouse et qu’elle lui donne naissance à des fils ou à des filles, l’épouse et ses enfants appartiendront à son maître, et lui partira seul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire qu’il partira sans l’épouse que son maître lui a donnée ni les enfants nés de cette union.
    reason: Note culturelle explicitant l’expression idiomatique בְגַפּוֹ dans le contexte juridique immédiat, sans affirmer que les enfants ont été donnés par le maître.
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit le cas conditionnel caractéristique de cette formulation juridique.
- source_word: אֲדֹנָיו
  choice: son maître
  rationale: Rend la relation d’autorité et de possession propre au contexte de l’esclavage, sans la connotation de titre divin que pourrait prendre « Seigneur ».
- source_word: יִתֶּן לוֹ אִשָּׁה
  choice: lui donne une épouse
  rationale: אִשָּׁה peut désigner une femme ou une épouse ; la naissance d’enfants et la situation juridique indiquent ici une union conjugale arrangée par le maître.
- source_word: וְיָלְדָה לוֹ
  choice: et qu’elle lui donne
  rationale: Expression française naturelle pour indiquer qu’elle lui donne naissance à des enfants, tout en évitant la lourdeur de « enfante pour lui ».
- source_word: בָנִים אוֹ בָנוֹת
  choice: des fils ou des filles
  rationale: Conserve la distinction explicite du texte hébreu plutôt que de la réduire au terme général « enfants ».
- source_word: הָאִשָּׁה וִילָדֶיהָ
  choice: l’épouse et ses enfants
  rationale: Maintient la cohérence avec le premier emploi d’אִשָּׁה et traduit clairement le lien maternel exprimé par le suffixe.
- source_word: תִּהְיֶה לַאדֹנֶיהָ
  choice: appartiendront à son maître
  rationale: Exprime clairement en français moderne le statut juridique et le rapport de possession indiqués par la construction hébraïque.
- source_word: וְהוּא יֵצֵא
  choice: et lui partira
  rationale: Le pronom disjoint « lui » marque le contraste avec l’épouse et les enfants qui restent ; « partira » rend naturellement la sortie du service dans ce contexte.
- source_word: בְגַפּוֹ
  choice: seul
  rationale: Rend l’idée idiomatique d’un départ sans accompagnement, en contraste avec l’épouse et les enfants.
theological_decisions:
- issue: Terminologie de l’esclavage dans un texte juridique
  choice: Employer « maître » et « appartiendront » sans atténuer le rapport de possession.
  alternative: Employer un vocabulaire comme « employeur », « patron » ou « resteront auprès de », qui adoucirait la réalité juridique.
  rationale: Le verset réglemente une situation ancienne d’esclavage ou de servitude sous contrat. La traduction doit représenter cette réalité textuelle sans l’atténuer ni y ajouter un jugement doctrinal.
- issue: Nature de l’union désignée par אִשָּׁה
  choice: Traduire par « épouse ».
  alternative: Traduire par « femme ».
  rationale: Dans ce contexte, le maître donne cette femme à l’homme dans le cadre d’une union dont naissent des enfants. « Épouse » exprime naturellement cette fonction, sans préciser davantage le statut de l’union.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la structure conditionnelle du droit casuistique, le contraste emphatique porté par « lui » et la dureté du rapport juridique exprimé dans le texte, sans archaïsme ni atténuation paraphrastique.
