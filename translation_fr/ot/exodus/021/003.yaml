  yaml_path: translation/ot/exodus/021/003.yaml
  text: If he comes in by himself[a], he shall go out by himself; if he is married[b], then his wife shall go out with him.
translation:
  language: fr
  text: S’il est entré seul[a], il sortira seul ; s’il était marié[b], sa femme sortira avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque est un idiome qui signifie ici « seul » ou « sans être accompagné ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « s’il était le mari d’une femme » ; autrement dit, s’il était marié lorsqu’il est entré en servitude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגַפּוֹ
  choice: seul
  rationale: Dans cette formule juridique, l’expression idiomatique signifie qu’il est entré sans être accompagné d’une épouse. « Seul » est naturel en français et maintient le parallélisme de la phrase.
- source_word: יָבֹא
  choice: est entré
  rationale: Le verbe désigne ici l’entrée dans la servitude. Le passé composé convient à la situation envisagée au moment de la libération et s’oppose clairement à « sortira ».
- source_word: יֵצֵא
  choice: sortira
  rationale: Dans cette loi, le verbe signifie sortir de la servitude. « Sortira » conserve l’image et le parallélisme juridique de l’hébreu.
- source_word: בַּעַל אִשָּׁה
  choice: était marié
  rationale: L’expression désigne idiomatiquement un homme ayant une épouse. « Était marié » est naturel et précise que le mariage existait lors de son entrée en servitude.
- source_word: וְיָצְאָה אִשְׁתּוֹ עִמּוֹ
  choice: sa femme sortira avec lui
  rationale: Cette traduction conserve le sujet féminin explicite, le même verbe de sortie et l’accompagnement indiqué par עִמּוֹ.
theological_decisions:
- issue: Moment auquel s’applique בַּעַל אִשָּׁה
  choice: s’il était marié
  alternative: s’il est marié
  rationale: 'Le contexte oppose les conditions existant à son entrée en servitude : entré seul ou avec une épouse. L’imparfait français rend ce rapport contextuel sans ajouter de règle étrangère au texte.'
translation_notes:
  register: Français international moderne, sobre et juridique. Le futur simple maintient la formulation normative, tandis que « entrer » et « sortir » préservent le parallélisme concret de l’hébreu.
