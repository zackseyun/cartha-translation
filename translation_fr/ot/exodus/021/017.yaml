  text: וּ/מְקַלֵּ֥ל אָבִ֛י/ו וְ/אִמּ֖/וֹ מ֥וֹת יוּמָֽת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/017.yaml
  text: Whoever curses his father or his mother shall surely be put to death[a].
translation:
  language: fr
  text: Celui qui maudit son père ou sa mère sera puni de mort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « et sa mère » ; dans cette formulation juridique, le sens est distributif et vise la malédiction prononcée contre l’un ou l’autre parent.
    reason: alternative lexicale et précision sur la portée de la conjonction
lexical_decisions:
- source_word: וּמְקַלֵּל
  choice: Celui qui maudit
  rationale: Le participe piel employé substantivement introduit, dans le style juridique, une catégorie générale de contrevenants. « Maudit » conserve ici le sens fort de prononcer une malédiction, plutôt que le sens plus large d’insulter.
- source_word: אָבִיו
  choice: son père
  rationale: Rend directement le nom muni du suffixe masculin singulier, en accord avec la formulation juridique générique de l’hébreu.
- source_word: וְאִמּוֹ
  choice: ou sa mère
  rationale: 'Bien que וְ signifie formellement « et », la coordination a ici une portée distributive : la disposition concerne celui qui maudit l’un ou l’autre de ses parents. « Ou » exprime naturellement cette portée en français juridique courant.'
- source_word: מוֹת יוּמָת
  choice: sera puni de mort
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie une forme passive et prescrit une peine capitale imposée. « Sera puni de mort » garde la valeur de sentence judiciaire et la solennité de la formule.
theological_decisions:
- issue: Portée juridique de la paire parentale
  choice: La faute vise la malédiction prononcée contre l’un ou l’autre parent, d’où « ou sa mère ».
  alternative: Conserver le littéral « et sa mère ».
  rationale: La conjonction hébraïque est formellement additive, mais la formulation légale est distributive. Le français « ou » rend clairement le champ d’application sans le restreindre ni l’élargir.
- issue: Valeur de la formule de peine capitale
  choice: « sera puni de mort » exprime une sentence judiciaire imposée.
  alternative: « devra mourir » ou « sera certainement mis à mort ».
  rationale: La construction hébraïque מוֹת יוּמָת est emphatique et passive; elle ne décrit pas simplement la mort du coupable, mais prescrit son exécution. La formulation retenue maintient cette précision sans lourdeur excessive.
translation_notes:
  register: Français international moderne, sobre et digne, avec un registre juridique clair. Le masculin singulier suit la formulation générique du texte hébreu. La ponctuation place l’appel de note immédiatement après la phrase concernée.
