source:
  edition: WLC
  text: כִּ֤י תִקְנֶה֙ עֶ֣בֶד עִבְרִ֔י שֵׁ֥שׁ שָׁנִ֖ים יַעֲבֹ֑ד וּ/בַ֨/שְּׁבִעִ֔ת יֵצֵ֥א לַֽ/חָפְשִׁ֖י חִנָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/002.yaml
  text: If you buy a Hebrew servant[a], he shall serve six years, but in the seventh he shall go out free[b], without payment.
translation:
  language: fr
  text: Si tu achètes un esclave hébreu[a], il servira pendant six ans ; mais la septième année, il sortira libre, sans rien payer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Lorsque tu achètes un esclave hébreu. » La particule hébraïque introduit ici un cas juridique et peut se rendre par « si » ou par « lorsque ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il sortira vers la liberté, gratuitement » ou « pour rien ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Si
  rationale: Introduit ici un cas juridique. « Si » convient au style casuistique français tout en laissant ouverte la nuance possible de « lorsque ».
- source_word: תִקְנֶה
  choice: tu achètes
  rationale: Le qal de קנה signifie couramment « acheter » ou « acquérir » ; le contexte juridique et commercial favorise « acheter ».
- source_word: עֶבֶד
  choice: esclave
  rationale: La personne est achetée et tenue à un service de durée déterminée. « Esclave » rend clairement ce statut sans l'atténuer en « serviteur ».
- source_word: עִבְרִי
  choice: hébreu
  rationale: Reproduit l'adjectif ethnique précis du texte, plutôt que le terme plus large « israélite ».
- source_word: שֵׁשׁ שָׁנִים
  choice: pendant six ans
  rationale: Le complément « pendant » exprime naturellement en français la durée du service.
- source_word: יַעֲבֹד
  choice: il servira
  rationale: Le verbe עבד peut signifier travailler ou servir ; « servira » convient au rapport juridique déjà explicité par « esclave ».
- source_word: וּבַשְּׁבִעִת
  choice: mais la septième année
  rationale: La conjonction marque naturellement ici le contraste avec les six années précédentes. Le mot « année », sous-entendu en hébreu, est explicité pour la clarté française.
- source_word: יֵצֵא
  choice: il sortira
  rationale: Conserve l'image hébraïque de la sortie, employée pour la libération, sans remplacer le verbe par une formulation passive.
- source_word: לַחָפְשִׁי
  choice: libre
  rationale: Rend de façon concise l'accession au statut d'homme libre après « sortira ».
- source_word: חִנָּם
  choice: sans rien payer
  rationale: Exprime naturellement que la libération n'exige aucun paiement, tout en conservant l'ambiguïté grammaticale quant à la personne qui ne paie rien.
theological_decisions:
- issue: Traduction de עֶבֶד dans une loi concernant une personne achetée
  choice: esclave
  alternative: serviteur
  rationale: Le contexte décrit explicitement une personne achetée et astreinte au service. « Esclave » représente plus franchement la condition juridique visée, tandis que « serviteur » pourrait la minimiser.
- issue: Sujet implicite du non-paiement exprimé par חִנָּם
  choice: sans rien payer
  alternative: sans qu'aucun paiement soit exigé
  rationale: La formulation française rattache naturellement le non-paiement à l'homme libéré, mais n'ajoute pas de notion de rançon absente du texte. Une note signale la portée littérale plus large.
translation_notes:
  register: Français moderne, clair et digne, avec tutoiement singulier conforme à la deuxième personne masculine singulière de l'hébreu. La formulation conserve le vocabulaire juridique et la dure réalité du statut servile, sans archaïsme ni euphémisme.
