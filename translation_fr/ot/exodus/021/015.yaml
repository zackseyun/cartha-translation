  yaml_path: translation/ot/exodus/021/015.yaml
  text: Whoever strikes his father or his mother shall surely be put to death[a].
translation:
  language: fr
  text: Celui qui frappe son père ou sa mère sera certainement mis à mort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et sa mère »; « ou sa mère » exprime ici le sens juridique selon lequel frapper l’un ou l’autre parent est visé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה
  choice: frappe
  rationale: Le participe de נכה désigne ici celui qui porte un coup. « Frappe » est naturel en français moderne et conserve la portée physique et juridique sans exagérer en « bat » ni préciser à tort une attaque armée.
- source_word: אָבִיו
  choice: son père
  rationale: L’hébreu désigne expressément le père au singulier; la formulation distincte est conservée.
- source_word: אִמּוֹ
  choice: sa mère
  rationale: L’hébreu désigne expressément la mère; nommer séparément les deux parents préserve la précision juridique du texte.
- source_word: מוֹת יוּמָת
  choice: sera certainement mis à mort
  rationale: La construction infinitif absolu + verbe conjugué renforce la formule pénale. Cette traduction garde à la fois l’intensité et la tournure passive indiquant une mise à mort judiciaire.
- source_word: וּ / וְ
  choice: ou
  rationale: La conjonction hébraïque est formellement « et », mais, dans cette loi casuistique, elle vise le fait de frapper l’un ou l’autre parent. « Ou » évite de suggérer à tort que les deux doivent être frappés.
theological_decisions:
- issue: Rendu de la formule de peine capitale
  choice: sera certainement mis à mort
  alternative: devra mourir
  rationale: La forme passive présente une peine judiciaire plutôt qu’une simple issue mortelle; « certainement » rend l’intensification hébraïque sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et solennel. « Celui qui » convient à une formulation juridique générale; la syntaxe reste proche de l’hébreu tout en étant idiomatique.
