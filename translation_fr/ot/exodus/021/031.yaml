  text: אוֹ בֵ֥ן יִגָּ֖ח אוֹ בַ֣ת יִגָּ֑ח כַּ/מִּשְׁפָּ֥ט הַ/זֶּ֖ה יֵעָ֥שֶׂה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/031.yaml
  text: If it gores a son or a daughter[b][a], it shall be done to him according to this judgment.
translation:
  language: fr
  text: S’il encorne un fils ou une fille, on lui appliquera cette même règle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire que la règle juridique énoncée au verset précédent s’applique aussi si le bovin encorne un fils ou une fille.
    reason: cross_reference
lexical_decisions:
- source_word: אוֹ
  choice: S’il
  rationale: Dans ce contexte juridique casuistique, אוֹ introduit un autre cas relevant de la même loi. Le français exprime naturellement cette valeur par « S’il ».
- source_word: בֵן
  choice: un fils
  rationale: בֵן signifie littéralement « fils » et forme ici une paire symétrique avec « fille ».
- source_word: יִגָּח
  choice: encorne
  rationale: Le verbe נגח désigne l’action de frapper avec les cornes. Le sujet implicite est le bovin mentionné dans le contexte précédent.
- source_word: בַת
  choice: une fille
  rationale: בַת signifie littéralement « fille » et conserve la formulation sexuée du texte hébreu.
- source_word: כַּמִּשְׁפָּט הַזֶּה
  choice: cette même règle
  rationale: מִשְׁפָּט désigne ici la règle ou décision juridique énoncée dans le cas précédent. « Cette même règle » rend clairement le renvoi anaphorique sans préciser au-delà de l’hébreu la peine concernée.
- source_word: יֵעָשֶׂה לּוֹ
  choice: on lui appliquera
  rationale: La tournure française impersonnelle rend naturellement le passif hébreu « il sera fait à son égard » et conserve le propriétaire du bovin comme référent de « lui » dans le contexte.
