id: EXO.21.29
reference: Exodus 21:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִ֡ם שׁוֹר֩ נַגָּ֨ח ה֜וּא מִ/תְּמֹ֣ל שִׁלְשֹׁ֗ם וְ/הוּעַ֤ד בִּ/בְעָלָי/ו֙ וְ/לֹ֣א יִשְׁמְרֶ֔/נּוּ וְ/הֵמִ֥ית אִ֖ישׁ א֣וֹ אִשָּׁ֑ה הַ/שּׁוֹר֙ יִסָּקֵ֔ל וְ/גַם בְּעָלָ֖י/ו יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/029.yaml
  text: But if the ox was accustomed to gore from yesterday and the day before[a], and its owner had been warned but did not keep it in, and it kills a man or a woman, the ox shall be stoned[b], and its owner also shall be put to death.
translation:
  language: fr
  text: Mais si un taureau avait déjà l’habitude d’encorner[a], si son propriétaire avait été averti et ne l’avait pas gardé sous contrôle, et s’il tue un homme ou une femme, le taureau sera lapidé, et son propriétaire aussi sera mis à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « depuis hier et avant-hier », expression hébraïque indiquant ici un comportement antérieur bien établi.'
    reason: cultural_note
lexical_decisions:
- source_word: שׁוֹר
  choice: taureau
  rationale: Dans ce cas juridique, שׁוֹר désigne un bovin domestique singulier. « Taureau » est naturel en français pour l’animal susceptible d’encorner, sans que le texte mette nécessairement l’accent sur son sexe.
- source_word: נַגָּח
  choice: avait déjà l’habitude de donner des coups de corne
  rationale: Le participe décrit un comportement caractéristique et répété, et non un incident isolé. Cette formulation explicite cette valeur habituelle en français courant.
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: déjà
  rationale: L’expression signifie littéralement « depuis hier et avant-hier » et fonctionne ici comme un idiome indiquant un comportement antérieur bien établi. « Déjà » s’intègre naturellement à la proposition, tandis que la note conserve l’image hébraïque.
- source_word: וְהוּעַד בִּבְעָלָיו
  choice: son propriétaire avait été averti
  rationale: Dans ce cadre juridique, le passif de עוד indique qu’un avertissement ou témoignage avait été porté à la connaissance du propriétaire.
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: ne l’avait pas gardé sous contrôle
  rationale: Le verbe signifie garder ou surveiller. Ici, il s’agit concrètement de maîtriser ou retenir un animal dangereux; cette formulation préserve ce sens sans imposer un mode précis de confinement.
- source_word: וְהֵמִית
  choice: qu’il tue
  rationale: Le verbe exprime directement la mort causée par l’animal dans la formulation conditionnelle du cas juridique.
- source_word: אִישׁ אֹו אִשָּׁה
  choice: un homme ou une femme
  rationale: La traduction conserve la mention explicite des deux sexes présente dans l’hébreu.
- source_word: יִסָּקֵל
  choice: sera lapidé
  rationale: Le niphal énonce la peine prescrite par lapidation dans la langue juridique du passage.
- source_word: וְגַם בְּעָלָיו יוּמָת
  choice: son propriétaire sera lui aussi mis à mort
  rationale: Le hophal de מות est une formule juridique passive indiquant une mise à mort imposée, et non le simple fait que le propriétaire mourra.
theological_decisions:
- issue: Portée juridique de la peine du propriétaire
  choice: sera lui aussi mis à mort
  alternative: mourra lui aussi
  rationale: יוּמָת exprime normalement une peine capitale imposée. « Mourra » pourrait laisser entendre une mort non judiciaire et affaiblir la force juridique du texte.
- issue: Désignation sexuée de la victime
  choice: un homme ou une femme
  alternative: quelqu’un
  rationale: L’hébreu nomme explicitement l’homme et la femme; la traduction maintient cette symétrie au lieu de la neutraliser.
- issue: Lien entre l’habitude antérieure et la responsabilité du propriétaire
  choice: habitude antérieure explicitement associée à l’avertissement reçu
  alternative: animal simplement dangereux
  rationale: 'Le texte fonde le cas aggravé sur deux données distinctes: un comportement déjà établi et l’avertissement du propriétaire. La traduction les conserve sans ajouter d’interprétation sur le degré de culpabilité.'
translation_notes:
  register: Français international moderne, clair et digne, avec une syntaxe juridique conditionnelle. « Taureau » et « donner des coups de corne » sont immédiatement compréhensibles; « gardé sous contrôle » rend la responsabilité pratique sans préciser indûment le moyen de contention. Un seul appel de note est placé dans le texte et correspond à la note fournie.
