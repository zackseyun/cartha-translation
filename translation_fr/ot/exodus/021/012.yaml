  text: Whoever strikes a man so that he dies shall surely be put to death[a].
translation:
  language: fr
  text: Celui qui frappe un homme et que celui-ci meurt sera assurément mis à mort[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « Celui qui frappe un homme, et celui-ci meurt, sera assurément mis à mort. »'
    reason: Cette formulation fait ressortir la coordination du cas juridique en hébreu et l’intensification de la formule pénale מוֹת יוּמָת.
lexical_decisions:
- source_word: מַכֵּה
  choice: Celui qui frappe
  rationale: Le participe de נכה introduit un cas juridique général. « Frappe » reste naturel en français et n’anticipe pas, dans le verbe lui-même, l’issue mortelle exprimée ensuite.
- source_word: אִישׁ
  choice: un homme
  rationale: אִישׁ désigne ici la victime humaine et signifie ordinairement « homme ». Ce choix conserve la formulation sexuée du texte source sans restreindre artificiellement la portée générale de l’auteur du coup.
- source_word: וָמֵת
  choice: et cause sa mort
  rationale: La conjonction suivie du verbe מות présente la mort comme conséquence du coup. Cette tournure française rend clairement le rapport de résultat tout en évitant l’ambiguïté référentielle de « et il meurt ».
- source_word: מוֹת יוּמָת
  choice: sera puni de mort
  rationale: L’infinitif absolu associé à la forme passive intensifie et affirme solennellement la peine capitale. « Sera puni de mort » conserve le passif juridique et la dignité du registre.
theological_decisions:
- issue: Portée de la peine capitale dans ce verset isolé
  choice: Conserver l’énoncé juridique catégorique sans ajouter ici une qualification d’intention.
  alternative: Préciser « volontairement » ou « avec préméditation ».
  rationale: Ces distinctions apparaissent dans les versets suivants, mais elles ne sont pas exprimées dans le libellé de ce verset. Les introduire ici résoudrait par anticipation la tension du texte juridique.
translation_notes:
  register: Français international moderne, clair et solennel. La formulation casuistique est conservée. « Puni de mort » est une expression juridique idiomatique; la note donne une représentation plus formelle de la syntaxe et de l’intensification hébraïques.
