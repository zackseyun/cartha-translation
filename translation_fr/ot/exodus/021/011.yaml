  text: וְ/אִם שְׁלָ֨שׁ אֵ֔לֶּה לֹ֥א יַעֲשֶׂ֖ה לָ֑/הּ וְ/יָצְאָ֥ה חִנָּ֖ם אֵ֥ין כָּֽסֶף־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/011.yaml
  text: And if he does not do these three things for her[a], then she shall go out free, without payment of money.
translation:
  language: fr
  text: Et s’il ne fait pas pour elle ces trois choses[a], elle sortira libre, sans paiement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’il ne lui assure pas ces trois choses ». L’hébreu dit littéralement « s’il ne fait pas pour elle ces trois », en renvoyant à la nourriture, aux vêtements et aux droits conjugaux mentionnés au verset précédent.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais s’il
  rationale: Introduit la condition qui poursuit le cas juridique précédent. « Mais » rend naturellement le contraste implicite avec les obligations énoncées au verset précédent.
- source_word: שְׁלָשׁ אֵלֶּה
  choice: ces trois choses
  rationale: Le groupe renvoie aux trois obligations du verset précédent. L’ajout de « choses » est nécessaire en français courant et n’ajoute aucun nouvel élément.
- source_word: לֹא יַעֲשֶׂה לָהּ
  choice: ne fait pas pour elle
  rationale: Conserve le sens large et formellement transparent de עשה, tout en laissant la note préciser qu’il s’agit de remplir ou d’assurer les trois obligations.
- source_word: וְיָצְאָה חִנָּם
  choice: elle partira libre
  rationale: יצא désigne ici la sortie de la condition servile, et חנם précise que cette libération est gratuite. Cette formulation est naturelle et garde l’image de la sortie.
- source_word: אֵין כָּסֶף
  choice: sans rien avoir à payer
  rationale: Exprime clairement en français moderne qu’aucune somme n’est exigée d’elle pour sa libération, sans réduire כָּסֶף au métal « argent ».
theological_decisions:
- issue: Nature des « trois choses »
  choice: Maintenir dans le texte le renvoi anaphorique « ces trois choses » et l’expliquer en note.
  alternative: Les expliciter directement comme la nourriture, les vêtements et les droits conjugaux.
  rationale: Le texte hébreu renvoie au verset précédent sans répéter les obligations. Cette solution préserve sa concision et évite d’insérer une interprétation explicative dans le corps du verset.
translation_notes:
  register: Français international moderne, clair et digne. La tournure juridique reste concise; « sans rien avoir à payer » explicite naturellement la portée économique de la libération sans suggérer qu’un tiers doive verser la somme.
