  text: אִם עֶ֛בֶד יִגַּ֥ח הַ/שּׁ֖וֹר א֣וֹ אָמָ֑ה כֶּ֣סֶף שְׁלֹשִׁ֣ים שְׁקָלִ֗ים יִתֵּן֙ לַֽ/אדֹנָ֔י/ו וְ/הַ/שּׁ֖וֹר יִסָּקֵֽל־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/032.yaml
  text: If the ox gores a male servant or a female servant[a], he shall give thirty shekels of silver to his master, and the ox shall be stoned.
translation:
  language: fr
  text: Si le bœuf encorne un esclave, homme ou femme[a], le propriétaire du bœuf donnera trente sicles d’argent au maître de l’esclave, et le bœuf sera lapidé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un esclave ou une esclave ». L’hébreu emploie deux termes distincts, עֶבֶד pour l’homme et אָמָה pour la femme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד … אוֹ אָמָה
  choice: un esclave, homme ou femme
  rationale: Dans cette loi, les deux termes désignent respectivement un esclave de sexe masculin et une esclave de sexe féminin. Cette formulation française exprime clairement leur même statut juridique tout en conservant la distinction de sexe; la note signale la structure littérale de l’hébreu.
- source_word: יִגַּח
  choice: encorne
  rationale: Le verbe נגח désigne ici l’action d’un bovin qui frappe de ses cornes. « Encorner » est précis, naturel et adapté au contexte juridique.
- source_word: כֶּסֶף שְׁלֹשִׁים שְׁקָלִים
  choice: trente sicles d’argent
  rationale: La somme est exprimée comme un poids d’argent mesuré en sicles. « Sicle » est le terme français biblique courant et conserve cette unité ancienne.
- source_word: יִתֵּן
  choice: donnera
  rationale: L’imparfait hébreu exprime ici l’obligation propre à une loi casuistique. Le futur français garde le ton normatif et concis du passage.
- source_word: לַאדֹנָיו
  choice: au maître de l’esclave
  rationale: Le suffixe renvoie naturellement à la personne asservie mentionnée, mais une traduction française par un simple pronom serait ambiguë après la mention du bœuf. La répétition explicite préserve le sens juridique.
- source_word: יִסָּקֵל
  choice: sera lapidé
  rationale: Le nifal de סקל prescrit la mise à mort par lapidation. La formulation passive reproduit la concision et le registre juridique de l’hébreu.
theological_decisions:
- issue: Sujet implicite de יִתֵּן (« donnera »)
  choice: le propriétaire du bœuf
  alternative: il
  rationale: Le sujet n’est pas nommé dans ce verset, mais le contexte immédiat de la législation sur le bœuf encorneur indique qu’il s’agit de son propriétaire. L’explicitation évite en français une référence pronominale obscure sans introduire de distinction doctrinale.
translation_notes:
  register: Français international moderne, digne et direct, avec un registre juridique sobre. « Maître » maintient la relation de possession exprimée par le texte ancien; « propriétaire du bœuf » explicite le sujet sous-entendu pour assurer la clarté.
