  text: וְ/כִֽי יָזִ֥ד אִ֛ישׁ עַל רֵעֵ֖/הוּ לְ/הָרְג֣/וֹ בְ/עָרְמָ֑ה מֵ/עִ֣ם מִזְבְּחִ֔/י תִּקָּחֶ֖/נּוּ לָ/מֽוּת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/014.yaml
  text: But if a man schemes against his neighbor to kill him by treachery[c][b][a], you shall take him even from my altar to die.
translation:
  language: fr
  text: Mais si un homme s’en prend délibérément[a] à son prochain pour le tuer par ruse[b], tu l’emmèneras d’auprès de mon autel[c] pour qu’il meure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « agit avec présomption contre » ; le verbe hébreu souligne le caractère volontaire et délibéré de l’acte.
    reason: lexical_alternative
  - marker: b
    text: Ou « avec perfidie », « de manière trompeuse ».
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire que même s’il cherche refuge auprès de l’autel, il doit en être retiré pour être mis à mort.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: Mais si
  rationale: La formule introduit un cas conditionnel qui contraste avec l’homicide non prémédité évoqué auparavant.
- source_word: יָזִד
  choice: s’en prend délibérément
  rationale: Le hiphil de זיד exprime ici une conduite volontaire, présomptueuse et préméditée. Cette formulation française conserve l’hostilité marquée par עַל sans réduire le verbe au seul fait de préparer un complot.
- source_word: אִישׁ
  choice: un homme
  rationale: Rend directement le masculin singulier de la formulation juridique hébraïque.
- source_word: עַל רֵעֵהוּ
  choice: à son prochain
  rationale: רֵעַ désigne ici l’autre membre de la communauté contre lequel l’acte hostile est dirigé.
- source_word: לְהָרְגוֹ
  choice: pour le tuer
  rationale: Conserve la valeur finale de l’infinitif et le sens direct de הרג, tandis que le caractère meurtrier et coupable ressort de l’ensemble du contexte.
- source_word: בְעָרְמָה
  choice: par ruse
  rationale: עָרְמָה désigne ici une habileté calculée et trompeuse. « Par ruse » reste naturel en français et préserve la composante de perfidie sans la surinterpréter.
- source_word: מֵעִם מִזְבְּחִי
  choice: de devant mon autel
  rationale: מֵעִם indique l’éloignement d’auprès ou de la proximité de l’autel. La formulation évite d’ajouter dans le texte principal une emphase absente de manière explicite, tout en laissant apparaître que l’autel ne protège pas le coupable.
- source_word: תִּקָּחֶנּוּ
  choice: tu l’emmèneras
  rationale: Rend l’ordre juridique à la deuxième personne du singulier et le déplacement de l’homme depuis l’autel.
- source_word: לָמוּת
  choice: pour qu’il meure
  rationale: Reproduit la valeur finale de l’infinitif sans remplacer la formulation hébraïque par le terme interprétatif « exécution ».
theological_decisions:
- issue: L’autel offre-t-il un asile au meurtrier volontaire ?
  choice: Le texte ordonne que l’auteur d’un homicide prémédité soit retiré d’auprès de l’autel et mis à mort.
  alternative: L’autel pourrait n’être mentionné que comme le lieu d’où l’accusé est emmené, sans référence explicite à un droit d’asile.
  rationale: Dans ce contexte juridique, la mention de l’autel implique fortement que le lieu sacré ne soustrait pas à la peine celui qui a agi délibérément et par ruse. Cette implication est expliquée en note plutôt qu’ajoutée au texte.
translation_notes:
  register: Français international moderne, sobre et juridique. « S’en prend délibérément » distingue l’intention volontaire exprimée par יָזִד de la ruse exprimée séparément par בְעָרְמָה. La phrase conserve le tutoiement singulier de l’instruction hébraïque.
