    text: 'Littéralement : « la dent de son esclave ou la dent de son esclave femme ». La formule juridique qui suit emploie en hébreu un suffixe objet masculin singulier, mais la règle énoncée s’applique à l’esclave homme comme à l’esclave femme.'
    reason: Préciser la paire masculine/féminine explicitement exprimée dans le texte source ainsi que la forme masculine singulière de la formule juridique.
  revision_rationale: La révision améliore la fluidité du français et clarifie le référent de la compensation, tout en conservant la structure conditionnelle, la réalité de l’esclavage, l’inclusion explicite des deux sexes et l’obligation de libérer la personne blessée.
