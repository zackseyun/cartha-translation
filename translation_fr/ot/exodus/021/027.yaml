source:
  edition: WLC
  text: וְ/אִם שֵׁ֥ן עַבְדּ֛/וֹ אֽוֹ שֵׁ֥ן אֲמָת֖/וֹ יַפִּ֑יל לַֽ/חָפְשִׁ֥י יְשַׁלְּחֶ֖/נּוּ תַּ֥חַת שִׁנּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/027.yaml
  text: And if he knocks out the tooth of his male servant or the tooth of his female servant[a], he shall let him go free in compensation for his tooth.
translation:
  language: fr
  text: Et s’il fait tomber une dent de son esclave, qu’il soit homme ou femme, il devra lui rendre la liberté en compensation de cette dent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Et s’il
  rationale: Introduit un nouveau cas conditionnel dans la suite juridique tout en conservant la valeur connective de וְ.
- source_word: שֵׁן
  choice: une dent
  rationale: Terme anatomique direct; le singulier hébreu est conservé.
- source_word: עַבְדּוֹ אוֹ שֵׁן אֲמָתוֹ
  choice: une dent de son esclave, homme ou femme
  rationale: עֶבֶד et אָמָה désignent ici des personnes juridiquement asservies. La formulation française actuelle évite la répétition lourde « esclave homme ou esclave femme » tout en maintenant explicitement les deux sexes visés.
- source_word: יַפִּיל
  choice: fait tomber
  rationale: Le hifil de נפל signifie littéralement causer la chute de la dent. « Faire tomber une dent » est naturel en français et ne précise pas indûment le mécanisme du traumatisme.
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  choice: il lui rendra la liberté
  rationale: Dans ce contexte juridique, שלח avec לַחָפְשִׁי impose la libération. Cette tournure française est claire, digne et conserve la force prescriptive du yiqtol légal.
- source_word: תַּחַת שִׁנּוֹ
  choice: en compensation de sa dent
  rationale: תַּחַת exprime ici la contrepartie compensatoire de la blessure; le possessif renvoie à la personne blessée.
theological_decisions:
- issue: Terminologie de l’esclavage dans le Code de l’alliance
  choice: esclave, homme ou femme
  alternative: serviteur ou servante
  rationale: Le passage traite du statut juridique d’une personne asservie et de sa libération obligatoire à la suite d’une blessure. « Esclave » rend cette réalité plus exactement que « serviteur », sans atténuer le texte.
- issue: Genre du bénéficiaire de la libération
  choice: pronom français épicène « lui », accompagné d’une note
  alternative: « il le laissera partir libre » au masculin grammatical
  rationale: L’hébreu emploie un suffixe objet masculin singulier dans sa formule juridique, bien que le cas énoncé vise expressément l’esclave homme ou femme. Le français « lui rendra la liberté » applique naturellement la règle aux deux sans effacer la forme grammaticale de l’hébreu, signalée en note.
translation_notes:
  register: Français international moderne, juridique mais accessible. « Rend la liberté » évite une tournure archaïque et exprime clairement la libération obligatoire. Le texte conserve la réalité de l’esclavage sans euphémisme.
