source:
  edition: WLC
  text: וְ/כִֽי יִגֹּ֧ף שֽׁוֹר אִ֛ישׁ אֶת שׁ֥וֹר רֵעֵ֖/הוּ וָ/מֵ֑ת וּ/מָ֨כְר֜וּ אֶת הַ/שּׁ֤וֹר הַ/חַי֙ וְ/חָצ֣וּ אֶת כַּסְפּ֔/וֹ וְ/גַ֥ם אֶת הַ/מֵּ֖ת יֶֽחֱצֽוּ/ן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/035.yaml
  text: And if one man's ox strikes his neighbor's ox and it dies[a], then they shall sell the live ox and divide its price[c][b], and they shall also divide the dead one.
translation:
  language: fr
  text: Et si le bœuf d’un homme frappe[a] le bœuf de son prochain et que celui-ci meure, ils vendront le bœuf vivant et se partageront la somme reçue[b] ; ils se partageront aussi l’animal mort[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « encorne » ; le verbe hébreu peut désigner le coup violent porté par un bœuf.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « son argent », c’est-à-dire l’argent obtenu par la vente du bœuf vivant.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « le mort », c’est-à-dire le bœuf mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Et si
  rationale: Introduit le cas juridique tout en conservant à la fois la coordination avec les lois précédentes et la valeur conditionnelle.
- source_word: יִגֹּף
  choice: frappe
  rationale: Le verbe désigne un coup violent, notamment celui qu’un bovin peut porter avec ses cornes. « Frappe » préserve l’étendue du terme sans imposer que l’animal encorne nécessairement l’autre.
- source_word: שׁוֹר אִישׁ
  choice: le bœuf d’un homme
  rationale: « Bœuf » est ici le terme français courant et traditionnel pour un bovin dans une formulation juridique, sans chercher à préciser davantage l’état physiologique de l’animal.
- source_word: שׁוֹר רֵעֵהוּ
  choice: le bœuf de son prochain
  rationale: « Prochain » rend la relation exprimée par רֵעַ dans ce contexte juridique et demeure clair en français biblique moderne.
- source_word: וָמֵת
  choice: et que celui-ci meure
  rationale: Rend simplement le résultat du coup ; « celui-ci » identifie naturellement le second bœuf comme l’animal qui meurt.
- source_word: וּמָכְרוּ
  choice: ils vendront
  rationale: Le futur français exprime naturellement la procédure juridique qui découle du cas posé.
- source_word: הַשּׁוֹר הַחַי
  choice: le bœuf vivant
  rationale: Désigne clairement l’animal qui a survécu, en restant proche de la formulation hébraïque.
- source_word: וְחָצוּ אֶת כַּסְפּוֹ
  choice: et se partageront la somme reçue
  rationale: Dans le contexte immédiat de la vente, כַּסְפּוֹ désigne l’argent obtenu pour le bœuf vivant. Cette formulation est naturelle tout en gardant la valeur économique du terme.
- source_word: וְגַם אֶת הַמֵּת יֶחֱצוּן
  choice: ils se partageront aussi l’animal mort
  rationale: L’hébreu dit littéralement « le mort ». « L’animal mort » explicite seulement le référent déjà évident, sans préciser la manière dont il sera partagé ou utilisé.
