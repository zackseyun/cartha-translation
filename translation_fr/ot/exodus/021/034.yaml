  text: בַּ֤עַל הַ/בּוֹר֙ יְשַׁלֵּ֔ם כֶּ֖סֶף יָשִׁ֣יב לִ/בְעָלָ֑י/ו וְ/הַ/מֵּ֖ת יִֽהְיֶה לּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/034.yaml
  text: The owner of the pit shall make restitution[a]; he shall pay money to its owner[b], and the dead animal shall be his.
translation:
  language: fr
  text: Le propriétaire de la fosse devra indemniser le propriétaire de l’animal en lui versant une somme d’argent[a] ; l’animal mort[b] appartiendra au propriétaire de la fosse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « argent » ; dans ce contexte, il s’agit d’une compensation financière.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la carcasse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעַל הַבּוֹר
  choice: le propriétaire de la fosse
  rationale: Dans ce contexte juridique, בַּעַל désigne celui qui possède la fosse ou en répond, et בּוֹר une excavation où peut tomber du bétail. « Propriétaire de la fosse » est clair et naturel.
- source_word: יְשַׁלֵּם
  choice: devra indemniser
  rationale: Le piel de שׁלם exprime ici l’obligation de réparer financièrement le dommage. « Devra indemniser » restitue la force juridique sans introduire l’idée d’une peine.
- source_word: כֶּסֶף יָשִׁיב
  choice: en lui versant une somme d’argent
  rationale: כֶּסֶף signifie littéralement « argent » au sens du métal, mais désigne ici un paiement monétaire; le hiphil de שוב exprime le fait de rendre ou restituer la valeur. Cette formulation française relie naturellement le moyen de l’indemnisation à son bénéficiaire.
- source_word: לִבְעָלָיו
  choice: le propriétaire de l’animal
  rationale: Le suffixe renvoie au propriétaire de l’animal mort. La répétition de « propriétaire » évite l’ambiguïté que créerait le pronom « son » en français.
- source_word: וְהַמֵּת
  choice: l’animal mort
  rationale: Le substantif « le mort » désigne, d’après le contexte immédiat, l’animal tombé dans la fosse. L’ajout explicatif d’« animal » est nécessaire en français courant.
- source_word: יִהְיֶה לוֹ
  choice: lui appartiendra
  rationale: La tournure indique que l’animal mort revient au propriétaire de la fosse. « Lui appartiendra » exprime naturellement cette attribution de possession.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne, avec une formulation juridique accessible. La répétition de « propriétaire » désambiguïse les deux parties; le pronom « lui » de la dernière proposition renvoie au propriétaire de la fosse.
