  terminology: «Bâton» convient pour מִשְׁעֶנֶת dans ce contexte. «Sera quitte» conserve l’idée d’être libéré de la sanction plus grave, tout en laissant explicitement subsister les deux obligations introduites par «seulement». «Faire soigner jusqu’à sa guérison» rend naturellement l’intensif וְרַפֹּא יְרַפֵּא sans prétendre que l’auteur des coups soigne lui-même le blessé.
