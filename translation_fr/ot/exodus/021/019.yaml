  source_fidelity: 'La formulation «peut marcher» atténue l’énoncé factuel de l’hébreu : le texte pose comme condition qu’il se relève et marche effectivement dehors. La restriction «toute autre responsabilité» explicite correctement le contexte immédiat, mais elle est plus interprétative que nécessaire. La dernière obligation vise une guérison effective et, dans ce cadre juridique, la responsabilité d’en assurer les soins.'
