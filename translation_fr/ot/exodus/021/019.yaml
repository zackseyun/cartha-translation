base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/019.yaml
  text: If he gets up and walks about outside on his staff[a], then the one who struck him shall be cleared[c][b]; he must only pay for his lost time and have him thoroughly healed.
translation:
  language: fr
  text: S’il se relève et marche dehors en s’appuyant sur son bâton[a], celui qui l’a frappé sera quitte; il devra seulement le dédommager pour le temps de son incapacité[b] et le faire soigner jusqu’à sa guérison[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement «sur son bâton». L’expression évoque une marche soutenue par un appui, signe d’un rétablissement au moins partiel.
    reason: lexical_alternative
  - marker: b
    text: L’expression désigne la période d’inactivité ou d’incapacité du blessé; il s’agit de l’indemniser pour cette perte de temps.
    reason: cultural_note
  - marker: c
    text: L’hébreu emploie une tournure intensive, littéralement «guérir, il guérira». Dans ce contexte juridique, elle exprime l’obligation d’assurer les soins nécessaires jusqu’au rétablissement du blessé.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יָקוּם
  choice: S’il se relève
  rationale: La condition introduit le cas où le blessé récupère assez pour quitter son lit et se remettre debout.
- source_word: וְהִתְהַלֵּךְ בַּחוּץ
  choice: et peut marcher dehors
  rationale: Le hitpael exprime ici le fait de circuler, tandis que «peut marcher» rend naturellement la mobilité retrouvée qui sert de preuve de rétablissement.
- source_word: עַל מִשְׁעַנְתּוֹ
  choice: en s’appuyant sur son bâton
  rationale: La préposition et le nom désignent l’appui utilisé pour marcher; cette formulation française explicite sans excès la fonction du bâton.
- source_word: וְנִקָּה הַמַּכֶּה
  choice: celui qui l’a frappé sera dégagé de toute autre responsabilité
  rationale: Le niphal de נקה indique l’exemption de la responsabilité principale liée à l’issue des coups, mais les obligations précisées ensuite subsistent; «toute autre» évite une contradiction apparente.
- source_word: רַק שִׁבְתּוֹ יִתֵּן
  choice: toutefois, il devra l’indemniser pour le temps où il a été immobilisé
  rationale: Dans cette loi sur les blessures, שִׁבְתּוֹ désigne la période d’inactivité ou d’incapacité; «indemniser» exprime la valeur compensatoire de נתן dans ce contexte.
- source_word: וְרַפֹּא יְרַפֵּא
  choice: et veiller à ce qu’il soit complètement guéri
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’obligation de guérison; la tournure française indique la prise en charge nécessaire sans supposer que l’auteur des coups soigne lui-même le blessé.
