    reason: lexical_alternative
  - marker: b
    text: Littéralement « à la place de son œil ». La liberté est accordée en réparation de l’atteinte à l’œil. Les termes hébreux distinguent un esclave homme et une esclave femme.
    reason: lexical_and_cultural_note
