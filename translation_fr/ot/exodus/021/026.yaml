source:
  edition: WLC
  text: וְ/כִֽי יַכֶּ֨ה אִ֜ישׁ אֶת עֵ֥ין עַבְדּ֛/וֹ אֽוֹ אֶת עֵ֥ין אֲמָת֖/וֹ וְ/שִֽׁחֲתָ֑/הּ לַֽ/חָפְשִׁ֥י יְשַׁלְּחֶ֖/נּוּ תַּ֥חַת עֵינֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/026.yaml
  text: And if a man strikes the eye of his male servant or the eye of his female servant and destroys it[c][b][a], he shall let him go free in compensation for his eye.
translation:
  language: fr
  text: Si un homme frappe l’œil de son esclave, homme ou femme, et l’endommage de façon permanente[a], il lui accordera la liberté en compensation de cet œil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et le détruit ». Le verbe hébreu désigne une atteinte qui ruine l’œil ou le rend inutilisable de façon permanente; il peut notamment impliquer la cécité.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « à la place de son œil ». La liberté est accordée en réparation de l’atteinte à l’œil. Les termes hébreux distinguent un esclave homme et une esclave femme.
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: Si
  rationale: Introduit naturellement en français une loi casuistique conditionnelle; la coordination hébraïque n’a pas besoin d’être reproduite par « et » dans ce verset isolé.
- source_word: יַכֶּה
  choice: frappe
  rationale: Rend directement נכה sans suggérer nécessairement des coups répétés.
- source_word: אִישׁ
  choice: un homme
  rationale: Conserve le masculin singulier explicite de l’hébreu.
- source_word: עַבְדּוֹ ... אֲמָתוֹ
  choice: son esclave ... sa servante
  rationale: « Esclave » exprime le statut de dépendance visé par la loi; « servante » marque clairement le féminin et reste idiomatique, avec une note précisant le statut servile.
- source_word: וְשִׁחֲתָהּ
  choice: et le détruit
  rationale: Le verbe שחת indique que l’œil est ruiné ou rendu inutilisable de manière permanente, sans imposer plus précisément la cécité totale.
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  choice: il lui rendra la liberté
  rationale: Formulation française naturelle qui exprime la libération juridiquement exigée.
- source_word: תַּחַת עֵינוֹ
  choice: en compensation de son œil
  rationale: Explicite la valeur compensatoire de תחת dans ce contexte juridique, tout en signalant en note la formulation plus littérale.
theological_decisions:
- issue: Terminologie du statut servile dans le droit israélite
  choice: esclave / servante, avec note
  alternative: serviteur / servante; esclave homme / esclave femme
  rationale: Le contexte de possession, de violence du maître et d’affranchissement exige que le statut servile ne soit pas atténué. Le français naturel permet « son esclave ou sa servante », tandis que la note lève toute ambiguïté sur le statut de la femme.
- issue: Sujet masculin de la loi
  choice: un homme
  alternative: quelqu’un; une personne
  rationale: Le texte porte אִישׁ, masculin singulier; la traduction en conserve la forme sans généralisation silencieuse.
- issue: Pronom masculin après deux antécédents de genres différents
  choice: il lui rendra la liberté
  alternative: il le laissera partir libre
  rationale: « Lui » s’applique naturellement en français à l’esclave comme à la servante et évite de faire paraître la disposition limitée au seul esclave masculin.
translation_notes:
  register: Français international moderne, sobre et juridique. La phrase reste accessible tout en conservant la gravité du statut servile et le caractère obligatoire de la sanction.
