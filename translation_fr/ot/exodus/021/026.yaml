revisions:
- from: Si un homme frappe l’œil de son esclave ou celui de sa servante et le détruit[a], il lui rendra la liberté en compensation de son œil[b].
  to: Si un homme frappe l’œil de son esclave, homme ou femme, et l’endommage de façon permanente[a], il lui accordera la liberté en compensation de cet œil[b].
  rationale: La révision maintient le sens du texte hébreu et sa formulation juridique, tout en rendant explicitement le statut servile des deux sexes et en remplaçant une expression française maladroite par une formulation qui traduit l’atteinte permanente sans imposer la cécité totale.
