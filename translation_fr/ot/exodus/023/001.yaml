source:
  edition: WLC
  text: לֹ֥א תִשָּׂ֖א שֵׁ֣מַע שָׁ֑וְא אַל תָּ֤שֶׁת יָֽדְ/ךָ֙ עִם רָשָׁ֔ע לִ/הְיֹ֖ת עֵ֥ד חָמָֽס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/001.yaml
  text: You shall not spread a false report[b][a]. Do not join hands with a wicked man to be a malicious witness.
translation:
  language: fr
  text: Tu ne feras pas circuler une fausse nouvelle[a]. Ne t’associe pas à un homme mauvais pour être un témoin malveillant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu ne porteras pas une fausse nouvelle ». Le verbe hébreu signifie littéralement « lever, porter » et peut ici évoquer la transmission d’une nouvelle.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ne mets pas ta main avec un homme mauvais pour être un témoin de violence ». Dans ce contexte judiciaire, « témoin de violence » peut désigner un témoin malveillant ou injuste.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא
  choice: feras circuler
  rationale: Le verbe נָשָׂא signifie littéralement « lever, porter ». Avec שֵׁמַע, il évoque ici le fait de porter puis de transmettre une nouvelle; « faire circuler » exprime naturellement cette idée en français moderne.
- source_word: שֵׁמַע שָׁוְא
  choice: de fausse nouvelle
  rationale: שֵׁמַע désigne ce qui est entendu, donc une nouvelle, un bruit ou une information; שָׁוְא y ajoute l’idée de fausseté ou de vanité. « Fausse nouvelle » convient au contexte juridique sans faire penser à un rapport écrit.
- source_word: תָּשֶׁת יָדְךָ עִם
  choice: Ne t’associe pas à
  rationale: L’expression signifie littéralement « ne mets pas ta main avec ». « Ne t’associe pas à » transmet clairement l’idée de coopération coupable, tandis que l’image hébraïque est signalée en note.
- source_word: רָשָׁע
  choice: un homme mauvais
  rationale: רָשָׁע peut désigner un méchant, un coupable ou un homme mauvais. Le masculin singulier de l’hébreu est conservé, et « homme mauvais » reste clair et naturel.
- source_word: לִהְיוֹת עֵד חָמָס
  choice: pour être un témoin malveillant
  rationale: עֵד signifie « témoin » et חָמָס évoque la violence, le tort et l’injustice. Dans ce cadre judiciaire, « témoin malveillant » rend un témoignage destiné à nuire, sans le réduire simplement à un témoignage factuellement faux.
- source_word: לֹא / אַל
  choice: Tu ne feras pas / Ne t’associe pas
  rationale: לֹא suivi de l’inaccompli porte ici la force durable d’une prescription juridique; אַל introduit une interdiction directe. La variation française conserve cette nuance tout en restant fluide.
theological_decisions:
- issue: Masculin singulier dans l’instruction juridique
  choice: Maintenir l’adresse au singulier et traduire רָשָׁע par « un homme mauvais »
  alternative: Employer une formulation inclusive telle que « une personne mauvaise »
  rationale: Le texte hébreu s’adresse à un homme au singulier et désigne également le complice au masculin singulier. La traduction conserve cette forme grammaticale représentative sans y ajouter de restriction doctrinale.
- issue: Portée de חָמָס appliqué au témoin
  choice: « témoin malveillant » dans le texte, avec le sens littéral en note
  alternative: « témoin violent », « témoin injuste » ou « faux témoin »
  rationale: 'חָמָס possède une force plus large que la seule fausseté: violence, tort ou injustice. « Malveillant » convient à l’acte judiciaire nuisible, tandis que la note préserve l’expression plus concrète et son ambiguïté.'
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète l’adresse juridique hébraïque. Les formulations idiomatiques rendent l’action intelligible, tandis que les notes conservent les images concrètes et l’étendue sémantique de l’hébreu.
