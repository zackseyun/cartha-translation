    issue: « la terreur que j’inspire » développe interprétativement « ma terreur ».
    rationale: Le possessif hébreu doit être conservé sans préciser si la terreur est une qualité divine, une terreur envoyée par Dieu ou une terreur qu’il provoque.
  - severity: medium
    issue: L’ancre [b] est placée après « tu arriveras », mais la note anglaise correspond à וְהַמֹּתִי (« je jetterai dans la confusion »).
    rationale: L’ancrage doit identifier sans ambiguïté l’élément lexical faisant l’objet de la variante.
  - severity: medium
    issue: « je ferai tourner le dos devant toi à tous tes ennemis » est maladroit et peut être mal compris.
    rationale: La révision conserve l’image idiomatique du dos tourné tout en produisant une syntaxe française claire.
