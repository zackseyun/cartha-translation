base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/027.yaml
  text: I will send my terror ahead of you[a], and I will throw into confusion all the people among whom you come[c][b], and I will make all your enemies turn their backs to you.
translation:
  language: fr
  text: J’enverrai devant toi ma terreur[a] ; je jetterai dans la confusion[b] tous les peuples au milieu desquels tu entreras, et je ferai en sorte que tous tes ennemis te tournent le dos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « mon effroi » ou « ma crainte ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « je mettrai en déroute » ou « je sèmerai le tumulte ».'
    reason: lexical_alternative
  - marker: c
    text: 'Expression hébraïque : littéralement, Dieu « donnera » tous les ennemis comme « dos/nuque » ; elle évoque des ennemis qui se détournent et fuient.'
    reason: idiom_explanation
lexical_decisions:
- source_word: אֵימָתִי
  choice: la terreur que j’inspire
  rationale: אֵימָה désigne l’effroi ou la terreur. Cette formulation conserve le possessif hébreu (« ma terreur ») tout en exprimant naturellement en français la terreur envoyée par Dieu.
- source_word: אֲשַׁלַּח לְפָנֶיךָ
  choice: J’enverrai devant toi
  rationale: לְפָנֶיךָ indique que la terreur précédera Israël. « Devant toi » garde l’image spatiale et reste idiomatique.
- source_word: וְהַמֹּתִי
  choice: je jetterai dans la confusion
  rationale: Le verbe המם exprime le fait de provoquer confusion, panique ou tumulte. Ce choix rend la valeur causative sans préciser davantage que l’hébreu l’issue militaire.
- source_word: כָּל הָעָם
  choice: tous les peuples
  rationale: Bien que עָם soit morphologiquement au singulier, le contexte vise collectivement les diverses populations rencontrées. Le pluriel français explicite cette portée naturelle.
- source_word: אֲשֶׁר תָּבֹא בָהֶם
  choice: au milieu desquels tu arriveras
  rationale: La préposition ב suggère ici l’entrée parmi eux ou en leur sein. Cette traduction évite d’ajouter le sens plus hostile de « contre lesquels ».
- source_word: וְנָתַתִּי ... אֵלֶיךָ עֹרֶף
  choice: je ferai tourner le dos devant toi à tous tes ennemis
  rationale: L’expression signifie que les ennemis présenteront le dos ou la nuque en battant en retraite. La traduction conserve l’image hébraïque tout en la rendant intelligible.
theological_decisions:
- issue: Action divine dans la panique et la défaite militaires
  choice: 'Conserver l’action directe de Dieu à la première personne : « J’enverrai », « je jetterai », « je ferai »'
  alternative: Employer des formulations indirectes atténuant la causalité divine
  rationale: Les verbes hébreux ont explicitement Dieu pour sujet à la première personne. La traduction ne doit ni atténuer ni amplifier cette affirmation.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur et la répétition de « je » maintiennent la force de la promesse divine. Les images de progression (« devant toi ») et de retraite (« tourner le dos ») sont conservées.
