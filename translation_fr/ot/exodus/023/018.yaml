id: EXO.23.18
reference: Exodus 23:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹֽא תִזְבַּ֥ח עַל חָמֵ֖ץ דַּם זִבְחִ֑/י וְ/לֹֽא יָלִ֥ין חֵֽלֶב חַגִּ֖/י עַד בֹּֽקֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/018.yaml
  text: You shall not sacrifice the blood of my sacrifice with anything leavened[b][a], and the fat of my feast shall not remain until morning.
translation:
  language: fr
  text: Tu n’offriras pas le sang de mon sacrifice avec du levain[a], et la graisse de ma fête[b] ne restera pas jusqu’au matin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur du levain ». La préposition hébraïque signifie littéralement « sur », mais elle indique probablement ici que le sacrifice ne doit pas être offert en association avec du levain.
    reason: lexical_alternative
  - marker: b
    text: Ou « de ma célébration sacrée ». Le terme hébreu désigne une fête religieuse, notamment une fête de pèlerinage.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְבַּח
  choice: tu n’offriras pas
  rationale: Le qal inaccompli à la 2e personne masculine singulière avec לֹא exprime ici une interdiction. « Offrir » est naturel en français dans un contexte sacrificiel, tout en laissant « le sang de mon sacrifice » expliciter la nature cultuelle de l’acte.
- source_word: עַל חָמֵץ
  choice: avec du levain
  rationale: עַל signifie littéralement « sur », mais marque vraisemblablement ici une association interdite avec le levain. « Avec du levain » est clair et naturel, tandis que la note conserve le sens formel possible.
- source_word: דַּם זִבְחִי
  choice: le sang de mon sacrifice
  rationale: La chaîne construite et le suffixe de première personne sont conservés. Le texte nomme explicitement le sang et non seulement le sacrifice.
- source_word: יָלִין
  choice: ne restera pas
  rationale: Le verbe לין désigne le fait de passer la nuit ou de demeurer pendant la nuit. Avec « jusqu’au matin », « ne restera pas » rend l’interdiction sans redondance lourde.
- source_word: חֵלֶב
  choice: la graisse
  rationale: Le terme désigne la graisse, probablement les parties grasses réservées au sacrifice. La traduction directe évite d’introduire une précision absente du texte.
- source_word: חַגִּי
  choice: ma fête
  rationale: חַג désigne une fête religieuse, souvent une fête de pèlerinage. « Fête » est idiomatique et conserve le suffixe divin de première personne.
- source_word: עַד בֹּקֶר
  choice: jusqu’au matin
  rationale: Cette formulation temporelle usuelle rend directement l’hébreu.
theological_decisions:
- issue: Référent des suffixes de première personne dans « mon sacrifice » et « ma fête »
  choice: 'Conserver la parole divine directe : « mon sacrifice » et « ma fête ».'
  alternative: « le sacrifice qui m’est offert » et « la fête célébrée pour moi »
  rationale: Les suffixes hébreux sont explicites. Les développer en paraphrases explicatives résoudrait inutilement la relation d’appartenance et dépasserait le texte.
- issue: Nature exacte de l’association interdite avec le levain
  choice: Traduire « avec du levain » et signaler en note le sens littéral « sur du levain ».
  alternative: « sur du levain »
  rationale: Le contexte indique une association cultuelle interdite, mais la fonction précise de la préposition demeure légèrement ambiguë. La traduction principale reste intelligible sans effacer l’alternative formelle.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement singulier reflète la deuxième personne masculine singulière de l’hébreu. La formulation conserve les expressions marquées « le sang de mon sacrifice » et « ma fête » sans expansion doctrinale.
