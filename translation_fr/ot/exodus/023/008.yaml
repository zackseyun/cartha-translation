id: EXO.23.8
reference: Exodus 23:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/שֹׁ֖חַד לֹ֣א תִקָּ֑ח כִּ֤י הַ/שֹּׁ֨חַד֙ יְעַוֵּ֣ר פִּקְחִ֔ים וִֽ/יסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/008.yaml
  text: And you shall not take a bribe[b][a], for a bribe blinds the clear-sighted and twists the words of the righteous.
translation:
  language: fr
  text: Tu n’accepteras pas de pot-de-vin, car le pot-de-vin aveugle ceux qui voient clair[a] et déforme les paroles des justes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui discernent ». L’hébreu conserve l’image de la vue tout en évoquant un jugement lucide.
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte juridique, « les paroles des justes » peut aussi désigner « les déclarations » ou « la cause de ceux qui sont dans leur droit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד
  choice: pot-de-vin
  rationale: Désigne un paiement corrupteur destiné à influencer un jugement. « Pot-de-vin » est le terme français moderne le plus clair; « cadeau » serait trop neutre.
- source_word: לֹא תִקָּח
  choice: tu n’accepteras pas
  rationale: L’imparfait qal à la deuxième personne du masculin singulier exprime ici une interdiction juridique. « Accepter » rend naturellement l’acte de recevoir un pot-de-vin.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de l’interdiction dans un style juridique concis.
- source_word: יְעַוֵּר
  choice: aveugle
  rationale: Préserve l’image forte du piel causatif et son emploi métaphorique pour l’altération du jugement.
- source_word: פִּקְחִים
  choice: ceux qui voient clair
  rationale: Conserve l’image visuelle de personnes aux yeux ouverts tout en suggérant leur capacité de discernement.
- source_word: וִיסַלֵּף
  choice: déforme
  rationale: Exprime l’idée de tordre ou de fausser sans ajouter une interprétation plus précise que l’hébreu.
- source_word: דִּבְרֵי
  choice: les paroles de
  rationale: Rend le pluriel construit de דבר de manière transparente, tout en laissant possible son sens judiciaire de déclarations ou de cause.
- source_word: צַדִּיקִים
  choice: des justes
  rationale: Préserve l’étendue du terme hébreu, qui peut désigner des personnes moralement justes ou celles qui sont dans leur droit.
theological_decisions:
- issue: Portée de צַדִּיקִים dans le contexte judiciaire
  choice: des justes
  alternative: de ceux qui sont dans leur droit
  rationale: La formulation retenue maintient à la fois la résonance morale et la possibilité d’un sens juridique, sans trancher une ambiguïté réelle du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur impérative maintient la tonalité de la loi biblique. Les images de l’aveuglement et de la déformation sont conservées, ainsi que l’ambiguïté morale et judiciaire de la dernière expression.
