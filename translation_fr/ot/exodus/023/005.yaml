  text: כִּֽי תִרְאֶ֞ה חֲמ֣וֹר שֹׂנַאֲ/ךָ֗ רֹבֵץ֙ תַּ֣חַת מַשָּׂא֔/וֹ וְ/חָדַלְתָּ֖ מֵ/עֲזֹ֣ב ל֑/וֹ עָזֹ֥ב תַּעֲזֹ֖ב עִמּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/005.yaml
  text: If you see the donkey of one who hates you lying down under its load[a], and would refrain from helping him[b], you must surely help with him.
translation:
  language: fr
  text: Si tu vois l’âne de celui qui te déteste couché sous sa charge, et que tu es tenté de ne pas aider cet homme[a], tu dois absolument lui prêter main-forte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu employé ici signifie habituellement « laisser » ou « abandonner » ; dans ce contexte, il prend le sens d’« aider » ou de « prêter assistance ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tu dois absolument aider avec lui ». Le pronom hébreu peut désigner l’homme ou l’âne ; certains comprennent donc que l’aide est apportée à l’âne.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Si
  rationale: Dans ce contexte juridique casuistique, כִּי introduit une condition; « Si » en rend naturellement la valeur.
- source_word: תִרְאֶה
  choice: tu vois
  rationale: Le verbe ראה signifie directement « voir »; cette formulation évite d’ajouter l’idée d’une rencontre fortuite.
- source_word: חֲמוֹר
  choice: âne
  rationale: « Âne » est l’équivalent français moderne et usuel.
- source_word: שֹׂנַאֲךָ
  choice: celui qui te déteste
  rationale: Le participe désigne littéralement une personne qui hait le destinataire; cette traduction n’élargit pas indûment le sens à toute la catégorie des « ennemis ».
- source_word: רֹבֵץ תַּחַת מַשָּׂאוֹ
  choice: couché sous sa charge
  rationale: La formulation conserve l’image de l’animal à terre sous ce qu’il porte, sans préciser s’il s’est couché ou s’est effondré.
- source_word: וְחָדַלְתָּ מֵעֲזֹב לוֹ
  choice: et que tu sois tenté de ne pas aider cet homme
  rationale: La tournure hébraïque difficile évoque ici le fait de se retenir ou d’envisager de s’abstenir d’aider. « Sois tenté de » exprime cette inclination sans présenter l’abstention comme accomplie.
- source_word: עָזֹב תַּעֲזֹב
  choice: tu dois absolument lui prêter main-forte
  rationale: L’infinitif absolu suivi de l’imparfait renforce l’obligation. Dans ce contexte, עזב a le sens d’aider ou d’assister, plutôt que son sens courant d’abandonner.
- source_word: עִמּוֹ
  choice: lui prêter main-forte
  rationale: Cette expression française implique une aide apportée à la personne et avec sa participation, tout en évitant le calque peu naturel « aider avec lui ».
theological_decisions:
- issue: Référent du pronom final עִמּוֹ
  choice: l’homme qui déteste le destinataire
  alternative: l’âne
  rationale: Le masculin singulier peut grammaticalement renvoyer au propriétaire ou à l’âne. Le contexte éthique et la valeur de « avec » favorisent l’idée de coopérer avec le propriétaire; l’autre compréhension est signalée en note afin de préserver l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reproduit l’adresse juridique hébraïque. « Prêter main-forte » rend idiomatiquement l’assistance concrète sans préciser davantage l’action — décharger ou relever l’animal — que ne le fait le texte.
