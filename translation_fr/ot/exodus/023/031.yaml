source:
  edition: WLC
  text: וְ/שַׁתִּ֣י אֶת גְּבֻלְ/ךָ֗ מִ/יַּם סוּף֙ וְ/עַד יָ֣ם פְּלִשְׁתִּ֔ים וּ/מִ/מִּדְבָּ֖ר עַד הַ/נָּהָ֑ר כִּ֣י אֶתֵּ֣ן בְּ/יֶדְ/כֶ֗ם אֵ֚ת יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/גֵרַשְׁתָּ֖/מוֹ מִ/פָּנֶֽי/ךָ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/031.yaml
  text: And I will set your border from the Red Sea to the Sea of the Philistines[a], and from the wilderness to the River; for I will give the inhabitants of the land into your hand[b], and you will drive them out from before you.
translation:
  language: fr
  text: J’établirai ta frontière depuis la mer des Roseaux[a] jusqu’à la mer des Philistins, et depuis le désert jusqu’au Fleuve[b] ; car je livrerai entre vos mains les habitants du pays, et tu les chasseras devant toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque signifie littéralement « mer des Roseaux » ; elle est traditionnellement rendue par « mer Rouge ».
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire l’Euphrate.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׁתִּי
  choice: J’établirai
  rationale: Le parfait qal précédé de la conjonction a ici une valeur future dans la promesse divine. « Établirai » convient naturellement à la délimitation d’une frontière.
- source_word: גְּבֻלְךָ
  choice: ta frontière
  rationale: גְּבוּל désigne ici la frontière ou les limites géographiques. Le singulier français conserve celui de l’hébreu.
- source_word: מִיַּם סוּף
  choice: depuis la mer des Roseaux
  rationale: Cette traduction rend directement יַם־סוּף sans imposer l’identification traditionnelle avec la mer Rouge ; celle-ci est signalée en note.
- source_word: יָם פְּלִשְׁתִּים
  choice: la mer des Philistins
  rationale: La formulation conserve la désignation ethno-géographique de l’hébreu plutôt que de la remplacer par « Méditerranée ».
- source_word: וּמִמִּדְבָּר
  choice: et depuis le désert
  rationale: Dans cette délimitation géographique, « désert » rend מִדְבָּר de manière claire et naturelle en français moderne.
- source_word: הַנָּהָר
  choice: le Fleuve
  rationale: L’expression hébraïque définie désigne conventionnellement l’Euphrate. La majuscule marque l’emploi comme désignation géographique, tandis que la note explicite le référent.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le fondement de la promesse précédente ; « car » en restitue clairement la relation logique.
- source_word: אֶתֵּן בְּיֶדְכֶם
  choice: je livrerai entre vos mains
  rationale: Cette formulation française conserve l’image de la main, qui exprime ici la remise au pouvoir d’autrui, tout en restant idiomatique.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: les habitants du pays
  rationale: Le participe désigne ceux qui habitent le pays ; « habitants » est direct, naturel et précis.
- source_word: וְגֵרַשְׁתָּמוֹ
  choice: et tu les chasseras
  rationale: גּרשׁ signifie chasser ou expulser. « Chasser » exprime clairement l’action sans l’atténuer.
- source_word: מִפָּנֶיךָ
  choice: devant toi
  rationale: Cette expression préserve l’image spatiale de l’hébreu et demeure naturelle en français.
theological_decisions:
- issue: Désignation géographique יַם־סוּף
  choice: mer des Roseaux
  alternative: mer Rouge
  rationale: Le texte principal suit de près le sens lexical de l’hébreu sans trancher silencieusement la question de l’identification géographique ; l’appellation traditionnelle est conservée en note.
- issue: Alternance entre destinataire singulier et pluriel
  choice: ta / vos / tu
  alternative: harmoniser tout au singulier ou tout au pluriel
  rationale: L’hébreu passe du singulier dans « ta frontière » au pluriel dans « vos mains », puis revient au singulier dans « tu les chasseras ». La traduction maintient cette variation textuelle plutôt que de l’uniformiser.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe parallèle de la délimitation territoriale est conservée, de même que les désignations géographiques propres au texte hébreu et son alternance inhabituelle entre singulier et pluriel.
