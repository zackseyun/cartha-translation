source:
  edition: WLC
  text: וְ/הַ/שְּׁבִיעִ֞ת תִּשְׁמְטֶ֣/נָּה וּ/נְטַשְׁתָּ֗/הּ וְ/אָֽכְלוּ֙ אֶבְיֹנֵ֣י עַמֶּ֔/ךָ וְ/יִתְרָ֕/ם תֹּאכַ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה כֵּֽן תַּעֲשֶׂ֥ה לְ/כַרְמְ/ךָ֖ לְ/זֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/011.yaml
  text: But in the seventh year you shall let it rest and leave it alone[a], so that the poor of your people may eat; and what they leave, the wild animals of the field may eat[b]. You shall do the same with your vineyard and your olive grove.
translation:
  language: fr
  text: Mais la septième année, tu laisseras la terre en repos et tu la laisseras sans la cultiver[a]. Les pauvres de ton peuple pourront en manger, et les animaux sauvages mangeront ce qu’ils auront laissé[b]. Tu feras de même pour ta vigne et pour tes oliviers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu la laisseras libre et tu l’abandonneras ». Les deux verbes hébreux soulignent qu’il faut cesser la culture habituelle et laisser la terre inculte pendant la septième année.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « l’animal du champ ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁבִיעִת
  choice: Mais la septième année
  rationale: Le contexte oppose cette année aux six années de culture du verset précédent. Cette formulation temporelle restitue naturellement la valeur contrastive de וְ.
- source_word: תִּשְׁמְטֶנָּה
  choice: tu laisseras la terre en repos
  rationale: Le verbe שׁמט exprime ici la cessation de l’exploitation agricole. Le complément « la terre », repris du verset précédent par le suffixe féminin, est explicité pour assurer la clarté en français.
- source_word: וּנְטַשְׁתָּהּ
  choice: et tu la laisseras sans la cultiver
  rationale: נטשׁ signifie laisser ou abandonner. Dans ce contexte agricole, cette formulation exprime l’absence de culture sans suggérer un abandon permanent de la propriété.
- source_word: אֶבְיֹנֵי עַמֶּךָ
  choice: Les pauvres de ton peuple
  rationale: אֶבְיוֹן désigne une personne pauvre ou nécessiteuse. « Les pauvres de ton peuple » conserve simplement la relation exprimée par le possessif.
- source_word: וְיִתְרָם
  choice: ce qu’ils auront laissé
  rationale: Le nom formé sur יתר désigne ce qui reste, et le suffixe masculin pluriel renvoie aux pauvres. Le futur antérieur marque naturellement que les animaux mangent après eux.
- source_word: תֹּאכַל חַיַּת הַשָּׂדֶה
  choice: les animaux sauvages mangeront
  rationale: חַיַּת הַשָּׂדֶה, littéralement « l’animal du champ », est une expression collective désignant la faune sauvage. Le futur français conserve ici la force verbale de l’instruction et son résultat attendu.
- source_word: כֵּן תַּעֲשֶׂה
  choice: Tu feras de même
  rationale: Formulation française naturelle qui conserve la valeur directive et applique la même règle aux cultures mentionnées ensuite.
- source_word: לְכַרְמְךָ
  choice: pour ta vigne
  rationale: כֶּרֶם désigne le vignoble ou la vigne cultivée. « Ta vigne » est courant, collectif et adapté au parallèle agricole.
- source_word: לְזֵיתֶךָ
  choice: pour tes oliviers
  rationale: זַיִת est un singulier collectif pouvant désigner les oliviers ou leur plantation. « Tes oliviers » reste proche du terme hébreu et forme un parallèle naturel avec « ta vigne ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Tutoiement singulier maintenu pour représenter les formes hébraïques de deuxième personne du singulier. La formulation distingue les deux verbes hébreux sans donner à « abandonner » dans le texte principal une nuance indûment permanente.
