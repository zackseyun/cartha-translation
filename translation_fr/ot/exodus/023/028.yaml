base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/028.yaml
  text: And I will send the hornet ahead of you[a], and it will drive out the Hivite, the Canaanite, and the Hittite from before you.
translation:
  language: fr
  text: J’enverrai devant toi le frelon[a], qui chassera de devant toi les Hivites, les Cananéens et les Hittites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être une image figurée de la panique ou d’un autre moyen de pression divine envoyé en avant d’Israël ; le mot hébreu désigne normalement le frelon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: J’enverrai
  rationale: Le qatal à la première personne du singulier, coordonné et situé dans une série de promesses, a ici une valeur future. Le futur français exprime naturellement la promesse et maintient Dieu comme agent.
- source_word: הַצִּרְעָה
  choice: les frelons
  rationale: Le nom désigne normalement le frelon ou un insecte piqueur apparenté. Le pluriel français rend naturellement la valeur collective probable du singulier hébreu avec article, sans imposer une interprétation figurée.
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: Cette expression spatiale rend directement l’idée d’une action envoyée en avant d’Israël et reste naturelle en français biblique moderne.
- source_word: וְגֵרְשָׁה
  choice: et ils chasseront
  rationale: Le verbe signifie « chasser, expulser ». Le sujet pluriel français « les frelons » entraîne naturellement le pluriel verbal, tandis que l’accord féminin singulier de l’hébreu correspond au nom collectif singulier.
- source_word: הַחִוִּי
  choice: les Hivites
  rationale: Ethnonyme français usuel; le pluriel convient après le verbe « chasser » pour désigner le peuple.
- source_word: הַכְּנַעֲנִי
  choice: les Cananéens
  rationale: Ethnonyme français standard pour le peuple nommé.
- source_word: הַחִתִּי
  choice: les Hittites
  rationale: Ethnonyme français standard pour le peuple nommé.
- source_word: מִלְּפָנֶיךָ
  choice: loin de toi
  rationale: Dans ce contexte d’expulsion, cette formulation exprime clairement l’éloignement hors du chemin ou de la présence d’Israël, sans la lourdeur de « de devant toi ».
theological_decisions:
- issue: Faut-il comprendre הַצִּרְעָה littéralement ou comme une image figurée?
  choice: Le texte principal retient le sens lexical concret « les frelons ».
  alternative: Le terme peut être compris comme une image de la panique ou d’un autre moyen de pression divine envoyé en avant d’Israël.
  rationale: Le sens ordinaire du mot hébreu est celui d’un frelon ou d’un insecte piqueur. Une interprétation figurée demeure possible dans le contexte, mais elle n’est pas imposée par le lexème; elle est donc signalée en note plutôt qu’intégrée au texte.
translation_notes:
  register: Français international moderne, clair et digne. « Les frelons » est plus idiomatique qu’un singulier collectif en français. La répétition hébraïque de « devant toi » est allégée à la seconde occurrence par « loin de toi », tout en conservant le mouvement d’expulsion.
