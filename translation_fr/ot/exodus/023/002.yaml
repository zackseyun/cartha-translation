  text: לֹֽא תִהְיֶ֥ה אַחֲרֵֽי רַבִּ֖ים לְ/רָעֹ֑ת וְ/לֹא תַעֲנֶ֣ה עַל רִ֗ב לִ/נְטֹ֛ת אַחֲרֵ֥י רַבִּ֖ים לְ/הַטֹּֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/002.yaml
  text: You shall not follow the many to do evil[a], and you shall not testify in a dispute so as to turn aside after the many, to pervert justice.
translation:
  language: fr
  text: Tu ne suivras pas la majorité pour faire le mal. Dans un litige, tu ne témoigneras pas en te rangeant du côté de la majorité pour pervertir la justice.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dans un litige, tu ne répondras pas en suivant la majorité pour faire pencher le jugement. »'
    reason: L’hébreu permet de rendre תַעֲנֶה plus littéralement par « répondre » et la proposition finale par « faire pencher le jugement ».
lexical_decisions:
- source_word: תִהְיֶה אַחֲרֵי רַבִּים
  choice: tu ne suivras pas la majorité
  rationale: La construction היה אחרי exprime ici l’idée de suivre ou de se ranger derrière; « la majorité » rend naturellement רַבִּים dans ce contexte de pression collective.
- source_word: לְרָעֹת
  choice: pour faire le mal
  rationale: L’infinitif précédé de ל indique le but ou le résultat, et רָעֹת porte ici une force morale nette.
- source_word: תַעֲנֶה עַל רִיב
  choice: dans un litige, tu ne témoigneras pas
  rationale: Dans ce cadre juridique, ענה désigne la déposition ou la prise de parole d’un témoin, tandis que רִיב désigne une contestation ou une affaire litigieuse.
- source_word: לִנְטֹת אַחֲרֵי רַבִּים
  choice: en te rangeant du côté de la majorité
  rationale: Cette formulation française exprime le mouvement figuré de נטה אחרי et conserve l’idée d’une influence exercée par le nombre.
- source_word: לְהַטֹּת
  choice: pour faire dévier la justice
  rationale: Le hiphil de נטה signifie faire pencher ou dévier. Le complément « la justice », implicite en hébreu, est explicité d’après le contexte judiciaire immédiat.
theological_decisions:
- issue: Portée judiciaire de לְהַטֹּת
  choice: pour faire dévier la justice
  alternative: pour faire pencher le jugement
  rationale: Le texte hébreu reste elliptique quant à l’objet, mais le litige et le témoignage établissent un contexte judiciaire. « La justice » explicite ce sens sans ajouter de contenu doctrinal.
- issue: Sens de רַבִּים
  choice: la majorité
  alternative: la foule / le grand nombre
  rationale: « La majorité » convient particulièrement au contexte où le nombre peut infléchir un témoignage ou une décision, tout en préservant l’avertissement éthique général du premier membre.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur impérative conserve la forme traditionnelle des interdictions juridiques sans archaïsme marqué. La répétition exacte de « suivre » est légèrement modulée par « se ranger du côté de » afin d’obtenir un français naturel tout en maintenant le parallélisme.
