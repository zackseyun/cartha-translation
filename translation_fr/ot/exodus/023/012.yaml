  text: שֵׁ֤שֶׁת יָמִים֙ תַּעֲשֶׂ֣ה מַעֲשֶׂ֔י/ךָ וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י תִּשְׁבֹּ֑ת לְמַ֣עַן יָנ֗וּחַ שֽׁוֹרְ/ךָ֙ וַ/חֲמֹרֶ֔/ךָ וְ/יִנָּפֵ֥שׁ בֶּן אֲמָתְ/ךָ֖ וְ/הַ/גֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/012.yaml
  text: For six days you shall do your work[a], but on the seventh day you shall cease, so that your ox and your donkey may rest[c][b], and the son of your female servant and the sojourner may be refreshed.
translation:
  language: fr
  text: Pendant six jours, tu feras ton travail, mais le septième jour, tu cesseras[a], afin que ton bœuf et ton âne se reposent, et que le fils de ta servante ainsi que l’étranger établi[b] reprennent des forces.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu t’arrêteras » ou « tu te reposeras » ; le verbe hébreu signifie fondamentalement « cesser, s’arrêter ».
    reason: lexical_alternative
  - marker: b
    text: L’« étranger établi » est un étranger vivant parmi les Israélites et relevant de leur ordre social et juridique.
    reason: cultural_note
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Pendant six jours
  rationale: L’accusatif temporel exprime la durée. « Pendant six jours » est naturel en français et conserve le cadre temporel du commandement.
- source_word: תַּעֲשֶׂה מַעֲשֶׂיךָ
  choice: tu feras ton travail
  rationale: La construction désigne globalement l’activité ou le travail accompli, sans la limiter au travail manuel.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: mais le septième jour
  rationale: Le waw relie les propositions tout en marquant ici le contraste entre les six jours d’activité et le septième jour.
- source_word: תִּשְׁבֹּת
  choice: tu cesseras
  rationale: Le verbe שׁבת signifie fondamentalement cesser ou s’arrêter. Cette traduction maintient l’accent sur l’interruption de l’activité, distincte du repos exprimé ensuite par נוח.
- source_word: לְמַעַן
  choice: afin que
  rationale: La locution introduit le but de la cessation prescrite.
- source_word: יָנוּחַ
  choice: se reposent
  rationale: Le verbe נוח exprime le repos ou l’apaisement. Le pluriel français reprend naturellement les deux animaux coordonnés.
- source_word: שׁוֹרְךָ וַחֲמֹרֶךָ
  choice: ton bœuf et ton âne
  rationale: Ces termes désignent les animaux de travail typiques du contexte agricole.
- source_word: וְיִנָּפֵשׁ
  choice: reprennent des forces
  rationale: Le niphal de נפשׁ évoque le fait de reprendre souffle et d’être revigoré. « Reprendre des forces » rend cette idée en français courant sans la réduire au seul repos.
- source_word: בֶּן אֲמָתְךָ
  choice: le fils de ta servante
  rationale: La formulation conserve directement la relation sociale et familiale exprimée par l’hébreu, sans préciser au-delà du texte le statut exact de la servante.
- source_word: הַגֵּר
  choice: l’immigré résident
  rationale: גר désigne un étranger installé parmi Israël et intégré à son ordre social et juridique. « Immigré résident » est plus précis en français moderne que « étranger » seul.
theological_decisions:
- issue: Sens de שׁבת dans la prescription du septième jour
  choice: tu cesseras
  alternative: tu te reposeras
  rationale: Le sens premier est l’arrêt de l’activité. Le choix distingue cette cessation du repos accordé aux animaux et du regain de forces des personnes, sans exclure que la cessation implique le repos.
- issue: Désignation du גר
  choice: l’immigré résident
  alternative: l’étranger
  rationale: Le verset étend le bénéfice du septième jour à une personne non israélite établie au sein de la communauté. La traduction choisie conserve cette catégorie sociale et juridique sans en faire un simple visiteur.
- issue: Portée sociale de בֶּן אֲמָתְךָ
  choice: le fils de ta servante
  alternative: le fils de ton esclave
  rationale: אמה peut désigner une servante ou une esclave. « Servante » préserve une certaine latitude contextuelle et évite de trancher plus précisément que ne le permet ce verset isolé.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète les formes hébraïques à la deuxième personne du masculin singulier. La phrase conserve le contraste juridique entre les six jours de travail et la cessation du septième jour, tout en exprimant naturellement le but humanitaire de cette prescription.
