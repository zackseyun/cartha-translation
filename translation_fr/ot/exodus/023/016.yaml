  text: וְ/חַ֤ג הַ/קָּצִיר֙ בִּכּוּרֵ֣י מַעֲשֶׂ֔י/ךָ אֲשֶׁ֥ר תִּזְרַ֖ע בַּ/שָּׂדֶ֑ה וְ/חַ֤ג הָֽ/אָסִף֙ בְּ/צֵ֣את הַ/שָּׁנָ֔ה בְּ/אָסְפְּ/ךָ֥ אֶֽת מַעֲשֶׂ֖י/ךָ מִן הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/016.yaml
  text: and the Feast of Harvest[a], the firstfruits of your labors, of what you sow in the field; and the Feast of Ingathering at the end of the year[c][b], when you gather in your labors from the field.
translation:
  language: fr
  text: et la fête de la Moisson[a], celle des prémices des produits de ton travail, de ce que tu sèmes dans le champ ; et la fête de la Récolte[c], à la fin de l’année[b], quand tu recueilles du champ les produits de ton travail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « festival », ici et pour l’autre occurrence du mot « fête ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement en hébreu : « à la sortie de l’année ».'
    reason: lexical_alternative
  - marker: c
    text: La « Récolte » désigne ici la fête célébrée au moment où l’on rassemble les produits du champ.
    reason: cultural_note
lexical_decisions:
- source_word: חַג
  choice: fête
  rationale: « Fête » exprime naturellement en français une célébration religieuse fixée ; une note signale l’alternative « festival ».
- source_word: הַקָּצִיר
  choice: Moisson
  rationale: Le nom désigne la moisson ou l’action de moissonner. « Moisson » convient comme désignation agricole de la fête.
- source_word: בִּכּוּרֵי
  choice: prémices
  rationale: Terme français établi pour les premiers produits de la récolte, notamment dans un contexte cultuel.
- source_word: מַעֲשֶׂיךָ
  choice: le produit de ton travail
  rationale: Littéralement « tes œuvres/travaux ». Dans ce contexte agricole, la formule désigne ce que le travail produit tout en conservant le lien avec l’activité humaine ; elle est reprise dans les deux membres du verset.
- source_word: אֲשֶׁר תִּזְרַע בַּשָּׂדֶה
  choice: de ce que tu sèmes dans les champs
  rationale: Cette formulation française naturelle explicite le rapport des prémices avec les semailles, maintient l’adresse directe et emploie le présent à valeur générale.
- source_word: הָאָסִף
  choice: Récolte
  rationale: Le terme désigne le rassemblement des produits agricoles. « Récolte » est clair et idiomatique comme nom de fête, sans recourir au peu usuel « Engrangement ».
- source_word: בְּצֵאת הַשָּׁנָה
  choice: à la fin de l’année
  rationale: Rend naturellement le sens temporel de l’expression, dont la formulation littérale est donnée en note.
- source_word: בְּאָסְפְּךָ
  choice: quand tu recueilles
  rationale: L’infinitif construit précédé de בְּ a ici une valeur temporelle ; « quand tu recueilles » la rend clairement.
- source_word: מִן הַשָּׂדֶה
  choice: des champs
  rationale: Rend la provenance agricole de façon concise et naturelle en français.
theological_decisions: []
