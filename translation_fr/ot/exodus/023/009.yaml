source:
  edition: WLC
  text: וְ/גֵ֖ר לֹ֣א תִלְחָ֑ץ וְ/אַתֶּ֗ם יְדַעְתֶּם֙ אֶת נֶ֣פֶשׁ הַ/גֵּ֔ר כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/009.yaml
  text: You shall not oppress a sojourner[a], and you yourselves know the soul of the sojourner[b], because you were sojourners in the land of Egypt.
translation:
  language: fr
  text: Tu n’opprimeras pas l’immigré[a] ; vous savez vous-mêmes ce qu’éprouve l’immigré[b], puisque vous avez vous-mêmes vécu comme immigrés dans le pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’étranger résident » ou « la personne venue d’ailleurs ». Le mot hébreu gēr désigne une personne non originaire du pays qui vit au milieu de la population, souvent dans une situation sociale vulnérable.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « vous connaissez la nefesh de l’immigré ». Ici, nefesh évoque la personne dans sa vie ou sa condition vécue, et l’expression souligne une connaissance acquise par expérience.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר
  choice: immigré
  rationale: Le terme désigne ici une personne non originaire du pays qui réside au sein de la population, dans une situation souvent vulnérable. « Immigré » exprime clairement cette réalité sociale en français moderne, sans suggérer un simple voyageur de passage.
- source_word: תִלְחָץ
  choice: opprimeras
  rationale: Dans ce contexte juridique, לחץ évoque une pression abusive et l’exploitation d’une personne vulnérable. « Opprimer » en conserve la force sociale et morale.
- source_word: וְאַתֶּם יְדַעְתֶּם
  choice: Vous savez vous-mêmes
  rationale: Le pronom explicite אַתֶּם donne de l’emphase, rendue par « vous-mêmes » ; le parfait exprime un savoir acquis par expérience et toujours pertinent.
- source_word: אֶת נֶפֶשׁ הַגֵּר
  choice: ce qu’éprouve l’immigré
  rationale: Littéralement « la nefesh de l’immigré », l’expression renvoie ici à son vécu intérieur et à sa condition ressentie. Cette formulation idiomatique évite que « âme » soit compris dans un sens dualiste absent du contexte, tout en signalant la littéralité en note.
- source_word: כִּי
  choice: puisque
  rationale: La conjonction introduit la raison fondée sur l’expérience propre d’Israël ; « puisque » marque naturellement ce lien causal en français.
- source_word: גֵרִים הֱיִיתֶם
  choice: vous avez été immigrés
  rationale: La reprise du même mot français préserve le lien rhétorique avec le גֵר qu’il est interdit d’opprimer. Le passé composé présente cette expérience passée comme pertinente pour le présent.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: en Égypte
  rationale: En français naturel, « en Égypte » transmet pleinement le sens de l’hébreu « dans le pays d’Égypte » sans lourdeur inutile.
theological_decisions:
- issue: Sens social et juridique de גֵר dans la loi de l’alliance
  choice: immigré
  alternative: étranger ; résident étranger ; personne venue d’ailleurs
  rationale: Le commandement vise un non-autochtone établi parmi le peuple, et non l’étranger au sens ethnique général ni le voyageur de passage. La reprise du terme pour Israël en Égypte fonde l’exigence morale sur une expérience analogue de migration et de vulnérabilité.
- issue: Portée de נֶפֶשׁ dans l’expression idiomatique
  choice: ce qu’éprouve l’immigré
  alternative: l’âme de l’immigré ; la condition de l’immigré ; ce que vit l’immigré
  rationale: Dans ce contexte, נֶפֶשׁ ne tranche pas une doctrine de la composition de l’être humain ; il évoque la vie intérieure ou la condition vécue. La traduction choisie restitue l’appel à une connaissance empathique sans importer un dualisme.
translation_notes:
  register: Français international moderne, clair et digne. Le singulier collectif de גֵר est conservé. « Immigré » est repris dans les deux moitiés du verset afin de préserver l’argument fondé sur l’expérience d’Israël. La tournure idiomatique « ce qu’éprouve » privilégie l’intelligibilité, tandis que la note conserve la transparence formelle de נֶפֶשׁ.
