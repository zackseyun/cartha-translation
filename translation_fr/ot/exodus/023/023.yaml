  text: כִּֽי יֵלֵ֣ךְ מַלְאָכִ/י֮ לְ/פָנֶי/ךָ֒ וֶ/הֱבִֽיאֲ/ךָ֗ אֶל הָֽ/אֱמֹרִי֙ וְ/הַ֣/חִתִּ֔י וְ/הַ/פְּרִזִּי֙ וְ/הַֽ/כְּנַעֲנִ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י וְ/הִכְחַדְתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/023.yaml
  text: For my angel will go before you and bring you to the Amorites[a], the Hittites, the Perizzites, the Canaanites, the Hivites, and the Jebusites[b], and I will wipe them out.
translation:
  language: fr
  text: Car mon ange[a] ira devant toi et te conduira jusqu’aux Amorites, aux Hittites, aux Perizzites, aux Cananéens, aux Hivvites et aux Jébusites ; je les ferai disparaître[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon messager ». Le mot hébreu מַלְאָךְ peut désigner un messager humain ou céleste ; ici, « ange » convient au contexte de conduite divine.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie un suffixe complément singulier, littéralement « je le ferai disparaître », à valeur collective pour les peuples qui viennent d’être énumérés.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici l’explication ou le fondement de la promesse et de l’ordre qui précèdent. « Car » en conserve naturellement la valeur explicative.
- source_word: יֵלֵךְ
  choice: ira
  rationale: L’imparfait hébreu a ici une valeur future dans le cadre d’une promesse divine. « Ira » est direct et naturel en français moderne.
- source_word: מַלְאָכִי
  choice: mon ange
  rationale: מַלְאָךְ peut désigner un messager humain ou céleste. Dans ce contexte de conduite et d’intervention divines, « ange » convient au sens contextuel sans préciser davantage l’identité de cet être.
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: L’expression indique que l’ange précède Israël pour le guider. « Devant toi » reste proche de l’hébreu tout en étant idiomatique.
- source_word: וֶהֱבִיאֲךָ
  choice: et te conduira
  rationale: Le hifil de בוא signifie « faire venir, amener ». Avec une destination constituée d’une liste de peuples, « te conduira » exprime naturellement le mouvement vers eux.
- source_word: אֶל
  choice: jusqu’aux
  rationale: La préposition marque la direction. « Jusqu’aux » s’accorde naturellement avec « te conduira » et évite de suggérer que les peuples eux-mêmes sont un lieu au sens strict.
- source_word: הָאֱמֹרִי ... וְהַיְבוּסִי
  choice: les Amorites, les Hittites, les Perizzites, les Cananéens, les Hivvites et les Jébusites
  rationale: Les gentilés hébreux sont morphologiquement singuliers mais désignent collectivement des peuples. Les formes françaises usuelles sont donc employées au pluriel.
- source_word: וְהִכְחַדְתִּיו
  choice: alors je les ferai disparaître
  rationale: Le hifil de כחד exprime le fait de faire disparaître ou d’exterminer. « Ferai disparaître » rend la valeur causative et la force du verbe sans ajouter une précision absente de l’hébreu. Le pronom français pluriel restitue naturellement le référent collectif.
theological_decisions:
- issue: Identité et nature de מַלְאָכִי
  choice: « mon ange », sans identifier davantage la figure
  alternative: « mon messager » ; une manifestation théophanique du Seigneur ; le Fils avant son incarnation
  rationale: Le verset présente seulement cette figure comme l’ange ou le messager de Dieu. La traduction conserve cette désignation sans trancher les interprétations théologiques ultérieures.
- issue: Nombre du complément dans וְהִכְחַדְתִּיו
  choice: 'Pronom pluriel collectif : « les »'
  alternative: 'Singulier littéral : « le » ou « celui-ci »'
  rationale: Le suffixe hébreu est singulier, mais il reprend collectivement la série des peuples énumérés. Le pluriel est nécessaire pour transmettre clairement ce sens en français naturel.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier correspond à l’adresse hébraïque à Israël comme entité collective. La formulation garde l’ambiguïté propre à מַלְאָךְ dans une note et restitue sans lourdeur le singulier collectif du texte source.
