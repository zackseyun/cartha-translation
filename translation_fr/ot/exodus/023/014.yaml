lexical_decisions:
- source_word: שָׁלֹשׁ רְגָלִים
  choice: Trois fois
  rationale: L’expression hébraïque signifie littéralement « trois pieds », mais désigne idiomatiquement trois occasions annuelles, associées aux fêtes de pèlerinage.
- source_word: תָּחֹג
  choice: tu célébreras une fête
  rationale: Le verbe חגג exprime la célébration d’une fête cultuelle; cette formulation reste naturelle en français tout en conservant la portée festive et religieuse.
- source_word: לִי
  choice: en mon honneur
  rationale: Le complément indique que la fête est célébrée pour YHWH et lui est consacrée. « En mon honneur » exprime naturellement cette orientation en français.
- source_word: בַּשָּׁנָה
  choice: par an
  rationale: Cette formulation française concise et courante rend la fréquence annuelle exprimée par « dans l’année ».
