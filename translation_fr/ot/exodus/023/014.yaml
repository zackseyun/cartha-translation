  text: Trois fois par an, tu célébreras une fête en mon honneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « trois pieds ». Cette expression hébraïque désigne les trois occasions annuelles de fête et de pèlerinage.'
