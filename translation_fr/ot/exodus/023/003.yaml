  text: וְ/דָ֕ל לֹ֥א תֶהְדַּ֖ר בְּ/רִיבֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/003.yaml
  text: And you shall not show partiality to a poor man in his lawsuit[a].
translation:
  language: fr
  text: Tu ne favoriseras pas un pauvre dans son procès.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu n’honoreras pas un pauvre dans son affaire. » Le verbe hébreu signifie plus littéralement « honorer », mais, dans ce contexte judiciaire, il évoque le fait d’accorder un traitement de faveur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: non plus
  rationale: Dans la suite des interdictions judiciaires, la conjonction relie naturellement ce commandement au précédent; « non plus » rend ce lien en français courant sans imposer un contraste fort.
- source_word: דָל
  choice: un pauvre
  rationale: Le nom désigne ici une personne pauvre, modeste ou socialement faible. Le singulier indéfini correspond à la forme hébraïque et convient à l'exemple juridique.
- source_word: תֶהְדַּר
  choice: favoriseras
  rationale: Le verbe peut littéralement évoquer le fait d'honorer, mais, dans ce contexte judiciaire, il désigne un traitement préférentiel. « Favoriser » exprime clairement ce biais indu.
- source_word: בְּרִיבוֹ
  choice: dans son procès
  rationale: רִיב peut désigner un litige ou une affaire judiciaire. Le contexte légal justifie « procès », tandis que « son » rend le suffixe masculin singulier.
- source_word: לֹא
  choice: ne… pas
  rationale: Avec l'imparfait verbal employé dans une prescription légale, la négation forme en français une interdiction au futur.
theological_decisions:
- issue: Souci des pauvres et impartialité judiciaire
  choice: Le verset interdit de favoriser une personne pauvre dans une affaire judiciaire.
  alternative: Le verset commanderait d'honorer le pauvre de manière générale.
  rationale: La mention explicite de son litige et le contexte des règles judiciaires indiquent que l'enjeu est l'impartialité du jugement. Cette formulation ne nie pas le devoir de compassion envers les pauvres, mais n'introduit pas non plus ce thème dans ce verset.
translation_notes:
  register: Français moderne, clair et digne. Le futur de prescription conserve la tonalité juridique. « Un pauvre » est naturel et fidèle au singulier hébreu; « favoriser » évite que « honorer » soit compris comme une règle générale de respect plutôt que comme une mise en garde contre la partialité.
