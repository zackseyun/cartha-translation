  text: מִ/דְּבַר שֶׁ֖קֶר תִּרְחָ֑ק וְ/נָקִ֤י וְ/צַדִּיק֙ אַֽל תַּהֲרֹ֔ג כִּ֥י לֹא אַצְדִּ֖יק רָשָֽׁע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/007.yaml
  text: Keep far from a false matter[a], and do not kill the innocent and the righteous[b], for I will not justify the wicked.
translation:
  language: fr
  text: Tiens-toi loin de toute affaire mensongère[a], et ne tue pas l’innocent ni le juste, car je ne justifierai pas le méchant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de toute fausse accusation » ou « de tout mensonge ». Le terme hébreu traduit par « affaire » est large et peut inclure une parole mensongère, un faux témoignage ou une cause judiciaire trompeuse.
    reason: lexical_alternative
  - marker: b
    text: Ou « car je n’acquitterai pas le coupable ». Le verbe hébreu appartient au langage judiciaire et peut signifier « déclarer juste », « justifier » ou « acquitter ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדְּבַר שֶׁקֶר
  choice: de toute affaire mensongère
  rationale: דָּבָר peut désigner une parole, une affaire ou une cause. Dans ce contexte judiciaire, « affaire mensongère » conserve une portée plus large que « fausse accusation » et peut inclure mensonge, faux témoignage ou procédure trompeuse.
- source_word: תִּרְחָק
  choice: Tiens-toi loin
  rationale: L’imparfait qal à valeur injonctive demande une séparation active. « Tiens-toi loin » restitue directement cette image sans réduire l’instruction au simple fait d’éviter.
- source_word: וְנָקִי
  choice: l’innocent
  rationale: נָקִי désigne ici celui qui est exempt de faute ou de culpabilité; « l’innocent » est clair et naturel dans un cadre judiciaire.
- source_word: וְצַדִּיק
  choice: le juste
  rationale: צַדִּיק désigne celui qui est juste ou qui se trouve dans son droit. « Le juste » préserve le lien lexical avec la racine צדק reprise dans אַצְדִּיק.
- source_word: אַל תַּהֲרֹג
  choice: ne fais pas mourir
  rationale: הרג signifie tuer ou faire mourir. Dans le contexte d’une procédure judiciaire, « ne fais pas mourir » exprime naturellement la mise à mort sans introduire la notion plus précise de meurtre.
- source_word: לֹא אַצְדִּיק
  choice: je ne déclarerai pas juste
  rationale: 'Le hiphil de צדק a ici un sens judiciaire: déclarer juste, justifier ou acquitter. « Déclarer juste » rend explicite le verdict et conserve le lien avec « le juste ».'
- source_word: רָשָׁע
  choice: le méchant
  rationale: רָשָׁע peut désigner le méchant ou le coupable. « Le méchant » maintient sa portée morale et judiciaire, tandis que « le coupable » est signalé comme possibilité contextuelle.
theological_decisions:
- issue: Sens judiciaire de la déclaration divine
  choice: car je ne déclarerai pas juste le méchant
  alternative: car je n’acquitterai pas le coupable
  rationale: Le texte fonde l’interdiction humaine sur le jugement de Dieu. « Déclarer juste » conserve à la fois le caractère judiciaire de l’énoncé et l’écho entre צַדִּיק et אַצְדִּיק, sans décider si רָשָׁע doit être entendu principalement au sens moral (« méchant ») ou judiciaire (« coupable »).
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde l’image concrète de l’éloignement, le cadre judiciaire et la répétition de la racine hébraïque liée à la justice. Les deux notes conservent les principales ambiguïtés lexicales sans imposer une lecture confessionnelle.
