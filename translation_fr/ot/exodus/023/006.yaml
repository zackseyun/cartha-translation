  yaml_path: translation/ot/exodus/023/006.yaml
  text: You shall not pervert the justice due to your poor person in his dispute[a].
translation:
  language: fr
  text: Tu ne fausseras pas le droit du pauvre dans son litige[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans son procès » ; ou : « dans son affaire judiciaire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: Tu ne… pas
  rationale: La négation introduit une interdiction. Le futur à valeur injonctive convient au style juridique biblique en français.
- source_word: תַטֶּה
  choice: fausseras
  rationale: Le hiphil de נטה signifie ici faire dévier ou infléchir le droit. « Fausser » exprime naturellement une atteinte à l’équité d’une décision judiciaire.
- source_word: מִשְׁפַּט
  choice: le droit
  rationale: Dans ce contexte judiciaire, le terme désigne le droit reconnu à une personne ou la justice qui lui est due, plutôt qu’une simple notion abstraite de justice.
- source_word: אֶבְיֹנְךָ
  choice: du pauvre qui est parmi toi
  rationale: אֶבְיוֹן désigne une personne pauvre ou nécessiteuse. Le suffixe de deuxième personne marque son appartenance à la communauté placée sous la responsabilité du destinataire; cette formulation évite le peu naturel « ton pauvre » sans effacer le suffixe.
- source_word: בְּרִיבוֹ
  choice: dans son procès
  rationale: רִיב peut désigner un différend ou une contestation judiciaire. Ici, le cadre légal favorise « procès », tout en laissant l’alternative plus large en note.
theological_decisions:
- issue: La nature de l’interdiction concernant le pauvre
  choice: Le texte interdit de fausser le droit d’une personne pauvre dans une affaire judiciaire.
  alternative: 'Formulation générale : « Ne refuse pas justice au pauvre. »'
  rationale: La syntaxe hébraïque présente מִשְׁפַּט comme ce qui ne doit pas être infléchi et בְּרִיבוֹ comme le cadre contentieux. La traduction conserve donc la portée judiciaire précise sans transformer le verset en maxime sociale générale.
translation_notes:
  register: Français moderne, digne et juridique. Le futur prohibitif maintient la tonalité du code de l’alliance. « Le pauvre qui est parmi toi » restitue le suffixe hébreu de façon intelligible sans imposer en français un masculin biologique absent de la portée représentative du terme.
