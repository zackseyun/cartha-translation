review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend correctement l’interdiction, le sens juridique de מִשְׁפָּט (« droit ») et le cadre contentieux de רִיב. Toutefois, « qui est parmi toi » ne correspond pas au suffixe de deuxième personne de אֶבְיֹנְךָ : le texte dit littéralement « ton pauvre / ton indigent », sans préciser qu’il se trouve « parmi toi ». Cette précision communautaire ajoutée doit être retirée.'
  naturalness: « Tu ne fausseras pas le droit du pauvre dans son litige » est un français moderne, clair et de registre juridique convenant au style prescriptif du passage. « Litige » conserve une portée juridique sans restreindre indûment רִיב à un procès formel.
  terminology: « Le droit » rend bien מִשְׁפָּט dans ce contexte. « Pauvre » est approprié pour אֶבְיוֹן. La note garde des équivalents légitimes pour רִיב, tout en évitant de présenter « procès » comme le seul sens possible.
  issues:
