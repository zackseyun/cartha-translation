base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/025.yaml
  text: You shall serve Yahweh your God[a], and he will bless your bread and your water[b], and I will remove sickness from your midst.
translation:
  language: fr
  text: Vous servirez Yahweh, votre Dieu, et il bénira votre pain[a] et votre eau, et j’éloignerai de vous la maladie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « pain » peut désigner plus largement la nourriture ou les provisions.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie d’abord le pluriel (« vous servirez »), puis des suffixes au singulier dans une adresse collective. Le français « vous » et « votre » rendent naturellement l’ensemble d’Israël.
    reason: grammatical_clarification
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: Vous servirez
  rationale: Le verbe עבד désigne ici le service rendu à Dieu dans le cadre de l’alliance, avec une dimension cultuelle. « Servirez » conserve cette portée plus large que « adorerez » et rend naturellement la valeur injonctive du contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Dans cette construction, אֱלֹהִים désigne sans ambiguïté le Dieu d’Israël; le possessif exprime la relation d’alliance.
- source_word: וּבֵרַךְ
  choice: et il bénira
  rationale: La forme exprime ici la conséquence promise après l’injonction. Le sujet implicite, Yahweh, est repris par « il » en français.
- source_word: לַחְמְךָ
  choice: votre pain
  rationale: לֶחֶם signifie littéralement « pain » et peut, par métonymie, désigner plus largement la nourriture. Le terme concret est conservé, avec une note signalant son sens possible.
- source_word: מֵימֶיךָ
  choice: votre eau
  rationale: Bien que la forme hébraïque soit morphologiquement plurielle, « eau » au singulier collectif est la tournure française naturelle.
- source_word: וַהֲסִרֹתִי
  choice: et j’éloignerai
  rationale: Le hiphil de סור signifie faire disparaître, ôter ou écarter. « Éloignerai » convient à la construction avec « du milieu de vous » tout en conservant la promesse de protection divine.
- source_word: מַחֲלָה
  choice: la maladie
  rationale: Le nom peut désigner la maladie ou l’affection en général. « La maladie » est courant, ample et non excessivement clinique.
- source_word: מִקִּרְבֶּךָ
  choice: du milieu de vous
  rationale: Cette expression préserve le sens collectif et communautaire, sans réduire la maladie à une réalité seulement intérieure ou individuelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie directement le tétragramme. La translittération « Yahweh » maintient le nom d’alliance sans lui substituer un titre.
- issue: Alternance entre le pluriel et le singulier dans l’adresse
  choice: Employer le « vous » français, qui peut désigner collectivement Israël, sans expliciter l’alternance grammaticale
  alternative: Ajouter une note décrivant le passage du verbe pluriel aux suffixes singuliers en hébreu
  rationale: L’hébreu commence par un verbe à la deuxième personne du pluriel, puis emploie des suffixes singuliers dans une adresse collective. Le français « vous/votre » rend naturellement l’adresse au peuple, sans effacer sa portée collective ni produire une formulation artificielle.
- issue: Passage de « il bénira » à « j’éloignerai »
  choice: Conserver le changement de personne
  alternative: Harmoniser en « il éloignera »
  rationale: Le changement est présent dans le texte hébreu. Le conserver respecte sa tension grammaticale et évite d’uniformiser silencieusement la voix divine.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve la répétition des coordinations ainsi que le changement volontaire de la troisième à la première personne. « Du milieu de vous » maintient la dimension communautaire de la promesse.
