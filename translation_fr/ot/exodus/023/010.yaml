  text: וְ/שֵׁ֥שׁ שָׁנִ֖ים תִּזְרַ֣ע אֶת אַרְצֶ֑/ךָ וְ/אָסַפְתָּ֖ אֶת תְּבוּאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/010.yaml
  text: For six years you shall sow your land and gather its produce[a].
translation:
  language: fr
  text: Pendant six ans, tu ensemenceras ta terre et tu en recueilleras le produit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les produits » ou « le rendement ».
    reason: Alternatives lexicales pour le singulier collectif hébreu תְּבוּאָה.
lexical_decisions:
- source_word: וְ/שֵׁשׁ שָׁנִים
  choice: Pendant six ans
  rationale: La conjonction suivie de l’expression temporelle introduit ici la durée de la prescription. « Pendant six ans » est idiomatique en français et conserve ce cadre temporel.
- source_word: תִּזְרַע
  choice: tu ensemenceras
  rationale: L’imparfait hébreu à la deuxième personne du masculin singulier a une valeur prescriptive dans ce contexte juridique. Le futur français exprime naturellement cette instruction.
- source_word: אַרְצֶךָ
  choice: ta terre
  rationale: אֶרֶץ désigne ici la terre cultivée appartenant au destinataire, non la planète ou le sol au sens abstrait. « Ta terre » convient au contexte agricole et rend le suffixe de deuxième personne.
- source_word: וְאָסַפְתָּ
  choice: et tu en récolteras
  rationale: אָסַף signifie rassembler ou recueillir; dans ce contexte agricole, « récolter » exprime naturellement l’action de recueillir ce que produit la terre sans modifier le sens.
- source_word: תְּבוּאָתָהּ
  choice: les produits
  rationale: תְּבוּאָה désigne les produits ou le rendement agricoles. « Les produits » reste général, tandis que le pronom « en » renvoie clairement à la terre et représente le suffixe féminin hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement singulier conserve l’adresse hébraïque à la deuxième personne du masculin singulier. La formulation juridique est rendue par le futur prescriptif, naturel dans les textes normatifs français.
