  text: הִנֵּ֨ה אָנֹכִ֜י שֹׁלֵ֤חַ מַלְאָךְ֙ לְ/פָנֶ֔י/ךָ לִ/שְׁמָרְ/ךָ֖ בַּ/דָּ֑רֶךְ וְ/לַ/הֲבִ֣יאֲ/ךָ֔ אֶל הַ/מָּק֖וֹם אֲשֶׁ֥ר הֲכִנֹֽתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/020.yaml
  text: Behold[a], I am sending an angel before you to guard you on the way and to bring you to the place that I have prepared.
translation:
  language: fr
  text: Voici, j’envoie un ange[a] devant toi pour te garder en chemin et t’amener au lieu que j’ai préparé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un messager ». Le mot hébreu peut désigner un messager humain ou un ange ; ici, le contexte favorise « ange ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Conserve la fonction déictique et solennelle de la particule hébraïque tout en restant naturel dans un registre français digne.
- source_word: אָנֹכִי שֹׁלֵחַ
  choice: j’envoie
  rationale: Le pronom indépendant et le participe présentent l’action divine comme actuelle ou imminente. Le présent français l’exprime naturellement sans surcharger l’emphase.
- source_word: מַלְאָךְ
  choice: un ange
  rationale: Le mot peut désigner un messager humain ou céleste. Dans ce contexte de protection et de conduite accordées par Dieu, « ange » est le sens le plus probable; l’autre possibilité est signalée en note.
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: Rend directement l’idée d’un envoyé qui précède Israël, sans développer davantage le rôle du personnage.
- source_word: לִשְׁמָרְךָ
  choice: pour te garder
  rationale: « Garder » exprime directement la protection durant le trajet et maintient la répétition lexicale possible avec le verset suivant.
- source_word: בַּדָּרֶךְ
  choice: en chemin
  rationale: Expression française idiomatique désignant le parcours ou le voyage.
- source_word: וְלַהֲבִיאֲךָ
  choice: et te conduire
  rationale: Le causatif de בוא signifie littéralement faire venir, donc amener. « Conduire » est ici naturel pour un envoyé qui précède le peuple vers sa destination, sans réduire l’action à une simple indication d’itinéraire.
- source_word: הַמָּקוֹם
  choice: au lieu
  rationale: Équivalent simple et direct de מָקוֹם dans ce contexte de destination.
- source_word: אֲשֶׁר הֲכִנֹתִי
  choice: que j’ai préparé
  rationale: Rend le causatif de כון comme l’action divine de rendre le lieu prêt ou de l’établir pour Israël, sans trancher entre ces nuances.
theological_decisions:
- issue: Identité de מַלְאָךְ dans ce passage
  choice: Employer « un ange » sans préciser sa nature ni son identité théologique.
  alternative: « un messager », ou une identification explicite à une manifestation divine particulière.
  rationale: Le verset ne désigne le personnage que par le terme מַלְאָךְ. Le contexte élargi soulève des questions sur son statut, mais la traduction ne doit pas les résoudre en ajoutant une identification absente du texte.
translation_notes:
  register: Français international moderne, clair et digne. « Voici » conserve la solennité de la parole divine; le tutoiement suit le singulier hébreu adressé collectivement à Israël.
