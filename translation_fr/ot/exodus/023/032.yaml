  yaml_path: translation/ot/exodus/023/032.yaml
  text: You shall make no covenant with them or with their gods[a][b].
translation:
  language: fr
  text: Tu ne concluras d’alliance ni avec eux ni avec leurs dieux[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « couper une alliance ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu porte littéralement : « et avec leurs dieux ».'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא
  choice: ne… ni… ni
  rationale: La négation hébraïque porte sur les deux partenaires mentionnés. En français naturel, la construction « ne… ni… ni » exprime clairement cette interdiction double.
- source_word: תִכְרֹת
  choice: tu ne concluras
  rationale: Avec בְּרִית, le verbe כרת forme l’expression idiomatique « conclure une alliance », littéralement « couper une alliance ». Le futur à valeur injonctive convient au style juridique du contexte.
- source_word: לָהֶם
  choice: avec eux
  rationale: Dans l’expression de conclusion d’une alliance, la préposition ל désigne ici les partenaires de l’alliance et se rend naturellement par « avec ».
- source_word: וְלֵאלֹהֵיהֶם
  choice: ni avec leurs dieux
  rationale: Le waw est formellement additif (« et »), mais sous la portée de la négation, « ni… ni » rend en français l’interdiction visant séparément les deux groupes. Le pluriel « dieux » respecte la forme hébraïque et le contexte.
- source_word: בְּרִית
  choice: alliance
  rationale: « Alliance » est le terme français courant et théologiquement approprié pour בְּרִית; il conserve ici à la fois la dimension politique et religieuse.
theological_decisions:
- issue: Expression idiomatique כרת ברית
  choice: conclure une alliance
  alternative: couper une alliance
  rationale: « Conclure une alliance » restitue naturellement l’idiome hébraïque en français moderne sans atténuer la force juridique et religieuse de l’interdiction.
- issue: Valeur de וְ devant « leurs dieux » sous la négation
  choice: ni avec leurs dieux
  alternative: et avec leurs dieux
  rationale: Bien que וְ signifie formellement « et », la coordination négative française « ni… ni » communique clairement que toute alliance est interdite avec les deux partenaires mentionnés, sans résoudre autrement la relation syntaxique.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète la deuxième personne masculine singulière de l’hébreu. « Conclure une alliance » est idiomatique sans être familier; « ni… ni » rend explicitement la portée de la négation.
