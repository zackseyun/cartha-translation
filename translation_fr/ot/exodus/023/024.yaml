source:
  edition: WLC
  text: לֹֽא תִשְׁתַּחֲוֶ֤ה לֵ/אלֹֽהֵי/הֶם֙ וְ/לֹ֣א תָֽעָבְדֵ֔/ם וְ/לֹ֥א תַעֲשֶׂ֖ה כְּ/מַֽעֲשֵׂי/הֶ֑ם כִּ֤י הָרֵס֙ תְּהָ֣רְסֵ֔/ם וְ/שַׁבֵּ֥ר תְּשַׁבֵּ֖ר מַצֵּבֹתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/024.yaml
  text: You shall not bow down to their gods[a], nor serve them, nor do according to their deeds; rather, you shall surely tear them down and surely shatter their pillars.
translation:
  language: fr
  text: Tu ne te prosterneras pas devant leurs dieux et tu ne les serviras pas. Tu n’agiras pas selon leurs pratiques. Au contraire, tu les démoliras entièrement et tu briseras complètement leurs pierres dressées[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs stèles sacrées » ou « leurs piliers ». Le terme hébreu désigne des monuments de pierre dressés, associés ici au culte.
    reason: alternative lexicale et précision culturelle
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: te prosterneras
  rationale: Le verbe désigne concrètement le fait de s’incliner jusqu’à terre en signe de révérence. « Se prosterner » conserve ce geste sans le réduire au terme plus général « adorer ».
- source_word: לֵאלֹהֵיהֶם
  choice: devant leurs dieux
  rationale: Après « se prosterner », « devant » est naturel en français et exprime la révérence rendue aux divinités des nations.
- source_word: תָעָבְדֵם
  choice: les serviras
  rationale: Le verbe עבד peut ici désigner un service cultuel. « Servir » reste lexicalement direct et préserve la distinction avec l’acte de se prosterner.
- source_word: תַעֲשֶׂה כְּמַעֲשֵׂיהֶם
  choice: n’agiras pas selon leurs pratiques
  rationale: Cette formulation rend l’idée d’agir conformément à leurs actes. « Pratiques » exprime naturellement en français les comportements, notamment cultuels, sans les préciser davantage que le contexte.
- source_word: כִּי
  choice: Au contraire
  rationale: Dans ce contexte, כִּי introduit l’action opposée aux interdictions précédentes. « Au contraire » rend clairement cette valeur adversative.
- source_word: הָרֵס תְּהָרְסֵם
  choice: tu les démoliras entièrement
  rationale: La construction infinitif absolu plus verbe conjugué renforce le commandement. « Entièrement » transmet cette insistance, tandis que le pronom « les » conserve l’enchaînement et une part de l’ambiguïté du référent hébreu.
- source_word: וְשַׁבֵּר תְּשַׁבֵּר
  choice: tu briseras complètement
  rationale: La seconde construction intensive appelle elle aussi un renforcement explicite. « Briser » convient à des monuments de pierre et « complètement » restitue l’emphase.
- source_word: מַצֵּבֹתֵיהֶם
  choice: leurs pierres dressées
  rationale: מַצֵּבָה désigne une pierre érigée ou une stèle, souvent liée au culte. « Pierres dressées » décrit clairement l’objet matériel sans masquer sa nature derrière le seul mot « piliers ».
theological_decisions:
- issue: Nature des actes interdits envers les divinités étrangères
  choice: Conserver séparément l’acte de se prosterner et celui de servir.
  alternative: Fusionner les deux sous le vocabulaire général de l’adoration.
  rationale: L’hébreu emploie deux verbes distincts. Leur maintien interdit à la fois le geste de révérence et le service cultuel durable, sans effacer la progression rhétorique du texte.
- issue: Référent du pronom dans l’ordre de démolir
  choice: Conserver le pronom « les », tout en laissant la mention suivante des pierres dressées orienter vers les réalités cultuelles liées aux dieux.
  alternative: Expliciter « leurs objets de culte » ou comprendre directement que les dieux eux-mêmes sont démolis.
  rationale: Le suffixe hébreu reprend grammaticalement un pluriel antérieur, mais le commandement aboutit explicitement à la destruction de monuments matériels. Le pronom préserve la force et l’ambiguïté de la formulation sans imposer une précision absente du texte.
translation_notes:
  register: Français international moderne, direct et solennel. Le tutoiement singulier reproduit l’adresse hébraïque. Les deux phrases courtes rendent lisible la série d’interdictions, et les adverbes « entièrement » et « complètement » transmettent les deux constructions intensives de l’hébreu.
