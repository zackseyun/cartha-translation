  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֣ת יָמִים֩ תֹּאכַ֨ל מַצּ֜וֹת כַּֽ/אֲשֶׁ֣ר צִוִּיתִ֗/ךָ לְ/מוֹעֵד֙ חֹ֣דֶשׁ הָֽ/אָבִ֔יב כִּי ב֖/וֹ יָצָ֣אתָ מִ/מִּצְרָ֑יִם וְ/לֹא יֵרָא֥וּ פָנַ֖/י רֵיקָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/015.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib, for in it you came out from Egypt[b]. And no one shall appear before me empty-handed.
translation:
  language: fr
  text: Tu observeras la fête des Pains sans levain. Pendant sept jours, tu mangeras des pains sans levain, comme je te l’ai ordonné, au temps fixé, au mois d’Abib, car c’est en ce mois que tu es sorti d’Égypte. Nul ne se présentera devant moi les mains vides.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu passe ici de la deuxième personne du singulier à la troisième personne du pluriel : littéralement, « ils ne se présenteront pas devant moi les mains vides ».'
    reason: Le changement de personne grammaticale est réel dans le texte source; la note le conserve tout en permettant une formulation française naturelle.
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: la fête des Pains sans levain
  rationale: חַג désigne une fête religieuse, souvent associée à un pèlerinage, et מַצּוֹת des pains sans levain. Cette formulation est claire, consacrée et garde le caractère officiel de la célébration.
- source_word: תִּשְׁמֹר
  choice: tu observeras
  rationale: Dans un contexte légal et cultuel, שׁמר signifie respecter ou observer une prescription. « Observeras » exprime naturellement en français la force de l’obligation.
- source_word: תֹּאכַל מַצּוֹת
  choice: tu mangeras des pains sans levain
  rationale: Le pluriel concret « des pains sans levain » rend directement מַצּוֹת et demeure naturel en français.
- source_word: לְמוֹעֵד
  choice: au temps fixé
  rationale: מוֹעֵד désigne ici le moment déterminé du calendrier cultuel. « Au temps fixé » en restitue le sens sans préciser davantage que le texte.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: au mois d’Abib
  rationale: La translittération conserve la fonction calendaire d’אָבִיב comme désignation du mois, plutôt que de la remplacer par une explication agricole.
- source_word: כִּי בוֹ יָצָאתָ מִמִּצְרָיִם
  choice: car c’est en ce mois que tu es sorti d’Égypte
  rationale: Le pronom בוֹ renvoie naturellement au mois qui vient d’être mentionné. L’explicitation légère évite en français une référence pronominale obscure.
- source_word: וְלֹא יֵרָאוּ פָנַי רֵיקָם
  choice: Nul ne se présentera devant moi les mains vides
  rationale: Le niphal de ראה avec פָנַי forme l’idiome « se présenter devant moi ». רֵיקָם signifie « les mains vides ». « Nul » rend naturellement la portée indéfinie du pluriel hébreu, dont le changement de personne est signalé en note.
theological_decisions:
- issue: L’expression divine פָנַי, littéralement « ma face »
  choice: devant moi
  alternative: devant ma face / en ma présence
  rationale: Dans cet idiome cultuel, « devant moi » exprime clairement le fait de venir en présence de Dieu, sans introduire une interprétation doctrinale supplémentaire.
- issue: Le passage de l’adresse au singulier à un verbe à la troisième personne du pluriel
  choice: Nul ne se présentera, avec une note signalant la forme hébraïque
  alternative: Ils ne se présenteront pas
  rationale: Le pluriel hébreu a ici une portée générale. « Nul » est idiomatique en français, tandis que la note conserve le changement grammatical réel et évite de lui attribuer silencieusement un référent précis.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier conserve l’adresse hébraïque à Israël comme destinataire collectif. La syntaxe reste proche du texte source tout en explicitant sobrement le référent de « en ce mois ».
