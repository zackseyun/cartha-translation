  text: לֹ֥א תִהְיֶ֛ה מְשַׁכֵּלָ֥ה וַ/עֲקָרָ֖ה בְּ/אַרְצֶ֑/ךָ אֶת מִסְפַּ֥ר יָמֶ֖י/ךָ אֲמַלֵּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/026.yaml
  text: There shall not be one miscarrying or barren in your land[b][a]; I will fill up the number of your days.
translation:
  language: fr
  text: Dans ton pays, il n’y aura ni femme qui fasse une fausse couche[a], ni femme stérile. Je porterai le nombre de tes jours à sa pleine mesure[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui soit privée de ses enfants ». Le terme hébreu peut désigner plus largement la perte d’enfants ; associé ici à « stérile », il évoque probablement une fausse couche ou la perte de l’enfant lors de l’accouchement.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Je remplirai le nombre de tes jours », c’est-à-dire : « Je mènerai ta vie jusqu’à sa pleine mesure. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁכֵּלָה
  choice: femme qui perde son enfant avant terme
  rationale: Le participe féminin dérivé de שׁכל peut désigner celle qui perd ses enfants. Associé ici à עֲקָרָה dans une promesse de fécondité, il évoque probablement la fausse couche ou la perte de l’enfant au moment de l’accouchement. La formulation française reste naturelle tout en signalant cette perte.
- source_word: עֲקָרָה
  choice: femme stérile
  rationale: Le terme féminin désigne celle qui ne peut avoir d’enfant. « Femme stérile » est clair, concis et adapté au registre de la promesse.
- source_word: בְּאַרְצֶךָ
  choice: dans ton pays
  rationale: אֶרֶץ désigne ici le territoire où Israël doit vivre. « Ton pays » est naturel en français moderne et conserve l’adresse au singulier collectif.
- source_word: אֶת מִסְפַּר יָמֶיךָ
  choice: le nombre de tes jours
  rationale: Cette traduction directe préserve l’image hébraïque du nombre de jours, c’est-à-dire la durée de vie accordée.
- source_word: אֲמַלֵּא
  choice: je porterai … à sa pleine mesure
  rationale: Le verbe מלא signifie « remplir, rendre plein ». Cette formulation française garde l’image de la plénitude tout en exprimant naturellement l’idée d’amener la durée de vie à son accomplissement.
- source_word: לֹא תִהְיֶה
  choice: il n’y aura ni … ni …
  rationale: Cette tournure existentielle rend naturellement la construction hébraïque négative et coordonne les deux participes féminins.
theological_decisions:
- issue: Portée de la promesse de fécondité et de longévité
  choice: Présenter cette parole comme une bénédiction de l’alliance accordée à Israël dans son pays, sans préciser son mécanisme ni l’étendre explicitement à toute personne croyante en tout temps.
  alternative: La comprendre comme une garantie universelle selon laquelle aucun croyant ne connaîtra jamais de fausse couche, de stérilité ou de mort prématurée.
  rationale: Le contexte immédiat concerne les promesses de YHWH à Israël en vue de sa vie dans le pays. La traduction conserve l’adresse et les images du texte sans ajouter une portée universelle que le verset n’énonce pas.
- issue: Référence humaine ou animale des formes féminines
  choice: Employer « femme » conformément à la lecture contextuelle dominante de la promesse concernant la fécondité humaine.
  alternative: Employer « femelle » pour inclure explicitement les animaux.
  rationale: Les formes hébraïques sont féminines, mais ne nomment pas expressément leur référent. Dans ce contexte et dans l’usage biblique de עֲקָרָה, la référence aux femmes est la plus naturelle; la traduction évite le terme français « femelle », peu digne lorsqu’il peut viser des personnes.
translation_notes:
  register: Français international moderne, clair et digne. La structure « ni… ni… » rend la négation hébraïque avec naturel. « Porter à sa pleine mesure » conserve la métaphore de la plénitude sans produire le tour peu idiomatique « remplir le nombre » dans le corps du texte.
