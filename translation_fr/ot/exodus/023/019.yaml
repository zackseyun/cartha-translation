base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/019.yaml
  text: The first of the firstfruits of your ground you shall bring into the house of Yahweh your God[b][a]. You shall not boil a young goat in its mother’s milk.
translation:
  language: fr
  text: Tu apporteras à la maison de Yahweh ton Dieu la première part des prémices de ton sol[a]. Tu ne feras pas bouillir un chevreau dans le lait de sa mère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la meilleure part des prémices de ton sol » ; le mot hébreu peut désigner la première part et, par extension, la part de choix.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: la première part des prémices
  rationale: רֵאשִׁית, en construction avec בִּכּוּרֵי, désigne la part initiale des premiers produits. Cette formulation conserve les deux éléments du syntagme hébreu sans lui imposer le sens plus interprétatif de « meilleur ».
- source_word: אַדְמָתְךָ
  choice: de ton sol
  rationale: אֲדָמָה désigne ici la terre cultivée dont proviennent les récoltes. « Sol » garde cette image agricole plus précisément que le terme plus large « pays ».
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: à la maison de Yahweh ton Dieu
  rationale: « Maison » convient au sanctuaire sans supposer le temple construit plus tard. Le nom divin est transcrit « Yahweh » afin de représenter directement יְהוָה.
- source_word: לֹא תְבַשֵּׁל
  choice: Tu ne feras pas bouillir
  rationale: Le piel de בּשׁל exprime ici l’action de faire bouillir ou cuire. « Faire bouillir » conserve le sens précis et la force juridique de l’interdiction.
- source_word: גְּדִי
  choice: un chevreau
  rationale: גְּדִי désigne normalement le petit de la chèvre. « Chevreau » est précis, naturel et évite une périphrase inutile.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: dans le lait de sa mère
  rationale: Cette formulation française rend directement et naturellement l’image concrète du texte hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. La transcription « Yahweh » préserve le nom d’alliance sans le remplacer par un titre.
- issue: Sens de l’interdiction concernant le chevreau
  choice: Conserver l’interdiction littérale sans en préciser la raison
  alternative: L’expliquer comme une pratique rituelle cananéenne, une règle alimentaire ou une interdiction motivée par la cruauté
  rationale: Le verset ne donne aucune raison à cette interdiction. La traduction ne tranche donc pas entre les diverses explications historiques ou théologiques proposées.
translation_notes:
  register: Français international moderne, sobre et digne. Le futur à valeur injonctive convient au style juridique du passage. « Prémices » conserve le vocabulaire cultuel traditionnel tout en restant intelligible dans le contexte agricole.
