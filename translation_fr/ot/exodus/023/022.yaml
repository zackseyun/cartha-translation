base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/022.yaml
  text: But if you carefully obey his voice and do all that I speak[b][a], then I will be an enemy to your enemies and an adversary to your adversaries.
translation:
  language: fr
  text: Mais si tu écoutes attentivement sa voix[a] et fais tout ce que je dirai[b], alors je serai l’ennemi de tes ennemis et l’adversaire de tes adversaires.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « si tu obéis fidèlement à sa voix ». En hébreu, le verbe « écouter » implique ici une écoute qui conduit à l’obéissance; la construction d’un infinitif absolu avec le verbe conjugué lui donne une valeur intensive.
    reason: lexical_alternative
  - marker: b
    text: Le verset passe de « sa voix » à « je dirai », maintenant ainsi le lien étroit entre le messager et le Seigneur dans ce contexte.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי אִם
  choice: Mais si
  rationale: Cette expression introduit une condition marquant un contraste net avec l’avertissement précédent. « Mais si » rend naturellement cette valeur en français.
- source_word: שָׁמֹעַ תִּשְׁמַע
  choice: tu écoutes vraiment
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’action. Dans ce contexte, écouter implique l’obéissance; « vraiment » conserve l’insistance hébraïque sans réduire le verbe au simple fait d’entendre.
- source_word: בְּקֹלוֹ
  choice: sa voix
  rationale: Cette formulation préserve l’image personnelle de la voix et maintient le renvoi au messager mentionné dans le contexte immédiat.
- source_word: וְעָשִׂיתָ כֹּל אֲשֶׁר אֲדַבֵּר
  choice: et fais tout ce que je dirai
  rationale: Le français exprime naturellement l’accomplissement de paroles par « faire tout ce que… ». Le futur « je dirai » convient à la forme verbale et conserve le passage soudain de « sa voix » à la première personne divine.
- source_word: וְאָיַבְתִּי אֶת אֹיְבֶיךָ
  choice: je serai l’ennemi de tes ennemis
  rationale: Cette traduction conserve la répétition lexicale et la formulation relationnelle de l’hébreu, plutôt que de la remplacer par le plus général « je m’opposerai ».
- source_word: וְצַרְתִּי אֶת צֹרְרֶיךָ
  choice: et l’adversaire de tes adversaires
  rationale: La formulation reproduit le parallélisme et le jeu sur des termes apparentés, tout en distinguant ce membre du précédent.
theological_decisions:
- issue: Passage de « sa voix » à « je dirai »
  choice: Conserver sans l’harmoniser le passage de la voix du messager à la parole du Seigneur à la première personne.
  alternative: Attribuer explicitement les deux expressions soit au seul messager, soit directement au seul Seigneur.
  rationale: Le texte associe étroitement la voix du messager et la parole divine dans le contexte immédiat. La traduction préserve cette tension théologique sans préciser davantage leur rapport.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse au peuple envisagé collectivement. Le parallélisme final et le changement de personne au centre du verset sont volontairement conservés.
