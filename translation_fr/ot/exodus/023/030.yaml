base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/030.yaml
  text: Little by little I will drive them out from before you[b][a], until you become fruitful and take possession of the land.
translation:
  language: fr
  text: Petit à petit, je le chasserai de devant toi[a], jusqu’à ce que tu te multiplies et que tu prennes possession du pays[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie un pronom objet masculin singulier ; ce singulier désigne probablement collectivement les habitants ou les peuples du pays.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « que tu hérites du pays ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מְעַט
  choice: Petit à petit
  rationale: La répétition exprime une progression graduelle. « Petit à petit » en conserve à la fois la forme répétée et le sens dans un français naturel.
- source_word: אֲגָרְשֶׁנּוּ
  choice: je le chasserai
  rationale: Le verbe גרשׁ signifie « chasser, expulser ». Le pronom suffixe est masculin singulier, probablement avec une valeur collective pour les habitants ou peuples du pays; le français singulier maintient cette particularité du texte source.
- source_word: מִפָּנֶיךָ
  choice: devant toi
  rationale: L’expression signifie littéralement « de devant ta face/présence ». Dans ce contexte, « chasser devant toi » restitue l’idée d’écarter les habitants à mesure qu’Israël avance, sans lourdeur littérale.
- source_word: עַד אֲשֶׁר
  choice: jusqu’à ce que
  rationale: Cette locution introduit le terme du processus graduel; « jusqu’à ce que » est son équivalent français naturel.
- source_word: תִּפְרֶה
  choice: tu te multiplies
  rationale: Le verbe פרה signifie « être fécond, fructifier, se multiplier ». Ici, il évoque l’accroissement démographique permettant d’occuper le pays; « te multiplier » le communique clairement.
- source_word: וְנָחַלְתָּ
  choice: et que tu prennes possession de
  rationale: Le verbe נחל peut signifier « hériter, recevoir ou prendre comme possession ». Dans ce contexte territorial, « prendre possession de » exprime clairement l’installation effective tout en signalant en note l’autre nuance possible.
- source_word: אֶת־הָאָרֶץ
  choice: du pays
  rationale: הָאָרֶץ désigne ici le territoire promis. « Le pays » est naturel en français et convient au contexte géographique.
theological_decisions:
- issue: Pronom objet collectif au singulier dans la promesse d’expulsion
  choice: Conserver le masculin singulier « le » et expliquer sa valeur collective en note.
  alternative: Employer le pluriel « les » pour expliciter les habitants ou les peuples visés.
  rationale: Le suffixe hébreu est grammaticalement masculin singulier, bien que son référent soit vraisemblablement collectif. Le maintien du singulier préserve l’ambiguïté formelle du texte sans imposer une résolution; la note en précise la portée probable.
- issue: Nuance de וְנָחַלְתָּ
  choice: « que tu prennes possession du pays »
  alternative: « que tu hérites du pays »
  rationale: Les deux nuances appartiennent au champ sémantique de נחל. Le contexte met en avant l’occupation progressive du territoire, tandis qu’une note conserve explicitement la lecture « hériter ».
translation_notes:
  register: Français international moderne, simple et digne. La tournure « petit à petit » préserve la répétition hébraïque; « tu te multiplies » rend naturellement l’accroissement de la population. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
