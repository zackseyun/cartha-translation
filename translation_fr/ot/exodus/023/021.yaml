  text: הִשָּׁ֧מֶר מִ/פָּנָ֛י/ו וּ/שְׁמַ֥ע בְּ/קֹל֖/וֹ אַל תַּמֵּ֣ר בּ֑/וֹ כִּ֣י לֹ֤א יִשָּׂא֙ לְ/פִשְׁעֲ/כֶ֔ם כִּ֥י שְׁמִ֖/י בְּ/קִרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/021.yaml
  text: Be on your guard before him[a], and listen to his voice. Do not rebel against him, for he will not pardon your transgression, because my name is within him.
translation:
  language: fr
  text: Prends garde à lui et écoute sa voix. Ne te révolte pas contre lui, car il ne pardonnera pas votre transgression, puisque mon nom est en lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon nom est au-dedans de lui »; de façon plus interprétative, « il porte mon nom ». Cette expression peut évoquer une autorité divine déléguée, mais le verset ne définit pas explicitement la nature exacte du messager.
    reason: alternative lexicale et préservation d’une ambiguïté théologique
lexical_decisions:
- source_word: הִשָּׁמֶר מִפָּנָיו
  choice: Tiens-toi sur tes gardes en sa présence
  rationale: L’impératif niphal de שׁמר exprime une vigilance sérieuse. « Tiens-toi sur tes gardes » est naturel et ferme; « en sa présence » rend מִפָּנָיו sans suggérer principalement la peur de l’ange.
- source_word: וּשְׁמַע בְּקֹלוֹ
  choice: et écoute sa voix
  rationale: שׁמע avec בְּקוֹל implique souvent l’obéissance, mais cette formulation conserve l’image hébraïque et laisse le contexte communiquer l’idée d’obéir.
- source_word: אַל תַּמֵּר בּוֹ
  choice: Ne te révolte pas contre lui
  rationale: מרה désigne la rébellion ou l’insoumission envers une autorité. « Se révolter contre » préserve la gravité de l’avertissement.
- source_word: לֹא יִשָּׂא לְפִשְׁעֲכֶם
  choice: il ne pardonnera pas votre transgression
  rationale: נשא employé avec une faute peut signifier enlever ou pardonner celle-ci. « Pardonner » rend clairement l’expression idiomatique, tandis que le singulier collectif « transgression » suit l’hébreu.
- source_word: שְׁמִי בְּקִרְבּוֹ
  choice: mon nom est en lui
  rationale: בְּקִרְבּוֹ signifie littéralement « en son sein, en lui ». La formulation demeure proche du texte sans préciser de quelle manière le nom divin est en ce messager.
theological_decisions:
- issue: Nature du messager et portée de l’affirmation « mon nom est en lui »
  choice: Conserver l’affirmation sous une forme littérale sans définir la nature exacte du messager.
  alternative: Traduire de façon interprétative par « il porte mon nom » et le présenter comme le représentant pleinement autorisé de Dieu, ou y voir explicitement une manifestation de la présence divine.
  rationale: Le texte attribue au messager une autorité divine singulière, mais ce verset ne tranche pas explicitement entre représentation déléguée et manifestation plus directe de la présence de Dieu.
- issue: Alternance entre le singulier et le pluriel à la deuxième personne
  choice: Conserver « te » au singulier puis « votre » au pluriel.
  alternative: Uniformiser tout le verset au singulier ou au pluriel pour fluidifier le français.
  rationale: L’hébreu passe réellement du singulier dans les impératifs à la deuxième personne masculine du pluriel dans פִשְׁעֲכֶם. Maintenir ce changement préserve un trait potentiellement significatif du texte, même s’il est inhabituel en français.
translation_notes:
  register: Français international moderne, digne et direct. Le passage inhabituel du singulier (« te ») au pluriel (« votre ») est volontairement conservé d’après l’hébreu. Le marqueur de note est placé immédiatement après la proposition qu’il explique.
