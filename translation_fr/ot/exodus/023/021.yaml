    issue: Rendu de מִפָּנָיו
    rationale: « Tiens-toi sur tes gardes en sa présence » rend surtout une situation spatiale (« en présence de »). Dans la construction הִשָּׁמֶר מִפְּנֵי, le sens d’avertissement dirigé vers la personne est mieux exprimé par « Prends garde à lui ».
  - severity: low
    issue: Formulation affirmative de la note sur l’autorité déléguée
    rationale: Le texte attribue une autorité exceptionnelle au messager, mais ne définit pas explicitement le mécanisme ni sa nature. « Peut évoquer » préserve mieux cette réserve.
