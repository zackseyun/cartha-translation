base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/033.yaml
  text: They must not dwell in your land[a], lest they cause you to sin against me; for if you serve their gods[c][b], it will surely become a snare to you.
translation:
  language: fr
  text: Ils ne doivent pas habiter dans ton pays, de peur qu’ils ne te fassent pécher contre moi ; car si tu sers leurs dieux[a], cela deviendra pour toi un piège[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car tu servirais leurs dieux » ; la conjonction hébraïque peut introduire une explication, et la proposition peut décrire l’issue probable plutôt qu’une simple condition.'
    reason: alternative_reading
  - marker: b
    text: Le mot hébreu traduit par « piège » désigne un dispositif servant à capturer et, au sens figuré, quelque chose qui conduit à la faute ou à la ruine.
    reason: cultural_note
lexical_decisions:
- source_word: יֵשְׁבוּ בְּאַרְצְךָ
  choice: habiter dans ton pays
  rationale: Le verbe ישׁב désigne ici le fait de résider durablement, et אֶרֶץ le territoire placé sous l’autorité d’Israël. « Habiter dans ton pays » est naturel en français moderne sans préciser excessivement l’idée d’établissement.
- source_word: פֶּן יַחֲטִיאוּ אֹתְךָ לִי
  choice: de peur qu’ils ne te fassent pécher contre moi
  rationale: פֶּן introduit une conséquence redoutée. Le hiphil de חטא a une valeur causative, tandis que לִי indique ici que le péché est dirigé contre Dieu.
- source_word: תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: si tu sers leurs dieux
  rationale: עבד appliqué à des dieux exprime le service cultuel et l’allégeance. « Servir » conserve ce langage d’alliance. La formulation conditionnelle est naturelle, mais l’hébreu permet aussi de comprendre la proposition comme l’issue probable expliquant l’interdiction.
- source_word: יִהְיֶה לְךָ לְמוֹקֵשׁ
  choice: cela deviendra pour toi un piège
  rationale: מוֹקֵשׁ désigne un piège ou un collet et s’emploie métaphoriquement pour ce qui entraîne quelqu’un dans la faute ou la ruine. « Piège » préserve clairement cette image en français courant.
theological_decisions:
- issue: Nature du péché visé
  choice: La mise en garde concerne explicitement l’infidélité envers Dieu manifestée par le service des dieux étrangers.
  alternative: Une mise en garde générale contre la corruption morale due à des voisins étrangers.
  rationale: La proposition « si tu sers leurs dieux » précise le péché envisagé. Le texte ne doit donc pas être généralisé en affirmation ethnique ou en simple avertissement contre toute influence culturelle.
- issue: Valeur du second כִּי
  choice: 'Le comprendre conditionnellement : « car si tu sers leurs dieux ».'
  alternative: 'Le comprendre comme explicatif ou comme annonçant une conséquence probable : « car tu servirais leurs dieux ».'
  rationale: La syntaxe hébraïque autorise les deux nuances. Le conditionnel donne en français une mise en garde cohérente, tandis qu’une note conserve l’autre lecture sans trancher une ambiguïté réelle.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reflète les formes hébraïques adressées collectivement à Israël. La tournure « de peur que… ne » conserve la force préventive de פֶּן sans employer un registre archaïque.
