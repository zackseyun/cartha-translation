  text: שָׁלֹ֥שׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה יֵרָאֶה֙ כָּל זְכ֣וּרְ/ךָ֔ אֶל פְּנֵ֖י הָ/אָדֹ֥ן יְהוָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/017.yaml
  text: Three times in the year every male among you shall appear before the Lord Yahweh[a].
translation:
  language: fr
  text: Trois fois par an, tous les hommes parmi vous se présenteront devant le Seigneur Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: Trois fois par an
  rationale: Cette formulation française naturelle exprime fidèlement la fréquence dans le cycle annuel.
- source_word: יֵרָאֶה
  choice: se présentera
  rationale: Dans ce contexte cultuel, le niphal de ראה signifie paraître ou venir en présence d’un supérieur. « Se présentera devant » rend clairement cet emploi idiomatique.
- source_word: כָּל זְכוּרְךָ
  choice: tout homme parmi vous
  rationale: Le terme désigne explicitement les personnes de sexe masculin. « Tout homme parmi vous » conserve cette précision tout en restant naturel en français moderne.
- source_word: אֶל פְּנֵי
  choice: devant
  rationale: La locution hébraïque signifie venir en présence de quelqu’un ; « devant » est ici concis et idiomatique.
- source_word: הָאָדֹן
  choice: le Seigneur
  rationale: אָדוֹן est ici un titre divin ; « le Seigneur » en est l’équivalent français courant et digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu, au lieu de le remplacer par un titre.
theological_decisions:
- issue: Rendu de la combinaison הָאָדֹן יְהוָה
  choice: le Seigneur Yahweh
  alternative: le Souverain Yahweh
  rationale: Le texte associe un titre, הָאָדֹן, au nom divin, יְהוָה. La traduction conserve distinctement les deux éléments sans substituer un second titre au nom propre.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est légèrement idiomatique (« par an », « se présentera ») tout en préservant la portée masculine explicite et la combinaison du titre divin avec le nom Yahweh.
