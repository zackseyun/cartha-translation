  text: וּ/בְ/כֹ֛ל אֲשֶׁר אָמַ֥רְתִּי אֲלֵי/כֶ֖ם תִּשָּׁמֵ֑רוּ וְ/שֵׁ֨ם אֱלֹהִ֤ים אֲחֵרִים֙ לֹ֣א תַזְכִּ֔ירוּ לֹ֥א יִשָּׁמַ֖ע עַל פִּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/013.yaml
  text: In all that I have said to you[a], be careful[b]; and the name of other gods you shall not mention—it shall not be heard on your lips.
translation:
  language: fr
  text: Veillez à respecter tout ce que je vous ai dit. Vous ne mentionnerez pas le nom d’autres dieux[a] ; qu’on ne l’entende pas sur vos lèvres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, dans un sens plus précis : « Vous n’invoquerez pas le nom d’autres dieux. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il ne sera pas entendu sur ta bouche ».'
    reason: literal_rendering
lexical_decisions:
- source_word: וּבְכֹל אֲשֶׁר אָמַרְתִּי אֲלֵיכֶם
  choice: tout ce que je vous ai dit
  rationale: Cette formulation renvoie naturellement à l’ensemble des prescriptions précédentes et conserve la portée globale de בְכֹל.
- source_word: תִּשָּׁמֵרוּ
  choice: Veillez à respecter
  rationale: Le niphal de שׁמר appelle ici les destinataires à se tenir sur leurs gardes quant aux commandements reçus. Cette tournure française exprime clairement l’attention active et l’obéissance visées, sans employer l’archaïque « prenez garde ».
- source_word: וְשֵׁם אֱלֹהִים אֲחֵרִים
  choice: le nom d’autres dieux
  rationale: La traduction directe maintient le singulier collectif « le nom » suivi du pluriel « d’autres dieux », sans tirer de conclusion sur leur statut ontologique.
- source_word: לֹא תַזְכִּירוּ
  choice: Vous ne mentionnerez pas
  rationale: Le hiphil de זכר peut signifier faire mention de quelqu’un ou l’invoquer. « Mentionner » conserve ici l’étendue sémantique la plus large; le sens plus précis « invoquer » est signalé en note.
- source_word: לֹא יִשָּׁמַע
  choice: qu’on ne l’entende pas
  rationale: Cette formulation rend naturellement en français la prohibition exprimée par le niphal à l’inaccompli et reprend « le nom » au moyen du pronom « l’ ».
- source_word: עַל פִּיךָ
  choice: sur vos lèvres
  rationale: L’hébreu dit littéralement « sur ta bouche ». « Sur vos lèvres » conserve l’image de la parole tout en étant idiomatique en français; le vouvoiement collectif s’accorde avec les formes plurielles du reste du verset.
theological_decisions:
- issue: Portée de l’interdiction concernant le nom d’autres dieux
  choice: Interdire d’en mentionner le nom, tout en signalant en note le sens possible « invoquer »
  alternative: Traduire directement « vous n’invoquerez pas le nom d’autres dieux »
  rationale: Le verbe hébreu peut viser la simple mention ou, dans ce contexte religieux et juridique, l’invocation. Le texte principal retient le sens le moins restrictif afin de ne pas trancher une ambiguïté réelle ni d’élargir le verset en affirmation doctrinale sur l’existence de ces dieux.
translation_notes:
  register: Français international moderne, digne et direct. Le futur à valeur d’ordre (« vous ne mentionnerez pas ») convient au registre juridique du passage. Le passage du pluriel hébreu dans la première partie au singulier collectif de « ta bouche » est rendu uniformément par « vous/vos » pour une lecture française naturelle.
