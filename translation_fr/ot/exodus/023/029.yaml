base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/029.yaml
  text: I will not drive them out from before you in one year[b][a], lest the land become desolate and the wild animals of the field become too numerous against you.
translation:
  language: fr
  text: Je ne les chasserai pas devant toi en une seule année[a], de peur que le pays ne devienne désert et que les bêtes sauvages des champs ne deviennent trop nombreuses contre toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en une année » ; on peut aussi traduire : « en un an » ou « en une seule année ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les animaux sauvages des champs ne se multiplient contre toi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגָרְשֶׁנּוּ
  choice: je ne les chasserai pas
  rationale: Le verbe גרש signifie « chasser, expulser ». Le suffixe objet est grammaticalement singulier, mais il renvoie collectivement aux habitants mentionnés dans le contexte ; le pluriel français rend ce référent sans obscurité.
- source_word: מִפָּנֶיךָ
  choice: devant toi
  rationale: Cette tournure conserve le sens spatial de l’expression hébraïque tout en étant naturelle en français.
- source_word: בְּשָׁנָה אֶחָת
  choice: en une seule année
  rationale: La formulation exprime clairement que l’expulsion ne sera pas accomplie au cours d’une unique année.
- source_word: פֶּן
  choice: de peur que
  rationale: פן introduit ici une conséquence redoutée que l’action progressive doit éviter.
- source_word: תִּהְיֶה הָאָרֶץ שְׁמָמָה
  choice: le pays ne devienne désert
  rationale: שְׁמָמָה décrit un territoire dépeuplé ou désolé ; « devienne désert » est idiomatique et conserve le changement d’état.
- source_word: וְרַבָּה
  choice: ne se multiplient
  rationale: רבה signifie devenir nombreux ou se multiplier. Le contexte suffit à communiquer le caractère nuisible de cet accroissement.
- source_word: עָלֶיךָ
  choice: à tes dépens
  rationale: 'L’expression rend la portée adverse de על : la multiplication des animaux causerait du tort au destinataire, sans suggérer nécessairement une attaque directe.'
- source_word: חַיַּת הַשָּׂדֶה
  choice: les animaux sauvages
  rationale: Le syntagme désigne la faune terrestre non domestiquée ; cette expression est claire et actuelle en français.
theological_decisions:
- issue: Nombre grammatical de l’objet d’אֲגָרְשֶׁנּוּ
  choice: 'Pluriel dans le texte : « les »'
  alternative: 'Singulier formel : « le »'
  rationale: Le suffixe hébreu est singulier, mais son référent contextuel est collectif. Le français exige un référent plus explicite ; le pluriel évite de faire croire qu’un seul individu est visé tout en signalant la forme hébraïque en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la progression logique de l’hébreu et son avertissement, tout en évitant les calques peu naturels. Les deux appels de note [a] et [b] figurent dans le texte.
