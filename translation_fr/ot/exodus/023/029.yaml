- from: Je ne les chasserai pas devant toi en une seule année[a], de peur que le pays ne devienne désert et que les animaux sauvages ne se multiplient à tes dépens[b].
  to: Je ne les chasserai pas devant toi en une seule année[a], de peur que le pays ne devienne désert et que les bêtes sauvages des champs ne deviennent trop nombreuses contre toi[b].
  rationale: La révision conserve le pluriel contextuel de l’objet (« les »), tout en rétablissant « des champs » et en remplaçant l’expression plus interprétative « à tes dépens » par « contre toi », plus proche de l’hébreu. La note b est ajustée afin que son alternative corresponde au texte révisé et demeure grammaticalement complète.
