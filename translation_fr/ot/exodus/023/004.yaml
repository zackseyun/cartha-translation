revisions:
- from: Si tu rencontres le bœuf de ton ennemi ou son âne qui s’est égaré[a], tu ne manqueras pas de le lui ramener.
  to: Si tu rencontres le bœuf de ton ennemi ou son âne, s’il s’est égaré[a], tu le lui ramèneras sans faute.
  rationale: La révision évite que la qualification « s’est égaré » ne soit comprise comme ne concernant que l’âne, tout en gardant le caractère conditionnel et l’ambiguïté aspectuelle du participe. Elle renforce également, en français naturel, l’obligation emphatique exprimée par הָשֵׁב תְּשִׁיבֶנּוּ.
