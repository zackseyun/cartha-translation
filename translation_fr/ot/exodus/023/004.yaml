review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : la condition, l’« ennemi », les deux animaux possibles et l’obligation de restitution sont conservés. Toutefois, dans « son âne qui s’est égaré », la relative se rattache naturellement au seul âne en français, alors que le participe hébreu décrit l’animal rencontré dans l’alternative bœuf/âne. La formulation révisée rend cette portée sans prétendre préciser davantage l’aspect du participe.'
  naturalness: Le français du projet est globalement naturel et de registre approprié. « Tu le lui ramèneras sans faute » est une formulation claire, ferme et idiomatique pour la construction intensive hébraïque, plus directement prescriptive que « tu ne manqueras pas de le lui ramener ».
  terminology: « Bœuf », « âne » et « ennemi » sont exacts et conviennent au français international moderne. Le tutoiement singulier correspond à l’adresse juridique hébraïque.
  issues:
  - severity: medium
    issue: Portée de « qui s’est égaré »
    rationale: Placée après « son âne », la relative française qualifie normalement seulement l’âne. Le participe תֹּעֶה caractérise l’animal visé dans l’alternative « bœuf … ou âne »; il convient donc d’employer une tournure dont la portée couvre explicitement l’un ou l’autre.
  - severity: low
    issue: Rendu de l’insistance verbale
    rationale: « Tu ne manqueras pas de » peut exprimer une forte attente, mais sa valeur est légèrement moins directement normative. « Tu le lui ramèneras sans faute » rend plus nettement à la fois l’obligation et l’emphase de l’infinitif absolu suivi du verbe fini.
  revised_text: Si tu rencontres le bœuf de ton ennemi ou son âne, s’il s’est égaré[a], tu le lui ramèneras sans faute.
