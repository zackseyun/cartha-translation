  text: כִּ֣י תִפְגַּ֞ע שׁ֧וֹר אֹֽיִבְ/ךָ֛ א֥וֹ חֲמֹר֖/וֹ תֹּעֶ֑ה הָשֵׁ֥ב תְּשִׁיבֶ֖/נּוּ לֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/004.yaml
  text: If you come upon your enemy’s ox or his donkey going astray[a], you must surely return it to him.
translation:
  language: fr
  text: Si tu rencontres le bœuf de ton ennemi ou son âne, s’il s’est égaré[a], tu le lui ramèneras sans faute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quand tu rencontres le bœuf de ton ennemi ou son âne qui erre. »'
    reason: 'Alternative lexicale et syntaxique : כִּי peut se rendre par « quand », et le participe תֹּעֶה peut décrire l’animal comme étant en train d’errer.'
lexical_decisions:
- source_word: כִּי
  choice: Si
  rationale: Dans ce texte juridique, כִּי introduit le cas auquel s’applique la prescription. « Si » rend clairement cette structure conditionnelle, tandis que « quand » demeure possible.
- source_word: תִפְגַּע
  choice: tu rencontres
  rationale: Le verbe פגע désigne ici le fait de tomber sur quelque chose ou de le rencontrer. « Tu rencontres » est naturel en français et n’implique pas une recherche intentionnelle.
- source_word: שׁוֹר
  choice: le bœuf
  rationale: שׁוֹר désigne couramment un bovin, notamment dans le cadre agricole. « Bœuf » est le terme traditionnel, précis et compréhensible dans ce contexte juridique.
- source_word: אֹיִבְךָ
  choice: de ton ennemi
  rationale: Le texte dit explicitement « ton ennemi ». Cette formulation directe conserve la tension éthique du commandement sans neutraliser la relation.
- source_word: חֲמֹרוֹ
  choice: son âne
  rationale: חֲמוֹר est le terme ordinaire pour l’âne. Le possessif renvoie naturellement à l’ennemi déjà mentionné.
- source_word: תֹּעֶה
  choice: qui s’est égaré
  rationale: Le participe de תעה décrit l’animal qui s’écarte de son chemin ou erre loin de son lieu normal. « Qui s’est égaré » exprime naturellement en français l’état constaté, sans affirmer qu’il est définitivement perdu.
- source_word: הָשֵׁב תְּשִׁיבֶנּוּ
  choice: tu ne manqueras pas de le ramener
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’obligation. « Tu ne manqueras pas de » restitue cette insistance avec une tournure française naturelle et ferme.
- source_word: לוֹ
  choice: lui
  rationale: Le pronom renvoie directement à l’ennemi propriétaire de l’animal. « Le lui ramener » conserve ce renvoi sans ajouter l’explicitation interprétative « à son propriétaire ».
theological_decisions:
- issue: La conduite exigée envers un ennemi
  choice: Conserver explicitement « ton ennemi » et l’obligation catégorique de lui ramener son animal.
  alternative: Employer un terme relationnel moins conflictuel, tel que « ton prochain », ou reformuler « celui qui te déteste ».
  rationale: 'L’hébreu emploie אֹיֵב, « ennemi ». La traduction préserve ainsi la portée morale frappante du texte : la justice pratique exigée ne cesse pas devant l’hostilité personnelle.'
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier reflète l’adresse juridique hébraïque à la deuxième personne du singulier. La formulation évite les archaïsmes tout en conservant la solennité et l’insistance du commandement.
