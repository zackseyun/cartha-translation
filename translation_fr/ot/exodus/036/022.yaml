  text: Two tenons for each board[a], joined one to another[b]; thus he made all the boards of the tabernacle.
translation:
  language: fr
  text: Deux tenons à chaque planche[a], ajustés l’un à l’autre[b] ; il fit ainsi toutes les planches du tabernacle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mains » ; le mot hébreu désigne ici, par image, les parties saillantes de chaque planche.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’un en face de l’autre ». L’expression hébraïque souligne la correspondance entre les deux tenons, sans en préciser entièrement la disposition.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי יָדֹת
  choice: deux tenons
  rationale: יָדֹת signifie littéralement « mains », mais désigne ici, par métaphore, les parties saillantes servant à l’assemblage. « Tenons » est le terme technique français précis dans ce contexte de menuiserie.
- source_word: קֶּרֶשׁ
  choice: planche
  rationale: Désigne chacune des pièces de bois structurelles du tabernacle. « Planche » est naturel, courant et cohérent avec le contexte de construction.
- source_word: מְשֻׁלָּבֹת
  choice: disposés
  rationale: Le participe décrit la correspondance ou l’ajustement des deux tenons. « Disposés » s’associe naturellement à « l’un en face de l’autre » sans suggérer à tort qu’ils sont joints entre eux.
- source_word: אַחַת אֶל אֶחָת
  choice: l’un en face de l’autre
  rationale: L’expression indique vraisemblablement une disposition correspondante ou parallèle des deux tenons. Le masculin français s’accorde avec « tenons », tandis que l’hébreu emploie le féminin en accord avec יָדֹת.
- source_word: כֵּן עָשָׂה
  choice: il fit de même
  rationale: 'Rend idiomatiquement l’idée de conformité : la même fabrication fut appliquée à toutes les planches.'
- source_word: מִּשְׁכָּן
  choice: tabernacle
  rationale: Terme français traditionnel et précis pour la structure cultuelle mobile décrite dans l’Exode.
