  text: And he made two boards for the corners of the tabernacle at the rear[a].
translation:
  language: fr
  text: Il fit aussi deux planches pour les angles du tabernacle, aux deux extrémités arrière[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme pièces d’angle du tabernacle, aux deux extrémités arrière ». Les termes hébreux décrivent les extrémités ou les angles arrière de la structure et peuvent mettre l’accent soit sur leur emplacement, soit sur les planches spécialement assemblées pour former les angles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁנֵי
  choice: aussi deux
  rationale: La conjonction coordonne cet élément aux précédents; « aussi » rend naturellement la continuité de l’énumération en français, tandis que « deux » conserve explicitement le nombre.
- source_word: קְרָשִׁים
  choice: planches
  rationale: Dans le contexte de la construction du tabernacle, le terme désigne les éléments de bois verticaux de la structure. « Planches » est clair, courant et cohérent avec cette description architecturale.
- source_word: עָשָׂה
  choice: il fit
  rationale: Le verbe עשה signifie simplement « faire ». « Il fit » convient au registre narratif digne et concis de ce passage.
- source_word: לִ/מְקֻצְעֹת
  choice: pour les angles
  rationale: Le terme peut désigner les emplacements d’angle ou les pièces formant leur assemblage. « Pour les angles » exprime clairement la fonction sans trancher excessivement entre ces nuances.
- source_word: הַ/מִּשְׁכָּן
  choice: du tabernacle
  rationale: « Tabernacle » est le terme français traditionnel et précis pour la demeure cultuelle mobile décrite dans l’Exode.
- source_word: בַּ/יַּרְכָתָיִם
  choice: à l’arrière
  rationale: La forme duelle renvoie aux deux extrémités ou côtés du fond. Dans ce contexte, « à l’arrière » est naturel et évite la répétition maladroite d’« angles », tandis que la note conserve la nuance du duel.
