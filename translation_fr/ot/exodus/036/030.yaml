base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/030.yaml
  text: 'There were eight frames[a], with their silver bases, sixteen bases: two bases under one frame[b], and two bases under each frame.'
translation:
  language: fr
  text: 'Il y avait huit cadres[a] et leurs socles[b] d’argent, soit seize socles : deux socles sous chaque cadre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « planches »; le terme hébreu désigne les éléments structuraux verticaux du tabernacle.
    reason: lexical_alternative
  - marker: b
    text: Ou « bases ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: Il y avait
  rationale: La tournure existentielle française convient naturellement à cet inventaire descriptif; la conjonction initiale est intégrée au fil du récit.
- source_word: קְרָשִׁים / הַקֶּרֶשׁ
  choice: cadres
  rationale: Dans le contexte du tabernacle, le terme désigne les éléments structuraux verticaux. « Cadres » en exprime la fonction tout en laissant en note l’alternative concrète « planches ».
- source_word: אַדְנֵיהֶם / אֲדָנִים
  choice: socles
  rationale: Le terme désigne les supports métalliques placés sous les éléments verticaux. « Socles » est clair et naturel en français moderne; « bases » reste possible.
- source_word: כֶּסֶף
  choice: d’argent
  rationale: Désignation directe du matériau dont les socles étaient faits.
- source_word: שִׁשָּׁה עָשָׂר
  choice: seize
  rationale: Rendu cardinal direct.
- source_word: שְׁנֵי אֲדָנִים שְׁנֵי אֲדָנִים תַּחַת הַקֶּרֶשׁ הָאֶחָד
  choice: deux socles sous chaque cadre
  rationale: 'La répétition hébraïque a ici une valeur distributive : chacun des huit cadres repose sur deux socles. Le français exprime ce sens sans reproduire une répétition peu naturelle.'
