translation_notes:
  register: Français international moderne, naturel et digne. « Artisans qualifiés » met en valeur le savoir-faire pratique propre au contexte; le passé simple maintient un registre narratif biblique lisible. La note conserve la particularité du passage du distributif singulier au pluriel dans l’hébreu.
