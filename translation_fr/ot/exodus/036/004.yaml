  text: Then all the skilled men who were doing all the work of the sanctuary came[a], each from the work that he was doing,
translation:
  language: fr
  text: Alors tous les artisans qualifiés qui exécutaient tous les travaux du sanctuaire vinrent, chacun quittant le travail qu’il était en train de faire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « homme, homme, depuis son travail qu’ils faisaient ». La répétition de « homme » a une valeur distributive : chacun vint en quittant le travail qu’il était en train de faire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: vinrent
  rationale: Le wayyiqtol de בוא fait avancer le récit; le passé simple convient au registre narratif français et exprime simplement leur venue.
- source_word: כָּל הַחֲכָמִים
  choice: tous les artisans qualifiés
  rationale: Dans le contexte de la construction du sanctuaire, חֲכָמִים désigne des personnes possédant un savoir-faire pratique. « Artisans qualifiés » rend naturellement cette compétence sans réduire le terme à la sagesse intellectuelle.
- source_word: הָעֹשִׂים
  choice: qui exécutaient
  rationale: Le participe indique une activité en cours; « exécutaient » s’accorde idiomatiquement avec « travaux » et garde la valeur durative.
- source_word: אֵת כָּל מְלֶאכֶת הַקֹּדֶשׁ
  choice: tous les travaux du sanctuaire
  rationale: מְלֶאכֶת désigne ici l’ensemble des ouvrages à réaliser, tandis que הַקֹּדֶשׁ renvoie au sanctuaire dans ce contexte. Le pluriel français « travaux » est naturel.
- source_word: אִישׁ אִישׁ
  choice: chacun
  rationale: 'La répétition a une valeur distributive: chaque artisan individuellement.'
- source_word: מִמְּלַאכְתּוֹ
  choice: quittant le travail
  rationale: La préposition מִן exprime le mouvement depuis l’ouvrage auquel chacun était occupé. « Quittant » explicite naturellement ce déplacement sans en modifier le sens.
- source_word: אֲשֶׁר הֵמָּה עֹשִׂים
  choice: qu’il était en train de faire
  rationale: Malgré le pronom pluriel hébreu, la construction distributive אִישׁ אִישׁ appelle en français une reprise au singulier. « Était en train de faire » rend clairement l’activité en cours.
