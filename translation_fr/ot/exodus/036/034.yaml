  text: וְֽ/אֶת הַ/קְּרָשִׁ֞ים צִפָּ֣ה זָהָ֗ב וְ/אֶת טַבְּעֹתָ/ם֙ עָשָׂ֣ה זָהָ֔ב בָּתִּ֖ים לַ/בְּרִיחִ֑ם וַ/יְצַ֥ף אֶת הַ/בְּרִיחִ֖ם זָהָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/034.yaml
  text: He overlaid the frames with gold[a], and made their rings of gold as holders for the bars[b], and overlaid the bars with gold.
translation:
  language: fr
  text: Il revêtit d’or les planches[a], fit leurs anneaux en or pour servir de logements aux traverses[b], et revêtit d’or les traverses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les cadres ». Le terme hébreu désigne les éléments verticaux en bois de la structure du tabernacle.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « des maisons pour les traverses », expression qui désigne les supports ou logements destinés à les recevoir.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: les cadres
  rationale: Dans le contexte du tabernacle, le terme désigne les éléments verticaux en bois de la structure. « Cadres » exprime leur fonction architecturale, tandis que « planches » reste une possibilité.
- source_word: צִפָּה / וַיְצַף
  choice: couvrit d’or
  rationale: Le verbe désigne l’application d’une couche de matériau sur un objet. « Couvrir d’or » est naturel en français et convient aux deux occurrences.
- source_word: זָהָב
  choice: or
  rationale: Terme matériel direct. Les trois occurrences de l’hébreu sont conservées afin de respecter la répétition du texte source.
- source_word: טַבְּעֹתָם
  choice: leurs anneaux
  rationale: טַבַּעַת signifie couramment « anneau »; le suffixe masculin pluriel est rendu par « leurs ».
- source_word: עָשָׂה
  choice: fit
  rationale: Équivalent français courant et concis du verbe « faire, fabriquer » dans ce contexte.
- source_word: בָּתִּים
  choice: supports
  rationale: Littéralement « maisons », le mot désigne ici les pièces qui reçoivent ou maintiennent les traverses. « Supports » restitue clairement cette fonction sans imposer une forme technique incertaine.
- source_word: לַבְּרִיחִם
  choice: aux traverses
  rationale: Les בְּרִיחִים sont les barres horizontales qui relient les éléments verticaux. « Traverses » est précis et idiomatique en français architectural.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la répétition de « or » et le parallélisme des actions, tout en rendant l’expression idiomatique בָּתִּים לַבְּרִיחִם de manière compréhensible.
