  text: וַ/יַּ֨עַשׂ֙ יְרִיעֹ֣ת עִזִּ֔ים לְ/אֹ֖הֶל עַל הַ/מִּשְׁכָּ֑ן עַשְׁתֵּֽי עֶשְׂרֵ֥ה יְרִיעֹ֖ת עָשָׂ֥ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/014.yaml
  text: He made curtains of goats’ hair for a tent over the tabernacle[a]; he made eleven curtains.
translation:
  language: fr
  text: Il fit des tentures en poil de chèvre pour former une tente au-dessus du tabernacle[a] ; il fit onze tentures.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « des tentures de chèvre » si la matière reste implicite ; le contexte des textiles du tabernacle favorise « en poil de chèvre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשָׂה
  choice: il fit
  rationale: Le verbe עשה signifie couramment « faire ». La répétition de « il fit » conserve l’insistance et la structure du texte hébreu.
- source_word: יְרִיעֹת
  choice: tentures
  rationale: Dans le contexte du tabernacle, יְרִיעָה désigne de grandes pièces textiles servant de couverture. « Tentures » est naturel et suffisamment précis en français.
- source_word: עִזִּים
  choice: en poil de chèvre
  rationale: Le nom signifie littéralement « chèvres », mais, dans ce contexte textile, il désigne très probablement la matière tirée de leur poil plutôt que des peaux.
- source_word: לְאֹהֶל
  choice: pour former une tente
  rationale: Le préfixe ל exprime ici la fonction ou le résultat. Cette formulation indique clairement que les tentures constituent la tente de couverture, sans les confondre avec le tabernacle situé dessous.
- source_word: עַל
  choice: au-dessus de
  rationale: עַל indique la position de cette couverture par rapport au tabernacle.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: מִשְׁכָּן est ici le terme technique désignant la demeure-sanctuaire. « Tabernacle » maintient la distinction avec la tente qui le recouvre.
- source_word: עַשְׁתֵּי עֶשְׂרֵה
  choice: onze
  rationale: Le nombre hébreu signifie directement « onze ».
- source_word: אֹתָם
  choice: intégré à « onze tentures »
  rationale: Le pronom objet renvoie aux tentures. Son sens est rendu naturellement par le complément direct « onze tentures », sans pronom français supplémentaire.
