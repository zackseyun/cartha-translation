  yaml_path: translation/ot/exodus/036/007.yaml
  text: And the material was sufficient for all the work to do it[a], and there was more than enough.
translation:
  language: fr
  text: Les matériaux suffisaient pour tous les travaux à réaliser, et il y en avait en surplus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et il en restait ». Le verbe hébreu peut souligner soit ce qui restait, soit l’abondance excédant les besoins.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּלָאכָה
  choice: Les matériaux
  rationale: מְלָאכָה désigne habituellement le travail ou l’ouvrage, mais le contexte immédiat parle de ce que le peuple avait apporté pour la construction. Le français « matériaux » explicite naturellement ce référent sans confondre les matériaux avec les travaux à réaliser.
- source_word: הָיְתָה דַיָּם
  choice: suffisaient
  rationale: דַּי exprime la suffisance, et le suffixe renvoie à ce qui avait été apporté. Le verbe français « suffire » rend sobrement l’ensemble de la tournure hébraïque.
- source_word: לְכָל הַמְּלָאכָה
  choice: pour réaliser tous les travaux
  rationale: Dans cette seconde occurrence, מְלָאכָה désigne clairement l’ensemble du travail demandé. Le pluriel « travaux » convient au contexte de la construction du sanctuaire, tandis que « réaliser » intègre naturellement לַעֲשׂוֹת אֹתָהּ.
- source_word: וְהוֹתֵר
  choice: et il en restait même
  rationale: Le hifil de יתר indique qu’il subsistait un surplus au-delà de ce qui était nécessaire. Cette formulation française exprime directement qu’une quantité restait disponible.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition hébraïque de מְלָאכָה reçoit deux rendus contextuels distincts (« matériaux » puis « travaux ») afin d’éviter une formulation obscure, tout en conservant le contraste entre les ressources apportées et l’ouvrage à accomplir.
