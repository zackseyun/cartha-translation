source:
  edition: WLC
  text: וְ/עָשָׂה֩ בְצַלְאֵ֨ל וְ/אָהֳלִיאָ֜ב וְ/כֹ֣ל אִ֣ישׁ חֲכַם לֵ֗ב אֲשֶׁר֩ נָתַ֨ן יְהוָ֜ה חָכְמָ֤ה וּ/תְבוּנָה֙ בָּ/הֵ֔מָּה לָ/דַ֣עַת לַ/עֲשֹׂ֔ת אֶֽת כָּל מְלֶ֖אכֶת עֲבֹדַ֣ת הַ/קֹּ֑דֶשׁ לְ/כֹ֥ל אֲשֶׁר צִוָּ֖ה יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/001.yaml
  text: And Bezalel and Oholiab[a], and every skillful man in whom Yahweh has put wisdom and understanding to know how to do all the work for the service of the sanctuary[c][b], shall do according to all that Yahweh has commanded.
translation:
  language: fr
  text: Betsalel, Oholiab et tout homme habile[a] à qui Yahweh a donné sagesse et intelligence[b] pour savoir exécuter tous les travaux destinés au service du sanctuaire[c] agiront conformément à tout ce que Yahweh a ordonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tout homme sage de cœur » ; dans ce contexte, l’expression désigne un artisan compétent.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « en eux Yahweh a mis sagesse et intelligence », expression collective qui renvoie à Betsalel, Oholiab et à tout homme habile.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « tout le travail du service du sanctuaire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: agiront
  rationale: Le parfait qal coordonné poursuit ici l’instruction avec une valeur prospective. Le pluriel français s’accorde naturellement avec le sujet composé Betsalel, Oholiab et tout homme habile.
- source_word: בְצַלְאֵל וְאָהֳלִיאָב
  choice: Betsalel, Oholiab
  rationale: Translittération française usuelle des deux noms propres hébreux.
- source_word: וְכֹל אִישׁ חֲכַם לֵב
  choice: et tout homme habile
  rationale: L’expression signifie littéralement « tout homme sage de cœur ». Dans ce contexte artisanal, elle désigne une compétence pratique ; « habile » communique naturellement ce sens tout en conservant le masculin explicite de אִישׁ.
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה וּתְבוּנָה בָהֵמָּה
  choice: à qui Yahweh a donné sagesse et intelligence
  rationale: « Donner » rend naturellement נתן. Le relatif singulier se comprend distributivement, tandis qu’une note signale le pluriel collectif littéral « en eux ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre.
- source_word: חָכְמָה וּתְבוּנָה
  choice: sagesse et intelligence
  rationale: Ce couple conserve les deux notions hébraïques, y compris la dimension de compétence artisanale que « sagesse » prend dans le contexte.
- source_word: לָדַעַת לַעֲשֹׂת
  choice: pour savoir exécuter
  rationale: Les infinitifs expriment ici une capacité pratique. « Savoir exécuter » est idiomatique en français et convient à l’ensemble des tâches.
- source_word: כָּל מְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: tous les travaux destinés au service du sanctuaire
  rationale: La formulation distingue le travail artisanal du service sacré et comprend הַקֹּדֶשׁ comme le lieu saint, le sanctuaire.
- source_word: לְכֹל אֲשֶׁר צִוָּה יְהוָה
  choice: conformément à tout ce que Yahweh a ordonné
  rationale: La préposition ל exprime ici la conformité à l’ensemble des ordres divins.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le Tétragramme ; sa transcription préserve le nom propre de l’alliance sans le remplacer par un titre.
- issue: Portée de אִישׁ חֲכַם לֵב
  choice: tout homme habile
  alternative: toute personne habile / tout homme sage de cœur
  rationale: « Homme » reflète אִישׁ, tandis que « habile » rend la sagesse pratique propre au contexte. La note conserve l’image hébraïque du cœur sans imposer une portée plus étroite ou plus large que le texte.
- issue: Sens de הַקֹּדֶשׁ
  choice: le sanctuaire
  alternative: le lieu saint / le service sacré
  rationale: Dans le contexte de la construction du tabernacle, le terme renvoie au domaine ou lieu consacré. « Sanctuaire » garde cette référence concrète.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve les notions distinctes de sagesse, d’intelligence, de travail et de service, tout en évitant une reproduction trop raide de la syntaxe hébraïque.
