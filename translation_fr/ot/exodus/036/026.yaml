- from: 'et leurs quarante bases en argent : deux bases sous le cadre unique[a], et deux bases sous le cadre unique.'
  to: 'et leurs quarante bases en argent : deux bases sous chaque cadre, et deux bases sous chaque cadre.'
  rationale: La révision remplace « le cadre unique », qui introduit un sens absent de l’hébreu, par « chaque cadre », qui rend sa valeur distributive. Elle conserve la répétition formelle des deux membres et maintient une note sur « planche » et sur le lissage idiomatique possible.
