  text: 'and their forty silver bases: two bases under the one frame[a], and two bases under the one frame.'
translation:
  language: fr
  text: 'et leurs quarante bases en argent : deux bases sous chaque cadre, et deux bases sous chaque cadre.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַרְבָּעִים
  choice: et… quarante
  rationale: La conjonction poursuit la liste des éléments construits, et le nombre est rendu directement.
- source_word: אַדְנֵי/הֶם
  choice: leurs bases
  rationale: Dans la construction du sanctuaire, אֲדָנִים désigne les supports dans lesquels reposent les éléments verticaux. « Bases » est clair et naturel en français moderne.
- source_word: כָּסֶף
  choice: en argent
  rationale: Le nom indique la matière des bases ; « en argent » est la formulation française habituelle.
- source_word: שְׁנֵי אֲדָנִים
  choice: deux bases
  rationale: Le syntagme répété est traduit de manière constante et directe.
- source_word: תַּחַת
  choice: sous
  rationale: La préposition exprime la position des bases sous chaque cadre.
- source_word: הַ/קֶּרֶשׁ
  choice: le cadre
  rationale: Dans ce contexte, קֶרֶשׁ désigne un élément vertical structurel du sanctuaire. « Cadre » communique sa fonction sans le réduire nécessairement à une simple planche.
- source_word: הָ/אֶחָד
  choice: unique
  rationale: L’hébreu porte littéralement « le un » et répète exactement l’expression dans les deux membres. « Le cadre unique » conserve cette répétition marquée, bien qu’un français plus idiomatique dirait normalement « un cadre… un autre cadre ».
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et architectural. La répétition inhabituelle de l’hébreu est conservée dans le texte principal plutôt que lissée silencieusement ; la note fournit l’alternative lexicale « planche » et la formulation idiomatique possible.
