review_pass:
  verdict: revise
  source_fidelity: 'La traduction de אַדָנִים par « bases » et de כֶּסֶף par « en argent » est fidèle au contexte architectural. En revanche, « unique » ne rend pas הָאֶחָד : ici, « le un » a une valeur distributive dans une formule répétée et ne qualifie pas le cadre comme étant unique.'
  naturalness: « Le cadre unique » est peu naturel en français et suggère à tort qu’il n’existe qu’un seul cadre. « Chaque cadre » exprime naturellement la valeur distributive de l’hébreu, tout en conservant la répétition des deux membres.
  terminology: « Bases », « argent » et « cadre » sont cohérents avec le contexte. « Cadre » reste un choix défendable pour קֶרֶשׁ, avec « planche » comme variante possible.
  issues:
  - severity: medium
    issue: « unique » traduit incorrectement הָאֶחָד.
    rationale: Le terme ne signifie pas « unique » dans ce contexte. La répétition « sous le cadre un ... sous le cadre un » fonctionne de manière distributive et désigne les cadres pris individuellement, non un cadre exclusif.
  - severity: low
    issue: La note présente « l’autre cadre » comme une possibilité idiomatique sans préciser que ce lissage ne reproduit pas la répétition du texte source.
    rationale: La note devrait distinguer clairement l’alternative française idiomatique de la répétition hébraïque et éviter de fonder le texte principal sur l’idée erronée de « cadre unique ».
  revised_text: 'et leurs quarante bases en argent : deux bases sous chaque cadre, et deux bases sous chaque cadre.'
  revised_footnotes:
  - marker: a
    text: Ou « deux bases sous chaque planche, et deux bases sous chaque planche ». L’hébreu répète littéralement l’expression « sous le cadre un » dans les deux propositions ; elle a ici une valeur distributive. En français, on pourrait aussi dire « deux bases sous un cadre, et deux bases sous un autre cadre ».
    reason: Alternative lexicale pour קֶרֶשׁ et clarification de la répétition distributive de l’hébreu.
  revision_rationale: La révision remplace « le cadre unique », qui introduit un sens absent de l’hébreu, par « chaque cadre », qui rend sa valeur distributive. Elle conserve la répétition formelle des deux membres et maintient une note sur « planche » et sur le lissage idiomatique possible.
