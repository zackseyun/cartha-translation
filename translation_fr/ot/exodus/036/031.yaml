  text: He made five bars of acacia wood for the frames of one side of the tabernacle[a].
translation:
  language: fr
  text: Il fit cinq traverses en bois d’acacia pour les cadres d’un côté du tabernacle[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « planches » au lieu de « cadres » pour désigner les éléments verticaux de la structure du tabernacle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol de עשה poursuit la séquence narrative. Le français peut rendre naturellement l’action au passé simple sans expliciter la conjonction.
- source_word: בְּרִיחֵי
  choice: traverses
  rationale: Dans ce contexte de construction, il s’agit de pièces horizontales servant à relier et maintenir les éléments verticaux; « traverses » est plus précis en français que « barres » et évite le sens trop étroit de « verrous ».
- source_word: עֲצֵי שִׁטִּים
  choice: en bois d’acacia
  rationale: La chaîne construite désigne le matériau provenant de l’acacia; cette formulation est courante et claire en français.
- source_word: חֲמִשָּׁה
  choice: cinq
  rationale: Nombre cardinal qualifiant les traverses.
- source_word: לְקַרְשֵׁי
  choice: pour les cadres de
  rationale: קֶרֶשׁ désigne ici les éléments verticaux structuraux du tabernacle. « Cadres » exprime leur fonction architecturale, tandis que « planches » demeure une possibilité lexicale signalée en note.
- source_word: צֶלַע
  choice: côtés
  rationale: Dans un contexte architectural, צֶלַע désigne un côté de la structure plutôt qu’une côte au sens anatomique.
- source_word: הַמִּשְׁכָּן
  choice: du tabernacle
  rationale: « Tabernacle » est le terme français établi pour la structure cultuelle mobile décrite dans l’Exode.
- source_word: הָאֶחָת
  choice: de l’un des
  rationale: Le féminin singulier se rapporte à צֶלַע et distingue un côté de l’autre sans imposer le sens ordinal « premier ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au récit suivi. « Traverses » et « cadres » rendent lisible la fonction architecturale des pièces, avec l’alternative traditionnelle « planches » conservée en note.
