id: EXO.36.32
reference: Exodus 36:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/חֲמִשָּׁ֣ה בְרִיחִ֔ם לְ/קַרְשֵׁ֥י צֶֽלַע הַ/מִּשְׁכָּ֖ן הַ/שֵּׁנִ֑ית וַ/חֲמִשָּׁ֤ה בְרִיחִם֙ לְ/קַרְשֵׁ֣י הַ/מִּשְׁכָּ֔ן לַ/יַּרְכָתַ֖יִם יָֽמָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/032.yaml
  text: and five bars for the boards of the second side of the tabernacle[b][a], and five bars for the boards of the tabernacle at the far rear on the west.
translation:
  language: fr
  text: et cinq traverses[a] pour les planches[b] du second côté du tabernacle, et cinq traverses pour les planches du tabernacle à l’extrémité arrière, du côté ouest[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « barres ».
    reason: lexical_alternative
  - marker: b
    text: Ou « cadres » ou « panneaux ».
    reason: lexical_alternative
  - marker: c
    text: Ou « pour le fond du tabernacle, vers l’ouest ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרִיחִם
  choice: traverses
  rationale: Dans ce contexte de construction, le terme désigne les pièces horizontales qui relient et maintiennent les éléments de la structure. « Traverses » est précis et naturel en français; « barres » reste possible.
- source_word: קַרְשֵׁי
  choice: planches
  rationale: Le mot désigne les éléments structurels en bois du tabernacle. « Planches » conserve le sens concret traditionnel sans imposer la reconstruction plus interprétative de « cadres ».
- source_word: צֶלַע הַמִּשְׁכָּן הַשֵּׁנִית
  choice: du second côté du tabernacle
  rationale: « Second » reproduit l’ordre explicite de l’hébreu, tandis que « côté » rend simplement la partie latérale sans préciser davantage la forme architecturale.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: Dans l’Exode, le terme est la désignation établie du sanctuaire transportable. « Tabernacle » identifie clairement ce référent dans le contexte biblique.
- source_word: לַיַּרְכָתַיִם
  choice: à l’extrémité arrière
  rationale: Cette formulation rend à la fois l’idée du fond ou de l’arrière et la nuance d’éloignement portée par le terme hébreu.
- source_word: יָמָּה
  choice: du côté ouest
  rationale: L’adverbe directionnel signifie ici « vers l’ouest »; dans cette description architecturale, « du côté ouest » est idiomatique et précis.
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: et cinq ... et cinq
  rationale: La répétition de « et cinq » respecte la coordination et le style d’inventaire de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le verset conserve la syntaxe d’inventaire et le « et » initial qui le rattache à la liste précédente. Les termes architecturaux restent concrets sans trancher au-delà de ce que permet l’hébreu.
