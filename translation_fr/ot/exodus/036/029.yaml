  text: They were paired at the bottom[a], and together they were complete up to its top, to the one ring. Thus he did for both of them[c][b], for the two corners.
translation:
  language: fr
  text: Elles étaient jumelées par le bas[a] et, ensemble, jointes jusqu’en haut, au même anneau[b]. Il fit ainsi pour les deux, aux deux angles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « appariées » ou « correspondantes par le bas » ; l’hébreu souligne que les deux éléments se correspondent structurellement.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « entières jusqu’à son sommet, à l’un anneau ». Le terme rendu par « jointes » peut aussi évoquer des éléments complets ou achevés ; le détail technique de leur assemblage au sommet demeure incertain.'
    reason: textual_ambiguity
  - marker: c
    text: Ou « pour les deux pièces d’angle ». L’hébreu dit littéralement « pour les deux angles » et peut désigner les éléments placés à ces angles.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹאֲמִם
  choice: jumelées
  rationale: Le terme décrit deux éléments qui se correspondent et forment une paire. « Jumelées » rend ce rapport structurel sans ajouter de procédé technique absent du texte.
- source_word: מִלְּמַטָּה
  choice: depuis le bas
  rationale: La préposition מן exprime ici vraisemblablement le point de départ de l’ajustement; « depuis le bas » conserve cette progression architecturale.
- source_word: יַחְדָּו
  choice: ensemble
  rationale: L’adverbe est rendu explicitement afin de préserver l’insistance du texte sur l’union des deux éléments.
- source_word: תַמִּים
  choice: parfaitement ajustées
  rationale: Dans ce contexte de construction, le mot évoque des éléments complets ou achevés dans leur assemblage. Cette formulation française exprime leur continuité structurelle sans répéter « jumelées ».
- source_word: אֶל רֹאשׁוֹ
  choice: jusqu’à leur sommet
  rationale: « Jusqu’à » garde la valeur directionnelle de אֶל et la progression du bas vers le haut. Le pluriel français reprend naturellement les deux pièces, bien que l’hébreu porte littéralement un suffixe singulier.
- source_word: הַטַּבַּעַת הָאֶחָת
  choice: à un seul anneau
  rationale: La formulation indique qu’un anneau unique est en jeu. « Un seul » est plus naturel en français que « l’anneau un » et n’introduit pas l’idée non explicitée de « premier anneau ».
- source_word: כֵּן עָשָׂה
  choice: Il fit de même
  rationale: Cette expression française rend naturellement le résumé de la manière dont l’ouvrage fut exécuté.
- source_word: לִשְׁנֵיהֶם
  choice: pour toutes deux
  rationale: La tournure renvoie clairement aux deux pièces correspondantes et respecte le référent féminin choisi en français.
- source_word: לִשְׁנֵי הַמִּקְצֹעֹת
  choice: aux deux angles
  rationale: מִקְצֹעֹת désigne les angles ou coins de la structure. « Aux deux angles » est idiomatique et évite de transformer explicitement les angles en pièces matérielles.
