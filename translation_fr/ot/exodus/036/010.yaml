  - severity: low
    issue: Formulation distributive au singulier
    rationale: « L’une à l’autre » est compréhensible, mais « les unes aux autres » est la formulation française plus naturelle pour exprimer l’assemblage réciproque de plusieurs tentures.
  - severity: low
