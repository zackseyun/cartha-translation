translation:
  language: fr
  text: Il assembla cinq tentures les unes aux autres, et il assembla les cinq autres tentures[a] les unes aux autres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement dans la seconde proposition : « et cinq tentures » ; « les cinq autres » précise qu’il s’agit d’une seconde série de cinq.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבֵּר / חִבַּר
  choice: assembla
  rationale: Le verbe חבר signifie joindre ou relier. « Assembler » est naturel dans un contexte de fabrication et ne précise pas indûment le procédé d’attache.
- source_word: יְרִיעֹת
  choice: tentures
  rationale: Dans le contexte du tabernacle, le terme désigne de grandes pièces de tissu formant la couverture. « Tentures » est clair, digne et adapté au contexte.
- source_word: חֲמֵשׁ
  choice: cinq
  rationale: Traduction directe du nombre cardinal.
- source_word: אַחַת אֶל אֶחָת
  choice: l’une à l’autre
  rationale: Cette tournure rend littéralement et naturellement l’idée que les tentures de chaque série sont reliées entre elles.
- source_word: וְחָמֵשׁ יְרִיעֹת
  choice: les cinq autres tentures
  rationale: L’hébreu dit littéralement « et cinq tentures ». « Les cinq autres » explicite en français qu’il s’agit de la seconde série de cinq, comme l’indique le parallélisme.
