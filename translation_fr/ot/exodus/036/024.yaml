  yaml_path: translation/ot/exodus/036/024.yaml
  text: And he made forty silver bases under the twenty frames, two bases under the one frame for its two tenons, and two bases under the other frame for its two tenons.
translation:
  language: fr
  text: 'Il fit quarante socles d’argent sous les vingt cadres : deux socles sous chaque cadre, pour ses deux tenons.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַדְנֵי / אֲדָנִים
  choice: socles
  rationale: Désigne ici les bases d’argent qui recevaient les tenons des cadres; « socles » est précis et naturel en français.
- source_word: הַקְּרָשִׁים / הַקֶּרֶשׁ
  choice: cadres / cadre
  rationale: Dans la description du sanctuaire, le terme désigne les éléments verticaux assemblés de la structure; « cadres » rend leur fonction architecturale sans imposer l’image de simples planches.
- source_word: יְדֹתָיו
  choice: ses deux tenons
  rationale: Le sens concret est celui de deux prolongements façonnés pour s’insérer dans les socles; « tenons » est le terme technique français approprié.
- source_word: הָאֶחָד ... הָאֶחָד
  choice: un cadre ... l’autre cadre
  rationale: La répétition hébraïque distingue distributivement les cadres successifs. Cette formulation française exprime clairement la répartition de deux socles par cadre.
