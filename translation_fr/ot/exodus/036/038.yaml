  text: and its five pillars with their hooks[a]; and he overlaid their tops and their bands with gold[b], and their five bases were bronze.
translation:
  language: fr
  text: ainsi que ses cinq colonnes et leurs crochets. Il recouvrit d’or leurs sommets et leurs tringles[a], et leurs cinq socles étaient en bronze[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner des tringles, des bandes ou d’autres éléments de liaison ou d’ornement fixés aux colonnes.
    reason: lexical_alternative
  - marker: b
    text: Ou « en cuivre » ; le terme hébreu peut désigner le cuivre ou un alliage cuivreux tel que le bronze.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדָיו
  choice: ses cinq colonnes
  rationale: עַמּוּד désigne ici les supports verticaux de l’entrée. « Colonnes » est naturel dans le vocabulaire architectural du sanctuaire et le suffixe renvoie à l’entrée ou au rideau mentionné dans le contexte.
- source_word: וָוֵיהֶם
  choice: leurs crochets
  rationale: Dans les descriptions du tabernacle, וָו désigne les crochets fixés aux colonnes pour soutenir la tenture.
- source_word: וְצִפָּה
  choice: il recouvrit d’or
  rationale: Le piel de צפה exprime l’application d’un revêtement métallique. « Recouvrir d’or » est clair et idiomatique en français.
- source_word: רָאשֵׁיהֶם
  choice: le sommet des colonnes
  rationale: Littéralement « leurs têtes » ; dans ce contexte architectural, il s’agit de leur partie supérieure, sans imposer le sens technique de « chapiteaux ».
- source_word: חֲשֻׁקֵיהֶם
  choice: leurs tringles
  rationale: Le terme désigne probablement des éléments allongés reliant ou ornant les colonnes. « Tringles » convient au contexte tout en laissant l’incertitude exacte à une note.
- source_word: אַדְנֵיהֶם
  choice: leurs cinq socles
  rationale: אֶדֶן désigne la pièce de base dans laquelle une colonne est fixée. « Socles » est précis et courant en français.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: « Bronze » est le rendu conventionnel et contextuellement approprié pour נְחֹשֶׁת dans la description du tabernacle, même si la composition exacte du métal ancien n’est pas certaine.
theological_decisions: []
