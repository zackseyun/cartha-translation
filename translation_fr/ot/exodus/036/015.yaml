  rationale: Dans le contexte du tabernacle, le mot désigne une pièce textile formant une couverture; « tenture » est naturel et précis en français.
- source_word: אַמָּה
  choice: coudée
  rationale: Conserve l’unité de mesure ancienne du texte hébreu sans imposer une conversion moderne incertaine.
- source_word: מִדָּה אַחַת
  choice: les mêmes dimensions
  rationale: Littéralement « une seule mesure »; dans ce contexte, l’expression indique que les onze tentures avaient un format identique.
