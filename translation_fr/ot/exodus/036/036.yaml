  text: וַ/יַּ֣עַשׂ לָ֗/הּ אַרְבָּעָה֙ עַמּוּדֵ֣י שִׁטִּ֔ים וַ/יְצַפֵּ֣/ם זָהָ֔ב וָוֵי/הֶ֖ם זָהָ֑ב וַ/יִּצֹ֣ק לָ/הֶ֔ם אַרְבָּעָ֖ה אַדְנֵי כָֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/036.yaml
  text: He made for it four pillars of acacia wood and overlaid them with gold[a]; their hooks were of gold[b]; and he cast for them four silver bases.
translation:
  language: fr
  text: Pour ce voile, il fit quatre colonnes en bois d’acacia et les recouvrit d’or. Leurs crochets étaient en or, et il coula pour elles quatre socles d’argent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַמּוּדֵי
  choice: colonnes
  rationale: Le terme désigne ici des supports verticaux. « Colonnes » est naturel et précis dans la description de la tente-sanctuaire.
- source_word: שִׁטִּים
  choice: bois d’acacia
  rationale: Il s’agit du bois d’acacia employé dans la construction du sanctuaire; cette formulation est claire en français moderne.
- source_word: וַיְצַפֵּם
  choice: les recouvrit d’or
  rationale: Le verbe décrit l’application d’un revêtement métallique. « Recouvrir d’or » rend clairement l’action sans suggérer nécessairement une technique moderne de placage.
- source_word: וָוֵיהֶם
  choice: leurs crochets
  rationale: Dans ce contexte, le nom désigne vraisemblablement les pièces de fixation attachées aux colonnes; « crochets » est la traduction la plus cohérente.
- source_word: אַדְנֵי
  choice: socles
  rationale: Le mot désigne les éléments de fondation dans lesquels les colonnes étaient fixées. « Socles » est précis et courant en français.
- source_word: כָסֶף
  choice: argent
  rationale: Désignation directe du métal dont les socles étaient faits.
- source_word: לָהּ
  choice: pour ce voile
  rationale: Le pronom féminin renvoie au voile du verset précédent. Comme « voile » est masculin en français, la reprise explicite évite un pronom ambigu ou grammaticalement artificiel.
- source_word: וַיִּצֹק
  choice: il coula
  rationale: Dans le contexte du travail du métal, le verbe signifie fabriquer par coulée; « couler » est idiomatique en français.
