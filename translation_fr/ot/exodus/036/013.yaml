  text: וַ/יַּ֕עַשׂ חֲמִשִּׁ֖ים קַרְסֵ֣י זָהָ֑ב וַ/יְחַבֵּ֨ר אֶת הַ/יְרִעֹ֜ת אַחַ֤ת אֶל אַחַת֙ בַּ/קְּרָסִ֔ים וַֽ/יְהִ֥י הַ/מִּשְׁכָּ֖ן אֶחָֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/013.yaml
  text: And he made fifty gold clasps[a], and joined the curtains to one another with the clasps, so that the tabernacle became one.
translation:
  language: fr
  text: Il fit cinquante agrafes en or et relia les tentures l’une à l’autre au moyen des agrafes. Ainsi, le tabernacle forma un tout.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et le tabernacle fut un ». L’hébreu peut se traduire plus formellement ainsi ; « forma un tout » explicite le résultat de l’assemblage.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le verbe עשה signifie couramment « faire » ou « fabriquer ». « Il fit » est naturel ici et maintient la continuité narrative.
- source_word: קַרְסֵי זָהָב
  choice: agrafes en or
  rationale: קֶרֶס désigne ici des pièces d’attache servant à réunir les tentures. « Agrafes » exprime clairement leur fonction sans préciser indûment leur forme.
- source_word: וַיְחַבֵּר
  choice: relia
  rationale: Le verbe חבר exprime l’action de joindre ou de relier. « Relia » convient à l’assemblage matériel des tentures.
- source_word: הַיְרִעֹת
  choice: les tentures
  rationale: יְרִיעוֹת désigne les grandes pièces d’étoffe constituant la couverture du tabernacle. « Tentures » est précis et courant dans ce contexte.
- source_word: אַחַת אֶל אַחַת
  choice: l’une à l’autre
  rationale: Cette répétition féminine singulière exprime la mise en relation réciproque des tentures et se rend naturellement ainsi en français.
- source_word: בַּקְּרָסִים
  choice: au moyen des agrafes
  rationale: 'La préposition ב est instrumentale ici : les agrafes sont le moyen par lequel les tentures sont reliées.'
- source_word: וַיְהִי הַמִּשְׁכָּן אֶחָד
  choice: Ainsi, le tabernacle forma un tout
  rationale: La proposition décrit le résultat de l’assemblage. « Forma un tout » rend l’unité structurelle obtenue tout en restant idiomatique en français.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: « Tabernacle » est le terme français traditionnel et largement compris pour la demeure-sanctuaire décrite dans l’Exode.
