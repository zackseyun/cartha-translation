  text: וּ/לְ/צֶ֧לַע הַ/מִּשְׁכָּ֛ן הַ/שֵּׁנִ֖ית לִ/פְאַ֣ת צָפ֑וֹן עָשָׂ֖ה עֶשְׂרִ֥ים קְרָשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/025.yaml
  text: For the second side of the tabernacle[a], on the north side, he made twenty boards.
translation:
  language: fr
  text: Pour le second côté du tabernacle, du côté nord, il fit vingt panneaux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cadres » ou « planches ». Le terme hébreu peut désigner des panneaux structurels ou des cadres; la forme exacte de ces éléments du tabernacle fait débat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְצֶלַע
  choice: Pour le … côté
  rationale: Dans le contexte de la construction du tabernacle, צֶלַע désigne un côté plutôt qu’une « côte » anatomique. « Pour » rend naturellement l’ensemble formé par la conjonction et la préposition.
- source_word: הַמִּשְׁכָּן
  choice: du tabernacle
  rationale: « Tabernacle » est le terme français établi pour le sanctuaire mobile du désert et convient au contexte cultuel.
- source_word: הַשֵּׁנִית
  choice: second
  rationale: L’adjectif désigne le deuxième des deux côtés correspondants; « second » conserve précisément l’ordre indiqué.
- source_word: לִפְאַת צָפוֹן
  choice: du côté nord
  rationale: L’expression précise l’orientation de ce second côté. Cette formulation est naturelle en français et conserve la valeur directionnelle.
- source_word: עָשָׂה
  choice: il fit
  rationale: Le verbe עשה a le sens général de faire; le passé simple convient à un récit de construction au registre digne.
- source_word: עֶשְׂרִים
  choice: vingt
  rationale: Rendu direct du nombre cardinal.
- source_word: קְרָשִׁים
  choice: panneaux
  rationale: Le terme désigne les éléments structurels en bois du tabernacle. « Panneaux » est clair et suffisamment neutre en français, tandis que leur forme exacte demeure incertaine et est signalée en note.
