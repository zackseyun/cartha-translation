  text: And he made a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
translation:
  language: fr
  text: Il fit, pour l’entrée de la tente, un rideau[a] en fils bleus, pourpres et écarlates, et en fin lin retors, ouvrage de brodeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tenture ». Le terme hébreu désigne un rideau placé à une entrée, distinct du « voile » intérieur (פָּרֹכֶת).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol fait progresser le récit. « Il fit » rend naturellement l’action séquentielle sans l’alourdir d’un connecteur superflu en français.
- source_word: מָסָךְ
  choice: rideau
  rationale: Le terme désigne une tenture placée à une entrée. « Rideau » est naturel en français et reste distinct de « voile », employé pour la séparation intérieure (פָּרֹכֶת).
- source_word: לְפֶתַח הָאֹהֶל
  choice: pour l’entrée de la tente
  rationale: Cette formulation suit précisément le rapport exprimé par לְ et conserve le nom commun « tente » pour אֹהֶל.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: en fils bleus, pourpres et écarlates
  rationale: Les termes désignent ici des matières textiles teintes. L’ajout de « fils », commandé par le contexte, permet une expression française claire et coordonnée.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: et en fin lin retors
  rationale: « Fin lin » rend שֵׁשׁ et « retors » exprime le caractère torsadé de מָשְׁזָר dans le vocabulaire textile.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: ouvrage de brodeur
  rationale: La formule française concise conserve l’idée d’un travail artisanal spécialisé et reflète la construction nominale hébraïque.
