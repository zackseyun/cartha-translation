base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/005.yaml
  text: And they said to Moses[a], “The people are bringing much more than enough for the work of the task that Yahweh commanded to be done.”
translation:
  language: fr
  text: 'Ils dirent à Moïse : « Le peuple apporte bien plus qu’il n’en faut pour réaliser l’ouvrage que Yahweh a ordonné d’exécuter. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה לֵּאמֹר
  choice: Ils dirent à Moïse
  rationale: La formule narrative introduit un discours direct. En français naturel, l’infinitif לֵאמֹר (« en disant ») n’a pas besoin d’être rendu séparément.
- source_word: מַרְבִּים הָעָם לְהָבִיא מִדֵּי
  choice: Le peuple apporte bien plus qu’il n’en faut
  rationale: מַרְבִּים avec לְהָבִיא décrit l’action en cours, tandis que מִדֵּי indique qu’elle dépasse la quantité suffisante. Cette formulation française exprime clairement l’excédent.
- source_word: הָעֲבֹדָה לַמְּלָאכָה
  choice: pour réaliser l’ouvrage
  rationale: Les deux noms évoquent respectivement le travail et l’ouvrage à accomplir. Une traduction littérale comme « le travail de l’ouvrage » serait lourde en français; « réaliser l’ouvrage » conserve le rapport entre l’activité et son objet.
- source_word: אֲשֶׁר צִוָּה יְהוָה
  choice: que Yahweh a ordonné
  rationale: La proposition relative identifie l’ouvrage comme celui prescrit par Yahweh. Le passé composé convient au français moderne tout en gardant l’antériorité de l’ordre.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit afin de représenter directement le tétragramme hébreu.
- source_word: לַעֲשֹׂת אֹתָהּ
  choice: d’exécuter
  rationale: L’infinitif avec le pronom objet renvoie à la réalisation de la מְלָאכָה. « Exécuter » rend naturellement l’accomplissement de l’ouvrage commandé sans préciser artificiellement l’agent.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahweh » conserve le nom propre et évite de le remplacer par un titre.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct est concis; « bien plus qu’il n’en faut » souligne l’excédent des apports sans ajouter de jugement moral. Aucun marqueur de note n’est nécessaire.
