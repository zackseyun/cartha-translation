  text: וַ/יְצַ֣ו מֹשֶׁ֗ה וַ/יַּעֲבִ֨ירוּ ק֥וֹל בַּֽ/מַּחֲנֶה֮ לֵ/אמֹר֒ אִ֣ישׁ וְ/אִשָּׁ֗ה אַל יַעֲשׂוּ ע֛וֹד מְלָאכָ֖ה לִ/תְרוּמַ֣ת הַ/קֹּ֑דֶשׁ וַ/יִּכָּלֵ֥א הָ/עָ֖ם מֵ/הָבִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/006.yaml
  text: So Moses commanded[a], and they sent a proclamation through the camp, saying[b], “Let neither man nor woman do any more work for the contribution of the sanctuary.” So the people were restrained from bringing more.
translation:
  language: fr
  text: 'Moïse donna cet ordre, et l’on fit circuler une annonce dans tout le camp[a] : « Que ni homme ni femme ne fasse désormais aucun ouvrage pour l’offrande destinée au sanctuaire[b]. » Ainsi, le peuple fut empêché d’apporter davantage.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque signifie littéralement « ils firent passer une voix » ; elle peut aussi se traduire par « ils firent une proclamation dans le camp ».
    reason: lexical_alternative
  - marker: b
    text: L’expression peut aussi se traduire par « la sainte offrande » ou « la contribution pour le sanctuaire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: donna cet ordre
  rationale: Le verbe צוה exprime ici un ordre faisant autorité. « Donna cet ordre » restitue naturellement sa force et relie explicitement l’ordre au contenu qui suit.
- source_word: וַיַּעֲבִירוּ קוֹל
  choice: l’on fit circuler une annonce
  rationale: L’expression causative signifie littéralement « faire passer une voix » et désigne la diffusion publique d’un message. « Fit circuler une annonce » conserve la nuance causative sans calquer maladroitement l’hébreu.
- source_word: בַּמַּחֲנֶה
  choice: dans tout le camp
  rationale: La préposition signifie littéralement « dans le camp » ; avec l’idée d’une annonce mise en circulation, « dans tout le camp » exprime naturellement sa diffusion parmi la communauté.
- source_word: אִישׁ וְאִשָּׁה
  choice: ni homme ni femme
  rationale: Cette formulation préserve la mention explicite des deux sexes et convient à la défense introduite par אַל.
- source_word: אַל יַעֲשׂוּ עוֹד מְלָאכָה
  choice: ne fasse désormais aucun ouvrage
  rationale: מְלָאכָה peut désigner un travail ou un ouvrage artisanal. Dans le contexte de la fabrication du sanctuaire, « ouvrage » rend bien cette activité, tandis que « désormais aucun » exprime la cessation demandée.
- source_word: לִתְרוּמַת הַקֹּדֶשׁ
  choice: pour l’offrande destinée au sanctuaire
  rationale: תְּרוּמָה désigne une contribution ou une offrande mise à part, et הַקֹּדֶשׁ renvoie ici au sanctuaire dans son contexte. Cette formulation évite l’ambiguïté française de « l’offrande du sanctuaire » tout en conservant la destination sacrée.
- source_word: וַיִּכָּלֵא
  choice: on empêcha le peuple
  rationale: Le niphal de כלא exprime le fait d’être retenu ou empêché. La tournure impersonnelle française est naturelle et n’implique pas que le peuple était réticent à s’arrêter.
- source_word: מֵהָבִיא
  choice: d’apporter davantage
  rationale: La préposition מן avec l’infinitif marque l’empêchement. « Davantage » explicite sobrement, d’après le contexte immédiat, qu’il s’agit de cesser les apports supplémentaires.
theological_decisions:
- issue: Rapport de הַקֹּדֶשׁ avec תְּרוּמָה
  choice: l’offrande destinée au sanctuaire
  alternative: la sainte offrande
  rationale: Le contexte de la construction du tabernacle favorise une référence au sanctuaire, mais l’autre analyse grammaticale reste possible et est signalée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « l’on » maintient un ton soutenu sans identifier les agents de l’annonce, que l’hébreu laisse indéterminés. Le discours direct demeure concis et solennel.
