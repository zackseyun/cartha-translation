review_pass:
  verdict: revise
  source_fidelity: 'Le sens essentiel est bien rendu : Moïse donne un ordre, une annonce est diffusée dans le camp, hommes et femmes doivent cesser tout ouvrage relatif à l’offrande, et le peuple est empêché d’apporter davantage. La voix passive finale de l’hébreu mérite toutefois d’être conservée plus directement. « Donc » introduit une inférence absente du récit.'
  naturalness: Le français est globalement fluide et de registre approprié. « Le peuple fut empêché d’apporter davantage » est à la fois naturel dans ce contexte narratif et plus fidèle à la forme passive que « on empêcha le peuple ».
  terminology: « Offrande destinée au sanctuaire » est une solution claire et contextuellement défendable pour לִתְרוּמַת הַקֹּדֶשׁ. La note conserve à juste titre l’alternative « sainte offrande », sans trancher indûment une ambiguïté syntaxique et lexicale. « Ouvrage » convient à מְלָאכָה dans le contexte de la confection pour le sanctuaire.
  issues:
  - severity: low
    issue: Ajout de « donc »
    rationale: Le waw narratif relie simplement l’action suivante ; il n’exprime pas nécessairement une conséquence. « Donc » peut suggérer une relation argumentative non marquée dans le texte source.
  - severity: low
    issue: Transformation de la passive finale en tournure active impersonnelle
    rationale: וַיִּכָּלֵא הָעָם signifie littéralement que le peuple fut retenu/empêché. Une passive française préserve mieux la présentation de l’action sans introduire un agent, même indéfini.
