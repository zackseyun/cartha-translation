  text: 'He made the frames for the tabernacle: twenty frames for the south side[a], toward the south.'
translation:
  language: fr
  text: 'Il fit les planches du tabernacle : vingt planches pour le côté sud[a], au sud.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vingt cadres pour le côté sud ». Le terme hébreu peut désigner des planches ou des éléments structuraux. La double expression pour le sud (« côté sud, au sud ») insiste sur cette orientation ou la précise.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol qal de עשה exprime l’action suivante du récit au passé. Le passé simple convient au registre narratif écrit et le sujet masculin singulier est fourni par le contexte.
- source_word: הַקְּרָשִׁים
  choice: les cadres
  rationale: Dans la construction du tabernacle, קֶרֶשׁ désigne les éléments verticaux de la structure. « Cadres » met en avant leur fonction architecturale, tandis que « planches » demeure une possibilité lexicale signalée en note.
- source_word: לַמִּשְׁכָּן
  choice: du tabernacle
  rationale: מִשְׁכָּן est ici le terme consacré pour la demeure-sanctuaire d’Israël. La tournure « les cadres du tabernacle » exprime naturellement en français leur destination.
- source_word: עֶשְׂרִים קְרָשִׁים
  choice: vingt cadres
  rationale: La répétition du nom après le nombre est conservée afin de respecter le style d’inventaire du texte hébreu.
- source_word: לִפְאַת
  choice: pour le côté
  rationale: פֵּאָה désigne ici un côté ou une extrémité de la structure; « côté » est le terme architectural le plus naturel.
- source_word: נֶגֶב
  choice: sud
  rationale: Dans ce contexte, נֶגֶב a une valeur directionnelle et non celle du nom propre régional « Néguev ».
- source_word: תֵּימָנָה
  choice: en direction du sud
  rationale: Le mot directionnel précise et redouble נֶגֶב. Cette formulation française conserve cette insistance sans employer l’adverbe peu courant « sudward » ni supprimer la répétition.
