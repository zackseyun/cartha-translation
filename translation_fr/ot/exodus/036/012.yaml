base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/012.yaml
  text: He made fifty loops on the one curtain[a], and he made fifty loops on the edge of the curtain that was in the second set[b]; the loops corresponded to one another.
translation:
  language: fr
  text: Il fit cinquante boucles sur un rideau et cinquante boucles sur le bord du rideau qui faisait partie du second ensemble[a] ; les boucles se correspondaient les unes aux autres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du second assemblage » ou « de la seconde section assemblée ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les boucles correspondaient, l’une à l’autre ».'
    reason: literal_rendering
lexical_decisions:
- source_word: לֻלָאֹת
  choice: boucles
  rationale: Le nom désigne ici les boucles de tissu servant à relier les rideaux. « Boucles » les distingue clairement des agrafes métalliques mentionnées au verset suivant.
- source_word: יְרִיעָה
  choice: rideau
  rationale: Dans le contexte du sanctuaire, le terme désigne une grande pièce de tissu. « Rideau » est courant, naturel et adapté à cet usage.
- source_word: בִּקְצֵה
  choice: sur le bord de
  rationale: קָצֶה désigne une extrémité ou un bord. Les boucles étant disposées le long de la bordure en vue de l’assemblage, « sur le bord de » exprime clairement la relation spatiale.
- source_word: מַחְבֶּרֶת
  choice: ensemble
  rationale: Le mot peut désigner l’assemblage ou l’unité formée par plusieurs rideaux reliés. « Ensemble » rend naturellement ici le groupe de rideaux ainsi constitué, sans imposer une précision absente du terme.
- source_word: מַקְבִּילֹת
  choice: se faisaient face
  rationale: Le participe indique que les boucles étaient placées en vis-à-vis et alignées pour pouvoir être reliées. Cette formulation conserve l’image spatiale du texte hébreu.
- source_word: אַחַת אֶל אֶחָת
  choice: l’une à l’autre
  rationale: La formule précise la correspondance individuelle des boucles. Une traduction assez littérale préserve cette insistance.
- source_word: עָשָׂה
  choice: fit
  rationale: Le verbe courant עשה signifie simplement « faire » ici ; le passé simple convient au registre narratif et descriptif du passage.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « cinquante boucles » et de « rideau » est conservée pour respecter la précision technique et le parallélisme de l’hébreu. « Un rideau » maintient la valeur de l’hébreu הָאֶחָת sans l’interpréter silencieusement comme « le premier rideau ».
