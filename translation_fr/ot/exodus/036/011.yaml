base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/011.yaml
  text: He made loops of blue yarn on the edge of the first curtain at the end of the first set joined together[a]; likewise he made them on the edge of the outermost curtain in the second set joined together.
translation:
  language: fr
  text: Il fit des boucles de fil bleu sur le bord du premier rideau, à l’extrémité de l’assemblage[a] ; il en fit de même sur le bord du rideau le plus extérieur du second assemblage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au point de jonction ». Le terme hébreu peut désigner l’ensemble formé par les rideaux réunis ou l’endroit où ils étaient reliés.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: boucles
  rationale: Le nom désigne ici des boucles textiles servant à relier les rideaux ; « boucles » est direct et naturel en français.
- source_word: תְּכֵלֶת
  choice: fil bleu
  rationale: Dans ce contexte, le terme désigne une matière textile teinte en bleu, employée pour confectionner les boucles, et non la couleur prise abstraitement.
- source_word: שְׂפַת הַיְרִיעָה
  choice: le bord du rideau
  rationale: שָׂפָה désigne le bord de la pièce d’étoffe, tandis que יְרִיעָה désigne l’un des rideaux formant la couverture du sanctuaire.
- source_word: הָאֶחָת
  choice: premier
  rationale: Littéralement « l’un », le mot a ici une valeur ordinale dans la construction parallèle qui s’achève par « le second ».
- source_word: מִקָּצָה
  choice: à l’extrémité
  rationale: L’expression situe les boucles à l’extrémité du rideau où les deux ensembles devaient être reliés.
- source_word: מַּחְבָּרֶת
  choice: assemblage
  rationale: Le terme peut désigner soit l’ensemble de rideaux réunis, soit leur point de jonction. « Assemblage » conserve utilement cette amplitude de sens.
- source_word: כֵּן עָשָׂה
  choice: il en fit de même
  rationale: Cette formulation française naturelle reprend l’action précédente tout en conservant le parallélisme.
- source_word: הַקִּיצוֹנָה
  choice: extérieur
  rationale: L’adjectif désigne le rideau situé à l’extrémité de l’ensemble ; « rideau extérieur » exprime clairement cette position.
- source_word: הַשֵּׁנִית
  choice: second
  rationale: L’ordinal identifie explicitement le second des deux assemblages de rideaux.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation suit étroitement la description technique tout en évitant un calque peu naturel ; le point-virgule maintient le parallélisme des deux opérations.
