base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/002.yaml
  text: Then Moses called Bezalel and Oholiab and every wise-hearted man in whose heart Yahweh had put wisdom[b][a], everyone whose heart stirred him to come to the work to do it.
translation:
  language: fr
  text: Moïse appela alors Betsaléel, Oholiab et tous les hommes au cœur sage[a], auxquels Yahweh avait donné de la sagesse dans leur cœur, tous ceux que leur cœur poussait[b] à s’approcher de l’ouvrage pour l’exécuter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « tous les hommes sages de cœur » : expression hébraïque désignant ici des personnes douées de sagesse et d’habileté pour l’ouvrage.'
    reason: lexical_alternative
  - marker: b
    text: Ou « que leur cœur incitait »; littéralement, « dont le cœur les élevait ». L’expression évoque une volonté ou un élan intérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא מֹשֶׁה אֶל
  choice: Moïse appela alors
  rationale: קרא אל désigne ici l’appel de personnes en vue d’une tâche. « Appela » est naturel et « alors » rend la progression narrative du waw consécutif.
- source_word: בְּצַלְאֵל וְאֶל אָהֳלִיאָב
  choice: Betsalel, Oholiab
  rationale: Translittération française courante des noms propres hébreux.
- source_word: כָּל אִישׁ חֲכַם לֵב
  choice: tous les artisans habiles[a]
  rationale: Dans le contexte de la fabrication du sanctuaire, l’expression « sage de cœur » désigne des personnes douées de sagesse pratique et d’habileté artisanale. La note conserve l’image hébraïque.
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה בְּלִבּוֹ
  choice: à qui Yahweh avait donné sagesse et savoir-faire
  rationale: La sagesse donnée « dans le cœur » est ici une capacité accordée par Dieu pour l’ouvrage. Le doublet français explicite sa dimension intellectuelle et pratique sans en limiter la portée à la seule technique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: כֹּל אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: tous ceux que leur cœur poussait[b]
  rationale: L’idiome exprime une disposition intérieure volontaire ou un élan qui incite à agir; la note signale d’autres nuances possibles.
- source_word: לְקָרְבָה אֶל הַמְּלָאכָה לַעֲשֹׂת אֹתָהּ
  choice: à venir accomplir ce travail
  rationale: Cette formulation française naturelle rend l’approche en vue de prendre part à l’ouvrage et l’expression עשה מלאכה, « accomplir/faire le travail ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom propre divin; sa translittération préserve cette distinction sans lui substituer un titre.
- issue: Origine de la sagesse et de l’habileté
  choice: « Yahweh avait donné sagesse et savoir-faire »
  alternative: « Yahweh avait mis la sagesse dans leur cœur »
  rationale: Le rendu maintient explicitement l’origine divine du don, tandis que la formulation naturelle en français communique ici la portée pratique de חכמה. L’alternative conserverait plus littéralement l’image du cœur.
translation_notes:
  register: Français international moderne, digne et accessible. « Artisans » est retenu en raison du contexte immédiat de fabrication, tandis que la note préserve l’idiome hébreu. La reprise de « tous ceux » reflète la structure appositionnelle du verset sans imposer un second groupe distinct.
