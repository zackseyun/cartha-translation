revisions:
- from: Moïse appela alors Betsalel, Oholiab et tous les artisans habiles[a] à qui Yahweh avait donné sagesse et savoir-faire, tous ceux que leur cœur poussait[b] à venir accomplir ce travail.
  to: Moïse appela alors Betsaléel, Oholiab et tous les hommes au cœur sage[a], auxquels Yahweh avait donné de la sagesse dans leur cœur, tous ceux que leur cœur poussait[b] à s’approcher de l’ouvrage pour l’exécuter.
  rationale: La révision supprime l’explicitation additionnelle « savoir-faire », rétablit la sagesse donnée dans le cœur et rend plus précisément le mouvement vers l’ouvrage, tout en conservant un registre français naturel, les ancres de notes et l’ambiguïté propre à l’idiome de נשא לב.
