source:
  edition: WLC
  text: וַ/יִּקְח֞וּ מִ/לִּ/פְנֵ֣י מֹשֶׁ֗ה אֵ֤ת כָּל הַ/תְּרוּמָה֙ אֲשֶׁ֨ר הֵבִ֜יאוּ בְּנֵ֣י יִשְׂרָאֵ֗ל לִ/מְלֶ֛אכֶת עֲבֹדַ֥ת הַ/קֹּ֖דֶשׁ לַ/עֲשֹׂ֣ת אֹתָ֑/הּ וְ֠/הֵם הֵבִ֨יאוּ אֵלָ֥י/ו ע֛וֹד נְדָבָ֖ה בַּ/בֹּ֥קֶר בַּ/בֹּֽקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/003.yaml
  text: And they took from before Moses all the contribution that the sons of Israel had brought for the work of the service of the sanctuary[a], to do it[c][b]. But they still kept bringing to him freewill offerings morning after morning.
translation:
  language: fr
  text: Ils prirent auprès de Moïse[a] toute la contribution que les Israélites avaient apportée pour réaliser l’ouvrage destiné au service du sanctuaire. Quant aux Israélites, ils continuaient à lui apporter, matin après matin, des offrandes volontaires.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de devant Moïse » ou « de la présence de Moïse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Ils prirent
  rationale: Le sens premier de לקח est « prendre ». Dans le contexte, les artisans prennent les matériaux qui se trouvent auprès de Moïse; « reçurent » serait possible, mais plus interprétatif.
- source_word: מִלִּפְנֵי מֹשֶׁה
  choice: auprès de Moïse
  rationale: Littéralement, l’expression signifie « de devant la face de Moïse » ou « de la présence de Moïse ». « Auprès de Moïse » conserve l’idée que les matériaux étaient déposés sous ses yeux ou à sa disposition, dans un français naturel.
- source_word: הַתְּרוּמָה
  choice: la contribution
  rationale: תְּרוּמָה désigne ici l’ensemble des biens offerts et mis à part pour la construction, plutôt qu’un sacrifice.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette désignation collective conventionnelle est rendue de manière idiomatique et inclusive en français moderne.
- source_word: לִמְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: pour réaliser l’ouvrage destiné au service du sanctuaire
  rationale: La formulation restitue les deux notions imbriquées de « travail/ouvrage » et de « service », tandis que הַקֹּדֶשׁ désigne ici le sanctuaire dans le contexte de la Demeure.
- source_word: לַעֲשֹׂת אֹתָהּ
  choice: pour réaliser l’ouvrage
  rationale: Le suffixe féminin renvoie très probablement à מְלָאכָה, le travail ou l’ouvrage. L’intégration de cette proposition à la phrase évite en français la reprise lourde « pour le faire ».
- source_word: וְהֵם הֵבִיאוּ
  choice: Quant aux Israélites, ils continuaient à apporter
  rationale: Le pronom indépendant הֵם met le groupe en relief, et le contexte indique une action répétée qui se poursuivait pendant que les artisans recevaient les matériaux. « Quant aux » exprime ce changement de foyer sans introduire une opposition forte.
- source_word: נְדָבָה
  choice: des offrandes volontaires
  rationale: נְדָבָה désigne un don fait librement. Le pluriel français convient à la répétition des apports, bien que le nom hébreu soit au singulier collectif.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: matin après matin
  rationale: La répétition du nom exprime la régularité et la continuité; « matin après matin » en reproduit naturellement la force itérative.
theological_decisions: []
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe hébraïque très nominale est légèrement restructurée pour rester claire, tout en conservant la distinction entre l’ouvrage et le service du sanctuaire. La reprise explicite « les Israélites » clarifie le référent contextuel du pronom emphatique sans ajouter de contenu doctrinal.
