revisions:
- from: Tous les hommes habiles parmi ceux qui exécutaient le travail firent le tabernacle avec dix tentures de fin lin retors, de fil bleu, pourpre et écarlate. Il les fit avec des chérubins, ouvrage d’un artisan habile.[a]
  to: Tous les hommes habiles parmi ceux qui exécutaient l’ouvrage firent le tabernacle avec dix tentures de fin lin retors, de fils bleus, pourpres et écarlates. Il y fit des chérubins, exécutés avec art.[a]
  rationale: La révision conserve la discordance pluriel-singulier du texte massorétique, signalée par la note, tout en reformulant la dernière proposition pour qu’elle soit idiomatique et que la qualité artistique exprimée par מַעֲשֵׂה חֹשֵׁב se rapporte clairement aux chérubins. « Exécutés avec art » reste suffisamment large pour ne pas trancher une technique textile particulière.
