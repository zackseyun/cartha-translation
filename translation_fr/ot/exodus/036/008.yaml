base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/008.yaml
  text: And every skillful man among those doing the work made the tabernacle with ten curtains of finely twisted linen[a], and blue, and purple, and scarlet yarn; he made them with cherubim[b], the work of a skillful designer.
translation:
  language: fr
  text: Tous les hommes habiles parmi ceux qui exécutaient l’ouvrage firent le tabernacle avec dix tentures de fin lin retors, de fils bleus, pourpres et écarlates. Il y fit des chérubins, exécutés avec art.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu commence au pluriel (« firent »), mais se termine au singulier (« il fit »).
    reason: alternative_reading
lexical_decisions:
- source_word: חֲכַם לֵב
  choice: hommes habiles
  rationale: Littéralement « sages de cœur » ; dans ce contexte, l’expression désigne des artisans possédant le savoir-faire requis. Le masculin pluriel du français correspond au groupe exprimé par l’hébreu sans conserver un calque obscur.
- source_word: בְּעֹשֵׂי הַמְּלָאכָה
  choice: parmi ceux qui exécutaient le travail
  rationale: La préposition avec le participe situe les artisans habiles au sein du groupe occupé à l’ouvrage.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: Terme français consacré pour la demeure-sanctuaire construite dans l’Exode.
- source_word: יְרִיעֹת
  choice: tentures
  rationale: Le mot désigne ici les grandes pièces textiles constituant le tabernacle ; « tentures » est naturel et précis.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: fin lin retors
  rationale: Rend la qualité du lin et le fait que ses fils sont retordus, dans la terminologie textile française usuelle.
- source_word: תְכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: de fil bleu, pourpre et écarlate
  rationale: Les trois termes renvoient à des matières textiles teintes. L’ajout de « fil » explicite naturellement le référent commun sans imposer une identification plus précise des nuances.
- source_word: כְּרֻבִים
  choice: chérubins
  rationale: Forme biblique française établie, convenant au registre cultuel du passage.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: ouvrage d’un artisan habile
  rationale: L’expression désigne un travail textile artistiquement conçu et exécuté ; cette formulation reste sobre et compréhensible sans réduire nécessairement la technique à la broderie.
- source_word: עָשָׂה אֹתָם
  choice: Il les fit
  rationale: Conserve le verbe singulier du texte massorétique après le verbe pluriel initial, plutôt que d’harmoniser silencieusement la syntaxe.
theological_decisions:
- issue: Valeur générique et masculine de חֲכַם לֵב
  choice: Tous les hommes habiles
  alternative: Tous les artisans habiles / Toutes les personnes habiles
  rationale: Le contexte vise collectivement les artisans, tandis que la forme hébraïque est masculine. « Hommes habiles » en conserve la marque, sans faire de l’expression une affirmation doctrinale sur l’identité de chaque participant.
- issue: Discordance entre le sujet pluriel initial et le verbe final singulier
  choice: firent… Il les fit
  alternative: firent… ils les firent
  rationale: Le singulier final est maintenu afin de préserver la tension grammaticale du texte massorétique. Il peut être distributif ou renvoyer à l’artisan représentatif, mais la traduction ne tranche pas cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et lisible. La terminologie traditionnelle « tabernacle » et « chérubins » est conservée ; la formulation textile reste concrète. Le marqueur [a] est placé après la proposition concernée.
