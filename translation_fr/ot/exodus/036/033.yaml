    issue: Nuance spatiale de בְּתוֹךְ
    rationale: La formulation « traverse les planches en leur milieu » est possible, mais elle peut suggérer que la barre les traverse de part en part. « à l’intérieur des planches » rend plus explicitement le sens intérieur/au sein de la structure, tout en conservant l’ambiguïté architecturale.
  revised_text: Il fit la barre centrale pour qu’elle passe à l’intérieur des planches, d’une extrémité à l’autre[a].
