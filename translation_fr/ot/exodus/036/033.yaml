  yaml_path: translation/ot/exodus/036/033.yaml
  text: He made the middle bar to pass through the midst of the boards from end to end[a][b].
translation:
  language: fr
  text: Il fit la barre centrale pour qu’elle passe à l’intérieur des planches, d’une extrémité à l’autre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « la barre du milieu… d’un bout à l’autre ». Le verbe hébreu peut ici signifier « passer à travers », « courir à travers » ou « s’étendre à travers ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol qal de עשה poursuit le récit par une action passée. En français, le passé simple convient au registre narratif soutenu.
- source_word: הַבְּרִיחַ הַתִּיכֹן
  choice: la barre centrale
  rationale: בְּרִיחַ désigne ici une barre structurelle maintenant ensemble les éléments du tabernacle, et תִּיכֹן la situe au milieu ou au centre.
- source_word: לִבְרֹחַ
  choice: pour qu’elle traverse
  rationale: Dans ce contexte architectural, l’infinitif de ברח décrit le parcours ou l’extension de la barre à travers la structure, sans impliquer une fuite.
- source_word: בְּתוֹךְ הַקְּרָשִׁים
  choice: les planches en leur milieu
  rationale: בְּתוֹךְ indique l’intérieur ou le milieu des קְרָשִׁים. « Planches » conserve l’image concrète traditionnelle, tandis que la formulation précise que la barre passe en leur milieu.
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  choice: d’une extrémité à l’autre
  rationale: Cette tournure française naturelle exprime l’extension sur toute la longueur.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le passé simple maintient le registre narratif biblique sans archaïsme marqué. La formulation conserve l’ambiguïté architecturale entre une barre traversant matériellement les planches et une barre courant au milieu de l’ensemble.
