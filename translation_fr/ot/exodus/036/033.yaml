  source_fidelity: 'Le sens général est bien rendu : il s’agit de la barre centrale s’étendant sur toute la longueur des qerashim. Toutefois, « traverse les planches en leur milieu » peut évoquer une perforation transversale de chaque planche et laisse moins clairement entendre la localisation intérieure exprimée par בְּתוֹךְ.'
  naturalness: Le français est fluide et de registre narratif approprié. « Passe à l’intérieur des planches » est plus direct et plus exact dans une description de construction.
  terminology: « Barre centrale » est un rendu naturel de הַבְּרִיחַ הַתִּיכֹן. « Planches » demeure un choix lexical défendable pour הַקְּרָשִׁים, sans trancher davantage la question de leur forme structurelle.
