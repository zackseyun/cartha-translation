  text: וַ/יַּ֥עַשׂ אֶת הַ/קְּרָשִׁ֖ים לַ/מִּשְׁכָּ֑ן עֲצֵ֥י שִׁטִּ֖ים עֹמְדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/020.yaml
  text: And he made the boards for the tabernacle of acacia wood[a], standing upright.
translation:
  language: fr
  text: Il fit les planches du tabernacle en bois d’acacia, dressées verticalement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il fit pour le tabernacle des planches en bois d’acacia, dressées. »'
    reason: La préposition ל peut être rendue plus explicitement par « pour le tabernacle », et « dressées » conserve de façon idiomatique la valeur descriptive de עֹמְדִים.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol de עשה fait progresser le récit par un passé simple. « Il fit » convient au registre narratif et reste proche de la formulation hébraïque.
- source_word: הַקְּרָשִׁים
  choice: les planches
  rationale: Dans le contexte du tabernacle, קֶרֶשׁ désigne les éléments rigides formant sa structure. « Planches » est courant, concret et traditionnel en français.
- source_word: לַמִּשְׁכָּן
  choice: du tabernacle
  rationale: 'La préposition ל exprime ici la destination : les planches sont faites pour constituer le tabernacle. En français naturel, « les planches du tabernacle » rend clairement ce rapport. « Tabernacle » est le terme consacré dans ce contexte biblique.'
- source_word: עֲצֵי שִׁטִּים
  choice: en bois d’acacia
  rationale: L’expression construite désigne du bois provenant de l’acacia. « En bois d’acacia » est la formulation française idiomatique et accessible.
- source_word: עֹמְדִים
  choice: dressées verticalement
  rationale: Le participe décrit l’orientation des planches. « Dressées verticalement » explicite naturellement le sens architectural de « debout », sans modifier leur fonction.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient à la narration biblique écrite. La formulation conserve l’ordre général et la concision de l’hébreu tout en précisant naturellement l’orientation architecturale des planches.
