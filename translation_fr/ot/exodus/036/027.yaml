  text: And for the rear of the tabernacle[a], westward, he made six frames.
translation:
  language: fr
  text: Pour l’arrière du tabernacle, du côté ouest, il fit six cadres[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « planches ». Le terme hébreu peut désigner des planches ou des cadres faisant partie de la structure ; « cadres » est retenu ici parce que ce mot correspond peut-être mieux à la construction du tabernacle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: Pour l’arrière de
  rationale: Le syntagme introduit les éléments destinés à la partie la plus reculée de la structure. « Pour l’arrière de » restitue naturellement le sens architectural sans donner à tort l’idée de plusieurs côtés.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: Dans le contexte cultuel de l’Exode, « tabernacle » est le terme français établi pour désigner cette structure sacrée mobile.
- source_word: יָמָּה
  choice: du côté ouest
  rationale: Le terme signifie littéralement « vers la mer » et désigne idiomatiquement l’ouest. « Du côté ouest » exprime clairement ici l’emplacement architectural.
- source_word: עָשָׂה
  choice: il fit
  rationale: Traduction directe du verbe courant « faire », adaptée au style répétitif du récit de construction.
- source_word: שִׁשָּׁה
  choice: six
  rationale: Restitution directe du nombre cardinal.
- source_word: קְרָשִׁים
  choice: cadres
  rationale: Le mot désigne les éléments verticaux de la structure. « Cadres » rend leur fonction porteuse probable, tout en signalant en note l’autre compréhension traditionnelle possible.
