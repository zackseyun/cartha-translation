  text: וַ/יַּ֤עַשׂ מִכְסֶה֙ לָ/אֹ֔הֶל עֹרֹ֥ת אֵלִ֖ים מְאָדָּמִ֑ים וּ/מִכְסֵ֛ה עֹרֹ֥ת תְּחָשִׁ֖ים מִ/לְ/מָֽעְלָ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/019.yaml
  text: He made a covering for the tent of ram skins dyed red[a], and a covering of fine leather above.
translation:
  language: fr
  text: Il fit pour la tente une couverture en peaux de béliers teintes en rouge, et, par-dessus, une couverture en peaux de tahash[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu תְּחָשִׁים (tehashim) est de sens incertain. Il a notamment été compris comme désignant des peaux de dugongs, de marsouins ou de blaireaux, ou encore un cuir fin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol de עשה poursuit le récit par une action passée. « Il fit » est naturel et digne en français.
- source_word: מִכְסֶה לָאֹהֶל
  choice: pour la tente une couverture
  rationale: מִכְסֶה désigne une couche de couverture et אֹהֶל le « tabernacle » en tant que tente; conserver « tente » reflète directement le lexème hébreu.
- source_word: עֹרֹת אֵלִים מְאָדָּמִים
  choice: en peaux de béliers teintes en rouge
  rationale: La formulation rend les peaux, l’animal mâle et l’idée explicite de peaux rougies ou teintes en rouge.
- source_word: וּמִכְסֵה
  choice: et … une couverture
  rationale: La répétition de « couverture » suit celle du texte hébreu sans introduire l’interprétation « une seconde couverture ».
- source_word: עֹרֹת תְּחָשִׁים
  choice: en peaux de tahash[a]
  rationale: L’identification de תְּחָשִׁים demeure incertaine. La translittération évite de transformer une hypothèse zoologique ou qualitative en certitude et la note expose les principales possibilités.
- source_word: מִלְמָעְלָה
  choice: par-dessus
  rationale: Dans ce contexte de couvertures superposées, « par-dessus » exprime naturellement la position de la couche supérieure.
