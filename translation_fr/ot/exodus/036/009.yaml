  text: אֹ֜רֶךְ הַ/יְרִיעָ֣ה הָֽ/אַחַ֗ת שְׁמֹנֶ֤ה וְ/עֶשְׂרִים֙ בָּֽ/אַמָּ֔ה וְ/רֹ֨חַב֙ אַרְבַּ֣ע בָּֽ/אַמָּ֔ה הַ/יְרִיעָ֖ה הָ/אֶחָ֑ת מִדָּ֥ה אַחַ֖ת לְ/כָל הַ/יְרִיעֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/009.yaml
  text: The length of each curtain was twenty-eight cubits[a], and the width of each curtain was four cubits[b]; all the curtains had one measurement.
translation:
  language: fr
  text: La longueur de chaque tenture était de vingt-huit coudées[a], et sa largeur de quatre coudées ; toutes les tentures avaient les mêmes dimensions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Une coudée mesurait approximativement 45 centimètres ; vingt-huit coudées correspondent donc à environ 12,6 mètres, et quatre coudées à environ 1,8 mètre.
    reason: unité_ancienne
lexical_decisions:
- source_word: אֹרֶךְ
  choice: longueur
  rationale: Équivalent nominal naturel pour une dimension physique.
- source_word: יְרִיעָה
  choice: tenture
  rationale: Dans le contexte du tabernacle, le mot désigne une grande pièce d’étoffe ; « tenture » est précis et naturel en français.
- source_word: הָאַחַת / הָאֶחָת
  choice: chaque
  rationale: 'Littéralement « l’une », avec ici une valeur distributive : les dimensions s’appliquent individuellement à toutes les tentures.'
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: vingt-huit
  rationale: Rendu normal du nombre en français moderne.
- source_word: אַמָּה
  choice: coudée
  rationale: L’unité ancienne est conservée plutôt que convertie de façon incertaine.
- source_word: רֹחַב
  choice: largeur
  rationale: Équivalent usuel et exact de la dimension opposée à la longueur.
- source_word: אַרְבַּע
  choice: quatre
  rationale: Rendu direct du nombre.
- source_word: מִדָּה אַחַת
  choice: les mêmes dimensions
  rationale: Littéralement « une seule mesure » ; dans ce contexte, l’expression indique que toutes les pièces avaient un format identique. Le pluriel français rend naturellement l’ensemble longueur-largeur.
- source_word: לְכָל הַיְרִיעֹת
  choice: toutes les tentures
  rationale: Rend clairement la portée collective de l’uniformité indiquée.
