  text: He made fifty bronze clasps to join the tent[a], so that it would be one.
translation:
  language: fr
  text: Il fit cinquante agrafes de bronze pour assembler la tente[a], afin qu’elle forme un seul ensemble.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le tabernacle », car la « tente » désigne ici la structure du tabernacle.
