lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol de עשה fait progresser le récit. Le passé simple convient au registre narratif biblique français tout en restant clair.
- source_word: קַרְסֵי
  choice: agrafes
  rationale: Le terme désigne des pièces d’attache reliant les éléments de la structure. « Agrafes » est précis, courant dans les traductions françaises et adapté au contexte.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Dans le contexte des matériaux du sanctuaire, נְחֹשֶׁת désigne conventionnellement le bronze, métal travaillé vraisemblablement visé ici.
- source_word: חֲמִשִּׁים
  choice: cinquante
  rationale: Nombre cardinal qualifiant directement les agrafes.
- source_word: לְחַבֵּר
  choice: pour assembler
  rationale: L’infinitif exprime le but. « Assembler » rend naturellement l’action de réunir les parties de la tente en une structure.
- source_word: אֶת הָאֹהֶל
  choice: la tente
  rationale: אֹהֶל signifie littéralement « tente ». Le contexte désigne la structure du tabernacle, précision conservée en note plutôt qu’introduite dans le texte.
- source_word: לִהְיוֹת אֶחָד
  choice: afin qu’elle forme un seul ensemble
  rationale: Littéralement « pour être un ». Cette formulation française exprime clairement l’unité structurelle résultant de l’assemblage sans suggérer une identité personnelle ou abstraite.
