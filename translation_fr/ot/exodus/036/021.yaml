  text: The length of each frame was ten cubits[a], and the width of each frame was a cubit and a half.
translation:
  language: fr
  text: Chaque cadre[a] avait dix coudées de long et une coudée et demie de large.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « planche » ; le mot hébreu désigne les pièces structurelles du tabernacle.
