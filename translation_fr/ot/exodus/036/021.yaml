lexical_decisions:
- source_word: עֶשֶׂר אַמֹּת אֹרֶךְ
  choice: dix coudées de long
  rationale: Cette formulation naturelle en français moderne exprime directement la mesure de longueur tout en conservant l’unité ancienne.
- source_word: הַקָּרֶשׁ
  choice: cadre
  rationale: Dans le contexte du tabernacle, קֶרֶשׁ désigne une pièce structurelle verticale. « Cadre » évite d’imposer l’image d’une simple planche pleine, tout en laissant « planche » comme possibilité réelle.
- source_word: וְאַמָּה וַחֲצִי הָאַמָּה
  choice: une coudée et demie
  rationale: Cette tournure française idiomatique rend fidèlement l’expression hébraïque « une coudée et la moitié de la coudée ».
- source_word: רֹחַב
  choice: de large
  rationale: La tournure adjectivale est plus naturelle en français que « une largeur de », sans modifier le sens dimensionnel.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: chaque cadre
  rationale: 'Dans ce contexte de dimensions répétées, « le cadre unique » a une valeur distributive : la mesure vaut pour chacun des éléments.'
