lexical_decisions:
- source_word: וַיְחַבֵּר
  choice: Il assembla
  rationale: Le verbe חָבַר signifie joindre ou relier. « Assembler » est naturel dans ce contexte de fabrication et n’indique pas une méthode de fixation plus précise que l’hébreu.
- source_word: הַיְרִיעֹת
  choice: tentures
  rationale: Dans le contexte du sanctuaire, יְרִיעָה désigne les grandes pièces d’étoffe formant la couverture. « Tentures » est un terme français établi, clair et adapté.
- source_word: לְבָד
  choice: à part
  rationale: 'לְבָד marque ici deux ensembles distincts : cinq tentures réunies en un ensemble et six en un autre.'
- source_word: חֲמֵשׁ
  choice: cinq
  rationale: Nombre cardinal rendu directement.
- source_word: שֵׁשׁ
  choice: six
  rationale: Nombre cardinal rendu directement.
- source_word: אֶת ... וְאֶת
  choice: deux compléments d’objet coordonnés
  rationale: Les marqueurs répétés structurent les cinq tentures et les six tentures comme deux objets coordonnés. « Les six autres » rend naturellement en français la seconde série au sein des onze tentures connues par le contexte.
