  text: Il assembla séparément cinq tentures, et séparément six tentures[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « à part » ; les cinq tentures formaient un ensemble, et les six tentures un autre ensemble.
