  text: וַ/יַּ֨עַשׂ֙ אֶת הַ/פָּרֹ֔כֶת תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר מַעֲשֵׂ֥ה חֹשֵׁ֛ב עָשָׂ֥ה אֹתָ֖/הּ כְּרֻבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/035.yaml
  text: And he made the curtain of blue[a], purple, and scarlet yarn, and fine twisted linen; he made it with cherubim[c][b], the work of a skillful designer.
translation:
  language: fr
  text: Il fit le rideau[a] en fils bleus, pourpres et écarlates[b], et en fin lin retors ; il y représenta des chérubins, œuvre d’un artisan habile[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le voile ».
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque traduite par « écarlates » désigne littéralement une matière ou des fils teints en écarlate ; « cramoisis » est aussi possible.
    reason: lexical_alternative
  - marker: c
    text: Ou « œuvre d’un artisan concepteur » ou « ouvrage à motifs ». L’hébreu désigne un travail artistique élaboré, sans préciser nécessairement la technique employée.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  choice: le rideau
  rationale: Le terme désigne la tenture intérieure qui séparait les espaces du sanctuaire. « Rideau » est naturel en français moderne, tandis que « voile » demeure une traduction traditionnelle possible.
- source_word: תְּכֵלֶת
  choice: fils bleus
  rationale: Le mot désigne ici une matière textile teinte en bleu. « Fils » explicite naturellement le support matériel commun aux trois couleurs.
- source_word: אַרְגָּמָן
  choice: pourpres
  rationale: Rendu usuel de cette matière teinte d’une couleur pourpre prestigieuse, accordé avec « fils ».
- source_word: תוֹלַעַת שָׁנִי
  choice: fils écarlates
  rationale: L’expression désigne une matière ou des fils teints en écarlate ; ce rendu conserve la couleur et explicite le contexte textile.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: fin lin retors
  rationale: « Fin lin » rend שֵׁשׁ et « retors » indique que les fils étaient assemblés par torsion, dans une formulation française consacrée et concise.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: œuvre d’un artisan habile
  rationale: La formule évoque un travail artistique élaboré et exécuté avec savoir-faire. Ce rendu reste accessible sans imposer une technique précise comme la broderie.
- source_word: כְּרֻבִים
  choice: des chérubins
  rationale: « Chérubins » est le terme biblique français établi pour ces êtres célestes représentés dans la tenture.
- source_word: עָשָׂה אֹתָהּ כְּרֻבִים
  choice: il y représenta des chérubins
  rationale: La syntaxe indique que les chérubins étaient intégrés au décor du rideau. « Représenta » exprime cela clairement sans préciser indûment s’ils étaient tissés ou brodés.
