base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/017.yaml
  text: He made fifty loops on the edge of the outer curtain in the first set[a], and he made fifty loops on the edge of the curtain of the second set.
translation:
  language: fr
  text: Il fit cinquante boucles sur le bord du rideau extérieur du premier assemblage[a], et il fit cinquante boucles sur le bord du rideau du second assemblage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « dans l’assemblage »; le terme hébreu désigne un ensemble de rideaux reliés entre eux. « Premier » est implicite par contraste avec le second assemblage mentionné ensuite.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: boucles
  rationale: Le nom désigne les boucles de tissu servant à relier les rideaux. « Boucles » est le terme français courant et n’ajoute pas la couleur bleue, absente de ce verset.
- source_word: שְׂפַת
  choice: bord
  rationale: Dans ce contexte textile, le mot désigne le bord d’un rideau; « bord » est naturel et précis en français moderne.
- source_word: יְרִיעָה
  choice: rideau
  rationale: Dans les descriptions du tabernacle, le terme désigne une grande pièce d’étoffe. « Rideau » maintient la terminologie usuelle et demeure clair.
- source_word: הַקִּיצֹנָה
  choice: extérieur
  rationale: L’adjectif indique le rideau situé à l’extrémité de l’ensemble. « Extérieur » exprime naturellement cette position sans introduire de précision étrangère au texte.
- source_word: בַּמַּחְבָּרֶת
  choice: du premier assemblage
  rationale: מַחְבָּרֶת désigne ici un ensemble de rideaux reliés. Le texte hébreu n’exprime pas explicitement « premier », mais la mention du second assemblage dans la proposition parallèle le rend implicite; la note signale la formulation plus littérale.
- source_word: הַחֹבֶרֶת הַשֵּׁנִית
  choice: du second assemblage
  rationale: Le participe substantivé apparenté à la racine « joindre », avec « second », désigne le second ensemble relié. Cette formulation française préserve le parallélisme et évite de transformer sans nécessité le groupe en proposition relative.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: Il fit… il fit
  rationale: La répétition du verbe est conservée afin de refléter la structure hébraïque; le passé simple convient au registre narratif biblique tout en restant intelligible.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le verset conserve la répétition hébraïque de « fit » et rend les termes techniques de façon cohérente, sans importer la mention de boucles bleues présente ailleurs.
