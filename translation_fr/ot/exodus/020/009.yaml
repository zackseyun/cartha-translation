  text: שֵׁ֤שֶׁת יָמִים֙ תַּֽעֲבֹ֔ד וְ/עָשִׂ֖יתָ כָּל מְלַאכְתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/009.yaml
  text: Six days you shall labor and do all your work,[a]
translation:
  language: fr
  text: Pendant six jours, tu travailleras et tu feras tout ton travail.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Six jours, tu travailleras et tu feras tout ton travail. »'
    reason: 'Variante syntaxique plus formelle : elle ne rend pas explicitement par une préposition française la valeur temporelle du groupe hébreu « six jours ».'
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Pendant six jours
  rationale: En français naturel, la durée s’exprime ici avec « pendant ». Cette préposition, bien qu’implicite en hébreu, rend clairement la valeur temporelle du groupe nominal.
- source_word: תַּעֲבֹד
  choice: tu travailleras
  rationale: Le qal de עבד signifie couramment « travailler, servir ». « Tu travailleras » garde ici la force directive de l’imparfait dans le cadre juridique du Décalogue.
- source_word: וְעָשִׂיתָ
  choice: et tu feras
  rationale: עשה a le sens large de « faire ». Le futur français coordonné convient au registre prescriptif et suit directement la formulation hébraïque.
- source_word: כָּל
  choice: tout
  rationale: Avec le nom masculin singulier « ouvrage », כָּל se rend naturellement par « tout ».
- source_word: מְלַאכְתֶּךָ
  choice: ton ouvrage
  rationale: מְלָאכָה désigne un travail, une tâche ou une activité. « Ouvrage » évite la répétition immédiate de « travailler » tout en conservant l’idée de l’ensemble du travail à accomplir.
theological_decisions:
- issue: Force directive de l’imparfait dans la législation sur le sabbat
  choice: tu travailleras
  alternative: tu peux travailler ; tu dois travailler
  rationale: Dans le Décalogue, la forme relève de l’instruction d’alliance, non d’une simple prédiction. Le futur français conserve le ton juridique sans réduire l’énoncé à une permission ni ajouter l’obligation explicite de « devoir ».
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier correspond aux formes hébraïques de deuxième personne du masculin singulier. « Ouvrage » conserve un registre légèrement solennel adapté au Décalogue sans devenir archaïque.
