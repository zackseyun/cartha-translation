base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/007.yaml
  text: You shall not bear the name of Yahweh your God falsely[a], for Yahweh will not leave unpunished the one who bears his name falsely.
translation:
  language: fr
  text: Tu ne porteras pas le nom de Yahweh, ton Dieu, d’une manière vaine ou mensongère[a], car Yahweh ne laissera pas impuni celui qui porte son nom d’une manière vaine ou mensongère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traduction traditionnelle : « Tu ne prendras pas le nom du Seigneur, ton Dieu, en vain. » L’hébreu dit littéralement « porter le nom… pour le vide/la fausseté » ; l’expression peut englober les faux serments, les invocations vides et le fait de se réclamer abusivement de Dieu.'
    reason: Préciser l’étendue sémantique de נשא et שָׁוְא, tout en conservant l’équivalent traditionnel sans imposer au texte principal une portée limitée à la parole.
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  choice: porteras / porte
  rationale: Le verbe נשא signifie concrètement « lever, porter ». « Porter » conserve cette image ainsi que la reprise exacte du verbe dans l’interdiction et sa motivation, sans réduire d’emblée le commandement à la seule prononciation du nom.
- source_word: שֵׁם / שְׁמוֹ
  choice: le nom / son nom
  rationale: « Nom » rend directement l’hébreu et peut désigner ici l’identité révélée, la réputation et l’autorité de Yahweh, non seulement sa prononciation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le singulier « ton » conserve l’adresse personnelle et l’aspect relationnel de la formule hébraïque.
- source_word: לַשָּׁוְא
  choice: pour tromper
  rationale: שָׁוְא couvre la fausseté, le vide et ce qui est sans valeur. Dans cette construction, « pour tromper » est naturel en français et exprime l’usage mensonger ou frauduleux du nom, tandis que la note signale l’étendue du terme.
- source_word: כִּי
  choice: car
  rationale: « Car » introduit clairement la raison qui fonde l’interdiction.
- source_word: יְנַקֶּה (נקה)
  choice: ne laissera pas impuni
  rationale: 'Cette formulation française courante communique la portée judiciaire du piel : Yahweh ne tiendra pas la personne pour quitte et ne l’exemptera pas de sanction.'
- source_word: אֲשֶׁר
  choice: celui qui
  rationale: La tournure désigne de manière générale toute personne correspondant à la proposition relative.
theological_decisions:
- issue: Portée de l’interdiction concernant le nom divin
  choice: Interdiction large de porter le nom de Yahweh à des fins trompeuses, vides ou mensongères
  alternative: Limiter le commandement aux faux serments, aux blasphèmes ou aux paroles profanes
  rationale: L’association de נשא (« porter »), שֵׁם (« nom ») et שָׁוְא (« fausseté, vide, vanité ») permet une portée plus large que la seule parole irrévérencieuse. Elle peut englober le faux serment, l’invocation vide et la représentation mensongère de Yahweh.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: « Yahweh » représente directement le nom personnel présent dans le texte hébreu et évite de le remplacer par un titre.
translation_notes:
  register: Français international moderne, sobre et solennel. Le futur à valeur impérative convient à la formulation des commandements. La répétition de « porte » et de « pour tromper » reproduit délibérément le parallélisme lexical hébreu.
