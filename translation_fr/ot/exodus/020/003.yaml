  text: לֹֽ֣א יִהְיֶֽה לְ/ךָ֛ אֱלֹהִ֥ים אֲחֵרִ֖ים עַל פָּנָֽ/יַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/003.yaml
  text: You shall have no other gods before me[a].
translation:
  language: fr
  text: Tu n’auras pas d’autres dieux devant moi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à côté de moi » ou « en ma présence ». L’hébreu dit littéralement « devant ma face ».
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: Tu n’auras pas
  rationale: La construction, littéralement « il n’y aura pas pour toi », exprime ici la possession dans une interdiction. « Tu n’auras pas » est naturel en français, conserve la force normative et respecte l’adresse au singulier.
- source_word: אֱלֹהִים
  choice: dieux
  rationale: Le nom pluriel, qualifié par « autres », désigne ici des divinités rivales. « Dieux » en donne le sens courant sans ajouter d’interprétation.
- source_word: אֲחֵרִים
  choice: d’autres
  rationale: L’adjectif signifie « autres ». La tournure « pas d’autres dieux » est idiomatique en français et n’ajoute pas la nuance plus précise de « étrangers ».
- source_word: עַל־פָּנָי
  choice: devant moi
  rationale: L’expression signifie littéralement « devant ma face ». « Devant moi » conserve son image relationnelle et sa polysémie, tandis que les sens possibles « à côté de moi » et « en ma présence » sont signalés en note.
theological_decisions:
- issue: Sens de עַל־פָּנָי dans le premier commandement
  choice: devant moi
  alternative: à côté de moi ; en ma présence
  rationale: L’expression hébraïque peut évoquer la présence spatiale et, dans ce contexte d’alliance, l’exclusivité. Le texte principal garde la formulation proche de l’image hébraïque sans réduire cette tension à une seule interprétation; la note présente les autres compréhensions possibles.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement singulier correspond à la deuxième personne masculine singulière de l’hébreu et à l’adresse directe du Décalogue.
