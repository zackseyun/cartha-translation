  text: לֹֽ֣א תַֽעֲשֶׂ֨ה לְ/ךָ֥ פֶ֨סֶל֙ וְ/כָל תְּמוּנָ֔ה אֲשֶׁ֤ר בַּ/שָּׁמַ֨יִם֙ מִ/מַּ֔עַל וַ/אֲשֶׁ֥ר בָּ/אָ֖רֶץ מִ/תָּ֑חַת וַ/אֲשֶׁ֥ר בַּ/מַּ֖יִם מִ/תַּ֥חַת לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/004.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[c][b], or in the waters under the earth.
translation:
  language: fr
  text: Tu ne te feras pas d’image sculptée[a], ni aucune représentation[b] de ce qui est dans les cieux en haut, sur la terre en bas[c], ou dans les eaux au-dessous de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « statue » ou « image taillée ». Le mot hébreu désigne spécifiquement une image sculptée ou taillée ; « idole » en préciserait déjà la fonction cultuelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « forme » ou « ressemblance ».
    reason: lexical_alternative
  - marker: c
    text: 'Le verset décrit les domaines de la création selon une représentation ancienne de l’univers : les cieux en haut, la terre en bas et les eaux au-dessous de la terre.'
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תַעֲשֶׂה
  choice: Tu ne te feras pas
  rationale: La négation לֹא avec l’inaccompli exprime ici une interdiction directe et solennelle. En français, le futur négatif conserve bien la force juridique du Décalogue; le pronom « te » rend en même temps לְךָ de façon naturelle.
- source_word: לְךָ
  choice: te
  rationale: Le datif d’intérêt indique que l’objet serait fabriqué pour soi. La tournure idiomatique « tu ne te feras pas » restitue cette nuance sans lourdeur.
- source_word: פֶסֶל
  choice: statue sculptée
  rationale: Le terme désigne une image façonnée, notamment par sculpture. « Statue sculptée » est concret et moderne; « idole » préciserait déjà la fonction cultuelle, tandis qu’« image taillée » peut suggérer à tort une simple image découpée.
- source_word: וְכָל תְּמוּנָה
  choice: ni aucune représentation
  rationale: תְּמוּנָה peut désigner une forme, une ressemblance ou une représentation. « Représentation » exprime clairement la portée visuelle du terme en français courant, sans réduire son sens à un type précis d’objet.
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: de ce qui est dans les cieux en haut
  rationale: « Les cieux » conserve le pluriel hébreu et « en haut » maintient l’organisation spatiale du passage.
- source_word: וַאֲשֶׁר בָּאָרֶץ מִתָּחַת
  choice: sur la terre en bas
  rationale: La préposition בְּ est rendue idiomatiquement par « sur » avec la terre. « En bas » répond directement à « en haut » et préserve le contraste vertical.
- source_word: וַאֲשֶׁר בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: ou dans les eaux au-dessous de la terre
  rationale: Cette formulation rend les eaux comme un domaine situé sous la terre et conserve l’imagerie spatiale du texte sans l’expliquer dans le corps du verset.
- source_word: וְ / וַ
  choice: ni / ou
  rationale: Les conjonctions hébraïques relient ici les éléments d’une liste interdite. Une coordination française variée évite une répétition mécanique de « et » tout en conservant la portée de chaque catégorie.
theological_decisions:
- issue: Portée de l’interdiction du deuxième commandement
  choice: Conserver l’interdiction de fabriquer une statue sculptée ou toute représentation tirée de l’ordre créé, sans ajouter dans le verset une finalité cultuelle explicite.
  alternative: Traduire par « idole » ou ajouter « pour l’adorer »; à l’inverse, formuler explicitement une interdiction absolue de tout art figuratif.
  rationale: Le verset nomme l’objet fabriqué et les domaines représentés, tandis que le verset suivant introduit l’acte de se prosterner et de servir. La traduction ne doit donc ni limiter d’avance l’interdiction au culte ni l’étendre explicitement à toute production artistique; elle laisse subsister la tension du texte et de son contexte immédiat.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le futur négatif rappelle le registre normatif du Décalogue sans archaïsme. La structure ternaire et les indications spatiales du texte hébreu sont conservées.
