base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/019.yaml
  text: And they said to Moses[a], “You speak with us, and we will listen; but let not God speak with us, lest we die.”
translation:
  language: fr
  text: 'Ils dirent à Moïse : « Toi, parle-nous, et nous écouterons[a]. Mais que Dieu ne nous parle pas, de peur que nous mourions. »


    [a] Ou : « nous entendrons ». Le verbe hébreu peut désigner le fait d’entendre, d’écouter attentivement ou de répondre par l’obéissance.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous entendrons ». Le verbe hébreu peut désigner le fait d’entendre, d’écouter attentivement ou de répondre par l’obéissance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ils dirent
  rationale: Le wayyiqtol fait progresser le récit par un passé simple. En français narratif, « Ils dirent » rend naturellement cette succession sans qu’un « et » initial soit nécessaire.
- source_word: אֶל־מֹשֶׁה
  choice: à Moïse
  rationale: Rend l’emploi directionnel courant de אֶל devant le nom propre.
- source_word: דַּבֵּר אַתָּה
  choice: Toi, parle-nous
  rationale: L’impératif accompagné du pronom explicite met Moïse en contraste avec Dieu. L’antéposition de « Toi » conserve cette insistance en français naturel.
- source_word: עִמָּנוּ
  choice: parle-nous
  rationale: Même si עִם signifie littéralement « avec », « parle avec nous » pourrait suggérer une conversation réciproque. Dans ce contexte de médiation, le datif français « nous » exprime naturellement les destinataires tout en évitant cette fausse implication.
- source_word: וְנִשְׁמָעָה
  choice: et nous écouterons
  rationale: La forme cohortative exprime ici la réponse volontaire attendue après l’impératif. « Écouterons » conserve mieux que le simple « entendrons » l’idée possible d’une écoute attentive et réceptive.
- source_word: וְאַל־יְדַבֵּר
  choice: Mais que … ne nous parle pas
  rationale: אַל avec l’imparfait porte une valeur prohibitive ou jussive. Cette tournure française restitue la demande et « Mais » marque clairement le contraste.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le contexte du Sinaï et le verbe au singulier désignent le Dieu d’Israël au singulier.
- source_word: פֶּן־נָמוּת
  choice: de peur que nous mourions
  rationale: פֶּן introduit une conséquence redoutée. La formulation française garde cette nuance sans transformer la crainte en certitude.
theological_decisions:
- issue: Référent et nombre de אֱלֹהִים
  choice: Dieu, au singulier
  alternative: des dieux
  rationale: Le contexte immédiat et la construction verbale au singulier imposent ici un référent singulier. Il s’agit d’une décision grammaticale et contextuelle.
- issue: Portée de שׁמע dans la réponse du peuple
  choice: écouterons
  alternative: entendrons ; obéirons
  rationale: Le verbe peut aller de l’audition à l’écoute réceptive, voire à l’obéissance. « Écouterons » préserve cette amplitude sans réduire le sens à l’audition ni expliciter trop fortement l’obéissance.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique sans être archaïque. L’ordre « Toi, parle-nous » rend l’emphase hébraïque, tandis que « de peur que nous mourions » conserve la solennité et la crainte exprimée sans employer le « ne » explétif, potentiellement ambigu pour certains lecteurs.
