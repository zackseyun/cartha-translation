  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : les deux verbes cultuels restent distincts, le nom Yahweh est conservé, et « un Dieu jaloux » convient à קַנָּא. Toutefois, « qui poursuis la faute des pères chez les enfants » n’est ni une collocation française naturelle ni une représentation suffisamment nette de פֹּקֵד עֲוֺן… עַל. Le verbe hébreu exprime une intervention de contrôle/jugement à l’égard de la faute, sans imposer à lui seul une explication complète de son mécanisme.'
  naturalness: Le verset est globalement fluide et de registre approprié. La formulation « poursuivre une faute chez les enfants » est en revanche inhabituelle et peut évoquer une enquête portant sur les fautes propres des enfants, plutôt que la formule intergénérationnelle du texte.
  terminology: « Te prosterneras », « les serviras », « Yahweh », « ton Dieu », « jaloux », « pères », « enfants » et « me haïssent » sont appropriés. « Fais retomber la faute » est plus idiomatique que « poursuis la faute » tout en évitant le terme plus interprétatif « punis ».
  issues:
