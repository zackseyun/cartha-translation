    issue: « qui poursuis la faute des pères chez les enfants »
    rationale: En français moderne, on ne « poursuit » normalement pas une faute « chez » quelqu’un. De plus, « chez les enfants » peut faire comprendre que Dieu recherche la faute des pères dans la conduite des enfants. « Fais retomber la faute des pères sur les enfants » rend plus clairement le rapport exprimé par עַל, sans convertir explicitement l’idiome en une théorie détaillée de la punition.
