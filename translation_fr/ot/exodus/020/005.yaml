  text: לֹֽא תִשְׁתַּחֲוֶ֥ה לָ/הֶ֖ם וְ/לֹ֣א תָעָבְדֵ֑/ם כִּ֣י אָֽנֹכִ֞י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵד עֲוֺ֨ן אָבֹ֧ת עַל בָּנִ֛ים עַל שִׁלֵּשִׁ֥ים וְ/עַל רִבֵּעִ֖ים לְ/שֹׂנְאָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/005.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, on the third and on the fourth generations of those who hate me[d][c][b],
translation:
  language: fr
  text: Tu ne te prosterneras pas devant elles[a] et tu ne les serviras pas[b], car moi, Yahweh, ton Dieu, je suis un Dieu jaloux, qui fais retomber la faute des pères sur les enfants[c], jusqu’à la troisième et à la quatrième génération de ceux qui me haïssent[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu ne t’inclineras pas devant elles » ; le verbe hébreu désigne le fait de se courber ou de se prosterner en signe de révérence.
    reason: lexical_alternative
  - marker: b
    text: Ou « tu ne leur rendras pas de culte » ; ici, « servir » peut désigner le service cultuel rendu aux idoles.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « qui visite la faute des pères sur les enfants ». L’idiome hébreu décrit l’intervention judiciaire de Dieu sans en préciser ici tout le mécanisme. Comparer Deutéronome 24.16 et Ézéchiel 18 au sujet de la responsabilité individuelle.'
    reason: cross_reference
  - marker: d
    text: Ou « sur la troisième et sur la quatrième génération de ceux qui me haïssent ».
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: te prosterneras
  rationale: Le verbe désigne concrètement le fait de s’incliner ou de se prosterner en signe de révérence. « Te prosterneras » conserve ce geste sans le confondre d’emblée avec le service cultuel exprimé par le verbe suivant.
- source_word: תָעָבְדֵם
  choice: les serviras
  rationale: עבד signifie fondamentalement « servir » et désigne ici le service cultuel rendu aux idoles. Cette traduction maintient la distinction lexicale avec l’acte de se prosterner.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le singulier maintient l’adresse personnelle faite à chaque membre du peuple dans le cadre de l’alliance.
- source_word: אֵל קַנָּא
  choice: un Dieu jaloux
  rationale: Dans le contexte de l’interdiction de l’idolâtrie, קַנָּא exprime l’exigence divine d’une fidélité exclusive. « Jaloux » en conserve la force relationnelle et la tension théologique.
- source_word: פֹּקֵד
  choice: qui poursuis
  rationale: Le participe פקד évoque ici l’intervention attentive et judiciaire de Dieu. « Poursuis » reste compréhensible en français et évite le calque obscur « visite », tout en étant moins explicatif que « punis ».
- source_word: עֲוֺן
  choice: faute
  rationale: עון peut désigner la faute, la culpabilité ou ses conséquences. « Faute » conserve la dimension morale tout en restant naturel en français moderne.
- source_word: אָבֹת
  choice: pères
  rationale: Le terme hébreu est explicitement masculin pluriel et appartient ici à une formule intergénérationnelle; « pères » en préserve la forme.
- source_word: בָּנִים
  choice: enfants
  rationale: Dans cette formule portant sur les générations successives, « enfants » exprime naturellement la descendance sans limiter le propos aux seuls fils mâles.
- source_word: שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: jusqu’à la troisième et à la quatrième génération
  rationale: Les ordinaux hébreux désignent elliptiquement des générations. L’ajout de « génération » explicite le sens en français, tandis que la reprise de « à la » reflète le rythme hébreu.
- source_word: לְשֹׂנְאָי
  choice: de ceux qui me haïssent
  rationale: Cette formulation rattache naturellement l’avertissement à ceux qui persistent dans une relation d’hostilité envers Dieu, sans supprimer l’ambiguïté de la portée exacte du complément.
theological_decisions:
- issue: Expression de la jalousie divine
  choice: un Dieu jaloux
  alternative: un Dieu passionné / exigeant une fidélité exclusive
  rationale: Le contexte est celui de l’exclusivité de l’alliance face aux idoles. « Jaloux » préserve la revendication relationnelle forte du texte au lieu de l’adoucir.
- issue: Jugement intergénérationnel
  choice: qui poursuis la faute des pères chez les enfants
  alternative: qui punis les enfants pour la faute des pères / qui demande compte aux enfants de la faute des pères
  rationale: La formulation retenue conserve la tension de l’idiome hébreu sans préciser davantage que le texte la manière dont la faute atteint les générations suivantes. La note permet de signaler la formulation littérale et les textes bibliques relatifs à la responsabilité individuelle.
- issue: Portée des troisième et quatrième générations
  choice: jusqu’à la troisième et à la quatrième génération de ceux qui me haïssent
  alternative: sur les enfants, sur les troisièmes et sur les quatrièmes, pour ceux qui me haïssent
  rationale: Le français explicite l’ellipse générationnelle tout en conservant le rattachement possible de « ceux qui me haïssent » à l’ensemble des générations concernées.
translation_notes:
  register: Français international moderne, digne et directement intelligible. Le tutoiement singulier respecte l’adresse hébraïque. La formulation conserve les répétitions significatives et la tension du jugement intergénérationnel, tout en évitant un calque principal devenu obscur en français.
