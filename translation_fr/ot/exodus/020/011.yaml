  text: כִּ֣י שֵֽׁשֶׁת יָמִים֩ עָשָׂ֨ה יְהוָ֜ה אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֗רֶץ אֶת הַ/יָּם֙ וְ/אֶת כָּל אֲשֶׁר בָּ֔/ם וַ/יָּ֖נַח בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֑י עַל כֵּ֗ן בֵּרַ֧ךְ יְהוָ֛ה אֶת י֥וֹם הַ/שַּׁבָּ֖ת וַֽ/יְקַדְּשֵֽׁ/הוּ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/011.yaml
  text: For in six days Yahweh made the heavens and the earth[a], the sea, and all that is in them, and he rested on the seventh day. Therefore Yahweh blessed the Sabbath day and made it holy.
translation:
  language: fr
  text: Car en six jours, Yahvé a fait les cieux, la terre, la mer et tout ce qui s’y trouve, puis il s’est reposé[a] le septième jour. C’est pourquoi Yahvé a béni le jour du sabbat et l’a rendu saint.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il a cessé son activité ». Le verbe hébreu peut mettre l’accent sur l’entrée dans le repos ou sur la cessation du travail.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde le commandement du sabbat au verset précédent.
- source_word: שֵׁשֶׁת יָמִים
  choice: en six jours
  rationale: Rend naturellement en français la période durant laquelle l’œuvre créatrice est accomplie, sans préciser davantage la nature de ces jours.
- source_word: עָשָׂה
  choice: a fait
  rationale: Le verbe עשה est large (« faire, réaliser ») ; « a fait » reste proche de l’hébreu et convient aux compléments énumérés.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit en français moderne le nom divin יהוה plutôt que de lui substituer un titre.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: les cieux, la terre
  rationale: Conserve le pluriel hébreu de שׁמים et le sens cosmique de ארץ dans la formule de création.
- source_word: הַיָּם
  choice: la mer
  rationale: Respecte le singulier hébreu dans l’énumération des domaines créés.
- source_word: כָּל אֲשֶׁר בָּם
  choice: tout ce qui s’y trouve
  rationale: Expression française claire et globale, où « y » renvoie aux domaines de la création qui viennent d’être énumérés.
- source_word: וַיָּנַח
  choice: il s’est reposé
  rationale: Rend le sens principal de נוח dans le contexte du sabbat ; la possibilité de comprendre « il a cessé son activité » est conservée en note.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: le septième jour
  rationale: Formulation temporelle idiomatique en français.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Marque clairement la conséquence tirée du modèle de la création.
- source_word: בֵּרַךְ
  choice: a béni
  rationale: Équivalent français direct de ברך, indiquant que Dieu a accordé sa bénédiction à ce jour.
- source_word: וַיְקַדְּשֵׁהוּ
  choice: l’a rendu saint
  rationale: Exprime l’action de consacrer ou de mettre à part le jour comme saint, tout en restant compréhensible pour un lectorat général.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu emploie le nom propre divin. « Yahvé » en est la forme française courante et évite de remplacer le nom par un titre.
- issue: Description de l’arrêt de l’activité divine au septième jour
  choice: il s’est reposé
  alternative: il a cessé son activité
  rationale: נוח peut évoquer le repos ou la cessation après une œuvre. Le texte principal retient le rendu français naturel dans le contexte du sabbat, sans suggérer que Dieu était fatigué ; la note préserve l’autre nuance lexicale.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe demeure proche de l’hébreu tout en évitant une accumulation pesante de conjonctions. Le marqueur [a] est placé après le segment auquel la variante lexicale se rapporte.
