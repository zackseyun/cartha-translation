base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/024.yaml
  text: You shall make for me an altar of earth[a], and on it you shall sacrifice your burnt offerings and your peace offerings, your flock and your herd. In every place where I cause my name to be remembered, I will come to you and bless you.
translation:
  language: fr
  text: Tu me feras un autel de terre, et tu y sacrifieras tes holocaustes et tes sacrifices de paix, ton petit bétail et ton gros bétail. En tout lieu où je ferai que mon nom soit rappelé[a], je viendrai à toi et je te bénirai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « où je proclamerai mon nom », « où je ferai mentionner mon nom » ou « où je ferai inscrire mon nom ». Le verbe hébreu est causatif ; il peut évoquer le fait de rappeler, de mentionner, de proclamer ou de consigner le nom de Dieu.
    reason: Alternative lexicale destinée à préserver l’ambiguïté du verbe hébreu.
lexical_decisions:
- source_word: מִזְבַּח אֲדָמָה
  choice: un autel de terre
  rationale: Le groupe construit désigne concrètement un autel fait de terre ou de sol. Cette formulation reste proche de l’hébreu et naturelle en français.
- source_word: תַּעֲשֶׂה לִּי
  choice: Tu me feras
  rationale: Dans ce contexte juridique, l’inaccompli à la deuxième personne exprime une prescription. Le pronom « me » conserve la destination de l’autel à Dieu.
- source_word: וְזָבַחְתָּ עָלָיו
  choice: et tu y sacrifieras
  rationale: Le verbe désigne ici l’acte sacrificiel, et « y » reprend naturellement l’autel mentionné.
- source_word: עֹלֹתֶיךָ
  choice: tes holocaustes
  rationale: « Holocaustes » est le terme cultuel français usuel pour les offrandes entièrement consumées.
- source_word: שְׁלָמֶיךָ
  choice: tes sacrifices de paix
  rationale: Cette traduction conserve le lien lexical avec la paix, l’intégrité et le bien-être sans réduire le sacrifice à la seule idée de communion.
- source_word: אֶת צֹאנְךָ וְאֶת בְּקָרֶךָ
  choice: ton petit bétail et ton gros bétail
  rationale: Les termes hébreux désignent deux catégories d’animaux domestiques plutôt que les seuls moutons et bovins. Cette formulation en préserve l’étendue.
- source_word: בְּכָל הַמָּקוֹם
  choice: En tout lieu
  rationale: La formulation rend la valeur distributive de l’expression hébraïque dans un français soutenu mais courant.
- source_word: אֲשֶׁר אַזְכִּיר אֶת שְׁמִי
  choice: où je ferai que mon nom soit rappelé
  rationale: La tournure causative préserve le hiphil de זכר et l’initiative divine, sans limiter le sens à la proclamation, à l’inscription ou à l’invocation.
- source_word: אָבֹא אֵלֶיךָ וּבֵרַכְתִּיךָ
  choice: je viendrai à toi et je te bénirai
  rationale: La traduction rend directement l’approche de Dieu et la bénédiction promise, avec les sujets et objets explicitement marqués.
theological_decisions:
- issue: Sens de l’action divine dans אֲשֶׁר אַזְכִּיר אֶת שְׁמִי
  choice: où je ferai que mon nom soit rappelé
  alternative: où je proclamerai mon nom ; où je ferai mentionner mon nom ; où je ferai inscrire mon nom
  rationale: La traduction principale maintient la causalité grammaticale et l’initiative de Dieu dans la désignation du lieu, tout en laissant ouverte la manière précise dont son nom y est rappelé ou mentionné.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond au singulier hébreu adressé à Israël. Les termes cultuels « holocaustes » et « sacrifices de paix » conservent les distinctions du texte source ; « petit bétail » et « gros bétail » évitent de restreindre indûment les catégories animales.
