  terminology: « Autel de terre », « holocaustes » et « sacrifices de paix » sont des équivalents cultuels français précis et établis. La note liée à « rappelé » expose convenablement les possibilités sémantiques sans trancher indûment entre mémorialisation, mention, proclamation ou inscription.
