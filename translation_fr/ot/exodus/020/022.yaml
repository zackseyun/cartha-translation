source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כֹּ֥ה תֹאמַ֖ר אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל אַתֶּ֣ם רְאִיתֶ֔ם כִּ֚י מִן הַ/שָּׁמַ֔יִם דִּבַּ֖רְתִּי עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/022.yaml
  text: 'Then Yahweh said to Moses[c][b][a], “Thus you shall say to the sons of Israel: You yourselves have seen that I have spoken to you from heaven.”'
translation:
  language: fr
  text: 'Puis Yahweh dit à Moïse : « Voici ce que tu diras aux fils d’Israël[a] : Vous avez vu vous-mêmes que je vous ai parlé du ciel[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux Israélites » ou « aux enfants d’Israël ». L’hébreu dit littéralement « aux fils d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « j’ai parlé avec vous des cieux », ce qui peut souligner le caractère direct de la rencontre.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé dans l’hébreu, plutôt que de le remplacer par un titre.
- source_word: וַיֹּאמֶר
  choice: Puis … dit
  rationale: Le waw consécutif fait avancer le récit; « Puis » en restitue naturellement la progression en français.
- source_word: כֹּה תֹאמַר
  choice: Voici ce que tu diras
  rationale: Formulation française naturelle et digne de la formule de messager, sans archaïsme inutile.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: Conserve la forme littérale masculine de l’hébreu tout en laissant entendre sa portée collective; une note signale les équivalents idiomatiques.
- source_word: אַתֶּם רְאִיתֶם
  choice: Vous avez vu vous-mêmes
  rationale: Le pronom indépendant אַתֶּם renforce le sujet déjà contenu dans le verbe; « vous-mêmes » rend cette emphase testimoniale.
- source_word: כִּי
  choice: que
  rationale: Introduit ici le contenu de ce qu’Israël a constaté, plutôt qu’une cause.
- source_word: מִן הַשָּׁמַיִם
  choice: depuis le ciel
  rationale: « Depuis » marque le point d’origine de la parole, et le singulier « le ciel » est l’expression idiomatique française dans ce contexte.
- source_word: דִּבַּרְתִּי עִמָּכֶם
  choice: je vous ai parlé
  rationale: En français courant, « parler à quelqu’un » rend naturellement l’acte d’adresser la parole; l’hébreu emploie toutefois עִם, littéralement « avec », nuance conservée en note.
theological_decisions:
- issue: Traduction du nom divin YHWH
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme; sa transcription préserve le nom personnel sans lui substituer un titre.
- issue: Désignation collective בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites; les enfants d’Israël
  rationale: La traduction conserve la forme de l’expression hébraïque sans nier qu’elle désigne collectivement le peuple d’Israël.
- issue: Portée relationnelle de עִמָּכֶם
  choice: je vous ai parlé
  alternative: j’ai parlé avec vous
  rationale: La tournure française choisie est idiomatique, tandis que la note préserve la nuance d’une rencontre directe suggérée par la préposition « avec ».
translation_notes:
  register: Français international moderne, digne et accessible. La formule de messager est rendue idiomatiquement; l’emphase du pronom hébreu est maintenue par « vous-mêmes ». Les notes conservent les formes littérales susceptibles d’éclairer l’expression collective, la rencontre directe et le pluriel hébreu « les cieux ».
