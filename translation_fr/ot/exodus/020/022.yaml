  verdict: revise
  source_fidelity: 'Le sens général est fidèle : le nom divin, la formule adressée à Moïse, l’emphase de « vous-mêmes », la désignation « fils d’Israël » et la parole divine sont bien rendus. Toutefois, « depuis le ciel » peut se comprendre temporellement en français (« depuis lors »), alors que מִן indique ici clairement la provenance. « Du ciel » est plus exact et plus idiomatique. La note doit employer la même formulation pour la forme plurielle hébraïque.'
