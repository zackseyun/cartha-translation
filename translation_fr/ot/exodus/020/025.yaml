  text: וְ/אִם מִזְבַּ֤ח אֲבָנִים֙ תַּֽעֲשֶׂה לִּ֔/י לֹֽא תִבְנֶ֥ה אֶתְ/הֶ֖ן גָּזִ֑ית כִּ֧י חַרְבְּ/ךָ֛ הֵנַ֥פְתָּ עָלֶ֖י/הָ וַ/תְּחַֽלְלֶֽ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/025.yaml
  text: And if you make for me an altar of stones[a], you shall not build it of cut stones; for if you wield your sword on it[b], you will profane it.
translation:
  language: fr
  text: Et si tu me fais un autel de pierres, tu ne le bâtiras pas en pierres taillées ; car si tu brandis ton épée sur elle[a], tu la profaneras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici des suffixes féminins singuliers (« sur elle », « tu la profaneras »), qui peuvent renvoyer à une pierre implicitement prise au singulier plutôt qu’à l’autel. « Épée » peut désigner, dans ce contexte, une lame ou un outil métallique employé pour travailler la pierre.
    reason: Préserve l’ambiguïté grammaticale du texte hébreu et explique l’emploi contextuel de « épée » sans le remplacer dans le texte principal.
lexical_decisions:
- source_word: וְאִם
  choice: Et si
  rationale: Conserve à la fois le lien avec l’instruction précédente et la valeur conditionnelle.
- source_word: מִזְבַּח אֲבָנִים
  choice: un autel de pierres
  rationale: Rend directement le groupe construit hébreu dans un français naturel.
- source_word: תַּעֲשֶׂה לִּי
  choice: tu me fais
  rationale: Expression française concise et naturelle qui conserve la relation exprimée par לִי.
- source_word: לֹא תִבְנֶה אֶתְהֶן גָּזִית
  choice: tu ne le bâtiras pas en pierres taillées
  rationale: Le pronom hébreu est formellement féminin pluriel et renvoie aux pierres, mais le français exige ici une formulation idiomatique centrée sur l’autel; « pierres taillées » exprime clairement גָּזִית.
- source_word: חַרְבְּךָ
  choice: ton épée
  rationale: Conserve le sens lexical explicite de חֶרֶב sans le remplacer dans le texte par l’interprétation contextuelle « outil métallique ».
- source_word: הֵנַפְתָּ עָלֶיהָ
  choice: tu lèves ton épée sur l’une d’elles
  rationale: Rend au plus près le verbe « lever/brandir » et le suffixe féminin singulier, qui renvoie vraisemblablement à une pierre de l’ensemble.
- source_word: וַתְּחַלְלֶהָ
  choice: tu la profaneras
  rationale: Préserve la portée cultuelle de חלל et le référent féminin singulier, probablement la pierre touchée.
theological_decisions:
- issue: Nature de la profanation
  choice: Conserver explicitement la notion cultuelle de profanation liée au passage de l’épée sur une pierre de l’autel.
  alternative: Expliquer qu’il s’agit soit d’éviter la violence associée aux armes, soit de préserver la simplicité de l’autel.
  rationale: Le texte affirme la profanation au moyen de חלל, mais n’en expose pas la raison symbolique complète; la traduction ne doit donc pas trancher entre ces explications.
- issue: Référent des suffixes féminins singuliers עָלֶיהָ et וַתְּחַלְלֶהָ
  choice: Les rapporter à une pierre particulière parmi les pierres de l’autel.
  alternative: Les rapporter globalement à l’autel.
  rationale: La morphologie féminine singulière s’accorde naturellement avec אֶבֶן sous-entendu, tandis que מִזְבֵּחַ est masculin. Cette lecture préserve plus précisément les accords du texte hébreu.
translation_notes:
  register: Tutoiement singulier conforme à l’adresse hébraïque. Style juridique, sobre et digne. « Bâtir » convient à la construction d’un autel; « profaner » maintient le vocabulaire de sainteté. La ponctuation française emploie une espace avant le point-virgule.
