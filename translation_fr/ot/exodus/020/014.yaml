  text: You shall not commit adultery.
translation:
  language: fr
  text: Tu ne commettras pas d’adultère.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא
  choice: ne… pas
  rationale: La négation hébraïque לֹא, suivie de l’inaccompli, exprime ici une interdiction catégorique. En français, la tournure « Tu ne… pas » rend naturellement la forme solennelle et durable du Décalogue.
- source_word: תִּנְאָף
  choice: commettras d’adultère
  rationale: Le verbe נאף au qal signifie « commettre un adultère ». Cette expression est précise, courante dans le registre juridique et moral, et fidèle au contexte prohibitif.
theological_decisions:
- issue: Formulation de l’interdiction dans le Décalogue
  choice: Tu ne commettras pas d’adultère.
  alternative: Ne commets pas d’adultère.
  rationale: L’hébreu emploie לֹא avec l’inaccompli à la deuxième personne du masculin singulier. Le futur français à valeur injonctive conserve mieux la solennité et la portée durable de la formule d’alliance, sans devenir obscur.
- issue: Portée du masculin singulier hébreu
  choice: 'Deuxième personne du singulier générique : « Tu »'
  alternative: Formulation explicitement adressée à un homme
  rationale: La forme hébraïque est masculine singulière, mais elle s’adresse de manière représentative au membre de la communauté de l’alliance. Le français « tu » préserve le nombre et l’adresse directe sans ajouter une restriction de portée aux seuls hommes.
translation_notes:
  register: Français international moderne, concis et digne. La formulation traditionnelle demeure immédiatement compréhensible et correspond au registre solennel du Décalogue.
