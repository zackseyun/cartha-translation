  text: Tu ne commettras pas de meurtre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, dans un sens plus large : « Tu ne tueras pas. » Toutefois, le verbe hébreu employé ici désigne généralement une mise à mort illicite, ou un meurtre, plutôt que toute forme de mise à mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: ne… pas
  rationale: La particule de négation introduit ici une interdiction catégorique. En français, le futur à valeur injonctive, avec « ne… pas », restitue naturellement la formulation solennelle du Décalogue.
- source_word: תִּרְצָח
  choice: commettras de meurtre
  rationale: Le verbe רצח désigne généralement le fait de tuer un être humain de manière illicite, plutôt que toute mise à mort sans distinction. « Commettre un meurtre » en exprime la portée avec précision et dans un français naturel et digne.
theological_decisions:
- issue: Étendue de l’interdiction dans le Décalogue
  choice: Traduire רצח par « commettre un meurtre »
  alternative: « Tu ne tueras pas »
  rationale: Cette formulation évite de transformer le commandement en interdiction absolue de toute mise à mort, portée plus large que celle du verbe hébreu dans ce contexte juridique, tout en conservant pleinement sa force morale.
translation_notes:
  register: Français international moderne, clair et solennel. Le futur injonctif maintient la forme traditionnelle et juridique du commandement sans archaïsme marqué.
