  text: וַ/יֹּ֨אמֶר מֹשֶׁ֣ה אֶל הָ/עָם֮ אַל תִּירָאוּ֒ כִּ֗י לְ/בַֽ/עֲבוּר֙ נַסּ֣וֹת אֶתְ/כֶ֔ם בָּ֖א הָ/אֱלֹהִ֑ים וּ/בַ/עֲב֗וּר תִּהְיֶ֧ה יִרְאָת֛/וֹ עַל פְּנֵי/כֶ֖ם לְ/בִלְתִּ֥י תֶחֱטָֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/020.yaml
  text: And Moses said to the people[a], “Do not fear, for God has come to test you, and so that the fear of him may be before you[c][b], so that you may not sin.”
translation:
  language: fr
  text: 'Moïse dit au peuple : « Ne craignez pas[a], car Dieu est venu pour vous mettre à l’épreuve et pour que sa crainte soit devant vous[b][c], afin que vous ne péchiez pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « N’ayez pas peur ». L’hébreu emploie ici la même racine que plus loin dans l’expression « sa crainte », créant un contraste entre la panique et une juste crainte de Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « la révérence pour lui ». Le nom hébreu peut désigner aussi bien la peur que la crainte révérencielle.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « sur vos faces », expression qui évoque quelque chose que l’on garde devant soi ou qui demeure présent à la conscience.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָאוּ
  choice: N’ayez pas peur
  rationale: Le verbe ירא peut exprimer la peur, l’effroi ou la révérence. Cette formulation est naturelle en français et conserve la racine lexicale de « peur/crainte » qui réapparaît plus loin dans le verset.
- source_word: לְבַעֲבוּר נַסּוֹת אֶתְכֶם
  choice: pour vous mettre à l’épreuve
  rationale: La construction exprime le but. « Mettre à l’épreuve » rend נסה clairement, sans suggérer que Dieu incite au mal.
- source_word: בָּא הָאֱלֹהִים
  choice: Dieu est venu
  rationale: Le parfait בָּא décrit la venue de Dieu dans la scène présente au Sinaï; le passé composé convient naturellement en français.
- source_word: וּבַעֲבוּר
  choice: et pour que
  rationale: La seconde occurrence introduit elle aussi un but, cette fois devant une proposition à verbe conjugué.
- source_word: יִרְאָתוֹ
  choice: sa crainte
  rationale: « Crainte » préserve le lien avec la peur mentionnée au début tout en laissant ouverte la nuance d’effroi ou de respect révérenciel.
- source_word: עַל־פְּנֵיכֶם
  choice: devant vous
  rationale: Littéralement « sur vos faces »; « devant vous » conserve l’image hébraïque dans un français compréhensible et peut évoquer ce qui demeure présent à la conscience.
- source_word: לְבִלְתִּי תֶחֱטָאוּ
  choice: afin que vous ne péchiez pas
  rationale: Cette formulation rend nettement la finalité négative de la construction hébraïque.
theological_decisions:
- issue: Tension apparente entre l’interdiction d’avoir peur et la crainte de Dieu
  choice: Conserver les termes apparentés « peur » et « crainte » dans le texte principal
  alternative: « Ne soyez pas effrayés » et « le respect que vous lui devez »
  rationale: L’hébreu emploie la même racine dans les deux expressions et oppose ainsi la panique à une crainte durable de Dieu. La traduction maintient cette tension sans la résoudre par une interprétation.
- issue: Nature de la mise à l’épreuve divine
  choice: « vous mettre à l’épreuve »
  alternative: « vous éprouver » ou « vous tester »
  rationale: Cette expression indique une épreuve destinée à révéler ou affermir, sans introduire l’idée d’une incitation au mal.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme des propositions de but est conservé, ainsi que la tension lexicale entre la peur interdite et la crainte de Dieu.
