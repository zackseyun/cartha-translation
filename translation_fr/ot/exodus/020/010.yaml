base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/010.yaml
  text: but the seventh day is a Sabbath to Yahweh your God[a]; you shall not do any work—you, or your son, or your daughter, your male servant, or your female servant, or your livestock[c][b], or the sojourner within your gates.
translation:
  language: fr
  text: mais le septième jour est un sabbat consacré à Yahweh, ton Dieu[a]. Tu ne feras aucun travail, ni toi, ni ton fils, ni ta fille, ni ton esclave masculin, ni ton esclave féminine[b], ni ton bétail, ni l’immigré qui réside dans tes villes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et le septième jour ». La conjonction hébraïque peut se traduire des deux manières ; « mais » souligne le contraste avec les six jours de travail du verset précédent.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu distingue ici « ton esclave masculin » et « ton esclave féminine ». On traduit aussi traditionnellement par « ton serviteur et ta servante ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « l’immigré qui est dans tes portes ». Dans ce contexte, les « portes » représentent les villes ou localités relevant de la communauté.
    reason: cultural_and_idiomatic_clarification
lexical_decisions:
- source_word: וְיוֹם הַשְּׁבִיעִי
  choice: mais le septième jour
  rationale: La conjonction וְ peut simplement signifier « et », mais « mais » exprime naturellement en français le contraste avec les six jours de travail mentionnés au verset précédent.
- source_word: שַׁבָּת לַיהוָה אֱלֹהֶיךָ
  choice: un sabbat consacré à Yahweh, ton Dieu
  rationale: « Sabbat » conserve le nom hébreu plutôt que de le réduire à la seule idée de repos. Le complément introduit par לְ marque ici la destination ou la consécration du jour à Yahweh.
- source_word: לֹא תַעֲשֶׂה כָל מְלָאכָה
  choice: Tu ne feras aucun travail
  rationale: Le futur à valeur injonctive rend avec dignité la force juridique de l’interdiction; « aucun travail » exprime la portée globale de כָל.
- source_word: עַבְדְּךָ וַאֲמָתְךָ
  choice: ton esclave, homme ou femme
  rationale: Les deux termes désignent respectivement un homme et une femme en condition servile. Cette formulation française rend les deux catégories sans masquer la réalité sociale du texte.
- source_word: וּבְהֶמְתֶּךָ
  choice: ton bétail
  rationale: Le nom collectif désigne ici les animaux domestiques appartenant au foyer; « bétail » est précis et courant.
- source_word: וְגֵרְךָ אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: l’immigré qui réside dans tes villes
  rationale: גֵּר désigne un non-Israélite établi parmi la population. L’expression « dans tes portes » renvoie idiomatiquement aux localités placées sous l’autorité de la communauté; « dans tes villes » en transmet le sens en français actuel.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme, nom d’alliance de Dieu. « Yahweh » le distingue du titre אֱלֹהֶיךָ, rendu par « ton Dieu ».
- issue: Étendue sociale du commandement du sabbat
  choice: Maintenir explicitement l’inclusion des enfants, des esclaves, du bétail et de l’immigré résident
  alternative: Généraliser en parlant seulement de toute la maisonnée
  rationale: L’énumération hébraïque étend expressément l’interdiction à chacun de ces groupes; la conserver évite de limiter le commandement au seul chef de foyer.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reproduit l’adresse directe de l’hébreu. La formulation reste proche de la structure juridique du commandement tout en rendant idiomatiquement les catégories sociales et l’expression « dans tes portes ».
