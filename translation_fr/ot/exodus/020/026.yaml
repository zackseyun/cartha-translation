source:
  edition: WLC
  text: וְ/לֹֽא תַעֲלֶ֥ה בְ/מַעֲלֹ֖ת עַֽל מִזְבְּחִ֑/י אֲשֶׁ֛ר לֹֽא תִגָּלֶ֥ה עֶרְוָתְ/ךָ֖ עָלָֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/026.yaml
  text: And you shall not go up by steps to my altar[a], so that your nakedness may not be exposed on it.
translation:
  language: fr
  text: Tu ne monteras pas à mon autel par des marches, afin que ta nudité ne soit pas exposée sur lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de peur que ta nudité ne soit découverte sur lui ».'
    reason: La proposition finale peut être rendue comme un but négatif (« afin que… ne… pas ») ou par « de peur que ». « Soit découverte » conserve l’alternative lexicale du niphal passif de גלה.
lexical_decisions:
- source_word: תַעֲלֶה
  choice: tu ne monteras pas
  rationale: Le verbe עלה signifie « monter ». Avec לֹא, le futur français exprime naturellement ici une interdiction ferme adressée à une personne au singulier.
- source_word: בְמַעֲלֹת
  choice: par des marches
  rationale: מַעֲלוֹת désigne des marches ou un escalier ; « par des marches » rend la construction avec בְּ de façon naturelle.
- source_word: מִזְבְּחִי
  choice: mon autel
  rationale: Rendu direct de מִזְבֵּחַ avec le suffixe de première personne du singulier.
- source_word: אֲשֶׁר לֹא
  choice: afin que … ne … pas
  rationale: Dans ce contexte, la proposition indique le but ou le résultat à éviter. Cette formulation reste claire en français moderne sans employer une tournure vieillie.
- source_word: תִּגָּלֶה
  choice: ne soit pas découverte
  rationale: 'Le niphal de גלה a ici un sens passif : « être découverte, exposée ». Le passif français conserve cette valeur.'
- source_word: עֶרְוָתְךָ
  choice: ta nudité
  rationale: עֶרְוָה désigne la nudité, avec une implication de pudeur corporelle, sans préciser davantage les parties du corps.
- source_word: עָלָיו
  choice: y
  rationale: Le pronom renvoie à l’autel. « Y » exprime naturellement en français le rapport à cet autel sans lourdeur.
theological_decisions:
- issue: Motif de l’interdiction des marches menant à l’autel
  choice: Le texte présente l’interdiction comme visant à empêcher que la nudité de l’adorateur soit découverte en rapport avec l’autel.
  alternative: Y voir explicitement un symbole d’humilité ou une prescription visant précisément les vêtements sacerdotaux.
  rationale: Le texte hébreu mentionne directement l’exposition de la nudité, mais n’en donne pas d’explication symbolique et ne précise pas ici le type de vêtement concerné.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement singulier respecte l’adresse hébraïque au singulier. « Nudité » conserve la retenue et la portée du terme source sans l’atténuer ni le surinterpréter.
