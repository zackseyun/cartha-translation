  text: זָכ֛וֹר אֶת י֥וֹם הַ/שַּׁבָּ֖ת לְ/קַדְּשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/008.yaml
  text: Remember the Sabbath day[a], to keep it holy.
translation:
  language: fr
  text: Souviens-toi du jour du sabbat pour le sanctifier[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour le garder saint » ou « pour le mettre à part comme saint ».
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכוֹר
  choice: Souviens-toi
  rationale: Impératif qal masculin singulier de זכר. « Souviens-toi » rend directement l’appel à une mémoire active, avec sa portée d’alliance, sans réduire le commandement à la seule observance.
- source_word: אֶת
  choice: '[marque de l’objet direct, non traduite]'
  rationale: Cette particule introduit en hébreu un objet direct défini et n’appelle pas de mot distinct en français.
- source_word: יוֹם
  choice: jour
  rationale: Sens courant de יוֹם, ici dans l’expression définie « le jour du sabbat ».
- source_word: הַשַּׁבָּת
  choice: du sabbat
  rationale: « Sabbat » est l’équivalent français établi de שַׁבָּת et désigne ici le jour déterminé de cessation consacré dans l’alliance.
- source_word: לְקַדְּשׁוֹ
  choice: pour le garder saint
  rationale: 'L’infinitif construit de קדשׁ avec suffixe masculin singulier exprime le but : se souvenir de ce jour en vue de le considérer et de le maintenir comme saint. Cette formulation naturelle conserve explicitement la notion de sainteté.'
theological_decisions:
- issue: Rendu du vocabulaire de קדשׁ dans le commandement relatif au sabbat
  choice: pour le garder saint
  alternative: pour le sanctifier ; pour le mettre à part comme saint
  rationale: L’hébreu peut évoquer le fait de sanctifier le jour ou de le traiter comme saint et mis à part. « Le garder saint » préserve cette portée théologique sans limiter le commandement à une simple observance rituelle ; la note conserve les autres nuances possibles.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement singulier correspond à l’impératif hébreu masculin singulier. « Sabbat » conserve le terme biblique reconnu, tandis que la note explicite l’étendue sémantique de קדשׁ.
