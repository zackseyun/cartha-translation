  text: 'And God spoke all these words, saying:'
translation:
  language: fr
  text: 'Dieu prononça toutes ces paroles :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: prononça
  rationale: Dans ce contexte solennel introduisant les paroles de l’alliance, « prononça » rend naturellement l’acte de parler tout en évitant la lourdeur de « parla toutes ces paroles ».
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Équivalent français courant et contextuellement approprié du nom commun divin.
- source_word: כָּל־הַדְּבָרִים הָאֵלֶּה
  choice: toutes ces paroles
  rationale: « Paroles » convient mieux que « choses » ici, puisque le texte présente immédiatement un discours divin.
- source_word: לֵאמֹר
  choice: — introduit par les deux-points
  rationale: L’infinitif hébreu introduit le contenu du discours. En français moderne, les deux-points remplissent cette fonction plus naturellement qu’un calque tel que « en disant ».
theological_decisions:
- issue: Nature du contenu annoncé
  choice: « paroles »
  alternative: « commandements »
  rationale: Le verset dit דְּבָרִים, « paroles », et non le terme technique pour « commandements » ; la traduction conserve donc la formulation plus large du texte.
translation_notes:
  register: Français moderne, sobre et solennel. La formulation évite un hébraïsme maladroit tout en conservant l’idée que Dieu énonce lui-même l’ensemble des paroles qui suivent.
