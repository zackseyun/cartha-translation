lexical_decisions:
- source_word: לֹא
  choice: ne… pas
  rationale: La négation hébraïque לֹא, suivie de l’imparfait dans ce contexte juridique, exprime une interdiction directe. En français, « ne… pas » avec le futur simple rend naturellement la formulation solennelle du Décalogue.
- source_word: תִּגְנֹב
  choice: voleras
  rationale: Forme qal imparfait, deuxième personne du masculin singulier, du verbe גנב. Le sens général « voler » convient ici, puisque le verset ne précise aucun objet. Le verbe peut désigner ailleurs l’enlèvement d’une personne, mais le contexte immédiat ne justifie pas de restreindre ainsi sa portée.
theological_decisions:
- issue: Forme de l’interdiction dans le Décalogue
  choice: Tu ne voleras pas.
  alternative: Ne vole pas.
  rationale: Le futur à valeur injonctive conserve la force solennelle et juridique de לֹא + imparfait, tout en restant idiomatique en français moderne. L’impératif « Ne vole pas » est plus direct et dynamique, mais moins marqué par le registre propre au Décalogue.
translation_notes:
  register: Français international moderne, concis et digne. La formulation traditionnelle au futur reste immédiatement compréhensible et correspond au style juridique solennel du Décalogue.
