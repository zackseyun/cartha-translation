  text: לֹ֥א תַחְמֹ֖ד בֵּ֣ית רֵעֶ֑/ךָ לֹֽא תַחְמֹ֞ד אֵ֣שֶׁת רֵעֶ֗/ךָ וְ/עַבְדּ֤/וֹ וַ/אֲמָת/וֹ֙ וְ/שׁוֹר֣/וֹ וַ/חֲמֹר֔/וֹ וְ/כֹ֖ל אֲשֶׁ֥ר לְ/רֵעֶֽ/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/017.yaml
  text: You shall not covet your neighbor’s house; you shall not covet your neighbor’s wife[a], or his male servant, or his female servant, or his ox, or his donkey, or anything that belongs to your neighbor.
translation:
  language: fr
  text: Tu ne convoiteras pas la maison de ton prochain[a] ; tu ne convoiteras pas la femme de ton prochain, ni son esclave homme, ni son esclave femme, ni son bœuf, ni son âne, ni rien de ce qui appartient à ton prochain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la maisonnée de ton prochain ». Le mot hébreu traduit par « maison » peut aussi désigner une maisonnée ; toutefois, « maison » convient bien ici puisque les personnes et les animaux sont ensuite énumérés séparément.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחְמֹד
  choice: convoiteras
  rationale: Dans ce commandement, חמד désigne le désir illégitime de ce qui appartient à autrui. « Convoiter » conserve cette portée morale tout en restant naturel en français.
- source_word: בֵּית רֵעֶךָ
  choice: la maison de ton prochain
  rationale: בַּיִת peut désigner une maison ou une maisonnée. Comme la femme, les esclaves et les animaux sont ensuite énumérés séparément, le sens concret « maison » convient le mieux à la structure du verset.
- source_word: רֵעֶךָ
  choice: ton prochain
  rationale: רֵעַ désigne ici l’autre membre de la communauté. « Prochain » est idiomatique dans ce contexte éthique et juridique et maintient la relation interpersonnelle.
- source_word: אֵשֶׁת רֵעֶךָ
  choice: la femme de ton prochain
  rationale: La construction hébraïque signifie directement « la femme de ton prochain » et exprime clairement le lien conjugal.
- source_word: עַבְדּוֹ
  choice: l’homme qui est son esclave
  rationale: עֶבֶד désigne un homme en condition servile. Dans cette liste juridique, « esclave » rend explicitement le statut social, tandis que la formulation française distingue naturellement le masculin du terme féminin suivant.
- source_word: אֲמָתוֹ
  choice: la femme qui est son esclave
  rationale: אָמָה désigne une femme en condition servile. Cette formulation parallèle conserve à la fois le statut d’esclave et la distinction de sexe exprimée par l’hébreu, sans recourir à un terme archaïque.
- source_word: שׁוֹרוֹ
  choice: son bœuf
  rationale: שׁוֹר désigne ici un bovin, notamment un animal de travail. « Bœuf » est le terme français traditionnel et précis dans ce contexte juridique.
- source_word: חֲמֹרוֹ
  choice: son âne
  rationale: « Âne » est l’équivalent français courant et précis de חֲמוֹר.
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: ni rien de ce qui appartient à ton prochain
  rationale: Cette expression finale englobe tout autre bien du prochain. La tournure française restitue naturellement la portée exhaustive et la relation de possession.
- source_word: לֹא ... לֹא
  choice: Tu ne convoiteras pas ... tu ne convoiteras pas
  rationale: La répétition de l’interdiction est maintenue afin de conserver l’insistance et la structure du texte hébreu.
theological_decisions:
- issue: Faut-il rendre בֵּית par « maison » ou par « maisonnée » dans la première proposition ?
  choice: maison
  alternative: maisonnée
  rationale: Bien que בַּיִת puisse désigner une maisonnée, le verset énumère ensuite séparément la femme, les esclaves et les animaux. « Maison » évite cette redondance et respecte la progression apparente de la liste.
- issue: Comment rendre les termes de condition servile dans cette loi de l’alliance ?
  choice: l’homme qui est son esclave / la femme qui est son esclave
  alternative: son serviteur / sa servante
  rationale: Dans cette liste juridique de personnes, d’animaux et de biens rattachés au prochain, la condition servile est saillante. « Esclave » la rend sans l’atténuer, tandis que la formulation choisie préserve la distinction entre עֶבֶד et אָמָה en français naturel.
translation_notes:
  register: Français moderne, clair et digne. Le futur à valeur impérative (« Tu ne convoiteras pas ») conserve la forme solennelle et familière du Décalogue. La répétition hébraïque est maintenue, et les termes désignant l’esclavage sont rendus explicitement sans archaïsme ni atténuation.
