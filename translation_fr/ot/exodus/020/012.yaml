  text: כַּבֵּ֥ד אֶת אָבִ֖י/ךָ וְ/אֶת אִמֶּ֑/ךָ לְמַ֨עַן֙ יַאֲרִכ֣וּ/ן יָמֶ֔י/ךָ עַ֚ל הָ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/012.yaml
  text: Honor your father and your mother[b][a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: fr
  text: Honore ton père et ta mère, afin que tes jours se prolongent[a] sur la terre[b] que Yahweh, ton Dieu, te donne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « tes jours se prolongent » signifie que tu vives longtemps.
    reason: cultural_note
  - marker: b
    text: Ou « dans le pays ». L’hébreu dit littéralement « sur la terre », mais le contexte désigne la terre que Dieu donne à Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּבֵּד
  choice: Honore
  rationale: L’impératif intensif de כבד demande de reconnaître le poids, la valeur et la dignité des parents. « Honore » conserve mieux cette portée éthique que le plus faible « respecte ».
- source_word: אָבִיךָ וְאֶת אִמֶּךָ
  choice: ton père et ta mère
  rationale: Traduction directe et naturelle des deux noms singuliers munis du suffixe de deuxième personne du masculin singulier.
- source_word: לְמַעַן
  choice: afin que
  rationale: Introduit ici le but ou le résultat attendu. « Afin que » exprime clairement le lien entre le commandement et la promesse.
- source_word: יַאֲרִכוּן יָמֶיךָ
  choice: tes jours se prolongent
  rationale: Conserve l’image hébraïque des « jours » tout en formulant l’expression de manière naturelle en français; le sens est celui d’une longue vie.
- source_word: עַל הָאֲדָמָה
  choice: sur la terre
  rationale: Suit de près la préposition עַל et rend אֲדָמָה sans le réduire au simple sol. Dans le contexte, il s’agit de la terre accordée à Israël, mais la formulation garde la sobriété du texte source.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel au lieu de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Rendu direct de la forme avec suffixe, qui présente Yahweh comme le Dieu de l’interlocuteur dans le cadre de l’alliance.
- source_word: נֹתֵן לָךְ
  choice: te donne
  rationale: Le participe peut décrire une action en cours ou imminente. Le présent français reste ouvert à ces nuances et convient à la situation au Sinaï.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Yahvé; le SEIGNEUR; l’Éternel
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel de Dieu sans le remplacer par un titre.
- issue: Portée de הָאֲדָמָה dans la promesse
  choice: la terre
  alternative: le pays; le sol; la terre entière
  rationale: La clause « que Yahweh, ton Dieu, te donne » vise, dans ce contexte, la terre accordée à Israël. « La terre » garde toutefois le caractère concret et non développé de l’hébreu, sans ajouter « promise ».
- issue: Relation exprimée par לְמַעַן
  choice: afin que
  alternative: de sorte que; pour que
  rationale: L’hébreu peut porter une nuance de but ou de résultat. « Afin que » maintient le lien formulé entre l’obéissance au commandement et la longue vie promise sans préciser davantage sa mécanique théologique.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement singulier reflète l’adresse hébraïque à la deuxième personne du masculin singulier. La syntaxe reste mémorable et adaptée au registre d’un commandement, tout en conservant l’expression imagée « tes jours se prolongent ».
