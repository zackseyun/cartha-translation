  text: אָֽנֹכִ֖י יְהוָ֣ה אֱלֹהֶ֑י/ךָ אֲשֶׁ֧ר הוֹצֵאתִ֛י/ךָ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/002.yaml
  text: I am Yahweh your God[a], who brought you out from the land of Egypt[b], from the house of servants.
translation:
  language: fr
  text: Je suis Yahweh[a], ton Dieu, qui t’ai fait sortir du pays d’Égypte, de la maison des esclaves[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte YHWH, traditionnellement rendu par « le SEIGNEUR » ou « l’Éternel » ; le nom est ici translittéré « Yahweh ».
    reason: alternative_reading
  - marker: b
    text: 'Plus idiomatiquement : « de la maison d’esclavage ». L’hébreu dit littéralement « de la maison des esclaves ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: Je suis
  rationale: Le pronom indépendant est emphatique. Dans cette proposition nominale sans copule en hébreu, « Je suis » constitue en français une auto-identification naturelle et solennelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » conserve le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Malgré sa forme morphologiquement plurielle, אֱלֹהִים désigne ici le Dieu d’Israël au singulier. Le suffixe de deuxième personne est singulier, d’où « ton Dieu ».
- source_word: אֲשֶׁר הוֹצֵאתִיךָ
  choice: qui t’ai fait sortir
  rationale: Le hifil de יצא exprime l’action de faire sortir. La première personne du verbe est conservée dans « t’ai fait sortir », sans transformer la relative en narration à la troisième personne.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: du pays d’Égypte
  rationale: La préposition מן indique la provenance. « Du pays d’Égypte » est naturel en français tout en maintenant l’expression géographique formelle de l’hébreu.
- source_word: מִבֵּית עֲבָדִים
  choice: de la maison des esclaves
  rationale: Cette formulation préserve l’image concrète de l’hébreu, littéralement « maison des esclaves », ainsi que le parallélisme des deux compléments introduits par מן. « Esclaves » rend clairement la condition de servitude forcée en Égypte.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / l’Éternel
  rationale: Le texte porte le nom propre divin. « Yahweh » le représente directement, tandis que les autres formes françaises sont des substitutions traditionnelles par un titre ou une désignation.
- issue: Sens de עֲבָדִים dans le contexte égyptien
  choice: esclaves
  alternative: serviteurs
  rationale: Le contexte est celui de l’asservissement et du travail imposé; « esclaves » exprime donc mieux le statut de dépendance contraignante que « serviteurs ».
- issue: Image de בֵּית עֲבָדִים
  choice: maison des esclaves
  alternative: maison d’esclavage
  rationale: La traduction retenue conserve le pluriel concret de l’hébreu sans exclure le sens idiomatique de lieu d’asservissement, signalé en note.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète les suffixes hébreux adressés à Israël comme interlocuteur collectif. La répétition de « de » et l’expression concrète « maison des esclaves » conservent la structure et l’image du texte source.
