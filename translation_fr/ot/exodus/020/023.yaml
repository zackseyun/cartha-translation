id: EXO.20.23
reference: Exodus 20:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹ֥א תַעֲשׂ֖וּ/ן אִתִּ֑/י אֱלֹ֤הֵי כֶ֨סֶף֙ וֵ/אלֹהֵ֣י זָהָ֔ב לֹ֥א תַעֲשׂ֖וּ לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/023.yaml
  text: You shall not make gods of silver alongside me[a], nor shall you make for yourselves gods of gold.
translation:
  language: fr
  text: Vous ne ferez pas de dieux d’argent à côté de moi[a], et vous ne vous ferez pas de dieux d’or.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « avec moi » ; on peut aussi comprendre « auprès de moi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲשׂוּן / תַעֲשׂוּ
  choice: ferez
  rationale: Dans ce contexte, עשה désigne la fabrication d’objets cultuels. « Faire » conserve la simplicité et la force directe de l’interdiction sans préciser indûment le procédé de fabrication.
- source_word: אִתִּי
  choice: à côté de moi
  rationale: La préposition signifie littéralement « avec moi ». Dans ce contexte cultuel, « à côté de moi » exprime naturellement en français la présence de divinités rivales, tout en signalant en note la formulation plus littérale.
- source_word: אֱלֹהֵי כֶסֶף
  choice: dieux d’argent
  rationale: Cette formulation rend directement la chaîne construite hébraïque et désigne clairement des divinités ou représentations fabriquées en argent.
- source_word: וֵאלֹהֵי זָהָב
  choice: et … des dieux d’or
  rationale: Le second groupe nominal est coordonné au premier, tandis que la répétition du verbe et de la négation est rendue dans la seconde proposition.
- source_word: לָכֶם
  choice: vous ne vous ferez pas
  rationale: Le pronom français réfléchi traduit idiomatiquement l’idée de fabriquer ces dieux « pour vous-mêmes », c’est-à-dire pour votre propre usage.
- source_word: לֹא ... לֹא
  choice: Vous ne ferez pas … et vous ne vous ferez pas
  rationale: La répétition de la négation est conservée dans deux propositions coordonnées, avec un registre normatif naturel en français.
theological_decisions:
- issue: Sens contextuel de אִתִּי dans l’interdiction des dieux d’argent
  choice: à côté de moi
  alternative: avec moi ; auprès de moi
  rationale: « Avec moi » est la valeur la plus littérale, mais peut suggérer en français que Dieu participerait à leur fabrication. « À côté de moi » rend plus clairement la relation cultuelle visée sans effacer l’ambiguïté lexicale, laquelle est conservée dans la note.
translation_notes:
  register: Français international moderne, sobre et digne. La structure parallèle de l’interdiction est maintenue, avec une formulation accessible et sans ajout confessionnel.
