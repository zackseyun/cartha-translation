  text: Tu ne porteras pas de faux témoignage contre ton prochain[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu ne témoigneras pas faussement contre ton prochain. »'
    reason: Alternative lexicale qui exprime plus directement la valeur judiciaire de תַעֲנֶה עֵד שָׁקֶר.
lexical_decisions:
- source_word: לֹא
  choice: ne… pas
  rationale: La négation introduit ici une interdiction directe, conformément à la forme des commandements du Décalogue.
- source_word: תַעֲנֶה
  choice: tu ne porteras pas de témoignage
  rationale: Dans ce contexte juridique, le verbe peut signifier « répondre » ou « témoigner ». La tournure française « porter témoignage » rend naturellement la valeur judiciaire tout en conservant la construction nominale du texte hébreu.
- source_word: בְרֵעֲךָ
  choice: contre ton prochain
  rationale: Dans ce cadre judiciaire, la préposition désigne la personne visée par le témoignage. « Prochain » est un équivalent français établi de רֵעַ et désigne ici un autre membre de la communauté, sans exclure la portée humaine plus large du commandement.
- source_word: עֵד
  choice: témoignage
  rationale: Le nom peut désigner le témoin ou, dans cette construction, le témoignage porté. Le français idiomatique demande ici « porter un témoignage » plutôt que « porter un témoin ».
- source_word: שָׁקֶר
  choice: faux
  rationale: Le terme exprime la fausseté ou la tromperie. « Faux témoignage » est la formulation juridique française naturelle et précise.
