    issue: La note présente Deutéronome 5.10 comme appui direct à « mille générations ».
    rationale: Deutéronome 5.10 emploie lui aussi simplement « à des milliers » (לַאֲלָפִים), sans le mot « générations ». La comparaison peut être conservée pour le parallèle, mais ne doit pas laisser entendre que ce verset fournit explicitement « générations ».
  - severity: low
    issue: « témoigne d’un amour fidèle » est légèrement moins direct que l’hébreu עושה חסד.
    rationale: Le participe exprime l’exercice ou la manifestation effective du חסד. « Manifeste un amour fidèle » préserve mieux cette valeur tout en restant naturel.
  revised_text: mais qui manifeste un amour fidèle envers des milliers[a], envers ceux qui m’aiment et qui gardent mes commandements.
