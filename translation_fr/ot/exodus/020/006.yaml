  text: but showing steadfast love to thousands[a], to those who love me and keep my commandments.
translation:
  language: fr
  text: mais qui manifeste un amour fidèle envers des milliers[a], envers ceux qui m’aiment et qui gardent mes commandements.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « envers mille générations ». L’hébreu dit ici simplement « envers des milliers »; comparer Deutéronome 5.10, qui emploie la même expression.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: mais qui témoigne
  rationale: Le participe poursuit la description de Dieu et s’inscrit dans le contraste avec le jugement du verset précédent. « Mais » explicite naturellement ce contraste en français, tandis que « témoigne » rend l’action exercée envers ses bénéficiaires.
- source_word: חֶסֶד
  choice: un amour fidèle
  rationale: חֶסֶד désigne ici un amour bienveillant, loyal et durable dans le cadre de l’alliance. « Amour fidèle » en préserve la richesse relationnelle et théologique dans un français actuel.
- source_word: לַאֲלָפִים
  choice: envers des milliers
  rationale: Le texte hébreu porte littéralement « envers/pour des milliers », sans nom explicite tel que « générations ». Le rendre ainsi conserve l’indétermination du texte source.
- source_word: לְאֹהֲבַי
  choice: envers ceux qui m’aiment
  rationale: Le participe muni du suffixe de première personne se rend naturellement en français par une proposition relative qui exprime une disposition continue.
- source_word: וּלְשֹׁמְרֵי
  choice: et qui gardent
  rationale: Avec « commandements » comme complément, שׁמר signifie les observer et leur rester fidèle. « Garder » conserve l’image hébraïque tout en étant intelligible dans ce registre biblique.
- source_word: מִצְוֺתָי
  choice: mes commandements
  rationale: « Commandements » restitue le registre juridique et relationnel du Décalogue avec plus de précision que le terme plus général « ordres ».
theological_decisions:
- issue: Portée de לַאֲלָפִים
  choice: envers des milliers
  alternative: envers mille générations / envers des milliers de générations
  rationale: Aucun terme signifiant « générations » ne figure explicitement dans le texte massorétique de ce verset. Le texte principal maintient donc son indétermination, tandis que la note signale l’interprétation générationnelle appuyée notamment par le parallèle de Deutéronome 5.10.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la structure relationnelle du verset et le contraste avec le contexte précédent, sans ajouter « générations » au texte principal.
