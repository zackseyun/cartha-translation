source:
  edition: WLC
  text: וְ/כָל הָ/עָם֩ רֹאִ֨ים אֶת הַ/קּוֹלֹ֜ת וְ/אֶת הַ/לַּפִּידִ֗ם וְ/אֵת֙ ק֣וֹל הַ/שֹּׁפָ֔ר וְ/אֶת הָ/הָ֖ר עָשֵׁ֑ן וַ/יַּ֤רְא הָ/עָם֙ וַ/יָּנֻ֔עוּ וַ/יַּֽעַמְד֖וּ מֵֽ/רָחֹֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/018.yaml
  text: All the people were seeing the thunder and the flashes of fire[a], and the sound of the trumpet, and the mountain smoking; and when the people saw it[c][b], they trembled and stood at a distance.
translation:
  language: fr
  text: Tout le peuple voyait les coups de tonnerre[a], les éclairs[b], le son de la trompe et la montagne fumante. À cette vue[c], le peuple trembla et se tint à distance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les sons » ou « les voix »; dans ce contexte, il s’agit vraisemblablement du tonnerre.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les torches »; le mot évoque ici des fulgurations de feu.'
    reason: lexical_alternative
  - marker: c
    text: L’hébreu dit que le peuple « voyait » des phénomènes comprenant aussi des sons, ce qui conserve le caractère bouleversant de la scène pour tous les sens.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָעָם
  choice: Tout le peuple
  rationale: Rend directement l'ensemble de la communauté rassemblée, dans un français naturel et digne.
- source_word: רֹאִים
  choice: voyait
  rationale: L'imparfait restitue la valeur durative du participe hébreu et conserve le verbe de vision, même devant des phénomènes sonores.
- source_word: הַקּוֹלֹת
  choice: les coups de tonnerre
  rationale: Le nom signifie littéralement « sons » ou « voix », mais son pluriel désigne vraisemblablement ici le tonnerre dans la manifestation du Sinaï.
- source_word: הַלַּפִּידִם
  choice: les éclairs
  rationale: Le terme désigne littéralement des torches ou des flammes; dans ce contexte, « éclairs » exprime naturellement les fulgurations de feu.
- source_word: קוֹל הַשֹּׁפָר
  choice: le son de la trompe
  rationale: « Trompe » désigne clairement l'instrument à vent sans imposer que la corne soit nécessairement une corne de bélier; la construction conserve explicitement le mot « son ».
- source_word: הָהָר עָשֵׁן
  choice: la montagne fumante
  rationale: Cette formulation concise garde l'image visuelle immédiate de la montagne qui fume.
- source_word: וַיַּרְא הָעָם
  choice: À cette vue, le peuple
  rationale: La reprise hébraïque du verbe « voir » est préservée sous une forme française fluide, avec renvoi collectif aux manifestations précédentes.
- source_word: וַיָּנֻעוּ
  choice: trembla
  rationale: Le verbe exprime l'ébranlement physique et la frayeur du peuple; « trembler » convient naturellement au contexte.
- source_word: וַיַּעַמְדוּ מֵרָחֹק
  choice: se tint à distance
  rationale: Rend le retrait spatial volontaire ou craintif en français moderne, tout en restant proche de l'hébreu.
theological_decisions:
- issue: Le texte dit que le peuple « voit » des phénomènes comprenant des sons.
  choice: Conserver « voyait les coups de tonnerre » et signaler cette synesthésie en note.
  alternative: Normaliser en « entendait le tonnerre » ou généraliser en « percevait ces phénomènes ».
  rationale: Le mélange des perceptions participe au caractère saisissant de la théophanie. Le lisser ferait disparaître une tension réelle du texte hébreu.
translation_notes:
  register: Français international moderne, lisible et solennel. L'imparfait ouvre la scène de manière durative, puis le passé simple marque la réaction du peuple. « Trompe » est retenu plutôt que « trompette » pour mieux évoquer l'instrument ancien sans préciser au-delà du texte le type exact de corne.
