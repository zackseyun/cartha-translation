  text: וַ/יַּעֲמֹ֥ד הָ/עָ֖ם מֵ/רָחֹ֑ק וּ/מֹשֶׁה֙ נִגַּ֣שׁ אֶל הָֽ/עֲרָפֶ֔ל אֲשֶׁר שָׁ֖ם הָ/אֱלֹהִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/021.yaml
  text: The people stood at a distance[a], and Moses approached the thick darkness where God was.
translation:
  language: fr
  text: Le peuple se tint à distance, tandis que Moïse s’approcha de l’obscurité épaisse[a] où Dieu se trouvait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sombre nuage » ou « l’obscurité profonde ». Le terme hébreu peut désigner une obscurité dense associée à une manifestation de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: se tint
  rationale: Le wayyiqtol de עמד décrit ici la position prise et gardée par le peuple. « Se tint » est concis, naturel dans un récit solennel et rend mieux cet état que le simple « resta debout ».
- source_word: הָעָם
  choice: le peuple
  rationale: Le nom défini désigne le peuple déjà présent au Sinaï; il n’est pas nécessaire d’ajouter « d’Israël », absent de l’hébreu.
- source_word: מֵרָחֹק
  choice: à distance
  rationale: Cette expression rend directement l’éloignement spatial indiqué par la préposition et רָחֹק, dans un français moderne et idiomatique.
- source_word: נִגַּשׁ
  choice: s’approcha
  rationale: Le verbe נגשׁ signifie venir près ou s’approcher. « S’approcha » est clair et conserve le contraste avec la distance gardée par le peuple.
- source_word: הָעֲרָפֶל
  choice: l’obscurité épaisse
  rationale: עֲרָפֶל désigne une obscurité dense ou profonde, parfois comprise comme une masse nuageuse sombre dans une manifestation divine. « Obscurité épaisse » conserve l’image concrète sans la réduire explicitement à un nuage.
- source_word: אֲשֶׁר שָׁם הָאֱלֹהִים
  choice: où Dieu se trouvait
  rationale: La proposition relative localise Dieu dans cette obscurité. « Où Dieu se trouvait » exprime naturellement אֲשֶׁר שָׁם sans ajouter l’interprétation explicative de « était présent ».
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, אֱלֹהִים désigne sans ambiguïté le Dieu d’Israël et appelle donc le singulier « Dieu ».
theological_decisions:
- issue: La manifestation de Dieu dans l’obscurité
  choice: Conserver l’image concrète de « l’obscurité épaisse » où Dieu se trouvait.
  alternative: « le sombre nuage » ou « l’obscurité où Dieu était présent »
  rationale: Le texte associe paradoxalement la présence de Dieu à une obscurité dense. La formulation retenue préserve cette tension entre présence divine et caractère caché ou inaccessible, sans transformer l’image en simple phénomène météorologique ni l’expliquer théologiquement.
translation_notes:
  register: Français international moderne, digne et accessible. « Tandis que » rend explicite le contraste narratif entre le peuple qui garde ses distances et Moïse qui s’approche, sans modifier le contenu propositionnel. Le marqueur [a] figure immédiatement après l’expression concernée.
