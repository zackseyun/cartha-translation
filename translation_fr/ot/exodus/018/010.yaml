  text: וַ/יֹּאמֶר֮ יִתְרוֹ֒ בָּר֣וּךְ יְהוָ֔ה אֲשֶׁ֨ר הִצִּ֥יל אֶתְ/כֶ֛ם מִ/יַּ֥ד מִצְרַ֖יִם וּ/מִ/יַּ֣ד פַּרְעֹ֑ה אֲשֶׁ֤ר הִצִּיל֙ אֶת הָ/עָ֔ם מִ/תַּ֖חַת יַד מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/010.yaml
  text: And Yitro said[a], “Blessed be Yahweh, who delivered you from the hand of the Egyptians and from the hand of Pharaoh[b], who delivered the people from under the hand of the Egyptians.”
translation:
  language: fr
  text: 'Et Yitro dit : « Béni soit Yahweh[a], qui vous a délivrés de la main de l’Égypte et de la main du pharaon, lui qui a délivré le peuple de dessous la main de l’Égypte[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Yahweh est béni » ou « Que Yahweh soit béni ». La formule hébraïque de bénédiction permet plusieurs formulations naturelles en français.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de la main de l’Égypte […] de dessous la main de l’Égypte ». Dans cet idiome, la « main » représente le pouvoir ou l’emprise oppressive.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Et … dit
  rationale: Le wayyiqtol fait avancer le récit. « Et … dit » conserve l’enchaînement narratif hébreu sans lui imposer une nuance temporelle plus précise.
- source_word: יִתְרוֹ
  choice: Yitro
  rationale: Cette translittération représente directement la forme hébraïque du nom propre, tout en restant aisément prononçable en français.
- source_word: בָּרוּךְ יְהוָה
  choice: Béni soit Yahweh
  rationale: Cette tournure française naturelle conserve la force doxologique de la formule participiale hébraïque, dont la valeur exacte permet aussi « Yahweh est béni ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin YHWH, rendu ici par sa translittération plutôt que remplacé par un titre.
- source_word: הִצִּיל
  choice: a délivré
  rationale: Le hifil de נצל exprime ici l’action de soustraire quelqu’un à une puissance hostile. « Délivrer » convient au contexte de l’exode et garde la portée du terme.
- source_word: אֶתְכֶם
  choice: vous a délivrés
  rationale: Le pronom objet est masculin pluriel. L’accord du participe passé rend en français le groupe masculin ou mixte auquel Yitro s’adresse.
- source_word: מִיַּד
  choice: du pouvoir de
  rationale: Littéralement « de la main de », l’expression désigne la puissance ou l’emprise exercée. « Du pouvoir de » transmet naturellement l’idiome en français.
- source_word: מִצְרַיִם
  choice: les Égyptiens
  rationale: Dans l’expression « la main de l’Égypte », le nom désigne collectivement la puissance égyptienne; le gentilé pluriel est naturel en français.
- source_word: פַּרְעֹה
  choice: le pharaon
  rationale: Le nom commun avec article correspond à l’emploi français courant du titre royal dans ce contexte.
- source_word: הָעָם
  choice: le peuple
  rationale: Le terme עם désigne ici collectivement le peuple d’Israël.
- source_word: מִתַּחַת יַד
  choice: de la domination de
  rationale: Littéralement « de dessous la main de », cette expression accentue l’idée de sujétion. « De la domination de » rend cette intensification sans tournure française artificielle.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » préserve le nom personnel présent dans la source sans le remplacer par un titre.
- issue: Référent du second אֲשֶׁר (« qui »)
  choice: lui qui a délivré le peuple
  alternative: qui a délivré le peuple
  rationale: La reprise emphatique « lui qui » indique naturellement que Yahweh demeure l’antécédent, sans transformer la proposition en affirmation théologique supplémentaire.
translation_notes:
  register: Français international actuel, digne et accessible. La traduction conserve la répétition de « délivrer » et la progression entre « pouvoir » et « domination », tout en expliquant en note l’image hébraïque de la main.
