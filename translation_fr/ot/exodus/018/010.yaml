  naturalness: Le français est fluide et de registre approprié. « De la main de l’Égypte » et « de dessous la main de l’Égypte » sont des formulations imagées, claires dans ce contexte biblique et utilement expliquées en note. « Lui qui » évite que la relative soit naturellement rattachée au seul « pharaon ».
