  text: כִּֽי יִהְיֶ֨ה לָ/הֶ֤ם דָּבָר֙ בָּ֣א אֵלַ֔/י וְ/שָׁ֣פַטְתִּ֔י בֵּ֥ין אִ֖ישׁ וּ/בֵ֣ין רֵעֵ֑/הוּ וְ/הוֹדַעְתִּ֛י אֶת חֻקֵּ֥י הָ/אֱלֹהִ֖ים וְ/אֶת תּוֹרֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/016.yaml
  text: When they have a matter[a], it comes to me, and I judge between a man and his neighbor[c][b], and I make known the statutes of God and his laws.
translation:
  language: fr
  text: Lorsqu’ils ont une affaire[a], elle m’est soumise, et je tranche entre un homme et son prochain[b] ; je leur fais connaître les prescriptions de Dieu et ses lois[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une cause » ou « un différend ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « entre un homme et son prochain », expression au singulier ayant ici une portée représentative.
    reason: cultural_note
  - marker: c
    text: Ou « ses instructions ». Le mot hébreu peut désigner plus largement un enseignement ou une instruction, bien qu’il soit employé ici dans un cadre juridique.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Lorsqu’
  rationale: Dans ce contexte, כִּי introduit la circonstance habituelle qui explique la pratique de Moïse. « Lorsqu’ » exprime naturellement cette valeur temporelle et conditionnelle.
- source_word: יִהְיֶה לָהֶם דָּבָר
  choice: ils ont une affaire
  rationale: דָּבָר a un sens large (« parole, chose, affaire, cause »), mais le contexte judiciaire favorise « affaire », qui reste plus large que « procès » ou « litige ».
- source_word: בָּא אֵלַי
  choice: elle m’est soumise
  rationale: Le verbe hébreu est au singulier et renvoie le plus naturellement à l’affaire. La formulation française évite l’expression peu idiomatique « elle vient à moi » tout en conservant l’idée que l’affaire parvient à Moïse.
- source_word: וְשָׁפַטְתִּי
  choice: je rends un jugement
  rationale: שׁפט désigne ici l’exercice d’une fonction judiciaire. « Rendre un jugement » est naturel en français et explicite l’acte de trancher sans ajouter le contenu de la décision.
- source_word: בֵּין אִישׁ וּבֵין רֵעֵהוּ
  choice: entre un homme et son prochain
  rationale: Cette traduction conserve les formes masculines singulières de l’expression juridique représentative. « Prochain » rend רֵעַ dans son sens de membre de la communauté ou d’autrui avec qui l’on est en relation.
- source_word: וְהוֹדַעְתִּי
  choice: je leur fais connaître
  rationale: Le hiphil de ידע signifie « faire savoir, faire connaître ». Le pronom « leur » explicite en français les destinataires déjà présents dans le contexte, sans transformer le verbe en « enseigner ».
- source_word: חֻקֵּי הָאֱלֹהִים
  choice: les prescriptions de Dieu
  rationale: חֻקִּים désigne des règles fixées ou prescrites. « Prescriptions » maintient cette nuance normative et évite une répétition avec « lois ».
- source_word: תּוֹרֹתָיו
  choice: ses lois
  rationale: תּוֹרָה peut désigner plus largement une instruction, mais son parallélisme avec « prescriptions » et le cadre judiciaire donnent ici au terme une force juridique nette.
theological_decisions:
- issue: Portée du masculin singulier dans אִישׁ ... רֵעֵהוּ
  choice: un homme et son prochain
  alternative: une personne et une autre
  rationale: L’hébreu emploie une expression juridique représentative au masculin singulier. La traduction en conserve la forme sans nier sa portée générale.
- issue: Sens de תּוֹרֹתָיו dans ce contexte judiciaire
  choice: ses lois
  alternative: ses instructions
  rationale: Le terme peut signifier « instructions », mais le contexte d’arbitrage et son parallélisme avec חֻקֵּי soutiennent ici « lois ». Une note préserve toutefois l’étendue sémantique de l’hébreu.
- issue: Sujet de בָּא אֵלַי
  choice: l’affaire, rendue par « elle m’est soumise »
  alternative: les parties, rendu par « elles viennent me trouver »
  rationale: La forme verbale singulière s’accorde le plus directement avec דָּבָר, « affaire ». La traduction maintient ce lien tout en employant une tournure française naturelle.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve la structure explicative du discours de Moïse, avec un point-virgule pour alléger l’enchaînement. « Elle m’est soumise » privilégie l’idiome français tout en respectant le singulier hébreu et le rôle de « l’affaire » comme sujet.
