id: EXO.18.9
reference: Exodus 18:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּ֣חַדְּ יִתְר֔וֹ עַ֚ל כָּל הַ/טּוֹבָ֔ה אֲשֶׁר עָשָׂ֥ה יְהוָ֖ה לְ/יִשְׂרָאֵ֑ל אֲשֶׁ֥ר הִצִּיל֖/וֹ מִ/יַּ֥ד מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/009.yaml
  text: Jethro rejoiced over all the good that Yahweh had done for Israel[b][a], whom he had delivered from the hand of Egypt.
translation:
  language: fr
  text: Jéthro se réjouit[a] de tout le bien que Yahweh avait fait à Israël, qu’il avait délivré du pouvoir de l’Égypte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut heureux de tout le bien ». Le verbe hébreu peut exprimer le fait d’être heureux ou de se réjouir.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de la main de l’Égypte », expression qui désigne le pouvoir ou la domination de l’Égypte.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיִּחַדְּ
  choice: se réjouit
  rationale: Le verbe exprime ici la joie suscitée par l’action salvatrice de Dieu. « Se réjouit » est naturel, digne et plus expressif que « fut heureux ».
- source_word: יִתְרוֹ
  choice: Jéthro
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
- source_word: עַל כָּל הַטּוֹבָה
  choice: de tout le bien
  rationale: Avec un verbe de joie, עַל introduit le motif de la réjouissance. Le singulier collectif הַטּוֹבָה est conservé par « tout le bien ».
- source_word: עָשָׂה
  choice: avait fait
  rationale: Le plus-que-parfait indique naturellement que les bienfaits de Yahweh précèdent la réaction de Jéthro.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Cette forme restitue le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לְיִשְׂרָאֵל
  choice: à Israël
  rationale: La préposition ל marque ici le bénéficiaire de l’action; « à Israël » est idiomatique en français avec « faire du bien ».
- source_word: אֲשֶׁר הִצִּילוֹ
  choice: qu’il avait délivré
  rationale: La proposition relative renvoie naturellement à Israël, envisagé comme une entité collective singulière. Le pronom « il » renvoie à Yahweh.
- source_word: מִיַּד מִצְרָיִם
  choice: du pouvoir de l’Égypte
  rationale: Littéralement « de la main de l’Égypte »; la main représente ici l’autorité ou la domination. « Du pouvoir de » transmet clairement l’idiome en français moderne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le caractère personnel du nom sans le remplacer par un titre.
- issue: Référent du suffixe singulier dans הִצִּילוֹ
  choice: 'Israël comme réalité collective : « qu’il avait délivré »'
  alternative: 'une proposition causale : « car il l’avait délivré »'
  rationale: La construction permet de rattacher naturellement la relative à Israël, tandis que le masculin singulier reflète sa représentation collective. La formulation ne précise pas davantage la nature de cette collectivité.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu tout en explicitant dans le corps du texte l’idiome de la « main » par « pouvoir ». Les marqueurs de notes sont placés immédiatement après les expressions concernées.
