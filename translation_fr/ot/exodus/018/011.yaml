  naturalness: « À présent » est un peu plus idiomatique et narrativement naturel que « Maintenant » dans ce registre. « Se sont montrés arrogants envers » est plus fluide que « ont agi avec arrogance contre ». La répétition intentionnelle de « eux » reste nécessaire dans le texte principal afin de ne pas effacer l’ambiguïté des référents.
  terminology: « Yahweh » respecte le rendu du tétragramme demandé. « Les dieux » rend correctement le pluriel הָאֱלֹהִים dans ce contexte. « Supérieur » convient ici à la relation comparative et au contexte, sans imposer une interprétation confessionnelle.
