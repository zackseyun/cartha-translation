source:
  edition: WLC
  text: עַתָּ֣ה יָדַ֔עְתִּי כִּֽי גָד֥וֹל יְהוָ֖ה מִ/כָּל הָ/אֱלֹהִ֑ים כִּ֣י בַ/דָּבָ֔ר אֲשֶׁ֥ר זָד֖וּ עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/011.yaml
  text: Now I know that Yahweh is greater than all the gods[a], because in the matter in which they acted arrogantly against them, he was above them.
translation:
  language: fr
  text: À présent, je sais que Yahweh est plus grand que tous les dieux, car, dans l’affaire même où ils se sont montrés arrogants envers eux, il s’est montré supérieur à eux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La dernière proposition est elliptique et difficile en hébreu. Les référents des pronoms ne sont pas explicités. Elle peut viser particulièrement l’arrogance des Égyptiens envers les Israélites et la supériorité que Yahweh a manifestée à leur égard.
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה יָדַעְתִּי
  choice: Maintenant, je sais
  rationale: Le parfait hébreu exprime ici l’état de connaissance auquel Jéthro vient d’arriver à la suite des événements; cette formulation française est naturelle et conserve cette valeur résultative.
- source_word: גָדוֹל יְהוָה מִכָּל הָאֱלֹהִים
  choice: Yahweh est plus grand que tous les dieux
  rationale: La préposition מִן avec כָּל établit une comparaison. « Plus grand que » rend clairement cette construction, tandis que « Yahweh » conserve le nom divin personnel et « les dieux » le pluriel du contexte.
- source_word: בַדָּבָר
  choice: dans l’affaire
  rationale: דָּבָר désigne ici la situation ou l’événement en question. « L’affaire » reste proche de l’expression hébraïque sans réduire le sens à une action particulière.
- source_word: זָדוּ
  choice: ils ont agi avec arrogance
  rationale: Le verbe exprime une conduite orgueilleuse, insolente ou présomptueuse; la formulation retenue est claire en français moderne.
- source_word: עֲלֵיהֶם
  choice: contre eux / supérieur à eux
  rationale: La préposition עַל et ses référents sont difficiles à déterminer dans cette proposition condensée. La traduction principale fait entendre à la fois l’hostilité des oppresseurs et la supériorité manifestée par Yahweh, tout en signalant l’incertitude par une note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le tétragramme comme nom personnel. Sa translittération évite de le remplacer par un titre.
- issue: Sens de la proposition finale difficile כִּי בַדָּבָר אֲשֶׁר זָדוּ עֲלֵיהֶם
  choice: car, dans l’affaire où ils ont agi avec arrogance contre eux, il s’est montré supérieur à eux
  alternative: car cela s’est produit dans la chose même où ils avaient agi avec arrogance contre eux
  rationale: L’hébreu est elliptique et ses pronoms ont des référents incertains. Le texte principal exprime la supériorité de Yahweh indiquée par le contexte immédiat, sans nommer explicitement les groupes que l’hébreu laisse sous forme pronominale; la note préserve une lecture plus formelle.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « s’est montré supérieur » explicite avec retenue une relation que la syntaxe hébraïque laisse elliptique; la note conserve cette difficulté.
