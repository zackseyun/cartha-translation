  text: וַ/יְסַפֵּ֤ר מֹשֶׁה֙ לְ/חֹ֣תְנ֔/וֹ אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/פַרְעֹ֣ה וּ/לְ/מִצְרַ֔יִם עַ֖ל אוֹדֹ֣ת יִשְׂרָאֵ֑ל אֵ֤ת כָּל הַ/תְּלָאָה֙ אֲשֶׁ֣ר מְצָאָ֣תַ/ם בַּ/דֶּ֔רֶךְ וַ/יַּצִּלֵ֖/ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/008.yaml
  text: Moses told his father-in-law all that Yahweh had done to Pharaoh and to Egypt for Israel’s sake[a], all the hardship that had come upon them on the way[b], and how Yahweh had delivered them.
translation:
  language: fr
  text: Moïse raconta à son beau-père tout ce que Yahweh avait fait à Pharaon et à l’Égypte pour Israël[a], toutes les épreuves qui leur étaient survenues en chemin[b], et comment Yahweh les avait délivrés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à cause d’Israël » ou « en faveur d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « toutes les épreuves qui les avaient trouvés sur le chemin » ; ou « toutes les difficultés qui leur étaient survenues pendant le voyage ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: raconta
  rationale: Le piel de ספר signifie ici raconter ou relater. « Raconta » est naturel en français et suggère un récit détaillé.
- source_word: חֹתְנוֹ
  choice: son beau-père
  rationale: Dans ce contexte, le terme désigne Jéthro, beau-père de Moïse, même si le mot hébreu peut ailleurs désigner plus largement un parent par alliance.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה יְהוָה לְפַרְעֹה וּלְמִצְרַיִם
  choice: tout ce que Yahweh avait fait à Pharaon et à l’Égypte
  rationale: Cette formulation suit directement les compléments introduits par לְ sans expliciter « contre », nuance possible mais plus interprétative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: עַל אֹדוֹת יִשְׂרָאֵל
  choice: à cause d’Israël
  rationale: L’expression marque le motif ou la considération liée à Israël. « À cause d’Israël » conserve cette relation causale sans préciser davantage si l’accent porte sur son intérêt.
- source_word: הַתְּלָאָה
  choice: les épreuves
  rationale: Le nom singulier collectif désigne la peine, la détresse ou les difficultés éprouvées. Le pluriel français « les épreuves » rend naturellement l’ensemble des adversités du voyage.
- source_word: מְצָאָתַם
  choice: qui les avaient frappés
  rationale: L’hébreu dit littéralement que la détresse les avait « trouvés ». « Frappés » transmet idiomatiquement la survenue éprouvante, tandis qu’une note conserve l’image littérale.
- source_word: בַּדֶּרֶךְ
  choice: en chemin
  rationale: Expression française concise et naturelle pour le trajet entrepris après la sortie d’Égypte.
- source_word: וַיַּצִּלֵם
  choice: les avait délivrés
  rationale: נצל exprime l’action d’arracher au danger ou de secourir. « Délivrés » convient au registre narratif biblique sans imposer ici une portée sotériologique ultérieure.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » le conserve explicitement au lieu de le remplacer par un titre.
- issue: Portée de עַל אֹדוֹת יִשְׂרָאֵל
  choice: à cause d’Israël
  alternative: en faveur d’Israël ; pour l’amour d’Israël
  rationale: L’hébreu peut indiquer le motif ou l’intérêt d’Israël. Le texte principal garde une formulation causale assez ouverte, et la note signale la lecture bénéfactive possible.
translation_notes:
  register: Français international moderne, narratif et digne. Le plus-que-parfait marque l’antériorité des actes racontés. « Beau-père », « en chemin » et « délivrés » sont courants et accessibles ; les notes préservent les principales nuances lexicales et l’image hébraïque.
