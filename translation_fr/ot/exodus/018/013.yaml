  text: וַ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יֵּ֥שֶׁב מֹשֶׁ֖ה לִ/שְׁפֹּ֣ט אֶת הָ/עָ֑ם וַ/יַּעֲמֹ֤ד הָ/עָם֙ עַל מֹשֶׁ֔ה מִן הַ/בֹּ֖קֶר עַד הָ/עָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/013.yaml
  text: And it happened on the next day that Moses sat to judge the people[a], and the people stood before Moses from morning until evening.
translation:
  language: fr
  text: Le lendemain, Moïse s’assit pour juger le peuple, et le peuple se tint devant lui[a] du matin jusqu’au soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « autour de Moïse ». La préposition hébraïque peut évoquer plus littéralement une présence auprès de lui ou autour de lui ; dans ce contexte, le peuple attend que Moïse rende ses jugements.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Le lendemain
  rationale: La formule narrative introduit l’événement suivant et l’expression temporelle désigne le jour qui suit. « Le lendemain » rend naturellement l’ensemble en français moderne sans alourdir le récit.
- source_word: וַיֵּשֶׁב מֹשֶׁה
  choice: Moïse s’assit
  rationale: ישב conserve ici l’image concrète de Moïse prenant place pour exercer une fonction judiciaire.
- source_word: לִשְׁפֹּט אֶת הָעָם
  choice: pour juger le peuple
  rationale: L’infinitif שפט exprime le but et désigne ici le règlement judiciaire des affaires du peuple. « Juger » est direct et fidèle.
- source_word: וַיַּעֲמֹד הָעָם
  choice: le peuple se tint
  rationale: עמד décrit la posture ou le fait de rester debout. « Se tint » convient à la scène d’une foule attendant auprès de Moïse.
- source_word: עַל מֹשֶׁה
  choice: devant lui
  rationale: Avec עמד, la préposition על peut décrire des personnes qui se tiennent auprès ou devant quelqu’un. « Devant lui » exprime clairement la situation judiciaire tout en signalant en note l’autre image possible.
- source_word: מִן הַבֹּקֶר עַד הָעָרֶב
  choice: du matin jusqu’au soir
  rationale: Cette tournure française naturelle conserve toute l’étendue temporelle indiquée par l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La formule hébraïque וַיְהִי n’est pas traduite séparément, car « Le lendemain » suffit naturellement à faire progresser le récit. Le pronom « lui » évite une répétition pesante de « Moïse » sans ambiguïté.
