base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/022.yaml
  text: And let them judge the people at all times[a]. Then every great matter they shall bring to you, but every small matter they themselves shall judge. So make it lighter for yourself[b], and they will bear the burden with you.
translation:
  language: fr
  text: Qu’ils jugent le peuple en tout temps. Ils t’apporteront toute affaire importante[a], mais ils jugeront eux-mêmes toute affaire de moindre importance. Allège ainsi ta charge[b], et ils la porteront avec toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toute grande affaire ». L’hébreu oppose ici les affaires « grandes » aux affaires « petites ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « allège ce qui est sur toi ». La « charge » est implicite dans l’hébreu et désigne ici la responsabilité de juger le peuple.'
    reason: implicit_object
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: Qu’ils jugent
  rationale: Dans le contexte du conseil donné par Jéthro, cette tournure française exprime naturellement la valeur directive du verbe tout en conservant le sens de juger et de trancher les affaires.
- source_word: הָעָם
  choice: le peuple
  rationale: Le terme désigne ici l’ensemble de la communauté d’Israël.
- source_word: בְּכָל עֵת
  choice: en tout temps
  rationale: Cette formulation garde la portée temporelle générale de l’hébreu sans la réduire à « chaque fois que ce sera nécessaire ».
- source_word: כָּל הַדָּבָר הַגָּדֹל
  choice: toute affaire importante
  rationale: דבר désigne ici une affaire soumise au jugement, tandis que גדול marque son importance. Cette formulation est claire en français et moins susceptible d’évoquer la taille matérielle qu’« une grande affaire ».
- source_word: יָבִיאוּ אֵלֶיךָ
  choice: ils t’apporteront
  rationale: Le hiphil de בוא exprime le fait de porter ou présenter l’affaire à Moïse afin qu’il la tranche.
- source_word: כָּל הַדָּבָר הַקָּטֹן
  choice: toute affaire de moindre importance
  rationale: La formulation préserve l’opposition entre גדול et קטן dans le contexte judiciaire, sans laisser entendre que l’affaire serait insignifiante.
- source_word: יִשְׁפְּטוּ הֵם
  choice: ils jugeront eux-mêmes
  rationale: « eux-mêmes » rend l’emphase du pronom explicite הֵם et souligne le contraste avec les affaires apportées à Moïse.
- source_word: וְהָקֵל מֵעָלֶיךָ
  choice: Allège ainsi ta charge
  rationale: Le hiphil impératif de קל commande d’alléger ce qui pèse sur Moïse. « ta charge » explicite sobrement la métaphore portée par מֵעָלֶיךָ et le contexte.
- source_word: וְנָשְׂאוּ אִתָּךְ
  choice: et ils la porteront avec toi
  rationale: נשא signifie porter ou supporter. Le pronom « la » reprend la charge explicitée dans la proposition précédente, tout en conservant l’image hébraïque.
theological_decisions: []
