  text: וְ/הִזְהַרְתָּ֣ה אֶתְ/הֶ֔ם אֶת הַ/חֻקִּ֖ים וְ/אֶת הַ/תּוֹרֹ֑ת וְ/הוֹדַעְתָּ֣ לָ/הֶ֗ם אֶת הַ/דֶּ֨רֶךְ֙ יֵ֣לְכוּ בָ֔/הּ וְ/אֶת הַֽ/מַּעֲשֶׂ֖ה אֲשֶׁ֥ר יַעֲשֽׂוּ/ן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/020.yaml
  text: And you shall warn them about the statutes and the laws[b][a], and make known to them the way in which they must walk and the work that they must do.
translation:
  language: fr
  text: Tu les avertiras au sujet des prescriptions et des lois[a], et tu leur feras connaître le chemin dans lequel ils doivent marcher[b] et ce qu’ils doivent faire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des instructions » pour « des lois » (hébreu torot). Le terme peut désigner plus largement un enseignement, mais le contexte judiciaire favorise ici « lois ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le chemin dans lequel ils marcheront ». Le verbe « marcher » est conservé afin de préserver la métaphore hébraïque de la conduite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזְהַרְתָּה
  choice: Tu les avertiras
  rationale: Le hifil de זהר peut exprimer l’avertissement ou l’exhortation solennelle. « Avertiras » conserve ici l’idée d’une instruction qui engage la responsabilité.
- source_word: הַחֻקִּים
  choice: les prescriptions
  rationale: חֻקִּים désigne des dispositions fixées ou prescrites. « Prescriptions » est naturel en français moderne et maintient la nuance juridique.
- source_word: הַתּוֹרֹת
  choice: les lois
  rationale: Le pluriel de תּוֹרָה peut désigner des instructions, mais son association avec חֻקִּים dans ce contexte judiciaire favorise « lois », sans exclure le sens plus large signalé en note.
- source_word: וְהוֹדַעְתָּ
  choice: Tu leur feras connaître
  rationale: Cette formulation rend directement la valeur causative du hifil de ידע tout en restant idiomatique.
- source_word: הַדֶּרֶךְ
  choice: le chemin
  rationale: « Chemin » préserve la métaphore hébraïque de la conduite et s’accorde naturellement avec le verbe « marcher ».
- source_word: יֵלְכוּ בָהּ
  choice: dans lequel ils doivent marcher
  rationale: La formulation conserve à la fois la préposition hébraïque, la métaphore de la marche et la valeur prescriptive du contexte.
- source_word: הַמַּעֲשֶׂה אֲשֶׁר יַעֲשׂוּן
  choice: ce qu’ils doivent faire
  rationale: Cette expression française naturelle rend l’action exigée sans l’artificialité de « l’œuvre qu’ils doivent accomplir ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse personnelle de Jéthro à Moïse. La métaphore biblique du chemin et de la marche est volontairement conservée.
