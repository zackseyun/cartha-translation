  text: Moses said to his father-in-law[a], “Because the people come to me to seek God.”
translation:
  language: fr
  text: 'Moïse répondit à son beau-père : « C’est que le peuple vient à moi pour chercher Dieu[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « consulter Dieu », « interroger Dieu » ou « demander une décision à Dieu ». L’expression hébraïque peut désigner le fait de consulter Dieu pour recevoir une direction ou un jugement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: répondit
  rationale: Dans ce dialogue, le verbe אמר introduit la réponse de Moïse à la question posée au verset précédent. « Répondit » est donc naturel en français, tout en restant fidèle à la fonction narrative du verbe.
- source_word: לְחֹתְנוֹ
  choice: à son beau-père
  rationale: Dans ce contexte, חֹתֵן désigne Jéthro, le beau-père de Moïse. C’est l’équivalent français précis et idiomatique.
- source_word: כִּי
  choice: C’est que
  rationale: כִּי introduit ici l’explication donnée par Moïse. « C’est que » rend naturellement cette valeur causale dans une réponse en français moderne.
- source_word: יָבֹא אֵלַי הָעָם
  choice: le peuple vient à moi
  rationale: בוא suivi de אֶל exprime le mouvement vers Moïse. Le présent convient à la valeur habituelle ou générale de l’imparfait hébreu dans cette explication.
- source_word: לִדְרֹשׁ
  choice: pour consulter
  rationale: Avec Dieu comme complément et dans le contexte de litiges soumis à Moïse, דרש exprime ici le fait de s’adresser à Dieu pour obtenir direction ou décision. « Consulter » restitue cette valeur idiomatique sans réduire l’expression à un jugement juridique.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le texte nomme explicitement Dieu. La traduction conserve ce référent plutôt que de le remplacer dans le corps du texte par « la volonté de Dieu » ou « une décision divine ».
theological_decisions:
- issue: Sens de l’expression לִדְרֹשׁ אֱלֹהִים
  choice: consulter Dieu
  alternative: chercher Dieu ; interroger Dieu ; demander une décision à Dieu
  rationale: L’expression peut évoquer largement la recherche de Dieu ou, plus précisément dans ce contexte, le recours à Dieu pour recevoir direction ou jugement. « Consulter Dieu » rend bien le contexte sans enfermer l’expression dans une seule nuance; la note préserve les autres possibilités.
translation_notes:
  register: Français international moderne, clair et digne. « C’est que » donne à la réponse une tournure naturelle; « consulter Dieu » conserve la portée religieuse explicite et la nuance contextuelle de recours à Dieu.
