  text: וַ/יִּקַּ֞ח יִתְר֨וֹ חֹתֵ֥ן מֹשֶׁ֛ה עֹלָ֥ה וּ/זְבָחִ֖ים לֵֽ/אלֹהִ֑ים וַ/יָּבֹ֨א אַהֲרֹ֜ן וְ/כֹ֣ל זִקְנֵ֣י יִשְׂרָאֵ֗ל לֶ/אֱכָל לֶ֛חֶם עִם חֹתֵ֥ן מֹשֶׁ֖ה לִ/פְנֵ֥י הָ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/012.yaml
  text: Then Jethro[a], Moses’ father-in-law, took a burnt offering and sacrifices for God, and Aaron and all the elders of Israel came to eat bread with Moses’ father-in-law before God.
translation:
  language: fr
  text: Puis Jéthro, le beau-père de Moïse, prit une offrande entièrement brûlée et des sacrifices pour Dieu. Aaron et tous les anciens d’Israël vinrent manger du pain[a] avec le beau-père de Moïse devant Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « manger du pain » ; cette expression hébraïque peut signifier « prendre un repas » ou « partager un repas ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe לקח signifie d’abord « prendre ». Le contexte sacrificiel précise la fonction des objets sans qu’il soit nécessaire de traduire explicitement par « offrit ».
- source_word: חֹתֵן מֹשֶׁה
  choice: le beau-père de Moïse
  rationale: Dans ce récit, חֹתֵן désigne Jéthro en tant que beau-père de Moïse. La répétition de cette désignation dans le verset est conservée.
- source_word: עֹלָה
  choice: un holocauste
  rationale: עֹלָה est le terme sacrificiel habituel pour une offrande entièrement consumée. « Holocauste » est l’équivalent biblique français établi et concis.
- source_word: זְבָחִים
  choice: des sacrifices
  rationale: Le pluriel זְבָחִים désigne ici des sacrifices sans en préciser davantage la catégorie; ce choix maintient sa distinction avec l’holocauste.
- source_word: לֵאלֹהִים
  choice: pour Dieu
  rationale: La préposition ל marque ici la destination ou la dédicace des offrandes; « pour Dieu » est naturel en français et n’ajoute pas l’acte d’offrir au verbe.
- source_word: וַיָּבֹא אַהֲרֹן וְכָל זִקְנֵי יִשְׂרָאֵל
  choice: Aaron et tous les anciens d’Israël vinrent
  rationale: Malgré la forme verbale hébraïque singulière placée avant le premier membre, le sujet coordonné se rend naturellement au pluriel en français.
- source_word: לֶאֱכָל לֶחֶם
  choice: manger du pain
  rationale: La traduction garde l’expression concrète de l’hébreu. Une note signale qu’elle peut désigner plus largement le fait de prendre un repas.
- source_word: עִם חֹתֵן מֹשֶׁה
  choice: avec le beau-père de Moïse
  rationale: L’hébreu répète le lien familial plutôt que le nom de Jéthro; cette répétition discursive est respectée.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: devant Dieu
  rationale: Cette formulation rend directement l’idée de présence exprimée par לִפְנֵי, tout en conservant la solennité du cadre cultuel.
theological_decisions:
- issue: Sens du repas dans le contexte sacrificiel
  choice: Conserver « manger du pain » dans le texte tout en signalant qu’il peut s’agir d’un repas partagé lié aux sacrifices.
  alternative: Traduire directement « prendre un repas » ou comprendre qu’il ne s’agit que de pain ordinaire.
  rationale: Le contexte sacrificiel, la participation d’Aaron et des anciens, ainsi que la mention « devant Dieu » suggèrent un repas sacré ou communautaire. La formulation retenue préserve toutefois l’expression hébraïque et ne définit pas plus précisément la nature théologique du repas.
- issue: Référent de אֱלֹהִים
  choice: Dieu
  alternative: les dieux
  rationale: Dans le contexte narratif immédiat, le terme renvoie au Dieu d’Israël; le rendre au singulier évite une ambiguïté polythéiste que le passage n’impose pas.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu sans devenir obscure. Le terme cultuel traditionnel « holocauste » est conservé, tandis que la note explique l’idiome « manger du pain ».
