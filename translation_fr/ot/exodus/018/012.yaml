  terminology: « Sacrifices », « anciens d’Israël », « devant Dieu » et « manger du pain » sont appropriés. Le remplacement de « holocauste » par « offrande entièrement brûlée » maintient la distinction entre עֹלָה et זְבָחִים tout en évitant une association moderne indésirable.
