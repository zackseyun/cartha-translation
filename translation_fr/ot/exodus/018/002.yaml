source:
  edition: WLC
  text: וַ/יִּקַּ֗ח יִתְרוֹ֙ חֹתֵ֣ן מֹשֶׁ֔ה אֶת צִפֹּרָ֖ה אֵ֣שֶׁת מֹשֶׁ֑ה אַחַ֖ר שִׁלּוּחֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/002.yaml
  text: Jethro[a], Moses’ father-in-law, took Zipporah, Moses’ wife, after he had sent her away.
translation:
  language: fr
  text: Jéthro, le beau-père de Moïse, prit Séphora, la femme de Moïse, après son renvoi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « après qu’elle eut été renvoyée ». L’hébreu dit littéralement « après son renvoi », sans préciser qui l’avait renvoyée.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: 'Le verbe לָקַח signifie couramment « prendre ». « Prit » reste direct et laisse ouverte la nuance exacte : Jéthro la prit avec lui ou la reprit sous sa responsabilité.'
- source_word: חֹתֵן מֹשֶׁה
  choice: le beau-père de Moïse
  rationale: חֹתֵן désigne ici Jéthro comme le père de l’épouse de Moïse. Cette formulation est naturelle en français moderne.
- source_word: צִפֹּרָה
  choice: Séphora
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu צִפֹּרָה.
- source_word: אֵשֶׁת מֹשֶׁה
  choice: la femme de Moïse
  rationale: Le groupe construit identifie simplement Séphora comme l’épouse de Moïse ; « la femme de Moïse » est clair et naturel.
- source_word: אַחַר
  choice: après que
  rationale: La préposition exprime ici une succession temporelle. Avec la reformulation verbale française, « après que » rend naturellement ce rapport.
- source_word: שִׁלּוּחֶיהָ
  choice: celui-ci l’eut renvoyée
  rationale: Le nom dérivé de שׁלח avec suffixe féminin signifie littéralement « son renvoi », sans préciser l’agent. Le contexte permet de comprendre Moïse comme agent probable ; « celui-ci » évite l’ambiguïté référentielle qu’aurait un simple « il ». Le passé antérieur convient après « après que » dans ce registre narratif.
theological_decisions:
- issue: Agent implicite dans אַחַר שִׁלּוּחֶיהָ (« après son renvoi »)
  choice: 'Moïse est présenté dans le texte principal comme l’agent probable : « après que celui-ci l’eut renvoyée »'
  alternative: « après qu’elle eut été renvoyée » ou, plus littéralement, « après son renvoi »
  rationale: L’hébreu emploie une forme nominale et ne nomme pas l’agent. Le contexte rend Moïse vraisemblable, mais cette identification n’est pas explicite ; la note conserve donc l’ambiguïté réelle du texte source.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms suivent les formes bibliques françaises usuelles. La répétition de « Moïse » reflète la structure du verset, tandis que « celui-ci » clarifie l’agent retenu sans masquer dans la note l’ambiguïté de l’hébreu.
