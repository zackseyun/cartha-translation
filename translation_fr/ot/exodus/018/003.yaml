  text: and her two sons[a], of whom the name of the one was Gershom, for he said, “I have been a foreigner in a foreign land.”
translation:
  language: fr
  text: 'Jéthro prit aussi ses deux fils. L’un s’appelait Guershom[a], car Moïse avait dit : « J’ai été un étranger dans un pays étranger. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom « Guershom » fait écho en hébreu au terme rendu ici par « étranger ». Ce terme peut aussi désigner un résident temporaire ou une personne vivant hors de son pays.
    reason: jeu_de_mots_et_alternative_lexicale
lexical_decisions:
- source_word: וְאֵת שְׁנֵי בָנֶיהָ
  choice: ainsi que ses deux fils
  rationale: 'Le syntagme poursuit la liste commencée au verset précédent : אֵת marque l’objet direct du verbe sous-entendu, tandis que וְ relie ce nouvel élément. « Ainsi que » rend naturellement cette continuité en français.'
- source_word: אֲשֶׁר שֵׁם הָאֶחָד גֵּרְשֹׁם
  choice: L’un s’appelait Guershom
  rationale: Cette formulation française naturelle distingue l’un des deux fils sans imposer un ordre que הָאֶחָד n’exprime pas nécessairement. « Guershom » suit la graphie française biblique usuelle.
- source_word: כִּי אָמַר
  choice: car Moïse avait dit
  rationale: כִּי introduit l’explication du nom. Le sujet implicite est Moïse, explicité pour éviter en français que « il » soit attribué au fils; le plus-que-parfait situe naturellement cette parole avant le récit présent.
- source_word: גֵּר
  choice: immigré
  rationale: גֵּר désigne ici une personne qui réside hors de son pays et demeure extérieure au groupe local. « Immigré » est actuel et intelligible, tout en conservant l’idée de résidence étrangère; la note signale d’autres nuances possibles.
- source_word: הָיִיתִי
  choice: J’ai été
  rationale: Le qatal exprime l’expérience passée de Moïse. Le passé composé est naturel en français moderne et laisse ouverte la question de la durée exacte de cette condition.
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: dans un pays étranger
  rationale: Cette expression rend directement אֶרֶץ נָכְרִיָּה dans un français courant et digne, et maintient l’écho sémantique entre le statut d’étranger et le pays étranger.
