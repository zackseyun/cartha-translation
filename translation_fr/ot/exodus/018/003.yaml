- from: 'ainsi que ses deux fils. L’un s’appelait Guershom[a], car Moïse avait dit : « J’ai été immigré dans un pays étranger. »'
  to: 'Jéthro prit aussi ses deux fils. L’un s’appelait Guershom[a], car Moïse avait dit : « J’ai été un étranger dans un pays étranger. »'
  rationale: La révision remplace un terme administratif moderne par « étranger », plus fidèle à la portée de גֵּר et plus naturel dans la citation. Elle rend également explicite, pour une lecture autonome en français, le verbe et le sujet repris du verset précédent. La note conserve l’écho lexical entre le nom et le terme hébreu tout en évitant de surdéterminer l’étymologie.
