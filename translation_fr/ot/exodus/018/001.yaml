  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע יִתְר֨וֹ כֹהֵ֤ן מִדְיָן֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה אֱלֹהִים֙ לְ/מֹשֶׁ֔ה וּ/לְ/יִשְׂרָאֵ֖ל עַמּ֑/וֹ כִּֽי הוֹצִ֧יא יְהוָ֛ה אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/001.yaml
  text: Jethro[a], the priest of Midian, Moses’ father-in-law, heard all that God had done for Moses and for Israel his people, that Yahweh had brought Israel out of Egypt.
translation:
  language: fr
  text: 'Jéthro, prêtre de Madian et beau-père de Moïse, apprit tout ce que Dieu avait fait pour Moïse et pour Israël, son peuple[a] : Yahweh avait fait sortir Israël d’Égypte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Israël, le peuple de Moïse ». Le possessif « son » peut grammaticalement se rapporter à Moïse, mais, dans le contexte, il renvoie très probablement à Dieu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: apprit
  rationale: Dans ce contexte, le verbe signifie que Jéthro reçut la nouvelle des actes de Dieu. « Apprit » est naturel en français et fait avancer le récit sans ajouter un marqueur temporel absent.
- source_word: כֹהֵן מִדְיָן
  choice: prêtre de Madian
  rationale: Le groupe construit identifie Jéthro par sa fonction et son rattachement à Madian; l’absence d’article est idiomatique après son nom en français.
- source_word: חֹתֵן מֹשֶׁה
  choice: beau-père de Moïse
  rationale: Dans ce contexte, חֹתֵן désigne précisément le père de l’épouse de Moïse.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה אֱלֹהִים
  choice: tout ce que Dieu avait fait
  rationale: Cette formulation conserve la portée globale de כָּל אֲשֶׁר; le plus-que-parfait exprime naturellement l’antériorité des actes rapportés.
- source_word: לְמֹשֶׁה וּלְיִשְׂרָאֵל
  choice: pour Moïse et pour Israël
  rationale: La préposition ל indique ici l’action bénéfique accomplie en faveur de Moïse et d’Israël.
- source_word: עַמּוֹ
  choice: son peuple
  rationale: Le possessif masculin singulier est conservé sans expliciter son antécédent dans le texte principal, afin de préserver l’ambiguïté grammaticale de l’hébreu.
- source_word: כִּי
  choice: ':'
  rationale: Ici, כִּי précise le contenu de ce que Jéthro avait appris. En français, les deux-points introduisent naturellement cette explication sans imposer une valeur causale.
- source_word: הוֹצִיא
  choice: avait fait sortir
  rationale: 'Le hiphil de יצא exprime la causation : Yahweh a fait sortir Israël. Cette traduction est précise et idiomatique.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: מִמִּצְרָיִם
  choice: d’Égypte
  rationale: Avec « faire sortir », la préposition française « de » exprime naturellement le mouvement hors d’Égypte.
theological_decisions:
- issue: Antécédent du possessif dans עַמּוֹ
  choice: « Israël, son peuple » est laissé grammaticalement ouvert, avec Dieu comme référent contextuellement le plus probable.
  alternative: 'Le possessif peut grammaticalement renvoyer à Moïse : « Israël, le peuple de Moïse ».'
  rationale: Dieu est l’antécédent contextuel le plus cohérent, et la suite attribue explicitement la sortie d’Égypte à Yahweh. Toutefois, la formulation du texte principal et la note préservent l’autre rattachement grammatical possible.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure informative du verset tout en employant une ponctuation française naturelle. Le nom divin est rendu par « Yahweh ».
