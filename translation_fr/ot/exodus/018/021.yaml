  source_fidelity: 'Le projet rend fidèlement les qualifications : אַנְשֵׁי־חַיִל est bien compris dans son contexte administratif comme « hommes compétents », יִרְאֵי אֱלֹהִים est conservé par « qui craignent Dieu », et אַנְשֵׁי אֱמֶת est justement rendu idiomatiquement par « dignes de confiance », avec une note littérale. Le rejet du בָּצַע est également bien exprimé. La formulation de l''investiture est fidèle dans son intention, mais peut être rendue plus naturellement en français.'
