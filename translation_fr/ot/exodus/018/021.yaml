source:
  edition: WLC
  text: וְ/אַתָּ֣ה תֶחֱזֶ֣ה מִ/כָּל הָ֠/עָם אַנְשֵׁי חַ֜יִל יִרְאֵ֧י אֱלֹהִ֛ים אַנְשֵׁ֥י אֱמֶ֖ת שֹׂ֣נְאֵי בָ֑צַע וְ/שַׂמְתָּ֣ עֲלֵ/הֶ֗ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְ/שָׂרֵ֥י עֲשָׂרֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/021.yaml
  text: But you shall select from all the people able men[a], those who fear God, men of truth, hating dishonest gain; and you shall appoint them over them as chiefs of thousands, chiefs of hundreds, chiefs of fifties[c][b], and chiefs of tens.
translation:
  language: fr
  text: Mais toi, choisis parmi tout le peuple des hommes compétents[a], qui craignent Dieu, qui sont dignes de confiance[b] et qui détestent le gain malhonnête[c]. Établis-les à la tête du peuple comme chefs de mille, de cent, de cinquante et de dix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des hommes de valeur ». L’expression hébraïque peut évoquer la force, la compétence ou la vaillance selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « des hommes de vérité » ; l’expression désigne des hommes vrais, fiables et intègres.
    reason: lexical_alternative
  - marker: c
    text: Ou « le gain injuste » ; il s’agit de rejeter tout profit obtenu de manière corrompue.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶחֱזֶה
  choice: choisis
  rationale: Le verbe signifie littéralement « voir, discerner »; dans ce contexte, il s’agit de repérer et de sélectionner des responsables qualifiés. « Choisis » exprime naturellement cette portée.
- source_word: מִכָּל־הָעָם
  choice: parmi tout le peuple
  rationale: 'Rend clairement la valeur partitive de la préposition : les hommes doivent être choisis au sein de l’ensemble du peuple.'
- source_word: אַנְשֵׁי חַיִל
  choice: des hommes compétents
  rationale: חַיִל peut évoquer la force, la valeur, les capacités ou la compétence. Le contexte judiciaire et administratif favorise ici « compétents », sans exclure les autres nuances signalées en note.
- source_word: יִרְאֵי אֱלֹהִים
  choice: qui craignent Dieu
  rationale: Conserve l’expression biblique de la crainte de Dieu, qui désigne ici la révérence envers Dieu comme qualité morale.
- source_word: אַנְשֵׁי אֱמֶת
  choice: des hommes dignes de confiance
  rationale: Littéralement « hommes de vérité »; אֱמֶת englobe vérité, fiabilité et fidélité. En français courant, « dignes de confiance » communique le mieux la qualité attendue de juges.
- source_word: שֹׂנְאֵי בָצַע
  choice: qui détestent les profits malhonnêtes
  rationale: בֶּצַע désigne ici un gain recherché de manière injuste ou corrompue. Cette formulation conserve la force de « détester » et ne limite pas le sens aux seuls pots-de-vin.
- source_word: וְשַׂמְתָּ עֲלֵהֶם
  choice: Établis-les sur le peuple
  rationale: Le second pronom hébreu renvoie au peuple. Le référent explicite évite en français l’ambiguïté et la lourdeur de « établis-les sur eux ».
- source_word: שָׂרֵי
  choice: chefs de
  rationale: שַׂר désigne un chef ou responsable investi d’autorité. « Chefs » préserve la structure administrative sans imposer une lecture exclusivement militaire.
- source_word: אֲלָפִים / מֵאוֹת / חֲמִשִּׁים / עֲשָׂרֹת
  choice: milliers… centaines… cinquantaines… dizaines
  rationale: Ces termes présentent des échelons numériques de responsabilité. « Cinquantaines » maintient le parallélisme formel et désigne des groupes de cinquante.
theological_decisions:
- issue: Langage genré dans les qualifications des responsables
  choice: des hommes compétents… des hommes dignes de confiance
  alternative: des personnes compétentes… des personnes dignes de confiance
  rationale: L’hébreu emploie explicitement des expressions masculines plurielles. La traduction les conserve sans en tirer une affirmation doctrinale dépassant la portée du verset.
- issue: Sens de la crainte de Dieu
  choice: qui craignent Dieu
  alternative: respectueux de Dieu
  rationale: La formulation traditionnelle et directe préserve la tension sémantique de ירא, qui peut inclure crainte, respect et révérence, plutôt que de la réduire au seul respect.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement restructurée pour éviter la répétition maladroite des pronoms et rendre les quatre qualités nettement lisibles. « Cinquantaines » est soutenu mais transparent dans cette série administrative.
