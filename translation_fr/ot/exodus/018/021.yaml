  terminology: « Hommes compétents », « craignent Dieu », « dignes de confiance » et « chefs » conviennent au registre et au contexte. « Le gain malhonnête » est plus idiomatique et plus près du singulier collectif hébreu que « les profits malhonnêtes ».
