  yaml_path: translation/ot/exodus/018/027.yaml
  text: Then Moses sent his father-in-law away[a], and he went to his own land.
translation:
  language: fr
  text: Puis Moïse laissa partir son beau-père[a], et ce dernier partit pour son pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Moïse renvoya son beau-père, et celui-ci partit pour son pays. »'
    reason: 'Alternative lexicale : au piel, שׁלח peut exprimer le fait de laisser partir, de renvoyer ou de congédier quelqu’un.'
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: laissa partir
  rationale: Au piel avec une personne pour complément, שׁלח signifie ici renvoyer ou laisser partir. « Laissa partir » exprime naturellement en français un départ consenti sans suggérer nécessairement un congédiement brusque.
- source_word: חֹתְנוֹ
  choice: son beau-père
  rationale: Dans ce contexte, חֹתֵן désigne Jéthro, le père de la femme de Moïse ; « beau-père » en donne clairement le sens contextuel.
- source_word: וַיֵּלֶךְ לוֹ
  choice: qui retourna
  rationale: La tournure avec לוֹ est idiomatique. Puisque le déplacement se fait vers son propre pays après un séjour auprès de Moïse, « retourna » rend naturellement le mouvement implicite, tandis que la relative évite une coordination française pesante.
- source_word: אֶל אַרְצוֹ
  choice: dans son pays
  rationale: אֶרֶץ peut désigner une terre ou un pays. Ici, « dans son pays » est idiomatique en français et n'impose pas l'idée moderne d'un État-nation.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve la brièveté narrative de l’hébreu ; « laissa partir » évite la connotation potentiellement dure de « congédia », signalée toutefois en note comme possibilité lexicale.
