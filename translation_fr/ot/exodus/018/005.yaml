base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/005.yaml
  text: Then Jethro[a], Moses' father-in-law, came to Moses in the wilderness, where he was camped at the mountain of God[b], with his sons and his wife.
translation:
  language: fr
  text: Alors Jéthro, beau-père de Moïse, vint auprès de Moïse dans le désert, là où celui-ci campait, à la montagne de Dieu[a], avec les fils et la femme de Moïse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la montagne de Dieu », désignation associée au Sinaï ou à l’Horeb.'
    reason: cross_reference
  - marker: b
    text: 'Littéralement : « et ses fils et sa femme ». D’après le contexte (18.2-4), il s’agit des fils et de la femme de Moïse ; la forme hébraïque conserve toutefois les pronoms possessifs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: vint donc
  rationale: Le wayyiqtol fait progresser le récit. « Donc » marque naturellement la suite narrative en français sans reproduire mécaniquement « et ».
- source_word: יִתְרוֹ
  choice: Jéthro
  rationale: Translittération française usuelle du nom propre.
- source_word: חֹתֵן מֹשֶׁה
  choice: beau-père de Moïse
  rationale: Le syntagme construit désigne le lien de parenté entre Jéthro et Moïse; « beau-père » est le terme français courant et précis.
- source_word: וּבָנָיו וְאִשְׁתּוֹ
  choice: avec les fils et la femme de Moïse
  rationale: Les suffixes renvoient le plus naturellement à Moïse dans le contexte immédiat. La répétition de son nom lève en français une ambiguïté pronominale plus forte qu'en hébreu, tandis qu'une note signale la forme littérale.
- source_word: אֶל מֹשֶׁה
  choice: trouver Moïse
  rationale: Après « venir », « venir trouver quelqu’un » exprime naturellement en français le mouvement vers une personne, sans nécessairement ajouter l'idée formelle d'une rencontre organisée.
- source_word: אֶל הַמִּדְבָּר
  choice: dans le désert
  rationale: Le français situe idiomatiquement Moïse « dans le désert »; la proposition relative précise le lieu où il campe.
- source_word: אֲשֶׁר הוּא חֹנֶה שָׁם
  choice: où celui-ci campait
  rationale: « Celui-ci » identifie clairement Moïse comme sujet. L'imparfait rend naturellement l'état ou l'action en cours au moment de l'arrivée.
- source_word: הַר הָאֱלֹהִים
  choice: la montagne de Dieu
  rationale: Traduction transparente du syntagme construit, sans substituer les noms Sinaï ou Horeb qui ne figurent pas dans ce verset.
theological_decisions:
- issue: Référent des suffixes dans « ses fils » et « sa femme »
  choice: Les suffixes renvoient à Moïse; le texte français explicite « de Moïse ».
  alternative: Les suffixes pourraient être compris grammaticalement comme renvoyant à Jéthro si l'on s'en tenait au sujet le plus proche.
  rationale: Exode 18.2 mentionne immédiatement Séphora, femme de Moïse, et ses deux fils, que Jéthro avait pris avec lui. Le verset 5 reprend naturellement ces personnes. La note conserve toutefois la formulation littérale et son ambiguïté de surface.
- issue: Identification de « la montagne de Dieu »
  choice: Conserver le titre descriptif.
  alternative: Traduire par « mont Sinaï » ou « Horeb ».
  rationale: Le texte hébreu dit הַר הָאֱלֹהִים et ne donne ici aucun nom propre; le traduire directement évite une précision importée.
- issue: Rapport spatial entre le campement et la montagne
  choice: « campait près de la montagne de Dieu »
  alternative: « campait à la montagne de Dieu »
  rationale: L'hébreu juxtapose la proposition « où il campait » et « la montagne de Dieu » sans préposition explicite devant cette dernière. « Près de » fournit une relation spatiale française naturelle sans affirmer qu'il campait sur la montagne elle-même.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase évite les tournures archaïques, explicite les référents nécessaires à la clarté française et conserve le titre « montagne de Dieu ». Tous les marqueurs de notes figurent dans le texte.
