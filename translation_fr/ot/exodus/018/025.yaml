source:
  edition: WLC
  text: וַ/יִּבְחַ֨ר מֹשֶׁ֤ה אַנְשֵׁי חַ֨יִל֙ מִ/כָּל יִשְׂרָאֵ֔ל וַ/יִּתֵּ֥ן אֹתָ֛/ם רָאשִׁ֖ים עַל הָ/עָ֑ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְ/שָׂרֵ֥י עֲשָׂרֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/025.yaml
  text: 'Moses chose capable men from all Israel and appointed them as heads over the people: commanders of thousands[a], commanders of hundreds, commanders of fifties[b], and commanders of tens.'
translation:
  language: fr
  text: 'Moïse choisit parmi tout Israël des hommes compétents[a] et les établit comme chefs[b] du peuple : chefs de milliers, chefs de centaines, chefs de cinquantaines et chefs de dizaines.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des hommes de valeur ». L’expression hébraïque peut désigner des hommes forts, capables ou de valeur éprouvée ; ici, le contexte met surtout en avant leur aptitude à diriger.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « comme têtes ». En hébreu, la tête est une image courante de la personne qui exerce une autorité.
    reason: lexical_metaphor
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: choisit
  rationale: Le verbe בחר signifie directement « choisir » ou « sélectionner » ; « choisit » convient naturellement au récit français.
- source_word: אַנְשֵׁי חַיִל
  choice: des hommes compétents
  rationale: Dans ce contexte d’organisation judiciaire et administrative, חַיִל évoque surtout la capacité et la valeur éprouvée, sans imposer le sens militaire de vaillance.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: parmi tout Israël
  rationale: La préposition מן indique que les hommes sont sélectionnés au sein de l’ensemble d’Israël.
- source_word: וַיִּתֵּן אֹתָם
  choice: les établit
  rationale: Le verbe נתן, littéralement « mettre » ou « placer », exprime ici l’affectation à une fonction d’autorité ; « établir » garde cette nuance sans lourdeur administrative.
- source_word: רָאשִׁים
  choice: chefs
  rationale: Le nom signifie littéralement « têtes » et désigne métaphoriquement des personnes investies d’autorité. « Chefs » rend clairement cette métaphore lexicalisée en français.
- source_word: עַל הָעָם
  choice: du peuple
  rationale: Avec un terme d’autorité, le français exprime idiomatiquement la responsabilité exercée sur le peuple par « chefs du peuple ».
- source_word: שָׂרֵי
  choice: chefs
  rationale: שַׂר désigne ici des responsables placés à la tête d’unités hiérarchisées. « Chefs » est plus adapté que « commandants », qui donnerait inutilement à la scène un caractère militaire.
- source_word: אֲלָפִים / מֵאוֹת / חֲמִשִּׁים / עֲשָׂרֹת
  choice: milliers, centaines, cinquantaines et dizaines
  rationale: Ces pluriels désignent les unités numériques relevant de chaque chef. Les substantifs collectifs français conservent la structure graduée du texte hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « chefs » reproduit la cadence et la hiérarchie de l’hébreu. « Cinquantaines » et « dizaines » sont employés comme noms d’unités organisées.
