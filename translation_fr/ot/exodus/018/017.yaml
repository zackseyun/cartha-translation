translation_notes:
  register: Français moderne, courant et digne. Le tutoiement convient au dialogue familial et correspond au pronom singulier אַתָּה. La formulation principale privilégie une équivalence optimale, tandis que la note conserve la structure plus formelle de l’hébreu.
