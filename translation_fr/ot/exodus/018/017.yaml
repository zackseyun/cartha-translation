  text: Moses' father-in-law said to him[a], “What you are doing is not good.”
translation:
  language: fr
  text: 'Le beau-père de Moïse lui dit : « Ce que tu fais n’est pas bon.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « La chose que tu fais n’est pas bonne. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait avancer le récit. En français naturel, « dit » suffit sans rendre mécaniquement le waw initial par « et ».
- source_word: חֹתֵן מֹשֶׁה
  choice: le beau-père de Moïse
  rationale: Cette tournure rend clairement et naturellement la relation exprimée par la chaîne construite hébraïque.
- source_word: אֵלָיו
  choice: lui
  rationale: Le pronom renvoie à Moïse; « lui dit » reproduit ce renvoi sans répéter inutilement son nom.
- source_word: לֹא טוֹב
  choice: n’est pas bon
  rationale: Cette traduction directe conserve la portée évaluative large de טוֹב sans la préciser indûment comme « juste » ou « avantageux ».
- source_word: הַדָּבָר אֲשֶׁר אַתָּה עֹשֶׂה
  choice: Ce que tu fais
  rationale: Cette formulation française naturelle rend l’expression nominale « la chose que tu fais » tout en conservant la référence à la pratique actuelle de Moïse.
