  to: 'Maintenant, écoute-moi : je vais te conseiller, et que Dieu soit avec toi.[a] Toi, représente le peuple devant Dieu,[b] et présente les affaires à Dieu.[c]'
  rationale: 'La révision distingue les deux relations prépositionnelles du texte hébreu : Moïse représente le peuple « devant Dieu », puis il présente les affaires « à Dieu ». Elle reformule également la note sur la valeur volitive possible sans modifier le sens du texte principal ni imposer une interprétation doctrinale.'
