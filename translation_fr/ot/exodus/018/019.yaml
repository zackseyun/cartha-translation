base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/019.yaml
  text: Now listen to my voice[a]; I will advise you, and God be with you. You be for the people before God[c][b], and you shall bring the matters to God.
translation:
  language: fr
  text: 'Maintenant, écoute-moi : je vais te conseiller, et que Dieu soit avec toi.[a] Toi, représente le peuple devant Dieu,[b] et présente les affaires à Dieu.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre possibilité : « et Dieu sera avec toi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sois, toi, pour le peuple devant Dieu ».'
    reason: alternative_reading
  - marker: c
    text: Les « affaires » sont ici les cas ou les différends que le peuple soumet pour qu’une décision soit rendue.
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: Maintenant
  rationale: Marqueur temporel et discursif qui introduit le conseil de Jéthro; « Maintenant » est naturel et direct.
- source_word: שְׁמַע בְּקֹלִי
  choice: écoute-moi
  rationale: Littéralement « écoute ma voix »; l’idiome français courant « écoute-moi » conserve ici l’idée d’attention sans renforcer indûment en « obéis-moi ».
- source_word: אִיעָצְךָ
  choice: je vais te conseiller
  rationale: Le verbe יעץ signifie conseiller; le futur proche convient naturellement à l’annonce immédiate du conseil qui suit.
- source_word: וִיהִי אֱלֹהִים עִמָּךְ
  choice: et que Dieu soit avec toi
  rationale: Rend explicitement la valeur volitive du jussif hébreu, comme souhait ou bénédiction.
- source_word: הֱיֵה אַתָּה לָעָם מוּל הָאֱלֹהִים
  choice: Toi, représente le peuple devant Dieu
  rationale: La tournure hébraïque, littéralement « sois, toi, pour le peuple devant Dieu », décrit naturellement une fonction de représentation; « Toi » garde l’emphase du pronom.
- source_word: וְהֵבֵאתָ
  choice: porte
  rationale: Dans la séquence d’instructions, le parfait avec waw poursuit l’impératif; l’impératif français rend clairement cette valeur directive.
- source_word: הַדְּבָרִים
  choice: les affaires
  rationale: דברים est large (« paroles, choses, affaires »); dans le contexte judiciaire, « affaires » évoque les cas soumis sans réduire le terme aux seuls litiges.
- source_word: אֶל הָאֱלֹהִים
  choice: devant Dieu
  rationale: Avec le verbe « porter », « devant Dieu » exprime idiomatiquement la présentation à Dieu, tout en faisant écho au syntagme précédent.
theological_decisions:
- issue: Sens de אֱלֹהִים dans ce contexte narratif
  choice: Dieu
  alternative: les juges / la divinité
  rationale: Les formes et le contexte désignent le Dieu d’Israël; la traduction simple « Dieu » est standard et n’ajoute aucun qualificatif interprétatif.
- issue: Degré d’explicitation du rôle médiateur de Moïse
  choice: représente le peuple devant Dieu
  alternative: sois pour le peuple devant Dieu
  rationale: La traduction retenue explicite la fonction indiquée par l’hébreu tout en signalant en note la formulation plus littérale, afin de préserver l’ambiguïté de la construction.
- issue: Valeur de וִיהִי אֱלֹהִים עִמָּךְ
  choice: 'souhait ou bénédiction : « que Dieu soit avec toi »'
  alternative: 'énoncé de conséquence : « et Dieu sera avec toi »'
  rationale: La forme jussive favorise une valeur volitive; l’autre compréhension demeure possible selon l’enchaînement du conseil et est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au dialogue direct entre Jéthro et Moïse. La syntaxe privilégie une formulation naturelle tout en conservant l’emphase sur « Toi » et en documentant la construction hébraïque plus littérale.
