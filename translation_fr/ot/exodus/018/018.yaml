  yaml_path: translation/ot/exodus/018/018.yaml
  text: You will surely wear yourself out[a], both you and this people who are with you, because the matter is too heavy for you. You are not able to do it by yourself.
translation:
  language: fr
  text: Toi et ce peuple qui est avec toi, vous allez certainement vous épuiser[a], car cette affaire est trop lourde pour toi. Tu ne peux pas la faire seul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Vous allez certainement dépérir. » L’hébreu répète le verbe sous deux formes pour renforcer l’affirmation : littéralement, « dépérissant, tu dépériras ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבֹל תִּבֹּל
  choice: Tu vas certainement t’épuiser
  rationale: L’infinitif absolu suivi de l’imparfait intensifie le verbe et marque ici la certitude. « Certainement » restitue cette insistance, tandis que « t’épuiser » exprime naturellement l’effet du surmenage dans ce contexte.
- source_word: גַּם אַתָּה גַּם הָעָם הַזֶּה
  choice: toi comme ce peuple
  rationale: La répétition de גַּם inclut expressément Moïse et le peuple. « Toi comme ce peuple » est une formulation française naturelle qui conserve le caractère collectif singulier de עָם.
- source_word: אֲשֶׁר עִמָּךְ
  choice: qui est avec toi
  rationale: L’accord au singulier respecte le nom collectif « peuple » et rend directement la relation exprimée par עִמָּךְ.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’avertissement. « Car » convient au registre digne du passage sans alourdir la phrase.
- source_word: כָבֵד מִמְּךָ הַדָּבָר
  choice: cette tâche est trop lourde pour toi
  rationale: כָבֵד conserve son image de poids excessif. Dans le contexte du travail judiciaire de Moïse, « tâche » rend דָּבָר de manière claire sans préciser davantage la nature de l’activité.
- source_word: לֹא תוּכַל עֲשֹׂהוּ
  choice: Tu ne peux pas l’accomplir
  rationale: La formulation exprime directement l’incapacité indiquée par לֹא תוּכַל. « L’accomplir » reprend naturellement la tâche mentionnée, tout en restant proche du sens général de עשה.
- source_word: לְבַדֶּךָ
  choice: seul
  rationale: « Seul » exprime avec concision que Moïse ne peut mener cette tâche à bien sans aide.
