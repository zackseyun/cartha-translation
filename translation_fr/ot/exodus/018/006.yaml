  text: וַ/יֹּ֨אמֶר֙ אֶל מֹשֶׁ֔ה אֲנִ֛י חֹתֶנְ/ךָ֥ יִתְר֖וֹ בָּ֣א אֵלֶ֑י/ךָ וְ/אִ֨שְׁתְּ/ךָ֔ וּ/שְׁנֵ֥י בָנֶ֖י/הָ עִמָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/006.yaml
  text: He said to Moses[a], “I, Jethro your father-in-law, am coming to you, with your wife and her two sons with her.”
translation:
  language: fr
  text: 'Il dit à Moïse : « Moi, Jéthro, ton beau-père, je viens vers toi, accompagné de ta femme et de ses deux fils, qui sont avec elle.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et ses deux fils avec elle ». Certaines traductions rendent « tes deux fils », mais le texte hébreu porte un suffixe féminin singulier : « ses deux fils », c’est-à-dire ceux de la femme de Moïse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le wayyiqtol fait progresser le récit. En français, « Il dit » est naturel sans qu’il soit nécessaire de rendre explicitement le waw initial.
- source_word: אֶל מֹשֶׁה
  choice: à Moïse
  rationale: Rend l’emploi directionnel courant de אֶל avec le nom propre.
- source_word: אֲנִי
  choice: Moi… je
  rationale: La dislocation « Moi… je » restitue naturellement en français l’insistance portée par le pronom indépendant hébreu.
- source_word: חֹתֶנְךָ
  choice: ton beau-père
  rationale: Dans ce contexte, Jéthro est le père de la femme de Moïse ; « beau-père » est donc précis et idiomatique.
- source_word: יִתְרוֹ
  choice: Jéthro
  rationale: Translittération française usuelle du nom propre.
- source_word: בָּא אֵלֶיךָ
  choice: je viens vers toi
  rationale: Le participe בָּא exprime ici une venue en cours ou imminente ; le présent français en conserve la valeur sans imposer un accompli.
- source_word: וְאִשְׁתְּךָ
  choice: accompagné de ta femme
  rationale: Dans l’annonce, la conjonction introduit les personnes qui accompagnent Jéthro. Cette formulation explicite naturellement ce rapport en français.
- source_word: וּשְׁנֵי בָנֶיהָ
  choice: et de ses deux fils
  rationale: Le suffixe est à la troisième personne féminine du singulier et renvoie à la femme de Moïse. Le texte massorétique dit donc littéralement « ses deux fils », non « tes deux fils ».
- source_word: עִמָּהּ
  choice: qui sont avec elle
  rationale: Cette proposition conserve l’indication explicite selon laquelle les deux fils sont avec la femme de Moïse, tout en évitant une tournure française maladroite.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La reprise « Moi… je » conserve l’emphase de אֲנִי. « Accompagné de » rend clairement le rapport d’accompagnement, tandis que la note maintient visible la formulation hébraïque inhabituelle « ses deux fils avec elle ».
