base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/024.yaml
  text: So Moses listened to the voice of his father-in-law and did all that he said[a].
translation:
  language: fr
  text: Moïse écouta son beau-père et fit tout ce qu’il dit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « suivit les conseils de son beau-père ». L’expression hébraïque signifie littéralement « écouta la voix de son beau-père » et peut évoquer une écoute qui conduit à l’obéissance, comme le montre la proposition suivante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: écouta
  rationale: Avec לְקוֹל, le verbe שׁמע exprime ici une écoute suivie d’effet. « Écouta » conserve cette nuance sans faire double emploi avec la proposition suivante, qui rend explicite l’obéissance de Moïse.
- source_word: לְקוֹל חֹתְנוֹ
  choice: son beau-père
  rationale: L’expression hébraïque signifie littéralement « la voix de son beau-père », mais en français actuel « écouter son beau-père » rend naturellement l’idiome; le contexte identifie clairement חֹתְנוֹ comme le beau-père de Moïse.
- source_word: וַיַּעַשׂ
  choice: fit
  rationale: Le verbe עשה a ici son sens courant de « faire » et introduit directement ce que Moïse a mis en pratique.
- source_word: כֹּל אֲשֶׁר אָמָר
  choice: tout ce qu’il avait dit
  rationale: La relative désigne l’ensemble des paroles ou consignes précédemment données par le beau-père; le plus-que-parfait est naturel en français narratif et explicite l’antériorité contextuelle sans modifier le sens.
