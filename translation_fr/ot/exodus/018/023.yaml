source:
  edition: WLC
  text: אִ֣ם אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ תַּעֲשֶׂ֔ה וְ/צִוְּ/ךָ֣ אֱלֹהִ֔ים וְ/יָֽכָלְתָּ֖ עֲמֹ֑ד וְ/גַם֙ כָּל הָ/עָ֣ם הַ/זֶּ֔ה עַל מְקֹמ֖/וֹ יָבֹ֥א בְ/שָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/023.yaml
  text: If you do this thing[a], and God so commands you, then you will be able to endure[d][c][b], and all this people also will go to their place in peace.
translation:
  language: fr
  text: Si tu fais cela[a], et si Dieu te l’ordonne, tu pourras tenir bon[b], et tout ce peuple arrivera lui aussi à sa place en paix[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette affaire » ou « ce projet ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « te tenir debout »; ici, « tenir bon » ou « supporter la charge ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « arrivera à son lieu ». Le peuple est envisagé comme un ensemble; le sens peut être que chacun regagnera en paix sa place ou son foyer.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אֶת־הַדָּבָר הַזֶּה תַּעֲשֶׂה
  choice: Si tu fais cela
  rationale: La tournure exprime directement la condition. « Cela » renvoie naturellement, en français, au plan que Jéthro vient de proposer, sans alourdir le texte par « cette chose ».
- source_word: וְצִוְּךָ אֱלֹהִים
  choice: et si Dieu te l’ordonne
  rationale: Le second « si » explicite en français que l’ordre de Dieu constitue une condition supplémentaire, conformément à la relation syntaxique la plus probable avec אִם, sans faire de Jéthro l’autorité ultime.
- source_word: וְיָכָלְתָּ עֲמֹד
  choice: tu pourras tenir bon
  rationale: יכל avec l’infinitif marque la capacité, tandis que עמד signifie littéralement « se tenir debout » et prend ici le sens contextuel de résister à la charge. « Tenir bon » conserve l’image et reste naturel.
- source_word: וְגַם כָּל־הָעָם הַזֶּה
  choice: et tout ce peuple … lui aussi
  rationale: « Tout ce peuple » respecte le collectif singulier hébreu; « lui aussi » rend la valeur additive de וְגַם et distingue ce second résultat de celui qui concerne Moïse.
- source_word: עַל־מְקֹמוֹ יָבֹא
  choice: arrivera … chez lui
  rationale: בוא désigne l’arrivée et עַל־מְקֹמוֹ, littéralement « à son lieu », se rapporte au peuple envisagé collectivement. « Chez lui » exprime naturellement en français l’idée que chacun regagnera sa place ou son foyer.
- source_word: בְשָׁלוֹם
  choice: en paix
  rationale: 'Cette expression garde l’étendue de שָׁלוֹם : paix, sécurité et bien-être.'
theological_decisions:
- issue: Rapport entre le conseil de Jéthro et l’ordre de Dieu
  choice: 'Présenter l’ordre de Dieu comme une seconde condition : « et si Dieu te l’ordonne »'
  alternative: « et que Dieu te donne ses ordres » ou « et Dieu te l’ordonnera »
  rationale: Le contexte et la coordination favorisent une condition ajoutée à « si tu fais cela ». Cette formulation préserve la nécessité de la sanction divine sans affirmer que Dieu a déjà approuvé le plan ni transformer la proposition en prédiction.
- issue: Sens de la promesse concernant le peuple
  choice: « arrivera … chez lui en paix »
  alternative: « retournera chacun à sa place en paix »
  rationale: Le singulier collectif de l’hébreu est maintenu autant que le permet le français. Le texte peut évoquer le retour au foyer ou, plus largement, l’arrivée de chacun à la place qui lui revient; la note préserve cette amplitude.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond au dialogue direct entre Jéthro et Moïse. « Tenir bon » est courant sans être familier; « tout ce peuple » conserve le relief collectif de l’hébreu. Les marqueurs [a], [b] et [c] figurent tous dans le texte principal.
