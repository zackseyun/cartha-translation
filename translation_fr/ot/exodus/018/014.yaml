  to: 'Quand le beau-père de Moïse vit tout ce que celui-ci faisait pour le peuple, il dit : « Qu’est-ce que cela signifie, ce que tu fais pour le peuple[a] ? Pourquoi restes-tu assis seul, tandis que tout le peuple se tient debout devant toi du matin jusqu’au soir ? »'
