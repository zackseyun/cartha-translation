  text: וַ/יַּרְא֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵ֛ת כָּל אֲשֶׁר ה֥וּא עֹשֶׂ֖ה לָ/עָ֑ם וַ/יֹּ֗אמֶר מָֽה הַ/דָּבָ֤ר הַ/זֶּה֙ אֲשֶׁ֨ר אַתָּ֤ה עֹשֶׂה֙ לָ/עָ֔ם מַדּ֗וּעַ אַתָּ֤ה יוֹשֵׁב֙ לְ/בַדֶּ֔/ךָ וְ/כָל הָ/עָ֛ם נִצָּ֥ב עָלֶ֖י/ךָ מִן בֹּ֥קֶר עַד עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/014.yaml
  text: When Moses's father-in-law saw all that he was doing for the people[a], he said, “What is this thing that you are doing for the people? Why do you sit alone[b], while all the people stand before you from morning until evening?”
translation:
  language: fr
  text: 'Quand le beau-père de Moïse vit tout ce que celui-ci faisait pour le peuple, il dit : « Qu’est-ce que cela signifie, ce que tu fais pour le peuple[a] ? Pourquoi restes-tu assis seul, tandis que tout le peuple se tient debout devant toi du matin jusqu’au soir ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Qu’est-ce que cette chose que tu fais pour le peuple ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹתֵן מֹשֶׁה
  choice: le beau-père de Moïse
  rationale: חֹתֵן désigne ici le père de l’épouse de Moïse ; cette formulation est naturelle et précise en français.
- source_word: וַיַּרְא
  choice: vit
  rationale: Le verbe ראה garde son sens narratif ordinaire, sans ajout interprétatif.
- source_word: אֵת כָּל אֲשֶׁר הוּא עֹשֶׂה
  choice: tout ce que celui-ci faisait
  rationale: Le participe exprime une activité en cours ; « celui-ci » évite momentanément toute ambiguïté entre Moïse et son beau-père.
- source_word: לָעָם
  choice: pour le peuple / envers le peuple
  rationale: La préposition ל peut présenter l’activité comme accomplie pour le peuple ou dirigée envers lui. La première occurrence emploie « pour » ; la question est formulée naturellement avec « envers » sans imposer une nuance hostile.
- source_word: מָה הַדָּבָר הַזֶּה
  choice: Que signifie cette manière d’agir
  rationale: Littéralement, « Qu’est-ce que cette chose/affaire ? » ; en contexte, Jéthro interroge la pratique observée. La formulation française rend l’interrogation idiomatiquement tout en signalant l’alternative littérale en note.
- source_word: אַתָּה יוֹשֵׁב לְבַדֶּךָ
  choice: sièges-tu seul
  rationale: ישב signifie « être assis » et peut évoquer ici le fait de siéger pour rendre la justice ; « siéger » conserve cette dimension fonctionnelle du contexte.
- source_word: וְכָל הָעָם נִצָּב עָלֶיךָ
  choice: tandis que tout le peuple se tient devant toi
  rationale: נצב signifie « se tenir debout » et עַל décrit ici la présence auprès de Moïse, vraisemblablement dans l’attente d’un jugement. « Devant toi » est naturel sans surinterpréter la scène.
- source_word: מִן בֹּקֶר עַד עָרֶב
  choice: du matin jusqu’au soir
  rationale: Cette expression temporelle indique toute la durée de la journée et se rend naturellement ainsi en français.
