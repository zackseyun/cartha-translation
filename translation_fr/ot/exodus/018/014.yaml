translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct reste vif. « Siéger » suggère le contexte judiciaire établi par les versets voisins, tandis que « se tient devant toi » préserve l’image et évite d’expliciter davantage que le texte.
