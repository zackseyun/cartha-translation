  source_fidelity: 'La structure du verset est bien rendue : Moïse va à la rencontre de son beau-père, accomplit les gestes d’accueil, l’échange est réciproque, puis ils entrent dans la tente. « Se prosterna » peut rendre le verbe hébreu, mais suggère en français plus nettement une prosternation complète et peut paraître cultuel ; « s’inclina profondément » préserve mieux l’ampleur physique du geste sans en fixer la portée.'
