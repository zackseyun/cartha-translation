  text: וַ/יֵּצֵ֨א מֹשֶׁ֜ה לִ/קְרַ֣את חֹֽתְנ֗/וֹ וַ/יִּשְׁתַּ֨חוּ֙ וַ/יִּשַּׁק ל֔/וֹ וַ/יִּשְׁאֲל֥וּ אִישׁ לְ/רֵעֵ֖/הוּ לְ/שָׁל֑וֹם וַ/יָּבֹ֖אוּ הָ/אֹֽהֱלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/007.yaml
  text: Moses went out to meet his father-in-law[a], bowed down, and kissed him. Then each asked the other about his welfare, and they went into the tent.
translation:
  language: fr
  text: Moïse sortit à la rencontre de son beau-père, s’inclina profondément et l’embrassa. Ils s’enquirent chacun de la santé de l’autre[a], puis entrèrent dans la tente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils demandèrent, chacun à son prochain, au sujet de la paix ». Dans cette expression hébraïque, « la paix » désigne le bien-être ou la santé de la personne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרַאת
  choice: à la rencontre de
  rationale: Avec le verbe « sortir », cette expression désigne naturellement le fait d’aller accueillir une personne qui arrive.
- source_word: חֹתְנוֹ
  choice: son beau-père
  rationale: Dans ce contexte, le terme désigne précisément Jéthro, le beau-père de Moïse.
- source_word: וַיִּשְׁתַּחוּ
  choice: se prosterna
  rationale: Le verbe décrit un geste physique d’inclination profonde. « Se prosterna » en conserve la force sans préciser qu’il s’agirait d’un acte d’adoration.
- source_word: וַיִּשַּׁק לוֹ
  choice: l’embrassa
  rationale: Cette formulation française naturelle rend le baiser donné en guise de salutation.
- source_word: וַיִּשְׁאֲלוּ אִישׁ לְרֵעֵהוּ לְשָׁלוֹם
  choice: Ils se demandèrent mutuellement comment ils allaient
  rationale: L’expression hébraïque signifie littéralement demander à l’autre au sujet de la paix et, idiomatiquement, prendre des nouvelles de son bien-être. La réciprocité de אִישׁ לְרֵעֵהוּ est explicitement conservée.
- source_word: הָאֹהֱלָה
  choice: dans la tente
  rationale: Le suffixe directionnel indique un mouvement vers l’intérieur. L’hébreu dit « la tente » sans préciser à qui elle appartient.
theological_decisions:
- issue: Sens de la prosternation de Moïse devant Jéthro
  choice: Geste d’inclination profonde, laissé sans qualification cultuelle
  alternative: « s’inclina » comme geste explicite de respect, ou lecture comme acte d’adoration
  rationale: Le verbe peut ailleurs évoquer l’adoration, mais la séquence d’accueil entre personnes favorise ici un geste social d’honneur. La traduction décrit donc le geste sans lui imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au récit écrit. La formulation conserve la réciprocité de l’échange et n’ajoute pas que la tente appartenait à Moïse.
