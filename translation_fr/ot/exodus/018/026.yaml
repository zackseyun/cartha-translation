base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/026.yaml
  text: And they judged the people at all times. Every difficult matter they would bring to Moses[a], but every small matter they themselves would judge.
translation:
  language: fr
  text: Ils jugeaient le peuple en tout temps. Toute affaire difficile, ils la soumettaient à Moïse[a], mais toute affaire de moindre importance, ils la jugeaient eux-mêmes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tout cas difficile […] toute affaire mineure ». Dans ce contexte judiciaire, l’hébreu oppose l’affaire difficile à l’affaire de moindre importance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: Ils jugeaient
  rationale: L’imparfait rend naturellement la fonction habituelle et continue des juges dans ce résumé narratif.
- source_word: הָעָם
  choice: le peuple
  rationale: « Le peuple » est le terme courant et cohérent pour désigner ici la communauté d’Israël.
- source_word: בְּכָל עֵת
  choice: en tout temps
  rationale: Cette expression conserve l’idée d’une disponibilité régulière et constante sans suggérer qu’ils siégeaient littéralement à chaque instant.
- source_word: הַדָּבָר הַקָּשֶׁה
  choice: toute affaire difficile
  rationale: Dans ce contexte judiciaire, דָּבָר désigne une affaire ou un cas; « affaire difficile » reste proche de l’hébreu et naturel en français.
- source_word: יְבִיאוּן אֶל מֹשֶׁה
  choice: ils l’apportaient à Moïse
  rationale: L’imparfait exprime l’action répétée; « apporter une affaire à quelqu’un » est intelligible et préserve l’image du texte source.
- source_word: כָל הַדָּבָר הַקָּטֹן
  choice: toute affaire de moindre importance
  rationale: Cette formulation exprime le contraste avec les affaires difficiles sans laisser entendre que les affaires étaient insignifiantes; « petite affaire » demeure possible plus littéralement.
- source_word: יִשְׁפּוּטוּ הֵם
  choice: ils la jugeaient eux-mêmes
  rationale: « Eux-mêmes » rend l’accent porté par le pronom indépendant הֵם et souligne que ces juges traitaient personnellement les affaires moins importantes.
