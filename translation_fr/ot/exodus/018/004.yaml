source:
  edition: WLC
  text: וְ/שֵׁ֥ם הָ/אֶחָ֖ד אֱלִיעֶ֑זֶר כִּֽי אֱלֹהֵ֤י אָבִ/י֙ בְּ/עֶזְרִ֔/י וַ/יַּצִּלֵ֖/נִי מֵ/חֶ֥רֶב פַּרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/004.yaml
  text: And the name of the other was Eliezer[a], for the God of my father was my help, and he delivered me from Pharaoh’s sword.
translation:
  language: fr
  text: L’autre s’appelait Éliézer[a], car le Dieu de mon père a été mon secours et m’a délivré de l’épée de Pharaon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Éliézer signifie « Mon Dieu est secours » ou « Mon Dieu est mon secours ».
    reason: Explique le jeu de sens entre le nom hébreu et les mots « le Dieu de mon père a été mon secours ».
lexical_decisions:
- source_word: וְשֵׁם הָאֶחָד
  choice: L’autre s’appelait
  rationale: Après la mention du premier fils au verset précédent, הָאֶחָד désigne ici l’autre. Cette formulation française naturelle conserve la continuité narrative exprimée par וְ sans calquer lourdement « et le nom de l’autre était ».
- source_word: אֱלִיעֶזֶר
  choice: Éliézer
  rationale: Translittération française usuelle du nom propre, dont la forme évoque l’idée que Dieu est secours, reprise dans l’explication qui suit.
- source_word: כִּי
  choice: car
  rationale: Introduit l’explication du nom et conserve clairement le lien causal du texte hébreu.
- source_word: אֱלֹהֵי אָבִי
  choice: le Dieu de mon père
  rationale: Rend directement la construction hébraïque et maintient la référence personnelle au Dieu du père de Moïse.
- source_word: בְּעֶזְרִי
  choice: a été mon secours
  rationale: Conserve le substantif « secours », qui fait écho au nom Éliézer, tout en exprimant naturellement en français la perspective rétrospective du récit.
- source_word: וַיַּצִּלֵנִי
  choice: et m’a délivré
  rationale: Le verbe נצל exprime ici l’action de soustraire quelqu’un à un danger mortel. « Délivré » est précis, digne et courant dans le registre biblique moderne.
- source_word: מֵחֶרֶב פַּרְעֹה
  choice: de l’épée de Pharaon
  rationale: Traduction directe de l’image hébraïque, qui peut désigner aussi bien la menace de mort que le pouvoir meurtrier de Pharaon, sans réduire cette portée figurée.
theological_decisions:
- issue: Locuteur implicite de l’explication du nom
  choice: Ne pas ajouter de formule comme « car il disait » ou « car il avait dit »
  alternative: Ajouter une formule de parole pour attribuer explicitement l’explication à Moïse
  rationale: L’hébreu enchaîne directement le nom et son explication sans verbe de parole. La traduction préserve cette syntaxe et laisse ouverte la distinction entre explication rapportée par le narrateur et parole implicite de Moïse.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation évite un calque syntaxique pesant tout en préservant le lien explicatif, l’écho lexical autour du secours et l’image de l’épée de Pharaon.
