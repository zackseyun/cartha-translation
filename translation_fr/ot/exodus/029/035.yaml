  text: וְ/עָשִׂ֜יתָ לְ/אַהֲרֹ֤ן וּ/לְ/בָנָי/ו֙ כָּ֔כָה כְּ/כֹ֥ל אֲשֶׁר צִוִּ֖יתִי אֹתָ֑/כָה שִׁבְעַ֥ת יָמִ֖ים תְּמַלֵּ֥א יָדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/035.yaml
  text: And you shall do thus for Aaron and for his sons[a], according to all that I have commanded you. Seven days you shall ordain them.
translation:
  language: fr
  text: Tu feras ainsi pour Aaron et pour ses fils, conformément à tout ce que je t’ai ordonné. Pendant sept jours, tu les consacreras[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu rempliras leur main », expression hébraïque désignant l’investiture dans le service sacerdotal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Dans cette suite d’instructions rituelles, le parfait avec waw a une valeur directive tournée vers l’avenir. Le futur français exprime naturellement cette prescription.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: pour Aaron et pour ses fils
  rationale: La répétition de לְ présente Aaron et ses fils comme les bénéficiaires ou destinataires de l’action rituelle; « pour » convient au contexte.
- source_word: כָּכָה
  choice: ainsi
  rationale: L’adverbe renvoie à la procédure détaillée auparavant. « Ainsi » est concis, naturel et digne.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִי אֹתָכָה
  choice: conformément à tout ce que je t’ai ordonné
  rationale: Cette formulation conserve l’idée de conformité à l’ensemble des prescriptions antérieures.
- source_word: שִׁבְעַת יָמִים
  choice: Pendant sept jours
  rationale: L’expression fonctionne comme un accusatif de durée. « Pendant sept jours » indique clairement que le rite d’installation s’étend sur cette période.
- source_word: תְּמַלֵּא יָדָם
  choice: tu les établiras dans leur fonction
  rationale: Littéralement « tu rempliras leur main », cet idiome sacerdotal désigne l’investiture dans une charge. La traduction retenue communique l’installation officielle sans imposer une terminologie confessionnelle ultérieure.
theological_decisions:
- issue: Rendu de l’idiome sacerdotal מִלֵּא יָד
  choice: tu les établiras dans leur fonction
  alternative: tu les consacreras / tu les investiras / tu rempliras leur main
  rationale: Dans ce contexte cultuel, l’expression désigne l’établissement d’Aaron et de ses fils dans le service sacerdotal. « Établir dans leur fonction » préserve le sens institutionnel tout en évitant que « ordonner » soit compris selon une pratique confessionnelle particulière. Le sens littéral est signalé en note.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse singulière à Moïse. La formulation garde le caractère prescriptif du passage et explicite avec mesure l’idiome sacerdotal.
