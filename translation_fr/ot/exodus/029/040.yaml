  text: and a tenth of fine flour mixed with a quarter of a hin of beaten oil[a], and a drink offering of a quarter of a hin of wine[c][b], for the one lamb.
translation:
  language: fr
  text: avec un dixième d’épha de fleur de farine[a] mêlée à un quart de hin d’huile d’olives broyées[b], et une libation d’un quart de hin de vin, pour le premier agneau[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « un dixième », mesure sacrificielle correspondant à un dixième d’épha.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit d’huile obtenue à partir d’olives battues ou broyées ; on peut aussi traduire « huile d’olives pressées ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « pour l’agneau, l’un ». Dans le contexte, cette expression désigne vraisemblablement le premier des deux agneaux offerts chaque jour ; on pourrait aussi comprendre « pour un agneau ».
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/עִשָּׂרֹן
  choice: avec un dixième d’épha
  rationale: עִשָּׂרוֹן désigne, dans les prescriptions sacrificielles, une mesure correspondant à un dixième d’épha. L’ajout explicite de « d’épha » rend la mesure compréhensible en français; la formulation elliptique de l’hébreu est signalée en note.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: סֹלֶת désigne une farine finement moulue destinée notamment aux offrandes. « Fleur de farine » est l’équivalent français courant, précis et naturel.
- source_word: בָּלוּל בְּ/שֶׁמֶן
  choice: pétrie avec ... d’huile
  rationale: Le participe passif בָּלוּל indique que la farine est mêlée à l’huile. Dans ce contexte de préparation d’une pâte sacrificielle, « pétrie avec » est naturel en français tout en conservant l’idée de mélange.
- source_word: כָּתִית
  choice: huile d’olives pilées
  rationale: כָּתִית qualifie l’huile obtenue à partir d’olives battues ou pilées. Cette formulation évite l’expression peu naturelle « huile pilée », puisque ce sont les olives, et non l’huile, qui sont pilées.
- source_word: רֶבַע הַ/הִין; רְבִעִית הַ/הִין
  choice: un quart de hin
  rationale: Les deux expressions indiquent le quart de l’ancienne mesure liquide appelée hin. La conservation de l’unité ancienne évite une conversion moderne incertaine.
- source_word: וְ/נֵסֶךְ
  choice: et une libation
  rationale: נֶסֶךְ est le terme technique désignant une offrande liquide versée. « Libation » est concis, exact et bien établi en français biblique.
- source_word: יָיִן
  choice: vin
  rationale: Il s’agit du terme hébreu ordinaire pour le vin, sans indice contextuel appelant un autre sens.
- source_word: לַ/כֶּבֶשׂ הָ/אֶחָד
  choice: pour le premier agneau
  rationale: Dans le contexte immédiat des deux agneaux quotidiens, l’article avec le numéral renvoie naturellement au premier agneau. La traduction contextuelle est plus idiomatique que le calque « pour l’agneau, l’un », tandis que l’ambiguïté formelle est conservée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Les termes cultuels « fleur de farine » et « libation » sont conservés parce qu’ils sont précis et établis; les anciennes unités « épha » et « hin » ne sont pas converties. La syntaxe française explicite l’unité sous-entendue par l’hébreu et rend naturellement la préparation de la farine avec l’huile.
