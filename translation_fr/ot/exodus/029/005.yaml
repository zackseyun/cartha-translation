    rationale: Après « l’éphod et du pectoral », le démonstratif masculin « celui-ci » peut naturellement être compris comme renvoyant au pectoral. Or la traduction et la note visent l’éphod comme objet implicite.
  - severity: low
    issue: Note a trop contextualisante
    rationale: « Pectoral du jugement » appartient à une désignation développée dans d’autres contextes et ne correspond pas à la seule forme חֹשֶׁן employée ici. Une note lexicale plus limitée est préférable.
