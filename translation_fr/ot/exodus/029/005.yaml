review_pass:
  verdict: revise
  source_fidelity: La séquence des vêtements et les termes techniques sont fidèlement rendus. Toutefois, « celui-ci » est syntaxiquement susceptible de renvoyer au pectoral, dernier nom masculin mentionné, alors que l’objet implicite compris dans la traduction est l’éphod. L’explicitation de cet objet améliore la fidélité fonctionnelle sans trancher indûment la nuance du rare verbe אפד.
  naturalness: « Ajusteras celui-ci sur lui » est peu naturel et ambigu en français moderne. « Fixeras l’éphod sur lui » est clair, idiomatique et conserve le caractère instrumental de la bande.
  terminology: « Tunique », « robe de l’éphod », « éphod » et « pectoral » conviennent au registre et aux réalités cultuelles. La note sur le pectoral devrait éviter d’introduire « pectoral du jugement », expression absente du verset, tout en signalant sobrement l’alternative traditionnelle « cuirasse ».
