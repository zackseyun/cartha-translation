base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/005.yaml
  text: Then you shall take the garments and clothe Aaron with the tunic[a], the robe of the ephod, the ephod, and the breastpiece[b], and you shall skillfully fasten it on him with the woven band of the ephod.
translation:
  language: fr
  text: Tu prendras ensuite les vêtements et tu revêtiras Aaron de la tunique, de la robe de l’éphod, de l’éphod et du pectoral[a] ; puis tu fixeras l’éphod sur lui[b] à l’aide de la bande tissée de l’éphod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu désigne une pièce portée sur la poitrine et attachée à l’éphod. On le traduit aussi traditionnellement par « cuirasse ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu est rare et peut aussi évoquer l’action de ceindre Aaron avec la bande de l’éphod. Il décrit la mise en place de l’éphod sur Aaron.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ אֶת־הַבְּגָדִים
  choice: Tu prendras ensuite les vêtements
  rationale: Le parfait avec waw poursuit la série d’instructions. « Ensuite » rend naturellement cette progression en français, tandis que « vêtements » demeure général et n’importe pas le vocabulaire ecclésiastique plus tardif de « vêtements liturgiques ».
- source_word: וְהִלְבַּשְׁתָּ אֶת־אַהֲרֹן
  choice: tu revêtiras Aaron de
  rationale: Le hiphil de לבש exprime l’action de faire porter les vêtements à Aaron. La construction française « revêtir quelqu’un de » restitue clairement ce sens causatif dans un registre digne et naturel.
- source_word: הַכֻּתֹּנֶת
  choice: la tunique
  rationale: כֻּתֹּנֶת désigne le vêtement de base porté près du corps ; « tunique » est précis, courant dans ce contexte et immédiatement compréhensible.
- source_word: מְעִיל הָאֵפֹד
  choice: la robe de l’éphod
  rationale: La construction hébraïque désigne la robe associée à l’éphod. Cette formulation reste proche du texte sans expliciter au-delà de ce qu’il dit.
- source_word: הָאֵפֹד
  choice: l’éphod
  rationale: אֵפֹד est un terme technique sans équivalent français exact ; sa translittération évite une paraphrase trompeuse.
- source_word: הַחֹשֶׁן
  choice: le pectoral
  rationale: חֹשֶׁן désigne la pièce portée sur la poitrine et attachée à l’éphod. « Pectoral » est concis, établi en français biblique et n’évoque pas nécessairement une pièce d’armure comme « cuirasse ».
- source_word: וְאָפַדְתָּ לוֹ
  choice: puis tu ajusteras celui-ci sur lui
  rationale: Le verbe rare אפד évoque l’action d’équiper, de ceindre ou de fixer avec l’éphod. « Ajusteras » communique la mise en place du vêtement sans prétendre trancher entièrement sa nuance ; « celui-ci » rend explicite l’objet sous-entendu, l’éphod.
- source_word: בְּחֵשֶׁב הָאֵפֹד
  choice: à l’aide de la bande tissée de l’éphod
  rationale: חֵשֶׁב désigne ici l’élément textile servant à maintenir l’éphod. « Bande tissée » est concret et prudent ; « à l’aide de » exprime la fonction instrumentale de בְּ.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement conserve l’adresse divine directe à Moïse. Les termes cultuels nécessaires (« tunique », « robe », « éphod », « pectoral ») sont maintenus sans recourir à un vocabulaire ecclésiastique ultérieur. La ponctuation en deux propositions allège la longue coordination hébraïque sans modifier l’ordre des gestes.
