source:
  edition: WLC
  text: וְ/זֶ֕ה אֲשֶׁ֥ר תַּעֲשֶׂ֖ה עַל הַ/מִּזְבֵּ֑חַ כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה שְׁנַ֥יִם לַ/יּ֖וֹם תָּמִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/038.yaml
  text: 'This is what you shall offer on the altar: two one-year-old lambs each day continually[a][b][c].'
translation:
  language: fr
  text: 'Voici ce que tu offriras sur l’autel[a] : deux agneaux âgés d’un an[b], chaque jour, continuellement[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce que tu feras sur l’autel ». Le verbe hébreu signifie généralement « faire », mais il désigne ici l’accomplissement de l’offrande sacrificielle.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « fils d’une année », c’est-à-dire des agneaux âgés d’un an.
    reason: lexical_alternative
  - marker: c
    text: Ou « chaque jour, régulièrement ». L’expression désigne une offrande quotidienne accomplie de façon constante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֶה אֲשֶׁר
  choice: Voici ce que
  rationale: Cette formulation française introduit naturellement l’instruction qui suit. « Voici » rend la valeur présentative de זֶה sans ajouter un adverbe temporel absent de l’hébreu.
- source_word: תַּעֲשֶׂה
  choice: tu offriras
  rationale: Le verbe עשה signifie largement « faire », mais, dans ce contexte sacrificiel et avec « sur l’autel », « offrir » exprime naturellement l’action visée tout en signalant l’alternative littérale en note.
- source_word: עַל הַמִּזְבֵּחַ
  choice: sur l’autel
  rationale: Équivalent français courant et précis de la préposition et du nom dans un contexte sacrificiel.
- source_word: כְּבָשִׂים
  choice: agneaux
  rationale: Le terme désigne ici de jeunes ovins; « agneaux » est le terme français usuel, l’âge étant précisé immédiatement après.
- source_word: בְּנֵי שָׁנָה
  choice: âgés d’un an
  rationale: Rend idiomatiquement l’expression hébraïque littérale « fils d’une année » et conserve la précision d’âge.
- source_word: שְׁנַיִם
  choice: deux
  rationale: Rendu direct du nombre hébreu.
- source_word: לַיּוֹם
  choice: chaque jour
  rationale: Exprime naturellement en français la valeur distributive quotidienne.
- source_word: תָּמִיד
  choice: continuellement
  rationale: Conserve l’idée d’une observance constante et régulière, sans réduire le terme à une simple fréquence quotidienne déjà exprimée par לַיּוֹם.
