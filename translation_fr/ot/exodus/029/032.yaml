source:
  edition: WLC
  text: וְ/אָכַ֨ל אַהֲרֹ֤ן וּ/בָנָי/ו֙ אֶת בְּשַׂ֣ר הָ/אַ֔יִל וְ/אֶת הַ/לֶּ֖חֶם אֲשֶׁ֣ר בַּ/סָּ֑ל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/032.yaml
  text: Aaron and his sons shall eat the flesh of the ram and the bread that is in the basket at the entrance of the tent of meeting[a].
translation:
  language: fr
  text: Aaron et ses fils mangeront la chair du bélier[a] et le pain qui est dans la corbeille, à l’entrée de la tente de la rencontre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la viande du bélier ». Le mot hébreu signifie littéralement « chair », mais il peut désigner la viande comestible dans un contexte sacrificiel.
    reason: Variante lexicale entre le sens littéral et l’expression française plus idiomatique.
lexical_decisions:
- source_word: וְאָכַל
  choice: mangeront
  rationale: Dans cette instruction rituelle, le parfait précédé de la conjonction a une valeur prescriptive et prospective. Le futur français exprime naturellement cette obligation réglée sans la transformer en impératif explicite.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Aaron et ses fils
  rationale: « Aaron » est la forme française traditionnelle du nom. בָּנָיו désigne ici ses fils engagés avec lui dans le rite d’investiture sacerdotale, et non ses enfants au sens large.
- source_word: בְּשַׂר הָאַיִל
  choice: la chair du bélier
  rationale: בָּשָׂר signifie littéralement « chair » et peut désigner la viande comestible dans un contexte sacrificiel. « Chair » conserve la formulation concrète et rituelle de l’hébreu; une note indique l’équivalent idiomatique possible.
- source_word: הַלֶּחֶם אֲשֶׁר בַּסָּל
  choice: le pain qui est dans la corbeille
  rationale: לֶחֶם désigne ici collectivement le pain mentionné dans le contexte précédent. La relative rend directement la localisation exprimée par בַּסָּל.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à l’entrée de la tente de la rencontre
  rationale: פֶּתַח désigne l’entrée ou l’ouverture. « Tente de la rencontre » rend le syntagme cultuel אֹהֶל מוֹעֵד de façon transparente et traditionnelle en français.
theological_decisions:
- issue: Langage masculin dans le contexte sacerdotal
  choice: ses fils
  alternative: ses enfants
  rationale: Le contexte vise précisément les fils d’Aaron qui participent à l’investiture sacerdotale. La traduction conserve donc le référent masculin du texte source sans le généraliser.
- issue: Valeur prescriptive de la forme verbale
  choice: mangeront
  alternative: doivent manger
  rationale: Le futur français convient au style des prescriptions rituelles et conserve la forme d’une disposition normative, sans introduire un verbe modal absent de l’hébreu.
- issue: Portée du complément de lieu final
  choice: la virgule rattache « à l’entrée » à l’action de manger
  alternative: sans virgule, le complément pourrait sembler qualifier la corbeille
  rationale: Dans la syntaxe hébraïque et le contexte rituel, le complément final indique le lieu où Aaron et ses fils mangent. La ponctuation française clarifie ce rattachement sans ajouter de contenu.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur simple porte la valeur normative propre aux instructions rituelles. La formulation reste proche de l’ordre hébreu tout en évitant une ambiguïté syntaxique en français grâce à la virgule avant le complément de lieu.
