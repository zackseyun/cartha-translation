  text: שִׁבְעַ֣ת יָמִ֗ים תְּכַפֵּר֙ עַל הַ/מִּזְבֵּ֔חַ וְ/קִדַּשְׁתָּ֖ אֹת֑/וֹ וְ/הָיָ֤ה הַ/מִּזְבֵּ֨חַ֙ קֹ֣דֶשׁ קָֽדָשִׁ֔ים כָּל הַ/נֹּגֵ֥עַ בַּ/מִּזְבֵּ֖חַ יִקְדָּֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/037.yaml
  text: For seven days you shall make atonement for the altar and consecrate it[a], and the altar shall be most holy. Whatever touches the altar shall become holy.
translation:
  language: fr
  text: Pendant sept jours, tu accompliras le rite d’expiation pour l’autel et tu le consacreras. L’autel sera très saint. Tout ce qui touchera l’autel deviendra saint.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quiconque touchera l’autel sera saint. » L’hébreu peut indiquer soit que le contact communique la sainteté, soit que seuls des personnes ou des objets déjà saints peuvent toucher l’autel.'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּכַפֵּר
  choice: tu accompliras le rite d’expiation
  rationale: Dans ce contexte rituel sacerdotal, כפר désigne l’accomplissement d’un rite d’expiation ou de purification. Cette formulation française conserve le terme théologique établi tout en indiquant qu’il s’agit d’un acte rituel.
- source_word: עַל הַמִּזְבֵּחַ
  choice: pour l’autel
  rationale: Avec כפר, la préposition עַל introduit ici l’objet en faveur duquel le rite est accompli, plutôt que le lieu matériel où il se déroule.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: et tu le consacreras
  rationale: « Consacrer » exprime naturellement en français cultuel le fait de mettre à part comme saint, sans la coloration plus ecclésiastique de « sanctifier ».
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: très saint
  rationale: La construction hébraïque exprime le degré suprême de sainteté. « Très saint » est idiomatique, digne et convient à un objet cultuel.
- source_word: כָּל הַנֹּגֵעַ
  choice: Tout ce qui touchera
  rationale: Le participe précédé de כָּל peut viser aussi bien des personnes que des choses. Le neutre « tout ce qui » préserve cette portée générale.
- source_word: יִקְדָּשׁ
  choice: deviendra saint
  rationale: La forme verbale peut exprimer l’entrée dans un état de sainteté résultant du contact. « Deviendra saint » rend clairement ce sens inchoatif sans effacer l’autre compréhension possible.
theological_decisions:
- issue: La sainteté communiquée par le contact avec l’autel
  choice: Le contact avec l’autel consacré rend saint ce qui le touche.
  alternative: Seul ce qui est déjà saint, ou est tenu de l’être, peut toucher l’autel.
  rationale: La lecture la plus directe de יִקְדָּשׁ est celle d’un changement d’état produit par le contact. La note conserve toutefois l’ambiguïté réelle de la formulation hébraïque et la tension propre à la sainteté sacerdotale.
translation_notes:
  register: Français international moderne, clair et digne. Le futur rend les yiqtol prescriptifs dans cette instruction rituelle. « Rite d’expiation » explicite sobrement la valeur cultuelle de כפר, tandis que la note préserve l’ambiguïté de la dernière proposition.
