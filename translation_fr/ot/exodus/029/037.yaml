  source_fidelity: 'Le sens principal est fidèlement rendu : l’expiation est effectuée pour l’autel, celui-ci est consacré et devient « très saint », et ce qui le touche devient saint. Toutefois, « Alors » ajoute une relation consécutive absente de l’hébreu. La note doit formuler l’alternative sans transformer trop directement l’indicatif hébreu en obligation (« devra être »).'
  naturalness: Le français est moderne, clair et d’un registre approprié aux instructions rituelles. « Pendant sept jours » et « tu accompliras le rite d’expiation » sont naturels. La suppression de « Alors » rend la succession des actions plus sobre et plus proche du texte source.
  terminology: « Expiation », « consacreras », « très saint » et « deviendra saint » sont des choix cohérents et précis dans ce contexte sacerdotal. « Tout ce qui » préserve utilement l’extension possible aux personnes comme aux objets.
