  yaml_path: translation/ot/exodus/029/031.yaml
  text: And you shall take the ram of ordination and boil its flesh in a holy place[a][b].
translation:
  language: fr
  text: Tu prendras le bélier d’ordination et tu feras bouillir sa viande dans un lieu saint[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le bélier de consécration ». Le terme hébreu désigne le rite d’installation des prêtres.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans le Lieu saint » ; toutefois, l’hébreu dit plus littéralement « dans un lieu saint ».
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיל
  choice: bélier
  rationale: « Bélier » est le terme français précis et naturel pour l’animal mâle offert en sacrifice.
- source_word: הַמִּלֻּאִים
  choice: d’ordination
  rationale: Dans ce contexte sacerdotal, מִלֻּאִים désigne le rite d’installation des prêtres. « Ordination » en exprime clairement la fonction, tandis que « consécration » reste possible.
- source_word: תִּקָּח
  choice: tu prendras
  rationale: Le futur français rend naturellement la valeur directive de l’imparfait hébreu à la deuxième personne du singulier et maintient la succession des prescriptions.
- source_word: וּבִשַּׁלְתָּ
  choice: et tu feras cuire
  rationale: Le verbe בשׁל désigne ici une cuisson, vraisemblablement dans l’eau. « Faire cuire » est idiomatique en français et évite la suggestion moderne que « faire bouillir la viande » ferait porter l’ébullition directement sur la viande plutôt que sur le liquide.
- source_word: בְּשָׂרוֹ
  choice: sa viande
  rationale: Dans une instruction portant sur la préparation alimentaire d’un animal sacrifié, « sa viande » est plus naturel en français moderne que « sa chair », tout en conservant le sens concret de בשר.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: dans un lieu saint
  rationale: L’expression hébraïque est sans article et ne désigne pas nécessairement la pièce particulière appelée le Lieu saint. La traduction indéfinie préserve cette absence de précision.
theological_decisions:
- issue: Sens du terme cultuel הַמִּלֻּאִים dans le rite d’installation sacerdotale
  choice: le bélier d’ordination
  alternative: le bélier de consécration
  rationale: « Ordination » met en avant l’installation des prêtres dans leur fonction; « consécration » souligne leur mise à part. Les deux dimensions sont présentes dans le contexte, sans qu’il faille imposer une doctrine confessionnelle particulière.
- issue: Portée de בְּמָקוֹם קָדֹשׁ
  choice: dans un lieu saint
  alternative: dans le Lieu saint
  rationale: L’hébreu ne requiert pas l’identification avec la salle du sanctuaire appelée « le Lieu saint ». La formulation générique évite d’ajouter une localisation technique que le verset ne précise pas.
translation_notes:
  register: Français international moderne, digne et direct. Le futur à valeur prescriptive convient au discours légal. « Viande » est préféré à « chair » dans cette instruction de cuisson, tandis que les notes conservent les ambiguïtés cultuelles réelles.
