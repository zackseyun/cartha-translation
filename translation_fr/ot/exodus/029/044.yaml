base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/044.yaml
  text: And I will consecrate the tent of meeting and the altar[b][a]; and I will consecrate Aaron and his sons to serve me as priests.
translation:
  language: fr
  text: Je consacrerai la tente de la rencontre et l’autel ; je consacrerai Aaron et ses fils afin qu’ils me servent comme prêtres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « afin d’exercer pour moi la fonction de prêtre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי / אֲקַדֵּשׁ
  choice: Je consacrerai / je consacrerai aussi
  rationale: Au piel, קדשׁ signifie ici mettre à part comme saint pour le service cultuel. « Consacrer » est naturel en français moderne et convient aussi bien aux objets sacrés qu’aux prêtres. « Aussi » explicite la progression portée par la coordination sans modifier le sens.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Rendu transparent de l’expression désignant le lieu où Dieu rencontre son peuple ou ses représentants, conforme à l’usage biblique français courant.
- source_word: הַמִּזְבֵּחַ
  choice: l’autel
  rationale: Équivalent cultuel direct et usuel.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Forme française traditionnelle et reconnue du nom propre.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le terme hébreu désigne explicitement les fils d’Aaron dans le contexte de leur fonction sacerdotale.
- source_word: לְכַהֵן לִי
  choice: afin qu’ils exercent pour moi le ministère de prêtres
  rationale: Le verbe כהן exprime l’exercice de la fonction sacerdotale et לִי indique que ce ministère est rendu à Dieu. Cette formulation reste naturelle tout en conservant les deux éléments.
theological_decisions:
- issue: Vocabulaire de la sainteté cultuelle
  choice: consacrer
  alternative: sanctifier / rendre saint
  rationale: Le contexte porte sur la mise à part rituelle du sanctuaire, de l’autel et des prêtres. « Consacrer » communique cette fonction sans ajouter de nuance doctrinale étrangère au texte.
- issue: Référence masculine à la lignée sacerdotale
  choice: ses fils
  alternative: ses enfants
  rationale: L’hébreu est explicitement masculin et le contexte vise les fils d’Aaron appelés au sacerdoce.
- issue: Nature du service d’Aaron et de ses fils
  choice: exercer pour moi le ministère de prêtres
  alternative: me servir comme prêtres / être prêtres pour moi
  rationale: La traduction exprime sans les dissocier la fonction sacerdotale indiquée par כהן et son orientation vers Dieu indiquée par לִי.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « consacrer » reflète celle du verbe hébreu ; le point-virgule marque les deux groupes consacrés sans rompre leur parallèle.
