revisions:
- from: Je consacrerai la tente de la rencontre et l’autel ; je consacrerai aussi Aaron et ses fils afin qu’ils exercent pour moi le ministère de prêtres.[a]
  to: Je consacrerai la tente de la rencontre et l’autel ; je consacrerai Aaron et ses fils afin qu’ils me servent comme prêtres.[a]
  rationale: La révision supprime l’adverbe non exprimé dans le texte source et remplace une formulation française pesante par « afin qu’ils me servent comme prêtres », qui rend naturellement l’infinitif sacerdotal לְכַהֵן et le datif לִי. La note conserve l’information sur la formulation littérale sans imposer une tournure artificielle au texte courant.
  reviewer_model: gpt-5.6-terra
