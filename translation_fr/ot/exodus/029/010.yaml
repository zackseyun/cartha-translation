base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/010.yaml
  text: You shall bring the bull before the tent of meeting[a], and Aaron and his sons shall lay their hands on the head of the bull.
translation:
  language: fr
  text: Tu amèneras le taureau devant la tente de la rencontre[a], puis Aaron et ses fils poseront leurs mains sur la tête du taureau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « tu présenteras le taureau devant la tente de la rencontre » ou « tu feras approcher le taureau devant la tente de la rencontre ».

      '
    reason: Alternative lexicale pour le hifil de קרב, qui peut exprimer le fait d’amener, de faire approcher ou de présenter, notamment dans un cadre sacrificiel.
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: Tu amèneras
  rationale: Le hifil de קרב signifie ici faire approcher ou présenter dans un contexte sacrificiel. « Amener » est naturel en français et conserve le mouvement vers le sanctuaire; la nuance « présenter » est signalée en note.
- source_word: הַפָּר
  choice: le taureau
  rationale: פַּר désigne un taureau, souvent jeune dans les textes sacrificiels. « Taureau » est précis et idiomatique.
- source_word: לִפְנֵי
  choice: devant
  rationale: La préposition indique ici une position devant le sanctuaire, avec une possible nuance de présence. « Devant » convient naturellement au contexte spatial et rituel.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette expression désigne le sanctuaire où a lieu la rencontre assignée avec Dieu. « Tente de la rencontre » conserve les deux éléments du syntagme hébreu sans paraphrase.
- source_word: וְסָמַךְ
  choice: poseront
  rationale: סמך, avec les mains et la tête d’un animal sacrificiel, décrit le geste rituel consistant à poser ou appuyer les mains. « Poseront » exprime clairement l’action sans en imposer une interprétation théologique.
- source_word: יְדֵיהֶם
  choice: leurs mains
  rationale: Le pluriel hébreu est conservé et correspond au geste collectif d’Aaron et de ses fils.
- source_word: עַל רֹאשׁ הַפָּר
  choice: sur la tête du taureau
  rationale: Cette formulation rend directement et naturellement l’action physique décrite par l’hébreu.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Aaron et ses fils
  rationale: Dans ce contexte de consécration sacerdotale, בנים désigne les fils d’Aaron appelés à la prêtrise.
theological_decisions:
- issue: Imposition des mains sur l’animal sacrificiel
  choice: poseront leurs mains sur la tête du taureau
  alternative: appuieront leurs mains sur la tête du taureau
  rationale: Le texte décrit le geste rituel sans en expliciter la portée théologique. La traduction préserve cette retenue et n’ajoute aucune idée de transfert de culpabilité ou d’identification que le verset lui-même ne formule pas.
translation_notes:
  register: Français international moderne, clair et digne. Le futur simple rend l’instruction hébraïque adressée à Moïse. « Puis » marque la succession des gestes sans alourdir la phrase. Le vocabulaire rituel reste concret et n’explicite pas une symbolique absente du verset.
