  text: וְ/אֶת בָּנָ֖י/ו תַּקְרִ֑יב וְ/הִלְבַּשְׁתָּ֖/ם כֻּתֳּנֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/008.yaml
  text: And you shall bring near his sons and clothe them with tunics[a].
translation:
  language: fr
  text: Tu feras approcher ses fils et tu les revêtiras de tuniques[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu présenteras ses fils ». Le verbe hébreu peut désigner le fait de faire avancer quelqu’un pour une présentation rituelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Tu
  rationale: La conjonction coordonne cette instruction à la précédente, tandis que la marque de l’objet direct n’a pas d’équivalent autonome en français. L’enchaînement français reste naturel sans « et » initial.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le nom désigne ici précisément les fils d’Aaron, et non ses enfants en général.
- source_word: תַּקְרִיב
  choice: feras approcher
  rationale: Le hiphil de קרב exprime le fait de faire venir près ou de présenter dans un cadre rituel. « Faire approcher » conserve cette nuance cultuelle et l’ambiguïté entre mouvement et présentation.
- source_word: וְהִלְבַּשְׁתָּם
  choice: et tu les revêtiras
  rationale: « Revêtir » rend le geste d’habiller tout en gardant le registre digne et rituel de l’investiture sacerdotale.
- source_word: כֻּתֳּנֹת
  choice: de tuniques
  rationale: Le terme désigne des vêtements portés près du corps; « tuniques » est précis et usuel dans le contexte des vêtements sacerdotaux.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le futur à valeur injonctive convient aux instructions rituelles. « Faire approcher » préserve la formulation cultuelle sans la réduire au simple fait d’amener.
