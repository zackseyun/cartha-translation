  text: Then you shall take the one ram[a], and Aaron and his sons shall lay their hands on the head of the ram.
translation:
  language: fr
  text: Tu prendras ensuite l’un des béliers[a], et Aaron et ses fils poseront leurs mains sur la tête du bélier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit : « le bélier, l’un » ; cette expression distingue ce bélier de l’autre bélier du rite. Certaines traductions rendent : « le premier bélier ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: ensuite
  rationale: La conjonction introduit l’étape suivante de la procédure; « ensuite » rend naturellement cette progression en français.
- source_word: הָ/אַיִל הָ/אֶחָד
  choice: l’un des béliers
  rationale: La formulation hébraïque désigne l’un des deux béliers du rite. Cette tournure française conserve la distinction sans imposer la valeur ordinale « le premier ».
- source_word: תִּקָּח
  choice: tu prendras
  rationale: L’imparfait hébreu à la deuxième personne du masculin singulier a ici une valeur prescriptive et s’adresse à Moïse.
- source_word: וְ/סָמְכוּ
  choice: poseront
  rationale: Dans ce contexte sacrificiel, סמך désigne le geste rituel consistant à poser ou appuyer les mains sur l’animal; « poseront » est clair et naturel sans préciser une pression que le contexte n’explicite pas.
- source_word: אַהֲרֹן וּ/בָנָי/ו
  choice: Aaron et ses fils
  rationale: Le contexte de la consécration sacerdotale vise les fils d’Aaron; cette traduction est précise.
- source_word: אֶת יְדֵי/הֶם
  choice: leurs mains
  rationale: Le pluriel de l’hébreu est conservé.
- source_word: עַל רֹאשׁ הָ/אָיִל
  choice: sur la tête du bélier
  rationale: Traduction directe et idiomatique de la relation locative et du nom répété.
theological_decisions:
- issue: Terminologie du geste rituel d’imposition des mains
  choice: poseront leurs mains sur la tête du bélier
  alternative: appuieront leurs mains sur la tête du bélier
  rationale: Le verbe peut évoquer le fait d’appuyer, mais le verset ne développe ni l’intensité du geste ni sa signification théologique. « Poseront » décrit sobrement l’acte rituel sans lui ajouter une interprétation.
translation_notes:
  register: Français international moderne, clair et digne. Le futur prescriptif convient au discours rituel. « L’un des béliers » évite le calque peu naturel « le bélier unique » tout en maintenant l’ambiguïté entre distinction et ordre.
