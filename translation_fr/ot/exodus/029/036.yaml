base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/036.yaml
  text: And each day you shall offer a bull as a sin offering for atonement[a], and you shall purify the altar when you make atonement for it, and you shall anoint it to consecrate it.
translation:
  language: fr
  text: Chaque jour, tu offriras un taureau comme sacrifice pour le péché[a], en vue de l’expiation. Tu purifieras l’autel lorsque tu feras l’expiation pour lui, puis tu l’oindras afin de le consacrer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification ». Le terme hébreu peut désigner le péché ou, dans un contexte sacrificiel, l’offrande servant à purifier du péché ou de l’impureté.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַר
  choice: un taureau
  rationale: Le terme désigne un taureau, sans imposer ici la précision « jeune ».
- source_word: חַטָּאת
  choice: sacrifice pour le péché
  rationale: Dans ce contexte rituel, le nom désigne l’offrande liée au traitement du péché et de l’impureté. La formulation retenue est courante et claire; la nuance de purification est signalée en note.
- source_word: לַיּוֹם
  choice: chaque jour
  rationale: Le contexte d’un rite répété donne à l’expression une valeur distributive.
- source_word: עַל הַכִּפֻּרִים
  choice: en vue de l’expiation
  rationale: Le pluriel hébreu renvoie ici aux rites d’expiation; le français emploie naturellement le singulier abstrait.
- source_word: וְחִטֵּאתָ
  choice: tu purifieras
  rationale: Au piel et avec l’autel pour objet, le verbe exprime une purification rituelle, non le pardon d’une faute morale commise par l’autel.
- source_word: הַמִּזְבֵּחַ
  choice: l’autel
  rationale: Équivalent français standard dans le contexte du sanctuaire.
- source_word: בְּכַפֶּרְךָ עָלָיו
  choice: lorsque tu feras l’expiation pour lui
  rationale: La préposition avec l’infinitif peut être temporelle ou instrumentale. « Lorsque » rend naturellement la circonstance sans exclure le lien de moyen; le pronom renvoie à l’autel.
- source_word: וּמָשַׁחְתָּ
  choice: tu l’oindras
  rationale: « Oindre » conserve le sens rituel précis de l’application d’huile consacratoire.
- source_word: לְקַדְּשׁוֹ
  choice: afin de le consacrer
  rationale: Le verbe indique que l’autel est mis à part comme saint pour le service sacré.
theological_decisions:
- issue: Rendre le langage cultuel de purification et d’expiation sans lui imposer des catégories doctrinales postérieures
  choice: Employer « sacrifice pour le péché », « purifier » et « faire l’expiation » dans leur sens rituel lié au sanctuaire
  alternative: Employer « sacrifice de purification » et rendre le verbe par « décontaminer rituellement »
  rationale: Le verset décrit la consécration de l’autel au moyen de rites sacrificiels. « Purifier l’autel » évite notamment de suggérer que l’autel aurait commis une faute morale.
- issue: Valeur de la construction בְּכַפֶּרְךָ עָלָיו
  choice: 'Comprendre la proposition comme temporelle: « lorsque tu feras l’expiation pour lui »'
  alternative: 'La comprendre comme instrumentale: « en faisant l’expiation pour lui »'
  rationale: Les deux valeurs sont possibles. La formulation temporelle s’intègre bien à la suite des actes rituels, sans rompre leur relation étroite.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire rituel traditionnel (« expiation », « oindre », « consacrer ») est conservé parce qu’il reste précis dans ce contexte; la syntaxe est simplifiée pour une lecture naturelle.
