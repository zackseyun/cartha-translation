base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/026.yaml
  text: Then you shall take the breast from the ram of ordination that is for Aaron[a], and you shall wave it as a wave offering before Yahweh; and it shall be your portion.
translation:
  language: fr
  text: Tu prendras la poitrine du bélier d’investiture destiné à Aaron, tu l’agiteras devant Yahweh en offrande de présentation, et elle sera ta part.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶחָזֶה
  choice: la poitrine
  rationale: Dans le contexte sacrificiel, חָזֶה désigne la partie anatomique attribuée selon le rituel ; « poitrine » est le terme français précis et usuel.
- source_word: אֵיל
  choice: bélier
  rationale: אַיִל désigne spécifiquement un mouton mâle adulte, ici employé dans un sacrifice.
- source_word: הַמִּלֻּאִים
  choice: d’investiture
  rationale: Ce terme technique désigne le rite d’installation d’Aaron dans sa fonction sacerdotale. « Investiture » exprime cette entrée en fonction sans évoquer indûment les formes d’ordination propres à des traditions ultérieures.
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: destiné à Aaron
  rationale: La construction associe le bélier à Aaron dans le cadre du rite, sans nécessairement exprimer sa propriété.
- source_word: וְהֵנַפְתָּ אֹתוֹ תְּנוּפָה
  choice: tu la balanceras ... comme offrande de présentation
  rationale: La formulation rend à la fois le geste rituel exprimé par le verbe נוף et la valeur cultuelle du nom תְּנוּפָה, dans un français intelligible.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » convient au contexte cultuel, tandis que le nom divin est translittéré directement.
- source_word: וְהָיָה לְךָ לְמָנָה
  choice: elle sera ta part
  rationale: מָנָה désigne la part attribuée à quelqu’un ; « ta part » est naturel, concis et exact.
- source_word: וְלָקַחְתָּ ... וְהֵנַפְתָּ ... וְהָיָה
  choice: Tu prendras ... tu la balanceras ... elle sera
  rationale: Les formes verbales coordonnées ont ici une valeur prescriptive ; le futur français rend naturellement une instruction rituelle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu porte le nom propre divin. « Yahweh » le conserve comme nom personnel plutôt que de lui substituer un titre.
- issue: Sens du terme cultuel הַמִּלֻּאִים
  choice: investiture
  alternative: consécration ; ordination
  rationale: Le contexte concerne l’installation d’Aaron dans la charge sacerdotale. « Investiture » conserve cette dimension institutionnelle sans importer des structures ecclésiales postérieures ; « consécration » reste une traduction possible.
translation_notes:
  register: Français international moderne, clair et digne. Le futur prescriptif convient aux instructions rituelles. Le terme technique « investiture » est explicité en note, et le geste concret de balancement est conservé dans le texte.
