  text: וְֽ/אִם יִוָּתֵ֞ר מִ/בְּשַׂ֧ר הַ/מִּלֻּאִ֛ים וּ/מִן הַ/לֶּ֖חֶם עַד הַ/בֹּ֑קֶר וְ/שָׂרַפְתָּ֤ אֶת הַ/נּוֹתָר֙ בָּ/אֵ֔שׁ לֹ֥א יֵאָכֵ֖ל כִּי קֹ֥דֶשׁ הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/034.yaml
  text: And if any of the flesh of the ordination offering or any of the bread is left until the morning[a], then you shall burn what is left with fire. It shall not be eaten, because it is holy.
translation:
  language: fr
  text: S’il reste jusqu’au matin de la viande du sacrifice d’ordination[a] ou du pain, tu brûleras au feu ce qui restera. On ne le mangera pas, car c’est saint.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de consécration ». Le terme hébreu désigne le rite d’installation des prêtres.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִוָּתֵר
  choice: s’il reste
  rationale: Le nifal de יתר exprime ce qui subsiste ou reste après le rite. La tournure conditionnelle française rend naturellement la forme passive hébraïque dans ce contexte.
- source_word: בְּשַׂר
  choice: de la viande
  rationale: Dans un contexte alimentaire et sacrificiel, « viande » est plus naturel en français moderne que « chair », tout en désignant concrètement la partie comestible de l’animal offert.
- source_word: הַמִּלֻּאִים
  choice: du sacrifice d’ordination
  rationale: Dans Exode 29, מִלֻּאִים désigne le rite d’installation des prêtres. « Ordination » en exprime clairement la fonction; « sacrifice » est explicité d’après le contexte immédiat de la viande rituelle.
- source_word: לֶּחֶם
  choice: du pain
  rationale: Équivalent direct et naturel du terme hébreu.
- source_word: עַד הַבֹּקֶר
  choice: jusqu’au matin
  rationale: Cette formulation conserve la limite temporelle exprimée par עַד.
- source_word: וְשָׂרַפְתָּ
  choice: tu brûleras
  rationale: Le waw suivi du qatal introduit ici la conséquence de la condition. Le futur français convient au registre prescriptif sans devoir ajouter « alors ».
- source_word: הַנּוֹתָר
  choice: ce qui restera
  rationale: Le participe substantivé désigne globalement le reste de la viande et du pain; cette formulation reprend naturellement le même champ lexical que la première proposition.
- source_word: בָּאֵשׁ
  choice: au feu
  rationale: « Brûler au feu » est une tournure française idiomatique qui rend la valeur instrumentale du syntagme hébreu.
- source_word: לֹא יֵאָכֵל
  choice: On ne le mangera pas
  rationale: Le futur à valeur d’interdiction conserve le ton juridique et la construction impersonnelle rend naturellement le passif hébreu.
- source_word: קֹדֶשׁ
  choice: une chose sainte
  rationale: Le substantif hébreu caractérise ici ce reste comme appartenant au domaine du saint. « Une chose sainte » maintient sa valeur cultuelle et convient au référent collectif.
theological_decisions:
- issue: Sens cultuel de הַמִּלֻּאִים dans le rite sacerdotal
  choice: sacrifice d’ordination
  alternative: sacrifice de consécration
  rationale: Le terme renvoie à l’installation officielle des prêtres, tout en impliquant leur consécration. « Ordination » indique plus précisément la fonction du rite dans ce passage; la variante est signalée afin de préserver l’étendue possible du terme.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier conserve l’adresse hébraïque à Moïse. La formulation reste juridique sans archaïsmes; le marqueur de note est placé immédiatement après le terme qu’il documente.
