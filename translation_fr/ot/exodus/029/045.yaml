  text: And I will dwell among the sons of Israel[c][b][a], and I will be their God.
translation:
  language: fr
  text: J’habiterai au milieu des fils d’Israël[a] et je serai leur Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël »; traditionnellement : « les enfants d’Israël ». On peut aussi traduire : « les Israélites ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je serai Dieu pour eux ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  choice: J’habiterai
  rationale: Le verbe שׁכן exprime le fait de demeurer ou de résider. « Habiter » est naturel en français moderne et conserve la portée de la présence divine sans introduire explicitement l’image du tabernacle.
- source_word: בְּתוֹךְ
  choice: au milieu de
  rationale: Avec un groupe humain, בְּתוֹךְ indique une présence au sein de la communauté. « Au milieu de » reste idiomatique et rend plus directement la formulation hébraïque que le seul « parmi ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La traduction conserve l’expression familiale masculine explicite de l’hébreu. Une note signale les équivalents français plus traditionnels ou plus idiomatiques.
- source_word: וְהָיִיתִי
  choice: et je serai
  rationale: Dans cette formule d’alliance, היה exprime une relation durable plutôt qu’un changement d’état; « je serai » convient donc mieux que « je deviendrai ».
- source_word: לָהֶם לֵאלֹהִים
  choice: leur Dieu
  rationale: La tournure hébraïque signifie littéralement « Dieu pour eux ». La formulation française « leur Dieu » rend naturellement sa force relationnelle et son caractère d’alliance.
theological_decisions:
- issue: Formule d’alliance
  choice: je serai leur Dieu
  alternative: je serai Dieu pour eux
  rationale: « Je serai leur Dieu » est une formulation française claire et consacrée qui préserve la relation d’alliance. La note maintient visible la construction plus littérale sans imposer une interprétation supplémentaire.
- issue: Désignation genrée du peuple
  choice: les fils d’Israël
  alternative: les enfants d’Israël / les Israélites
  rationale: Le texte source emploie explicitement le masculin pluriel « fils de ». Le texte principal le conserve, tandis que la note indique les équivalents français courants.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe brève suit le parallélisme hébreu. « Au milieu de » garde la dimension communautaire et spatiale de la présence divine; « fils d’Israël » préserve l’expression du texte source.
