base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/020.yaml
  text: Then you shall slaughter the ram[a], and take some of its blood and put it on the lobe of Aaron’s right ear, and on the lobe of the right ear of his sons, and on the thumb of their right hand, and on the big toe of their right foot[b]; and you shall throw the blood against the altar all around.
translation:
  language: fr
  text: Tu égorgeras ensuite le bélier, tu prendras de son sang et tu en mettras sur le lobe[a] de l’oreille droite d’Aaron, sur le lobe de l’oreille droite de ses fils, sur le pouce de leur main droite et sur le gros orteil de leur pied droit. Puis tu projetteras[b] le sang sur l’autel, tout autour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’extrémité de l’oreille droite d’Aaron [...] l’extrémité de l’oreille droite de ses fils ». Le terme hébreu peut désigner plus généralement l’extrémité de l’oreille, bien que « lobe » soit probablement le sens voulu dans ce contexte rituel.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « lanceras » ou « répandras d’un geste vif ». Le verbe hébreu évoque une application rituelle énergique du sang, et non une légère aspersion.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחַט
  choice: égorger
  rationale: Dans un contexte sacrificiel, « égorger » désigne précisément la mise à mort rituelle de l’animal et reste naturel en français moderne.
- source_word: אַיִל
  choice: bélier
  rationale: Équivalent français courant et précis pour le mouton mâle offert en sacrifice.
- source_word: מִדָּמוֹ
  choice: prendre de son sang
  rationale: La préposition מִן indique ici qu’une partie du sang est prélevée; cette tournure française exprime naturellement ce sens partitif.
- source_word: תְּנוּךְ אֹזֶן
  choice: lobe de l’oreille
  rationale: Le terme désigne une extrémité de l’oreille, probablement le lobe dans ce contexte rituel; l’incertitude lexicale est signalée en note.
- source_word: הַיְמָנִית
  choice: droite / droit
  rationale: L’adjectif précise chaque membre du côté droit; l’accord varie naturellement en français selon « oreille », « main » et « pied ».
- source_word: בֹּהֶן יָד
  choice: pouce
  rationale: Pour la main, בֹּהֶן désigne spécifiquement le pouce.
- source_word: בֹּהֶן רֶגֶל
  choice: gros orteil
  rationale: Pour le pied, בֹּהֶן désigne le gros orteil; c’est l’expression anatomique courante en français.
- source_word: זָרַק
  choice: projeter ... contre
  rationale: Dans le rituel sacrificiel, le verbe évoque une application énergique du sang contre l’autel, plutôt qu’une légère aspersion.
- source_word: סָבִיב
  choice: tout autour
  rationale: L’expression indique que le sang est appliqué sur le pourtour de l’autel.
- source_word: וְ
  choice: ensuite / et / puis
  rationale: Les formes verbales coordonnées font avancer la succession des gestes; ces connecteurs en rendent le déroulement clairement et naturellement.
