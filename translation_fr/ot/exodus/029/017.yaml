  yaml_path: translation/ot/exodus/029/017.yaml
  text: Then cut the ram into its pieces[a], wash its entrails and its legs[b], and put them on its pieces and on its head.
translation:
  language: fr
  text: Tu découperas le bélier en morceaux, tu laveras ses entrailles[a] et ses pattes, puis tu les déposeras sur ses morceaux et sur sa tête[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses parties internes ». Le terme hébreu peut désigner plus généralement l’intérieur de l’animal, bien que « entrailles » soit probablement plus précis dans ce contexte sacrificiel.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque signifie littéralement « sur ses morceaux et sur sa tête ». Dans ce contexte, elle peut aussi évoquer le fait de disposer les parties lavées avec les morceaux découpés et la tête en vue de l’offrande.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: le bélier
  rationale: Dans ce contexte sacrificiel, אַיִל désigne précisément un bélier.
- source_word: תְּנַתֵּחַ לִנְתָחָיו
  choice: tu découperas … en morceaux
  rationale: Le piel de נתח exprime le découpage de l’animal en pièces; cette formulation française est claire et naturelle.
- source_word: קִרְבּוֹ
  choice: ses entrailles
  rationale: קֶרֶב peut désigner l’intérieur en général, mais, dans les prescriptions sacrificielles, il renvoie vraisemblablement aux parties internes ou aux viscères à laver.
- source_word: כְרָעָיו
  choice: ses pattes
  rationale: כְּרָעַיִם désigne les pattes, notamment leur partie inférieure. « Pattes » est naturel en français pour un animal et évite l’ambiguïté humaine de « jambes ».
- source_word: וְנָתַתָּ עַל
  choice: tu les déposeras sur
  rationale: « Déposer » rend l’action d’arranger les éléments du sacrifice, tandis que « sur » conserve le sens spatial ordinaire de עַל sans le réduire à « avec ».
- source_word: רֹאשׁוֹ
  choice: sa tête
  rationale: Correspondance anatomique directe et naturelle.
- source_word: וְ
  choice: puis
  rationale: Dans la suite des consignes rituelles, « puis » marque naturellement la progression procédurale sans modifier son contenu.
