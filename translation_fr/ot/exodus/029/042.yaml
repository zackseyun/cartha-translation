  to: Ce sera un holocauste régulier[a], pour toutes vos générations, à l’entrée de la tente de la rencontre, devant Yahweh, où je vous rencontrerai, afin de t’y parler[b].
  rationale: 'La révision améliore la fluidité française de la double indication de lieu : « où » rend le premier « là », et « y » le second. Elle maintient le but exprimé par l’infinitif (« afin de »), ainsi que le passage délibéré du pluriel au singulier. La note est resserrée afin de ne pas préciser indûment le référent pluriel.'
