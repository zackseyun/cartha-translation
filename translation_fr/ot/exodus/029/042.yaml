  text: עֹלַ֤ת תָּמִיד֙ לְ/דֹרֹ֣תֵי/כֶ֔ם פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לִ/פְנֵ֣י יְהוָ֑ה אֲשֶׁ֨ר אִוָּעֵ֤ד לָ/כֶם֙ שָׁ֔מָּ/ה לְ/דַבֵּ֥ר אֵלֶ֖י/ךָ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/042.yaml
  text: It shall be a regular burnt offering throughout your generations at the entrance of the tent of meeting before Yahweh[a], where I will meet with you[b], to speak to you there.
translation:
  language: fr
  text: Ce sera un holocauste régulier[a], pour toutes vos générations, à l’entrée de la tente de la rencontre, devant Yahweh, où je vous rencontrerai, afin de t’y parler[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un holocauste continuel » ou « un holocauste perpétuel ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu passe du pluriel (« je vous rencontrerai ») au singulier (« te parler »), distinguant vraisemblablement le peuple dans son ensemble de Moïse en particulier.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלַת תָּמִיד
  choice: un holocauste régulier
  rationale: עֹלָה désigne l’offrande entièrement brûlée, traditionnellement appelée « holocauste », et תָּמִיד sa régularité durable. « Régulier » exprime le caractère prescrit et récurrent sans suggérer nécessairement une combustion ininterrompue.
- source_word: לְדֹרֹתֵיכֶם
  choice: pour toutes vos générations
  rationale: Cette formulation naturelle en français conserve l’idée d’une prescription applicable aux générations successives.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à l’entrée de la tente de la rencontre
  rationale: פֶּתַח indique l’entrée, tandis que אֹהֶל מוֹעֵד désigne la tente où a lieu la rencontre fixée avec Dieu.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » conserve le sens spatial et cultuel de לִפְנֵי, et « Yahweh » rend directement le nom divin יְהוָה.
- source_word: אֲשֶׁר אִוָּעֵד לָכֶם שָׁמָּה
  choice: là où je vous rencontrerai
  rationale: Le niphal de יעד évoque une rencontre fixée. La formulation française conserve le pluriel לָכֶם et intègre le premier שָׁמָּה dans « là où ».
- source_word: לְדַבֵּר אֵלֶיךָ שָׁם
  choice: pour te parler là
  rationale: L’infinitif indique le but de la rencontre. Le singulier אֵלֶיךָ est explicitement rendu par « te », et le second שָׁם par « là ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Passage du pluriel au singulier dans les pronoms
  choice: « je vous rencontrerai » puis « pour te parler »
  alternative: Harmoniser les deux pronoms au pluriel ou au singulier
  rationale: L’hébreu passe de לָכֶם, pluriel, à אֵלֶיךָ, singulier. Le français maintient cette tension grammaticale, le singulier visant vraisemblablement Moïse sans effacer le groupe précédemment évoqué.
translation_notes:
  register: Français international moderne, digne et accessible. La terminologie cultuelle traditionnelle « holocauste » est conservée pour sa précision biblique. La répétition de « là » reflète les deux indications locales du texte hébreu, tandis que le passage visible de « vous » à « te » préserve le changement de nombre.
