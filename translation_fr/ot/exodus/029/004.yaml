reference: Exodus 29:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶת אַהֲרֹ֤ן וְ/אֶת בָּנָי/ו֙ תַּקְרִ֔יב אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/רָחַצְתָּ֥ אֹתָ֖/ם בַּ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/004.yaml
  text: You shall bring Aaron and his sons near to the entrance of the tent of meeting[a], and you shall wash them with water.
translation:
  language: fr
  text: Tu feras approcher Aaron et ses fils de l’entrée de la tente de la rencontre[a], puis tu les laveras avec de l’eau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu présenteras Aaron et ses fils à l’entrée de la tente de la rencontre ». Le verbe hébreu peut avoir le sens cultuel de présenter quelqu’un en vue d’un acte rituel.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּקְרִיב
  choice: tu feras approcher
  rationale: Le hifil de קרב signifie « faire approcher » ou, dans un cadre cultuel, « présenter ». « Faire approcher » conserve à la fois le mouvement vers le sanctuaire et la nuance rituelle.
- source_word: אֶל
  choice: de
  rationale: 'Après « faire approcher », le français construit naturellement la destination avec « de » : « faire approcher quelqu’un de l’entrée ».'
- source_word: פֶּתַח
  choice: l’entrée
  rationale: פֶּתַח désigne l’ouverture ou l’entrée, sans nécessairement supposer une porte articulée.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette formulation rend le lieu désigné pour la rencontre tout en restant claire et digne en français contemporain.
- source_word: וְרָחַצְתָּ
  choice: puis tu les laveras
  rationale: Le verbe רחץ signifie laver. « Puis » exprime naturellement la succession des instructions portée ici par la conjonction.
- source_word: בַּמָּיִם
  choice: avec de l’eau
  rationale: La préposition indique ici le moyen employé ; « avec de l’eau » est l’expression française la plus naturelle.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le terme désigne ici les fils d’Aaron, concernés avec lui par la consécration sacerdotale.
theological_decisions:
- issue: Nuance cultuelle de קרב dans le contexte de la consécration sacerdotale
  choice: tu feras approcher Aaron et ses fils
  alternative: tu présenteras Aaron et ses fils
  rationale: « Faire approcher » préserve le sens concret et la résonance rituelle du verbe sans préciser au-delà du texte la nature exacte de la présentation. L’autre lecture possible est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le futur à valeur injonctive convient à la série d’instructions. La répétition de « tu » maintient l’adresse directe du texte hébreu.
