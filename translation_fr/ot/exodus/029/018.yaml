  text: וְ/הִקְטַרְתָּ֤ אֶת כָּל הָ/אַ֨יִל֙ הַ/מִּזְבֵּ֔חָ/ה עֹלָ֥ה ה֖וּא לַֽ/יהוָ֑ה רֵ֣יחַ נִיח֔וֹחַ אִשֶּׁ֥ה לַ/יהוָ֖ה הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/018.yaml
  text: And you shall burn the whole ram on the altar[a]. It is a burnt offering to Yahweh, a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: fr
  text: Tu feras brûler tout le bélier sur l’autel. C’est un holocauste pour Yahweh, un parfum agréable[a] ; c’est une offrande consumée par le feu pour Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un parfum apaisant ». L’expression hébraïque est une formule sacrificielle désignant une offrande agréée par Yahweh.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une offrande de nourriture ». Le sens exact du terme hébreu est discuté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטַרְתָּ
  choice: Tu feras brûler
  rationale: Le hiphil de קטר désigne ici l’action de faire monter l’offrande en fumée sur l’autel. « Faire brûler » est naturel en français moderne, tandis que le contexte sacrificiel en précise le sens.
- source_word: כָּל הָאַיִל
  choice: tout le bélier
  rationale: כָּל souligne que l’animal entier est offert, et אַיִל désigne précisément un bélier.
- source_word: הַמִּזְבֵּחָה
  choice: sur l’autel
  rationale: Le hé directionnel indique le mouvement vers l’autel ; en français idiomatique, puisque la combustion s’y déroule, « sur l’autel » convient le mieux.
- source_word: עֹלָה
  choice: un holocauste
  rationale: Dans le vocabulaire sacrificiel biblique français, « holocauste » désigne l’offrande entièrement brûlée et reste à la fois précis et intelligible.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: Le lamed exprime ici la destination et la consécration de l’offrande. « Pour Yahweh » est naturel en français et conserve le nom divin.
- source_word: רֵיחַ נִיחוֹחַ
  choice: un parfum agréable
  rationale: Cette formule sacrificielle qualifie une offrande agréée. « Parfum agréable » communique cette acceptabilité sans développer abusivement l’image olfactive.
- source_word: אִשֶּׁה
  choice: une offrande consumée par le feu
  rationale: Le terme sacrificiel אִשֶּׁה est traditionnellement associé au feu, même si son étymologie et sa portée exacte sont discutées. Cette traduction conserve explicitement le mode sacrificiel sans imposer l’interprétation « offrande de nourriture ».
- source_word: הוּא
  choice: C’est… ; c’est…
  rationale: Les deux occurrences ont une fonction prédicative et identifient successivement le sacrifice comme holocauste puis comme offrande consumée par le feu.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom d’alliance révélé dans le contexte du Sinaï sans le remplacer par un titre.
- issue: Portée de רֵיחַ נִיחוֹחַ
  choice: un parfum agréable
  alternative: un parfum apaisant
  rationale: La formule exprime l’acceptation favorable du sacrifice. « Agréable » évite de trancher en faveur de l’idée plus spécifique selon laquelle l’offrande calmerait Dieu.
- issue: Sens sacrificiel de אִשֶּׁה
  choice: une offrande consumée par le feu
  alternative: une offrande de nourriture
  rationale: Le sens exact du terme fait débat. Le texte principal retient la valeur traditionnellement liée au feu, et la note signale l’autre analyse sans effacer l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement correspond au singulier hébreu adressé à Moïse. La répétition « c’est » reproduit la double prédication du texte hébreu, et le point-virgule maintient le lien étroit entre les deux caractérisations du sacrifice.
