base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/022.yaml
  text: And you shall take from the ram the fat[a], and the fat tail, and the fat that covers the entrails, and the lobe of the liver, and the two kidneys, and the fat that is on them, and the right thigh, for it is a ram of ordination.
translation:
  language: fr
  text: Tu prendras du bélier la graisse, la queue grasse, la graisse qui couvre les entrailles, le lobe du foie, les deux reins, la graisse qui est sur eux, ainsi que la cuisse droite, car c’est un bélier de consécration[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bélier d’investiture » ou « bélier d’installation ». L’expression hébraïque désigne le bélier employé dans le rite qui établit les prêtres dans leur fonction.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: graisse
  rationale: Dans ce contexte sacrificiel, le terme désigne les parties grasses de l’animal réservées à l’offrande. « Graisse » est direct, précis et naturel en français.
- source_word: אַלְיָה
  choice: queue grasse
  rationale: Le mot désigne la queue riche en graisse des moutons à queue grasse, et non simplement une queue quelconque.
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: qui couvre les entrailles
  rationale: Cette formulation rend concrètement la graisse enveloppant les organes internes et convient au registre rituel du passage.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: le lobe du foie
  rationale: L’identification anatomique exacte reste discutée, mais « lobe du foie » est la formulation conventionnelle la plus intelligible; « appendice du foie » demeure possible.
- source_word: כְּלָיֹת
  choice: reins
  rationale: Le nom désigne sans ambiguïté les reins dans cette description anatomique.
- source_word: שׁוֹק הַיָּמִין
  choice: la cuisse droite
  rationale: Dans le vocabulaire sacrificiel, שׁוֹק désigne la portion de la patte, souvent comprise comme la cuisse; ce choix est plus précis que le terme général « patte ».
- source_word: אֵיל מִלֻּאִים
  choice: un bélier de consécration
  rationale: L’expression désigne le bélier employé dans le rite qui établit les prêtres dans leur fonction. « Consécration » est naturel dans ce contexte, tandis que la note conserve les autres nuances possibles.
- source_word: וְלָקַחְתָּ
  choice: Tu prendras
  rationale: Le parfait précédé de waw poursuit ici une série d’instructions; le futur français exprime naturellement cette directive procédurale.
theological_decisions:
- issue: Traduction de la terminologie d’installation sacerdotale dans אֵיל מִלֻּאִים
  choice: un bélier de consécration
  alternative: un bélier d’investiture; un bélier d’installation
  rationale: Le contexte est le rite par lequel Aaron et ses fils sont établis dans le sacerdoce. « Consécration » exprime la mise à part rituelle sans imposer une structure ecclésiastique ultérieure; la note signale les nuances institutionnelles également présentes.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde l’enchaînement précis des éléments rituels sans lourdeur excessive. Le marqueur de note est placé après l’expression qu’il explique.
