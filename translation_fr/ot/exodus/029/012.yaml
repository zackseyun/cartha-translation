  text: And you shall take some of the blood of the bull and put it on the horns of the altar with your finger[c][b][a], and you shall pour out all the blood at the base of the altar.
translation:
  language: fr
  text: Tu prendras du sang du taureau et tu en mettras sur les cornes de l’autel avec ton doigt[b], puis tu verseras tout le sang à la base de l’autel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Les « cornes » étaient des saillies en forme de corne situées aux angles de l’autel.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ מִדַּם הַפָּר
  choice: Tu prendras une partie du sang du taureau
  rationale: 'Le parfait avec waw poursuit la série d’instructions avec une valeur prescriptive. La préposition מִן est ici partitive : seule une partie du sang est prise pour être déposée sur les cornes.'
- source_word: וְנָתַתָּה
  choice: et tu en mettras
  rationale: נתן a ici le sens concret et non technique de « mettre ». Le pronom « en » reprend naturellement en français la partie du sang qui vient d’être prélevée.
- source_word: עַל קַרְנֹת הַמִּזְבֵּחַ
  choice: sur les cornes de l’autel
  rationale: La traduction conserve le terme cultuel concret « cornes », qui désigne les saillies en forme de corne aux angles de l’autel.
- source_word: בְּאֶצְבָּעֶךָ
  choice: avec ton doigt
  rationale: La préposition בְּ a une valeur instrumentale et précise le moyen rituel employé.
- source_word: וְאֶת כָּל הַדָּם תִּשְׁפֹּךְ
  choice: Puis tu verseras tout le reste du sang
  rationale: שׁפך signifie « verser » dans ce contexte sacrificiel. Bien que כָּל הַדָּם soit littéralement « tout le sang », le contexte indique le sang restant après le prélèvement d’une partie; « le reste » rend explicite cette relation sans modifier le geste décrit.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: au pied de l’autel
  rationale: יְסוֹד désigne le soubassement ou la base. « Au pied de l’autel » est une formulation française naturelle; une note conserve l’alternative plus formelle « à la base ».
theological_decisions:
- issue: Précision du vocabulaire rituel de l’autel
  choice: Conserver « cornes » et rendre יְסוֹד par « pied », avec « base » en note
  alternative: Remplacer « cornes » par « angles » et employer uniquement « base »
  rationale: Le texte décrit avec précision le rite de consécration. Garder l’image concrète des cornes préserve sa texture cultuelle sans lui imposer une interprétation doctrinale ultérieure.
translation_notes:
  register: Français international moderne, clair et digne. Le futur simple exprime la prescription dans une suite d’instructions rituelles. Le tutoiement correspond au singulier hébreu adressé à Moïse.
