review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu. Toutefois, אַבְנֵט est au singulier collectif/distributif : la formulation française « une ceinture à Aaron et à ses fils » peut suggérer une seule ceinture commune, alors que chaque prêtre est ceint. La révision explicite la valeur distributive sans ajouter de détail au texte.'
  naturalness: Le français est moderne et accessible. « Ceindre … de ceintures » est plus idiomatique et plus précis dans ce contexte vestimentaire que « mettre une ceinture à Aaron et à ses fils ». « Conféreras l’investiture » exprime plus naturellement l’acte que « procéderas à l’investiture ».
  terminology: « Coiffes » conserve utilement le caractère générique de מִגְבָּעוֹת. « Sacerdoce » et « prescription perpétuelle » rendent convenablement les termes cultuels et juridiques, sans imposer une lecture doctrinale. La note préserve l’idiome hébreu de « remplir la main ».
  issues:
  - severity: low
    issue: Nombre distributif de « ceinture »
    rationale: Le singulier français avec un complément coordonné peut être compris comme une ceinture unique. « Ceindras Aaron et ses fils de ceintures » rend naturellement l’attribution d’une ceinture à chacun, conformément au contexte sacerdotal et à la valeur distributive du singulier hébreu.
  - severity: low
    issue: Formulation de l’investiture
    rationale: « Procéder à l’investiture » est possible, mais « conférer l’investiture » désigne plus directement l’action accomplie par Moïse et maintient la valeur d’installation de l’idiome וּמִלֵּאתָ יַד.
  revised_text: Tu ceindras Aaron et ses fils de ceintures, et tu leur attacheras des coiffes. Le sacerdoce leur appartiendra en vertu d’une prescription perpétuelle. Tu conféreras l’investiture à Aaron et à ses fils[a].
  revised_footnotes:
