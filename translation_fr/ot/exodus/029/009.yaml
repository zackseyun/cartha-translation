revisions:
- from: Tu mettras une ceinture à Aaron et à ses fils, et tu leur attacheras des coiffes. Le sacerdoce leur appartiendra selon une prescription permanente. Tu procéderas à l’investiture d’Aaron et de ses fils[a].
  to: Tu ceindras Aaron et ses fils de ceintures, et tu leur attacheras des coiffes. Le sacerdoce leur appartiendra en vertu d’une prescription perpétuelle. Tu conféreras l’investiture à Aaron et à ses fils[a].
  rationale: La révision lève l’ambiguïté française sur la distribution des ceintures et rend plus directement l’acte d’installation sacerdotale. « En vertu d’une prescription perpétuelle » exprime la relation juridique de לְחֻקַּת עוֹלָם avec une formulation française naturelle, tout en conservant la nuance durable du texte sans statuer sur des développements théologiques ultérieurs.
