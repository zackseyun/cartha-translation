base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/009.yaml
  text: You shall fasten sashes on them[a], on Aaron and on his sons, and you shall bind caps on them. The priesthood shall belong to them as a permanent statute. So you shall ordain Aaron and his sons.
translation:
  language: fr
  text: Tu ceindras Aaron et ses fils de ceintures, et tu leur attacheras des coiffes. Le sacerdoce leur appartiendra en vertu d’une prescription perpétuelle. Tu conféreras l’investiture à Aaron et à ses fils[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu rempliras la main d’Aaron et la main de ses fils », expression hébraïque désignant leur installation dans le service sacerdotal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָגַרְתָּ ... אַבְנֵט
  choice: tu mettras une ceinture
  rationale: Le verbe חגר avec אַבְנֵט désigne l’action de ceindre ou de fixer la ceinture sacerdotale. Cette formulation est claire et naturelle en français moderne.
- source_word: אַהֲרֹן וּבָנָיו
  choice: à Aaron et à ses fils
  rationale: L’apposition précise directement l’antécédent du pronom hébreu; le français peut nommer les intéressés sans conserver un pronom redondant.
- source_word: חָבַשְׁתָּ לָהֶם מִגְבָּעֹת
  choice: tu leur attacheras des coiffes
  rationale: חבש évoque le fait d’attacher ou d’ajuster sur la tête. «Coiffes» désigne sobrement les couvre-chefs des prêtres, distincts de celui du grand prêtre, sans leur imposer une forme trop précise.
- source_word: וְהָיְתָה לָהֶם כְּהֻנָּה
  choice: Le sacerdoce leur appartiendra
  rationale: Cette formulation rend naturellement la construction possessive hébraïque et l’attribution durable de la charge sacerdotale.
- source_word: לְחֻקַּת עוֹלָם
  choice: selon une prescription permanente
  rationale: חֻקָּה désigne une règle fixée ou une prescription, tandis que עוֹלָם exprime ici une durée continue dans le cadre cultuel de l’alliance. «Permanente» conserve cette portée sans trancher des questions théologiques ultérieures.
- source_word: וּמִלֵּאתָ יַד
  choice: tu procéderas à l’investiture
  rationale: L’expression «remplir la main» est un idiome technique désignant l’installation dans la fonction sacerdotale. «Investiture» communique cette valeur institutionnelle tout en évitant de confondre ce geste avec d’autres verbes hébreux rendus par «consacrer».
theological_decisions:
- issue: Portée temporelle de לְחֻקַּת עוֹלָם
  choice: selon une prescription permanente
  alternative: selon une prescription perpétuelle / comme prescription éternelle
  rationale: «Permanente» exprime la continuité normative de l’institution sacerdotale dans son cadre légal et cultuel sans préciser au-delà du texte s’il s’agit d’une éternité absolue.
- issue: Sens de l’idiome sacerdotal וּמִלֵּאתָ יַד
  choice: tu procéderas à l’investiture d’Aaron et de ses fils
  alternative: tu rempliras la main d’Aaron et de ses fils / tu consacreras Aaron et ses fils
  rationale: «Investiture» rend la fonction technique de l’idiome sans reproduire dans le corps du texte une image devenue obscure. La formulation littérale est donnée en note afin de préserver la transparence du texte source.
translation_notes:
  register: Français international moderne, digne et accessible. «Coiffes» reste volontairement générique; «prescription permanente» maintient la nuance juridique et cultuelle; «investiture» restitue l’idiome technique, explicité en note.
