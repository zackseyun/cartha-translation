  text: וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֣ין הָ/עַרְבָּ֑יִם כְּ/מִנְחַ֨ת הַ/בֹּ֤קֶר וּ/כְ/נִסְכָּ/הּ֙ תַּֽעֲשֶׂה לָּ֔/הּ לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/041.yaml
  text: And you shall offer the second lamb at twilight[a]; you shall offer for it its grain offering and its drink offering, as in the morning, as a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: fr
  text: Tu offriras le second agneau au crépuscule[a]. Tu prépareras pour lui une offrande de céréales et une libation, comme le matin, en agréable parfum, comme une offrande consumée par le feu pour Yahvé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « entre les deux soirs », expression qui désigne la fin de l’après-midi ou le crépuscule.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une offrande alimentaire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: le second agneau
  rationale: כֶּבֶשׂ désigne ici un jeune ovin destiné au sacrifice, et « second » reprend clairement la succession des deux offrandes quotidiennes.
- source_word: תַּעֲשֶׂה
  choice: tu offriras / tu présenteras
  rationale: Le verbe עשה signifie littéralement « faire », mais prend naturellement dans ce contexte rituel le sens de préparer et présenter une offrande.
- source_word: בֵּין הָעַרְבָּיִם
  choice: au crépuscule
  rationale: Cette expression idiomatique, littéralement « entre les deux soirs », désigne la fin de l’après-midi ou le crépuscule. La formulation littérale est conservée en note.
- source_word: כְּמִנְחַת הַבֹּקֶר
  choice: une offrande de céréales […] comme celles du matin
  rationale: Dans la législation sacrificielle, מִנְחָה désigne l’offrande végétale qui accompagne le sacrifice; « offrande de céréales » est précis et courant.
- source_word: וּכְנִסְכָּהּ
  choice: une libation comme celles du matin
  rationale: נֶסֶךְ désigne une boisson rituellement versée. « Libation » exprime ce geste de façon concise et usuelle en français biblique moderne.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: un parfum agréable
  rationale: Cette formule sacrificielle exprime l’agrément de l’offrande devant Dieu tout en conservant l’image olfactive du texte.
- source_word: אִשֶּׁה
  choice: un mets offert
  rationale: Le terme cultuel peut désigner une offrande présentée à Dieu comme un mets, traditionnellement comprise comme une offrande faite par le feu. Cette autre traduction est signalée en note afin de préserver la nuance.
- source_word: לַיהוָה
  choice: à Yahvé
  rationale: Le texte porte explicitement le nom divin יהוה; « Yahvé » est sa forme française traditionnelle et directement nominale.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte emploie le nom propre de l’alliance. Le rendre par « Yahvé » préserve cette valeur nominale plutôt que de lui substituer un titre.
- issue: Portée de לְרֵיחַ נִיחֹחַ
  choice: un parfum agréable
  alternative: un parfum apaisant
  rationale: « Agréable » conserve la notion d’acceptabilité sans préciser de manière excessive que l’offrande calmerait ou apaiserait Dieu.
- issue: Sens du terme sacrificiel אִשֶּׁה
  choice: un mets offert
  alternative: une offrande faite par le feu
  rationale: Le choix principal garde l’image cultuelle d’un don présenté à Dieu, tandis que la note conserve l’interprétation traditionnelle liée au feu sans trancher silencieusement la question lexicale.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond au discours direct adressé à Moïse. La répétition du verbe a été conservée en deux phrases, tandis que « comme celles du matin » porte naturellement sur l’offrande de céréales et la libation.
