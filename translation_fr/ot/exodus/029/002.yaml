base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/002.yaml
  text: and unleavened bread[a], and unleavened cakes mixed with oil, and unleavened wafers spread with oil[b]; you shall make them of fine wheat flour.
translation:
  language: fr
  text: du pain sans levain, des gâteaux[a] sans levain mélangés à de l’huile et des galettes minces sans levain enduites d’huile[b]. Tu les feras avec de la farine fine de blé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pains » ; le terme hébreu peut désigner un gâteau ou un pain, probablement de forme arrondie.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ointes d’huile » ; le verbe est habituellement employé pour l’onction, mais il décrit ici la préparation des galettes.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם מַצּוֹת
  choice: pain sans levain
  rationale: Cette expression française naturelle rend le pain caractérisé par l’absence de levain et conserve sa portée rituelle.
- source_word: חַלֹּת מַצֹּת
  choice: gâteaux sans levain
  rationale: חַלָּה désigne ici une pièce de pain ou un gâteau, probablement de forme arrondie. « Gâteaux » distingue cet élément du pain générique et des galettes minces qui suivent.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: mélangés à de l’huile
  rationale: Le participe de בלל indique un mélange ou une incorporation. La formulation reste générale et n’impose pas une technique précise comme le pétrissage.
- source_word: רְקִיקֵי מַצּוֹת
  choice: minces galettes sans levain
  rationale: רָקִיק désigne une pièce de pain mince. « Minces galettes » est plus clair en français courant que « gaufrettes » et préserve le contraste avec les חַלּוֹת.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: enduites d’huile
  rationale: Le verbe משׁח est habituellement celui de l’onction, mais, dans cette instruction culinaire, il décrit l’application d’huile sur les galettes. « Enduites » rend naturellement le geste sans effacer le sens littéral signalé en note.
- source_word: סֹלֶת חִטִּים
  choice: fleur de farine de blé
  rationale: סֹלֶת désigne une farine fine et חִטִּים en précise la céréale. « Fleur de farine de blé » conserve l’idée d’une farine de qualité fine dans un registre biblique compréhensible.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: Tu les feras
  rationale: L’imparfait hébreu a ici une valeur prescriptive dans les instructions rituelles. Le futur français exprime naturellement cette obligation.
