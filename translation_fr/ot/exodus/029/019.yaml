  text: וְ/לָ֣קַחְתָּ֔ אֵ֖ת הָ/אַ֣יִל הַ/שֵּׁנִ֑י וְ/סָמַ֨ךְ אַהֲרֹ֧ן וּ/בָנָ֛י/ו אֶת יְדֵי/הֶ֖ם עַל רֹ֥אשׁ הָ/אָֽיִל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/019.yaml
  text: Then you shall take the second ram, and Aaron and his sons shall lay their hands on the head of the ram.
translation:
  language: fr
  text: Tu prendras ensuite le second bélier. Aaron et ses fils poseront leurs mains sur la tête du bélier.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Tu prendras ensuite
  rationale: Le qatal précédé de וְ poursuit ici la séquence des instructions adressées à Moïse. Le futur français exprime naturellement la prescription, et « ensuite » marque la progression du rite.
- source_word: הָאַיִל הַשֵּׁנִי
  choice: le second bélier
  rationale: אַיִל désigne un bélier et הַשֵּׁנִי est l’ordinal « second », renvoyant au deuxième bélier de la cérémonie de consécration.
- source_word: וְסָמַךְ
  choice: poseront
  rationale: Dans le contexte sacrificiel, סמך désigne le geste rituel consistant à poser ou appuyer la main sur l’animal. « Poseront leurs mains » est clair et naturel en français sans surinterpréter l’intensité du geste.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Aaron et ses fils
  rationale: בָנָיו désigne ici les fils d’Aaron qui participent à leur consécration sacerdotale.
- source_word: אֶת יְדֵיהֶם
  choice: leurs mains
  rationale: Le texte hébreu emploie le pluriel, conservé naturellement en français.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: sur la tête du bélier
  rationale: Cette formulation rend directement la relation spatiale exprimée par עַל et conserve le singulier de רֹאשׁ.
theological_decisions:
- issue: Rendre l’imposition des mains sans ajouter d’explication théologique
  choice: poseront leurs mains sur la tête du bélier
  alternative: appuieront leurs mains sur la tête du bélier
  rationale: Le verset décrit le geste rituel, mais n’en explicite pas la signification. La traduction n’y ajoute donc aucune notion de transfert de faute, d’identification ou d’ordination.
translation_notes:
  register: Français international moderne, sobre et digne. Le futur de prescription convient à une suite d’instructions rituelles; la division en deux phrases allège la syntaxe sans modifier l’enchaînement du texte.
