base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/023.yaml
  text: and one loaf of bread[a], one cake of bread with oil, and one wafer, from the basket of unleavened bread that is before Yahweh.
translation:
  language: fr
  text: et une miche de pain, un gâteau de pain à l’huile et une galette fine, provenant de la corbeille des pains sans levain qui est devant Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque du nom divin et sa traduction traditionnelle.
lexical_decisions:
- source_word: כִּכַּר לֶחֶם
  choice: une miche de pain
  rationale: כִּכַּר désigne ici une unité de pain, probablement de forme ronde. « Miche de pain » est naturel en français et distingue cet élément du gâteau qui suit, sans imposer dans le texte une forme seulement implicite.
- source_word: אַחַת / אֶחָד
  choice: un / une
  rationale: Le numéral cardinal est rendu pour chacun des trois éléments afin de conserver la précision de l’instruction rituelle.
- source_word: חַלַּת לֶחֶם שֶׁמֶן
  choice: un gâteau de pain à l’huile
  rationale: La formulation conserve le lien explicite avec le pain et l’huile sans préciser, au-delà de l’hébreu, si l’huile est mélangée à la pâte ou appliquée autrement.
- source_word: רָקִיק
  choice: une galette fine
  rationale: רָקִיק désigne une galette mince. « Galette fine » exprime clairement cette caractéristique en français courant, tandis que « gaufrette » évoquerait un aliment moderne inapproprié.
- source_word: מִסַּל הַמַּצּוֹת
  choice: pris dans la corbeille des pains sans levain
  rationale: מִן indique la provenance et סַל une corbeille. Le participe « pris » explicite sobrement l’accord de provenance avec les trois aliments; « pains sans levain » rend naturellement le pluriel מַצּוֹת.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: qui se trouve devant Yahweh
  rationale: La traduction préserve le sens spatial et cultuel de לִפְנֵי, « devant, en présence de », sans ajouter l’idée que la corbeille aurait été spécialement déposée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom divin plutôt que remplacé silencieusement par un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu porte directement le tétragramme. « Yahweh » maintient son statut de nom propre; la note signale l’usage traditionnel français sans confondre le nom avec un titre.
translation_notes:
  register: Français international moderne, sobre et liturgiquement digne. La phrase conserve le « et » initial parce que le verset poursuit l’énumération du contexte précédent. La répétition des articles indéfinis maintient la précision rituelle de l’hébreu.
