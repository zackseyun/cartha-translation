  text: וְ/יָדְע֗וּ כִּ֣י אֲנִ֤י יְהוָה֙ אֱלֹ֣הֵי/הֶ֔ם אֲשֶׁ֨ר הוֹצֵ֧אתִי אֹתָ֛/ם מֵ/אֶ֥רֶץ מִצְרַ֖יִם לְ/שָׁכְנִ֣/י בְ/תוֹכָ֑/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/הֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/046.yaml
  text: And they shall know that I am Yahweh their God[a], who brought them out from the land of Egypt so that I might dwell among them[b]. I am Yahweh their God.
translation:
  language: fr
  text: Ils sauront que je suis Yahweh, leur Dieu, moi qui les ai fait sortir du pays d’Égypte afin d’habiter au milieu d’eux[a]. Je suis Yahweh, leur Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en leur sein » ; on peut aussi traduire : « parmi eux ».'
    reason: Précision sur l’expression hébraïque בְתוֹכָם et son autre rendu idiomatique possible.
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Ils sauront
  rationale: Le parfait qal précédé de la conjonction a ici une valeur future et résultative dans la suite des promesses du passage. « Ils sauront » est naturel et conserve la solennité de la formule d’alliance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיהֶם
  choice: leur Dieu
  rationale: Malgré sa forme morphologiquement plurielle, אֱלֹהִים désigne ici, avec le nom divin et dans ce contexte d’alliance, le Dieu unique d’Israël.
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: moi qui les ai fait sortir du pays d’Égypte
  rationale: La reprise par « moi » permet d’accorder naturellement le verbe à la première personne tout en préservant la proposition relative hébraïque et la formule traditionnelle de l’exode.
- source_word: לְשָׁכְנִי
  choice: afin d’habiter
  rationale: L’infinitif construit précédé de לְ exprime ici le but de la sortie d’Égypte. « Afin de » rend clairement cette valeur sans ajouter d’interprétation théologique.
- source_word: בְתוֹכָם
  choice: au milieu d’eux
  rationale: Cette expression restitue directement l’idée d’une présence divine au sein du peuple et reste idiomatique en français moderne.
- source_word: אֲנִי יְהוָה אֱלֹהֵיהֶם
  choice: Je suis Yahweh, leur Dieu
  rationale: La formulation conserve l’ordre et l’accent de la déclaration d’alliance finale dans un français naturel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel révélé à Israël sans le remplacer par un titre.
- issue: Valeur de la proposition לְשָׁכְנִי בְתוֹכָם
  choice: afin d’habiter au milieu d’eux
  alternative: pour habiter parmi eux
  rationale: 'La construction indique le but de l’action divine : la sortie d’Égypte vise la présence de Dieu au milieu de son peuple. Le rendu conserve cette relation sans développer ses implications doctrinales.'
translation_notes:
  register: Français international moderne, digne et accessible. « Moi qui » évite une relative maladroite après « je suis Yahweh, leur Dieu » tout en maintenant l’insistance de la première personne. La répétition finale est conservée intégralement.
