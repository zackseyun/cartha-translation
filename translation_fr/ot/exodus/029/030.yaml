  text: שִׁבְעַ֣ת יָמִ֗ים יִלְבָּשָׁ֧/ם הַ/כֹּהֵ֛ן תַּחְתָּ֖י/ו מִ/בָּנָ֑י/ו אֲשֶׁ֥ר יָבֹ֛א אֶל אֹ֥הֶל מוֹעֵ֖ד לְ/שָׁרֵ֥ת בַּ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/030.yaml
  text: For seven days the priest from among his sons who succeeds him shall put them on[c][b][a], when he enters the tent of meeting to minister in the holy place.
translation:
  language: fr
  text: Pendant sept jours, le prêtre qui lui succédera, l’un de ses fils[b], les portera[a] lorsqu’il entrera dans la tente de la Rencontre pour accomplir son service dans le lieu saint[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les revêtira ». Le verbe hébreu peut exprimer l’action de mettre des vêtements ou le fait de les porter.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le prêtre à sa place, d’entre ses fils », c’est-à-dire le prêtre issu de ses fils qui lui succédera.'
    reason: lexical_alternative
  - marker: c
    text: Ou « dans le sanctuaire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Pendant sept jours
  rationale: L’accusatif de durée est rendu naturellement en français par « pendant », qui indique toute la durée prescrite.
- source_word: יִלְבָּשָׁם
  choice: les portera
  rationale: Le verbe לבש peut désigner soit l’action de revêtir des vêtements, soit le fait de les porter. Ici, « les portera » convient bien à la durée de sept jours, tandis que « les revêtira » reste possible.
- source_word: הַכֹּהֵן תַּחְתָּיו מִבָּנָיו
  choice: le prêtre choisi parmi ses fils pour lui succéder
  rationale: Cette formulation exprime clairement en français le sens partitif de מִבָּנָיו et la succession dans la fonction indiquée littéralement par תַּחְתָּיו, sans ajouter de précision doctrinale.
- source_word: אֲשֶׁר יָבֹא
  choice: lorsqu’il entrera
  rationale: La proposition relative hébraïque prend ici naturellement une valeur circonstancielle et temporelle liée à l’exercice du service sacerdotal.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette expression rend le nom cultuel de la tente tout en restant claire et digne en français moderne.
- source_word: לְשָׁרֵת
  choice: pour accomplir son service
  rationale: Dans ce contexte sacerdotal, la formule désigne un service officiel et sacré; elle est plus naturelle ici que le simple infinitif « servir ».
- source_word: בַּקֹּדֶשׁ
  choice: dans le lieu saint
  rationale: La traduction conserve la référence concrète à l’espace sacré de la tente; « dans le sanctuaire » demeure une autre lecture possible.
theological_decisions:
- issue: Succession sacerdotale
  choice: le prêtre choisi parmi ses fils pour lui succéder
  alternative: le prêtre, parmi ses fils, qui prendra sa place
  rationale: Le texte décrit la succession d’un fils dans la charge sacerdotale. La formulation retenue rend cette succession héréditaire sans lui superposer une doctrine ultérieure.
- issue: Portée spatiale de בַּקֹּדֶשׁ
  choice: dans le lieu saint
  alternative: dans le sanctuaire
  rationale: « Le lieu saint » préserve la référence à un espace cultuel concret, tout en laissant en note l’autre traduction française courante du terme.
translation_notes:
  register: Français international moderne, clair et digne. « Accomplir son service » marque le contexte sacerdotal sans archaïsme; les notes conservent les principales ambiguïtés lexicales de l’hébreu.
