revisions:
- from: Tu placeras tout cela sur les paumes d’Aaron et sur celles de ses fils[a], puis tu leur feras accomplir le geste de présentation devant Yahweh.
  to: Tu placeras tout cela sur les paumes d’Aaron et sur les paumes de ses fils, puis tu les présenteras par un geste de balancement devant Yahweh.
  rationale: La révision maintient l’ensemble des portions comme objet de l’action rituelle, conserve la concrétude de « paumes », et rend le rite de תְּנוּפָה comme une présentation comportant un balancement, sans en déterminer davantage la forme. La note devenue redondante est supprimée.
  reviewer_model: gpt-5.6-terra
