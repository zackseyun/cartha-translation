  text: וְ/שַׂמְתָּ֣ הַ/כֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְ/עַ֖ל כַּפֵּ֣י בָנָ֑י/ו וְ/הֵנַפְתָּ֥ אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/024.yaml
  text: You shall put all of it on the palms of Aaron and on the palms of his sons[a], and you shall wave them as a wave offering before Yahweh.
translation:
  language: fr
  text: Tu placeras tout cela sur les paumes d’Aaron et sur les paumes de ses fils, puis tu les présenteras par un geste de balancement devant Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Tu placeras
  rationale: Le parfait qal précédé de la conjonction poursuit ici une série d’instructions. Le futur à valeur injonctive est naturel et digne en français.
- source_word: הַכֹּל
  choice: tout cela
  rationale: L’expression reprend l’ensemble des portions mentionnées dans le contexte précédent.
- source_word: עַל כַּפֵּי
  choice: sur les paumes de
  rationale: כַּף désigne concrètement la paume, et non simplement la main au sens large; cette précision convient au dépôt rituel des portions.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Forme française traditionnelle du nom propre.
- source_word: בָנָיו
  choice: ses fils
  rationale: Dans ce contexte d’ordination sacerdotale, בנים désigne précisément les fils d’Aaron.
- source_word: וְהֵנַפְתָּ אֹתָם תְּנוּפָה
  choice: tu leur feras accomplir le geste de présentation
  rationale: La construction associe le hiphil de נוף, le pronom objet pluriel et le nom תְּנוּפָה. Cette formulation exprime l’action rituelle imposée aux portions sans suggérer nécessairement un simple mouvement vague de la main.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי signifie ici «devant» ou «en présence de». Le tétragramme est rendu par la translittération Yahweh, conformément à la couche de consultation fournie.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme. «Yahweh» préserve le caractère de nom propre sans substituer un titre.
- issue: Nature du geste désigné par נוף / תְּנוּפָה
  choice: geste de présentation
  alternative: offrande balancée
  rationale: Le terme désigne un rite de présentation comportant un mouvement, dont la forme exacte n’est pas explicitée dans ce verset. «Geste de présentation» conserve la fonction cultuelle tout en évitant de préciser indûment le mouvement.
translation_notes:
  register: Français international moderne, clair et digne. Le futur injonctif convient à la suite des prescriptions. La répétition «sur les paumes» est évitée par «sur celles» pour une lecture naturelle, et le vocabulaire cultuel reste compréhensible sans effacer l’ambiguïté du geste rituel.
