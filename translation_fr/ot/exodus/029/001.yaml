  text: וְ/זֶ֨ה הַ/דָּבָ֜ר אֲשֶֽׁר תַּעֲשֶׂ֥ה לָ/הֶ֛ם לְ/קַדֵּ֥שׁ אֹתָ֖/ם לְ/כַהֵ֣ן לִ֑/י לְ֠קַח פַּ֣ר אֶחָ֧ד בֶּן בָּקָ֛ר וְ/אֵילִ֥ם שְׁנַ֖יִם תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/001.yaml
  text: 'And this is the thing that you shall do for them to consecrate them to serve as priests for me: take one bull from the herd and two unblemished rams[a][b].'
translation:
  language: fr
  text: 'Voici ce que tu feras pour les consacrer afin qu’ils exercent le sacerdoce à mon service : prends un taureau du troupeau[a] et deux béliers sans défaut[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un jeune taureau ». L’hébreu dit littéralement « un taureau, fils du gros bétail », expression désignant un bovin provenant du troupeau.
    reason: lexical_alternative
  - marker: b
    text: Ou « sans imperfection ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: ce que
  rationale: Dans cette formule introductive, « voici ce que tu feras » rend naturellement le sens concret de דָּבָר sans le calque peu idiomatique « voici la chose ».
- source_word: תַּעֲשֶׂה
  choice: tu feras
  rationale: L’inaccompli a ici une valeur prescriptive. Le futur français conserve la force solennelle de l’instruction.
- source_word: לְקַדֵּשׁ
  choice: consacrer
  rationale: Dans ce contexte sacerdotal, le verbe désigne la mise à part en vue du service sacré; « consacrer » est précis et courant.
- source_word: לְכַהֵן לִי
  choice: exercer pour moi la fonction de prêtres
  rationale: Cette formulation exprime l’exercice effectif de la prêtrise et conserve le complément « pour moi », sans ajouter l’idée d’une institution ecclésiastique ultérieure.
- source_word: לְקַח
  choice: prends
  rationale: L’impératif hébreu est rendu directement par l’impératif français.
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: un taureau du troupeau
  rationale: La formulation rend l’idiome bovin בֶּן־בָּקָר sans le calque obscur « fils du gros bétail »; la possibilité d’un jeune taureau est signalée en note.
- source_word: אֵילִם שְׁנַיִם
  choice: deux béliers
  rationale: Traduction directe et naturelle du nom avec le nombre explicite.
- source_word: תְּמִימִם
  choice: sans défaut
  rationale: Dans le vocabulaire sacrificiel, le terme indique l’absence de défaut physique. « Sans défaut » est clair et évite que « parfaits » suggère une perfection abstraite.
theological_decisions:
- issue: Fonction sacerdotale
  choice: afin qu’ils exercent pour moi la fonction de prêtres
  alternative: afin qu’ils me servent comme prêtres
  rationale: Le choix maintient la valeur fonctionnelle du verbe כהן et la relation exprimée par « pour moi », sans développer une théologie du ministère qui dépasserait le texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse divine singulière à Moïse. La tournure introductive est idiomatique, tandis que le vocabulaire de consécration et de prêtrise conserve le registre cultuel du passage.
