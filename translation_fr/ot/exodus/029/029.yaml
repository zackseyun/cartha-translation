review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : les vêtements sacrés passent aux fils d’Aaron pour leur onction et leur investiture sacerdotale. Toutefois, « afin qu’ils les portent pour recevoir l’onction » transforme la relation de בָּהֶם (« en les portant ») en une subordonnée plus lourde et ne rattache pas avec la même clarté cette circonstance aux deux actions, l’onction et l’investiture. La note dite littérale ajoute aussi « en les leur faisant porter », qui n’est pas exprimé littéralement par l’hébreu.'
  naturalness: « Reviendront à ses fils après lui » est naturel dans un registre biblique moderne. Une formulation avec « Ils serviront à… lorsqu’ils les porteront » est plus fluide, tout en évitant l’ambiguïté peu idiomatique de « oindre en eux ».
  terminology: « Vêtements sacrés » convient à בִּגְדֵי הַקֹּדֶשׁ. « Investir de leur fonction » rend sobrement l’idiome sacerdotal « remplir leur main » sans imposer un vocabulaire ecclésiastique ultérieur. La note conserve l’image hébraïque et explique sa portée technique.
  issues:
