- from: Les vêtements sacrés d’Aaron reviendront à ses fils après lui, afin qu’ils les portent pour recevoir l’onction et pour être établis dans leur fonction[a].
  to: Les vêtements sacrés d’Aaron reviendront à ses fils après lui. Ils serviront à les oindre lorsqu’ils les porteront et à les investir de leur fonction lorsqu’ils les porteront[a].
  rationale: La révision conserve la transmission des vêtements aux fils d’Aaron et rend explicitement, en français naturel, que l’onction comme l’investiture ont lieu lorsque ces vêtements sont portés. Elle corrige la note afin que seule la formulation réellement littérale soit donnée comme telle, tout en expliquant l’idiome sacerdotal.
