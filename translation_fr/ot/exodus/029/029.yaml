    rationale: « en les leur faisant porter » explicite de façon recevable la valeur circonstancielle de בָּהֶם, mais ne correspond pas littéralement aux mots hébreux ; elle ne doit donc pas figurer dans la citation littérale.
  - severity: low
    issue: La circonstance « en les portant » n’est explicitement rattachée qu’à l’onction dans le texte courant.
    rationale: Le pronom בָּהֶם accompagne aussi « remplir leur main » ; une formulation parallèle rend mieux la structure et le sens du verset.
