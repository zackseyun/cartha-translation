base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/029.yaml
  text: And the holy garments that are Aaron’s shall belong to his sons after him[a], for anointing in them and for ordaining them in them.
translation:
  language: fr
  text: Les vêtements sacrés d’Aaron reviendront à ses fils après lui. Ils serviront à les oindre lorsqu’ils les porteront et à les investir de leur fonction lorsqu’ils les porteront[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « pour les oindre en eux et pour remplir leur main en eux ». « Remplir la main » est une expression hébraïque désignant l’installation ou l’investiture dans la fonction sacerdotale.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִגְדֵי הַקֹּדֶשׁ
  choice: les vêtements sacrés
  rationale: L’expression désigne des vêtements mis à part pour le service cultuel. « Vêtements sacrés » est naturel en français moderne et garde cette valeur.
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: d’Aaron
  rationale: Le ל exprime ici l’appartenance ou l’attribution; le complément du nom est la formulation française la plus concise.
- source_word: יִהְיוּ לְבָנָיו אַחֲרָיו
  choice: reviendront à ses fils après lui
  rationale: La proposition exprime la transmission des vêtements aux fils d’Aaron qui lui succéderont. « Reviendront à » rend cette attribution sans suggérer nécessairement un héritage privé.
- source_word: לְמָשְׁחָה בָהֶם
  choice: afin qu’ils les portent pour recevoir l’onction
  rationale: Le ב indique vraisemblablement que les fils portent ces vêtements au moment de leur onction, et non que les vêtements servent d’instrument. L’explicitation évite l’ambiguïté peu naturelle de « être oints en eux ».
- source_word: וּלְמַלֵּא בָם אֶת יָדָם
  choice: et pour être établis dans leur fonction
  rationale: L’expression « remplir la main » est un idiome technique d’installation sacerdotale. La traduction fonctionnelle est claire en français, tandis que l’image hébraïque est conservée en note.
theological_decisions:
- issue: Traduction de l’idiome sacerdotal מִלֵּא אֶת־הַיָּד (« remplir la main »)
  choice: être établis dans leur fonction
  alternative: recevoir l’investiture; être consacrés; littéralement « avoir la main remplie »
  rationale: Une traduction littérale serait obscure en français. « Être établis dans leur fonction » communique l’installation sacerdotale sans importer les associations ecclésiastiques plus tardives que peut porter « ordonner ». La note préserve l’expression source et ses principales valeurs possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase explicite que les vêtements sont portés lors de l’onction et de l’installation, ce que le pronom hébreu בָהֶם exprime de manière plus compacte.
