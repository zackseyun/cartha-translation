revisions:
- from: Puis tu les prendras de leurs mains et tu les feras fumer sur l’autel, par-dessus l’holocauste, comme un parfum agréable devant Yahweh. C’est un sacrifice consumé par le feu pour Yahweh.
  to: Puis tu les prendras de leurs mains et tu les feras monter en fumée sur l’autel, sur l’holocauste, en parfum agréable devant Yahweh. C’est une offrande par le feu[a] pour Yahweh.
  rationale: La révision remplace deux formulations françaises imprécises ou peu naturelles par des équivalents cultuels clairs, tout en conservant l’ordre rituel, les images du texte et son ambiguïté lexicale à propos d’אִשֶּׁה. La note est ancrée directement sur le terme concerné.
