review_pass:
  verdict: revise
  source_fidelity: Le projet rend correctement la séquence injonctive, la reprise des portions des mains des prêtres, la superposition sur l’holocauste et la double mention de Yahweh. Toutefois, « tu les feras fumer » est peu idiomatique et ne rend pas clairement l’acte cultuel de faire monter l’offrande en fumée. « Sacrifice consumé par le feu » peut aussi suggérer que l’ensemble du sacrifice est entièrement brûlé, nuance qui n’est pas portée par אִשֶּׁה.
  naturalness: Le tutoiement et le futur injonctif conviennent. « Tu les feras monter en fumée » est une formulation française plus naturelle et précise dans un contexte sacrificiel. « Sur l’holocauste » exprime directement la superposition; « en parfum agréable » conserve la formule rituelle sans la tourner en comparaison.
  terminology: « Holocauste » est le terme usuel pour עֹלָה. Le nom Yahweh est conservé de façon cohérente. Pour אִשֶּׁה, « offrande par le feu » est plus sobre et plus fidèle que « sacrifice consumé par le feu »; une note signale l’alternative traditionnelle et la discussion lexicale.
  issues:
  - severity: medium
    issue: « tu les feras fumer »
    rationale: Cette tournure est inhabituelle en français moderne et peut faire comprendre que les objets eux-mêmes fument, plutôt que l’acte rituel de les offrir en les faisant monter en fumée.
  - severity: medium
    issue: « sacrifice consumé par le feu » pour אִשֶּׁה
    rationale: Le rendu ajoute l’idée de consommation complète et transforme le terme générique d’offrande en « sacrifice ». « Offrande par le feu » maintient le lien au feu sans cette précision non exprimée.
  - severity: low
    issue: « par-dessus l’holocauste » et « comme un parfum agréable »
    rationale: Ces expressions sont compréhensibles, mais « sur l’holocauste » et « en parfum agréable » sont plus directs et correspondent mieux aux relations cultuelles exprimées par עַל et לְ.
  revised_text: Puis tu les prendras de leurs mains et tu les feras monter en fumée sur l’autel, sur l’holocauste, en parfum agréable devant Yahweh. C’est une offrande par le feu[a] pour Yahweh.
  revised_footnotes:
