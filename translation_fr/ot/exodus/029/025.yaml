base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/025.yaml
  text: Then you shall take them from their hands and burn them on the altar[a], on top of the burnt offering, as a pleasing aroma before Yahweh. It is an offering made by fire to Yahweh.
translation:
  language: fr
  text: Puis tu les prendras de leurs mains et tu les feras monter en fumée sur l’autel, sur l’holocauste, en parfum agréable devant Yahweh. C’est une offrande par le feu[a] pour Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une offrande faite par le feu ». Le sens précis du terme hébreu est discuté.
    reason: L’expression hébraïque אִשֶּׁה est un terme sacrificiel technique; la note préserve une traduction traditionnelle et signale l’incertitude lexicale sans imposer une interprétation.
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Puis tu les prendras
  rationale: Le parfait qal avec waw poursuit la séquence d’instructions; le futur français exprime naturellement l’ordre rituel, et « puis » marque la progression.
- source_word: מִיָּדָם
  choice: de leurs mains
  rationale: Traduction concrète et directe du geste rituel.
- source_word: וְהִקְטַרְתָּ
  choice: tu les feras fumer
  rationale: Le hiphil de קטר désigne ici le fait de faire monter en fumée une offrande sur l’autel; cette formulation conserve mieux la nuance sacrificielle que le simple verbe « brûler ».
- source_word: הַמִּזְבֵּחָה
  choice: sur l’autel
  rationale: Le hé directionnel, avec ce verbe sacrificiel, indique que les éléments sont placés et consumés sur l’autel.
- source_word: עַל הָעֹלָה
  choice: par-dessus l’holocauste
  rationale: עַל exprime la superposition; « holocauste » est le terme français courant pour l’offrande entièrement brûlée.
- source_word: לְרֵיחַ נִיחוֹחַ
  choice: comme un parfum agréable
  rationale: La formule sacrificielle évoque une odeur qui agrée à Dieu; « parfum agréable » préserve l’image sans archaïsme.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי signifie « devant, en présence de »; le nom divin est translittéré afin de conserver le nom propre du texte hébreu.
- source_word: אִשֶּׁה
  choice: sacrifice consumé par le feu
  rationale: Le terme sacerdotal désigne une offrande présentée au moyen du feu. Cette traduction conserve son lien lexical probable avec le feu sans introduire ici l’interprétation plus spécifique de « nourriture offerte ».
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: Le lamed marque ici le destinataire et la consécration du sacrifice; « pour » est idiomatique en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » maintient le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Sens du terme sacrificiel אִשֶּׁה
  choice: sacrifice consumé par le feu
  alternative: offrande faite par le feu; nourriture offerte
  rationale: L’étymologie et l’emploi précis du terme sont discutés. Le rendu choisi garde le rapport manifeste au rite du feu dans ce contexte, sans imposer l’imagerie de la nourriture.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier correspond à l’adresse faite à Moïse. La formulation conserve la succession procédurale et l’imagerie sacrificielle du texte hébreu.
