  text: וְ/אֶת בְּשַׂ֤ר הַ/פָּר֙ וְ/אֶת עֹר֣/וֹ וְ/אֶת פִּרְשׁ֔/וֹ תִּשְׂרֹ֣ף בָּ/אֵ֔שׁ מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה חַטָּ֖את הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/014.yaml
  text: But the flesh of the bull[a], and its hide, and its dung, you shall burn with fire outside the camp; it is a sin offering.
translation:
  language: fr
  text: Mais tu brûleras au feu, à l’extérieur du camp, la chair du taureau, sa peau et ses excréments. C’est un sacrifice pour le péché[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification ». Le mot hébreu חַטָּאת peut désigner le péché ou le sacrifice offert en rapport avec le péché. Dans un contexte sacrificiel comme celui-ci, il est souvent traduit par « sacrifice pour le péché »; « sacrifice de purification » met davantage en valeur la fonction purificatrice du rite.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׂר הַפָּר
  choice: la chair du taureau
  rationale: « Chair » conserve le sens corporel concret de בְּשַׂר dans ce contexte sacrificiel, tandis que « taureau » rend naturellement פַּר sans imposer l’idée d’un âge précis.
- source_word: עֹרוֹ
  choice: sa peau
  rationale: En français courant, « peau » est le terme naturel pour l’enveloppe corporelle de l’animal; « cuir » désignerait plutôt une peau déjà traitée.
- source_word: פִּרְשׁוֹ
  choice: ses excréments
  rationale: פֶּרֶשׁ désigne les matières fécales. « Excréments » en donne le sens exact sans le confondre avec les entrailles ou les déchets de boucherie.
- source_word: תִּשְׂרֹף בָּאֵשׁ
  choice: tu brûleras au feu
  rationale: Le futur français exprime ici l’instruction, et « au feu » rend de manière idiomatique le moyen indiqué par בְּ.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: à l’extérieur du camp
  rationale: Formulation française claire et usuelle pour le lieu situé au-delà des limites du camp.
- source_word: חַטָּאת
  choice: sacrifice pour le péché
  rationale: Dans ce contexte rituel, le mot désigne le sacrifice lié au péché plutôt que le péché abstrait. Cette formulation reste compréhensible et conserve le lien lexical avec le péché.
- source_word: הוּא
  choice: C’est
  rationale: La tournure identifie naturellement en français l’animal et le rite comme un sacrifice pour le péché.
- source_word: וְאֶת ... וְאֶת ... וְאֶת
  choice: la chair du taureau, sa peau et ses excréments
  rationale: L’énumération complète est conservée dans un ordre naturel en français, sans reproduire mécaniquement chaque marqueur d’objet hébreu.
theological_decisions:
- issue: Sens de חַטָּאת dans la législation sacrificielle
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le contexte impose le sens sacrificiel. « Sacrifice pour le péché » maintient explicitement le rapport lexical au péché, tandis que la note signale l’analyse fonctionnelle possible comme rite de purification, sans trancher silencieusement la tension.
translation_notes:
  register: 'Français international moderne, sobre et digne. La syntaxe place le verbe avant l’énumération pour éviter une reprise pronominale lourde. « Mais » rend la valeur contrastive probable du waw: les parties mentionnées auparavant sont offertes sur l’autel, tandis que celles-ci doivent être brûlées hors du camp.'
