base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/027.yaml
  text: And you shall consecrate the breast of the wave offering and the thigh of the contribution[a], which was waved and which was raised, from the ram of ordination[b], from what was Aaron's and from what was his sons'.
translation:
  language: fr
  text: Tu consacreras la poitrine de l’offrande balancée et la cuisse du prélèvement[a] — la poitrine qui a été balancée et la cuisse qui a été élevée —, prises sur le bélier d’investiture[b], parmi les parts revenant à Aaron et à ses fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la cuisse de l’offrande élevée »; traditionnellement, « l’offrande par élévation ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « le bélier des remplissages », expression désignant le bélier employé pour l’investiture ou la consécration des prêtres.'
    reason: cultural_note
lexical_decisions:
- source_word: קִדַּשְׁתָּ
  choice: tu consacreras
  rationale: Le piel de קדשׁ signifie mettre à part comme saint. « Consacrer » est naturel en français moderne et convient au contexte rituel.
- source_word: חֲזֵה הַתְּנוּפָה
  choice: la poitrine de l’offrande balancée
  rationale: « Poitrine » désigne la portion anatomique sacrificielle; « offrande balancée » conserve le geste rituel concret et le lien avec הוּנַף.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: la cuisse du prélèvement
  rationale: « Cuisse » rend la portion supérieure de la patte; « prélèvement » exprime une part retirée et mise à part comme contribution cultuelle sans employer l’archaïque « offrande élevée » dans le texte.
- source_word: הוּנַף וַאֲשֶׁר הוּרָם
  choice: la poitrine qui a été balancée et la cuisse qui a été prélevée
  rationale: La reformulation explicite en français l’association naturelle de chaque geste à la portion correspondante, tout en conservant les deux passifs rituels.
- source_word: אֵיל הַמִּלֻּאִים
  choice: le bélier d’investiture
  rationale: L’expression désigne le bélier employé lors de l’entrée en fonction des prêtres. « Investiture » rend clairement cette installation cultuelle.
- source_word: מֵאֲשֶׁר לְאַהֲרֹן וּמֵאֲשֶׁר לְבָנָיו
  choice: sur la part qui revenait à Aaron et sur celle qui revenait à ses fils
  rationale: Cette formulation idiomatique maintient la distinction distributive entre la part d’Aaron et celle de ses fils sans préciser davantage la nature de leur droit.
theological_decisions:
- issue: Rendu des termes techniques du rituel sacrificiel
  choice: Conserver les gestes concrets de balancement et de prélèvement ainsi que la catégorie d’offrande.
  alternative: Employer des expressions générales comme « offrande de présentation » ou « portion consacrée ».
  rationale: Le texte législatif met en rapport les noms rituels et les verbes correspondants. Maintenir cette matérialité évite de réduire les gestes à une dédicace générique.
- issue: Répartition entre Aaron et ses fils
  choice: Parler de la part qui revenait à chacun.
  alternative: Traduire littéralement « de ce qui était à Aaron et de ce qui était à ses fils ».
  rationale: « Revenait à » exprime naturellement la destination ou l’attribution des portions sans trancher plus précisément la nature théologique ou juridique de cette possession.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur à valeur prescriptive rend l’instruction hébraïque. La reprise explicite de « la poitrine » et de « la cuisse » évite une relative française ambiguë et préserve la correspondance entre chaque portion et son geste rituel.
