revisions:
- from: Tu consacreras la poitrine de l’offrande balancée et la cuisse du prélèvement[a] — la poitrine qui a été balancée et la cuisse qui a été prélevée —, prises sur le bélier d’investiture[b], sur la part qui revenait à Aaron et sur celle qui revenait à ses fils.
  to: Tu consacreras la poitrine de l’offrande balancée et la cuisse du prélèvement[a] — la poitrine qui a été balancée et la cuisse qui a été élevée —, prises sur le bélier d’investiture[b], parmi les parts revenant à Aaron et à ses fils.
  rationale: La correction rétablit le sens de « élevée » pour הוּרָם et remplace une articulation française fautive par une formulation qui conserve la provenance des portions et leur attribution à Aaron et à ses fils. Elle ne modifie ni le sens rituel ni l’ambiguïté inhérente à la formulation hébraïque au-delà de l’explicitation déjà présente dans le projet.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:22:43Z'
review_pass:
  verdict: revise
  source_fidelity: Le projet rend correctement les termes principaux et le sens distributif final. Toutefois, « prélevée » ne traduit pas הוּרָם (« élevée »), et la construction « prises sur ... sur la part » est syntaxiquement et sémantiquement défectueuse. La reprise explicite des deux portions peut être conservée, car elle clarifie en français l’association rituelle normalement comprise dans l’hébreu.
  naturalness: « Poitrine », « offrande balancée », « cuisse », « prélèvement » et « bélier d’investiture » relèvent d’un registre moderne, clair et convenable pour une législation cultuelle. La révision rend la phrase fluide sans effacer les gestes rituels.
  terminology: « Consacreras », « offrande balancée », « prélèvement », « élevée » et « investiture » maintiennent les liens lexicaux du texte hébreu. « Élevée » est nécessaire pour conserver le lien entre תְּרוּמָה et הוּרָם. Aaron est correctement nommé sans accent.
  issues:
  - severity: high
    issue: Le second geste rituel est rendu par « la cuisse qui a été prélevée ».
    rationale: הוּרָם est le passif de « élever / lever haut », non de « prélever ». Le prélèvement rend convenablement le nom תְּרוּמָה, mais le verbe doit conserver le geste d’élévation.
  - severity: medium
    issue: La séquence « prises sur le bélier d’investiture, sur la part qui revenait... » est mal construite.
    rationale: Les deux occurrences de « sur » ne rendent pas naturellement les deux מן hébreux et font des « parts » le lieu matériel du prélèvement. « Parmi les parts revenant à... » exprime clairement la provenance et l’attribution.
  - severity: low
    issue: La note a qualifie « la cuisse du prélèvement sacré » de formulation traditionnelle alors que le texte emploie déjà « prélèvement ».
    rationale: La note est plus cohérente en donnant comme alternative « offrande élevée » et en réservant la mention traditionnelle à « offrande par élévation ».
  revised_text: Tu consacreras la poitrine de l’offrande balancée et la cuisse du prélèvement[a] — la poitrine qui a été balancée et la cuisse qui a été élevée —, prises sur le bélier d’investiture[b], parmi les parts revenant à Aaron et à ses fils.
