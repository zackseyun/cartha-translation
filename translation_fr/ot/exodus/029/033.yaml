base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/033.yaml
  text: They shall eat those things by which atonement was made[a], to ordain them and to consecrate them; but an outsider shall not eat them[c][b], because they are holy.
translation:
  language: fr
  text: Ils mangeront les aliments qui ont servi à faire l’expiation[a], pour les investir de leur fonction[b] et les consacrer. Mais aucune personne non autorisée[c] n’en mangera, car ils sont saints.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les aliments au moyen desquels l’expiation a été faite ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « remplir leur main », expression hébraïque désignant ici l’installation dans la fonction sacerdotale.'
    reason: lexical_alternative
  - marker: c
    text: Il s’agit d’une personne qui n’est pas autorisée à participer au rite sacerdotal, et non nécessairement d’un étranger par son origine.
    reason: cultural_note
lexical_decisions:
- source_word: וְאָכְלוּ אֹתָם
  choice: Ils mangeront les aliments
  rationale: Le pronom renvoie aux portions sacrificielles du contexte précédent. « Les aliments » explicite naturellement ce référent sans ajouter une catégorie étrangère au texte.
- source_word: אֲשֶׁר כֻּפַּר בָּהֶם
  choice: au moyen desquels l’expiation a été accomplie
  rationale: Le passif de כפר avec ב présente ici les aliments comme le moyen rituel. « Expiation » conserve la portée sacrificielle du terme sans ajouter un bénéficiaire que la proposition hébraïque n’énonce pas explicitement.
- source_word: לְמַלֵּא אֶת יָדָם
  choice: afin de les établir dans leur fonction
  rationale: Littéralement « remplir leur main », l’expression est un idiome technique désignant l’installation des prêtres. La formulation choisie communique ce sens sans évoquer une forme confessionnelle particulière d’ordination.
- source_word: לְקַדֵּשׁ אֹתָם
  choice: et de les consacrer
  rationale: Dans ce contexte sacerdotal, קדשׁ signifie mettre à part pour un service saint. « Consacrer » est précis, courant et digne.
- source_word: וְזָר לֹא יֹאכַל
  choice: Mais aucune personne non autorisée n’en mangera
  rationale: זר désigne ici une personne extérieure au groupe habilité à participer au rite, et non nécessairement un étranger ethnique. « N’en mangera » reprend clairement les aliments mentionnés.
- source_word: כִּי קֹדֶשׁ הֵם
  choice: car ils sont saints
  rationale: La proposition donne la raison cultuelle de l’interdiction. « Saints » maintient le vocabulaire biblique de la mise à part pour Dieu.
theological_decisions:
- issue: Sens de כפר dans le rite sacrificiel
  choice: l’expiation a été accomplie
  alternative: le rite d’expiation a été accompli ; la réconciliation a été accomplie
  rationale: « Expiation » rend directement la dimension sacrificielle de כפר tout en laissant ouverte la portée exacte du rite. Le texte hébreu indique ici le moyen par בָּהֶם, mais n’exprime pas explicitement « pour eux » dans cette proposition.
- issue: Interprétation de l’idiome sacerdotal מִלֵּא יָד
  choice: les établir dans leur fonction
  alternative: les ordonner ; remplir leur main
  rationale: L’expression concerne l’installation dans la charge sacerdotale. La traduction fonctionnelle évite un littéralisme obscur et n’importe pas les structures d’une tradition ecclésiale ultérieure.
- issue: Portée de זָר
  choice: personne non autorisée
  alternative: profane ; étranger ; personne extérieure au sacerdoce
  rationale: Dans la législation cultuelle, le terme marque l’absence d’habilitation rituelle plutôt qu’une origine ethnique étrangère.
translation_notes:
  register: Français international moderne, clair et soutenu. Le futur conserve la valeur prescriptive de l’instruction rituelle. Les termes « expiation », « consacrer » et « saints » maintiennent le registre cultuel, tandis que l’idiome sacerdotal est rendu de façon intelligible et accompagné d’une note littérale.
