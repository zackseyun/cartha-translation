  text: אֶת הַ/כֶּ֥בֶשׂ הָ/אֶחָ֖ד תַּעֲשֶׂ֣ה בַ/בֹּ֑קֶר וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֥ין הָ/עַרְבָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/039.yaml
  text: You shall offer the one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: fr
  text: Tu offriras l’un des agneaux le matin, et le second, tu l’offriras entre les deux soirs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « entre les deux soirs ». Cette expression traditionnelle est souvent comprise comme désignant le crépuscule ou la période comprise entre la fin de l’après-midi et le coucher du soleil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּבֶשׂ
  choice: agneau
  rationale: Dans un contexte sacrificiel, כֶּבֶשׂ désigne couramment un jeune mouton destiné à être offert. « Agneau » est ici le terme français le plus naturel et précis.
- source_word: הָאֶחָד
  choice: l’un des agneaux
  rationale: L’hébreu dit littéralement « l’un » ou « celui qui est un ». Avec les deux agneaux mentionnés dans le contexte, « l’un des agneaux » préserve cette formulation sans la transformer explicitement en ordinal.
- source_word: תַּעֲשֶׂה
  choice: tu offriras
  rationale: Bien que עשה signifie fondamentalement « faire », le verbe désigne ici l’accomplissement d’un sacrifice. « Offrir » exprime clairement et naturellement cette valeur cultuelle.
- source_word: בַבֹּקֶר
  choice: le matin
  rationale: Rendu temporel courant, idiomatique et précis en français.
- source_word: הַשֵּׁנִי
  choice: le second
  rationale: Rend directement l’adjectif ordinal et marque la distinction entre les deux offrandes quotidiennes.
- source_word: בֵּין הָעַרְבָּיִם
  choice: entre les deux soirs
  rationale: Ce rendu conserve la formulation hébraïque traditionnelle et son ambiguïté, tandis que la note en indique les compréhensions temporelles courantes.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La répétition de « tu offriras » reflète celle de l’hébreu, tandis que la dislocation « le second, tu l’offriras » reste naturelle en français. Le marqueur de note est placé après l’expression qu’il explique.
