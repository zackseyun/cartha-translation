  text: וְ/לָקַחְתָּ֞ מִן הַ/דָּ֨ם אֲשֶׁ֥ר עַֽל הַ/מִּזְבֵּחַ֮ וּ/מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָה֒ וְ/הִזֵּיתָ֤ עַֽל אַהֲרֹן֙ וְ/עַל בְּגָדָ֔י/ו וְ/עַל בָּנָ֛י/ו וְ/עַל בִּגְדֵ֥י בָנָ֖י/ו אִתּ֑/וֹ וְ/קָדַ֥שׁ הוּא֙ וּ/בְגָדָ֔י/ו וּ/בָנָ֛י/ו וּ/בִגְדֵ֥י בָנָ֖י/ו אִתּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/021.yaml
  text: Then you shall take some of the blood that is on the altar and some of the anointing oil[a], and sprinkle it on Aaron and on his garments and on his sons and on the garments of his sons with him; and he and his garments shall be holy, and his sons and the garments of his sons with him.
translation:
  language: fr
  text: Tu prendras du sang qui est sur l’autel et de l’huile d’onction, et tu en aspergeras Aaron, ses vêtements, ses fils et les vêtements de ses fils avec lui. Ainsi, il sera saint, de même que ses vêtements, ses fils et les vêtements de ses fils avec lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il sera consacré, ainsi que ses vêtements, ses fils et les vêtements de ses fils avec lui ». L’hébreu dit littéralement « il sera saint » et exprime l’état de sainteté résultant du rite.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Tu prendras
  rationale: Le qatal précédé de וְ poursuit ici une série d’instructions rituelles; le futur français exprime naturellement cette prescription.
- source_word: מִן הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: du sang qui est sur l’autel
  rationale: מִן indique qu’une partie du sang est prélevée; le partitif « du » le rend naturellement, tandis que la relative est conservée.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: l’huile d’onction
  rationale: Expression française courante et précise pour l’huile servant à l’onction, sans ajouter de nuance étrangère au construit hébreu.
- source_word: וְהִזֵּיתָ
  choice: tu en aspergeras
  rationale: Le hiphil de נזה désigne l’aspersion rituelle. Le pronom « en » reprend ensemble le sang et l’huile sans laisser croire que seul le dernier élément est aspergé.
- source_word: בְּגָדָיו / בִּגְדֵי בָנָיו
  choice: ses vêtements / les vêtements de ses fils
  rationale: « Vêtements » traduit le terme général בגד et convient au contexte sacerdotal sans importer un vocabulaire ecclésiastique ultérieur.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le masculin pluriel désigne ici les fils d’Aaron associés à la prêtrise.
- source_word: אִתּוֹ
  choice: avec lui
  rationale: Traduction directe qui maintient l’association des fils d’Aaron avec Aaron dans l’action et son résultat.
- source_word: וְקָדַשׁ
  choice: sera saint
  rationale: Le verbe exprime l’état de sainteté résultant du rite. « Sera saint » préserve le lexique propre au texte plutôt que de le remplacer dans le corps du verset par le terme plus interprétatif « sera consacré ».
- source_word: הוּא
  choice: il
  rationale: Le pronom reprend clairement Aaron et conserve la structure hébraïque.
theological_decisions:
- issue: Effet sanctifiant de l’aspersion de sang et d’huile
  choice: sera saint
  alternative: sera consacré
  rationale: Le texte formule le résultat du rite au moyen de la racine קדשׁ. La traduction principale maintient donc la catégorie de sainteté; la note signale la formulation fonctionnelle possible sans réduire la portée du terme.
translation_notes:
  register: Français moderne, international et digne. La répétition finale est maintenue afin de refléter l’insistance et la portée distributive de l’hébreu. « Ainsi » explicite sobrement la relation de résultat portée par la séquence verbale.
