  yaml_path: translation/ot/exodus/029/011.yaml
  text: You shall slaughter the bull before Yahweh at the entrance of the tent of meeting[a].
translation:
  language: fr
  text: Tu égorgeras le taureau devant Yahweh, à l’entrée de la tente de la Rencontre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH », rendu ici par « Yahweh » ; traditionnellement rendu par « le SEIGNEUR ». Autre forme : « Jéhovah ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁחַטְתָּ
  choice: Tu égorgeras
  rationale: Le qatal précédé de וְ poursuit ici une série d’instructions rituelles et prend une valeur prescriptive. « Égorg­er » exprime précisément l’abattage sacrificiel.
- source_word: הַפָּר
  choice: le taureau
  rationale: פַּר désigne couramment un taureau dans les textes sacrificiels; rien dans ce verset seul n’impose d’ajouter « jeune ».
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי signifie littéralement « devant, en présence de »; « devant » conserve la formulation spatiale et cultuelle concise de l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu par sa translittération usuelle afin de préserver le nom propre présent dans le texte hébreu.
- source_word: פֶּתַח
  choice: à l’entrée
  rationale: פֶּתַח désigne l’ouverture ou l’entrée; cette expression est naturelle en français pour indiquer le lieu du rite.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la Rencontre
  rationale: Cette désignation traditionnelle et intelligible rend le lieu où Dieu rencontre son peuple; la majuscule à « Rencontre » signale qu’il s’agit du nom cultuel de la tente.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le caractère de nom propre sans le remplacer silencieusement par un titre; la note indique les rendus traditionnels.
translation_notes:
  register: Français international moderne, sobre et digne. Le futur simple garde la force prescriptive de l’instruction rituelle. La syntaxe reste proche de l’hébreu tout en étant naturelle en français.
