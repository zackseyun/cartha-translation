source:
  edition: WLC
  text: וְ/שַׂמְתָּ֥ הַ/מִּצְנֶ֖פֶת עַל רֹאשׁ֑/וֹ וְ/נָתַתָּ֛ אֶת נֵ֥זֶר הַ/קֹּ֖דֶשׁ עַל הַ/מִּצְנָֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/006.yaml
  text: And you shall place the turban on his head[a], and put the holy diadem on the turban.
translation:
  language: fr
  text: Tu placeras le turban sur sa tête et tu poseras le diadème sacré sur le turban.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la couronne sacrée ». Le mot hébreu nézer peut désigner un insigne consacré en forme de couronne; « diadème » souligne ici l’ornement sacré fixé à la coiffure du grand prêtre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Tu placeras
  rationale: שׂים signifie « mettre, poser, placer ». Le futur français convient à la suite d’instructions rituelles et « placeras » garde un ton digne et naturel.
- source_word: הַמִּצְנֶפֶת
  choice: le turban
  rationale: מִצְנֶפֶת désigne la coiffure enveloppante du grand prêtre. « Turban » est clair en français moderne et évite les connotations ecclésiastiques de « mitre ».
- source_word: עַל רֹאשׁוֹ
  choice: sur sa tête
  rationale: Rend directement la relation spatiale exprimée par עַל, avec le suffixe masculin singulier de רֹאשׁוֹ.
- source_word: וְנָתַתָּ
  choice: et tu poseras
  rationale: נתן peut signifier « donner, mettre, poser ». Ici, il s’agit de positionner un objet sur le turban; « poseras » est naturel et évite de répéter « placeras ».
- source_word: אֵת
  choice: '[non traduit séparément]'
  rationale: Marqueur de l’objet direct défini, sans équivalent lexical autonome en français.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: le diadème sacré
  rationale: נֵזֶר désigne ici un insigne consacré, comparable à un diadème. הַקֹּדֶשׁ, littéralement « de la sainteté/du sacré », est rendu naturellement par l’adjectif « sacré ».
- source_word: עַל הַמִּצְנָפֶת
  choice: sur le turban
  rationale: La répétition de עַל est conservée afin d’indiquer explicitement que le diadème est placé sur la coiffure.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète l’adresse directe à Moïse. La formulation conserve la séquence cérémonielle et la répétition concrète du turban.
