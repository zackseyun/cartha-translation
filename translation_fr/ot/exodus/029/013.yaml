base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/013.yaml
  text: Then you shall take all the fat that covers the entrails[a], the lobe on the liver, the two kidneys, and the fat that is on them, and you shall burn them on the altar.
translation:
  language: fr
  text: Tu prendras toute la graisse qui recouvre les entrailles, la partie attenante au foie[a], les deux reins ainsi que la graisse qui se trouve sur eux, et tu feras brûler le tout sur l’autel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « le lobe du foie ». Le terme hébreu désigne une partie précise rattachée au foie, mais son identification anatomique exacte est incertaine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Tu prendras
  rationale: Dans cette suite d’instructions rituelles, le parfait précédé de la conjonction exprime l’action prescrite. Le futur français restitue naturellement cette valeur directive.
- source_word: כָּל הַחֵלֶב
  choice: toute la graisse
  rationale: חֵלֶב désigne ici les parties grasses de l’animal destinées au sacrifice. « Graisse » est précis, courant et immédiatement compréhensible.
- source_word: הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: qui recouvre les entrailles
  rationale: Dans ce contexte anatomique et sacrificiel, קֶרֶב renvoie aux parties internes de l’animal. « Entrailles » est concret et naturel en français.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: la partie attenante au foie
  rationale: Le terme יוֹתֶרֶת désigne une partie anatomique associée au foie, mais son identification exacte reste discutée. Cette formulation conserve le rapport exprimé par עַל sans imposer abusivement l’identification précise d’un lobe.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: les deux reins
  rationale: Équivalent anatomique direct et usuel de כְּלָיוֹת.
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵיהֶן
  choice: la graisse qui se trouve sur eux
  rationale: La formulation suit de près עֲלֵיהֶן et indique la graisse associée aux reins sans préciser davantage sa disposition.
- source_word: וְהִקְטַרְתָּ
  choice: tu feras brûler le tout
  rationale: Le hiphil de קטר désigne ici l’action de brûler ces parties comme offrande sur l’autel. « Feras brûler » exprime clairement l’acte rituel; « le tout » reprend naturellement l’ensemble des éléments énumérés.
- source_word: הַמִּזְבֵּחָה
  choice: sur l’autel
  rationale: Le ה directionnel indique le mouvement vers l’autel; dans cette instruction sacrificielle, « sur l’autel » est la tournure française naturelle.
