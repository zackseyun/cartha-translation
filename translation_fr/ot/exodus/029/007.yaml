  text: Then you shall take the anointing oil and pour it on his head and anoint him.
translation:
  language: fr
  text: Puis tu prendras l’huile d’onction, tu la verseras sur sa tête et tu l’oindras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Puis tu prendras
  rationale: Le parfait qal précédé de la conjonction poursuit la suite des instructions rituelles. « Puis » exprime naturellement cette progression, et le futur conserve la valeur directive en français.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: l’huile d’onction
  rationale: Cette tournure française idiomatique rend le syntagme construit « huile de l’onction » et maintient sa fonction consécratoire précise.
- source_word: וְיָצַקְתָּ
  choice: tu la verseras
  rationale: Le verbe יצק signifie ici « verser ». Le pronom « la » reprend clairement l’huile, et le futur coordonné conserve la forme de l’instruction.
- source_word: עַל רֹאשׁוֹ
  choice: sur sa tête
  rationale: Traduction directe et naturelle de la préposition et du nom muni du suffixe possessif.
- source_word: וּמָשַׁחְתָּ אֹתוֹ
  choice: et tu l’oindras
  rationale: Le verbe משׁח désigne explicitement l’action rituelle d’oindre. « Oindre » en préserve la portée concrète et consécratoire sans la paraphraser.
theological_decisions:
- issue: Rapport entre le versement de l’huile et l’onction
  choice: 'Conserver les deux actions distinctes : « tu la verseras sur sa tête et tu l’oindras »'
  alternative: 'Les fondre en une seule formulation explicative, par exemple : « tu l’oindras en versant l’huile sur sa tête »'
  rationale: L’hébreu emploie deux verbes coordonnés, l’un pour verser et l’autre pour oindre. Les maintenir évite de réduire l’une des actions à une simple explication de l’autre.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement correspond à l’adresse divine singulière à Moïse. « Oindre », terme moins courant mais précis, est retenu parce qu’il désigne directement le rite exprimé par l’hébreu.
