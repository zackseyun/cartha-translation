  text: וְ/לָֽקַחְתָּ֙ אֶת שֶׁ֣מֶן הַ/מִּשְׁחָ֔ה וְ/יָצַקְתָּ֖ עַל רֹאשׁ֑/וֹ וּ/מָשַׁחְתָּ֖ אֹתֽ/וֹ־־׃
