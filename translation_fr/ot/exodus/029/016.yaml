- source_word: וְזָרַקְתָּ
  choice: tu le projetteras
  rationale: זרק signifie fondamentalement « jeter, projeter ». « Projeter » exprime ici l’application énergique du sang contre l’autel sans ajouter une technique non explicitée.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: sur tout le pourtour de l’autel
  rationale: סביב indique une distribution tout autour de l’autel; cette tournure française rend clairement la portée spatiale de l’expression.
