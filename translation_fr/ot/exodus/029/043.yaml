  text: וְ/נֹעַדְתִּ֥י שָׁ֖מָּ/ה לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/נִקְדַּ֖שׁ בִּ/כְבֹדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/043.yaml
  text: There I will meet with the sons of Israel[b][a], and it will be sanctified by my glory.
translation:
  language: fr
  text: Là, je rencontrerai les fils d’Israël[a], et il sera sanctifié par ma gloire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites ». L’hébreu dit littéralement « les fils d’Israël », expression collective courante désignant le peuple d’Israël.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « et il sera sanctifié par ma gloire », sans préciser le sujet. Il peut s’agir globalement du lieu saint évoqué ici, ou plus précisément de la tente de la rencontre ou de l’autel.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנֹעַדְתִּי
  choice: je rencontrerai
  rationale: Le niphal de יעד désigne ici la rencontre fixée par Dieu dans le contexte du sanctuaire. « Je rencontrerai » rend naturellement l’idée sans ajouter celle d’une simple présence ou d’une révélation.
- source_word: שָׁמָּה
  choice: là
  rationale: Cet adverbe renvoie au lieu de la rencontre décrit dans le contexte immédiat.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Avec יעד, la préposition ל introduit les personnes rencontrées. « Les fils d’Israël » conserve l’expression covenantale hébraïque; « les Israélites » en est l’équivalent idiomatique.
- source_word: וְנִקְדַּשׁ
  choice: ce lieu sera sanctifié
  rationale: Le niphal de קדש exprime ici le fait d’être rendu saint. Comme le verbe masculin singulier n’a pas de sujet explicite, « ce lieu » reprend de manière générale l’espace cultuel en vue sans choisir entre la tente et l’autel.
- source_word: בִּכְבֹדִי
  choice: par ma gloire
  rationale: 'La préposition ב est comprise comme instrumentale: la gloire manifestée de Dieu est l’agent de la sanctification.'
theological_decisions:
- issue: Sujet implicite de וְנִקְדַּשׁ
  choice: « ce lieu » désigne globalement l’espace cultuel évoqué
  alternative: La tente de la rencontre, l’autel, ou éventuellement une autre réalité masculine singulière du contexte
  rationale: L’hébreu ne nomme pas le sujet du verbe. Le français exigeant normalement un sujet exprimé, « ce lieu » évite de trancher entre les principaux référents liés au sanctuaire; la note signale l’ambiguïté.
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites; le peuple d’Israël
  rationale: La formulation littérale préserve l’expression collective et covenantale de l’hébreu, tandis que la note fournit son sens idiomatique inclusif.
translation_notes:
  register: Français international moderne, sobre et digne. « Sanctifié » conserve le registre cultuel et le passif de l’hébreu. Les marqueurs de note suivent immédiatement les expressions qu’ils éclairent.
