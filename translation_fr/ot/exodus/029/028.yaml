source:
  edition: WLC
  text: וְ/הָיָה֩ לְ/אַהֲרֹ֨ן וּ/לְ/בָנָ֜י/ו לְ/חָק עוֹלָ֗ם מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּ֥י תְרוּמָ֖ה ה֑וּא וּ/תְרוּמָ֞ה יִהְיֶ֨ה מֵ/אֵ֤ת בְּנֵֽי יִשְׂרָאֵל֙ מִ/זִּבְחֵ֣י שַׁלְמֵי/הֶ֔ם תְּרוּמָתָ֖/ם לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/028.yaml
  text: It shall belong to Aaron and to his sons as a permanent statute from the Israelites[a], for it is a contribution; it shall be a contribution from the Israelites, from the sacrifices of their peace offerings, their contribution to Yahweh.
translation:
  language: fr
  text: 'Cela appartiendra à Aaron et à ses fils comme une part qui leur est due à perpétuité de la part des Israélites, car c’est une contribution. Ce sera une contribution de la part des Israélites, prélevée sur les sacrifices de communion[a] qu’ils offrent : leur contribution au Seigneur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi traduire « sacrifices de paix » ou « sacrifices de bien-être ». Le terme hébreu évoque la paix, l’intégrité et une relation restaurée.
    reason: Alternative lexicale permettant de préserver l’étendue sémantique de שְׁלָמִים.
lexical_decisions:
- source_word: וְהָיָה
  choice: Cela appartiendra
  rationale: Le verbe signifie littéralement « ce sera », mais, dans ce contexte juridique, il attribue la portion mentionnée à Aaron et à ses fils.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: à Aaron et à ses fils
  rationale: La préposition marque ici l’attribution ou la possession au bénéfice d’Aaron et de sa descendance sacerdotale.
- source_word: לְחָק עוֹלָם
  choice: selon une prescription permanente
  rationale: חָק désigne une règle ou une part prescrite, et עוֹלָם exprime ici la permanence de cette disposition cultuelle, sans imposer le sens philosophique d’une durée infinie.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: pour les Israélites
  rationale: Dans la première occurrence, la construction indique que cette prescription impose aux Israélites de remettre cette part aux prêtres. La formulation française explicite naturellement cette portée juridique.
- source_word: תְרוּמָה
  choice: contribution
  rationale: Le terme désigne une part prélevée, mise à part et présentée à Dieu. « Contribution » conserve ce sens général sans recourir à un terme cultuel archaïque ou trop technique.
- source_word: וּתְרוּמָה יִהְיֶה מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: Ce sera une contribution prélevée par les Israélites
  rationale: La répétition de « contribution » est maintenue, tandis que « prélevée par » rend clairement en français la provenance de la part consacrée.
- source_word: מִזִּבְחֵי שַׁלְמֵיהֶם
  choice: sur leurs sacrifices de paix
  rationale: La chaîne construite désigne les sacrifices appartenant à la catégorie des שְׁלָמִים. « Sacrifices de paix » conserve l’appellation traditionnelle et la notion de paix, tout en signalant en note l’étendue sémantique du terme.
- source_word: תְּרוּמָתָם
  choice: leur contribution
  rationale: Le suffixe renvoie aux Israélites comme auteurs de la contribution. La répétition du même nom préserve l’insistance du texte hébreu.
- source_word: לַיהוָה
  choice: au Seigneur
  rationale: Le nom divin YHWH est rendu par « le Seigneur », équivalent français de la tradition de lecture respectueuse représentée par « the LORD ».
theological_decisions:
- issue: Rendu du nom divin YHWH
  choice: le Seigneur
  alternative: Yahvé / YHWH
  rationale: « Le Seigneur » suit la tradition juive de lecture respectueuse et son prolongement dans la Septante, sans proposer une vocalisation reconstruite comme certaine.
- issue: Portée du terme cultuel שְׁלָמִים
  choice: sacrifices de paix
  alternative: sacrifices de communion / sacrifices de bien-être
  rationale: Le terme évoque la paix, l’intégrité et la relation restaurée. Le rendu principal conserve l’expression cultuelle reconnue, tandis que la note préserve les autres nuances possibles sans en privilégier une de façon doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe juridique reste perceptible sans être lourde. La répétition de « contribution », caractéristique du texte hébreu, est volontairement conservée.
