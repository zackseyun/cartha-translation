  naturalness: La formulation révisée demeure juridique et digne, mais elle est plus idiomatique et plus claire en français moderne. « Sacrifices de communion » est l'appellation cultuelle française la plus usuelle; les autres possibilités sont signalées en note.
  terminology: « Part qui leur est due à perpétuité » rend le sens de droit/part prescrite de חָק עוֹלָם sans transformer le terme en simple règlement imposé aux Israélites. « Contribution » maintient la répétition de תְּרוּמָה. « Le Seigneur » rend respectueusement le tétragramme, et « sacrifices de communion » rend שְׁלָמִים sans imposer une interprétation confessionnelle.
