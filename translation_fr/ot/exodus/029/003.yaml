  text: וְ/נָתַתָּ֤ אוֹתָ/ם֙ עַל סַ֣ל אֶחָ֔ד וְ/הִקְרַבְתָּ֥ אֹתָ֖/ם בַּ/סָּ֑ל וְ/אֶ֨ת הַ/פָּ֔ר וְ/אֵ֖ת שְׁנֵ֥י הָ/אֵילִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/003.yaml
  text: You shall put them into one basket[a], and you shall bring them near in the basket[b], along with the bull and the two rams.
translation:
  language: fr
  text: Tu les mettras dans une seule corbeille[a] et tu les présenteras dans la corbeille[b], avec le taureau et les deux béliers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur une seule corbeille ». La préposition hébraïque signifie littéralement « sur », mais, dans ce contexte où l’on place des aliments dans un contenant, le sens paraît être « dans ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les feras approcher » ou « les offriras ». Le verbe hébreu est le terme sacrificiel habituel qui signifie « faire approcher » ou « présenter ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Tu mettras
  rationale: Le verbe נתן signifie couramment « donner, mettre, placer ». Dans cette consigne rituelle, « mettre » est naturel et précis; le ו initial est rendu par l’enchaînement syntaxique français plutôt que par un « et » d’ouverture.
- source_word: אוֹתָם
  choice: les
  rationale: Le pronom objet masculin pluriel renvoie aux pains mentionnés au verset précédent; le pronom français « les » conserve ce renvoi sans répétition.
- source_word: עַל סַל אֶחָד
  choice: dans une seule corbeille
  rationale: Bien que עַל signifie souvent « sur », avec נתן et un contenant il désigne ici la mise dans la corbeille. « Une seule » fait ressortir naturellement l’unité exprimée par אֶחָד.
- source_word: וְהִקְרַבְתָּ
  choice: tu les présenteras
  rationale: À la forme causative et en contexte cultuel, קרב signifie « faire approcher, présenter, offrir ». « Présenter » reste naturel en français tout en évitant de préciser prématurément l’acte comme une offrande accomplie.
- source_word: בַּסָּל
  choice: dans la corbeille
  rationale: La préposition ב indique que les pains sont présentés alors qu’ils se trouvent dans la corbeille.
- source_word: וְאֶת הַפָּר וְאֵת שְׁנֵי הָאֵילִם
  choice: avec le taureau et les deux béliers
  rationale: Les marqueurs d’objet répétés ajoutent le taureau et les béliers aux éléments à présenter. « Avec » exprime clairement cette coordination en français.
- source_word: הַפָּר
  choice: le taureau
  rationale: פַּר désigne un taureau; l’article défini est conservé.
- source_word: שְׁנֵי הָאֵילִם
  choice: les deux béliers
  rationale: Le numéral à l’état construit suivi du nom défini se rend naturellement par « les deux béliers ».
theological_decisions:
- issue: Portée cultuelle de וְהִקְרַבְתָּ
  choice: présenteras
  alternative: feras approcher; offriras
  rationale: « Présenter » maintient la portée sacrificielle du verbe sans confondre l’acheminement rituel des pains et des animaux avec l’acte ultérieur de les offrir.
translation_notes:
  register: Français international moderne, digne et direct. Le futur à valeur injonctive convient au style des prescriptions. « Corbeille » rend סל dans un registre courant; la répétition de « corbeille » conserve l’image et la structure de l’hébreu.
