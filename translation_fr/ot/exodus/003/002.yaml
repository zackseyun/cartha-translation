  variant: modern international French
source:
  edition: WLC
  text: וַ֠/יֵּרָא מַלְאַ֨ךְ יְהֹוָ֥ה אֵלָ֛י/ו בְּ/לַבַּת אֵ֖שׁ מִ/תּ֣וֹךְ הַ/סְּנֶ֑ה וַ/יַּ֗רְא וְ/הִנֵּ֤ה הַ/סְּנֶה֙ בֹּעֵ֣ר בָּ/אֵ֔שׁ וְ/הַ/סְּנֶ֖ה אֵינֶ֥/נּוּ אֻכָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/002.yaml
  text: Then the angel of Yahweh appeared to him in a flame of fire from the midst of the bush. He looked[a], and behold, the bush was burning with fire, but the bush was not consumed.
translation:
  language: fr
  text: 'Alors l’ange de Yahweh[a] lui apparut dans une flamme de feu venant du milieu du buisson. Moïse regarda : le buisson était en feu, mais il ne se consumait pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le messager de Yahweh ». Le mot hébreu peut signifier « ange » ou « messager ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: apparut
  rationale: Le niphal de ראה exprime ici le fait de devenir visible; « apparut » est l’équivalent français naturel dans un récit de manifestation divine.
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאַךְ peut désigner un messager humain ou céleste. Dans ce contexte de manifestation divine, « ange » est naturel, tandis qu’une note conserve l’alternative lexicale « messager ».
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: La translittération rend explicitement le nom divin présent dans l’hébreu et évite de le remplacer par un titre.
- source_word: אֵלָיו
  choice: lui
  rationale: Le pronom renvoie à Moïse dans le contexte immédiat.
- source_word: בְּלַבַּת אֵשׁ
  choice: dans une flamme de feu
  rationale: Cette formulation conserve l’image et la construction hébraïques tout en restant idiomatique dans un registre biblique français.
- source_word: מִתּוֹךְ הַסְּנֶה
  choice: du milieu du buisson
  rationale: Rend directement l’idée spatiale de מִתּוֹךְ et le sens usuel de סְנֶה dans ce passage.
- source_word: וַיַּרְא
  choice: Moïse regarda
  rationale: « Regarda » exprime ici l’attention portée au phénomène. La reprise explicite de « Moïse » évite en français une succession ambiguë de pronoms entre l’ange et Moïse.
- source_word: וְהִנֵּה
  choice: ':'
  rationale: Les deux-points introduisent naturellement en français la constatation frappante signalée par הִנֵּה, sans recourir à l’archaïsme « voici » dans cette phrase.
- source_word: בֹּעֵר בָּאֵשׁ
  choice: était en feu
  rationale: Expression française actuelle qui restitue l’état continu indiqué par le participe, sans lourdeur redondante.
- source_word: אֵינֶנּוּ אֻכָּל
  choice: ne se consumait pas
  rationale: Le passif de אכל signifie ici que le buisson n’était pas détruit par le feu. « Ne se consumait pas » préserve le paradoxe et l’aspect continu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le nom propre divin. « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Sens de מַלְאַךְ dans une manifestation divine
  choice: ange
  alternative: messager
  rationale: Le contexte surnaturel favorise « ange », mais le verset ne précise pas davantage son identité; la note maintient donc l’autre sens lexical sans résoudre la tension théologique du récit.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du mouvement narratif hébreu, tandis que les deux-points rendent sobrement la fonction de הִנֵּה. Le nom de Moïse est répété pour clarifier le sujet sans modifier le référent.
