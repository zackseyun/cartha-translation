  rationale: 'Révision stylistique et syntaxique limitée : « venant du milieu du buisson » rattache clairement l’origine à la flamme et conserve l’idée de sortie depuis l’intérieur exprimée par מִתּוֹךְ. Le reste du texte et la note sont conservés, car ils sont fidèles, naturels et théologiquement non surinterprétatifs.'
