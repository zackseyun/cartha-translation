  text: וַ/יֹּ֗אמֶר אָנֹכִי֙ אֱלֹהֵ֣י אָבִ֔י/ךָ אֱלֹהֵ֧י אַבְרָהָ֛ם אֱלֹהֵ֥י יִצְחָ֖ק וֵ/אלֹהֵ֣י יַעֲקֹ֑ב וַ/יַּסְתֵּ֤ר מֹשֶׁה֙ פָּנָ֔י/ו כִּ֣י יָרֵ֔א מֵ/הַבִּ֖יט אֶל הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/006.yaml
  text: Then he said, “I am the God of your father, the God of Abraham, the God of Isaac, and the God of Jacob.” And Moses hid his face, because he was afraid to look at God.
translation:
  language: fr
  text: 'Puis il dit : « Je suis le Dieu de ton père, le Dieu d’Abraham, le Dieu d’Isaac et le Dieu de Jacob. » Moïse cacha son visage, car il avait peur de regarder Dieu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Puis il dit
  rationale: Le waw consécutif fait avancer le récit. « Puis il dit » exprime naturellement la succession en français moderne.
- source_word: אָנֹכִי
  choice: Je suis
  rationale: Le pronom indépendant est emphatique; dans cette proposition nominale d’identification, le français exige naturellement la copule « suis ».
- source_word: אֱלֹהֵי אָבִיךָ
  choice: le Dieu de ton père
  rationale: Cette traduction transparente conserve le suffixe singulier et la formule d’identification liée aux ancêtres.
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: le Dieu d’Abraham, le Dieu d’Isaac et le Dieu de Jacob
  rationale: La répétition explicite de « le Dieu de » est maintenue pour préserver l’insistance rhétorique et l’identification patriarcale.
- source_word: וַיַּסְתֵּר
  choice: se cacha
  rationale: Le hifil signifie ici cacher ou dissimuler. Avec « le visage », la tournure pronominale « se cacha le visage » est idiomatique et fidèle à l’action décrite.
- source_word: פָּנָיו
  choice: le visage
  rationale: Le sens concret convient au geste physique de Moïse; le possessif est naturellement porté en français par le pronom réfléchi dans « se cacha le visage ».
- source_word: כִּי יָרֵא
  choice: car il avait peur
  rationale: « Car » conserve la valeur causale de כִּי, et l’imparfait rend naturellement l’état de crainte qui motive le geste.
- source_word: מֵהַבִּיט
  choice: de regarder
  rationale: Après « avoir peur », l’infinitif introduit par « de » est la construction française naturelle; « regarder » rend le fait de porter intentionnellement les yeux sur quelqu’un.
- source_word: אֶל הָאֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, אֱלֹהִים désigne celui qui se présente comme le Dieu des patriarches; « regarder Dieu » est la construction française naturelle.
theological_decisions:
- issue: Rendu de אֱלֹהִים dans une auto-identification divine et une théophanie
  choice: Dieu
  alternative: la divinité
  rationale: Le contexte identifie explicitement le locuteur comme le Dieu des patriarches. « Dieu » conserve ce référent personnel et relationnel sans ajouter de précision doctrinale.
- issue: Répétition de la formule patriarcale
  choice: le Dieu d’Abraham, le Dieu d’Isaac et le Dieu de Jacob
  alternative: le Dieu d’Abraham, d’Isaac et de Jacob
  rationale: La répétition hébraïque est conservée, car elle donne à chacun des patriarches une place distincte dans l’auto-identification divine et porte une réelle insistance rhétorique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu tout en étant idiomatique. Le passé simple convient à l’avancée narrative, tandis que l’imparfait exprime l’état de crainte de Moïse.
