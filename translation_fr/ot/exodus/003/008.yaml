  text: וָ/אֵרֵ֞ד לְ/הַצִּיל֣/וֹ מִ/יַּ֣ד מִצְרַ֗יִם וּֽ/לְ/הַעֲלֹת/וֹ֮ מִן הָ/אָ֣רֶץ הַ/הִוא֒ אֶל אֶ֤רֶץ טוֹבָה֙ וּ/רְחָבָ֔ה אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ אֶל מְק֤וֹם הַֽ/כְּנַעֲנִי֙ וְ/הַ֣/חִתִּ֔י וְ/הָֽ/אֱמֹרִי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/008.yaml
  text: And I have come down to deliver him from the hand of Egypt and to bring him up from that land to a good and broad land[a], to a land flowing with milk and honey, to the place of the Canaanite, the Hittite, the Amorite, the Perizzite, the Hivite[c][b], and the Jebusite.
translation:
  language: fr
  text: Je suis descendu pour le délivrer de la main de l’Égypte[a] et pour le faire monter[b] hors de ce pays, vers un pays bon et spacieux[c], vers un pays où coulent le lait et le miel, vers le lieu des Cananéens, des Hittites, des Amorites, des Perizzites, des Hivvites et des Jébusites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « la main de l’Égypte » désigne le pouvoir ou l’emprise de l’Égypte.
    reason: lexical_alternative
  - marker: b
    text: En hébreu, les pronoms traduits par « le » dans « le délivrer » et « le faire monter » sont au singulier et désignent collectivement Israël, le peuple.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « un pays bon et vaste ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֵד
  choice: Je suis descendu
  rationale: Le passé composé rend naturellement en français l’action divine présentée comme accomplie et immédiatement pertinente dans le discours. Le mouvement spatial anthropomorphique de ירד est conservé.
- source_word: לְהַצִּילוֹ
  choice: pour le délivrer
  rationale: Le hiphil de נצל exprime ici l’arrachement à un danger ou à une domination. « Délivrer » convient au contexte de l’exode sans réduire le verbe à une notion abstraite.
- source_word: מִיַּד מִצְרַיִם
  choice: de la main de l’Égypte
  rationale: Cette formulation conserve l’image hébraïque de la main comme symbole de pouvoir ou d’emprise. Une note en explicite le sens idiomatique.
- source_word: וּלְהַעֲלֹתוֹ
  choice: pour le faire monter
  rationale: Le hiphil de עלה indique que Dieu fait monter Israël. La tournure conserve le motif vertical et géographique du texte ainsi que le pronom singulier collectif.
- source_word: מִן הָאָרֶץ הַהִוא
  choice: hors de ce pays
  rationale: « Hors de » exprime clairement le mouvement de sortie porté par מן, tandis que « ce pays » renvoie naturellement à l’Égypte dans le discours français.
- source_word: אֶל אֶרֶץ טוֹבָה וּרְחָבָה
  choice: vers un pays bon et spacieux
  rationale: « Bon » rend טובה sans amplification; « spacieux » communique la largeur et l’ampleur de רחבה dans un français plus naturel que « large » appliqué à un pays.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: un pays où coulent le lait et le miel
  rationale: Cette expression française établie garde l’image concrète de זבת et évoque l’abondance du pays.
- source_word: אֶל מְקוֹם
  choice: vers le lieu où vivent
  rationale: « Le lieu » conserve le sens de מקום. L’ajout syntaxique « où vivent » permet d’introduire naturellement en français la liste des peuples exprimés en hébreu par des ethnonymes collectifs.
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: les Cananéens, les Hittites, les Amorites, les Perizzites, les Hivvites et les Jébusites
  rationale: Les ethnonymes hébreux sont morphologiquement singuliers mais employés collectivement. Le pluriel français rend sans ambiguïté cette valeur collective et demeure idiomatique.
theological_decisions:
- issue: Mouvement divin anthropomorphique
  choice: Conserver « Je suis descendu »
  alternative: Paraphraser par « Je suis intervenu » ou « j’ai décidé d’agir »
  rationale: Le texte représente l’action de Dieu au moyen d’un déplacement spatial. Garder cette image respecte la forme narrative et évite d’en résoudre ou d’en atténuer la portée théologique.
- issue: Pronoms singuliers désignant collectivement Israël
  choice: Employer « le » dans « le délivrer » et « le faire monter »
  alternative: Employer un pluriel tel que « les délivrer » et « les faire monter »
  rationale: Les deux suffixes hébreux sont au singulier et présentent Israël comme un peuple collectif. Le masculin singulier français préserve cette perspective, avec une note pour éviter toute méprise.
- issue: Occupation du pays par les peuples énumérés
  choice: Rendre les ethnonymes collectifs au pluriel après « le lieu où vivent »
  alternative: 'Conserver des singuliers formels : « le Cananéen, le Hittite… »'
  rationale: Le singulier hébreu a ici une valeur collective. Le pluriel français ne modifie pas le référent et évite une formulation artificielle ou l’impression que le texte désigne six individus.
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé maintient l’immédiateté du discours divin. Les images structurantes de la descente de Dieu, de la montée d’Israël, de la main de l’Égypte et du lait et du miel sont conservées; les ethnonymes sont mis au pluriel selon l’usage naturel du français.
