  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל הָ֣/אֱלֹהִ֔ים מִ֣י אָנֹ֔כִי כִּ֥י אֵלֵ֖ךְ אֶל פַּרְעֹ֑ה וְ/כִ֥י אוֹצִ֛יא אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/011.yaml
  text: But Moses said to God[a], “Who am I that I should go to Pharaoh and that I should bring the sons of Israel out of Egypt?”
translation:
  language: fr
  text: 'Mais Moïse dit à Dieu : « Qui suis-je pour aller trouver le pharaon et pour faire sortir d’Égypte les fils d’Israël[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites »; traditionnellement, « les enfants d’Israël ».
    reason: Alternative lexicale pour בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol de אמר est la formule narrative habituelle, rendue naturellement par « dit ».
- source_word: אֶל הָאֱלֹהִים
  choice: à Dieu
  rationale: Malgré l’article en hébreu, le français désigne idiomatiquement le Dieu d’Israël par « Dieu », sans article.
- source_word: מִי אָנֹכִי
  choice: Qui suis-je
  rationale: Cette formulation directe conserve l’humilité et le sentiment d’insuffisance de Moïse sans les expliciter davantage.
- source_word: כִּי אֵלֵךְ אֶל פַּרְעֹה
  choice: pour aller trouver le pharaon
  rationale: Dans cette question rhétorique, כִּי introduit l’action envisagée. « Pour aller trouver » est naturel en français et rend l’idée de se présenter devant le pharaon.
- source_word: וְכִי אוֹצִיא
  choice: et pour faire sortir
  rationale: Le parallélisme des deux actions est conservé; le hifil de יצא a le sens causatif de « faire sortir ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La traduction conserve l’expression familiale et généalogique masculine de l’hébreu; une formulation collective plus idiomatique est donnée en note.
- source_word: מִמִּצְרַיִם
  choice: d’Égypte
  rationale: Avec « faire sortir », la préposition « de » exprime naturellement le point de départ en français.
theological_decisions:
- issue: Traduction de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites; traditionnellement, les enfants d’Israël
  rationale: Le texte hébreu emploie une expression masculine et généalogique. Le texte principal en préserve la forme, tandis que la note signale l’équivalent collectif courant et la formulation traditionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. « Le pharaon » suit l’usage français courant pour le titre royal. La structure en deux infinitifs coordonnés restitue avec fluidité la double objection de Moïse.
