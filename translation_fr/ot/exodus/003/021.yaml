- from: Je ferai trouver grâce à ce peuple aux yeux des Égyptiens[a] ; ainsi, quand vous partirez, vous ne partirez pas les mains vides[b].
  to: Je ferai que ce peuple trouve grâce aux yeux des Égyptiens[a] ; et, lorsque vous partirez, vous ne partirez pas les mains vides[b].
