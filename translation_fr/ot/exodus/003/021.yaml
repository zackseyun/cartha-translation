  text: וְ/נָתַתִּ֛י אֶת חֵ֥ן הָֽ/עָם הַ/זֶּ֖ה בְּ/עֵינֵ֣י מִצְרָ֑יִם וְ/הָיָה֙ כִּ֣י תֵֽלֵכ֔וּ/ן לֹ֥א תֵלְכ֖וּ רֵיקָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/021.yaml
  text: And I will give this people favor in the sight of the Egyptians[a], and when you go[b], you will not go empty-handed.
translation:
  language: fr
  text: Je ferai que ce peuple trouve grâce aux yeux des Égyptiens[a] ; et, lorsque vous partirez, vous ne partirez pas les mains vides[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans les yeux des Égyptiens » ; c’est-à-dire qu’ils considéreront ce peuple avec faveur.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vous ne partirez pas sans rien ». L’expression hébraïque désigne un départ sans biens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Je ferai trouver
  rationale: Avec חֵן et בְּעֵינֵי, la tournure française « faire trouver grâce aux yeux de » rend naturellement l’idée littérale de donner à quelqu’un la faveur dans le regard d’autrui.
- source_word: חֵן
  choice: grâce
  rationale: Dans l’expression française « trouver grâce aux yeux de », « grâce » désigne ici la faveur ou la bienveillance reçue, sans imposer un sens doctrinal.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Le singulier collectif עָם accompagné du démonstratif est rendu directement par « ce peuple ».
- source_word: בְּעֵינֵי מִצְרָיִם
  choice: aux yeux des Égyptiens
  rationale: Cette formulation conserve l’image hébraïque tout en constituant une expression française courante indiquant la manière dont le peuple sera considéré.
- source_word: וְהָיָה כִּי
  choice: ainsi, quand
  rationale: La formule hébraïque introduit ici la circonstance future qui résultera de la promesse précédente ; « ainsi, quand » en restitue la progression sans lourdeur littérale.
- source_word: תֵלֵכוּן / תֵלְכוּ
  choice: vous partirez / vous ne partirez
  rationale: Dans le contexte de la sortie d’Égypte, « partir » explicite naturellement le mouvement visé par הלך, tout en conservant la répétition du verbe.
- source_word: רֵיקָם
  choice: les mains vides
  rationale: L’expression idiomatique française indique clairement qu’ils ne partiront pas sans biens ni provisions.
theological_decisions: []
