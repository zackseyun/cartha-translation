  text: וָ/אֹמַ֗ר אַעֲלֶ֣ה אֶתְ/כֶם֮ מֵ/עֳנִ֣י מִצְרַיִם֒ אֶל אֶ֤רֶץ הַֽ/כְּנַעֲנִי֙ וְ/הַ֣/חִתִּ֔י וְ/הָֽ/אֱמֹרִי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/017.yaml
  text: And I have said[a], ‘I will bring you up out of the affliction of Egypt to the land of the Canaanites, the Hittites, the Amorites, the Perizzites, the Hivites[b], and the Jebusites—to a land flowing with milk and honey.’
translation:
  language: fr
  text: 'Et j’ai dit[a] : « Je vous ferai monter hors de l’oppression en Égypte, vers le pays des Cananéens, des Hittites, des Amorites, des Perizzites, des Hivites et des Jébusites, vers un pays où coulent le lait et le miel. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et j’ai déclaré : “Je vous ferai monter…” » Le verbe hébreu est au passé et introduit ici une déclaration divine qui reste en vigueur.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: Et j’ai dit
  rationale: Le verbe hébreu est formellement au passé et présente ici une déclaration divine antérieure qui demeure pertinente. Le passé composé est naturel en français et conserve cette valeur sans paraphraser par « j’ai promis ».
- source_word: אַעֲלֶה
  choice: Je vous ferai monter
  rationale: Le hifil de עלה signifie « faire monter, faire sortir vers le haut ». Cette formulation préserve l’image spatiale de l’hébreu, même si « je vous ferai sortir » serait plus idiomatique.
- source_word: מֵעֳנִי מִצְרַיִם
  choice: hors de l’oppression en Égypte
  rationale: עֳנִי peut désigner l’affliction, la misère ou l’oppression. Dans ce contexte, « l’oppression en Égypte » exprime clairement la souffrance imposée au peuple sans faire de l’Égypte elle-même la victime.
- source_word: אֶל אֶרֶץ
  choice: vers le pays
  rationale: אֶל indique le mouvement en direction d’une destination. « Vers le pays » respecte cette nuance et convient aux deux occurrences.
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: des Cananéens, des Hittites, des Amorites, des Perizzites, des Hivites et des Jébusites
  rationale: Les gentilés sont au singulier collectif en hébreu, mais le pluriel est la formulation naturelle en français pour nommer ces peuples.
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: vers un pays ruisselant de lait et de miel
  rationale: La formule conserve la métaphore hébraïque d’une abondance qui s’écoule. « Ruisselant » est dignifié, compréhensible et plus imagé que l’explicitation « fertile et abondant ».
theological_decisions:
- issue: Valeur temporelle de la déclaration divine
  choice: 'Et j’ai dit : « Je vous ferai monter… »'
  alternative: 'Et je dis : « Je vous ferai monter… » / J’ai promis : « Je vous ferai monter… »'
  rationale: Le passé composé respecte la forme passée de l’hébreu tout en laissant entendre la pertinence actuelle de la déclaration. « J’ai promis » préciserait la force pragmatique, mais ajouterait un contenu lexical absent du verbe אמר.
translation_notes:
  register: Français international moderne, naturel et soutenu sans archaïsme. La répétition de « vers » reproduit la structure hébraïque. Les noms de peuples suivent les formes françaises bibliques usuelles.
