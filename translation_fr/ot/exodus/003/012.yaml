base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/012.yaml
  text: 'And he said[a], “Certainly I will be with you, and this will be the sign for you that I have sent you: when you bring the people out of Egypt, you will serve God on this mountain.”'
translation:
  language: fr
  text: 'Il dit : « Oui, je serai avec toi. Et voici le signe qui te montrera que c’est moi qui t’ai envoyé : quand tu auras fait sortir le peuple d’Égypte, vous servirez Dieu[a] sur cette montagne. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous adorerez Dieu sur cette montagne ». Le verbe hébreu peut signifier « servir » et, lorsqu’il a Dieu pour objet, « adorer » ou « rendre un culte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Oui
  rationale: Dans cette réponse à l’objection de Moïse, כִּי a une valeur d’assurance. « Oui » exprime naturellement cette confirmation en français sans imposer une relation causale trop explicite.
- source_word: אֶהְיֶה עִמָּךְ
  choice: je serai avec toi
  rationale: L’imparfait hébreu est ici orienté vers l’avenir et promet la présence accompagnatrice de Dieu.
- source_word: הָאוֹת
  choice: le signe
  rationale: « Signe » est le terme français courant qui conserve la fonction de confirmation exprimée par אוֹת.
- source_word: כִּי אָנֹכִי שְׁלַחְתִּיךָ
  choice: qui te montrera que c’est moi qui t’ai envoyé
  rationale: La formulation explicite la fonction du signe tout en rendant l’insistance du pronom אָנֹכִי par « c’est moi ». Le passé composé convient à l’envoi dont la mission présente demeure l’effet.
- source_word: בְּהוֹצִיאֲךָ
  choice: quand tu auras fait sortir
  rationale: La construction בְּ + infinitif avec suffixe de deuxième personne est temporelle. Le futur antérieur situe naturellement en français la sortie avant le service rendu sur la montagne, Moïse étant l’agent qui fait sortir le peuple.
- source_word: תַּעַבְדוּן
  choice: vous servirez
  rationale: עבד peut désigner à la fois le service et le culte rendu à Dieu. « Servir » préserve cette largeur sémantique; la note indique l’autre rendu naturel.
- source_word: עַל הָהָר הַזֶּה
  choice: sur cette montagne
  rationale: « Sur » conserve la préposition hébraïque et la localisation concrète de la scène.
theological_decisions:
- issue: Nature du signe promis
  choice: Le signe est présenté comme la future sortie d’Égypte suivie du service rendu à Dieu sur cette montagne.
  alternative: Le signe pourrait être compris comme la promesse immédiate de la présence divine, ou comme englobant à la fois cette promesse et son accomplissement futur.
  rationale: La syntaxe rattache le plus naturellement le signe à la proposition qui suit. La traduction garde toutefois le caractère prospectif et la tension d’un signe dont la confirmation vient après l’accomplissement de la mission.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au discours direct adressé à Moïse. « Oui » fournit une assurance concise; « c’est moi » conserve l’emphase de אָנֹכִי. Le marqueur [a] est placé après l’unité concernée.
