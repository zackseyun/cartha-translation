  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֥רְא יְהוָ֖ה כִּ֣י סָ֣ר לִ/רְא֑וֹת וַ/יִּקְרָא֩ אֵלָ֨י/ו אֱלֹהִ֜ים מִ/תּ֣וֹךְ הַ/סְּנֶ֗ה וַ/יֹּ֛אמֶר מֹשֶׁ֥ה מֹשֶׁ֖ה וַ/יֹּ֥אמֶר הִנֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/004.yaml
  text: When Yahweh saw that he had turned aside to look[a], God called to him from the midst of the bush and said, “Moses, Moses!” And he said[c][b], “Here I am.”
translation:
  language: fr
  text: 'Quand Yahweh vit qu’il s’était détourné pour regarder, Dieu l’appela du milieu du buisson[a] et dit : « Moïse, Moïse ! » Il répondit : « Me voici. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner plus précisément un buisson épineux.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans l’hébreu et le distingue de אֱלֹהִים, « Dieu », employé dans la proposition suivante.
- source_word: וַיַּרְא
  choice: vit
  rationale: Le verbe ראה désigne ici la perception visuelle de Yahweh dans le déroulement narratif.
- source_word: כִּי
  choice: que
  rationale: כִּי introduit le contenu de ce que Yahweh vit. La construction française « Quand Yahweh vit que… » restitue naturellement à la fois la progression temporelle et le contenu perçu.
- source_word: סָר לִרְאוֹת
  choice: s’était détourné pour regarder
  rationale: סוּר exprime le fait de se détourner ou de s’écarter, et l’infinitif לִרְאוֹת en indique le but. Le plus-que-parfait marque naturellement en français que ce mouvement précède le regard de Yahweh.
- source_word: וַיִּקְרָא אֵלָיו
  choice: l’appela
  rationale: En français, « appeler quelqu’un » rend naturellement קרא avec אֶל dans ce contexte, sans nécessiter la formulation plus lourde « appela vers lui ».
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Cette traduction courante maintient la distinction lexicale entre אֱלֹהִים et le nom יְהוָה employé au début du verset.
- source_word: מִתּוֹךְ הַסְּנֶה
  choice: du milieu du buisson
  rationale: La formulation conserve la valeur spatiale de מִתּוֹךְ et le sens général de סְנֶה, tout en restant naturelle et solennelle en français.
- source_word: מֹשֶׁה מֹשֶׁה
  choice: Moïse, Moïse !
  rationale: La répétition du nom est conservée, car elle exprime une interpellation personnelle insistante.
- source_word: הִנֵּנִי
  choice: Me voici
  rationale: Cette formule française idiomatique exprime la présence et la disponibilité du répondant sans ajouter explicitement une idée d’obéissance.
theological_decisions:
- issue: Distinction entre יְהוָה et אֱלֹהִים dans le même verset
  choice: Traduire יְהוָה par « Yahweh » et אֱלֹהִים par « Dieu ».
  alternative: Employer « le Seigneur » pour יְהוָה, ou harmoniser les deux désignations en traduisant les deux par « Dieu ».
  rationale: Le texte hébreu emploie délibérément deux désignations rapprochées. Les distinguer rend cette donnée visible sans spéculer sur sa portée théologique.
- issue: Sujet de la dernière forme וַיֹּאמֶר
  choice: Rendre explicitement la réponse de Moïse par « Il répondit ».
  alternative: Traduire plus formellement « Et il dit », ou répéter « Moïse répondit ».
  rationale: Après l’appel « Moïse, Moïse ! », le répondant est clairement Moïse. « Il répondit » explicite la fonction dialogale du verbe sans résoudre une ambiguïté théologique ni ajouter de contenu.
translation_notes:
  register: Français international moderne, clair et digne. Le récit conserve sa sobriété, la répétition solennelle du nom de Moïse et la distinction entre « Yahweh » et « Dieu ». La ponctuation française des paroles rapportées est employée.
