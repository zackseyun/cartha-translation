  source_fidelity: 'Le sens global est fidèle : la répétition solennelle des trois patriarches, « les fils d’Israël », « vos pères », le nom Yahweh et la durée perpétuelle sont bien rendus. Toutefois, « c’est ainsi qu’on se souviendra de moi » reformule זִכְרִי de manière plus interprétative et remplace le démonstratif nominal par une explication verbale.'
