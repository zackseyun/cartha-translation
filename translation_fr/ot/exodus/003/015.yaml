  text: וַ/יֹּאמֶר֩ ע֨וֹד אֱלֹהִ֜ים אֶל מֹשֶׁ֗ה כֹּֽה תֹאמַר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ יְהוָ֞ה אֱלֹהֵ֣י אֲבֹתֵי/כֶ֗ם אֱלֹהֵ֨י אַבְרָהָ֜ם אֱלֹהֵ֥י יִצְחָ֛ק וֵ/אלֹהֵ֥י יַעֲקֹ֖ב שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם זֶה שְּׁמִ֣/י לְ/עֹלָ֔ם וְ/זֶ֥ה זִכְרִ֖/י לְ/דֹ֥ר דֹּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/015.yaml
  text: 'God also said to Moses[a], “Thus you shall say to the sons of Israel: Yahweh, the God of your fathers, the God of Abraham, the God of Isaac, and the God of Jacob, has sent me to you. This is my name forever[b], and this is my memorial from generation to generation.”'
translation:
  language: fr
  text: 'Dieu dit encore à Moïse : « Voici ce que tu diras aux fils d’Israël : Yahweh[a], le Dieu de vos pères, le Dieu d’Abraham, le Dieu d’Isaac et le Dieu de Jacob, m’a envoyé vers vous. Tel est mon nom pour toujours, telle est ma mémoire de génération en génération. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH. Le nom divin est aussi transcrit « Jéhovah » ; dans de nombreuses traductions, il est traditionnellement remplacé par « le Seigneur » ou « l’Éternel ».'
    reason: Précise la forme hébraïque du tétragramme et signale, sans les confondre, une transcription traditionnelle et des substitutions de traduction.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre, plutôt que remplacé par le titre « le Seigneur ». La forme « Yahweh » est largement reconnue en français et préserve la fonction du nom divin dans le passage.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression de parenté masculine du texte hébreu tout en restant intelligible en français biblique moderne.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: le Dieu de vos pères
  rationale: Le choix reflète directement le nom masculin אָבוֹת, ici suivi par l’énumération d’Abraham, d’Isaac et de Jacob.
- source_word: שְׁלָחַנִי
  choice: m’a envoyé
  rationale: Le passé composé exprime naturellement en français une mission accomplie dont les effets demeurent au moment où Moïse parle.
- source_word: זֶה שְּׁמִי לְעֹלָם
  choice: Tel est mon nom pour toujours
  rationale: « Pour toujours » rend clairement la durée indéfinie ou perpétuelle exprimée par לְעֹלָם, sans surcharger la phrase.
- source_word: זִכְרִי
  choice: c’est ainsi qu’on se souviendra de moi
  rationale: Le nom dérivé de la racine « se souvenir » désigne ce qui maintient ou évoque le souvenir. Cette formulation française explicite naturellement le sens sans imposer le terme moins courant « mémorial ».
- source_word: לְדֹר דֹּר
  choice: de génération en génération
  rationale: Cette expression idiomatique française conserve la répétition et l’idée de continuité à travers les générations successives.
- source_word: כֹּה תֹאמַר
  choice: Voici ce que tu diras
  rationale: Cette tournure actuelle et digne restitue naturellement la formule hébraïque qui introduit les paroles prescrites à Moïse.
- source_word: עוֹד
  choice: encore
  rationale: Dans ce contexte, le mot marque la poursuite de la parole divine. « Encore » convient au français narratif et n’implique pas nécessairement une répétition identique.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte présente explicitement le tétragramme comme le nom de Dieu. Le conserver sous la forme « Yahweh » maintient cette dimension personnelle et covenantale, au lieu de le remplacer par un titre.
- issue: Maintien des termes masculins de parenté
  choice: les fils d’Israël ; vos pères
  alternative: les Israélites ; vos ancêtres
  rationale: L’hébreu emploie ici des termes masculins explicites. Leur maintien préserve la forme et le cadre généalogique du passage sans ajouter une interprétation neutralisante.
- issue: Sens de זִכְרִי
  choice: c’est ainsi qu’on se souviendra de moi
  alternative: tel est mon mémorial ; tel est mon souvenir
  rationale: Le mot peut désigner le souvenir, le mémorial ou ce par quoi quelqu’un est rappelé. Le texte principal retient une expression idiomatique tout en signalant dans la note la formulation nominale plus littérale.
translation_notes:
  register: Français international moderne, clair et digne. « Voici ce que tu diras » évite l’archaïsme de « Ainsi parleras-tu », tandis que « fils d’Israël » et « vos pères » conservent les images de parenté du texte source. La répétition « le Dieu de… » est maintenue pour respecter le rythme solennel de l’hébreu.
