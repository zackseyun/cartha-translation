  terminology: « Yahweh », « fils d’Israël » et « Dieu de vos pères » sont appropriés et cohérents avec l’hébreu. « Ma mémoire » conserve l’ambiguïté sémantique de זִכְרִי (souvenir, mémorial, ce par quoi l’on se souvient) sans privilégier indûment une paraphrase.
