source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִנֵּ֛ה צַעֲקַ֥ת בְּנֵי יִשְׂרָאֵ֖ל בָּ֣אָה אֵלָ֑/י וְ/גַם רָאִ֨יתִי֙ אֶת הַ/לַּ֔חַץ אֲשֶׁ֥ר מִצְרַ֖יִם לֹחֲצִ֥ים אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/009.yaml
  text: And now[a], behold, the cry of the sons of Israel has come to me[b], and I have also seen the oppression with which the Egyptians are oppressing them.
translation:
  language: fr
  text: 'Et maintenant, voici : le cri des fils d’Israël[a] est parvenu jusqu’à moi[b], et j’ai aussi vu l’oppression que les Égyptiens leur font subir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les enfants d’Israël » ou « les Israélites ». L’hébreu porte littéralement « les fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « est venu jusqu’à moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois la continuité marquée par la conjonction et la transition temporelle.
- source_word: הִנֵּה
  choice: voici
  rationale: Particule qui attire l’attention; « voici » garde cette fonction dans un français actuel et digne.
- source_word: צַעֲקַת
  choice: le cri
  rationale: Désigne le cri né de la détresse; formulation directe qui n’ajoute pas explicitement l’idée de plainte ou de supplication.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Reproduit l’expression familiale et collective de l’hébreu sans la réduire à un simple gentilé.
- source_word: בָּאָה אֵלַי
  choice: est parvenu jusqu’à moi
  rationale: Rend idiomatiquement le mouvement vers le locuteur exprimé par « venir à moi »; « jusqu’à » souligne naturellement l’aboutissement sans changer le sens.
- source_word: וְגַם
  choice: et j’ai aussi
  rationale: Préserve la valeur additive de la construction hébraïque dans un ordre naturel en français.
- source_word: רָאִיתִי
  choice: j’ai vu
  rationale: Le passé composé convient à l’accompli hébreu dont le résultat demeure pertinent dans la situation présente.
- source_word: הַלַּחַץ
  choice: l’oppression
  rationale: Exprime la contrainte sociale et violente exercée sur Israël dans le contexte égyptien.
- source_word: מִצְרַיִם
  choice: les Égyptiens
  rationale: Bien que la forme soit aussi le nom « Égypte », le participe qui suit est au pluriel et désigne ici les agents humains de l’oppression.
- source_word: לֹחֲצִים אֹתָם
  choice: leur font subir
  rationale: Avec « l’oppression », cette tournure évite une répétition lourde tout en exprimant l’action continue exercée contre eux.
theological_decisions:
- issue: Désignation collective בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les enfants d’Israël; les Israélites
  rationale: « Les fils d’Israël » conserve l’image généalogique et l’expression collective masculine du texte source; une note indique les équivalents français plus usuels.
- issue: Sujet de לֹחֲצִים
  choice: les Égyptiens
  alternative: l’Égypte
  rationale: Le participe hébreu est masculin pluriel, ce qui favorise ici les habitants ou oppresseurs égyptiens plutôt que le pays envisagé comme sujet singulier.
- issue: Force discursive de הִנֵּה
  choice: voici
  alternative: regarde; oui
  rationale: « Voici » attire l’attention sans archaïsme marqué et sans transformer la particule en ordre explicite adressé à Moïse.
translation_notes:
  register: Français international moderne, lisible et digne. La ponctuation après « voici » fait ressortir la particule d’attention. La formulation garde « fils d’Israël » pour préserver l’expression hébraïque, tandis que la dernière proposition évite la répétition peu naturelle « l’oppression dont les Égyptiens les oppriment ».
