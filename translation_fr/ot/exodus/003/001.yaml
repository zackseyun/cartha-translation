source:
  edition: WLC
  text: וּ/מֹשֶׁ֗ה הָיָ֥ה רֹעֶ֛ה אֶת צֹ֛אן יִתְר֥וֹ חֹתְנ֖/וֹ כֹּהֵ֣ן מִדְיָ֑ן וַ/יִּנְהַ֤ג אֶת הַ/צֹּאן֙ אַחַ֣ר הַ/מִּדְבָּ֔ר וַ/יָּבֹ֛א אֶל הַ֥ר הָ/אֱלֹהִ֖ים חֹרֵֽבָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/001.yaml
  text: Moses was shepherding the flock of Jethro his father-in-law[a], the priest of Midian. He led the flock beyond the wilderness and came to the mountain of God, Horeb.
translation:
  language: fr
  text: Moïse faisait paître le troupeau de Jéthro, son beau-père, prêtre de Madian. Il mena le troupeau de l’autre côté du désert[a] et parvint à la montagne de Dieu, à Horeb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au-delà du désert »; littéralement : « derrière le désert ».'
    reason: L’expression hébraïque אַחַר הַמִּדְבָּר admet plusieurs formulations spatiales proches.
lexical_decisions:
- source_word: וּ/מֹשֶׁה
  choice: Moïse
  rationale: Le waw ouvre une nouvelle scène narrative; en français, une simple entrée par « Moïse » est naturelle sans ajouter un marqueur temporel absent de l’hébreu.
- source_word: הָיָה רֹעֶה
  choice: faisait paître
  rationale: L’imparfait rend l’action passée en cours, tandis que « faire paître » exprime précisément l’activité pastorale.
- source_word: צֹאן
  choice: le troupeau
  rationale: Le terme désigne collectivement le petit bétail, souvent des moutons et des chèvres; « troupeau » est la formulation française naturelle.
- source_word: יִתְרוֹ
  choice: Jéthro
  rationale: Forme française traditionnelle et largement reconnue du nom.
- source_word: חֹתְנוֹ
  choice: son beau-père
  rationale: Dans ce contexte, le lien par alliance est celui du père de l’épouse de Moïse.
- source_word: כֹּהֵן מִדְיָן
  choice: prêtre de Madian
  rationale: La construction en apposition identifie la fonction de Jéthro et son rattachement à Madian sans ajouter d’article indéfini.
- source_word: וַיִּנְהַג
  choice: Il mena
  rationale: « Mener » convient au déplacement d’un troupeau et évite la nuance potentiellement brutale de « chasser devant soi ».
- source_word: אַחַר הַמִּדְבָּר
  choice: de l’autre côté du désert
  rationale: Cette expression rend le sens spatial probable de אַחַר, au-delà ou sur le versant opposé du désert, sans préciser abusivement une direction cardinale.
- source_word: וַיָּבֹא
  choice: parvint
  rationale: Le verbe marque ici l’arrivée au lieu; « parvint à » est naturel dans le récit français.
- source_word: הַר הָאֱלֹהִים
  choice: la montagne de Dieu
  rationale: Traduction directe qui conserve ouverte la question de savoir si cette désignation est anticipatrice, rétrospective ou déjà usuelle.
- source_word: חֹרֵבָה
  choice: à l’Horeb
  rationale: Le suffixe directionnel indique un mouvement vers Horeb; la préposition « à » l’explicite en français. L’article correspond à l’usage biblique français courant pour ce massif.
theological_decisions:
- issue: La désignation הַר הָאֱלֹהִים présente-t-elle la montagne comme déjà sacrée ou comme reconnue telle ultérieurement ?
  choice: la montagne de Dieu
  alternative: la montagne sacrée
  rationale: La formulation directe préserve la tension narrative et n’impose aucune explication sur le moment ou la manière dont la montagne reçoit ce statut.
translation_notes:
  register: Français international moderne, narratif et digne. L’imparfait installe l’action en cours, puis le passé simple fait progresser le récit. « Horeb » est précédé de l’article selon l’usage français courant.
