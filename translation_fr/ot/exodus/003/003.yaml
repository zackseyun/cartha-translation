  text: Then Moses said[a], “Let me turn aside and see this great sight, why the bush is not burned up.”
translation:
  language: fr
  text: 'Alors Moïse dit : « Je vais faire un détour pour voir ce spectacle extraordinaire : pourquoi le buisson ne se consume-t-il pas ?[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pourquoi le buisson ne brûle-t-il pas ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: Alors Moïse se dit
  rationale: Le wayyiqtol fait progresser le récit. Puisque les paroles expriment la réflexion et le projet de Moïse, « se dit » est naturel en français sans changer le référent.
- source_word: אָסֻרָה נָּא
  choice: Je vais faire un détour
  rationale: Le cohortatif accompagné de נָא exprime ici la volonté de Moïse. Cette formulation idiomatique conserve l'idée qu'il s'écarte de son chemin pour aller voir.
- source_word: וְאֶרְאֶה
  choice: pour voir
  rationale: La coordination hébraïque exprime ici le but du détour; « pour voir » rend naturellement cette relation en français.
- source_word: הַמַּרְאֶה הַגָּדֹל הַזֶּה
  choice: ce spectacle extraordinaire
  rationale: מַרְאֶה désigne ce qui s'offre à la vue, et גָּדֹל souligne ici son caractère remarquable plutôt que sa taille physique.
- source_word: מַדּוּעַ
  choice: et comprendre pourquoi
  rationale: Dans ce contexte, la question motive l'examen visuel. L'ajout idiomatique de « comprendre » explicite la relation syntaxique sans trancher le phénomène décrit.
- source_word: לֹא יִבְעַר
  choice: ne se consume pas
  rationale: Le verbe Qal signifie fondamentalement « brûler ». Dans le contexte immédiat, le paradoxe est que le buisson est en feu sans être détruit; « se consume » exprime clairement ce résultat en français, tandis que la note conserve les rendus plus strictement verbaux.
- source_word: הַסְּנֶה
  choice: le buisson
  rationale: « Buisson » est le terme français courant et suffisamment précis; « buisson épineux » serait possible mais plus spécifique que ne l'exige le verset.
theological_decisions:
- issue: Nature du phénomène du buisson en feu
  choice: pourquoi le buisson ne se consume pas
  alternative: pourquoi le buisson ne brûle pas / pourquoi le buisson ne finit pas de brûler
  rationale: L'hébreu emploie le verbe « brûler », mais le contexte présente un buisson en flammes qui n'est pas détruit. Le texte principal rend le paradoxe naturellement, et la note préserve l'ambiguïté lexicale sans lui imposer d'interprétation théologique supplémentaire.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste accessible, évite un calque maladroit de la parataxe hébraïque et place correctement l'appel de note après l'expression concernée.
