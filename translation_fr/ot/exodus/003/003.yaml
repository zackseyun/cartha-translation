    issue: « Alors Moïse se dit » remplace un verbe de parole par un monologue intérieur.
    rationale: Le texte hébreu porte explicitement « Moïse dit ». Même si le propos est une résolution personnelle, « se dit » réduit indûment la portée du verbe de parole.
  - severity: medium
    issue: « et comprendre pourquoi » ajoute une notion absente du texte source.
    rationale: Le verbe וְאֶרְאֶה signifie « et je verrai/regarderai ». Le motif interrogatif doit être conservé sans ajouter l’idée de compréhension.
  - severity: medium
    issue: La variante de note « ne finit pas de brûler » est ambiguë et ne rend pas adéquatement l’alternative lexicale.
    rationale: En français, elle peut évoquer un feu qui ne cesse pas, non un buisson qui ne se consume pas. Une alternative directe avec « ne brûle pas » préserve mieux l’ambiguïté du verbe hébreu.
