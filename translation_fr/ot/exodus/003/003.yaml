  verdict: revise
  source_fidelity: 'Révision nécessaire : וַיֹּאמֶר signifie « Moïse dit » et non « Moïse se dit ». L’ajout « comprendre » n’est pas exprimé par l’hébreu. Le rendu principal « ne se consume pas » est contextuellement défendable pour le paradoxe, à condition que la note donne l’alternative plus directement liée à « brûler ».'
  naturalness: Le français révisé est fluide, narratif et d’un registre moderne international. La question après les deux-points rend naturellement ce que Moïse veut examiner, sans ajouter une opération mentale explicite.
  terminology: « Moïse », « buisson » et « spectacle extraordinaire » conviennent. « Se consume » rend clairement l’absence de destruction, tandis que « brûle » en note préserve la valeur lexicale immédiate de בער. La formulation « ne finit pas de brûler » est écartée, car elle peut signifier que le feu continue plutôt que le buisson n’est pas consumé.
  issues:
