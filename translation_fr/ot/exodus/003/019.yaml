source:
  edition: WLC
  text: וַ/אֲנִ֣י יָדַ֔עְתִּי כִּ֠י לֹֽא יִתֵּ֥ן אֶתְ/כֶ֛ם מֶ֥לֶךְ מִצְרַ֖יִם לַ/הֲלֹ֑ךְ וְ/לֹ֖א בְּ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/019.yaml
  text: But I know that the king of Egypt will not let you go[a], except by a strong hand.
translation:
  language: fr
  text: Mais moi, je sais que le roi d’Égypte ne vous laissera pas partir[a], si ce n’est par une main forte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le roi d’Égypte ne vous laissera pas partir, pas même par une main forte », ou : « sauf par une main puissante ». La proposition hébraïque est elliptique et peut souligner que seule une force irrésistible fera céder le pharaon.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mais moi
  rationale: La conjonction jointe au pronom indépendant marque ici un contraste emphatique. « Mais moi » le rend naturellement en français.
- source_word: יָדַעְתִּי
  choice: je sais
  rationale: L’accompli exprime ici une connaissance établie et certaine de Dieu; le présent convient au contexte français.
- source_word: כִּי
  choice: que
  rationale: La particule introduit le contenu de ce que Dieu sait.
- source_word: לֹא יִתֵּן אֶתְכֶם ... לַהֲלֹךְ
  choice: ne vous laissera pas partir
  rationale: Dans cette construction, נתן suivi de l’infinitif signifie permettre. « Laisser partir » est idiomatique et correspond au contexte de l’Exode.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: le roi d’Égypte
  rationale: Traduction directe et naturelle de la construction hébraïque.
- source_word: וְלֹא בְּיָד חֲזָקָה
  choice: si ce n’est sous la contrainte d’une main forte
  rationale: 'La proposition hébraïque est elliptique. Cette formulation conserve l’image instrumentale de la « main forte » tout en explicitant avec mesure le sens probable: le roi ne cédera que sous une force contraignante.'
theological_decisions:
- issue: Interprétation de la proposition elliptique וְלֹא בְּיָד חֲזָקָה
  choice: Le roi d’Égypte ne laissera partir Israël que sous la contrainte d’une main forte.
  alternative: 'Le roi d’Égypte ne laissera pas partir Israël, pas même sous l’action d’une main forte; ou: sauf par une main puissante.'
  rationale: La syntaxe est condensée et permet plusieurs compréhensions. Le verset 20, où Dieu annonce qu’il frappera l’Égypte par ses prodiges, favorise l’idée que le roi ne cédera que sous une force irrésistible. La note préserve néanmoins les autres lectures possibles.
translation_notes:
  register: Français international moderne, clair et digne. « Mais moi » conserve l’emphase du pronom hébreu; « main forte » maintient un motif majeur du livre de l’Exode. La note signale l’ambiguïté réelle sans l’effacer.
