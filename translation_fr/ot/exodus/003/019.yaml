  source_fidelity: 'Le sens principal est fidèle : Dieu affirme savoir que le roi d’Égypte ne permettra pas au peuple de partir. Toutefois, « sous la contrainte de » explicite une notion de coercition qui est seulement implicite dans la construction elliptique בְּיָד חֲזָקָה. « Par une main forte » reproduit plus directement l’image instrumentale hébraïque et laisse mieux subsister l’ellipse.'
  naturalness: Le français est naturel, clair et d’un registre approprié. « Mais moi » rend bien l’emphase, et « ne vous laissera pas partir » est idiomatique. La légère révision proposée est également très naturelle.
  terminology: « Roi d’Égypte » et « main forte » sont exacts et cohérents avec le vocabulaire de l’Exode. Il convient de conserver « main forte » dans le texte, plutôt que de développer l’expression en « force irrésistible » ou « contrainte », afin de préserver le motif lexical et l’ambiguïté de la source.
