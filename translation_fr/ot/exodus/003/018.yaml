  to: 'Ils écouteront ta voix[a]. Toi et les anciens d’Israël, vous irez trouver le roi d’Égypte et vous lui direz : « Yahweh, le Dieu des Hébreux, s’est présenté à nous[b]. Maintenant, permets-nous, s’il te plaît, de faire un trajet de trois jours dans le désert afin d’offrir des sacrifices à Yahweh, notre Dieu. »'
