  text: וְ/שָׁמְע֖וּ לְ/קֹלֶ֑/ךָ וּ/בָאתָ֡ אַתָּה֩ וְ/זִקְנֵ֨י יִשְׂרָאֵ֜ל אֶל מֶ֣לֶךְ מִצְרַ֗יִם וַ/אֲמַרְתֶּ֤ם אֵלָי/ו֙ יְהוָ֞ה אֱלֹהֵ֤י הָֽ/עִבְרִיִּים֙ נִקְרָ֣ה עָלֵ֔י/נוּ וְ/עַתָּ֗ה נֵֽלֲכָה נָּ֞א דֶּ֣רֶךְ שְׁלֹ֤שֶׁת יָמִים֙ בַּ/מִּדְבָּ֔ר וְ/נִזְבְּחָ֖ה לַֽ/יהוָ֥ה אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/018.yaml
  text: And they will listen to your voice[a], and you and the elders of Israel will go to the king of Egypt and say to him, ‘Yahweh, the God of the Hebrews, has met with us. And now, please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God.’
translation:
  language: fr
  text: 'Ils écouteront ta voix[a]. Toi et les anciens d’Israël, vous irez trouver le roi d’Égypte et vous lui direz : « Yahweh, le Dieu des Hébreux, s’est présenté à nous[b]. Maintenant, permets-nous, s’il te plaît, de faire un trajet de trois jours dans le désert afin d’offrir des sacrifices à Yahweh, notre Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils t’écouteront. » Littéralement : « Ils écouteront ta voix. » L’expression peut aussi suggérer qu’ils accueilleront favorablement le message de Moïse.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « est venu à notre rencontre » ou « nous a rencontrés ». L’expression hébraïque décrit une rencontre ou une manifestation divine, sans en préciser davantage la manière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְעוּ לְקֹלֶךָ
  choice: Ils écouteront ta voix
  rationale: שׁמע peut exprimer le fait d’entendre, d’écouter ou d’obéir. « Écouteront ta voix » conserve l’image hébraïque et suggère qu’ils accueilleront favorablement la parole de Moïse sans expliciter excessivement l’obéissance.
- source_word: וּבָאתָ אַתָּה וְזִקְנֵי יִשְׂרָאֵל
  choice: Toi et les anciens d’Israël, vous irez trouver
  rationale: La formulation française rend le sujet coordonné et le déplacement vers le roi de façon naturelle. « Irez trouver » exprime clairement la démarche auprès de lui.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: le roi d’Égypte
  rationale: Traduction directe et idiomatique de la construction hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom divin personnel présent dans le texte source plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי הָעִבְרִיִּים
  choice: le Dieu des Hébreux
  rationale: Cette traduction conserve la désignation ethnique du texte source.
- source_word: נִקְרָה עָלֵינוּ
  choice: est venu à notre rencontre
  rationale: Le niphal de קרא avec עַל désigne ici une rencontre ou une manifestation survenue aux Hébreux. Cette formulation française est naturelle, sans réduire l’expression à un simple appel.
- source_word: וְעַתָּה נֵלֲכָה נָּא
  choice: Maintenant donc, permets-nous, s’il te plaît
  rationale: Le cohortatif accompagné de נָא exprime une requête polie adressée au roi. « Permets-nous » rend explicite en français la demande d’autorisation impliquée par le contexte.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: faire trois jours de marche
  rationale: Cette expression française naturelle rend l’idiome hébraïque indiquant la durée ou la distance du trajet.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne une région inculte ou désertique. Avec « faire trois jours de marche », « dans le désert » exprime naturellement le lieu du déplacement.
- source_word: וְנִזְבְּחָה
  choice: afin d’offrir des sacrifices
  rationale: Le cohortatif marque ici le but du déplacement. Le pluriel générique « des sacrifices » est idiomatique en français et exprime l’acte sacrificiel sans préciser ce que l’hébreu ne précise pas.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom propre divin sans le remplacer par un titre.
- issue: Sens de נִקְרָה עָלֵינוּ dans le récit de la rencontre divine
  choice: est venu à notre rencontre
  alternative: nous est apparu / nous a rencontrés / nous a appelés
  rationale: Le choix retenu préserve l’idée d’une rencontre divine sans imposer la notion plus précise d’apparition visible ou d’appel. La variante littérale est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement de l’hébreu tout en évitant les tournures archaïques. Le discours direct emploie une requête polie adaptée à une adresse au roi.
