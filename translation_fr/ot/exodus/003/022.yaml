base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/022.yaml
  text: Each woman shall ask from her neighbor and from the woman staying in her house articles of silver and articles of gold[a], and clothing; and you shall put them on your sons and on your daughters[c][b]. So you will plunder Egypt.
translation:
  language: fr
  text: Chaque femme demandera[a] à sa voisine et à celle qui séjourne dans sa maison[b] des objets en argent, des objets en or et des vêtements. Vous les mettrez sur vos fils et sur vos filles. Ainsi, vous dépouillerez l’Égypte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sollicitera ». Le verbe hébreu signifie fondamentalement « demander » ; la traduction traditionnelle « empruntera » ajoute ici l’idée d’une restitution que le texte n’exprime pas.
    reason: lexical_alternative
  - marker: b
    text: Ou « à l’étrangère qui réside dans sa maison ». Le terme peut désigner une personne qui séjourne quelque part ou une résidente étrangère.
    reason: lexical_alternative
  - marker: c
    text: Ou « pillerez l’Égypte » ou « vous priverez l’Égypte de ses biens ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלָה
  choice: demandera
  rationale: Le verbe שׁאל signifie couramment « demander » ou « solliciter ». Le contexte n’exprime ni emprunt ni obligation de rendre les biens.
- source_word: אִשָּׁה
  choice: Chaque femme
  rationale: Le singulier indéfini a ici une valeur distributive, rendue naturellement en français par « chaque femme ».
- source_word: מִשְּׁכֶנְתָּהּ
  choice: à sa voisine
  rationale: Le nom hébreu est féminin et désigne ici une voisine; le français permet de conserver explicitement ce genre.
- source_word: וּמִגָּרַת בֵּיתָהּ
  choice: à celle qui séjourne dans sa maison
  rationale: Le participe issu de גור désigne une femme qui séjourne ou réside là, éventuellement comme étrangère. La formulation retenue reste naturelle sans préciser indûment son statut.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: des objets en argent, des objets en or
  rationale: כְּלִי est un terme large pouvant désigner divers objets ou ustensiles; « objets » évite de les réduire à des bijoux ou à des récipients.
- source_word: וּשְׂמָלֹת
  choice: des vêtements
  rationale: Terme général désignant des habits; « vêtements » en conserve l’étendue dans un français actuel.
- source_word: וְשַׂמְתֶּם עַל
  choice: Vous les mettrez à
  rationale: Cette tournure française exprime naturellement le fait de placer ces biens ou vêtements sur les enfants pour qu’ils les portent, tout en restant proche de שׂים + עַל.
- source_word: בְּנֵיכֶם ... בְּנֹתֵיכֶם
  choice: vos fils et vos filles
  rationale: L’hébreu nomme distinctement les fils et les filles; la traduction conserve les deux termes.
- source_word: וְנִצַּלְתֶּם אֶת מִצְרָיִם
  choice: Ainsi, vous dépouillerez l’Égypte
  rationale: Au piel, נצל signifie ici enlever les biens, dépouiller ou piller. « Dépouiller » conserve la force du renversement sans suggérer un simple emprunt.
theological_decisions:
- issue: Risque d’atténuer moralement ou théologiquement la prise des biens égyptiens
  choice: vous dépouillerez l’Égypte
  alternative: vous pillerez l’Égypte
  rationale: Le texte présente une prise effective des biens, non un emprunt destiné à être remboursé. La traduction conserve cette tension et n’adoucit pas l’action décrite.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe demeure proche de l’hébreu tout en étant idiomatique. Les termes larges « objets » et « vêtements » évitent une précision absente de la source; les notes préservent les nuances de שׁאל, גור et נצל.
