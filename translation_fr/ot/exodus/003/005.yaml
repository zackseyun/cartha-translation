review_pass:
  verdict: revise
  source_fidelity: 'Le projet rend correctement la progression narrative, l’interdiction, l’ordre d’enlever les sandales et le motif de sainteté. Toutefois, « Ne t’approche pas d’ici » est syntaxiquement et sémantiquement moins net en français moderne : « d’ici » peut se rattacher au point de départ plutôt qu’au lieu interdit. Le substantif אַדְמַת désigne le sol/la terre ; « le sol ... est saint » exprime plus directement le prédicat hébreu que « le lieu ... est une terre sainte ».'
  naturalness: 'La version révisée est plus idiomatique en français international moderne : « Ne t’approche pas davantage » formule clairement l’interdiction de s’avancer, et « le sol où tu te tiens est saint » est naturel sans transformer « terre sainte » en désignation géographique ou expression figée.'
  terminology: « Sandales », « retire », « saint » et « sol » conviennent au contexte et au registre. La note conserve la valeur littérale du construit אַדְמַת־קֹדֶשׁ sans ajouter d’interprétation sur l’origine de la sainteté.
  issues:
  - severity: medium
    issue: Ambiguïté de « Ne t’approche pas d’ici »
    rationale: Après « s’approcher », « d’ici » est moins idiomatique et peut être compris comme indiquant le lieu depuis lequel il ne faut pas s’approcher. Le sens de הֲלֹם est mieux rendu par l’interdiction de s’avancer davantage.
  - severity: low
    issue: « Le lieu ... est une terre sainte » est lourd et moins précis
    rationale: Le texte hébreu qualifie le lieu comme « sol/terre de sainteté ». En français, « le sol où tu te tiens est saint » préserve l’imagerie du sol et produit une prédication plus naturelle.
  revised_text: 'Puis il dit : « Ne t’approche pas davantage. Retire tes sandales de tes pieds, car le sol où tu te tiens est saint[a]. »'
  revised_footnotes:
