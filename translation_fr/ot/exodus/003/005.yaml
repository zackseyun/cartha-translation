  text: וַ/יֹּ֖אמֶר אַל תִּקְרַ֣ב הֲלֹ֑ם שַׁל נְעָלֶ֨י/ךָ֙ מֵ/עַ֣ל רַגְלֶ֔י/ךָ כִּ֣י הַ/מָּק֗וֹם אֲשֶׁ֤ר אַתָּה֙ עוֹמֵ֣ד עָלָ֔י/ו אַדְמַת קֹ֖דֶשׁ הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/005.yaml
  text: Then he said[a], “Do not come near here. Remove your sandals from your feet[b], because the place where you are standing is holy ground.”
translation:
  language: fr
  text: 'Puis il dit : « Ne t’approche pas davantage. Retire tes sandales de tes pieds, car le sol où tu te tiens est saint[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un sol de sainteté » ou « une terre de sainteté ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Puis il dit
  rationale: Le waw consécutif fait progresser le récit. « Puis » exprime naturellement cette succession en français moderne.
- source_word: אַל תִּקְרַב הֲלֹם
  choice: Ne t’approche pas d’ici
  rationale: La négation suivie de l’inaccompli exprime une interdiction. הֲלֹם désigne le lieu où se manifeste Dieu ; « d’ici » est idiomatique après « s’approcher ».
- source_word: שַׁל נְעָלֶיךָ מֵעַל רַגְלֶיךָ
  choice: Retire tes sandales de tes pieds
  rationale: « Retire » rend l’impératif שַׁל, tandis que « sandales » conserve la réalité concrète du contexte ancien et « de tes pieds » représente explicitement מֵעַל רַגְלֶיךָ.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’ordre. « Car » convient au registre digne du discours direct tout en restant courant.
- source_word: הַמָּקוֹם אֲשֶׁר אַתָּה עוֹמֵד עָלָיו
  choice: le lieu où tu te tiens
  rationale: Cette formulation française naturelle conserve la référence précise au lieu sur lequel Moïse se tient, sans répéter lourdement « sur lequel ».
- source_word: אַדְמַת קֹדֶשׁ
  choice: une terre sainte
  rationale: Le groupe construit signifie littéralement « terre/sol de sainteté ». « Une terre sainte » rend le sens prédicatif sans faire de « terre sainte » un nom propre.
- source_word: הוּא
  choice: est
  rationale: Le pronom hébreu contribue à la proposition nominale ; la copule « est » est nécessaire en français.
theological_decisions:
- issue: Nature de la sainteté du lieu
  choice: Décrire simplement le lieu comme « une terre sainte »
  alternative: Préciser que la terre est sanctifiée par la présence de Dieu
  rationale: Le verset affirme la sainteté du sol dans le cadre de la rencontre divine, mais n’en formule pas explicitement le mécanisme. La traduction n’ajoute donc aucune explication doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond au singulier hébreu et au discours direct adressé à Moïse. La syntaxe évite l’archaïsme tout en maintenant la solennité de l’ordre divin.
