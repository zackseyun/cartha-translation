  text: לֵ֣ךְ וְ/אָֽסַפְתָּ֞ אֶת זִקְנֵ֣י יִשְׂרָאֵ֗ל וְ/אָמַרְתָּ֤ אֲלֵ/הֶם֙ יְהוָ֞ה אֱלֹהֵ֤י אֲבֹֽתֵי/כֶם֙ נִרְאָ֣ה אֵלַ֔/י אֱלֹהֵ֧י אַבְרָהָ֛ם יִצְחָ֥ק וְ/יַעֲקֹ֖ב לֵ/אמֹ֑ר פָּקֹ֤ד פָּקַ֨דְתִּי֙ אֶתְ/כֶ֔ם וְ/אֶת הֶ/עָשׂ֥וּי לָ/כֶ֖ם בְּ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/016.yaml
  text: 'Go and gather the elders of Israel[a], and say to them, ‘Yahweh, the God of your fathers—the God of Abraham, Isaac, and Jacob—has appeared to me[b], saying: “I have surely attended to you and to what has been done to you in Egypt.”’'
translation:
  language: fr
  text: 'Va rassembler les anciens d’Israël et dis-leur : « Yahweh, le Dieu de vos pères — le Dieu d’Abraham, d’Isaac et de Jacob — m’est apparu et m’a dit : “Je me suis bel et bien préoccupé de vous et de ce qu’on vous a fait en Égypte.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ וְאָסַפְתָּ
  choice: Va rassembler
  rationale: L’impératif suivi du parfait à valeur injonctive forme une commission continue. « Va rassembler » est naturel en français et conserve la force directe de l’ordre.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: les anciens d’Israël
  rationale: Désignation sociale et politique consacrée des responsables de la communauté d’Israël.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: le Dieu de vos pères
  rationale: Le contexte précise le référent patriarcal par Abraham, Isaac et Jacob ; « pères » préserve cette formulation.
- source_word: נִרְאָה אֵלַי
  choice: m’est apparu
  rationale: Le niphal de ראה est l’expression habituelle d’une manifestation divine. Le passé composé convient à un événement récent ayant une portée présente.
- source_word: לֵאמֹר
  choice: et m’a dit
  rationale: Dans ce contexte, le marqueur de discours est rendu naturellement en français par une proposition coordonnée introduisant les paroles divines.
- source_word: פָּקֹד פָּקַדְתִּי אֶתְכֶם
  choice: Oui, je suis intervenu en votre faveur
  rationale: L’infinitif absolu intensifie le verbe. פקד exprime ici une attention divine décisive qui conduit à l’action ; « intervenir en faveur de » communique mieux cette portée que le littéral « visiter ».
- source_word: וְאֶת הֶעָשׂוּי לָכֶם
  choice: et j’ai vu ce qu’on vous fait
  rationale: Le second complément dépend de פקד, mais la répétition en français de « je suis intervenu en faveur de ce qu’on vous fait » serait impossible. « J’ai vu » explicite sobrement l’attention portée aux sévices, tandis que le présent rend la valeur durative possible du participe passif et que « on » n’ajoute aucun auteur précis.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le tétragramme comme nom personnel de Dieu ; « Yahweh » le distingue du titre אֲדֹנָי.
- issue: Portée de פקד
  choice: je suis intervenu en votre faveur
  alternative: je vous ai visités / je me suis occupé de vous
  rationale: 'Dans le contexte de la délivrance annoncée, le verbe désigne plus qu’une simple constatation : l’attention divine devient action. La note conserve toutefois le sens traditionnel et l’étendue sémantique du terme.'
- issue: Valeur temporelle de הֶעָשׂוּי
  choice: ce qu’on vous fait
  alternative: ce qu’on vous a fait
  rationale: Le participe passif peut viser les mauvais traitements en cours ou, plus globalement, ceux déjà subis. Le présent convient à l’oppression encore actuelle sans exclure son antériorité.
translation_notes:
  register: Français international moderne, digne et accessible. Les tirets mettent en relief l’apposition patriarcale. Le discours enchâssé est distingué par des guillemets français puis anglais. « Anciens » conserve le terme institutionnel biblique ; « pères » maintient le cadre patriarcal explicité dans le verset.
