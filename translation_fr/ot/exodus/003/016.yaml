    text: 'Littéralement, l’hébreu répète le verbe : « Je me suis certainement préoccupé de vous ». Autre traduction traditionnelle : « Je vous ai sûrement visités. » Cette intensification exprime une attention divine résolue, susceptible de conduire à l’intervention.'
    reason: lexical_alternative
