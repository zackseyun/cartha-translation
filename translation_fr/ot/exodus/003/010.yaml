  text: וְ/עַתָּ֣ה לְכָ֔/ה וְ/אֶֽשְׁלָחֲ/ךָ֖ אֶל פַּרְעֹ֑ה וְ/הוֹצֵ֛א אֶת עַמִּ֥/י בְנֵֽי יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/010.yaml
  text: And now[a], come, and I will send you to Pharaoh, and bring my people, the sons of Israel, out of Egypt.
translation:
  language: fr
  text: Et maintenant, va ! Je t’enverrai auprès du pharaon ; fais sortir d’Égypte mon peuple, les fils d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus idiomatique : « les Israélites ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Rend à la fois la conjonction וְ et la transition temporelle et discursive עַתָּה, tout en restant naturel en français.
- source_word: לְכָה
  choice: va
  rationale: Dans le contexte d’un envoi vers le pharaon, l’impératif français « va » exprime clairement le déplacement et la mission confiée à Moïse.
- source_word: וְאֶשְׁלָחֲךָ
  choice: Je t’envoie
  rationale: Le présent français d’énonciation convient naturellement à l’acte de mission accompli par cette parole et conserve la force directe de l’hébreu.
- source_word: אֶל־פַּרְעֹה
  choice: auprès du pharaon
  rationale: Rend la direction vers la personne du pharaon dans un français idiomatique ; l’article est requis devant ce titre.
- source_word: וְהוֹצֵא
  choice: fais sortir
  rationale: Reproduit directement la valeur causative du hiphil de יצא sans ajouter l’idée de conduire, absente du verbe lui-même.
- source_word: עַמִּי
  choice: mon peuple
  rationale: Préserve sans atténuation la désignation possessive, importante dans la relation entre Dieu et Israël.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Conserve la forme familiale et ancestrale du syntagme hébreu ; l’équivalent ethnique plus courant est signalé en note.
- source_word: מִמִּצְרָיִם
  choice: d’Égypte
  rationale: Avec « faire sortir », la préposition française « de » exprime naturellement le point de départ et le mouvement hors du pays.
theological_decisions:
- issue: Désignation du peuple de l’alliance בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: La formulation principale maintient l’expression généalogique masculine de l’hébreu et son lien explicite avec l’ancêtre Israël, sans la remplacer silencieusement par une simple désignation ethnique.
translation_notes:
  register: Français moderne, clair et digne. La ponctuation distingue l’ordre initial, l’envoi divin et la mission confiée à Moïse, sans effacer leur enchaînement. « Pharaon » est traité comme un titre commun conformément à l’usage français.
