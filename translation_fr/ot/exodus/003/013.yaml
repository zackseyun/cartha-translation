  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל הָֽ/אֱלֹהִ֗ים הִנֵּ֨ה אָנֹכִ֣י בָא֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וְ/אָמַרְתִּ֣י לָ/הֶ֔ם אֱלֹהֵ֥י אֲבוֹתֵי/כֶ֖ם שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם וְ/אָֽמְרוּ לִ֣/י מַה שְּׁמ֔/וֹ מָ֥ה אֹמַ֖ר אֲלֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/013.yaml
  text: Then Moses said to God, “Look, when I come to the sons of Israel and say to them, ‘The God of your fathers has sent me to you,’ and they say to me, ‘What is his name?’ what shall I say to them?”
translation:
  language: fr
  text: 'Moïse dit à Dieu : « Voici, lorsque je viendrai auprès des Israélites et que je leur dirai : “Le Dieu de vos pères m’a envoyé vers vous”, ils me diront : “Quel est son nom ?” Que leur dirai-je ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Marque ici l’introduction vive d’une situation envisagée; « Voici » conserve cette fonction discursive dans un registre digne, sans la réduire à un simple « quand ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Équivalent français naturel et courant de « fils d’Israël » lorsqu’il désigne collectivement le peuple.
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: Le Dieu de vos pères
  rationale: Conserve la formulation ancestrale et relationnelle de l’hébreu; « pères » est ici plus précis que « ancêtres » pour cette expression biblique.
- source_word: מַה שְּׁמוֹ
  choice: Quel est son nom ?
  rationale: Rend directement la question hébraïque, dont l’enjeu porte sur l’identité et la désignation de Dieu, sans l’expliciter davantage.
- source_word: מָה אֹמַר אֲלֵהֶם
  choice: que leur répondrai-je ?
  rationale: Dans ce contexte de question rapportée, « répondre » exprime naturellement en français le sens pragmatique de « que leur dirai-je ? » sans modifier le contenu.
theological_decisions:
- issue: Portée de la demande concernant le nom divin
  choice: Conserver la question simple « Quel est son nom ? »
  alternative: Expliciter par « Comment s’appelle-t-il ? » ou « Quelle est son identité ? »
  rationale: Le texte peut viser à la fois la désignation et l’identité révélée de Dieu. La traduction littérale naturelle préserve cette richesse sans imposer une interprétation.
- issue: Désignation des ancêtres d’Israël
  choice: « vos pères »
  alternative: « vos ancêtres »
  rationale: « Pères » maintient l’écho traditionnel aux patriarches et la tension contextuelle, sans préciser des noms que le verset ne donne pas.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe a été légèrement restructurée avec « s’ils me demandent » afin d’éviter une coordination lourde, tout en conservant la situation hypothétique exprimée par Moïse.
