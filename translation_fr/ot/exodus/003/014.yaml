  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל מֹשֶׁ֔ה אֶֽהְיֶ֖ה אֲשֶׁ֣ר אֶֽהְיֶ֑ה וַ/יֹּ֗אמֶר כֹּ֤ה תֹאמַר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל אֶֽהְיֶ֖ה שְׁלָחַ֥/נִי אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/014.yaml
  text: 'And God said to Moses[a], “I AM WHO I AM.” And he said[b], “Thus you shall say to the sons of Israel: ‘I AM has sent me to you.’”'
translation:
  language: fr
  text: 'Dieu dit à Moïse : « JE SUIS QUI JE SUIS[a]. » Puis il dit : « Voici ce que tu diras aux fils d’Israël : “JE SUIS m’a envoyé vers vous.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « JE SERAI QUI JE SERAI », ou : « JE SERAI CE QUE JE SERAI ». Le verbe hébreu peut avoir ici une valeur future aussi bien que présente.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte narratif, la forme morphologiquement plurielle désigne au singulier le Dieu d’Israël.
- source_word: אֶהְיֶה
  choice: JE SUIS
  rationale: L’imparfait qal à la première personne du singulier peut avoir ici une valeur présente ou future. « JE SUIS » convient à l’auto-identification et à sa reprise comme désignation divine, tandis que la valeur future est conservée en note.
- source_word: אֲשֶׁר
  choice: qui
  rationale: Dans cette formule d’auto-identification personnelle, « qui » est naturel en français et conserve le caractère ouvert de la relation entre les deux propositions.
- source_word: כֹּה תֹאמַר
  choice: Voici ce que tu diras
  rationale: Cette formulation française actuelle rend à la fois l’introduction de la parole rapportée par כֹּה et la valeur directive de l’imparfait תֹאמַר.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: Le rendu conserve l’expression hébraïque et sa forme masculine, plutôt que de la neutraliser par « aux Israélites ».
- source_word: שְׁלָחַנִי
  choice: m’a envoyé
  rationale: Le passé composé exprime naturellement en français l’action accomplie dont la mission présente de Moïse demeure le résultat.
- source_word: וַיֹּאמֶר
  choice: dit / Puis il dit
  rationale: Le premier verbe est rendu simplement dans la narration; « Puis » marque avec naturel la progression vers la seconde déclaration sans alourdir le français par deux « Et » successifs.
theological_decisions:
- issue: Rendu de l’auto-désignation divine אֶהְיֶה אֲשֶׁר אֶהְיֶה
  choice: JE SUIS QUI JE SUIS
  alternative: JE SERAI QUI JE SERAI / JE SERAI CE QUE JE SERAI
  rationale: La forme hébraïque permet une nuance présente aussi bien que future. Le texte principal retient la lecture traditionnelle à valeur d’auto-identification, mais la note maintient explicitement les lectures futures possibles afin de ne pas supprimer l’ambiguïté réelle.
- issue: Emploi des majuscules pour JE SUIS
  choice: JE SUIS
  alternative: Je suis / Je serai
  rationale: Les majuscules signalent la fonction particulière de l’expression comme auto-désignation divine et rendent visible sa reprise dans la seconde moitié du verset; elles relèvent de la présentation française, non d’une différence graphique propre à l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste solennelle sans archaïsmes. « Fils d’Israël » conserve la forme de l’hébreu; aucune note distincte n’est nécessaire puisque ce choix figure directement dans le texte.
