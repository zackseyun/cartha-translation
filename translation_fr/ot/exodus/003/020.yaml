id: EXO.3.20
reference: Exodus 3:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/שָׁלַחְתִּ֤י אֶת יָדִ/י֙ וְ/הִכֵּיתִ֣י אֶת מִצְרַ֔יִם בְּ/כֹל֙ נִפְלְאֹתַ֔/י אֲשֶׁ֥ר אֶֽעֱשֶׂ֖ה בְּ/קִרְבּ֑/וֹ וְ/אַחֲרֵי כֵ֖ן יְשַׁלַּ֥ח אֶתְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/020.yaml
  text: And I will stretch out my hand and strike Egypt with all my wonders that I will do in its midst[b][a]; and after that he will send you out.
translation:
  language: fr
  text: J’étendrai ma main et je frapperai l’Égypte par tous les prodiges que j’accomplirai en son sein ; après cela, il vous laissera partir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il vous renverra ». L’hébreu dit plus littéralement « il vous enverra dehors ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי אֶת־יָדִי
  choice: J’étendrai ma main
  rationale: Littéralement, le verbe signifie « envoyer », mais l’expression hébraïque désigne la main étendue pour agir avec puissance. La tournure française conserve l’image concrète et reste naturelle.
- source_word: וְהִכֵּיתִי
  choice: et je frapperai
  rationale: Le verbe נכה signifie couramment « frapper ». Ce choix convient aux fléaux annoncés sans préciser indûment la mort ou la destruction totale.
- source_word: מִצְרַיִם
  choice: l’Égypte
  rationale: Le nom désigne ici l’Égypte comme pays et entité collective, plutôt que seulement ses habitants.
- source_word: בְּכֹל נִפְלְאֹתַי
  choice: par tous les prodiges
  rationale: נפלאות désigne des actes extraordinaires qui suscitent l’émerveillement. « Prodiges » est clair, digne et bien adapté au contexte biblique.
- source_word: אֲשֶׁר אֶעֱשֶׂה
  choice: que j’accomplirai
  rationale: « Accomplir » rend naturellement l’action de faire ces prodiges en français, sans ajouter d’idée étrangère au texte.
- source_word: בְּקִרְבּוֹ
  choice: en son sein
  rationale: Le suffixe masculin singulier renvoie naturellement à l’Égypte envisagée comme entité collective. Cette formulation préserve le singulier et l’idée d’une action au cœur du pays.
- source_word: וְאַחֲרֵי כֵן
  choice: après cela
  rationale: Cette expression marque simplement la succession temporelle.
- source_word: יְשַׁלַּח אֶתְכֶם
  choice: il vous laissera partir
  rationale: Dans ce contexte, שׁלח exprime le fait que le pharaon autorisera le peuple à partir. Cette formulation est idiomatique en français, tandis qu’une note conserve le sens plus littéral.
theological_decisions:
- issue: Langage anthropomorphique décrivant l’action divine
  choice: Conserver l’image « J’étendrai ma main »
  alternative: Rendre abstraitement par « Je déploierai ma puissance »
  rationale: L’hébreu présente l’intervention de Dieu au moyen d’une image corporelle concrète. La conserver respecte le sens manifeste du texte sans imposer une reformulation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la progression de l’hébreu, et le point-virgule marque la séquence entre l’intervention divine et la libération du peuple.
