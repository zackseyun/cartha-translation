  text: וַ/יֹּ֣אמֶר יְהוָ֔ה רָאֹ֥ה רָאִ֛יתִי אֶת עֳנִ֥י עַמִּ֖/י אֲשֶׁ֣ר בְּ/מִצְרָ֑יִם וְ/אֶת צַעֲקָתָ֤/ם שָׁמַ֨עְתִּי֙ מִ/פְּנֵ֣י נֹֽגְשָׂ֔י/ו כִּ֥י יָדַ֖עְתִּי אֶת מַכְאֹבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/007.yaml
  text: Then Yahweh said[a], “I have surely seen the affliction of my people who are in Egypt, and I have heard their cry because of their oppressors[c][b], for I know their sufferings.”
translation:
  language: fr
  text: 'Alors Yahweh dit : « J’ai bien vu la misère de mon peuple qui est en Égypte, et j’ai entendu ses cris à cause de ceux qui l’oppriment[a], car je connais ses souffrances. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à cause de ceux qui lui imposent des corvées »; le terme hébreu peut désigner des oppresseurs, des surveillants de travaux forcés ou ceux qui exigent un tribut.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel révélé dans le contexte immédiat, plutôt que de lui substituer un titre.
- source_word: רָאֹה רָאִיתִי
  choice: Oui, j’ai vu
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’affirmation. Cette tournure rend l’insistance de façon naturelle en français moderne.
- source_word: עֳנִי
  choice: la misère
  rationale: Le nom désigne la condition pénible et humiliée du peuple sous l’oppression; « misère » en exprime ici à la fois la détresse et la dureté.
- source_word: עַמִּי אֲשֶׁר בְּמִצְרָיִם
  choice: mon peuple qui est en Égypte
  rationale: La proposition relative est conservée et rattachée clairement à « mon peuple ».
- source_word: צַעֲקָתָם
  choice: ses cris
  rationale: Le nom désigne les appels poussés dans la détresse. Le pluriel français est idiomatique avec le collectif singulier « mon peuple ».
- source_word: מִפְּנֵי נֹגְשָׂיו
  choice: à cause de ceux qui l’oppriment
  rationale: מִפְּנֵי exprime ici la cause, tandis que נֹגְשָׂיו désigne ceux qui pressurent le peuple et lui imposent un travail ou des obligations pénibles.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit l’explication qui fonde l’affirmation précédente.
- source_word: יָדַעְתִּי אֶת מַכְאֹבָיו
  choice: je connais ses souffrances
  rationale: Le parfait hébreu exprime ici une connaissance actuelle et engagée; « souffrances » rend naturellement le pluriel des douleurs éprouvées.
theological_decisions:
- issue: Rendu du nom divin YHWH
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: « Yahweh » préserve le caractère personnel et covenantal du nom divin sans le remplacer par un titre.
- issue: Langage de la connaissance divine
  choice: je connais ses souffrances
  alternative: je suis conscient de ses souffrances; j’ai pris connaissance de ses douleurs
  rationale: Le texte présente la connaissance de Dieu en termes directs et personnels. La formulation retenue conserve cette proximité sans l’atténuer ni l’expliquer.
- issue: Force emphatique de רָאֹה רָאִיתִי
  choice: Oui, j’ai vu
  alternative: J’ai vraiment vu; J’ai bien vu
  rationale: Le redoublement verbal hébreu affirme avec force que la misère du peuple n’a pas échappé à Yahweh; la traduction garde cette insistance sans reproduire artificiellement la syntaxe hébraïque.
translation_notes:
  register: Français international moderne, naturel et digne. Les pronoms singuliers « ses » et « l’ » reprennent le collectif « mon peuple ». L’emphase hébraïque est rendue dans le corps du texte par « Oui, j’ai vu », sans note supplémentaire.
