  text: וְ/עָשִׂ֤יתָ לּ/וֹ֙ מִכְבָּ֔ר מַעֲשֵׂ֖ה רֶ֣שֶׁת נְחֹ֑שֶׁת וְ/עָשִׂ֣יתָ עַל הָ/רֶ֗שֶׁת אַרְבַּע֙ טַבְּעֹ֣ת נְחֹ֔שֶׁת עַ֖ל אַרְבַּ֥ע קְצוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/004.yaml
  text: You shall make for it a grating[a], a network of bronze[b], and on the network you shall make four bronze rings at its four corners.
translation:
  language: fr
  text: Tu lui feras une grille[a], ouvrage en treillis de bronze, et tu feras sur le treillis quatre anneaux de bronze, à ses quatre coins[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un treillis de bronze » ou « un ouvrage en filet de bronze ». L’hébreu dit littéralement : « une grille, ouvrage de filet, de bronze ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « à ses quatre extrémités ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְבָּר
  choice: grille
  rationale: Le terme désigne une structure ajourée associée à l’autel. « Grille » est précis, naturel en français moderne et convient à l’objet décrit.
- source_word: מַעֲשֵׂה רֶשֶׁת
  choice: ouvrage en treillis
  rationale: Cette formulation rend l’expression littérale « ouvrage de filet/réseau » tout en décrivant clairement une structure entrecroisée. La reprise de « treillis » dans la proposition suivante préserve le lien lexical avec רֶשֶׁת.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Dans les instructions relatives au sanctuaire, « bronze » est le rendu contextuel traditionnel et approprié pour le métal ou alliage désigné.
- source_word: עַל הָרֶשֶׁת
  choice: sur le treillis
  rationale: La préposition עַל indique naturellement la position des anneaux sur le treillis; ce choix conserve aussi la répétition de רֶשֶׁת.
- source_word: טַבְּעֹת
  choice: anneaux
  rationale: Le nom désigne couramment des anneaux servant de points d’attache ou au passage de barres dans les instructions du sanctuaire.
- source_word: קְצוֹתָיו
  choice: ses quatre coins
  rationale: Le mot désigne les extrémités. Pour une grille quadrangulaire, « coins » est l’expression française la plus claire et idiomatique, sans exclure le sens plus général signalé en note.
- source_word: לּוֹ
  choice: lui
  rationale: Le pronom renvoie à l’autel; en français, le pronom indirect « lui » convient aussi à un antécédent inanimé.
- source_word: וְעָשִׂיתָ
  choice: Tu lui feras / tu feras
  rationale: Le futur à valeur d’instruction rend naturellement la suite des prescriptions en français. La coordination « et » est conservée entre les deux actions.
