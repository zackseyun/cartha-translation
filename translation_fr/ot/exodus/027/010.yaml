translation:
  language: fr
  text: avec ses vingt poteaux et leurs vingt socles en bronze[a]. Les crochets des poteaux et leurs bandes[b] seront en argent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « bases » : il s’agit des supports placés sous les poteaux.'
    reason: lexical_alternative
  - marker: b
    text: Le sens précis du terme hébreu est incertain; il peut désigner des bandes ou des pièces de liaison.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדָיו
  choice: ses vingt poteaux
  rationale: עַמּוּד désigne un poteau ou une colonne. Le suffixe masculin singulier renvoie à l’ensemble décrit au verset précédent; « ses vingt poteaux » est naturel en français.
- source_word: אַדְנֵיהֶם
  choice: leurs vingt socles
  rationale: Dans les descriptions du sanctuaire, אֶדֶן désigne la pièce de base qui soutient un élément vertical. « Socles » convient au contexte architectural; « bases » reste possible.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: נְחֹשֶׁת peut désigner le cuivre ou le bronze. « Bronze » est le terme conventionnel et vraisemblable dans ce contexte de mobilier et d’éléments architecturaux.
- source_word: וָוֵי
  choice: crochets
  rationale: וָו désigne ici les crochets fixés aux poteaux, sens bien adapté à leur fonction dans la structure.
- source_word: חֲשֻׁקֵיהֶם
  choice: leurs tringles
  rationale: Le référent architectural précis est incertain. « Tringles » exprime de façon intelligible des pièces métalliques liées aux poteaux sans adopter le terme français vieilli « baguettes » ni préciser excessivement leur forme.
- source_word: כָּסֶף
  choice: en argent
  rationale: כָּסֶף désigne sans ambiguïté l’argent; la tournure française « seront en argent » restitue la proposition nominale hébraïque.
- source_word: וְ
  choice: avec / et
  rationale: La conjonction initiale poursuit la phrase commencée au verset précédent; « avec » assure cette continuité, tandis que la coordination interne est rendue par « et ».
