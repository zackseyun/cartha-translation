base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/021.yaml
  text: In the tent of meeting[a], outside the veil that is before the testimony, Aaron and his sons shall arrange it before Yahweh from evening until morning[c][b]. It shall be a perpetual statute throughout their generations from the Israelites.
translation:
  language: fr
  text: Dans la tente de la rencontre, à l’extérieur du voile qui est devant le Témoignage[a], Aaron et ses fils la disposeront devant Yahweh, du soir jusqu’au matin. Ce sera pour les Israélites une prescription perpétuelle, de génération en génération[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « Témoignage » désigne probablement les tablettes de l’alliance déposées dans le coffre ; l’expression situe donc le voile par rapport à celui-ci.
    reason: cultural_note
  - marker: b
    text: Litt. « de la part des Israélites ». L’expression peut indiquer la provenance ou la responsabilité de cette obligation.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: Rend naturellement la désignation cultuelle אֹהֶל מוֹעֵד tout en conservant sa valeur technique.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: à l’extérieur du voile
  rationale: פָּרֹכֶת désigne le voile séparant le sanctuaire intérieur; « voile » est clair et consacré par l’usage biblique.
- source_word: אֲשֶׁר עַל הָעֵדֻת
  choice: qui est devant le Témoignage
  rationale: Dans cette description spatiale, עַל situe le voile par rapport au coffre contenant le Témoignage; « devant » exprime cette relation sans surinterpréter.
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: la disposeront
  rationale: ערך signifie mettre en ordre ou disposer. Le pronom féminin français renvoie à la lampe mentionnée dans le contexte précédent; le sujet composé appelle le pluriel en français.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: du soir jusqu’au matin
  rationale: Expression temporelle française naturelle qui conserve toute la durée indiquée par l’hébreu.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: Conserve l’idiome cultuel לִפְנֵי et transcrit directement le nom divin יהוה.
- source_word: חֻקַּת עוֹלָם
  choice: une prescription perpétuelle
  rationale: « Prescription » convient au cadre cultuel et juridique; « perpétuelle » préserve la force durable de עוֹלָם sans explicitation doctrinale.
- source_word: לְדֹרֹתָם
  choice: de génération en génération
  rationale: Formulation idiomatique moderne exprimant la continuité à travers leurs générations.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: de la part des Israélites
  rationale: מֵאֵת marque ici la provenance ou la responsabilité; cette formulation conserve cette souplesse mieux qu’une paraphrase telle que « à la charge de ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom d’alliance sans le remplacer par un titre.
- issue: Portée de חֻקַּת עוֹלָם
  choice: une prescription perpétuelle
  alternative: une prescription permanente
  rationale: « Perpétuelle » restitue la force de la formule juridique hébraïque tout en laissant son étendue théologique à l’interprétation du contexte canonique.
- issue: Référent du pronom dans יַעֲרֹךְ אֹתוֹ
  choice: la disposeront
  alternative: en assureront le service
  rationale: Le pronom singulier renvoie vraisemblablement à la lampe du verset précédent. Le rendu conserve ce renvoi plutôt que d’expliciter une activité cultuelle plus large.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe suit étroitement l’ordre spatial et cultuel de l’hébreu sans devenir artificielle. Les termes techniques « tente de la rencontre », « voile » et « Témoignage » sont maintenus; la majuscule à « Témoignage » signale ici son emploi cultuel particulier.
