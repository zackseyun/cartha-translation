  text: וְ/לַ/כָּתֵף֙ הַ/שֵּׁנִ֔ית חְמֵ֥שׁ עֶשְׂרֵ֖ה קְלָעִ֑ים עַמֻּדֵי/הֶ֣ם שְׁלֹשָׁ֔ה וְ/אַדְנֵי/הֶ֖ם שְׁלֹשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/015.yaml
  text: And for the second side there shall be fifteen cubits of hangings[c][b][a], with three pillars and their three bases.
translation:
  language: fr
  text: Pour le second côté, il y aura quinze coudées de tentures[a], avec leurs trois poteaux et leurs trois socles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « quinze tentures ». L’unité « coudées » n’est pas exprimée ici, mais elle est sous-entendue d’après la formulation parallèle du verset 14.'
    reason: implicit_measurement_unit
lexical_decisions:
- source_word: וְ/לַ/כָּתֵף
  choice: Pour le … côté
  rationale: כָּתֵף signifie littéralement « épaule », mais désigne ici un côté ou un flanc de l’entrée de la cour. « Pour le … côté » convient naturellement au contexte architectural.
- source_word: הַ/שֵּׁנִית
  choice: second
  rationale: L’ordinal signifie directement « second »; dans le contexte, il s’agit du côté correspondant opposé.
- source_word: חְמֵשׁ עֶשְׂרֵה
  choice: quinze coudées
  rationale: Le texte porte littéralement « quinze », sans unité exprimée. D’après la construction parallèle du verset précédent, il s’agit d’une longueur en coudées; l’unité est donc explicitée dans le texte et signalée en note.
- source_word: קְלָעִים
  choice: tentures
  rationale: Dans les descriptions de la cour du sanctuaire, le terme désigne les pièces de tissu tissé qui forment l’enceinte. « Tentures » est clair, précis et naturel en français.
- source_word: עַמֻּדֵי/הֶם
  choice: leurs trois poteaux
  rationale: עַמּוּד désigne ici les supports verticaux des tentures. « Poteaux » est plus naturel que « colonnes » dans cette structure de cour.
- source_word: וְ/אַדְנֵי/הֶם
  choice: leurs trois socles
  rationale: אֶדֶן désigne les pièces de fondation dans lesquelles reposent les poteaux. « Socles » exprime clairement leur fonction structurelle.
theological_decisions: []
translation_notes:
  register: 'Français moderne, digne et accessible. La tournure « il y aura » complète naturellement la phrase nominale hébraïque. Le vocabulaire architectural reste concret et cohérent : « tentures », « poteaux », « socles ».'
