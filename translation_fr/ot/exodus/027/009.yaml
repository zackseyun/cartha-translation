  text: וְ/עָשִׂ֕יתָ אֵ֖ת חֲצַ֣ר הַ/מִּשְׁכָּ֑ן לִ/פְאַ֣ת נֶֽגֶב תֵּ֠ימָנָ/ה קְלָעִ֨ים לֶ/חָצֵ֜ר שֵׁ֣שׁ מָשְׁזָ֗ר מֵאָ֤ה בָֽ/אַמָּה֙ אֹ֔רֶךְ לַ/פֵּאָ֖ה הָ/אֶחָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/009.yaml
  text: And you shall make the court of the tabernacle. For the south side[a], southward, there shall be hangings for the court of finely twisted linen, a hundred cubits long for one side.
translation:
  language: fr
  text: Tu feras le parvis du tabernacle. Du côté sud, vers le sud, le parvis aura des tentures[a] de fin lin retors, sur une longueur de cent coudées pour ce côté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rideaux ». Le terme hébreu désigne les panneaux de tissu qui formaient la clôture du parvis.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲצַר
  choice: parvis
  rationale: Dans le contexte du sanctuaire, le mot désigne l’espace découvert et délimité autour du tabernacle. « Parvis » est le terme français usuel et précis.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: Dans l’Exode, ce terme désigne la tente-sanctuaire sacrée. « Tabernacle » conserve la désignation traditionnelle tout en restant compréhensible.
- source_word: לִפְאַת נֶגֶב תֵּימָנָה
  choice: Du côté sud, vers le sud
  rationale: L’hébreu cumule la désignation du côté et l’indication directionnelle. La formulation française maintient cette insistance sans la réduire à un simple adjectif.
- source_word: קְלָעִים
  choice: tentures
  rationale: Il s’agit de panneaux de tissu suspendus qui délimitent le parvis. « Tentures » exprime naturellement leur matière et leur fonction architecturale.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: fin lin retors
  rationale: Cette expression désigne un lin de qualité dont les fils sont retordus. La formulation est concise, précise et bien établie dans le vocabulaire textile biblique français.
- source_word: מֵאָה בָאַמָּה
  choice: cent coudées
  rationale: La mesure ancienne est conservée plutôt que convertie, afin de préserver le cadre historique du texte.
- source_word: אֹרֶךְ
  choice: sur une longueur de
  rationale: Cette tournure rend explicitement et naturellement en français la dimension indiquée par le substantif hébreu « longueur ».
- source_word: לַפֵּאָה הָאֶחָת
  choice: pour ce côté
  rationale: L’expression renvoie au côté particulier qui vient d’être nommé. « Ce côté » rend ce lien plus clairement en français que le calque « un côté ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La répétition directionnelle de l’hébreu (« côté sud, vers le sud ») est conservée, tandis que la syntaxe est légèrement réorganisée pour rester naturelle. Le marqueur de note est placé après « tentures », terme auquel la note se rapporte.
