  - severity: low
    issue: « Attaches » est trop générique pour חֲשֻׁקִים
    rationale: Le terme désigne vraisemblablement des éléments d’entourage ou de liaison des poteaux; « bandes » reflète mieux cette fonction sans prétendre résoudre le détail technique.
