  text: וְ/כֵ֨ן לִ/פְאַ֤ת צָפוֹן֙ בָּ/אֹ֔רֶךְ קְלָעִ֖ים מֵ֣אָה אֹ֑רֶךְ ו/עמד/ו עֶשְׂרִ֗ים וְ/אַדְנֵי/הֶ֤ם עֶשְׂרִים֙ נְחֹ֔שֶׁת וָוֵ֧י הָֽ/עַמֻּדִ֛ים וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/011.yaml
  text: 'And likewise for the north side in length: hangings a hundred cubits long[a], its twenty pillars and their twenty bronze bases[b], and the hooks of the pillars and their bands shall be silver.'
translation:
  language: fr
  text: De même, pour le côté nord, sur une longueur de cent coudées[a], il y aura des tentures, avec ses vingt poteaux et leurs vingt socles de bronze. Les crochets des poteaux et leurs bandes[b] seront en argent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit simplement « cent en longueur »; « coudées » est précisé d’après les mesures données dans le contexte immédiat.
    reason: cultural_note
  - marker: b
    text: Ou « leurs attaches » ou « leurs tringles »; le terme hébreu désigne des pièces servant à relier ou à entourer les poteaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  choice: De même
  rationale: Introduit naturellement la correspondance avec les dispositions du côté précédent.
- source_word: לִפְאַת צָפוֹן
  choice: sur le côté nord
  rationale: פֵּאָה désigne ici le côté ou le bord nord de la cour.
- source_word: בָּאֹרֶךְ
  choice: dans le sens de la longueur
  rationale: Exprime clairement en français la dimension longitudinale indiquée par l’hébreu.
- source_word: קְלָעִים
  choice: des tentures
  rationale: Dans le contexte de la cour du sanctuaire, le terme désigne les pièces textiles formant l’enceinte.
- source_word: מֵאָה אֹרֶךְ
  choice: sur cent coudées
  rationale: L’hébreu dit littéralement « cent en longueur »; l’unité, elliptique, est fournie par les mesures du contexte immédiat.
- source_word: וְעַמֻּדָיו עֶשְׂרִים
  choice: avec ses vingt poteaux
  rationale: « Poteaux » est concret et courant; le possessif rattache ces éléments au côté nord, tandis que « avec » rend lisible l’inventaire hébreu sans verbe exprimé.
- source_word: וְאַדְנֵיהֶם עֶשְׂרִים נְחֹשֶׁת
  choice: et leurs vingt socles de bronze
  rationale: אֶדֶן désigne les socles qui reçoivent les poteaux; « bronze » convient à נְחֹשֶׁת dans ce contexte.
- source_word: וָוֵי הָעַמֻּדִים
  choice: Les crochets des poteaux
  rationale: וָוִים désigne les crochets fixés aux poteaux; cette formulation reste précise et naturelle.
- source_word: וַחֲשֻׁקֵיהֶם
  choice: leurs attaches
  rationale: Le terme désigne des pièces qui relient ou entourent les poteaux. « Attaches » reste compréhensible sans imposer une forme technique incertaine.
- source_word: כָּסֶף
  choice: en argent
  rationale: Désignation directe du matériau.
theological_decisions: []
