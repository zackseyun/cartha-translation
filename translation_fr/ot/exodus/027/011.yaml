  source_fidelity: 'Le sens et l’inventaire du texte hébreu sont bien rendus : côté nord, tentures sur cent coudées, vingt poteaux, vingt socles de bronze, puis crochets et éléments de liaison en argent. L’unité « coudées », elliptique en hébreu, peut être fournie d’après le contexte immédiat et est correctement signalée.'
  naturalness: La formulation actuelle « dans le sens de la longueur ... des tentures sur cent coudées » est un peu lourde et « sur cent coudées » reste légèrement imprécis en français. « Sur une longueur de cent coudées » exprime plus idiomatiquement la donnée dimensionnelle. « Bandes » est plus précis que « attaches », qui peut évoquer des fixations ponctuelles et risque de faire double emploi avec les crochets.
  terminology: « Tentures », « poteaux », « socles de bronze » et « crochets » conviennent à un français moderne et au contexte matériel. Pour חֲשֻׁקִים, « bandes » maintient une désignation suffisamment large; la note conserve les possibilités de pièces entourant ou reliant les poteaux.
