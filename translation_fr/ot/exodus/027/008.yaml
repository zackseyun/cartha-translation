source:
  edition: WLC
  text: נְב֥וּב לֻחֹ֖ת תַּעֲשֶׂ֣ה אֹת֑/וֹ כַּ/אֲשֶׁ֨ר הֶרְאָ֥ה אֹתְ/ךָ֛ בָּ/הָ֖ר כֵּ֥ן יַעֲשֽׂוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/008.yaml
  text: You shall make it hollow[a], with boards; as it was shown to you on the mountain, so shall they make it.
translation:
  language: fr
  text: Tu le feras creux, en planches[a] ; comme cela t’a été montré sur la montagne, ainsi le feront-ils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « creux, fait de planches ». L’hébreu décrit l’autel comme une structure creuse constituée de planches.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבוּב לֻחֹת
  choice: creux, avec des planches
  rationale: L’adjectif נְבוּב indique que l’autel n’est pas massif mais creux, tandis que לֻחֹת désigne les planches constituant sa structure. Cette formulation reste proche de l’ordre hébreu tout en étant intelligible en français.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: Tu le feras
  rationale: Le futur français exprime naturellement ici l’instruction adressée à Moïse et conserve la deuxième personne du singulier.
- source_word: כַּאֲשֶׁר
  choice: tel que
  rationale: Cette locution introduit clairement la conformité au modèle révélé, sans ajouter de précision absente du texte.
- source_word: הֶרְאָה אֹתְךָ
  choice: il t’a été montré
  rationale: Le passif reflète le hophal hébreu et laisse, comme le texte source, l’auteur implicite de la révélation non nommé.
- source_word: בָּהָר
  choice: sur la montagne
  rationale: « Sur la montagne » est la tournure française idiomatique pour le lieu où le modèle a été montré.
- source_word: כֵּן יַעֲשׂוּ
  choice: ainsi le feront-ils
  rationale: La formulation maintient le verbe au pluriel et la correspondance entre le modèle montré à Moïse et l’exécution confiée aux constructeurs.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. La syntaxe légèrement soutenue « ainsi le feront-ils » préserve le contraste entre l’ordre adressé à Moïse au singulier et sa réalisation par plusieurs personnes au pluriel.
