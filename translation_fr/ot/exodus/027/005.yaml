  text: וְ/נָתַתָּ֣ה אֹתָ֗/הּ תַּ֛חַת כַּרְכֹּ֥ב הַ/מִּזְבֵּ֖חַ מִ/לְּ/מָ֑טָּה וְ/הָיְתָ֣ה הָ/רֶ֔שֶׁת עַ֖ד חֲצִ֥י הַ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/005.yaml
  text: And you shall put it under the ledge of the altar from below[b][a], and the net shall extend to halfway up the altar.
translation:
  language: fr
  text: Tu la placeras sous le rebord[a] de l’autel, par-dessous, et la grille s’étendra jusqu’à mi-hauteur de l’autel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bordure » ; le mot hébreu désigne un rebord, une bordure ou un cadre faisant saillie sur l’autel.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et la grille sera jusqu’à la moitié de l’autel ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Tu la placeras
  rationale: Dans cette construction, נתן signifie « mettre, placer ». Le futur français exprime naturellement la consigne, et le pronom reprend « la grille » du contexte précédent.
- source_word: תַּחַת
  choice: sous
  rationale: La préposition indique directement une position inférieure par rapport au rebord de l’autel.
- source_word: כַּרְכֹּב
  choice: rebord
  rationale: Le terme désigne vraisemblablement une bordure ou une saillie de l’autel. « Rebord » est architectural, clair et courant, sans préciser abusivement sa forme exacte.
- source_word: מִלְּמָטָּה
  choice: par-dessous
  rationale: Cette expression conserve le détail spatial « d’en bas / par-dessous » et la légère redondance de l’hébreu sans imposer une reconstitution précise du dispositif.
- source_word: הָרֶשֶׁת
  choice: la grille
  rationale: רשת désigne un ouvrage ajouré en forme de réseau. Dans le contexte de l’autel, « grille » est plus naturel et concret en français que « filet ».
- source_word: וְהָיְתָה ... עַד
  choice: s’étendra jusqu’à
  rationale: Littéralement « elle sera jusqu’à », la tournure indique ici l’étendue ou la position de la grille. « S’étendra jusqu’à » est idiomatique tout en conservant la coordination hébraïque.
- source_word: חֲצִי הַמִּזְבֵּחַ
  choice: mi-hauteur de l’autel
  rationale: Littéralement « la moitié de l’autel ». Le contexte spatial vertical invite à comprendre le milieu de la hauteur, sans modifier l’idée fondamentale de point médian.
