  text: Fifteen cubits of hangings for the shoulder[a], with their three pillars and their three bases.
translation:
  language: fr
  text: Quinze coudées de tentures pour un côté, avec leurs trois poteaux et leurs trois socles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « bases » ou « embases ». Le terme hébreu désigne les supports dans lesquels reposent les poteaux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמֵשׁ עֶשְׂרֵה
  choice: quinze
  rationale: Le nombre composé signifie simplement « quinze »; l’unité de mesure est donnée par le nom qui suit.
- source_word: אַמָּה
  choice: coudées
  rationale: La coudée est l’unité linéaire habituelle désignée par אַמָּה. Le pluriel convient après « quinze ».
- source_word: קְלָעִים
  choice: tentures
  rationale: Dans la description du parvis, le terme désigne les pièces de tissu suspendues qui en forment l’enceinte. « Tentures » est clair, naturel et adapté au contexte.
- source_word: לַכָּתֵף
  choice: pour un côté
  rationale: כָּתֵף signifie littéralement « épaule », mais désigne ici l’un des deux côtés, ou flancs, de l’entrée. « Pour un côté » rend naturellement cette fonction architecturale sans introduire une image obscure en français.
- source_word: עַמֻּדֵיהֶם
  choice: leurs trois poteaux
  rationale: עַמּוּד peut désigner un pilier, une colonne ou un poteau. Pour des supports de tentures dans un parvis, « poteaux » est précis et courant; le possessif pluriel conserve le suffixe hébreu.
- source_word: אַדְנֵיהֶם
  choice: leurs trois socles
  rationale: Dans les textes relatifs au sanctuaire, אֶדֶן désigne la pièce de base qui soutient un poteau. « Socles » exprime clairement cette fonction; « bases » ou « embases » restent possibles.
