base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/018.yaml
  text: The length of the court shall be a hundred cubits[a], and the width fifty cubits, and the height five cubits, of finely twisted linen[b], with their bases of bronze.
translation:
  language: fr
  text: La cour aura cent coudées de long, une largeur de cinquante par cinquante[a] et cinq coudées de haut. Les tentures seront en fin lin retors, avec leurs socles[b] de bronze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cinquante par cinquante ». Cette formulation hébraïque inhabituelle est souvent comprise comme indiquant une largeur de cinquante coudées.'
    reason: Préserver la formulation difficile du texte hébreu sans en imposer une interprétation dans le texte.
  - marker: b
    text: 'Ou : « leurs douilles » (en bronze).'
    reason: אַדֶן peut désigner les socles ou douilles métalliques qui servent d’assise aux poteaux.
lexical_decisions:
- source_word: אֹרֶךְ הֶחָצֵר
  choice: La cour aura … de long
  rationale: Formulation française naturelle pour indiquer la longueur d’une enceinte, tout en conservant exactement la dimension donnée.
- source_word: מֵאָה בָאַמָּה
  choice: cent coudées
  rationale: Conserve l’unité ancienne du texte source sans conversion moderne approximative.
- source_word: וְרֹחַב חֲמִשִּׁים בַּחֲמִשִּׁים
  choice: cinquante sur cinquante de large
  rationale: Préserve l’expression inhabituelle et probablement distributive du texte massorétique, littéralement « cinquante sur cinquante », plutôt que de la normaliser silencieusement.
- source_word: וְקֹמָה חָמֵשׁ אַמּוֹת
  choice: et cinq coudées de haut
  rationale: Rend directement la dimension verticale dans un français architectural courant.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: fin lin retors
  rationale: « Fin lin » rend שֵׁשׁ dans le vocabulaire du sanctuaire, et « retors » exprime le travail de fils tordus indiqué par מָשְׁזָר.
- source_word: וְאַדְנֵיהֶם
  choice: les socles
  rationale: Dans ce contexte de construction, אַדֶן désigne les pièces métalliques servant d’assise aux poteaux; « socles » est précis et accessible.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Choix conventionnel et contextuellement approprié pour le métal des éléments du sanctuaire, bien que le terme puisse plus largement désigner le cuivre ou un alliage cuivreux.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe est légèrement explicitée par « les tentures », fourni par le contexte immédiat de la description de la cour, afin d’éviter de faire du fin lin le matériau de toute la cour. L’expression difficile « cinquante sur cinquante » est maintenue dans le texte et expliquée en note.
