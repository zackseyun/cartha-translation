  text: וְ/עָשִׂ֥יתָ אֶת הַ/מִּזְבֵּ֖חַ עֲצֵ֣י שִׁטִּ֑ים חָמֵשׁ֩ אַמּ֨וֹת אֹ֜רֶךְ וְ/חָמֵ֧שׁ אַמּ֣וֹת רֹ֗חַב רָב֤וּעַ יִהְיֶה֙ הַ/מִּזְבֵּ֔חַ וְ/שָׁלֹ֥שׁ אַמּ֖וֹת קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/001.yaml
  text: You shall make the altar of acacia wood[a], five cubits long and five cubits wide; the altar shall be square, and its height shall be three cubits.
translation:
  language: fr
  text: 'Tu feras l’autel en bois d’acacia : il aura cinq coudées de long et cinq coudées de large. L’autel sera carré et aura trois coudées de haut.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Dans cette série d’instructions, le parfait qal précédé de la conjonction exprime une prescription. « Tu feras » en conserve la force directive avec un registre biblique naturel.
- source_word: הַמִּזְבֵּחַ
  choice: l’autel
  rationale: Équivalent français courant de מִזְבֵּחַ dans le contexte du sanctuaire; l’article défini hébreu est conservé.
- source_word: עֲצֵי שִׁטִּים
  choice: en bois d’acacia
  rationale: Le groupe construit indique le matériau. « Bois d’acacia » est précis et immédiatement compréhensible en français moderne.
- source_word: חָמֵשׁ אַמּוֹת אֹרֶךְ
  choice: cinq coudées de long
  rationale: Formulation dimensionnelle idiomatique qui rend directement la longueur indiquée par l’hébreu.
- source_word: וְחָמֵשׁ אַמּוֹת רֹחַב
  choice: cinq coudées de large
  rationale: Formulation parallèle et naturelle pour la largeur.
- source_word: רָבוּעַ יִהְיֶה
  choice: sera carré
  rationale: רָבוּעַ désigne ici une forme carrée; « carré » est l’équivalent moderne le plus clair.
- source_word: וְשָׁלֹשׁ אַמּוֹת קֹמָתוֹ
  choice: aura trois coudées de haut
  rationale: Cette tournure française naturelle exprime la hauteur et conserve le suffixe possessif hébreu par référence explicite à l’autel.
theological_decisions: []
