  register: 'Français international moderne, clair et digne. La syntaxe est légèrement restructurée en deux phrases afin de rendre naturellement les trois dimensions sans modifier le contenu. Aucune note n’est nécessaire : l’indication « carré » ne présente pas ici d’ambiguïté substantielle, et la note anglaise fournie semble mal rattachée à « bois d’acacia ».'
