  text: And the width of the court on the east side[a], toward the sunrise, shall be fifty cubits.
translation:
  language: fr
  text: La largeur de la cour, du côté est, vers le soleil levant, sera de cinquante coudées.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרֹחַב
  choice: La largeur
  rationale: רֹחַב désigne la largeur. En français, l’article défini suffit naturellement dans la continuité descriptive; la coordination וְ n’a pas besoin d’être rendue mécaniquement par « Et » dans ce verset fragmentaire.
- source_word: הֶחָצֵר
  choice: de la cour
  rationale: חָצֵר désigne ici l’espace extérieur clos du sanctuaire. « Cour » est précis, usuel et concis.
- source_word: לִפְאַת קֵדְמָה
  choice: du côté est
  rationale: פֵאָה peut désigner un côté ou un bord, et קֵדְמָה indique ici l’est. « Du côté est » rend naturellement la construction directionnelle.
- source_word: מִזְרָחָה
  choice: vers le soleil levant
  rationale: מִזְרָחָה renvoie à la direction du lever du soleil. Cette formulation conserve le redoublement directionnel de l’hébreu après « côté est » sans simple répétition.
- source_word: חֲמִשִּׁים אַמָּה
  choice: cinquante coudées
  rationale: La coudée est l’unité linéaire traditionnelle correspondant à אַמָּה; aucune conversion moderne n’est ajoutée au texte.
