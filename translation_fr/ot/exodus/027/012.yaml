  yaml_path: translation/ot/exodus/027/012.yaml
  text: And for the width of the court on the west side[a], there shall be hangings of fifty cubits[b], with ten pillars and ten bases.
translation:
  language: fr
  text: Pour la largeur de la cour, du côté ouest[a], il y aura des tentures de cinquante coudées, avec leurs dix colonnes et leurs dix bases[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « du côté de la mer », expression hébraïque habituelle pour désigner l’ouest.
    reason: lexical_alternative
  - marker: b
    text: Ou « socles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/רֹחַב הֶ/חָצֵר
  choice: Pour la largeur de la cour
  rationale: רֹחַב désigne la largeur. La tournure avec « pour » introduit naturellement, dans une série de prescriptions architecturales, les dimensions de ce côté de la cour.
- source_word: לִ/פְאַת יָם
  choice: du côté ouest
  rationale: פֵאָה désigne ici le côté ou le bord, et יָם, littéralement « mer », est l’idiome directionnel hébreu courant pour l’ouest.
- source_word: קְלָעִים
  choice: des tentures
  rationale: Dans la description de la cour du sanctuaire, le terme désigne les étoffes suspendues qui en forment l’enceinte. « Tentures » est naturel, précis et sans connotation domestique excessive.
- source_word: חֲמִשִּׁים אַמָּה
  choice: sur cinquante coudées
  rationale: La préposition française « sur » explicite naturellement l’étendue mesurée des tentures sans ajouter une dimension absente de l’hébreu.
- source_word: עַמֻּדֵי/הֶם עֲשָׂרָה
  choice: leurs dix colonnes
  rationale: עַמּוּד désigne une colonne ou un poteau porteur. « Colonnes » convient au registre architectural, et le possessif rend le suffixe masculin pluriel de l’hébreu.
- source_word: וְ/אַדְנֵי/הֶם עֲשָׂרָה
  choice: et leurs dix bases
  rationale: אֶדֶן désigne les éléments inférieurs recevant les colonnes. « Bases » est immédiatement compréhensible; « socles » reste une possibilité.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve le caractère prescriptif du contexte tout en adoptant un ordre des mots naturel. Les possessifs de l’hébreu sont maintenus dans « leurs dix colonnes » et « leurs dix bases ».
