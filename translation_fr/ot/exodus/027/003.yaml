base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/003.yaml
  text: You shall make its pots for removing its ashes[a], and its shovels, and its basins, and its forks, and its firepans[b]; you shall make all its utensils of bronze.
translation:
  language: fr
  text: Tu fabriqueras ses récipients pour en enlever les cendres[a], ainsi que ses pelles, ses bassins, ses fourchettes et ses récipients à braises. Tu fabriqueras tous ses ustensiles en bronze[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu désigne l’enlèvement des cendres de l’autel; il peut évoquer les cendres imprégnées de graisse provenant des offrandes.
    reason: lexical_alternative
  - marker: b
    text: Ou « cuivre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu fabriqueras
  rationale: Le qatal inversé à la 2e personne du singulier poursuit ici la série d’instructions et se rend naturellement par le futur prescriptif en français.
- source_word: סִּירֹתָיו
  choice: ses récipients
  rationale: סִירֹת désigne des contenants. « Récipients » reste générique puisque leur fonction est précisée par l’expression suivante.
- source_word: לְדַשְּׁנוֹ
  choice: pour en retirer les cendres grasses
  rationale: Le piel de דשן désigne ici l’enlèvement des résidus gras et cendreux produits par les offrandes. Cette formulation conserve la composante lexicale liée à la graisse sans suggérer un simple nettoyage général.
- source_word: יָעָיו
  choice: ses pelles
  rationale: Le terme désigne des instruments servant à manipuler les cendres ou les braises; « pelles » est clair et naturel dans ce contexte.
- source_word: מִזְרְקֹתָיו
  choice: ses bassins
  rationale: Ces récipients cultuels servaient notamment à contenir ou à projeter des liquides, en particulier le sang; « bassins » convient mieux que le terme domestique « bols ».
- source_word: מִזְלְגֹתָיו
  choice: ses fourchettes
  rationale: Le nom désigne des instruments à dents. « Fourchettes » rend directement la forme sans ajouter l’interprétation « crochets à viande ».
- source_word: מַחְתֹּתָיו
  choice: ses récipients à braises
  rationale: Le mot désigne des ustensiles destinés à recueillir ou transporter des braises. La périphrase française est plus immédiatement compréhensible que « brasiers » et moins ambiguë que « encensoirs ».
- source_word: לְכָל־כֵּלָיו
  choice: tous ses ustensiles
  rationale: כְּלִי est un terme large pour des objets ou instruments; « ustensiles » convient à l’ensemble des accessoires de l’autel qui viennent d’être énumérés.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Dans le contexte du mobilier du sanctuaire, « bronze » est la traduction conventionnelle et historiquement plausible; le mot hébreu peut aussi désigner le cuivre.
