    rationale: Cette expression est peu idiomatique en français moderne et donne une précision interprétative que l’hébreu n’exprime pas sous la forme d’un syntagme nominal. Le contexte justifie « enlever les cendres »; l’éventuelle nuance de résidus gras doit être formulée prudemment en note.
  - severity: low
    issue: La note a affirme que l’hébreu évoque « littéralement » des « cendres grasses ».
    rationale: Le texte contient un verbe, non l’expression nominale « cendres grasses ». La note doit distinguer l’explication du terme de sa formulation littérale.
