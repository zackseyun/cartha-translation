translation_notes:
  register: Français international moderne, clair et digne. Le futur simple garde la force prescriptive du passage. Les possessifs renvoient à l’autel. La répétition de « Tu fabriqueras » reproduit la structure directive de l’hébreu tout en évitant une accumulation peu naturelle de conjonctions.
