  text: וְ/עָשִׂ֤יתָ בַדִּים֙ לַ/מִּזְבֵּ֔חַ בַּדֵּ֖י עֲצֵ֣י שִׁטִּ֑ים וְ/צִפִּיתָ֥ אֹתָ֖/ם נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/006.yaml
  text: You shall make poles for the altar[a], poles of acacia wood, and you shall overlay them with bronze.
translation:
  language: fr
  text: Tu feras des barres pour l’autel, en bois d’acacia, et tu les recouvriras de bronze[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « cuivre ».'
    reason: Alternative lexicale possible pour נְחֹשֶׁת.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Le qatal qal à la 2e personne masculine singulière, avec conjonction, a ici une valeur prescriptive. Le futur français exprime naturellement cette instruction.
- source_word: בַדִּים / בַּדֵּי
  choice: des barres
  rationale: Le nom désigne les longues pièces servant à porter l’autel. « Barres » est le terme courant dans ce contexte mobilier et évite l’archaïsme de « brancards » pris seul.
- source_word: לַמִּזְבֵּחַ
  choice: pour l’autel
  rationale: La traduction reprend exactement la désignation du verset sans ajouter « des holocaustes », précision fournie par le contexte mais absente de l’hébreu ici.
- source_word: עֲצֵי שִׁטִּים
  choice: en bois d’acacia
  rationale: Cette formulation française naturelle rend le syntagme construit indiquant le matériau et l’identification probable du bois.
- source_word: וְצִפִּיתָ
  choice: et tu les recouvriras
  rationale: Le piel de צפה désigne ici l’action de revêtir une pièce de bois de métal. « Recouvrir » est clair et naturel sans préciser indûment la technique.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom masculin pluriel renvoie explicitement aux barres.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: « Bronze » est le rendu conventionnel et contextuellement probable pour les éléments métalliques du sanctuaire, tandis que « cuivre » demeure lexicalement possible et est signalé en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et prescriptif. Le tutoiement singulier correspond à l’adresse hébraïque à Moïse. La répétition hébraïque de בַדִּים (« des barres… des barres de bois d’acacia ») est lissée en français pour éviter une lourdeur sans perte de sens.
