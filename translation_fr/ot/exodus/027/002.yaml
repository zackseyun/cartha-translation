id: EXO.27.2
reference: Exodus 27:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עָשִׂ֣יתָ קַרְנֹתָ֗י/ו עַ֚ל אַרְבַּ֣ע פִּנֹּתָ֔י/ו מִמֶּ֖/נּוּ תִּהְיֶ֣יןָ קַרְנֹתָ֑י/ו וְ/צִפִּיתָ֥ אֹת֖/וֹ נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/002.yaml
  text: And you shall make its horns on its four corners[a]; its horns shall be of one piece with it[b], and you shall overlay it with bronze.
translation:
  language: fr
  text: Tu feras des cornes à ses quatre angles. Ses cornes feront corps avec lui[a], et tu le recouvriras de bronze[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ses cornes seront de lui », c’est-à-dire qu’elles seront formées avec l’autel plutôt que fixées séparément.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut désigner le bronze ou le cuivre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Le parfait qal avec waw, dans cette suite d’instructions, exprime une directive. Le futur français rend naturellement cette valeur prescriptive.
- source_word: קַרְנֹתָיו
  choice: ses cornes
  rationale: Le nom קֶרֶן désigne littéralement une « corne » et, ici, les saillies en forme de corne de l’autel. Le terme concret est conservé.
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: à ses quatre angles
  rationale: עַל peut signifier « sur » ou marquer la position; en français, « à ses quatre angles » décrit naturellement l’emplacement des cornes tout en restant proche de l’hébreu.
- source_word: מִמֶּנּוּ תִּהְיֶיןָ קַרְנֹתָיו
  choice: Ses cornes feront corps avec lui
  rationale: Littéralement, « de lui seront ses cornes ». Dans ce contexte de fabrication, la formule indique qu’elles sont solidaires de l’autel, et non ajoutées séparément. La note conserve la tournure plus littérale.
- source_word: וְצִפִּיתָ אֹתוֹ
  choice: et tu le recouvriras
  rationale: Au piel, צפה signifie ici couvrir ou plaquer un objet d’un matériau. « Recouvrir » est clair et naturel en français dans des instructions de fabrication.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: נְחֹשֶׁת peut désigner le cuivre ou le bronze. « Bronze » est retenu comme sens probable dans ce contexte d’ouvrage métallique ancien, sans éliminer l’autre possibilité.
