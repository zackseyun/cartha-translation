  text: וְ/אַתָּ֞ה תְּצַוֶּ֣ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֨וּ אֵלֶ֜י/ךָ שֶׁ֣מֶן זַ֥יִת זָ֛ךְ כָּתִ֖ית לַ/מָּא֑וֹר לְ/הַעֲלֹ֥ת נֵ֖ר תָּמִֽיד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/020.yaml
  text: And you shall command the sons of Israel that they bring to you pure beaten olive oil for the light[c][b][a], to cause a lamp to burn continually.
translation:
  language: fr
  text: Quant à toi, tu ordonneras aux fils d’Israël[a] de t’apporter de l’huile d’olive pure, obtenue à partir d’olives broyées[b], pour l’éclairage, afin de faire brûler une lampe continuellement[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « aux Israélites » ou « au peuple d’Israël ». Littéralement : « aux fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire « obtenue à partir d’olives pilées » ou « concassées » : il s’agit d’une huile de grande qualité produite par broyage plutôt que par le pressage ordinaire.'
    reason: lexical_alternative
  - marker: c
    text: Dans les instructions relatives au sanctuaire, « continuellement » peut désigner un entretien régulier et durable, sans nécessairement signifier que la lampe brûlait à chaque instant sans interruption. Comparer Exode 27.21 et Lévitique 24.2-4.
    reason: cross_reference
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Quant à toi
  rationale: La conjonction suivie du pronom indépendant met Moïse en relief et marque une légère transition. « Quant à toi » rend naturellement cette emphase en français.
- source_word: תְּצַוֶּה
  choice: tu ordonneras
  rationale: Le piel de צוה signifie couramment « ordonner, donner des instructions ». Le futur français convient ici à la valeur prescriptive du discours législatif.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction conserve l’expression familiale et collective de l’hébreu, tout en signalant en note les formulations françaises plus idiomatiques.
- source_word: וְ/יִקְחוּ אֵלֶיךָ
  choice: de t’apporter
  rationale: Dans ce contexte d’approvisionnement, לקח avec אֶל exprime l’action de se procurer quelque chose et de l’apporter à Moïse. La tournure française s’intègre naturellement après « ordonner ».
- source_word: שֶׁמֶן זַיִת זָךְ
  choice: de l’huile d’olive pure
  rationale: Le syntagme désigne de l’huile issue des olives, qualifiée de pure ou claire pour cet usage cultuel.
- source_word: כָּתִית
  choice: obtenue par broyage
  rationale: Le terme décrit une huile tirée d’olives pilées ou broyées, plutôt que le produit d’un pressage ordinaire. Cette formulation évite l’expression peu naturelle « huile battue ».
- source_word: לַ/מָּאוֹר
  choice: pour l’éclairage
  rationale: מָאוֹר désigne ici la lumière ou l’éclairage. La traduction conserve la finalité sans préciser davantage l’appareil que ne le fait ce terme.
- source_word: לְ/הַעֲלֹת נֵר
  choice: afin de faire brûler une lampe
  rationale: L’expression causative signifie littéralement faire monter une lampe, idiome désignant le fait de l’allumer ou d’entretenir sa flamme. « Faire brûler » conserve la nuance causative.
- source_word: תָּמִיד
  choice: continuellement
  rationale: Le mot exprime la continuité ou la régularité durable du service. Le contexte sacerdotal précise la manière dont cette continuité est assurée.
theological_decisions:
- issue: Portée de l’expression collective בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / le peuple d’Israël
  rationale: Le texte principal préserve la désignation familiale masculine de l’hébreu. Dans ce contexte, il s’agit de l’appellation collective traditionnelle de la communauté d’Israël, et non d’une affirmation selon laquelle les femmes en seraient exclues.
- issue: Sens temporel de תָּמִיד dans le service du sanctuaire
  choice: continuellement
  alternative: régulièrement / en permanence
  rationale: Le terme peut désigner un entretien régulier et durable dans le cadre du culte sans imposer l’idée d’une action ininterrompue à chaque instant. La note maintient cette nuance sans la trancher dans le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’adresse emphatique à Moïse, la désignation familiale d’Israël et la tension entre continuité et entretien régulier, tout en rendant naturellement l’expression technique concernant la fabrication de l’huile.
