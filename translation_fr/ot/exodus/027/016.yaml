base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/016.yaml
  text: And for the gate of the courtyard there shall be a screen twenty cubits long[a], of blue, purple, and scarlet yarn, and fine twined linen, the work of an embroiderer[c][b], with their four pillars and their four bases.
translation:
  language: fr
  text: Pour l’entrée de la cour, il y aura un rideau[a] de vingt coudées[b], de fil bleu, pourpre et écarlate, et de fin lin retors, travail de brodeur, avec ses quatre piliers et ses quatre socles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une tenture » servant à fermer l’entrée.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit simplement « vingt coudées », soit environ neuf à dix mètres; il ne précise pas ici « de long » ou « de large ».
    reason: measurement_clarity
  - marker: c
    text: Ou « embases ». Littéralement, l’hébreu porte « leurs quatre piliers et leurs quatre socles ».
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: וּלְשַׁעַר הֶחָצֵר
  choice: Pour l’entrée de la cour
  rationale: שַׁעַר désigne ici l’ouverture aménagée donnant accès à l’enceinte. « Entrée » est plus naturel que « porte », qui pourrait suggérer un battant solide; חָצֵר est rendu par « cour » dans ce contexte architectural.
- source_word: מָסָךְ
  choice: un rideau
  rationale: Dans les descriptions du sanctuaire, le terme désigne une tenture fermant ou marquant une entrée. « Rideau » exprime clairement sa nature textile.
- source_word: עֶשְׂרִים אַמָּה
  choice: de vingt coudées
  rationale: La formulation conserve directement la mesure hébraïque sans ajouter « de long » ou « de large », absent du texte source.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: en fils bleu, pourpre et écarlate
  rationale: Ces termes désignent des matières textiles teintes. Le pluriel générique « fils » rend explicite le contexte matériel tout en conservant les trois couleurs traditionnelles.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: et en fin lin retors
  rationale: שֵׁשׁ désigne le fin lin et מָשְׁזָר son fil retordu ou assemblé par torsion. « Fin lin retors » est concis et adapté au registre artisanal.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: ouvrage de brodeur
  rationale: La construction hébraïque caractérise le rideau comme le travail d’un artisan pratiquant la broderie ou le tissage ouvragé. La formulation française garde l’agent et le savoir-faire.
- source_word: עַמֻּדֵיהֶם אַרְבָּעָה וְאַדְנֵיהֶם אַרְבָּעָה
  choice: avec ses quatre piliers et ses quatre socles
  rationale: « Piliers » rend les supports verticaux; « socles » rend les pièces inférieures qui les reçoivent. Le possessif singulier français rattache naturellement ces éléments à l’ensemble de l’entrée et de son rideau, tandis qu’une note signale la forme littérale hébraïque.
theological_decisions: []
translation_notes:
