source:
  edition: WLC
  text: לְ/כֹל֙ כְּלֵ֣י הַ/מִּשְׁכָּ֔ן בְּ/כֹ֖ל עֲבֹדָת֑/וֹ וְ/כָל יְתֵדֹתָ֛י/ו וְ/כָל יִתְדֹ֥ת הֶ/חָצֵ֖ר נְחֹֽשֶׁת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/019.yaml
  text: All the utensils of the tabernacle for all its service[a], and all its pegs, and all the pegs of the courtyard, shall be bronze.
translation:
  language: fr
  text: Tous les ustensiles du tabernacle destinés à l’ensemble de son service, ainsi que tous ses piquets et tous les piquets de la cour, seront en bronze.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cuivre »; le mot hébreu נְחֹשֶׁת peut désigner de manière générale un métal à base de cuivre.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי
  choice: ustensiles
  rationale: Le terme כְּלִי désigne largement des objets ou instruments. « Ustensiles » convient au contexte cultuel sans limiter le sens au mobilier.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: Dans ce contexte cultuel, מִשְׁכָּן désigne la demeure sacrée; « tabernacle » est le terme français établi et précis.
- source_word: בְּכֹל עֲבֹדָתוֹ
  choice: destinés à l’ensemble de son service
  rationale: La préposition בְּ et עֲבֹדָה expriment ici la destination ou l’usage des objets dans toutes les fonctions liées au tabernacle. Cette formulation est naturelle en français tout en conservant l’étendue de כֹּל.
- source_word: יְתֵדֹתָיו
  choice: ses piquets
  rationale: יָתֵד désigne un piquet servant à fixer la structure. « Piquets » est clair et n’ajoute pas une précision absente de l’hébreu.
- source_word: יִתְדֹת הֶחָצֵר
  choice: les piquets de la cour
  rationale: חָצֵר désigne ici l’enceinte extérieure du tabernacle. « Cour » est le terme cultuel français courant et reste concis.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: נְחֹשֶׁת peut désigner le cuivre ou un alliage cuivreux. « Bronze » est le rendu conventionnel et contextuellement probable dans les listes de matériaux du tabernacle, tandis qu’une note préserve l’alternative lexicale.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La coordination répétée de l’hébreu est légèrement allégée par « ainsi que », sans modifier la portée exhaustive du verset. Le marqueur de note est placé après « bronze », le terme auquel il se rapporte.
