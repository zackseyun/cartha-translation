  text: וְ/הוּבָ֥א אֶת בַּדָּ֖י/ו בַּ/טַּבָּעֹ֑ת וְ/הָי֣וּ הַ/בַּדִּ֗ים עַל שְׁתֵּ֛י צַלְעֹ֥ת הַ/מִּזְבֵּ֖חַ בִּ/שְׂאֵ֥ת אֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/007.yaml
  text: Its poles shall be put into the rings[b][a], and the poles shall be on the two sides of the altar when it is carried.
translation:
  language: fr
  text: Ses barres seront introduites dans les anneaux[a] et seront placées sur les deux côtés[b] de l’autel lorsqu’il sera transporté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « amenées dans les anneaux ». Le verbe hébreu est au passif et décrit ici la mise en place des barres pour le transport.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi désigner les pièces latérales ou les flancs.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּבָא
  choice: seront introduites
  rationale: Le hophal de בוא exprime ici une action passive. « Seront introduites » rend naturellement en français la mise en place des barres dans les anneaux tout en conservant cette valeur passive.
- source_word: בַּדָּיו
  choice: ses barres
  rationale: בַּד désigne les barres servant à porter le mobilier sacré. « Barres » est clair, actuel et concis.
- source_word: בַּטַּבָּעֹת
  choice: dans les anneaux
  rationale: La préposition ב indique ici l’emplacement où les barres sont insérées. « Dans les anneaux » convient naturellement au contexte du transport.
- source_word: וְהָיוּ
  choice: seront
  rationale: Le verbe indique l’état ou la position prescrite des barres après leur insertion, sans ajouter l’idée qu’elles doivent nécessairement y rester en permanence.
- source_word: עַל שְׁתֵּי צַלְעֹת
  choice: sur les deux côtés
  rationale: עַל garde son sens spatial courant, tandis que צלעות peut désigner les côtés, les flancs ou les pièces latérales. La formulation retenue reste naturelle sans préciser excessivement la construction.
- source_word: הַמִּזְבֵּחַ
  choice: l’autel
  rationale: Équivalent français usuel de מִזְבֵּחַ dans le contexte cultuel.
- source_word: בִּשְׂאֵת אֹתוֹ
  choice: lorsqu’il sera transporté
  rationale: L’infinitif construit avec ב exprime ici la circonstance temporelle. Le passif français garde l’autel comme centre de l’énoncé et n’introduit pas de porteurs non mentionnés.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe passive reflète la forme hébraïque, tandis que « introduites » explicite naturellement l’insertion des barres sans modifier la fonction du dispositif.
