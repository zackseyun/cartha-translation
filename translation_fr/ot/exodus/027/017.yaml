  text: כָּל עַמּוּדֵ֨י הֶֽ/חָצֵ֤ר סָבִיב֙ מְחֻשָּׁקִ֣ים כֶּ֔סֶף וָוֵי/הֶ֖ם כָּ֑סֶף וְ/אַדְנֵי/הֶ֖ם נְחֹֽשֶׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/017.yaml
  text: All the pillars around the courtyard shall be banded with silver[c][b][a], with their hooks of silver and their bases of bronze.
translation:
  language: fr
  text: Tous les piliers qui entourent la cour seront munis de bandes d’argent[a] ; leurs crochets seront en argent et leurs bases[b] en bronze[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reliés par des tringles d’argent ». Le terme hébreu désigne un ouvrage d’argent formant des bandes ou des éléments de liaison sur les piliers.
    reason: lexical_alternative
  - marker: b
    text: Ou « socles ». Il s’agit des supports métalliques dans lesquels les piliers étaient fixés.
    reason: lexical_alternative
  - marker: c
    text: Ou « cuivre ». Le terme hébreu peut désigner le cuivre ou un alliage à base de cuivre dans l’usage ancien.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עַמּוּדֵי
  choice: Tous les piliers
  rationale: Le syntagme désigne collectivement la totalité des supports verticaux de l’enceinte. « Piliers » convient au contexte architectural du sanctuaire.
- source_word: הֶחָצֵר סָבִיב
  choice: qui entourent la cour
  rationale: Cette formulation française naturelle exprime que les piliers se trouvent sur tout le pourtour de l’espace extérieur clôturé.
- source_word: מְחֻשָּׁקִים כֶּסֶף
  choice: seront munis de bandes d’argent
  rationale: Le participe passif désigne vraisemblablement un ouvrage d’argent posé sur les piliers, sous forme de bandes ou d’éléments de liaison. La formulation retenue reste concrète et compréhensible sans imposer une reconstruction technique trop précise.
- source_word: וָוֵיהֶם
  choice: leurs crochets
  rationale: Dans les descriptions du sanctuaire, le terme désigne les pièces servant vraisemblablement à suspendre les tentures. « Crochets » est le terme français courant et contextuellement approprié.
- source_word: כָּסֶף
  choice: seront en argent
  rationale: La tournure française indique clairement la matière dont sont faits les crochets.
- source_word: אַדְנֵיהֶם
  choice: leurs bases
  rationale: Le mot désigne les supports métalliques dans lesquels les piliers étaient fixés. « Bases » est clair pour le grand public, tandis que « socles » demeure une possibilité signalée en note.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: « Bronze » est le rendu traditionnel et contextuellement adéquat pour ce métal dans la description du sanctuaire, bien que le terme hébreu puisse aussi couvrir le cuivre ou un alliage cuivreux.
