  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: l’autel des holocaustes
  rationale: Cette expression française courante désigne naturellement l’autel associé à l‘olah, offrande entièrement consumée. Le pluriel générique « des holocaustes » convient au nom fonctionnel de l’autel.
- source_word: כָּל כֵּלָיו
  choice: tous ses ustensiles
  rationale: כְּלִי désigne ici l’ensemble des objets et instruments employés avec l’autel ; « ustensiles » est concret, accessible et adapté au contexte cultuel.
- source_word: הַכִּיּוֹר
  choice: la cuve
  rationale: Le terme désigne le récipient destiné aux ablutions dans la cour du sanctuaire. « Cuve » est moderne et précis, sans l’archaïsme de « bassin d’airain » ou de « cuve des ablutions » ajouté au texte.
- source_word: כַּנּוֹ
  choice: son support
  rationale: כֵּן désigne la structure sur laquelle repose la cuve. « Support » exprime cette fonction tout en laissant ouverte sa forme exacte.
- source_word: וְאֶת
  choice: et
  rationale: Dans cette énumération de compléments d’objet, la conjonction est rendue naturellement par « et », tandis que le marqueur d’objet אֵת n’a pas d’équivalent lexical en français.
