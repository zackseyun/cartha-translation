  register: Français international moderne, sobre et digne. La formulation reste un fragment coordonné conformément au contexte de l’inventaire. Aucun marqueur de note n’est nécessaire, puisque « support » restitue directement le sens de כֵּן sans imposer une forme matérielle plus précise.
