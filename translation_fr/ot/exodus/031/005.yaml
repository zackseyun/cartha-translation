  text: in the cutting of stone for setting[a], and in the carving of wood, to do every kind of work[b],
translation:
  language: fr
  text: dans la taille de pierres à enchâsser[a][b] et dans la sculpture sur bois, pour réaliser toutes sortes d’ouvrages.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le travail de la pierre pour la sertir » ou « dans la gravure de pierres à enchâsser ».
    reason: lexical_alternative
  - marker: b
    text: Le mot « pierre » est général ici ; dans ce contexte, il peut inclure les pierres précieuses employées pour le sanctuaire.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת
  choice: dans la taille / dans la sculpture
  rationale: 'Le terme désigne un travail artisanal qualifié. La traduction varie naturellement selon le matériau : « taille » pour la pierre et « sculpture » pour le bois.'
- source_word: אֶבֶן
  choice: pierres
  rationale: Le mot hébreu est le terme général pour la pierre. Le pluriel français convient naturellement au travail de pierres à enchâsser sans préciser qu’il s’agit nécessairement de pierres précieuses.
- source_word: לְמַלֹּאת
  choice: à enchâsser
  rationale: Dans ce contexte artisanal, l’infinitif évoque la mise en place de pierres dans une monture ou un support. « Enchâsser » exprime clairement cette opération en français.
- source_word: עֵץ
  choice: bois
  rationale: « Bois » est le terme courant et naturel pour ce matériau en français moderne.
- source_word: לַעֲשׂוֹת
  choice: pour réaliser
  rationale: Le verbe עשה est très large. Avec « ouvrages », « réaliser » produit une formulation française naturelle sans limiter le sens à une seule technique.
- source_word: בְּכָל מְלָאכָה
  choice: toutes sortes d’ouvrages
  rationale: Cette expression conserve l’idée d’étendue et de diversité du travail artisanal. « Ouvrages » convient ici mieux que le très général « travail » au contexte de fabrication.
