source:
  edition: WLC
  text: וְ/אַתָּ֞ה דַּבֵּ֨ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אַ֥ךְ אֶת שַׁבְּתֹתַ֖/י תִּשְׁמֹ֑רוּ כִּי֩ א֨וֹת הִ֜וא בֵּינִ֤/י וּ/בֵֽינֵי/כֶם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם לָ/דַ֕עַת כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/013.yaml
  text: And you[a], speak to the sons of Israel, saying, ‘Surely you shall keep my Sabbaths, for it is a sign between me and you throughout your generations[c][b], so that you may know that I am Yahweh who sanctifies you.’
translation:
  language: fr
  text: 'Quant à toi, parle aux Israélites[a] et dis-leur : « Toutefois, vous observerez mes sabbats[b], car c’est un signe entre moi et vous, de génération en génération, afin que vous sachiez que c’est moi, Yahweh, qui vous sanctifie[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils d’Israël », désignation collective traditionnelle du peuple d’Israël.'
    reason: lexical_alternative
  - marker: b
    text: La particule hébraïque peut aussi se traduire par « seulement », « toutefois » ou « assurément » ; elle exprime ici une restriction, un contraste ou une forte insistance.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « qui vous rend saints ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Quant à toi
  rationale: Le pronom détaché marque le changement d’interlocuteur et l’emphase du texte hébreu sans alourdir la phrase.
- source_word: דַּבֵּר ... לֵאמֹר
  choice: parle ... et dis-leur
  rationale: Cette formulation française naturelle conserve l’impératif et introduit clairement les paroles rapportées.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Dans ce contexte collectif, « les Israélites » est l’équivalent français courant de la désignation hébraïque littérale « les fils d’Israël »; la forme littérale est signalée en note.
- source_word: אַךְ
  choice: Surtout
  rationale: La particule souligne ici la priorité impérative de l’observance du sabbat par rapport aux instructions précédentes, tout en laissant en note ses nuances possibles de restriction et de contraste.
- source_word: שַׁבְּתֹתַי
  choice: mes sabbats
  rationale: Le pluriel explicite de l’hébreu est conservé; « sabbat » est le terme français établi.
- source_word: תִּשְׁמֹרוּ
  choice: vous observerez
  rationale: Dans un commandement relatif au sabbat, « observer » rend naturellement le sens de garder fidèlement une prescription.
- source_word: אוֹת
  choice: un signe
  rationale: « Signe » est le terme français usuel pour la fonction distinctive et relationnelle exprimée ici.
- source_word: לְדֹרֹתֵיכֶם
  choice: de génération en génération
  rationale: Cette locution idiomatique exprime clairement la continuité à travers les générations successives.
- source_word: לָדַעַת
  choice: afin que vous sachiez
  rationale: La formulation rend la valeur de but de l’infinitif précédé de לְ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: מְקַדִּשְׁכֶם
  choice: qui vous sanctifie
  rationale: « Sanctifier » conserve le sens causatif de rendre ou mettre à part comme saint ainsi que le registre théologique du passage.
theological_decisions:
- issue: Emploi du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; le conserver évite de remplacer sans indication ce nom par un titre.
- issue: Agent de la sanctification
  choice: qui vous sanctifie
  alternative: qui vous rend saints
  rationale: La proposition présente Yahweh comme celui qui accomplit cette sanctification. « Sanctifie » préserve cette affirmation et la note donne l’équivalent plus explicite.
- issue: Fonction du sabbat comme signe
  choice: c’est un signe entre moi et vous
  alternative: il est un signe entre moi et vous
  rationale: Le présentatif français évite de préciser artificiellement si le pronom hébreu renvoie au sabbat singulier comme institution ou à son observance, tout en conservant la relation d’alliance exprimée.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct demeure solennel sans tournures archaïques. Le pluriel « sabbats » et le nom « Yahweh » suivent explicitement le texte hébreu; les ambiguïtés de אַךְ et de la formulation relative à la sanctification sont conservées ou documentées.
