  text: וָ/אֲמַלֵּ֥א אֹת֖/וֹ ר֣וּחַ אֱלֹהִ֑ים בְּ/חָכְמָ֛ה וּ/בִ/תְבוּנָ֥ה וּ/בְ/דַ֖עַת וּ/בְ/כָל מְלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/003.yaml
  text: And I have filled him with the Spirit of God[a], with wisdom, with understanding, with knowledge, and with every kind of craftsmanship,
translation:
  language: fr
  text: Je l’ai rempli de l’Esprit de Dieu[a], de sagesse, d’intelligence, de connaissance et de toute compétence artisanale,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’esprit de Dieu » ou « un esprit divin ». L’expression hébraïque peut avoir un sens plus général, mais elle désigne probablement ici l’Esprit propre de Dieu, qui rend Betsaléel capable d’accomplir sa tâche.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֲמַלֵּא
  choice: Je l’ai rempli
  rationale: Le verbe מלא signifie « remplir ». Ici, l’accompli exprime un don déjà accordé dont l’effet demeure; le passé composé est naturel en français et convient au contexte du discours divin.
- source_word: אֹתוֹ
  choice: l’
  rationale: Le pronom objet renvoie à Betsaléel, nommé dans le verset précédent.
- source_word: רוּחַ אֱלֹהִים
  choice: l’Esprit de Dieu
  rationale: La construction peut désigner l’Esprit propre de Dieu ou, plus généralement, un esprit divin. Dans ce contexte où Dieu rend Betsaléel capable d’accomplir le travail sacré, « l’Esprit de Dieu » est la lecture la plus probable.
- source_word: בְּחָכְמָה
  choice: de sagesse
  rationale: Après « remplir », la préposition ב se rend naturellement par « de » en français et introduit ici une capacité accordée.
- source_word: וּבִתְבוּנָה
  choice: d’intelligence
  rationale: תבונה évoque l’intelligence, le discernement ou la compréhension. « Intelligence » est naturel dans cette énumération de capacités pratiques et intellectuelles.
- source_word: וּבְדַעַת
  choice: de connaissance
  rationale: דעת désigne couramment la connaissance; cette traduction conserve la série concise du texte hébreu.
- source_word: וּבְכָל מְלָאכָה
  choice: de toutes sortes de savoir-faire
  rationale: Dans le contexte de la fabrication du sanctuaire, מלאכה désigne le travail qualifié ou l’artisanat. « Savoir-faire » met en valeur la compétence, tandis que « toutes sortes de » rend idiomatiquement כל devant le singulier collectif.
theological_decisions:
- issue: Faut-il comprendre רוּחַ אֱלֹהִים comme « l’Esprit de Dieu », « l’esprit de Dieu » ou « un esprit divin » ?
  choice: l’Esprit de Dieu
  alternative: l’esprit de Dieu ; un esprit divin
  rationale: Le contexte présente Dieu lui-même comme celui qui équipe Betsaléel pour le service du sanctuaire. La majuscule indique donc probablement l’action de l’Esprit propre de Dieu, sans introduire dans le verset une précision doctrinale ultérieure. La note conserve l’ambiguïté grammaticale réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la structure cumulative de l’hébreu. « Savoir-faire » est retenu pour exprimer la compétence artisanale sans réduire מלאכה à une seule forme d’artisanat.
