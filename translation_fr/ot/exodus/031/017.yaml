  text: בֵּינִ֗/י וּ/בֵין֙ בְּנֵ֣י יִשְׂרָאֵ֔ל א֥וֹת הִ֖וא לְ/עֹלָ֑ם כִּי שֵׁ֣שֶׁת יָמִ֗ים עָשָׂ֤ה יְהוָה֙ אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֔רֶץ וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י שָׁבַ֖ת וַ/יִּנָּפַֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/017.yaml
  text: It is a sign forever between me and the sons of Israel[a], for in six days Yahweh made the heavens and the earth[c][b], and on the seventh day he ceased and was refreshed.
translation:
  language: fr
  text: 'C’est un signe pour toujours entre moi et les fils d’Israël[a] : en effet, en six jours, Yahweh a fait les cieux et la terre, et le septième jour, il a cessé[b] et a repris souffle[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites ».
    reason: lexical_alternative
  - marker: b
    text: Ou « il s’est reposé »; le verbe hébreu signifie plus littéralement « cesser ».
    reason: lexical_alternative
  - marker: c
    text: Ou « a été revigoré »; l’hébreu emploie une image anthropomorphique très concrète, liée au fait de reprendre souffle.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּינִי וּבֵין
  choice: entre moi et
  rationale: Expression française idiomatique qui rend la relation établie entre les deux parties.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Conserve l’expression familiale masculine de l’hébreu; « les Israélites » est signalé en note comme équivalent plus idiomatique.
- source_word: אוֹת
  choice: signe
  rationale: Terme courant et précis dans un contexte d’alliance, où le sabbat sert de signe durable.
- source_word: לְעֹלָם
  choice: pour toujours
  rationale: Rend directement la durée indéfinie ou permanente exprimée par l’hébreu dans un français actuel.
- source_word: כִּי
  choice: en effet
  rationale: Introduit ici la raison pour laquelle le sabbat est un signe; cette formulation relie naturellement les deux propositions.
- source_word: שֵׁשֶׁת יָמִים
  choice: en six jours
  rationale: Rend naturellement en français le cadre temporel de l’œuvre créatrice.
- source_word: עָשָׂה
  choice: a fait
  rationale: Équivalent direct du verbe hébreu dans la formule relative à la création des cieux et de la terre.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin, qui conserve sa qualité de nom propre.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: les cieux et la terre
  rationale: Conserve le pluriel hébreu de « cieux » et la formule globale désignant l’ordre créé.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: et le septième jour
  rationale: Suit la coordination et l’indication temporelle de l’hébreu sans leur imposer une valeur adversative.
- source_word: שָׁבַת
  choice: il a cessé
  rationale: Préserve le sens premier du verbe, cesser une activité, plutôt que d’introduire immédiatement l’idée de fatigue.
- source_word: וַיִּנָּפַשׁ
  choice: a repris souffle
  rationale: Rend de façon vive et intelligible l’image anthropomorphique liée au souffle, sans l’effacer par une abstraction.
theological_decisions:
- issue: Description anthropomorphique de Dieu dans le langage du sabbat
  choice: il a cessé et a repris souffle
  alternative: il s’est reposé et a été revigoré
  rationale: L’hébreu associe la cessation de l’activité à une image corporelle frappante. La traduction maintient cette tension sans expliquer ni atténuer le texte.
- issue: Traduction de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le texte principal conserve la métaphore généalogique explicite de l’hébreu, tandis que la note donne l’expression française plus courante.
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le recours au nom propre rend visible la présence du tétragramme dans le texte source sans lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en conservant les expressions marquées de l’hébreu, notamment « les fils d’Israël » et « a repris souffle ».
