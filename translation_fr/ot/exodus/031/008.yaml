source:
  edition: WLC
  text: וְ/אֶת הַ/שֻּׁלְחָן֙ וְ/אֶת כֵּלָ֔י/ו וְ/אֶת הַ/מְּנֹרָ֥ה הַ/טְּהֹרָ֖ה וְ/אֶת כָּל כֵּלֶ֑י/הָ וְ/אֵ֖ת מִזְבַּ֥ח הַ/קְּטֹֽרֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/008.yaml
  text: and the table with its utensils[a], and the pure lampstand with all its utensils, and the altar of incense[c][b],
translation:
  language: fr
  text: la table et ses ustensiles, le porte-lampes pur[a][b] et tous ses ustensiles, ainsi que l’autel des parfums[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la ménorah ». Le terme hébreu désigne le porte-lampes du sanctuaire; le texte traduit ici le nom commun au lieu de le transcrire.
    reason: lexical_alternative
  - marker: b
    text: Le mot « pur » peut évoquer la pureté rituelle et, dans le contexte du sanctuaire, probablement aussi l’or pur dont le porte-lampes est fait dans les descriptions apparentées.
    reason: cultural_note
  - marker: c
    text: Ou « l’autel de l’encens ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: la table
  rationale: Le nom שֻׁלְחָן désigne simplement une table. Le contexte identifie celle du sanctuaire, sans que le verset en donne ici la désignation complète.
- source_word: כֵּלָיו
  choice: ses ustensiles
  rationale: כְּלִי est un terme large pour des objets, récipients ou instruments. « Ustensiles » convient naturellement aux objets servant avec la table.
- source_word: הַמְּנֹרָה
  choice: le porte-lampes
  rationale: מְנוֹרָה désigne le support portant les lampes du sanctuaire. « Porte-lampes » traduit le nom commun sans introduire l’image anachronique de bougies que peut évoquer « chandelier ».
- source_word: הַטְּהֹרָה
  choice: pur
  rationale: טָהוֹר peut signifier « pur » ou « rituellement pur ». « Pur » conserve la portée cultuelle possible et l’écho probable à l’or pur employé pour cet objet.
- source_word: כָּל כֵּלֶיהָ
  choice: tous ses ustensiles
  rationale: La traduction garde la totalité exprimée par כָּל et désigne les instruments associés au porte-lampes.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: l’autel des parfums
  rationale: La chaîne construite signifie l’autel destiné à la fumée odorante. « Autel des parfums » est une formulation française biblique claire; « autel de l’encens » reste une autre traduction directe possible.
- source_word: וְאֶת
  choice: et / ainsi que
  rationale: La particule אֵת, qui marque le complément d’objet direct, ne se traduit pas. La conjonction וְ est rendue de façon naturelle tout en maintenant la structure de l’énumération.
theological_decisions:
- issue: Sens de « pur » appliqué au porte-lampes
  choice: Conserver simplement « pur » dans le texte
  alternative: Expliciter « fait d’or pur » ou « rituellement pur »
  rationale: L’hébreu ne précise pas ici si l’adjectif vise la pureté rituelle, la matière en or pur, ou fait résonner les deux idées. La traduction préserve cette tension sans la résoudre.
translation_notes:
  register: Français international moderne, digne et lisible. « Porte-lampes » est retenu pour éviter l’anachronisme possible de « chandelier ». La ponctuation et la minuscule initiale signalent que ce verset constitue un segment d’une énumération commencée au verset précédent.
