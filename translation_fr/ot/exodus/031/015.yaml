  text: שֵׁ֣שֶׁת יָמִים֮ יֵעָשֶׂ֣ה מְלָאכָה֒ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י שַׁבַּ֧ת שַׁבָּת֛וֹן קֹ֖דֶשׁ לַ/יהוָ֑ה כָּל הָ/עֹשֶׂ֧ה מְלָאכָ֛ה בְּ/י֥וֹם הַ/שַּׁבָּ֖ת מ֥וֹת יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/015.yaml
  text: Work may be done for six days[a], but on the seventh day there is a Sabbath of complete rest, holy to Yahweh. Whoever does work on the Sabbath day shall surely be put to death.
translation:
  language: fr
  text: Pendant six jours, on pourra travailler, mais le septième jour sera un sabbat de repos complet[a], consacré à Yahweh. Quiconque travaillera le jour du sabbat sera certainement mis à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un sabbat, un repos solennel ». L’expression hébraïque renforce l’idée de cessation et de repos.'
    reason: Variante lexicale reflétant la valeur intensive de שַׁבַּת שַׁבָּתוֹן.
lexical_decisions:
- source_word: יֵעָשֶׂה מְלָאכָה
  choice: on pourra travailler
  rationale: Le niphal imperfectif de עשה avec מְלָאכָה signifie littéralement que le travail « pourra être fait ». La tournure impersonnelle active est plus naturelle en français moderne et garde ici la valeur permissive propre au contexte légal.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: mais le septième jour
  rationale: La conjonction ו peut signifier « et », mais « mais » exprime naturellement le contraste entre les six jours de travail et le septième jour.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: un sabbat de repos complet
  rationale: La combinaison des deux termes intensifie l’idée de cessation et de repos. Cette formulation conserve le mot « sabbat » ainsi que la force intensive de שַׁבָּתוֹן.
- source_word: קֹדֶשׁ לַיהוָה
  choice: saint pour Yahweh
  rationale: קֹדֶשׁ attribue au jour un caractère sacré, tandis que ל indique qu’il est consacré à Yahweh. « Saint pour » est concis et garde cette orientation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre substitutif.
- source_word: כָּל הָעֹשֶׂה מְלָאכָה
  choice: quiconque travaillera
  rationale: La construction participiale avec כָּל désigne toute personne appartenant à cette catégorie légale. « Quiconque » en conserve la portée générale.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: le jour du sabbat
  rationale: La traduction conserve explicitement יוֹם, « jour », tout en restant idiomatique en français.
- source_word: מוֹת יוּמָת
  choice: sera certainement mis à mort
  rationale: L’infinitif absolu suivi de la forme hophal intensifie la sanction et exprime une mise à mort, non une simple mort. « Certainement » rend cette emphase.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel dans le cadre de l’alliance au Sinaï sans lui substituer un titre.
- issue: Force de l’expression שַׁבַּת שַׁבָּתוֹן
  choice: un sabbat de repos complet
  alternative: un sabbat, un repos solennel ; un sabbat de repos
  rationale: La traduction garde à la fois le terme « sabbat » et l’intensification de la cessation, sans introduire une formulation doctrinale ultérieure.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « on pourra travailler » privilégie la fluidité tout en conservant la permission légale; « sera certainement mis à mort » maintient la solennité et l’intensité de la sanction.
