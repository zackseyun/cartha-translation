  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Puis Yahweh parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Puis … parla
  rationale: Le wayyiqtol fait avancer le récit. « Puis » exprime naturellement la succession, tandis que « parla » conserve la valeur de דבר, plus précise ici qu’un simple « dit ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé dans le texte par un titre traditionnel.
- source_word: אֶל מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל désigne ici le destinataire de la parole; « à Moïse » est la formulation française naturelle.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'L’infinitif introduit le contenu du discours qui suit. « En ces termes : » rend cette fonction idiomatiquement en français sans ajouter de contenu.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahweh » préserve le nom personnel, tandis que « le SEIGNEUR » représente la lecture traditionnelle de substitution.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure formulaire hébraïque est rendue avec naturel, et les deux-points annoncent la parole divine des versets suivants.
