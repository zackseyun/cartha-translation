  text: וַ/יִּתֵּ֣ן אֶל מֹשֶׁ֗ה כְּ/כַלֹּת/וֹ֙ לְ/דַבֵּ֤ר אִתּ/וֹ֙ בְּ/הַ֣ר סִינַ֔י שְׁנֵ֖י לֻחֹ֣ת הָ/עֵדֻ֑ת לֻחֹ֣ת אֶ֔בֶן כְּתֻבִ֖ים בְּ/אֶצְבַּ֥ע אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/018.yaml
  text: And when he finished speaking with him on Mount Sinai[a], he gave Moses the two tablets of the testimony, tablets of stone, written with the finger of God.
translation:
  language: fr
  text: Lorsqu’il eut fini de parler avec Moïse sur le mont Sinaï, il lui donna les deux tables du témoignage, des tables de pierre écrites du doigt de Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « écrites par le doigt de Dieu ». L’expression hébraïque attribue de manière saisissante l’écriture directement à Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: il lui donna
  rationale: Le wayyiqtol de נתן poursuit le récit. Le pronom « lui » reprend naturellement Moïse, déjà nommé dans la proposition.
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: Lorsqu’il eut fini de parler
  rationale: La construction כ avec l’infinitif construit de כלה exprime l’achèvement dans le temps. Le passé antérieur marque naturellement en français que la parole s’achève avant le don des tables.
- source_word: אִתּוֹ
  choice: avec Moïse
  rationale: Le pronom renvoie le plus naturellement à Moïse dans le contexte. Répéter son nom évite l’ambiguïté peu naturelle de « avec lui » en français.
- source_word: בְּהַר סִינַי
  choice: sur le mont Sinaï
  rationale: Rendu français courant de la localisation sur une montagne.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: les deux tables du témoignage
  rationale: « Tables » est le terme français établi pour des plaques destinées à porter une inscription. « Témoignage » conserve le sens juridique et religieux de עֵדוּת sans le réduire explicitement à un document d’alliance.
- source_word: לֻחֹת אֶבֶן
  choice: des tables de pierre
  rationale: L’apposition hébraïque est conservée tout en indiquant clairement la matière.
- source_word: כְּתֻבִים
  choice: écrites
  rationale: Le participe passif de כתב signifie simplement « écrites » ; « gravées » préciserait un procédé que le mot n’énonce pas à lui seul.
- source_word: בְּאֶצְבַּע אֱלֹהִים
  choice: du doigt de Dieu
  rationale: Cette tournure française idiomatique conserve l’image concrète et l’attribution directe de l’écriture à Dieu. La préposition בְּ a ici une valeur instrumentale.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, אֱלֹהִים désigne au singulier le Dieu d’Israël.
theological_decisions:
- issue: Expression anthropomorphique de l’écriture divine
  choice: du doigt de Dieu
  alternative: directement par Dieu ; par la puissance de Dieu
  rationale: Le texte hébreu emploie une image corporelle concrète. La traduction la préserve au lieu de l’expliquer ou de l’atténuer, maintenant ainsi l’accent sur l’intervention directe de Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le rythme narratif et l’apposition de l’hébreu. « Mont Sinaï », « tables du témoignage » et « doigt de Dieu » maintiennent le vocabulaire biblique usuel sans archaïsme syntaxique excessif.
