source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֙ אֶת הַ/שַּׁבָּ֔ת כִּ֛י קֹ֥דֶשׁ הִ֖וא לָ/כֶ֑ם מְחַֽלְלֶ֨י/הָ֙ מ֣וֹת יוּמָ֔ת כִּ֗י כָּל הָ/עֹשֶׂ֥ה בָ/הּ֙ מְלָאכָ֔ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/014.yaml
  text: You shall keep the Sabbath[a], because it is holy to you. Whoever profanes it shall surely be put to death, for whoever does work on it[b], that person shall be cut off from among his people.
translation:
  language: fr
  text: Vous observerez le sabbat, car il est saint pour vous. Celui qui le profane sera assurément mis à mort ; en effet, toute personne qui y accomplit un travail sera retranchée du milieu de son peuple.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « retranchée du milieu de son peuple » est une formule juridique hébraïque ; le mode exact du jugement n’est pas précisé ici.
    reason: ambiguïté juridique de la formule hébraïque
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Vous observerez
  rationale: Dans ce contexte d’alliance et de prescription, שׁמר signifie respecter ou observer fidèlement. Le futur français exprime naturellement l’injonction juridique.
- source_word: הַשַּׁבָּת
  choice: le sabbat
  rationale: Désignation française courante de l’institution et du jour de repos consacré.
- source_word: קֹדֶשׁ הִוא לָכֶם
  choice: il est saint pour vous
  rationale: Cette formulation conserve à la fois l’idée de sainteté, c’est-à-dire de mise à part, et la nuance relationnelle de לָכֶם.
- source_word: מְחַלְלֶיהָ
  choice: Celui qui le profane
  rationale: Le piel de חלל signifie rendre profane ou traiter comme profane. La tournure française restitue la portée générale du participe hébreu.
- source_word: מוֹת יוּמָת
  choice: sera assurément mis à mort
  rationale: L’infinitif absolu suivi du verbe conjugué renforce la certitude de la sanction, tandis que la forme passive est conservée.
- source_word: כָּל הָעֹשֶׂה בָהּ מְלָאכָה
  choice: toute personne qui y accomplit un travail
  rationale: מְלָאכָה désigne ici un travail ou une activité laborieuse. « Y » renvoie sans ambiguïté au sabbat.
- source_word: וְנִכְרְתָה
  choice: sera retranchée
  rationale: La traduction garde l’image et la formule juridique de כרת sans préciser un mode de sanction que le verbe ne détermine pas à lui seul.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: toute personne
  rationale: Dans cette disposition juridique, נֶפֶשׁ désigne l’individu concerné, non une composante immatérielle appelée « âme ».
- source_word: מִקֶּרֶב עַמֶּיהָ
  choice: du milieu de son peuple
  rationale: Cette expression conserve l’idée d’un retranchement hors de la communauté et rend naturellement en français le suffixe grammaticalement lié à נֶפֶשׁ.
theological_decisions:
- issue: Portée de la formule וְנִכְרְתָה ... מִקֶּרֶב עַמֶּיהָ
  choice: Conserver « sera retranchée du milieu de son peuple » sans définir le mécanisme du jugement.
  alternative: « sera exclue de la communauté » ou « sera supprimée par un jugement divin »
  rationale: Le verset ne précise pas si la formule désigne ici une exclusion communautaire, une mort, ou une intervention divine. La traduction préserve cette indétermination.
- issue: Sens de נֶפֶשׁ dans la disposition juridique
  choice: Le rendre par « personne ».
  alternative: « âme »
  rationale: Le mot désigne ici l’individu passible de la sanction ; « âme » introduirait une précision anthropologique absente du contexte.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur à valeur impérative convient au registre légal. « Assurément » restitue l’emphase hébraïque sans recourir à une tournure archaïque.
