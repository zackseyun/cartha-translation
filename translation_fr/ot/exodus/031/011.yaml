  text: וְ/אֵ֨ת שֶׁ֧מֶן הַ/מִּשְׁחָ֛ה וְ/אֶת קְטֹ֥רֶת הַ/סַּמִּ֖ים לַ/קֹּ֑דֶשׁ כְּ/כֹ֥ל אֲשֶׁר צִוִּיתִ֖/ךָ יַעֲשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/011.yaml
  text: and the anointing oil[a], and the fragrant incense for the holy place. They shall make them according to all that I have commanded you.
translation:
  language: fr
  text: ainsi que l’huile d’onction et l’encens aromatique pour le sanctuaire. Ils feront tout conformément à ce que je t’ai ordonné.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: l’huile d’onction
  rationale: Expression française naturelle et consacrée qui rend directement l’huile destinée à l’onction, sans ajouter explicitement « sacrée ».
- source_word: קְטֹרֶת הַסַּמִּים
  choice: l’encens aromatique
  rationale: Rend de façon idiomatique l’encens composé de substances odoriférantes; « aromatique » exprime la valeur de סַמִּים sans alourdir la phrase.
- source_word: לַקֹּדֶשׁ
  choice: pour le sanctuaire
  rationale: Dans le contexte du tabernacle, le substantif « sanctuaire » exprime naturellement la destination cultuelle indiquée par « pour le lieu saint / ce qui est saint ».
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִךָ
  choice: conformément à ce que je t’ai ordonné
  rationale: Préserve l’idée de conformité intégrale portée par כְּכֹל, tandis que « tout » placé avec le verbe en explicite la portée globale en français.
- source_word: יַעֲשׂוּ
  choice: Ils feront tout
  rationale: Le sujet pluriel implicite renvoie aux artisans mentionnés dans le contexte. « tout » reprend naturellement l’ensemble des objets énumérés et évite un pronom français potentiellement ambigu.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La phrase demeure liée à l’énumération des versets précédents par « ainsi que ». Le futur injonctif « feront » convient au discours prescriptif sans archaïsme.
