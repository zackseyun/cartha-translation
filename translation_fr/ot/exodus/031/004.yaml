lexical_decisions:
- source_word: לַחְשֹׁב מַחֲשָׁבֹת
  choice: pour concevoir des motifs artistiques
  rationale: L’expression associe le verbe « penser, concevoir, planifier » au nom apparenté « pensées, projets, desseins ». Dans ce contexte d’artisanat, elle désigne la conception réfléchie de motifs ou de réalisations artistiques. Cette formulation naturelle en français restitue à la fois l’activité créatrice et le cadre artisanal.
- source_word: לַעֲשׂוֹת
  choice: travailler
  rationale: Devant une liste de métaux, le verbe עשה renvoie ici à l’exécution artisanale. « Travailler » est l’expression française idiomatique pour façonner ces matières.
- source_word: בַּזָּהָב וּבַכֶּסֶף
  choice: l’or, l’argent
  rationale: Après « travailler », le français emploie naturellement un complément direct pour désigner les matériaux. Cette tournure rend la valeur instrumentale ou matérielle de la préposition ב sans calque lourd.
- source_word: וּבַנְּחֹשֶׁת
  choice: et le bronze
  rationale: נְחֹשֶׁת peut désigner le cuivre ou le bronze. Dans le contexte des objets et aménagements du sanctuaire, « bronze » est le choix contextuel le plus probable et le plus usuel, tout en signalant l’ambiguïté en note.
