  text: and the finely woven garments[a], and the holy garments for Aaron the priest, and the garments of his sons for serving as priests,
translation:
  language: fr
  text: les vêtements finement tissés[a], les vêtements sacrés destinés au prêtre Aaron et les vêtements de ses fils, afin que ceux-ci exercent la fonction de prêtres,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les vêtements destinés au service », « les vêtements de service » ou « les vêtements tissés ». Le terme hébreu est difficile et peut souligner soit leur confection, soit leur usage dans le service du sanctuaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  choice: les vêtements finement tissés
  rationale: Le sens de שְׂרָד est difficile. Dans ce contexte sacerdotal, l’expression peut désigner des vêtements spécialement ouvragés ou tissés, mais elle peut aussi mettre l’accent sur leur fonction cultuelle. La traduction retient le sens probable lié à la confection tout en signalant l’incertitude en note.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: les vêtements sacrés
  rationale: Littéralement « les vêtements de sainteté ». « Vêtements sacrés » est naturel en français moderne et indique clairement leur mise à part pour le culte.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: destinés au prêtre Aaron
  rationale: La préposition לְ marque ici l’attribution ou la destination. « Le prêtre Aaron » restitue naturellement l’apposition hébraïque.
- source_word: בִּגְדֵי בָנָיו
  choice: les vêtements de ses fils
  rationale: La construction avec suffixe renvoie à Aaron et se traduit directement et clairement.
- source_word: לְכַהֵן
  choice: pour qu’ils exercent le sacerdoce
  rationale: L’infinitif כהן signifie exercer la fonction de prêtre. Cette formulation française exprime la fonction sacerdotale sans réduire le terme au sens général de servir.
- source_word: וְאֵת / וְאֶת
  choice: juxtaposition coordonnée dans l’énumération
  rationale: אֵת est un marqueur d’objet direct sans équivalent lexical en français. Les וְ successifs structurent la liste; en français, la ponctuation et la coordination finale rendent cette continuité sans lourdeur.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le verset demeure un élément d’une énumération commencée au verset précédent; la minuscule initiale et la virgule finale en préservent la continuité syntaxique. « Sacrés » évite la tournure moins naturelle « vêtements saints », tandis que la note conserve l’ambiguïté de בִּגְדֵי הַשְּׂרָד.
