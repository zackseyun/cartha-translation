  - severity: medium
    issue: « en observant le sabbat » ne rend pas nettement le complément de but לַעֲשׂוֹת.
    rationale: L’infinitif précédé de לְ exprime ici le dessein ou l’accomplissement attendu. « Pour observer le sabbat » conserve mieux cette relation.
  - severity: medium
    issue: Les ancres [a] et [b] sont toutes deux placées après la phrase, au lieu d’être attachées aux expressions commentées.
    rationale: La note a explique « faire/observer le sabbat » et doit suivre la seconde occurrence de « sabbat »; la note b explique « alliance perpétuelle » et doit suivre cette expression.
