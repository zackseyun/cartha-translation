  text: וְ/שָׁמְר֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶת הַ/שַּׁבָּ֑ת לַ/עֲשׂ֧וֹת אֶת הַ/שַּׁבָּ֛ת לְ/דֹרֹתָ֖/ם בְּרִ֥ית עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/016.yaml
  text: So the sons of Israel shall keep the Sabbath[c][b][a], to observe the Sabbath throughout their generations as an everlasting covenant.
translation:
  language: fr
  text: Les fils d’Israël garderont le sabbat, pour observer le sabbat[a] de génération en génération, comme une alliance perpétuelle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « faire le sabbat » ; c’est-à-dire l’observer ou le garder.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une alliance éternelle » ou « une alliance à jamais ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: garderont donc
  rationale: Le verbe שׁמר signifie « garder, observer ». Le futur français conserve ici la force prescriptive et covenantale du contexte; « donc » relie naturellement cette prescription aux versets précédents.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction garde l’expression familiale masculine littérale de l’hébreu, qui désigne collectivement le peuple de l’alliance.
- source_word: הַשַּׁבָּת
  choice: le sabbat
  rationale: Terme français usuel pour l’institution désignée par שַׁבָּת.
- source_word: לַעֲשׂוֹת אֶת הַשַּׁבָּת
  choice: en observant le sabbat
  rationale: Littéralement « faire le sabbat »; « observer » exprime naturellement en français l’accomplissement fidèle de cette pratique, sans répétition directe de « garder ».
- source_word: לְדֹרֹתָם
  choice: de génération en génération
  rationale: Formulation française naturelle qui exprime la continuité au fil des générations successives.
- source_word: בְּרִית עוֹלָם
  choice: comme une alliance perpétuelle
  rationale: « Alliance » rend בְּרִית et « perpétuelle » exprime la durée indéfiniment continue de עוֹלָם sans imposer une interprétation théologique ultérieure. « Comme » explicite la valeur appositionnelle ou prédicative de la formule finale.
theological_decisions:
- issue: Désignation du peuple de l’alliance בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites; les enfants d’Israël
  rationale: Le choix conserve la forme familiale masculine de l’hébreu tout en laissant l’expression fonctionner collectivement pour le peuple entier.
- issue: Portée temporelle de בְּרִית עוֹלָם
  choice: alliance perpétuelle
  alternative: alliance éternelle; alliance à jamais
  rationale: « Perpétuelle » préserve la force durable de עוֹלָם dans ce contexte d’alliance, sans trancher des questions théologiques dépassant l’énoncé du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La structure demeure proche de l’hébreu, tandis que l’idiome « faire le sabbat » est rendu dans un français naturel. Les deux occurrences de « sabbat » sont conservées.
