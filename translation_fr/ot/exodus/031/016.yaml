  naturalness: « En observant le sabbat » après « garderont ... le sabbat » est grammaticalement possible, mais brouille la relation de but exprimée par לַעֲשׂוֹת. « Pour observer » est plus clair et plus proche de la syntaxe source.
  terminology: « Les fils d’Israël », « sabbat » et « alliance perpétuelle » sont des choix exacts et d’un registre moderne approprié. Les notes lexicales sont utiles, mais leurs appels doivent être placés auprès des éléments qu’elles expliquent.
