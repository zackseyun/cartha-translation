source:
  edition: WLC
  text: וַ/אֲנִ֞י הִנֵּ֧ה נָתַ֣תִּי אִתּ֗/וֹ אֵ֣ת אָהֳלִיאָ֞ב בֶּן אֲחִֽיסָמָךְ֙ לְ/מַטֵּה דָ֔ן וּ/בְ/לֵ֥ב כָּל חֲכַם לֵ֖ב נָתַ֣תִּי חָכְמָ֑ה וְ/עָשׂ֕וּ אֵ֖ת כָּל אֲשֶׁ֥ר צִוִּיתִֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/006.yaml
  text: And behold[a], I have appointed with him Oholiab son of Ahisamach, of the tribe of Dan; and in the heart of everyone wise of heart I have put wisdom[b], that they may make all that I have commanded you.
translation:
  language: fr
  text: Quant à moi, voici que j’ai placé à ses côtés Oholiab, fils d’Ahisamak, de la tribu de Dan. J’ai aussi mis la sagesse dans le cœur de tous ceux qui ont le cœur sage[a], afin qu’ils réalisent[b] tout ce que je t’ai commandé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « sage de cœur » désigne ici des personnes auxquelles ont été accordés discernement et savoir-faire.
    reason: cultural_note
  - marker: b
    text: 'Ou, plus formellement : « et ils réaliseront » ou « et ils réaliseront ainsi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: Quant à moi, voici que
  rationale: « Quant à moi » rend la force emphatique du pronom indépendant אֲנִי, tandis que « voici que » conserve la fonction d’appel à l’attention de הִנֵּה dans un français soutenu mais actuel.
- source_word: נָתַתִּי אִתּוֹ
  choice: j’ai placé à ses côtés
  rationale: Le verbe נָתַן signifie littéralement « donner, mettre, placer » et, dans ce contexte de mission, indique qu’Oholiab est adjoint à Betsaléel. Cette formulation conserve explicitement l’idée de présence « avec lui » sans rendre le français artificiel.
- source_word: אָהֳלִיאָב בֶּן אֲחִיסָמָךְ
  choice: Oholiab, fils d’Ahisamak
  rationale: Translittération française claire des noms propres hébreux et rendu habituel de la relation filiale.
- source_word: לְמַטֵּה דָן
  choice: de la tribu de Dan
  rationale: Dans ce contexte, מַטֶּה désigne l’appartenance tribale.
- source_word: וּבְלֵב כָּל חֲכַם לֵב
  choice: dans le cœur de tous ceux qui ont le cœur sage
  rationale: La formulation conserve la répétition de לֵב et l’anthropologie hébraïque du cœur comme siège de l’intelligence et du savoir-faire, tout en restant compréhensible en français.
- source_word: נָתַתִּי חָכְמָה
  choice: j’ai mis la sagesse
  rationale: « Mis » garde la métaphore concrète du don placé dans le cœur, et « sagesse » préserve la portée de חָכְמָה, qui inclut ici l’habileté artisanale.
- source_word: וְעָשׂוּ
  choice: afin qu’ils réalisent
  rationale: Le contexte permet de comprendre la proposition comme exprimant le but ou le résultat du don divin de sagesse. « Réaliser » convient aux objets et travaux commandés sans réduire le verbe à une simple fabrication.
- source_word: אֵת כָּל אֲשֶׁר צִוִּיתִךָ
  choice: tout ce que je t’ai commandé
  rationale: Rendu direct de l’expression de totalité et du commandement adressé à Moïse.
theological_decisions:
- issue: Sens de חֲכַם־לֵב et חָכְמָה dans un contexte artisanal
  choice: le cœur sage / la sagesse
  alternative: habile / le savoir-faire
  rationale: Le contexte concerne bien l’habileté des artisans, mais le vocabulaire de la sagesse et du cœur présente cette compétence pratique comme un don divin. Le conserver évite d’aplatir cette dimension sans imposer une interprétation confessionnelle.
- issue: Valeur de וְעָשׂוּ après le don de sagesse
  choice: afin qu’ils réalisent
  alternative: et ils réaliseront
  rationale: 'La relation de but ou de résultat est naturelle dans le contexte : Dieu accorde la sagesse en vue de l’exécution de ses ordres. Une note conserve toutefois la possibilité d’une coordination plus formelle.'
translation_notes:
  register: Français international moderne, digne et lisible. La tournure emphatique initiale et l’image hébraïque du cœur sont conservées; les formulations inutilement archaïques sont évitées.
