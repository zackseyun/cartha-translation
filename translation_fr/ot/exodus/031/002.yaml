  text: See[a], I have called by name Bezalel son of Uri, son of Hur, of the tribe of Judah.
translation:
  language: fr
  text: Vois[a], j’ai appelé par son nom Betsaléel, fils d’Ouri, fils de Hour, de la tribu de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Regarde, j’ai appelé nommément Betsaléel. » L’expression hébraïque « appeler par son nom » peut exprimer une désignation personnelle et précise.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: רְאֵה
  choice: Vois
  rationale: L’impératif attire directement l’attention de l’interlocuteur. « Vois » conserve la forme et la force du texte hébreu, tandis que « Regarde » constitue une possibilité naturelle en français.
- source_word: קָרָאתִי בְשֵׁם
  choice: j’ai appelé par son nom
  rationale: La traduction garde l’expression hébraïque, qui peut indiquer non seulement le fait de nommer, mais aussi une désignation personnelle et précise, sans introduire explicitement l’idée plus interprétative de nomination à une fonction.
- source_word: בְּצַלְאֵל
  choice: Betsaléel
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: בֶּן
  choice: fils de
  rationale: Dans cette formule généalogique, le terme désigne naturellement la filiation immédiate.
- source_word: אוּרִי
  choice: Ouri
  rationale: Translittération française usuelle du nom propre.
- source_word: חוּר
  choice: Hour
  rationale: Translittération française usuelle du nom propre.
- source_word: לְמַטֵּה
  choice: de la tribu de
  rationale: Dans ce contexte généalogique, מַטֶּה désigne une tribu, et la préposition marque l’appartenance.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle et courante du nom de la tribu.
