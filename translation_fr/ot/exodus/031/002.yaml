translation_notes:
  register: Français moderne, digne et direct. La syntaxe généalogique répétitive (« fils de… fils de… ») est conservée, de même que l’expression hébraïque « appelé par son nom », afin de préserver sa nuance de désignation sans la réduire à une nomination officielle.
