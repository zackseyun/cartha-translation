  text: the tent of meeting[a], and the ark of the testimony, and the mercy seat that is on it[b], and all the furnishings of the tent—
translation:
  language: fr
  text: la tente de la rencontre, l’arche du témoignage[a], le propitiatoire qui se trouve sur elle[b], et tous les objets de la tente —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’arche destinée au témoignage ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le couvercle d’expiation qui se trouve sur elle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Expression française naturelle et proche de la construction hébraïque; elle désigne la tente où Dieu rencontre Israël.
- source_word: הָאָרֹן לָעֵדֻת
  choice: l’arche destinée au témoignage
  rationale: La préposition ל peut marquer la destination ou la relation. « Destinée au témoignage » rend explicitement cette nuance sans introduire le mot « alliance », absent de l’hébreu.
- source_word: הַכַּפֹּרֶת
  choice: le propitiatoire
  rationale: Terme traditionnel et précis en français biblique pour le couvercle d’or placé sur l’arche, tout en conservant ses associations cultuelles sans les développer dans le texte.
- source_word: אֲשֶׁר עָלָיו
  choice: qui se trouve sur elle
  rationale: Rend simplement la proposition relative et la préposition עַל; le pronom renvoie à l’arche.
- source_word: כָּל כְּלֵי הָאֹהֶל
  choice: tous les objets de la tente
  rationale: כְּלִים est un terme large désignant les divers objets et accessoires de la tente. « Objets » évite de le limiter aux ustensiles.
theological_decisions:
- issue: Sens de הַכַּפֹּרֶת dans le contexte du sanctuaire
  choice: le propitiatoire
  alternative: le couvercle d’expiation
  rationale: « Propitiatoire » maintient la continuité du vocabulaire biblique français et les connotations cultuelles du terme, tandis que l’alternative plus descriptive est signalée en note sans imposer une explication doctrinale au verset.
- issue: Relation entre l’arche et le témoignage exprimée par ל
  choice: l’arche destinée au témoignage
  alternative: l’arche du témoignage
  rationale: Le texte hébreu permet une relation de destination aussi bien qu’une formulation traditionnelle de possession ou d’association; la traduction retient la première et préserve l’autre en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le verset demeure un élément de l’énumération commencée au verset précédent; le tiret final en signale la continuation.
