  text: וְ/נָתַתָּ֗ה אֶת שְׁתֵּי֙ עֲבֹתֹ֣ת הַ/זָּהָ֔ב עַל שְׁתֵּ֖י הַ/טַּבָּעֹ֑ת אֶל קְצ֖וֹת הַ/חֹֽשֶׁן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/024.yaml
  text: And you shall put the two braided chains of gold on the two rings[b][a], at the ends of the breastpiece.
translation:
  language: fr
  text: Tu fixeras les deux chaînettes d’or torsadées[a] aux deux anneaux, aux extrémités du pectoral.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chaînettes entrelacées » ou « cordons torsadés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Tu fixeras
  rationale: Dans cette suite d’instructions, le parfait qal avec waw exprime un ordre. « Fixeras » rend naturellement l’action de placer les chaînettes sur des anneaux en vue de leur attache.
- source_word: עֲבֹתֹת הַזָּהָב
  choice: les deux chaînettes d’or torsadées
  rationale: עֲבֹתֹת désigne ici des ouvrages en forme de cordons ou de chaînes entrelacées. « Chaînettes d’or torsadées » convient à la parure sacerdotale et exprime à la fois la matière et le mode de fabrication.
- source_word: עַל שְׁתֵּי הַטַּבָּעֹת
  choice: aux deux anneaux
  rationale: עַל indique ici le point de placement ou d’attache. En français, « fixer aux anneaux » est plus idiomatique que « fixer sur les anneaux ».
- source_word: אֶל קְצֹוֹת הַחֹשֶׁן
  choice: aux extrémités du pectoral
  rationale: קְצֹוֹת désigne les extrémités ou les bords. « Pectoral » est le terme français courant pour חֹשֶׁן, élément ornemental du vêtement sacerdotal plutôt que pièce d’armure.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve le caractère direct de l’instruction artisanale et emploie « pectoral », terme usuel dans ce contexte cultuel.
