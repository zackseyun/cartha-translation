translation:
  language: fr
  text: une clochette en or et une grenade[a], une clochette en or et une grenade, tout autour du bord inférieur de la robe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « grenade » désigne probablement un ornement en forme de grenade, placé entre les clochettes.
