lexical_decisions:
- source_word: פַּעֲמֹן
  choice: clochette
  rationale: Le nom désigne ici une petite cloche fixée au vêtement sacerdotal. « Clochette » exprime naturellement sa taille et convient mieux que le terme plus général « cloche ».
- source_word: זָהָב
  choice: en or
  rationale: Cette tournure française indique clairement la matière de la clochette et rend naturellement la construction hébraïque.
- source_word: רִמּוֹן
  choice: grenade
  rationale: Le mot signifie normalement « grenade ». Dans ce contexte, il désigne vraisemblablement un ornement en forme de grenade, mais le texte principal conserve l'expression concrète et concise de l'hébreu.
- source_word: עַל ... סָבִיב
  choice: tout autour de
  rationale: La combinaison de la préposition עַל avec l'adverbe סָבִיב indique que les ornements sont disposés sur le pourtour du bord de la robe. « Tout autour de » en restitue naturellement le sens global.
- source_word: שׁוּלֵי
  choice: bord inférieur
  rationale: Dans ce contexte vestimentaire, le pluriel construit désigne la partie basse ou le bord inférieur du vêtement. Cette formulation est claire et évite que « ourlet » soit compris strictement comme une couture repliée.
- source_word: מְעִיל
  choice: robe
  rationale: Dans le contexte des vêtements sacerdotaux, « robe » est l'équivalent français courant et précis.
