  - severity: medium
    issue: « afin qu’ils exercent pour moi le ministère de prêtres »
    rationale: La formulation est lourde et peu idiomatique. « Être prêtres à mon service » exprime naturellement la fonction sacerdotale et la relation marquée par לִי.
