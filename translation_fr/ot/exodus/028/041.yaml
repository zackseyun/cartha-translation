base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/041.yaml
  text: You shall clothe Aaron your brother and his sons with him[a], and you shall anoint them and ordain them and consecrate them, and they shall serve as priests to me.
translation:
  language: fr
  text: Tu revêtiras Aaron, ton frère, ainsi que ses fils avec lui ; tu les oindras, tu les établiras dans leur fonction[a] et tu les consacreras, afin qu’ils soient prêtres à mon service.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu rempliras leur main », expression hébraïque désignant l’installation de quelqu’un dans la fonction sacerdotale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ
  choice: Tu en revêtiras
  rationale: Le hifil de לבשׁ exprime l’action de vêtir quelqu’un. Le pronom « en » renvoie naturellement en français aux vêtements sacerdotaux décrits dans le contexte.
- source_word: אֹתָם אֶת־אַהֲרֹן אָחִיךָ וְאֶת־בָּנָיו אִתּוֹ
  choice: Aaron, ton frère, ainsi que ses fils avec lui
  rationale: La formulation identifie les personnes visées tout en conservant « avec lui » (אִתּוֹ), qui présente Aaron comme la figure principale accompagnée de ses fils.
- source_word: וּמָשַׁחְתָּ אֹתָם
  choice: Tu leur donneras l’onction
  rationale: משׁח est ici le terme rituel de l’onction sacerdotale. Cette tournure est claire, digne et courante en français biblique moderne.
- source_word: וּמִלֵּאתָ אֶת־יָדָם
  choice: tu les établiras dans leur fonction
  rationale: Littéralement « tu rempliras leur main », cette expression idiomatique désigne l’installation officielle dans la fonction sacerdotale. La traduction choisie évite à la fois l’opacité du calque et les connotations confessionnelles possibles de « ordonner ».
- source_word: וְקִדַּשְׁתָּ אֹתָם
  choice: tu les consacreras
  rationale: קדשׁ indique ici la mise à part pour un service sacré. « Consacrer » rend précisément cette dimension cultuelle.
- source_word: וְכִהֲנוּ לִי
  choice: afin qu’ils exercent pour moi le ministère de prêtres
  rationale: Le piel de כהן signifie exercer la fonction de prêtre. La subordination finale exprime naturellement en français le résultat visé par les actes précédents, tandis que « pour moi » préserve לִי.
theological_decisions:
- issue: Sens de l’expression sacerdotale מִלֵּא אֶת־יָד
  choice: La rendre par « les établir dans leur fonction »
  alternative: « remplir leur main » ou « les ordonner »
  rationale: L’expression désigne l’installation dans la charge sacerdotale. Le choix retenu communique sa fonction sans laisser croire à un geste littéral ni importer une conception confessionnelle ultérieure de l’ordination.
- issue: Relation logique de וְכִהֲנוּ לִי
  choice: « afin qu’ils exercent pour moi le ministère de prêtres »
  alternative: « et ils exerceront pour moi le ministère de prêtres »
  rationale: Dans cette série d’instructions, la dernière proposition peut naturellement exprimer le but ou le résultat de la consécration. « Afin que » explicite cette relation contextuelle sans modifier le contenu de la fonction sacerdotale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le tutoiement adressé par Dieu à Moïse suit le singulier hébreu. Les termes « onction », « consacrer » et « ministère de prêtres » maintiennent le registre rituel sans archaïsme excessif.
