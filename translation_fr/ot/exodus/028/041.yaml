  verdict: revise
  source_fidelity: La séquence des actions rituelles et leur destinataire sont bien rendus. Une formulation plus directe est toutefois nécessaire pour l’onction (משׁח) et pour la fonction sacerdotale (כהן). La tournure finale introduite par « afin que » est admissible ici comme expression du but de la consécration.
  naturalness: « Tu leur donneras l’onction » et surtout « exercer pour moi le ministère de prêtres » sont moins naturels en français international moderne. « Tu les oindras » et « qu’ils soient prêtres à mon service » sont à la fois idiomatiques et précis.
  terminology: « Oindre », « consacrer » et « prêtres » sont les termes rituels établis et accessibles. « Établir dans leur fonction » rend sans surcharge confessionnelle l’idiome « remplir leur main ».
