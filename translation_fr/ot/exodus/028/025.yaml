  text: וְ/אֵ֨ת שְׁתֵּ֤י קְצוֹת֙ שְׁתֵּ֣י הָ/עֲבֹתֹ֔ת תִּתֵּ֖ן עַל שְׁתֵּ֣י הַֽ/מִּשְׁבְּצ֑וֹת וְ/נָתַתָּ֛ה עַל כִּתְפ֥וֹת הָ/אֵפֹ֖ד אֶל מ֥וּל פָּנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/025.yaml
  text: And you shall put the two ends of the two cords on the two settings[a], and you shall place them on the shoulder pieces of the ephod, at its front.
translation:
  language: fr
  text: Tu fixeras les deux extrémités des deux cordons[a] aux deux montures, puis tu placeras celles-ci sur les épaulières de l’éphod, sur le devant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chaînes ». Le terme hébreu peut désigner des cordons entrelacés ou un ouvrage de chaînettes; le contexte des pièces d’or favorise l’image de chaînes.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצוֹת
  choice: extrémités
  rationale: Le nom désigne les points terminaux des cordons ou chaînettes; « extrémités » est précis et naturel dans une instruction de confection.
- source_word: הָעֲבֹתֹת
  choice: cordons
  rationale: Le terme peut désigner des cordons entrelacés ou un ouvrage en chaînettes. « Cordons » conserve l’image fondamentale, tandis que l’alternative liée au travail de l’or est signalée en note.
- source_word: הַמִּשְׁבְּצֹת
  choice: montures
  rationale: Le mot désigne ici des pièces d’or servant de supports ou de montures. « Montures » reste compréhensible sans préciser indûment leur forme ornementale.
- source_word: כִתְפֹת
  choice: épaulières
  rationale: Dans le contexte d’un vêtement, le terme renvoie aux parties qui couvrent les épaules plutôt qu’aux épaules anatomiques.
- source_word: אֵפֹד
  choice: éphod
  rationale: Ce vêtement sacerdotal spécialisé n’a pas d’équivalent français exact; la translittération traditionnelle est donc conservée.
- source_word: אֶל מוּל פָּנָיו
  choice: sur le devant
  rationale: La locution indique le côté antérieur de l’éphod; cette formulation française exprime naturellement l’instruction spatiale.
- source_word: וְנָתַתָּה
  choice: tu placeras celles-ci
  rationale: Le pronom reprend naturellement les montures portant les extrémités déjà fixées, conformément à l’enchaînement de l’instruction.
