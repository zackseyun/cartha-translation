translation_notes:
  register: Français international moderne, clair et digne. Le futur prescriptif maintient le ton des instructions. « La robe » est explicité à partir du contexte immédiat afin d’éviter un pronom possessif ambigu en français. La note conserve la différence entre le sens lexical littéral et la fonction décorative probable.
