  yaml_path: translation/ot/exodus/028/033.yaml
  text: You shall make on its hem pomegranates of blue and purple and scarlet yarn[a], all around its hem, with bells of gold between them all around.
translation:
  language: fr
  text: Tu feras, sur le bord inférieur de la robe, des grenades de fil bleu, pourpre et écarlate[a], tout autour du bord inférieur, et des clochettes d’or entre elles, tout autour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des ornements en forme de grenades ». L’hébreu dit littéralement « des grenades ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Dans cette suite d’instructions cultuelles, le parfait qal avec waw exprime un commandement. Le futur français convient au style prescriptif.
- source_word: עַל שׁוּלָיו
  choice: sur le bas de la robe / autour de son bord
  rationale: שׁוּל désigne ici la partie inférieure ou le bord du vêtement. La première formulation explicite le référent contextuel; la seconde évite une répétition lourde tout en conservant l’idée du pourtour inférieur.
- source_word: רִמֹּנֵי
  choice: des grenades
  rationale: Le nom hébreu signifie littéralement « grenades ». Le texte principal conserve cette désignation concrète sans préciser de lui-même qu’il s’agit d’ornements en forme de grenades.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: en fil bleu, pourpre et écarlate
  rationale: Ces termes désignent les matières textiles teintes caractéristiques du sanctuaire. « Fil » rend explicite leur nature textile, tandis que les trois couleurs restent clairement coordonnées.
- source_word: סָבִיב
  choice: tout autour
  rationale: Cette expression restitue la disposition circulaire et distributive des ornements sur tout le bord du vêtement.
- source_word: וּפַעֲמֹנֵי זָהָב
  choice: avec des clochettes d’or
  rationale: « Clochettes » convient à de petits objets suspendus à un vêtement; « d’or » suit directement la construction hébraïque.
- source_word: בְּתוֹכָם
  choice: entre elles
  rationale: Littéralement « au milieu d’elles/eux », le terme indique ici que les clochettes sont disposées parmi les grenades, vraisemblablement en alternance. « Entre elles » exprime naturellement cette relation spatiale sans détailler davantage le motif.
