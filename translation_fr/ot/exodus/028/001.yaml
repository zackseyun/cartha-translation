source:
  edition: WLC
  text: וְ/אַתָּ֡ה הַקְרֵ֣ב אֵלֶי/ךָ֩ אֶת אַהֲרֹ֨ן אָחִ֜י/ךָ וְ/אֶת בָּנָ֣י/ו אִתּ֔/וֹ מִ/תּ֛וֹךְ בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/כַהֲנ/וֹ לִ֑/י אַהֲרֹ֕ן נָדָ֧ב וַ/אֲבִיה֛וּא אֶלְעָזָ֥ר וְ/אִיתָמָ֖ר בְּנֵ֥י אַהֲרֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/001.yaml
  text: 'And you[a], bring near to yourself Aaron your brother, and his sons with him, from among the sons of Israel, to serve as priests for me: Aaron, Nadab and Abihu, Eleazar and Ithamar, Aaron’s sons.'
translation:
  language: fr
  text: 'Et toi, fais venir auprès de toi Aaron, ton frère, et ses fils avec lui, du milieu des fils d’Israël[a], afin qu’il exerce le sacerdoce pour moi : Aaron, Nadab et Abihou, Éléazar et Itamar, les fils d’Aaron.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du milieu des Israélites ». L’hébreu dit littéralement « du milieu des fils d’Israël », désignation habituelle du peuple de l’alliance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Et toi
  rationale: Le pronom indépendant est emphatique et marque un déplacement du discours vers la responsabilité personnelle de Moïse.
- source_word: הַקְרֵב אֵלֶיךָ
  choice: fais venir auprès de toi
  rationale: Le hiphil de קרב exprime le fait de faire approcher. Cette formulation conserve le mouvement concret vers Moïse sans anticiper toute la consécration sacerdotale.
- source_word: אַהֲרֹן אָחִיךָ
  choice: Aaron, ton frère
  rationale: La relation fraternelle explicitement soulignée en hébreu est conservée.
- source_word: וְאֶת־בָּנָיו אִתּוֹ
  choice: et ses fils avec lui
  rationale: La formulation maintient אִתּוֹ et présente Aaron accompagné de ses fils.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: du milieu des fils d’Israël
  rationale: Cette traduction garde l’image de la sélection opérée au sein du peuple de l’alliance, ainsi que la désignation hébraïque traditionnelle.
- source_word: לְכַהֲנוֹ לִי
  choice: afin qu’ils exercent pour moi la fonction de prêtres
  rationale: Le verbe dénominal כהן désigne l’exercice du service sacerdotal. La tournure française exprime cette fonction et rend explicitement le pluriel collectif impliqué par Aaron et ses fils, tout en conservant « pour moi ».
- source_word: בְּנֵי אַהֲרֹן
  choice: les fils d’Aaron
  rationale: La construction généalogique finale identifie clairement les quatre hommes nommés comme les fils d’Aaron.
theological_decisions:
- issue: Désignation collective בְּנֵי יִשְׂרָאֵל
  choice: du milieu des fils d’Israël
  alternative: du milieu des Israélites
  rationale: La formulation principale préserve la désignation traditionnelle et concrète du texte hébreu sans nier sa portée collective. L’équivalent collectif naturel en français est signalé en note.
- issue: Portée de לְכַהֲנוֹ לִי
  choice: afin qu’ils exercent pour moi la fonction de prêtres
  alternative: pour qu’Aaron exerce pour moi la fonction de prêtre
  rationale: Dans le contexte syntaxique, Aaron et ses fils constituent ensemble le groupe appelé au sacerdoce. Le pluriel français évite de faire porter la fonction sur Aaron seul, sans ajouter de précision confessionnelle sur la nature du sacerdoce.
translation_notes:
  register: 'Français international moderne, digne et accessible. « Fais venir auprès de toi » garde la proximité concrète du verbe hébreu tout en restant naturel. Les noms propres suivent des formes françaises bibliques courantes : Abihou, Éléazar et Itamar.'
