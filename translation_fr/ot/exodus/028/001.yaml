  terminology: Les formes Aaron, Nadab, Abihou, Éléazar et Itamar sont des formes bibliques françaises usuelles. « Fonction de prêtre » rend correctement le service sacerdotal, mais « exerce le sacerdoce » est plus direct et idiomatique ici. La note sur « fils d’Israël » est appropriée.
