revisions:
- from: Tu leur feras aussi des caleçons de lin pour couvrir leur nudité[a] ; ils iront des reins jusqu’aux cuisses.
  to: Tu leur feras des sous-vêtements de lin pour couvrir leur chair nue[a] ; ils s’étendront des hanches jusqu’aux cuisses.
  rationale: Révision limitée afin de rendre la limite supérieure du vêtement avec exactitude, d’employer un terme français moderne moins spécifiquement anachronique que « caleçons », et de conserver dans le texte comme dans la note la portée concrète mais non surinterprétée de l’expression hébraïque.
  reviewer_model: gpt-5.6-terra
