review_pass:
  verdict: revise
  source_fidelity: 'La formulation « des reins » est inadéquate en français moderne pour la limite supérieure d’un vêtement : elle évoque surtout la région lombaire ou les organes. מָתְנַיִם désigne ici la taille/les hanches. « Leur chair nue » rend plus explicitement בְּשַׂר עֶרְוָה que « leur nudité », tout en évitant une interprétation anatomique plus précise que le texte.'
  naturalness: « Caleçons » est compréhensible, mais son registre contemporain et son association avec un sous-vêtement masculin ordinaire sont trop étroits pour le vêtement sacerdotal décrit. « Sous-vêtements de lin » est moderne, naturel et conserve la fonction du terme. « S’étendront des hanches jusqu’aux cuisses » est une formulation idiomatique pour l’étendue du vêtement.
  terminology: Le lin est conservé. « Sous-vêtements » rend la fonction de מִכְנְסֵי sans recourir à l’archaïque « braies » ni imposer une coupe précise. La note conserve la littéralité de l’expression hébraïque sans affirmer qu’elle désigne nécessairement les seules parties génitales.
  issues:
  - severity: medium
    issue: « des reins » désigne une région anatomique inappropriée comme point de départ d’un vêtement.
    rationale: Dans ce contexte, מָתְנַיִם renvoie à la taille ou aux hanches. « Des hanches » est plus naturel et plus exact en français moderne.
  - severity: low
    issue: « Caleçons » est trop spécifique et de registre trop quotidien.
    rationale: Le terme hébreu désigne un vêtement inférieur de lin porté sous les vêtements sacerdotaux, sans permettre de déterminer avec certitude une coupe moderne de caleçon.
  - severity: low
    issue: La note identifie l’expression hébraïque aux « parties intimes » de façon trop restrictive.
    rationale: L’expression « chair de nudité » concerne la chair exposée dans le cadre de la couverture requise; une note littérale doit préserver cette marge sémantique.
  revised_text: Tu leur feras des sous-vêtements de lin pour couvrir leur chair nue[a] ; ils s’étendront des hanches jusqu’aux cuisses.
  revised_footnotes:
