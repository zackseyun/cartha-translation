  text: וַ/עֲשֵׂ֤ה לָ/הֶם֙ מִכְנְסֵי בָ֔ד לְ/כַסּ֖וֹת בְּשַׂ֣ר עֶרְוָ֑ה מִ/מָּתְנַ֥יִם וְ/עַד יְרֵכַ֖יִם יִהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/042.yaml
  text: And make for them linen undergarments to cover their naked flesh[b][a]; they shall be from the hips to the thighs.
translation:
  language: fr
  text: Tu leur feras des sous-vêtements de lin pour couvrir leur chair nue[a] ; ils s’étendront des hanches jusqu’aux cuisses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la chair de leur nudité » ou « une chair de nudité ». L’expression désigne la chair qui doit être couverte.'
    reason: literal_rendering
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: Tu leur feras aussi
  rationale: Le waw relie cette instruction aux précédentes, tandis que l’impératif hébreu est rendu naturellement en français prescriptif par le futur. « Aussi » exprime ici la continuité sans alourdir la phrase.
- source_word: לָהֶם
  choice: leur
  rationale: Le pronom renvoie aux prêtres mentionnés dans le contexte et marque le bénéficiaire.
- source_word: מִכְנְסֵי בָד
  choice: des caleçons de lin
  rationale: מִכְנְסֵי désigne un vêtement couvrant le bas du corps sous les vêtements sacerdotaux. « Caleçons » est concret, courant et adapté à la longueur précisée dans la suite ; בָד désigne ici le lin.
- source_word: לְכַסּוֹת
  choice: pour couvrir
  rationale: L’infinitif exprime le but du vêtement.
- source_word: בְּשַׂר עֶרְוָה
  choice: leur nudité
  rationale: Littéralement « chair de nudité ». La formulation française exprime clairement et dignement les parties du corps qui doivent être couvertes, sans introduire une précision anatomique absente de l’expression hébraïque.
- source_word: מִמָּתְנַיִם
  choice: des reins
  rationale: מָתְנַיִם désigne la région des reins, de la taille ou des hanches. « Des reins » conserve l’image corporelle traditionnelle tout en restant intelligible dans ce contexte vestimentaire.
- source_word: וְעַד יְרֵכַיִם
  choice: jusqu’aux cuisses
  rationale: יָרֵךְ désigne couramment la cuisse ; l’expression indique la limite inférieure du vêtement.
- source_word: יִהְיוּ
  choice: ils iront
  rationale: Le verbe signifie littéralement « ils seront ». Avec deux limites spatiales, « ils iront de… jusqu’à… » rend naturellement en français l’étendue des vêtements sans modifier leur portée.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le futur prescriptif convient au discours législatif. « Caleçons de lin » évite l’archaïsme de « braies » et précise qu’il s’agit d’un vêtement du bas du corps, porté sous les vêtements sacerdotaux.
