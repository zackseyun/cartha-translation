  text: And you shall make on the breastpiece chains of pure gold[a], braided work like cords.
translation:
  language: fr
  text: Tu feras sur le pectoral des chaînettes d’or pur, tressées comme des cordons.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Dans cette suite d’instructions, le parfait qal précédé de la conjonction exprime une prescription. « Tu feras » en conserve naturellement la force en français.
- source_word: עַל הַחֹשֶׁן
  choice: sur le pectoral
  rationale: עַל indique ici la position ou la fixation sur le pectoral; « sur » est direct et idiomatique.
- source_word: שַׁרְשֹׁת
  choice: chaînettes
  rationale: Le nom pluriel désigne des chaînes; « chaînettes » convient à ces éléments ouvragés d’un objet sacerdotal sans imposer une forme technique trop précise.
- source_word: גַּבְלֻת מַעֲשֵׂה עֲבֹת
  choice: tressées comme des cordons
  rationale: Les termes décrivent un ouvrage lié, torsadé ou tressé, présentant l’aspect de cordons. Cette formulation française rend à la fois le façonnage et l’image sans lourdeur.
- source_word: זָהָב טָהוֹר
  choice: d’or pur
  rationale: Expression française usuelle et fidèle pour désigner le matériau prescrit.
