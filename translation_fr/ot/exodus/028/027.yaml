  terminology: « Anneaux », « épaulières » et « éphod » sont appropriés. « Point d’assemblage » préserve utilement l’ampleur de מֶחְבֶּרֶת sans réduire nécessairement le terme à une couture. « Bande tissée » reste acceptable pour חֵשֶׁב dans ce contexte.
