  - severity: low
    issue: « à la hauteur de » est moins direct que la relation de correspondance spatiale.
    rationale: לְעֻמַּת indique une position en vis-à-vis ou correspondante. « En face de » le restitue plus directement sans imposer une mesure verticale précise.
