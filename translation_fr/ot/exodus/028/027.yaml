base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/027.yaml
  text: You shall make two rings of gold and put them on the two shoulder-pieces of the ephod[a], underneath, on its front side, opposite its seam[b], above the skillfully woven band of the ephod.
translation:
  language: fr
  text: Tu feras deux anneaux d’or et tu les placeras sur les deux épaulières de l’éphod, dans la partie inférieure, sur le devant de l’éphod, en face de son point d’assemblage[a], au-dessus de la bande tissée de l’éphod[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de sa jointure » ou « de son point d’attache ». L’hébreu désigne de manière générale l’endroit où l’éphod est assemblé.
    reason: lexical_alternative
  - marker: b
    text: Ou « de la ceinture tissée de l’éphod ». Le terme hébreu désigne la bande spécialement confectionnée qui fait partie de l’éphod.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעוֹת
  choice: anneaux
  rationale: Le nom désigne couramment des anneaux métalliques servant à la fixation dans le mobilier sacré et les vêtements sacerdotaux.
- source_word: כִתְפוֹת
  choice: épaulières
  rationale: Dans ce contexte de confection, le terme désigne les parties de l’éphod qui reposent sur les épaules, plutôt que les épaules anatomiques elles-mêmes.
- source_word: הָאֵפוֹד
  choice: l’éphod
  rationale: « Éphod » est le terme technique traditionnel pour ce vêtement sacerdotal, sans équivalent français bref et exact.
- source_word: מִלְּמַטָּה
  choice: par-dessous
  rationale: L’expression situe les anneaux sur la partie inférieure ou sous les épaulières; « par-dessous » restitue naturellement cette relation spatiale.
- source_word: מִמּוּל פָּנָיו
  choice: sur sa face avant
  rationale: Littéralement liée à la « face » de l’objet, l’expression indique ici son côté antérieur.
- source_word: לְעֻמַּת
  choice: à la hauteur de
  rationale: La préposition exprime une correspondance ou un alignement spatial. Dans cette description verticale, « à la hauteur de » est plus naturel et moins trompeur que « en face de ».
- source_word: מֶחְבַּרְתּוֹ
  choice: son point d’assemblage
  rationale: Le nom désigne largement l’endroit où les parties sont jointes; ce choix évite de préciser sans certitude qu’il s’agit d’une couture.
- source_word: מִמַּעַל
  choice: au-dessus de
  rationale: Le terme indique directement une position supérieure par rapport à la bande de l’éphod.
- source_word: חֵשֶׁב הָאֵפוֹד
  choice: la bande tissée de l’éphod
  rationale: חֵשֶׁב désigne la bande intégrée ou attachée à l’éphod. « Bande tissée » conserve le caractère textile sans imposer la fonction plus précise de ceinture.
theological_decisions: []
