  rationale: Révision limitée à une expression française plus directe de l’idiome hébreu de culpabilité et à la capitalisation usuelle de « Rencontre ». La construction conditionnelle-préventive, la gravité de la mort annoncée, et la portée durable de l’ordonnance sont maintenues. Les notes restent ancrées respectivement à la clause de faute et à l’ordonnance permanente.
