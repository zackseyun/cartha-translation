base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/043.yaml
  text: And they shall be on Aaron and on his sons when they enter the tent of meeting[a], or when they approach the altar to minister in the holy place, so that they may not bear guilt and die[b]. It shall be a permanent statute for him and for his offspring after him.
translation:
  language: fr
  text: Aaron et ses fils les porteront lorsqu’ils entreront dans la tente de la Rencontre ou lorsqu’ils s’approcheront de l’autel pour officier dans le sanctuaire, afin qu’ils ne se chargent pas d’une faute[a] et ne meurent pas. Ce sera une prescription permanente[b] pour Aaron et pour sa descendance après lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « afin qu’ils n’encourent pas de culpabilité » ; l’hébreu dit littéralement « qu’ils ne portent pas de faute », expression juridique et cultuelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « une prescription perpétuelle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ עַל אַהֲרֹן וְעַל בָּנָיו
  choice: Aaron et ses fils les porteront
  rationale: Le sujet implicite renvoie aux caleçons de lin du verset précédent. Cette formulation naturelle en français exprime qu’ils doivent les avoir sur eux sans l’ambiguïté d’un calque tel que « ils seront sur Aaron ».
- source_word: בְּבֹאָם
  choice: lorsqu’ils entreront
  rationale: L’infinitif construit précédé de ב et muni d’un suffixe exprime ici la circonstance temporelle.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette traduction conserve l’idée de rencontre attachée à מוֹעֵד et désigne clairement la tente cultuelle.
- source_word: בְגִשְׁתָּם אֶל הַמִּזְבֵּחַ
  choice: lorsqu’ils s’approcheront de l’autel
  rationale: Dans ce contexte sacerdotal, נגשׁ désigne le fait de s’avancer vers l’autel pour accomplir le service sacré.
- source_word: לְשָׁרֵת
  choice: pour officier
  rationale: « Officier » rend de façon concise et actuelle le service cultuel des prêtres, plus précisément que le verbe général « servir ».
- source_word: בַּקֹּדֶשׁ
  choice: dans le sanctuaire
  rationale: קֹדֶשׁ désigne ici l’espace consacré où s’exerce le ministère sacerdotal. « Sanctuaire » évite de limiter indûment l’expression à une seule subdivision de la tente.
- source_word: וְלֹא יִשְׂאוּ עָוֹן
  choice: afin qu’ils ne portent pas la responsabilité d’une faute
  rationale: La formulation garde l’image juridique et cultuelle de « porter » une faute tout en explicitant en français qu’il s’agit d’en assumer la culpabilité ou la responsabilité.
- source_word: וָמֵתוּ
  choice: et ne meurent pas
  rationale: La coordination conserve la mort comme conséquence réelle de la faute; la tournure finale introduite par « afin que » rend la valeur préventive du contexte.
- source_word: חֻקַּת עוֹלָם
  choice: une prescription permanente
  rationale: La formule désigne une règle durable. « Prescription » convient au contexte juridique et cultuel, tandis que « permanente » rend la portée temporelle de עוֹלָם sans surinterprétation métaphysique.
- source_word: זַרְעוֹ
  choice: sa descendance
  rationale: « Descendance » rend naturellement le nom collectif singulier et maintient la continuité de la lignée d’Aaron.
theological_decisions:
- issue: Nature de la conséquence attachée à une approche sacerdotale fautive
  choice: La tenue prescrite empêche les prêtres de porter la responsabilité d’une faute et de mourir.
  alternative: « afin qu’ils n’encourent pas de culpabilité et ne meurent pas »
  rationale: L’hébreu présente une conséquence juridico-cultuelle grave liée à la sainteté. La traduction maintient ensemble la culpabilité et la mort sans réduire cette dernière à une simple irrégularité rituelle.
- issue: Portée temporelle de חֻקַּת עוֹלָם
  choice: une prescription permanente
  alternative: « une prescription perpétuelle »
  rationale: עֹולָם exprime ici la durée continue de l’ordonnance. « Permanente » la rend sans trancher au-delà de ce que précise le texte quant à son cadre théologique ultime.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset explicite le référent pronominal fourni par le contexte immédiat (« les »), emploie un vocabulaire cultuel compréhensible et conserve la gravité ainsi que la tension de la clause pénale.
