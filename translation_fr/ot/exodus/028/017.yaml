  yaml_path: translation/ot/exodus/028/017.yaml
  text: 'And you shall set in it settings of stones[a], four rows of stones: the first row shall be a ruby, a topaz, and an emerald.'
translation:
  language: fr
  text: 'Tu y sertiras des pierres[a], en quatre rangées. Sur la première rangée : une sardoine, une topaze et une émeraude.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification précise de ces pierres est incertaine. La « sardoine » peut désigner une autre pierre rouge, notamment la cornaline ; la « topaze » peut désigner la chrysolithe ou le péridot ; l’« émeraude » peut désigner le béryl.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלֵּאתָ בּוֹ מִלֻּאַת אֶבֶן
  choice: Tu y sertiras des pierres précieuses
  rationale: Le verbe מלא signifie littéralement « remplir », mais, dans ce contexte d’orfèvrerie, « sertir » exprime naturellement la pose de pierres dans le pectoral. La formulation française évite la lourdeur de « remplissage de pierres ».
- source_word: אַרְבָּעָה טוּרִים אֶבֶן
  choice: disposées en quatre rangées
  rationale: טוּר désigne ici une rangée ordonnée. Le singulier collectif אֶבֶן est rendu par le pluriel naturel « pierres ».
- source_word: טוּר ... הָאֶחָד
  choice: Sur la première rangée
  rationale: L’expression désigne la première des quatre rangées; cette formulation est claire et idiomatique en français.
- source_word: אֹדֶם
  choice: sardoine
  rationale: Le mot désigne vraisemblablement une pierre rouge, mais son identification exacte demeure incertaine. « Sardoine » est un équivalent traditionnel français, sans prétendre lever l’incertitude minéralogique.
- source_word: פִּטְדָה
  choice: topaze
  rationale: « Topaze » suit l’équivalent traditionnel et intelligible, tandis que l’identification exacte peut aussi correspondre à la chrysolithe ou au péridot.
- source_word: בָרֶקֶת
  choice: émeraude
  rationale: Le terme évoque probablement une pierre brillante. « Émeraude » est l’équivalent conventionnel, mais « béryl » reste possible.
