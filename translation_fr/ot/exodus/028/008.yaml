    issue: Référence pronominale de « qui se trouve sur lui »
    rationale: Le suffixe hébreu renvoie dans ce contexte à l’éphod. En français, « lui » peut spontanément évoquer le porteur ; nommer l’éphod clarifie sans ajouter de détail interprétatif.
  - severity: low
    issue: Portée de « fil » dans la liste des matériaux
    rationale: La formulation actuelle associe syntaxiquement « fil » au seul bleu. L’hébreu énumère l’or, les matières bleue, pourpre et écarlate, puis le fin lin retors ; une formulation coordonnée rend plus nettement les matières textiles colorées.
  - severity: low
    issue: Note sur l’éphod trop généralisante
    rationale: L’éphod est un vêtement sacerdotal ; le présent contexte concerne le grand prêtre. La note peut le signaler sans faire de cette association contextuelle une définition exhaustive.
