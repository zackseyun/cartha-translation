revisions:
- from: 'La ceinture ouvragée de l’éphod[a], qui se trouve sur lui, sera travaillée de la même manière et fera corps avec lui : en or, en fil bleu, pourpre et écarlate[b], et en fin lin retors.'
  to: 'La ceinture ouvragée de l’éphod[a], qui est sur l’éphod, sera du même ouvrage que lui et en fera partie intégrante : d’or, de fils bleus, pourpres et écarlates[b], et de fin lin retors.'
  rationale: 'La révision conserve les deux propositions hébraïques : la ceinture est « du même ouvrage » que l’éphod et « en fait partie intégrante ». Elle explicite l’antécédent contextuel du pronom relatif et rend la liste des matières plus idiomatique et moins syntaxiquement ambiguë en français.'
