  text: וְ/חֵ֤שֶׁב אֲפֻדָּת/וֹ֙ אֲשֶׁ֣ר עָלָ֔י/ו כְּ/מַעֲשֵׂ֖/הוּ מִמֶּ֣/נּוּ יִהְיֶ֑ה זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֥שׁ מָשְׁזָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/008.yaml
  text: 'And the skillfully woven band of his ephod[a], which is on it, shall be like its workmanship, of one piece with it: gold, blue, and purple, and scarlet yarn[b], and fine twisted linen.'
translation:
  language: fr
  text: 'La ceinture ouvragée de l’éphod[a], qui est sur l’éphod, sera du même ouvrage que lui et en fera partie intégrante : d’or, de fils bleus, pourpres et écarlates[b], et de fin lin retors.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’éphod était un vêtement sacerdotal ; dans ce contexte, il est porté par le grand prêtre.
    reason: cultural_note
  - marker: b
    text: L’hébreu mentionne le bleu, le pourpre et l’écarlate pour désigner des matières textiles teintes employées dans le sanctuaire et les vêtements sacerdotaux.
    reason: cultural_note
lexical_decisions:
- source_word: חֵשֶׁב
  choice: ceinture ouvragée
  rationale: Dans le contexte des vêtements sacerdotaux, le terme désigne une bande textile servant de ceinture; « ouvragée » exprime le caractère travaillé de sa fabrication sans surcharger la formulation.
- source_word: אֲפֻדָּתוֹ
  choice: l’éphod
  rationale: « Éphod » est le terme français consacré pour ce vêtement sacerdotal; le lien possessif est rendu naturellement par « de l’éphod » dans le groupe nominal.
- source_word: אֲשֶׁר עָלָיו
  choice: qui se trouve sur lui
  rationale: Le pronom renvoie très probablement à l’éphod, antécédent immédiat. La formulation conserve toutefois la référence pronominale du texte hébreu plutôt que d’expliciter « fixée à l’éphod ».
- source_word: כְּמַעֲשֵׂהוּ
  choice: sera travaillée de la même manière
  rationale: Cette expression marque la correspondance entre la facture de la ceinture et celle de l’éphod; elle est rendue séparément afin de ne pas omettre cet élément.
- source_word: מִמֶּנּוּ יִהְיֶה
  choice: fera corps avec lui
  rationale: Littéralement, « elle sera de lui ». Dans ce contexte textile, l’expression indique que la ceinture appartient intégralement à l’éphod plutôt que d’être une pièce indépendante.
- source_word: זָהָב
  choice: or
  rationale: Désignation directe du matériau.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: fil bleu, pourpre et écarlate
  rationale: Les termes désignent ici des matières textiles teintes. Le singulier collectif « fil » rend cette réalité clairement en français tout en conservant les trois couleurs traditionnelles.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: fin lin retors
  rationale: « Fin lin » rend שֵׁשׁ et « retors » exprime les fils tordus ou retordus indiqués par מָשְׁזָר; la tournure est concise et adaptée au registre textile.
