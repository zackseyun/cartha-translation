base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/030.yaml
  text: And you shall put the Urim and the Thummim into the breastpiece of judgment[a], and they shall be on Aaron’s heart when he goes in before Yahweh[c][b]. And Aaron shall bear the judgment of the sons of Israel on his heart before Yahweh continually.
translation:
  language: fr
  text: Tu placeras dans le pectoral du jugement[a] l’Ourim et le Toummim[b] ; ils seront sur le cœur d’Aaron lorsqu’il entrera devant Yahweh. Et Aaron portera le jugement des fils d’Israël[c] sur son cœur devant Yahweh, continuellement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « le pectoral de la décision » ou « le pectoral de la justice ». Le mot hébreu peut désigner le jugement, la décision ou la justice selon le contexte.'
    reason: alternative_reading
  - marker: b
    text: L’Ourim et le Toummim sont les noms hébreux d’objets sacrés associés aux décisions sacerdotales. Leur forme et leur fonctionnement exacts sont incertains. Leur étymologie pourrait évoquer les « lumières » et les « perfections ».
    reason: lexical_alternative
  - marker: c
    text: « Les fils d’Israël » est l’expression hébraïque traditionnelle pour désigner ici le peuple d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹשֶׁן הַמִּשְׁפָּט
  choice: le pectoral du jugement
  rationale: « Pectoral » est le terme français courant pour cette pièce du vêtement sacerdotal. « Jugement » conserve la répétition de מִשְׁפָּט dans le verset et son sens ouvert de jugement, décision ou justice.
- source_word: הָאוּרִים וְהַתֻּמִּים
  choice: l’ourim et le toummim
  rationale: Ces noms techniques sont translittérés, car la forme, le fonctionnement et même l’étymologie exacte de ces objets sacrés restent incertains.
- source_word: אֶל
  choice: dans
  rationale: Avec le verbe « placer », la préposition indique vraisemblablement que les objets sont mis dans le pectoral, conçu ici comme pouvant les contenir.
- source_word: וְהָיוּ עַל לֵב אַהֲרֹן
  choice: ils seront sur le cœur d’Aaron
  rationale: La formulation conserve à la fois la position concrète du pectoral sur la poitrine et la portée représentative de l’image du cœur.
- source_word: בְּבֹאוֹ לִפְנֵי יְהוָה
  choice: lorsqu’il entrera devant Yahweh
  rationale: « Entrera » rend la nuance d’accès au sanctuaire, tandis que « devant Yahweh » préserve l’idée de présence divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: וְנָשָׂא
  choice: Aaron portera
  rationale: « Porter » exprime naturellement le fait de porter le pectoral tout en laissant entendre la responsabilité représentative du prêtre.
- source_word: מִשְׁפַּט בְּנֵי יִשְׂרָאֵל
  choice: le jugement des fils d’Israël
  rationale: Cette formulation maintient le lien lexical avec « pectoral du jugement » et ne réduit pas le sens à une décision oraculaire précise.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La traduction garde l’expression hébraïque masculine et son caractère de désignation traditionnelle du peuple de l’alliance.
- source_word: תָּמִיד
  choice: continuellement
  rationale: Le mot exprime ici la permanence régulière de la fonction sacerdotale devant Dieu, sans nécessairement désigner une action ininterrompue à chaque instant.
theological_decisions:
- issue: Traduction sémantique ou translittération de אוּרִים et תֻּמִּים
  choice: Translittérer par « ourim » et « toummim »
  alternative: Traduire par « lumières » et « perfections »
  rationale: Une traduction sémantique ferait passer une étymologie discutée pour un sens certain et pourrait suggérer à tort une interprétation arrêtée de leur fonction.
- issue: Sens de מִשְׁפָּט dans les deux occurrences
  choice: Employer « jugement » dans les deux cas
  alternative: Employer « décision » ou « justice »
  rationale: « Jugement » conserve la répétition hébraïque et l’idée d’une décision faisant autorité, tout en maintenant l’ambiguïté du terme.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: Conserver « les fils d’Israël » dans le texte
  alternative: Employer « les Israélites » ou « le peuple d’Israël »
  rationale: La formulation reproduit l’expression hébraïque traditionnelle sans nier qu’elle désigne collectivement le peuple d’Israël.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement reflète l’adresse directe de Yahweh à Moïse. La syntaxe reste proche de l’hébreu sans devenir artificielle ; les termes cultuels incertains sont translittérés et les répétitions théologiquement significatives sont conservées.
