  yaml_path: translation/ot/exodus/028/037.yaml
  text: And you shall put it on a cord of blue[a], and it shall be on the turban[b]; it shall be at the front of the turban.
translation:
  language: fr
  text: Tu la placeras sur un cordon bleu[a], et elle sera sur le turban, sur le devant du turban[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur un fil bleu » ou « sur une cordelette bleue ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu indique littéralement une position « vers, ou en face de, l’avant du turban », c’est-à-dire sur sa partie antérieure.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ אֹתוֹ
  choice: Tu la fixeras
  rationale: Le verbe שׂים signifie « mettre, placer ». Dans ce contexte, « fixer » exprime naturellement la mise en place de la plaque au moyen d’un cordon, sans ajouter de détail technique.
- source_word: פְּתִיל
  choice: cordon
  rationale: פְּתִיל peut désigner un cordon, un fil ou une cordelette servant ici à attacher la plaque. « Cordon » convient à l’objet et reste courant en français.
- source_word: תְּכֵלֶת
  choice: bleu
  rationale: תְּכֵלֶת désigne la couleur précieuse employée dans les textiles du sanctuaire. « Bleu » est clair et traditionnel, tandis que la nuance exacte demeure incertaine.
- source_word: וְהָיָה עַל הַמִּצְנָפֶת
  choice: et elle sera sur le turban
  rationale: מִצְנֶפֶת désigne la coiffure enveloppante du grand prêtre. « Turban » est le terme français précis et usuel; le féminin « elle » renvoie à la plaque mentionnée au verset précédent.
- source_word: אֶל מוּל פְּנֵי הַמִּצְנֶפֶת
  choice: sur le devant du turban
  rationale: La locution indique une position orientée vers ou en face de la partie antérieure du turban. En français, « sur le devant » communique clairement la position frontale.
- source_word: יִהְיֶה
  choice: elle sera
  rationale: L’imparfait hébreu prescriptif répète l’exigence de placement. La structure française conserve cette affirmation de position sans lourdeur excessive.
