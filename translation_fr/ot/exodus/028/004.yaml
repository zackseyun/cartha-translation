  text: וְ/אֵ֨לֶּה הַ/בְּגָדִ֜ים אֲשֶׁ֣ר יַעֲשׂ֗וּ חֹ֤שֶׁן וְ/אֵפוֹד֙ וּ/מְעִ֔יל וּ/כְתֹ֥נֶת תַּשְׁבֵּ֖ץ מִצְנֶ֣פֶת וְ/אַבְנֵ֑ט וְ/עָשׂ֨וּ בִגְדֵי קֹ֜דֶשׁ לְ/אַהֲרֹ֥ן אָחִ֛י/ךָ וּ/לְ/בָנָ֖י/ו לְ/כַהֲנ/וֹ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/004.yaml
  text: 'And these are the garments that they shall make: a breastpiece[a], an ephod, a robe, a checkered tunic, a turban, and a sash. They shall make holy garments for Aaron your brother and for his sons[d][c][b], for him to serve as priest to me.'
translation:
  language: fr
  text: 'Voici les vêtements qu’ils confectionneront : un pectoral[a], un éphod[b], une robe, une tunique ouvragée[c], un turban et une ceinture. Ils confectionneront des vêtements sacrés[d] pour Aaron, ton frère, et pour ses fils, afin qu’il me serve comme prêtre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « pectoral » est la pièce sacerdotale portée sur la poitrine ; il ne s’agit pas d’une armure.
    reason: cultural_note
  - marker: b
    text: L’éphod est un vêtement sacerdotal particulier dont la forme exacte n’a pas d’équivalent français unique.
    reason: cultural_note
  - marker: c
    text: Ou « une tunique à motifs » ; le terme hébreu évoque vraisemblablement un travail textile formant un motif, peut-être quadrillé.
    reason: lexical_alternative
  - marker: d
    text: Littéralement « des vêtements de sainteté ».
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹשֶׁן
  choice: pectoral
  rationale: Terme français usuel pour la pièce sacerdotale portée sur la poitrine. Il désigne ici un élément du vêtement sacré, non une pièce d’armure.
- source_word: אֵפוֹד
  choice: éphod
  rationale: Translittération traditionnelle d’un vêtement sacerdotal particulier qui n’a pas d’équivalent français exact.
- source_word: מְעִיל
  choice: robe
  rationale: Équivalent français clair et courant pour ce vêtement sacerdotal ample.
- source_word: כְתֹנֶת תַּשְׁבֵּץ
  choice: tunique ouvragée
  rationale: « Tunique » rend כְתֹנֶת, tandis que « ouvragée » exprime le travail textile évoqué par תַּשְׁבֵּץ sans imposer un motif précis, dont la nature reste discutée.
- source_word: מִצְנֶפֶת
  choice: turban
  rationale: Désigne clairement la coiffure sacerdotale faite d’une étoffe enroulée.
- source_word: אַבְנֵט
  choice: ceinture
  rationale: Terme français naturel pour la bande d’étoffe portée autour de la taille; « écharpe » serait moins clair dans ce contexte.
- source_word: בִגְדֵי קֹדֶשׁ
  choice: vêtements sacrés
  rationale: Formulation naturelle en français moderne qui conserve l’idée de vêtements mis à part pour le service divin.
- source_word: לְכַהֲנוֹ לִי
  choice: afin qu’il exerce pour moi la fonction de prêtre
  rationale: Rend la valeur finale de l’infinitif et l’idée verbale d’exercer le sacerdoce, tout en conservant le singulier du texte hébreu.
theological_decisions:
- issue: Terminologie des vêtements sacerdotaux
  choice: Employer des termes français clairs lorsque l’équivalence est suffisamment précise, mais conserver « éphod » par translittération.
  alternative: Remplacer « éphod » par une description telle que « tablier sacerdotal ».
  rationale: Une paraphrase descriptive risquerait de réduire ou de déformer la nature exacte de cet objet cultuel, tandis que les autres pièces disposent d’équivalents français convenables.
- issue: Portée du singulier dans לְכַהֲנוֹ
  choice: 'Conserver le singulier : « afin qu’il exerce pour moi la fonction de prêtre ».'
  alternative: 'Employer le pluriel : « afin qu’ils exercent pour moi la fonction de prêtres ».'
  rationale: Bien que les vêtements soient destinés à Aaron et à ses fils, le texte massorétique porte un suffixe masculin singulier, qui renvoie grammaticalement à Aaron. La traduction préserve cette tension au lieu de l’harmoniser.
- issue: Genre de וּלְבָנָיו
  choice: Traduire par « et pour ses fils ».
  alternative: Employer « et pour ses enfants » ou « et pour ses descendants ».
  rationale: Le nom hébreu désigne ici explicitement les fils d’Aaron appelés au sacerdoce; une neutralisation effacerait une précision du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Confectionner » convient au contexte textile sans être technique; « vêtements sacrés » évite le tour peu naturel « vêtements saints ». La syntaxe conserve le singulier final du texte hébreu.
