  text: וְ/עָשִׂ֥יתָ בִגְדֵי קֹ֖דֶשׁ לְ/אַהֲרֹ֣ן אָחִ֑י/ךָ לְ/כָב֖וֹד וּ/לְ/תִפְאָֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/002.yaml
  text: And you shall make holy garments for Aaron your brother[a], for glory and for beauty.
translation:
  language: fr
  text: Tu feras pour ton frère Aaron des vêtements sacrés, pour la gloire et la beauté.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour l’honneur et la splendeur » ; ou : « pour la gloire et la magnificence ».'
    reason: Les termes hébreux traduits par « gloire » et « beauté » peuvent aussi évoquer l’honneur, la splendeur ou la magnificence.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Le qatal qal à la 2e personne masculine singulière, précédé de la conjonction, a ici une valeur prescriptive. « Tu feras » conserve la forme solennelle et directive du contexte.
- source_word: בִגְדֵי קֹדֶשׁ
  choice: des vêtements sacrés
  rationale: Le groupe construit désigne des vêtements mis à part pour le service cultuel. En français courant, « vêtements sacrés » est plus naturel que « saints vêtements » et évite le terme ecclésiastique plus spécialisé « ornements ».
- source_word: לְאַהֲרֹן אָחִיךָ
  choice: pour ton frère Aaron
  rationale: La traduction conserve à la fois la destination exprimée par לְ et la désignation familiale explicite d’Aaron par rapport à Moïse.
- source_word: לְכָבוֹד וּלְתִפְאָרֶת
  choice: qui lui conféreront dignité et splendeur
  rationale: כָּבוֹד évoque ici l’honneur ou la dignité manifeste, tandis que תִּפְאֶרֶת évoque l’éclat, la beauté ou la splendeur. La relative exprime naturellement en français l’effet ou la finalité des vêtements, sans réduire les deux termes à leur seule dimension esthétique.
theological_decisions:
- issue: Référent et portée de la dignité et de la splendeur
  choice: La formulation présente la dignité et la splendeur comme l’effet des vêtements sur Aaron, sans préciser davantage leur origine ou leur destinataire ultime.
  alternative: « pour la gloire et pour la beauté » ou « en signe de gloire et de magnificence »
  rationale: Les deux syntagmes en לְ indiquent la finalité ou l’effet, mais le texte hébreu ne tranche pas explicitement entre honneur sacerdotal, manifestation visible et gloire liée à Dieu. La traduction garde cette amplitude sans imposer une lecture doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. « Vêtements sacrés » demeure accessible tout en convenant au contexte sacerdotal. La relative finale est plus idiomatique que la répétition littérale « pour… pour… ». Le marqueur [a] figure dans le texte.
