  text: You shall make two gold rings on the breastpiece[b][a], and put the two rings on the two ends of the breastpiece.
translation:
  language: fr
  text: Tu feras deux anneaux d’or sur le pectoral, et tu placeras les deux anneaux aux deux extrémités du pectoral.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Dans cette suite d’instructions, le parfait qal avec conjonction exprime une directive. Le futur français rend naturellement cette valeur prescriptive.
- source_word: עַל הַחֹשֶׁן
  choice: sur le pectoral
  rationale: La préposition עַל a ici son sens spatial, puisqu’il s’agit de fixer des anneaux au pectoral sacerdotal.
- source_word: הַחֹשֶׁן
  choice: le pectoral
  rationale: Dans Exode 28, חֹשֶׁן désigne la pièce sacerdotale portée sur la poitrine. « Pectoral » est le terme français usuel et digne; l’expression plus développée « pectoral du jugement » n’apparaît pas dans ce verset.
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: deux anneaux d’or
  rationale: Cette formulation naturelle en français conserve clairement le nombre, l’objet et sa matière.
- source_word: וְנָתַתָּ
  choice: et tu placeras
  rationale: Le verbe נתן signifie ici mettre ou placer matériellement. « Placer » convient au registre d’une instruction de fabrication.
- source_word: עַל שְׁנֵי קְצ֥וֹת הַחֹשֶׁן
  choice: aux deux extrémités du pectoral
  rationale: קָצֶה désigne une extrémité ou un bord. « Aux deux extrémités » rend le sens spatial de façon idiomatique tout en conservant la répétition explicite du nombre deux.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur injonctive maintient le caractère prescriptif du passage. « Pectoral » assure la cohérence avec la terminologie sacerdotale d’Exode 28.
