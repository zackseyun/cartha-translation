id: EXO.28.15
reference: Exodus 28:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ חֹ֤שֶׁן מִשְׁפָּט֙ מַעֲשֵׂ֣ה חֹשֵׁ֔ב כְּ/מַעֲשֵׂ֥ה אֵפֹ֖ד תַּעֲשֶׂ֑/נּוּ זָ֠הָב תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן וְ/תוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר תַּעֲשֶׂ֥ה אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/015.yaml
  text: 'You shall make a breastpiece of judgment[a], the work of a skillful designer; like the work of the ephod you shall make it: of gold, blue, purple, scarlet yarn[b], and finely twisted linen you shall make it.'
translation:
  language: fr
  text: 'Tu feras le pectoral du jugement[a], œuvre d’un artisan habile[b]. Tu le feras selon le travail de l’éphod : tu le feras avec de l’or, du fil bleu, pourpre et écarlate, et du fin lin retors.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pectoral pour le jugement » ou « pectoral de la décision ».
    reason: La relation exacte entre le pectoral et מִשְׁפָּט peut exprimer l’appartenance, la fonction ou la décision rendue.
  - marker: b
    text: Ou « ouvrage savamment conçu » ; l’hébreu désigne un travail artisanal réalisé avec expertise.
    reason: L’expression מַעֲשֵׂה חֹשֵׁב peut mettre l’accent sur la conception habile ou sur l’exécution experte du travail textile.
lexical_decisions:
- source_word: חֹשֶׁן
  choice: pectoral
  rationale: Désigne la pièce ornementale et sacerdotale portée sur la poitrine du grand prêtre. « Pectoral » est le terme français précis et évite l’idée d’une armure que pourrait suggérer « cuirasse ».
- source_word: מִשְׁפָּט
  choice: du jugement
  rationale: Conserve la relation formelle et volontairement ouverte du groupe construit חֹשֶׁן מִשְׁפָּט avec le jugement ou la décision sacerdotale, sans préciser ici son mécanisme.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: œuvre d’un artisan habile
  rationale: Rend l’idée d’un travail textile conçu et exécuté avec expertise, dans un français naturel, sans réduire nécessairement l’expression à la seule broderie.
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: comme l’éphod
  rationale: Exprime de façon concise que le pectoral doit être réalisé selon le même type de facture que l’éphod.
- source_word: אֵפֹד
  choice: éphod
  rationale: Maintient le terme technique traditionnel désignant un vêtement sacerdotal particulier, faute d’un équivalent français bref et exact.
- source_word: זָהָב
  choice: or
  rationale: Désignation directe du matériau employé.
- source_word: תְּכֵלֶת
  choice: fil bleu
  rationale: Rend la couleur textile dans cette liste de matériaux; « fil » explicite naturellement le support textile sans prétendre identifier plus précisément la nuance antique.
- source_word: אַרְגָּמָן
  choice: fil pourpre
  rationale: Rend le colorant ou matériau textile de luxe par le terme français usuel « pourpre »; le mot « fil », exprimé une seule fois dans la coordination, s’applique aussi à cet élément.
- source_word: תוֹלַעַת שָׁנִי
  choice: fil écarlate
  rationale: Rend l’expression comme une matière textile teinte en écarlate; « fil » est partagé par coordination avec les couleurs précédentes.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: fin lin retors
  rationale: Expression française concise qui conserve à la fois la qualité du lin et le fait que ses fils sont retordus.
- source_word: תַּעֲשֶׂנּוּ ... תַּעֲשֶׂה אֹתוֹ
  choice: tu le feras ... tu le feras
  rationale: Maintient la répétition insistante des instructions hébraïques plutôt que de la supprimer entièrement pour des raisons stylistiques.
theological_decisions:
- issue: Fonction de חֹשֶׁן מִשְׁפָּט
  choice: pectoral du jugement
  alternative: pectoral pour le jugement ; pectoral de la décision
  rationale: Le verset associe le pectoral au jugement ou à la décision sans expliquer précisément sa fonction. La formulation retenue conserve cette portée cultuelle et judiciaire ainsi que son ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète l’adresse hébraïque à Moïse. Les termes cultuels « pectoral » et « éphod » sont conservés, tandis que la liste des matériaux est formulée de manière naturelle. La répétition de « tu le feras » maintient le style prescriptif et insistant du texte source.
