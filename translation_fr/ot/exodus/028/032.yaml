base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/032.yaml
  text: Its opening for the head shall be in the middle of it; around its opening there shall be a woven edge[a], like the opening of a coat of mail, so that it may not be torn.
translation:
  language: fr
  text: L’ouverture pour la tête sera au milieu du vêtement. Tout autour de cette ouverture, il y aura une bordure tissée, comme l’ouverture d’une cuirasse[a], afin que l’ouverture ne se déchire pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une armure » ou « d’une cotte de mailles ». Le mot hébreu תַּחְרָא est rare ; la comparaison évoque probablement une ouverture renforcée qui résiste aux déchirures.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי רֹאשׁוֹ
  choice: L’ouverture pour la tête
  rationale: פֶּה signifie littéralement « bouche », mais désigne ici l’ouverture du vêtement par laquelle passe la tête.
- source_word: בְּתוֹכוֹ
  choice: au milieu du vêtement
  rationale: Le pronom renvoie au vêtement décrit dans le contexte. L’explicitation évite en français une succession ambiguë de pronoms.
- source_word: שָׂפָה ... מַעֲשֵׂה אֹרֵג
  choice: une bordure tissée
  rationale: שָׂפָה désigne le bord ou la lisière de l’ouverture, et מַעֲשֵׂה אֹרֵג précise qu’il est réalisé par tissage. « Bordure tissée » est naturel et reste proche de l’image hébraïque.
- source_word: לְפִיו סָבִיב
  choice: Tout autour de cette ouverture
  rationale: La répétition de פֶּה désigne de nouveau l’ouverture du vêtement, tandis que סָבִיב indique qu’elle est entièrement entourée.
- source_word: כְּפִי תַחְרָא
  choice: comme l’ouverture d’une cuirasse
  rationale: תַּחְרָא est un terme rare désignant probablement un vêtement protecteur ou une pièce d’armure. « Cuirasse » transmet de façon concise l’idée d’une ouverture renforcée sans prétendre lever toute l’incertitude lexicale.
- source_word: לֹא יִקָּרֵעַ
  choice: afin qu’elle ne se déchire pas
  rationale: Le niphal exprime ici le fait de ne pas être déchiré. La tournure finale rend naturellement en français la fonction de la bordure renforcée.
theological_decisions: []
