  text: It shall have two shoulder pieces joined to its two ends[b][a], so that it may be joined together.
translation:
  language: fr
  text: Il aura deux pièces d’épaule[a] jointes à ses deux extrémités, et il sera ainsi assemblé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « deux bretelles ». Le terme hébreu désigne ici des parties du vêtement placées sur les épaules, et non les épaules elles-mêmes.
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « et il sera joint ». La proposition finale indique que l’éphod est assemblé au moyen de ces pièces d’épaule.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי כְתֵפֹת
  choice: deux pièces d’épaule
  rationale: Le duel numérique est explicite. Dans ce contexte vestimentaire, כְתֵפֹת désigne les éléments de l’éphod qui passent sur les épaules, et non les épaules anatomiques elles-mêmes.
- source_word: חֹבְרֹת
  choice: jointes
  rationale: Le participe féminin pluriel de חבר qualifie les pièces d’épaule comme reliées aux extrémités de l’éphod. « Jointes » convient naturellement à la confection d’un vêtement et conserve le lien lexical avec la proposition finale.
- source_word: יִהְיֶה לּוֹ
  choice: il aura
  rationale: La construction existentielle hébraïque avec ל et suffixe pronominal exprime ici idiomatiquement la possession. Le pronom renvoie à l’éphod mentionné au verset précédent.
- source_word: אֶל שְׁנֵי קְצוֹתָיו
  choice: à ses deux extrémités
  rationale: אֶל marque le point de rattachement, tandis que קָצֶה désigne une extrémité. Cette formulation reste générale sans préciser indûment la forme exacte des bords.
- source_word: וְחֻבָּר
  choice: et il sera ainsi assemblé
  rationale: Le passif de חבר décrit le résultat de l’ajout des pièces d’épaule. « Ainsi » rend naturellement en français la relation de résultat suggérée par la coordination, sans la présenter comme plus explicite qu’elle ne l’est en hébreu.
