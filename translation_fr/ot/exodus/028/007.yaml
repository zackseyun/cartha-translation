translation_notes:
  register: Français international moderne, clair et digne. « Pièces d’épaule » conserve le caractère descriptif du terme hébreu sans employer un vocabulaire technique ou archaïque; la répétition de l’idée de jonction reflète celle de la racine חבר dans le verset.
