source:
  edition: WLC
  text: וְ/נָשָׂ֣א אַ֠הֲרֹן אֶת שְׁמ֨וֹת בְּנֵֽי יִשְׂרָאֵ֜ל בְּ/חֹ֧שֶׁן הַ/מִּשְׁפָּ֛ט עַל לִבּ֖/וֹ בְּ/בֹא֣/וֹ אֶל הַ/קֹּ֑דֶשׁ לְ/זִכָּרֹ֥ן לִ/פְנֵֽי יְהוָ֖ה תָּמִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/029.yaml
  text: Aaron shall carry the names of the sons of Israel in the breastpiece of judgment over his heart when he goes into the Holy Place[d][c][b][a], for a memorial before Yahweh continually.
translation:
  language: fr
  text: Aaron portera les noms des fils d’Israël[b] dans le pectoral du jugement[a], sur son cœur, lorsqu’il entrera dans le sanctuaire, comme mémorial devant Yahweh, continuellement[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pectoral de la décision ». Le titre hébreu associe ce pectoral sacerdotal au jugement ou à la décision rendue devant Dieu.
    reason: alternative_reading
  - marker: b
    text: L’expression hébraïque « les fils d’Israël » désigne ici les tribus issues d’Israël.
    reason: lexical_alternative
  - marker: c
    text: Ou « afin qu’ils soient constamment rappelés devant Yahweh ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂא
  choice: portera
  rationale: נשא signifie « porter » ou « transporter ». « Portera » convient naturellement au vêtement sacerdotal tout en gardant la portée représentative possible du verbe.
- source_word: שְׁמוֹת בְּנֵי יִשְׂרָאֵל
  choice: les noms des fils d’Israël
  rationale: La formulation conserve à la fois les noms gravés et l’expression généalogique masculine du texte hébreu, laquelle désigne ici collectivement les tribus issues d’Israël.
- source_word: בְּחֹשֶׁן הַמִּשְׁפָּט
  choice: dans le pectoral du jugement
  rationale: « Pectoral » est le terme français courant pour cet objet sacerdotal. « Du jugement » préserve la désignation cultuelle sans préciser indûment s’il s’agit de jugement, de décision ou de justice.
- source_word: עַל לִבּוֹ
  choice: sur son cœur
  rationale: Rendu spatial direct qui conserve aussi la force symbolique de l’image.
- source_word: בְּבֹאוֹ אֶל הַקֹּדֶשׁ
  choice: lorsqu’il entrera dans le sanctuaire
  rationale: La construction marque le temps de l’entrée. Dans ce contexte, הַקֹּדֶשׁ désigne l’espace sacré du tabernacle; « sanctuaire » est idiomatique sans imposer une subdivision plus précise.
- source_word: לְזִכָּרֹן לִפְנֵי יְהוָה תָּמִיד
  choice: afin qu’ils soient constamment rappelés devant Yahweh
  rationale: Cette formulation exprime naturellement en français la fonction mémorielle des noms devant Dieu et rattache explicitement le pronom aux noms, tout en conservant la continuité indiquée par תָּמִיד.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin, conformément à la politique du projet pour ce terme contesté.
theological_decisions:
- issue: Sens du titre cultuel חֹשֶׁן הַמִּשְׁפָּט
  choice: le pectoral du jugement
  alternative: le pectoral de la décision
  rationale: Le génitif formel maintient l’ambiguïté entre jugement et décision divine au lieu de réduire la fonction de l’objet à une seule interprétation.
- issue: Référent de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le choix conserve l’expression généalogique du texte source et son rapport immédiat aux noms tribaux.
- issue: Portée de הַקֹּדֶשׁ
  choice: le sanctuaire
  alternative: le lieu saint
  rationale: « Sanctuaire » désigne naturellement l’espace sacré dans ce contexte sans décider plus précisément que ne le fait le verset quelle partie du tabernacle est visée.
- issue: Fonction de לְזִכָּרֹן
  choice: afin qu’ils soient constamment rappelés devant Yahweh
  alternative: comme mémorial devant Yahweh, constamment
  rationale: Le rendu choisi explicite en français l’idée de commémoration devant Dieu sans déterminer si le rappel agit principalement sur Dieu, le prêtre ou la communauté; l’ambiguïté théologique fondamentale demeure.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe place « sur son cœur » près du verbe pour rendre clairement la position du pectoral. « Sanctuaire » évite une capitalisation interprétative et reste naturel dans le contexte cultuel.
