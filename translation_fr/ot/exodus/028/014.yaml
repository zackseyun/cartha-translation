translation_notes:
  register: Français international moderne, clair et digne. L’impératif singulier « tu feras » suit l’adresse à Moïse. « Chaînettes », « torsadées » et « montures » conservent le vocabulaire concret de l’orfèvrerie sans technicité excessive.
