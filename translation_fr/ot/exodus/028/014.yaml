  text: And make two chains of pure gold[a], braided like cords[b]; and put the braided chains on the settings.
translation:
  language: fr
  text: Tu feras aussi deux chaînes en or pur, torsadées comme des cordons[a], et tu fixeras les chaînes torsadées sur les montures[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici deux expressions apparentées décrivant vraisemblablement un ouvrage torsadé ou en forme de cordon. Le début de la phrase peut aussi se rendre : « deux chaînes en or pur, torsadées, tu les feras en ouvrage de cordons » ou « en ouvrage tressé ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou « sertissures » ou « cadres d’or » : il s’agit des pièces d’orfèvrerie fixées au vêtement sacerdotal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי שַׁרְשְׁרֹת
  choice: deux chaînettes
  rationale: Dans le contexte d’un ouvrage d’orfèvrerie fixé au vêtement sacerdotal, « chaînettes » désigne naturellement de petites chaînes décoratives.
- source_word: זָהָב טָהוֹר
  choice: en or pur
  rationale: Expression française courante et précise pour le matériau prescrit.
- source_word: מִגְבָּלֹת ... מַעֲשֵׂה עֲבֹת
  choice: torsadées comme des cordons
  rationale: Le premier terme est difficile, tandis que l’expression suivante décrit clairement un travail évoquant des cordons. Cette formulation restitue leur idée commune sans répétition artificielle.
- source_word: שַׁרְשְׁרֹת הָעֲבֹתֹת
  choice: les chaînettes torsadées
  rationale: Rend la reprise du nom accompagnée d’un qualificatif soulignant la facture cordée ou torsadée.
- source_word: עַל הַמִּשְׁבְּצֹת
  choice: sur les montures
  rationale: « Montures » convient au cadre ou support d’or auquel les chaînettes sont attachées et reste plus général que le terme joaillier « chatons ».
