  text: וְ֠/הָ/אֲבָנִים תִּֽהְיֶ֜יןָ עַל שְׁמֹ֧ת בְּנֵֽי יִשְׂרָאֵ֛ל שְׁתֵּ֥ים עֶשְׂרֵ֖ה עַל שְׁמֹתָ֑/ם פִּתּוּחֵ֤י חוֹתָם֙ אִ֣ישׁ עַל שְׁמ֔/וֹ תִּֽהְיֶ֕יןָ לִ/שְׁנֵ֥י עָשָׂ֖ר שָֽׁבֶט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/021.yaml
  text: And the stones shall correspond to the names of the sons of Israel[a], twelve according to their names. They shall be engraved like a signet, each with his name[c][b], for the twelve tribes.
translation:
  language: fr
  text: 'Et les pierres correspondront aux noms des fils d’Israël[a] : il y en aura douze, d’après leurs noms. Elles seront gravées à la manière d’un sceau[b], chacune avec son nom, pour les douze tribus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement « les pierres seront sur/selon les noms des fils d’Israël ». On peut aussi comprendre : « porteront les noms des fils d’Israël ». « Fils d’Israël » peut également se rendre par « enfants d’Israël » ou « Israélites ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « porteront des gravures de sceau » ou « seront comme des gravures de sceau ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: Et les pierres
  rationale: Le waw relie cette prescription à la précédente, tandis que l’article défini renvoie aux pierres déjà mentionnées.
- source_word: תִּהְיֶיןָ עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: correspondront aux noms des fils d’Israël
  rationale: Le verbe signifie littéralement « seront », mais עַל exprime ici une relation avec les noms. « Correspondront aux » rend naturellement cette relation sans décider que les noms sont simplement inscrits « sur » les pierres.
- source_word: שְׁתֵּים עֶשְׂרֵה עַל שְׁמֹתָם
  choice: douze, d’après leurs noms
  rationale: La formulation conserve le nombre et la répétition de la relation aux noms, tout en restant idiomatique en français.
- source_word: פִּתּוּחֵי חוֹתָם
  choice: gravées à la manière d’un sceau
  rationale: Le syntagme nominal évoque des gravures caractéristiques d’un sceau ou d’un cachet. Cette formulation française restitue à la fois l’action de graver et le type de gravure.
- source_word: אִישׁ עַל שְׁמוֹ
  choice: chacune avec son nom
  rationale: אִישׁ a ici une valeur distributive, « chacune ». Le féminin s’accorde naturellement avec « pierre »; « avec son nom » exprime l’association individuelle entre chaque pierre et le nom correspondant.
- source_word: תִּהְיֶיןָ לִשְׁנֵי עָשָׂר שָׁבֶט
  choice: pour les douze tribus
  rationale: 'La préposition לְ indique ici la destination ou la représentation : les pierres sont destinées aux douze tribus et les représentent.'
theological_decisions:
- issue: Expression d’alliance בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: enfants d’Israël / Israélites
  rationale: « Fils d’Israël » reproduit l’expression hébraïque genrée et son lien avec les ancêtres tribaux. La note signale les équivalents français possibles sans neutraliser silencieusement la formulation source.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit étroitement la progression hébraïque, mais emploie des formulations naturelles. Le terme « sceau » est retenu plutôt que « chevalière », car חוֹתָם désigne plus largement un objet servant à imprimer une marque d’authentification.
