  text: six of their names on the one stone[a], and the names of the remaining six on the second stone, according to their birth order.
translation:
  language: fr
  text: six de leurs noms sur la première pierre, et les noms des six autres sur la seconde pierre, selon leur ordre de naissance[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « selon leurs générations »; l’expression hébraïque peut désigner la descendance généalogique ou l’ordre des naissances qui en résulte.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁשָּׁה מִשְּׁמֹתָם
  choice: six de leurs noms
  rationale: Le מִן partitif indique six noms pris dans l’ensemble; « six de leurs noms » le rend directement et naturellement.
- source_word: עַל הָאֶבֶן הָאֶחָת
  choice: sur une pierre
  rationale: עַל exprime ici l’emplacement de l’inscription. הָאֶחָת désigne l’une des deux pierres et s’oppose à « la seconde »; « une pierre » conserve ce contraste sans ajouter explicitement l’ordinal « première ».
- source_word: הַשִּׁשָּׁה הַנּוֹתָרִים
  choice: les six autres
  rationale: Le participe נוֹתָרִים désigne ceux qui restent. Dans cette répartition en deux groupes égaux, « les six autres » est idiomatique et fidèle.
- source_word: עַל הָאֶבֶן הַשֵּׁנִית
  choice: sur la seconde pierre
  rationale: הַשֵּׁנִית est explicitement ordinal; « la seconde pierre » maintient le parallélisme et un registre digne.
- source_word: כְּתוֹלְדֹתָם
  choice: dans l’ordre de leur naissance
  rationale: Dans le contexte des noms des fils d’Israël répartis sur les pierres, l’expression indique vraisemblablement l’ordre issu de leurs naissances. La note conserve la portée plus littérale liée aux générations et à la descendance.
