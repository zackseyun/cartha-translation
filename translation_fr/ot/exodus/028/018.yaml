  text: 'and the second row: turquoise[a], sapphire, and diamond.'
translation:
  language: fr
  text: 'et, à la deuxième rangée : une turquoise[a], un saphir et un diamant.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification exacte de plusieurs pierres précieuses de l’Antiquité est incertaine. נֹפֶךְ peut désigner une émeraude ou une escarboucle ; סַפִּיר peut désigner le lapis-lazuli ; יָהֲלֹם peut désigner une hyacinthe ou un jaspe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/טּוּר
  choice: et, au … rang
  rationale: Dans le contexte des pierres du pectoral, טוּר désigne une rangée; « rang » est naturel en français dans cette énumération, et וְ est rendu par « et ».
- source_word: הַ/שֵּׁנִי
  choice: deuxième
  rationale: L’adjectif ordinal qualifie « rang »; la tournure « au deuxième rang » donne une formulation française fluide sans modifier le sens.
- source_word: נֹפֶךְ
  choice: turquoise
  rationale: L’identification exacte de cette pierre ancienne est incertaine. « Turquoise » est une équivalence moderne plausible; les principales autres identifications sont signalées en note.
- source_word: סַפִּיר
  choice: saphir
  rationale: « Saphir » conserve l’équivalent traditionnel et immédiatement compréhensible, même si le terme hébreu pouvait désigner le lapis-lazuli; cette possibilité est indiquée en note.
- source_word: וְ/יָהֲלֹם
  choice: et un diamant
  rationale: « Diamant » est l’équivalent traditionnel courant de ce nom de pierre à l’identification discutée. Les autres possibilités sont conservées en note.
