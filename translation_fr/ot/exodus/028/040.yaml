  source_fidelity: 'La structure et les termes principaux sont bien rendus : « fils d’Aaron », « tuniques », « ceintures » et « coiffes » correspondent au texte hébreu. Toutefois, « pour leur donner dignité et splendeur » introduit un bénéficiaire explicite (« leur ») et le verbe « donner », alors que לְכָבוֹד וּלְתִפְאָרֶת énonce plus sobrement la finalité : « pour la gloire et la splendeur ».'
