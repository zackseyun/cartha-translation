  yaml_path: translation/ot/exodus/028/040.yaml
  text: For Aaron’s sons you shall make tunics[a], and you shall make sashes for them, and you shall make caps for them, for glory and for beauty.
translation:
  language: fr
  text: Pour les fils d’Aaron, tu feras des tuniques, tu leur feras des ceintures, et tu leur feras des coiffes[a], pour la gloire et la splendeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bonnets » ou « turbans »; il s’agit de couvre-chefs sacerdotaux.
    reason: La forme précise des מִגְבָּעוֹת n’est pas certaine; plusieurs équivalents français sont possibles.
lexical_decisions:
- source_word: לִבְנֵי אַהֲרֹן
  choice: pour les fils d’Aaron
  rationale: Rend directement la relation filiale exprimée par l’hébreu, sans l’élargir aux descendants.
- source_word: תַּעֲשֶׂה / וְעָשִׂיתָ
  choice: tu feras
  rationale: Le futur français convient au ton prescriptif de ces instructions et maintient la deuxième personne du singulier.
- source_word: כֻתֳּנֹת
  choice: tuniques
  rationale: Désigne avec précision un vêtement couvrant le corps et évite le sens moderne trompeur de « manteaux ».
- source_word: אַבְנֵטִים
  choice: ceintures
  rationale: Terme français naturel pour les pièces de tissu portées autour de la taille; « écharpes » risquerait d’évoquer un port sur l’épaule.
- source_word: מִגְבָּעוֹת
  choice: coiffes
  rationale: Terme générique et digne pour ces couvre-chefs sacerdotaux, dont la forme exacte demeure incertaine.
- source_word: לְכָבוֹד וּלְתִפְאָרֶת
  choice: pour leur donner dignité et splendeur
  rationale: Exprime naturellement en français la fonction honorifique et esthétique des vêtements, tout en conservant les deux notions hébraïques distinctes.
theological_decisions:
- issue: Fonction des vêtements sacerdotaux
  choice: pour leur donner dignité et splendeur
  alternative: pour la gloire et pour la beauté
  rationale: La formulation retenue rapporte clairement le but aux vêtements et ne leur attribue aucun symbolisme théologique absent du texte. « Dignité » rend ici la valeur honorifique de כָבוֹד, tandis que « splendeur » conserve le registre élevé de תִפְאֶרֶת.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « tu feras » conserve le rythme prescriptif de l’hébreu sans alourdir excessivement la phrase.
