  text: וְ/יִרְכְּס֣וּ אֶת הַ֠/חֹשֶׁן מ/טבעת/ו אֶל טַבְּעֹ֤ת הָ/אֵפֹד֙ בִּ/פְתִ֣יל תְּכֵ֔לֶת לִֽ/הְי֖וֹת עַל חֵ֣שֶׁב הָ/אֵפ֑וֹד וְ/לֹֽא יִזַּ֣ח הַ/חֹ֔שֶׁן מֵ/עַ֖ל הָ/אֵפֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/028.yaml
  text: They shall bind the breastpiece by its rings to the rings of the ephod with a cord of blue yarn[a], so that it may be on the skillfully woven band of the ephod[c][b], and the breastpiece shall not come loose from the ephod.
translation:
  language: fr
  text: Ils attacheront le pectoral[a], par ses anneaux, aux anneaux de l’éphod avec un cordon bleu[b], afin qu’il soit sur la bande ouvragée de l’éphod et que le pectoral ne se détache pas de l’éphod[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi traduire par « pièce de poitrine ». Le terme hébreu désigne ici l’élément du vêtement sacerdotal fixé à l’éphod, et non une pièce d’armure.
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « avec un cordon de matière bleue ». Le terme hébreu désigne une matière textile bleue employée dans les textiles du sanctuaire et les vêtements sacerdotaux ; sa nuance exacte est discutée.'
    reason: lexical_alternative
  - marker: c
    text: 'Autre traduction possible : « ne soit pas déplacé de dessus l’éphod ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִרְכְּסוּ
  choice: Ils attacheront
  rationale: Le verbe désigne l’action de fixer solidement deux éléments ensemble. « Attacheront » convient naturellement aux anneaux et au cordon sans préciser indûment la technique.
- source_word: הַחֹשֶׁן
  choice: le pectoral
  rationale: Dans le contexte des vêtements sacerdotaux, le terme désigne la pièce portée sur la poitrine et fixée à l’éphod, non une protection militaire.
- source_word: מִטַּבְּעֹתָיו
  choice: par ses anneaux
  rationale: La préposition indique ici le point ou le moyen d’attache du pectoral; « par ses anneaux » l’exprime clairement en français.
- source_word: טַבְּעֹת הָאֵפֹד
  choice: aux anneaux de l’éphod
  rationale: Traduction directe de la chaîne construite, conservant clairement le rapport entre les deux pièces du vêtement.
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: avec un cordon bleu
  rationale: פְּתִיל désigne un fil ou cordon, et תְּכֵלֶת une matière textile teinte en bleu, peut-être bleu violacé. La formulation retenue est naturelle et concise.
- source_word: לִהְיוֹת עַל
  choice: afin qu’il soit sur
  rationale: L’infinitif exprime le but ou le résultat. Cette traduction reste proche de la formulation hébraïque sans ajouter l’idée explicite de « reposer ».
- source_word: חֵשֶׁב הָאֵפֹד
  choice: la bande tissée de l’éphod
  rationale: Dans ce contexte, חֵשֶׁב désigne la bande intégrée à l’éphod, souvent comprise comme une ceinture ou une bande ouvragée. « Bande tissée » reste claire sans surdéterminer sa forme.
- source_word: וְלֹא יִזַּח
  choice: ne se détache pas
  rationale: Le verbe évoque le déplacement ou la séparation de la pièce fixée. « Ne se détache pas » rend naturellement la fonction pratique du dispositif.
- source_word: מֵעַל הָאֵפֹד
  choice: de l’éphod
  rationale: La préposition exprime l’éloignement de la position occupée sur l’éphod; le français « de l’éphod » est fluide dans cette construction.
