  text: You shall make the robe of the ephod entirely of blue[a][b].
translation:
  language: fr
  text: Tu feras la robe de l’éphod tout entière en étoffe bleue[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « toute de bleu » ; c’est-à-dire faite entièrement de cette étoffe bleue.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu traduit par « bleu » peut désigner une étoffe teinte coûteuse, d’une couleur allant du bleu au bleu-violet.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Dans cette suite d’instructions, le parfait qal précédé de la conjonction exprime un commandement. « Tu feras » conserve le ton prescriptif et solennel du passage.
- source_word: מְעִיל
  choice: robe
  rationale: Le terme désigne ici un vêtement sacerdotal. « Robe » est l’équivalent français moderne le plus clair et naturel.
- source_word: הָאֵפֹד
  choice: l’éphod
  rationale: « Éphod » est un terme technique désignant un vêtement sacerdotal; la translittération évite une paraphrase descriptive incertaine. Le syntagme indique la robe associée à l’éphod.
- source_word: כְּלִיל
  choice: entièrement
  rationale: Le mot exprime la totalité ou l’intégralité. L’adverbe « entièrement » s’intègre naturellement à la formulation française « entièrement en bleu ».
- source_word: תְּכֵלֶת
  choice: bleu
  rationale: Le terme désigne une matière teinte coûteuse, dont la couleur se situe probablement dans une gamme allant du bleu au bleu-violet. « Bleu » est le rendu courant le plus accessible, tandis qu’une note préserve la nuance chromatique et matérielle.
