  text: You shall weave the tunic in checker work of fine linen[a], and you shall make a turban of fine linen, and you shall make a sash, the work of an embroiderer.
translation:
  language: fr
  text: Tu tisseras la tunique en fin lin, avec un motif à damiers[a]. Tu feras aussi un turban en fin lin, et tu confectionneras une ceinture, ouvrage de brodeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu feras la tunique de fin lin selon un motif quadrillé. » Le verbe hébreu désigne probablement la fabrication d’une étoffe à motifs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבַּצְתָּ הַכְּתֹנֶת
  choice: Tu tisseras la tunique ... avec un motif à damiers
  rationale: Dans le contexte des vêtements sacerdotaux, שׁבץ désigne vraisemblablement la production d'une étoffe ouvragée ou quadrillée. Cette formulation exprime à la fois le procédé textile probable et son résultat visible, sans réduire le verbe au sens général de « placer ».
- source_word: הַכְּתֹנֶת
  choice: la tunique
  rationale: כְּתֹנֶת désigne ici le vêtement sacerdotal porté près du corps. « Tunique » est précis, courant et adapté au registre.
- source_word: שֵׁשׁ
  choice: fin lin
  rationale: Dans les textes relatifs au sanctuaire et aux vêtements sacerdotaux, שֵׁשׁ désigne un lin de qualité. « Fin lin » restitue naturellement la matière et sa qualité.
- source_word: מִצְנֶפֶת
  choice: turban
  rationale: Le terme désigne une coiffure sacerdotale faite d'une étoffe enroulée. « Turban » est le terme français le plus clair et le plus usuel.
- source_word: אַבְנֵט
  choice: ceinture
  rationale: אַבְנֵט désigne une longue pièce d'étoffe portée autour de la taille. « Ceinture » est naturel en français biblique moderne, même si « écharpe » pourrait davantage souligner sa nature textile.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: une ceinture brodée
  rationale: L'expression désigne l'ouvrage d'un artisan spécialisé dans le décor textile. La formulation adjectivale est idiomatique en français et communique clairement le caractère ouvragé, bien qu'elle explicite moins la mention de l'artisan.
