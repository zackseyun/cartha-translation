  text: And they shall take the gold[a], and the blue, and the purple, and the scarlet yarn[b], and the fine linen.
translation:
  language: fr
  text: Ils prendront l’or, le fil bleu[a], le fil pourpre, le fil écarlate[b] et le fin lin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le bleu » et « le pourpre » : les termes hébreux peuvent désigner des matières textiles teintes, plutôt que les seules couleurs.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « écarlate de ver »; l’expression désigne une matière écarlate teinte au moyen d’un colorant tiré d’un insecte.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵם
  choice: Ils
  rationale: Le pronom indépendant explicite et met légèrement en relief le sujet déjà identifié dans le contexte. En français, « Ils » suffit sans renforcer artificiellement par « eux-mêmes ».
- source_word: יִקְחוּ
  choice: prendront
  rationale: L’imparfait hébreu a ici une valeur directive dans la série d’instructions. Le futur français exprime naturellement cette prescription dans un registre biblique actuel.
- source_word: הַזָּהָב
  choice: l’or
  rationale: L’article hébreu désigne le matériau prévu pour les vêtements sacerdotaux; « l’or » en rend naturellement la valeur.
- source_word: הַתְּכֵלֶת
  choice: la laine bleue
  rationale: Le terme désigne ici une matière textile teinte, et non seulement une couleur abstraite. « La laine bleue » explicite le matériau dans ce contexte de confection, bien que le type précis de textile ne soit pas exprimé par le mot seul.
- source_word: הָאַרְגָּמָן
  choice: la laine pourpre
  rationale: Le terme renvoie à une matière textile teinte en pourpre. La formulation parallèle à « laine bleue » donne une liste française claire et concrète.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: la laine écarlate
  rationale: L’expression désigne une matière écarlate dont la teinture provenait d’un insecte. Dans ce contexte vestimentaire, « laine écarlate » est plus naturel qu’un simple nom de couleur.
- source_word: הַשֵּׁשׁ
  choice: le fin lin
  rationale: Dans les passages relatifs au sanctuaire, שֵׁשׁ désigne un lin de qualité fine; « le fin lin » conserve cette précision.
