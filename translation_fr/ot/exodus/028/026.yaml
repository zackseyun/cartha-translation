    rationale: Dans l’hébreu, בָּיְתָה complète la localisation/orientation du bord en rapport avec l’éphod. En français, le placer après « l’éphod » sans autre lien rend son référent spatial moins net. Une formulation qui conserve la relative explicite le rattachement sans résoudre indûment l’ambiguïté spatiale du texte source.
