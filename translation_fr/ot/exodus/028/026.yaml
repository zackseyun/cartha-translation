  text: וְ/עָשִׂ֗יתָ שְׁתֵּי֙ טַבְּע֣וֹת זָהָ֔ב וְ/שַׂמְתָּ֣ אֹתָ֔/ם עַל שְׁנֵ֖י קְצ֣וֹת הַ/חֹ֑שֶׁן עַל שְׂפָת֕/וֹ אֲשֶׁ֛ר אֶל עֵ֥בֶר הָ/אֵפֹ֖ד בָּֽיְתָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/026.yaml
  text: You shall make two gold rings and put them on the two ends of the breastpiece[a], on its edge that is toward the inner side of the ephod.
translation:
  language: fr
  text: Tu feras deux anneaux d’or et tu les placeras aux deux extrémités du pectoral, sur son bord qui est du côté de l’éphod, vers l’intérieur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « sur son bord intérieur, du côté de l’éphod » ou « sur son bord qui fait face à l’éphod, vers l’intérieur ».'
    reason: 'La construction spatiale אֲשֶׁר אֶל עֵבֶר הָאֵפֹד בָּיְתָה permet plusieurs agencements en français : בָּיְתָה peut préciser l’orientation du bord ou sa position intérieure par rapport à l’éphod.'
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Le parfait qal avec waw, dans cette suite d’instructions, exprime un ordre. Le futur français rend naturellement cette valeur prescriptive.
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: deux anneaux d’or
  rationale: Cette formulation française courante exprime clairement le nombre, l’objet et la matière.
- source_word: וְשַׂמְתָּ אֹתָם
  choice: et tu les placeras
  rationale: שׂים signifie mettre, placer ou poser. « Placer » convient précisément au contexte de fabrication.
- source_word: עַל שְׁנֵי קְצוֹת הַחֹשֶׁן
  choice: aux deux extrémités du pectoral
  rationale: קָצֶה désigne une extrémité; « aux » est idiomatique pour indiquer l’emplacement. « Pectoral » est le terme français traditionnel et intelligible pour חֹשֶׁן dans ce contexte sacerdotal.
- source_word: עַל שְׂפָתוֹ
  choice: sur son bord
  rationale: שָׂפָה peut désigner une lèvre, un bord ou une bordure. Pour un ouvrage textile, « bord » est naturel et précis.
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד בָּיְתָה
  choice: tourné vers l’éphod, à l’intérieur
  rationale: עֵבֶר marque le côté ou l’orientation, tandis que בָּיְתָה signifie « vers l’intérieur ». La formulation conserve les deux indications spatiales sans les fusionner entièrement.
theological_decisions: []
