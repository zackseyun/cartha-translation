  text: וְ/עָשִׂ֥יתָ צִּ֖יץ זָהָ֣ב טָה֑וֹר וּ/פִתַּחְתָּ֤ עָלָי/ו֙ פִּתּוּחֵ֣י חֹתָ֔ם קֹ֖דֶשׁ לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/036.yaml
  text: 'And you shall make a plate of pure gold[a], and engrave on it, like the engravings of a seal: ‘Holy to Yahweh.’'
translation:
  language: fr
  text: 'Tu feras une plaque en or pur et tu y graveras, comme on grave un sceau : « Consacré à Yahweh »[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Sainteté à Yahweh. »'
    reason: La formule hébraïque est concise. Le nom קֹדֶשׁ peut être rendu par « sainteté »; le texte principal emploie une formulation dédicatoire française naturelle.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Le qatal précédé de וְ poursuit ici la série d’instructions. Le futur français exprime naturellement la prescription solennelle.
- source_word: צִּיץ
  choice: plaque
  rationale: Dans ce contexte, le mot désigne l’ornement d’or fixé sur la coiffure du grand prêtre. « Plaque » est clair en français moderne sans imposer la forme florale que le terme peut évoquer ailleurs.
- source_word: זָהָב טָהוֹר
  choice: en or pur
  rationale: Cette formulation idiomatique indique à la fois la matière et sa qualité.
- source_word: וּפִתַּחְתָּ עָלָיו
  choice: tu y graveras
  rationale: Dans le contexte du travail du métal, פתח désigne l’action de graver; le pronom adverbial « y » reprend naturellement la plaque.
- source_word: פִּתּוּחֵי חֹתָם
  choice: comme on grave un sceau
  rationale: La tournure rend la manière ou le style de la gravure de sceau, tout en restant naturelle et compréhensible en français.
- source_word: קֹדֶשׁ לַיהוָה
  choice: Consacré à Yahweh
  rationale: La formule française conserve la brièveté d’une inscription et exprime l’appartenance sacrée ou la mise à part pour Yahweh. L’autre valeur nominale possible de קֹדֶשׁ est signalée en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Valeur de קֹדֶשׁ dans l’inscription
  choice: Consacré à Yahweh
  alternative: Sainteté à Yahweh
  rationale: קֹדֶשׁ permet une lecture concrète ou qualificative aussi bien qu’abstraite. Le texte principal privilégie une formule dédicatoire française naturelle, tandis que la note préserve la lecture nominale.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement suit l’adresse divine singulière à Moïse. La syntaxe reste celle d’une prescription artisanale, et l’inscription demeure brève et solennelle.
