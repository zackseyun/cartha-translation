source:
  edition: WLC
  text: וְ/אַתָּ֗ה תְּדַבֵּר֙ אֶל כָּל חַכְמֵי לֵ֔ב אֲשֶׁ֥ר מִלֵּאתִ֖י/ו ר֣וּחַ חָכְמָ֑ה וְ/עָשׂ֞וּ אֶת בִּגְדֵ֧י אַהֲרֹ֛ן לְ/קַדְּשׁ֖/וֹ לְ/כַהֲנ/וֹ לִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/003.yaml
  text: And you shall speak to all the wise of heart[a], whom I have filled with a spirit of wisdom, and they shall make Aaron’s garments to consecrate him[c][b], for him to serve me as priest.
translation:
  language: fr
  text: Quant à toi, tu parleras à tous les sages de cœur[a], que j’ai remplis d’un esprit de sagesse[b], et ils feront les vêtements d’Aaron afin de le consacrer pour qu’il me serve comme prêtre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « tous les sages de cœur », expression hébraïque désignant des personnes douées d’intelligence et de savoir-faire.
    reason: lexical_alternative
  - marker: b
    text: Ou « de l’Esprit de sagesse ». L’hébreu peut désigner ici un esprit ou une disposition de sagesse accordée par Dieu, sans préciser davantage.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּדַבֵּר
  choice: tu parleras
  rationale: Le piel inaccompli à valeur directive est rendu par le futur français, naturel dans une suite d’instructions solennelles.
- source_word: חַכְמֵי לֵב
  choice: ceux qui ont le cœur habile
  rationale: Cette formulation conserve l’image hébraïque du cœur comme siège de l’intelligence et du savoir-faire, tout en restant compréhensible en français moderne.
- source_word: מִלֵּאתִיו רוּחַ חָכְמָה
  choice: que j’ai remplis d’un esprit de sagesse
  rationale: « Remplis » préserve l’image de מלא. L’absence d’article devant רוּחַ favorise « un esprit de sagesse », sans exclure l’origine divine de cette aptitude ni imposer une identification plus précise.
- source_word: בִּגְדֵי אַהֲרֹן
  choice: les vêtements d’Aaron
  rationale: Rendu direct de la construction génitive, sans ajouter « sacerdotaux », qui est implicite dans le contexte mais absent de l’expression.
- source_word: לְקַדְּשׁוֹ
  choice: afin de le consacrer
  rationale: Dans ce contexte cultuel, « consacrer » exprime clairement la mise à part d’Aaron pour une fonction sacrée.
- source_word: לְכַהֲנוֹ לִי
  choice: pour qu’il me serve comme prêtre
  rationale: Le verbe כהן signifie exercer ou servir comme prêtre; cette formulation rend aussi explicitement לִי, le service étant accompli pour Dieu.
- source_word: וְעָשׂוּ
  choice: Ils feront
  rationale: Le parfait coordonné poursuit ici la séquence directive; le futur français convient au registre prescriptif et permet une phrase naturelle.
theological_decisions:
- issue: La référence éventuelle de רוּחַ חָכְמָה à l’Esprit de Dieu
  choice: un esprit de sagesse
  alternative: l’Esprit de sagesse
  rationale: L’hébreu ne porte pas d’article et peut désigner une disposition ou une aptitude de sagesse accordée par Dieu. Le texte principal conserve cette indétermination plutôt que d’imposer une identification explicite à l’Esprit saint.
- issue: Le rapport entre la consécration d’Aaron et son service sacerdotal
  choice: afin de le consacrer pour qu’il me serve comme prêtre
  alternative: afin de le consacrer à mon service comme prêtre
  rationale: 'Les deux infinitifs de but sont maintenus dans leur enchaînement: la confection des vêtements vise la consécration d’Aaron, laquelle vise son service sacerdotal pour Dieu.'
translation_notes:
  register: Français international moderne, digne et accessible. « Quant à toi » marque l’emphase du pronom hébreu; le futur conserve le ton directif. L’idiome du cœur est préservé dans le texte et éclairé en note.
