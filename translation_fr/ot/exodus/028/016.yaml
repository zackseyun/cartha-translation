  text: It shall be square and doubled[a], a span its length and a span its width.
translation:
  language: fr
  text: 'Il sera carré et doublé[a] : sa longueur sera d’un empan, et sa largeur d’un empan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « replié en deux ». L’hébreu décrit le pectoral comme ayant une forme double, probablement parce qu’il était replié sur lui-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָבוּעַ
  choice: carré
  rationale: L’adjectif désigne une forme à quatre côtés égaux; « carré » est précis et naturel en français moderne.
- source_word: יִהְיֶה
  choice: il sera
  rationale: L’imparfait hébreu exprime ici une prescription concernant la confection du pectoral; le futur français convient à ce contexte normatif.
- source_word: כָּפוּל
  choice: doublé
  rationale: Le participe passif décrit un objet disposé en double épaisseur, probablement replié. « Doublé » reste concis et conserve la légère ambiguïté du procédé.
- source_word: זֶרֶת
  choice: empan
  rationale: Ce terme désigne la distance entre les extrémités des doigts d’une main déployée. « Empan » est le nom français exact de cette mesure biblique.
- source_word: אָרְכּוֹ
  choice: sa longueur
  rationale: Le nom avec suffixe masculin singulier renvoie au pectoral; « sa longueur » rend directement la formule de mesure.
- source_word: וְזֶרֶת
  choice: et … d’un empan
  rationale: La conjonction relie les deux dimensions; la répétition de « d’un empan » produit une formulation française claire.
- source_word: רָחְבּוֹ
  choice: sa largeur
  rationale: Le terme désigne la largeur, en contraste avec la longueur; c’est le mot courant et précis en français moderne.
