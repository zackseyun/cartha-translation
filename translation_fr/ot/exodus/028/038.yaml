id: EXO.28.38
reference: Exodus 28:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָה֮ עַל מֵ֣צַח אַהֲרֹן֒ וְ/נָשָׂ֨א אַהֲרֹ֜ן אֶת עֲוֺ֣ן הַ/קֳּדָשִׁ֗ים אֲשֶׁ֤ר יַקְדִּ֨ישׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לְ/כָֽל מַתְּנֹ֖ת קָדְשֵׁי/הֶ֑ם וְ/הָיָ֤ה עַל מִצְח/וֹ֙ תָּמִ֔יד לְ/רָצ֥וֹן לָ/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/038.yaml
  text: It shall be on Aaron’s forehead[a], and Aaron shall bear the iniquity of the holy things that the sons of Israel consecrate, for all the gifts of their holy things. It shall always be on his forehead[c][b], for acceptance for them before Yahweh.
translation:
  language: fr
  text: Elle sera sur le front d’Aaron. Aaron portera la faute attachée aux choses saintes[a] que les Israélites consacreront, relativement à tous leurs dons sacrés. Elle restera constamment sur son front, afin qu’ils soient agréés devant Yahvé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « assumera la culpabilité liée aux choses saintes ». L’expression hébraïque peut désigner le fait de porter la responsabilité d’une faute ou d’en subir les conséquences.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour qu’ils trouvent faveur devant Yahvé ». Dans le contexte, leur agrément est lié à celui de leurs dons consacrés.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵצַח / מִצְחוֹ
  choice: front / son front
  rationale: « Front » est l’équivalent français direct et naturel du nom hébreu, et convient aux deux mentions de l’emplacement de la plaque.
- source_word: נָשָׂא ... עֲוֺן
  choice: portera la faute
  rationale: Cette formulation conserve l’image juridique et cultuelle de l’hébreu sans préciser indûment si Aaron assume une culpabilité, une responsabilité ou les conséquences de la faute.
- source_word: הַקֳּדָשִׁים
  choice: les choses saintes
  rationale: Le pluriel désigne ici les réalités ou offrandes consacrées. « Choses saintes » maintient la catégorie cultuelle générale du texte hébreu.
- source_word: יַקְדִּישׁוּ
  choice: consacreront
  rationale: Le verbe exprime l’action de vouer ou de mettre à part pour Dieu; « consacrer » est précis et courant dans ce contexte.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette désignation collective rend naturellement en français moderne l’expression hébraïque littérale « les fils d’Israël », sans suggérer que seuls les hommes sont visés.
- source_word: לְכָל מַתְּנֹת קָדְשֵׁיהֶם
  choice: relativement à tous leurs dons sacrés
  rationale: La construction hébraïque est difficile. Cette formulation conserve le lien entre la faute portée par Aaron et l’ensemble des dons consacrés, sans imposer un rapport plus précis que celui exprimé par la préposition.
- source_word: תָּמִיד
  choice: constamment
  rationale: Le terme indique ici que la plaque doit demeurer continuellement sur le front d’Aaron pendant son service.
- source_word: לְרָצוֹן לָהֶם
  choice: afin qu’ils soient agréés
  rationale: Cette tournure française naturelle exprime la finalité probable de la construction tout en laissant le pronom renvoyer aux Israélites en lien avec leurs dons.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme « Yahvé », usuelle en français, représente le nom divin plutôt que de lui substituer le titre « le Seigneur ».
theological_decisions:
- issue: Sens de la faute des choses saintes portée par Aaron
  choice: Aaron porte la faute attachée aux choses saintes dans son rôle sacerdotal.
  alternative: Aaron enlève directement cette faute, ou ne fait qu’en porter symboliquement le souvenir.
  rationale: L’expression נָשָׂא עָוֺן peut évoquer le fait d’assumer une faute, une responsabilité ou ses conséquences. Le texte français maintient cette tension sans développer une théorie particulière de l’expiation.
- issue: Référent de לְרָצוֹן לָהֶם
  choice: Les Israélites sont agréés devant Yahvé en rapport avec leurs dons consacrés.
  alternative: Seuls les dons eux-mêmes sont agréés.
  rationale: Le pronom pluriel renvoie le plus naturellement aux Israélites, mais le contexte associe étroitement leur agrément à celui de leurs offrandes; la formulation ne dissocie pas artificiellement les deux.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est rendue plus idiomatique sans effacer la terminologie cultuelle ni les ambiguïtés du texte hébreu. Le féminin « elle » reprend la plaque d’or mentionnée au verset précédent.
