  text: And you shall take two onyx stones and engrave on them the names of the sons of Israel[a].
translation:
  language: fr
  text: Tu prendras deux pierres d’onyx[a] et tu y graveras les noms des fils d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu shoham désigne une pierre précieuse traditionnellement appelée « onyx »; son identification exacte est incertaine, et l’on a aussi proposé le sardonyx ou le béryl.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Tu prendras
  rationale: Le parfait qal précédé du waw poursuit ici une série d’instructions et a une valeur directive. Le futur français exprime naturellement cette prescription sans alourdir la phrase.
- source_word: שְׁתֵּי אַבְנֵי שֹׁהַם
  choice: deux pierres d’onyx
  rationale: שֹׁהַם désigne une pierre précieuse dont l’identification exacte reste incertaine. « Onyx » est le terme traditionnel et le plus reconnaissable; une note conserve l’incertitude lexicale.
- source_word: וּפִתַּחְתָּ
  choice: et tu y graveras
  rationale: Dans le contexte de noms incisés sur des pierres précieuses, « graver » rend précisément l’action exprimée. Le pronom adverbial « y » reprend naturellement les pierres en français.
- source_word: עֲלֵיהֶם
  choice: y
  rationale: Le pronom « y » signifie ici « sur elles » et évite une tournure plus lourde tout en conservant clairement le rapport spatial.
- source_word: שְׁמוֹת
  choice: les noms
  rationale: L’article défini convient en français puisqu’il s’agit des noms précis appartenant aux fils d’Israël.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: des fils d’Israël
  rationale: Dans ce contexte, l’expression désigne les fils historiques de Jacob, ancêtres des tribus, plutôt que l’ensemble du peuple israélite. La traduction littérale est donc précise et naturelle.
