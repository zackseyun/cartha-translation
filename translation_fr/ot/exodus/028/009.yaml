translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur impérative convient au registre prescriptif du passage. La coordination initiale hébraïque n’est pas rendue par « Et », peu naturel en français dans un verset isolé, mais la continuité des instructions demeure portée par la syntaxe.
