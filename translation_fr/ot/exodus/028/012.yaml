  text: וְ/שַׂמְתָּ֞ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֗ים עַ֚ל כִּתְפֹ֣ת הָֽ/אֵפֹ֔ד אַבְנֵ֥י זִכָּרֹ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/נָשָׂא֩ אַהֲרֹ֨ן אֶת שְׁמוֹתָ֜/ם לִ/פְנֵ֧י יְהוָ֛ה עַל שְׁתֵּ֥י כְתֵפָ֖י/ו לְ/זִכָּרֹֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/012.yaml
  text: And you shall set the two stones on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], and Aaron shall bear their names before Yahweh on his two shoulders for remembrance.
translation:
  language: fr
  text: Tu placeras les deux pierres sur les épaulettes de l’éphod, comme pierres commémoratives pour les fils d’Israël[a]. Aaron portera leurs noms devant Yahweh, sur ses deux épaules, en souvenir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « les fils d’Israël » : expression familiale qui désigne ici collectivement le peuple d’Israël.'
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Tu placeras
  rationale: Le verbe שׂים signifie « mettre, placer ». Le futur à valeur d’instruction rend naturellement en français la forme hébraïque adressée à la deuxième personne du masculin singulier.
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: les deux pierres
  rationale: Traduction directe du groupe nominal défini; la nature des pierres, indiquée dans le contexte précédent, n’est pas répétée ici.
- source_word: כִּתְפֹת הָאֵפֹד
  choice: les épaulettes de l’éphod
  rationale: Dans le contexte d’un vêtement, כָּתֵף désigne ici les parties de l’éphod qui reposent sur les épaules. « Épaulettes » est précis, naturel et permet de les distinguer des épaules d’Aaron mentionnées ensuite.
- source_word: אַבְנֵי זִכָּרֹן
  choice: pierres de souvenir
  rationale: Cette formulation conserve le lien lexical avec לְזִכָּרֹן à la fin du verset et reste idiomatique en français biblique moderne.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: pour les fils d’Israël
  rationale: La traduction garde l’expression familiale explicite de l’hébreu, tout en ajoutant une note précisant sa portée collective.
- source_word: וְנָשָׂא ... אֶת שְׁמוֹתָם
  choice: Aaron portera leurs noms
  rationale: נשׂא signifie « porter ». Le choix conserve l’image concrète et la fonction représentative du grand prêtre sans l’expliciter davantage que le texte.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי signifie « devant, en présence de »; « devant » est concis. Le nom divin est translittéré « Yahweh ».
- source_word: עַל שְׁתֵּי כְתֵפָיו
  choice: sur ses deux épaules
  rationale: La formulation préserve le nombre explicite et distingue les épaules d’Aaron des épaulettes de l’éphod.
- source_word: לְזִכָּרֹן
  choice: en souvenir
  rationale: La formule exprime la fonction mémorielle tout en maintenant ouverte la question de savoir à qui le souvenir est principalement destiné.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » représente le nom propre et correspond à la convention indiquée dans la couche de consultation.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites; le peuple d’Israël
  rationale: Le texte principal conserve la métaphore généalogique de l’hébreu. Une note indique que l’expression désigne collectivement le peuple issu d’Israël, sans la réduire aux seuls hommes.
- issue: Référent implicite du souvenir
  choice: en souvenir
  alternative: afin que Yahweh se souvienne d’eux; comme mémorial pour Israël
  rationale: L’hébreu ne précise pas explicitement qui se souvient. La traduction préserve cette ambiguïté plutôt que d’assigner le souvenir à Dieu, à Aaron ou au peuple.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur prescriptif convient aux instructions cultuelles. « Éphod » est conservé comme terme technique traditionnel; « épaulettes » clarifie la construction du vêtement sans paraphrase excessive.
