source:
  edition: WLC
  text: מַעֲשֵׂ֣ה חָרַשׁ֮ אֶבֶן֒ פִּתּוּחֵ֣י חֹתָ֗ם תְּפַתַּח֙ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֔ים עַל שְׁמֹ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל מֻסַבֹּ֛ת מִשְׁבְּצ֥וֹת זָהָ֖ב תַּעֲשֶׂ֥ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/011.yaml
  text: Like the work of an engraver in stone[a], like the engravings of a signet, you shall engrave the two stones with the names of the sons of Israel[b]; you shall make them enclosed in settings of gold.
translation:
  language: fr
  text: Tu graveras les deux pierres, comme le fait un graveur de pierre, à la manière des gravures d’un sceau, avec les noms des fils d’Israël[a]. Tu les enchâsseras dans des montures en or.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « fils d’Israël » désigne ici les ancêtres dont les tribus d’Israël portent les noms.
    reason: cultural_note
lexical_decisions:
- source_word: מַעֲשֵׂה חָרַשׁ אֶבֶן
  choice: comme le ferait un graveur sur pierre
  rationale: Le groupe décrit le travail ou le savoir-faire d’un artisan de la pierre. Cette formulation naturelle en français rattache clairement l’expression à l’ordre de graver.
- source_word: פִּתּוּחֵי חֹתָם
  choice: à la manière des gravures d’un sceau
  rationale: L’expression désigne une gravure exécutée dans le style caractéristique d’un sceau; « sceau » est clair et fidèle sans imposer une forme précise de bijou.
- source_word: תְּפַתַּח
  choice: tu graveras
  rationale: Dans le contexte de noms incisés sur des pierres, « graver » est le verbe français le plus précis et le plus idiomatique.
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: les deux pierres
  rationale: La traduction conserve le terme générique de l’hébreu sans préciser qu’il s’agit de pierres précieuses, précision fournie par le contexte.
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: avec les noms des fils d’Israël
  rationale: La préposition introduit ici le contenu de l’inscription. « Fils d’Israël » préserve la désignation familiale masculine liée aux ancêtres éponymes des tribus.
- source_word: מֻסַבֹּת מִשְׁבְּצוֹת זָהָב
  choice: tu les enchâsseras dans des montures en or
  rationale: Le participe décrit les pierres entourées ou serties dans des éléments d’orfèvrerie. « Enchâsser » et « montures » rendent naturellement l’image sans surdéterminer la technique antique.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: tu les enchâsseras
  rationale: Le verbe « faire » prend ici son sens concret à partir du complément décrivant les pierres montées; la formulation française exprime directement le résultat commandé.
theological_decisions:
- issue: Désignation familiale genrée בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: enfants d’Israël
  rationale: Le contexte immédiat concerne les noms des fils ancestraux d’Israël, associés aux tribus. La traduction conserve donc la formulation masculine et ajoute une note pour prévenir une lecture limitée aux seuls Israélites mâles.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase est réordonnée afin d’éviter une ouverture nominale lourde et de rendre clairement les deux indications de manière. Le vocabulaire d’orfèvrerie reste précis mais courant.
