    issue: Nuance hypothétique dans « comme le ferait un graveur sur pierre ».
    rationale: La formule française évoque ce qu’un artisan ferait dans une situation hypothétique. Le texte hébreu décrit directement la manière du travail artisanal. « comme le fait un graveur de pierre » est plus direct et plus idiomatique.
  - severity: low
    issue: Désignation de l’artisan.
    rationale: « Graveur de pierre » est la collocation française usuelle pour un artisan qui travaille la pierre; « graveur sur pierre » peut aussi se comprendre comme quelqu’un qui grave sur une surface de pierre.
