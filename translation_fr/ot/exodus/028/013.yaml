lexical_decisions:
- source_word: וְ/עָשִׂיתָ
  choice: Tu feras
  rationale: Dans cette suite d’instructions, le qatal à la 2e personne du masculin singulier a une valeur prescriptive. En français, le futur « Tu feras » exprime naturellement cette consigne; la coordination וְ n’a pas besoin d’être rendue séparément dans ce verset bref.
- source_word: מִשְׁבְּצֹת
  choice: montures
  rationale: Le nom désigne des éléments ornementaux servant de supports ou d’attaches, dans le contexte des pierres et des chaînettes du vêtement sacerdotal. « Montures » est clair et évite de préciser une technique que le terme seul n’impose pas.
- source_word: זָהָב
  choice: en or
  rationale: Cette formulation française courante indique simplement la matière dont les montures doivent être faites.
