translation:
  language: fr
  text: 'et, à la troisième rangée : un hyacinthe[a], une agate[b] et une améthyste.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification précise des pierres nommées ici est incertaine. « Hyacinthe » traduit לֶשֶׁם, traditionnellement rendu aussi par « ligure ».
    reason: lexical_alternative
  - marker: b
    text: Peut-être « onyx ». Les anciens noms de pierres précieuses ne correspondent pas toujours exactement aux noms minéralogiques modernes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר
  choice: et, à la ... rangée
  rationale: Dans le contexte des pierres du pectoral, טוּר désigne une rangée. La conjonction וְ poursuit l’énumération du verset précédent; la tournure française « à la troisième rangée » est naturelle dans cette liste.
- source_word: הַשְּׁלִישִׁי
  choice: troisième
  rationale: L’adjectif ordinal désigne sans ambiguïté la troisième rangée.
- source_word: לֶשֶׁם
  choice: hyacinthe
  rationale: L’identification exacte est incertaine. « Hyacinthe » est une équivalence traditionnelle et intelligible en français pour cette pierre précieuse, mais l’incertitude est signalée en note.
- source_word: שְׁבוֹ
  choice: agate
  rationale: « Agate » est l’équivalent traditionnel et plausible; les noms anciens de gemmes ne correspondent toutefois pas toujours exactement aux catégories minéralogiques modernes.
- source_word: וְאַחְלָמָה
  choice: et une améthyste
  rationale: אַחְלָמָה est couramment et plausiblement identifié à l’améthyste; la conjonction est rendue explicitement.
