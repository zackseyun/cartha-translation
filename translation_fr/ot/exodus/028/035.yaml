  text: וְ/הָיָ֥ה עַֽל אַהֲרֹ֖ן לְ/שָׁרֵ֑ת וְ/נִשְׁמַ֣ע ק֠וֹל/וֹ בְּ/בֹא֨/וֹ אֶל הַ/קֹּ֜דֶשׁ לִ/פְנֵ֧י יְהוָ֛ה וּ/בְ/צֵאת֖/וֹ וְ/לֹ֥א יָמֽוּת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/035.yaml
  text: It shall be on Aaron when he ministers[a], and its sound shall be heard when he goes into the Holy Place before Yahweh and when he comes out[c][b], so that he may not die.
translation:
  language: fr
  text: Aaron la portera pour accomplir son service. On entendra le son des clochettes[a] quand il entrera dans le lieu saint[b], devant Yahweh, et quand il en sortira, afin qu’il ne meure pas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « on entendra son son » ou « son bruit sera entendu » ; le suffixe hébreu renvoie probablement à la robe garnie de clochettes.'
    reason: lexical_alternative
  - marker: b
    text: Ou « dans le sanctuaire ». L’hébreu dit « vers/dans le lieu saint » et désigne ici l’espace sacré de la tente de la rencontre.
    reason: lexical_alternative
  - marker: c
    text: Ou « de peur qu’il ne meure ».
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה עַל אַהֲרֹן
  choice: Aaron la portera
  rationale: Le sujet implicite renvoie au vêtement décrit précédemment. Cette formulation française exprime naturellement qu’il doit être sur Aaron, sans lourdeur.
- source_word: לְשָׁרֵת
  choice: lorsqu’il accomplira son service
  rationale: L’infinitif avec ל peut exprimer le but ou la circonstance. Ici, la valeur temporelle convient au contexte du service sacerdotal.
- source_word: וְנִשְׁמַע קוֹלוֹ
  choice: On entendra le son des clochettes
  rationale: Le suffixe renvoie vraisemblablement au vêtement garni de clochettes décrit aux versets précédents. Nommer les clochettes rend le référent naturel en français sans changer le sens contextuel.
- source_word: בְּבֹאוֹ
  choice: quand il entrera
  rationale: L’infinitif construit précédé de בְּ a une valeur temporelle; avec la destination qui suit, «entrera» est idiomatique.
- source_word: אֶל הַקֹּדֶשׁ
  choice: dans le lieu saint
  rationale: הַקֹּדֶשׁ désigne ici l’espace sacré du sanctuaire. «Le lieu saint» conserve le vocabulaire cultuel tout en restant accessible.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: «Devant» conserve la formulation relationnelle et cultuelle de l’hébreu; le nom divin est translittéré «Yahweh» conformément à la couche de consultation fournie.
- source_word: וּבְצֵאתוֹ
  choice: et quand il en sortira
  rationale: La formulation reproduit le parallélisme temporel avec l’entrée; «en» reprend clairement le lieu saint.
- source_word: וְלֹא יָמוּת
  choice: afin qu’il ne meure pas
  rationale: Dans cette prescription rituelle, la coordination exprime naturellement une conséquence préventive ou un but. Cette traduction moderne garde aussi en note la possibilité plus formelle.
theological_decisions:
- issue: Référent du son entendu
  choice: Le son est celui des clochettes fixées au vêtement d’Aaron.
  alternative: Le suffixe peut être rendu plus formellement par «son bruit», avec pour référent le vêtement, ou être compris plus généralement comme le bruit accompagnant Aaron.
  rationale: Le contexte immédiat des versets 33-34 décrit les clochettes placées au bas de la robe; elles constituent donc le référent le plus probable.
- issue: Portée de la dernière proposition
  choice: 'Une finalité ou conséquence préventive: «afin qu’il ne meure pas».'
  alternative: 'Une mise en garde plus formelle: «de peur qu’il ne meure».'
  rationale: La syntaxe hébraïque permet de conserver une certaine tension entre résultat attendu et avertissement; la note signale l’autre nuance.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération garde le caractère de nom propre du tétragramme et correspond à la politique indiquée dans les données du projet.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition temporelle de l’hébreu est maintenue, tandis que le référent implicite du vêtement est explicité par le pronom «la» et celui du son par «des clochettes». Les trois appels de note [a], [b] et [c] figurent dans le texte.
