  yaml_path: translation/ot/exodus/028/020.yaml
  text: 'And the fourth row: beryl[a], onyx, and jasper; they shall be set in gold in their settings.'
translation:
  language: fr
  text: 'La quatrième rangée : une chrysolithe[a], un onyx et un jaspe. Ces pierres seront serties dans des montures en or.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification exacte de plusieurs pierres du pectoral du grand prêtre est incertaine. תַּרְשִׁישׁ est traditionnellement rendu notamment par « chrysolithe » ou « béryl », et שֹׁהַם par « onyx », mais d’autres identifications ont été proposées.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: La quatrième rangée
  rationale: Dans la description du pectoral, טוּר désigne une rangée de pierres; l’ordinal est rendu directement. Le וְ d’enchaînement n’a pas besoin d’être traduit par « et » en français.
- source_word: תַּרְשִׁישׁ
  choice: chrysolithe
  rationale: L’identification du minéral ancien demeure incertaine. « Chrysolithe » est un équivalent français traditionnel et reconnaissable, sans que la note prétende à une certitude minéralogique.
- source_word: שֹׁהַם
  choice: onyx
  rationale: « Onyx » est l’équivalent traditionnel le plus courant dans les textes relatifs au sanctuaire, bien que l’identification exacte soit discutée.
- source_word: יָשְׁפֵה
  choice: jaspe
  rationale: « Jaspe » est l’équivalent français usuel et convient naturellement à cette liste de pierres.
- source_word: מְשֻׁבָּצִים זָהָב
  choice: serties dans des montures en or
  rationale: Le participe passif décrit des pierres fixées par un travail de joaillerie. « Serties » est idiomatique en français, et « montures en or » exprime le matériau des supports.
- source_word: יִהְיוּ בְּמִלּוּאֹתָם
  choice: Ces pierres seront … dans des montures
  rationale: L’imparfait hébreu a ici une valeur prescriptive. « Seront » conserve cette force, tandis que « montures » rend le terme technique contextuel מִלּוּאִים sans calquer son sens littéral de remplissage.
