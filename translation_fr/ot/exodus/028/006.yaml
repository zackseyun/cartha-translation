  text: וְ/עָשׂ֖וּ אֶת הָ/אֵפֹ֑ד זָ֠הָב תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן תּוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר מַעֲשֵׂ֥ה חֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/006.yaml
  text: And they shall make the ephod of gold[a], blue, and purple, scarlet yarn, and fine twisted linen[b], the work of a skillful designer.
translation:
  language: fr
  text: Ils feront l’éphod avec de l’or[a], du fil bleu, de la pourpre, de l’écarlate et du fin lin retors, ouvrage d’un artisan habile[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « du fil d’or » : l’hébreu dit simplement « or », mais, dans ce contexte de fabrication textile, il peut s’agir d’or travaillé en fils.'
    reason: lexical_alternative
  - marker: b
    text: Ou « ouvrage d’un concepteur »; l’expression hébraïque désigne un travail artistique à motifs, réalisé avec savoir-faire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: Ils feront
  rationale: Dans cette suite d’instructions, le parfait avec waw exprime une directive. Le futur français garde le ton prescriptif tout en restant naturel.
- source_word: הָאֵפֹד
  choice: l’éphod
  rationale: Terme technique désignant un vêtement cultuel sans équivalent français précis; la translittération évite d’en déterminer excessivement la forme.
- source_word: זָהָב
  choice: de l’or
  rationale: L’hébreu dit simplement « or ». Le contexte textile suggère qu’il est travaillé en fils, mais ce détail n’est pas explicite dans ce verset.
- source_word: תְּכֵלֶת וְאַרְגָּמָן תּוֹלַעַת שָׁנִי
  choice: du fil bleu, pourpre et écarlate
  rationale: Ces termes désignent ici des matières textiles colorées. « Fil » explicite naturellement le contexte manufacturier sans répéter le nom devant chaque couleur.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: du fin lin retors
  rationale: שֵׁשׁ désigne le fin lin et מָשְׁזָר sa qualité torsadée; « fin lin retors » est précis et idiomatique dans ce registre.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: ouvrage d’un artisan habile
  rationale: L’expression évoque un travail artistique conçu et exécuté avec compétence, sans imposer la technique plus précise de la broderie.
