id: EXO.33.10
reference: Exodus 33:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/רָאָ֤ה כָל הָ/עָם֙ אֶת עַמּ֣וּד הֶֽ/עָנָ֔ן עֹמֵ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וְ/קָ֤ם כָּל הָ/עָם֙ וְ/הִֽשְׁתַּחֲוּ֔וּ אִ֖ישׁ פֶּ֥תַח אָהֳלֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/010.yaml
  text: When all the people saw the pillar of cloud standing at the entrance of the tent[a], all the people rose and worshiped, each man at the entrance of his tent.
translation:
  language: fr
  text: Quand tout le peuple voyait la colonne de nuée se tenir à l’entrée de la tente, tout le peuple se levait et se prosternait[a], chacun à l’entrée de sa tente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « adorait ». Le verbe hébreu désigne le fait de s’incliner profondément ou de se prosterner en signe de révérence; dans ce contexte, ce geste constitue un acte d’adoration.
    reason: alternative lexicale et préservation de la dimension corporelle du verbe
lexical_decisions:
- source_word: וְרָאָה
  choice: Quand ... voyait
  rationale: Dans la séquence habituelle commencée aux versets précédents, la forme fait avancer une scène répétée. « Quand ... voyait » et l’imparfait rendent naturellement cette valeur temporelle et itérative en français.
- source_word: כָל הָעָם
  choice: tout le peuple
  rationale: La locution désigne collectivement le peuple assemblé. Cette traduction reste directe sans ajouter « d’Israël », absent du verset.
- source_word: עַמּוּד הֶעָנָן
  choice: la colonne de nuée
  rationale: Cette expression usuelle conserve l’image concrète du signe visible de la présence divine.
- source_word: עֹמֵד
  choice: se tenir
  rationale: Le participe indique que la colonne demeure dressée à un endroit précis. « Se tenir » convient naturellement à « colonne » dans cette construction.
- source_word: פֶּתַח הָאֹהֶל
  choice: à l’entrée de la tente
  rationale: פֶּתַח désigne l’ouverture ou l’entrée. Le contexte identifie la tente, mais le texte du verset ne répète pas explicitement « de la rencontre ».
- source_word: וְקָם
  choice: se levait
  rationale: Le verbe décrit le fait de se mettre debout en réaction à l’apparition de la colonne; l’imparfait maintient la valeur habituelle de la scène.
- source_word: וְהִשְׁתַּחֲווּ
  choice: se prosternait
  rationale: Le verbe désigne d’abord un geste corporel d’abaissement révérencieux. « Se prosterner » préserve à la fois ce geste concret et sa portée cultuelle sans réduire le terme à une notion intérieure.
- source_word: אִישׁ
  choice: chacun
  rationale: Employé distributivement, le singulier présente les membres du peuple un par un. « Chacun » restitue cette distribution de façon naturelle sans imposer ici une restriction masculine que le contexte collectif n’exige pas.
- source_word: פֶּתַח אָהֳלוֹ
  choice: à l’entrée de sa tente
  rationale: La traduction conserve le parallèle avec la première entrée et l’image distributive de chaque personne restant devant sa propre tente.
theological_decisions:
- issue: Nature de la réaction du peuple devant le signe visible de la présence divine
  choice: se prosternait
  alternative: adorait
  rationale: Le contexte confère clairement au geste une portée religieuse, mais le verbe hébreu nomme aussi l’acte corporel de s’incliner profondément. Le texte principal conserve ce geste concret; la note explicite qu’il fonctionne ici comme un acte d’adoration.
translation_notes:
  register: Français international actuel, clair et digne. L’imparfait rend le caractère habituel de la scène dans son contexte. La répétition de « tout le peuple » suit l’insistance de l’hébreu; « chacun » conserve ensuite la perspective distributive.
