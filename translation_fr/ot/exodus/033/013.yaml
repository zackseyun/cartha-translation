  text: וְ/עַתָּ֡ה אִם נָא֩ מָצָ֨אתִי חֵ֜ן בְּ/עֵינֶ֗י/ךָ הוֹדִעֵ֤/נִי נָא֙ אֶת דְּרָכֶ֔/ךָ וְ/אֵדָ֣עֲ/ךָ֔ לְמַ֥עַן אֶמְצָא חֵ֖ן בְּ/עֵינֶ֑י/ךָ וּ/רְאֵ֕ה כִּ֥י עַמְּ/ךָ֖ הַ/גּ֥וֹי הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/013.yaml
  text: Now therefore[a], if I have found favor in your eyes, please make your ways known to me, so that I may know you, in order that I may find favor in your eyes[c][b]. And consider that this nation is your people.
translation:
  language: fr
  text: Maintenant donc, si j’ai trouvé grâce à tes yeux, fais-moi connaître, je t’en prie, tes voies[a], afin que je te connaisse[b], pour que je trouve grâce à tes yeux. Considère[c] que cette nation est ton peuple[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte le pluriel « tes voies », c’est-à-dire les manières d’agir de Dieu.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « et je te connaîtrai ». La construction hébraïque peut exprimer le but ou la conséquence.'
    reason: textual_ambiguity
  - marker: c
    text: 'Littéralement : « vois ». Ici, le verbe signifie prendre en considération ou reconnaître un fait.'
    reason: lexical_alternative
  - marker: d
    text: L’hébreu associe ici « cette nation » et « ton peuple », conservant les deux désignations.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Rend à la fois la transition temporelle et la portée argumentative de l’expression hébraïque.
- source_word: נָא
  choice: je t’en prie
  rationale: Cette particule marque une requête respectueuse. La tournure est naturelle en français moderne et conserve le ton de supplication.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: j’ai trouvé grâce à tes yeux
  rationale: Conserve l’image hébraïque tout en employant une expression française courante. Ici, « grâce » désigne la faveur accordée, sans imposer un sens doctrinal technique.
- source_word: הוֹדִעֵנִי
  choice: fais-moi connaître
  rationale: Le hiphil de ידע exprime ici le fait de faire connaître; cette formulation reste précise et naturelle.
- source_word: דְּרָכֶךָ
  choice: tes voies
  rationale: La forme hébraïque est plurielle et peut désigner les manières d’agir ou la conduite de Dieu.
- source_word: וְאֵדָעֲךָ
  choice: afin que je te connaisse
  rationale: Le contexte permet de comprendre la proposition comme exprimant le but ou le résultat de la demande. « Te connaisse » maintient sa dimension personnelle et relationnelle.
- source_word: לְמַעַן אֶמְצָא חֵן בְּעֵינֶיךָ
  choice: pour que je trouve grâce à tes yeux
  rationale: לְמַעַן introduit explicitement un but. La répétition de « trouver grâce à tes yeux » est conservée parce qu’elle structure la supplication de Moïse.
- source_word: וּרְאֵה
  choice: Considère
  rationale: L’impératif de ראה invite ici Dieu à prendre en considération une réalité, plutôt qu’à simplement la regarder.
- source_word: כִּי עַמְּךָ הַגּוֹי הַזֶּה
  choice: que cette nation est ton peuple
  rationale: La traduction distingue גּוֹי (« nation ») de עַם (« peuple »), comme le fait l’hébreu.
theological_decisions:
- issue: Rapport logique de וְאֵדָעֲךָ avec la demande précédente
  choice: afin que je te connaisse
  alternative: et je te connaîtrai
  rationale: La traduction retient une valeur de but adaptée au contexte, tout en signalant en note que la coordination hébraïque peut aussi se rendre comme une conséquence.
- issue: Nuance d’alliance dans la proposition finale
  choice: cette nation est ton peuple
  alternative: ce peuple est ton peuple
  rationale: L’hébreu emploie deux noms distincts, גּוֹי et עַם. Les rendre respectivement par « nation » et « peuple » préserve l’appel de Moïse sans ajouter de précision théologique absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement suit l’adresse directe singulière du texte hébreu. La répétition rhétorique et les termes distincts « nation » et « peuple » sont maintenus.
