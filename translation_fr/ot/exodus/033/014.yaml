  text: וַ/יֹּאמַ֑ר פָּנַ֥/י יֵלֵ֖כוּ וַ/הֲנִחֹ֥תִי לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/014.yaml
  text: And he said[a], “My presence will go, and I will give you rest.”
translation:
  language: fr
  text: 'Il dit : « Ma présence[a] ira, et je te donnerai du repos. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ma face ». Dans ce contexte, cette expression évoque la présence personnelle de Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Il dit
  rationale: Le wayyiqtol de אמר introduit directement la parole. En français, « Il dit » assure un enchaînement narratif naturel sans préciser davantage la relation temporelle.
- source_word: פָּנַי
  choice: Ma présence
  rationale: Littéralement « ma face »; dans ce contexte, l’expression désigne la présence personnelle de Dieu. « Ma présence » est naturel en français tout en conservant l’idée que le Seigneur lui-même accompagnera Moïse.
- source_word: יֵלֵכוּ
  choice: ira avec toi
  rationale: Le verbe « aller » s’accorde en hébreu avec פָּנַי, morphologiquement pluriel. Le singulier convient en français avec « présence ». « Avec toi » explicite l’accompagnement impliqué par le contexte immédiat, sans changer le référent singulier de לָךְ.
- source_word: וַהֲנִחֹתִי
  choice: et je te donnerai du repos
  rationale: Le hiphil de נוח exprime l’action de faire reposer ou de donner du repos. Cette formulation française est idiomatique et maintient la valeur causative.
- source_word: לָךְ
  choice: toi / te
  rationale: Le suffixe est à la deuxième personne du singulier et vise Moïse. Il est rendu naturellement par « toi » dans « avec toi » et par « te » dans « je te donnerai ».
theological_decisions:
- issue: Expression anthropomorphique פָּנַי
  choice: Ma présence
  alternative: Ma face; Moi-même
  rationale: « Ma présence » communique l’idée de la présence personnelle de Dieu sans transformer l’image hébraïque en une affirmation abstraite. La traduction littérale « ma face » est signalée en note afin de préserver le lien verbal et thématique avec le reste du chapitre.
- issue: Destinataire singulier de la promesse
  choice: avec toi / je te donnerai
  alternative: avec vous / je vous donnerai
  rationale: לָךְ est grammaticalement singulier et s’adresse directement à Moïse. Le contexte peut avoir des conséquences pour le peuple, mais la traduction ne remplace pas le singulier du texte par un pluriel interprétatif.
translation_notes:
  register: Français moderne, international et digne. La phrase reste concise et orale. « Du repos » est plus naturel ici que « le repos » et conserve l’ouverture du terme hébreu; la note maintient l’image concrète de la « face ».
