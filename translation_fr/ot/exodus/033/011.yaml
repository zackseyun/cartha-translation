  text: וְ/דִבֶּ֨ר יְהוָ֤ה אֶל מֹשֶׁה֙ פָּנִ֣ים אֶל פָּנִ֔ים כַּ/אֲשֶׁ֛ר יְדַבֵּ֥ר אִ֖ישׁ אֶל רֵעֵ֑/הוּ וְ/שָׁב֙ אֶל הַֽ/מַּחֲנֶ֔ה וּ/מְשָׁ֨רְת֜/וֹ יְהוֹשֻׁ֤עַ בִּן נוּן֙ נַ֔עַר לֹ֥א יָמִ֖ישׁ מִ/תּ֥וֹךְ הָ/אֹֽהֶל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/011.yaml
  text: And Yahweh would speak to Moses face to face[a], as a man speaks to his friend. Then he would return to the camp, but his attendant Joshua son of Nun, a young man[b], would not depart from the midst of the tent.
translation:
  language: fr
  text: Yahweh parlait à Moïse face à face[a], comme un homme parle à son ami. Puis Moïse retournait au camp, mais son assistant Josué, fils de Noun, un jeune homme, ne sortait pas de la tente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « directement » ou « personnellement ». L’expression hébraïque « face à face » évoque une rencontre d’un caractère exceptionnellement direct.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de la tente de la Rencontre.
    reason: contextual_clarification
lexical_decisions:
- source_word: וְדִבֶּר
  choice: parlait
  rationale: L’imparfait français exprime naturellement l’action habituelle et répétée décrite dans ce cadre narratif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel du texte hébreu au lieu de lui substituer un titre.
- source_word: פָּנִים אֶל פָּנִים
  choice: face à face
  rationale: Cette expression française conserve l’image et le caractère direct et personnel de l’échange, sans préciser s’il s’agit d’une vision physique.
- source_word: כַּאֲשֶׁר יְדַבֵּר אִישׁ אֶל רֵעֵהוּ
  choice: comme un homme parle à son ami
  rationale: La formulation rend explicitement אִישׁ et traduit רֵעַ de façon naturelle dans ce contexte relationnel.
- source_word: וְשָׁב
  choice: Puis Moïse retournait
  rationale: L’imparfait poursuit la description habituelle; la répétition du nom de Moïse lève naturellement l’ambiguïté du pronom en français.
- source_word: וּמְשָׁרְתוֹ
  choice: son assistant
  rationale: Le terme désigne ici celui qui seconde Moïse dans son service; « assistant » est actuel et évite les connotations domestiques possibles de « serviteur ».
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josué, fils de Noun
  rationale: Les formes françaises usuelles des noms sont conservées, avec une formulation naturelle du patronyme.
- source_word: נַעַר
  choice: un jeune homme
  rationale: Le mot peut désigner un garçon, un jeune homme ou un jeune serviteur; ici, « jeune homme » conserve l’indication d’âge sans répéter l’idée de service.
- source_word: לֹא יָמִישׁ
  choice: ne quittait pas
  rationale: Cette tournure rend le fait de ne pas s’éloigner ou partir et s’intègre au caractère habituel de la scène.
- source_word: מִתּוֹךְ הָאֹהֶל
  choice: l’intérieur de la tente
  rationale: La formulation rend clairement מִתּוֹךְ en français moderne sans la lourdeur de « du milieu de la tente ».
theological_decisions:
- issue: La formule anthropomorphique selon laquelle Yahweh parlait à Moïse « face à face »
  choice: Conserver « face à face » comme expression d’une rencontre directe et personnelle.
  alternative: Traduire seulement par « directement » ou « personnellement » afin d’éviter toute idée de vision physique.
  rationale: Le texte hébreu emploie délibérément cette image. La conserver respecte sa force ainsi que sa tension avec les passages qui soulignent que Dieu ne peut être vu pleinement.
translation_notes:
  register: Français international moderne, naturel et digne. Les imparfaits rendent la valeur habituelle des actions. « Yahweh » conserve le nom divin; « Josué » et « Noun » suivent des formes françaises reconnaissables. Le second appel de note est placé après « tente », terme qu’il explique.
