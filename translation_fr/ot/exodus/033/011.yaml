  to: Yahweh parlait à Moïse face à face[a], comme un homme parle à son ami. Puis Moïse retournait au camp, mais son assistant Josué, fils de Noun, un jeune homme, ne sortait pas de la tente[b].
  rationale: La seule révision nécessaire remplace une expression française moins naturelle par « ne sortait pas de la tente », qui conserve l’idée hébraïque de ne pas s’en éloigner. La note b reçoit la majuscule usuelle dans l’appellation « tente de la Rencontre ».
