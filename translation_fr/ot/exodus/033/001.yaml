source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוָ֤ה אֶל מֹשֶׁה֙ לֵ֣ךְ עֲלֵ֣ה מִ/זֶּ֔ה אַתָּ֣ה וְ/הָ/עָ֔ם אֲשֶׁ֥ר הֶֽעֱלִ֖יתָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֶל הָ/אָ֗רֶץ אֲשֶׁ֣ר נִ֠שְׁבַּעְתִּי לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לֵ/אמֹ֔ר לְ/זַרְעֲ/ךָ֖ אֶתְּנֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/001.yaml
  text: Then Yahweh said to Moses[a], “Go up from here, you and the people whom you brought up from the land of Egypt, to the land that I swore to Abraham, to Isaac, and to Jacob, saying[b], ‘I will give it to your offspring.’”
translation:
  language: fr
  text: 'Puis Yahweh dit à Moïse[a] : « Pars, monte d’ici, toi et le peuple que tu as fait monter du pays d’Égypte, vers le pays au sujet duquel j’ai juré à Abraham, à Isaac et à Jacob, en disant : “Je le donnerai à ta descendance[b].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: alternative_reading
  - marker: b
    text: Ou « postérité ». Le mot hébreu est un singulier collectif pouvant désigner la descendance ou les descendants.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Puis … dit
  rationale: Le waw narratif fait progresser le récit. « Puis … dit » constitue une introduction naturelle au discours direct en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: לֵךְ עֲלֵה מִזֶּה
  choice: Pars, monte d’ici
  rationale: Les deux impératifs hébreux sont conservés afin d’exprimer à la fois le départ et la montée, sans les fondre en une seule idée.
- source_word: אַתָּה וְהָעָם
  choice: toi et le peuple
  rationale: Cette formulation suit directement l’hébreu, qui emploie l’article défini sans démonstratif.
- source_word: אֲשֶׁר הֶעֱלִיתָ
  choice: que tu as fait monter
  rationale: Le hifil de עלה exprime ici l’action de faire monter ou d’amener. Cette traduction maintient en outre le lien verbal avec l’ordre « monte ».
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: du pays d’Égypte
  rationale: Formulation idiomatique en français qui conserve l’idée de provenance.
- source_word: אֶל הָאָרֶץ
  choice: vers le pays
  rationale: « Vers » restitue clairement la direction indiquée par אֶל et s’intègre naturellement à la phrase.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי
  choice: que j’ai juré de donner
  rationale: Le complément « de donner » est tiré du contenu explicite de l’engagement qui suit. Cette légère restructuration évite en français l’ambiguïté de « le pays que j’ai juré à Abraham ».
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: à Abraham, à Isaac et à Jacob
  rationale: La répétition de « à » reflète la cadence formelle de l’énumération hébraïque.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Rendu transparent de la formule qui introduit le contenu de l’engagement juré.
- source_word: לְזַרְעֲךָ
  choice: à ta descendance
  rationale: « Descendance » est naturel en français moderne et peut désigner collectivement les descendants, comme le singulier collectif hébreu זרע.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, nom personnel du Dieu d’Israël. « Yahweh » le représente directement, tandis que « le SEIGNEUR » relève de la substitution traditionnelle par un titre.
- issue: Responsabilité attribuée à Moïse dans אֲשֶׁר הֶעֱלִיתָ
  choice: que tu as fait monter
  alternative: que tu as conduit hors du pays d’Égypte
  rationale: Le choix conserve l’attribution frappante faite à Moïse et le lien lexical avec « monte », sans l’atténuer ni la reformuler théologiquement.
- issue: Portée collective de זרע
  choice: descendance
  alternative: postérité / semence
  rationale: Le terme hébreu est grammaticalement singulier mais collectivement ouvert. « Descendance » préserve cette portée sans imposer ici une lecture exclusivement individuelle ou plurielle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la solennité de l’ordre et de la promesse, tout en évitant une tournure française ambiguë pour le serment. Les deux impératifs « Pars, monte » sont maintenus afin de respecter la forme expressive de l’hébreu.
