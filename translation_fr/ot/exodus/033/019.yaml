source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֲנִ֨י אַעֲבִ֤יר כָּל טוּבִ/י֙ עַל פָּנֶ֔י/ךָ וְ/קָרָ֧אתִֽי בְ/שֵׁ֛ם יְהוָ֖ה לְ/פָנֶ֑י/ךָ וְ/חַנֹּתִי֙ אֶת אֲשֶׁ֣ר אָחֹ֔ן וְ/רִחַמְתִּ֖י אֶת אֲשֶׁ֥ר אֲרַחֵֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/019.yaml
  text: And he said[a], “I myself will make all my goodness pass before you, and I will proclaim the name of Yahweh before you. And I will be gracious to whom I will be gracious, and I will show mercy to whom I will show mercy.”
translation:
  language: fr
  text: 'Il dit : « Moi-même, je ferai passer devant toi toute ma bonté et je proclamerai devant toi le nom de Yahweh. Je ferai grâce à qui je ferai grâce, et j’aurai compassion de qui j’aurai compassion.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et je ferai miséricorde à qui je ferai miséricorde ».'
    reason: Alternative lexicale pour רחם, qui peut exprimer la compassion ou la miséricorde.
lexical_decisions:
- source_word: אֲנִי אַעֲבִיר
  choice: Moi-même, je ferai passer
  rationale: Le pronom explicite אֲנִי souligne le sujet, rendu par « Moi-même ». Le hiphil de עבר est causatif, d’où « je ferai passer ».
- source_word: כָּל טוּבִי
  choice: toute ma bonté
  rationale: טוּב désigne ici la bonté divine manifestée dans l’aut révélation et la bienveillance, sans la réduire à la beauté ou aux bienfaits matériels.
- source_word: עַל־פָּנֶיךָ
  choice: devant toi
  rationale: Cette formulation idiomatique conserve le sens spatial de la manifestation devant Moïse.
- source_word: וְקָרָאתִי בְשֵׁם יְהוָה
  choice: je proclamerai ... le nom de Yahweh
  rationale: Dans ce contexte, קרא בשם exprime la proclamation du nom et du caractère divins, plutôt qu’une invocation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom personnel divin plutôt que de lui substituer un titre.
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: Le choix maintient la répétition et la dimension concrète de la présence devant Moïse.
- source_word: וְחַנֹּתִי אֶת אֲשֶׁר אָחֹן
  choice: Je ferai grâce à qui je ferai grâce
  rationale: La répétition du verbe français reproduit la construction hébraïque de même racine et son insistance.
- source_word: וְרִחַמְתִּי אֶת אֲשֶׁר אֲרַחֵם
  choice: j’aurai compassion de qui j’aurai compassion
  rationale: רחם exprime la compassion ou la miséricorde. « Avoir compassion de » est naturel en français et permet de conserver exactement la répétition emphatique.
theological_decisions:
- issue: Déclaration divine concernant la grâce et la compassion
  choice: Conserver les formulations répétées à la première personne sans les atténuer ni les systématiser.
  alternative: Paraphraser en principe général de bonté divine, ou employer une formulation plus déterministe inspirée de débats théologiques ultérieurs.
  rationale: L’hébreu affirme la liberté divine par une répétition emphatique. La traduction maintient cette tension sans trancher des débats doctrinaux postérieurs.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve les répétitions rhétoriques de l’hébreu. « Moi-même » marque l’emphase du pronom explicite sans introduire l’exclusivité de « moi seul ».
