  text: וַ/יֹּאמַ֑ר הַרְאֵ֥/נִי נָ֖א אֶת כְּבֹדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/018.yaml
  text: Then he said[a], “Please show me your glory.”
translation:
  language: fr
  text: 'Puis il dit : « Je t’en prie, montre-moi ta gloire.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fais-moi voir ta splendeur ». Le verbe hébreu signifie littéralement « fais-moi voir », et « gloire » peut aussi désigner une splendeur ou un honneur qui se manifeste.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Puis il dit
  rationale: Le waw consécutif fait progresser le récit. « Puis il dit » en rend naturellement la succession en français moderne.
- source_word: הַרְאֵנִי
  choice: montre-moi
  rationale: L’impératif hiphil de ראה avec suffixe de première personne signifie littéralement « fais-moi voir ». « Montre-moi » exprime avec naturel cette valeur causative.
- source_word: נָא
  choice: Je t’en prie
  rationale: La particule נָא marque ici une demande insistante ou courtoise. « Je t’en prie » convient à la solennité de l’échange sans être archaïque.
- source_word: אֶת
  choice: '[marque de l’objet direct, non traduite]'
  rationale: אֶת introduit l’objet direct défini et ne demande aucun équivalent lexical distinct en français.
- source_word: כְּבֹדֶךָ
  choice: ta gloire
  rationale: כָּבוֹד peut désigner la gloire, l’honneur ou la splendeur manifestée. Dans ce contexte, « ta gloire » conserve l’étendue du terme sans réduire la demande de Moïse à un seul aspect visible.
theological_decisions:
- issue: Sens de « ta gloire » dans la demande de Moïse
  choice: ta gloire
  alternative: ta splendeur ; la plénitude de ta présence
  rationale: L’hébreu ne précise pas si Moïse demande à voir un rayonnement visible, la majesté divine ou une manifestation de la présence de Dieu. « Ta gloire » préserve cette amplitude et cette tension théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe singulière de l’hébreu. La formulation reste concise et solennelle, sans surinterpréter la nature de la gloire demandée.
