  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֗ה כְּ/בֹ֤א מֹשֶׁה֙ הָ/אֹ֔הֱלָ/ה יֵרֵד֙ עַמּ֣וּד הֶֽ/עָנָ֔ן וְ/עָמַ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וְ/דִבֶּ֖ר עִם מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/009.yaml
  text: And whenever Moses entered the tent[a], the pillar of cloud would descend and stand at the entrance of the tent, and he would speak with Moses.
translation:
  language: fr
  text: Chaque fois que Moïse entrait dans la tente, la colonne de nuée descendait et se tenait à l’entrée de la tente, et il parlait avec Moïse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus explicite : « et le SEIGNEUR parlait avec Moïse ». En hébreu, le sujet de ce verbe reste implicite, mais le contexte l’identifie comme étant le SEIGNEUR.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כְּבֹא
  choice: Chaque fois que … entrait
  rationale: La construction introduit ici une circonstance habituelle et répétée dans le récit. « Chaque fois que » rend naturellement cette valeur itérative en français.
- source_word: הָאֹהֱלָה / הָאֹהֶל
  choice: dans la tente / de la tente
  rationale: L’hébreu porte simplement « la tente » dans ce verset. Le contexte l’a déjà identifiée; il n’est donc pas nécessaire d’ajouter « de la Rencontre » ni d’employer une majuscule interprétative.
- source_word: יֵרֵד
  choice: descendait
  rationale: L’inaccompli s’inscrit dans la scène habituelle introduite par וְהָיָה כְּבֹא; l’imparfait français exprime clairement cette action répétée.
- source_word: עַמּוּד הֶעָנָן
  choice: la colonne de nuée
  rationale: Cette formulation française traditionnelle et transparente conserve l’image concrète de la construction hébraïque.
- source_word: וְעָמַד
  choice: et se tenait
  rationale: Le verbe décrit la colonne qui demeure dressée ou en position à l’entrée. « Se tenait » est naturel en français et maintient la valeur habituelle de la séquence.
- source_word: פֶּתַח הָאֹהֶל
  choice: à l’entrée de la tente
  rationale: « Entrée » exprime naturellement le sens spatial de פתח sans surdéterminer s’il s’agit d’une porte ou d’une simple ouverture.
- source_word: וְדִבֶּר
  choice: et il parlait
  rationale: Le verbe hébreu est au masculin singulier, mais son sujet n’est pas exprimé. Le pronom « il » conserve cette forme implicite plutôt que d’ajouter directement « le SEIGNEUR » dans le texte.
- source_word: עִם מֹשֶׁה
  choice: avec Moïse
  rationale: La préposition עִם signifie normalement « avec » et souligne ici l’échange personnel plutôt qu’une communication seulement dirigée vers Moïse.
theological_decisions:
- issue: Sujet implicite de « et il parlait avec Moïse »
  choice: Conserver le sujet masculin singulier implicite au moyen de « il », avec une note indiquant que le contexte désigne le SEIGNEUR.
  alternative: 'Expliciter dans le texte : « et le SEIGNEUR parlait avec Moïse »; ou, de façon moins probable, rattacher grammaticalement l’action à la colonne de nuée.'
  rationale: Le contexte identifie la présence divine comme celle qui parle, mais le texte hébreu ne nomme pas le sujet de ce verbe. La traduction conserve cette discrétion syntaxique et évite de résoudre silencieusement l’ambiguïté.
translation_notes:
  register: Français international moderne, simple et digne. L’imparfait et « Chaque fois que » rendent la répétition coutumière. La formulation reste proche de l’ordre narratif hébreu tout en étant idiomatique en français.
