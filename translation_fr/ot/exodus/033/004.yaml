  yaml_path: translation/ot/exodus/033/004.yaml
  text: When the people heard this bad news[a], they mourned[b], and no man put on his ornaments.
translation:
  language: fr
  text: Quand le peuple entendit cette pénible nouvelle[a], il prit le deuil, et personne ne mit ses parures[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cette parole mauvaise » ou « cette pénible parole ». Le mot hébreu peut aussi signifier « affaire » ou « message ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ses bijoux » ou « ses ornements ». Le terme hébreu désigne de manière générale ce qui sert à se parer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע הָעָם
  choice: Quand le peuple entendit
  rationale: Le singulier hébreu s’accorde avec le nom collectif « peuple ». Le passé simple convient au registre narratif français et « entendre » exprime naturellement la réception de l’annonce.
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: cette pénible nouvelle
  rationale: דָּבָר peut désigner une parole, une affaire ou un message. Ici, l’expression renvoie à l’annonce divine précédente ; « nouvelle » est idiomatique, tandis que « pénible » rend רַע sans lui imposer ici une qualification morale.
- source_word: וַיִּתְאַבָּלוּ
  choice: il prit le deuil
  rationale: Le hitpael de אבל désigne l’entrée dans le deuil, et non seulement un sentiment de tristesse. Le pronom singulier reprend naturellement le collectif « peuple ».
- source_word: וְלֹא שָׁתוּ אִישׁ
  choice: et personne ne mit
  rationale: 'אִישׁ a ici une valeur distributive : pas un seul individu. « Personne ne mit » est naturel en français et conserve cette individualisation.'
- source_word: עֶדְיוֹ עָלָיו
  choice: ses parures
  rationale: עֲדִי désigne largement des objets ou éléments d’ornement. Le possessif français et le verbe « mettre » rendent idiomatiquement le suffixe distributif et עָלָיו, littéralement « sur lui ».
