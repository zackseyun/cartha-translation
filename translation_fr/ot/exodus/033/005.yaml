source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֱמֹ֤ר אֶל בְּנֵֽי יִשְׂרָאֵל֙ אַתֶּ֣ם עַם קְשֵׁה עֹ֔רֶף רֶ֧גַע אֶחָ֛ד אֶֽעֱלֶ֥ה בְ/קִרְבְּ/ךָ֖ וְ/כִלִּיתִ֑י/ךָ וְ/עַתָּ֗ה הוֹרֵ֤ד עֶדְיְ/ךָ֙ מֵֽ/עָלֶ֔י/ךָ וְ/אֵדְעָ֖ה מָ֥ה אֶֽעֱשֶׂה לָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/005.yaml
  text: And Yahweh said to Moses[a], “Say to the sons of Israel, ‘You are a stiff-necked people. In a single moment, if I were to go up in your midst, I would consume you. So now, take off your ornaments from upon you[e][d][c][b], and I will know what I should do with you.’”
translation:
  language: fr
  text: 'Yahweh dit à Moïse : « Dis aux Israélites : “Vous êtes un peuple à la nuque raide. Si je montais ne serait-ce qu’un instant au milieu de toi, je t’anéantirais. Maintenant donc, ôte les parures que tu portes, et je saurai ce que je dois faire de toi.” »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie le pluriel au début de l’adresse (« vous êtes »), puis le singulier collectif pour parler à Israël comme à un seul peuple (« au milieu de toi », « je t’anéantirais », « de toi »).
    reason: grammatical_clarification
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de lui substituer un titre.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Rend naturellement en français moderne l’expression collective littérale « les fils d’Israël ».
- source_word: עַם קְשֵׁה עֹרֶף
  choice: un peuple à la nuque raide
  rationale: Conserve la métaphore hébraïque de l’obstination, tout en restant intelligible.
- source_word: רֶגַע אֶחָד אֶעֱלֶה בְקִרְבְּךָ
  choice: Si je montais ne serait-ce qu’un instant au milieu de toi
  rationale: Rattache la brève durée à la montée de Yahweh, conserve « monter » et le langage de la présence au milieu du peuple.
- source_word: וְכִלִּיתִיךָ
  choice: je t’anéantirais
  rationale: Exprime l’idée de mener entièrement à son terme, ici par un jugement destructeur.
- source_word: הוֹרֵד עֶדְיְךָ מֵעָלֶיךָ
  choice: ôte les parures que tu portes
  rationale: Rend idiomatiquement l’ordre d’enlever l’ornementation portée sur soi.
- source_word: וְאֵדְעָה מָה אֶעֱשֶׂה לָּךְ
  choice: et je saurai ce que je dois faire de toi
  rationale: Préserve le verbe « savoir » et l’indétermination relative de l’action envisagée.
theological_decisions:
- issue: Langage anthropomorphique relatif au savoir divin
  choice: et je saurai
  alternative: afin que je décide
  rationale: Le texte hébreu emploie explicitement le verbe « savoir »; le conserver maintient la tension théologique sans la réduire à une simple prise de décision.
- issue: Suffixes singuliers désignant collectivement Israël
  choice: Maintien du singulier dans les paroles adressées au peuple
  alternative: Uniformiser au pluriel français
  rationale: L’hébreu passe du pluriel au singulier en considérant Israël comme un corps collectif; le français peut ici préserver ce trait de manière compréhensible.
translation_notes:
  register: Français international moderne, digne et direct. La formulation conserve la métaphore de la nuque raide, le verbe de mouvement « monter », le singulier collectif et l’expression anthropomorphique « je saurai ».
