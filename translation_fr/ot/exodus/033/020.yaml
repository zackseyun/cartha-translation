language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לֹ֥א תוּכַ֖ל לִ/רְאֹ֣ת אֶת פָּנָ֑/י כִּ֛י לֹֽא יִרְאַ֥/נִי הָ/אָדָ֖ם וָ/חָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/020.yaml
  text: But he said[a], “You cannot see my face[b], for man shall not see me and live.”
translation:
  language: fr
  text: 'Mais il dit : « Tu ne peux pas voir mon visage[a], car aucun être humain[b] ne peut me voir et rester en vie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma présence ». L’hébreu dit littéralement « mon visage ».
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque désigne ici tout être humain, c’est-à-dire l’humanité en général.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mais il dit
  rationale: Le waw consécutif fait avancer le récit, tandis que « Mais » exprime naturellement le contraste avec la demande de Moïse au verset précédent.
- source_word: לֹא תוּכַל
  choice: Tu ne peux pas
  rationale: יכל exprime ici l’incapacité, non une interdiction.
- source_word: לִרְאֹת
  choice: voir
  rationale: ראה désigne simplement la perception visuelle dans ce contexte.
- source_word: אֶת־פָּנַי
  choice: mon visage
  rationale: פָּנִים signifie littéralement « visage ». Cette image concrète est conservée sans être remplacée dans le texte par l’interprétation « présence ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’impossibilité énoncée.
- source_word: לֹא יִרְאַנִי
  choice: ne peut me voir
  rationale: L’imparfait formule ici une vérité générale. En français actuel, « ne peut » rend clairement cette portée gnomique dans le contexte.
- source_word: הָאָדָם
  choice: aucun être humain
  rationale: Le nom singulier a une valeur générique et désigne tout membre de l’humanité. Cette formulation française naturelle évite que « l’homme » soit compris comme exclusivement masculin.
- source_word: וָחָי
  choice: et rester en vie
  rationale: 'La forme exprime le résultat : voir Dieu et continuer à vivre. « Rester en vie » explicite naturellement cette continuité en français.'
theological_decisions:
- issue: Langage anthropomorphique dans « mon visage »
  choice: Conserver « mon visage » dans le texte principal
  alternative: ma présence
  rationale: L’hébreu emploie une image corporelle concrète. La traduction la préserve plutôt que de la résoudre en abstraction interprétative; l’autre possibilité est signalée en note.
- issue: Portée générique de הָאָדָם
  choice: aucun être humain
  alternative: l’homme; l’humanité
  rationale: Le singulier hébreu est générique. « Aucun être humain » communique directement que l’affirmation concerne toute personne, sans restreindre son application aux hommes de sexe masculin.
- issue: Rapport entre voir Dieu et vivre
  choice: ne peut me voir et rester en vie
  alternative: ne me verra pas et vivra
  rationale: La formulation française exprime une impossibilité générale et sa conséquence sans préciser davantage la nature théologique de cette impossibilité.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement correspond au dialogue singulier avec Moïse. La formulation conserve l’image concrète du visage tout en rendant explicitement la portée universelle de הָאָדָם.
