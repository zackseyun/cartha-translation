id: EXO.33.2
reference: Exodus 33:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/שָׁלַחְתִּ֥י לְ/פָנֶ֖י/ךָ מַלְאָ֑ךְ וְ/גֵֽרַשְׁתִּ֗י אֶת הַֽ/כְּנַעֲנִי֙ הָֽ/אֱמֹרִ֔י וְ/הַֽ/חִתִּי֙ וְ/הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/002.yaml
  text: And I will send an angel before you[a], and I will drive out the Canaanite, the Amorite, the Hittite, the Perizzite, the Hivite, and the Jebusite.
translation:
  language: fr
  text: J’enverrai devant toi un ange[a], et je chasserai le Cananéen, l’Amoréen, le Hittite, le Perizzite, le Hivvite et le Jébusien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un messager ». Le mot hébreu מַלְאָךְ peut désigner un messager humain ou céleste; ici, le contexte favorise « ange ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: J’enverrai
  rationale: Dans cette parole divine, le qatal précédé de וְ exprime ici une action future. Le futur français restitue naturellement la valeur de promesse.
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: L’expression hébraïque signifie « devant toi » ou « en avant de toi ». « Devant toi » reste proche de la forme source tout en étant naturel en français.
- source_word: מַלְאָךְ
  choice: un ange
  rationale: Le nom peut désigner un messager humain ou céleste. Dans ce contexte de conduite divine, « ange » convient, sans préciser davantage son identité; la note conserve l’alternative lexicale.
- source_word: וְגֵרַשְׁתִּי
  choice: et je chasserai
  rationale: Le verbe גרשׁ désigne l’action de chasser ou d’expulser des habitants. « Chasser » est clair et idiomatique dans ce contexte.
- source_word: הַכְּנַעֲנִי ... וְהַיְבוּסִי
  choice: le Cananéen, l’Amoréen, le Hittite, le Perizzite, le Hivvite et le Jébusien
  rationale: Les ethnonymes hébreux sont des singuliers collectifs. Le singulier est conservé en français afin de respecter la structure de la liste source.
theological_decisions:
- issue: Identité de מַלְאָךְ dans ce verset
  choice: un ange
  alternative: un messager; l’ange
  rationale: Le verset ne précise ni qu’il s’agit de « l’ange de l’Éternel » ni l’identité exacte de cet envoyé. L’indéfini évite d’imposer une identification théologique absente du texte, tandis que la note signale l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, clair et digne. Le futur simple rend la promesse divine. Les noms de peuples suivent des graphies françaises bibliques largement reconnues et conservent le singulier collectif de l’hébreu.
