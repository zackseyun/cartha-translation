  text: And the LORD said, “Look, there is a place by me, and you shall stand on the rock.”
translation:
  language: fr
  text: 'Le SEIGNEUR dit : « Voici un endroit près de moi. Tu te tiendras sur le rocher. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme selon la convention française courante, en petites capitales, sans introduire une vocalisation incertaine dans le corps du texte.
- source_word: הִנֵּה
  choice: Voici
  rationale: Marque naturellement l’acte de désigner un lieu présent, avec un registre digne et courant.
- source_word: מָקוֹם אִתִּי
  choice: un endroit près de moi
  rationale: Dans ce contexte spatial, « près de moi » exprime naturellement la proximité indiquée par אִתִּי, sans donner à entendre que le lieu appartient à Dieu.
- source_word: וְנִצַּבְתָּ
  choice: Tu te tiendras
  rationale: Conserve la valeur verbale de se placer ou de se tenir debout, ainsi que la forme à valeur injonctive ou future du contexte.
- source_word: עַל הַצּוּר
  choice: sur le rocher
  rationale: Traduction directe de la préposition עַל et du nom défini צוּר.
theological_decisions:
- issue: Représentation spatiale de la proximité avec Dieu
  choice: près de moi
  alternative: avec moi / à côté de moi
  rationale: Préserve l’expression spatiale du récit sans expliquer métaphysiquement comment un lieu peut être « près » de Dieu.
- issue: Force modale de וְנִצַּבְתָּ
  choice: Tu te tiendras
  alternative: Tiens-toi
  rationale: La forme peut fonctionner comme une instruction dans la séquence narrative; le futur français garde toutefois la formulation hébraïque et son ton direct sans la transformer explicitement en impératif.
translation_notes:
  register: Français moderne international, sobre et solennel. La phrase est scindée après l’annonce du lieu afin d’éviter une coordination lourde, tout en conservant l’enchaînement du texte hébreu.
