  variant: modern international French
source:
  edition: WLC
  text: וּ/בַ/מֶּ֣ה יִוָּדַ֣ע אֵפ֗וֹא כִּֽי מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲנִ֣י וְ/עַמֶּ֔/ךָ הֲ/ל֖וֹא בְּ/לֶכְתְּ/ךָ֣ עִמָּ֑/נוּ וְ/נִפְלֵ֨ינוּ֙ אֲנִ֣י וְ/עַמְּ/ךָ֔ מִ/כָּ֨ל הָ/עָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/016.yaml
  text: For how then will it be known that I have found favor in your sight[a], I and your people? Is it not by your going with us, so that I and your people are distinguished from every people who are on the face of the earth?
translation:
  language: fr
  text: Comment donc saura-t-on que j’ai trouvé grâce à tes yeux, moi ainsi que ton peuple ? N’est-ce pas parce que tu iras avec nous, de sorte que nous serons distingués[a], moi et ton peuple, de tous les peuples qui sont à la surface de la terre ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mis à part » ou « rendu distinct ». Le verbe hébreu peut évoquer le fait d’être marqué comme extraordinaire ou séparé des autres.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמֶּה יִוָּדַע אֵפוֹא
  choice: Comment donc saura-t-on
  rationale: La formulation conserve le lien argumentatif, la question portant sur le moyen par lequel la faveur divine sera reconnue, ainsi que la valeur inférentielle de אֵפוֹא.
- source_word: כִּי מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: que j’ai trouvé grâce à tes yeux
  rationale: Cette expression française naturelle dans un registre biblique digne préserve l’image hébraïque des « yeux » et désigne l’accueil favorable de Dieu, sans charger ici « grâce » d’un sens doctrinal technique.
- source_word: אֲנִי וְעַמֶּךָ
  choice: moi ainsi que ton peuple / moi et ton peuple
  rationale: La répétition explicite du couple formé par Moïse et le peuple est maintenue. « Ainsi que » fluidifie la première occurrence, tandis que la seconde suit de plus près l’apposition hébraïque.
- source_word: הֲלוֹא בְּלֶכְתְּךָ עִמָּנוּ
  choice: N’est-ce pas parce que tu iras avec nous
  rationale: « N’est-ce pas » garde la force de la question rhétorique, et « parce que » exprime naturellement le moyen ou le fondement par lequel la faveur de Dieu devient manifeste.
- source_word: וְנִפְלֵינוּ
  choice: de sorte que nous serons distingués
  rationale: Le niphal de פלא indique ici que Moïse et le peuple seront rendus remarquables ou distincts des autres. La tournure résultative relie cette distinction à la présence de Dieu sans préciser davantage son mécanisme.
- source_word: מִכָּל הָעָם
  choice: de tous les peuples
  rationale: Le singulier collectif hébreu reçoit ici un rendu distributif naturel en français, puisqu’il s’agit de la distinction d’Israël par rapport à l’ensemble des autres peuples.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: qui sont à la surface de la terre
  rationale: Cette expression rend l’idiome spatial hébreu et sa portée universelle sans réduire אֲדָמָה au seul sol local.
theological_decisions:
- issue: Fondement de la distinction d’Israël
  choice: La présence de Dieu, exprimée par le fait qu’il va avec Moïse et le peuple, est présentée comme ce qui les distingue des autres peuples.
  alternative: Faire de la loi, du territoire ou de l’identité ethnique le fondement principal de cette distinction.
  rationale: Le verset rattache explicitement la reconnaissance de la faveur divine et la distinction du peuple au fait que Dieu va avec eux. La traduction conserve ce lien sans introduire un autre fondement.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe interrogative et la répétition de « moi et ton peuple » préservent l’insistance de Moïse. « Trouvé grâce à tes yeux » garde l’idiome relationnel hébreu, tandis que « distingués » laisse ouverte la nuance entre caractère remarquable et mise à part.
