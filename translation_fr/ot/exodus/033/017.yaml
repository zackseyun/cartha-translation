base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/017.yaml
  text: And Yahweh said to Moses[a], “I will also do this thing that you have spoken, because you have found favor in my eyes[b], and I know you by name.”
translation:
  language: fr
  text: 'Yahweh dit à Moïse : « Je ferai aussi cette chose[a] dont tu as parlé, car tu as trouvé grâce à mes yeux[b] et je te connais par ton nom. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette affaire » ou « cette parole ».
    reason: lexical_alternative
  - marker: b
    text: Expression hébraïque signifiant que Moïse bénéficie du regard favorable de Dieu.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme, conformément à l’usage du projet.
- source_word: גַּם
  choice: aussi
  rationale: 'La particule a ici une valeur additive : Dieu accorde cette demande en plus de ce qui précède.'
- source_word: הַדָּבָר הַזֶּה
  choice: cette chose
  rationale: Conserve la portée large de דָּבָר, qui peut désigner une chose, une affaire ou une parole, tout en renvoyant à la demande que Moïse vient de formuler.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: dont tu as parlé
  rationale: Rend naturellement en français le lien explicite avec les paroles prononcées par Moïse, sans transformer directement celles-ci en « demande ».
- source_word: אֶעֱשֶׂה
  choice: Je ferai
  rationale: Le verbe courant עשה signifie ici que Yahweh accomplira ce dont Moïse a parlé.
- source_word: מָצָאתָ חֵן בְּעֵינַי
  choice: tu as trouvé grâce à mes yeux
  rationale: Préserve l’image de l’expression hébraïque tout en employant une formulation française traditionnelle et compréhensible.
- source_word: וָאֵדָעֲךָ
  choice: et je te connais
  rationale: Exprime la connaissance personnelle et relationnelle de Moïse par Dieu ; le présent convient naturellement au contexte.
- source_word: בְּשֵׁם
  choice: par ton nom
  rationale: Restitue l’idée d’une connaissance personnelle, précise et distinctive.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte directement le tétragramme ; sa transcription préserve le nom personnel d’alliance sans le remplacer par un titre.
- issue: Portée de « je te connais par ton nom »
  choice: Conserver la formulation relationnelle sans l’expliciter davantage
  alternative: « je t’ai choisi personnellement »
  rationale: Le texte affirme une connaissance personnelle particulière, mais ne précise pas ici à lui seul toutes ses implications théologiques ; une paraphrase comme « choisi » résoudrait indûment cette nuance.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe garde la répétition sobre et la portée personnelle de la déclaration divine. Les marqueurs [a] et [b] sont placés immédiatement après les expressions qu’ils expliquent.
