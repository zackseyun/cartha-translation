  yaml_path: translation/ot/exodus/033/015.yaml
  text: Then he said to him[a], “If your presence does not go, do not bring us up from here.”
translation:
  language: fr
  text: 'Il lui dit : « Si ta présence[a] ne nous accompagne pas, ne nous fais pas monter d’ici. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ta face ». En hébreu, la « face » désigne souvent la présence personnelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Il lui dit
  rationale: Le waw consécutif fait avancer le récit; en français narratif, le passé simple rend naturellement cette progression. אֵלָיו indique que la parole est adressée à l’interlocuteur déjà mentionné.
- source_word: אִם אֵין
  choice: Si ... ne ... pas
  rationale: La particule conditionnelle avec la négation existentielle introduit une condition réelle, exprimée idiomatiquement en français par « si ... ne ... pas ».
- source_word: פָּנֶיךָ
  choice: ta présence
  rationale: Le nom signifie littéralement « ta face », mais désigne ici la présence personnelle de Dieu. « Ta présence » restitue clairement l’idiome tout en conservant l’image hébraïque en note.
- source_word: הֹלְכִים
  choice: ne nous accompagne pas
  rationale: Le participe exprime le fait d’aller avec le peuple. Le complément « nous », implicite dans le contexte immédiat, permet un français naturel et relationnel sans changer le sens.
- source_word: אַל תַּעֲלֵנוּ
  choice: ne nous fais pas partir
  rationale: La négation אַל avec la forme verbale exprime une demande pressante. Le hiphil de עלה est causatif, littéralement « ne nous fais pas monter »; ici, il s’agit de faire quitter au peuple son emplacement pour poursuivre la route.
- source_word: מִזֶּה
  choice: d’ici
  rationale: Le démonstratif précédé de מִן désigne le lieu où se trouvent les interlocuteurs; « d’ici » est la formulation française naturelle.
theological_decisions:
- issue: Sens de פָּנֶיךָ appliqué à Dieu
  choice: ta présence
  alternative: ta face
  rationale: Dans ce contexte, Moïse parle de la présence personnelle de Dieu accompagnant Israël. La traduction principale communique l’idiome, tandis que la note maintient la transparence sur l’image concrète du texte hébreu.
- issue: Explicitation de l’accompagnement
  choice: ne nous accompagne pas
  alternative: ne va pas
  rationale: Le verbe hébreu signifie « aller », mais le contexte porte sur la présence de Dieu allant avec Israël. « Nous accompagne » exprime naturellement en français cette relation sans trancher au-delà du contexte.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme marqué. « Ne nous fais pas partir d’ici » privilégie l’intelligibilité contextuelle; la nuance causative du verbe hébreu est conservée.
