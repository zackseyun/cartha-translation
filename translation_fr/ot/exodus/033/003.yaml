base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/003.yaml
  text: to a land flowing with milk and honey[a]. For I will not go up in your midst, because you are a stiff-necked people[b], lest I consume you on the way.
translation:
  language: fr
  text: vers un pays où coulent le lait et le miel. Car je ne monterai pas au milieu de toi[a], puisque tu es un peuple à la nuque raide, de peur que je ne te détruise[b] en chemin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi vous » ou « avec vous ». Le singulier « toi » désigne Israël collectivement.
    reason: lexical_alternative
  - marker: b
    text: Ou « je ne te consume » ou « je ne t’anéantisse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל אֶרֶץ
  choice: vers un pays
  rationale: La préposition אֶל exprime la direction. L’absence d’article se rend naturellement par « un pays », même si le contexte identifie déjà le pays promis.
- source_word: זָבַת חָלָב וּדְבָשׁ
  choice: ruisselant de lait et de miel
  rationale: Cette formulation française conserve la métaphore hébraïque d’une abondance qui s’écoule et reste naturelle dans un registre biblique actuel.
- source_word: כִּי לֹא אֶעֱלֶה
  choice: Car je ne monterai pas
  rationale: כִּי introduit ici l’explication de l’envoi d’un messager évoqué dans le contexte précédent. « Monter » conserve le verbe עלה et son emploi traditionnel pour le trajet vers le pays.
- source_word: בְּקִרְבְּךָ
  choice: au milieu de toi
  rationale: Le suffixe singulier s’adresse collectivement à Israël. Cette traduction préserve la nuance spatiale et relationnelle de la présence divine au sein du peuple.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: un peuple à la nuque raide
  rationale: La formulation conserve l’image hébraïque de la nuque qui refuse de plier, plutôt que de la réduire au seul adjectif « obstiné ».
- source_word: פֶּן
  choice: de peur que
  rationale: פֶּן introduit une conséquence redoutée ou évitée. « De peur que » l’exprime clairement en français moderne.
- source_word: אֲכֶלְךָ
  choice: je ne t’anéantisse
  rationale: Le piel de כלה signifie mener à son terme, faire disparaître ou détruire. « Anéantir » rend la gravité du jugement sans préciser un moyen que le texte ne donne pas.
- source_word: בַּדָּרֶךְ
  choice: en chemin
  rationale: Expression française idiomatique et concise pour le trajet vers le pays.
theological_decisions:
- issue: Déclaration concernant la présence divine
  choice: je ne monterai pas au milieu de toi
  alternative: je ne monterai pas parmi vous / avec vous
  rationale: « Au milieu de toi » maintient la tension entre la sainte présence de Dieu au sein d’Israël et le danger qu’elle représente pour un peuple rebelle, sans réduire la phrase à la simple idée d’accompagnement.
- issue: Gravité du jugement exprimé par אֲכֶלְךָ
  choice: je ne t’anéantisse
  alternative: je ne te détruise / je ne te consume
  rationale: Le choix exprime la possibilité que le peuple soit entièrement supprimé au cours du trajet. Il reste fidèle à l’étendue sémantique du verbe sans imposer une image précise du jugement.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier est conservé parce que l’hébreu s’adresse à Israël comme à une entité collective. L’image « à la nuque raide » est maintenue pour préserver la force métaphorique du texte.
