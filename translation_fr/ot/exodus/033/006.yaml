  yaml_path: translation/ot/exodus/033/006.yaml
  text: So the sons of Israel stripped themselves of their ornaments from Mount Horeb onward[a].
translation:
  language: fr
  text: Les Israélites se dépouillèrent donc de leurs parures à partir du mont Horeb[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les Israélites ôtèrent leurs parures au mont Horeb. » L’expression hébraïque peut désigner soit le lieu où ils les ôtèrent, soit le point à partir duquel ils cessèrent de les porter.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְנַצְּלוּ
  choice: se dépouillèrent
  rationale: La forme réfléchie exprime l’action d’ôter de soi ses parures. « Se dépouillèrent de » rend ce sens avec naturel et dignité, sans suggérer qu’on les leur aurait arrachées.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette formulation française courante transmet naturellement l’expression hébraïque « fils d’Israël » et désigne ici l’ensemble du peuple, sans limiter le propos aux hommes.
- source_word: עֶדְיָם
  choice: leurs parures
  rationale: עֲדִי désigne ce qui sert à se parer. « Parures » conserve une portée assez large et convient au contexte, sans préciser indûment qu’il s’agissait uniquement de bijoux.
- source_word: מֵהַר חוֹרֵב
  choice: à partir du mont Horeb
  rationale: Cette expression comprend מִן comme marquant le point à partir duquel les Israélites cessèrent de porter leurs parures. L’autre compréhension possible, celle d’un lieu où ils les ôtèrent, est conservée en note.
theological_decisions:
- issue: Portée de מִן dans מֵהַר חוֹרֵב
  choice: Point de départ à partir duquel les parures ne furent plus portées
  alternative: 'Lieu où les parures furent ôtées : « au mont Horeb »'
  rationale: La syntaxe hébraïque permet les deux lectures. Le contexte de l’ordre de ne plus porter de parures favorise légèrement la première, mais l’ambiguïté réelle est explicitement préservée en note.
translation_notes:
  register: Français international moderne, courant et digne. « Les Israélites » évite le calque moins naturel « les fils d’Israël »; « se dépouillèrent de leurs parures » conserve la valeur réfléchie du verbe et le ton solennel du récit.
