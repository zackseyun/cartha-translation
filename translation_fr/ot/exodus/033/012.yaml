source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל יְהוָ֗ה רְ֠אֵה אַתָּ֞ה אֹמֵ֤ר אֵלַ/י֙ הַ֚עַל אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/אַתָּה֙ לֹ֣א הֽוֹדַעְתַּ֔/נִי אֵ֥ת אֲשֶׁר תִּשְׁלַ֖ח עִמִּ֑/י וְ/אַתָּ֤ה אָמַ֨רְתָּ֙ יְדַעְתִּ֣י/ךָֽ בְ/שֵׁ֔ם וְ/גַם מָצָ֥אתָ חֵ֖ן בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/012.yaml
  text: Then Moses said to Yahweh[a], “See, you are saying to me, ‘Bring up this people,’ but you have not made known to me whom you will send with me. Yet you have said, ‘I know you by name[c][b], and you also have found favor in my sight.’”
translation:
  language: fr
  text: 'Alors Moïse dit à Yahweh[a] : « Vois, tu me dis : “Fais monter ce peuple”, mais tu ne m’as pas fait savoir qui tu enverras avec moi. Pourtant, tu as dit : “Je te connais par ton nom[b], et tu as aussi trouvé grâce à mes yeux[c].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh est la transcription du nom divin écrit יהוה en hébreu.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « Je te connais par ton nom » ; cette expression évoque une connaissance personnelle et favorable.'
    reason: cultural_note
  - marker: c
    text: 'Ou : « tu as aussi trouvé faveur à mes yeux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin plutôt que de lui substituer un titre.
- source_word: רְאֵה
  choice: Vois
  rationale: Conserve la forme impérative et la franchise de l’appel de Moïse; ici, le mot fonctionne aussi comme marqueur de discours.
- source_word: הַעַל אֶת הָעָם הַזֶּה
  choice: Fais monter ce peuple
  rationale: Rend le hiphil de עלה par une tournure causative et maintient la nuance directionnelle ainsi que le démonstratif singulier.
- source_word: לֹא הוֹדַעְתַּנִי
  choice: tu ne m’as pas fait savoir
  rationale: Reproduit la valeur causative du hiphil de ידע sans réduire l’expression à « tu ne m’as pas dit ».
- source_word: אֵת אֲשֶׁר תִּשְׁלַח עִמִּי
  choice: qui tu enverras avec moi
  rationale: Le relatif vise naturellement une personne, tandis que « avec moi » exprime directement l’accompagnement marqué par עִם.
- source_word: יְדַעְתִּיךָ בְשֵׁם
  choice: Je te connais par ton nom
  rationale: Préserve l’expression hébraïque de connaissance personnelle sans l’élargir en affirmation doctrinale explicite.
- source_word: מָצָאתָ חֵן בְּעֵינַי
  choice: tu as aussi trouvé grâce à mes yeux
  rationale: Conserve l’image idiomatique hébraïque; « grâce » rend naturellement חֵן dans ce contexte.
- source_word: וְאַתָּה ... לֹא ... וְאַתָּה אָמַרְתָּ
  choice: mais tu ne… Pourtant, tu as dit
  rationale: Exprime en français le contraste souligné par la répétition du pronom hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le nom propre divin; sa translittération préserve cette distinction sans lui substituer un titre.
- issue: Portée de « Je te connais par ton nom »
  choice: Maintenir l’idiome relationnel
  alternative: Je te connais personnellement; je t’ai choisi personnellement
  rationale: L’expression implique une connaissance personnelle et favorable, mais le texte ne formule pas explicitement une doctrine d’élection.
- issue: Rendu de חֵן
  choice: grâce
  alternative: faveur
  rationale: Les deux sens sont possibles. « Grâce » reste idiomatique dans « trouver grâce aux yeux de » et conserve la tension lexicale sans imposer une lecture doctrinale technique.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe conserve la progression argumentative de Moïse et les images hébraïques compréhensibles, tout en employant une ponctuation naturelle.
