source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/עֲבֹ֣ר כְּבֹדִ֔/י וְ/שַׂמְתִּ֖י/ךָ בְּ/נִקְרַ֣ת הַ/צּ֑וּר וְ/שַׂכֹּתִ֥י כַפִּ֛/י עָלֶ֖י/ךָ עַד עָבְרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/022.yaml
  text: And when my glory passes by[a], I will put you in a cleft of the rock, and I will cover you with my hand until I have passed by.
translation:
  language: fr
  text: Quand ma gloire passera, je te placerai dans une fente du rocher[a] et je te couvrirai de ma main jusqu’à ce que je sois passé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans la fente du rocher ». La construction hébraïque peut se rendre en français avec l’article indéfini ou défini devant « fente ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּעֲבֹר
  choice: Quand … passera
  rationale: La construction avec היה suivi de ב et de l’infinitif construit introduit ici la circonstance temporelle. Une proposition finie au futur est naturelle en français.
- source_word: כְּבֹדִי
  choice: ma gloire
  rationale: Dans ce contexte de manifestation divine, « gloire » rend le sens théophanique de כבוד sans le réduire à l’honneur ou à la réputation.
- source_word: וְשַׂמְתִּיךָ
  choice: je te placerai
  rationale: « Placer » exprime directement l’action de שׂים dans un registre courant et digne.
- source_word: בְּנִקְרַת הַצּוּר
  choice: dans une fente du rocher
  rationale: נִקְרָה désigne une fente ou une anfractuosité. Le syntagme construit avec le nom défini הַצּוּר permet en français un premier nom défini ou indéfini; « une fente du rocher » est naturel et concret.
- source_word: וְשַׂכֹּתִי
  choice: je te couvrirai
  rationale: Le verbe סכך évoque l’action de couvrir ou de protéger. « Couvrir » conserve l’image concrète associée à la main.
- source_word: כַּפִּי
  choice: ma main
  rationale: Bien que כף puisse désigner la paume, « ma main » est la formulation française naturelle qui préserve la métaphore corporelle sans la préciser excessivement.
- source_word: עַד עָבְרִי
  choice: jusqu’à ce que je sois passé
  rationale: עַד marque le terme de l’action protectrice; le subjonctif passé français rend clairement l’achèvement du passage à ce point du récit.
theological_decisions:
- issue: Langage anthropomorphique appliqué à Dieu (« ma main »)
  choice: Conserver l’expression concrète « ma main » dans le texte principal.
  alternative: ma protection; ma puissance
  rationale: L’hébreu emploie directement une image corporelle. La conserver respecte la force narrative de la théophanie sans la transformer en explication doctrinale abstraite ni affirmer davantage que le texte.
translation_notes:
  register: Français international moderne, clair et digne. Le futur maintient la progression du discours; l’image concrète du rocher et de la main est conservée sans paraphrase théologique.
