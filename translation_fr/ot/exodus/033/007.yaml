base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/007.yaml
  text: Moses would take the tent and pitch it for himself outside the camp[a], far from the camp, and he called it the tent of meeting[b]. And everyone seeking Yahweh would go out to the tent of meeting that was outside the camp.
translation:
  language: fr
  text: Moïse prenait la tente[a], la dressait pour lui-même hors du camp, loin du camp, et l’appelait « tente de la Rencontre ». Quiconque cherchait Yahweh se rendait[b] à la tente de la Rencontre qui se trouvait hors du camp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la tente ». Le texte ne dit pas explicitement « sa tente »; certains comprennent qu’il s’agit de la tente personnelle de Moïse ou d’une tente distincte qu’il réservait à cet usage.'
    reason: lexical_alternative
  - marker: b
    text: 'Les formes verbales hébraïques peuvent ici décrire des actions coutumières : Moïse avait l’habitude de prendre la tente, et ceux qui cherchaient Yahweh avaient l’habitude de se rendre à cette tente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקַּח … יֵצֵא
  choice: prenait … sortait
  rationale: Les formes verbales décrivent vraisemblablement des actions habituelles ou répétées; l’imparfait français exprime naturellement cette valeur.
- source_word: הָאֹהֶל
  choice: la tente
  rationale: L’hébreu porte l’article défini sans préciser explicitement qu’il s’agit de la tente personnelle de Moïse.
- source_word: וְנָטָה לוֹ
  choice: et la dressait pour lui
  rationale: Avec une tente, נטה signifie la dresser; « pour lui » conserve le pronom לוֹ sans préciser davantage l’usage ou la possession.
- source_word: הַרְחֵק מִן הַמַּחֲנֶה
  choice: loin du camp
  rationale: Cette expression souligne fortement l’éloignement déjà indiqué par « hors du camp ».
- source_word: אֹהֶל מוֹעֵד
  choice: tente de la Rencontre
  rationale: Cette formulation française établie rend le lieu de rencontre fixé, sans réduire מוֹעֵד à une simple réunion humaine.
- source_word: כָּל מְבַקֵּשׁ יְהוָה
  choice: quiconque cherchait Yahweh
  rationale: « Chercher » préserve la portée assez large du participe, qui peut comprendre la recherche de Dieu et le fait de le consulter.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
theological_decisions:
- issue: Identification de « la tente »
  choice: Laisser son identité ouverte
  alternative: Préciser « sa tente » ou une tente spécialement réservée à cet usage
  rationale: Le texte dit seulement « la tente »; il ne l’identifie pas explicitement comme la tente personnelle de Moïse ni comme le sanctuaire décrit ailleurs.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: La translittération conserve ici le nom propre employé dans le texte hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. L’imparfait rend l’aspect coutumier sans alourdir le texte par « avait coutume de ». La majuscule à « Rencontre » aide à reconnaître le nom fonctionnel de la tente.
