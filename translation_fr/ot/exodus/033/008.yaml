  text: וְ/הָיָ֗ה כְּ/צֵ֤את מֹשֶׁה֙ אֶל הָ/אֹ֔הֶל יָק֨וּמוּ֙ כָּל הָ/עָ֔ם וְ/נִ֨צְּב֔וּ אִ֖ישׁ פֶּ֣תַח אָהֳל֑/וֹ וְ/הִבִּ֨יטוּ֙ אַחֲרֵ֣י מֹשֶׁ֔ה עַד בֹּא֖/וֹ הָ/אֹֽהֱלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/008.yaml
  text: And whenever Moses went out to the tent[a], all the people would rise and stand, each man at the entrance of his tent[b], and they would watch after Moses until he entered the tent.
translation:
  language: fr
  text: Chaque fois que Moïse sortait pour aller à la tente[a], tout le peuple se levait, et chacun se tenait à l’entrée de sa tente[b]. Ils suivaient Moïse du regard jusqu’à ce qu’il entre dans la tente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la Tente », c’est-à-dire la tente de la rencontre mentionnée dans le contexte.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « chaque homme à l’entrée de sa tente »; le masculin singulier hébreu est employé ici dans un sens distributif pour les membres du peuple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Chaque fois que
  rationale: La construction narrative introduit ici une action habituelle et répétée; « Chaque fois que » en rend naturellement la valeur itérative.
- source_word: כְּצֵאת מֹשֶׁה אֶל הָאֹהֶל
  choice: Moïse sortait pour aller à la tente
  rationale: L’infinitif avec כ marque la circonstance temporelle, tandis que אֶל indique la direction. Cette formulation conserve à la fois l’idée de sortir et celle de se rendre à la tente.
- source_word: הָאֹהֶל
  choice: la tente
  rationale: L’hébreu porte simplement « la tente ». Le contexte l’identifie comme la tente de la rencontre, sans que cette désignation complète figure dans ce verset.
- source_word: יָקוּמוּ
  choice: se levait
  rationale: L’imparfait exprime une conduite habituelle. Le sujet collectif singulier « tout le peuple » appelle naturellement le singulier en français.
- source_word: וְנִצְּבוּ אִישׁ
  choice: et chacun se tenait
  rationale: נצב évoque le fait de se tenir debout ou en position; אִישׁ est distributif. « Chacun se tenait » restitue les deux éléments sans lourdeur.
- source_word: פֶּתַח אָהֳלוֹ
  choice: à l’entrée de sa tente
  rationale: פתח désigne l’ouverture ou l’entrée d’une tente; le possessif singulier correspond à la construction distributive.
- source_word: וְהִבִּיטוּ אַחֲרֵי מֹשֶׁה
  choice: Ils suivaient Moïse du regard
  rationale: L’expression décrit les gens regardant Moïse tandis qu’il s’éloigne. « Suivre du regard » conserve la valeur de אַחֲרֵי sans suggérer qu’ils marchaient derrière lui.
- source_word: עַד בֹּאוֹ הָאֹהֱלָה
  choice: jusqu’à ce qu’il entre dans la tente
  rationale: La venue de Moïse et le suffixe directionnel sur « tente » indiquent un mouvement vers l’intérieur; cette tournure est idiomatique en français.
theological_decisions: []
