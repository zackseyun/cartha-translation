source:
  edition: WLC
  text: וַ/הֲסִרֹתִי֙ אֶת כַּפִּ֔/י וְ/רָאִ֖יתָ אֶת אֲחֹרָ֑/י וּ/פָנַ֖/י לֹ֥א יֵרָאֽוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/023.yaml
  text: Then I will remove my hand[a], and you will see my back, but my face shall not be seen.
translation:
  language: fr
  text: Alors je retirerai ma main, et tu verras mon dos[a] ; mais mon visage ne sera pas vu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui est derrière moi ». Le terme hébreu peut désigner le dos ou l’aspect arrière.
    reason: alternative lexicale
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  choice: Alors je retirerai
  rationale: Le hifil de סור signifie « retirer » ou « ôter ». « Alors » rend naturellement la progression narrative et la valeur future dans le contexte.
- source_word: כַּפִּי
  choice: ma main
  rationale: כַּף peut désigner la paume ou la main. « Main » est ici le terme français le plus naturel et conserve l’image concrète de la protection évoquée au verset précédent.
- source_word: וְרָאִיתָ
  choice: et tu verras
  rationale: Dans cette séquence à valeur future, la forme exprime le résultat qui suivra le retrait de la main.
- source_word: אֲחֹרָי
  choice: mon dos
  rationale: Le mot désigne le dos ou l’aspect arrière. « Mon dos » est clair et naturel en français, tandis qu’une note conserve l’ambiguïté lexicale.
- source_word: וּפָנַי
  choice: mais mon visage
  rationale: La conjonction introduit ici un contraste entre ce qui pourra être vu et ce qui ne le sera pas. « Visage » rend directement פָּנִים.
- source_word: לֹא יֵרָאוּ
  choice: ne sera pas vu
  rationale: 'Le nifal de ראה est passif : « être vu ». Malgré la forme morphologiquement plurielle de פָּנִים, son sens est singulier en français, d’où « mon visage ne sera pas vu ».'
theological_decisions:
- issue: Langage anthropomorphique appliqué à Dieu
  choice: Conserver les termes concrets « main », « dos » et « visage ».
  alternative: Employer des expressions abstraites telles que « présence » ou « trace » afin d’éviter les images corporelles.
  rationale: L’hébreu emploie délibérément ces images. Les maintenir respecte la tension du texte concernant la révélation de Dieu sans lui imposer une explication métaphysique.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe reste proche de la progression hébraïque, tout en étant naturelle en français. Le passif final est conservé afin de ne pas transformer l’énoncé en formulation active ou en interdiction explicite.
