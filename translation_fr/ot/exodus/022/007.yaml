    issue: La note décrit inexactement la formulation hébraïque comme « de Dieu ».
    rationale: אֶל הָאֱלֹהִים se rend littéralement par « vers Dieu », « auprès de Dieu » ou, selon la construction française, « devant Dieu » ; « de Dieu » correspondrait à une autre préposition.
  - severity: low
    issue: « Porter la main sur les biens » est peu idiomatique et peut évoquer une violence physique.
    rationale: L’expression française ne rend pas aisément l’idée d’appropriation ou d’usage illicite portée par l’idiome hébreu. « Mettre la main sur » préserve mieux l’image sans réduire le sens au seul vol.
  revised_text: Si le voleur n’est pas retrouvé, le propriétaire de la maison s’approchera de Dieu[a] pour établir s’il n’a pas mis la main sur les biens de son prochain.
