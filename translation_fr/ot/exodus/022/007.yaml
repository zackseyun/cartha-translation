  text: אִם לֹ֤א יִמָּצֵא֙ הַ/גַּנָּ֔ב וְ/נִקְרַ֥ב בַּֽעַל הַ/בַּ֖יִת אֶל הָֽ/אֱלֹהִ֑ים אִם לֹ֥א שָׁלַ֛ח יָד֖/וֹ בִּ/מְלֶ֥אכֶת רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/007.yaml
  text: If the thief is not found[a], the owner of the house shall come near to God to determine whether he has not laid his hand on his neighbor’s property.
translation:
  language: fr
  text: Si le voleur n’est pas retrouvé, le propriétaire de la maison s’approchera de Dieu[a] pour établir s’il n’a pas mis la main sur les biens de son prochain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des juges » ; l’hébreu dit littéralement « vers Dieu » ou « auprès de Dieu », mais, dans certains contextes juridiques, ce terme peut désigner des juges exerçant leur fonction sous l’autorité divine.
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא הַגַּנָּב
  choice: le voleur n’est pas retrouvé
  rationale: Le nifal de מצא exprime ici qu’on ne trouve ou ne découvre pas le voleur. « N’est pas retrouvé » convient au contexte judiciaire sans préciser s’il s’agit de son identification ou de son arrestation.
- source_word: וְנִקְרַב
  choice: s’approchera
  rationale: Le nifal de קרב peut être intransitif (« s’approcher ») ou passif (« être amené »). « S’approchera » reste naturel en français et n’ajoute pas d’agent absent du texte.
- source_word: בַּעַל הַבַּיִת
  choice: le propriétaire de la maison
  rationale: Cette expression désigne celui qui possède la maison ou en a la responsabilité. Dans ce cadre juridique, « propriétaire de la maison » est clair et direct.
- source_word: אֶל הָאֱלֹהִים
  choice: de Dieu
  rationale: Le texte hébreu porte אֱלֹהִים, « Dieu ». La formulation « s’approchera de Dieu » en conserve le sens lexical direct, tandis que l’interprétation judiciaire est signalée en note.
- source_word: אִם לֹא שָׁלַח יָדוֹ
  choice: pour établir s’il n’a pas porté la main sur
  rationale: Après un verbe d’approche dans un contexte légal, אִם introduit ici la question à trancher. « Porter la main sur » préserve l’image hébraïque d’une appropriation ou d’un usage illicite sans la réduire explicitement au vol.
- source_word: בִּמְלֶאכֶת רֵעֵהוּ
  choice: les biens de son prochain
  rationale: Dans ce contexte de dépôt, מְלָאכָה désigne ce qui appartient à l’autre et a été confié au gardien. « Les biens » restitue naturellement la portée concrète du terme; « prochain » correspond au vocabulaire relationnel et juridique de רֵעַ.
theological_decisions:
- issue: Sens de אֱלֹהִים dans ce cadre juridique
  choice: Dieu
  alternative: les juges
  rationale: La valeur lexicale directe est « Dieu », et rien n’oblige à remplacer ce terme dans le corps du texte. Puisque אֱלֹהִים peut toutefois être compris, dans certains textes juridiques, comme désignant les juges qui exercent leur charge sous l’autorité divine, cette possibilité est conservée en note plutôt que résolue silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. La tournure juridique « pour établir si » explicite la fonction contextuelle de la proposition sans préciser le mécanisme de décision. L’image « porter la main sur » est conservée, car elle reste intelligible en français et évite de réduire l’infraction au seul vol.
