  variant: modern international French
source:
  edition: WLC
  text: שְׁבֻעַ֣ת יְהוָ֗ה תִּהְיֶה֙ בֵּ֣ין שְׁנֵי/הֶ֔ם אִם לֹ֥א שָׁלַ֛ח יָד֖/וֹ בִּ/מְלֶ֣אכֶת רֵעֵ֑/הוּ וְ/לָקַ֥ח בְּעָלָ֖י/ו וְ/לֹ֥א יְשַׁלֵּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/010.yaml
  text: an oath of Yahweh shall be between the two of them[a], that he has not put his hand to his neighbor’s property; and its owner shall accept it[c][b], and he shall not make restitution.
translation:
  language: fr
  text: 'Un serment de Yahvé[a] aura lieu entre eux deux : l’un jurera qu’il n’a pas porté la main sur les biens de son prochain[b]. Le propriétaire acceptera ce serment[c], et aucune restitution ne sera due.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un serment de Yahvé » ; il s’agit d’un serment solennel prononcé en invoquant Yahvé ou sous son autorité.'
    reason: lexical_alternative
  - marker: b
    text: « Porter la main sur » signifie ici s’approprier ou utiliser indûment ce qui appartient à autrui.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « le propriétaire le prendra », c’est-à-dire qu’il acceptera le serment comme suffisant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֻעַת יְהוָה
  choice: un serment de Yahvé
  rationale: 'Le groupe construit signifie littéralement « un serment de YHWH ». Cette formulation française conserve le lien formel avec le nom divin et laisse ouverte la nuance exacte : serment prononcé en invoquant Yahvé ou placé sous son autorité.'
- source_word: בֵּין שְׁנֵיהֶם
  choice: aura lieu entre eux deux
  rationale: La formulation maintient explicitement les deux parties au litige et rend naturellement la fonction juridique du serment.
- source_word: אִם לֹא
  choice: l’un jurera qu’il n’a pas
  rationale: Dans cette formule de serment, אִם לֹא introduit le contenu de l’affirmation jurée plutôt qu’une simple condition. Le verbe « jurera » explicite en français la relation syntaxique avec le serment déjà mentionné.
- source_word: שָׁלַח יָדוֹ
  choice: porté la main sur
  rationale: Cette expression conserve l’image hébraïque tout en évoquant en contexte le fait de s’approprier, d’utiliser indûment ou d’altérer le bien confié.
- source_word: בִּמְלֶאכֶת רֵעֵהוּ
  choice: les biens de son prochain
  rationale: Dans ce contexte juridique, מְלָאכָה désigne ce qui appartient à l’autre et a été confié à sa garde, plutôt que le travail au sens abstrait.
- source_word: וְלָקַח בְּעָלָיו
  choice: le propriétaire acceptera ce serment
  rationale: Le verbe « prendre » a ici la valeur contextuelle de recevoir ou d’accepter le serment comme règlement suffisant du litige. L’objet implicite est rendu explicite pour la clarté.
- source_word: וְלֹא יְשַׁלֵּם
  choice: aucune restitution ne sera due
  rationale: Le piel de שׁלם désigne ici l’indemnisation ou la restitution. La tournure passive évite qu’un pronom français soit rattaché à tort au propriétaire, tout en conservant l’effet juridique de la proposition.
theological_decisions:
- issue: Sens de « serment de Yahvé »
  choice: Conserver la construction « de Yahvé » dans le texte et en signaler la portée dans une note.
  alternative: « serment prêté devant Yahvé » ou « serment par Yahvé »
  rationale: L’hébreu construit directement « serment » avec le nom divin. Une paraphrase unique risquerait de trancher entre l’invocation du nom de Yahvé, sa présence comme témoin et l’autorité divine du serment.
translation_notes:
  register: Français international actuel, juridique mais accessible. « Yahvé » rend le nom divin יהוה. La dernière proposition est formulée au passif afin d’éviter une ambiguïté référentielle artificielle en français.
