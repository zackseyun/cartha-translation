    issue: Ambiguïté référentielle dans « il dédommagera son propriétaire »
    rationale: Le possessif « son » peut se rattacher à « il » (le dépositaire), alors que le texte vise le propriétaire de l’objet volé. Employer « le propriétaire » rend le référent sans équivoque.
  - severity: low
    issue: Registre de « bel et bien »
    rationale: La locution peut exprimer l’intensité hébraïque, mais elle est plus conversationnelle que le style juridique moderne. « Réellement » maintient l’insistance dans un registre plus neutre.
