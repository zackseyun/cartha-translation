  text: But if it is stolen from him[a], he shall make restitution to its owner.
translation:
  language: fr
  text: Mais si on le lui vole réellement[a], il indemnisera le propriétaire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie une construction intensive, littéralement : « si, étant volé, il est volé d’auprès de lui » ; elle peut aussi se rendre par « s’il est effectivement volé alors qu’il est sous sa garde ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Dans la suite des cas juridiques, la conjonction introduit une condition qui contraste avec le cas précédent ; « Mais si » rend naturellement cette articulation.
- source_word: גָּנֹב יִגָּנֵב
  choice: on le lui vole bel et bien
  rationale: L’infinitif absolu suivi du verbe de même racine renforce l’idée verbale. La tournure française avec « bel et bien » restitue cette insistance, tandis que le pronom « le » reprend naturellement ce qui a été confié dans le contexte.
- source_word: מֵעִמּוֹ
  choice: lui
  rationale: L’expression signifie littéralement « d’auprès de lui » et indique ici que la chose est volée alors qu’elle se trouve sous sa garde. Le double pronom de « on le lui vole » exprime cela sans alourdir le texte.
- source_word: יְשַׁלֵּם
  choice: il dédommagera
  rationale: Dans ce contexte juridique, le piel de שלם désigne le versement d’une compensation ou la réparation d’une perte. « Dédommagera » en conserve la portée légale.
- source_word: לִבְעָלָיו
  choice: son propriétaire
  rationale: בעל désigne ici le propriétaire de ce qui avait été confié. Le singulier collectif hébreu est rendu naturellement en français par « son propriétaire ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne, avec une formulation juridique naturelle. La voix active impersonnelle (« on le lui vole ») évite une construction passive peu idiomatique tout en conservant le sens et l’insistance de l’hébreu.
