  text: אִם בַּ/מַּחְתֶּ֛רֶת יִמָּצֵ֥א הַ/גַּנָּ֖ב וְ/הֻכָּ֣ה וָ/מֵ֑ת אֵ֥ין ל֖/וֹ דָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/001.yaml
  text: If the thief is found breaking in and is struck so that he dies[b][a], there is no bloodguilt for him.
translation:
  language: fr
  text: Si le voleur est surpris en train de s’introduire par effraction[a], et qu’il est frappé et meurt, celui qui l’a frappé n’encourt aucune responsabilité pour le sang versé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « Si le voleur est trouvé lors de l’effraction. » Le terme hébreu évoque une entrée clandestine, notamment en pratiquant une ouverture dans un mur.'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire que, dans ce cas, la personne qui a frappé le voleur n’encourt pas de responsabilité juridique pour sa mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמַּחְתֶּרֶת
  choice: en train de s’introduire par effraction
  rationale: Le nom désigne l’action de pénétrer clandestinement, souvent en pratiquant une ouverture dans un mur. Cette formulation française restitue naturellement la situation sans limiter le sens à un tunnel.
- source_word: יִמָּצֵא
  choice: est surpris
  rationale: Dans cette loi conditionnelle, le nifal de מצא indique que le voleur est trouvé sur le fait. « Est surpris » est idiomatique en français et convient au contexte d’une effraction en cours.
- source_word: הַגַּנָּב
  choice: le voleur
  rationale: גנב est le terme courant pour « voleur ». Le contexte précise qu’il commet une effraction, sans qu’il soit nécessaire de substituer un terme juridique plus spécialisé.
- source_word: וְהֻכָּה
  choice: est frappé
  rationale: Le passif de נכה indique qu’un coup lui est porté, sans préciser qu’il s’agit de coups répétés.
- source_word: וָמֵת
  choice: et qu’il meurt
  rationale: La coordination hébraïque présente la mort comme la suite du coup. La construction française conserve ce lien sans préciser davantage sa nature causale.
- source_word: אֵין לוֹ דָּמִים
  choice: celui qui l’a frappé n’est pas coupable d’avoir versé son sang
  rationale: L’expression idiomatique דמים énonce l’absence de responsabilité pour le sang versé. Le référent implicite du pronom est explicité pour éviter en français qu’il soit attribué au voleur.
theological_decisions:
- issue: Portée juridique de l’absence de responsabilité pour le sang versé
  choice: Exprimer une absence de culpabilité liée au sang versé dans ce cas précis.
  alternative: « Il n’est pas coupable de meurtre. »
  rationale: L’hébreu prononce un jugement juridique circonstancié sur la responsabilité du sang, sans employer le terme spécifique de meurtre ni formuler une approbation générale de la mise à mort.
translation_notes:
  register: Français international moderne, clair et digne. La formulation juridique reste accessible; l’explicitation « celui qui l’a frappé » lève une ambiguïté pronominale qui serait trompeuse en français, tandis que la note conserve la portée de l’idiome hébreu.
