base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/024.yaml
  text: If you lend money to my people[a], to the poor among you, you shall not be like a creditor to him[c][b]; you shall not impose interest on him.
translation:
  language: fr
  text: Si tu prêtes de l’argent à quelqu’un de mon peuple, au pauvre qui est avec toi, tu ne te comporteras pas envers lui comme un créancier ; vous ne lui imposerez pas d’intérêts.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: La particule est formellement conditionnelle. Dans le droit casuistique, elle peut aussi avoir le sens de « quand » ; « si » préserve ici la forme hébraïque.
- source_word: כֶּסֶף
  choice: argent
  rationale: Le mot signifie littéralement « argent métal », mais désigne couramment la monnaie dans ce contexte économique.
- source_word: תַּלְוֶה
  choice: prêtes
  rationale: Le hiphil de לוה signifie ici « prêter » ; ce verbe est naturel et précis en français.
- source_word: עַמִּי
  choice: quelqu’un de mon peuple
  rationale: Cette formulation conserve « mon peuple » tout en reliant naturellement l’expression au bénéficiaire singulier du prêt.
- source_word: הֶעָנִי
  choice: au pauvre
  rationale: Le substantif adjectival est masculin singulier et désigne ici une personne pauvre précise ; le masculin grammatical est conservé.
- source_word: עִמָּךְ
  choice: qui est avec toi
  rationale: Rend directement l’expression hébraïque et évite de transformer sa relation de proximité en simple appartenance collective.
- source_word: כְּנֹשֶׁה
  choice: comme un créancier exigeant
  rationale: Le participe désigne un créancier, avec l’idée contextuelle de presser le débiteur. « Exigeant » explicite sobrement cette nuance sans confondre le terme avec l’intérêt lui-même.
- source_word: תְשִׂימוּן
  choice: imposerez
  rationale: Avec עַל et נֶשֶׁךְ, le verbe « mettre, placer » exprime idiomatiquement le fait d’imposer un intérêt.
- source_word: נֶשֶׁךְ
  choice: intérêts
  rationale: Le terme désigne l’intérêt prélevé sur un prêt. « Usure » pourrait suggérer à tort, en français moderne, un taux seulement excessif.
theological_decisions:
- issue: Valeur juridique de אִם
  choice: Si tu prêtes
  alternative: Quand tu prêtes
  rationale: « Si » respecte la forme conditionnelle du texte, tandis que la note signale la valeur possible de cas juridique régulier sans rendre le prêt obligatoire.
- issue: Référence masculine singulière de הֶעָנִי
  choice: au pauvre
  alternative: à la personne pauvre
  rationale: Le texte hébreu vise un individu au masculin singulier. La traduction conserve cette forme sans ajouter le nom « homme », absent du texte.
- issue: Alternance du singulier et du pluriel dans les interdictions
  choice: tu ne te comporteras… vous ne lui imposerez pas
  alternative: uniformiser entièrement au singulier ou au pluriel
  rationale: L’hébreu passe du singulier תִהְיֶה au pluriel emphatique תְשִׂימוּן. La traduction maintient cette tension grammaticale plutôt que de l’effacer.
translation_notes:
  register: Français international moderne, digne et accessible. Le passage du « tu » au « vous » reproduit l’alternance hébraïque entre singulier et pluriel. La formulation évite « usure », potentiellement trompeur aujourd’hui, et conserve la proximité exprimée par « avec toi ».
