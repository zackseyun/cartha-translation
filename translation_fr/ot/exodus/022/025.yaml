  text: If you take your neighbor’s cloak as a pledge[b][a], you shall return it to him before the sun sets.
translation:
  language: fr
  text: Si tu prends en gage le manteau de ton prochain[a], tu le lui rendras avant le coucher du soleil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vêtement » ou « vêtement de dessus ». Le terme hébreu désigne un vêtement extérieur qui pouvait servir de protection pendant la nuit.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « jusqu’à l’entrée du soleil » ; expression qui désigne ici son coucher, c’est-à-dire au plus tard au coucher du soleil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit une loi casuistique sous forme conditionnelle. « Si » conserve directement cette structure, sans transformer le cas envisagé en événement certain.
- source_word: חָבֹל תַּחְבֹּל
  choice: tu prends en gage
  rationale: L’infinitif absolu suivi du verbe de même racine souligne l’action de prendre un bien en garantie. La tournure française naturelle « prendre en gage » rend clairement l’acte juridique sans reproduire artificiellement la répétition hébraïque.
- source_word: שַׂלְמַת
  choice: le manteau
  rationale: Le terme désigne ici un vêtement extérieur pouvant aussi protéger du froid pendant la nuit. « Manteau » est précis, courant et cohérent avec la justification donnée au verset suivant.
- source_word: רֵעֶךָ
  choice: de ton prochain
  rationale: Dans ce contexte de droit social, « prochain » exprime le rapport entre membres de la communauté tout en conservant la portée éthique traditionnelle de רֵעַ.
- source_word: עַד בֹּא הַשֶּׁמֶשׁ
  choice: avant le coucher du soleil
  rationale: L’expression hébraïque signifie idiomatiquement que le vêtement doit être rendu au plus tard lorsque le soleil se couche. Cette formulation française énonce naturellement l’exigence temporelle.
- source_word: תְּשִׁיבֶנּוּ לוֹ
  choice: tu le lui rendras
  rationale: Le hifil de שוב signifie faire revenir ou restituer. « Tu le lui rendras » est une formulation claire et digne de l’obligation légale.
