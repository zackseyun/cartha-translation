id: EXO.22.22
reference: Exodus 22:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִם עַנֵּ֥ה תְעַנֶּ֖ה אֹת֑/וֹ כִּ֣י אִם צָעֹ֤ק יִצְעַק֙ אֵלַ֔/י שָׁמֹ֥עַ אֶשְׁמַ֖ע צַעֲקָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/022.yaml
  text: If you indeed afflict him[a], and if he indeed cries out to me[b], I will surely hear his cry.
translation:
  language: fr
  text: Si tu le maltraites vraiment[a] et s’il crie vraiment vers moi[b], j’entendrai à coup sûr son cri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici des pronoms au masculin singulier (« le », « il », « son »). Dans le contexte, ils désignent individuellement toute veuve ou tout orphelin mentionné au verset précédent.
    reason: cultural_note
  - marker: b
    text: 'Pour « maltraiter », « crier » et « entendre », l’hébreu associe un infinitif absolu à un verbe conjugué afin de renforcer l’expression : « vraiment maltraiter », « vraiment crier », « entendre à coup sûr ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: La particule introduit ici une condition; « si » en conserve directement la valeur.
- source_word: עַנֵּה תְעַנֶּה
  choice: tu le maltraites vraiment
  rationale: « Maltraiter » exprime naturellement en français l’action de ענה dans ce contexte juridique, tandis que « vraiment » rend l’intensification produite par l’infinitif absolu suivi du verbe conjugué.
- source_word: אֹתוֹ
  choice: le
  rationale: Le suffixe hébreu est au masculin singulier et renvoie de manière distributive à toute personne vulnérable mentionnée au verset précédent.
- source_word: כִּי אִם
  choice: et s’il
  rationale: Dans cet enchaînement, l’expression poursuit la construction conditionnelle plutôt qu’elle n’introduit une opposition.
- source_word: צָעֹק יִצְעַק
  choice: il crie vraiment
  rationale: La répétition « infinitif absolu + verbe conjugué » intensifie l’appel; « vraiment » rend cette insistance sans préciser indûment sa manière de crier.
- source_word: אֵלַי
  choice: vers moi
  rationale: Cette formulation française conserve la direction explicite de l’appel adressé à Dieu.
- source_word: שָׁמֹעַ אֶשְׁמַע
  choice: j’entendrai à coup sûr
  rationale: « À coup sûr » exprime de façon idiomatique la certitude emphatique de la réponse divine marquée par l’infinitif absolu.
- source_word: צַעֲקָתוֹ
  choice: son cri
  rationale: « Cri » restitue simplement le nom apparenté au verbe צעק employé juste auparavant.
theological_decisions:
- issue: Pronom masculin singulier désignant la personne maltraitée
  choice: le / il / son
  alternative: la personne / elle / son; les / ils / leur
  rationale: Les suffixes et le verbe hébreux sont au masculin singulier. Ils ont ici une portée distributive et peuvent désigner toute veuve ou tout orphelin mentionné au verset précédent; la note évite de restreindre ce masculin grammatical aux seuls hommes.
translation_notes:
  register: Français international actuel, clair et digne. « Maltraiter » est plus naturel que « affliger » dans une prescription juridique moderne. Les intensifications hébraïques sont conservées dans le texte, avec une variation idiomatique (« vraiment », « à coup sûr ») pour éviter une formulation artificielle.
