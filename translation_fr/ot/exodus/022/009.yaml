  text: כִּֽי יִתֵּן֩ אִ֨ישׁ אֶל רֵעֵ֜/הוּ חֲמ֨וֹר אוֹ שׁ֥וֹר אוֹ שֶׂ֛ה וְ/כָל בְּהֵמָ֖ה לִ/שְׁמֹ֑ר וּ/מֵ֛ת אוֹ נִשְׁבַּ֥ר אוֹ נִשְׁבָּ֖ה אֵ֥ין רֹאֶֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/009.yaml
  text: If a man gives his neighbor a donkey[a], or an ox, or a sheep, or any animal to keep, and it dies, or is injured, or is carried off, with no one seeing it[c][b],
translation:
  language: fr
  text: Si un homme confie à son prochain un âne, un bœuf, une bête du troupeau[a] ou tout autre animal pour qu’il le garde, et que l’animal meure, soit blessé[b] ou soit emmené, sans témoin[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu peut désigner un mouton ou une chèvre.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « soit brisé ».'
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire sans témoin oculaire de ce qui s’est passé.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Si
  rationale: Introduit la condition d’une loi casuistique; « si » est naturel en français juridique.
- source_word: יִתֵּן
  choice: confie
  rationale: Le verbe signifie littéralement « donner », mais le complément « pour qu’il le garde » établit ici une remise en garde; « confie » exprime naturellement cette relation sans modifier sa portée juridique.
- source_word: אִישׁ
  choice: un homme
  rationale: Conserve le masculin singulier du texte hébreu dans cette formulation casuistique.
- source_word: אֶל רֵעֵהוּ
  choice: à son prochain
  rationale: « Prochain » convient au membre de la communauté ou à l’autre personne concernée, sans supposer une proximité résidentielle stricte.
- source_word: חֲמוֹר
  choice: un âne
  rationale: Équivalent français moderne et précis.
- source_word: שׁוֹר
  choice: un bœuf
  rationale: Rendu traditionnel et exact dans une liste de bétail, sans préciser indûment l’âge ou la fonction de l’animal.
- source_word: שֶׂה
  choice: une bête du petit bétail
  rationale: Le terme peut désigner un mouton ou une chèvre; cette formulation française préserve cette amplitude lexicale.
- source_word: וְכָל בְּהֵמָה
  choice: ou tout autre animal
  rationale: Dans ce contexte, בְּהֵמָה désigne un animal domestique confié à la garde d’autrui; « autre » rend explicite la relation avec les exemples précédents.
- source_word: לִשְׁמֹר
  choice: pour qu’il le garde
  rationale: Exprime clairement le but de la remise et la responsabilité de garde.
- source_word: וּמֵת
  choice: et que l’animal meure
  rationale: Le sujet est répété en français pour éviter toute ambiguïté après la liste des animaux.
- source_word: נִשְׁבַּר
  choice: soit blessé
  rationale: Le sens littéral est « être brisé »; appliqué à un animal, « être blessé » est idiomatique tout en conservant l’idée de dommage corporel.
- source_word: נִשְׁבָּה
  choice: soit emmené
  rationale: Préserve l’idée d’un animal pris et emporté, sans réduire le terme à un vol ordinaire ni préciser l’auteur.
- source_word: אֵין רֹאֶה
  choice: sans que personne l’ait vu
  rationale: Rend la formule hébraïque « il n’y a pas de témoin voyant » comme absence de témoin oculaire de l’événement.
