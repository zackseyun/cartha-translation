review_pass:
  verdict: revise
  source_fidelity: La condition, la remise en garde, les catégories d’animaux et les trois éventualités sont rendues avec fidélité. « Soit emmené » garde correctement une portée plus large que le seul vol. En revanche, « sans que personne l’ait vu » fait grammaticalement de l’animal l’objet de la vision, alors que l’hébreu indique l’absence de témoin de l’incident; cette ambiguïté doit être levée.
  naturalness: Le français est globalement clair et de registre juridique naturel. « Une bête du troupeau » est plus idiomatique que « une bête du petit bétail » tout en conservant l’indétermination entre mouton et chèvre. « Sans témoin » est concis, naturel et couvre chacune des éventualités énumérées.
  terminology: « Confie », « son prochain », « âne », « bœuf » et « garder » conviennent. « Une bête du troupeau » restitue prudemment שֶׂה; la note explicite utilement les deux référents principaux. La note sur « brisé » préserve la valeur littérale de נִשְׁבַּר.
  issues:
  - severity: medium
    issue: Portée ambiguë de « sans que personne l’ait vu »
    rationale: Le pronom « l’ » renvoie normalement à l’animal en français, tandis que אֵין רֹאֶה signifie qu’il n’y a pas de personne qui ait vu ce qui est arrivé. La formulation actuelle peut donc suggérer seulement que l’animal n’a pas été aperçu, ce qui ne couvre pas correctement sa mort ou sa blessure.
  - severity: low
    issue: « Une bête du petit bétail » est peu idiomatique
    rationale: L’expression collective « petit bétail » est compréhensible, mais « une bête du troupeau » est plus fluide pour un animal individuel et maintient l’amplitude sémantique de שֶׂה.
