- from: Si un homme confie à son prochain un âne, un bœuf, une bête du petit bétail[a] ou tout autre animal pour qu’il le garde, et que l’animal meure, soit blessé[b] ou soit emmené, sans que personne l’ait vu[c],
  to: Si un homme confie à son prochain un âne, un bœuf, une bête du troupeau[a] ou tout autre animal pour qu’il le garde, et que l’animal meure, soit blessé[b] ou soit emmené, sans témoin[c],
  rationale: La révision remplace le pronom potentiellement mal référé par « sans témoin », qui exprime l’absence de témoin de l’événement sans ajouter de détail. Elle améliore aussi l’idiomaticité du rendu de שֶׂה, sans choisir entre mouton et chèvre. Les notes et leurs ancres restent intactes et correctement placées.
