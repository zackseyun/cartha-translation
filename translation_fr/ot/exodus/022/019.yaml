id: EXO.22.19
reference: Exodus 22:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זֹבֵ֥חַ לָ/אֱלֹהִ֖ים יָֽחֳרָ֑ם בִּלְתִּ֥י לַ/יהוָ֖ה לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/019.yaml
  text: Whoever sacrifices to any god[a], except to Yahweh alone, shall be devoted to destruction.
translation:
  language: fr
  text: Quiconque offre un sacrifice à un dieu, si ce n’est à Yahweh seul, sera voué à la destruction[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sera mis au ban » ou « sera entièrement détruit ». Le verbe hébreu évoque le fait d’être irrévocablement voué à la destruction.'
    reason: Alternative lexicale précisant la portée cultuelle et punitive de חרם.
lexical_decisions:
- source_word: זֹבֵחַ
  choice: Quiconque offre un sacrifice
  rationale: Le participe qal employé comme substantif désigne toute personne qui accomplit un sacrifice. Cette formulation française est naturelle et conserve le sens cultuel du verbe.
- source_word: לָאֱלֹהִים
  choice: à un dieu
  rationale: Bien que אֱלֹהִים soit morphologiquement pluriel, le contexte vise de manière générique toute divinité autre que Yahweh. Le singulier indéfini exprime clairement cette portée distributive en français.
- source_word: יָחֳרָם
  choice: sera voué à la destruction
  rationale: Le hofal de חרם évoque la mise au ban, c’est-à-dire une consécration irrévocable entraînant la destruction. La formulation retenue conserve à la fois la dimension sacrale et la portée punitive du terme.
- source_word: בִּלְתִּי
  choice: si ce n’est
  rationale: Dans ce contexte, בִּלְתִּי introduit l’unique exception. « Si ce n’est » rend cette fonction clairement dans un registre digne et actuel.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le tétragramme est rendu par le nom personnel « Yahweh », et la préposition liée au sacrifice est conservée.
- source_word: לְבַדּוֹ
  choice: seul
  rationale: 'Le terme exprime l’exclusivité : les sacrifices ne doivent être adressés qu’à Yahweh.'
theological_decisions:
- issue: Sens de חרם dans la sanction contre le sacrifice idolâtre
  choice: sera voué à la destruction
  alternative: sera entièrement détruit ; sera mis au ban
  rationale: 'Le terme hébreu ne désigne pas simplement une mise à mort : il évoque le fait d’être irrévocablement placé sous l’interdit en vue de la destruction. La traduction retenue préserve cette tension juridico-sacrale sans employer un jargon obscur dans le texte principal.'
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve ici le caractère personnel du nom d’alliance et le distingue du nom générique אֱלֹהִים.
translation_notes:
  register: Français international moderne, clair et digne. « Quiconque » convient à une formulation juridique générale ; « offre un sacrifice » est plus idiomatique que le simple verbe « sacrifie » tout en gardant le sens cultuel. La construction « si ce n’est à Yahweh seul » préserve explicitement l’exception et l’exclusivité du texte hébreu.
