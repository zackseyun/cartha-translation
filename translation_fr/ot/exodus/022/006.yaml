base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/006.yaml
  text: If a man gives his neighbor money or goods to keep[a], and it is stolen from the man's house, if the thief is found[c][b], he shall pay double.
translation:
  language: fr
  text: Si un homme confie à son prochain de l’argent ou des objets à garder, et qu’on les vole dans la maison de cet homme, si l’on retrouve le voleur, il remboursera le double.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Si
  rationale: Dans cette formulation juridique casuistique, כִּי introduit le cas envisagé; « Si » rend naturellement la condition.
- source_word: יִתֵּן אִישׁ
  choice: un homme confie
  rationale: Le texte hébreu emploie le masculin singulier et décrit la remise de biens à un dépositaire; « confie » exprime clairement cette fonction dans le contexte.
- source_word: אֶל רֵעֵהוּ
  choice: à son prochain
  rationale: רֵעַ désigne ici un autre membre de la communauté; « prochain » convient au registre juridique et biblique.
- source_word: כֶּסֶף
  choice: de l’argent
  rationale: Bien que כֶּסֶף signifie littéralement « argent » au sens du métal, il désigne couramment la monnaie dans ce contexte économique; le français « argent » conserve naturellement les deux possibilités.
- source_word: אוֹ כֵלִים
  choice: ou des objets
  rationale: כֵלִים est un terme large pour des objets ou articles; « objets » évite de le restreindre à des récipients.
- source_word: לִשְׁמֹר
  choice: à garder
  rationale: 'L’infinitif indique le but du dépôt: assurer la garde des biens.'
- source_word: וְגֻנַּב
  choice: et qu’on les vole
  rationale: Le passif hébreu porte sur les biens confiés. La tournure française avec « on » est naturelle et « les » reprend à la fois l’argent et les objets.
- source_word: מִבֵּית הָאִישׁ
  choice: dans la maison de cet homme
  rationale: La maison est celle de l’homme qui a reçu le dépôt; « cet homme » rend le renvoi sans ambiguïté.
- source_word: אִם יִמָּצֵא הַגַּנָּב
  choice: si le voleur est retrouvé
  rationale: Le nifal de מצא signifie littéralement « être trouvé »; « retrouvé » reste proche du texte sans ajouter explicitement l’idée d’arrestation.
- source_word: יְשַׁלֵּם שְׁנָיִם
  choice: il remboursera le double
  rationale: L’expression signifie restituer deux fois la valeur; le pronom renvoie naturellement au voleur, sujet immédiatement précédent.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne, avec une formulation juridique naturelle. Le masculin représentatif de l’hébreu est conservé par « un homme ». Aucune note n’est nécessaire, puisque « argent » correspond naturellement au sens monétaire de כֶּסֶף et « objets » rend adéquatement l’étendue de כֵלִים.
