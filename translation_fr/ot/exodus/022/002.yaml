  text: אִם זָרְחָ֥ה הַ/שֶּׁ֛מֶשׁ עָלָ֖י/ו דָּמִ֣ים ל֑/וֹ שַׁלֵּ֣ם יְשַׁלֵּ֔ם אִם אֵ֣ין ל֔/וֹ וְ/נִמְכַּ֖ר בִּ/גְנֵבָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/002.yaml
  text: But if the sun has risen on him[a], there is bloodguilt for him. He must surely make restitution. If he has nothing[c][b], then he shall be sold for his theft.
translation:
  language: fr
  text: Mais si le soleil s’est levé sur lui[a], celui qui a tué le voleur est coupable de meurtre[b]. Le voleur devra restituer intégralement. S’il n’a pas de quoi restituer, il sera vendu à cause de son vol[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus interprétative : « si cela arrive après le lever du soleil » ou « si cela se passe en plein jour ». L’hébreu dit littéralement : « si le soleil s’est levé sur lui ».'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire que, dans cette situation, celui qui tue le voleur porte la responsabilité du sang versé.
    reason: alternative_reading
  - marker: c
    text: Cette vente est une mesure destinée à permettre la restitution due pour le vol lorsque le voleur n’a pas les ressources nécessaires.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Mais si
  rationale: Introduit le cas opposé à celui du verset précédent; « mais » explicite naturellement le contraste contextuel.
- source_word: זָרְחָה הַשֶּׁמֶשׁ עָלָיו
  choice: le soleil s’est levé sur lui
  rationale: Conserve l’image concrète et l’expression prépositionnelle de l’hébreu, tout en employant un passé composé naturel en français.
- source_word: דָּמִים לוֹ
  choice: celui qui l’a frappé est coupable d’effusion de sang
  rationale: Dans ce contexte juridique, דָּמִים exprime la culpabilité liée au sang versé. L’explicitation du référent évite que le pronom français soit attribué au voleur.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: Le voleur devra restituer intégralement
  rationale: La construction infinitif absolu plus imperfectif renforce l’obligation; « restituer intégralement » rend à la fois l’intensité et la réparation due pour le vol.
- source_word: אִם אֵין לוֹ
  choice: S’il n’a rien
  rationale: Expression française directe correspondant au manque de ressources permettant de restituer.
- source_word: וְנִמְכַּר
  choice: il sera vendu
  rationale: Rend simplement la forme passive et la conséquence juridique prévue.
- source_word: בִּגְנֵבָתוֹ
  choice: pour rembourser ce qu’il a volé
  rationale: Exprime clairement la fonction juridique de la vente. Le substantif peut renvoyer au vol ou à ce qui a été dérobé; cette formulation reste naturelle sans suggérer une peine sans rapport avec la restitution.
theological_decisions:
- issue: Conséquence juridique de la mise à mort du voleur après le lever du soleil
  choice: Le responsable de la mise à mort est coupable d’effusion de sang dans ce cas.
  alternative: La distinction pourrait être comprise plus largement comme dépendant de la possibilité d’évaluer clairement la menace plutôt que de l’heure seule.
  rationale: Le texte principal conserve le critère concret du lever du soleil et n’élargit pas la règle au-delà de ce que dit l’hébreu.
- issue: Référent de l’obligation de restituer
  choice: L’obligation revient au voleur.
  alternative: Une lecture superficielle de l’enchaînement pourrait attribuer cette obligation à celui qui a frappé le voleur.
  rationale: La vente qui suit « pour son vol » identifie le voleur comme sujet de la restitution; le nommer en français lève une ambiguïté pronominale qui serait artificielle.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image hébraïque du soleil tout en clarifiant les sujets lorsque les pronoms français créeraient une confusion. « Effusion de sang » maintient le registre juridique et moral de דָּמִים; la note en explique la portée.
