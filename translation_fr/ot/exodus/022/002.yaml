revisions:
- from: Mais si le soleil s’est levé sur lui[a], celui qui l’a frappé est coupable d’effusion de sang[b]. Le voleur devra restituer intégralement. S’il n’a rien, il sera vendu pour rembourser ce qu’il a volé[c].
  to: Mais si le soleil s’est levé sur lui[a], celui qui a tué le voleur est coupable de meurtre[b]. Le voleur devra restituer intégralement. S’il n’a pas de quoi restituer, il sera vendu à cause de son vol[c].
  rationale: La révision harmonise le texte et la note quant à la mise à mort du voleur, tout en conservant le sens juridique de « sang » comme culpabilité pour homicide. Elle remplace la paraphrase restrictive de « pour rembourser ce qu’il a volé » par « à cause de son vol », plus proche de l’hébreu, et laisse à la note l’explication culturelle de la vente comme moyen de satisfaire la restitution.
