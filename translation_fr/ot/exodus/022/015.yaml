  text: וְ/כִֽי יְפַתֶּ֣ה אִ֗ישׁ בְּתוּלָ֛ה אֲשֶׁ֥ר לֹא אֹרָ֖שָׂה וְ/שָׁכַ֣ב עִמָּ֑/הּ מָהֹ֛ר יִמְהָרֶ֥/נָּה לּ֖/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/015.yaml
  text: If a man seduces a virgin who is not betrothed[a], and lies with her[b], he must surely pay the bride-price for her to be his wife.
translation:
  language: fr
  text: Si un homme séduit une vierge qui n’est pas promise en mariage et couche avec elle, il devra assurément payer pour elle le prix matrimonial[a] afin qu’elle devienne sa femme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « prix matrimonial » désigne ici le mohar, paiement associé au mariage, normalement versé par le futur mari ou sa famille; il ne s’agit pas d’une dot apportée par la femme.
    reason: précision culturelle et lexicale
lexical_decisions:
- source_word: יְפַתֶּה
  choice: séduit
  rationale: Le piel de פתה désigne ici le fait d’amener ou d’inciter quelqu’un à une relation sexuelle. « Séduit » rend ce sens sans introduire l’idée de violence, absente du terme dans ce contexte.
- source_word: בְּתוּלָה
  choice: une jeune femme vierge
  rationale: בְּתוּלָה désigne ici une femme vierge, statut déterminant dans cette disposition juridique. L’ajout naturel de « jeune femme » évite que « une vierge » sonne comme une simple étiquette en français.
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: qui n’est pas fiancée
  rationale: La forme passive indique qu’elle n’a pas été officiellement promise en mariage. « Fiancée » est clair en français moderne, tout en restant adapté au contexte juridique ancien.
- source_word: וְשָׁכַב עִמָּהּ
  choice: et couche avec elle
  rationale: שׁכב avec עִם est un idiome courant désignant une relation sexuelle. « Couche avec elle » est naturel, direct et digne.
- source_word: מָהֹר יִמְהָרֶנָּה
  choice: il devra verser pour elle le prix matrimonial
  rationale: L’infinitif absolu suivi de l’imparfait renforce l’obligation. La racine מהר renvoie au mohar, somme liée au mariage et versée par le futur mari ou sa famille; « prix matrimonial » évite la confusion créée en français par « dot ».
- source_word: לּוֹ לְאִשָּׁה
  choice: et la prendre pour femme
  rationale: Cette expression rend explicitement et naturellement l’issue matrimoniale indiquée par l’hébreu, sans suggérer que le paiement constitue à lui seul le mariage.
theological_decisions:
- issue: Nature de l’acte décrit par פתה
  choice: séduction, sans violence explicitement indiquée
  alternative: viol ou contrainte sexuelle
  rationale: Le verbe signifie ici séduire ou persuader et n’énonce pas en lui-même l’usage de la force. La traduction ne doit donc ni importer une violence absente du texte ni développer au-delà du verset la question du consentement.
translation_notes:
  register: Français international moderne, clair et digne. La formulation juridique « il devra » exprime fermement l’obligation; « prendre pour femme » conserve la couleur biblique sans être archaïque. Le marqueur [a] est placé immédiatement après le terme expliqué.
