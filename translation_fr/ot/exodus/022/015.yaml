  naturalness: Le français révisé reste moderne, clair et digne. « Promise en mariage » convient mieux qu’« fiancée » pour le statut juridique formel en contexte ancien. « Payer pour elle le prix matrimonial » est naturel avec l’explication du terme en note.
  terminology: « Séduit », « vierge », « promise en mariage », « couche avec elle » et « prix matrimonial » sont appropriés. La note distingue utilement ce paiement du mariage d’une dot apportée par la femme.
