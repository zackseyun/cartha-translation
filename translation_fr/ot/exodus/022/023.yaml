  yaml_path: translation/ot/exodus/022/023.yaml
  text: then my anger will burn[a], and I will kill you with the sword[b], and your wives will become widows and your sons fatherless.
translation:
  language: fr
  text: alors ma colère s’enflammera, et je vous tuerai par l’épée ; vos femmes deviendront veuves, et vos fils seront privés de père[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « orphelins » ; le terme hébreu désigne ici plus précisément ceux qui sont privés de père.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  choice: ma colère s’enflammera
  rationale: L’expression hébraïque associe חרה à אַף pour évoquer une colère qui s’embrase. Cette formulation conserve la métaphore tout en restant naturelle en français moderne.
- source_word: וְהָרַגְתִּי אֶתְכֶם
  choice: je vous tuerai
  rationale: הרג est le verbe courant pour « tuer » ; ce choix direct évite le registre vieilli de « faire périr » ou « passer au fil de l’épée ».
- source_word: בֶּחָרֶב
  choice: par l’épée
  rationale: La préposition בְּ indique ici le moyen. « Par l’épée » restitue l’image concrète et s’intègre naturellement à la tournure passive de moyen implicite.
- source_word: וְהָיוּ נְשֵׁיכֶם אַלְמָנוֹת
  choice: vos femmes deviendront veuves
  rationale: Dans ce contexte familial, נָשִׁים désigne les épouses. « Deviendront » exprime clairement l’état qui résultera de la mort des hommes.
- source_word: וּבְנֵיכֶם
  choice: vos fils
  rationale: בָּנִים est explicitement masculin ; « fils » préserve cette précision au lieu de la neutraliser par « enfants ».
- source_word: יְתֹמִים
  choice: privés de père
  rationale: יָתוֹם désigne souvent une personne ayant perdu son père et devenue socialement vulnérable. « Privés de père » exprime cette condition avec clarté ; une note signale l’équivalent plus large « orphelins ».
theological_decisions:
- issue: Expression anthropomorphique de la colère divine
  choice: ma colère s’enflammera
  alternative: mon nez s’échauffera ; ma fureur s’embrasera
  rationale: La traduction communique le sens idiomatique sans reproduire littéralement la partie du corps, incompréhensible en français, tout en maintenant la métaphore du feu et la force du jugement divin.
- issue: Terme filial masculin
  choice: vos fils
  alternative: vos enfants
  rationale: Le texte source emploie le terme masculin בָּנִים. Le contexte n’oblige pas à l’élargir à l’ensemble des enfants.
- issue: Étendue du terme יָתוֹם
  choice: privés de père
  alternative: orphelins
  rationale: Le jugement annoncé tue les hommes et laisse leurs fils sans père ; le choix principal conserve cette relation précise sans exclure la valeur lexicale plus générale, indiquée en note.
translation_notes:
  register: Français international moderne, direct et solennel. La syntaxe conserve l’enchaînement causal du jugement et son parallélisme familial, sans archaïsmes. Le point-virgule rend lisible la conséquence annoncée dans la seconde moitié du verset.
