  text: וְ/גֵ֥ר לֹא תוֹנֶ֖ה וְ/לֹ֣א תִלְחָצֶ֑/נּוּ כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/020.yaml
  text: You shall not mistreat a foreigner or oppress him[a], for you were foreigners in the land of Egypt.
translation:
  language: fr
  text: Tu ne maltraiteras pas l’étranger[a] et tu ne l’opprimeras pas, car vous avez été étrangers dans le pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « étranger résidant ». Le mot hébreu גֵר désigne une personne non originaire d’Israël qui vit au milieu du peuple.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר / גֵרִים
  choice: l’étranger / étrangers
  rationale: Le terme désigne ici une personne non israélite qui réside au sein d’Israël, et non un simple voyageur de passage. « Étranger » est clair en français moderne et permet de conserver la répétition du mot hébreu.
- source_word: תוֹנֶה
  choice: maltraiteras
  rationale: Le hifil de ינה exprime le fait de léser ou de traiter injustement quelqu’un. « Maltraiter » garde la portée générale du verbe sans la réduire à une exploitation économique.
- source_word: תִלְחָצֶנּוּ
  choice: l’opprimeras
  rationale: לחץ évoque une pression dure ou oppressive. « Opprimer » convient au poids du contexte juridique et le pronom élidé « l’ » représente le suffixe masculin singulier hébreu.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif du commandement. « Car » conserve le lien explicatif et le ton juridique du texte.
- source_word: הֱיִיתֶם
  choice: vous avez été
  rationale: Le verbe décrit la condition passée des Israélites en Égypte. Le passé composé est naturel en français moderne tout en gardant ce rappel historique.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: dans le pays d’Égypte
  rationale: Cette formulation rend explicitement אֶרֶץ et reste naturelle dans un registre biblique moderne.
theological_decisions:
- issue: Référence masculine singulière employée de manière générique
  choice: Conserver « l’étranger » au singulier et le pronom « l’ » dans « tu ne l’opprimeras ».
  alternative: Employer le pluriel « les étrangers » ou reformuler afin d’éviter le pronom singulier.
  rationale: L’hébreu emploie גֵר au masculin singulier avec un suffixe de troisième personne masculine singulière, selon l’usage générique du style juridique. Le français peut préserver naturellement ce nombre et cette forme.
- issue: Alternance entre le singulier « tu » et le pluriel « vous »
  choice: Préserver « tu » dans les interdictions et « vous » dans le rappel historique.
  alternative: Uniformiser toute la phrase au singulier ou au pluriel.
  rationale: Le texte hébreu passe délibérément du destinataire individuel au singulier dans les commandements à la communauté d’Israël au pluriel dans « vous avez été étrangers ». Conserver cette alternance préserve la tension grammaticale du texte source.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur impérative convient au style juridique biblique français. L’alternance source entre « tu » et « vous » est maintenue, de même que la répétition de « étranger ».
