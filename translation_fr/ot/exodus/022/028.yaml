  text: מְלֵאָתְ/ךָ֥ וְ/דִמְעֲ/ךָ֖ לֹ֣א תְאַחֵ֑ר בְּכ֥וֹר בָּנֶ֖י/ךָ תִּתֶּן לִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/028.yaml
  text: You shall not delay the fullness of your harvest and the outflow of your press[a]. You shall give to me the firstborn of your sons.
translation:
  language: fr
  text: Tu ne tarderas pas à présenter le produit abondant de ta récolte et ce qui s’écoule de ton pressoir[a]. Tu me donneras le premier-né de tes fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’abondance de ta récolte et ton jus » ou « ton vin ». Les termes hébreux désignent probablement le produit récolté et un produit liquide obtenu par pressurage. Il peut s’agir plus précisément du grain et du vin, ou plus généralement d’un rendement solide et liquide.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָתְךָ
  choice: le plein produit de ta récolte
  rationale: Le nom désigne littéralement la plénitude ou le plein rendement. Dans ce contexte agricole et juridique, cette formulation exprime concrètement le produit récolté sans réduire le terme à une denrée précise.
- source_word: וְדִמְעֲךָ
  choice: ce qui s’écoule de ton pressoir
  rationale: Bien que le nom puisse signifier « larme », il désigne ici un produit liquide agricole, probablement issu du pressurage. La formulation conserve l’image tout en évitant de préciser indûment s’il s’agit de vin, de jus ou d’huile.
- source_word: לֹא תְאַחֵר
  choice: Tu ne tarderas pas à apporter
  rationale: Le verbe signifie retarder ou différer. L’ajout d’« apporter », requis pour une formulation française naturelle, explicite seulement l’action impliquée dans cette prescription d’offrande.
- source_word: בְּכוֹר
  choice: le premier-né
  rationale: Ce terme désigne le premier-né; la formulation française habituelle convient ici et le complément « de tes fils » en précise le sens.
- source_word: בָּנֶיךָ
  choice: de tes fils
  rationale: L’hébreu parle précisément des fils et non des enfants en général; la traduction conserve cette valeur masculine.
- source_word: תִּתֶּן לִּי
  choice: Tu me donneras
  rationale: Cette formulation rend directement l’obligation juridique et le destinataire exprimé par l’hébreu, dans un français plus naturel que « tu donneras à moi ».
theological_decisions:
- issue: Sens du couple agricole מְלֵאָה / דִמְעָה dans une prescription relative aux offrandes
  choice: La prescription porte sur le produit récolté et sur le produit liquide du pressoir, sans préciser davantage les denrées.
  alternative: Les deux termes désignent spécifiquement le grain et le vin, ou plus largement les prémices sans distinction entre produits solides et liquides.
  rationale: Le parallélisme semble associer un rendement agricole solide à un produit liquide exprimé. La traduction maintient cette distinction probable sans restreindre le second terme au seul vin.
- issue: Portée de בָּנֶיךָ
  choice: fils
  alternative: enfants
  rationale: Le terme hébreu est masculin et la catégorie juridique visée est celle du premier-né parmi les fils; le rendre par « enfants » neutraliserait cette précision.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète les formes hébraïques. « Apporter » rend la prescription idiomatique en français sans nommer explicitement une cérémonie ni résoudre l’ambiguïté des produits agricoles.
