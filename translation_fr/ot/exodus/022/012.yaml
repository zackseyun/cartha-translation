  verdict: revise
  source_fidelity: Le sens juridique est globalement bien rendu. Toutefois, « les restes » explicite et pluralise l’objet que l’hébreu désigne au singulier (« il l’apportera »), et « dédommager le propriétaire » ajoute un bénéficiaire que le verset ne nomme pas explicitement. La révision conserve l’implication contextuelle d’une attaque par des bêtes tout en évitant ces ajouts.
