  terminology: « Déchiqueté par des bêtes sauvages » convient au scénario pastoral et à la valeur usuelle de טרף. « Indemniser » rend de manière idiomatique la conséquence juridique de יְשַׁלֵּם sans introduire un objet ou un destinataire absent du texte.
