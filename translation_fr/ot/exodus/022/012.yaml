  text: But if it is torn by beasts[a], he shall bring it as evidence; he shall not make restitution for what was torn.
translation:
  language: fr
  text: Mais si l’animal est déchiqueté par des bêtes sauvages[a], il présentera l’animal déchiqueté comme preuve ; il ne devra pas indemniser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mais si l’animal est bel et bien déchiqueté, il présentera l’animal déchiqueté comme preuve ; il ne devra pas indemniser. »'
    reason: La construction de l’infinitif absolu avec le verbe fini renforce l’idée verbale. La formulation alternative ne précise pas l’agent, qui n’est pas exprimé explicitement dans l’hébreu.
lexical_decisions:
- source_word: אִם
  choice: Mais si
  rationale: Introduit le cas conditionnel suivant tout en marquant son contraste avec le cas précédent dans cette série de lois.
- source_word: טָרֹף יִטָּרֵף
  choice: est déchiqueté par une bête sauvage
  rationale: La construction intensive décrit un animal mis en pièces; dans ce contexte pastoral, l’agent implicite est naturellement une bête sauvage. Une note conserve toutefois la formulation moins explicite possible.
- source_word: יְבִאֵהוּ עֵד
  choice: il apportera les restes comme preuve
  rationale: Le verbe signifie « apporter, présenter » et עֵד désigne ici la fonction probante de ce qui est présenté. « les restes » explicite naturellement en français l’objet pronominal dans ce scénario, sans supposer qu’il faille apporter l’animal intact.
- source_word: הַטְּרֵפָה
  choice: l’animal déchiqueté
  rationale: Le substantif désigne ce qui a été déchiré ou mis en pièces; cette formulation identifie clairement l’animal concerné dans la disposition juridique.
- source_word: לֹא יְשַׁלֵּם
  choice: n’aura pas à dédommager le propriétaire
  rationale: Dans ce contexte juridique, le piel de שלם exprime l’indemnisation ou la restitution. Le propriétaire, bien qu’implicite dans ce verset, est le bénéficiaire évident du paiement selon le contexte immédiat.
