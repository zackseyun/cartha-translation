source:
  edition: WLC
  text: עַֽל כָּל דְּבַר פֶּ֡שַׁע עַל שׁ֡וֹר עַל חֲ֠מוֹר עַל שֶׂ֨ה עַל שַׂלְמָ֜ה עַל כָּל אֲבֵדָ֗ה אֲשֶׁ֤ר יֹאמַר֙ כִּי ה֣וּא זֶ֔ה עַ֚ד הָֽ/אֱלֹהִ֔ים יָבֹ֖א דְּבַר שְׁנֵי/הֶ֑ם אֲשֶׁ֤ר יַרְשִׁיעֻ/ן֙ אֱלֹהִ֔ים יְשַׁלֵּ֥ם שְׁנַ֖יִם לְ/רֵעֵֽ/הוּ־־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/008.yaml
  text: For every case of wrongdoing involving an ox[a], a donkey, a sheep, a garment, or any lost thing about which someone says, ‘This is it,’ the case of both parties shall come before God[b]. The one whom God declares guilty shall pay double to his neighbor.
translation:
  language: fr
  text: 'En toute affaire d’infraction concernant un bœuf, un âne, une tête de petit bétail[a], un vêtement ou tout objet perdu, dont quelqu’un dira : « C’est cela », l’affaire des deux parties sera portée devant Dieu[b]. Celui que Dieu déclarera coupable paiera le double à son prochain.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu désigne une tête de petit bétail, mouton ou chèvre.
    reason: lexical_alternative
  - marker: b
    text: Ou « devant les juges » ou « devant le tribunal ». Dans ce contexte juridique, le mot hébreu אֱלֹהִים peut désigner Dieu directement ou des juges.
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר פֶּשַׁע
  choice: affaire de faute
  rationale: Dans ce contexte juridique, דָּבָר désigne une affaire ou un cas, et פֶּשַׁע une faute ou transgression. Cette formulation reste assez large sans préciser indûment la nature du délit.
- source_word: שׁוֹר
  choice: bœuf
  rationale: Terme français courant et traditionnel pour un bovin dans une liste juridique de biens domestiques.
- source_word: חֲמוֹר
  choice: âne
  rationale: Équivalent moderne, clair et direct du terme hébreu.
- source_word: שֶׂה
  choice: tête de petit bétail
  rationale: Le mot peut désigner un mouton ou une chèvre. Cette formulation française conserve sa portée générique, précisée par une note.
- source_word: שַׂלְמָה
  choice: vêtement
  rationale: Le terme désigne ici une pièce d’habillement sans imposer le sens plus étroit de « manteau ».
- source_word: אֲבֵדָה
  choice: objet perdu
  rationale: Rend naturellement l’idée générale d’un bien perdu dans ce contexte de litige.
- source_word: אֲשֶׁר יֹאמַר כִּי הוּא זֶה
  choice: 'dont quelqu’un dira : « C’est bien cela »'
  rationale: La formule conserve la force démonstrative et l’idée d’identification du bien contesté, sans expliciter davantage la revendication.
- source_word: הָאֱלֹהִים / אֱלֹהִים
  choice: Dieu
  rationale: Le sens lexical direct est « Dieu », tout en reconnaissant qu’en contexte judiciaire le terme peut aussi être compris comme désignant les juges ou le tribunal; cette possibilité est maintenue en note.
- source_word: יָבֹא דְּבַר שְׁנֵיהֶם
  choice: l’affaire des deux parties sera portée
  rationale: Cette tournure idiomatique française exprime clairement la présentation du litige commun devant l’autorité compétente.
- source_word: יַרְשִׁיעֻן
  choice: déclarera coupable
  rationale: Le hifil de רשע exprime ici un verdict de culpabilité, plutôt qu’une condamnation au sens plus large.
- source_word: יְשַׁלֵּם שְׁנַיִם
  choice: paiera le double
  rationale: Rend avec concision l’obligation de restitution au double.
- source_word: לְרֵעֵהוּ
  choice: à son prochain
  rationale: Traduction directe de רֵעַ, qui désigne ici l’autre partie au litige.
theological_decisions:
- issue: Sens de אֱלֹהִים dans ce contexte juridique
  choice: Dieu
  alternative: les juges / le tribunal
  rationale: La forme hébraïque désigne littéralement Dieu, mais son emploi dans un cadre judiciaire peut renvoyer à des juges exerçant une autorité sous son regard. Le texte principal conserve le sens lexical direct et la note préserve l’autre lecture plausible.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe juridique demeure accessible; « tête de petit bétail » préserve l’extension du terme hébreu, tandis que les notes maintiennent les ambiguïtés lexicales et institutionnelles réelles du texte.
