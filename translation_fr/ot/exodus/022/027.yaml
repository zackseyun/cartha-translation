id: EXO.22.27
reference: Exodus 22:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֱלֹהִ֖ים לֹ֣א תְקַלֵּ֑ל וְ/נָשִׂ֥יא בְ/עַמְּ/ךָ֖ לֹ֥א תָאֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/027.yaml
  text: You shall not revile God[a], nor curse a ruler among your people.
translation:
  language: fr
  text: Tu n’outrageras pas Dieu[a] et tu ne maudiras pas un chef au sein de ton peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les juges ». Dans certains contextes, אֱלֹהִים peut désigner des autorités humaines, bien que « Dieu » convienne le mieux au parallélisme ici.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Bien que אֱלֹהִים puisse désigner des dieux ou, dans certains contextes, des autorités humaines, le sens singulier « Dieu » convient le mieux ici. Le parallèle oppose ainsi l’outrage envers Dieu à la malédiction prononcée contre un chef humain. La lecture « les juges » est conservée en note.
- source_word: תְקַלֵּל
  choice: outrageras
  rationale: Au piel, קלל peut exprimer la malédiction, le mépris ou la parole injurieuse. « Outrager » rend ici l’attaque irrespectueuse et préserve une distinction avec תָאֹר, traduit par « maudiras » dans le second membre.
- source_word: נָשִׂיא
  choice: un chef
  rationale: 'נָשִׂיא désigne une personne élevée à une fonction de direction : chef, dirigeant ou prince. « Un chef » est actuel, clair et suffisamment large sans introduire l’idée plus particulière de royauté.'
- source_word: בְעַמְּךָ
  choice: au sein de ton peuple
  rationale: La préposition בְּ situe ici le chef dans la communauté du destinataire. « Au sein de ton peuple » rend naturellement cette relation d’appartenance et de présence.
- source_word: תָאֹר
  choice: maudiras
  rationale: Le verbe ארר est le terme courant pour prononcer une malédiction. « Maudire » en est l’équivalent français direct et naturel.
theological_decisions:
- issue: Référent de אֱלֹהִים
  choice: Dieu
  alternative: les juges ; les dieux
  rationale: Le contexte juridique permet d’envisager des autorités humaines, mais le parallélisme avec « un chef au sein de ton peuple » favorise une distinction entre Dieu et le responsable humain. L’ambiguïté réelle du terme est signalée en note plutôt qu’effacée.
translation_notes:
  register: Français moderne, digne et direct. Le tutoiement singulier reflète les formes hébraïques de deuxième personne. « Outrager » évite le terme plus spécifiquement religieux « blasphémer » et maintient la différence entre les deux verbes hébreux.
