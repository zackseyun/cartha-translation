translation:
  language: fr
  text: Vous ne maltraiterez aucune veuve ni aucun orphelin[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aucun enfant sans père » pour « aucun orphelin ».
    reason: lexical_alternative
  - marker: b
    text: Ou « accablerez » ou « opprimerez » pour « maltraiterez ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: aucune / aucun
  rationale: Avec des noms singuliers dans une interdiction, כָּל a une portée distributive et globale. En français, « aucune veuve ni aucun orphelin » rend naturellement cette valeur.
- source_word: אַלְמָנָה
  choice: veuve
  rationale: Sens lexical direct et usuel du terme hébreu.
- source_word: יָתוֹם
  choice: orphelin
  rationale: Le mot désigne un orphelin, souvent plus précisément un enfant privé de père dans les textes juridiques hébreux. « Orphelin » est le terme français moderne le plus naturel.
- source_word: לֹא
  choice: ne… aucune… ni aucun
  rationale: La négation hébraïque exprime ici une interdiction; la construction française négative en restitue clairement la force.
- source_word: תְעַנּוּן
  choice: maltraiterez
  rationale: Au piel, ענה signifie ici faire souffrir ou soumettre à un traitement dur. « Maltraiter » est naturel en français moderne et conserve une portée assez large, sans limiter le sens à l'oppression économique.
