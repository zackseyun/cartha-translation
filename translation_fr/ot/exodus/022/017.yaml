  text: You shall not let a sorceress live[a].
translation:
  language: fr
  text: Tu ne laisseras pas vivre une sorcière[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une femme qui pratique la sorcellerie ». Le nom hébreu est au féminin singulier.
    reason: Variante lexicale et précision grammaticale.
lexical_decisions:
- source_word: מְכַשֵּׁפָה
  choice: une femme qui pratique la sorcellerie
  rationale: Le nom hébreu est au féminin singulier et désigne une femme qui pratique la magie ou la sorcellerie. Cette formulation naturelle en français moderne préserve explicitement le genre sans les connotations parfois folkloriques de « sorcière ».
- source_word: לֹא
  choice: ne… pas
  rationale: Négation ordinaire, intégrée ici à la tournure juridique au futur.
- source_word: תְחַיֶּה
  choice: tu ne laisseras pas vivre
  rationale: Le piel inaccompli, deuxième personne masculine singulière, de חיה a ici le sens de « maintenir en vie » ou « laisser vivre ». La traduction conserve la formulation hébraïque sans l'expliciter en « mettre à mort ».
theological_decisions:
- issue: Genre de la personne visée
  choice: Conserver le féminin singulier par « une femme qui pratique la sorcellerie ».
  alternative: Employer le terme générique « quiconque pratique la sorcellerie » ou le masculin « sorcier ».
  rationale: La forme hébraïque est explicitement féminine ; la neutraliser ferait disparaître une donnée du texte source.
- issue: Portée de l'interdiction juridique
  choice: Traduire littéralement l'interdiction de laisser vivre.
  alternative: Expliciter par « devra être mise à mort » ou « tu la mettras à mort ».
  rationale: Même si le contexte juridique implique une peine capitale, l'hébreu dit précisément « tu ne laisseras pas vivre » ; la traduction n'ajoute donc ni formule judiciaire ni mode d'exécution.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur impérative convient au registre juridique biblique. « Une femme qui pratique la sorcellerie » est plus explicite et moins chargé culturellement que « sorcière », lequel est néanmoins signalé en note.
