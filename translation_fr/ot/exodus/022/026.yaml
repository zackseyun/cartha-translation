base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/026.yaml
  text: For it is his only covering; it is his cloak for his skin. In what will he lie down? And if he cries out to me[a], I will hear, for I am compassionate.
translation:
  language: fr
  text: 'Car c’est sa seule couverture : c’est le vêtement qui couvre sa peau. Dans quoi se couchera-t-il ? S’il crie vers moi, je l’entendrai, car je suis compatissant[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bienveillant », « miséricordieux » ou « clément ».
    reason: Alternative lexicale pour חַנּוּן.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison du commandement formulé au verset précédent.
- source_word: כְּסוּתֹה לְבַדָּהּ
  choice: sa seule couverture
  rationale: Rend naturellement l’idée que cette pièce d’étoffe est l’unique couverture dont dispose le débiteur.
- source_word: שִׂמְלָתוֹ לְעֹרוֹ
  choice: le vêtement qui couvre sa peau
  rationale: Conserve l’image concrète de la peau tout en exprimant clairement en français la fonction du vêtement.
- source_word: בַּמֶּה יִשְׁכָּב
  choice: Dans quoi se couchera-t-il ?
  rationale: Préserve la question rhétorique et le sens concret de שׁכב, sans réduire celle-ci au seul sommeil.
- source_word: וְהָיָה כִּי יִצְעַק אֵלַי
  choice: S’il crie vers moi
  rationale: La construction introduit une éventualité future; cette formulation française est naturelle et צעק garde la force d’un appel pressant lancé dans la détresse.
- source_word: וְשָׁמַעְתִּי
  choice: je l’entendrai
  rationale: Le pronom explicite naturellement en français que Dieu entendra l’homme qui crie, sans modifier le sens.
- source_word: חַנּוּן
  choice: compatissant
  rationale: Dans ce contexte de vulnérabilité et de détresse, ce terme exprime clairement la disposition divine à faire grâce et à prendre pitié.
theological_decisions:
- issue: Traduction de l’auto-description divine חַנּוּן
  choice: compatissant
  alternative: bienveillant; miséricordieux; clément
  rationale: « Compatissant » met en relief la réponse de Dieu à la détresse du pauvre sans restreindre le terme à une formulation doctrinale particulière; les autres traductions demeurent lexicalement possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’enchaînement explicatif, l’image concrète du vêtement sur la peau, la question rhétorique et la déclaration du caractère de Dieu.
