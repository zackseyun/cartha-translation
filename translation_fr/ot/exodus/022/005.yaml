base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/005.yaml
  text: If a fire breaks out and catches in thorns[a], so that stacked grain or standing grain or the field is consumed[b], the one who started the fire must surely make restitution.
translation:
  language: fr
  text: Si un feu se déclare et atteint des buissons épineux[a], de sorte qu’il consume du grain entassé, du grain sur pied ou le champ, celui qui a allumé le feu devra pleinement réparer le dommage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « trouve des épineux ». Dans ce contexte, le feu atteint les épineux ou y prend.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu renforce l’obligation de réparer par la répétition de deux formes du même verbe ; on peut aussi traduire : « devra certainement indemniser ».'
    reason: source_form
lexical_decisions:
- source_word: כִּי
  choice: Si
  rationale: Introduit une situation hypothétique de droit casuistique; « si » est naturel et conserve la valeur conditionnelle.
- source_word: תֵצֵא אֵשׁ
  choice: un feu se déclare
  rationale: Rend naturellement l’idée d’un feu qui part ou se propage, et non celle d’un feu qui s’éteint.
- source_word: וּמָצְאָה קֹצִים
  choice: et atteint des buissons épineux
  rationale: Le verbe signifie littéralement « trouve »; dans ce contexte, le feu parvient aux épineux. La formulation évite de préciser au-delà de l’hébreu s’ils prennent eux-mêmes feu.
- source_word: קֹצִים
  choice: des buissons épineux
  rationale: Expression claire en français moderne pour des épineux susceptibles de transmettre l’incendie; « épines » serait plus littéral mais moins naturel ici.
- source_word: וְנֶאֱכַל
  choice: consume
  rationale: Le passif hébreu exprime ce qui est dévoré ou consumé par le feu; la construction française active garde le feu comme sujet grammatical naturel.
- source_word: גָּדִישׁ
  choice: du grain entassé
  rationale: Désigne la récolte déjà rassemblée en tas, en contraste avec le grain encore sur pied.
- source_word: הַקָּמָה
  choice: du grain sur pied
  rationale: Rend précisément la céréale non encore moissonnée qui se tient dans le champ.
- source_word: הַשָּׂדֶה
  choice: le champ
  rationale: Équivalent direct, sans réduire le terme aux seules cultures.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: devra pleinement réparer le dommage
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’obligation d’indemniser; « pleinement » exprime cette insistance en français juridique accessible.
- source_word: הַמַּבְעִר אֶת הַבְּעֵרָה
  choice: celui qui a allumé le feu
  rationale: Formulation idiomatique qui désigne clairement la personne responsable d’avoir provoqué l’incendie.
