  yaml_path: translation/ot/exodus/022/030.yaml
  text: And you shall be holy men to me[a]. You shall not eat flesh torn in the field[b]; you shall throw it to the dogs.
translation:
  language: fr
  text: Vous serez pour moi des hommes saints. Vous ne mangerez pas de chair déchirée dans les champs[a] ; vous la jetterez aux chiens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de la chair déchirée par des bêtes dans les champs ». L’hébreu dit simplement « chair… déchirée » et ne précise pas qui l’a déchirée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי קֹדֶשׁ
  choice: des hommes saints
  rationale: Le syntagme construit signifie littéralement « hommes de sainteté », soit naturellement « hommes saints ». Ce choix conserve le masculin pluriel explicite de l’hébreu, sans exclure que ces hommes représentent la communauté de l’alliance.
- source_word: תִּהְיוּן לִי
  choice: vous serez pour moi
  rationale: Cette formulation préserve à la fois l’obligation et la relation d’appartenance exprimées par היה avec לִי.
- source_word: בָשָׂר ... טְרֵפָה
  choice: la chair d’une bête déchiquetée
  rationale: בָשָׂר désigne ici la chair destinée à être mangée, tandis que טְרֵפָה qualifie une bête ou sa chair mise en pièces. La formulation française rend clairement le référent animal sans préciser l’agent, que l’hébreu laisse implicite.
- source_word: בַּשָּׂדֶה
  choice: dans les champs
  rationale: Le pluriel générique est naturel en français pour désigner la campagne ou les espaces ouverts, tout en gardant l’image concrète du שָׂדֶה hébreu.
- source_word: לֹא תֹאכֵלוּ
  choice: vous ne mangerez pas
  rationale: Le futur à valeur injonctive convient au style juridique français moderne et exprime directement l’interdiction.
- source_word: לַכֶּלֶב
  choice: aux chiens
  rationale: Bien que l’hébreu emploie un singulier générique, le pluriel français est idiomatique pour les chiens auxquels on abandonne une carcasse.
- source_word: תַּשְׁלִכוּן אֹתוֹ
  choice: vous la jetterez
  rationale: « Jeter » est l’équivalent moderne et direct du hiphil de שלך. Le pronom féminin reprend naturellement « chair » en français.
theological_decisions:
- issue: La sainteté dans la législation de l’alliance
  choice: « Vous serez pour moi des hommes saints »
  alternative: « Vous serez pour moi un peuple saint »
  rationale: La formulation retenue conserve la sainteté, l’appartenance à Dieu et le masculin pluriel explicite de אַנְשֵׁי. « Peuple saint » exprimerait bien la portée communautaire probable, mais remplacerait le substantif « hommes » présent dans la source.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur injonctif maintient le ton juridique sans archaïsme. « Déchiquetée » communique plus naturellement que « déchirée » l’idée d’une carcasse mise en pièces. Le marqueur [a] figure dans le texte à l’endroit concerné.
