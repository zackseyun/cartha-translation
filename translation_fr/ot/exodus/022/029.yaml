source:
  edition: WLC
  text: כֵּֽן תַּעֲשֶׂ֥ה לְ/שֹׁרְ/ךָ֖ לְ/צֹאנֶ֑/ךָ שִׁבְעַ֤ת יָמִים֙ יִהְיֶ֣ה עִם אִמּ֔/וֹ בַּ/יּ֥וֹם הַ/שְּׁמִינִ֖י תִּתְּנ/וֹ לִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/029.yaml
  text: 'You shall do the same with your ox and with your flock: seven days it shall remain with its mother[b][a]; on the eighth day you shall give it to me.'
translation:
  language: fr
  text: 'Tu feras de même[b] pour ton bœuf et pour ton petit bétail : pendant sept jours, il restera auprès de sa mère[a] ; le huitième jour, tu me le donneras.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il sera avec sa mère ». L’hébreu dit littéralement « il sera avec sa mère » ; « restera » fait ressortir la durée indiquée par le contexte.
    reason: lexical_alternative
  - marker: b
    text: L’ordre prolonge la prescription précédente concernant les offrandes des premiers-nés ; l’hébreu ne répète pas ici le mot « premier-né ».
    reason: cross_reference
lexical_decisions:
- source_word: כֵּן
  choice: de même
  rationale: Cette expression relie naturellement la prescription à celle qui précède et conserve la valeur comparative de l’hébreu.
- source_word: תַּעֲשֶׂה
  choice: tu feras
  rationale: Dans cette instruction juridique, le futur français exprime avec naturel la force prescriptive de la forme hébraïque.
- source_word: לְשֹׁרְךָ
  choice: pour ton bœuf
  rationale: La préposition introduit ici ce à quoi la règle s’applique. « Bœuf » conserve le terme générique du contexte juridique sans préciser indûment le sexe.
- source_word: לְצֹאנְךָ
  choice: pour ton petit bétail
  rationale: צֹאן désigne collectivement les ovins et les caprins. « Petit bétail » rend cette portée plus précisément que le seul mot « troupeau ».
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: La préposition « pendant » explicite naturellement en français l’accusatif hébreu de durée.
- source_word: יִהְיֶה עִם אִמּוֹ
  choice: il restera auprès de sa mère
  rationale: Littéralement, « il sera avec sa mère ». « Restera » fait ressortir la durée imposée par le contexte, tandis que « auprès de » convient naturellement au jeune animal.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: le huitième jour
  rationale: Formulation temporelle exacte, idiomatique et digne en français moderne.
- source_word: תִּתְּנוֹ לִי
  choice: tu me le donneras
  rationale: Rend directement le verbe נתן, son suffixe objet et le complément « à moi », sans ajouter l’idée plus spécifique de présentation sacrificielle.
theological_decisions:
- issue: Référent de l’ordre dans son rapport avec les premiers-nés
  choice: Le texte principal maintient le lien avec la prescription précédente par « de même », sans ajouter « premier-né », absent de ce verset hébreu.
  alternative: Insérer « son premier-né » afin d’expliciter le référent fourni par le contexte précédent.
  rationale: L’hébreu compte sur le contexte immédiat pour identifier l’animal concerné. Ne pas ajouter « premier-né » préserve la concision et la structure du texte source, tandis qu’une note signale clairement ce lien contextuel.
translation_notes:
  register: Français international moderne, clair et digne. Le futur simple garde la tonalité prescriptive du texte juridique. « Petit bétail » désigne collectivement les moutons et les chèvres sans réduire le champ du terme hébreu.
