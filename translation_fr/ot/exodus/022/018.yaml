  yaml_path: translation/ot/exodus/022/018.yaml
  text: Whoever lies with an animal shall surely be put to death[a].
translation:
  language: fr
  text: Quiconque couche avec un animal sera mis à mort[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « sera certainement mis à mort ». La formule juridique hébraïque exprime avec insistance la certitude de la peine de mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Quiconque
  rationale: Avec le participe qui suit, כָּל forme une expression générale indéfinie. « Quiconque » la rend naturellement et avec la solennité appropriée au contexte juridique.
- source_word: שֹׁכֵב
  choice: couche avec
  rationale: Le participe qal de שׁכב suivi de עִם est un euphémisme sexuel courant. « Coucher avec » conserve cet idiome tout en restant clair en français moderne.
- source_word: עִם
  choice: avec
  rationale: La préposition relie directement le verbe à son complément.
- source_word: בְּהֵמָה
  choice: un animal
  rationale: בְּהֵמָה désigne ici un animal. Ce choix est clair et actuel, tandis que « une bête » pourrait paraître vieilli ou chargé.
- source_word: מוֹת יוּמָת
  choice: sera mis à mort
  rationale: L’infinitif absolu associé à la forme verbale passive renforce la certitude de la peine. En français juridique, « sera mis à mort » exprime nettement la sanction capitale; une note signale l’intensification hébraïque.
theological_decisions:
- issue: Formulation de la peine capitale légale
  choice: sera mis à mort
  alternative: mourra certainement
  rationale: La construction hébraïque est une formule juridique qui présente la mort comme une peine certaine et subie. Le texte principal explicite la valeur passive et judiciaire sans préciser l’agent; la note conserve une traduction plus littérale.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve l’euphémisme sexuel de l’hébreu et le caractère juridique de la sanction, sans archaïsme ni précision interprétative ajoutée.
