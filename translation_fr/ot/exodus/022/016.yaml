review_pass:
  verdict: revise
  source_fidelity: 'Le sens juridique est bien rendu : le refus emphatique du père, le consentement au mariage et l’obligation de verser l’équivalent du mohar sont préservés. Toutefois, « une somme d’argent » atténue inutilement le כֶּסֶף (« argent », métal monnayable/pesé), et « fixé » ajoute l’idée d’une fixation formelle absente du texte. La note sur le pesage justifie une formulation plus directe dans le texte.'
  naturalness: La phrase est claire et naturelle en français moderne. « Versera de l’argent » est idiomatique dans un registre juridique et permet de conserver le référent concret sans lourdeur.
  terminology: « Prix matrimonial » est possible, mais « dot nuptiale » risquerait une confusion avec la dot apportée par la femme dans l’usage français moderne. « Prix matrimonial » est donc conservé. « Jeunes filles vierges » traduit correctement הַבְּתוּלֹת, quoique « vierges » suffise ; le maintien de « jeunes filles vierges » est explicite et non fautif.
  issues:
  - severity: medium
    issue: « une somme d’argent » et « fixé »
    rationale: Le texte hébreu dit littéralement qu’il pèsera de l’argent, selon le mohar des vierges. « Une somme » est une paraphrase acceptable mais moins précise, et « fixé » introduit une notion administrative/formelle qui n’est pas exprimée. « De l’argent équivalant au prix matrimonial des jeunes filles vierges » est plus fidèle tout en restant naturel.
  revised_text: Si son père refuse catégoriquement de la lui donner en mariage, l’homme versera[a] de l’argent équivalant au prix matrimonial des jeunes filles vierges.
