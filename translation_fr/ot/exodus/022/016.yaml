translation_notes:
  register: Français international moderne, clair et digne. La formulation juridique reste naturelle; « l’homme » explicite le sujet masculin implicite du verbe afin d’éviter qu’en français « il » renvoie au père. Le marqueur [a] est placé immédiatement après le verbe auquel la note se rapporte.
