  text: If her father absolutely refuses to give her to him[b][a], he shall weigh out silver equal to the bride-price for virgins.
translation:
  language: fr
  text: Si son père refuse catégoriquement de la lui donner en mariage, l’homme versera[a] de l’argent équivalant au prix matrimonial des jeunes filles vierges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pèsera de l’argent ». À cette époque, le paiement se faisait en pesant le métal plutôt qu’avec des pièces de monnaie.'
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Particule conditionnelle usuelle introduisant le cas juridique.
- source_word: מָאֵן יְמָאֵן
  choice: refuse catégoriquement
  rationale: L’infinitif absolu suivi du verbe conjugué renforce le refus; « catégoriquement » restitue cette insistance en français naturel.
- source_word: אָבִיהָ
  choice: son père
  rationale: Rend directement le nom avec suffixe possessif féminin singulier.
- source_word: לְתִתָּהּ לוֹ
  choice: de la lui donner en mariage
  rationale: Littéralement « de la lui donner »; dans ce contexte juridique, l’expression désigne le consentement du père au mariage. L’explicitation évite en français une formulation obscure ou équivoque.
- source_word: כֶּסֶף יִשְׁקֹל
  choice: l’homme versera une somme d’argent
  rationale: כֶּסֶף signifie littéralement « argent » au sens du métal, et יִשְׁקֹל « peser ». La formulation exprime naturellement l’obligation de paiement, tandis que la note conserve la pratique ancienne du métal pesé.
- source_word: כְּמֹהַר
  choice: équivalente au prix matrimonial fixé
  rationale: מֹהַר désigne le paiement matrimonial remis à la famille de la jeune femme; « prix matrimonial » est concis et moins susceptible d’évoquer l’achat d’une personne que « prix de la fiancée ». Le préfixe כְּ exprime ici la conformité au montant usuel.
- source_word: הַבְּתוּלֹת
  choice: pour les jeunes filles vierges
  rationale: Le pluriel défini désigne de manière générale la catégorie à laquelle s’applique le montant matrimonial coutumier.
