id: EXO.22.4
reference: Exodus 22:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י יַבְעֶר אִישׁ֙ שָׂדֶ֣ה אוֹ כֶ֔רֶם וְ/שִׁלַּח֙ אֶת בעיר/ה וּ/בִעֵ֖ר בִּ/שְׂדֵ֣ה אַחֵ֑ר מֵיטַ֥ב שָׂדֵ֛/הוּ וּ/מֵיטַ֥ב כַּרְמ֖/וֹ יְשַׁלֵּֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/004.yaml
  text: If a man causes a field or vineyard to be grazed over[a], and lets his animal loose so that it grazes in another man's field[b], he shall make restitution from the best of his own field and the best of his own vineyard.
translation:
  language: fr
  text: Si un homme fait brouter un champ ou une vigne[a], puis laisse son animal en liberté, de sorte qu’il broute dans le champ d’autrui[b], il donnera en compensation le meilleur de son propre champ et le meilleur de sa propre vigne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fait brûler un champ ou une vigne ». Le verbe hébreu בער peut évoquer le feu dans certains contextes, mais la mention immédiate de l’animal relâché favorise fortement ici le sens de faire brouter ou consommer par le bétail.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans un autre champ »; le possesseur est implicite dans ce contexte juridique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Si
  rationale: Dans cette loi formulée comme un cas, כִּי introduit une condition; « Si » est la tournure juridique française la plus naturelle.
- source_word: יַבְעֶר
  choice: fait brouter
  rationale: Le hifil exprime ici le fait de causer la consommation par le pâturage. La mention immédiate de l’animal relâché favorise ce sens plutôt que celui de brûler.
- source_word: שָׂדֶה אוֹ כֶרֶם
  choice: un champ ou une vigne
  rationale: Traduction directe des deux termes agricoles, en conservant le singulier du cas juridique hébreu.
- source_word: וְשִׁלַּח אֶת־בְּעִירֹה
  choice: puis laisse son animal en liberté
  rationale: שִׁלַּח signifie envoyer ou relâcher, et בְּעִירֹה désigne ici son animal domestique. Cette formulation est naturelle en français et rend clairement le scénario.
- source_word: וּבִעֵר בִּשְׂדֵה אַחֵר
  choice: de sorte qu’il broute dans le champ d’autrui
  rationale: La répétition de בער prolonge l’idée de consommation par le pâturage. « De sorte que » explicite le lien de conséquence sans modifier la portée juridique.
- source_word: אַחֵר
  choice: d’autrui
  rationale: L’hébreu dit littéralement « un autre [champ] »; dans ce contexte de dommages, « le champ d’autrui » exprime naturellement la possession implicite.
- source_word: מֵיטַב שָׂדֵהוּ וּמֵיטַב כַּרְמוֹ
  choice: le meilleur de son propre champ et le meilleur de sa propre vigne
  rationale: מֵיטַב désigne la partie la meilleure ou la plus précieuse. « Propre » précise que la compensation provient des biens du responsable.
- source_word: יְשַׁלֵּם
  choice: il donnera en compensation
  rationale: Le piel de שׁלם désigne ici la réparation matérielle d’un dommage. Cette expression française rend la force compensatoire du verbe.
