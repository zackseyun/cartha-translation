  text: וְ/כִֽי יִשְׁאַ֥ל אִ֛ישׁ מֵ/עִ֥ם רֵעֵ֖/הוּ וְ/נִשְׁבַּ֣ר אוֹ מֵ֑ת בְּעָלָ֥י/ו אֵין עִמּ֖/וֹ שַׁלֵּ֥ם יְשַׁלֵּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/013.yaml
  text: And if a man borrows from his neighbor[a], and it is injured or dies, if its owner is not with it[b], he shall surely make restitution.
translation:
  language: fr
  text: Si un homme emprunte quelque chose à son prochain et que ce qu’il a emprunté est endommagé[a] ou meurt, si son propriétaire n’est pas avec lui[b], il devra payer intégralement[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « est brisé ». Le terme hébreu peut désigner les dégâts subis par un objet emprunté ou la blessure d’un animal emprunté.'
    reason: lexical_alternative
  - marker: b
    text: Le pronom hébreu signifie « avec lui » et renvoie le plus naturellement à ce qui a été emprunté, notamment à un animal dans ce cas possible. Le sens juridique est que le propriétaire n’était pas présent avec lui.
    reason: referential_ambiguity
  - marker: c
    text: 'L’hébreu répète une racine liée à l’idée de paiement ou de réparation pour renforcer l’obligation : il devra effectivement payer, ou payer pleinement.'
    reason: source_idiom
lexical_decisions:
- source_word: וְכִי
  choice: Si
  rationale: Introduit naturellement en français un nouveau cas conditionnel dans cette collection de lois; la coordination hébraïque n’a pas besoin d’être rendue mécaniquement par « Et ».
- source_word: יִשְׁאַל
  choice: emprunte
  rationale: Dans ce contexte juridique, le verbe désigne l’emprunt d’un bien, et non une simple demande.
- source_word: אִישׁ
  choice: un homme
  rationale: Reproduit le masculin singulier du cas juridique hébreu sans exclure la portée générale de la règle.
- source_word: מֵעִם רֵעֵהוּ
  choice: à son prochain
  rationale: « Prochain » exprime ici le membre de la communauté avec lequel on est en relation et convient au registre juridique biblique tout en restant intelligible.
- source_word: וְנִשְׁבַּר
  choice: est endommagé
  rationale: Le verbe signifie littéralement « est brisé », mais peut décrire soit les dégâts subis par un objet, soit la blessure d’un animal; « endommagé » garde une portée assez large, avec une note signalant l’alternative.
- source_word: אוֹ מֵת
  choice: ou meurt
  rationale: Le verbe « mourir » montre que le bien emprunté peut être un animal, sans qu’il soit nécessaire d’ajouter ce nom absent de l’hébreu.
- source_word: בְּעָלָיו
  choice: son propriétaire
  rationale: Bien que le nom ait une forme morphologiquement plurielle, il désigne idiomatiquement ici le propriétaire singulier de ce qui a été emprunté.
- source_word: אֵין עִמּוֹ
  choice: n’est pas avec lui
  rationale: Cette formulation conserve le pronom masculin de l’hébreu et son référent potentiellement ambigu, au lieu de préciser sans nécessité « avec l’animal » ou « avec l’emprunteur ».
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: devra payer intégralement
  rationale: La construction intensive infinitif absolu plus verbe conjugué souligne le caractère certain et complet de l’obligation de paiement.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne, avec une syntaxe de cas juridique. La répétition « emprunte… ce qu’il a emprunté » évite d’ajouter un objet ou un animal que l’hébreu ne nomme pas, tout en gardant la phrase immédiatement compréhensible.
