  yaml_path: translation/ot/exodus/022/003.yaml
  text: If the stolen item is actually found alive in his possession—whether ox[a], donkey, or sheep—he shall repay double.
translation:
  language: fr
  text: Si l’animal volé est bel et bien retrouvé vivant en sa possession[a], qu’il s’agisse d’un bœuf, d’un âne ou d’une bête de petit bétail[b], il devra en rendre le double.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « dans sa main ». Dans ce contexte juridique, l’expression hébraïque désigne la possession ou le contrôle. La construction verbale traduite par « bel et bien retrouvé » est emphatique.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut désigner une bête du petit bétail, telle qu’un mouton ou une chèvre.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit naturellement en français la condition propre à cette disposition juridique.
- source_word: הִמָּצֵא תִמָּצֵא
  choice: est bel et bien retrouvée
  rationale: La construction associant l’infinitif absolu et le verbe conjugué renforce l’idée verbale. « Bel et bien » restitue cette insistance dans un français actuel et naturel.
- source_word: בְיָדוֹ
  choice: en sa possession
  rationale: Littéralement « dans sa main » ; dans ce contexte juridique, l’expression désigne ce qui se trouve sous le contrôle ou en la possession du voleur.
- source_word: הַגְּנֵבָה
  choice: la bête volée
  rationale: Le nom désigne ici le bien volé, et la suite du verset précise qu’il s’agit d’animaux. « La bête volée » est clair et permet l’accord naturel avec « vivante ».
- source_word: מִשּׁוֹר עַד חֲמוֹר עַד שֶׂה
  choice: qu’il s’agisse d’un bœuf, d’un âne ou d’un mouton
  rationale: Cette formulation rend idiomatiquement l’énumération des catégories de bétail visées par la règle.
- source_word: חַיִּים
  choice: vivante
  rationale: Indique que la bête volée est retrouvée en vie, par contraste avec un animal abattu ou autrement perdu.
- source_word: שְׁנַיִם יְשַׁלֵּם
  choice: il rendra le double
  rationale: Restitue avec concision la formule juridique imposant une restitution au double.
