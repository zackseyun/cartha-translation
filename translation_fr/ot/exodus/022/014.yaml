  yaml_path: translation/ot/exodus/022/014.yaml
  text: If its owner is with it[a], he shall not make restitution; if it is a hired thing, it came for its hire.
translation:
  language: fr
  text: Si le propriétaire est présent avec l’animal, l’emprunteur n’a pas à indemniser. Si l’animal est loué[a], le prix de la location couvre la perte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre lecture possible : « S’il s’agit d’un salarié, il est venu pour son salaire. » L’hébreu est très concis et peut désigner soit l’animal loué, soit un travailleur salarié.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעָלָיו
  choice: son propriétaire
  rationale: Dans cette règle juridique, בַּעַל désigne naturellement le propriétaire de l’animal ou du bien mentionné dans le contexte.
- source_word: עִמּוֹ
  choice: est avec lui
  rationale: Le suffixe masculin singulier renvoie le plus naturellement à l’animal emprunté. Cette formulation conserve la relation exprimée par l’hébreu sans alourdir la phrase.
- source_word: לֹא יְשַׁלֵּם
  choice: il n’aura pas à verser de compensation
  rationale: À la forme piel et dans un contexte juridique, שׁלם exprime le fait d’indemniser ou de réparer financièrement un dommage, et non simplement de payer.
- source_word: שָׂכִיר
  choice: l’animal était loué
  rationale: Bien que שָׂכִיר désigne souvent un salarié, le contexte immédiat traite de la responsabilité liée à un animal emprunté ou loué. Le français explicite donc l’ellipse probable tout en signalant l’autre lecture en note.
- source_word: בָּא בִּשְׂכָרוֹ
  choice: le prix de la location couvre la perte
  rationale: L’expression hébraïque, littéralement « il est venu dans/pour son salaire », est très elliptique. Dans la lecture où il s’agit de l’animal loué, elle indique que le risque de perte est compris dans le prix de location.
theological_decisions:
- issue: Référent de שָׂכִיר et du suffixe dans בִּשְׂכָרוֹ
  choice: La proposition concerne l’animal loué et le prix de sa location.
  alternative: La proposition concerne un salarié venu pour son salaire.
  rationale: La première lecture s’intègre directement au cas juridique des biens empruntés et loués, mais la syntaxe hébraïque permet une lecture personnelle. Cette ambiguïté réelle est conservée dans une note.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire juridique reste accessible ; la dernière proposition rend explicitement le sens probable d’un idiome hébreu particulièrement elliptique.
