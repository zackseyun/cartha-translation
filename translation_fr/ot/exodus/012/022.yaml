source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֞ם אֲגֻדַּ֣ת אֵז֗וֹב וּ/טְבַלְתֶּם֮ בַּ/דָּ֣ם אֲשֶׁר בַּ/סַּף֒ וְ/הִגַּעְתֶּ֤ם אֶל הַ/מַּשְׁקוֹף֙ וְ/אֶל שְׁתֵּ֣י הַ/מְּזוּזֹ֔ת מִן הַ/דָּ֖ם אֲשֶׁ֣ר בַּ/סָּ֑ף וְ/אַתֶּ֗ם לֹ֥א תֵצְא֛וּ אִ֥ישׁ מִ/פֶּֽתַח בֵּית֖/וֹ עַד בֹּֽקֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/022.yaml
  text: And you shall take a bunch of hyssop and dip it in the blood that is in the basin[a], and touch the lintel and the two doorposts with some of the blood that is in the basin. And none of you shall go out from the entrance of his house until morning.
translation:
  language: fr
  text: Vous prendrez un bouquet d’hysope et vous le tremperez dans le sang qui est dans le bassin[a]. Vous toucherez le linteau et les deux montants de la porte avec une partie du sang qui est dans le bassin. Aucun de vous ne sortira par l’entrée de sa maison jusqu’au matin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « seuil ». Le mot hébreu peut avoir ce sens, mais « bassin » est retenu ici parce que le sang s’y trouve et que l’hysope y est trempée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגֻדַּת אֵזוֹב
  choice: un bouquet d’hysope
  rationale: אֲגֻדָּה désigne un assemblage lié ou groupé. « Bouquet » est concret et naturel en français, tout en convenant à l’instrument rituel décrit.
- source_word: אֵזוֹב
  choice: hysope
  rationale: Équivalent traditionnel du terme végétal dans les contextes rituels. L’identification botanique précise reste discutée, mais « hysope » demeure la désignation française conventionnelle.
- source_word: בַּדָּם
  choice: dans le sang
  rationale: Avec טבל, la préposition ב désigne ce dans quoi l’objet est trempé. Cette formulation est à la fois proche de l’hébreu et idiomatique.
- source_word: הַסַּף
  choice: le bassin
  rationale: Dans ce contexte, le sang est dit être « dans » le סַף et l’hysope y est trempée, ce qui favorise le sens d’un récipient. Le sens possible de « seuil » est conservé en note.
- source_word: וְהִגַּעְתֶּם
  choice: vous toucherez
  rationale: Le hiphil de נגע exprime ici la mise en contact. « Toucher » conserve l’image concrète sans expliciter davantage le geste par « appliquer » ou « asperger ».
- source_word: הַמַּשְׁקוֹף
  choice: le linteau
  rationale: Terme architectural précis désignant la partie horizontale supérieure de l’encadrement d’une porte.
- source_word: שְׁתֵּי הַמְּזוּזֹת
  choice: les deux montants de la porte
  rationale: מְזוּזוֹת désigne les éléments verticaux de l’encadrement. La précision « de la porte » rend le référent immédiatement clair.
- source_word: מִן הַדָּם
  choice: avec une partie du sang
  rationale: Après le verbe de contact, מִן indique que le sang employé est prélevé de celui qui se trouve dans le bassin. Cette formulation rend clairement la valeur partitive et instrumentale.
- source_word: לֹא תֵצְאוּ אִישׁ
  choice: Aucun de vous ne sortira
  rationale: אִישׁ donne à l’interdiction plurielle une portée distributive. « Aucun de vous » en exprime naturellement le sens.
- source_word: מִפֶּתַח בֵּיתוֹ
  choice: par l’entrée de sa maison
  rationale: פֶּתַח désigne l’ouverture ou l’entrée. « Sortir par l’entrée » est naturel en français et maintient la référence concrète au passage de la maison, tandis que « sa maison » conserve la construction distributive singulière.
- source_word: עַד בֹּקֶר
  choice: jusqu’au matin
  rationale: Traduction directe et idiomatique de l’expression temporelle.
theological_decisions:
- issue: Expression distributive genrée אִישׁ ... בֵּיתוֹ
  choice: Aucun de vous ne sortira par l’entrée de sa maison
  alternative: Aucun de vous ne sortira de chez lui ; Que personne ne sorte de sa maison
  rationale: Le masculin singulier hébreu a ici une fonction représentative et distributive, non une portée limitée aux hommes. Le singulier « sa maison » préserve cette structure sans ajouter une exclusion.
- issue: Sens de הַסַּף dans ce verset
  choice: bassin
  alternative: seuil
  rationale: La syntaxe immédiate parle du sang qui se trouve « dans » le סַף et dans lequel on trempe l’hysope, ce qui favorise fortement le sens de récipient. Comme « seuil » reste une possibilité lexicale réelle, elle est signalée en note plutôt qu’écartée silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur rend naturellement la valeur injonctive des formes hébraïques dans cette suite de prescriptions. Le vocabulaire architectural reste précis, et l’ambiguïté de סַף est explicitement préservée en note.
