  text: So the people carried their dough before it was leavened[a], with their kneading bowls bound up in their cloaks on their shoulders.
translation:
  language: fr
  text: Le peuple emporta donc sa pâte avant qu’elle ait levé, avec ses récipients à pétrir[a] enveloppés dans ses manteaux et portés sur ses épaules.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pétrins ». Le terme hébreu désigne des récipients utilisés pour préparer la pâte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: emporta
  rationale: Dans ce récit de départ, נשׂא désigne le fait de prendre et de transporter des objets avec soi. « Emporta » exprime naturellement le mouvement du départ.
- source_word: הָעָם
  choice: le peuple
  rationale: עָם désigne ici collectivement le peuple d’Israël. « Le peuple » est la formulation française la plus directe.
- source_word: בְּצֵקוֹ
  choice: sa pâte
  rationale: Le suffixe hébreu est grammaticalement singulier et renvoie au nom collectif « le peuple ». Le singulier français « sa pâte » conserve cette construction sans lourdeur.
- source_word: טֶרֶם יֶחְמָץ
  choice: avant qu’elle ait levé
  rationale: La proposition indique que la pâte n’avait pas encore subi la levée. « Avant qu’elle ait levé » est une expression courante et précise en français.
- source_word: מִשְׁאֲרֹתָם
  choice: ses pétrins
  rationale: Le nom désigne des récipients servant à préparer ou pétrir la pâte. « Pétrins » est concis et intelligible, tout en laissant en note une autre formulation possible.
- source_word: צְרֻרֹת
  choice: enveloppés
  rationale: Le participe passif de צרר évoque des objets réunis et attachés en paquet. Dans ce contexte, « enveloppés » décrit naturellement les récipients emballés dans les manteaux.
- source_word: בְּשִׂמְלֹתָם
  choice: dans ses manteaux
  rationale: שִׂמְלָה désigne couramment un vêtement extérieur. « Manteaux » rend concrètement l’usage de ces vêtements comme emballage.
- source_word: עַל שִׁכְמָם
  choice: sur ses épaules
  rationale: L’expression situe les paquets sur les épaules du peuple. Le possessif singulier s’accorde grammaticalement avec le collectif « le peuple », tout en gardant son sens collectif.
theological_decisions: []
translation_notes:
  register: 'Français moderne, clair et digne. Les possessifs au singulier suivent grammaticalement le nom collectif « le peuple ». La phrase conserve l’enchaînement concret du texte hébreu : pâte non levée, récipients enveloppés, puis portés sur les épaules.'
