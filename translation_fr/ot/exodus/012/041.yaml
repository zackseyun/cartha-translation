reference: Exodus 12:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קֵּץ֙ שְׁלֹשִׁ֣ים שָׁנָ֔ה וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יְהִ֗י בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה יָֽצְא֛וּ כָּל צִבְא֥וֹת יְהוָ֖ה מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/041.yaml
  text: And at the end of four hundred and thirty years[a], on that very day, all the hosts of Yahweh went out from the land of Egypt.
translation:
  language: fr
  text: Et au terme de quatre cent trente ans, ce jour-là même, toutes les troupes de Yahweh[a] sortirent du pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes les armées de Yahweh ». Le terme hébreu peut désigner des troupes organisées ou des armées.
    reason: alternative lexicale
lexical_decisions:
- source_word: מִקֵּץ
  choice: au terme de
  rationale: La construction marque le point où une période arrive à son terme. « Au terme de » est naturel en français et conserve précisément cette valeur temporelle.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: quatre cent trente ans
  rationale: Le français ordonne normalement ce nombre du plus grand au plus petit. L’expression désigne une durée totale de 430 ans.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ce jour-là même
  rationale: Cette tournure rend l’insistance de l’expression hébraïque sur l’exactitude du jour tout en convenant à un récit rétrospectif.
- source_word: יָצְאוּ
  choice: sortirent
  rationale: Le verbe יָצָא signifie couramment « sortir ». Le passé simple convient au registre narratif français et présente l’événement comme ponctuel.
- source_word: כָּל
  choice: toutes
  rationale: Le terme porte globalement sur les troupes qui suivent et se traduit directement par « toutes ».
- source_word: צִבְאוֹת
  choice: troupes
  rationale: צָבָא peut désigner des armées, des troupes ou des groupes organisés. « Troupes » conserve la dimension collective et ordonnée sans affirmer trop fortement qu’Israël combattait ici comme une armée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » conserve le nom divin personnel exprimé directement par le tétragramme, plutôt que de lui substituer un titre.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: du pays d’Égypte
  rationale: Cette formulation rend explicitement אֶרֶץ, « pays », et exprime naturellement en français le point de départ.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin lui-même. « Yahweh » le conserve comme nom personnel sans le remplacer par un titre.
- issue: Portée de צִבְאוֹת יְהוָה
  choice: les troupes de Yahweh
  alternative: les armées de Yahweh
  rationale: Le terme présente Israël comme un ensemble organisé appartenant à Yahweh, avec une nuance potentiellement militaire. « Troupes » maintient cette nuance sans imposer l’image d’une armée déjà engagée au combat; l’autre possibilité est signalée en note.
translation_notes:
  register: Français international moderne, narratif et digne. Le « Et » initial reflète la continuité narrative du וַיְהִי hébreu sans reproduire lourdement ses deux occurrences. Le marqueur de note est placé après l’expression qu’il explique.
