  text: גַּם צֹאנְ/כֶ֨ם גַּם בְּקַרְ/כֶ֥ם קְח֛וּ כַּ/אֲשֶׁ֥ר דִּבַּרְתֶּ֖ם וָ/לֵ֑כוּ וּ/בֵֽרַכְתֶּ֖ם גַּם אֹתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/032.yaml
  text: Take both your flocks and your herds[a], just as you have said, and go—and bless me also.
translation:
  language: fr
  text: Prenez aussi bien votre petit bétail que votre gros bétail, comme vous l’avez dit, et partez. Bénissez-moi aussi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Bénissez même moi. » Les paroles du pharaon peuvent souligner que lui aussi recherche une bénédiction au moment où Israël s’en va.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם צֹאנְכֶם גַּם בְּקַרְכֶם
  choice: aussi bien votre petit bétail que votre gros bétail
  rationale: La construction répétée גַּם… גַּם coordonne avec insistance les deux catégories. « Aussi bien… que… » restitue naturellement cette corrélation en français. צֹאן désigne collectivement les ovins et caprins, et בָּקָר les bovins ou le gros bétail.
- source_word: קְחוּ
  choice: Prenez
  rationale: L’impératif pluriel de לקח ordonne directement à Moïse et Aaron d’emmener le bétail lors du départ.
- source_word: כַּאֲשֶׁר דִּבַּרְתֶּם
  choice: comme vous l’avez dit
  rationale: Cette formulation conserve la référence explicite aux paroles antérieures de Moïse et Aaron, sans remplacer « dit » par l’interprétation plus contextuelle « demandé ».
- source_word: וָלֵכוּ
  choice: et partez
  rationale: Dans ce contexte, הלך commande le départ. « Partez » est plus explicite que « allez » en français tout en restant fidèle au sens contextuel.
- source_word: וּבֵרַכְתֶּם
  choice: Bénissez
  rationale: Le piel de ברך signifie ici « bénir ». La traduction simple ne précise ni le moyen ni la nature de la bénédiction sollicitée.
- source_word: גַּם אֹתִי
  choice: moi aussi
  rationale: Cette expression ajoute le pharaon parmi les bénéficiaires de la bénédiction. « Moi aussi » est l’ordre naturel en français, tandis que « même moi » demeure une nuance possible.
theological_decisions:
- issue: Nature de la bénédiction demandée par le pharaon
  choice: 'Présenter simplement sa demande : « Bénissez-moi aussi »'
  alternative: Préciser qu’il demande l’intercession auprès du Dieu d’Israël, ou n’y voir qu’une formule de bienveillance au moment du départ
  rationale: Le verbe ברך indique clairement une bénédiction, mais le texte ne précise ni comment elle doit être transmise ni si la demande relève d’une intercession formelle ou d’une bénédiction d’adieu. La formulation retenue préserve cette tension.
translation_notes:
  register: Français international moderne, direct et digne. « Petit bétail » et « gros bétail » rendent précisément les deux catégories d’animaux, tandis que « aussi bien… que… » conserve l’insistance de la construction hébraïque. La dernière coordination est divisée en une phrase brève pour éviter une accumulation lourde d’impératifs sans en changer le sens.
