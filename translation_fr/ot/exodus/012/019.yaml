  text: שִׁבְעַ֣ת יָמִ֔ים שְׂאֹ֕ר לֹ֥א יִמָּצֵ֖א בְּ/בָתֵּי/כֶ֑ם כִּ֣י כָּל אֹכֵ֣ל מַחְמֶ֗צֶת וְ/נִכְרְתָ֞ה הַ/נֶּ֤פֶשׁ הַ/הִוא֙ מֵ/עֲדַ֣ת יִשְׂרָאֵ֔ל בַּ/גֵּ֖ר וּ/בְ/אֶזְרַ֥ח הָ/אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/019.yaml
  text: For seven days no leaven is to be found in your houses[a], for whoever eats anything leavened, that person shall be cut off from the congregation of Israel[c][b], whether a sojourner or a native of the land.
translation:
  language: fr
  text: Pendant sept jours, aucun levain ne devra se trouver dans vos maisons. Car toute personne qui mangera un aliment levé sera retranchée[a] de la communauté d’Israël, qu’il s’agisse d’un résident étranger[b] ou d’un natif du pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque peut évoquer l’exclusion, la mort ou un jugement divin, selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « étranger établi ». Il s’agit d’un non-originaire résidant parmi Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Pendant sept jours
  rationale: Le groupe nominal a une valeur temporelle de durée. « Pendant sept jours » est naturel en français moderne et conserve cette valeur.
- source_word: שְׂאֹר
  choice: levain
  rationale: Le terme désigne l’agent de fermentation plutôt que l’ensemble des aliments levés. « Levain » convient au contexte rituel sans préciser indûment le type de ferment.
- source_word: לֹא יִמָּצֵא
  choice: aucun … ne devra se trouver
  rationale: Le niphal exprime ici l’état de non-présence exigé. Cette formulation rend clairement l’interdiction tout en conservant le verbe passif.
- source_word: בְּבָתֵּיכֶם
  choice: dans vos maisons
  rationale: Traduction directe du pluriel, qui désigne les habitations ou foyers des destinataires.
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit la raison de l’interdiction dans le style juridique du passage.
- source_word: כָּל אֹכֵל
  choice: quiconque mangera
  rationale: La construction avec כָּל et le participe a une portée générale. Le futur français convient à la sanction juridique.
- source_word: מַחְמֶצֶת
  choice: quelque chose de levé
  rationale: Le mot vise plus largement ce qui est fermenté ou préparé avec du levain, et non seulement le pain.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: sera retranché
  rationale: נֶפֶשׁ désigne ici la personne. « Être retranché » conserve l’idiome de sanction d’alliance sans trancher entre exclusion, mort ou jugement divin.
- source_word: מֵעֲדַת יִשְׂרָאֵל
  choice: de la communauté d’Israël
  rationale: עֵדָה désigne la collectivité ou assemblée d’Israël. « Communauté » est clair en français moderne et garde la dimension collective.
- source_word: בַּגֵּר
  choice: immigré résident
  rationale: גֵּר désigne un non-originaire établi durablement parmi Israël. Cette expression actuelle rend les deux aspects sans recourir à « étranger de passage ».
- source_word: וּבְאֶזְרַח הָאָרֶץ
  choice: originaire du pays
  rationale: L’expression désigne la personne née ou enracinée dans le pays, en contraste avec le גֵּר, sans importer la notion moderne de citoyenneté.
theological_decisions:
- issue: Sens de la sanction d’alliance exprimée par כרת
  choice: Conserver l’idiome « sera retranché »
  alternative: « sera mis à mort » ou « sera exclu de la communauté »
  rationale: Le mode précis de la sanction n’est pas explicité ici et peut renvoyer, selon le contexte, à l’exclusion, à la mort ou au jugement divin. La traduction maintient cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le style juridique est conservé sans archaïsmes inutiles. « Immigré résident » est retenu pour rendre le statut social de גֵּר avec davantage de précision que « étranger » seul.
