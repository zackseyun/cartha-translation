  source_fidelity: 'Le sens central est bien rendu : l’interdiction porte sur la présence de levain pendant sept jours, sur la consommation de ce qui est levé, et sur la sanction exprimée par l’idiome « être retranché ». Toutefois, « immigré résident » introduit des connotations administratives et contemporaines absentes de גֵּר. « Résident étranger » rend plus sobrement le statut de non-autochtone établi parmi Israël.'
