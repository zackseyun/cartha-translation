base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/016.yaml
  text: On the first day there shall be a holy assembly for you[a], and on the seventh day a holy assembly. No work shall be done on them[c][b], except what every person must eat—that alone may be prepared for you.
translation:
  language: fr
  text: 'Le premier jour, il y aura pour vous une assemblée sainte[a] ; le septième jour aussi, une assemblée sainte. Aucun travail ne sera fait ces jours-là, sauf ce que chacun doit manger[b] : cela seul pourra être préparé pour vous[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une convocation sacrée ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ce qui sera mangé par toute personne ». Le mot hébreu parfois traduit par « âme » désigne ici chaque personne.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « cela seul sera fait pour vous ». Dans le contexte, il s’agit de ce qui est nécessaire à la préparation de la nourriture.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְרָא קֹדֶשׁ
  choice: assemblée sainte
  rationale: L’expression désigne un rassemblement sacré auquel le peuple est convoqué. « Assemblée sainte » est naturel, digne et compréhensible, tout en conservant les deux dimensions de rassemblement et de consécration.
- source_word: יִהְיֶה לָכֶם
  choice: vous tiendrez
  rationale: Cette formulation française naturelle exprime qu’une assemblée est prescrite aux destinataires. La relation au groupe marquée par לָכֶם est conservée par « vous ».
- source_word: כָּל מְלָאכָה לֹא יֵעָשֶׂה בָהֶם
  choice: Aucun travail ne sera fait ces jours-là
  rationale: Le passif hébreu est maintenu, tandis que « ces jours-là » explicite naturellement la valeur temporelle du suffixe pluriel. « Aucun travail » rend la portée générale de כָּל avec la négation sans préciser indûment une catégorie de travail.
- source_word: אַךְ
  choice: sauf
  rationale: Dans ce contexte juridique, la particule introduit l’unique exception à l’interdiction.
- source_word: אֲשֶׁר יֵאָכֵל לְכָל נֶפֶשׁ
  choice: ce qui doit être préparé pour que chacun puisse manger
  rationale: La tournure rend la référence contextuelle à la nourriture nécessaire, sans traduire נֶפֶשׁ par « âme », qui serait trompeur ici. L’idée de préparation vient de la reprise verbale finale et permet une phrase française intelligible.
- source_word: נֶפֶשׁ
  choice: chacun
  rationale: Dans cette loi, נֶפֶשׁ désigne chaque individu ou personne, non l’âme au sens métaphysique moderne.
- source_word: הוּא לְבַדּוֹ
  choice: cela seul
  rationale: La formulation conserve l’insistance exclusive du pronom suivi de לְבַדּוֹ.
- source_word: יֵעָשֶׂה לָכֶם
  choice: pourra être fait pour vous
  rationale: Le passif et le datif לָכֶם sont conservés au plus près. Le modal « pourra » exprime la permission créée par l’exception légale, sans réduire ici le verbe générique à « préparer ».
theological_decisions:
- issue: Portée de l’exception alimentaire
  choice: La seule exception concerne ce qui est nécessaire afin que chacun mange.
  alternative: Comprendre la clause comme autorisant plus largement toute préparation festive.
  rationale: Le texte limite explicitement l’exception par הוּא לְבַדּוֹ, « cela seul » ; la traduction préserve cette restriction sans définir davantage la quantité ou la nature du nécessaire.
translation_notes:
  register: Français international moderne, sobre et normatif. Le futur prescriptif convient au contexte juridique. La répétition d’« assemblée sainte » reproduit l’équilibre du texte hébreu, et le passif de l’interdiction est conservé.
