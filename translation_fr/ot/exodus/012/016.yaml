  source_fidelity: 'La structure de l’interdiction et de son unique exception est globalement bien rendue. Toutefois, « vous tiendrez » transforme l’énoncé existentiel « il y aura pour vous » en une action explicitement attribuée aux destinataires. Surtout, la formulation actuelle anticipe « préparé » dans la première partie de l’exception, puis reprend un vague « cela seul pourra être fait », ce qui obscurcit la progression du texte hébreu : ce qui est mangé par chacun, cela seul peut être fait/préparé.'
  naturalness: La révision proposée emploie un français moderne, juridique et lisible. « Il y aura pour vous » reflète précisément la tournure hébraïque sans être archaïque dans ce contexte normatif. « Ce que chacun doit manger » est une expression française naturelle pour la nourriture nécessaire à la consommation.
  terminology: « Assemblée sainte » rend convenablement מִקְרָא קֹדֶשׁ. « Travail », « chacun » et « cela seul » sont appropriés. « Préparé » dans la dernière proposition explicite prudemment l’objet alimentaire implicite, tandis que la note conserve le libellé littéral plus général de « sera fait pour vous ».
