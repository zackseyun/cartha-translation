  yaml_path: translation/ot/exodus/012/028.yaml
  text: Then the sons of Israel went and did so; just as Yahweh had commanded Moses and Aaron[a], so they did.
translation:
  language: fr
  text: Les fils d’Israël[a] allèrent et firent ce que Yahvé avait ordonné à Moïse et à Aaron ; ils firent ainsi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus idiomatique : « les Israélites ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: allèrent donc
  rationale: Le verbe הלך fait progresser le récit et indique que les Israélites se mirent en route pour exécuter les instructions reçues. « Allèrent » reste proche de l’hébreu sans expliciter une destination absente du texte ; « donc » marque naturellement la suite narrative.
- source_word: וַיַּעֲשׂוּ
  choice: firent ainsi
  rationale: Le verbe עשה renvoie ici aux instructions précédentes. « Firent ainsi » conserve cette valeur anaphorique sans détailler de nouveau les actes prescrits.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction conserve l’expression familiale masculine du texte hébreu. La formulation française plus courante « les Israélites » est signalée en note.
- source_word: כַּאֲשֶׁר
  choice: exactement ce que
  rationale: Dans cette construction comparative, l’expression souligne la conformité précise de l’action au commandement. En français, « exactement ce que » rend cette correspondance avec naturel.
- source_word: צִוָּה
  choice: avait ordonné
  rationale: Le plus-que-parfait exprime naturellement en français l’antériorité du commandement par rapport à son exécution. « Ordonner » convient à l’autorité du commandement divin.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin représenté par le tétragramme, plutôt qu’un titre de substitution.
- source_word: אֶת מֹשֶׁה וְאַהֲרֹן
  choice: à Moïse et à Aaron
  rationale: Après « ordonner », le français emploie naturellement un complément indirect pour désigner les personnes qui reçoivent l’ordre, tout en respectant leur rôle syntaxique dans l’hébreu.
- source_word: כֵּן עָשׂוּ
  choice: Ils firent exactement ce que…
  rationale: La seconde phrase reprend et renforce l’affirmation de l’obéissance. La répétition de « firent » préserve l’insistance de l’hébreu dans une formulation française claire.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le nom divin. Employer « Yahvé » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Traduction de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le texte principal maintient la forme familiale et masculine de l’hébreu, tandis que la note donne l’équivalent collectif le plus idiomatique en français.
translation_notes:
  register: Français moderne, digne et accessible. La légère répétition de « firent » est conservée afin de rendre l’insistance du texte hébreu sur l’obéissance exacte, sans alourdir la syntaxe.
