revisions:
- from: Les fils d’Israël[a] allèrent donc et firent ainsi. Ils firent exactement ce que Yahvé avait ordonné à Moïse et à Aaron.
  to: Les fils d’Israël[a] allèrent et firent ce que Yahvé avait ordonné à Moïse et à Aaron ; ils firent ainsi.
  rationale: La révision supprime l’ajout interprétatif « exactement », place la référence au commandement immédiatement après « firent » et rend la clausule conclusive כֵּן עָשׂוּ par « ils firent ainsi ». Elle conserve le mouvement narratif de וַיֵּלְכוּ, l’expression formelle « les fils d’Israël » et le nom divin « Yahvé ».
