  text: A sojourner or a hired worker shall not eat of it[a][b].
translation:
  language: fr
  text: Un résident étranger ou un travailleur salarié ne doit pas en manger[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire prendre part au repas de la Pâque ou, plus précisément, manger de l’animal pascal.
    reason: cross_reference
lexical_decisions:
- source_word: תּוֹשָׁב
  choice: résident étranger
  rationale: Le terme désigne ici une personne non israélite établie parmi Israël sans être pleinement intégrée à la communauté de l’alliance. « Résident étranger » exprime à la fois la résidence et le statut extérieur, plus clairement que « voyageur » ou « étranger de passage ».
- source_word: שָׂכִיר
  choice: travailleur salarié
  rationale: Le mot désigne une personne employée contre rémunération. Cette formulation moderne évite l’ambiguïté de « mercenaire » et le caractère vieilli de « serviteur à gages ».
- source_word: לֹא יֹאכַל
  choice: ne doit pas manger
  rationale: Dans ce texte législatif, l’inaccompli nié exprime une interdiction. « Ne doit pas » conserve la force normative dans un français actuel.
- source_word: בּוֹ
  choice: en
  rationale: Avec le verbe « manger », la préposition a ici une valeur partitive. Le pronom français « en » rend naturellement l’idée de prendre part à l’aliment ou au repas évoqué par le contexte.
theological_decisions:
- issue: Référent du pronom בּוֹ (« en ») dans la législation de la Pâque
  choice: Le référent demeure implicite dans le texte principal et renvoie à ce qui est mangé lors de la Pâque.
  alternative: Le pronom renvoie plus précisément à l’agneau pascal.
  rationale: L’hébreu emploie un pronom dont l’antécédent est fourni par le contexte. La traduction « en manger » préserve cette concision et ne tranche pas artificiellement entre le repas pascal dans son ensemble et, plus étroitement, l’animal pascal.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la brièveté et la force juridique de l’hébreu. « Résident étranger » distingue le statut durable exprimé par תּוֹשָׁב de celui d’un simple voyageur; « travailleur salarié » est non péjoratif et immédiatement compréhensible.
