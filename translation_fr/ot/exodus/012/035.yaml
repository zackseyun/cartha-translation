  text: וּ/בְנֵי יִשְׂרָאֵ֥ל עָשׂ֖וּ כִּ/דְבַ֣ר מֹשֶׁ֑ה וַֽ/יִּשְׁאֲלוּ֙ מִ/מִּצְרַ֔יִם כְּלֵי כֶ֛סֶף וּ/כְלֵ֥י זָהָ֖ב וּ/שְׂמָלֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/035.yaml
  text: And the sons of Israel did according to the word of Moses[a], and they asked the Egyptians for articles of silver and articles of gold and clothing.
translation:
  language: fr
  text: 'Les Israélites agirent selon la parole de Moïse : ils demandèrent aux Égyptiens des objets d’argent, des objets d’or et des vêtements.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « demandèrent aux Égyptiens ». Certaines traductions anciennes rendent par « empruntèrent », mais le verbe hébreu signifie ordinairement « demander » ou « solliciter ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Les Israélites
  rationale: Cette formulation naturelle en français moderne exprime clairement le sens collectif de l’expression hébraïque littérale « les fils d’Israël », sans donner l’impression qu’il s’agit uniquement des fils immédiats du patriarche.
- source_word: עָשׂוּ כִּדְבַר מֹשֶׁה
  choice: firent ce que Moïse leur avait dit
  rationale: La tournure rend naturellement l’idée d’agir conformément à la parole de Moïse. Le pronom « leur » explicite en français le destinataire implicite sans transformer la parole en commandement formel.
- source_word: וַיִּשְׁאֲלוּ
  choice: ils demandèrent
  rationale: Le verbe שאל signifie fondamentalement « demander » ou « solliciter ». « Empruntèrent » introduirait une obligation de restitution qui n’est pas exprimée ici.
- source_word: מִמִּצְרַיִם
  choice: aux Égyptiens
  rationale: La forme hébraïque est littéralement « de l’Égypte », mais le contexte désigne les personnes égyptiennes auxquelles les demandes furent adressées.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: des objets en argent, des objets en or
  rationale: כְּלִי est un terme large pouvant désigner divers objets, récipients ou ustensiles. « Objets » évite de restreindre indûment la catégorie, et « en argent/en or » est idiomatique.
- source_word: וּשְׂמָלֹת
  choice: et des vêtements
  rationale: שִׂמְלָה désigne largement des habits ou vêtements. « Vêtements » est clair, actuel et suffisamment général.
theological_decisions:
- issue: Sens potentiellement chargé de וַיִּשְׁאֲלוּ dans le contexte du dépouillement de l’Égypte
  choice: demandèrent
  alternative: empruntèrent ; sollicitèrent
  rationale: « Demandèrent » conserve le sens lexical ordinaire sans suggérer une promesse de restitution ni faire porter à ce verbe seul le sens de « dépouiller », lequel relève du résultat narratif indiqué dans le contexte.
translation_notes:
  register: Français international moderne, clair et digne. « Les Israélites » privilégie la compréhension immédiate; la syntaxe reste simple tout en conservant la succession des actions du texte hébreu.
