- from: 'Les Israélites firent ce que Moïse leur avait dit : ils demandèrent aux Égyptiens des objets en argent, des objets en or et des vêtements.[a]'
  to: 'Les Israélites agirent selon la parole de Moïse : ils demandèrent aux Égyptiens des objets d’argent, des objets d’or et des vêtements.[a]'
  rationale: La révision conserve le sens non chargé de שאל (« demander »), la référence contextuelle aux Égyptiens et l’énumération des biens. Elle rapproche la première proposition de la formulation hébraïque sans sacrifier la lisibilité moderne, et elle clarifie la portée grammaticale de l’alternative en note.
