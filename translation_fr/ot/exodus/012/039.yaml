  text: וַ/יֹּאפ֨וּ אֶת הַ/בָּצֵ֜ק אֲשֶׁ֨ר הוֹצִ֧יאוּ מִ/מִּצְרַ֛יִם עֻגֹ֥ת מַצּ֖וֹת כִּ֣י לֹ֣א חָמֵ֑ץ כִּֽי גֹרְשׁ֣וּ מִ/מִּצְרַ֗יִם וְ/לֹ֤א יָֽכְלוּ֙ לְ/הִתְמַהְמֵ֔הַּ וְ/גַם צֵדָ֖ה לֹא עָשׂ֥וּ לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/039.yaml
  text: 'They baked the dough they had brought out of Egypt into unleavened cakes, since it had not become leavened: they had been driven out of Egypt and could not delay, and had not prepared provisions for themselves.'
translation:
  language: fr
  text: 'Ils firent cuire la pâte qu’ils avaient emportée d’Égypte pour en faire des galettes sans levain, car elle n’avait pas levé : ils avaient été chassés d’Égypte et ne pouvaient pas s’attarder ; ils n’avaient pas non plus préparé de provisions pour eux-mêmes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאפוּ
  choice: Ils firent cuire
  rationale: Le verbe désigne la cuisson au four ou sur une surface chauffée. « Firent cuire » est naturel en français et convient aux galettes de pain.
- source_word: הַבָּצֵק
  choice: la pâte
  rationale: בצק désigne la pâte pétrie ; « la pâte » est l’équivalent français courant et précis dans ce contexte.
- source_word: אֲשֶׁר הוֹצִיאוּ מִמִּצְרַיִם
  choice: qu’ils avaient emportée d’Égypte
  rationale: Le plus-que-parfait restitue l’antériorité de la sortie de la pâte. « Emportée » est idiomatique pour un objet transporté hors d’un lieu.
- source_word: עֻגֹת מַצּוֹת
  choice: pour en faire des galettes sans levain
  rationale: עֻגֹת désigne des galettes ou pains ronds, et מַצּוֹת précise l’absence de levain. La tournure exprime naturellement en français le résultat de la cuisson.
- source_word: כִּי לֹא חָמֵץ
  choice: car elle n’avait pas levé
  rationale: Le verbe חָמֵץ décrit ici la pâte qui devient fermentée. Dans le contexte de la pâte, « n’avait pas levé » est clair et idiomatique sans suggérer l’ajout moderne de levure industrielle.
- source_word: כִּי גֹרְשׁוּ מִמִּצְרַיִם
  choice: ils avaient été chassés d’Égypte
  rationale: Le passif exprime une expulsion forcée ; « chassés » conserve cette force en français courant.
- source_word: וְלֹא יָכְלוּ לְהִתְמַהְמֵהַּ
  choice: et ne pouvaient pas attendre
  rationale: התמהמה signifie tarder, s’attarder ou attendre. Ici, « ne pouvaient pas attendre » communique naturellement l’urgence du départ.
- source_word: וְגַם צֵדָה לֹא עָשׂוּ לָהֶם
  choice: ils n’avaient pas non plus préparé de provisions pour eux-mêmes
  rationale: « Non plus » rend la valeur additive après la négation précédente ; צֵדָה désigne des provisions destinées au voyage, et לָהֶם est rendu directement par « pour eux-mêmes ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le texte conserve la causalité et l’urgence du récit sans ajouter d’explication confessionnelle. « Galettes » désigne ici des pains plats ou ronds, non une pâtisserie.
