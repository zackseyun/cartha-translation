base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/003.yaml
  text: Speak to all the congregation of Israel[a], saying, ‘On the tenth day of this month each man shall take for himself a lamb according to his fathers’ house, a lamb for the household.’
translation:
  language: fr
  text: 'Parlez à toute la communauté d’Israël et dites : « Le dixième jour de ce mois, chaque homme prendra une bête du petit bétail[a] selon sa maison paternelle, une bête pour chaque maisonnée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu rendu par « bête du petit bétail » peut désigner un jeune animal du troupeau, qu’il s’agisse d’un mouton ou d’une chèvre.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: Parlez
  rationale: L’impératif pluriel commande directement à plusieurs destinataires de s’adresser au peuple; « Parlez » en conserve la force formelle.
- source_word: כָּל עֲדַת יִשְׂרָאֵל
  choice: toute la communauté d’Israël
  rationale: עֵדָה désigne ici collectivement la communauté d’Israël; cette formulation est naturelle en français moderne tout en gardant le sens corporatif.
- source_word: לֵאמֹר
  choice: et dites
  rationale: L’infinitif quotatif introduit les paroles à transmettre; la coordination est plus idiomatique en français actuel que le calque « en disant ».
- source_word: בֶּעָשֹׂר לַחֹדֶשׁ הַזֶּה
  choice: Le dixième jour de ce mois
  rationale: Le mot « jour », implicite en hébreu, est explicité pour une expression temporelle française claire.
- source_word: וְיִקְחוּ לָהֶם
  choice: prendra
  rationale: Dans ce contexte prescriptif, l’inaccompli coordonné a une valeur directive. Le singulier français s’accorde naturellement avec le distributif « chaque homme »; le bénéfice exprimé par לָהֶם ressort du choix fait pour la famille.
- source_word: אִישׁ
  choice: chaque homme
  rationale: אִישׁ est un singulier distributif et désigne vraisemblablement ici celui qui agit au nom de l’unité domestique.
- source_word: שֶׂה
  choice: une bête du petit bétail
  rationale: שֶׂה peut désigner un ovin ou un caprin. Cette expression française conserve cette extension lexicale sans décider à tort qu’il s’agit nécessairement d’un agneau.
- source_word: לְבֵית אָבֹת
  choice: pour sa famille paternelle
  rationale: L’expression désigne l’unité familiale structurée selon l’ascendance paternelle; « famille paternelle » en transmet le référent social sans le calque obscur « maison des pères ».
- source_word: שֶׂה לַבָּיִת
  choice: une bête par maisonnée
  rationale: בַּיִת désigne ici le groupe domestique, non le bâtiment. « Par maisonnée » exprime clairement la répartition prescrite.
theological_decisions:
- issue: Identification de שֶׂה comme agneau seulement
  choice: Conserver dans le texte la possibilité d’un mouton ou d’une chèvre par « bête du petit bétail »
  alternative: « un agneau »
  rationale: Le contexte pascal n’annule pas l’étendue du terme hébreu; Exode 12:5 précise ensuite que l’animal peut être pris parmi les moutons ou les chèvres.
translation_notes:
  register: Français international moderne, clair et digne. La formulation évite les calques bibliques devenus opaques, tout en conservant la structure familiale ancienne et l’ambiguïté réelle de שֶׂה.
