  - marker: b
    text: 'Hébreu, littéralement : « rôti de feu » ; c’est-à-dire « rôti au feu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכְלוּ
  choice: Ils mangeront
  rationale: Dans ce contexte d’instructions rituelles, la forme verbale avec conjonction a une valeur prescriptive orientée vers l’avenir. Le futur français exprime naturellement cette prescription.
- source_word: הַבָּשָׂר
  choice: la viande
  rationale: Dans un contexte alimentaire, « viande » est l’équivalent moderne et naturel de בָּשָׂר, plutôt que « chair ».
- source_word: בַּלַּיְלָה הַזֶּה
  choice: cette nuit-là
  rationale: La locution désigne la nuit précise dont il vient d’être question. « Cette nuit-là » est idiomatique en français et conserve la valeur démonstrative de l’hébreu.
- source_word: צְלִי אֵשׁ
  choice: rôtie au feu
  rationale: La construction indique une cuisson par l’action du feu. Cette formulation conserve la mention explicite du feu et prépare le contraste avec la cuisson à l’eau au verset suivant.
- source_word: וּמַצּוֹת
  choice: avec des pains sans levain
  rationale: מַצּוֹת désigne des pains ou galettes non levés. Le pluriel « pains sans levain » rend le nombre hébreu et s’intègre naturellement à l’accompagnement introduit en français par « avec ».
- source_word: עַל מְרֹרִים
  choice: avec … des herbes amères
  rationale: Dans ce contexte alimentaire, עַל marque l’accompagnement plutôt qu’une position physique. « Herbes amères » est la désignation française claire et traditionnelle de מְרֹרִים.
- source_word: יֹאכְלֻהוּ
  choice: ils la mangeront
  rationale: La reprise verbale avec suffixe objet renforce l’instruction et renvoie à la viande, féminin en français. La répétition est maintenue pour respecter l’emphase hébraïque.
