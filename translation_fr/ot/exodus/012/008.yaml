  text: Ils mangeront la viande cette nuit-là[a], rôtie au feu[b] ; ils la mangeront avec des pains sans levain et des herbes amères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en cette nuit-ci » ou « cette nuit-ci ». Il s’agit de la nuit précise du repas de la Pâque.'
