  text: וְ/הָיָ֕ה כִּֽי יֹאמְר֥וּ אֲלֵי/כֶ֖ם בְּנֵי/כֶ֑ם מָ֛ה הָ/עֲבֹדָ֥ה הַ/זֹּ֖את לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/026.yaml
  text: And when your sons say to you[a], ‘What is this service to you?’
translation:
  language: fr
  text: 'Et lorsque vos fils vous diront : « Que signifie pour vous ce service[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Qu’est-ce que ce service pour vous ? »'
    reason: La tournure hébraïque מָה … לָכֶם est plus littéralement « qu’est-ce que … pour vous ? ». Le texte principal en donne une formulation française naturelle sans exclure la nuance de portée ou de signification.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Et lorsque
  rationale: Cette formule hébraïque introduit ici une éventualité future. « Et lorsque » en restitue naturellement la valeur temporelle tout en conservant le lien avec le contexte précédent.
- source_word: יֹאמְרוּ אֲלֵיכֶם
  choice: vous diront
  rationale: Le verbe אָמַר signifie proprement « dire ». Le futur français convient à l’instruction portant sur les générations à venir, même si les paroles prononcées ont la forme d’une question.
- source_word: בְּנֵיכֶם
  choice: vos fils
  rationale: Le nom hébreu est le masculin pluriel « fils ». Cette traduction conserve la précision lexicale du texte au lieu de l’élargir à « enfants ».
- source_word: מָה הָעֲבֹדָה הַזֹּאת לָכֶם
  choice: Que signifie pour vous ce service ?
  rationale: La formulation française exprime naturellement la question portant sur la portée de cette observance pour ceux qui la pratiquent. « Service » préserve l’étendue de עֲבֹדָה, qui peut désigner un service ou une observance cultuelle, sans préciser abusivement « rite » ou « culte ».
theological_decisions:
- issue: Portée de la question des fils
  choice: Que signifie pour vous ce service ?
  alternative: Qu’est pour vous ce service ?
  rationale: Le texte peut demander la nature, la signification ou la portée de l’observance. La formulation retenue reste intelligible en français moderne, tandis que la note conserve la structure plus formelle et son ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. Le verset conserve « fils », « dire » et « service » au plus près de l’hébreu, tandis que la question est légèrement idiomatisée pour être immédiatement compréhensible.
