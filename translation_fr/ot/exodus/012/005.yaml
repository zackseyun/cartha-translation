  yaml_path: translation/ot/exodus/012/005.yaml
  text: Your lamb shall be without blemish[a], a male a year old; you shall take it from the sheep or from the goats.
translation:
  language: fr
  text: L’animal du petit bétail devra être sans défaut, mâle, âgé d’un an. Vous le prendrez parmi les moutons ou parmi les chèvres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׂה
  choice: une bête du petit bétail
  rationale: Le terme hébreu désigne ici un animal du petit bétail, soit un agneau, soit un chevreau. Cette formulation française conserve cette portée avant que la dernière proposition ne précise les deux provenances possibles.
- source_word: תָמִים
  choice: sans défaut
  rationale: Dans un contexte sacrificiel, le mot qualifie un animal exempt de tare; « sans défaut » est clair, naturel et précis en français moderne.
- source_word: זָכָר
  choice: mâle
  rationale: Désignation biologique directe et non ambiguë.
- source_word: בֶּן שָׁנָה
  choice: âgée d’un an
  rationale: Rend naturellement l’idiome hébreu « fils d’une année ». La formulation peut désigner un animal dans sa première année; une note signale cette nuance possible.
- source_word: יִהְיֶה לָכֶם
  choice: Vous choisirez … mâle, âgée d’un an et sans défaut
  rationale: La tournure prescriptive est intégrée naturellement à la phrase française plutôt que calquée par « sera pour vous ».
- source_word: מִן הַכְּבָשִׂים וּמִן הָעִזִּים
  choice: parmi les moutons ou parmi les chèvres
  rationale: Les catégories animales sont explicites. « Ou » exprime naturellement le choix entre les deux groupes que le waw coordonne.
- source_word: תִּקָּחוּ
  choice: Vous la prendrez
  rationale: Le futur français porte ici la valeur prescriptive de l’instruction. Le pronom « la » reprend la bête déjà mentionnée.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « Bête du petit bétail » évite de réduire à tort שֶׂה à « agneau » tout en restant idiomatique. L’ordre des qualifications a été légèrement réorganisé pour une lecture française fluide, sans perte de contenu.
