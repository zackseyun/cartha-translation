  source_fidelity: 'Le sens général est bien rendu : Moïse réunit les anciens, leur donne deux impératifs concernant le petit bétail selon leurs groupes familiaux, puis ordonne l’immolation de la Pâque. « La Pâque » préserve utilement la métonymie de הַפָּסַח sans réduire indûment l’animal à un agneau. Toutefois, « Retirez ... une bête » est ambigu en français moderne et peut suggérer l’enlèvement d’un animal plutôt que son choix dans le troupeau. Le singulier « une bête » explicite aussi une unité que le collectif צֹאן ne formule pas directement dans ce verset.'
