base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/021.yaml
  text: Then Moses called for all the elders of Israel and said to them[a], “Draw out and take for yourselves sheep according to your families[c][b], and slaughter the Passover lamb.”
translation:
  language: fr
  text: 'Moïse convoqua alors tous les anciens d’Israël et leur dit : « Choisissez et prenez pour vous du petit bétail[a], selon vos familles, puis immolez la Pâque[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le premier verbe signifie littéralement « tirer » ou « faire sortir » ; dans ce contexte, il peut vouloir dire « choisir ». L’expression hébraïque « petit bétail » peut désigner aussi bien des moutons que des chèvres.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la Pâque » ; il s’agit ici de la victime offerte pour la Pâque.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: convoqua
  rationale: Dans ce contexte, קרא indique que Moïse fait venir les anciens afin de leur transmettre des instructions. « Convoqua » exprime naturellement cette nuance.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: les anciens d’Israël
  rationale: Rendu français courant de la construction hébraïque désignant les responsables reconnus du peuple.
- source_word: מִשְׁכוּ
  choice: Retirez
  rationale: L’impératif de משך signifie littéralement tirer ou faire sortir. « Retirez » conserve ce mouvement concret sans imposer l’interprétation plus abstraite « choisissez ».
- source_word: וּקְחוּ
  choice: prenez
  rationale: Rendu direct de לקח; le maintien d’un second impératif respecte la formulation hébraïque מִשְׁכוּ וּקְחוּ.
- source_word: לָכֶם
  choice: pour chacune de vos familles
  rationale: La valeur bénéficiaire de לָכֶם est rendue avec l’expression familiale qui suit, dans un français naturel, sans ajouter « pour vous-mêmes », qui serait lourd ici.
- source_word: צֹאן
  choice: une bête du petit bétail
  rationale: צֹאן désigne collectivement le petit bétail, notamment ovins et caprins. Le singulier distributif français convient à l’instruction donnée selon les familles et évite de limiter le choix à un agneau.
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: pour chacune de vos familles
  rationale: La tournure distributive exprime naturellement que l’animal doit être pris en fonction des groupes familiaux.
- source_word: וְשַׁחֲטוּ
  choice: immolez
  rationale: Le verbe שׁחט désigne l’abattage d’un animal. « Immolez » convient au contexte sacrificiel et garde un registre digne, sans être archaïque.
- source_word: הַפָּסַח
  choice: la Pâque
  rationale: L’hébreu dit littéralement « la Pâque » et emploie ici le nom par métonymie pour la victime pascale. Le texte principal conserve cette formulation concise et sa tension, tandis qu’une note explicite le référent.
theological_decisions:
- issue: Référent de הַפָּסַח
  choice: la Pâque
  alternative: l’agneau pascal / le sacrifice de la Pâque
  rationale: Le texte hébreu ne nomme pas ici explicitement un agneau et Exode 12.5 permet un animal pris parmi les moutons ou les chèvres. Garder « la Pâque » préserve la métonymie originale; la note en explique le sens sacrificiel.
translation_notes:
  register: Français international moderne, clair et digne. « Convoqua » marque l’autorité de l’appel; « petit bétail » préserve l’étendue de צֹאן; « immolez la Pâque » conserve la métonymie hébraïque tout en étant éclairé par une note.
