  text: בְּ/בַ֤יִת אֶחָד֙ יֵאָכֵ֔ל לֹא תוֹצִ֧יא מִן הַ/בַּ֛יִת מִן הַ/בָּשָׂ֖ר ח֑וּצָ/ה וְ/עֶ֖צֶם לֹ֥א תִשְׁבְּרוּ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/046.yaml
  text: It shall be eaten in one house; you shall not take any of the meat outside the house[a], and you shall not break a bone of it.
translation:
  language: fr
  text: Il sera mangé dans une seule maison ; vous n’emporterez rien de sa viande hors de la maison[a], et vous ne briserez aucun de ses os.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans une seule maisonnée ». Le mot hébreu peut désigner soit le bâtiment, soit le foyer ou le groupe qui s’y réunit.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַיִת אֶחָד
  choice: dans une seule maison
  rationale: בַּיִת peut désigner le bâtiment ou la maisonnée. Le contraste immédiat avec le fait de transporter la viande hors de la maison favorise ici le sens spatial concret, sans exclure le cadre familial du repas.
- source_word: יֵאָכֵל
  choice: on le mangera
  rationale: Le niphal imparfait exprime ici une prescription. La tournure française impersonnelle conserve la valeur passive tout en restant naturelle dans un registre juridique.
- source_word: לֹא תוֹצִיא ... מִן הַבַּיִת ... חוּצָה
  choice: vous ne transporterez ... hors de la maison
  rationale: Le hiphil de יצא signifie « faire sortir » ou « emporter dehors », et חוּצָה indique un mouvement vers l’extérieur. « Transporter hors de » rend clairement l’interdiction de déplacer la viande à l’extérieur.
- source_word: מִן הַבָּשָׂר
  choice: aucune part de la viande
  rationale: Dans ce contexte alimentaire, בָּשָׂר se rend naturellement par « viande ». La formulation « aucune part de » restitue la valeur partitive de מִן.
- source_word: וְעֶצֶם לֹא תִשְׁבְּרוּ בוֹ
  choice: et vous ne briserez aucun de ses os
  rationale: 'Le singulier עֶצֶם a ici une portée distributive : pas un seul os ne doit être brisé. « Aucun de ses os » est idiomatique en français et rattache le pronom à la victime pascale.'
theological_decisions:
- issue: Référent du pronom final בוֹ
  choice: la victime pascale dans son ensemble (« ses os »)
  alternative: l’agneau en particulier
  rationale: Le pronom masculin singulier renvoie à l’animal pascal évoqué dans le contexte. La traduction ne réintroduit pas explicitement « agneau », absent de ce verset, tout en demeurant compatible avec le contexte plus large.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur à valeur prescriptive conserve la force juridique du passage. « Dans une seule maison » et « hors de la maison » maintiennent le contraste spatial de l’hébreu, tandis que la note signale l’autre sens possible de בַּיִת.
