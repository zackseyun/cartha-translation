base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/030.yaml
  text: And Pharaoh rose in the night[a], he and all his servants and all Egypt, and there was a great cry in Egypt[b], for there was no house where there was not someone dead.
translation:
  language: fr
  text: Le pharaon se leva cette nuit-là, lui, tous ses serviteurs et toute l’Égypte[a]. Il y eut une grande clameur en Égypte, car il n’y avait pas une seule maison sans mort[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Toute l’Égypte » désigne collectivement les habitants du pays.
    reason: cultural_note
  - marker: b
    text: 'Ou, plus littéralement : « il n’y avait pas de maison où il n’y avait pas un mort ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le qal wayyiqtol de קום exprime ici une action narrative simple. « Se leva » est naturel et reste proche de l’hébreu.
- source_word: לַיְלָה הוּא
  choice: pendant la nuit
  rationale: La construction désigne le moment nocturne de l’action. « Pendant la nuit » est idiomatique en français sans préciser davantage que le texte.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: עֶבֶד peut désigner un serviteur, un esclave ou un agent royal. Dans l’entourage du pharaon, « serviteurs » conserve le terme général sans imposer une fonction administrative précise.
- source_word: וְכָל מִצְרַיִם
  choice: et toute l’Égypte
  rationale: L’hébreu emploie le nom du pays collectivement pour ses habitants. La métonymie « toute l’Égypte » se conserve naturellement en français.
- source_word: צְעָקָה גְדֹלָה
  choice: un immense cri de détresse
  rationale: צְעָקָה désigne un cri ou une clameur suscités notamment par la détresse. L’ajout explicatif « de détresse » communique la force contextuelle, tandis qu’« immense » rend גְדֹלָה dans un français naturel.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit la cause du cri. « Car » marque clairement ce rapport dans un registre narratif digne.
- source_word: אֵין בַּיִת אֲשֶׁר אֵין שָׁם מֵת
  choice: il n’y avait pas une maison où il n’y ait un mort
  rationale: Cette formulation maintient le redoublement négatif emphatique de l’hébreu ainsi que l’image concrète de la maison.
- source_word: מֵת
  choice: un mort
  rationale: Le participe substantivé désigne ici une personne morte sans autre précision. « Un mort » est concis, naturel et formellement proche.
