revisions:
- from: Le pharaon se leva pendant la nuit, lui, tous ses serviteurs et toute l’Égypte[a]. Il y eut en Égypte un immense cri de détresse, car il n’y avait pas une maison où il n’y ait un mort[b].
  to: Le pharaon se leva cette nuit-là, lui, tous ses serviteurs et toute l’Égypte[a]. Il y eut une grande clameur en Égypte, car il n’y avait pas une seule maison sans mort[b].
  rationale: La révision corrige la concordance des temps, rend le repère temporel plus précis, évite l’intensification interprétative de « immense cri de détresse » et conserve l’emphase de la double négation finale dans un français international naturel. Les deux ancres de note sont conservées et la note finale présente une alternative plus proche de la syntaxe hébraïque.
