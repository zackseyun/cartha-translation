review_pass:
  verdict: revise
  source_fidelity: Le sens global est fidèle, mais « pendant la nuit » peut évoquer une durée plutôt que le repère temporel « cette nuit-là ». « Immense cri de détresse » intensifie et explicite au-delà de צְעָקָה גְדֹלָה. La subordonnée « où il n’y ait un mort » présente en outre un problème de concordance avec « il n’y avait ».
  naturalness: 'La révision emploie un français moderne et narratif : « cette nuit-là », « une grande clameur » et « pas une seule maison sans mort » sont naturels tout en gardant la portée universelle emphatique de l’hébreu.'
  terminology: « Pharaon », « serviteurs », « toute l’Égypte » et « mort » conviennent. « Grande clameur » rend avec sobriété le cri collectif de détresse sans ajouter une interprétation.
  issues:
  - severity: medium
    issue: Concordance des temps dans la proposition finale
    rationale: Après « il n’y avait pas », « où il n’y ait un mort » est grammaticalement et stylistiquement défectueux dans ce contexte. Il faut l’imparfait (« où il n’y avait pas de mort ») ou une reformulation.
  - severity: low
    issue: Nuance temporelle de « pendant la nuit »
    rationale: La formule peut suggérer que l’action s’est déroulée durant une période. « Cette nuit-là » rend plus directement לַיְלָה הוּא comme repère narratif.
  - severity: low
    issue: Intensification et explicitation de צְעָקָה גְדֹלָה
    rationale: « Immense cri de détresse » ajoute à la fois une intensité forte et l’explication « de détresse ». « Une grande clameur » reproduit plus sobrement l’expression source.
  - severity: low
    issue: Note b non alignée sur la formulation source
    rationale: « Aucune maison n’avait échappé à la mort » est interprétatif et peut suggérer une abstraction différente. Une note littérale rend mieux la double négation hébraïque.
  revised_text: Le pharaon se leva cette nuit-là, lui, tous ses serviteurs et toute l’Égypte[a]. Il y eut une grande clameur en Égypte, car il n’y avait pas une seule maison sans mort[b].
