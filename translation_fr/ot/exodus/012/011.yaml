source:
  edition: WLC
  text: וְ/כָכָה֮ תֹּאכְל֣וּ אֹת/וֹ֒ מָתְנֵי/כֶ֣ם חֲגֻרִ֔ים נַֽעֲלֵי/כֶם֙ בְּ/רַגְלֵי/כֶ֔ם וּ/מַקֶּלְ/כֶ֖ם בְּ/יֶדְ/כֶ֑ם וַ/אֲכַלְתֶּ֤ם אֹת/וֹ֙ בְּ/חִפָּז֔וֹן פֶּ֥סַח ה֖וּא לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/011.yaml
  text: 'And this is how you shall eat it: with your waist belted[a], your sandals on your feet, and your staff in your hand. You shall eat it in haste[b]; it is the Passover of Yahweh.'
translation:
  language: fr
  text: 'Voici comment vous le mangerez : la ceinture serrée autour de la taille[a], les sandales aux pieds et le bâton à la main. Vous le mangerez à la hâte ; c’est la Pâque de Yahweh.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vos reins ceints » ; expression évoquant une personne habillée et prête à partir sans délai.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « c’est une Pâque pour Yahweh ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָכָה
  choice: Voici comment
  rationale: Introduit naturellement en français moderne la manière prescrite de prendre le repas, tout en conservant la valeur directive de l’expression hébraïque.
- source_word: תֹּאכְלוּ / וַאֲכַלְתֶּם
  choice: vous le mangerez
  rationale: Dans ce contexte prescriptif, le futur français exprime clairement l’instruction solennelle sans lourdeur archaïque.
- source_word: מָתְנֵיכֶם חֲגֻרִים
  choice: la ceinture nouée autour de la taille
  rationale: Conserve l’image concrète d’un vêtement attaché en vue d’un départ immédiat, dans une formulation compréhensible aujourd’hui.
- source_word: נַעֲלֵיכֶם בְּרַגְלֵיכֶם
  choice: les sandales aux pieds
  rationale: « Sandales » correspond au type de chaussure du contexte ancien, et l’expression française est concise et naturelle.
- source_word: וּמַקֶּלְכֶם בְּיֶדְכֶם
  choice: et le bâton à la main
  rationale: « Bâton » convient à l’équipement du voyageur et restitue simplement מַקֵּל.
- source_word: בְּחִפָּזוֹן
  choice: à la hâte
  rationale: Rend l’urgence du départ imminent tout en gardant la concision de l’hébreu.
- source_word: פֶּסַח
  choice: la Pâque
  rationale: Terme français établi pour la fête et le rite désignés par l’hébreu פֶּסַח ; le contexte permet aussi de comprendre l’offrande ou le repas pascal.
- source_word: לַיהוָה
  choice: de Yahweh
  rationale: La construction peut exprimer l’appartenance ou la destination cultuelle ; « de Yahweh » préserve cette relation sans la préciser excessivement.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » restitue le nom personnel plutôt que de lui substituer un titre ; la forme traditionnelle française est signalée en note.
- issue: Portée de פֶּסַח הוּא לַיהוָה
  choice: c’est la Pâque de Yahweh
  alternative: c’est une Pâque pour Yahweh / c’est l’offrande pascale de Yahweh
  rationale: La formulation choisie garde ouverte la portée de פֶּסַח, qui peut désigner ici le rite, le repas ou l’offrande, ainsi que la relation exprimée par לְ.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe conserve la solennité de l’instruction, tandis que les expressions concrètes restent accessibles. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
