  text: וְ/הָיָ֞ה כִּֽי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ אֲשֶׁ֨ר יִתֵּ֧ן יְהוָ֛ה לָ/כֶ֖ם כַּ/אֲשֶׁ֣ר דִּבֵּ֑ר וּ/שְׁמַרְתֶּ֖ם אֶת הָ/עֲבֹדָ֥ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/025.yaml
  text: And when you come into the land that Yahweh will give you[a], just as he promised[b], you shall keep this service.
translation:
  language: fr
  text: Lorsque vous entrerez dans le pays que Yahweh vous donnera, comme il l’a promis[a], vous observerez ce rite[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme il l’a dit ». L’hébreu dit littéralement « comme il a parlé » ; dans ce contexte, cette parole a valeur de promesse.
    reason: lexical_alternative
  - marker: b
    text: Ou « ce service » ou « cette observance ». Le terme hébreu désigne ici le service rituel de la Pâque.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Quand
  rationale: Cette formule introduit ici une circonstance future. « Quand » en restitue naturellement la valeur temporelle en français.
- source_word: תָבֹאוּ אֶל הָאָרֶץ
  choice: vous serez entrés dans le pays
  rationale: Le verbe בוא peut signifier venir ou entrer. Avec אֶל et dans ce contexte d’installation future, « entrer dans le pays » est idiomatique; le futur antérieur marque l’entrée accomplie avant l’observance prescrite.
- source_word: אֲשֶׁר יִתֵּן יְהוָה לָכֶם
  choice: que Yahweh vous donnera
  rationale: Le yiqtol de נתן a ici une valeur future; le nom divin יהוה est translittéré « Yahweh » conformément au texte source.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: comme il l’a promis
  rationale: דבר signifie littéralement « parler » ou « dire », mais la parole antérieure de Yahweh a ici valeur de promesse. La note conserve l’alternative plus formelle.
- source_word: וּשְׁמַרְתֶּם
  choice: vous observerez
  rationale: Avec une prescription rituelle pour objet, שמר signifie garder ou observer. « Observer » exprime clairement l’accomplissement fidèle d’un rite.
- source_word: הָעֲבֹדָה הַזֹּאת
  choice: ce rite
  rationale: עֲבֹדָה désigne un service ou travail, et ici précisément le service rituel de la Pâque. « Ce rite » est naturel et intelligible, tandis que la note signale les rendus plus littéraux.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu emploie le Tétragramme. « Yahweh » préserve le nom d’alliance sans lui substituer un titre.
- issue: Portée de כַּאֲשֶׁר דִּבֵּר
  choice: comme il l’a promis
  alternative: comme il l’a dit; comme il en a parlé
  rationale: Le contexte donne à la parole divine une portée promissoire, mais la note maintient visible le sens lexical plus littéral.
- issue: Nature de הָעֲבֹדָה הַזֹּאת
  choice: ce rite
  alternative: ce service; cette observance
  rationale: Le contexte immédiat concerne la célébration prescrite de la Pâque. Le choix indique sa nature rituelle sans ajouter de contenu confessionnel.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe évite le calque de la formule hébraïque tout en conservant la succession temporelle. « Observerez » et « rite » rendent explicitement le cadre cultuel sans lourdeur technique.
