source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֡ם זֶֽבַח פֶּ֨סַח ה֜וּא לַֽ/יהוָ֗ה אֲשֶׁ֣ר פָּ֠סַח עַל בָּתֵּ֤י בְנֵֽי יִשְׂרָאֵל֙ בְּ/מִצְרַ֔יִם בְּ/נָגְפּ֥/וֹ אֶת מִצְרַ֖יִם וְ/אֶת בָּתֵּ֣י/נוּ הִצִּ֑יל וַ/יִּקֹּ֥ד הָ/עָ֖ם וַ/יִּֽשְׁתַּחֲוּֽוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/027.yaml
  text: you shall say[a], ‘It is the Passover sacrifice to Yahweh[c][b], who passed over the houses of the sons of Israel in Egypt when he struck Egypt and delivered our houses.’ And the people bowed down and worshiped.
translation:
  language: fr
  text: 'vous répondrez : « C’est le sacrifice de la Pâque offert à Yahweh[a], qui est passé par-dessus[b] les maisons des Israélites en Égypte lorsqu’il a frappé l’Égypte et a délivré nos maisons. » Alors le peuple s’inclina et se prosterna.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom hébreu יהוה, traditionnellement rendu par « le SEIGNEUR », est transcrit ici « Yahweh ».
    reason: divine_name
  - marker: b
    text: Le verbe hébreu appartient à la même famille que le nom « Pâque » ; il peut aussi évoquer le fait d’épargner ou de protéger.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח פֶּסַח
  choice: le sacrifice de la Pâque
  rationale: Rend la relation construite entre le sacrifice et la Pâque, tout en conservant explicitement la dimension sacrificielle.
- source_word: לַיהוָה
  choice: offert à Yahweh
  rationale: La préposition ל marque ici la destination ou la consécration du sacrifice; « offert à » est naturel en français dans ce contexte cultuel.
- source_word: פָּסַח
  choice: a passé par-dessus
  rationale: Maintient le lien lexical avec la Pâque et l’image traditionnelle du passage, sans effacer la nuance possible de protection.
- source_word: בָּתֵּי בְנֵי יִשְׂרָאֵל
  choice: les maisons des Israélites
  rationale: Expression française naturelle et exacte pour désigner les membres du peuple d’Israël; une traduction littérale par « fils d’Israël » serait ici moins immédiatement claire.
- source_word: בְּנָגְפּוֹ אֶת מִצְרַיִם
  choice: lorsqu’il a frappé l’Égypte
  rationale: Le ב préfixé à l’infinitif exprime la circonstance temporelle; « frapper » conserve la portée générale du verbe נכה.
- source_word: הִצִּיל
  choice: a délivré
  rationale: נצל au causatif signifie arracher au danger, délivrer ou sauver; « délivré » garde davantage cette force active que « épargné ».
- source_word: וַיִּקֹּד ... וַיִּשְׁתַּחֲווּ
  choice: s’inclina et se prosterna
  rationale: Distingue les deux verbes successifs et conserve leur dimension corporelle de révérence, sans réduire le second à une interprétation abstraite.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le caractère de nom propre de l’alliance.
- issue: Rapport entre פֶּסַח et פָּסַח
  choice: Pâque / passé par-dessus
  alternative: Pâque / épargné
  rationale: Le choix conserve l’écho lexical voulu entre le nom de la fête et le verbe, tandis qu’une note signale la nuance de protection.
- issue: Nature du geste exprimé par וַיִּשְׁתַּחֲווּ
  choice: se prosterna
  alternative: adora
  rationale: Le verbe décrit un geste de profonde révérence qui, dans ce contexte, a valeur d’adoration; le rendu concret évite de supprimer l’action physique et la distinction avec וַיִּקֹּד.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur « vous répondrez » convient à l’instruction donnée aux générations qui demanderont le sens du rite. Le contraste « mais a délivré » explicite naturellement en français l’opposition présente dans la coordination hébraïque.
