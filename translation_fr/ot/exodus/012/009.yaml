  text: אַל תֹּאכְל֤וּ מִמֶּ֨/נּוּ֙ נָ֔א וּ/בָשֵׁ֥ל מְבֻשָּׁ֖ל בַּ/מָּ֑יִם כִּ֣י אִם צְלִי אֵ֔שׁ רֹאשׁ֥/וֹ עַל כְּרָעָ֖י/ו וְ/עַל קִרְבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/009.yaml
  text: Do not eat any of it raw or boiled in water[a], but only roasted over the fire, with its head, its legs, and its inner parts.
translation:
  language: fr
  text: Ne le mangez ni cru ni bouilli dans l’eau, mais seulement rôti au feu, avec sa tête, ses pattes et ses entrailles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָא
  choice: cru
  rationale: Dans ce contexte culinaire, le terme désigne une viande non cuite; « cru » est l’équivalent français le plus direct et naturel, tout en laissant « insuffisamment cuit » comme nuance possible.
- source_word: וּבָשֵׁל מְבֻשָּׁל בַּמָּיִם
  choice: ni de bouilli dans l’eau
  rationale: La construction intensive avec la mention explicite de l’eau désigne précisément la cuisson par ébullition. La coordination « ni » s’accorde naturellement avec la première interdiction.
- source_word: כִּי אִם
  choice: mais seulement
  rationale: Cette locution marque une opposition exclusive entre les modes de cuisson interdits et celui qui est prescrit.
- source_word: צְלִי אֵשׁ
  choice: rôti au feu
  rationale: Cette formulation française naturelle conserve le moyen de cuisson exprimé par l’hébreu.
- source_word: רֹאשׁוֹ עַל כְּרָעָיו וְעַל קִרְבּוֹ
  choice: avec la tête, les pattes et les entrailles
  rationale: Dans cette énumération, עַל répété a le sens d’accompagnement. « Entrailles » rend concrètement קֶרֶב dans le contexte de l’animal entier, sans ajouter une interprétation absente du texte.
- source_word: מִמֶּנּוּ
  choice: en ... rien
  rationale: La tournure « n’en mangez rien » restitue naturellement en français le sens partitif de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste proche de la structure hébraïque tout en évitant les calques; « pattes » convient mieux que « jambes » pour un animal, et « entrailles » est précis dans ce contexte rituel et culinaire.
