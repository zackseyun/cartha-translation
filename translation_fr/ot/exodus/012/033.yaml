    issue: Enchaînement ambigu de « de partir au plus vite, afin de le renvoyer »
    rationale: La construction française répartit maladroitement l’urgence entre le départ du peuple et l’action des Égyptiens. Le double infinitif hébreu exprime l’empressement des Égyptiens à faire sortir le peuple ; une reformulation est nécessaire pour préserver cette relation.
