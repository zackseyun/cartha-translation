  text: וַ/תֶּחֱזַ֤ק מִצְרַ֨יִם֙ עַל הָ/עָ֔ם לְ/מַהֵ֖ר לְ/שַׁלְּחָ֣/ם מִן הָ/אָ֑רֶץ כִּ֥י אָמְר֖וּ כֻּלָּ֥/נוּ מֵתִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/033.yaml
  text: And the Egyptians urged the people on[a], hurrying to send them out of the land, for they said, “We are all dead men.”
translation:
  language: fr
  text: 'Les Égyptiens pressaient le peuple, se hâtant de le faire sortir du pays, car ils disaient : « Nous allons tous mourir ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֶּחֱזַק מִצְרַיִם עַל־הָעָם
  choice: Les Égyptiens pressaient le peuple
  rationale: Le nom de lieu « Égypte » désigne ici collectivement les Égyptiens. Avec עַל, חזק exprime une forte pression exercée sur le peuple ; « pressaient » restitue naturellement cette insistance.
- source_word: לְמַהֵר לְשַׁלְּחָם
  choice: de partir au plus vite, afin de le renvoyer
  rationale: Les deux infinitifs successifs associent urgence et renvoi. Cette formulation française conserve les deux notions sans reproduire une syntaxe hébraïque pesante ; le singulier collectif « le peuple » entraîne « le ».
- source_word: מִן־הָאָרֶץ
  choice: du pays
  rationale: Le syntagme signifie littéralement « hors du pays » ou « depuis le pays » et renvoie contextuellement à l’Égypte. « Du pays » reste fidèle sans explicitation superflue.
- source_word: כִּי אָמְרוּ
  choice: car ils disaient
  rationale: כִּי introduit la raison de cette pression, tandis que l’imparfait français rend naturellement la parole collective qui accompagne la scène.
- source_word: כֻּלָּנוּ מֵתִים
  choice: Nous allons tous mourir !
  rationale: Le participe מֵתִים peut exprimer ici une mort imminente. Après la mort des premiers-nés, cette tournure française rend clairement la crainte que tous ne finissent par mourir, plutôt que l’affirmation littéralement impossible qu’ils seraient déjà tous morts.
theological_decisions:
- issue: Valeur temporelle de מֵתִים
  choice: Nous allons tous mourir !
  alternative: Nous sommes tous morts !
  rationale: Le participe hébreu permet une nuance actuelle ou imminente. Le contexte favorise une exclamation de mort imminente, sans qu’il soit nécessaire d’en tirer une affirmation théologique plus précise.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase privilégie une syntaxe claire tout en conservant la force de la pression exercée, l’urgence des deux infinitifs et l’intensité de l’exclamation finale.
