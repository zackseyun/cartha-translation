base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/037.yaml
  text: And the sons of Israel journeyed from Rameses to Succoth[a], about six hundred thousand men on foot[d][c][b], besides children.
translation:
  language: fr
  text: 'Les fils d’Israël[a] partirent[b] de Ramsès pour Soukkoth : environ six cent mille hommes à pied[c], sans compter les enfants[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Les Israélites ». L’hébreu dit littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « levèrent le camp ». Le verbe hébreu peut désigner le départ d’un campement et le commencement d’une étape.'
    reason: lexical_alternative
  - marker: c
    text: Le nombre indiqué concerne expressément les hommes qui se déplaçaient à pied. Le verset ajoute que les enfants ne sont pas compris dans ce compte; il ne mentionne pas ici les femmes.
    reason: cultural_note
  - marker: d
    text: 'Littéralement : « les petits ». Le terme hébreu טף peut désigner les enfants ou les jeunes personnes à charge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: partirent
  rationale: Dans un récit de déplacement, נסע désigne couramment le fait de lever le camp et de se mettre en route. « Partirent » est naturel en français et laisse la note préciser cette nuance.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction conserve l’expression familiale de l’hébreu בני ישראל. « Les Israélites » serait plus idiomatique, mais moins proche de la formulation source.
- source_word: מֵרַעְמְסֵס
  choice: de Ramsès
  rationale: « Ramsès » est la forme française usuelle du nom de lieu, et la préposition מן marque ici le point de départ.
- source_word: סֻכֹּתָה
  choice: pour Soukkoth
  rationale: Le hé directionnel ajouté au nom indique un mouvement vers ce lieu. « Pour Soukkoth » exprime naturellement la destination en français.
- source_word: כְּשֵׁשׁ מֵאוֹת אֶלֶף
  choice: environ six cent mille
  rationale: Le préfixe כ־ appliqué au nombre marque ici l’approximation; « environ » évite de présenter le chiffre comme strictement exact.
- source_word: רַגְלִי הַגְּבָרִים
  choice: hommes à pied
  rationale: רגלי qualifie ceux qui se déplacent à pied, tandis que הגברים désigne explicitement les hommes. La formulation française reste concise et fidèle.
- source_word: לְבַד מִטָּף
  choice: sans compter les enfants
  rationale: טף désigne les petits, les enfants ou les jeunes personnes à charge. « Sans compter les enfants » exprime clairement qu’ils ne sont pas inclus dans le nombre indiqué.
