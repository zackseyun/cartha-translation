  text: A mixed multitude also went up with them[a], and flocks and herds—a very great amount of livestock.
translation:
  language: fr
  text: Une foule mêlée et nombreuse monta aussi avec eux[a], ainsi que du petit et du gros bétail, en très grand nombre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un grand groupe disparate » ou « une foule composite ». L’expression hébraïque עֵרֶב רַב désigne un groupe hétérogène qui accompagnait Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/גַם
  choice: aussi
  rationale: Rend naturellement la valeur additive de la conjonction accompagnée de גַם dans la suite du récit.
- source_word: עֵרֶב רַב
  choice: une foule mêlée, nombreuse
  rationale: « Foule mêlée » exprime le caractère hétérogène du groupe, tandis que « nombreuse » préserve la valeur quantitative de רַב sans préciser abusivement son origine ethnique.
- source_word: עָלָה
  choice: monta
  rationale: Conserve l’image directionnelle habituelle de עלה dans le récit de l’exode, en français narratif naturel.
- source_word: אִתָּם
  choice: avec eux
  rationale: Rend directement la relation d’accompagnement et renvoie aux Israélites mentionnés dans le contexte.
- source_word: וְ/צֹאן וּ/בָקָר
  choice: ainsi que du petit et du gros bétail
  rationale: « Petit bétail » désigne collectivement les ovins et caprins, et « gros bétail » les bovins; cette formulation française préserve la distinction des deux collectifs.
- source_word: מִקְנֶה כָּבֵד מְאֹד
  choice: des troupeaux en très grand nombre
  rationale: Avec מִקְנֶה, כָּבֵד מְאֹד indique idiomatiquement une quantité considérable plutôt qu’un poids matériel. La formulation évite aussi la lourdeur de « une très grande quantité de bétail ».
