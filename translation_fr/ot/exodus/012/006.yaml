  text: וְ/הָיָ֤ה לָ/כֶם֙ לְ/מִשְׁמֶ֔רֶת עַ֣ד אַרְבָּעָ֥ה עָשָׂ֛ר י֖וֹם לַ/חֹ֣דֶשׁ הַ/זֶּ֑ה וְ/שָׁחֲט֣וּ אֹת֗/וֹ כֹּ֛ל קְהַ֥ל עֲדַֽת יִשְׂרָאֵ֖ל בֵּ֥ין הָ/עַרְבָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/006.yaml
  text: And it shall be kept by you until the fourteenth day of this month[a], and the whole assembly of the congregation of Israel shall slaughter it between the evenings.
translation:
  language: fr
  text: Vous le garderez jusqu’au quatorzième jour de ce mois, et toute l’assemblée de la communauté d’Israël l’égorgera entre les deux soirs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « entre les deux soirs ». Le sens temporel précis de cette expression hébraïque est discuté; elle désigne généralement le moment autour du coucher du soleil ou du crépuscule.'
    reason: Préserve la formulation littérale du texte tout en signalant, sans trancher, l’incertitude relative à la période exacte visée.
lexical_decisions:
- source_word: וְהָיָה לָכֶם לְמִשְׁמֶרֶת
  choice: Il restera sous votre garde
  rationale: La tournure exprime naturellement en français la mise sous garde de l’animal jusqu’au jour fixé, tout en conservant la valeur prospective de l’instruction hébraïque.
- source_word: עַד אַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ הַזֶּה
  choice: jusqu’au quatorzième jour de ce mois
  rationale: Cette formulation claire et courante rend la date exprimée selon l’usage hébraïque.
- source_word: וְשָׁחֲטוּ אֹתוֹ
  choice: l’égorgera
  rationale: שׁחט désigne l’abattage d’un animal, souvent dans un cadre rituel. « Égorger » en conserve ici la précision mieux que le terme général « tuer ».
- source_word: כֹּל קְהַל עֲדַת יִשְׂרָאֵל
  choice: toute l’assemblée de la communauté d’Israël
  rationale: Cette traduction maintient les deux termes collectifs du texte hébreu et son insistance sur la participation corporative d’Israël.
- source_word: בֵּין הָעַרְבָּיִם
  choice: entre les deux soirs
  rationale: La traduction littérale conserve l’ambiguïté de cet idiome temporel hébreu, tandis que la note en indique le sens général sans trancher plus précisément.
theological_decisions:
- issue: Sujet collectif du commandement d’égorger l’animal
  choice: toute l’assemblée de la communauté d’Israël l’égorgera
  alternative: chaque famille égorgera son propre animal
  rationale: Le sujet hébreu présente Israël collectivement. Le contexte implique une exécution par les familles, mais la traduction ne remplace pas la formulation corporative du verset par cette explication.
translation_notes:
  register: Français international moderne, digne et accessible. « Il restera sous votre garde » évite une tournure juridique pesante; « l’égorgera » garde la précision concrète du verbe hébreu. La phrase est divisée en deux pour une lecture naturelle, sans modifier la progression de l’instruction.
