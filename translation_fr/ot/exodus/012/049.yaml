  text: One law shall be for the native and for the sojourner who sojourns among you[a].
translation:
  language: fr
  text: Il y aura une seule loi pour l’Israélite de naissance comme pour l’étranger qui réside parmi vous.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il y aura une seule instruction pour le natif comme pour l’étranger qui séjourne parmi vous. »'
    reason: Alternative lexicale pour תּוֹרָה (« instruction »), אֶזְרָח (« natif ») et גֵּר/הַגָּר (« étranger qui séjourne »).
lexical_decisions:
- source_word: תּוֹרָה
  choice: loi
  rationale: Dans ce contexte législatif relatif à la Pâque, le terme désigne une règle obligatoire; « loi » convient naturellement et conserve la force juridique de l’hébreu.
- source_word: אַחַת
  choice: une seule
  rationale: Cette formulation exprime clairement l’unicité de la norme applicable aux deux groupes, sans réduire le terme à la simple idée d’identité.
- source_word: יִהְיֶה
  choice: il y aura
  rationale: Cette tournure française rend directement le verbe « être » à l’inaccompli dans une prescription, tout en restant naturelle.
- source_word: אֶזְרָח
  choice: l’Israélite de naissance
  rationale: Dans ce contexte adressé à Israël, le mot désigne le membre autochtone de la communauté. Cette expression évite « citoyen », qui importerait une catégorie politique moderne, et « indigène », potentiellement ambigu en français actuel.
- source_word: גֵּר
  choice: l’immigré
  rationale: Le terme désigne ici un non-Israélite installé au sein de la communauté et soumis à son ordre social et juridique. « Immigré » exprime ce statut résidentiel plus clairement que « étranger » seul.
- source_word: הַגָּר
  choice: qui réside
  rationale: Le participe qualifie le גֵּר comme une personne effectivement établie parmi le peuple. « Qui réside » restitue ce sens sans répétition artificielle en français.
- source_word: בְּתוֹכְכֶם
  choice: parmi vous
  rationale: Expression française actuelle et fidèle pour la présence au sein de la communauté.
theological_decisions:
- issue: Égalité de la norme entre l’autochtone et l’immigré résident
  choice: Conserver la formule symétrique « pour… comme pour… »
  alternative: Expliciter que tous deux ont exactement les mêmes droits et obligations
  rationale: Le texte affirme une norme unique pour les deux catégories, mais ne développe pas ici toutes ses implications juridiques ou théologiques; la traduction ne doit pas les ajouter.
translation_notes:
  register: Français international moderne, clair et digne. « Immigré qui réside » privilégie l’intelligibilité contemporaine; la note conserve une formulation plus littérale. Le marqueur [a] figure dans le texte principal.
