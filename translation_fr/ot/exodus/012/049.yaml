revisions:
- from: Il y aura une seule loi pour l’Israélite de naissance comme pour l’immigré qui réside parmi vous.[a]
  to: Il y aura une seule loi pour l’Israélite de naissance comme pour l’étranger qui réside parmi vous.[a]
  rationale: La révision remplace « immigré » par « étranger », qualifié par « qui réside parmi vous », afin de rendre le statut de résident non autochtone visé par גֵּר sans introduire des connotations administratives modernes. La formulation conserve la symétrie juridique et la force d’unité de la norme. La note est ajustée pour offrir des alternatives lexicales naturelles en français moderne.
  reviewer_model: gpt-5.6-terra
