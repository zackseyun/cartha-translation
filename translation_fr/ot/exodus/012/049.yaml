  revision_rationale: La révision remplace « immigré » par « étranger », qualifié par « qui réside parmi vous », afin de rendre le statut de résident non autochtone visé par גֵּר sans introduire des connotations administratives modernes. La formulation conserve la symétrie juridique et la force d’unité de la norme. La note est ajustée pour offrir des alternatives lexicales naturelles en français moderne.
