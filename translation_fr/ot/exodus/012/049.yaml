review_pass:
  verdict: revise
  source_fidelity: 'Le sens central est bien rendu : une norme unique vaut pour l’אֶזְרָח et pour le גֵּר résidant au sein de la communauté. « Israélite de naissance » explicite de façon acceptable le référent contextuel de l’אֶזְרָח. En revanche, « immigré » évoque volontiers en français moderne un parcours migratoire ou une catégorie administrative contemporaine, tandis que גֵּר désigne avant tout l’étranger établi/résidant ; « étranger » avec la relative conserve mieux cette portée.'
  naturalness: La phrase est fluide et de registre approprié. « L’étranger qui réside parmi vous » est plus naturel, moins daté et moins chargé administrativement que « l’immigré qui réside parmi vous ». La note proposée évite aussi « autochtone », dont les connotations modernes ne conviennent pas idéalement ici.
  terminology: « Loi » convient à תּוֹרָה dans ce contexte juridique. « Une seule loi » rend אַחַת sans forcer l’interprétation. « Étranger » est ici précisé par « qui réside parmi vous » et rend donc le statut de גֵּר sans importer la notion contemporaine d’immigration. L’alternative « instruction » est légitime.
  issues:
  - severity: medium
    issue: « immigré » pour גֵּר
    rationale: Le mot français tend à désigner une personne ayant immigré, souvent dans un cadre sociopolitique moderne, plutôt que le statut juridique et social d’un étranger résidant dans la communauté. La relative hébraïque permet de rendre clairement ce statut avec « étranger qui réside parmi vous ».
  - severity: low
    issue: « autochtone » dans la note
    rationale: Bien que possible lexicalement, « autochtone » possède en français contemporain des connotations identitaires et coloniales qui ne sont pas requises par le texte. « Natif » constitue une alternative plus neutre pour l’option littérale.
  revised_text: Il y aura une seule loi pour l’Israélite de naissance comme pour l’étranger qui réside parmi vous.[a]
  revised_footnotes:
