revisions:
- from: Si un étranger réside chez toi[a] et célèbre la Pâque pour Yahweh[b], que tout homme de chez lui soit circoncis. Alors il pourra s’approcher pour la célébrer et il sera comme un autochtone du pays. Mais aucun incirconcis ne pourra en manger.
  to: Si un étranger réside chez toi[a] et célèbre la Pâque en l’honneur de Yahweh[b], que tout mâle de sa maisonnée soit circoncis. Alors il pourra s’approcher pour la célébrer et il sera comme un natif du pays. Mais aucun incirconcis ne pourra en manger.
  rationale: Révision limitée à des améliorations de clarté et d’usage moderne. « Maisonnée » explicite naturellement les personnes relevant de l’étranger sans introduire une catégorie théologique ; « natif du pays » évite la connotation contemporaine de « autochtone ». Le contenu, les conditions rituelles et l’ambiguïté limitée de « s’approcher » sont maintenus.
