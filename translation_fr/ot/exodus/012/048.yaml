review_pass:
  verdict: revise
  source_fidelity: 'Le sens et la progression juridique de l’hébreu sont bien rendus : résident étranger, célébration de la Pâque dédiée à Yahweh, circoncision préalable de tous les mâles relevant de lui, accès à l’observance et assimilation au natif. « Que … soit circoncis » rend convenablement la construction injonctive הִמּוֹל. La formulation révisée conserve l’admissibilité impliquée par וְאָז יִקְרַב sans surinterpréter le geste d’« approcher ».'
  naturalness: « Tout homme de chez lui » est peu idiomatique et imprécis en français moderne ; « tout mâle de sa maisonnée » exprime plus clairement le champ domestique visé. « Autochtone » peut évoquer dans l’usage moderne des peuples autochtones et ne convient pas idéalement au statut d’indigène/natif dans cette loi ; « natif du pays » est plus direct et naturel. « En l’honneur de Yahweh » rend naturellement la dédicace portée par לַיהוָה.
  terminology: « Pâque » au singulier et « Yahweh » sont appropriés. « Étranger » est acceptable, avec la note qui précise qu’il s’agit d’un résident étranger. « Incirconcis » respecte le terme hébreu substantivé et le contexte immédiatement masculin.
  issues:
  - severity: medium
    issue: « tout homme de chez lui »
    rationale: L’expression est inhabituelle et peut désigner simplement un homme venant de son domicile, plutôt que chaque mâle relevant de cet étranger. Le texte exige la circoncision de tout mâle de son groupe domestique.
  - severity: low
    issue: « un autochtone du pays »
    rationale: Dans le français international actuel, « autochtone » a souvent une portée ethnoculturelle spécifique. « Natif du pays » rend plus nettement אֶזְרַח, le natif/indigène par opposition au résident étranger.
  - severity: low
    issue: « pour Yahweh »
    rationale: Le sens est défendable, mais « en l’honneur de Yahweh » est plus idiomatique en français pour une célébration accomplie en dédicace à la divinité.
  revised_text: Si un étranger réside chez toi[a] et célèbre la Pâque en l’honneur de Yahweh[b], que tout mâle de sa maisonnée soit circoncis. Alors il pourra s’approcher pour la célébrer et il sera comme un natif du pays. Mais aucun incirconcis ne pourra en manger.
  revised_footnotes:
