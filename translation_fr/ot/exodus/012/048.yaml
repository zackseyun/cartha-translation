  text: וְ/כִֽי יָג֨וּר אִתְּ/ךָ֜ גֵּ֗ר וְ/עָ֣שָׂה פֶסַח֮ לַ/יהוָה֒ הִמּ֧וֹל ל֣/וֹ כָל זָכָ֗ר וְ/אָז֙ יִקְרַ֣ב לַ/עֲשֹׂת֔/וֹ וְ/הָיָ֖ה כְּ/אֶזְרַ֣ח הָ/אָ֑רֶץ וְ/כָל עָרֵ֖ל לֹֽא יֹ֥אכַל בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/048.yaml
  text: If a sojourner resides with you and keeps the Passover to Yahweh[a], every male belonging to him must be circumcised; then he may come near to keep it, and he shall be like a native of the land[c][b]. But no uncircumcised person may eat of it.
translation:
  language: fr
  text: Si un étranger réside chez toi[a] et célèbre la Pâque en l’honneur de Yahweh[b], que tout mâle de sa maisonnée soit circoncis. Alors il pourra s’approcher pour la célébrer et il sera comme un natif du pays. Mais aucun incirconcis ne pourra en manger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression désigne un étranger établi parmi les Israélites, c’est-à-dire un résident étranger, et non un simple voyageur.
    reason: lexical_alternative
  - marker: b
    text: Yahweh représente le nom divin écrit יהוה (YHWH) en hébreu.
    reason: alternative_reading
lexical_decisions:
- source_word: גֵּר / יָגוּר אִתְּךָ
  choice: un étranger réside chez toi
  rationale: גֵּר désigne ici un non-Israélite établi au milieu d’Israël, non un simple voyageur. La formulation française reste naturelle, tandis que la note précise la nuance juridique de résident étranger.
- source_word: וְעָשָׂה פֶסַח / לַעֲשֹׂתוֹ
  choice: célèbre la Pâque / pour la célébrer
  rationale: Le sens littéral est « faire la Pâque ». En français contemporain, « célébrer la Pâque » exprime naturellement l’accomplissement rituel sans ajouter le désir (« veut »), absent du texte hébreu.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל marque ici la destination ou la dédicace de la célébration. « Pour Yahweh » est idiomatique et conserve le nom divin.
- source_word: הִמּוֹל לוֹ כָל זָכָר
  choice: que tout homme de chez lui soit circoncis
  rationale: La construction impose la circoncision de tous les individus masculins relevant de l’étranger. « De chez lui » conserve la portée domestique ou collective sans introduire explicitement le mot « maison », absent de l’hébreu.
- source_word: וְאָז יִקְרַב
  choice: alors il pourra s’approcher
  rationale: Le verbe קרב évoque l’accès autorisé au rite après satisfaction de la condition. « Pourra » rend cette admissibilité sans réduire le verbe à un simple déplacement spatial.
- source_word: כְּאֶזְרַח הָאָרֶץ
  choice: comme un autochtone du pays
  rationale: אֶזְרַח désigne un membre natif de la population. « Autochtone du pays » garde la comparaison de statut dans une formulation concise.
- source_word: וְכָל עָרֵל לֹא יֹאכַל בּוֹ
  choice: aucun incirconcis ne pourra en manger
  rationale: Le masculin substantivé עָרֵל désigne ici celui qui n’est pas circoncis. La négation exprime l’interdiction ou l’inadmissibilité à prendre part au repas pascal.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre et évite de le remplacer par un titre.
- issue: Admission de l’étranger à la Pâque
  choice: Admission après la circoncision de tout homme de chez lui, avec assimilation à l’autochtone pour cette observance
  alternative: Exclusion ethnique absolue ; effacement de toute condition d’alliance
  rationale: Le verset associe inclusion et condition rituelle. La traduction maintient ces deux éléments sans les développer au moyen de catégories théologiques ultérieures.
- issue: Valeur de וְאָז יִקְרַב
  choice: 'permission ou admissibilité : « il pourra s’approcher »'
  alternative: 'simple futur : « il s’approchera » ; injonction : « qu’il s’approche »'
  rationale: Après l’exigence de circoncision, la forme peut décrire l’accès désormais ouvert. Le choix français explicite sobrement cette progression tout en laissant la nature exacte de l’approche non précisée.
translation_notes:
  register: Français international moderne, clair et digne. « Pâque » est au singulier conformément à l’usage biblique français pour la célébration d’Exode 12. La formulation évite l’ajout « veut célébrer », qui n’est pas exprimé lexicalement dans l’hébreu, et conserve la succession condition, circoncision, accès et statut.
