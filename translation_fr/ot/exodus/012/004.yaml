- from: Si la maisonnée est trop peu nombreuse pour une bête[a], l’homme et son voisin le plus proche de chez lui en prendront une, selon le nombre de personnes. Vous compterez, pour la bête, chacun selon ce qu’il peut manger[b].
  to: Si la maisonnée est trop peu nombreuse pour un animal du petit bétail[a], il le prendra avec le voisin le plus proche de sa maison, selon le nombre de personnes. Vous établirez le compte pour l’animal, selon ce que chacun peut manger[b].
