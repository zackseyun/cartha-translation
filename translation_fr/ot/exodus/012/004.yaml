review_pass:
  verdict: revise
  source_fidelity: La maisonnée et le décompte des personnes sont bien rendus. Toutefois, « bête » seul ne communique pas la restriction de שֶׂה au petit bétail, et la dernière phrase gagnerait à exprimer plus clairement que le décompte est établi en fonction de la consommation de chacun. La proximité est explicitement rapportée à la maison dans l’hébreu.
  naturalness: « L’homme et son voisin le plus proche de chez lui en prendront une » est lourd et « de chez lui » est peu idiomatique dans ce contexte. Une formulation avec « il la prendra avec le voisin le plus proche de sa maison » est plus naturelle tout en conservant le singulier initial et la référence à la maison. « Vous établirez le compte » est plus idiomatique que « Vous compterez » ici.
  terminology: « Animal du petit bétail » préserve le champ lexical de שֶׂה (mouton ou chèvre) sans imposer « agneau ». « Maisonnée », « personnes » et « chacun » conviennent au registre moderne et n’introduisent pas d'interprétation doctrinale.
  issues:
  - severity: medium
    issue: « bête » est trop indéterminé dans le texte principal.
    rationale: שֶׂה désigne un animal du petit bétail, non un animal quelconque. La note indique cette restriction, mais le texte peut la refléter sans lever l’ambiguïté entre mouton et chèvre.
  - severity: medium
    issue: La formulation du voisin est peu naturelle et la dernière proposition est syntaxiquement opaque.
    rationale: « son voisin le plus proche de chez lui » est maladroit en français. Dans « Vous compterez, pour la bête, chacun selon ce qu’il peut manger », le rôle de « chacun » dans le calcul est insuffisamment explicite.
  - severity: low
    issue: La note b introduit « la part de chacun ».
    rationale: Le texte hébreu parle de calculer/établir le compte en fonction de la consommation; il ne mentionne pas explicitement une « part ». Une note doit éviter cet ajout.
