base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/004.yaml
  text: And if the household is too small for a lamb[a], then he and his nearest neighbor shall take one according to the number of persons; each man according to what he can eat[b], you shall count for the lamb.
translation:
  language: fr
  text: Si la maisonnée est trop peu nombreuse pour un animal du petit bétail[a], il le prendra avec le voisin le plus proche de sa maison, selon le nombre de personnes. Vous établirez le compte pour l’animal, selon ce que chacun peut manger[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner une tête de petit bétail, prise parmi les moutons ou les chèvres.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Vous calculerez pour l’animal, selon ce que chacun mange. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְעַט הַבַּיִת מִהְיֹת מִשֶּׂה
  choice: la maisonnée est trop peu nombreuse pour une bête
  rationale: « Maisonnée » désigne naturellement les personnes du foyer. La tournure exprime l’insuffisance numérique du groupe par rapport à un seul animal.
- source_word: שֶׂה
  choice: bête
  rationale: Le terme hébreu désigne ici une tête de petit bétail, mouton ou chèvre. « Bête » reste lisible dans le contexte immédiat sans réduire indûment le sens à « agneau ».
- source_word: וְלָקַח הוּא וּשְׁכֵנוֹ הַקָּרֹב אֶל־בֵּיתוֹ
  choice: l’homme et son voisin le plus proche de chez lui en prendront une
  rationale: Le pronom masculin singulier renvoie au responsable du foyer mentionné dans le contexte; « de chez lui » conserve la référence explicite à la proximité de la maison.
- source_word: בְּמִכְסַת נְפָשֹׁת
  choice: selon le nombre de personnes
  rationale: מִכְסָה évoque un décompte, et נְפָשֹׁת désigne ici des personnes, non des âmes désincarnées.
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: chacun selon ce qu’il peut manger
  rationale: אִישׁ a ici une valeur distributive. L’expression idiomatique concerne la quantité que chaque personne mangera ou est capable de manger.
- source_word: תָּכֹסּוּ עַל־הַשֶּׂה
  choice: Vous compterez, pour la bête
  rationale: Le verbe rare exprime le calcul ou le décompte des participants en fonction de l’animal; cette formulation maintient le sens comptable sans préciser davantage que l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement réordonnée pour rendre clairement la portée distributive de « chacun » et l’impératif pluriel. « Maisonnée » évite la confusion entre le bâtiment et le groupe familial.
