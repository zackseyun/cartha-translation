base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/042.yaml
  text: It was a night of vigil for Yahweh[a], to bring them out from the land of Egypt; this same night is a vigil for Yahweh for all the children of Israel throughout their generations.
translation:
  language: fr
  text: Ce fut une nuit de veille pour Yahweh[a], pour les faire sortir du pays d’Égypte. Cette même nuit est une veille pour Yahweh, pour tous les enfants d’Israël, de génération en génération.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une nuit de garde » ou « une nuit d’observance ». Le mot hébreu שִׁמֻּרִים évoque la vigilance, la garde ou une observance commémorative. La relation de cette veille à Yahweh peut aussi suggérer une nuit durant laquelle Yahweh a veillé.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵיל שִׁמֻּרִים
  choice: une nuit de veille
  rationale: Le construit לֵיל suivi de שִׁמֻּרִים désigne une nuit caractérisée par la garde ou la vigilance. « Nuit de veille » est naturel en français et conserve la portée concrète ainsi que commémorative de l’expression.
- source_word: לַיהוָה
  choice: consacrée à Yahweh
  rationale: La préposition ל marque ici la relation ou la destination particulière de cette nuit à Yahweh. « Consacrée à » explicite cette relation en français sans faire de Yahweh celui qui veille de manière univoque.
- source_word: לְהוֹצִיאָם
  choice: lorsqu’il les fit sortir
  rationale: L’infinitif avec ל rattache la nuit à l’action divine de faire sortir Israël. Le tour temporel est idiomatique dans ce contexte rétrospectif, tout en gardant Yahweh comme sujet implicite de l’action.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: du pays d’Égypte
  rationale: Cette formulation conserve explicitement אֶרֶץ, « pays ».
- source_word: הוּא הַלַּיְלָה הַזֶּה
  choice: Cette même nuit
  rationale: « Même » rend l’identification emphatique produite par le pronom הוּא et le démonstratif הַזֶּה.
- source_word: לְכָל בְּנֵי יִשְׂרָאֵל
  choice: pour tous les enfants d’Israël
  rationale: Cette traduction préserve l’expression familiale et collective בְּנֵי יִשְׂרָאֵל plutôt que de la réduire au seul ethnonyme « Israélites ».
- source_word: לְדֹרֹתָם
  choice: de génération en génération
  rationale: Expression française courante qui rend la continuité à travers les générations successives.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre divin sans le remplacer par un titre.
- issue: Sens de שִׁמֻּרִים dans son contexte historique et cultuel
  choice: veille
  alternative: vigilance ; garde ; observance
  rationale: « Veille » maintient la tension entre le fait de veiller et l’observance commémorative, sans réduire le mot à un rite ni à une simple surveillance.
- issue: Rapport de la nuit à Yahweh dans לַיהוָה
  choice: consacrée à Yahweh
  alternative: veille de Yahweh ; veille pour Yahweh
  rationale: L’hébreu peut évoquer une veille appartenant à Yahweh, accomplie par lui ou observée en son honneur. Le choix retenu exprime la relation/dédicace tout en laissant la note signaler l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « nuit » et de « veille » reproduit la structure insistante de l’hébreu. « Enfants d’Israël » conserve la formulation biblique familiale sans archaïsme syntaxique.
