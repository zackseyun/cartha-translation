- from: Ce fut une nuit de veille consacrée à Yahweh[a], lorsqu’il les fit sortir du pays d’Égypte. Cette même nuit est une veille consacrée à Yahweh pour tous les enfants d’Israël, de génération en génération.
  to: Ce fut une nuit de veille pour Yahweh[a], pour les faire sortir du pays d’Égypte. Cette même nuit est une veille pour Yahweh, pour tous les enfants d’Israël, de génération en génération.
  rationale: La révision retire l’explicitation « consacrée à », qui résout indûment une ambiguïté du texte hébreu, et remplace la subordonnée temporelle par une formulation qui reflète plus directement l’infinitif avec ל. Le reste du texte est conservé, y compris la répétition rhétorique et le registre moderne.
