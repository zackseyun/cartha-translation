  - severity: low
    issue: « lorsqu’il les fit sortir » interprète le syntagme לְהוֹצִיאָם comme temporel.
    rationale: L’infinitif précédé de ל relie la nuit à la sortie d’Égypte sans exiger une lecture temporelle. « Pour les faire sortir » reste plus proche de la construction hébraïque.
