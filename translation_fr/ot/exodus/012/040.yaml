  yaml_path: translation/ot/exodus/012/040.yaml
  text: The dwelling of the sons of Israel[a], who lived in Egypt, was four hundred thirty years.
translation:
  language: fr
  text: Le séjour des fils d’Israël[a], qui habitèrent en Égypte, dura quatre cent trente ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains témoins anciens portent : « Le séjour des fils d’Israël et de leurs pères en Égypte et en Canaan dura quatre cent trente ans. »'
    reason: textual_variant
lexical_decisions:
- source_word: מוֹשַׁב
  choice: séjour
  rationale: Le nom désigne ici la résidence envisagée dans sa durée. « Séjour » conserve la forme nominale et convient naturellement au contexte, sans suggérer nécessairement une installation permanente.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette expression rend directement la formule hébraïque traditionnelle et conserve sa portée familiale et collective.
- source_word: אֲשֶׁר יָשְׁבוּ
  choice: qui habitèrent
  rationale: Le relatif hébreu se rapporte grammaticalement aux fils d’Israël. « Habitèrent » exprime naturellement ici le fait de résider, tout en gardant la relative sans la réinterpréter comme une indication temporelle explicite.
- source_word: בְּמִצְרָיִם
  choice: en Égypte
  rationale: Traduction locative directe de la préposition et du nom de lieu.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: quatre cent trente ans
  rationale: L’ordre des éléments numériques est adapté à l’usage français, sans modifier la durée indiquée. « Cent » reste invariable puisqu’il est suivi de « trente ».
theological_decisions:
- issue: 'Étendue chronologique des 430 ans : Égypte seule ou séjour patriarcal plus large'
  choice: Le texte principal suit le texte massorétique fourni et rattache les quatre cent trente ans au séjour en Égypte.
  alternative: Certains témoins anciens ajoutent les pères des Israélites et Canaan, ce qui étend la période au séjour patriarcal en Canaan et en Égypte.
  rationale: La leçon du WLC mentionne explicitement l’Égypte seule. La variante ancienne étant importante pour la chronologie, elle est signalée en note plutôt qu’intégrée au texte principal.
translation_notes:
  register: Français moderne, digne et accessible. « Dura » rend idiomatiquement la durée exprimée par la proposition nominale hébraïque. La formulation conserve « fils d’Israël » plutôt que de lisser en « Israélites », et la variante chronologique est maintenue en note.
