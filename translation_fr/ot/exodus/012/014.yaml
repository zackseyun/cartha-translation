language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָה֩ הַ/יּ֨וֹם הַ/זֶּ֤ה לָ/כֶם֙ לְ/זִכָּר֔וֹן וְ/חַגֹּתֶ֥ם אֹת֖/וֹ חַ֣ג לַֽ/יהוָ֑ה לְ/דֹרֹ֣תֵי/כֶ֔ם חֻקַּ֥ת עוֹלָ֖ם תְּחָגֻּֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/014.yaml
  text: And this day shall be for you as a memorial[a], and you shall celebrate it as a feast to Yahweh; throughout your generations, you shall celebrate it as a permanent statute.
translation:
  language: fr
  text: 'Ce jour sera pour vous un mémorial, et vous le célébrerez comme une fête en l’honneur de Yahweh. De génération en génération, vous le célébrerez : c’est une prescription permanente[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une prescription perpétuelle » ou « une prescription pour toujours ». L’expression hébraïque חֻקַּת עוֹלָם désigne souvent une règle durable, destinée à rester en vigueur.
    reason: alternative lexicale et nuance de durée
lexical_decisions:
- source_word: וְהָיָה
  choice: sera
  rationale: 'Dans ce contexte d’instruction, le parfait avec waw a une valeur prospective : ce jour est institué comme mémorial pour Israël.'
- source_word: הַיּוֹם הַזֶּה
  choice: ce jour
  rationale: Rend directement le syntagme démonstratif sans lui ajouter une emphase absente de l’hébreu.
- source_word: לָכֶם
  choice: pour vous
  rationale: La préposition exprime ici la relation et la destination au bénéfice des destinataires.
- source_word: לְזִכָּרוֹן
  choice: un mémorial
  rationale: זִכָּרוֹן désigne ce qui entretient le souvenir ; « mémorial » convient au contexte cultuel et reste clair en français contemporain.
- source_word: וְחַגֹּתֶם אֹתוֹ חַג
  choice: vous le célébrerez comme une fête
  rationale: Le verbe חגג et le nom apparenté חַג évoquent la célébration d’une fête. Cette formulation restitue leur proximité sémantique sans produire une répétition française maladroite.
- source_word: לַיהוָה
  choice: en l’honneur de Yahweh
  rationale: La fête est destinée à Yahweh. « En l’honneur de » exprime naturellement en français cette orientation cultuelle, tandis que le nom divin est conservé.
- source_word: לְדֹרֹתֵיכֶם
  choice: de génération en génération
  rationale: Cette tournure idiomatique exprime clairement la continuité de l’observance parmi les générations successives.
- source_word: חֻקַּת עוֹלָם
  choice: une prescription permanente
  rationale: חֻקָּה désigne une règle prescrite, et עוֹלָם marque ici sa durée continue. « Permanente » conserve la force juridique sans imposer une précision métaphysique excessive.
- source_word: תְּחָגֻּהוּ
  choice: vous le célébrerez
  rationale: La reprise du verbe renforce l’ordre. La répétition est maintenue parce qu’elle est nette et naturelle en français.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom d’alliance au lieu de le remplacer par un titre.
- issue: Portée de חֻקַּת עוֹלָם dans la législation de l’alliance
  choice: une prescription permanente
  alternative: une prescription perpétuelle ; une prescription pour toujours
  rationale: L’expression affirme une observance durable au fil des générations. « Permanente » préserve cette force tout en laissant intacte la portée contextuelle de עוֹלָם.
translation_notes:
  register: Français international moderne, digne et accessible. La structure en deux phrases allège la longue coordination hébraïque. Les deux occurrences de « célébrerez » sont conservées afin de rendre l’insistance du texte source. Le deux-points explicite l’apposition juridique sans modifier son contenu.
