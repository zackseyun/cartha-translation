source:
  edition: WLC
  text: וְ/עָבַ֣ר יְהוָה֮ לִ/נְגֹּ֣ף אֶת מִצְרַיִם֒ וְ/רָאָ֤ה אֶת הַ/דָּם֙ עַל הַ/מַּשְׁק֔וֹף וְ/עַ֖ל שְׁתֵּ֣י הַ/מְּזוּזֹ֑ת וּ/פָסַ֤ח יְהוָה֙ עַל הַ/פֶּ֔תַח וְ/לֹ֤א יִתֵּן֙ הַ/מַּשְׁחִ֔ית לָ/בֹ֥א אֶל בָּתֵּי/כֶ֖ם לִ/נְגֹּֽף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/023.yaml
  text: For Yahweh will pass through to strike Egypt[a], and when he sees the blood on the lintel and on the two doorposts[b], Yahweh will pass over the doorway and will not allow the destroyer to enter your houses to strike.
translation:
  language: fr
  text: Car Yahweh parcourra l’Égypte pour la frapper. Quand il verra le sang sur le linteau et sur les deux montants de la porte, Yahweh passera par-dessus l’entrée[a] et ne permettra pas au destructeur[b] d’entrer dans vos maisons pour frapper.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « épargnera » ou « protégera ». Le verbe hébreu est celui qui est associé à la Pâque.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu ne précise pas l’identité du « destructeur »; certains y voient un agent angélique du jugement.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Conserve le nom divin personnel sous une forme française courante de translittération, plutôt que de lui substituer un titre.
- source_word: וְעָבַר
  choice: parcourra
  rationale: Dans la première proposition, עבר décrit le déplacement de Yahweh à travers l’Égypte en vue du jugement; « parcourra » le distingue naturellement de פסח plus loin dans le verset.
- source_word: לִנְגֹּף
  choice: pour la frapper
  rationale: נגף désigne ici une frappe de jugement mortelle. Le pronom féminin reprend naturellement « l’Égypte » en français.
- source_word: וְרָאָה
  choice: Quand il verra
  rationale: Rend naturellement la valeur temporelle de la forme verbale dans la séquence future.
- source_word: הַמַּשְׁקוֹף
  choice: le linteau
  rationale: Terme architectural précis et usuel pour la traverse supérieure de l’encadrement.
- source_word: שְׁתֵּי הַמְּזוּזֹת
  choice: les deux montants de la porte
  rationale: Désigne clairement les deux éléments verticaux de l’encadrement dans un français accessible.
- source_word: וּפָסַח
  choice: passera par-dessus
  rationale: Préserve l’image spatiale et le lien lexical central avec la Pâque, tout en laissant ouvertes les nuances possibles d’épargner ou de protéger.
- source_word: עַל הַפֶּתַח
  choice: l’entrée
  rationale: פתח désigne ici l’ouverture ou l’entrée de la maison; ce choix évite de confondre celle-ci avec les éléments de l’encadrement déjà mentionnés.
- source_word: וְלֹא יִתֵּן
  choice: ne permettra pas
  rationale: נתן suivi de l’infinitif exprime idiomatiquement la permission; cette formulation est naturelle en français moderne.
- source_word: הַמַּשְׁחִית
  choice: le destructeur
  rationale: Rend l’agent substantivé sans préciser son identité au-delà de ce que dit l’hébreu.
theological_decisions:
- issue: Rapport entre Yahweh et « le destructeur »
  choice: 'Les deux sont désignés distinctement: Yahweh exerce le jugement et empêche le destructeur d’entrer dans les maisons.'
  alternative: Comprendre « le destructeur » comme une autre désignation de Yahweh, ou préciser « l’ange destructeur ».
  rationale: La syntaxe hébraïque distingue יְהוָה de הַמַּשְׁחִית. La traduction conserve cette distinction sans déterminer l’identité du destructeur.
- issue: Sens de פסח dans ce verset
  choice: « passera par-dessus » dans le texte principal
  alternative: « épargnera » ou « protégera »
  rationale: Ce choix maintient l’image et le lien lexical avec la Pâque, tandis qu’une note signale les nuances sémantiques possibles sans trancher une ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase est divisée en deux pour alléger la syntaxe sans modifier la progression logique. « Parcourra » et « passera par-dessus » distinguent les deux verbes hébreux. Tous les marqueurs de notes figurent dans le texte principal.
