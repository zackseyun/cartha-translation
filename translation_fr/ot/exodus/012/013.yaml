review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèle au texte hébreu. Toutefois, « passerai au-dessus de vous » est peu idiomatique et évoque davantage un déplacement physique au-dessus des personnes que la formule traditionnelle et lexicalement liée à la Pâque. La note b, qui porte sur לְמַשְׁחִית, doit être ancrée à « pour détruire », non à la fin de la phrase.
  naturalness: « Où vous vous trouverez » est inutilement lourd dans ce contexte ; « où vous êtes » est direct et naturel. « Je passerai par-dessus vous » est l’expression française établie et reste compréhensible en français international moderne.
  terminology: « Sang », « signe », « fléau » et « pays d’Égypte » conviennent. « Par-dessus » maintient le lien lexical et narratif avec la Pâque sans trancher indûment entre les nuances « passer outre », « épargner » et « protéger ».
  issues:
  - severity: medium
    issue: Formulation de פסח
    rationale: « Je passerai au-dessus de vous » est maladroit en français et peut suggérer que Dieu passe physiquement au-dessus des Israélites. « Je passerai par-dessus vous » est plus idiomatique, conserve l’image spatiale et le lien avec la Pâque.
  - severity: medium
    issue: Ancrage de la note b
    rationale: La note explique l’analyse alternative de לְמַשְׁחִית, rendu par « pour détruire » ; son marqueur doit donc suivre cette expression plutôt que « pays d’Égypte ».
  - severity: low
    issue: Relative « où vous vous trouverez »
    rationale: Le présent hébreu identifie les maisons occupées. « Où vous êtes » est plus simple et plus naturel, sans perte de sens.
  revised_text: Le sang sera pour vous un signe sur les maisons où vous êtes. Quand je verrai le sang, je passerai par-dessus vous[a], et aucun fléau ne viendra parmi vous pour détruire[b], lorsque je frapperai le pays d’Égypte.
