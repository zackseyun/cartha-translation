base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/013.yaml
  text: And the blood shall be a sign for you on the houses where you are[a]. When I see the blood, I will pass over you[b], and no plague will be among you to destroy, when I strike the land of Egypt.
translation:
  language: fr
  text: Le sang sera pour vous un signe sur les maisons où vous êtes. Quand je verrai le sang, je passerai par-dessus vous[a], et aucun fléau ne viendra parmi vous pour détruire[b], lorsque je frapperai le pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je vous épargnerai » ou « je vous protégerai ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autre compréhension possible : « et aucun fléau destructeur ne viendra parmi vous lorsque je frapperai le pays d’Égypte », en prenant le terme hébreu comme désignant ce qui détruit.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה הַדָּם לָכֶם לְאֹת
  choice: Le sang sera pour vous un signe
  rationale: Le parfait avec waw prend ici une valeur future dans le cadre des instructions; « pour vous » conserve la valeur de référence ou de bénéfice de לָכֶם.
- source_word: עַל הַבָּתִּים אֲשֶׁר אַתֶּם שָׁם
  choice: sur les maisons où vous vous trouverez
  rationale: « Sur » rend la relation spatiale, tandis que le futur « vous vous trouverez » exprime naturellement en français la situation envisagée.
- source_word: וְרָאִיתִי אֶת־הַדָּם
  choice: Quand je verrai le sang
  rationale: La coordination hébraïque exprime ici naturellement une circonstance temporelle; le futur antérieur n’est pas nécessaire en français.
- source_word: וּפָסַחְתִּי עֲלֵכֶם
  choice: je passerai au-dessus de vous
  rationale: Cette formulation garde le lien lexical traditionnel avec la Pâque sans réduire le verbe à son seul effet, qui peut aussi être compris comme « épargner » ou « protéger ».
- source_word: וְלֹא יִהְיֶה בָכֶם נֶגֶף
  choice: et aucun fléau ne viendra parmi vous
  rationale: « Fléau » convient à נֶגֶף dans le contexte d’un coup destructeur; « parmi vous » reflète בָכֶם et la tournure verbale rend la phrase idiomatique.
- source_word: לְמַשְׁחִית
  choice: pour détruire
  rationale: La forme est rendue selon sa valeur finale ou résultative, sans imposer dans le texte principal un agent personnel distinct.
- source_word: בְּהַכֹּתִי בְּאֶרֶץ מִצְרָיִם
  choice: lorsque je frapperai le pays d’Égypte
  rationale: L’infinitif construit précédé de בְּ exprime la circonstance temporelle; en français, « frapper le pays d’Égypte » restitue naturellement la construction.
theological_decisions:
- issue: Sens de וּפָסַחְתִּי עֲלֵכֶם dans l’institution de la Pâque
  choice: je passerai au-dessus de vous
  alternative: je vous épargnerai; je vous protégerai
  rationale: Le texte principal préserve le lien lexical avec la Pâque et la métaphore spatiale, tandis que la note conserve les nuances possibles d’épargne ou de protection.
- issue: 'Valeur de לְמַשְׁחִית : résultat destructeur ou agent personnel'
  choice: pour détruire
  alternative: à cause du destructeur; pour qu’un destructeur agisse
  rationale: L’hébreu permet une lecture verbale/finale comme une lecture substantivée. Le texte principal n’explicite pas un agent que la syntaxe n’impose pas, et la note signale l’autre analyse.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la solennité de la promesse divine sans archaïsmes. Les deux notes sont placées immédiatement après les expressions concernées et maintiennent les ambiguïtés lexicales réelles de l’hébreu.
