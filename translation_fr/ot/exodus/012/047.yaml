  text: All the congregation of Israel shall do it[a].
translation:
  language: fr
  text: Toute la communauté d’Israël la célébrera[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Toute l’assemblée d’Israël le fera. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Toute
  rationale: Avec le nom collectif singulier « communauté », « toute » exprime naturellement la totalité visée par le quantificateur hébreu.
- source_word: עֲדַת
  choice: la communauté d’
  rationale: עֵדָה désigne ici le peuple d’Israël comme corps constitué. « Communauté » est naturel en français moderne et conserve la portée collective, tandis qu’« assemblée » pourrait suggérer seulement une réunion ponctuelle.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre est conservé selon l’usage français établi.
- source_word: יַעֲשׂוּ
  choice: la célébrera
  rationale: Le verbe עשה signifie littéralement « faire », mais, avec pour objet la Pâque évoquée dans le contexte, il prend naturellement le sens d’accomplir ou de célébrer cette observance. « La célébrera » rend ce sens en français idiomatique sans préciser davantage le rite.
- source_word: אֹתוֹ
  choice: la
  rationale: Le pronom objet masculin hébreu renvoie à un antécédent contextuel lié à la Pâque. En français, le pronom féminin « la » reprend naturellement « la Pâque » sans répéter le nom.
theological_decisions:
- issue: Portée collective du commandement pascal
  choice: « Toute la communauté d’Israël » présente Israël collectivement comme sujet de la célébration.
  alternative: « Chaque Israélite » individualiserait le commandement.
  rationale: Le nom collectif עֵדָה, accompagné de כָּל, désigne l’ensemble de la communauté comme corps; le texte ne formule pas explicitement une obligation isolée pour chaque individu.
- issue: Référent du pronom objet
  choice: Le pronom est rendu comme renvoyant à la Pâque à célébrer.
  alternative: Il pourrait être compris plus largement comme renvoyant au rite ou à ce qui vient d’être prescrit.
  rationale: Le contexte immédiat soutient le renvoi à la Pâque, mais la note conserve la formulation plus littérale et l’indétermination relative du pronom hébreu.
translation_notes:
  register: Français international moderne, simple et digne. « Communauté » garde la dimension corporative; « célébrera » évite le calque peu naturel « le fera » dans le texte principal, tandis que la note en conserve la forme littérale.
