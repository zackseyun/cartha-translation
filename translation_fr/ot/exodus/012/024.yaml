  text: And you shall keep this thing as a statute for you and for your sons forever[a][b].
translation:
  language: fr
  text: Vous observerez cette disposition comme une prescription pour toi et pour tes fils à jamais[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette parole », « cette chose » ou « cette affaire ». Le terme hébreu a un sens large et peut désigner une parole, une chose ou une affaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour toi et pour tes enfants » ou « pour toi et pour tes descendants ». L’hébreu dit littéralement « pour toi et pour tes fils ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Vous observerez
  rationale: Dans ce contexte rituel et juridique, שׁמר signifie respecter fidèlement une prescription. « Observer » est naturel en français biblique moderne et conserve l’idée d’obéissance durable.
- source_word: הַדָּבָר הַזֶּה
  choice: cette prescription
  rationale: דָּבָר peut désigner une parole, une chose ou une affaire. Ici, il renvoie aux instructions pascales précédentes ; « prescription » rend clairement le référent sans le réduire à une simple parole.
- source_word: לְחָק
  choice: comme une règle établie
  rationale: חֹק désigne ce qui est fixé ou prescrit, notamment une règle ayant force durable. « Règle établie » en exprime la portée juridique dans un français courant et digne.
- source_word: לְךָ וּלְבָנֶיךָ
  choice: pour toi et pour tes fils
  rationale: Le texte passe du verbe au pluriel à des suffixes au masculin singulier et dit littéralement « tes fils ». La traduction conserve à la fois ce changement de nombre et la formulation masculine du texte.
- source_word: עַד עוֹלָם
  choice: à jamais
  rationale: La locution exprime une durée indéfiniment prolongée ou perpétuelle. « À jamais » en garde la force tout en convenant au registre.
theological_decisions:
- issue: Portée de « tes fils » dans la transmission de la prescription
  choice: Conserver « tes fils » dans le texte principal
  alternative: « tes enfants » ou « tes descendants »
  rationale: L’hébreu porte explicitement בָנֶיךָ, « tes fils ». La portée représentative ou générationnelle possible ne doit pas remplacer la forme lexicale dans le corps du texte.
- issue: Alternance entre l’adresse plurielle et singulière
  choice: Conserver « Vous observerez » puis « pour toi »
  alternative: Uniformiser en « vous… pour vous » ou « tu… pour toi »
  rationale: Le texte massorétique présente réellement cette alternance. La préserver maintient une particularité significative de l’adresse sans la résoudre silencieusement.
translation_notes:
  register: 'Français international moderne, digne et accessible. L’alternance de nombre de l’hébreu est volontairement conservée : « Vous observerez » s’adresse au groupe, puis « pour toi et pour tes fils » emploie le singulier représentatif.'
