  text: וַ/יִּקְרָא֩ לְ/מֹשֶׁ֨ה וּֽ/לְ/אַהֲרֹ֜ן לַ֗יְלָה וַ/יֹּ֨אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִ/תּ֣וֹךְ עַמִּ֔/י גַּם אַתֶּ֖ם גַּם בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/לְכ֛וּ עִבְד֥וּ אֶת יְהוָ֖ה כְּ/דַבֶּרְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/031.yaml
  text: Then he called for Moses and Aaron by night and said[a], “Rise up, go out from among my people, both you and the sons of Israel, and go, serve Yahweh[b], as you have said.”
translation:
  language: fr
  text: 'Pendant la nuit, il fit appeler Moïse et Aaron et leur dit : « Levez-vous, sortez du milieu de mon peuple, vous et les Israélites[a]. Allez servir Yahweh, comme vous l’avez dit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: il fit appeler
  rationale: Dans ce contexte, קרא désigne l’ordre urgent de faire venir Moïse et Aaron. « Fit appeler » est idiomatique en français et n’ajoute pas la formalité de « convoqua ».
- source_word: לַיְלָה
  choice: pendant la nuit
  rationale: L’accusatif adverbial indique le moment de l’action. Cette formulation naturelle conserve l’insistance narrative sur la nuit.
- source_word: קוּמוּ צְּאוּ
  choice: Levez-vous, sortez
  rationale: Les deux impératifs sont maintenus séparément afin de préserver leur urgence et leur progression.
- source_word: מִתּוֹךְ עַמִּי
  choice: du milieu de mon peuple
  rationale: Cette traduction garde l’image spatiale de מִתּוֹךְ et la référence explicite de Pharaon à « mon peuple ».
- source_word: גַּם אַתֶּם גַּם בְּנֵי יִשְׂרָאֵל
  choice: vous et les Israélites
  rationale: La coordination exprime l’inclusion insistante de Moïse et Aaron avec l’ensemble d’Israël. « Les Israélites » rend naturellement en français l’expression hébraïque littérale « les fils d’Israël », signalée en note.
- source_word: וּלְכוּ עִבְדוּ
  choice: Allez servir
  rationale: La succession des impératifs est conservée. « Servir » maintient le champ sémantique large de עבד, qui peut inclure le culte sans s’y limiter.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: כְּדַבֶּרְכֶם
  choice: comme vous l’avez dit
  rationale: La formule exprime la conformité à la demande formulée auparavant par Moïse et Aaron, sans préciser davantage son contenu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Portée de עִבְדוּ
  choice: servir
  alternative: rendre un culte à
  rationale: « Servir » préserve l’étendue de sens du verbe hébreu et ne réduit pas explicitement l’ordre au seul acte cultuel.
translation_notes:
  register: Français international moderne, direct et digne. Les impératifs restent brefs pour restituer l’urgence de la scène. La ponctuation française clarifie le discours sans développer les ellipses de l’hébreu.
