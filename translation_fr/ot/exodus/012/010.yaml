source:
  edition: WLC
  text: וְ/לֹא תוֹתִ֥ירוּ מִמֶּ֖/נּוּ עַד בֹּ֑קֶר וְ/הַ/נֹּתָ֥ר מִמֶּ֛/נּוּ עַד בֹּ֖קֶר בָּ/אֵ֥שׁ תִּשְׂרֹֽפוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/010.yaml
  text: You shall not leave any of it until morning[a], and what remains of it until morning you shall burn with fire.
translation:
  language: fr
  text: Vous n’en laisserez rien jusqu’au matin ; ce qui en restera jusqu’au matin, vous le brûlerez au feu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תוֹתִירוּ
  choice: laisserez
  rationale: Le hifil de יתר signifie ici « laisser subsister » ou « laisser en reste ». Avec la négation et « rien », « vous n’en laisserez rien » est naturel en français et exprime clairement l’interdiction.
- source_word: מִמֶּנּוּ
  choice: en… rien / en
  rationale: Le français reprend idiomatiquement מן avec suffixe par le pronom « en ». Dans la première proposition, « rien » explicite la portée totale de la négation déjà impliquée par l’hébreu.
- source_word: עַד בֹּקֶר
  choice: jusqu’au matin
  rationale: Cette expression marque la limite temporelle et se rend naturellement par « jusqu’au matin ».
- source_word: הַנֹּתָר
  choice: ce qui… restera
  rationale: Le participe nifal de יתר désigne ce qui demeure en reste. « Ce qui en restera » est clair, actuel et conserve la correspondance lexicale avec le premier verbe.
- source_word: בָּאֵשׁ
  choice: au feu
  rationale: Avec « brûler », « au feu » est une formulation française idiomatique qui exprime le moyen de destruction sans ajouter de précision.
- source_word: תִּשְׂרֹפוּ
  choice: vous le brûlerez
  rationale: Dans ce contexte prescriptif, l’inaccompli a une valeur directive. Le futur français conserve le style solennel de l’instruction légale tout en restant compréhensible.
theological_decisions:
- issue: Nature du commandement concernant les restes de la viande pascale
  choice: Une interdiction directe suivie d’une instruction obligatoire de destruction
  alternative: Une simple consigne pratique dépourvue de force prescriptive
  rationale: 'Le verset énonce deux prescriptions rituelles : ne rien laisser jusqu’au matin, puis brûler tout reste éventuel. La traduction maintient ces deux obligations sans leur attribuer une portée symbolique absente du texte.'
translation_notes:
  register: Français international moderne, digne et accessible. Le futur à valeur injonctive convient au registre légal du passage. La répétition de « jusqu’au matin » est conservée parce qu’elle appartient à la structure emphatique de l’hébreu.
