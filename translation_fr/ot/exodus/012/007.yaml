  yaml_path: translation/ot/exodus/012/007.yaml
  text: And they shall take some of the blood and put it on the two doorposts and on the lintel of the houses in which they eat it[a].
translation:
  language: fr
  text: Ils prendront un peu de ce sang et en mettront sur les deux montants et sur le linteau des maisons où ils mangeront l’animal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « où ils le mangeront » ; le pronom renvoie à l’animal destiné au repas.'
    reason: clarification_référentielle
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Ils prendront
  rationale: Dans cette suite d’instructions, la forme verbale coordonnée a une valeur prescriptive et prospective. Le futur français exprime naturellement cette instruction solennelle.
- source_word: מִן הַדָּם
  choice: un peu de ce sang
  rationale: 'La préposition מִן est partitive : il s’agit de prélever une certaine quantité du sang, non sa totalité. « Ce sang » renvoie naturellement au sang de l’animal mentionné dans le contexte.'
- source_word: וְנָתְנוּ
  choice: et en mettront
  rationale: נתן a ici le sens concret de mettre ou déposer. Le pronom « en » reprend le sang et évite une répétition pesante.
- source_word: עַל שְׁתֵּי הַמְּזוּזֹת
  choice: sur les deux montants
  rationale: מְזוּזוֹת désigne les deux pièces verticales de l’encadrement de la porte. « Montants » est précis et naturel en français.
- source_word: וְעַל הַמַּשְׁקוֹף
  choice: et sur le linteau
  rationale: מַשְׁקוֹף désigne la pièce horizontale supérieure de l’ouverture ; « linteau » est le terme architectural exact et courant.
- source_word: עַל הַבָּתִּים
  choice: des maisons
  rationale: Le second עַל rattache contextuellement les montants et le linteau aux maisons concernées. Le français exprime clairement ce rapport par « des maisons ».
- source_word: אֲשֶׁר יֹאכְלוּ אֹתוֹ בָהֶם
  choice: où ils mangeront l’animal
  rationale: La proposition relative précise les maisons dans lesquelles aura lieu le repas. Le futur convient au contexte d’instructions concernant une action à venir. Le pronom hébreu masculin singulier renvoie à l’animal ; l’expliciter évite l’ambiguïté d’un « le » français après la mention du linteau.
