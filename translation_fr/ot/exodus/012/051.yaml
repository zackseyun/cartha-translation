base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/051.yaml
  text: And on that very day[b][a], Yahweh brought the sons of Israel out from the land of Egypt according to their divisions.
translation:
  language: fr
  text: Et ce jour-là même, Yahweh fit sortir du pays d’Égypte les fils d’Israël[a], selon leurs formations.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les enfants d’Israël » ou « les Israélites ». L’hébreu dit littéralement « les fils d’Israël », expression familiale employée collectivement.
    reason: lexical_alternative
  - marker: b
    text: Ou « selon leurs armées » ou « selon leurs corps organisés ». Le terme hébreu peut désigner des troupes ou, plus largement, des formations ordonnées.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Et
  rationale: La construction narrative introduit ici le cadre temporel. En français moderne, « Et » suivi du complément de temps en restitue naturellement la fonction sans recourir à l’archaïsme « il arriva que ».
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ce jour-là même
  rationale: L’expression idiomatique insiste sur l’exactitude du jour. « Ce jour-là même » conserve cette emphase dans un récit rétrospectif.
- source_word: הוֹצִיא
  choice: fit sortir
  rationale: Le hiphil de יצא exprime la causation. « Fit sortir » rend directement cette valeur sans préciser indûment la manière du départ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation garde l’expression familiale et collective de l’hébreu, tout en pouvant désigner l’ensemble du peuple.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: du pays d’Égypte
  rationale: « Pays » rend אֶרֶץ, et la préposition française associée à « sortir » exprime naturellement le mouvement hors d’Égypte.
- source_word: עַל צִבְאֹתָם
  choice: rangés en groupes
  rationale: צְבָאוֹת peut désigner des troupes, des corps organisés ou des groupements. Dans ce contexte, l’expression souligne vraisemblablement l’organisation du peuple sans imposer une lecture strictement militaire.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le Tétragramme comme nom propre. « Yahweh » le représente directement, sans le remplacer par un titre.
- issue: Portée collective de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les enfants d’Israël ; les Israélites
  rationale: « Les fils d’Israël » préserve la forme familiale et généalogique du texte, qui fonctionne ici comme désignation collective de tout le peuple.
- issue: Caractère militaire ou organisationnel de צִבְאֹתָם
  choice: rangés en groupes
  alternative: selon leurs armées ; en corps organisés
  rationale: Le mot peut avoir une connotation militaire, mais le verset met surtout en vue les formations ordonnées du peuple au départ. Le choix principal conserve cette idée sans faire des Israélites une armée combattante de manière explicite.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de l’hébreu tout en évitant les tournures archaïques. Les marqueurs de notes sont placés après les expressions auxquelles ils se rapportent.
