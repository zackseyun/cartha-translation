revisions:
- from: Mais tout esclave acheté par un homme à prix d’argent pourra en manger après que tu l’auras circoncis.[a]
  to: Mais tout esclave d’un homme, acheté à prix d’argent — après que tu l’auras circoncis, alors il pourra en manger.[a]
  rationale: La révision restitue plus précisément la double caractérisation de l’esclave dans l’hébreu (« d’un homme » et « acheté à prix d’argent ») et rend explicitement le conséquent introduit par אָז. Elle conserve l’ambiguïté normale de בּוֹ, résolue en français par « en manger » dans le contexte immédiat du repas pascal.
  reviewer_model: gpt-5.6-terra
