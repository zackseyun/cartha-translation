  text: וְ/כָל עֶ֥בֶד אִ֖ישׁ מִקְנַת כָּ֑סֶף וּ/מַלְתָּ֣ה אֹת֔/וֹ אָ֖ז יֹ֥אכַל בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/044.yaml
  text: But every man's servant[a], bought with silver—when you have circumcised him[b], then he may eat of it.
translation:
  language: fr
  text: Mais tout esclave d’un homme, acheté à prix d’argent — après que tu l’auras circoncis, alors il pourra en manger.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire qu’il ne pourra participer au repas de la Pâque qu’après avoir été circoncis.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כָל
  choice: Mais tout
  rationale: La conjonction relie cette règle à l’exclusion formulée au verset précédent, tandis que « tout » conserve la portée distributive de כָּל.
- source_word: עֶבֶד
  choice: esclave
  rationale: Dans ce contexte juridique, où la personne est explicitement achetée, « esclave » rend sans euphémisme son statut de personne asservie et possédée.
- source_word: אִישׁ מִקְנַת כָּסֶף
  choice: acheté par un homme à prix d’argent
  rationale: Cette formulation naturelle garde le propriétaire masculin singulier exprimé par אִישׁ et rend l’acquisition contre paiement indiquée par מִקְנַת כָּסֶף.
- source_word: וּ/מַלְתָּה אֹתוֹ אָז
  choice: après que tu l’auras circoncis
  rationale: La séquence verbale suivie de אָז présente la circoncision comme la condition préalable à la participation; le futur antérieur convient à l’adresse directe au singulier.
- source_word: יֹאכַל בּוֹ
  choice: pourra en manger
  rationale: L’imparfait exprime ici l’autorisation de prendre part au repas; « en manger » restitue naturellement le complément prépositionnel בּוֹ.
theological_decisions:
- issue: Terminologie de l’esclavage dans un texte juridique d’alliance
  choice: esclave
  alternative: serviteur
  rationale: L’achat à prix d’argent rend central le statut servile. « Serviteur » risquerait d’atténuer la réalité sociale décrite par le texte.
- issue: Valeur de la circoncision dans la séquence juridique
  choice: condition préalable à l’autorisation de manger
  alternative: simple action antérieure sans portée explicitement conditionnelle
  rationale: La construction וּמַלְתָּה ... אָז articule l’action préalable et sa conséquence, sans ajouter d’explication doctrinale au-delà de la participation au repas visé.
- issue: Référence masculine de אִישׁ
  choice: un homme
  alternative: une personne
  rationale: Le français conserve ici le masculin singulier du sujet juridique hébreu sans introduire le terme plus interprétatif de « maître de maison ».
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe juridique reste concise; « à prix d’argent » conserve l’image hébraïque tout en étant idiomatique. Le marqueur [a] figure dans le texte.
