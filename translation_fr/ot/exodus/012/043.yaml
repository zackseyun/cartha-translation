id: EXO.12.43
reference: Exodus 12:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן זֹ֖את חֻקַּ֣ת הַ/פָּ֑סַח כָּל בֶּן נֵכָ֖ר לֹא יֹ֥אכַל בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/043.yaml
  text: 'And Yahweh said to Moses and Aaron[a], “This is the statute of the Passover: no foreigner may eat of it.”'
translation:
  language: fr
  text: 'Yahweh dit à Moïse et à Aaron : « Voici la prescription concernant la Pâque : aucun étranger[a] ne doit en manger. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fils d’étrangeté ». L’expression désigne un étranger, c’est-à-dire quelqu’un qui n’appartient pas à la communauté de l’alliance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Dans ce récit, la forme narrative du verbe אמר se rend naturellement par « dit ».
- source_word: זֹאת חֻקַּת הַפָּסַח
  choice: Voici la prescription concernant la Pâque
  rationale: « Voici » introduit naturellement la règle; « prescription » conserve la portée juridique de חֻקָּה, tandis que « concernant » exprime avec clarté la relation construite avec la Pâque.
- source_word: הַפָּסַח
  choice: la Pâque
  rationale: Le terme peut désigner la célébration ou le sacrifice pascal; « la Pâque » conserve cette latitude dans le contexte du repas.
- source_word: כָּל בֶּן נֵכָר
  choice: aucun étranger
  rationale: Avec la négation verbale, la tournure hébraïque se rend idiomatiquement en français par « aucun étranger ». L’expression littérale « fils d’étrangeté » désigne une personne étrangère.
- source_word: לֹא יֹאכַל בּוֹ
  choice: ne doit en manger
  rationale: La formulation exprime clairement l’interdiction juridique; le pronom « en » rend naturellement la préposition ב avec le verbe « manger ».
theological_decisions:
- issue: Identité des personnes exclues du repas pascal
  choice: « étranger », sans précision supplémentaire dans le corps du texte
  alternative: « étranger extérieur à la communauté de l’alliance » ou « étranger incirconcis »
  rationale: Le syntagme hébreu de ce verset signifie simplement « étranger ». Le contexte suivant précise les conditions d’admission, mais celles-ci ne doivent pas être ajoutées ici au texte du verset.
translation_notes:
  register: Français international moderne, clair et digne. Le tour « prescription concernant la Pâque » maintient le registre juridique sans archaïsme; « ne doit en manger » formule naturellement l’interdiction.
