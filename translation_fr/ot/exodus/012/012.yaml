    issue: « tout premier-né » est peu idiomatique en français contemporain.
    rationale: Bien que grammaticalement possible, le singulier distributif est plus naturellement rendu ici par le collectif pluriel « tous les premiers-nés », sans ajout de sens ni de marque de genre absente du texte.
  - severity: low
    issue: « J’exécuterai des jugements » est moins naturel que l’expression française usuelle.
    rationale: Dans le registre biblique et judiciaire, « exercer des jugements » rend de manière plus idiomatique l’hébreu « faire des jugements », tout en préservant sa force judiciaire.
  - severity: low
