revisions:
- from: Car je traverserai[a] le pays d’Égypte cette nuit et je frapperai tout premier-né dans le pays d’Égypte, depuis l’être humain jusqu’au bétail[b]. J’exécuterai des jugements contre tous les dieux de l’Égypte. Je suis Yahvé[c].
  to: Car je traverserai[a] le pays d’Égypte cette nuit-là et je frapperai tous les premiers-nés dans le pays d’Égypte, depuis l’être humain jusqu’au bétail[b]. J’exercerai des jugements contre tous les dieux de l’Égypte. Je suis Yahvé[c].
  rationale: La révision améliore l’idiomaticité française sans modifier le sens. Le pluriel collectif « tous les premiers-nés » exprime naturellement la portée de כָּל בְּכוֹר. « Cette nuit-là » rend explicitement le démonstratif temporel sans suggérer une nuit indéterminée. « J’exercerai des jugements » préserve le vocabulaire judiciaire de l’hébreu dans une tournure française établie. Les notes restent correctement ancrées et ont été harmonisées avec le texte.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:13:35Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens du texte hébreu est globalement fidèlement rendu : le passage à travers le pays, la frappe des premiers-nés, l’extension des humains aux bêtes, les jugements contre les dieux d’Égypte et l’auto-identification divine sont tous conservés. La révision proposée maintient ces éléments et la portée hostile de la préposition נגד/ב dans le contexte de l’expression.'
  naturalness: « Tous les premiers-nés » est plus naturel en français moderne que « tout premier-né » pour exprimer le collectif distributif hébreu. « J’exercerai des jugements » est l’expression française biblique et judiciaire plus idiomatique pour עשׂה שפטים que « j’exécuterai des jugements ».
  terminology: « Yahvé » est une translittération française établie de YHWH. « Les dieux de l’Égypte » traduit directement אֱלֹהֵי מִצְרַיִם sans interprétation confessionnelle. « Bétail » convient à בְּהֵמָה dans ce contraste avec les humains.
  issues:
