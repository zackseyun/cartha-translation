  text: וְ/עָבַרְתִּ֣י בְ/אֶֽרֶץ מִצְרַיִם֮ בַּ/לַּ֣יְלָה הַ/זֶּה֒ וְ/הִכֵּיתִ֤י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה וּ/בְ/כָל אֱלֹהֵ֥י מִצְרַ֛יִם אֶֽעֱשֶׂ֥ה שְׁפָטִ֖ים אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/012.yaml
  text: For I will pass through the land of Egypt on this night[a], and I will strike every firstborn in the land of Egypt, from man to beast; and against all the gods of Egypt I will execute judgments[c][b]. I am Yahweh.
translation:
  language: fr
  text: Car je traverserai[a] le pays d’Égypte cette nuit-là et je frapperai tous les premiers-nés dans le pays d’Égypte, depuis l’être humain jusqu’au bétail[b]. J’exercerai des jugements contre tous les dieux de l’Égypte. Je suis Yahvé[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je parcourrai ». Le verbe signifie ici traverser le pays, non « passer par-dessus » au sens d’épargner.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « depuis l’être humain jusqu’au bétail ». Le terme hébreu désigne ici les animaux, notamment le bétail.'
    reason: lexical_alternative
  - marker: c
    text: 'Hébreu : YHWH, nom divin traditionnellement rendu par « le Seigneur » ; autre translittération : « Yahweh ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַרְתִּי
  choice: je traverserai
  rationale: Avec בְאֶרֶץ, le verbe décrit le déplacement à travers le pays. « Traverser » évite de confondre cette action avec le fait d’épargner les maisons israélites, exprimé ailleurs dans le chapitre.
- source_word: בְאֶרֶץ מִצְרַיִם
  choice: le pays d’Égypte
  rationale: La traduction conserve la mention explicite du territoire et l’étendue géographique de l’action.
- source_word: בַּלַּיְלָה הַזֶּה
  choice: cette nuit
  rationale: Formulation française naturelle qui maintient la valeur démonstrative de l’hébreu.
- source_word: וְהִכֵּיתִי
  choice: je frapperai
  rationale: « Frapper » rend directement נכה sans expliciter davantage que le texte la mort qui ressort du contexte.
- source_word: כָּל בְּכוֹר
  choice: tout premier-né
  rationale: Le singulier distributif hébreu est conservé. Le texte ne précise pas ici « mâle », qui n’est donc pas ajouté.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: depuis l’être humain jusqu’au bétail
  rationale: Cette formulation préserve l’expression polaire qui étend le fléau des humains aux animaux domestiques, dans un français moderne et non ambigu.
- source_word: וּבְכָל אֱלֹהֵי מִצְרַיִם
  choice: contre tous les dieux de l’Égypte
  rationale: La préposition indique ici la cible de l’action hostile. « Dieux » conserve le sens explicite du texte sans le réduire à « idoles » ou à une métaphore politique.
- source_word: אֶעֱשֶׂה שְׁפָטִים
  choice: j’exécuterai des jugements
  rationale: Cette traduction maintient la force judiciaire de l’expression hébraïque sans la paraphraser simplement par « punir ».
- source_word: אֲנִי יְהוָה
  choice: Je suis Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin YHWH et permet de distinguer le nom propre d’un titre comme « le Seigneur ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR ; Yahweh
  rationale: Le texte porte directement le tétragramme. La forme « Yahvé », courante en français, le présente comme le nom d’alliance plutôt que de le remplacer silencieusement par un titre.
- issue: Statut des אֱלֹהֵי מִצְרַיִם
  choice: les dieux de l’Égypte
  alternative: les idoles de l’Égypte ; les puissances de l’Égypte
  rationale: L’hébreu dit explicitement « dieux ». La traduction conserve cette affirmation et la tension théologique du passage sans décider si ces dieux sont conçus comme des êtres réels, des idoles ou des puissances représentées par celles-ci.
translation_notes:
  register: Français international moderne, clair et digne. La structure a été légèrement répartie en trois phrases pour éviter une période trop lourde, tout en conservant l’enchaînement des actions, le langage judiciaire et la conclusion solennelle par le nom divin.
