  text: שִׁבְעַ֤ת יָמִים֙ מַצּ֣וֹת תֹּאכֵ֔לוּ אַ֚ךְ בַּ/יּ֣וֹם הָ/רִאשׁ֔וֹן תַּשְׁבִּ֥יתוּ שְּׂאֹ֖ר מִ/בָּתֵּי/כֶ֑ם כִּ֣י כָּל אֹכֵ֣ל חָמֵ֗ץ וְ/נִכְרְתָ֞ה הַ/נֶּ֤פֶשׁ הַ/הִוא֙ מִ/יִּשְׂרָאֵ֔ל מִ/יּ֥וֹם הָ/רִאשֹׁ֖ן עַד י֥וֹם הַ/שְּׁבִעִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/015.yaml
  text: For seven days you shall eat unleavened bread[a]. But on the first day you shall remove leaven from your houses, for whoever eats anything leavened, that person shall be cut off from Israel[b], from the first day to the seventh day.
translation:
  language: fr
  text: Pendant sept jours, vous mangerez des pains sans levain. Toutefois, le premier jour, vous ferez disparaître le levain de vos maisons[a]. En effet, toute personne qui mangera quelque chose de levé sera retranchée d’Israël[b], du premier au septième jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu signifie littéralement « vous ferez cesser le levain » ; on peut aussi comprendre « vous enlèverez » ou « vous éliminerez le levain de vos maisons ».
    reason: lexical_alternative
  - marker: b
    text: « Sera retranchée » est une expression juridique hébraïque. Elle peut évoquer l’exclusion de la communauté, la mort ou un jugement divin ; le verset ne précise pas de quelle manière la sanction s’accomplit.
    reason: alternative_reading
lexical_decisions:
- source_word: מַצּוֹת
  choice: pains sans levain
  rationale: Le nom désigne des pains préparés sans levain. Cette formulation est claire, naturelle et adaptée au contexte rituel.
- source_word: אַךְ
  choice: Toutefois
  rationale: La particule introduit ici une précision restrictive et marquée concernant le premier jour.
- source_word: תַּשְׁבִּיתוּ
  choice: vous ferez disparaître
  rationale: Le hifil de שׁבת signifie littéralement « faire cesser ». Dans ce contexte, il commande de faire disparaître le levain des maisons, sans imposer une méthode précise.
- source_word: שְּׂאֹר
  choice: le levain
  rationale: Le terme désigne l’agent de fermentation. « Levain » conserve le vocabulaire rituel biblique tout en restant courant en français.
- source_word: חָמֵץ
  choice: quelque chose de levé
  rationale: Le mot vise de façon générale ce qui a levé, et pas uniquement le pain.
- source_word: וְנִכְרְתָה
  choice: sera retranchée
  rationale: Cette expression juridique et liée à l’alliance garde sa force tout en laissant ouverte la nature exacte de la sanction.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: toute personne qui
  rationale: Dans cette formule juridique, נֶפֶשׁ désigne l’individu. La tournure française exprime naturellement le sujet indéfini introduit par כָּל אֹכֵל.
- source_word: מִיִּשְׂרָאֵל
  choice: d’Israël
  rationale: La formulation concise reproduit l’idée d’un retranchement hors d’Israël sans expliciter davantage que l’hébreu.
- source_word: מִיּוֹם הָרִאשֹׁן עַד יוֹם הַשְּׁבִעִי
  choice: du premier au septième jour
  rationale: Cette expression naturelle conserve la portée temporelle inclusive et, par sa position, son lien probable avec l’interdiction assortie de la sanction.
theological_decisions:
- issue: Sens de la sanction exprimée par וְנִכְרְתָה
  choice: Conserver l’expression juridique « sera retranchée » sans préciser le mode de la sanction.
  alternative: « sera exclue de la communauté », « sera mise à mort » ou « subira le jugement divin »
  rationale: Le verset ne précise pas si le retranchement correspond à l’exclusion, à la mort ou à une intervention judiciaire divine. La traduction préserve donc l’ambiguïté et la tension théologique du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Pains sans levain » et « levain » maintiennent le vocabulaire biblique usuel. La syntaxe distingue clairement le commandement général, la prescription du premier jour et sa justification.
