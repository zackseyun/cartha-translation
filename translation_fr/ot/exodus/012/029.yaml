  text: וַ/יְהִ֣י בַּ/חֲצִ֣י הַ/לַּ֗יְלָה וַֽ/יהוָה֮ הִכָּ֣ה כָל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכֹ֤ר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שְּׁבִ֔י אֲשֶׁ֖ר בְּ/בֵ֣ית הַ/בּ֑וֹר וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/029.yaml
  text: And at midnight Yahweh struck down every firstborn in the land of Egypt[a], from the firstborn of Pharaoh, who sat on his throne, to the firstborn of the captive who was in the prison pit, and every firstborn of the livestock.
translation:
  language: fr
  text: À minuit, Yahweh frappa tous les premiers-nés du pays d’Égypte, depuis le premier-né du pharaon qui siégeait sur son trône jusqu’au premier-né du captif qui se trouvait dans le cachot[a], ainsi que tous les premiers-nés du bétail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du prisonnier qui se trouvait dans la fosse servant de prison ».
    reason: Le mot שְׁבִי peut désigner un captif ou un prisonnier, et בֵּית הַבּוֹר évoque littéralement une « maison de la fosse », c’est-à-dire un cachot ou une fosse utilisée comme prison.
lexical_decisions:
- source_word: וַיְהִי בַּחֲצִי הַלַּיְלָה
  choice: À minuit
  rationale: La tournure narrative introduit l’événement suivant, tandis que l’expression temporelle signifie littéralement « au milieu de la nuit ». En français actuel, « À minuit » rend naturellement l’ensemble sans formule archaïque telle que « il arriva que ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte directement le tétragramme, nom propre du Dieu d’Israël. Sa translittération évite de le remplacer par un titre.
- source_word: הִכָּה
  choice: frappa à mort
  rationale: Le verbe signifie « frapper » et, dans ce contexte, le coup entraîne la mort. « Frappa à mort » conserve l’image verbale tout en exprimant clairement son résultat.
- source_word: כָל בְּכוֹר
  choice: tous les premiers-nés
  rationale: בְּכוֹר désigne le premier-né, et כָל donne ici à l’expression une portée globale. Le pluriel français est naturel et couvre l’ensemble des personnes visées.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: du pays d’Égypte
  rationale: Cette formulation conserve l’expression géographique explicite du texte hébreu.
- source_word: מִבְּכֹר פַּרְעֹה ... עַד בְּכוֹר הַשְּׁבִי
  choice: depuis le premier-né du pharaon ... jusqu’au premier-né du captif
  rationale: La construction מִן…עַד délimite toute l’étendue sociale des victimes, du rang le plus élevé au plus bas.
- source_word: הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: qui siégeait sur son trône
  rationale: Le participe décrit le pharaon dans sa position royale. « Siégeait » convient au contexte du trône et au cadre narratif passé.
- source_word: אֲשֶׁר בְּבֵית הַבּוֹר
  choice: qui se trouvait dans le cachot
  rationale: L’expression désigne littéralement la « maison de la fosse », c’est-à-dire un lieu souterrain servant de prison. « Cachot » restitue cette idée sans lourdeur.
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: ainsi que tous les premiers-nés du bétail
  rationale: בְּהֵמָה désigne ici collectivement les animaux domestiques. « Bétail » est plus précis que le terme général « animaux » et ne se limite pas aux bovins.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le verset emploie le nom divin lui-même et non le titre אֲדֹנָי. La translittération préserve cette distinction textuelle.
- issue: Portée létale du verbe הִכָּה
  choice: frappa à mort
  alternative: frappa
  rationale: Le récit concerne la mort des premiers-nés. La formulation retenue explicite l’issue imposée par le contexte tout en conservant l’image du verbe hébreu, plutôt que de la remplacer simplement par « tua ».
translation_notes:
  register: Français international moderne, digne et narratif. La phrase conserve la progression « depuis… jusqu’à… » et l’ampleur solennelle du jugement, tout en évitant les archaïsmes. Le marqueur de note est placé sur l’expression qu’il éclaire.
