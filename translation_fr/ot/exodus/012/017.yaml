base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/017.yaml
  text: And you shall keep the Feast of Unleavened Bread[a], because on this very day I brought your hosts out from the land of Egypt[c][b]. And you shall keep this day throughout your generations as a permanent statute.
translation:
  language: fr
  text: Vous observerez la fête des Pains sans levain[a], car c’est en ce jour même que j’ai fait sortir vos troupes[b] du pays d’Égypte. Vous observerez ce jour de génération en génération, comme une prescription perpétuelle[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « les pains (ou aliments) sans levain »; l’expression peut désigner ces pains eux-mêmes ou, par extension, la fête qui leur est associée.
    reason: lexical_alternative
  - marker: b
    text: Ou « vos armées », « vos divisions » ou « vos groupes ». Le terme hébreu présente Israël comme un ensemble organisé sortant d’Égypte.
    reason: lexical_alternative
  - marker: c
    text: Ou « comme une prescription pour toujours » ou « comme une prescription durable ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: vous observerez
  rationale: Dans ce contexte rituel, שׁמר signifie respecter ou observer une prescription. « Observerez » convient aux deux compléments du verset et conserve la répétition hébraïque.
- source_word: הַמַּצּוֹת
  choice: les pains sans levain
  rationale: Le pluriel hébreu désigne littéralement les pains ou aliments sans levain et peut, par métonymie, évoquer la fête qui leur est associée. La traduction principale n’ajoute pas explicitement « fête ».
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: en ce jour même
  rationale: Cette tournure française rend naturellement l’insistance de עֶצֶם sur le jour précis de la sortie.
- source_word: הוֹצֵאתִי
  choice: j’ai fait sortir
  rationale: 'Le hifil de יצא exprime la causation : faire sortir. Cette formulation garde explicitement cette valeur.'
- source_word: צִבְאוֹתֵיכֶם
  choice: vos troupes
  rationale: צָבָא peut désigner une armée, une troupe ou un ensemble organisé. « Troupes » conserve ici l’image d’un peuple sortant en groupes organisés sans imposer exclusivement un sens militaire.
- source_word: לְדֹרֹתֵיכֶם
  choice: de génération en génération
  rationale: Expression française naturelle indiquant la continuité de l’observance au fil des générations.
- source_word: חֻקַּת עוֹלָם
  choice: comme une prescription perpétuelle
  rationale: חֻקָּה désigne une règle prescrite, tandis que עוֹלָם lui attribue une durée indéfiniment prolongée. « Prescription perpétuelle » garde le registre juridique et cultuel.
theological_decisions:
- issue: Les pains sans levain eux-mêmes ou la fête qui leur est associée
  choice: les pains sans levain
  alternative: la fête des Pains sans levain
  rationale: L’hébreu ne contient pas le mot « fête ». Il peut toutefois employer le nom des pains par métonymie pour l’observance. Le texte principal conserve cette latitude et la note explicite l’autre compréhension.
- issue: Portée temporelle de חֻקַּת עוֹלָם
  choice: une prescription perpétuelle
  alternative: une prescription pour toujours
  rationale: La formulation transmet l’obligation durable sans définir davantage, sur le plan doctrinal, les limites éventuelles de l’idiome עוֹלָם.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « vous observerez » reproduit la structure du texte hébreu. « Les pains sans levain » garde dans le texte principal l’ambiguïté entre l’aliment et l’observance festive; la note fournit la formulation explicite avec « fête ».
