  text: וַֽ/יהוָ֞ה נָתַ֨ן אֶת חֵ֥ן הָ/עָ֛ם בְּ/עֵינֵ֥י מִצְרַ֖יִם וַ/יַּשְׁאִל֑וּ/ם וַֽ/יְנַצְּל֖וּ אֶת מִצְרָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/036.yaml
  text: And Yahweh gave the people favor in the eyes of the Egyptians[a], so that they let them have what they asked; and they plundered Egypt.
translation:
  language: fr
  text: 'Et Yahvé accorda au peuple la faveur des Égyptiens : ceux-ci leur donnèrent ce qu’ils avaient demandé[a]. Ainsi, le peuple dépouilla l’Égypte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une traduction plus traditionnelle : « de sorte qu’ils leur prêtèrent ce qu’ils demandaient ». Le verbe hébreu peut être compris ici soit au sens de prêter, soit au sens d’accorder ce qui était demandé.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַֽיהוָה
  choice: Yahvé
  rationale: Transcription française traditionnelle et intelligible du nom divin, conformément à la couche de consultation fournie, tout en distinguant le nom propre d’un titre.
- source_word: נָתַן אֶת חֵן הָעָם בְּעֵינֵי מִצְרַיִם
  choice: accorda au peuple la faveur des Égyptiens
  rationale: Rend naturellement l’idiome hébreu « donner la faveur du peuple aux yeux de l’Égypte », c’est-à-dire susciter chez les Égyptiens une disposition favorable envers le peuple.
- source_word: וַיַּשְׁאִלוּם
  choice: ceux-ci leur donnèrent ce qu’ils avaient demandé
  rationale: Dans ce contexte, le hiphil de שאל décrit la réponse favorable des Égyptiens aux demandes des Israélites. Cette formulation reste ouverte quant au statut juridique des biens et évite de suggérer nécessairement un prêt commercial remboursable.
- source_word: וַיְנַצְּלוּ
  choice: ils dépouillèrent
  rationale: Le piel de נצל exprime ici l’action de dépouiller ou de priver de ses biens. « Dépouillèrent » conserve la force du terme dans un registre biblique moderne.
- source_word: אֶת מִצְרָיִם
  choice: l’Égypte
  rationale: L’objet hébreu est l’Égypte envisagée collectivement; la traduction garde cette formulation plutôt que de la réduire aux seuls individus égyptiens.
theological_decisions:
- issue: Faut-il comprendre וַיַּשְׁאִלוּם comme un prêt ou comme l’octroi des biens demandés ?
  choice: ceux-ci leur donnèrent ce qu’ils avaient demandé
  alternative: ceux-ci leur prêtèrent ce qu’ils demandaient
  rationale: Le contexte narratif met l’accent sur l’accueil favorable des demandes et sur le dépouillement de l’Égypte. La traduction principale ne présuppose donc pas une obligation normale de restitution, tandis que la possibilité lexicale traditionnelle du prêt est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La première proposition conserve la causalité divine; « ceux-ci » clarifie que les Égyptiens sont le sujet du verbe suivant. La ponctuation met en relief le lien entre leur faveur, l’octroi des biens et le dépouillement final.
