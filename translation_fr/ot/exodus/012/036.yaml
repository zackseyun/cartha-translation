  source_fidelity: 'Le sens principal est bien rendu : YHWH procure au peuple la faveur des Égyptiens, ceux-ci répondent favorablement aux demandes, puis le peuple dépouille l’Égypte. La note conserve à juste titre l’alternative traditionnelle de « prêter ».'
  naturalness: Le français est globalement naturel et de registre biblique moderne. Toutefois, après « ceux-ci », le pronom « ils » dans « Ainsi, ils dépouillèrent l’Égypte » peut se rattacher grammaticalement aux Égyptiens plutôt qu’au peuple. L’explicitation du sujet final élimine cette ambiguïté. L’appel de note doit aussi porter sur la proposition dont le verbe est discuté, non sur « Égyptiens ».
  terminology: « Yahvé », « faveur », « dépouilla l’Égypte » et « l’Égypte » comme collectif sont appropriés. La formulation principale évite à bon droit d’imposer l’idée d’un prêt ordinaire, tandis que la note signale l’autre compréhension possible.
