id: EXO.12.2
reference: Exodus 12:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ/חֹ֧דֶשׁ הַ/זֶּ֛ה לָ/כֶ֖ם רֹ֣אשׁ חֳדָשִׁ֑ים רִאשׁ֥וֹן הוּא֙ לָ/כֶ֔ם לְ/חָדְשֵׁ֖י הַ/שָּׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/002.yaml
  text: This month shall be for you the beginning of months[a]; it shall be the first month of the year for you.
translation:
  language: fr
  text: Ce mois sera pour vous le commencement des mois[a] ; il sera pour vous le premier des mois de l’année.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette nouvelle lune », car le mot hébreu peut être associé au cycle de la nouvelle lune ; ici, il désigne le mois du calendrier.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹדֶשׁ הַזֶּה
  choice: Ce mois
  rationale: Dans ce contexte d’établissement du calendrier, חֹדֶשׁ désigne naturellement le mois, même si le terme est associé au cycle de la nouvelle lune.
- source_word: לָכֶם
  choice: pour vous
  rationale: La préposition marque ici la relation à Israël, destinataire de cette ordonnance ; « pour vous » est naturel en français et conserve cette portée.
- source_word: רֹאשׁ חֳדָשִׁים
  choice: le commencement des mois
  rationale: רֹאשׁ signifie littéralement « tête », mais exprime ici le commencement ou la première place dans l’ordre temporel. Cette formulation conserve l’image structurelle de l’hébreu sans calque obscur.
- source_word: רִאשׁוֹן
  choice: le premier des mois
  rationale: L’adjectif indique explicitement le premier rang. La formulation française explicite le nom sous-entendu par le contexte et s’accorde avec « des mois de l’année ».
- source_word: הוּא
  choice: il sera
  rationale: Le pronom reprend « ce mois ». Dans ce contexte prescriptif, le futur français exprime naturellement l’institution du calendrier.
- source_word: לְחָדְשֵׁי הַשָּׁנָה
  choice: des mois de l’année
  rationale: La phrase précise le domaine dans lequel ce mois occupe le premier rang. Cette traduction reste proche de la structure hébraïque tout en étant claire en français.
theological_decisions:
- issue: Valeur de la proposition nominale hébraïque dans un contexte législatif
  choice: 'Traduction au futur : « sera »'
  alternative: 'Présent descriptif : « est »'
  rationale: L’hébreu n’a pas de verbe exprimé, mais le contexte présente une instruction divine qui établit le calendrier d’Israël. Le futur rend cette valeur institutionnelle sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le parallélisme et la répétition de « pour vous » présents dans l’hébreu.
