  yaml_path: translation/ot/exodus/012/018.yaml
  text: In the first month[a], on the fourteenth day of the month at evening, you shall eat unleavened bread, until the twenty-first day of the month at evening.
translation:
  language: fr
  text: Le quatorzième jour du premier mois, au soir, vous mangerez des pains sans levain jusqu’au vingt-et-unième jour du mois, au soir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרִאשֹׁן
  choice: Le premier mois
  rationale: Dans cette formule de datation, « mois » est sous-entendu puis explicité par לַחֹדֶשׁ. Le français l’ajoute naturellement pour rendre le sens sans ambiguïté.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: le quatorzième jour
  rationale: L’hébreu emploie ici des nombres cardinaux avec une valeur ordinale dans une date; la formulation française idiomatique est « le quatorzième jour ».
- source_word: לַחֹדֶשׁ
  choice: du mois
  rationale: חֹדֶשׁ peut désigner le mois ou la nouvelle lune, mais la formule calendaire appelle ici « mois ».
- source_word: בָּעֶרֶב / בָּעָרֶב
  choice: au soir
  rationale: Cette expression marque les limites temporelles de la période. « Au soir » reste sobre, naturel et moins précis que « au crépuscule », qui pourrait surinterpréter le moment exact.
- source_word: תֹּאכְלוּ
  choice: vous mangerez
  rationale: Dans ce contexte prescriptif, l’inaccompli hébreu a une valeur directive. Le futur français exprime naturellement cette prescription solennelle.
- source_word: מַצֹּת
  choice: des pains sans levain
  rationale: Le pluriel hébreu désigne des produits de boulangerie non levés. « Des pains sans levain » est transparent et conserve le nombre grammatical.
- source_word: עַד
  choice: jusqu’au
  rationale: La préposition indique la borne finale de la période prescrite.
- source_word: יוֹם הָאֶחָד וְעֶשְׂרִים
  choice: le vingt et unième jour
  rationale: Il s’agit de la manière hébraïque courante d’exprimer le vingt et unième jour; l’ordinal français en restitue naturellement la valeur.
