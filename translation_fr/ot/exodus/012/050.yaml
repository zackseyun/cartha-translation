  text: וַ/יַּֽעֲשׂ֖וּ כָּל בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֥ה וְ/אֶֽת אַהֲרֹ֖ן כֵּ֥ן עָשֽׂוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/050.yaml
  text: And all the sons of Israel did as Yahweh had commanded Moses and Aaron[b][a]; so they did.
translation:
  language: fr
  text: Tous les fils d’Israël firent comme Yahweh[a] l’avait ordonné à Moïse et à Aaron ; ils firent ainsi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hébreu YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: firent
  rationale: Le verbe עשה signifie couramment « faire ». Ici, il exprime l’exécution d’un commandement et sa répétition en fin de verset est conservée.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: tous les fils d’Israël
  rationale: Cette formulation garde l’expression familiale littérale de l’hébreu ainsi que l’idée de totalité portée par כָּל.
- source_word: כַּאֲשֶׁר
  choice: ce que
  rationale: Dans cette construction avec עשה et צוה, le français naturel « firent ce que… avait ordonné » exprime la conformité au commandement.
- source_word: צִוָּה
  choice: avait ordonné
  rationale: Le plus-que-parfait rend naturellement l’antériorité du commandement par rapport à son exécution, sans attribuer cette valeur temporelle à la seule forme hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin YHWH est translittéré afin de préserver le nom personnel présent dans le texte source plutôt que de lui substituer un titre.
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: à Moïse et à Aaron
  rationale: En français, le verbe « ordonner » désignant un ordre adressé à des personnes se construit naturellement avec « à » ; les deux marqueurs d’objet hébreux désignent ici Moïse et Aaron comme destinataires du commandement.
- source_word: כֵּן עָשׂוּ
  choice: c’est exactement ce qu’ils firent
  rationale: Cette formulation idiomatique conserve la reprise emphatique de עשה et souligne la correspondance entre l’ordre et son exécution.
theological_decisions:
- issue: Rendu du nom d’alliance יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Yahvé
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom divin, tandis que « le SEIGNEUR » relève d’une substitution traditionnelle par un titre.
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites ; les enfants d’Israël
  rationale: Le choix principal préserve la forme familiale et masculine de l’expression hébraïque sans la réduire à un simple ethnonyme.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition finale, marquée en hébreu, est maintenue sous une forme française naturelle et emphatique. Le point-virgule restitue la reprise conclusive du texte.
