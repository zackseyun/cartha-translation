  text: You shall not eat anything leavened[b][a]; in all your dwellings you shall eat unleavened bread.
translation:
  language: fr
  text: Vous ne mangerez rien de levé[a] ; dans tous vos lieux de résidence[b], vous mangerez des pains sans levain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aucune chose levée ». Le terme hébreu a un sens plus large que « pain levé » et englobe tout aliment qui a fermenté ou levé.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans toutes vos localités ». L’expression vise tous les lieux où vous résidez.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַחְמֶצֶת
  choice: rien de levé
  rationale: 'Dans cette interdiction, כָּל avec מַחְמֶצֶת a une portée exhaustive : aucune chose ayant fermenté ou levé ne doit être mangée. « Rien de levé » reste naturel en français et ne limite pas l’interdit au seul pain.'
- source_word: לֹא תֹאכֵלוּ
  choice: vous ne mangerez
  rationale: L’imparfait hébreu précédé de לֹא exprime ici une interdiction. Le futur français conserve le ton prescriptif et solennel du contexte légal.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: partout où vous habiterez
  rationale: La formule désigne l’ensemble des lieux de résidence ou d’établissement du peuple. Cette tournure moderne exprime clairement l’extension géographique sans la restreindre aux maisons particulières.
- source_word: תֹּאכְלוּ
  choice: vous mangerez
  rationale: L’imparfait a ici valeur d’injonction positive et répond parallèlement à l’interdiction précédente.
- source_word: מַצּוֹת
  choice: des pains sans levain
  rationale: Le pluriel hébreu désigne des pains préparés sans levain. Le pluriel français rend la forme du texte source et demeure immédiatement compréhensible.
