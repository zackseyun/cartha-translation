source:
  edition: WLC
  text: וְ/עַתָּ֗ה שָׂ֣א נָ֤א חַטָּאתִ/י֙ אַ֣ךְ הַ/פַּ֔עַם וְ/הַעְתִּ֖ירוּ לַ/יהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/יָסֵר֙ מֵֽ/עָלַ֔/י רַ֖ק אֶת הַ/מָּ֥וֶת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/017.yaml
  text: So now[a], please forgive my sin just this once, and plead with Yahweh your God[b], that he may remove from me this death only.
translation:
  language: fr
  text: Et maintenant, je vous en prie, pardonnez mon péché, cette fois seulement, et suppliez Yahweh, votre Dieu, afin qu’il éloigne de moi cette mort, rien que cela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cette mort seulement ». Le pharaon désigne vraisemblablement la plaie mortelle qui sévit alors et ses effets.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Reproduit simplement le lien discursif et l’indication temporelle de l’hébreu, tout en introduisant naturellement l’appel pressant du pharaon.
- source_word: שָׂא נָא חַטָּאתִי
  choice: je vous en prie, pardonnez mon péché
  rationale: נשא, avec « péché » pour complément, forme un idiome signifiant pardonner ou enlever la faute. « Je vous en prie » rend la particule de supplication נָא. Le pluriel correspond à l’adresse faite à Moïse et Aaron dans le contexte.
- source_word: אַךְ הַפַּעַם
  choice: cette fois seulement
  rationale: 'Conserve la restriction insistante exprimée par אַךְ : le pharaon demande le pardon pour cette seule occasion.'
- source_word: וְהַעְתִּירוּ
  choice: et suppliez
  rationale: Le hiphil de עתר désigne ici une prière insistante adressée à Dieu. « Suppliez » exprime cette intensité sans introduire un vocabulaire confessionnel particulier.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: Yahweh, votre Dieu
  rationale: 'Transcrit le nom divin יהוה et maintient la formulation distanciée du pharaon : « votre Dieu ».'
- source_word: וְיָסֵר מֵעָלַי
  choice: afin qu’il éloigne de moi
  rationale: Rend la relation de but avec la supplication précédente et traduit idiomatiquement le sens d’écarter ce qui pèse sur le locuteur.
- source_word: רַק אֶת־הַמָּוֶת הַזֶּה
  choice: cette mort, rien que cela
  rationale: Préserve l’expression littérale et frappante « cette mort », ainsi que la valeur restrictive de רַק, sans identifier explicitement la mort à la plaie.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom personnel et s’accorde avec la couche anglaise révisée fournie.
- issue: Référent de « cette mort »
  choice: Conserver « cette mort »
  alternative: cette plaie mortelle
  rationale: Le contexte évoque la plaie de sauterelles et ses effets dévastateurs, mais l’hébreu dit seulement « cette mort ». La traduction évite de résoudre cette formulation par une explicitation interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. Le vouvoiement et les formes verbales au pluriel reflètent l’adresse contextuelle à Moïse et Aaron. La ponctuation met en relief la restriction finale sans effacer l’étrangeté volontaire de « cette mort ».
