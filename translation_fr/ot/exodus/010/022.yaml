  text: So Moses stretched out his hand toward the sky[b][a], and there was thick darkness over all the land of Egypt for three days.
translation:
  language: fr
  text: Moïse étendit la main vers le ciel[a], et il y eut d’épaisses ténèbres[b] dans tout le pays d’Égypte pendant trois jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner le ciel visible ou les cieux.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une profonde obscurité ». L’expression hébraïque associe deux termes désignant l’obscurité afin d’en souligner l’intensité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: étendit
  rationale: Dans le contexte d’un geste de la main, le verbe נטה signifie couramment « étendre ». Ce choix est naturel en français et conserve l’action physique du texte.
- source_word: יָדוֹ
  choice: la main
  rationale: יָד désigne normalement la « main » ; le possessif est exprimé naturellement en français par l’article défini après la mention de Moïse.
- source_word: עַל הַשָּׁמַיִם
  choice: vers le ciel
  rationale: Avec le geste d’étendre la main, עַל indique ici la direction. « Le ciel » convient au contexte de la plaie tout en laissant ouverte la portée du terme hébreu שָׁמַיִם.
- source_word: וַיְהִי
  choice: il y eut
  rationale: Cette tournure française rend naturellement l’apparition de l’état décrit par la forme narrative de היה.
- source_word: חֹשֶׁךְ אֲפֵלָה
  choice: d’épaisses ténèbres
  rationale: L’association de deux termes liés à l’obscurité produit un effet intensif. « D’épaisses ténèbres » exprime cette intensité sans développer excessivement l’hébreu.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: dans tout le pays d’Égypte
  rationale: Cette formulation traduit directement la préposition בְּ et l’expression אֶרֶץ מִצְרַיִם dans un français idiomatique.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: pendant trois jours
  rationale: « Pendant » explicite naturellement en français la durée exprimée par le groupe nominal hébreu.
