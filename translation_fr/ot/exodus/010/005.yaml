base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/005.yaml
  text: And it will cover the surface of the land[a], so that one will not be able to see the land; and it will eat what remains of the survivors left to you from the hail[b], and it will eat every tree growing for you out of the field.
translation:
  language: fr
  text: Il couvrira la surface du pays[a], si bien qu’on ne pourra plus voir le pays. Il dévorera le reste de ce qui a échappé et qui vous est resté après la grêle[b], et il dévorera tous les arbres qui poussent dans vos champs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’œil du pays », expression hébraïque désignant sa surface visible.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « le reste de ce qui a échappé, ce qui vous demeure après la grêle ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִסָּה
  choice: Il couvrira
  rationale: Le verbe כסה signifie « couvrir, dissimuler ». Le futur convient à l’annonce de l’invasion à venir; le singulier reprend collectivement la sauterelle ou l’essaim mentionné dans le contexte.
- source_word: עֵין הָאָרֶץ
  choice: toute la surface du pays
  rationale: L’expression signifie littéralement « l’œil de la terre/du pays » et désigne sa surface visible. « Toute » rend naturellement l’effet de couverture complète impliqué par le contexte.
- source_word: וְלֹא יוּכַל לִרְאֹת אֶת הָאָרֶץ
  choice: au point qu’on ne pourra plus voir le sol
  rationale: Le singulier hébreu est impersonnel. Le français « on ne pourra » le conserve naturellement; « le sol » évite une répétition lourde de « pays » et désigne ici la terre devenue invisible.
- source_word: וְאָכַל
  choice: Il dévorera
  rationale: אכל signifie ordinairement « manger ». Dans le contexte d’une invasion de sauterelles détruisant la végétation, « dévorer » est naturel et concret, tout en conservant le singulier collectif.
- source_word: יֶתֶר הַפְּלֵטָה
  choice: le reste de ce qui a échappé
  rationale: 'La formulation rend les deux idées imbriquées de la phrase hébraïque: ce qui a échappé à la destruction et en constitue encore le reste. Elle évite d’appeler « survivants » des végétaux.'
- source_word: הַנִּשְׁאֶרֶת לָכֶם מִן הַבָּרָד
  choice: ce que la grêle vous aura laissé
  rationale: Cette formulation française explicite naturellement que la grêle a épargné une partie des récoltes, sans changer le rapport exprimé par l’hébreu.
- source_word: כָּל הָעֵץ
  choice: tous les arbres
  rationale: עץ peut avoir un sens collectif. Au pluriel, « tous les arbres » exprime naturellement en français la totalité distributive visée.
- source_word: הַצֹּמֵחַ לָכֶם מִן הַשָּׂדֶה
  choice: qui poussent dans vos champs
  rationale: צמח exprime la croissance ou la germination. « Dans vos champs » rend idiomatiquement מן השדה et לָכֶם, c’est-à-dire les arbres poussant sur les terres des Égyptiens et à leur profit.
theological_decisions: []
