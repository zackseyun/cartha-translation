  naturalness: Le français est actuel et fluide. « Si bien qu’on ne pourra plus voir le pays » conserve l’impersonnel hébreu tout en évitant une formulation pesante. « Le reste de ce qui a échappé et qui vous est resté après la grêle » est naturel et ne personnifie pas les végétaux.
  terminology: « Pays », « grêle », « arbres » et « champs » conviennent au registre narratif et au contexte agricole. « Dévorera » est une traduction expressive mais usuelle de אכל dans le contexte des sauterelles.
