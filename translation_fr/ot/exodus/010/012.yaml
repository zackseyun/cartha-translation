revisions:
- from: 'Alors Yahweh dit à Moïse : « Étends ta main sur le pays d’Égypte pour faire venir les sauterelles[a][b]. Qu’elles montent sur le pays d’Égypte et dévorent toute la végétation du pays, tout ce que la grêle a laissé. »'
  to: 'Alors Yahweh dit à Moïse : « Étends ta main sur le pays d’Égypte pour les sauterelles[a][b], afin qu’elles montent sur le pays d’Égypte et dévorent toute la végétation du pays, tout ce que la grêle a laissé. »'
  rationale: La révision supprime l’ajout causatif « faire venir » afin de ne pas trancher ni expliciter au-delà du nécessaire la valeur disputée de la préposition hébraïque. Elle conserve les deux ancres de note immédiatement après « sauterelles » et maintient le sens collectif ainsi que la syntaxe consécutive du verset.
