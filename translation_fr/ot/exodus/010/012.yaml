  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה נְטֵ֨ה יָדְ/ךָ֜ עַל אֶ֤רֶץ מִצְרַ֨יִם֙ בָּֽ/אַרְבֶּ֔ה וְ/יַ֖עַל עַל אֶ֣רֶץ מִצְרָ֑יִם וְ/יֹאכַל֙ אֶת כָּל עֵ֣שֶׂב הָ/אָ֔רֶץ אֵ֛ת כָּל אֲשֶׁ֥ר הִשְׁאִ֖יר הַ/בָּרָֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/012.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the land of Egypt for the locusts, so that they may come up over the land of Egypt and eat every plant of the land[b], everything that the hail has left.”
translation:
  language: fr
  text: 'Alors Yahweh dit à Moïse : « Étends ta main sur le pays d’Égypte pour les sauterelles[a][b], afin qu’elles montent sur le pays d’Égypte et dévorent toute la végétation du pays, tout ce que la grêle a laissé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « pour/à l’égard de la sauterelle ». La préposition hébraïque est difficile ; des traductions comme « contre les sauterelles » ou « au-dessus des sauterelles » sont également possibles.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie le singulier « sauterelle » avec des verbes au singulier, dans un sens collectif désignant l’essaim ; le français rend naturellement ce sens par le pluriel.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel plutôt que de lui substituer un titre.
- source_word: נְטֵה יָדְךָ
  choice: Étends ta main
  rationale: Rend directement l’impératif et conserve le geste caractéristique du récit des plaies.
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: sur le pays d’Égypte
  rationale: Préserve le sens spatial de עַל et la répétition d’אֶרֶץ מִצְרַיִם dans le verset.
- source_word: בָּאַרְבֶּה
  choice: pour faire venir les sauterelles
  rationale: Expression française naturelle qui indique la visée du geste dans ce contexte, tout en signalant en note que la préposition hébraïque est difficile.
- source_word: אַרְבֶּה
  choice: les sauterelles
  rationale: Le nom hébreu est au singulier mais possède ici un sens collectif; le pluriel français exprime naturellement l’essaim.
- source_word: וְיַעַל
  choice: Qu’elles montent
  rationale: Conserve le sens de עלה et la valeur volitive ou consécutive possible de la forme verbale, avec un sujet collectif rendu au pluriel en français.
- source_word: וְיֹאכַל
  choice: et dévorent
  rationale: « Dévorer » exprime naturellement en français l’action destructrice des sauterelles tout en restant fidèle au sens contextuel d’אכל.
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: toute la végétation du pays
  rationale: עֵשֶׂב désigne ici la végétation au sens large, et non uniquement l’herbe.
- source_word: אֵת כָּל אֲשֶׁר הִשְׁאִיר הַבָּרָד
  choice: tout ce que la grêle a laissé
  rationale: Rendu direct qui relie cette plaie aux dégâts de la grêle précédente sans préciser abusivement « épargné » ou « laissé derrière elle ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le choix conserve le nom personnel présent dans le texte hébreu sans le remplacer par le titre « le Seigneur ».
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la répétition de « pays d’Égypte » et l’enchaînement des deux propositions, tout en rendant naturellement le collectif hébreu par le pluriel français.
