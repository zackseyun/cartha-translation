  variant: modern international French
source:
  edition: WLC
  text: לֹֽא רָא֞וּ אִ֣ישׁ אֶת אָחִ֗י/ו וְ/לֹא קָ֛מוּ אִ֥ישׁ מִ/תַּחְתָּ֖י/ו שְׁלֹ֣שֶׁת יָמִ֑ים וּֽ/לְ/כָל בְּנֵ֧י יִשְׂרָאֵ֛ל הָ֥יָה א֖וֹר בְּ/מוֹשְׁבֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/023.yaml
  text: They did not see one another[a], and no one rose from his place for three days[b]; but all the sons of Israel had light in their dwellings.
translation:
  language: fr
  text: Ils ne se voyaient pas les uns les autres[a], et personne ne se leva de sa place pendant trois jours. Mais tous les Israélites avaient de la lumière là où ils habitaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « un homme ne voyait pas son frère ». Cette expression a ici un sens réciproque : « ils ne se voyaient pas les uns les autres ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּ ... אֶת־אָחִיו
  choice: ne se voyaient pas les uns les autres
  rationale: L’expression « un homme… son frère » a ici un sens réciproque. La formulation française exprime naturellement ce sens sans ajouter l’idée interprétative d’une incapacité à voir.
- source_word: אִישׁ
  choice: personne
  rationale: Employé distributivement avec la négation, אִישׁ désigne ici chaque individu sans limiter l’énoncé aux hommes.
- source_word: קָמוּ
  choice: se leva
  rationale: Le verbe קום signifie couramment « se lever ». Ce choix conserve l’action exprimée sans l’élargir à « bouger ».
- source_word: מִתַּחְתָּיו
  choice: de sa place
  rationale: Littéralement « de dessous lui », l’expression désigne idiomatiquement l’endroit où chacun se trouvait.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: pendant trois jours
  rationale: « Pendant » marque naturellement en français la durée indiquée par le syntagme hébreu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Le syntagme signifie littéralement « les fils d’Israël », mais fonctionne comme une désignation ethnique et collective. « Les Israélites » est clair, exact et naturel en français moderne.
- source_word: הָיָה אוֹר
  choice: avaient de la lumière
  rationale: La construction indique que la lumière était présente et disponible pour les Israélites, en contraste avec les ténèbres qui frappaient les Égyptiens.
- source_word: בְּמֹשְׁבֹתָם
  choice: là où ils habitaient
  rationale: מוֹשָׁב peut désigner un lieu d’habitation ou un établissement. Cette formulation conserve la portée du terme tout en évitant le tour peu naturel « dans leurs habitations ».
theological_decisions: []
translation_notes:
  register: 'Français international moderne, clair et digne. La traduction privilégie une équivalence optimale : elle rend les idiomes hébreux en français naturel tout en conservant l’affirmation sobre du texte, qui dit qu’ils ne se voyaient pas sans expliciter « ils ne pouvaient pas se voir ».'
