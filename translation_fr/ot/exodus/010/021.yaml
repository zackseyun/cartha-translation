base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/021.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky, so that there may be darkness over the land of Egypt, and the darkness may be felt.”
translation:
  language: fr
  text: 'Alors Yahweh dit à Moïse : « Étends ta main vers le ciel, afin qu’il y ait des ténèbres sur le pays d’Égypte et que les ténèbres soient palpables[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu est rare et son sens précis est incertain. On peut aussi comprendre : « et qu’on puisse toucher les ténèbres » ou « et qu’on puisse sentir les ténèbres ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit directement le nom divin personnel exprimé par le tétragramme.
- source_word: נְטֵה יָדְךָ
  choice: Étends ta main
  rationale: Rend directement l’impératif et son complément dans un français naturel et digne.
- source_word: עַל הַשָּׁמַיִם
  choice: vers le ciel
  rationale: Dans le contexte du geste demandé à Moïse, la préposition indique naturellement la direction; le singulier collectif « ciel » est idiomatique en français.
- source_word: וִיהִי חֹשֶׁךְ עַל אֶרֶץ מִצְרָיִם
  choice: afin que les ténèbres couvrent le pays d’Égypte
  rationale: Exprime la valeur volitive ou résultative de la construction tout en rendant על par l’idée de ténèbres s’étendant sur le pays.
- source_word: וְיָמֵשׁ חֹשֶׁךְ
  choice: et qu’on puisse les toucher
  rationale: Le verbe rare מוּשׁ est compris ici au sens de tâter ou toucher; le pronom reprend naturellement « les ténèbres » en français, sans effacer l’incertitude lexicale signalée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte hébreu emploie explicitement le nom personnel divin; « Yahweh » le préserve sans le remplacer par un titre.
- issue: Nature des ténèbres dans la dernière proposition
  choice: qu’on puisse les toucher
  alternative: que les ténèbres soient palpables / qu’on puisse sentir les ténèbres
  rationale: Cette formulation conserve l’image concrète traditionnellement associée au verbe rare sans transformer la phrase en affirmation doctrinale sur la substance des ténèbres.
translation_notes:
  register: Français international moderne, courant et digne. « Les ténèbres » maintient le registre biblique sans archaïsme excessif; « qu’on puisse » exprime l’indéfini humain de manière naturelle.
