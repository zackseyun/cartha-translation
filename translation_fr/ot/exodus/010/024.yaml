- from: 'Alors le pharaon appela Moïse et lui dit : « Allez, servez Yahweh. Seuls vos moutons, vos chèvres et vos bovins resteront ici[a] ; même vos enfants pourront aller avec vous[b]. »'
  to: 'Alors le pharaon appela Moïse et lui dit : « Allez, servez Yahweh. Seuls vos troupeaux et votre gros bétail devront rester sur place[a] ; même vos enfants peuvent aller avec vous[b]. »'
  rationale: La révision conserve la concession de Pharaon et le sens permissif du yiqtol (« peuvent aller »), tout en rendant les deux collectifs de bétail sans sur-explicitation et sans ajout déictique. Les notes restent ancrées sur les expressions concernées et présentent des alternatives lexicales pertinentes.
