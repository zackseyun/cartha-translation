  text: וַ/יִּקְרָ֨א פַרְעֹ֜ה אֶל מֹשֶׁ֗ה וַ/יֹּ֨אמֶר֙ לְכוּ֙ עִבְד֣וּ אֶת יְהוָ֔ה רַ֛ק צֹאנְ/כֶ֥ם וּ/בְקַרְ/כֶ֖ם יֻצָּ֑ג גַּֽם טַפְּ/כֶ֖ם יֵלֵ֥ךְ עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/024.yaml
  text: Then Pharaoh called to Moses and said[a], “Go, serve Yahweh. Only let your flocks and your herds remain behind[b]; even your little ones may go with you.”
translation:
  language: fr
  text: 'Alors le pharaon appela Moïse et lui dit : « Allez, servez Yahweh. Seuls vos troupeaux et votre gros bétail devront rester sur place[a] ; même vos enfants peuvent aller avec vous[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « seront laissés sur place ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vos petits enfants ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא פַרְעֹה אֶל מֹשֶׁה
  choice: le pharaon appela Moïse
  rationale: Dans ce contexte narratif, קרא אֶל indique que le pharaon appelle Moïse pour lui parler. La formulation française est naturelle sans renforcer indûment l'idée d'une convocation officielle.
- source_word: לְכוּ עִבְדוּ אֶת יְהוָה
  choice: Allez, servez Yahweh
  rationale: « Servez » conserve le sens direct de עבד et le motif de l'Exode opposant le service de Yahweh au service du pharaon. Le pluriel de l'impératif est rendu par « allez » et « servez ».
- source_word: רַק
  choice: Seuls
  rationale: רַק introduit la restriction imposée par le pharaon. En français, « seuls » l'attache naturellement au bétail qui doit rester.
- source_word: צֹאנְכֶם וּבְקַרְכֶם
  choice: vos moutons, vos chèvres et vos bovins
  rationale: צֹאן désigne collectivement le petit bétail, notamment moutons et chèvres, tandis que בָּקָר désigne le gros bétail, surtout les bovins. Cette explicitation est claire en français moderne.
- source_word: יֻצָּג
  choice: resteront ici
  rationale: Le hophal de יצג exprime ici le fait d'être laissés ou maintenus sur place. « Resteront ici » rend naturellement le résultat exigé par le pharaon, tout en signalant en note la formulation passive possible.
- source_word: גַּם טַפְּכֶם
  choice: même vos enfants
  rationale: גַּם a ici une force emphatique ou concessive, bien rendue par « même ». טַף désigne les jeunes enfants ou, plus largement, les personnes à charge du foyer.
- source_word: יֵלֵךְ עִמָּכֶם
  choice: pourront aller avec vous
  rationale: L'imparfait hébreu exprime dans la concession du pharaon une permission contextuelle. « Pourront aller » est idiomatique et évite de présenter ses paroles comme une simple prédiction.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » préserve le nom personnel divin plutôt que de lui substituer un titre.
- issue: Sens cultuel de עבד
  choice: servez
  alternative: rendez un culte à
  rationale: '« Servez » maintient l''amplitude du verbe et le thème théologique central de l''Exode : Israël doit servir Yahweh plutôt que le pharaon. « Rendez un culte » serait possible, mais limiterait davantage le champ sémantique.'
translation_notes:
  register: Français international moderne, narratif et digne. L'article est conservé devant « pharaon », usage naturel en français. La désignation concrète du petit et du gros bétail évite l'ambiguïté possible de « troupeaux ». Tous les marqueurs de notes figurent dans le texte.
