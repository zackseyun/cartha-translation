- from: 'Il leur dit[a] : « Que Yahweh soit vraiment avec vous, si jamais je vous laisse partir avec vos petits enfants ! Voyez[b] : le mal est devant vous. »'
  to: 'Il leur dit : « Que Yahweh soit vraiment avec vous, si jamais je vous laisse partir, vous et vos jeunes enfants[a] ! Voyez[b] : le mal est devant vous. »'
  rationale: La révision remplace une expression française susceptible de signifier « petits-enfants » par « jeunes enfants », qui transmet sans ambiguïté la portée de טַף. Elle restitue également la coordination explicite de « vous et vos jeunes enfants » et replace l’ancre de la note a auprès de la formulation qu’elle documente. L’ambiguïté délibérée de la dernière clause est préservée.
