  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם יְהִ֨י כֵ֤ן יְהוָה֙ עִמָּ/כֶ֔ם כַּ/אֲשֶׁ֛ר אֲשַׁלַּ֥ח אֶתְ/כֶ֖ם וְ/אֶֽת טַפְּ/כֶ֑ם רְא֕וּ כִּ֥י רָעָ֖ה נֶ֥גֶד פְּנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/010.yaml
  text: And he said to them[a], “May Yahweh indeed be with you, if I ever send you and your little ones out! See[b], for evil is before your faces.”
translation:
  language: fr
  text: 'Il leur dit : « Que Yahweh soit vraiment avec vous, si jamais je vous laisse partir, vous et vos jeunes enfants[a] ! Voyez[b] : le mal est devant vous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Que Yahweh soit avec vous quand je vous laisserai partir, vous et vos jeunes enfants ! » Ces paroles sont probablement sarcastiques.'
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu est ambigu : cette expression peut signifier « le malheur vous menace » ou « vous avez le mal en vue », c’est-à-dire de mauvaises intentions.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי כֵן יְהוָה עִמָּכֶם
  choice: Que Yahweh soit vraiment avec vous
  rationale: Le jussif יְהִי et כֵן ont ici une valeur de souhait, tandis que le contexte hostile laisse entendre le sarcasme de Pharaon sans qu’il soit nécessaire de l’expliciter dans le texte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération claire du nom divin, conforme à l’usage du projet.
- source_word: כַּאֲשֶׁר
  choice: si jamais
  rationale: Dans cette réplique sarcastique, la tournure conditionnelle française rend mieux la menace implicite qu’un simple « quand », tout en signalant que Pharaon n’envisage pas réellement de les laisser partir ainsi.
- source_word: אֲשַׁלַּח אֶתְכֶם וְאֶת טַפְּכֶם
  choice: je vous laisse partir avec vos petits enfants
  rationale: Dans le récit de l’Exode, שׁלח signifie couramment « laisser partir ». La coordination hébraïque est rendue naturellement par « avec », sans changer les personnes incluses.
- source_word: טַפְּכֶם
  choice: vos petits enfants
  rationale: טַף désigne particulièrement les jeunes enfants ; « petits enfants » conserve cette nuance en français courant.
- source_word: רְאוּ
  choice: Voyez
  rationale: L’impératif est conservé au plus près. Dans ce contexte, il peut être entendu comme une sommation à constater ou comme un avertissement.
- source_word: כִּי רָעָה נֶגֶד פְּנֵיכֶם
  choice: le mal est devant vous
  rationale: Cette formulation reste proche de l’hébreu et préserve l’ambiguïté entre un malheur qui les attend et une mauvaise intention qu’ils auraient en vue.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le nom propre est conservé plutôt que remplacé par un titre, conformément à l’usage du projet.
- issue: Ironie de la bénédiction prononcée par Pharaon
  choice: La formulation optative est maintenue, et le sarcasme est expliqué en note.
  alternative: Traduire explicitement par une formule comme « Yahweh sera avec vous le jour où… », fortement ironique.
  rationale: Le texte français laisse le ton surgir du contexte au lieu d’imposer une interprétation dans la phrase principale.
- issue: Ambiguïté de רָעָה נֶגֶד פְּנֵיכֶם
  choice: le mal est devant vous
  alternative: le malheur vous menace / vous avez de mauvaises intentions
  rationale: L’hébreu permet soit une menace de désastre, soit une accusation de dessein mauvais. La traduction principale ne tranche pas.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct conserve la tension et le sarcasme de Pharaon, tandis que les notes exposent les principales possibilités sans résoudre l’ambiguïté de l’hébreu.
