    issue: « vos petits enfants » est ambigu en français moderne
    rationale: Cette expression signifie fréquemment « vos petits-enfants » (grandchildren), alors que טַף désigne les jeunes enfants qui accompagneraient leurs parents. « Vos jeunes enfants » évite ce faux sens.
  - severity: low
    issue: L’ancre de la note a est placée après « leur dit »
    rationale: La note porte sur la formulation « Que Yahweh soit avec vous quand/si je vous laisserai partir… », non sur le verbe introducteur. La placer après cette proposition améliore le rattachement sans modifier le sens.
