source:
  edition: WLC
  text: וַ/יְמַהֵ֣ר פַּרְעֹ֔ה לִ/קְרֹ֖א לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֑ן וַ/יֹּ֗אמֶר חָטָ֛אתִי לַ/יהוָ֥ה אֱלֹֽהֵי/כֶ֖ם וְ/לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/016.yaml
  text: Then Pharaoh hurried to call for Moses and Aaron, and he said, “I have sinned against Yahweh your God and against you.”
translation:
  language: fr
  text: 'Alors, le pharaon se hâta de faire appeler Moïse et Aaron. Il dit : « J’ai péché contre Yahweh, votre Dieu, et contre vous. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: se hâta
  rationale: Le verbe מהר exprime l’empressement et l’urgence. « Se hâta » est naturel dans un récit de registre digne et reste proche de l’hébreu.
- source_word: לִקְרֹא
  choice: de faire appeler
  rationale: Dans ce contexte, l’infinitif signifie que le pharaon demande qu’on fasse venir Moïse et Aaron. « Faire appeler » rend cette valeur sans suggérer qu’il les interpelle lui-même.
- source_word: פַּרְעֹה
  choice: le pharaon
  rationale: Le titre royal est rendu avec l’article, conformément à l’usage naturel du français moderne.
- source_word: לְמֹשֶׁה וּלְאַהֲרֹן
  choice: Moïse et Aaron
  rationale: Les prépositions hébraïques sont naturellement intégrées à la construction française « faire appeler Moïse et Aaron ».
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Rendu narratif direct et courant du wayyiqtol introduisant le discours.
- source_word: חָטָאתִי
  choice: J’ai péché
  rationale: Le passé composé exprime naturellement en français une faute accomplie dont le locuteur reconnaît maintenant la réalité, tout en conservant la force morale et théologique de חטא.
- source_word: לַיהוָה
  choice: contre Yahweh
  rationale: Après « pécher », la préposition ל désigne ici la personne offensée ; « pécher contre » est l’équivalent idiomatique français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Le suffixe de deuxième personne du pluriel est conservé. Le pharaon parle du Dieu de Moïse et d’Aaron sans le désigner comme son propre Dieu.
- source_word: וְלָכֶם
  choice: et contre vous
  rationale: La même relation avec « pécher » est reprise. « Vous » garde l’adresse plurielle à Moïse et Aaron.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom personnel et distingue celui-ci du titre אֲדֹנָי.
- issue: Portée de la confession du pharaon
  choice: « J’ai péché contre Yahweh, votre Dieu, et contre vous »
  alternative: « J’ai péché envers Yahweh, votre Dieu, et envers vous »
  rationale: « Contre » exprime en français la personne offensée et préserve le parallélisme de l’hébreu. « Votre Dieu » maintient la deuxième personne du pluriel et n’élargit pas la confession en « notre Dieu ».
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe narrative est légèrement soutenue sans archaïsme. La ponctuation en deux phrases évite une coordination lourde tout en conservant la succession rapide des actions.
