revisions:
- from: 'Les criquets montèrent sur tout le pays d’Égypte et se posèrent sur tout le territoire de l’Égypte. Ils formaient une invasion extrêmement dévastatrice[a] : jamais auparavant il n’y avait eu autant de criquets, et jamais plus il n’y en aura autant.'
  to: 'Les criquets montèrent sur tout le pays d’Égypte et se posèrent dans tout le territoire de l’Égypte. L’invasion était extrêmement grave[a] : jamais auparavant il n’y avait eu de criquets pareils, et il n’y en aura jamais plus de pareils.'
  rationale: La révision supprime l’ajout interprétatif « dévastatrice », rend la répartition territoriale avec une préposition plus exacte, et remplace la comparaison purement quantitative par « de criquets pareils », qui préserve la portée plus large du texte hébreu. La note est resserrée afin de présenter le littéral et la valeur idiomatique sans imposer une interprétation unique.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:12:50Z'
review_pass:
  verdict: revise
  source_fidelity: Le projet rend bien l’arrivée, la couverture du pays et le fait que les criquets se posent. Toutefois, « extrêmement dévastatrice » attribue explicitement un effet destructeur que כָּבֵד מְאֹד n’énonce pas directement. De plus, « autant de criquets » réduit la comparaison hébraïque (« de tels criquets / des criquets pareils ») à la seule quantité.
  naturalness: Le français est globalement fluide. « Dans tout le territoire de l’Égypte » est plus naturel et plus fidèle à בְּכָל que « sur tout le territoire », après « se posèrent ». La reprise par « de criquets pareils » conserve un style narratif moderne et clair.
  terminology: « Criquets » et « pays d’Égypte » conviennent. « Une invasion extrêmement grave » rend de manière sobre la qualification intensive de l’invasion, sans ajouter l’idée spécifique de dévastation. La note conserve le sens littéral de « très lourde » et signale la valeur idiomatique.
  issues:
  - severity: medium
    issue: « extrêmement dévastatrice » ajoute une idée d’effet destructeur explicite.
    rationale: L’hébreu כָּבֵד מְאֹד signifie littéralement « très lourd » et qualifie l’invasion comme exceptionnellement intense ou grave; il ne dit pas directement qu’elle est dévastatrice.
  - severity: medium
    issue: « autant de criquets » ne rend pas pleinement la comparaison qualitative « comme lui / tels » de l’hébreu.
    rationale: La formulation française limite le propos au nombre, alors que le texte affirme l’absence passée et future d’une invasion de criquets semblable.
  - severity: low
    issue: « se posèrent sur tout le territoire » est moins précis après le verbe « se poser ».
    rationale: « Dans tout le territoire » exprime mieux la répartition des criquets à travers le domaine égyptien, conformément à בְּכָל גְּבוּל מִצְרָיִם.
  revised_text: 'Les criquets montèrent sur tout le pays d’Égypte et se posèrent dans tout le territoire de l’Égypte. L’invasion était extrêmement grave[a] : jamais auparavant il n’y avait eu de criquets pareils, et il n’y en aura jamais plus de pareils.'
  revised_footnotes:
