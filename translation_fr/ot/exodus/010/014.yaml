base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/014.yaml
  text: And the locusts came up over all the land of Egypt and settled in every territory of Egypt[a]—an extremely severe swarm. never before had there been locusts like it, nor will there be again after it.
translation:
  language: fr
  text: 'Les criquets montèrent sur tout le pays d’Égypte et se posèrent dans tout le territoire de l’Égypte. L’invasion était extrêmement grave[a] : jamais auparavant il n’y avait eu de criquets pareils, et il n’y en aura jamais plus de pareils.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « très lourde ». L’expression qualifie l’invasion comme exceptionnellement grave ou intense.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: montèrent
  rationale: Le verbe עלה signifie « monter ». Le français conserve ici l’image hébraïque tout en décrivant naturellement l’arrivée et la progression des criquets.
- source_word: הָאַרְבֶּה
  choice: les criquets
  rationale: Le nom hébreu au singulier a ici un sens collectif. Le pluriel français exprime naturellement la masse des insectes.
- source_word: עַל כָּל אֶרֶץ מִצְרַיִם
  choice: sur tout le pays d’Égypte
  rationale: « Pays » rend ici אֶרֶץ comme territoire national, et « sur tout » reflète l’étendue complète de l’invasion.
- source_word: וַיָּנַח
  choice: se posèrent
  rationale: נוח indique qu’ils vinrent au repos. Pour des criquets, « se poser » est plus idiomatique que « se reposer ».
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: sur tout le territoire de l’Égypte
  rationale: גְּבוּל désigne ici l’ensemble du domaine territorial égyptien plutôt que la seule frontière. La préposition « sur » convient naturellement aux criquets qui couvrent le pays.
- source_word: כָּבֵד מְאֹד
  choice: une invasion extrêmement dévastatrice
  rationale: Littéralement « très lourd », l’expression qualifie l’ampleur accablante du fléau. « Invasion extrêmement dévastatrice » communique ce sens en français naturel sans suggérer simplement le poids physique.
- source_word: לֹא הָיָה כֵן אַרְבֶּה כָּמֹהוּ
  choice: jamais auparavant il n’y avait eu autant de criquets
  rationale: Cette formulation idiomatique restitue le caractère sans précédent de l’invasion collective.
- source_word: וְאַחֲרָיו לֹא יִהְיֶה כֵּן
  choice: et jamais plus il n’y en aura autant
  rationale: La formulation conserve la comparaison orientée vers l’avenir et le parallélisme entre ce qui précède et ce qui suivra.
