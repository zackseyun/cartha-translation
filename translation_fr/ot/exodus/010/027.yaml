id: EXO.10.27
reference: Exodus 10:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְחַזֵּ֥ק יְהוָ֖ה אֶת לֵ֣ב פַּרְעֹ֑ה וְ/לֹ֥א אָבָ֖ה לְ/שַׁלְּחָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/027.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he was not willing to let them go.
translation:
  language: fr
  text: Mais Yahweh endurcit le cœur de Pharaon[a], et celui-ci ne voulut pas les laisser partir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « affermit le cœur de Pharaon » ou « rendit ferme le cœur de Pharaon ». Le verbe hébreu peut signifier « rendre fort » ou « affermir » ; avec « cœur » dans ce contexte, il exprime l’idée d’endurcissement.
    reason: lexical_alternative
  - marker: b
    text: Ou « et celui-ci refusa de les laisser partir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: endurcit
  rationale: Le verbe חזק signifie fondamentalement « rendre fort, affermir ». Dans la formule récurrente où il a pour objet le cœur de Pharaon, « endurcir » exprime naturellement en français le raffermissement obstiné de sa volonté, tout en laissant l’alternative littérale en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom personnel יהוה au lieu de lui substituer un titre.
- source_word: לֵב
  choice: cœur
  rationale: « Cœur » conserve l’image hébraïque et peut désigner, comme לֵב, le siège de la volonté et des dispositions intérieures.
- source_word: פַּרְעֹה
  choice: Pharaon
  rationale: Forme française usuelle du titre royal égyptien.
- source_word: לֹא אָבָה
  choice: ne voulut pas
  rationale: Le verbe אבה porte directement sur le consentement ou la volonté. « Ne voulut pas » en rend le sens sans transformer explicitement l’énoncé en refus formel.
- source_word: לְשַׁלְּחָם
  choice: les laisser partir
  rationale: Dans le récit de l’Exode, שלח désigne couramment le fait de permettre aux Israélites de partir. Cette formulation française est naturelle et maintient le refrain narratif.
theological_decisions:
- issue: Endurcissement divin et volonté humaine
  choice: Attribuer explicitement à Yahweh l’endurcissement du cœur, puis énoncer séparément que Pharaon ne voulut pas laisser partir les Israélites.
  alternative: « Yahweh affermit le cœur de Pharaon, de sorte qu’il refusa de les laisser partir. »
  rationale: L’hébreu juxtapose l’action de Yahweh et l’absence de volonté de Pharaon sans particule exprimant une conséquence. La traduction préserve donc à la fois l’action divine et la responsabilité volontaire de Pharaon, sans expliquer leur relation.
translation_notes:
  register: Français international moderne, clair et digne. « Celui-ci » évite toute ambiguïté sur le sujet de « ne voulut pas » après la mention de Yahweh et de Pharaon. La coordination par « et » reproduit la juxtaposition hébraïque sans introduire un lien causal absent du texte.
