  text: 'Moïse répondit : « C’est bien comme tu l’as dit. Je ne reverrai plus ton visage. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: répondit
  rationale: Dans cet échange direct, le waw consécutif introduit la réplique de Moïse. « Répondit » rend naturellement la fonction contextuelle du verbe אָמַר sans alourdir le récit.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom hébreu מֹשֶׁה.
- source_word: כֵּן דִּבַּרְתָּ
  choice: Tu as bien parlé
  rationale: 'La formule exprime ici l''assentiment de Moïse à la déclaration précédente du pharaon : « c''est bien ainsi que tu as parlé ». Cette traduction française concise conserve le parfait de דִּבַּרְתָּ et le ton solennel, sans transformer l''assentiment en simple approbation morale.'
- source_word: לֹא אֹסִף עוֹד
  choice: je ne … plus
  rationale: La construction négative avec le hiphil de יסף et עוֹד signifie que l'action ne se reproduira pas. « Ne… plus » est l'expression française idiomatique correspondante.
- source_word: רְאוֹת
  choice: reverrai
  rationale: L'infinitif de ראה dépend de la construction avec יסף. En français, « revoir » exprime naturellement le fait de voir de nouveau, ici nié et situé dans l'avenir.
- source_word: פָּנֶיךָ
  choice: ton visage
  rationale: Traduction concrète de « ton visage », préférable ici à « ta présence », puisque le contexte est celui d'une confrontation personnelle.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. Le tutoiement correspond au singulier masculin de la parole adressée au pharaon et à l'usage narratif courant dans les traductions bibliques françaises. La formulation conserve la tension narrative sans expliquer comment cette déclaration s'articule avec les scènes suivantes.
