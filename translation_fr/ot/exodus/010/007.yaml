source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ עַבְדֵ֨י פַרְעֹ֜ה אֵלָ֗י/ו עַד מָתַי֙ יִהְיֶ֨ה זֶ֥ה לָ֨/נוּ֙ לְ/מוֹקֵ֔שׁ שַׁלַּח֙ אֶת הָ֣/אֲנָשִׁ֔ים וְ/יַֽעַבְד֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם הֲ/טֶ֣רֶם תֵּדַ֔ע כִּ֥י אָבְדָ֖ה מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/007.yaml
  text: Then Pharaoh’s servants said to him[a], “How long will this man be a snare to us? Send the men away so that they may serve Yahweh their God[e][d][c][b]. Do you not yet know that Egypt is ruined?”
translation:
  language: fr
  text: 'Alors les serviteurs de Pharaon lui dirent : « Jusqu’à quand cet homme sera-t-il un piège pour nous ? Laisse partir les hommes, afin qu’ils servent Yahweh, leur Dieu.[a] Ne sais-tu pas encore que l’Égypte est ruinée ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « afin qu’ils rendent un culte à Yahweh, leur Dieu » ; le verbe hébreu peut désigner à la fois le service et le culte rendus à Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי פַרְעֹה
  choice: les serviteurs de Pharaon
  rationale: Rend directement l’expression hébraïque. Dans ce contexte, il s’agit vraisemblablement de membres de la cour ou de hauts fonctionnaires, mais « serviteurs » évite de préciser plus que le texte.
- source_word: עַד מָתַי
  choice: Jusqu’à quand
  rationale: Expression interrogative naturelle en français, qui conserve la tournure et l’impatience de l’hébreu.
- source_word: זֶה
  choice: cet homme
  rationale: Le démonstratif désigne Moïse dans le contexte. L’ajout de « homme » est nécessaire à une formulation française naturelle sans modifier le référent.
- source_word: לְמוֹקֵשׁ
  choice: un piège
  rationale: מוֹקֵשׁ désigne un piège ou un lacet. « Piège » est courant, clair et préserve la métaphore.
- source_word: שַׁלַּח
  choice: Laisse partir
  rationale: L’impératif demande à Pharaon de relâcher les hommes. « Laisse partir » est idiomatique dans ce contexte et exprime bien la permission exigée.
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: Le nom hébreu est explicitement masculin pluriel. La traduction conserve cette précision plutôt que de l’élargir à « le peuple ».
- source_word: וְיַעַבְדוּ
  choice: afin qu’ils servent
  rationale: Le verbe עבד peut désigner le service rendu à Dieu, avec une dimension cultuelle. « Servent » maintient cette amplitude sémantique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin YHWH, qui conserve ici le nom personnel plutôt que de lui substituer un titre.
- source_word: הֲטֶרֶם תֵּדַע
  choice: Ne sais-tu pas encore
  rationale: Rend naturellement en français la question de reproche introduite par הֲ et טֶרֶם.
- source_word: אָבְדָה מִצְרָיִם
  choice: l’Égypte est ruinée
  rationale: Le parfait décrit l’état de dévastation déjà produit par les fléaux. « Est ruinée » exprime ce résultat sans impliquer nécessairement une disparition totale.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin YHWH. « Yahweh » le représente comme nom propre, tandis que « le SEIGNEUR » relève de la substitution traditionnelle par un titre.
- issue: Portée de הָאֲנָשִׁים
  choice: les hommes
  alternative: le peuple
  rationale: La formulation masculine du texte est conservée, même si le récit plus large concerne le départ d’Israël.
- issue: Sens cultuel de עבד
  choice: servent
  alternative: rendent un culte à
  rationale: « Servent » préserve la tension entre service et culte inhérente au verbe lorsqu’il a Dieu pour objet, sans réduire son sens au seul acte liturgique.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de l’hébreu tout en évitant les tournures artificielles. « Jusqu’à quand » et « Ne sais-tu pas encore » conservent la vigueur du reproche adressé à Pharaon.
