id: EXO.10.20
reference: Exodus 10:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְחַזֵּ֥ק יְהוָ֖ה אֶת לֵ֣ב פַּרְעֹ֑ה וְ/לֹ֥א שִׁלַּ֖ח אֶת בְּנֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/020.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he did not let the sons of Israel go.
translation:
  language: fr
  text: Mais Yahweh affermit le cœur du pharaon[a], et celui-ci ne laissa pas partir les Israélites[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « endurcit le cœur du pharaon » ou « rendit ferme le cœur du pharaon » ; le verbe hébreu signifie littéralement « rendre fort, ferme ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les fils d’Israël » ; traditionnellement « les enfants d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: affermit
  rationale: Le hifil de חזק signifie littéralement « rendre fort/ferme ». « Affermit » reste naturel en français, conserve cette valeur lexicale et, avec « le cœur », exprime que la résolution intérieure du pharaon devient inflexible sans aller au-delà du verbe hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom personnel יהוה plutôt que de lui substituer un titre.
- source_word: לֵב
  choice: cœur
  rationale: « Cœur » conserve l’image hébraïque et peut désigner la volonté, la résolution et la disposition intérieure.
- source_word: פַּרְעֹה
  choice: du pharaon
  rationale: 'En français, le titre royal commun se construit naturellement avec l’article défini : « le pharaon ».'
- source_word: שִׁלַּח
  choice: ne laissa pas partir
  rationale: Dans le contexte de la sortie d’Égypte, cette tournure rend idiomatiquement le sens de שׁלח appliqué à la libération d’Israël.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: « Les Israélites » désigne naturellement en français le peuple issu d’Israël et évite que le calque « fils d’Israël » soit compris comme ne visant que les hommes.
theological_decisions:
- issue: Action divine sur le cœur du pharaon
  choice: Yahweh affermit le cœur du pharaon
  alternative: Yahweh endurcit le cœur du pharaon
  rationale: Le texte attribue explicitement l’action à Yahweh; la traduction maintient donc cette attribution sans l’atténuer. « Affermit » reflète directement le sens de חזק, tandis que la note donne la formulation traditionnelle « endurcit ». Aucune explication doctrinale sur le rapport entre l’action divine et la responsabilité humaine n’est ajoutée.
translation_notes:
  register: Français international moderne, sobre et digne. La coordination « Mais » maintient le contraste narratif. « Celui-ci » lève naturellement l’ambiguïté du pronom sujet français après la mention de Yahweh et du pharaon. Les deux appels de note figurent dans le texte dans l’ordre [a], [b].
