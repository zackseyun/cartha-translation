source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה גַּם אַתָּ֛ה תִּתֵּ֥ן בְּ/יָדֵ֖/נוּ זְבָחִ֣ים וְ/עֹל֑וֹת וְ/עָשִׂ֖ינוּ לַ/יהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/025.yaml
  text: But Moses said[a], “You also must give into our hands sacrifices and burnt offerings, and we will offer them to Yahweh our God.”
translation:
  language: fr
  text: 'Mais Moïse dit : « Toi aussi, tu devras remettre entre nos mains des sacrifices et des holocaustes, et nous les offrirons à Yahweh[a], notre Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte le nom divin YHWH, rendu ici par « Yahweh ».
    reason: Précision sur le rendu du nom divin.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mais Moïse dit
  rationale: Le waw narratif fait progresser le récit, tandis que « Mais » rend l’opposition à la restriction imposée par le pharaon au verset précédent.
- source_word: גַּם אַתָּה
  choice: Toi aussi
  rationale: 'Le pronom indépendant est emphatique : le pharaon lui-même devra également fournir ce qui est nécessaire.'
- source_word: תִּתֵּן בְּיָדֵנוּ
  choice: tu devras remettre entre nos mains
  rationale: « Devras » exprime l’insistance contextuelle de Moïse; « remettre entre nos mains » conserve l’image concrète du transfert tout en restant idiomatique en français.
- source_word: זְבָחִים
  choice: des sacrifices
  rationale: Terme général clair pour des offrandes sacrificielles, souvent associées à l’abattage d’un animal.
- source_word: וְעֹלֹת
  choice: et des holocaustes
  rationale: « Holocaustes » est le terme français traditionnel et précis pour des offrandes entièrement brûlées sur l’autel.
- source_word: וְעָשִׂינוּ
  choice: et nous les offrirons
  rationale: Dans ce contexte cultuel, עשה désigne l’accomplissement ou la présentation du sacrifice; « offrir » en communique naturellement le sens.
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: à Yahweh, notre Dieu
  rationale: La préposition indique le destinataire des offrandes, et le nom divin est translittéré afin de préserver le nom propre présent dans l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le Tétragramme. La translittération distingue le nom divin du titre אֲדֹנָי et évite de remplacer silencieusement le nom propre par un titre.
- issue: Force de l’imparfait תִּתֵּן
  choice: tu devras remettre
  alternative: tu remettras
  rationale: Dans la réponse de Moïse à la concession restrictive du pharaon, la forme exprime une exigence ferme plutôt qu’une simple prédiction, sans en faire un impératif grammatical explicite.
translation_notes:
  register: Français international moderne, digne et accessible. « Toi aussi » conserve l’emphase hébraïque; « remettre entre nos mains » maintient l’image concrète sans lourdeur excessive. La coordination de la phrase source est préservée.
