source:
  edition: WLC
  text: וַ/יֵּצֵ֖א מֵ/עִ֣ם פַּרְעֹ֑ה וַ/יֶּעְתַּ֖ר אֶל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/018.yaml
  text: So he went out from Pharaoh and pleaded with Yahweh[a].
translation:
  language: fr
  text: Moïse sortit de chez Pharaon et supplia Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pria Yahweh avec insistance » ou « implora Yahweh ». Le verbe hébreu exprime une supplication fervente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: sortit
  rationale: Le qal wayyiqtol de יצא exprime ici le fait de sortir ou de partir et poursuit naturellement la séquence narrative.
- source_word: מֵעִם פַּרְעֹה
  choice: de chez le pharaon
  rationale: מֵעִם indique l’éloignement d’auprès du pharaon. « De chez le pharaon » rend naturellement en français le départ du lieu où Moïse se trouvait avec lui, sans alourdir par « de la présence du pharaon ».
- source_word: וַיֶּעְתַּר
  choice: supplia
  rationale: Le verbe עתר désigne une supplication insistante, souvent adressée à Dieu. « Supplia » conserve l’intensité et convient à la construction avec אֶל.
- source_word: אֶל
  choice: Yahweh comme complément de « supplia »
  rationale: La préposition marque la direction de la supplication vers Dieu; en français, le verbe « supplier » se construit directement avec la personne implorée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » préserve le nom personnel, tandis que « le SEIGNEUR » reflète la tradition de substitution liturgique.
translation_notes:
  register: Français international moderne, simple et digne. L’ajout explicite de « Moïse » clarifie le sujet sous-entendu par le verbe hébreu dans ce verset isolé; « le pharaon » suit l’usage français courant pour le titre royal.
