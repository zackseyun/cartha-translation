  text: וַ/יֹּֽאמֶר ל֥/וֹ פַרְעֹ֖ה לֵ֣ךְ מֵ/עָלָ֑/י הִשָּׁ֣מֶר לְ/ךָ֗ אֶל תֹּ֨סֶף֙ רְא֣וֹת פָּנַ֔/י כִּ֗י בְּ/י֛וֹם רְאֹתְ/ךָ֥ פָנַ֖/י תָּמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/028.yaml
  text: Then Pharaoh said to him[a], “Go away from me. Watch yourself; do not see my face again, for on the day you see my face[b], you will die.”
translation:
  language: fr
  text: 'Alors le pharaon lui dit : « Éloigne-toi de moi. Prends garde à toi ! Ne revois plus mon visage[a], car le jour où tu verras mon visage[b], tu mourras. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « n’ajoute pas à voir mon visage », expression qui signifie ici : « ne revois plus mon visage » ou « ne viens plus devant moi ».'
    reason: lexical_alternative
  - marker: b
    text: « Mon visage » peut aussi avoir le sens de « ma présence ». L’hébreu répète toutefois le mot « visage » pour souligner la menace.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ פַרְעֹה
  choice: Alors le pharaon lui dit
  rationale: Le waw consécutif fait progresser le récit. « Alors » exprime naturellement cette succession en français moderne, tandis que « lui » conserve le complément hébreu.
- source_word: לֵךְ מֵעָלַי
  choice: Va-t’en loin de moi
  rationale: Cette formulation rend l’impératif de départ et la force de la répudiation. Elle est naturelle en français et conserve le ton hostile de la parole du pharaon.
- source_word: הִשָּׁמֶר לְךָ
  choice: Prends garde à toi !
  rationale: L’impératif niphal de שמר accompagné du datif לְךָ constitue un avertissement personnel et menaçant. Cette expression française en restitue directement la force.
- source_word: אַל תֹּסֶף רְאוֹת פָּנַי
  choice: Ne revois plus mon visage
  rationale: La construction יסף suivie de l’infinitif signifie idiomatiquement ne pas recommencer ou continuer à faire quelque chose. « Ne revois plus » est à la fois naturel et précis, sans reproduire artificiellement le littéralisme « n’ajoute pas à voir ».
- source_word: פָּנַי
  choice: mon visage
  rationale: Le nom peut désigner par métonymie la présence d’une personne, mais sa répétition dans le verset produit un effet rhétorique qu’il convient de préserver.
- source_word: בְּיוֹם
  choice: le jour où
  rationale: Cette tournure conserve l’image temporelle solennelle de l’hébreu tout en étant idiomatique en français.
- source_word: רְאֹתְךָ פָנַי
  choice: tu verras mon visage
  rationale: L’infinitif construit muni du suffixe est rendu par une proposition personnelle naturelle en français, sans altérer son rapport temporel avec « le jour où ».
- source_word: תָּמוּת
  choice: tu mourras
  rationale: Le futur français exprime clairement la menace annoncée par le pharaon, dans une langue actuelle et ferme.
