  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה כִּֽי אֲנִ֞י הִכְבַּ֤דְתִּי אֶת לִבּ/וֹ֙ וְ/אֶת לֵ֣ב עֲבָדָ֔י/ו לְמַ֗עַן שִׁתִ֛/י אֹתֹתַ֥/י אֵ֖לֶּה בְּ/קִרְבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/001.yaml
  text: Then Yahweh said to Moses[a], "Go in to Pharaoh, because I have hardened his heart and the heart of his servants[b], so that I may set these signs of mine among them."
translation:
  language: fr
  text: 'Puis Yahweh dit à Moïse : « Va trouver le pharaon, car j’ai endurci son cœur et le cœur de ses serviteurs[a], afin que je place ces signes qui sont les miens en son sein[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « j’ai rendu lourd son cœur et le cœur de ses serviteurs ». Ici, rendre le cœur lourd signifie l’endurcir, le rendre insensible ou réfractaire.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « en son sein ». Le singulier peut désigner le pharaon lui-même ou, plus largement, sa sphère, y compris ses serviteurs et sa cour.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le caractère personnel du tétragramme au lieu de lui substituer un titre.
- source_word: וַיֹּאמֶר
  choice: Puis ... dit
  rationale: Le waw consécutif fait progresser le récit ; « Puis » exprime naturellement cette succession en français.
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: Va trouver le pharaon
  rationale: Dans ce contexte, בוא commande à Moïse de se rendre auprès du pharaon. Cette formulation française est naturelle sans imposer le déictique « viens », ambigu hors de la situation d’énonciation.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le motif de l’ordre donné.
- source_word: הִכְבַּדְתִּי
  choice: j’ai endurci
  rationale: Le hiphil de כבד signifie littéralement « rendre lourd » ; appliqué au cœur, l’idiome désigne le fait de le rendre insensible ou réfractaire. La note conserve l’image hébraïque.
- source_word: לִבּוֹ ... לֵב עֲבָדָיו
  choice: son cœur et le cœur de ses serviteurs
  rationale: « Cœur » conserve l’image hébraïque du centre de la volonté et de la pensée. La répétition évite une paraphrase interprétative.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Le terme peut désigner des serviteurs, des agents ou des hauts fonctionnaires. Le choix large « serviteurs » préserve cette latitude.
- source_word: לְמַעַן
  choice: afin que
  rationale: Cette locution exprime clairement la valeur de but du terme hébreu dans un registre digne.
- source_word: שִׁתִי
  choice: je place
  rationale: Le verbe שׂים signifie mettre, placer ou établir. « Placer » reste proche du texte et convient aux signes manifestés dans la sphère du pharaon.
- source_word: אֹתֹתַי אֵלֶּה
  choice: ces signes qui sont les miens
  rationale: La formulation conserve à la fois le démonstratif et le suffixe possessif accentué, sans réduire l’expression à « mes signes ».
- source_word: בְּקִרְבּוֹ
  choice: au milieu de lui
  rationale: Le texte massorétique porte un suffixe masculin singulier. Cette traduction formelle en préserve la référence potentiellement ambiguë ; une note explicite que le domaine visé peut inclure la cour du pharaon.
theological_decisions:
- issue: L’endurcissement du cœur du pharaon par Dieu
  choice: j’ai endurci son cœur
  alternative: j’ai rendu son cœur lourd
  rationale: Le texte attribue directement l’action à Yahweh. La traduction ne l’atténue pas et ne tranche pas la tension entre souveraineté divine et responsabilité humaine ; le sens littéral de l’idiome est signalé en note.
- issue: Référent singulier de בְּקִרְבּוֹ
  choice: au milieu de lui
  alternative: parmi eux
  rationale: Le suffixe hébreu est singulier et peut viser le pharaon, tandis que la mention immédiate de ses serviteurs permet de comprendre plus largement son entourage ou sa cour. Le texte principal préserve la forme singulière et la note maintient l’ambiguïté contextuelle.
translation_notes:
  register: Français international moderne, naturel et digne. L’article devant « pharaon » correspond à l’usage français courant du titre. La traduction conserve le nom divin « Yahweh », l’attribution directe de l’endurcissement à Dieu et le singulier ambigu de la dernière expression.
