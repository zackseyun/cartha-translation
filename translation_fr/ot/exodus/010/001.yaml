  to: 'Puis Yahweh dit à Moïse : « Va trouver le pharaon, car j’ai endurci son cœur et le cœur de ses serviteurs[a], afin que je place ces signes qui sont les miens en son sein[b]. »'
  rationale: La seule correction nécessaire remplace le calque français peu idiomatique « au milieu de lui » par « en son sein ». Cette solution conserve le suffixe singulier hébreu et l’ambiguïté signalée en note, sans réduire le référent aux seuls serviteurs ni trancher entre le pharaon et son entourage.
