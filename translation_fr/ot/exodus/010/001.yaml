  source_fidelity: 'Le sens fondamental est fidèlement rendu : Yahweh ordonne à Moïse d’aller auprès du pharaon et attribue explicitement l’endurcissement du cœur du pharaon et de ses serviteurs à son action. La valeur finale de לְמַעַן est bien conservée. Le suffixe singulier de בְּקִרְבּוֹ doit rester perceptible sans produire une formulation française fautive ou artificielle.'
  naturalness: « Au milieu de lui » n’est pas idiomatique en français moderne dans ce contexte et peut suggérer une localisation physique incohérente. « En son sein » rend naturellement l’expression tout en maintenant un référent singulier qui peut désigner le pharaon ou sa sphère royale. Le reste du registre est naturel et digne.
  terminology: « Yahweh », « Moïse », « pharaon », « cœur », « serviteurs » et « endurci » sont cohérents avec le texte hébreu et avec un français international moderne. « Ces signes qui sont les miens » conserve avec justesse l’emphase du démonstratif accompagné du possessif, même si la tournure est légèrement soutenue.
