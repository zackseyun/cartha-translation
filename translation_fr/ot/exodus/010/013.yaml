  to: Moïse étendit son bâton au-dessus du pays d’Égypte, et Yahvé fit souffler sur le pays un vent d’est[a] pendant toute cette journée et toute la nuit. Au matin, le vent d’est avait apporté les sauterelles.
  rationale: 'Suppression du seul ajout interprétatif non requis, « donc ». Le reste est conservé : il est fidèle au texte hébreu, naturel en français international moderne et respecte l’ambiguïté lexicale de רוּחַ קָדִים au moyen de la note.'
