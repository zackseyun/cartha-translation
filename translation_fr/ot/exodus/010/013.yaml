  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת מַטֵּ/הוּ֮ עַל אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יהוָ֗ה נִהַ֤ג ר֥וּחַ קָדִים֙ בָּ/אָ֔רֶץ כָּל הַ/יּ֥וֹם הַ/ה֖וּא וְ/כָל הַ/לָּ֑יְלָה הַ/בֹּ֣קֶר הָיָ֔ה וְ/ר֨וּחַ֙ הַ/קָּדִ֔ים נָשָׂ֖א אֶת הָ/אַרְבֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/013.yaml
  text: So Moses stretched out his staff over the land of Egypt[a], and Yahweh drove an east wind over the land all that day and all the night. When morning came, the east wind had brought the locusts.
translation:
  language: fr
  text: Moïse étendit son bâton au-dessus du pays d’Égypte, et Yahvé fit souffler sur le pays un vent d’est[a] pendant toute cette journée et toute la nuit. Au matin, le vent d’est avait apporté les sauterelles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un vent venant de l’est ».'
    reason: Alternative lexicale explicitant la direction indiquée par רוּחַ קָדִים.
lexical_decisions:
- source_word: וַיֵּט
  choice: étendit
  rationale: Le verbe נטה signifie ici « étendre » ou « tendre ». « Étendit » convient au geste accompli avec le bâton et reprend naturellement la formule narrative des plaies.
- source_word: מַטֵּהוּ
  choice: son bâton
  rationale: מַטֶּה désigne un bâton ou une verge. « Bâton » est clair en français moderne et correspond à l’instrument employé par Moïse dans le récit.
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: au-dessus du pays d’Égypte
  rationale: Avec le geste du bâton, עַל exprime naturellement une extension au-dessus du territoire. « Pays d’Égypte » rend le sens géographique de אֶרֶץ.
- source_word: נִהַג
  choice: fit souffler
  rationale: נהג peut signifier conduire ou pousser. Appliqué au vent, « fit souffler » exprime naturellement en français l’action par laquelle Yahvé dirige le vent sur le pays, sans suggérer un mouvement mécanique peu idiomatique.
- source_word: רוּחַ קָדִים
  choice: un vent d’est
  rationale: L’expression désigne un vent venant de l’est. « Vent d’est » est la tournure française concise et courante; « vent venant de l’est » demeure possible.
- source_word: בָּאָרֶץ
  choice: sur le pays
  rationale: Dans le contexte du déplacement du vent à travers l’Égypte, « sur le pays » rend clairement sa portée territoriale.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלָּיְלָה
  choice: pendant toute cette journée et toute la nuit
  rationale: La formulation conserve la répétition emphatique de כָּל tout en restant naturelle en français. « Cette journée » renvoie au jour précis du récit.
- source_word: הַבֹּקֶר הָיָה
  choice: Au matin
  rationale: Littéralement, la proposition marque l’arrivée du matin. « Au matin » transmet avec concision et naturel cette transition temporelle.
- source_word: נָשָׂא אֶת הָאַרְבֶּה
  choice: avait apporté les sauterelles
  rationale: נשא décrit le vent qui porte et amène l’invasion. Le plus-que-parfait indique naturellement qu’au matin le transport des sauterelles avait déjà eu lieu.
- source_word: הָאַרְבֶּה
  choice: les sauterelles
  rationale: Le singulier hébreu a ici une valeur collective. Le pluriel français « les sauterelles » exprime naturellement la nuée d’insectes et correspond au vocabulaire biblique français courant.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahvé » conserve le nom propre de l’alliance dans sa forme française courante, plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide pour un large lectorat, tout en conservant la durée emphatique du vent, le nom divin et la relation temporelle entre la nuit et l’arrivée des sauterelles.
