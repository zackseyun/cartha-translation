  yaml_path: translation/ot/exodus/010/004.yaml
  text: For if you refuse to let my people go[a], behold[b], tomorrow I will bring locusts into your territory.
translation:
  language: fr
  text: Car si tu refuses de laisser partir mon peuple, voici que demain je ferai venir des sauterelles[a] dans ton territoire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu אַרְבֶּה est singulier dans sa forme, mais il est employé ici collectivement ; d’où le pluriel « sauterelles ».
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « dans tes frontières ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Car si
  rationale: 'Cette tournure introduit une menace conditionnelle fondée sur les paroles précédentes : « car » conserve la valeur explicative ou continuative de כִּי, et « si » la valeur conditionnelle de אִם.'
- source_word: מָאֵן
  choice: refuses
  rationale: Le verbe exprime un refus volontaire et obstiné, plutôt qu’une simple hésitation ou incapacité.
- source_word: לְשַׁלֵּחַ
  choice: de laisser partir
  rationale: Dans le contexte de l’Exode, cette formulation rend naturellement l’idée de permettre au peuple de s’en aller, sans durcir le sens en « libérer » ni reproduire servilement « renvoyer ».
- source_word: עַמִּי
  choice: mon peuple
  rationale: Expression directe qui préserve le possessif et sa portée relationnelle dans le récit.
- source_word: הִנְנִי
  choice: voici que
  rationale: Cette formule française actuelle mais digne marque l’insistance solennelle et l’imminence de l’intervention annoncée.
- source_word: מֵבִיא
  choice: je ferai venir
  rationale: Avec הִנְנִי, le participe exprime une action imminente. Le futur français, renforcé par « voici que » et « demain », rend clairement cette menace.
- source_word: מָחָר
  choice: demain
  rationale: Équivalent temporel direct.
- source_word: אַרְבֶּה
  choice: des sauterelles
  rationale: Bien que singulier dans sa forme, le nom hébreu a ici une valeur collective. Le pluriel français convient naturellement à l’invasion annoncée.
- source_word: בִּגְבֻלֶךָ
  choice: sur ton territoire
  rationale: גְּבוּל peut désigner une frontière ou le territoire qu’elle délimite. Avec le verbe de mouvement, « sur ton territoire » exprime naturellement l’entrée des sauterelles dans le domaine du pharaon.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Voici que » maintient la solennité de l’avertissement sans recourir à l’archaïsme « voici, je… ». Le tutoiement correspond à l’adresse directe au pharaon et conserve le nombre singulier de l’hébreu.
