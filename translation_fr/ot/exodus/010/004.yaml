  text: כִּ֛י אִם מָאֵ֥ן אַתָּ֖ה לְ/שַׁלֵּ֣חַ אֶת עַמִּ֑/י הִנְ/נִ֨י מֵבִ֥יא מָחָ֛ר אַרְבֶּ֖ה בִּ/גְבֻלֶֽ/ךָ־־׃
base_translation:
