  text: וַ/יַּהֲפֹ֨ךְ יְהוָ֤ה רֽוּחַ יָם֙ חָזָ֣ק מְאֹ֔ד וַ/יִּשָּׂא֙ אֶת הָ֣/אַרְבֶּ֔ה וַ/יִּתְקָעֵ֖/הוּ יָ֣מָּ/ה סּ֑וּף לֹ֤א נִשְׁאַר֙ אַרְבֶּ֣ה אֶחָ֔ד בְּ/כֹ֖ל גְּב֥וּל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/019.yaml
  text: And Yahweh turned a very strong west wind[a], and it carried away the locusts and drove them into the Sea of Reeds[b]. Not one locust remained in all the territory of Egypt.
translation:
  language: fr
  text: 'Alors Yahweh fit tourner un vent très violent venant de la mer[a] : il emporta les criquets et les poussa dans la mer des Roseaux[b]. Il ne resta pas un seul criquet sur tout le territoire de l’Égypte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un vent de la mer ». Dans ce contexte géographique, il s’agit vraisemblablement d’un vent d’ouest, venant de la Méditerranée.'
    reason: Précision lexicale et géographique sur רוּחַ יָם.
  - marker: b
    text: 'Traditionnellement : « mer Rouge ». Le nom hébreu est Yam Souf, généralement compris comme « mer des Roseaux ».'
    reason: Signalement de l’appellation traditionnelle et de la forme du toponyme hébreu.
lexical_decisions:
- source_word: וַיַּהֲפֹךְ יְהוָה רוּחַ יָם חָזָק מְאֹד
  choice: Yahweh fit tourner le vent et souffler de la mer un vent très violent
  rationale: La tournure rend le causatif contextuel de « fit tourner/changea » et conserve l’image littérale de רוּחַ יָם, « vent de la mer », tout en produisant une phrase française compréhensible. « Très violent » convient mieux que « très fort » à un vent.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin, qui préserve le nom personnel présent dans l’hébreu au lieu de lui substituer un titre.
- source_word: וַיִּשָּׂא אֶת־הָאַרְבֶּה
  choice: il emporta les criquets
  rationale: נשא décrit ici le vent qui soulève et emporte la nuée de criquets. « Criquets » est le terme français naturel pour les insectes migrateurs du fléau.
- source_word: וַיִּתְקָעֵהוּ
  choice: les précipita
  rationale: תקע exprime une poussée énergique. Le suffixe hébreu singulier reprend collectivement אַרְבֶּה, tandis que le français emploie naturellement le pluriel.
- source_word: יָמָּה סּוּף
  choice: dans la mer des Roseaux
  rationale: La construction directionnelle signifie « vers/dans la mer de Souf ». « Mer des Roseaux » rend le sens généralement reconnu du toponyme sans reprendre d’emblée l’appellation traditionnelle « mer Rouge ».
- source_word: לֹא נִשְׁאַר אַרְבֶּה אֶחָד
  choice: Il ne resta pas un seul criquet
  rationale: Cette formulation française conserve l’insistance de אֶחָד, « un seul ».
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: sur tout le territoire de l’Égypte
  rationale: גְּבוּל désigne ici l’étendue territoriale et non seulement la frontière.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom propre divin. Le conserver évite de remplacer silencieusement ce nom par un titre.
- issue: Identification de יָם סוּף
  choice: mer des Roseaux
  alternative: mer Rouge
  rationale: Le choix principal suit la forme hébraïque et laisse ouverte la question de l’identification géographique exacte; l’appellation traditionnelle est signalée en note.
- issue: Sens directionnel de רוּחַ יָם
  choice: un vent soufflant de la mer
  alternative: un vent d’ouest
  rationale: Dans le cadre égyptien, la mer désigne vraisemblablement la Méditerranée, donc l’ouest, mais le texte dit littéralement « vent de la mer ». La traduction conserve cette image et la note fournit l’équivalence géographique probable.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme narratif est resserré par les deux-points. « Criquets » est préféré à « sauterelles » pour la précision zoologique et le contexte de pullulation. Les marqueurs [a] et [b] figurent dans le texte à l’endroit exact où portent les notes.
