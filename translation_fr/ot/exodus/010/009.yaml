  text: Moses said, “We will go with our young and our old; we will go with our sons and our daughters, with our flocks and our herds, because we must hold a feast to the LORD.”
translation:
  language: fr
  text: 'Moïse répondit : « Nous irons avec nos jeunes et nos anciens, avec nos fils et nos filles ; nous irons avec notre petit et notre gros bétail, car nous célébrerons une fête en l’honneur de l’Éternel. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְעָרֵינוּ וּבִזְקֵנֵינוּ
  choice: avec nos jeunes et nos anciens
  rationale: Reproduit les deux catégories d’âge et leur contraste, tout en restant naturel en français moderne.
- source_word: בְּצֹאנֵנוּ וּבִבְקָרֵנוּ
  choice: avec notre petit et notre gros bétail
  rationale: Distingue les ovins-caprins du bétail bovin de façon précise et idiomatique.
- source_word: חַג
  choice: une fête
  rationale: Le nom désigne ici une célébration cultuelle, sans qu’il soit nécessaire d’ajouter une idée absente du texte.
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Suit la convention française courante pour représenter le tétragramme dans le corps du texte.
theological_decisions:
- issue: Valeur de כִּי חַג יְהוָה לָנוּ
  choice: car nous célébrerons une fête en l’honneur de l’Éternel
  alternative: car nous devons célébrer une fête pour l’Éternel
  rationale: L’hébreu exprime littéralement qu’une fête de YHWH est « pour nous », mais ne contient pas explicitement un verbe d’obligation. La formulation retenue communique le motif du départ sans renforcer cette obligation.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La répétition de « nous irons » est conservée pour respecter l’insistance du texte hébreu.
