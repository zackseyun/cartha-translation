source:
  edition: WLC
  text: וַ/יְכַ֞ס אֶת עֵ֣ין כָּל הָ/אָרֶץ֮ וַ/תֶּחְשַׁ֣ךְ הָ/אָרֶץ֒ וַ/יֹּ֜אכַל אֶת כָּל עֵ֣שֶׂב הָ/אָ֗רֶץ וְ/אֵת֙ כָּל פְּרִ֣י הָ/עֵ֔ץ אֲשֶׁ֥ר הוֹתִ֖יר הַ/בָּרָ֑ד וְ/לֹא נוֹתַ֨ר כָּל יֶ֧רֶק בָּ/עֵ֛ץ וּ/בְ/עֵ֥שֶׂב הַ/שָּׂדֶ֖ה בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/015.yaml
  text: And it covered the face of the whole land[a], so that the land was darkened; and it ate every plant of the land and all the fruit of the trees that the hail had left. No green thing remained on the trees or on the plants of the field in all the land of Egypt.
translation:
  language: fr
  text: Les sauterelles couvrirent toute la surface du pays[a], et le pays s’obscurcit. Elles dévorèrent toute la végétation du pays et tous les fruits des arbres que la grêle avait laissés. Il ne resta rien de vert sur les arbres ni dans la végétation des champs, dans tout le pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « l’œil de tout le pays », expression qui désigne sa surface visible.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַס
  choice: Les sauterelles couvrirent
  rationale: Le verbe hébreu est au singulier avec הָאַרְבֶּה, nom collectif désignant les sauterelles dans le contexte immédiat. Le pluriel explicite est naturel en français et conserve la référence collective.
- source_word: עֵין כָּל הָאָרֶץ
  choice: toute la surface du pays
  rationale: Littéralement « l’œil de tout le pays », cette expression désigne sa surface visible. « Toute la surface du pays » rend clairement l’idiome sans conserver une image obscure en français.
- source_word: וַתֶּחְשַׁךְ הָאָרֶץ
  choice: et le pays s’obscurcit
  rationale: Le verbe exprime le fait de devenir sombre. La tournure pronominale respecte cette valeur sans expliciter un lien causal au-delà de la coordination hébraïque.
- source_word: וַיֹּאכַל
  choice: Elles dévorèrent
  rationale: Le verbe signifie littéralement « manger ». Dans le contexte d’une destruction totale par les sauterelles, « dévorèrent » est idiomatique en français et n’ajoute pas d’idée étrangère au texte.
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: toute la végétation du pays
  rationale: עֵשֶׂב couvre ici les plantes et la végétation en général, et non seulement l’herbe. « Végétation » exprime naturellement cette portée collective.
- source_word: כָּל פְּרִי הָעֵץ
  choice: tous les fruits des arbres
  rationale: Le singulier hébreu עֵץ a une valeur collective; le pluriel français rend naturellement le sens distributif.
- source_word: אֲשֶׁר הוֹתִיר הַבָּרָד
  choice: que la grêle avait laissés
  rationale: Le plus-que-parfait situe correctement ce reste après le fléau antérieur de la grêle, tout en gardant le sens simple de הוֹתִיר.
- source_word: וְלֹא נוֹתַר כָּל יֶרֶק
  choice: Il ne resta rien de vert
  rationale: Cette formulation française naturelle conserve la négation absolue et la portée large de יֶרֶק, qui désigne ce qui est vert ou la verdure.
- source_word: בָּעֵץ וּבְעֵשֶׂב הַשָּׂדֶה
  choice: sur les arbres ni parmi les plantes des champs
  rationale: 'Les prépositions sont rendues selon l’usage français propre à chaque milieu : ce qui demeure sur les arbres et parmi les plantes cultivées ou sauvages des champs.'
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: dans tout le pays d’Égypte
  rationale: Rendu territorial courant, fidèle à l’étendue totale affirmée par le texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le pluriel « les sauterelles » explicite en français le référent collectif singulier du contexte hébreu. La coordination « et » préserve la succession du texte sans imposer une relation causale explicite.
