revisions:
- from: Elles rempliront tes maisons, les maisons de tous tes serviteurs et les maisons de toute l’Égypte. Tes ancêtres, ni les ancêtres de tes ancêtres, n’auront jamais rien vu de pareil depuis le jour où ils ont été sur la terre jusqu’à aujourd’hui.» Puis Moïse se détourna et sortit de chez le pharaon.
  to: Elles rempliront tes maisons, les maisons de tous tes serviteurs et les maisons de toute l’Égypte, comme tes pères et les pères de tes pères n’en ont jamais vu depuis qu’ils sont sur la terre jusqu’à ce jour. » Puis Moïse se détourna et sortit de la présence du pharaon.
  rationale: Correction nécessaire de la syntaxe négative. La comparaison implicite est conservée par « n’en ont jamais vu », dont l’antécédent est l’invasion de sauterelles annoncée dans le contexte immédiat. « Depuis qu’ils sont sur la terre jusqu’à ce jour » maintient la portée temporelle inclusive de l’hébreu sans trancher entre « terre », « sol » et « pays ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:12:33Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèle, y compris le sujet implicite (« les sauterelles ») et la gradation des maisons. Toutefois, la coordination négative « Tes ancêtres, ni les ancêtres… » est fautive en français et altère la syntaxe de la relative hébraïque. La formule temporelle est rendue plus naturellement sans restreindre indûment le sens.
  naturalness: La révision corrige la construction française, allège une répétition peu idiomatique et remplace « sortir de chez le pharaon », qui évoque une résidence privée, par une formulation adaptée à une scène d’audience royale.
  terminology: « Serviteurs », « pères » et « pharaon » conviennent au registre narratif et au contexte de cour. « Pères » conserve ici l’expression générationnelle sans imposer une interprétation plus étendue par « ancêtres ».
  issues:
  - severity: medium
    issue: 'Construction négative incorrecte : « Tes ancêtres, ni les ancêtres de tes ancêtres, n’auront… »'
    rationale: En français, « ni » requiert normalement une négation portée par le verbe ou une structure « ni… ni… ». Le texte hébreu coordonne positivement « tes pères et les pères de tes pères » sous la négation de « n’ont pas vu ».
  - severity: low
    issue: « Sortit de chez le pharaon »
    rationale: La formule est possible, mais « chez » suggère plus spontanément un domicile. « Sortit de la présence du pharaon » rend clairement le départ de l’audience tout en conservant la nuance de מֵעִם.
  revised_text: Elles rempliront tes maisons, les maisons de tous tes serviteurs et les maisons de toute l’Égypte, comme tes pères et les pères de tes pères n’en ont jamais vu depuis qu’ils sont sur la terre jusqu’à ce jour. » Puis Moïse se détourna et sortit de la présence du pharaon.
  revised_footnotes: []
  revision_rationale: Correction nécessaire de la syntaxe négative. La comparaison implicite est conservée par « n’en ont jamais vu », dont l’antécédent est l’invasion de sauterelles annoncée dans le contexte immédiat. « Depuis qu’ils sont sur la terre jusqu’à ce jour » maintient la portée temporelle inclusive de l’hébreu sans trancher entre « terre », « sol » et « pays ».
