  text: וּ/מָלְא֨וּ בָתֶּ֜י/ךָ וּ/בָתֵּ֣י כָל עֲבָדֶי/ךָ֮ וּ/בָתֵּ֣י כָל מִצְרַיִם֒ אֲשֶׁ֨ר לֹֽא רָא֤וּ אֲבֹתֶ֨י/ךָ֙ וַ/אֲב֣וֹת אֲבֹתֶ֔י/ךָ מִ/יּ֗וֹם הֱיוֹתָ/ם֙ עַל הָ֣/אֲדָמָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יִּ֥פֶן וַ/יֵּצֵ֖א מֵ/עִ֥ם פַּרְעֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/006.yaml
  text: And they will fill your houses[a], the houses of all your servants[b], and the houses of all Egypt—something your fathers and your fathers’ fathers have not seen from the day they were on the land until this day.” Then he turned and went out from Pharaoh.
translation:
  language: fr
  text: Elles rempliront tes maisons, les maisons de tous tes serviteurs et les maisons de toute l’Égypte, comme tes pères et les pères de tes pères n’en ont jamais vu depuis qu’ils sont sur la terre jusqu’à ce jour. » Puis Moïse se détourna et sortit de la présence du pharaon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמָלְאוּ
  choice: Elles rempliront
  rationale: Le parfait qal avec waw poursuit ici l’annonce future de la plaie; le sujet implicite, repris du contexte, est «les sauterelles», féminin pluriel en français.
- source_word: בָתֶּיךָ ... וּבָתֵּי כָל עֲבָדֶיךָ ... וּבָתֵּי כָל מִצְרַיִם
  choice: tes maisons, les maisons de tous tes serviteurs et les maisons de toute l’Égypte
  rationale: La répétition de «maisons» conserve la structure hébraïque et l’élargissement progressif du fléau, du pharaon à ses serviteurs puis à toute l’Égypte.
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Dans le contexte de la cour royale, le terme peut désigner les serviteurs ou dignitaires du pharaon. «Serviteurs» reste proche de l’hébreu sans préciser indûment leur statut.
- source_word: אֲשֶׁר לֹא רָאוּ
  choice: n’auront jamais rien vu de pareil
  rationale: La proposition relative qualifie le caractère sans précédent de la plaie annoncée. Cette formulation française naturelle explicite la comparaison implicite sans modifier le sens.
- source_word: אֲבֹתֶיךָ וַאֲבֹת אֲבֹתֶיךָ
  choice: tes ancêtres, ni les ancêtres de tes ancêtres
  rationale: «Ancêtres» exprime mieux que «pères» l’ensemble des générations antérieures; la répétition conserve l’expression générationnelle et solennelle de l’hébreu.
- source_word: מִיּוֹם הֱיוֹתָם עַל הָאֲדָמָה
  choice: depuis le jour où ils ont été sur la terre
  rationale: La formulation garde la valeur temporelle de l’infinitif de היה et rend על־האדמה comme une désignation générale de l’existence humaine sur la terre.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à aujourd’hui
  rationale: Équivalent moderne et naturel de l’expression temporelle hébraïque.
- source_word: וַיִּפֶן וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: Puis Moïse se détourna et sortit de chez le pharaon
  rationale: Le sujet est implicitement Moïse dans le contexte; le nom est rétabli pour éviter l’ambiguïté française. «Se détourna» conserve le premier verbe, et «sortit de chez le pharaon» rend naturellement מֵעִם dans cette scène d’audience.
