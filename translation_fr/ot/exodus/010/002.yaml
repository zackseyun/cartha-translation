  text: וּ/לְמַ֡עַן תְּסַפֵּר֩ בְּ/אָזְנֵ֨י בִנְ/ךָ֜ וּ/בֶן בִּנְ/ךָ֗ אֵ֣ת אֲשֶׁ֤ר הִתְעַלַּ֨לְתִּי֙ בְּ/מִצְרַ֔יִם וְ/אֶת אֹתֹתַ֖/י אֲשֶׁר שַׂ֣מְתִּי בָ֑/ם וִֽ/ידַעְתֶּ֖ם כִּי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/002.yaml
  text: so that you may tell in the hearing of your son and of your grandson how I dealt harshly with Egypt[a], and my signs that I placed among them[b], and so that you may know that I am Yahweh.
translation:
  language: fr
  text: afin que tu racontes à ton fils et à ton petit-fils comment j’ai traité durement l’Égypte[a], et quels signes j’ai placés parmi eux, et afin que vous sachiez que je suis Yahvé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « comment je me suis joué de l’Égypte ». Le verbe hébreu peut souligner l’humiliation infligée à l’Égypte aussi bien que la dureté avec laquelle elle a été traitée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « et vous saurez que je suis Yahvé ». La dernière proposition peut exprimer soit le but, soit le résultat.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְמַעַן
  choice: afin que
  rationale: Introduit le but des actes annoncés dans le contexte précédent et régit naturellement les deux propositions de finalité.
- source_word: תְּסַפֵּר
  choice: tu racontes
  rationale: Le piel de ספר désigne ici le récit transmis aux générations suivantes; « raconter » convient mieux que le plus général « dire ».
- source_word: בְּאָזְנֵי
  choice: à
  rationale: Littéralement « aux oreilles de »; le français courant exprime naturellement cet idiome par le complément indirect, sans perte de l’idée de transmission orale.
- source_word: בִנְךָ וּבֶן בִנְךָ
  choice: ton fils et ton petit-fils
  rationale: Rend naturellement l’expression littérale « ton fils et le fils de ton fils » tout en maintenant la succession des générations.
- source_word: הִתְעַלַּלְתִּי
  choice: j’ai traité durement
  rationale: Dans le contexte des plaies, le verbe évoque une action sévère comportant aussi une dimension d’humiliation. Le texte principal privilégie la sévérité concrète; la nuance de dérision est conservée en note.
- source_word: בְּמִצְרַיִם
  choice: l’Égypte
  rationale: Avec « traiter durement », l’Égypte devient en français le complément direct; le nom peut désigner collectivement le pays et son peuple.
- source_word: אֹתֹתַי
  choice: les signes
  rationale: Rend directement אֹתֹת sans ajouter explicitement « miraculeux », qualification implicite dans le contexte mais absente du nom lui-même.
- source_word: שַׂמְתִּי בָם
  choice: j’ai accomplis au milieu d’eux
  rationale: שׂים signifie littéralement « placer » ou « établir », mais avec des signes le français idiomatique emploie « accomplir ». « Au milieu d’eux » conserve la préposition et le suffixe masculin pluriel, probablement référé aux Égyptiens.
- source_word: וִידַעְתֶּם
  choice: et afin que vous sachiez
  rationale: Le pluriel hébreu est explicitement conservé après le singulier « tu racontes ». La reprise de « afin que » fait entendre la finalité continue, tandis que la valeur consécutive possible est signalée en note.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française courante du nom divin, qui le rend comme nom propre plutôt que de le remplacer par le titre « le Seigneur ».
theological_decisions:
- issue: Sens de הִתְעַלַּלְתִּי à propos de l’Égypte
  choice: comment j’ai traité durement l’Égypte
  alternative: comment je me suis joué de l’Égypte
  rationale: Les plaies sont à la fois un jugement sévère et une humiliation de l’Égypte. Le texte principal exprime nettement la sévérité des actes sans réduire le verbe à une simple moquerie; l’autre nuance, lexicalement réelle, demeure en note.
- issue: Valeur de וִידַעְתֶּם
  choice: et afin que vous sachiez
  alternative: et vous saurez
  rationale: La proposition peut prolonger le but introduit par לְמַעַן ou exprimer le résultat à venir. La lecture finale s’accorde bien avec la syntaxe d’ensemble, mais la lecture consécutive reste possible.
- issue: Alternance du singulier et du pluriel
  choice: tu racontes… vous sachiez
  alternative: uniformiser les pronoms en français
  rationale: 'Le changement de nombre appartient au texte hébreu: l’individu doit transmettre le récit, tandis que la connaissance de Yahvé concerne la communauté. Le conserver évite de résoudre implicitement cette tension.'
translation_notes:
  register: Français international moderne, naturel et digne. « À ton fils et à ton petit-fils » transpose l’idiome hébreu « aux oreilles de » sans tournure artificiellement archaïque. L’alternance volontaire entre « tu » et « vous » reproduit les nombres grammaticaux du texte source.
