revisions:
- from: afin que tu racontes à ton fils et à ton petit-fils comment j’ai traité durement l’Égypte[a], ainsi que les signes que j’ai accomplis au milieu d’eux, et afin que vous sachiez que je suis Yahvé[b].
  to: afin que tu racontes à ton fils et à ton petit-fils comment j’ai traité durement l’Égypte[a], et quels signes j’ai placés parmi eux, et afin que vous sachiez que je suis Yahvé[b].
  rationale: La révision corrige une difficulté de syntaxe française sans modifier le sens. « Et quels signes » forme avec « comment j’ai traité durement l’Égypte » une double interrogation indirecte dépendant de « racontes », correspondant aux deux compléments coordonnés en hébreu. « Placés parmi eux » maintient l’image verbale de שׂים et la référence aux Égyptiens. L’alternance « tu / vous », présente dans l’hébreu, est conservée.
  reviewer_model: gpt-5.6-terra
