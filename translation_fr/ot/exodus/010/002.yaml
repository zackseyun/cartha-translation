  source_fidelity: 'Le sens général est fidèle au texte hébreu : la finalité, la transmission intergénérationnelle, la sévérité des actes envers l’Égypte, les signes, le nom Yahvé et l’alternance singulier/pluriel sont tous conservés. « Au milieu d’eux » est possible pour בָם, mais « parmi eux » rend plus directement le suffixe renvoyant aux Égyptiens. Le verbe שַׂמְתִּי signifie littéralement « j’ai placés / établis » ; cette formulation peut être préservée en français sans sacrifier la lisibilité.'
  naturalness: 'La coordination actuelle (« comment j’ai traité durement l’Égypte, ainsi que les signes… ») est syntaxiquement mal ajustée : « comment » introduit une proposition tandis que « ainsi que les signes » ajoute un groupe nominal sans construction parallèle nette. Employer « et quels signes » rend la phrase naturelle et reproduit clairement les deux objets de « raconter ».'
  terminology: « Yahvé » est la forme française usuelle et appropriée pour יהוה. « Signes » rend correctement אֹתֹתַי. « Traité durement » est un choix défendable pour הִתְעַלַּלְתִּי, dont la nuance d’humiliation est justement maintenue en note, sans imposer une interprétation doctrinale.
