    rationale: Dans « raconter ... comment j’ai traité durement l’Égypte, ainsi que les signes... », « ainsi que » ne coordonne pas naturellement la proposition introduite par « comment » avec le syntagme nominal « les signes ». « Et quels signes » restitue clairement la seconde composante de l’objet hébreu.
  - severity: low
    issue: Rendu de בָם
    rationale: « Parmi eux » est plus direct que « au milieu d’eux » pour le pronom pluriel renvoyant vraisemblablement aux Égyptiens et reste naturel dans ce contexte.
