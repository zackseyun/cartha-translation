revisions:
- from: Même notre bétail viendra avec nous ; il ne restera pas un seul sabot, car nous en prendrons pour servir[a] Yahweh, notre Dieu. Et nous ne savons pas avec quoi nous servirons Yahweh avant d’être arrivés là-bas.
  to: Même notre bétail ira avec nous ; pas un seul sabot ne restera, car nous en prendrons pour servir[a] Yahweh, notre Dieu. Et nous ne savons pas avec quoi nous servirons Yahweh jusqu’à ce que nous arrivions là-bas.
  rationale: La révision remplace « viendra » par « ira » afin de suivre le verbe de mouvement hébreu, et rend עַד par « jusqu’à ce que » afin de conserver clairement la limite temporelle. Elle maintient l’objet implicite de « nous en prendrons », comme dans l’hébreu, ainsi que la répétition de « servir ».
