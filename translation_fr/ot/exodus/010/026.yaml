  text: וְ/גַם מִקְנֵ֜/נוּ יֵלֵ֣ךְ עִמָּ֗/נוּ לֹ֤א תִשָּׁאֵר֙ פַּרְסָ֔ה כִּ֚י מִמֶּ֣/נּוּ נִקַּ֔ח לַ/עֲבֹ֖ד אֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ וַ/אֲנַ֣חְנוּ לֹֽא נֵדַ֗ע מַֽה נַּעֲבֹד֙ אֶת יְהוָ֔ה עַד בֹּאֵ֖/נוּ שָֽׁמָּ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/026.yaml
  text: And even our livestock will go with us; not a hoof will be left behind[a], for from them we must take to serve Yahweh our God, and we do not know with what we must serve Yahweh until we arrive there.
translation:
  language: fr
  text: Même notre bétail ira avec nous ; pas un seul sabot ne restera, car nous en prendrons pour servir[a] Yahweh, notre Dieu. Et nous ne savons pas avec quoi nous servirons Yahweh jusqu’à ce que nous arrivions là-bas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « rendre un culte à Yahweh, notre Dieu » ; de même ensuite : « avec quoi rendre un culte à Yahweh ». Le verbe hébreu peut signifier « servir » ou, dans ce contexte, « rendre un culte ».'
    reason: Alternative lexicale permettant de conserver l’étendue sémantique de עבד.
lexical_decisions:
- source_word: מִקְנֵנוּ
  choice: notre bétail
  rationale: Le nom collectif מִקְנֶה désigne l’ensemble des animaux domestiques possédés. « Bétail » conserve ce sens collectif et large.
- source_word: יֵלֵךְ עִמָּנוּ
  choice: viendra avec nous
  rationale: En français, dans ce déplacement vers une destination évoquée, « viendra avec nous » exprime naturellement le mouvement accompagné.
- source_word: לֹא תִשָּׁאֵר פַּרְסָה
  choice: il ne restera pas un seul sabot
  rationale: פַּרְסָה signifie littéralement « sabot ». L’ajout idiomatique de « un seul » restitue l’emphase de la négation hébraïque.
- source_word: כִּי מִמֶּנּוּ נִקַּח
  choice: car nous en prendrons
  rationale: Le texte dit littéralement que les Israélites prendront « de lui/d’eux », c’est-à-dire du bétail. Le pronom « en » garde l’objet implicite sans ajouter « ce dont nous avons besoin ».
- source_word: לַעֲבֹד אֶת יְהוָה אֱלֹהֵינוּ
  choice: pour servir Yahweh, notre Dieu
  rationale: עבד peut signifier « servir » ou, dans ce contexte cultuel, « rendre un culte ». « Servir » conserve la portée plus large du terme et sa répétition dans le verset.
- source_word: וַאֲנַחְנוּ לֹא נֵדַע
  choice: Et nous ne savons pas
  rationale: L’imparfait hébreu exprime ici l’absence actuelle de connaissance, rendue naturellement par le présent français.
- source_word: מַה נַּעֲבֹד אֶת יְהוָה
  choice: avec quoi nous servirons Yahweh
  rationale: 'Dans le contexte des animaux à emmener, מַה a vraisemblablement une valeur instrumentale : Moïse ignore encore quels éléments seront requis. « Avec quoi » préserve cette nuance concrète.'
- source_word: עַד בֹּאֵנוּ שָׁמָּה
  choice: avant d’être arrivés là-bas
  rationale: Cette formulation française exprime clairement que la connaissance ne sera acquise qu’à l’arrivée, tout en évitant la tournure peu naturelle « jusqu’à ce que nous arrivions là-bas » après une négation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme conserve le nom divin personnel au lieu de lui substituer un titre.
theological_decisions:
- issue: Sens de עבד dans un contexte sacrificiel
  choice: servir Yahweh
  alternative: rendre un culte à Yahweh
  rationale: Le contexte inclut manifestement le culte et les sacrifices, mais « servir » préserve à la fois la répétition hébraïque et la portée covenantale plus large du verbe, sans le limiter à l’activité liturgique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve l’insistance de « pas un seul sabot » ainsi que la répétition de « servir Yahweh », tout en gardant implicite l’objet de « nous en prendrons », comme en hébreu.
