  text: וַ/יָּבֹ֨א מֹשֶׁ֣ה וְ/אַהֲרֹן֮ אֶל פַּרְעֹה֒ וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים עַד מָתַ֣י מֵאַ֔נְתָּ לֵ/עָנֹ֖ת מִ/פָּנָ֑/י שַׁלַּ֥ח עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/003.yaml
  text: 'So Moses and Aaron went in to Pharaoh and said to him[a], “Thus says Yahweh, the God of the Hebrews: How long will you refuse to humble yourself before me? Let my people go[b], so that they may serve me.”'
translation:
  language: fr
  text: 'Moïse et Aaron allèrent donc trouver le pharaon et lui dirent : « Voici ce que dit Yahweh, le Dieu des Hébreux : Jusqu’à quand refuseras-tu de t’humilier devant moi[a] ? Laisse partir mon peuple, afin qu’il me serve[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de te soumettre à moi ». Le verbe hébreu peut évoquer le fait d’être abaissé ou de s’abaisser devant Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « afin qu’il m’adore ». Le verbe hébreu désigne le service et peut aussi, dans ce contexte, inclure le culte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: allèrent trouver
  rationale: Dans ce récit, בוא אֶל décrit le déplacement de Moïse et d’Aaron auprès du pharaon. « Allèrent trouver » est naturel en français et suggère leur entrée en sa présence sans ajouter un lieu absent du texte.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Cette tournure française actuelle rend clairement la formule de messager qui introduit la parole divine, tout en conservant sa force déclarative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu au lieu de le remplacer par un titre.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: le Dieu des Hébreux
  rationale: Rendu direct de la construction qui identifie Yahweh par son lien avec les Hébreux dans le contexte égyptien.
- source_word: עַד מָתַי מֵאַנְתָּ
  choice: Jusqu’à quand refuseras-tu
  rationale: Cette formulation idiomatique rend le reproche portant sur le refus persistant du pharaon.
- source_word: לֵעָנֹת מִפָּנָי
  choice: de t’humilier devant moi
  rationale: Le niphal de ענה peut exprimer le fait de s’abaisser ou de se soumettre. Le réfléchi français convient au contexte tout en laissant une note signaler l’autre nuance.
- source_word: שַׁלַּח עַמִּי
  choice: Laisse partir mon peuple
  rationale: Formulation française naturelle qui rend l’ordre de relâcher le peuple et conserve le refrain caractéristique du récit de l’Exode.
- source_word: וְיַעַבְדֻנִי
  choice: afin qu’il me serve
  rationale: עבד désigne le service et peut inclure ici le culte. « Servir » préserve cette étendue sémantique mieux que le seul « adorer ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve plutôt que de lui substituer un titre.
- issue: Sens de לֵעָנֹת devant Dieu
  choice: t’humilier devant moi
  alternative: te soumettre à moi
  rationale: « T’humilier » reste proche de la valeur lexicale du verbe, tandis que la note conserve la possibilité contextuelle de la soumission.
- issue: Portée de וְיַעַבְדֻנִי
  choice: afin qu’il me serve
  alternative: afin qu’il m’adore
  rationale: Le verbe hébreu peut viser un service cultuel, mais « servir » préserve sa portée plus large sans réduire d’emblée l’action au culte.
translation_notes:
  register: Français international moderne, naturel et digne. Le pharaon est désigné avec l’article selon l’usage français courant. Le tutoiement reflète l’adresse directe au souverain dans le discours hébreu. Les deux ambiguïtés lexicales principales sont conservées par des notes.
