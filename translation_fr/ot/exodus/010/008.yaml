base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/008.yaml
  text: So Moses and Aaron were brought back to Pharaoh[a], and he said to them, “Go, serve Yahweh your God. Who are the ones going?”
translation:
  language: fr
  text: 'Moïse et Aaron furent ramenés auprès du pharaon. Celui-ci leur dit : « Allez servir Yahweh, votre Dieu. Qui sont ceux qui vont partir[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Qui et qui sont ceux qui partent ? » Cette tournure hébraïque demande de préciser quelles personnes vont partir.'
    reason: La formulation littérale est peu naturelle en français, mais sa répétition et sa valeur idiomatique éclairent la question du pharaon.
lexical_decisions:
- source_word: וַיּוּשַׁב
  choice: furent donc ramenés
  rationale: Le hofal de שׁוב exprime ici le fait d’être amené à revenir. « Furent ramenés » conserve la valeur passive et causative dans un français naturel.
- source_word: אֶל־פַּרְעֹה
  choice: auprès du pharaon
  rationale: La préposition אֶל marque le mouvement en direction du pharaon. « Auprès du pharaon » rend naturellement le retour en sa présence sans remplacer le mouvement par une simple localisation.
- source_word: לְכוּ עִבְדוּ
  choice: Allez servir
  rationale: Les deux impératifs sont conservés. « Servir » maintient l’étendue de עבד, qui comprend ici le culte rendu à Dieu sans se limiter à un acte liturgique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré comme nom propre plutôt que remplacé par un titre.
- source_word: מִי וָמִי
  choice: Qui sont ceux
  rationale: La tournure hébraïque répétée demande l’identité précise des personnes qui partiront. Le texte français formule naturellement la question, tandis que la répétition littérale est signalée en note.
- source_word: הַהֹלְכִים
  choice: qui vont partir
  rationale: Le participe substantivé désigne les personnes sur le point de partir. Cette formulation française rend à la fois le groupe visé et la valeur imminente du participe.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, nom personnel du Dieu d’Israël. La translittération le distingue d’un titre tout en évitant d’ajouter une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, courant et digne. « Celui-ci » clarifie naturellement que le pharaon prend la parole. Le futur proche « vont partir » convient à une permission de départ immédiate, sans transformer explicitement le participe hébreu en futur simple.
