  text: לֹ֣א כֵ֗ן לְכֽוּ נָ֤א הַ/גְּבָרִים֙ וְ/עִבְד֣וּ אֶת יְהוָ֔ה כִּ֥י אֹתָ֖/הּ אַתֶּ֣ם מְבַקְשִׁ֑ים וַ/יְגָ֣רֶשׁ אֹתָ֔/ם מֵ/אֵ֖ת פְּנֵ֥י פַרְעֹֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/011.yaml
  text: No! Let the men go now and serve Yahweh[b][a], for that is what you are seeking.” Then he drove them out from Pharaoh’s presence.
translation:
  language: fr
  text: « Non[a] ! Que les hommes[b] partent donc servir Yahweh, car c’est cela que vous demandez. » Puis on les chassa de devant Pharaon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Non, pas ainsi ! »'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu désigne ici spécifiquement les personnes de sexe masculin, et non l’ensemble du peuple.
    reason: lexical_clarification
lexical_decisions:
- source_word: לֹא כֵן
  choice: Non !
  rationale: Cette réponse brève et catégorique rend naturellement en français le refus abrupt de Pharaon. La tournure plus formelle « Il n’en sera pas ainsi » est signalée en note.
- source_word: לְכוּ נָא
  choice: partent donc
  rationale: Le tour exhortatif avec נָא exprime ici l’insistance et une concession impatiente plutôt qu’une demande polie. « donc » restitue ce ton en français.
- source_word: הַגְּבָרִים
  choice: les hommes
  rationale: Le terme désigne spécifiquement les personnes de sexe masculin et maintient la restriction imposée par Pharaon, sans la neutraliser en « peuple » ou « personnes ».
- source_word: וְעִבְדוּ אֶת יְהוָה
  choice: servir Yahweh
  rationale: Le verbe עבד peut désigner le service ou le culte rendu à Dieu. « servir » conserve cette amplitude et s’intègre naturellement à la construction française.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: כִּי אֹתָהּ אַתֶּם מְבַקְשִׁים
  choice: puisque c’est cela que vous demandez
  rationale: Le pronom féminin renvoie vraisemblablement à la chose ou à la requête recherchée, sans antécédent féminin explicite en français. « cela » préserve cette référence sans la préciser indûment.
- source_word: וַיְגָרֶשׁ אֹתָם
  choice: Puis il les chassa
  rationale: Le singulier renvoie naturellement à Pharaon dans le contexte. « chassa » exprime la force de l’expulsion sans alourdir le récit.
- source_word: מֵאֵת פְּנֵי פַרְעֹה
  choice: de la présence de Pharaon
  rationale: Cette formulation française claire conserve l’image judiciaire et spatiale de l’expression hébraïque « de devant la face de Pharaon ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom d’alliance sans le remplacer par un titre ni privilégier la forme tardive « Jéhovah ».
- issue: Restriction de l’offre de Pharaon aux hommes
  choice: les hommes
  alternative: les gens / le peuple
  rationale: Le substantif hébreu est explicitement masculin. Le conserver fait ressortir la concession partielle de Pharaon et la tension narrative avec la demande de départ de tout le peuple.
- issue: Sujet de l’expulsion
  choice: il
  alternative: 'on'
  rationale: Le verbe hébreu est au masculin singulier et, dans le contexte immédiat, Pharaon en est le référent le plus naturel. Le pronom français suit cette lecture sans ajouter son nom au texte.
translation_notes:
  register: Français international moderne, sobre et digne. Le discours de Pharaon reste abrupt et autoritaire. La syntaxe « Que les hommes partent donc servir… » est fluide à l’oral comme à l’écrit, tandis que les notes préservent la forme plus littérale du refus et la portée masculine du substantif.
