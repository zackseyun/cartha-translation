revisions:
- from: « Non[a] ! Que les hommes[b] partent donc servir Yahweh, puisque c’est cela que vous demandez. » Puis il les chassa de la présence de Pharaon.
  to: « Non[a] ! Que les hommes[b] partent donc servir Yahweh, car c’est cela que vous demandez. » Puis on les chassa de devant Pharaon.
  rationale: La révision préserve le ton abrupt de Pharaon, la restriction aux hommes et le nom divin. Elle remplace surtout le sujet implicite et possiblement disputé de l’expulsion par une construction impersonnelle, sans modifier le sens du passage. Les deux appels de note restent correctement ancrés et la note alternative est rapprochée de l’expression hébraïque.
