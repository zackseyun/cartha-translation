  text: וַ/יִּפְסֹ֡ל שְׁנֵֽי לֻחֹ֨ת אֲבָנִ֜ים כָּ/רִאשֹׁנִ֗ים וַ/יַּשְׁכֵּ֨ם מֹשֶׁ֤ה בַ/בֹּ֨קֶר֙ וַ/יַּ֨עַל֙ אֶל הַ֣ר סִינַ֔י כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/יִּקַּ֣ח בְּ/יָד֔/וֹ שְׁנֵ֖י לֻחֹ֥ת אֲבָנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/004.yaml
  text: So he cut two stone tablets like the first ones[a], and Moses rose early in the morning and went up Mount Sinai, just as Yahweh had commanded him[b], and he took the two stone tablets in his hand.
translation:
  language: fr
  text: Il tailla deux tablettes de pierre semblables aux premières[a]. Moïse se leva de bon matin et monta au mont Sinaï, comme Yahweh le lui avait ordonné. Il prit les deux tablettes de pierre dans sa main[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il découpa » deux tablettes de pierre semblables aux premières.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans sa main »; le singulier peut avoir ici une valeur idiomatique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְסֹל
  choice: Il tailla
  rationale: Le verbe פסל désigne ici l’action de façonner la pierre par taille. « Tailler » est concret, naturel en français moderne et convient mieux à des tablettes de pierre que le plus spécialisé « sculpter ».
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: deux tablettes de pierre
  rationale: « Tablettes de pierre » est la désignation française courante et claire des supports de l’alliance; la construction avec « de pierre » reste naturelle et digne.
- source_word: כָּרִאשֹׁנִים
  choice: semblables aux premières
  rationale: Le préfixe comparatif כ et l’adjectif « premières » indiquent que les nouvelles tablettes doivent correspondre aux précédentes. Cette formulation rend explicitement la comparaison sans en préciser indûment les modalités.
- source_word: וַיַּשְׁכֵּם ... בַבֹּקֶר
  choice: se leva de bon matin
  rationale: Cette locution française naturelle conserve l’idée idiomatique d’un lever matinal et le ton narratif solennel.
- source_word: וַיַּעַל אֶל הַר סִינַי
  choice: monta sur le mont Sinaï
  rationale: « Monter sur » exprime clairement le mouvement ascendant vers la montagne. La répétition « monta sur le mont » est acceptable et immédiatement compréhensible en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » représente le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֹתוֹ
  choice: comme Yahweh le lui avait ordonné
  rationale: « Comme » marque la conformité au commandement antérieur; le plus-que-parfait situe naturellement cet ordre avant l’ascension. Les pronoms indiquent que Yahweh avait donné cet ordre à Moïse.
- source_word: וַיִּקַּח בְּיָדוֹ
  choice: Il prit à la main
  rationale: Cette expression conserve le singulier hébreu tout en restant idiomatique en français; elle ne force pas l’image matérielle de deux tablettes tenues dans une seule main.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel sans lui substituer le titre traditionnel « le SEIGNEUR »; « Jéhovah » repose sur une vocalisation secondaire.
- issue: Portée du singulier בְּיָדוֹ (« dans/à sa main »)
  choice: 'Conserver le singulier idiomatique : « à la main »'
  alternative: « dans ses mains » ou simple « emporta »
  rationale: Le singulier peut être idiomatique et ne permet pas de conclure avec certitude à la manière précise dont Moïse portait les deux tablettes. La traduction conserve cette tension sans imposer un pluriel interprétatif.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases ont été légèrement segmentées pour la lisibilité. « De bon matin » maintient une tonalité biblique encore courante, sans archaïsme marqué. Tous les marqueurs de notes figurent dans le texte.
