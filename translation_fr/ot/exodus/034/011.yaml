  text: שְׁמָ֨ר לְ/ךָ֔ אֵ֛ת אֲשֶׁ֥ר אָנֹכִ֖י מְצַוְּ/ךָ֣ הַ/יּ֑וֹם הִנְ/נִ֧י גֹרֵ֣שׁ מִ/פָּנֶ֗י/ךָ אֶת הָ/אֱמֹרִי֙ וְ/הַֽ/כְּנַעֲנִ֔י וְ/הַ/חִתִּי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/011.yaml
  text: Keep what I am commanding you today[a]. Behold, I am driving out before you the Amorites, the Canaanites, the Hittites, the Perizzites, the Hivites[b], and the Jebusites.
translation:
  language: fr
  text: Veille à respecter ce que je t’ordonne aujourd’hui[a]. Voici, je vais chasser devant toi[b] les Amorites, les Cananéens, les Hittites, les Perizzites, les Hivites et les Jébusites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Garde ce que je t’ordonne aujourd’hui » ou « Prends garde à ce que je t’ordonne aujourd’hui ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de devant toi » ; l’expression évoque leur expulsion hors de ta présence ou de ton chemin.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָר לְךָ
  choice: Veille à respecter
  rationale: L’impératif de שׁמר appelle ici à garder et observer les prescriptions. « Veille à respecter » exprime naturellement en français l’attention soutenue impliquée par לְךָ, sans lui attribuer artificiellement le sens de « pour toi-même ».
- source_word: אֵת אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ce que je t’ordonne aujourd’hui
  rationale: La proposition relative désigne le contenu du commandement. Le présent français convient à la forme participiale et à l’acte d’énonciation en cours.
- source_word: הִנְנִי
  choice: Voici
  rationale: « Voici » conserve la fonction présentative et emphatique de הִנְנִי dans un registre digne mais actuel.
- source_word: גֹרֵשׁ
  choice: je vais chasser
  rationale: Le participe associé à הִנְנִי présente une action divine imminente et assurée. « Je vais chasser » rend cette valeur plus naturellement en français que le présent progressif.
- source_word: מִפָּנֶיךָ
  choice: devant toi
  rationale: L’expression signifie littéralement « de devant ta face » et désigne l’expulsion hors de la présence ou du chemin d’Israël. « Devant toi » garde l’image hébraïque sans lourdeur excessive.
- source_word: הָאֱמֹרִי; הַכְּנַעֲנִי; הַחִתִּי; הַפְּרִזִּי; הַחִוִּי; הַיְבוּסִי
  choice: les Amorites, les Cananéens, les Hittites, les Perizzites, les Hivites et les Jébusites
  rationale: Les noms collectifs au singulier hébreu sont rendus naturellement par les ethnonymes français au pluriel.
theological_decisions:
- issue: Nuance de l’impératif שׁמר dans le contexte de l’alliance
  choice: Un ordre de respecter attentivement ce qui est commandé
  alternative: Garde ce que je t’ordonne aujourd’hui
  rationale: Le contexte porte sur les obligations de l’alliance. La formulation retenue conserve à la fois les idées de vigilance et d’observance, sans ajouter explicitement « mettre en pratique », absent du texte.
- issue: Valeur temporelle de l’action divine exprimée par הִנְנִי גֹרֵשׁ
  choice: 'Action imminente et certaine : « je vais chasser »'
  alternative: 'Action présentée au présent : « je chasse »'
  rationale: La construction peut présenter vivement une action en cours, imminente ou assurée. Le futur proche est idiomatique en français et maintient la certitude de l’engagement divin sans préciser indûment que l’expulsion a déjà commencé.
translation_notes:
  register: Français international moderne, clair et digne. « Voici » maintient la solennité de l’annonce sans recourir à l’archaïsme « voici que ». Les ethnonymes suivent les formes françaises bibliques usuelles.
