  text: כִּ֛י לֹ֥א תִֽשְׁתַּחֲוֶ֖ה לְ/אֵ֣ל אַחֵ֑ר כִּ֤י יְהוָה֙ קַנָּ֣א שְׁמ֔/וֹ אֵ֥ל קַנָּ֖א הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/014.yaml
  text: For you shall not bow down to another god[a], for Yahweh, whose name is Jealous[c][b], is a jealous God.
translation:
  language: fr
  text: 'Car tu ne te prosterneras pas devant un autre dieu[a] : en effet, Yahweh — « Jaloux » est son nom[b] — est un Dieu jaloux[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu n’adoreras pas un autre dieu ». Le verbe hébreu désigne littéralement le fait de se prosterner, souvent en signe d’adoration.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement en hébreu : « car Yahweh — Jaloux est son nom — est un Dieu jaloux ».'
    reason: lexical_alternative
  - marker: c
    text: Ici, « jaloux » exprime le droit exclusif que Yahweh revendique sur l’adoration de son peuple dans le cadre de l’alliance, et non une envie coupable.
    reason: cultural_note
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: tu ne te prosterneras pas
  rationale: Le verbe שׁחה désigne concrètement le fait de se prosterner, souvent comme acte d’adoration. Cette formulation conserve l’image hébraïque sans réduire le sens au seul geste physique.
- source_word: לְאֵל אַחֵר
  choice: devant un autre dieu
  rationale: אֵל signifie « dieu » et אַחֵר « autre ». En français, « se prosterner devant » exprime naturellement la relation indiquée par la préposition לְ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: קַנָּא
  choice: Jaloux / jaloux
  rationale: « Jaloux » préserve à la fois la désignation donnée comme nom et l’attribut répété dans la proposition suivante. Le terme exprime ici l’exigence d’une fidélité exclusive.
- source_word: שְׁמוֹ
  choice: « Jaloux » est son nom
  rationale: Cette construction suit de près l’ordre et l’accent de l’hébreu tout en restant naturelle dans une incise française.
- source_word: אֵל קַנָּא הוּא
  choice: est un Dieu jaloux
  rationale: La formulation restitue directement le prédicat hébreu et maintient la répétition rhétorique de קַנָּא.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Sens théologique de קַנָּא
  choice: Jaloux / jaloux
  alternative: Ardent / passionné
  rationale: Le même mot hébreu sert de désignation et d’attribut. Conserver « jaloux » maintient la force de l’affirmation et l’exigence d’exclusivité, sans l’adoucir ni résoudre la tension du terme.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur à valeur prescriptive (« tu ne te prosterneras pas ») conserve la forme du commandement hébreu. L’incise met en relief le nom « Jaloux » et la répétition voulue par le texte source.
