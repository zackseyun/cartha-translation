source:
  edition: WLC
  text: וְ/חַ֤ג שָׁבֻעֹת֙ תַּעֲשֶׂ֣ה לְ/ךָ֔ בִּכּוּרֵ֖י קְצִ֣יר חִטִּ֑ים וְ/חַג֙ הָֽ/אָסִ֔יף תְּקוּפַ֖ת הַ/שָּׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/022.yaml
  text: And you shall observe for yourself the Feast of Weeks[a], the firstfruits of the wheat harvest, and the Feast of Ingathering at the turn of the year.
translation:
  language: fr
  text: Tu célébreras la fête des Semaines, celle des prémices de la moisson du blé, ainsi que la fête de la Récolte, au tournant de l’année.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à la fin de l’année ». L’expression hébraïque évoque littéralement le tournant ou le cycle de l’année.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג
  choice: fête
  rationale: Dans ce contexte cultuel, le terme désigne une fête de pèlerinage. « Fête » est naturel, digne et convient aux célébrations nommées de l’Exode.
- source_word: שָׁבֻעֹת
  choice: Semaines
  rationale: Le nom hébreu de la fête signifie littéralement « Semaines ». Cette traduction conserve la désignation du texte sans lui substituer le nom traditionnel plus tardif « Pentecôte ».
- source_word: תַּעֲשֶׂה לְךָ
  choice: tu célébreras
  rationale: Littéralement « tu feras pour toi » ; avec חַג, le verbe עשה signifie idiomatiquement célébrer ou observer une fête. En français, « tu célébreras » exprime naturellement l’obligation, tandis qu’une traduction explicite de לְךָ serait lourde et peu idiomatique.
- source_word: בִּכּוּרֵי
  choice: les prémices de
  rationale: Le mot désigne les premiers produits de la récolte, notamment dans leur fonction cultuelle. « Prémices » est le terme français précis et consacré.
- source_word: קְצִיר חִטִּים
  choice: la moisson du blé
  rationale: Le syntagme construit désigne la moisson ou récolte du blé. « Moisson du blé » est idiomatique et conserve l’image de la coupe.
- source_word: הָאָסִיף
  choice: Récolte
  rationale: Le terme évoque le rassemblement des produits agricoles. « Fête de la Récolte » est clair en français moderne et fonctionne comme nom de fête, sans recourir au peu courant « Engrangement ».
- source_word: תְּקוּפַת הַשָּׁנָה
  choice: au tournant de l’année
  rationale: תְּקוּפָה renvoie au retour, au tournant ou au cycle de l’année. Cette formulation préserve l’image hébraïque et évite de réduire nécessairement l’expression au dernier moment de l’année civile.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète l’adresse hébraïque. « Celle des prémices » explicite sobrement l’apposition hébraïque tout en maintenant le lien entre la fête des Semaines et le début de la moisson du blé. La majuscule est réservée aux éléments distinctifs des noms de fêtes.
