  text: וַ/יֹּ֗אמֶר הִנֵּ֣ה אָנֹכִי֮ כֹּרֵ֣ת בְּרִית֒ נֶ֤גֶד כָּֽל עַמְּ/ךָ֙ אֶעֱשֶׂ֣ה נִפְלָאֹ֔ת אֲשֶׁ֛ר לֹֽא נִבְרְא֥וּ בְ/כָל הָ/אָ֖רֶץ וּ/בְ/כָל הַ/גּוֹיִ֑ם וְ/רָאָ֣ה כָל הָ֠/עָם אֲשֶׁר אַתָּ֨ה בְ/קִרְבּ֜/וֹ אֶת מַעֲשֵׂ֤ה יְהוָה֙ כִּֽי נוֹרָ֣א ה֔וּא אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֥ה עִמָּֽ/ךְ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/010.yaml
  text: And he said, “Look, I am making a covenant. Before all your people I will do wonders such as have not been created in all the earth or among any of the nations. And all the people in whose midst you are will see the work of the LORD, for what I am doing with you is awe-inspiring.”
translation:
  language: fr
  text: 'Il dit : « Voici, je conclus une alliance. Devant tout ton peuple, je ferai des prodiges qui n’ont jamais été créés dans toute la terre ni parmi toutes les nations. Tout le peuple au milieu duquel tu te trouves verra l’œuvre du SEIGNEUR, car ce que je fais avec toi est redoutable. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Marque solennellement l’annonce et attire l’attention, dans un registre français naturel et digne.
- source_word: כֹּרֵת בְּרִית
  choice: je conclus une alliance
  rationale: L’expression hébraïque signifie littéralement « couper une alliance »; « conclure une alliance » en transmet le sens idiomatique.
- source_word: נִפְלָאֹת
  choice: des prodiges
  rationale: Désigne des actes extraordinaires suscitant l’émerveillement; « prodiges » convient au contexte divin.
- source_word: לֹא נִבְרְאוּ
  choice: il n’en a été créé
  rationale: Conserve le verbe passif ברא, inhabituel à propos des prodiges, sans le réduire à « accomplir ».
- source_word: נוֹרָא
  choice: inspirera la crainte
  rationale: Préserve la nuance de crainte mêlée de saisissement, plutôt que de rendre simplement l’idée d’un fait impressionnant.
- source_word: עֹשֶׂה עִמָּךְ
  choice: je vais faire avec toi
  rationale: Conserve la préposition עִם et son ambiguïté relationnelle, sans remplacer « avec toi » par « pour toi ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: Suit la convention française largement intelligible de représenter le tétragramme par SEIGNEUR en petites capitales, sans imposer une vocalisation reconstruite.
- issue: Nature de la crainte exprimée par נורא
  choice: ce que je vais faire avec toi inspirera la crainte
  alternative: ce que je vais faire avec toi sera impressionnant
  rationale: Le choix maintient la tension entre effroi, révérence et émerveillement présente dans le terme hébreu.
translation_notes:
  register: Français international moderne, solennel mais accessible. La syntaxe reste proche de l’hébreu lorsque cela porte une nuance importante, notamment « créé » et « avec toi ».
