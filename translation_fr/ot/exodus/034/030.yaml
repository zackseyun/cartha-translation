  text: וַ/יַּ֨רְא אַהֲרֹ֜ן וְ/כָל בְּנֵ֤י יִשְׂרָאֵל֙ אֶת מֹשֶׁ֔ה וְ/הִנֵּ֥ה קָרַ֖ן ע֣וֹר פָּנָ֑י/ו וַ/יִּֽירְא֖וּ מִ/גֶּ֥שֶׁת אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/030.yaml
  text: When Aaron and all the sons of Israel saw Moses[a], behold, the skin of his face was radiant, and they were afraid to come near him.
translation:
  language: fr
  text: Quand Aaron et tous les fils d’Israël virent Moïse, voici que la peau de son visage rayonnait[a] ; ils eurent alors peur de s’approcher de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « brillait » ou « lançait des rayons ». Le verbe hébreu est rare et a aussi été rendu historiquement par « portait des cornes », bien que le contexte favorise l’idée de rayonnement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: virent
  rationale: Le verbe ראה, à la forme narrative, signifie naturellement « voir » ici ; le pluriel français s’accorde avec Aaron et tous les fils d’Israël.
- source_word: וְכָל בְּנֵי יִשְׂרָאֵל
  choice: et tous les fils d’Israël
  rationale: Cette formulation conserve l’expression familiale hébraïque et sa forme masculine explicite, tout en restant reconnaissable dans un registre biblique français digne.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: « Voici que » rend la mise en relief et la surprise perceptive exprimées par la particule, dans un français naturel mais soutenu.
- source_word: קָרַן
  choice: rayonnait
  rationale: Dans ce contexte, le verbe rare décrit la peau du visage de Moïse comme émettant un éclat. « Rayonnait » garde l’image des rayons sans introduire l’interprétation historiquement connue des cornes.
- source_word: עוֹר פָּנָיו
  choice: la peau de son visage
  rationale: La traduction conserve le terme concret עוֹר, « peau », plutôt que de le réduire au seul « visage ».
- source_word: וַיִּירְאוּ
  choice: ils eurent alors peur
  rationale: Le passé simple s’intègre au récit et exprime naturellement leur réaction de crainte ; « alors » explicite légèrement l’enchaînement porté par la forme narrative.
- source_word: מִגֶּשֶׁת אֵלָיו
  choice: de s’approcher de lui
  rationale: La construction avec מִן et l’infinitif indique qu’ils reculent devant l’idée de s’approcher ; la formulation française rend cette réticence avec naturel.
theological_decisions:
- issue: Traduction de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites ; les enfants d’Israël
  rationale: Le texte emploie une désignation familiale grammaticalement masculine. La traduction principale la conserve sans la neutraliser, tout en reconnaissant que « les Israélites » serait plus idiomatique en français courant.
- issue: Sens de קָרַן appliqué au visage de Moïse
  choice: rayonnait
  alternative: brillait ; lançait des rayons ; portait des cornes
  rationale: Le contexte décrit un phénomène lumineux visible qui effraie les Israélites. Il favorise donc le rayonnement plutôt que des cornes littérales, mais la rareté du verbe et l’histoire de sa traduction justifient une note.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au récit biblique écrit ; « voici que » préserve la saillie narrative de l’hébreu. La tournure « fils d’Israël » maintient volontairement la formulation familiale de la source.
