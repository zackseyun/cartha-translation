  text: וַ/יְהִ֗י בְּ/רֶ֤דֶת מֹשֶׁה֙ מֵ/הַ֣ר סִינַ֔י וּ/שְׁנֵ֨י לֻחֹ֤ת הָֽ/עֵדֻת֙ בְּ/יַד מֹשֶׁ֔ה בְּ/רִדְתּ֖/וֹ מִן הָ/הָ֑ר וּ/מֹשֶׁ֣ה לֹֽא יָדַ֗ע כִּ֥י קָרַ֛ן ע֥וֹר פָּנָ֖י/ו בְּ/דַבְּר֥/וֹ אִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/029.yaml
  text: And it happened[a], when Moses came down from Mount Sinai with the two tablets of the testimony in Moses' hand as he came down from the mountain[c][b], that Moses did not know that the skin of his face shone because he had spoken with him.
translation:
  language: fr
  text: Lorsque Moïse descendit du mont Sinaï avec les deux tablettes du témoignage dans sa main, alors qu’il descendait de la montagne, Moïse ne savait pas que la peau de son visage rayonnait[a], parce qu’il avait parlé avec lui[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « brillait » ou « lançait des rayons ». Le verbe hébreu peut désigner l’émission de rayons. La traduction traditionnelle « était cornu » est historiquement connue, mais convient moins bien au contexte.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire avec le Seigneur.
    reason: referent_clarification
  - marker: c
    text: '« Parce qu’il avait parlé avec lui » peut aussi se comprendre dans un sens temporel : « lorsqu’il parlait avec lui » ou « après qu’il eut parlé avec lui ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Quand
  rationale: La formule narrative ouvre ici une circonstance temporelle. En français moderne, « Quand » restitue naturellement cette fonction sans le calque lourd « Et il arriva que ».
- source_word: בְּרֶדֶת ... בְּרִדְתּוֹ
  choice: Quand Moïse descendit… tandis qu’il descendait
  rationale: Les deux constructions infinitives de ירד sont conservées afin de respecter la répétition qui encadre la scène, tout en variant légèrement la formulation pour un français naturel.
- source_word: מֵהַר סִינַי
  choice: du mont Sinaï
  rationale: Équivalent français courant et précis du nom géographique.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: les deux tablettes du témoignage
  rationale: « Tablettes » désigne naturellement les supports de pierre; « témoignage » maintient le terme d’alliance sans l’expliciter au-delà de l’hébreu.
- source_word: בְּיַד מֹשֶׁה
  choice: à la main — la main de Moïse —
  rationale: Le singulier hébreu et la répétition explicite du nom de Moïse sont préservés. La tournure idiomatique « à la main » est suivie d’une apposition qui rend l’insistance inhabituelle du texte source.
- source_word: לֹא יָדַע
  choice: il ne savait pas
  rationale: Rendu direct et naturel de la négation du verbe ידע.
- source_word: קָרַן
  choice: rayonnait
  rationale: Le verbe exprime ici l’émission de rayons ou l’éclat. « Rayonnait » rend directement l’image verbale et convient au contexte de la gloire visible.
- source_word: עוֹר פָּנָיו
  choice: la peau de son visage
  rationale: La formulation explicite de l’hébreu est conservée plutôt que réduite au seul mot « visage ».
- source_word: בְּדַבְּרוֹ אִתּוֹ
  choice: parce qu’il avait parlé avec lui
  rationale: La valeur causale convient au contexte, mais la construction en בְּ avec infinitif peut aussi être temporelle; cette ambiguïté est signalée en note.
- source_word: אִתּוֹ
  choice: avec lui
  rationale: Le pronom de l’hébreu est maintenu dans le texte principal; son référent contextuel est précisé en note.
theological_decisions:
- issue: Sens de קָרַן appliqué au visage de Moïse
  choice: rayonnait
  alternative: était muni de cornes / était cornu
  rationale: Le contexte décrit un éclat visible lié à la rencontre avec le Seigneur. Le sens d’émission de rayons convient mieux que l’interprétation physique traditionnelle associée au nom « corne ».
- issue: Référent de אִתּוֹ
  choice: conserver « lui » dans le texte
  alternative: expliciter « le Seigneur » ou « Dieu »
  rationale: Le contexte identifie le Seigneur comme référent, mais l’hébreu emploie un pronom. Le conserver respecte la formulation de la source sans rendre le sens inaccessible.
- issue: Valeur de בְּ dans בְּדַבְּרוֹ
  choice: 'causale : « parce qu’il avait parlé »'
  alternative: 'temporelle : « lorsqu’il parlait » ou « après qu’il eut parlé »'
  rationale: Le contexte favorise un lien causal entre l’entretien divin et le rayonnement, mais la syntaxe hébraïque permet aussi une lecture temporelle, conservée en note.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple convient au récit biblique écrit sans archaïsme excessif. La répétition de la descente et la mention singulière de la main sont maintenues, tandis que les ambiguïtés lexicale, pronominale et temporelle sont signalées par des notes.
