source:
  edition: WLC
  text: לֹֽא תִשְׁחַ֥ט עַל חָמֵ֖ץ דַּם זִבְחִ֑/י וְ/לֹא יָלִ֣ין לַ/בֹּ֔קֶר זֶ֖בַח חַ֥ג הַ/פָּֽסַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/025.yaml
  text: You shall not slaughter the blood of my sacrifice with leaven[a], and the sacrifice of the feast of the Passover shall not remain until the morning.
translation:
  language: fr
  text: Tu n’offriras pas avec du levain le sang de mon sacrifice, et le sacrifice de la fête de la Pâque ne restera pas jusqu’au matin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִשְׁחַט
  choice: offriras
  rationale: Dans ce contexte rituel, שׁחט désigne l’égorgement sacrificiel. Avec « le sang », le français idiomatique « offrir le sang » évite la tournure peu naturelle « égorger le sang », tout en conservant clairement le sens cultuel.
- source_word: עַל חָמֵץ
  choice: avec du levain
  rationale: La préposition עַל exprime ici l’association interdite avec le levain, sans préciser davantage les modalités rituelles. « Avec du levain » demeure naturel et conserve cette indétermination.
- source_word: דַּם זִבְחִי
  choice: le sang de mon sacrifice
  rationale: Cette formulation conserve explicitement le sang, le sacrifice et le suffixe possessif de première personne du texte hébreu.
- source_word: יָלִין
  choice: ne restera pas jusqu’au matin
  rationale: לין signifie passer la nuit ou subsister pendant la nuit. La limite « jusqu’au matin » étant explicite, « restera » rend naturellement l’interdiction sans redondance.
- source_word: זֶבַח חַג הַפָּסַח
  choice: le sacrifice de la fête de la Pâque
  rationale: La chaîne nominale est conservée afin de rendre visibles à la fois le sacrifice, la fête et la Pâque, sans la réduire au seul « sacrifice pascal ».
- source_word: הַפָּסַח
  choice: la Pâque
  rationale: « La Pâque » est la désignation française biblique établie de la fête israélite et convient au contexte mosaïque immédiat.
theological_decisions:
- issue: Rendre la terminologie de la fête de l’alliance sans importer d’associations doctrinales ultérieures
  choice: la Pâque
  alternative: Pessa’h
  rationale: « La Pâque » établit clairement le lien canonique en français tout en restant dans le cadre cultuel israélite du verset; aucune interprétation christologique ou confessionnelle n’est ajoutée.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le parallélisme des deux interdictions. « Tu n’offriras pas […] le sang » privilégie une expression française intelligible là où un calque de שׁחט produirait l’anomalie « égorger le sang ».
