  text: וְ/אִישׁ֙ לֹֽא יַעֲלֶ֣ה עִמָּ֔/ךְ וְ/גַם אִ֥ישׁ אַל יֵרָ֖א בְּ/כָל הָ/הָ֑ר גַּם הַ/צֹּ֤אן וְ/הַ/בָּקָר֙ אַל יִרְע֔וּ אֶל מ֖וּל הָ/הָ֥ר הַ/הֽוּא־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/003.yaml
  text: And no man shall go up with you[a], and indeed no man shall be seen anywhere on the mountain[b]; even the flock and the herd must not graze in front of that mountain.
translation:
  language: fr
  text: Que personne ne monte avec toi, et que personne non plus ne paraisse sur toute la montagne[a] ; même le petit et le gros bétail ne doivent pas paître en face de cette montagne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne soit vu sur toute la montagne ». La forme hébraïque peut signifier « paraître » ou « être vu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: personne
  rationale: Dans les deux interdictions, le nom masculin singulier a une portée générique. La tournure négative française « personne » exprime naturellement qu’aucun être humain n’est admis.
- source_word: יַעֲלֶה עִמָּךְ
  choice: ne monte avec toi
  rationale: Le verbe עלה indique ici la montée vers la montagne ; « monter avec toi » est direct et idiomatique.
- source_word: וְגַם
  choice: et ... non plus
  rationale: Dans cette suite de deux interdictions négatives, « non plus » rend l’ajout marqué par גם sans alourdir la phrase.
- source_word: אַל יֵרָא
  choice: que ... ne paraisse
  rationale: Le niphal de ראה peut signifier « être vu » ou « paraître ». « Paraisse » convient à l’interdiction de toute présence visible, sans la réduire à l’acte de regarder.
- source_word: בְּכָל הָהָר
  choice: nulle part sur toute la montagne
  rationale: Cette formulation fait entendre à la fois la portée distributive de la négation et l’étendue totale désignée par כל.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: le petit et le gros bétail
  rationale: Cette paire française distingue naturellement les ovins/caprins des bovins et conserve les deux catégories collectives du texte.
- source_word: אַל יִרְעוּ
  choice: ne doivent pas paître
  rationale: Avec des animaux pour sujets, רעה désigne l’action de paître ; la formulation exprime clairement l’interdiction.
- source_word: אֶל מוּל
  choice: en face de
  rationale: La locution indique une position vis-à-vis de la montagne, devant ou face à elle.
- source_word: הָהָר הַהוּא
  choice: cette montagne
  rationale: Le démonstratif singularise la montagne déjà désignée ; « cette montagne » est naturel dans le discours adressé à Moïse.
