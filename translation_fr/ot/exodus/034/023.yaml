  text: שָׁלֹ֥שׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה יֵרָאֶה֙ כָּל זְכ֣וּרְ/ךָ֔ אֶת פְּנֵ֛י הָֽ/אָדֹ֥ן יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/023.yaml
  text: Three times in the year all your males shall appear before the Lord Yahweh[b][a], the God of Israel.
translation:
  language: fr
  text: Trois fois par an, tous les hommes parmi vous se présenteront devant[a] le Seigneur Yahvé[b], le Dieu d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devant la face de ». Cette expression signifie « devant » ou « en présence de ».'
    reason: lexical_alternative
  - marker: b
    text: Certaines traductions rendent cette expression par « le Seigneur DIEU ». L’hébreu distingue ici le titre « le Seigneur » (ha’adôn) du nom divin YHWH, rendu ici par « Yahvé ».
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: Trois fois par an
  rationale: Cette tournure française naturelle exprime clairement la fréquence annuelle indiquée par l’expression hébraïque.
- source_word: יֵרָאֶה
  choice: se présenteront
  rationale: Dans ce contexte cultuel, le niphal de ראה désigne le fait de paraître ou de se présenter devant Dieu. « Se présenteront » rend naturellement l’obligation sans donner au verbe un sens passif trompeur.
- source_word: כָּל זְכוּרְךָ
  choice: tous les hommes parmi vous
  rationale: Le terme hébreu vise explicitement les personnes de sexe masculin tenues de participer aux fêtes de pèlerinage. Cette formulation est exacte et plus naturelle en français que « tous tes mâles ».
- source_word: אֶת פְּנֵי
  choice: devant
  rationale: Littéralement « devant la face de », cet idiome hébreu signifie « devant » ou « en présence de ».
- source_word: הָאָדֹן
  choice: le Seigneur
  rationale: אָדוֹן avec l’article est ici un titre divin; « le Seigneur » en est l’équivalent français usuel et reste distinct du nom divin qui suit.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin YHWH et permet de préserver le nom propre à côté du titre « le Seigneur ».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Cette formulation transparente rend directement la chaîne construite hébraïque.
theological_decisions:
- issue: Rendu du nom divin יְהוָה après le titre הָאָדֹן
  choice: le Seigneur Yahvé
  alternative: le Seigneur DIEU ; le Souverain Seigneur
  rationale: L’hébreu associe un titre divin au nom propre YHWH. Garder « Seigneur » et « Yahvé » préserve cette distinction sans substituer un second titre au nom divin.
- issue: Portée masculine de l’obligation
  choice: tous les hommes parmi vous
  alternative: tous parmi vous ; chacun de vous
  rationale: Le mot זָכוּר est explicitement masculin dans ce contexte. La traduction conserve cette précision au lieu de généraliser l’obligation.
translation_notes:
  register: Français international moderne, clair et digne. « Trois fois par an » et « se présenteront » assurent une lecture naturelle, tandis que les notes conservent les particularités de l’expression hébraïque et la distinction entre le titre divin et le nom YHWH.
