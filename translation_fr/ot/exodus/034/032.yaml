id: EXO.34.32
reference: Exodus 34:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֥ן נִגְּשׁ֖וּ כָּל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יְצַוֵּ֕/ם אֵת֩ כָּל אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אִתּ֖/וֹ בְּ/הַ֥ר סִינָֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/032.yaml
  text: Afterward all the sons of Israel came near[a], and he commanded them all that Yahweh had spoken with him on Mount Sinai.
translation:
  language: fr
  text: Après cela, tous les fils d’Israël[a] s’approchèrent, et il leur prescrivit tout ce que Yahweh lui avait dit sur le mont Sinaï.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « fils d’Israël » : expression nationale désignant collectivement les Israélites.'
    reason: Préciser la portée collective de l’expression hébraïque tout en en conservant la forme dans le texte.
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Après cela
  rationale: Cette expression marque la succession des événements. « Après cela » est naturel en français moderne et conserve clairement la transition temporelle.
- source_word: נִגְּשׁוּ
  choice: s’approchèrent
  rationale: Le niphal de נגשׁ exprime ici le fait de venir près de quelqu’un. « S’approchèrent » restitue le mouvement concret dans le contexte du visage rayonnant de Moïse.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: tous les fils d’Israël
  rationale: La formulation conserve l’expression nationale hébraïque et sa forme masculine plurielle. Une note précise sa portée collective, puisque le français courant emploierait souvent « tous les Israélites ».
- source_word: וַיְצַוֵּם
  choice: il leur prescrivit
  rationale: Le verbe צוה signifie commander ou donner des prescriptions. « Prescrivit » garde sa force normative tout en permettant une construction française naturelle avec le contenu transmis.
- source_word: אֵת כָּל אֲשֶׁר
  choice: tout ce que
  rationale: Cette tournure française rend directement l’ensemble du contenu introduit par la construction hébraïque.
- source_word: דִּבֶּר יְהוָה אִתּוֹ
  choice: Yahweh lui avait dit
  rationale: Le plus-que-parfait marque que la parole divine précède les prescriptions adressées au peuple. « Lui avait dit » exprime naturellement en français la communication signalée par דִּבֶּר ... אִתּוֹ, sans alourdir la phrase par un calque de « avait parlé avec lui ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בְּהַר סִינָי
  choice: sur le mont Sinaï
  rationale: Cette formulation française naturelle situe la parole donnée sur la montagne et restitue précisément le complément hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel de Dieu sans le remplacer par un titre.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: Israélites ; enfants d’Israël
  rationale: La traduction maintient la forme masculine de l’expression nationale hébraïque sans laisser entendre qu’elle désigne nécessairement les seuls hommes; la note en explicite l’usage collectif.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La syntaxe reste accessible, tandis que « prescrivit » conserve la force normative du verbe hébreu.
