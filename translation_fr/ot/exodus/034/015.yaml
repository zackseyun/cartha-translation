revisions:
- from: Garde-toi de conclure une alliance avec les habitants du pays. Ils se prostitueraient en suivant leurs dieux[a] et offriraient des sacrifices à leurs dieux ; l’un d’eux pourrait alors t’inviter[b], et tu mangerais de son sacrifice[c].
  to: Garde-toi de conclure une alliance avec les habitants du pays, de peur qu’ils ne se prostituent en suivant leurs dieux, qu’ils n’offrent des sacrifices à leurs dieux, que l’un d’eux ne t’invite et que tu ne manges de son sacrifice[c].
  rationale: La révision rétablit en français la dépendance de toute la série verbale à la mise en garde (« de peur que »), sans introduire de modalité supplémentaire. Elle maintient la métaphore sexuelle de l’idolâtrie, le singulier distributif et l’ambiguïté sobre de « manger de son sacrifice ». Les notes a et b sont conservées comme aides lexicales; la note c reste une clarification non doctrinale.
