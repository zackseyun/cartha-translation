  text: פֶּן תִּכְרֹ֥ת בְּרִ֖ית לְ/יוֹשֵׁ֣ב הָ/אָ֑רֶץ וְ/זָנ֣וּ אַחֲרֵ֣י אֱלֹֽהֵי/הֶ֗ם וְ/זָבְחוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם וְ/קָרָ֣א לְ/ךָ֔ וְ/אָכַלְתָּ֖ מִ/זִּבְחֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/015.yaml
  text: lest you make a covenant with the inhabitants of the land[a], and they prostitute themselves after their gods and sacrifice to their gods[c][b], and one of them invites you and you eat from his sacrifice.
translation:
  language: fr
  text: Garde-toi de conclure une alliance avec les habitants du pays, de peur qu’ils ne se prostituent en suivant leurs dieux, qu’ils n’offrent des sacrifices à leurs dieux, que l’un d’eux ne t’invite et que tu ne manges de son sacrifice[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 'C’est-à-dire : de la nourriture provenant de son offrande sacrificielle.'
    reason: clarification
lexical_decisions:
- source_word: פֶּן
  choice: Garde-toi de
  rationale: La particule introduit ici une mise en garde contre une éventualité. Cette tournure française restitue naturellement sa force préventive, sans employer le littéral mais peu idiomatique « de peur que » en tête d’un verset autonome.
- source_word: תִּכְרֹת בְּרִית
  choice: conclure une alliance
  rationale: L’expression hébraïque signifie littéralement « couper une alliance ». « Conclure une alliance » est l’équivalent français courant et digne.
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: avec les habitants du pays
  rationale: Le participe singulier collectif désigne les personnes qui habitent le pays ; le pluriel français rend naturellement cette valeur collective.
- source_word: וְזָנוּ אַחֲרֵי אֱלֹהֵיהֶם
  choice: ils se prostitueraient en suivant leurs dieux
  rationale: Le verbe זנה conserve l’image forte de la prostitution appliquée à l’idolâtrie. « En suivant » rend idiomatiquement אַחֲרֵי sans supprimer la métaphore.
- source_word: וְזָבְחוּ לֵאלֹהֵיהֶם
  choice: offriraient des sacrifices à leurs dieux
  rationale: Cette formulation explicite naturellement en français l’acte cultuel exprimé par le verbe זבח.
- source_word: וְקָרָא לְךָ
  choice: l’un d’eux pourrait alors t’inviter
  rationale: Après les verbes au pluriel, le singulier individualise vraisemblablement un habitant quelconque. « L’un d’eux » rend cette valeur distributive ; « pourrait alors » maintient le caractère éventuel de l’enchaînement.
- source_word: וְאָכַלְתָּ מִזִּבְחוֹ
  choice: tu mangerais de son sacrifice
  rationale: La formulation reste proche de l’hébreu et laisse entendre, sans l’expliciter excessivement, qu’il s’agit de nourriture provenant de l’offrande sacrificielle.
theological_decisions:
- issue: L’idolâtrie décrite par une image d’infidélité sexuelle
  choice: Conserver explicitement « se prostitueraient »
  alternative: « suivraient leurs dieux » ou « seraient infidèles en suivant leurs dieux »
  rationale: L’hébreu emploie intentionnellement une image sexuelle choquante pour évoquer l’infidélité religieuse. La conserver maintient la force littéraire et théologique du texte.
- issue: Le singulier « il t’invitera » après des sujets pluriels
  choice: Le rendre distributivement par « l’un d’eux pourrait alors t’inviter »
  alternative: « il t’inviterait » ou « ils t’inviteraient »
  rationale: Le singulier semble présenter le cas concret de n’importe quel habitant invitant le destinataire. La traduction retenue préserve cette individualisation sans rendre l’antécédent obscur.
- issue: Participation à un sacrifice idolâtre
  choice: Conserver « mangerais de son sacrifice »
  alternative: « participerais à son repas sacrificiel »
  rationale: Le texte mentionne directement le fait de manger ce qui provient du sacrifice. La formulation retenue évite de préciser davantage que l’hébreu la nature exacte de cette participation.
translation_notes:
  register: Français international moderne, clair et digne. Le conditionnel déroule les conséquences possibles visées par la mise en garde. La métaphore crue de la prostitution est maintenue, tandis que les idiomes hébreux sont rendus dans un français naturel.
