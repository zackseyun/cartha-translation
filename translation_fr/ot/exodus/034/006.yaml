    rationale: La formule française peut décrire quelqu’un qui est rempli de grâce. Le terme hébreu caractérise plutôt celui qui accorde librement sa grâce ou sa faveur. « Qui fait grâce » explicite cette valeur active sans ajouter de contenu doctrinal.
