  source_fidelity: Le mouvement de Yahweh devant Moïse, la proclamation, la double occurrence du nom divin et la série d’attributs sont fidèlement rendus. « Amour fidèle » et « fidélité » conservent de façon transparente la distinction בין חֶסֶד et אֱמֶת, tandis que la note préserve l’alternative « vérité ».
