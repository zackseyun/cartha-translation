  text: וַ/יַּעֲבֹ֨ר יְהוָ֥ה עַל פָּנָי/ו֮ וַ/יִּקְרָא֒ יְהוָ֣ה יְהוָ֔ה אֵ֥ל רַח֖וּם וְ/חַנּ֑וּן אֶ֥רֶךְ אַפַּ֖יִם וְ/רַב חֶ֥סֶד וֶ/אֱמֶֽת׀־׀־׀
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/006.yaml
  text: Then Yahweh passed before him and proclaimed[a], “Yahweh, Yahweh, a God compassionate and gracious, slow to anger, and abounding in steadfast love and faithfulness.”
translation:
  language: fr
  text: 'Alors Yahweh passa devant lui et proclama : « Yahweh, Yahweh, Dieu compatissant, qui fait grâce, lent à la colère, riche en amour fidèle et en fidélité[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « riche en amour fidèle et en vérité ».
    reason: Alternative lexicale pour אֱמֶת, qui peut désigner la fidélité, la fiabilité ou la vérité.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel révélé dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וַיַּעֲבֹר עַל־פָּנָיו
  choice: passa devant lui
  rationale: Cette expression rend naturellement en français le mouvement de Yahweh devant Moïse, sans calquer littéralement l’hébreu « sur/devant sa face ».
- source_word: וַיִּקְרָא
  choice: proclama
  rationale: Dans cette déclaration solennelle du nom et du caractère divins, « proclama » convient mieux que le simple « appela ».
- source_word: אֵל
  choice: Dieu
  rationale: Le nom est en apposition après la répétition de Yahweh et introduit les attributs qui suivent; le français naturel n’exige pas ici d’article indéfini.
- source_word: רַחוּם
  choice: compatissant
  rationale: Le terme exprime une compassion profonde; « compatissant » en donne un équivalent français actuel et précis.
- source_word: חַנּוּן
  choice: plein de grâce
  rationale: Cette formulation exprime la disposition à accorder faveur et grâce tout en restant claire et digne en français moderne.
- source_word: אֶרֶךְ אַפַּיִם
  choice: lent à la colère
  rationale: Cet équivalent idiomatique conserve le sens de l’expression hébraïque, littéralement liée à la longueur des narines, sans en reproduire l’image opaque.
- source_word: רַב
  choice: riche en
  rationale: Avec des noms abstraits, le mot indique l’abondance; « riche en » est naturel et conserve cette idée.
- source_word: חֶסֶד
  choice: amour fidèle
  rationale: Cette expression réunit les dimensions d’amour, de bonté durable et de loyauté relationnelle contenues dans חֶסֶד.
- source_word: אֱמֶת
  choice: fidélité
  rationale: Dans le couple חֶסֶד וֶאֱמֶת, le terme souligne ici le caractère fiable et constant de Dieu; le sens possible de « vérité » est signalé en note.
theological_decisions:
- issue: Répétition du nom divin יְהוָה
  choice: « Yahweh, Yahweh »
  alternative: « le Seigneur Dieu »
  rationale: L’hébreu répète exactement le nom d’alliance pour produire un effet d’insistance. La traduction garde cette répétition et ne transforme pas le second nom en titre.
- issue: Sens de אֱמֶת dans le couple חֶסֶד וֶאֱמֶת
  choice: « fidélité »
  alternative: « vérité »
  rationale: « Fidélité » convient au portrait de la fiabilité constante de Dieu dans ce contexte, mais « vérité » demeure un sens lexical authentique et est donc conservé en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe solennelle de la proclamation est conservée, tandis que les idiomes hébreux sont rendus de façon naturelle. Le nom divin et sa répétition restent visibles.
