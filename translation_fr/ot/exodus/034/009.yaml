  text: וַ/יֹּ֡אמֶר אִם נָא֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲדֹנָ֔/י יֵֽלֶךְ נָ֥א אֲדֹנָ֖/י בְּ/קִרְבֵּ֑/נוּ כִּ֤י עַם קְשֵׁה עֹ֨רֶף֙ ה֔וּא וְ/סָלַחְתָּ֛ לַ/עֲוֺנֵ֥/נוּ וּ/לְ/חַטָּאתֵ֖/נוּ וּ/נְחַלְתָּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/009.yaml
  text: And he said[a], “If now I have found favor in your eyes, Lord, please let the Lord go in our midst, though it is a stiff-necked people; and forgive our iniquity and our sin[b], and take us as your inheritance.”
translation:
  language: fr
  text: 'Il dit : « Si j’ai trouvé grâce à tes yeux, Seigneur, que le Seigneur, je t’en prie, marche au milieu de nous[a], bien que ce soit un peuple à la nuque raide. Pardonne notre faute et notre péché, et prends-nous pour ton héritage[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi nous » ou « avec nous ». L’hébreu dit littéralement « au milieu de nous ».
    reason: lexical_alternative
  - marker: b
    text: Ou « fais de nous ta possession ». Le verbe hébreu peut désigner le fait de prendre ou de recevoir comme héritage ou comme bien propre.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵן
  choice: grâce
  rationale: Dans l’expression française consacrée « trouver grâce aux yeux de quelqu’un », « grâce » rend naturellement la faveur accordée, sans exiger ici un sens théologique ultérieur.
- source_word: בְּעֵינֶיךָ
  choice: à tes yeux
  rationale: Cette tournure française conserve l’image et l’idiome relationnel de l’hébreu.
- source_word: אֲדֹנָי
  choice: Seigneur / le Seigneur
  rationale: Il s’agit du titre אֲדֹנָי et non du nom divin YHWH. La première occurrence est une apostrophe ; la seconde reste à la troisième personne, conformément à la formulation hébraïque.
- source_word: יֵלֶךְ נָא ... בְּקִרְבֵּנוּ
  choice: que le Seigneur marche, je t’en prie, au milieu de nous
  rationale: « Marcher au milieu de nous » conserve l’idée hébraïque de déplacement et de présence au sein du peuple ; « je t’en prie » exprime la particule נָא.
- source_word: קְשֵׁה עֹרֶף
  choice: au cou raide
  rationale: Cette formulation préserve la métaphore corporelle hébraïque de l’obstination plutôt que de la réduire au seul adjectif « obstiné ».
- source_word: עַם
  choice: peuple
  rationale: Le contexte présente Israël comme peuple de l’alliance, non principalement comme entité politique.
- source_word: עָוֹן
  choice: faute
  rationale: « Faute » exprime le mal commis dans un français moderne et reste distinct du terme suivant, « péché ».
- source_word: חַטָּאת
  choice: péché
  rationale: C’est l’équivalent courant et direct, qui maintient le parallélisme avec עָוֹן.
- source_word: וּנְחַלְתָּנוּ
  choice: prends-nous pour ton héritage
  rationale: Cette traduction conserve l’image d’un peuple que Dieu prend comme son lot ou son bien propre, sans réduire le verbe à une simple possession matérielle.
theological_decisions:
- issue: Valeur de אֲדֹנָי dans une prière adressée à YHWH
  choice: Seigneur / le Seigneur
  alternative: mon Seigneur / Seigneur DIEU
  rationale: Le texte emploie le titre אֲדֹנָי, non le nom divin lui-même. La traduction n’introduit donc ni « l’ÉTERNEL » ni une expansion absente du texte.
- issue: Rapport logique introduit par כִּי
  choice: bien que ce soit un peuple au cou raide
  alternative: car c’est un peuple au cou raide
  rationale: Dans ce contexte d’intercession, la valeur concessive rend le mieux la demande paradoxale de la présence et du pardon divins envers un peuple obstiné. La valeur causale demeure grammaticalement possible et est signalée en note.
- issue: Sens de וּנְחַלְתָּנוּ
  choice: prends-nous pour ton héritage
  alternative: fais de nous ta possession
  rationale: La formulation retenue préserve l’image d’appartenance d’alliance et la nuance d’héritage, sans préciser davantage que ne le fait le verbe hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore « au cou raide » et l’image de l’héritage sont conservées en raison de leur portée dans le contexte de l’Exode. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils expliquent.
