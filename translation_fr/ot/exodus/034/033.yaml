  text: וַ/יְכַ֣ל מֹשֶׁ֔ה מִ/דַּבֵּ֖ר אִתָּ֑/ם וַ/יִּתֵּ֥ן עַל פָּנָ֖י/ו מַסְוֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/033.yaml
  text: When Moses finished speaking with them[a], he put a veil over his face.
translation:
  language: fr
  text: Lorsque Moïse eut fini de parler avec eux[a], il mit un voile sur son visage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « eut cessé de parler avec eux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: eut fini
  rationale: Le verbe כלה au wayyiqtol marque ici l’achèvement de l’action de parler. La tournure « lorsque… eut fini » exprime naturellement en français l’antériorité immédiate par rapport à l’action suivante.
- source_word: מִדַּבֵּר
  choice: de parler
  rationale: 'L’infinitif construit de דבר précédé de מ, après כלה, exprime l’achèvement de l’action : « finir de parler ».'
- source_word: אִתָּם
  choice: avec eux
  rationale: La préposition אֵת avec suffixe signifie le plus directement « avec eux ». Cette formulation conserve la nuance d’échange présente dans l’hébreu, sans la réduire à « leur parler ».
- source_word: וַיִּתֵּן
  choice: il mit
  rationale: נתן suivi de עַל peut signifier mettre ou placer quelque chose sur une personne ou une chose. « Mit » est naturel et précis dans ce contexte.
- source_word: עַל פָּנָיו
  choice: sur son visage
  rationale: La préposition עַל indique ici l’emplacement du voile. « Sur son visage » est l’expression française naturelle et ne précise pas davantage que l’hébreu la manière exacte dont le voile le couvrait.
- source_word: מַסְוֶה
  choice: un voile
  rationale: Dans ce contexte, le nom désigne une pièce servant à couvrir le visage. « Voile » est le terme français établi et précis.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé antérieur après « lorsque » convient au registre narratif biblique sans être archaïque. La traduction conserve « avec eux », conformément à l’hébreu, et signale en note l’autre nuance possible de כלה.
