  text: שֵׁ֤שֶׁת יָמִים֙ תַּעֲבֹ֔ד וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י תִּשְׁבֹּ֑ת בֶּ/חָרִ֥ישׁ וּ/בַ/קָּצִ֖יר תִּשְׁבֹּֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/021.yaml
  text: Six days you shall work[a], but on the seventh day you shall cease; in plowing time and in harvest you shall cease.
translation:
  language: fr
  text: Pendant six jours, tu travailleras, mais le septième jour, tu cesseras de travailler[a] ; au temps des labours et de la moisson, tu cesseras de travailler.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu te reposeras ». Le verbe hébreu signifie « cesser » ou « s’arrêter » et, par extension, « se reposer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Pendant six jours
  rationale: Cette formulation française exprime naturellement la durée indiquée par le groupe nominal hébreu et prépare le contraste avec le septième jour.
- source_word: תַּעֲבֹד
  choice: tu travailleras
  rationale: Le futur français convient ici à une prescription d'alliance et conserve la formulation directe et solennelle de l'hébreu.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: mais le septième jour
  rationale: Le waw marque ici un contraste entre les six jours de travail et le septième jour ; « mais » le rend clairement en français.
- source_word: תִּשְׁבֹּת
  choice: tu cesseras toute activité
  rationale: Le verbe שׁבת signifie fondamentalement cesser ou s'arrêter. En français, l'ajout idiomatique « toute activité » rend la cessation du travail imposée par le contexte sans réduire le sens au repos physique.
- source_word: בֶּחָרִישׁ
  choice: au temps des labours
  rationale: Le nom peut désigner le labour ou la saison des labours ; cette expression française transmet clairement la valeur temporelle et agricole.
- source_word: וּבַקָּצִיר
  choice: et de la moisson
  rationale: Coordonné à « au temps des labours », ce choix concis désigne naturellement la période de la récolte.
- source_word: תִּשְׁבֹּת (seconde occurrence)
  choice: tu cesseras toute activité
  rationale: 'La répétition du même rendu préserve l''insistance de l''hébreu : l''arrêt s''impose même pendant les périodes agricoles cruciales.'
theological_decisions:
- issue: Rendu du verbe sabbatique שׁבת
  choice: Traduire par « cesser toute activité » aux deux occurrences.
  alternative: Traduire par « te reposer ».
  rationale: Le choix retenu conserve le sens fondamental de cessation et souligne l'arrêt du travail, y compris lors des labours et de la moisson, sans limiter le commandement à l'idée de récupération physique.
translation_notes:
  register: Français moderne, courant et digne. Le tutoiement singulier reflète les verbes hébreux à la deuxième personne du masculin singulier. La répétition finale est conservée pour reproduire l'insistance du texte source.
