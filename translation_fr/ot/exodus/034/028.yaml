  text: וַֽ/יְהִי שָׁ֣ם עִם יְהוָ֗ה אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔ל וּ/מַ֖יִם לֹ֣א שָׁתָ֑ה וַ/יִּכְתֹּ֣ב עַל הַ/לֻּחֹ֗ת אֵ֚ת דִּבְרֵ֣י הַ/בְּרִ֔ית עֲשֶׂ֖רֶת הַ/דְּבָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/028.yaml
  text: And he was there with Yahweh forty days and forty nights[a]; he ate no bread and drank no water. And he wrote on the tablets the words of the covenant[b], the ten words.
translation:
  language: fr
  text: Moïse était là avec Yahweh pendant quarante jours et quarante nuits. Il ne mangea pas de pain et ne but pas d’eau. Il écrivit[a] sur les tablettes les paroles de l’alliance, les dix paroles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Yahweh écrivit ». Ailleurs, l’écriture sur les tablettes est attribuée à Yahweh (voir Exode 34.1 ; Deutéronome 10.4).'
    reason: alternative_reading
  - marker: b
    text: 'Traditionnellement : « les Dix Commandements ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin afin de le distinguer du titre « Seigneur » et de préserver sa fonction de nom propre.
- source_word: וַיְהִי שָׁם עִם
  choice: Moïse resta là, avec
  rationale: Le référent implicite est explicité en français pour éviter une ouverture obscure; « resta » rend naturellement la présence prolongée exprimée dans le contexte.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: quarante jours et quarante nuits
  rationale: Rendu direct et idiomatique de l’expression de durée.
- source_word: לֶחֶם לֹא אָכַל
  choice: Il ne mangea pas de pain
  rationale: Conserve le nom concret « pain » plutôt que de généraliser en « nourriture ».
- source_word: וּמַיִם לֹא שָׁתָה
  choice: et ne but pas d’eau
  rationale: Rendu direct qui maintient le parallélisme avec l’absence de nourriture.
- source_word: וַיִּכְתֹּב
  choice: Il écrivit
  rationale: Le verbe signifie simplement « écrire »; le sujet n’étant pas répété en hébreu, le texte principal suit la continuité syntaxique immédiate, tout en signalant l’autre compréhension en note.
- source_word: עַל הַלֻּחֹת
  choice: sur les tablettes
  rationale: « Tablettes » est clair en français courant et rend le support matériel sans ajouter ici « de pierre », absent de ce verset.
- source_word: דִּבְרֵי הַבְּרִית
  choice: les paroles de l’alliance
  rationale: Préserve le rapport syntaxique et la terminologie d’alliance du texte hébreu.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: les dix paroles
  rationale: Rend au plus près l’expression hébraïque; l’appellation traditionnelle est donnée en note.
theological_decisions:
- issue: Sujet de « il écrivit »
  choice: Le texte principal laisse Moïse comme sujet naturel dans la continuité immédiate du verset.
  alternative: 'Comprendre Yahweh comme sujet: « Yahweh écrivit ».'
  rationale: Le verbe hébreu est à la troisième personne du masculin singulier sans sujet exprimé. La syntaxe immédiate poursuit les actions de Moïse, mais Exode 34.1 et Deutéronome 10.4 attribuent l’écriture à Yahweh. La note conserve cette tension au lieu de l’harmoniser.
- issue: Rendu de עֲשֶׂרֶת הַדְּבָרִים
  choice: les dix paroles
  alternative: les Dix Commandements
  rationale: « Les dix paroles » reflète directement l’hébreu, tandis que « les Dix Commandements » est l’appellation traditionnelle et interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans archaïsmes marqués. Les marqueurs [a] et [b] figurent dans le texte à l’endroit précis des difficultés concernées.
