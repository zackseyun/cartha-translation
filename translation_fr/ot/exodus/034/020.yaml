  text: וּ/פֶ֤טֶר חֲמוֹר֙ תִּפְדֶּ֣ה בְ/שֶׂ֔ה וְ/אִם לֹ֥א תִפְדֶּ֖ה וַ/עֲרַפְתּ֑/וֹ כֹּ֣ל בְּכ֤וֹר בָּנֶ֨י/ךָ֙ תִּפְדֶּ֔ה וְ/לֹֽא יֵרָא֥וּ פָנַ֖/י רֵיקָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/020.yaml
  text: You shall redeem the firstborn of a donkey with a lamb[a]; and if you do not redeem it, then you shall break its neck. You shall redeem every firstborn of your sons[c][b]. And none shall appear before me empty-handed.
translation:
  language: fr
  text: Tu rachèteras le premier-né d’un âne par une bête du petit bétail[a] ; si tu ne le rachètes pas, tu lui briseras la nuque. Tu rachèteras tout premier-né parmi tes fils. Personne ne se présentera devant moi[b] les mains vides[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner un mouton ou une chèvre du petit bétail.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « devant ma face », expression hébraïque qui signifie se présenter en présence de Dieu.'
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire sans apporter de don ou d’offrande.
    reason: cultural_note
lexical_decisions:
- source_word: פֶטֶר חֲמוֹר
  choice: le premier-né d’une ânesse
  rationale: פֶטֶר désigne celui qui ouvre le premier le sein maternel. Dans cette prescription, « premier-né » est naturel en français, et « ânesse » explicite le sexe impliqué par l’idée de mise bas sans modifier l’espèce désignée par חֲמוֹר.
- source_word: תִּפְדֶּה
  choice: tu rachèteras
  rationale: Dans ce contexte juridique et cultuel, פדה désigne la libération du premier-né au moyen d’un substitut. « Racheter » conserve ce sens sans réduire l’acte à une simple transaction commerciale.
- source_word: בְשֶׂה
  choice: par un animal du petit bétail
  rationale: שֶׂה peut désigner une bête du troupeau, qu’il s’agisse d’un mouton ou d’une chèvre. Cette formulation conserve l’étendue du terme hébreu plutôt que de la limiter à « agneau ».
- source_word: וַעֲרַפְתּוֹ
  choice: tu lui briseras la nuque
  rationale: Le verbe ערף désigne ici l’action de rompre la nuque de l’animal. La formulation française est directe et précise.
- source_word: כֹּל בְּכוֹר בָּנֶיךָ
  choice: tout premier-né parmi tes fils
  rationale: La traduction maintient la référence explicite aux fils et rend naturellement la relation partitive de la construction hébraïque.
- source_word: יֵרָאוּ פָנַי
  choice: personne ne se présentera devant moi
  rationale: L’expression hébraïque, littéralement liée au fait d’être vu devant la face de Dieu, est un idiome cultuel signifiant se présenter en sa présence. Le pluriel hébreu à valeur générale est rendu naturellement par « personne ».
- source_word: רֵיקָם
  choice: les mains vides
  rationale: Dans ce contexte de comparution cultuelle, רֵיקָם signifie venir sans rien apporter. L’expression idiomatique française préserve cette implication.
theological_decisions:
- issue: Référence divine à la première personne dans la dernière proposition
  choice: devant moi
  alternative: devant ma face
  rationale: « Devant moi » rend naturellement l’idiome hébreu tout en conservant la parole divine directe. La note signale la forme littérale sans lui imposer une nuance théologique supplémentaire.
- issue: Portée genrée de בָּנֶיךָ
  choice: tes fils
  alternative: tes enfants
  rationale: Le texte hébreu désigne explicitement les fils. La formulation genrée est donc conservée au lieu d’être généralisée à tous les enfants.
translation_notes:
  register: Français moderne, digne et direct, avec maintien du tutoiement singulier des prescriptions adressées à Israël. Le vocabulaire juridique et cultuel reste accessible ; « animal du petit bétail » est retenu pour préserver la portée exacte de שֶׂה.
