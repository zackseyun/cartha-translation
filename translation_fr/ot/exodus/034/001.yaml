base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/001.yaml
  text: Then Yahweh said to Moses[a], “Cut for yourself two stone tablets like the first ones, and I will write on the tablets the words that were on the first tablets[b], which you broke.”
translation:
  language: fr
  text: 'Puis Yahweh dit à Moïse : « Taille-toi[a] deux tablettes de pierre semblables aux premières, et j’écrirai sur les tablettes les paroles qui figuraient sur les premières tablettes, que tu as brisées. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Façonne-toi » ou « Découpe-toi » deux tablettes de pierre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le verbe narratif courant אמר introduit ici directement les paroles de Yahweh ; « dit » est l’équivalent français naturel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin יהוה. La translittération « Yahweh » conserve ce nom propre au lieu de lui substituer un titre.
- source_word: פְּסָל
  choice: Taille
  rationale: L’impératif désigne l’action de façonner des tablettes dans la pierre. « Taille » est concret, actuel et adapté au matériau.
- source_word: לְךָ
  choice: pour toi
  rationale: Cette formulation garde explicitement le pronom datif hébreu sans imposer l’idée plus forte que Moïse agirait à son seul bénéfice.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: deux tablettes de pierre
  rationale: Cette expression française claire conserve à la fois l’objet et son matériau.
- source_word: כָּרִאשֹׁנִים
  choice: semblables aux premières
  rationale: Le כ comparatif indique que les nouvelles tablettes doivent correspondre aux premières.
- source_word: וְכָתַבְתִּי
  choice: et j’écrirai
  rationale: La première personne exprime ici l’action future promise par Yahweh ; la coordination hébraïque est conservée simplement.
- source_word: הַדְּבָרִים
  choice: les paroles
  rationale: דברים signifie littéralement « paroles » ou « mots ». « Paroles » convient au contenu de l’alliance sans expliciter celui-ci par « commandements ».
- source_word: אֲשֶׁר הָיוּ עַל הַלֻּחֹת הָרִאשֹׁנִים
  choice: qui figuraient sur les premières tablettes
  rationale: « Figuraient sur » exprime naturellement en français la présence d’un texte inscrit sur une surface, sans ajouter au sens.
- source_word: אֲשֶׁר שִׁבַּרְתָּ
  choice: celles que tu as brisées
  rationale: Le relatif reprend les premières tablettes ; « brisées » rend directement שבר et accorde clairement le participe avec « tablettes ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Puisque le texte hébreu emploie le tétragramme comme nom propre, « Yahweh » préserve le nom personnel et évite de le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en évitant les tournures archaïques. Le marqueur [a] est placé immédiatement après le verbe auquel sa variante se rapporte.
