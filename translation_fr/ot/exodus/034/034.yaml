  text: וּ/בְ/בֹ֨א מֹשֶׁ֜ה לִ/פְנֵ֤י יְהוָה֙ לְ/דַבֵּ֣ר אִתּ֔/וֹ יָסִ֥יר אֶת הַ/מַּסְוֶ֖ה עַד צֵאת֑/וֹ וְ/יָצָ֗א וְ/דִבֶּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֖ת אֲשֶׁ֥ר יְצֻוֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/034.yaml
  text: But whenever Moses went in before Yahweh to speak with him[a], he would remove the veil until he came out; then he would come out and speak to the sons of Israel what he had been commanded.
translation:
  language: fr
  text: Mais, chaque fois que Moïse entrait en présence de Yahweh pour parler avec lui, il retirait le voile jusqu’à ce qu’il sorte. Puis il sortait et disait aux fils d’Israël[a] ce qui lui avait été ordonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « aux Israélites » ou « au peuple d’Israël ». L’hébreu dit littéralement : « aux fils d’Israël ».'
    reason: Alternative lexicale et explicitation de l’expression hébraïque collective.
lexical_decisions:
- source_word: וּבְבֹא
  choice: Mais chaque fois que … entrait
  rationale: La construction avec בְּ et l’infinitif situe une circonstance récurrente. « Chaque fois que » rend cette valeur habituelle, tandis que « mais » marque le léger contraste avec le verset précédent.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי signifie « devant, en présence de ». La formulation retenue reste proche de l’hébreu tout en étant intelligible en français.
- source_word: לְדַבֵּר אִתּוֹ
  choice: pour parler avec lui
  rationale: L’infinitif exprime ici le but. Avec אִתּוֹ, « parler avec lui » conserve la nuance d’échange, sans exclure que Moïse reçoive principalement les paroles divines.
- source_word: יָסִיר אֶת־הַמַּסְוֶה
  choice: il retirait le voile
  rationale: L’imparfait français exprime naturellement l’action habituelle passée. מַסְוֶה désigne la pièce qui couvrait le visage de Moïse.
- source_word: עַד־צֵאתוֹ
  choice: jusqu’à ce qu’il ressorte
  rationale: La préposition עַד suivie de l’infinitif marque le terme de la durée. « Ressorte » indique clairement qu’il quitte le lieu où il était entré.
- source_word: וְיָצָא וְדִבֶּר
  choice: Puis il sortait et disait
  rationale: Ces verbes poursuivent la séquence habituelle. « Puis » en explicite sobrement l’enchaînement.
- source_word: אֶל־בְּנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: Cette traduction garde l’expression hébraïque littérale et traditionnelle; une note fournit les équivalents collectifs plus courants en français.
- source_word: אֵת אֲשֶׁר יְצֻוֶּה
  choice: ce qui lui avait été ordonné
  rationale: Le pual passif présente les instructions reçues par Moïse avant qu’il les transmette; le plus-que-parfait rend cette antériorité.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Yahvé
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre de l’alliance sans le remplacer par un titre.
- issue: Portée de l’expression בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: Israélites; peuple d’Israël
  rationale: Le rendu principal conserve la forme masculine de l’expression hébraïque désignant collectivement la communauté d’Israël. La note signale les formulations françaises idiomatiques sans modifier silencieusement l’image du texte.
- issue: Agent implicite dans אֲשֶׁר יְצֻוֶּה
  choice: 'forme passive : « ce qui lui avait été ordonné »'
  alternative: « ce que Yahweh lui avait ordonné »
  rationale: L’hébreu laisse l’agent du passif inexprimé, bien que le contexte l’identifie à Yahweh. La traduction conserve cette formulation implicite.
translation_notes:
  register: Français international moderne, digne et accessible. L’imparfait et « chaque fois que » rendent la répétition habituelle des actions. La syntaxe demeure proche de l’hébreu sans être lourde.
