  text: רֵאשִׁ֗ית בִּכּוּרֵי֙ אַדְמָ֣תְ/ךָ֔ תָּבִ֕יא בֵּ֖ית יְהוָ֣ה אֱלֹהֶ֑י/ךָ לֹא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/026.yaml
  text: You shall bring the first of the firstfruits of your ground to the house of Yahweh your God[a]. You shall not boil a young goat in its mother's milk.
translation:
  language: fr
  text: Tu apporteras à la maison de Yahweh, ton Dieu, la première part des prémices de ton sol[a]. Tu ne feras pas bouillir un chevreau dans le lait de sa mère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le meilleur des prémices de ton sol ».'
    reason: Le mot רֵאשִׁית peut désigner ce qui est premier et, dans ce contexte, la part de choix ; le texte principal conserve la notion première de priorité.
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: les prémices des premiers produits
  rationale: Cette formulation conserve la construction redoublée de l’hébreu, qui met en avant la part initiale des premières récoltes, sans imposer l’interprétation qualitative « le meilleur ».
- source_word: אַדְמָתְךָ
  choice: ton sol
  rationale: Le terme désigne ici la terre cultivée qui produit les récoltes; « sol » est concret et plus précis que le sens territorial possible de « pays ».
- source_word: תָּבִיא
  choice: Tu apporteras
  rationale: Dans ce contexte juridique, l’imparfait hiphil exprime une prescription. Le futur français convient au registre législatif tout en restant naturel.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: à la maison de Yahweh ton Dieu
  rationale: « Maison » respecte le terme hébreu sans introduire prématurément la désignation historique de « Temple »; le nom divin est translittéré « Yahweh ».
- source_word: לֹא תְבַשֵּׁל
  choice: Tu ne feras pas cuire
  rationale: Le verbe peut désigner la cuisson ou, plus précisément, l’action de faire bouillir. « Faire cuire » préserve ici l’étendue lexicale sans préciser davantage que le contexte.
- source_word: גְּדִי
  choice: un chevreau
  rationale: « Chevreau » est le terme français courant et précis pour le petit de la chèvre.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: dans le lait de sa mère
  rationale: La formulation est naturelle en français et reproduit exactement la relation maternelle exprimée par l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve plutôt que de lui substituer un titre.
- issue: Sens de רֵאשִׁית dans רֵאשִׁית בִּכּוּרֵי
  choice: les prémices des premiers produits
  alternative: le meilleur des premiers produits
  rationale: Le sens temporel ou prioritaire est explicite, tandis que l’idée de qualité supérieure demeure possible mais interprétative; le texte principal évite donc de trancher en faveur de « meilleur ».
- issue: Portée de l’interdiction finale
  choice: traduction littérale de l’acte interdit
  alternative: explicitation d’une règle alimentaire ou rituelle plus large
  rationale: Le verset interdit littéralement de cuire un chevreau dans le lait de sa mère. La traduction ne développe pas cette prescription en système plus large, ce qui dépasserait le texte.
translation_notes:
  register: Français moderne, digne et accessible. Le futur simple maintient le ton normatif du droit de l’alliance. « Prémices » est un terme biblique encore intelligible; il est éclairé par « premiers produits ». Le tutoiement singulier reflète les formes hébraïques adressées à Israël comme interlocuteur collectif.
