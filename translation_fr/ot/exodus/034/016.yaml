source:
  edition: WLC
  text: וְ/לָקַחְתָּ֥ מִ/בְּנֹתָ֖י/ו לְ/בָנֶ֑י/ךָ וְ/זָנ֣וּ בְנֹתָ֗י/ו אַחֲרֵי֙ אֱלֹ֣הֵי/הֶ֔ן וְ/הִזְנוּ֙ אֶת בָּנֶ֔י/ךָ אַחֲרֵ֖י אֱלֹהֵי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/016.yaml
  text: and you take some of his daughters for your sons[b][a], and his daughters prostitute themselves after their gods and make your sons prostitute themselves after their gods.
translation:
  language: fr
  text: tu prendrais alors certaines de ses filles pour tes fils, ses filles se prostitueraient[a] en suivant leurs dieux, et elles entraîneraient[b] tes fils à se prostituer en suivant leurs dieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se livreraient à la prostitution ». L’hébreu emploie ici le langage de l’infidélité sexuelle comme métaphore du fait de suivre d’autres dieux.
    reason: lexical_alternative
  - marker: b
    text: Autrement dit, elles conduiraient tes fils à l’idolâtrie en les amenant à suivre leurs dieux.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: tu prendrais alors
  rationale: Le qatal avec waw poursuit ici la mise en garde en exprimant une conséquence possible. Le conditionnel français s’intègre naturellement à cette séquence sans transformer explicitement « prendre » en « marier ».
- source_word: מִבְּנֹתָיו
  choice: certaines de ses filles
  rationale: 'La préposition מִן a ici une valeur partitive : il s’agit de prendre des filles parmi les siennes.'
- source_word: לְבָנֶיךָ
  choice: pour tes fils
  rationale: La préposition לְ indique ici la destination dans le cadre d’un arrangement matrimonial ; « pour tes fils » reste naturel et fidèle.
- source_word: וְזָנוּ
  choice: ses filles se prostitueraient
  rationale: Le verbe זנה emploie l’image forte de la prostitution pour parler de l’infidélité cultuelle. La traduction conserve cette métaphore plutôt que de la réduire à « pratiqueraient l’idolâtrie ».
- source_word: אַחֲרֵי אֱלֹהֵיהֶן
  choice: en suivant leurs dieux
  rationale: אַחֲרֵי exprime le fait d’aller à la suite d’autres dieux. « En suivant » restitue clairement cet idiome en français moderne.
- source_word: וְהִזְנוּ
  choice: et elles entraîneraient tes fils à se prostituer
  rationale: 'La forme hifil est causative : les filles amèneraient les fils à adopter la même infidélité cultuelle. « Entraîneraient… à » rend cette causalité sans suggérer nécessairement une contrainte absolue.'
- source_word: אֶת בָּנֶיךָ
  choice: tes fils
  rationale: Le nom avec suffixe masculin singulier est rendu directement, en conservant la précision de genre du texte.
- source_word: אֱלֹהֵיהֶן
  choice: leurs dieux
  rationale: Le pluriel avec suffixe féminin pluriel désigne les divinités auxquelles ces filles sont attachées.
theological_decisions:
- issue: Traduction de זנה dans un contexte d’idolâtrie
  choice: Conserver la métaphore par « se prostituer »
  alternative: « pratiquer l’idolâtrie » ou « être infidèles »
  rationale: L’hébreu présente délibérément l’apostasie religieuse sous l’image sexuelle de la prostitution. Préserver cette tension maintient la force théologique du texte sans l’expliciter à sa place.
- issue: Langage genré dans בנותיו et בניך
  choice: Employer « filles » et « fils »
  alternative: Employer « enfants » ou « descendants »
  rationale: Le texte hébreu désigne précisément des filles et des fils dans un contexte matrimonial ; une formulation neutre effacerait cette précision.
translation_notes:
  register: Français international moderne, naturel et digne. Le conditionnel rend la conséquence envisagée dans la mise en garde ; la métaphore volontairement abrupte de la prostitution est maintenue, tandis que « en suivant » rend l’idiome hébreu de manière intelligible.
