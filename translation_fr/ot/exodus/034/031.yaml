  yaml_path: translation/ot/exodus/034/031.yaml
  text: But Moses called to them[a], and Aaron and all the leaders of the congregation returned to him, and Moses spoke to them.
translation:
  language: fr
  text: Mais Moïse les appela, et Aaron ainsi que tous les responsables de la communauté revinrent vers lui. Alors Moïse leur parla.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא אֲלֵהֶם
  choice: les appela
  rationale: Le verbe קרא avec אֶל indique que Moïse s’adresse à ceux qui s’étaient tenus à distance. « Les appela » est naturel et n’ajoute pas la nuance d’autorité que pourrait suggérer « les convoqua ».
- source_word: וַיָּשֻׁבוּ אֵלָיו
  choice: revinrent vers lui
  rationale: שׁוב exprime ici le retour auprès de Moïse après le recul décrit au verset précédent. « Vers lui » rend explicitement la direction portée par אֵלָיו.
- source_word: הַנְּשִׂאִים בָּעֵדָה
  choice: les responsables de la communauté
  rationale: נָשִׂיא désigne les personnes qui dirigent ou représentent le groupe, tandis que עֵדָה désigne ici la collectivité d’Israël. « Responsables de la communauté » est actuel, clair et digne; il évite l’archaïsme de « princes ».
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: דבר au piel est le verbe courant pour parler. « Parla » convient au registre narratif sans préciser un contenu que le verset ne donne pas.
- source_word: וַ (initial)
  choice: Mais
  rationale: Le waw poursuit le récit tout en marquant, dans le contexte, un léger contraste avec la crainte et l’éloignement du verset précédent.
- source_word: וַ (devant וַיְדַבֵּר)
  choice: Alors
  rationale: Le waw introduit la suite narrative après le retour d’Aaron et des responsables. « Alors » rend naturellement cette progression en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe est divisée en deux phrases pour éviter une accumulation lourde de coordinations, sans modifier l’enchaînement du texte hébreu.
