source:
  edition: WLC
  text: נֹצֵ֥ר חֶ֨סֶד֙ לָ/אֲלָפִ֔ים נֹשֵׂ֥א עָוֺ֛ן וָ/פֶ֖שַׁע וְ/חַטָּאָ֑ה וְ/נַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֣ד עֲוֺ֣ן אָב֗וֹת עַל בָּנִים֙ וְ/עַל בְּנֵ֣י בָנִ֔ים עַל שִׁלֵּשִׁ֖ים וְ/עַל רִבֵּעִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/007.yaml
  text: keeping steadfast love for thousands[a], forgiving iniquity and transgression and sin, but he will by no means leave unpunished, visiting the iniquity of fathers on children and on children's children[c][b], to the third and to the fourth generation.
translation:
  language: fr
  text: qui garde son amour fidèle pour des milliers[a], qui pardonne la faute, la transgression et le péché, mais qui ne laisse certainement pas le coupable impuni[b], qui fait retomber la faute des pères[c] sur les enfants et sur les petits-enfants, jusqu’à la troisième et à la quatrième génération.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour mille générations ». L’hébreu dit simplement « pour des milliers », probablement en contraste avec le jugement qui s’étend « jusqu’à la troisième et à la quatrième génération ».
    reason: alternative_reading
  - marker: b
    text: Ou « mais qui n’acquitte certainement pas » ou « mais qui ne tient certainement pas pour innocent ».
    reason: lexical_alternative
  - marker: c
    text: L’hébreu dit « pères » ; ce terme est conservé parce que le texte source emploie ici une forme spécifiquement masculine, bien que l’expression décrive la succession des générations.
    reason: cultural_note
lexical_decisions:
- source_word: נֹצֵר
  choice: garde
  rationale: Le participe qal exprime une action continue de conservation ou de maintien. « Garde » reste proche de l’hébreu et convient à cette proclamation solennelle.
- source_word: חֶסֶד
  choice: amour fidèle
  rationale: Cette expression rend à la fois la bienveillance et la fidélité durable, notamment dans le cadre de l’alliance, sans recourir à un terme archaïque.
- source_word: לָאֲלָפִים
  choice: pour des milliers
  rationale: L’hébreu dit simplement « pour des milliers » sans préciser l’objet. La traduction conserve cette ouverture plutôt que d’ajouter « générations » dans le texte principal.
- source_word: נֹשֵׂא
  choice: pardonne
  rationale: Bien que le sens concret soit « porter », la construction avec les trois termes désignant le péché a ici le sens idiomatique de pardonner.
- source_word: עָוֺן
  choice: faute
  rationale: « Faute » peut désigner l’acte coupable et, selon le contexte, sa culpabilité ou ses conséquences. Le même choix est maintenu lors de la seconde occurrence.
- source_word: פֶשַׁע
  choice: transgression
  rationale: Le terme évoque une rupture ou une rébellion. « Transgression » en conserve la portée morale et s’intègre naturellement à l’énumération.
- source_word: חַטָּאָה
  choice: péché
  rationale: C’est l’équivalent français direct et usuel, qui achève clairement la triple désignation du mal.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: mais qui ne laisse certainement pas impuni
  rationale: La combinaison de l’infinitif absolu et du verbe conjugué renforce la négation. Cette formulation française conserve l’idée judiciaire et l’intensité sans ajouter explicitement un objet absent de l’hébreu.
- source_word: פֹּקֵד
  choice: fait retomber
  rationale: Dans ce contexte de jugement intergénérationnel, « fait retomber » exprime naturellement le fait que la faute atteint les descendants, tout en évitant de préciser davantage que le texte la manière exacte de cette visitation.
- source_word: עֲוֺן אָבוֹת
  choice: la faute des pères
  rationale: « Pères » respecte la forme masculine explicite du texte source; une note précise que l’expression décrit une descendance générationnelle.
- source_word: עַל בָּנִים וְעַל בְּנֵי בָנִים
  choice: sur les enfants et sur les petits-enfants
  rationale: Cette formulation française naturelle rend la succession des descendants sans imposer un genre aux générations concernées.
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: jusqu’à la troisième et à la quatrième génération
  rationale: Le mot « génération » est sous-entendu par les ordinaux et la suite familiale. Son ajout explicite est nécessaire en français pour une lecture claire.
theological_decisions:
- issue: La tension entre le pardon divin et la justice dans וְנַקֵּה לֹא יְנַקֶּה
  choice: Maintenir pleinement le pardon, puis affirmer avec force que Dieu ne laisse pas impuni.
  alternative: « mais qui n’acquitte certainement pas » ou « mais qui ne tient certainement pas pour innocent »
  rationale: Le verset juxtapose intentionnellement miséricorde et justice. La traduction ne cherche ni à atténuer l’une, ni à expliquer systématiquement leur articulation.
- issue: L’identité de ce qui est laissé impuni
  choice: Ne pas ajouter « le coupable » dans le texte principal.
  alternative: « mais qui ne laisse certainement pas le coupable impuni »
  rationale: L’objet est implicite en hébreu. La formulation sans objet ajouté préserve cette concision et évite d’introduire un élément qui n’est pas formellement exprimé.
- issue: La portée de לָאֲלָפִים
  choice: Conserver « pour des milliers » dans le texte principal.
  alternative: « pour mille générations » ou « pour des milliers de générations »
  rationale: Le contexte suggère vraisemblablement un contraste générationnel avec la troisième et la quatrième génération, mais le mot « générations » n’apparaît pas ici. La note présente donc cette possibilité sans l’imposer.
- issue: La transmission intergénérationnelle de la faute
  choice: Conserver l’affirmation selon laquelle la faute des pères retombe sur leurs descendants.
  alternative: Paraphraser comme la seule persistance des conséquences sociales du péché.
  rationale: Le texte ne précise pas ici le mécanisme ni les conditions de cette visitation. La traduction préserve cette tension plutôt que de la résoudre par une explication doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La structure répétée « qui… » conserve le mouvement de la proclamation hébraïque. Le vocabulaire théologique demeure courant; « amour fidèle » évite l’archaïsme, tandis que « transgression » garde la gravité de l’énumération.
