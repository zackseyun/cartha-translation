base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/019.yaml
  text: Every firstborn of the womb is mine[a], and every male firstborn among your livestock[c][b], whether ox or sheep.
translation:
  language: fr
  text: Tout premier-né[a] est à moi, ainsi que tout premier-né mâle de ton bétail[b], de bovin ou de mouton.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tout ce qui ouvre la matrice ».'
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu précise qu’il s’agit des mâles premiers-nés du bétail.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל פֶּטֶר רֶחֶם
  choice: Tout premier-né qui ouvre le sein maternel
  rationale: L’expression hébraïque désigne littéralement tout être qui ouvre le sein maternel, donc le premier-né. La formulation française conserve l’image source tout en en rendant clairement le sens.
- source_word: לִי
  choice: est à moi
  rationale: Le groupe prépositionnel exprime ici l’appartenance ou la revendication divine. « Est à moi » est direct, naturel et n’ajoute pas une notion cultuelle non explicitée.
- source_word: מִקְנְךָ
  choice: ton bétail
  rationale: Le terme collectif désigne les animaux domestiques possédés, notamment ceux des troupeaux. « Bétail » convient au contexte rural et aux espèces précisées ensuite.
- source_word: תִּזָּכָר
  choice: tout mâle premier-né
  rationale: Dans cette formulation elliptique, le niphal de זכר précise le sexe mâle des premiers-nés du bétail. Traduire par « mâle premier-né » restitue la fonction du terme sans suggérer à tort l’idée de souvenir.
- source_word: פֶּטֶר שׁוֹר וָשֶׂה
  choice: qu’il s’agisse d’un bovin ou d’un mouton
  rationale: La phrase précise les catégories de bétail visées. « Bovin » rend שׁוֹר sans imposer un sexe absent ici, tandis que « mouton » rend שֶׂה comme terme générique naturel.
theological_decisions:
- issue: Revendication divine sur les premiers-nés
  choice: Le texte affirme simplement que le premier-né est à Dieu.
  alternative: Rendre explicitement l’idée de consécration ou de sacrifice.
  rationale: L’hébreu exprime directement l’appartenance par לִי, mais ne développe pas ici les modalités cultuelles de cette revendication. La traduction évite donc d’importer une explication théologique extérieure au verset.
- issue: Portée de la précision masculine
  choice: Rattacher explicitement « mâle » aux premiers-nés du bétail.
  alternative: Faire porter la précision sur tous les premiers-nés, y compris la première proposition.
  rationale: La forme תִּזָּכָר se trouve dans la proposition concernant le bétail. La traduction conserve cette portée syntaxique sans étendre silencieusement la précision.
translation_notes:
  register: Français international moderne, digne et accessible. L’image hébraïque de l’ouverture du sein maternel est conservée dans une formulation intelligible. Le tutoiement singulier correspond à מִקְנְךָ et au registre de l’adresse d’alliance dans le contexte.
