source:
  edition: WLC
  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֨ת יָמִ֜ים תֹּאכַ֤ל מַצּוֹת֙ אֲשֶׁ֣ר צִוִּיתִ֔/ךָ לְ/מוֹעֵ֖ד חֹ֣דֶשׁ הָ/אָבִ֑יב כִּ֚י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֔יב יָצָ֖אתָ מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/018.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib[c][b]; for in the month of Abib you came out from Egypt.
translation:
  language: fr
  text: Tu observeras la fête des Pains sans levain[a]. Pendant sept jours, tu mangeras des pains sans levain, comme je te l’ai ordonné, au temps fixé, au mois d’Abib[b] ; car c’est au mois d’Abib que tu es sorti d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la célébration des pains sans levain ». Le mot hébreu חַג désigne une fête sacrée fixée, souvent associée à un pèlerinage.
    reason: lexical_alternative
  - marker: b
    text: « Abib » est le mois du début du printemps associé à la sortie d’Égypte.
    reason: cultural_note
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: la fête des Pains sans levain
  rationale: חַג désigne une fête ou célébration sacrée, parfois liée à un pèlerinage. La formulation retenue est naturelle en français et conserve la valeur de titre liturgique ; « pains sans levain » rend le pluriel מַצּוֹת.
- source_word: תִּשְׁמֹר
  choice: tu observeras
  rationale: Dans le contexte des prescriptions cultuelles et de l’alliance, שׁמר signifie respecter ou observer fidèlement. « Observer » est plus idiomatique ici que le calque « garder ».
- source_word: שִׁבְעַת יָמִים תֹּאכַל מַצּוֹת
  choice: Pendant sept jours, tu mangeras des pains sans levain
  rationale: « Pendant » explicite naturellement la durée indiquée par l’hébreu sans en modifier le sens. Le pluriel « des pains sans levain » correspond à מַצּוֹת et reste usuel dans le registre biblique français.
- source_word: אֲשֶׁר צִוִּיתִךָ
  choice: comme je te l’ai ordonné
  rationale: Cette formulation rend la force du commandement divin tout en laissant au contexte le soin de déterminer la portée exacte de la proposition relative.
- source_word: לְמוֹעֵד
  choice: au temps fixé
  rationale: מוֹעֵד désigne un moment ou une période déterminée, souvent pour une célébration sacrée. « Au temps fixé » est clair, concis et fidèle.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: le mois d’Abib
  rationale: Dans ce contexte, אָבִיב sert de désignation au mois du début du printemps. « Abib » conserve la forme traditionnelle française du nom biblique.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici la raison de la prescription. « Car » préserve clairement ce lien explicatif dans un registre digne et courant.
- source_word: יָצָאתָ מִמִּצְרָיִם
  choice: tu es sorti d’Égypte
  rationale: יצא מן signifie naturellement « sortir de ». Cette formulation française est idiomatique et conserve le motif de la sortie d’Égypte.
theological_decisions:
- issue: Terminologie de la fête prescrite dans l’alliance
  choice: Employer « la fête des Pains sans levain » comme désignation formelle de la célébration
  alternative: « la célébration des pains sans levain » ou « la fête de pèlerinage des Pains sans levain »
  rationale: La formulation retenue préserve le poids cultuel et institutionnel du texte sans ajouter explicitement la notion de pèlerinage ni importer une interprétation confessionnelle ultérieure.
- issue: Adresse à Israël à la deuxième personne du masculin singulier
  choice: Conserver le singulier « tu » dans tout le verset
  alternative: Employer « vous » ou expliciter « Israël »
  rationale: L’hébreu s’adresse à Israël collectivement au moyen du singulier. Le maintien de « tu » respecte cette forme grammaticale et la tonalité directe de l’alliance.
- issue: Portée de la proposition « comme je te l’ai ordonné »
  choice: Conserver une formulation qui ne précise pas davantage si elle porte surtout sur la consommation, la durée ou l’ensemble de l’observance
  alternative: Expliciter « selon l’ordre que je t’ai donné » en rattachant la proposition à toute la fête
  rationale: La syntaxe hébraïque permet une certaine souplesse de rattachement. La traduction évite de résoudre silencieusement cette légère ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur prescriptive rend naturellement les formes verbales hébraïques. Le singulier « tu » conserve l’adresse collective de l’original. La ponctuation distingue le commandement de sa justification sans alourdir la phrase.
