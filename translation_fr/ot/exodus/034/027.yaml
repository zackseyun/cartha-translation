  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כְּתָב לְ/ךָ֖ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה כִּ֞י עַל פִּ֣י הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה כָּרַ֧תִּי אִתְּ/ךָ֛ בְּרִ֖ית וְ/אֶת יִשְׂרָאֵֽל־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/027.yaml
  text: Then Yahweh said to Moses[a], “Write these words for yourself, for according to these words I have made a covenant with you and with Israel.”
translation:
  language: fr
  text: 'Puis Yahweh dit à Moïse : « Écris pour toi ces paroles, car c’est conformément à ces paroles que j’ai conclu une alliance[a] avec toi et avec Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « j’ai coupé une alliance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: וַיֹּאמֶר
  choice: Puis … dit
  rationale: Cette tournure rend naturellement en français la forme narrative hébraïque introduisant une parole directe.
- source_word: כְּתָב לְךָ
  choice: Écris pour toi
  rationale: L’impératif est rendu directement, et le datif לְךָ est conservé sans en préciser davantage la nuance.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ces paroles
  rationale: Dans ce contexte écrit et covenantal, דְּבָרִים désigne les paroles énoncées; la répétition hébraïque est maintenue.
- source_word: כִּי עַל פִּי הַדְּבָרִים הָאֵלֶּה
  choice: car c’est conformément à ces paroles que
  rationale: « Car » exprime la relation causale et « conformément à » rend l’expression idiomatique עַל־פִּי dans son sens normatif.
- source_word: כָּרַתִּי ... בְּרִית
  choice: j’ai conclu une alliance
  rationale: « Conclure une alliance » est l’équivalent français naturel de l’idiome hébreu littéral « couper une alliance ».
- source_word: אִתְּךָ ... וְאֶת יִשְׂרָאֵל
  choice: avec toi et avec Israël
  rationale: La répétition de « avec » clarifie naturellement que Moïse et Israël sont tous deux associés à l’alliance.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: « Yahweh » conserve le nom propre du texte source sans lui substituer un titre ni privilégier une forme confessionnelle traditionnelle.
- issue: Idiome d’alliance כָּרַתִּי ... בְּרִית
  choice: j’ai conclu une alliance
  alternative: j’ai coupé une alliance; j’ai fait alliance
  rationale: Le français idiomatique « conclure une alliance » transmet le sens sans reproduire littéralement une image hébraïque qui serait obscure; la note signale cette image.
- issue: Portée de עַל־פִּי
  choice: conformément à ces paroles
  alternative: sur la base de ces paroles; selon ces paroles
  rationale: Cette formulation garde le lien normatif entre les paroles écrites et l’alliance, sans préciser au-delà du texte la nature exacte de ce rapport.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la répétition de « ces paroles » et la nuance covenantale du verset. Le marqueur de note est placé après la proposition qu’il éclaire.
