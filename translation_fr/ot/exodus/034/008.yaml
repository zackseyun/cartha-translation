base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/008.yaml
  text: Moses quickly bowed down to the ground and worshiped[a][b].
translation:
  language: fr
  text: Moïse s’empressa de s’incliner jusqu’à terre et se prosterna[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « adora » ; le verbe hébreu désigne le fait de se prosterner en signe de révérence ou d’adoration.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: s’empressa de
  rationale: Le verbe exprime la hâte. La tournure « s’empressa de » est naturelle en français et souligne la réaction immédiate de Moïse.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom.
- source_word: וַיִּקֹּד
  choice: s’incliner
  rationale: Le verbe désigne le fait de courber ou d’incliner le corps. Ce choix distingue ce premier mouvement du geste de prosternation exprimé ensuite.
- source_word: אַרְצָה
  choice: jusqu’à terre
  rationale: La forme directionnelle indique un mouvement vers le sol ; « jusqu’à terre » exprime naturellement la profondeur du geste en français.
- source_word: וַיִּשְׁתָּחוּ
  choice: se prosterna
  rationale: Le verbe désigne une prosternation marquant la révérence et, dans ce contexte, l’adoration. Le terme français conserve à la fois le geste corporel et sa portée cultuelle sans réduire le sens à une interprétation abstraite.
theological_decisions:
- issue: Faut-il rendre le dernier verbe par un geste physique ou explicitement par l’adoration ?
  choice: se prosterna
  alternative: adora
  rationale: Dans le contexte, la prosternation de Moïse constitue bien une réponse d’adoration à la révélation de l’Éternel. Toutefois, l’hébreu nomme un geste de révérence dont la portée cultuelle découle du contexte. « Se prosterna » préserve cette dimension concrète et l’ambiguïté lexicale authentique, tandis que la note explicite le sens possible d’adoration.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve les deux verbes successifs de l’hébreu et évite de les fondre en une seule action. « S’empressa » rend la rapidité sans alourdir la narration.
