  text: אֱלֹהֵ֥י מַסֵּכָ֖ה לֹ֥א תַעֲשֶׂה לָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/017.yaml
  text: You shall not make cast-metal gods for yourself[a].
translation:
  language: fr
  text: Tu ne te feras pas de dieux en métal coulé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des dieux en métal fondu ». Le terme hébreu désigne des dieux fabriqués par coulée.
    reason: Alternative lexicale pour מַסֵּכָה; elle explicite la nuance de fabrication sans restreindre le métal ni ajouter « images » au texte.
lexical_decisions:
- source_word: אֱלֹהֵי
  choice: dieux
  rationale: Le pluriel construit d’אֱלֹהִים désigne ici concrètement des dieux représentés comme des idoles; « dieux » conserve directement la formulation hébraïque.
- source_word: מַסֵּכָה
  choice: en métal fondu
  rationale: Le nom désigne un objet obtenu par fonte et coulage, notamment une idole métallique. « En métal fondu » exprime clairement en français moderne la matière et le procédé sans ajouter « images » au texte.
- source_word: לֹא תַעֲשֶׂה
  choice: Tu ne te feras pas
  rationale: Dans ce contexte juridique, la négation avec l’inaccompli exprime une interdiction. La tournure française rend naturellement sa force prescriptive.
- source_word: לָּךְ
  choice: te
  rationale: Le datif d’intérêt avec suffixe de deuxième personne singulier est rendu par la construction pronominale « se faire », idiomatique en français et équivalente à « pour toi-même ».
theological_decisions:
- issue: Nature de l’objet interdit
  choice: des dieux en métal fondu
  alternative: des idoles de métal coulé
  rationale: La traduction retenue préserve à la fois le terme explicite « dieux » et la notion d’un objet métallique produit par fonte, sans réduire interprétativement la formule à de simples « images ».
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement singulier correspond à la deuxième personne masculine singulière de l’hébreu. La construction « tu ne te feras pas » exprime naturellement une interdiction solennelle.
