  text: הִשָּׁ֣מֶר לְ/ךָ֗ פֶּן תִּכְרֹ֤ת בְּרִית֙ לְ/יוֹשֵׁ֣ב הָ/אָ֔רֶץ אֲשֶׁ֥ר אַתָּ֖ה בָּ֣א עָלֶ֑י/הָ פֶּן יִהְיֶ֥ה לְ/מוֹקֵ֖שׁ בְּ/קִרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/012.yaml
  text: Be careful[a], lest you make a covenant with the inhabitants of the land into which you are going[d][c][b], lest it become a snare in your midst.
translation:
  language: fr
  text: 'Prends garde à toi[a] : ne conclus pas d’alliance[b] avec les habitants du pays dans lequel tu vas entrer, de peur que cela ne devienne un piège au milieu de toi[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Veille sur toi-même » ou « Sois sur tes gardes ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ne coupe pas d’alliance ». « Couper une alliance » est une expression hébraïque qui signifie « conclure une alliance ».
    reason: lexical_alternative
  - marker: c
    text: Ou « parmi vous ». L’hébreu n’exprime pas le sujet de « devienne » ; il peut renvoyer aux habitants, à l’alliance ou à la situation ainsi créée.
    reason: ambiguity
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Prends garde à toi
  rationale: Cette formule française naturelle conserve l’impératif réfléchi et la force d’avertissement du niphal de שׁמר avec לְךָ.
- source_word: פֶּן
  choice: ne… pas / de peur que… ne
  rationale: La répétition de פֶּן introduit deux précautions négatives. La variation imposée par la syntaxe française maintient leur force d’avertissement sans lourdeur.
- source_word: תִּכְרֹת בְּרִית
  choice: conclus une alliance
  rationale: כרת ברית signifie littéralement « couper une alliance », mais « conclure une alliance » est l’expression française courante et précise.
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: avec les habitants du pays
  rationale: Le participe singulier a ici une valeur collective, rendue naturellement par le pluriel français.
- source_word: אֲשֶׁר אַתָּה בָּא עָלֶיהָ
  choice: dans lequel tu vas entrer
  rationale: Cette formulation rend clairement le mouvement vers l’intérieur du pays exprimé par בוא avec על dans ce contexte.
- source_word: יִהְיֶה לְמוֹקֵשׁ
  choice: qu’elle ne devienne un piège
  rationale: Le féminin « elle » renvoie naturellement en français à « alliance », antécédent le plus proche et le plus cohérent. « Piège » rend directement מוֹקֵשׁ.
- source_word: בְּקִרְבֶּךָ
  choice: au milieu de toi
  rationale: Cette formulation conserve le singulier collectif adressé à Israël et la spatialité de l’expression, sans la réduire à une intériorité psychologique.
theological_decisions:
- issue: Référent du verbe singulier final et de « piège »
  choice: L’alliance conclue avec les habitants devient le piège.
  alternative: Les habitants eux-mêmes, ou plus généralement la situation, deviennent un piège.
  rationale: '« Alliance » est l’antécédent le plus proche et s’accorde avec la logique du contexte : l’accord conclu risque d’entraîner Israël dans l’infidélité. La note signale néanmoins que le pronom n’est pas exprimé en hébreu.'
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reproduit l’adresse hébraïque à Israël comme entité collective. La construction « de peur que… ne » emploie un ne explétif et n’ajoute pas une seconde négation.
