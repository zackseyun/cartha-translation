source:
  edition: WLC
  text: וְ/רָא֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶת פְּנֵ֣י מֹשֶׁ֔ה כִּ֣י קָרַ֔ן ע֖וֹר פְּנֵ֣י מֹשֶׁ֑ה וְ/הֵשִׁ֨יב מֹשֶׁ֤ה אֶת הַ/מַּסְוֶה֙ עַל פָּנָ֔י/ו עַד בֹּא֖/וֹ לְ/דַבֵּ֥ר אִתּֽ/וֹ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/035.yaml
  text: And the sons of Israel saw Moses’ face[a], that the skin of Moses’ face shone[c][b]; and Moses would put the veil back over his face until he went in to speak with him.
translation:
  language: fr
  text: 'Les Israélites[a] voyaient le visage de Moïse : la peau de son visage rayonnait[b]. Moïse remettait alors le voile sur son visage jusqu’à ce qu’il entre pour parler avec lui[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu signifie « rayonner » ou « émettre des rayons ». L’ancienne traduction « était cornue » repose sur un contresens.
    reason: lexical_alternative
  - marker: c
    text: Dans le contexte immédiat, « lui » désigne le SEIGNEUR.
    reason: cross_reference
lexical_decisions:
- source_word: וְרָאוּ
  choice: voyaient
  rationale: Dans ce résumé d’actions répétées, l’imparfait français exprime naturellement ce que les Israélites observaient chaque fois que Moïse paraissait devant eux.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette formulation courante et inclusive rend naturellement l’expression hébraïque littérale « les fils d’Israël », signalée en note.
- source_word: פְּנֵי מֹשֶׁה
  choice: le visage de Moïse
  rationale: Rend directement le groupe construit hébreu tout en restant naturel en français.
- source_word: כִּי
  choice: ':'
  rationale: Les deux-points introduisent naturellement en français le contenu de ce que les Israélites constataient, sans imposer à כִּי une valeur causale.
- source_word: קָרַן
  choice: rayonnait
  rationale: Le verbe décrit l’émission de rayons ou d’éclat. « Rayonnait » conserve cette image et évite l’ancien contresens « était cornue ».
- source_word: עוֹר פְּנֵי מֹשֶׁה
  choice: la peau de son visage
  rationale: Le mot עוֹר désigne précisément la peau; le pronom français évite une répétition lourde sans effacer cette précision.
- source_word: וְהֵשִׁיב
  choice: remettait alors
  rationale: Le hiphil de שוב signifie ici remettre en place. L’imparfait marque l’action habituelle, tandis que « alors » rend l’enchaînement.
- source_word: הַמַּסְוֶה
  choice: le voile
  rationale: « Voile » est le terme français usuel et contextuellement adapté pour cette pièce couvrant le visage.
- source_word: עַל פָּנָיו
  choice: sur son visage
  rationale: Cette tournure exprime clairement la position et la fonction du voile en français courant.
- source_word: עַד בֹּאוֹ
  choice: jusqu’à ce qu’il entre
  rationale: La tournure marque la limite temporelle de l’action et rend naturellement l’entrée répétée de Moïse dans la présence divine.
- source_word: לְדַבֵּר אִתּוֹ
  choice: pour parler avec lui
  rationale: Le pronom masculin de l’hébreu est conservé plutôt que remplacé dans le texte par le nom divin.
theological_decisions:
- issue: Référent de « avec lui »
  choice: Conserver le pronom « lui » dans le texte; il renvoie au SEIGNEUR dans le contexte immédiat.
  alternative: Traduire explicitement « pour parler avec le SEIGNEUR ».
  rationale: L’hébreu emploie un pronom. Le conserver respecte la forme du texte et sa cohésion avec le contexte, tandis qu’une note en précise le référent sans ajouter le nom divin au verset.
- issue: Nature de l’éclat du visage de Moïse
  choice: Traduire קָרַן par « rayonnait ».
  alternative: « brillait », « lançait des rayons » ou l’ancienne traduction « était cornue ».
  rationale: Le contexte décrit un éclat émis par la peau du visage. « Rayonnait » préserve l’image sans adopter le contresens traditionnel lié aux « cornes ».
translation_notes:
  register: Français international moderne, clair et digne. Les imparfaits « voyaient », « rayonnait » et « remettait » présentent la scène comme une pratique répétée. Les deux-points permettent de conserver le lien perceptif introduit par כִּי sans produire une syntaxe française artificielle.
