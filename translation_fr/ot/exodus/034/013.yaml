source:
  edition: WLC
  text: כִּ֤י אֶת מִזְבְּחֹתָ/ם֙ תִּתֹּצ֔וּ/ן וְ/אֶת מַצֵּבֹתָ֖/ם תְּשַׁבֵּר֑וּ/ן וְ/אֶת אֲשֵׁרָ֖י/ו תִּכְרֹתֽוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/013.yaml
  text: Instead[a], you shall tear down their altars, shatter their pillars[b], and cut down their Asherah poles.
translation:
  language: fr
  text: Au contraire[a], vous démolirez leurs autels, vous briserez leurs pierres dressées et vous abattrez leurs poteaux sacrés d’Ashéra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car vous démolirez leurs autels… » La conjonction hébraïque peut aussi signifier « car »; dans ce contexte, elle marque naturellement le contraste avec l’interdiction précédente.'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « leurs ashéras ». Le terme peut désigner des objets cultuels associés à la déesse Ashéra.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Au contraire
  rationale: Dans le contexte, la conjonction introduit l’action opposée à l’alliance interdite au verset précédent. « Au contraire » rend naturellement cette valeur contrastive, tout en signalant en note le sens causal possible.
- source_word: מִזְבְּחֹתָם
  choice: leurs autels
  rationale: Équivalent français courant et précis du pluriel de מִזְבֵּחַ avec suffixe de troisième personne du masculin pluriel.
- source_word: תִּתֹּצוּן
  choice: vous démolirez
  rationale: Le verbe נתץ désigne la destruction ou la démolition d’une construction; « démolir » convient bien aux autels et reste naturel en français moderne.
- source_word: מַצֵּבֹתָם
  choice: leurs pierres dressées
  rationale: מַצֵּבָה désigne ici des pierres érigées à fonction cultuelle. « Pierres dressées » décrit concrètement l’objet sans lui donner artificiellement la forme architecturale que pourrait suggérer « colonnes ».
- source_word: תְּשַׁבֵּרוּן
  choice: vous briserez
  rationale: Le piel de שׁבר exprime une destruction énergique. « Briser » est idiomatique avec des pierres dressées et conserve la force du verbe.
- source_word: אֲשֵׁרָיו
  choice: leurs poteaux sacrés d’Ashéra
  rationale: Le pluriel désigne vraisemblablement des objets cultuels associés à Ashéra. Cette formulation rend le référent probable tout en conservant explicitement le lien avec la divinité nommée.
- source_word: תִּכְרֹתוּן
  choice: vous abattrez
  rationale: כרת signifie couper ou retrancher; appliqué à ces objets cultuels vraisemblablement en bois, « abattre » est naturel et restitue l’idée de les couper pour les faire tomber.
theological_decisions:
- issue: Référent de אֲשֵׁרָיו
  choice: objets cultuels associés à Ashéra, rendus par « poteaux sacrés d’Ashéra »
  alternative: les « ashéras »; ou des images cultuelles d’Ashéra
  rationale: La série énumère des objets matériels à détruire, et le verbe « couper/abattre » suggère des objets en bois. La traduction retenue communique cette interprétation probable sans confondre l’objet avec la divinité ni masquer l’ambiguïté du terme hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La coordination répétée de l’hébreu est rendue par une série verbale équilibrée. « Pierres dressées » et « poteaux sacrés d’Ashéra » privilégient la compréhension concrète tout en préservant la précision cultuelle et l’ambiguïté pertinente au moyen des notes.
