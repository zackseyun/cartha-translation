source:
  edition: WLC
  text: כִּֽי אוֹרִ֤ישׁ גּוֹיִם֙ מִ/פָּנֶ֔י/ךָ וְ/הִרְחַבְתִּ֖י אֶת גְּבוּלֶ֑/ךָ וְ/לֹא יַחְמֹ֥ד אִישׁ֙ אֶֽת אַרְצְ/ךָ֔ בַּ/עֲלֹֽתְ/ךָ֗ לֵ/רָאוֹת֙ אֶת פְּנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ שָׁלֹ֥שׁ פְּעָמִ֖ים בַּ/שָּׁנָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/024.yaml
  text: For I will drive out nations from before you and enlarge your border[c][b][a], and no man will covet your land when you go up to appear before Yahweh your God three times in the year.
translation:
  language: fr
  text: Car je chasserai des nations devant toi et j’élargirai ton territoire. Personne[a] ne convoitera ton pays quand tu monteras pour paraître devant[b] Yahweh, ton Dieu, trois fois par an[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici un nom masculin singulier, « homme », avec une portée générale. Dans le contexte, la promesse protège le pays pendant que les hommes d’Israël montent aux fêtes de pèlerinage.
    reason: cultural_note
  - marker: b
    text: L’expression hébraïque est liée à l’image de « voir la face de » Dieu; dans ce contexte cultuel, elle signifie se présenter devant lui.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « trois fois dans l’année ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui soutient le commandement précédent concernant les pèlerinages annuels.
- source_word: אוֹרִישׁ
  choice: je chasserai
  rationale: Le hiphil de ירשׁ exprime ici l’expulsion des nations du pays; « chasser » est clair et naturel en français.
- source_word: גּוֹיִם
  choice: des nations
  rationale: Désigne les peuples établis dans le pays, envisagés comme groupes ethniques et politiques.
- source_word: מִפָּנֶיךָ
  choice: devant toi
  rationale: Conserve l’image hébraïque d’une éviction hors de la présence ou du chemin d’Israël.
- source_word: וְהִרְחַבְתִּי אֶת־גְּבוּלֶךָ
  choice: et j’élargirai ton territoire
  rationale: גְּבוּל peut désigner la frontière ou l’étendue délimitée; « élargir le territoire » exprime naturellement la promesse d’expansion territoriale.
- source_word: לֹא יַחְמֹד
  choice: ne convoitera
  rationale: Préserve le sens fort de חמד, le même verbe que dans l’interdiction de convoiter.
- source_word: אִישׁ
  choice: Personne
  rationale: Le nom masculin singulier a ici une portée représentative; « personne » rend naturellement la négation générale en français sans restreindre artificiellement le référent.
- source_word: אַרְצְךָ
  choice: ton pays
  rationale: Dans ce contexte de menace extérieure pendant les pèlerinages, « pays » désigne clairement la terre appartenant à Israël et évite la répétition de « territoire ».
- source_word: בַּעֲלֹתְךָ
  choice: quand tu monteras
  rationale: עלה est le verbe usuel de la montée en pèlerinage vers le sanctuaire.
- source_word: לֵרָאוֹת אֶת־פְּנֵי
  choice: pour paraître devant
  rationale: Rend l’expression cultuelle de présentation devant Dieu, tout en signalant en note son imagerie littérale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: trois fois par an
  rationale: Formulation française naturelle qui exprime la fréquence annuelle des trois pèlerinages.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom personnel plutôt que de le remplacer par un titre.
- issue: Portée du masculin singulier אִישׁ
  choice: Personne
  alternative: aucun homme
  rationale: Bien que la forme soit masculine singulière, elle est représentative dans cette promesse générale. « Personne » communique cette portée en français naturel; une note précise la forme et le cadre culturel.
- issue: Expression cultuelle לֵרָאוֹת אֶת־פְּנֵי
  choice: paraître devant
  alternative: voir la face de
  rationale: Dans le contexte du pèlerinage, l’expression désigne le fait de se présenter devant Dieu pour le culte. La note conserve l’image hébraïque et son ambiguïté formelle.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier suit l’adresse hébraïque à Israël comme interlocuteur collectif. La formulation reste proche des images du texte tout en évitant les tours inutilement archaïques.
