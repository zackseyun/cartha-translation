id: EXO.34.5
reference: Exodus 34:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֵּ֤רֶד יְהוָה֙ בֶּֽ/עָנָ֔ן וַ/יִּתְיַצֵּ֥ב עִמּ֖/וֹ שָׁ֑ם וַ/יִּקְרָ֥א בְ/שֵׁ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/005.yaml
  text: And Yahweh came down in the cloud and stood there with him[a], and proclaimed the name of Yahweh.
translation:
  language: fr
  text: Yahweh descendit dans la nuée, se tint là avec lui et proclama le nom de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « invoqua le nom de Yahweh », ou « proclama au nom de Yahweh ». En hébreu, « nom » est précédé de la préposition qui peut signifier « dans », « par » ou « au moyen de » ; selon la première lecture, Moïse peut être compris comme le sujet.
    reason: Alternative lexicale et ambiguïté syntaxique de בְשֵׁם יְהוָה.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom divin « Yahweh », plutôt que remplacé par un titre.
- source_word: וַיֵּרֶד
  choice: descendit
  rationale: Le verbe ירד exprime concrètement un mouvement vers le bas ; « descendit » convient au récit et reste naturel en français.
- source_word: בֶּעָנָן
  choice: dans la nuée
  rationale: La préposition ב indique ici le lieu. L’article défini renvoie à la nuée théophanique déjà connue dans le récit de l’Exode.
- source_word: וַיִּתְיַצֵּב
  choice: se tint
  rationale: La forme hitpael de יצב signifie prendre position ou se tenir debout. « Se tint » restitue cette idée avec concision.
- source_word: עִמּוֹ שָׁם
  choice: là avec lui
  rationale: Cette formulation conserve à la fois l’indication de lieu שָׁם et l’accompagnement exprimé par עִמּוֹ ; le pronom renvoie à Moïse dans le contexte.
- source_word: וַיִּקְרָא
  choice: proclama
  rationale: Dans ce contexte, קרא introduit la déclaration solennelle qui se poursuit au verset suivant ; « proclama » en rend la force déclarative.
- source_word: בְשֵׁם יְהוָה
  choice: le nom de Yahweh
  rationale: Après « proclama », cette tournure est naturelle en français et présente le nom divin comme contenu de la proclamation, tout en signalant en note les autres valeurs possibles de la préposition ב.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ou le SEIGNEUR
  rationale: Le texte hébreu emploie directement le nom divin ; sa translittération préserve le nom personnel révélé à Israël sans lui substituer un titre.
- issue: Sujet et sens de וַיִּקְרָא
  choice: Yahweh demeure le sujet, et le verbe est traduit par « proclama »
  alternative: Moïse comme sujet, avec le sens « invoqua » ; ou « proclama au nom de Yahweh »
  rationale: L’enchaînement syntaxique fait le plus naturellement de Yahweh le sujet des trois verbes. Toutefois, la construction בְשֵׁם autorise d’autres analyses, conservées dans la note plutôt que supprimées.
translation_notes:
  register: Français international actuel, sobre et digne. « Nuée » est retenu pour la manifestation visible de la présence divine, terme biblique encore intelligible et plus précis ici que le simple « nuage ». Le passé simple soutient le registre narratif solennel sans alourdir la phrase.
