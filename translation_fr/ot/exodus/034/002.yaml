source:
  edition: WLC
  text: וֶ/הְיֵ֥ה נָכ֖וֹן לַ/בֹּ֑קֶר וְ/עָלִ֤יתָ בַ/בֹּ֨קֶר֙ אֶל הַ֣ר סִינַ֔י וְ/נִצַּבְתָּ֥ לִ֛/י שָׁ֖ם עַל רֹ֥אשׁ הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/002.yaml
  text: And be ready by the morning[b][a], and in the morning come up to Mount Sinai and present yourself there to me on the top of the mountain.
translation:
  language: fr
  text: Tiens-toi prêt pour le matin. Le matin, monte sur le mont Sinaï et présente-toi là devant moi[a], au sommet de la montagne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tiens-toi là devant moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהְיֵה נָכוֹן
  choice: Tiens-toi prêt
  rationale: L’impératif de היה suivi de נָכוֹן forme ici une injonction à être préparé. « Tiens-toi prêt » est naturel en français moderne et conserve la force du commandement.
- source_word: לַבֹּקֶר
  choice: pour le matin
  rationale: La préposition ל situe la préparation en vue du matin à venir. « Pour le matin » préserve cette nuance et permet de la distinguer du complément temporel suivant.
- source_word: וְעָלִיתָ
  choice: monte
  rationale: עלה signifie monter, gravir. Le français « monte » convient naturellement au déplacement vers le sommet sans imposer la distinction déictique entre « viens » et « va ».
- source_word: בַבֹּקֶר
  choice: Le matin
  rationale: 'Ce complément indique le moment de l’ascension. La répétition de « matin » conserve la progression de l’hébreu : être prêt en vue du matin, puis monter le matin.'
- source_word: אֶל הַר סִינַי
  choice: sur le mont Sinaï
  rationale: Avec le verbe « monter », « monter sur le mont Sinaï » est une formulation française claire et naturelle du mouvement vers la montagne.
- source_word: וְנִצַּבְתָּ לִי
  choice: présente-toi là devant moi
  rationale: Le niphal de נצב peut exprimer le fait de se tenir en place ou de comparaître. Avec לִי et dans ce contexte de rencontre divine, « présente-toi devant moi » rend naturellement l’idée sans effacer l’autre possibilité, signalée en note.
- source_word: עַל רֹאשׁ הָהָר
  choice: au sommet de la montagne
  rationale: Dans cet emploi topographique, רֹאשׁ désigne le haut ou le sommet. « Au sommet de la montagne » est précis et idiomatique.
theological_decisions:
- issue: Orientation du mouvement exprimé par עלה
  choice: monte
  alternative: viens sur le mont Sinaï / va sur le mont Sinaï
  rationale: Le verbe hébreu indique l’ascension sans encoder à lui seul la distinction française entre venir et aller. « Monte » préserve cette indétermination et n’ajoute aucune conclusion sur la localisation du locuteur.
- issue: Portée de וְנִצַּבְתָּ לִי
  choice: présente-toi là devant moi
  alternative: tiens-toi là devant moi
  rationale: Le contexte autorise une nuance de comparution devant Dieu, mais le sens concret de se tenir debout ou en place reste possible. La traduction principale privilégie le français naturel, tandis que la note conserve l’alternative lexicale.
translation_notes:
  register: Français moderne, sobre et digne. La répétition de « matin » reproduit la structure du verset. « Monte » évite d’introduire artificiellement une orientation déictique absente du verbe hébreu.
