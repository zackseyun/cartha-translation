source:
  edition: WLC
  text: וַ/יַּסַּ֨ע מֹשֶׁ֤ה אֶת יִשְׂרָאֵל֙ מִ/יַּם ס֔וּף וַ/יֵּצְא֖וּ אֶל מִדְבַּר שׁ֑וּר וַ/יֵּלְכ֧וּ שְׁלֹֽשֶׁת יָמִ֛ים בַּ/מִּדְבָּ֖ר וְ/לֹא מָ֥צְאוּ מָֽיִם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/022.yaml
  text: Then Moses led Israel on from the Sea of Reeds[a], and they went out into the wilderness of Shur. They went three days in the wilderness and found no water.
translation:
  language: fr
  text: Puis Moïse fit partir Israël de la mer des Roseaux[a], et ils gagnèrent le désert de Shour. Ils marchèrent trois jours dans le désert sans trouver d’eau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « mer Rouge » ; en hébreu : « mer des Roseaux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסַּע
  choice: fit partir
  rationale: 'Le hiphil de נסע a ici une valeur causative : Moïse amène Israël à quitter les lieux. « Fit partir » conserve cette valeur sans suggérer plus explicitement que le texte qu’il marchait à leur tête.'
- source_word: מִיַּם סוּף
  choice: de la mer des Roseaux
  rationale: L’expression hébraïque désigne littéralement la « mer des Roseaux ». Le texte principal privilégie ce sens lexical, tandis que l’appellation traditionnelle est signalée en note.
- source_word: מִדְבַּר שׁוּר
  choice: le désert de Shour
  rationale: מִדְבָּר désigne une région aride ou inhabitée. « Désert » est naturel en français moderne et ne suppose pas nécessairement une étendue de sable.
- source_word: וַיֵּצְאוּ
  choice: ils gagnèrent
  rationale: Le verbe יצא exprime la sortie ou le départ. Dans ce contexte de déplacement vers le désert, « gagnèrent » rend naturellement le mouvement d’entrée dans cette région sans alourdir la phrase.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: trois jours
  rationale: L’accusatif indique la durée. « Trois jours » la rend directement, sans ajouter l’idée plus précise d’une étape ou d’un trajet de trois jours.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: La préposition ב est rendue simplement par « dans », au plus près de l’hébreu et de façon idiomatique.
- source_word: וְלֹא מָצְאוּ מָיִם
  choice: sans trouver d’eau
  rationale: Cette tournure française concise exprime naturellement que leur marche de trois jours n’aboutit à la découverte d’aucune eau.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique littéraire sans être archaïque. « Shour » suit une translittération française transparente. La répétition de « désert » est conservée, comme dans l’hébreu, tandis que la dernière proposition est intégrée de manière fluide.
