  text: נָטִ֨יתָ֙ יְמִ֣ינְ/ךָ֔ תִּבְלָעֵ֖/מוֹ אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/012.yaml
  text: You stretched out your right hand[a]; the earth swallowed them.
translation:
  language: fr
  text: Tu as étendu ta main droite ; la terre les a engloutis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pays les a engloutis » ou « le sol les a engloutis ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נָטִיתָ
  choice: Tu as étendu
  rationale: Le qal accompli, 2e personne du masculin singulier, s’adresse directement à Dieu. « Étendre » rend naturellement le geste concret exprimé par נטה.
- source_word: יְמִינְךָ
  choice: ta main droite
  rationale: L’expression traduit littéralement l’image corporelle hébraïque. Dans ce poème, elle évoque la puissance divine sans la remplacer par une abstraction.
- source_word: תִּבְלָעֵמוֹ
  choice: les a engloutis
  rationale: Le verbe בלע signifie « avaler, engloutir ». « Engloutir » conserve l’image vive tout en convenant idiomatiquement à « la terre » comme sujet.
- source_word: אָרֶץ
  choice: la terre
  rationale: אֶרֶץ peut désigner la terre, le pays ou le sol. Ici, « la terre » préserve la portée ample et dramatique de l’image poétique et s’accorde avec le verbe féminin singulier.
theological_decisions:
- issue: Langage anthropomorphique décrivant l’action divine
  choice: Conserver « ta main droite »
  alternative: ta puissance ; ton bras puissant
  rationale: L’hébreu emploie une image corporelle dans une louange poétique. La conserver maintient sa force littéraire et théologique sans l’interpréter de manière réductrice.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse poétique directe à Dieu. Le point-virgule conserve le parallélisme bref du verset.
