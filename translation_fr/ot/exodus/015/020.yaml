source:
  edition: WLC
  text: וַ/תִּקַּח֩ מִרְיָ֨ם הַ/נְּבִיאָ֜ה אֲח֧וֹת אַהֲרֹ֛ן אֶת הַ/תֹּ֖ף בְּ/יָדָ֑/הּ וַ/תֵּצֶ֤אןָ כָֽל הַ/נָּשִׁים֙ אַחֲרֶ֔י/הָ בְּ/תֻפִּ֖ים וּ/בִ/מְחֹלֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/020.yaml
  text: Then Miriam the prophetess[a], Aaron’s sister, took the tambourine in her hand, and all the women went out after her with tambourines and dancing.
translation:
  language: fr
  text: Alors Miriam la prophétesse, sœur d’Aaron, prit le tambourin dans sa main, et toutes les femmes sortirent à sa suite avec des tambourins, en dansant[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec des danses ». Le nom hébreu au pluriel peut désigner soit l’activité de danser, soit des danses particulières.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: Alors … prit
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement la succession narrative en français.
- source_word: מִרְיָם
  choice: Miriam
  rationale: Translittération française courante du nom hébreu, qui permet aussi de distinguer cette figure du prénom français moderne « Myriam ».
- source_word: הַנְּבִיאָה
  choice: la prophétesse
  rationale: Le nom hébreu est explicitement féminin. « Prophétesse » est le terme français précis, courant et concis.
- source_word: אֲחוֹת אַהֲרֹן
  choice: sœur d’Aaron
  rationale: Rend directement la chaîne construite hébraïque. Le texte l’identifie comme sœur d’Aaron, même si elle est aussi la sœur de Moïse.
- source_word: הַתֹּף
  choice: le tambourin
  rationale: תֹף désigne un petit tambour sur cadre tenu à la main. « Tambourin » est l’équivalent moderne le plus accessible dans ce contexte.
- source_word: בְּיָדָהּ
  choice: dans sa main
  rationale: Traduction directe et idiomatique de la locution prépositionnelle.
- source_word: וַתֵּצֶאןָ
  choice: sortirent
  rationale: Le verbe יצא signifie « sortir ». Le pluriel féminin est conservé et le point de vue narratif favorise « sortirent ».
- source_word: כָל הַנָּשִׁים
  choice: toutes les femmes
  rationale: Rendu direct qui conserve la désignation féminine explicite de l’hébreu.
- source_word: אַחֲרֶיהָ
  choice: à sa suite
  rationale: Expression française naturelle pour décrire des femmes suivant Miriam, probablement en procession.
- source_word: בְּתֻפִּים
  choice: avec des tambourins
  rationale: Le pluriel de תֹף est rendu de façon cohérente avec le singulier précédent; la préposition a ici une valeur instrumentale.
- source_word: וּבִמְחֹלֹת
  choice: en dansant[a]
  rationale: Le pluriel מְחֹלֹת désigne des danses ou l’activité de danser, notamment dans une célébration collective. « En dansant » est naturel en français, tandis que la note préserve le rendu nominal pluriel.
