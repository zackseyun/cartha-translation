revisions:
- from: Tu as soufflé de ton vent[a] ; la mer les a recouverts. Ils ont coulé comme du plomb dans les eaux puissantes.
  to: Tu as fait souffler ton vent[a] ; la mer les a recouverts. Ils ont sombré comme du plomb dans les eaux puissantes.
  rationale: La révision remplace un calque grammatical peu naturel par une expression française moderne qui garde le vent comme moyen de l’action divine. Elle remplace également « ont coulé » par « ont sombré », plus idiomatique dans cette image de noyade. La note continue de préserver l’ambiguïté lexicale de רוּחַ, sans imposer le sens théologique d’« esprit ».
