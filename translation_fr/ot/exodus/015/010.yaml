  yaml_path: translation/ot/exodus/015/010.yaml
  text: You blew with your wind; the sea covered them[a]. They sank like lead in mighty waters.
translation:
  language: fr
  text: Tu as fait souffler ton vent[a] ; la mer les a recouverts. Ils ont sombré comme du plomb dans les eaux puissantes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton souffle ». Le mot hébreu peut signifier « vent », « souffle » ou « esprit » ; dans le contexte de la traversée de la mer, « vent » paraît le sens le plus probable.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁפְתָּ
  choice: tu as soufflé
  rationale: Le verbe נשׁף exprime l’action de souffler. Cette formulation directe conserve l’image poétique d’un vent provenant de Dieu.
- source_word: בְרוּחֲךָ
  choice: de ton vent
  rationale: רוּחַ peut désigner le vent, le souffle ou l’esprit. Le contexte de la traversée de la mer et le verbe « souffler » favorisent ici « vent », tandis que « souffle » est conservé en note.
- source_word: כִּסָּמוֹ יָם
  choice: la mer les a recouverts
  rationale: כסה signifie « couvrir, recouvrir ». Le pronom suffixe renvoie aux Égyptiens ; « recouverts » reste concret et n’explicite pas davantage l’effet du retour des eaux.
- source_word: צָלֲלוּ
  choice: ils ont coulé
  rationale: Dans ce contexte, צלל décrit leur descente sous les eaux. « Couler » est naturel en français et s’accorde avec la comparaison au plomb.
- source_word: כָּעוֹפֶרֶת
  choice: comme du plomb
  rationale: עוֹפֶרֶת désigne le plomb. La traduction conserve sans ajout l’image de lourdeur.
- source_word: בְּמַיִם אַדִּירִים
  choice: dans les eaux puissantes
  rationale: אַדִּירִים évoque la puissance, la grandeur ou la majesté. « Puissantes » rend cette force sans substituer l’idée moins précise de profondeur.
theological_decisions:
- issue: Sens de רוּחַ dans ce contexte poétique de manifestation divine
  choice: vent
  alternative: souffle ; esprit
  rationale: Le contexte matériel du retour de la mer et l’association avec « tu as soufflé » favorisent « vent », sans imposer une référence explicite à l’Esprit divin. La note préserve l’autre image plausible, « souffle ».
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement correspond à l’adresse directe à Dieu dans le cantique. Le passé composé donne une narration naturelle tout en maintenant le parallélisme du vers.
