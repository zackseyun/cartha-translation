  text: יְמִֽינְ/ךָ֣ יְהוָ֔ה נֶאְדָּרִ֖י בַּ/כֹּ֑חַ יְמִֽינְ/ךָ֥ יְהוָ֖ה תִּרְעַ֥ץ אוֹיֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/006.yaml
  text: Your right hand[a], O Yahweh, is majestic in power; your right hand, O Yahweh[c][b], shatters the enemy.
translation:
  language: fr
  text: 'Ta main droite, Yahweh[a], est majestueuse dans sa puissance[b] ;

    ta main droite, Yahweh, fracasse l’ennemi[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom hébreu est « YHWH », traditionnellement rendu par « le SEIGNEUR ».
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « resplendit de force » ou « est glorieuse dans sa force ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « écrase l’ennemi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמִינְךָ
  choice: ta main droite
  rationale: Le nom יָמִין désigne concrètement la main droite ou le côté droit. Dans ce chant guerrier, l’image évoque aussi la puissance victorieuse de Dieu ; la traduction conserve à la fois l’image et sa portée métaphorique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle du nom divin, plutôt que remplacé par un titre. L’adresse directe est exprimée naturellement en français par l’apposition, sans ajouter « ô », qui donnerait ici une tonalité plus archaïque.
- source_word: נֶאְדָּרִי
  choice: est majestueuse
  rationale: Ce participe de la racine אדר exprime la majesté, la gloire ou la magnificence. Le féminin singulier s’accorde avec « main droite » ; « majestueuse » garde le registre élevé du chant.
- source_word: בַּכֹּחַ
  choice: par sa puissance
  rationale: כֹּחַ signifie force ou puissance. La formulation française « par sa puissance » rend la relation exprimée par ב et demeure naturelle avec « majestueuse », sans réduire la puissance divine à une simple qualité abstraite.
- source_word: תִּרְעַץ
  choice: fracasse
  rationale: Le verbe רָעַץ signifie briser, écraser ou fracasser. « Fracasse » restitue l’action violente et décisive célébrée dans le chant tout en restant idiomatique.
- source_word: אוֹיֵב
  choice: l’ennemi
  rationale: Le singulier peut désigner collectivement la force ennemie. « L’ennemi » respecte la forme hébraïque et convient au contexte de la défaite de l’Égypte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le nom divin. « Yahweh » préserve ce nom personnel, tandis que « le SEIGNEUR » représente la substitution traditionnelle par un titre.
- issue: Valeur temporelle de תִּרְעַץ
  choice: 'présent poétique : « fracasse »'
  alternative: 'futur : « fracassera »'
  rationale: La forme inaccomplie peut recevoir plusieurs nuances temporelles. Dans ce chant célébrant la victoire, le présent français décrit avec vivacité l’action caractéristique et manifestée de la main droite de Yahweh, sans exclure la portée générale de l’énoncé.
translation_notes:
  register: Poésie élevée mais actuelle. La répétition exacte de « ta main droite, Yahweh » est maintenue comme élément rhétorique central. « Ô » n’est pas ajouté, l’apostrophe étant déjà claire en français moderne. Le rythme est réparti sur deux lignes pour faire entendre le parallélisme hébreu.
