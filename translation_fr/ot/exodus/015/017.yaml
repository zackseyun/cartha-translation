    reason: alternative_reading
  - marker: b
    text: L’hébreu emploie ici à la fois le nom divin Yahweh et le titre Seigneur.
    reason: cultural_note
  revision_rationale: 'La révision restitue plus directement le vocabulaire et le parallélisme du texte hébreu : le lieu est « fait » pour la demeure divine, tandis que le sanctuaire est « établi » par les mains divines. Elle conserve l’ambiguïté volontaire concernant la montagne et le sanctuaire, ainsi que les deux vocatifs distincts.'
