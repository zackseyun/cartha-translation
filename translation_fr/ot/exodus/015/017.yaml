source:
  edition: WLC
  text: תְּבִאֵ֗/מוֹ וְ/תִטָּעֵ֨/מוֹ֙ בְּ/הַ֣ר נַחֲלָֽתְ/ךָ֔ מָכ֧וֹן לְ/שִׁבְתְּ/ךָ֛ פָּעַ֖לְתָּ יְהוָ֑ה מִקְּדָ֕שׁ אֲדֹנָ֖/י כּוֹנְנ֥וּ יָדֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/017.yaml
  text: You will bring them in and plant them on the mountain of your inheritance— the place[a], Yahweh, that you made for your dwelling, the sanctuary, Lord[c][b], that your hands established.
translation:
  language: fr
  text: Tu les feras entrer et tu les planteras sur la montagne de ton héritage, lieu que tu as fait pour ta demeure, Yahweh, sanctuaire, Seigneur, que tes mains ont établi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « la montagne de ton héritage » peut désigner largement le pays donné au peuple de Dieu ou, plus précisément, la montagne de son sanctuaire.
    reason: alternative_reading
  - marker: b
    text: L’hébreu emploie ici à la fois le nom divin Yahweh et le titre Seigneur.
    reason: cultural_note
lexical_decisions:
- source_word: תְּבִאֵמוֹ
  choice: Tu les feras entrer
  rationale: Le hifil de בוא exprime le mouvement causatif vers un lieu; cette formulation française conserve à la fois l’action de conduire et l’idée d’entrée.
- source_word: וְתִטָּעֵמוֹ
  choice: et tu les planteras
  rationale: Le sens concret de נטע, « planter », maintient l’image poétique d’un établissement durable et sûr.
- source_word: בְּהַר נַחֲלָתְךָ
  choice: sur la montagne qui est ton héritage
  rationale: Cette tournure naturelle préserve le rapport d’appartenance sans préciser abusivement s’il s’agit du pays entier ou de la montagne du sanctuaire.
- source_word: מָכוֹן לְשִׁבְתְּךָ
  choice: au lieu que tu as préparé pour y demeurer
  rationale: מָכוֹן désigne ici un lieu aménagé ou établi pour la demeure divine; « lieu » reste clair, tandis que « préparé » s’accorde avec le verbe suivant.
- source_word: פָּעַלְתָּ
  choice: tu as préparé
  rationale: פעל peut signifier faire ou réaliser; dans ce contexte, « préparer » exprime naturellement l’aménagement du lieu sans modifier le référent.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel et le distingue du titre אֲדֹנָי présent dans le même verset.
- source_word: מִקְּדָשׁ
  choice: le sanctuaire
  rationale: « Sanctuaire » rend naturellement le lieu saint désigné par מִקְּדָשׁ.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Le titre divin est rendu par « Seigneur », distinct du nom propre Yahweh, sans ajouter le possessif « mon ».
- source_word: כּוֹנְנוּ יָדֶיךָ
  choice: que tes mains ont établi
  rationale: Cette traduction conserve l’image anthropomorphique des mains de Dieu ainsi que l’idée d’une fondation ferme.
theological_decisions:
- issue: Distinction entre יְהוָה et אֲדֹנָי
  choice: Rendre יְהוָה par « Yahweh » et אֲדֹנָי par « Seigneur »
  alternative: Rendre les deux termes par « Seigneur »
  rationale: L’hébreu emploie successivement le nom divin et un titre; les distinguer en français préserve cette donnée du texte.
- issue: Référent de la montagne et du sanctuaire
  choice: Conserver l’imprécision poétique du texte
  alternative: Identifier explicitement la montagne à Canaan ou à Sion et au Temple
  rationale: Le verset peut évoquer à la fois l’héritage où Israël sera établi et, plus précisément, le lieu de la demeure divine; la traduction ne tranche pas au-delà de l’hébreu.
- issue: Rapport entre le lieu de la demeure et le sanctuaire
  choice: Maintenir les deux expressions en apposition poétique
  alternative: Les fondre explicitement en une seule proposition explicative
  rationale: La syntaxe poétique rapproche מָכוֹן et מִקְּדָשׁ, mais ne requiert pas une explicitation interprétative plus forte.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme du cantique est conservé, tout comme l’image concrète de la plantation. La ponctuation met en relief les vocatifs divins sans alourdir la phrase.
