revisions:
- from: Tu les feras entrer et tu les planteras sur la montagne qui est ton héritage, au lieu que tu as préparé pour y demeurer, Yahweh, au sanctuaire, Seigneur, que tes mains ont établi.[a][b]
  to: Tu les feras entrer et tu les planteras sur la montagne de ton héritage, lieu que tu as fait pour ta demeure, Yahweh, sanctuaire, Seigneur, que tes mains ont établi.[a][b]
  rationale: 'La révision restitue plus directement le vocabulaire et le parallélisme du texte hébreu : le lieu est « fait » pour la demeure divine, tandis que le sanctuaire est « établi » par les mains divines. Elle conserve l’ambiguïté volontaire concernant la montagne et le sanctuaire, ainsi que les deux vocatifs distincts.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:13:13Z'
review_pass:
  verdict: revise
  source_fidelity: La structure poétique et les deux vocatifs divins sont conservés, mais « préparé » atténue פָּעַלְתָּ (« tu as fait ») et « pour y demeurer » transforme inutilement « pour ta demeure » en proposition verbale. La révision maintient aussi la distinction entre « fait » et « établi ».
  naturalness: La formulation révisée est plus fluide et plus resserrée en français poétique moderne. « La montagne de ton héritage » rend directement le génitif hébreu sans l’expliciter par une relative.
  terminology: « Yahweh » et « Seigneur » distinguent adéquatement יהוה et אדני. « Sanctuaire » rend היטב מִקְדָּשׁ; « établi » conserve l’idée de fondation ferme de כוננו.
  issues:
  - severity: medium
    issue: « tu as préparé » pour פָּעַלְתָּ
    rationale: פעל signifie ici d’abord « faire/réaliser ». « Préparer » est possible dans l’interprétation contextuelle, mais il affaiblit le parallélisme avec le sanctuaire que les mains divines « ont établi » et introduit une nuance non requise.
  - severity: low
    issue: « au lieu que tu as préparé pour y demeurer »
    rationale: La tournure est grammaticalement possible, mais elle alourdit le parallélisme nominal hébreu et rend « ta demeure » par une action (« y demeurer »).
  revised_text: Tu les feras entrer et tu les planteras sur la montagne de ton héritage, lieu que tu as fait pour ta demeure, Yahweh, sanctuaire, Seigneur, que tes mains ont établi.[a][b]
