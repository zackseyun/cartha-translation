  text: In your steadfast love you have led the people whom you redeemed[b][a]; in your strength you have guided them to your holy dwelling.
translation:
  language: fr
  text: Dans ton amour fidèle, tu as conduit ce peuple que tu as racheté[a] ; par ta puissance, tu l’as guidé à ta demeure sainte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le peuple que tu as racheté ».'
    reason: lexical_alternative
  - marker: b
    text: « Ta demeure sainte » peut désigner largement le lieu de la sainte présence de Dieu ; on l’a compris notamment comme le Sinaï, le pays promis, ou Sion et le temple.
    reason: alternative_reading
lexical_decisions:
- source_word: נָחִיתָ
  choice: tu as conduit
  rationale: Le hiphil de נחה signifie conduire ou guider. « Conduit » rend naturellement l’action accomplie de Dieu et permet de distinguer ce verbe de נהל dans le second membre.
- source_word: בְחַסְדְּךָ
  choice: dans ton amour fidèle
  rationale: חֶסֶד associe amour, fidélité et loyauté durable. « Amour fidèle » conserve cette richesse dans un français moderne et digne; « dans » préserve la formulation poétique et peut évoquer à la fois la disposition et le principe de l’action.
- source_word: עַם זוּ
  choice: ce peuple
  rationale: Le démonstratif זוּ est explicitement rendu par « ce », plutôt que d’être absorbé dans un simple article défini.
- source_word: גָּאָלְתָּ
  choice: tu as racheté
  rationale: גאל désigne l’action de délivrer ou de reprendre comme rédempteur. « Racheter » conserve le poids traditionnel et théologique du terme sans préciser un mécanisme absent du texte.
- source_word: נֵהַלְתָּ
  choice: tu l’as guidé
  rationale: נהל exprime une conduite attentive, parfois pastorale. « Guidé » maintient cette nuance et évite de répéter « conduit ».
- source_word: בְעָזְּךָ
  choice: par ta puissance
  rationale: עֹז désigne la force ou la puissance. Le français instrumental « par ta puissance » est naturel et indique clairement le moyen de cette conduite.
- source_word: אֶל
  choice: vers
  rationale: אֶל marque ici le mouvement en direction d’un but. « Vers » conserve une légère ouverture sur la perspective poétique sans imposer plus explicitement l’entrée ou l’arrivée que ne le fait la préposition seule.
- source_word: נְוֵה קָדְשֶׁךָ
  choice: ta demeure sainte
  rationale: נָוֶה peut désigner une demeure, un lieu de séjour ou un pâturage. Dans ce contexte cultuel, « demeure » est naturel et suffisamment large; « sainte » rend la relation avec קֹדֶשׁ sans identifier un lieu précis.
theological_decisions:
- issue: Référent de « ta demeure sainte »
  choice: Conserver une désignation large du lieu de la présence sainte de Dieu.
  alternative: Identifier explicitement la demeure à Sinaï, au pays promis, à Sion/au temple ou à la demeure céleste.
  rationale: L’hébreu ne tranche pas explicitement entre ces référents, et la poésie peut embrasser en perspective l’ensemble de l’œuvre salvatrice. La traduction ne résout donc pas cette tension.
- issue: Valeur de עַם זוּ
  choice: Rendre explicitement le démonstratif par « ce peuple ».
  alternative: « le peuple que tu as racheté »
  rationale: זוּ a ici une valeur relative ou démonstrative discutée selon l’analyse syntaxique. « Ce peuple que » restitue naturellement la désignation du peuple en français, tandis que la note signale l’autre formulation possible.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme est conservé par « amour fidèle / puissance » et « conduit / guidé ». Les pronoms et accords restent clairs sans alourdir le verset.
