base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/023.yaml
  text: Then they came to Marah[a], but they could not drink the water from Marah because it was bitter. Therefore it was named Marah.
translation:
  language: fr
  text: Ils arrivèrent ensuite à Mara[a], mais ils ne purent pas boire l’eau de Mara, parce qu’elle était amère. C’est pourquoi on donna à ce lieu le nom de Mara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom « Mara » évoque en hébreu le mot traduit par « amère ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Ils arrivèrent ensuite
  rationale: Le wayyiqtol de בוא fait progresser le récit; « ensuite » en rend naturellement la succession en français.
- source_word: מָרָתָה
  choice: à Mara
  rationale: Le hé directionnel indique le mouvement vers ce lieu; « à Mara » est la tournure française idiomatique après « arriver ».
- source_word: וְלֹא יָכְלוּ
  choice: mais ils ne purent pas
  rationale: La conjonction marque ici le contraste entre l’arrivée et l’impossibilité de boire; le passé simple convient au registre narratif.
- source_word: לִשְׁתֹּת מַיִם מִמָּרָה
  choice: boire l’eau de Mara
  rationale: Le français emploie naturellement l’article défini pour l’eau de cet endroit; מִן indique ici sa provenance.
- source_word: כִּי מָרִים הֵם
  choice: parce qu’elle était amère
  rationale: Le pluriel hébreu s’accorde avec מַיִם, morphologiquement pluriel, tandis que « eau » est singulier en français; כִּי conserve sa valeur causale.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette expression introduit directement l’explication du nom et sonne naturelle en français actuel.
- source_word: קָרָא שְׁמָהּ מָרָה
  choice: on donna à ce lieu le nom de Mara
  rationale: Le verbe masculin singulier sans sujet explicite se prête à une construction impersonnelle. L’ajout explicatif « à ce lieu » clarifie le référent du suffixe féminin sans attribuer l’acte à un personnage non nommé.
- source_word: מָרָה / מָרִים
  choice: Mara / amère
  rationale: Le nom propre est translittéré, tandis que l’adjectif est traduit; une note signale le jeu étymologique perceptible en hébreu.
