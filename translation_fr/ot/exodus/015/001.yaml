source:
  edition: WLC
  text: אָ֣ז יָשִֽׁיר מֹשֶׁה֩ וּ/בְנֵ֨י יִשְׂרָאֵ֜ל אֶת הַ/שִּׁירָ֤ה הַ/זֹּאת֙ לַֽ/יהוָ֔ה וַ/יֹּאמְר֖וּ לֵ/אמֹ֑ר אָשִׁ֤ירָה לַֽ/יהוָה֙ כִּֽי גָאֹ֣ה גָּאָ֔ה ס֥וּס וְ/רֹכְב֖/וֹ רָמָ֥ה בַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/001.yaml
  text: 'Then Moses and the sons of Israel sang this song to Yahweh[a], and they said: “I will sing to Yahweh, for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: fr
  text: 'Alors Moïse et les fils d’Israël chantèrent ce chant à Yahweh[a]. Ils dirent :


    « Je chanterai pour Yahweh,


    car il s’est élevé avec majesté[b] ;


    le cheval et son cavalier,


    il les a jetés dans la mer. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, traditionnellement rendu par « le SEIGNEUR » ; autre transcription possible : « Yahvé ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « il a remporté une victoire éclatante ». L’hébreu renforce le verbe au moyen de deux formes de la même racine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז יָשִׁיר
  choice: Alors … chantèrent
  rationale: Avec אָז dans ce récit, l’imparfait יָשִׁיר a une valeur passée. « Alors » marque naturellement la succession après la traversée de la mer.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: et les fils d’Israël
  rationale: Reproduction transparente de l’expression généalogique hébraïque, dans un registre biblique encore compréhensible en français moderne.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: ce chant
  rationale: Traduction directe, sans ajouter une qualification telle que « de louange ».
- source_word: לַיהוָה
  choice: à Yahweh / pour Yahweh
  rationale: Le nom divin est transcrit « Yahweh ». Dans l’introduction, « chanter ce chant à » rend la destination ; dans le vers poétique, « chanter pour » est plus naturel en français.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: Ils dirent
  rationale: La formule hébraïque introduit les paroles qui suivent. Reproduire littéralement « ils dirent en disant » serait redondant et peu naturel en français.
- source_word: אָשִׁירָה
  choice: Je chanterai
  rationale: Le cohortatif exprime ici la résolution du locuteur et conserve le passage de l’introduction plurielle à la voix poétique singulière.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison du chant dans un registre concis et digne.
- source_word: גָאֹה גָּאָה
  choice: il s’est souverainement élevé
  rationale: La construction infinitif absolu plus verbe conjugué intensifie l’idée d’élévation. Ce choix conserve davantage l’image hébraïque que la seule notion interprétative de victoire.
- source_word: סוּס וְרֹכְבוֹ
  choice: le cheval et son cavalier
  rationale: Conserve le singulier collectif et le lien possessif du texte hébreu, avec les articles requis par le français naturel.
- source_word: רָמָה בַיָּם
  choice: il les a jetés dans la mer
  rationale: « Jeter dans » exprime clairement le mouvement indiqué par le verbe et la préposition en contexte. Le pronom pluriel reprend naturellement les deux éléments coordonnés.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La transcription maintient le nom propre de l’alliance présent dans le texte hébreu ; une note signale la convention traditionnelle concurrente.
- issue: Sens de גָאֹה גָּאָה
  choice: il s’est souverainement élevé
  alternative: il a remporté une victoire éclatante
  rationale: Le contexte célèbre clairement la victoire de Dieu, mais la racine exprime l’élévation ou la majesté. Le texte principal préserve cette image et la note donne l’interprétation contextuelle possible.
translation_notes:
  register: Français international moderne, digne et poétique. La mise en vers fait ressortir le début du cantique. La répétition littérale de la formule introductive hébraïque a été allégée, tandis que le singulier collectif et l’intensification du verbe ont été conservés.
