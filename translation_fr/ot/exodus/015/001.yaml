  to: 'Alors Moïse et les fils d’Israël chantèrent ce chant à Yahweh[a]. Ils dirent :


    « Je chanterai pour Yahweh,


    car il s’est élevé avec majesté[b] ;


    le cheval et son cavalier,


    il les a jetés dans la mer. »'
  rationale: La seule révision remplace une expression française maladroite par « il s’est élevé avec majesté ». Cette formulation préserve le sens lexical d’élévation et l’intensification hébraïque, tout en laissant la note signaler l’interprétation contextuelle de victoire. Les ancres de notes et le reste du texte sont conservés.
