id: EXO.15.8
reference: Exodus 15:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בְ/ר֤וּחַ אַפֶּ֨י/ךָ֙ נֶ֣עֶרְמוּ מַ֔יִם נִצְּב֥וּ כְמוֹ נֵ֖ד נֹזְלִ֑ים קָֽפְא֥וּ תְהֹמֹ֖ת בְּ/לֶב יָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/008.yaml
  text: At the blast of your nostrils the waters piled up[a]; the flowing waters stood like a heap[d][c][b]; the depths congealed in the heart of the sea.
translation:
  language: fr
  text: Au souffle de tes narines, les eaux se sont amoncelées ; les eaux courantes se sont dressées comme un monceau[a] ; les profondeurs se sont figées[b] au cœur de la mer[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un tas ». Le nom hébreu désigne un amas ; certaines traductions ont « comme une muraille » en raison d’autres descriptions de la traversée de la mer.
    reason: lexical_alternative
  - marker: b
    text: Ou « se sont épaissies » ; le verbe hébreu peut évoquer ce qui se fige ou se coagule.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « au cœur de la mer », c’est-à-dire en son milieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרוּחַ אַפֶּיךָ
  choice: Au souffle de tes narines
  rationale: רוּחַ peut désigner le vent ou le souffle ; associé à אַפֶּיךָ, il forme ici une image anthropomorphique concrète. « Souffle » est naturel en français et conserve l’image sans l’abstraire en « colère ».
- source_word: נֶעֶרְמוּ מַיִם
  choice: les eaux se sont amoncelées
  rationale: Le verbe exprime l’accumulation en tas. « S’amonceler » rend cette image poétique de façon concise et idiomatique.
- source_word: נִצְּבוּ
  choice: se sont dressées
  rationale: Le verbe signifie se tenir debout ou prendre position. Pour des eaux, « se sont dressées » restitue mieux l’image vive que le simple « se sont tenues ».
- source_word: כְמוֹ נֵד
  choice: comme un monceau
  rationale: נֵד désigne principalement un amas ou un tas. « Monceau » conserve cette donnée lexicale et le registre poétique, sans importer l’image de la muraille depuis les récits parallèles.
- source_word: נֹזְלִים
  choice: les eaux courantes
  rationale: Le participe évoque ce qui coule. « Les eaux courantes » en préserve la force descriptive.
- source_word: קָפְאוּ
  choice: se sont figées
  rationale: Le verbe peut décrire ce qui s’épaissit, se coagule ou se fige. « Se figer » garde l’image tout en évitant d’imposer nécessairement une congélation au sens physique moderne.
- source_word: תְהֹמֹת
  choice: les profondeurs
  rationale: Le pluriel désigne les eaux profondes ou les abîmes marins. « Les profondeurs » est clair, digne et fidèle.
- source_word: בְּלֶב יָם
  choice: au cœur de la mer
  rationale: Traduction directe de l’expression hébraïque, qui signifie aussi « au milieu de la mer ». « Au cœur » conserve sa force poétique.
theological_decisions:
- issue: Représentation anthropomorphique de Dieu dans le cantique de la mer
  choice: Conserver l’image concrète du souffle sortant des narines de Dieu.
  alternative: Rendre l’expression abstraitement par « sous l’effet de ta colère ».
  rationale: Le texte hébreu présente lui-même cette image corporelle pour dépeindre la puissance de l’intervention divine. La conserver respecte la poésie et n’introduit pas une abstraction doctrinale étrangère au verset.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme du verset est conservé, ainsi que ses images concrètes. « Monceau » est légèrement soutenu, mais reste intelligible et correspond au registre d’un cantique ancien.
