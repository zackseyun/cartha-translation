  text: וּ/בְ/רֹ֥ב גְּאוֹנְ/ךָ֖ תַּהֲרֹ֣ס קָמֶ֑י/ךָ תְּשַׁלַּח֙ חֲרֹ֣נְ/ךָ֔ יֹאכְלֵ֖/מוֹ כַּ/קַּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/007.yaml
  text: And in the greatness of your majesty you overthrow those who rise up against you[a]; you send out your burning anger[b]; it consumes them like stubble.
translation:
  language: fr
  text: 'Par la grandeur de ta majesté[a],

    tu renverses ceux qui se dressent contre toi ;

    tu envoies ta colère ardente[b] :

    elle les consume comme du chaume.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Avec l’abondance de ta grandeur. » La préposition hébraïque peut évoquer le moyen ou la sphère ; « abondance » traduit le premier nom, et « grandeur » le second.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tu envoies ta colère brûlante ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֹב
  choice: Par la grandeur de
  rationale: La préposition ב peut exprimer ici le moyen ou la sphère, et רֹב l’abondance ou la grandeur. « Par la grandeur de » donne un français naturel tout en conservant l’idée d’une puissance d’une ampleur écrasante ; le ו initial est rendu implicitement dans la continuité poétique du cantique.
- source_word: גְּאוֹנְךָ
  choice: ta majesté
  rationale: גָּאוֹן peut désigner l’élévation, la grandeur ou la majesté. Dans ce chant de victoire, « majesté » exprime dignement la splendeur et la supériorité souveraine de Dieu.
- source_word: תַּהֲרֹס
  choice: tu renverses
  rationale: הרס signifie démolir, abattre ou renverser. Comme le complément désigne des personnes hostiles plutôt qu’un édifice, « renverses » convient au contexte militaire et poétique.
- source_word: קָמֶיךָ
  choice: ceux qui se dressent contre toi
  rationale: 'Le participe de קום garde une force verbale : il désigne ceux qui se lèvent ou se dressent contre Dieu. Cette formulation conserve cette image au lieu de la réduire au seul nom « adversaires ».'
- source_word: תְּשַׁלַּח
  choice: tu déchaînes
  rationale: שׁלח signifie fondamentalement « envoyer, laisser partir ». Avec la colère pour objet, « déchaînes » est idiomatique en français et exprime la mise en mouvement de cette colère sans atténuer la force du vers.
- source_word: חֲרֹנְךָ
  choice: ton ardente colère
  rationale: חָרוֹן désigne une colère brûlante. « Ardente colère » conserve l’image de la chaleur et prépare naturellement celle du chaume consumé.
- source_word: יֹאכְלֵמוֹ
  choice: elle les consume
  rationale: Le verbe singulier renvoie à la colère, et son suffixe pluriel aux adversaires. « Consume » convient à l’image implicite du feu et reste naturel en français.
- source_word: כַּקַּשׁ
  choice: comme du chaume
  rationale: קַשׁ désigne la paille ou le chaume sec restant des tiges de céréales. « Chaume » rend bien l’image biblique d’une matière sèche rapidement consumée.
theological_decisions:
- issue: Langage du jugement divin et métaphore destructrice
  choice: 'tu déchaînes ton ardente colère : elle les consume comme du chaume'
  alternative: tu envoies ta colère brûlante ; elle les dévore comme de la paille
  rationale: Le texte attribue directement à Dieu un jugement destructeur sous une forme poétique. La traduction en maintient la force et l’image du feu sans les adoucir ni leur ajouter une explication doctrinale.
- issue: Adresse directe à Dieu à la deuxième personne
  choice: ta majesté… contre toi… ton ardente colère
  alternative: la majesté de Dieu… ses adversaires… sa colère
  rationale: Le cantique s’adresse directement à Dieu. Le maintien de la deuxième personne préserve le caractère confessant et célébratif du poème.
translation_notes:
  register: Français international actuel, poétique et digne. Le parallélisme est conservé par la mise en lignes ; le vocabulaire reste accessible tout en maintenant les images fortes de majesté, de colère ardente et de chaume consumé.
