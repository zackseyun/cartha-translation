  source_fidelity: 'Le sens général est fidèle : la grandeur divine renverse les opposants, puis sa colère les consume dans l’image du chaume. Toutefois, « tu déchaînes » interprète davantage תשלח (« tu envoies / fais partir ») que nécessaire ; « tu envoies » conserve mieux le verbe source et l’image de la colère envoyée. La note a attribue aussi à tort l’idée d’« abondance » au nom traduit par « grandeur » : elle relève de רֹב, tandis que גאון renvoie à la grandeur, à la majesté ou à la splendeur.'
  naturalness: Le français est poétique, actuel et fluide. « Par la grandeur de ta majesté », « ceux qui se dressent contre toi » et « elle les consume comme du chaume » conviennent au registre hymnique. « Tu envoies ta colère ardente » reste naturel tout en étant plus proche du texte que « tu déchaînes ».
  terminology: « Majesté », « colère ardente » et « chaume » rendent adéquatement les termes-clés et maintiennent l’imagerie de feu. Les notes doivent distinguer correctement רֹב (« abondance ») de גאון (« grandeur/majesté »).
  issues:
