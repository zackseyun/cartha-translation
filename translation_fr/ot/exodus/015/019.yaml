  text: כִּ֣י בָא֩ ס֨וּס פַּרְעֹ֜ה בְּ/רִכְבּ֤/וֹ וּ/בְ/פָרָשָׁי/ו֙ בַּ/יָּ֔ם וַ/יָּ֧שֶׁב יְהוָ֛ה עֲלֵ/הֶ֖ם אֶת מֵ֣י הַ/יָּ֑ם וּ/בְנֵ֧י יִשְׂרָאֵ֛ל הָלְכ֥וּ בַ/יַּבָּשָׁ֖ה בְּ/ת֥וֹךְ הַ/יָּֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/019.yaml
  text: For Pharaoh’s horses went into the sea with his chariots and with his horsemen[a], and Yahweh brought back the waters of the sea over them[b]; but the sons of Israel walked on dry ground through the midst of the sea.
translation:
  language: fr
  text: Car les chevaux du pharaon sont entrés dans la mer avec ses chars et ses cavaliers[a], et Yahweh a fait revenir sur eux les eaux de la mer ; mais les Israélites ont marché sur la terre ferme au milieu de la mer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « le cheval du pharaon… avec son char » ; ces singuliers peuvent avoir un sens collectif et désigner ses chevaux et ses chars.
    reason: lexical_alternative
  - marker: b
    text: Ou « et les Israélites ». La conjonction hébraïque signifie simplement « et » ; « mais » explicite ici le contraste.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication du refrain précédent et conserve clairement la valeur logique du connecteur hébreu.
- source_word: בָא
  choice: étaient entrés
  rationale: Avec « dans la mer », le verbe exprime ici l’entrée. Le plus-que-parfait s’accorde naturellement en français avec le caractère récapitulatif du verset.
- source_word: סוּס פַּרְעֹה
  choice: les chevaux du pharaon
  rationale: Le singulier hébreu peut avoir un sens collectif. Le pluriel français exprime naturellement l’ensemble des chevaux engagés avec les chars et les cavaliers.
- source_word: בְּרִכְבּוֹ
  choice: avec ses chars
  rationale: Le singulier morphologique peut désigner collectivement les chars ou la force de chars du pharaon ; le pluriel est naturel dans ce contexte militaire.
- source_word: וּבְפָרָשָׁיו
  choice: et ses cavaliers
  rationale: « Cavaliers » désigne directement les combattants montés, sans imposer le terme plus technique de « cavalerie ».
- source_word: וַיָּשֶׁב יְהוָה
  choice: Yahweh avait ramené
  rationale: La forme causative de שׁוב attribue à Yahweh le retour des eaux. « Ramener » préserve cette causalité divine.
- source_word: עֲלֵהֶם אֶת מֵי הַיָּם
  choice: sur eux les eaux de la mer
  rationale: Cette formulation conserve l’image concrète des eaux revenant sur les forces égyptiennes.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: mais les Israélites
  rationale: « Israélites » rend naturellement en français l’expression idiomatique « fils d’Israël ». « Mais » explicite le contraste contextuel porté par la simple conjonction hébraïque.
- source_word: הָלְכוּ בַיַּבָּשָׁה
  choice: avaient marché sur la terre ferme
  rationale: « Marcher » conserve le verbe ordinaire, tandis que « sur la terre ferme » rend clairement l’état asséché du fond marin.
- source_word: בְּתוֹךְ הַיָּם
  choice: au milieu de la mer
  rationale: Rendu direct et idiomatique de l’expression spatiale hébraïque.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » représente le nom propre sans le remplacer par un titre.
- issue: Valeur de la conjonction devant les Israélites
  choice: mais
  alternative: et
  rationale: L’hébreu emploie simplement ו (« et »), mais le contexte établit un contraste net entre le sort des Égyptiens et celui des Israélites. Une note préserve la forme non adversative de l’original.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset étant un récapitulatif des événements immédiatement antérieurs, le plus-que-parfait assure une narration française naturelle. « Pharaon » est accompagné de l’article, conformément à l’usage courant en français.
