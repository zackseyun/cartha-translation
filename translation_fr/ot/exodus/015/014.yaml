  text: שָֽׁמְע֥וּ עַמִּ֖ים יִרְגָּז֑וּ/ן חִ֣יל אָחַ֔ז יֹשְׁבֵ֖י פְּלָֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/014.yaml
  text: The peoples heard; they trembled[a]. Anguish seized the inhabitants of Philistia.
translation:
  language: fr
  text: 'Les peuples ont entendu : ils tremblent[a]. L’angoisse a saisi les habitants de la Philistie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en comprenant les verbes comme rétrospectifs : « Les peuples entendirent ; ils tremblèrent. » La poésie hébraïque peut aussi présenter les faits de manière vive.'
    reason: La succession d’un accompli, d’un inaccompli et d’un accompli permet une lecture vivante au présent ou une lecture rétrospective au passé ; la note conserve cette ambiguïté sans ajouter d’objet au verbe « entendre ».
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: l’ont appris
  rationale: Le qal accompli de שׁמע signifie littéralement « ont entendu ». En français, « l’ont appris » exprime naturellement la nouvelle des actes de Dieu évoqués par le contexte, tout en conservant l’idée de perception par ouï-dire.
- source_word: עַמִּים
  choice: les peuples
  rationale: Le pluriel de עַם désigne collectivement les groupes environnants. « Les peuples » en maintient le pluriel et la portée poétique.
- source_word: יִרְגָּזוּ/ן
  choice: ils tremblent
  rationale: Le verbe רָגַז peut exprimer le tremblement, l’agitation ou l’effroi. Le présent français conserve la forme inaccomplie hébraïque et l’effet vivant du chant, sans trancher en faveur d’un pur passé ou futur.
- source_word: חִיל
  choice: l’angoisse
  rationale: חִיל peut évoquer la douleur, les convulsions ou un tremblement comparable aux douleurs de l’enfantement. « L’angoisse » rend la détresse physique et affective sans imposer une image obstétricale qui reste implicite.
- source_word: אָחַז
  choice: a saisi
  rationale: Le qal accompli de אחז signifie « saisir, empoigner ». « A saisi » garde la force soudaine et dominatrice de l’expression.
- source_word: יֹשְׁבֵי
  choice: les habitants de
  rationale: Le participe substantivé de ישׁב désigne ceux qui résident dans un lieu. « Les habitants de » est précis et naturel en français moderne.
- source_word: פְּלָשֶׁת
  choice: la Philistie
  rationale: Le nom propre désigne le territoire des Philistins. « La Philistie » est la forme géographique française traditionnelle et distingue le pays de ses habitants.
theological_decisions:
- issue: Valeur temporelle des verbes dans la poésie prophétique et rétrospective
  choice: '« l’ont appris : ils tremblent »'
  alternative: « entendirent ; ils tremblèrent » ou « apprendront ; ils trembleront »
  rationale: L’hébreu juxtapose un accompli et un inaccompli dans un chant qui présente vivement les effets des actes de Dieu. Le passé composé suivi du présent respecte cette tension temporelle plutôt que de tout uniformiser.
translation_notes:
  register: Français international moderne, poétique et digne. La phrase brève et le deux-points conservent le parallélisme du vers. Le pronom « l’ » rend explicite de façon minimale l’objet implicite de « entendre/apprendre » en français.
