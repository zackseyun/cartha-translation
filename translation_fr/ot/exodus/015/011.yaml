  text: מִֽי כָמֹ֤/כָה בָּֽ/אֵלִם֙ יְהוָ֔ה מִ֥י כָּמֹ֖/כָה נֶאְדָּ֣ר בַּ/קֹּ֑דֶשׁ נוֹרָ֥א תְהִלֹּ֖ת עֹ֥שֵׂה פֶֽלֶא־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/011.yaml
  text: Who is like you among the gods, O LORD? Who is like you, majestic in holiness, feared in praises, doing wonders?
translation:
  language: fr
  text: Qui est comme toi parmi les dieux, ô Éternel ? Qui est comme toi, majestueux en sainteté, redoutable dans les louanges, toi qui accomplis des merveilles ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאֵלִם
  choice: parmi les dieux
  rationale: Le pluriel אֵלִם désigne ici les dieux ou êtres divins auxquels l’incomparable grandeur de l’Éternel est opposée. La traduction conserve la formulation rhétorique sans en préciser davantage le référent.
- source_word: יְהוָה
  choice: Éternel
  rationale: Rendu français traditionnel du tétragramme, employé ici comme nom divin dans l’apostrophe.
- source_word: נֶאְדָּר בַּקֹּדֶשׁ
  choice: majestueux en sainteté
  rationale: נֶאְדָּר exprime la majesté ou la gloire imposante; בַּקֹּדֶשׁ est conservé comme domaine ou qualité, «en sainteté».
- source_word: נוֹרָא תְהִלֹּת
  choice: redoutable au milieu des louanges
  rationale: נוֹרָא signifie «redoutable, inspirant la crainte»; le pluriel תְהִלֹּת, littéralement «louanges», est maintenu. «Au milieu des» donne en français une relation naturelle tout en laissant ouverte la nuance exacte de la construction hébraïque.
- source_word: עֹשֵׂה פֶלֶא
  choice: toi qui accomplis des merveilles
  rationale: Le participe עֹשֵׂה décrit l’action caractéristique de Dieu; le singulier collectif פֶלֶא se rend naturellement par le pluriel français «des merveilles».
theological_decisions:
- issue: Statut des אֵלִם («dieux» ou «êtres divins»)
  choice: parmi les dieux
  alternative: parmi les êtres divins / parmi les puissants
  rationale: La traduction directe préserve la comparaison poétique et son ambiguïté référentielle, sans affirmer que ces dieux seraient égaux ou comparables à l’Éternel.
- issue: Relation entre «redoutable» et «louanges»
  choice: redoutable au milieu des louanges
  alternative: digne de crainte et de louanges / redoutable dans ses hauts faits glorieux
  rationale: Le choix évite de transformer les «louanges» en un adjectif ou en une seconde qualité coordonnée, et conserve la tension de la formulation hébraïque concise.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme des deux questions est conservé, ainsi que la progression vers l’action divine finale.
