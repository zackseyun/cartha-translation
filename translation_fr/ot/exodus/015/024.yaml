  text: וַ/יִּלֹּ֧נוּ הָ/עָ֛ם עַל מֹשֶׁ֥ה לֵּ/אמֹ֖ר מַה נִּשְׁתֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/024.yaml
  text: And the people grumbled against Moses[a], saying, “What shall we drink?”
translation:
  language: fr
  text: 'Le peuple murmura[a] contre Moïse, en disant : « Que boirons-nous ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se plaignit » ou « récrimina ». Le verbe hébreu évoque une plainte collective, particulièrement dans les récits du désert.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: se plaignit
  rationale: Dans les récits du désert, le verbe לון/לין désigne une plainte collective dirigée contre un responsable. « Se plaindre » est naturel en français moderne et conserve la portée négative du terme.
- source_word: הָעָם
  choice: le peuple
  rationale: Le nom עם avec l’article signifie simplement « le peuple ». Préciser « d’Israël » expliciterait plus que le texte immédiat.
- source_word: עַל
  choice: contre
  rationale: Avec un verbe de plainte, עַל désigne ici la personne prise pour cible et possède une valeur adversative.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: לֵאמֹר
  choice: en disant
  rationale: La formule infinitive introduit le discours direct; « en disant » en maintient explicitement le lien syntaxique.
- source_word: מַה
  choice: Que
  rationale: Pronom interrogatif simple introduisant la question directe.
- source_word: נִשְׁתֶּה
  choice: allons-nous boire
  rationale: L’imparfait hébreu à la première personne du pluriel exprime ici une interrogation immédiate face au besoin. « Qu’allons-nous boire ? » est idiomatique et ne tranche pas excessivement entre délibération et inquiétude.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le singulier « se plaignit » s’accorde avec le nom collectif « le peuple », bien que le verbe hébreu soit au pluriel. La tournure conserve la cible adversative de la plainte et l’urgence de la question.
