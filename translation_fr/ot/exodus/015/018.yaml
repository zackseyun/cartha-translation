  text: יְהוָ֥ה יִמְלֹ֖ךְ לְ/עֹלָ֥ם וָ/עֶֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/018.yaml
  text: Yahweh will reign forever and ever[a].
translation:
  language: fr
  text: Yahweh régnera pour toujours et à jamais[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH ». Traditionnellement traduit par « le Seigneur »; autre forme : « Yahweh ».'
    reason: Signaler la forme hébraïque du nom divin et son rendu traditionnel.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération française courante « Yahweh », afin de conserver le nom divin personnel plutôt que de lui substituer un titre.
- source_word: יִמְלֹךְ
  choice: régnera
  rationale: Dans ce chant célébrant la victoire de Dieu, l’inaccompli hébreu exprime naturellement la permanence future de sa royauté; « régnera » est à la fois précis, solennel et idiomatique.
- source_word: לְעֹלָם וָעֶד
  choice: pour toujours et à jamais
  rationale: Cette expression intensive désigne une durée sans fin. La tournure française conserve la répétition emphatique de l’hébreu tout en restant naturelle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le nom divin. « Yahweh » le préserve, sans remplacer le nom par un titre ni adopter la forme secondaire « Jéhovah ».
translation_notes:
  register: Formulation brève, proclamatoire et solennelle, adaptée à la conclusion d’une strophe poétique. Le futur et l’expression redoublée rendent l’acclamation hébraïque dans un français moderne et digne.
