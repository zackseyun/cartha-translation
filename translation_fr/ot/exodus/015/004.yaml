id: EXO.15.4
reference: Exodus 15:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מַרְכְּבֹ֥ת פַּרְעֹ֛ה וְ/חֵיל֖/וֹ יָרָ֣ה בַ/יָּ֑ם וּ/מִבְחַ֥ר שָֽׁלִשָׁ֖י/ו טֻבְּע֥וּ בְ/יַם סֽוּף־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/004.yaml
  text: Pharaoh’s chariots and his army he cast into the sea[a], and the choicest of his officers were sunk in the Sea of Reeds.
translation:
  language: fr
  text: 'Il a précipité dans la mer les chars de Pharaon et son armée ;

    les meilleurs de ses officiers ont été engloutis dans la mer des Roseaux.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traduction traditionnelle : « mer Rouge ». L’hébreu dit littéralement « mer des Roseaux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְכְּבֹת
  choice: les chars
  rationale: Le pluriel désigne concrètement les chars de guerre de Pharaon ; « chars » est le terme français courant et précis dans ce contexte militaire.
- source_word: פַּרְעֹה
  choice: Pharaon
  rationale: Forme française traditionnelle et courante du titre royal égyptien, employé ici comme désignation du souverain.
- source_word: וְחֵילוֹ
  choice: et son armée
  rationale: Dans ce contexte guerrier, חַיִל désigne les forces militaires de Pharaon plutôt que sa richesse ou sa puissance en général.
- source_word: יָרָה
  choice: a précipité
  rationale: Le verbe exprime l'action de lancer ou de jeter. « Précipiter dans la mer » restitue avec vigueur le mouvement et convient au registre poétique sans devenir archaïque.
- source_word: בַיָּם
  choice: dans la mer
  rationale: Avec « précipiter », la préposition française « dans » exprime naturellement le mouvement vers l'intérieur de la mer.
- source_word: וּמִבְחַר
  choice: les meilleurs
  rationale: Le terme désigne ceux qui ont été choisis comme les meilleurs. Cette formulation française rend clairement la valeur sélective du mot.
- source_word: שָׁלִשָׁיו
  choice: de ses officiers
  rationale: שָׁלִישׁ désigne ici des militaires de rang, peut-être liés aux chars. « Officiers » conserve cette idée sans préciser une fonction que le texte ne permet pas d'établir avec certitude.
- source_word: טֻבְּעוּ
  choice: ont été engloutis
  rationale: La forme passive décrit leur submersion. « Ont été engloutis » conserve le passif et l'image de disparition sous les eaux, sans réduire le sens au seul fait de mourir noyés.
- source_word: בְיַם סוּף
  choice: dans la mer des Roseaux
  rationale: L'expression hébraïque signifie littéralement « mer des Roseaux ». La traduction traditionnelle « mer Rouge » est signalée en note pour orienter les lecteurs.
theological_decisions:
- issue: Traduction de יַם סוּף
  choice: mer des Roseaux
  alternative: mer Rouge
  rationale: La traduction principale suit le sens lexical de l'hébreu plutôt que l'appellation traditionnelle. Celle-ci reste indiquée en note, sans trancher les questions géographiques que le verset ne résout pas.
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme est conservé sur deux lignes. Le sujet divin implicite est rendu par « Il », conformément au contexte immédiat, tandis que le passif du second membre est maintenu.
