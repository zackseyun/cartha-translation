  text: תְּהֹמֹ֖ת יְכַסְיֻ֑/מוּ יָרְד֥וּ בִ/מְצוֹלֹ֖ת כְּמוֹ אָֽבֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/005.yaml
  text: The depths covered them[a]; they went down into the depths like a stone.
translation:
  language: fr
  text: Les eaux profondes les ont recouverts[a] ; ils sont descendus dans les profondeurs comme une pierre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les abîmes les ont recouverts ; ils ont sombré dans les profondeurs comme une pierre. »'
    reason: Alternative lexicale et poétique pour תְּהֹמֹת et יָרְדוּ.
lexical_decisions:
- source_word: תְּהֹמֹת
  choice: les eaux profondes
  rationale: Le pluriel de תְּהוֹם désigne ici les eaux profondes ou l’abîme marin. « Les eaux profondes » est naturel en français et distingue ce terme de מְצוֹלֹת dans le second membre.
- source_word: יְכַסְיֻמוּ
  choice: les ont recouverts
  rationale: La forme de כסה avec suffixe de troisième personne du pluriel signifie que les eaux les ont couverts. « Les ont recouverts » exprime clairement l’engloutissement sans ajouter d’interprétation.
- source_word: יָרְדוּ
  choice: ils sont descendus
  rationale: Le qal accompli de ירד signifie littéralement « descendre ». Cette traduction conserve l’image du mouvement vers le bas ; « ils ont sombré » serait plus interprétatif.
- source_word: בִמְצוֹלֹת
  choice: dans les profondeurs
  rationale: מְצוֹלָה désigne les profondeurs, particulièrement celles de la mer. Après un verbe de mouvement, « dans les profondeurs » rend naturellement la préposition ב.
- source_word: כְּמוֹ
  choice: comme
  rationale: La particule comparative est rendue directement par « comme ».
- source_word: אָבֶן
  choice: une pierre
  rationale: Le nom courant אָבֶן signifie « pierre » ; l’article indéfini convient à la comparaison en français.
theological_decisions: []
