source:
  edition: WLC
  text: וַ/יִּצְעַ֣ק אֶל יְהוָ֗ה וַ/יּוֹרֵ֤/הוּ יְהוָה֙ עֵ֔ץ וַ/יַּשְׁלֵךְ֙ אֶל הַ/מַּ֔יִם וַֽ/יִּמְתְּק֖וּ הַ/מָּ֑יִם שָׁ֣ם שָׂ֥ם ל֛/וֹ חֹ֥ק וּ/מִשְׁפָּ֖ט וְ/שָׁ֥ם נִסָּֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/025.yaml
  text: So he cried out to the LORD, and the LORD showed him a tree. He threw it into the water, and the water became sweet. There he made for them a statute and a judgment, and there he tested them.
translation:
  language: fr
  text: Alors Moïse cria vers le SEIGNEUR, et le SEIGNEUR lui montra un arbre. Il le jeta dans l’eau, et l’eau devint douce. C’est là que le SEIGNEUR donna au peuple une prescription et une règle de droit, et c’est là qu’il le mit à l’épreuve.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: cria
  rationale: Rend directement le verbe צעק, qui exprime ici un appel pressant adressé à Dieu.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Convention française courante pour représenter le tétragramme, avec les petites capitales signalées ici par les majuscules.
- source_word: עֵץ
  choice: un arbre
  rationale: Sens premier du nom hébreu; le contexte pourrait aussi permettre «du bois» ou «un morceau de bois», mais le texte ne le précise pas.
- source_word: וַיִּמְתְּקוּ הַמָּיִם
  choice: l’eau devint douce
  rationale: Conserve l’image hébraïque opposant l’eau devenue agréable à l’eau amère du contexte, sans expliciter davantage.
- source_word: חֹק וּמִשְׁפָּט
  choice: une prescription et une règle de droit
  rationale: 'Distingue les deux termes coordonnés: חֹק désigne ce qui est prescrit ou fixé, et מִשְׁפָּט une norme ou règle relevant du droit.'
- source_word: נִסָּהוּ
  choice: il le mit à l’épreuve
  rationale: Rend le sens habituel de נסה dans ce contexte; le suffixe singulier collectif renvoie au peuple.
theological_decisions:
- issue: Sujet implicite de שָׂם («il donna/établit» et «il mit à l’épreuve»)
  choice: le SEIGNEUR, repris ensuite par «il»
  alternative: Moïse comme sujet grammatical le plus proche
  rationale: Le cadre narratif et la fonction divine de mise à l’épreuve favorisent le SEIGNEUR comme sujet, tout en évitant une formulation qui attribuerait sans nuance ces actes à Moïse.
- issue: Référent du suffixe singulier dans לֹו et נִסָּהוּ
  choice: le peuple, traité comme un collectif singulier
  alternative: Moïse individuellement
  rationale: Le contexte porte sur Israël dans son ensemble; le singulier hébreu permet un référent collectif.
translation_notes:
  register: Français international moderne, sobre et digne. «Alors» assure la continuité narrative; «C’est là que» reproduit l’insistance de שָׁם… וְשָׁם. Les référents implicites ont été explicités là où le français l’exige pour éviter une lecture naturellement mais probablement erronée attribuant l’établissement et l’épreuve à Moïse.
