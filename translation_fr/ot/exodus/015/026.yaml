source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אִם שָׁמ֨וֹעַ תִּשְׁמַ֜ע לְ/ק֣וֹל יְהוָ֣ה אֱלֹהֶ֗י/ךָ וְ/הַ/יָּשָׁ֤ר בְּ/עֵינָי/ו֙ תַּעֲשֶׂ֔ה וְ/הַֽאֲזַנְתָּ֙ לְ/מִצְוֺתָ֔י/ו וְ/שָׁמַרְתָּ֖ כָּל חֻקָּ֑י/ו כָּֽל הַ/מַּֽחֲלָ֞ה אֲשֶׁר שַׂ֤מְתִּי בְ/מִצְרַ֨יִם֙ לֹא אָשִׂ֣ים עָלֶ֔י/ךָ כִּ֛י אֲנִ֥י יְהוָ֖ה רֹפְאֶֽ/ךָ־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/026.yaml
  text: He said[a], “If you diligently listen to the voice of Yahweh your God, and do what is right in his eyes, and give ear to his commandments, and keep all his statutes, I will put none of the diseases on you that I put on Egypt, for I am Yahweh, your healer.”
translation:
  language: fr
  text: 'Il dit : « Si tu écoutes attentivement la voix de Yahweh, ton Dieu, si tu fais ce qui est droit à ses yeux, si tu prêtes l’oreille à ses commandements et si tu observes toutes ses prescriptions, je ne ferai venir sur toi aucune des maladies que j’ai fait venir sur l’Égypte, car moi, je suis Yahweh, celui qui te guérit[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ton guérisseur ».'
    reason: Le participe hébreu רֹפְאֶךָ peut se rendre soit par une proposition verbale, soit par un titre nominal.
lexical_decisions:
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: écoutes attentivement
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’action. « Écoutes attentivement » conserve à la fois le sens auditif et l’idée d’une écoute qui conduit à l’obéissance.
- source_word: לְקוֹל
  choice: la voix de
  rationale: Cette traduction directe de קוֹל préserve l’expression hébraïque tout en restant naturelle en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend explicitement le nom divin présent dans le texte hébreu.
- source_word: וְהַיָּשָׁר בְּעֵינָיו
  choice: ce qui est droit à ses yeux
  rationale: Cette formulation conserve l’image hébraïque et sa portée morale sans la réduire à ce qui serait simplement agréable.
- source_word: וְהַאֲזַנְתָּ
  choice: prêtes l’oreille
  rationale: Le hifil de אזן exprime une écoute attentive. « Prêter l’oreille » permet de le distinguer du premier verbe d’écoute.
- source_word: לְמִצְוֺתָיו
  choice: à ses commandements
  rationale: « Commandements » rend précisément le caractère prescriptif de מִצְוֹת dans ce contexte d’alliance.
- source_word: וְשָׁמַרְתָּ
  choice: observes
  rationale: Dans un contexte juridique et religieux, שׁמר signifie couramment respecter ou observer des prescriptions.
- source_word: כָּל חֻקָּיו
  choice: toutes ses prescriptions
  rationale: « Prescriptions » exprime le caractère fixé et normatif de חֻקִּים dans un français actuel.
- source_word: כָּל הַמַּחֲלָה
  choice: aucune des maladies
  rationale: Le singulier collectif précédé de כָּל appelle naturellement cette formulation négative en français.
- source_word: אֲשֶׁר שַׂמְתִּי בְמִצְרַיִם / לֹא אָשִׂים עָלֶיךָ
  choice: que j’ai fait venir sur l’Égypte / je ne ferai venir sur toi
  rationale: La répétition de « faire venir sur » maintient la correspondance lexicale entre les deux emplois de שׂים et produit une formulation française naturelle.
- source_word: רֹפְאֶךָ
  choice: celui qui te guérit
  rationale: Le participe רֹפֵא peut être compris verbalement ou comme un titre nominal. La formulation principale est naturelle en français et la variante nominale est conservée en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom d’alliance sans le remplacer par un titre.
- issue: Portée de la promesse concernant les maladies
  choice: Promesse conditionnelle liée à l’écoute et à l’obéissance d’Israël, en référence aux maladies infligées à l’Égypte
  alternative: Garantie universelle de guérison physique individuelle, ou déclaration purement métaphorique
  rationale: La syntaxe conditionnelle et la référence historique à l’Égypte doivent être conservées sans élargir ni spiritualiser la promesse au-delà du verset.
- issue: Valeur du participe רֹפְאֶךָ
  choice: celui qui te guérit
  alternative: ton guérisseur
  rationale: Le participe autorise une lecture verbale et une lecture nominale. Le texte principal retient la tournure française la plus naturelle, tandis que la note préserve l’autre nuance.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète les formes hébraïques adressées à Israël comme entité collective. Le parallélisme conditionnel est rendu par la répétition de « si », afin de clarifier la longue protase sans en modifier la portée.
