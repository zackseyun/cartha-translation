  text: אָ֤ז נִבְהֲלוּ֙ אַלּוּפֵ֣י אֱד֔וֹם אֵילֵ֣י מוֹאָ֔ב יֹֽאחֲזֵ֖/מוֹ רָ֑עַד נָמֹ֕גוּ כֹּ֖ל יֹשְׁבֵ֥י כְנָֽעַן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/015.yaml
  text: Then the chiefs of Edom were terrified[a]; trembling seized the leaders of Moab; all the inhabitants of Canaan melted away.
translation:
  language: fr
  text: 'Alors les chefs d’Édom furent terrifiés ;

    un tremblement saisit les puissants de Moab[a] ;

    tous les habitants de Canaan fondirent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut aussi se traduire par « les hommes forts de Moab » ou « les chefs de Moab » ; littéralement, il peut désigner des « béliers » et, par extension, des hommes forts ou éminents.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Adverbe temporel qui présente la peur des peuples comme une conséquence de l’intervention salvatrice célébrée dans le chant.
- source_word: נִבְהֲלוּ
  choice: furent terrifiés
  rationale: Le niphal de בהל exprime ici un profond bouleversement causé par la peur ; « furent terrifiés » convient à l’intensité poétique du contexte.
- source_word: אַלּוּפֵי אֱדוֹם
  choice: les chefs d’Édom
  rationale: אַלּוּף désigne des chefs ou dirigeants de clan ; « chefs » garde ce sens sans leur attribuer un titre royal précis.
- source_word: אֵילֵי מוֹאָב
  choice: les puissants de Moab
  rationale: L’expression évoque littéralement les êtres forts et désigne ici les hommes puissants ou dirigeants de Moab. « Puissants » préserve mieux l’image et l’ambiguïté sociale que le seul mot « chefs ».
- source_word: יֹאחֲזֵמוֹ רָעַד
  choice: un tremblement saisit
  rationale: La construction personnifie le tremblement comme une force qui s’empare d’eux ; cette formulation conserve l’image et l’ordre poétique.
- source_word: נָמֹגוּ
  choice: se sont effondrés de peur
  rationale: מוג décrit métaphoriquement le fait de fondre ou de perdre toute fermeté sous l’effet de la peur. La formulation française transmet naturellement cette perte de courage sans suggérer une liquéfaction physique.
- source_word: כֹּל יֹשְׁבֵי כְנָעַן
  choice: tous les habitants de Canaan
  rationale: Rendu direct et idiomatique de la construction participiale, en conservant sa portée collective.
theological_decisions: []
