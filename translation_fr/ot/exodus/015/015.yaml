  register: Français international moderne, poétique et digne. Les trois propositions parallèles sont disposées en vers. Le point-virgule soutient le rythme cumulatif du chant. La métaphore finale est rendue idiomatiquement tout en conservant l’idée d’une dissolution du courage.
