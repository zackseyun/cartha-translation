  text: Yahweh is a warrior[b][a]; Yahweh is his name.
translation:
  language: fr
  text: Yahvé est un guerrier[a] ; Yahvé est son nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un homme de guerre ». Le nom hébreu YHWH est aussi rendu, selon les traductions, par « le Seigneur » ou « l’Éternel » ; on trouve également les formes « Yahweh » et « Jéhovah ».'
    reason: Précision littérale et indication neutre des principaux rendus du nom divin.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française traditionnelle « Yahvé » translittère le tétragramme et préserve le nom personnel divin plutôt que de lui substituer le titre « le Seigneur ».
- source_word: אִישׁ מִלְחָמָה
  choice: un guerrier
  rationale: Littéralement « homme de guerre », l’expression désigne idiomatiquement un combattant. « Un guerrier » est naturel en français moderne, conserve l’image martiale et convient au registre poétique.
- source_word: שְׁמוֹ
  choice: est son nom
  rationale: L’hébreu présente une proposition nominale sans verbe exprimé, « YHWH, son nom ». Le français exige ici l’ajout de « est ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahvé » en conserve la fonction de nom propre, sans le remplacer par un titre ; une note signale les autres usages français.
- issue: Interprétation de אִישׁ מִלְחָמָה
  choice: un guerrier
  alternative: un homme de guerre
  rationale: « Homme de guerre » reproduit plus formellement les éléments hébreux, mais « guerrier » exprime naturellement en français le sens de cette construction tout en gardant sa force poétique.
translation_notes:
  register: Français international moderne, sobre et poétique. La répétition de « Yahvé » et le parallélisme très compact de l’hébreu sont conservés.
