  yaml_path: translation/ot/exodus/015/027.yaml
  text: Then they came to Elim[a], where there were twelve springs of water and seventy palm trees[c][b], and they camped there by the water.
translation:
  language: fr
  text: Puis ils arrivèrent à Élim, où se trouvaient douze sources et soixante-dix palmiers[a]. Ils campèrent là, près de l’eau[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut être rendu plus précisément par « palmiers-dattiers ».
    reason: lexical_alternative
  - marker: b
    text: Ou « près des eaux ». En hébreu, le mot rendu par « eau » a ici une forme plurielle souvent employée dans un sens collectif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Puis ils arrivèrent
  rationale: Le wayyiqtol de בוא fait progresser le récit. « Puis » exprime naturellement cette succession en français moderne.
- source_word: אֵילִמָה
  choice: à Élim
  rationale: Le nom propre est translittéré, et le hé directionnel est rendu par « à » avec le verbe de mouvement.
- source_word: וְשָׁם
  choice: où se trouvaient
  rationale: Littéralement « et là » ; la relative locative est plus naturelle en français après le nom du lieu, sans modifier le sens.
- source_word: עֵינֹת מַיִם
  choice: sources
  rationale: עַיִן désigne ici une source d’eau. En français, « sources » suffit naturellement, l’idée d’eau étant inhérente au terme dans ce contexte.
- source_word: וְשִׁבְעִים תְּמָרִים
  choice: et soixante-dix palmiers-dattiers
  rationale: תָּמָר désigne le palmier-dattier. Ce terme français précis reste courant et évite de réduire le mot à la catégorie plus générale des palmiers.
- source_word: וַיַּחֲנוּ
  choice: Ils campèrent
  rationale: Le verbe חנה signifie établir son camp. « Camper » est actuel et direct ; une nouvelle phrase conserve clairement la progression narrative.
- source_word: עַל הַמָּיִם
  choice: près de l’eau
  rationale: Dans ce contexte spatial, עַל exprime la proximité. Le pluriel morphologique מַיִם se rend idiomatiquement par le collectif singulier « l’eau » en français.
