source:
  edition: WLC
  text: עָזִּ֤/י וְ/זִמְרָת֙ יָ֔הּ וַֽ/יְהִי לִ֖/י לִֽ/ישׁוּעָ֑ה זֶ֤ה אֵלִ/י֙ וְ/אַנְוֵ֔/הוּ אֱלֹהֵ֥י אָבִ֖/י וַ/אֲרֹמְמֶֽ/נְהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/002.yaml
  text: Yah is my strength and song[a], and he has become my salvation. This is my God, and I will praise him; my father's God, and I will exalt him.
translation:
  language: fr
  text: 'Yah est ma force et mon chant,

    et il est devenu mon salut.

    C’est lui, mon Dieu, et je le célébrerai[a] ;

    le Dieu de mon père, et je l’exalterai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je lui préparerai une demeure ». Le verbe hébreu est difficile et peut aussi évoquer l’idée d’embellir ou de glorifier.'
    reason: Lecture alternative d’un verbe hébreu au sens débattu.
lexical_decisions:
- source_word: עָזִּי
  choice: ma force
  rationale: Le nom עֹז désigne la force ou la puissance. « Ma force » est naturel en français et convient au parallélisme poétique.
- source_word: וְזִמְרָת יָהּ
  choice: et mon chant, Yah
  rationale: זִמְרָה peut désigner le chant ou la louange musicale. La construction poétique traditionnelle identifie Yah comme la force et le chant du chanteur ; en français, « Yah est ma force et mon chant » restitue clairement cette relation.
- source_word: יָהּ
  choice: Yah
  rationale: Le texte emploie la forme courte du nom divin, יָהּ, et non le tétragramme יהוה. « Yah » en conserve la forme particulière et la portée poétique.
- source_word: וַיְהִי לִי לִישׁוּעָה
  choice: et il est devenu mon salut
  rationale: La construction היה + ל exprime ici ce que Yah est devenu pour le chanteur. Le passé composé rend naturellement en français le résultat présent de la délivrance célébrée.
- source_word: זֶה אֵלִי
  choice: C’est lui, mon Dieu
  rationale: Le démonstratif זֶה a une valeur d’identification emphatique. « C’est lui, mon Dieu » est idiomatique et conserve cette insistance.
- source_word: וְאַנְוֵהוּ
  choice: et je le célébrerai
  rationale: Le verbe est difficile. « Je le célébrerai » s’accorde avec le contexte du cantique et avec le parallèle « je l’exalterai », sans imposer le sens plus précis de « louer ». L’autre interprétation, liée à l’idée de demeure ou d’embellissement, est signalée en note.
- source_word: אֱלֹהֵי אָבִי
  choice: le Dieu de mon père
  rationale: Cette traduction directe du groupe construit singulier reste naturelle en français et préserve la référence familiale.
- source_word: וַאֲרֹמְמֶנְהוּ
  choice: et je l’exalterai
  rationale: Le verbe רומם signifie élever ou exalter. « Exalter » conserve la métaphore et le registre digne du cantique.
theological_decisions:
- issue: Rendu du nom divin יָהּ
  choice: Yah
  alternative: le SEIGNEUR
  rationale: Le texte source utilise la forme abrégée יָהּ. La conserver évite de l’assimiler sans indication au tétragramme complet et respecte la forme poétique hébraïque.
- issue: Interprétation de וְאַנְוֵהוּ
  choice: je le célébrerai
  alternative: je lui préparerai une demeure
  rationale: Le sens exact du verbe est débattu. Le texte principal retient le sens qui convient le mieux au parallélisme de louange, tandis que la note préserve l’importante autre lecture sans trancher au-delà des données.
translation_notes:
  register: Français international moderne, poétique et digne. Les lignes suivent les membres du vers hébreu. « Yah » conserve la forme courte du nom divin ; « C’est lui » maintient l’emphase du démonstratif. Le marqueur de note est placé sur le verbe réellement concerné par l’ambiguïté.
