  source_fidelity: 'La traduction rend correctement l’impératif, le nom divin, l’intensification de גָאֹה גָּאָה, ainsi que l’image du cheval et de son cavalier jetés dans la mer. Toutefois, וַתַּעַן est un accompli narratif : « répondait » introduit un imparfait duratif ou habituel absent du texte. « répondit » préserve le sens de base sans trancher la question d’une réponse antiphonique chantée.'
