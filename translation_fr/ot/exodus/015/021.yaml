source:
  edition: WLC
  text: וַ/תַּ֥עַן לָ/הֶ֖ם מִרְיָ֑ם שִׁ֤ירוּ לַֽ/יהוָה֙ כִּֽי גָאֹ֣ה גָּאָ֔ה ס֥וּס וְ/רֹכְב֖/וֹ רָמָ֥ה בַ/יָּֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/021.yaml
  text: 'And Miriam answered them: “Sing to Yahweh[a], for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: fr
  text: 'Miriam leur répondit : « Chantez à Yahweh, car il a remporté un éclatant triomphe[a] ; le cheval et son cavalier, il les a jetés dans la mer. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « car il s’est souverainement élevé » ou « car il est hautement exalté ». Le tour hébreu intensif exprime ici son triomphe majestueux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן
  choice: répondait
  rationale: Le verbe signifie fondamentalement « répondre ». Dans ce cadre musical, l’imparfait français suggère naturellement une réponse chantée ou reprise en refrain sans imposer une reconstruction précise du mode d’exécution.
- source_word: לָהֶם
  choice: leur
  rationale: Le suffixe masculin pluriel est conservé sans préciser davantage le groupe visé, même si le contexte précédent mentionne les femmes.
- source_word: מִרְיָם
  choice: Miryam
  rationale: Translittération française proche de la forme hébraïque du nom.
- source_word: שִׁירוּ
  choice: Chantez
  rationale: Impératif pluriel direct de שׁיר ; « chantez les louanges » ajouterait une précision absente du verbe.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: Le nom divin יהוה est rendu par « Yahweh ». Avec chanter, « pour » exprime naturellement en français le destinataire du chant.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de l’appel à chanter dans un registre poétique digne.
- source_word: גָאֹה גָּאָה
  choice: il a remporté un éclatant triomphe
  rationale: L’infinitif absolu associé au verbe intensifie l’idée. Dans ce chant de victoire, cette formulation rend l’éclat manifeste du triomphe tout en signalant en note le tour hébreu plus littéral.
- source_word: סוּס וְרֹכְבוֹ
  choice: le cheval et son cavalier
  rationale: Le singulier a une portée collective ou représentative ; le suffixe relie explicitement le cavalier au cheval.
- source_word: רָמָה
  choice: il les a jetés
  rationale: Le verbe exprime l’action de jeter. Le pronom pluriel reprend en français les deux éléments coordonnés, le cheval et son cavalier.
- source_word: בַיָּם
  choice: dans la mer
  rationale: Après « jeter », « dans la mer » rend naturellement le mouvement et son résultat, tout en restant proche de la préposition hébraïque.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom divin plutôt que de le remplacer par un titre.
- issue: Sens de גָאֹה גָּאָה dans le chant de victoire
  choice: il a remporté un éclatant triomphe
  alternative: il s’est souverainement élevé ; il est hautement exalté
  rationale: Le contexte célèbre l’action victorieuse de Dieu. La traduction principale exprime ce triomphe, tandis que la note conserve la tension avec l’image hébraïque d’élévation.
translation_notes:
  register: Français international moderne, poétique et digne. L’ordre disloqué « le cheval et son cavalier, il les a jetés » garde l’accent emphatique du chant hébreu. « Répondait » laisse entendre une réponse chantée sans ajouter de note dont le marqueur risquerait d’être confondu avec celui portant sur גָאֹה גָּאָה.
