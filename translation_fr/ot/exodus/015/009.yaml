base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/009.yaml
  text: The enemy said[a], ‘I will pursue, I will overtake, I will divide the spoil; my desire will be satisfied on them. I will draw my sword[b]; my hand will dispossess them.’
translation:
  language: fr
  text: 'L’ennemi dit :


    « Je les poursuivrai, je les rattraperai,

    je partagerai le butin ;

    je me rassasierai d’eux.[a]


    Je tirerai mon épée ;

    ma main les dépouillera.[b] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mon être sera rempli d’eux ». L’expression évoque un appétit ou un désir satisfait.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les chassera ». Selon le contexte, le verbe peut aussi évoquer le fait de les faire périr.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר אוֹיֵב
  choice: L’ennemi disait
  rationale: Le singulier désigne ici l’adversaire collectif, l’Égypte. L’imparfait français introduit naturellement la vantardise de l’ennemi dans ce récit poétique.
- source_word: אֶרְדֹּף אַשִּׂיג
  choice: Je les poursuivrai, je les rattraperai
  rationale: Les inaccomplis expriment les actions projetées par l’ennemi. Les pronoms objets, implicites en hébreu, sont nécessaires et naturels en français.
- source_word: אֲחַלֵּק שָׁלָל
  choice: je partagerai le butin
  rationale: Expression militaire courante désignant la répartition des prises de guerre.
- source_word: תִּמְלָאֵמוֹ נַפְשִׁי
  choice: je me rassasierai d’eux
  rationale: Littéralement, « mon être/appétit sera rempli d’eux ». La formulation choisie restitue naturellement l’idée d’un désir hostile pleinement assouvi tout en conservant l’image de satiété.
- source_word: אָרִיק חַרְבִּי
  choice: Je tirerai mon épée
  rationale: Avec « épée », le verbe signifie idiomatiquement tirer l’arme de son fourreau.
- source_word: תּוֹרִישֵׁמוֹ יָדִי
  choice: ma main les dépossédera
  rationale: Le hifil de ירשׁ exprime couramment l’action de déposséder ou de chasser. Le choix maintient cette valeur fondamentale ainsi que la personnification de la main, sans imposer le sens contextuel plus fort « anéantir ».
theological_decisions:
- issue: Portée de נֶפֶשׁ dans la vantardise de l’ennemi
  choice: 'Expression de l’appétit ou du désir : « je me rassasierai d’eux »'
  alternative: « mon âme sera remplie d’eux »
  rationale: Dans ce contexte guerrier, נֶפֶשׁ désigne l’appétit intérieur plutôt qu’une « âme » définie de manière technique. La note conserve néanmoins la forme littérale.
- issue: Sens de תּוֹרִישֵׁמוֹ
  choice: « les dépossédera »
  alternative: « les chassera » ou « les anéantira »
  rationale: Le verbe permet plusieurs nuances dans ce contexte. Le texte principal retient sa valeur lexicale centrale, et la note signale les lectures contextuelles possibles sans résoudre abusivement l’ambiguïté.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les répétitions brèves et le parallélisme sont conservés afin de rendre le rythme haletant de la vantardise guerrière. Les marqueurs de notes sont placés après les expressions hébraïques auxquelles ils se rapportent.
