  to: 'L’ennemi dit :


    « Je les poursuivrai, je les rattraperai,

    je partagerai le butin ;

    je me rassasierai d’eux.[a]


    Je tirerai mon épée ;

    ma main les dépouillera.[b] »'
  rationale: La révision remplace l’imparfait introductif par un passé simple de citation plus fidèle au qatal hébreu, améliore l’idiomaticité de la dernière clause, et resserre les notes afin qu’elles éclairent les alternatives lexicales sans surinterpréter le texte. Les deux ancrages de note demeurent placés sur les expressions concernées.
