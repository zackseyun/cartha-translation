  text: תִּפֹּ֨ל עֲלֵי/הֶ֤ם אֵימָ֨תָ/ה֙ וָ/פַ֔חַד בִּ/גְדֹ֥ל זְרוֹעֲ/ךָ֖ יִדְּמ֣וּ כָּ/אָ֑בֶן עַד יַעֲבֹ֤ר עַמְּ/ךָ֙ יְהוָ֔ה עַֽד יַעֲבֹ֖ר עַם ז֥וּ קָנִֽיתָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/016.yaml
  text: Terror and dread will fall on them[a]; by the greatness of your arm they will be still as a stone, until your people pass by, O Yahweh[c][b], until this people whom you acquired pass by.
translation:
  language: fr
  text: La terreur et l’effroi tomberont sur eux ; par la grandeur de ton bras, ils resteront immobiles comme une pierre[a], jusqu’à ce que ton peuple passe, ô Yahweh, jusqu’à ce que passe ce peuple que tu as acquis[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils resteront silencieux » ou « ils demeureront figés ».
    reason: lexical_alternative
  - marker: b
    text: Ou « jusqu’à ce que ton peuple traverse […] jusqu’à ce que traverse ce peuple ».
    reason: lexical_alternative
  - marker: c
    text: « Tu as acquis » peut aussi se traduire par « tu as acheté » ou, dans un sens plus large lié à l’alliance, « tu as fait tien ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפֹּל
  choice: tomberont
  rationale: Le qal inaccompli exprime ici l’annonce de ce qui frappera les peuples. Bien que le verbe hébreu soit au féminin singulier, les deux noms coordonnés appellent naturellement le pluriel en français.
- source_word: אֵימָתָה וָפַחַד
  choice: la terreur et l’effroi
  rationale: Ces deux termes proches forment une intensification poétique. Deux mots distincts conservent leur parallélisme sans les confondre.
- source_word: בִּגְדֹל זְרוֹעֲךָ
  choice: par la grandeur de ton bras
  rationale: Cette formulation garde à la fois la valeur instrumentale ou causale de ב et l’image biblique du bras comme manifestation de puissance.
- source_word: יִדְּמוּ
  choice: ils resteront immobiles
  rationale: Le verbe peut évoquer l’immobilité, le silence ou l’arrêt. Dans la comparaison avec une pierre, l’immobilité convient au contexte tout en laissant les autres nuances en note.
- source_word: כָּאָבֶן
  choice: comme une pierre
  rationale: Traduction directe de la comparaison, qui en préserve l’image poétique.
- source_word: עַד יַעֲבֹר
  choice: jusqu’à ce que … passe
  rationale: עבר désigne ici le passage ou la traversée du peuple. « Passe » demeure naturel et assez large pour ne pas imposer exclusivement l’idée d’une traversée d’eau.
- source_word: עַמְּךָ
  choice: ton peuple
  rationale: La traduction conserve la relation d’appartenance exprimée par le suffixe et la portée collective de עם.
- source_word: יְהוָה
  choice: ô Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre. « ô » marque clairement l’apostrophe dans le chant.
- source_word: עַם זוּ
  choice: ce peuple
  rationale: Le démonstratif זוּ est conservé par « ce », en parallèle avec « ton peuple ».
- source_word: קָנִיתָ
  choice: tu as acquis
  rationale: קנה signifie acquérir, acheter ou faire sien. « Acquis » conserve cette largeur sémantique sans introduire un verbe technique de rédemption absent de la proposition.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte emploie directement le tétragramme. La translittération préserve le nom personnel d’alliance plutôt que de lui substituer un titre.
- issue: Portée de קָנִיתָ appliqué au peuple
  choice: tu as acquis
  alternative: tu as acheté / tu as fait tien / tu as créé
  rationale: « Acquis » rend le sens central de קנה tout en maintenant l’ambiguïté entre acquisition et appropriation d’alliance, sans préciser davantage le mécanisme théologique.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition de « jusqu’à ce que passe » et la métaphore du bras sont maintenues. Le vocabulaire reste accessible, tandis que « ô Yahweh » signale naturellement l’apostrophe lyrique.
