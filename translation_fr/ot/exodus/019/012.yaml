  text: וְ/הִגְבַּלְתָּ֤ אֶת הָ/עָם֙ סָבִ֣יב לֵ/אמֹ֔ר הִשָּׁמְר֥וּ לָ/כֶ֛ם עֲל֥וֹת בָּ/הָ֖ר וּ/נְגֹ֣עַ בְּ/קָצֵ֑/הוּ כָּל הַ/נֹּגֵ֥עַ בָּ/הָ֖ר מ֥וֹת יוּמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/012.yaml
  text: And you shall set bounds for the people all around[a], saying, ‘Be careful not to go up on the mountain or touch its edge. Whoever touches the mountain shall surely be put to death.’
translation:
  language: fr
  text: 'Tu fixeras une limite tout autour du peuple et tu diras : « Gardez-vous de monter sur la montagne ou d’en toucher le bord. Quiconque touchera la montagne sera certainement mis à mort[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mourra certainement ». L’hébreu emploie une formule emphatique de mort ; la traduction principale conserve ici la forme passive, en accord avec l’exécution prescrite au verset suivant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגְבַּלְתָּ
  choice: Tu fixeras des limites
  rationale: Le hifil de גבל exprime l’établissement d’une limite ou d’une frontière. Cette formulation conserve l’image concrète tout en restant naturelle en français.
- source_word: אֶת־הָעָם סָבִיב
  choice: au peuple tout autour
  rationale: La formulation rend le peuple comme bénéficiaire de la délimitation et סָבִיב comme une limite disposée tout autour, sans ajouter explicitement un complément absent du texte hébreu.
- source_word: לֵאמֹר
  choice: et tu diras
  rationale: L’infinitif introduit le contenu de l’ordre. Une proposition coordonnée est plus idiomatique en français que le calque « en disant ».
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: Gardez-vous
  rationale: Cette tournure rend l’impératif réfléchi et sa forte valeur d’avertissement, dans un registre actuel mais digne.
- source_word: עֲלוֹת בָּהָר
  choice: de monter sur la montagne
  rationale: עלה désigne ici l’action de monter, et la préposition ב suggère l’accès à la montagne plutôt qu’une simple progression vers elle.
- source_word: וּנְגֹעַ בְּקָצֵהוּ
  choice: ou d’en toucher le bord
  rationale: נגע signifie « toucher » et קצהו « son extrémité, son bord ». « En toucher le bord » maintient le lien spatial avec la limite établie.
- source_word: כָּל־הַנֹּגֵעַ בָּהָר
  choice: Quiconque touchera la montagne
  rationale: La construction a une portée générique et distributive. « Quiconque » exprime clairement l’universalité de l’interdiction.
- source_word: מוֹת יוּמָת
  choice: sera certainement mis à mort
  rationale: L’infinitif absolu suivi de la forme verbale passive exprime une forte certitude. « Sera mis à mort » préserve le passif, tandis que « certainement » marque l’intensification.
theological_decisions:
- issue: Nature de la peine exprimée par מוֹת יוּמָת
  choice: sera certainement mis à mort
  alternative: mourra certainement
  rationale: Le passif hébreu favorise l’idée d’une mise à mort, confirmée par les modalités d’exécution données au verset suivant. La note conserve toutefois l’autre manière possible de rendre la formule emphatique.
translation_notes:
  register: Français international moderne, clair et digne. « Gardez-vous » maintient la solennité et la force de l’avertissement sans archaïsme excessif. La structure directe évite les calques lourds tout en restant proche de l’ordre et des images de l’hébreu.
