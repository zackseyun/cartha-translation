source:
  edition: WLC
  text: וְ/הָי֥וּ נְכֹנִ֖ים לַ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י כִּ֣י בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֗י יֵרֵ֧ד יְהוָ֛ה לְ/עֵינֵ֥י כָל הָ/עָ֖ם עַל הַ֥ר סִינָֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/011.yaml
  text: and let them be ready for the third day[a], because on the third day Yahweh will come down in the sight of all the people on Mount Sinai.
translation:
  language: fr
  text: Qu’ils soient prêts pour le troisième jour, car le troisième jour, Yahweh descendra sur le mont Sinaï sous les yeux de tout le peuple.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיוּ
  choice: Qu’ils soient
  rationale: Dans la suite des instructions précédentes, la forme verbale a une valeur injonctive. Le subjonctif français exprime naturellement cette consigne.
- source_word: נְכֹנִים
  choice: prêts
  rationale: L’adjectif désigne ici l’état de préparation requis en vue de la manifestation divine.
- source_word: לַיּוֹם הַשְּׁלִישִׁי
  choice: pour le troisième jour
  rationale: La préposition ל indique le jour en vue duquel le peuple doit se préparer, plutôt qu’une simple échéance.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de la consigne; « car » convient au registre narratif biblique tout en restant courant.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: le troisième jour
  rationale: En français, le complément temporel s’emploie naturellement sans préposition dans cette tournure.
- source_word: יֵרֵד
  choice: descendra
  rationale: Le verbe ירד indique un mouvement vers le bas. « Descendra » conserve directement l’image théophanique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, sans lui substituer un titre.
- source_word: לְעֵינֵי
  choice: sous les yeux de
  rationale: Cette expression française naturelle conserve l’image concrète des « yeux » et indique que la manifestation sera visible de tous.
- source_word: כָל הָעָם
  choice: tout le peuple
  rationale: Cette formulation idiomatique désigne l’ensemble du peuple rassemblé.
- source_word: עַל הַר סִינָי
  choice: sur le mont Sinaï
  rationale: Avec le verbe « descendre », עַל désigne le mont comme lieu de la manifestation.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; employer « Yahweh » préserve le nom personnel plutôt que de le remplacer par un titre.
- issue: Visibilité de la descente divine
  choice: sous les yeux de tout le peuple
  alternative: devant tout le peuple
  rationale: La formulation retenue conserve l’image hébraïque et affirme la visibilité publique de la manifestation sans préciser davantage sa modalité.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu sans être artificielle; « sous les yeux de » préserve la vigueur concrète de לְעֵינֵי.
