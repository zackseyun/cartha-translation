  text: וַ/יַּעֲנ֨וּ כָל הָ/עָ֤ם יַחְדָּו֙ וַ/יֹּ֣אמְר֔וּ כֹּ֛ל אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶׂ֑ה וַ/יָּ֧שֶׁב מֹשֶׁ֛ה אֶת דִּבְרֵ֥י הָ/עָ֖ם אֶל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/008.yaml
  text: And all the people answered together and said[a], “All that Yahweh has spoken we will do.” Then Moses brought back the words of the people to Yahweh.
translation:
  language: fr
  text: 'Tout le peuple répondit d’une seule voix : « Nous ferons tout ce que Yahweh a dit. » Puis Moïse rapporta[a] à Yahweh les paroles du peuple.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : ramena à Yahweh les paroles du peuple.'
    reason: Le hifil de שוב conserve l’image d’un retour tout en pouvant signifier ici « rapporter » ou « transmettre en retour ».
lexical_decisions:
- source_word: וַיַּעֲנוּ כָל־הָעָם יַחְדָּו
  choice: Tout le peuple répondit d’une seule voix
  rationale: « Répondit » restitue le sens dialogique de ענה. « D’une seule voix » exprime naturellement en français la réponse collective et unanime marquée par יַחְדָּו.
- source_word: כֹּל אֲשֶׁר דִּבֶּר
  choice: tout ce que … a dit
  rationale: Cette formulation française courante conserve la totalité exprimée par כֹּל אֲשֶׁר et situe naturellement la parole antérieure dans son rapport avec l’engagement présent.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, sans lui substituer un titre.
- source_word: נַעֲשֶׂה
  choice: Nous ferons
  rationale: Le verbe עשה signifie ici « faire, accomplir ». Cette traduction reste plus proche du texte que « nous obéirons », bien que l’obéissance soit impliquée par le contexte.
- source_word: וַיָּשֶׁב
  choice: rapporta
  rationale: Le hifil de שוב peut désigner ici l’action de ramener ou de transmettre en retour les paroles du peuple. « Rapporta » est clair et naturel dans ce contexte de médiation.
- source_word: דִּבְרֵי הָעָם
  choice: les paroles du peuple
  rationale: Cette traduction conserve le nom concret דְּבָרִים, plutôt que de l’interpréter simplement comme « la réponse ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le caractère personnel du nom divin révélé à Israël.
- issue: Portée de נַעֲשֶׂה
  choice: Nous ferons
  alternative: Nous obéirons
  rationale: Le contexte est celui de l’engagement d’Israël, mais le verbe dit littéralement « faire ». La traduction retenue évite d’expliciter davantage que l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. « D’une seule voix » rend idiomatiquement l’unité de la réponse sans alourdir la phrase. Le discours direct est introduit par deux-points, conformément à l’usage français naturel.
