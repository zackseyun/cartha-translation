source:
  edition: WLC
  text: וְ/עַתָּ֗ה אִם שָׁמ֤וֹעַ תִּשְׁמְעוּ֙ בְּ/קֹלִ֔/י וּ/שְׁמַרְתֶּ֖ם אֶת בְּרִיתִ֑/י וִ/הְיִ֨יתֶם לִ֤/י סְגֻלָּה֙ מִ/כָּל הָ֣/עַמִּ֔ים כִּי לִ֖/י כָּל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/005.yaml
  text: And now[a], if you will indeed listen to my voice and keep my covenant, then you will be my treasured possession out of all the peoples[c][b], for all the earth is mine.
translation:
  language: fr
  text: Et maintenant, si vous écoutez vraiment ma voix[a] et si vous gardez mon alliance, vous serez pour moi un bien précieux parmi tous les peuples[b], car toute la terre m’appartient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « si vous obéissez vraiment à ma voix ». L’hébreu dit littéralement « si écouter vous écoutez », tournure emphatique qui évoque une écoute attentive et obéissante.
    reason: lexical_alternative
  - marker: b
    text: Ou « ma propriété particulière d’entre tous les peuples ». Le verset distingue Israël parmi les peuples tout en affirmant ensuite que toute la terre appartient à Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois le lien avec le contexte précédent et la valeur temporelle de l’expression hébraïque.
- source_word: שָׁמֹעַ תִּשְׁמְעוּ בְּקֹלִי
  choice: si vous écoutez vraiment ma voix
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’idée d’écoute. « vraiment » rend cette insistance, tandis que « écouter ma voix » préserve l’image concrète et la portée d’une écoute obéissante.
- source_word: וּשְׁמַרְתֶּם אֶת־בְּרִיתִי
  choice: et si vous gardez mon alliance
  rationale: Dans ce contexte, שׁמר désigne l’observation fidèle de l’alliance. La répétition de « si » rend la coordination conditionnelle claire en français.
- source_word: וִהְיִיתֶם לִי סְגֻלָּה
  choice: vous serez pour moi un bien précieux
  rationale: סְגֻלָּה désigne une propriété particulière et estimée. « un bien précieux » exprime à la fois l’appartenance et la valeur, sans réduire le terme à un sentiment affectif.
- source_word: מִכָּל הָעַמִּים
  choice: parmi tous les peuples
  rationale: Le מִן marque ici la sélection au sein d’un ensemble. « parmi » exprime naturellement en français la distinction d’Israël au milieu des peuples sans suggérer que les autres cessent d’appartenir à Dieu.
- source_word: כִּי לִי כָּל־הָאָרֶץ
  choice: car toute la terre m’appartient
  rationale: כִּי introduit le fondement de l’affirmation précédente. La tournure française explicite naturellement la possession exprimée par לִי et donne à הָאָרֶץ sa portée universelle.
theological_decisions:
- issue: Rendre שׁמע par l’écoute ou par l’obéissance
  choice: écoutez vraiment ma voix
  alternative: obéissez-moi fidèlement
  rationale: L’expression hébraïque implique une écoute qui conduit à l’obéissance, mais elle met formellement l’écoute au premier plan. Le texte principal conserve cette image, tandis que la note signale sa portée obéissante.
- issue: Exprimer le statut de סְגֻלָּה sans exagérer l’exclusivité
  choice: un bien précieux parmi tous les peuples
  alternative: mon trésor particulier au-dessus de tous les peuples
  rationale: La traduction retenue affirme l’appartenance particulière et la valeur d’Israël tout en préservant la tension avec la proposition suivante, selon laquelle toute la terre appartient à Dieu.
translation_notes:
  register: Français international moderne, naturel et digne. Le vouvoiement pluriel correspond au peuple d’Israël. La formulation conserve les images concrètes de la voix, de l’alliance et de la possession, avec des notes brèves pour l’emphase hébraïque et la nuance de סְגֻלָּה.
