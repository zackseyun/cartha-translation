  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל יְהוָ֔ה לֹא יוּכַ֣ל הָ/עָ֔ם לַ/עֲלֹ֖ת אֶל הַ֣ר סִינָ֑י כִּֽי אַתָּ֞ה הַעֵדֹ֤תָה בָּ֨/נוּ֙ לֵ/אמֹ֔ר הַגְבֵּ֥ל אֶת הָ/הָ֖ר וְ/קִדַּשְׁתּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/023.yaml
  text: And Moses said to Yahweh[a], “The people cannot go up to Mount Sinai, because you yourself warned us, saying[b], ‘Set bounds around the mountain and consecrate it.’”
translation:
  language: fr
  text: 'Moïse dit à Yahweh : « Le peuple ne peut pas monter sur le mont Sinaï, puisque c’est toi-même qui nous as avertis[a] en disant : “Fixe des limites autour de la montagne et consacre-la[b].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous as adressé une mise en garde solennelle » ou « nous as solennellement sommés ». Le verbe hébreu peut désigner un avertissement formel ou un témoignage solennel.
    reason: lexical_alternative
  - marker: b
    text: Ou « Délimite la montagne et sanctifie-la ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération « Yahweh », afin de conserver le nom personnel divin plutôt que de lui substituer un titre.
- source_word: לֹא יוּכַל
  choice: ne peut pas
  rationale: L’imparfait de יכל exprime ici l’incapacité dans la situation présente; « ne peut pas » est naturel en français et ne réduit pas l’énoncé à une simple interdiction.
- source_word: לַעֲלֹת אֶל הַר סִינָי
  choice: monter sur le mont Sinaï
  rationale: « Monter » conserve le mouvement ascendant de עלה, tandis que « sur le mont Sinaï » exprime naturellement la destination visée dans ce contexte.
- source_word: כִּי
  choice: puisque
  rationale: La conjonction introduit la raison invoquée par Moïse; « puisque » convient particulièrement à une raison déjà connue de l’interlocuteur.
- source_word: אַתָּה
  choice: c’est toi-même qui
  rationale: Le pronom explicite est emphatique en hébreu; cette tournure française en restitue naturellement l’insistance.
- source_word: הַעֵדֹתָה בָּנוּ
  choice: tu nous as avertis
  rationale: Dans ce contexte, le hiphil de עוד désigne un avertissement ou une injonction solennelle. La traduction principale reste claire, tandis qu’une note conserve les autres nuances possibles.
- source_word: הַגְבֵּל אֶת הָהָר
  choice: Fixe des limites autour de la montagne
  rationale: Le hiphil impératif de גבל demande d’établir une limite. Le pluriel « des limites » et « autour de » rendent clairement l’idée de démarcation sans surcharger la phrase.
- source_word: וְקִדַּשְׁתּוֹ
  choice: et consacre-la
  rationale: Le piel de קדשׁ signifie ici mettre la montagne à part comme sainte; « consacrer » préserve cette portée cultuelle en français courant et digne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: Le texte porte directement le nom divin. « Yahweh » le conserve comme nom propre sans le remplacer par un titre.
- issue: Nature de la déclaration divine antérieure
  choice: avertissement
  alternative: sommation solennelle; témoignage adressé contre ou à quelqu’un
  rationale: Le contexte des limites imposées au peuple favorise « avertir », mais le verbe hébreu possède une portée formelle plus large; cette tension lexicale est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe directe conserve le dialogue et l’insistance du pronom hébreu. « Consacre-la » maintient la dimension sacrée sans recourir à une formulation inutilement archaïque.
