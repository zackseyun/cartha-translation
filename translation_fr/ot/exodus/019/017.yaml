  text: וַ/יּוֹצֵ֨א מֹשֶׁ֧ה אֶת הָ/עָ֛ם לִ/קְרַ֥את הָֽ/אֱלֹהִ֖ים מִן הַֽ/מַּחֲנֶ֑ה וַ/יִּֽתְיַצְּב֖וּ בְּ/תַחְתִּ֥ית הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/017.yaml
  text: Then Moses brought the people out of the camp to meet God[a], and they took their stand at the foot of the mountain.
translation:
  language: fr
  text: Alors Moïse fit sortir le peuple du camp à la rencontre de Dieu, et ils se tinrent au pied de la montagne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la base de la montagne ». L’expression hébraïque désigne la partie inférieure de la montagne.
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: fit sortir
  rationale: 'Le hifil de יצא a un sens causatif : Moïse fait sortir le peuple. « Fit sortir » restitue directement cette valeur sans ajouter l’idée de conduite contenue dans « mena ».'
- source_word: לִקְרַאת
  choice: à la rencontre de
  rationale: Cette expression indique un déplacement en vue d’une rencontre. « À la rencontre de » est idiomatique en français et conserve le caractère solennel de la scène.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Malgré l’article hébreu, le référent est ici le Dieu d’Israël. En français, « Dieu » est la formulation naturelle et exacte.
- source_word: מִן הַמַּחֲנֶה
  choice: du camp
  rationale: Avec « fit sortir », « du camp » exprime naturellement le point de départ sans redondance.
- source_word: וַיִּתְיַצְּבוּ
  choice: ils prirent position
  rationale: Le hitpael de יצב évoque le fait de se placer délibérément ou de prendre position. Cette traduction garde cette nuance mieux que le simple « ils se tinrent ».
- source_word: בְּתַחְתִּית הָהָר
  choice: au pied de la montagne
  rationale: Dans ce contexte, l’expression désigne la partie basse ou la base de la montagne. « Au pied de la montagne » est la formulation française la plus naturelle, sans suggérer que le peuple se trouvait littéralement sous elle.
theological_decisions:
- issue: Désignation de Dieu dans la théophanie du Sinaï
  choice: Dieu
  alternative: le Dieu
  rationale: « Dieu » suit l’usage naturel du français pour désigner le Dieu d’Israël. Cette formulation n’ajoute aucune précision doctrinale étrangère au texte.
- issue: Position du peuple par rapport à la montagne
  choice: au pied de la montagne
  alternative: sous la montagne
  rationale: Le contexte spatial favorise la partie inférieure ou la base de la montagne. La traduction évite de trancher le récit selon une interprétation théologique ou légendaire faisant de la montagne une masse suspendue au-dessus du peuple.
translation_notes:
  register: Français international moderne, clair et digne. La structure narrative est conservée, avec « Alors » pour marquer la progression du récit. Le marqueur de note est placé après l’expression qu’il explique.
