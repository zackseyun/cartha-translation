source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רֵ֖ד הָעֵ֣ד בָּ/עָ֑ם פֶּן יֶהֶרְס֤וּ אֶל יְהוָה֙ לִ/רְא֔וֹת וְ/נָפַ֥ל מִמֶּ֖/נּוּ רָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/021.yaml
  text: And Yahweh said to Moses[a], “Go down; warn the people, lest they break through to Yahweh to look[b], and many of them fall.”
translation:
  language: fr
  text: 'Yahweh dit à Moïse : « Descends et avertis le peuple, de peur qu’ils ne forcent le passage jusqu’à Yahweh pour voir[a] et que beaucoup d’entre eux ne tombent[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour regarder ». Le verbe hébreu peut désigner aussi bien le fait de voir que celui de regarder ; il s’agit ici de chercher à voir la manifestation de Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « et qu’un grand nombre parmi eux tombe ». Dans ce contexte, « tomber » peut impliquer la mort, sans que l’hébreu l’énonce plus explicitement.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin personnel plutôt que de lui substituer un titre.
- source_word: רֵד
  choice: Descends
  rationale: L’impératif de ירד exprime un déplacement vers le bas; « Descends » est direct et naturel dans le contexte de la montagne.
- source_word: הָעֵד
  choice: avertis
  rationale: À la forme hifil, עוד désigne ici un avertissement ferme adressé au peuple. « Avertis » restitue clairement cette fonction sans alourdir la phrase.
- source_word: בָּעָם
  choice: le peuple
  rationale: עם désigne collectivement Israël; « le peuple » est la formulation française naturelle dans ce contexte.
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Cette tournure française exprime naturellement le risque que l’ordre cherche à prévenir, tout en conservant la valeur négative de פֶּן.
- source_word: יֶהֶרְסוּ
  choice: forcent le passage
  rationale: Le verbe הרס évoque ici le franchissement violent ou irrégulier de la limite établie autour de la montagne. « Forcent le passage » rend ce mouvement sans ajouter explicitement une limite absente de la proposition.
- source_word: אֶל יְהוָה
  choice: vers Yahweh
  rationale: La préposition אֶל marque ici un mouvement en direction de la présence divine; « vers Yahweh » en conserve la valeur spatiale.
- source_word: לִרְאוֹת
  choice: pour voir
  rationale: L’infinitif exprime le but. « Voir » conserve l’ambiguïté du verbe ראה entre le fait de voir et celui de chercher à regarder la manifestation divine.
- source_word: וְנָפַל
  choice: et que… ne tombent
  rationale: Le sens premier de נפל, « tomber », est conservé. Le contexte peut laisser entendre la mort, mais le texte hébreu ne l’énonce pas explicitement.
- source_word: מִמֶּנּוּ רָב
  choice: beaucoup d’entre eux
  rationale: La formulation rend idiomatiquement l’idée d’un grand nombre pris parmi le peuple.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte emploie directement le tétragramme. La translittération « Yahweh » préserve le nom propre et évite de le remplacer par un titre.
- issue: Conséquence exprimée par וְנָפַל
  choice: tombent
  alternative: meurent; périssent
  rationale: Dans ce contexte de jugement, « tomber » peut impliquer la mort, mais traduire explicitement par « mourir » lèverait une réserve maintenue par l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. Le passage du collectif singulier « le peuple » au pronom pluriel « ils » suit l’accord selon le sens et reflète le pluriel hébreu. La tournure « de peur que… ne » est soutenue mais courante dans un avertissement solennel; le « ne » est explétif et n’ajoute pas une seconde négation.
