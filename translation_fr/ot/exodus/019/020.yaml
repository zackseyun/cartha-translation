  text: וַ/יֵּ֧רֶד יְהוָ֛ה עַל הַ֥ר סִינַ֖י אֶל רֹ֣אשׁ הָ/הָ֑ר וַ/יִּקְרָ֨א יְהוָ֧ה לְ/מֹשֶׁ֛ה אֶל רֹ֥אשׁ הָ/הָ֖ר וַ/יַּ֥עַל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/020.yaml
  text: And Yahweh came down on Mount Sinai[a], to the top of the mountain. Then Yahweh called Moses to the top of the mountain[b], and Moses went up.
translation:
  language: fr
  text: Yahweh descendit sur le mont Sinaï, au sommet de la montagne. Puis Yahweh appela Moïse au sommet de la montagne, et Moïse monta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: descendit
  rationale: Le verbe ירד exprime un mouvement vers le bas. « Descendit » est naturel dans ce récit et maintient le contraste avec « monta » à la fin du verset.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, conformément à la forme hébraïque du texte source.
- source_word: הַר סִינַי
  choice: le mont Sinaï
  rationale: C'est la désignation française courante et idiomatique de ce lieu.
- source_word: אֶל רֹאשׁ הָהָר
  choice: au sommet de la montagne
  rationale: רֹאשׁ signifie littéralement « tête », mais désigne ici, de façon spatiale, le sommet de la montagne.
- source_word: וַיִּקְרָא
  choice: appela
  rationale: קרא signifie ici appeler quelqu'un; « appela » reste direct sans renforcer le sens en « convoqua ».
- source_word: לְמֹשֶׁה
  choice: Moïse
  rationale: Forme française conventionnelle du nom propre.
- source_word: וַיַּעַל
  choice: monta
  rationale: עלה exprime le mouvement vers le haut; « monta » est concis et répond naturellement à « descendit ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: L'hébreu emploie explicitement le Tétragramme. La transcription « Yahweh » préserve le nom personnel sans lui substituer un titre.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « au sommet de la montagne » est conservée, car elle reflète l'insistance et la structure de l'hébreu.
