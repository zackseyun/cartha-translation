id: EXO.19.18
reference: Exodus 19:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הַ֤ר סִינַי֙ עָשַׁ֣ן כֻּלּ֔/וֹ מִ֠/פְּנֵי אֲשֶׁ֨ר יָרַ֥ד עָלָ֛י/ו יְהוָ֖ה בָּ/אֵ֑שׁ וַ/יַּ֤עַל עֲשָׁנ/וֹ֙ כְּ/עֶ֣שֶׁן הַ/כִּבְשָׁ֔ן וַ/יֶּחֱרַ֥ד כָּל הָ/הָ֖ר מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/018.yaml
  text: Mount Sinai was all in smoke because Yahweh had descended on it in fire[a], and its smoke went up like the smoke of a furnace, and the whole mountain trembled greatly.
translation:
  language: fr
  text: Le mont Sinaï était entièrement couvert de fumée, parce que Yahweh y était descendu dans le feu. Sa fumée montait comme la fumée d’une fournaise[a], et toute la montagne tremblait violemment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme la fumée d’un four ».'
    reason: כִּבְשָׁן peut désigner une fournaise ou un four, notamment un four servant à la cuisson.
lexical_decisions:
- source_word: וְהַר סִינַי
  choice: Le mont Sinaï
  rationale: Le syntagme désigne directement le mont Sinaï. Le וְ narratif n’exige pas ici l’ajout artificiel de « et » ou de « alors » en français.
- source_word: עָשַׁן כֻּלּוֹ
  choice: était entièrement couvert de fumée
  rationale: Cette formulation naturelle exprime que toute la montagne fumait ou se trouvait enveloppée de fumée, sans réduire כֻּלּוֹ à une partie du mont.
- source_word: מִפְּנֵי אֲשֶׁר
  choice: parce que
  rationale: La locution introduit explicitement la cause de la fumée.
- source_word: יָרַד עָלָיו יְהוָה
  choice: Yahweh y était descendu
  rationale: 'Le plus-que-parfait convient à la relation causale : la descente précède l’état décrit. « y » reprend naturellement le mont Sinaï.'
- source_word: בָּאֵשׁ
  choice: dans le feu
  rationale: La préposition בְּ présente ici le feu comme le mode ou la manifestation accompagnant la descente.
- source_word: וַיַּעַל עֲשָׁנוֹ
  choice: Sa fumée montait
  rationale: Le suffixe masculin renvoie naturellement au mont, et le verbe עלה décrit le mouvement ascendant de la fumée.
- source_word: כְּעֶשֶׁן הַכִּבְשָׁן
  choice: comme la fumée d’une fournaise
  rationale: כִּבְשָׁן peut désigner une fournaise ou un four. « Fournaise » restitue naturellement l’image d’une fumée intense, tandis que l’autre possibilité est signalée en note.
- source_word: וַיֶּחֱרַד כָּל הָהָר מְאֹד
  choice: et toute la montagne tremblait violemment
  rationale: חרד décrit ici un puissant tremblement physique, et מְאֹד en marque la forte intensité. « Violemment » est plus idiomatique que « grandement » en français moderne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte hébreu emploie le tétragramme, nom propre divin. « Yahweh » le conserve comme nom plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, clair et digne. La phrase a été divisée en deux pour éviter une accumulation pesante, tout en conservant les rapports de cause et de coordination. Le marqueur de note est placé après « fournaise », terme auquel porte réellement la variante lexicale.
