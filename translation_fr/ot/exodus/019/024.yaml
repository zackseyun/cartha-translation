  text: וַ/יֹּ֨אמֶר אֵלָ֤י/ו יְהוָה֙ לֶךְ רֵ֔ד וְ/עָלִ֥יתָ אַתָּ֖ה וְ/אַהֲרֹ֣ן עִמָּ֑/ךְ וְ/הַ/כֹּהֲנִ֣ים וְ/הָ/עָ֗ם אַל יֶֽהֶרְס֛וּ לַ/עֲלֹ֥ת אֶל יְהוָ֖ה פֶּן יִפְרָץ בָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/024.yaml
  text: And Yahweh said to him[a], “Go down, and come up—you and Aaron with you. But the priests and the people must not break through to come up to Yahweh, lest he break out against them.”
translation:
  language: fr
  text: 'Yahweh lui dit : « Va, descends, puis remonte, toi, avec Aaron. Mais que les prêtres et le peuple ne forcent pas le passage pour monter vers Yahweh, de peur qu’il ne fasse irruption parmi eux[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ne fassent irruption pour monter vers Yahweh, de peur qu’il ne fasse irruption parmi eux ». L’hébreu emploie deux verbes distincts dont les images se font écho : le peuple franchirait de force la limite, et Yahweh interviendrait soudainement parmi lui.'
    reason: Préserver l’écho imagé entre l’intrusion interdite du peuple et l’intervention divine, sans présenter les deux racines hébraïques comme apparentées.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: לֶךְ רֵד
  choice: Va, descends
  rationale: Les deux impératifs sont conservés dans une formulation française naturelle qui exprime l’ordre immédiat de quitter le sommet et de redescendre.
- source_word: וְעָלִיתָ
  choice: puis remonte
  rationale: Dans cette suite d’ordres, la forme verbale a une valeur injonctive; « remonte » rend clairement le retour ultérieur sur la montagne.
- source_word: אַתָּה וְאַהֲרֹן עִמָּךְ
  choice: toi, avec Aaron
  rationale: Le pronom tonique « toi » garde l’insistance de l’hébreu, tandis que « avec Aaron » exprime l’accompagnement sans lourdeur excessive.
- source_word: הַכֹּהֲנִים וְהָעָם
  choice: les prêtres et le peuple
  rationale: Ces termes usuels maintiennent la distinction entre le groupe sacerdotal et l’ensemble du peuple.
- source_word: אַל יֶהֶרְסוּ
  choice: ne forcent pas le passage
  rationale: Cette expression rend l’idée de rompre ou franchir de force la limite établie autour de la montagne.
- source_word: לַעֲלֹת אֶל יְהוָה
  choice: pour monter vers Yahweh
  rationale: La traduction conserve à la fois le mouvement ascendant et l’approche interdite de la présence divine.
- source_word: פֶּן יִפְרָץ בָּם
  choice: de peur qu’il ne se déchaîne contre eux
  rationale: La formule exprime la soudaineté menaçante de l’intervention divine; une note signale l’image plus littérale de l’irruption et son écho avec la percée du peuple.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: La translittération préserve le nom propre du texte hébreu sans le remplacer par un titre, tout en suivant la convention du projet.
- issue: Agent de la menace exprimée par יִפְרָץ
  choice: le pronom « il » renvoie à Yahweh
  alternative: répéter explicitement « Yahweh »
  rationale: Le sujet demeure naturellement Yahweh dans le contexte immédiat; le pronom conserve la concision et l’ambiguïté grammaticale limitée de l’hébreu sans ajouter d’explication au corps du verset.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct conserve la vigueur des ordres. La légère insistance de « toi » reflète l’hébreu, tandis que la note maintient le jeu d’images sans imposer une tournure obscure dans le texte principal.
