  to: 'Yahweh lui dit : « Va, descends, puis remonte, toi, avec Aaron. Mais que les prêtres et le peuple ne forcent pas le passage pour monter vers Yahweh, de peur qu’il ne fasse irruption parmi eux[a]. »'
  rationale: La révision remplace une formulation émotionnellement interprétative par « fasse irruption parmi eux », qui conserve l’image de פָּרַץ et reste naturelle en français. La note est corrigée afin de décrire exactement le rapport lexical entre les deux verbes hébreux.
