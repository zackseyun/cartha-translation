review_pass:
  verdict: revise
  source_fidelity: Le mouvement double (« Va, descends », puis remonter) et la restriction visant les prêtres et le peuple sont bien rendus. « Se déchaîne » interprète toutefois פָּרַץ comme une colère explosive et atténue l’image concrète d’une irruption/brèche ; « fasse irruption parmi eux » est plus proche du verbe et de la préposition בָּם.
  naturalness: Le français est globalement clair et moderne. « Va, descends » conserve volontairement les deux impératifs hébreux. « Puis » peut être omis sans perte, tandis que « toi, avec Aaron » garde une insistance acceptable en français.
  terminology: '« Yahweh », « les prêtres » et « le peuple » sont cohérents avec le texte source et la politique du projet. La note doit éviter de présenter les deux verbes hébreux comme apparentés : ils relèvent de racines distinctes, même si leurs images de franchissement et d’irruption se font écho.'
  issues:
  - severity: medium
    issue: « Il ne se déchaîne contre eux » est plus interprétatif que le texte hébreu.
    rationale: פֶּן־יִפְרָץ בָּם évoque une irruption ou une percée soudaine de Yahweh parmi/contre eux. « Se déchaîner » introduit particulièrement l’idée d’emportement ou de fureur.
  - severity: medium
    issue: La note dit que l’hébreu emploie « deux verbes apparentés ».
    rationale: הרס et פרץ ne sont pas des verbes apparentés sur le plan lexical. Le lien est imagé et contextuel, non étymologique.
