  text: וְ/גַ֧ם הַ/כֹּהֲנִ֛ים הַ/נִּגָּשִׁ֥ים אֶל יְהוָ֖ה יִתְקַדָּ֑שׁוּ פֶּן יִפְרֹ֥ץ בָּ/הֶ֖ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/022.yaml
  text: And even the priests who come near to Yahweh must consecrate themselves[b][a], lest Yahweh break out against them.
translation:
  language: fr
  text: Même les prêtres qui s’approchent de Yahweh doivent se consacrer[a], de peur que Yahweh ne fasse irruption parmi eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « doivent se sanctifier » ou « doivent se rendre saints ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ne fasse irruption contre eux » ou « ne se déchaîne contre eux ». L’hébreu évoque le surgissement soudain du jugement de Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Même
  rationale: 'Exprime ici l’ajout emphatique : les prêtres eux aussi sont concernés par l’avertissement.'
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent français courant et précis dans ce contexte cultuel ; l’article défini est conservé.
- source_word: הַנִּגָּשִׁים אֶל יְהוָה
  choice: qui s’approchent de Yahweh
  rationale: Le participe de נגשׁ désigne ceux qui s’avancent vers la présence divine, notamment pour le service cultuel. « S’approchent » demeure naturel tout en préservant ce sens.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent explicitement dans le texte hébreu, aux deux occurrences.
- source_word: יִתְקַדָּשׁוּ
  choice: doivent se consacrer
  rationale: 'Le hitpael a une valeur réflexive : les prêtres doivent se mettre à part comme saints. « Se consacrer » restitue clairement la portée cultuelle.'
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Tour français idiomatique exprimant l’avertissement et la conséquence redoutée.
- source_word: יִפְרֹץ בָּהֶם
  choice: se déchaîne contre eux
  rationale: Préserve l’image vive d’une irruption soudaine et hostile du jugement divin ; le contexte et la préposition בְּ soutiennent « contre eux ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte emploie directement le tétragramme ; « Yahweh » préserve le nom d’alliance sans le remplacer par un titre.
- issue: Nature de l’avertissement יִפְרֹץ בָּהֶם יְהוָה
  choice: une irruption soudaine du jugement de Yahweh contre les prêtres
  alternative: Yahweh ferait simplement irruption vers eux
  rationale: Dans le contexte des limites imposées au Sinaï, le verbe et la construction signalent une conséquence dangereuse et hostile, sans préciser le mode du châtiment.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le vocabulaire cultuel de l’approche et de la consécration, ainsi que l’image saisissante d’une irruption divine. Les deux occurrences de Yahweh sont maintenues.
