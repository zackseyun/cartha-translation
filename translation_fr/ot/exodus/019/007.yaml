base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/007.yaml
  text: So Moses came and called for the elders of the people[b][a], and set before them all these words that Yahweh had commanded him.
translation:
  language: fr
  text: Moïse vint, convoqua les anciens du peuple et leur exposa toutes ces paroles, comme Yahweh le lui avait ordonné.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: vint
  rationale: Le verbe בוא peut signifier « venir » ou « aller » selon le point de vue. Ici, « vint » présente naturellement le retour de Moïse auprès du peuple.
- source_word: וַיִּקְרָא לְזִקְנֵי הָעָם
  choice: convoqua les anciens du peuple
  rationale: קרא avec ל peut exprimer l’appel adressé à quelqu’un ou sa convocation. Dans ce contexte de rassemblement des représentants du peuple, « convoqua » est naturel et précis.
- source_word: זִקְנֵי הָעָם
  choice: les anciens du peuple
  rationale: זִקְנֵי désigne les représentants reconnus parmi les hommes âgés; « anciens » conserve cette fonction sociale et politique sans la réduire à celle de simples dirigeants.
- source_word: וַיָּשֶׂם לִפְנֵיהֶם
  choice: leur exposa
  rationale: L’expression signifie littéralement « plaça devant eux ». Avec des paroles comme complément, « leur exposa » restitue naturellement en français l’idée de les présenter à leur attention.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: toutes ces paroles
  rationale: דְּבָרִים peut désigner des paroles, des choses ou des affaires. Le contexte immédiat est celui du message divin que Moïse doit transmettre; « paroles » convient donc le mieux tout en gardant la dimension verbale.
- source_word: אֲשֶׁר צִוָּהוּ יְהוָה
  choice: que Yahweh lui avait ordonnées
  rationale: Le plus-que-parfait marque naturellement en français que l’ordre avait précédé sa transmission. L’accord de « ordonnées » rattache les paroles à ce que Yahweh avait chargé Moïse de communiquer.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » représente directement le nom divin exprimé par le tétragramme et suit la convention du projet.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » préserve le nom d’alliance sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination narrative est conservée avec « donc »; « convoqua » et « exposa » donnent une phrase naturelle sans ajouter d’interprétation confessionnelle.
