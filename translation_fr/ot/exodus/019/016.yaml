  text: וַ/יְהִי֩ בַ/יּ֨וֹם הַ/שְּׁלִישִׁ֜י בִּֽ/הְיֹ֣ת הַ/בֹּ֗קֶר וַ/יְהִי֩ קֹלֹ֨ת וּ/בְרָקִ֜ים וְ/עָנָ֤ן כָּבֵד֙ עַל הָ/הָ֔ר וְ/קֹ֥ל שֹׁפָ֖ר חָזָ֣ק מְאֹ֑ד וַ/יֶּחֱרַ֥ד כָּל הָ/עָ֖ם אֲשֶׁ֥ר בַּֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/016.yaml
  text: And it happened on the third day[a], when morning came, that there were thunders and lightnings, and a heavy cloud on the mountain, and the sound of a trumpet, very loud[c][b]; and all the people who were in the camp trembled.
translation:
  language: fr
  text: Le troisième jour, au matin, il y eut des coups de tonnerre[a] et des éclairs, un épais nuage sur la montagne, et un son de shofar[b] très puissant[c]. Tout le peuple qui était dans le camp se mit à trembler.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des voix » ou « des sons ». Le mot hébreu possède ces sens, mais, associé ici aux éclairs, il désigne très probablement le tonnerre.
    reason: lexical_alternative
  - marker: b
    text: Le shofar est une corne animale utilisée comme instrument à vent; il est traditionnellement fait d’une corne de bélier.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « très fort »; dans ce contexte, l’expression décrit l’intensité du son.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי בִּהְיֹת הַבֹּקֶר
  choice: Le troisième jour, au matin, il y eut
  rationale: Cette tournure française naturelle rend l’introduction narrative et les deux indications temporelles sans reproduire lourdement les répétitions de וַיְהִי.
- source_word: קֹלֹת
  choice: des coups de tonnerre
  rationale: Le nom peut désigner des voix ou des sons, mais son association avec les éclairs indique très probablement ici le tonnerre; « coups » restitue le pluriel.
- source_word: וּבְרָקִים
  choice: et des éclairs
  rationale: Équivalent français courant du pluriel hébreu.
- source_word: עָנָן כָּבֵד עַל הָהָר
  choice: Un épais nuage couvrait la montagne
  rationale: כָּבֵד signifie littéralement « lourd », mais appliqué à un nuage, « épais » exprime naturellement sa densité. « Couvrait » rend ici la relation spatiale עַל sans suggérer nécessairement un contact précis.
- source_word: קֹל שֹׁפָר
  choice: le son du shofar
  rationale: Le terme français « shofar » conserve la nature particulière de l’instrument ancien et évite de l’assimiler sans nuance à une trompette moderne; une note l’explique.
- source_word: חָזָק מְאֹד
  choice: retentit avec une très grande force
  rationale: Cette formulation applique naturellement au son l’intensité exprimée littéralement par « très fort », tout en conservant la notion de force plutôt que de la réduire au seul volume sonore.
- source_word: וַיֶּחֱרַד
  choice: se mit à trembler
  rationale: Le verbe exprime un tremblement provoqué par l’effroi ou l’agitation; cette traduction garde ensemble sa dimension physique et émotionnelle.
- source_word: כָּל הָעָם אֲשֶׁר בַּמַּחֲנֶה
  choice: Tout le peuple qui était dans le camp
  rationale: La relative hébraïque est conservée explicitement dans un français naturel.
theological_decisions:
- issue: Imagerie de la manifestation divine au Sinaï
  choice: Décrire les phénomènes sensoriels sans ajouter d’interprétation théologique ultérieure.
  alternative: Traduire קֹלֹת par « voix » et laisser entendre des voix célestes.
  rationale: Dans son association immédiate avec les éclairs, « coups de tonnerre » est le sens contextuel le plus probable. La note conserve toutefois l’ambiguïté lexicale réelle du mot hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe évite l’archaïsme « il arriva que » tout en gardant la progression solennelle du récit. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
