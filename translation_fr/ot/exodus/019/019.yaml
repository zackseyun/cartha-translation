  text: And the sound of the trumpet kept growing stronger and stronger[a]; Moses would speak[b], and God would answer him with a voice.
translation:
  language: fr
  text: Le son de la trompette devenait de plus en plus fort[a]. Moïse parlait, et Dieu lui répondait d’une voix[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « gagnait sans cesse en force ». L’hébreu décrit littéralement le son de la trompette comme « allant et devenant très fort ».
    reason: lexical_alternative
  - marker: b
    text: Ou « lui répondait dans le tonnerre » ou « lui répondait de manière audible ». L’hébreu dit « d’une voix » ou « par un son ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: devenait
  rationale: La forme narrative introduit le développement de la scène et se combine naturellement avec l’idée de progression exprimée par הוֹלֵךְ.
- source_word: קוֹל הַשּׁוֹפָר
  choice: Le son de la trompe
  rationale: קוֹל désigne ici le son produit par le שׁוֹפָר. « Trompe » rend naturellement en français l’instrument à vent fait d’une corne, sans préciser plus que le texte.
- source_word: הוֹלֵךְ וְחָזֵק מְאֹד
  choice: devenait de plus en plus puissant
  rationale: La construction décrit une intensification continue. « Puissant » conserve l’image hébraïque de force, tandis que « de plus en plus » exprime la progression.
- source_word: מֹשֶׁה יְדַבֵּר
  choice: Moïse parlait
  rationale: L’imparfait français peut présenter l’action en cours ou répétée dans cette scène, sans imposer une occurrence unique.
- source_word: יַעֲנֶנּוּ
  choice: lui répondait
  rationale: L’imparfait maintient le parallélisme aspectuel avec « parlait » et laisse ouverte une action continue ou répétée.
- source_word: בְּקוֹל
  choice: par une voix
  rationale: Cette formulation préserve le sens direct et la largeur sémantique de קוֹל, sans préciser qu’il s’agissait du tonnerre. La préposition « par » exprime le moyen de la réponse.
theological_decisions:
- issue: Nature de la réponse de Dieu au Sinaï
  choice: Dieu lui répondait « par une voix »
  alternative: Dieu lui répondait dans le tonnerre, ou de manière audible
  rationale: בְּקוֹל désigne littéralement une réponse par une voix ou un son, mais ne nomme pas explicitement le tonnerre. Le texte principal conserve donc cette indétermination, et la note signale les interprétations possibles.
translation_notes:
  register: Français international moderne, naturel et digne. Les imparfaits rendent l’aspect continu ou répété des deux verbes en parallèle. « Trompe » évoque plus directement un instrument fait d’une corne que « trompette », tout en restant clair en contexte biblique.
