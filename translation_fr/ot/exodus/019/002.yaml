  text: וַ/יִּסְע֣וּ מֵ/רְפִידִ֗ים וַ/יָּבֹ֨אוּ֙ מִדְבַּ֣ר סִינַ֔י וַֽ/יַּחֲנ֖וּ בַּ/מִּדְבָּ֑ר וַ/יִּֽחַן שָׁ֥ם יִשְׂרָאֵ֖ל נֶ֥גֶד הָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/002.yaml
  text: They set out from Rephidim and came to the wilderness of Sinai[a], and they camped in the wilderness. There Israel camped before the mountain.
translation:
  language: fr
  text: Ils partirent de Refidim et arrivèrent au désert du Sinaï. Ils campèrent dans le désert. Là, Israël campa en face de la montagne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant la montagne ». La préposition hébraïque peut désigner une position face à quelque chose ou devant quelque chose.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: Dans les récits de déplacement, נסע désigne couramment le fait de lever le camp et de se mettre en route. « Partirent » exprime naturellement ce mouvement en français moderne.
- source_word: מֵרְפִידִים
  choice: de Refidim
  rationale: Le nom de lieu est translittéré selon l’usage français, et le préfixe מ־ est rendu par « de ».
- source_word: וַיָּבֹאוּ
  choice: et arrivèrent
  rationale: בוא peut signifier venir, entrer ou arriver. Avec une destination explicite, « arrivèrent » rend clairement l’aboutissement du trajet.
- source_word: מִדְבַּר סִינַי
  choice: au désert du Sinaï
  rationale: מִדְבָּר désigne une région aride et peu habitée. « Désert » est ici naturel en français et la construction « du Sinaï » restitue le rapport entre les deux noms.
- source_word: וַיַּחֲנוּ בַּמִּדְבָּר
  choice: où ils établirent leur camp
  rationale: חנה signifie camper. La formulation avec « où » évite en français une répétition pesante de « désert » tout en conservant explicitement le lieu du campement.
- source_word: וַיִּחַן שָׁם יִשְׂרָאֵל
  choice: Là, Israël campa
  rationale: Le singulier hébreu présente Israël comme une collectivité unifiée. Le singulier est conservé en français, et « Là » maintient la mise en relief du lieu.
- source_word: נֶגֶד הָהָר
  choice: en face de la montagne
  rationale: נֶגֶד exprime une position devant ou vis-à-vis de quelque chose. « En face de » rend naturellement cette relation spatiale sans préciser davantage l’orientation.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La répétition hébraïque de « désert » est allégée par une proposition relative, tandis que la reprise de l’action de camper et le passage du pluriel au singulier collectif pour Israël sont préservés. Le marqueur de note est placé après l’expression concernée, נֶגֶד הָהָר.
