base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/001.yaml
  text: In the third month after the sons of Israel had gone out from the land of Egypt[b][a], on this very day they came to the wilderness of Sinai.
translation:
  language: fr
  text: Au cours du troisième mois après la sortie des fils d’Israël[a] du pays d’Égypte, ce jour même[b], ils arrivèrent dans le désert du Sinaï.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites » ou « les enfants d’Israël ». L’hébreu dit littéralement « les fils d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Ou « en ce jour ». L’expression peut souligner le jour exact de leur arrivée.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי
  choice: Le troisième mois
  rationale: Dans cette indication chronologique, חֹדֶשׁ désigne naturellement le « mois ». La formulation française est claire et conserve l’ordinal hébreu.
- source_word: לְצֵאת
  choice: après la sortie de
  rationale: L’infinitif construit précédé de לְ fixe le départ d’Égypte comme repère temporel. « Après la sortie de » rend ce rapport avec naturel sans préciser un jour que le texte ne donne pas ici.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette expression traduit de manière transparente la désignation collective hébraïque, tout en laissant en note l’équivalent français courant « les Israélites ».
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: du pays d’Égypte
  rationale: Le mot אֶרֶץ est explicitement présent. « Pays d’Égypte » restitue l’expression complète dans un français naturel.
- source_word: בַּיּוֹם הַזֶּה
  choice: en ce jour même
  rationale: Le démonstratif « ce » est explicite, et « même » fait ressortir l’insistance possible de la tournure sans la transformer en date précise.
- source_word: בָּאוּ
  choice: ils arrivèrent
  rationale: Dans ce contexte de déplacement vers une destination, « arrivèrent » est l’équivalent français idiomatique de בוא et évite la tournure moins naturelle « vinrent dans le désert ».
- source_word: מִדְבַּר סִינָי
  choice: le désert du Sinaï
  rationale: מִדְבָּר désigne ici une région inculte ou désertique. « Désert du Sinaï » est la formulation française usuelle et conserve la relation entre les deux noms.
theological_decisions:
- issue: Désignation collective בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites ; les enfants d’Israël
  rationale: Le syntagme hébreu signifie littéralement « fils d’Israël » et sert de désignation conventionnelle au peuple. Le conserver maintient la transparence envers la source sans lui imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit écrit. La syntaxe reste proche de l’indication chronologique hébraïque tout en étant naturelle en français.
