    reason: Alternative lexicale et clarification du collectif masculin hébreu.
  revision_rationale: La révision améliore l’idiomaticité française et rend plus directement le parallélisme des deux verbes hébreux, sans modifier le sens, le registre, le nom divin ni l’ancrage de la note.
