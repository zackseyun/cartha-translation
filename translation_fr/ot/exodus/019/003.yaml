source:
  edition: WLC
  text: וּ/מֹשֶׁ֥ה עָלָ֖ה אֶל הָ/אֱלֹהִ֑ים וַ/יִּקְרָ֨א אֵלָ֤י/ו יְהוָה֙ מִן הָ/הָ֣ר לֵ/אמֹ֔ר כֹּ֤ה תֹאמַר֙ לְ/בֵ֣ית יַעֲקֹ֔ב וְ/תַגֵּ֖יד לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/003.yaml
  text: And Moses went up to God[a], and Yahweh called to him from the mountain, saying, “Thus you shall say to the house of Jacob, and tell the sons of Israel:”
translation:
  language: fr
  text: 'Moïse monta vers Dieu, et Yahweh l’appela depuis la montagne en disant : « Voici ce que tu diras à la maison de Jacob et ce que tu déclareras aux fils d’Israël[a] : »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux enfants d’Israël » ou « au peuple d’Israël ». L’hébreu dit littéralement « aux fils d’Israël », une expression collective masculine.
    reason: Alternative lexicale et clarification du collectif masculin hébreu.
lexical_decisions:
- source_word: עָלָה
  choice: monta
  rationale: Le verbe exprime un déplacement vers le haut. « Monta » est naturel en français et conserve pleinement le sens spatial.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Malgré l’article hébreu, « Dieu » est ici l’équivalent idiomatique en français, le référent étant le Dieu d’Israël.
- source_word: וַיִּקְרָא אֵלָיו
  choice: l’appela
  rationale: La construction avec אֶל décrit un appel adressé à Moïse. « L’appela » est idiomatique en français sans effacer le fait que la voix s’adresse à lui.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte, plutôt que de lui substituer un titre.
- source_word: מִן הָהָר
  choice: depuis la montagne
  rationale: הַר désigne ici la montagne du Sinaï. « Depuis » indique clairement le lieu d’où vient l’appel.
- source_word: לֵאמֹר
  choice: en disant
  rationale: L’infinitif introduit le discours direct; cette tournure conserve explicitement la formule hébraïque.
- source_word: כֹּה תֹאמַר
  choice: Ainsi tu parleras
  rationale: Cette formulation garde le caractère solennel de la formule messagère tout en restant naturelle en français.
- source_word: לְבֵית יַעֲקֹב
  choice: à la maison de Jacob
  rationale: La traduction littérale préserve le sens collectif et l’expression d’alliance.
- source_word: וְתַגֵּיד
  choice: et tu l’annonceras
  rationale: Le hiphil de נגד signifie faire connaître ou annoncer. Le pronom « l’ » renvoie naturellement au message qui suit et évite une coordination française maladroite.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: Cette traduction conserve la forme masculine collective de l’hébreu ainsi que le parallélisme avec « la maison de Jacob »; une note signale les équivalents collectifs possibles.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom propre divin au lieu de le remplacer par un titre.
- issue: Collectif masculin לִבְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les enfants d’Israël ; le peuple d’Israël
  rationale: « Fils » reflète formellement l’hébreu et son parallélisme, tandis que la note précise que l’expression désigne collectivement le peuple d’Israël.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme et la solennité de la formule divine sans archaïsmes. Le marqueur [a] est placé après l’expression qu’il explique.
