  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הִנֵּ֨ה אָנֹכִ֜י בָּ֣א אֵלֶי/ךָ֮ בְּ/עַ֣ב הֶֽ/עָנָן֒ בַּ/עֲב֞וּר יִשְׁמַ֤ע הָ/עָם֙ בְּ/דַבְּרִ֣/י עִמָּ֔/ךְ וְ/גַם בְּ/ךָ֖ יַאֲמִ֣ינוּ לְ/עוֹלָ֑ם וַ/יַּגֵּ֥ד מֹשֶׁ֛ה אֶת דִּבְרֵ֥י הָ/עָ֖ם אֶל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/009.yaml
  text: And Yahweh said to Moses[a], “Behold, I am coming to you in a thick cloud, so that the people may hear when I speak with you, and may also believe in you forever.” Then Moses told Yahweh the words of the people.
translation:
  language: fr
  text: 'Yahweh dit à Moïse : « Voici que je viens vers toi dans une épaisse nuée, afin que le peuple m’entende parler avec toi et qu’il croie aussi en toi pour toujours[a]. » Puis Moïse rapporta à Yahweh les paroles du peuple.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « qu’il ait aussi confiance en toi » ou « qu’il te croie aussi ». L’hébreu peut exprimer la confiance accordée à Moïse comme porte-parole accrédité de Dieu.'
    reason: alternative lexicale et préservation de l’ambiguïté
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: הִנֵּה אָנֹכִי בָּא אֵלֶיךָ
  choice: Voici que je viens vers toi
  rationale: « Voici que » conserve la force présentative solennelle de הִנֵּה, tandis que le présent rend l’action imminente exprimée par le participe בָּא.
- source_word: בְּעַב הֶעָנָן
  choice: dans une épaisse nuée
  rationale: Expression française naturelle qui restitue l’image d’une nuée dense sans alourdir la phrase par un calque.
- source_word: בַּעֲבוּר
  choice: afin que
  rationale: Introduit clairement le but de la venue de Yahweh dans la nuée.
- source_word: יִשְׁמַע הָעָם בְּדַבְּרִי עִמָּךְ
  choice: que le peuple m’entende parler avec toi
  rationale: Rend la construction temporelle de l’infinitif et conserve le sens relationnel de עִם, « avec ».
- source_word: וְגַם בְּךָ יַאֲמִינוּ
  choice: et qu’il croie aussi en toi
  rationale: La construction de אמן avec ב exprime la confiance accordée à une personne. « Croire en toi » maintient la formulation forte et l’ambiguïté réelle du texte, tandis que la note en précise la portée possible.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Rend simplement et directement l’idée d’une durée permanente.
- source_word: וַיַּגֵּד
  choice: Puis Moïse rapporta
  rationale: « Puis » marque la progression narrative, et « rapporta » convient à la transmission fidèle de paroles.
- source_word: דִּבְרֵי הָעָם
  choice: les paroles du peuple
  rationale: Conserve le terme concret « paroles » tout en restant idiomatique en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte hébreu emploie le tétragramme comme nom propre; sa transcription préserve cette donnée sans remplacer le nom par un titre.
- issue: Portée de בְּךָ יַאֲמִינוּ à propos de Moïse
  choice: qu’il croie aussi en toi
  alternative: qu’il ait aussi confiance en toi / qu’il te croie aussi
  rationale: La construction peut désigner la confiance mise en Moïse comme porte-parole accrédité de Dieu. La traduction retenue conserve la force et la tension de l’hébreu, sans les réduire silencieusement à la seule crédibilité de ses propos.
translation_notes:
  register: Français international moderne, clair et digne. « Nuée » conserve le registre biblique et l’image théophanique tout en restant intelligible; la syntaxe demeure fluide et accessible.
