  text: לֹא תִגַּ֨ע בּ֜/וֹ יָ֗ד כִּֽי סָק֤וֹל יִסָּקֵל֙ אוֹ יָרֹ֣ה יִיָּרֶ֔ה אִם בְּהֵמָ֥ה אִם אִ֖ישׁ לֹ֣א יִחְיֶ֑ה בִּ/מְשֹׁךְ֙ הַ/יֹּבֵ֔ל הֵ֖מָּה יַעֲל֥וּ בָ/הָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/013.yaml
  text: No hand shall touch him[a], for he must surely be stoned or surely shot; whether beast or man, he shall not live. When the ram’s horn sounds a long blast[c][b], they may go up on the mountain.
translation:
  language: fr
  text: 'Aucune main ne le touchera[a] : il devra être lapidé ou abattu à coups de flèches[b]. Qu’il s’agisse d’une bête ou d’un homme, il ne restera pas en vie. Quand la corne de bélier retentira longuement[c], ils pourront monter sur la montagne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom hébreu est masculin singulier. Il renvoie vraisemblablement au contrevenant; il peut aussi être compris plus largement comme désignant ce qui a franchi la limite ou est devenu interdit. Le contrevenant ne doit pas être touché directement, mais mis à mort à distance.
    reason: alternative_reading
  - marker: b
    text: 'Ou : « atteint par des flèches ». Le verbe hébreu désigne l’action de tirer; dans ce contexte, il s’agit vraisemblablement de flèches.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « quand le yobel sera tiré/prolongé ». Le yobel désigne vraisemblablement une corne de bélier; l’expression évoque un son prolongé.'
    reason: cultural_note
lexical_decisions:
- source_word: תִגַּע בּוֹ יָד
  choice: Aucune main ne le touchera
  rationale: Cette formulation conserve le tour juridique impersonnel de l’hébreu et rapporte naturellement le suffixe masculin singulier au contrevenant, qui ne doit pas être touché directement.
- source_word: סָקוֹל יִסָּקֵל
  choice: il devra être lapidé
  rationale: L’infinitif absolu suivi du verbe conjugué renforce le caractère certain et obligatoire de la peine; « devra » exprime cette nécessité en français naturel.
- source_word: יָרֹה יִיָּרֶה
  choice: transpercé de traits
  rationale: Dans ce contexte d’exécution à distance, ירה évoque vraisemblablement des projectiles, notamment des flèches. « Transpercé de traits » garde la notion de perforation sans réduire indûment le terme à une arme moderne.
- source_word: אִם בְּהֵמָה אִם אִישׁ
  choice: Que ce soit une bête ou un homme
  rationale: La tournure rend clairement l’alternative distributive et conserve le singulier concret de l’hébreu.
- source_word: לֹא יִחְיֶה
  choice: il ne restera pas en vie
  rationale: Cette expression restitue la force judiciaire du résultat exigé tout en s’appliquant naturellement à la bête comme à l’homme.
- source_word: בִּמְשֹׁךְ הַיֹּבֵל
  choice: Quand la corne de bélier fera entendre un son prolongé
  rationale: יוֹבֵל désigne ici vraisemblablement la corne de bélier ou son signal, et משׁך indique que le son est prolongé.
- source_word: הֵמָּה יַעֲלוּ בָהָר
  choice: ils pourront monter sur la montagne
  rationale: Dans le contexte, le signal lève l’interdiction précédente; le futur hébreu a donc naturellement une valeur permissive.
theological_decisions:
- issue: Référent du suffixe masculin singulier dans בּוֹ
  choice: Le contrevenant qui a franchi la limite
  alternative: Ce qui est devenu interdit par contact, ou éventuellement la montagne
  rationale: La suite décrit la mise à mort d’une bête ou d’un homme ayant franchi la limite. Le référent personnel explique aussi pourquoi l’exécution doit se faire sans contact direct, mais l’ambiguïté grammaticale est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le style juridique demeure ferme et concis. « Traits » est employé au sens de projectiles, surtout de flèches; la note explicite ce terme. Les marqueurs de notes suivent l’ordre de leur apparition dans le texte.
