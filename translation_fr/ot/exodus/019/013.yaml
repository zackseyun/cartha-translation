revisions:
- from: 'Aucune main ne le touchera[a] : il devra être lapidé ou transpercé de traits[b]. Que ce soit une bête ou un homme, il ne restera pas en vie. Quand la corne de bélier fera entendre un son prolongé[c], ils pourront monter sur la montagne.'
  to: 'Aucune main ne le touchera[a] : il devra être lapidé ou abattu à coups de flèches[b]. Qu’il s’agisse d’une bête ou d’un homme, il ne restera pas en vie. Quand la corne de bélier retentira longuement[c], ils pourront monter sur la montagne.'
  rationale: La révision retire l’ajout interprétatif « transpercé », emploie un équivalent moderne et contextuellement explicite pour le tir à distance, et clarifie les notes sans trancher au-delà de ce que permet l’ambiguïté du suffixe hébreu. Elle conserve la force juridique, les catégories « bête » et « homme », ainsi que la valeur permissive de la dernière proposition.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:13:17Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : interdiction de toucher directement le contrevenant, mise à mort par lapidation ou tir, application à l’animal comme à l’homme, puis permission de monter après un signal prolongé. Toutefois, « transpercé de traits » ajoute l’idée de perforation (non explicite dans יָרָה) et emploie un terme moins naturel ici. Le verbe est plus directement rendu par « abattu à coups de flèches » / « atteint par des flèches »; dans ce contexte, « abattu à coups de flèches » exprime la mise à mort sans contact direct. La note a doit également mieux présenter l’alternative : « celui-ci » ne constitue pas une véritable alternative au texte principal « le » ; l’alternative porte sur le référent, potentiellement non personnel.'
  naturalness: Le français est globalement naturel et de registre approprié. « Aucune main ne le touchera » est idiomatique. « Que ce soit une bête ou un homme » est compréhensible, mais « Qu’il s’agisse d’une bête ou d’un homme » est plus fluide dans cette formulation juridique. « La corne de bélier fera entendre un son prolongé » est correct, mais « retentira longuement » est plus concis et naturel tout en gardant la notion de prolongation.
  terminology: « Lapidé » est exact. « Bête » est acceptable pour בְּהֵמָה dans un registre biblique moderne. « Corne de bélier » rend bien יוֹבֵל dans ce contexte. Le terme « yobel » dans la note est utile, mais la note doit expliquer que l’hébreu parle littéralement du fait de « prolonger le yobel », plutôt que laisser entendre qu’une corne elle-même serait prolongée.
  issues:
  - severity: medium
    issue: « transpercé de traits » est une traduction trop interprétative et stylistiquement datée de יָרֹה יִיָּרֶה.
    rationale: La racine ירה désigne l’action de tirer/lancer; le contexte suggère des flèches, mais n’énonce pas explicitement le résultat « transpercé ». « Traits » est en outre moins transparent pour un lectorat international moderne.
  - severity: low
    issue: La note a formule mal l’alternative de référent.
    rationale: « Celui-ci » est seulement une reformulation démonstrative de « le ». Il convient de signaler que le suffixe peut être entendu plus largement comme renvoyant à ce qui a franchi la limite ou est devenu interdit, sans attribuer au texte une alternative textuelle inexistante.
  - severity: low
    issue: La note c peut être formulée avec plus de précision grammaticale.
    rationale: Le participe/infinitif hébreu se rapporte à l’action de tirer/prolonger le signal du yobel; « quand le yobel sera prolongé » est littéral mais peu naturel et potentiellement opaque en français.
