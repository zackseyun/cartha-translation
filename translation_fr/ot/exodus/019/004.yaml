  text: אַתֶּ֣ם רְאִיתֶ֔ם אֲשֶׁ֥ר עָשִׂ֖יתִי לְ/מִצְרָ֑יִם וָ/אֶשָּׂ֤א אֶתְ/כֶם֙ עַל כַּנְפֵ֣י נְשָׁרִ֔ים וָ/אָבִ֥א אֶתְ/כֶ֖ם אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/004.yaml
  text: You yourselves have seen what I did to Egypt[c][b][a], and how I carried you on eagles’ wings and brought you to myself.
translation:
  language: fr
  text: Vous avez vu vous-mêmes ce que j’ai fait à l’Égypte, et comment je vous ai portés sur des ailes d’aigles[a][b] et vous ai amenés à moi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sur les ailes d’aigles ». L’expression hébraïque évoque de manière saisissante une délivrance puissante et protectrice.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « aigles » peut désigner plus largement de grands oiseaux de proie.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « je vous ai conduits auprès de moi ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַתֶּם רְאִיתֶם
  choice: Vous avez vu vous-mêmes
  rationale: Le pronom indépendant אַתֶּם renforce le sujet déjà indiqué par la forme verbale; « vous-mêmes » conserve cette insistance en français naturel.
- source_word: אֲשֶׁר עָשִׂיתִי לְמִצְרָיִם
  choice: ce que j’ai fait à l’Égypte
  rationale: La préposition ל marque ici l’entité touchée par l’action. « L’Égypte » conserve la portée collective et nationale du texte hébreu.
- source_word: וָאֶשָּׂא אֶתְכֶם
  choice: je vous ai portés
  rationale: נשא exprime l’action de porter; ce choix s’accorde naturellement avec l’image protectrice des ailes.
- source_word: עַל כַּנְפֵי נְשָׁרִים
  choice: sur des ailes d’aigles
  rationale: Cette formulation restitue l’image hébraïque avec naturel. נְשָׁרִים désigne vraisemblablement ici des aigles, tout en pouvant avoir un sens plus large.
- source_word: וָאָבִא אֶתְכֶם אֵלָי
  choice: et vous ai amenés jusqu’à moi
  rationale: אֵלָי signifie littéralement « vers moi » ou « jusqu’à moi ». La formulation française exprime le mouvement vers Dieu sans expliciter davantage sa portée relationnelle.
theological_decisions:
- issue: Portée relationnelle de la délivrance
  choice: vous ai amenés jusqu’à moi
  alternative: vous ai amenés à moi / vous ai conduits auprès de moi
  rationale: La traduction préserve l’idée que la sortie d’Égypte aboutit à Dieu lui-même, tout en laissant au contexte le soin d’en déployer la portée d’alliance.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé composé convient au rappel d’événements accomplis encore déterminants pour les destinataires. L’ordre « Vous avez vu vous-mêmes » garde une emphase audible sans archaïsme.
