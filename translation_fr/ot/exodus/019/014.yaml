  text: וַ/יֵּ֧רֶד מֹשֶׁ֛ה מִן הָ/הָ֖ר אֶל הָ/עָ֑ם וַ/יְקַדֵּשׁ֙ אֶת הָ/עָ֔ם וַֽ/יְכַבְּס֖וּ שִׂמְלֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/014.yaml
  text: So Moses went down from the mountain to the people[a], and he consecrated the people, and they washed their garments.
translation:
  language: fr
  text: Moïse descendit de la montagne vers le peuple et consacra le peuple[a] ; ils lavèrent leurs vêtements.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « sanctifia le peuple » ou « mit le peuple à part ».

      '
    reason: Alternative lexicale pour קדשׁ, dont le sens associe sainteté, consécration et mise à part.
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: descendit
  rationale: Le verbe ירד exprime un mouvement vers le bas. « Descendit » est naturel en français narratif et convient au déplacement depuis la montagne.
- source_word: מִן הָהָר
  choice: de la montagne
  rationale: Dans le contexte immédiat, הַר désigne la montagne du Sinaï ; « montagne » est précis et courant.
- source_word: אֶל הָעָם
  choice: vers le peuple
  rationale: עָם signifie normalement « peuple ». La préposition אֶל indique ici le mouvement de Moïse en direction du peuple.
- source_word: וַיְקַדֵּשׁ
  choice: consacra
  rationale: Au piel, קדשׁ désigne ici la préparation rituelle et la mise à part du peuple en vue de la rencontre avec Dieu. « Consacra » conserve cette portée cultuelle sans suggérer uniquement une transformation morale.
- source_word: הָעָם
  choice: le peuple
  rationale: La répétition du nom dans l'hébreu est maintenue pour la clarté et la fidélité à la structure du verset.
- source_word: וַיְכַבְּסוּ
  choice: ils lavèrent
  rationale: כבס désigne spécifiquement le lavage d'étoffes ou de vêtements ; « lavèrent » est l'équivalent français le plus naturel dans ce contexte.
- source_word: שִׂמְלֹתָם
  choice: leurs vêtements
  rationale: שִׂמְלָה désigne des habits ou vêtements. « Vêtements » convient au registre digne du récit et au contexte de préparation rituelle.
theological_decisions:
- issue: Rendu du vocabulaire de sainteté rituelle avant la manifestation divine au Sinaï
  choice: consacra le peuple
  alternative: sanctifia le peuple ; mit le peuple à part
  rationale: Le passage décrit une préparation rituelle à la rencontre avec Dieu. « Consacra » exprime la mise à part dans ce cadre sans imposer une catégorie doctrinale ultérieure ni réduire l'action à une transformation morale.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit écrit. Le point-virgule et « puis » rendent clairement le changement de sujet entre Moïse, qui consacre, et le peuple, qui lave ses vêtements, tout en préservant l'enchaînement hébreu.
