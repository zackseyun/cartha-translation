source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ לֵ֣ךְ אֶל הָ/עָ֔ם וְ/קִדַּשְׁתָּ֥/ם הַ/יּ֖וֹם וּ/מָחָ֑ר וְ/כִבְּס֖וּ שִׂמְלֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/010.yaml
  text: Then Yahweh said to Moses[a], “Go to the people and consecrate them today and tomorrow, and let them wash their garments.”
translation:
  language: fr
  text: 'Alors Yahweh dit à Moïse : « Va vers le peuple et consacre[a]-les aujourd’hui et demain ; qu’ils lavent leurs vêtements. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sanctifie-les » ou « mets-les à part comme saints ».
    reason: Alternative lexicale pour קדשׁ, dont le sens inclut la consécration et la mise à part dans la sainteté.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin, qui préserve le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » rend naturellement cette succession en français.
- source_word: לֵךְ אֶל הָעָם
  choice: Va vers le peuple
  rationale: Rend directement l’impératif et conserve le nom collectif עָם.
- source_word: וְקִדַּשְׁתָּם
  choice: consacre ses membres
  rationale: Le piel de קדשׁ exprime ici la préparation sacrée du peuple à la rencontre divine. « Ses membres » explicite sobrement le passage du collectif singulier « peuple » au suffixe hébreu pluriel.
- source_word: הַיּוֹם וּמָחָר
  choice: aujourd’hui et demain
  rationale: Expression temporelle directe désignant les deux jours de préparation.
- source_word: וְכִבְּסוּ
  choice: qu’ils lavent
  rationale: Le subjonctif à valeur injonctive rend l’ordre adressé aux membres du peuple sans imposer une médiation plus explicite de Moïse.
- source_word: שִׂמְלֹתָם
  choice: leurs vêtements
  rationale: « Vêtements » convient au contexte solennel et couvre le sens général de שִׂמְלָה sans le limiter aux manteaux.
theological_decisions:
- issue: Portée rituelle de קדשׁ
  choice: consacre
  alternative: sanctifie ; mets à part comme saints
  rationale: « Consacre » maintient la dimension rituelle et relationnelle de la préparation au Sinaï, sans réduire le terme à une transformation morale intérieure.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le Seigneur
  rationale: Le texte porte le tétragramme comme nom propre ; « Yahweh » le préserve au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le nom collectif « peuple » tout en explicitant discrètement le référent pluriel des verbes hébreux par « ses membres ».
