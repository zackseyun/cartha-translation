  text: וַ/יֹּ֨אמֶר֙ אֶל הָ/עָ֔ם הֱי֥וּ נְכֹנִ֖ים לִ/שְׁלֹ֣שֶׁת יָמִ֑ים אַֽל תִּגְּשׁ֖וּ אֶל אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/015.yaml
  text: And he said to the people[a], “Be ready for three days; do not go near a woman.”
translation:
  language: fr
  text: 'Il dit au peuple : « Soyez prêts pendant trois jours. N’approchez pas d’une femme[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « n’approchez pas d’une femme ». Dans ce contexte, il s’agit d’une manière indirecte de demander aux hommes de s’abstenir de relations sexuelles pendant le temps de préparation.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le wayyiqtol de אמר poursuit le récit et introduit les paroles de Moïse. En français, « Il dit » rend naturellement cette progression sans imposer une nuance temporelle supplémentaire.
- source_word: אֶל הָעָם
  choice: au peuple
  rationale: עַם désigne ici collectivement les Israélites rassemblés. « Au peuple » est l’équivalent français courant et précis.
- source_word: הֱיוּ נְכֹנִים
  choice: Soyez prêts
  rationale: L’impératif de היה associé à נְכֹנִים appelle à se tenir prêt ou préparé. « Soyez prêts » est concis, naturel et adapté au contexte de préparation.
- source_word: לִשְׁלֹשֶׁת יָמִים
  choice: pendant trois jours
  rationale: Cette formulation conserve le sens temporel le plus direct de la construction hébraïque, qui présente trois jours comme période de préparation, sans la reformuler en « pour le troisième jour ».
- source_word: אַל תִּגְּשׁוּ
  choice: N’approchez pas
  rationale: אַל suivi de l’imparfait exprime une interdiction, et נגשׁ signifie s’approcher. « N’approchez pas » en reproduit sobrement la forme.
- source_word: אֶל אִשָּׁה
  choice: d’une femme
  rationale: L’hébreu dit littéralement « vers une femme ». « S’approcher d’une femme » garde l’euphémisme du texte source, tandis que la note en explicite le sens contextuel.
theological_decisions:
- issue: Faut-il expliciter dans le texte que l’interdiction concerne les relations sexuelles pendant la préparation ?
  choice: 'Conserver l’euphémisme hébreu dans le texte : « N’approchez pas d’une femme »'
  alternative: « N’ayez pas de relations sexuelles avec une femme » ou « N’approchez pas de vos femmes »
  rationale: Le texte emploie une expression euphémique plutôt qu’un verbe sexuel explicite. La conserver respecte sa formulation et sa retenue, tandis qu’une note permet au lecteur de comprendre le sens contextuel sans transformer l’implicite en explicite dans le corps du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct reste bref et solennel. L’euphémisme hébreu est maintenu dans le texte, avec une note explicative transparente.
