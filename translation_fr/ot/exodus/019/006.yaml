source:
  edition: WLC
  text: וְ/אַתֶּ֧ם תִּהְיוּ לִ֛/י מַמְלֶ֥כֶת כֹּהֲנִ֖ים וְ/ג֣וֹי קָד֑וֹשׁ אֵ֚לֶּה הַ/דְּבָרִ֔ים אֲשֶׁ֥ר תְּדַבֵּ֖ר אֶל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/006.yaml
  text: And you shall be to me a kingdom of priests and a holy nation[b][a]. These are the words that you shall speak to the sons of Israel.
translation:
  language: fr
  text: Vous serez pour moi un royaume de prêtres[a] et une nation sainte. Telles sont les paroles que tu diras aux fils d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un royaume sacerdotal ». L’expression hébraïque peut désigner un royaume composé de prêtres ou un royaume caractérisé par une vocation sacerdotale. Comparer 1 Pierre 2.9, qui emploie l’expression apparentée « un sacerdoce royal ».
    reason: lexical_alternative
  - marker: b
    text: « Les fils d’Israël » est l’expression hébraïque désignant ici l’ensemble du peuple d’Israël, et non uniquement les hommes.
    reason: cultural_note
lexical_decisions:
- source_word: תִּהְיוּ
  choice: vous serez
  rationale: L’imparfait qal exprime ici le résultat ou l’avenir dans la déclaration d’alliance. « Vous serez » garde en français une force solennelle sans transformer la formule en simple ordre.
- source_word: לִי
  choice: pour moi
  rationale: La préposition ל avec le suffixe de première personne exprime la relation ou l’appartenance. « Pour moi » est idiomatique en français et conserve l’orientation de l’alliance.
- source_word: מַמְלֶכֶת כֹּהֲנִים
  choice: un royaume de prêtres
  rationale: Cette traduction directe de la construction nominale maintient « royaume » et « prêtres », tout en laissant ouverte la nuance exacte de leur relation.
- source_word: גּוֹי קָדוֹשׁ
  choice: une nation sainte
  rationale: Rendu naturel et traditionnel qui conserve la portée d’alliance et la résonance théologique de קָדוֹשׁ.
- source_word: אֵלֶּה הַדְּבָרִים
  choice: Telles sont les paroles
  rationale: Dans ce contexte de discours, דְּבָרִים désigne des paroles. La tournure française garde le caractère formel de l’instruction.
- source_word: תְּדַבֵּר
  choice: tu diras
  rationale: Le piel imparfait masculin singulier s’adresse à Moïse. « Tu diras » rend naturellement la directive solennelle en français.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Le rendu conserve l’expression filiale et masculine de l’hébreu; une note précise que son référent collectif comprend tout le peuple.
theological_decisions:
- issue: Identité collective et vocation sacerdotale d’Israël
  choice: un royaume de prêtres
  alternative: un royaume sacerdotal
  rationale: Le choix reproduit au plus près la construction hébraïque et évite d’importer dans le texte principal la formulation de 1 Pierre 2.9. La note conserve l’ambiguïté entre un royaume composé de prêtres et un royaume au caractère sacerdotal.
- issue: Désignation genrée du peuple de l’alliance
  choice: les fils d’Israël
  alternative: les Israélites / le peuple d’Israël
  rationale: Le texte principal garde la forme filiale masculine de l’hébreu, tandis que la note clarifie son emploi collectif afin de ne pas laisser croire que seules les personnes de sexe masculin sont visées.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur simple porte la solennité de la déclaration d’alliance. Le tutoiement singulier dans « tu diras » reflète l’adresse faite à Moïse, tandis que « vous serez » s’adresse collectivement à Israël.
