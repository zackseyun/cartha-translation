  text: וַ/יַּ֤עַשׂ יְהוָה֙ כִּ/דְבַ֣ר מֹשֶׁ֔ה וַ/יָּ֨סַר֙ הֶ/עָרֹ֔ב מִ/פַּרְעֹ֖ה מֵ/עֲבָדָ֣י/ו וּ/מֵ/עַמּ֑/וֹ לֹ֥א נִשְׁאַ֖ר אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/027.yaml
  text: And Yahweh did according to Moses' word[a], and removed the swarm from Pharaoh, from his servants, and from his people; not one remained.
translation:
  language: fr
  text: 'Yahweh agit conformément à la parole de Moïse et retira la nuée[a] de chez le pharaon, de chez ses serviteurs et de chez son peuple : il n’en resta pas un seul.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu עָרֹב désigne un fléau de nuées ou d’essaims; le terme ne précise pas l’espèce ni la composition exacte. Il est traditionnellement compris comme une nuée d’insectes.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel exprimé dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: וַיַּעַשׂ יְהוָה כִּדְבַר מֹשֶׁה
  choice: Yahweh fit ce que Moïse avait demandé
  rationale: Dans ce contexte, דְבַר מֹשֶׁה désigne la demande formulée par Moïse. Cette tournure française naturelle conserve l’idée que Yahweh agit conformément à sa parole, sans le calque peu idiomatique « selon la parole de Moïse ».
- source_word: וַיָּסַר
  choice: éloigna
  rationale: Le hiphil de סור signifie ici faire partir ou retirer. « Éloigna » convient naturellement au retrait d’un fléau qui se trouvait sur les personnes désignées.
- source_word: הֶעָרֹב
  choice: les insectes
  rationale: עָרֹב désigne ici le fléau constitué d’êtres grouillants, généralement compris comme des insectes, sans en préciser l’espèce. Le pluriel collectif est naturel en français; une note conserve l’indétermination exacte du terme.
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: du pharaon, de ses serviteurs et de son peuple
  rationale: La préposition répétée מִן marque l’éloignement de chacune de ces trois sphères. Le français reprend la préposition selon les exigences grammaticales sans alourdir la phrase.
- source_word: לֹא נִשְׁאַר אֶחָד
  choice: il n’en resta pas un seul
  rationale: 'Cette formulation idiomatique préserve l’insistance du singulier אֶחָד : aucun membre de la nuée ne demeura.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le tétragramme, nom personnel du Dieu d’Israël. « Yahweh » le préserve au lieu de le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. « Le pharaon » suit l’usage français courant pour le titre. Le passé simple convient au registre narratif biblique sans archaïsme excessif; « ce que Moïse avait demandé » explicite naturellement la valeur contextuelle de « la parole de Moïse ».
