  text: וַ/יֵּצֵ֥א מֹשֶׁ֖ה מֵ/עִ֣ם פַּרְעֹ֑ה וַ/יֶּעְתַּ֖ר אֶל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/026.yaml
  text: So Moses went out from Pharaoh and pleaded with Yahweh[a].
translation:
  language: fr
  text: Moïse sortit de chez Pharaon et implora Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pria Yahweh avec insistance ». Le verbe hébreu exprime une supplication pressante.
    reason: Alternative lexicale explicitant la force du verbe עתר.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: quitta
  rationale: Le qal narratif de יצא décrit le départ physique de Moïse. « quitta » rend naturellement en français le fait qu’il sort de la présence de Pharaon.
- source_word: מֵעִם
  choice: Pharaon
  rationale: La préposition מֵעִם marque l’éloignement d’une personne ou de sa présence. La tournure idiomatique « quitta Pharaon » en exprime clairement le sens.
- source_word: פַּרְעֹה
  choice: Pharaon
  rationale: Forme française traditionnelle et courante du titre royal égyptien.
- source_word: וַיֶּעְתַּר
  choice: supplia
  rationale: Le verbe עתר exprime ici une prière insistante, une supplication pressante, et non une simple demande. « supplia » en conserve l’intensité dans un français naturel.
- source_word: אֶל
  choice: Yahweh
  rationale: אֶל indique la personne vers qui la supplication est dirigée. En français, le verbe « supplier » se construit directement avec la personne sollicitée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription du nom divin, plutôt que par un titre de substitution.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » préserve le caractère personnel du nom divin sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, naturel et digne. « quitta donc » assure la continuité narrative; « supplia » conserve la force de l’intercession sans alourdir la phrase.
