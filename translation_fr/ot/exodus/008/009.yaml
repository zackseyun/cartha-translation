  text: And the LORD did according to the word of Moses, and the frogs died out of the houses, out of the courtyards, and out of the fields.
translation:
  language: fr
  text: L’Éternel agit conformément à la parole de Moïse, et les grenouilles moururent dans les maisons, dans les cours et dans les champs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: L’Éternel
  rationale: Rend le tétragramme selon une convention française largement reconnue, tout en le distinguant du titre « Seigneur ».
- source_word: כִּדְבַר מֹשֶׁה
  choice: ce que Moïse avait demandé
  rationale: Dans le contexte immédiat, la « parole de Moïse » désigne la demande adressée à Dieu; cette formulation naturelle exprime ce sens sans ajouter de contenu.
- source_word: מִן הַבָּתִּים מִן הַחֲצֵרֹת וּמִן הַשָּׂדֹת
  choice: dans les maisons, dans les cours et dans les champs
  rationale: Avec le verbe « mourir », les מִן successifs indiquent les lieux où les grenouilles périrent; le français idiomatique emploie ici « dans » plutôt que « hors de ».
