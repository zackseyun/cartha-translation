source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵ֥ן הַֽ/חֲרְטֻמִּ֖ים בְּ/לָטֵי/הֶ֑ם וַ/יַּעֲל֥וּ אֶת הַֽ/צְפַרְדְּעִ֖ים עַל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/003.yaml
  text: And the magicians did the same by their secret arts[a], and they brought up the frogs over the land of Egypt.
translation:
  language: fr
  text: Les magiciens firent de même par leurs pratiques secrètes[a] et firent monter les grenouilles sur le pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par leurs enchantements » ou « par leurs arts occultes ».
    reason: Alternative lexicale pour בְּלָטֵיהֶם, dont le sens renvoie à des pratiques magiques secrètes ou ésotériques.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: firent de même
  rationale: 'Cette tournure française naturelle conserve la valeur comparative de l’expression hébraïque : ils accomplissent à leur tour l’acte qui vient d’être rapporté.'
- source_word: הַחֲרְטֻמִּים
  choice: les magiciens
  rationale: Dans le récit de l’Exode, le terme désigne les spécialistes de la cour de Pharaon qui reproduisent des signes au moyen de pratiques ésotériques. « Magiciens » est clair, courant et adapté au contexte.
- source_word: בְּלָטֵיהֶם
  choice: par leurs pratiques secrètes
  rationale: Le terme évoque des procédés magiques cachés ou ésotériques. Cette formulation exprime le moyen employé sans préciser abusivement la nature exacte de ces pratiques.
- source_word: וַיַּעֲלוּ
  choice: firent monter
  rationale: La forme causative du verbe עלה indique qu’ils causèrent la montée des grenouilles. « Firent monter » en préserve directement la valeur causative.
- source_word: אֶת הַצְפַרְדְּעִים
  choice: les grenouilles
  rationale: Le nom pluriel est défini en hébreu ; l’article défini français en rend naturellement la détermination.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: sur le pays d’Égypte
  rationale: « Sur » rend simplement עַל, tandis que « le pays d’Égypte » est une expression française naturelle correspondant à l’hébreu.
theological_decisions:
- issue: Nature de l’acte des magiciens
  choice: Rapporter sans réserve qu’ils firent monter les grenouilles
  alternative: Présenter leur action comme une simple apparence, une imitation trompeuse ou un tour
  rationale: Le récit hébreu attribue directement cette action aux magiciens sans expliquer son mécanisme ni la relativiser. La traduction conserve cette affirmation et son ambiguïté sans lui imposer d’explication naturaliste ou doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « firent » reflète sobrement les deux verbes hébreux, tandis que « firent monter » maintient la nuance causative.
