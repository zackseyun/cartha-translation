reference: Exodus 8:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א פַרְעֹ֔ה אֶל מֹשֶׁ֖ה וּֽ/לְ/אַהֲרֹ֑ן וַ/יֹּ֗אמֶר לְכ֛וּ זִבְח֥וּ לֵֽ/אלֹהֵי/כֶ֖ם בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/021.yaml
  text: Then Pharaoh called Moses and Aaron and said[a], “Go, sacrifice to your God in the land.”
translation:
  language: fr
  text: 'Alors le pharaon fit appeler Moïse et Aaron et leur dit : « Allez offrir des sacrifices à votre Dieu dans le pays.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire en Égypte.
    reason: La formulation hébraïque dit littéralement « dans le pays »; dans ce contexte, le pharaon autorise les sacrifices à condition qu’ils aient lieu en Égypte plutôt que dans le désert.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: fit appeler
  rationale: Dans ce contexte narratif, קרא signifie que le pharaon fait venir Moïse et Aaron. « Fit appeler » est naturel en français et rend mieux cette nuance que le simple « appela », sans donner à l’acte un caractère excessivement officiel.
- source_word: פַרְעֹה
  choice: le pharaon
  rationale: Le titre royal s’emploie naturellement avec l’article défini en français moderne.
- source_word: אֶל מֹשֶׁה וּלְאַהֲרֹן
  choice: Moïse et Aaron
  rationale: Les prépositions introduisent les personnes que le pharaon fait appeler. La construction française « faire appeler quelqu’un » exprime naturellement cette relation sans préposition.
- source_word: וַיֹּאמֶר
  choice: et leur dit
  rationale: « Dit » rend normalement אמר; l’ajout explicite de « leur » clarifie naturellement les destinataires déjà mentionnés.
- source_word: לְכוּ
  choice: Allez
  rationale: Impératif pluriel direct de הלך, qui exprime ici la permission ou l’ordre donné par le pharaon.
- source_word: זִבְחוּ
  choice: offrir des sacrifices
  rationale: Cette formulation française exprime clairement le sens cultuel de זבח et évite l’éventuelle ambiguïté moderne du verbe « sacrifier » employé sans complément.
- source_word: לֵאלֹהֵיכֶם
  choice: à votre Dieu
  rationale: La préposition ל marque ici le destinataire des sacrifices; « à votre Dieu » est l’expression française naturelle.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: La traduction conserve la formulation hébraïque, tandis que le contexte indique qu’il s’agit du pays d’Égypte. Une note explicite cette référence sans l’insérer dans le texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, courant et digne. Le passé simple maintient le registre narratif biblique sans archaïsme marqué. « Offrir des sacrifices » rend explicitement l’acte cultuel, et « dans le pays » préserve la formulation du texte source avec une clarification contextuelle en note.
