base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/018.yaml
  text: But on that day I will set apart the land of Goshen[a], where my people dwell, so that no swarm will be there[b], in order that you may know that I am Yahweh in the midst of the land.
translation:
  language: fr
  text: Mais, ce jour-là, je mettrai à part le pays de Goshen, où réside mon peuple, afin qu’aucun essaim[a] ne s’y trouve. Ainsi, tu sauras que moi, Yahweh, je suis au milieu du pays[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des essaims » ou « un essaim d’insectes ». Le terme hébreu ne précise pas avec certitude de quelles créatures il s’agit.
    reason: lexical_alternative
  - marker: b
    text: Ou « au milieu de la terre ». Dans ce contexte, il s’agit probablement du pays d’Égypte.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִפְלֵיתִי
  choice: je ferai une distinction en faveur de
  rationale: Le hiphil de פלא exprime ici l’action de distinguer ou de traiter séparément. La tournure française rend aussi la protection particulière accordée à Goshen sans transformer le verbe en terme cultuel.
- source_word: אֶרֶץ גֹּשֶׁן
  choice: le pays de Goshen
  rationale: אֶרֶץ désigne ici un territoire ou une région. « Le pays de Goshen » est une formulation française naturelle et traditionnelle.
- source_word: עַמִּי עֹמֵד עָלֶיהָ
  choice: où réside mon peuple
  rationale: Dans ce contexte territorial, עֹמֵד עַל indique que le peuple demeure ou est établi dans ce pays, plutôt qu’il ne s’y tient littéralement debout.
- source_word: לְבִלְתִּי הֱיוֹת שָׁם
  choice: aucun … ne s’y trouvera
  rationale: 'La construction infinitive exprime le résultat ou le but de la distinction : le fléau sera absent de Goshen.'
- source_word: עָרֹב
  choice: essaim
  rationale: L’identification zoologique du terme est incertaine. « Essaim » conserve cette indétermination tout en désignant naturellement une masse d’insectes dans ce contexte.
- source_word: לְמַעַן תֵּדַע
  choice: Ainsi, tu sauras
  rationale: La proposition exprime le but de l’acte divin et s’adresse à un interlocuteur masculin singulier. Cette formulation est naturelle tout en gardant la relation de finalité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit comme nom propre plutôt que remplacé par un titre.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: au milieu du pays
  rationale: בְּקֶרֶב conserve une valeur spatiale forte. Dans le récit, הָאָרֶץ renvoie probablement au pays d’Égypte, mais peut aussi avoir le sens plus large de « terre ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte directement le tétragramme. La transcription préserve le caractère personnel du nom sans lui substituer un titre.
- issue: Portée de בְּקֶרֶב הָאָרֶץ
  choice: au milieu du pays
  alternative: au milieu de la terre
  rationale: Le contexte immédiat favorise une référence au pays d’Égypte, mais le sens plus large reste possible et est signalé en note.
- issue: Identification de עָרֹב
  choice: essaim
  alternative: essaim d’insectes / essaim de mouches
  rationale: Le mot hébreu ne permet pas d’identifier avec certitude les créatures concernées. Le texte principal évite donc une précision zoologique injustifiée.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation met en relief le résultat de la distinction et la finalité de l’acte divin. Les deux marqueurs [a] et [b] figurent dans le texte principal.
