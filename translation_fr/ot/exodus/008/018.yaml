- from: 'Mais, ce jour-là, je ferai une distinction en faveur du pays de Goshen, où réside mon peuple : aucun essaim[a] ne s’y trouvera. Ainsi, tu sauras que moi, Yahweh, je suis au milieu du pays[b].'
  to: Mais, ce jour-là, je mettrai à part le pays de Goshen, où réside mon peuple, afin qu’aucun essaim[a] ne s’y trouve. Ainsi, tu sauras que moi, Yahweh, je suis au milieu du pays[b].
  rationale: La révision rétablit la valeur finale explicite de לְמַעַן au moyen de « afin que » et rend וְהִפְלֵיתִי de façon plus directe par « je mettrai à part ». Le reste du texte et les notes conservent l’ambiguïté lexicale et contextuelle de l’hébreu.
