  text: וַ/יִּקְרָ֨א פַרְעֹ֜ה לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֗ן וַ/יֹּ֨אמֶר֙ הַעְתִּ֣ירוּ אֶל יְהוָ֔ה וְ/יָסֵר֙ הַֽ/צְפַרְדְּעִ֔ים מִמֶּ֖/נִּי וּ/מֵֽ/עַמִּ֑/י וַ/אֲשַׁלְּחָה֙ אֶת הָ/עָ֔ם וְ/יִזְבְּח֖וּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/004.yaml
  text: Then Pharaoh called for Moses and Aaron and said[a], “Pray to Yahweh, that he may remove the frogs from me and from my people, and I will let the people go[b], so that they may sacrifice to Yahweh.”
translation:
  language: fr
  text: 'Alors le pharaon fit appeler Moïse et Aaron et leur dit : « Suppliez Yahvé[a] d’éloigner les grenouilles de moi et de mon peuple. Je laisserai partir le peuple[b], afin qu’ils offrent des sacrifices à Yahvé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi se traduire par « priez avec insistance » ou « intercédez auprès de Yahvé » ; il évoque une supplication pressante.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « et qu’ils offrent des sacrifices à Yahvé ». L’hébreu peut exprimer une simple coordination, même si le contexte suggère ici le but dans lequel le pharaon laissera partir le peuple.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא ... לְמֹשֶׁה וּלְאַהֲרֹן
  choice: fit appeler Moïse et Aaron
  rationale: Avec לְ devant les personnes, קרא indique ici que le pharaon les fait venir. « Fit appeler » est naturel en français et conserve l’idée de convocation.
- source_word: פַרְעֹה
  choice: le pharaon
  rationale: Rendu français courant du titre royal, avec l’article normalement employé en français.
- source_word: הַעְתִּירוּ
  choice: Suppliez
  rationale: Le hiphil de עתר désigne une prière instante ou une intercession. « Suppliez » restitue cette intensité sans vocabulaire technique.
- source_word: אֶל יְהוָה
  choice: Yahvé
  rationale: La préposition אֶל introduit le destinataire de la supplication. Le tétragramme est rendu par le nom propre traditionnel français « Yahvé ».
- source_word: וְיָסֵר
  choice: d’éloigner
  rationale: Le hiphil de סור signifie faire partir ou enlever. Après l’impératif de supplication, l’infinitif français exprime naturellement le contenu de la demande.
- source_word: הַצְפַרְדְּעִים
  choice: les grenouilles
  rationale: Traduction directe du nom pluriel déterminé.
- source_word: מִמֶּנִּי וּמֵעַמִּי
  choice: de moi et de mon peuple
  rationale: La répétition de la préposition מִן est reflétée par les deux compléments coordonnés et maintient la distinction entre le pharaon et son peuple.
- source_word: וַאֲשַׁלְּחָה אֶת־הָעָם
  choice: Je laisserai partir le peuple
  rationale: Le cohortatif exprime l’engagement déclaré du pharaon. Dans le récit de l’Exode, שלח désigne régulièrement le fait de laisser partir ou de libérer le peuple.
- source_word: וְיִזְבְּחוּ
  choice: afin qu’ils offrent des sacrifices
  rationale: Le verbe préfixé peut exprimer le but visé par la libération. « Offrir des sacrifices » rend clairement l’action cultuelle de זבח en français courant.
- source_word: לַיהוָה
  choice: à Yahvé
  rationale: La préposition לְ marque ici le destinataire des sacrifices, et le nom divin est rendu de façon cohérente par « Yahvé ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahvé » conserve sa fonction de nom propre et constitue sa forme traditionnelle en français moderne.
- issue: Valeur de וְיִזְבְּחוּ dans la dernière proposition
  choice: 'but : « afin qu’ils offrent des sacrifices »'
  alternative: 'coordination simple : « et qu’ils offrent des sacrifices »'
  rationale: Après l’engagement « je laisserai partir », la forme verbale peut naturellement indiquer le but de ce départ. La note conserve toutefois la possibilité d’une simple coordination.
translation_notes:
  register: Français international actuel, clair et digne. « Fit appeler » et « laisserai partir » maintiennent les formulations récurrentes du récit, tandis que « suppliez » préserve la force de la demande du pharaon. Les ambiguïtés syntaxiques réelles sont signalées sans être effacées.
