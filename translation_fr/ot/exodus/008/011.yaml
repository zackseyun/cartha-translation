source:
  edition: WLC
  text: וַ/יַּ֣רְא פַּרְעֹ֗ה כִּ֤י הָֽיְתָה֙ הָֽ/רְוָחָ֔ה וְ/הַכְבֵּד֙ אֶת לִבּ֔/וֹ וְ/לֹ֥א שָׁמַ֖ע אֲלֵ/הֶ֑ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/011.yaml
  text: But when Pharaoh saw that there was relief[a], he hardened his heart and did not listen to them, just as Yahweh had said.
translation:
  language: fr
  text: Mais quand le pharaon vit qu’il y avait du répit[a], il endurcit son cœur et ne les écouta pas, comme Yahweh l’avait dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du soulagement ». Le terme hébreu peut désigner un répit, un allègement ou un espace permettant de respirer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: vit
  rationale: Le verbe ראה signifie littéralement « voir » et, dans ce contexte, implique que le pharaon constate le changement de situation. « Vit » conserve l’image hébraïque tout en étant naturel en français.
- source_word: כִּי הָיְתָה הָרְוָחָה
  choice: qu’il y avait du répit
  rationale: הָרְוָחָה évoque un soulagement, un répit ou un espace permettant de respirer. « Du répit » convient naturellement à la cessation temporaire du fléau et conserve l’idée d’une accalmie.
- source_word: וְהַכְבֵּד אֶת לִבּוֹ
  choice: il endurcit son cœur
  rationale: Le hiphil de כבד signifie littéralement « rendre lourd ». Avec « cœur », il décrit ici l’obstination. « Endurcit son cœur » est une formulation française claire qui préserve l’image biblique récurrente.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: et ne les écouta pas
  rationale: שׁמע construit avec אֶל signifie écouter ou prêter attention à quelqu’un. Cette traduction n’ajoute pas l’idée plus précise d’obéissance.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: comme Yahweh l’avait dit
  rationale: La proposition renvoie à une parole divine antérieure. Le plus-que-parfait français exprime cette antériorité, tandis que le pronom « l’ » rend naturellement le contenu annoncé.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération « Yahweh », qui préserve le nom personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: L’agent de l’endurcissement du cœur du pharaon
  choice: Le pharaon est présenté ici comme endurcissant lui-même son cœur.
  alternative: Comprendre que son cœur devint dur, ou introduire dans ce verset une causalité divine implicite.
  rationale: La forme causative active hébraïque a le pharaon pour sujet. La traduction conserve donc l’attribution propre à ce verset sans effacer la tension avec d’autres passages de l’Exode où Dieu endurcit le cœur du pharaon.
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient au registre narratif biblique soutenu sans être archaïque. L’article « le pharaon » est idiomatique en français, et « du répit » rend l’accalmie temporaire avec clarté.
