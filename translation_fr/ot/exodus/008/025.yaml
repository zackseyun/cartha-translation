source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה הִנֵּ֨ה אָנֹכִ֜י יוֹצֵ֤א מֵֽ/עִמָּ/ךְ֙ וְ/הַעְתַּרְתִּ֣י אֶל יְהוָ֔ה וְ/סָ֣ר הֶ/עָרֹ֗ב מִ/פַּרְעֹ֛ה מֵ/עֲבָדָ֥י/ו וּ/מֵ/עַמּ֖/וֹ מָחָ֑ר רַ֗ק אַל יֹסֵ֤ף פַּרְעֹה֙ הָתֵ֔ל לְ/בִלְתִּי֙ שַׁלַּ֣ח אֶת הָ/עָ֔ם לִ/זְבֹּ֖חַ לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/025.yaml
  text: And Moses said[a], “Look, I am going out from you, and I will plead with Yahweh, and the swarm will depart from Pharaoh, from his servants, and from his people tomorrow. Only let Pharaoh not continue to mock by not letting the people go to sacrifice to Yahweh.”
translation:
  language: fr
  text: 'Moïse dit : « Voici, je vais m’éloigner de toi et je supplierai Yahweh. Demain, l’essaim[a] se retirera de Pharaon, de ses serviteurs et de son peuple. Seulement, que Pharaon ne recommence pas à nous tromper en refusant de laisser partir le peuple pour offrir des sacrifices à Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu עָרֹב peut désigner plus précisément un essaim de mouches ou d’autres insectes grouillants ; son référent exact est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Conserve la force présentative et attire l’attention, dans un registre français actuel et digne.
- source_word: יוֹצֵא מֵעִמָּךְ
  choice: je vais sortir de chez toi
  rationale: Rend le mouvement concret de יצא et la séparation exprimée par מֵעִמָּךְ, tout en restant idiomatique en français.
- source_word: וְהַעְתַּרְתִּי אֶל יְהוָה
  choice: je supplierai Yahweh
  rationale: Le verbe עתר désigne ici une supplication pressante ou une intercession, et non simplement une prière générique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé par le tétragramme, conformément à la politique du projet.
- source_word: וְסָר
  choice: se retirera
  rationale: Exprime naturellement le sens intransitif de départ ou d’éloignement avec « l’essaim » pour sujet.
- source_word: הֶעָרֹב
  choice: l’essaim
  rationale: Préserve l’indétermination du nom hébreu, dont le référent zoologique exact demeure incertain.
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: de Pharaon, de ses serviteurs et de son peuple
  rationale: Maintient la portée distributive des prépositions répétées en hébreu.
- source_word: מָחָר
  choice: Demain
  rationale: Rend directement l’adverbe temporel; son placement en tête de phrase est naturel en français et rattache clairement le retrait au lendemain.
- source_word: רַק
  choice: Seulement
  rationale: Introduit de manière concise la restriction et l’avertissement de Moïse.
- source_word: אַל יֹסֵף ... הָתֵל
  choice: que Pharaon cesse de nous tromper
  rationale: Le tour avec יסף et התל interdit la répétition d’une conduite trompeuse. « Cesse de nous tromper » exprime naturellement en français que Pharaon ne doit pas recommencer; le complément « nous » est implicite dans la situation de parole.
- source_word: לְבִלְתִּי שַׁלַּח
  choice: en refusant de laisser partir
  rationale: Présente le refus de libérer le peuple comme la manifestation concrète de la tromperie.
- source_word: לִזְבֹּחַ
  choice: pour offrir des sacrifices
  rationale: Préserve la spécificité cultuelle de זבח, plutôt que de l’élargir au culte en général.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom d’alliance sans le remplacer par un titre.
- issue: Identification précise de עָרֹב
  choice: l’essaim
  alternative: les essaims de mouches; l’essaim mêlé
  rationale: Le référent zoologique exact est incertain. Le choix général conserve cette ambiguïté au lieu de préciser une espèce que le texte ne permet pas d’établir avec certitude.
- issue: Nature de la conduite de Pharaon exprimée par התל
  choice: tromper
  alternative: se moquer; agir avec duplicité
  rationale: Dans ce contexte, le mot associe tromperie et mépris. « Tromper » met en avant la promesse non tenue sans exclure la nuance de dérision.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe demeure proche de l’hébreu sans devenir raide. « Voici » garde la solennité narrative; « de chez toi » et « cesse de nous tromper » assurent une compréhension immédiate.
