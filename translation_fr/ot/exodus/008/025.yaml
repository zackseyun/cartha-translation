  source_fidelity: 'Révision mineure nécessaire : « de chez toi » introduit indûment l’idée d’une maison, alors que מֵעִמָּךְ signifie « d’auprès de toi / de ta présence ». La formulation de l’avertissement doit aussi conserver plus nettement l’idée de ne pas recommencer/continuer la tromperie.'
