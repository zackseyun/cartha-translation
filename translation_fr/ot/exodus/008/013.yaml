base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/013.yaml
  text: And they did so[a]. Aaron stretched out his hand with his staff and struck the dust of the earth, and the gnats came upon man and beast[b]. All the dust of the earth became gnats throughout all the land of Egypt.
translation:
  language: fr
  text: Ils firent ainsi. Aaron tendit la main avec son bâton et frappa la poussière du sol. Il y eut des moucherons[a] sur les êtres humains et sur le bétail. Toute la poussière du sol devint des moucherons dans tout le pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « poux ». L’identification zoologique précise du terme hébreu est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Ils firent ainsi
  rationale: Cette formule narrative indique l’exécution de l’ordre précédent. « Firent ainsi » est naturel, concis et conserve le pluriel hébreu.
- source_word: וַיֵּט אַהֲרֹן אֶת יָדוֹ בְמַטֵּהוּ
  choice: Aaron tendit la main avec son bâton
  rationale: « Tendre la main » rend idiomatiquement נטה, tandis que « avec son bâton » maintient sans la préciser excessivement la relation d’accompagnement ou d’instrument exprimée par בְּ.
- source_word: וַיַּךְ אֶת עֲפַר הָאָרֶץ
  choice: frappa la poussière du sol
  rationale: « Frapper » est le sens narratif courant de נכה. Ici, הָאָרֶץ désigne le sol d’où vient la poussière; « poussière du sol » produit une image claire et naturelle en français.
- source_word: וַתְּהִי הַכִּנָּם בָּאָדָם וּבַבְּהֵמָה
  choice: Les moucherons se répandirent sur les êtres humains et sur les bêtes
  rationale: La tournure hébraïque avec היה décrit l’apparition ou la présence de l’infestation. « Se répandirent sur » l’exprime naturellement sans imposer une modalité zoologique plus précise.
- source_word: הַכִּנָּם / כִנִּים
  choice: moucherons
  rationale: L’identification zoologique du terme hébreu est incertaine. « Moucherons » est une désignation française courante et plausible pour de très petits insectes volants ou grouillants; l’autre traduction traditionnelle, « poux », est signalée en note.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: sur les êtres humains et sur les bêtes
  rationale: אָדָם a ici un sens collectif et désigne l’humanité, non les seuls hommes de sexe masculin. « Êtres humains » explicite correctement cette portée; « bêtes » conserve le contraste collectif avec les animaux.
- source_word: כָּל עֲפַר הָאָרֶץ הָיָה כִנִּים
  choice: Toute la poussière du sol devint des moucherons
  rationale: « Toute » préserve la force totalisante de כָּל, et « devint » rend directement le sens résultatif de היה tout en répétant les termes clés du récit.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: dans tout le pays d’Égypte
  rationale: Dans cette expression géographique, אֶרֶץ signifie naturellement « pays ». La formulation conserve l’étendue totale indiquée par בְּכָל.
theological_decisions:
- issue: Portée de אָדָם
  choice: les êtres humains
  alternative: l’homme
  rationale: Le nom est collectif dans son opposition aux bêtes. Le pluriel « les êtres humains » transmet sans ambiguïté cette portée inclusive et ne réduit pas le référent aux personnes de sexe masculin.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « poussière du sol » et de « moucherons » est volontaire afin de préserver la structure et l’image du texte hébreu. Les notes sont placées immédiatement après les termes qu’elles expliquent.
