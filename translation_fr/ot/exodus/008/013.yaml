    text: Ou « poux ». L’identification zoologique précise du terme hébreu est incertaine.
    reason: lexical_alternative
  revision_rationale: La révision évite d’ajouter l’idée de propagation contenue dans « se répandirent » et rend בְּהֵמָה par « bétail », terme plus précis dans ce contexte. La note b est supprimée, car « les êtres humains » rend déjà explicitement le sens collectif du terme hébreu.
