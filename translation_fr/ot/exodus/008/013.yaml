revisions:
- from: Ils firent ainsi. Aaron tendit la main avec son bâton et frappa la poussière du sol. Les moucherons[a] se répandirent sur les êtres humains[b] et sur les bêtes. Toute la poussière du sol devint des moucherons dans tout le pays d’Égypte.
  to: Ils firent ainsi. Aaron tendit la main avec son bâton et frappa la poussière du sol. Il y eut des moucherons[a] sur les êtres humains et sur le bétail. Toute la poussière du sol devint des moucherons dans tout le pays d’Égypte.
  rationale: La révision évite d’ajouter l’idée de propagation contenue dans « se répandirent » et rend בְּהֵמָה par « bétail », terme plus précis dans ce contexte. La note b est supprimée, car « les êtres humains » rend déjà explicitement le sens collectif du terme hébreu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:12:48Z'
review_pass:
  verdict: revise
  source_fidelity: Le texte rend fidèlement la succession narrative, le geste d’Aaron, la poussière, l’infestation des humains et du bétail, ainsi que l’étendue à tout le pays d’Égypte. « Se répandirent » ajoute toutefois l’idée spécifique d’une propagation, absente de la formulation hébraïque, qui dit plus sobrement que les insectes furent/survinrent sur les humains et le bétail.
  naturalness: Le français est globalement clair et moderne. « Il y eut des moucherons sur… » restitue idiomatiquement l’énoncé existentiel hébreu sans introduire une action supplémentaire. « Bétail » est plus précis et plus naturel ici que « bêtes » pour בְּהֵמָה, qui désigne les animaux domestiques.
  terminology: « Moucherons » est un choix recevable pour כִּנִּים, dont l’identification zoologique reste incertaine; la note « poux » préserve adéquatement l’alternative. « Êtres humains » rend bien le collectif אָדָם. La note explicative correspondante devient redondante avec ce choix explicite.
  issues:
  - severity: low
    issue: « Les moucherons se répandirent »
    rationale: Le verbe « se répandirent » explicite une dispersion/progression qui n’est pas exprimée par וַתְּהִי. Une tournure existentielle française est plus proche du texte source.
  - severity: low
    issue: « les bêtes »
    rationale: Dans ce contexte, בְּהֵמָה renvoie plus précisément aux animaux domestiques; « le bétail » est le terme français usuel et exact.
  - severity: low
    issue: Note b redondante
    rationale: Puisque le texte dit déjà « les êtres humains », la portée collective de אָדָם est explicitement rendue et ne requiert pas de note.
  revised_text: Ils firent ainsi. Aaron tendit la main avec son bâton et frappa la poussière du sol. Il y eut des moucherons[a] sur les êtres humains et sur le bétail. Toute la poussière du sol devint des moucherons dans tout le pays d’Égypte.
  revised_footnotes:
