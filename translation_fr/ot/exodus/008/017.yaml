    issue: Nombre et détermination de « des nuées »
    rationale: Le terme hébreu הֶעָרֹב porte l’article défini et fonctionne comme un collectif singulier. Le français « des nuées » introduit un pluriel indéfini, tandis que « ces nuées » ne reproduit pas aussi précisément la reprise de « l’essaim ». Un singulier collectif est préférable.
