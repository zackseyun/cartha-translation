revisions:
- from: Car si tu ne laisses pas partir mon peuple, voici que je vais envoyer contre toi, contre tes serviteurs, contre ton peuple et dans tes maisons des nuées[a]. Les maisons d’Égypte seront remplies de ces nuées, ainsi que le sol sur lequel ils se trouvent[b].
  to: Car si tu ne laisses pas partir mon peuple, voici que je vais envoyer contre toi, contre tes serviteurs, contre ton peuple et dans tes maisons un essaim[a]. Les maisons d’Égypte seront remplies de l’essaim, ainsi que le sol sur lequel ils se trouvent[b].
  rationale: La révision remplace le pluriel indéfini « des nuées » par le collectif singulier « un essaim », puis assure la reprise par « l’essaim ». Elle maintient l’ambiguïté concernant la nature des insectes et conserve le sens du reste du verset.
