  text: כִּ֣י אִם אֵינְ/ךָ֮ מְשַׁלֵּ֣חַ אֶת עַמִּ/י֒ הִנְ/נִי֩ מַשְׁלִ֨יחַ בְּ/ךָ֜ וּ/בַ/עֲבָדֶ֧י/ךָ וּֽ/בְ/עַמְּ/ךָ֛ וּ/בְ/בָתֶּ֖י/ךָ אֶת הֶ/עָרֹ֑ב וּ/מָ֨לְא֜וּ בָּתֵּ֤י מִצְרַ֨יִם֙ אֶת הֶ֣/עָרֹ֔ב וְ/גַ֥ם הָ/אֲדָמָ֖ה אֲשֶׁר הֵ֥ם עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/017.yaml
  text: For if you do not let my people go[a], behold, I am sending the swarm upon you, upon your servants, upon your people, and into your houses. The houses of Egypt will be filled with the swarm[b], and also the ground on which they are.
translation:
  language: fr
  text: Car si tu ne laisses pas partir mon peuple, voici que je vais envoyer contre toi, contre tes serviteurs, contre ton peuple et dans tes maisons un essaim[a]. Les maisons d’Égypte seront remplies de l’essaim, ainsi que le sol sur lequel ils se trouvent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des mouches ». Le mot hébreu désigne probablement un essaim d’insectes, traditionnellement identifié à des mouches, mais son sens précis est incertain.
    reason: lexical_alternative
  - marker: b
    text: Ou « le pays sur lequel ils se trouvent ». Le mot hébreu peut désigner le sol ou le pays.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Car si
  rationale: Introduit une menace conditionnelle liée aux paroles précédentes, tout en conservant la valeur explicative de כִּי.
- source_word: אֵינְךָ מְשַׁלֵּחַ אֶת עַמִּי
  choice: tu ne laisses pas partir mon peuple
  rationale: Dans le récit de l’Exode, שׁלח exprime ici la libération du peuple plutôt qu’un simple envoi.
- source_word: הִנְנִי מַשְׁלִיחַ
  choice: voici que je vais envoyer
  rationale: La formule avec participe annonce une action imminente et certaine; cette tournure française en garde la solennité sans archaïsme excessif.
- source_word: הֶעָרֹב
  choice: des nuées
  rationale: Le terme désigne collectivement une masse grouillante, traditionnellement comprise comme des mouches, mais son identification exacte demeure incertaine. « Nuées » conserve cette indétermination mieux qu’un nom précis d’insecte.
- source_word: בְּךָ וּבַעֲבָדֶיךָ וּבְעַמְּךָ וּבְבָתֶּיךָ
  choice: contre toi, contre tes serviteurs, contre ton peuple et dans tes maisons
  rationale: « Contre » rend l’effet hostile de la plaie sur les personnes; « dans » convient naturellement aux maisons que les nuées vont remplir.
- source_word: וּמָלְאוּ בָּתֵּי מִצְרַיִם
  choice: Les maisons d’Égypte seront remplies
  rationale: Rend naturellement le résultat annoncé tout en conservant la construction « maisons d’Égypte ».
- source_word: וְגַם הָאֲדָמָה אֲשֶׁר הֵם עָלֶיהָ
  choice: ainsi que le sol sur lequel ils se trouvent
  rationale: « Sol » exprime ici la surface physique, tandis que la relative reste proche de l’hébreu et ne précise pas davantage le référent du pronom pluriel.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et solennel. Le tutoiement correspond à l’adresse directe au pharaon. La répétition de « contre » conserve la progression rhétorique de l’hébreu; « des nuées » reste volontairement non spécifique afin de préserver l’incertitude lexicale.
