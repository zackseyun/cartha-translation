  text: וַ/יַּעֲשׂוּ כֵ֨ן הַ/חַרְטֻמִּ֧ים בְּ/לָטֵי/הֶ֛ם לְ/הוֹצִ֥יא אֶת הַ/כִּנִּ֖ים וְ/לֹ֣א יָכֹ֑לוּ וַ/תְּהִי֙ הַ/כִּנָּ֔ם בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/014.yaml
  text: And the magicians did the same by their secret arts to bring out the gnats[a], but they were not able; and the gnats were on man and on beast.
translation:
  language: fr
  text: Les magiciens firent de même par leurs pratiques secrètes, pour faire apparaître les moucherons[a], mais ils n’y parvinrent pas. Les moucherons étaient sur les humains et sur les animaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les poux ». Le terme hébreu désignant cet insecte est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: les magiciens
  rationale: Le terme désigne les spécialistes rituels de la cour de Pharaon. « Magiciens » est l’équivalent français courant et traditionnel, sans préciser outre mesure la nature de leur fonction.
- source_word: בְּלָטֵיהֶם
  choice: par leurs pratiques secrètes
  rationale: L’expression évoque des procédés cachés ou occultes. « Pratiques secrètes » reste compréhensible en français moderne tout en conservant cette nuance.
- source_word: לְהוֹצִיא
  choice: afin de faire apparaître
  rationale: La forme causative de יצא signifie littéralement « faire sortir ». Dans ce contexte, il s’agit de tenter de produire ou de faire apparaître les insectes.
- source_word: הַכִּנִּים / הַכִּנָּם
  choice: les moucherons
  rationale: L’identification exacte de l’insecte est incertaine. « Moucherons » est une traduction courante adaptée au contexte, tandis que « poux » est conservé en note comme autre possibilité.
- source_word: וְלֹא יָכֹלוּ
  choice: mais ils n’y parvinrent pas
  rationale: Cette formulation française naturelle exprime clairement leur incapacité à obtenir le résultat recherché.
- source_word: בָּאָדָם
  choice: sur les humains
  rationale: אָדָם est ici un collectif désignant l’humanité, et non un individu masculin. « Les humains » exprime naturellement cette portée collective en français.
- source_word: וּבַבְּהֵמָה
  choice: sur les animaux
  rationale: בְּהֵמָה est employé collectivement en parallèle avec אָדָם. « Les animaux » restitue ce sens collectif dans un français naturel sans restreindre indûment le terme au bétail.
theological_decisions:
- issue: Sens collectif de אָדָם
  choice: les humains
  alternative: l’homme
  rationale: Le singulier hébreu est collectif et s’oppose ici à בְּהֵמָה, également collectif. En français moderne, « les humains » conserve la distinction entre humanité et monde animal sans laisser croire qu’il s’agit seulement des hommes ou d’un individu masculin.
translation_notes:
  register: Français international moderne, digne et accessible. Le premier verbe est rendu par « tentèrent d’en faire autant » afin que l’échec exprimé ensuite ne crée pas l’impression qu’ils avaient effectivement reproduit le prodige. La structure en deux phrases évite une coordination lourde tout en préservant la progression du verset.
