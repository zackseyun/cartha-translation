revisions:
- from: Les magiciens tentèrent d’en faire autant par leurs pratiques secrètes, afin de faire apparaître les moucherons[a], mais ils n’y parvinrent pas. Les moucherons étaient sur les humains et sur les animaux.
  to: Les magiciens firent de même par leurs pratiques secrètes, pour faire apparaître les moucherons[a], mais ils n’y parvinrent pas. Les moucherons étaient sur les humains et sur les animaux.
  rationale: La révision restitue directement l’assertion initiale du texte hébreu (« les magiciens firent de même »), tout en laissant la proposition finale exprimer leur incapacité à faire apparaître les insectes. La formulation conserve le registre moderne et l’ambiguïté lexicale signalée en note.
