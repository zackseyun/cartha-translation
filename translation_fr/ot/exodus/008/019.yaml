  text: וְ/שַׂמְתִּ֣י פְדֻ֔ת בֵּ֥ין עַמִּ֖/י וּ/בֵ֣ין עַמֶּ֑/ךָ לְ/מָחָ֥ר יִהְיֶ֖ה הָ/אֹ֥ת הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/019.yaml
  text: And I will make a distinction between my people and your people[a]. Tomorrow this sign will happen.
translation:
  language: fr
  text: J’établirai une distinction entre mon peuple et ton peuple[a]. Demain, ce signe aura lieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une délivrance » ou « une rédemption » ; le terme hébreu peut désigner l’acte par lequel Dieu délivre ou rachète. Ici, cet acte se manifeste par la distinction qu’il établit entre Israël et l’Égypte.
    reason: alternative lexicale
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: J’établirai
  rationale: Le verbe שׂים signifie littéralement « mettre, placer ». Avec le nom abstrait פְדֻת et la construction « entre… et… », « établir » exprime naturellement en français l’action de poser une distinction.
- source_word: פְדֻת
  choice: une distinction
  rationale: Le nom peut évoquer la délivrance ou la rédemption, mais, dans la construction « entre mon peuple et ton peuple », il désigne ici l’action salvatrice par laquelle Dieu traite différemment Israël et l’Égypte. La note conserve ses autres résonances lexicales.
- source_word: בֵּין ... וּבֵין
  choice: entre… et…
  rationale: Cette tournure française rend directement la construction corrélative hébraïque qui marque une séparation entre deux groupes.
- source_word: עַמִּי
  choice: mon peuple
  rationale: Le possessif renvoie au peuple qui appartient à Dieu, ici Israël.
- source_word: עַמֶּךָ
  choice: ton peuple
  rationale: Le possessif masculin singulier s’adresse au pharaon et désigne son peuple, les Égyptiens.
- source_word: לְמָחָר
  choice: Demain
  rationale: L’adverbe temporel est placé en tête de phrase comme en hébreu, ce qui est également naturel en français.
- source_word: יִהְיֶה
  choice: aura lieu
  rationale: Avec « ce signe » comme sujet, « aura lieu » rend idiomatiquement l’idée qu’il se produira, sans imposer le calque peu naturel « sera ».
- source_word: הָאֹת הַזֶּה
  choice: ce signe
  rationale: אוֹת désigne couramment dans l’Exode un signe donné ou accompli par Dieu ; « signe » est clair, traditionnel et actuel.
theological_decisions:
- issue: Faut-il rendre פְדֻת par son sens théologique de « rédemption » ou par son sens contextuel de différenciation ?
  choice: Employer « une distinction » dans le texte principal.
  alternative: « une délivrance » ou « une rédemption »
  rationale: Le cadre syntaxique « entre mon peuple et ton peuple » met au premier plan la différence de traitement entre Israël et l’Égypte. Toutefois, cette distinction résulte de l’intervention salvatrice de Dieu ; la note préserve donc les sens possibles de délivrance et de rédemption sans trancher silencieusement l’ambiguïté du terme.
translation_notes:
  register: Français international moderne, naturel et digne. « J’établirai une distinction » évite le calque maladroit « je mettrai une distinction », tandis que « aura lieu » exprime idiomatiquement la réalisation future du signe.
