id: EXO.8.24
reference: Exodus 8:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פַּרְעֹ֗ה אָנֹכִ֞י אֲשַׁלַּ֤ח אֶתְ/כֶם֙ וּ/זְבַחְתֶּ֞ם לַ/יהוָ֤ה אֱלֹֽהֵי/כֶם֙ בַּ/מִּדְבָּ֔ר רַ֛ק הַרְחֵ֥ק לֹא תַרְחִ֖יקוּ לָ/לֶ֑כֶת הַעְתִּ֖ירוּ בַּעֲדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/024.yaml
  text: Then Pharaoh said, “I will let you go, so that you may sacrifice to Yahweh your God in the wilderness. Only, you must not go very far away. Plead for me.”
translation:
  language: fr
  text: 'Alors le pharaon dit : « Je vous laisserai partir pour que vous offriez des sacrifices à Yahweh, votre Dieu, dans le désert. Seulement, ne vous éloignez pas trop. Priez pour moi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait avancer le récit; « Alors » rend naturellement cette progression en français.
- source_word: פַּרְעֹה
  choice: le pharaon
  rationale: Titre royal usuel en français, employé ici avec l’article.
- source_word: אָנֹכִי אֲשַׁלַּח אֶתְכֶם
  choice: Je vous laisserai partir
  rationale: Dans cette négociation, שׁלח désigne l’autorisation donnée aux Israélites de partir; la formulation française est naturelle tout en conservant la première personne explicite.
- source_word: וּזְבַחְתֶּם
  choice: pour que vous offriez des sacrifices
  rationale: Après la promesse de les laisser partir, le parfait coordonné exprime ici le but ou le résultat envisagé.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le texte porte directement le nom divin יהוה; « Yahweh » le rend comme nom propre sans le remplacer par un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Rend directement la construction possessive qui identifie le Dieu d’Israël.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: En français courant, « désert » désigne naturellement l’espace inhabité où Israël doit aller, sans exiger l’idée d’une étendue exclusivement sablonneuse.
- source_word: רַק
  choice: Seulement
  rationale: Introduit clairement la restriction imposée par le pharaon.
- source_word: הַרְחֵק לֹא תַרְחִיקוּ לָלֶכֶת
  choice: ne vous éloignez pas trop
  rationale: L’infinitif absolu associé au verbe intensifie l’idée de distance; cette tournure idiomatique exprime l’interdiction d’aller très loin.
- source_word: הַעְתִּירוּ בַּעֲדִי
  choice: Priez pour moi
  rationale: Le hiphil de עתר désigne une supplication pressante adressée à Dieu en faveur de quelqu’un; « Priez pour moi » est clair et naturel dans ce contexte.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le verset emploie le Tétragramme comme nom personnel. « Yahweh » préserve cette fonction et suit la décision fournie, sans substituer au nom un titre.
- issue: Portée de la demande finale du pharaon
  choice: Priez pour moi
  alternative: Intercédez en ma faveur
  rationale: La formulation conserve la demande personnelle sans préciser dans ce verset seul l’objet exact de la prière ni développer davantage la notion d’intercession.
translation_notes:
  register: Français international moderne, digne et accessible. Le dialogue reste direct; « offriez des sacrifices » évite une formulation artificielle, et « ne vous éloignez pas trop » restitue naturellement l’insistance hébraïque.
