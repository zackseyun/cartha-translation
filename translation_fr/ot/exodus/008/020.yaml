base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/020.yaml
  text: And Yahweh did so[a], and a heavy swarm came into Pharaoh’s house and into his servants’ houses, and throughout all the land of Egypt the land was ruined because of the swarm.
translation:
  language: fr
  text: Yahweh fit ainsi. Un essaim considérable[a] entra dans la maison du pharaon et dans celles de ses serviteurs. Tout le pays d’Égypte fut ravagé à cause de l’essaim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une nuée considérable » ; le mot hébreu désigne une multitude grouillante dont la nature exacte est incertaine, traditionnellement comprise comme des mouches.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וַיַּעַשׂ ... כֵּן
  choice: fit ainsi
  rationale: Expression française naturelle qui conserve l’idée que Yahweh exécuta ce qui avait été annoncé.
- source_word: עָרֹב
  choice: essaim
  rationale: Désigne collectivement la multitude envahissante sans préciser l’espèce, que l’hébreu ne permet pas d’identifier avec certitude.
- source_word: כָּבֵד
  choice: considérable
  rationale: Rend la valeur intensive de « lourd » dans un français idiomatique, en soulignant l’ampleur de l’essaim.
- source_word: בֵּיתָה פַרְעֹה
  choice: dans la maison du pharaon
  rationale: La forme directive indique l’entrée dans la maison; « maison » évite d’expliciter en « palais » ce que le texte ne dit pas.
- source_word: וּבֵית עֲבָדָיו
  choice: dans celles de ses serviteurs
  rationale: Le singulier collectif hébreu se comprend naturellement de façon distributive; « celles » reprend « maisons » sans lourdeur.
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: dans tout le pays d’Égypte
  rationale: Rend clairement l’étendue complète du fléau.
- source_word: תִּשָּׁחֵת הָאָרֶץ
  choice: la terre fut ravagée
  rationale: Exprime le dommage grave indiqué par le niphal de שׁחת sans impliquer nécessairement une destruction totale.
- source_word: מִפְּנֵי הֶעָרֹב
  choice: à cause de l’essaim
  rationale: Rend idiomatiquement la valeur causale de la locution hébraïque.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme; la translittération préserve le nom personnel révélé au lieu de le remplacer par un titre.
translation_notes:
  register: Français international moderne, narratif et digne. La ponctuation en trois phrases allège la longue coordination hébraïque sans modifier sa progression. « Essaim considérable » reste accessible tout en conservant l’incertitude sur les créatures concernées.
