  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁה֒ אֱמֹר֙ אֶֽל אַהֲרֹ֔ן נְטֵ֣ה אֶֽת מַטְּ/ךָ֔ וְ/הַ֖ךְ אֶת עֲפַ֣ר הָ/אָ֑רֶץ וְ/הָיָ֥ה לְ/כִנִּ֖ם בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/012.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your staff and strike the dust of the earth, and it will become gnats throughout all the land of Egypt.’”
translation:
  language: fr
  text: 'Alors Yahweh dit à Moïse : « Dis à Aaron : “Étends ton bâton et frappe la poussière de la terre : elle se changera en moucherons[a] dans tout le pays d’Égypte.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « poux »; le terme hébreu désigne de petits insectes qui piquent ou provoquent des irritations, mais l’espèce exacte est incertaine.
    reason: Alternative lexicale due à l’incertitude sur l’identification de כִּנִּים.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme, conformément à sa fonction dans le texte hébreu.
- source_word: וַיֹּאמֶר
  choice: Alors ... dit
  rationale: Le waw consécutif fait progresser le récit; « Alors » rend naturellement cette succession en français.
- source_word: אֱמֹר
  choice: Dis
  rationale: Impératif direct et naturel introduisant les paroles que Moïse doit transmettre à Aaron.
- source_word: נְטֵה
  choice: Étends
  rationale: Rend le geste d’allonger ou de tendre le bâton, dans une formulation française concise.
- source_word: מַטְּךָ
  choice: ton bâton
  rationale: « Bâton » est moderne et clair dans ce contexte, sans la coloration archaïque que pourrait avoir « verge ».
- source_word: וְהַךְ
  choice: et frappe
  rationale: Correspond au sens courant de נכה et conserve la force de l’ordre sans archaïsme.
- source_word: עֲפַר הָאָרֶץ
  choice: la poussière de la terre
  rationale: Reproduit l’expression hébraïque et garde l’image de la poussière elle-même transformée.
- source_word: וְהָיָה
  choice: elle se changera
  rationale: Le sens littéral est « elle sera », mais le contexte indique le résultat d’une transformation; le pronom reprend naturellement « poussière ».
- source_word: לְכִנִּם
  choice: en moucherons
  rationale: Le terme désigne vraisemblablement de très petits insectes nuisibles, mais l’espèce exacte demeure incertaine; « moucherons » évite une précision injustifiée.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: dans tout le pays d’Égypte
  rationale: Rend clairement l’étendue complète du fléau dans une tournure française naturelle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte emploie directement le nom divin; sa translittération préserve cette distinction sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct imbriqué est conservé, ainsi que la progression narrative. La note est placée après le nom de l’insecte auquel elle se rapporte.
