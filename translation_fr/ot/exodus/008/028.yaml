id: EXO.8.28
reference: Exodus 8:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּכְבֵּ֤ד פַּרְעֹה֙ אֶת לִבּ֔/וֹ גַּ֖ם בַּ/פַּ֣עַם הַ/זֹּ֑את וְ/לֹ֥א שִׁלַּ֖ח אֶת הָ/עָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/028.yaml
  text: But Pharaoh hardened his heart this time also[a], and did not let the people go.
translation:
  language: fr
  text: Mais, cette fois encore, le pharaon rendit son cœur insensible[a] et ne laissa pas partir le peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « rendit son cœur lourd ». Cette expression signifie que le pharaon se montra obstiné et insensible.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְבֵּד
  choice: rendit … insensible
  rationale: Le hiphil de כבד signifie littéralement « rendre lourd ». Avec « cœur », il exprime ici le fait de se rendre fermé, obstiné ou insensible. Cette formulation française naturelle conserve l’action volontaire du pharaon sans confondre ce verbe avec le vocabulaire hébreu proprement dit de l’endurcissement.
- source_word: לִבּוֹ
  choice: son cœur
  rationale: Le sens littéral convient en français. Dans cette expression hébraïque, le cœur désigne le siège de la volonté et des dispositions.
- source_word: גַּם בַּפַּעַם הַזֹּאת
  choice: cette fois encore
  rationale: Cette tournure restitue naturellement la valeur additive de גַּם et la référence à la présente occasion.
- source_word: וְלֹא שִׁלַּח
  choice: et ne laissa pas partir
  rationale: Dans le contexte de l’Exode, שׁלח exprime le fait de permettre au peuple de partir ou de le relâcher. « Laisser partir » est idiomatique et exact.
- source_word: הָעָם
  choice: le peuple
  rationale: Le nom collectif défini renvoie ici au peuple d’Israël.
- source_word: וַ
  choice: Mais
  rationale: Le waw fait progresser le récit; « mais » rend en français le contraste contextuel entre la délivrance accordée et la réaction contraire du pharaon.
theological_decisions:
- issue: Responsabilité dans l’insensibilisation du cœur du pharaon
  choice: Le pharaon rendit lui-même son cœur insensible
  alternative: Le cœur du pharaon devint insensible
  rationale: Le texte hébreu présente explicitement le pharaon comme sujet agissant. La traduction maintient sa responsabilité sans atténuer la tension du récit, où d’autres passages attribuent à Dieu l’endurcissement du cœur du pharaon.
translation_notes:
  register: Français international moderne, naturel et digne. « Le pharaon » suit l’usage français courant du titre avec article. La formulation évite une littéralité obscure tout en signalant en note l’image hébraïque de la lourdeur.
