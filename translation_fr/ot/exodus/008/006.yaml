  source_fidelity: 'Le texte rend correctement la succession des deux prises de parole : Pharaon répond « Demain », puis Moïse accepte ce délai. « afin que tu saches » restitue bien la proposition finale לְמַעַן תֵּדַע, adressée à Pharaon. « il n’y a personne comme Yahweh, notre Dieu » conserve la comparaison absolue de אֵין כַּיהוָה אֱלֹהֵינוּ sans y ajouter explicitement « parmi les dieux ».'
