source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר לְ/מָחָ֑ר וַ/יֹּ֨אמֶר֙ כִּ/דְבָ֣רְ/ךָ֔ לְמַ֣עַן תֵּדַ֔ע כִּי אֵ֖ין כַּ/יהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/006.yaml
  text: He said[a], “Tomorrow.” And he said, “According to your word, so that you may know that there is no one like Yahweh our God.”
translation:
  language: fr
  text: 'Il répondit : « Demain. » Moïse dit : « Ce sera comme tu l’as dit, afin que tu saches qu’il n’y a personne comme Yahweh[a], notre Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom divin יהוה (YHWH) est rendu ici par « Yahweh »; de nombreuses traductions le rendent traditionnellement par « le SEIGNEUR ».
    reason: Signaler la forme hébraïque du nom divin et une convention de traduction largement répandue.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il répondit / Moïse dit
  rationale: Le premier verbe introduit la réponse de Pharaon; « répondit » est donc naturel en français. Pour la seconde occurrence, le contexte identifie Moïse comme locuteur; son nom est explicité afin d’éviter une ambiguïté pronominale artificielle en français.
- source_word: לְמָחָר
  choice: Demain
  rationale: L’expression temporelle constitue ici la réponse directe et concise de Pharaon.
- source_word: כִּדְבָרְךָ
  choice: Ce sera comme tu l’as dit
  rationale: Cette formulation française naturelle conserve le sens de l’expression hébraïque, littéralement « selon ta parole », et indique que Moïse accepte le moment fixé par Pharaon.
- source_word: לְמַעַן תֵּדַע
  choice: afin que tu saches
  rationale: La construction exprime clairement le but; le singulier « tu » s’adresse à Pharaon.
- source_word: אֵין כַּיהוָה
  choice: il n’y a personne comme Yahweh
  rationale: אֵין marque l’inexistence, tandis que le כ préfixé à יהוה exprime la comparaison. « Personne » convient à la référence personnelle à Dieu.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Malgré sa forme morphologiquement plurielle, אֱלֹהִים désigne ici le Dieu unique d’Israël et appelle le singulier en français.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » en représente le nom propre plutôt que de le remplacer par un titre; une note signale la convention traditionnelle concurrente.
- issue: Portée de la comparaison אֵין כַּיהוָה
  choice: il n’y a personne comme Yahweh
  alternative: il n’y a pas de dieu comme Yahweh
  rationale: Le texte ne contient pas ici le nom « dieu » dans la proposition comparative avant « notre Dieu ». La traduction conserve donc la formulation générale sans limiter explicitement la comparaison aux autres dieux.
translation_notes:
  register: Français international moderne, clair et digne. Le dialogue reste concis; « afin que » préserve la relation explicite de but. Le nom de Moïse est rétabli d’après le contexte pour que le changement de locuteur soit immédiatement compréhensible.
