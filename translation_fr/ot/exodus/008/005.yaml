base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/005.yaml
  text: 'And Moses said to Pharaoh[a], “Have this honor over me: when shall I plead for you, for your servants, and for your people, to cut off the frogs from you and from your houses? Only in the Nile shall they remain.”'
translation:
  language: fr
  text: 'Moïse dit au pharaon : « À toi l’honneur de décider[a] : pour quand dois-je supplier en ta faveur, en faveur de tes serviteurs et de ton peuple, afin que les grenouilles soient retirées de toi et de tes maisons ? Elles ne resteront que dans le Nil. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici une expression difficile, littéralement : « Glorifie-toi sur moi » ou « Fais-toi honneur sur moi ». Dans ce contexte, Moïse invite le pharaon à fixer lui-même le moment où Moïse devra intercéder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְפָּאֵר עָלַי
  choice: À toi l’honneur de décider
  rationale: L’expression hébraïque est idiomatique et difficile. Elle évoque littéralement le fait de tirer honneur ou gloire aux dépens de Moïse, mais, dans le contexte, celui-ci accorde au pharaon le privilège de fixer le moment. La formulation française transmet cette fonction tout en conservant la notion d’honneur; la difficulté littérale est signalée en note.
- source_word: לְמָתַי
  choice: pour quand
  rationale: Cette tournure demande au pharaon de fixer le moment auquel l’intercession devra produire son effet. « Pour quand » conserve cette nuance temporelle mieux qu’un simple « quand ».
- source_word: אַעְתִּיר
  choice: dois-je supplier
  rationale: Le hifil de עתר désigne ici une supplication pressante adressée à Dieu. « Supplier » est courant, précis et ne transforme pas le verbe en terme théologique technique.
- source_word: לְךָ וְלַעֲבָדֶיךָ וּלְעַמְּךָ
  choice: en ta faveur, en faveur de tes serviteurs et de ton peuple
  rationale: La répétition de « en faveur de » rend clairement la portée de l’intercession, tout en évitant l’ambiguïté possible de « te supplier » en français.
- source_word: לְהַכְרִית
  choice: afin que les grenouilles disparaissent
  rationale: כרת signifie littéralement « retrancher, couper ». Avec des grenouilles retirées des lieux infestés, « disparaissent de » exprime naturellement le résultat visé sans suggérer nécessairement qu’elles sont toutes mises à mort, puisqu’elles demeurent dans le Nil.
- source_word: הַצֲפַרְדְּעִים
  choice: les grenouilles
  rationale: Équivalent français direct du nom hébreu dans le récit de la plaie.
- source_word: מִמְּךָ וּמִבָּתֶּיךָ
  choice: de chez toi et de tes maisons
  rationale: « De chez toi » rend idiomatiquement l’éloignement de la personne ou de son environnement immédiat, tandis que « de tes maisons » conserve explicitement le pluriel et la seconde expression hébraïque.
- source_word: רַק
  choice: ne… que
  rationale: La construction restrictive française marque nettement l’unique exception.
- source_word: בַּיְאֹר
  choice: dans le Nil
  rationale: Dans le contexte égyptien de l’Exode, יְאֹר désigne spécifiquement le Nil plutôt qu’un cours d’eau indéterminé.
- source_word: תִּשָּׁאַרְנָה
  choice: resteront
  rationale: Le nifal de שׁאר exprime ici le fait de demeurer ou d’être laissées sur place. Le futur français convient à la conséquence annoncée de l’intercession.
