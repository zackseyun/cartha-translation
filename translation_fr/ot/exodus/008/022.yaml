source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לֹ֤א נָכוֹן֙ לַ/עֲשׂ֣וֹת כֵּ֔ן כִּ֚י תּוֹעֲבַ֣ת מִצְרַ֔יִם נִזְבַּ֖ח לַ/יהוָ֣ה אֱלֹהֵ֑י/נוּ הֵ֣ן נִזְבַּ֞ח אֶת תּוֹעֲבַ֥ת מִצְרַ֛יִם לְ/עֵינֵי/הֶ֖ם וְ/לֹ֥א יִסְקְלֻֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/022.yaml
  text: But Moses said[a], “It would not be right to do so, because we would sacrifice to Yahweh our God what is detestable to the Egyptians. If we sacrifice what is detestable to the Egyptians before their eyes, will they not stone us?”
translation:
  language: fr
  text: 'Mais Moïse dit : « Il ne convient pas de faire ainsi, car nous sacrifierions à Yahweh notre Dieu ce qui est abominable pour les Égyptiens.[a] Si nous sacrifions sous leurs yeux ce qui est abominable pour les Égyptiens, ne nous lapideront-ils pas ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « l’abomination des Égyptiens ». L’expression désigne probablement ce que les Égyptiens considéraient comme abominable.'
    reason: Alternative lexicale préservant l’ambiguïté du construit hébreu.
lexical_decisions:
- source_word: נָכוֹן
  choice: il ne convient pas
  rationale: Dans ce contexte, le terme désigne ce qui est convenable ou approprié. Cette formulation française naturelle conserve l'idée d'inconvenance pratique et religieuse.
- source_word: לַעֲשׂוֹת כֵּן
  choice: de faire ainsi
  rationale: Rend directement l'expression idiomatique « faire de cette manière », dans un registre digne et courant.
- source_word: תּוֹעֲבַת מִצְרַיִם
  choice: ce qui est abominable pour les Égyptiens
  rationale: Le construit hébreu demeure grammaticalement ambigu, mais le contexte indique probablement ce que les Égyptiens tiennent pour abominable. Le marqueur de note signale la formulation plus littérale.
- source_word: נִזְבַּח
  choice: nous sacrifierions / nous sacrifions
  rationale: La première occurrence exprime l'action envisagée dans le cadre de la proposition de Pharaon, d'où le conditionnel ; la seconde appartient à l'hypothèse vive introduisant la question rhétorique, d'où le présent.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le nom divin est rendu par sa forme personnelle Yahweh, conformément à la présence explicite du tétragramme dans le texte source.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: La construction possessive est conservée explicitement.
- source_word: הֵן
  choice: Si
  rationale: Ici, la particule introduit une hypothèse vive conduisant à une question rhétorique.
- source_word: לְעֵינֵיהֶם
  choice: sous leurs yeux
  rationale: Cette expression française idiomatique préserve l'image de l'acte accompli ouvertement en leur présence.
- source_word: יִסְקְלֻנוּ
  choice: ne nous lapideront-ils pas ?
  rationale: Le verbe désigne l'action de tuer ou d'attaquer à coups de pierres ; la question négative conserve la force rhétorique de l'hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le nom propre divin. « Yahweh » le distingue du titre אֲדֹנָי et préserve sa fonction de nom d'alliance.
- issue: Sens de תּוֹעֲבַת מִצְרַיִם
  choice: ce qui est abominable pour les Égyptiens
  alternative: l'abomination des Égyptiens
  rationale: Le contexte met en avant l'offense que les sacrifices israélites provoqueraient chez les Égyptiens. La traduction principale exprime ce sens probable, tandis que la note conserve l'ambiguïté formelle du construit hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. « Il ne convient pas » évite un moralisme excessif ; « sous leurs yeux » et « lapideront-ils » maintiennent la vivacité de l'argument de Moïse.
