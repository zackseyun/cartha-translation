source:
  edition: WLC
  text: וְ/סָר֣וּ הַֽ/צְפַרְדְּעִ֗ים מִמְּ/ךָ֙ וּ/מִ/בָּ֣תֶּ֔י/ךָ וּ/מֵ/עֲבָדֶ֖י/ךָ וּ/מֵ/עַמֶּ֑/ךָ רַ֥ק בַּ/יְאֹ֖ר תִּשָּׁאַֽרְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/007.yaml
  text: And the frogs will depart from you[a], and from your houses, and from your servants, and from your people; only in the Nile will they remain.
translation:
  language: fr
  text: Les grenouilles s’éloigneront de toi, de tes maisons, de tes serviteurs et de ton peuple ; elles ne resteront que dans le Nil[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le fleuve ». Le mot hébreu יְאֹר peut signifier « fleuve », mais, dans l’Exode, il désigne généralement le Nil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָרוּ
  choice: s’éloigneront
  rationale: Le verbe סוּר exprime ici le fait de se retirer ou de partir. « S’éloigneront » est naturel en français et n’ajoute pas l’idée qu’elles seront directement détruites.
- source_word: הַצְפַרְדְּעִים
  choice: les grenouilles
  rationale: Rend directement le nom défini au pluriel désignant les animaux de ce fléau.
- source_word: מִמְּךָ
  choice: de toi
  rationale: Rend simplement la préposition מן avec le suffixe masculin singulier, adressé au pharaon.
- source_word: וּמִבָּתֶּיךָ
  choice: de tes maisons
  rationale: Conserve le pluriel explicite de l’hébreu.
- source_word: וּמֵעֲבָדֶיךָ
  choice: de tes serviteurs
  rationale: עֶבֶד peut désigner un serviteur, un esclave ou un agent. Dans ce contexte, « serviteurs » reste assez large et évite de préciser indûment leur statut.
- source_word: וּמֵעַמֶּךָ
  choice: de ton peuple
  rationale: Rend עַם par son équivalent courant et suffisamment large.
- source_word: רַק
  choice: ne… que
  rationale: La tournure restrictive française « ne… que » exprime naturellement la limitation marquée par רַק.
- source_word: בַּיְאֹר
  choice: dans le Nil
  rationale: Dans l’Exode, יְאֹר désigne ordinairement le Nil ; le nom propre apporte donc la précision contextuelle attendue.
- source_word: תִּשָּׁאַרְנָה
  choice: elles resteront
  rationale: Le niphal imparfait de שׁאר exprime ici le fait de demeurer ou de subsister dans un lieu. L’ordre français place naturellement l’exception en fin de proposition.
