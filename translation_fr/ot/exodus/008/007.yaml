translation_notes:
  register: Français international moderne, clair et digne. La coordination répétée de l’hébreu est légèrement allégée pour une lecture naturelle, sans perdre aucun groupe mentionné. Le point-virgule conserve le contraste entre le retrait général des grenouilles et leur maintien dans le Nil.
