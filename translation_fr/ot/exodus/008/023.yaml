  to: 'Nous irons dans le désert, à trois jours de marche[a], et nous offrirons un sacrifice à Yahweh, notre Dieu, comme il nous le dira.[b]


    [a] Ou : « Nous ferons trois jours de marche dans le désert. »


    [b] Ou : « comme il nous le dit » ; le verbe hébreu peut ici désigner une instruction présente ou à venir.'
  rationale: La révision exprime explicitement le déplacement vers le désert tout en conservant la mesure hébraïque d’un trajet de trois jours. Le singulier « un sacrifice » est plus proche du verbe hébreu non qualifié. Les deux lectures recevables de l’inaccompli « il nous le dira / il nous le dit » demeurent signalées en note.
