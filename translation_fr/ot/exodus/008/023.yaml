base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/023.yaml
  text: We will go a three days' journey into the wilderness and sacrifice to Yahweh our God[b][a], just as he tells us.
translation:
  language: fr
  text: 'Nous irons dans le désert, à trois jours de marche[a], et nous offrirons un sacrifice à Yahweh, notre Dieu, comme il nous le dira.[b]


    [a] Ou : « Nous ferons trois jours de marche dans le désert. »


    [b] Ou : « comme il nous le dit » ; le verbe hébreu peut ici désigner une instruction présente ou à venir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Nous ferons trois jours de marche dans le désert. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « comme il nous le dit » ; le verbe hébreu peut ici désigner une instruction présente ou à venir.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: trois jours de marche
  rationale: L’expression hébraïque désigne un trajet ou une distance évalués en jours de voyage. Cette formulation est idiomatique en français et conserve la mesure temporelle du déplacement.
- source_word: נֵלֵךְ
  choice: nous ferons … de marche
  rationale: L’imparfait qal à la première personne du pluriel exprime ici le déplacement projeté. La tournure française s’accorde naturellement avec « trois jours de marche » sans ajouter une nuance d’obligation.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne une région sauvage, peu habitée et propice au pâturage, non nécessairement un désert de sable. En français biblique courant, « désert » transmet naturellement ce sens.
- source_word: וְזָבַחְנוּ
  choice: et nous offrirons des sacrifices
  rationale: Le verbe זבח désigne l’action cultuelle de sacrifier. « Offrir des sacrifices » est clair et naturel en français, tout en conservant la portée rituelle.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La translittération « Yahweh » représente directement le nom divin יהוה et le distingue d’un titre tel que « le Seigneur ».
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Le nom avec suffixe de première personne du pluriel se rend directement par « notre Dieu ».
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: La conjonction marque ici la conformité du sacrifice à l’instruction divine. « Comme » l’exprime avec naturel, sans renforcer inutilement la comparaison.
- source_word: יֹאמַר אֵלֵינוּ
  choice: il nous le dira
  rationale: L’imparfait peut viser l’instruction que Dieu donnera. Le futur convient au projet annoncé, tandis que la note préserve la possibilité d’un présent.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » conserve le nom propre de l’alliance plutôt que de lui substituer un titre.
- issue: Temporalité de יֹאמַר
  choice: comme il nous le dira
  alternative: comme il nous le dit
  rationale: La forme inaccomplie permet une lecture future dans le contexte du déplacement et du sacrifice projetés, mais une instruction présente ou générale reste grammaticalement possible et est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. « Trois jours de marche » évite un calque lourd de l’hébreu ; « offrir des sacrifices » explicite naturellement la valeur cultuelle du verbe. Les notes conservent les ambiguïtés réelles concernant la formulation du trajet et la valeur temporelle de l’inaccompli.
