revisions:
- from: 'Nous ferons trois jours de marche dans le désert[a] et nous offrirons des sacrifices à Yahweh, notre Dieu, comme il nous le dira.[b]


    [a] Autre traduction : « Nous irons à trois jours de marche dans le désert. »

