  text: וַ/יֵּ֤ט אַהֲרֹן֙ אֶת יָד֔/וֹ עַ֖ל מֵימֵ֣י מִצְרָ֑יִם וַ/תַּ֨עַל֙ הַ/צְּפַרְדֵּ֔עַ וַ/תְּכַ֖ס אֶת אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/002.yaml
  text: So Aaron stretched out his hand over the waters of Egypt[a], and the frogs came up and covered the land of Egypt.
translation:
  language: fr
  text: Alors Aaron étendit la main au-dessus des eaux d’Égypte, et les grenouilles[a] montèrent et couvrirent le pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici le singulier « la grenouille », probablement dans un sens collectif; d’où le pluriel « les grenouilles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: étendit
  rationale: Dans le contexte du signe accompagnant la plaie, נטה désigne le geste d’étendre la main. « Étendit » est naturel et conserve l’image concrète du geste d’autorité.
- source_word: יָדוֹ
  choice: la main
  rationale: L’hébreu nomme explicitement la main d’Aaron. En français, le possessif est naturellement rendu par l’article défini lorsque le possesseur est déjà le sujet.
- source_word: עַל
  choice: au-dessus de
  rationale: Cette locution exprime clairement l’orientation spatiale de la main par rapport aux eaux, sans archaïsme.
- source_word: מֵימֵי מִצְרָיִם
  choice: des eaux d’Égypte
  rationale: Le pluriel construit désigne collectivement les étendues et cours d’eau d’Égypte; « les eaux d’Égypte » en préserve la forme et la portée.
- source_word: וַתַּעַל
  choice: montèrent
  rationale: עלה décrit ici la montée des grenouilles hors des eaux vers la terre. Le pluriel français s’accorde avec le rendu collectif « les grenouilles ».
- source_word: הַצְּפַרְדֵּעַ
  choice: les grenouilles
  rationale: Le nom hébreu est formellement au singulier défini, mais fonctionne vraisemblablement comme un collectif. Le pluriel est la formulation naturelle en français, tandis qu’une note conserve l’information sur la forme source.
- source_word: וַתְּכַס
  choice: couvrirent
  rationale: כסה signifie directement « couvrir ». Ce choix reste précis et vivant sans ajouter d’image absente du texte.
- source_word: אֶרֶץ מִצְרָיִם
  choice: le pays d’Égypte
  rationale: Dans ce contexte, אֶרֶץ désigne le territoire égyptien. « Le pays d’Égypte » est naturel en français moderne et évite de suggérer la planète ou le sol seul.
