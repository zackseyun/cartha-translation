  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁה֒ אֱמֹ֣ר אֶֽל אַהֲרֹ֗ן נְטֵ֤ה אֶת יָדְ/ךָ֙ בְּ/מַטֶּ֔/ךָ עַל הַ֨/נְּהָרֹ֔ת עַל הַ/יְאֹרִ֖ים וְ/עַל הָ/אֲגַמִּ֑ים וְ/הַ֥עַל אֶת הַֽ/צְפַרְדְּעִ֖ים עַל אֶ֥רֶץ מִצְרָֽיִם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/001.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your hand with your staff over the rivers, over the canals, and over the pools, and bring up the frogs over the land of Egypt.’”
translation:
  language: fr
  text: 'Puis Yahweh dit à Moïse : « Dis à Aaron : “Étends ta main avec ton bâton au-dessus des rivières, des canaux[a] et des étangs, et fais monter les grenouilles sur le pays d’Égypte.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des bras du Nil » ; en Égypte, le terme hébreu désigne souvent des voies d’eau liées au Nil.
    reason: Préciser la portée égyptienne possible du terme tout en conservant dans le texte une formulation concise.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: וַיֹּאמֶר
  choice: Puis … dit
  rationale: Le waw consécutif fait progresser le récit ; « Puis » exprime naturellement cette succession en français.
- source_word: נְטֵה אֶת־יָדְךָ בְּמַטֶּךָ
  choice: Étends la main avec ton bâton
  rationale: Cette formulation conserve le geste concret et comprend la préposition בְּ dans son sens instrumental.
- source_word: הַנְּהָרֹת
  choice: les rivières
  rationale: « Rivières » rend le terme général désignant des cours d’eau et le distingue des canaux mentionnés ensuite.
- source_word: הַיְאֹרִים
  choice: les canaux
  rationale: En contexte égyptien, le pluriel désigne vraisemblablement des voies d’eau liées au Nil ; « canaux » est clair et distinct de « rivières ».
- source_word: הָאֲגַמִּים
  choice: les étangs
  rationale: Le mot désigne des étendues d’eau stagnante ou retenue ; « étangs » maintient la distinction avec les rivières et les canaux.
- source_word: וְהַעַל
  choice: et fais monter
  rationale: Le hifil impératif de עלה est causatif ; « fais monter » en préserve explicitement la valeur.
- source_word: הַצְפַרְדְּעִים
  choice: les grenouilles
  rationale: Équivalent français direct du nom hébreu.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: sur le pays d’Égypte
  rationale: La formulation conserve la préposition עַל sans développer le sens en « dans tout le pays ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Yahvé
  rationale: Le texte porte le nom divin lui-même. Sa transcription préserve le nom personnel au lieu de lui substituer un titre ; la forme « Yahweh » assure aussi la cohérence éditoriale du projet.
translation_notes:
  register: Français international moderne, clair et digne. Les impératifs restent directs, la triple énumération des eaux est conservée, et la ponctuation distingue les paroles adressées à Moïse de celles qu’il doit transmettre à Aaron.
