  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הַשְׁכֵּ֤ם בַּ/בֹּ֨קֶר֙ וְ/הִתְיַצֵּב֙ לִ/פְנֵ֣י פַרְעֹ֔ה הִנֵּ֖ה יוֹצֵ֣א הַ/מָּ֑יְמָ/ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַׁלַּ֥ח עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/016.yaml
  text: 'Then the LORD said to Moses, “Rise early in the morning and station yourself before Pharaoh. Look, he is going out to the water, and you shall say to him, ‘Thus says the LORD: Let my people go, so that they may serve me.’”'
translation:
  language: fr
  text: 'Alors le SEIGNEUR dit à Moïse : « Lève-toi de bon matin et présente-toi devant le pharaon. Voici qu’il sort vers l’eau. Tu lui diras : “Voici ce que dit le SEIGNEUR : Laisse partir mon peuple, afin qu’il me serve.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: Lève-toi de bon matin
  rationale: Rend naturellement l’idée de se lever tôt, portée par l’infinitif absolu employé avec l’impératif.
- source_word: וְהִתְיַצֵּב לִפְנֵי
  choice: présente-toi devant
  rationale: Exprime l’action de prendre position en présence du pharaon, dans un français courant et digne.
- source_word: הִנֵּה יוֹצֵא הַמָּיְמָה
  choice: Il va sortir pour aller au bord de l’eau
  rationale: הִנֵּה attire l’attention sur une action imminente; le hé directionnel de הַמָּיְמָה indique un mouvement vers l’eau.
- source_word: שַׁלַּח
  choice: Laisse partir
  rationale: Dans ce contexte, le piel impératif demande que le pharaon relâche le peuple et lui permette de partir.
- source_word: וְיַעַבְדֻנִי
  choice: afin qu’il me rende un culte
  rationale: Le verbe עבד peut signifier servir ou rendre un culte; dans les demandes adressées au pharaon, le cadre est explicitement cultuel.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Suit la convention française établie qui représente le tétragramme par SEIGNEUR en petites capitales.
theological_decisions:
- issue: Sens cultuel de עבד
  choice: afin qu’il me rende un culte
  alternative: afin qu’il me serve
  rationale: Le contexte de l’Exode vise le départ du peuple pour adorer et sacrifier à Dieu; « rendre un culte » fait entendre ce sens sans exclure l’idée plus large de service.
translation_notes:
  register: Français international moderne, clair et digne. « Le pharaon » est employé comme titre, conformément à l’usage français courant. Les paroles enchâssées sont distinguées par des guillemets français puis anglais.
