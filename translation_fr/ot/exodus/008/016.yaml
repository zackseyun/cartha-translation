  to: 'Alors le SEIGNEUR dit à Moïse : « Lève-toi de bon matin et présente-toi devant le pharaon. Voici qu’il sort vers l’eau. Tu lui diras : “Voici ce que dit le SEIGNEUR : Laisse partir mon peuple, afin qu’il me serve.” »'
