  text: וַ/יֵּצֵ֥א מֹשֶׁ֛ה וְ/אַהֲרֹ֖ן מֵ/עִ֣ם פַּרְעֹ֑ה וַ/יִּצְעַ֤ק מֹשֶׁה֙ אֶל יְהוָ֔ה עַל דְּבַ֥ר הַֽ/צְפַרְדְּעִ֖ים אֲשֶׁר שָׂ֥ם לְ/פַרְעֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/008.yaml
  text: So Moses and Aaron went out from Pharaoh[a], and Moses cried out to Yahweh concerning the frogs that he had set upon Pharaoh.
translation:
  language: fr
  text: Moïse et Aaron sortirent d’auprès du pharaon, et Moïse cria vers Yahweh au sujet des grenouilles qu’il avait fait venir sur le pharaon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qu’il avait mises pour le pharaon ». Dans ce contexte de plaie, l’expression peut aussi se comprendre « sur le pharaon » ou « contre le pharaon ». Le sujet de « avait mises » n’est pas exprimé en hébreu ; le contexte renvoie probablement à Yahweh.'
    reason: Signaler le sens de base de שׂים et la nuance contextuelle de לְ, tout en préservant l’absence de sujet explicite dans l’hébreu.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: sortirent
  rationale: Le verbe יצא indique ici que Moïse et Aaron quittent le lieu où se trouve le pharaon. Le pluriel français s’accorde naturellement avec le sujet composé.
- source_word: מֵעִם פַּרְעֹה
  choice: de chez le pharaon
  rationale: מֵעִם exprime l’éloignement d’auprès de quelqu’un. « De chez le pharaon » rend cette sortie de sa présence en français courant, sans suggérer qu’ils sortent du pharaon lui-même.
- source_word: וַיִּצְעַק
  choice: cria vers
  rationale: צעק désigne un appel pressant ou intense. « Cria vers » conserve cette force et la direction de l’appel à Dieu, plutôt que de l’aplatir en « pria ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la forme française usuelle « Yahweh », afin de préserver le nom divin plutôt que de lui substituer un titre.
- source_word: עַל דְּבַר
  choice: au sujet de
  rationale: Cette locution signifie ici « concernant » ou « à propos de » et introduit l’objet de l’appel de Moïse.
- source_word: הַצְפַרְדְּעִים
  choice: les grenouilles
  rationale: Traduction directe du nom pluriel désignant les animaux de cette plaie.
- source_word: אֲשֶׁר שָׂם לְפַרְעֹה
  choice: qu’il avait fait venir sur le pharaon
  rationale: שׂים signifie littéralement « mettre, placer ». Dans le contexte d’une plaie, « faire venir sur » exprime naturellement l’idée des grenouilles imposées au pharaon, tandis que le pronom « il » préserve la forme non explicitée du sujet hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre divin. Le translittérer maintient la distinction entre ce nom et un titre.
- issue: Sujet implicite de שָׂם
  choice: Conserver le pronom « il »
  alternative: Expliciter « Yahweh » ou « Moïse »
  rationale: L’hébreu ne répète pas le sujet. Le contexte favorise Yahweh comme auteur de la plaie, mais l’expliciter dans le corps du texte supprimerait une légère ambiguïté grammaticale présente dans la source.
translation_notes:
  register: Français international moderne, clair et digne. « Le pharaon » traite le titre comme un nom commun défini; « cria vers » garde l’intensité et la tournure directionnelle de l’hébreu. La ponctuation en deux phrases évite une coordination lourde.
