revisions:
- from: Moïse et Aaron sortirent donc de chez le pharaon. Puis Moïse cria vers Yahweh au sujet des grenouilles qu’il avait fait venir sur le pharaon.[a]
  to: Moïse et Aaron sortirent d’auprès du pharaon, et Moïse cria vers Yahweh au sujet des grenouilles qu’il avait fait venir sur le pharaon.[a]
  rationale: La révision retire l’inférence non exprimée par « donc », emploie « d’auprès du pharaon » pour refléter précisément מֵעִם, et clarifie la note afin qu’elle rende compte de l’ambiguïté du syntagme hébreu sans donner à « pour le pharaon » un sens favorable indu. Le rendu idiomatique « avait fait venir sur » conserve le sens contextuel de la plaie et le pronom maintient le sujet implicite.
