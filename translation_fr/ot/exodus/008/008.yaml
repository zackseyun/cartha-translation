    rationale: מֵעִם indique le départ de la compagnie ou de la présence de Pharaon, sans mettre l’accent sur son palais ou son domicile.
  - severity: medium
    issue: Note de bas de page insuffisamment claire sur « mises pour le pharaon »
    rationale: 'Le rendu littéral de לְ par « pour » exige une clarification explicite : dans le contexte, il peut exprimer une orientation défavorable, « contre/sur Pharaon ». La note actuelle pourrait laisser entendre un sens favorable.'
