source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ הַֽ/חַרְטֻמִּים֙ אֶל פַּרְעֹ֔ה אֶצְבַּ֥ע אֱלֹהִ֖ים הִ֑וא וַ/יֶּחֱזַ֤ק לֵב פַּרְעֹה֙ וְ/לֹֽא שָׁמַ֣ע אֲלֵ/הֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/015.yaml
  text: Then the magicians said to Pharaoh[a], “This is the finger of God.” But Pharaoh’s heart was hardened, and he did not listen to them[c][b], just as Yahweh had spoken.
translation:
  language: fr
  text: 'Alors les magiciens dirent à Pharaon : « C’est le doigt de Dieu[a]. » Mais le cœur de Pharaon s’endurcit[b], et il ne les écouta pas, comme Yahweh l’avait dit[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « le doigt de Dieu » évoque l’action directe de la puissance divine.
    reason: cultural_note
  - marker: b
    text: 'Ou : « le cœur de Pharaon devint ferme ». L’hébreu ne précise pas ici qui provoque cet endurcissement.'
    reason: lexical_alternative
  - marker: c
    text: Yahweh représente le nom divin YHWH, traditionnellement rendu par « le Seigneur ».
    reason: alternative_reading
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: les magiciens
  rationale: Le terme désigne les spécialistes rituels et occultes de Pharaon. « Magiciens » est clair, courant et suffisamment large sans préciser davantage leur fonction.
- source_word: אֶצְבַּע אֱלֹהִים הִוא
  choice: C’est le doigt de Dieu
  rationale: 'Cette formulation naturelle en français conserve l’image hébraïque et sa force : les magiciens reconnaissent l’intervention directe d’une puissance divine.'
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce récit de confrontation avec le Dieu d’Israël, le singulier défini « Dieu » est la lecture contextuelle la plus naturelle, même si le mot peut avoir d’autres valeurs dans d’autres contextes.
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: le cœur de Pharaon s’endurcit
  rationale: Le verbe exprime ici que le cœur devient ferme ou obstiné. La tournure pronominale française décrit le résultat sans attribuer explicitement l’endurcissement à Dieu ou à Pharaon.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: et il ne les écouta pas
  rationale: « Écouter » rend clairement שׁמע avec אֶל et peut inclure l’idée de ne pas tenir compte de leurs paroles.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: comme Yahweh l’avait dit
  rationale: Le plus-que-parfait marque naturellement que la parole divine précédait cet accomplissement; « dit » reste simple et fidèle à la formule narrative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de le remplacer par le titre traditionnel « le Seigneur ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel révélé dans le récit biblique.
- issue: Agent de l’endurcissement du cœur de Pharaon
  choice: le cœur de Pharaon s’endurcit
  alternative: Pharaon endurcit son cœur; le cœur de Pharaon fut endurci
  rationale: L’hébreu ne nomme aucun agent dans cette proposition. La formulation choisie préserve cette indétermination et la tension théologique du récit.
- issue: Sens de אֱלֹהִים dans la déclaration des magiciens
  choice: Dieu
  alternative: un dieu; les dieux
  rationale: La forme peut être ambiguë en elle-même, mais le contexte immédiat de la confrontation désigne le plus naturellement le Dieu à l’œuvre par Moïse et Aaron.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe narrative reste simple; l’image du « doigt de Dieu » et l’indétermination concernant l’endurcissement sont conservées.
