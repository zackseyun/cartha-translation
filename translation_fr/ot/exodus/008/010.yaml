  text: And they piled them up in heap after heap[a], and the land stank.
translation:
  language: fr
  text: Ils les entassèrent tas après tas[a], et le pays empesta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en nombreux tas » ou « tas sur tas » ; l’hébreu répète le nom pour insister.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבְּרוּ
  choice: Ils les entassèrent
  rationale: Le verbe צבר décrit l’action de rassembler en amas. « Entassèrent » exprime directement et naturellement cette action concrète en français.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom objet renvoie aux grenouilles mentionnées dans le contexte immédiat.
- source_word: חֳמָרִם חֳמָרִם
  choice: en tas et en tas
  rationale: La répétition du nom חֹמֶר souligne la multiplicité des amas. La formulation conserve cette répétition marquée, tout en restant compréhensible en français.
- source_word: וַתִּבְאַשׁ
  choice: se mit à sentir mauvais
  rationale: Le verbe באש signifie dégager une mauvaise odeur, puer. Cette tournure actuelle et directe rend le résultat de l’amoncellement sans registre inutilement familier.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans le récit des plaies, אֶרֶץ désigne ici le territoire touché, c’est-à-dire le pays, et non la terre entière.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Entassèrent » garde le caractère concret de l’action ; « se mit à sentir mauvais » restitue la force du verbe sans adopter une expression trop familière. La répétition inhabituelle « en tas et en tas » reflète volontairement celle de l’hébreu et est éclairée par la note.
