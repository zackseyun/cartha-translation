  text: וּ/מֹשֶׁ֣ה וְ/אַהֲרֹ֗ן עָשׂ֛וּ אֶת כָּל הַ/מֹּפְתִ֥ים הָ/אֵ֖לֶּה לִ/פְנֵ֣י פַרְעֹ֑ה וַ/יְחַזֵּ֤ק יְהוָה֙ אֶת לֵ֣ב פַּרְעֹ֔ה וְ/לֹֽא שִׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/010.yaml
  text: And Moses and Aaron did all these signs before Pharaoh[a], and Yahweh hardened Pharaoh’s heart[c][b], and he did not let the sons of Israel go out from his land.
translation:
  language: fr
  text: Et Moïse et Aaron accomplirent tous ces signes[a] devant Pharaon, et Yahvé endurcit le cœur de Pharaon[b], et celui-ci ne laissa pas les fils d’Israël[c] quitter son pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ces prodiges ». Le terme hébreu peut désigner des signes miraculeux ou des prodiges.
    reason: lexical_alternative
  - marker: b
    text: Ou « affermit le cœur de Pharaon » ou « rendit ferme le cœur de Pharaon ». Le verbe hébreu évoque le fait de rendre fort ou ferme.
    reason: lexical_alternative
  - marker: c
    text: 'Ou « les Israélites » ou « les enfants d’Israël ». Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Moïse et Aaron
  rationale: Formes françaises usuelles de ces noms propres bibliques.
- source_word: עָשׂוּ
  choice: accomplirent
  rationale: Le verbe עשה signifie largement « faire » ou « accomplir ». Avec des signes miraculeux, « accomplirent » est naturel en français tout en restant proche du texte.
- source_word: כָּל הַמֹּפְתִים הָאֵלֶּה
  choice: tous ces signes
  rationale: מוֹפֵת peut désigner un signe miraculeux ou un prodige. « Signes » conserve ici la fonction démonstrative de ces actes devant Pharaon; « prodiges » reste une possibilité réelle.
- source_word: לִפְנֵי פַרְעֹה
  choice: devant Pharaon
  rationale: Rendu direct et idiomatique de l’expression hébraïque, qui signifie aussi « en présence de Pharaon ».
- source_word: וַיְחַזֵּק
  choice: endurcit
  rationale: חזק évoque fondamentalement le fait de rendre fort ou ferme. Dans la formule narrative concernant le cœur de Pharaon, « endurcit » exprime naturellement en français son obstination confirmée, sans effacer les autres nuances lexicales.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, préférable ici à la substitution par un titre.
- source_word: לֵב פַּרְעֹה
  choice: le cœur de Pharaon
  rationale: Rendu direct de la construction hébraïque et expression naturelle en français biblique moderne.
- source_word: שִׁלַּח
  choice: ne laissa pas … quitter
  rationale: Dans le contexte de l’Exode, שלח signifie que Pharaon refuse de laisser partir ou de renvoyer Israël. La formulation choisie rend clairement cette permission refusée.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Rendu littéral de l’expression hébraïque, employée collectivement pour le peuple d’Israël; l’alternative plus courante « les Israélites » est signalée en note.
- source_word: מֵאַרְצוֹ
  choice: quitter son pays
  rationale: La préposition מן marque le point de départ et אֶרֶץ désigne ici le pays soumis à Pharaon. Avec « quitter », le mouvement hors du pays est exprimé naturellement.
theological_decisions:
- issue: Action de Yahvé sur le cœur de Pharaon
  choice: Yahvé endurcit le cœur de Pharaon
  alternative: Yahvé affermit le cœur de Pharaon / rendit ferme le cœur de Pharaon
  rationale: « Endurcit » communique le sens contextuel d’une résistance rendue ferme, tandis que la note conserve l’image lexicale de la force ou de la fermeté. Le texte maintient ainsi, sans l’expliquer ni l’atténuer, la tension entre l’action divine et le refus de Pharaon.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / les enfants d’Israël
  rationale: La formulation littérale préserve la texture du texte source, tout en indiquant par la note que l’expression désigne collectivement le peuple d’Israël.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique écrit. La syntaxe reste fluide sans gommer les répétitions ni la tension théologique de l’hébreu.
