  text: וְ/הָֽיְתָ֛ה צְעָקָ֥ה גְדֹלָ֖ה בְּ/כָל אֶ֣רֶץ מִצְרָ֑יִם אֲשֶׁ֤ר כָּמֹ֨/הוּ֙ לֹ֣א נִהְיָ֔תָה וְ/כָמֹ֖/הוּ לֹ֥א תֹסִֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/006.yaml
  text: And there will be a great cry throughout all the land of Egypt[a], such as has never happened before, nor will ever happen again.
translation:
  language: fr
  text: Il y aura un grand cri[a] dans tout le pays d’Égypte, tel qu’il n’y en a jamais eu et qu’il n’y en aura plus jamais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une grande clameur » ou « de grands gémissements ». Le mot hébreu צְעָקָה peut désigner un cri puissant poussé dans la détresse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Il y aura
  rationale: Le parfait qal précédé de la conjonction a ici une valeur future dans cette annonce prophétique. « Il y aura » rend cette valeur de façon naturelle et directe.
- source_word: צְעָקָה גְדֹלָה
  choice: un grand cri
  rationale: צְעָקָה désigne un cri puissant, notamment un cri de détresse, et גְדֹלָה en souligne l’ampleur. « Un grand cri » conserve l’expression hébraïque sans préciser plus que le texte la nature exacte des lamentations.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: dans tout le pays d’Égypte
  rationale: Cette formulation exprime clairement l’étendue du cri à l’ensemble du territoire égyptien.
- source_word: אֲשֶׁר כָּמֹהוּ לֹא נִהְיָתָה
  choice: tel qu’il n’y en a jamais eu
  rationale: La tournure française avec « il y en a eu » rend naturellement la comparaison absolue avec tout ce qui a précédé, tout en gardant le cri comme référent.
- source_word: וְכָמֹהוּ לֹא תֹסִף
  choice: et qu’il n’y en aura plus jamais
  rationale: Sous la négation, יסף exprime ici la non-répétition. « Plus jamais » restitue la portée absolue de l’énoncé.
