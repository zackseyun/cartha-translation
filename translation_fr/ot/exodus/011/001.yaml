source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה ע֣וֹד נֶ֤גַע אֶחָד֙ אָבִ֤יא עַל פַּרְעֹה֙ וְ/עַל מִצְרַ֔יִם אַֽחֲרֵי כֵ֕ן יְשַׁלַּ֥ח אֶתְ/כֶ֖ם מִ/זֶּ֑ה כְּ/שַׁ֨לְּח֔/וֹ כָּלָ֕ה גָּרֵ֛שׁ יְגָרֵ֥שׁ אֶתְ/כֶ֖ם מִ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/001.yaml
  text: Then Yahweh said to Moses[a], “One more plague I will bring upon Pharaoh and upon Egypt. After that he will send you away from here. When he sends you away[b], he will surely drive you out completely from here.”
translation:
  language: fr
  text: 'Puis Yahweh dit à Moïse : « Je ferai venir un fléau[a] de plus sur le pharaon et sur l’Égypte. Après cela, il vous laissera partir d’ici. Quand il vous laissera partir, il vous expulsera complètement d’ici[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « coup », « plaie », « atteinte » ou « affliction ».
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu exprime avec force l’expulsion totale ; littéralement : « en vous chassant, il vous chassera ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu, au lieu de lui substituer un titre.
- source_word: וַיֹּאמֶר
  choice: Puis … dit
  rationale: Le waw consécutif fait progresser le récit ; « Puis » en rend naturellement la valeur séquentielle.
- source_word: עוֹד נֶגַע אֶחָד
  choice: encore … un fléau
  rationale: עוֹד exprime ici l’ajout d’un dernier fléau. La tournure française conserve séparément l’idée de « encore » et le singulier « un ».
- source_word: נֶגַע
  choice: fléau
  rationale: Dans le contexte des jugements frappant l’Égypte, « fléau » est clair et traditionnel, tout en laissant en note les sens plus généraux du nom.
- source_word: אָבִיא עַל
  choice: je vais … faire venir … sur
  rationale: Le hiphil de בוא signifie « faire venir » ; le futur proche convient à l’imminence de l’annonce et « sur » reflète עַל.
- source_word: פַּרְעֹה
  choice: le pharaon
  rationale: En français moderne, l’article convient naturellement au titre du souverain égyptien.
- source_word: יְשַׁלַּח אֶתְכֶם מִזֶּה
  choice: il vous laissera partir d’ici
  rationale: Dans ce contexte, שׁלח désigne l’autorisation de partir, tandis que la proposition suivante renforce ensuite l’idée d’expulsion.
- source_word: כְּשַׁלְּחוֹ
  choice: Quand il vous laissera partir
  rationale: Le préfixe כְּ a ici une valeur temporelle ; la répétition de « laisser partir » maintient le lien avec la proposition précédente.
- source_word: כָּלָה
  choice: pour de bon
  rationale: Employé adverbialement, le terme marque le caractère total ou définitif du départ. « Pour de bon » est naturel et conserve cette force.
- source_word: גָּרֵשׁ יְגָרֵשׁ
  choice: il vous chassera bel et bien
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’affirmation. « Bel et bien » restitue cette insistance sans reproduire artificiellement la répétition hébraïque.
- source_word: מִזֶּה
  choice: d’ici
  rationale: Cette expression déictique renvoie au lieu où se trouvent les Israélites, c’est-à-dire l’Égypte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » en conserve la fonction de nom propre sans le remplacer par un titre.
- issue: Force de l’expulsion annoncée
  choice: « pour de bon » et « bel et bien »
  alternative: « entièrement » et « il vous chassera certainement »
  rationale: Le rendu garde à la fois la totalité exprimée par כָּלָה et l’emphase grammaticale de גָּרֵשׁ יְגָרֵשׁ, sans transformer cette insistance en affirmation doctrinale supplémentaire.
translation_notes:
  register: Français international actuel, naturel et digne. Le futur proche souligne l’imminence du dernier fléau ; « laisser partir » puis « chasser » conserve la progression du texte, de l’autorisation au départ forcé. Tous les marqueurs de note figurent dans le texte.
