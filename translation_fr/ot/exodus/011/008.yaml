  text: וְ/יָרְד֣וּ כָל עֲבָדֶי/ךָ֩ אֵ֨לֶּה אֵלַ֜/י וְ/הִשְׁתַּֽחֲוּוּ לִ֣/י לֵ/אמֹ֗ר צֵ֤א אַתָּה֙ וְ/כָל הָ/עָ֣ם אֲשֶׁר בְּ/רַגְלֶ֔י/ךָ וְ/אַחֲרֵי כֵ֖ן אֵצֵ֑א וַ/יֵּצֵ֥א מֵֽ/עִם פַּרְעֹ֖ה בָּ/חֳרִי אָֽף־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/008.yaml
  text: Then all these servants of yours will come down to me and bow down to me[a], saying, ‘Go out[b], you and all the people who are at your feet,’ and after that I will go out.” And he went out from Pharaoh in burning anger.
translation:
  language: fr
  text: 'Alors tous tes serviteurs que voici descendront vers moi et se prosterneront devant moi en disant : « Sors, toi et tout le peuple qui marche à ta suite[a] ! » Après cela, je sortirai. Puis Moïse sortit de chez Pharaon dans une ardente colère.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui est à tes pieds » ; expression désignant ceux qui accompagnent ou suivent quelqu’un.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרְדוּ
  choice: descendront vers moi
  rationale: Préserve l’image directionnelle de ירד et le point de vue de Moïse, tout en restant naturel en français.
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: עבד peut désigner des serviteurs, des sujets ou des dignitaires de cour. « Serviteurs » conserve le terme général sans imposer une fonction administrative précise.
- source_word: וְהִשְׁתַּחֲוּוּ לִי
  choice: se prosterneront devant moi
  rationale: Rend clairement le geste physique de שׁחה dans ce contexte de soumission à la cour, sans lui donner nécessairement un sens cultuel.
- source_word: צֵא אַתָּה
  choice: Sors, toi
  rationale: Conserve le verbe ordinaire יצא, important dans le récit de la sortie d’Égypte, ainsi que l’emphase du pronom אַתָּה.
- source_word: וְכָל הָעָם אֲשֶׁר בְּרַגְלֶיךָ
  choice: et tout le peuple qui marche à ta suite
  rationale: Exprime naturellement l’idiome littéral « qui est à tes pieds », désignant ceux qui accompagnent ou suivent Moïse.
- source_word: וְאַחֲרֵי כֵן אֵצֵא
  choice: Après cela, je sortirai
  rationale: Respecte la succession temporelle et maintient la cohérence lexicale de יצא.
- source_word: וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: Puis Moïse sortit de chez Pharaon
  rationale: Le sujet implicite est Moïse. Le nom explicite évite en français une ambiguïté référentielle, tandis que « de chez Pharaon » rend naturellement מֵעִם פַּרְעֹה.
- source_word: בָּחֳרִי אָף
  choice: dans une ardente colère
  rationale: Conserve la métaphore de la chaleur et l’intensité de la colère exprimées par חֳרִי אָף.
theological_decisions:
- issue: Nature de la prosternation devant Moïse
  choice: se prosterneront devant moi
  alternative: me rendront hommage
  rationale: Le texte décrit un geste de soumission sans préciser qu’il s’agit d’adoration; la traduction préserve cette ouverture contextuelle.
translation_notes:
  register: Français moderne, international et digne. La formulation garde l’emphase de « toi », l’image de la descente et celle de la colère ardente, tout en explicitant Moïse comme sujet de la dernière proposition pour assurer la clarté.
