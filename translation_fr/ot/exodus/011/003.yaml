revisions:
- from: Yahweh fit trouver grâce au peuple aux yeux des Égyptiens.[a] De plus, l’homme Moïse[d] était très grand dans le pays d’Égypte, aux yeux des serviteurs de Pharaon[b] et aux yeux du peuple.[c]
  to: Yahweh fit trouver grâce au peuple auprès des Égyptiens.[a] De plus, l’homme Moïse[d] était très grand dans le pays d’Égypte, aux yeux des serviteurs de Pharaon[b] et aux yeux du peuple.[c]
  rationale: 'La révision se limite à la première expression : « auprès des Égyptiens » élimine une ambiguïté de syntaxe française tout en rendant fidèlement l’idée de faveur dont le peuple bénéficie de la part des Égyptiens. La note correspondante est ajustée afin de décrire exactement le rapport entre l’idiome hébreu littéral et sa restitution française.'
