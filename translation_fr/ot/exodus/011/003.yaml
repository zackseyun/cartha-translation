  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּתֵּ֧ן יְהוָ֛ה אֶת חֵ֥ן הָ/עָ֖ם בְּ/עֵינֵ֣י מִצְרָ֑יִם גַּ֣ם הָ/אִ֣ישׁ מֹשֶׁ֗ה גָּד֤וֹל מְאֹד֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/עֵינֵ֥י עַבְדֵֽי פַרְעֹ֖ה וּ/בְ/עֵינֵ֥י הָ/עָֽם־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/003.yaml
  text: And Yahweh gave the people favor in the sight of the Egyptians[a]. Moreover, the man Moses was very great in the land of Egypt[d][c][b], in the sight of Pharaoh’s servants and in the sight of the people.
translation:
  language: fr
  text: Yahweh fit trouver grâce au peuple auprès des Égyptiens.[a] De plus, l’homme Moïse[d] était très grand dans le pays d’Égypte, aux yeux des serviteurs de Pharaon[b] et aux yeux du peuple.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux yeux des Égyptiens ».'
    reason: La note signale l’image de l’idiome hébreu, rendue idiomatiquement dans le texte français par « auprès des Égyptiens ».
  - marker: b
    text: 'Ou : « des fonctionnaires de Pharaon » ; l’hébreu dit littéralement « des serviteurs de Pharaon ».'
    reason: Dans le cadre de la cour royale, le terme peut désigner des fonctionnaires, mais la traduction principale garde son sens lexical direct.
  - marker: c
    text: Ici, « le peuple » désigne probablement l’ensemble de la population égyptienne, par contraste avec les serviteurs de Pharaon.
    reason: La note éclaire le référent probable sans remplacer la formulation non précisée de l’hébreu.
  - marker: d
    text: 'Ou, dans un français plus naturel : « Moïse lui-même » ; l’hébreu porte littéralement « l’homme Moïse ».'
    reason: La note explique la tournure hébraïque marquée et fournit son équivalent idiomatique possible.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu et à la pratique du projet.
- source_word: וַיִּתֵּן ... חֵן
  choice: fit trouver grâce
  rationale: Cette tournure française naturelle exprime l’idée de recevoir un accueil favorable, sans donner ici à « grâce » un sens théologique spécialisé.
- source_word: הָעָם
  choice: le peuple
  rationale: Le contexte désigne le peuple d’Israël, mais l’hébreu dit simplement « le peuple » ; la traduction conserve cette formulation.
- source_word: בְּעֵינֵי מִצְרָיִם
  choice: aux yeux des Égyptiens
  rationale: La traduction conserve l’image de l’expression idiomatique hébraïque tout en restant courante en français.
- source_word: גַּם
  choice: De plus
  rationale: Cette expression rend la fonction additive et légèrement emphatique de גַּם au début de la seconde affirmation.
- source_word: הָאִישׁ מֹשֶׁה
  choice: l’homme Moïse
  rationale: La formulation marquée de l’hébreu est conservée afin de ne pas effacer l’accent porté sur la personne de Moïse.
- source_word: גָּדוֹל מְאֹד
  choice: très grand
  rationale: Cette traduction garde volontairement l’étendue de sens de l’hébreu, qui peut évoquer le rang, l’importance, l’influence ou l’estime, sans choisir arbitrairement entre ces nuances.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: dans le pays d’Égypte
  rationale: La formulation explicite de l’hébreu est conservée plutôt que réduite à « en Égypte ».
- source_word: בְּעֵינֵי עַבְדֵי פַרְעֹה
  choice: aux yeux des serviteurs de Pharaon
  rationale: « Serviteurs » rend directement עֲבָדִים, même si, dans le contexte de la cour, ces personnes peuvent être des hauts fonctionnaires.
- source_word: וּבְעֵינֵי הָעָם
  choice: et aux yeux du peuple
  rationale: L’hébreu répète « le peuple ». La traduction ne précise pas « les Égyptiens » ni « la population », bien que le contexte puisse orienter vers ce sens.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: La translittération préserve le nom personnel présent dans le texte hébreu, sans lui substituer un titre ni adopter une autre forme traditionnelle.
translation_notes:
  register: Français international moderne, digne et lisible. La structure répétitive « aux yeux de » et l’expression inhabituelle « l’homme Moïse » sont maintenues pour préserver l’accent et la perspective du texte hébreu. « Très grand » reste délibérément large afin de ne pas réduire la grandeur de Moïse à la seule réputation, au rang politique ou au prestige.
