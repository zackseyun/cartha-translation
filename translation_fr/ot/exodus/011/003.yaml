    rationale: « Faire trouver grâce à quelqu’un aux yeux de quelqu’un » n’est pas impossible, mais l’enchaînement « au peuple aux yeux » est lourd et peut momentanément faire lire « aux yeux » comme qualifiant le peuple. « Auprès des Égyptiens » est l’expression française idiomatique correspondante.
  - severity: low
    issue: La justification de la note a affirme que l’image est conservée dans le texte
    rationale: Après la formulation française naturelle « auprès des Égyptiens », l’image littérale des « yeux » n’est plus dans le texte principal ; la note doit donc la présenter comme une littéralité de l’hébreu, non comme une image conservée.
