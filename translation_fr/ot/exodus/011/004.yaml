base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/004.yaml
  text: 'Then Moses said[a], “Thus says Yahweh: About midnight I will go out into the midst of Egypt.”'
translation:
  language: fr
  text: 'Alors Moïse dit : « Voici ce que dit Yahweh : Vers minuit[a], je m’avancerai au milieu de l’Égypte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « À minuit ». Le préfixe hébreu peut exprimer l’approximation, d’où « Vers minuit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » en restitue naturellement la succession en français moderne.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Formulation française naturelle de la formule de messager prophétique, tout en conservant son caractère solennel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française usuelle du nom divin, qui préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: כַּחֲצֹת הַלַּיְלָה
  choice: Vers minuit
  rationale: Le préfixe כ peut exprimer l’approximation ; « vers minuit » rend cette nuance en français idiomatique.
- source_word: אֲנִי
  choice: je
  rationale: Le pronom hébreu explicite souligne le sujet divin ; le français l’exprime nécessairement avec le verbe.
- source_word: יוֹצֵא
  choice: sortirai
  rationale: Le participe a ici une valeur imminente ou future dans l’annonce divine ; le futur simple est clair et naturel.
- source_word: בְּתוֹךְ
  choice: au milieu de
  rationale: Avec le verbe de mouvement « sortir », l’expression indique l’entrée et l’action au cœur de l’Égypte sans imposer la nuance moins naturelle de « dans l’intérieur de ».
- source_word: מִצְרָיִם
  choice: l’Égypte
  rationale: Forme française standard du nom de lieu, avec l’article requis par l’usage.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme ; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Nuance temporelle de כַּחֲצֹת הַלַּיְלָה
  choice: Vers minuit
  alternative: À minuit
  rationale: Le כ préfixé permet une lecture approximative. Le texte principal conserve cette nuance, tandis que la note signale la lecture ponctuelle possible.
translation_notes:
  register: Français international moderne, clair et digne. La formule « Voici ce que dit Yahweh » garde la solennité prophétique sans archaïsme marqué. Ponctuation typographique française appliquée au discours direct.
