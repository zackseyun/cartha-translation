  text: דַּבֶּר נָ֖א בְּ/אָזְנֵ֣י הָ/עָ֑ם וְ/יִשְׁאֲל֞וּ אִ֣ישׁ מֵ/אֵ֣ת רֵעֵ֗/הוּ וְ/אִשָּׁה֙ מֵ/אֵ֣ת רְעוּתָ֔/הּ כְּלֵי כֶ֖סֶף וּ/כְלֵ֥י זָהָֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/002.yaml
  text: Speak now in the hearing of the people[a], and let each man ask from his neighbor, and each woman from her neighbor, for articles of silver and articles of gold.
translation:
  language: fr
  text: 'Parle donc au peuple : que chaque homme demande à son voisin, et chaque femme à sa voisine, des objets en argent et des objets en or.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « emprunte ». Le verbe hébreu signifie « demander » ou « solliciter » et ne précise pas, à lui seul, que les objets devaient être rendus.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֶּר נָא
  choice: Dis donc
  rationale: L’impératif « dis » rend directement דַּבֶּר. Ici, « donc » donne à נָא une valeur d’incitation et d’immédiateté sans faire parler Dieu sur un ton excessivement déférent.
- source_word: בְּאָזְנֵי הָעָם
  choice: au peuple
  rationale: L’expression signifie littéralement « aux oreilles du peuple », c’est-à-dire de façon qu’il entende. En français courant, « dire au peuple » exprime naturellement cette destination auditive sans calque pesant.
- source_word: וְיִשְׁאֲלוּ
  choice: que ... demande
  rationale: L’imparfait à valeur jussive après l’impératif exprime une directive. « Que ... demande » en conserve la force. Le verbe שאל signifie demander ou solliciter et n’indique pas à lui seul une restitution ultérieure.
- source_word: אִישׁ מֵאֵת רֵעֵהוּ
  choice: chaque homme ... à son voisin
  rationale: Le singulier distributif masculin, mis en parallèle avec « chaque femme », est conservé. רֵעַ désigne ici un proche, un compagnon ou un voisin; « voisin » convient au contexte social.
- source_word: וְאִשָּׁה מֵאֵת רְעוּתָהּ
  choice: et chaque femme à sa voisine
  rationale: La forme féminine parallèle est rendue explicitement par « chaque femme » et « sa voisine », ce qui préserve la distinction grammaticale du texte hébreu.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: des objets en argent et des objets en or
  rationale: כְּלִי est un terme large pouvant désigner des objets, récipients, ustensiles ou articles. « Objets » évite de préciser sans fondement leur nature ou leur usage.
theological_decisions:
- issue: Sens de שאל dans le récit des biens obtenus des Égyptiens
  choice: demande
  alternative: emprunte
  rationale: Le verbe hébreu exprime la demande ou la sollicitation sans comporter intrinsèquement l’idée d’un prêt ni l’obligation de rendre. La traduction principale ne doit donc pas introduire cette précision interprétative; l’autre lecture est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe injonctive « Dis donc ... que » restitue l’enchaînement impératif-jussif sans lourdeur. Le parallélisme entre l’homme et la femme ainsi que la généralité des objets précieux sont conservés.
