source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה לֹא יִשְׁמַ֥ע אֲלֵי/כֶ֖ם פַּרְעֹ֑ה לְמַ֛עַן רְב֥וֹת מוֹפְתַ֖/י בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/009.yaml
  text: And Yahweh said to Moses[a], “Pharaoh will not listen to you[c][b], so that my wonders may be multiplied in the land of Egypt.”
translation:
  language: fr
  text: 'Yahweh dit[a] à Moïse : « Le pharaon ne vous écoutera pas[b], afin que mes prodiges[c] se multiplient dans le pays d’Égypte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Yahweh avait dit à Moïse ». Cette formulation relie explicitement la déclaration au récit précédent, mais la forme verbale hébraïque est le passé narratif ordinaire.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « ne vous prêtera pas attention » ou « ne vous obéira pas ». Le pronom « vous » est pluriel en hébreu et renvoie, dans le contexte, à Moïse et Aaron.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « mes signes ». Le terme hébreu peut désigner des prodiges, des signes ou des présages.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit « Yahweh » plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol est rendu par le passé simple narratif, qui fait naturellement progresser le récit. Le plus-que-parfait est possible selon la relation contextuelle, mais n’est pas imposé par la forme hébraïque.
- source_word: לֹא יִשְׁמַע אֲלֵיכֶם
  choice: ne vous écoutera pas
  rationale: Avec אֶל, שׁמע signifie ici écouter ou prêter attention. « Écouter » préserve l’implication d’un refus d’obtempérer sans expliciter davantage que le texte. « Vous » rend le suffixe pluriel, qui inclut Moïse et Aaron dans le contexte.
- source_word: לְמַעַן
  choice: afin que
  rationale: Cette locution française exprime clairement la visée ou le but marqué par לְמַעַן, tout en conservant la tension théologique du verset.
- source_word: רְבוֹת
  choice: se multiplient
  rationale: L’infinitif de רבה exprime l’accroissement en nombre. La tournure pronominale est naturelle en français et correspond au sens de « devenir nombreux ».
- source_word: מוֹפְתַי
  choice: mes prodiges
  rationale: מוֹפֵת peut désigner un prodige, un signe ou un présage. « Prodiges » convient au contexte des actes extraordinaires accomplis en Égypte et à l’idée de multiplication.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: dans le pays d’Égypte
  rationale: Cette formulation conserve explicitement אֶרֶץ, « pays », tout en restant idiomatique en français.
theological_decisions:
- issue: La finalité divine associée au refus du pharaon
  choice: « afin que mes prodiges se multiplient »
  alternative: « de sorte que mes prodiges se multiplieront », avec une nuance principalement consécutive
  rationale: לְמַעַן exprime le plus naturellement une finalité dans ce contexte. La traduction maintient ensemble le refus du pharaon et le dessein déclaré de Dieu, sans proposer une explication doctrinale supplémentaire du durcissement.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « Le pharaon » suit l’usage français courant du titre avec article. La phrase conserve la structure causale et la tension du texte hébreu sans l’aplanir.
