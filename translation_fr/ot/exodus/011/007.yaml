    rationale: Le לְ initial introduit ceux contre lesquels aucune menace canine ne sera dirigée; « parmi » décrit un lieu ou un groupe et ne restitue pas cette relation.
  - severity: medium
    issue: « remuera la langue »
    rationale: Le verbe חרץ signifie littéralement « aiguiser » dans cette expression. « Remuer » remplace l’image hébraïque par une action différente; l’équivalence idiomatique est à expliquer en note plutôt qu’à être ainsi modifiée dans le texte.
