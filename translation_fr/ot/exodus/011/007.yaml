  text: וּ/לְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל לֹ֤א יֶֽחֱרַץ כֶּ֨לֶב֙ לְשֹׁנ֔/וֹ לְ/מֵ/אִ֖ישׁ וְ/עַד בְּהֵמָ֑ה לְמַ֨עַן֙ תֵּֽדְע֔וּ/ן אֲשֶׁר֙ יַפְלֶ֣ה יְהוָ֔ה בֵּ֥ין מִצְרַ֖יִם וּ/בֵ֥ין יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/007.yaml
  text: But against any of the sons of Israel[a], not a dog will sharpen its tongue, from man to beast, so that you may know that Yahweh makes a distinction between Egypt and Israel.
translation:
  language: fr
  text: Mais contre aucun des Israélites, pas même un chien n’aiguisera sa langue[a], que ce soit contre un homme ou contre une bête, afin que vous sachiez que Yahweh établit une distinction entre l’Égypte et Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « n’aiguisera sa langue ». Cette expression signifie qu’aucun chien n’aboiera ni ne grognera contre eux; elle évoque la paix et la sécurité d’Israël.'
    reason: Explicitation d’un idiome hébreu dont l’image littérale est inhabituelle en français.
lexical_decisions:
- source_word: וּלְכֹל בְּנֵי יִשְׂרָאֵל
  choice: Mais parmi tous les Israélites
  rationale: La conjonction marque le contraste avec le malheur annoncé à l’Égypte. « Israélites » rend naturellement en français moderne l’expression hébraïque « fils d’Israël » sans en modifier la portée collective.
- source_word: לֹא יֶחֱרַץ כֶּלֶב לְשֹׁנוֹ
  choice: pas un chien ne remuera la langue
  rationale: Cette formulation conserve l’image concrète de la langue du chien tout en restant compréhensible en français. L’expression hébraïque évoque le fait d’aboyer ou de grogner; son sens idiomatique est précisé en note.
- source_word: לְמֵאִישׁ וְעַד בְּהֵמָה
  choice: ni contre un être humain ni contre une bête
  rationale: Le tour exprime une totalité englobant humains et animaux. Cette formulation française rend clairement la portée du complément sans restreindre אִישׁ aux seuls hommes de sexe masculin.
- source_word: לְמַעַן תֵּדְעוּן
  choice: afin que vous sachiez
  rationale: Rend directement la proposition de but et conserve le « vous » pluriel du verbe hébreu.
- source_word: יַפְלֶה
  choice: établit une distinction
  rationale: Dans ce contexte, le hifil de פלא désigne l’action de séparer ou de traiter différemment deux groupes, plutôt que l’accomplissement d’un prodige.
- source_word: בֵּין מִצְרַיִם וּבֵין יִשְׂרָאֵל
  choice: entre l’Égypte et Israël
  rationale: Les deux noms collectifs et nationaux sont conservés comme dans le texte hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme, nom propre du Dieu d’Israël. « Yahweh » le représente comme nom plutôt que de lui substituer un titre, tout en reconnaissant que sa vocalisation ancienne exacte n’est pas entièrement certaine.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde le contraste solennel entre l’Égypte et Israël, tout en évitant le calque peu naturel « fils d’Israël ». Le marqueur [a] figure dans le texte principal.
