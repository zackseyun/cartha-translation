language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/מֵ֣ת כָּל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכ֤וֹר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שִּׁפְחָ֔ה אֲשֶׁ֖ר אַחַ֣ר הָ/רֵחָ֑יִם וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/005.yaml
  text: And every firstborn in the land of Egypt will die[a], from the firstborn of Pharaoh, who sits on his throne, to the firstborn of the servant woman who is behind the millstones, and every firstborn of the livestock.
translation:
  language: fr
  text: Tous les premiers-nés du pays d’Égypte mourront, depuis le premier-né du pharaon qui siège sur son trône jusqu’au premier-né de la femme esclave[a] qui se tient derrière les meules, ainsi que tous les premiers-nés du bétail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la servante » ou « l’esclave ». Le mot hébreu désigne une femme de condition servile ; l’expression « derrière les meules » évoque le travail subalterne consistant à moudre le grain.
    reason: Alternative lexicale et précision historique concernant le statut social.
lexical_decisions:
- source_word: וּמֵת
  choice: mourront
  rationale: Le parfait qal avec conjonction appartient ici à une annonce prophétique certaine. Le futur français exprime naturellement l’événement à venir sans l’affaiblir.
- source_word: כָּל בְּכוֹר
  choice: tous les premiers-nés
  rationale: Le singulier distributif hébreu se rend naturellement en français par le pluriel « tous les premiers-nés », qui conserve la portée exhaustive.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: du pays d’Égypte
  rationale: Cette formulation conserve l’expression géographique explicite de l’hébreu dans un français biblique courant et compréhensible.
- source_word: מִבְּכוֹר ... עַד בְּכוֹר
  choice: depuis le premier-né ... jusqu’au premier-né
  rationale: La construction « depuis… jusqu’à… » rend l’étendue sociale complète visée, du rang le plus élevé au plus bas.
- source_word: פַּרְעֹה הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: du pharaon qui siège sur son trône
  rationale: La relative préserve la valeur durative du participe et présente le pharaon dans sa position royale.
- source_word: הַשִּׁפְחָה
  choice: la femme esclave
  rationale: Le terme désigne une femme de condition servile. « Femme esclave » rend explicitement ce statut et maintient le contraste social avec le pharaon, sans archaïsme.
- source_word: אַחַר הָרֵחָיִם
  choice: derrière les meules
  rationale: La traduction conserve l’image concrète du travail de mouture associé à une condition sociale très basse.
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: ainsi que tous les premiers-nés du bétail
  rationale: בְּהֵמָה désigne ici collectivement les animaux domestiques. « Bétail » est concis et naturel en français.
theological_decisions:
- issue: Rendu du terme de condition sociale שִׁפְחָה
  choice: la femme esclave
  alternative: la servante / la domestique
  rationale: Le contraste rhétorique s’étend de la maison royale à une femme asservie chargée d’un travail subalterne. Un vocabulaire explicite de l’esclavage évite d’atténuer la réalité sociale évoquée par l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la progression rhétorique du souverain à la femme asservie, ainsi que l’image concrète des meules. Le pluriel « tous les premiers-nés » est plus idiomatique en français que le singulier distributif hébreu.
