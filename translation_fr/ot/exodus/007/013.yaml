  variant: modern international French
source:
  edition: WLC
  text: וַ/יֶּחֱזַק֙ לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שָׁמַ֖ע אֲלֵ/הֶ֑ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/013.yaml
  text: But Pharaoh's heart was hardened[a], and he did not listen to them, just as Yahweh had spoken.
translation:
  language: fr
  text: Mais le cœur de Pharaon s’endurcit[a], et il ne les écouta pas, comme Yahweh l’avait dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le cœur de Pharaon devint dur ». Le verbe hébreu signifie plus littéralement « devenir fort, ferme » et exprime ici l’endurcissement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: s’endurcit
  rationale: Le qal imperfectif consécutif de חזק décrit ici le cœur qui devient ferme ou dur. « S’endurcit » est idiomatique en français et évite d’introduire un agent explicite absent de cette proposition.
- source_word: לֵב
  choice: cœur
  rationale: Rendu usuel de לֵב ; dans ce contexte, il désigne le siège de la volonté, de la pensée et de la détermination.
- source_word: פַּרְעֹה
  choice: Pharaon
  rationale: Forme française traditionnelle du titre royal égyptien.
- source_word: שָׁמַע אֲלֵהֶם
  choice: ne les écouta pas
  rationale: Avec la préposition אֶל, שׁמע signifie écouter quelqu’un ou tenir compte de ses paroles. Cette formulation est naturelle et claire en français moderne.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: Marque la correspondance entre l’attitude de Pharaon et la parole antérieure de Yahweh. « Comme » est fluide ici sans affaiblir ce rapport.
- source_word: דִּבֶּר
  choice: avait dit
  rationale: Le plus-que-parfait exprime l’antériorité de la parole divine dans le récit. « Avait dit » est naturel en français pour introduire une parole annoncée précédemment.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin, qui préserve son caractère de nom propre plutôt que de lui substituer un titre.
theological_decisions:
- issue: Agent de l’endurcissement du cœur de Pharaon
  choice: « le cœur de Pharaon s’endurcit » sans nommer d’agent extérieur
  alternative: « le cœur de Pharaon fut endurci » ou « Pharaon endurcit son cœur »
  rationale: La forme hébraïque présente ici le cœur comme devenant ferme ou dur, sans désigner explicitement l’agent. Le choix retenu préserve la tension du récit entre les passages où Pharaon s’endurcit et ceux où Dieu l’endurcit.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique écrit ; le plus-que-parfait marque naturellement la parole divine antérieure.
