  text: כִּי֩ יְדַבֵּ֨ר אֲלֵ/כֶ֤ם פַּרְעֹה֙ לֵ/אמֹ֔ר תְּנ֥וּ לָ/כֶ֖ם מוֹפֵ֑ת וְ/אָמַרְתָּ֣ אֶֽל אַהֲרֹ֗ן קַ֧ח אֶֽת מַטְּ/ךָ֛ וְ/הַשְׁלֵ֥ךְ לִ/פְנֵֽי פַרְעֹ֖ה יְהִ֥י לְ/תַנִּֽין־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/009.yaml
  text: When Pharaoh speaks to you[a], saying, ‘Produce a sign for yourselves,’ then you shall say to Aaron, ‘Take your staff and throw it down before Pharaoh; let it become a serpent.’
translation:
  language: fr
  text: 'Quand Pharaon vous dira : « Produisez un prodige », tu diras alors à Aaron : « Prends ton bâton et jette-le devant Pharaon : qu’il devienne un serpent[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu tannîn peut désigner, selon le contexte, un serpent, un grand animal marin ou une créature comparable à un dragon.
    reason: alternative lexicale
lexical_decisions:
- source_word: כִּי
  choice: Quand
  rationale: Dans ce contexte d’instructions anticipées, la conjonction introduit une circonstance future attendue plutôt qu’une cause.
- source_word: יְדַבֵּר אֲלֵיכֶם
  choice: vous dira
  rationale: L’imparfait hébreu décrit ici la prise de parole future du pharaon; le futur français convient naturellement après « quand ». Le pluriel « vous » désigne Moïse et Aaron.
- source_word: תְּנוּ לָכֶם מוֹפֵת
  choice: Produisez un signe
  rationale: Littéralement « donnez pour vous un signe ». « Produisez un signe » rend naturellement la demande d’un acte probant, sans expliciter davantage la fonction du signe. Le datif לָכֶם accompagne ici la demande adressée aux deux hommes et ne se transpose pas naturellement par « pour vous-mêmes » en français.
- source_word: וְאָמַרְתָּ אֶל־אַהֲרֹן
  choice: tu diras à Aaron
  rationale: Le singulier s’adresse à Moïse et le futur français restitue l’enchaînement prévu par l’instruction.
- source_word: מַטְּךָ
  choice: ton bâton
  rationale: « Bâton » est le terme courant et digne pour l’objet porté par Aaron; « verge » serait archaïque et « sceptre » trop spécialisé.
- source_word: וְהַשְׁלֵךְ
  choice: jette-le
  rationale: Le verbe exprime l’action de lancer ou jeter. Le pronom reprend explicitement le bâton en français.
- source_word: לִפְנֵי פַרְעֹה
  choice: devant le pharaon
  rationale: Cette formulation rend directement la position et la présence officielle indiquées par l’hébreu.
- source_word: יְהִי
  choice: qu’il devienne
  rationale: Le subjonctif à valeur injonctive préserve le jussif hébreu, qui exprime le résultat voulu plutôt qu’une simple prédiction.
- source_word: תַנִּין
  choice: serpent
  rationale: Dans la scène du bâton transformé, « serpent » convient au référent reptilien, tout en conservant dans une note la portée plus large du terme hébreu.
theological_decisions:
- issue: Portée de תַנִּין dans le signe accompli devant le pharaon
  choice: serpent
  alternative: grand reptile, créature comparable à un dragon, ou grand animal marin selon le contexte
  rationale: Le terme a une portée plus large que le mot hébreu courant pour « serpent ». Le contexte immédiat favorise ici une créature serpentiforme, mais la note préserve l’ambiguïté lexicale sans imposer une lecture mythologique ni l’exclure du champ sémantique général.
translation_notes:
  register: 'Français international moderne, direct et digne. L’alternance entre « vous » et « tu » est intentionnelle : le pharaon s’adresse à Moïse et Aaron, tandis que Dieu donne ensuite à Moïse l’ordre de parler à Aaron. Le marqueur de note est placé après « serpent », le mot auquel la note se rapporte.'
