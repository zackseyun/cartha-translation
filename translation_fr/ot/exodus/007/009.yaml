  source_fidelity: 'Le sens général est fidèle, y compris l’alternance intentionnelle du pluriel (« vous » : Moïse et Aaron) et du singulier (« tu » : Moïse). Toutefois, מוֹפֵת désigne plus précisément un prodige, un signe extraordinaire ou un présage qu’un simple « signe » ; « prodige » rend mieux sa portée dans cette demande de démonstration. L’ajout d’« alors » rend explicitement la progression de l’instruction introduite par le waw consécutif.'
  naturalness: La formulation révisée demeure directe et idiomatique en français international moderne. « Pharaon » avec une majuscule correspond à l’usage français courant dans le récit biblique, où le titre fonctionne comme désignation du personnage.
  terminology: « Prodige » est préférable ici pour מוֹפֵת. « Serpent » demeure un choix contextuellement justifié pour תַנִּין, à condition de conserver la note qui signale l’étendue lexicale du terme. « Bâton » convient pour מַטֶּה.
