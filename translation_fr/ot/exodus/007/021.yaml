base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/021.yaml
  text: And the fish in the Nile died[a], and the Nile stank, so that the Egyptians could not drink water from the Nile. And there was blood throughout all the land of Egypt.
translation:
  language: fr
  text: Les poissons qui étaient dans le Nil[a] moururent, et le Nil devint malodorant. Les Égyptiens ne purent pas boire l’eau du Nil, et il y eut du sang dans tout le pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu יְאֹר signifie littéralement « fleuve », mais, dans l’Exode, il désigne précisément le Nil.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּגָה
  choice: les poissons
  rationale: Le nom désigne collectivement les poissons du fleuve. « Les poissons » est naturel en français et n’élargit pas indûment le sens à toute la vie aquatique.
- source_word: יְאֹר
  choice: le Nil
  rationale: Bien que le terme signifie littéralement « fleuve », il désigne ici précisément le Nil; nommer le fleuve rend le référent immédiatement clair.
- source_word: מֵתָה
  choice: moururent
  rationale: Le passé simple convient à la succession narrative et rend directement le verbe « mourir ».
- source_word: וַיִּבְאַשׁ
  choice: se mit à sentir mauvais
  rationale: Cette formulation actuelle exprime clairement que le fleuve devint malodorant, sans ajouter une cause non précisée par le texte.
- source_word: וְלֹא יָכְלוּ
  choice: ne purent pas
  rationale: Rend directement l’incapacité exprimée par le verbe hébreu dans un récit au passé simple.
- source_word: לִשְׁתּוֹת מַיִם מִן הַיְאֹר
  choice: boire l’eau du Nil
  rationale: Conserve explicitement l’acte de boire, l’eau comme objet et le Nil comme provenance, dans une tournure française naturelle.
- source_word: וַיְהִי הַדָּם
  choice: il y eut du sang
  rationale: La tournure existentielle française correspond naturellement à וַיְהִי dans ce contexte narratif.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: dans tout le pays d’Égypte
  rationale: Rend l’étendue générale indiquée par בְּכָל dans une formulation française claire et idiomatique.
