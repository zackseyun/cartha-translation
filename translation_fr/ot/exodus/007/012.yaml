  text: And each man threw down his staff[a], and they became serpents; but Aaron’s staff swallowed up their staffs.
translation:
  language: fr
  text: Chacun jeta son bâton, et les bâtons devinrent des serpents[a]. Mais le bâton d’Aaron engloutit leurs bâtons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « grands reptiles » ou « dragons » : le mot hébreu tannin peut désigner une créature serpentiforme dans un sens plus large que le terme habituel pour « serpent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁלִיכוּ
  choice: jeta
  rationale: Le verbe שׁלך désigne ici l’action de lancer ou jeter l’objet à terre; « jeta » est naturel en français et le contexte rend la direction évidente.
- source_word: אִישׁ
  choice: chacun
  rationale: Employé distributivement avec le suffixe singulier, אִישׁ indique que chaque individu agit avec son propre bâton; « chacun » restitue clairement cette valeur sans alourdir la phrase.
- source_word: מַטֵּהוּ / מַטֵּה / מַטֹּתָם
  choice: son bâton / le bâton / leurs bâtons
  rationale: מַטֶּה peut désigner un bâton ou une verge. « Bâton » est concret, naturel en français contemporain et permet de conserver les distinctions de nombre et de possession.
- source_word: וַיִּהְיוּ
  choice: devinrent
  rationale: היה exprime ici le résultat d’une transformation; « devinrent » en rend directement le sens.
- source_word: לְתַנִּינִם
  choice: des serpents
  rationale: תַּנִּין peut désigner diverses grandes créatures reptiliennes ou serpentiformes. Dans ce récit, « serpents » est la formulation française la plus claire, tandis qu’une note préserve l’étendue lexicale du terme.
- source_word: וַיִּבְלַע
  choice: engloutit
  rationale: בלע signifie avaler ou engloutir. « Engloutit » exprime naturellement l’absorption complète et convient au registre narratif.
- source_word: אֶת
  choice: '[marque de l’objet direct non traduite]'
  rationale: אֶת marque en hébreu l’objet direct défini et n’a pas d’équivalent lexical autonome en français.
