  text: וַ/יַּחְפְּר֧וּ כָל מִצְרַ֛יִם סְבִיבֹ֥ת הַ/יְאֹ֖ר מַ֣יִם לִ/שְׁתּ֑וֹת כִּ֣י לֹ֤א יָֽכְלוּ֙ לִ/שְׁתֹּ֔ת מִ/מֵּימֵ֖י הַ/יְאֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/024.yaml
  text: And all the Egyptians dug around the Nile for water to drink[a], because they could not drink from the water of the Nile.
translation:
  language: fr
  text: Tous les Égyptiens creusèrent aux alentours du Nil[a] afin d’avoir de l’eau à boire, car ils ne pouvaient pas boire l’eau du Nil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit « le fleuve » (ye’or) ; dans l’Exode, ce terme désigne spécifiquement le Nil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: creusèrent
  rationale: Le verbe חפר signifie « creuser » ou « excaver ». « Creusèrent » rend directement l’action sans ajouter l’idée explicite de puits, absente de l’hébreu.
- source_word: כָל מִצְרַיִם
  choice: tous les Égyptiens
  rationale: Bien que l’expression signifie littéralement « toute l’Égypte », le contexte vise collectivement les habitants qui cherchent de l’eau; cette formulation est naturelle et précise en français.
- source_word: סְבִיבֹת הַיְאֹר
  choice: aux alentours du Nil
  rationale: סְבִיבֹת désigne les environs ou les zones qui entourent un lieu. « Aux alentours du Nil » exprime naturellement l’endroit où les Égyptiens creusent.
- source_word: הַיְאֹר
  choice: le Nil
  rationale: Dans le récit de l’Exode, יְאֹר désigne spécifiquement le Nil. Le nom propre permet au lecteur moderne d’identifier clairement le cours d’eau, tandis qu’une note conserve la forme lexicale plus générale de l’hébreu.
- source_word: מַיִם לִשְׁתּוֹת
  choice: afin d’avoir de l’eau à boire
  rationale: L’hébreu dit littéralement « de l’eau à boire ». La tournure française explicite naturellement le but de l’action sans préciser qu’ils creusèrent des puits.
- source_word: כִּי לֹא יָכְלוּ
  choice: car ils ne pouvaient pas
  rationale: כִּי introduit ici la raison pour laquelle les Égyptiens creusent. « Car » conserve clairement ce lien causal dans un registre narratif digne.
- source_word: לִשְׁתֹּת מִמֵּימֵי הַיְאֹר
  choice: boire l’eau du Nil
  rationale: La préposition מִן marque ici la source. En français, « boire l’eau du Nil » est plus naturel que « boire de l’eau du Nil » dans ce contexte et conserve le rapport au fleuve.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et narratif. Le passé simple convient au registre biblique écrit sans archaïsme excessif. La formulation reste proche de l’hébreu tout en évitant le calque peu naturel « creuser de l’eau ».
