  text: The frogs will come up on you[a], on your people, and on all your servants.
translation:
  language: fr
  text: Les grenouilles monteront sur toi[a], sur ton peuple et sur tous tes serviteurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi ton peuple » dans la deuxième expression. La même préposition hébraïque est employée dans les trois expressions, mais le contexte favorise l’idée que les grenouilles s’abattent sur le pharaon et son royaume comme une plaie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָה
  choice: sur toi
  rationale: Avec יַעֲלוּ dans le contexte de la plaie, la préposition בְּ exprime l’irruption qui atteint directement le pharaon. « Sur toi » conserve l’image concrète et la force hostile du texte.
- source_word: וּבְעַמְּךָ
  choice: sur ton peuple
  rationale: La répétition de « sur » reproduit le parallélisme hébreu et présente les grenouilles comme une plaie atteignant le peuple. « Parmi ton peuple » reste possible, mais atténue cette force.
- source_word: וּבְכָל עֲבָדֶיךָ
  choice: sur tous tes serviteurs
  rationale: עֶבֶד peut désigner un serviteur, un esclave ou un agent de la cour. « Serviteurs » garde ici la portée large du terme sans préciser indûment leur statut.
- source_word: יַעֲלוּ
  choice: monteront
  rationale: Le verbe עָלָה indique un mouvement ascendant. Dans le contexte, les grenouilles montent depuis les eaux et envahissent le domaine du pharaon.
- source_word: הַצְפַרְדְּעִים
  choice: les grenouilles
  rationale: L’article défini hébreu désigne les grenouilles constituant la plaie annoncée; l’article français en conserve naturellement la spécificité.
