review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : les poissons meurent, le Nil devient impropre par son odeur, et les Égyptiens ne peuvent plus y boire. Toutefois, « deviendra infect » privilégie l’idée de contamination et n’exprime pas explicitement la puanteur du verbe hébreu באשׁ. « Deviendra nauséabond » rend mieux l’effet olfactif sans ajouter de cause.'
  naturalness: La phrase est fluide et de registre moderne. « Le Nil deviendra nauséabond » est naturel dans un registre biblique contemporain et plus précis que « deviendra infect ».
  terminology: « Nil », « poissons », « Égyptiens » et « boire de l’eau » conviennent. La note a est correctement ancrée après « Nil » et explique l’alternative lexicale. La note b est correctement ancrée à la proposition concernant l’incapacité de boire; sa formulation alternative doit éviter d’ajouter « à essayer », qui n’est pas exprimé par l’hébreu.
  issues:
  - severity: medium
    issue: « deviendra infect » ne rend pas explicitement l’odeur désagréable.
    rationale: וּבָאַשׁ signifie littéralement que le fleuve « deviendra puant / malodorant ». En français, « infect » peut certes signifier « qui sent très mauvais », mais évoque couramment l’infection ou la contamination; « nauséabond » est plus net.
  - severity: low
    issue: La formulation de la note b ajoute « à essayer de boire ».
    rationale: L’infinitif hébreu signifie « boire de l’eau »; l’idée de tentative n’est pas nécessaire. Une note plus proche du texte préserve la nuance de lassitude sans la développer.
  revised_text: Et les poissons qui sont dans le Nil[a] mourront, le Nil deviendra nauséabond, et les Égyptiens seront incapables de boire de l’eau du Nil[b].
  revised_footnotes:
