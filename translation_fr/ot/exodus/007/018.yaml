    reason: lexical_alternative
  revision_rationale: La révision remplace un terme français potentiellement ambigu par « nauséabond », qui reflète directement la dimension olfactive du verbe hébreu. Elle resserre aussi la note alternative afin de ne pas introduire l’idée non explicite d’« essayer » de boire.
