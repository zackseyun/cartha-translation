revisions:
- from: Et les poissons qui sont dans le Nil[a] mourront, le Nil deviendra infect, et les Égyptiens seront incapables de boire de l’eau du Nil[b].
  to: Et les poissons qui sont dans le Nil[a] mourront, le Nil deviendra nauséabond, et les Égyptiens seront incapables de boire de l’eau du Nil[b].
  rationale: La révision remplace un terme français potentiellement ambigu par « nauséabond », qui reflète directement la dimension olfactive du verbe hébreu. Elle resserre aussi la note alternative afin de ne pas introduire l’idée non explicite d’« essayer » de boire.
