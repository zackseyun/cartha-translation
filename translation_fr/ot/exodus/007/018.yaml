  text: And the fish that are in the Nile will die[a], and the Nile will stink[b], and the Egyptians will be unable to drink water from the Nile.
translation:
  language: fr
  text: Et les poissons qui sont dans le Nil[a] mourront, le Nil deviendra nauséabond, et les Égyptiens seront incapables de boire de l’eau du Nil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le fleuve » ; dans ce contexte, il s’agit du Nil.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « les Égyptiens se lasseront de boire de l’eau du Nil ». Le verbe hébreu peut exprimer la lassitude ou l’épuisement qui empêche d’agir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּגָה
  choice: les poissons
  rationale: Le nom hébreu singulier a ici un sens collectif. Le pluriel « les poissons » est la formulation la plus naturelle en français.
- source_word: יְאֹר
  choice: le Nil
  rationale: Dans ce contexte égyptien, le terme désigne précisément le Nil, bien qu’il signifie littéralement « le fleuve ».
- source_word: תָּמוּת
  choice: mourront
  rationale: Rend directement le verbe מות et s’accorde en français avec le collectif traduit par un pluriel.
- source_word: וּבָאַשׁ
  choice: deviendra infect
  rationale: Le verbe exprime le fait de devenir malodorant ou nauséabond. « Deviendra infect » est naturel, concret et digne en français courant.
- source_word: וְנִלְאוּ
  choice: seront incapables
  rationale: Le niphal de לאה évoque la lassitude ou l’épuisement qui aboutit à l’impossibilité d’agir. La traduction principale exprime clairement le résultat pratique, tandis qu’une note conserve la nuance possible de fatigue.
- source_word: לִשְׁתּוֹת מַיִם
  choice: boire de l’eau
  rationale: Conserve l’objet explicite « eau » tout en employant la tournure idiomatique française.
- source_word: מִן הַיְאֹר
  choice: du Nil
  rationale: Rend naturellement la provenance exprimée par la préposition hébraïque et précise le référent contextuel.
