source:
  edition: WLC
  text: וַ/יִּקְרָא֙ גַּם פַּרְעֹ֔ה לַֽ/חֲכָמִ֖ים וְ/לַֽ/מְכַשְּׁפִ֑ים וַ/יַּֽעֲשׂ֨וּ גַם הֵ֜ם חַרְטֻמֵּ֥י מִצְרַ֛יִם בְּ/לַהֲטֵי/הֶ֖ם כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/011.yaml
  text: Then Pharaoh also called for the wise men and the sorcerers[a], and they too, the magicians of Egypt, did the same by their enchantments.
translation:
  language: fr
  text: Alors Pharaon convoqua lui aussi les sages et les sorciers, et les magiciens d’Égypte firent eux aussi de même par leurs arts secrets[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par leurs enchantements ». Le terme hébreu peut désigner des arts secrets ou des enchantements ; sa nuance exacte est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: convoqua
  rationale: Dans ce contexte de cour, קרא désigne l’action de faire venir des personnes auprès de soi; « convoqua » l’exprime naturellement et avec précision.
- source_word: גַּם
  choice: lui aussi
  rationale: Le premier גַּם indique que Pharaon agit à son tour en réponse au signe précédent.
- source_word: חֲכָמִים
  choice: les sages
  rationale: Le terme désigne ici des hommes réputés savants ou experts à la cour; « les sages » est clair, courant et digne.
- source_word: מְכַשְּׁפִים
  choice: les sorciers
  rationale: Ce mot désigne des praticiens de la sorcellerie et doit rester distinct de חַרְטֻמִּים, rendu plus loin par « magiciens ».
- source_word: וַיַּעֲשׂוּ ... כֵּן
  choice: firent de même
  rationale: Cette tournure française rend idiomatiquement l’idée qu’ils reproduisirent l’acte précédent.
- source_word: גַם הֵם
  choice: eux aussi
  rationale: La formulation conserve l’insistance de l’hébreu sur le fait que les spécialistes égyptiens accomplirent eux aussi le même geste.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: les magiciens d’Égypte
  rationale: Dans l’Exode, חַרְטֻמִּים désigne les spécialistes rituels de Pharaon; « magiciens » est le terme français le plus immédiatement compréhensible, tandis que « d’Égypte » préserve la construction hébraïque.
- source_word: בְּלַהֲטֵיהֶם
  choice: par leurs pratiques occultes
  rationale: Le terme désigne ici les moyens mystérieux ou occultes employés par les magiciens. Cette traduction reste générale et ne précise ni la technique ni le mécanisme métaphysique.
theological_decisions:
- issue: Nature du pouvoir des spécialistes égyptiens
  choice: Décrire simplement qu’ils firent de même « par leurs pratiques occultes »
  alternative: Préciser qu’il s’agissait soit d’un pouvoir surnaturel réel, soit d’une illusion ou d’une supercherie
  rationale: L’hébreu affirme qu’ils reproduisirent l’acte au moyen de leurs לַהֲטִים, sans expliquer la nature exacte de ce phénomène. La traduction conserve cette réserve.
translation_notes:
  register: Français international moderne, narratif et digne. « Convoqua » convient au cadre royal; la répétition « lui aussi / eux aussi » reproduit l’insistance du texte sans lourdeur excessive. Le marqueur [a] est placé immédiatement après l’expression concernée.
