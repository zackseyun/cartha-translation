revisions:
- from: Alors Pharaon convoqua lui aussi les sages et les sorciers, et eux aussi, les magiciens d’Égypte, firent de même par leurs pratiques occultes.[a]
  to: Alors Pharaon convoqua lui aussi les sages et les sorciers, et les magiciens d’Égypte firent eux aussi de même par leurs arts secrets[a].
  rationale: La révision emploie « arts secrets » pour préserver l’incertitude lexicale de לַהֲטִים et évite de qualifier explicitement ces pratiques d’« occultes ». La restructuration de la seconde proposition améliore la lisibilité sans modifier l’emphase de גַּם הֵם ni la distinction terminologique entre les deux groupes.
