  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כָּבֵ֖ד לֵ֣ב פַּרְעֹ֑ה מֵאֵ֖ן לְ/שַׁלַּ֥ח הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/014.yaml
  text: Then Yahweh said to Moses[a], “Pharaoh’s heart is heavy; he refuses to let the people go.”
translation:
  language: fr
  text: 'Alors Yahweh dit à Moïse : « Le cœur du pharaon est lourd[a] ; il refuse de laisser partir le peuple. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dur » ou « endurci ». L’adjectif hébreu signifie littéralement « lourd » ; il évoque ici l’obstination et le manque de réceptivité.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... dit
  rationale: Le waw consécutif fait progresser le récit. « Alors ... dit » exprime naturellement la succession en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française conventionnelle du nom propre.
- source_word: כָּבֵד
  choice: est lourd
  rationale: L’adjectif signifie concrètement « lourd ». Conserver cette métaphore respecte le vocabulaire particulier du passage sans le réduire d’emblée à « endurci ».
- source_word: לֵב פַּרְעֹה
  choice: Le cœur du pharaon
  rationale: Le groupe construit hébreu est rendu par une tournure possessive française naturelle. Le titre prend ici la minuscule conformément à l’usage courant.
- source_word: מֵאֵן
  choice: il refuse
  rationale: La forme exprime l’attitude persistante de refus du pharaon ; le présent français la rend naturellement.
- source_word: לְשַׁלַּח
  choice: de laisser partir
  rationale: Dans ce contexte, le verbe désigne le fait d’autoriser le peuple à partir. Cette formulation est idiomatique tout en gardant l’idée de départ.
- source_word: הָעָם
  choice: le peuple
  rationale: L’hébreu dit simplement « le peuple » ; la traduction n’ajoute donc pas explicitement « d’Israël ».
theological_decisions:
- issue: Rendre l’état du cœur du pharaon sans uniformiser le motif de l’endurcissement
  choice: Le cœur du pharaon est lourd
  alternative: Le cœur du pharaon est endurci / dur
  rationale: Le texte emploie ici כָּבֵד, « lourd ». Le maintien de cette image préserve la nuance lexicale et la tension du récit, tandis qu’une note en indique le sens contextuel.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste naturelle, et la métaphore hébraïque du cœur « lourd » est conservée dans le texte principal avec une note explicative.
