  verdict: approve
  source_fidelity: Le texte rend correctement la progression narrative de וַיֹּאמֶר, le nom divin יהוה par « Yahweh », et les compléments. « Le cœur du pharaon est lourd » conserve volontairement la métaphore concrète de כָּבֵד, sans la confondre avec les verbes plus spécifiques d’endurcissement employés ailleurs. « Il refuse de laisser partir le peuple » rend avec justesse le refus persistant (מֵאֵן) et l’infinitif לְשַׁלַּח, sans ajouter « d’Israël » absent du verset.
  naturalness: Le français est moderne, clair et d’un registre biblique sobre. La formule « le cœur du pharaon est lourd » est volontairement littérale et peut paraître moins idiomatique dans ce sens moral, mais la note explicative la rend intelligible tout en préservant l’image et la distinction lexicale de l’hébreu.
  terminology: « Yahweh », « Moïse » et « pharaon » sont cohérents avec les usages français et avec les choix de la POB. La minuscule à « pharaon » convient puisqu’il s’agit d’un titre. La note présente adéquatement « dur » et « endurci » comme possibilités contextuelles plutôt que comme remplacement imposé du texte.
