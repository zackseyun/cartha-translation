  text: וַ/אֲנִ֥י אַקְשֶׁ֖ה אֶת לֵ֣ב פַּרְעֹ֑ה וְ/הִרְבֵּיתִ֧י אֶת אֹתֹתַ֛/י וְ/אֶת מוֹפְתַ֖/י בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/003.yaml
  text: But I will harden Pharaoh’s heart[a], and I will multiply my signs and my wonders in the land of Egypt.
translation:
  language: fr
  text: Mais moi, j’endurcirai le cœur du pharaon[a] et je multiplierai mes signes et mes prodiges dans le pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je rendrai le cœur du pharaon dur » ou « je rendrai le cœur du pharaon obstiné ». Le verbe hébreu est causatif et présente directement l’action d’endurcir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mais moi
  rationale: La conjonction accompagnée du pronom explicite marque ici le contraste ou l’insistance. « Mais moi » rend naturellement cette force en français.
- source_word: אַקְשֶׁה
  choice: j’endurcirai
  rationale: Le hifil de קשׁה exprime directement l’action de rendre dur. « J’endurcirai » conserve la valeur causative et l’expression biblique naturelle avec « cœur ».
- source_word: לֵב פַּרְעֹה
  choice: le cœur du pharaon
  rationale: Cette formulation rend naturellement l’état construit hébreu tout en conservant « cœur », qui désigne ici le siège intérieur de la volonté et de la pensée sans l’expliciter dans le texte.
- source_word: וְהִרְבֵּיתִי
  choice: et je multiplierai
  rationale: Dans cette suite verbale, la forme exprime une action future. « Multiplierai » préserve le sens de רבה et convient aux signes et aux prodiges.
- source_word: אֹתֹתַי
  choice: mes signes
  rationale: אוֹת désigne couramment un signe. Ce terme clair conserve la fonction signifiante des actes divins.
- source_word: מוֹפְתַי
  choice: mes prodiges
  rationale: מוֹפֵת peut désigner un prodige, une merveille ou un présage. « Prodiges » forme en français une paire biblique naturelle avec « signes » et souligne le caractère extraordinaire sans imposer l’idée de présage.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: dans le pays d’Égypte
  rationale: L’hébreu mentionne explicitement le « pays »; cette formulation le conserve tout en restant naturelle en français.
theological_decisions:
- issue: L’action divine dans l’endurcissement du pharaon
  choice: j’endurcirai le cœur du pharaon
  alternative: je rendrai le cœur du pharaon dur / obstiné; je laisserai le cœur du pharaon s’endurcir
  rationale: Le hifil hébreu présente directement Dieu comme l’agent de l’endurcissement. Le texte principal conserve cette causalité et la tension théologique qui en résulte, sans l’atténuer en simple permission.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’idiome du « cœur », le parallélisme « signes et prodiges » et la causalité explicite de l’hébreu.
