  rationale: La révision remplace une expression française plus marquée par « se détourna », qui correspond plus directement à פנה sans renforcer l’attitude de Pharaon. Elle rend la coordination verbale explicite et traduit גַּם dans la négation par « non plus ». La note conserve l’alternative attentionnelle et propose une formulation littérale plus proche de l’idiome hébreu.
