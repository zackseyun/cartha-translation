  verdict: revise
  source_fidelity: 'Le sens central est bien rendu : Pharaon se détourne, retourne dans sa demeure et ne prête pas attention à ce signe. Toutefois, « tourna les talons » ajoute une coloration idiomatique de départ brusque ou méprisant qui n’est pas explicitement portée par וַיִּפֶן (« se tourna / se détourna »).'
  naturalness: La formulation est naturelle, mais « se détourna et rentra chez lui » est à la fois idiomatique et plus sobre. « Cela non plus » rend naturellement גַּם לָזֹאת dans la négation et évite l’ordre un peu lourd de « même cela ».
