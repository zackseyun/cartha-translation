  text: Pharaoh turned and went into his house[a], and he did not take even this to heart.
translation:
  language: fr
  text: Le pharaon se détourna et rentra chez lui ; il ne prit pas cela non plus à cœur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il n’y prêta pas attention non plus ». Littéralement : « il ne mit pas son cœur à cela non plus ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן
  choice: tourna les talons
  rationale: Le verbe פנה décrit ici le fait de se détourner. « Tourna les talons » exprime naturellement en français le mouvement de départ, sans répéter le verbe suivant.
- source_word: פַּרְעֹה
  choice: le pharaon
  rationale: Forme française courante du titre royal égyptien, employée ici avec l’article défini.
- source_word: וַיָּבֹא אֶל בֵּיתוֹ
  choice: rentra chez lui
  rationale: בוא avec אֶל indique un mouvement vers l’intérieur ou en direction de la demeure. Dans ce contexte narratif, « rentra chez lui » rend avec naturel le retour du pharaon dans sa résidence.
- source_word: וְלֹא שָׁת לִבּוֹ
  choice: sans prendre à cœur
  rationale: L’expression idiomatique שׁית לב évoque le fait d’appliquer son cœur ou son attention à quelque chose. « Prendre à cœur » conserve l’image du cœur tout en restant idiomatique en français.
- source_word: גַּם לָזֹאת
  choice: même cela
  rationale: גַּם a ici une valeur intensive (« même »), et זֹאת renvoie à ce signe ou jugement. « Même cela » souligne que cet événement n’a pas davantage touché le pharaon.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. « Tourna les talons » donne une formulation vivante au mouvement de retrait ; « prendre à cœur » préserve l’image hébraïque du cœur, tandis que la note indique le sens attentionnel de l’expression.
