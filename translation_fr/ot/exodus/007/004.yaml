  text: וְ/לֹֽא יִשְׁמַ֤ע אֲלֵ/כֶם֙ פַּרְעֹ֔ה וְ/נָתַתִּ֥י אֶת יָדִ֖/י בְּ/מִצְרָ֑יִם וְ/הוֹצֵאתִ֨י אֶת צִבְאֹתַ֜/י אֶת עַמִּ֤/י בְנֵֽי יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בִּ/שְׁפָטִ֖ים גְּדֹלִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/004.yaml
  text: Pharaoh will not listen to you[a], and I will lay my hand on Egypt and bring out my hosts—my people[c][b], the sons of Israel—from the land of Egypt with great judgments.
translation:
  language: fr
  text: Le pharaon ne vous écoutera pas, et je mettrai ma main sur l’Égypte ; j’en ferai sortir mes armées — mon peuple, les fils d’Israël[a] — par de grands actes de jugement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les Israélites ». Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « avec de grands jugements ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע אֲלֵכֶם
  choice: ne vous écoutera pas
  rationale: Avec אֶל, שׁמע signifie ici « écouter » ou « prêter attention à ». Cette formulation naturelle conserve le sens immédiat sans expliciter davantage l’idée d’obéissance.
- source_word: וְנָתַתִּי אֶת יָדִי בְּמִצְרַיִם
  choice: je poserai ma main sur l’Égypte
  rationale: La traduction garde l’image hébraïque d’une intervention divine décisive sans introduire le verbe « étendre », absent de ce verset.
- source_word: צִבְאֹתַי
  choice: mes troupes
  rationale: צָבָא désigne des groupes organisés et peut avoir une coloration militaire. « Troupes » conserve cette image collective mieux que « armées », qui pourrait la renforcer excessivement.
- source_word: עַמִּי בְנֵי יִשְׂרָאֵל
  choice: mon peuple, les fils d’Israël
  rationale: La structure en apposition est maintenue, et בְנֵי יִשְׂרָאֵל est rendu littéralement tout en signalant en note l’ethnonyme français courant.
- source_word: בִּשְׁפָטִים גְּדֹלִים
  choice: par de grands actes de jugement
  rationale: Le pluriel שְׁפָטִים désigne ici les jugements exécutés par Dieu. « Actes de jugement » rend clairement leur caractère concret et judiciaire.
theological_decisions:
- issue: Désignation d’Israël par צִבְאֹתַי
  choice: mes troupes
  alternative: mes armées ; mes groupes organisés
  rationale: La formulation préserve la représentation d’Israël comme ensemble organisé appartenant à Dieu, sans imposer l’idée d’une armée déjà engagée au combat.
- issue: Rendu de בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites ; les enfants d’Israël
  rationale: Le lien généalogique exprimé par l’hébreu est conservé dans le texte, tandis que la note fournit l’équivalent ethnonymique naturel.
- issue: Valeur de בִּשְׁפָטִים גְּדֹלִים
  choice: par de grands actes de jugement
  alternative: avec de grands jugements
  rationale: Cette traduction conserve la dimension judiciaire et le pluriel tout en montrant qu’il s’agit d’interventions divines concrètes, sans en préciser indûment la forme.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination initiale est rendue par « Mais » puis « Alors » pour exprimer naturellement la progression annoncée. Les images de la main divine et des troupes sont conservées sans surinterprétation.
