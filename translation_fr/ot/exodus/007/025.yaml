  text: וַ/יִּמָּלֵ֖א שִׁבְעַ֣ת יָמִ֑ים אַחֲרֵ֥י הַכּוֹת יְהוָ֖ה אֶת הַ/יְאֹֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/025.yaml
  text: And seven days were fulfilled after Yahweh struck the Nile[a][b].
translation:
  language: fr
  text: Sept jours s’écoulèrent après que Yahweh eut frappé le Nil[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Sept jours furent accomplis après que Yahweh eut frappé le Nil. »'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu désigne ici le Nil; on le traduit parfois plus généralement par « le fleuve ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵא
  choice: s’écoulèrent
  rationale: Dans l’expression temporelle, le nifal de מלא indique qu’une période arrive à son terme. « S’écoulèrent » exprime ce sens naturellement en français, sans imposer au verbe une portée théologique absente du contexte.
- source_word: שִׁבְעַת יָמִים
  choice: sept jours
  rationale: Traduction directe de la durée indiquée par le nombre cardinal et le nom.
- source_word: אַחֲרֵי
  choice: après que
  rationale: La préposition marque une succession temporelle. Avec l’action verbale qui suit, « après que » donne une formulation française claire.
- source_word: הַכּוֹת
  choice: eut frappé
  rationale: L’infinitif construit de נכה dépend de אַחֲרֵי. Le plus-que-parfait après « après que » situe clairement le coup porté au Nil avant l’écoulement des sept jours.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est conservé sous forme de translittération plutôt que remplacé par un titre.
- source_word: הַיְאֹר
  choice: le Nil
  rationale: Dans ce contexte égyptien, יְאֹר désigne précisément le Nil, bien que le terme puisse être rendu plus généralement par « le fleuve ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom personnel divin. La translittération le distingue d’un titre et suit directement la donnée hébraïque.
translation_notes:
  register: Français moderne, sobre et narratif. « S’écoulèrent » est idiomatique tout en conservant l’idée qu’une période de sept jours est arrivée à son terme. Le passé simple convient au registre narratif biblique sans être archaïque; le plus-que-parfait marque l’antériorité de l’action de frapper.
