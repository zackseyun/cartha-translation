  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֱמֹ֣ר אֶֽל אַהֲרֹ֡ן קַ֣ח מַטְּ/ךָ֣ וּ/נְטֵֽה יָדְ/ךָ֩ עַל מֵימֵ֨י מִצְרַ֜יִם עַֽל נַהֲרֹתָ֣/ם עַל יְאֹרֵי/הֶ֣ם וְ/עַל אַגְמֵי/הֶ֗ם וְ/עַ֛ל כָּל מִקְוֵ֥ה מֵימֵי/הֶ֖ם וְ/יִֽהְיוּ דָ֑ם וְ/הָ֤יָה דָם֙ בְּ/כָל אֶ֣רֶץ מִצְרַ֔יִם וּ/בָ/עֵצִ֖ים וּ/בָ/אֲבָנִֽים־־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/019.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Take your staff and stretch out your hand over the waters of Egypt—over their rivers, over their Nile canals, over their ponds, and over every collection of their waters—that they may become blood. And there will be blood throughout all the land of Egypt[b], even in wooden and stone vessels.’”
translation:
  language: fr
  text: 'Puis Yahweh dit à Moïse : « Dis à Aaron : “Prends ton bâton et étends ta main sur les eaux d’Égypte — sur leurs fleuves, sur leurs canaux du Nil, sur leurs étangs et sur toute étendue d’eau — afin qu’elles deviennent du sang. Il y aura du sang dans tout le pays d’Égypte, jusque dans les récipients en bois et en pierre[a].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et dans le bois et dans la pierre » ; il s’agit probablement de récipients faits de ces matériaux.'
    reason: L’hébreu est elliptique ; la note conserve la possibilité d’une traduction plus littérale, tandis que le contexte des eaux rend probable le sens de récipients.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel plutôt que de lui substituer un titre.
- source_word: מַטְּךָ
  choice: ton bâton
  rationale: « Bâton » est le terme concret, courant et naturel dans ce récit.
- source_word: וּנְטֵה יָדְךָ
  choice: étends ta main
  rationale: Rend directement l’expression hébraïque qui introduit ici l’acte commandé.
- source_word: נַהֲרֹתָם
  choice: leurs fleuves
  rationale: Distingue les grands cours d’eau des יְאֹרִים mentionnés ensuite.
- source_word: יְאֹרֵיהֶם
  choice: leurs canaux du Nil
  rationale: Dans le contexte égyptien, le mot désigne des cours d’eau liés au Nil; cette formulation conserve cette spécificité.
- source_word: אַגְמֵיהֶם
  choice: leurs étangs
  rationale: Rend simplement des eaux stagnantes ou rassemblées, sans imposer le sens plus précis de « marais ».
- source_word: כָּל מִקְוֵה מֵימֵיהֶם
  choice: tous leurs réservoirs d’eau
  rationale: Exprime les endroits où l’eau est rassemblée tout en gardant une formulation française concise.
- source_word: וְיִהְיוּ דָם
  choice: afin qu’elles deviennent du sang
  rationale: Le verbe préfixé après les impératifs exprime naturellement le résultat visé de l’action commandée.
- source_word: וּבָעֵצִים וּבָאֲבָנִים
  choice: jusque dans les récipients en bois et en pierre
  rationale: Le contexte des eaux suggère une métonymie désignant des récipients faits de ces matériaux; « jusque » en marque l’extension surprenante.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le nom personnel est conservé sans lui substituer un titre traditionnel.
- issue: Interprétation de וּבָעֵצִים וּבָאֲבָנִים
  choice: les récipients en bois et en pierre
  alternative: le bois et la pierre
  rationale: La métonymie convient au contexte, qui porte sur l’eau présente dans toute l’Égypte; l’ellipse de l’hébreu est néanmoins signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La structure énumérative de l’hébreu est conservée, tandis que les formulations trop littérales ou opaques sont explicitées avec retenue.
