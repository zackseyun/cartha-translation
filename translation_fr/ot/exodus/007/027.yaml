translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe au pharaon. « Voici que » maintient le ton solennel de l’avertissement ; la note préserve l’ambiguïté aspectuelle du participe hébreu et l’alternative sémantique entre « territoire » et « pays ».
