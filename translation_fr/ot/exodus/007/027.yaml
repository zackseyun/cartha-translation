  text: But if you refuse to let them go[a], behold, I will strike all your territory with frogs.
translation:
  language: fr
  text: Mais si tu refuses de les laisser partir, voici que je vais frapper tout ton territoire de grenouilles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Mais si tu refuses de les laisser partir, voici que je frapperai tout ton territoire de grenouilles. » Le participe hébreu peut exprimer une action imminente (« je vais frapper ») ou se rendre par un futur simple (« je frapperai »).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Dans le contexte, la conjonction introduit la conséquence opposée à l’ordre précédent ; « Mais si » rend naturellement cette valeur contrastive.
- source_word: מָאֵן
  choice: tu refuses
  rationale: Le verbe exprime un refus volontaire, et non une simple incapacité.
- source_word: לְשַׁלֵּחַ
  choice: de les laisser partir
  rationale: Dans le contexte de l’Exode, l’expression désigne la libération des Israélites retenus par le pharaon.
- source_word: הִנֵּה
  choice: voici que
  rationale: Cette tournure française attire solennellement l’attention sur le jugement imminent sans recourir à l’archaïsme « voici » employé seul.
- source_word: אָנֹכִי
  choice: je
  rationale: Le pronom indépendant souligne le sujet divin ; la construction explicite « je vais » porte suffisamment cette mise en relief en français.
- source_word: נֹגֵף
  choice: vais frapper
  rationale: Avec הִנֵּה, le participe peut annoncer une action imminente. « Je vais frapper » conserve à la fois cette imminence et l’image du coup, tout en laissant en note l’alternative du futur simple.
- source_word: כָּל גְּבוּלְךָ
  choice: tout ton territoire
  rationale: גְּבוּל désigne ici l’ensemble du domaine soumis au pharaon, plutôt que sa seule frontière.
- source_word: בַּצְפַרְדְּעִים
  choice: par des grenouilles
  rationale: La préposition ב marque ici le moyen ou l’instrument du fléau. « Par des grenouilles » rend clairement cette relation en français.
