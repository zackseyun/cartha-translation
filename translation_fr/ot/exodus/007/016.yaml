source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֵלָ֗י/ו יְהוָ֞ה אֱלֹהֵ֤י הָ/עִבְרִים֙ שְׁלָחַ֤/נִי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר שַׁלַּח֙ אֶת עַמִּ֔/י וְ/יַֽעַבְדֻ֖/נִי בַּ/מִּדְבָּ֑ר וְ/הִנֵּ֥ה לֹא שָׁמַ֖עְתָּ עַד כֹּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/016.yaml
  text: 'And you shall say to him[a], ‘Yahweh, the God of the Hebrews, has sent me to you, saying: Let my people go, so that they may serve me in the wilderness. But behold, until now you have not listened.’'
translation:
  language: fr
  text: 'Tu lui diras : « Yahweh, le Dieu des Hébreux, m’a envoyé vers toi pour te dire : Laisse partir mon peuple afin qu’il me serve[a] dans le désert. Mais voici que, jusqu’à présent, tu ne m’as pas écouté. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’il me rende un culte ». Le verbe hébreu peut désigner le service en général ou le culte rendu à Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: le Dieu des Hébreux
  rationale: Conserve la désignation ethnique du texte hébreu sans la remplacer par « Israélites ».
- source_word: שְׁלָחַנִי אֵלֶיךָ
  choice: m’a envoyé vers toi
  rationale: Le passé composé exprime naturellement en français une mission accomplie qui demeure pertinente; « vers toi » garde la nuance directionnelle.
- source_word: לֵאמֹר
  choice: pour te dire
  rationale: Introduit naturellement en français le contenu du message et explicite sa fonction sans alourdir la phrase.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Laisse partir mon peuple
  rationale: Rend l’impératif comme une exigence de libération dans un français actuel et idiomatique.
- source_word: וְיַעַבְדֻנִי
  choice: afin qu’il me serve
  rationale: Exprime la finalité et préserve le sens large de עבד, qui comprend le service religieux sans s’y limiter explicitement.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: En français courant, « désert » désigne naturellement la région inhabitée concernée, sans exiger l’idée exclusive de dunes ou de sable.
- source_word: וְהִנֵּה
  choice: Mais
  rationale: Dans ce contexte, le marqueur attire l’attention sur le contraste avec l’ordre divin; une traduction littérale comme « voici » serait peu naturelle dans cette proposition française.
- source_word: לֹא שָׁמַעְתָּ
  choice: tu ne m’as pas écouté
  rationale: Préserve l’image d’écouter tout en exprimant le refus de tenir compte du message; le complément « m’ » est fourni par le contexte du discours rapporté.
- source_word: עַד כֹּה
  choice: jusqu’à présent
  rationale: Équivalent temporel idiomatique signifiant « jusqu’à maintenant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » conserve le nom personnel au lieu de lui substituer un titre.
- issue: Portée de וְיַעַבְדֻנִי
  choice: qu’il me serve
  alternative: qu’il m’adore
  rationale: Le verbe עבד peut désigner le service en général aussi bien que le culte. « Servir » maintient cette amplitude et laisse le contexte religieux l’éclairer.
translation_notes:
  register: Français international moderne, digne et direct. Le singulier collectif « il » reprend naturellement « mon peuple ». La ponctuation française rend le discours imbriqué sans archaïsmes; « voici » n’est pas retenu, car il sonnerait artificiel ici.
