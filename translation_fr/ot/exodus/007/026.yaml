source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/026.yaml
  text: 'And Yahweh said to Moses[a], “Go in to Pharaoh and say to him, ‘Thus says Yahweh: Let my people go, so that they may serve me.’”'
translation:
  language: fr
  text: 'Yahweh dit à Moïse : « Va auprès du pharaon et dis-lui : “Ainsi parle Yahweh : Laisse partir mon peuple, afin qu’il me serve[a].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin qu’il m’adore ». Le verbe hébreu peut désigner le service rendu à Dieu, y compris le culte.'
    reason: Alternative lexicale préservant la dimension cultuelle possible de עבד.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription « Yahweh », afin de conserver le nom personnel divin plutôt que de lui substituer un titre.
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait progresser le récit. En français, le passé simple exprime naturellement cette succession narrative sans qu’un « et » initial soit nécessaire.
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: Va auprès du pharaon
  rationale: בוא peut signifier venir, aller ou entrer selon le point de vue. Ici, l’ordre demande à Moïse de se présenter devant le pharaon ; « va auprès du pharaon » restitue ce mouvement sans imposer l’idée qu’il entre dans un bâtiment.
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: et dis-lui
  rationale: La formulation française conserve la valeur injonctive et la succession des deux ordres.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Cette formule solennelle et consacrée restitue l’autorité de la formule hébraïque du messager.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Laisse partir mon peuple
  rationale: Dans ce contexte, שׁלח exige la libération du peuple retenu par le pharaon. Cette tournure française en exprime clairement la force.
- source_word: עַמִּי
  choice: mon peuple
  rationale: Le suffixe de première personne marque l’appartenance ; le singulier collectif français conserve la revendication exprimée dans l’hébreu.
- source_word: וְיַעַבְדֻנִי
  choice: afin qu’il me serve
  rationale: Après l’ordre de laisser partir le peuple, la proposition exprime naturellement le but. « Servir » garde l’étendue sémantique de עבד, qui peut comprendre le culte sans s’y limiter.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le Seigneur
  rationale: Le texte emploie directement le tétragramme. La transcription « Yahweh » préserve le nom personnel et évite de le remplacer par un titre.
- issue: Portée de וְיַעַבְדֻנִי
  choice: afin qu’il me serve
  alternative: afin qu’il m’adore
  rationale: Le verbe עבד appliqué à Dieu peut désigner un service comprenant l’adoration. Le choix de « servir » préserve cette portée plus large et la tension narrative entre le service imposé au pharaon et le service rendu à Yahweh.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au récit écrit ; « Ainsi parle » maintient la solennité de la formule du messager. Le singulier « il » reprend grammaticalement le collectif « mon peuple ».
