  source_fidelity: 'Le sens central est fidèlement rendu : formule d’annonce divine, signe destiné à faire reconnaître Yahweh, frappe des eaux du Nil et transformation en sang. Toutefois, « de mon bâton » omet l’expansion explicite « qui est dans ma main », mise en relief dans l’hébreu.'
  naturalness: Le français est clair, moderne et d’un registre solennel approprié. « À ceci tu reconnaîtras » est naturel dans ce contexte. « Avec le bâton que je tiens à la main » restitue l’expansion hébraïque sans lourdeur excessive.
  terminology: « Yahweh », « bâton », « les eaux du Nil » et « sang » sont appropriés. Le pluriel de « eaux » permet de conserver l’accord pluriel de « elles se changeront ».
