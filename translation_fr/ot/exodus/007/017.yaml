  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה בְּ/זֹ֣את תֵּדַ֔ע כִּ֖י אֲנִ֣י יְהוָ֑ה הִנֵּ֨ה אָנֹכִ֜י מַכֶּ֣ה בַּ/מַּטֶּ֣ה אֲשֶׁר בְּ/יָדִ֗/י עַל הַ/מַּ֛יִם אֲשֶׁ֥ר בַּ/יְאֹ֖ר וְ/נֶהֶפְכ֥וּ לְ/דָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/017.yaml
  text: 'Thus says Yahweh: By this you will know that I am Yahweh: behold[a], I am striking the water that is in the Nile with the staff that is in my hand, and it will be turned to blood.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : « À ceci tu reconnaîtras que je suis Yahweh : voici, je vais frapper les eaux du Nil avec le bâton que je tiens à la main, et elles se changeront en sang. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Conserve la formule solennelle du messager prophétique dans un français naturel et digne, tout en rendant le nom divin comme un nom propre.
- source_word: בְּזֹאת תֵּדַע
  choice: À ceci tu reconnaîtras
  rationale: 'Le beth a une valeur instrumentale ou référentielle : le signe annoncé permettra au destinataire de reconnaître l’identité et l’autorité de Yahweh. « Reconnaîtras » exprime ici une connaissance acquise par la manifestation.'
- source_word: הִנֵּה אָנֹכִי מַכֶּה
  choice: voici, je vais frapper
  rationale: « Voici » garde la mise en relief de הִנֵּה. Le participe décrit une action imminente avec vivacité ; en français moderne, « je vais frapper » rend mieux cette imminence que le progressif littéral.
- source_word: בַּמַּטֶּה אֲשֶׁר בְּיָדִי
  choice: de mon bâton
  rationale: Le français condense naturellement « avec le bâton qui est dans ma main ». « Bâton » est clair et courant pour מַטֶּה, et « de » convient au verbe « frapper » pour marquer l’instrument.
- source_word: עַל הַמַּיִם אֲשֶׁר בַּיְאֹר
  choice: les eaux du Nil
  rationale: Préserve le pluriel hébreu « les eaux » et identifie יְאֹר comme le Nil dans ce contexte. La formulation française exprime naturellement les eaux qui se trouvent dans le fleuve.
- source_word: וְנֶהֶפְכוּ לְדָם
  choice: et elles se changeront en sang
  rationale: Le pluriel s’accorde avec « les eaux ». La tournure pronominale rend clairement le changement d’état sans imposer un agent grammatical absent de la forme hébraïque.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Sens de « savoir » dans כִּי אֲנִי יְהוָה
  choice: tu reconnaîtras que je suis Yahweh
  alternative: tu sauras que je suis Yahweh
  rationale: Dans le récit des plaies, la connaissance résulte d’une manifestation de la puissance et de l’identité divines. « Reconnaîtras » rend cette nuance sans ajouter une adhésion spirituelle que le texte n’explicite pas.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. Le tutoiement singulier reflète l’adresse à Pharaon. La citation directe clarifie que Moïse transmet les paroles de Yahweh. Le pluriel concret « les eaux » est conservé, ce qui permet de respecter aussi l’accord pluriel du verbe hébreu.
