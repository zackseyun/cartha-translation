base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/022.yaml
  text: But the magicians of Egypt did the same by their secret arts[a], and Pharaoh’s heart was hardened, and he did not listen to them[b], just as Yahweh had spoken.
translation:
  language: fr
  text: Mais les magiciens d’Égypte firent de même par leurs pratiques secrètes[a]. Le cœur du pharaon s’endurcit[b], et il ne les écouta pas, comme Yahweh l’avait dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par leurs enchantements » ou « par leurs pratiques occultes ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le cœur du pharaon fut endurci ». L’hébreu ne précise pas explicitement, dans ce verset, qui ou quoi provoque cet endurcissement.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: firent de même
  rationale: Rend naturellement l’expression « ils firent ainsi » et relie clairement leur action au signe précédent.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: les magiciens d’Égypte
  rationale: Désigne clairement, dans ce contexte, les spécialistes rituels égyptiens qui reproduisent les signes.
- source_word: בְּלָטֵיהֶם
  choice: par leurs pratiques secrètes
  rationale: Conserve à la fois la valeur instrumentale de la préposition et l’idée de procédés magiques cachés, sans préciser indûment leur nature.
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: Le cœur du pharaon s’endurcit
  rationale: Formulation intransitive qui exprime le changement ou l’état résultant sans nommer un agent que l’hébreu ne précise pas ici.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: il ne les écouta pas
  rationale: Rend simplement שׁמע אֶל au sens d’écouter ou de prêter attention; le pronom renvoie à Moïse et Aaron dans le contexte.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: comme Yahweh l’avait annoncé
  rationale: La formule renvoie à une parole antérieure de Yahweh; « annoncé » exprime ici naturellement cette déclaration préalable.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Agent de l’endurcissement du cœur du pharaon
  choice: Le cœur du pharaon s’endurcit
  alternative: Le cœur du pharaon fut endurci / Le pharaon endurcit son cœur
  rationale: L’hébreu ne nomme explicitement ici ni Dieu ni le pharaon comme agent. La tournure intransitive préserve cette indétermination et la tension théologique du récit.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique soutenu sans archaïsme excessif. « Pharaon » est traité ici comme un titre précédé de l’article.
