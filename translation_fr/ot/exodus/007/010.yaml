  text: וַ/יָּבֹ֨א מֹשֶׁ֤ה וְ/אַהֲרֹן֙ אֶל פַּרְעֹ֔ה וַ/יַּ֣עַשׂוּ כֵ֔ן כַּ/אֲשֶׁ֖ר צִוָּ֣ה יְהוָ֑ה וַ/יַּשְׁלֵ֨ךְ אַהֲרֹ֜ן אֶת מַטֵּ֗/הוּ לִ/פְנֵ֥י פַרְעֹ֛ה וְ/לִ/פְנֵ֥י עֲבָדָ֖י/ו וַ/יְהִ֥י לְ/תַנִּֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/010.yaml
  text: So Moses and Aaron went in to Pharaoh[a], and they did so, just as Yahweh had commanded. Then Aaron threw down his staff before Pharaoh and before his servants, and it became a serpent.
translation:
  language: fr
  text: Moïse et Aaron se rendirent donc auprès de Pharaon et firent exactement ce que Yahweh avait ordonné. Aaron jeta son bâton devant Pharaon et devant ses serviteurs, et le bâton devint un serpent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu tannîn peut aussi désigner une créature semblable à un dragon ou un grand reptile; ici, il désigne vraisemblablement un serpent dans le signe accompli devant Pharaon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: se rendirent auprès de
  rationale: Le verbe, bien qu’au singulier devant le sujet composé « Moïse et Aaron », a ici une valeur collective. « Se rendirent auprès de » exprime naturellement leur entrée en présence de Pharaon.
- source_word: וַיַּעַשׂוּ כֵן
  choice: firent exactement ce que
  rationale: Cette formulation française rend idiomatiquement l’exécution fidèle du commandement, en lien avec la proposition comparative qui suit.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: exactement ce que … avait ordonné
  rationale: La tournure marque la conformité à un ordre antérieur; le plus-que-parfait situe naturellement cet ordre avant l’action racontée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel exprimé par le tétragramme, sans le remplacer par un titre.
- source_word: וַיַּשְׁלֵךְ
  choice: jeta
  rationale: Le verbe désigne l’action de lancer ou de jeter; « jeta » est direct, actuel et adapté au geste accompli devant la cour.
- source_word: מַטֵּהוּ
  choice: son bâton
  rationale: « Bâton » est le terme français courant pour l’objet tenu par Aaron et employé dans les signes.
- source_word: לִפְנֵי ... וְלִפְנֵי
  choice: devant … et devant
  rationale: La répétition est conservée afin de respecter l’insistance hébraïque sur le caractère public du signe.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Le mot peut désigner des serviteurs ou, dans un cadre royal, des hauts fonctionnaires. « Serviteurs » préserve le sens lexical sans fermer la nuance de cour.
- source_word: וַיְהִי לְתַנִּין
  choice: le bâton devint un serpent
  rationale: תַנִּין possède un champ sémantique plus large, mais « serpent » convient au signe accompli ici. La reprise explicite de « le bâton » évite en français une ambiguïté de référent.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le nom divin. « Yahweh » le conserve comme nom propre plutôt que de lui substituer un titre.
- issue: Rendu de תַנִּין
  choice: serpent
  alternative: créature semblable à un dragon; grand reptile
  rationale: Dans ce récit de signe devant Pharaon, « serpent » est le rendu contextuel le plus naturel, tout en signalant en note que le terme hébreu est plus large afin de ne pas effacer son ambiguïté lexicale.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination narrative reste claire sans reproduire mécaniquement chaque waw hébreu. La répétition « devant … et devant » est maintenue, tandis que « exactement ce que » rend de façon idiomatique l’obéissance conforme au commandement.
