source:
  edition: WLC
  text: לֵ֣ךְ אֶל פַּרְעֹ֞ה בַּ/בֹּ֗קֶר הִנֵּה֙ יֹצֵ֣א הַ/מַּ֔יְמָ/ה וְ/נִצַּבְתָּ֥ לִ/קְרָאת֖/וֹ עַל שְׂפַ֣ת הַ/יְאֹ֑ר וְ/הַ/מַּטֶּ֛ה אֲשֶׁר נֶהְפַּ֥ךְ לְ/נָחָ֖שׁ תִּקַּ֥ח בְּ/יָדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/015.yaml
  text: Go to Pharaoh in the morning[a]. Look, he is going out to the water, and you shall stand to meet him on the bank of the Nile[b], and you shall take in your hand the staff that was turned into a serpent.
translation:
  language: fr
  text: Va trouver le pharaon le matin. Voici, il sort vers l’eau ; tiens-toi à sa rencontre sur la rive du Nil[a], et prends dans ta main le bâton qui s’était changé en serpent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du fleuve ». Dans l’Exode, le mot hébreu désigne généralement le Nil.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne un serpent ; selon le contexte, il peut aussi être rendu par « snake » ou « serpent » en anglais.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ אֶל־פַּרְעֹה
  choice: Va trouver le pharaon
  rationale: L’impératif לֵךְ suivi de אֶל indique le déplacement vers une personne. « Va trouver » est naturel en français et convient au fait que Moïse doit se présenter devant le pharaon.
- source_word: בַּבֹּקֶר
  choice: le matin
  rationale: Expression temporelle rendue simplement et naturellement en français moderne.
- source_word: הִנֵּה יֹצֵא הַמַּיְמָה
  choice: Il sortira vers l’eau
  rationale: הִנֵּה attire l’attention sur une circonstance imminente ou observable, tandis que le participe יֹצֵא présente l’action attendue. Le futur français exprime ici naturellement ce rendez-vous annoncé, sans ajouter de motif au déplacement.
- source_word: וְנִצַּבְתָּ לִקְרָאתוֹ
  choice: tiens-toi devant lui
  rationale: Le nifal de נצב exprime le fait de prendre position, et לִקְרָאתוֹ celui de se placer à sa rencontre. « Tiens-toi devant lui » conserve la posture concrète et la dimension de rencontre.
- source_word: עַל שְׂפַת הַיְאֹר
  choice: sur la rive du Nil
  rationale: שָׂפָה désigne ici le bord ou la rive. Dans le contexte de l’Exode, יְאֹר renvoie spécifiquement au Nil.
- source_word: הַמַּטֶּה
  choice: le bâton
  rationale: מַטֶּה peut désigner un bâton ou une verge. « Bâton » est courant, concret et digne en français moderne.
- source_word: אֲשֶׁר נֶהְפַּךְ לְנָחָשׁ
  choice: qui s’est changé en serpent
  rationale: Le nifal נֶהְפַּךְ peut se rendre naturellement par « s’est changé ». « Serpent » est le terme français usuel et littéraire correspondant à נָחָשׁ.
- source_word: תִּקַּח בְּיָדֶךָ
  choice: Prends dans ta main
  rationale: L’imparfait hébreu a ici une valeur injonctive. L’impératif français restitue clairement la commande et conserve l’expression concrète « dans ta main ».
theological_decisions:
- issue: Identification de יְאֹר
  choice: le Nil
  alternative: le fleuve
  rationale: Dans le cadre égyptien de l’Exode, יְאֹר désigne le Nil. Cette explicitation historique améliore la clarté sans introduire d’interprétation doctrinale.
- issue: Valeur de נֶהְפַּךְ
  choice: s’est changé en serpent
  alternative: a été changé en serpent
  rationale: La forme nifal permet une tournure française pronominale ou passive. « S’est changé » préserve la formulation concise sans préciser explicitement l’agent du changement.
translation_notes:
  register: Français international moderne, direct et digne. Le verset emploie le tutoiement narratif traditionnel pour l’adresse divine à Moïse. Les impératifs rendent nettement la suite d’instructions, tandis que « Il sortira vers l’eau » conserve le caractère annoncé de la scène sans expliquer pourquoi le pharaon s’y rend.
