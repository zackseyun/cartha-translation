  text: וּ/מֹשֶׁה֙ בֶּן שְׁמֹנִ֣ים שָׁנָ֔ה וְ/אַֽהֲרֹ֔ן בֶּן שָׁלֹ֥שׁ וּ/שְׁמֹנִ֖ים שָׁנָ֑ה בְּ/דַבְּרָ֖/ם אֶל פַּרְעֹֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/007.yaml
  text: Moses was eighty years old[a], and Aaron was eighty-three years old, when they spoke to Pharaoh.
translation:
  language: fr
  text: Moïse avait quatre-vingts ans[a], et Aaron quatre-vingt-trois ans, lorsqu’ils parlèrent au pharaon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Moïse était fils de quatre-vingts ans, et Aaron fils de trois et quatre-vingts ans, lorsqu’ils parlèrent au pharaon. »'
    reason: Alternative lexicale reproduisant l’expression hébraïque de l’âge et l’ordre des nombres.
lexical_decisions:
- source_word: בֶּן ... שָׁנָה
  choice: avait … ans
  rationale: L’hébreu exprime littéralement l’âge par « fils de … années » ; le français moderne emploie naturellement « avoir … ans ».
- source_word: שְׁמֹנִים שָׁנָה
  choice: quatre-vingts ans
  rationale: Expression cardinale indiquant l’âge de Moïse ; « quatre-vingts » prend ici un s puisqu’il n’est pas suivi d’un autre nombre.
- source_word: שָׁלֹשׁ וּשְׁמֹנִים שָׁנָה
  choice: quatre-vingt-trois ans
  rationale: L’ordre hébreu est littéralement « trois et quatre-vingts » ; l’ordre usuel en français est « quatre-vingt-trois ».
- source_word: בְּדַבְּרָם
  choice: lorsqu’ils parlèrent
  rationale: 'La préposition ב attachée à l’infinitif construit avec suffixe a ici une valeur temporelle : « lorsqu’ils parlèrent ».'
- source_word: אֶל פַּרְעֹה
  choice: au pharaon
  rationale: Dans le contexte d’une parole adressée à quelqu’un, אֶל se rend naturellement par « à » ; « pharaon » est ici employé comme titre avec l’article français.
- source_word: וּ/מֹשֶׁה
  choice: Moïse
  rationale: Le waw initial assure la continuité narrative, mais il n’est pas nécessaire de le rendre explicitement en français ; l’ajout de « Or » ou « Et » alourdirait la phrase.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple « parlèrent » convient au récit écrit et marque l’événement ponctuel, tandis que l’imparfait « avait » exprime l’âge comme circonstance de fond. La répétition de « avait » est évitée devant Aaron sans perte de clarté.
