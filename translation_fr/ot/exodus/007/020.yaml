source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵן֩ מֹשֶׁ֨ה וְ/אַהֲרֹ֜ן כַּ/אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֗ה וַ/יָּ֤רֶם בַּ/מַּטֶּה֙ וַ/יַּ֤ךְ אֶת הַ/מַּ֨יִם֙ אֲשֶׁ֣ר בַּ/יְאֹ֔ר לְ/עֵינֵ֣י פַרְעֹ֔ה וּ/לְ/עֵינֵ֖י עֲבָדָ֑י/ו וַ/יֵּהָֽפְכ֛וּ כָּל הַ/מַּ֥יִם אֲשֶׁר בַּ/יְאֹ֖ר לְ/דָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/020.yaml
  text: So Moses and Aaron did so[a], just as Yahweh had commanded. And he raised the staff and struck the water that was in the Nile before Pharaoh's eyes and before the eyes of his servants, and all the water that was in the Nile was turned to blood.
translation:
  language: fr
  text: Moïse et Aaron firent ainsi, exactement comme Yahweh l’avait ordonné. Il[a] leva le bâton et frappa l’eau du Nil[b], sous les yeux du pharaon et sous les yeux de ses serviteurs. Toute l’eau du Nil se changea en sang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu dit simplement « il »; le référent n’est pas nommé dans ce verset, bien que le contexte puisse suggérer Aaron.
    reason: ambiguïté du référent
  - marker: b
    text: 'Hébreu : « le fleuve »; dans l’Exode, ce terme désigne habituellement le Nil.'
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: firent ainsi
  rationale: Rend naturellement l’accomplissement conforme à l’ordre précédent, tout en restant proche de la formulation hébraïque.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: exactement comme … l’avait ordonné
  rationale: « Exactement comme » exprime la conformité marquée par כַּאֲשֶׁר; le plus-que-parfait situe naturellement l’ordre avant son exécution.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: וַיָּרֶם
  choice: Il leva
  rationale: Préserve le verbe au singulier et, par conséquent, l’absence de sujet explicitement nommé dans cette proposition.
- source_word: בַּמַּטֶּה
  choice: le bâton
  rationale: « Bâton » est le terme courant et naturel dans ce récit pour מַטֶּה.
- source_word: וַיַּךְ אֶת־הַמַּיִם
  choice: frappa l’eau
  rationale: Rend directement l’action physique exprimée par נכה.
- source_word: הַיְאֹר
  choice: le Nil
  rationale: Dans le contexte égyptien de l’Exode, יְאֹר désigne spécifiquement le Nil; une note conserve toutefois le sens lexical « fleuve ».
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  choice: sous les yeux de
  rationale: Expression française idiomatique qui conserve l’accent hébraïque sur le caractère public et visible de l’acte.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Conserve le sens général de עֶבֶד sans préciser indûment leur rang ou leur fonction.
- source_word: וַיֵּהָפְכוּ ... לְדָם
  choice: se changea en sang
  rationale: Expression naturelle en français qui rend le changement d’état; le singulier convient au nom collectif « eau ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » maintient le nom personnel de l’alliance sans le remplacer par un titre.
- issue: Identité de celui qui lève le bâton et frappe l’eau
  choice: Maintien du pronom singulier « Il », avec note explicative
  alternative: Aaron leva le bâton
  rationale: Les verbes hébreux sont au singulier, mais leur sujet n’est pas nommé dans ce verset. Le contexte précédent peut orienter vers Aaron, sans que le présent verset l’explicite.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition hébraïque littérale « sous les yeux du pharaon et sous les yeux de ses serviteurs » est légèrement resserrée en français sans perdre l’idée d’une action accomplie publiquement devant les deux groupes.
