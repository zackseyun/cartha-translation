  text: So Moses and Aaron did just as Yahweh had commanded them[a]; so they did.
translation:
  language: fr
  text: Moïse et Aaron firent comme Yahweh[a] leur avait ordonné ; ils firent ainsi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque du nom divin et son rendu traditionnel.
lexical_decisions:
- source_word: וַיַּעַשׂ … עָשׂוּ
  choice: firent … ils firent
  rationale: Le verbe עשה signifie largement « faire » ou « agir ». La répétition française conserve l’insistance de l’hébreu sur leur obéissance, même si elle est stylistiquement marquée.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Moïse et Aaron
  rationale: Formes françaises usuelles de ces noms propres, reliées par une coordination simple.
- source_word: כַּאֲשֶׁר
  choice: exactement ce que
  rationale: Dans ce contexte, l’expression marque la pleine conformité de leur action au commandement reçu. Cette formulation est naturelle en français moderne.
- source_word: צִוָּה
  choice: avait ordonné
  rationale: Le verbe צוה exprime un ordre. Le plus-que-parfait indique naturellement que l’ordre précède son exécution dans le récit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française courante du tétragramme, qui préserve ici le nom divin plutôt que de lui substituer un titre.
- source_word: אֹתָם
  choice: leur
  rationale: Le suffixe de troisième personne du pluriel renvoie à Moïse et Aaron ; « leur » convient à la construction française avec « ordonner ».
- source_word: כֵּן
  choice: c’est bien ainsi
  rationale: Cette tournure reprend avec insistance la conformité entre l’ordre et son exécution, tout en restant intelligible en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » conserve le nom propre tout en signalant en note le rendu traditionnel par un titre.
translation_notes:
  register: Français moderne, international et digne. La répétition finale, inhabituelle mais significative, est maintenue afin de préserver l’insistance rhétorique de l’hébreu.
