base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/028.yaml
  text: The Nile will swarm with frogs[a], and they will come up and enter your house, your bedroom, and your bed, and the houses of your servants and your people, and your ovens and your kneading bowls.
translation:
  language: fr
  text: Le Nil grouillera de grenouilles. Elles monteront et entreront dans ta maison, dans ta chambre à coucher et jusque sur ton lit, ainsi que dans les maisons de tes serviteurs et parmi ton peuple, dans tes fours et dans tes pétrins[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « bacs à pétrir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁרַץ
  choice: grouillera
  rationale: Le verbe שׁרץ évoque la prolifération et le fourmillement de petites créatures. « Grouillera » en conserve la force imagée et reçoit ici sa valeur future du contexte de l’annonce du fléau.
- source_word: הַיְאֹר
  choice: Le Nil
  rationale: Dans le cadre égyptien de l’Exode, יְאֹר désigne ici précisément le Nil plutôt qu’un cours d’eau indéterminé.
- source_word: צְפַרְדְּעִים
  choice: grenouilles
  rationale: Équivalent français direct du nom hébreu au pluriel.
- source_word: וְעָלוּ
  choice: Elles monteront
  rationale: עלה décrit le mouvement des grenouilles qui quittent le fleuve en montant vers les habitations. La formulation garde le mouvement ascendant sans ajouter un point de départ absent de l’expression elle-même.
- source_word: וּבָאוּ
  choice: entreront
  rationale: Avec les compléments introduits par ב, בוא exprime ici l’entrée successive des grenouilles dans les différents lieux.
- source_word: בְּבֵיתֶךָ
  choice: dans ta maison
  rationale: בית désigne dans cette énumération la demeure physique du pharaon, non sa maisonnée au sens collectif.
- source_word: וּבַחֲדַר מִשְׁכָּבְךָ
  choice: dans ta chambre à coucher
  rationale: Littéralement « dans la chambre de ton coucher » ; « chambre à coucher » est l’équivalent français moderne et précis.
- source_word: וְעַל מִטָּתֶךָ
  choice: jusque sur ton lit
  rationale: « Sur ton lit » rend exactement la préposition על. « Jusque » explicite naturellement en français la progression envahissante de l’énumération sans en changer le contenu.
- source_word: וּבְבֵית עֲבָדֶיךָ
  choice: dans les maisons de tes serviteurs
  rationale: 'Le singulier construit בית devant un possesseur pluriel se comprend distributivement : les demeures respectives des serviteurs.'
- source_word: וּבְעַמֶּךָ
  choice: parmi ton peuple
  rationale: Le sens locatif de ב avec un groupe humain se rend naturellement par « parmi ». Cette formulation évite l’expression française anormale « entrer dans ton peuple » tout en préservant l’extension du fléau à la population.
- source_word: וּבְתַנּוּרֶיךָ
  choice: dans tes fours
  rationale: תנור désigne les fours domestiques servant notamment à la cuisson du pain.
- source_word: וּבְמִשְׁאֲרוֹתֶיךָ
  choice: dans tes pétrins
  rationale: Le terme désigne des récipients où l’on prépare ou pétrit la pâte. « Pétrins » est concis et compréhensible, tandis qu’une autre forme possible du récipient est signalée en note.
