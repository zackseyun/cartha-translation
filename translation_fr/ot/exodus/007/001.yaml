  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רְאֵ֛ה נְתַתִּ֥י/ךָ אֱלֹהִ֖ים לְ/פַרְעֹ֑ה וְ/אַהֲרֹ֥ן אָחִ֖י/ךָ יִהְיֶ֥ה נְבִיאֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/001.yaml
  text: Then Yahweh said to Moses[a], “See, I have made you God to Pharaoh, and Aaron your brother will be your prophet.”
translation:
  language: fr
  text: 'Alors Yahweh dit à Moïse : « Vois, je t’ai établi Dieu pour Pharaon[a], et ton frère Aaron sera ton prophète. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « je t’ai donné Dieu pour Pharaon ». Dans cette scène, l’expression présente Moïse comme exerçant l’autorité divine face à Pharaon, tandis qu’Aaron est son prophète.'
    reason: Clarification de l’expression hébraïque inhabituelle et de sa portée fonctionnelle, sans ajouter une comparaison absente du texte.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel révélé dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait avancer le récit; « Alors » en restitue naturellement la valeur séquentielle.
- source_word: רְאֵה
  choice: Vois
  rationale: L’impératif attire l’attention de Moïse sur la déclaration qui suit et conserve la forme concise de l’hébreu.
- source_word: נְתַתִּיךָ
  choice: je t’ai établi
  rationale: Le verbe signifie littéralement « je t’ai donné », mais avec l’attribut אֱלֹהִים il exprime ici l’établissement de Moïse dans une fonction déterminée.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: L’hébreu dit directement « Dieu », sans particule comparative. La formulation conserve cette force tout en laissant le contexte préciser qu’il s’agit du rôle représentatif de Moïse face à Pharaon.
- source_word: לְפַרְעֹה
  choice: pour Pharaon
  rationale: La préposition לְ marque ici la relation dans laquelle Moïse est établi; « pour Pharaon » est naturel en français et préserve cette relation.
- source_word: נְבִיאֶךָ
  choice: ton prophète
  rationale: Le terme hébreu usuel pour « prophète » doit être conservé, puisque le parallélisme avec la fonction de Moïse est intentionnel.
- source_word: יִהְיֶה
  choice: sera
  rationale: Le futur simple rend naturellement la valeur prospective du verbe.
theological_decisions:
- issue: Moïse qualifié d’אֱלֹהִים par rapport à Pharaon
  choice: « Dieu pour Pharaon » dans le texte
  alternative: « comme Dieu pour Pharaon »
  rationale: L’original ne comporte aucun marqueur explicite de comparaison. Traduire directement préserve l’ambiguïté et la tension du texte; la relation avec Pharaon et le rôle d’Aaron comme prophète indiquent une autorité représentative sans qu’il soit nécessaire d’ajouter « comme » au texte.
translation_notes:
  register: Français international moderne, sobre et digne. « Vois » garde l’impératif bref de l’hébreu; « établi » évite le calque peu naturel « donné » tout en exprimant la fonction conférée. Le marqueur [a] est placé après la proposition entière qu’il explique.
