  text: וְ/יָדְע֤וּ מִצְרַ֨יִם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בִּ/נְטֹתִ֥/י אֶת יָדִ֖/י עַל מִצְרָ֑יִם וְ/הוֹצֵאתִ֥י אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מִ/תּוֹכָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/005.yaml
  text: And the Egyptians will know that I am Yahweh when I stretch out my hand against Egypt and bring the sons of Israel out from among them[a][b].
translation:
  language: fr
  text: Les Égyptiens sauront que je suis Yahweh[a] quand j’étendrai ma main contre l’Égypte et que je ferai sortir les fils d’Israël[b] de leur milieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom divin est YHWH, rendu ici par « Yahweh ». Il est traditionnellement remplacé par « le SEIGNEUR » dans de nombreuses traductions françaises.
    reason: alternative_reading
  - marker: b
    text: Ou « les Israélites » ou « les enfants d’Israël ». L’hébreu dit littéralement « les fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Les Égyptiens sauront
  rationale: Le parfait qal avec waw a ici une valeur prédictive. « Sauront » rend directement la reconnaissance à venir suscitée par les actes de Dieu.
- source_word: מִצְרַיִם
  choice: les Égyptiens / l’Égypte
  rationale: La première occurrence désigne les habitants, conformément au verbe au pluriel; la seconde désigne le pays ou la nation visée par l’action divine.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit le contenu de ce que les Égyptiens sauront.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est conservé comme nom propre plutôt que remplacé par un titre.
- source_word: בִּנְטֹתִי
  choice: quand j’étendrai
  rationale: La préposition ב avec l’infinitif construit exprime ici le moment ou la circonstance des actes par lesquels les Égyptiens reconnaîtront Yahweh.
- source_word: יָדִי
  choice: ma main
  rationale: L’image anthropomorphique concrète de l’hébreu est maintenue; elle évoque la puissance agissante sans être paraphrasée.
- source_word: עַל מִצְרָיִם
  choice: contre l’Égypte
  rationale: Dans ce contexte de jugement, « contre » exprime naturellement l’orientation hostile de l’action.
- source_word: וְהוֹצֵאתִי
  choice: et que je ferai sortir
  rationale: La tournure causative du hifil est rendue explicitement, tout en coordonnant naturellement les deux actes dans la proposition temporelle.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression familiale et la forme masculine plurielle du texte source; une note indique les équivalents français plus idiomatiques.
- source_word: מִתּוֹכָם
  choice: de leur milieu
  rationale: La traduction conserve l’idée d’une sortie hors du milieu des Égyptiens dans un français naturel et digne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: YHWH; le Seigneur
  rationale: Le texte porte directement le Tétragramme. La traduction conserve le nom personnel et signale en note la convention traditionnelle qui le remplace par un titre.
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites; les enfants d’Israël; le peuple d’Israël
  rationale: Le choix expose la formulation familiale de l’hébreu sans exclure en note les formulations collectives courantes. Le contexte concerne l’ensemble du peuple.
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe reste proche de l’enchaînement hébreu tout en employant une coordination temporelle naturelle. Les images concrètes « ma main » et « de leur milieu » sont conservées.
