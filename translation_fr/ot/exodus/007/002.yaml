  text: אַתָּ֣ה תְדַבֵּ֔ר אֵ֖ת כָּל אֲשֶׁ֣ר אֲצַוֶּ֑/ךָּ וְ/אַהֲרֹ֤ן אָחִ֨י/ךָ֙ יְדַבֵּ֣ר אֶל פַּרְעֹ֔ה וְ/שִׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/002.yaml
  text: You shall speak all that I command you[a], and Aaron your brother shall speak to Pharaoh, that he may send the sons of Israel out from his land.
translation:
  language: fr
  text: Toi, tu diras tout ce que je t’ordonnerai, et Aaron, ton frère, parlera au pharaon, et le pharaon laissera partir les fils d’Israël[a] de son pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites »; traditionnellement « les enfants d’Israël ». L’hébreu dit littéralement « les fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה תְדַבֵּר
  choice: Toi, tu diras
  rationale: Le pronom indépendant אַתָּה met le sujet en relief. « Toi, tu diras » conserve cette insistance et rend naturellement en français la valeur directive de l’inaccompli.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּךָּ
  choice: tout ce que je t’ordonnerai
  rationale: L’inaccompli אֲצַוֶּךָּ peut viser les ordres que Dieu donnera au cours de la mission. Le futur français s’accorde avec « tu diras » sans limiter la portée globale de כָּל.
- source_word: וְאַהֲרֹן אָחִיךָ
  choice: et Aaron, ton frère
  rationale: Cette formulation suit l’ordre hébreu et reste idiomatique en français; l’apposition est clairement marquée par des virgules.
- source_word: יְדַבֵּר אֶל פַּרְעֹה
  choice: parlera au pharaon
  rationale: דבר avec אֶל indique ici une parole adressée à quelqu’un. « Parlera au pharaon » évite de préciser un contenu que le texte ne formule pas dans ce segment.
- source_word: וְשִׁלַּח
  choice: et celui-ci laissera partir
  rationale: Le piel de שׁלח exprime ici le fait de renvoyer ou de laisser partir. « Celui-ci » désigne clairement le pharaon, tandis que la coordination par « et » conserve la forme hébraïque sans transformer explicitement la proposition en but.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction garde l’expression généalogique et la texture de l’hébreu. Une note signale l’équivalent collectif plus courant « les Israélites ».
- source_word: מֵאַרְצוֹ
  choice: de son pays
  rationale: La préposition מִן marque l’éloignement hors du territoire du pharaon. Avec « laisser partir », le français « de son pays » exprime naturellement ce mouvement.
theological_decisions:
- issue: Rapport entre la parole d’Aaron et le départ accordé par le pharaon
  choice: 'Coordination: « et celui-ci laissera partir »'
  alternative: 'Subordination de but ou de résultat: « pour qu’il laisse partir » / « de sorte qu’il laissera partir »'
  rationale: Le waw devant וְשִׁלַּח permet une lecture séquentielle ou résultative. La coordination reproduit cette souplesse et n’impose pas une nuance précise de but, de possibilité ou de résultat garanti.
translation_notes:
  register: Français international moderne, digne et direct. La reprise « Toi, tu » conserve l’emphase du pronom hébreu; « pharaon » est traité comme un titre avec article et minuscule. La formulation reste proche de la structure source tout en évitant les tours artificiels.
