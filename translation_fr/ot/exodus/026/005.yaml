    reason: lexical_alternative
  revision_rationale: La révision remplace la relation possessive implicite par la relation spatiale exprimée dans l'hébreu et formule la correspondance des boucles de manière plus naturelle en français. Elle conserve l'ambiguïté de « une tenture » et l'image de l'idiome dans la note.
