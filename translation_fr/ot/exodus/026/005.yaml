base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/005.yaml
  text: You shall make fifty loops on the one curtain[a], and you shall make fifty loops on the edge of the curtain that is in the second set; the loops shall be opposite one another.
translation:
  language: fr
  text: Tu feras cinquante boucles sur une tenture, et tu feras cinquante boucles au bord de la tenture qui est dans le second assemblage. Les boucles se feront face les unes aux autres[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les boucles, une femme vers sa sœur ». Cette expression hébraïque signifie ici que chaque boucle correspond à celle qui lui fait face.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: boucles
  rationale: Le nom désigne les attaches souples en forme de boucle qui permettent de réunir les tentures. « Boucles » les distingue clairement des agrafes métalliques du verset suivant.
- source_word: יְרִיעָה
  choice: tenture
  rationale: Dans le contexte du sanctuaire, le terme désigne une grande pièce d’étoffe. « Tenture » est précis, naturel et plus adapté ici que « rideau », qui pourrait suggérer une fonction différente.
- source_word: הָאֶחָת
  choice: une
  rationale: L’hébreu dit littéralement « l’une » ou « la [tenture] une ». « Une tenture » conserve cette formulation sans introduire explicitement une succession par « première ».
- source_word: קְצֵה
  choice: bord
  rationale: Le mot désigne ici la limite extérieure de la tenture où les boucles sont fixées. « Bord » convient précisément au travail textile décrit.
- source_word: מַחְבֶּרֶת
  choice: assemblage
  rationale: Le terme renvoie au groupe de tentures réunies décrit dans les versets précédents. « Assemblage » exprime à la fois l’action de joindre et l’ensemble ainsi formé.
- source_word: הַשֵּׁנִית
  choice: second
  rationale: Le terme ordinal identifie explicitement le deuxième des deux assemblages.
- source_word: מַקְבִּילֹת
  choice: placées face à face
  rationale: Le participe indique que les boucles des deux bords se correspondent spatialement. Cette formulation française rend clairement leur alignement réciproque.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: face à face
  rationale: L’expression idiomatique, littéralement « une femme vers sa sœur », décrit ici des éléments correspondants disposés l’un en regard de l’autre. Le sens est rendu dans le texte et l’image hébraïque est conservée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire technique reste accessible; la répétition de « tu feras cinquante boucles » reproduit la structure emphatique de l’hébreu. L’ambiguïté de הָאֶחָת n’est pas résolue en « première ».
