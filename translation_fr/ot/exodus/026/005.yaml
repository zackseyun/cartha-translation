- from: Tu feras cinquante boucles sur une tenture, et tu feras cinquante boucles au bord de la tenture qui appartient au second assemblage. Les boucles seront placées face à face[a].
  to: Tu feras cinquante boucles sur une tenture, et tu feras cinquante boucles au bord de la tenture qui est dans le second assemblage. Les boucles se feront face les unes aux autres[a].
  rationale: La révision remplace la relation possessive implicite par la relation spatiale exprimée dans l'hébreu et formule la correspondance des boucles de manière plus naturelle en français. Elle conserve l'ambiguïté de « une tenture » et l'image de l'idiome dans la note.
  reviewer_model: gpt-5.6-terra
