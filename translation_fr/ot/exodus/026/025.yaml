  yaml_path: translation/ot/exodus/026/025.yaml
  text: 'There shall be eight frames[a], with their silver bases: sixteen bases[b], two bases under one frame and two bases under the other frame.'
translation:
  language: fr
  text: 'Il y aura huit panneaux[a], avec leurs bases[b] en argent : seize bases, deux bases sous un panneau et deux bases sous l’autre panneau.'
  philosophy: optimal-equivalence
  footnotes:
