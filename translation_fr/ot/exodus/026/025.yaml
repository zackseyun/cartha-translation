lexical_decisions:
- source_word: קְרָשִׁים
  choice: cadres
  rationale: Dans le contexte de la construction du sanctuaire, le terme désigne des éléments verticaux de la structure. « Cadres » exprime leur fonction architecturale en français moderne, tandis que « planches » demeure une possibilité lexicale.
- source_word: אַדְנֵי/הֶם ... אֲדָנִים
  choice: bases
  rationale: Le nom désigne les pièces de soutien placées sous les cadres. « Bases » est clair et naturel en français courant; « socles » est une autre traduction possible.
- source_word: כֶּסֶף
  choice: argent
  rationale: Désignation directe du matériau dont les bases sont faites.
- source_word: שִׁשָּׁה עָשָׂר
  choice: seize
  rationale: Rendu normal du nombre cardinal hébreu.
- source_word: תַּחַת
  choice: sous
  rationale: Rendu spatial direct et naturel dans ces instructions de construction.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: un cadre ... l’autre cadre
  rationale: L’hébreu répète littéralement « le cadre unique/un ». La formulation distributive « un cadre ... l’autre cadre » conserve la répartition indiquée sans introduire une idée de succession.
- source_word: וְהָיוּ
  choice: Il y aura
  rationale: Formulation existentielle naturelle en français pour une prescription de construction; la conjonction initiale n’exige pas ici un « et » distinct.
