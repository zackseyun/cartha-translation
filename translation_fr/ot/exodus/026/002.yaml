  text: אֹ֣רֶךְ הַ/יְרִיעָ֣ה הָֽ/אַחַ֗ת שְׁמֹנֶ֤ה וְ/עֶשְׂרִים֙ בָּֽ/אַמָּ֔ה וְ/רֹ֨חַב֙ אַרְבַּ֣ע בָּ/אַמָּ֔ה הַ/יְרִיעָ֖ה הָ/אֶחָ֑ת מִדָּ֥ה אַחַ֖ת לְ/כָל הַ/יְרִיעֹֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/002.yaml
  text: The length of each curtain shall be twenty-eight cubits[a], and the width of each curtain four cubits[b]; all the curtains shall have one measure.
translation:
  language: fr
  text: Chaque tenture aura vingt-huit coudées de long et quatre coudées de large[a] ; toutes les tentures auront les mêmes dimensions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la tenture, l’une… la tenture, l’une » ; l’hébreu emploie une tournure distributive pour préciser les dimensions de chaque tenture.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ
  choice: de long
  rationale: Expression française naturelle pour indiquer la longueur dans une description dimensionnelle.
- source_word: הַיְרִיעָה
  choice: tenture
  rationale: Dans le contexte du sanctuaire, יְרִיעָה désigne une grande pièce d’étoffe servant de couverture; « tenture » convient mieux que « rideau », qui peut suggérer une pièce suspendue verticalement.
- source_word: הָאַחַת / הָאֶחָת
  choice: chaque
  rationale: 'Le syntagme littéral « la tenture, l’une » a ici une valeur distributive : les dimensions valent pour chacune des tentures.'
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: vingt-huit
  rationale: Rendu direct du nombre cardinal hébreu.
- source_word: בָּאַמָּה
  choice: coudées
  rationale: La coudée est l’unité linéaire ancienne désignée par אַמָּה.
- source_word: וְרֹחַב
  choice: et … de large
  rationale: Formulation dimensionnelle courante en français, coordonnée à « de long ».
- source_word: אַרְבַּע
  choice: quatre
  rationale: Rendu direct du nombre cardinal.
- source_word: מִדָּה אַחַת
  choice: les mêmes dimensions
  rationale: Le sens littéral « une seule mesure » indique ici que toutes les tentures ont un format identique; le pluriel français englobe naturellement longueur et largeur déjà précisées.
- source_word: לְכָל הַיְרִיעֹת
  choice: toutes les tentures
  rationale: 'Rend la portée collective du syntagme : une norme dimensionnelle commune s’applique à l’ensemble des tentures.'
