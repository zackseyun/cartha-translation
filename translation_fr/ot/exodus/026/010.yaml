  text: וְ/עָשִׂ֜יתָ חֲמִשִּׁ֣ים לֻֽלָאֹ֗ת עַ֣ל שְׂפַ֤ת הַ/יְרִיעָה֙ הָֽ/אֶחָ֔ת הַ/קִּיצֹנָ֖ה בַּ/חֹבָ֑רֶת וַ/חֲמִשִּׁ֣ים לֻֽלָאֹ֗ת עַ֚ל שְׂפַ֣ת הַ/יְרִיעָ֔ה הַ/חֹבֶ֖רֶת הַ/שֵּׁנִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/010.yaml
  text: And you shall make fifty loops on the edge of the one curtain[a], the outermost one in the set joined together, and fifty loops on the edge of the second curtain that is joined to it.
translation:
  language: fr
  text: Tu feras cinquante boucles au bord de la tenture qui se trouve à l’extrémité de l’ensemble assemblé[a], et cinquante boucles au bord de la tenture située dans le second ensemble.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’ensemble relié ». Le terme hébreu désigne l’unité formée par plusieurs tentures attachées les unes aux autres.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Dans cette suite d’instructions, le parfait qal avec waw exprime une directive. Le futur français rend naturellement cette valeur prescriptive.
- source_word: לֻלָאֹת
  choice: boucles
  rationale: Le nom désigne les boucles de tissu servant à relier les tentures; « boucles » est précis et courant.
- source_word: שְׂפַת
  choice: au bord de
  rationale: Le sens littéral est « lèvre », mais « bord » convient naturellement à une pièce de tissu.
- source_word: הַיְרִיעָה
  choice: tenture
  rationale: Dans le contexte du sanctuaire, le terme désigne une grande pièce textile. « Tenture » est clair, digne et adapté à cet ouvrage.
- source_word: הָאֶחָת
  choice: l’une des tentures
  rationale: L’hébreu dit littéralement « l’une », sans employer ici l’ordinal « première ». Cette formulation préserve cette nuance.
- source_word: הַקִּיצֹנָה
  choice: celle qui se trouve à l’extrémité
  rationale: L’adjectif désigne la pièce située au bout de l’ensemble; cette formulation est idiomatique en français.
- source_word: בַּחֹבָרֶת
  choice: de l’ensemble assemblé
  rationale: Le nom désigne l’unité obtenue en reliant plusieurs tentures. Cette expression rend à la fois l’ensemble et son mode de constitution.
- source_word: הַחֹבֶרֶת הַשֵּׁנִית
  choice: du second ensemble
  rationale: La construction désigne le second ensemble de tentures reliées. Le français peut laisser implicite la répétition de « assemblé » sans perdre le sens.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement et le futur prescriptif conviennent à l’adresse divine à Moïse. La formulation conserve « l’une » plutôt que de transformer explicitement le mot en « première », tout en rendant lisible l’organisation des deux ensembles.
