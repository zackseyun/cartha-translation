  yaml_path: translation/ot/exodus/026/014.yaml
  text: And you shall make for the tent a covering of rams’ skins dyed red[a], and a covering of tahash skins above.
translation:
  language: fr
  text: Tu feras pour la tente une couverture en peaux de béliers teintes en rouge, et, par-dessus, une couverture en peaux de tahash[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu tahash est incertain. Il peut désigner un animal particulier ou un cuir résistant; parmi les traductions proposées figurent « cuir fin », « peaux de marsouins » et « peaux de dugongs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Dans cette suite d’instructions, le parfait qal précédé de la conjonction a valeur de commandement. Le futur français exprime naturellement cette prescription.
- source_word: מִכְסֶה לָאֹהֶל
  choice: pour la tente une couverture
  rationale: מִכְסֶה désigne une couverture ou couche protectrice, et אֹהֶל signifie littéralement « tente ». Cette formulation respecte la syntaxe et le vocabulaire du texte source.
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: en peaux de béliers teintes en rouge
  rationale: Le terme מְאָדָּמִים indique que les peaux ont été rougies, probablement par teinture. L’accord « teintes » porte clairement sur les peaux.
- source_word: וּמִכְסֵה
  choice: et … une couverture
  rationale: La répétition de « couverture » reflète celle du nom hébreu sans ajouter l’interprétation « une autre ».
- source_word: עֹרֹת תְּחָשִׁים
  choice: en peaux de tahash
  rationale: L’identification de תְּחָשִׁים demeure incertaine. La translittération « tahash » préserve cette incertitude plutôt que d’imposer une espèce animale hypothétique.
- source_word: מִלְמָעְלָה
  choice: par-dessus
  rationale: Dans le contexte des couches successives, l’expression indique que cette couverture est placée au-dessus. « Par-dessus » est naturel en français et n’ajoute aucun démonstratif absent de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le terme concret « tente », la répétition de « couverture » et l’incertitude lexicale de tahash.
