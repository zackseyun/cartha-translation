  text: וְ/סֶ֨רַח֙ הָ/עֹדֵ֔ף בִּ/ירִיעֹ֖ת הָ/אֹ֑הֶל חֲצִ֤י הַ/יְרִיעָה֙ הָ/עֹדֶ֔פֶת תִּסְרַ֕ח עַ֖ל אֲחֹרֵ֥י הַ/מִּשְׁכָּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/012.yaml
  text: And the overhang that remains from the tent curtains[a]—the half curtain that remains over[b]—shall hang over the back of the tabernacle.
translation:
  language: fr
  text: La partie excédentaire des tentures de la tente[a] — la moitié de la tenture qui reste en surplus — retombera sur l’arrière du tabernacle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du surplus qui reste des tentures de la tente ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu distingue ici « la tente », c’est-à-dire la couche de couverture, du « tabernacle », la structure d’habitation.
    reason: cultural_note
lexical_decisions:
- source_word: סֶרַח
  choice: la partie qui dépasse
  rationale: Dans ce contexte architectural, le nom désigne la partie excédentaire qui se prolonge au-delà de la structure. Cette formulation française exprime à la fois le surplus et le dépassement spatial.
- source_word: הָעֹדֵף
  choice: qui dépasse
  rationale: Le participe de עודף désigne ce qui est en excédent. Associé à סֶרַח, « qui dépasse » évite une répétition pesante tout en conservant l’idée de surplus.
- source_word: יְרִיעֹת הָאֹהֶל
  choice: les tentures de la tente
  rationale: « Tentures » convient à de grands pans textiles servant de couverture, et « de la tente » préserve la construction ainsi que la distinction avec le tabernacle mentionné ensuite.
- source_word: חֲצִי הַיְרִיעָה הָעֹדֶפֶת
  choice: la demi-tenture qui reste
  rationale: La formulation garde le singulier et présente clairement la moitié d’une tenture laissée en surplus.
- source_word: תִּסְרַח
  choice: retombera
  rationale: Le verbe décrit ici la partie excédentaire du tissu qui pend ou descend à l’arrière. « Retombera » produit une image naturelle en français pour une étoffe drapée.
- source_word: עַל אֲחֹרֵי הַמִּשְׁכָּן
  choice: sur l’arrière du tabernacle
  rationale: La formulation rend la position de l’étoffe au-dessus ou le long de la face arrière de la structure, tout en conservant le terme cultuel traditionnel « tabernacle ».
theological_decisions:
- issue: Distinction entre אֹהֶל et מִשְׁכָּן
  choice: « tente » puis « tabernacle »
  alternative: Employer « tabernacle » pour les deux termes
  rationale: 'L’hébreu emploie deux noms distincts : la tente comme couche de couverture et le tabernacle comme structure d’habitation. La traduction maintient cette distinction sans lui imposer une interprétation théologique supplémentaire.'
translation_notes:
  register: Français international moderne, digne et concret. Le tiret marque l’apposition explicative du second groupe nominal. « Retombera » décrit naturellement le drapé de l’étoffe sans ajouter l’idée d’une fixation particulière.
