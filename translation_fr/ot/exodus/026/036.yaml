source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ מָסָךְ֙ לְ/פֶ֣תַח הָ/אֹ֔הֶל תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר מַעֲשֵׂ֖ה רֹקֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/036.yaml
  text: You shall make a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
translation:
  language: fr
  text: Tu feras, pour l’entrée de la tente, un rideau[a] en fils bleus, pourpres et écarlates, et en fin lin retors, ouvrage de brodeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tenture » ou « voile » fermant l’entrée ; « rideau » permet ici de le distinguer du voile intérieur décrit plus haut dans ce chapitre.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָסָךְ
  choice: rideau
  rationale: Le terme désigne ici une tenture servant à fermer ou couvrir l’entrée. « Rideau » est naturel en français et la note signale les autres nuances possibles ainsi que sa distinction d’avec le voile intérieur.
- source_word: לְפֶתַח הָאֹהֶל
  choice: pour l’entrée de la tente
  rationale: פֶתַח désigne l’ouverture ou l’entrée, et אֹהֶל la tente. Cette formulation reste directe sans introduire ici le terme plus interprétatif « tabernacle ».
- source_word: תְּכֵלֶת
  choice: fils bleus
  rationale: Le mot désigne une matière teinte d’un bleu prestigieux, peut-être bleu violacé. « Fils bleus » exprime clairement le caractère textile dans cette énumération.
- source_word: אַרְגָּמָן
  choice: fils pourpres
  rationale: Le terme désigne une matière teinte en pourpre. L’adjectif coordonné sous le nom commun « fils » donne une formulation française fluide.
- source_word: תוֹלַעַת שָׁנִי
  choice: fils écarlates
  rationale: L’expression idiomatique désigne une matière teinte en écarlate, et non littéralement le ver producteur du colorant.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: fin lin retors
  rationale: שֵׁשׁ désigne le lin fin et מָשְׁזָר des fils retordus. « Fin lin retors » conserve à la fois la qualité de la matière et son mode de fabrication.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: ouvrage de brodeur
  rationale: La formule met en avant un travail textile décoratif exécuté par un artisan spécialisé. « Ouvrage de brodeur » préserve la construction concise et le registre artisanal.
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Dans la suite d’instructions, le parfait avec waw a une valeur directive. Le futur français convient au registre prescriptif biblique tout en restant actuel.
