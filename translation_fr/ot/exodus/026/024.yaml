base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/024.yaml
  text: They shall be paired at the bottom[a], and together they shall be complete at its top, to the first ring. So it shall be for both of them[c][b]; they shall be for the two corners.
translation:
  language: fr
  text: Les deux planches seront jumelées par le bas[a] et, ensemble, elles seront jointes au sommet[b], jusqu’à l’anneau unique[c]. Il en sera ainsi pour toutes les deux ; elles formeront les deux angles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « appariées en bas » ; l’hébreu décrit les deux planches comme constituant une paire correspondante.
    reason: lexical_alternative
  - marker: b
    text: Ou « entièrement ajustées au sommet » ; le terme hébreu exprime ici l’intégrité structurelle de l’assemblage, non la perfection morale.
    reason: lexical_alternative
  - marker: c
    text: Ou « jusqu’au premier anneau » ; l’expression peut désigner l’anneau qui réunit les deux planches dans leur partie supérieure.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאֲמִים
  choice: jumelées
  rationale: Le terme décrit deux planches appariées. « Jumelées » exprime naturellement en français leur disposition en paire sans préciser une technique d’assemblage que l’hébreu ne détaille pas.
- source_word: מִלְּמַטָּה
  choice: par le bas
  rationale: La préposition מן peut ici marquer le point ou la partie depuis laquelle les planches sont appariées. « Par le bas » conserve cette nuance mieux que le simple « en bas ».
- source_word: וְיַחְדָּו
  choice: ensemble
  rationale: L’adverbe souligne que les deux planches constituent conjointement l’agencement décrit.
- source_word: תַמִּים
  choice: complètes
  rationale: Dans ce contexte architectural, le mot indique l’intégrité ou l’achèvement de l’ensemble, non une perfection morale. Le féminin pluriel s’accorde naturellement avec les planches sous-entendues.
- source_word: עַל רֹאשׁוֹ
  choice: par le haut
  rationale: « Tête » désigne ici l’extrémité supérieure. Le suffixe singulier hébreu est compris collectivement comme visant l’agencement formé par la paire.
- source_word: אֶל הַטַּבַּעַת הָאֶחָת
  choice: jusqu’à l’anneau unique
  rationale: Cette formulation suit de près l’article et le numéral hébreux tout en évitant de trancher en faveur de « premier anneau », interprétation possible mais non certaine.
- source_word: כֵּן יִהְיֶה לִשְׁנֵיהֶם
  choice: Il en sera ainsi pour toutes les deux
  rationale: La phrase récapitule que la même disposition s’applique aux deux planches concernées.
- source_word: לִשְׁנֵי הַמִּקְצֹעֹת
  choice: elles formeront les deux angles
  rationale: מִקְצֹעֹת désigne les angles ou assemblages d’angle. Cette tournure rend la fonction des planches en français naturel sans ajouter « arrière », absent du verset lui-même.
