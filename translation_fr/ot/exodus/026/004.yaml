base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/004.yaml
  text: And you shall make loops of blue on the edge of the one curtain at the end of the first set joined together[c][b][a]; and so you shall do on the edge of the outermost curtain in the second set joined together.
translation:
  language: fr
  text: Tu feras des brides bleues[a] sur le bord du lé situé à l’extrémité du premier assemblage[b] ; tu feras de même sur le bord du lé extérieur[c] du second assemblage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « violet ». Le mot hébreu תְּכֵלֶת désigne la matière textile teinte caractéristique employée pour le sanctuaire.
    reason: lexical_alternative
  - marker: b
    text: Les mots hébreux rendus par « assemblage » désignent un groupe de lés réunis en une seule unité ; on peut aussi traduire par « ensemble assemblé » ou « groupe joint ».
    reason: lexical_alternative
  - marker: c
    text: Ou « lé d’extrémité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: brides
  rationale: Dans le contexte textile, le terme désigne des boucles servant à relier les lés. « Brides » est naturel et précis en français pour de petites boucles de fixation.
- source_word: תְּכֵלֶת
  choice: pourpre bleue
  rationale: Le terme désigne une matière textile teinte d’un bleu tirant possiblement sur le violet. « Pourpre bleue » conserve la valeur traditionnelle et matérielle sans réduire le mot à une nuance moderne trop précise.
- source_word: שְׂפַת
  choice: bord
  rationale: Dans ce contexte textile, « bord » rend clairement le côté ou la lisière du lé.
- source_word: יְרִיעָה
  choice: lé
  rationale: Il s’agit de chacune des pièces d’étoffe formant la couverture. « Lé » est le terme textile français précis, tout en restant intelligible dans le contexte.
- source_word: הָאֶחָת
  choice: premier
  rationale: Littéralement « l’unique / l’un », le mot désigne ici le lé situé à l’extrémité du premier assemblage. Le français idiomatique appelle ce lé « premier » par rapport à l’ensemble correspondant.
- source_word: מִקָּצָה
  choice: à l’extrémité
  rationale: Cette expression situe le lé et ses brides au bout de l’assemblage.
- source_word: חֹבָרֶת / מַחְבֶּרֶת
  choice: assemblage
  rationale: Les deux noms apparentés désignent un groupe de lés réunis pour former une unité. « Assemblage » exprime à la fois l’ensemble obtenu et l’idée de jonction.
- source_word: וְכֵן
  choice: de même
  rationale: Cette formule introduit naturellement en français une instruction parallèle.
- source_word: הַקִּיצוֹנָה
  choice: extérieur
  rationale: L’adjectif désigne le lé placé tout au bout de l’autre assemblage. « Extérieur » transmet clairement cette position.
- source_word: הַשֵּׁנִית
  choice: second
  rationale: Le mot identifie explicitement le second des deux assemblages.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. Le futur à valeur injonctive convient aux consignes de fabrication. Le terme textile « lé » évite l’image imprécise d’un rideau déjà monté ; les notes préservent les principales ambiguïtés lexicales.
