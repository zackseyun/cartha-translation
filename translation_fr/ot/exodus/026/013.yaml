  yaml_path: translation/ot/exodus/026/013.yaml
  text: And the extra cubit on this side and the extra cubit on that side[a], from the surplus in the length of the tent curtains, shall hang over the sides of the tabernacle on this side and on that side[b], to cover it.
translation:
  language: fr
  text: La coudée en trop d’un côté et la coudée en trop de l’autre[a], excédent de longueur des tentures de la tente, pendront sur les côtés du tabernacle, d’un côté et de l’autre[b], afin de le couvrir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une coudée d’un côté et une coudée de l’autre ». L’hébreu répète « la coudée » avec des démonstratifs ; le contexte indique la mesure excédentaire restant de chaque côté.'
    reason: lexical_alternative
  - marker: b
    text: « Tabernacle » traduit l’hébreu mishkan, littéralement « demeure » ; il désigne ici la structure sacrée située sous les tentures de la tente.
    reason: cultural_note
lexical_decisions:
- source_word: הָאַמָּה מִזֶּה ... הָאַמָּה מִזֶּה
  choice: La coudée qui dépasse d’un côté et la coudée qui dépasse de l’autre
  rationale: אַמָּה désigne la coudée; le contexte et בָּעֹדֵף indiquent qu’il s’agit de la longueur restante. La formulation française explicite naturellement ce rapport sans modifier la mesure.
- source_word: בָּעֹדֵף בְּאֹרֶךְ
  choice: qui dépasse ... sur la longueur
  rationale: בָּעֹדֵף exprime l’excédent ou ce qui reste en surplus, tandis que אֹרֶךְ désigne la longueur. La construction française répartit cette information entre la proposition relative et le complément.
- source_word: יְרִיעֹת הָאֹהֶל
  choice: les tentures de la tente
  rationale: יְרִיעֹת désigne ici les lés ou tentures formant la couverture, et הָאֹהֶל les rattache à la tente. Cette traduction reste claire et conserve la distinction avec le מִשְׁכָּן.
- source_word: יִהְיֶה סָרוּחַ
  choice: retomberont
  rationale: L’expression décrit l’excédent de tissu pendant ou débordant sur les côtés. Le pluriel français s’accorde naturellement avec les deux longueurs d’une coudée mentionnées.
- source_word: צִדֵּי הַמִּשְׁכָּן
  choice: les côtés du sanctuaire démontable
  rationale: מִשְׁכָּן désigne littéralement la Demeure, structure sacrée distincte de la tente qui la recouvre. « sanctuaire démontable » rend ici sa fonction et sa nature concrète en français courant; la note signale le terme traditionnel.
- source_word: מִזֶּה וּמִזֶּה
  choice: de part et d’autre
  rationale: L’expression répétée indique les deux côtés opposés; « de part et d’autre » est idiomatique et précis dans cette description architecturale.
- source_word: לְכַסֹּתוֹ
  choice: afin de le couvrir
  rationale: L’infinitif préfixé de לְ exprime le but de la retombée des tentures; le pronom masculin renvoie au מִשְׁכָּן.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et concret. La syntaxe suit le mouvement du tissu tout en évitant une phrase artificiellement calquée sur l’hébreu. La distinction entre la tente-couverture (אֹהֶל) et la structure sacrée (מִשְׁכָּן) est maintenue.
