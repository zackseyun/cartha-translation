revisions:
- from: La coudée qui dépasse d’un côté et la coudée qui dépasse de l’autre[a], sur la longueur des tentures de la tente, retomberont de part et d’autre sur les côtés du sanctuaire démontable[b], afin de le couvrir.
  to: La coudée en trop d’un côté et la coudée en trop de l’autre[a], excédent de longueur des tentures de la tente, pendront sur les côtés du tabernacle, d’un côté et de l’autre[b], afin de le couvrir.
  rationale: La révision remplace une paraphrase interprétative de mishkan par « tabernacle », rend l’excédent de longueur plus explicitement et emploie « pendront », qui correspond mieux à l’image matérielle de l’hébreu. Les deux repères latéraux et le but de couvrir le tabernacle sont conservés.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:13:55Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : il s’agit de l’excédent d’une coudée de chaque côté, formé par la longueur des tentures, qui pend sur les côtés du mishkan afin de le couvrir. Toutefois, « sanctuaire démontable » interprète et paraphrase מִשְׁכָּן de manière trop libre ; le terme ne signifie pas littéralement « démontable » et « sanctuaire » peut déplacer le référent architectural.'
  naturalness: La phrase est globalement naturelle, mais « qui dépasse ... sur la longueur des tentures » rattache moins nettement l’excédent à la longueur totale des tentures. « Retomberont » peut évoquer une chute plutôt que le fait de pendre ou de déborder. Une formulation avec « en trop » et « pendront » est plus idiomatique et concrète.
  terminology: « Coudée », « tentures de la tente » et « couvrir » conviennent. « Tabernacle » est le rendu français traditionnel, précis et largement compréhensible de mishkan dans ce contexte ; une note peut en expliciter le sens littéral de « demeure » sans substituer une paraphrase interprétative au texte.
  issues:
  - severity: medium
    issue: « sanctuaire démontable » pour מִשְׁכָּן
    rationale: Cette expression ajoute les notions de sanctuaire et de démontabilité, qui ne sont pas portées lexicalement par le mot hébreu. Elle est aussi moins stable terminologiquement que « tabernacle » dans les descriptions de l’Exode.
  - severity: low
    issue: « retomberont » pour יִהְיֶה סָרוּחַ
    rationale: Le verbe décrit un excédent qui pend ou déborde sur les côtés ; « pendront » conserve mieux cette image sans suggérer un mouvement de chute.
  - severity: low
    issue: Rattachement de l’excédent de longueur
    rationale: La formulation révisée explicite que les deux coudées constituent l’excédent provenant de la longueur des tentures, conformément à בָּעֹדֵף בְּאֹרֶךְ.
