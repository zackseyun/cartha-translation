  text: וְֽ/אֶת הַ/קְּרָשִׁ֞ים תְּצַפֶּ֣ה זָהָ֗ב וְ/אֶת טַבְּעֹֽתֵי/הֶם֙ תַּעֲשֶׂ֣ה זָהָ֔ב בָּתִּ֖ים לַ/בְּרִיחִ֑ם וְ/צִפִּיתָ֥ אֶת הַ/בְּרִיחִ֖ם זָהָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/029.yaml
  text: You shall overlay the frames with gold[a], and you shall make their rings of gold as holders for the bars[b], and you shall overlay the bars with gold.
translation:
  language: fr
  text: Tu recouvriras d’or les cadres[a]. Tu feras aussi leurs anneaux en or, pour servir de logements aux traverses[b], et tu recouvriras d’or les traverses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « planches ». Le mot hébreu désigne les éléments verticaux de la structure du sanctuaire.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « des maisons pour les traverses », c’est-à-dire des logements destinés à les recevoir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: les cadres
  rationale: Dans la description du sanctuaire, קֶרֶשׁ désigne les éléments verticaux de la structure. « Cadres » exprime leur fonction sans imposer l’image de simples planches pleines.
- source_word: תְּצַפֶּה / וְצִפִּיתָ
  choice: tu recouvriras d’or
  rationale: Au piel, צפה désigne ici l’application d’un revêtement métallique. « Recouvrir d’or » est naturel en français et conserve le sens artisanal.
- source_word: זָהָב
  choice: or
  rationale: Le terme désigne directement le matériau. Ses trois occurrences dans l’hébreu sont toutes conservées dans la traduction.
- source_word: טַבְּעֹתֵיהֶם
  choice: leurs anneaux
  rationale: טַבַּעַת désigne couramment un anneau, ici fixé aux éléments de la structure.
- source_word: בָּתִּים לַבְּרִיחִם
  choice: pour servir de logements aux traverses
  rationale: L’expression signifie littéralement « maisons pour les traverses ». « Logements » rend clairement la fonction de réceptacles où passent ou reposent les traverses.
- source_word: הַבְּרִיחִם
  choice: les traverses
  rationale: בְּרִיחַ désigne les barres horizontales qui maintiennent ensemble les éléments verticaux. « Traverses » précise naturellement cette fonction en français.
theological_decisions: []
