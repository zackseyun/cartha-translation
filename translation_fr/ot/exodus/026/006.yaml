language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עָשִׂ֕יתָ חֲמִשִּׁ֖ים קַרְסֵ֣י זָהָ֑ב וְ/חִבַּרְתָּ֨ אֶת הַ/יְרִיעֹ֜ת אִשָּׁ֤ה אֶל אֲחֹתָ/הּ֙ בַּ/קְּרָסִ֔ים וְ/הָיָ֥ה הַ/מִּשְׁכָּ֖ן אֶחָֽד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/006.yaml
  text: And you shall make fifty gold clasps[a], and join the curtains to one another with the clasps, so that the tabernacle may be one.
translation:
  language: fr
  text: Tu feras cinquante agrafes en or et tu relieras les tentures l’une à l’autre[a] au moyen des agrafes. Ainsi, le tabernacle formera un tout.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une femme à sa sœur », tournure hébraïque signifiant ici que les tentures doivent être reliées l’une à l’autre.'
    reason: Préservation de l’image idiomatique du texte hébreu.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Dans cette suite d’instructions, le parfait qal précédé de וְ a une valeur directive. Le futur français exprime naturellement cet ordre adressé à Moïse.
- source_word: קַרְסֵי זָהָב
  choice: agrafes en or
  rationale: קֶרֶס désigne ici les pièces servant à attacher les tentures. « Agrafes » indique clairement leur fonction sans préciser indûment leur forme, et « en or » exprime leur matériau.
- source_word: וְחִבַּרְתָּ
  choice: et tu relieras
  rationale: Le verbe חבר signifie joindre ou relier. « Relier » convient au geste d’assembler les tentures au moyen d’agrafes.
- source_word: הַיְרִיעֹת
  choice: les tentures
  rationale: יְרִיעָה désigne les grandes pièces d’étoffe constituant le tabernacle. « Tentures » est naturel dans ce contexte et évite l’image moderne de simples rideaux domestiques.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: l’une à l’autre
  rationale: L’expression signifie littéralement « une femme à sa sœur » et fonctionne ici comme un idiome de réciprocité entre des objets féminins. Le français idiomatique en rend le sens, tandis que la note conserve l’image hébraïque.
- source_word: בַּקְּרָסִים
  choice: au moyen des agrafes
  rationale: La préposition בְּ marque ici l’instrument. « Au moyen des » rend cette fonction explicitement et naturellement.
- source_word: וְהָיָה הַמִּשְׁכָּן אֶחָד
  choice: Ainsi, le tabernacle formera un tout
  rationale: La proposition indique le résultat de l’assemblage. « Former un tout » exprime l’unité de la structure sans suggérer que le sanctuaire se réduit à une seule pièce matérielle.
theological_decisions:
- issue: Traduction de הַמִּשְׁכָּן
  choice: le tabernacle
  alternative: la demeure
  rationale: « Tabernacle » conserve le sens technique du sanctuaire démontable dans l’Exode. « Demeure » restituerait plus directement l’étymologie, mais serait moins précis pour beaucoup de lecteurs dans ce contexte.
- issue: Portée de אֶחָד
  choice: formera un tout
  alternative: sera un
  rationale: Il s’agit ici de l’unité structurelle obtenue par l’assemblage des tentures. La formulation française choisie garde ce sens contextuel sans lui imposer une portée doctrinale étrangère au verset.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète l’adresse directe à Moïse. La syntaxe reste proche de l’enchaînement hébreu tout en exprimant naturellement le résultat final.
