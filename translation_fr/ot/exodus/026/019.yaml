  text: וְ/אַרְבָּעִים֙ אַדְנֵי כֶ֔סֶף תַּעֲשֶׂ֕ה תַּ֖חַת עֶשְׂרִ֣ים הַ/קָּ֑רֶשׁ שְׁנֵ֨י אֲדָנִ֜ים תַּֽחַת הַ/קֶּ֤רֶשׁ הָ/אֶחָד֙ לִ/שְׁתֵּ֣י יְדֹתָ֔י/ו וּ/שְׁנֵ֧י אֲדָנִ֛ים תַּֽחַת הַ/קֶּ֥רֶשׁ הָ/אֶחָ֖ד לִ/שְׁתֵּ֥י יְדֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/019.yaml
  text: 'And you shall make forty silver bases under the twenty frames: two bases under one frame for its two tenons[b][a], and two bases under the next frame for its two tenons.'
translation:
  language: fr
  text: 'Tu feras quarante socles d’argent[a] sous les vingt cadres[b] : deux socles sous un cadre pour ses deux tenons, et deux socles sous le cadre suivant pour ses deux tenons.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bases d’argent » ; dans ce contexte, le terme hébreu désigne un élément de soutien, possiblement en forme de logement pour un tenon.
    reason: lexical_alternative
  - marker: b
    text: Traditionnellement « planches ». Le terme désigne ici des éléments verticaux de structure ; leur forme précise est discutée.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְנֵי כֶסֶף
  choice: socles d’argent
  rationale: Dans le contexte de la demeure, אֶדֶן désigne une pièce de soutien, probablement creusée pour recevoir un tenon. « Socles » est clair et naturel en français architectural, tandis que « bases à mortaise » explicite davantage la forme possible.
- source_word: תַּעֲשֶׂה
  choice: tu feras
  rationale: L’imparfait qal à la deuxième personne du masculin singulier a ici une valeur directive. Le futur français conserve avec naturel le ton des instructions adressées à Moïse.
- source_word: תַּחַת
  choice: sous
  rationale: La préposition indique directement la position des socles au-dessous des éléments verticaux.
- source_word: הַקָּרֶשׁ / הַקֶּרֶשׁ
  choice: cadre
  rationale: קֶרֶשׁ désigne ici un élément vertical de la structure de la demeure. « Cadre » rend sa fonction architecturale sans imposer l’image d’une simple planche, même si la forme exacte de la pièce reste discutée.
- source_word: שְׁנֵי אֲדָנִים
  choice: deux socles
  rationale: La répétition précise que chaque élément vertical repose sur deux pièces de soutien; le même terme est conservé dans tout le verset.
- source_word: לִשְׁתֵּי יְדֹתָיו
  choice: pour ses deux tenons
  rationale: Littéralement « pour ses deux mains », l’expression emploie יָדוֹת comme terme technique pour les parties saillantes qui s’insèrent dans les socles. « Tenons » est le terme français précis en menuiserie.
- source_word: הָאֶחָד ... הָאֶחָד
  choice: un cadre ... le cadre suivant
  rationale: La répétition hébraïque de « l’un » a une valeur distributive. Cette formulation française évite une répétition maladroite et indique que la même disposition vaut successivement pour les cadres.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le futur « tu feras » maintient le ton directif du passage. Les termes « socles », « cadres » et « tenons » donnent une description architecturale compréhensible sans prétendre résoudre au-delà du texte la forme exacte des pièces.
