  text: וְ/שַׂמְתָּ֤ אֶת הַ/שֻּׁלְחָן֙ מִ/ח֣וּץ לַ/פָּרֹ֔כֶת וְ/אֶת הַ/מְּנֹרָה֙ נֹ֣כַח הַ/שֻּׁלְחָ֔ן עַ֛ל צֶ֥לַע הַ/מִּשְׁכָּ֖ן תֵּימָ֑נָ/ה וְ/הַ֨/שֻּׁלְחָ֔ן תִּתֵּ֖ן עַל צֶ֥לַע צָפֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/035.yaml
  text: And you shall place the table outside the veil[a], and the lampstand opposite the table on the south side of the tabernacle[b]; and you shall put the table on the north side.
translation:
  language: fr
  text: Tu placeras la table à l’extérieur du voile[a], et le porte-lampes en face de la table, du côté sud du tabernacle[b] ; quant à la table, tu la mettras du côté nord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’extérieur de la tenture ». Le mot hébreu désigne la séparation intérieure du tabernacle.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : mishkan, « demeure » ; ce terme désigne le tabernacle portatif.'
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Tu placeras
  rationale: Le verbe שׂוּם signifie « mettre, placer ». Le futur français exprime naturellement ici l’instruction formulée par l’accompli hébreu avec valeur prescriptive.
- source_word: הַשֻּׁלְחָן
  choice: la table
  rationale: Le nom désigne simplement la table. Son usage cultuel est connu par le contexte, mais n’est pas explicité dans ce verset.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: à l’extérieur du voile
  rationale: מִחוּץ indique une position extérieure, tandis que פָּרֹכֶת désigne la tenture intérieure séparant les espaces du sanctuaire. « Voile » conserve le terme français traditionnel et précis dans ce contexte.
- source_word: הַמְּנֹרָה
  choice: le porte-lampes
  rationale: מְנוֹרָה désigne ici le support portant les lampes. « Porte-lampes » traduit la fonction de l’objet sans recourir à une simple translittération.
- source_word: נֹכַח
  choice: en face de
  rationale: Le terme exprime une position vis-à-vis, de l’autre côté. « En face de » est spatialement clair et idiomatique.
- source_word: עַל צֶלַע הַמִּשְׁכָּן תֵּימָנָה
  choice: du côté sud du sanctuaire
  rationale: צֶלַע désigne le côté ou flanc, et תֵּימָנָה marque la direction du sud. « Du côté sud » restitue naturellement l’agencement spatial.
- source_word: וְהַשֻּׁלְחָן תִּתֵּן
  choice: quant à la table, tu la mettras
  rationale: La dislocation « quant à la table » rend la reprise emphatique du nom placé en tête, et נָתַן prend ici le sens concret de « mettre ».
- source_word: עַל צֶלַע צָפוֹן
  choice: du côté nord
  rationale: L’expression indique le côté septentrional du sanctuaire. Le complément « du sanctuaire » reste aisément récupérable de la proposition précédente.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et direct. Le futur simple rend les prescriptions. « Sanctuaire » traduit ici מִשְׁכָּן de façon naturelle dans le contexte, tandis qu’une note préserve sa valeur littérale de « demeure ». La structure reprend l’accent hébreu placé sur la table dans la dernière proposition.
