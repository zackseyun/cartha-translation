  text: אֹ֣רֶךְ הַ/יְרִיעָ֣ה הָֽ/אַחַ֗ת שְׁלֹשִׁים֙ בָּֽ/אַמָּ֔ה וְ/רֹ֨חַב֙ אַרְבַּ֣ע בָּ/אַמָּ֔ה הַ/יְרִיעָ֖ה הָ/אֶחָ֑ת מִדָּ֣ה אַחַ֔ת לְ/עַשְׁתֵּ֥י עֶשְׂרֵ֖ה יְרִיעֹֽת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/008.yaml
  text: The length of each curtain shall be thirty cubits[a], and the width of each curtain four cubits[b]; all eleven curtains shall have one measure.
translation:
  language: fr
  text: La longueur de chaque tenture[a] sera de trente coudées, et sa largeur, de quatre coudées. Les onze tentures auront toutes les mêmes dimensions[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la tenture, l’une » ; cette tournure hébraïque a ici un sens distributif et désigne chaque tenture prise individuellement.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « une seule mesure ». Cette expression souligne que les onze tentures avaient des dimensions identiques.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ
  choice: longueur
  rationale: Terme dimensionnel courant, employé en parallèle avec רֹחַב (« largeur »).
- source_word: יְרִיעָה
  choice: tenture
  rationale: Dans le contexte du tabernacle, le mot désigne une grande pièce textile formant une couverture. « Tenture » convient mieux ici que « rideau », qui évoque surtout une pièce suspendue verticalement.
- source_word: הָאַחַת / הָאֶחָת
  choice: chaque
  rationale: 'La tournure, littéralement « la [tenture], l’une », a ici une valeur distributive : les dimensions indiquées valent pour chacune des tentures.'
- source_word: שְׁלֹשִׁים בָּאַמָּה
  choice: trente coudées
  rationale: La coudée est l’unité ancienne du texte source ; elle est conservée sans conversion moderne.
- source_word: רֹחַב
  choice: largeur
  rationale: Équivalent français naturel dans l’énoncé de dimensions, en parallèle avec « longueur ».
- source_word: אַרְבַּע בָּאַמָּה
  choice: quatre coudées
  rationale: Rendu direct de la mesure hébraïque, avec maintien de l’unité ancienne.
- source_word: מִדָּה אַחַת
  choice: toutes les mêmes dimensions
  rationale: Littéralement « une seule mesure » ; dans ce contexte où longueur et largeur viennent d’être précisées, le pluriel français « dimensions » exprime clairement l’uniformité des onze tentures.
- source_word: לְעַשְׁתֵּי עֶשְׂרֵה יְרִיעֹת
  choice: les onze tentures
  rationale: Le לְ introduit l’ensemble auquel s’applique l’uniformité des mesures ; le français naturel en fait le sujet de la dernière proposition.
