  yaml_path: translation/ot/exodus/026/020.yaml
  text: And for the second side of the tabernacle[a], on the north side, twenty frames.
translation:
  language: fr
  text: 'Pour le deuxième côté du tabernacle, du côté nord : vingt planches[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cadres ». Le terme hébreu désigne des éléments verticaux de la structure du tabernacle; leur forme précise est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/צֶלַע
  choice: Pour le … côté
  rationale: La conjonction et la préposition introduisent la prescription suivante. Dans ce contexte architectural, צֶלַע désigne un côté du tabernacle; la formulation française conserve le caractère elliptique de l’hébreu.
- source_word: הַמִּשְׁכָּן
  choice: du tabernacle
  rationale: « Tabernacle » est le terme français consacré et intelligible pour la tente-sanctuaire désignée par מִשְׁכָּן dans l’Exode.
- source_word: הַשֵּׁנִית
  choice: le deuxième
  rationale: L’adjectif désigne précisément le second des deux longs côtés, après celui décrit au verset précédent.
- source_word: לִפְאַת צָפוֹן
  choice: du côté nord
  rationale: Cette expression rend naturellement l’orientation septentrionale indiquée par l’hébreu.
- source_word: עֶשְׂרִים
  choice: vingt
  rationale: Traduction directe du nombre cardinal.
- source_word: קָרֶשׁ
  choice: cadres
  rationale: Dans les instructions relatives au tabernacle, קֶרֶשׁ désigne les éléments verticaux constituant sa structure. « Cadres » exprime leur fonction probable, tandis que « planches » demeure une possibilité lexicale.
