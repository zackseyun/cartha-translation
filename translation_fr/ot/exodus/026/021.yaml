  yaml_path: translation/ot/exodus/026/021.yaml
  text: 'and their forty bases shall be of silver: two bases under the one frame[b][a], and two bases under the other frame.'
translation:
  language: fr
  text: 'et leurs quarante socles seront en argent : deux socles sous chacun des cadres[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « planches ». Le terme hébreu désigne ici chacun des éléments verticaux rigides qui formaient la structure du tabernacle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעִים אַדְנֵי/הֶם
  choice: et leurs quarante socles
  rationale: La conjonction poursuit la description du verset précédent. « Leurs » reprend les cadres, et « socles » désigne clairement les supports architecturaux dans lesquels ils étaient fixés.
- source_word: כָּסֶף
  choice: seront en argent
  rationale: Le nom indique le matériau. « En argent » est l’expression française naturelle pour la composition de ces socles.
- source_word: שְׁנֵי אֲדָנִים
  choice: deux socles
  rationale: La même désignation est conservée pour les deux supports placés sous chaque élément vertical.
- source_word: תַּחַת
  choice: sous
  rationale: Équivalent direct et naturel de la position physique indiquée par la préposition hébraïque.
- source_word: הַ/קֶּרֶשׁ
  choice: cadres
  rationale: Dans ce contexte, קֶרֶשׁ désigne les éléments verticaux rigides de la structure du tabernacle. « Cadres » communique mieux leur fonction structurelle que le traditionnel « planches ».
- source_word: הַקֶּרֶשׁ הָאֶחָד ... הַקֶּרֶשׁ הָאֶחָד
  choice: chacun des cadres
  rationale: 'La répétition littérale de « le cadre, l’un » a ici une valeur distributive : deux socles correspondent à chaque cadre. Le français idiomatique condense cette répétition sans modifier le compte total.'
