base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/001.yaml
  text: And you shall make the tabernacle with ten curtains of finely twisted linen[a], and blue and purple and scarlet yarn; with cherubim, the work of a skillful designer, you shall make them.
translation:
  language: fr
  text: Tu feras la Demeure avec dix tentures de fin lin retors, de fil bleu, de pourpre et d’écarlate. Tu les orneras de chérubins, œuvre d’un artisan habile[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu les feras avec des chérubins artistement tissés. » L’expression hébraïque désigne un travail textile artistique et conçu avec savoir-faire ; elle ne précise pas explicitement si les motifs étaient tissés ou réalisés selon une autre technique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: la Demeure
  rationale: Le terme désigne ici le sanctuaire portatif où Dieu demeure au milieu d’Israël. « La Demeure », avec majuscule, rend le sens hébreu tout en restant naturel et en conservant sa valeur technique dans ce contexte.
- source_word: יְרִיעֹת
  choice: tentures
  rationale: Dans les instructions de construction, le mot désigne de grandes pièces d’étoffe formant la couverture du sanctuaire. « Tentures » convient mieux que le moderne « rideaux », qui pourrait suggérer des rideaux de fenêtre.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: fin lin retors
  rationale: שֵׁשׁ désigne le fin lin et מָשְׁזָר un fil retors ou torsadé. Cette formulation française établie exprime à la fois la matière et sa préparation.
- source_word: תְכֵלֶת
  choice: fil bleu
  rationale: Le terme désigne une matière textile teinte en bleu ou bleu-pourpre. « Fil bleu » explicite naturellement le support textile sans préciser davantage une nuance incertaine.
- source_word: אַרְגָּמָן
  choice: pourpre
  rationale: Le mot désigne une matière teinte en pourpre. Dans la série coordonnée après « fil », l’ellipse française évite une répétition lourde.
- source_word: תֹלַעַת שָׁנִי
  choice: écarlate
  rationale: L’expression désigne du fil ou une étoffe d’un rouge écarlate obtenu par teinture. « Écarlate » est clair et convient à l’énumération textile.
- source_word: כְּרֻבִים
  choice: chérubins
  rationale: « Chérubins » conserve le terme biblique pour ces êtres célestes et évite les connotations décoratives modernes de « chérubins » pris au sens figuré ou de « angelots ».
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: artistement tissés
  rationale: Dans ce contexte textile, l’expression décrit un ouvrage conçu et exécuté avec art, probablement des motifs intégrés au tissage. La traduction rend l’habileté artistique sans la réduire à une simple broderie.
- source_word: וְאֶת ... תַּעֲשֶׂה
  choice: Tu feras
  rationale: Le futur à valeur prescriptive rend naturellement l’instruction divine en français. La conjonction hébraïque assure la continuité du discours, mais n’exige pas ici un « Et » initial.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom masculin pluriel renvoie aux dix tentures; le français emploie naturellement le pronom objet « les ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « La Demeure » fonctionne comme terme cultuel défini; « fin lin retors » conserve la précision technique. La phrase est divisée en deux pour éviter une accumulation pesante, tout en maintenant le lien du pronom avec les dix tentures.
