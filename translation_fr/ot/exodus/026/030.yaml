  source_fidelity: « Tu dresseras » rend fidèlement le hiphil de קום dans le contexte du montage du sanctuaire. « Le tabernacle » est le référent établi de הַמִּשְׁכָּן. « Conformément à la disposition » exprime de manière juste la valeur de כְּמִשְׁפָּטוֹ comme agencement ou manière prescrite; le relatif reprend naturellement cette disposition. Le passif « qui t’a été montrée » explicite idiomatiquement en français l’expérience exprimée littéralement par « que tu as vue », et la note conserve cette formulation active. « Sur la montagne » est exact.
  naturalness: La phrase est fluide, claire et d’un registre biblique moderne sans archaïsme inutile. « Dresser le tabernacle » et « conformément à » conviennent au français international contemporain.
  terminology: 'La terminologie est cohérente : « tabernacle » identifie précisément le sanctuaire-tente, tandis que « disposition » évite de réduire מִשְׁפָּט à un simple dessin tout en restant naturelle dans un contexte d’installation. La note est correctement ancrée et utile pour la nuance lexicale et la voix active de l’hébreu.'
