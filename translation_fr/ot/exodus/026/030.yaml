  text: וַ/הֲקֵמֹתָ֖ אֶת הַ/מִּשְׁכָּ֑ן כְּ/מִ֨שְׁפָּט֔/וֹ אֲשֶׁ֥ר הָרְאֵ֖יתָ בָּ/הָֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/030.yaml
  text: And you shall set up the tabernacle according to its ordinance[a], which you were shown on the mountain.
translation:
  language: fr
  text: Tu dresseras le tabernacle conformément à la disposition[a] qui t’a été montrée sur la montagne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon sa règle, que tu as vue sur la montagne » ; le terme hébreu peut aussi désigner la manière prescrite ou le modèle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקֵמֹתָ
  choice: Tu dresseras
  rationale: Le hiphil de קום signifie ici « faire tenir debout, ériger ». « Dresser » convient naturellement à l’installation d’une tente sacrée et conserve la valeur directive du contexte.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: מִשְׁכָּן désigne ici la tente-sanctuaire d’Israël. « Tabernacle » est le terme français consacré et assure une référence précise.
- source_word: כְּמִשְׁפָּטוֹ
  choice: conformément à la disposition
  rationale: מִשְׁפָּט peut désigner une règle, une ordonnance ou une manière prescrite. Dans ce contexte de montage, « disposition » exprime l’agencement normatif présenté à Moïse sans réduire le terme au seul dessin architectural.
- source_word: אֲשֶׁר הָרְאֵיתָ
  choice: qui t’a été montrée
  rationale: 'La forme hébraïque dit littéralement « que tu as vue ». Le passif français rend naturellement le fait impliqué dans le contexte : Moïse l’a vue parce qu’elle lui a été montrée, tout en signalant la formulation littérale en note.'
- source_word: בָּהָר
  choice: sur la montagne
  rationale: Dans ce cadre locatif, ב est rendu idiomatiquement par « sur » ; la montagne renvoie au lieu où Moïse a reçu les instructions.
theological_decisions: []
