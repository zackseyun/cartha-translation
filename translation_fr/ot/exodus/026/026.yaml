source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ בְרִיחִ֖ם עֲצֵ֣י שִׁטִּ֑ים חֲמִשָּׁ֕ה לְ/קַרְשֵׁ֥י צֶֽלַע הַ/מִּשְׁכָּ֖ן הָ/אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/026.yaml
  text: And you shall make five bars of acacia wood for the frames of the one side of the tabernacle[a].
translation:
  language: fr
  text: Tu feras cinq traverses en bois d’acacia pour les cadres d’un côté du tabernacle[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « planches » au lieu de « cadres » ; le terme hébreu désigne les éléments structurels du tabernacle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Le qatal avec waw dans cette suite d’instructions a une valeur prescriptive. Le futur français exprime naturellement l’ordre tout en conservant le style procédural du passage.
- source_word: בְרִיחִם
  choice: traverses
  rationale: Dans ce contexte de construction, le terme désigne les pièces horizontales qui relient et maintiennent les éléments verticaux. « Traverses » est précis et naturel en français.
- source_word: עֲצֵי שִׁטִּים
  choice: en bois d’acacia
  rationale: Le syntagme construit désigne du bois provenant de l’acacia. Cette formulation est idiomatique et claire en français moderne.
- source_word: חֲמִשָּׁה
  choice: cinq
  rationale: Nombre cardinal qualifiant les traverses.
- source_word: לְקַרְשֵׁי
  choice: pour les cadres
  rationale: Dans le tabernacle, קֶרֶשׁ désigne les éléments structurels verticaux. « Cadres » rend leur fonction architecturale, tandis que « planches » reste une possibilité lexicale signalée en note.
- source_word: צֶלַע
  choice: côté
  rationale: Ici, le mot désigne l’un des côtés latéraux de la structure, et non une côte au sens anatomique.
- source_word: הַמִּשְׁכָּן
  choice: du tabernacle
  rationale: « Tabernacle » est le terme français établi et contextuellement précis pour la demeure-sanctuaire décrite dans l’Exode.
- source_word: הָאֶחָד
  choice: d’un côté
  rationale: Le mot distingue ce côté de l’autre côté mentionné au verset suivant. « D’un côté » rend cette opposition de manière naturelle sans l’identifier comme le premier.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le futur prescriptif maintient le ton des instructions. « Traverses » apporte la précision architecturale attendue sans dépasser le sens contextuel.
