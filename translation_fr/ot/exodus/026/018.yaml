  text: וְ/עָשִׂ֥יתָ אֶת הַ/קְּרָשִׁ֖ים לַ/מִּשְׁכָּ֑ן עֶשְׂרִ֣ים קֶ֔רֶשׁ לִ/פְאַ֖ת נֶ֥גְבָּ/ה תֵימָֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/018.yaml
  text: 'And you shall make the frames for the tabernacle: twenty frames for the south side[a], southward.'
translation:
  language: fr
  text: 'Tu feras les planches[a] du tabernacle : vingt planches pour le côté sud, vers le sud.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cadres »; le terme hébreu désigne les éléments structurels du tabernacle et peut désigner des planches ou des cadres.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Dans ce contexte d’instructions, le parfait qal précédé de la conjonction a une valeur directive. Le futur français exprime naturellement l’ordre solennel.
- source_word: הַקְּרָשִׁים
  choice: les cadres
  rationale: קֶרֶשׁ désigne ici les éléments structurels dressés du tabernacle. « Cadres » rend leur fonction probable sans imposer l’image de simples planches; une autre possibilité est signalée en note.
- source_word: לַמִּשְׁכָּן
  choice: du tabernacle
  rationale: מִשְׁכָּן est le terme courant pour la structure sacrée décrite dans l’Exode. « Tabernacle » est précis et bien établi en français biblique.
- source_word: עֶשְׂרִים קֶרֶשׁ
  choice: vingt cadres
  rationale: Bien que l’hébreu emploie le nom au singulier après le nombre, le français exige normalement le pluriel.
- source_word: לִפְאַת
  choice: pour le côté
  rationale: פֵאָה peut désigner un côté, un bord ou une extrémité. Dans cette description architecturale, « côté » convient le mieux.
- source_word: נֶגְבָּה תֵימָנָה
  choice: sud, en direction du sud
  rationale: Les deux indications directionnelles hébraïques sont conservées afin de ne pas réduire leur insistance ou leur précision à un seul adjectif.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition directionnelle de l’hébreu est volontairement conservée, malgré sa légère lourdeur en français.
