  text: And for the rear side of the tabernacle[a], westward, you shall make six boards.
translation:
  language: fr
  text: Pour l’arrière du tabernacle[a], du côté ouest, tu feras six planches.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cadres », si ces éléments de structure étaient des cadres ouverts plutôt que des planches pleines.
