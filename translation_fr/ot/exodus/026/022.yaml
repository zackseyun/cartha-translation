lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: Pour l’arrière de
  rationale: Le terme désigne ici la partie reculée ou arrière de la structure. « Pour l’arrière de » est naturel en français dans ce contexte architectural.
- source_word: הַמִּשְׁכָּן
  choice: du tabernacle
  rationale: « Tabernacle » est le terme français consacré pour la structure du sanctuaire décrite dans l’Exode.
- source_word: יָמָּה
  choice: du côté ouest
  rationale: L’adverbe signifie littéralement « vers la mer » et, dans l’orientation géographique biblique, indique l’ouest. « Du côté ouest » exprime clairement sa fonction spatiale ici.
- source_word: תַּעֲשֶׂה
  choice: tu feras
  rationale: L’imparfait qal à la deuxième personne du masculin singulier a ici une valeur directive dans les instructions de construction.
- source_word: שִׁשָּׁה
  choice: six
  rationale: Le nombre cardinal qualifie directement les éléments de structure mentionnés ensuite.
- source_word: קְרָשִׁים
  choice: planches
  rationale: Dans ce contexte, le mot désigne les éléments de bois verticaux formant la structure. « Planches » est clair et traditionnel, tandis que leur forme exacte reste discutée.
