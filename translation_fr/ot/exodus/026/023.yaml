  text: And you shall make two boards for the corners of the tabernacle at the rear[a].
translation:
  language: fr
  text: Tu feras deux planches pour les angles du tabernacle, à l’arrière[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme pièces d’angle du tabernacle, dans ses deux parties arrière ». Les termes hébreux sont architecturaux et leur sens précis est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁנֵי
  choice: deux
  rationale: Le waw relie cette instruction à la précédente; en français, l’enchaînement est naturellement porté par la continuité du passage, sans qu’un « et » initial soit indispensable.
- source_word: קְרָשִׁים
  choice: planches
  rationale: Dans les instructions concernant le tabernacle, le terme désigne les éléments structurels en bois qui en forment les parois. « Planches » est usuel, concret et moins interprétatif que « cadres ».
- source_word: תַּעֲשֶׂה
  choice: Tu feras
  rationale: L’imparfait hébreu à valeur directive est rendu par le futur français, forme naturelle et solennelle dans une série d’instructions.
- source_word: לִ/מְקֻצְעֹת
  choice: pour les angles
  rationale: Le terme désigne des angles ou points de jonction angulaires. « Pour les angles » préserve le sens architectural sans imposer l’interprétation plus technique de pièces d’angle.
- source_word: הַ/מִּשְׁכָּן
  choice: du tabernacle
  rationale: « Tabernacle » est le terme français établi pour cette demeure-sanctuaire dans l’Exode.
- source_word: בַּ/יַּרְכָתָיִם
  choice: à l’arrière
  rationale: La forme duelle renvoie aux deux extrémités ou parties du fond. Puisque les deux planches et les angles viennent d’être mentionnés, « à l’arrière » situe clairement l’ensemble sans répétition lourde.
