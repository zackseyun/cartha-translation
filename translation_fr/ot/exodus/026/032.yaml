source:
  edition: WLC
  text: וְ/נָתַתָּ֣ה אֹתָ֗/הּ עַל אַרְבָּעָה֙ עַמּוּדֵ֣י שִׁטִּ֔ים מְצֻפִּ֣ים זָהָ֔ב וָוֵי/הֶ֖ם זָהָ֑ב עַל אַרְבָּעָ֖ה אַדְנֵי כָֽסֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/032.yaml
  text: And you shall hang it on four pillars of acacia wood overlaid with gold[a], their hooks being of gold, on four silver bases.
translation:
  language: fr
  text: Tu la suspendras à quatre colonnes en bois d’acacia plaquées d’or. Leurs crochets seront en or, et elles reposeront sur quatre bases[a] d’argent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « socles » d’argent.'
    reason: Le terme אֲדָנִים peut désigner des bases, des socles ou des supports creusés servant de logements aux colonnes.
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Tu la suspendras
  rationale: Le verbe נתן signifie couramment « mettre » ou « placer », mais, puisque l’objet est le voile et que des crochets sont mentionnés, « suspendre » exprime naturellement l’action visée en français sans ajouter d’élément étranger au contexte.
- source_word: אֹתָהּ
  choice: la
  rationale: Le pronom objet féminin singulier renvoie au voile mentionné au verset précédent; le français reprend naturellement son genre grammatical.
- source_word: עַל אַרְבָּעָה עַמּוּדֵי
  choice: à quatre colonnes
  rationale: עמוד désigne un support vertical. « Colonnes » convient à la structure du sanctuaire, et la préposition « à » accompagne naturellement « suspendre » en français.
- source_word: שִׁטִּים
  choice: en bois d’acacia
  rationale: Le terme désigne ici du bois d’acacia employé comme matériau, non des arbres vivants.
- source_word: מְצֻפִּים זָהָב
  choice: plaquées d’or
  rationale: Le participe passif de צפה indique que les colonnes sont revêtues d’une couche d’or. « Plaquées d’or » est précis et courant en français moderne.
- source_word: וָוֵיהֶם
  choice: leurs crochets
  rationale: Le nom désigne les crochets ou attaches fixés aux colonnes pour porter le voile; « crochets » rend clairement leur fonction immédiate.
- source_word: עַל אַרְבָּעָה אַדְנֵי כָסֶף
  choice: elles reposeront sur quatre bases d’argent
  rationale: אדן désigne une base porteuse, éventuellement conçue comme un logement où s’insère la colonne. La reformulation avec « elles reposeront » rend explicite en français le rapport syntaxique implicite entre les colonnes et leurs bases.
