  text: וְ/נָתַתָּ֣ה אֶת הַ/פָּרֹכֶת֮ תַּ֣חַת הַ/קְּרָסִים֒ וְ/הֵבֵאתָ֥ שָׁ֨מָּ/ה֙ מִ/בֵּ֣ית לַ/פָּרֹ֔כֶת אֵ֖ת אֲר֣וֹן הָ/עֵד֑וּת וְ/הִבְדִּילָ֤ה הַ/פָּרֹ֨כֶת֙ לָ/כֶ֔ם בֵּ֣ין הַ/קֹּ֔דֶשׁ וּ/בֵ֖ין קֹ֥דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/033.yaml
  text: And you shall place the veil under the clasps[a], and there, within the veil, you shall bring the ark of the testimony[b]; and the veil shall separate for you between the Holy Place and the Most Holy Place.
translation:
  language: fr
  text: Tu placeras le voile sous les agrafes et tu feras entrer là, derrière le voile, l’arche du témoignage. Le voile établira pour vous une séparation entre le lieu saint et le lieu très saint[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le saint des saints ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרֹכֶת
  choice: le voile
  rationale: Désigne la tenture intérieure qui ferme l’accès à la partie la plus sacrée du sanctuaire. « Voile » est le terme cultuel précis et courant en français biblique.
- source_word: קְרָסִים
  choice: les agrafes
  rationale: Le mot désigne les pièces servant à joindre les tentures du tabernacle. « Agrafes » exprime cette fonction sans imposer un mécanisme moderne trop précis.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: derrière le voile
  rationale: L’expression situe l’arche du côté intérieur du voile. « Derrière le voile » rend naturellement en français la relation spatiale envisagée depuis le lieu saint.
- source_word: אֲרוֹן הָעֵדוּת
  choice: l’arche du témoignage
  rationale: Le texte hébreu porte explicitement עֵדוּת, « témoignage », et non בְּרִית, « alliance » ; la traduction conserve donc la désignation propre à ce verset.
- source_word: וְהִבְדִּילָה
  choice: établira une séparation
  rationale: Le hiphil de בדל exprime ici la fonction séparatrice du voile. Cette formulation française est naturelle tout en conservant la valeur causative.
- source_word: לָכֶם
  choice: pour vous
  rationale: Le pronom datif est maintenu afin de ne pas effacer un élément explicite de l’hébreu et de signaler que cette séparation règle l’espace cultuel pour les destinataires.
- source_word: הַקֹּדֶשׁ
  choice: le lieu saint
  rationale: Dans ce contexte, le terme désigne la première pièce sacrée, par opposition à l’espace intérieur.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: le lieu très saint
  rationale: La construction intensive hébraïque signifie littéralement « saint des saints ». « Lieu très saint » en transmet clairement la valeur superlative en français moderne.
theological_decisions:
- issue: Désignation de l’espace intérieur du sanctuaire
  choice: le lieu très saint
  alternative: le Saint des saints ; littéralement « le saint des saints »
  rationale: La traduction exprime la force superlative de l’idiome hébreu dans un français accessible, tandis qu’une note conserve sa forme littérale traditionnelle.
- issue: Désignation de l’arche avec עֵדוּת
  choice: l’arche du témoignage
  alternative: l’arche de l’alliance
  rationale: La formulation du texte source est conservée sans harmonisation avec le titre traditionnel « arche de l’alliance » employé dans d’autres contextes.
translation_notes:
  register: Français international moderne, digne et lisible. Le futur simple traduit naturellement la valeur injonctive de la succession de formes verbales hébraïques. La ponctuation en deux phrases allège la longue coordination sans modifier les rapports syntaxiques. Les désignations des espaces sacrés restent en minuscules selon l’usage français courant.
