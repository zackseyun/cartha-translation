  text: וְ/עָשִׂ֛יתָ קַרְסֵ֥י נְחֹ֖שֶׁת חֲמִשִּׁ֑ים וְ/הֵבֵאתָ֤ אֶת הַ/קְּרָסִים֙ בַּ/לֻּ֣לָאֹ֔ת וְ/חִבַּרְתָּ֥ אֶת הָ/אֹ֖הֶל וְ/הָיָ֥ה אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/011.yaml
  text: And you shall make fifty bronze clasps[a], and put the clasps into the loops, and join the tent together[c][b], so that it may be one.
translation:
  language: fr
  text: Tu feras cinquante agrafes de bronze[a] ; tu introduiras les agrafes dans les boucles et tu assembleras la tente, et elle formera un seul ensemble.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « agrafes de cuivre ». Le mot hébreu peut désigner le cuivre ou le bronze selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַרְסֵי נְחֹשֶׁת
  choice: agrafes de bronze
  rationale: קַרְסִים désigne ici des pièces d’attache reliant les tentures; « agrafes » convient mieux que le terme plus général « crochets ». נְחֹשֶׁת peut désigner le cuivre ou le bronze; « bronze » est le rendu traditionnel et vraisemblable dans ce contexte.
- source_word: חֲמִשִּׁים
  choice: cinquante
  rationale: Nombre cardinal qualifiant directement les agrafes.
- source_word: וְהֵבֵאתָ אֶת הַקְּרָסִים בַּלֻּלָאֹת
  choice: tu introduiras les agrafes dans les boucles
  rationale: Le hiphil de בוא exprime ici le fait de faire entrer les agrafes dans les boucles. « Introduire » rend clairement ce geste en français naturel.
- source_word: וְחִבַּרְתָּ אֶת הָאֹהֶל
  choice: tu assembleras ainsi la tente
  rationale: חבר signifie joindre ou relier. « Assembler » convient au contexte de construction, et « ainsi » indique que l’assemblage s’effectue au moyen des agrafes sans ajouter de contenu substantiel.
- source_word: וְהָיָה אֶחָד
  choice: afin qu’elle forme un seul ensemble
  rationale: 'La proposition décrit le résultat de l’assemblage: les parties de la tente constituent une unité. Cette formulation française naturelle conserve cette valeur résultative.'
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le futur injonctif convient au discours prescriptif. Le terme « tente » conserve le référent explicite de l’hébreu, tandis que « un seul ensemble » rend l’unité matérielle des différentes parties.
