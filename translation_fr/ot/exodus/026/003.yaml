  text: Five curtains shall be joined to one another[a], and five curtains shall be joined to one another.
translation:
  language: fr
  text: Cinq tentures seront jointes les unes aux autres[a], et cinq tentures seront jointes les unes aux autres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une femme à sa sœur », tournure qui désigne ici des éléments correspondants joints les uns aux autres.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרִיעֹת
  choice: tentures
  rationale: Dans le contexte de la construction du sanctuaire, יְרִיעָה désigne une grande pièce d’étoffe formant la couverture. « Tentures » est naturel et précis en français biblique moderne.
- source_word: תִּהְיֶיןָ
  choice: seront
  rationale: L’imparfait de היה a ici une valeur prescriptive dans une série d’instructions; le futur français exprime cette directive avec sobriété.
- source_word: חֹבְרֹת
  choice: assemblées
  rationale: Le participe de חבר signifie « jointes, reliées ». « Assemblées » convient au travail de confection décrit et reste clair en français courant.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: l’une à l’autre
  rationale: L’expression signifie littéralement « une femme à sa sœur » et marque ici la correspondance et la jonction réciproque d’objets désignés par un nom féminin.
- source_word: חֲמֵשׁ ... וְחָמֵשׁ
  choice: Cinq ... et cinq
  rationale: Cette formulation reproduit directement la division des dix tentures en deux ensembles de cinq, sans ajouter « des ».
