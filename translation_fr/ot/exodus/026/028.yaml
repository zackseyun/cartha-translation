  yaml_path: translation/ot/exodus/026/028.yaml
  text: And the middle bar[a], in the midst of the frames, shall extend from end to end.
translation:
  language: fr
  text: La barre centrale, au milieu des cadres[a], s’étendra d’une extrémité à l’autre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « planches ». Le terme hébreu désigne les éléments structuraux verticaux du sanctuaire ; « cadres » évite de suggérer qu’il s’agissait nécessairement de simples planches plates.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרִיחַ
  choice: barre
  rationale: Dans le contexte de la construction du sanctuaire, le terme désigne une pièce horizontale servant à maintenir ensemble les éléments verticaux. « Barre » est le terme architectural français le plus naturel ici.
- source_word: הַתִּיכֹן
  choice: centrale
  rationale: L’adjectif situe cette barre entre les autres. « Centrale » convient naturellement à la description d’un élément de construction, sans préciser davantage sa disposition.
- source_word: בְּתוֹךְ
  choice: au milieu de
  rationale: Cette expression conserve le sens spatial du texte hébreu sans imposer l’idée que la barre traverse des ouvertures pratiquées dans les éléments.
- source_word: הַקְּרָשִׁים
  choice: cadres
  rationale: Le terme désigne les éléments structuraux verticaux du sanctuaire. « Cadres » évite de les réduire explicitement à de simples planches, tout en gardant une formulation intelligible.
- source_word: מַבְרִחַ
  choice: s’étendra
  rationale: Le participe décrit la barre courant sur toute la longueur. « S’étendra » exprime ce déploiement sans ajouter l’idée mécanique, incertaine, d’un passage à travers des ouvertures.
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  choice: d’une extrémité à l’autre
  rationale: Cette tournure française naturelle rend l’étendue complète exprimée par l’idiome hébreu.
