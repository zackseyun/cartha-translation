  text: and five bars for the boards of the second side of the tabernacle[b][a], and five bars for the boards of the side of the tabernacle at the rear westward.
translation:
  language: fr
  text: Et cinq traverses pour les planches du deuxième côté[a] du tabernacle, et cinq traverses pour les planches du côté du tabernacle, à l’arrière, vers l’ouest[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’autre côté ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pour les parties arrière, vers l’ouest ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרִיחִם
  choice: traverses
  rationale: Dans ce contexte de construction, le terme désigne les pièces horizontales qui relient et maintiennent les planches; « traverses » est précis et naturel en français.
- source_word: קַרְשֵׁי
  choice: planches
  rationale: Le terme désigne les éléments structuraux en bois du tabernacle. « Planches » reste concret sans supposer qu’il s’agissait de cadres ajourés.
- source_word: צֶלַע
  choice: côté
  rationale: Dans cette description architecturale, le mot désigne un côté du tabernacle.
- source_word: הַשֵּׁנִית
  choice: deuxième
  rationale: Cette traduction conserve le sens ordinal direct de l’hébreu, tout en signalant en note l’interprétation contextuelle « autre ».
- source_word: הַמִּשְׁכָּן
  choice: tabernacle
  rationale: « Tabernacle » est la désignation française traditionnelle et immédiatement reconnaissable de la tente-sanctuaire dans l’Exode.
- source_word: לַיַּרְכָתַיִם
  choice: qui forme le fond
  rationale: Dans ce contexte architectural, le duel désigne la partie la plus reculée, c’est-à-dire le fond ou l’arrière du tabernacle.
- source_word: יָמָּה
  choice: vers l’ouest
  rationale: L’adverbe directionnel signifie ici « vers l’ouest »; cette formulation française est claire et conserve l’orientation exprimée par l’hébreu.
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: cinq… et cinq
  rationale: La coordination de la liste est reproduite naturellement en français; le premier « et » dépend syntaxiquement du verset précédent et peut être omis dans un extrait autonome.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire demeure concret et architectural. La formulation conserve « deuxième » malgré la possibilité contextuelle « autre », et maintient distinctement les notions de fond et d’orientation vers l’ouest.
