source:
  edition: WLC
  text: וְ/עָשִׂ֨יתָ֙ יְרִיעֹ֣ת עִזִּ֔ים לְ/אֹ֖הֶל עַל הַ/מִּשְׁכָּ֑ן עַשְׁתֵּי עֶשְׂרֵ֥ה יְרִיעֹ֖ת תַּעֲשֶׂ֥ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/007.yaml
  text: You shall make curtains of goats’ hair for a tent over the tabernacle[a]; you shall make them as eleven curtains.
translation:
  language: fr
  text: Tu feras des tentures en poil de chèvre[a] pour former une tente par-dessus le tabernacle ; tu en feras onze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des tentures de chèvres ». En hébreu, « chèvres » désigne ici la matière provenant des chèvres, c’est-à-dire leur poil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Le qatal précédé de la conjonction s’inscrit dans une suite d’instructions. Le futur français exprime naturellement l’ordre solennel adressé à Moïse.
- source_word: יְרִיעֹת
  choice: tentures
  rationale: Dans les instructions relatives au tabernacle, le terme désigne de grandes pièces textiles. « Tentures » est naturel, digne et suffisamment précis.
- source_word: עִזִּים
  choice: en poil de chèvre
  rationale: L’hébreu dit littéralement « chèvres », mais le nom désigne ici la matière provenant des chèvres. L’ajout de « poil de » rend le sens matériel explicite en français.
- source_word: לְאֹהֶל
  choice: pour former une tente
  rationale: 'La préposition ל marque ici la fonction ou le résultat : ces tentures constituent une tente, plutôt que d’être simplement destinées à une tente déjà définie.'
- source_word: עַל הַמִּשְׁכָּן
  choice: par-dessus le tabernacle
  rationale: עַל indique que cette tente textile recouvre la structure appelée מִשְׁכָּן. « Tabernacle » conserve ici le terme cultuel traditionnel et distinctif.
- source_word: עַשְׁתֵּי עֶשְׂרֵה יְרִיעֹת תַּעֲשֶׂה אֹתָם
  choice: tu en feras onze
  rationale: La formulation française reprend clairement l’antécédent « tentures » au moyen de « en » et donne leur nombre sans reproduire une répétition hébraïque qui serait lourde en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le futur injonctif maintient le registre des instructions cultuelles. « Tabernacle » est conservé comme terme technique, tandis que « pour former une tente » explicite naturellement la fonction de la couverture sans effacer la distinction lexicale entre אֹהֶל et מִשְׁכָּן.
