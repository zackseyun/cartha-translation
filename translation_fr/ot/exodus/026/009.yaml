  yaml_path: translation/ot/exodus/026/009.yaml
  text: And you shall join the five curtains separately[a], and the six curtains separately; and you shall fold the sixth curtain double at the front of the tent.
translation:
  language: fr
  text: Tu joindras les cinq tentures entre elles, et les six tentures entre elles ; tu plieras en deux la sixième tenture à l’avant de la tente.a
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חִבַּרְתָּ
  choice: tu assembleras
  rationale: Le verbe חָבַר exprime l’action de joindre ou de relier. « Assembler » convient naturellement à des tentures réunies en deux ensembles.
- source_word: יְרִיעֹת / יְרִיעָה
  choice: tentures / tenture
  rationale: יְרִיעָה désigne ici les pièces d’étoffe qui couvrent la tente. « Tentures » est clair, précis et adapté à ce contexte architectural.
- source_word: לְבָד
  choice: séparément
  rationale: Le terme indique que les cinq tentures forment un ensemble distinct de celui des six. La coordination française et « séparément » rendent ce sens sans répétition pesante.
- source_word: כָפַלְתָּ
  choice: tu replieras en deux
  rationale: Le verbe signifie doubler ou plier. « Replier en deux » indique clairement que la sixième tenture doit être doublée sur elle-même.
- source_word: הַשִּׁשִּׁית
  choice: la sixième
  rationale: Rendu direct de l’adjectif ordinal qualifiant la tenture.
- source_word: אֶל מוּל פְּנֵי
  choice: à l’avant de
  rationale: L’expression situe la tenture du côté de la face antérieure de la tente. « À l’avant de » est naturel en français et conserve l’orientation spatiale sans introduire explicitement une entrée.
- source_word: הָאֹהֶל
  choice: la tente
  rationale: Le nom hébreu signifie simplement « tente ». Ce choix respecte la formulation du texte plutôt que d’introduire le terme interprétatif « tabernacle ».
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et prescriptif, adapté à des instructions de construction. Le futur simple conserve la valeur injonctive de la forme hébraïque. La répétition de « séparément » est allégée en français tout en maintenant nettement les deux groupes distincts.
