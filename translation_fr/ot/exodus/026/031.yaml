base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/031.yaml
  text: And you shall make a veil of blue[a], purple, and scarlet yarn, and fine twisted linen; it shall be made with cherubim[c][b], the work of a skillful designer.
translation:
  language: fr
  text: Tu feras un voile[a] de fil bleu, de pourpre, d’écarlate[b] et de fin lin retors. Il sera réalisé avec des chérubins, œuvre d’un artisan expert[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rideau ». Le terme hébreu désigne ici la tenture intérieure qui séparait le lieu saint du lieu très saint.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque rendue par « écarlate » désigne plus littéralement une matière teinte en écarlate; cette teinture était traditionnellement obtenue à partir d’insectes.
    reason: cultural_note
  - marker: c
    text: Ou « travail d’un artiste » ou « travail artistique ». L’expression hébraïque souligne un savoir-faire artistique spécialisé, sans préciser nettement la technique employée.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָרֹכֶת
  choice: voile
  rationale: Dans ce contexte, le terme désigne la tenture intérieure séparant le lieu saint du lieu très saint. « Voile » est précis et consacré par l’usage, tandis que « rideau » reste possible.
- source_word: תְּכֵלֶת
  choice: fils bleus
  rationale: Le mot désigne une matière textile teinte d’une couleur prestigieuse, généralement comprise comme bleue. « Fils bleus » explicite naturellement le support textile dans cette liste de matériaux.
- source_word: אַרְגָּמָן
  choice: fils pourpres
  rationale: « Pourpre » est le rendu courant de ce terme de couleur et de teinture de luxe; le nom « fils » est porté par l’ensemble de l’énumération.
- source_word: תוֹלַעַת שָׁנִי
  choice: fils écarlates
  rationale: L’expression désigne une matière teinte en écarlate, traditionnellement au moyen d’un colorant tiré d’insectes. Le rendu garde la couleur dans le texte et réserve le détail culturel à une note.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: fin lin retors
  rationale: שֵׁשׁ désigne le fin lin et מָשְׁזָר sa qualité retorse, c’est-à-dire faite de fils torsadés. Cette formulation conserve les deux éléments sans lourdeur.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: un artisan habile
  rationale: L’expression évoque un travail artistique spécialisé. « Artisan habile » communique cette expertise sans imposer une technique précise comme la broderie ou le tissage.
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: y réalisera
  rationale: Le passage de la deuxième personne à une forme verbale masculine singulière permet de comprendre qu’un artisan exécutera l’ouvrage. « Y réalisera » donne en français une instruction naturelle tout en reliant les figures au voile.
- source_word: כְּרֻבִים
  choice: des chérubins
  rationale: « Chérubins » est le terme français conventionnel pour ces êtres célestes. Le texte indique qu’ils font partie du décor du voile sans préciser ici leur forme ni leur symbolisme.
theological_decisions:
- issue: Langage cultuel et artisanal sans ajout de symbolisme théologique ultérieur
  choice: Présenter le verset comme une instruction concrète de fabrication du sanctuaire, avec un voile orné de chérubins.
  alternative: Employer un vocabulaire qui mettrait au premier plan des interprétations symboliques développées dans des textes bibliques ultérieurs.
  rationale: Le verset décrit directement les matériaux et l’exécution artistique du voile. La traduction ne doit pas introduire une portée doctrinale que cette instruction ne formule pas.
- issue: Technique de représentation des chérubins
  choice: Employer le verbe général « réaliser » afin de ne pas préciser si les figures sont tissées, brodées ou exécutées par une autre technique.
  alternative: Traduire par « tissera » ou « brodera ».
  rationale: מַעֲשֵׂה חֹשֵׁב indique un travail artistique expert, mais le terme ne justifie pas à lui seul l’identification certaine d’une technique moderne précise.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier conserve l’adresse directe à Moïse. Le vocabulaire artisanal reste concret, tandis que la formulation évite de surdéterminer la technique de fabrication ou la portée symbolique du voile.
