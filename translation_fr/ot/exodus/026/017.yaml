  text: Each board is to have two tenons joined one to another[a]; this is how you shall make all the boards of the tabernacle.
translation:
  language: fr
  text: Chaque planche aura deux tenons joints l’un à l’autre[a]. Tu feras ainsi toutes les planches du tabernacle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « deux mains pour chaque planche, jointes, une femme à sa sœur ». Ici, les « mains » désignent des parties saillantes servant à l’assemblage, d’où « tenons ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי יָדוֹת
  choice: deux tenons
  rationale: Littéralement « deux mains ». Dans ce contexte de menuiserie, יָדוֹת désigne les parties saillantes destinées à s’insérer dans les socles; « tenons » est le terme français précis et naturel.
- source_word: לַקֶּרֶשׁ הָאֶחָד
  choice: Chaque planche
  rationale: La formulation hébraïque « pour la planche, l’unique » a ici une valeur distributive et s’applique à chacune des planches.
- source_word: מְשֻׁלָּבֹת
  choice: joints
  rationale: Le participe passif indique que les deux tenons sont associés ou ajustés ensemble, sans préciser davantage le procédé d’assemblage.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: l’un à l’autre
  rationale: L’expression littérale « une femme vers sa sœur » est un idiome de réciprocité entre éléments correspondants. « L’un à l’autre » en restitue naturellement le sens.
- source_word: קֶרֶשׁ
  choice: planche
  rationale: Le mot désigne ici un élément vertical en bois de la structure. « Planche » reste concret et évite de surinterpréter sa forme comme un cadre.
- source_word: כֵּן תַּעֲשֶׂה
  choice: Tu feras ainsi
  rationale: Cette tournure conserve la force directive de l’hébreu et son renvoi au modèle qui vient d’être décrit, dans un français actuel et digne.
- source_word: מִשְׁכָּן
  choice: tabernacle
  rationale: Bien que le terme soit apparenté à l’idée de demeure, il sert ici de désignation établie du sanctuaire portatif.
