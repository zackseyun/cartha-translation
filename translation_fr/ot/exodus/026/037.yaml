  text: וְ/עָשִׂ֣יתָ לַ/מָּסָ֗ךְ חֲמִשָּׁה֙ עַמּוּדֵ֣י שִׁטִּ֔ים וְ/צִפִּיתָ֤ אֹתָ/ם֙ זָהָ֔ב וָוֵי/הֶ֖ם זָהָ֑ב וְ/יָצַקְתָּ֣ לָ/הֶ֔ם חֲמִשָּׁ֖ה אַדְנֵ֥י נְחֹֽשֶׁת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/037.yaml
  text: And you shall make for the screen five pillars of acacia wood[a], and overlay them with gold; their hooks shall be of gold[b]; and you shall cast for them five bases of bronze.
translation:
  language: fr
  text: Tu feras pour le rideau[a] cinq colonnes en bois d’acacia et tu les plaqueras d’or. Leurs crochets seront en or, et tu couleras pour elles cinq socles en bronze[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tenture ». Le terme hébreu désigne ici la tenture de l’entrée, distincte du voile intérieur qui fermait l’accès au lieu très saint.
    reason: lexical_alternative
  - marker: b
    text: Ou « bases en bronze » ou « supports en bronze ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מָּסָךְ
  choice: rideau
  rationale: Dans ce contexte, le terme désigne la tenture fermant l’entrée de la demeure, et non le voile intérieur séparant le lieu très saint. « Rideau » est naturel en français et conserve l’image d’une pièce textile suspendue.
- source_word: עַמּוּדֵי שִׁטִּים
  choice: colonnes en bois d’acacia
  rationale: עַמּוּדִים désigne ici les supports verticaux de la tenture; « colonnes » convient au vocabulaire architectural de la demeure. שִׁטִּים désigne le bois d’acacia employé dans ces instructions.
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: tu les plaqueras d’or
  rationale: Le verbe צפה décrit l’application d’un revêtement métallique. « Plaquer d’or » exprime clairement qu’il s’agit d’un revêtement et non de colonnes en or massif.
- source_word: וָוֵיהֶם
  choice: leurs crochets
  rationale: Dans les descriptions de la demeure, וָוִים désigne vraisemblablement les crochets servant à fixer ou suspendre les tentures.
- source_word: אַדְנֵי נְחֹשֶׁת
  choice: socles en bronze
  rationale: אַדָן désigne la pièce de support dans laquelle repose une colonne ou un cadre. « Socles » est précis et idiomatique dans ce contexte de construction.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: « Bronze » est le terme français courant pour ce métal dans le mobilier cultuel ancien; « laiton » serait historiquement trompeur, tandis que « cuivre » demeure une possibilité lexicale plus générale.
- source_word: וְיָצַקְתָּ לָהֶם
  choice: tu couleras pour elles
  rationale: יצק désigne ici la fonte du métal dans un moule. Le pronom « elles » reprend les colonnes et respecte la préposition לָהֶם, qui indique que les socles sont fabriqués pour celles-ci.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le futur prescriptif (« tu feras », « tu plaqueras », « tu couleras ») restitue la forme des instructions. « Rideau » évite l’ambiguïté que créerait « voile » avec la séparation intérieure, tandis que la note conserve l’alternative lexicale.
