  text: וְ/נָתַתָּ֙ אֶת הַ/כַּפֹּ֔רֶת עַ֖ל אֲר֣וֹן הָ/עֵדֻ֑ת בְּ/קֹ֖דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/034.yaml
  text: And you shall place the mercy seat on the ark of the testimony in the Most Holy Place[a][b][c].
translation:
  language: fr
  text: Tu placeras le propitiatoire[a] sur l’arche du témoignage[b], dans le lieu très saint[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « couvercle d’expiation ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit « l’arche du témoignage »; on trouve aussi traditionnellement « l’arche de l’alliance ».
    reason: alternative_reading
  - marker: c
    text: Ou « le Saint des saints ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתָּ
  choice: Tu placeras
  rationale: Le qatal qal à la deuxième personne masculine singulière, précédé de la conjonction dans cette suite d’instructions, exprime une directive. Le futur français convient naturellement au style prescriptif du passage.
- source_word: הַכַּפֹּרֶת
  choice: le propitiatoire
  rationale: Terme français établi pour le couvercle sacré de l’arche lié au rite d’expiation. Une formulation plus descriptive, « couvercle d’expiation », est signalée en note afin de rendre visible l’enjeu lexical.
- source_word: עַל
  choice: sur
  rationale: La préposition indique que le propitiatoire doit être posé sur l’arche.
- source_word: אֲרוֹן הָעֵדֻת
  choice: l’arche du témoignage
  rationale: Cette traduction suit directement l’hébreu עֵדֻת, « témoignage », sans l’harmoniser avec l’expression traditionnelle « arche de l’alliance ».
- source_word: בְּ/קֹדֶשׁ הַקֳּדָשִׁים
  choice: dans le lieu très saint
  rationale: L’expression hébraïque intensive désigne l’espace le plus saint, au cœur du sanctuaire. Cette formulation est claire en français moderne tout en conservant le vocabulaire de sainteté.
theological_decisions:
- issue: Désignation du couvercle sacré de l’arche
  choice: Employer « propitiatoire » dans le texte
  alternative: « couvercle d’expiation »
  rationale: « Propitiatoire » est le terme cultuel français consacré, tandis que l’alternative explicite davantage le rapport lexical avec l’expiation. La note préserve cette possibilité sans imposer une interprétation doctrinale plus précise que le terme hébreu.
- issue: Désignation de l’arche
  choice: Conserver « arche du témoignage »
  alternative: « arche de l’alliance »
  rationale: Le texte hébreu porte « témoignage ». La traduction évite donc une harmonisation traditionnelle avec d’autres désignations de l’arche.
- issue: Désignation de l’espace le plus sacré
  choice: Employer « le lieu très saint »
  alternative: « le Saint des saints »
  rationale: La formulation principale exprime clairement le superlatif hébreu en français moderne; la tournure traditionnelle est conservée en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le futur simple garde la force directive de la suite d’instructions. Les termes cultuels établis sont maintenus lorsqu’ils restent intelligibles, avec des variantes explicatives en notes.
