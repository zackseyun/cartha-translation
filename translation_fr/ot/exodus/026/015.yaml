  language: en
  yaml_path: translation/ot/exodus/026/015.yaml
  text: And you shall make the frames for the tabernacle of acacia wood[b][a], standing upright.
translation:
  language: fr
  text: Tu feras, pour le tabernacle, des panneaux[a] en bois d’acacia, disposés verticalement.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des planches »; le terme hébreu désigne les éléments structurels en bois du tabernacle.
    reason: lexical_alternative
  - marker: b
    text: 'Autre ordre possible : « des panneaux en bois d’acacia pour le tabernacle, disposés verticalement ».'
    reason: previous_rendering
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Le parfait qal précédé du waw, dans cette suite d’instructions, exprime un ordre. Le futur français rend naturellement cette valeur prescriptive; la coordination n’a pas besoin d’être explicitée ici.
- source_word: הַקְּרָשִׁים
  choice: des cadres
  rationale: Le terme désigne les éléments structurels en bois du tabernacle. « Cadres » met en valeur leur fonction architecturale, tandis que « planches » demeure une possibilité lexicale signalée en note.
- source_word: לַמִּשְׁכָּן
  choice: pour le tabernacle
  rationale: « Tabernacle » est le terme français établi pour la structure sanctuaire désignée par מִשְׁכָּן dans ce contexte.
- source_word: עֲצֵי שִׁטִּים
  choice: en bois d’acacia
  rationale: Cette tournure française idiomatique rend la chaîne construite désignant le matériau provenant de l’acacia.
- source_word: עֹמְדִים
  choice: dressés verticalement
  rationale: Le participe masculin pluriel décrit la position des éléments structurels. Cette formulation conserve l’idée concrète d’éléments placés debout sans la réduire au simple adjectif « verticaux ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier correspond à l’adresse hébraïque à Moïse. L’ordre des compléments évite de faire de l’acacia le matériau du tabernacle entier, tout en maintenant le participe final et la légère tension syntaxique du texte source.
