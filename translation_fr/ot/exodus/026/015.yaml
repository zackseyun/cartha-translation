- from: Tu feras pour le tabernacle des cadres[a] en bois d’acacia, dressés verticalement.[b]
  to: Tu feras, pour le tabernacle, des panneaux[a] en bois d’acacia, disposés verticalement.[b]
  rationale: La révision remplace « cadres », qui peut imposer l’image de châssis ouverts, par « panneaux », terme structurel plus prudent. Elle conserve tous les constituants du texte hébreu, y compris la position verticale exprimée par le participe. La seconde note est reformulée pour ne pas surinterpréter une ambiguïté grammaticale qui n’est pas réellement déterminante dans le contexte.
