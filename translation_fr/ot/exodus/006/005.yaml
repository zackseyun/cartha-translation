source:
  edition: WLC
  text: וְ/גַ֣ם אֲנִ֣י שָׁמַ֗עְתִּי אֶֽת נַאֲקַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר מִצְרַ֖יִם מַעֲבִדִ֣ים אֹתָ֑/ם וָ/אֶזְכֹּ֖ר אֶת בְּרִיתִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/005.yaml
  text: And I also have heard the groaning of the sons of Israel[a], whom the Egyptians are enslaving[b], and I have remembered my covenant.
translation:
  language: fr
  text: Moi aussi, j’ai entendu les gémissements des Israélites[a], que les Égyptiens réduisent en esclavage, et je me suis souvenu de mon alliance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël »; c’est-à-dire le peuple d’Israël.'
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte d’alliance, « se souvenir » ne signifie pas nécessairement que Dieu avait oublié, mais qu’il porte attention à son alliance en vue d’agir.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Moi aussi
  rationale: L’antéposition de « Moi » restitue naturellement en français l’insistance portée par le pronom hébreu explicite, tout en conservant le lien additif avec ce qui précède.
- source_word: שָׁמַעְתִּי
  choice: j’ai entendu
  rationale: Le passé composé convient au discours direct en français moderne et présente l’écoute comme un fait accompli dont les effets demeurent présents.
- source_word: נַאֲקַת
  choice: les gémissements
  rationale: Ce terme exprime les plaintes douloureuses provoquées par l’oppression; « gémissements » est naturel, digne et bien établi dans ce contexte.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: L’expression hébraïque signifie littéralement « les fils d’Israël », mais désigne ici collectivement le peuple d’Israël. « Les Israélites » rend ce sens sans suggérer que seuls les hommes sont concernés.
- source_word: מִצְרַיִם מַעֲבִדִים אֹתָם
  choice: que les Égyptiens réduisent en esclavage
  rationale: Le nom « Égypte », associé au participe pluriel, désigne ici les Égyptiens comme agents. Le hiphil de עבד exprime le fait de contraindre au service; « réduire en esclavage » en restitue clairement la violence.
- source_word: וָאֶזְכֹּר
  choice: je me suis souvenu
  rationale: La formulation conserve l’idiome biblique de la mémoire divine, sans le paraphraser ni résoudre sa portée théologique.
- source_word: בְּרִיתִי
  choice: mon alliance
  rationale: « Alliance » est l’équivalent français courant et précis de בְּרִית dans ce contexte d’engagement divin.
theological_decisions:
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël
  rationale: Le groupe nominal désigne collectivement le peuple issu d’Israël, femmes et hommes. Le texte principal privilégie une formulation française naturelle, tandis que la note conserve la forme littérale.
- issue: Sens de la mémoire divine
  choice: je me suis souvenu de mon alliance
  alternative: je me suis rappelé mon alliance / je suis intervenu conformément à mon alliance
  rationale: La traduction garde la tension de l’expression hébraïque. Elle n’implique pas nécessairement un oubli préalable, mais le texte n’est pas remplacé par une explication de l’action divine.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve l’insistance initiale du texte hébreu (« Moi aussi »), et les termes « gémissements », « esclavage » et « alliance » maintiennent la gravité du passage sans archaïsme.
