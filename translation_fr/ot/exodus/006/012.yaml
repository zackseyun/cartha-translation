  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה לִ/פְנֵ֥י יְהוָ֖ה לֵ/אמֹ֑ר הֵ֤ן בְּנֵֽי יִשְׂרָאֵל֙ לֹֽא שָׁמְע֣וּ אֵלַ֔/י וְ/אֵיךְ֙ יִשְׁמָעֵ֣/נִי פַרְעֹ֔ה וַ/אֲנִ֖י עֲרַ֥ל שְׂפָתָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/012.yaml
  text: But Moses spoke before Yahweh[a], saying, “Behold, the sons of Israel have not listened to me; so how will Pharaoh listen to me[b], since I am uncircumcised in lips?”
translation:
  language: fr
  text: 'Mais Moïse parla devant Yahweh en ces termes : « Voici, les fils d’Israël ne m’ont pas écouté ; comment donc Pharaon m’écoutera-t-il, moi qui ai les lèvres incirconcises[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « incirconcis des lèvres ». Cette expression imagée évoque une parole entravée ou inadéquate, sans en préciser exactement la nature ; voir Exode 4.10.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Mais Moïse parla
  rationale: Le waw narratif fait progresser le récit, tandis que « mais » marque naturellement le contraste entre l’ordre divin précédent et l’objection de Moïse.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » conserve l’expression relationnelle et spatiale לִפְנֵי sans la réduire au simple équivalent « à » ; le nom divin est translittéré.
- source_word: הֵן
  choice: Voici
  rationale: Cette particule attire solennellement l’attention sur le fait invoqué par Moïse ; « voici » convient au registre biblique moderne et digne.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La formulation garde l’image familiale explicite de l’hébreu et désigne collectivement le peuple issu d’Israël.
- source_word: לֹא שָׁמְעוּ אֵלַי
  choice: ne m’ont pas écouté
  rationale: Le choix conserve à la fois l’idée d’entendre et celle de prêter attention, sans renforcer le sens jusqu’à « obéir ».
- source_word: וְאֵיךְ יִשְׁמָעֵנִי פַרְעֹה
  choice: Comment donc Pharaon m’écouterait-il
  rationale: « Donc » exprime l’inférence, et le conditionnel français rend naturellement la question rhétorique fondée sur le refus déjà constaté.
- source_word: וַאֲנִי עֲרַל שְׂפָתָיִם
  choice: moi qui ai les lèvres incirconcises
  rationale: La construction française indique la circonstance invoquée par Moïse tout en préservant la métaphore hébraïque frappante, sans la transformer en diagnostic précis.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin ; sa translittération préserve sa fonction de nom personnel plutôt que de lui substituer un titre.
- issue: Interprétation de עֲרַל שְׂפָתָיִם
  choice: les lèvres incirconcises
  alternative: des difficultés à parler
  rationale: Le texte principal conserve l’image d’empêchement ou d’inaptitude sans décider si Moïse évoque une déficience physique, une maladresse d’élocution ou une indignité à parler.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe de la question est idiomatique, tandis que « devant Yahweh », « les fils d’Israël » et « les lèvres incirconcises » maintiennent les traits saillants de l’hébreu.
