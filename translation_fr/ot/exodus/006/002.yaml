  yaml_path: translation/ot/exodus/006/002.yaml
  text: God spoke to Moses and said to him[a], “I am Yahweh.”
translation:
  language: fr
  text: 'Dieu parla à Moïse et lui dit : « Je suis Yahweh[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, le nom divin, traditionnellement vocalisé « Yahweh »; la prononciation ancienne exacte est incertaine. Certaines traductions françaises emploient « Yahvé » ou remplacent le nom par un titre tel que « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque, l’incertitude historique de la vocalisation et les principales conventions de traduction, tout en faisant correspondre le texte à la terminologie POB.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le verbe דבר introduit ici la parole divine dans le récit. « Parla » en conserve simplement la valeur narrative.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le nom s’accorde ici avec un verbe au singulier et désigne le Dieu d’Israël.
- source_word: אֶל־מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל indique le destinataire de la parole; « à Moïse » est naturel en français.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: et lui dit
  rationale: Cette formulation reproduit les deux verbes de parole du texte hébreu sans lourdeur excessive; « lui » reprend Moïse.
- source_word: אֲנִי
  choice: Je suis
  rationale: La proposition nominale hébraïque omet la copule au présent; le français exige ici « suis » pour exprimer l’identification emphatique.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin représenté par le tétragramme YHWH; elle préserve le nom propre plutôt que de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR; Yahweh; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahvé » est une transcription française largement reconnue qui conserve le caractère personnel du nom, sans le remplacer par le titre « le SEIGNEUR ». La vocalisation ancienne exacte demeure incertaine.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme narratif « parla… dit » est conservé, et le nom divin est rendu par une forme propre plutôt que par un titre.
