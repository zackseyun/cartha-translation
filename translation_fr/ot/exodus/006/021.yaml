  text: 'Les fils de Yitsehar : Coré, Néfeg et Zikri.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Les fils de
  rationale: בְּנֵי est le pluriel construit de « fils ». Dans cette généalogie, les trois hommes nommés sont présentés naturellement comme les fils directs de Yitsehar. Le ו initial poursuit la liste, mais il n’est pas nécessaire de rendre chaque coordination hébraïque par « et » en français.
- source_word: יִצְהָר
  choice: Yitsehar
  rationale: Translittération française du nom propre hébreu, avec « ts » pour צ et un h pour signaler la consonne ה.
- source_word: קֹרַח
  choice: Coré
  rationale: Forme française biblique courante du nom propre, claire et immédiatement reconnaissable.
- source_word: וָ/נֶפֶג
  choice: Néfeg
  rationale: Translittération adaptée au français du nom נֶפֶג ; la conjonction préfixée est rendue dans l’énumération française avant le dernier élément seulement.
- source_word: וְ/זִכְרִי
  choice: et Zikri
  rationale: Translittération française proche de l’hébreu זִכְרִי. La conjonction ו est rendue par « et », conformément à la syntaxe naturelle d’une énumération française.
