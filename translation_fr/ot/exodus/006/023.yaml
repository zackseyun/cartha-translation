base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/023.yaml
  text: Aaron took Elisheba, the daughter of Amminadab and sister of Nahshon, as his wife, and she bore him Nadab, Abihu, Eleazar, and Ithamar.
translation:
  language: fr
  text: Aaron prit pour femme Élishéba, fille d’Amminadab et sœur de Nahshôn, et elle lui donna naissance à Nadab, Abihou, Éléazar et Itamar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe לקח signifie littéralement « prendre » et, avec la précision « pour femme », exprime ici sans ambiguïté le mariage tout en conservant la formulation hébraïque.
- source_word: אֱלִישֶׁבַע
  choice: Élishéba
  rationale: Translittération française moderne qui reste proche de la forme hébraïque du nom.
- source_word: בַּת עַמִּינָדָב
  choice: fille d’Amminadab
  rationale: Le construit hébreu indique directement la filiation; cette tournure est naturelle en français.
- source_word: אֲחוֹת נַחְשׁוֹן
  choice: sœur de Nahshôn
  rationale: La traduction rend directement le lien familial indiqué par le texte.
- source_word: לּוֹ לְאִשָּׁה
  choice: pour femme
  rationale: Expression française idiomatique et digne correspondant à la formule matrimoniale hébraïque, sans ajouter de nuance absente du texte.
- source_word: וַתֵּלֶד לוֹ
  choice: Elle lui donna pour fils
  rationale: Cette formulation française naturelle exprime que les enfants nommés sont nés d’elle pour Aaron; « pour fils » explicite le référent masculin pluriel fourni par les noms.
- source_word: נָדָב
  choice: Nadab
  rationale: Translittération française conventionnelle du nom propre.
- source_word: אֲבִיהוּא
  choice: Abihou
  rationale: Translittération adaptée aux conventions phonétiques françaises.
- source_word: אֶלְעָזָר
  choice: Éléazar
  rationale: Forme française conventionnelle, proche de l’hébreu.
- source_word: אִיתָמָר
  choice: Itamar
  rationale: Translittération française claire et proche de la forme hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le verbe concret « prit » avec l’expression matrimoniale « pour femme ». La division en deux phrases allège la longue coordination hébraïque sans modifier les relations familiales.
