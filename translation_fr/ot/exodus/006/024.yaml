base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/024.yaml
  text: 'The sons of Korah: Assir[a], Elkanah, and Abiasaph. These are the clans of the Korahites.'
translation:
  language: fr
  text: 'Les fils de Coré : Assir, Elqana et Abiasaph. Tels sont les clans des Coréites.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les familles des Coréites ». Le terme hébreu peut désigner des groupes familiaux élargis au sein d’une tribu; « clans » convient ici au cadre généalogique.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Les fils de
  rationale: Le pluriel construit בְּנֵי désigne ici les fils directs, puisque trois personnes sont nommées. Le ו initial assure la continuité généalogique, mais n'a pas besoin d'être rendu par « et » en français dans cette entrée de liste.
- source_word: קֹרַח
  choice: Coré
  rationale: Forme française traditionnelle et largement reconnue du nom propre hébreu.
- source_word: אַסִּיר
  choice: Assir
  rationale: Nom propre dans ce contexte généalogique; la translittération « Assir » permet aussi de refléter la consonne redoublée.
- source_word: וְאֶלְקָנָה
  choice: Elqana
  rationale: Translittération française claire du nom propre; la conjonction est exprimée naturellement dans l'énumération par « et » devant le dernier nom.
- source_word: וַאֲבִיאָסָף
  choice: Abiasaph
  rationale: Forme française intelligible du nom propre hébreu, conservant ses principaux éléments phonétiques.
- source_word: אֵלֶּה
  choice: Tels sont
  rationale: Le démonstratif ouvre une proposition d'identification; « Tels sont » est naturel, digne et fidèle au pluriel hébreu.
- source_word: מִשְׁפְּחֹת
  choice: les clans
  rationale: Dans ce cadre tribal et généalogique, מִשְׁפָּחוֹת désigne des groupes de parenté plus larges que la famille domestique; « clans » rend précisément cette réalité.
- source_word: הַקָּרְחִי
  choice: des Coréites
  rationale: Le gentilé hébreu désigne ceux qui appartiennent à la lignée de Coré; « Coréites » est la forme collective française concise.
