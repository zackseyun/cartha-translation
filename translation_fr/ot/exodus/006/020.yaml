  text: וַ/יִּקַּ֨ח עַמְרָ֜ם אֶת יוֹכֶ֤בֶד דֹּֽדָת/וֹ֙ ל֣/וֹ לְ/אִשָּׁ֔ה וַ/תֵּ֣לֶד ל֔/וֹ אֶֽת אַהֲרֹ֖ן וְ/אֶת מֹשֶׁ֑ה וּ/שְׁנֵי֙ חַיֵּ֣י עַמְרָ֔ם שֶׁ֧בַע וּ/שְׁלֹשִׁ֛ים וּ/מְאַ֖ת שָׁנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/020.yaml
  text: Amram took Jochebed[a], his father’s sister, as his wife, and she bore to him Aaron and Moses. The years of Amram’s life were 137 years.
translation:
  language: fr
  text: Amram prit Yokébed[a], sa tante, pour femme, et elle lui enfanta Aaron et Moïse. Amram vécut 137 ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre possibilité : « la sœur de son père » (sa tante paternelle).'
    reason: Le terme hébreu peut désigner une tante de façon générale ; la formulation plus spécifique constitue une interprétation possible, non une précision certaine du texte.
lexical_decisions:
- source_word: וַיִּקַּח ... לְאִשָּׁה
  choice: prit ... pour femme
  rationale: Cette tournure française naturelle conserve l’image de l’hébreu לקח et exprime clairement le mariage.
- source_word: דֹּדָתוֹ
  choice: sa tante
  rationale: Le féminin de דּוֹד désigne ici une proche parente de la génération des parents, vraisemblablement la tante paternelle. « Sa tante » reste précis et naturel sans rendre obligatoire dans le texte principal la valeur plus étroite signalée en note.
- source_word: וַתֵּלֶד לוֹ
  choice: Elle lui donna pour fils
  rationale: Cette formulation rend à la fois l’idée d’enfanter et le complément indirect לוֹ, dans un français généalogique digne mais courant.
- source_word: שְׁנֵי חַיֵּי עַמְרָם
  choice: Amram vécut
  rationale: Cette formulation idiomatique exprime exactement la durée de vie indiquée par la construction hébraïque, sans lourdeur.
- source_word: שֶׁבַע וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: 137 ans
  rationale: Les chiffres donnent clairement en français moderne la valeur exacte du nombre hébreu.
- source_word: יוֹכֶבֶד / אַהֲרֹן / מֹשֶׁה / עַמְרָם
  choice: Yokébed / Aaron / Moïse / Amram
  rationale: Les noms suivent des formes françaises reconnaissables, avec « Yokébed » proche de la forme hébraïque.
theological_decisions:
- issue: Le degré de précision du lien de parenté dans un mariage que la législation ultérieure interdira
  choice: sa tante
  alternative: la sœur de son père / sa tante paternelle
  rationale: Le récit énonce le lien familial sans commentaire moral. Le texte principal ne l’atténue pas, tandis que la note conserve la lecture plus précise possible sans résoudre silencieusement la question lexicale.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe généalogique a été allégée sans omettre les relations familiales ni la durée de vie.
