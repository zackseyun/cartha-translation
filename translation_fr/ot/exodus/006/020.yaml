review_pass:
  verdict: revise
  source_fidelity: Le texte principal rend correctement la prise pour épouse, le lien familial général (« sa tante »), la naissance d’Aaron et de Moïse, ainsi que les 137 ans. Toutefois, la note présente « la sœur de son père » comme une précision alors qu’il s’agit d’une interprétation plus étroite du terme de parenté, à conserver comme possibilité et non comme clarification certaine.
  naturalness: '« Elle lui donna pour fils Aaron et Moïse » est maladroit en français moderne : la construction « donner pour fils » ne rend pas naturellement l’acte d’enfanter, et l’emploi de « fils » avec deux noms est lourd. « Elle lui enfanta Aaron et Moïse » est clair, idiomatique dans un registre biblique sobre et fidèle au verbe hébreu.'
  terminology: « Tante » conserve l’ambiguïté lexicale de דֹּדָתוֹ sans atténuer le proche lien de parenté. Les noms Yokébed, Aaron, Moïse et Amram sont cohérents. La note doit éviter d’affirmer que la lecture paternelle est nécessairement plus précise.
  issues:
  - severity: medium
    issue: La note qualifie « la sœur de son père » de lecture « plus précisément » et « plus étroite ».
    rationale: Le terme hébreu permet « tante », tandis que la relation exacte « sœur de son père » relève d’une lecture lexicale/contextuelle plus déterminée. La note doit présenter cette formulation comme une autre possibilité, afin de préserver l’ambiguïté.
  - severity: medium
    issue: « Elle lui donna pour fils Aaron et Moïse » n’est pas une formulation française naturelle pour « elle lui enfanta ».
    rationale: La tournure est syntaxiquement pesante et peut suggérer qu’elle les lui a donnés comme fils plutôt qu’elle les a mis au monde. « Elle lui enfanta » exprime directement et sans ajout le sens de וַתֵּלֶד לוֹ.
  revised_text: Amram prit Yokébed[a], sa tante, pour femme, et elle lui enfanta Aaron et Moïse. Amram vécut 137 ans.
  revised_footnotes:
  - marker: a
    text: 'Autre possibilité : « la sœur de son père » (sa tante paternelle).'
    reason: Le terme hébreu peut désigner une tante de façon générale ; la formulation plus spécifique constitue une interprétation possible, non une précision certaine du texte.
