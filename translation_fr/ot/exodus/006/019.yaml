  text: וּ/בְנֵ֥י מְרָרִ֖י מַחְלִ֣י וּ/מוּשִׁ֑י אֵ֛לֶּה מִשְׁפְּחֹ֥ת הַ/לֵּוִ֖י לְ/תֹלְדֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/019.yaml
  text: 'And the sons of Merari: Mahli and Mushi[a]. These are the clans of Levi according to their generations.'
translation:
  language: fr
  text: 'Et les fils de Merari : Mahli et Mushi. Tels sont les clans de Lévi, selon leurs lignées.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי מְרָרִי
  choice: Et les fils de Merari
  rationale: Dans ce contexte généalogique, בְּנֵי désigne naturellement les « fils »; la conjonction initiale maintient la continuité de l’énumération.
- source_word: מַחְלִי וּ/מוּשִׁי
  choice: Mahli et Mushi
  rationale: Les noms propres sont translittérés sous des formes françaises usuelles, et la conjonction est rendue par « et ».
- source_word: אֵלֶּה
  choice: Tels sont
  rationale: Cette tournure française naturelle conserve la fonction récapitulative et identificatrice du démonstratif hébreu.
- source_word: מִשְׁפְּחֹת
  choice: les clans
  rationale: Dans un cadre tribal et généalogique, מִשְׁפָּחוֹת désigne des groupes de parenté au sein d’une tribu; « clans » est ici plus précis que « familles ».
- source_word: הַ/לֵּוִי
  choice: de Lévi
  rationale: Le singulier avec article a vraisemblablement une valeur collective ou gentilique. « De Lévi » exprime clairement en français la lignée tribale visée sans faire croire qu’il s’agit d’un Lévite isolé.
- source_word: לְ/תֹלְדֹתָם
  choice: selon leurs lignées
  rationale: תּוֹלְדוֹת renvoie ici aux lignes de descendance. « Lignées » est naturel en français moderne et convient au registre généalogique.
theological_decisions:
- issue: Valeur du singulier הַלֵּוִי
  choice: de Lévi
  alternative: du Lévite / des Lévites
  rationale: Le singulier hébreu semble fonctionner collectivement pour la lignée lévitique. « De Lévi » préserve la référence généalogique tout en évitant d’imposer l’idée d’un individu précis.
translation_notes:
  register: Français international moderne, sobre et digne. La structure brève de la liste généalogique est conservée; « selon leurs lignées » évite le calque moins naturel « selon leurs générations ».
