  text: וַ/יְדַבֵּ֥ר מֹשֶׁ֛ה כֵּ֖ן אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֤א שָֽׁמְעוּ֙ אֶל מֹשֶׁ֔ה מִ/קֹּ֣צֶר ר֔וּחַ וּ/מֵ/עֲבֹדָ֖ה קָשָֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/009.yaml
  text: So Moses spoke thus to the sons of Israel[b][a], but they did not listen to Moses because of discouragement and harsh slavery.
translation:
  language: fr
  text: Moïse dit cela aux Israélites, mais ils ne l’écoutèrent pas, à cause de leur découragement[a] et de leur dur esclavage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à cause de la brièveté du souffle » ou « de l’esprit ». L’expression peut évoquer le découragement, l’accablement ou une détresse qui coupe le souffle.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « du travail pénible » ou « du dur labeur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר ... כֵּן
  choice: rapporta ces paroles
  rationale: כֵּן renvoie au message divin précédent. « Rapporta ces paroles » exprime naturellement en français que Moïse transmet ce qu’il vient de recevoir, sans le ton archaïque de « parla ainsi ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Dans ce contexte collectif, l’expression hébraïque désigne le peuple d’Israël. « Les Israélites » est précis, naturel et inclusif en français moderne, tandis que « les fils d’Israël » risquerait d’être compris comme ne visant que les hommes.
- source_word: וְלֹא שָׁמְעוּ אֶל מֹשֶׁה
  choice: mais ils ne l’écoutèrent pas
  rationale: שׁמע אל signifie ici écouter ou prêter attention à quelqu’un. Le pronom évite une répétition pesante de « Moïse » tout en gardant le référent clair.
- source_word: מִקֹּצֶר רוּחַ
  choice: tant ils avaient l’esprit accablé
  rationale: Littéralement « à cause d’une brièveté de souffle/esprit », l’expression évoque une capacité intérieure étouffée ou brisée par l’oppression. Cette formulation française rend la détresse sans la réduire à l’impatience.
- source_word: וּמֵעֲבֹדָה קָשָׁה
  choice: par leur dur esclavage
  rationale: עֲבֹדָה peut désigner le travail ou le service, mais le contexte égyptien est celui d’un travail forcé servile. « Dur esclavage » rend clairement cette réalité oppressive tout en conservant l’intensité de קָשָׁה.
theological_decisions:
- issue: Nature de la condition d’Israël exprimée par עֲבֹדָה קָשָׁה
  choice: leur dur esclavage
  alternative: leur travail pénible
  rationale: Le terme peut lexicalement désigner un travail pénible, mais le contexte immédiat et plus large de l’Exode établit une condition d’asservissement. La traduction « esclavage » explicite cette réalité historique sans introduire de lecture confessionnelle.
- issue: Interprétation de קֹצֶר רוּחַ
  choice: l’esprit accablé
  alternative: le souffle court / le découragement
  rationale: Le texte associe littéralement la brièveté ou l’étroitesse au רוּחַ, qui peut signifier souffle ou esprit. Le choix principal communique l’épuisement intérieur tout en conservant en note l’image concrète et l’ambiguïté de l’hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au récit écrit. La tournure « tant… par » relie naturellement les deux causes coordonnées en hébreu, sans effacer l’image idiomatique signalée en note.
