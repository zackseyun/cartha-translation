revisions:
- from: Moïse rapporta ces paroles aux Israélites, mais ils ne l’écoutèrent pas, tant ils avaient l’esprit accablé[a] par leur dur esclavage[b].
  to: Moïse dit cela aux Israélites, mais ils ne l’écoutèrent pas, à cause de leur découragement[a] et de leur dur esclavage[b].
  rationale: La révision rétablit explicitement les deux causes coordonnées par l’hébreu, sans décider que le dur esclavage est grammaticalement la cause de l’état intérieur. Elle emploie « dit cela » pour rendre naturellement וַיְדַבֵּר ... כֵּן, conserve « Israélites » et « dur esclavage » dans le texte, et préserve en notes les alternatives ainsi que l’imagerie ambiguë de קֹצֶר רוּחַ.
