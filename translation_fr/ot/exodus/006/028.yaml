  text: וַ/יְהִ֗י בְּ/י֨וֹם דִּבֶּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֖ה בְּ/אֶ֥רֶץ מִצְרָֽיִם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/028.yaml
  text: It happened on the day when Yahweh spoke to Moses in the land of Egypt—[a][b]
translation:
  language: fr
  text: Il arriva, le jour où Yahweh parla à Moïse dans le pays d’Égypte…[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et il arriva » ou « Et il advint ».'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « YHWH »; traditionnellement rendu par « le SEIGNEUR ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Il arriva
  rationale: La forme narrative de היה introduit ici une transition ou une reprise. « Il arriva » reste proche de l’hébreu tout en étant compréhensible en français moderne; elle conserve aussi le caractère suspendu de la phrase.
- source_word: בְּיוֹם
  choice: le jour où
  rationale: Cette tournure rend naturellement l’expression temporelle littérale « au jour où » sans lourdeur.
- source_word: דִּבֶּר ... אֶל מֹשֶׁה
  choice: parla à Moïse
  rationale: דבר avec אֶל signifie naturellement « parler à » quelqu’un.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à sa présence explicite dans le texte hébreu.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: dans le pays d’Égypte
  rationale: Cette formulation conserve le nom אֶרֶץ, « pays/terre », tout en étant idiomatique en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom personnel, tandis que « le SEIGNEUR » correspond au rendu traditionnel signalé en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Il arriva » conserve la transition narrative et la syntaxe inachevée du verset, marquée par des points de suspension plutôt que résolue à partir du verset suivant.
