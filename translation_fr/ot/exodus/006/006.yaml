  text: לָ/כֵ֞ן אֱמֹ֥ר לִ/בְנֵֽי יִשְׂרָאֵ֘ל אֲנִ֣י יְהוָה֒ וְ/הוֹצֵאתִ֣י אֶתְ/כֶ֗ם מִ/תַּ֨חַת֙ סִבְלֹ֣ת מִצְרַ֔יִם וְ/הִצַּלְתִּ֥י אֶתְ/כֶ֖ם מֵ/עֲבֹדָתָ֑/ם וְ/גָאַלְתִּ֤י אֶתְ/כֶם֙ בִּ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בִ/שְׁפָטִ֖ים גְּדֹלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/006.yaml
  text: Therefore say to the sons of Israel[a], ‘I am Yahweh, and I will bring you out from under the burdens of Egypt, and I will deliver you from their slavery[d][c][b], and I will redeem you with an outstretched arm and with great judgments.’
translation:
  language: fr
  text: 'C’est pourquoi, dis aux fils d’Israël[a] : « Je suis Yahweh[b]. Je vous ferai sortir de sous les corvées imposées par l’Égypte, je vous délivrerai de leur esclavage[c] et je vous rachèterai par un bras étendu et par de grands jugements[d]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux Israélites » ou « aux enfants d’Israël ». L’hébreu dit littéralement « aux fils d’Israël » ; l’expression désigne ici le peuple collectivement.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : YHWH, nom personnel de Dieu ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: alternative_reading
  - marker: c
    text: Ou « de leur servitude ». Le mot hébreu peut désigner le service ou le travail, mais il s’agit ici d’un travail forcé et oppressif.
    reason: lexical_alternative
  - marker: d
    text: Ou « par de grands actes de jugement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque naturellement en français la conséquence tirée de la parole divine précédente.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: Conserve l’expression familiale littérale de l’hébreu, tout en signalant en note l’emploi collectif.
- source_word: אֲנִי יְהוָה
  choice: Je suis Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme et maintient la force de l’auto-identification.
- source_word: וְהוֹצֵאתִי אֶתְכֶם מִתַּחַת סִבְלֹת מִצְרַיִם
  choice: Je vous ferai sortir de dessous les fardeaux que vous imposent les Égyptiens
  rationale: « Ferai sortir » rend la forme causative; « de dessous les fardeaux » conserve l’image concrète, tandis que l’explicitation des Égyptiens comme agents évite en français l’ambiguïté de « fardeaux de l’Égypte ».
- source_word: וְהִצַּלְתִּי אֶתְכֶם מֵעֲבֹדָתָם
  choice: je vous délivrerai de leur esclavage
  rationale: Dans ce contexte, עֲבֹדָה désigne la servitude oppressive plutôt qu’un service neutre.
- source_word: וְגָאַלְתִּי אֶתְכֶם
  choice: je vous rachèterai
  rationale: « Racheter » garde la portée juridique, familiale et théologique du verbe גאל.
- source_word: בִּזְרוֹעַ נְטוּיָה
  choice: par mon bras étendu
  rationale: Reproduit l’image anthropomorphique traditionnelle de l’intervention puissante de Dieu; le possessif est naturel en français puisque Dieu parle de son propre bras.
- source_word: וּבִשְׁפָטִים גְּדֹלִים
  choice: en accomplissant de grands jugements
  rationale: Rend la valeur instrumentale de la préposition et fait comprendre que les « jugements » sont des actes judiciaires divins.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte donne directement le nom d’alliance; sa translittération distingue le nom personnel d’un titre tout en restant fidèle à la source.
- issue: Portée de לִבְנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: Israélites / enfants d’Israël
  rationale: Le choix préserve la formulation familiale masculine du texte sans nier sa référence collective à l’ensemble du peuple, précisée en note.
- issue: Sens contextuel de עֲבֹדָה
  choice: esclavage
  alternative: servitude / service
  rationale: La domination coercitive égyptienne impose ici le sens fort d’esclavage; « service » atténuerait indûment la situation.
- issue: Nature des שְׁפָטִים
  choice: de grands jugements
  alternative: de grands actes de jugement
  rationale: La formulation conserve le terme judiciaire et laisse le contexte identifier ses manifestations concrètes, notamment les interventions contre l’Égypte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la progression solennelle des quatre engagements divins, avec une ponctuation naturelle. Les images hébraïques structurantes (« de dessous les fardeaux », « bras étendu ») sont maintenues sans archaïsme excessif.
