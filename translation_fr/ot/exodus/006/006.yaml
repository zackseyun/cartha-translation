revisions:
- from: 'C’est pourquoi, dis aux fils d’Israël[a] : « Je suis Yahweh[b]. Je vous ferai sortir de dessous les fardeaux que vous imposent les Égyptiens, je vous délivrerai de leur esclavage[c] et je vous rachèterai par mon bras étendu, en accomplissant de grands jugements[d]. »'
  to: 'C’est pourquoi, dis aux fils d’Israël[a] : « Je suis Yahweh[b]. Je vous ferai sortir de sous les corvées imposées par l’Égypte, je vous délivrerai de leur esclavage[c] et je vous rachèterai par un bras étendu et par de grands jugements[d]. »'
  rationale: La révision rétablit le parallélisme de l’hébreu (« par un bras étendu et par de grands jugements »), sans imposer une identification particulière des jugements. Elle améliore aussi l’idiomaticité française du premier acte de délivrance, tout en préservant son image et sa distinction d’avec l’esclavage mentionné ensuite.
