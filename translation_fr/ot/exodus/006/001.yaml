  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַתָּ֣ה תִרְאֶ֔ה אֲשֶׁ֥ר אֶֽעֱשֶׂ֖ה לְ/פַרְעֹ֑ה כִּ֣י בְ/יָ֤ד חֲזָקָה֙ יְשַׁלְּחֵ֔/ם וּ/בְ/יָ֣ד חֲזָקָ֔ה יְגָרְשֵׁ֖/ם מֵ/אַרְצֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/001.yaml
  text: Then Yahweh said to Moses[a], “Now you will see what I will do to Pharaoh, for by a strong hand he will let them go, and by a strong hand he will drive them out from his land.”
translation:
  language: fr
  text: 'Alors Yahweh dit à Moïse : « Maintenant, tu verras ce que je ferai à Pharaon. Car c’est par une main forte qu’il les laissera partir, et c’est par une main forte qu’il les chassera de son pays[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sous la contrainte, il les laissera partir et, sous la contrainte, il les chassera ». L’expression répétée « par une main forte » peut indiquer que Pharaon agira sous l’effet d’une force irrésistible, ultimement la puissance de Dieu.'
    reason: Alternative lexicale et explicitation prudente de l’ambiguïté de l’expression hébraïque בְּיָד חֲזָקָה.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... dit
  rationale: Le wayyiqtol fait progresser le récit ; « Alors » exprime naturellement cette succession en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération préserve le nom divin personnel plutôt que de lui substituer un titre.
- source_word: עַתָּה תִרְאֶה
  choice: Maintenant, tu verras
  rationale: Cette formulation conserve l’accent temporel de עַתָּה et la valeur future de תִרְאֶה.
- source_word: אֲשֶׁר אֶעֱשֶׂה לְפַרְעֹה
  choice: ce que je vais faire à Pharaon
  rationale: Tour français naturel qui respecte la proposition relative et ne renforce pas inutilement la valeur adversative de לְ.
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’action divine annoncée.
- source_word: בְיָד חֲזָקָה
  choice: sous l’action d’une main forte
  rationale: Conserve l’image de la main et laisse entendre la contrainte exercée, sans identifier explicitement dans le texte principal à qui appartient cette main.
- source_word: יְשַׁלְּחֵם
  choice: il les laissera partir
  rationale: Dans ce contexte, שׁלח désigne la libération des Israélites par Pharaon.
- source_word: וּבְיָד חֲזָקָה
  choice: oui, sous l’action d’une main forte
  rationale: La répétition hébraïque est conservée ; « oui » rend ici le renforcement rhétorique du second membre sans supprimer le parallélisme.
- source_word: יְגָרְשֵׁם
  choice: il les chassera
  rationale: Le verbe גרש exprime une expulsion plus énergique qu’un simple renvoi.
- source_word: מֵאַרְצוֹ
  choice: de son pays
  rationale: « Pays » est naturel en français pour désigner ici le territoire gouverné par Pharaon.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: « Yahweh » préserve le nom personnel attesté par le tétragramme sans le remplacer par un titre.
- issue: Référent et fonction de בְיָד חֲזָקָה
  choice: Conserver l’image d’une « main forte » tout en suggérant la contrainte sans en préciser explicitement l’agent
  alternative: « par sa main puissante » ; « sous la contrainte » ; « à cause d’une main puissante »
  rationale: La construction peut évoquer la force qui contraindra Pharaon, ultimement la puissance de Dieu, mais le texte ne précise pas grammaticalement le possesseur de la main. La formulation et la note préservent cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme et la répétition de l’hébreu sont maintenus, tout en évitant le calque peu naturel « par une main forte ». Le point-virgule souligne la progression entre laisser partir et chasser.
