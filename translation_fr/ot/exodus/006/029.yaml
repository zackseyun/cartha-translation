  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֥ה לֵּ/אמֹ֖ר אֲנִ֣י יְהוָ֑ה דַּבֵּ֗ר אֶל פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם אֵ֛ת כָּל אֲשֶׁ֥ר אֲנִ֖י דֹּבֵ֥ר אֵלֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/029.yaml
  text: Then Yahweh spoke to Moses[a], saying, “I am Yahweh. Speak to Pharaoh king of Egypt all that I speak to you.”
translation:
  language: fr
  text: 'Alors Yahweh parla à Moïse en ces termes : « Je suis Yahweh. Dis au pharaon, roi d’Égypte, tout ce que je te dis[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout ce que je suis en train de te dire ».
    reason: Le participe hébreu דֹּבֵר peut recevoir une valeur progressive explicite.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Alors … parla
  rationale: Le wayyiqtol fait progresser le récit. « Alors » marque naturellement cette progression, tandis que « parla » conserve le sens de דבר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel יהוה au lieu de lui substituer un titre.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif introduit le discours direct. « En ces termes » est une formulation française naturelle et digne, sans ajouter de contenu.
- source_word: אֲנִי יְהוָה
  choice: Je suis Yahweh
  rationale: La proposition nominale hébraïque appelle la copule « suis » en français et conserve l’affirmation solennelle d’identité.
- source_word: דַּבֵּר אֶל
  choice: Parle à … et dis-lui
  rationale: « Parle à » rend directement l’impératif et sa préposition. L’ajout idiomatique de « et dis-lui » permet d’introduire naturellement en français le contenu exprimé par אֵת כָּל אֲשֶׁר, sans modifier le sens.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: le pharaon, roi d’Égypte
  rationale: Cette apposition suit de près l’hébreu. L’article devant « pharaon » correspond à l’usage courant en français moderne lorsqu’il s’agit du souverain comme titre.
- source_word: אֵת כָּל אֲשֶׁר
  choice: tout ce que
  rationale: Cette expression restitue la totalité du contenu à communiquer dans un français simple et naturel.
- source_word: אֲנִי דֹּבֵר אֵלֶיךָ
  choice: je te dis
  rationale: Le présent français peut exprimer la parole divine en cours ou caractéristique dans ce contexte. Il conserve aussi la répétition du verbe דבר, tout en restant idiomatique.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel révélé sans le remplacer par un titre ni adopter la forme tardive « Jéhovah ».
- issue: Portée temporelle du participe דֹּבֵר
  choice: je te dis
  alternative: je suis en train de te dire
  rationale: Le participe peut recevoir une lecture progressive, mais le présent simple français garde cette possibilité contextuelle sans imposer un déroulement strictement immédiat. L’alternative est signalée en note.
translation_notes:
  register: Français international moderne, clair et solennel. La répétition de la racine דבר est partiellement conservée par « parla », « parle » et « dis », avec une légère adaptation syntaxique pour éviter une construction française maladroite.
