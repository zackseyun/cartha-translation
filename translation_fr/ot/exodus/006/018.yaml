base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/018.yaml
  text: 'The sons of Kohath: Amram, Izhar, Hebron, and Uzziel. And the years of Kohath’s life were one hundred thirty-three years.'
translation:
  language: fr
  text: 'Les fils de Qehath : Amram, Yitsehar, Hébron et Ouzziel. Qehath vécut cent trente-trois ans.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי קְהָת
  choice: Les fils de Qehath
  rationale: בְּנֵי est le pluriel construit de « fils » et désigne ici les fils nommés immédiatement. La conjonction initiale n’est pas rendue séparément, car la tournure française se lit naturellement comme la poursuite de la généalogie. « Qehath » suit une translittération française proche de l’hébreu.
- source_word: עַמְרָם וְיִצְהָר וְחֶבְרוֹן וְעֻזִּיאֵל
  choice: Amram, Yitsehar, Hébron et Ouzziel
  rationale: Les quatre noms propres sont translittérés selon des conventions françaises lisibles; les conjonctions hébraïques successives sont rendues par des virgules et un dernier « et ».
- source_word: וּשְׁנֵי חַיֵּי קְהָת
  choice: Qehath vécut
  rationale: L’expression littérale « les années de la vie de Qehath » est rendue par la formulation française naturelle « Qehath vécut », qui conserve exactement l’information de durée sans lourdeur.
- source_word: שָׁלֹשׁ וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: cent trente-trois ans
  rationale: L’ordre des éléments numériques hébreux est réorganisé conformément à l’usage français, et le singulier hébreu שָׁנָה après le nombre composé est naturellement rendu par le pluriel « ans ».
