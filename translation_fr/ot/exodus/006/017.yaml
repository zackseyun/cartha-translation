  text: 'The sons of Gershon: Libni and Shimei[a], by their clans.'
translation:
  language: fr
  text: 'Les fils de Guershon : Libni et Shiméï, selon leurs clans.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Les fils de
  rationale: Le pluriel construit de בֵּן introduit ici une liste généalogique de fils nommés; « les fils de » en conserve le sens immédiat et reste naturel en français.
- source_word: גֵרְשׁוֹן
  choice: Guershon
  rationale: Nom propre rendu selon sa forme française biblique usuelle, qui représente le ג initial par « Gu ».
- source_word: לִבְנִי
  choice: Libni
  rationale: Nom propre translittéré sous sa forme française usuelle.
- source_word: וְשִׁמְעִי
  choice: et Shiméï
  rationale: La conjonction וְ est rendue par « et »; le nom propre est donné sous sa forme française usuelle, avec le tréma signalant que les deux voyelles se prononcent séparément.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans ce contexte généalogique et tribal, מִשְׁפָּחָה désigne des groupes de parenté plus larges que la famille nucléaire. « Selon leurs clans » restitue naturellement la valeur distributive de לְ et le niveau social visé.
