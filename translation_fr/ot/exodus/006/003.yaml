base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/003.yaml
  text: And I appeared to Abraham[a], to Isaac, and to Jacob as God Almighty, but by my name, Yahweh[b], I was not known to them.
translation:
  language: fr
  text: Je suis apparu à Abraham, à Isaac et à Jacob comme le Dieu Tout-Puissant[a] ; mais sous mon nom, Yahvé, je ne me suis pas fait connaître à eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : El Shaddaï ; traditionnellement traduit par « le Dieu Tout-Puissant ».'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « mais sous mon nom, Yahvé, je n’ai pas été connu d’eux ». L’hébreu peut signifier non que les patriarches ignoraient le nom divin lui-même, mais qu’ils n’en connaissaient pas encore toute la portée dans l’alliance.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֵרָא
  choice: Je suis apparu
  rationale: Le nifal de ראה exprime directement l’idée d’apparaître. Cette traduction convient au langage des manifestations divines sans ajouter la notion interprétative de révélation.
- source_word: אֶל ... אֶל ... וְאֶל
  choice: à Abraham, à Isaac et à Jacob
  rationale: La répétition de la préposition hébraïque est conservée en français afin de respecter le rythme et l’insistance du texte.
- source_word: בְּאֵל שַׁדָּי
  choice: comme le Dieu Tout-Puissant
  rationale: La préposition ב introduit ici la qualité ou le nom sous lequel Dieu est apparu. « Dieu Tout-Puissant » est la traduction française traditionnelle et intelligible de אֵל שַׁדַּי, tandis que la forme hébraïque est signalée en note.
- source_word: וּשְׁמִי יְהוָה
  choice: mais sous mon nom, Yahvé
  rationale: « Sous mon nom » rend naturellement en français le rôle du nom dans la construction hébraïque. « Yahvé » représente le nom divin personnel plutôt que de lui substituer un titre.
- source_word: לֹא נוֹדַעְתִּי לָהֶם
  choice: je ne me suis pas fait connaître à eux
  rationale: 'Le nifal de ידע peut prendre ici un sens réfléchi : « me faire connaître ». Cette formulation française naturelle conserve le contraste portant sur la manière dont Dieu s’est révélé, sans préciser si le nom lui-même était auparavant inconnu.'
theological_decisions:
- issue: Sens de la non-connaissance du nom divin par les patriarches
  choice: je ne me suis pas fait connaître à eux
  alternative: je n’ai pas été connu d’eux
  rationale: La formulation principale rend le nifal de façon réfléchie et naturelle, mais ne décide pas si le verset parle de la simple connaissance du nom ou de la pleine portée de sa révélation dans l’alliance. La note maintient explicitement cette tension, importante puisque le nom divin apparaît dans les récits patriarcaux de la Genèse.
- issue: Représentation du tétragramme יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: La translittération française usuelle « Yahvé » présente le nom personnel explicitement mentionné dans le texte, au lieu de le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé composé convient au discours direct narratif. Le point-virgule marque clairement le contraste. La formulation évite à la fois l’archaïsme et l’explication doctrinale dans le corps du verset.
