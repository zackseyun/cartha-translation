  source_fidelity: 'Le sens et la structure généalogique sont fidèlement rendus : les six fils sont tous présents, la désignation explicite de Shaoul comme « fils de la Cananéenne » respecte le féminin singulier hébreu, et « clans » rend bien מִשְׁפְּחֹת dans ce contexte. Une légère correction orthographique est toutefois indiquée pour rendre audible le hiatus de יְמוּאֵל.'
