base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/015.yaml
  text: 'And the sons of Simeon: Jemuel[a], and Jamin, and Ohad, and Jakin, and Zohar, and Shaul the son of the Canaanite woman. These are the clans of Simeon.'
translation:
  language: fr
  text: 'Fils de Siméon : Yemouël, Yamin, Ohad, Yakin, Tsohar et Shaoul[a], fils de la Cananéenne. Tels sont les clans de Siméon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Shaoul est traditionnellement rendu par « Saül ». La forme hébraïque est שָׁאוּל (Shaoul).
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעוֹן
  choice: Fils de Siméon
  rationale: Dans cette liste généalogique, בְּנֵי désigne les fils. Le français omet naturellement la conjonction initiale dans une entrée de liste, tout en conservant le lien contextuel.
- source_word: יְמוּאֵל
  choice: Yemouel
  rationale: Translittération française transparente du nom hébreu, avec yod rendu par « Y » et la séquence vocalique conservée.
- source_word: וְיָמִין
  choice: Yamin
  rationale: Translittération directe adaptée aux conventions phonétiques françaises.
- source_word: וְאֹהַד
  choice: Ohad
  rationale: Translittération directe du nom propre hébreu.
- source_word: וְיָכִין
  choice: Yakin
  rationale: La translittération par « Y » rend directement le yod initial et évite une forme tributaire des conventions anglaises.
- source_word: וְצֹחַר
  choice: Tsohar
  rationale: « Ts » rend la consonne hébraïque tsadé de façon usuelle et lisible en français.
- source_word: וְשָׁאוּל
  choice: Shaoul
  rationale: Translittération française proche de la forme hébraïque שָׁאוּל, sans l'assimiler silencieusement à la forme traditionnelle « Saül ».
- source_word: בֶּן הַכְּנַעֲנִית
  choice: fils de la Cananéenne
  rationale: La forme féminine singulière הַכְּנַעֲנִית désigne explicitement une femme cananéenne. Le substantif féminin français conserve cette précision avec concision.
- source_word: אֵלֶּה מִשְׁפְּחֹת שִׁמְעוֹן
  choice: Tels sont les clans de Siméon
  rationale: La copule implicite est explicitée naturellement en français. « Clans » traduit le mieux les groupes de parenté internes à la tribu.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Les noms sont translittérés directement depuis l'hébreu selon des conventions françaises cohérentes. La répétition hébraïque de וְ devant les noms est rendue par la ponctuation française et un seul « et » avant le dernier élément.
