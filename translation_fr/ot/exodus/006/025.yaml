base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/025.yaml
  text: And Eleazar son of Aaron took for himself a wife from the daughters of Putiel[a], and she bore him Phinehas[b]. These are the heads of the fathers’ houses of the Levites by their clans.
translation:
  language: fr
  text: Éléazar, fils d’Aaron, prit pour femme une des filles de Poutiel[a], et elle lui enfanta Phinéas. Tels sont les chefs des maisons ancestrales des Lévites, selon leurs clans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une femme parmi les filles de Poutiel ». L’hébreu peut désigner une alliance avec la famille de Poutiel sans préciser laquelle de ses filles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַח לוֹ ... לְאִשָּׁה
  choice: prit pour femme
  rationale: Cette tournure française naturelle conserve l’expression matrimoniale hébraïque sans recourir au verbe plus général « épouser ».
- source_word: מִבְּנוֹת פּוּטִיאֵל
  choice: une des filles de Poutiel
  rationale: Le syntagme indique que la femme appartenait au groupe désigné comme les filles de Poutiel. En français, « une des filles » rend naturellement cette relation sans laisser croire qu’Éléazar aurait pris plusieurs femmes.
- source_word: וַתֵּלֶד לוֹ אֶת־פִּינְחָס
  choice: et elle lui donna naissance à Phinéas
  rationale: Le sujet féminin reste explicite, et le pronom « lui » représente le datif hébreu tout en donnant une phrase française claire.
- source_word: אֵלֶּה
  choice: Tels sont
  rationale: Cette formule de récapitulation convient au registre généalogique et conserve la valeur présentative du démonstratif hébreu.
- source_word: רָאשֵׁי אֲבוֹת
  choice: les chefs des maisons ancestrales
  rationale: L’expression hébraïque désigne les responsables d’unités de parenté ancestrales, et non simplement des pères biologiques.
- source_word: הַלְוִיִּם
  choice: des Lévites
  rationale: « Lévites » est la désignation française traditionnelle et précise des descendants de Lévi dans ce contexte.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans ce contexte généalogique, מִשְׁפָּחָה renvoie à des groupes de parenté plus larges que la famille nucléaire; « clans » est donc socialement précis et intelligible.
- source_word: אֶלְעָזָר / אַהֲרֹן / פּוּטִיאֵל / פִּינְחָס
  choice: Éléazar / Aaron / Poutiel / Phinéas
  rationale: Les noms suivent leurs formes françaises bibliques usuelles, avec une translittération lisible de Poutiel.
