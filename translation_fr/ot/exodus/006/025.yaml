    rationale: Le pluriel hébreu avec מן peut être compris comme une désignation de provenance ou d’appartenance familiale, sans expliciter laquelle des filles. Une note permet de conserver cette nuance.
  - severity: medium
    issue: « Elle lui donna naissance à Phinéas » n’est pas une formulation française idiomatique.
    rationale: En français, on dit « elle donna naissance à Phinéas », sans « lui », ou l’on emploie un verbe qui reçoit le datif, tel que « enfanter quelqu’un à quelqu’un ». La révision conserve ainsi le לוֹ hébreu.
