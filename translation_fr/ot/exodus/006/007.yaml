  text: וְ/לָקַחְתִּ֨י אֶתְ/כֶ֥ם לִ/י֙ לְ/עָ֔ם וְ/הָיִ֥יתִי לָ/כֶ֖ם לֵֽ/אלֹהִ֑ים וִֽ/ידַעְתֶּ֗ם כִּ֣י אֲנִ֤י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם הַ/מּוֹצִ֣יא אֶתְ/כֶ֔ם מִ/תַּ֖חַת סִבְל֥וֹת מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/007.yaml
  text: And I will take you to be my people[a], and I will be your God, and you will know that I am Yahweh your God[b], who brought you out from under the burdens of Egypt.
translation:
  language: fr
  text: Je vous prendrai pour mon peuple, et je serai votre Dieu. Vous saurez que je suis Yahweh, votre Dieu, qui vous fait sortir[a] de sous les fardeaux de l’Égypte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui vous aura fait sortir » ou « qui vous a fait sortir ». L’hébreu emploie un participe, qui peut présenter l’action comme en cours ou caractéristique, ou la considérer comme accomplie depuis le point de vue annoncé.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des corvées imposées par l’Égypte ». Le terme hébreu peut désigner des fardeaux concrets ou, par extension, le travail forcé et oppressif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: Je vous prendrai
  rationale: Le qatal précédé de וְ appartient ici à une suite de promesses et prend une valeur future. « Prendre » conserve la force relationnelle de l’acte sans l’expliciter excessivement.
- source_word: לִי לְעָם
  choice: pour mon peuple
  rationale: Cette formulation française naturelle exprime à la fois l’appartenance à Dieu et l’identité collective établie par l’alliance.
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: je serai votre Dieu
  rationale: Rendu idiomatique de la formule d’alliance, qui en préserve la dimension relationnelle.
- source_word: וִידַעְתֶּם
  choice: Vous saurez
  rationale: Le futur simple rend directement la promesse d’une connaissance qui sera confirmée par l’expérience de la délivrance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle en français moderne du nom divin, plutôt que substitution par un titre.
- source_word: הַמּוֹצִיא
  choice: qui vous fait sortir
  rationale: Le participe hébreu présente Yahweh comme celui qui accomplit la délivrance. Le présent français conserve mieux cette valeur en cours ou caractéristique, tandis qu’une lecture rétrospective demeure possible et est signalée en note.
- source_word: מִתַּחַת
  choice: de sous
  rationale: Conserve l’image spatiale de la sortie hors d’une oppression sous laquelle le peuple se trouvait.
- source_word: סִבְלֹת
  choice: les fardeaux
  rationale: Le terme désigne des charges et, par extension, le travail oppressif. « Fardeaux » préserve l’image concrète tout en permettant le sens figuré.
- source_word: מִצְרָיִם
  choice: l’Égypte
  rationale: Nom français standard du pays; le complément peut désigner l’oppression imposée par l’Égypte.
theological_decisions:
- issue: Formule d’alliance
  choice: Je vous prendrai pour mon peuple, et je serai votre Dieu
  alternative: Je vous prendrai pour moi comme peuple, et je serai Dieu pour vous
  rationale: Le choix retenu reproduit naturellement la formule relationnelle de l’hébreu sans lui imposer une systématisation théologique ultérieure.
- issue: Rendu du nom divin
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre יהוה. Sa translittération maintient la distinction entre le nom divin et un titre.
- issue: Valeur temporelle du participe הַמּוֹצִיא
  choice: qui vous fait sortir
  alternative: qui vous a fait sortir
  rationale: Le participe peut présenter l’action comme en cours ou caractéristique, mais aussi, depuis le point de vue futur annoncé par « vous saurez », comme une délivrance accomplie. Le texte principal conserve la forme participiale et la note préserve l’autre lecture.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image hébraïque « de sous les fardeaux », légèrement marquée mais intelligible, ainsi que l’ambiguïté temporelle du participe au moyen d’une note.
