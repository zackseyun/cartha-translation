base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/030.yaml
  text: But Moses said before the LORD, “Look, I am uncircumcised of lips; so how will Pharaoh listen to me?”
translation:
  language: fr
  text: 'Mais Moïse dit devant le SEIGNEUR : « Voici, j’ai les lèvres incirconcises. Comment donc le pharaon m’écoutera-t-il ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: devant le SEIGNEUR
  rationale: Reproduit directement l’expression hébraïque et rend le nom divin selon la convention française usuelle en petites capitales.
- source_word: הֵן
  choice: Voyez
  rationale: Marque l’appel à l’attention sans donner au discours un ton archaïque.
- source_word: עֲרַל שְׂפָתַיִם
  choice: mes lèvres sont incirconcises
  rationale: Conserve l’image hébraïque frappante et sa tension, plutôt que de l’interpréter comme une simple difficulté d’élocution.
- source_word: וְאֵיךְ יִשְׁמַע אֵלַי פַּרְעֹה
  choice: Comment donc le pharaon m’écouterait-il ?
  rationale: Le conditionnel français exprime naturellement la question rhétorique et le doute de Moïse; « écouter » préserve la possibilité d’entendre ou de prêter attention.
theological_decisions:
- issue: Sens de « lèvres incirconcises »
  choice: Conserver la métaphore littérale
  alternative: « je parle difficilement » ou « je ne sais pas bien parler »
  rationale: Le texte hébreu emploie une image théologiquement chargée et ne précise pas s’il s’agit d’un trouble de parole, d’une incapacité rhétorique ou d’une indignité; l’expliciter résoudrait indûment cette ambiguïté.
- issue: Rendu du tétragramme יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: Suit la convention de lecture largement reçue en français et l’orientation éditoriale fournie, sans introduire une vocalisation contestée.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde l’étrangeté intentionnelle de la métaphore hébraïque. « Le pharaon » est employé comme titre, conformément à l’usage français courant.
