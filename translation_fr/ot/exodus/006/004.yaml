  text: וְ/גַ֨ם הֲקִמֹ֤תִי אֶת בְּרִיתִ/י֙ אִתָּ֔/ם לָ/תֵ֥ת לָ/הֶ֖ם אֶת אֶ֣רֶץ כְּנָ֑עַן אֵ֛ת אֶ֥רֶץ מְגֻרֵי/הֶ֖ם אֲשֶׁר גָּ֥רוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/004.yaml
  text: I also established my covenant with them[a], to give them the land of Canaan, the land where they lived as sojourners.
translation:
  language: fr
  text: J’ai aussi établi mon alliance avec eux, pour leur donner le pays de Canaan, le pays où ils ont séjourné en étrangers.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « le pays de leurs séjours, dans lequel ils ont séjourné » ; le terme désigne le séjour de personnes vivant comme étrangères.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: J’ai aussi
  rationale: Rend naturellement la valeur additive de וְגַם et relie l’affirmation au contexte précédent.
- source_word: הֲקִמֹתִי אֶת־בְּרִיתִי
  choice: établi mon alliance
  rationale: « Établir une alliance » est une formulation française solennelle et usuelle qui correspond à l’idiome קום + ברית sans introduire de distinction théologique étrangère au texte.
- source_word: לָתֵת לָהֶם
  choice: pour leur donner
  rationale: Exprime clairement la valeur de but de l’infinitif hébreu dans un français naturel.
- source_word: אֶרֶץ כְּנָעַן
  choice: le pays de Canaan
  rationale: « Pays » convient naturellement à cette désignation territoriale en français tout en conservant le nom propre.
- source_word: אֶרֶץ מְגֻרֵיהֶם אֲשֶׁר גָּרוּ בָהּ
  choice: le pays où ils ont séjourné en étrangers
  rationale: Rend le champ lexical répété de גור et la condition de résidents non établis, sans la tournure lourde « le pays de leurs séjours ».
theological_decisions:
- issue: Idiome d’alliance קום + ברית
  choice: établi mon alliance
  alternative: confirmé mon alliance
  rationale: « Établi » préserve l’idée de l’engagement souverain et ferme de Dieu, tandis que « confirmé » pourrait suggérer plus précisément le renouvellement d’une alliance déjà conclue; l’hébreu permet l’expression conventionnelle retenue.
translation_notes:
  register: Français international moderne, clair et digne. La répétition hébraïque de la racine גור est allégée dans le texte principal, mais signalée dans la note; « en étrangers » conserve le statut social implicite.
