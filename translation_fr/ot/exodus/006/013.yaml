source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ וַ/יְצַוֵּ/ם֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶל פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם לְ/הוֹצִ֥יא אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/013.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], and he commanded them concerning the sons of Israel and concerning Pharaoh king of Egypt[b], to bring the sons of Israel out from the land of Egypt.
translation:
  language: fr
  text: Yahweh parla alors à Moïse et à Aaron, et leur donna ses ordres au sujet des Israélites et du pharaon, roi d’Égypte,[a] afin de faire sortir les Israélites du pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « leur donna des ordres à l’intention des Israélites et du pharaon, roi d’Égypte ». La préposition hébraïque peut marquer les destinataires de l’ordre; dans ce contexte, elle indique probablement plutôt que l’ordre donné à Moïse et Aaron concernait à la fois Israël et le pharaon.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: parla alors
  rationale: Le wayyiqtol fait progresser le récit; « alors » en exprime naturellement la succession en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: à Moïse et à Aaron
  rationale: Avec דבר, אֶל désigne normalement les destinataires de la parole.
- source_word: וַיְצַוֵּם
  choice: et leur donna ses ordres
  rationale: Cette formulation française naturelle conserve la valeur autoritative de צוה; le suffixe pronominal renvoie à Moïse et Aaron.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: au sujet des Israélites
  rationale: Après צוה, אֶל peut désigner ceux que concerne l'ordre. « Israélites » rend naturellement en français la désignation nationale בְּנֵי יִשְׂרָאֵל.
- source_word: וְאֶל פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: et du pharaon, roi d’Égypte
  rationale: La construction est parallèle à la précédente et indique vraisemblablement l'autre partie concernée par les ordres; l'article français devant « pharaon » convient ici au titre accompagné de l'apposition.
- source_word: לְהוֹצִיא
  choice: afin de faire sortir
  rationale: L'infinitif hiphil de יצא a une valeur causative; « faire sortir » la conserve précisément, tandis que « afin de » explicite la visée des ordres.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: du pays d’Égypte
  rationale: Cette expression conserve le nom אֶרֶץ et constitue la tournure française idiomatique correspondante.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: « Yahweh » représente directement le nom propre hébreu sans le remplacer par un titre.
- issue: Interprétation des groupes introduits par אֶל après וַיְצַוֵּם
  choice: les ordres concernent les Israélites et le pharaon
  alternative: les Israélites et le pharaon sont les destinataires directs de l'ordre
  rationale: Le suffixe de וַיְצַוֵּם identifie Moïse et Aaron comme destinataires de l'ordre. Dans le contexte, les deux groupes suivants en indiquent probablement l'objet, mais la note préserve l'autre analyse syntaxique possible.
- issue: Rendu collectif de בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël; les enfants d’Israël
  rationale: En français moderne, « les Israélites » désigne clairement l'ensemble du peuple et évite que « fils » soit compris comme excluant les femmes, sans modifier la référence du collectif hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est fluide tout en maintenant l'autorité du commandement, le nom divin et l'ambiguïté de la préposition hébraïque au moyen d'une note.
