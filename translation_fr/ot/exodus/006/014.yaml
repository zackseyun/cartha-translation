review_pass:
  verdict: revise
  source_fidelity: 'Le sens généalogique est globalement fidèle : Ruben est bien identifié comme le premier-né d’Israël et les quatre fils ainsi que les clans sont correctement représentés. Toutefois, « maisons ancestrales » peut évoquer des demeures héritées plutôt que les unités de parenté patrilinéaires désignées par בֵית אֲבֹתָם. « Maisons de leurs pères » préserve ce terme technique sans ajouter d’interprétation.'
  naturalness: La formulation est généralement fluide. La construction « les fils de Ruben, premier-né d’Israël, furent » rend toutefois l’apposition au singulier moins immédiatement lisible et transforme la présentation nominale hébraïque en proposition verbale. Une ponctuation présentative conserve le style généalogique tout en restant naturelle en français.
  terminology: « Chefs », « fils », « premier-né » et « clans » sont appropriés. Les translittérations du projet sont conservées. La correction porte uniquement sur l’expression de parenté « maisons de leurs pères ».
  issues:
