base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/014.yaml
  text: 'These are the heads of their fathers’ houses: the sons of Reuben[a], the firstborn of Israel: Hanoch and Pallu, Hezron and Carmi. These are the clans of Reuben.'
translation:
  language: fr
  text: 'Voici les chefs de leurs maisons de pères : les fils de Ruben, le premier-né d’Israël : Hénok, Pallou, Hetsron et Karmi. Tels sont les clans de Ruben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה רָאשֵׁי
  choice: Voici les chefs
  rationale: La tournure présentative française introduit naturellement la liste, tandis que « chefs » rend le rôle des principaux représentants des groupes familiaux.
- source_word: בֵית אֲבֹתָם
  choice: leurs maisons ancestrales
  rationale: Cette expression conserve l’idée des unités de parenté issues des pères sans employer le calque peu naturel « maisons de leurs pères ».
- source_word: בְּנֵי רְאוּבֵן
  choice: les fils de Ruben
  rationale: Le contexte énumère les fils immédiats de Ruben ; « fils » est donc plus précis que « descendants ».
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: premier-né d’Israël
  rationale: L’apposition identifie Ruben comme le premier-né d’Israël et conserve la formulation généalogique.
- source_word: חֲנוֹךְ וּפַלּוּא חֶצְרוֹן וְכַרְמִי
  choice: Hénok, Pallou, Hetsron et Karmi
  rationale: Translittérations françaises modernes et reconnaissables des quatre noms hébreux.
- source_word: מִשְׁפְּחֹת
  choice: clans
  rationale: Dans ce contexte tribal, le mot désigne des groupes de parenté plus larges que la famille nucléaire ; « clans » est précis et naturel.
