    rationale: L’hébreu désigne des maisons/familles patrilinéaires, non simplement un lien vague avec les ancêtres ni des bâtiments ancestraux. « Maisons de leurs pères » maintient la terminologie généalogique et la référence paternelle.
  - severity: low
    issue: « furent » explicite davantage que nécessaire la liste nominale du texte source.
    rationale: Le texte hébreu présente les fils par une apposition/listing. Employer deux-points permet une présentation française claire et plus proche de cette construction, sans altérer le sens.
