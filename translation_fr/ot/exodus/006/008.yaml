  text: וְ/הֵבֵאתִ֤י אֶתְ/כֶם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לָ/תֵ֣ת אֹתָ֔/הּ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב וְ/נָתַתִּ֨י אֹתָ֥/הּ לָ/כֶ֛ם מוֹרָשָׁ֖ה אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/008.yaml
  text: And I will bring you into the land that I swore to give to Abraham[a], to Isaac, and to Jacob, and I will give it to you as a possession. I am Yahweh.
translation:
  language: fr
  text: Je vous ferai entrer dans le pays que j’ai juré[a] de donner à Abraham, à Isaac et à Jacob. Je vous le donnerai en possession. Je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que j’ai levé ma main pour le donner » ; lever la main était un geste de serment.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: Je vous ferai entrer
  rationale: Le hiphil de בוא exprime ici l’action de faire entrer le peuple dans le pays; cette tournure française conserve clairement la valeur causative.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte de promesse faite aux patriarches, אֶרֶץ désigne le territoire promis, et non la terre entière.
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: que j’ai juré
  rationale: L’expression littérale «lever la main» est un idiome de serment. «Jurer» en communique naturellement le sens en français moderne, tandis que l’image hébraïque est signalée en note.
- source_word: לָתֵת אֹתָהּ
  choice: de donner
  rationale: נתן signifie directement «donner» dans cette construction.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: à Abraham, à Isaac et à Jacob
  rationale: La répétition hébraïque de la préposition peut être rendue naturellement une seule fois dans une énumération française sans perte de sens.
- source_word: וְנָתַתִּי אֹתָהּ לָכֶם
  choice: Je vous le donnerai
  rationale: Cette formulation directe garde la force de la promesse et rend correctement le pronom féminin hébreu par le masculin français exigé par «pays».
- source_word: מוֹרָשָׁה
  choice: en possession
  rationale: מוֹרָשָׁה désigne un bien accordé durablement, susceptible d’être transmis. «En possession» préserve ici l’accent sur l’octroi du pays sans imposer l’idée d’une succession humaine.
- source_word: אֲנִי יְהוָה
  choice: Je suis Yahweh
  rationale: La proposition nominale constitue une déclaration solennelle d’identité; le nom divin est translittéré «Yahweh».
theological_decisions:
- issue: Expression de serment נָשָׂאתִי אֶת יָדִי
  choice: que j’ai juré
  alternative: pour lequel j’ai levé la main afin de le donner
  rationale: Le sens idiomatique est rendu dans le texte pour être immédiatement intelligible, sans effacer l’image concrète de l’hébreu, conservée dans la note.
- issue: Nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération représente le nom propre divin présent dans le texte et maintient la solennité de l’auto-identification finale.
- issue: Portée de מוֹרָשָׁה
  choice: en possession
  alternative: en héritage
  rationale: Le terme peut évoquer une possession héréditaire, mais le contexte met d’abord en avant le don durable du pays à Israël; «possession» évite de préciser excessivement le mode de transmission.
translation_notes:
  register: Français international moderne, naturel et digne. La première phrase est scindée avant la seconde promesse pour alléger la syntaxe sans modifier son enchaînement. «Faire entrer» conserve la valeur causative de l’hébreu; «Yahweh» rend explicitement le nom divin.
