  variant: modern international French
source:
  edition: WLC
  text: בֹּ֣א דַבֵּ֔ר אֶל פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם וִֽ/ישַׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/011.yaml
  text: Go[a], speak to Pharaoh king of Egypt, that he may let the sons of Israel go out from his land.
translation:
  language: fr
  text: Va parler à Pharaon, roi d’Égypte, pour qu’il laisse partir les fils d’Israël[a] de son pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites » ou « les enfants d’Israël ». L’hébreu dit littéralement « les fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּא
  choice: Va
  rationale: L’impératif de בוא peut signifier « viens » ou « va » selon le point de vue. Dans ce contexte, Dieu envoie Moïse auprès de Pharaon ; « Va » est donc l’expression française naturelle.
- source_word: דַבֵּר אֶל
  choice: parler à
  rationale: Le piel impératif de דבר, suivi de אֶל, désigne ici la parole adressée à Pharaon. « Parler à » conserve directement cette construction sans préciser davantage le contenu.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: Pharaon, roi d’Égypte
  rationale: Cette apposition rend clairement et naturellement en français le titre et le domaine de Pharaon.
- source_word: וִישַׁלַּח
  choice: pour qu’il laisse partir
  rationale: Après les impératifs, cette forme verbale exprime ici le but ou le résultat attendu de la parole adressée à Pharaon. « Laisse partir » rend la libération demandée sans en faire une simple prédiction.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La formulation conserve l’expression familiale littérale de l’hébreu. Une note signale l’équivalent ethnique naturel « les Israélites » et l’autre traduction traditionnelle possible.
- source_word: מֵאַרְצוֹ
  choice: de son pays
  rationale: אֶרֶץ désigne ici le territoire placé sous l’autorité de Pharaon. « De son pays » est idiomatique après « laisser partir » et conserve le pronom masculin du texte.
theological_decisions:
- issue: Portée de וִישַׁלַּח après les impératifs
  choice: pour qu’il laisse partir
  alternative: et qu’il renvoie
  rationale: La syntaxe peut être décrite comme exprimant le but, le résultat attendu ou le contenu implicite du message. La traduction retenue rend la visée de l’ordre sans transformer la proposition en prédiction certaine.
- issue: Désignation בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: La traduction principale préserve l’image généalogique et la forme explicitement masculine de l’hébreu, tandis que la note donne l’équivalent collectif courant sans imposer une différence doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. « Va parler » est idiomatique, tandis que « les fils d’Israël » maintient la formulation biblique de la source ; la note apporte les équivalents plus courants.
