id: EXO.6.27
reference: Exodus 6:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֵ֗ם הַֽ/מְדַבְּרִים֙ אֶל פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם לְ/הוֹצִ֥יא אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מִ/מִּצְרָ֑יִם ה֥וּא מֹשֶׁ֖ה וְ/אַהֲרֹֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/027.yaml
  text: These are the ones who spoke to Pharaoh king of Egypt to bring the sons of Israel out of Egypt—this is Moses and Aaron[a][b].
translation:
  language: fr
  text: Ce sont eux qui parlèrent[a] à Pharaon, roi d’Égypte, pour faire sortir d’Égypte les fils d’Israël[b] — ce sont Moïse et Aaron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « qui parlaient » ou « qui étaient ceux qui parlaient ». L’hébreu emploie un participe qui les caractérise par cette action, sans préciser à lui seul le temps verbal.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « les Israélites ». L’hébreu dit littéralement « les fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם
  choice: Ce sont eux
  rationale: 'Le pronom indépendant a ici une valeur emphatique et récapitulative : il désigne les personnes nommées juste avant.'
- source_word: הַמְדַבְּרִים
  choice: qui parlèrent
  rationale: Le participe substantivé caractérise Moïse et Aaron par leur action auprès de Pharaon. Le passé simple convient au registre narratif français, tandis qu’une note signale la nuance participiale.
- source_word: אֶל
  choice: à
  rationale: Avec le verbe « parler », la préposition indique naturellement le destinataire.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: Pharaon, roi d’Égypte
  rationale: La ponctuation française marque clairement l’apposition tout en conservant le titre royal au plus près de l’hébreu.
- source_word: לְהוֹצִיא
  choice: pour faire sortir
  rationale: L’infinitif hiphil de יצא exprime la causation. « Faire sortir » en conserve précisément la valeur.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation transparente conserve l’expression hébraïque au lieu de la remplacer silencieusement par l’ethnonyme « les Israélites ».
- source_word: מִמִּצְרָיִם
  choice: d’Égypte
  rationale: Après « faire sortir », « d’Égypte » rend naturellement le point de départ exprimé par la préposition hébraïque.
- source_word: הוּא
  choice: ce sont
  rationale: Bien que le texte hébreu emploie formellement un pronom singulier devant les deux noms, le français moderne exige normalement le pluriel dans cette phrase d’identification.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Moïse et Aaron
  rationale: Formes françaises usuelles des deux noms propres bibliques.
theological_decisions: []
