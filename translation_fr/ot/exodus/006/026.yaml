  text: ה֥וּא אַהֲרֹ֖ן וּ/מֹשֶׁ֑ה אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ לָ/הֶ֔ם הוֹצִ֜יאוּ אֶת בְּנֵ֧י יִשְׂרָאֵ֛ל מֵ/אֶ֥רֶץ מִצְרַ֖יִם עַל צִבְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/026.yaml
  text: It was Aaron and Moses to whom Yahweh said[c][b][a], “Bring the sons of Israel out from the land of Egypt by their hosts.”
translation:
  language: fr
  text: 'Ce sont Aaron et Moïse à qui Yahweh a dit : « Faites sortir les fils d’Israël du pays d’Égypte selon leurs formations[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon leurs groupes organisés » ou « selon leurs armées ». Le terme hébreu peut désigner des groupes organisés, notamment de type militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא אַהֲרֹן וּמֹשֶׁה
  choice: Ce sont cet Aaron et ce Moïse
  rationale: La formule hébraïque identifie avec insistance les deux hommes précédemment nommés. Le démonstratif français « cet… ce… » restitue naturellement cette valeur d’identification, tandis que le pluriel « ce sont » s’accorde avec les deux référents.
- source_word: אֲשֶׁר אָמַר יְהוָה לָהֶם
  choice: à qui Yahweh avait dit
  rationale: Le relatif et לָהֶם sont rendus par « à qui ». Le plus-que-parfait situe naturellement cette parole avant l’identification narrative du verset, sans changer son contenu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: הוֹצִיאוּ
  choice: Faites sortir
  rationale: 'L’impératif hiphil exprime la causation : Aaron et Moïse doivent faire sortir le peuple.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression familiale et la forme masculine du texte hébreu. Dans cet ethnonyme collectif, elle désigne le peuple d’Israël.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: du pays d’Égypte
  rationale: « Du pays d’Égypte » exprime de façon idiomatique en français le mouvement hors du territoire explicitement mentionné.
- source_word: עַל צִבְאֹתָם
  choice: selon leurs groupes organisés
  rationale: צְבָאוֹת peut désigner des armées, des corps ou des ensembles structurés. Ici, la formulation conserve l’idée d’une sortie par formations sans imposer exclusivement une lecture militaire.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom propre divin. « Yahweh » le représente directement, sans remplacer celui-ci par un titre traditionnel.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / les enfants d’Israël
  rationale: Le choix maintient la métaphore généalogique et la forme du syntagme hébreu, tout en laissant entendre son emploi collectif pour le peuple.
- issue: Nuance de עַל צִבְאֹתָם
  choice: selon leurs groupes organisés
  alternative: selon leurs armées / par leurs formations
  rationale: Le terme comporte une nuance potentiellement militaire, mais peut plus largement évoquer des groupes ordonnés. La traduction évite de trancher davantage que le contexte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’identification emphatique d’Aaron et de Moïse ainsi que l’ambiguïté entre organisation collective et coloration militaire.
