  text: 'Et les fils d’Ouzziel : Mishaël, Eltsaphân et Sitri.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Et les fils de
  rationale: Le ו initial maintient la continuité de la généalogie, tandis que בְנֵי est rendu par la formule généalogique naturelle et précise « les fils de ».
- source_word: עֻזִּיאֵל
  choice: Ouzziel
  rationale: Transcription française usuelle du nom propre, avec « Ou » pour le son initial et « zz » pour refléter la consonne redoublée.
- source_word: מִישָׁאֵל
  choice: Mishaël
  rationale: Transcription française claire du nom hébreu; le tréma indique que les voyelles a et ë appartiennent à des syllabes distinctes.
- source_word: וְאֶלְצָפָן
  choice: Eltsaphân
  rationale: Le nom est transcrit selon les conventions françaises, « ts » représentant צ et l’accent circonflexe signalant la voyelle longue finale; la conjonction est rendue naturellement dans l’énumération finale.
- source_word: וְסִתְרִי
  choice: et Sitri
  rationale: Transcription directe du nom hébreu, avec « s » pour ס; « et » marque naturellement le dernier élément de la liste.
