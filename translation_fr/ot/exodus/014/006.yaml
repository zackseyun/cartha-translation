  text: So he harnessed his chariot and took his people with him[a][b].
translation:
  language: fr
  text: Il attela donc son char et prit son peuple avec lui[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prépara son char » ; le verbe hébreu signifie littéralement « lier » ou « attacher » et désigne ici la mise en place de l’attelage.
    reason: lexical_alternative
  - marker: b
    text: « Son peuple » désigne vraisemblablement la troupe qui accompagnait le pharaon ; l’hébreu dit « son peuple », et non explicitement « son armée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר
  choice: attela
  rationale: Le verbe אסר signifie littéralement « lier, attacher » ; dans le contexte d’un char, « atteler » exprime naturellement l’action de fixer l’attelage en vue du départ.
- source_word: רִכְבּוֹ
  choice: son char
  rationale: Le nom singulier muni du suffixe renvoie ici le plus naturellement au char personnel du pharaon, plutôt qu’à l’ensemble de ses chars.
- source_word: עַמּוֹ
  choice: son peuple
  rationale: עַם signifie normalement « peuple ». Dans ce contexte militaire, il désigne vraisemblablement les hommes qui accompagnent le pharaon, mais le texte hébreu ne dit pas explicitement « armée ».
- source_word: לָקַח עִמּוֹ
  choice: prit … avec lui
  rationale: Cette tournure rend directement et naturellement la combinaison verbale et prépositionnelle hébraïque.
