  text: וַ/יְחַזֵּ֣ק יְהֹוָ֗ה אֶת לֵ֤ב פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם וַ/יִּרְדֹּ֕ף אַחֲרֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/בְנֵ֣י יִשְׂרָאֵ֔ל יֹצְאִ֖ים בְּ/יָ֥ד רָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/008.yaml
  text: And Yahweh hardened the heart of Pharaoh king of Egypt[a], and he pursued the sons of Israel[b], while the sons of Israel were going out with a high hand.
translation:
  language: fr
  text: Le SEIGNEUR endurcit[a] le cœur du pharaon, roi d’Égypte, et celui-ci poursuivit les fils d’Israël, tandis que les fils d’Israël sortaient à main levée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « affermit le cœur du pharaon ». Le verbe hébreu signifie littéralement « rendre fort ou ferme »; dans ce motif récurrent de l’Exode, il prend couramment le sens d’« endurcir ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « d’une main haute » ou « élevée ». L’expression peut signifier « avec assurance », « hardiment » ou « avec défi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme selon la convention française courante, avec les petites capitales représentées ici par des capitales.
- source_word: וַיְחַזֵּק
  choice: endurcit
  rationale: Dans la formule récurrente de l’Exode appliquée au cœur du pharaon, חזק exprime l’affermissement qui le rend inflexible; « endurcit » communique naturellement ce sens, tout en signalant en note le sens lexical « affermit ».
- source_word: לֵב
  choice: cœur
  rationale: Conserve l’image hébraïque du siège de la volonté et des dispositions intérieures, transparente en français.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: le pharaon, roi d’Égypte
  rationale: Formulation française naturelle qui restitue précisément le titre et l’apposition hébraïques.
- source_word: וַיִּרְדֹּף אַחֲרֵי
  choice: celui-ci poursuivit
  rationale: « Poursuivit » garde le sens militaire hostile; « celui-ci » identifie clairement le pharaon comme sujet après l’action du SEIGNEUR.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Reproduit l’expression hébraïque et sa répétition rhétorique dans le verset, sans la remplacer par « Israélites ».
- source_word: יֹצְאִים
  choice: sortaient
  rationale: L’imparfait rend la valeur durative du participe hébreu et l’action en cours au moment de la poursuite.
- source_word: בְּיָד רָמָה
  choice: la main haute
  rationale: Conserve l’image concrète de l’idiome hébreu dans une expression française compréhensible, dont la portée d’assurance et de défi est explicitée en note.
theological_decisions:
- issue: Action divine dans l’endurcissement du pharaon
  choice: Le SEIGNEUR endurcit le cœur du pharaon
  alternative: Le SEIGNEUR affermit le cœur du pharaon
  rationale: Le texte attribue directement l’action au SEIGNEUR; la traduction maintient cette tension théologique sans l’atténuer. La possibilité lexicale « affermit » est conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe distingue clairement l’action du SEIGNEUR de celle du pharaon. La répétition de « fils d’Israël » et l’image de « la main haute » sont maintenues pour préserver la forme et la force du texte hébreu.
