    rationale: La formule française est opaque et ne transmet pas suffisamment l’idée contextuelle de rejet ou de projection que porte l’image de « secouer hors de ». Un verbe français idiomatique doit exprimer l’action tout en signalant l’image littérale en note.
  - severity: low
    issue: Ancrage de la note b
    rationale: La note explique le verbe וַיְנַעֵר ; son appel doit être placé après le verbe français qui le traduit, non après le complément locatif.
