base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/027.yaml
  text: So Moses stretched out his hand over the sea[a], and toward morning the sea returned to its usual place, while the Egyptians were fleeing toward it[b]. And Yahweh threw the Egyptians into the midst of the sea.
translation:
  language: fr
  text: Moïse étendit la main sur la mer. À l’approche du matin, la mer revint à son état habituel[a], tandis que les Égyptiens fuyaient vers elle. Alors Yahweh projeta[b] les Égyptiens au milieu de la mer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « retrouva toute sa force » ou « revint à sa condition antérieure ». L’expression hébraïque évoque le retour de la mer à son état stable et durable.
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu signifie littéralement « secouer » ou « secouer hors de ». Dans ce contexte, il évoque vivement l’action de rejeter ou de projeter les Égyptiens dans la mer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: étendit
  rationale: Avec « la main », le verbe נטה désigne couramment le geste d’étendre la main. Cette formulation est naturelle et conserve l’action physique.
- source_word: וַיָּשָׁב הַיָּם
  choice: la mer revint
  rationale: שׁוב exprime ici le retour de la mer à sa condition antérieure après la séparation des eaux.
- source_word: לִפְנוֹת בֹּקֶר
  choice: À l’approche du matin
  rationale: L’expression indique le moment où le matin arrive ou commence à poindre, sans imposer une heure plus précise.
- source_word: לְאֵיתָנוֹ
  choice: à son état habituel
  rationale: אֵיתָן évoque ici la condition stable, durable ou vigoureuse de la mer. « État habituel » rend le rétablissement de sa condition normale tout en laissant en note les nuances de force et de permanence.
- source_word: נָסִים לִקְרָאתוֹ
  choice: fuyaient à sa rencontre
  rationale: 'Le participe marque une action en cours, et לִקְרָאתוֹ signifie littéralement « à sa rencontre ». Cette traduction conserve la tension frappante du texte : en fuyant, les Égyptiens vont vers la mer qui revient.'
- source_word: וַיְנַעֵר
  choice: secoua
  rationale: נער signifie littéralement secouer, faire tomber en secouant ou rejeter. Le choix conserve l’image vive de l’hébreu plutôt que de l’aplanir en « précipita ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom divin personnel plutôt que remplacé par un titre.
- source_word: בְּתוֹךְ הַיָּם
  choice: au milieu de la mer
  rationale: בְּתוֹךְ indique l’intérieur ou le milieu. La préposition hébraïque est locative; « au milieu » évite d’ajouter explicitement un mouvement que la construction ne marque pas à elle seule.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le nom divin. « Yahweh » préserve sa fonction de nom personnel sans lui substituer un titre.
- issue: Image de l’action divine exprimée par וַיְנַעֵר
  choice: secoua les Égyptiens au milieu de la mer
  alternative: précipita les Égyptiens au milieu de la mer
  rationale: Le rendu retenu conserve la métaphore concrète et inhabituelle de l’hébreu, sans préciser davantage le mécanisme de leur chute ou de leur destruction.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit; l’imparfait rend l’action simultanée et continue des Égyptiens. La formulation conserve les images et ambiguïtés de l’hébreu tout en restant compréhensible.
