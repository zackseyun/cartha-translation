  rationale: La révision supprime une inférence non exprimée, emploie une formulation plus naturelle pour la direction paradoxale de la fuite et rend l’action de וַיְנַעֵר par « projeta », qui est clair en français tout en conservant l’image littérale dans la note. Les notes sont complètes et leur ancrage est corrigé.
