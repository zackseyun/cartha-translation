  text: וַ/יִּקַּ֗ח שֵׁשׁ מֵא֥וֹת רֶ֨כֶב֙ בָּח֔וּר וְ/כֹ֖ל רֶ֣כֶב מִצְרָ֑יִם וְ/שָׁלִשִׁ֖ם עַל כֻּלּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/007.yaml
  text: And he took six hundred choice chariots[a], and all the chariots of Egypt, with officers over all of them.
translation:
  language: fr
  text: Il prit six cents chars d’élite et tous les chars d’Égypte, avec des officiers à leur tête.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec des officiers de chars à leur tête » ; le terme hébreu peut désigner des aides militaires d’élite ou des commandants associés aux chars.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Il prit
  rationale: Le wayyiqtol de לקח fait progresser le récit. Le passé simple convient au registre narratif français et le sujet masculin est fourni par le contexte immédiat.
- source_word: שֵׁשׁ מֵאוֹת
  choice: six cents
  rationale: Rendu direct du nombre cardinal; « cents » prend ici la marque du pluriel puisqu’il est multiplié et n’est suivi d’aucun autre nombre.
- source_word: רֶכֶב
  choice: chars
  rationale: Dans ce contexte militaire, le nom collectif désigne des chars de guerre; avec le nombre six cents, le pluriel dénombrable est naturel en français.
- source_word: בָּחוּר
  choice: d’élite
  rationale: Le terme désigne ce qui a été choisi ou sélectionné. « D’élite » exprime naturellement la qualité militaire de ces chars sans suggérer qu’ils seraient simplement disponibles.
- source_word: וְכֹל רֶכֶב מִצְרָיִם
  choice: et tous les chars d’Égypte
  rationale: La construction désigne l’ensemble des chars égyptiens, ajouté aux six cents chars sélectionnés.
- source_word: וְשָׁלִשִׁם
  choice: avec des officiers
  rationale: שָׁלִשִׁים est un terme militaire dont le rôle précis reste discuté; « officiers » communique la fonction générale sans imposer la traduction littérale incertaine « troisièmes hommes ».
- source_word: עַל כֻּלּוֹ
  choice: à la tête de chacun d’eux
  rationale: La forme singulière collective se rapporte à toute la force de chars. Cette formulation française rend naturellement l’idée d’officiers affectés à l’ensemble des chars, tout en conservant la nuance d’autorité portée par עַל.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Chars » est clair dans le contexte militaire; « chars de guerre » n’est pas répété afin de garder une formulation concise. La note conserve l’incertitude sur la fonction exacte des שָׁלִשִׁים.
