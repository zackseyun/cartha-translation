source:
  edition: WLC
  text: וַ/יָּשֻׁ֣בוּ הַ/מַּ֗יִם וַ/יְכַסּ֤וּ אֶת הָ/רֶ֨כֶב֙ וְ/אֶת הַ/פָּ֣רָשִׁ֔ים לְ/כֹל֙ חֵ֣יל פַּרְעֹ֔ה הַ/בָּאִ֥ים אַחֲרֵי/הֶ֖ם בַּ/יָּ֑ם לֹֽא נִשְׁאַ֥ר בָּ/הֶ֖ם עַד אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/028.yaml
  text: And the waters returned and covered the chariots and the horsemen[a], all the army of Pharaoh that had gone after them into the sea; not one of them remained.
translation:
  language: fr
  text: Les eaux revinrent et recouvrirent les chars et les cavaliers[a], toute l’armée du pharaon qui était entrée dans la mer à leur poursuite ; il n’en resta pas un seul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la cavalerie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ הַמַּיִם
  choice: Les eaux revinrent
  rationale: Le verbe שׁוב décrit ici le retour des eaux après leur séparation. Le pluriel « les eaux » conserve l’image concrète et solennelle de l’hébreu.
- source_word: וַיְכַסּוּ
  choice: recouvrirent
  rationale: כסּה signifie directement « couvrir ». « Recouvrirent » exprime naturellement en français le mouvement des eaux qui reviennent sur les troupes, sans expliciter davantage l’issue.
- source_word: הָרֶכֶב
  choice: les chars
  rationale: רֶכֶב peut désigner collectivement les chars ou les unités de chars. « Les chars » est clair, idiomatique et fidèle au contexte militaire.
- source_word: הַפָּרָשִׁים
  choice: les cavaliers
  rationale: פָּרָשִׁים désigne des combattants montés. « Cavaliers » est le terme français courant et direct ; « la cavalerie » demeure une possibilité collective.
- source_word: לְכֹל חֵיל פַּרְעֹה
  choice: toute l’armée du pharaon
  rationale: חֵיל a ici le sens de force militaire ou d’armée, et לְכֹל souligne la totalité du groupe ensuite défini.
- source_word: הַבָּאִים אַחֲרֵיהֶם בַּיָּם
  choice: qui était entrée dans la mer à leur poursuite
  rationale: Le participe est rendu par une relative adaptée à la séquence narrative. « Entrée dans la mer » conserve l’idée de mouvement vers l’intérieur, tandis que « à leur poursuite » rend naturellement אַחֲרֵיהֶם.
- source_word: לֹא נִשְׁאַר בָּהֶם עַד אֶחָד
  choice: il n’en resta pas un seul
  rationale: Cette formulation française concise conserve l’insistance de l’idiome hébreu sur l’absence totale de survivants au sein du groupe désigné.
theological_decisions:
- issue: Étendue de la destruction des forces du pharaon
  choice: L’absence de survivants concerne toute l’armée du pharaon qui était entrée dans la mer à la poursuite des Israélites.
  alternative: Comprendre l’énoncé comme visant sans restriction tous les soldats égyptiens, y compris ceux qui ne sont pas entrés dans la mer.
  rationale: 'La relative hébraïque délimite le groupe concerné : les forces entrées dans la mer à leur poursuite. La traduction garde l’affirmation totale du verset sans l’étendre au-delà de ce groupe.'
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit. La minuscule à « pharaon » traite ici le terme comme un titre commun ; la ponctuation maintient en une phrase le lien entre le groupe poursuivant et l’affirmation finale.
