  source_fidelity: 'Le texte rend avec précision la progression de l’hébreu : retour des eaux, recouvrement des chars et des cavaliers, désignation de l’ensemble de la force de Pharaon entrée dans la mer à la poursuite d’Israël, puis constat emphatique qu’il n’en resta pas un seul. « Entrée dans la mer à leur poursuite » conserve bien à la fois le mouvement d’entrée et la relation de poursuite.'
