base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/025.yaml
  text: And he removed the wheels from his chariots, and drove them with difficulty. And Egypt said, “Let me flee from before Israel, for the LORD is fighting for them against Egypt.”
translation:
  language: fr
  text: 'Il écarta les roues de ses chars[a] et les fit avancer péniblement. L’Égypte dit[b] : « Je vais fuir devant Israël, car le Seigneur combat pour eux contre l’Égypte ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte littéralement « la roue de ses chars »; le singulier peut avoir une valeur collective. Le verbe peut signifier « écarter, détourner » ou « enlever ». Certaines anciennes versions comprennent « les essieux » ou « les roues » enlevés.
    reason: Préciser le singulier du texte hébreu et préserver l’incertitude sur la nature exacte de l’avarie, sans imposer une tradition textuelle.
  - marker: b
    text: 'Littéralement : « L’Égypte dit : Que je fuie devant Israël ». « L’Égypte » personnifie collectivement son armée.'
    reason: Conserver et expliquer le singulier collectif ainsi que la forme exhortative de la première personne.
lexical_decisions:
- source_word: וַיָּסַר
  choice: Il fit dévier
  rationale: Le verbe סור au causatif signifie faire s’écarter ou faire dévier. Cette traduction conserve l’idée d’un dérèglement des roues sans imposer la variante « enlever », attestée par certaines traditions anciennes.
- source_word: בִּכְבֵדֻת
  choice: avec difficulté
  rationale: L’expression indique lourdeur et pénibilité; dans ce contexte, elle décrit la progression difficile des chars.
- source_word: יְהוָה
  choice: le Seigneur
  rationale: Rendu français traditionnel et intelligible du tétragramme, avec une majuscule pour signaler le titre divin employé à sa place.
- source_word: אָנ֨וּסָה
  choice: Fuyons
  rationale: La forme hébraïque est morphologiquement au singulier (« que je fuie »), mais « les Égyptiens » fonctionne ici comme un collectif; le pluriel donne en français naturel la parole collective de l’armée sans changer son intention.
theological_decisions:
- issue: Sujet de נִלְחָם et bénéficiaire du combat
  choice: le Seigneur combat pour eux contre l’Égypte
  alternative: le Seigneur combat à leurs côtés contre l’Égypte
  rationale: « Pour eux » préserve le sens favorable du לָהֶם tout en maintenant l’opposition explicite בְּמִצְרָיִם, sans développer davantage la nature de l’action divine.
- issue: Nombre grammatical dans les références à l’Égypte et aux chars
  choice: Passage à des pluriels français naturels lorsque le collectif désigne les soldats égyptiens
  alternative: 'Maintenir partout le singulier grammatical : « l’Égypte dit : Que je fuie »'
  rationale: L’hébreu personnifie l’Égypte au singulier, mais le français courant exprime plus naturellement la réaction des combattants au pluriel; une note conserve l’information formelle.
translation_notes:
  register: Français international moderne, narratif et digne. « Fit dévier » reste compréhensible tout en respectant davantage le texte massorétique que « enleva ». Le discours direct est rendu au pluriel naturel, et les notes documentent les singularités collectives de l’hébreu.
