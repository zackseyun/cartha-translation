  variant: modern international French
source:
  edition: WLC
  text: וּ/בְנֵ֧י יִשְׂרָאֵ֛ל הָלְכ֥וּ בַ/יַּבָּשָׁ֖ה בְּ/ת֣וֹךְ הַ/יָּ֑ם וְ/הַ/מַּ֤יִם לָ/הֶם֙ חֹמָ֔ה מִֽ/ימִינָ֖/ם וּ/מִ/שְּׂמֹאלָֽ/ם
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/029.yaml
  text: But the sons of Israel walked on dry ground through the midst of the sea[b][a], and the waters were a wall to them on their right and on their left.
translation:
  language: fr
  text: Mais les Israélites[a] marchèrent sur la terre ferme au milieu de la mer, et les eaux étaient pour eux une muraille[b], à leur droite et à leur gauche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit directement que les eaux étaient « une muraille » pour eux; certains comprennent : « comme une muraille ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Mais les Israélites
  rationale: La conjonction marque ici le contraste avec la destruction des Égyptiens évoquée au verset précédent. « Les Israélites » rend naturellement en français moderne l’expression nationale littéralement formulée « les fils d’Israël ».
- source_word: הָלְכוּ
  choice: marchèrent
  rationale: Le verbe הלך signifie aller ou marcher. « Marchèrent » conserve l’image d’un déplacement à pied et convient au récit.
- source_word: בַיַּבָּשָׁה
  choice: sur la terre ferme
  rationale: Le nom יַבָּשָׁה désigne le sol ou la terre asséchée. Cette formulation française souligne clairement que le fond de la mer était sec.
- source_word: בְּתוֹךְ הַיָּם
  choice: au milieu de la mer
  rationale: La locution בְּתוֹךְ exprime une position au sein de quelque chose; le mouvement est déjà porté par « marchèrent ».
- source_word: וְהַמַּיִם
  choice: et les eaux
  rationale: Le pluriel français conserve la forme et l’image saisissante du pluriel hébreu מַיִם.
- source_word: לָהֶם חֹמָה
  choice: étaient pour eux une muraille
  rationale: Cette formulation suit directement la construction hébraïque et conserve l’identification forte des eaux à une muraille, sans introduire de comparaison absente du texte.
- source_word: מִימִינָם וּמִשְּׂמֹאלָם
  choice: à leur droite et à leur gauche
  rationale: La tournure est naturelle en français moderne et préserve le parallélisme spatial de l’hébreu.
theological_decisions:
- issue: Rendu de בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël
  rationale: L’expression hébraïque est littéralement filiale, mais elle sert ici de désignation nationale collective. « Les Israélites » communique ce sens sans laisser entendre que seuls les hommes ont traversé; la forme littérale est conservée en note.
- issue: Valeur de חֹמָה
  choice: une muraille
  alternative: comme une muraille
  rationale: L’hébreu ne comporte aucun marqueur explicite de comparaison. Le texte principal garde donc la formulation directe et forte, tandis que l’interprétation comparative est signalée en note.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique littéraire sans être archaïque. « Muraille » restitue mieux que « mur » l’ampleur de l’image tout en restant courant.
