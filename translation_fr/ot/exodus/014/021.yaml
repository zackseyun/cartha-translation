base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/021.yaml
  text: Then Moses stretched out his hand over the sea[a], and Yahweh drove the sea back by a strong east wind all night and made the sea dry land[d][c][b], and the waters were split.
translation:
  language: fr
  text: Alors Moïse étendit sa main sur la mer, et Yahweh fit reculer la mer[a] par un fort vent d’est[b] durant toute la nuit. Il transforma la mer en terre sèche[c], et les eaux furent fendues[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « fit aller la mer » ; dans ce contexte, le verbe causatif peut exprimer l’idée de la faire reculer.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « par un puissant vent d’est ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « fit de la mer une terre sèche » ou « transforma la mer en sol sec ».'
    reason: lexical_alternative
  - marker: d
    text: 'Ou : « les eaux furent divisées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: étendit
  rationale: Avec « la main », le verbe נטה désigne naturellement le geste d’étendre la main. Ce choix est précis, courant et conserve l’action physique.
- source_word: יָדוֹ
  choice: la main
  rationale: Le singulier et la relation possessive sont conservés naturellement en français par « la main », le possesseur étant déjà exprimé par le sujet Moïse.
- source_word: עַל הַיָּם
  choice: sur la mer
  rationale: עַל peut signifier « sur », « au-dessus de » ou « vers ». Avec le geste de la main, « sur la mer » est naturel et garde l’orientation spatiale sans la préciser excessivement.
- source_word: וַיּוֹלֶךְ יְהוָה אֶת הַיָּם
  choice: Yahweh fit reculer la mer
  rationale: La forme causative de הלך signifie littéralement que Yahweh fit aller la mer. Dans ce contexte, « fit reculer » exprime clairement le mouvement qui ouvre un passage, tout en signalant en note l’alternative plus littérale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre, conformément à sa fonction dans le texte hébreu, plutôt que remplacé par un titre.
- source_word: בְּרוּחַ קָדִים עַזָּה
  choice: par un fort vent d’est
  rationale: רוּחַ désigne ici un vent, puisqu’il est qualifié par « d’est » et présenté comme le moyen de l’action. « Fort » rend עַזָּה de façon directe et idiomatique.
- source_word: כָּל הַלַּיְלָה
  choice: durant toute la nuit
  rationale: Cette formulation conserve explicitement la totalité de la durée indiquée par l’hébreu.
- source_word: וַיָּשֶׂם אֶת הַיָּם לֶחָרָבָה
  choice: Il transforma la mer en terre sèche
  rationale: חָרָבָה désigne une terre ou un sol sec. « Transforma… en » rend naturellement la construction résultative sans effacer le mot « mer ».
- source_word: וַיִּבָּקְעוּ הַמָּיִם
  choice: les eaux se fendirent
  rationale: La forme de בקע décrit les eaux qui sont fendues ou séparées. Le pronominal français conserve la vivacité de l’image sans préciser un agent que cette proposition n’exprime pas.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: L’hébreu emploie ici directement le tétragramme. « Yahweh » préserve le nom personnel dans le corps du texte, tandis que « le SEIGNEUR » lui substituerait un titre.
- issue: Rapport entre l’action divine et le vent
  choice: Yahweh fait reculer la mer par le vent
  alternative: Yahweh fait aller la mer avec le vent
  rationale: La préposition בְּ présente naturellement le vent comme le moyen de l’action divine. La traduction conserve à la fois l’action personnelle de Yahweh et le moyen créé mentionné par le texte, sans les opposer.
translation_notes:
  register: Français international moderne, sobre et narratif. Le passé simple convient au registre biblique écrit sans être archaïque. La syntaxe reste proche de la progression hébraïque, avec une coupure en deux phrases pour assurer une lecture naturelle. Les termes concrets « mer », « vent », « terre sèche » et « eaux » sont maintenus.
