  source_fidelity: La formulation « contre les Égyptiens » restreint et interprète le complément hébreu בְּמִצְרַיִם, qui désigne l’Égypte et se rend plus sobrement par « en Égypte » (ou, contextuellement, « contre l’Égypte »). « Grande puissance » est compréhensible, mais efface de la ligne principale l’image récurrente de la « main »; celle-ci peut être conservée sans nuire au français biblique moderne.
  naturalness: La révision conserve une narration française fluide. Le pluriel « ils eurent foi » reflète explicitement le pluriel hébreu après le collectif « le peuple » et évite de faire dépendre toute la seconde proposition d’un singulier grammatical.
  terminology: « Yahweh », « Israël », « Moïse » et « craignit » conviennent. « Eurent foi en » rend naturellement le hifil de אמן avec בְ sans introduire de formulation confessionnelle plus marquée.
