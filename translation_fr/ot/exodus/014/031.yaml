  text: וַ/יַּ֨רְא יִשְׂרָאֵ֜ל אֶת הַ/יָּ֣ד הַ/גְּדֹלָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ בְּ/מִצְרַ֔יִם וַ/יִּֽירְא֥וּ הָ/עָ֖ם אֶת יְהוָ֑ה וַ/יַּֽאֲמִ֨ינוּ֙ בַּֽ/יהוָ֔ה וּ/בְ/מֹשֶׁ֖ה עַבְדּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/031.yaml
  text: Israel saw the great hand that Yahweh had done against Egypt[a], and the people feared Yahweh[b], and they believed in Yahweh and in Moses his servant.
translation:
  language: fr
  text: Israël vit la grande main que Yahweh avait manifestée en Égypte[a]. Le peuple craignit Yahweh, et ils eurent foi en Yahweh et en Moïse, son serviteur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la grande puissance ». Littéralement « la grande main »; la main est ici une image de la puissance en action. Le texte peut aussi se comprendre, selon le contexte, comme une action exercée contre l’Égypte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: vit
  rationale: Le verbe ראה exprime ici la perception directe des événements qui viennent de se produire; « vit » conserve simplement la forme narrative.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le singulier collectif hébreu désigne le peuple dans son ensemble et se distingue naturellement de « le peuple » dans la proposition suivante.
- source_word: הַיָּד הַגְּדֹלָה
  choice: la grande puissance
  rationale: Littéralement « la grande main ». En français courant, « la grande puissance » restitue naturellement la valeur métaphorique de la main comme manifestation de puissance, tandis que la note conserve l’image hébraïque.
- source_word: אֲשֶׁר עָשָׂה יְהוָה בְּמִצְרַיִם
  choice: que Yahweh avait déployée contre les Égyptiens
  rationale: Avec « puissance » comme antécédent, « déployée » rend idiomatiquement עשה sans produire l’expression peu naturelle « faire une puissance ». Dans ce contexte de jugement à la mer, בְּמִצְרַיִם vise l’Égypte comme adversaire; « les Égyptiens » désigne ici le peuple poursuivant Israël.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: וַיִּירְאוּ
  choice: craignit
  rationale: ירא signifie fondamentalement « craindre » et peut inclure ici la révérence et la crainte respectueuse; la traduction maintient cette amplitude.
- source_word: וַיַּאֲמִינוּ בַּיהוָה
  choice: mit sa foi en Yahweh
  rationale: Le hifil de אמן suivi de בְ exprime la confiance ou la foi placée en quelqu’un. Le singulier s’accorde avec le collectif « le peuple » en français.
- source_word: וּבְמֹשֶׁה עַבְדּוֹ
  choice: ainsi qu’en Moïse, son serviteur
  rationale: La préposition בְ coordonnée place Moïse comme second objet de la confiance, tandis que « son serviteur » marque clairement son statut subordonné au service de Yahweh.
theological_decisions:
- issue: Nature de la réponse d’Israël envers Moïse
  choice: Le peuple met sa foi en Yahweh ainsi qu’en Moïse, serviteur de Yahweh et agent autorisé.
  alternative: Le peuple croit Yahweh et croit personnellement Moïse.
  rationale: La même construction אמן + בְ régit Yahweh et Moïse. La traduction conserve ce parallélisme sans suggérer une égalité, car l’apposition « son serviteur » précise la subordination de Moïse.
- issue: Portée de la crainte de Yahweh
  choice: « craignit » conserve à la fois la peur, l’émerveillement et la révérence possibles.
  alternative: « éprouva une crainte respectueuse » expliciterait uniquement la dimension révérencielle.
  rationale: Le contexte associe délivrance et jugement; il vaut mieux ne pas réduire la tension sémantique de ירא à la seule révérence.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase est scindée après la première proposition pour éviter une accumulation de coordinations. « Grande puissance » privilégie l’intelligibilité immédiate, avec l’image littérale de la main conservée en note. Le nom Yahweh est maintenu. Le collectif « le peuple » commande ici des verbes au singulier, conformément à l’usage français.
