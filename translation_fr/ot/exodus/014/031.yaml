    rationale: Le référent hébreu est « l’Égypte », non explicitement « les Égyptiens ». Le contexte permet une nuance hostile, mais le changement de référent est évitable; « en Égypte » préserve la formulation source et son ambiguïté.
  - severity: low
    issue: L’image de la « grande main » n’apparaît que dans la note.
    rationale: Bien que « grande puissance » rende le sens figuré, la main est une image importante et récurrente dans l’Exode. La conserver dans le texte est une correction sûre et reste intelligible.
  - severity: low
    issue: Le singulier « le peuple ... mit sa foi » ne reflète pas le pluriel verbal hébreu.
    rationale: Le singulier collectif est possible en français, mais le texte source passe au pluriel. « Le peuple ... et ils eurent foi » rend cette transition tout en restant naturel.
