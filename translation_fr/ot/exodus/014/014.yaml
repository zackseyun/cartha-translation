source:
  edition: WLC
  text: יְהוָ֖ה יִלָּחֵ֣ם לָ/כֶ֑ם וְ/אַתֶּ֖ם תַּחֲרִישֽׁוּ/ן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/014.yaml
  text: Yahweh will fight for you[a], and you must be silent.
translation:
  language: fr
  text: Yahweh combattra pour vous, et vous, vous garderez le silence[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « restez silencieux » ou « tenez-vous tranquilles ». La forme hébraïque peut exprimer une injonction aussi bien qu’une assurance : « vous resterez silencieux ».'
    reason: alternative lexicale et ambiguïté de modalité
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription du nom divin, plutôt que par un titre, afin de préserver le nom personnel employé dans le texte hébreu.
- source_word: יִלָּחֵם
  choice: combattra
  rationale: Le niphal inaccompli de לחם annonce ici que Yahweh prendra lui-même part au combat en faveur d’Israël. « Combattra » est naturel en français et conserve nettement le sens militaire.
- source_word: לָכֶם
  choice: pour vous
  rationale: 'La préposition ל avec le suffixe de deuxième personne du pluriel exprime ici l’avantage ou la défense : Yahweh agit en faveur des Israélites.'
- source_word: וְאַתֶּם
  choice: et vous, vous
  rationale: La coordination hébraïque est conservée par « et », tandis que la reprise du pronom en français fait ressortir le contraste entre l’action de Yahweh et l’attitude attendue du peuple.
- source_word: תַּחֲרִישׁוּן
  choice: vous garderez le silence
  rationale: Le hiphil inaccompli de חרשׁ signifie ici « garder le silence » ou « rester tranquille ». Le futur français peut porter à la fois la valeur d’une assurance et celle d’une injonction ferme, ce qui préserve l’ambiguïté de la forme hébraïque.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom divin au lieu de lui substituer un titre, sans introduire une interprétation confessionnelle particulière.
- issue: Valeur de תַּחֲרִישׁוּן
  choice: vous garderez le silence
  alternative: gardez le silence ; vous resterez silencieux
  rationale: Dans ce contexte, l’inaccompli peut se comprendre comme une injonction ou comme l’annonce de l’attitude du peuple pendant que Yahweh combat. La formulation retenue maintient cette tension plutôt que de trancher silencieusement.
translation_notes:
  register: Français international moderne, simple et digne. « Combattra » maintient l’image militaire ; « garderez le silence » reste idiomatique tout en conservant la possible double valeur, prédictive et injonctive, de l’hébreu.
