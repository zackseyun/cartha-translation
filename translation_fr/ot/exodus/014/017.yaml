  text: וַ/אֲנִ֗י הִנְ/נִ֤י מְחַזֵּק֙ אֶת לֵ֣ב מִצְרַ֔יִם וְ/יָבֹ֖אוּ אַחֲרֵי/הֶ֑ם וְ/אִכָּבְדָ֤ה בְּ/פַרְעֹה֙ וּ/בְ/כָל חֵיל֔/וֹ בְּ/רִכְבּ֖/וֹ וּ/בְ/פָרָשָֽׁי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/017.yaml
  text: And I—behold[a], I am hardening the hearts of the Egyptians so that they will go in after them, and I will get glory over Pharaoh and over all his army[b], over his chariots and over his horsemen.
translation:
  language: fr
  text: Quant à moi, je vais endurcir le cœur des Égyptiens, et ils entreront dans la mer derrière eux. Je tirerai gloire de Pharaon, de toute son armée, de ses chars et de ses cavaliers.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנִי הִנְנִי
  choice: Quant à moi, je vais
  rationale: La combinaison du pronom indépendant et de הִנְנִי souligne fortement le sujet divin. « Quant à moi » restitue cette mise en relief dans un français naturel; « je vais » rend ici l'action imminente du participe.
- source_word: מְחַזֵּק אֶת לֵב מִצְרַיִם
  choice: endurcir le cœur des Égyptiens
  rationale: Le piel de חזק exprime ici l'affermissement ou l'endurcissement de leur résolution. Le singulier collectif « le cœur » conserve la forme hébraïque tout en restant intelligible en français.
- source_word: וְיָבֹאוּ אַחֲרֵיהֶם
  choice: et ils entreront dans la mer derrière eux
  rationale: בוא désigne, dans ce contexte immédiat, l'entrée des Égyptiens dans la mer à la suite des Israélites. « Dans la mer » explicite une donnée contextuelle nécessaire à une formulation française claire sans changer l'action décrite.
- source_word: וְאִכָּבְדָה בְּפַרְעֹה
  choice: Je manifesterai ma gloire en triomphant du pharaon
  rationale: Le niphal de כבד indique que la gloire de YHWH sera manifestée dans le jugement. Avec ב, l'expression présente le pharaon comme celui aux dépens duquel cette gloire éclate; « en triomphant de » rend naturellement cette nuance en français.
- source_word: חֵילוֹ
  choice: toute son armée
  rationale: Dans ce contexte militaire, חיל désigne l'ensemble des forces armées du pharaon.
- source_word: רִכְבּוֹ וּבְפָרָשָׁיו
  choice: ses chars et ses cavaliers
  rationale: Le singulier collectif רכב désigne les chars comme corps militaire, tandis que פרשים désigne les combattants montés; les pluriels français sont naturels et précis.
theological_decisions:
- issue: Action divine dans l'endurcissement des Égyptiens
  choice: « je vais endurcir » attribue directement l'action à Dieu
  alternative: « je permettrai que leur cœur s'endurcisse » ou « je fortifierai leur cœur »
  rationale: L'hébreu présente Dieu comme agent direct. La traduction conserve la tension entre souveraineté divine et responsabilité humaine au lieu de l'atténuer.
- issue: Manifestation de la gloire divine dans le jugement
  choice: « Je manifesterai ma gloire en triomphant du pharaon »
  alternative: « Je serai glorifié par le pharaon »
  rationale: Cette formulation conserve l'idée que la gloire divine se révèle par le jugement infligé au pharaon, tout en évitant l'ambiguïté française selon laquelle le pharaon rendrait volontairement gloire à Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe met en relief l'action divine sans archaïsme. « Le pharaon » suit l'usage français courant du titre; « cœur » garde le collectif hébreu.
