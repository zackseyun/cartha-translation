- from: Quant à moi, je vais endurcir le cœur des Égyptiens, et ils entreront dans la mer derrière eux. Je manifesterai ma gloire en triomphant du pharaon et de toute son armée, de ses chars et de ses cavaliers.
  to: Quant à moi, je vais endurcir le cœur des Égyptiens, et ils entreront dans la mer derrière eux. Je tirerai gloire de Pharaon, de toute son armée, de ses chars et de ses cavaliers.
