review_pass:
  verdict: revise
  source_fidelity: La formulation de l’endurcissement et le collectif « le cœur des Égyptiens » rendent fidèlement le texte hébreu. L’entrée à la suite des Israélites est bien contextualisée par « dans la mer ». En revanche, « Je manifesterai ma gloire en triomphant » explicite et reformule trop fortement le niphal de כבד, qui exprime plus directement le fait que Dieu recevra/manifestera sa gloire aux dépens de Pharaon.
  naturalness: Le français est globalement moderne et clair. « Je tirerai gloire de » est une tournure française idiomatique, digne et plus proche de la valeur du verbe hébreu que « en triomphant de ».
  terminology: « Endurcir », « Égyptiens », « Pharaon », « armée », « chars » et « cavaliers » conviennent. La majuscule à « Pharaon » est retenue ici, puisqu’il désigne le souverain identifié par son titre dans le récit.
  issues:
  - severity: medium
    issue: « Je manifesterai ma gloire en triomphant du pharaon » interprète de manière excessive וְאִכָּבְדָה בְּפַרְעֹה.
    rationale: Le texte annonce que Dieu sera honoré ou tirera gloire de Pharaon; il ne formule pas explicitement l’action comme un triomphe. « Tirer gloire de » conserve la portée judiciaire et la relation avec Pharaon sans ajouter cette modalité.
  revised_text: Quant à moi, je vais endurcir le cœur des Égyptiens, et ils entreront dans la mer derrière eux. Je tirerai gloire de Pharaon, de toute son armée, de ses chars et de ses cavaliers.
