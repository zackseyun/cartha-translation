base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/012.yaml
  text: Is this not the word that we spoke to you in Egypt, saying, ‘Leave us alone so that we may serve the Egyptians’? For it would have been better for us to serve the Egyptians than to die in the wilderness.
translation:
  language: fr
  text: 'N’est-ce pas ce que nous te disions en Égypte : « Laisse-nous tranquilles, afin que nous servions les Égyptiens » ? Car il aurait mieux valu pour nous de servir les Égyptiens que de mourir dans le désert.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדָּבָר
  choice: ce que
  rationale: Dans la tournure « ce que nous te disions », le français naturel exprime ici la parole ou l’idée formulée, sans le calque lourd « la parole que ».
- source_word: חֲדַל מִמֶּנּוּ
  choice: Laisse-nous tranquilles
  rationale: L’expression idiomatique signifie cesser d’intervenir à leur égard, donc les laisser en paix ou tranquilles.
- source_word: וְנַעַבְדָה אֶת מִצְרָיִם
  choice: afin que nous servions les Égyptiens
  rationale: 'Le cohortatif relié par וְ exprime ici le but recherché : être laissés tranquilles pour continuer à servir les Égyptiens.'
- source_word: עֲבֹד אֶת מִצְרַיִם
  choice: servir les Égyptiens
  rationale: Le verbe עבד peut désigner le service ou l’asservissement. « Servir » conserve cette amplitude, tandis que le contexte d’Égypte fait clairement entendre la servitude.
- source_word: כִּי טוֹב לָנוּ ... מִמֻּתֵנוּ
  choice: Car il aurait mieux valu pour nous… que…
  rationale: Le comparatif hébreu oppose le service passé en Égypte à la mort désormais redoutée dans le désert ; le conditionnel passé rend naturellement ce regret contrefactuel en français.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: « Désert » est le terme français courant pour le territoire inculte ou la steppe évoqués par מִדְבָּר dans ce contexte.
theological_decisions:
- issue: Nature du service rendu à l’Égypte
  choice: servir les Égyptiens
  alternative: être esclaves des Égyptiens
  rationale: Le texte emploie le verbe général « servir ». La traduction retenue ne minimise pas l’esclavage narratif, mais évite d’expliciter dans ce verset plus que le lexème lui-même.
- issue: Valeur temporelle de « mieux »
  choice: il aurait mieux valu
  alternative: il vaut mieux
  rationale: Le conditionnel passé présente leur affirmation comme un regret portant sur la situation antérieure en Égypte face au danger présent. L’hébreu nominal reste concis, mais le contexte soutient cette formulation française sans modifier l’enjeu théologique.
translation_notes:
  register: Français international moderne, direct et digne. La question accusatrice et le discours cité sont conservés, avec une syntaxe naturelle et sans archaïsmes.
