id: EXO.14.30
reference: Exodus 14:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יּ֨וֹשַׁע יְהוָ֜ה בַּ/יּ֥וֹם הַ/ה֛וּא אֶת יִשְׂרָאֵ֖ל מִ/יַּ֣ד מִצְרָ֑יִם וַ/יַּ֤רְא יִשְׂרָאֵל֙ אֶת מִצְרַ֔יִם מֵ֖ת עַל שְׂפַ֥ת הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/030.yaml
  text: So Yahweh saved Israel that day from the hand of Egypt[b][a], and Israel saw the Egyptians dead on the seashore.
translation:
  language: fr
  text: Ainsi, ce jour-là, Yahvé sauva Israël de la main de l’Égypte[a], et Israël vit les Égyptiens morts sur le rivage de la mer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la main de l’Égypte », expression qui désigne le pouvoir ou la domination de l’Égypte.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: sauva
  rationale: Le hifil de ישׁע exprime ici l’action par laquelle Dieu arrache Israël au danger. « Sauva » est direct, naturel et conserve la portée théologique du verbe.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin יהוה et permet de le rendre comme un nom propre plutôt que de lui substituer un titre.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Cette tournure rend naturellement en français la valeur temporelle de l’expression hébraïque.
- source_word: מִיַּד מִצְרָיִם
  choice: de la main de l’Égypte
  rationale: La traduction conserve l’image hébraïque de la « main », qui désigne ici le pouvoir ou la domination de l’Égypte; une note en explicite le sens.
- source_word: מִצְרַיִם
  choice: les Égyptiens
  rationale: Dans la seconde proposition, le nom collectif « Égypte » désigne les personnes dont Israël voit les corps; « les Égyptiens » rend ce référent clairement en français.
- source_word: מֵת
  choice: morts
  rationale: L’adjectif hébreu au singulier a une valeur collective avec « Égypte ». Le pluriel français s’accorde naturellement avec « les Égyptiens » sans ajouter l’idée, non exprimée, qu’ils étaient étendus là.
- source_word: עַל שְׂפַת הַיָּם
  choice: sur le rivage de la mer
  rationale: Littéralement, l’expression évoque la « lèvre » ou le bord de la mer. « Sur le rivage de la mer » en restitue clairement le lieu dans un registre naturel et digne.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. Employer le nom propre « Yahvé » préserve cette donnée au lieu de la remplacer par un titre.
- issue: Valeur du verbe ישׁע appliqué à l’action divine
  choice: sauva
  alternative: délivra
  rationale: Les deux traductions sont possibles, mais « sauva » conserve à la fois l’idée concrète de secours face au danger et la portée théologique du salut, sans préciser davantage que l’hébreu.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La syntaxe narrative reste proche de l’hébreu, tandis que « les Égyptiens » explicite naturellement la valeur collective de « Égypte » dans la seconde proposition.
