source:
  edition: WLC
  text: וּ/פַרְעֹ֖ה הִקְרִ֑יב וַ/יִּשְׂאוּ֩ בְנֵֽי יִשְׂרָאֵ֨ל אֶת עֵינֵי/הֶ֜ם וְ/הִנֵּ֥ה מִצְרַ֣יִם נֹסֵ֣עַ אַחֲרֵי/הֶ֗ם וַ/יִּֽירְאוּ֙ מְאֹ֔ד וַ/יִּצְעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָֽה־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/010.yaml
  text: As Pharaoh drew near[a], the sons of Israel lifted up their eyes, and behold, the Egyptians were marching after them; and they were very afraid[b], and the sons of Israel cried out to Yahweh.
translation:
  language: fr
  text: Lorsque Pharaon approcha, les fils d’Israël[a] levèrent les yeux, et voici que les Égyptiens avançaient à leur suite[b]. Ils eurent très peur, et les fils d’Israël crièrent vers Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites » ; l’hébreu dit littéralement « les fils d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte littéralement « l’Égypte », nom collectif désignant ici les forces égyptiennes.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְרִיב
  choice: approchait
  rationale: 'Le hiphil de קרב a ici un sens intransitif : Pharaon s’approche. L’imparfait français présente l’action en cours et maintient la tension narrative.'
- source_word: וַיִּשְׂאוּ ... אֶת עֵינֵיהֶם
  choice: levèrent les yeux
  rationale: Cette expression naturelle conserve l’image de l’idiome hébreu tout en signifiant clairement qu’ils regardent.
- source_word: וְהִנֵּה
  choice: et voici que
  rationale: Cette tournure marque la perception soudaine et l’intensité dramatique exprimées par la particule hébraïque.
- source_word: מִצְרַיִם
  choice: les Égyptiens
  rationale: Le nom « Égypte » désigne ici collectivement la force égyptienne en marche. Le pluriel français rend naturellement ce référent humain, tandis qu’une note conserve la forme littérale.
- source_word: נֹסֵעַ אַחֲרֵיהֶם
  choice: avançaient derrière eux
  rationale: נסע exprime le déplacement ou la mise en marche. « Avançaient derrière eux » rend ce mouvement sans expliciter davantage l’idée de poursuite déjà évidente dans le contexte.
- source_word: וַיִּירְאוּ מְאֹד
  choice: Ils eurent très peur
  rationale: Cette formulation française courante restitue directement le verbe et son intensif.
- source_word: וַיִּצְעֲקוּ
  choice: crièrent vers
  rationale: Le verbe désigne un cri pressant, ici adressé à Dieu dans la détresse. « Crier vers » conserve cette orientation explicite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La traduction garde la forme masculine et corporative de l’hébreu, désignation traditionnelle du peuple issu d’Israël.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom personnel au lieu de le remplacer par un titre.
- issue: Portée collective de בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites ; les enfants d’Israël
  rationale: La formulation retenue maintient la désignation masculine et généalogique du texte, tout en ayant ici une portée nationale collective.
- issue: Référent collectif de מִצְרַיִם
  choice: les Égyptiens
  alternative: l’Égypte
  rationale: Le singulier hébreu « Égypte » fonctionne par métonymie pour les forces égyptiennes. Le français explicite naturellement le groupe humain sans modifier l’identité des poursuivants.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche du mouvement du texte hébreu, notamment par « levèrent les yeux » et « voici que », sans archaïsmes inutiles.
