    rationale: Le verbe narratif hébreu décrit l’approche de Pharaon comme un événement dans la chaîne du récit. « Lorsque Pharaon approcha » préserve plus directement cet aspect et la progression des actions.
  - severity: low
    issue: « avançaient derrière eux »
    rationale: Cette expression peut évoquer seulement une position à l’arrière. « avançaient à leur suite » conserve le mouvement exprimé par נסע et l’orientation après les Israélites exprimée par אַחֲרֵי, sans surtraduire par « les poursuivaient ».
