source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה נְטֵ֥ה אֶת יָדְ/ךָ֖ עַל הַ/יָּ֑ם וְ/יָשֻׁ֤בוּ הַ/מַּ֨יִם֙ עַל מִצְרַ֔יִם עַל רִכְבּ֖/וֹ וְ/עַל פָּרָשָֽׁי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/026.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the sea, so that the waters may return over the Egyptians, over their chariots, and over their horsemen.”
translation:
  language: fr
  text: 'Alors Yahweh dit à Moïse : « Étends ta main au-dessus de la mer, afin que les eaux reviennent[a] sur les Égyptiens, sur leurs chars et sur leurs cavaliers. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et les eaux reviendront sur les Égyptiens ». Le verbe hébreu peut être rendu plus littéralement par un futur simple ; ici, il peut exprimer le résultat visé par le geste de Moïse.'
    reason: Alternative lexicale et syntaxique pour וְיָשֻׁבוּ.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » exprime naturellement cette succession en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: נְטֵה אֶת־יָדְךָ
  choice: Étends ta main
  rationale: L’impératif décrit le geste concret de tendre la main ; cette formulation est directe et naturelle.
- source_word: עַל־הַיָּם
  choice: au-dessus de la mer
  rationale: Dans le contexte du geste, עַל exprime la position ou la direction de la main par rapport à la mer ; « au-dessus de » conserve clairement l’image spatiale.
- source_word: וְיָשֻׁבוּ
  choice: afin que ... reviennent
  rationale: Après l’impératif, la forme verbale peut exprimer le résultat visé de l’action commandée. La note conserve la possibilité d’un futur simple.
- source_word: הַמַּיִם
  choice: les eaux
  rationale: Le pluriel français correspond à la forme hébraïque et convient au registre narratif élevé.
- source_word: עַל מִצְרַיִם
  choice: sur les Égyptiens
  rationale: La préposition évoque les eaux revenant sur eux et les couvrant, sans ajouter l’idée plus interprétative d’une attaque.
- source_word: עַל רִכְבּוֹ
  choice: sur leurs chars
  rationale: Le suffixe hébreu est singulier, mais son antécédent collectif désigne l’Égypte ou les Égyptiens ; le possessif pluriel est naturel en français.
- source_word: וְעַל פָּרָשָׁיו
  choice: et sur leurs cavaliers
  rationale: פָּרָשׁ désigne ici les hommes montés ou combattants à cheval ; « cavaliers » est précis et courant en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel dans une translittération française couramment reconnue, sans le remplacer par un titre.
- issue: Valeur de וְיָשֻׁבוּ après l’impératif
  choice: afin que les eaux reviennent
  alternative: et les eaux reviendront
  rationale: Le contexte permet de comprendre la proposition comme le résultat visé du geste de Moïse, mais la valeur plus simplement future demeure possible et est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de l’hébreu sans lourdeur ; « cavaliers » est préféré à un terme militaire plus technique. Le marqueur [a] est placé après la phrase entière, car la note porte sur la relation entre le commandement et son résultat.
