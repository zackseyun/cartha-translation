  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה מַה תִּצְעַ֖ק אֵלָ֑/י דַּבֵּ֥ר אֶל בְּנֵי יִשְׂרָאֵ֖ל וְ/יִסָּֽעוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/015.yaml
  text: Then Yahweh said to Moses[b][a], “Why are you crying out to me? Tell the sons of Israel to set out.”
translation:
  language: fr
  text: 'Alors Yahweh dit à Moïse : « Pourquoi cries-tu vers moi ? Dis aux fils d’Israël[a] de se mettre en route[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux Israélites ».
    reason: lexical_alternative
  - marker: b
    text: Ou « d’avancer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit. « Alors » exprime naturellement cette succession en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel du texte hébreu au lieu de lui substituer un titre.
- source_word: מַה תִּצְעַק אֵלָי
  choice: Pourquoi cries-tu vers moi ?
  rationale: Dans cette tournure interrogative, מַה a le sens idiomatique de « pourquoi ». צעק exprime un cri pressant ou un appel lancé dans la détresse, et אֵלָי indique sa direction vers Dieu.
- source_word: דַּבֵּר אֶל
  choice: Dis à
  rationale: Cette formulation française naturelle conserve la valeur directive de l’impératif sans la renforcer jusqu’à « ordonne ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction reproduit la forme masculine et la désignation collective de l’hébreu; « les Israélites » est signalé comme équivalent plus idiomatique.
- source_word: וְיִסָּעוּ
  choice: de se mettre en route
  rationale: Le verbe נסע désigne couramment le fait de lever le camp ou de partir. Ici, « se mettre en route » est naturel et convient à l’ordre immédiat de reprendre le mouvement.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: « Yahweh » préserve la distinction entre le nom personnel présent dans l’hébreu et un titre de substitution, sans introduire une préférence confessionnelle particulière.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le texte principal garde la forme masculine littérale et traditionnelle de l’expression hébraïque, tandis que la note donne son équivalent collectif courant.
- issue: Sens contextuel de וְיִסָּעוּ
  choice: de se mettre en route
  alternative: d’avancer
  rationale: Le choix principal conserve le sens lexical de départ ou de mise en marche; l’autre lecture, fortement suggérée par la situation devant la mer, est maintenue en note sans remplacer le sens lexical par une précision contextuelle.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond au singulier hébreu adressé à Moïse. La syntaxe reste simple afin de préserver la vigueur de la question et de l’ordre.
