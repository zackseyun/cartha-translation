base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/020.yaml
  text: And it came between the camp of Egypt and the camp of Israel[a], and there was the cloud and the darkness, yet it lit up the night; and the one did not come near the other all night.
translation:
  language: fr
  text: Il vint entre le camp des Égyptiens et le camp d’Israël. Il y eut la nuée et l’obscurité, mais la nuit fut éclairée[a] ; et l’un ne s’approcha pas de l’autre pendant toute la nuit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il y eut la nuée et l’obscurité, mais il éclaira la nuit. » L’hébreu est concis, et les versions anciennes comme les traductions diffèrent quant à la relation entre la nuée, l’obscurité et la lumière, ainsi qu’au sujet implicite du verbe « éclairer ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Il vint
  rationale: Le verbe masculin singulier renvoie, dans le contexte précédent, soit à l’ange de Dieu, soit à la colonne de nuée. En français, « il » peut reprendre l’un ou l’autre sans trancher cette ambiguïté.
- source_word: בֵּין ... וּבֵין
  choice: entre ... et ...
  rationale: Rend directement et naturellement la relation spatiale exprimée en hébreu.
- source_word: מַחֲנֵה מִצְרַיִם ... מַחֲנֵה יִשְׂרָאֵל
  choice: le camp de l’Égypte ... le camp d’Israël
  rationale: Conserve les noms propres et la construction de l’hébreu, tout en désignant clairement les deux groupes opposés.
- source_word: וַיְהִי הֶעָנָן וְהַחֹשֶׁךְ
  choice: Il y eut la nuée et l’obscurité
  rationale: « Il y eut » rend la tournure narrative existentielle ; les deux noms définis sont maintenus, de même que leur juxtaposition saisissante.
- source_word: וַיָּאֶר אֶת־הַלָּיְלָה
  choice: mais elle éclaira la nuit
  rationale: Le verbe signifie « donner de la lumière, éclairer » et prend « la nuit » comme objet. « Mais » explicite le contraste naturellement suggéré entre l’obscurité et l’illumination. Le pronom féminin reprend naturellement « la nuée » en français sans introduire un nouveau sujet explicite.
- source_word: וְלֹא קָרַב זֶה אֶל־זֶה
  choice: et l’un ne s’approcha pas de l’autre
  rationale: Rend idiomatiquement la réciprocité de זֶה אֶל־זֶה et le mouvement d’approche empêché entre les deux camps.
- source_word: כָּל־הַלָּיְלָה
  choice: pendant toute la nuit
  rationale: Expression française naturelle qui conserve la durée totale indiquée par l’hébreu.
theological_decisions:
- issue: Référent du verbe masculin singulier וַיָּבֹא
  choice: Employer « il » sans nommer explicitement le référent
  alternative: Préciser « l’ange de Dieu » ou « la colonne de nuée »
  rationale: Le contexte immédiat mentionne à la fois l’ange de Dieu et la colonne de nuée. Comme les deux noms sont masculins en français, « il » préserve heureusement l’ambiguïté narrative de l’hébreu sans imposer une identification théologique.
- issue: Relation entre la nuée, l’obscurité et la lumière
  choice: « Il y eut la nuée et l’obscurité, mais elle éclaira la nuit »
  alternative: « La nuée et l’obscurité étaient là, mais elle donnait de la lumière pendant la nuit »
  rationale: La syntaxe hébraïque est très concise et permet plusieurs manières de relier l’obscurité et la lumière, éventuellement aux deux camps. Le texte principal conserve leur tension sans préciser davantage leur répartition.
translation_notes:
  register: Français international moderne, sobre et digne. La coordination narrative demeure proche de l’hébreu, tandis que les formulations « il y eut » et « l’un… l’autre » assurent une lecture naturelle. Le terme biblique courant « nuée » est conservé pour la manifestation déjà introduite dans le contexte.
