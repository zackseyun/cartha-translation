revisions:
- from: Il vint entre le camp de l’Égypte et le camp d’Israël[a]. Il y eut la nuée et l’obscurité, mais elle éclaira la nuit ; et l’un ne s’approcha pas de l’autre pendant toute la nuit.
  to: Il vint entre le camp des Égyptiens et le camp d’Israël. Il y eut la nuée et l’obscurité, mais la nuit fut éclairée[a] ; et l’un ne s’approcha pas de l’autre pendant toute la nuit.
  rationale: La révision remplace une construction française peu idiomatique par « le camp des Égyptiens » et, surtout, supprime l’attribution explicite de l’éclairage à la nuée. « La nuit fut éclairée » conserve le fait affirmé par le texte tout en laissant ouvert le référent du verbe hébreu et la relation précise entre obscurité et lumière. La note présente l’alternative active et explique sobrement l’ambiguïté textuelle.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:14:27Z'
review_pass:
  verdict: revise
  source_fidelity: Le mouvement entre les deux camps, la nuée, l’obscurité, l’éclairage de la nuit et l’absence d’approche durant toute la nuit sont bien rendus. Toutefois, « elle éclaira » attribue nécessairement l’action à « la nuée » en français, alors que le sujet masculin de וַיָּאֶר demeure littérairement ambigu dans le contexte et que la relation exacte entre nuée, obscurité et lumière est disputée.
  naturalness: « Le camp de l’Égypte » est peu idiomatique en français moderne; « le camp des Égyptiens » est naturel et exprime le sens contextuel de la construction hébraïque. La voix passive dans « la nuit fut éclairée » permet une formulation française fluide sans lever l’ambiguïté du sujet.
  terminology: « Nuée » convient au registre biblique sobre et moderne. « Camp des Égyptiens » et « camp d’Israël » identifient clairement les deux groupes. La note doit éviter le pronom « elle », qui tranche indûment le référent de l’éclairage.
  issues:
  - severity: medium
    issue: Le pronom « elle » dans « mais elle éclaira la nuit » identifie la nuée comme sujet de l’éclairage.
    rationale: L’hébreu emploie un verbe masculin singulier dont le référent n’est pas explicitement identifié dans ce verset; la syntaxe concise a reçu diverses analyses. En français, « elle » ne peut reprendre que « la nuée » et élimine cette ambiguïté.
  - severity: low
    issue: « Le camp de l’Égypte » est une tournure calquée et peu naturelle.
    rationale: Le génitif hébreu désigne ici le camp de la force égyptienne. « Le camp des Égyptiens » est l’expression française usuelle et ne modifie pas le sens.
  - severity: low
    issue: La justification affirme à tort que l’ange de Dieu et la colonne de nuée sont tous deux masculins en français.
    rationale: « Colonne » et « nuée » sont féminins en français. Cette affirmation ne soutient donc pas correctement le maintien de « il ».
  revised_text: Il vint entre le camp des Égyptiens et le camp d’Israël. Il y eut la nuée et l’obscurité, mais la nuit fut éclairée[a] ; et l’un ne s’approcha pas de l’autre pendant toute la nuit.
