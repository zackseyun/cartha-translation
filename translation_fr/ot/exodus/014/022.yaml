  text: וַ/יָּבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/ת֥וֹךְ הַ/יָּ֖ם בַּ/יַּבָּשָׁ֑ה וְ/הַ/מַּ֤יִם לָ/הֶם֙ חֹמָ֔ה מִֽ/ימִינָ֖/ם וּ/מִ/שְּׂמֹאלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/022.yaml
  text: And the sons of Israel went into the midst of the sea on the dry ground[a], and the waters were a wall to them on their right and on their left.
translation:
  language: fr
  text: Les fils d’Israël[a] entrèrent au milieu de la mer, sur le sol sec, et les eaux étaient pour eux une muraille à leur droite et à leur gauche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les Israélites ». L’hébreu dit littéralement : « les fils d’Israël ».'
    reason: Alternative lexicale signalant à la fois la formulation littérale de l’hébreu et son équivalent collectif idiomatique en français.
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: entrèrent
  rationale: Dans ce contexte narratif, בוא exprime un mouvement vers l’intérieur d’un lieu. « Entrèrent » rend ce sens clairement et naturellement en français.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression masculine et représentative de l’hébreu. « Les Israélites » serait plus idiomatique, mais moins transparent par rapport à la forme du texte source.
- source_word: בְּתוֹךְ הַיָּם
  choice: au milieu de la mer
  rationale: Cette traduction rend directement l’idée spatiale de תּוֹךְ sans ajouter la notion de traversée, qui appartient au contexte plus large.
- source_word: בַּיַּבָּשָׁה
  choice: sur le sol sec
  rationale: Le nom désigne ce qui est sec par opposition à l’eau. « Le sol sec » évoque naturellement le fond asséché de la mer tout en conservant l’article hébreu.
- source_word: וְהַמַּיִם
  choice: et les eaux
  rationale: Le pluriel français conserve le caractère concret et solennel du pluriel hébreu dans ce récit.
- source_word: חֹמָה
  choice: une muraille
  rationale: Le mot signifie directement « mur » ou « muraille » et ne comporte aucun marqueur comparatif. « Une muraille » préserve donc l’image forte sans ajouter « comme ».
- source_word: מִימִינָם
  choice: à leur droite
  rationale: Cette expression rend naturellement en français la position des eaux du côté droit.
- source_word: וּמִשְּׂמֹאלָם
  choice: à leur gauche
  rationale: Cette formulation parallèle conserve la symétrie spatiale et stylistique de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le mouvement narratif ainsi que l’image concrète des eaux constituant une muraille, sans introduire de comparaison absente de l’hébreu.
