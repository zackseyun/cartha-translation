source:
  edition: WLC
  text: וְ/יָדְע֥וּ מִצְרַ֖יִם כִּי אֲנִ֣י יְהוָ֑ה בְּ/הִכָּבְדִ֣/י בְּ/פַרְעֹ֔ה בְּ/רִכְבּ֖/וֹ וּ/בְ/פָרָשָֽׁי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/018.yaml
  text: And the Egyptians will know that I am Yahweh[a], when I gain glory through Pharaoh, through his chariots[b], and through his horsemen.
translation:
  language: fr
  text: Les Égyptiens sauront alors que je suis Yahweh[a], quand je serai glorifié aux dépens du pharaon, de ses chars et de ses cavaliers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom hébreu YHWH est traditionnellement rendu en français par « le SEIGNEUR ».
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Alors … sauront
  rationale: Le parfait qal précédé de וְ exprime ici le résultat futur de l’intervention annoncée. « Alors » rend naturellement le lien consécutif avec le contexte.
- source_word: מִצְרַיִם
  choice: les Égyptiens
  rationale: Dans ce contexte, le nom désigne le peuple d’Égypte, sujet de la reconnaissance à venir.
- source_word: כִּי אֲנִי יְהוָה
  choice: que je suis Yahweh
  rationale: Cette formulation conserve la formule de reconnaissance et rend le tétragramme comme nom propre.
- source_word: בְּהִכָּבְדִי
  choice: quand je serai glorifié
  rationale: L’infinitif construit nifal avec suffixe de première personne présente Yahweh comme recevant ou manifestant sa gloire; בְּ a ici une valeur temporelle.
- source_word: בְּפַרְעֹה
  choice: par le moyen du pharaon
  rationale: La préposition marque ici le moyen ou la sphère par lesquels la gloire divine sera manifestée, sans suggérer que le pharaon glorifie volontairement Yahweh.
- source_word: בְּרִכְבּוֹ
  choice: de ses chars
  rationale: רֶכֶב peut désigner collectivement les chars de guerre; le pluriel français est clair et naturel.
- source_word: וּבְפָרָשָׁיו
  choice: et de ses cavaliers
  rationale: פָּרָשׁ désigne les cavaliers ou la cavalerie; « cavaliers » convient à la coordination avec les chars.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » conserve le caractère personnel du nom divin, tandis qu’une note signale la convention française traditionnelle.
- issue: Sens de בְּהִכָּבְדִי
  choice: quand je serai glorifié
  alternative: quand je manifesterai ma gloire
  rationale: La forme nifal permet de comprendre que Yahweh sera glorifié ou reconnu dans le jugement du pharaon. La traduction retenue préserve cette voix et évite de réduire le propos à une simple démonstration visible.
translation_notes:
  register: Français international moderne, digne et accessible. L’article dans « du pharaon » est idiomatique en français. « Par le moyen de » explicite la valeur instrumentale de la préposition hébraïque tout en évitant l’idée d’une glorification volontaire de la part du pharaon.
