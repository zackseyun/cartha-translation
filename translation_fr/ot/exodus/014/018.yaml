review_pass:
  verdict: revise
  source_fidelity: La formule de reconnaissance est bien rendue, de même que les Égyptiens comme sujet et la séquence Pharaon–chars–cavaliers. Toutefois, « par le moyen du pharaon » est lourd et, avec le passif « je serai glorifié », reste sémantiquement maladroit en français. Le nifal de כבד exprime ici que Yahweh recevra/obtiendra gloire en rapport avec la défaite de Pharaon et de ses forces; « aux dépens de » rend ce rapport sans faire de Pharaon l’agent volontaire de la glorification.
  naturalness: La phrase révisée est plus idiomatique en français international moderne. Le déplacement de « alors » après le verbe est également plus fluide.
  terminology: « Yahweh » correspond au choix éditorial et la note explique sobrement la convention française traditionnelle. « Chars » et « cavaliers » rendent précisément les termes militaires hébreux.
  issues:
  - severity: medium
    issue: Expression instrumentale passive maladroite
    rationale: « Je serai glorifié par le moyen du pharaon » est grammaticalement possible, mais peu naturel et peut obscurcir le fait que Pharaon subit le jugement plutôt qu’il n’agit comme instrument volontaire. Une formulation indiquant que la gloire est obtenue aux dépens de Pharaon rend mieux le contexte et la valeur de בְּ.
  revised_text: Les Égyptiens sauront alors que je suis Yahweh[a], quand je serai glorifié aux dépens du pharaon, de ses chars et de ses cavaliers.
  revised_footnotes:
  - marker: a
    text: Le nom hébreu YHWH est traditionnellement rendu en français par « le SEIGNEUR ».
    reason: alternative_reading
  revision_rationale: La révision remplace l’expression lourde « par le moyen de » par « aux dépens de », qui exprime naturellement en français la glorification de Yahweh dans le jugement de Pharaon et de ses forces, sans imposer l’idée que ceux-ci le glorifient volontairement. Elle conserve la voix passive du nifal et l’ambiguïté contrôlée de la préposition hébraïque.
