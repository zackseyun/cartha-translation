revisions:
- from: Alors les Égyptiens sauront que je suis Yahweh[a], quand je serai glorifié par le moyen du pharaon, de ses chars et de ses cavaliers.
  to: Les Égyptiens sauront alors que je suis Yahweh[a], quand je serai glorifié aux dépens du pharaon, de ses chars et de ses cavaliers.
  rationale: La révision remplace l’expression lourde « par le moyen de » par « aux dépens de », qui exprime naturellement en français la glorification de Yahweh dans le jugement de Pharaon et de ses forces, sans imposer l’idée que ceux-ci le glorifient volontairement. Elle conserve la voix passive du nifal et l’ambiguïté contrôlée de la préposition hébraïque.
  reviewer_model: gpt-5.6-terra
