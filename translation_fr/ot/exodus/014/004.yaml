base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/004.yaml
  text: And I will harden Pharaoh’s heart[a], and he will pursue them; and I will get glory over Pharaoh and over all his army[b], and the Egyptians will know that I am Yahweh.” And they did so.
translation:
  language: fr
  text: J’endurcirai le cœur de Pharaon[a], et il les poursuivra. Je tirerai gloire de Pharaon et de toute son armée[b], et les Égyptiens sauront que je suis Yahvé. » Et ils firent ainsi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je fortifierai le cœur de Pharaon. » Le verbe hébreu signifie rendre fort ou ferme ; dans ce contexte, cette fermeté prend la forme de l’obstination.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Je serai glorifié en Pharaon et en toute son armée. » L’expression hébraïque indique que Yahvé recevra gloire en rapport avec ce qui arrivera à Pharaon et à son armée.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְחִזַּקְתִּי אֶת לֵב פַּרְעֹה
  choice: Je rendrai le cœur de Pharaon inflexible
  rationale: Le hiphil de חזק exprime ici l’action de rendre ferme ou obstiné. « Rendre le cœur inflexible » conserve la causalité divine explicite, l’image biblique du cœur et, en français actuel, le sens contextuel d’obstination.
- source_word: וְרָדַף אַחֲרֵיהֶם
  choice: et il les poursuivra
  rationale: Traduction directe et naturelle de רדף après quelqu’un, dans un contexte de poursuite militaire.
- source_word: וְאִכָּבְדָה בְּפַרְעֹה
  choice: Je manifesterai ma gloire aux dépens de Pharaon
  rationale: La forme de כבד indique que Yahvé sera glorifié ou fera éclater sa gloire en rapport avec Pharaon. Dans ce contexte de jugement et de victoire, « aux dépens de » rend la valeur adversative probable de בְּ sans réduire l’expression à une simple instrumentalité.
- source_word: וּבְכָל חֵילוֹ
  choice: et de toute son armée
  rationale: חַיִל désigne ici les forces militaires de Pharaon; « armée » est le terme français moderne le plus clair.
- source_word: וְיָדְעוּ מִצְרַיִם
  choice: et les Égyptiens sauront
  rationale: Le verbe pluriel associé à « Égypte » désigne naturellement les Égyptiens comme peuple.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, plutôt que substitution par un titre.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Et ils firent ainsi
  rationale: Clôture narrative concise qui indique l’exécution de l’ordre précédent; le passé simple convient au registre narratif biblique digne.
theological_decisions:
- issue: Action divine sur le cœur de Pharaon
  choice: 'Conserver la causalité directe : « Je rendrai le cœur de Pharaon inflexible »'
  alternative: « Je laisserai le cœur de Pharaon s’endurcir »
  rationale: La première personne au hiphil présente Yahvé comme sujet agissant. Une formulation seulement permissive atténuerait une tension théologique présente dans l’hébreu.
- issue: Gloire divine dans le jugement de Pharaon
  choice: « Je manifesterai ma gloire aux dépens de Pharaon »
  alternative: « Je serai glorifié par l’intermédiaire de Pharaon »
  rationale: La traduction retenue garde ensemble la manifestation de la gloire divine et la dimension de victoire ou de jugement contre Pharaon. La note signale l’autre manière possible de comprendre la construction.
translation_notes:
  register: Français international moderne, clair et digne. « Inflexible » évite une tournure lourde tout en préservant l’image du cœur et la causalité du texte. Le passé simple final maintient une narration biblique soutenue sans archaïsme excessif.
