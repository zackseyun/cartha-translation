source:
  edition: WLC
  text: דַּבֵּר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וְ/יָשֻׁ֗בוּ וְ/יַחֲנוּ֙ לִ/פְנֵי֙ פִּ֣י הַחִירֹ֔ת בֵּ֥ין מִגְדֹּ֖ל וּ/בֵ֣ין הַ/יָּ֑ם לִ/פְנֵי֙ בַּ֣עַל צְפֹ֔ן נִכְח֥/וֹ תַחֲנ֖וּ עַל הַ/יָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/002.yaml
  text: Speak to the sons of Israel[a], that they turn back and camp before Pi-hahiroth, between Migdol and the sea. Before Baal-zephon, opposite it[c][b], you shall camp by the sea.
translation:
  language: fr
  text: « Dis aux Israélites[a] qu’ils reviennent sur leurs pas et campent devant Pi-Hahiroth[b], entre Migdol et la mer. Vous camperez au bord de la mer, devant Baal-Tsefon, en face de lui[c]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: Pi-Hahiroth, Migdol et Baal-Tsefon sont des noms de lieux ; ils sont donc translittérés plutôt que traduits.
    reason: cultural_note
  - marker: c
    text: 'Ou : « face à lui ». Le pronom traduit par « lui » renvoie très probablement à Baal-Tsefon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: Dis aux
  rationale: L’impératif piel de דבר suivi de אֶל introduit un ordre adressé par Moïse au peuple. « Dis aux » est direct et naturel en français.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: L’expression signifie littéralement « les fils d’Israël », mais « les Israélites » désigne naturellement l’ensemble du peuple en français moderne sans laisser entendre qu’il ne s’agit que des hommes.
- source_word: וְיָשֻׁבוּ
  choice: qu’ils reviennent sur leurs pas
  rationale: La forme à valeur jussive transmet l’action ordonnée. « Revenir sur leurs pas » exprime clairement le changement de direction impliqué par שוב.
- source_word: וְיַחֲנוּ
  choice: et campent
  rationale: Le verbe חנה signifie « camper ». Le présent du subjonctif coordonné dépend naturellement de « Dis… qu’ils ».
- source_word: לִפְנֵי פִּי הַחִירֹת
  choice: devant Pi-Hahiroth
  rationale: לִפְנֵי indique ici une position devant ou en face de, et פִּי הַחִירֹת est conservé comme nom de lieu translittéré.
- source_word: בֵּין מִגְדֹּל וּבֵין הַיָּם
  choice: entre Migdol et la mer
  rationale: La construction בֵּין…וּבֵין délimite la position entre deux repères. הַיָּם est rendu simplement par « la mer ».
- source_word: לִפְנֵי בַּעַל צְפֹן
  choice: devant Baal-Tsefon
  rationale: Le rapport spatial de לִפְנֵי est maintenu, tandis que le toponyme est translittéré selon un usage français transparent.
- source_word: נִכְחוֹ
  choice: en face de lui
  rationale: Le terme indique une position vis-à-vis d’un repère et porte un suffixe masculin singulier. La formulation conserve le pronom du texte hébreu au lieu d’en expliciter silencieusement l’antécédent.
- source_word: תַחֲנוּ
  choice: Vous camperez
  rationale: L’inaccompli à la deuxième personne du pluriel a ici une force directive. Le futur français exprime naturellement cette instruction.
- source_word: עַל הַיָּם
  choice: au bord de la mer
  rationale: Dans ce contexte locatif, עַל exprime la proximité du rivage plutôt qu’une position littérale sur la surface de la mer.
