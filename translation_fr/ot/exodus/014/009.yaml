  text: וַ/יִּרְדְּפ֨וּ מִצְרַ֜יִם אַחֲרֵי/הֶ֗ם וַ/יַּשִּׂ֤יגוּ אוֹתָ/ם֙ חֹנִ֣ים עַל הַ/יָּ֔ם כָּל סוּס֙ רֶ֣כֶב פַּרְעֹ֔ה וּ/פָרָשָׁ֖י/ו וְ/חֵיל֑/וֹ עַל פִּי֙ הַֽחִירֹ֔ת לִ/פְנֵ֖י בַּ֥עַל צְפֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/009.yaml
  text: The Egyptians pursued them and overtook them as they were camped by the sea—all Pharaoh’s horses and chariots[a], his horsemen, and his army—by Pi-hahiroth, before Baal-zephon.
translation:
  language: fr
  text: Les Égyptiens les poursuivirent et les rattrapèrent alors qu’ils campaient au bord de la mer — tous les chevaux et les chars de Pharaon, ses cavaliers et son armée — près de Pi-Hahiroth, en face de Baal-Tsephon[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant Baal-Tsephon ». L’expression hébraïque peut indiquer une position devant un repère ou en face de lui.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ
  choice: poursuivirent
  rationale: Le verbe רדף désigne naturellement l’action de poursuivre; le passé simple convient au récit suivi et garde sa vigueur militaire.
- source_word: מִצְרַיִם
  choice: Les Égyptiens
  rationale: Bien que le mot puisse désigner l’Égypte, le verbe au pluriel et le contexte indiquent ici le peuple ou les forces égyptiennes.
- source_word: וַיַּשִּׂיגוּ
  choice: les rattrapèrent
  rationale: נשׂג signifie ici rejoindre ceux que l’on poursuit; « rattrapèrent » est naturel et précis en français contemporain.
- source_word: חֹנִים
  choice: alors qu’ils campaient
  rationale: Le participe décrit la situation des Israélites au moment où les Égyptiens les rejoignent.
- source_word: עַל הַיָּם
  choice: près de la mer
  rationale: La préposition a ici un sens locatif; la mer est désignée comme nom commun, sans qu’il soit nécessaire d’en faire un nom propre.
- source_word: כָּל סוּס רֶכֶב פַּרְעֹה
  choice: tous les chevaux et les chars de Pharaon
  rationale: La construction hébraïque est condensée et collective. Cette formulation française rend clairement l’ensemble des chevaux et des chars appartenant aux forces de Pharaon sans reproduire une syntaxe obscure.
- source_word: וּפָרָשָׁיו
  choice: ses cavaliers
  rationale: פָּרָשׁ désigne des hommes montés; « cavaliers » est le terme français courant et transparent.
- source_word: וְחֵילוֹ
  choice: et son armée
  rationale: חַיִל désigne ici la force militaire de Pharaon; « armée » exprime clairement ce sens contextuel.
- source_word: עַל פִּי הַחִירֹת
  choice: près de Pi-Hahiroth
  rationale: Le groupe prépositionnel situe le camp aux abords du lieu appelé Pi-Hahiroth.
- source_word: לִפְנֵי בַּעַל צְפֹן
  choice: en face de Baal-Tsephon
  rationale: Dans ce contexte spatial, לִפְנֵי peut indiquer une position faisant face à un repère; « en face de » est naturel et précis, tout en signalant l’autre possibilité en note.
