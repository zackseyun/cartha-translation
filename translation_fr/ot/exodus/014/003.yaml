  text: וְ/אָמַ֤ר פַּרְעֹה֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל נְבֻכִ֥ים הֵ֖ם בָּ/אָ֑רֶץ סָגַ֥ר עֲלֵי/הֶ֖ם הַ/מִּדְבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/003.yaml
  text: For Pharaoh will say of the sons of Israel[a], ‘They are confused in the land[c][b]; the wilderness has shut them in.’
translation:
  language: fr
  text: 'Car le pharaon dira au sujet des fils d’Israël[a] : « Ils sont désorientés dans le pays ; le désert les a enfermés. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « des Israélites ». Littéralement : « des fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: Car le pharaon se dira
  rationale: Dans ce contexte prédictif, le qatal précédé de waw a une valeur future. « Car » rend la fonction explicative de la proposition, et la tournure pronominale « se dira » exprime naturellement en français la réflexion que le pharaon formulera.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: au sujet des fils d’Israël
  rationale: Avec אָמַר, la préposition ל peut introduire les personnes dont on parle. « Fils d’Israël » conserve l’expression hébraïque, tandis que « au sujet de » évite de lui donner à tort le sens « aux fils d’Israël ».
- source_word: נְבֻכִים
  choice: désorientés
  rationale: Le participe décrit un état de perplexité ou de perte d’orientation, avec une possible nuance d’enchevêtrement ou d’impasse. « Désorientés » rend ce sens sans ajouter explicitement l’idée de marche errante.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: אֶרֶץ désigne ici le territoire ou la région où les Israélites paraissent désorientés. « Pays » est idiomatique en français et ne précise pas indûment les limites géographiques.
- source_word: סָגַר עֲלֵיהֶם
  choice: les a enfermés
  rationale: L’expression présente le désert comme ce qui les enferme ou leur ferme toute issue. Cette formulation conserve l’image forte du texte hébreu.
- source_word: הַמִּדְבָּר
  choice: le désert
  rationale: Dans le récit de l’Exode, « désert » est le terme français courant pour une étendue inculte et inhabitée, sans exiger qu’elle soit exclusivement sablonneuse.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le futur implicite dans la prédiction divine, l’expression sémitique « fils d’Israël » et la personnification du désert. La ponctuation française et les guillemets sont adaptés à l’usage contemporain.
