base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/011.yaml
  text: And they said to Moses[a], “Was it because there were no graves in Egypt that you took us away to die in the wilderness? What is this you have done to us by bringing us out of Egypt?”
translation:
  language: fr
  text: 'Ils dirent à Moïse : « Était-ce parce qu’il n’y avait pas de tombes en Égypte que tu nous as emmenés mourir dans le désert ? Qu’est-ce que tu nous as fait en nous faisant sortir d’Égypte ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה
  choice: Ils dirent à Moïse
  rationale: La formule narrative introduit directement les paroles adressées à Moïse. Le passé simple convient au registre narratif français soutenu mais accessible.
- source_word: הֲמִבְּלִי אֵין קְבָרִים בְּמִצְרַיִם
  choice: Était-ce parce qu’il n’y avait pas de tombes en Égypte
  rationale: Cette formulation naturelle conserve la question rhétorique sarcastique et l’idée d’absence de tombes, sans reproduire maladroitement l’idiome hébreu mot à mot.
- source_word: לְקַחְתָּנוּ
  choice: tu nous as emmenés
  rationale: Le verbe לקח signifie ici prendre et conduire ailleurs. « Emmenés » exprime le déplacement hors d’Égypte tout en restant distinct de הוציא, rendu ensuite par « faire sortir ».
- source_word: לָמוּת בַּמִּדְבָּר
  choice: mourir dans le désert
  rationale: L’infinitif exprime ici le but ou le résultat accusé. « Désert » est l’équivalent français courant de מִדְבָּר dans ce contexte de l’Exode, sans impliquer nécessairement une étendue uniquement sableuse.
- source_word: מַה־זֹּאת עָשִׂיתָ לָּנוּ
  choice: Qu’est-ce que tu nous as fait
  rationale: Cette tournure idiomatique conserve la forme interrogative et la vive accusation de l’hébreu.
- source_word: לְהוֹצִיאָנוּ מִמִּצְרָיִם
  choice: en nous faisant sortir d’Égypte
  rationale: Le causatif הוציא est rendu précisément par « faire sortir ». Le gérondif relie naturellement l’action à la plainte précédente et reflète la fonction explicative de l’infinitif hébreu.
