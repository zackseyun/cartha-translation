  source_fidelity: La traduction rend correctement les Égyptiens, la poursuite et l’énumération des forces de Pharaon. Toutefois, « jusqu’au milieu » introduit une nuance de terme ou de limite (« jusqu’à ») qui n’est pas exprimée par אֶל (« dans/au cœur de »).
  naturalness: « Entrèrent à leur suite au milieu de la mer » est plus naturel et plus précis dans ce contexte narratif que « entrèrent derrière eux jusqu’au milieu de la mer ».
  terminology: « Égyptiens », « pharaon », « chars » et « cavaliers » conviennent au français international moderne et au registre militaire du récit. La note sur le singulier collectif est pertinente.
