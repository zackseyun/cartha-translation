  text: וַ/יִּרְדְּפ֤וּ מִצְרַ֨יִם֙ וַ/יָּבֹ֣אוּ אַחֲרֵי/הֶ֔ם כֹּ֚ל ס֣וּס פַּרְעֹ֔ה רִכְבּ֖/וֹ וּ/פָרָשָׁ֑י/ו אֶל תּ֖וֹךְ הַ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/023.yaml
  text: The Egyptians pursued and went in after them into the midst of the sea—all Pharaoh’s horses[a], his chariots[b], and his horsemen.
translation:
  language: fr
  text: 'Les Égyptiens les poursuivirent et entrèrent à leur suite au milieu de la mer : tous les chevaux du pharaon[a], ses chars et ses cavaliers.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie le singulier collectif : « tout cheval du pharaon »; le français exprime naturellement ce sens par « tous les chevaux du pharaon ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ
  choice: les poursuivirent
  rationale: Le verbe רדף exprime ici une poursuite militaire; « poursuivirent » est naturel et précis.
- source_word: מִצְרַיִם
  choice: Les Égyptiens
  rationale: Le contexte et le verbe au pluriel désignent les hommes d’Égypte, non le pays.
- source_word: וַיָּבֹאוּ אַחֲרֵיהֶם
  choice: entrèrent derrière eux
  rationale: בוא indique l’entrée, tandis que אַחֲרֵיהֶם précise qu’ils suivent les Israélites; « derrière eux » conserve cette image spatiale sans dissocier l’expression.
- source_word: כֹּל סוּס פַּרְעֹה
  choice: tous les chevaux du pharaon
  rationale: Le singulier סוּס a ici une valeur collective après כֹּל; le pluriel français en rend naturellement le sens.
- source_word: רִכְבּוֹ
  choice: ses chars
  rationale: רכב peut désigner les chars ou l’ensemble des chars; dans cette énumération concrète, « ses chars » est clair et idiomatique.
- source_word: וּפָרָשָׁיו
  choice: et ses cavaliers
  rationale: פָרָשׁ désigne des hommes montés ou appartenant à la cavalerie; « cavaliers » convient au registre narratif militaire.
- source_word: אֶל תּוֹךְ הַיָּם
  choice: jusqu’au milieu de la mer
  rationale: תּוֹךְ souligne l’intérieur de la mer; avec le verbe d’entrée, « jusqu’au milieu de la mer » exprime l’avancée à l’intérieur sans lourdeur.
