revisions:
- from: 'On annonça au roi d’Égypte que le peuple s’était enfui. Alors le cœur du pharaon et de ses serviteurs changea envers le peuple, et ils dirent : « Qu’avons-nous fait là ? Nous avons laissé partir Israël, qui ne nous servira plus ! »[a]'
  to: 'On annonça au roi d’Égypte que le peuple s’était enfui. Alors le cœur du pharaon et de ses serviteurs se retourna contre le peuple, et ils dirent : « Qu’avons-nous fait là, en laissant partir Israël, qui ne nous sert plus ? »'
  rationale: La révision conserve le passif impersonnel, le « cœur » au singulier collectif et la notion de service. Elle remplace une tournure française maladroite par une expression naturelle qui correspond au retournement hostile manifesté dans le contexte immédiat, et elle rétablit une interrogation unique sans note interprétative superflue.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:13:00Z'
review_pass:
  verdict: revise
  source_fidelity: Le début rend bien le passif impersonnel, la fuite du peuple et le plus-que-parfait narratif. En revanche, « le cœur ... changea envers le peuple » est peu idiomatique en français et atténue le renversement hostile qu’exprime l’ensemble de l’idiome dans ce contexte. La dernière réplique gagne à conserver sous une seule interrogation le lien entre le geste regretté et la cessation du service.
  naturalness: « Changea envers » n’est pas une collocation française naturelle avec « cœur ». « Se retourna contre » est idiomatique et convient au contexte narratif. Une seule question directe rend également la parole plus fluide tout en reflétant la construction hébraïque.
  terminology: « Pharaon », « serviteurs », « peuple », « Israël » et « servir » sont appropriés. Le terme « esclavage » ne doit pas être ajouté à la note, car le verset formule directement la cessation du service sans employer ce terme.
  issues:
  - severity: medium
    issue: Expression française et valeur contextuelle de « changea envers »
    rationale: Le français ne dit pas naturellement qu’un cœur « change envers » quelqu’un. L’hébreu décrit un retournement d’attitude; dans ce contexte, « se retourna contre le peuple » le restitue sans ajouter une doctrine ni une donnée extérieure.
  - severity: medium
    issue: Reformulation de la réplique finale et note associée
    rationale: La scission en une question suivie d’une exclamation rend moins directement la relation exprimée par la phrase hébraïque. La note actuelle, ancrée en fin de citation, introduit en outre « l’asservissement », information contextuelle qui n’est pas une véritable variante lexicale nécessaire pour ce verset.
  revised_text: 'On annonça au roi d’Égypte que le peuple s’était enfui. Alors le cœur du pharaon et de ses serviteurs se retourna contre le peuple, et ils dirent : « Qu’avons-nous fait là, en laissant partir Israël, qui ne nous sert plus ? »'
  revised_footnotes: []
  revision_rationale: La révision conserve le passif impersonnel, le « cœur » au singulier collectif et la notion de service. Elle remplace une tournure française maladroite par une expression naturelle qui correspond au retournement hostile manifesté dans le contexte immédiat, et elle rétablit une interrogation unique sans note interprétative superflue.
