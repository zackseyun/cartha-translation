  text: וַ/יֻּגַּד֙ לְ/מֶ֣לֶךְ מִצְרַ֔יִם כִּ֥י בָרַ֖ח הָ/עָ֑ם וַ֠/יֵּהָפֵךְ לְבַ֨ב פַּרְעֹ֤ה וַ/עֲבָדָי/ו֙ אֶל הָ/עָ֔ם וַ/יֹּֽאמרוּ֙ מַה זֹּ֣את עָשִׂ֔ינוּ כִּֽי שִׁלַּ֥חְנוּ אֶת יִשְׂרָאֵ֖ל מֵ/עָבְדֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/005.yaml
  text: It was reported to the king of Egypt that the people had fled[a], and the heart of Pharaoh and his servants was turned against the people, and they said, “What is this we have done[b], that we have let Israel go from serving us?”
translation:
  language: fr
  text: 'On annonça au roi d’Égypte que le peuple s’était enfui. Alors le cœur du pharaon et de ses serviteurs se retourna contre le peuple, et ils dirent : « Qu’avons-nous fait là, en laissant partir Israël, qui ne nous sert plus ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: On annonça
  rationale: Le tour impersonnel avec « on » rend naturellement en français le hophal passif dont l’agent n’est pas précisé.
- source_word: כִּי בָרַח הָעָם
  choice: que le peuple s’était enfui
  rationale: Le plus-que-parfait situe la fuite avant l’annonce, tandis que « s’enfuir » rend directement ברח.
- source_word: וַיֵּהָפֵךְ לְבַב פַּרְעֹה וַעֲבָדָיו
  choice: le cœur du pharaon et de ses serviteurs changea
  rationale: Cette formulation conserve « cœur », siège hébreu de la pensée et de la volonté, ainsi que le singulier collectif du texte source.
- source_word: אֶל הָעָם
  choice: envers le peuple
  rationale: « Envers » préserve la direction du changement d’attitude sans rendre explicite, dans ce seul syntagme, l’hostilité que le contexte permet d’inférer.
- source_word: מַה זֹּאת עָשִׂינוּ
  choice: Qu’avons-nous fait là ?
  rationale: Expression française naturelle d’alarme et de regret qui garde la force du démonstratif זֹאת.
- source_word: שִׁלַּחְנוּ אֶת יִשְׂרָאֵל
  choice: Nous avons laissé partir Israël
  rationale: « Laisser partir » restitue le sens contextuel de שׁלח et le motif récurrent de l’Exode.
- source_word: מֵעָבְדֵנוּ
  choice: qui ne nous servira plus
  rationale: Cette tournure exprime naturellement la cessation du service indiquée par מן avec עבד, sans introduire explicitement « esclaves » dans le corps du texte.
theological_decisions:
- issue: Portée anthropologique de לְבַב
  choice: cœur
  alternative: pensée / disposition
  rationale: « Cœur » maintient l’image hébraïque et sa portée conjointe sur la pensée et la volonté, sans la réduire à une catégorie psychologique moderne.
- issue: Orientation du changement exprimé par אֶל הָעָם
  choice: envers le peuple
  alternative: contre le peuple
  rationale: Le contexte indique une attitude hostile, mais « envers » conserve l’ambiguïté lexicale de la préposition et évite de l’expliciter excessivement.
- issue: Statut d’Israël dans מֵעָבְדֵנוּ
  choice: qui ne nous servira plus
  alternative: que nous avons libéré de notre service / de l’esclavage
  rationale: Le contexte général est bien celui de l’asservissement, mais la proposition elle-même exprime la cessation du service; la traduction principale reste donc proche de cette formulation.
translation_notes:
  register: Français international moderne, narratif et digne. « Pharaon » prend l’article conformément à l’usage français courant lorsqu’il fonctionne comme titre. La ponctuation scinde la longue coordination hébraïque pour assurer une lecture naturelle, sans supprimer son enchaînement logique.
