source:
  edition: WLC
  text: וַֽ/יְהִי֙ בְּ/אַשְׁמֹ֣רֶת הַ/בֹּ֔קֶר וַ/יַּשְׁקֵ֤ף יְהוָה֙ אֶל מַחֲנֵ֣ה מִצְרַ֔יִם בְּ/עַמּ֥וּד אֵ֖שׁ וְ/עָנָ֑ן וַ/יָּ֕הָם אֵ֖ת מַחֲנֵ֥ה מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/024.yaml
  text: And in the morning watch[a], Yahweh looked down on the camp of the Egyptians through the pillar of fire and cloud[b], and threw the camp of the Egyptians into confusion.
translation:
  language: fr
  text: Au cours de la veille du matin, Yahweh regarda d’en haut le camp des Égyptiens depuis la colonne de feu et de nuée[a], puis il sema la confusion dans le camp des Égyptiens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au moyen de la colonne de feu et de nuée ».
    reason: La préposition hébraïque peut indiquer soit le lieu depuis lequel Yahweh regarde, soit le moyen par lequel il agit.
  - marker: b
    text: Ou « sema la panique dans le camp des Égyptiens ».
    reason: Le verbe hébreu peut évoquer aussi bien la confusion tumultueuse que la panique.
lexical_decisions:
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  choice: pendant la veille du matin
  rationale: L’expression désigne la période de garde située à la fin de la nuit. « La veille du matin » conserve cette précision temporelle sans l’expliciter au-delà du texte.
- source_word: וַיַּשְׁקֵף
  choice: regarda d’en haut
  rationale: Dans cette forme, שׁקף évoque un regard porté depuis une position élevée. Cette formulation restitue la perspective sans suggérer un simple coup d’œil.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la présence explicite du tétragramme dans le texte hébreu.
- source_word: מַחֲנֵה מִצְרַיִם
  choice: le camp des Égyptiens
  rationale: Cette formulation naturelle en français désigne clairement le camp militaire égyptien tout en restant proche de la construction hébraïque.
- source_word: בְּעַמּוּד אֵשׁ וְעָנָן
  choice: depuis la colonne de feu et de nuée
  rationale: La préposition בְּ peut ici être locative ou instrumentale. « Depuis » exprime naturellement le lieu d’où Yahweh regarde, tandis qu’une note conserve l’autre possibilité.
- source_word: וַיָּהָם
  choice: sema la confusion dans
  rationale: Le verbe exprime l’action de provoquer tumulte, désordre ou panique. « Sema la confusion » garde la valeur causative sans anticiper une déroute complète.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte emploie directement le nom personnel divin. « Yahweh » le préserve au lieu de lui substituer un titre.
- issue: Nature du trouble infligé au camp égyptien
  choice: sema la confusion
  alternative: sema la panique
  rationale: הום peut désigner la confusion comme la panique. Le texte n’oblige pas à choisir un état psychologique précis; le corps du verset retient donc le terme plus large, et la note signale l’autre nuance.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination avec « puis » rend clairement la succession narrative. « Colonne de feu et de nuée » conserve le singulier hébreu et l’unité du signe, tandis que les notes maintiennent les ambiguïtés lexicales réelles.
