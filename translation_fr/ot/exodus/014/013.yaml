base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/013.yaml
  text: And Moses said to the people, “Do not fear. Stand firm, and see the salvation of the LORD, which he will accomplish for you today; for the Egyptians whom you see today, you will never see again forever.”
translation:
  language: fr
  text: 'Moïse dit au peuple : « N’ayez pas peur. Restez fermes et voyez le salut de l’Éternel, qu’il accomplira pour vous aujourd’hui. Car les Égyptiens que vous voyez aujourd’hui, vous ne les reverrez plus jamais. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּירָאוּ
  choice: N’ayez pas peur
  rationale: Expression française naturelle qui rend directement l’interdiction au pluriel.
- source_word: הִתְיַצְבוּ
  choice: Tenez ferme
  rationale: Conserve l’idée de prendre position et de ne pas céder, dans une formulation française claire et digne.
- source_word: יְשׁוּעַת יְהוָה
  choice: le salut que l’Éternel accomplira
  rationale: « Salut » préserve le terme théologique et concret de délivrance; la proposition relative française articule naturellement ce salut avec le verbe suivant. « L’Éternel » est la représentation française traditionnelle du tétragramme.
- source_word: מִצְרַיִם
  choice: les Égyptiens
  rationale: Dans ce contexte, le nom géographique désigne par métonymie les forces égyptiennes visibles, comme le confirme le pronom pluriel suffixé de לִרְאֹתָם.
- source_word: עַד עוֹלָם
  choice: plus jamais
  rationale: Rend idiomatiquement la négation renforcée portant sur toute la durée future, sans suggérer que les personnes présentes vivraient éternellement.
theological_decisions:
- issue: Nature du salut de YHWH
  choice: Conserver « salut » plutôt que réduire à « délivrance »
  alternative: la délivrance accordée par l’Éternel
  rationale: Le contexte est une délivrance historique et concrète, mais le lexème ישועה porte la notion plus large de salut; il convient de préserver cette portée sans l’expliciter davantage.
- issue: Sujet de יַעֲשֶׂה
  choice: « que l’Éternel accomplira »
  alternative: « qu’il accomplira »
  rationale: Le sujet grammatical est naturellement YHWH; le répéter en français évite une ambiguïté référentielle tout en restant fidèle à la syntaxe.
translation_notes:
  register: Français international moderne, accessible et solennel. Ponctuation et discours direct naturels; tutoiement collectif rendu par le pluriel. Aucun archaïsme inutile.
