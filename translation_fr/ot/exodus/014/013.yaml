  to: 'Moïse dit au peuple : « N’ayez pas peur. Restez fermes et voyez le salut de l’Éternel, qu’il accomplira pour vous aujourd’hui. Car les Égyptiens que vous voyez aujourd’hui, vous ne les reverrez plus jamais. »'
