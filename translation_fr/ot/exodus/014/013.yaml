    rationale: Cette formulation est intelligible, mais la révision rétablit plus directement la construction du texte source et maintient le pronom dont l’antécédent est l’Éternel.
  - severity: low
    issue: « Tenez ferme » est un peu moins naturel que « Restez fermes » dans le français international contemporain.
    rationale: Les deux sont fidèles à הִתְיַצְבוּ (« prenez position / tenez-vous là, fermes »), mais « Restez fermes » est plus fluide sans modifier le sens.
