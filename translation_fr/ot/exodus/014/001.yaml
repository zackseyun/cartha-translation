lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Puis … parla
  rationale: Le wayyiqtol fait progresser le récit et marque ici la succession; « Puis » restitue cette valeur narrative, tandis que « parla » convient à la formule solennelle introduisant une parole divine.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Le texte porte directement le tétragramme YHWH. « Yahweh » en propose une transcription française courante sans le remplacer dans le corps du texte par un titre.
- source_word: אֶל מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל désigne le destinataire de la parole; « à Moïse » est l’expression naturelle en français moderne.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Cette formule infinitive introduit le contenu du discours. « En ces termes » évite le calque peu naturel « disant » tout en conservant sa fonction introductive.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: « Yahweh » maintient le nom propre présent dans l’hébreu. Une note signale sa forme consonantique YHWH et les principaux rendus possibles sans imposer une tradition confessionnelle.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « en ces termes » restitue naturellement la formule hébraïque d’introduction du discours; les deux-points annoncent la parole qui suit.
