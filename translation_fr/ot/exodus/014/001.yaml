  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: fr
  text: 'Puis Yahweh[a] parla à Moïse en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, souvent rendu par « le SEIGNEUR » ou « Jéhovah ».'
