revisions:
- from: Alors l’ange de Dieu[a], qui marchait devant le camp d’Israël, changea de position et passa derrière eux. La colonne de nuée quitta elle aussi sa place devant eux et se tint derrière eux.
  to: Alors l’ange de Dieu[a], qui marchait devant le camp d’Israël, se déplaça et alla derrière eux ; la colonne de nuée quitta sa position devant eux et se tint derrière eux.
  rationale: La révision rend les deux verbes successifs concernant l’ange par « se déplaça et alla », évite l’ambiguïté possible de « passa derrière », et retire l’explicitation « elle aussi ». Elle maintient l’imparfait duratif de la relative, les contrastes spatiaux « devant » / « derrière », ainsi que l’ambiguïté lexicale de מַלְאָךְ.
