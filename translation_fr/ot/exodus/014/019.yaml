  text: וַ/יִּסַּ֞ע מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים הַ/הֹלֵךְ֙ לִ/פְנֵי֙ מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יֵּ֖לֶךְ מֵ/אַחֲרֵי/הֶ֑ם וַ/יִּסַּ֞ע עַמּ֤וּד הֶֽ/עָנָן֙ מִ/פְּנֵי/הֶ֔ם וַ/יַּֽעֲמֹ֖ד מֵ/אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/019.yaml
  text: Then the angel of God[a], who had been going before the camp of Israel, moved and went behind them; and the pillar of cloud moved from before them and stood behind them.
translation:
  language: fr
  text: Alors l’ange de Dieu[a], qui marchait devant le camp d’Israël, se déplaça et alla derrière eux ; la colonne de nuée quitta sa position devant eux et se tint derrière eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le messager de Dieu ». Le mot hébreu peut avoir les deux sens.
    reason: Alternative lexicale
lexical_decisions:
- source_word: וַיִּסַּע
  choice: changea de position / quitta sa place
  rationale: Le verbe נסע peut signifier lever le camp ou partir, mais il décrit ici le déplacement de l’ange puis de la colonne d’une position à une autre. Ces formulations rendent clairement ce mouvement spatial en français naturel.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: l’ange de Dieu
  rationale: מַלְאָךְ peut désigner un ange ou un messager. « L’ange de Dieu » est ici la formulation traditionnelle et naturelle, sans préciser davantage l’identité ou la nature de cette figure.
- source_word: הַהֹלֵךְ
  choice: qui marchait
  rationale: Le participe exprime une action continue antérieure au changement de position. L’imparfait français restitue naturellement cet arrière-plan duratif.
- source_word: לִפְנֵי מַחֲנֵה יִשְׂרָאֵל
  choice: devant le camp d’Israël
  rationale: La préposition est spatiale. « Devant » est précis et idiomatique en français moderne, tandis que « le camp d’Israël » conserve le rapport construit de l’hébreu.
- source_word: וַיֵּלֶךְ מֵאַחֲרֵיהֶם
  choice: passa derrière eux
  rationale: מֵאַחֲרֵי indique ici une position à l’arrière, non une poursuite. « Passa derrière eux » exprime clairement le déplacement vers cette nouvelle position.
- source_word: עַמּוּד הֶעָנָן
  choice: la colonne de nuée
  rationale: Cette formulation consacrée et transparente conserve l’image concrète du guide visible.
- source_word: מִפְּנֵיהֶם
  choice: sa place devant eux
  rationale: Le sens spatial est conservé. L’ajout idiomatique de « sa place » clarifie en français que la colonne abandonne sa position antérieure sans ajouter une nouvelle action au récit.
- source_word: וַיַּעֲמֹד
  choice: se tint
  rationale: עמד signifie se tenir ou rester debout. « Se tint derrière eux » marque sobrement l’établissement de la colonne dans une position fixe.
theological_decisions:
- issue: Identité et nature de מַלְאַךְ הָאֱלֹהִים
  choice: Traduire par « l’ange de Dieu » sans préciser s’il s’agit d’un ange créé, d’une manifestation de Dieu ou d’une christophanie.
  alternative: « le messager de Dieu » ou une formulation explicitement théophanique
  rationale: Le texte nomme cette figure sans en définir ici la nature ontologique. La traduction conserve donc la tension interprétative et n’importe aucune conclusion doctrinale ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition structurante de « devant eux » et « derrière eux » est conservée, tandis que la variation « changea de position / quitta sa place » évite une formulation française artificielle et rend les deux emplois de נסע dans leur contexte.
