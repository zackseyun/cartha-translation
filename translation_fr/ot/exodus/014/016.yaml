  text: וְ/אַתָּ֞ה הָרֵ֣ם אֶֽת מַטְּ/ךָ֗ וּ/נְטֵ֧ה אֶת יָדְ/ךָ֛ עַל הַ/יָּ֖ם וּ/בְקָעֵ֑/הוּ וְ/יָבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/ת֥וֹךְ הַ/יָּ֖ם בַּ/יַּבָּשָֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/016.yaml
  text: But as for you[a], lift up your staff and stretch out your hand over the sea and split it, so that the sons of Israel may go through the midst of the sea on dry ground.
translation:
  language: fr
  text: Mais toi, lève ton bâton et étends ta main au-dessus de la mer, puis fends-la, afin que les fils d’Israël[a] entrent au milieu de la mer sur un sol sec.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites » ou « les enfants d’Israël ». L’hébreu dit littéralement « les fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mais toi
  rationale: La conjonction suivie du pronom indépendant met Moïse en contraste avec le peuple qui vient de recevoir l’ordre d’avancer. « Mais toi » rend cette insistance sans lourdeur.
- source_word: הָרֵם אֶת מַטְּךָ
  choice: lève ton bâton
  rationale: Le hiphil impératif de רום demande d’élever le bâton. « Bâton » est le terme français courant dans le récit de Moïse.
- source_word: וּנְטֵה אֶת יָדְךָ עַל הַיָּם
  choice: et tends la main au-dessus de la mer
  rationale: נטה décrit ici l’action d’étendre la main; עַל situe le geste au-dessus de la mer.
- source_word: וּבְקָעֵהוּ
  choice: puis fends-la
  rationale: בקע signifie fendre ou ouvrir en séparant. « Fends-la » conserve la force concrète du verbe; « puis » rend naturellement la progression des impératifs.
- source_word: וְיָבֹאוּ
  choice: afin que ... entrent
  rationale: Dans la suite des ordres, l’imparfait avec waw exprime le résultat visé. « Afin que » explicite cette relation sans transformer l’énoncé en simple prédiction.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Rendu formel du syntagme masculin hébreu, avec une note indiquant que l’expression désigne collectivement les Israélites.
- source_word: בְּתוֹךְ הַיָּם
  choice: au milieu de la mer
  rationale: בְּתוֹךְ désigne l’intérieur ou le milieu. La formulation préserve l’image spatiale sans ajouter explicitement l’idée de traversée.
- source_word: בַּיַּבָּשָׁה
  choice: sur un sol sec
  rationale: Le nom désigne la terre ferme ou le sol sec par opposition à la mer; cette formulation souligne naturellement l’état miraculeux du passage.
theological_decisions:
- issue: Portée de l’expression בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / les enfants d’Israël
  rationale: La traduction conserve la forme masculine explicite de l’hébreu, tandis que la note précise que l’expression collective englobe le peuple d’Israël.
- issue: Valeur de וְיָבֹאוּ après les impératifs
  choice: afin que ... entrent
  alternative: et ... entreront
  rationale: Le contexte permet une nuance de conséquence ou de but. La formulation retenue suit l’enchaînement intentionnel des ordres sans faire de l’action humaine ou du bâton la source autonome du miracle.
translation_notes:
  register: Français moderne, international et digne. Tutoiement conforme à l’adresse directe singulière à Moïse. Syntaxe claire, verbes concrets, sans archaïsme; l’ambiguïté spatiale de בְּתוֹךְ est préservée par « au milieu de ».
