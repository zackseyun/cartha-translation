    issue: Construction française et référent de l’objet dans « vous lui faites interrompre ses corvées »
    rationale: 'Cette construction suggère que le peuple collectif accomplit lui-même l’interruption. Le texte hébreu emploie un causatif avec le peuple au pluriel comme objet : Pharaon accuse ses interlocuteurs de faire cesser les Israélites de leurs travaux.'
  - severity: low
    issue: Formulation de l’alternative de note « donner du repos loin de ses fardeaux »
    rationale: « Loin de » ne rend pas idiomatiquement la préposition hébraïque « de / hors de » dans ce contexte. « Les faire se reposer de leurs fardeaux » exprime correctement l’alternative.
