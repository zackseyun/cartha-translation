review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : Pharaon souligne le grand nombre du « peuple du pays » et reproche à Moïse et Aaron de le faire cesser de ses travaux. Toutefois, « vous lui faites interrompre ses corvées » est syntaxiquement et sémantiquement moins précis : le hiphil vise les membres du peuple comme objet pluriel (« vous les faites cesser »), non le peuple comme agent qui interromprait lui-même ses tâches.'
  naturalness: « Voyez ! » et « le peuple du pays est maintenant nombreux » sont naturels dans un registre moderne. La formulation révisée « vous les faites cesser de travailler à leurs corvées » est plus idiomatique et conserve clairement la valeur causative.
  terminology: « Corvées » convient dans ce contexte pour les charges de travail imposées, à condition que la note conserve « fardeaux » et « travaux » comme rendus plus proches du lexique hébreu. La note actuelle contient l’expression peu naturelle et imprécise « donner du repos loin de ses fardeaux »; elle est corrigée.
  issues:
