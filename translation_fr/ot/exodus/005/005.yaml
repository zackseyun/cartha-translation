  text: וַ/יֹּ֣אמֶר פַּרְעֹ֔ה הֵן רַבִּ֥ים עַתָּ֖ה עַ֣ם הָ/אָ֑רֶץ וְ/הִשְׁבַּתֶּ֥ם אֹתָ֖/ם מִ/סִּבְלֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/005.yaml
  text: Pharaoh said[a], “Look, the people of the land are now many, and you are making them rest from their burdens.”
translation:
  language: fr
  text: 'Le pharaon dit : « Voyez ! Le peuple du pays est maintenant nombreux, et vous les faites cesser de travailler à leurs corvées.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous les faites cesser de leurs travaux » ou « vous les faites se reposer de leurs fardeaux ». Le verbe hébreu est causatif et peut se traduire par « faire cesser », « faire interrompre » ou « faire se reposer »; « corvées » explicite ici le contexte du travail imposé.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Voyez !
  rationale: Conserve la valeur déictique et emphatique de l’interjection dans un français actuel, sans recourir à l’archaïque « voici ».
- source_word: רַבִּים
  choice: nombreux
  rationale: Rend naturellement l’adjectif quantitatif au pluriel dans cette construction attributive.
- source_word: עַם הָאָרֶץ
  choice: le peuple du pays
  rationale: Préserve l’expression hébraïque sans l’interpréter comme une désignation technique des gens du peuple; dans le contexte, elle vise la population israélite soumise au travail en Égypte.
- source_word: עַתָּה
  choice: maintenant
  rationale: Rend directement l’adverbe temporel qui souligne la situation présente.
- source_word: וְהִשְׁבַּתֶּם
  choice: vous lui faites interrompre
  rationale: Le hiphil de שׁבת exprime ici la causation d’un arrêt. « Faites interrompre » garde cette valeur causative et convient naturellement avec « corvées », sans donner au verbe une connotation nécessairement positive de repos.
- source_word: מִסִּבְלֹתָם
  choice: ses corvées
  rationale: Dans le contexte de l’oppression en Égypte, סִבְלֹת désigne les charges de travail imposées. « Corvées » exprime ce sens en français courant tout en gardant l’idée d’un travail pénible et contraint.
