revisions:
- from: 'Vous leur imposerez le même quota de briques qu’ils fabriquaient hier et avant-hier[a] ; vous ne le diminuerez en rien, car ce sont des paresseux. C’est pourquoi ils crient : « Allons offrir des sacrifices à notre Dieu ! »'
  to: 'Vous leur imposerez le quota de briques qu’ils produisaient hier et avant-hier[a] ; vous n’en diminuerez rien, car ils sont oisifs. C’est pourquoi ils crient en disant : « Allons sacrifier à notre Dieu ! »'
  rationale: 'Révision limitée à des ajustements sûrs de fidélité lexicale et d’idiome français : l’accusation de Pharaon est rendue sans la surmoraliser, le verbe sacrificiel ne reçoit pas un pluriel ajouté, et la relation entre le quota et la production de briques est clarifiée. La note conserve l’alternative idiomatique tout en préservant dans le texte l’expression temporelle hébraïque.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:12:23Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : l’ordre maintient la quantité imposée, l’accusation de Pharaon motive cet ordre, et les cohortatifs expriment l’appel à aller sacrifier. Toutefois, « paresseux » durcit et moralise davantage נִרְפִּים que ne le requiert l’accusation de « relâchement » ou d’oisiveté. « Offrir des sacrifices » introduit en outre un pluriel qui n’est pas exprimé par le verbe hébreu.'
  naturalness: La phrase est fluide en français moderne. « Le quota de briques qu’ils produisaient » est toutefois plus idiomatique et plus précis que « le même quota de briques qu’ils fabriquaient », où des ouvriers semblent fabriquer un quota plutôt que produire des briques selon un quota.
  terminology: « Quota », « briques » et « imposerez » conviennent au contexte administratif coercitif. « Ils sont oisifs » rend bien l’accusation de Pharaon sans transformer indûment celle-ci en jugement moral narratif. « Sacrifier à notre Dieu » conserve l’action cultuelle sans imposer un nombre de sacrifices.
  issues:
  - severity: medium
    issue: « ce sont des paresseux »
    rationale: נִרְפִּים signifie ici relâchés, non occupés ou insuffisamment appliqués selon l’accusation de Pharaon. « Paresseux » est plus moralement chargé et plus catégorique. « Ils sont oisifs » est plus proche du sens contextuel.
  - severity: low
    issue: « offrir des sacrifices »
    rationale: Le pluriel « des sacrifices » n’est pas exigé par נִזְבְּחָה. « Sacrifier à notre Dieu » exprime naturellement en français l’action cultuelle sans ajouter ce pluriel.
  - severity: low
    issue: « le même quota de briques qu’ils fabriquaient »
    rationale: La construction est compréhensible, mais « quota » désigne la quantité exigée, non l’objet fabriqué. « Le quota de briques qu’ils produisaient » est plus naturel et maintient le lien avec la production prescrite.
  revised_text: 'Vous leur imposerez le quota de briques qu’ils produisaient hier et avant-hier[a] ; vous n’en diminuerez rien, car ils sont oisifs. C’est pourquoi ils crient en disant : « Allons sacrifier à notre Dieu ! »'
  revised_footnotes:
