base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/008.yaml
  text: And the quota of bricks that they were making yesterday and the day before[a], you shall impose on them; you shall not reduce any of it, because they are idle. Therefore they are crying out, saying, ‘Let us go and sacrifice to our God.’
translation:
  language: fr
  text: 'Vous leur imposerez le quota de briques qu’ils produisaient hier et avant-hier[a] ; vous n’en diminuerez rien, car ils sont oisifs. C’est pourquoi ils crient en disant : « Allons sacrifier à notre Dieu ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus idiomatique : « auparavant » ou « comme avant ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתְכֹּנֶת
  choice: quota
  rationale: Dans ce contexte de travail forcé, le nom désigne la quantité prescrite de briques à produire. « Quota » est précis, courant et s’accorde avec l’interdiction de le diminuer.
- source_word: הַלְּבֵנִים
  choice: briques
  rationale: Équivalent concret et direct dans le contexte de la fabrication de briques.
- source_word: תְּמוֹל שִׁלְשֹׁם
  choice: hier et avant-hier
  rationale: Cette traduction conserve l’expression hébraïque formée de deux indications temporelles, tout en restant naturelle en français. Dans l’usage, elle peut aussi avoir le sens plus général d’« auparavant ».
- source_word: תָּשִׂימוּ עֲלֵיהֶם
  choice: vous leur imposerez
  rationale: L’expression signifie mettre une obligation à la charge des ouvriers ; « imposer » restitue clairement la contrainte administrative.
- source_word: לֹא תִגְרְעוּ מִמֶּנּוּ
  choice: vous ne le diminuerez en rien
  rationale: Le verbe exprime l’action de retrancher ou de réduire ; la formulation indique qu’aucune partie du quota ne doit être supprimée.
- source_word: נִרְפִּים
  choice: paresseux
  rationale: Dans l’accusation de Pharaon, le terme qualifie les Israélites de relâchés ou désœuvrés. « Paresseux » rend naturellement la dureté de cette accusation, sans l’approuver comme jugement du narrateur.
- source_word: צֹעֲקִים
  choice: ils crient
  rationale: Le participe désigne un appel poussé avec force. « Ils crient » est direct et introduit naturellement les paroles rapportées.
- source_word: נֵלְכָה נִזְבְּחָה
  choice: Allons offrir des sacrifices
  rationale: Les deux cohortatifs expriment une exhortation ou une résolution collective. Cette formulation est idiomatique en français et conserve les deux actions.
- source_word: לֵאלֹהֵינוּ
  choice: à notre Dieu
  rationale: La préposition indique le destinataire des sacrifices.
