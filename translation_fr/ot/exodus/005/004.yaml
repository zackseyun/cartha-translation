  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ מֶ֣לֶךְ מִצְרַ֔יִם לָ֚/מָּה מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן תַּפְרִ֥יעוּ אֶת הָ/עָ֖ם מִ/מַּֽעֲשָׂ֑י/ו לְכ֖וּ לְ/סִבְלֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/004.yaml
  text: But the king of Egypt said to them[a], “Why, Moses and Aaron[b], are you causing the people to neglect their work? Go to your burdens.”
translation:
  language: fr
  text: 'Mais le roi d’Égypte leur dit : « Pourquoi, Moïse et Aaron, détournez-vous le peuple de son travail[a] ? Allez à vos corvées[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « interrompez-vous le peuple dans son travail » ou « empêchez-vous le peuple de travailler ».
    reason: lexical_alternative
  - marker: b
    text: Ou « à vos fardeaux » ; le terme peut désigner des charges pénibles ou le travail forcé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mais ... dit
  rationale: Le waw consécutif fait avancer le récit, tandis que « Mais » exprime naturellement l’opposition entre la demande précédente de Moïse et Aaron et la réponse du roi.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: le roi d’Égypte
  rationale: Rend directement et naturellement la construction hébraïque.
- source_word: לָמָּה
  choice: Pourquoi
  rationale: Conserve la question directe dans une formulation française simple.
- source_word: תַּפְרִיעוּ
  choice: détournez-vous
  rationale: Le hiphil de פרע exprime ici le fait d’éloigner ou d’interrompre le peuple dans son activité. « Détourner de » garde la valeur causative sans préciser excessivement le type d’interruption.
- source_word: הָעָם
  choice: le peuple
  rationale: Conserve la désignation collective du texte hébreu plutôt que de la réduire aux seuls travailleurs.
- source_word: מִמַּעֲשָׂיו
  choice: de son travail
  rationale: Le suffixe hébreu est au singulier et reprend le collectif « le peuple » ; le singulier est naturel en français et respecte cette construction.
- source_word: לְכוּ
  choice: Retournez
  rationale: Dans ce contexte, l’impératif ordonne à Moïse et Aaron de reprendre les obligations auxquelles le roi les assigne. « Retournez » rend ce mouvement implicite plus naturellement que le seul « Allez ».
- source_word: לְסִבְלֹתֵיכֶם
  choice: à vos corvées
  rationale: סבלות désigne des charges ou travaux pénibles imposés. « Corvées » communique en français actuel l’idée d’un travail obligatoire et oppressif, tout en gardant « fardeaux » comme possibilité plus concrète en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La réplique demeure brève et autoritaire. « Corvées » exprime clairement le caractère imposé du travail, tandis que la note conserve la métaphore concrète des fardeaux.
