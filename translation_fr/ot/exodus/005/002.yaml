source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פַּרְעֹ֔ה מִ֤י יְהוָה֙ אֲשֶׁ֣ר אֶשְׁמַ֣ע בְּ/קֹל֔/וֹ לְ/שַׁלַּ֖ח אֶת יִשְׂרָאֵ֑ל לֹ֤א יָדַ֨עְתִּי֙ אֶת יְהוָ֔ה וְ/גַ֥ם אֶת יִשְׂרָאֵ֖ל לֹ֥א אֲשַׁלֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/002.yaml
  text: Pharaoh said[a], “Who is Yahweh, that I should obey his voice and let Israel go? I do not know Yahweh, and moreover I will not let Israel go.”
translation:
  language: fr
  text: 'Le pharaon répondit : « Qui est Yahweh[a], pour que je lui obéisse et laisse partir Israël ? Je ne connais pas Yahweh et je ne laisserai pas non plus partir Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, le tétragramme, traditionnellement rendu par « le SEIGNEUR ». On trouve aussi les formes « Yahvé » et « Jéhovah ».'
    reason: Signaler le tétragramme et les principales conventions françaises de transcription ou de substitution.
lexical_decisions:
- source_word: פַּרְעֹה
  choice: le pharaon
  rationale: Le titre royal est rendu par sa forme française usuelle, avec l’article défini naturel dans ce contexte narratif.
- source_word: מִי יְהוָה
  choice: Qui est Yahweh
  rationale: מִי interroge l’identité. La formulation conserve le caractère provocateur et méprisant de la question du pharaon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve ici le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֲשֶׁר אֶשְׁמַע בְּקֹלוֹ
  choice: pour que j’écoute sa voix
  rationale: שׁמע בְּקוֹל peut signifier écouter, prêter attention ou obéir. La traduction conserve l’image hébraïque de la voix ainsi que l’ambiguïté entre écoute et obéissance, tout en étant idiomatique en français.
- source_word: לְשַׁלַּח אֶת יִשְׂרָאֵל
  choice: laisse partir Israël
  rationale: Dans ce contexte, laisser partir exprime naturellement l’autorisation ou la libération exigée du pharaon.
- source_word: לֹא יָדַעְתִּי
  choice: Je ne connais pas
  rationale: Le parfait négatif exprime ici la position présente du pharaon. Connaître permet de garder ouverte la nuance entre ignorance déclarée et refus de reconnaître l’autorité de Yahweh.
- source_word: וְגַם
  choice: et ... non plus
  rationale: La construction française avec non plus ajoute la seconde négation avec l’insistance appropriée, sans lourdeur.
- source_word: אֲשַׁלֵּחַ
  choice: je ne laisserai pas ... partir
  rationale: Le futur français rend la résolution exprimée par l’imparfait hébreu dans cette réponse immédiate.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française standard du nom du peuple.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. Yahweh signale qu’il s’agit d’un nom personnel et non simplement d’un titre, tandis que la note indique la convention traditionnelle.
- issue: Portée de « connaître » dans la déclaration du pharaon
  choice: Je ne connais pas Yahweh
  alternative: Je ne reconnais pas Yahweh
  rationale: Le verbe ידע signifie littéralement connaître, mais peut comporter ici une nuance de reconnaissance ou d’acceptation de l’autorité. La traduction principale ne tranche pas cette tension.
- issue: Sens de שׁמע בְּקוֹל
  choice: j’écoute sa voix
  alternative: je lui obéisse
  rationale: L’expression implique souvent l’obéissance. Conserver l’expression concrète « écouter sa voix » maintient cependant l’idiome hébreu et n’explicite pas davantage que la source.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct reste ferme et provocateur. « Le pharaon » suit l’usage français courant ; « laisse partir » convient au contexte de l’Exode. La répétition d’Israël et de Yahweh est conservée pour respecter l’insistance de l’hébreu.
