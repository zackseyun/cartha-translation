source:
  edition: WLC
  text: וְ/אַחַ֗ר בָּ֚אוּ מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן וַ/יֹּאמְר֖וּ אֶל פַּרְעֹ֑ה כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שַׁלַּח֙ אֶת עַמִּ֔/י וְ/יָחֹ֥גּוּ לִ֖/י בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/001.yaml
  text: 'Afterward Moses and Aaron went in and said to Pharaoh[a], “Thus says Yahweh, the God of Israel: Let my people go[b], so that they may hold a feast to me in the wilderness.”'
translation:
  language: fr
  text: 'Après cela, Moïse et Aaron se rendirent auprès du pharaon et lui dirent : « Voici ce que dit Yahweh, le Dieu d’Israël : Laisse partir mon peuple, afin qu’ils célèbrent une fête pour moi dans le désert. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחַר
  choice: Après cela
  rationale: Marque naturellement la progression du récit sans préciser la durée de l’intervalle.
- source_word: בָּאוּ
  choice: se rendirent auprès du pharaon
  rationale: Dans ce contexte d’audience royale, le verbe indique que Moïse et Aaron se présentent devant le pharaon; cette formulation est naturelle en français sans ajouter explicitement une entrée absente du verbe seul.
- source_word: וַיֹּאמְרוּ אֶל־פַּרְעֹה
  choice: et lui dirent
  rationale: Rend simplement la formule narrative de parole, le référent du pronom étant explicite dans la proposition précédente.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Formule française actuelle et digne qui conserve l’autorité de la formule hébraïque du messager.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel représenté par le tétragramme, plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rendu transparent de la construction hébraïque qui identifie Yahweh comme le Dieu d’Israël.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Laisse partir mon peuple
  rationale: 'Exprime clairement l’impératif adressé au pharaon: il doit permettre au peuple de s’en aller.'
- source_word: וְיָחֹגּוּ לִי
  choice: afin qu’il célèbre une fête en mon honneur
  rationale: Le verbe désigne la célébration d’une fête, probablement cultuelle ou de pèlerinage; « en mon honneur » rend naturellement לִי sans suggérer que la fête est donnée matériellement à Dieu.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: En français moderne, « désert » désigne naturellement la région inhabitée où Israël doit se rendre, sans imposer nécessairement l’idée de dunes de sable.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel dans le corps du texte sans le remplacer par un titre.
- issue: Finalité cultuelle exprimée par חגג
  choice: célèbre une fête en mon honneur
  alternative: tienne une fête pour moi; fasse un pèlerinage pour moi
  rationale: La traduction conserve la dimension festive et cultuelle du verbe sans déterminer plus précisément que le texte la forme exacte de la célébration.
translation_notes:
  register: Français international moderne, narratif et digne. La formule « Voici ce que dit » reste solennelle tout en étant plus naturelle aujourd’hui que « Ainsi parle ». Le nom « pharaon » est employé avec l’article selon l’usage français courant.
