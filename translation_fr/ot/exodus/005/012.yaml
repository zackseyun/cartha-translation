  text: So the people were scattered throughout all the land of Egypt to gather stubble for straw[a].
translation:
  language: fr
  text: Le peuple se dispersa donc dans tout le pays d’Égypte pour ramasser du chaume en guise de paille[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, si קַשׁ et תֶּבֶן ne désignent pas ici deux matières nettement distinctes : « pour ramasser de quoi remplacer la paille ». Le texte retient la distinction probable entre le chaume ramassé et la paille habituellement fournie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּפֶץ
  choice: se dispersa
  rationale: Le verbe פוץ décrit ici la dispersion du peuple sur une vaste étendue. Le pronominal français « se dispersa » exprime naturellement le mouvement collectif sans perdre l’idée que la mesure de Pharaon l’a provoqué.
- source_word: הָעָם
  choice: le peuple
  rationale: עם désigne collectivement le peuple, ici la main-d’œuvre israélite. « Le peuple » est simple, digne et ne précise pas davantage que l’hébreu.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: dans tout le pays d’Égypte
  rationale: Cette formulation rend la portée étendue de בְּכָל et correspond à l’expression française courante pour le territoire égyptien.
- source_word: לְקֹשֵׁשׁ
  choice: pour ramasser
  rationale: קשש signifie recueillir ou ramasser des éléments épars, notamment de petits débris végétaux. « Ramasser » convient précisément à l’action décrite.
- source_word: קַשׁ
  choice: du chaume
  rationale: 'Puisque קַשׁ et תֶּבֶן figurent dans la même proposition, « chaume » maintient leur distinction probable : le peuple recueille des restes de tiges comme matériau de remplacement.'
- source_word: לַתֶּבֶן
  choice: en guise de paille
  rationale: 'La préposition ל exprime vraisemblablement ici la fonction ou la substitution : le chaume ramassé doit servir de paille pour la fabrication des briques. « En guise de paille » rend cette nuance clairement et naturellement.'
