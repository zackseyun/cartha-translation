base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/011.yaml
  text: You yourselves[a], go and get straw for yourselves wherever you can find it[b], for nothing of your work will be reduced.
translation:
  language: fr
  text: Vous, allez chercher vous-mêmes de la paille là où vous en trouverez[a], car votre travail ne sera en rien réduit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « de là où vous en trouverez » ou « de n’importe où vous en trouverez ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « car rien n’est diminué de votre travail ». Le verbe hébreu est à l’imparfait passif ; selon le contexte, la formule peut être rendue au présent ou au futur.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: אַתֶּם
  choice: Vous,
  rationale: Le pronom indépendant placé avant les impératifs est emphatique. La dislocation « Vous, » conserve cette insistance de façon naturelle en français.
- source_word: לְכוּ קְחוּ
  choice: allez chercher
  rationale: La succession des deux impératifs signifie littéralement « allez, prenez ». Dans ce contexte d’approvisionnement, « allez chercher » rend naturellement l’ordre donné sans en affaiblir la force.
- source_word: לָכֶם
  choice: vous-mêmes
  rationale: Le datif souligne que les Israélites doivent désormais se procurer eux-mêmes la matière nécessaire. « vous-mêmes » restitue cette responsabilité imposée, tout en complétant l’emphase initiale.
- source_word: תֶּבֶן
  choice: de la paille
  rationale: Dans le contexte de la fabrication des briques, תֶּבֶן désigne la paille servant de matériau; « paille » est le terme français précis et courant.
- source_word: מֵאֲשֶׁר תִּמְצָאוּ
  choice: là où vous en trouverez
  rationale: La tournure indique toute provenance disponible. Cette formulation est naturelle en français et garde le caractère indéterminé du lieu.
- source_word: כִּי
  choice: car
  rationale: 'כִּי introduit ici la raison ou la condition qui motive l’ordre: les ouvriers doivent trouver eux-mêmes la paille puisque leur travail imposé ne sera pas diminué. « car » préserve plus directement cette valeur causale, même si une nuance de contraste ressort du contexte.'
- source_word: אֵין נִגְרָע
  choice: ne sera en rien réduit
  rationale: La construction négative avec le participe passif exprime qu’aucune réduction n’est accordée. Le futur convient au contexte directif et « en rien » reprend la négation renforcée par דָּבָר.
- source_word: מֵעֲבֹדַתְכֶם
  choice: votre travail
  rationale: עֲבֹדָה désigne ici le travail exigé des Israélites. « votre travail » est clair et n’introduit pas la connotation cultuelle que pourrait porter « service ».
- source_word: דָּבָר
  choice: en rien
  rationale: Dans la construction négative, דָּבָר signifie « quoi que ce soit » ou « une seule chose ». L’expression française « ne sera en rien réduit » en rend la force idiomatiquement.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. La dislocation initiale « Vous, » et « vous-mêmes » maintiennent l’insistance du texte hébreu. « Car » conserve la relation causale explicite, tandis que la dureté contrastive de l’ordre demeure perceptible dans le contexte.
