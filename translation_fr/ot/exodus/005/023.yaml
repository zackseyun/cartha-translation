  text: וּ/מֵ/אָ֞ז בָּ֤אתִי אֶל פַּרְעֹה֙ לְ/דַבֵּ֣ר בִּ/שְׁמֶ֔/ךָ הֵרַ֖ע לָ/עָ֣ם הַ/זֶּ֑ה וְ/הַצֵּ֥ל לֹא הִצַּ֖לְתָּ אֶת עַמֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/023.yaml
  text: For since I came to Pharaoh to speak in your name[a], he has done evil to this people[c][b], and you have certainly not delivered your people.
translation:
  language: fr
  text: Car depuis que je suis allé trouver le pharaon pour parler en ton nom, il a fait du mal à ce peuple, et tu n’as vraiment pas délivré ton peuple.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il a aggravé la situation de ce peuple, et tu n’as absolument pas délivré ton peuple ». L’hébreu renforce la dernière négation par la répétition de la racine verbale : littéralement, « délivrer, tu n’as pas délivré ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵאָז
  choice: Car depuis que
  rationale: מֵאָז marque le point de départ temporel (« depuis lors/depuis que »), tandis que וּ introduit ici la justification de la plainte précédente; « Car depuis que » rend naturellement les deux valeurs.
- source_word: בָּאתִי אֶל־פַּרְעֹה
  choice: je suis allé trouver le pharaon
  rationale: Le verbe בוא avec אֶל exprime le déplacement vers le pharaon. En français, « aller trouver » est plus naturel ici que le calque « venir vers », tout en conservant l’idée de comparution auprès de lui.
- source_word: לְדַבֵּר בִּשְׁמֶךָ
  choice: pour parler en ton nom
  rationale: L’infinitif exprime le but. « En ton nom » conserve l’image hébraïque et sa portée de représentation et d’autorité.
- source_word: הֵרַע לָעָם הַזֶּה
  choice: il a fait du mal à ce peuple
  rationale: Le hiphil de רעע peut signifier faire du mal ou rendre la situation pire. « Faire du mal » préserve la dimension morale et le préjudice causé sans imposer une seule nuance contextuelle.
- source_word: וְהַצֵּל לֹא הִצַּלְתָּ
  choice: et tu n’as vraiment pas délivré
  rationale: L’infinitif absolu הַצֵּל associé au verbe conjugué intensifie la négation. « Vraiment pas » exprime cette insistance en français courant et digne.
- source_word: אֶת־עַמֶּךָ
  choice: ton peuple
  rationale: Rendu direct du complément d’objet, maintenant le contraste entre « ce peuple » et « ton peuple ».
theological_decisions:
- issue: Intensification de la négation dans la plainte de Moïse
  choice: tu n’as vraiment pas délivré ton peuple
  alternative: tu n’as absolument pas délivré ton peuple
  rationale: La construction infinitif absolu + verbe conjugué renforce nettement la négation. « Vraiment pas » garde la vigueur de la plainte sans donner à la formulation un ton artificiel.
- issue: Portée de בִּשְׁמֶךָ
  choice: en ton nom
  alternative: de ta part / avec ton autorité
  rationale: La traduction littérale est naturelle en français et préserve à la fois l’idée de représentation et la portée théologique du nom divin.
- issue: Sens de הֵרַע
  choice: il a fait du mal à ce peuple
  alternative: il a aggravé la situation de ce peuple
  rationale: L’hébreu permet une lecture morale (« faire du mal ») et une lecture résultative (« rendre la situation pire »). Le texte principal retient la première, tandis que la note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe de Moïse à Dieu. « Le pharaon » suit l’usage français courant du titre. La note conserve l’ambiguïté de הֵרַע et explique l’intensification hébraïque.
