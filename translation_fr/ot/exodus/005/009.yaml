  text: Let the work be heavy on the men[a], so that they may labor at it and not pay attention to lying words.
translation:
  language: fr
  text: Que le travail pèse lourdement sur les hommes, afin qu’ils y travaillent et qu’ils ne prêtent pas attention à des paroles mensongères[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « à des paroles trompeuses » ; ou : « qu’ils ne tiennent pas compte de paroles fausses ». C’est ainsi que Pharaon qualifie les paroles de Moïse et d’Aaron. Le verbe hébreu peut signifier « prêter attention à », « considérer » ou « tenir compte de ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכְבַּד
  choice: pèse lourdement
  rationale: Le qal à valeur directive signifie littéralement que le travail doit être lourd. Cette tournure française conserve l’image du poids imposé sans transformer explicitement le verbe en causatif.
- source_word: הָעֲבֹדָה
  choice: le travail
  rationale: Dans le contexte de la fabrication forcée de briques, « travail » rend naturellement le labeur imposé.
- source_word: עַל הָאֲנָשִׁים
  choice: sur ces hommes
  rationale: « Sur » préserve l’image d’une charge pesant sur eux; « ces hommes » désigne naturellement le groupe masculin de travailleurs visé dans le contexte.
- source_word: וְיַעֲשׂוּ בָהּ
  choice: afin qu’ils s’y consacrent
  rationale: 'Le verbe עשה avec בָהּ signifie qu’ils doivent faire ce travail ou s’y employer. « S’y consacrent » exprime ici le but recherché: les absorber dans leur tâche, sans ajouter l’idée qu’ils l’accompliront nécessairement.'
- source_word: וְאַל יִשְׁעוּ
  choice: et ne prêtent pas attention
  rationale: Le verbe שעה peut signifier regarder vers, considérer ou prêter attention. La formulation retenue est claire et garde cette amplitude sémantique.
- source_word: בְּדִבְרֵי שָׁקֶר
  choice: à des paroles mensongères
  rationale: דִּבְרֵי désigne ici des paroles, et שָׁקֶר les qualifie, du point de vue de Pharaon, de fausses ou trompeuses.
theological_decisions:
- issue: Statut des paroles de Moïse et d’Aaron
  choice: Traduire directement l’accusation de Pharaon par « paroles mensongères »
  alternative: « paroles vaines » ou « paroles trompeuses »
  rationale: Le narrateur rapporte l’ordre de Pharaon sans valider son jugement. Une note précise ce point de vue afin de ne pas présenter implicitement l’accusation comme vraie.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve l’image hébraïque du travail qui pèse sur les hommes. Le marqueur de note est placé immédiatement après l’expression qu’il éclaire.
