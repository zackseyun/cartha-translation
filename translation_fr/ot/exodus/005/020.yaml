  yaml_path: translation/ot/exodus/005/020.yaml
  text: They met Moses and Aaron[a], who were standing to meet them when they came out from Pharaoh.
translation:
  language: fr
  text: Ils rencontrèrent Moïse et Aaron[a], qui se tenaient là pour les rencontrer lorsqu’ils sortirent de chez le pharaon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tombèrent sur Moïse et Aaron ». Dans certains contextes, le verbe peut aussi évoquer une confrontation, mais le texte principal conserve le sens plus général de « rencontrer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגְּעוּ
  choice: Ils rencontrèrent
  rationale: Le verbe פגע signifie ici « rencontrer » ou « tomber sur ». Le contexte suivant est tendu, mais le verbe lui-même n’impose pas l’idée d’une confrontation hostile.
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: Moïse et Aaron
  rationale: Les marqueurs de l’objet direct ne sont pas rendus en français; les formes françaises usuelles des noms bibliques sont conservées.
- source_word: נִצָּבִים
  choice: qui se tenaient là
  rationale: Le participe exprime une position maintenue. « Se tenaient là » décrit naturellement Moïse et Aaron présents sur place dans l’attente des contremaîtres.
- source_word: לִקְרָאתָם
  choice: pour les attendre
  rationale: L’expression indique que Moïse et Aaron se tenaient en direction des hommes afin de les rencontrer. Dans ce contexte statique, « pour les attendre » évite la répétition de « rencontrer » et rend naturellement la scène sans lui ajouter une nuance hostile.
- source_word: בְּצֵאתָם
  choice: à leur sortie
  rationale: L’infinitif construit précédé de בְּ exprime la circonstance temporelle; « à leur sortie » en donne une formulation française concise et claire.
- source_word: מֵאֵת פַּרְעֹה
  choice: de chez le pharaon
  rationale: מֵאֵת marque l’éloignement d’une personne, c’est-à-dire le fait de sortir de sa présence. « De chez le pharaon » est idiomatique en français moderne et convient à la sortie d’une audience.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique. L’article dans « le pharaon » traite le titre comme une fonction, conformément à l’usage français courant, tandis que la note maintient l’ambiguïté lexicale du premier verbe.
