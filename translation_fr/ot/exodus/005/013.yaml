  text: וְ/הַ/נֹּגְשִׂ֖ים אָצִ֣ים לֵ/אמֹ֑ר כַּלּ֤וּ מַעֲשֵׂי/כֶם֙ דְּבַר י֣וֹם בְּ/יוֹמ֔/וֹ כַּ/אֲשֶׁ֖ר בִּ/הְי֥וֹת הַ/תֶּֽבֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/013.yaml
  text: And the taskmasters kept pressing them[a], saying, “Finish your work, each day’s matter in its day, just as when there was straw.”
translation:
  language: fr
  text: 'Les chefs de corvée les pressaient en disant : « Achevez votre travail : la tâche de chaque jour, le jour même, comme lorsqu’il y avait de la paille. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנֹּגְשִׂים
  choice: les chefs de corvée
  rationale: Dans ce contexte de travail forcé, le terme désigne ceux qui imposent et font exécuter les corvées ou les quotas. « Chefs de corvée » est naturel et exprime leur fonction coercitive.
- source_word: אָצִים
  choice: les pressaient
  rationale: Le participe décrit une pression continue et insistante. L’imparfait français rend cette action durative.
- source_word: כַּלּוּ
  choice: Achevez
  rationale: L’impératif exige que le travail assigné soit mené à son terme ; « achevez » convient au registre digne du récit.
- source_word: מַעֲשֵׂיכֶם
  choice: votre travail
  rationale: Le mot désigne ici le travail imposé aux Israélites, notamment la fabrication des briques.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: la tâche de chaque jour, le jour même
  rationale: Cette formulation française conserve la répétition temporelle de l’idiome hébreu tout en exprimant clairement l’exigence quotidienne, sans introduire explicitement la notion plus précise de quota.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: Le terme établit une comparaison avec la situation antérieure.
- source_word: בִּהְיוֹת הַתֶּבֶן
  choice: lorsqu’il y avait de la paille
  rationale: La construction infinitive évoque la période où la paille était disponible ; le contexte indique qu’elle était auparavant fournie.
