base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/007.yaml
  text: You shall no longer give straw to the people for making bricks as before[a]; let them go and gather straw for themselves.
translation:
  language: fr
  text: Vous ne fournirez plus de paille au peuple pour fabriquer les briques comme auparavant[a]. Qu’ils aillent eux-mêmes ramasser leur paille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme hier et avant-hier », expression qui signifie « comme auparavant » ou « autrefois ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאסִפוּן
  choice: ne fournirez plus
  rationale: Avec la négation, le hifil de יסף marque ici la cessation d’une pratique antérieure. « Ne… plus » en restitue naturellement la force en français.
- source_word: לָתֵת
  choice: fournir
  rationale: נתן signifie couramment « donner », mais « fournir » convient mieux ici à la remise régulière d’un matériau de travail sans s’éloigner du sens.
- source_word: תֶּבֶן
  choice: paille
  rationale: Équivalent français usuel du matériau végétal employé dans la fabrication des briques; le terme est conservé dans ses deux occurrences.
- source_word: לָעָם
  choice: au peuple
  rationale: עם désigne littéralement le « peuple ». Le contexte concerne les travailleurs israélites, mais il n’est pas nécessaire de préciser davantage que le texte.
- source_word: לִלְבֹּן הַלְּבֵנִים
  choice: pour fabriquer les briques
  rationale: L’infinitif construit exprime le but. Cette formulation est claire et naturelle tout en conservant l’objet défini, « les briques ».
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: comme auparavant
  rationale: L’expression évoque littéralement « hier et avant-hier » et fonctionne comme un idiome signifiant « auparavant » ou « autrefois ».
- source_word: הֵם יֵלְכוּ
  choice: Qu’ils aillent eux-mêmes
  rationale: Le pronom indépendant met le groupe en relief, et l’imparfait a ici une valeur directive. « Qu’ils aillent eux-mêmes » rend à la fois l’ordre et le contraste avec ceux qui fournissaient jusque-là la paille.
- source_word: וְקֹשְׁשׁוּ
  choice: ramasser
  rationale: קשש désigne l’action de recueillir ou ramasser une matière dispersée. « Ramasser » est le verbe français le plus concret et naturel dans ce contexte.
- source_word: לָהֶם
  choice: leur paille
  rationale: Le datif pronominal indique qu’ils doivent obtenir la paille pour eux-mêmes. Avec « eux-mêmes » dans la proposition précédente, « leur paille » exprime ce rapport sans lourdeur.
