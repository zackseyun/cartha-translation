  text: וַ/יֹּ֣אמְר֔וּ אֱלֹהֵ֥י הָ/עִבְרִ֖ים נִקְרָ֣א עָלֵ֑י/נוּ נֵ֣לֲכָה נָּ֡א דֶּרֶךְ֩ שְׁלֹ֨שֶׁת יָמִ֜ים בַּ/מִּדְבָּ֗ר וְ/נִזְבְּחָה֙ לַֽ/יהוָ֣ה אֱלֹהֵ֔י/נוּ פֶּ֨ן יִפְגָּעֵ֔/נוּ בַּ/דֶּ֖בֶר א֥וֹ בֶ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/003.yaml
  text: And they said[a], “The God of the Hebrews has met with us. Please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God, lest he strike us with plague or with the sword.”
translation:
  language: fr
  text: 'Ils dirent : « Le Dieu des Hébreux est venu[a] à notre rencontre. Permets-nous, s’il te plaît, de faire trois jours de marche dans le désert afin de sacrifier à Yahweh, notre Dieu, de peur qu’il ne nous frappe par la peste ou par l’épée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous a convoqués ». L’expression hébraïque peut évoquer une rencontre avec Dieu ou une convocation de sa part.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: Le Dieu des Hébreux
  rationale: Conserve la désignation ethnique et narrative précise « Hébreux », sans la remplacer par « Israélites ».
- source_word: נִקְרָא עָלֵינוּ
  choice: s’est manifesté à nous
  rationale: Le niphal de קרא avec עַל peut exprimer une rencontre ou une convocation divine. « S’est manifesté à nous » rend naturellement l’idée d’une rencontre divine tout en laissant en note l’autre lecture possible.
- source_word: נֵלֲכָה נָּא
  choice: Permets-nous, s’il te plaît, d’aller
  rationale: Le cohortatif exprime ici une demande, et נָא en marque le caractère pressant et poli. La formulation française explicite naturellement que la permission est demandée à Pharaon.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: à trois jours de marche
  rationale: Rend de manière idiomatique la durée ou la distance du trajet indiquée par l’expression hébraïque.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: « Désert » est le terme français courant pour מִדְבָּר dans ce contexte, sans imposer nécessairement l’image d’une étendue uniquement sablonneuse.
- source_word: וְנִזְבְּחָה
  choice: afin d’offrir des sacrifices
  rationale: Le second cohortatif indique naturellement le but du déplacement; cette formulation conserve aussi la valeur cultuelle de זבח.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Transcrit le nom divin יהוה présent dans le texte hébreu, conformément à la politique fournie.
- source_word: פֶּן יִפְגָּעֵנוּ
  choice: de peur qu’il ne nous frappe
  rationale: « De peur que » conserve la nuance préventive de פֶּן, tandis que « frappe » exprime clairement l’intervention hostile ou punitive de פגע dans ce contexte.
- source_word: בַּדֶּבֶר אֹו בֶחָרֶב
  choice: par la peste ou par l’épée
  rationale: Rend les deux moyens de jugement en parallèle dans un français naturel et digne.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve ici le nom propre divin plutôt que de le remplacer par un titre.
- issue: Agent implicite de יִפְגָּעֵנוּ
  choice: il, renvoyant à Yahweh
  alternative: une formulation sans sujet explicite
  rationale: Le verbe hébreu est à la troisième personne masculine singulière et son antécédent naturel est « Yahweh, notre Dieu »; le français exige que ce sujet soit exprimé.
translation_notes:
  register: Français international moderne, naturel et digne. La demande adressée à Pharaon est formulée poliment; le nom « Yahweh » et la tension entre rencontre et convocation sont conservés.
