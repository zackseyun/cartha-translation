id: EXO.5.18
reference: Exodus 5:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּה֙ לְכ֣וּ עִבְד֔וּ וְ/תֶ֖בֶן לֹא יִנָּתֵ֣ן לָ/כֶ֑ם וְ/תֹ֥כֶן לְבֵנִ֖ים תִּתֵּֽנּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/018.yaml
  text: So now[a], go, work; but straw will not be given to you, yet you must deliver the required number of bricks.
translation:
  language: fr
  text: Maintenant donc, allez travailler ! On ne vous donnera pas de paille, mais vous devrez livrer le nombre exigé de briques[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le quota de briques ». Le mot hébreu תֹכֶן désigne ici une quantité fixe ou mesurée exigée des ouvriers.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Cette tournure rend la transition conclusive et insistante introduite par la conjonction et l’adverbe, dans un français naturel.
- source_word: לְכוּ
  choice: allez
  rationale: Impératif simple de הלך, qui conserve ici toute la force de l’ordre sans ajouter de rudesse absente du lexème.
- source_word: עִבְדוּ
  choice: travailler
  rationale: Dans ce contexte de travail forcé, « travailler » convient mieux que « servir », qui pourrait suggérer à tort un service cultuel.
- source_word: וְתֶבֶן
  choice: de paille, mais
  rationale: « Paille » est l’équivalent courant de תֶּבֶן. Le contraste contextuel porté par la conjonction est exprimé naturellement en français par « mais » dans la proposition suivante.
- source_word: יִנָּתֵן לָכֶם
  choice: On ne vous donnera pas
  rationale: Le tour impersonnel français rend naturellement le passif hébreu négatif tout en restant proche de son sens.
- source_word: תֹכֶן
  choice: le nombre exigé
  rationale: Le nom désigne une quantité mesurée ou fixée. Avec des briques dénombrables, « le nombre exigé » exprime clairement cette obligation sans la réduire à un terme administratif.
- source_word: לְבֵנִים
  choice: de briques
  rationale: Le complément rend explicitement la relation construite avec תֹכֶן.
- source_word: תִּתֵּנוּ
  choice: vous devrez livrer
  rationale: Le verbe signifie littéralement « vous donnerez » ; dans ce contexte, il s’agit de remettre la production exigée. « Devrez » explicite la valeur contraignante de l’ordre, et « livrer » en conserve l’idée de remise.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. L’impératif et l’obligation demeurent fermes, conformément à la parole de Pharaon. Le point d’exclamation marque la vigueur de l’ordre sans recourir à une formulation familière.
