translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement correspond à l’adresse directe au pharaon dans un cadre biblique narratif. L’ordre des mots et la question conservent la force de la plainte sans expliciter davantage la nature de l’oppression.
