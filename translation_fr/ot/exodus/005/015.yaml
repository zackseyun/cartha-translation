  yaml_path: translation/ot/exodus/005/015.yaml
  text: Then the officers of the sons of Israel came and cried out to Pharaoh[a], saying[c][b], “Why do you do this to your servants?”
translation:
  language: fr
  text: 'Alors les contremaîtres des fils d’Israël vinrent et crièrent au pharaon : « Pourquoi agis-tu ainsi envers tes serviteurs[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes esclaves ». Le mot hébreu peut désigner des serviteurs ou des esclaves selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Alors … vinrent
  rationale: Le wayyiqtol fait progresser le récit. « Alors » marque naturellement la succession narrative, tandis que « vinrent » rend le verbe de mouvement.
- source_word: שֹׁטְרֵי
  choice: les responsables
  rationale: Le terme désigne ici des Israélites chargés d’encadrer le travail sous l’autorité égyptienne. « Responsables » exprime leur fonction subalterne sans les identifier trop précisément à des contremaîtres.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: des fils d’Israël
  rationale: Cette formulation conserve l’expression familiale littérale de l’hébreu plutôt que de la réduire à l’ethnonyme « Israélites ».
- source_word: וַיִּצְעֲקוּ אֶל פַּרְעֹה
  choice: pousser des cris vers le pharaon
  rationale: צעק exprime un cri pressant, souvent lié à la détresse ou à une plainte. La préposition אֶל indique que ce cri est dirigé vers le pharaon.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français narratif, les deux-points introduisent naturellement les paroles et rendent la fonction du participe hébreu sans l’alourdissement de « en disant ».
- source_word: לָמָּה תַעֲשֶׂה כֹה
  choice: Pourquoi agis-tu ainsi
  rationale: La formulation reste proche de l’hébreu, littéralement « pourquoi fais-tu ainsi », tout en étant idiomatique en français.
- source_word: לַעֲבָדֶיךָ
  choice: envers tes serviteurs
  rationale: « Serviteurs » convient au langage déférent d’une requête adressée au souverain, tout en laissant ouverte la possibilité contextuelle de « esclaves ».
