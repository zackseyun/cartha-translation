base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/021.yaml
  text: And they said to them[a], “May Yahweh look on you and judge, because you have made us stink in the sight of Pharaoh and in the sight of his servants, putting a sword in their hand to kill us.”
translation:
  language: fr
  text: 'Ils leur dirent : « Que Yahweh vous voie et vous juge ! Car vous nous avez rendus odieux[a] aux yeux du pharaon et de ses serviteurs, en mettant une épée entre leurs mains pour nous tuer. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vous avez rendu notre odeur infecte », c’est-à-dire : « vous nous avez rendus répugnants » ou « détestables ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵהֶם
  choice: Ils leur dirent
  rationale: Le pronom hébreu est conservé sans expliciter « Moïse et Aaron »; le passé simple convient au registre narratif biblique français tout en restant intelligible.
- source_word: יֵרֶא יְהוָה עֲלֵיכֶם וְיִשְׁפֹּט
  choice: Que Yahweh vous voie et qu’il juge !
  rationale: Les deux imparfaits ont ici une valeur jussive et expriment un appel imprécatoire au regard et au jugement divins. « Voie » reste proche du verbe hébreu sans préciser indûment l’issue du jugement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription française usuelle du nom divin, qui préserve le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֲשֶׁר
  choice: Car
  rationale: La conjonction introduit la raison de l’appel au jugement; « car » s’intègre naturellement à la parole directe.
- source_word: הִבְאַשְׁתֶּם אֶת רֵיחֵנוּ
  choice: vous nous avez rendus odieux
  rationale: Littéralement, le texte évoque le fait de rendre leur odeur infecte. « Rendus odieux » restitue en français naturel l’idée qu’ils sont devenus répugnants ou détestables, tandis qu’une note conserve l’image concrète.
- source_word: בְּעֵינֵי פַרְעֹה וּבְעֵינֵי עֲבָדָיו
  choice: aux yeux du pharaon et de ses serviteurs
  rationale: L’expression idiomatique hébraïque est également naturelle en français et garde l’idée de l’estime ou du jugement porté sur eux.
- source_word: לָתֵת חֶרֶב בְּיָדָם
  choice: en leur mettant une épée à la main
  rationale: Cette formulation conserve l’image hébraïque de fournir à l’adversaire le moyen ou l’occasion de tuer. Le singulier collectif « une épée » est maintenu.
- source_word: לְהָרְגֵנוּ
  choice: pour nous tuer
  rationale: Traduction directe et actuelle de l’infinitif hébreu avec suffixe de première personne du pluriel.
theological_decisions:
- issue: Portée du jugement demandé à Yahweh
  choice: qu’il juge
  alternative: qu’il vous condamne
  rationale: Le verbe hébreu signifie « juger » et ne formule pas explicitement le verdict; la traduction préserve cette tension sans transformer l’appel au jugement en condamnation certaine.
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte source porte le nom divin; sa transcription le distingue d’un simple titre et suit la ligne éditoriale fournie.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le passé simple soutient le registre narratif; l’image de l’épée et l’expression « aux yeux de » sont conservées, tandis que l’idiome olfactif est rendu naturellement et signalé en note.
