  text: וַ/יֹּ֛אמֶר נִרְפִּ֥ים אַתֶּ֖ם נִרְפִּ֑ים עַל כֵּן֙ אַתֶּ֣ם אֹֽמְרִ֔ים נֵלְכָ֖ה נִזְבְּחָ֥ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/017.yaml
  text: But he said[a], “You are idle, idle! That is why you say, ‘Let us go and sacrifice to Yahweh.’”
translation:
  language: fr
  text: 'Mais il dit : « Vous êtes paresseux, paresseux ! Voilà pourquoi vous dites : “Allons offrir un sacrifice à Yahweh.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mais il dit
  rationale: Le waw consécutif poursuit le récit, tandis que « mais » rend naturellement la valeur adversative de la réponse de Pharaon dans ce contexte.
- source_word: נִרְפִּים אַתֶּם נִרְפִּים
  choice: Vous êtes paresseux, paresseux !
  rationale: « Paresseux » exprime ici l'accusation de manque d'ardeur au travail. La répétition hébraïque est conservée pour rendre l'insistance et la rudesse de la réplique.
- source_word: עַל כֵּן
  choice: Voilà pourquoi
  rationale: Cette tournure courante marque clairement le lien causal que Pharaon prétend établir.
- source_word: אֹמְרִים
  choice: vous dites
  rationale: Le participe hébreu a ici une valeur verbale présente dans le discours direct.
- source_word: נֵלְכָה נִזְבְּחָה
  choice: Allons offrir un sacrifice
  rationale: Les deux cohortatifs expriment une proposition collective. Cette formulation française garde leur élan tout en rendant naturellement l'action cultuelle de זבח.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition désigne le destinataire du sacrifice, et le tétragramme est transcrit comme nom propre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve ici sa fonction de nom divin personnel sans substituer un titre.
translation_notes:
  register: Français international moderne, direct et digne. La répétition accusatrice de l'hébreu est maintenue sans l'atténuer; le dialogue reste oral et énergique.
