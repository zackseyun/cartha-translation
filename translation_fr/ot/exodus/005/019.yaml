  text: וַ/יִּרְא֞וּ שֹֽׁטְרֵ֧י בְנֵֽי יִשְׂרָאֵ֛ל אֹתָ֖/ם בְּ/רָ֣ע לֵ/אמֹ֑ר לֹא תִגְרְע֥וּ מִ/לִּבְנֵי/כֶ֖ם דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/019.yaml
  text: Then the officers of the sons of Israel saw that they were in trouble when it was said[a], “You must not reduce the number of your bricks[b], the daily quota each day.”
translation:
  language: fr
  text: 'Les responsables israélites se rendirent compte qu’ils étaient dans une mauvaise situation lorsqu’on leur dit : « Vous ne diminuerez pas le nombre de briques que vous devez fournir chaque jour[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la tâche d’un jour en son jour » ; c’est-à-dire la quantité de briques exigée pour chaque jour.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: comprirent
  rationale: Le sens premier est « voir », mais dans ce contexte le verbe exprime la prise de conscience produite par l’ordre qui vient d’être donné. « Comprirent » est naturel en français et rend cette valeur contextuelle.
- source_word: שֹׁטְרֵי
  choice: responsables
  rationale: Le terme désigne ici des Israélites chargés de fonctions subalternes d’encadrement sous l’autorité égyptienne. « Responsables » reste assez large sans leur attribuer un titre administratif français trop précis.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Littéralement « les fils d’Israël ». Dans ce syntagme collectif, « les Israélites » est l’équivalent français courant, clair et inclusif.
- source_word: אֹתָם בְּרָע
  choice: qu’ils étaient dans une mauvaise situation
  rationale: Le pronom renvoie aux responsables eux-mêmes, et רָע décrit ici une situation défavorable plutôt qu’un mal moral. Cette formulation conserve la nuance sans la dramatiser excessivement.
- source_word: לֵאמֹר
  choice: puisqu’on leur disait
  rationale: L’infinitif introduit l’énoncé révélant leur situation. « Puisqu’on leur disait » exprime naturellement le lien logique avec la prise de conscience, tout en gardant l’agent indéfini du texte.
- source_word: לֹא תִגְרְעוּ
  choice: Vous ne diminuerez pas
  rationale: Le verbe signifie retrancher ou diminuer. Le futur à valeur injonctive restitue en français la force de l’interdiction.
- source_word: מִלִּבְנֵיכֶם
  choice: le nombre de vos briques
  rationale: La préposition marque ce dont rien ne doit être retranché. L’ajout explicatif de « nombre » est imposé par le sens quantitatif de la suite et produit une phrase française intelligible.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: chaque jour, la quantité fixée pour ce jour-là
  rationale: L’expression idiomatique signifie la tâche ou quantité prescrite pour chaque journée. Cette formulation rend le quota quotidien tout en préservant la répétition distributive du texte hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Responsables » évite un titre institutionnel trop étroit ; « comprirent » rend la valeur perceptive contextuelle de ראה. La tournure finale conserve l’insistance hébraïque sur l’exigence propre à chaque journée.
