  text: וַ/יָּ֧שָׁב מֹשֶׁ֛ה אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר אֲדֹנָ֗/י לָ/מָ֤ה הֲרֵעֹ֨תָה֙ לָ/עָ֣ם הַ/זֶּ֔ה לָ֥/מָּה זֶּ֖ה שְׁלַחְתָּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/022.yaml
  text: Then Moses returned to Yahweh and said[a], “Lord, why have you brought harm on this people? Why then did you send me?”
translation:
  language: fr
  text: 'Alors Moïse revint vers Yahvé et dit : « Seigneur, pourquoi as-tu fait du mal à ce peuple ? Pourquoi donc m’as-tu envoyé[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Pourquoi cela, m’as-tu envoyé ? » Il s’agit d’une tournure emphatique qui signifie : « Pourquoi donc m’as-tu envoyé ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: revint
  rationale: Le verbe שׁוב exprime ici le retour de Moïse vers Yahvé après son entretien avec le pharaon. « Revint » est naturel et fidèle au mouvement indiqué.
- source_word: אֶל יְהוָה
  choice: vers Yahvé
  rationale: La préposition אֶל marque la direction ou la relation, et le nom divin יהוה est rendu par « Yahvé » afin de conserver le nom propre de l’alliance.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: אֲדֹנָי est ici une adresse respectueuse à Dieu. « Seigneur » convient au français actuel sans ajouter le possessif possible mais non nécessaire « mon ».
- source_word: לָמָה הֲרֵעֹתָה לָעָם הַזֶּה
  choice: pourquoi as-tu fait du mal à ce peuple ?
  rationale: Le hifil de רעע désigne le fait de causer du mal, du tort ou du malheur. « Faire du mal à » conserve la force directe et accusatrice de la plainte de Moïse sans trancher artificiellement la tension théologique du propos.
- source_word: לָמָּה זֶּה
  choice: Pourquoi donc
  rationale: La combinaison de לָמָה et זֶה forme ici une interrogation emphatique. « Pourquoi donc » en restitue naturellement l’insistance en français.
- source_word: שְׁלַחְתָּנִי
  choice: m’as-tu envoyé
  rationale: La forme verbale avec suffixe de première personne signifie directement « tu m’as envoyé » ; l’inversion convient à l’interrogation en français.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahvé » le traite comme le nom propre divin plutôt que de le remplacer par un titre.
- issue: Portée de הֲרֵעֹתָה dans la plainte de Moïse
  choice: as-tu fait du mal à
  alternative: as-tu causé du malheur à
  rationale: La formulation retenue préserve le caractère audacieux et accusateur de la question sans expliquer d’avance si Moïse parle d’un tort moral ou des conséquences désastreuses subies par le peuple.
translation_notes:
  register: Français international moderne, direct et digne. La syntaxe de la plainte reste vive, et la répétition de « pourquoi » est conservée. Le marqueur de note est placé sur la seconde question, qu’il explique directement.
