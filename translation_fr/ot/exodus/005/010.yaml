base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/010.yaml
  text: 'So the taskmasters of the people and their officers went out and said to the people[a], “Thus says Pharaoh: I am not giving you straw.”'
translation:
  language: fr
  text: 'Les chefs de corvée du peuple et ses responsables[a] sortirent et dirent au peuple : « Voici ce que dit le pharaon : Je ne vous donne pas de paille. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses contremaîtres ». Le terme hébreu peut désigner des agents subalternes parmi le peuple.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹגְשֵׂי
  choice: chefs de corvée
  rationale: Dans ce contexte, le terme désigne ceux qui imposent et font respecter le travail obligatoire. « Chefs de corvée » exprime leur fonction coercitive sans ajouter explicitement qu’il s’agit d’esclavage.
- source_word: שֹׁטְרָיו
  choice: ses responsables
  rationale: Le suffixe renvoie naturellement au peuple, nom collectif singulier. « Responsables » conserve le sens administratif assez large du terme sans préciser indûment leur fonction exacte.
- source_word: וַיֵּצְאוּ
  choice: sortirent
  rationale: Rend directement le mouvement narratif exprimé par le verbe hébreu.
- source_word: הָעָם
  choice: le peuple
  rationale: Équivalent direct du nom collectif, qui désigne ici la population israélite soumise au travail.
- source_word: לֵאמֹר
  choice: et dirent
  rationale: Le français idiomatique introduit naturellement le discours direct par « dirent », plutôt que par le calque « en disant ».
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Rend la formule officielle de transmission d’un message dans un français actuel et solennel, sans l’archaïsme de « Ainsi parle ».
- source_word: פַּרְעֹה
  choice: le pharaon
  rationale: Le titre royal est employé avec l’article, conformément à l’usage courant en français.
- source_word: אֵינֶנִּי נֹתֵן
  choice: Je ne vous donne pas
  rationale: La négation avec participe exprime ici le refus présent et effectif du pharaon. Cette formulation préserve cet aspect sans le réduire à un simple futur.
- source_word: תֶּבֶן
  choice: paille
  rationale: Terme français normal pour la matière végétale employée dans la fabrication des briques dans ce contexte.
