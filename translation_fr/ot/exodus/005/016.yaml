  text: תֶּ֗בֶן אֵ֤ין נִתָּן֙ לַ/עֲבָדֶ֔י/ךָ וּ/לְבֵנִ֛ים אֹמְרִ֥ים לָ֖/נוּ עֲשׂ֑וּ וְ/הִנֵּ֧ה עֲבָדֶ֛י/ךָ מֻכִּ֖ים וְ/חָטָ֥את עַמֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/016.yaml
  text: No straw is given to your servants[a], yet they say to us, ‘Make bricks!’ And behold, your servants are being beaten, but the fault is with your own people.
translation:
  language: fr
  text: 'On ne donne pas de paille à tes serviteurs, et pourtant on nous dit : « Faites des briques ! » Et voici que tes serviteurs sont battus, alors que c’est ton propre peuple qui est en faute[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est condensé et difficile; plus littéralement : « et la faute de ton peuple ». On peut aussi comprendre : « et ton peuple a péché ». Dans le contexte, la responsabilité semble être imputée aux gens de Pharaon.'
    reason: ambiguïté syntaxique et alternative de traduction
lexical_decisions:
- source_word: תֶּבֶן
  choice: paille
  rationale: Dans le contexte de la fabrication des briques, « paille » est l’équivalent français naturel du matériau fibreux fourni aux ouvriers.
- source_word: אֵין נִתָּן
  choice: on ne donne pas
  rationale: La tournure existentielle négative avec participe passif indique que la paille n’est pas fournie. La construction française impersonnelle est claire et naturelle.
- source_word: לַעֲבָדֶיךָ / עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Les contremaîtres israélites s’adressent à Pharaon dans un langage de déférence. « Tes serviteurs » conserve à la fois leur subordination et le registre de leur requête.
- source_word: לְבֵנִים
  choice: briques
  rationale: Le pluriel concret convient à la production imposée aux ouvriers.
- source_word: אֹמְרִים לָנוּ עֲשׂוּ
  choice: 'on nous dit : « Faites des briques ! »'
  rationale: L’impératif pluriel est rendu directement; « briques », repris du nom précédent, explicite naturellement en français l’objet sous-entendu de עֲשׂוּ.
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Cette formule française actuelle mais digne garde la force présentative et l’appel emphatique exprimés par הִנֵּה.
- source_word: מֻכִּים
  choice: sont battus
  rationale: Le participe passif décrit les violences subies par les serviteurs; « sont battus » est direct et idiomatique.
- source_word: וְחָטָאת עַמֶּךָ
  choice: alors que c’est ton propre peuple qui est en faute
  rationale: La proposition hébraïque est très condensée. Cette formulation exprime naturellement l’accusation contextuelle portée contre les gens de Pharaon, tout en signalant en note la difficulté grammaticale et les autres analyses possibles.
theological_decisions:
- issue: Identification du responsable dans וְחָטָאת עַמֶּךָ
  choice: La faute est attribuée au peuple de Pharaon.
  alternative: « et la faute de ton peuple »; ou, selon une autre compréhension, « et ton peuple a péché »
  rationale: Le contexte oppose les serviteurs battus aux agents égyptiens qui exigent les briques sans fournir de paille. La traduction principale rend cette logique sans transformer la proposition difficile en affirmation théologique plus précise que l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse directe au souverain dans le discours hébreu. « Et voici que » conserve l’emphase sans employer l’archaïsant « voici, tes serviteurs… ».
