source:
  edition: WLC
  text: וַ/יְצַ֥ו פַּרְעֹ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא אֶת הַ/נֹּגְשִׂ֣ים בָּ/עָ֔ם וְ/אֶת שֹׁטְרָ֖י/ו לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/006.yaml
  text: So Pharaoh commanded on that day the taskmasters of the people and his officers[a], saying[c][b],
translation:
  language: fr
  text: 'Ce jour-là, le pharaon donna cet ordre aux chefs de corvée du peuple[a] et à ses contremaîtres[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux chefs de corvée parmi le peuple ». L’expression hébraïque ne précise pas entièrement le rapport entre ces responsables et le peuple.
    reason: lexical_alternative
  - marker: b
    text: Ou « à ses agents ». Le terme hébreu désigne ici des responsables subalternes dans l’organisation du travail.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: donna cet ordre
  rationale: Le verbe צוה exprime ici un ordre autoritaire et fait avancer le récit. Cette formulation introduit naturellement en français les paroles qui suivent.
- source_word: פַּרְעֹה
  choice: le pharaon
  rationale: Titre royal courant en français, employé ici avec l’article défini conformément à l’usage moderne.
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Rend directement l’expression temporelle hébraïque, avec une possible nuance d’immédiateté sans la renforcer dans le texte principal.
- source_word: הַנֹּגְשִׂים בָּעָם
  choice: les chefs de corvée du peuple
  rationale: נגשׂ désigne dans ce contexte ceux qui imposent et pressent le travail. « Chefs de corvée » rend leur fonction, tandis que « du peuple » conserve la relation concise exprimée en hébreu sans préciser davantage leur origine ou leur position.
- source_word: שֹׁטְרָיו
  choice: ses contremaîtres
  rationale: Dans le système de travail décrit en Exode, שׁטרים désigne des agents subalternes chargés de l’encadrement. « Contremaîtres » est naturel et contextuellement précis, tout en laissant en note l’alternative plus générale.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français, les deux-points introduisent naturellement le discours direct et rendent idiomatiquement la formule hébraïque « en disant ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. « Le pharaon » suit l’usage français courant. La formulation évite l’archaïsme « disant » et emploie les deux-points pour assurer l’enchaînement avec le discours du verset suivant.
