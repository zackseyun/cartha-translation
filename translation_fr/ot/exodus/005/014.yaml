  text: וַ/יֻּכּ֗וּ שֹֽׁטְרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר שָׂ֣מוּ עֲלֵ/הֶ֔ם נֹגְשֵׂ֥י פַרְעֹ֖ה לֵ/אמֹ֑ר מַדּ֡וּעַ לֹא֩ כִלִּיתֶ֨ם חָקְ/כֶ֤ם לִ/לְבֹּן֙ כִּ/תְמ֣וֹל שִׁלְשֹׁ֔ם גַּם תְּמ֖וֹל גַּם הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/014.yaml
  text: And the Israelite foremen[a], whom Pharaoh’s taskmasters had set over them, were beaten, saying, “Why have you not finished your quota of brickmaking as before, both yesterday and today?”
translation:
  language: fr
  text: 'Les contremaîtres israélites, que les chefs de corvée de Pharaon avaient placés à la tête des autres Israélites, furent battus par ces chefs de corvée, qui leur dirent : « Pourquoi n’avez-vous pas achevé votre quota de briques comme auparavant[a], aussi bien hier qu’aujourd’hui ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « comme hier, avant-hier », expression qui signifie ici « comme auparavant » ou « comme autrefois ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּכּוּ
  choice: furent battus
  rationale: Le passif de נכה indique un châtiment physique sans en préciser la méthode ; « furent battus » conserve cette portée.
- source_word: שֹׁטְרֵי בְּנֵי יִשְׂרָאֵל
  choice: les contremaîtres israélites
  rationale: Dans ce contexte de travail forcé, ces hommes sont des responsables subalternes choisis parmi les Israélites ; « contremaîtres » exprime clairement leur fonction.
- source_word: אֲשֶׁר שָׂמוּ עֲלֵהֶם נֹגְשֵׂי פַרְעֹה
  choice: que les chefs de corvée de Pharaon avaient placés à la tête de leurs compatriotes
  rationale: « Chefs de corvée » rend le rôle coercitif des נֹגְשִׂים. L’explicitation « leurs compatriotes » clarifie le référent collectif de עֲלֵיהֶם sans modifier la relation hiérarchique.
- source_word: לֵאמֹר
  choice: On leur disait
  rationale: Cette tournure française introduit naturellement les paroles adressées aux contremaîtres et laisse le sujet implicite, comme dans la proposition hébraïque.
- source_word: לֹא כִלִּיתֶם חָקְכֶם לִלְבֹּן
  choice: n’avez-vous pas achevé votre quota de briques
  rationale: כלה désigne l’achèvement de la tâche, חֹק la quantité prescrite, et לִלְבֹּן la fabrication des briques. « Quota de briques » est concis et naturel en français.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: comme auparavant
  rationale: L’expression temporelle idiomatique renvoie à la pratique antérieure ; la traduction courante est retenue et le sens littéral est signalé en note.
- source_word: גַּם תְּמוֹל גַּם הַיּוֹם
  choice: aussi bien hier qu’aujourd’hui
  rationale: La corrélation גַּם…גַּם souligne que le manquement concerne les deux jours ; cette formulation la restitue naturellement.
theological_decisions: []
