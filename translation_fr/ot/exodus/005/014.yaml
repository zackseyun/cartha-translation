- from: 'Les contremaîtres israélites que les chefs de corvée de Pharaon avaient placés à la tête de leurs compatriotes furent battus. On leur disait : « Pourquoi n’avez-vous pas achevé votre quota de briques comme auparavant[a], aussi bien hier qu’aujourd’hui ? »'
  to: 'Les contremaîtres israélites, que les chefs de corvée de Pharaon avaient placés à la tête des autres Israélites, furent battus par ces chefs de corvée, qui leur dirent : « Pourquoi n’avez-vous pas achevé votre quota de briques comme auparavant[a], aussi bien hier qu’aujourd’hui ? »'
  rationale: La révision identifie explicitement les chefs de corvée comme ceux qui battent les contremaîtres et leur adressent le reproche, conformément à l’enchaînement du verset et de son contexte immédiat. Elle remplace aussi « leurs compatriotes » par « les autres Israélites », explicitation plus neutre du pronom hébreu. La note conserve l’ancre et explique l’idiome temporel.
