review_pass:
  verdict: revise
  source_fidelity: 'Le texte rend correctement les personnes et les nombres : le singulier vise Moïse dans les premières propositions, puis le pluriel vise Moïse et Aaron. « Les paroles dans sa bouche » et « je serai avec ta bouche et avec sa bouche » conservent fidèlement les images et la syntaxe essentielles de l’hébreu. Toutefois, « ce que vous aurez à faire » explicite une obligation qui n’est pas formulée lexicalement par אֵת אֲשֶׁר תַּעֲשׂוּן (« ce que vous ferez »).'
  naturalness: Le français est moderne, clair et d’un registre approprié. La formulation concrète « avec ta bouche et avec sa bouche », inhabituelle mais intelligible, est justifiée par la fidélité à l’image hébraïque. Une phrase continue avec des virgules reflète plus naturellement la coordination du verset.
  terminology: « Paroles », « bouche » et « enseignerai » sont des choix exacts et cohérents. « Moi » rend de manière acceptable l’insistance de אָנֹכִי sans surinterprétation. La note sur le pluriel final est pertinente et correctement ancrée.
  issues:
  - severity: low
    issue: « ce que vous aurez à faire »
    rationale: Cette tournure ajoute l’idée de devoir ou de tâche imposée. Le verbe hébreu est simplement un futur pluriel (« ce que vous ferez »), même si le contexte est celui d’instructions. « Ce que vous ferez » préserve mieux cette formulation sans perte de sens.
  revised_text: Tu lui parleras et tu mettras les paroles dans sa bouche ; moi, je serai avec ta bouche et avec sa bouche, et je vous enseignerai ce que vous ferez.[a]
