base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/015.yaml
  text: You shall speak to him and put the words in his mouth[a], and I will be with your mouth and with his mouth[b], and I will instruct you what you shall do.
translation:
  language: fr
  text: Tu lui parleras et tu mettras les paroles dans sa bouche ; moi, je serai avec ta bouche et avec sa bouche, et je vous enseignerai ce que vous ferez.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le « vous » est pluriel : Dieu s’adresse ici à Moïse et à Aaron ensemble.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו
  choice: Tu lui parleras
  rationale: Le parfait qal avec waw, dans cette suite d’instructions, exprime un ordre à valeur prospective. Le futur français rend naturellement cette instruction adressée à Moïse.
- source_word: וְשַׂמְתָּ אֶת־הַדְּבָרִים בְּפִיו
  choice: et tu mettras les paroles dans sa bouche
  rationale: Cette formulation conserve le verbe concret שׂים, le nom défini « les paroles » et l’image hébraïque de paroles placées dans la bouche d’Aaron.
- source_word: וְאָנֹכִי אֶהְיֶה עִם־פִּיךָ וְעִם־פִּיהוּ
  choice: Moi, je serai avec ta bouche et avec sa bouche
  rationale: La tournure concrète de l’hébreu est maintenue. Le pronom disjoint « Moi » fait entendre l’insistance portée par אָנֹכִי sans ajouter d’interprétation explicative.
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  choice: et je vous enseignerai
  rationale: Le hifil de ירה signifie ici « enseigner, instruire ». « Enseignerai » reste proche de la forme hébraïque, tandis que « vous » respecte le pluriel אֶתְכֶם.
- source_word: אֵת אֲשֶׁר תַּעֲשׂוּן
  choice: ce que vous aurez à faire
  rationale: Cette expression française naturelle rend la relative et la portée prospective/instructionnelle du verbe à la deuxième personne du pluriel, sans donner l’impression d’une simple prédiction.
theological_decisions:
- issue: Expression anthropomorphique de l’aide divine dans la parole
  choice: Conserver « je serai avec ta bouche et avec sa bouche »
  alternative: « je t’aiderai à parler et je l’aiderai à parler »
  rationale: L’hébreu présente la présence et l’action habilitante de Dieu au moyen de l’image concrète de la bouche. La conserver préserve la texture et la portée théologique du texte sans les réduire à une paraphrase.
- issue: Nombre des destinataires dans la proposition finale
  choice: Employer le pluriel « vous » et l’expliciter en note
  alternative: « ce que vous aurez tous les deux à faire »
  rationale: אֶתְכֶם et תַּעֲשׂוּן sont clairement pluriels et visent Moïse et Aaron ensemble. Le français « vous » préserve ce pluriel, mais son ambiguïté graphique avec le vouvoiement justifie une brève note.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse divine singulière à Moïse dans les premières propositions; le passage au pluriel « vous » est conservé à la fin. L’image sémitique de la bouche est volontairement maintenue malgré son caractère moins idiomatique en français.
