base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/020.yaml
  text: Then Moses took his wife and his sons[a], set them on the donkey, and returned to the land of Egypt[b]. And Moses took the staff of God in his hand.
translation:
  language: fr
  text: Moïse prit alors sa femme et ses fils, les fit monter sur l’âne[a] et retourna au pays d’Égypte. Moïse prit dans sa main le bâton[b] de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les installa sur l’âne ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la verge de Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Moïse prit alors
  rationale: Le waw consécutif fait progresser le récit ; « alors » exprime naturellement la succession, tandis que « prit » rend le sens courant de לקח.
- source_word: אִשְׁתּוֹ
  choice: sa femme
  rationale: Rendu direct du nom אִשָּׁה avec suffixe possessif ; le texte ne nomme pas Séphora dans ce verset.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le masculin pluriel désigne précisément les fils de Moïse plutôt que ses enfants en général.
- source_word: וַיַּרְכִּבֵם
  choice: les fit monter sur
  rationale: La forme causative de רכב signifie faire monter ou faire voyager quelqu’un sur une monture ; cette formulation est naturelle en français et conserve la valeur causative.
- source_word: הַחֲמֹר
  choice: l’âne
  rationale: L’article défini hébreu est conservé ; « âne » est le terme français moderne usuel.
- source_word: וַיָּשָׁב
  choice: retourna
  rationale: Dans ce contexte, שוב exprime le retour de Moïse vers l’Égypte.
- source_word: אַרְצָה מִצְרָיִם
  choice: au pays d’Égypte
  rationale: Cette traduction conserve à la fois la direction indiquée par la terminaison locale et le nom « pays/terre » présent dans l’expression hébraïque.
- source_word: מַטֵּה הָאֱלֹהִים
  choice: le bâton de Dieu
  rationale: מַטֶּה désigne ici le bâton que Moïse portera et emploiera comme instrument des signes ; « bâton » est courant et concret en français moderne.
- source_word: בְּיָדוֹ
  choice: dans sa main
  rationale: Rendu concret et direct de la préposition et du suffixe possessif.
theological_decisions:
- issue: Sens de הָאֱלֹהִים dans מַטֵּה הָאֱלֹהִים
  choice: de Dieu
  alternative: divin
  rationale: Le contexte rattache ce bâton au Dieu qui a chargé Moïse d’accomplir les signes. Le complément « de Dieu » conserve aussi plus directement la construction hébraïque sans la transformer en simple qualificatif.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide tout en conservant les éléments concrets de l’hébreu. Les marqueurs de notes sont placés immédiatement après les expressions auxquelles leurs variantes se rapportent.
