  text: וַ/יֹּ֨אמֶר֙ הַשְׁלִיכֵ֣/הוּ אַ֔רְצָ/ה וַ/יַּשְׁלִיכֵ֥/הוּ אַ֖רְצָ/ה וַ/יְהִ֣י לְ/נָחָ֑שׁ וַ/יָּ֥נָס מֹשֶׁ֖ה מִ/פָּנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/003.yaml
  text: And he said[a], “Throw it on the ground.” So he threw it on the ground, and it became a snake[b], and Moses fled from it.
translation:
  language: fr
  text: 'Il dit : « Jette-le à terre. » Moïse le jeta à terre, et il devint un serpent. Alors Moïse s’enfuit devant lui[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de devant lui ». Le pronom renvoie très probablement au serpent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le wayyiqtol poursuit simplement le récit. « Il dit » est naturel en français et n’ajoute pas de nuance temporelle absente de l’hébreu.
- source_word: הַשְׁלִיכֵהוּ
  choice: Jette-le
  rationale: L’impératif de שלך avec suffixe masculin singulier renvoie au bâton du verset précédent. « Jette-le » est direct et actuel.
- source_word: אַרְצָה
  choice: à terre
  rationale: Le hé directionnel indique un mouvement vers le sol. « À terre » rend cette direction de façon idiomatique.
- source_word: וַיַּשְׁלִיכֵהוּ
  choice: Moïse le jeta
  rationale: La répétition du verbe reprend précisément l’ordre donné. Le nom « Moïse » explicite naturellement le sujet déjà connu sans modifier le sens.
- source_word: וַיְהִי לְנָחָשׁ
  choice: il devint un serpent
  rationale: נָחָשׁ désigne un serpent. « Serpent » est le terme français courant et convient au registre narratif.
- source_word: וַיָּנָס
  choice: s’enfuit
  rationale: Le verbe נוס exprime la fuite. « S’enfuit » en conserve la force sans être archaïque.
- source_word: מִפָּנָיו
  choice: loin de lui
  rationale: L’expression signifie littéralement « de devant lui » et exprime l’éloignement. Dans le contexte, le pronom renvoie très probablement au serpent, tout en conservant la forme pronominale de l’hébreu.
theological_decisions:
- issue: Référent du suffixe dans מִפָּנָיו
  choice: Conserver le pronom dans « loin de lui »
  alternative: « loin du serpent » ou « devant lui »
  rationale: Le serpent est le référent contextuel le plus naturel, mais le masculin singulier hébreu ne le nomme pas explicitement. Le pronom français préserve cette légère ambiguïté formelle sans obscurcir le récit.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « à terre » reflète celle du texte hébreu; « serpent » est naturel en français et n’exige pas de variante plus littéraire.
