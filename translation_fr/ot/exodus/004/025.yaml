  text: Then Zipporah took a flint and cut off her son's foreskin and touched his feet with it[a], and she said, “Surely you are a bridegroom of blood to me.”
translation:
  language: fr
  text: 'Alors Séphora prit un silex, coupa le prépuce de son fils et en toucha les pieds[a]. Elle dit : « Assurément, tu es pour moi un époux de sang. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ses pieds ». En hébreu, « pieds » peut être un euphémisme désignant les organes génitaux, et le pronom peut renvoyer à Moïse ou à son fils.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹר
  choice: un silex
  rationale: Le nom désigne ici une pierre dure et tranchante employée comme instrument. « Silex » est précis, concis et naturel dans le contexte de la circoncision.
- source_word: עָרְלַת בְּנָהּ
  choice: le prépuce de son fils
  rationale: Rend directement et sans euphémisme la construction hébraïque.
- source_word: וַתַּגַּע
  choice: en toucha
  rationale: נגע signifie normalement « toucher ». Le pronom « en » indique naturellement en français que le contact se fait avec le prépuce, sans préciser davantage le geste.
- source_word: לְרַגְלָיו
  choice: ses pieds
  rationale: Conserve le sens lexical ordinaire et l’ambiguïté du pronom hébreu. La possibilité d’un euphémisme désignant les organes génitaux est signalée en note plutôt qu’introduite dans le texte.
- source_word: כִּי
  choice: Oui
  rationale: Dans cette exclamation, כִּי a vraisemblablement une valeur affirmative ou emphatique. « Oui » restitue cette force sans lui donner la nuance de certitude plus marquée de « assurément ».
- source_word: חֲתַן דָּמִים
  choice: un époux de sang
  rationale: Cette expression rare et difficile est rendue littéralement afin d’en préserver l’image et l’ambiguïté.
- source_word: לִי
  choice: pour moi
  rationale: La préposition exprime ici une relation personnelle; « pour moi » s’emploie naturellement avec « tu es » en français.
theological_decisions:
- issue: Faut-il comprendre « ses pieds » comme un euphémisme et identifier explicitement la personne visée ?
  choice: Conserver « ses pieds » sans identifier le référent du possessif.
  alternative: « ses organes génitaux », ou une mention explicite des pieds ou des organes génitaux de Moïse ou du fils.
  rationale: 'L’hébreu est notoirement ambigu : « pieds » peut être littéral ou euphémistique, et le suffixe masculin peut renvoyer à Moïse ou au fils. Le texte principal ne tranche pas ce que la source laisse indéterminé; la note expose les principales possibilités.'
- issue: Sens de l’expression חֲתַן דָּמִים
  choice: Préserver l’expression « époux de sang ».
  alternative: Paraphraser en explicitant un lien rituel, matrimonial ou familial créé ou confirmé par le sang.
  rationale: Le sens précis de la formule et son application dans la scène restent discutés. Une traduction littérale conserve la tension narrative et théologique sans imposer une interprétation.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe narrative reste fluide; le vocabulaire anatomique est précis. L’étrangeté voulue de « époux de sang » ainsi que les ambiguïtés du texte hébreu sont conservées.
