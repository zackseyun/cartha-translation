source:
  edition: WLC
  text: וַ/יַּ֤עַן מֹשֶׁה֙ וַ/יֹּ֔אמֶר וְ/הֵן֙ לֹֽא יַאֲמִ֣ינוּ לִ֔/י וְ/לֹ֥א יִשְׁמְע֖וּ בְּ/קֹלִ֑/י כִּ֣י יֹֽאמְר֔וּ לֹֽא נִרְאָ֥ה אֵלֶ֖י/ךָ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/001.yaml
  text: Then Moses answered and said[a], “But behold, they will not believe me, and they will not listen to my voice, for they will say[b], ‘Yahweh has not appeared to you.’”
translation:
  language: fr
  text: 'Moïse répondit : « Mais voilà, ils ne me croiront pas et ils ne m’écouteront pas, car ils diront : “Yahweh ne t’est pas apparu.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן מֹשֶׁה וַיֹּאמֶר
  choice: Moïse répondit
  rationale: En français, « répondit » exprime naturellement à lui seul la formule narrative hébraïque littérale « répondit et dit », dont la reproduction mot à mot serait lourde.
- source_word: וְהֵן
  choice: Mais voilà
  rationale: La tournure introduit l’objection de Moïse tout en conservant la valeur présentative et l’appel à l’attention de הֵן, sans employer l’archaïque « voici » dans ce contexte.
- source_word: לֹא יַאֲמִינוּ לִי
  choice: ils ne me croiront pas
  rationale: Le hiphil de אמן avec לִי porte ici sur la crédibilité du témoignage et de la mission de Moïse ; « croire quelqu’un » est l’expression française idiomatique.
- source_word: וְלֹא יִשְׁמְעוּ בְּקֹלִי
  choice: et ils ne m’écouteront pas
  rationale: שמע בקול peut signifier écouter, prêter attention ou obéir. Ici, « ne m’écouteront pas » convient à l’accueil du message de Moïse sans imposer le sens plus fort d’« obéir ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison invoquée par Moïse ; « car » rend clairement ce rapport explicatif dans un registre digne.
- source_word: לֹא נִרְאָה אֵלֶיךָ
  choice: ne t’est pas apparu
  rationale: Le niphal de ראה signifie couramment « apparaître ». Le passé composé français convient à cette déclaration portant sur une apparition supposée antérieure.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre sans introduire une substitution confessionnelle traditionnelle.
- issue: Portée de שׁמע בקול
  choice: ils ne m’écouteront pas
  alternative: ils ne m’obéiront pas
  rationale: Le contexte immédiat concerne le crédit accordé au témoignage de Moïse. Le rendu choisi conserve la possibilité d’une idée d’adhésion sans renforcer prématurément le verbe en « obéir ».
translation_notes:
  register: Français international moderne, naturel et digne. La formule hébraïque « répondit et dit » est dédoublée idiomatiquement en « répondit ». « Mais voilà » garde la force de l’objection et de la particule présentative sans archaïsme. Aucun appel de note n’est nécessaire.
