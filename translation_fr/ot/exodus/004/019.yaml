source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ בְּ/מִדְיָ֔ן לֵ֖ךְ שֻׁ֣ב מִצְרָ֑יִם כִּי מֵ֨תוּ֙ כָּל הָ֣/אֲנָשִׁ֔ים הַֽ/מְבַקְשִׁ֖ים אֶת נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/019.yaml
  text: And Yahweh said to Moses in Midian[a], “Go, return to Egypt, because all the men who were seeking your life are dead.”
translation:
  language: fr
  text: 'Yahweh dit à Moïse, en Madian : « Va, retourne en Égypte, car tous les hommes qui cherchaient à te tuer sont morts. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Forme narrative courante du verbe « dire » ; le passé simple convient au registre narratif biblique en français moderne et digne.
- source_word: בְּמִדְיָן
  choice: en Madian
  rationale: La préposition indique ici le lieu où Yahweh parle à Moïse.
- source_word: לֵךְ שֻׁב
  choice: Va, retourne
  rationale: 'Cette formulation conserve les deux impératifs hébreux : le mouvement exprimé par « va » et le retour exprimé par « retourne ».'
- source_word: מִצְרָיִם
  choice: en Égypte
  rationale: Après « retourner », le français emploie naturellement « en » devant le nom de pays Égypte.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’ordre ; « car » convient naturellement à cette parole directe.
- source_word: מֵתוּ
  choice: sont morts
  rationale: Le passé composé exprime un événement accompli dont le résultat présent rend possible le retour de Moïse.
- source_word: כָּל הָאֲנָשִׁים
  choice: tous les hommes
  rationale: Le nom désigne ici des hommes, et cette traduction en conserve la référence explicite.
- source_word: הַמְבַקְשִׁים
  choice: qui cherchaient
  rationale: Le participe décrit une action prolongée ou caractéristique dans le contexte passé.
- source_word: אֶת נַפְשֶׁךָ
  choice: à te tuer
  rationale: Dans l’expression idiomatique « chercher la vie de quelqu’un », נֶפֶשׁ désigne la vie menacée. « Chercher à te tuer » rend clairement en français l’intention hostile sans suggérer une simple recherche de la personne.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom propre divin sans le remplacer par un titre.
- issue: Sens de l’expression « chercher la vie » de Moïse
  choice: qui cherchaient à te tuer
  alternative: qui en voulaient à ta vie ; qui cherchaient ta vie
  rationale: L’expression hébraïque désigne ceux qui tentaient de faire mourir Moïse. La formulation choisie explicite cet idiome avec naturel, sans ajouter de précision sur leur identité ni sur leurs moyens.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve les deux impératifs hébreux sans alourdir la phrase. Aucun marqueur de note n’est requis, puisque la nuance signalée dans la consultation anglaise est directement préservée dans le texte français.
