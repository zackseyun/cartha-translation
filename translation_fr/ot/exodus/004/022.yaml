id: EXO.4.22
reference: Exodus 4:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֖ אֶל פַּרְעֹ֑ה כֹּ֚ה אָמַ֣ר יְהוָ֔ה בְּנִ֥/י בְכֹרִ֖/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/022.yaml
  text: 'Then you shall say to Pharaoh[a], ‘Thus says Yahweh: Israel is my firstborn son.’'
translation:
  language: fr
  text: 'Tu diras alors au pharaon : « Voici ce que dit Yahweh : Israël est mon fils, mon premier-né.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Israël est mon fils premier-né. »'
    reason: 'Variante syntaxique : l''hébreu peut être compris comme une apposition marquée (« mon fils, mon premier-né ») ou comme un groupe nominal plus étroit (« mon fils premier-né »).'
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Tu diras alors
  rationale: Le parfait qal à la 2e personne masculine singulière, précédé du waw, a ici une valeur directive et séquentielle. « Tu diras alors » rend naturellement ces deux nuances.
- source_word: אֶל־פַּרְעֹה
  choice: au pharaon
  rationale: La préposition אֶל introduit le destinataire. En français, « dire au pharaon » est la construction idiomatique.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Cette formulation française actuelle et digne rend la formule solennelle du messager divin sans l'archaïsme de « Ainsi parle ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: בְּנִי בְכֹרִי
  choice: mon fils, mon premier-né
  rationale: La reprise du suffixe possessif dans chacun des deux termes et l'ordre hébreu sont conservés. Cette formulation préserve aussi la possibilité d'entendre « mon premier-né » comme une apposition mettant en relief le statut d'Israël.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre est conservé selon l'usage français établi; dans la proposition nominale hébraïque, il est identifié au fils et premier-né de Yahweh.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le verset emploie directement le tétragramme. « Yahweh » préserve le nom personnel dans le texte sans lui substituer un titre.
- issue: Métaphore filiale et statut de premier-né d'Israël
  choice: Israël est mon fils, mon premier-né
  alternative: Israël est mon fils premier-né
  rationale: La formulation retenue suit de près l'ordre בְּנִי בְכֹרִי et maintient l'apposition ainsi que son relief. L'alternative est plus compacte en français, mais peut atténuer la répétition emphatique du possessif hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. La formule « Voici ce que dit Yahweh » conserve la solennité de la parole divine tout en évitant une tournure inutilement archaïque. Le deux-points introduit directement la citation, et « pharaon » reste un titre en minuscule selon l'usage français.
