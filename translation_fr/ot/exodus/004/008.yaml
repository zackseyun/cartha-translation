id: EXO.4.8
reference: Exodus 4:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָה֙ אִם לֹ֣א יַאֲמִ֣ינוּ לָ֔/ךְ וְ/לֹ֣א יִשְׁמְע֔וּ לְ/קֹ֖ל הָ/אֹ֣ת הָ/רִאשׁ֑וֹן וְ/הֶֽאֱמִ֔ינוּ לְ/קֹ֖ל הָ/אֹ֥ת הָ/אַחֲרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/008.yaml
  text: And it will be[a], if they do not believe you and do not listen to the voice of the first sign, then they will believe the voice of the latter sign.
translation:
  language: fr
  text: S’ils ne te croient pas et n’écoutent pas la voix du premier signe, ils croiront alors la voix du signe suivant.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du dernier signe ». Le mot hébreu peut désigner ce qui vient après ou ce qui est dernier ; « suivant » n’exclut pas qu’un autre signe soit encore donné.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: S’ils
  rationale: La formule hébraïque introduit une condition future. En français actuel, « S’ils » exprime naturellement cette structure sans alourdir la phrase par un calque tel que « Et il arrivera que, si ».
- source_word: יַאֲמִינוּ לָךְ
  choice: ils ne te croient pas
  rationale: Le hifil de אמן construit avec ל signifie ici croire quelqu’un, tenir son message pour digne de foi. « Te croient » est naturel et n’ajoute pas la nuance théologique de « croire en toi ».
- source_word: יִשְׁמְעוּ
  choice: n’écoutent pas
  rationale: שׁמע peut signifier entendre, écouter ou obéir. Ici, « écouter » conserve l’idée d’un accueil attentif sans imposer le sens plus précis d’obéir.
- source_word: לְקוֹל
  choice: la voix
  rationale: Le texte personnifie le signe comme porteur d’une voix probante. Conserver « voix » préserve cette image hébraïque plutôt que de l’aplanir en « message ».
- source_word: הָאֹת
  choice: signe
  rationale: אוֹת désigne un signe, miraculeux dans ce contexte, mais l’adjectif « miraculeux » n’est pas explicite dans le terme lui-même.
- source_word: הָרִאשׁוֹן
  choice: premier
  rationale: רִאשׁוֹן signifie directement « premier » et établit le contraste avec le signe mentionné ensuite.
- source_word: וְהֶאֱמִינוּ
  choice: ils croiront alors
  rationale: Le verbe constitue le résultat de la condition. « Alors » rend clairement cette valeur en français naturel.
- source_word: הָאַחֲרוֹן
  choice: suivant
  rationale: אַחֲרוֹן peut signifier « postérieur » ou « dernier ». Dans la comparaison immédiate entre les deux signes, « suivant » indique celui qui vient après le premier sans laisser entendre qu’aucun autre signe ne pourra suivre.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conditionnelle est idiomatique plutôt que calquée, tandis que l’expression imagée « la voix du signe » est conservée. Le marqueur de note est placé après « signe suivant », l’élément précis auquel il se rapporte.
