base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/021.yaml
  text: Then Yahweh said to Moses[a], “When you go back to Egypt, see that you do before Pharaoh all the wonders that I have put in your hand. But I will harden his heart[b], and he will not let the people go.”
translation:
  language: fr
  text: 'Puis Yahvé dit à Moïse : « Quand tu retourneras en Égypte, veille à accomplir devant le pharaon tous les prodiges[a] que j’ai mis entre tes mains. Mais moi, j’endurcirai son cœur[b], et il ne laissera pas partir le peuple. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les signes » ou « les miracles ». Le mot hébreu désigne des actes extraordinaires qui manifestent la puissance divine.
    reason: lexical_alternative
  - marker: b
    text: Ou « je fortifierai son cœur » ou « je rendrai son cœur ferme ». Le verbe hébreu peut exprimer l’idée de fortifier ou d’affermir ; ici, il décrit le pharaon confirmé dans son refus obstiné.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française traditionnelle « Yahvé » représente directement le nom divin, plutôt que de le remplacer par un titre.
- source_word: בְּלֶכְתְּךָ לָשׁוּב מִצְרַיְמָה
  choice: Quand tu retourneras en Égypte
  rationale: La construction infinitive exprime naturellement une circonstance temporelle; « retourneras » rend à la fois le déplacement et l’idée de retour.
- source_word: רְאֵה
  choice: veille à
  rationale: Dans ce contexte, l’impératif constitue une consigne exigeant une attention soutenue, et non un simple acte de vision.
- source_word: הַמֹּפְתִים
  choice: les prodiges
  rationale: « Prodiges » désigne des actes extraordinaires manifestant la puissance divine, tout en laissant ouverte leur fonction de signes.
- source_word: שַׂמְתִּי בְיָדֶךָ
  choice: que j’ai mis en ton pouvoir
  rationale: L’expression hébraïque évoque ce qui est placé dans la main de Moïse; l’idiome français « mettre en ton pouvoir » en communique clairement l’idée d’habilitation et d’autorité.
- source_word: וַעֲשִׂיתָם לִפְנֵי פַרְעֹה
  choice: accomplir devant le pharaon
  rationale: « Accomplir » convient naturellement comme verbe régissant « prodiges », tandis que « devant » conserve le cadre public et confrontant.
- source_word: וַאֲנִי
  choice: Mais moi
  rationale: Le contraste discursif entre l’action de Moïse et celle de Dieu est rendu explicitement, et le pronom tonique conserve l’emphase de l’hébreu.
- source_word: אֲחַזֵּק אֶת לִבּוֹ
  choice: j’endurcirai son cœur
  rationale: Dans le récit du pharaon, la forme causative de חזק décrit le fait de rendre son cœur ferme dans son refus; « endurcir » exprime le mieux cette portée contextuelle.
- source_word: וְלֹא יְשַׁלַּח אֶת הָעָם
  choice: et il ne laissera pas partir le peuple
  rationale: Dans le contexte de l’Exode, cette formulation française exprime idiomatiquement le refus d’autoriser le départ du peuple.
theological_decisions:
- issue: L’action divine sur le cœur du pharaon
  choice: j’endurcirai son cœur
  alternative: je fortifierai son cœur / je rendrai son cœur ferme
  rationale: Le verbe חזק peut signifier fortifier ou affermir, mais son emploi causatif dans ce récit présente le pharaon comme confirmé dans son refus. La traduction garde sans l’atténuer la tension entre l’action souveraine de Dieu et la responsabilité humaine.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond au discours direct singulier. « Le pharaon » traite le terme comme un titre défini. Les marqueurs de notes sont placés sur les mots auxquels leurs variantes se rapportent.
