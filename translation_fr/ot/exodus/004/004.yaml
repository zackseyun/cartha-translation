  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה שְׁלַח֙ יָֽדְ/ךָ֔ וֶ/אֱחֹ֖ז בִּ/זְנָב֑/וֹ וַ/יִּשְׁלַ֤ח יָד/וֹ֙ וַ/יַּ֣חֲזֶק בּ֔/וֹ וַ/יְהִ֥י לְ/מַטֶּ֖ה בְּ/כַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/004.yaml
  text: Then Yahweh said to Moses[a], “Reach out your hand and take hold of its tail.” So he reached out his hand and took hold of it[b], and it became a staff in his hand.
translation:
  language: fr
  text: 'Alors Yahweh dit à Moïse : « Tends la main et saisis-le par la queue[a]. » Moïse tendit la main et le saisit ; il devint alors un bâton[b] dans sa main.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « attrape-le par la queue ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une verge ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin exprimé dans le texte hébreu au lieu de lui substituer un titre.
- source_word: שְׁלַח יָדְךָ
  choice: Tends la main
  rationale: Expression française naturelle qui rend directement le geste commandé par שׁלח avec « main ».
- source_word: וֶאֱחֹז בִּזְנָבוֹ
  choice: saisis-le par la queue
  rationale: Rend אָחַז par un verbe concret et restitue naturellement la construction avec ב comme indication de la partie par laquelle l’animal doit être saisi.
- source_word: וַיַּחֲזֶק בּוֹ
  choice: le saisit
  rationale: Dans ce contexte, חזק avec ב décrit le fait de prendre fermement l’animal. La répétition de « saisir » conserve l’écho narratif de l’ordre sans surtraduire la force du geste.
- source_word: וַיְהִי לְמַטֶּה
  choice: il devint alors un bâton
  rationale: Le verbe היה avec ל marque ici un changement d’état. « Bâton » est le terme français courant correspondant à מַטֶּה dans ce contexte.
- source_word: בְּכַפּוֹ
  choice: dans sa main
  rationale: כַּף peut désigner la paume, mais « dans sa main » est l’expression idiomatique française appropriée ici.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Yahvé ; le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel sans le remplacer par un titre ; « Yahvé » est une autre transcription française traditionnelle.
translation_notes:
  register: Français international moderne, narratif et digne. Le sujet « Moïse » est répété dans la seconde phrase pour éviter une ambiguïté passagère entre Yahweh et Moïse. Le point-virgule garde étroitement unies la saisie et la transformation.
