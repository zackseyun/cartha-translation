  yaml_path: translation/ot/exodus/004/016.yaml
  text: He will speak to the people for you[a], and he will be as a mouth for you[b], and you will be as God to him.
translation:
  language: fr
  text: Il parlera pour toi au peuple, et il te servira de bouche, et toi, tu seras pour lui comme Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu seras pour lui Dieu ». Moïse exercera envers Aaron un rôle d’autorité et lui transmettra la parole que Dieu lui confie.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְדִבֶּר הוּא לְךָ אֶל־הָעָם
  choice: Il parlera pour toi au peuple
  rationale: 'Le piel de דבר signifie ici « parler », et לְךָ a une valeur représentative : Aaron parlera au peuple au nom de Moïse.'
- source_word: וְהָיָה הוּא יִהְיֶה לְּךָ לְפֶה
  choice: et il te servira de bouche
  rationale: Cette formulation française naturelle conserve la métaphore hébraïque de la « bouche » et exprime la fonction de porte-parole d’Aaron. La construction emphatique הוּא יִהְיֶה souligne que c’est bien lui qui remplira ce rôle.
- source_word: וְאַתָּה תִּהְיֶה לּוֹ לֵאלֹהִים
  choice: tandis que toi, tu seras pour lui comme Dieu
  rationale: La tournure préserve le contraste emphatique entre Aaron et Moïse ainsi que la forte métaphore relationnelle, tout en indiquant naturellement en français qu’il s’agit d’un rôle représentatif plutôt que de l’identité divine de Moïse.
theological_decisions:
- issue: La portée de לֵאלֹהִים appliqué à Moïse
  choice: comme Dieu
  alternative: Dieu
  rationale: L’hébreu peut se rendre formellement par « Dieu », sans marque comparative explicite. Dans le contexte, Moïse transmet à Aaron la parole reçue de Dieu et occupe envers lui une fonction d’autorité et de médiation. « Comme Dieu » rend cette relation sans attribuer la divinité à Moïse; la note conserve la formulation plus littérale.
translation_notes:
  register: Français international moderne, digne et accessible. « Servir de bouche » conserve l’image hébraïque tout en étant plus idiomatique que « être une bouche ». Le contraste « lui… toi » reflète l’insistance des pronoms hébreux.
