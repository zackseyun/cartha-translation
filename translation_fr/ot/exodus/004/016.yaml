  text: וְ/דִבֶּר ה֥וּא לְ/ךָ֖ אֶל הָ/עָ֑ם וְ/הָ֤יָה הוּא֙ יִֽהְיֶה לְּ/ךָ֣ לְ/פֶ֔ה וְ/אַתָּ֖ה תִּֽהְיֶה לּ֥/וֹ לֵֽ/אלֹהִֽים־־־־׃
base_translation:
