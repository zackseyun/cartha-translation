base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/018.yaml
  text: Then Moses went and returned to Jethro his father-in-law and said to him[a], “Please let me go and return to my brothers who are in Egypt, so that I may see whether they are still alive.” And Jethro said to Moses[b], “Go in peace.”
translation:
  language: fr
  text: 'Moïse partit et retourna auprès de Jéther[a], son beau-père. Il lui dit : « Permets-moi, je te prie, de partir et de retourner auprès de mes frères[b] qui sont en Égypte, pour voir s’ils sont encore en vie. » Jéthro dit à Moïse : « Va en paix. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici la forme « Jéther », puis « Jéthro » à la fin du verset ; les deux formes désignent manifestement la même personne.
    reason: textual_variant
  - marker: b
    text: Le terme hébreu signifie littéralement « mes frères » ; selon le contexte, il peut aussi désigner des proches ou des compatriotes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: partit donc
  rationale: Le wayyiqtol fait progresser le récit ; « donc » marque naturellement la transition en français sans la surinterpréter.
- source_word: וַיָּשָׁב
  choice: retourna auprès de
  rationale: שׁוּב signifie couramment « retourner » ; « auprès de » convient naturellement à la destination personnelle introduite ici.
- source_word: יֶתֶר / יִתְרוֹ
  choice: Jéther / Jéthro
  rationale: Le texte hébreu emploie effectivement יֶתֶר à la première occurrence et יִתְרוֹ à la seconde. Conserver les deux formes respecte l’évidence du texte source, avec une note précisant qu’elles désignent la même personne.
- source_word: חֹתְנוֹ
  choice: son beau-père
  rationale: Dans ce contexte, il s’agit du père de l’épouse de Moïse ; « beau-père » est précis et idiomatique.
- source_word: אֵלֲכָה נָּא
  choice: Permets-moi, je te prie, de partir
  rationale: Le cohortatif accompagné de נָא exprime une demande déférente. Cette formulation française en conserve la politesse et la solennité naturelle.
- source_word: וְאָשׁוּבָה
  choice: et de retourner
  rationale: Le second cohortatif poursuit la demande ; « retourner » maintient aussi le lien lexical avec וַיָּשָׁב.
- source_word: אַחַי
  choice: mes frères
  rationale: C’est le sens littéral de l’hébreu. Le terme peut désigner plus largement les compatriotes ou les proches, possibilité signalée en note.
- source_word: וְאֶרְאֶה
  choice: pour voir
  rationale: L’infinitif français exprime clairement et naturellement la valeur de but du cohortatif dans ce contexte.
- source_word: הַעוֹדָם חַיִּים
  choice: s’ils sont encore en vie
  rationale: La formulation préserve l’interrogation indirecte et l’incertitude exprimées par l’hébreu, dans un français courant.
- source_word: לֵךְ לְשָׁלוֹם
  choice: Va en paix
  rationale: Équivalent français établi de cette formule hébraïque de bénédiction et de congé paisible.
