  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו מִ֣י שָׂ֣ם פֶּה֮ לָֽ/אָדָם֒ א֚וֹ מִֽי יָשׂ֣וּם אִלֵּ֔ם א֣וֹ חֵרֵ֔שׁ א֥וֹ פִקֵּ֖חַ א֣וֹ עִוֵּ֑ר הֲ/לֹ֥א אָנֹכִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/011.yaml
  text: And the LORD said to him, “Who has put a mouth on man? Or who makes one mute, or deaf, or sighted, or blind? Is it not I, the LORD?”
translation:
  language: fr
  text: 'Le SEIGNEUR lui dit : « Qui a donné une bouche à l’être humain ? Qui le rend muet ou sourd, voyant ou aveugle ? N’est-ce pas moi, le SEIGNEUR ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme selon la convention française largement reçue, en petites capitales dans la mise en forme éditoriale si disponible.
- source_word: מִי שָׂם פֶּה לָאָדָם
  choice: Qui a donné une bouche à l’être humain ?
  rationale: « Donner une bouche » exprime naturellement en français l’action créatrice indiquée par שָׂם, sans durcir l’expression en un littéral peu idiomatique « placer une bouche sur ».
- source_word: אִלֵּם ... חֵרֵשׁ ... פִקֵּחַ ... עִוֵּר
  choice: muet ou sourd, voyant ou aveugle
  rationale: Conserve les quatre états opposés et l’ordre hébreu. « Voyant » rend פִקֵּחַ ici comme capacité de voir, en parallèle avec « aveugle ».
- source_word: הֲלֹא אָנֹכִי יְהוָה
  choice: N’est-ce pas moi, le SEIGNEUR ?
  rationale: Préserve la question rhétorique emphatique et l’auto-identification divine.
theological_decisions:
- issue: L’affirmation de la souveraineté divine sur la parole, l’ouïe et la vue
  choice: Traduire directement « Qui le rend… ? N’est-ce pas moi… ? »
  alternative: Atténuer par « Qui permet qu’il soit… ? »
  rationale: Le texte hébreu emploie יָשׂוּם et attribue explicitement ces états à YHWH. Une formulation permissive introduirait une distinction théologique absente du verset et en réduirait la tension.
translation_notes:
  register: Français moderne, international et digne. « L’être humain » évite que אָדָם soit compris comme désignant exclusivement l’homme masculin. La structure interrogative et le parallélisme sont conservés.
