  yaml_path: translation/ot/exodus/004/002.yaml
  text: And Yahweh said to him[a], “What is that in your hand?” And he said, “A staff.”
translation:
  language: fr
  text: 'Yahweh lui dit : « Qu’est-ce que tu as dans ta main ? » Il dit : « Un bâton[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une verge » ou « une canne ». Le mot hébreu מַטֶּה peut désigner différents types de bâton selon le contexte.
    reason: 'Alternative lexicale : le terme hébreu a une gamme de sens plus large que le seul mot français « bâton ».'
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel révélé dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: dit… dit
  rationale: La répétition du verbe hébreu אמר est conservée. Même si le second emploi introduit une réponse, « dit » reste clair et naturel en français.
- source_word: אֵלָיו
  choice: lui
  rationale: 'Le pronom indirect français rend naturellement la préposition hébraïque avec son suffixe : « à lui ».'
- source_word: מַה־זֶּה / מִזֶּה
  choice: Qu’est-ce que tu as
  rationale: Cette formulation idiomatique française exprime clairement la demande d’identifier l’objet visible que Moïse tient, sans alourdir la phrase par un calque peu naturel.
- source_word: בְּיָדֶךָ
  choice: dans la main
  rationale: 'La tournure conserve le sens concret de l’hébreu : il s’agit de l’objet physiquement tenu par Moïse.'
- source_word: מַטֶּה
  choice: un bâton
  rationale: « Bâton » est le terme français moderne le plus naturel pour l’objet porté par Moïse. Le nom hébreu peut aussi désigner une verge ou une canne selon le contexte, d’où la note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: La translittération « Yahweh » préserve le nom personnel présent dans le texte hébreu sans lui substituer un titre ni adopter la forme traditionnelle « Jéhovah ».
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement correspond à l’adresse directe au singulier. La question est formulée idiomatiquement plutôt que calquée mot à mot, tandis que la répétition « dit… dit » conserve un trait notable de l’hébreu.
