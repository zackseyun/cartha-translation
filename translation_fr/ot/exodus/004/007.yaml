base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/007.yaml
  text: And he said[a], “Put your hand back into your bosom.” So he put his hand back into his bosom, and when he brought it out from his bosom, behold[b], it had returned like his flesh.
translation:
  language: fr
  text: 'Il dit : « Remets ta main dans ton sein[a]. » Il remit donc sa main dans son sein, puis l’en retira. Et voici qu’elle était redevenue pareille au reste de sa chair[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme peut désigner le sein ou le pli du vêtement situé contre la poitrine.
    reason: cultural_note
  - marker: b
    text: Littéralement « comme sa chair » ; autrement dit, sa main avait retrouvé son état normal.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב
  choice: Remets
  rationale: Le hiphil impératif de שוב demande de faire revenir la main à l’endroit précédent. « Remets » est naturel en français et conserve l’idée de retour.
- source_word: חֵיק
  choice: le pli de ton vêtement, contre ta poitrine
  rationale: חֵיק peut désigner la poitrine ou le repli du vêtement situé contre elle. Cette formulation explicite sobrement le geste sans employer l’archaïque ou ambigu « sein ».
- source_word: וַיָּשֶׁב
  choice: Il remit
  rationale: Cette forme narrative de שוב reprend l’ordre précédent ; la répétition de « remit » maintient ce lien dans un français fluide.
- source_word: וַיּוֹצִאָהּ
  choice: la ressortit
  rationale: Le hiphil de יצא signifie ici faire sortir. « La ressortit » rend à la fois la sortie et la répétition du geste après que la main a été remise dans le vêtement.
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: La particule attire l’attention sur le résultat surprenant. « Et voici » en conserve la force narrative et le ton digne.
- source_word: שָׁבָה
  choice: était redevenue
  rationale: Le verbe indique que la main est revenue à son état antérieur. « Était redevenue » exprime ce retour sans introduire explicitement l’idée interprétative de guérison.
- source_word: כִּבְשָׂרוֹ
  choice: pareille au reste de sa chair
  rationale: 'Le préfixe כ־ marque la comparaison et בשר désigne la chair. L’ajout de « reste de » rend en français le sens contextuel : la main avait retrouvé l’apparence normale de la chair de Moïse.'
