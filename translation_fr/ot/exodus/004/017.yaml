source:
  edition: WLC
  text: וְ/אֶת הַ/מַּטֶּ֥ה הַ/זֶּ֖ה תִּקַּ֣ח בְּ/יָדֶ֑/ךָ אֲשֶׁ֥ר תַּעֲשֶׂה בּ֖/וֹ אֶת הָ/אֹתֹֽת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/017.yaml
  text: And take this staff in your hand[b][a], with which you will perform the signs.
translation:
  language: fr
  text: Prends ce bâton dans ta main[a], avec lequel tu accompliras les signes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « verge ». Le mot hébreu peut désigner un bâton ou une verge ; « bâton » convient bien au contexte pastoral de Moïse.
    reason: lexical_alternative
  - marker: b
    text: Ou « les signes miraculeux ». L’hébreu dit simplement « les signes » ; leur caractère extraordinaire ressort du contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Prends
  rationale: Le וְ relie l’ordre aux instructions précédentes. En français, le lien peut rester implicite afin d’éviter un « Et » peu naturel en tête de phrase ; אֶת, marqueur de l’objet direct, n’est pas rendu séparément.
- source_word: הַמַּטֶּה הַזֶּה
  choice: ce bâton
  rationale: מַטֶּה désigne un bâton ou une verge. « Bâton » convient au contexte pastoral de Moïse et הַזֶּה désigne l’objet précis déjà mentionné.
- source_word: תִּקַּח
  choice: Prends
  rationale: L’inaccompli qal à la deuxième personne du masculin singulier a ici une valeur injonctive, naturellement rendue par l’impératif français.
- source_word: בְּיָדֶךָ
  choice: dans ta main
  rationale: Rendu direct et idiomatique de la locution hébraïque, qui souligne que Moïse doit avoir le bâton en main.
- source_word: אֲשֶׁר ... בּוֹ
  choice: c’est avec lui que
  rationale: La construction relative et בּוֹ présentent le bâton comme l’instrument employé. La tournure clivée est naturelle en français et conserve cette valeur instrumentale.
- source_word: תַּעֲשֶׂה
  choice: tu accompliras
  rationale: עָשָׂה signifie largement « faire » ; avec des signes, « accomplir » est idiomatique, sans ajouter explicitement l’idée de miracle.
- source_word: הָאֹתֹת
  choice: les signes
  rationale: Le substantif défini renvoie aux signes déjà présentés. « Les signes » préserve la sobriété du texte hébreu sans introduire dans le corps du verset le qualificatif interprétatif « miraculeux ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse divine singulière à Moïse. La formulation conserve l’article défini de « les signes » et la fonction instrumentale du bâton.
