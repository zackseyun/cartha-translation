  text: וַ/יְדַבֵּ֣ר אַהֲרֹ֔ן אֵ֚ת כָּל הַ/דְּבָרִ֔ים אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֑ה וַ/יַּ֥עַשׂ הָ/אֹתֹ֖ת לְ/עֵינֵ֥י הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/030.yaml
  text: Aaron spoke all the words that Yahweh had spoken to Moses[a], and he performed the signs before the eyes of the people.
translation:
  language: fr
  text: Aaron dit toutes les paroles que Yahweh avait dites à Moïse, et il accomplit les signes sous les yeux du peuple.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: rapporta
  rationale: Dans ce contexte, Aaron communique au peuple les paroles reçues par Moïse. « Rapporta » rend naturellement cette prise de parole sans réduire הַדְּבָרִים à un simple « tout ».
- source_word: אֵת כָּל הַדְּבָרִים
  choice: toutes les paroles
  rationale: Cette formulation conserve le caractère concret de l’hébreu et le lien lexical avec le verbe « dire » de la proposition relative.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: que Yahweh avait dites à Moïse
  rationale: Le plus-que-parfait marque naturellement en français l’antériorité des paroles de Yahweh dans le récit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וַיַּעַשׂ
  choice: accomplit
  rationale: Avec « les signes », « accomplit » exprime naturellement la réalisation des actes ordonnés sans ajouter explicitement le qualificatif « miraculeux ».
- source_word: הָאֹתֹת
  choice: les signes
  rationale: Le contexte indique des signes d’authentification; la traduction sobre « les signes » conserve la formulation du texte sans explicitation superflue.
- source_word: לְעֵינֵי הָעָם
  choice: sous les yeux du peuple
  rationale: Cette expression française naturelle préserve l’image visuelle de l’expression hébraïque.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom propre au lieu de le remplacer par un titre.
- issue: Identité du sujet de וַיַּעַשׂ (« il accomplit »)
  choice: Conserver le pronom ambigu « il » et signaler l’ambiguïté en note
  alternative: Aaron accomplit / Moïse accomplit
  rationale: Le verbe hébreu ne nomme pas de nouveau son sujet. Aaron est le sujet principal de la phrase, tandis que Moïse est le dernier homme mentionné et que le contexte lui associe les signes. La traduction ne tranche donc pas ce que le texte laisse implicite.
translation_notes:
  register: Français international moderne, clair et digne. « Rapporta toutes les paroles » maintient la formulation concrète de l’hébreu; « sous les yeux » en conserve l’image sans produire un calque lourd.
