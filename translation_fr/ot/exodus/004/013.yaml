reference: Exodus 4:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר בִּ֣י אֲדֹנָ֑/י שְֽׁלַֽח נָ֖א בְּ/יַד תִּשְׁלָֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/013.yaml
  text: But he said[a], “Please, my Lord, send by the hand of whomever you will send.”
translation:
  language: fr
  text: 'Mais il dit : « De grâce, Seigneur, envoie qui tu voudras envoyer[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus interprétative : « De grâce, Seigneur, envoie quelqu’un d’autre. »'
    reason: Lecture alternative explicitant la réticence implicite de Moïse.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mais il dit
  rationale: 'Le waw consécutif fait avancer le récit, mais le contexte donne ici une valeur adversative : Moïse continue de résister après les réponses de Dieu.'
- source_word: בִּי
  choice: De grâce
  rationale: Dans cette formule suivie d’une adresse respectueuse, בִּי exprime une supplication polie plutôt que son sens littéral. « De grâce » convient au registre digne de la scène.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Il s’agit d’une adresse révérencieuse à Dieu, et non du nom divin יהוה. En français, « Seigneur » exprime naturellement cette adresse; le possessif hébreu n’a pas besoin d’être rendu par « mon Seigneur ».
- source_word: שְׁלַח נָא
  choice: envoie
  rationale: L’impératif de שלח est rendu directement par « envoie ». La nuance suppliante de נָא est portée par la formule « De grâce » au début de la demande, ce qui évite une répétition peu naturelle en français.
- source_word: בְּיַד
  choice: par l’intermédiaire de, exprimé idiomatiquement dans « envoie qui… »
  rationale: L’expression hébraïque « par la main de » marque ici l’intermédiaire ou l’agent. La tournure française « envoie qui… » transmet cette fonction sans calque obscur ou lourd.
- source_word: תִּשְׁלָח
  choice: tu voudras envoyer
  rationale: Cette formulation conserve la reprise du verbe שלח et l’indétermination de la demande. « Voudras » rend naturellement en français la valeur ouverte de l’inaccompli dans cette construction, sans introduire explicitement « quelqu’un d’autre ».
theological_decisions:
- issue: Interprétation de la demande évasive de Moïse
  choice: 'Conserver dans le texte l’ambiguïté : « envoie qui tu voudras envoyer »'
  alternative: « De grâce, Seigneur, envoie quelqu’un d’autre. »
  rationale: Le contexte montre la réticence de Moïse, mais l’hébreu ne dit pas explicitement « quelqu’un d’autre ». Le texte principal garde donc son détour ambigu, tandis que la note fournit l’interprétation contextuelle courante.
translation_notes:
  register: Français international actuel, simple et digne. « De grâce » maintient le ton respectueux de la supplication; « envoie qui tu voudras envoyer » reste compréhensible tout en conservant l’évasion et la répétition verbale de l’hébreu.
