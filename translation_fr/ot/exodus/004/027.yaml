  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶֽל אַהֲרֹ֔ן לֵ֛ךְ לִ/קְרַ֥את מֹשֶׁ֖ה הַ/מִּדְבָּ֑רָ/ה וַ/יֵּ֗לֶךְ וַֽ/יִּפְגְּשֵׁ֛/הוּ בְּ/הַ֥ר הָ/אֱלֹהִ֖ים וַ/יִּשַּׁק לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/027.yaml
  text: And Yahweh said to Aaron[a], “Go into the wilderness to meet Moses.” So he went and met him at the mountain of God and kissed him.
translation:
  language: fr
  text: 'Yahweh dit à Aaron : « Va dans le désert à la rencontre de Moïse[a]. » Aaron partit donc, le rencontra à la montagne de Dieu et l’embrassa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Va à la rencontre de Moïse dans le désert. » La forme hébraïque de « désert » marque une direction ; la construction peut mettre davantage l’accent soit sur le désert comme destination, soit sur le lieu prévu de la rencontre.'
    reason: La syntaxe permet de rattacher différemment l’indication du désert au déplacement et à la rencontre.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לֵךְ
  choice: Va
  rationale: L’impératif de הלך appelle ici une formulation directe, brève et naturelle en français.
- source_word: לִקְרַאת מֹשֶׁה
  choice: à la rencontre de Moïse
  rationale: לִקְרַאת exprime le mouvement en vue d’une rencontre ; cette locution française en rend naturellement le sens et la finalité.
- source_word: הַמִּדְבָּרָה
  choice: dans le désert
  rationale: La terminaison directionnelle indique un mouvement vers le désert. Dans la phrase française, « Va dans le désert » exprime clairement cette destination, tout en laissant la note signaler une autre articulation possible.
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: le rencontra
  rationale: פגשׁ désigne ici une rencontre effective et reprend naturellement l’ordre précédent.
- source_word: בְּהַר הָאֱלֹהִים
  choice: à la montagne de Dieu
  rationale: Cette formulation conserve le syntagme construit hébreu. « À » situe la rencontre auprès de la montagne sans préciser plus que le texte si elle eut lieu sur ses pentes ou à proximité.
- source_word: וַיִּשַּׁק לוֹ
  choice: l’embrassa
  rationale: Le verbe נשׁק signifie « embrasser, donner un baiser ». Dans ce contexte de retrouvailles fraternelles, « l’embrassa » est idiomatique sans ajouter explicitement une interprétation cérémonielle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: « Yahweh » représente directement le nom propre hébreu et évite de le remplacer par un titre, sans introduire de précision doctrinale étrangère au verset.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple maintient la cadence du récit biblique sans archaïsme marqué. La répétition des coordinations hébraïques est légèrement allégée, tandis que la succession des actions et l’ambiguïté spatiale sont conservées.
