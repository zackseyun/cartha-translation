id: EXO.4.24
reference: Exodus 4:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֥י בַ/דֶּ֖רֶךְ בַּ/מָּל֑וֹן וַ/יִּפְגְּשֵׁ֣/הוּ יְהוָ֔ה וַ/יְבַקֵּ֖שׁ הֲמִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/024.yaml
  text: And it happened on the way[a], at the lodging place[b], that Yahweh met him and sought to put him to death.
translation:
  language: fr
  text: Il arriva qu’en chemin, à un lieu d’étape[b], Yahweh le rencontra[a] et chercha à le faire mourir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu ne précise pas qui est désigné par « le » ; il peut s’agir de Moïse ou, selon certaines interprétations, de son fils.
    reason: alternative_reading
  - marker: b
    text: Ou « à l’endroit où l’on passait la nuit ». Le terme hébreu désigne un lieu où l’on loge pour la nuit, pas nécessairement une auberge commerciale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Il arriva que
  rationale: Cette tournure introduit naturellement un nouvel épisode narratif tout en restant proche de la fonction du wayyiqtol hébreu.
- source_word: בַדֶּרֶךְ
  choice: en chemin
  rationale: Expression française idiomatique qui rend directement la valeur locative de l’hébreu.
- source_word: בַמָּלוֹן
  choice: à un lieu d’étape
  rationale: מָלוֹן désigne un endroit où l’on s’arrête pour passer la nuit, sans impliquer nécessairement une auberge commerciale.
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: le rencontra
  rationale: Le verbe פגע peut exprimer une rencontre ou une confrontation. « Rencontra » en conserve le sens fondamental, tandis que la proposition suivante établit le caractère menaçant de la scène.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וַיְבַקֵּשׁ
  choice: chercha
  rationale: בקש signifie couramment « chercher ». Cette formulation préserve la nuance verbale et la tension du récit sans réduire le sens à une simple intention.
- source_word: הֲמִיתוֹ
  choice: à le faire mourir
  rationale: Le hifil de מות exprime ici le fait de causer la mort. « Faire mourir » est clair, digne et proche de la forme causative hébraïque.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le verset emploie directement le tétragramme. « Yahweh » préserve le nom personnel du texte source sans lui substituer un titre.
- issue: Référent des suffixes pronominaux masculins singuliers
  choice: Conserver l’ambiguïté par le pronom « le »
  alternative: Moïse ; son fils
  rationale: L’antécédent n’est pas nommé dans ce verset. L’expliciter dans le corps du texte résoudrait une ambiguïté réelle de l’hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. « Lieu d’étape » évite l’anachronisme possible d’« auberge ». L’ordre des marqueurs place chaque note immédiatement après l’expression qu’elle explique.
