source:
  edition: WLC
  text: לְמַ֣עַן יַאֲמִ֔ינוּ כִּֽי נִרְאָ֥ה אֵלֶ֛י/ךָ יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑/ם אֱלֹהֵ֧י אַבְרָהָ֛ם אֱלֹהֵ֥י יִצְחָ֖ק וֵ/אלֹהֵ֥י יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/005.yaml
  text: so that they may believe that Yahweh[a], the God of their fathers, the God of Abraham, the God of Isaac, and the God of Jacob[b], has appeared to you.
translation:
  language: fr
  text: afin qu’ils croient que Yahweh[a], le Dieu de leurs pères[b], le Dieu d’Abraham, le Dieu d’Isaac et le Dieu de Jacob, t’est apparu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH »; traditionnellement rendu par « le SEIGNEUR ». Une autre translittération est « Jéhovah ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « leurs ancêtres ». L’hébreu dit plus littéralement « leurs pères ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: afin que
  rationale: Introduit le but des signes; « afin que » exprime clairement cette visée dans un français naturel et soutenu.
- source_word: יַאֲמִינוּ
  choice: ils croient
  rationale: Dans ce contexte, le hiphil de אמן désigne le fait de tenir pour vraie la révélation attestée par les signes.
- source_word: כִּי
  choice: que
  rationale: Introduit ici le contenu de ce qu’ils doivent croire, et non une proposition causale.
- source_word: נִרְאָה אֵלֶיךָ
  choice: t’est apparu
  rationale: Le niphal de ראה signifie couramment « apparaître »; le passé composé présente l’apparition accomplie comme pertinente pour la mission actuelle de Moïse.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin YHWH plutôt que de lui substituer un titre, tout en signalant en note l’usage français traditionnel.
- source_word: אֱלֹהֵי אֲבֹתָם
  choice: le Dieu de leurs pères
  rationale: Conserve le masculin pluriel et l’expression généalogique de l’hébreu; « ancêtres » reste une possibilité explicitée en note.
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: le Dieu d’Abraham, le Dieu d’Isaac et le Dieu de Jacob
  rationale: Maintient la répétition solennelle de « le Dieu de » devant chacun des trois patriarches.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le nom propre divin YHWH. « Yahweh » le représente directement sans remplacer par un titre; la note documente les autres usages établis.
- issue: Portée du terme אֲבֹתָם
  choice: leurs pères
  alternative: leurs ancêtres
  rationale: « Leurs pères » reflète formellement le masculin pluriel et le cadre patriarcal immédiat, tandis que « leurs ancêtres » exprime plus largement la portée généalogique possible.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la cadence solennelle de l’énumération hébraïque sans archaïsme; l’élision « t’est apparu » est idiomatique et garde le destinataire masculin singulier du texte source.
