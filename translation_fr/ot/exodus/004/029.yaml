  text: Then Moses and Aaron went and gathered all the elders of the sons of Israel[a].
translation:
  language: fr
  text: Alors, Moïse et Aaron partirent et rassemblèrent tous les anciens des fils d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Israélites »; traditionnellement, « des enfants d’Israël ».
    reason: Alternative lexicale pour בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: partirent donc
  rationale: Le wayyiqtol fait avancer le récit. « Partirent » rend naturellement le déplacement entrepris, tandis que « donc » marque ici l’enchaînement narratif. Bien que le verbe hébreu soit au singulier devant deux sujets coordonnés, le français exige le pluriel.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Moïse et Aaron
  rationale: Formes françaises usuelles des noms propres bibliques.
- source_word: וַיַּאַסְפוּ
  choice: rassemblèrent
  rationale: Le verbe אסף désigne ici l’action de réunir des personnes; « rassemblèrent » est naturel et précis dans ce contexte.
- source_word: כָּל זִקְנֵי
  choice: tous les anciens
  rationale: כָּל exprime la totalité, et זִקְנֵי désigne les responsables reconnus de la communauté tout en conservant sa relation lexicale avec l’âge.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: des fils d’Israël
  rationale: Cette formulation conserve l’expression hébraïque explicite de filiation et sa nuance d’identité ancestrale; « les Israélites » constitue une formulation française plus idiomatique signalée en note.
theological_decisions:
- issue: Traduction de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites; les enfants d’Israël
  rationale: Le texte exprime l’identité du peuple par sa filiation avec Israël/Jacob. La traduction principale préserve cette forme sans réduire l’expression à un simple ethnonyme; la note fournit les équivalents idiomatique et traditionnel.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple convient au registre narratif biblique écrit. L’ordre des actions et la formulation de filiation de l’hébreu sont conservés sans reproduire l’accord singulier propre à la syntaxe source.
