  text: וָ/אֹמַ֣ר אֵלֶ֗י/ךָ שַׁלַּ֤ח אֶת בְּנִ/י֙ וְ/יַֽעַבְדֵ֔/נִי וַ/תְּמָאֵ֖ן לְ/שַׁלְּח֑/וֹ הִנֵּה֙ אָנֹכִ֣י הֹרֵ֔ג אֶת בִּנְ/ךָ֖ בְּכֹרֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/023.yaml
  text: And I said to you, ‘Send out my son so that he may serve me,’ but you refused to send him out. Look, I am about to kill your son, your firstborn.
translation:
  language: fr
  text: 'Je t’ai dit : « Laisse partir mon fils pour qu’il me serve », mais tu as refusé de le laisser partir. Voici, je vais tuer ton fils, ton premier-né.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלַּח
  choice: Laisse partir
  rationale: Dans cette confrontation avec le pharaon, l’expression idiomatique française rend naturellement l’ordre de libérer et de laisser partir, sans affaiblir l’impératif hébreu.
- source_word: וְיַעַבְדֵנִי
  choice: pour qu’il me serve
  rationale: Le verbe עבד peut désigner le service ou le culte. « Servir » conserve ici cette amplitude, importante dans le contexte de l’Exode.
- source_word: הִנֵּה
  choice: Eh bien
  rationale: Marque avec naturel l’annonce solennelle et menaçante qui résulte du refus du pharaon.
- source_word: אָנֹכִי הֹרֵג
  choice: je vais faire mourir
  rationale: La construction présente l’action divine comme imminente. « Faire mourir » exprime directement la causalité sans suggérer nécessairement le mode d’exécution.
- source_word: בְּכֹרֶךָ
  choice: ton premier-né
  rationale: Équivalent précis du nom hébreu, placé en apposition à « ton fils ».
theological_decisions:
- issue: Sens de עבד dans la demande divine
  choice: me serve
  alternative: me rende un culte
  rationale: « Servir » préserve la double portée possible de service et de culte, sans réduire le terme à un acte liturgique.
- issue: Agentivité divine dans הֹרֵג
  choice: je vais faire mourir
  alternative: je vais tuer
  rationale: Le français retenu affirme pleinement l’action et le jugement de Dieu tout en restant digne et sans préciser un mécanisme que l’hébreu ne développe pas ici.
translation_notes:
  register: Français international moderne, direct et solennel. Le parallélisme « mon fils / ton fils » et la répétition de « laisser partir » sont conservés afin de faire ressortir la logique du jugement.
