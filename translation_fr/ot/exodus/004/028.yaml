  text: וַ/יַּגֵּ֤ד מֹשֶׁה֙ לְ/אַֽהֲרֹ֔ן אֵ֛ת כָּל דִּבְרֵ֥י יְהוָ֖ה אֲשֶׁ֣ר שְׁלָח֑/וֹ וְ/אֵ֥ת כָּל הָ/אֹתֹ֖ת אֲשֶׁ֥ר צִוָּֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/028.yaml
  text: Moses told Aaron all the words of Yahweh who had sent him[a], and all the signs that he had commanded him.
translation:
  language: fr
  text: Moïse rapporta à Aaron toutes les paroles de Yahweh, qui l’avait envoyé[a], ainsi que tous les signes qu’il lui avait commandé d’accomplir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toutes les paroles de Yahweh avec lesquelles il l’avait envoyé ». La proposition relative hébraïque peut être rattachée étroitement aux « paroles » ; dans les deux cas, Yahweh est celui qui a envoyé Moïse.'
    reason: Lecture syntaxique alternative.
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: rapporta
  rationale: Le hifil de נגד signifie ici « faire connaître, raconter ». « Rapporta » convient à la scène où Moïse transmet à Aaron ce que Dieu lui a dit, dans un registre narratif digne et naturel.
- source_word: דִּבְרֵי יְהוָה
  choice: les paroles de Yahweh
  rationale: דָּבָר peut désigner une parole, une affaire ou un message. Le pluriel avec כָּל est conservé afin de représenter directement l’ensemble des paroles constituant la mission confiée à Moïse.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: אֲשֶׁר שְׁלָחוֹ
  choice: qui l’avait envoyé
  rationale: Cette lecture rattache naturellement la proposition relative à Yahweh et exprime que Yahweh avait envoyé Moïse. L’autre rattachement syntaxique possible aux « paroles » est conservé en note.
- source_word: הָאֹתֹת
  choice: les signes
  rationale: אוֹת désigne un signe, souvent miraculeux dans l’Exode. « Signes » reste précis sans ajouter explicitement une qualification absente de l’hébreu.
- source_word: אֲשֶׁר צִוָּהוּ
  choice: qu’il lui avait commandé d’accomplir
  rationale: L’hébreu dit littéralement que Dieu les avait commandés à Moïse. Le complément « d’accomplir » explicite en français l’action sous-entendue à l’égard des signes, sans changer le sens contextuel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie le tétragramme comme nom propre. « Yahweh » le conserve sans lui substituer un titre.
- issue: Rattachement de אֲשֶׁר שְׁלָחוֹ
  choice: 'la relative qualifie Yahweh : « qui l’avait envoyé »'
  alternative: 'la relative se rattache aux paroles : « avec lesquelles il l’avait envoyé »'
  rationale: La syntaxe hébraïque permet les deux rattachements. Le texte principal retient la lecture personnelle la plus naturelle en français, tandis que la note préserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, clair et digne. « Rapporta », « paroles » et « signes » maintiennent un registre narratif soutenu sans archaïsme. La ponctuation et la note rendent visible l’ambiguïté du relatif hébreu.
