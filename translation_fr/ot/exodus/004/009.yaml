  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֡ה אִם לֹ֣א יַאֲמִ֡ינוּ גַּם֩ לִ/שְׁנֵ֨י הָ/אֹת֜וֹת הָ/אֵ֗לֶּה וְ/לֹ֤א יִשְׁמְעוּ/ן֙ לְ/קֹלֶ֔/ךָ וְ/לָקַחְתָּ֙ מִ/מֵּימֵ֣י הַ/יְאֹ֔ר וְ/שָׁפַכְתָּ֖ הַ/יַּבָּשָׁ֑ה וְ/הָי֤וּ הַ/מַּ֨יִם֙ אֲשֶׁ֣ר תִּקַּ֣ח מִן הַ/יְאֹ֔ר וְ/הָי֥וּ לְ/דָ֖ם בַּ/יַּבָּֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/009.yaml
  text: And if they do not believe even these two signs and do not listen to your voice[a], then you shall take some of the water of the Nile and pour it on the dry ground[b], and the water that you take from the Nile will become blood on the dry ground.
translation:
  language: fr
  text: Et s’ils ne croient même pas à ces deux signes et n’écoutent pas ta voix[a], tu prendras de l’eau du Nil et tu la verseras sur le sol sec. L’eau que tu auras prise du Nil deviendra du sang[b] sur le sol sec.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ne tiennent pas compte de ce que tu dis ». Littéralement : « n’écoutent pas ta voix ».'
    reason: L’expression hébraïque peut désigner aussi bien l’écoute que l’attention obéissante accordée aux paroles de quelqu’un.
  - marker: b
    text: Ou « sera du sang ».
    reason: La construction hébraïque peut être rendue par une formulation de transformation (« deviendra ») ou de résultat (« sera »).
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Et s’ils
  rationale: Cette tournure introduit ici une éventualité conditionnelle. « Et s’ils » conserve l’enchaînement hébreu sans rendre littéralement et lourdement « et il arrivera que, si ».
- source_word: יַאֲמִינוּ
  choice: ne croient pas
  rationale: Dans ce contexte, le hiphil de אמן exprime le fait d’accorder foi à la valeur probante des signes. « Croire » est naturel en français et convient au récit.
- source_word: גַּם לִשְׁנֵי הָאֹתוֹת הָאֵלֶּה
  choice: même pas à ces deux signes
  rationale: 'גַּם marque ici une progression : malgré les deux signes déjà donnés, ils pourraient encore refuser de croire. « Même pas » restitue cette insistance dans la phrase négative.'
- source_word: יִשְׁמְעוּן לְקֹלֶךָ
  choice: n’écoutent pas ta voix
  rationale: La formulation conserve l’image de l’expression hébraïque שמע לְקוֹל tout en restant compréhensible en français. Selon le contexte, elle implique aussi le refus de tenir compte des paroles de Moïse.
- source_word: מִמֵּימֵי הַיְאֹר
  choice: de l’eau du Nil
  rationale: Le מִן partitif indique qu’une certaine quantité d’eau doit être prise. « De l’eau du Nil » exprime naturellement ce sens en français.
- source_word: וְשָׁפַכְתָּ
  choice: tu la verseras
  rationale: שפך signifie ici verser. Le pronom « la », nécessaire en français, reprend explicitement l’eau mentionnée juste avant.
- source_word: הַיַּבָּשָׁה / בַּיַּבָּשֶׁת
  choice: le sol sec
  rationale: Les deux formes désignent la terre ferme ou sèche, par opposition à l’eau. « Le sol sec » convient à l’action décrite et préserve la répétition du texte source.
- source_word: וְהָיוּ ... לְדָם
  choice: deviendra du sang
  rationale: La construction היה + לְ exprime ici un changement ou un résultat. « Deviendra du sang » affirme directement la transformation sans ajouter d’explication absente de l’hébreu.
- source_word: דָם
  choice: sang
  rationale: Le nom signifie directement « sang » ; rien dans le texte ne justifie de l’atténuer en « eau rouge » ou en simple apparence de sang.
theological_decisions:
- issue: Nature du signe accompli avec l’eau du Nil
  choice: L’eau « deviendra du sang »
  alternative: L’eau prendra la couleur ou l’apparence du sang
  rationale: L’hébreu présente sans réserve un changement en sang au moyen de היה + לְדָם. La traduction ne réduit donc pas le signe à un phénomène d’apparence ni à une explication naturaliste.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement suit l’adresse divine à Moïse. La répétition de « sur le sol sec » est maintenue parce qu’elle structure le signe dans le texte hébreu.
