  text: 'Il le laissa tranquille[a]. Alors elle dit : « Un époux de sang[b] ! » — à cause des circoncisions[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: D’après le contexte, il s’agit probablement du SEIGNEUR qui cesse de s’en prendre à Moïse ; l’hébreu emploie seulement les pronoms « il » et « lui ».
