    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu porte un pluriel rare : « les circoncisions », peut-être au sens de « rites de circoncision ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרֶף
  choice: il le laissa tranquille
  rationale: Le qal de רפה exprime ici la cessation de l’action hostile. Cette tournure est naturelle en français tout en évitant de nommer explicitement le sujet et l’objet, que l’hébreu exprime seulement par des pronoms.
- source_word: מִמֶּנּוּ
  choice: le
  rationale: Le complément pronominal de מן est rendu dans l’expression idiomatique « le laissa tranquille ». La note signale les référents probables sans les introduire directement dans le texte.
- source_word: אָז
  choice: alors
  rationale: L’adverbe marque la suite temporelle et convient au déroulement narratif.
- source_word: אָמְרָה
  choice: elle dit
  rationale: Rendu simple du verbe אמר ; le féminin renvoie naturellement à Séphora dans le contexte immédiat.
- source_word: חֲתַן דָּמִים
  choice: un époux de sang
  rationale: Cette expression construite, brève et culturellement obscure, est conservée presque littéralement afin de ne pas trancher entre une exclamation, une désignation rituelle ou une autre nuance.
- source_word: לַמּוּלֹת
  choice: à cause des circoncisions
  rationale: La forme hébraïque est un pluriel rare lié au verbe « circoncire ». Le pluriel est maintenu dans le texte français, tandis qu’une note indique qu’il peut viser la circoncision accomplie ou les gestes qui s’y rapportent.
theological_decisions:
- issue: Référents des pronoms dans « il le laissa tranquille »
  choice: Conserver les pronoms dans le texte ; le contexte indique probablement que le SEIGNEUR cesse de s’en prendre à Moïse.
  alternative: Nommer directement le SEIGNEUR et Moïse dans le corps du verset.
  rationale: Le verset 24 désigne le SEIGNEUR comme l’assaillant, et la scène conduit naturellement à comprendre Moïse comme l’objet de l’attaque. Cependant, l’hébreu du verset 26 ne répète aucun des deux noms ; les conserver sous forme pronominale respecte cette formulation.
- issue: Sens de « époux de sang »
  choice: Maintenir l’expression sans en préciser la portée exacte.
  alternative: La paraphraser comme une marque de répulsion, un titre rituel lié à la circoncision, ou une parole adressée explicitement à Moïse ou à l’enfant.
  rationale: Le sens culturel et la tonalité de חֲתַן דָּמִים demeurent incertains. Une paraphrase interprétative supprimerait une ambiguïté réelle du texte.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste fluide, tandis que l’expression énigmatique « époux de sang » et le pluriel « circoncisions » préservent les aspérités significatives de l’hébreu.
