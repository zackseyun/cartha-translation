base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/006.yaml
  text: Then Yahweh said to him again[a], “Please put your hand into your bosom.” So he put his hand into his bosom, and when he brought it out, behold, his hand was leprous, like snow.
translation:
  language: fr
  text: 'Puis Yahweh lui dit encore : « Mets donc ta main dans le repli de ton vêtement. » Il mit sa main dans le repli de son vêtement, puis la retira : voici que sa main était atteinte de tsaraath[a], pareille à la neige.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu désigne l’affection appelée צָרַעַת (tsaraath) dans l’Ancien Testament. Elle ne correspond pas nécessairement à la lèpre moderne, ou à la maladie de Hansen.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel exprimé par le tétragramme, conformément à l’usage du projet.
- source_word: עוֹד
  choice: encore
  rationale: Dans cette suite de signes, le terme indique que Yahweh ajoute une nouvelle instruction.
- source_word: הָבֵא נָא
  choice: Mets donc
  rationale: « Mets » rend idiomatiquement le mouvement demandé, tandis que « donc » conserve sans lourdeur la nuance d’insistance adoucie de נָא.
- source_word: חֵיק
  choice: repli du vêtement
  rationale: Dans ce contexte, le mot désigne le devant ou repli du vêtement, près de la poitrine, où la main peut être glissée; cette formulation est plus claire en français moderne que « sein ».
- source_word: וַיּוֹצִאָהּ
  choice: puis la retira
  rationale: Le pronom suffixe renvoie à la main; « retirer » exprime naturellement en français le mouvement inverse.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Conserve l’effet de découverte soudaine et la force présentative de l’hébreu.
- source_word: מְצֹרַעַת
  choice: atteinte de tsaraath
  rationale: La translittération évite d’identifier à tort l’affection biblique à la lèpre moderne, tout en conservant le terme technique de l’hébreu.
- source_word: כַּשָּׁלֶג
  choice: pareille à la neige
  rationale: Reproduit la comparaison concise de l’hébreu sans ajouter explicitement « blanche », absent du texte source.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le nom divin; sa translittération préserve sa fonction de nom propre sans lui substituer un titre.
- issue: Identification de מְצֹרַעַת
  choice: atteinte de tsaraath
  alternative: lépreuse
  rationale: Le terme biblique recouvre une catégorie ancienne qui ne correspond pas nécessairement à la maladie de Hansen; la traduction ne tranche donc pas abusivement l’identification médicale.
translation_notes:
  register: Français international moderne, narratif et digne. « Repli du vêtement » explicite une réalité vestimentaire ancienne sans paraphrase excessive. « Voici que » maintient la vivacité solennelle du récit; le terme technique « tsaraath » est immédiatement éclairé par une note.
