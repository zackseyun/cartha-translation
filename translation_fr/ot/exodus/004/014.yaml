  text: וַ/יִּֽחַר אַ֨ף יְהוָ֜ה בְּ/מֹשֶׁ֗ה וַ/יֹּ֨אמֶר֙ הֲ/לֹ֨א אַהֲרֹ֤ן אָחִ֨י/ךָ֙ הַ/לֵּוִ֔י יָדַ֕עְתִּי כִּֽי דַבֵּ֥ר יְדַבֵּ֖ר ה֑וּא וְ/גַ֤ם הִנֵּה הוּא֙ יֹצֵ֣א לִ/קְרָאתֶ֔/ךָ וְ/רָאֲ/ךָ֖ וְ/שָׂמַ֥ח בְּ/לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/014.yaml
  text: Then Yahweh’s anger burned against Moses[a], and he said, “Is there not Aaron your brother, the Levite? I know that he can speak well. And also, look, he is coming out to meet you; when he sees you, he will rejoice in his heart.”
translation:
  language: fr
  text: 'Alors la colère de Yahweh s’enflamma contre Moïse, et il dit : « N’y a-t-il pas Aaron, ton frère, le Lévite ? Je sais qu’il sait bien parler[a]. De plus, le voici qui sort à ta rencontre ; quand il te verra, il se réjouira dans son cœur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je sais qu’il parle avec aisance » ; plus littéralement : « parler, il parlera ».'
    reason: La construction associant l’infinitif absolu au verbe conjugué intensifie l’idée verbale et peut souligner ici l’aisance ou la certitude de la parole d’Aaron.
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: la colère de Yahweh s’enflamma
  rationale: Conserve la métaphore hébraïque de la colère qui s’embrase, dans une formulation française naturelle et digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: הֲלֹא
  choice: N’y a-t-il pas
  rationale: Rend la question rhétorique qui appelle une réponse affirmative.
- source_word: הַלֵּוִי
  choice: le Lévite
  rationale: Désigne naturellement l’appartenance d’Aaron à la tribu de Lévi, sans présumer ici une fonction cultuelle.
- source_word: יָדַעְתִּי כִּי דַבֵּר יְדַבֵּר הוּא
  choice: Je sais qu’il sait bien parler
  rationale: Exprime en français courant l’aptitude à parler soulignée par la construction intensive hébraïque, dans le contexte de l’objection de Moïse.
- source_word: וְגַם הִנֵּה
  choice: De plus, le voici
  rationale: Conserve à la fois la valeur additive et la mise en relief déictique, sans archaïsme inutile.
- source_word: יֹצֵא לִקְרָאתֶךָ
  choice: qui sort à ta rencontre
  rationale: Le participe présente l’action comme en cours ou imminente.
- source_word: וְרָאֲךָ
  choice: quand il te verra
  rationale: Explicite naturellement le rapport temporel avec la joie qui suit.
- source_word: וְשָׂמַח בְּלִבּוֹ
  choice: il se réjouira dans son cœur
  rationale: Maintient la mention explicite de l’intériorité et la force du verbe hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme ; la transcription préserve le nom personnel au lieu de le remplacer par un titre.
- issue: Portée de דַבֵּר יְדַבֵּר
  choice: il sait bien parler
  alternative: il parlera certainement
  rationale: Dans le contexte, la construction intensive répond à l’objection de Moïse concernant son aptitude à parler. La traduction retenue exprime cette capacité sans exclure la nuance emphatique, signalée en note.
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe rhétorique de l’hébreu est conservée, tandis que « le voici » évite l’archaïsme de « voici que » ou « voici, il ». Le tutoiement correspond au singulier hébreu adressé à Moïse.
