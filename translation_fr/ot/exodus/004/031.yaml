- from: Le peuple crut. Lorsqu’ils apprirent que Yahweh était intervenu en faveur des fils d’Israël[a] et qu’il avait vu leur détresse[b], ils s’inclinèrent et se prosternèrent devant lui[c].
  to: Le peuple crut. Lorsqu’ils apprirent que Yahweh était intervenu en faveur des fils d’Israël[a] et qu’il avait vu leur détresse[b], ils s’inclinèrent et se prosternèrent[c].
  rationale: La révision supprime le complément « devant lui », qui n’est pas exprimé en hébreu, tout en conservant le double geste et sa portée contextuelle. Les notes sont ajustées pour rester exactes, utiles et non redondantes.
