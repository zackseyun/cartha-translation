base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/031.yaml
  text: And the people believed[a]; and when they heard that Yahweh had visited the sons of Israel and that he had seen their affliction[c][b], they bowed down and worshiped.
translation:
  language: fr
  text: Le peuple crut. Lorsqu’ils apprirent que Yahweh était intervenu en faveur des fils d’Israël[a] et qu’il avait vu leur détresse[b], ils s’inclinèrent et se prosternèrent[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi se traduire par « s’était occupé des fils d’Israël », « avait pris soin d’eux » ou « les avait visités ». Il évoque ici une attention divine qui conduit à l’action.
    reason: lexical_alternative
  - marker: b
    text: Ou « leur misère » ou « leur souffrance ».
    reason: lexical_alternative
  - marker: c
    text: Le second verbe peut aussi désigner un geste d’adoration ou d’hommage.
    reason: translation_clarification
lexical_decisions:
- source_word: וַיַּאֲמֵן
  choice: crut
  rationale: Le hiphil de אמן exprime ici l’adhésion du peuple au message et aux signes rapportés. « Crut » conserve l’absence de complément explicite dans l’hébreu.
- source_word: וַיִּשְׁמְעוּ כִּי
  choice: Lorsqu’ils apprirent que
  rationale: שׁמע suivi de כִּי introduit ce que le peuple apprend. « Lorsqu’ils apprirent » rend naturellement en français le lien temporel qui mène à sa réaction.
- source_word: פָקַד
  choice: était intervenu en faveur de
  rationale: Dans ce contexte, פקד ne désigne pas une simple visite, mais l’attention de Dieu qui se traduit par une action. Cette formulation restitue ce mouvement sans enfermer le verbe dans une nuance trop précise.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La formulation familiale de l’hébreu est conservée; elle désigne collectivement les descendants d’Israël.
- source_word: רָאָה אֶת עָנְיָם
  choice: avait vu leur détresse
  rationale: « Voir » maintient l’image concrète de l’hébreu, tandis que « détresse » exprime l’état de souffrance et d’oppression désigné par עֳנִי.
- source_word: וַיִּקְּדוּ
  choice: ils s’inclinèrent
  rationale: קדד décrit l’inclination du corps et reste distinct du verbe suivant.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: se prosternèrent devant lui
  rationale: Le verbe désigne une prosternation exprimant hommage ou adoration. « Devant lui » explicite en français la relation implicite avec Yahweh, sans employer un second quasi-synonyme de « s’incliner ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le représente directement et concorde avec la couche de consultation fournie.
- issue: Portée de פקד appliqué à l’action divine
  choice: était intervenu en faveur de
  alternative: avait visité / s’était occupé de / avait pris soin de
  rationale: Le contexte unit attention divine et commencement de la délivrance. Le choix garde cette dimension active, tandis que la note signale l’étendue du terme.
- issue: Sens cultuel de וַיִּשְׁתַּחֲווּ
  choice: se prosternèrent devant lui
  alternative: adorèrent
  rationale: Le geste corporel demeure explicite après וַיִּקְּדוּ, tout en laissant le contexte communiquer sa valeur d’adoration plutôt que de la remplacer par une interprétation abstraite.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe brève conserve la progression du récit. « Fils d’Israël » maintient l’expression familiale du texte source; « détresse » reste courant sans affaiblir la gravité de la situation.
