source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֣ה אֶל יְהוָה֮ בִּ֣י אֲדֹנָ/י֒ לֹא֩ אִ֨ישׁ דְּבָרִ֜ים אָנֹ֗כִי גַּ֤ם מִ/תְּמוֹל֙ גַּ֣ם מִ/שִּׁלְשֹׁ֔ם גַּ֛ם מֵ/אָ֥ז דַּבֶּרְ/ךָ אֶל עַבְדֶּ֑/ךָ כִּ֧י כְבַד פֶּ֛ה וּ/כְבַ֥ד לָשׁ֖וֹן אָנֹֽכִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/010.yaml
  text: Then Moses said to Yahweh[a], “Please, Lord, I am not a man of words, neither yesterday nor the day before, nor since you have spoken to your servant[b]; for I am heavy of mouth and heavy of tongue.”
translation:
  language: fr
  text: 'Moïse dit à Yahweh : « De grâce, Seigneur, je ne suis pas doué pour parler[a], ni hier ni avant-hier, ni même depuis que tu as parlé à ton serviteur, car j’ai la bouche lourde et la langue lourde[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je ne suis pas un homme de paroles », c’est-à-dire un homme habile à parler.'
    reason: La tournure hébraïque est imagée, mais son calque serait peu naturel et potentiellement trompeur en français.
  - marker: b
    text: 'Littéralement : « lourd de bouche et lourd de langue ». Cette image désigne une difficulté à parler, sans préciser s’il s’agit d’un manque d’éloquence ou d’un trouble de la parole.'
    reason: Préserver l’ambiguïté lexicale de la métaphore hébraïque.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de le remplacer par un titre.
- source_word: בִּי אֲדֹנָי
  choice: De grâce, Seigneur !
  rationale: בִּי exprime ici une supplication déférente; « de grâce » convient au registre solennel sans être obscur, tandis que אֲדֹנָי est rendu par « Seigneur ».
- source_word: לֹא אִישׁ דְּבָרִים אָנֹכִי
  choice: Je ne suis pas doué pour parler
  rationale: La formulation française exprime naturellement l’incapacité oratoire indiquée par l’expression hébraïque; une note conserve sa forme littérale, qui serait ambiguë ou trompeuse en français (« homme de parole » évoque surtout la fiabilité).
- source_word: גַּם מִתְּמוֹל גַּם מִשִּׁלְשֹׁם
  choice: ni hier ni avant-hier
  rationale: Conserve l’expression temporelle concrète et répétitive de l’hébreu sans la généraliser en « autrefois ».
- source_word: גַּם מֵאָז דַּבֶּרְךָ אֶל עַבְדֶּךָ
  choice: ni même depuis que tu parles à ton serviteur
  rationale: « Depuis que » rend מֵאָז, et le présent « tu parles » convient à l’échange encore en cours sans faire de la parole divine un événement achevé.
- source_word: עַבְדֶּךָ
  choice: ton serviteur
  rationale: Dans cette adresse déférente à Dieu, « serviteur » rend naturellement l’auto-désignation de Moïse.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison donnée par Moïse dans un registre littéraire courant.
- source_word: כְבַד פֶּה וּכְבַד לָשׁוֹן
  choice: j’ai la bouche lourde et la langue lourde
  rationale: Conserve l’image et le parallélisme hébreux, sans décider si Moïse évoque un manque d’éloquence, une difficulté d’expression ou un trouble de la parole.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme; sa transcription préserve ici le nom personnel au lieu de lui substituer un titre.
- issue: Nature exacte de la difficulté de parole de Moïse
  choice: Conserver l’image « la bouche lourde et la langue lourde »
  alternative: Expliciter par « je parle lentement », « je manque d’éloquence » ou « j’ai un trouble de la parole »
  rationale: L’hébreu ne précise pas s’il s’agit d’un manque d’éloquence, d’assurance ou d’une déficience physique; l’image maintient cette ambiguïté.
translation_notes:
  register: Français international actuel, digne et accessible. « De grâce » marque la supplication respectueuse. La répétition « ni hier ni avant-hier » et le parallélisme final sont maintenus pour refléter la vigueur de l’hébreu.
