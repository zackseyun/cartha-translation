  text: וְ/עַתָּ֖ה לֵ֑ךְ וְ/אָנֹכִי֙ אֶֽהְיֶ֣ה עִם פִּ֔י/ךָ וְ/הוֹרֵיתִ֖י/ךָ אֲשֶׁ֥ר תְּדַבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/012.yaml
  text: Now go[a], and I will be with your mouth and teach you what you shall speak.
translation:
  language: fr
  text: Maintenant, va. Moi, je serai avec ta bouche[a] et je t’enseignerai ce que tu devras dire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec ta bouche ».'
    reason: La tournure concrète est inhabituelle en français; la note explicite sa littéralité sans remplacer l’image dans le texte.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Marqueur temporel et discursif qui introduit la réponse immédiate de Dieu à l’objection de Moïse.
- source_word: לֵךְ
  choice: va
  rationale: L’impératif simple rend directement le qal impératif de הלך.
- source_word: וְאָנֹכִי אֶהְיֶה
  choice: Moi, je serai
  rationale: La dislocation avec « Moi » restitue naturellement en français l’accent porté par le pronom indépendant אָנֹכִי.
- source_word: עִם־פִּיךָ
  choice: avec ta bouche
  rationale: La formulation concrète préserve l’image hébraïque et le lien précis avec la difficulté de Moïse à parler.
- source_word: וְהוֹרֵיתִיךָ
  choice: et je t’enseignerai
  rationale: Le hifil de ירה exprime ici l’action d’enseigner ou d’instruire; « enseignerai » est clair et actuel.
- source_word: אֲשֶׁר תְּדַבֵּר
  choice: ce que tu devras dire
  rationale: Cette formulation française naturelle exprime le contenu de l’instruction ainsi que la portée future et normative du verbe, sans recourir à un archaïsme.
theological_decisions:
- issue: Formule de présence divine dans l’appel de Moïse
  choice: je serai avec ta bouche
  alternative: je t’aiderai à parler
  rationale: Le texte affirme la présence de Dieu lui-même auprès de la bouche de Moïse, plutôt que de réduire cette présence à une simple assistance fonctionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase brève « Maintenant, va » conserve la force de l’ordre; « Moi, je serai » rend l’emphase hébraïque. Le concret « avec ta bouche » est volontairement maintenu.
