  text: Then Joseph died, and all his brothers, and all that generation.
translation:
  language: fr
  text: Puis Joseph mourut, ainsi que tous ses frères et toute cette génération.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: Puis … mourut
  rationale: Le wayyiqtol de מות fait progresser le récit en rapportant un événement passé. « Puis … mourut » rend naturellement cette succession narrative en français.
- source_word: יוֹסֵף
  choice: Joseph
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et courante.
- source_word: וְכָל אֶחָיו
  choice: ainsi que tous ses frères
  rationale: כֹּל a ici un sens collectif, et אֶחָיו désigne précisément les frères de Joseph. « Ainsi que » coordonne naturellement les sujets du même verbe sans suggérer deux événements distincts.
- source_word: וְכֹל הַדּוֹר הַהוּא
  choice: et toute cette génération
  rationale: דּוֹר désigne ici l’ensemble des personnes d’une même génération. Le singulier collectif français « toute cette génération » restitue la portée globale de כֹּל et la valeur déictique de הַהוּא.
