  text: הָ֥בָ/ה נִֽתְחַכְּמָ֖ה ל֑/וֹ פֶּן יִרְבֶּ֗ה וְ/הָיָ֞ה כִּֽי תִקְרֶ֤אנָה מִלְחָמָה֙ וְ/נוֹסַ֤ף גַּם הוּא֙ עַל שֹׂ֣נְאֵ֔י/נוּ וְ/נִלְחַם בָּ֖/נוּ וְ/עָלָ֥ה מִן הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/010.yaml
  text: Come[a], let us deal shrewdly with them, lest they multiply, and if war breaks out[c][b], they too may join our enemies and fight against us and go up out of the land.
translation:
  language: fr
  text: Allons ! Agissons habilement à son égard[a], de peur qu’il ne se multiplie. Si une guerre éclate, il se joindra lui aussi à nos ennemis, combattra contre nous et quittera le pays[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit « à son égard » et désigne Israël collectivement comme un seul peuple. On pourrait aussi traduire au pluriel : « à leur égard ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « monter hors du pays ». L’expression hébraïque conserve l’image d’une montée ; elle peut aussi se comprendre au sens de « quitter le pays ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: Allons !
  rationale: Interjection exhortative qui appelle à une action collective immédiate ; cette tournure est naturelle en français moderne.
- source_word: נִתְחַכְּמָה
  choice: Agissons avec habileté
  rationale: Le hitpael de חכם exprime ici une conduite calculée et ingénieuse. « Avec habileté » conserve l’ambivalence entre sagesse pratique et ruse politique, sans introduire d’emblée un jugement moral absent du mot lui-même.
- source_word: לוֹ
  choice: envers lui
  rationale: Le pronom hébreu est morphologiquement masculin singulier et renvoie collectivement au peuple d’Israël. Le français peut conserver ce collectif singulier, repris dans la suite du verset.
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Cette construction française rend naturellement le résultat redouté et la logique préventive de פֶּן.
- source_word: יִרְבֶּה
  choice: il ne devienne nombreux
  rationale: Le verbe hébreu est au singulier et vise Israël comme peuple collectif. « Devenir nombreux » exprime clairement l’accroissement démographique dans un français actuel.
- source_word: וְהָיָה כִּי תִקְרֶאנָה מִלְחָמָה
  choice: Si une guerre éclate
  rationale: La clause présente l’éventualité redoutée ; « éclater » est l’expression idiomatique française pour le commencement d’une guerre.
- source_word: וְנוֹסַף גַּם הוּא
  choice: il pourrait alors se joindre, lui aussi
  rationale: Avec עַל, יסף indique ici le fait de s’ajouter à un camp. Le conditionnel « pourrait » explicite en français la conséquence éventuelle sans la présenter comme certaine ; « lui aussi » maintient l’emphase de גַּם הוּא.
- source_word: עַל שֹׂנְאֵינוּ
  choice: à nos ennemis
  rationale: Après « se joindre », la préposition « à » exprime naturellement l’affiliation à ceux qui haïssent les Égyptiens.
- source_word: וְנִלְחַם בָּנוּ
  choice: combattre contre nous
  rationale: Rend directement l’action hostile et la valeur adversative de בְּ.
- source_word: וְעָלָה מִן הָאָרֶץ
  choice: quitter le pays
  rationale: Dans ce contexte, עלה מן signifie monter hors du territoire, donc en sortir. « Quitter le pays » transmet ce sens en français naturel, tandis qu’une note conserve l’image hébraïque littérale et son ambiguïté interprétative.
theological_decisions:
- issue: Nombre grammatical du peuple d’Israël
  choice: Conserver le collectif singulier « lui / il »
  alternative: Employer le pluriel « eux / ils »
  rationale: L’hébreu traite ici Israël comme une entité collective au masculin singulier. Le français permet de préserver ce trait, ce qui évite d’effacer inutilement la forme du texte source.
- issue: Sens de la sortie du pays
  choice: « quitter le pays » dans le texte, avec le littéral en note
  alternative: « monter hors du pays »
  rationale: La formulation hébraïque peut exprimer le départ d’Israël, souvent compris comme une perte économique redoutée, mais elle a aussi reçu d’autres lectures. La traduction n’ajoute ni destination ni interprétation théologique et la note maintient l’image exacte.
translation_notes:
  register: Français international moderne, digne et accessible. Le collectif singulier de l’hébreu est conservé sans lourdeur. « Agir avec habileté » préserve la tension entre conduite avisée et calcul rusé ; « quitter le pays » privilégie la clarté tout en signalant le littéral en note.
