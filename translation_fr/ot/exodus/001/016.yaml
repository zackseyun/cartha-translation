  text: וַ/יֹּ֗אמֶר בְּ/יַלֶּדְ/כֶן֙ אֶת הָֽ/עִבְרִיּ֔וֹת וּ/רְאִיתֶ֖ן עַל הָ/אָבְנָ֑יִם אִם בֵּ֥ן הוּא֙ וַ/הֲמִתֶּ֣ן אֹת֔/וֹ וְ/אִם בַּ֥ת הִ֖יא וָ/חָֽיָה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/016.yaml
  text: And he said[a], “When you help the Hebrew women give birth and see them on the birthstool, if it is a son, then you shall put him to death; but if it is a daughter, then she shall live.”
translation:
  language: fr
  text: 'Il dit : « Quand vous aiderez les femmes hébreues à accoucher et que vous les verrez sur le siège d’accouchement[a], si c’est un fils, vous le mettrez à mort ; mais si c’est une fille, elle vivra. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur les deux pierres » ; l’expression désigne probablement un siège ou un dispositif d’accouchement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַלֶּדְכֶן
  choice: Quand vous aiderez … à accoucher
  rationale: Dans ce contexte obstétrical, la forme piel de ילד désigne l’assistance apportée lors de l’accouchement. Cette formulation est naturelle en français moderne et conserve le rôle actif des sages-femmes sans remplacer le verbe par le nom de leur fonction.
- source_word: הָעִבְרִיּוֹת
  choice: les femmes hébreues
  rationale: Le féminin pluriel substantivé désigne les femmes hébreues. Le contexte de l’accouchement rend inutile l’ajout explicatif « en travail ».
- source_word: וּרְאִיתֶן
  choice: et que vous les verrez
  rationale: Le verbe signifie simplement « voir ». Le pronom « les », implicite en hébreu dans le contexte, est nécessaire à une formulation française naturelle et renvoie aux femmes qui accouchent.
- source_word: עַל הָאָבְנָיִם
  choice: sur le siège d’accouchement
  rationale: L’expression signifie littéralement « sur les deux pierres », mais désigne vraisemblablement ici le dispositif ou siège utilisé pour accoucher. Le sens contextuel figure dans le texte, et la forme littérale est conservée en note.
- source_word: אִם בֵּן הוּא
  choice: si c’est un fils
  rationale: « Fils » correspond directement à בֵּן et maintient le parallélisme lexical avec « fille ».
- source_word: וַהֲמִתֶּן אֹתוֹ
  choice: vous le mettrez à mort
  rationale: Le hifil de מות signifie « faire mourir, mettre à mort ». Le futur français exprime ici l’ordre catégorique de Pharaon tout en conservant le caractère délibéré et officiel de l’instruction.
- source_word: וְאִם בַּת הִיא
  choice: mais si c’est une fille
  rationale: « Fille » correspond à בַּת et forme le pendant naturel de « fils ». « Mais » rend clairement le contraste porté par le contexte.
- source_word: וָחָיָה
  choice: elle vivra
  rationale: La forme indique que l’enfant de sexe féminin doit rester en vie. Le futur maintient le parallélisme avec « vous le mettrez à mort » sans préciser davantage si la nuance est prédictive ou permissive.
