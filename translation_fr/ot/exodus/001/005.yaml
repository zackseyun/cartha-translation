  variant: modern international French
source:
  edition: WLC
  text: וַֽ/יְהִ֗י כָּל נֶ֛פֶשׁ יֹצְאֵ֥י יֶֽרֶךְ יַעֲקֹ֖ב שִׁבְעִ֣ים נָ֑פֶשׁ וְ/יוֹסֵ֖ף הָיָ֥ה בְ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/005.yaml
  text: And all the persons who came from Jacob’s loins were seventy persons[a], and Joseph was already in Egypt.
translation:
  language: fr
  text: Tous ceux qui étaient issus de Jacob étaient au nombre de soixante-dix[a]. Joseph, lui, était déjà en Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « qui étaient sortis de la cuisse de Jacob ». Cette expression désigne ses descendants directs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: étaient au nombre de
  rationale: La forme narrative de היה introduit ici le total. Une tournure française simple rend naturellement la valeur existentielle sans employer l’archaïque « il arriva que ».
- source_word: כָּל
  choice: Tous ceux
  rationale: Cette formulation conserve la portée globale du quantificateur tout en s’intégrant naturellement à la proposition relative.
- source_word: נֶפֶשׁ ... נָפֶשׁ
  choice: ceux ... au nombre de
  rationale: Dans ce contexte de dénombrement, נֶפֶשׁ désigne des personnes, non l’âme au sens anthropologique. Le français évite naturellement la répétition littérale « personnes… personnes ».
- source_word: יֹצְאֵי יֶרֶךְ יַעֲקֹב
  choice: qui étaient issus de Jacob
  rationale: L’expression hébraïque, littéralement liée à la « cuisse » de Jacob, est un idiome de filiation corporelle. « Issus de Jacob » en transmet clairement le sens en français moderne, tandis que la note conserve l’image source.
- source_word: שִׁבְעִים
  choice: soixante-dix
  rationale: Rendu direct du nombre cardinal hébreu.
- source_word: וְיוֹסֵף
  choice: Joseph, lui
  rationale: 'Le waw relie une information supplémentaire. La dislocation avec « lui » marque naturellement en français le contraste implicite : Joseph se trouvait déjà sur place.'
- source_word: הָיָה בְמִצְרָיִם
  choice: était déjà en Égypte
  rationale: « Déjà » explicite sobrement l’antériorité contextuelle de la présence de Joseph en Égypte par rapport à l’arrivée de la famille.
theological_decisions: []
