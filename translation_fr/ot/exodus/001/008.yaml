  text: וַ/יָּ֥קָם מֶֽלֶךְ חָדָ֖שׁ עַל מִצְרָ֑יִם אֲשֶׁ֥ר לֹֽא יָדַ֖ע אֶת יוֹסֵֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/008.yaml
  text: A new king arose over Egypt[b][a], who did not know Yosef.
translation:
  language: fr
  text: Un nouveau roi vint à régner sur l’Égypte[a], qui ne connaissait pas Yosef[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un autre roi » ; l’adjectif hébreu signifie littéralement « nouveau », mais certains y voient l’idée d’une autre dynastie ou d’un autre régime.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne reconnaissait pas Yosef » ; « connaître » peut ici signifier reconnaître son importance ou tenir compte de lui, et non simplement ignorer qui il était.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le wayyiqtol de קום fait progresser le récit. « Se leva » conserve l’image verbale de l’hébreu et peut naturellement évoquer l’arrivée d’un souverain au pouvoir.
- source_word: מֶלֶךְ
  choice: roi
  rationale: Le nom désigne précisément un roi; « dirigeant » serait plus général.
- source_word: חָדָשׁ
  choice: nouveau
  rationale: L’adjectif signifie littéralement « nouveau ». « Un autre » peut suggérer un changement de dynastie ou de régime que le verset ne formule pas explicitement.
- source_word: עַל מִצְרָיִם
  choice: sur l’Égypte
  rationale: Avec un souverain, עַל exprime naturellement l’autorité exercée sur un territoire; « sur l’Égypte » reflète cette relation.
- source_word: אֲשֶׁר לֹא יָדַע
  choice: qui ne connaissait pas
  rationale: ידע signifie couramment « connaître ». Le contexte peut aussi évoquer l’absence de reconnaissance ou de considération, mais la formulation retenue préserve cette ambiguïté.
- source_word: יוֹסֵף
  choice: Yosef
  rationale: La translittération « Yosef » reflète directement le nom hébreu יוֹסֵף, conformément à la pratique du projet pour les noms de personnes.
theological_decisions:
- issue: Faut-il faire entendre un changement de dynastie ou une hostilité politique dans « nouveau roi » et « ne connaissait pas Yosef » ?
  choice: Conserver la formulation simple « un nouveau roi… qui ne connaissait pas Yosef » sans l’expliciter.
  alternative: « un autre roi », « un roi d’une nouvelle dynastie » ou « qui ne reconnaissait pas Yosef »
  rationale: Le texte dit qu’un nouveau roi se leva et qu’il ne connaissait pas Yosef. Il permet éventuellement d’inférer un changement de régime ou un refus délibéré de tenir compte de Yosef, mais ne l’impose pas. La traduction maintient donc l’ambiguïté du texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. L’ordre des notes suit leur emplacement dans le texte.
