  text: And because the midwives feared God[a], he made households for them.
translation:
  language: fr
  text: Et parce que les sages-femmes craignaient Dieu, il leur fit des maisons[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il leur fit des maisons ». Le terme hébreu peut désigner ici des maisonnées ou des familles, plutôt que des bâtiments.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Et parce que
  rationale: La tournure introduit ici la cause de l’action divine qui suit. « Et parce que » restitue naturellement l’enchaînement narratif et causal.
- source_word: יָרְאוּ
  choice: craignaient
  rationale: Le verbe ירא exprime envers Dieu une crainte qui peut inclure respect et révérence. « Craignaient » conserve l’idiome biblique et sa force théologique.
- source_word: הַמְיַלְּדֹת
  choice: les sages-femmes
  rationale: Le participe substantivé avec l’article renvoie aux femmes déjà mentionnées dans le récit.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, le syntagme hébreu désigne le vrai Dieu; « Dieu » est la formulation française naturelle.
- source_word: וַיַּעַשׂ לָהֶם
  choice: il leur donna
  rationale: Le sens littéral est « il fit pour elles », mais avec בָּתִּים la tournure exprime vraisemblablement l’octroi ou l’établissement de familles. « Il leur donna » rend ce résultat en français naturel sans préciser au-delà de l’objet.
- source_word: בָּתִּים
  choice: une famille
  rationale: Le pluriel « maisons » peut désigner des maisonnées, des familles ou des lignées. En français, « donner une famille à chacune » est implicite dans le distributif « leur donna une famille » et communique le sens contextuel probable.
theological_decisions:
- issue: Sens de « il leur fit des maisons »
  choice: Dieu accorda aux sages-femmes une famille ou une descendance.
  alternative: Dieu leur construisit ou leur procura des maisons matérielles.
  rationale: Dans l’usage biblique, « maison » peut désigner une maisonnée, une famille ou une lignée. Le contexte présente cette action comme la faveur de Dieu envers les sages-femmes; la note conserve toutefois le sens littéral et l’ambiguïté du texte hébreu.
translation_notes:
  register: Français moderne, international et digne. Le verset garde l’expression biblique « craindre Dieu », tandis que la formule hébraïque idiomatique concernant les « maisons » est rendue clairement dans le texte et explicitée en note.
