source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֶל עַמּ֑/וֹ הִנֵּ֗ה עַ֚ם בְּנֵ֣י יִשְׂרָאֵ֔ל רַ֥ב וְ/עָצ֖וּם מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/009.yaml
  text: And he said to his people[a], “Look, the people of the sons of Israel are more numerous and stronger than we are.”
translation:
  language: fr
  text: 'Il dit à son peuple : « Regardez ! Le peuple des fils d’Israël[a] est plus nombreux et plus puissant que nous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus idiomatique : « le peuple israélite ». L’hébreu dit littéralement : « le peuple des fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le wayyiqtol de אמר fait progresser le récit. En français, le passé simple rend naturellement cette succession narrative sans ajouter une nuance temporelle absente du texte.
- source_word: אֶל עַמּוֹ
  choice: à son peuple
  rationale: עַם désigne ici collectivement le peuple auquel appartient le pharaon; « à son peuple » conserve simplement le sens politique et collectif de l’expression.
- source_word: הִנֵּה
  choice: Regardez !
  rationale: La particule הִנֵּה attire vivement l’attention des destinataires. « Regardez ! » en restitue la force dans un français actuel, sans l’archaïsme de « voici » employé isolément.
- source_word: עַם בְּנֵי יִשְׂרָאֵל
  choice: le peuple des fils d’Israël
  rationale: Cette formulation conserve la chaîne construite hébraïque et la désignation familiale et ethnique בְּנֵי יִשְׂרָאֵל. Une formulation plus idiomatique est signalée en note.
- source_word: רַב
  choice: plus nombreux
  rationale: Dans ce contexte démographique, רַב évoque le grand nombre. La préposition comparative מִן à la fin de la proposition justifie le comparatif « plus nombreux ».
- source_word: וְעָצוּם
  choice: et plus puissant
  rationale: עָצוּם peut exprimer la force, la puissance ou la vigueur. « Plus puissant » s’accorde avec la comparaison introduite par מִמֶּנּוּ et évite de réduire l’idée à la seule force physique.
- source_word: מִמֶּנּוּ
  choice: que nous
  rationale: 'La préposition מִן suivie du suffixe de première personne du pluriel marque ici la comparaison : « que nous ».'
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque; l’exclamation après « Regardez » restitue la fonction d’appel de הִנֵּה. La structure littérale « fils d’Israël » est maintenue dans le texte, avec l’équivalent idiomatique en note.
