source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ מֶ֣לֶךְ מִצְרַ֔יִם לַֽ/מְיַלְּדֹ֖ת הָֽ/עִבְרִיֹּ֑ת אֲשֶׁ֨ר שֵׁ֤ם הָֽ/אַחַת֙ שִׁפְרָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית פּוּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/015.yaml
  text: Then the king of Egypt said to the Hebrew midwives[a], one of whom was named Shiphrah and the other Puah,
translation:
  language: fr
  text: 'Alors le roi d’Égypte dit aux sages-femmes des Hébreux[a], dont l’une s’appelait Shifra et l’autre Poua :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aux sages-femmes hébreues ». L’expression hébraïque peut désigner soit des sages-femmes qui étaient elles-mêmes hébreues, soit des sages-femmes qui assistaient les femmes hébreues.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » en restitue naturellement la succession en français moderne.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: le roi d’Égypte
  rationale: Rend directement la construction hébraïque sans introduire le titre « pharaon », absent de ce verset.
- source_word: לַמְיַלְּדֹת
  choice: aux sages-femmes
  rationale: Le participe féminin désigne les femmes qui assistent les accouchements ; « sages-femmes » est l’équivalent français courant et précis.
- source_word: הָעִבְרִיֹּת
  choice: des Hébreux
  rationale: Cette formulation française conserve l’ambiguïté possible entre des sages-femmes hébreues et des sages-femmes au service des femmes hébreues, explicitée en note.
- source_word: אֲשֶׁר שֵׁם הָאַחַת ... וְשֵׁם הַשֵּׁנִית ...
  choice: dont l’une s’appelait ... et l’autre ...
  rationale: Formulation idiomatique qui préserve la répartition entre les deux femmes nommées.
- source_word: שִׁפְרָה
  choice: Shifra
  rationale: Translittération française claire et proche de la forme hébraïque.
- source_word: פּוּעָה
  choice: Poua
  rationale: Translittération adaptée aux conventions et à la prononciation françaises.
theological_decisions:
- issue: Identité ou clientèle des sages-femmes
  choice: « sages-femmes des Hébreux » dans le texte, avec une note signalant l’ambiguïté
  alternative: « sages-femmes hébreues »
  rationale: La construction hébraïque peut qualifier l’origine des sages-femmes ou le peuple auprès duquel elles exerçaient ; le texte et la note évitent de trancher silencieusement.
translation_notes:
  register: Français international moderne, naturel et digne. Les noms propres suivent une translittération adaptée au français. Le deux-points final introduit naturellement les paroles du verset suivant.
