  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל פָּר֧וּ וַֽ/יִּשְׁרְצ֛וּ וַ/יִּרְבּ֥וּ וַ/יַּֽעַצְמ֖וּ בִּ/מְאֹ֣ד מְאֹ֑ד וַ/תִּמָּלֵ֥א הָ/אָ֖רֶץ אֹתָֽ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/007.yaml
  text: But the sons of Israel were fruitful and swarmed and multiplied and became exceedingly strong[b][a], so that the land was filled with them.
translation:
  language: fr
  text: Mais les fils d’Israël furent féconds, foisonnèrent, se multiplièrent et devinrent extrêmement puissants[a] ; le pays en fut rempli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et les fils d’Israël ». La conjonction hébraïque peut être rendue simplement par « et », tandis que « mais » souligne le contraste avec le verset précédent.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Mais les fils d’Israël
  rationale: « Fils d’Israël » conserve l’expression familiale et nationale de l’hébreu. « Mais » rend le contraste narratif avec la disparition de la génération de Joseph au verset précédent ; le simple « et » demeure possible.
- source_word: פָּרוּ
  choice: furent féconds
  rationale: Le verbe פרה exprime la fécondité et préserve ici la résonance du langage de bénédiction de la Genèse sans l’expliciter.
- source_word: וַיִּשְׁרְצוּ
  choice: foisonnèrent
  rationale: Le verbe שׁרץ évoque une abondance grouillante ou proliférante. « Foisonnèrent » restitue cette image en français naturel et digne.
- source_word: וַיִּרְבּוּ
  choice: se multiplièrent
  rationale: Le verbe רבה indique qu’ils devinrent nombreux ; « se multiplièrent » convient à la progression et reprend le vocabulaire biblique de la bénédiction.
- source_word: וַיַּעַצְמוּ בִּמְאֹד מְאֹד
  choice: devinrent extrêmement puissants
  rationale: עצם exprime la force ou la puissance, tandis que le redoublement de מאד marque une forte intensification. Le contexte peut inclure la puissance du nombre, mais la traduction ne réduit pas le sens à la seule croissance numérique.
- source_word: וַתִּמָּלֵא הָאָרֶץ אֹתָם
  choice: le pays en fut rempli
  rationale: La forme verbale présente le pays comme ce qui est rempli. « Pays » convient mieux que « terre » au territoire habité dans ce contexte, et « en » renvoie naturellement aux fils d’Israël.
theological_decisions:
- issue: Résonance possible avec le langage de création et de bénédiction dans la Genèse
  choice: Conserver la séquence « furent féconds… se multiplièrent » sans expliciter l’allusion
  alternative: Ajouter une formulation interprétative signalant directement la bénédiction divine
  rationale: Le vocabulaire hébreu peut rappeler les bénédictions de la Genèse, mais cette résonance doit être portée par les choix lexicaux plutôt que par une affirmation ajoutée au texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Foisonnèrent » conserve l’image vive du verbe hébreu sans employer une expression dépréciative. La ponctuation maintient l’accumulation emphatique de la phrase.
