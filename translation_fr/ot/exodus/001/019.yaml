  text: וַ/תֹּאמַ֤רְןָ הַֽ/מְיַלְּדֹת֙ אֶל פַּרְעֹ֔ה כִּ֣י לֹ֧א כַ/נָּשִׁ֛ים הַ/מִּצְרִיֹּ֖ת הָֽ/עִבְרִיֹּ֑ת כִּֽי חָי֣וֹת הֵ֔נָּה בְּ/טֶ֨רֶם תָּב֧וֹא אֲלֵ/הֶ֛ן הַ/מְיַלֶּ֖דֶת וְ/יָלָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/019.yaml
  text: The midwives said to Pharaoh[a], “Because the Hebrew women are not like the Egyptian women, for they are vigorous; before the midwife comes to them, they have given birth.”
translation:
  language: fr
  text: 'Les sages-femmes dirent au pharaon : « C’est que les femmes hébreues ne sont pas comme les Égyptiennes : elles sont pleines de vigueur[a] ; avant que la sage-femme arrive auprès d’elles, elles ont déjà accouché. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elles sont vigoureuses », « robustes » ou « pleines de vitalité ». Le mot hébreu peut souligner leur force et la rapidité de leurs accouchements. Certains le comprennent plus littéralement au sens de « semblables à des animaux », mais cette interprétation est moins certaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  choice: dirent
  rationale: Le wayyiqtol de אמר introduit ici directement les paroles des sages-femmes ; « dirent » convient au récit français.
- source_word: הַמְיַלְּדֹת
  choice: les sages-femmes
  rationale: Dans ce contexte, le participe substantivé issu de ילד désigne les femmes qui assistent les accouchements ; « sages-femmes » est le terme français courant et précis.
- source_word: אֶל־פַּרְעֹה
  choice: au pharaon
  rationale: אֶל indique le destinataire des paroles ; l’article défini correspond à l’usage français habituel pour le titre royal.
- source_word: כִּי
  choice: C’est que
  rationale: Le premier כִּי introduit l’explication donnée au pharaon. « C’est que » rend naturellement en français la réponse justificative.
- source_word: לֹא כַנָּשִׁים הַמִּצְרִיֹּת הָעִבְרִיֹּת
  choice: les femmes hébreues ne sont pas comme les Égyptiennes
  rationale: La proposition nominale exprime une comparaison négative. L’ordre est adapté au français tout en conservant le contraste entre Hébreues et Égyptiennes.
- source_word: כִּי
  choice: ':'
  rationale: Le second כִּי introduit la raison de la différence affirmée. Les deux-points expriment clairement ce rapport explicatif sans répéter « c’est que » ou « car ».
- source_word: חָיוֹת
  choice: pleines de vigueur
  rationale: Dans ce contexte, l’adjectif évoque vraisemblablement la vitalité ou la robustesse permettant un accouchement rapide. Cette formulation est naturelle et non péjorative, tandis qu’une lecture plus littérale liée aux animaux demeure signalée en note.
- source_word: הֵנָּה
  choice: elles sont
  rationale: Le pronom indépendant souligne les femmes hébreues ; le français l’intègre naturellement comme sujet de la proposition.
- source_word: בְּטֶרֶם תָּבוֹא אֲלֵהֶן הַמְיַלֶּדֶת
  choice: avant que la sage-femme arrive auprès d’elles
  rationale: בטרם marque l’antériorité. Le singulier défini « la sage-femme » a ici une valeur générique, conservée en français.
- source_word: וְיָלָדוּ
  choice: elles ont déjà accouché
  rationale: Le verbe décrit une naissance achevée avant l’arrivée de la sage-femme. « Déjà » explicite naturellement cette antériorité impliquée par la construction hébraïque.
