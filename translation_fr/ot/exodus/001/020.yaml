id: EXO.1.20
reference: Exodus 1:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֵּ֥יטֶב אֱלֹהִ֖ים לַֽ/מְיַלְּדֹ֑ת וַ/יִּ֧רֶב הָ/עָ֛ם וַ/יַּֽעַצְמ֖וּ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/020.yaml
  text: So God dealt well with the midwives[a], and the people multiplied and became very strong.
translation:
  language: fr
  text: Dieu fit donc du bien aux sages-femmes[a], et le peuple se multiplia et devint très puissant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se montra bon envers les sages-femmes » ou « bénit les sages-femmes ».
    reason: Alternative lexicale pour וַיֵּיטֶב, dont le sens est faire du bien ou agir favorablement envers quelqu’un.
lexical_decisions:
- source_word: וַיֵּיטֶב
  choice: fit du bien
  rationale: Le hifil de יטב suivi de ל exprime ici l’idée de faire du bien à quelqu’un. « Fit du bien » reste proche de l’hébreu, est naturel en français et n’explicite pas prématurément la forme prise par cette faveur.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte narratif, אֱלֹהִים désigne Dieu et s’emploie avec un verbe au singulier.
- source_word: לַמְיַלְּדֹת
  choice: aux sages-femmes
  rationale: La préposition ל marque les bénéficiaires de l’action; « aux sages-femmes » convient naturellement après « fit du bien ».
- source_word: וַיִּרֶב
  choice: se multiplia
  rationale: רבה décrit ici l’accroissement numérique du peuple; « se multiplia » rend précisément ce thème récurrent du récit de l’Exode.
- source_word: הָעָם
  choice: le peuple
  rationale: La traduction conserve l’expression simple de l’hébreu, dont le référent est clair dans le contexte.
- source_word: וַיַּעַצְמוּ
  choice: devint très puissant
  rationale: עצם exprime ici une croissance en puissance ou en force. Le singulier français s’accorde avec le nom collectif « peuple », malgré le pluriel sémantique du verbe hébreu.
- source_word: מְאֹד
  choice: très
  rationale: מְאֹד intensifie l’idée de puissance; « très » est l’équivalent courant et naturel en français moderne.
theological_decisions:
- issue: Faut-il traduire l’action de Dieu par « bénit » ou par une formulation plus neutre?
  choice: fit du bien aux sages-femmes
  alternative: bénit les sages-femmes; se montra bon envers les sages-femmes
  rationale: Le verbe יטב indique que Dieu leur fit du bien, sans nommer ici précisément la forme de cette faveur. La formulation retenue préserve cette généralité et laisse au verset suivant le soin d’en préciser les effets.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la coordination narrative de l’hébreu. « Très puissant » exprime plus naturellement en français la puissance collective du peuple que « très fort », qui pourrait évoquer surtout la force physique.
