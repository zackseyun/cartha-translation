source:
  edition: WLC
  text: וְ/כַ/אֲשֶׁר֙ יְעַנּ֣וּ אֹת֔/וֹ כֵּ֥ן יִרְבֶּ֖ה וְ/כֵ֣ן יִפְרֹ֑ץ וַ/יָּקֻ֕צוּ מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/012.yaml
  text: But the more they afflicted them[a], the more they multiplied and the more they spread out[c][b], so that they dreaded the sons of Israel.
translation:
  language: fr
  text: Mais plus on les opprimait[a], plus ils devenaient nombreux et plus ils se répandaient, si bien qu’on redoutait[b] les Israélites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici un pronom singulier, « lui », pour Israël considéré comme un peuple.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « on avait les Israélites en horreur ». Le verbe hébreu peut exprimer une forte crainte ou une profonde aversion. Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַאֲשֶׁר ... כֵּן ... וְכֵן
  choice: Mais plus… plus… et plus…
  rationale: La construction hébraïque exprime une progression proportionnelle. Cette tournure française naturelle en conserve la force, tandis que « Mais » marque le contraste avec le projet oppressif.
- source_word: יְעַנּוּ
  choice: on les opprimait
  rationale: Le piel de ענה désigne ici l'oppression ou les mauvais traitements. L'imparfait rend bien l'action prolongée; le pronom indéfini « on » conserve le sujet implicite fourni par le contexte.
- source_word: אֹתוֹ
  choice: les
  rationale: Le pronom hébreu est morphologiquement masculin singulier, mais il renvoie collectivement à Israël. Le pluriel est idiomatique en français.
- source_word: יִרְבֶּה
  choice: ils devenaient nombreux
  rationale: Le singulier hébreu s'accorde avec Israël envisagé collectivement. Le français passe naturellement au pluriel et exprime clairement l'accroissement démographique.
- source_word: יִפְרֹץ
  choice: ils se répandaient
  rationale: פרץ évoque ici une expansion vigoureuse, le fait de s'étendre ou de se multiplier. « Se répandaient » garde cette image sans imposer un sens militaire.
- source_word: וַיָּקֻצוּ
  choice: on se mit à redouter
  rationale: קוץ peut exprimer la terreur mêlée d'aversion ou le dégoût. « Redouter » convient au contexte de l'expansion d'Israël, tandis qu'une note préserve l'autre nuance.
- source_word: מִפְּנֵי
  choice: les Israélites
  rationale: Avec קוץ, la préposition introduit ceux dont la présence provoque cette réaction. La formulation française directe restitue naturellement la relation.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Cette expression ethnonymique désigne ici le peuple d'Israël dans son ensemble. « Les Israélites » est actuel, précis et naturel; la forme littérale est signalée en note.
theological_decisions:
- issue: Portée collective d'Israël et de בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d'Israël / les enfants d'Israël
  rationale: L'expression est un ethnonyme collectif qui inclut tout le peuple. Le français courant « les Israélites » transmet cette portée sans laisser entendre qu'il s'agit uniquement des hommes.
- issue: Nuance de וַיָּקֻצוּ
  choice: redouter
  alternative: avoir en horreur / éprouver du dégoût devant
  rationale: Le contexte immédiat met en avant la réaction à la croissance d'Israël, ce qui favorise la crainte, mais le champ sémantique permet aussi l'aversion; cette ambiguïté est conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La structure répétée « plus… plus… » conserve le parallélisme proportionnel de l'hébreu. « On » évite d'ajouter explicitement « les Égyptiens », absent de ce verset bien qu'implicite dans le contexte.
