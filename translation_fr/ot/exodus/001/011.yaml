base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/011.yaml
  text: 'So they set taskmasters over him to afflict him with their burdens[c][b][a], and he built storage cities for Pharaoh: Pithom and Rameses.'
translation:
  language: fr
  text: 'Ils établirent sur lui des chefs de corvée pour l’accabler sous leurs fardeaux. Il bâtit pour le pharaon des villes-entrepôts[b] : Pitom et Ramsès[c][a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait rendre le sens collectif par « sur eux », « les accabler » et, dans la phrase suivante, « ils bâtirent ». L’hébreu emploie le singulier (« sur lui », « l’accabler », « il bâtit ») pour parler d’Israël comme d’un peuple.
    reason: alternative_reading
  - marker: b
    text: Ou « villes de stockage » ou « villes de réserves ».
    reason: lexical_alternative
  - marker: c
    text: Le nom hébreu peut aussi être transcrit « Raamsès ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: Ils établirent
  rationale: Le verbe שׂים signifie ici placer ou préposer des responsables. « Établir » exprime naturellement en français leur nomination à une fonction d’autorité.
- source_word: עָלָיו
  choice: sur lui
  rationale: Le suffixe hébreu est au masculin singulier et renvoie collectivement à Israël. Le singulier est conservé afin de respecter cette formulation, avec une note qui en explique le sens.
- source_word: שָׂרֵי מִסִּים
  choice: chefs de corvée
  rationale: L’expression désigne des responsables du travail obligatoire ou de la levée de main-d’œuvre. « Chefs de corvée » est concis, intelligible et rend à la fois l’autorité et le caractère forcé du travail.
- source_word: לְמַעַן עַנֹּתוֹ
  choice: pour l’accabler
  rationale: Le piel de ענה peut signifier affliger, opprimer ou humilier. « Accabler » convient au contexte des corvées et garde la force du terme sans préciser indûment la forme de l’oppression.
- source_word: בְּסִבְלֹתָם
  choice: de leurs travaux forcés
  rationale: סִבְלֹת désigne des fardeaux ou de lourdes tâches imposées. Dans ce contexte de corvée, « travaux forcés » communique clairement le sens, tandis que le possessif « leurs » conserve celui du texte hébreu.
- source_word: וַיִּבֶן
  choice: Il bâtit
  rationale: Le verbe hébreu est au masculin singulier et a pour sujet implicite Israël considéré collectivement. La traduction conserve ce nombre grammatical plutôt que de le niveler au pluriel.
- source_word: עָרֵי מִסְכְּנוֹת
  choice: villes-entrepôts
  rationale: L’expression désigne des villes servant au stockage de réserves ou de provisions. « Villes-entrepôts » est une formulation française claire et actuelle.
- source_word: לְפַרְעֹה
  choice: pour le pharaon
  rationale: En français courant, l’article accompagne naturellement le titre royal employé comme nom commun.
- source_word: פִּתֹם
  choice: Pitom
  rationale: Transcription française usuelle de ce nom de lieu biblique.
- source_word: רַעַמְסֵס
  choice: Ramsès
  rationale: Forme française courante du nom de lieu; une transcription plus proche des consonnes et voyelles hébraïques est signalée en note.
theological_decisions:
- issue: Le singulier collectif appliqué à Israël
  choice: Conserver « sur lui », « l’ » et « Il bâtit »
  alternative: Employer « sur eux », « les » et « ils bâtirent »
  rationale: Le texte hébreu passe du sujet pluriel des oppresseurs à des formes masculines singulières qui présentent Israël comme une entité collective. Garder ce singulier préserve un trait réel du texte sans lui attribuer une portée doctrinale particulière; la note fournit le sens pluriel naturel.
translation_notes:
  register: Français international moderne, sobre et narratif. Le passé simple convient au registre biblique dignifié sans être archaïque. « Chefs de corvée » et « villes-entrepôts » rendent les réalités administratives de façon concise; la formulation conserve délibérément le singulier collectif inhabituel de l’hébreu, expliqué en note.
