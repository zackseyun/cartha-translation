  naturalness: Le récit au passé simple est naturel dans ce registre. « L’accabler sous leurs fardeaux » est à la fois plus idiomatique et plus proche de l’ambiguïté du texte que « l’accabler de leurs travaux forcés ». La suppression de « donc », qui n’est pas exprimé en hébreu, resserre également la traduction.
  terminology: « Corvée » convient au contexte de travail obligatoire sans employer l’expression moderne, plus étroite, « travaux forcés ». « Villes-entrepôts » est un choix clair pour עָרֵי מִסְכְּנוֹת ; les alternatives en note sont utiles.
