    rationale: Le waw narratif introduit la suite du récit ; il ne requiert pas ici un adverbe français d’inférence.
  - severity: medium
    issue: « de leurs travaux forcés » est plus interprétatif que סִבְלֹתָם.
    rationale: Le terme hébreu vise des fardeaux, charges ou pénibles travaux. « Travaux forcés » peut être contextuellement plausible, mais évoque en français un régime pénal précis et réduit l’ambiguïté lexicale. « Sous leurs fardeaux » conserve mieux le sens et le possessif.
