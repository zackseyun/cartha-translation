  text: וַ/יַּעֲבִ֧דוּ מִצְרַ֛יִם אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בְּ/פָֽרֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/013.yaml
  text: And the Egyptians made the sons of Israel serve harshly[a][b].
translation:
  language: fr
  text: Les Égyptiens firent travailler les fils d’Israël[a] avec une dureté impitoyable[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites » ; traditionnellement, « les enfants d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Ou « avec brutalité », « avec une extrême dureté » ou « sans pitié ». Le mot hébreu évoque une dureté sévère et accablante dans le travail forcé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִדוּ
  choice: firent travailler
  rationale: 'Le hifil de עבד exprime ici la causation : « faire servir/travailler ». « Firent travailler » restitue naturellement cette valeur en français sans expliciter davantage que le verbe lui-même la condition d’esclavage, pourtant manifeste dans le contexte.'
- source_word: מִצְרַיִם
  choice: Les Égyptiens
  rationale: מִצְרַיִם peut désigner le pays ou son peuple ; avec ce verbe au pluriel et dans ce contexte, le nom de peuple « les Égyptiens » est le sujet naturel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Ce choix conserve la forme familiale et collective de l’expression hébraïque ainsi que sa résonance généalogique. En français biblique actuel, il demeure compréhensible et ne désigne pas seulement des mineurs.
- source_word: בְּפָרֶךְ
  choice: avec brutalité
  rationale: פָּרֶךְ évoque la dureté impitoyable et accablante imposée dans le travail. « Avec brutalité » exprime clairement en français moderne cette manière d’agir, tout en conservant la construction adverbiale portée par בְּ.
theological_decisions:
- issue: Désignation collective בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites ; les enfants d’Israël
  rationale: L’expression est à la fois une désignation du peuple de l’alliance et une formulation généalogique. Le texte principal en conserve la forme masculine collective sans la réduire à un simple ethnonyme ; une note donne les équivalents français possibles.
- issue: Degré d’explicitation de la servitude
  choice: firent travailler
  alternative: asservirent ; réduisirent en esclavage
  rationale: Le contexte décrit bien un travail forcé, mais le hifil de עבד formule directement l’idée de faire servir ou travailler. La traduction évite donc d’introduire dans ce seul verbe une explicitation plus forte que l’hébreu, sans atténuer la brutalité exprimée par פָּרֶךְ.
translation_notes:
  register: Français international moderne, sobre et digne. « Firent travailler » est idiomatique tout en gardant la valeur causative de l’hébreu ; « avec brutalité » communique la violence du traitement sans employer une tournure vieillie comme « avec rigueur ».
