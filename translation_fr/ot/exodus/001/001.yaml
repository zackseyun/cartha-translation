  text: וְ/אֵ֗לֶּה שְׁמוֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל הַ/בָּאִ֖ים מִצְרָ֑יְמָ/ה אֵ֣ת יַעֲקֹ֔ב אִ֥ישׁ וּ/בֵית֖/וֹ בָּֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/001.yaml
  text: These are the names of the sons of Israel who came to Egypt with Jacob[a], each man with his household.
translation:
  language: fr
  text: 'Voici[a] les noms des fils d’Israël qui vinrent en Égypte avec Jacob : chacun y vint avec sa maisonnée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et voici les noms ». En hébreu, le verset commence par une conjonction qui relie l’Exode au récit précédent, dans la Genèse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: « Voici » introduit naturellement une liste en français et rend la fonction présentative de אֵלֶּה. La conjonction initiale relie aussi le récit à la Genèse; cette nuance est signalée en note.
- source_word: שְׁמוֹת
  choice: les noms
  rationale: Rendu nominal direct, qui conserve aussi le lien avec le titre hébreu du livre.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Le contexte désigne précisément les fils de Jacob, et non l’ensemble plus large des Israélites ou de leurs descendants.
- source_word: הַבָּאִים
  choice: qui vinrent
  rationale: Le participe hébreu identifie ici, dans un cadre narratif passé, ceux qui se rendirent en Égypte. Le passé simple convient au registre narratif biblique sans être obscur.
- source_word: מִצְרָיְמָה
  choice: en Égypte
  rationale: Le suffixe directionnel exprime un déplacement vers l’Égypte; « venir en Égypte » est l’expression française naturelle.
- source_word: אֵת יַעֲקֹב
  choice: avec Jacob
  rationale: אֵת a ici une valeur d’accompagnement, et non celle d’un marqueur d’objet direct.
- source_word: אִישׁ וּבֵיתוֹ
  choice: chacun avec sa famille
  rationale: אִישׁ a une valeur distributive, tandis que בַּיִת désigne ici l’unité familiale ou domestique plutôt que le bâtiment. « Famille » est naturel et clair dans ce contexte.
- source_word: בָּאוּ
  choice: intégré à « qui vinrent »
  rationale: Le verbe final reprend et achève la proposition hébraïque après l’incise distributive. En français, sa répétition serait lourde; son contenu verbal est pleinement exprimé par « qui vinrent ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « Voici » introduit naturellement l’énumération; « fils d’Israël » garde la précision généalogique. La répétition du verbe « venir » propre à la structure hébraïque n’est pas reproduite, afin d’éviter une lourdeur en français.
