    rationale: Bien que la répétition soit moins idiomatique en français, le texte hébreu emploie d’abord le participe הבאִים puis conclut par באו. Une reprise française brève préserve mieux la structure et l’insistance du source.
  - severity: low
    issue: « sa famille » est plus étroit que ביתו.
    rationale: Dans ce contexte, בית désigne le foyer ou l’unité domestique, qui peut comprendre davantage que la famille au sens strict. « Maisonnée » est plus précis.
  - severity: low
    issue: L’appel de note est placé en fin de phrase plutôt qu’après « Voici ».
    rationale: La note porte précisément sur la conjonction initiale et l’alternative « Et voici »; l’ancre doit donc suivre le mot concerné.
