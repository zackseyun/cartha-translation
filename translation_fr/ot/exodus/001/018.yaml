  text: וַ/יִּקְרָ֤א מֶֽלֶךְ מִצְרַ֨יִם֙ לַֽ/מְיַלְּדֹ֔ת וַ/יֹּ֣אמֶר לָ/הֶ֔ן מַדּ֥וּעַ עֲשִׂיתֶ֖ן הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/תְּחַיֶּ֖יןָ אֶת הַ/יְלָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/018.yaml
  text: So the king of Egypt called for the midwives and said to them[a], “Why have you done this thing and let the children live?”
translation:
  language: fr
  text: 'Alors le roi d’Égypte fit appeler les sages-femmes et leur dit : « Pourquoi avez-vous agi ainsi et laissé vivre les enfants[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « maintenu les garçons en vie ». Dans ce contexte, le mot hébreu désigne les nouveau-nés mâles, et le verbe peut signifier faire vivre, maintenir en vie ou laisser vivre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: fit appeler
  rationale: Avec ל devant les personnes convoquées, קרא signifie ici les faire venir. « Fit appeler » est naturel en français et exprime cette convocation sans renforcer inutilement le ton.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: le roi d’Égypte
  rationale: Rend directement et naturellement la relation construite de l’hébreu.
- source_word: לַמְיַלְּדֹת
  choice: les sages-femmes
  rationale: Équivalent français précis et usuel du participe désignant les femmes qui assistent les accouchements.
- source_word: וַיֹּאמֶר לָהֶן
  choice: et leur dit
  rationale: Formule française idiomatique qui conserve l’introduction neutre du discours direct.
- source_word: מַדּוּעַ
  choice: Pourquoi
  rationale: Équivalent interrogatif direct et courant.
- source_word: עֲשִׂיתֶן הַדָּבָר הַזֶּה
  choice: avez-vous agi ainsi
  rationale: Rend idiomatiquement « avez-vous fait cette chose » tout en conservant l’accusation portant sur leur conduite.
- source_word: וַתְּחַיֶּיןָ
  choice: laissé vivre
  rationale: Le verbe peut exprimer le fait de faire vivre, de maintenir en vie ou de laisser vivre. Ici, « laissé vivre » convient à l’accusation du roi tout en évitant de préciser excessivement le rôle actif des sages-femmes.
- source_word: הַיְלָדִים
  choice: les enfants
  rationale: Le nom hébreu peut désigner des enfants; le contexte renvoie aux nouveau-nés mâles, mais le texte de ce verset emploie le terme plus général. Cette ambiguïté lexicale est conservée dans le texte et précisée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « Fit appeler » convient au récit soutenu sans archaïsme; « avez-vous agi ainsi » évite le calque peu naturel « fait cette chose ». Le terme général « enfants » préserve la forme lexicale du verset, tandis que la note explicite le référent masculin indiqué par le contexte.
