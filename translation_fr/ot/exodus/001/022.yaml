language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְצַ֣ו פַּרְעֹ֔ה לְ/כָל עַמּ֖/וֹ לֵ/אמֹ֑ר כָּל הַ/בֵּ֣ן הַ/יִּלּ֗וֹד הַ/יְאֹ֨רָ/ה֙ תַּשְׁלִיכֻ֔/הוּ וְ/כָל הַ/בַּ֖ת תְּחַיּֽוּ/ן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/022.yaml
  text: Then Pharaoh commanded all his people[a], saying, “Every son who is born you must throw into the Nile[c][b], but every daughter you must let live.”
translation:
  language: fr
  text: 'Puis le pharaon donna cet ordre à tout son peuple : « Tout garçon qui naîtra, vous le jetterez dans le Nil[a], mais toute fille, vous la laisserez vivre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le fleuve ». Dans l’Exode, ce terme désigne habituellement le Nil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: donna cet ordre
  rationale: Le verbe צוה exprime ici un ordre royal. « Donna cet ordre » est naturel en français et introduit clairement le discours direct.
- source_word: פַּרְעֹה
  choice: le pharaon
  rationale: En français, le titre égyptien employé sans nom propre prend naturellement l’article défini.
- source_word: לְכָל עַמּוֹ
  choice: à tout son peuple
  rationale: עַם désigne le peuple de Pharaon, c’est-à-dire ici les Égyptiens placés sous son autorité, sans qu’il soit nécessaire de préciser « sujets ».
- source_word: כָּל הַבֵּן הַיִּלּוֹד
  choice: Tout garçon qui naîtra
  rationale: בֵּן signifie littéralement « fils », mais désigne distributivement tout enfant de sexe masculin dans ce décret. « Garçon » évite en français l’impression qu’il s’agirait uniquement des fils des destinataires. Le futur convient à la portée prospective du participe dans le contexte.
- source_word: הַיְאֹרָה
  choice: dans le Nil
  rationale: יְאֹר signifie littéralement « le fleuve » et désigne régulièrement le Nil dans le contexte égyptien de l’Exode. Le suffixe directionnel est rendu par « dans ».
- source_word: תַּשְׁלִיכֻהוּ
  choice: vous le jetterez
  rationale: La forme verbale à la deuxième personne du pluriel, avec suffixe objet masculin, est reproduite explicitement. Dans un ordre direct en français, le futur exprime avec force la prescription.
- source_word: וְכָל הַבַּת
  choice: mais toute fille
  rationale: La conjonction וְ signifie formellement « et », mais relie ici deux traitements opposés. « Mais » rend naturellement ce contraste sans modifier le contenu du décret.
- source_word: תְּחַיּוּן
  choice: vous la laisserez vivre
  rationale: Le piel de חיה signifie ici maintenir en vie ou laisser vivre. Cette formulation française conserve le contraste avec la mise à mort ordonnée pour les garçons.
theological_decisions:
- issue: Identité des garçons visés
  choice: Ne pas ajouter « hébreu » ou « des Hébreux »
  alternative: « Tout garçon hébreu qui naîtra »
  rationale: Le texte massorétique de ce verset ne précise pas explicitement l’appartenance ethnique dans la formulation du décret, même si le contexte la suggère fortement. L’ajout résoudrait une implicitation que le texte hébreu laisse au contexte.
translation_notes:
  register: Français international moderne, digne et direct. Le futur à valeur injonctive conserve la solennité brutale du décret royal. La reprise des pronoms « le » et « la » reflète les objets exprimés ou impliqués par les formes hébraïques et assure une lecture naturelle.
