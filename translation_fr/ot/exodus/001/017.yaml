source:
  edition: WLC
  text: וַ/תִּירֶ֤אןָ הַֽ/מְיַלְּדֹת֙ אֶת הָ֣/אֱלֹהִ֔ים וְ/לֹ֣א עָשׂ֔וּ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֲלֵי/הֶ֖ן מֶ֣לֶךְ מִצְרָ֑יִם וַ/תְּחַיֶּ֖יןָ אֶת הַ/יְלָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/017.yaml
  text: But the midwives feared God[a], and did not do as the king of Egypt had told them; rather, they let the children live.
translation:
  language: fr
  text: Mais les sages-femmes craignirent Dieu et ne firent pas ce que le roi d’Égypte leur avait dit ; elles laissèrent vivre les enfants[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : elles gardèrent les enfants en vie.'
    reason: Le piel de חיה peut aussi exprimer l’idée de maintenir ou de garder en vie.
lexical_decisions:
- source_word: וַתִּירֶאןָ
  choice: craignirent
  rationale: Le verbe ירא exprime ici la crainte révérencielle envers Dieu. « Craignirent » conserve l’expression biblique sans la réduire au simple respect.
- source_word: הַמְיַלְּדֹת
  choice: les sages-femmes
  rationale: Le participe substantivé désigne les femmes qui assistent les accouchements ; « sages-femmes » est l’équivalent français précis et naturel.
- source_word: אֶת־הָאֱלֹהִים
  choice: Dieu
  rationale: Malgré l’article en hébreu, le français idiomatique dit « craindre Dieu » ; le contexte désigne le vrai Dieu sans qu’il soit nécessaire d’ajouter l’article.
- source_word: וְלֹא עָשׂוּ
  choice: ne firent pas
  rationale: Traduction directe de la négation de עשׂה, adaptée à la narration au passé simple.
- source_word: כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶן
  choice: ce que … leur avait dit
  rationale: דבר signifie littéralement « parler », mais la tournure exprime ici ce que le roi leur avait enjoint. « Leur avait dit » reste proche du texte tout en étant naturel.
- source_word: מֶלֶךְ מִצְרָיִם
  choice: le roi d’Égypte
  rationale: Rendu français courant et exact de la construction hébraïque.
- source_word: וַתְּחַיֶּיןָ
  choice: elles laissèrent … en vie
  rationale: Le piel de חיה peut signifier faire vivre, laisser vivre ou maintenir en vie. Cette formulation rend le contraste avec l’ordre de tuer sans préciser davantage le mode d’action.
- source_word: הַיְלָדִים
  choice: les enfants
  rationale: יְלָדִים est lexicalement plus large que « garçons » ou « nouveau-nés », même si le contexte immédiat montre que les enfants mâles sont visés.
theological_decisions:
- issue: Sens de la crainte de Dieu
  choice: craignirent Dieu
  alternative: révérèrent Dieu
  rationale: « Craindre Dieu » préserve l’idiome biblique et sa tension entre crainte et révérence, sans l’atténuer en simple respect.
- issue: Référent de אֱלֹהִים avec l’article hébreu
  choice: Dieu
  alternative: le Dieu
  rationale: En français, « craindre Dieu » identifie naturellement le référent divin dans ce récit. « Le Dieu » serait inhabituel ici et pourrait suggérer un contraste absent du verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique. « Plutôt » marque naturellement l’opposition entre le refus d’obéir au roi et la préservation des enfants.
