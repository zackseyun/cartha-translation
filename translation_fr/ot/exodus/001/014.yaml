base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/014.yaml
  text: And they made their lives bitter with hard labor in mortar and bricks and in every kind of field work—all their labor that they imposed on them with harshness[a].
translation:
  language: fr
  text: Ils leur rendirent la vie amère par de durs travaux de mortier et de briques, ainsi que par tous les travaux des champs, tous ceux qu’ils leur faisaient accomplir avec dureté[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec brutalité ». Le terme hébreu désigne une oppression sévère et écrasante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרְרוּ אֶת־חַיֵּיהֶם
  choice: Ils leur rendirent la vie amère
  rationale: Conserve la métaphore concrète de la racine מרר, tout en employant une tournure française naturelle. Le singulier collectif « la vie » rend idiomatiquement l’hébreu pluriel חַיֵּיהֶם.
- source_word: בַּעֲבֹדָה קָשָׁה
  choice: par un travail pénible
  rationale: עֲבֹדָה désigne le travail ou le service, et קָשָׁה sa pénibilité. « Travail pénible » exprime clairement la dureté de la corvée sans anticiper le terme final פָרֶךְ.
- source_word: בְּחֹמֶר וּבִלְבֵנִים
  choice: préparation du mortier, fabrication des briques
  rationale: Dans ce contexte de construction, חֹמֶר désigne le mortier ou l’argile, et לְבֵנִים est bien le pluriel « briques ». Les noms d’activité explicitent naturellement en français les travaux effectués avec ces matériaux sans modifier leur référent.
- source_word: וּבְכָל־עֲבֹדָה בַּשָּׂדֶה
  choice: et toutes sortes de travaux dans les champs
  rationale: La formulation rend la portée globale de כָל־עֲבֹדָה et le cadre agricole de בַּשָּׂדֶה. Le pluriel français est idiomatique et ne restreint pas les tâches visées.
- source_word: אֵת כָּל־עֲבֹדָתָם אֲשֶׁר־עָבְדוּ בָהֶם
  choice: Tous les travaux qu’ils leur imposaient, ils les faisaient accomplir
  rationale: L’hébreu est récapitulatif et répète la racine עבד. Cette formulation garde la reprise emphatique et rend le sens coercitif du travail exigé, tout en évitant un calque obscur en français.
- source_word: בְּפָרֶךְ
  choice: avec dureté
  rationale: פָרֶךְ évoque une oppression sévère et écrasante. « Avec dureté » reste sobre et fidèle ; une variante plus forte est signalée en note.
