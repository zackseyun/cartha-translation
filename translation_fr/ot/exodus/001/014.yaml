revisions:
- from: 'Ils leur rendirent la vie amère par un travail pénible : préparation du mortier, fabrication des briques et toutes sortes de travaux dans les champs. Tous les travaux qu’ils leur imposaient, ils les faisaient accomplir avec dureté[a].'
  to: Ils leur rendirent la vie amère par de durs travaux de mortier et de briques, ainsi que par tous les travaux des champs, tous ceux qu’ils leur faisaient accomplir avec dureté[a].
  rationale: La révision évite de spécifier indûment la préparation du mortier et la fabrication des briques, tout en conservant des expressions françaises idiomatiques. Elle clarifie également que les travaux étaient imposés aux Israélites et conserve la reprise emphatique de la totalité du travail présente dans l’hébreu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:12:10Z'
review_pass:
  verdict: revise
  source_fidelity: La métaphore « rendirent la vie amère », la dureté du travail, les travaux de mortier et de briques, le travail des champs et la qualification finale par בְּפָרֶךְ sont bien représentés. Toutefois, « préparation du mortier, fabrication des briques » explicite des activités qui ne sont pas formulées ainsi dans l’hébreu, dont la construction reste plus englobante (« dans/avec le mortier et les briques »). La reprise finale doit aussi garder clairement les Israélites comme personnes contraintes d’accomplir le travail.
  naturalness: Le français du projet est globalement accessible, mais « ils les faisaient accomplir » laisse les travaux, plutôt que les personnes auxquelles ils sont imposés, comme complément sémantique de l’action. La révision emploie une formulation française naturelle tout en conservant la reprise récapitulative du texte hébreu.
  terminology: « Durs travaux », « mortier », « briques », « travaux des champs » et « avec dureté » conviennent à un français international moderne. La note maintient une alternative lexicale plus forte sans la présenter comme la seule lecture possible.
  issues:
  - severity: medium
    issue: « préparation du mortier, fabrication des briques »
    rationale: Cette formulation convertit les noms « mortier » et « briques » en deux opérations spécifiques. Le texte hébreu désigne les domaines ou matériaux du labeur sans préciser ces opérations; « travaux de mortier et de briques » préserve cette portée.
  - severity: medium
    issue: « Tous les travaux qu’ils leur imposaient, ils les faisaient accomplir avec dureté »
    rationale: La tournure peut grammaticalement faire des « travaux » l’objet de « faisaient accomplir », sans exprimer avec assez de netteté que les Égyptiens contraignaient les Israélites à les effectuer. Une formulation avec « leur faisaient accomplir » rétablit ce rapport.
  revised_text: Ils leur rendirent la vie amère par de durs travaux de mortier et de briques, ainsi que par tous les travaux des champs, tous ceux qu’ils leur faisaient accomplir avec dureté[a].
  revised_footnotes:
  - marker: a
    text: Ou « avec brutalité ». Le terme hébreu désigne une oppression sévère et écrasante.
    reason: lexical_alternative
  revision_rationale: La révision évite de spécifier indûment la préparation du mortier et la fabrication des briques, tout en conservant des expressions françaises idiomatiques. Elle clarifie également que les travaux étaient imposés aux Israélites et conserve la reprise emphatique de la totalité du travail présente dans l’hébreu.
