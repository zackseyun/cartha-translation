  text: On lui fit des pièces d’épaule, qui y étaient jointes ; à ses deux extrémités, il était assemblé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּתֵפֹת
  choice: pièces d’épaule
  rationale: Le nom pluriel désigne ici les éléments de l’éphod placés sur les épaules et reliant ses parties. « Pièces d’épaule » reste concret et naturel, sans imposer l’idée plus précise de sangles.
- source_word: עָשׂוּ
  choice: on fit
  rationale: Le qal accompli pluriel de עשה exprime simplement l’action de faire ou fabriquer. Le pronom indéfini « on » convient au récit français lorsque les artisans sont déjà connus par le contexte.
- source_word: לוֹ
  choice: lui
  rationale: Le suffixe masculin singulier renvoie à l’éphod, nom masculin en français comme en hébreu. « Lui » maintient cette référence sans lourdeur.
- source_word: חֹבְרֹת
  choice: qui étaient jointes
  rationale: Le participe féminin pluriel de חבר décrit les pièces d’épaule comme reliées. Cette formulation française s’accorde clairement avec « pièces » et conserve le motif lexical de l’assemblage.
- source_word: עַל שְׁנֵי קצוותו
  choice: à ses deux extrémités
  rationale: La préposition עַל et le syntagme désignant les deux bouts sont rendus idiomatiquement en français par « à ses deux extrémités ».
- source_word: חֻבָּר
  choice: il était assemblé
  rationale: Le pual accompli masculin singulier de חבר est passif. « Il était assemblé » restitue l’état résultant de l’éphod tout en évitant une répétition française maladroite de « joint ».
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La construction reprend le référent masculin « l’éphod » du contexte. Le point-virgule conserve les deux propositions hébraïques tout en rendant leur rapport intelligible.
