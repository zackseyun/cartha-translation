  text: the ark of the testimony[a], its poles, and the mercy seat.
translation:
  language: fr
  text: l’arche du témoignage, ses barres et le propitiatoire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le couvercle d’expiation ». Le terme hébreu désigne le couvercle de l’arche et comporte des associations avec l’expiation.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֹן
  choice: arche
  rationale: Terme français établi pour le coffre sacré du sanctuaire, clair dans le contexte biblique.
- source_word: הָעֵדֻת
  choice: du témoignage
  rationale: Rend directement עֵדוּת, qui désigne ici le témoignage lié aux tables placées dans l’arche, sans substituer l’interprétation « alliance ».
- source_word: בַּדָּיו
  choice: ses barres
  rationale: Dans le mobilier du sanctuaire, בַּד désigne les longues barres servant au transport; « barres » est naturel et précis en français moderne.
- source_word: הַכַּפֹּרֶת
  choice: le propitiatoire
  rationale: Terme français biblique établi pour le couvercle d’or de l’arche, tout en conservant ses associations cultuelles d’expiation. Une note explicite le référent concret.
theological_decisions:
- issue: Traduction de כַּפֹּרֶת dans le contexte du mobilier cultuel
  choice: le propitiatoire
  alternative: le couvercle d’expiation
  rationale: « Propitiatoire » préserve le terme cultuel traditionnel et sa portée théologique sans réduire l’objet à un simple couvercle; la note fournit une formulation plus transparente et concrète.
translation_notes:
  register: Français moderne, sobre et digne. Le verset étant un élément d’une énumération, le fragment nominal de l’hébreu est conservé. « Propitiatoire » est moins courant, mais reste le terme biblique français le plus précis; la note en éclaire le sens.
