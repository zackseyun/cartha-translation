  text: Ils firent les tuniques en fin lin, ouvrage de tisserand, pour Aaron et pour ses fils.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Ils firent
  rationale: Le wayyiqtol qal de עשה poursuit la suite narrative. Le passé simple convient au registre narratif biblique français tout en restant clair; la conjonction initiale n’est pas rendue mécaniquement.
- source_word: הַכָּתְנֹת
  choice: les tuniques
  rationale: כָּתְנֹת désigne ici des vêtements portés sur le corps; « tuniques » est précis, courant et adapté au contexte sacerdotal.
- source_word: שֵׁשׁ
  choice: de fin lin
  rationale: Dans le contexte du sanctuaire et des vêtements sacerdotaux, שֵׁשׁ désigne du lin fin. La tournure « de fin lin » exprime naturellement en français la matière et sa qualité.
- source_word: מַעֲשֵׂה אֹרֵג
  choice: ouvrage de tisserand
  rationale: La construction souligne le mode de fabrication et le savoir-faire artisanal. « Ouvrage de tisserand » demeure proche de l’hébreu sans être lourd en français.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: pour Aaron et pour ses fils
  rationale: La répétition de « pour » reflète celle de la préposition לְ et marque clairement les deux bénéficiaires.
