  text: And they put the two gold cords on the two rings at the ends of the breastpiece[a].
translation:
  language: fr
  text: Ils placèrent les deux cordons d’or sur les deux anneaux situés aux extrémités du pectoral[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les deux chaînettes d’or ». Le terme hébreu peut désigner des cordons torsadés ou des brins semblables à des chaînes ; ici, ces objets sont en or et fixés au pectoral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Ils placèrent
  rationale: Le verbe נתן signifie ici mettre ou placer un objet sur un autre. « Placèrent » convient au registre narratif et descriptif du passage.
- source_word: שְׁתֵּי
  choice: les deux
  rationale: Cette traduction restitue directement le nombre précis indiqué par l’hébreu.
- source_word: הָעֲבֹתֹת
  choice: cordons
  rationale: Le terme désigne des cordons torsadés ou des éléments comparables à des chaînettes. « Cordons » préserve l’image de brins torsadés sans préciser excessivement leur fabrication.
- source_word: הַזָּהָב
  choice: d’or
  rationale: Le nom indique la matière dont sont faits les cordons ; « d’or » est la formulation française naturelle.
- source_word: עַל שְׁתֵּי הַטַּבָּעֹת
  choice: sur les deux anneaux
  rationale: La préposition marque ici le point d’attache ou de placement, et טַבָּעוֹת désigne les anneaux de l’équipement cultuel.
- source_word: עַל קְצוֹת
  choice: situés aux extrémités
  rationale: La formulation explicite naturellement en français que les anneaux se trouvent aux extrémités, tout en conservant le rattachement syntaxique le plus immédiat.
- source_word: הַחֹשֶׁן
  choice: du pectoral
  rationale: Dans ce contexte, חֹשֶׁן désigne la pièce portée sur la poitrine par le grand prêtre ; « pectoral » est le terme français établi et concis.
