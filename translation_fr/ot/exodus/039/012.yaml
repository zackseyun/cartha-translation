translation:
  language: fr
  text: 'et la troisième rangée : une jacinthe[a], une agate[b] et une améthyste.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification exacte de plusieurs pierres précieuses anciennes du pectoral du grand prêtre est incertaine ; « jacinthe » peut aussi être rendu par « ambre » ou, selon une ancienne tradition, « ligure ».
    reason: lexical_alternative
  - marker: b
    text: Ou « onyx » pour la deuxième pierre de cette rangée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר
  choice: et la … rangée
  rationale: Dans la liste des pierres du pectoral, טוּר désigne une rangée ou un arrangement de pierres. La conjonction וְ est rendue par « et », conformément à la continuité de la liste.
- source_word: הַשְּׁלִישִׁי
  choice: troisième
  rationale: L’adjectif ordinal indique directement la troisième rangée de la série.
- source_word: לֶשֶׁם
  choice: hyacinthe
  rationale: L’identification précise de cette pierre ancienne demeure incertaine. « Hyacinthe » est une désignation française actuelle et compréhensible; une note conserve les principales autres possibilités.
- source_word: שְׁבוֹ
  choice: agate
  rationale: « Agate » est une traduction traditionnelle et largement reçue dans ce contexte, mais l’identification minéralogique reste incertaine; « onyx » est signalé en note.
- source_word: וְאַחְלָמָה
  choice: et une améthyste
  rationale: אַחְלָמָה est communément identifié à l’améthyste dans les listes des pierres du pectoral; la conjonction est explicitement rendue.
