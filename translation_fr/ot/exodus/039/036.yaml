lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: la table
  rationale: שֻׁלְחָן désigne simplement une table. Le contexte identifie déjà le mobilier du sanctuaire ; il n’est donc pas nécessaire d’ajouter une précision absente de l’hébreu.
- source_word: כָּל כֵּלָיו
  choice: tous ses ustensiles
  rationale: כְּלִי peut désigner un objet, un récipient ou un instrument. « Ustensiles » est ici concret, naturel en français moderne et adapté aux accessoires associés à la table.
- source_word: לֶחֶם הַפָּנִים
  choice: le pain de la Présence[a]
  rationale: L’expression signifie littéralement « pain de la face » ou « pain de la présence ». « Pain de la Présence » conserve l’image hébraïque et son lien avec la présence divine, sans la développer en paraphrase.
- source_word: אֶת ... אֶת ... וְאֵת
  choice: '[non traduit séparément]'
  rationale: Ces particules marquent et coordonnent les compléments d’objet dans l’énumération. Leur fonction est naturellement rendue en français par la syntaxe et la conjonction.
theological_decisions:
- issue: Sens de הַפָּנִים dans le nom cultuel du pain
  choice: la Présence
  alternative: la face ; ce qui est placé devant le SEIGNEUR
  rationale: Le français « Présence » préserve la portée cultuelle de l’expression sans expliciter davantage que l’hébreu la personne devant laquelle le pain est placé. La majuscule indique l’allusion à la présence divine tout en maintenant la concision du texte.
translation_notes:
  register: Formulation concise et digne, conforme au caractère d’énumération du passage. Le tiret final est conservé parce que la phrase se poursuit dans le contexte. Le marqueur de note est placé après « pain de la Présence », expression à laquelle la variante se rapporte.
