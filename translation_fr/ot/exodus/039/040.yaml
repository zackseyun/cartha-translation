base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/040.yaml
  text: the hangings of the court[a], its pillars and its bases, and the screen for the gate of the court, its ropes and its pegs, and all the utensils for the service of the tabernacle, for the tent of meeting[c][b];
translation:
  language: fr
  text: les tentures de la cour, ses piliers et leurs socles, le rideau pour l’entrée de la cour, ses cordages et ses piquets, ainsi que tout le matériel pour le service du tabernacle, pour la tente de la Rencontre ;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַלְעֵי הֶחָצֵר
  choice: les tentures de la cour
  rationale: Dans ce contexte, קְלָעִים désigne les panneaux de tissu qui formaient l’enceinte. « Tentures » les distingue naturellement du rideau d’entrée.
- source_word: עַמֻּדֶיהָ
  choice: ses piliers
  rationale: Le terme désigne les supports verticaux de l’enceinte ; « piliers » convient au registre d’inventaire cultuel.
- source_word: אֲדָנֶיהָ
  choice: leurs socles
  rationale: Il s’agit des pièces de fondation dans lesquelles les piliers étaient fixés. Le pronom est rendu par « leurs » en français pour renvoyer clairement aux piliers, malgré le suffixe féminin singulier hébreu renvoyant grammaticalement à la cour.
- source_word: הַמָּסָךְ לְשַׁעַר הֶחָצֵר
  choice: le rideau pour l’entrée de la cour
  rationale: מָסָךְ désigne ici la tenture fermant le passage. « Entrée » décrit plus naturellement qu’« une porte » cette ouverture textile, tout en rendant שַׁעַר.
- source_word: מֵיתָרָיו
  choice: ses cordages
  rationale: Le mot désigne les liens servant à maintenir la structure. « Cordages » est clair, concret et approprié à l’installation de la tente et de la cour.
- source_word: וִיתֵדֹתֶיהָ
  choice: ses piquets
  rationale: Ce sont les piquets enfoncés dans le sol pour fixer les cordages.
- source_word: כָּל כְּלֵי עֲבֹדַת הַמִּשְׁכָּן
  choice: tous les objets nécessaires au service du tabernacle
  rationale: כְּלֵי est un terme large pour les objets, instruments ou accessoires. L’ajout idiomatique de « nécessaires » exprime leur fonction sans les réduire à des récipients.
- source_word: לְאֹהֶל מוֹעֵד
  choice: pour la tente de la Rencontre
  rationale: Cette désignation traditionnelle reste transparente et préserve la relation syntaxique avec le matériel destiné au sanctuaire.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. La traduction conserve la forme d’énumération du contexte. « Tabernacle » maintient la désignation cultuelle consacrée, tandis que « tente de la Rencontre » rend distinctement אֹהֶל מוֹעֵד.
