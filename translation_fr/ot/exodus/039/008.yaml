  text: וַ/יַּ֧עַשׂ אֶת הַ/חֹ֛שֶׁן מַעֲשֵׂ֥ה חֹשֵׁ֖ב כְּ/מַעֲשֵׂ֣ה אֵפֹ֑ד זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֥שׁ מָשְׁזָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/008.yaml
  text: 'He made the breastpiece[a], the work of a skillful designer, like the work of the ephod: of gold, blue, purple, scarlet yarn[b], and finely twisted linen.'
translation:
  language: fr
  text: 'Il fit le pectoral[a], ouvrage d’un artisan habile, fait de la même manière que l’éphod : d’or, de fil bleu, de pourpre, d’écarlate et de fin lin retors.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionnellement « cuirasse ». « Pectoral » désigne ici la pièce sacerdotale portée sur la poitrine et ne suggère pas une pièce d’armure.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol de עשה fait progresser le récit et se rend naturellement par un passé simple dans ce registre narratif.
- source_word: הַחֹשֶׁן
  choice: le pectoral
  rationale: חֹשֶׁן désigne la pièce sacerdotale portée sur la poitrine et rattachée à l’éphod. « Pectoral » est le terme français consacré sans évoquer nécessairement une armure.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: ouvrage d’un artisan habile
  rationale: L’expression souligne un travail spécialisé, conçu et exécuté avec art, probablement orné de motifs.
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: travaillé comme l’éphod
  rationale: Cette formulation naturelle conserve la comparaison portant sur la facture du pectoral et celle de l’éphod.
- source_word: אֵפֹד
  choice: l’éphod
  rationale: Terme cultuel technique sans équivalent français exact ; la translittération traditionnelle en préserve la spécificité.
- source_word: זָהָב
  choice: en or
  rationale: Désigne directement le matériau entrant dans la confection.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: en fils bleus, pourpres et écarlates
  rationale: Dans cette liste textile, les termes de couleur désignent des matières teintes ; « fils » explicite naturellement leur emploi sans transformer les couleurs en notions abstraites.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: et en fin lin retors
  rationale: שֵׁשׁ désigne le fin lin et מָשְׁזָר un fil retordu ; « fin lin retors » conserve le détail textile dans une formulation française digne et concise.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le passé simple convient à la narration biblique écrite. Les termes cultuels « pectoral » et « éphod » sont conservés pour leur précision, tandis que la liste des matériaux est formulée de façon naturelle.
