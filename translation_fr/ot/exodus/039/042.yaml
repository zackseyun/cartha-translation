source:
  edition: WLC
  text: כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה כֵּ֤ן עָשׂוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֖ת כָּל הָ/עֲבֹדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/042.yaml
  text: According to all that Yahweh had commanded Moses[a], so the sons of Israel did all the work.
translation:
  language: fr
  text: Conformément à tout ce que Yahweh avait ordonné à Moïse, les fils d’Israël[a] accomplirent ainsi tout le travail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les enfants d’Israël » ou « les Israélites ». L’hébreu dit littéralement « les fils d’Israël », désignation collective courante du peuple d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר
  choice: Conformément à tout ce que
  rationale: La préposition כְּ exprime ici la conformité, et כֹּל אֲשֶׁר désigne l’ensemble des instructions données. Cette formulation restitue naturellement les deux éléments.
- source_word: צִוָּה
  choice: avait ordonné
  rationale: Le verbe signifie « ordonner, commander ». Le plus-que-parfait indique naturellement que l’ordre avait précédé l’exécution du travail.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: אֶת מֹשֶׁה
  choice: à Moïse
  rationale: Avec צוה, Moïse est la personne qui reçoit l’ordre. Le français demande ici la construction « ordonner à quelqu’un ».
- source_word: כֵּן עָשׂוּ
  choice: accomplirent … conformément
  rationale: כֵּן renvoie à la conformité annoncée au début de la phrase, tandis que עשה désigne l’exécution effective de ce qui avait été prescrit. En français, cette relation est rendue clairement par la construction d’ensemble.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La traduction conserve la forme littérale et la désignation collective traditionnelle du peuple, sans réduire son sens aux seuls hommes.
- source_word: אֵת כָּל הָעֲבֹדָה
  choice: tout le travail
  rationale: Dans le contexte de la fabrication du sanctuaire, עֲבֹדָה désigne l’ensemble du travail prescrit. « Tout le travail » est précis et naturel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le Seigneur
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les enfants d’Israël ; les Israélites
  rationale: La formulation hébraïque est conservée comme désignation collective du peuple de l’alliance. Dans ce contexte, elle vise l’ensemble du peuple et non exclusivement les personnes de sexe masculin.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La phrase conserve l’insistance de l’hébreu sur la conformité totale entre l’ordre donné et le travail accompli.
