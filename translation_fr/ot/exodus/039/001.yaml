base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/001.yaml
  text: And from the blue[a], the purple, and the scarlet yarn they made finely woven garments for ministering in the sanctuary, and they made the holy garments for Aaron, just as Yahweh had commanded Moses.
translation:
  language: fr
  text: Avec les fils bleus, pourpres et écarlates, ils confectionnèrent des vêtements ouvragés[a] pour le service dans le sanctuaire. Ils confectionnèrent les vêtements sacrés destinés à Aaron, comme Yahweh l’avait ordonné à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « des vêtements de service ». Le sens précis de l’expression hébraïque est incertain : elle peut souligner soit la fonction de ces vêtements dans le service du sanctuaire, soit leur confection soignée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַתְּכֵלֶת וְהָאַרְגָּמָן וְתוֹלַעַת הַשָּׁנִי
  choice: Avec les fils bleus, pourpres et écarlates
  rationale: Les termes désignent les couleurs ou matières textiles caractéristiques du sanctuaire. « Fils » explicite naturellement le contexte textile sans préciser indûment les nuances exactes des teintures anciennes.
- source_word: בִגְדֵי שְׂרָד
  choice: des vêtements ouvragés[a]
  rationale: L’expression spécialisée peut évoquer soit la confection soignée des vêtements, soit leur fonction cultuelle. « Vêtements ouvragés » convient au contexte de fabrication textile, tandis que l’autre interprétation est conservée en note.
- source_word: לְשָׁרֵת
  choice: pour assurer le service
  rationale: Cette formulation rend la finalité cultuelle du verbe tout en restant naturelle en français moderne.
- source_word: בַּקֹּדֶשׁ
  choice: dans le sanctuaire
  rationale: Le terme désigne ici l’espace sacré où s’exerce le ministère, sans qu’il soit nécessaire de le limiter à une pièce particulière.
- source_word: בִגְדֵי הַקֹּדֶשׁ
  choice: les vêtements sacrés
  rationale: Traduction directe et idiomatique de la désignation des vêtements sacerdotaux d’Aaron.
- source_word: לְאַהֲרֹן
  choice: destinés à Aaron
  rationale: La préposition indique la destination ou l’usage prévu de ces vêtements.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu comme nom propre plutôt que remplacé par un titre.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: comme Yahweh l’avait ordonné à Moïse
  rationale: Le plus-que-parfait renvoie naturellement aux instructions divines données auparavant, et le pronom reprend l’ensemble du travail décrit.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme; « Yahweh » préserve ici le nom personnel de Dieu au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « ils confectionnèrent » conserve la structure hébraïque et distingue les vêtements ouvragés des vêtements sacrés d’Aaron.
