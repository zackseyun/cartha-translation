base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/005.yaml
  text: 'And the skillfully woven band of his ephod[a], which was on it, was of one piece with it and made like it: of gold, blue, purple, scarlet yarn, and fine twisted linen, just as Yahweh had commanded Moses.'
translation:
  language: fr
  text: 'La bande ouvragée de son éphod[a], qui se trouvait sur celui-ci, était d’une même pièce que l’éphod et travaillée de la même manière : en or, en fil bleu, pourpre et écarlate, et en lin fin retors, comme Yahweh l’avait ordonné à Moïse.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la bande décorative de son éphod… provenait de l’éphod et était de même facture que lui ». L’hébreu souligne le lien étroit de la bande avec l’éphod et la correspondance de leur fabrication.
    reason: Alternative lexicale pour חֵשֶׁב et explicitation prudente de מִמֶּנּוּ הוּא et de כְּמַעֲשֵׂהוּ.
lexical_decisions:
- source_word: חֵשֶׁב
  choice: ceinture ouvragée
  rationale: Dans le contexte des vêtements sacerdotaux, le nom désigne la bande ou ceinture textile associée à l’éphod. « Ouvragée » exprime le caractère élaboré du travail sans surcharger la formulation.
- source_word: אֲפֻדָּתוֹ
  choice: de l’éphod
  rationale: Le suffixe masculin singulier renvoie au porteur du vêtement. En français, dans la description de la confection, « la ceinture de l’éphod » est plus naturel que la répétition de « son » et conserve clairement le rapport entre les deux éléments.
- source_word: אֲשֶׁר עָלָיו
  choice: qui se trouvait sur lui
  rationale: Le pronom renvoie naturellement à l’éphod. Cette traduction conserve la valeur spatiale de עַל sans expliciter davantage que l’hébreu le mode d’attache.
- source_word: מִמֶּנּוּ הוּא
  choice: était d’une seule pièce avec lui
  rationale: L’expression marque que la ceinture faisait corps avec l’éphod et n’était pas une pièce indépendante.
- source_word: כְּמַעֲשֵׂהוּ
  choice: travaillée de la même manière
  rationale: La formule indique une correspondance de facture ou d’exécution avec l’éphod. Elle est distinguée de l’idée d’unité structurelle portée par la proposition précédente.
- source_word: זָהָב
  choice: or
  rationale: Équivalent usuel du matériau mentionné.
- source_word: תְּכֵלֶת
  choice: fil bleu
  rationale: Le terme désigne ici une matière textile teinte. L’ajout de « fil » rend explicite le contexte textile et régit naturellement les couleurs qui suivent.
- source_word: אַרְגָּמָן
  choice: pourpre
  rationale: Rendu traditionnel et précis de cette couleur ou teinture textile.
- source_word: תוֹלַעַת שָׁנִי
  choice: écarlate
  rationale: L’expression désigne une matière teinte en écarlate. Avec « fil » placé avant la série des couleurs, la formulation française demeure concise.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: fin lin retors
  rationale: « Fin lin » traduit la qualité de la matière, et « retors » son filage ou torsion; ce vocabulaire textile est précis et établi en français.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: comme Yahweh l’avait ordonné à Moïse
  rationale: La formule exprime la conformité à un commandement antérieur. Le plus-que-parfait convient au contexte narratif, et le pronom « l’ » reprend naturellement l’ouvrage prescrit.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve ici le nom divin personnel plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, naturel et digne. Le vocabulaire textile reste précis sans devenir technique au point d’obscurcir le sens. Les pronoms masculins « lui » renvoient à « l’éphod ».
