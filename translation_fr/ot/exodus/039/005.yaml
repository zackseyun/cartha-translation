  naturalness: Le registre est globalement naturel et digne. « Bande ouvragée » est plus immédiatement clair que « ceinture ouvragée » pour une pièce textile dont la fonction exacte ne doit pas être surdéfinie. « Lin fin retors » est un ordre plus idiomatique en français moderne que « fin lin retors ».
  terminology: « Éphod », « pourpre », « écarlate », « lin fin retors » et « Yahweh » conviennent. « Yahweh » suit la décision explicite du projet pour le tétragramme. La note conserve l’alternative lexicale sans faire passer une interprétation confessionnelle pour certaine.
