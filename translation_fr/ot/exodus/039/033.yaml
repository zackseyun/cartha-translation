base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/033.yaml
  text: 'Then they brought the tabernacle to Moses—the tent and all its furnishings: its clasps[a], its frames, its bars, its pillars[b], and its bases.'
translation:
  language: fr
  text: 'Puis ils apportèrent à Moïse le tabernacle, la tente et tous ses éléments : ses agrafes, ses planches[a], ses traverses, ses piliers et ses socles[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cadres ». Le terme hébreu désigne les pièces verticales constituant l’ossature du tabernacle.
    reason: lexical_alternative
  - marker: b
    text: Ou « bases ». Le terme hébreu peut désigner les pièces de support dans lesquelles s’inséraient des éléments de la structure.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: Puis ils apportèrent
  rationale: Le wayyiqtol du hiphil de בוא fait avancer le récit et exprime ici l’action d’apporter. « Puis » rend naturellement la succession narrative.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: מִשְׁכָּן désigne dans l’Exode la demeure sacrée. « Tabernacle » est le terme français consacré et demeure intelligible dans ce contexte.
- source_word: אֶל מֹשֶׁה
  choice: à Moïse
  rationale: La préposition אֶל indique simplement la direction vers une personne.
- source_word: הָאֹהֶל
  choice: la tente
  rationale: אֹהֶל signifie normalement « tente » et précise ici un élément du tabernacle sans qu’il soit nécessaire d’expliciter davantage son rapport à l’ensemble.
- source_word: כָּל כֵּלָיו
  choice: tous ses éléments
  rationale: כֵּלִים est un terme large couvrant objets, équipement et pièces constitutives. « Éléments » convient à la liste, qui comprend surtout des composants structurels.
- source_word: קְרָסָיו
  choice: ses agrafes
  rationale: קְרָסִים désigne les attaches servant à réunir les tentures. « Agrafes » exprime clairement cette fonction en français.
- source_word: קְרָשָׁיו
  choice: ses cadres
  rationale: קְרָשִׁים désigne les pièces verticales formant l’ossature du tabernacle. « Cadres » rend leur fonction structurelle; « planches » reste une possibilité plus traditionnelle.
- source_word: בריחו
  choice: ses traverses
  rationale: בְּרִיחַ désigne les barres horizontales qui maintiennent ensemble les cadres. « Traverses » est précis et naturel en contexte de construction.
- source_word: עַמֻּדָיו
  choice: ses piliers
  rationale: עַמּוּד désigne les supports verticaux; « piliers » est un équivalent français conventionnel.
- source_word: אֲדָנָיו
  choice: ses socles
  rationale: אֶדֶן désigne les pièces de fondation dans lesquelles s’emboîtaient les cadres ou les piliers. « Socles » est clair, tandis que « bases à emboîtement » en explicite la forme.
