revisions:
- from: 'Puis ils apportèrent le tabernacle à Moïse : la tente et tous ses éléments, ses agrafes, ses cadres[a], ses traverses, ses piliers et ses socles[b].'
  to: 'Puis ils apportèrent à Moïse le tabernacle, la tente et tous ses éléments : ses agrafes, ses planches[a], ses traverses, ses piliers et ses socles[b].'
  rationale: La révision remplace un terme français potentiellement trompeur par le rendu structurel le plus direct, tout en préservant en note l’alternative fonctionnelle attestée dans l’audit anglais. Elle reformule aussi la note sur les socles pour éviter une précision technique excessive, sans modifier le sens du verset.
