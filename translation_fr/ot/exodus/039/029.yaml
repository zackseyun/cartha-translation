base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/029.yaml
  text: and the sash of finely twisted linen[a], and blue and purple and scarlet yarn, the work of an embroiderer[b], just as Yahweh had commanded Moses.
translation:
  language: fr
  text: ainsi que la ceinture[a], en fin lin retors et en fils bleus, pourpres et écarlates[b], ouvrage de brodeur, comme Yahweh l’avait ordonné à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’écharpe » ou « la bande servant de ceinture ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu désigne une matière teinte en écarlate ; « cramoisi » est une autre traduction possible.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַבְנֵט
  choice: la ceinture
  rationale: Le terme désigne la ceinture ou l’écharpe portée avec les vêtements sacerdotaux. « Ceinture » est naturel en français et convient à cette pièce vestimentaire.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: fin lin retors
  rationale: שֵׁשׁ désigne du lin fin, tandis que מָשְׁזָר précise que les fils sont retors. Cette formulation concise conserve le matériau et son mode de fabrication.
- source_word: תְכֵלֶת
  choice: fils bleu
  rationale: Le mot désigne une matière textile teinte en bleu prestigieux. « Fils » est explicité une seule fois pour rendre naturellement en français toute la série des couleurs.
- source_word: אַרְגָּמָן
  choice: pourpre
  rationale: Rendu traditionnel et précis de cette matière textile teinte en pourpre dans le contexte du sanctuaire.
- source_word: תוֹלַעַת שָׁנִי
  choice: écarlate
  rationale: L’expression désigne une matière teinte en écarlate. Le nom « fils », placé avant la série, s’applique également à cette couleur.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: ouvrage de brodeur
  rationale: La formule met en valeur le travail spécialisé de décoration textile; « ouvrage de brodeur » en préserve la concision et l’accent sur l’artisan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: comme Yahweh l’avait ordonné à Moïse
  rationale: Cette formule récurrente souligne la conformité aux instructions divines; le plus-que-parfait convient au bilan narratif en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » conserve le nom propre et évite de le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve le caractère récapitulatif du verset. Les tirets isolent l’indication artisanale sans masquer son lien avec l’ensemble de la ceinture. Les appels de notes ont été placés auprès des termes auxquels ils se rapportent.
