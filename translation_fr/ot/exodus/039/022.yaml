  text: And he made the robe of the ephod[a], the work of a weaver[b], all of blue.
translation:
  language: fr
  text: Il fit la robe de l’éphod, ouvrage de tisserand, tout en bleu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne une étoffe teinte employée pour le sanctuaire et les vêtements sacerdotaux; sa nuance exacte est discutée, bien qu’elle soit traditionnellement rendue par « bleu ».
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol poursuit la séquence narrative; « Il fit » est direct et naturel en français.
- source_word: מְעִיל הָאֵפֹד
  choice: le manteau de l’éphod
  rationale: מְעִיל désigne ici le vêtement extérieur associé à l’éphod; « manteau » est clair dans le contexte sacerdotal, tandis qu’« éphod » est conservé comme terme technique.
- source_word: מַעֲשֵׂה אֹרֵג
  choice: ouvrage de tisserand
  rationale: Cette formulation rend littéralement et naturellement le procédé de fabrication, sans ajouter l’idée de compétence, absente de l’hébreu.
- source_word: כְּלִיל
  choice: entièrement
  rationale: 'Le terme exprime la totalité: le manteau tout entier avait cette couleur.'
- source_word: תְּכֵלֶת
  choice: bleu
  rationale: Dans cette phrase, le terme qualifie l’ensemble du manteau. « Bleu » évite d’ajouter explicitement « fil », absent du texte, tandis qu’une note signale la nature textile du terme hébreu.
