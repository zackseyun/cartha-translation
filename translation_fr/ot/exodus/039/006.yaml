id: EXO.39.6
reference: Exodus 39:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַֽ/יַּעֲשׂוּ֙ אֶת אַבְנֵ֣י הַ/שֹּׁ֔הַם מֻֽסַבֹּ֖ת מִשְׁבְּצֹ֣ת זָהָ֑ב מְפֻתָּחֹת֙ פִּתּוּחֵ֣י חוֹתָ֔ם עַל שְׁמ֖וֹת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/006.yaml
  text: And they made the onyx stones[a], enclosed in settings of gold, engraved like the engravings of a seal, according to the names of the sons of Israel.
translation:
  language: fr
  text: Ils façonnèrent les pierres d’onyx[a], enchâssées dans des montures d’or et gravées comme on grave un sceau, d’après les noms des fils d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « pierres de shoham »; l’identification exacte de cette pierre précieuse est incertaine, bien que « onyx » soit la traduction traditionnelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Ils façonnèrent
  rationale: Dans ce contexte artisanal, « façonner » exprime naturellement l’action de fabriquer tout en restant dans le champ sémantique large de עשה.
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: les pierres d’onyx[a]
  rationale: « Onyx » est l’équivalent traditionnel et immédiatement compréhensible de שֹׁהַם, mais l’identification minéralogique demeure incertaine; la note conserve cette réserve.
- source_word: מֻסַבֹּת מִשְׁבְּצֹת זָהָב
  choice: enchâssées dans des montures d’or
  rationale: Cette formulation rend l’idée de pierres entourées et maintenues par des éléments ouvragés en or, sans préciser indûment la technique exacte.
- source_word: מְפֻתָּחֹת פִּתּוּחֵי חוֹתָם
  choice: gravées comme on grave un sceau
  rationale: La tournure française restitue l’incision caractéristique d’un sceau ainsi que l’insistance de la construction hébraïque, sans lourdeur excessive.
- source_word: עַל שְׁמוֹת
  choice: d’après les noms
  rationale: '« D’après » préserve la relation de correspondance exprimée ici par עַל: la gravure reproduit les noms concernés.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction conserve la forme masculine et l’expression tribale traditionnelle de l’hébreu, plutôt que de la généraliser en « Israélites ».
theological_decisions:
- issue: Désignation collective genrée בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les enfants d’Israël; les Israélites
  rationale: L’expression hébraïque est explicitement masculine et renvoie ici aux fils nommés d’Israël, ancêtres éponymes des tribus; la traduction formelle préserve cette portée.
translation_notes:
  register: Français international moderne, digne et lisible. Le vocabulaire artisanal (« façonnèrent », « enchâssées », « montures ») convient au contexte sans surdéterminer la technique d’orfèvrerie.
