source:
  edition: WLC
  text: אֶת בִּגְדֵ֥י הַ/שְּׂרָ֖ד לְ/שָׁרֵ֣ת בַּ/קֹּ֑דֶשׁ אֶת בִּגְדֵ֤י הַ/קֹּ֨דֶשׁ֙ לְ/אַהֲרֹ֣ן הַ/כֹּהֵ֔ן וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו לְ/כַהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/041.yaml
  text: the garments of woven work for ministering in the sanctuary[a], the holy garments for Aaron the priest, and the garments of his sons for serving as priests.
translation:
  language: fr
  text: les vêtements ouvragés destinés au service dans le sanctuaire[a], les vêtements sacrés destinés au prêtre Aaron et les vêtements de ses fils pour exercer le sacerdoce.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les vêtements de service » ; l’expression hébraïque désigne probablement des pièces textiles spécialement confectionnées pour le service dans le sanctuaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי
  choice: vêtements
  rationale: « Vêtements » rend naturellement le terme général בֶּגֶד et convient au contexte sacerdotal sans introduire le vocabulaire ecclésiastique plus tardif de « ornements ».
- source_word: הַשְּׂרָד
  choice: ouvragés
  rationale: Dans ce contexte lié au sanctuaire, שְׂרָד semble désigner un travail textile spécialement réalisé. « Ouvragés » conserve cette idée sans préciser indûment la technique employée.
- source_word: לְשָׁרֵת
  choice: destinés au service
  rationale: Le verbe שׁרת désigne ici un service officiel dans le cadre du culte. Cette formulation est claire et évite la répétition moins naturelle de « servir ».
- source_word: בַּקֹּדֶשׁ
  choice: dans le sanctuaire
  rationale: קֹדֶשׁ désigne ici l’espace sacré où s’effectue le service, plutôt que la sainteté comme notion abstraite.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: les vêtements sacrés
  rationale: « Vêtements sacrés » rend directement l’idée de vêtements mis à part pour le service sacerdotal et sonne naturellement en français moderne.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: destinés au prêtre Aaron
  rationale: La formulation exprime à la fois la destination des vêtements et la fonction d’Aaron, tout en restant naturelle en français.
- source_word: בִּגְדֵי בָנָיו
  choice: les vêtements de ses fils
  rationale: Cette traduction suit simplement la construction possessive hébraïque.
- source_word: לְכַהֵן
  choice: pour exercer le sacerdoce
  rationale: Le verbe dénominatif כּהן signifie remplir la fonction de prêtre. « Exercer le sacerdoce » en exprime précisément le sens en français idiomatique.
theological_decisions:
- issue: Rapport entre בִּגְדֵי הַשְּׂרָד et בִּגְדֵי הַקֹּדֶשׁ
  choice: 'Maintenir deux désignations distinctes : « vêtements ouvragés » puis « vêtements sacrés » destinés à Aaron et à ses fils.'
  alternative: Comprendre les deux expressions comme presque synonymes et traduire la première par « vêtements de service ».
  rationale: La répétition hébraïque invite à conserver les deux expressions sans les fusionner. Toutefois, le sens précis de שְׂרָד reste incertain ; une note signale donc l’autre interprétation possible sans trancher au-delà des données.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure d’une liste héritée du contexte. « Ouvragés » indique une confection spéciale sans imposer « tissés », trop précis, tandis que la note préserve l’ambiguïté lexicale de שְׂרָד.
