base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/020.yaml
  text: They made two gold rings and put them on the two shoulder pieces of the ephod[a], below, on its front side, opposite its joining[b], above the skillfully woven band of the ephod.
translation:
  language: fr
  text: Ils fabriquèrent deux anneaux d’or et les placèrent sur les deux épaulières de l’éphod, au bas des épaulières, sur le devant, vis-à-vis de son assemblage[a], au-dessus de la ceinture ouvragée[b] de l’éphod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en face de sa jointure » ou « à la hauteur de son point d’attache ». Le terme hébreu désigne l’endroit où les parties de l’éphod étaient réunies.
    reason: lexical_alternative
  - marker: b
    text: Ou « de la bande tissée de l’éphod ».
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת
  choice: anneaux
  rationale: Dans le contexte du mobilier sacré et des vêtements sacerdotaux, le terme désigne naturellement des anneaux métalliques servant à l’attache.
- source_word: כִתְפֹת
  choice: épaulières
  rationale: Le mot désigne ici les parties de l’éphod qui reposent sur les épaules, et non les épaules anatomiques seules.
- source_word: מִלְמַטָּה
  choice: dans leur partie inférieure
  rationale: Cette formulation française exprime clairement le placement des anneaux au bas des épaulières.
- source_word: מִמּוּל פָּנָיו
  choice: sur le devant
  rationale: L’expression signifie littéralement «du côté de sa face»; appliquée à un vêtement, elle indique naturellement le devant.
- source_word: לְעֻמַּת מֶחְבַּרְתּוֹ
  choice: dans l’alignement de son point d’assemblage
  rationale: לְעֻמַּת exprime une correspondance ou un vis-à-vis spatial, tandis que מֶחְבֶּרֶת désigne l’endroit où les parties sont réunies. La formulation conserve cette relation sans imposer l’idée plus étroite d’une couture.
- source_word: חֵשֶׁב
  choice: ceinture ouvragée
  rationale: Dans la description de l’éphod, le terme désigne sa bande de fixation travaillée ou tissée; «ceinture ouvragée» est clair, digne et adapté à un vêtement.
- source_word: אֵפֹד
  choice: éphod
  rationale: Il s’agit du terme technique traditionnel pour ce vêtement sacerdotal, sans équivalent français exact.
- source_word: וַיִּתְּנֻם
  choice: les placèrent
  rationale: Le verbe indique simplement la mise en place des anneaux; «placèrent» convient au registre descriptif et soutenu du passage.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase suit précisément la succession des indications spatiales de l’hébreu tout en évitant un calque lourd. Les termes techniques liés au vêtement sacerdotal sont conservés ou explicités avec sobriété.
