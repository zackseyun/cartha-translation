  text: the turban of fine linen[a], the ornate caps of fine linen, and the undergarments of finely twisted linen,
translation:
  language: fr
  text: le turban en fin lin, les bonnets d’apparat en fin lin et les sous-vêtements de lin, en fin lin retors[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’ordre des mots hébreux permet de rattacher particulièrement « fin lin retors » au dernier élément, tout en rappelant la description de la matière employée dans l’ensemble des vêtements sacerdotaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּצְנֶפֶת
  choice: le turban
  rationale: Le terme désigne la coiffure sacerdotale, en particulier celle du grand prêtre. « Turban » est précis, courant et bien établi dans ce contexte.
- source_word: שֵׁשׁ
  choice: fin lin
  rationale: Le mot désigne un lin de qualité fine, et non simplement le lin en général. « Fin lin » conserve cette nuance et convient au vocabulaire des vêtements sacerdotaux.
- source_word: פַּאֲרֵי הַמִּגְבָּעֹת
  choice: les bonnets d’apparat
  rationale: La construction associe l’idée de parure ou de splendeur aux bonnets sacerdotaux. « Bonnets d’apparat » exprime naturellement en français leur caractère ornemental sans en faire des ornements distincts.
- source_word: מִכְנְסֵי הַבָּד
  choice: les sous-vêtements en toile de lin
  rationale: Le nom désigne des vêtements couvrant le bas du corps et portés sous les autres habits sacerdotaux. « Sous-vêtements » est clair et actuel; « en toile de lin » rend la matière indiquée par הַבָּד.
- source_word: מָשְׁזָר
  choice: retors
  rationale: Le terme décrit des fils tordus ou retordus. « Retors » est le terme textile français précis et s’intègre naturellement à l’expression « fin lin retors ».
