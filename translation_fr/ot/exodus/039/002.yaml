  text: And he made the ephod of gold[a], blue, purple, scarlet yarn[b], and finely twisted linen.
translation:
  language: fr
  text: Il fit l’éphod d’or, de fil bleu, de pourpre, d’écarlate et de fin lin retors.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol de עשה fait progresser le récit. Le passé simple convient au registre narratif biblique français tout en restant clair.
- source_word: אֶת
  choice: '[marque de l’objet direct, non traduite]'
  rationale: Cette particule signale que הָאֵפֹד est l’objet direct défini et n’a pas d’équivalent naturel en français.
- source_word: הָאֵפֹד
  choice: l’éphod
  rationale: Éphod est le terme français consacré pour ce vêtement sacerdotal particulier; une translittération préserve sa spécificité cultuelle.
- source_word: זָהָב
  choice: avec de l’or
  rationale: Le nom désigne simplement le matériau. La préposition « avec » rend naturellement en français la série des matériaux employés sans préciser ici qu’il s’agissait de fils d’or, détail fourni par le contexte voisin.
- source_word: תְּכֵלֶת
  choice: du fil bleu
  rationale: Le terme désigne ici une matière textile teinte en bleu. « Fil » explicite sobrement le contexte textile et régit naturellement les trois couleurs coordonnées.
- source_word: וְאַרְגָּמָן
  choice: pourpre
  rationale: Terme courant pour la matière textile de couleur pourpre dans les descriptions du sanctuaire; il dépend ici de « du fil ».
- source_word: וְתוֹלַעַת שָׁנִי
  choice: écarlate
  rationale: L’expression désigne une matière teinte en écarlate. Dans la coordination « du fil bleu, pourpre et écarlate », la nature textile demeure explicite sans répétition lourde.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: et du fin lin retors
  rationale: שֵׁשׁ désigne le fin lin et מָשְׁזָר indique qu’il est retors, c’est-à-dire formé de fils tordus ensemble. Cette formulation française est précise, concise et traditionnelle sans être archaïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve la liste hébraïque des matériaux, tandis que « du fil » n’est exprimé qu’une fois devant les trois couleurs afin d’éviter une répétition pesante. Aucun ajout interprétatif ni particularisme confessionnel.
