translation:
  language: fr
  text: 'et la quatrième rangée : une chrysolithe[a], un onyx et un jaspe, sertis dans des montures d’or, dans leurs emplacements[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification précise de plusieurs pierres du pectoral du grand prêtre est incertaine. « Chrysolithe », « onyx » et « jaspe » sont des équivalents traditionnels courants.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie ici une formulation technique dont le sens précis est discuté. On peut aussi traduire : « entourés de sertissages d’or, dans leurs sertissages ». Elle décrit vraisemblablement la manière dont les pierres étaient fixées dans les emplacements qui leur étaient destinés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: et la quatrième rangée
  rationale: Dans la liste des pierres du pectoral, טוּר désigne une rangée. La conjonction וְ est conservée naturellement par « et ».
- source_word: תַּרְשִׁישׁ
  choice: une chrysolithe
  rationale: L’identification exacte de cette pierre ancienne demeure incertaine. « Chrysolithe » est un équivalent traditionnel courant en français biblique, sans prétendre trancher la question minéralogique.
- source_word: שֹׁהַם
  choice: un onyx
  rationale: « Onyx » est l’équivalent traditionnel et intelligible dans les passages sacerdotaux, bien que l’identification minéralogique précise soit discutée.
- source_word: וְיָשְׁפֵה
  choice: et un jaspe
  rationale: « Jaspe » correspond bien au terme hébreu et demeure l’appellation française usuelle.
- source_word: מֽוּסַבֹּת מִשְׁבְּצֹת זָהָב
  choice: enchâssés dans des montures d’or
  rationale: La tournure rend le sens passif de pierres entourées ou fixées dans un ouvrage d’orfèvrerie, avec un vocabulaire français naturel.
- source_word: בְּמִלֻּאֹתָם
  choice: intégré au rendu « enchâssés dans des montures d’or »
  rationale: Cette expression technique renvoie vraisemblablement à la mise en place des pierres dans leurs logements. Une traduction séparée produirait en français une répétition obscure; la note signale l’incertitude et la redondance de l’hébreu.
