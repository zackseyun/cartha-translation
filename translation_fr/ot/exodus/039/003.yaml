base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/003.yaml
  text: They hammered out sheets of gold and cut it into threads[a], to work it into the blue and into the purple and into the scarlet yarn and into the fine linen[c][b], the work of a skillful designer.
translation:
  language: fr
  text: Ils martelèrent des plaques d’or pour les amincir, puis l’on découpa l’or en fils[a], afin de l’incorporer au fil bleu, au fil pourpre, au fil écarlate et au fin lin, en ouvrage artistique[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en fines lanières ». L’hébreu passe ici du pluriel (« ils martelèrent ») au singulier (« il découpa »), sans préciser qui accomplit cette seconde action.
    reason: lexical_and_grammatical_alternative
  - marker: b
    text: L’expression hébraïque désigne un travail artistique exécuté avec savoir-faire; on pourrait aussi traduire « un ouvrage de tisserand d’art » ou « un travail savamment conçu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְרַקְּעוּ אֶת פַּחֵי הַזָּהָב
  choice: Ils martelèrent des plaques d’or pour les amincir
  rationale: Le verbe רקע décrit ici le martelage du métal pour l’étendre en éléments minces. « Pour les amincir » explicite naturellement en français le résultat du martelage, tandis que « plaques d’or » rend פַּחֵי הַזָּהָב sans suggérer des feuilles déjà extrêmement fines.
- source_word: וְקִצֵּץ פְּתִילִם
  choice: puis l’on découpa l’or en fils
  rationale: Le texte massorétique passe d’un verbe au pluriel à un verbe au singulier. La tournure impersonnelle française conserve ce changement sans introduire un artisan précis absent du texte. « Fils » convient à l’emploi textile, tout en laissant en note l’alternative « fines lanières ».
- source_word: לַעֲשׂוֹת בְּתוֹךְ
  choice: afin de l’incorporer à
  rationale: Dans ce contexte de confection textile, בְּתוֹךְ indique que l’or est intégré aux matières colorées. « Incorporer à » exprime clairement cette relation sans imposer une technique plus précise que le texte.
- source_word: הַתְּכֵלֶת ... הָאַרְגָּמָן ... תּוֹלַעַת הַשָּׁנִי
  choice: au fil bleu, au fil pourpre, au fil écarlate
  rationale: Ces termes désignent ici des matières textiles teintes. La répétition de « fil » produit un français clair et cohérent avec les fils d’or, tout en évitant de les prendre pour de simples couleurs abstraites.
- source_word: הַשֵּׁשׁ
  choice: au fin lin
  rationale: Dans les descriptions du sanctuaire, שֵׁשׁ désigne du lin fin; cette traduction traditionnelle reste naturelle et précise en français moderne.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: un ouvrage d’artisan habile
  rationale: Cette expression technique qualifie un travail textile savamment conçu ou exécuté. La formulation retenue préserve l’idée de compétence artistique sans trancher excessivement entre dessinateur, tisserand et artisan.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et concret. La phrase suit les étapes du travail artisanal sans lourdeur. La tournure impersonnelle « l’on découpa » maintient l’indétermination créée par le changement de nombre verbal en hébreu; « artisan habile » garde ouverte l’identité professionnelle exacte suggérée par l’expression technique finale.
