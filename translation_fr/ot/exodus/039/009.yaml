  text: It was square; they made the breastpiece doubled[a], a span its length and a span its width, doubled.
translation:
  language: fr
  text: 'Il était carré. On fit le pectoral double[a] : un empan de long et un empan de large, double.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « replié en deux ». Le mot hébreu indique que le pectoral était confectionné en double épaisseur ou replié sur lui-même.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָבוּעַ
  choice: carré
  rationale: L’adjectif désigne ici une forme à quatre côtés égaux ; « carré » est le terme français courant et précis.
- source_word: הָיָה
  choice: il était
  rationale: Le verbe sert ici de copule dans une description statique de la forme du pectoral.
- source_word: כָּפוּל
  choice: en double
  rationale: Le mot indique une confection en deux épaisseurs ou par repliement. « En double » conserve cette relative ambiguïté sans imposer la manière exacte de fabrication.
- source_word: עָשׂוּ
  choice: on fit
  rationale: Le verbe courant עשה signifie « faire ». Le pronom indéfini « on » rend naturellement en français le pluriel hébreu dont les artisans sont déjà connus par le contexte.
- source_word: הַחֹשֶׁן
  choice: le pectoral
  rationale: Dans le contexte des vêtements sacerdotaux, « pectoral » est le terme français usuel pour cet objet porté sur la poitrine ; il évite d’ajouter « du jugement », absent de ce verset.
- source_word: זֶרֶת
  choice: un empan
  rationale: « Empan » conserve l’unité de mesure ancienne précise plutôt que de la convertir approximativement.
- source_word: אָרְכּוֹ
  choice: il avait un empan de long
  rationale: Cette tournure française naturelle exprime directement la longueur de l’objet.
- source_word: רָחְבּוֹ
  choice: un empan de large
  rationale: « De large » est l’expression moderne et idiomatique correspondant à la largeur.
- source_word: כָּפוּל
  choice: en double
  rationale: La répétition finale du mot hébreu est conservée afin de reprendre et de souligner la confection double, sans introduire la nuance temporelle de « une fois doublé ».
