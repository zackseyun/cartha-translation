source:
  edition: WLC
  text: וַ/תֵּ֕כֶל כָּל עֲבֹדַ֕ת מִשְׁכַּ֖ן אֹ֣הֶל מוֹעֵ֑ד וַֽ/יַּעֲשׂוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/032.yaml
  text: Thus all the work of the tabernacle[a], the tent of meeting, was finished, and the sons of Israel did according to all that Yahweh had commanded Moses[b]; so they did.
translation:
  language: fr
  text: Ainsi fut achevé tout le travail du tabernacle[a], la tente de la Rencontre. Les fils d’Israël[b] firent conformément à tout ce que Yahweh avait ordonné à Moïse ; ainsi ils firent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi se traduire par « demeure ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les Israélites » ; l’expression hébraïque est littéralement « les fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּכֶל
  choice: fut achevé
  rationale: Le verbe כלה indique ici l’achèvement complet du projet. La tournure passive maintient l’accent sur le travail accompli sans introduire d’agent absent du texte.
- source_word: כָּל עֲבֹדַת
  choice: tout le travail
  rationale: Cette expression conserve la portée exhaustive de כָּל et désigne ici l’ensemble du travail de fabrication, plutôt qu’un service liturgique.
- source_word: מִשְׁכַּן
  choice: tabernacle
  rationale: « Tabernacle » est le terme français consacré pour le sanctuaire transportable, tout en laissant possible le sens étymologique de « demeure ».
- source_word: אֹהֶל מוֹעֵד
  choice: tente de la Rencontre
  rationale: Cette désignation exprime le lieu assigné à la rencontre avec Dieu. La majuscule à « Rencontre » signale qu’il s’agit d’un titre cultuel établi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La formulation familiale masculine de l’hébreu est conservée. Dans ce contexte, elle fonctionne comme une désignation collective du peuple d’Israël.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: tout ce que … avait ordonné
  rationale: La formulation rend l’entière conformité au commandement. Le plus-que-parfait marque naturellement en français l’antériorité de l’ordre par rapport à son exécution.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par le titre « le Seigneur », afin de représenter le tétragramme présent dans le texte hébreu.
- source_word: כֵּן עָשׂוּ
  choice: c’est bien ainsi qu’ils firent
  rationale: La reprise finale est maintenue, car elle souligne avec insistance l’obéissance exacte d’Israël, sans être réduite à une répétition superflue.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le nom divin YHWH. Sa translittération préserve le caractère personnel du nom sans lui substituer un titre.
- issue: Portée collective de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: La traduction retenue expose la forme familiale du texte hébreu, tout en reconnaissant que l’expression désigne collectivement le peuple et non uniquement certains hommes pris individuellement.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conserve l’apposition « le tabernacle, la tente de la Rencontre » ainsi que la répétition finale emphatique de l’hébreu. Le point-virgule aide à faire entendre cette insistance sans alourdir la lecture.
