  text: וַ/יַּעֲשׂ֧וּ עַל הַ/חֹ֛שֶׁן שַׁרְשְׁרֹ֥ת גַּבְלֻ֖ת מַעֲשֵׂ֣ה עֲבֹ֑ת זָהָ֖ב טָהֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/015.yaml
  text: And they made on the breastpiece chains of braided work[a], like cords, of pure gold.
translation:
  language: fr
  text: Ils firent sur le pectoral des chaînettes tressées[a], façonnées comme des cordons, en or pur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « torsadées », « en ouvrage de cordons » ou « travaillées en forme de corde ». L’hébreu décrit des chaînettes exécutées selon une technique tressée, torsadée ou cordée, dont la nature précise est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Ils firent
  rationale: Le verbe courant עשה, dans la suite narrative, se rend naturellement par « firent ».
- source_word: עַל הַחֹשֶׁן
  choice: sur le pectoral
  rationale: עַל exprime ici le placement ou la fixation sur le pectoral sacerdotal; « sur » conserve ce sens spatial.
- source_word: שַׁרְשְׁרֹת
  choice: des chaînettes
  rationale: Le nom désigne des chaînes; le diminutif français convient à ces éléments ouvragés fixés au pectoral.
- source_word: גַּבְלֻת
  choice: torsadées
  rationale: Le terme rare qualifie vraisemblablement la forme travaillée, entrelacée ou cordée des chaînettes; « torsadées » reste clair sans préciser excessivement la technique.
- source_word: מַעֲשֵׂה עֲבֹת
  choice: en forme de cordons
  rationale: L’expression décrit un ouvrage ayant l’aspect de cordons ou de grosses torsades; cette formulation française restitue la comparaison de manière naturelle.
- source_word: זָהָב טָהוֹר
  choice: en or pur
  rationale: Formule française habituelle pour indiquer la matière, conforme à l’expression hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. « Pectoral » est le terme courant dans le contexte des vêtements du grand prêtre. La répétition descriptive de l’hébreu est conservée sans lourdeur grâce à « torsadées, en forme de cordons ».
