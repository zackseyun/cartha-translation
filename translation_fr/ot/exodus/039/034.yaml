  text: the covering of ram skins dyed red[a], the covering of fine leather, and the veil of the screen;
translation:
  language: fr
  text: la couverture de peaux de béliers teintes en rouge, la couverture de peaux de tahash[a] et le voile formant écran ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu תְּחָשִׁים a un référent incertain. Il peut désigner les peaux d’un animal particulier ; on le traduit traditionnellement par « peaux de marsouins » ou « peaux de dugongs », ou on le transcrit « peaux de tahash ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְסֵה
  choice: couverture
  rationale: Ce nom désigne ce qui sert à couvrir. « Couverture » convient à l’inventaire du sanctuaire sans préciser indûment la forme de l’objet.
- source_word: עוֹרֹת הָאֵילִם הַמְאָדָּמִים
  choice: peaux de béliers teintes en rouge
  rationale: La formulation exprime clairement que les peaux de béliers ont été rendues rouges, vraisemblablement par teinture, plutôt que d’être simplement de couleur rouge à l’état naturel.
- source_word: עֹרֹת הַתְּחָשִׁים
  choice: cuir fin[a]
  rationale: Le référent de תְּחָשִׁים est incertain. « Cuir fin » offre une formulation lisible sans identifier arbitrairement une espèce animale; la note signale explicitement l’incertitude.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: le voile formant écran
  rationale: פָּרֹכֶת désigne le voile intérieur, tandis que מָסָךְ évoque ce qui masque ou fait écran. Cette formulation conserve les deux idées sans produire le peu naturel « voile de l’écran ».
