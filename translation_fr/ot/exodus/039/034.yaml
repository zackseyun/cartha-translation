  text: וְ/אֶת מִכְסֵ֞ה עוֹרֹ֤ת הָֽ/אֵילִם֙ הַ/מְאָדָּמִ֔ים וְ/אֶת מִכְסֵ֖ה עֹרֹ֣ת הַ/תְּחָשִׁ֑ים וְ/אֵ֖ת פָּרֹ֥כֶת הַ/מָּסָֽךְ־־׃
