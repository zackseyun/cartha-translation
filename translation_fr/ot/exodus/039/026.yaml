  yaml_path: translation/ot/exodus/039/026.yaml
  text: a bell and a pomegranate[a], a bell and a pomegranate, around the hem of the robe, all around, for ministering, just as Yahweh had commanded Moses.
translation:
  language: fr
  text: une clochette et une grenade, une clochette et une grenade, tout autour de l’ourlet de la robe, pour le service, comme Yahweh l’avait ordonné à Moïse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּעֲמֹן
  choice: clochette
  rationale: Le nom désigne une cloche; « clochette » convient mieux à de petits objets fixés au bord d’un vêtement. L’or, précisé dans le contexte, n’est pas répété dans ce verset.
- source_word: רִמּוֹן
  choice: grenade
  rationale: Le terme signifie littéralement « grenade » et désigne ici un ornement en forme de grenade; le mot concret reste clair en français.
- source_word: עַל שׁוּלֵי הַמְּעִיל סָבִיב
  choice: tout autour de l’ourlet de la robe
  rationale: « Ourlet » exprime naturellement le bord inférieur du vêtement, tandis que « tout autour » rend l’idée d’une disposition qui en fait le tour.
- source_word: לְשָׁרֵת
  choice: pour assurer le service
  rationale: L’infinitif avec לְ exprime ici la finalité. « Assurer le service » évoque naturellement le service cultuel sans ajouter un ministre explicitement absent du texte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: comme Yahweh l’avait ordonné à Moïse
  rationale: Le plus-que-parfait indique naturellement que l’ordre divin précède l’exécution décrite; le pronom « l’ » reprend implicitement ce qui devait être fait.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le verset emploie directement le tétragramme. « Yahweh » préserve le nom propre et évite de le remplacer par un titre.
- issue: Portée cultuelle de לְשָׁרֵת
  choice: pour assurer le service
  alternative: pour servir; pour le service
  rationale: La formulation marque la finalité sacerdotale de la robe tout en laissant implicite, comme l’hébreu, l’identité de celui qui accomplit le service.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition « une clochette et une grenade » est conservée parce qu’elle reproduit l’alternance insistante du texte hébreu. Aucun marqueur de note n’est requis, car aucune note n’est ajoutée.
