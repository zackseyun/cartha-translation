  text: אֵ֣ת מִזְבַּ֣ח הַ/נְּחֹ֗שֶׁת וְ/אֶת מִכְבַּ֤ר הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁר ל֔/וֹ אֶת בַּדָּ֖י/ו וְ/אֶת כָּל כֵּלָ֑י/ו אֶת הַ/כִּיֹּ֖ר וְ/אֶת כַּנּֽ/וֹ׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/039.yaml
  text: the bronze altar[a], and the bronze grating that was for it, its poles, and all its utensils; the basin and its stand[b];
translation:
  language: fr
  text: l’autel de bronze[a], sa grille de bronze, ses barres et tous ses ustensiles ; le bassin et son support[b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’autel de cuivre » ; le terme hébreu peut désigner le cuivre ou le bronze.
    reason: lexical_alternative
  - marker: b
    text: Ou « son socle » ou « sa base ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח
  choice: autel
  rationale: Le nom hébreu signifie « autel ». Dans ce contexte, il s’agit de l’autel des holocaustes, mais le texte emploie ici la désignation simple.
- source_word: הַנְּחֹשֶׁת
  choice: bronze
  rationale: נְחֹשֶׁת peut désigner le cuivre ou le bronze ; « bronze » est le terme traditionnel et naturel pour le mobilier du sanctuaire.
- source_word: מִכְבַּר
  choice: grille
  rationale: Le mot désigne un ouvrage ajouré associé à l’autel. « Grille » est clair en français moderne tout en conservant la nature concrète de l’objet.
- source_word: אֲשֶׁר לוֹ
  choice: sa
  rationale: La tournure hébraïque indique que la grille est associée à l’autel. Le possessif français exprime naturellement ce rapport sans préciser indûment son emplacement.
- source_word: בַּדָּיו
  choice: ses barres
  rationale: Les בַּדִּים sont les longues pièces servant au transport du mobilier sacré. « Barres » est le terme courant dans ce contexte en français biblique moderne.
- source_word: כָּל־כֵּלָיו
  choice: tous ses ustensiles
  rationale: כֵּלִים désigne largement des objets ou instruments ; « ustensiles » convient aux accessoires employés avec l’autel.
- source_word: כִּיֹּר
  choice: bassin
  rationale: « Bassin » désigne clairement en français moderne le récipient destiné aux ablutions, sans recourir au terme traditionnel vieilli « cuve » dans certaines versions.
- source_word: כַּנּוֹ
  choice: son support
  rationale: Le nom désigne ce sur quoi repose le bassin. « Support » rend la fonction sans trancher entre « socle » et « base ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe nominale et le point-virgule maintiennent la continuité de l’inventaire du contexte. Le possessif « sa » allège la relative hébraïque tout en préservant l’association de la grille avec l’autel.
