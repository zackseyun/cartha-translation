  text: וְ/אֵ֨ת שְׁתֵּ֤י קְצוֹת֙ שְׁתֵּ֣י הָֽ/עֲבֹתֹ֔ת נָתְנ֖וּ עַל שְׁתֵּ֣י הַֽ/מִּשְׁבְּצֹ֑ת וַֽ/יִּתְּנֻ֛/ם עַל כִּתְפֹ֥ת הָ/אֵפֹ֖ד אֶל מ֥וּל פָּנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/018.yaml
  text: And they put the two ends of the two braided chains on the two settings[a], and put them on the shoulder pieces of the ephod[b], at its front.
translation:
  language: fr
  text: Ils placèrent les deux extrémités des deux chaînes torsadées sur les deux montures, puis les placèrent sur les épaulières de l’éphod, à l’avant de celui-ci.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְצוֹת
  choice: extrémités
  rationale: Le nom désigne les bouts ou points terminaux des chaînes. « Extrémités » est précis et naturel dans la description d’un ouvrage artisanal.
- source_word: הָעֲבֹתֹת
  choice: chaînes torsadées
  rationale: Dans ce contexte d’orfèvrerie cultuelle, le terme désigne des chaînes travaillées par torsion ou entrelacement, et non de simples cordons.
- source_word: מִּשְׁבְּצֹת
  choice: montures
  rationale: Le terme désigne des pièces d’orfèvrerie servant de supports ou de fixations. « Montures » rend le sens sans imposer un détail technique incertain.
- source_word: וַיִּתְּנֻם
  choice: puis les placèrent
  rationale: Le verbe נתן signifie ici mettre ou placer. « Fixèrent » préciserait davantage que ne le fait explicitement l’hébreu.
- source_word: כִּתְפֹת
  choice: épaulières
  rationale: Dans la confection de l’éphod, il s’agit des parties du vêtement reposant sur les épaules, non des épaules anatomiques elles-mêmes.
- source_word: אֶל מוּל פָּנָיו
  choice: sur le devant
  rationale: L’expression spatiale situe les éléments sur la face antérieure de l’éphod. Cette formulation française est claire tout en évitant de surinterpréter la relation exacte.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La répétition du verbe « placèrent » conserve la structure de l’hébreu et évite de transformer implicitement la seconde action en fixation.
