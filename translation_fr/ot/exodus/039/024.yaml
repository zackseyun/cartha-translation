  text: Ils firent, au bas de la robe, des grenades en fils retors bleus, pourpres et écarlates[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des ornements en forme de grenade ». L’hébreu dit simplement « des grenades », nommant les ornements d’après leur forme.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu énumère les matières bleue, pourpre et écarlate, et précise qu’elles sont travaillées par torsion. Le mot « fils » est ajouté en français pour plus de clarté.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Ils firent
  rationale: Le wayyiqtol qal à la 3e personne du pluriel poursuit naturellement le récit; « firent » est direct et digne.
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: sur le bas de la robe
  rationale: שׁוּלֵי désigne les bords inférieurs du vêtement. « Le bas de la robe » est plus naturel en français moderne que « les pans » ou « l’ourlet » ici.
- source_word: רִמּוֹנֵי
  choice: des grenades
  rationale: L’hébreu nomme simplement des « grenades », bien qu’il s’agisse d’ornements textiles ayant cette forme; cette simplicité est conservée dans le texte.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: en fils bleu, pourpre et écarlate
  rationale: Les termes désignent des matières textiles teintes. « Fils » est explicité une seule fois pour rendre la série claire en français, tandis que les trois couleurs traditionnelles sont conservées.
- source_word: מָשְׁזָר
  choice: retors
  rationale: Le terme décrit des fils travaillés par torsion. « Retors » est le terme textile français précis et permet de maintenir la concision de l’hébreu.
