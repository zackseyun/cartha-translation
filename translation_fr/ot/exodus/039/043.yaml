revisions:
- from: 'Moïse vit tout le travail : voici, ils l’avaient accompli exactement comme Yahweh l’avait ordonné. C’est ainsi qu’ils l’avaient accompli. Alors Moïse les bénit.'
  to: 'Moïse vit tout le travail, et voici qu’ils l’avaient accompli : comme Yahweh l’avait ordonné, ainsi l’avaient-ils accompli. Puis Moïse les bénit.'
  rationale: La révision conserve le plus-que-parfait approprié au travail déjà achevé lorsque Moïse le voit, ainsi que la répétition de « accompli ». Elle restitue explicitement et naturellement en français la structure corrélative « comme… ainsi… », tout en évitant l’intensification non indispensable de « exactement ». « Puis » marque sobrement la progression du récit sans ajouter de contenu.
