base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/043.yaml
  text: And Moses saw all the work, and behold, they had done it; just as Yahweh had commanded, so they had done it. And Moses blessed them.
translation:
  language: fr
  text: 'Moïse vit tout le travail, et voici qu’ils l’avaient accompli : comme Yahweh l’avait ordonné, ainsi l’avaient-ils accompli. Puis Moïse les bénit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: vit
  rationale: Le sens fondamental de ראה est « voir ». Dans le contexte, Moïse constate le travail achevé; « vit » préserve cette simplicité sans expliciter davantage l’idée d’inspection.
- source_word: כָּל הַמְּלָאכָה
  choice: tout le travail
  rationale: מְלָאכָה désigne ici l’ensemble du travail réalisé pour le sanctuaire. « Tout le travail » est naturel, large et fidèle au contexte.
- source_word: וְהִנֵּה
  choice: voici
  rationale: הִנֵּה attire l’attention sur le constat qui suit. « Voici » en conserve la fonction discursive dans un registre narratif digne.
- source_word: עָשׂוּ אֹתָהּ
  choice: ils l’avaient accompli
  rationale: עשה peut signifier faire ou réaliser. Avec « le travail » comme antécédent, « accomplir » est idiomatique et inclut à la fois fabrication et exécution; le plus-que-parfait marque l’antériorité par rapport au constat de Moïse.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: exactement comme Yahweh l’avait ordonné
  rationale: כַּאֲשֶׁר exprime la conformité au commandement. « Exactement comme » rend cette correspondance, tandis que « avait ordonné » convient à la séquence narrative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, ce qui conserve dans le texte français le nom personnel présent en hébreu.
- source_word: כֵּן עָשׂוּ
  choice: C’est ainsi qu’ils l’avaient accompli
  rationale: Cette formulation maintient la répétition intentionnelle de עשה et souligne l’exacte obéissance sans fusionner les deux propositions.
- source_word: וַיְבָרֶךְ אֹתָם מֹשֶׁה
  choice: Alors Moïse les bénit
  rationale: ברך au piel signifie « bénir ». « Alors » marque naturellement la progression narrative, et le sujet final hébreu est placé selon l’ordre idiomatique français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu porte directement le Tétragramme. « Yahweh » préserve le nom divin plutôt que de lui substituer un titre, sans ajouter d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de l’accomplissement est conservée parce qu’elle souligne la conformité exacte au commandement. « Voici » maintient le relief narratif de הִנֵּה sans recourir à une tournure archaïque comme « et voici que ».
