  text: אֶת הַ/מְּנֹרָ֨ה הַ/טְּהֹרָ֜ה אֶת נֵרֹתֶ֗י/הָ נֵרֹ֛ת הַ/מַּֽעֲרָכָ֖ה וְ/אֶת כָּל כֵּלֶ֑י/הָ וְ/אֵ֖ת שֶׁ֥מֶן הַ/מָּאֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/037.yaml
  text: the pure lampstand[a], its lamps—the lamps set in order—and all its utensils, and the oil for the light,
translation:
  language: fr
  text: le chandelier pur, ses lampes — les lampes disposées en ordre[a] —, tous ses ustensiles et l’huile destinée à l’éclairage,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les lampes de la disposition ». L’expression hébraïque peut désigner les lampes selon leur agencement prescrit, ou les lampes destinées à être ainsi disposées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּנֹרָה
  choice: le chandelier
  rationale: מְנוֹרָה désigne ici le support cultuel portant plusieurs lampes. « Chandelier » est le terme français courant dans ce contexte et évite la translittération inutile.
- source_word: הַטְּהֹרָה
  choice: pur
  rationale: טָהוֹר qualifie le chandelier dans le contexte de la pureté rituelle et matérielle du sanctuaire. « Pur » conserve cette portée sans ajouter explicitement « en or », absent de ce verset.
- source_word: נֵרֹתֶיהָ
  choice: ses lampes
  rationale: נֵר désigne ici chacune des lampes appartenant au chandelier, plutôt qu’une simple flamme.
- source_word: נֵרֹת הַמַּעֲרָכָה
  choice: les lampes disposées en ordre
  rationale: מַעֲרָכָה évoque une disposition ordonnée. La formulation française reste naturelle dans cette liste d’objets tout en conservant l’idée d’un agencement déterminé.
- source_word: כָּל כֵּלֶיהָ
  choice: tous ses ustensiles
  rationale: כְּלִי est un terme large couvrant les objets et instruments associés au chandelier. « Ustensiles » convient au registre d’un inventaire cultuel sans préciser indûment leur forme.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: l’huile destinée à l’éclairage
  rationale: Le groupe construit désigne l’huile employée pour produire la lumière. Cette formulation rend clairement la fonction indiquée par l’hébreu.
