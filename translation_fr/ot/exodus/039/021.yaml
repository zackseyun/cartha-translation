  text: וַ/יִּרְכְּס֣וּ אֶת הַ/חֹ֡שֶׁן מִ/טַּבְּעֹתָי/ו֩ אֶל טַבְּעֹ֨ת הָ/אֵפֹ֜ד בִּ/פְתִ֣יל תְּכֵ֗לֶת לִֽ/הְיֹת֙ עַל חֵ֣שֶׁב הָ/אֵפֹ֔ד וְ/לֹֽא יִזַּ֣ח הַ/חֹ֔שֶׁן מֵ/עַ֖ל הָ/אֵפֹ֑ד כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/021.yaml
  text: They fastened the breastpiece by its rings to the rings of the ephod with a cord of blue[a], so that it would be on the skillfully woven band of the ephod, and so that the breastpiece would not come loose from on the ephod[b], just as Yahweh had commanded Moses.
translation:
  language: fr
  text: Ils attachèrent le pectoral, par ses anneaux, aux anneaux de l’éphod avec un cordon bleu[a], afin qu’il reste sur la bande ouvragée[b] de l’éphod et ne se détache pas de l’éphod, comme Yahweh l’avait ordonné à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec un cordon bleu-violet »; le terme hébreu désigne une teinture dont la nuance exacte est discutée.
    reason: lexical_alternative
  - marker: b
    text: Ou « la ceinture tissée »; le terme hébreu désigne la bande décorée attachée à l’éphod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְכְּסוּ
  choice: Ils attachèrent
  rationale: Le verbe désigne ici l’action de fixer solidement ensemble les éléments du vêtement. « Attachèrent » est naturel et suffisamment précis en français.
- source_word: הַחֹשֶׁן
  choice: le pectoral
  rationale: Dans le contexte des vêtements sacerdotaux, « pectoral » désigne naturellement en français la pièce ornée portée sur la poitrine, sans suggérer une pièce d’armure.
- source_word: מִטַּבְּעֹתָיו ... אֶל טַבְּעֹת הָאֵפֹד
  choice: par ses anneaux, aux anneaux de l’éphod
  rationale: Cette formulation rend à la fois le moyen de fixation indiqué par מִן et la direction vers les anneaux de l’éphod indiquée par אֶל.
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: avec un cordon bleu
  rationale: פְתִיל désigne un fil ou cordon servant ici d’attache; « cordon » convient mieux à cette fonction. תְּכֵלֶת renvoie à une teinture bleue, traditionnellement aussi décrite comme bleu-violet.
- source_word: לִהְיוֹת עַל חֵשֶׁב הָאֵפֹד
  choice: afin qu’il reste sur la bande ouvragée de l’éphod
  rationale: חֵשֶׁב désigne la bande tissée et travaillée faisant corps avec l’éphod. « Reste » explicite naturellement le résultat recherché par la fixation sans modifier le sens.
- source_word: וְלֹא יִזַּח ... מֵעַל הָאֵפֹד
  choice: et ne se détache pas de l’éphod
  rationale: Le nifal exprime ici l’idée de se déplacer ou de se séparer de sa position. « Ne se détache pas » convient au contexte matériel et rend idiomatiquement מֵעַל sans la lourdeur de « de dessus ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La forme rend le nom divin personnel représenté par le tétragramme, plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme; « Yahweh » en préserve la fonction de nom personnel.
- issue: Rapport du pectoral à l’éphod
  choice: ne se détache pas de l’éphod
  alternative: ne glisse pas de dessus l’éphod
  rationale: Le texte décrit le maintien matériel du pectoral. Le choix conserve l’idée de séparation ou de déplacement sans préciser davantage le mouvement que ne le fait l’hébreu.
translation_notes:
  register: Français international moderne, digne et fluide. Les termes cultuels établis « pectoral » et « éphod » sont conservés; la syntaxe reste accessible tout en suivant précisément l’enchaînement de l’hébreu.
