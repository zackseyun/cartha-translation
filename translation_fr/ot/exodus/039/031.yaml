    rationale: Dans le contexte hébreu et dans la construction du verset, le but est de placer sur le turban la plaque/ornement auquel le cordon a été attaché. Le français actuel peut donc faire comprendre que le cordon lui-même est placé sur le turban.
  - severity: low
    issue: « Cordon de pourpre bleue » est une formulation peu idiomatique en français moderne.
    rationale: « Bleu violacé » rend plus naturellement l’alternative chromatique souvent proposée pour תְּכֵלֶת, sans prétendre résoudre la question lexicale.
