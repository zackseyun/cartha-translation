  text: וַ/יִּתְּנ֤וּ עָלָי/ו֙ פְּתִ֣יל תְּכֵ֔לֶת לָ/תֵ֥ת עַל הַ/מִּצְנֶ֖פֶת מִ/לְ/מָ֑עְלָ/ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/031.yaml
  text: And they attached to it a cord of blue yarn[a], to put it above on the turban, just as Yahweh had commanded Moses.
translation:
  language: fr
  text: Ils y attachèrent un cordon bleu[a], afin de placer la plaque sur le turban, au-dessus, exactement comme Yahweh l’avait ordonné à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un cordon bleu violacé » ou « un cordon violet » ; le mot hébreu תְּכֵלֶת désigne la matière teinte d’un bleu caractéristique employée dans le sanctuaire.
    reason: 'Variante lexicale : la nuance exacte et la manière d’exprimer la matière teinte restent discutées.'
lexical_decisions:
- source_word: וַיִּתְּנוּ עָלָיו
  choice: Ils y attachèrent
  rationale: Le verbe נָתַן signifie fondamentalement « mettre », mais avec עַל et dans ce contexte de confection, il décrit la fixation du cordon à l’objet mentionné au verset précédent. « Y attachèrent » est naturel et garde le pronom anaphorique.
- source_word: פְּתִיל
  choice: cordon
  rationale: Le terme désigne un fil retors ou un cordon; « cordon » convient à sa fonction de fixation.
- source_word: תְּכֵלֶת
  choice: bleu
  rationale: Le mot désigne la matière teinte d’un bleu caractéristique employée pour le sanctuaire. En français, « cordon bleu » exprime naturellement la couleur sans imposer une nuance trop précise.
- source_word: לָתֵת
  choice: pour le placer
  rationale: L’infinitif exprime ici le but. Le pronom objet, implicite en hébreu mais requis par le français, renvoie à l’ornement sacerdotal du verset précédent.
- source_word: הַמִּצְנֶפֶת
  choice: le turban
  rationale: Le terme désigne la coiffure particulière du grand prêtre; « turban » est la traduction française courante et précise.
- source_word: מִלְמָעְלָה
  choice: sur le dessus
  rationale: Cette expression situe l’objet dans la partie supérieure du turban. « Sur le dessus » rend clairement la position sans ajouter l’idée non explicite de « devant ».
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: exactement comme Yahweh l’avait ordonné à Moïse
  rationale: La formule souligne la conformité de l’exécution au commandement divin. Le plus-que-parfait est naturel dans le récit français, et « exactement comme » restitue la force comparative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre et évite de le remplacer par un titre.
- issue: Référent de l’objet implicite après לָתֵת
  choice: le pronom « le », renvoyant à l’ornement du verset précédent
  alternative: répéter « la plaque » ou laisser la construction sans objet explicite
  rationale: L’hébreu dépend du contexte précédent. Le français exige ici un complément, mais le pronom évite d’introduire dans le verset un nom absent de l’original.
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple convient au registre narratif biblique; « exactement comme » conserve l’insistance de la formule d’accomplissement. Le pronom « y » maintient le lien avec le verset précédent.
