  to: Ils y attachèrent un cordon bleu[a], afin de placer la plaque sur le turban, au-dessus, exactement comme Yahweh l’avait ordonné à Moïse.
  rationale: La répétition de « la plaque » rend explicite, sans ajout interprétatif substantiel, le référent contextuellement implicite de l’infinitif de but. « Au-dessus » conserve la valeur spatiale de מִלְמָעְלָה sans introduire l’idée de « devant ». La note est légèrement reformulée pour un français plus naturel et pour préserver l’incertitude concernant la nuance de תְּכֵלֶת.
