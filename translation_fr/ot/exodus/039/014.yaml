  text: וְ֠/הָ/אֲבָנִים עַל שְׁמֹ֨ת בְּנֵי יִשְׂרָאֵ֥ל הֵ֛נָּה שְׁתֵּ֥ים עֶשְׂרֵ֖ה עַל שְׁמֹתָ֑/ם פִּתּוּחֵ֤י חֹתָם֙ אִ֣ישׁ עַל שְׁמ֔/וֹ לִ/שְׁנֵ֥ים עָשָׂ֖ר שָֽׁבֶט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/014.yaml
  text: And the stones corresponded to the names of the sons of Israel[a], twelve according to their names, engraved like a signet, each according to its name[c][b], for the twelve tribes.
translation:
  language: fr
  text: 'Les pierres correspondaient aux noms des fils d’Israël[a] : elles étaient douze, selon leurs noms, gravées comme on grave un sceau[b], chacune selon son nom, pour les douze tribus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « portaient les noms des fils d’Israël ». La préposition hébraïque peut exprimer ici l’association étroite ou la correspondance.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « gravures de sceau » ou « gravures de signet ». L’expression désigne une gravure exécutée comme celle d’un sceau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: Les pierres
  rationale: Le nom hébreu désigne simplement des pierres; le contexte précise qu’il s’agit des pierres du pectoral, sans imposer ici l’ajout « précieuses ».
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: correspondaient aux noms des fils d’Israël
  rationale: עַל exprime ici une relation étroite ou une correspondance. Cette formulation est naturelle en français et conserve le lien structurel entre les pierres et les noms.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Rendu formel du syntagme hébreu et désignation traditionnelle des descendants d’Israël; « Israélites » serait plus fluide mais moins proche de l’expression source.
- source_word: הֵנָּה שְׁתֵּים עֶשְׂרֵה
  choice: elles étaient douze
  rationale: Le pronom et le nombre forment une prédication explicite qui souligne le total des pierres.
- source_word: עַל שְׁמֹתָם
  choice: selon leurs noms
  rationale: Conserve la répétition de la relation exprimée par עַל et le parallélisme du texte hébreu.
- source_word: פִּתּוּחֵי חֹתָם
  choice: gravées à la manière d’un sceau
  rationale: L’expression évoque la technique ou le style des inscriptions incisées sur un sceau; cette tournure conserve l’image sans suggérer que les pierres étaient elles-mêmes des sceaux.
- source_word: אִישׁ עַל שְׁמוֹ
  choice: chacune avec son nom
  rationale: אִישׁ a une valeur distributive, « chacune ». La formulation française rattache naturellement chaque pierre au nom qui lui correspond sans imposer un référent masculin au possessif.
- source_word: לִשְׁנֵים עָשָׂר שָׁבֶט
  choice: pour les douze tribus
  rationale: 'La préposition ל marque ici la relation ou la représentation: les douze pierres sont associées aux douze tribus.'
