  text: וְ/אֵת֙ מִזְבַּ֣ח הַ/זָּהָ֔ב וְ/אֵת֙ שֶׁ֣מֶן הַ/מִּשְׁחָ֔ה וְ/אֵ֖ת קְטֹ֣רֶת הַ/סַּמִּ֑ים וְ/אֵ֕ת מָסַ֖ךְ פֶּ֥תַח הָ/אֹֽהֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/038.yaml
  text: the gold altar[a], the anointing oil, the fragrant incense, and the screen for the entrance of the tent[c][b];
translation:
  language: fr
  text: l’autel d’or[a], l’huile d’onction, l’encens aromatique[b] et le rideau[c] pour l’entrée de la tente ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’autel en or ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « l’encens des aromates ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « la tenture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: l’autel d’or
  rationale: Le nom זָהָב (« or ») qualifie ici l’autel. « L’autel d’or » reproduit naturellement cette construction en français et désigne sa matière sans ajouter d’interprétation.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: l’huile d’onction
  rationale: Cette expression construite désigne l’huile employée pour l’onction. « Huile d’onction » est une formulation française claire, concise et consacrée par l’usage biblique.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: l’encens aromatique
  rationale: קְטֹרֶת signifie « encens », tandis que סַמִּים désigne des substances ou aromates odoriférants. « Encens aromatique » exprime naturellement leur fonction olfactive sans préciser une composition que le texte ne détaille pas ici.
- source_word: מָסַךְ
  choice: le rideau
  rationale: Dans le contexte du sanctuaire, מָסַךְ désigne une pièce textile fermant ou masquant une entrée. « Rideau » est courant et compréhensible, tout en permettant de le distinguer du voile intérieur appelé פָּרֹכֶת.
- source_word: פֶּתַח הָאֹהֶל
  choice: pour l’entrée de la tente
  rationale: פֶּתַח désigne l’ouverture ou l’entrée, et אֹהֶל la tente. La préposition « pour » rend la fonction du rideau, implicite dans la relation nominale hébraïque.
- source_word: וְאֵת ... וְאֵת ... וְאֵת ... וְאֵת
  choice: énumération séparée par des virgules, avec « et » avant le dernier élément
  rationale: La répétition de la conjonction et du marqueur d’objet structure une liste. Une énumération française fluide conserve les quatre éléments sans répéter lourdement « et ».
