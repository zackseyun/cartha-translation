  text: They made two gold settings and two gold rings[a], and they put the two rings on the two ends of the breastpiece.
translation:
  language: fr
  text: Ils firent deux montures[a] en or et deux anneaux en or, puis ils placèrent les deux anneaux aux deux extrémités du pectoral.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « encadrements » ou « montures filigranées »; le terme hébreu désigne un travail d’orfèvrerie dont la forme exacte est incertaine.
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Ils firent
  rationale: Le qatal narratif avec waw fait progresser la suite des actions. Le passé simple convient au registre narratif biblique soutenu sans alourdir la phrase d’un « et » initial.
- source_word: מִשְׁבְּצֹת
  choice: montures
  rationale: Le terme désigne des pièces d’orfèvrerie servant de supports ou d’encadrements. « Montures » reste concret et n’impose pas une technique particulière comme le filigrane.
- source_word: זָהָב
  choice: en or
  rationale: La matière est explicitement répétée pour chacun des deux types d’objets, conformément à l’hébreu.
- source_word: טַבְּעֹת
  choice: anneaux
  rationale: Terme usuel pour les anneaux servant de points d’attache dans la confection du sanctuaire et des vêtements sacerdotaux.
- source_word: וַיִּתְּנוּ
  choice: puis ils placèrent
  rationale: Dans ce contexte, נתן signifie mettre ou placer. « Puis » exprime naturellement la succession portée par le waw narratif.
- source_word: עַל שְׁנֵי קְצוֹת
  choice: aux deux extrémités
  rationale: La préposition עַל peut ici indiquer l’emplacement, tandis que קְצוֹת désigne les extrémités de l’objet. Cette formulation est idiomatique en français.
- source_word: הַחֹשֶׁן
  choice: le pectoral
  rationale: Dans le contexte des vêtements du grand prêtre, « pectoral » est le terme français établi, précis et compréhensible.
