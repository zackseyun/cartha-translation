  text: 'And they mounted on it four rows of stones: the first row was a ruby[a], a topaz, and an emerald.'
translation:
  language: fr
  text: Ils y enchâssèrent quatre rangées de pierres. La première rangée comprenait une sardoine[a], une topaze et une émeraude.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification précise de ces pierres reste incertaine. Les traductions « sardoine », « topaze » et « émeraude » suivent des équivalents traditionnels ; il pourrait s’agir, respectivement, d’une cornaline ou d’une autre pierre rouge, de chrysolithe, et d’une autre pierre verte ou étincelante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלְאוּ ב֔וֹ
  choice: Ils y sertirent
  rationale: Le verbe signifie littéralement « remplir », mais, dans ce contexte d’orfèvrerie, il décrit la pose de pierres dans le pectoral. « Sertir » exprime naturellement cette opération en français.
- source_word: אַרְבָּעָה טוּרֵי אָבֶן
  choice: quatre rangées de pierres
  rationale: טוּרֵי désigne des rangées et אָבֶן a ici un sens collectif. Cette formulation est claire et naturelle.
- source_word: טוּר ... הַטּוּר הָאֶחָד
  choice: Sur la première rangée
  rationale: Dans l’énumération des quatre rangées, הָאֶחָד désigne la première. La formulation française introduit naturellement les trois pierres qui la composent.
- source_word: אֹדֶם
  choice: sardoine
  rationale: Le terme désigne vraisemblablement une pierre rouge sans que son identification soit certaine. « Sardoine » est un rendu traditionnel français plausible; l’incertitude est signalée en note.
- source_word: פִּטְדָה
  choice: topaze
  rationale: « Topaze » est le rendu traditionnel courant, bien que l’identification minéralogique exacte demeure incertaine.
- source_word: בָרֶקֶת
  choice: émeraude
  rationale: « Émeraude » est le rendu traditionnel courant. Le mot hébreu pourrait toutefois désigner une autre pierre brillante ou étincelante.
