  text: וַ/יַּעֲשׂ֥וּ פַעֲמֹנֵ֖י זָהָ֣ב טָה֑וֹר וַ/יִּתְּנ֨וּ אֶת הַ/פַּֽעֲמֹנִ֜ים בְּ/ת֣וֹךְ הָ/רִמֹּנִ֗ים עַל שׁוּלֵ֤י הַ/מְּעִיל֙ סָבִ֔יב בְּ/ת֖וֹךְ הָ/רִמֹּנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/025.yaml
  text: They made bells of pure gold[a], and they put the bells among the pomegranates on the hem of the robe, all around, among the pomegranates.
translation:
  language: fr
  text: Ils firent des clochettes en or pur et les placèrent parmi les grenades[a], sur le bord inférieur de la robe, tout autour, parmi les grenades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entre les grenades ». L’expression hébraïque signifie littéralement « au milieu des grenades » et décrit la position des clochettes par rapport aux ornements en forme de grenade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Ils firent
  rationale: Le wayyiqtol de עשה poursuit simplement la séquence des travaux; « Ils firent » est naturel et fidèle au récit.
- source_word: פַעֲמֹנֵי
  choice: des clochettes
  rationale: פעמון désigne une cloche; dans le contexte d’ornements fixés au bas d’un vêtement, « clochettes » exprime naturellement l’objet sans ajouter d’idée étrangère.
- source_word: זָהָב טָהוֹר
  choice: en or pur
  rationale: Cette formulation française indique clairement la matière et sa qualité.
- source_word: וַיִּתְּנוּ
  choice: et les placèrent
  rationale: נתן a ici le sens de mettre ou disposer à un endroit précis; « placèrent » convient au travail décrit.
- source_word: בְּתוֹךְ הָרִמֹּנִים
  choice: parmi les grenades
  rationale: L’expression signifie littéralement « au milieu des grenades ». « Parmi » rend naturellement leur disposition relative tout en laissant ouverte la configuration exacte.
- source_word: הָרִמֹּנִים
  choice: les grenades
  rationale: Le texte nomme simplement les grenades. Le contexte montre qu’il s’agit d’ornements en forme de grenade, sans qu’il soit nécessaire d’expliciter cela dans le corps du verset.
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: sur le bord inférieur de la robe
  rationale: שׁוּלִים désigne le bas ou le bord inférieur du vêtement; cette expression est plus précise ici que « ourlet », qui pourrait suggérer seulement une couture repliée.
- source_word: סָבִיב
  choice: tout autour
  rationale: Le terme indique que la disposition faisait le tour complet du bord inférieur.
- source_word: בְּתוֹךְ הָרִמֹּנִים (répété)
  choice: parmi les grenades
  rationale: La répétition de l’expression hébraïque est conservée afin de respecter l’insistance et la structure du texte source.
