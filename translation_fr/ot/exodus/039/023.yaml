  terminology: « Robe », « ouverture » et « bordure » conviennent. « Cuirasse » est une interprétation possible de תַּחְרָא, terme rare; la note doit conserver l'incertitude et indiquer plus directement l'alternative « cotte de mailles »/armure protectrice.
