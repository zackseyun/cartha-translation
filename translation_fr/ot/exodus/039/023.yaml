  text: And the opening of the robe was in the middle of it[a], like the opening of a coat of mail, with a binding around its opening, so that it would not be torn.
translation:
  language: fr
  text: L’ouverture de la robe était en son milieu, comme l’ouverture d’une cuirasse[a]. Une bordure entourait son ouverture, afin que celle-ci ne se déchire pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme l’ouverture d’une armure » ou « d’une cotte de mailles ». Le terme hébreu תַּחְרָא est rare et désigne probablement un vêtement protecteur ou une pièce d’armure.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי
  choice: ouverture
  rationale: Dans le contexte d’un vêtement, פֶּה désigne idiomatiquement une ouverture, ici celle par laquelle passe la tête.
- source_word: הַמְּעִיל
  choice: la robe
  rationale: מְעִיל désigne un vêtement de dessus; « robe » est clair, naturel et conforme au contexte sacerdotal.
- source_word: בְּתוֹכוֹ
  choice: en son milieu
  rationale: La formule situe l’ouverture au centre du vêtement, sans préciser davantage sa forme.
- source_word: כְּפִי תַחְרָא
  choice: comme l’ouverture d’une cuirasse
  rationale: תַּחְרָא est un terme rare désignant vraisemblablement un vêtement protecteur ou une pièce d’armure; « cuirasse » rend la comparaison de manière concise tout en laissant l’incertitude lexicale en note.
- source_word: שָׂפָה
  choice: une bordure
  rationale: Littéralement « lèvre, bord », le mot désigne ici la finition renforcée qui entoure l’ouverture.
- source_word: לְפִיו סָבִיב
  choice: entourait l’ouverture
  rationale: Cette formulation naturelle exprime que la bordure faisait tout le tour de l’ouverture.
- source_word: לֹא יִקָּרֵעַ
  choice: afin qu’elle ne se déchire pas
  rationale: L’imparfait nifal exprime ici la finalité de la bordure; le féminin renvoie naturellement à la robe, sans exclure fonctionnellement l’idée que l’ouverture ne devait pas se déchirer.
