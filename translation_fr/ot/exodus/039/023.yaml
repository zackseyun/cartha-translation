  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : ouverture centrale du manteau, comparaison avec un vêtement ou équipement protecteur, puis bordure circulaire destinée à empêcher une déchirure. Toutefois, le pronom final français « elle » renvoie grammaticalement à « la bordure », alors que l''hébreu masculin vise le plus naturellement l''ouverture (ou, par extension, le vêtement à cet endroit).'
