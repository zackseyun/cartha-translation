source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֗וּ שְׁתֵּי֙ טַבְּעֹ֣ת זָהָ֔ב וַ/יָּשִׂ֕ימוּ עַל שְׁנֵ֖י קְצ֣וֹת הַ/חֹ֑שֶׁן עַל שְׂפָת֕/וֹ אֲשֶׁ֛ר אֶל עֵ֥בֶר הָ/אֵפֹ֖ד בָּֽיְתָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/019.yaml
  text: They made two gold rings and put them on the two ends of the breastpiece[b][a], on its edge that was on the inner side toward the ephod.
translation:
  language: fr
  text: Ils firent deux anneaux d’or et les placèrent aux deux extrémités du pectoral, sur son bord intérieur, du côté de l’éphod.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur son bord qui faisait face à l’éphod, vers l’intérieur »; l’expression hébraïque décrit l’orientation de ce bord, mais sa relation spatiale exacte avec l’éphod peut se comprendre de plusieurs façons.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: anneaux d’or
  rationale: טַבַּעַת désigne ici un anneau servant à la fixation; « anneaux d’or » est naturel et conserve l’indication du matériau.
- source_word: הַחֹשֶׁן
  choice: le pectoral
  rationale: Dans le contexte des vêtements sacerdotaux, חֹשֶׁן désigne la pièce ouvragée portée sur la poitrine; « pectoral » est le terme français courant dans ce contexte et n’évoque pas indûment une armure.
- source_word: שְׂפָתוֹ
  choice: son bord
  rationale: שָׂפָה signifie littéralement « lèvre », puis « bord »; pour une pièce textile ouvragée, « bord » est clair et idiomatique.
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד
  choice: du côté de l’éphod
  rationale: La formulation indique l’orientation ou la face du pectoral en rapport avec l’éphod, sans imposer plus de précision spatiale que l’hébreu.
- source_word: בָּיְתָה
  choice: intérieur
  rationale: Cette forme directionnelle de בַּיִת signifie « vers l’intérieur »; associée à « bord », elle est rendue naturellement par « bord intérieur ».
- source_word: וַיָּשִׂימוּ עַל
  choice: et les placèrent à
  rationale: שׂוּם avec עַל exprime ici la mise en place des anneaux sur les extrémités; « placèrent » convient au registre descriptif et artisanal.
- source_word: שְׁנֵי קְצוֹת
  choice: les deux extrémités
  rationale: קָצֶה désigne une extrémité ou un bout; « extrémités » évite de préciser sans preuve qu’il s’agit de coins.
