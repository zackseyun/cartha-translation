  text: 'and the second row: turquoise[a], sapphire, and diamond.'
translation:
  language: fr
  text: 'et la deuxième rangée : une turquoise[a], un saphir et un diamant.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification exacte de plusieurs pierres précieuses de l’Antiquité est incertaine. נֹפֶךְ peut aussi désigner une « émeraude » ou une « escarboucle », et יָהֲלֹם une « hyacinthe » ou un « jaspe ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/טּוּר
  choice: et la … rangée
  rationale: Dans le contexte des pierres du pectoral, טוּר désigne une rangée de pierres. « Rangée » est naturel en français, et la conjonction וְ est rendue par « et ».
- source_word: הַ/שֵּׁנִי
  choice: deuxième
  rationale: L’adjectif ordinal signifie « deuxième » et s’accorde avec « rangée ».
- source_word: נֹפֶךְ
  choice: turquoise
  rationale: L’identification exacte de cette pierre ancienne est incertaine. « Turquoise » constitue un équivalent moderne plausible; les autres identifications principales sont signalées en note.
- source_word: סַפִּיר
  choice: saphir
  rationale: « Saphir » est l’équivalent français traditionnel et le plus généralement reconnu, même si l’identification minéralogique antique ne correspond pas nécessairement avec exactitude à la pierre moderne.
- source_word: וְ/יָהֲלֹם
  choice: et diamant
  rationale: « Diamant » est une traduction traditionnelle courante, mais l’identification demeure incertaine; les principales possibilités concurrentes sont conservées en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La structure brève d’une liste est conservée. Le marqueur [a] est placé après « turquoise », tout en précisant dans la note l’incertitude qui concerne aussi « diamant ».
