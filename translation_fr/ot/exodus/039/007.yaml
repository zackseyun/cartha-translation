  text: וַ/יָּ֣שֶׂם אֹתָ֗/ם עַ֚ל כִּתְפֹ֣ת הָ/אֵפֹ֔ד אַבְנֵ֥י זִכָּר֖וֹן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/007.yaml
  text: And he set them on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], just as Yahweh had commanded Moses.
translation:
  language: fr
  text: Il les plaça sur les épaulières de l’éphod comme pierres commémoratives pour les fils d’Israël[a], comme Yahweh l’avait ordonné à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « les fils d’Israël », expression courante qui désigne le peuple d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֹתָם
  choice: Il les plaça
  rationale: Le verbe שׂוּם signifie « mettre, placer ». « Il les plaça » exprime naturellement l’action concrète et le pronom renvoie aux deux pierres mentionnées au verset précédent.
- source_word: עַל כִּתְפֹת הָאֵפֹד
  choice: sur les épaulières de l’éphod
  rationale: כָּתֵף signifie littéralement « épaule », mais désigne ici les parties de l’éphod posées sur les épaules. « Épaulières » est précis et idiomatique dans la description d’un vêtement.
- source_word: אַבְנֵי זִכָּרוֹן
  choice: comme pierres commémoratives
  rationale: Le syntagme construit signifie « pierres de souvenir/mémorial ». « Pierres commémoratives » rend clairement leur fonction tout en restant proche de l’hébreu.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: pour les fils d’Israël
  rationale: La formulation conserve l’expression hébraïque masculine בְּנֵי יִשְׂרָאֵל, tandis qu’une note précise qu’elle désigne collectivement le peuple d’Israël.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: exactement comme Yahweh l’avait ordonné à Moïse
  rationale: כַּאֲשֶׁר marque la conformité à l’ordre reçu. Le plus-que-parfait convient à la succession narrative, et le nom divin est translittéré « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites ; les enfants d’Israël
  rationale: Le choix maintient la forme masculine de l’expression hébraïque fixe sans restreindre son référent, que la note explicite comme collectif.
translation_notes:
  register: Français international moderne, digne et accessible. « Éphod » est conservé comme terme technique biblique ; « épaulières » clarifie la construction du vêtement sans paraphrase excessive.
