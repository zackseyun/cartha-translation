source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֛וּ אֶת צִ֥יץ נֵֽזֶר הַ/קֹּ֖דֶשׁ זָהָ֣ב טָה֑וֹר וַ/יִּכְתְּב֣וּ עָלָ֗י/ו מִכְתַּב֙ פִּתּוּחֵ֣י חוֹתָ֔ם קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/030.yaml
  text: They made the plate[a], the holy crown, of pure gold, and they inscribed on it, like the engraving of a seal, “Holy to Yahweh.”
translation:
  language: fr
  text: 'Ils firent la plaque, le diadème sacré, en or pur, et ils y inscrivirent, à la manière d’une gravure de sceau : « Consacré à Yahweh[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Sainteté à Yahweh. »'
    reason: Le nom קֹדֶשׁ permet aussi une lecture nominale, que la formule française principale rend de façon dédicatoire.
lexical_decisions:
- source_word: צִיץ
  choice: plaque
  rationale: Dans le contexte des vêtements sacerdotaux, le terme désigne la plaque d’or fixée au turban, non une fleur ou une rosette.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: le diadème sacré
  rationale: « Diadème » rend précisément נֵזֶר comme insigne de consécration; l’apposition conserve les deux désignations hébraïques sans les confondre.
- source_word: זָהָב טָהוֹר
  choice: en or pur
  rationale: Formulation française naturelle qui conserve la qualité et la pureté exprimées par l’hébreu.
- source_word: וַיִּכְתְּבוּ עָלָיו
  choice: ils y inscrivirent
  rationale: « Inscrire » convient à un texte placé sur une plaque d’or, tandis que la proposition suivante précise la technique de gravure.
- source_word: מִכְתַּב פִּתּוּחֵי חוֹתָם
  choice: comme on grave un sceau
  rationale: Cette tournure idiomatique rend la manière dont l’inscription fut exécutée et conserve la comparaison avec la gravure d’un sceau.
- source_word: קֹדֶשׁ לַיהוָה
  choice: Consacré à Yahweh
  rationale: La formule française brève exprime clairement la destination sacrée de l’objet tout en gardant la concision de l’inscription; l’autre analyse possible est signalée en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom personnel de l’alliance.
- issue: Sens de l’inscription קֹדֶשׁ לַיהוָה
  choice: Consacré à Yahweh
  alternative: Sainteté à Yahweh
  rationale: קֹדֶשׁ peut exprimer ici l’état ou l’affectation sacrée de la plaque. Le texte principal adopte la formulation dédicatoire la plus naturelle en français moderne, tandis que la formulation nominale, plus littérale, est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique. « Diadème sacré » évite une formulation archaïque tout en conservant la valeur cultuelle du syntagme.
