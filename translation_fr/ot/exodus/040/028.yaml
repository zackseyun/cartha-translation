  yaml_path: translation/ot/exodus/040/028.yaml
  text: And he put the screen at the entrance to the tabernacle[a].
translation:
  language: fr
  text: Il plaça le rideau à l’entrée de la Demeure[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le rideau de l’entrée de la Demeure ».'
    reason: Variante syntaxique reflétant plus directement la construction hébraïque, qui peut présenter la tenture comme le « rideau de l’entrée ».
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Il plaça
  rationale: Le verbe שׂוּם signifie couramment « mettre, placer, établir ». « Il plaça » exprime ici simplement l’installation du rideau, sans ajouter une nuance absente du texte.
- source_word: מָסַךְ
  choice: le rideau
  rationale: Dans le contexte du sanctuaire, מָסָךְ désigne une tenture fermant une entrée. « Rideau » est naturel en français et permet de le distinguer du voile intérieur désigné par פָּרֹכֶת.
- source_word: הַפֶּתַח
  choice: l’entrée
  rationale: פֶּתַח désigne une ouverture ou une entrée. « L’entrée » convient naturellement à la structure de la Demeure.
- source_word: לַמִּשְׁכָּן
  choice: de la Demeure
  rationale: מִשְׁכָּן désigne le sanctuaire transportable comme lieu où Dieu demeure. « La Demeure », avec une majuscule contextuelle, rend le sens du terme hébreu tout en restant compréhensible; le ל est compris comme marquant le rapport entre l’entrée et la Demeure.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. « Demeure » conserve l’image propre à מִשְׁכָּן sans recourir au terme plus technique « tabernacle »; la formulation principale privilégie une relation spatiale naturelle en français.
