  text: וַ/יִּתֵּ֤ן אֶת הַ/שֻּׁלְחָן֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד עַ֛ל יֶ֥רֶךְ הַ/מִּשְׁכָּ֖ן צָפֹ֑נָ/ה מִ/ח֖וּץ לַ/פָּרֹֽכֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/022.yaml
  text: He put the table in the tent of meeting[a], on the north side of the tabernacle, outside the veil.
translation:
  language: fr
  text: Il plaça la table dans la tente de la rencontre, du côté nord du tabernacle, à l’extérieur du voile.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’extérieur du rideau ». Le mot hébreu פָּרֹכֶת désigne la tenture intérieure qui séparait le lieu très saint du reste du sanctuaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Il plaça
  rationale: Dans ce contexte d’aménagement spatial, « plaça » exprime naturellement l’action de mettre un objet à l’endroit prévu.
- source_word: הַשֻּׁלְחָן
  choice: la table
  rationale: L’hébreu dit simplement « la table » ; aucune précision absente de ce verset n’est ajoutée.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: Cette formulation rend clairement la désignation cultuelle אֹהֶל מוֹעֵד en français moderne.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן צָפֹנָה
  choice: du côté nord du tabernacle
  rationale: יֶרֶךְ désigne ici le côté ou le flanc, et צָפֹנָה situe ce côté au nord.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: « Tabernacle » est le terme technique français établi pour cette structure cultuelle dans l’Exode.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: à l’extérieur du voile
  rationale: La formule conserve la relation spatiale et rend פָּרֹכֶת par le terme traditionnel et compréhensible « voile ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe suit clairement la description spatiale de l’hébreu sans expliciter davantage l’identité de la table.
