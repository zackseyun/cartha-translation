  yaml_path: translation/ot/exodus/040/014.yaml
  text: And you shall bring near his sons and clothe them with tunics[a].
translation:
  language: fr
  text: Tu feras approcher ses fils et tu les revêtiras de tuniques[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «tu présenteras ses fils» ou «tu feras avancer ses fils»; le verbe hébreu a souvent le sens formel et cultuel de faire approcher quelqu’un pour un service sacré.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת בָּנָיו
  choice: ses fils
  rationale: Le marqueur de l’objet direct n’est pas rendu séparément en français; בָּנָיו désigne précisément ses fils dans le contexte sacerdotal.
- source_word: תַּקְרִיב
  choice: tu feras approcher
  rationale: Le hifil de קרב signifie faire approcher ou présenter. «Faire approcher» conserve la valeur causative ainsi que la nuance formelle et cultuelle du contexte.
- source_word: וְהִלְבַּשְׁתָּ אֹתָם
  choice: et tu les revêtiras
  rationale: Le verbe causatif exprime l’action de faire porter un vêtement. «Revêtir» est naturel, digne et adapté à l’investiture sacerdotale.
- source_word: כֻּתֳּנֹת
  choice: de tuniques
  rationale: Le terme désigne des vêtements portés près du corps. «Tuniques» est précis sans ajouter la matière, qui n’est pas indiquée dans ce verset.
theological_decisions:
- issue: Nuance sacerdotale et cultuelle de קרב
  choice: tu feras approcher
  alternative: tu présenteras; tu feras avancer
  rationale: La formulation retenue préserve le mouvement d’approche et sa portée cultuelle possible sans préciser davantage que l’hébreu la nature de la cérémonie.
translation_notes:
  register: Français international moderne, sobre et digne. Le futur d’instruction rend naturellement la forme verbale hébraïque dans ce contexte. «Revêtir» maintient le registre cérémoniel sans devenir archaïque.
