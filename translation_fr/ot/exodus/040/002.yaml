base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/002.yaml
  text: On the first day of the first month[a], you shall set up the tabernacle, the tent of meeting.
translation:
  language: fr
  text: Le premier jour du premier mois, tu dresseras le tabernacle, la tente de la rencontre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus formelle : « le tabernacle de la tente de la rencontre ». L’hébreu unit ici deux termes désignant le sanctuaire; on peut les comprendre comme une apposition ou comme une expression plus étroitement liée.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/יוֹם הַ/חֹדֶשׁ הָ/רִאשׁוֹן בְּ/אֶחָד לַ/חֹדֶשׁ
  choice: Le premier jour du premier mois
  rationale: 'La formulation hébraïque exprime une date : littéralement, « au jour du premier mois, à un du mois ». La tournure française retenue en restitue naturellement et précisément le sens.'
- source_word: תָּקִים
  choice: tu dresseras
  rationale: Le hiphil de קום signifie ici « faire tenir debout », donc monter ou ériger la structure. « Dresser » est naturel pour une tente ou un sanctuaire transportable et conserve l’image concrète.
- source_word: מִשְׁכַּן
  choice: tabernacle
  rationale: Dans l’Exode, ce terme désigne le sanctuaire transportable. « Tabernacle » est un terme français établi qui permet de le distinguer du mot suivant, « tente ».
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette désignation cultuelle présente la tente comme le lieu de rencontre fixé entre Dieu et son peuple. « Tente de la rencontre » est clair, fidèle et évite de réduire מוֹעֵד à une simple réunion humaine.
theological_decisions:
- issue: Rapport entre מִשְׁכַּן et אֹהֶל מוֹעֵד
  choice: 'Lecture en apposition : « le tabernacle, la tente de la rencontre »'
  alternative: 'Expression resserrée : « le tabernacle de la tente de la rencontre »'
  rationale: L’hébreu juxtapose les deux désignations sans expliciter leur rapport. L’apposition indique naturellement qu’elles décrivent ici le même sanctuaire sous deux aspects, tout en laissant en note l’autre analyse grammaticale possible.
translation_notes:
  register: Français international moderne, clair et digne. Le futur « tu dresseras » conserve la valeur directive de l’hébreu. Les deux termes distincts du sanctuaire sont maintenus afin de préserver la formulation et l’ambiguïté syntaxique de la source.
