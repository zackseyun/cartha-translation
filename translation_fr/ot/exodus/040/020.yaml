  text: וַ/יִּקַּ֞ח וַ/יִּתֵּ֤ן אֶת הָ/עֵדֻת֙ אֶל הָ֣/אָרֹ֔ן וַ/יָּ֥שֶׂם אֶת הַ/בַּדִּ֖ים עַל הָ/אָרֹ֑ן וַ/יִּתֵּ֧ן אֶת הַ/כַּפֹּ֛רֶת עַל הָ/אָרֹ֖ן מִ/לְ/מָֽעְלָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/020.yaml
  text: Then he took the testimony and put it into the ark[a], and he set the poles on the ark[b], and he placed the mercy seat on the ark above.
translation:
  language: fr
  text: Il prit ensuite le témoignage et le plaça dans l’arche[a]. Il mit les barres sur l’arche, puis posa le propitiatoire[b] sur le dessus de l’arche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les tables du témoignage » ; l’hébreu emploie ici le terme technique « le témoignage » pour désigner ce qui fut placé dans l’arche.
    reason: lexical_alternative
  - marker: b
    text: Ou « le couvercle d’expiation ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵדֻת
  choice: le témoignage
  rationale: Le nom עֵדוּת est ici un terme cultuel établi désignant concrètement ce qui fut déposé dans l’arche, vraisemblablement les tables. « Le témoignage » conserve la formulation hébraïque sans expliciter davantage que le texte.
- source_word: הָאָרֹן
  choice: l’arche
  rationale: אָרוֹן désigne un coffre et, dans ce contexte, l’arche sacrée. « L’arche » est la désignation française naturelle, sans ajouter « de l’alliance », absent du verset.
- source_word: הַבַּדִּים
  choice: les barres
  rationale: בַּדִּים désigne les longues barres servant au transport de l’arche. « Barres » est clair et courant en français moderne.
- source_word: הַכַּפֹּרֶת
  choice: le propitiatoire
  rationale: כַּפֹּרֶת nomme la pièce d’or placée au-dessus de l’arche. « Propitiatoire » est le terme biblique français consacré et préserve la portée cultuelle de l’objet; une formulation explicative est donnée en note.
- source_word: מִלְמָעְלָה
  choice: par-dessus
  rationale: L’expression adverbiale indique que le propitiatoire est posé sur la partie supérieure de l’arche. « Par-dessus » rend cette position naturellement sans ajouter de pronom absent de l’hébreu.
- source_word: וַיִּתֵּן ... אֶל
  choice: plaça ... dans
  rationale: Dans ce contexte physique, נתן avec אֶל exprime l’action de déposer un objet à l’intérieur d’un autre.
- source_word: וַיָּשֶׂם ... עַל
  choice: mit ... sur
  rationale: שׂים avec עַל décrit ici la mise en place des barres sur l’arche; cette formulation simple suit la relation spatiale exprimée par l’hébreu.
theological_decisions:
- issue: Référent du « témoignage »
  choice: Conserver le terme cultuel « le témoignage », qui désigne concrètement ce qui est placé dans l’arche.
  alternative: Expliciter « les tables du témoignage » ou « les tables de l’alliance ».
  rationale: La scène suppose un objet concret, vraisemblablement les tables de pierre, mais l’hébreu emploie le terme technique עֵדוּת sans nommer les tables. La traduction préserve cette tension.
- issue: Traduction de כַּפֹּרֶת
  choice: le propitiatoire
  alternative: le couvercle d’expiation; le couvercle
  rationale: Le mot désigne un objet cultuel précis et non un simple couvercle. Le terme traditionnel « propitiatoire » maintient cette portée, tandis que la note fournit une autre traduction possible plus descriptive.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe est fluide sans effacer les termes cultuels du texte source. « Propitiatoire », moins courant dans la langue générale, est conservé comme terme biblique précis et expliqué en note.
