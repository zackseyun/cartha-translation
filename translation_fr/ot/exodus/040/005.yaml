base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/005.yaml
  text: And you shall place the golden altar for incense before the ark of the testimony[b][a], and you shall set the screen for the entrance of the tabernacle.
translation:
  language: fr
  text: Tu placeras l’autel d’or destiné à l’encens devant l’arche du témoignage[a], et tu mettras le rideau de l’entrée du tabernacle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « l’arche de l’alliance ». L’hébreu dit ici littéralement « l’arche du témoignage ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Tu placeras
  rationale: Le verbe נתן peut signifier « donner », « mettre » ou « placer ». Ici, il s’agit de disposer un objet cultuel à l’endroit prescrit ; « placer » est donc naturel et précis.
- source_word: מִזְבַּח הַזָּהָב
  choice: l’autel d’or
  rationale: L’expression hébraïque désigne littéralement l’autel fait ou revêtu d’or. « L’autel d’or » conserve cette description matérielle dans un français naturel.
- source_word: לִקְטֹרֶת
  choice: destiné à l’encens
  rationale: La préposition ל exprime ici la destination ou la fonction. Cette formulation préserve cette nuance plus explicitement que le traditionnel « autel des parfums ».
- source_word: לִפְנֵי
  choice: devant
  rationale: 'לִפְנֵי a ici son sens spatial courant : « devant », « en face de ».'
- source_word: אֲרוֹן הָעֵדֻת
  choice: l’arche du témoignage
  rationale: עֵדֻת signifie « témoignage » ou « attestation ». La traduction suit le titre exact employé dans ce verset plutôt que de lui substituer le titre traditionnel « arche de l’alliance ».
- source_word: וְשַׂמְתָּ
  choice: tu mettras
  rationale: שׂים signifie « mettre » ou « placer ». « Mettre » évite une répétition pesante tout en exprimant fidèlement l’installation du rideau.
- source_word: מָסַךְ הַפֶּתַח
  choice: le rideau à l’entrée
  rationale: Dans le contexte de la demeure, מָסַךְ désigne la tenture qui ferme ou masque une entrée. « Rideau » est clair en français et le distingue du voile intérieur.
- source_word: לַמִּשְׁכָּן
  choice: de la demeure
  rationale: מִשְׁכָּן vient de la racine exprimant l’idée d’habiter ou de demeurer. « Demeure » rend ce sens tout en désignant ici le sanctuaire mobile d’Israël.
theological_decisions:
- issue: Titre de l’arche avec עֵדֻת
  choice: l’arche du témoignage
  alternative: l’arche de l’alliance
  rationale: Le texte hébreu porte עֵדֻת, « témoignage », et non בְּרִית, « alliance ». Garder « témoignage » respecte la formulation du verset sans effacer le lien traditionnel avec l’arche de l’alliance.
- issue: Traduction de מִשְׁכָּן
  choice: la demeure
  alternative: le tabernacle
  rationale: « Demeure » rend le sens lexical du terme hébreu et l’idée de la présence divine parmi Israël. La note conserve le terme traditionnel afin que le référent cultuel reste explicite.
translation_notes:
  register: Français moderne, clair et digne. Le futur simple conserve la force prescriptive de l’instruction. Les termes « témoignage » et « demeure » restent proches de l’hébreu, tandis que les notes signalent les appellations traditionnelles les plus connues.
