base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/018.yaml
  text: So Moses set up the tabernacle[a], and placed its bases, and set its frames, and put in its bars[c][b], and raised up its pillars.
translation:
  language: fr
  text: Moïse dressa le tabernacle, mit en place ses socles[a], posa ses cadres[b], installa ses barres et dressa ses colonnes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bases ». Les socles étaient les pièces de fondation qui recevaient les cadres du tabernacle.
    reason: lexical_alternative
  - marker: b
    text: Ou « planches ». Le terme hébreu peut désigner des planches, employées ici comme éléments verticaux de la structure.
    reason: lexical_alternative
  - marker: c
    text: Ou « poteaux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: dressa
  rationale: À la forme causative, קום signifie ici « faire tenir debout, ériger ». « Dresser » convient naturellement à l’assemblage du tabernacle et peut aussi s’employer pour les colonnes à la fin du verset.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: מִשְׁכָּן signifie littéralement « demeure », mais désigne ici le sanctuaire portatif d’Israël. « Tabernacle » en conserve le référent précis et traditionnel en français.
- source_word: אֲדָנָיו
  choice: ses socles
  rationale: אֶדֶן désigne les pièces de fondation dans lesquelles s’inséraient les éléments verticaux. « Socles » exprime clairement cette fonction structurelle.
- source_word: קְרָשָׁיו
  choice: ses cadres
  rationale: קֶרֶשׁ peut désigner des planches, mais ces pièces sont les éléments verticaux de la structure du tabernacle. « Cadres » rend leur fonction sans exclure l’alternative matérielle « planches ».
- source_word: בְּרִיחָיו
  choice: ses barres
  rationale: בְּרִיחַ désigne les barres qui reliaient et maintenaient les cadres. « Barres » reste proche de l’hébreu sans préciser davantage leur orientation.
- source_word: עַמּוּדָיו
  choice: ses colonnes
  rationale: עַמּוּד désigne des supports verticaux. « Colonnes » est naturel et digne dans le contexte d’un sanctuaire, tandis que « poteaux » reste une possibilité plus utilitaire.
- source_word: וַיָּשֶׂם
  choice: posa
  rationale: שׂוּם signifie « mettre, placer ». « Posa » s’emploie naturellement pour la mise en place des cadres et maintient la succession concrète des opérations.
- source_word: וַיִּתֵּן
  choice: mit en place / installa
  rationale: נָתַן a ici le sens contextuel de « mettre, placer ». La variation française selon l’objet évite une répétition pesante tout en conservant la même action fondamentale.
