base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/017.yaml
  text: And it happened in the first month of the second year[a], on the first day of the month[b], that the tabernacle was set up.
translation:
  language: fr
  text: Le premier jour du premier mois de la deuxième année, le tabernacle fut dressé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: '[rendu par la construction temporelle de la phrase]'
  rationale: Dans cette formule narrative et chronologique, וַיְהִי introduit l’événement. Une reprise explicite par « il arriva que » serait possible, mais alourdirait inutilement le français.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן בַּשָּׁנָה הַשֵּׁנִית
  choice: La deuxième année, le premier mois
  rationale: Cette formulation conserve les deux indications calendaires de l’hébreu dans un ordre naturel et clair en français.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: le premier jour du mois
  rationale: L’expression hébraïque, littéralement « à un du mois », est une formule idiomatique désignant le premier jour du mois.
- source_word: הוּקַם
  choice: fut dressé
  rationale: Le hophal de קום exprime ici l’action passive de mettre en place ou d’ériger la structure. « Fut dressé » est précis, naturel et adapté au tabernacle.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: « Tabernacle » est le terme français établi pour le sanctuaire mobile décrit dans l’Exode et préserve sa spécificité cultuelle.
