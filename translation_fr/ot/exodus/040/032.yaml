  text: בְּ/בֹאָ֞/ם אֶל אֹ֣הֶל מוֹעֵ֗ד וּ/בְ/קָרְבָתָ֛/ם אֶל הַ/מִּזְבֵּ֖חַ יִרְחָ֑צוּ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/032.yaml
  text: Whenever they entered the tent of meeting, and whenever they approached the altar, they washed, just as Yahweh had commanded Moses.
translation:
  language: fr
  text: Chaque fois qu’ils entraient dans la tente de la rencontre et chaque fois qu’ils s’approchaient de l’autel, ils se lavaient, comme Yahweh l’avait ordonné à Moïse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבֹאָם
  choice: Chaque fois qu’ils entraient
  rationale: La construction ב + infinitif construit avec suffixe exprime une circonstance temporelle. « Chaque fois que » rend clairement le caractère répété de cette pratique, et l’imparfait convient au cadre narratif passé.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette formulation française naturelle conserve l’idée du lieu cultuel où Yahweh rencontre son peuple.
- source_word: וּבְקָרְבָתָם
  choice: et chaque fois qu’ils s’approchaient
  rationale: La seconde construction temporelle est rendue parallèlement à la première; « s’approcher de » traduit naturellement קרב dans ce contexte.
- source_word: הַמִּזְבֵּחַ
  choice: l’autel
  rationale: Le nom défini est rendu directement et sans explicitation superflue.
- source_word: יִרְחָצוּ
  choice: ils se lavaient
  rationale: L’imparfait hébreu décrit ici une action coutumière dans un récit passé. La forme pronominale française exprime naturellement le lavage, sans préciser les parties du corps au-delà de ce verset.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: « Comme » introduit avec naturel la conformité de leur pratique au commandement antérieur.
- source_word: צִוָּה
  choice: l’avait ordonné
  rationale: Le plus-que-parfait marque que le commandement avait précédé l’exécution décrite; le pronom « l’ » reprend implicitement ce qui devait être fait.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֶת מֹשֶׁה
  choice: à Moïse
  rationale: Avec le verbe français « ordonner », la personne qui reçoit l’ordre est idiomatiquement introduite par « à ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel sans le remplacer par un titre ni adopter la forme tardive « Jéhovah ».
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme « chaque fois… et chaque fois… » met en évidence le caractère habituel des deux circonstances tout en restant proche de la structure hébraïque.
