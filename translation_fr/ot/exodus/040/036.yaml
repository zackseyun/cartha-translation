review_pass:
  verdict: revise
  source_fidelity: La valeur habituelle de la construction temporelle est bien rendue par « Chaque fois que » et l’imparfait. Toutefois, « s’élevait au-dessus du sanctuaire » décrit surtout une montée située au-dessus du sanctuaire et n’exprime pas clairement le départ de la nuée depuis sa position au-dessus de la Demeure. « De dessus le tabernacle » rend cette relation de départ. « Dans toutes leurs étapes » correspond plus directement à בְּכָל־מַסְעֵיהֶם que « à chacune de leurs étapes ».
  naturalness: La phrase révisée reste claire et digne en français biblique moderne. « De dessus » est un tour un peu soutenu, mais idiomatique et utile pour conserver la relation spatiale précise du texte. « Tabernacle » est un terme biblique internationalement reconnu; il évite l’élargissement possible de « sanctuaire ».
  terminology: « Nuée » convient au contexte. « Tabernacle » traduit précisément מִשְׁכָּן dans l’Exode. « Les Israélites » est une désignation collective française naturelle; la note conserve la formulation littérale « les fils d’Israël » sans imposer une lecture restrictive.
  issues:
  - severity: medium
    issue: Relation spatiale de מֵעַל insuffisamment marquée
    rationale: « La nuée s’élevait au-dessus du sanctuaire » peut signifier qu’elle montait tout en se trouvant au-dessus du sanctuaire. Le texte indique qu’elle était levée/partait de dessus le tabernacle.
  - severity: medium
    issue: Rendu de בְּכָל־מַסְעֵיהֶם trop reformulé
    rationale: « À chacune de leurs étapes » est interprétatif et fait des étapes le moment du départ. « Dans toutes leurs étapes » conserve plus directement le cadre de leurs déplacements successifs.
  - severity: low
    issue: « Sanctuaire » est plus large que מִשְׁכָּן
    rationale: Dans ce contexte, le terme désigne spécifiquement le tabernacle, la demeure cultuelle portative; « tabernacle » est plus précis.
  revised_text: Chaque fois que la nuée s’élevait de dessus le tabernacle, les Israélites[a] se mettaient en route dans toutes leurs étapes.
  revised_footnotes:
  - marker: a
    text: Littéralement « les fils d’Israël ».
    reason: lexical_alternative
  revision_rationale: La révision conserve l’aspect répétitif et l’absence d’agent explicitement nommé, tout en rendant plus fidèlement le mouvement de la nuée depuis au-dessus du tabernacle et la formule récapitulative relative à toutes les étapes des Israélites.
