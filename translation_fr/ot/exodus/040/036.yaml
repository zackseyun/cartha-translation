  text: וּ/בְ/הֵעָל֤וֹת הֶֽ/עָנָן֙ מֵ/עַ֣ל הַ/מִּשְׁכָּ֔ן יִסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/כֹ֖ל מַסְעֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/036.yaml
  text: Whenever the cloud was taken up from over the tabernacle[a], the sons of Israel would set out in all their journeys.
translation:
  language: fr
  text: Chaque fois que la nuée s’élevait de dessus le tabernacle, les Israélites[a] se mettaient en route dans toutes leurs étapes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « les fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהֵעָלֹת
  choice: Chaque fois que … s’élevait
  rationale: La construction temporelle avec l’infinitif construit décrit ici une circonstance répétée. « Chaque fois que » et l’imparfait rendent naturellement cette valeur habituelle; עלה indique que la nuée monte ou s’élève, sans qu’il soit nécessaire d’introduire un agent.
- source_word: הֶעָנָן
  choice: la nuée
  rationale: Le nom défini désigne la nuée particulière, signe de la présence divine dans le contexte. « Nuée » conserve le registre biblique tout en restant intelligible.
- source_word: מֵעַל
  choice: au-dessus de
  rationale: Avec le verbe de mouvement, l’expression indique que la nuée quitte sa position au-dessus du sanctuaire. En français, « s’élevait au-dessus de » exprime naturellement cette relation sans le tour lourd « depuis au-dessus de ».
- source_word: הַמִּשְׁכָּן
  choice: le sanctuaire
  rationale: מִשְׁכָּן désigne ici la demeure sacrée portative. « Sanctuaire » est naturel en français moderne et précis dans ce contexte; « tabernacle » serait plus formellement traditionnel, mais moins immédiatement transparent pour certains lecteurs.
- source_word: יִסְעוּ
  choice: se mettaient en route
  rationale: נסע exprime le départ du camp pour poursuivre le voyage. L’imparfait français correspond à l’action habituelle liée à « chaque fois que ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: L’expression signifie littéralement « les fils d’Israël », mais fonctionne comme une désignation collective du peuple. « Les Israélites » est le français moderne le plus naturel, sans restreindre le groupe aux hommes.
- source_word: בְּכֹל מַסְעֵיהֶם
  choice: à chacune de leurs étapes
  rationale: מַסָּע peut désigner une étape ou un déplacement dans l’itinéraire. Avec כֹּל, le sens distributif est bien rendu par « à chacune de leurs étapes », expression naturelle qui évite la redondance de « tous leurs voyages ».
theological_decisions:
- issue: Désignation collective בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël
  rationale: La tournure hébraïque est grammaticalement masculine mais désigne collectivement le peuple. Le rendu naturel « les Israélites » conserve la portée corporative; une note signale la forme littérale afin de préserver l’information du texte source.
- issue: Agent de l’élévation de la nuée
  choice: la nuée s’élevait
  alternative: la nuée était élevée
  rationale: La forme hébraïque de עלה peut décrire simplement la montée de la nuée et ne nomme aucun agent. Le pronominal français préserve cette absence d’agent plutôt que d’impliquer explicitement une intervention non formulée dans ce verset.
translation_notes:
  register: Français international moderne, digne et accessible. « Nuée » maintient la distinction contextuelle avec un nuage ordinaire. La phrase met en relief le caractère répété des départs et rend la dernière expression comme une totalité distributive d’étapes.
