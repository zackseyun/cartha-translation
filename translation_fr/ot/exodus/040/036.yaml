revisions:
- from: Chaque fois que la nuée s’élevait au-dessus du sanctuaire, les Israélites[a] se mettaient en route, à chacune de leurs étapes.
  to: Chaque fois que la nuée s’élevait de dessus le tabernacle, les Israélites[a] se mettaient en route dans toutes leurs étapes.
  rationale: La révision conserve l’aspect répétitif et l’absence d’agent explicitement nommé, tout en rendant plus fidèlement le mouvement de la nuée depuis au-dessus du tabernacle et la formule récapitulative relative à toutes les étapes des Israélites.
