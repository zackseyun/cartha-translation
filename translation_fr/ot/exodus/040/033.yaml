  register: Français international moderne, narratif et digne. La syntaxe reste proche de l’hébreu tout en évitant les calques. « Enceinte » est employé de manière cohérente pour l’espace délimité et sa clôture, tandis que « rideau de l’entrée » explicite naturellement la fonction de la tenture.
