  text: וַ/יָּ֣קֶם אֶת הֶ/חָצֵ֗ר סָבִיב֙ לַ/מִּשְׁכָּ֣ן וְ/לַ/מִּזְבֵּ֔חַ וַ/יִּתֵּ֕ן אֶת מָסַ֖ךְ שַׁ֣עַר הֶ/חָצֵ֑ר וַ/יְכַ֥ל מֹשֶׁ֖ה אֶת הַ/מְּלָאכָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/033.yaml
  text: Then he set up the courtyard around the tabernacle and the altar[a], and put up the screen for the gate of the courtyard. So Moses finished the work.
translation:
  language: fr
  text: Il dressa l’enceinte tout autour du tabernacle et de l’autel, puis il mit en place le rideau de l’entrée de l’enceinte. Ainsi, Moïse acheva le travail.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֶם
  choice: dressa
  rationale: Dans ce contexte d’installation du sanctuaire, le hifil de קום signifie dresser ou mettre en place une structure. « Dressa » est naturel et précis.
- source_word: הֶחָצֵר
  choice: l’enceinte
  rationale: חָצֵר désigne ici l’espace extérieur délimité autour du tabernacle. « Enceinte » met en valeur la clôture installée tout autour, conformément au contexte de construction.
- source_word: סָבִיב
  choice: tout autour
  rationale: L’expression rend clairement l’idée d’encerclement portée par סָבִיב.
- source_word: לַמִּשְׁכָּן
  choice: du tabernacle
  rationale: « Tabernacle » est le terme cultuel français établi pour le מִשְׁכָּן dans l’Exode.
- source_word: וְלַמִּזְבֵּחַ
  choice: et de l’autel
  rationale: Traduction directe de מִזְבֵּחַ, les deux compléments indiquant ce que l’enceinte entoure.
- source_word: וַיִּתֵּן
  choice: mit en place
  rationale: נתן signifie fondamentalement mettre ou placer; dans ce contexte, il s’agit d’installer le textile à l’entrée.
- source_word: מָסַךְ
  choice: le rideau
  rationale: מָסַךְ désigne ici une tenture textile fermant ou couvrant l’entrée. « Rideau » est clair en français moderne sans suggérer une porte rigide.
- source_word: שַׁעַר הֶחָצֵר
  choice: de l’entrée de l’enceinte
  rationale: שַׁעַר peut désigner l’ouverture d’accès. Puisqu’un rideau y est installé, « entrée » est plus naturel que « porte » et évite l’image d’un battant rigide.
- source_word: וַיְכַל
  choice: acheva
  rationale: כלה exprime l’achèvement complet de l’activité; « acheva » convient au registre narratif digne.
- source_word: הַמְּלָאכָה
  choice: le travail
  rationale: מְלָאכָה récapitule l’ensemble du travail de construction et d’installation.
theological_decisions: []
