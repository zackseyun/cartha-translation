  yaml_path: translation/ot/exodus/040/016.yaml
  text: And Moses did according to all that Yahweh commanded him[a]; so he did.
translation:
  language: fr
  text: Moïse fit tout ce que Yahweh lui avait ordonné[a] ; il fit ainsi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler le nom divin sous-jacent et son rendu traditionnel.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fit
  rationale: Le verbe עשה signifie largement « faire, accomplir ». Ici, il décrit l’exécution obéissante des instructions reçues.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: כְּכֹל
  choice: tout ce que
  rationale: Dans ce contexte, la tournure exprime la conformité complète à l’ensemble des ordres divins ; cette formulation est naturelle en français.
- source_word: צִוָּה
  choice: avait ordonné
  rationale: Le plus-que-parfait rend naturellement en français l’antériorité des ordres par rapport à leur exécution, sans changer le sens du parfait hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin conserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֹתוֹ
  choice: lui
  rationale: Le suffixe masculin singulier renvoie à Moïse, destinataire des ordres.
- source_word: כֵּן עָשָׂה
  choice: c’est exactement ce qu’il fit
  rationale: Cette reprise conserve l’insistance rhétorique de l’hébreu sur la conformité précise de l’action de Moïse, tout en restant idiomatique en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre, tandis que « le SEIGNEUR » représente la substitution traditionnelle par un titre.
- issue: Force de la répétition de עשה
  choice: Conserver une proposition finale emphatique
  alternative: Omettre la reprise comme redondante
  rationale: La répétition appartient au texte hébreu et souligne l’obéissance exacte de Moïse ; elle ne doit pas être supprimée.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde l’insistance de l’hébreu sans reproduire servilement une tournure peu naturelle telle que « selon tout ce que ».
