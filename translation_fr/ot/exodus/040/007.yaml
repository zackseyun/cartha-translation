  text: וְ/נָֽתַתָּ֙ אֶת הַ/כִּיֹּ֔ר בֵּֽין אֹ֥הֶל מוֹעֵ֖ד וּ/בֵ֣ין הַ/מִּזְבֵּ֑חַ וְ/נָתַתָּ֥ שָׁ֖ם מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/007.yaml
  text: And you shall place the basin between the tent of meeting and the altar[a], and you shall put water there.
translation:
  language: fr
  text: Tu placeras la cuve entre la tente de la rencontre et l’autel, et tu y mettras de l’eau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Tu placeras
  rationale: Le verbe נתן a un sens large (« donner, mettre, placer »). Avec un objet de mobilier cultuel qu’il faut positionner, « placer » exprime naturellement l’instruction spatiale.
- source_word: הַכִּיֹּר
  choice: la cuve
  rationale: כִּיּוֹר désigne le grand récipient destiné aux ablutions dans le sanctuaire. « Cuve » est clair, actuel et adapté à cet objet, sans l’archaïsme de « bassin d’airain » ni l’imprécision possible de « lavabo ».
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: entre la tente de la rencontre et l’autel
  rationale: La construction בֵּין...וּבֵין indique la position entre deux éléments. « Tente de la rencontre » rend de manière transparente אֹהֶל מוֹעֵד, et « autel » correspond directement à מִזְבֵּחַ.
- source_word: וְנָתַתָּ שָׁם מָיִם
  choice: et tu y mettras de l’eau
  rationale: Le français « y » reprend naturellement le lieu indiqué par שָׁם et, dans le contexte immédiat, la cuve qui vient d’être placée. Cette formulation conserve le sens tout en évitant le tour moins idiomatique « tu mettras là de l’eau ».
