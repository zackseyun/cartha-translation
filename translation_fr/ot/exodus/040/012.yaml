  text: וְ/הִקְרַבְתָּ֤ אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֔י/ו אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/רָחַצְתָּ֥ אֹתָ֖/ם בַּ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/012.yaml
  text: Then bring Aaron and his sons near to the entrance of the tent of meeting, and wash them with water.
translation:
  language: fr
  text: Tu feras approcher Aaron et ses fils de l’entrée de la tente de la rencontre, et tu les laveras avec de l’eau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: Tu feras approcher
  rationale: Le hifil de קרב exprime l’idée de faire venir près. « Faire approcher » conserve à la fois la valeur causative et la portée rituelle du verbe.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Le nom propre est rendu selon sa forme française traditionnelle.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le terme hébreu désigne ici les fils d’Aaron, dans le contexte précis de leur consécration sacerdotale.
- source_word: פֶּתַח
  choice: l’entrée
  rationale: « L’entrée » désigne naturellement en français le point d’accès à la tente.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette expression rend les deux éléments du syntagme hébreu et désigne le lieu où Dieu rencontre son peuple, sans paraphrase doctrinale.
- source_word: וְרָחַצְתָּ
  choice: tu les laveras
  rationale: רחץ signifie laver. Cette formulation reste suffisamment générale pour ne pas préciser un mode d’ablution que le texte n’explicite pas.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom reprend collectivement Aaron et ses fils.
- source_word: בַּמָּיִם
  choice: avec de l’eau
  rationale: 'La préposition ב a ici une valeur instrumentale naturelle : l’eau est le moyen employé pour les laver.'
