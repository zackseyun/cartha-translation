source:
  edition: WLC
  text: כִּי֩ עֲנַ֨ן יְהוָ֤ה עַֽל הַ/מִּשְׁכָּן֙ יוֹמָ֔ם וְ/אֵ֕שׁ תִּהְיֶ֥ה לַ֖יְלָה בּ֑/וֹ לְ/עֵינֵ֥י כָל בֵּֽית יִשְׂרָאֵ֖ל בְּ/כָל מַסְעֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/038.yaml
  text: For the cloud of Yahweh was over the tabernacle by day[a], and fire was in it by night[b], before the eyes of all the house of Israel throughout all their journeys.
translation:
  language: fr
  text: Car la nuée de Yahweh était au-dessus du tabernacle le jour, et du feu s’y trouvait la nuit[a], sous les yeux de toute la maison d’Israël, tout au long de leurs déplacements[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du feu était en lui ». Le pronom peut renvoyer à la nuée ou au tabernacle.'
    reason: ambiguïté du référent pronominal
  - marker: b
    text: 'Ou : « pendant toutes leurs étapes » ou « dans tous leurs déplacements ».'
    reason: alternative lexicale
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit une explication récapitulative de ce qui précède et conserve le lien logique du texte hébreu.
- source_word: עֲנַן יְהוָה
  choice: la nuée de Yahweh
  rationale: Rend directement la relation construite et associe la nuée à la présence de Yahweh sans l’identifier explicitement à Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel יהוה au lieu de le remplacer par un titre.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: Terme français consacré pour le sanctuaire démontable d’Exode, encore intelligible dans un registre biblique moderne.
- source_word: יוֹמָם
  choice: pendant le jour
  rationale: Expression temporelle naturelle, mise en parallèle avec « pendant la nuit ».
- source_word: וְאֵשׁ תִּהְיֶה לַיְלָה בּוֹ
  choice: et du feu s’y trouvait pendant la nuit[a]
  rationale: « S’y trouvait » exprime la présence du feu sans ajouter l’idée qu’il brillait. Le pronom adverbial « y » évite de trancher dans le texte principal entre la nuée et le tabernacle comme référent de בּוֹ.
- source_word: לְעֵינֵי
  choice: sous les yeux de
  rationale: Conserve l’image concrète de l’hébreu dans une tournure française naturelle.
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: toute la maison d’Israël
  rationale: Préserve l’expression collective et identitaire « maison d’Israël » plutôt que de la réduire à « tout Israël ».
- source_word: בְּכָל מַסְעֵיהֶם
  choice: tout au long de leurs déplacements[b]
  rationale: Exprime la continuité sur l’ensemble des marches ou étapes du peuple, sans suggérer nécessairement des voyages indépendants.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le Tétragramme; sa transcription préserve le nom personnel de l’alliance plutôt que de lui substituer un titre.
- issue: Référent de בּוֹ dans la description du feu nocturne
  choice: Formulation française non résolutive avec « y »
  alternative: « en elle » pour la nuée, ou « dans le tabernacle »
  rationale: Le suffixe masculin singulier peut grammaticalement renvoyer à עֲנָן, « nuée », ou à מִשְׁכָּן, « tabernacle ». Le texte principal conserve cette ambiguïté au lieu d’imposer une interprétation de la manifestation divine.
translation_notes:
  register: Français international moderne, digne et lisible. « Nuée » et « tabernacle » maintiennent le vocabulaire biblique nécessaire; la syntaxe reste simple. La répétition « pendant le jour / pendant la nuit » reproduit clairement le parallélisme temporel.
