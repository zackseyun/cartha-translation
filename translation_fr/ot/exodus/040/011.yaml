translation:
  language: fr
  text: Tu oindras la cuve et son support[a], et tu la consacreras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son socle ».
    reason: lexical_alternative
  - marker: b
    text: Ou « tu la sanctifieras » ou « tu la rendras sainte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: Tu consacreras par l’onction
  rationale: Dans ce contexte rituel, משׁח désigne l’application d’huile qui met un objet à part pour le service sacré. Cette formulation est naturelle en français et évite l’ambiguïté moderne du verbe « oindre ».
- source_word: הַכִּיֹּר
  choice: la cuve
  rationale: כִּיּוֹר désigne ici le grand récipient destiné aux ablutions dans le sanctuaire. « Cuve » convient mieux à ses dimensions et à sa fonction que le plus général « bassin ».
- source_word: כַּנּוֹ
  choice: son support
  rationale: כֵּן désigne la structure qui porte la cuve. « Support » est un terme français courant qui préserve cette relation fonctionnelle; « socle » reste possible.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: et tu la consacreras
  rationale: Au piel, קדשׁ signifie mettre à part comme saint pour l’usage cultuel. Le pronom masculin hébreu renvoie grammaticalement à כִּיּוֹר; le féminin français « la » reprend donc « cuve », celle-ci pouvant représenter l’ensemble formé avec son support.
theological_decisions:
- issue: Sens de קדשׁ dans le contexte du sanctuaire
  choice: consacrer
  alternative: sanctifier / rendre saint
  rationale: « Consacrer » exprime la mise à part rituelle du mobilier sacré sans suggérer une transformation morale.
- issue: Référent du pronom singulier אֹתוֹ
  choice: la cuve, comprise avec son support comme un ensemble mobilier
  alternative: chacun des deux éléments / l’ensemble explicitement reformulé au pluriel
  rationale: Le texte hébreu conserve un objet pronominal singulier masculin, dont l’antécédent grammatical le plus direct est « la cuve »; la traduction maintient ce singulier plutôt que de résoudre implicitement la portée rituelle.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « consacrer par l’onction » rend explicitement la nature rituelle de משׁח; la répétition de « consacrer » reflète deux verbes hébreux distincts tout en les différenciant par la mention de l’onction.
