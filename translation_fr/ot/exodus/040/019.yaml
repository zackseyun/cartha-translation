  text: וַ/יִּפְרֹ֤שׂ אֶת הָ/אֹ֨הֶל֙ עַל הַ/מִּשְׁכָּ֔ן וַ/יָּ֜שֶׂם אֶת מִכְסֵ֥ה הָ/אֹ֛הֶל עָלָ֖י/ו מִ/לְ/מָ֑עְלָ/ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/019.yaml
  text: Then he spread the tent over the tabernacle and put the covering of the tent over it from above, just as Yahweh had commanded Moses.
translation:
  language: fr
  text: Puis il déploya la tente sur le tabernacle et plaça par-dessus la couverture de la tente, comme Yahweh l’avait ordonné à Moïse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְרֹשׂ
  choice: il déploya
  rationale: Le verbe פרשׂ décrit l’action d’étendre ou de déployer une pièce. « Déploya » convient naturellement à la mise en place de la tente tout en restant proche du sens hébreu.
- source_word: הָאֹהֶל
  choice: la tente
  rationale: אֹהֶל désigne la tente, ici la couche disposée sur le tabernacle. Ce choix maintient sa distinction avec מִכְסֶה, « couverture ».
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: Dans l’Exode, מִשְׁכָּן désigne la demeure sacrée. « Tabernacle » est le terme français biblique précis et usuel dans ce contexte.
- source_word: וַיָּשֶׂם
  choice: plaça
  rationale: שׂים signifie mettre, poser ou placer. « Plaça » est naturel dans la description soignée de l’installation.
- source_word: מִכְסֵה הָאֹהֶל
  choice: la couverture de la tente
  rationale: La traduction directe du syntagme construit préserve la distinction entre la tente et sa couverture extérieure.
- source_word: עָלָיו מִלְמָעְלָה
  choice: par-dessus
  rationale: Les deux expressions spatiales indiquent que la couverture est posée au-dessus de l’ensemble. « Par-dessus » rend cette relation clairement sans lourdeur ni redondance artificielle.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: comme Yahweh l’avait ordonné à Moïse
  rationale: La formule récurrente souligne la conformité de l’action de Moïse au commandement antérieur. Le plus-que-parfait exprime naturellement cette antériorité en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à sa présence explicite dans le texte hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom personnel divin sans lui substituer un titre et sans imposer la forme « Jéhovah ».
translation_notes:
  register: Français moderne, sobre et digne. La formulation conserve les termes techniques distincts « tente », « tabernacle » et « couverture », tout en évitant une répétition spatiale peu naturelle en français.
