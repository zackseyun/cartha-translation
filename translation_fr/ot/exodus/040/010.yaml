review_pass:
  verdict: revise
  source_fidelity: 'Le sens de la séquence rituelle est bien rendu : onction, ensemble des ustensiles, consécration et statut résultant de sainteté suprême. Toutefois, « holocauste » est aujourd’hui fortement associé en français au génocide des Juifs; « offrande consumée par le feu » rend directement עֹלָה sans cette association historique moderne. La note actuelle donne aussi une littéralité imprécise : קֹדֶשׁ קָדָשִׁים est plus exactement « sainteté des saintetés » (construction superlative) que « saint des saints ».'
  naturalness: La syntaxe, le futur injonctif et la répétition de « l’autel » sont naturels et conviennent au registre des instructions cultuelles. « Très saint » est une expression française claire et appropriée pour le superlatif hébreu.
  terminology: « Oindre », « ustensiles » et « consacrer » sont précis dans ce contexte. « Autel de l’offrande consumée par le feu » est un équivalent moderne, explicite et non anachroniquement chargé de מִזְבַּח הָעֹלָה. « Très saint » préserve la valeur superlative de קֹדֶשׁ קָדָשִׁים sans l’identifier au lieu nommé « le Saint des saints ».
  issues:
  - severity: medium
    issue: « l’autel de l’holocauste »
    rationale: Bien que traditionnel dans certaines traductions bibliques, « holocauste » désigne prioritairement en français moderne le génocide des Juifs durant la Seconde Guerre mondiale. Une formulation décrivant l’offrande entièrement brûlée rend עֹלָה avec davantage de clarté et sans cette ambiguïté moderne.
  - severity: low
    issue: Littéralité de la note « saint des saints »
    rationale: La formule hébraïque קֹדֶשׁ קָדָשִׁים est une construction nominale superlative; « sainteté des saintetés » est une représentation littérale plus exacte. La note doit signaler qu’il s’agit d’une tournure superlative.
  revised_text: Tu oindras l’autel de l’offrande consumée par le feu et tous ses ustensiles. Tu consacreras l’autel, et l’autel sera très saint[a].
  revised_footnotes:
  - marker: a
    text: 'Littéralement : « sainteté des saintetés », tournure hébraïque exprimant le plus haut degré de sainteté.'
    reason: lexical_alternative
