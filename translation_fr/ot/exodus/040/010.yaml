  text: You shall anoint the altar of burnt offering and all its utensils[a], and you shall consecrate the altar, and the altar shall be most holy.
translation:
  language: fr
  text: Tu oindras l’autel de l’offrande consumée par le feu et tous ses ustensiles. Tu consacreras l’autel, et l’autel sera très saint[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sainteté des saintetés », tournure hébraïque exprimant le plus haut degré de sainteté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: Tu oindras
  rationale: Dans ce contexte cultuel, משׁח désigne l’onction d’huile qui met un objet à part pour le service sacré. « Oindre » est le terme français précis et traditionnel, encore compréhensible.
- source_word: מִזְבַּח הָעֹלָה
  choice: l’autel de l’holocauste
  rationale: Le syntagme construit désigne l’autel associé au sacrifice entièrement consumé. « L’autel de l’holocauste » est une formulation française concise et consacrée par l’usage biblique.
- source_word: כָּל כֵּלָיו
  choice: tous ses ustensiles
  rationale: כֵּלִים désigne ici l’ensemble des objets et instruments employés avec l’autel. « Ustensiles » rend cette catégorie de manière naturelle sans la limiter aux seuls récipients.
- source_word: וְקִדַּשְׁתָּ
  choice: Tu consacreras
  rationale: Dans ce cadre rituel, קדשׁ signifie mettre à part comme saint. « Consacrer » exprime clairement cette destination sacrée.
- source_word: וְהָיָה
  choice: sera
  rationale: Le verbe indique l’état résultant de l’onction et de la consécration. Le futur français convient à la suite d’instructions.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: très saint
  rationale: La construction hébraïque exprime le degré suprême de sainteté. « Très saint » est naturel en français et évite de faire croire qu’il s’agit ici du lieu appelé le Saint des saints.
theological_decisions:
- issue: Traduction de la formule cultuelle קֹדֶשׁ קָדָשִׁים
  choice: très saint
  alternative: saint des saints
  rationale: La formule qualifie ici le statut de l’autel par un superlatif. « Très saint » préserve ce sens sans importer une référence spatiale au sanctuaire intérieur; la forme hébraïque littérale est néanmoins signalée en note.
translation_notes:
  register: Français moderne, digne et direct. Le futur injonctif conserve la force des instructions. La répétition de « l’autel » est maintenue conformément à l’hébreu plutôt que remplacée par un pronom.
