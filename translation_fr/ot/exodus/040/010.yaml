revisions:
- from: Tu oindras l’autel de l’holocauste et tous ses ustensiles. Tu consacreras l’autel, et l’autel sera très saint[a].
  to: Tu oindras l’autel de l’offrande consumée par le feu et tous ses ustensiles. Tu consacreras l’autel, et l’autel sera très saint[a].
  rationale: La révision remplace un terme français désormais susceptible d’évoquer prioritairement un événement historique moderne par une expression qui explicite le sens sacrificiel de עֹלָה. Elle corrige également la glose littérale de la formule superlative hébraïque, tout en maintenant « très saint » dans le texte courant.
