  yaml_path: translation/ot/exodus/040/030.yaml
  text: He placed the basin between the tent of meeting and the altar[a], and put water there for washing.
translation:
  language: fr
  text: Il plaça la cuve entre la tente de la rencontre et l’autel, et il y mit de l’eau pour se laver.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Il plaça
  rationale: Le verbe שׂוּם signifie ici mettre ou installer quelque chose à un endroit déterminé. « plaça » convient naturellement à la mise en place de la cuve.
- source_word: הַכִּיֹּר
  choice: la cuve
  rationale: כִּיּוֹר désigne le grand récipient destiné aux ablutions dans le sanctuaire. « cuve » est clair, actuel et adapté à ses dimensions et à sa fonction.
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: entre la tente de la rencontre et l’autel
  rationale: « tente de la rencontre » rend directement אֹהֶל מוֹעֵד. La répétition hébraïque de בֵּין est exprimée selon l’usage naturel du français par « entre… et… ».
- source_word: וַיִּתֵּן
  choice: et il mit
  rationale: נָתַן prend ici le sens courant de mettre ou déposer. « mit » évite une répétition maladroite de « plaça ».
- source_word: שָׁמָּה
  choice: y
  rationale: L’adverbe signifie « là, à cet endroit ». Le pronom adverbial français « y » en conserve la valeur tout en renvoyant naturellement à la cuve.
- source_word: מַיִם
  choice: de l’eau
  rationale: מַיִם désigne simplement l’eau; le partitif est requis dans cette construction française.
- source_word: לְרָחְצָה
  choice: pour se laver
  rationale: L’infinitif de רָחַץ exprime le but. « pour se laver » est la formulation française naturelle sans préciser qui accomplit l’action, le sujet restant implicite comme en hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche de la structure hébraïque tout en étant idiomatique; elle n’explicite ni les prêtres comme sujets du lavage ni une fonction rituelle que ce verset ne nomme pas directement.
