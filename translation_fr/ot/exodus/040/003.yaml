  yaml_path: translation/ot/exodus/040/003.yaml
  text: And you shall place there the ark of the testimony[b][a], and you shall screen the ark with the curtain.
translation:
  language: fr
  text: Tu y placeras l’arche du témoignage[a], et tu placeras le rideau devant l’arche[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certaines traductions traditionnelles portent « l’arche de l’alliance » ; l’hébreu dit « l’arche du témoignage ».
    reason: alternative_reading
  - marker: b
    text: Ou « voile ». Le terme hébreu désigne le rideau intérieur du sanctuaire, qui faisait écran devant l’arche.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Tu y placeras
  rationale: Dans cette suite d’instructions, le qatal précédé de וְ a une valeur prescriptive. Le futur français exprime naturellement l’ordre donné à Moïse.
- source_word: שָׁם
  choice: y
  rationale: Le pronom adverbial renvoie naturellement au sanctuaire mentionné dans le contexte, sans l’expliciter davantage.
- source_word: אֲרוֹן הָעֵדוּת
  choice: l’arche du témoignage
  rationale: Cette traduction conserve עֵדוּת, « témoignage », plutôt que d’harmoniser avec la formule plus connue « arche de l’alliance ».
- source_word: וְסַכֹּתָ עַל הָאָרֹן
  choice: tu soustrairas l’arche aux regards
  rationale: Le verbe סכך signifie couvrir ou faire écran. Ici, le rideau forme une séparation devant l’arche plutôt qu’une couverture posée sur elle; cette formulation rend clairement sa fonction spatiale.
- source_word: הַפָּרֹכֶת
  choice: le rideau
  rationale: פָּרֹכֶת désigne le rideau intérieur du sanctuaire. « Rideau » est clair en français moderne; « voile » demeure une traduction traditionnelle possible.
theological_decisions:
- issue: Désignation de l’arche
  choice: l’arche du témoignage
  alternative: l’arche de l’alliance
  rationale: L’hébreu porte explicitement « témoignage ». La traduction préserve ce terme et évite d’introduire ici la désignation apparentée mais distincte « alliance ».
- issue: Traduction de פָּרֹכֶת
  choice: rideau
  alternative: voile
  rationale: « Rideau » est immédiatement compréhensible et décrit l’élément du sanctuaire; « voile », chargé d’échos bibliques traditionnels, est signalé en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur à valeur injonctive convient à la série d’ordres. La tournure « soustraire aux regards » évite de suggérer que le rideau était posé directement sur l’arche.
