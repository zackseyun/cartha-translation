  text: From it Moses and Aaron and his sons washed their hands and their feet[a].
translation:
  language: fr
  text: Moïse, Aaron et ses fils se lavèrent les mains et les pieds avec l’eau du bassin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en puisant dans le bassin » ; l’hébreu dit plus littéralement « de lui », c’est-à-dire du bassin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: se lavèrent
  rationale: Le wayyiqtol qal de רחץ présente ici une action passée dans la suite narrative. Le passé simple convient au registre narratif français et ne préjuge pas d’une valeur habituelle, exprimée dans le verset suivant.
- source_word: מִמֶּנּוּ
  choice: s’y
  rationale: Le pronom adverbial « y » renvoie naturellement au bassin déjà mentionné. Avec « se laver », le français idiomatique évite le calque peu naturel « se laver de lui », tout en conservant le renvoi au bassin; la nuance hébraïque de provenance est signalée en note.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: וְאַהֲרֹן
  choice: Aaron
  rationale: Forme française traditionnelle et courante; la coordination est rendue dans l’énumération française.
- source_word: וּבָנָיו
  choice: et ses fils
  rationale: Dans ce contexte sacerdotal, בנים désigne les fils d’Aaron. Le singulier possessif renvoie naturellement à Aaron, le nom immédiatement précédent.
- source_word: אֶת יְדֵיהֶם
  choice: les mains
  rationale: Dans la construction pronominale française « se laver », l’article défini est idiomatique pour les parties du corps et correspond au suffixe pluriel hébreu par le sujet collectif.
- source_word: וְאֶת רַגְלֵיהֶם
  choice: et les pieds
  rationale: Rend directement la seconde partie du couple corporel, avec l’article défini idiomatique après « se laver ».
