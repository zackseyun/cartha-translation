    issue: La note alternative « jusqu’au jour où il montait » emploie un imparfait peu exact et peu naturel dans cette expression.
    rationale: הֵעָלֹתוֹ signifie littéralement « sa montée / son élévation ». Si une clause finie est proposée en français, « où il se leva » rend mieux l’événement ponctuel visé par « le jour de sa montée ».
