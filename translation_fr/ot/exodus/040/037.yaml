  text: But if the cloud did not rise[a], they did not set out until the day it rose.
translation:
  language: fr
  text: Mais si le nuage ne se levait pas, ils ne partaient pas jusqu’au jour où il se levait.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « jusqu’au jour de sa montée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: La conjonction suivie de la particule conditionnelle introduit le cas opposé à celui du verset précédent; « Mais si » rend naturellement ce contraste.
- source_word: לֹא יֵעָלֶה הֶעָנָן
  choice: le nuage ne s’élevait pas
  rationale: L’imparfait français convient à une condition répétée dans le récit. « S’élever » exprime clairement le mouvement ascendant du nuage sans imposer une nuance passive.
- source_word: וְלֹא יִסְעוּ
  choice: ils ne partaient pas
  rationale: Dans le contexte des déplacements du camp, נסע désigne la mise en route; « partir » est courant, précis et naturel en français.
- source_word: עַד יוֹם
  choice: jusqu’au jour
  rationale: Cette formulation conserve explicitement יוֹם, « jour », au lieu de le généraliser en « moment ».
- source_word: הֵעָלֹתוֹ
  choice: où il s’élevait
  rationale: L’infinitif construit muni du suffixe masculin singulier signifie littéralement « son élévation » et renvoie au nuage. Une proposition relative temporelle est plus naturelle en français.
theological_decisions: []
