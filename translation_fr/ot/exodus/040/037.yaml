- from: Mais si le nuage ne s’élevait pas, ils ne partaient pas jusqu’au jour où il s’élevait.[a]
  to: Mais si le nuage ne se levait pas, ils ne partaient pas jusqu’au jour où il se levait.[a]
  rationale: La révision conserve la structure conditionnelle habituelle de l’hébreu et le repère explicite « jour ». « Se lever » est une expression française plus naturelle pour le mouvement ascendant d’un nuage. La note fournit l’équivalent nominal proche de l’infinitif construit avec suffixe (« sa montée »), sans l’alternative imparfaite ambiguë.
