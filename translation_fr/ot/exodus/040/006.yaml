  text: וְ/נָ֣תַתָּ֔ה אֵ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה לִ/פְנֵ֕י פֶּ֖תַח מִשְׁכַּ֥ן אֹֽהֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/006.yaml
  text: And you shall place the altar of burnt offering before the entrance of the tabernacle[a], the tent of meeting.
translation:
  language: fr
  text: Tu placeras l’autel de l’holocauste devant l’entrée du tabernacle, la tente de la rencontre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Tu placeras
  rationale: Dans cette instruction relative à la disposition des éléments du sanctuaire, נתן signifie naturellement « placer ». Le waw assure ici la continuité de la série d’ordres sans exiger un « et » en français.
- source_word: מִזְבַּח הָעֹלָה
  choice: l’autel de l’holocauste
  rationale: « Autel » est l’équivalent cultuel usuel de מִזְבֵּחַ, et « holocauste » rend עֹלָה, sacrifice entièrement consumé, dans une formulation française consacrée et concise.
- source_word: לִפְנֵי
  choice: devant
  rationale: 'Le terme indique ici une relation spatiale : l’autel doit être placé en face de l’entrée, à l’extérieur de la tente.'
- source_word: פֶּתַח
  choice: l’entrée
  rationale: פֶּתַח désigne l’ouverture donnant accès à la structure ; « entrée » est clair et naturel en français moderne.
- source_word: מִשְׁכַּן
  choice: du tabernacle
  rationale: « Tabernacle » est le terme technique français traditionnel pour la demeure-sanctuaire mobile décrite dans l’Exode.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette expression désigne la tente où Dieu rencontre Moïse et Israël. « Tente de la rencontre » conserve le sens relationnel de מוֹעֵד et distingue ce nom de la simple idée d’une tente destinée aux réunions humaines.
theological_decisions:
- issue: Relation entre « tabernacle » et « tente de la rencontre »
  choice: 'Conserver les deux désignations en apposition : « du tabernacle, la tente de la rencontre »'
  alternative: Fusionner les expressions ou comprendre « tente de la rencontre » comme un édifice distinct
  rationale: La syntaxe hébraïque juxtapose מִשְׁכַּן et אֹהֶל מוֹעֵד. L’apposition française préserve cette formulation sans imposer une distinction architecturale absente du verset.
translation_notes:
  register: Français moderne, sobre et dignifié. Le futur injonctif rend naturellement l’instruction hébraïque. La terminologie cultuelle établie (« autel », « holocauste », « tabernacle ») est conservée, tandis que « tente de la rencontre » explicite avec naturel la valeur de l’expression hébraïque.
