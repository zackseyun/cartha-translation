  yaml_path: translation/ot/exodus/040/024.yaml
  text: He placed the lampstand in the tent of meeting[a], opposite the table, on the south side of the tabernacle.
translation:
  language: fr
  text: Il plaça le porte-lampes dans la tente de la Rencontre, en face de la table[a], du côté sud du tabernacle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’opposé de la table ». Le terme hébreu נֹכַח peut indiquer une position en face ou à l’opposé de quelque chose.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Il plaça
  rationale: Le wayyiqtol de שׂים rapporte une action passée achevée. « Plaça » convient à la disposition ordonnée du mobilier sacré.
- source_word: הַמְּנֹרָה
  choice: le porte-lampes
  rationale: מְנוֹרָה désigne le support cultuel portant les lampes. « Porte-lampes » en exprime la fonction sans suggérer des bougies, comme pourrait le faire « chandelier ».
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: Cette expression désigne le sanctuaire comme lieu de rencontre. La formulation est claire, naturelle et cohérente avec le sens de מוֹעֵד dans ce syntagme.
- source_word: נֹכַח הַשֻּׁלְחָן
  choice: en face de la table
  rationale: נֹכַח indique ici une position vis-à-vis de la table, soit en face, soit à l'opposé.
- source_word: הַשֻּׁלְחָן
  choice: la table
  rationale: L'hébreu dit simplement « la table »; le contexte permet de l'identifier sans ajouter une précision absente du verset.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן נֶגְבָּה
  choice: du côté sud du tabernacle
  rationale: יֶרֶךְ désigne le côté ou le flanc, et נֶגְבָּה précise l'orientation vers le sud. La formulation française rend naturellement l'ensemble de l'indication spatiale.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: « Tabernacle » est le terme français établi pour cette demeure-sanctuaire dans le contexte de l'Exode.
