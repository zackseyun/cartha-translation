id: EXO.40.34
reference: Exodus 40:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְכַ֥ס הֶ/עָנָ֖ן אֶת אֹ֣הֶל מוֹעֵ֑ד וּ/כְב֣וֹד יְהוָ֔ה מָלֵ֖א אֶת הַ/מִּשְׁכָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/034.yaml
  text: Then the cloud covered the tent of meeting[a], and the glory of Yahweh filled the tabernacle.
translation:
  language: fr
  text: Alors la nuée couvrit la tente de la Rencontre, et la gloire de Yahvé[a] remplit la Demeure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte ici le nom divin YHWH, dont la vocalisation ancienne n’est pas connue avec certitude.
    reason: Signaler la forme hébraïque et l’incertitude réelle concernant sa prononciation, sans substituer silencieusement un titre au nom.
lexical_decisions:
- source_word: וַיְכַס
  choice: Alors … couvrit
  rationale: Le verbe כסה signifie couramment « couvrir ». Le passé simple fait progresser le récit, tandis que « Alors » rend l’enchaînement narratif marqué par le waw consécutif.
- source_word: הֶעָנָן
  choice: la nuée
  rationale: Le nom défini désigne la manifestation nuageuse déjà connue dans le récit de l’Exode. « Nuée » conserve cette référence précise et le registre digne du passage.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la Rencontre
  rationale: Cette formulation rend directement l’expression construite et indique la fonction de la tente comme lieu fixé pour la rencontre, sans paraphrase explicative.
- source_word: כְבוֹד יְהוָה
  choice: la gloire de Yahvé
  rationale: « Gloire » conserve l’idée de la manifestation éclatante et pleine de poids de la présence divine. Le nom propre est rendu comme tel plutôt que remplacé par un titre.
- source_word: מָלֵא
  choice: remplit
  rationale: 'Le verbe מלא est transitif ici : la gloire occupe entièrement la Demeure. « Remplit » restitue clairement cette construction et cette image.'
- source_word: הַמִּשְׁכָּן
  choice: la Demeure
  rationale: מִשְׁכָּן désigne ici le sanctuaire mobile d’Israël tout en étant dérivé de l’idée d’habitation. « La Demeure » est naturel en français biblique moderne, préserve ce lien lexical et évite l’ambiguïté moderne de « tabernacle ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom divin lui-même. La forme française « Yahvé » le présente comme un nom propre au lieu de lui substituer un titre, sans prétendre que sa vocalisation ancienne soit absolument certaine.
translation_notes:
  register: Français international actuel, sobre et digne. « Nuée », « tente de la Rencontre » et « Demeure » maintiennent le vocabulaire cultuel distinct du verset tout en restant intelligibles. Les majuscules à « Rencontre » et « Demeure » signalent des désignations précises du sanctuaire, non des noms communs génériques.
