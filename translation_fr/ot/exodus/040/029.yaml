base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/029.yaml
  text: And he set the altar of burnt offering at the entrance to the tabernacle of the tent of meeting, and offered on it the burnt offering and the grain offering, just as Yahweh had commanded Moses.
translation:
  language: fr
  text: Il plaça l’autel des holocaustes[a] à l’entrée de la Demeure de la tente de la rencontre, et il y offrit l’holocauste et l’offrande de céréales, exactement comme Yahweh l’avait ordonné à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, un holocauste est un sacrifice entièrement brûlé sur l’autel.
    reason: En français moderne, « holocauste » évoque souvent d’abord l’extermination des Juifs d’Europe; la note explicite son sens sacrificiel biblique.
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: l’autel des holocaustes
  rationale: Le groupe construit désigne l’autel par sa fonction sacrificielle principale. Cette formulation française consacrée reste concise et précise.
- source_word: שָׂם
  choice: plaça
  rationale: Dans ce contexte d’installation du sanctuaire, « plaça » rend naturellement l’action de mettre l’autel à l’endroit prescrit.
- source_word: פֶּתַח
  choice: à l’entrée de
  rationale: Le terme désigne l’ouverture ou l’entrée; cette tournure exprime clairement le rapport spatial.
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: la Demeure, la tente de la rencontre
  rationale: La formulation conserve les deux désignations du sanctuaire sans produire l’expression française peu naturelle « la Demeure de la tente ». La ponctuation laisse percevoir leur étroite association.
- source_word: וַיַּעַל עָלָיו
  choice: et il y offrit
  rationale: Dans un contexte sacrificiel, עלה signifie faire monter ou offrir un sacrifice. « Y offrit » est idiomatique et maintient l’autel comme lieu de l’action.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: Terme cultuel français traditionnel désignant ici une offrande entièrement consumée sur l’autel; une note prévient le sens moderne dominant du mot.
- source_word: הַמִּנְחָה
  choice: l’offrande de céréales
  rationale: Dans le contexte sacerdotal, מִנְחָה désigne l’offrande non animale préparée à partir de produits céréaliers. Ce choix est plus précis ici que le sens général de don ou tribut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu au lieu de le remplacer par un titre.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: exactement comme Yahweh l’avait ordonné à Moïse
  rationale: « Exactement comme » souligne la conformité de l’acte à l’ordre reçu, tandis que le plus-que-parfait marque naturellement l’antériorité de cet ordre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » en conserve la valeur de nom propre sans lui substituer un titre.
- issue: Sens sacrificiel de עֹלָה
  choice: holocauste, expliqué comme sacrifice entièrement brûlé
  alternative: offrande entièrement brûlée
  rationale: « Holocauste » conserve le terme cultuel reconnu en français biblique, tandis que la note en précise le sens ancien et évite de le confondre avec son emploi historique moderne.
translation_notes:
  register: Français international moderne, narratif et digne. « Demeure » porte une majuscule comme désignation cultuelle du sanctuaire. « Tente de la rencontre » reste intelligible tout en conservant le vocabulaire propre au récit sacerdotal.
