  text: And he placed the gold altar in the tent of meeting[a], before the veil.
translation:
  language: fr
  text: Il plaça l’autel d’or dans la tente de la rencontre, devant le voile[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le rideau ». Le terme hébreu désigne la tenture intérieure qui séparait les espaces du sanctuaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Il plaça
  rationale: Le wayyiqtol de שׂוּם exprime l’action suivante du récit au passé. « plaça » rend naturellement le positionnement précis du mobilier sacré.
- source_word: מִזְבַּח הַזָּהָב
  choice: l’autel d’or
  rationale: La construction hébraïque signifie littéralement « l’autel de l’or ». « L’autel d’or » est idiomatique en français et conserve la structure nominale de la source.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dans la tente de la rencontre
  rationale: אֹהֶל מוֹעֵד est la désignation habituelle du sanctuaire. « Tente de la rencontre » exprime clairement le lieu où Dieu rencontre son peuple, sans réduire מוֹעֵד à une simple réunion humaine.
- source_word: לִפְנֵי
  choice: devant
  rationale: La préposition indique ici la position spatiale de l’autel par rapport au voile. « Devant » est précis et naturel en français moderne.
- source_word: הַפָּרֹכֶת
  choice: le voile
  rationale: פָּרֹכֶת désigne la tenture intérieure qui sépare les espaces du sanctuaire. « Voile » est concis, précis dans ce contexte cultuel et conserve ses résonances intertextuelles.
theological_decisions:
- issue: Terminologie cultuelle de הַפָּרֹכֶת
  choice: le voile
  alternative: le rideau
  rationale: « Voile » maintient le sens concret de la tenture séparatrice ainsi que son poids dans les emplois bibliques ultérieurs, sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe brève suit la progression narrative de l’hébreu; la terminologie du sanctuaire demeure précise et accessible.
