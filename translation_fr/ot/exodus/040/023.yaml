  text: וַ/יַּעֲרֹ֥ךְ עָלָ֛י/ו עֵ֥רֶךְ לֶ֖חֶם לִ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/023.yaml
  text: And he arranged on it the bread in order before Yahweh[a], just as Yahweh had commanded Moses.
translation:
  language: fr
  text: Il y disposa les pains dans l’ordre[a] devant Yahweh, exactement comme Yahweh l’avait ordonné à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la disposition des pains » ; traditionnellement, « les pains de la Présence ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  choice: disposa
  rationale: Le verbe ערך signifie mettre en ordre ou disposer. « Disposa » convient naturellement au geste cultuel accompli sur la table.
- source_word: עָלָיו
  choice: y
  rationale: Le pronom renvoie à la table mentionnée au verset précédent. En français, « y » exprime naturellement « sur celle-ci » sans lourdeur.
- source_word: עֵרֶךְ לֶחֶם
  choice: les pains en bon ordre
  rationale: L’expression désigne littéralement une disposition ordonnée de pain. Cette formulation française garde l’idée concrète d’un ensemble de pains disposés selon l’ordre prescrit, sans lui substituer directement l’expression traditionnelle « pains de la Présence ».
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » rend l’expression cultuelle signifiant que les pains sont placés en présence de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: exactement comme Yahweh l’avait ordonné à Moïse
  rationale: « Exactement comme » souligne la conformité à l’instruction divine, tandis que le plus-que-parfait situe naturellement l’ordre avant son exécution.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » en conserve la fonction de nom propre sans le remplacer par un titre.
- issue: Désignation cultuelle des pains
  choice: les pains en bon ordre
  alternative: les pains de la Présence
  rationale: Le verset emploie עֵרֶךְ לֶחֶם, « disposition de pain », et non l’expression technique לֶחֶם הַפָּנִים. La traduction principale conserve cette distinction, tandis que la désignation traditionnelle figure en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste proche de la structure hébraïque tout en évitant un calque pesant ; « y disposa » renvoie naturellement à la table du contexte précédent.
