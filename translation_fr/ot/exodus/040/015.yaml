  text: וּ/מָשַׁחְתָּ֣ אֹתָ֗/ם כַּ/אֲשֶׁ֤ר מָשַׁ֨חְתָּ֙ אֶת אֲבִי/הֶ֔ם וְ/כִהֲנ֖וּ לִ֑/י וְ֠/הָיְתָה לִ/הְיֹ֨ת לָ/הֶ֧ם מָשְׁחָתָ֛/ם לִ/כְהֻנַּ֥ת עוֹלָ֖ם לְ/דֹרֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/015.yaml
  text: You shall anoint them just as you anointed their father[a], so that they may serve as priests to me. And their anointing shall be for them an everlasting priesthood throughout their generations.
translation:
  language: fr
  text: Tu les oindras comme tu as oint leur père, afin qu’ils exercent pour moi le sacerdoce. Leur onction leur conférera un sacerdoce perpétuel[a], de génération en génération.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un sacerdoce durable » ou « un sacerdoce pour toujours ». Le terme hébreu peut désigner une continuité durable de génération en génération dans le cadre de l’alliance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ אֹתָם
  choice: Tu leur donneras l’onction
  rationale: Le verbe hébreu signifie « oindre ». La tournure française « donner l’onction » exprime naturellement l’acte rituel dans une instruction adressée à Moïse, tandis que le futur rend la valeur directive de la forme verbale dans la séquence.
- source_word: כַּאֲשֶׁר מָשַׁחְתָּ אֶת אֲבִיהֶם
  choice: comme tu l’as donnée à leur père
  rationale: « Comme » maintient la comparaison explicite avec l’onction déjà donnée à Aaron, père des hommes concernés.
- source_word: וְכִהֲנוּ לִי
  choice: afin qu’ils me servent comme prêtres
  rationale: Le verbe כהן désigne l’exercice du service sacerdotal. Cette formulation française est claire et conserve le bénéficiaire divin exprimé par לִי, « pour moi/à mon service ».
- source_word: וְהָיְתָה לִהְיוֹת לָהֶם מָשְׁחָתָם
  choice: Leur onction leur conférera
  rationale: La formulation rend idiomatiquement la construction hébraïque qui présente l’onction comme établissant pour eux le statut sacerdotal, sans identifier מָשְׁחָתָם à l’huile elle-même.
- source_word: לִכְהֻנַּת עוֹלָם
  choice: un sacerdoce perpétuel
  rationale: כְּהֻנָּה désigne le sacerdoce ou la fonction sacerdotale. « Perpétuel » rend la continuité durable exprimée par עוֹלָם dans ce cadre légal et d’alliance, sans imposer une formulation philosophique abstraite.
- source_word: לְדֹרֹתָם
  choice: de génération en génération
  rationale: Cette expression française naturelle traduit la continuité du sacerdoce parmi les générations successives des descendants d’Aaron.
theological_decisions:
- issue: Portée temporelle de עוֹלָם dans le langage sacerdotal de l’alliance
  choice: un sacerdoce perpétuel
  alternative: un sacerdoce durable / un sacerdoce pour toujours
  rationale: Le terme עוֹלָם peut exprimer une continuité indéfinie ou durable dans le cadre de l’alliance. « Perpétuel » conserve la force de l’hébreu tout en laissant le contexte, notamment « de génération en génération », préciser la nature de cette durée.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond au discours direct de Dieu à Moïse. « Donner l’onction » et « sacerdoce » conservent le registre cultuel sans alourdir la phrase. Le marqueur de note est placé après « perpétuel », le terme auquel la note se rapporte.
