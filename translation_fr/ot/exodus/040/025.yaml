  text: וַ/יַּ֥עַל הַ/נֵּרֹ֖ת לִ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/025.yaml
  text: And he set up the lamps before Yahweh[a], just as Yahweh had commanded Moses.
translation:
  language: fr
  text: Il disposa les lampes devant Yahweh[a], comme Yahweh l’avait ordonné à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « fit monter les lampes » ; dans ce contexte, l’expression peut désigner leur mise en place ou leur allumage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: Il disposa
  rationale: Le hiphil de עלה signifie littéralement « faire monter ». Dans le contexte des lampes du sanctuaire, l’expression peut désigner leur mise en place ou leur allumage. « disposa » décrit naturellement l’action rituelle sans imposer une seule de ces nuances.
- source_word: הַנֵּרֹת
  choice: les lampes
  rationale: נֵרֹת désigne les lampes concrètes du porte-lampes, et non la lumière de manière abstraite.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: 'לִפְנֵי exprime ici une position spatiale à portée cultuelle : « devant », c’est-à-dire en présence de Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: La conjonction indique que l’acte accompli est conforme au commandement antérieur.
- source_word: צִוָּה
  choice: avait commandé
  rationale: Le plus-que-parfait marque naturellement l’antériorité du commandement par rapport à l’action racontée.
- source_word: אֶת מֹשֶׁה
  choice: à Moïse
  rationale: Bien que אֶת introduise grammaticalement Moïse comme objet direct du verbe hébreu, la construction française idiomatique avec le contenu du commandement sous-entendu est « l’avait commandé à Moïse ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte emploie directement le Tétragramme. « Yahweh » conserve le nom personnel et évite de lui substituer un titre.
- issue: Sens de l’action accomplie sur les lampes
  choice: disposa, avec une note signalant l’ambiguïté
  alternative: alluma
  rationale: Dans ce contexte cultuel, וַיַּעַל peut évoquer l’allumage des lampes, mais sa formulation littérale ne l’explicite pas sans ambiguïté. Le texte principal reste donc ouvert, tandis que la note informe le lecteur des deux possibilités.
translation_notes:
  register: Français international moderne, sobre et digne. « Disposa » convient au cadre rituel tout en restant accessible. La répétition de « Yahweh » suit volontairement celle du texte hébreu.
