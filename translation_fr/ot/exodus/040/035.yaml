id: EXO.40.35
reference: Exodus 40:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹא יָכֹ֣ל מֹשֶׁ֗ה לָ/בוֹא֙ אֶל אֹ֣הֶל מוֹעֵ֔ד כִּֽי שָׁכַ֥ן עָלָ֖י/ו הֶ/עָנָ֑ן וּ/כְב֣וֹד יְהוָ֔ה מָלֵ֖א אֶת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/035.yaml
  text: And Moses was not able to enter the tent of meeting[a], because the cloud settled on it, and the glory of Yahweh filled the tabernacle.
translation:
  language: fr
  text: Et Moïse ne pouvait pas entrer dans la tente de la rencontre, parce que la nuée reposait sur elle[a] et que la gloire de Yahweh remplissait le tabernacle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « demeurait sur elle » ou « s’était posée sur elle ». Le verbe hébreu peut exprimer l’idée de demeurer, de s’établir ou de se poser.
    reason: Alternative lexicale permettant de préserver l’étendue de sens de שָׁכַן.
lexical_decisions:
- source_word: וְלֹא יָכֹל
  choice: Et Moïse ne pouvait pas
  rationale: La coordination hébraïque poursuit simplement le récit, et יָכֹל exprime ici l’incapacité. « Ne pouvait pas » est naturel et fidèle en français moderne.
- source_word: לָבוֹא אֶל
  choice: entrer dans
  rationale: Dans le contexte de l’accès à une structure, cette formulation rend clairement et idiomatiquement le mouvement vers l’intérieur.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette expression conserve le sens du lieu où a lieu la rencontre, sans transformer la désignation en nom propre.
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit la cause de l’impossibilité pour Moïse d’entrer.
- source_word: שָׁכַן עָלָיו
  choice: reposait sur elle
  rationale: Le verbe décrit la nuée établie sur la tente. « Reposait » rend naturellement cet état tout en laissant ouverte la nuance de demeure ou d’installation.
- source_word: הֶעָנָן
  choice: la nuée
  rationale: « Nuée » est un terme français courant dans le registre biblique pour le nuage associé à la manifestation divine; l’article défini est conservé.
- source_word: כְבוֹד יְהוָה
  choice: la gloire de Yahweh
  rationale: La relation construite est rendue directement, et כָּבוֹד garde son poids théologique sans paraphrase.
- source_word: מָלֵא
  choice: remplissait
  rationale: L’imparfait français présente naturellement l’état qui explique pourquoi Moïse ne pouvait entrer, sans imposer une antériorité absente de l’hébreu.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: « Tabernacle » est la désignation française établie du sanctuaire transportable dans l’Exode.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom personnel révélé à Israël plutôt que de lui substituer un titre.
- issue: Portée théologique du verbe שָׁכַן
  choice: reposait sur elle
  alternative: demeurait sur elle; s’était posée sur elle
  rationale: Le contexte immédiat décrit concrètement la nuée établie sur la tente. La traduction principale ne réduit toutefois pas le verbe à un mouvement ponctuel et la note préserve ses autres nuances possibles.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe causale demeure proche de l’hébreu, tandis que l’imparfait rend naturellement les états simultanés du récit. Le marqueur de note est placé immédiatement après l’expression qu’il précise.
