    text: 'Ou : « afin qu’il exerce pour moi les fonctions de prêtre ». Le verbe hébreu signifie exercer la fonction ou le service de prêtre.'
    reason: Alternative syntaxique possible pour la proposition finale et précision lexicale sur le verbe hébreu.
  revision_rationale: La révision rétablit le verbe direct « oindre » pour l’onction rituelle, améliore l’idiomaticité de l’expression française de la fonction sacerdotale et place l’appel de note sur la proposition qu’il éclaire. Elle conserve la coordination de l’hébreu, sans trancher dans le texte entre une simple succession et une nuance de résultat ou de but.
