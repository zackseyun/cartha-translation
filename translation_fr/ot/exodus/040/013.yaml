  text: וְ/הִלְבַּשְׁתָּ֙ אֶֽת אַהֲרֹ֔ן אֵ֖ת בִּגְדֵ֣י הַ/קֹּ֑דֶשׁ וּ/מָשַׁחְתָּ֥ אֹת֛/וֹ וְ/קִדַּשְׁתָּ֥ אֹת֖/וֹ וְ/כִהֵ֥ן לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/013.yaml
  text: And you shall clothe Aaron with the holy garments[a], and you shall anoint him and consecrate him, and he shall serve as priest to me.
translation:
  language: fr
  text: Tu revêtiras Aaron des vêtements sacrés, tu l’oindras et tu le consacreras, et il exercera pour moi les fonctions de prêtre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin qu’il exerce pour moi les fonctions de prêtre ». Le verbe hébreu signifie exercer la fonction ou le service de prêtre.'
    reason: Alternative syntaxique possible pour la proposition finale et précision lexicale sur le verbe hébreu.
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ
  choice: Tu revêtiras
  rationale: 'Le hiphil de לבשׁ est causatif : Moïse doit mettre les vêtements à Aaron. « Revêtir quelqu’un de vêtements » convient au registre digne d’une investiture sacerdotale.'
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: des vêtements sacrés
  rationale: Le construit signifie littéralement « vêtements de sainteté ». « Vêtements sacrés » est naturel en français moderne et exprime leur mise à part pour le culte.
- source_word: וּמָשַׁחְתָּ
  choice: tu lui donneras l’onction
  rationale: משׁח désigne ici l’acte rituel d’oindre Aaron. Cette formulation française conserve le sens cultuel et évite l’ambiguïté moderne possible de « tu l’oindras ».
- source_word: וְקִדַּשְׁתָּ
  choice: tu le consacreras
  rationale: Le piel de קדשׁ signifie ici mettre à part pour le service sacré. « Consacrer » rend clairement cette fonction sans confondre l’acte avec l’onction.
- source_word: וְכִהֵן
  choice: et il exercera le ministère de prêtre
  rationale: Le verbe כהן signifie exercer la fonction ou le service sacerdotal. La coordination conserve directement la suite verbale hébraïque sans imposer une relation explicite de but.
- source_word: לִי
  choice: pour moi
  rationale: La préposition indique que le service sacerdotal est rendu à Dieu. « Pour moi » est idiomatique en français et garde cette relation personnelle.
theological_decisions:
- issue: Langage de l’installation sacerdotale
  choice: Maintenir comme actes distincts l’habillement, l’onction et la consécration.
  alternative: Résumer l’ensemble par « tu l’ordonneras » ou une formule analogue.
  rationale: L’hébreu énumère plusieurs actes rituels liés mais distincts. Les préserver évite d’importer des catégories ecclésiastiques postérieures.
- issue: Valeur de וְכִהֵן לִי
  choice: 'Coordination : « et il exercera pour moi le ministère de prêtre »'
  alternative: 'But ou résultat explicite : « afin qu’il exerce pour moi le ministère de prêtre »'
  rationale: Après les verbes à la deuxième personne, le passage à la troisième personne présente l’exercice sacerdotal qui suit l’installation. La simple coordination préserve l’ambiguïté entre succession et résultat sans ajouter un marqueur final absent de l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur prescriptif rend la série verbale hébraïque. « Ministère de prêtre » exprime une fonction cultuelle sans importer une terminologie confessionnelle particulière.
