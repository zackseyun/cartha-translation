revisions:
- from: Tu revêtiras Aaron des vêtements sacrés, tu lui donneras l’onction et tu le consacreras, et il exercera pour moi le ministère de prêtre.[a]
  to: Tu revêtiras Aaron des vêtements sacrés, tu l’oindras et tu le consacreras, et il exercera pour moi les fonctions de prêtre[a].
  rationale: La révision rétablit le verbe direct « oindre » pour l’onction rituelle, améliore l’idiomaticité de l’expression française de la fonction sacerdotale et place l’appel de note sur la proposition qu’il éclaire. Elle conserve la coordination de l’hébreu, sans trancher dans le texte entre une simple succession et une nuance de résultat ou de but.
