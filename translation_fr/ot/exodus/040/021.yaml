base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/021.yaml
  text: He brought the ark into the tabernacle[a], set up the veil of the screen, and screened the ark of the testimony[b], just as Yahweh had commanded Moses.
translation:
  language: fr
  text: Il fit entrer l’arche dans le tabernacle, mit en place le voile-écran[a] et dissimula ainsi l’arche du témoignage[b], comme Yahweh l’avait ordonné à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le rideau de séparation » ou « le voile de l’écran ». L’hébreu associe le terme désignant le voile intérieur à celui qui souligne sa fonction d’écran.
    reason: lexical_alternative
  - marker: b
    text: Ou « couvrit l’arche du témoignage » ou « la mit à l’abri des regards ». Le verbe hébreu évoque le fait de couvrir ou de soustraire à la vue au moyen du voile.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Il fit entrer
  rationale: Le hifil de בוא exprime ici l’action de faire entrer l’arche; cette formulation française conserve la valeur causative.
- source_word: הָאָרֹן
  choice: l’arche
  rationale: Dans ce contexte cultuel, אָרוֹן désigne l’arche sacrée, et non un simple coffre.
- source_word: הַמִּשְׁכָּן
  choice: le sanctuaire
  rationale: מִשְׁכָּן désigne ici la demeure cultuelle mobile. « Sanctuaire » est naturel en français et convient au référent, tandis que « tabernacle » reste une possibilité plus traditionnelle.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: le voile qui servait d’écran
  rationale: La formulation rend à la fois פָּרֹכֶת, le voile intérieur, et מָסָךְ, sa fonction de séparation et de dissimulation.
- source_word: וַיָּשֶׂם
  choice: mit en place
  rationale: Dans le contexte de l’installation du sanctuaire, cette expression rend naturellement l’idée de poser l’élément à l’endroit prévu.
- source_word: וַיָּסֶךְ עַל
  choice: cacha ainsi
  rationale: Le verbe exprime l’action de couvrir ou de soustraire à la vue au moyen du voile. « Ainsi » explicite sans surcharge le lien instrumental avec le voile précédemment installé.
- source_word: אֲרוֹן הָעֵדוּת
  choice: l’arche du témoignage
  rationale: Cette désignation traditionnelle reste proche de l’hébreu et préserve la portée de עֵדוּת sans l’expliciter comme « tables » ou « document de l’alliance ».
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: exactement comme Yahweh l’avait ordonné à Moïse
  rationale: La formule souligne la conformité précise de l’action de Moïse au commandement divin; le plus-que-parfait convient au rapport temporel en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » en préserve le statut de nom propre sans substituer un titre.
- issue: Sens de עֵדוּת dans אֲרוֹן הָעֵדוּת
  choice: témoignage
  alternative: document de l’alliance; charte de l’alliance
  rationale: « Témoignage » conserve le terme hébreu et son amplitude théologique sans identifier plus précisément son contenu dans le corps du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit la succession narrative de l’hébreu sans lourdeur. « Voile qui servait d’écran » conserve les deux composantes de l’expression hébraïque, et « cacha ainsi » évite en français la répétition artificielle de la même racine tout en maintenant le rapport fonctionnel.
