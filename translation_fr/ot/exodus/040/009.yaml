  text: וְ/לָקַחְתָּ֙ אֶת שֶׁ֣מֶן הַ/מִּשְׁחָ֔ה וּ/מָשַׁחְתָּ֥ אֶת הַ/מִּשְׁכָּ֖ן וְ/אֶת כָּל אֲשֶׁר בּ֑/וֹ וְ/קִדַּשְׁתָּ֥ אֹת֛/וֹ וְ/אֶת כָּל כֵּלָ֖י/ו וְ/הָ֥יָה קֹֽדֶשׁ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/009.yaml
  text: Then you shall take the anointing oil and anoint the tabernacle and all that is in it[a], and you shall consecrate it and all its furnishings[b], and it shall be holy.
translation:
  language: fr
  text: Tu prendras alors l’huile d’onction et tu oindras le tabernacle ainsi que tout ce qu’il contient. Tu le consacreras, ainsi que tout son équipement, et il sera saint.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit « saint », et non « très saint ».
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Tu prendras ensuite
  rationale: Dans cette suite d’instructions, le parfait précédé de וְ a une valeur directive. « Ensuite » marque naturellement l’ordre des opérations.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: l’huile d’onction
  rationale: Cette expression consacrée en français rend naturellement le syntagme construit et conserve sa portée cultuelle.
- source_word: וּמָשַׁחְתָּ
  choice: tu en oindras
  rationale: Le verbe משׁח désigne ici l’application rituelle d’huile. Le pronom « en » explicite en français que l’on oint avec l’huile qui vient d’être mentionnée, sans ajouter d’information étrangère au contexte.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: Terme français établi et précis pour le sanctuaire mobile du désert.
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: tout ce qu’il contient
  rationale: Formulation française claire et complète pour désigner tout ce qui se trouve dans le tabernacle.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: Tu le consacreras
  rationale: Au piel, קדשׁ signifie ici mettre à part comme saint. « Consacrer » exprime cette destination cultuelle dans un français actuel et digne.
- source_word: וְאֶת כָּל כֵּלָיו
  choice: avec tout son équipement
  rationale: כֵּלִים est un terme large qui englobe les objets et instruments du tabernacle. « Équipement » évite de le restreindre au mobilier ou aux ustensiles.
- source_word: וְהָיָה קֹדֶשׁ
  choice: et il sera saint
  rationale: La proposition exprime le statut qui résulte de la consécration. Le texte porte simplement קֹדֶשׁ, « saint », sans superlatif.
theological_decisions:
- issue: Degré de sainteté attribué au tabernacle après sa consécration
  choice: il sera saint
  alternative: il sera très saint
  rationale: L’hébreu dit קֹדֶשׁ (« saint »), non קֹדֶשׁ קָדָשִׁים (« très saint » ou « très sacré »). La traduction n’intensifie donc pas l’affirmation sous l’influence de passages voisins ou de la tradition.
translation_notes:
  register: Français international moderne, direct et digne. Le futur garde la force prescriptive de la séquence. « Tabernacle », « huile d’onction » et « consacrer » maintiennent la précision cultuelle sans archaïsme excessif.
