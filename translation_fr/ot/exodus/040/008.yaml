  text: וְ/שַׂמְתָּ֥ אֶת הֶ/חָצֵ֖ר סָבִ֑יב וְ/נָ֣תַתָּ֔ אֶת מָסַ֖ךְ שַׁ֥עַר הֶ/חָצֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/008.yaml
  text: And you shall set up the courtyard all around[a], and put up the screen for the gate of the courtyard.
translation:
  language: fr
  text: Tu installeras l’enceinte tout autour et tu mettras en place le rideau de l’entrée de l’enceinte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Tu installeras
  rationale: Le verbe שׂים signifie largement « mettre, placer ». Dans le contexte du montage du sanctuaire, « installer » exprime naturellement la mise en place de l’enceinte.
- source_word: הֶחָצֵר
  choice: l’enceinte
  rationale: חָצֵר désigne ici l’espace extérieur délimité autour du sanctuaire. « Enceinte » rend à la fois l’espace et sa délimitation, sans suggérer nécessairement une cour entourée de bâtiments.
- source_word: סָבִיב
  choice: tout autour
  rationale: L’adverbe indique que l’enceinte entoure le sanctuaire de tous côtés.
- source_word: וְנָתַתָּ
  choice: et tu mettras en place
  rationale: נתן a le sens général de « donner, mettre, placer » ; ici, il s’agit de poser à son emplacement une tenture d’entrée.
- source_word: מָסַךְ
  choice: le rideau
  rationale: Dans les descriptions du sanctuaire, מָסָךְ désigne une tenture qui ferme ou masque une entrée. « Rideau » est concret et naturel en français moderne.
- source_word: שַׁעַר
  choice: de l’entrée
  rationale: Bien que שַׁעַר puisse se traduire par « porte », l’ouverture est ici fermée par une tenture plutôt que par un battant ; « entrée » évite une image matérielle trompeuse.
- source_word: הֶחָצֵר
  choice: de l’enceinte
  rationale: Dans la chaîne שַׁעַר הֶחָצֵר, le second nom précise que l’entrée appartient à l’enceinte du sanctuaire.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le futur à valeur injonctive conserve la forme des instructions divines. La répétition d’« enceinte » reflète celle de חָצֵר et maintient la précision référentielle.
