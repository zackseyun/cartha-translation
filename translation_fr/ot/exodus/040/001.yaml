lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Alors … parla
  rationale: Le wayyiqtol fait progresser le récit. « Alors » en rend la succession narrative, tandis que « parla » convient à la formule qui introduit une parole divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin conserve ici le nom propre présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֶל מֹשֶׁה
  choice: à Moïse
  rationale: Cette tournure française naturelle rend le destinataire de la parole.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Dans cette formule d’introduction, l’infinitif hébreu annonce les paroles qui suivent. En français moderne, les deux-points remplissent naturellement cette fonction sans l’expression lourde « en disant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: YHWH ; le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » le représente directement tout en évitant de remplacer silencieusement le nom par un titre ; une note signale la forme hébraïque et les autres usages.
translation_notes:
  register: Français international moderne, sobre et digne. Les deux-points rendent idiomatiquement la formule hébraïque לֵאמֹר et ouvrent directement le discours du verset suivant.
