  text: And he burned fragrant incense on it[a], just as Yahweh had commanded Moses.
translation:
  language: fr
  text: Il y fit brûler de l’encens aromatique[a], comme Yahvé l’avait ordonné à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’encens fait d’épices » ou « de l’encens parfumé » ; l’expression hébraïque désigne un encens composé de substances aromatiques.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְטֵר
  choice: fit brûler
  rationale: Le hifil de קטר exprime ici l’action de faire brûler une substance cultuelle pour que sa fumée s’élève. « Fit brûler » rend cette valeur causative dans un français naturel.
- source_word: עָלָיו
  choice: y
  rationale: Le pronom renvoie à l’autel de l’encens mentionné dans le contexte. L’adverbe « y » évite une formulation lourde tout en conservant clairement le rapport locatif.
- source_word: קְטֹרֶת סַמִּים
  choice: de l’encens aromatique
  rationale: La combinaison désigne un encens composé de substances odoriférantes. « Encens aromatique » est idiomatique et laisse en note les variantes lexicales possibles.
- source_word: כַּאֲשֶׁר
  choice: exactement comme
  rationale: Cette locution souligne que l’acte accompli correspond au commandement reçu.
- source_word: צִוָּה
  choice: avait ordonné
  rationale: Le plus-que-parfait situe naturellement le commandement avant son exécution; « ordonner » convient au contexte d’un commandement divin.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin יהוה et préserve le nom propre plutôt que de lui substituer un titre.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et universellement reconnue du nom.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. Le rendre par le nom propre « Yahvé » préserve cette donnée du texte source sans lui substituer un titre.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « Il y fit brûler » conserve la valeur causative du verbe hébreu sans alourdir la phrase; « exactement comme » marque nettement la conformité au commandement antérieur.
