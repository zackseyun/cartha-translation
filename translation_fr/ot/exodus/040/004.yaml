  yaml_path: translation/ot/exodus/040/004.yaml
  text: Then you shall bring in the table and arrange what belongs on it[a], and you shall bring in the lampstand and set up its lamps.
translation:
  language: fr
  text: Tu feras entrer la table et tu y disposeras ce qui lui est destiné. Tu feras aussi entrer le porte-lampes et tu mettras ses lampes en place[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu allumeras ses lampes ». Le verbe hébreu signifie littéralement « faire monter » et peut évoquer la montée de la flamme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: tu apporteras à l’intérieur
  rationale: Le hiphil de בוא exprime ici l’introduction du mobilier dans la demeure. « Apporter à l’intérieur » rend explicitement le mouvement impliqué, dans un français naturel.
- source_word: הַשֻּׁלְחָן
  choice: la table
  rationale: Le nom signifie simplement « table ». Son usage cultuel précis est connu par le contexte, mais il n’est pas explicité dans ce verset.
- source_word: וְעָרַכְתָּ אֶת עֶרְכּוֹ
  choice: tu y disposeras ce qui lui est destiné
  rationale: La construction associe le verbe ערך, « disposer, mettre en ordre », à un nom de même racine désignant l’agencement prescrit. Cette formulation française évite une répétition artificielle tout en conservant l’idée des éléments à disposer sur la table.
- source_word: הַמְּנֹרָה
  choice: le porte-lampes
  rationale: מְנוֹרָה désigne ici le support portant les lampes du sanctuaire. « Porte-lampes » traduit le sens du nom commun sans recourir à la translittération « menorah ».
- source_word: וְהַעֲלֵיתָ
  choice: tu mettras en place
  rationale: Le hiphil de עלה signifie littéralement « faire monter ». Avec des lampes, il peut évoquer soit leur installation, soit l’allumage qui fait monter leur flamme. Dans cette séquence consacrée à l’installation du mobilier, « mettre en place » convient au texte principal, tandis que l’autre possibilité est signalée en note.
- source_word: נֵרֹתֶיהָ
  choice: ses lampes
  rationale: נֵר désigne une lampe ou sa flamme. Ici, le possessif renvoie aux différentes lampes du porte-lampes.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le futur injonctif convient à la série d’instructions adressées à Moïse. La répétition de « tu apporteras » préserve la structure coordonnée de l’hébreu.
