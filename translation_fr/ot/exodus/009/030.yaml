id: EXO.9.30
reference: Exodus 9:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַתָּ֖ה וַ/עֲבָדֶ֑י/ךָ יָדַ֕עְתִּי כִּ֚י טֶ֣רֶם תִּֽירְא֔וּ/ן מִ/פְּנֵ֖י יְהוָ֥ה אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/030.yaml
  text: But as for you and your servants[b][a], I know that you do not yet fear Yahweh God.
translation:
  language: fr
  text: Mais toi et tes serviteurs, je sais que vous ne craignez pas encore Yahvé Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous ne craignez toujours pas Yahvé Dieu » ou « avant que vous craigniez Yahvé Dieu ». Le terme hébreu peut exprimer l'antériorité (« avant ») ou, dans ce contexte, le sens « pas encore ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mais toi
  rationale: La conjonction et le pronom indépendant mettent le destinataire en relief et marquent ici un contraste avec ce qui précède.
- source_word: וַעֲבָדֶיךָ
  choice: et tes serviteurs
  rationale: עֶבֶד peut désigner un serviteur, un esclave ou un haut fonctionnaire. Dans le cadre de la cour de Pharaon, « serviteurs » reste naturel tout en conservant l'étendue du terme hébreu.
- source_word: יָדַעְתִּי
  choice: je sais
  rationale: Le parfait exprime ici le constat assuré et présent de Moïse.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit le contenu de ce que Moïse sait.
- source_word: טֶרֶם
  choice: pas encore
  rationale: Avec l'imparfait qui suit, le terme indique naturellement que la crainte attendue n'est toujours pas présente, tout en gardant en note la possibilité temporelle « avant que ».
- source_word: תִּירְאוּן
  choice: vous ne craignez
  rationale: Le verbe ירא peut évoquer la peur, la crainte révérencielle ou les deux. « Craindre » préserve cette tension sans la réduire à la terreur ou au respect.
- source_word: מִפְּנֵי
  choice: craignez ... Yahvé Dieu
  rationale: Dans cette construction avec ירא, le français exprime naturellement la relation par un complément direct; traduire littéralement « devant la face de » serait lourd.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française courante du nom divin conserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le nom est apposé à Yahvé et complète la désignation divine.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR; Jéhovah
  rationale: « Yahvé » est la forme française courante qui représente directement le tétragramme et distingue le nom divin d'un titre.
- issue: Nuance de ירא à propos de Dieu
  choice: craindre
  alternative: redouter; révérer
  rationale: « Craindre » conserve l'ambivalence du terme entre peur devant le jugement et attitude de révérence, sans trancher artificiellement.
- issue: Valeur temporelle de טֶרֶם
  choice: pas encore
  alternative: toujours pas; avant que vous craigniez
  rationale: Dans le contexte, « pas encore » rend clairement l'absence persistante de crainte; la note signale l'autre analyse temporelle possible.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement singulier vise Pharaon, puis le pluriel « vous » englobe Pharaon et ses serviteurs. La formulation conserve la tension entre peur et révérence.
