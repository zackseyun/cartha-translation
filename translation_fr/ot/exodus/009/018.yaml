source:
  edition: WLC
  text: הִנְ/נִ֤י מַמְטִיר֙ כָּ/עֵ֣ת מָחָ֔ר בָּרָ֖ד כָּבֵ֣ד מְאֹ֑ד אֲשֶׁ֨ר לֹא הָיָ֤ה כָמֹ֨/הוּ֙ בְּ/מִצְרַ֔יִם לְ/מִן הַ/יּ֥וֹם הִוָּסְדָ֖/ה וְ/עַד עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/018.yaml
  text: Behold[a], about this time tomorrow I will rain down very heavy hail[b], such as has never been in Egypt from the day it was founded until now.
translation:
  language: fr
  text: Voici, demain vers cette heure-ci, je ferai tomber une très forte grêle, comme il n’y en a jamais eu en Égypte depuis le jour où elle a été fondée jusqu’à maintenant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: Voici
  rationale: Introduit avec solennité et insistance l’annonce divine; « Voici » conserve cette force déictique dans un registre digne et compréhensible.
- source_word: מַמְטִיר
  choice: je ferai tomber
  rationale: Le hiphil exprime l’action causative de Dieu. Avec « grêle », « faire tomber » est naturel en français tout en maintenant explicitement l’intervention divine.
- source_word: כָּעֵת מָחָר
  choice: demain vers cette heure-ci
  rationale: Le כְּ peut marquer ici l’approximation ou la comparaison temporelle; « vers cette heure-ci » préserve cette nuance sans imposer une précision absolue.
- source_word: בָּרָד
  choice: une grêle
  rationale: Équivalent météorologique direct et usuel en français.
- source_word: כָּבֵד מְאֹד
  choice: extrêmement violente
  rationale: Littéralement « très lourde »; appliqué à une averse de grêle, « extrêmement violente » restitue naturellement l’intensité exceptionnelle en français moderne.
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: comme il n’y en a jamais eu
  rationale: Rend clairement la comparaison sans précédent tout en conservant sa portée générale.
- source_word: בְּמִצְרַיִם
  choice: en Égypte
  rationale: Rendu locatif direct.
- source_word: לְמִן הַיּוֹם הִוָּסְדָה
  choice: depuis le jour où elle a été fondée
  rationale: Le niphal indique qu’il s’agit de l’établissement ou de la fondation de l’Égypte; le féminin « elle » reprend naturellement « l’Égypte ».
- source_word: וְעַד עָתָּה
  choice: jusqu’à maintenant
  rationale: Expression temporelle naturelle qui marque toute la période écoulée jusqu’au moment de l’annonce.
theological_decisions:
- issue: Action divine dans l’annonce du fléau
  choice: « je ferai tomber » attribue directement la venue de la grêle à Dieu.
  alternative: Une formulation impersonnelle telle que « une grêle tombera ».
  rationale: La forme verbale causative à la première personne attribue explicitement l’événement à l’action de Dieu; la traduction ne doit pas atténuer cette causalité.
translation_notes:
  register: Français international moderne, solennel sans archaïsme excessif. « Voici » garde la gravité de l’annonce; « extrêmement violente » est plus idiomatique que « très lourde » pour qualifier une grêle.
