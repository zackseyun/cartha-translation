source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁה נְטֵ֤ה אֶת יָֽדְ/ךָ֙ עַל הַ/שָּׁמַ֔יִם וִ/יהִ֥י בָרָ֖ד בְּ/כָל אֶ֣רֶץ מִצְרָ֑יִם עַל הָ/אָדָ֣ם וְ/עַל הַ/בְּהֵמָ֗ה וְ/עַ֛ל כָּל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/022.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky[b], so that hail may come over all the land of Egypt—on man and on beast and on every plant of the field in the land of Egypt.”
translation:
  language: fr
  text: 'Alors Yahweh dit à Moïse : « Étends ta main vers le ciel[a], et qu’il y ait de la grêle dans tout le pays d’Égypte, sur les êtres humains[b], sur les animaux et sur toute la végétation des champs dans le pays d’Égypte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les cieux ». Le mot hébreu peut désigner le ciel ou les cieux ; ici, il s’agit du ciel visible d’où vient la grêle.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie ici un nom singulier à valeur collective pour désigner les êtres humains en général, par contraste avec les animaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la valeur de nom propre du tétragramme.
- source_word: נְטֵה אֶת יָדְךָ
  choice: Étends ta main
  rationale: L’impératif de נטה exprime ici le geste consistant à tendre ou étendre la main; cette formulation est naturelle et fidèle en français.
- source_word: עַל הַשָּׁמַיִם
  choice: vers le ciel
  rationale: La préposition a ici une valeur directionnelle et שָׁמַיִם désigne le ciel visible d’où vient la grêle.
- source_word: וִיהִי בָרָד
  choice: et qu’il y ait de la grêle
  rationale: Cette tournure conserve la force volitive du verbe, sans réduire explicitement la proposition à une simple conséquence.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: dans tout le pays d’Égypte
  rationale: La formulation exprime clairement l’étendue complète visée par la grêle.
- source_word: הָאָדָם
  choice: les êtres humains
  rationale: Le singulier hébreu a une valeur collective et générique; le pluriel français transmet naturellement cette portée universelle en contraste avec les animaux.
- source_word: הַבְּהֵמָה
  choice: les animaux
  rationale: Le terme désigne les bêtes, particulièrement les animaux domestiques dans ce contexte; « animaux » reste clair sans le restreindre indûment au seul bétail.
- source_word: כָּל עֵשֶׂב הַשָּׂדֶה
  choice: toute plante des champs
  rationale: עֵשֶׂב couvre les plantes et la végétation; « plante » est moderne et suffisamment large, tandis que « des champs » exprime naturellement le domaine agricole.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération préserve le nom personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- issue: Portée générique de הָאָדָם
  choice: les êtres humains
  alternative: l’homme
  rationale: Le terme est formellement singulier mais collectif ici. « Les êtres humains » rend sans ambiguïté l’ensemble des personnes visées, tout en maintenant le contraste avec les animaux.
- issue: Force de וִיהִי
  choice: et qu’il y ait
  alternative: afin que la grêle tombe
  rationale: La tournure retenue préserve la nuance volitive ou jussive de l’hébreu et évite de trancher entre ordre coordonné et résultat recherché.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition finale de « dans le pays d’Égypte » est conservée parce qu’elle figure dans l’hébreu et souligne la portée du fléau. La structure coordonnée de la parole divine est maintenue sans lisser la nuance volitive.
