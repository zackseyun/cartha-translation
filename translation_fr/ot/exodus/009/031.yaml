base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/031.yaml
  text: And the flax and the barley were struck down[b][a], because the barley was in the ear and the flax was in bud.
translation:
  language: fr
  text: Le lin et l’orge furent abattus, car l’orge était en épis[a] et le lin en boutons[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en train de mûrir ».
    reason: lexical_alternative
  - marker: b
    text: Ou « en fleurs »; le terme hébreu désigne un stade avancé de croissance du lin.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפִּשְׁתָּה
  choice: le lin
  rationale: Le nom désigne le lin en tant que plante cultivée pour ses fibres; « le lin » est l’équivalent français direct et naturel dans ce contexte agricole.
- source_word: הַשְּׂעֹרָה
  choice: l’orge
  rationale: Le terme désigne directement l’orge, l’une des cultures atteintes par la grêle.
- source_word: נֻכָּתָה
  choice: furent abattus
  rationale: La forme passive de נכה décrit les cultures frappées et couchées ou détruites par la grêle. L’accord pluriel français convient au sujet composé « le lin et l’orge ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison pour laquelle ces cultures furent particulièrement atteintes; « car » exprime naturellement ce rapport explicatif.
- source_word: אָבִיב
  choice: en épis
  rationale: Le mot indique que l’orge avait atteint le stade où l’épi était formé, encore frais ou en maturation. « En épis » conserve l’image agricole sans préciser excessivement le degré de maturité.
- source_word: גִּבְעֹל
  choice: en boutons
  rationale: Le terme désigne un stade avancé de croissance du lin, probablement lorsque les boutons ou capsules se formaient. « En boutons » reste concret tout en préservant l’incertitude lexicale.
