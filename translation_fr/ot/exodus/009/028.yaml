language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַעְתִּ֨ירוּ֙ אֶל יְהוָ֔ה וְ/רַ֕ב מִֽ/הְיֹ֛ת קֹלֹ֥ת אֱלֹהִ֖ים וּ/בָרָ֑ד וַ/אֲשַׁלְּחָ֣ה אֶתְ/כֶ֔ם וְ/לֹ֥א תֹסִפ֖וּ/ן לַ/עֲמֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/028.yaml
  text: Pray to Yahweh[a], for there has been enough of God's thunder and hail. Then I will let you go, and you will stay no longer.
translation:
  language: fr
  text: 'Suppliez Yahweh : c’en est assez des tonnerres de Dieu[a] et de la grêle. Alors je vous laisserai partir, et vous ne resterez pas plus longtemps.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les voix de Dieu ». Dans cette tempête, ces « voix » désignent le tonnerre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעְתִּירוּ
  choice: Suppliez
  rationale: L’impératif pluriel à la forme hiphil exprime ici une prière instante adressée à Dieu. « Suppliez » rend mieux l’intensité de la demande que le simple « priez », tout en restant naturel en français actuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel du texte hébreu au lieu de le remplacer par un titre.
- source_word: וְרַב מִהְיֹת
  choice: c’en est assez
  rationale: Cette tournure idiomatique exprime la suffisance ou l’excès. « C’en est assez » communique naturellement la demande de Pharaon de voir cesser le fléau.
- source_word: קֹלֹת אֱלֹהִים
  choice: des tonnerres de Dieu
  rationale: קֹלֹת signifie littéralement « voix » ou « sons », mais, associé à la grêle dans cette tempête, il désigne les coups de tonnerre. Le pluriel « tonnerres » préserve la forme hébraïque et « de Dieu » maintient l’origine divine exprimée par le génitif.
- source_word: וּבָרָד
  choice: et de la grêle
  rationale: Traduction directe du nom בָּרָד, coordonné aux tonnerres.
- source_word: וַאֲשַׁלְּחָה אֶתְכֶם
  choice: Alors je vous laisserai partir
  rationale: Dans le récit de l’Exode, שׁלח avec le peuple pour objet signifie couramment le laisser partir ou le libérer. « Alors » rend naturellement la conséquence promise.
- source_word: וְלֹא תֹסִפוּן לַעֲמֹד
  choice: et vous ne resterez pas plus longtemps
  rationale: L’expression littérale « vous n’ajouterez pas à rester » signifie qu’ils ne continueront pas à demeurer sur place. La formulation choisie restitue cet idiome sans ajouter un lieu absent de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / Jéhovah
  rationale: Le choix préserve le nom personnel présent dans le texte source plutôt que de lui substituer un titre traditionnel.
- issue: Sens de קֹלֹת אֱלֹהִים
  choice: les tonnerres de Dieu
  alternative: les voix de Dieu
  rationale: Le sens littéral « voix de Dieu » demeure perceptible en note, mais le contexte météorologique de la grêle indique que ces « voix » sont des coups de tonnerre. Ce rendu conserve également l’affirmation de leur origine divine.
translation_notes:
  register: Français international actuel, digne et accessible. L’impératif « Suppliez » garde le caractère pressant de la requête de Pharaon. La ponctuation met en évidence le contenu de sa supplication, et la dernière proposition reste sobre afin de ne pas préciser un lieu que l’hébreu ne nomme pas.
