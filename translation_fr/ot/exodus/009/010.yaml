base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/010.yaml
  text: So they took soot from the kiln and stood before Pharaoh[a], and Moses threw it toward the sky[b], and it became boils with blisters breaking out on man and on beast.
translation:
  language: fr
  text: Ils prirent de la suie du four et se tinrent devant le pharaon. Moïse la lança vers le ciel, et il se produisit, chez les humains comme chez les animaux, des furoncles accompagnés de cloques qui apparaissaient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּיחַ
  choice: suie
  rationale: Le terme désigne une poudre fine et noire provenant d’un four, plutôt que des cendres au sens large.
- source_word: הַכִּבְשָׁן
  choice: le four
  rationale: כִּבְשָׁן désigne un four ou une fournaise; « four » est concret, naturel et convient à la production de suie.
- source_word: לִפְנֵי פַרְעֹה
  choice: devant le pharaon
  rationale: Cette expression idiomatique signifie qu’ils se tenaient en sa présence.
- source_word: וַיִּזְרֹק אֹתוֹ מֹשֶׁה
  choice: Moïse la lança
  rationale: Le pronom singulier reprend « suie », nom massif féminin en français, et le verbe conserve l’action simple du texte.
- source_word: הַשָּׁמָיְמָה
  choice: vers le ciel
  rationale: La terminaison directionnelle indique un mouvement vers le haut; cette formulation garde le sens spatial sans surcharge théologique.
- source_word: שְׁחִין
  choice: des furoncles
  rationale: Le mot désigne des lésions cutanées inflammatoires ou des furoncles; « furoncles » est clair dans le contexte de la plaie.
- source_word: אֲבַעְבֻּעֹת
  choice: en cloques
  rationale: Le nom renvoie à des cloques ou pustules associées aux furoncles; la formulation conserve cette composante distincte.
- source_word: פֹּרֵחַ
  choice: qui éclataient
  rationale: Le participe évoque une éruption active; « éclataient » rend naturellement l’apparition des cloques.
- source_word: בָּאָדָם
  choice: chez les humains
  rationale: אָדָם est ici un collectif générique opposé aux animaux; « les humains » exprime clairement l’ensemble des personnes sans restriction de sexe.
- source_word: וּבַבְּהֵמָה
  choice: comme chez les animaux
  rationale: בְּהֵמָה est un collectif désignant les bêtes ou animaux; cette tournure rend naturellement la paire humains-animaux.
theological_decisions:
- issue: Rendu de אָדָם dans l’opposition collective entre l’être humain et l’animal
  choice: les humains
  alternative: l’homme / les gens
  rationale: Dans ce contexte, le terme vise collectivement les êtres humains et non les seuls hommes de sexe masculin. « Les humains » préserve l’opposition avec les animaux en français moderne.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement réorganisée pour éviter l’ambiguïté possible de « elle devint des furoncles » en français, tout en conservant le rapport causal et les éléments médicaux du texte hébreu.
