revisions:
- from: Ils prirent donc de la suie du four et se tinrent devant le pharaon. Moïse la lança vers le ciel, et elle provoqua, chez les humains comme chez les animaux, des furoncles qui éclataient en cloques.
  to: Ils prirent de la suie du four et se tinrent devant le pharaon. Moïse la lança vers le ciel, et il se produisit, chez les humains comme chez les animaux, des furoncles accompagnés de cloques qui apparaissaient.
  rationale: La révision retire le connecteur ajouté et reformule l’éruption cutanée afin de préserver la distinction entre les furoncles et les cloques/pustules, ainsi que l’idée d’une apparition active. Aucun ajout de note n’est nécessaire.
