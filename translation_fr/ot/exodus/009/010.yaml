review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : la suie est prise au four, les hommes se tiennent devant le pharaon, Moïse la lance vers le ciel, et l’affection touche les humains et les animaux. Toutefois, « des furoncles qui éclataient en cloques » inverse ou fusionne indûment les deux éléments médicaux : l’hébreu distingue les furoncles de leurs cloques/pustules et décrit une éruption active.'
  naturalness: Le français est moderne et fluide. La formulation révisée conserve ce registre tout en présentant plus naturellement les furoncles et les cloques comme éléments associés de l’éruption.
  terminology: « Suie », « four », « pharaon », « ciel », « furoncles », « humains » et « animaux » sont des choix appropriés. « Chez les humains comme chez les animaux » rend clairement les collectifs hébreux opposés אדם et בהמה.
  issues:
  - severity: medium
    issue: « des furoncles qui éclataient en cloques »
    rationale: Cette tournure laisse entendre que les furoncles se transforment en cloques en éclatant. שְׁחִין et אֲבַעְבֻּעֹת désignent plutôt une éruption de furoncles avec des cloques/pustules ; le participe פֹּרֵחַ exprime leur surgissement.
  - severity: low
    issue: Ajout de « donc »
    rationale: Le connecteur n’est pas exprimé dans le texte source. Il n’altère guère le sens, mais son omission préserve plus strictement la simple progression narrative.
  revised_text: Ils prirent de la suie du four et se tinrent devant le pharaon. Moïse la lança vers le ciel, et il se produisit, chez les humains comme chez les animaux, des furoncles accompagnés de cloques qui apparaissaient.
