base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/019.yaml
  text: So now[a], send word and bring your livestock and everything you have in the field to safety. Every man and beast that is found in the field and is not gathered into the house—the hail will come down on them[b], and they will die.
translation:
  language: fr
  text: Maintenant donc, envoie vite mettre à l’abri ton bétail et tout ce qui t’appartient dans le champ. Toute personne et toute bête qui se trouveront dans le champ et ne seront pas recueillies dans la maison, la grêle s’abattra sur elles, et elles mourront.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Rend à la fois le lien logique introduit par וְ et l’immédiateté temporelle de עַתָּה dans un français naturel.
- source_word: שְׁלַח הָעֵז
  choice: envoie immédiatement mettre à l’abri
  rationale: שְׁלַח appelle l’envoi d’un ordre ou de serviteurs, tandis que הָעֵז exprime ici l’action urgente de mettre en sûreté. La formulation française conserve ces deux composantes sans calque obscur.
- source_word: מִקְנְךָ
  choice: ton bétail
  rationale: מִקְנֶה désigne les animaux domestiques possédés; « bétail » est l’équivalent français courant dans ce contexte.
- source_word: וְאֵת כָּל אֲשֶׁר לְךָ בַּשָּׂדֶה
  choice: et tout ce qui t’appartient dans les champs
  rationale: La formule englobe les personnes, animaux ou biens appartenant au destinataire et se trouvant dehors. Le pluriel français « les champs » évoque naturellement les espaces extérieurs agricoles.
- source_word: כָּל הָאָדָם וְהַבְּהֵמָה
  choice: Toute personne et toute bête
  rationale: אָדָם est ici générique et distributif; « toute personne » le rend sans limiter l’avertissement aux hommes de sexe masculin. La répétition de « toute » clarifie en français que la portée distributive s’étend aussi aux animaux.
- source_word: אֲשֶׁר יִמָּצֵא בַשָּׂדֶה
  choice: qui se trouveront dans les champs
  rationale: Le niphal de מצא décrit ceux qui seront trouvés ou présents dehors; « se trouveront » conserve ce sens avec une tournure française naturelle.
- source_word: וְלֹא יֵאָסֵף הַבַּיְתָה
  choice: et n’auront pas été mises à l’abri dans une maison
  rationale: Le niphal de אסף est passif et signifie être recueilli ou rentré. Le contexte indique que l’entrée dans la maison vise la protection; « mises à l’abri » explicite cette finalité sans modifier le contraste spatial.
- source_word: וְיָרַד עֲלֵהֶם הַבָּרָד
  choice: la grêle s’abattra sur elles
  rationale: Cette expression idiomatique conserve le mouvement descendant de ירד et la violence de la grêle annoncée.
- source_word: וָמֵתוּ
  choice: et elles mourront
  rationale: Rend directement la conséquence future annoncée dans ce contexte.
theological_decisions:
- issue: Portée de אָדָם dans l’avertissement
  choice: Toute personne
  alternative: Tout homme
  rationale: אָדָם désigne ici collectivement tout être humain exposé dans les champs, sans contraste de sexe. « Toute personne » conserve exactement cette portée générique en français moderne.
- issue: Explicitation de la mise en sûreté
  choice: mettre à l’abri
  alternative: faire rentrer / rassembler dans la maison
  rationale: Le contexte immédiat établit que rassembler dans une maison protège de la grêle. La formulation choisie rend la force pragmatique du commandement tout en maintenant ensuite la mention explicite d’une maison.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le tutoiement correspond à l’adresse singulière du texte hébreu. La phrase conserve la solennité de l’avertissement sans archaïsmes; « bête » maintient le contraste biblique concis entre humains et animaux.
