  source_fidelity: 'Le sens est globalement fidèle : Yahweh établit un moment/temps fixé et annonce que, le lendemain, il fera « cette chose » dans le pays. Toutefois, « accomplira » interprète légèrement עָשָׂה (« faire ») comme l’exécution ou l’achèvement d’une annonce ; « fera » conserve mieux la simplicité et l’ouverture du verbe hébreu.'
