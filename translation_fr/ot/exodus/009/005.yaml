source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם יְהוָ֖ה מוֹעֵ֣ד לֵ/אמֹ֑ר מָחָ֗ר יַעֲשֶׂ֧ה יְהוָ֛ה הַ/דָּבָ֥ר הַ/זֶּ֖ה בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/005.yaml
  text: And Yahweh set a time[a], saying, “Tomorrow Yahweh will do this thing in the land.”
translation:
  language: fr
  text: 'Yahweh fixa un temps déterminé[a], en disant : « Demain, Yahweh fera cela dans le pays. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un moment fixé » ou « un temps fixé ».
    reason: Alternative lexicale pour מוֹעֵד, qui désigne un temps fixé ou assigné.
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: fixa
  rationale: Le verbe שׂוּם exprime ici l’établissement d’un moment déterminé. « Fixa » forme en français une expression naturelle avec « un moment ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: מוֹעֵד
  choice: un moment
  rationale: מוֹעֵד désigne ici un temps fixé ou convenu. « Un moment » reste naturel, tandis que la note signale le sens plus explicite de « moment fixé ».
- source_word: לֵאמֹר
  choice: en disant
  rationale: Cette tournure rend l’infinitif hébreu qui introduit le discours direct, tout en restant idiomatique dans un registre narratif digne.
- source_word: מָחָר
  choice: Demain
  rationale: L’adverbe indique directement le jour où l’annonce s’accomplira.
- source_word: יַעֲשֶׂה
  choice: accomplira
  rationale: עשה signifie largement « faire ». Dans ce contexte, « accomplira cela » est plus naturel en français que « fera cette chose », sans préciser davantage la nature de l’acte.
- source_word: הַדָּבָר הַזֶּה
  choice: cela
  rationale: דָּבָר peut signifier « chose », « affaire » ou « événement ». Le pronom « cela » renvoie naturellement, en français moderne, au fléau annoncé dans le contexte sans en réduire l’ambiguïté.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: אֶרֶץ désigne ici, selon le contexte, le pays d’Égypte. La traduction conserve toutefois la formulation non explicitée de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » en conserve la fonction de nom personnel sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient à la narration biblique écrite. La formulation évite le calque peu naturel « fera cette chose » tout en conservant la sobriété et la portée indéterminée de l’hébreu.
