source:
  edition: WLC
  text: הַ/יָּרֵא֙ אֶת דְּבַ֣ר יְהוָ֔ה מֵֽ/עַבְדֵ֖י פַּרְעֹ֑ה הֵנִ֛יס אֶת עֲבָדָ֥י/ו וְ/אֶת מִקְנֵ֖/הוּ אֶל הַ/בָּתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/020.yaml
  text: Whoever among Pharaoh’s servants feared the word of Yahweh hurried his servants and his livestock into the houses[a][b].
translation:
  language: fr
  text: Quiconque, parmi les serviteurs de Pharaon, craignait la parole de Yahweh fit vite rentrer ses serviteurs et son bétail dans les maisons.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fit fuir » ; c’est-à-dire qu’il les fit rapidement entrer sous abri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּרֵא
  choice: Quiconque ... craignait
  rationale: L’article suivi du participe substantivé désigne ici toute personne appartenant à la catégorie évoquée. « Quiconque » rend naturellement cette valeur générale tout en laissant entendre qu’il ne s’agissait que d’une partie des serviteurs de Pharaon.
- source_word: דְּבַר יְהוָה
  choice: la parole de Yahweh
  rationale: דָּבָר signifie « parole » ou « message ». « La parole de Yahweh » conserve l’expression biblique et n’en réduit pas le sens à un simple avertissement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre.
- source_word: מֵעַבְדֵי פַרְעֹה
  choice: parmi les serviteurs de Pharaon
  rationale: 'La préposition מִן a ici un sens partitif : la personne concernée appartient au groupe des serviteurs de Pharaon.'
- source_word: הֵנִיס
  choice: fit vite rentrer
  rationale: Le hiphil de נוּס signifie littéralement « faire fuir ». Dans ce contexte, il s’agit de faire entrer rapidement personnes et bétail sous abri avant la grêle. Cette formulation française exprime naturellement le mouvement urgent sans ajouter l’idée qu’ils étaient déjà attaqués.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: עֶבֶד peut désigner un esclave ou un serviteur. Ici, le statut social précis n’est pas mis en avant ; « serviteurs » convient au personnel placé sous l’autorité d’un serviteur de Pharaon.
- source_word: מִקְנֵהוּ
  choice: son bétail
  rationale: מִקְנֶה désigne collectivement les animaux domestiques possédés. « Bétail » conserve cette portée générale.
- source_word: אֶל הַבָּתִּים
  choice: dans les maisons
  rationale: La préposition indique ici un mouvement vers l’intérieur des lieux servant d’abri, et le pluriel de הַבָּתִּים est conservé.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le nom divin. « Yahweh » le représente comme nom propre au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « Quiconque, parmi… » préserve la valeur distributive du participe hébreu, tandis que « fit vite rentrer » rend idiomatiquement le causatif dans son contexte immédiat.
