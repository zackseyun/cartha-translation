  text: וְ/לֹֽא יָכְל֣וּ הַֽ/חַרְטֻמִּ֗ים לַ/עֲמֹ֛ד לִ/פְנֵ֥י מֹשֶׁ֖ה מִ/פְּנֵ֣י הַ/שְּׁחִ֑ין כִּֽי הָיָ֣ה הַ/שְּׁחִ֔ין בַּֽ/חֲרְטֻמִּ֖ם וּ/בְ/כָל מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/011.yaml
  text: And the magicians were not able to stand before Moses because of the boils[a], for the boils were on the magicians and on all the Egyptians.
translation:
  language: fr
  text: Les magiciens ne purent se tenir devant Moïse à cause des ulcères, car les ulcères étaient sur les magiciens et sur tous les Égyptiens[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « car les ulcères étaient sur les magiciens et dans toute l’Égypte ». Le contexte indique que l’affliction touchait les personnes dans tout le pays.'
    reason: La note signale la formulation géographique de l’hébreu et justifie l’explicitation du référent personnel dans la traduction.
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: les magiciens
  rationale: Dans le récit de l’Exode, le terme désigne les spécialistes rituels de la cour de Pharaon qui s’opposent à Moïse et à Aaron ou reproduisent certains de leurs signes. « Magiciens » est l’équivalent français courant et immédiatement compréhensible.
- source_word: לַעֲמֹד לִפְנֵי מֹשֶׁה
  choice: se tenir devant Moïse
  rationale: 'Cette formulation conserve l’image et l’ambiguïté naturelle de l’expression hébraïque : ils ne pouvaient ni rester en présence de Moïse ni se présenter devant lui.'
- source_word: מִפְּנֵי הַשְּׁחִין
  choice: à cause des ulcères
  rationale: מִפְּנֵי exprime ici la cause. Le singulier collectif שְׁחִין désigne une affection cutanée inflammatoire ; le pluriel français rend naturellement ses manifestations chez plusieurs personnes.
- source_word: הַשְּׁחִין
  choice: les ulcères
  rationale: Le même choix est repris pour préserver la répétition du texte hébreu. « Ulcères » reste assez large pour ne pas préciser abusivement la nature médicale exacte de l’affection.
- source_word: בַּחֲרְטֻמִּם
  choice: les magiciens en étaient atteints
  rationale: Cette tournure française exprime idiomatiquement que l’affection se trouvait sur leur corps, sens contextuel de la préposition ב.
- source_word: וּבְכָל מִצְרָיִם
  choice: comme les gens dans toute l’Égypte
  rationale: L’hébreu dit littéralement « et dans toute l’Égypte ». Le contexte implique les personnes atteintes à travers le pays ; « les gens » explicite sobrement ce référent sans limiter l’expression aux seuls Égyptiens de souche.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La répétition de « magiciens » et d’« ulcères » reflète celle de l’hébreu, tandis que la dernière proposition est légèrement explicitée pour être naturelle en français.
