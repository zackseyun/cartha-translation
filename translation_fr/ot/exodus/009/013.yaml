  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הַשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וְ/הִתְיַצֵּ֖ב לִ/פְנֵ֣י פַרְעֹ֑ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/013.yaml
  text: 'Then Yahweh said to Moses[a], “Rise early in the morning and present yourself before Pharaoh, and say to him, ‘Thus says Yahweh, the God of the Hebrews: Let my people go, so that they may serve me.’”'
translation:
  language: fr
  text: 'Puis Yahweh dit à Moïse : « Lève-toi de bon matin, présente-toi devant le pharaon et dis-lui : “Ainsi parle Yahweh, le Dieu des Hébreux : Laisse partir mon peuple afin qu’ils me servent[a].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin qu’ils m’adorent ». Le verbe hébreu peut désigner le service rendu à Dieu, y compris le culte.'
    reason: Alternative lexicale signalant la portée cultuelle possible de עבד sans réduire son sens plus large.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin, plutôt que remplacé par un titre.
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: Lève-toi de bon matin
  rationale: Cette expression française naturelle rend à la fois l’impératif de se lever tôt et la précision temporelle « le matin ».
- source_word: וְהִתְיַצֵּב לִפְנֵי
  choice: présente-toi devant
  rationale: Le hitpael de יצב exprime ici l’action de prendre position ou de se présenter devant quelqu’un; cette formulation convient au cadre officiel de la rencontre avec le pharaon.
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Cette formule française consacrée conserve la solennité de la formule hébraïque du messager sans l’alourdir.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: le Dieu des Hébreux
  rationale: Traduction directe et idiomatique de la chaîne construite hébraïque.
- source_word: שַׁלַּח אֶת עַמִּי
  choice: Laisse partir mon peuple
  rationale: Dans ce contexte, l’impératif de שלח demande au pharaon de permettre au peuple de partir; cette tournure est claire et naturelle en français.
- source_word: וְיַעַבְדֻנִי
  choice: afin qu’il me serve
  rationale: Le waw suivi de l’imparfait indique ici le but. « Servir » préserve le sens large de עבד, qui englobe le culte sans s’y limiter. Le singulier « il » reprend normalement le nom collectif français « mon peuple ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ou le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » conserve le nom personnel plutôt que de lui substituer un titre.
- issue: Portée de וְיַעַבְדֻנִי
  choice: afin qu’il me serve
  alternative: afin qu’il m’adore
  rationale: Le verbe עבד peut désigner le service rendu à Dieu, notamment le culte. « Servir » maintient cette portée plus large et laisse subsister la dimension cultuelle.
translation_notes:
  register: Français international moderne, clair et digne. La formule « Ainsi parle » garde la solennité du discours divin; « le pharaon » traite le terme comme un titre. La ponctuation distingue la parole de Yahweh adressée à Moïse du message que Moïse doit transmettre.
