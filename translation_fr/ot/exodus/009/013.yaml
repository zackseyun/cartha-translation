  to: 'Puis Yahweh dit à Moïse : « Lève-toi de bon matin, présente-toi devant le pharaon et dis-lui : “Ainsi parle Yahweh, le Dieu des Hébreux : Laisse partir mon peuple afin qu’ils me servent[a].” »'
