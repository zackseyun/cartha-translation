  text: וַ/יַּ֨ךְ הַ/בָּרָ֜ד בְּ/כָל אֶ֣רֶץ מִצְרַ֗יִם אֵ֚ת כָּל אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה וְ/אֵ֨ת כָּל עֵ֤שֶׂב הַ/שָּׂדֶה֙ הִכָּ֣ה הַ/בָּרָ֔ד וְ/אֶת כָּל עֵ֥ץ הַ/שָּׂדֶ֖ה שִׁבֵּֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/025.yaml
  text: And the hail struck throughout all the land of Egypt everything that was in the field[a], from man to beast. The hail struck every plant of the field, and shattered every tree of the field.
translation:
  language: fr
  text: La grêle frappa, dans tout le pays d’Égypte, tout ce qui était dans les champs, depuis les êtres humains jusqu’aux bêtes. La grêle frappa toutes les plantes des champs et brisa tous les arbres des champs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ / הִכָּה
  choice: frappa
  rationale: Le verbe נכה exprime ici l’action violente et destructrice de la grêle. « Frapper » est naturel, actuel et permet de conserver la répétition hébraïque.
- source_word: הַבָּרָד
  choice: la grêle
  rationale: Équivalent direct du phénomène météorologique; le nom est répété comme dans l’hébreu pour souligner l’agent du désastre.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: dans tout le pays d’Égypte
  rationale: Rend simplement l’étendue géographique totale indiquée par בְּכָל.
- source_word: אֵת כָּל אֲשֶׁר בַּשָּׂדֶה
  choice: tout ce qui était dans les champs
  rationale: Préserve la portée globale de כָּל אֲשֶׁר. Le pluriel français « les champs » désigne naturellement les espaces cultivés ou ouverts concernés.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: depuis les êtres humains jusqu’aux bêtes
  rationale: La formule est un mérisme englobant les personnes et les animaux. « Les êtres humains » rend ici אָדָם collectivement sans suggérer que seuls les hommes de sexe masculin sont visés; « bêtes » conserve la portée assez générale de בְּהֵמָה.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: toutes les plantes des champs
  rationale: עֵשֶׂב peut désigner l’herbe, les plantes ou la végétation. « Plantes » est clair et suffisamment large dans ce contexte agricole.
- source_word: עֵץ הַשָּׂדֶה
  choice: tous les arbres des champs
  rationale: Traduction directe qui maintient le parallélisme avec les plantes des champs.
- source_word: שִׁבֵּר
  choice: brisa
  rationale: Le piel de שׁבר indique une destruction énergique. « Brisa » exprime clairement les dégâts causés aux arbres sans exagérer jusqu’à une pulvérisation totale.
theological_decisions:
- issue: Portée de אָדָם dans l’expression מֵאָדָם וְעַד בְּהֵמָה
  choice: les êtres humains
  alternative: l’homme / les gens
  rationale: Dans cette expression de totalité, אָדָם désigne collectivement l’humanité présente dans les champs, en contraste avec les animaux. La traduction inclusive explicite cette portée référentielle sans modifier le mérisme.
translation_notes:
  register: Français moderne, international et digne. La répétition de « La grêle frappa » ainsi que le parallélisme « plantes des champs / arbres des champs » sont conservés afin de refléter la structure emphatique de l’hébreu. Aucun marqueur de note n’est requis puisqu’aucune note n’est ajoutée.
