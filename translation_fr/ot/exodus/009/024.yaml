  text: וַ/יְהִ֣י בָרָ֔ד וְ/אֵ֕שׁ מִתְלַקַּ֖חַת בְּ/ת֣וֹךְ הַ/בָּרָ֑ד כָּבֵ֣ד מְאֹ֔ד אֲ֠שֶׁר לֹֽא הָיָ֤ה כָמֹ֨/הוּ֙ בְּ/כָל אֶ֣רֶץ מִצְרַ֔יִם מֵ/אָ֖ז הָיְתָ֥ה לְ/גֽוֹי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/024.yaml
  text: There was hail[a], and fire flashing within the hail, very severe—such as had never been in all the land of Egypt since it became a nation.
translation:
  language: fr
  text: 'Il y eut de la grêle, et du feu flamboyait au milieu de la grêle[a]. La grêle était d’une extrême violence : il n’y en avait jamais eu de pareille dans tout le pays d’Égypte depuis que l’Égypte était devenue une nation.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et du feu jaillissait au milieu de la grêle » ; l’hébreu emploie littéralement le mot « feu », probablement pour décrire des lueurs semblables à des éclairs au cœur de l’orage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָרָד
  choice: Il y eut de la grêle
  rationale: La tournure existentielle rend naturellement l’introduction narrative de וַיְהִי, tandis que « grêle » est le sens météorologique courant de בָּרָד.
- source_word: וְאֵשׁ
  choice: et du feu
  rationale: Le texte hébreu dit littéralement « feu ». Cette image est conservée dans le texte principal plutôt que d’être explicitée directement par « éclairs ».
- source_word: מִתְלַקַּחַת
  choice: jaillissait
  rationale: Le participe hitpael décrit ici un feu qui se manifeste vivement et de façon répétée au cœur de l’orage. « Jaillissait » restitue cette image dynamique dans un français naturel.
- source_word: בְּתוֹךְ הַבָּרָד
  choice: au milieu de la grêle
  rationale: Cette formulation conserve le sens spatial de בְּתוֹךְ et l’image saisissante du feu apparaissant au sein même de la grêle.
- source_word: כָּבֵד מְאֹד
  choice: d’une extrême violence
  rationale: L’adjectif כָּבֵד s’accorde avec « grêle » en hébreu et exprime ici son intensité exceptionnelle. Une traduction littérale par « très lourde » serait moins idiomatique en français météorologique.
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: il n’y en avait jamais eu de pareille
  rationale: Cette formulation française naturelle préserve la comparaison absolue avec tout événement antérieur de même nature.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: dans tout le pays d’Égypte
  rationale: Rend directement l’étendue territoriale exprimée par le syntagme hébreu.
- source_word: מֵאָז הָיְתָה לְגוֹי
  choice: depuis que l’Égypte était devenue une nation
  rationale: La répétition explicite d’« Égypte » évite un pronom français ambigu et conserve le repère historique de l’accession au statut de nation.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase hébraïque a été divisée en deux pour éviter une modification ambiguë et pour rattacher explicitement l’extrême violence à la grêle, conformément à l’accord grammatical hébreu. L’image littérale du feu est maintenue, avec une explication météorologique prudente en note.
