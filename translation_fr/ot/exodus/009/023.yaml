source:
  edition: WLC
  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת מַטֵּ/הוּ֮ עַל הַ/שָּׁמַיִם֒ וַֽ/יהוָ֗ה נָתַ֤ן קֹלֹת֙ וּ/בָרָ֔ד וַ/תִּ֥הֲלַךְ אֵ֖שׁ אָ֑רְצָ/ה וַ/יַּמְטֵ֧ר יְהוָ֛ה בָּרָ֖ד עַל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/023.yaml
  text: So Moses stretched out his staff toward the sky[a], and Yahweh sent thunder and hail, and fire came down to the earth. And Yahweh rained hail on the land of Egypt.
translation:
  language: fr
  text: Moïse étendit son bâton vers le ciel, et Yahweh envoya le tonnerre et la grêle, et le feu se dirigea vers la terre[a]. Yahweh fit pleuvoir de la grêle sur le pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le feu alla vers la terre »; dans ce contexte, ce feu désigne probablement la foudre.'
    reason: Précision lexicale et maintien de l’image concrète du texte hébreu.
lexical_decisions:
- source_word: וַיֵּט
  choice: étendit
  rationale: Le verbe נָטָה exprime ici le geste d’étendre ou de tendre le bâton; « étendit » est naturel et précis en français.
- source_word: מַטֵּהוּ
  choice: son bâton
  rationale: מַטֶּה désigne le bâton tenu par Moïse; « bâton » est courant et évite la coloration archaïque de « verge ».
- source_word: עַל הַשָּׁמַיִם
  choice: vers le ciel
  rationale: Dans le contexte du geste de Moïse, la préposition indique l’orientation vers le haut; le singulier collectif « le ciel » est idiomatique en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: נָתַן קֹלֹת וּבָרָד
  choice: envoya le tonnerre et la grêle
  rationale: Littéralement « donna des voix/bruits et de la grêle »; dans un contexte d’orage, קֹלֹת désigne le tonnerre, et « envoya » exprime naturellement l’action causative en français.
- source_word: וַתִּהֲלַךְ אֵשׁ אָרְצָה
  choice: Le feu se dirigea vers la terre
  rationale: Cette formulation conserve « feu » et le mouvement vers la terre sans identifier explicitement le phénomène à la foudre ni atténuer l’image hébraïque.
- source_word: וַיַּמְטֵר
  choice: fit pleuvoir
  rationale: La forme causative du verbe מָטַר signifie « faire pleuvoir »; cette expression convient naturellement à la grêle comme complément.
- source_word: אֶרֶץ מִצְרָיִם
  choice: le pays d’Égypte
  rationale: « Pays d’Égypte » rend explicitement אֶרֶץ tout en restant naturel en français moderne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom personnel et ne le remplace pas par un titre.
- issue: Identification du feu dans l’orage
  choice: Conserver « le feu » dans le texte principal
  alternative: la foudre
  rationale: La foudre est probablement le phénomène évoqué, mais le mot hébreu signifie bien « feu ». Le rendu maintient donc l’image et l’ambiguïté du texte source.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la succession narrative de l’hébreu tout en évitant les tournures littérales peu naturelles. « Tonnerre » est au singulier collectif, usage idiomatique en français.
