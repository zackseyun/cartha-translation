  text: וַ/אֲשֶׁ֥ר לֹא שָׂ֛ם לִבּ֖/וֹ אֶל דְּבַ֣ר יְהוָ֑ה וַֽ/יַּעֲזֹ֛ב אֶת עֲבָדָ֥י/ו וְ/אֶת מִקְנֵ֖/הוּ בַּ/שָּׂדֶֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/021.yaml
  text: But whoever did not pay attention to the word of Yahweh left his servants and his livestock in the field[a].
translation:
  language: fr
  text: Mais celui qui ne prit pas à cœur la parole de Yahweh laissa ses serviteurs et son bétail dans les champs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « ne prêta pas attention à la parole de Yahweh ». Littéralement : « ne plaça pas son cœur vers la parole de Yahweh ».'
    reason: La note conserve à la fois le sens idiomatique possible et l’image littérale de l’hébreu.
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: Mais celui qui
  rationale: Le waw introduit ici un contraste avec ceux qui, au verset précédent, ont obéi à l’avertissement; « Mais celui qui » conserve aussi la valeur indéfinie du relatif.
- source_word: לֹא שָׂם לִבּוֹ אֶל
  choice: ne prit pas à cœur
  rationale: Cette tournure française naturelle reste proche de l’image hébraïque, littéralement « ne plaça pas son cœur vers », et exprime le fait de ne pas tenir sérieusement compte de l’avertissement.
- source_word: דְּבַר יְהוָה
  choice: la parole de Yahweh
  rationale: דָּבָר désigne ici l’avertissement prononcé par Yahweh; « parole » préserve l’expression biblique sans exclure le sens de message.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: וַיַּעֲזֹב
  choice: laissa
  rationale: Le verbe décrit concrètement le fait de laisser sur place les serviteurs et le bétail, exposés à la grêle annoncée.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Dans ce contexte domestique et agricole, « serviteurs » rend le rôle des personnes concernées sans préciser davantage leur statut social.
- source_word: מִקְנֵהוּ
  choice: son bétail
  rationale: Le nom collectif englobe les animaux domestiques possédés; « bétail » est idiomatique en français.
- source_word: בַּשָּׂדֶה
  choice: dans les champs
  rationale: Le singulier collectif hébreu désigne l’espace extérieur cultivé ou pastoral; le pluriel français est naturel dans ce contexte.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom personnel plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, sobre et narratif. « Prit à cœur » est courant, digne et plus proche de l’image hébraïque que la simple formulation « prêta attention ». Le passé simple convient au registre narratif biblique.
