  text: וְ/הָיָ֣ה לְ/אָבָ֔ק עַ֖ל כָּל אֶ֣רֶץ מִצְרָ֑יִם וְ/הָיָ֨ה עַל הָ/אָדָ֜ם וְ/עַל הַ/בְּהֵמָ֗ה לִ/שְׁחִ֥ין פֹּרֵ֛חַ אֲבַעְבֻּעֹ֖ת בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/009.yaml
  text: And it will become fine dust over all the land of Egypt[b][a], and it will become boils breaking out with blisters on man and on beast throughout all the land of Egypt.
translation:
  language: fr
  text: Elle deviendra une fine poussière sur tout le pays d’Égypte, et elle provoquera, chez les humains[a] comme chez les bêtes, des ulcères produisant des cloques, dans tout le pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici un terme collectif au singulier : « l’être humain », par opposition aux bêtes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה לְאָבָק
  choice: elle deviendra une fine poussière
  rationale: Le verbe היה exprime ici le résultat d’une transformation, tandis que אָבָק désigne de la poussière ou une poudre très fine. Le pronom féminin reprend naturellement « la cendre » du verset précédent.
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: sur tout le pays d’Égypte
  rationale: La préposition עַל évoque la dispersion de la poussière au-dessus et sur l’ensemble du territoire.
- source_word: עַל הָאָדָם
  choice: chez les humains
  rationale: אָדָם est ici un singulier collectif désignant les êtres humains en contraste avec les bêtes. « Chez » convient naturellement en français à l’apparition d’une affection.
- source_word: וְעַל הַבְּהֵמָה
  choice: comme chez les bêtes
  rationale: בְּהֵמָה est collectif et s’oppose ici à l’humanité. « Bêtes » conserve cette opposition sans restreindre indûment le sens au seul bétail.
- source_word: לִשְׁחִין
  choice: des ulcères
  rationale: שְׁחִין désigne une affection cutanée éruptive. « Ulcères » est courant, digne et suffisamment large dans ce contexte.
- source_word: פֹּרֵחַ אֲבַעְבֻּעֹת
  choice: accompagnés d’une éruption de cloques
  rationale: Cette formulation rend à la fois le participe פֹּרֵחַ, qui décrit le fait de surgir ou d’éclore, et אֲבַעְבֻּעֹת, qui désigne des cloques ou boursouflures, sans réduire les deux termes à un simple adjectif.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: dans tout le pays d’Égypte
  rationale: La répétition territoriale de l’hébreu est conservée afin de souligner l’étendue totale du fléau.
theological_decisions:
- issue: Portée générique de אָדָם
  choice: les humains
  alternative: l’être humain / l’homme
  rationale: Le terme désigne collectivement l’humanité en opposition aux bêtes. « Les humains » exprime ce sens générique de façon naturelle en français moderne, sans limiter la référence aux hommes de sexe masculin.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est légèrement restructurée pour rester idiomatique, tout en conservant la transformation en poussière, la distinction humains-bêtes, les trois éléments de l’affection cutanée et la répétition de l’étendue géographique.
