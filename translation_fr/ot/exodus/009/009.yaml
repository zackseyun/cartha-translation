  to: Elle deviendra une fine poussière sur tout le pays d’Égypte, et elle provoquera, chez les humains[a] comme chez les bêtes, des ulcères produisant des cloques, dans tout le pays d’Égypte.
  rationale: La révision conserve la structure et toutes les composantes sémantiques du verset, tout en rendant plus directement la relation entre l’affection cutanée, son surgissement et les cloques. L’ancre de note reste correctement placée sur « humains ».
