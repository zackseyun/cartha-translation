  yaml_path: translation/ot/exodus/009/026.yaml
  text: Only in the land of Goshen[a], where the sons of Israel were, was there no hail.
translation:
  language: fr
  text: Ce n’est que dans le pays de Gosen, où se trouvaient les fils d’Israël[a], qu’il n’y eut pas de grêle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites » ou « les enfants d’Israël ». L’hébreu dit littéralement « les fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Ce n’est que… que
  rationale: Cette tournure restrictive naturelle en français place l’accent sur l’unique région épargnée.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: dans le pays de Gosen
  rationale: « Pays » convient à la région nommée, et « Gosen » est la forme française traditionnelle et intelligible du toponyme.
- source_word: אֲשֶׁר שָׁם
  choice: où
  rationale: Le relatif et l’adverbe de lieu forment une expression locative rendue simplement et naturellement par « où ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction conserve l’expression familiale masculine explicite de l’hébreu sans la réduire d’emblée au collectif « Israélites ».
- source_word: לֹא הָיָה
  choice: il n’y eut pas
  rationale: L’emploi existentiel de היה nié exprime l’absence de grêle; le passé simple convient au registre narratif biblique français.
- source_word: בָּרָד
  choice: grêle
  rationale: Équivalent français usuel du phénomène météorologique dans le récit des plaies.
theological_decisions:
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites ; les enfants d’Israël
  rationale: L’hébreu porte littéralement « fils d’Israël ». Le texte principal préserve cette forme familiale et genrée, tandis que la note signale les équivalents collectifs possibles sans imposer une interprétation supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne. La construction restrictive « Ce n’est que… que » restitue l’emphase initiale de רַק tout en évitant une syntaxe calquée. Le passé simple maintient un registre narratif soutenu mais courant dans la Bible.
