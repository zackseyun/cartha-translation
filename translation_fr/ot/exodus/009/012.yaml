id: EXO.9.12
reference: Exodus 9:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְחַזֵּ֤ק יְהוָה֙ אֶת לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שָׁמַ֖ע אֲלֵ/הֶ֑ם כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/012.yaml
  text: But Yahweh hardened Pharaoh's heart[a], and he did not listen to them, just as Yahweh had spoken to Moses.
translation:
  language: fr
  text: Mais Yahweh endurcit le cœur du pharaon[a], et celui-ci ne les écouta pas, comme Yahweh l’avait dit à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rendit ferme le cœur du pharaon » ou « fortifia le cœur du pharaon ». Le verbe hébreu signifie plus littéralement « rendre fort, ferme »; dans ce contexte, il évoque la résistance obstinée du pharaon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: endurcit
  rationale: Le verbe חזק signifie fondamentalement « rendre fort/ferme ». Dans le motif récurrent de l’Exode appliqué au cœur du pharaon, « endurcit » exprime naturellement son refus obstiné, tout en maintenant l’action directe de Yahweh. Les sens plus littéraux sont signalés en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לֵב פַּרְעֹה
  choice: le cœur du pharaon
  rationale: Cette formulation française naturelle conserve « cœur », qui désigne ici le centre de la volonté et des dispositions, sans l’expliciter dans le corps du texte.
- source_word: שָׁמַע אֲלֵהֶם
  choice: ne les écouta pas
  rationale: Avec אֶל, שׁמע signifie écouter ou prêter attention. « Ne les écouta pas » est clair et actuel, sans préciser excessivement par « ne leur obéit pas ».
- source_word: אֲלֵהֶם
  choice: les
  rationale: Le pronom hébreu renvoie dans le contexte à Moïse et Aaron. Le texte conserve le pronom plutôt que d’expliciter ses référents.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: comme Yahweh l’avait dit à Moïse
  rationale: « Comme » rend la correspondance avec la parole divine antérieure; le plus-que-parfait marque naturellement son antériorité. Le pronom « l’ » est idiomatique en français et renvoie à ce qui vient de se produire.
theological_decisions:
- issue: Action divine dans l’endurcissement du pharaon
  choice: Yahweh endurcit le cœur du pharaon
  alternative: Yahweh rendit ferme le cœur du pharaon / fortifia le cœur du pharaon
  rationale: L’hébreu présente explicitement Yahweh comme sujet et le cœur du pharaon comme objet. La traduction maintient cette action divine directe, sans la transformer en simple permission. La note conserve toutefois la nuance lexicale littérale de force ou de fermeté.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique soutenu sans être archaïque. « Le pharaon » suit l’usage français courant du titre avec article.
