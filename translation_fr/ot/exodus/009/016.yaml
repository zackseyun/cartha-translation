  text: וְ/אוּלָ֗ם בַּ/עֲב֥וּר זֹאת֙ הֶעֱמַדְתִּ֔י/ךָ בַּ/עֲב֖וּר הַרְאֹתְ/ךָ֣ אֶת כֹּחִ֑/י וּ/לְמַ֛עַן סַפֵּ֥ר שְׁמִ֖/י בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/016.yaml
  text: 'But for this purpose I have let you stand: to show you my power[a], and so that my name may be proclaimed in all the earth.'
translation:
  language: fr
  text: 'Mais c’est pour cela que je t’ai laissé subsister[a] : pour te montrer ma puissance et pour que mon nom soit proclamé sur toute la terre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je t’ai fait rester debout » ou « je t’ai suscité ». L’hébreu peut évoquer le fait de faire rester quelqu’un debout ou de le maintenir en place ; dans ce contexte, il s’agit probablement de laisser le pharaon subsister plutôt que de le détruire immédiatement.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאוּלָם
  choice: Mais
  rationale: Introduit un contraste marqué avec le verset précédent, dans un français actuel et naturel.
- source_word: בַּעֲבוּר זֹאת
  choice: voici pourquoi
  rationale: Exprime ici le dessein poursuivi, que précisent les deux propositions de but qui suivent.
- source_word: הֶעֱמַדְתִּיךָ
  choice: je t’ai laissé subsister
  rationale: Le hiphil de עמד évoque le fait de faire tenir ou de maintenir debout. Dans le contexte, Dieu oppose la destruction immédiate du pharaon à son maintien en vie. « Laisser subsister » rend ce sens naturellement sans suggérer nécessairement son accession au trône.
- source_word: בַּעֲבוּר הַרְאֹתְךָ
  choice: pour te montrer
  rationale: Rend directement la proposition de but et conserve le complément personnel explicite « te ».
- source_word: כֹּחִי
  choice: ma puissance
  rationale: כח désigne la force ou la puissance; « puissance » convient à la manifestation de l’action divine dans le récit des plaies.
- source_word: וּלְמַעַן
  choice: et pour que
  rationale: Coordonne clairement un second objectif avec le premier.
- source_word: סַפֵּר
  choice: soit proclamé
  rationale: Le piel de ספר signifie raconter, publier ou proclamer. La tournure passive française respecte l’absence d’un sujet humain déterminé.
- source_word: שְׁמִי
  choice: mon nom
  rationale: Conserve l’expression hébraïque, qui englobe ici la réputation et l’identité révélée de Dieu.
- source_word: בְּכָל הָאָרֶץ
  choice: sur toute la terre
  rationale: Le contexte vise la diffusion universelle du nom divin plutôt qu’un territoire local; cette formulation est idiomatique en français.
theological_decisions:
- issue: Sens de הֶעֱמַדְתִּיךָ à propos du pharaon
  choice: Dieu a laissé le pharaon subsister en vue de son dessein.
  alternative: Dieu a suscité ou élevé le pharaon pour ce dessein.
  rationale: Le contexte immédiat oppose ce que Dieu aurait pu faire — supprimer le pharaon — au fait qu’il demeure encore. Le texte principal privilégie donc son maintien en vie, tandis que la note conserve l’autre compréhension possible sans imposer une conclusion doctrinale plus forte.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation « laissé subsister » communique naturellement le sens contextuel tout en maintenant, dans la note, l’image et l’ambiguïté de l’hébreu.
