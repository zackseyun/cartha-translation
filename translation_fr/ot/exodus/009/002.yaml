  text: For if you refuse to let them go and still hold on to them,[a]
translation:
  language: fr
  text: Car si tu refuses de les laisser partir et que tu continues à les retenir, [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et que tu continues à les garder »'
    reason: Alternative lexicale plus directe pour מַחֲזִיק בָּם, qui conserve l’idée de continuer à retenir sans ajouter une interprétation de domination.
lexical_decisions:
- source_word: כִּי אִם
  choice: Car si
  rationale: Cette combinaison introduit une condition qui explique et prolonge l’avertissement du verset précédent; « Car si » conserve à la fois la valeur explicative de כִּי et la valeur conditionnelle de אִם.
- source_word: מָאֵן
  choice: refuses
  rationale: Le verbe exprime un refus délibéré, et non une simple incapacité ou hésitation.
- source_word: לְשַׁלֵּחַ
  choice: de les laisser partir
  rationale: Dans ce contexte, שׁלח désigne l’autorisation donnée aux Israélites de partir; cette tournure est exacte et naturelle en français.
- source_word: וְעוֹדְךָ
  choice: et que tu continues à
  rationale: עוֹד avec le suffixe de deuxième personne indique la persistance de l’action de Pharaon; « continues à » rend clairement cet aspect duratif.
- source_word: מַחֲזִיק בָּם
  choice: les retenir
  rationale: Le participe de חזק avec בָּם exprime ici le maintien sous emprise ou l’empêchement de partir; « les retenir » convient au contexte sans ajouter l’idée d’une saisie physique.
