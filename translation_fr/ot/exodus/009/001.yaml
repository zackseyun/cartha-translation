  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה וְ/דִבַּרְתָּ֣ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/001.yaml
  text: 'Then the LORD said to Moses, "Go in to Pharaoh and say to him, ''Thus says the LORD, the God of the Hebrews: Let my people go, so that they may serve me.''"'
translation:
  language: fr
  text: 'Alors le SEIGNEUR dit à Moïse : « Va trouver le pharaon et dis-lui : “Voici ce que dit le SEIGNEUR, le Dieu des Hébreux : Laisse partir mon peuple, afin qu’ils me servent.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: Va trouver le pharaon
  rationale: Cette formulation française naturelle rend l’ordre d’aller se présenter auprès du pharaon sans reproduire maladroitement le mouvement exprimé par l’hébreu.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Équivalent idiomatique actuel de la formule de messager « Ainsi parle/dit », tout en conservant son caractère solennel.
- source_word: שַׁלַּח
  choice: Laisse partir
  rationale: 'Rend l’impératif causatif dans son contexte : le pharaon doit autoriser le peuple à partir et le relâcher.'
- source_word: וְיַעַבְדֻנִי
  choice: afin qu’il me serve
  rationale: « Servir » conserve l’étendue du verbe עבד, qui peut inclure le service cultuel sans réduire explicitement le sens à « adorer ».
theological_decisions:
- issue: Représentation du nom divin יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé / l’Éternel
  rationale: La petite capitale signale le nom divin tout en suivant une convention française largement compréhensible et sans imposer une vocalisation reconstruite.
- issue: Nature du service demandé par Dieu
  choice: qu’il me serve
  alternative: qu’il me rende un culte
  rationale: Le texte emploie עבד, dont le sens permet à la fois le service et, dans ce contexte, le culte. Le choix retenu préserve cette amplitude et la tension avec la servitude imposée au peuple.
translation_notes:
  register: Français international moderne, clair et digne. « Le pharaon » traite le titre comme un nom commun déterminé, conformément à l’usage français actuel. Les guillemets imbriqués distinguent la parole du SEIGNEUR de la formule que Moïse doit transmettre.
