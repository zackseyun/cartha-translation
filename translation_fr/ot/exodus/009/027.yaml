base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/027.yaml
  text: Then Pharaoh sent and called for Moses and Aaron[a], and said to them, “I have sinned this time. Yahweh is in the right[b], and I and my people are the wicked ones.”
translation:
  language: fr
  text: 'Alors le pharaon envoya chercher Moïse et Aaron et leur dit : « Cette fois, j’ai péché. Yahweh est juste[a] ; moi et mon peuple, nous sommes coupables[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Yahweh est dans son droit » ou « Yahweh a raison ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « moi et mon peuple, nous sommes en tort » ou « nous sommes les méchants ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא לְ
  choice: envoya chercher
  rationale: Cette tournure française naturelle exprime l’envoi de messagers suivi de la convocation de Moïse et d’Aaron, sans lourdeur littérale.
- source_word: חָטָאתִי הַפָּעַם
  choice: Cette fois, j’ai péché
  rationale: Le passé composé rend l’aveu actuel d’une faute commise, et « cette fois » traduit directement l’expression temporelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération représente le nom divin exprimé dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: הַצַּדִּיק
  choice: est dans son droit
  rationale: Dans ce contraste judiciaire, cette formulation indique que Yahweh est du côté du droit, tout en laissant en note les sens « juste » et « a raison ».
- source_word: הָרְשָׁעִים
  choice: sommes coupables
  rationale: Le terme désigne ici ceux qui sont fautifs ou coupables en contraste avec celui qui est juste. « Coupables » conserve la portée morale et judiciaire sans la connotation plus absolue de « méchants ».
- source_word: וַאֲנִי וְעַמִּי
  choice: moi et mon peuple, nous
  rationale: La dislocation est naturelle en français parlé soutenu et maintient l’ordre hébreu, qui place d’abord le pharaon dans l’aveu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom propre divin ; sa translittération le distingue d’un titre et suit directement la donnée hébraïque.
- issue: Portée du contraste entre הַצַּדִּיק et הָרְשָׁעִים
  choice: Yahweh est dans son droit ; moi et mon peuple, nous sommes coupables
  alternative: Yahweh est juste ; moi et mon peuple, nous sommes les méchants
  rationale: Le choix principal fait entendre le contraste moral et judiciaire de l’aveu sans transformer nécessairement la phrase en jugement exhaustif sur le caractère permanent du pharaon et de son peuple. La note conserve les rendus adjectivaux plus formels.
translation_notes:
  register: Français international moderne, digne et accessible. L’article devant « pharaon » est conservé conformément à l’usage narratif français. La ponctuation souligne le contraste entre la justice de Yahweh et la culpabilité reconnue du pharaon et de son peuple.
