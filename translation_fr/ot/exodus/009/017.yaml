  text: עוֹדְ/ךָ֖ מִסְתּוֹלֵ֣ל בְּ/עַמִּ֑/י לְ/בִלְתִּ֖י שַׁלְּחָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/017.yaml
  text: Are you still exalting yourself against my people by not letting them go?[a]
translation:
  language: fr
  text: Tu continues à t’élever contre mon peuple sans les laisser partir ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à agir avec arrogance envers mon peuple » ou « à t’élever au-dessus de mon peuple ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדְךָ
  choice: Tu continues à
  rationale: עוֹד marque la persistance de l’attitude de Pharaon. La tournure interrogative, éclairée par le contexte immédiat, rend naturellement en français la question rhétorique qui lui est adressée.
- source_word: מִסְתּוֹלֵל
  choice: t’élever
  rationale: Le participe hitpolél exprime ici une élévation de soi, donc une affirmation arrogante de supériorité. « T’élever » conserve la valeur réflexive et l’image du verbe sans réduire le sens à une simple opposition.
- source_word: בְּעַמִּי
  choice: contre mon peuple
  rationale: Dans cette construction, ב exprime la posture hostile ou dominatrice de Pharaon envers le peuple de Dieu. « Contre » est naturel et clair, tandis que la note signale l’autre nuance possible, « au-dessus de ».
- source_word: לְבִלְתִּי
  choice: en refusant de
  rationale: La construction négative avec l’infinitif indique la manière concrète dont Pharaon s’élève contre le peuple. « En refusant de » explicite ici sa volonté persistante sans modifier la portée de l’énoncé.
- source_word: שַׁלְּחָם
  choice: le laisser partir
  rationale: Dans le récit des plaies, le piel de שלח désigne régulièrement la libération d’Israël. Le pronom français singulier « le » reprend grammaticalement le collectif « mon peuple », tout en correspondant au pluriel hébreu renvoyant aux membres du peuple.
theological_decisions:
- issue: L’appartenance exprimée par « mon peuple »
  choice: Conserver « mon peuple » comme revendication directe de Dieu sur Israël
  alternative: « le peuple » ou « Israël »
  rationale: 'Le suffixe de première personne est explicite et important dans le contexte de l’Exode : Pharaon, en maintenant Israël sous son pouvoir, s’oppose à la revendication de Dieu. La traduction ne doit ni généraliser ni effacer cette relation.'
- issue: La nature de l’attitude de Pharaon
  choice: Conserver l’image réflexive de l’élévation de soi
  alternative: « t’opposer » ou « agir avec arrogance »
  rationale: Le verbe associe l’hostilité à une prétention arrogante à la supériorité. « T’élever contre » maintient cette tension sans préciser davantage que l’hébreu.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement convient à l’adresse divine à Pharaon. La formulation garde la question rhétorique, l’image d’auto-élévation et l’expression théologiquement significative « mon peuple ».
