base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/033.yaml
  text: So Moses went out from Pharaoh[a], out of the city, and spread out his hands to Yahweh; and the thunder and the hail ceased[b], and rain was no longer poured down on the earth.
translation:
  language: fr
  text: Moïse quitta Pharaon et sortit de la ville. Il étendit les mains vers Yahweh ; alors le tonnerre[a] et la grêle cessèrent, et la pluie ne se déversa plus sur la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les voix » ; dans ce contexte d’orage, il s’agit du tonnerre.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « et la pluie ne se déversa pas vers le sol ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא מֹשֶׁה מֵעִם פַּרְעֹה אֶת הָעִיר
  choice: Moïse quitta donc Pharaon et sortit de la ville
  rationale: La construction exprime le départ de Moïse hors de la présence de Pharaon, puis hors de la ville. Cette formulation française rend clairement les deux séparations sans reproduire une syntaxe hébraïque peu naturelle.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: Il étendit les mains
  rationale: L’expression décrit le geste physique de la prière. « Étendre les mains » est naturel, digne et conserve l’image de l’hébreu.
- source_word: אֶל יְהוָה
  choice: vers Yahweh
  rationale: La préposition marque ici l’orientation du geste et de la prière ; « vers » conserve cette nuance directionnelle. Le nom divin est translittéré « Yahweh ».
- source_word: וַיַּחְדְּלוּ הַקֹּלוֹת וְהַבָּרָד
  choice: alors le tonnerre et la grêle cessèrent
  rationale: Dans le contexte de l’orage, le pluriel קֹלוֹת, littéralement « voix » ou « sons », désigne les coups de tonnerre. « Cessèrent » convient au registre narratif et s’applique aux deux phénomènes.
- source_word: וּמָטָר לֹא נִתַּךְ אָרְצָה
  choice: et la pluie ne se déversa plus sur la terre
  rationale: Le passif de נתך présente la pluie comme déversée vers le sol. « Ne… plus » explicite naturellement en français la cessation indiquée par la progression narrative, tandis que « sur la terre » conserve l’étendue possible de אֶרֶץ.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre sans le remplacer par un titre et sans introduire une forme confessionnelle particulière.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste proche des images hébraïques tout en évitant les calques syntaxiques. Les marqueurs [a] et [b] figurent dans le texte aux endroits concernés.
