base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/008.yaml
  text: Then Yahweh said to Moses and to Aaron[a], “Take for yourselves handfuls of soot from a furnace[c][b], and let Moses throw it toward the sky before Pharaoh’s eyes.”
translation:
  language: fr
  text: 'Alors Yahweh dit à Moïse et à Aaron : « Prenez à pleines mains[a] de la suie[b] d’un four, puis que Moïse la lance vers le ciel[c], sous les yeux du pharaon. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le plein de vos mains » ; on peut aussi traduire : « des poignées pleines » ou « chacun une pleine poignée ».'
    reason: lexical_alternative
  - marker: b
    text: On peut aussi comprendre « fine suie » ou, dans un sens plus général, « cendres » ; le mot hébreu désigne plus précisément la suie provenant d’un four.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « vers les cieux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: אמר est le verbe courant pour introduire une parole ; « dit » est direct et naturel en français.
- source_word: קְחוּ לָכֶם
  choice: Prenez
  rationale: L’impératif pluriel s’adresse à Moïse et Aaron. Le datif לָכֶם peut avoir une nuance réflexive, mais la rendre par « pour vous » alourdirait ici inutilement la phrase.
- source_word: מְלֹא חָפְנֵיכֶם
  choice: à pleines mains
  rationale: L’expression désigne littéralement ce qui remplit les mains ou les paumes. « À pleines mains » restitue naturellement l’idée de quantité et l’adresse au pluriel.
- source_word: פִּיחַ
  choice: suie
  rationale: Le terme désigne plus précisément une fine matière noirâtre provenant de la combustion que des cendres ordinaires.
- source_word: כִּבְשָׁן
  choice: four
  rationale: Le mot peut désigner un four ou une fournaise. « Four » demeure assez large et naturel sans préciser indûment sa fonction.
- source_word: וּזְרָקוֹ
  choice: puis que Moïse la lance
  rationale: Après l’impératif pluriel, le verbe passe au masculin singulier et désigne expressément Moïse comme acteur. La tournure française conserve ce changement.
- source_word: הַשָּׁמַיְמָה
  choice: vers le ciel
  rationale: La terminaison directive exprime un mouvement vers le haut. « Vers le ciel » convient au geste physique tout en conservant la polysémie possible de שׁמים.
- source_word: לְעֵינֵי פַרְעֹה
  choice: sous les yeux du pharaon
  rationale: Cette expression idiomatique conserve l’image vive d’une action accomplie de manière visible devant le pharaon.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom divin au lieu de lui substituer un titre.
- issue: Sens de הַשָּׁמַיְמָה dans ce geste
  choice: vers le ciel
  alternative: vers les cieux
  rationale: Le contexte décrit d’abord une direction physique vers le haut. « Le ciel » reste cependant assez ouvert pour ne pas nier l’étendue sémantique du terme hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation « à pleines mains » est idiomatique tout en restant proche de l’image hébraïque. « Sous les yeux du pharaon » conserve la force visuelle de l’expression source. Les marqueurs de notes sont placés immédiatement après les termes concernés.
