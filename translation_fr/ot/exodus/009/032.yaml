  text: But the wheat and the spelt were not struck down[b][a], because they were late-ripening.
translation:
  language: fr
  text: Mais le blé et l’épeautre[a] ne furent pas frappés, car c’étaient des cultures tardives[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traduit par « épeautre » peut désigner une céréale apparentée, telle que l’amidonnier.
    reason: cultural_note
  - marker: b
    text: 'Ou : « car ils mûrissent tard » ; le sens exact du terme hébreu est incertain et évoque probablement un stade de développement encore peu avancé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחִטָּה
  choice: Mais le blé
  rationale: חִטָּה désigne le blé. La conjonction וְ, formellement « et », est rendue par « mais » afin d’exprimer en français le contraste avec les cultures détruites au verset précédent.
- source_word: וְהַכֻּסֶּמֶת
  choice: et l’épeautre
  rationale: כֻּסֶּמֶת désigne une céréale ancienne, probablement l’épeautre ou une céréale apparentée comme l’amidonnier. « Épeautre » est l’équivalent français traditionnel et compréhensible, avec une note qui préserve l’incertitude botanique.
- source_word: לֹא נֻכּוּ
  choice: ne furent pas abattus
  rationale: Le passif de נכה indique que ces cultures ne furent pas frappées au point d’être couchées ou détruites par la grêle. « Abattus » conserve la force du verbe et convient à des plantes.
- source_word: כִּי
  choice: parce que
  rationale: כִּי introduit ici la raison pour laquelle ces céréales avaient échappé à la grêle.
- source_word: אֲפִילֹת הֵנָּה
  choice: ils étaient tardifs
  rationale: L’expression qualifie vraisemblablement ces grains de tardifs dans leur développement. Cette formulation naturelle préserve l’idée agricole sans préciser indûment s’ils n’étaient pas encore en épi ou mûrissaient simplement plus tard.
