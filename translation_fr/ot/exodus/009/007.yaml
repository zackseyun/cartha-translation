base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/007.yaml
  text: Pharaoh sent[a], and behold, not even one of Israel’s livestock had died. But Pharaoh’s heart was heavy[b], and he did not let the people go.
translation:
  language: fr
  text: 'Le pharaon envoya[a], et voici : pas même une seule bête du bétail d’Israël n’était morte. Mais le cœur du pharaon s’endurcit[b], et il ne laissa pas partir le peuple.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit simplement : « Le pharaon envoya », sans préciser qui ou quoi il envoya.'
    reason: implicit_object
  - marker: b
    text: 'Littéralement : « le cœur du pharaon devint lourd ». Dans ce contexte, l’expression évoque son obstination ou son endurcissement.'
    reason: idiom
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya des gens se renseigner
  rationale: 'Le verbe signifie littéralement « envoya », sans complément exprimé. En français, l’ajout minimal de « des gens se renseigner » rend naturellement l’action implicite dans le contexte : le pharaon fait vérifier ce qui est arrivé au bétail d’Israël.'
- source_word: וְהִנֵּה
  choice: et voici
  rationale: La particule attire vivement l’attention sur le résultat constaté. « Et voici » en conserve la force narrative dans un registre digne et compréhensible.
- source_word: לֹא מֵת מִמִּקְנֵה יִשְׂרָאֵל עַד אֶחָד
  choice: pas même une bête appartenant aux Israélites n’était morte
  rationale: La tournure עַד אֶחָד signifie ici qu’il n’en était pas mort une seule. « Une bête » permet d’appliquer naturellement le singulier au terme collectif désignant le bétail, tandis que le plus-que-parfait présente le résultat de la vérification.
- source_word: מִקְנֵה
  choice: bête
  rationale: Dans cette construction avec « pas même une », « bête » désigne naturellement une tête de bétail sans limiter le sens aux bovins.
- source_word: וַיִּכְבַּד לֵב פַּרְעֹה
  choice: le cœur du pharaon s’alourdit
  rationale: Cette traduction suit directement l’image hébraïque du cœur qui devient lourd, sans introduire un agent absent du texte. Une note en précise la valeur idiomatique.
- source_word: וְלֹא שִׁלַּח אֶת הָעָם
  choice: et il ne laissa pas partir le peuple
  rationale: Avec le peuple pour complément, שׁלח signifie dans ce récit le laisser partir ou le libérer. La formulation choisie est naturelle et fidèle au motif récurrent de l’Exode.
theological_decisions:
- issue: L’agent de l’endurcissement du pharaon
  choice: le cœur du pharaon s’alourdit
  alternative: le cœur du pharaon s’endurcit / le pharaon endurcit son cœur
  rationale: Le verbe כבד a ici pour sujet « le cœur du pharaon » et signifie littéralement qu’il devint lourd. La formulation retenue n’attribue explicitement l’action ni à Dieu ni au pharaon et préserve ainsi la tension du texte.
translation_notes:
  register: Français international moderne, naturel et digne. « Et voici » conserve la vivacité narrative de l’hébreu; « s’alourdit » maintient l’image source et l’ambiguïté concernant l’agent de l’endurcissement.
