id: EXO.9.6
reference: Exodus 9:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ יְהוָ֜ה אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ מִֽ/מָּחֳרָ֔ת וַ/יָּ֕מָת כֹּ֖ל מִקְנֵ֣ה מִצְרָ֑יִם וּ/מִ/מִּקְנֵ֥ה בְנֵֽי יִשְׂרָאֵ֖ל לֹא מֵ֥ת אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/006.yaml
  text: And Yahweh did this thing the next day[a], and all the livestock of Egypt died; but from the livestock of the sons of Israel, not one died.
translation:
  language: fr
  text: 'Yahweh fit cela le lendemain : tout le bétail de l’Égypte mourut, mais pas une seule bête du bétail des fils d’Israël[a] ne mourut.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « des Israélites ». Hébreu : « des fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: וַיַּעַשׂ ... אֶת הַדָּבָר הַזֶּה
  choice: fit cela
  rationale: Cette formulation française naturelle conserve le sens concret de l’expression hébraïque sans le lourd calque « fit cette chose ».
- source_word: מִמָּחֳרָת
  choice: le lendemain
  rationale: Équivalent français direct et idiomatique de l’indication temporelle.
- source_word: כֹּל מִקְנֵה מִצְרָיִם
  choice: tout le bétail de l’Égypte
  rationale: « Bétail » couvre les animaux domestiques d’élevage désignés par מִקְנֶה, sans limiter le terme aux bovins.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La traduction conserve la forme de l’expression hébraïque; une note fournit l’équivalent ethnonymique plus courant.
- source_word: לֹא מֵת אֶחָד
  choice: pas une seule bête ... ne mourut
  rationale: La tournure exprime clairement en français que pas un seul animal du bétail d’Israël ne mourut, tout en gardant l’insistance du numéral אֶחָד.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom personnel divin; sa translittération préserve cette donnée plutôt que de lui substituer un titre.
- issue: Portée de l’expression בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le texte principal garde la forme hébraïque traditionnelle sans suggérer que seuls les hommes seraient visés; l’expression désigne collectivement le peuple d’Israël, et la note donne l’équivalent ethnonymique.
translation_notes:
  register: Français moderne, clair et digne. Le passé simple convient au récit biblique écrit; la répétition de « bétail » maintient explicitement le contraste entre l’Égypte et Israël.
