  text: כִּ֤י עַתָּה֙ שָׁלַ֣חְתִּי אֶת יָדִ֔/י וָ/אַ֥ךְ אוֹתְ/ךָ֛ וְ/אֶֽת עַמְּ/ךָ֖ בַּ/דָּ֑בֶר וַ/תִּכָּחֵ֖ד מִן הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/015.yaml
  text: For by now I could have stretched out my hand and struck you and your people with pestilence[a], and you would have been cut off from the earth.
translation:
  language: fr
  text: Car, à présent, j’aurais étendu ma main et je t’aurais frappé, toi et ton peuple, par la pestilence[a] ; tu aurais alors été retranché de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus formelle : « Car maintenant, j’ai étendu ma main et je t’ai frappé, toi et ton peuple, par la pestilence, et tu as été retranché de la terre. » Les formes verbales hébraïques sont formellement au passé, mais le contexte appuie fortement un sens contrefactuel.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et conserve naturellement la valeur causale du contexte.
- source_word: עַתָּה
  choice: déjà
  rationale: Dans cette formulation contrefactuelle, « déjà » exprime idiomatiquement qu’à ce stade l’action aurait pu être accomplie.
- source_word: שָׁלַחְתִּי אֶת־יָדִי
  choice: j’aurais pu étendre ma main
  rationale: Le parfait hébreu est formellement passé, mais le contexte de 9.15–16 indique une possibilité non réalisée. « Étendre ma main » garde l’image hébraïque de l’intervention divine.
- source_word: וָאַךְ
  choice: et te frapper
  rationale: Le verbe נכה désigne ici l’action de frapper par un jugement ; cette traduction est actuelle et conserve sa force.
- source_word: אֹתְךָ וְאֶת־עַמְּךָ
  choice: toi et ton peuple
  rationale: Rend directement les deux compléments, avec la reprise de « te » exigée par une syntaxe française naturelle.
- source_word: בַּדָּבֶר
  choice: par la peste
  rationale: דֶּבֶר désigne une épidémie meurtrière. « La peste » est précis en français biblique moderne et évite le sens très large de « fléau ».
- source_word: וַתִּכָּחֵד
  choice: tu aurais disparu
  rationale: Le niphal de כחד exprime ici l’effacement ou l’extermination. « Disparu » s’accorde naturellement avec « de la terre » tout en conservant la gravité du résultat.
- source_word: מִן־הָאָרֶץ
  choice: de la terre
  rationale: Le contexte envisage l’éradication de Pharaon et de son peuple, non un simple départ du territoire égyptien ; « terre » préserve cette portée générale.
theological_decisions:
- issue: Valeur contrefactuelle de la suite verbale
  choice: 'Employer le conditionnel passé : « j’aurais déjà pu… tu aurais disparu »'
  alternative: 'Traduire formellement par des passés : « maintenant, j’ai étendu ma main… et tu as disparu »'
  rationale: Les formes hébraïques sont formellement passées, mais Pharaon est encore vivant et directement interpellé. Les versets 15–16 opposent ce que Dieu aurait pu faire à ce qu’il a effectivement choisi de faire. Le conditionnel passé rend cette valeur discursive sans résoudre davantage la tension théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’image de la main étendue et la sévérité du jugement, tandis que le conditionnel passé explicite la valeur contrefactuelle imposée par le contexte.
