  text: וַ/יַּ֣רְא פַּרְעֹ֗ה כִּֽי חָדַ֨ל הַ/מָּטָ֧ר וְ/הַ/בָּרָ֛ד וְ/הַ/קֹּלֹ֖ת וַ/יֹּ֣סֶף לַ/חֲטֹ֑א וַ/יַּכְבֵּ֥ד לִבּ֖/וֹ ה֥וּא וַ/עֲבָדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/034.yaml
  text: But when Pharaoh saw that the rain and the hail and the thunder had ceased[a], he continued to sin and hardened his heart, he and his servants.
translation:
  language: fr
  text: Mais quand Pharaon vit que la pluie, la grêle et le tonnerre[a] avaient cessé, il continua de pécher et endurcit son cœur; lui et ses serviteurs endurcirent le leur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « les voix »; dans ce contexte d’orage, l’expression désigne le tonnerre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: vit
  rationale: Le verbe ראה signifie couramment « voir » dans le récit; ici, « vit que » exprime naturellement la constatation sans surinterpréter.
- source_word: כִּי
  choice: que
  rationale: כִּי introduit ici le contenu de ce que le pharaon constate.
- source_word: חָדַל
  choice: avaient cessé
  rationale: חדל signifie « cesser, s'arrêter ». Le plus-que-parfait convient après « vit que » et indique que les phénomènes avaient déjà pris fin.
- source_word: הַמָּטָר וְהַבָּרָד וְהַקֹּלֹת
  choice: la pluie, la grêle et le tonnerre
  rationale: « Pluie » et « grêle » sont les équivalents directs. Le pluriel קֹלוֹת, littéralement « voix, sons », désigne idiomatiquement le tonnerre dans ce contexte d'orage.
- source_word: וַיֹּסֶף לַחֲטֹא
  choice: il continua de pécher
  rationale: La construction יסף suivie de l'infinitif exprime la répétition ou la continuation; cette formulation française conserve ici la portée persistante de la conduite du pharaon.
- source_word: וַיַּכְבֵּד לִבּוֹ
  choice: endurcit son cœur
  rationale: Bien que כבד évoque littéralement la lourdeur, cette expression récurrente de l'Exode désigne l'endurcissement ou l'insensibilité du cœur.
- source_word: הוּא וַעֲבָדָיו
  choice: lui et ses serviteurs
  rationale: עבדים peut désigner des serviteurs, des esclaves ou des agents de la cour. « Serviteurs » reste assez large et l'emploi du pronom tonique « lui » préserve l'emphase de הוּא.
- source_word: וַ
  choice: Mais
  rationale: Le waw fait progresser le récit; « Mais » rend aussi le contraste avec les paroles précédentes de repentance du pharaon.
theological_decisions:
- issue: Agent et portée de l'endurcissement du cœur
  choice: Le texte attribue explicitement au pharaon l'endurcissement de son propre cœur et conserve la formule finale « lui et ses serviteurs ».
  alternative: Comprendre la formule finale comme rattachant collectivement les serviteurs à l'acte d'endurcissement, ou comme une apposition récapitulative concernant la conduite décrite dans son ensemble.
  rationale: La syntaxe nomme d'abord le cœur du pharaon, puis ajoute « lui et ses serviteurs ». La traduction garde cette tension et cette légère ambiguïté de rattachement sans élargir l'affirmation à une doctrine générale sur l'action divine et humaine.
translation_notes:
  register: Français international moderne, narratif et digne. « Le pharaon » est employé comme titre avec article, conformément à l'usage français courant. La coordination finale est maintenue afin de préserver la structure et l'ambiguïté mesurée de l'hébreu.
