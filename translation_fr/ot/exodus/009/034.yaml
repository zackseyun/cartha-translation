revisions:
- from: Mais quand le pharaon vit que la pluie, la grêle et le tonnerre[a] avaient cessé, il continua de pécher et endurcit son cœur, lui et ses serviteurs.
  to: Mais quand Pharaon vit que la pluie, la grêle et le tonnerre[a] avaient cessé, il continua de pécher et endurcit son cœur; lui et ses serviteurs endurcirent le leur.
  rationale: 'La révision conserve le sens de l’hébreu et son association finale de Pharaon avec ses serviteurs, tout en employant une construction française claire: chacun est compris comme endurcissant son propre cœur. Le point-virgule marque la reprise sans modifier la portée narrative ou théologique du verset.'
