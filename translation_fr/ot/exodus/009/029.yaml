source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ מֹשֶׁ֔ה כְּ/צֵאתִ/י֙ אֶת הָ/עִ֔יר אֶפְרֹ֥שׂ אֶת כַּפַּ֖/י אֶל יְהוָ֑ה הַ/קֹּל֣וֹת יֶחְדָּל֗וּ/ן וְ/הַ/בָּרָד֙ לֹ֣א יִֽהְיֶה ע֔וֹד לְמַ֣עַן תֵּדַ֔ע כִּ֥י לַ/יהוָ֖ה הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/029.yaml
  text: Moses said to him[a], “As soon as I have gone out of the city, I will spread out my hands to Yahweh; the thunder will cease, and the hail will be no more[b], so that you may know that the earth belongs to Yahweh.”
translation:
  language: fr
  text: 'Moïse lui dit : « Dès que je serai sorti de la ville, je tendrai les mains vers Yahweh. Le tonnerre[a] cessera et il n’y aura plus de grêle, afin que tu saches que la terre[b] appartient à Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les voix » ou « les bruits » ; dans le contexte de cette tempête, il s’agit du tonnerre.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le pays appartient à Yahweh ».'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּצֵאתִי
  choice: Dès que je serai sorti
  rationale: La préposition כְּ avec l’infinitif construit et le suffixe de première personne situe l’action suivante au moment de la sortie de Moïse; cette formulation rend naturellement l’imminence et l’antériorité immédiate en français.
- source_word: אֶפְרֹשׂ אֶת־כַּפַּי
  choice: je tendrai les mains
  rationale: פרשׂ avec כף décrit le geste de déployer ou d’étendre les mains dans la prière. « Tendre les mains » est naturel en français tout en conservant le geste concret.
- source_word: יְהוָה / לַיהוָה
  choice: Yahweh
  rationale: Le texte porte explicitement le nom divin יהוה; « Yahweh » le distingue d’un titre comme « le Seigneur ».
- source_word: הַקֹּלוֹת
  choice: le tonnerre
  rationale: Le pluriel de קוֹל signifie littéralement « les voix/les bruits », mais désigne ici les coups ou grondements de tonnerre dans la tempête.
- source_word: יֶחְדָּלוּן
  choice: cessera
  rationale: חדל exprime l’arrêt. Le singulier français s’accorde avec le nom collectif « tonnerre ».
- source_word: וְהַבָּרָד לֹא יִהְיֶה עוֹד
  choice: et il n’y aura plus de grêle
  rationale: Cette tournure française exprime clairement que la grêle ne continuera pas, sans donner à la formule un caractère excessivement archaïque.
- source_word: לְמַעַן תֵּדַע
  choice: afin que tu saches
  rationale: לְמַעַן introduit ici le but; le subjonctif français convient à cette relation finale.
- source_word: כִּי לַיהוָה הָאָרֶץ
  choice: que la terre appartient à Yahweh
  rationale: Le לְ marque ici l’appartenance. הָאָרֶץ peut désigner la terre entière ou le pays; le contexte de souveraineté sur les phénomènes naturels favorise « la terre », tout en conservant l’autre possibilité en note.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Employer le nom propre préserve la forme personnelle et l’identité d’alliance exprimées directement par le tétragramme, sans le remplacer par un titre.
- issue: Portée de הָאָרֶץ
  choice: la terre
  alternative: le pays
  rationale: « La terre » convient à la proclamation générale de la souveraineté de Yahweh manifestée par la tempête, mais le nom hébreu peut aussi avoir une portée territoriale; l’ambiguïté lexicale est donc signalée.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct reste sobre. « Tendre les mains » conserve le geste de prière sans lourdeur, tandis que les notes rendent visibles le sens littéral de הַקֹּלוֹת et l’ambiguïté de הָאָרֶץ.
