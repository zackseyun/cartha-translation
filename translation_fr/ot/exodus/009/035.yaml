source:
  edition: WLC
  text: וַֽ/יֶּחֱזַק֙ לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שִׁלַּ֖ח אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/035.yaml
  text: So Pharaoh’s heart was hardened[a], and he did not let the sons of Israel go[c][b], just as Yahweh had spoken through Moses.
translation:
  language: fr
  text: Ainsi, le cœur de Pharaon s’endurcit[a], et il ne laissa pas partir les fils d’Israël[b], comme Yahweh l’avait dit par l’intermédiaire de Moïse[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devint ferme » ou « s’obstina ». Le verbe hébreu signifie devenir fort ou ferme ; ici, il évoque l’obstination.
    reason: alternative_reading
  - marker: b
    text: Ou « les Israélites » ; traditionnellement « les enfants d’Israël ». Littéralement « les fils d’Israël ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « par la main de Moïse », expression qui signifie « par l’intermédiaire de Moïse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: s’endurcit
  rationale: Le qal de חזק exprime ici le fait que le cœur devint ferme ou obstiné. « S’endurcit » rend naturellement ce sens dans le récit des fléaux sans préciser qui en est la cause.
- source_word: לֵב פַּרְעֹה
  choice: le cœur de Pharaon
  rationale: Cette formulation française naturelle conserve l’image hébraïque du cœur comme siège de la volonté et de la disposition intérieure.
- source_word: שִׁלַּח
  choice: laissa partir
  rationale: Dans ce contexte, le piel de שלח désigne le fait d’autoriser Israël à partir ; « laisser partir » est clair et idiomatique.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La traduction formelle conserve l’expression hébraïque et son lien avec le patriarche Israël ; une note donne l’équivalent collectif courant.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: Le terme marque la correspondance entre l’événement et la parole divine antérieure. En français, « comme » exprime cette conformité sans lourdeur.
- source_word: דִּבֶּר
  choice: avait dit
  rationale: Le plus-que-parfait situe naturellement la parole divine avant son accomplissement, et « avait dit » rend le verbe de parole sans ajouter l’idée plus précise d’une annonce prophétique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בְּיַד מֹשֶׁה
  choice: par l’intermédiaire de Moïse
  rationale: Littéralement « par la main de Moïse », cette expression idiomatique indique que Moïse est le médiateur de la parole de Yahweh.
theological_decisions:
- issue: Agent de l’endurcissement du cœur
  choice: le cœur de Pharaon s’endurcit
  alternative: le cœur de Pharaon fut endurci ; Pharaon endurcit son cœur
  rationale: La forme hébraïque présente ici le cœur comme devenant ferme ou obstiné, sans attribuer explicitement l’action à Dieu ni à Pharaon. La traduction conserve cette tension causale.
- issue: Médiation de la parole divine
  choice: Yahweh l’avait dit par l’intermédiaire de Moïse
  alternative: Yahweh l’avait dit par la main de Moïse
  rationale: 'Le rendu explicite l’idiome hébraïque tout en maintenant le rôle médiateur de Moïse : la parole vient de Yahweh et passe par lui.'
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu sans être artificielle. « S’endurcit » conserve le motif narratif tout en évitant d’expliciter un agent absent de cette proposition.
