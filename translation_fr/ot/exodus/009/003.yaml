source:
  edition: WLC
  text: הִנֵּ֨ה יַד יְהוָ֜ה הוֹיָ֗ה בְּ/מִקְנְ/ךָ֙ אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה בַּ/סּוּסִ֤ים בַּֽ/חֲמֹרִים֙ בַּ/גְּמַלִּ֔ים בַּ/בָּקָ֖ר וּ/בַ/צֹּ֑אן דֶּ֖בֶר כָּבֵ֥ד מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/003.yaml
  text: Look[a], the hand of Yahweh will come upon your livestock that are in the field—upon the horses, the donkeys, the camels, the herds, and the flocks—with a very severe plague.
translation:
  language: fr
  text: Voici que la main de Yahweh va frapper ton bétail qui est dans les champs — les chevaux, les ânes, les chameaux, les bovins et le petit bétail — d’une épidémie[a] très grave.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une peste » ; le terme hébreu désigne ici une épidémie meurtrière qui atteint le bétail.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici que
  rationale: Conserve la force présentative et urgente de l’hébreu dans un français actuel et digne.
- source_word: יַד יְהוָה
  choice: la main de Yahweh
  rationale: Maintient l’image hébraïque de la puissance divine agissant dans le jugement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé directement dans le texte hébreu.
- source_word: הוֹיָה בְּ
  choice: va frapper
  rationale: Rend naturellement l’action imminente et hostile de la main divine; le français « va être sur » serait obscur.
- source_word: מִקְנְךָ אֲשֶׁר בַּשָּׂדֶה
  choice: ton bétail qui est dans les champs
  rationale: מִקְנֶה désigne largement les animaux domestiques, et le complément précise ceux qui se trouvent dehors.
- source_word: בַּסּוּסִים בַּחֲמֹרִים בַּגְּמַלִּים בַּבָּקָר וּבַצֹּאן
  choice: les chevaux, les ânes, les chameaux, les gros troupeaux et le petit bétail
  rationale: Préserve l’énumération et distingue les deux collectifs בָּקָר et צֹאן sans réduire ce dernier aux seuls moutons.
- source_word: דֶּבֶר
  choice: épidémie
  rationale: Désigne ici une maladie collective meurtrière touchant les animaux; ce choix est plus précis en français moderne que « peste » pris au sens étroit.
- source_word: כָּבֵד מְאֹד
  choice: très grave
  rationale: Transpose idiomatiquement l’intensité de l’expression hébraïque, littéralement « très lourde ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le tétragramme comme nom propre; « Yahweh » en conserve la référence explicite.
- issue: Image de la main divine
  choice: conserver « la main de Yahweh » comme sujet de l’action
  alternative: Yahweh va frapper
  rationale: La formulation retenue préserve l’image théologique hébraïque de la puissance divine sans l’aplatir, tout en rendant son action intelligible en français.
translation_notes:
  register: Français international moderne, clair et digne. « Voici que » garde la solennité sans archaïsme marqué. « Gros troupeaux et petit bétail » respecte les catégories collectives hébraïques; « dans les champs » exprime naturellement les animaux gardés à l’extérieur.
