reference: Exodus 9:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י בַּ/פַּ֣עַם הַ/זֹּ֗את אֲנִ֨י שֹׁלֵ֜חַ אֶת כָּל מַגֵּפֹתַ/י֙ אֶֽל לִבְּ/ךָ֔ וּ/בַ/עֲבָדֶ֖י/ךָ וּ/בְ/עַמֶּ֑/ךָ בַּ/עֲב֣וּר תֵּדַ֔ע כִּ֛י אֵ֥ין כָּמֹ֖/נִי בְּ/כָל הָ/אָֽרֶץ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/014.yaml
  text: For this time I am sending all my plagues against your heart[a], and against your servants and your people[b], so that you may know that there is none like me in all the earth.
translation:
  language: fr
  text: Car, cette fois, j’envoie tous mes fléaux contre ton cœur[a], contre tes serviteurs et contre ton peuple, afin que tu saches qu’il n’y a personne comme moi sur toute la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vers ton cœur ». L’expression hébraïque peut indiquer que les fléaux visent Pharaon lui-même, au plus profond de son être.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans tout le pays », si l’expression est comprise dans un sens plus local. Ici, « terre » souligne la portée universelle de l’affirmation selon laquelle le Seigneur est sans égal.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de la préservation et de l’avertissement de Pharaon, en maintenant clairement le lien avec le contexte précédent.
- source_word: בַּפַּעַם הַזֹּאת
  choice: cette fois
  rationale: Expression temporelle idiomatique désignant l’intervention présente; cette formulation est naturelle en français moderne.
- source_word: שֹׁלֵחַ
  choice: j’envoie
  rationale: Le participe hébreu présente l’action comme actuelle ou imminente. Le présent français en conserve la vivacité sans imposer un futur strict.
- source_word: כָּל מַגֵּפֹתַי
  choice: tous mes fléaux
  rationale: מַגֵּפָה désigne un coup destructeur, une plaie ou un fléau. « Fléaux » convient au contexte des jugements frappant l’Égypte et garde la force du terme.
- source_word: אֶל לִבְּךָ
  choice: contre ton cœur
  rationale: La formulation conserve l’image explicite du cœur et la direction hostile des fléaux, sans réduire le sens à « contre toi ».
- source_word: וּבַעֲבָדֶיךָ
  choice: contre tes serviteurs
  rationale: Dans ce contexte, עֲבָדִים désigne les serviteurs ou hauts fonctionnaires de Pharaon plutôt que des esclaves; la préposition est rendue explicitement.
- source_word: וּבְעַמֶּךָ
  choice: contre ton peuple
  rationale: Désigne le peuple égyptien placé sous l’autorité de Pharaon; la répétition de « contre » clarifie la portée coordonnée de la menace.
- source_word: בַּעֲבוּר
  choice: afin que
  rationale: Marque le but de l’action divine; « afin que » exprime nettement cette valeur finale dans un registre digne et courant.
- source_word: תֵּדַע
  choice: tu saches
  rationale: Après la locution de but, le subjonctif français rend naturellement le résultat visé sans transformer la forme en simple prédiction.
- source_word: אֵין כָּמֹנִי
  choice: il n’y a personne comme moi
  rationale: Rend directement l’expression hébraïque d’incomparabilité dans un français naturel.
- source_word: בְּכָל הָאָרֶץ
  choice: sur toute la terre
  rationale: אֶרֶץ peut désigner un pays ou la terre entière. Le contexte de la proclamation de l’unicité incomparable de Dieu favorise ici la portée universelle.
theological_decisions:
- issue: Portée de l’incomparabilité divine
  choice: 'Portée universelle : « sur toute la terre »'
  alternative: 'Portée locale : « dans tout le pays »'
  rationale: La déclaration affirme que le Seigneur est sans égal, au-delà de la seule Égypte. Cette lecture correspond à la visée du récit sans ajouter de formulation doctrinale étrangère au verset.
- issue: Sens de « contre ton cœur »
  choice: Maintenir la métaphore du cœur comme cible des fléaux
  alternative: Aplanir l’expression en « contre toi personnellement »
  rationale: L’hébreu nomme explicitement le cœur de Pharaon. Le conserver respecte le lien narratif avec l’endurcissement de son cœur et laisse subsister la tension entre l’atteinte personnelle, intérieure et judiciaire.
translation_notes:
  register: Français international moderne, clair et digne. La structure répétitive de la menace est conservée, ainsi que la métaphore du cœur et l’ambiguïté lexicale signalée pour אֶרֶץ.
