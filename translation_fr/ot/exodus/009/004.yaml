id: EXO.9.4
reference: Exodus 9:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִפְלָ֣ה יְהוָ֔ה בֵּ֚ין מִקְנֵ֣ה יִשְׂרָאֵ֔ל וּ/בֵ֖ין מִקְנֵ֣ה מִצְרָ֑יִם וְ/לֹ֥א יָמ֛וּת מִ/כָּל לִ/בְנֵ֥י יִשְׂרָאֵ֖ל דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/004.yaml
  text: But Yahweh will make a distinction between the livestock of Israel and the livestock of Egypt[a], so that nothing belonging to the sons of Israel will die.
translation:
  language: fr
  text: 'Mais Yahweh fera une distinction entre le bétail d’Israël et le bétail de l’Égypte : pas une seule bête appartenant aux Israélites ne mourra.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְלָה
  choice: fera une distinction
  rationale: Le hiphil de פלא exprime ici le fait d’établir une séparation manifeste entre deux groupes. Cette formulation française conserve la nuance causative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: בֵּין ... וּבֵין
  choice: entre ... et ...
  rationale: Cette paire prépositionnelle corrélative marque la distinction entre les deux ensembles de bétail.
- source_word: מִקְנֵה
  choice: bétail
  rationale: Le terme désigne collectivement les animaux domestiques possédés, sans se limiter aux bovins.
- source_word: מִצְרַיִם
  choice: l’Égypte
  rationale: Le syntagme construit désigne collectivement le bétail associé à l’Égypte.
- source_word: וְלֹא יָמוּת
  choice: ne mourra
  rationale: La coordination hébraïque introduit la conséquence annoncée de la distinction; les deux-points rendent naturellement cette relation sans la surinterpréter.
- source_word: מִכָּל ... דָּבָר
  choice: pas une seule bête
  rationale: Dans ce contexte animalier, l’expression négative signifie qu’aucun animal parmi les possessions d’Israël ne mourra. « Bête » explicite le référent naturel de דָּבָר sans suggérer des biens inanimés.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: appartenant aux Israélites
  rationale: Le lamed indique ici l’appartenance. « Israélites » rend naturellement en français l’expression nationale littérale « fils d’Israël ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; la translittération préserve le nom personnel sans lui substituer un titre.
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël
  rationale: Dans cette expression nationale consacrée, le masculin pluriel hébreu désigne collectivement le peuple. « Les Israélites » est précis, inclusif dans son référent et plus naturel en français moderne.
- issue: Portée de דָּבָר dans une proposition concernant le bétail
  choice: une seule bête
  alternative: une seule chose
  rationale: Bien que דָּבָר signifie littéralement « chose », son référent contextuel est le bétail. Le choix évite de laisser croire que toutes les possessions matérielles sont visées.
translation_notes:
  register: Français international moderne, digne et accessible. La structure garde le contraste appuyé entre le bétail d’Israël et celui de l’Égypte. Les deux-points préservent une certaine souplesse quant au rapport exact entre la distinction divine et la survie du bétail israélite.
