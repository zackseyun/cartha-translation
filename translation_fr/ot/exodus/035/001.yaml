  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּקְהֵ֣ל מֹשֶׁ֗ה אֶֽת כָּל עֲדַ֛ת בְּנֵ֥י יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם אֵ֚לֶּה הַ/דְּבָרִ֔ים אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֹׂ֥ת אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/001.yaml
  text: Then Moses assembled all the congregation of the sons of Israel and said to them[b][a], “These are the things that Yahweh has commanded to be done.”
translation:
  language: fr
  text: 'Moïse rassembla toute l’assemblée des fils d’Israël[a] et leur dit : « Voici ce que Yahweh a ordonné de faire[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël ». Cette désignation du peuple lié à Dieu par l’alliance renvoie ici à toute la communauté, et non aux seuls hommes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Voici les paroles » ; « Voici les choses » ; ou « Voici les affaires [ou les matières] ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: rassembla
  rationale: Le hifil de קהל exprime ici l’action de réunir le peuple en assemblée. « Rassembla » est naturel en français et conserve cette valeur causative.
- source_word: כָּל עֲדַת
  choice: toute la communauté
  rationale: עֵדָה désigne la communauté d’Israël considérée comme un corps constitué. « Toute la communauté » rend clairement כָּל et évite de réduire le terme au seul rassemblement ponctuel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction conserve la forme masculine de l’expression hébraïque et sa portée identitaire et d’alliance. Une note précise qu’elle désigne ici l’ensemble du peuple, et non les seuls hommes.
- source_word: אֵלֶּה הַדְּבָרִים
  choice: Voici les choses
  rationale: דְּבָרִים peut désigner des paroles, des choses ou des prescriptions. Comme la suite concerne ce qui doit être accompli, « les choses » préserve la largeur du terme sans limiter le sens aux seules paroles.
- source_word: צִוָּה יְהוָה
  choice: Yahweh a ordonné
  rationale: Le passé composé convient au discours français et souligne qu’un ordre antérieur demeure en vigueur. Le nom divin est rendu par « Yahweh ».
- source_word: לַעֲשֹׂת אֹתָם
  choice: de faire
  rationale: L’infinitif avec le pronom objet renvoie aux choses prescrites. Après « a ordonné », « de faire » est une formulation française concise et naturelle qui exprime leur mise en œuvre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme, nom personnel du Dieu d’Israël. « Yahweh » le représente comme un nom plutôt que de lui substituer un titre.
- issue: Portée de l’expression בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël, avec une note indiquant qu’il s’agit de tout le peuple
  alternative: les Israélites ; les enfants d’Israël
  rationale: La forme masculine de l’hébreu est conservée sans lui attribuer une portée exclusivement masculine, puisque le contexte parle de toute la communauté.
translation_notes:
  register: Français international moderne, clair et digne. Le récit emploie le passé simple, tandis que le discours direct utilise le passé composé. La formulation conserve le nom divin et l’expression identitaire hébraïque, avec des notes pour prévenir les contresens.
