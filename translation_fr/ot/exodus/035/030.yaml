source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל רְא֛וּ קָרָ֥א יְהוָ֖ה בְּ/שֵׁ֑ם בְּצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֥ה יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/030.yaml
  text: Then Moses said to the sons of Israel[a], “See, Yahweh has called by name Bezalel son of Uri, son of Hur, of the tribe of Judah.”
translation:
  language: fr
  text: 'Puis Moïse dit aux fils d’Israël[a] : « Voyez, Yahweh a appelé par son nom Betsaléel, fils d’Ouri, fils de Hour, de la tribu de Juda. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux Israélites » ou « aux enfants d’Israël ». L’hébreu dit littéralement « aux fils d’Israël ».
    reason: Alternative lexicale et précision sur la forme de l’hébreu.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Puis Moïse dit
  rationale: Le wayyiqtol fait progresser le récit. « Puis » rend naturellement la succession narrative en français moderne.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: Cette formulation conserve l’expression filiale masculine de l’hébreu, tandis qu’une note donne les équivalents collectifs courants.
- source_word: רְאוּ
  choice: Voyez
  rationale: L’impératif pluriel attire l’attention des destinataires sur la désignation divine qui suit.
- source_word: קָרָא ... בְּשֵׁם
  choice: a appelé par son nom
  rationale: Cette traduction préserve l’idiome hébreu et son idée de désignation personnelle et explicite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin présent dans le texte plutôt que de lui substituer un titre.
- source_word: בְּצַלְאֵל בֶּן אוּרִי בֶן חוּר
  choice: Betsaléel, fils d’Ouri, fils de Hour
  rationale: Les formes françaises usuelles des noms sont employées et la répétition de « fils de » conserve la structure généalogique.
- source_word: לְמַטֵּה יְהוּדָה
  choice: de la tribu de Juda
  rationale: La formule exprime clairement et naturellement l’appartenance tribale de Betsaléel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » en préserve la valeur de nom personnel.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le texte principal garde la forme masculine et filiale de l’hébreu sans nier sa portée collective; celle-ci est signalée en note.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste proche de l’hébreu sans devenir artificielle; « Voyez » conserve l’appel direct à l’attention.
