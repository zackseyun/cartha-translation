base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/022.yaml
  text: So the men came with the women[a]. Everyone whose heart was willing brought brooches, earrings, rings, and ornaments—all kinds of gold jewelry[b]. And every man who presented a wave offering of gold to Yahweh did so.
translation:
  language: fr
  text: Les hommes vinrent avec les femmes[a]. Tous ceux dont le cœur était bien disposé apportèrent des broches, des anneaux, des bagues et des ornements, toutes sortes de bijoux en or[b]. Et tout homme qui présenta à Yahweh une offrande agitée d’or le fit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque, littéralement « les hommes sur les femmes », est idiomatique et difficile ; elle peut signifier que les hommes vinrent avec les femmes ou qu’ils vinrent en plus d’elles.
    reason: alternative_reading
  - marker: b
    text: Le sens exact de certains noms de bijoux est incertain. Les « broches » pourraient être des agrafes ou des anneaux ; les « anneaux » pouvaient se porter aux oreilles ou au nez ; les « ornements » pourraient désigner un type particulier de pendentif, de bracelet ou de brassard.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: vinrent
  rationale: Le waw consécutif fait avancer le récit; en français, le passé simple exprime naturellement cette progression sans qu’un connecteur soit nécessaire.
- source_word: הָאֲנָשִׁים עַל הַנָּשִׁים
  choice: les hommes vinrent avec les femmes
  rationale: 'La préposition עַל a ici un emploi difficile et probablement idiomatique: les hommes viennent avec les femmes ou se joignent à elles. «Avec» est naturel tout en laissant l’autre nuance en note.'
- source_word: כֹּל נְדִיב לֵב
  choice: tous ceux dont le cœur était bien disposé
  rationale: Cette formulation conserve l’image hébraïque du cœur et exprime une disposition volontaire et généreuse.
- source_word: חָח
  choice: broches
  rationale: Le bijou précis est incertain; «broches» constitue un équivalent plausible, avec les autres possibilités signalées en note.
- source_word: נֶזֶם
  choice: anneaux
  rationale: Le terme peut désigner un anneau porté à l’oreille ou au nez. «Anneaux» évite de trancher arbitrairement entre ces emplacements.
- source_word: טַבַּעַת
  choice: bagues
  rationale: Le sens général de bague est sûr, tandis que la précision «bague à cachet» ne l’est pas dans ce contexte.
- source_word: כוּמָז
  choice: ornements
  rationale: Ce mot rare désigne un bijou dont la forme exacte est incertaine; un terme générique évite une fausse précision.
- source_word: כָּל כְּלִי זָהָב
  choice: toutes sortes de bijoux en or
  rationale: Dans cette énumération de parures, cette expression rend naturellement le sens contextuel de «tout objet en or».
- source_word: וְכָל אִישׁ
  choice: et tout homme
  rationale: Le substantif hébreu אִישׁ est explicitement masculin singulier; la traduction conserve cette forme.
- source_word: הֵנִיף תְּנוּפַת זָהָב
  choice: présenta ... une offrande d’or élevée
  rationale: הֵנִיף évoque le geste rituel d’élever ou de balancer l’offrande. «Offrande élevée» conserve la spécificité cultuelle sans suggérer que l’or était simplement agité.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme; «Yahweh» représente le nom propre plutôt que de le remplacer par un titre.
- issue: Langage genré dans וְכָל אִישׁ
  choice: tout homme
  alternative: toute personne; chacun
  rationale: Le texte source emploie אִישׁ, «homme», et la traduction maintient cette précision sans nier la participation des femmes déjà mentionnée.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique. Les termes génériques et les notes préservent les incertitudes lexicales du texte hébreu.
