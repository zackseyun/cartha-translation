source:
  edition: WLC
  text: וְ/הַ/נְּשִׂאִ֣ם הֵבִ֔יאוּ אֵ֚ת אַבְנֵ֣י הַ/שֹּׁ֔הַם וְ/אֵ֖ת אַבְנֵ֣י הַ/מִּלֻּאִ֑ים לָ/אֵפ֖וֹד וְ/לַ/חֹֽשֶׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/027.yaml
  text: And the leaders brought the onyx stones and the stones for setting[b][a], for the ephod and for the breastpiece.
translation:
  language: fr
  text: Les chefs apportèrent les pierres d’onyx[a] et les pierres à enchâsser, destinées à l’éphod et au pectoral[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « les pierres de shoham » ; l’identification exacte de cette pierre précieuse est incertaine, bien que « onyx » soit le rendu traditionnel.
    reason: lexical_alternative
  - marker: b
    text: Ou « au plastron ». Le mot hébreu désigne l’ornement sacerdotal porté sur la poitrine, et non une pièce d’armure.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנְּשִׂאִם
  choice: Les chefs
  rationale: נְשִׂיאִים désigne ici les principaux responsables de la communauté. « Chefs » est naturel et n’implique pas un statut royal, contrairement à « princes ».
- source_word: הֵבִיאוּ
  choice: apportèrent
  rationale: Le hifil de בוא signifie ici « apporter ». Ce verbe convient au contexte des offrandes de matériaux destinés au sanctuaire.
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: les pierres d’onyx
  rationale: « Onyx » est le rendu traditionnel de שֹׁהַם dans les passages relatifs au sanctuaire et aux vêtements sacerdotaux, mais l’identification exacte de la pierre reste incertaine ; cette incertitude est signalée en note.
- source_word: אַבְנֵי הַמִּלֻּאִים
  choice: les pierres à enchâsser
  rationale: Dans ce contexte de joaillerie cultuelle, מִלֻּאִים désigne des pierres destinées à être fixées dans une monture. « À enchâsser » exprime clairement cette fonction sans reproduire l’obscur littéralisme « pierres de remplissage ».
- source_word: לָאֵפֹד
  choice: destinées à l’éphod
  rationale: אֵפֹד désigne un vêtement sacerdotal sans équivalent français précis. La translittération traditionnelle « éphod » est donc conservée.
- source_word: וְלַחֹשֶׁן
  choice: et au pectoral
  rationale: חֹשֶׁן désigne l’ornement sacerdotal porté sur la poitrine et fixé à l’éphod. « Pectoral » est le terme français consacré et évite l’idée trompeuse d’une pièce d’armure.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve la structure d’inventaire de l’hébreu tout en précisant naturellement, par « destinées à », le rapport des pierres avec les deux éléments du vêtement sacerdotal.
