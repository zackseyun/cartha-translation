lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: la table
  rationale: Le nom désigne simplement la table cultuelle. Sa fonction est précisée ensuite par « le pain de la Présence » ; l’expliciter ici surtraduirait le texte.
- source_word: בַּדָּיו
  choice: ses barres
  rationale: Dans le contexte du sanctuaire, בַּד désigne les barres servant à transporter le mobilier sacré. « Barres » est le terme français biblique courant et reste naturel.
- source_word: כָּל כֵּלָיו
  choice: tous ses ustensiles
  rationale: כְּלִי est un terme large désignant des objets, récipients ou instruments. Pour le service de la table, « ustensiles » est clair, concret et suffisamment englobant.
- source_word: לֶחֶם הַפָּנִים
  choice: le pain de la Présence
  rationale: L’expression signifie littéralement « pain de la face/de la présence ». « Pain de la Présence » conserve l’expression cultuelle hébraïque tout en restant compréhensible en français moderne.
