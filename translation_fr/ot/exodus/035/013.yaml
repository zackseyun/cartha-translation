  text: the table[a], and its poles, and all its utensils, and the bread of the Presence,
translation:
  language: fr
  text: la table[a], ses barres, tous ses ustensiles et le pain de la Présence ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « la table des pains de proposition ».'
