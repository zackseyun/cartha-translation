  text: and the lampstand for the light[a], and its utensils, and its lamps, and the oil for the light,
translation:
  language: fr
  text: et le porte-lampes pour l’éclairage[a], et ses ustensiles, et ses lampes, et l’huile pour l’éclairage,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « le porte-lampes de la lumière » et « l’huile de la lumière ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרַת הַמָּאוֹר
  choice: le porte-lampes pour l’éclairage
  rationale: מְנוֹרָה désigne ici le support portant les différentes lampes du sanctuaire. « Porte-lampes » évite l’image anachronique de bougies que peut suggérer « chandelier », tandis que « pour l’éclairage » exprime naturellement en français la relation construite avec הַמָּאוֹר.
- source_word: כֵּלֶיהָ
  choice: ses ustensiles
  rationale: כְּלִי est un terme large pouvant désigner des objets, récipients, instruments ou accessoires. Dans cette liste de mobilier cultuel, « ustensiles » reste naturel et suffisamment général.
- source_word: נֵרֹתֶיהָ
  choice: ses lampes
  rationale: נֵר désigne couramment une lampe ou sa flamme. Ici, le pluriel renvoie aux lampes individuelles portées par le porte-lampes.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: l’huile pour l’éclairage
  rationale: Cette formulation rend naturellement la construction « huile de la lumière/de l’éclairage » et maintient la répétition de מָאוֹר présente dans le verset.
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֵת
  choice: et ... et ... et ... et
  rationale: La répétition de « et » conserve la structure cumulative et le rythme d’inventaire de l’hébreu.
