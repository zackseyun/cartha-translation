base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/016.yaml
  text: the altar of burnt offering[a], and the bronze grating that belongs to it, its poles, and all its utensils[b], the basin and its stand—
translation:
  language: fr
  text: l’autel des holocaustes, avec la grille de bronze[a] qui lui appartient, ses barres et tous ses ustensiles, ainsi que la cuve et son support[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le treillis de bronze ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sa base » ou « son socle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: l’autel des holocaustes
  rationale: L’expression construite désigne l’autel associé aux sacrifices entièrement consumés. « Autel des holocaustes » est l’appellation française courante, claire et concise.
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: la grille de bronze
  rationale: מִכְבָּר désigne un ouvrage ajouré ou en réseau fixé à l’autel. « Grille de bronze » rend concrètement l’objet en français moderne sans préciser abusivement sa forme exacte.
- source_word: אֲשֶׁר לוֹ
  choice: qui lui appartient
  rationale: La tournure exprime l’appartenance ou l’association avec l’autel, sans indiquer explicitement une position précise.
- source_word: בַּדָּיו
  choice: ses barres
  rationale: Les בַּדִּים sont les barres servant au transport du mobilier du sanctuaire. « Barres » est le terme français naturel dans ce contexte; leur fonction est implicite.
- source_word: כָּל כֵּלָיו
  choice: tous ses ustensiles
  rationale: כֵּלִים est un terme large pour les objets et instruments liés à l’autel. « Ustensiles » convient au matériel cultuel tout en restant accessible.
- source_word: הַכִּיֹּר
  choice: la cuve
  rationale: Le mot désigne le récipient destiné aux ablutions dans la cour du sanctuaire. « Cuve » est précis, actuel et plus naturel que le terme traditionnel vieilli « bassin d’airain ».
- source_word: כַּנּוֹ
  choice: son support
  rationale: Le terme désigne la pièce sur laquelle repose la cuve. « Support » reste concret sans imposer si elle prenait exactement la forme d’un socle ou d’une base.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La structure demeure celle d’une énumération poursuivie depuis le contexte précédent; le tiret final signale que la phrase continue. « Avec » facilite l’enchaînement français, tandis que « qui lui appartient » préserve la relation volontairement générale exprimée par l’hébreu.
