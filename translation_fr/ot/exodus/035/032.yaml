lexical_decisions:
- source_word: וְ/לַ/חְשֹׁב מַחַשָׁבֹת
  choice: pour concevoir des ouvrages
  rationale: Le verbe et le nom apparenté soulignent la conception artistique et réfléchie. En français, « concevoir des ouvrages » exprime naturellement l'idée sans reproduire lourdement la répétition étymologique de l'hébreu.
- source_word: לַ/עֲשֹׂת
  choice: et les réaliser
  rationale: Dans ce contexte artisanal, « réaliser » désigne l'exécution concrète des ouvrages conçus; le pronom « les » explicite en français le lien avec « ouvrages ».
- source_word: בַּ/זָּהָב
  choice: en or
  rationale: La préposition ב introduit ici la matière travaillée; « en or » est l'expression française idiomatique.
- source_word: וּ/בַ/כֶּסֶף
  choice: en argent
  rationale: Rendu français standard du matériau כסף dans cette liste parallèle.
- source_word: וּ/בַ/נְּחֹשֶׁת
  choice: en bronze
  rationale: « Bronze » est le rendu conventionnel et historiquement plausible dans le contexte du sanctuaire, même si « cuivre » reste possible.
