language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שֵׁ֣שֶׁת יָמִים֮ תֵּעָשֶׂ֣ה מְלָאכָה֒ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י יִהְיֶ֨ה לָ/כֶ֥ם קֹ֛דֶשׁ שַׁבַּ֥ת שַׁבָּת֖וֹן לַ/יהוָ֑ה כָּל הָ/עֹשֶׂ֥ה ב֛/וֹ מְלָאכָ֖ה יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/002.yaml
  text: Work may be done for six days[a], but on the seventh day there shall be for you a holy Sabbath, a complete rest to Yahweh[b]. Whoever does work on it shall surely be put to death.
translation:
  language: fr
  text: Pendant six jours, le travail pourra être fait, mais le septième jour sera pour vous un jour saint, un sabbat de repos complet[a] consacré à Yahvé[b]. Quiconque y fera un travail sera mis à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un sabbat de cessation totale ». L’expression hébraïque, littéralement « sabbat, repos sabbatique », renforce l’idée d’un arrêt complet du travail.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu peut aussi se traduire par « pour Yahvé » ou « appartenant à Yahvé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה
  choice: pourra être fait
  rationale: Le nifal imparfait est passif. Cette formulation naturelle exprime ici la permission juridique sans transformer la phrase en commandement directement adressé à un sujet.
- source_word: מְלָאכָה
  choice: travail
  rationale: Dans la législation du sabbat, le terme désigne couramment le travail ou l’activité professionnelle; « travail » est clair et idiomatique.
- source_word: קֹדֶשׁ
  choice: un jour saint
  rationale: Le nom employé comme prédicat indique que le septième jour est mis à part. L’ajout de « jour », déjà présent dans le contexte immédiat, rend la phrase naturelle en français.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: un sabbat de repos complet
  rationale: La répétition lexicale intensifie l’idée de cessation du travail. « Repos complet » la communique sans introduire la notion distincte de solennité.
- source_word: לַיהוָה
  choice: consacré à Yahvé
  rationale: La préposition ל marque ici l’orientation, la destination ou l’appartenance sacrée. « Consacré à » explicite naturellement ce rapport tout en gardant sa portée cultuelle.
- source_word: כָּל הָעֹשֶׂה
  choice: Quiconque fera
  rationale: Cette construction introduit un cas juridique général et conserve sa portée universelle.
- source_word: בּוֹ
  choice: y
  rationale: Le pronom renvoie au septième jour; « y » est l’équivalent français naturel de « pendant ce jour-là ».
- source_word: יוּמָת
  choice: sera mis à mort
  rationale: Le hofal de מות est un passif causatif exprimant la peine capitale. Aucun infinitif absolu n’accompagne ici le verbe; il n’est donc pas nécessaire d’ajouter « certainement ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le Tétragramme. « Yahvé » représente le nom d’alliance dans une forme française reconnue, plutôt que de le remplacer par un titre.
- issue: Rapport exprimé par ל dans לַיהוָה
  choice: consacré à Yahvé
  alternative: pour Yahvé; appartenant à Yahvé
  rationale: Le contexte d’un jour saint permet de comprendre la préposition comme marquant la consécration ou l’orientation vers Yahvé, sans exclure les nuances de destination et d’appartenance signalées en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe juridique reste ferme sans archaïsmes. « Sabbat » est conservé comme terme biblique courant, et la peine est formulée au passif comme dans l’hébreu.
