revisions:
- from: Tous ceux qui prélevaient une offrande d’argent ou de bronze[a] apportèrent l’offrande de Yahweh, et tous ceux qui avaient à leur disposition du bois d’acacia[b] en apportèrent pour tous les travaux du service.
  to: Tous ceux qui offraient une contribution d’argent ou de bronze[a] apportèrent la contribution pour Yahweh, et tous ceux qui avaient à leur disposition du bois d’acacia[b] en apportèrent pour tous les travaux du service.
  rationale: La révision remplace deux formulations françaises qui risquaient de fausser ou d’obscurcir le sens. Elle conserve le nom divin, la nuance distributive signalée en note, l’idiome de disponibilité du bois et la distinction entre les travaux et le service.
