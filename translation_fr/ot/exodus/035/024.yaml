source:
  edition: WLC
  text: כָּל מֵרִ֗ים תְּר֤וּמַת כֶּ֨סֶף֙ וּ/נְחֹ֔שֶׁת הֵבִ֕יאוּ אֵ֖ת תְּרוּמַ֣ת יְהוָ֑ה וְ/כֹ֡ל אֲשֶׁר֩ נִמְצָ֨א אִתּ֜/וֹ עֲצֵ֥י שִׁטִּ֛ים לְ/כָל מְלֶ֥אכֶת הָ/עֲבֹדָ֖ה הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/024.yaml
  text: Everyone who offered a contribution of silver or bronze brought Yahweh’s contribution[b][a], and everyone with whom acacia wood was found for any work of the service brought it.
translation:
  language: fr
  text: Tous ceux qui offraient une contribution d’argent ou de bronze[a] apportèrent la contribution pour Yahweh, et tous ceux qui avaient à leur disposition du bois d’acacia[b] en apportèrent pour tous les travaux du service.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une contribution d’argent et de bronze ». La conjonction hébraïque permet cette traduction, mais le sens paraît distributif : chacun apportait le métal dont il disposait.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « auprès de qui se trouvait du bois d’acacia », tournure hébraïque indiquant que ce bois était en sa possession ou à sa disposition.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מֵרִים
  choice: Tous ceux qui prélevaient
  rationale: Le participe de רוּם associé à תְּרוּמָה désigne l’action de prélever ou de présenter une contribution. « Prélevaient » conserve l’idée d’une part mise à part tout en restant naturel en français.
- source_word: תְּרוּמַת כֶּסֶף וּנְחֹשֶׁת
  choice: une offrande d’argent ou de bronze
  rationale: תְּרוּמָה désigne une contribution mise à part, ici pour un usage sacré. נְחֹשֶׁת peut signifier cuivre ou bronze ; « bronze » convient au vocabulaire des matériaux du sanctuaire. « Ou » exprime naturellement la portée distributive, sans masquer la possibilité formelle de traduire la conjonction par « et ».
- source_word: הֵבִיאוּ אֵת תְּרוּמַת יְהוָה
  choice: apportèrent l’offrande de Yahweh
  rationale: 'La construction génitive תְּרוּמַת יְהוָה est conservée sans la transformer en simple destination : il s’agit de l’offrande appartenant à Yahweh ou mise à part pour lui.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu directement par « Yahweh », conformément à sa fonction de nom propre dans le texte hébreu.
- source_word: וְכֹל אֲשֶׁר נִמְצָא אִתּוֹ
  choice: et tous ceux qui avaient à leur disposition
  rationale: Littéralement, l’hébreu dit « tous ceux auprès de qui il s’en trouvait ». La formulation française exprime l’idiome de possession ou de disponibilité sans modifier son sens.
- source_word: עֲצֵי שִׁטִּים
  choice: du bois d’acacia
  rationale: « Bois d’acacia » est l’équivalent moderne usuel et compréhensible du matériau désigné, préférable à une translittération.
- source_word: לְכָל מְלֶאכֶת הָעֲבֹדָה
  choice: pour tous les travaux du service
  rationale: « Travaux » rend מְלָאכָה et « service » rend עֲבֹדָה, maintenant les deux notions sans ajouter explicitement « du sanctuaire », absent de ce verset.
- source_word: הֵבִיאוּ
  choice: en apportèrent
  rationale: Le pronom « en » reprend naturellement le bois d’acacia, nom massif, et complète le verbe en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le verset emploie directement le tétragramme. « Yahweh » préserve sa valeur de nom propre et évite de le remplacer par un titre.
- issue: Rapport exprimé par תְּרוּמַת יְהוָה
  choice: l’offrande de Yahweh
  alternative: l’offrande pour Yahweh
  rationale: Le génitif hébreu peut évoquer l’appartenance ou la destination sacrée. La formulation « de Yahweh » conserve cette tension au lieu de réduire le rapport à la seule destination.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le parallélisme des deux groupes de donateurs et les deux termes distincts correspondant aux travaux et au service, tout en explicitant seulement les idiomes nécessaires à une lecture naturelle.
