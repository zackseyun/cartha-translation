  text: וַ/יְמַלֵּ֥א אֹת֖/וֹ ר֣וּחַ אֱלֹהִ֑ים בְּ/חָכְמָ֛ה בִּ/תְבוּנָ֥ה וּ/בְ/דַ֖עַת וּ/בְ/כָל מְלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/031.yaml
  text: and he filled him with the Spirit of God[a], with wisdom, with understanding, and with knowledge[b], and with every kind of craftsmanship.
translation:
  language: fr
  text: Il le remplit de l’Esprit de Dieu[a], de sagesse, d’intelligence, de connaissance et de tout savoir-faire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’esprit de Dieu » ou « d’un esprit divin ». L’expression hébraïque peut avoir un sens plus général, mais elle désigne probablement ici l’Esprit propre de Dieu, qui rend Betsaléel capable d’accomplir sa tâche.
    reason: alternative_reading
  - marker: b
    text: Ou « de toute aptitude au travail » ou « dans toutes sortes de travaux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא
  choice: Il le remplit
  rationale: Le piel narratif est rendu par un passé simple, naturel dans un récit biblique français. Le sujet, Dieu, est repris du contexte précédent, et le pronom divin ne reçoit pas de majuscule absente de l’hébreu.
- source_word: אֹתוֹ
  choice: le
  rationale: Le pronom objet renvoie à Betsaléel, nommé au verset précédent.
- source_word: רוּחַ אֱלֹהִים
  choice: l’Esprit de Dieu
  rationale: Dans ce contexte où Dieu rend Betsaléel capable d’accomplir un service sacré, l’expression désigne très probablement l’Esprit propre de Dieu. La note conserve les autres analyses grammaticalement possibles.
- source_word: בְּחָכְמָה
  choice: de sagesse
  rationale: La préposition ב introduit ici ce dont Betsaléel est rempli. « Sagesse » garde le sens large de חָכְמָה, qui comprend dans ce contexte une capacité pratique reçue de Dieu.
- source_word: בִּתְבוּנָה
  choice: d’intelligence
  rationale: « Intelligence » exprime la compréhension et le discernement associés à תְבוּנָה, tout en maintenant la distinction avec sagesse et connaissance.
- source_word: וּבְדַעַת
  choice: de connaissance
  rationale: « Connaissance » est le sens premier de דַּעַת. Le terme n’est pas réduit à la seule habileté technique, malgré le contexte artisanal.
- source_word: וּבְכָל מְלָאכָה
  choice: et de tout savoir-faire
  rationale: Dans le contexte de la fabrication du sanctuaire, מְלָאכָה évoque le travail spécialisé. « Savoir-faire » est naturel en français moderne et s’intègre à la construction « remplir de », tout en laissant en note les rendus plus formels.
theological_decisions:
- issue: Faut-il comprendre רוּחַ אֱלֹהִים personnellement comme l’Esprit propre de Dieu, ou plus généralement comme un esprit de Dieu ou un esprit divin ?
  choice: l’Esprit de Dieu
  alternative: l’esprit de Dieu ; un esprit divin
  rationale: Le contexte immédiat présente Dieu comme celui qui équipe Betsaléel pour le service du sanctuaire ; la lecture personnelle est donc la plus probable. Toutefois, l’hébreu sans article permet une compréhension plus générale, préservée en note afin de ne pas supprimer l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique. La série nominale reste proche de la structure hébraïque, tandis que « tout savoir-faire » évite une formulation française lourde et fait ressortir le contexte artisanal.
