lexical_decisions:
- source_word: יִתְדֹת
  choice: piquets
  rationale: Le terme désigne les pièces enfoncées dans le sol pour maintenir la structure et les tentures. « Piquets » est précis, naturel et convient aux deux occurrences.
- source_word: הַמִּשְׁכָּן
  choice: du tabernacle
  rationale: « Tabernacle » est le terme français consacré pour la demeure sacrée décrite dans l’Exode et demeure compréhensible dans ce contexte.
- source_word: הֶחָצֵר
  choice: de la cour
  rationale: Dans ce contexte, חָצֵר désigne l’espace extérieur clos entourant le tabernacle. « Cour » est naturel et précis en français.
- source_word: מֵיתְרֵיהֶם
  choice: leurs cordes
  rationale: Le mot désigne les cordages associés aux piquets et aux éléments de l’installation. « Cordes » est courant et concret en français.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: les piquets… les piquets… et leurs cordes
  rationale: Les marqueurs d’objet ne se traduisent pas directement. La coordination française conserve la structure cumulative de l’inventaire sans alourdir la phrase par la répétition de « et ».
