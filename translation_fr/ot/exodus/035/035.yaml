  text: מִלֵּ֨א אֹתָ֜/ם חָכְמַת לֵ֗ב לַ/עֲשׂוֹת֮ כָּל מְלֶ֣אכֶת חָרָ֣שׁ וְ/חֹשֵׁב֒ וְ/רֹקֵ֞ם בַּ/תְּכֵ֣לֶת וּ/בָֽ/אַרְגָּמָ֗ן בְּ/תוֹלַ֧עַת הַ/שָּׁנִ֛י וּ/בַ/שֵּׁ֖שׁ וְ/אֹרֵ֑ג עֹשֵׂי֙ כָּל מְלָאכָ֔ה וְ/חֹשְׁבֵ֖י מַחֲשָׁבֹֽת־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/035.yaml
  text: He has filled them with wisdom of heart to do every kind of work of an engraver[a], a designer, and an embroiderer in blue, in purple, in scarlet yarn, and in fine linen[c][b], and of a weaver—makers of every kind of work and designers of designs.
translation:
  language: fr
  text: 'Il les a remplis de sagesse du cœur[b] pour exécuter toutes sortes de travaux : ceux du graveur[a], du concepteur, du brodeur en fil bleu, pourpre et écarlate, et en fin lin, ainsi que ceux du tisserand. Ils réalisent toutes sortes d’ouvrages et conçoivent des motifs[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus largement, « artisan ». Le terme hébreu peut désigner un artisan qualifié en général ; ici, il semble viser un métier particulier lié aux ouvrages du sanctuaire.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sagesse du cœur », expression hébraïque qui désigne une aptitude intérieure faite de discernement, de savoir-faire et d’habileté.'
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « penser des pensées » ou « concevoir des conceptions ». L’hébreu répète des mots de la même racine pour souligner l’élaboration de motifs artistiques.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא
  choice: Il les a remplis
  rationale: Le piel de מלא signifie « remplir ». Le passé composé rend naturellement en français l’accompli hébreu dans ce contexte récapitulatif.
- source_word: חָכְמַת לֵב
  choice: sagesse du cœur
  rationale: La formulation conserve l’image hébraïque, qui unit aptitude intérieure, discernement et savoir-faire, avec une note explicative.
- source_word: לַעֲשׂוֹת כָּל מְלֶאכֶת
  choice: pour exécuter toutes sortes de travaux
  rationale: Cette tournure française exprime la finalité de l’infinitif et la portée globale de כל, tandis que « travaux » convient au travail artisanal qualifié.
- source_word: חָרָשׁ
  choice: graveur
  rationale: Dans la liste des métiers du sanctuaire, « graveur » désigne plausiblement une catégorie précise d’artisan, tout en signalant en note le sens plus large possible.
- source_word: חֹשֵׁב
  choice: concepteur
  rationale: Dans ce contexte artisanal, le participe désigne celui qui conçoit ou élabore des motifs; « concepteur » est actuel et distinct de l’exécutant.
- source_word: רֹקֵם
  choice: brodeur
  rationale: Le mot désigne le spécialiste du travail textile décoratif; « brodeur » est le terme français direct.
- source_word: תְּכֵלֶת וְאַרְגָּמָן בְּתוֹלַעַת הַשָּׁנִי
  choice: étoffe bleue, pourpre et écarlate
  rationale: Les termes désignent des matières textiles caractérisées par leur teinture. « Étoffe » explicite sobrement le domaine textile sans imposer partout « fil ».
- source_word: שֵׁשׁ
  choice: fin lin
  rationale: Dans les textes du sanctuaire, שש désigne le lin fin; cette traduction traditionnelle reste claire en français moderne.
- source_word: אֹרֵג
  choice: tisserand
  rationale: Équivalent direct du participe désignant celui qui tisse.
- source_word: עֹשֵׂי כָּל מְלָאכָה
  choice: Ils savent réaliser toutes sortes d’ouvrages
  rationale: La reprise sous forme d’une phrase autonome évite une apposition lourde en français tout en conservant l’idée d’artisans capables d’accomplir tout genre de travail.
- source_word: חֹשְׁבֵי מַחֲשָׁבֹת
  choice: concevoir des motifs
  rationale: La racine répétée en hébreu souligne l’activité de conception. Le français naturel emploie ici le verbe « concevoir » et le nom « motifs »; une note signale la répétition littérale.
theological_decisions:
- issue: Référent du sujet implicite de מִלֵּא
  choice: « Il », renvoyant à Dieu dans le contexte immédiat
  alternative: Répéter explicitement « Dieu » ou « le Seigneur »
  rationale: Le verset hébreu conserve le sujet pronominal implicite. « Il » respecte cette cohésion contextuelle sans introduire un nom divin absent du verset.
- issue: Nature de חָכְמַת לֵב
  choice: Conserver « sagesse du cœur »
  alternative: Réduire à « habileté » ou « savoir-faire »
  rationale: La formule hébraïque ne se limite pas à une compétence technique; elle maintient ensemble sagesse, discernement intérieur et capacité artisanale, sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La structure a été légèrement réorganisée en deux phrases pour éviter une accumulation nominale peu naturelle, sans supprimer la reprise finale de l’hébreu. Les termes de métier restent précis, et les ambiguïtés lexicales importantes sont conservées en notes.
