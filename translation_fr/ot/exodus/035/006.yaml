  text: and blue[a], and purple, and scarlet yarn, and fine linen, and goats’ hair,
translation:
  language: fr
  text: du fil bleu, de la pourpre, du fil écarlate, du fin lin et du poil de chèvre[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « chèvres » ; dans ce contexte, il s’agit du poil de chèvre utilisé comme matériau pour le sanctuaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְכֵלֶת
  choice: fil bleu
  rationale: Le terme désigne une matière textile teinte en bleu ou bleu violacé. Dans cette liste de matériaux destinés au sanctuaire, « fil bleu » exprime naturellement à la fois la couleur et la nature textile.
- source_word: אַרְגָּמָן
  choice: pourpre
  rationale: Le nom désigne une matière textile teinte en pourpre. Le français permet à « pourpre » de nommer cette matière précieuse sans préciser indûment s’il s’agit de fil ou d’étoffe.
- source_word: תוֹלַעַת שָׁנִי
  choice: fil écarlate
  rationale: L’expression désigne une matière teinte en écarlate au moyen d’un colorant d’origine animale. « Fil écarlate » convient au contexte textile sans reproduire littéralement l’image du ver, qui serait trompeuse.
- source_word: שֵׁשׁ
  choice: fin lin
  rationale: Dans les passages relatifs au sanctuaire, ce terme désigne habituellement un lin de qualité fine; « fin lin » conserve cette distinction.
- source_word: עִזִּים
  choice: poil de chèvre
  rationale: Le mot hébreu signifie littéralement « chèvres », mais il désigne ici, par métonymie, leur poil employé comme matériau de tissage.
- source_word: וְ
  choice: et / coordination de liste
  rationale: La répétition hébraïque de la conjonction structure l’énumération. En français, des virgules puis « et » avant le dernier élément rendent cette coordination plus naturellement sans changer le contenu.
