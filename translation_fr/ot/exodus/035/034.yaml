base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/034.yaml
  text: And he has put in his heart the ability to teach[a], both he and Oholiab son of Ahisamach, of the tribe of Dan.
translation:
  language: fr
  text: Il a aussi mis dans le cœur de Betsaléel et d’Oholiab, fils d’Ahisamak, de la tribu de Dan, la capacité d’enseigner[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’instruire ». Le verbe hébreu peut désigner l’enseignement au sens large, notamment la transmission d’un savoir-faire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהוֹרֹת
  choice: la capacité d’enseigner
  rationale: L’infinitif hiphil de ירה signifie ici « enseigner » ou « instruire ». L’ajout de « la capacité de » exprime naturellement en français le don intérieur communiqué par Dieu, notamment pour transmettre un savoir-faire.
- source_word: נָתַן בְּלִבּוֹ
  choice: leur a donné
  rationale: L’expression hébraïque évoque ce que Dieu a placé intérieurement dans le cœur. En français courant, « leur a donné » rend clairement cette aptitude accordée par Dieu; le singulier hébreu est distribué aux deux hommes nommés dans la suite.
- source_word: הוּא וְאָהֳלִיאָב
  choice: à lui et à Oholiab
  rationale: Le pronom explicite met en relation le premier artisan mentionné dans le contexte, Betsaléel, et Oholiab. Cette tournure conserve l’accent du pronom sans répéter un nom absent du verset hébreu.
- source_word: בֶּן אֲחִיסָמָךְ
  choice: fils d’Ahisamak
  rationale: Formule filiale directe, conforme au style généalogique du texte.
- source_word: לְמַטֵּה דָן
  choice: de la tribu de Dan
  rationale: La préposition לְ marque ici l’appartenance tribale; cette formulation est idiomatique et précise en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le pluriel « leur » anticipe naturellement les deux bénéficiaires, tandis que « à lui et à Oholiab » préserve le pronom emphatique hébreu et évite d’introduire dans le verset le nom de Betsaléel, fourni seulement par le contexte.
