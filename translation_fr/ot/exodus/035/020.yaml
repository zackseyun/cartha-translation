  text: וַ/יֵּֽצְא֛וּ כָּל עֲדַ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל מִ/לִּ/פְנֵ֥י מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/020.yaml
  text: Then all the congregation of the sons of Israel went out from before Moses[a][b].
translation:
  language: fr
  text: Alors toute la communauté[a] des fils d’Israël[b] se retira de devant Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’assemblée ».
    reason: lexical_alternative
  - marker: b
    text: On peut aussi traduire « des enfants d’Israël » ou, plus simplement, « des Israélites ». L’hébreu dit littéralement « des fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Alors … se retira
  rationale: Le wayyiqtol de יצא fait progresser le récit. « Alors » exprime l’enchaînement narratif, et « se retira » indique naturellement en français que le groupe quitta l’endroit où se trouvait Moïse.
- source_word: כָּל
  choice: toute
  rationale: כָּל porte sur l’ensemble de la communauté et souligne sa totalité.
- source_word: עֲדַת
  choice: la communauté
  rationale: עֵדָה désigne ici la collectivité d’Israël réunie devant Moïse. « Communauté » est courant, collectif et naturel en français moderne; « assemblée » reste possible.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: des fils d’Israël
  rationale: Cette formulation conserve la valeur formelle de בְּנֵי, masculin pluriel construit de « fils », ainsi que le nom ancestral Israël. « Les Israélites » serait plus idiomatique mais moins proche de la forme hébraïque.
- source_word: מִלִּפְנֵי
  choice: de devant
  rationale: L’expression signifie littéralement « de devant » quelqu’un, c’est-à-dire en quittant sa présence. La formulation retenue préserve l’image spatiale hébraïque sans ajouter d’interprétation.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et standard du nom hébreu מֹשֶׁה.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve l’expression spatiale « de devant Moïse » et la désignation formelle « fils d’Israël », tout en employant « se retira » pour rendre naturellement le départ du groupe.
