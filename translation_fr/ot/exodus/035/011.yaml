translation_notes:
  register: Français international moderne, digne et concret. L’énumération nominale et les possessifs répétés reproduisent la structure concise de l’hébreu. « Sanctuaire » évite l’archaïsme relatif de « tabernacle », tandis que la note conserve le sens littéral de « Demeure ».
