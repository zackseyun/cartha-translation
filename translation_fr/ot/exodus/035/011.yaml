  text: the tabernacle[a], its tent, and its covering; its clasps, its boards, its bars, its pillars, and its bases[b];
translation:
  language: fr
  text: le sanctuaire[a], sa tente et sa couverture, ses agrafes, ses planches[b], ses traverses, ses poteaux et ses socles[c] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la Demeure » pour הַמִּשְׁכָּן, terme qui présente le sanctuaire comme le lieu où Dieu demeure au milieu d’Israël.
    reason: lexical_alternative
  - marker: b
    text: Ou « cadres » pour קְרָשָׁיו, si le terme désigne une ossature plutôt que des planches pleines.
    reason: lexical_alternative
  - marker: c
    text: Ou « embases » pour אֲדָנָיו, en insistant sur les pièces qui recevaient les éléments de la structure.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: le sanctuaire
  rationale: Dans ce contexte, מִשְׁכָּן désigne la demeure sacrée de YHWH au milieu d’Israël. « Sanctuaire » est naturel en français moderne et distingue l’ensemble de « sa tente », mentionnée juste après.
- source_word: אָהֳלוֹ
  choice: sa tente
  rationale: אָהֶל signifie « tente » ; le suffixe renvoie grammaticalement au sanctuaire et marque ici un élément de l’ensemble.
- source_word: מִכְסֵהוּ
  choice: sa couverture
  rationale: מִכְסֶה désigne ce qui recouvre et protège. « Couverture » conserve la généralité du terme hébreu sans préciser le matériau.
- source_word: קְרָסָיו
  choice: ses agrafes
  rationale: קֶרֶס désigne les pièces qui relient les tentures. « Agrafes » exprime clairement cette fonction dans un registre architectural courant.
- source_word: קְרָשָׁיו
  choice: ses planches
  rationale: קֶרֶשׁ désigne traditionnellement les éléments rigides de la structure. « Planches » reste direct, tout en signalant en note l’interprétation possible « cadres ».
- source_word: בְּרִיחָיו
  choice: ses traverses
  rationale: בְּרִיחַ désigne des barres horizontales maintenant ensemble les éléments de la structure. « Traverses » rend naturellement cette fonction en français.
- source_word: עַמֻּדָיו
  choice: ses poteaux
  rationale: עַמּוּד désigne ici des supports verticaux. « Poteaux » convient mieux à cette construction démontable que « colonnes ».
- source_word: אֲדָנָיו
  choice: ses socles
  rationale: אֶדֶן désigne les pièces de base recevant et soutenant les éléments verticaux. « Socles » est précis et naturel, tandis que « embases » reste une possibilité technique.
