id: EXO.35.10
reference: Exodus 35:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כָל חֲכַם לֵ֖ב בָּ/כֶ֑ם יָבֹ֣אוּ וְ/יַעֲשׂ֔וּ אֵ֛ת כָּל אֲשֶׁ֥ר צִוָּ֖ה יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/010.yaml
  text: And every skillful person among you shall come and make all that Yahweh has commanded:[a][b]
translation:
  language: fr
  text: Que toute personne habile parmi vous vienne et réalise tout ce que Yahweh a ordonné :[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « sage de cœur », expression qui désigne ici une personne douée ou compétente, notamment dans les travaux artisanaux.
    reason: lexical_alternative
  - marker: b
    text: Ou « que quiconque est habile parmi vous vienne ». En hébreu, l’expression est au masculin singulier, avec une valeur distributive.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָל
  choice: Que toute
  rationale: כָל devant un nom singulier a ici une valeur distributive (« toute personne »). En français, la tournure injonctive « Que… vienne » rend naturellement la coordination avec le contexte et la force directive de l’imparfait.
- source_word: חֲכַם לֵב
  choice: personne habile
  rationale: L’expression signifie littéralement « sage de cœur », mais désigne ici l’aptitude pratique, notamment artisanale. « Personne habile » restitue ce sens sans limiter indûment le groupe aux hommes.
- source_word: בָּכֶם
  choice: parmi vous
  rationale: La préposition ב avec le suffixe de deuxième personne du pluriel situe les personnes concernées au sein de la communauté.
- source_word: יָבֹאוּ
  choice: vienne
  rationale: L’imparfait pluriel exprime ici une invitation ou directive. Le français emploie naturellement le subjonctif singulier après le sujet distributif « toute personne ».
- source_word: וְיַעֲשׂוּ
  choice: et réalise
  rationale: עָשָׂה peut signifier « faire » ou « fabriquer ». « Réaliser » convient à l’ensemble des objets et travaux commandés, tout en conservant la portée concrète du contexte.
- source_word: אֵת כָּל אֲשֶׁר
  choice: tout ce que
  rationale: Cette formulation française rend idiomatiquement la totalité introduite par le marqueur d’objet et la proposition relative.
- source_word: צִוָּה יְהוָה
  choice: Yahweh a ordonné
  rationale: Le parfait indique que l’ordre a déjà été donné. « Yahweh » représente directement le nom divin יהוה.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » préserve le nom propre de l’alliance plutôt que de le remplacer par un titre.
- issue: Portée de חֲכַם לֵב au masculin singulier
  choice: toute personne habile
  alternative: tout homme habile
  rationale: Le masculin singulier a une force distributive et représentative dans ce contexte. Le sens vise les membres qualifiés de la communauté, sans que le verset affirme explicitement qu’il s’agit uniquement d’hommes. Une note conserve la particularité grammaticale.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation injonctive « Que… vienne » évite un futur français ambigu, tandis que « réalise » couvre les divers travaux de confection annoncés dans la suite. Les deux appels de note figurent après les deux-points, conformément à la ponctuation fournie.
