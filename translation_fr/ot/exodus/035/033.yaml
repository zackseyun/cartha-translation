  text: וּ/בַ/חֲרֹ֥שֶׁת אֶ֛בֶן לְ/מַלֹּ֖את וּ/בַ/חֲרֹ֣שֶׁת עֵ֑ץ לַ/עֲשׂ֖וֹת בְּ/כָל מְלֶ֥אכֶת מַחֲשָֽׁבֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/033.yaml
  text: in the cutting of stones for setting[a], and in the carving of wood, to do every kind of skillful work.
translation:
  language: fr
  text: dans la taille des pierres à enchâsser et dans la sculpture du bois, pour réaliser toutes sortes d’ouvrages conçus avec art.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes sortes d’ouvrages habilement exécutés » ou « toutes sortes d’ouvrages artistiques ». Le terme hébreu évoque un travail réalisé avec réflexion, selon un plan et avec savoir-faire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת
  choice: dans la taille / dans la sculpture
  rationale: 'Le même nom désigne le travail artisanal spécialisé; la traduction varie naturellement selon le matériau : « taille » pour la pierre et « sculpture » pour le bois.'
- source_word: אֶבֶן
  choice: des pierres
  rationale: Bien que le nom hébreu soit singulier, il désigne ici la pierre de manière générique; le pluriel est idiomatique en français dans ce contexte artisanal.
- source_word: לְמַלֹּאת
  choice: à enchâsser
  rationale: Dans le contexte de la fabrication du sanctuaire, le verbe renvoie à l’insertion de pierres dans une monture. « Enchâsser » exprime précisément cette opération.
- source_word: עֵץ
  choice: du bois
  rationale: Le terme désigne ici le bois comme matériau, non un arbre vivant.
- source_word: לַעֲשׂוֹת
  choice: pour réaliser
  rationale: Avec « ouvrages », « réaliser » rend naturellement le sens large de עשה tout en conservant l’idée d’exécution.
- source_word: בְּכָל מְלֶאכֶת
  choice: toutes sortes d’ouvrages
  rationale: Cette formulation distributive exprime en français courant l’ensemble des travaux artisanaux visés.
- source_word: מַחֲשָׁבֶת
  choice: conçus avec art
  rationale: Le terme évoque un travail pensé, conçu et exécuté avec habileté. Cette expression préserve à la fois la notion de dessein et celle d’artisanat qualifié.
theological_decisions: []
