  text: the hangings of the court[a], its pillars and its bases[c][b], and the screen for the gate of the court—
translation:
  language: fr
  text: les tentures[a] de la cour, ses colonnes et ses socles[b], ainsi que le rideau de l’entrée de la cour[c] —
  philosophy: optimal-equivalence
  footnotes:
