lexical_decisions:
- source_word: קַלְעֵי
  choice: tentures
  rationale: Le terme désigne les panneaux de tissu qui formaient l’enceinte de la cour. « Tentures » est naturel en français et permet de les distinguer du rideau particulier placé à l’entrée.
- source_word: הֶחָצֵר
  choice: la cour
  rationale: Dans le contexte du sanctuaire, חָצֵר désigne l’espace extérieur délimité autour du tabernacle. « Cour » est précis, concis et usuel.
- source_word: עַמֻּדָיו
  choice: ses colonnes
  rationale: Le mot désigne les supports verticaux de l’enceinte. « Colonnes » convient au registre architectural du tabernacle, tout en restant compréhensible.
- source_word: אֲדָנֶיהָ
  choice: ses socles
  rationale: Ces éléments servaient de supports inférieurs aux colonnes. « Socles » rend clairement leur fonction sans imposer l’image plus technique de cavités d’emboîtement.
- source_word: מָסַךְ
  choice: rideau
  rationale: Dans ce contexte, le mot désigne une pièce textile fermant ou masquant l’entrée. « Rideau » est naturel en français et le distingue suffisamment des tentures de l’enceinte.
- source_word: שַׁעַר
  choice: entrée
  rationale: Bien que le terme puisse signifier « porte », il désigne ici l’ouverture donnant accès à la cour. « L’entrée » évite de suggérer une porte rigide, puisque celle-ci était fermée par un rideau.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le verset étant un élément d’une énumération commencée auparavant, la traduction conserve sa forme fragmentaire et le tiret final. Les termes architecturaux restent accessibles sans effacer les distinctions entre les tentures de l’enceinte et le rideau de l’entrée.
