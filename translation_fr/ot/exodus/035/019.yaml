  yaml_path: translation/ot/exodus/035/019.yaml
  text: the finely woven garments for ministering in the sanctuary[a], the holy garments for Aaron the priest[b], and the garments of his sons for serving as priests.
translation:
  language: fr
  text: les vêtements finement tissés[a] pour le service dans le sanctuaire[b], les vêtements sacrés destinés à Aaron, le prêtre, et les vêtements de ses fils afin qu’ils exercent la fonction de prêtres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les vêtements de service » ; le sens du terme hébreu rare est incertain et peut désigner des vêtements spécialement tissés pour le service.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans le lieu saint ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי
  choice: vêtements
  rationale: « Vêtements » rend directement le terme courant sans introduire le vocabulaire ecclésiastique plus tardif de « ornements » ou de « vêtements liturgiques ».
- source_word: הַשְּׂרָד
  choice: finement tissés
  rationale: Dans ce contexte textile du sanctuaire, cette traduction exprime le travail spécialisé probablement désigné par ce terme rare, tout en signalant en note l’autre analyse possible, « de service ».
- source_word: לְשָׁרֵת
  choice: pour assurer le service
  rationale: Cette formulation française naturelle conserve l’idée d’un service exercé dans un cadre sacré sans préciser davantage la fonction que ne le fait le texte.
- source_word: בַּקֹּדֶשׁ
  choice: dans le sanctuaire
  rationale: Dans le contexte du tabernacle, קֹדֶשׁ désigne vraisemblablement l’espace sacré; « sanctuaire » est clair et idiomatique, tandis que « lieu saint » reste possible.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: les vêtements sacrés
  rationale: La tournure rend naturellement le syntagme « vêtements de sainteté » et leur mise à part pour le service de Dieu.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: destinés à Aaron, le prêtre
  rationale: « Destinés à » explicite sobrement la relation marquée par לְ, et l’apposition « le prêtre » identifie la fonction d’Aaron.
- source_word: בִּגְדֵי בָנָיו
  choice: les vêtements de ses fils
  rationale: Cette formulation suit de près la structure hébraïque et demeure naturelle en français.
- source_word: לְכַהֵן
  choice: pour qu’ils servent comme prêtres
  rationale: Le verbe signifie exercer la fonction de prêtre; la traduction garde sa force verbale et évite un terme plus abstrait comme « sacerdoce ».
theological_decisions:
- issue: Rapport entre בִּגְדֵי הַשְּׂרָד et בִּגְדֵי הַקֹּדֶשׁ
  choice: Présenter les vêtements finement tissés destinés au service comme un premier élément de l’énumération, puis les vêtements sacrés d’Aaron et ceux de ses fils.
  alternative: Comprendre la première expression comme une autre description, en apposition, de l’ensemble des vêtements sacerdotaux.
  rationale: La répétition de אֶת favorise une énumération d’éléments distincts, même si leurs usages sacrés peuvent se recouper. La traduction ne les fusionne donc pas sans nécessité textuelle.
- issue: Sens spatial de בַּקֹּדֶשׁ
  choice: dans le sanctuaire
  alternative: dans le lieu saint
  rationale: Le contexte indique un espace consacré plutôt que la notion abstraite de sainteté. « Sanctuaire » laisse ouverte la portée exacte de cet espace, tandis que la note conserve l’autre traduction courante.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la forme d’un élément d’énumération du contexte immédiat. « Assurer le service » et « servir comme prêtres » distinguent le service sacré général de l’exercice explicite de la fonction sacerdotale.
