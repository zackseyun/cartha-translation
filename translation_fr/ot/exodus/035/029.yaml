  terminology: « Yahweh », « offrande volontaire », « par l’intermédiaire de Moïse » et « les Israélites » conviennent au français international moderne et au sens du texte. « Contribution » dans la première proposition explicite sobrement l’objet implicite de « apporter » sans introduire un sens étranger.
