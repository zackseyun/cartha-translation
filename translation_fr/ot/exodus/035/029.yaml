  text: כָּל אִ֣ישׁ וְ/אִשָּׁ֗ה אֲשֶׁ֨ר נָדַ֣ב לִבָּ/ם֮ אֹתָ/ם֒ לְ/הָבִיא֙ לְ/כָל הַ/מְּלָאכָ֔ה אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה לַ/עֲשׂ֖וֹת בְּ/יַד מֹשֶׁ֑ה הֵבִ֧יאוּ בְנֵי יִשְׂרָאֵ֛ל נְדָבָ֖ה לַ/יהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/029.yaml
  text: Every man and woman whose heart moved them to bring something for all the work that Yahweh had commanded to be done through Moses—the children of Israel brought a freewill offering to Yahweh[a][b][c].
translation:
  language: fr
  text: Les Israélites[b], tous les hommes et toutes les femmes dont le cœur les poussait à apporter une contribution pour tous les travaux que Yahweh avait ordonné d’exécuter par l’intermédiaire de Moïse[a], apportèrent à Yahweh une offrande volontaire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « par la main de Moïse », expression qui signifie ici « par l’intermédiaire de Moïse ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les fils d’Israël », expression courante désignant les Israélites.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ וְאִשָּׁה
  choice: Tout homme et toute femme
  rationale: Cette formulation conserve la mention explicite des hommes et des femmes ainsi que la portée distributive de כָּל.
- source_word: נָדַב לִבָּם אֹתָם
  choice: dont le cœur les poussait
  rationale: L’expression hébraïque décrit une disposition intérieure volontaire; « poussait » rend l’élan du cœur sans suggérer une contrainte extérieure.
- source_word: לְהָבִיא
  choice: à apporter quelque chose
  rationale: Le verbe signifie « apporter »; « quelque chose » explicite naturellement en français l’objet sous-entendu par le contexte.
- source_word: לְכָל הַמְּלָאכָה
  choice: pour tous les travaux
  rationale: מְלָאכָה désigne ici l’ensemble des travaux nécessaires au sanctuaire et à son mobilier; le pluriel français convient naturellement à cette diversité.
- source_word: אֲשֶׁר צִוָּה יְהוָה לַעֲשׂוֹת בְּיַד מֹשֶׁה
  choice: que Yahweh avait ordonné d’exécuter par l’intermédiaire de Moïse
  rationale: « Par l’intermédiaire de Moïse » rend l’idiome בְּיַד מֹשֶׁה, littéralement « par la main de Moïse », qui exprime ici la médiation ou l’agence.
- source_word: הֵבִיאוּ בְנֵי יִשְׂרָאֵל
  choice: apportèrent, eux, les Israélites
  rationale: La reprise met en relief l’identification récapitulative du groupe après la longue proposition initiale, tout en rendant בְנֵי יִשְׂרָאֵל par l’ethnonyme français naturel « les Israélites ».
- source_word: נְדָבָה
  choice: une offrande volontaire
  rationale: Le nom désigne un don librement consenti. « Offrande volontaire » est clair, exact et idiomatique en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre et évite de le remplacer par un titre.
- issue: Caractère volontaire de la contribution
  choice: dont le cœur les poussait; une offrande volontaire
  alternative: dont le cœur les contraignait; une offrande obligatoire
  rationale: Le champ lexical de נדב souligne une volonté intérieure et un don libre; la traduction préserve cette nuance sans transformer l’élan en obligation.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la longue progression de l’hébreu, mais une reprise emphatique (« eux, les Israélites ») clarifie le sujet du verbe principal. Les marqueurs [a] et [b] figurent dans le texte principal.
