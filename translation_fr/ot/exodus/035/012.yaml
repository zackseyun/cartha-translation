  text: אֶת הָ/אָרֹ֥ן וְ/אֶת בַּדָּ֖י/ו אֶת הַ/כַּפֹּ֑רֶת וְ/אֵ֖ת פָּרֹ֥כֶת הַ/מָּסָֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/012.yaml
  text: the ark and its poles[a], the mercy seat, and the veil of the screen,
translation:
  language: fr
  text: l’arche et ses barres, le propitiatoire[a] et le voile de l’écran,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le couvercle d’expiation ».
    reason: Alternative lexicale explicitant à la fois la forme de l’objet et sa portée cultuelle.
lexical_decisions:
- source_word: הָאָרֹן
  choice: l’arche
  rationale: Dans le contexte du sanctuaire, אָרוֹן désigne le coffre sacré de l’alliance. « Arche » est le terme français consacré et précis dans ce contexte.
- source_word: בַּדָּיו
  choice: ses barres
  rationale: בַּדִּים désigne les longues barres servant à transporter le mobilier sacré. « Barres » est naturel et courant en français moderne.
- source_word: הַכַּפֹּרֶת
  choice: le propitiatoire[a]
  rationale: Le terme désigne le couvercle d’or de l’arche et possède une forte portée cultuelle liée à l’expiation. « Propitiatoire » conserve le terme biblique français établi; une formulation explicative est donnée en note.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: le voile de séparation
  rationale: פָּרֹכֶת est le voile intérieur, tandis que מָסָךְ souligne sa fonction d’écran ou de séparation. « Voile de séparation » rend naturellement l’expression construite sans lui attribuer une précision absente du texte.
- source_word: אֶת / וְאֶת
  choice: non traduits directement
  rationale: Ces particules signalent les compléments d’objet direct définis; l’énumération et la coordination françaises en rendent la fonction syntaxique.
theological_decisions:
- issue: Rendu de הַכַּפֹּרֶת dans le contexte cultuel du sanctuaire
  choice: le propitiatoire
  alternative: le couvercle d’expiation
  rationale: « Propitiatoire » préserve la désignation cultuelle traditionnelle sans réduire l’objet à un simple couvercle. Comme le mot hébreu nomme effectivement le couvercle de l’arche et évoque l’expiation, l’autre rendu possible est conservé en note.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe garde la forme d’une énumération dépendant du contexte précédent. « Barres » évite l’archaïsme de « brancards », et « voile de séparation » reste intelligible tout en conservant le registre du sanctuaire.
