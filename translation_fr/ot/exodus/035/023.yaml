base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/023.yaml
  text: And every man with whom blue yarn[a], purple yarn, scarlet yarn, fine linen, goats’ hair, ram skins dyed red, and tahash skins were found brought them.
translation:
  language: fr
  text: Tout homme chez qui se trouvaient du fil bleu, du fil pourpre, du fil écarlate, du fin lin, du poil de chèvre, des peaux de béliers teintes en rouge et des peaux de tahash[a] les apporta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu tahash désigne un animal ou un matériau dont l’identification est incertaine. On a notamment proposé « cuir fin », « peaux de marsouins » ou « peaux de dugongs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל אִישׁ
  choice: Tous ceux
  rationale: Le singulier distributif avec כָל désigne chaque membre du groupe concerné. En français, « tous ceux » rend naturellement cette valeur sans alourdir la phrase; le contexte immédiat de l’assemblée permet cette formulation collective.
- source_word: אֲשֶׁר נִמְצָא אִתּוֹ
  choice: qui avaient en leur possession
  rationale: Cette tournure française exprime clairement le sens littéral « qui se trouvait avec lui », c’est-à-dire les matériaux dont chacun disposait.
- source_word: תְּכֵלֶת
  choice: du fil bleu
  rationale: Dans le contexte du sanctuaire, le mot désigne une matière textile teinte en bleu. « Fil » explicite sobrement la nature textile probable.
- source_word: אַרְגָּמָן
  choice: pourpre
  rationale: Dans la série « du fil bleu, pourpre ou écarlate », l’ellipse de « fil » est naturelle en français et le terme désigne la matière textile teinte en pourpre.
- source_word: תוֹלַעַת שָׁנִי
  choice: écarlate
  rationale: L’expression désigne une matière teinte en écarlate ou cramoisi; « écarlate » est clair et traditionnel sans surinterprétation.
- source_word: שֵׁשׁ
  choice: du fin lin
  rationale: Dans les textes relatifs au sanctuaire, שֵׁשׁ désigne habituellement du lin de qualité; « fin lin » conserve cette nuance.
- source_word: עִזִּים
  choice: du poil de chèvre
  rationale: Bien que le terme signifie littéralement « chèvres », la liste de matériaux et l’usage pour les couvertures indiquent le poil de chèvre, non des animaux vivants.
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: des peaux de béliers teintes en rouge
  rationale: La formulation conserve à la fois la matière, l’animal d’origine et le traitement rouge exprimé par le participe.
- source_word: עֹרֹת תְּחָשִׁים
  choice: des peaux de tahash[a]
  rationale: L’identification de תְּחָשׁ demeure incertaine. La translittération évite de choisir arbitrairement un animal ou un type de cuir et la note expose l’incertitude.
- source_word: הֵבִיאוּ
  choice: les apportèrent
  rationale: Le verbe pluriel résume l’action des donateurs; le pronom reprend naturellement l’ensemble des matériaux énumérés.
