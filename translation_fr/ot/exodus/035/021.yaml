  text: וַ/יָּבֹ֕אוּ כָּל אִ֖ישׁ אֲשֶׁר נְשָׂא֣/וֹ לִבּ֑/וֹ וְ/כֹ֡ל אֲשֶׁר֩ נָדְבָ֨ה רוּח֜/וֹ אֹת֗/וֹ הֵ֠בִיאוּ אֶת תְּרוּמַ֨ת יְהוָ֜ה לִ/מְלֶ֨אכֶת אֹ֤הֶל מוֹעֵד֙ וּ/לְ/כָל עֲבֹ֣דָת֔/וֹ וּ/לְ/בִגְדֵ֖י הַ/קֹּֽדֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/021.yaml
  text: And everyone came whose heart stirred him[a], and everyone whose spirit moved him willingly brought Yahweh’s contribution for the work of the tent of meeting, for all its service[b], and for the holy garments.
translation:
  language: fr
  text: Tous ceux que leur cœur y poussait vinrent, et tous ceux dont l’esprit les disposait à donner apportèrent la contribution destinée à Yahweh[a] pour les travaux de la tente de la rencontre, pour tout son service et pour les vêtements sacrés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la contribution de Yahweh ». Il s’agit d’une contribution mise à part pour lui.
    reason: ambiguïté du rapport génitif dans תְּרוּמַת יְהוָה
lexical_decisions:
- source_word: וַיָּבֹאוּ כָּל אִישׁ
  choice: Tous ceux… vinrent
  rationale: Conserve le verbe simple « venir » et rend naturellement en français la valeur distributive de « tout homme », employé ici au sens générique.
- source_word: אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: que leur cœur poussait
  rationale: L’hébreu dit littéralement que le cœur « soulevait » la personne. « Poussait » restitue de façon claire l’image d’une impulsion intérieure sans en préciser indûment la cause.
- source_word: וְכֹל אֲשֶׁר נָדְבָה רוּחוֹ אֹתוֹ
  choice: tous ceux que leur esprit rendait généreux
  rationale: Le verbe נדב exprime une disposition volontaire et généreuse. Cette formulation préserve à la fois l’élan intérieur et la libre générosité.
- source_word: הֵבִיאוּ
  choice: apportèrent
  rationale: Correspond au geste concret consistant à apporter les matériaux offerts.
- source_word: תְּרוּמַת יְהוָה
  choice: la contribution destinée à Yahweh
  rationale: תְּרוּמָה désigne ici une contribution mise à part. Le génitif avec le nom divin peut exprimer l’appartenance ou la destination; « destinée à » explicite sobrement le sens contextuel sans suggérer que Yahweh serait lui-même le donateur.
- source_word: לִמְלֶאכֶת אֹהֶל מוֹעֵד
  choice: pour les travaux de la tente de la rencontre
  rationale: מְלָאכָה désigne l’ensemble du travail de réalisation. Le pluriel français « travaux » convient à ce contexte de fabrication et de construction.
- source_word: וּלְכָל עֲבֹדָתוֹ
  choice: pour tout son service
  rationale: עֲבֹדָה peut désigner le travail ou le service; dans le contexte cultuel de la tente, « service » conserve cette portée fonctionnelle et cultuelle.
- source_word: וּלְבִגְדֵי הַקֹּדֶשׁ
  choice: pour les vêtements sacrés
  rationale: Expression naturelle désignant les vêtements consacrés au service sacerdotal.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. La translittération « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Rapport exprimé par תְּרוּמַת יְהוָה
  choice: la contribution destinée à Yahweh
  alternative: la contribution de Yahweh
  rationale: La construction hébraïque permet plusieurs nuances. Dans ce contexte d’offrandes apportées par le peuple, la destination ou la consécration à Yahweh est la lecture la plus naturelle; une note conserve l’autre formulation possible.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe parallèle de l’hébreu est conservée, avec des formulations idiomatiques. « Tente de la rencontre » rend אֹהֶל מוֹעֵד sans archaïsme; « vêtements sacrés » est naturel dans le contexte cultuel.
