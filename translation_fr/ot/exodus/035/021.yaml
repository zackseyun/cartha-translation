  rationale: La révision remplace une formulation qui qualifiait les donateurs de « généreux » par une expression qui rend l’impulsion intérieure et la disponibilité volontaire à donner. « Y » dans « leur cœur y poussait » renvoie naturellement à leur venue et à leur participation à l’offrande, tout en évitant une image littérale peu naturelle en français.
