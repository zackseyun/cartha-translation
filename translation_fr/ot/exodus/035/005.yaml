    rationale: Cette expression peut évoquer une sélection au sein du groupe plutôt que le prélèvement de biens provenant des membres de la communauté.
  - severity: medium
    issue: « au cœur généreux » pour נְדִיב לִבּוֹ
    rationale: Le terme hébreu met avant tout l’accent sur une disposition libre ou consentante; « généreux » ajoute une nuance de libéralité qui n’est pas nécessairement exprimée.
  - severity: low
