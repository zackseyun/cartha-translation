  verdict: revise
  source_fidelity: La structure et les matériaux sont globalement fidèles, et « Yahvé » rend correctement le Tétragramme. Cependant, « parmi vous » ne rend pas précisément מֵאִתְּכֶם, qui désigne ce qui provient des membres de l’assemblée ou de leurs biens. « Au cœur généreux » infléchit נְדִיב לִבּוֹ vers la générosité plutôt que la disposition volontaire, et le subjonctif exhortatif « Que ... l’apporte » est moins direct que l’imparfait hébreu.
  naturalness: La formulation révisée est fluide en français international moderne. « Prélevez sur ce qui vous appartient » exprime sans ambiguïté la provenance de l’offrande, et la répétition « l’offrande pour Yahvé » conserve l’apposition emphatique de l’hébreu.
  terminology: « Offrande », « Yahvé », « or », « argent » et « bronze » conviennent au registre et au contexte. La note sur « cuivre » préserve utilement l’incertitude lexicale de נְחֹשֶׁת.
