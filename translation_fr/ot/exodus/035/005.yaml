  text: קְח֨וּ מֵֽ/אִתְּ/כֶ֤ם תְּרוּמָה֙ לַֽ/יהוָ֔ה כֹּ֚ל נְדִ֣יב לִבּ֔/וֹ יְבִיאֶ֕/הָ אֵ֖ת תְּרוּמַ֣ת יְהוָ֑ה זָהָ֥ב וָ/כֶ֖סֶף וּ/נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/005.yaml
  text: 'Take from among you an offering for Yahweh[a]. Everyone whose heart is willing shall bring it—Yahweh’s offering: gold, silver[b], and bronze.'
translation:
  language: fr
  text: 'Prélevez sur ce qui vous appartient une offrande pour Yahvé. Toute personne dont le cœur est disposé apportera l’offrande pour Yahvé : de l’or, de l’argent et du bronze.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du cuivre » ; le mot hébreu peut désigner le cuivre ou un alliage de cuivre, souvent rendu par « bronze » dans ce contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ מֵאִתְּכֶם
  choice: Prélevez parmi vous
  rationale: L’impératif pluriel קְחוּ commande à l’assemblée de prendre ou recueillir quelque chose provenant de la communauté. « Prélevez parmi vous » conserve à la fois l’ordre et l’idée de provenance.
- source_word: תְּרוּמָה
  choice: une offrande
  rationale: Dans le contexte des matériaux destinés au sanctuaire, le mot désigne une contribution mise à part pour un usage sacré. « Offrande » est naturel, digne et assez large pour inclure des matières premières.
- source_word: לַיהוָה / יְהוָה
  choice: pour Yahvé / à Yahvé
  rationale: Le nom divin est rendu directement par « Yahvé ». Le ל initial marque la destination ou la consécration de l’offrande.
- source_word: כֹּל נְדִיב לִבּוֹ
  choice: toute personne au cœur généreux
  rationale: L’expression décrit une disposition intérieure volontaire et généreuse. « Toute personne » rend la portée générique de כֹּל sans ajouter de distinction de sexe.
- source_word: יְבִיאֶהָ
  choice: qu’elle l’apporte
  rationale: Le hiphil imparfait exprime ici l’action attendue de la personne volontaire; le pronom féminin renvoie à l’offrande. La tournure exhortative évite de transformer le don volontaire en obligation absolue.
- source_word: אֵת תְּרוּמַת יְהוָה
  choice: comme offrande à Yahvé
  rationale: Cette expression reprend et précise l’offrande déjà mentionnée. « Comme offrande à Yahvé » exprime clairement sa destination sacrée en français naturel.
- source_word: זָהָב וָכֶסֶף וּנְחֹשֶׁת
  choice: de l’or, de l’argent et du bronze
  rationale: La liste française requiert les partitifs. Dans le contexte de l’artisanat ancien du sanctuaire, נְחֹשֶׁת est traditionnellement et plausiblement compris comme du bronze, même si le terme peut aussi désigner le cuivre.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur / Jéhovah
  rationale: Le texte hébreu emploie explicitement le Tétragramme. « Yahvé » représente le nom d’alliance comme nom propre, plutôt que de le remplacer par un titre.
- issue: Caractère volontaire de l’offrande
  choice: au cœur généreux; qu’elle l’apporte
  alternative: au cœur disposé; devra l’apporter
  rationale: Le verset associe l’acte à une disposition intérieure libre. La formulation choisie préserve cette générosité volontaire sans suggérer que chaque membre de la communauté est contraint de donner.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe garde l’adresse communautaire, le langage du cœur et la reprise de l’offrande, tout en évitant une formulation excessivement littérale ou techniquement cultuelle.
