translation:
  language: fr
  text: l’autel de l’encens et ses barres, l’huile d’onction, l’encens aromatique et le rideau pour l’entrée du tabernacle ;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: l’autel de l’encens
  rationale: Le groupe construit désigne l’autel associé à l’encens. Cette formulation est naturelle en français et conserve la précision cultuelle.
- source_word: בַּדָּיו
  choice: ses barres
  rationale: Dans le contexte du tabernacle, le terme désigne les barres servant à porter le mobilier sacré. « Barres » est précis, courant et moins explicatif que « barres de transport ».
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: l’huile d’onction
  rationale: Expression cultuelle consacrée et fidèle au rapport construit de l’hébreu.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: l’encens aromatique
  rationale: סַמִּים renvoie aux substances odoriférantes entrant dans la composition de l’encens. « Aromatique » en communique naturellement la qualité sans imposer une liste d’épices.
- source_word: מָסַךְ הַפֶּתַח
  choice: le rideau pour l’entrée
  rationale: Dans les descriptions du tabernacle, מָסָךְ désigne une tenture fermant ou protégeant une entrée. « Rideau » est plus naturel en français moderne que « écran » et convient à un objet textile.
- source_word: לְפֶתַח הַמִּשְׁכָּן
  choice: pour l’entrée du tabernacle
  rationale: Le לְ marque ici la destination ou le rapport de la tenture à l’entrée. La formulation retenue suit l’hébreu tout en évitant une répétition maladroite.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: Terme français établi pour la demeure-sanctuaire décrite dans l’Exode, assurant la cohérence référentielle.
