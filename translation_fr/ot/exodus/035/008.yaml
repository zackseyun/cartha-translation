  text: de l’huile pour l’éclairage, des aromates pour l’huile d’onction et pour l’encens aromatique,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׁמֶן
  choice: huile
  rationale: Le nom désigne généralement de l’huile, vraisemblablement de l’huile d’olive dans ce contexte. « Huile » reste fidèle sans ajouter une précision absente de l’hébreu.
- source_word: לַמָּאוֹר
  choice: pour l’éclairage
  rationale: מָאוֹר désigne la lumière ou ce qui éclaire. Dans cette liste de matériaux destinés au sanctuaire, « pour l’éclairage » exprime naturellement la fonction de l’huile.
- source_word: בְשָׂמִים
  choice: aromates
  rationale: Le pluriel désigne des substances odorantes entrant dans des préparations cultuelles. « Aromates » est précis, naturel et suffisamment large en français.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: huile d’onction
  rationale: Cette expression construite désigne l’huile consacrée servant à l’onction. « Huile d’onction » est la formulation française courante et concise.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: encens aromatique
  rationale: Littéralement « encens des aromates », l’expression désigne un mélange d’encens odorant. « Encens aromatique » rend le sens dans un français naturel sans modifier le référent cultuel.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La formulation suit la structure d’une liste commencée au verset précédent. « Éclairage » est préféré à « lumière » parce qu’il exprime clairement la destination de l’huile; « aromatique » préserve la relation entre l’encens et les substances odorantes.
