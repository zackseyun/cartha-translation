  text: des peaux de béliers teintes en rouge, des peaux de tahash[a] et du bois d’acacia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu « tahash » (תְּחָשִׁים) est de sens incertain; il a aussi été traduit par « cuir fin », « peaux de chèvres », « peaux de marsouins » ou « peaux de dugongs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹרֹת אֵילִם
  choice: peaux de béliers
  rationale: Le syntagme désigne précisément des peaux provenant de béliers, employées comme matériau.
- source_word: מְאָדָּמִים
  choice: teintes en rouge
  rationale: La forme passive indique que les peaux ont été rendues rouges; « teintes en rouge » exprime naturellement ce traitement.
- source_word: עֹרֹת תְּחָשִׁים
  choice: peaux de tahash
  rationale: L’identité du תַּחַשׁ est incertaine. La translittération préserve cette incertitude sans imposer l’identification conjecturale à un animal particulier ni transformer le terme en indication de qualité.
- source_word: עֲצֵי שִׂטִּים
  choice: bois d’acacia
  rationale: Le syntagme désigne du bois provenant d’acacias; c’est la formulation française courante et précise.
