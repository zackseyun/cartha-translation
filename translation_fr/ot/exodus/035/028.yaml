lexical_decisions:
- source_word: הַבֹּשֶׂם
  choice: le baume
  rationale: בֹּשֶׂם désigne une substance aromatique, une épice ou un baume. « Le baume » conserve ici le caractère concret du matériau apporté, sans le réduire à un parfum abstrait.
- source_word: הַשָּׁמֶן לְמָאוֹר
  choice: l’huile pour l’éclairage
  rationale: 'שֶׁמֶן signifie simplement « huile », sans préciser ici qu’il s’agit d’huile d’olive. לְמָאוֹר en indique la fonction : produire la lumière. « Pour l’éclairage » est naturel en français et n’ajoute pas une lampe particulière absente de l’hébreu.'
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: l’huile d’onction
  rationale: Cette expression construite désigne l’huile sacrée destinée à l’onction. « Huile d’onction » est la formulation française usuelle et fidèle.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: l’encens aromatique
  rationale: קְטֹרֶת désigne l’encens et סַמִּים les substances ou épices aromatiques. « L’encens aromatique » rend naturellement en français la relation entre les deux noms, sans perdre l’idée de substances odoriférantes.
- source_word: וְאֶת ... וְאֶת ... וּלְ ... וְלִ
  choice: énumération coordonnée par des virgules et « et »
  rationale: Les conjonctions hébraïques marquent la continuation d’une liste commencée au verset précédent. En français, une série avec virgules et une coordination finale restitue cette structure plus naturellement que la répétition systématique de « et ».
