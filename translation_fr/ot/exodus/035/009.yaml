  text: onyx stones[a], and stones for setting, for the ephod and for the breastpiece.
translation:
  language: fr
  text: des pierres d’onyx[a] et des pierres à enchâsser pour l’éphod et le pectoral.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu שֹׁהַם (shoham) est traditionnellement traduit par « onyx », mais l’identification exacte de cette pierre précieuse est incertaine ; il pourrait notamment désigner le béryl.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבְנֵי שֹׁהַם
  choice: pierres d’onyx
  rationale: שֹׁהַם désigne une pierre précieuse dont l’identification exacte demeure incertaine. « Onyx » est le rendu français traditionnel et convient au contexte du sanctuaire, tandis qu’une note préserve l’incertitude lexicale.
- source_word: אַבְנֵי מִלֻּאִים
  choice: pierres à enchâsser
  rationale: מִלֻּאִים renvoie ici à des pierres destinées à être insérées dans une monture. « À enchâsser » exprime naturellement et précisément cette fonction en français.
- source_word: לָאֵפֹד
  choice: pour l’éphod
  rationale: אֵפֹד est un terme technique désignant un vêtement sacerdotal. Sa translittération, consacrée en français biblique, préserve la spécificité cultuelle du terme.
- source_word: וְלַחֹשֶׁן
  choice: et le pectoral
  rationale: חֹשֶׁן désigne la pièce sacerdotale portée sur la poitrine et garnie de pierres. « Pectoral » est le terme français usuel et évite la connotation militaire de « cuirasse ».
