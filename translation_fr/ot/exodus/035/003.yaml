  text: You shall not kindle a fire in any of your dwellings on the Sabbath day.
translation:
  language: fr
  text: Vous n’allumerez pas de feu dans aucune de vos habitations le jour du sabbat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְבַעֲרוּ
  choice: allumerez
  rationale: Le piel de בער exprime ici le fait de mettre le feu ou d’allumer. « Allumer un feu » est l’expression française naturelle et précise, sans élargir l’interdiction à tout usage du feu.
- source_word: אֵשׁ
  choice: de feu
  rationale: Après « allumer », le français emploie naturellement « un feu » ou, dans une interdiction générale, « de feu ». La tournure négative « n’allumerez de feu » rend clairement la portée générale de l’hébreu.
- source_word: בְּכֹל
  choice: dans aucune
  rationale: 'Sous la négation, כֹל a une valeur distributive : l’interdiction vaut pour chacune des habitations. « Dans aucune » est idiomatique et conserve cette portée.'
- source_word: מֹשְׁבֹתֵיכֶם
  choice: vos habitations
  rationale: מוֹשָׁב désigne un lieu où l’on demeure. « Habitations » garde une portée plus large que « maisons » et évite de privilégier le sens collectif possible de « localités ».
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: le jour du sabbat
  rationale: Cette formulation française explicite le mot « jour » présent dans l’hébreu et conserve la désignation traditionnelle et intelligible du sabbat.
theological_decisions:
- issue: Portée de l’interdiction sabbatique concernant le feu
  choice: Formuler une interdiction directe d’allumer du feu dans les habitations.
  alternative: Élargir la formulation à tout usage ou entretien du feu, ou à toute activité produisant de la chaleur.
  rationale: Le texte hébreu interdit précisément d’allumer du feu. La traduction ne doit pas incorporer des développements interprétatifs ultérieurs ni trancher des questions que ce verset ne formule pas.
translation_notes:
  register: Français moderne, clair et digne. Le futur à valeur impérative (« Vous n’allumerez ») correspond au registre des commandements bibliques tout en restant courant. Aucun marqueur de note n’est nécessaire.
