id: EXO.35.4
reference: Exodus 35:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה אֶל כָּל עֲדַ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/004.yaml
  text: Then Moses said to all the congregation of the sons of Israel[a], “This is the thing that Yahweh has commanded[c][b], saying,”
translation:
  language: fr
  text: 'Moïse dit alors à toute la communauté[a] des fils d’Israël[b] : « Voici ce que[c] Yahvé a ordonné en ces termes : »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « assemblée ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Israélites » ; traditionnellement, « enfants d’Israël ».
    reason: lexical_alternative
  - marker: c
    text: 'Hébreu : « Voici la parole » ; on peut aussi comprendre « Voici la chose » ou, comme dans le texte, « Voici ce que ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit alors
  rationale: Le waw consécutif fait progresser le récit ; « alors » en restitue naturellement la valeur séquentielle.
- source_word: עֲדַת
  choice: communauté
  rationale: Le terme désigne ici la collectivité d’Israël envisagée comme un corps, possiblement réunie ; « communauté » est naturel en français moderne, tandis qu’« assemblée » demeure possible.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  rationale: Cette formulation conserve l’expression masculine et généalogique de l’hébreu, tout en désignant collectivement le peuple d’Israël.
- source_word: זֶה הַדָּבָר
  choice: Voici ce que
  rationale: Dans cette formule introductive, « Voici ce que » rend idiomatiquement l’hébreu sans imposer à דָּבָר le seul sens de « parole » ou de « chose » ; l’ambiguïté lexicale est signalée en note.
- source_word: צִוָּה
  choice: a ordonné
  rationale: Le passé composé exprime un commandement déjà donné et toujours pertinent au moment où Moïse le transmet.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » représente directement le nom divin plutôt que de lui substituer le titre « le Seigneur ».
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: La formule française introduit naturellement le contenu du commandement qui suit, tout en rendant la fonction du second לֵאמֹר.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie le nom divin lui-même. « Yahvé » en est la forme française courante et évite de remplacer le nom par un titre.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: Israélites ; enfants d’Israël
  rationale: Le choix conserve la forme masculine du texte source et sa dimension généalogique, sans nier que l’expression désigne ici la communauté nationale dans son ensemble.
- issue: Sens de זֶה הַדָּבָר
  choice: Voici ce que
  alternative: Voici la parole ; Voici la chose
  rationale: דָּבָר peut désigner une parole, une chose ou une affaire. Le contexte introduit le contenu d’un ordre ; la formulation choisie reste naturelle sans trancher excessivement la nuance lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la solennité de la proclamation tout en évitant le calque peu naturel « disant ». Le deux-points final indique que le contenu du commandement se poursuit au verset suivant.
