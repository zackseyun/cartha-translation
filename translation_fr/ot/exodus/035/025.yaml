source:
  edition: WLC
  text: וְ/כָל אִשָּׁ֥ה חַכְמַת לֵ֖ב בְּ/יָדֶ֣י/הָ טָו֑וּ וַ/יָּבִ֣יאוּ מַטְוֶ֗ה אֶֽת הַ/תְּכֵ֨לֶת֙ וְ/אֶת הָֽ/אַרְגָּמָ֔ן אֶת תּוֹלַ֥עַת הַ/שָּׁנִ֖י וְ/אֶת הַ/שֵּֽׁשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/025.yaml
  text: 'And every woman wise of heart spun with her hands[a], and they brought what they had spun: the blue, the purple, the scarlet yarn[b], and the fine linen.'
translation:
  language: fr
  text: 'Chaque femme habile[a] fila de ses mains, et toutes apportèrent ce qu’elles avaient filé : le bleu, la pourpre, l’écarlate[b] et le fin lin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « sage de cœur », expression hébraïque qui évoque un savoir-faire pratique enraciné dans la sagesse intérieure.
    reason: lexical_alternative
  - marker: b
    text: Ou « le fil bleu, le fil pourpre, le fil écarlate et le fin lin » ; après « ce qu’elles avaient filé », l’hébreu énumère simplement les matières.
    reason: alternative_reading
lexical_decisions:
- source_word: חַכְמַת לֵב
  choice: habile
  rationale: L’expression hébraïque signifie littéralement « sage de cœur » et désigne ici une sagesse intérieure qui se manifeste par un savoir-faire pratique. « Habile » rend naturellement ce sens en français moderne, tandis que la note conserve l’image hébraïque du cœur.
- source_word: בְּיָדֶיהָ
  choice: de ses mains
  rationale: Cette formulation française naturelle rend la valeur instrumentale de la préposition hébraïque et souligne le travail manuel.
- source_word: טָוּוּ
  choice: fila
  rationale: Le verbe désigne l’action de transformer des fibres en fil. Le singulier s’accorde avec le sujet distributif « chaque femme ».
- source_word: וַיָּבִיאוּ
  choice: et toutes apportèrent
  rationale: Le verbe hébreu passe au pluriel pour considérer collectivement les femmes. « Toutes » rend clairement ce changement après le singulier distributif « chaque femme ».
- source_word: מַטְוֶה
  choice: ce qu’elles avaient filé
  rationale: Le nom désigne la matière ou le fil obtenu par filage. Cette tournure claire prépare naturellement l’énumération qui suit.
- source_word: תְּכֵלֶת
  choice: le bleu
  rationale: Dans le contexte du sanctuaire, le terme désigne une matière textile teinte en bleu. La mention précédente de ce qui a été filé permet de conserver la formulation concise de l’hébreu.
- source_word: אַרְגָּמָן
  choice: la pourpre
  rationale: Rendu traditionnel et précis pour la matière textile teinte en pourpre employée dans le sanctuaire.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: l’écarlate
  rationale: L’expression désigne une matière teinte en écarlate, historiquement au moyen d’un colorant tiré d’un insecte. Le contexte du filage fournit ici le sens textile.
- source_word: שֵׁשׁ
  choice: le fin lin
  rationale: Dans les textes relatifs au sanctuaire, ce mot désigne habituellement un lin de qualité fine plutôt que le lin en général.
theological_decisions: []
