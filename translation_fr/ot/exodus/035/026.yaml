  text: And all the women whose hearts moved them with skill spun the goats' hair[a].
translation:
  language: fr
  text: Toutes les femmes que leur cœur portait à mettre en œuvre leur savoir-faire filèrent du poil de chèvre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les chèvres » ; l’hébreu emploie ici une ellipse pour désigner le poil de chèvre destiné au filage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנָּשִׁים
  choice: Toutes les femmes
  rationale: Avec un nom pluriel, כָּל exprime ici naturellement la totalité du groupe; « toutes les femmes » convient au français courant.
- source_word: אֲשֶׁר נָשָׂא לִבָּן אֹתָנָה
  choice: que leur cœur portait à
  rationale: L’expression hébraïque décrit une impulsion intérieure. La tournure française « leur cœur portait à » conserve l’image du cœur tout en exprimant naturellement la motivation.
- source_word: בְּחָכְמָה
  choice: mettre en œuvre leur savoir-faire
  rationale: Dans ce contexte artisanal, חָכְמָה désigne une compétence pratique plutôt qu’une sagesse abstraite. Cette formulation rattache clairement le savoir-faire à l’action motivée par le cœur.
- source_word: טָווּ
  choice: filèrent
  rationale: Le verbe désigne précisément l’action de filer une fibre textile; « filèrent » est direct et idiomatique.
- source_word: אֶת הָעִזִּים
  choice: du poil de chèvre
  rationale: L’hébreu dit littéralement « les chèvres », mais le contexte textile implique par ellipse leur poil. L’explicitation évite de suggérer que les femmes filaient les animaux eux-mêmes.
