  text: כַּפְתֹּרֵי/הֶ֥ם וּ/קְנֹתָ֖/ם מִמֶּ֣/נָּה יִהְי֑וּ כֻּלָּ֛/הּ מִקְשָׁ֥ה אַחַ֖ת זָהָ֥ב טָהֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/036.yaml
  text: Their buds and their branches shall be of one piece with it[b][a], all of it a single hammered work of pure gold.
translation:
  language: fr
  text: Leurs boutons et leurs branches feront corps avec elle[a] ; l’ensemble sera d’une seule pièce, façonnée au marteau[b], en or pur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « seront d’elle » ou « sortiront d’elle ». Les boutons et les branches devaient être façonnés à même le porte-lampes, et non fixés séparément.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « en ouvrage martelé ». L’hébreu souligne que tout le porte-lampes était façonné au marteau comme une seule pièce d’or pur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: leurs boutons
  rationale: Dans la description du porte-lampes, כַּפְתֹּר désigne un ornement arrondi appartenant au décor végétal. « Boutons » conserve cette image sans évoquer les chapiteaux architecturaux.
- source_word: וּקְנֹתָם
  choice: et leurs branches
  rationale: קָנֶה signifie couramment « roseau » ou « tige », mais désigne ici les bras qui se détachent du porte-lampes. « Branches » convient au motif végétal et reste naturel en français.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: feront corps avec elle
  rationale: L’expression indique que les boutons et les branches doivent être formés à même le porte-lampes, et non ajoutés séparément. Cette tournure française rend clairement l’unité matérielle tout en conservant une note pour la formulation plus littérale.
- source_word: כֻּלָּהּ
  choice: l’ensemble
  rationale: Le mot souligne que l’objet entier, sans exception, forme une unité.
- source_word: מִקְשָׁה אַחַת
  choice: d’une seule pièce, façonnée au marteau
  rationale: מִקְשָׁה désigne un ouvrage obtenu par martelage, et אַחַת en souligne l’unité. La formulation exprime à la fois le procédé de fabrication et le caractère monobloc.
- source_word: זָהָב טָהוֹר
  choice: en or pur
  rationale: « Or pur » est l’équivalent français courant et précis de cette collocation.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Porte-lampes » est sous-entendu par le féminin « elle » dans le contexte immédiat ; le verset reste syntaxiquement dépendant de la description précédente. « Feront corps avec » exprime naturellement la fabrication intégrale sans effacer le sens plus littéral donné en note.
