  text: de l’huile pour l’éclairage, des aromates pour l’huile d’onction et pour l’encens aromatique[a] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’encens des aromates » ou « l’encens fait d’aromates ».'
    reason: La formulation idiomatique française « encens aromatique » lisse la construction nominale hébraïque, que la note permet de rendre visible.
lexical_decisions:
- source_word: שֶׁמֶן
  choice: huile
  rationale: Le nom hébreu désigne l’huile sans préciser ici qu’il s’agit d’huile d’olive ; la traduction évite donc cette précision implicite.
- source_word: לַמָּאֹר
  choice: pour l’éclairage
  rationale: מָאוֹר peut désigner ce qui produit la lumière ou l’éclairage. Dans cette liste de fournitures, « pour l’éclairage » exprime naturellement la destination de l’huile sans transformer le terme en « lampe ».
- source_word: בְּשָׂמִים
  choice: aromates
  rationale: Le pluriel désigne des substances odoriférantes employées dans les préparations sacrées. « Aromates » est précis, courant et adapté au registre cultuel.
- source_word: לְשֶׁמֶן הַמִּשְׁחָה
  choice: pour l’huile d’onction
  rationale: Cette expression de destination concerne l’huile sacrée servant à l’onction ; l’article défini rend son caractère déterminé dans le contexte.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: pour l’encens aromatique
  rationale: « Encens aromatique » rend naturellement en français la construction hébraïque « encens des aromates », tout en conservant le lien lexical avec les substances odoriférantes.
