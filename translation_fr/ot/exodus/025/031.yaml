source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ מְנֹרַ֖ת זָהָ֣ב טָה֑וֹר מִקְשָׁ֞ה תֵּעָשֶׂ֤ה הַ/מְּנוֹרָה֙ יְרֵכָ֣/הּ וְ/קָנָ֔/הּ גְּבִיעֶ֛י/הָ כַּפְתֹּרֶ֥י/הָ וּ/פְרָחֶ֖י/הָ מִמֶּ֥/נָּה יִהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/031.yaml
  text: And you shall make a lampstand of pure gold[a]. The lampstand shall be made of hammered work; its base and its shaft, its cups, its buds[b], and its flowers shall be of one piece with it.
translation:
  language: fr
  text: Tu feras un chandelier en or pur. Le chandelier sera façonné au marteau[a] ; son pied et sa tige, ses coupes, ses boutons[b] et ses fleurs seront d’une seule pièce avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « sera un ouvrage martelé ». L’hébreu souligne que le chandelier devait être formé par martelage, apparemment à partir d’une seule pièce plutôt que par assemblage de plusieurs éléments.'
    reason: lexical_alternative
  - marker: b
    text: « Ses boutons » peut aussi être rendu par « ses ornements arrondis ». Le mot hébreu désigne des protubérances décoratives de forme arrondie intégrées au motif floral du chandelier.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרַת
  choice: chandelier
  rationale: Le terme désigne le support portant les lampes. « Chandelier » est le terme français établi pour cet objet cultuel, même si celui-ci portait des lampes à huile et non des bougies.
- source_word: זָהָב טָהוֹר
  choice: or pur
  rationale: Équivalent français naturel de l’expression désignant un or raffiné, sans mélange.
- source_word: מִקְשָׁה
  choice: façonné au marteau
  rationale: Le mot évoque un ouvrage métallique travaillé par martelage, probablement à partir d’une seule masse plutôt que par assemblage de pièces séparées.
- source_word: תֵּעָשֶׂה
  choice: sera façonné
  rationale: Dans ce contexte d’instruction, la forme se rend naturellement par un futur à valeur prescriptive ; « façonné » s’accorde avec le procédé de fabrication indiqué.
- source_word: יְרֵכָהּ
  choice: son pied
  rationale: Bien que le mot signifie littéralement « cuisse » ou « côté », il désigne ici la partie inférieure qui soutient l’objet. « Pied » convient à la structure d’un chandelier.
- source_word: וְקָנָהּ
  choice: sa tige
  rationale: Le singulier désigne ici la tige centrale du chandelier, avant la description des branches latérales dans les versets suivants.
- source_word: גְּבִיעֶיהָ
  choice: ses coupes
  rationale: Le terme désigne des éléments ornementaux en forme de coupe ; « coupes » en conserve clairement la forme.
- source_word: כַּפְתֹּרֶיהָ
  choice: ses boutons
  rationale: Le mot désigne des ornements arrondis en saillie. « Boutons » convient à l’imagerie végétale tout en laissant entendre leur forme arrondie.
- source_word: וּפְרָחֶיהָ
  choice: ses fleurs
  rationale: Traduction directe et naturelle de l’ornement floral explicitement nommé.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: seront d’une seule pièce avec lui
  rationale: La formule indique que les différents éléments doivent sortir du chandelier lui-même et non être fabriqués séparément puis fixés dessus.
theological_decisions: []
