  text: וְ/הֵֽבֵאתָ֤ אֶת הַ/בַּדִּים֙ בַּ/טַּבָּעֹ֔ת עַ֖ל צַלְעֹ֣ת הָ/אָרֹ֑ן לָ/שֵׂ֥את אֶת הָ/אָרֹ֖ן בָּ/הֶֽם־־׃
