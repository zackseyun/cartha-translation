  text: And you shall put the poles into the rings on the sides of the ark[a], to carry the ark with them.
translation:
  language: fr
  text: Tu introduiras les barres dans les anneaux placés sur les côtés de l’arche, afin de porter l’arche au moyen de ces barres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הֵֽבֵאתָ
  choice: Tu introduiras
  rationale: Le verbe בוא signifie fondamentalement « faire venir, apporter »; dans cette construction, il décrit la mise des barres dans les anneaux. « Introduire » exprime naturellement le mouvement sans être trop technique.
- source_word: הַ/בַּדִּים
  choice: les barres
  rationale: בדים désigne les longues pièces servant à transporter le mobilier sacré. « Barres » est courant et convient mieux ici que l’archaïque « brancards » ou le moins précis « bâtons ».
- source_word: בַּ/טַּבָּעֹת
  choice: dans les anneaux
  rationale: Avec le verbe de mouvement, la préposition ב indique ici l’entrée et le placement dans les anneaux.
- source_word: עַל צַלְעֹת הָ/אָרֹן
  choice: placés sur les côtés de l’arche
  rationale: צלעות désigne les côtés ou parties latérales. L’ajout syntaxique de « placés » rattache clairement les anneaux aux côtés, sans ajouter de contenu matériel.
- source_word: הָ/אָרֹן
  choice: l’arche
  rationale: Même si ארון peut désigner un coffre, « arche » est le terme français établi et précis dans ce contexte cultuel.
- source_word: לָ/שֵׂאת
  choice: afin de porter
  rationale: L’infinitif construit exprime le but; נשא désigne ici le transport physique.
- source_word: בָּ/הֶם
  choice: au moyen de ces barres
  rationale: Le pronom masculin pluriel renvoie aux barres et marque le moyen du transport. La reprise nominale évite l’ambiguïté que pourrait créer « avec elles » en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’ordre de l’instruction et rend explicite, uniquement pour la clarté grammaticale, que les anneaux sont situés sur les côtés de l’arche.
