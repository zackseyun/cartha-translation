  yaml_path: translation/ot/exodus/025/027.yaml
  text: The rings shall be opposite the frame[b][a], as holders for the poles to carry the table.
translation:
  language: fr
  text: Les anneaux seront placés en regard de l’encadrement[a] ; ils formeront des logements[b] pour les barres, afin de porter la table.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en face de l’encadrement », « le long de l’encadrement » ou « vis-à-vis de l’encadrement ». L’expression hébraïque indique une position relative sans en préciser exactement la disposition.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « pour des maisons pour les barres », c’est-à-dire des réceptacles dans lesquels on introduit les barres.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֻמַּת
  choice: à la hauteur de
  rationale: La locution indique une position relative ou une correspondance spatiale. Dans ce contexte de construction, « à la hauteur de » exprime cette relation sans imposer l’idée de deux éléments se faisant face.
- source_word: הַמִּסְגֶּרֶת
  choice: l’encadrement
  rationale: מִסְגֶּרֶת désigne ici l’élément qui encadre la table; « encadrement » est naturel et reste plus neutre que « rebord » quant à sa forme précise.
- source_word: תִּהְיֶיןָ
  choice: seront
  rationale: Le verbe existentiel au féminin pluriel prend ici une valeur prescriptive dans les instructions de fabrication; le futur simple français convient au registre.
- source_word: הַטַּבָּעֹת
  choice: les anneaux
  rationale: Équivalent français courant pour les anneaux métalliques destinés à recevoir les barres de transport.
- source_word: לְבָתִּים
  choice: serviront de logements
  rationale: Littéralement « pour maisons », l’expression décrit les réceptacles dans lesquels les barres sont introduites. « Logements » conserve l’image fonctionnelle tout en étant idiomatique en français.
- source_word: לְבַדִּים
  choice: pour les barres
  rationale: Dans les descriptions du mobilier du sanctuaire, בַּדִּים désigne les longues pièces servant au transport; « barres » est clair et actuel.
- source_word: לָשֵׂאת
  choice: avec lesquelles on portera
  rationale: L’infinitif exprime le but. Cette formulation relie naturellement l’action de porter aux barres sans ajouter d’agent précis.
- source_word: הַשֻּׁלְחָן
  choice: la table
  rationale: Traduction directe et habituelle de l’objet décrit dans le passage.
