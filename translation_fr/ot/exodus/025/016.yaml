source:
  edition: WLC
  text: וְ/נָתַתָּ֖ אֶל הָ/אָרֹ֑ן אֵ֚ת הָ/עֵדֻ֔ת אֲשֶׁ֥ר אֶתֵּ֖ן אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/016.yaml
  text: And you shall put into the ark the testimony that I will give you[a].
translation:
  language: fr
  text: Tu mettras dans l’arche le témoignage que je te donnerai[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus précisément dans ce contexte : « les tablettes du témoignage ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Tu mettras
  rationale: Le verbe נתן peut signifier « donner », « mettre » ou « placer ». Avec אֶל et le contenant « l’arche », il désigne ici l’action d’y déposer quelque chose. Le futur français rend naturellement l’instruction hébraïque.
- source_word: אֶל
  choice: dans
  rationale: Bien que la préposition signifie fondamentalement « vers » ou « à », la construction avec נתן et un contenant exprime ici l’introduction à l’intérieur de l’arche.
- source_word: הָאָרֹן
  choice: l’arche
  rationale: Dans le contexte du sanctuaire, « arche » est le terme français consacré et approprié pour ce coffre sacré.
- source_word: אֵת
  choice: '[marqueur de l’objet direct, non traduit]'
  rationale: אֵת introduit l’objet direct défini et n’a pas d’équivalent lexical distinct en français.
- source_word: הָעֵדֻת
  choice: le témoignage
  rationale: « Témoignage » conserve le sens de עֵדוּת sans préciser dans le texte principal qu’il s’agit des tablettes, précision fournie par le contexte plus large.
- source_word: אֲשֶׁר
  choice: que
  rationale: Le pronom relatif français « que » relie naturellement « le témoignage » au verbe dont il est l’objet.
- source_word: אֶתֵּן
  choice: je donnerai
  rationale: L’imparfait hébreu à la première personne exprime ici une action future de Dieu ; « donnerai » en conserve le sens ordinaire.
- source_word: אֵלֶיךָ
  choice: te
  rationale: Le pronom indirect suffixé est rendu idiomatiquement par « te » devant « donnerai ».
theological_decisions:
- issue: Référent du « témoignage »
  choice: Conserver « le témoignage » dans le texte principal.
  alternative: Préciser « les tablettes du témoignage ».
  rationale: Le texte hébreu de ce verset nomme seulement « le témoignage que je te donnerai ». Le contexte l’associe aux tablettes, mais ne les mentionne pas explicitement ici ; la traduction préserve donc cette formulation et place la précision en note.
translation_notes:
  register: Français moderne, international et digne. Le futur simple donne à l’instruction une formulation naturelle sans alourdir le verset d’un « Et » initial, la conjonction hébraïque assurant surtout la continuité du discours.
