  yaml_path: translation/ot/exodus/025/003.yaml
  text: 'And this is the contribution that you shall take from them: gold[a], silver, and bronze.'
translation:
  language: fr
  text: 'Voici la contribution que vous recevrez d’eux : de l’or, de l’argent et du bronze[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cuivre » ; le mot hébreu נְחֹשֶׁת peut désigner le cuivre ou le bronze selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  choice: Voici
  rationale: La tournure présentative « Voici » rend naturellement en français moderne l’introduction de la liste par וְזֹאת, sans alourdir la phrase.
- source_word: הַ/תְּרוּמָה
  choice: la contribution
  rationale: תְּרוּמָה désigne ici ce qui est mis à part et apporté pour le sanctuaire. « Contribution » convient à la collecte de matériaux sans imposer une nuance rituelle plus précise.
- source_word: אֲשֶׁר תִּקְח֖וּ מֵ/אִתָּם
  choice: que vous recevrez d’eux
  rationale: לקח signifie littéralement « prendre », mais dans le contexte d’une contribution volontaire apportée par les Israélites, « recevoir d’eux » exprime clairement la relation sans suggérer une saisie forcée. Le futur conserve la valeur directive de l’imparfait hébreu.
- source_word: זָהָב
  choice: de l’or
  rationale: Équivalent français courant du nom de matière, avec l’article partitif naturel dans cette énumération.
- source_word: וָ/כֶסֶף
  choice: de l’argent
  rationale: Équivalent français standard du métal dans ce contexte.
- source_word: וּ/נְחֹשֶׁת
  choice: du bronze
  rationale: נְחֹשֶׁת peut désigner le cuivre ou le bronze. « Bronze » est le terme traditionnel et vraisemblable pour le métal travaillé dans les descriptions du sanctuaire, tandis que l’autre possibilité est signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. « Voici » donne une présentation fluide de la liste ; les articles partitifs sont répétés pour une formulation française naturelle. Le marqueur de note est placé après « bronze », le terme auquel il se rapporte.
