  text: וְ/עָשִׂ֥יתָ אֶת נֵרֹתֶ֖י/הָ שִׁבְעָ֑ה וְ/הֶֽעֱלָה֙ אֶת נֵ֣רֹתֶ֔י/הָ וְ/הֵאִ֖יר עַל עֵ֥בֶר פָּנֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/037.yaml
  text: You shall make its seven lamps[b][a], and he shall set up its lamps so that they give light in front of it.
translation:
  language: fr
  text: Tu feras ses sept lampes. Il mettra les lampes en place[a][b], afin d’éclairer la partie située devant le chandelier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il allumera les lampes, afin d’éclairer la partie située devant le chandelier. » Le verbe hébreu signifie littéralement « faire monter » et peut, dans ce contexte, évoquer aussi bien l’allumage que la mise en place des lampes.'
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu emploie ici la troisième personne du singulier (« il »), sans nommer la personne concernée dans ce verset.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Le parfait qal avec waw a ici une valeur directive dans les instructions adressées à Moïse. Le futur français exprime naturellement cette prescription.
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: ses sept lampes
  rationale: נֵר désigne ici les lampes du chandelier, et שִׁבְעָה en indique directement le nombre.
- source_word: וְהֶעֱלָה
  choice: Il mettra les lampes en place
  rationale: Le hiphil de עלה signifie littéralement « faire monter ». Dans ce contexte cultuel, il peut évoquer la mise en place des lampes ou leur allumage. Le texte porte une troisième personne masculine singulière, distincte du « tu » précédent.
- source_word: וְהֵאִיר
  choice: afin qu’elles éclairent
  rationale: La formulation française explicite le résultat ou le but de l’action en prenant les lampes comme sujet logique de la lumière produite.
- source_word: עַל עֵבֶר פָּנֶיהָ
  choice: l’espace devant le chandelier
  rationale: L’expression désigne le côté ou la région située en face de l’avant du chandelier. Cette formulation rend clairement l’orientation de la lumière sans donner au chandelier un pronom français potentiellement ambigu.
theological_decisions:
- issue: Sujet non exprimé de וְהֶעֱלָה
  choice: 'Conserver la troisième personne du singulier : « Il mettra »'
  alternative: Employer l’indéfini « on mettra » ou reprendre « tu »
  rationale: La forme hébraïque est à la troisième personne masculine singulière. Son référent, probablement la personne chargée d’entretenir le chandelier, n’est cependant pas nommé dans ce verset; la traduction ne l’identifie donc pas explicitement à un prêtre.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement correspond à l’adresse singulière faite à Moïse. La répétition de « lampes » évite une ambiguïté pronominale, tandis que « le chandelier » explicite en français l’antécédent du suffixe hébreu.
