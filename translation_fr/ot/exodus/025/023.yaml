  text: וְ/עָשִׂ֥יתָ שֻׁלְחָ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֤יִם אָרְכּ/וֹ֙ וְ/אַמָּ֣ה רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/023.yaml
  text: You shall make a table of acacia wood[a], two cubits its length, one cubit its width, and a cubit and a half its height.
translation:
  language: fr
  text: 'Tu feras[a] une table en bois d’acacia : elle aura deux coudées de longueur, une coudée de largeur et une coudée et demie de hauteur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Et tu feras ». La conjonction hébraïque relie cette instruction aux précédentes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Dans cette suite d’instructions, le parfait qal précédé de la conjonction exprime une directive. Le futur français rend naturellement cette valeur prescriptive.
- source_word: שֻׁלְחָן
  choice: une table
  rationale: « Table » est le terme courant et précis pour ce meuble cultuel; l’article indéfini convient à sa première mention dans cette instruction.
- source_word: עֲצֵי שִׁטִּים
  choice: en bois d’acacia
  rationale: La chaîne construite désigne le matériau; « bois d’acacia » est l’équivalent français clair et traditionnel.
- source_word: אַמָּתַיִם אָרְכּוֹ
  choice: deux coudées de longueur
  rationale: Cette formulation conserve l’unité culturelle du texte et le nom « longueur » correspondant littéralement à אָרְכּוֹ.
- source_word: וְאַמָּה רָחְבּוֹ
  choice: une coudée de largeur
  rationale: Le groupe nominal reproduit clairement la formule de mesure et maintient le parallélisme avec « longueur » et « hauteur ».
- source_word: וְאַמָּה וָחֵצִי קֹמָתוֹ
  choice: une coudée et demie de hauteur
  rationale: La tournure suit de près l’ordre hébreu tout en restant idiomatique en français; dans ce contexte, קֹמָה désigne la hauteur du meuble.
