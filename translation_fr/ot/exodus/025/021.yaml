  text: וְ/נָתַתָּ֧ אֶת הַ/כַּפֹּ֛רֶת עַל הָ/אָרֹ֖ן מִ/לְ/מָ֑עְלָ/ה וְ/אֶל הָ֣/אָרֹ֔ן תִּתֵּן֙ אֶת הָ֣/עֵדֻ֔ת אֲשֶׁ֥ר אֶתֵּ֖ן אֵלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/021.yaml
  text: And you shall put the mercy seat on top of the ark[a], and into the ark you shall put the testimony that I will give you.
translation:
  language: fr
  text: Tu placeras le couvercle d’expiation[a] sur le coffre, et tu mettras dans le coffre le témoignage que je te donnerai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « propitiatoire ». Le terme hébreu désigne le couvercle du coffre et comporte des associations avec les rites d’expiation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפֹּרֶת
  choice: couvercle d’expiation
  rationale: Le terme désigne le couvercle du coffre tout en portant, dans le contexte cultuel, une association avec l’expiation. Cette formulation est claire en français moderne et conserve les deux dimensions.
- source_word: אָרוֹן
  choice: coffre
  rationale: Le mot hébreu désigne ici le coffre sacré destiné à recevoir le témoignage. « Coffre » rend concrètement l’objet sans ajouter dans ce verset un titre qui n’est pas exprimé.
- source_word: מִלְמָעְלָה
  choice: sur
  rationale: Dans cette instruction de placement, le couvercle repose au-dessus du coffre; « sur » exprime naturellement cette relation spatiale en français.
- source_word: עֵדֻת
  choice: le témoignage
  rationale: Cette traduction formellement proche préserve la portée de témoignage et d’attestation liée à l’alliance, sans préciser ici qu’il s’agit des tablettes.
- source_word: נָתַתָּ / תִּתֵּן / אֶתֵּן
  choice: placeras / mettras / donnerai
  rationale: 'La variation française suit les objets et les agents: placer le couvercle, mettre le témoignage dans le coffre, et recevoir ce que Dieu donnera.'
- source_word: אֶל הָאָרֹן
  choice: dans le coffre
  rationale: Avec le verbe נתן et le témoignage comme objet, אֶל indique ici l’introduction à l’intérieur du coffre.
theological_decisions:
- issue: Rendu de כַּפֹּרֶת, qui désigne à la fois un couvercle concret et un objet associé au rite d’expiation
  choice: couvercle d’expiation
  alternative: propitiatoire; couvercle
  rationale: « Couvercle d’expiation » identifie clairement l’objet et conserve son association cultuelle sans imposer une interprétation doctrinale plus précise. Le terme traditionnel « propitiatoire » est signalé en note.
translation_notes:
  register: Français international moderne, simple et digne. Le futur exprime naturellement l’instruction hébraïque. La répétition de « coffre » est conservée pour la clarté et pour refléter celle du texte source.
