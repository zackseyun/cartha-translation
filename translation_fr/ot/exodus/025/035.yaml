  text: and a knob under two branches from it, and a knob under two branches from it, and a knob under two branches from it, for the six branches going out from the lampstand.
translation:
  language: fr
  text: Un bouton sous deux branches issues de lui, un bouton sous deux branches issues de lui, et un bouton sous deux branches issues de lui, pour les six branches sortant du porte-lampes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַפְתֹּר
  choice: bouton
  rationale: Désigne ici un élément ornemental arrondi du porte-lampes; « bouton » reste concret et concorde avec la terminologie de l’English POB.
- source_word: קָנִים
  choice: branches
  rationale: Dans la description du porte-lampes, il s’agit des six bras latéraux qui se ramifient à partir de la tige centrale; « branches » rend naturellement cette image.
- source_word: מְנֹרָה
  choice: porte-lampes
  rationale: Le terme désigne l’ensemble du luminaire cultuel, et non une simple lampe; « porte-lampes » est clair, fonctionnel et non anachronique.
- source_word: מִמֶּנָּה / מִן הַמְּנֹרָה
  choice: qui en sortent / qui sortent du porte-lampes
  rationale: La formulation explicite l’antécédent sans modifier la structure matérielle décrite par l’hébreu.
