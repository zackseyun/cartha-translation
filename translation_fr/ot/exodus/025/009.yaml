  text: כְּ/כֹ֗ל אֲשֶׁ֤ר אֲנִי֙ מַרְאֶ֣ה אוֹתְ/ךָ֔ אֵ֚ת תַּבְנִ֣ית הַ/מִּשְׁכָּ֔ן וְ/אֵ֖ת תַּבְנִ֣ית כָּל כֵּלָ֑י/ו וְ/כֵ֖ן תַּעֲשֽׂוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/009.yaml
  text: Exactly according to all that I am showing you—the pattern of the tabernacle and the pattern of all its furnishings—so you shall make it[a][b].
translation:
  language: fr
  text: 'Vous ferez tout exactement selon tout ce que je te montre : le modèle du tabernacle et le modèle de tous ses objets.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plan », « représentation » ou « forme » pour « modèle » (תַּבְנִית).
    reason: lexical_alternative
  - marker: b
    text: 'En hébreu, « vous ferez » est au pluriel : après « je te montre », adressé à Moïse au singulier, le commandement passe au pluriel.'
    reason: grammatical_clarification
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר
  choice: exactement d’après ce que
  rationale: La préposition כְּ avec כֹּל אֲשֶׁר exprime une conformité étroite. « Exactement d’après ce que » rend cette précision en français naturel sans alourdir la phrase.
- source_word: מַרְאֶה
  choice: je te montre
  rationale: 'Le participe de ראה a ici une valeur présente et imperfective : Dieu est en train de montrer à Moïse ce qui doit servir de référence.'
- source_word: תַּבְנִית
  choice: modèle
  rationale: תַּבְנִית désigne une forme de référence, un modèle ou un plan. « Modèle » convient à quelque chose que Dieu montre, tout en laissant ouverte la nature exacte de cette représentation.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: Dans ce contexte cultuel de l’Exode, « tabernacle » est le terme français conventionnel et immédiatement reconnaissable pour la tente-sanctuaire.
- source_word: כָּל כֵּלָיו
  choice: tous ses objets
  rationale: כֵּלִים est un terme large pouvant désigner objets, ustensiles, récipients ou équipements. « Objets » évite de limiter le sens aux seuls récipients ou au mobilier.
- source_word: וְכֵן תַּעֲשׂוּ
  choice: Vous réaliserez le tout
  rationale: La formulation française rassemble naturellement l’idée de « faire ainsi » et le projet décrit. Le pluriel de « vous réaliserez » conserve le changement de nombre présent dans l’hébreu.
theological_decisions:
- issue: La nature du תַּבְנִית montré à Moïse
  choice: modèle
  alternative: plan, représentation ou forme
  rationale: Le verset ne précise pas si Moïse voit un archétype céleste, une représentation visuelle ou un plan. « Modèle » préserve cette ouverture sans imposer une ontologie particulière.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier de Moïse est conservé dans « je te montre », tandis que le pluriel du verbe final est rendu explicitement par « vous réaliserez ». « Le tout » donne au verbe un objet naturel en français et renvoie à l’ensemble du projet décrit.
