  text: onyx stones[a], and stones for setting[c][b], for the ephod and for the breastpiece.
translation:
  language: fr
  text: des pierres d’onyx[a] et des pierres à enchâsser[b] pour l’éphod et pour le pectoral[c] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « onyx » pourrait désigner une autre pierre précieuse ; son identification exacte est incertaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « des pierres à sertir » ou « des pierres destinées à être enchâssées ».
    reason: lexical_alternative
  - marker: c
    text: Traditionnellement « rational » ; le terme désigne la pièce sacerdotale portée sur la poitrine.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבְנֵי שֹׁהַם
  choice: pierres d’onyx
  rationale: שֹׁהַם désigne une pierre précieuse dont l’identification exacte demeure incertaine. « Onyx » est le terme traditionnel le plus reconnaissable, avec une note signalant l’incertitude.
- source_word: אַבְנֵי מִלֻּאִים
  choice: pierres à enchâsser
  rationale: מִלֻּאִים évoque ici des pierres destinées à être insérées dans une monture. « À enchâsser » exprime naturellement leur fonction sans préciser excessivement la technique.
- source_word: לָאֵפֹד
  choice: pour l’éphod
  rationale: אֵפוֹד est le nom technique d’un vêtement sacerdotal. La translittération française usuelle préserve ce référent particulier.
- source_word: וְלַחֹשֶׁן
  choice: et pour le pectoral
  rationale: חֹשֶׁן désigne la pièce sacerdotale portée sur la poitrine et garnie de pierres. « Pectoral » est le terme français usuel et n’évoque pas nécessairement une armure.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le caractère bref d’une liste de matériaux. « Éphod » reste un terme technique, tandis que « pectoral » est plus clair aujourd’hui que le traditionnel « rational ». Le point-virgule final convient à la continuité syntaxique du verset précédent et de l’inventaire.
