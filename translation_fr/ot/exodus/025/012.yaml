base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/012.yaml
  text: 'And you shall cast four rings of gold for it and put them on its four feet: two rings on one side of it and two rings on its second side[a].'
translation:
  language: fr
  text: 'Tu fondras pour elle quatre anneaux d’or et tu les placeras sur ses quatre pieds : deux anneaux sur l’un de ses côtés et deux anneaux sur l’autre côté.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses quatre coins » au lieu de « ses quatre pieds ». Le terme hébreu est difficile, mais il désigne probablement les appuis ou les parties inférieures de l’arche plutôt que de simples points d’angle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצַקְתָּ
  choice: Tu fondras
  rationale: Dans le contexte de la fabrication de pièces en or, יצק désigne la coulée du métal dans un moule. « Fondre » est la formulation française usuelle pour fabriquer des objets métalliques par ce procédé.
- source_word: טַבְּעֹת
  choice: anneaux
  rationale: Le nom désigne ici les anneaux métalliques destinés aux barres de transport de l’arche.
- source_word: זָהָב
  choice: or
  rationale: Désignation directe du matériau.
- source_word: וְנָתַתָּה
  choice: tu les placeras
  rationale: נתן a un sens large; « placer » exprime naturellement ici la fixation ou la mise en position des anneaux. Le pronom « les » explicite en français l’objet sous-entendu par la forme hébraïque.
- source_word: פַּעֲמֹתָיו
  choice: ses quatre pieds
  rationale: Le terme difficile semble désigner les appuis ou parties inférieures de l’arche. « Pieds » conserve son image concrète sans remplacer celle-ci par l’interprétation plus abstraite de « coins ».
- source_word: צַלְעוֹ
  choice: l’un de ses côtés
  rationale: Dans le contexte d’un objet construit, צלע désigne naturellement un côté ou flanc.
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: l’un ... l’autre
  rationale: Cette tournure française idiomatique exprime clairement les deux côtés distingués par l’hébreu, qui dit littéralement « l’un… le second ».
theological_decisions: []
