  text: וְ/נָתַתָּ֧ עַֽל הַ/שֻּׁלְחָ֛ן לֶ֥חֶם פָּנִ֖ים לְ/פָנַ֥/י תָּמִֽיד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/030.yaml
  text: And you shall set the bread of the Presence on the table before me continually[a].
translation:
  language: fr
  text: Tu placeras sur la table le pain de la Présence, constamment devant moi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « pain de la Présence » ; traditionnellement : « pains de proposition ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתָּ
  choice: Tu placeras
  rationale: נתן a ici le sens de « mettre, placer ». Le futur à valeur d’instruction rend naturellement la forme hébraïque dans ce contexte prescriptif.
- source_word: עַל הַ/שֻּׁלְחָן
  choice: sur la table
  rationale: La préposition indique simplement la position, et le nom défini renvoie à la table décrite dans les instructions précédentes.
- source_word: לֶחֶם פָּנִים
  choice: le pain de la Présence
  rationale: Cette expression conserve le lien de פָּנִים avec la présence ou la face, tout en employant un terme cultuel intelligible en français moderne. Elle évite de confondre l’expression avec le לְפָנַי qui suit.
- source_word: לְ/פָנַ/י
  choice: devant moi
  rationale: Littéralement « devant ma face » ; « devant moi » est naturel, concis et maintient la parole divine directe.
- source_word: תָּמִיד
  choice: constamment
  rationale: Dans ce contexte cultuel, תָּמִיד exprime une disposition maintenue de façon continue ou régulière. « Constamment » préserve cette portée sans préciser indûment le rythme du renouvellement.
theological_decisions:
- issue: Expression cultuelle לֶחֶם פָּנִים
  choice: le pain de la Présence
  alternative: les pains de proposition ; le pain placé devant moi
  rationale: « Le pain de la Présence » préserve l’expression hébraïque et son accent sur la présence divine. Le traditionnel « pains de proposition » est aujourd’hui opaque, tandis que « le pain placé devant moi » effacerait la distinction entre לֶחֶם פָּנִים et לְפָנַי.
translation_notes:
  register: Français international moderne, digne et direct. Le singulier collectif « le pain » suit l’hébreu. La formulation conserve la proximité sémantique voulue entre « Présence » et « devant moi » sans les fondre.
