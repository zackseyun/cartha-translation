  text: They shall make an ark of acacia wood[a], two and a half cubits its length, a cubit and a half its width[c][b], and a cubit and a half its height.
translation:
  language: fr
  text: 'Ils feront une arche[a] en bois d’acacia[b] : sa longueur sera de deux coudées et demie, sa largeur d’une coudée et demie, et sa hauteur d’une coudée et demie[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « coffre » ou « contenant » ; le terme hébreu désigne un coffre, mais « arche » est conservé ici en raison du contexte de l’arche de l’alliance.
    reason: lexical_alternative
  - marker: b
    text: 'Traditionnellement : « bois de sittim ».'
    reason: lexical_alternative
  - marker: c
    text: La coudée était une ancienne unité de longueur correspondant approximativement à la distance entre le coude et l’extrémité des doigts.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: Ils feront
  rationale: Dans cette série d’instructions, l’imparfait hébreu coordonné a une valeur prescriptive. « Ils feront » garde la forme collective et le ton normatif sans alourdir la phrase par un « et » initial.
- source_word: אֲרוֹן
  choice: coffre sacré
  rationale: Le nom hébreu désigne concrètement un coffre ou un contenant. « Coffre sacré » rend ce sens lexical tout en signalant sa fonction cultuelle dans le contexte; « arche » reste indiqué en note comme terme traditionnel.
- source_word: עֲצֵי שִׁטִּים
  choice: en bois d’acacia
  rationale: Cette expression construite désigne le matériau. « Bois d’acacia » est l’équivalent français moderne et transparent de l’appellation traditionnelle « bois de sittim ».
- source_word: אַמָּתַיִם וָחֵצִי
  choice: deux coudées et demie
  rationale: La mesure ancienne est conservée plutôt que convertie, et l’accord de « demie » avec « coudées » suit l’usage français.
- source_word: אָרְכּוֹ
  choice: sa longueur
  rationale: Le suffixe masculin singulier renvoie au coffre; le possessif français restitue naturellement cette relation.
- source_word: וְאַמָּה וָחֵצִי
  choice: une coudée et demie
  rationale: Cette formulation suit de près la construction hébraïque au singulier et demeure idiomatique en français.
- source_word: רָחְבּוֹ
  choice: sa largeur
  rationale: « Largeur » exprime clairement la dimension horizontale désignée par le terme hébreu.
- source_word: קֹמָתוֹ
  choice: sa hauteur
  rationale: Pour un objet, « hauteur » est l’équivalent naturel du terme désignant sa dimension verticale.
theological_decisions:
- issue: Désignation du contenant sacré
  choice: coffre sacré
  alternative: arche
  rationale: Le texte hébreu emploie le nom courant d’un coffre ou contenant, tandis que le contexte lui confère son caractère sacré. Le choix principal conserve donc le sens concret sans imposer d’emblée le terme traditionnel; celui-ci est préservé en note.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe explicite les dimensions par « sera » afin d’éviter une juxtaposition raide, tout en conservant les unités et l’ordre du texte hébreu.
