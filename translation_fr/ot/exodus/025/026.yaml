  text: And you shall make for it four gold rings[b][a], and you shall put the rings on the four corners that are at its four feet.
translation:
  language: fr
  text: Tu lui feras quatre anneaux d’or et tu placeras les anneaux aux quatre coins[a] qui sont à ses quatre pieds[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux quatre côtés » ou « aux quatre bords ».
    reason: lexical_alternative
  - marker: b
    text: Ou « à ses quatre jambes » ; le mot hébreu peut désigner les pieds ou les jambes selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu lui feras
  rationale: Dans cette suite d’instructions, le parfait avec waw a une valeur directive. Le futur français exprime naturellement l’ordre, et « lui » reprend la table sans ambiguïté dans le contexte.
- source_word: אַרְבַּע טַבְּעֹת זָהָב
  choice: quatre anneaux d’or
  rationale: Cette formulation française courante conserve à la fois le nombre, l’objet et la matière.
- source_word: וְנָתַתָּ
  choice: tu placeras
  rationale: Dans le contexte de fabrication, « placer » rend naturellement נתן tout en indiquant une mise en position précise.
- source_word: עַל אַרְבַּע הַפֵּאֹת
  choice: aux quatre coins
  rationale: La préposition et le nom désignent ici les emplacements aux extrémités de la table. « Aux quatre coins » est naturel en français, tandis qu’une note conserve les autres possibilités lexicales de פֵּאָה.
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: qui correspondent à ses quatre pieds
  rationale: La tournure française exprime prudemment le rapport spatial ou structurel signalé par לְ sans préciser davantage la construction. « Pieds » est le terme idiomatique pour les supports d’un meuble.
