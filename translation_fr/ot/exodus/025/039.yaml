    rationale: Le pronom hébreu אֹתָהּ est féminin parce que son antécédent, la menorah, est féminin en hébreu. En français, l’antécédent contextuel usuel (« le porte-lampes » ou « le chandelier ») est masculin. « La » crée donc une reprise française incohérente.
  - severity: low
    issue: Portée syntaxique de la quantité d’or
    rationale: Dans le projet initial, la place de « avec un talent d’or pur » après « ainsi que tous ces ustensiles » est moins nette. La révision rend explicite que le talent d’or sert à fabriquer l’ensemble.
  - severity: low
    issue: Note lexicale sur כֵּלִים absente
    rationale: L’audit anglais relève à juste titre l’étendue sémantique de כֵּלִים. Une note placée sur « ustensiles » préserve cette alternative sans alourdir le texte.
