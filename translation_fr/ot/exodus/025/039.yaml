  text: He shall make it[a], with all these utensils, from a talent of pure gold.
translation:
  language: fr
  text: Il le fabriquera avec tous ces ustensiles[a], à partir d’un talent[b] d’or pur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tous ces objets » ou « tous ces articles ». Le terme hébreu peut désigner de façon générale des ustensiles, des récipients ou d’autres objets associés au porte-lampes.'
    reason: lexical_alternative
  - marker: b
    text: Le talent était une ancienne unité de poids dont la valeur exacte pouvait varier.
    reason: metrological_clarification
lexical_decisions:
- source_word: כִּכָּר
  choice: un talent
  rationale: כִּכָּר désigne ici une unité de poids. Le terme métrologique traditionnel « talent » conserve la précision du texte sans imposer une conversion moderne incertaine.
- source_word: זָהָב טָהוֹר
  choice: or pur
  rationale: Cette expression désigne l’or considéré comme pur, notamment pour la fabrication d’objets cultuels. « Or pur » est l’expression française naturelle et consacrée.
- source_word: יַעֲשֶׂה
  choice: Il fabriquera
  rationale: Le verbe est à la troisième personne masculine du singulier. « Fabriquera » convient au contexte artisanal et conserve le sujet implicite du texte hébreu.
- source_word: אֹתָהּ
  choice: la
  rationale: Le pronom objet féminin singulier renvoie au porte-lampes décrit dans le contexte précédent. Le pronom français préserve cette reprise sans expliciter davantage que l’hébreu.
- source_word: אֵת כָּל הַכֵּלִים הָאֵלֶּה
  choice: ainsi que tous ces ustensiles
  rationale: כֵּלִים est un terme large pouvant désigner des objets, récipients ou instruments. « Ustensiles » convient aux accessoires associés au porte-lampes, tandis que « ainsi que » indique qu’ils sont compris dans la quantité totale d’or.
