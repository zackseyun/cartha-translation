  text: בְּ/טַבְּעֹת֙ הָ/אָרֹ֔ן יִהְי֖וּ הַ/בַּדִּ֑ים לֹ֥א יָסֻ֖רוּ מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/015.yaml
  text: The poles shall remain in the rings of the ark[a]; they shall not be removed from it.
translation:
  language: fr
  text: Les barres resteront dans les anneaux de l’arche[a] ; elles n’en seront pas retirées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les barres seront dans les anneaux de l’arche ; elles n’en seront pas enlevées. »'
    reason: Alternative plus formelle qui conserve le sens littéral de יִהְיוּ (« seront ») et une autre traduction possible de יָסֻרוּ.
lexical_decisions:
- source_word: בְּטַבְּעֹת
  choice: dans les anneaux
  rationale: La préposition בְ indique ici la position des barres à l’intérieur des anneaux fixés à l’arche. « Dans les anneaux » est naturel et précis en français.
- source_word: הָאָרֹן
  choice: l’arche
  rationale: Dans le contexte du sanctuaire, אָרוֹן désigne l’arche sacrée ; « l’arche » est le terme français établi et contextuellement exact.
- source_word: יִהְיוּ
  choice: resteront
  rationale: Le verbe signifie littéralement « être », mais le contexte et l’interdiction qui suit mettent en relief le maintien permanent des barres à leur place.
- source_word: הַבַּדִּים
  choice: les barres
  rationale: בַּדִּים désigne les longues pièces servant à porter l’arche. « Barres » est clair, courant et adapté au mobilier décrit.
- source_word: לֹא יָסֻרוּ
  choice: elles ne seront pas retirées
  rationale: סוּר peut signifier s’écarter, partir ou être ôté. La tournure passive exprime naturellement l’interdiction de retirer les barres.
- source_word: מִמֶּנּוּ
  choice: en
  rationale: Le pronom renvoie à l’arche. Dans « elles n’en seront pas retirées », « en » rend avec naturel le sens de « de celle-ci ».
