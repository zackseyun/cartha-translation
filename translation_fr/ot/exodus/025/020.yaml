  text: וְ/הָי֣וּ הַ/כְּרֻבִים֩ פֹּרְשֵׂ֨י כְנָפַ֜יִם לְ/מַ֗עְלָ/ה סֹכְכִ֤ים בְּ/כַנְפֵי/הֶם֙ עַל הַ/כַּפֹּ֔רֶת וּ/פְנֵי/הֶ֖ם אִ֣ישׁ אֶל אָחִ֑י/ו אֶל הַ/כַּפֹּ֔רֶת יִהְי֖וּ פְּנֵ֥י הַ/כְּרֻבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/020.yaml
  text: And the cherubim shall spread out their wings upward[a], overshadowing the mercy seat with their wings, and their faces shall be one toward another; the faces of the cherubim shall be toward the mercy seat.
translation:
  language: fr
  text: Les chérubins auront les ailes déployées vers le haut et couvriront de leurs ailes le couvercle de l’expiation[a]. Leurs visages seront tournés l’un vers l’autre ; les visages des chérubins seront tournés vers le couvercle de l’expiation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le propitiatoire ». Le mot hébreu désigne le couvercle d’or de l’arche, associé au rite d’expiation.
    reason: Alternative lexicale et précision référentielle pour כַּפֹּרֶת.
lexical_decisions:
- source_word: וְהָיוּ
  choice: auront
  rationale: Dans ce contexte d’instructions, la forme décrit la disposition prescrite des chérubins. Le futur français exprime naturellement cette valeur directive.
- source_word: הַכְּרֻבִים
  choice: les chérubins
  rationale: « Chérubins » est le terme français conventionnel pour ces êtres célestes représentés sur l’arche.
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: les ailes déployées vers le haut
  rationale: Cette formulation naturelle conserve la posture indiquée par le participe et l’orientation ascendante de לְמַעְלָה.
- source_word: סֹכְכִים בְּכַנְפֵיהֶם
  choice: couvriront de leurs ailes
  rationale: Le verbe סכך évoque l’action de couvrir ou d’abriter, et la préposition ב indique ici le moyen employé.
- source_word: הַכַּפֹּרֶת
  choice: le couvercle de l’expiation
  rationale: Le terme désigne le couvercle d’or de l’arche dans sa fonction cultuelle liée à l’expiation. Cette expression reste concrète et plus immédiatement intelligible en français moderne que « propitiatoire ».
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: Leurs visages seront tournés l’un vers l’autre
  rationale: L’idiome distributif, littéralement « chacun vers son frère », indique que les deux figures se font face.
- source_word: אֶל הַכַּפֹּרֶת יִהְיוּ פְּנֵי הַכְּרֻבִים
  choice: les visages des chérubins seront tournés vers le couvercle de l’expiation
  rationale: La répétition de « visages » et du nom de l’objet préserve l’insistance concrète et la tension spatiale du texte hébreu.
theological_decisions:
- issue: Traduction de כַּפֹּרֶת dans les instructions relatives au sanctuaire
  choice: le couvercle de l’expiation
  alternative: le propitiatoire
  rationale: Le choix principal exprime à la fois la nature matérielle de l’objet et sa fonction cultuelle sans réduire le terme à un simple couvercle. La note conserve le terme français traditionnel.
translation_notes:
  register: Français international moderne, clair et digne. La structure garde la répétition hébraïque concernant les visages et le couvercle, tout en employant une syntaxe française naturelle.
