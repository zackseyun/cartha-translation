base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/022.yaml
  text: And there I will meet with you[a], and I will speak with you from above the mercy seat, from between the two cherubim that are over the ark of the testimony[b], about all that I will command you for the sons of Israel.
translation:
  language: fr
  text: C’est là que je te rencontrerai et que je parlerai avec toi, d’au-dessus du propitiatoire[a], d’entre les deux chérubins qui se trouvent au-dessus de l’arche du témoignage, au sujet de tout ce que je te commanderai pour les fils d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « couvercle d’expiation ». Le terme hébreu désigne le couvercle d’or de l’arche ; traditionnellement, « propitiatoire ».
    reason: lexical_alternative
  - marker: b
    text: Ou « aux fils d’Israël », « pour les Israélites » ou « pour le peuple d’Israël ». L’hébreu emploie littéralement la préposition « vers/à » devant « les fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנוֹעַדְתִּי לְךָ שָׁם
  choice: C’est là que je te rencontrerai
  rationale: Le niphal de יעד exprime ici une rencontre fixée; cette formulation française rend naturellement le lieu désigné et l’idée de rencontre.
- source_word: וְדִבַּרְתִּי אִתְּךָ
  choice: je parlerai avec toi
  rationale: La préposition אֵת favorise «avec toi», qui conserve la nuance d’un échange direct.
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: du-dessus du propitiatoire
  rationale: «Du-dessus» indique clairement l’origine spatiale de la parole. «Propitiatoire» est le terme biblique français établi pour le couvercle d’or sacré, sans masquer l’alternative plus concrète donnée en note.
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: d’entre les deux chérubins
  rationale: Rendu direct de la relation spatiale; «chérubins» désigne cette catégorie particulière d’êtres célestes.
- source_word: אֲשֶׁר עַל אֲרֹן הָעֵדֻת
  choice: qui se trouvent au-dessus de l’arche du témoignage
  rationale: La formulation explicite naturellement en français la position des chérubins tout en conservant «témoignage», sans préciser indûment qu’il s’agit des tables.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּה אוֹתְךָ
  choice: au sujet de tout ce que je te commanderai
  rationale: «Au sujet de» rattache clairement le contenu des commandements au verbe «parler», tandis que «tout» conserve la portée globale de כָּל.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: pour les fils d’Israël
  rationale: «Pour» rend le sens des commandements confiés à Moïse à l’intention d’Israël; «fils d’Israël» préserve l’expression familiale masculine du texte hébreu.
theological_decisions:
- issue: Sens de הַכַּפֹּרֶת
  choice: propitiatoire
  alternative: couvercle d’expiation
  rationale: «Propitiatoire» maintient le poids cultuel et la continuité du vocabulaire biblique français. La note signale le sens concret de couvercle et l’autre traduction possible sans imposer une théorie particulière de l’expiation.
- issue: Sens de בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: Israélites / peuple d’Israël
  rationale: Le choix principal conserve l’expression nationale et familiale de l’hébreu; la note offre les formulations françaises plus idiomatiques et explicite la portée collective.
- issue: Rapport syntaxique de אֶל בְּנֵי יִשְׂרָאֵל
  choice: pour les fils d’Israël
  alternative: aux fils d’Israël
  rationale: La construction hébraïque est concise et peut décrire soit les destinataires, soit ceux à l’intention desquels Moïse reçoit les ordres. Le texte retient «pour» et la note préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et lisible. Le vocabulaire cultuel traditionnel est conservé là où il porte une valeur intertextuelle, avec une note explicative pour éviter l’opacité. Le tutoiement singulier correspond à l’adresse de Dieu à Moïse.
