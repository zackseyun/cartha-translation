  yaml_path: translation/ot/exodus/025/032.yaml
  text: 'And six branches shall come out from its sides: three branches of the lampstand from its one side[a], and three branches of the lampstand from its other side.'
translation:
  language: fr
  text: 'Six branches sortiront de ses côtés : trois branches du porte-lampes d’un côté, et trois branches du porte-lampes de l’autre côté.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָנִים / קְנֵי
  choice: branches
  rationale: Dans la description du mobilier du sanctuaire, le terme désigne les éléments qui se déploient latéralement depuis le porte-lampes. « Branches » conserve l’image végétale et reste clair en français.
- source_word: יֹצְאִים
  choice: partiront
  rationale: Le participe décrit les branches qui prennent naissance sur les côtés du porte-lampes. « Partiront de » exprime naturellement cette disposition dans une instruction de fabrication.
- source_word: מִצִּדֶּיהָ
  choice: de ses côtés
  rationale: Le pluriel avec suffixe féminin renvoie aux deux côtés latéraux du porte-lampes.
- source_word: מְנֹרָה
  choice: porte-lampes
  rationale: Le terme désigne ici le support portant plusieurs lampes. « Porte-lampes » traduit la fonction de l’objet sans recourir à une translittération ni suggérer qu’il s’agit lui-même d’une lampe.
- source_word: הָאֶחָד … הַשֵּׁנִי
  choice: d’un côté … de l’autre côté
  rationale: Cette tournure française rend naturellement l’opposition hébraïque entre le premier côté mentionné et le second, sans alourdir la phrase.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et descriptif. La répétition de « trois branches du porte-lampes » est maintenue afin de préserver la symétrie explicite de l’hébreu. La note de la couche anglaise n’a pas été reprise, car elle ne correspond pas à une ambiguïté réelle du texte hébreu dans ce verset.
