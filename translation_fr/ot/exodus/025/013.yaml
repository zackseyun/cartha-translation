  text: Tu feras des barres en bois d’acacia et tu les recouvriras d’or.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Le qatal avec waw dans cette suite d’instructions a une valeur prescriptive. Le futur français exprime naturellement l’ordre dans ce contexte juridique et cultuel.
- source_word: בַדֵּי
  choice: des barres
  rationale: Le terme désigne les longues pièces servant à porter l’arche. « Barres » est le terme français courant dans ce contexte et évite l’archaïsme « bâtons » ou une explicitation absente du texte.
- source_word: עֲצֵי שִׁטִּים
  choice: en bois d’acacia
  rationale: La chaîne construite désigne le matériau. « Bois d’acacia » est l’équivalent français clair et usuel, contrairement à une simple translittération.
- source_word: וְצִפִּיתָ
  choice: et tu les recouvriras
  rationale: Le verbe signifie couvrir ou plaquer un objet avec un matériau. « Recouvrir d’or » est naturel en français et convient au travail décrit.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom objet masculin pluriel renvoie aux barres.
- source_word: זָהָב
  choice: d’or
  rationale: 'Après « recouvrir », le français introduit naturellement le matériau par « de » : « recouvrir d’or ».'
