  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/יִקְחוּ לִ֖/י תְּרוּמָ֑ה מֵ/אֵ֤ת כָּל אִישׁ֙ אֲשֶׁ֣ר יִדְּבֶ֣/נּוּ לִבּ֔/וֹ תִּקְח֖וּ אֶת תְּרוּמָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/002.yaml
  text: Speak to the sons of Israel[a], that they take an offering for me. From every man whose heart moves him[c][b], you shall take my offering.
translation:
  language: fr
  text: 'Parle aux fils d’Israël[a] : qu’ils me fassent une offrande[b]. Vous recevrez mon offrande de la part de tout homme dont le cœur l’y portera[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « les fils d’Israël », désignation collective traditionnelle du peuple d’Israël.
    reason: cultural_note
  - marker: b
    text: Ou « contribution ». Le terme hébreu désigne quelque chose qui est mis à part et donné pour un usage sacré.
    reason: lexical_alternative
  - marker: c
    text: Ou « dont le cœur l’incitera à cela ». L’expression hébraïque souligne un élan intérieur volontaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: Parle à
  rationale: L’impératif intensif de דבר suivi de אֶל appelle ici une adresse directe. « Parle à » conserve simplement la force de l’ordre.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction garde l’expression familiale et collective littérale, désignation traditionnelle du peuple d’Israël.
- source_word: וְיִקְחוּ לִי
  choice: qu’ils prélèvent pour moi
  rationale: Après l’impératif, la forme verbale a une valeur directive. « Prélever » convient à une collecte faite parmi le peuple et évite l’expression peu naturelle « prendre une offrande ».
- source_word: תְּרוּמָה
  choice: offrande
  rationale: Le mot désigne ici une contribution mise à part pour un usage sacré. « Offrande » exprime son orientation vers Dieu sans lui donner un sens sacrificiel trop précis.
- source_word: מֵאֵת כָּל אִישׁ
  choice: auprès de tout homme
  rationale: La formulation conserve la valeur distributive ainsi que le singulier masculin אִישׁ, tout en indiquant clairement la provenance de la collecte.
- source_word: אֲשֶׁר יִדְּבֶנּוּ לִבּוֹ
  choice: que son cœur y pousse
  rationale: Cette tournure française rend l’impulsion intérieure et volontaire exprimée par l’idiome hébreu sans ajouter un adverbe absent du texte.
- source_word: תִּקְחוּ אֶת תְּרוּמָתִי
  choice: vous prélèverez mon offrande
  rationale: Le futur à valeur injonctive rend la directive adressée au pluriel. La répétition de « prélever » maintient le lien lexical avec לקח dans la première proposition, et « mon offrande » conserve le suffixe divin.
theological_decisions:
- issue: Sens de תְּרוּמָה dans le contexte de la construction du sanctuaire
  choice: offrande
  alternative: contribution
  rationale: « Offrande » préserve la destination sacrée et l’appartenance à Dieu, tandis que « contribution » souligne davantage l’aspect de collecte volontaire. L’alternative est signalée en note.
- issue: Caractère volontaire du don
  choice: que son cœur y pousse
  alternative: dont le cœur le rend généreux
  rationale: La traduction retenue préserve l’image hébraïque du cœur comme source de l’élan intérieur, sans transformer cette disposition en qualité morale explicitement affirmée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le deux-points fait entendre naturellement la valeur directive de la seconde proposition. « Prélever » est employé deux fois pour préserver la répétition de לקח tout en restant idiomatique dans le contexte d’une collecte.
