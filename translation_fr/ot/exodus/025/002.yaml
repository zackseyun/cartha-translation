revisions:
- from: 'Parle aux fils d’Israël[a] : qu’ils prélèvent pour moi une offrande[b]. Vous prélèverez mon offrande auprès de tout homme que son cœur y pousse[c].'
  to: 'Parle aux fils d’Israël[a] : qu’ils me fassent une offrande[b]. Vous recevrez mon offrande de la part de tout homme dont le cœur l’y portera[c].'
  rationale: La révision corrige l’attribution ambiguë de l’action de collecte tout en gardant l’offrande destinée à Dieu (« me », « mon offrande »). Elle exprime la première directive comme un don et la seconde comme la réception de ce don, conformément à la construction du verset et à son contexte immédiat. Les ancres de notes restent toutes attachées à leurs éléments pertinents.
