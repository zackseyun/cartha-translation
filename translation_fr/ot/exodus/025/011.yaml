  text: וְ/צִפִּיתָ֤ אֹת/וֹ֙ זָהָ֣ב טָה֔וֹר מִ/בַּ֥יִת וּ/מִ/ח֖וּץ תְּצַפֶּ֑/נּוּ וְ/עָשִׂ֧יתָ עָלָ֛י/ו זֵ֥ר זָהָ֖ב סָבִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/011.yaml
  text: You shall overlay it with pure gold; from the inside and from the outside you shall overlay it[a], and you shall make on it a gold molding all around.
translation:
  language: fr
  text: Tu la plaqueras d’or pur ; tu la plaqueras à l’intérieur et à l’extérieur, et tu feras sur elle une bordure d’or tout autour[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une moulure d’or », « un rebord d’or » ; traditionnellement, « une couronne d’or ». Le mot hébreu זֵר désigne ici une garniture ornementale entourant l’objet.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ / תְּצַפֶּנּוּ
  choice: tu la plaqueras
  rationale: Dans le contexte de la fabrication du sanctuaire, צפה désigne l’application d’une couche de métal sur un objet. « Plaquer d’or » est précis, naturel et adapté au travail artisanal décrit.
- source_word: זָהָב טָהוֹר
  choice: or pur
  rationale: L’expression désigne de l’or affiné, sans mélange, destiné à un usage sacré. « Or pur » est la formulation française courante et exacte.
- source_word: מִבַּיִת וּמִחוּץ
  choice: à l’intérieur et à l’extérieur
  rationale: Ces expressions adverbiales désignent respectivement les surfaces intérieure et extérieure de l’arche. Cette formulation française restitue clairement leur opposition sans calquer maladroitement les prépositions hébraïques.
- source_word: וְעָשִׂיתָ עָלָיו
  choice: tu feras tout autour
  rationale: Le pronom masculin hébreu renvoie à l’objet désigné au verset précédent, tandis que le français « arche » est féminin. La localisation sur l’objet est exprimée naturellement avec סָבִיב par « tout autour ».
- source_word: זֵר זָהָב
  choice: une bordure d’or
  rationale: Dans les descriptions du mobilier sacré, זֵר désigne une garniture ou bordure travaillée qui entoure l’objet. « Bordure » est clair en français moderne et évite l’image trompeuse que pourrait suggérer le traditionnel « couronne ».
- source_word: סָבִיב
  choice: tout autour
  rationale: Le mot indique que la bordure entoure l’objet de tous côtés. « Tout autour » en restitue naturellement la portée.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le futur à valeur prescriptive rend les formes verbales hébraïques. La répétition de « plaqueras » conserve l’insistance et la structure de l’original, tandis que « à l’intérieur et à l’extérieur » reste idiomatique en français.
