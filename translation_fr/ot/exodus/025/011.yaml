  source_fidelity: La traduction rend correctement la double application d’or, la pureté de l’or et l’idée d’une garniture circulaire. Toutefois, elle omet explicitement עָלָיו (« sur elle ») dans la dernière proposition. « Tout autour » rend סָבִיב, mais ne rend pas à lui seul la localisation de la bordure sur l’arche.
  naturalness: Le français est moderne, clair et d’un registre approprié. « Plaquer d’or » est recevable dans ce contexte artisanal. La formulation révisée reste naturelle tout en restituant l’élément locatif du texte source.
  terminology: « Or pur », « plaquer » et « bordure d’or » conviennent. La note préserve utilement les possibilités « moulure », « rebord » et la traduction traditionnelle « couronne », sans imposer une interprétation excessive.
