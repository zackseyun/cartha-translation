base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/033.yaml
  text: three almond-blossom-shaped cups on the one branch[a], with bulb and flower, and three almond-blossom-shaped cups on the one branch, with bulb and flower[c][b]; so it shall be for the six branches coming out from the lampstand.
translation:
  language: fr
  text: 'Sur chacun des bras, trois coupes en forme de fleurs d’amandier[a], avec bouton et fleur : il en sera ainsi pour les six bras qui sortent du porte-lampes[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « trois coupes façonnées comme des fleurs d’amandier »; le rapport exact entre la forme des coupes et le motif d’amandier peut être exprimé de ces deux manières.'
    reason: lexical_alternative
  - marker: c
    text: Le mot hébreu מְנֹרָה est souvent transcrit « ménorah ». Il est traduit ici par « porte-lampes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבִעִים
  choice: coupes
  rationale: Le nom désigne des récipients ou ornements en forme de coupe; « coupes » convient à ces éléments décoratifs.
- source_word: מְשֻׁקָּדִים
  choice: en forme de fleurs d’amandier
  rationale: Le terme dérive de שקד, « amandier », et décrit ici le motif floral des coupes.
- source_word: קָּנֶה
  choice: bras
  rationale: Dans la description du porte-lampes, le mot désigne l’une des tiges latérales qui partent du fût central; « bras » est clair et idiomatique en français.
- source_word: כַּפְתֹּר
  choice: bouton
  rationale: Le terme désigne une saillie ornementale arrondie; « bouton » préserve naturellement le motif végétal et floral.
- source_word: פֶרַח / פָרַח
  choice: fleur
  rationale: Le nom signifie « fleur » ou « floraison »; « fleur » évite une répétition maladroite avec « fleurs d’amandier ».
- source_word: כֵּן
  choice: il en sera ainsi
  rationale: Cette formulation exprime clairement que la même disposition doit s’appliquer à l’ensemble des six bras.
- source_word: לְשֵׁשֶׁת הַקָּנִים
  choice: pour les six bras
  rationale: La construction indique que le modèle décrit vaut pour chacun des six bras.
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: qui sortent du porte-lampes
  rationale: Cette traduction rend directement le participe et la préposition, en décrivant les bras issus de la structure centrale.
- source_word: מְנֹרָה
  choice: porte-lampes
  rationale: Le nom commun désigne ici le luminaire sacré portant les lampes; « porte-lampes » traduit sa fonction sans recourir à une simple translittération.
