lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Alors … parla
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement cette succession en français, tandis que « parla » rend דבר sans le confondre avec la formule introductive suivante.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du tétragramme, qui préserve ici le nom divin plutôt que de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition désigne ici le destinataire de la parole ; « à » est l’équivalent français naturel.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom hébreu.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: La formule hébraïque introduit le discours direct qui suit. « En ces termes » en restitue la fonction avec naturel et dignité, sans répéter maladroitement « disant » après « parla ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahvé » conserve le caractère de nom propre et correspond à sa transcription française courante, sans remplacer le nom par un titre.
translation_notes:
  register: 'Français international moderne, sobre et digne. La tournure « en ces termes : » annonce naturellement le discours du verset suivant tout en conservant la structure de la formule hébraïque.'
