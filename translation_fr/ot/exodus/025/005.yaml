  text: des peaux de béliers teintes en rouge, des peaux de taḥash[a] et du bois d’acacia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu taḥash désigne une origine animale ou un matériau dont l’identification est incertaine. Il pourrait s’agir de peaux de dugong, de marsouin ou d’un cuir de grande qualité.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹרֹת
  choice: peaux
  rationale: Le pluriel construit de עוֹר désigne des peaux animales employées comme matériau. « Peaux » est naturel en français et ne précise pas indûment leur degré de préparation.
- source_word: אֵילִם
  choice: béliers
  rationale: Le nom pluriel désigne des béliers ; « peaux de béliers » rend naturellement la relation matérielle.
- source_word: מְאָדָּמִים
  choice: teintes en rouge
  rationale: La forme indique que les peaux ont été rendues rouges, vraisemblablement par teinture, plutôt qu’une couleur naturelle.
- source_word: עֹרֹת תְּחָשִׁים
  choice: cuirs fins[a]
  rationale: Le sens de תְּחַשׁ demeure incertain. « Cuirs fins » donne un équivalent lisible pour un matériau de couverture sans identifier arbitrairement l’animal ; l’incertitude et les principales possibilités sont signalées en note.
- source_word: עֲצֵי
  choice: bois
  rationale: Dans cette liste de matériaux, le pluriel construit hébreu se rend idiomatiquement en français par le nom collectif « bois ».
- source_word: שִׁטִּים
  choice: acacia
  rationale: L’identification traditionnelle et largement admise est l’acacia ; « bois d’acacia » est clair en français moderne.
