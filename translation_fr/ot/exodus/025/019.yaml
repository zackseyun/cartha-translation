  text: וַ֠/עֲשֵׂה כְּר֨וּב אֶחָ֤ד מִ/קָּצָה֙ מִ/זֶּ֔ה וּ/כְרוּב אֶחָ֥ד מִ/קָּצָ֖ה מִ/זֶּ֑ה מִן הַ/כַּפֹּ֛רֶת תַּעֲשׂ֥וּ אֶת הַ/כְּרֻבִ֖ים עַל שְׁנֵ֥י קְצוֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/019.yaml
  text: Make one cherub on one end and one cherub on the other end[a]; from the mercy seat you shall make the cherubim on its two ends.
translation:
  language: fr
  text: Fais un chérubin à une extrémité et un chérubin à l’autre extrémité ; vous ferez les chérubins à partir du propitiatoire[a], à ses deux extrémités.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement : « Vous ferez les chérubins d’une seule pièce avec le propitiatoire, à ses deux extrémités. » La préposition hébraïque traduite par « à partir de » indique qu’ils sont façonnés dans le propitiatoire lui-même, et non fabriqués séparément puis fixés dessus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: Fais
  rationale: L’impératif masculin singulier poursuit naturellement la série d’instructions. La conjonction initiale n’a pas besoin d’être rendue en français.
- source_word: כְּרוּב ... וּכְרוּב
  choice: un chérubin… un chérubin
  rationale: Les deux singuliers désignent séparément chacune des figures ; « chérubin » est le terme français traditionnel et courant.
- source_word: אֶחָד
  choice: un
  rationale: Le numéral est conservé dans les deux membres afin de reproduire la symétrie de l’hébreu.
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: à une extrémité… à l’autre extrémité
  rationale: Dans le premier membre, le français idiomatique exprime la position par « à », tandis que l’opposition « une… l’autre » rend clairement les deux bouts.
- source_word: מִן הַכַּפֹּרֶת
  choice: à partir du propitiatoire
  rationale: 'La préposition מִן exprime ici la provenance ou la matière : les chérubins doivent être façonnés dans la même pièce que le propitiatoire. « Propitiatoire » conserve le terme cultuel français établi pour כַּפֹּרֶת.'
- source_word: תַּעֲשׂוּ
  choice: vous ferez
  rationale: L’imparfait hébreu à la deuxième personne du pluriel a ici une valeur prescriptive et s’adresse aux exécutants.
- source_word: הַכְּרֻבִים
  choice: les chérubins
  rationale: Le pluriel français usuel reprend collectivement les deux figures mentionnées auparavant.
- source_word: עַל שְׁנֵי קְצוֹתָיו
  choice: à ses deux extrémités
  rationale: Dans ce contexte spatial, עַל se rend naturellement par « à ». Le suffixe singulier renvoie au propitiatoire.
theological_decisions:
- issue: Sens cultuel de הַכַּפֹּרֶת
  choice: le propitiatoire
  alternative: le couvercle
  rationale: « Propitiatoire » est le terme cultuel français consacré et distingue cette pièce du coffre lui-même, sans développer dans le corps du texte une interprétation théologique particulière.
translation_notes:
  register: Français international moderne, clair et digne. L’alternance entre « Fais » au singulier et « vous ferez » au pluriel respecte le changement de personne du texte hébreu. La répétition est maintenue pour préserver la structure symétrique de l’instruction.
