  source_fidelity: Révision nécessaire pour rendre explicitement le suffixe possessif pluriel de בְּתַבְנִיתָם (« leur modèle ») dans le texte principal. Le participe hophal מָרְאֶה est conservé de façon plus directe par le présent passif « t’est montré », qui convient au cadre immédiat de la révélation sur la montagne sans trancher artificiellement son aspect en passé révolu.
  naturalness: « Veille à les réaliser d’après leur modèle » est idiomatique, clair et de registre digne en français international moderne. L’absence de « donc » évite d’ajouter une inférence non explicitée par le waw hébreu.
  terminology: « Modèle » rend bien תבנית et préserve l’ouverture entre modèle, forme et plan, sans imposer une interprétation théologique. « Réaliser » convient aux objets à fabriquer dans le contexte.
