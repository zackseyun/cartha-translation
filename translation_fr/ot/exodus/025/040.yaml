  yaml_path: translation/ot/exodus/025/040.yaml
  text: And see that you make them according to their pattern[a], which was shown to you on the mountain.
translation:
  language: fr
  text: Veille à les réaliser d’après leur modèle[a], qui t’est montré sur la montagne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Regarde et réalise-les d’après leur modèle, qui t’est montré sur la montagne. »'
    reason: Formulation plus littérale qui conserve la coordination des deux impératifs hébreux.
lexical_decisions:
- source_word: וּרְאֵה
  choice: Veille donc
  rationale: L’impératif de ראה a ici une valeur idiomatique d’avertissement attentif. « Veille » exprime naturellement cette force en français, tandis que « donc » marque avec souplesse la coordination hébraïque.
- source_word: וַעֲשֵׂה
  choice: à les réaliser
  rationale: עשה signifie « faire » ou « fabriquer ». Dans le contexte de la confection des éléments du sanctuaire, « réaliser » est naturel et reprend le pronom pluriel renvoyant aux objets décrits.
- source_word: בְּתַבְנִיתָם
  choice: d’après le modèle
  rationale: תבנית désigne un modèle, une forme ou un plan. Le singulier français « le modèle » correspond au nom hébreu singulier muni d’un suffixe renvoyant collectivement aux objets concernés, sans préciser la nature métaphysique de ce modèle.
- source_word: אֲשֶׁר
  choice: qui
  rationale: Le relatif introduit la proposition qui caractérise le modèle.
- source_word: אַתָּה מָרְאֶה
  choice: qui t’a été montré
  rationale: מָרְאֶה est compris comme un participe hophal de ראה, « être montré ». Le passé composé est idiomatique en français et situe la révélation du modèle dans l’expérience de Moïse sur la montagne, sans changer la valeur passive.
- source_word: בָּהָר
  choice: sur la montagne
  rationale: Dans ce contexte, la préposition ב indique le lieu où Moïse reçoit la révélation; « sur la montagne » est l’expression française naturelle.
theological_decisions:
- issue: Nature du modèle révélé pour les éléments du sanctuaire
  choice: modèle
  alternative: forme, plan ou représentation
  rationale: « Modèle » conserve l’ouverture sémantique de תבנית et n’impose aucune théorie particulière concernant un archétype céleste.
translation_notes:
  register: Français international moderne, digne et accessible. « Veille donc à » rend l’admonition idiomatique de l’hébreu; la note conserve une formulation plus littérale. Le tutoiement correspond à l’adresse divine singulière à Moïse.
