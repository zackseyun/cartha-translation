translation:
  language: fr
  text: Ses pincettes[a] et ses coupelles[b] seront en or pur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « mouchettes » : le terme hébreu désigne un instrument servant à saisir ou à entretenir les mèches du porte-lampes.'
