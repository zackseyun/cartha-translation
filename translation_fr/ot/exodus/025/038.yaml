lexical_decisions:
- source_word: מַלְקָחֶיהָ
  choice: ses pinces
  rationale: Le nom désigne un instrument servant à saisir ou à ajuster. « Pinces » est naturel en français moderne et convient au maniement des mèches sans préciser excessivement sa fonction.
- source_word: מַחְתֹּתֶיהָ
  choice: ses godets
  rationale: Dans le contexte du porte-lampes, le terme désigne vraisemblablement de petits récipients recueillant les résidus carbonisés des mèches. « Godets » rend cette fonction probable tout en conservant une note signalant les autres sens attestés.
- source_word: זָהָב טָהוֹר
  choice: en or pur
  rationale: Cette tournure française naturelle indique sans ambiguïté la matière dont les ustensiles doivent être faits.
- source_word: וּ
  choice: et
  rationale: La conjonction coordonne les deux catégories d’ustensiles.
- source_word: -הָ
  choice: ses
  rationale: Le suffixe féminin singulier renvoie au porte-lampes; le possessif français « ses » convient aux deux noms pluriels.
