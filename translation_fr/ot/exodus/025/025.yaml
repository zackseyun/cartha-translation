  text: וְ/עָשִׂ֨יתָ לּ֥/וֹ מִסְגֶּ֛רֶת טֹ֖פַח סָבִ֑יב וְ/עָשִׂ֧יתָ זֵר זָהָ֛ב לְ/מִסְגַּרְתּ֖/וֹ סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/025.yaml
  text: You shall make for it a surrounding frame a handbreadth wide[a], and you shall make a gold molding around its frame.
translation:
  language: fr
  text: Tu lui feras, tout autour, un encadrement large d’une palme, et tu feras une bordure d’or tout autour de son encadrement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une couronne d’or tout autour de son encadrement ». Le mot hébreu זֵר peut désigner une bordure ornementale ; « couronne » est la traduction traditionnelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגֶּרֶת
  choice: encadrement
  rationale: Le terme désigne ici une pièce formant le pourtour de la table. « Encadrement » exprime naturellement en français sa fonction structurelle sans en préciser excessivement la forme.
- source_word: טֹפַח
  choice: large d’un palme
  rationale: Le nom indique la mesure appelée « palme », soit la largeur d’une main. L’ajout de « large » explicite la dimension attribuée à l’encadrement.
- source_word: סָבִיב
  choice: tout autour
  rationale: Cette expression rend l’idée d’un pourtour complet aux deux occurrences et conserve leur répétition dans l’instruction.
- source_word: זֵר
  choice: bordure
  rationale: Dans le contexte du mobilier du sanctuaire, le mot désigne vraisemblablement un élément ornemental périphérique. « Bordure » reste concret et suffisamment ouvert, tandis que la traduction traditionnelle « couronne » est signalée en note.
- source_word: זָהָב
  choice: d’or
  rationale: Cette tournure française naturelle indique directement le matériau de la bordure.
- source_word: לּוֹ / לְמִסְגַּרְתּוֹ
  choice: lui / son encadrement
  rationale: Les pronoms renvoient à la table mentionnée dans le contexte. Les conserver évite une répétition absente de l’hébreu.
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Le futur à valeur injonctive restitue avec dignité et naturel la directive répétée adressée à Moïse.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et soutenu. La répétition de « tout autour » et de « tu feras » maintient la cadence de l’hébreu. « Un palme » emploie le genre masculin traditionnel du nom de cette ancienne mesure.
