  text: וְ/עָשִׂ֤יתָ אֶת הַ/בַּדִּים֙ עֲצֵ֣י שִׁטִּ֔ים וְ/צִפִּיתָ֥ אֹתָ֖/ם זָהָ֑ב וְ/נִשָּׂא בָ֖/ם אֶת הַ/שֻּׁלְחָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/028.yaml
  text: You shall make the poles of acacia wood and overlay them with gold[a], and by them the table shall be carried.
translation:
  language: fr
  text: Tu feras les perches en bois d’acacia et tu les couvriras d’or. Elles serviront à porter la table.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Dans cette suite d’instructions, le qatal précédé de וְ exprime un ordre. « Tu feras » est naturel et dignifié en français normatif.
- source_word: הַבַּדִּים
  choice: les perches
  rationale: Dans le contexte du mobilier du sanctuaire, בַּדִּים désigne les longues pièces servant au transport. « Perches » est courant et précis, contrairement à « barres », qui pourrait suggérer d’autres fonctions.
- source_word: עֲצֵי שִׁטִּים
  choice: en bois d’acacia
  rationale: Cette tournure rend naturellement le syntagme construit hébreu et emploie le nom moderne transparent de l’essence de bois.
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: et tu les couvriras d’or
  rationale: Dans ce contexte artisanal, צפה signifie recouvrir ou plaquer un objet d’un matériau. « Couvrir d’or » reste clair sans préciser une technique que l’hébreu ne détaille pas.
- source_word: וְנִשָּׂא בָם אֶת הַשֻּׁלְחָן
  choice: Elles serviront à porter la table
  rationale: Le nifal de נשׂא présente la table comme transportée, et בָם indique que les perches en sont le moyen. La formulation française exprime clairement cette fonction sans lourdeur.
- source_word: הַשֻּׁלְחָן
  choice: la table
  rationale: Le syntagme renvoie simplement à la table décrite dans le contexte immédiat; aucun complément explicatif n’est ajouté.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La coordination finale a été divisée en deux phrases pour éviter une construction passive lourde tout en conservant le sens instrumental de בָם.
