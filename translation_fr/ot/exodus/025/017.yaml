  text: וְ/עָשִׂ֥יתָ כַפֹּ֖רֶת זָהָ֣ב טָה֑וֹר אַמָּתַ֤יִם וָ/חֵ֨צִי֙ אָרְכָּ֔/הּ וְ/אַמָּ֥ה וָ/חֵ֖צִי רָחְבָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/017.yaml
  text: And you shall make a mercy seat of pure gold; its length shall be two cubits and a half[a], and its width a cubit and a half.
translation:
  language: fr
  text: Tu feras un propitiatoire[a] en or pur. Il aura deux coudées et demie de long et une coudée et demie de large.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « couvercle d’expiation ». Le mot hébreu כַּפֹּרֶת désigne la pièce d’or placée sur l’arche et est apparenté à la racine כפר, liée à l’expiation.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Dans cette suite d’instructions, le parfait qal avec conjonction a une valeur directive. « Tu feras » conserve cette force dans un français naturel et digne.
- source_word: כַפֹּרֶת
  choice: propitiatoire
  rationale: Le mot désigne ici la pièce d’or placée sur l’arche et appartient au champ lexical de l’expiation. « Propitiatoire » est le terme français consacré pour cet objet précis; une note donne une formulation plus transparente.
- source_word: זָהָב טָהוֹר
  choice: en or pur
  rationale: Cette formulation française idiomatique exprime clairement la matière et sa qualité.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: deux coudées et demie
  rationale: La mesure ancienne est conservée sans conversion; l’accord de « demie » suit « coudées ».
- source_word: אָרְכָּהּ
  choice: de long
  rationale: Le suffixe féminin renvoie au propitiatoire. La tournure dimensionnelle française « avoir… de long » rend naturellement la relation.
- source_word: וְאַמָּה וָחֵצִי
  choice: une coudée et demie
  rationale: La formulation respecte la mesure hébraïque et maintient le parallélisme avec la longueur.
- source_word: רָחְבָּהּ
  choice: de large
  rationale: Le suffixe féminin renvoie au même objet; « avoir… de large » est la tournure française naturelle.
theological_decisions:
- issue: Rendu de כַפֹּרֶת dans un contexte cultuel chargé de sens théologique
  choice: propitiatoire
  alternative: couvercle d’expiation
  rationale: Le terme nomme la plaque d’or posée sur l’arche, associée au rite d’expiation. « Propitiatoire » conserve la désignation traditionnelle et spécifique en français, tandis que la note présente l’autre traduction possible sans réduire le mot à un simple couvercle ni trancher davantage la relation exacte avec la racine כפר.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe est naturelle, les unités antiques sont conservées et le terme cultuel traditionnel est expliqué en note.
