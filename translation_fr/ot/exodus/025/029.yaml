base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/029.yaml
  text: You shall make its plates and its dishes[a], and its pitchers and its bowls with which the drink offering is poured[b]; you shall make them of pure gold.
translation:
  language: fr
  text: Tu feras ses plats et ses coupes, ainsi que ses cruches et ses bols, avec lesquels on versera les libations[a] ; tu les feras en or pur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec lesquels on fera les libations ». Les deux derniers noms hébreux désignent des récipients cultuels rares, dont la forme et la fonction exactes restent incertaines.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְּעָרֹתָיו
  choice: ses plats
  rationale: קְעָרָה désigne un récipient plat ou un plat. « Plats » convient au service de la table et permet de distinguer ce terme du suivant.
- source_word: כַפֹּתָיו
  choice: ses coupes
  rationale: כַּף désigne ici un petit récipient, probablement lié au service de la table. « Coupes » est naturel en français et préserve une distinction avec les plats.
- source_word: קְשׂוֹתָיו
  choice: ses cruches
  rationale: Ce nom rare désigne un récipient cultuel vraisemblablement destiné à contenir ou à verser un liquide. « Cruches » exprime cette fonction sans archaïsme.
- source_word: מְנַקִּיֹּתָיו
  choice: ses bols
  rationale: Le terme désigne un autre type de récipient associé aux libations. « Bols » garde la distinction lexicale sans préciser davantage une forme incertaine.
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: avec lesquels on versera les libations
  rationale: Le passif de נסך renvoie à l'action cultuelle de verser une libation. La tournure française impersonnelle conserve l'indétermination de l'agent, tandis que le pluriel « les libations » explicite sobrement le sens rituel.
- source_word: זָהָב טָהוֹר
  choice: or pur
  rationale: Rendu français courant et précis pour la qualité du matériau prescrite.
- source_word: וְעָשִׂיתָ ... תַּעֲשֶׂה אֹתָם
  choice: Tu feras ... tu les feras
  rationale: La répétition encadre l'inventaire puis précise le matériau, tout en conservant la force directive de la deuxième personne du singulier.
theological_decisions:
- issue: Nature de l'action exprimée par נסך
  choice: les libations
  alternative: ce qui doit être versé
  rationale: Dans ce contexte cultuel, le verbe désigne normalement le versement d'une libation. Le texte ne précise toutefois ni la substance ni les modalités du rite.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire concret distingue les quatre catégories de récipients sans prétendre déterminer avec certitude la forme des deux objets désignés par des termes hébreux rares. Le point-virgule conserve la structure en deux temps de l'instruction.
