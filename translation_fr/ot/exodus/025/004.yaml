lexical_decisions:
- source_word: תְכֵלֶת
  choice: fils bleus
  rationale: Le terme désigne une matière textile teinte en bleu ou bleu-violet. Dans cette liste de matériaux destinés au sanctuaire, « fils bleus » exprime naturellement en français la couleur et la nature textile implicite, sans préciser à tort qu’il s’agit déjà d’une étoffe.
- source_word: אַרְגָּמָן
  choice: pourpres
  rationale: Le mot désigne une précieuse matière textile teinte en pourpre. L’adjectif coordonné à « fils » donne une formulation française concise et naturelle.
- source_word: תוֹלַעַת שָׁנִי
  choice: écarlates
  rationale: L’expression désigne par métonymie une matière teinte en écarlate au moyen d’un colorant tiré d’insectes. Le français rend le produit textile obtenu plutôt que l’expression zoologique littérale.
- source_word: שֵׁשׁ
  choice: fin lin
  rationale: Dans les passages relatifs au sanctuaire, le terme désigne du lin fin, emploi distinct du mot homographe signifiant « six ».
- source_word: עִזִּים
  choice: poil de chèvre
  rationale: Le texte dit littéralement « chèvres », mais, dans cet inventaire de matières à fournir, il vise le poil utilisé pour fabriquer les tentures.
theological_decisions: []
translation_notes:
  register: Formulation moderne, sobre et adaptée à une liste. La répétition hébraïque de la conjonction n’est pas reproduite mécaniquement, conformément à l’usage naturel du français. « Fils » explicite avec retenue la matière textile sous-entendue par les trois termes de couleur.
