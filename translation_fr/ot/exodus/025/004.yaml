  text: des fils bleus[a], pourpres et écarlates, du fin lin et du poil de chèvre[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bleu-violet » ; le terme hébreu désigne une matière textile teinte de cette couleur.
