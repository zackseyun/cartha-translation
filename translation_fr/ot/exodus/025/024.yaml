  text: You shall overlay it with pure gold[a], and you shall make for it a gold molding all around.
translation:
  language: fr
  text: Tu la plaqueras d’or pur et tu lui feras tout autour une bordure[a] en or.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une moulure », « un rebord » ou « une couronne » ornementale. Le terme hébreu désigne une bordure décorative autour de la table.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ
  choice: tu le plaqueras
  rationale: Dans ce contexte artisanal, צפה désigne le revêtement d’un objet en bois par une couche de métal. « Plaquer d’or » est précis et naturel en français moderne.
- source_word: אֹתוֹ
  choice: le
  rationale: Le pronom objet renvoie à la table mentionnée au verset précédent ; le masculin français correspond à « table » au sens du meuble.
- source_word: זָהָב טָהוֹר
  choice: d’or pur
  rationale: L’expression désigne de l’or de haute pureté ; « or pur » est l’équivalent français usuel et transparent.
- source_word: וְעָשִׂיתָ
  choice: et tu lui feras
  rationale: עשה est rendu par le verbe courant « faire », sans ajouter une nuance absente du texte source.
- source_word: לּוֹ
  choice: lui
  rationale: La préposition ל indique ici l’objet auquel la bordure est destinée ; le pronom « lui » produit une formulation française naturelle.
- source_word: זֵר
  choice: bordure
  rationale: Le terme désigne ici un élément qui borde le meuble, possiblement ornemental. « Bordure » conserve cette valeur sans imposer la traduction traditionnelle « couronne », potentiellement trompeuse.
- source_word: זָהָב
  choice: en or
  rationale: Le nom indique simplement le matériau de la bordure.
- source_word: סָבִיב
  choice: tout autour
  rationale: Cette expression naturelle indique que la bordure fait le tour complet de la table.
