translation:
  language: fr
  text: Sur le chandelier, il y aura quatre coupes en forme de fleurs d’amandier[a], avec ses renflements[b] et ses fleurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en forme d’amandes » ou « ornées de fleurs d’amandier ». L’hébreu emploie une image tirée de l’amandier et peut évoquer la forme ou l’ornementation.
    reason: lexical_alternative
  - marker: b
    text: Ou « ses boutons ». Le terme hébreu désigne un élément ornemental arrondi du chandelier.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמְּנֹרָה
  choice: Sur le chandelier
  rationale: La préposition situe les éléments décrits sur le chandelier. « Chandelier » désigne ici le support à lampes dans son ensemble.
- source_word: אַרְבָּעָה גְבִעִים
  choice: quatre coupes
  rationale: Le nom désigne des formes creuses comparables à des coupes ou à des calices; « coupes » est clair et naturel dans la description de l’ouvrage.
- source_word: מְשֻׁקָּדִים
  choice: en forme de fleurs d’amandier
  rationale: Cette forme dérivée du mot « amandier » évoque un motif végétal; la traduction exprime clairement l’image sans exclure totalement une fonction ornementale.
- source_word: כַּפְתֹּרֶיהָ
  choice: ses boutons
  rationale: Le terme désigne un élément ornemental arrondi. « Boutons » s’accorde avec l’imagerie florale, tout en laissant en note la possibilité de « renflements ».
- source_word: וּפְרָחֶיהָ
  choice: et ses fleurs
  rationale: Le terme désigne des fleurs ou des floraisons. « Fleurs » évite une répétition lourde et forme un ensemble naturel avec « boutons ».
