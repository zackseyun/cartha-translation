  text: And let them make a sanctuary for me[a], so that I may dwell among them.
translation:
  language: fr
  text: Qu’ils me fassent un sanctuaire, afin que j’habite au milieu d’eux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « parmi eux ». L’hébreu dit littéralement « au milieu d’eux » : il souligne la présence de Dieu avec le peuple, et non seulement à l’intérieur du sanctuaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: Qu’ils fassent
  rationale: Dans ce contexte d’instructions, la forme exprime naturellement une injonction à la troisième personne du pluriel. Cette tournure est claire et actuelle en français.
- source_word: לִי
  choice: me
  rationale: Le pronom complément avec ל indique ici que le sanctuaire est destiné à Dieu. « me fassent » rend idiomatiquement cette relation de destination ou de bénéfice.
- source_word: מִקְדָּשׁ
  choice: un sanctuaire
  rationale: Le nom désigne un lieu consacré à la présence divine. « Sanctuaire » est précis, digne et courant dans ce contexte.
- source_word: וְשָׁכַנְתִּי
  choice: afin que j’habite
  rationale: Le verbe שׁכן signifie habiter ou demeurer. « Afin que » exprime le rapport de finalité entre la construction du sanctuaire et la présence de Dieu, tout en conservant la nuance possible de résultat.
- source_word: בְּתוֹכָם
  choice: au milieu d’eux
  rationale: 'Cette expression rend directement le sens de l’hébreu et maintient le pluriel : Dieu habitera au milieu du peuple, et non simplement dans l’édifice.'
theological_decisions:
- issue: Lieu et référent de la présence divine
  choice: au milieu d’eux
  alternative: parmi eux ; en lui
  rationale: Le suffixe hébreu est masculin pluriel, « eux ». La traduction conserve donc l’affirmation que Dieu habite au milieu des Israélites, le sanctuaire servant de lieu à cette présence sans en devenir l’unique référent.
translation_notes:
  register: Français international moderne, naturel et digne. L’injonction « Qu’ils me fassent » conserve la troisième personne du pluriel ; « sanctuaire » maintient le vocabulaire cultuel sans archaïsme excessif.
