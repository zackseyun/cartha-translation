source:
  edition: WLC
  text: וְ/עָשִׂ֛יתָ שְׁנַ֥יִם כְּרֻבִ֖ים זָהָ֑ב מִקְשָׁה֙ תַּעֲשֶׂ֣ה אֹתָ֔/ם מִ/שְּׁנֵ֖י קְצ֥וֹת הַ/כַּפֹּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/018.yaml
  text: And you shall make two cherubim of gold; of hammered work you shall make them[a], at the two ends of the mercy seat.
translation:
  language: fr
  text: Tu feras deux chérubins en or ; tu les façonneras au marteau aux deux extrémités du couvercle d’expiation[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « propitiatoire ». Le terme hébreu désigne le couvercle de l’arche, associé au rite d’expiation.'
    reason: Alternative lexicale et précision cultuelle.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Tu feras
  rationale: Dans cette suite d’instructions, la forme verbale exprime un ordre. Le futur français conserve le style prescriptif et solennel du passage.
- source_word: שְׁנַיִם כְּרֻבִים
  choice: deux chérubins
  rationale: « Chérubins » est le terme traditionnel précis pour ces êtres célestes et évite les associations modernes trompeuses de « chérubs ».
- source_word: זָהָב
  choice: en or
  rationale: Cette formulation française indique naturellement la matière dont les chérubins doivent être faits.
- source_word: מִקְשָׁה
  choice: façonneras au marteau
  rationale: Le terme décrit un ouvrage métallique obtenu par martelage. Cette formulation actuelle exprime clairement le procédé sans ajouter explicitement « d’une seule pièce », implication possible mais discutée.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: tu les façonneras
  rationale: La reprise du verbe hébreu est maintenue, tout en variant naturellement le verbe français pour préciser ici le mode de fabrication.
- source_word: מִשְּׁנֵי קְצֹוֹת
  choice: aux deux extrémités
  rationale: Rend clairement la relation spatiale sans trancher au-delà du verset entre une simple position aux extrémités et une fabrication faisant corps avec le couvercle.
- source_word: הַכַּפֹּרֶת
  choice: le couvercle d’expiation
  rationale: Cette expression indique à la fois qu’il s’agit du couvercle de l’arche et sa fonction cultuelle liée à l’expiation. Elle est plus transparente en français moderne que le terme traditionnel « propitiatoire ».
theological_decisions:
- issue: Traduction de הַכַּפֹּרֶת dans le contexte du sanctuaire
  choice: le couvercle d’expiation
  alternative: le propitiatoire ; le couvercle
  rationale: « Couvercle d’expiation » conserve le lien cultuel avec l’expiation tout en identifiant l’objet de façon compréhensible. La note fournit le terme français traditionnel et signale que le nom hébreu désigne le couvercle de l’arche, sans réduire le mot à une seule nuance théologique.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le tutoiement singulier reflète l’adresse hébraïque à Moïse. La répétition de l’instruction est conservée sans lourdeur, et le vocabulaire technique est rendu transparent grâce à une note.
