source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע פַּרְעֹה֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וַ/יְבַקֵּ֖שׁ לַ/הֲרֹ֣ג אֶת מֹשֶׁ֑ה וַ/יִּבְרַ֤ח מֹשֶׁה֙ מִ/פְּנֵ֣י פַרְעֹ֔ה וַ/יֵּ֥שֶׁב בְּ/אֶֽרֶץ מִדְיָ֖ן וַ/יֵּ֥שֶׁב עַֽל הַ/בְּאֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/015.yaml
  text: When Pharaoh heard this matter[a], he sought to kill Moses. But Moses fled from Pharaoh and stayed in the land of Midian[b], and he sat down by the well.
translation:
  language: fr
  text: Quand Pharaon apprit ce qui s’était passé[a], il chercha à tuer Moïse. Mais Moïse s’enfuit loin de Pharaon et s’établit dans le pays de Madian[b]. Il s’assit près du puits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « entendit cette affaire » ; autre traduction possible : « eut connaissance de cet incident ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie deux fois de suite le même verbe, d’abord au sens de « demeurer, s’établir » en Madian, puis au sens concret de « s’asseoir » près du puits.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: apprit
  rationale: Dans ce contexte, שׁמע indique que Pharaon prend connaissance de l’incident. « Apprit » est plus naturel en français que le calque « entendit cette affaire ».
- source_word: הַדָּבָר הַזֶּה
  choice: ce qui s’était passé
  rationale: דבר désigne ici l’événement rapporté, à savoir le meurtre de l’Égyptien, sans qu’il soit nécessaire de le préciser dans le texte.
- source_word: וַיְבַקֵּשׁ לַהֲרֹג
  choice: chercha à tuer
  rationale: Cette expression conserve la valeur de בקש suivi de l’infinitif, qui peut exprimer la recherche d’un moyen ou une tentative.
- source_word: וַיִּבְרַח ... מִפְּנֵי
  choice: s’enfuit loin de
  rationale: Formulation française naturelle qui exprime la fuite hors de la présence et du pouvoir immédiat de Pharaon.
- source_word: וַיֵּשֶׁב בְּאֶרֶץ מִדְיָן
  choice: s’établit dans le pays de Madian
  rationale: Le premier emploi de ישׁב évoque le fait de demeurer ou de s’installer dans une région. « S’établit » rend ce sens contextuel sans nécessairement impliquer une permanence absolue.
- source_word: וַיֵּשֶׁב עַל הַבְּאֵר
  choice: Il s’assit près du puits
  rationale: Le second emploi de ישׁב a son sens concret de « s’asseoir » ; près du puits est idiomatique pour עַל dans ce contexte.
- source_word: הַבְּאֵר
  choice: le puits
  rationale: L’article défini hébreu est conservé.
- source_word: פַּרְעֹה
  choice: Pharaon
  rationale: Forme française traditionnelle et courante du titre royal.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: מִדְיָן
  choice: Madian
  rationale: Forme française traditionnelle et courante du toponyme.
