  text: And his sister stood at a distance[b][a], to know what would be done to him.
translation:
  language: fr
  text: Sa sœur se tint à distance[a], pour savoir ce qui lui serait fait[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de loin » ou « au loin ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « pour voir ce qui lui arriverait ». Littéralement : « pour savoir ce qui lui serait fait ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּתַצַּב
  choice: se tint
  rationale: Le hitpael de יצב exprime le fait de prendre ou de garder position. « Se tint » restitue naturellement cette nuance dans un récit au passé.
- source_word: אֲחֹתוֹ
  choice: sa sœur
  rationale: Le nom avec suffixe masculin singulier signifie directement « sa sœur ».
- source_word: מֵרָחֹק
  choice: à distance
  rationale: Cette expression spatiale est rendue en français moderne et idiomatique par « à distance », sans préciser davantage l'éloignement.
- source_word: לְדֵעָה
  choice: pour savoir
  rationale: L'infinitif précédé de ל exprime ici le but. « Pour savoir » reste proche de l'hébreu, tandis que le contexte peut aussi suggérer « pour voir ce qui arriverait ».
- source_word: מַה
  choice: ce qui
  rationale: Dans cette interrogative indirecte, « ce qui » est la tournure française naturelle correspondant à « quoi » ou « ce que » en hébreu.
- source_word: יֵּעָשֶׂה
  choice: serait fait
  rationale: Le niphal imparfait de עשה est passif. Le conditionnel « serait fait » convient au point de vue narratif et conserve ce passif plutôt que de le généraliser en « arriverait ».
- source_word: לוֹ
  choice: lui
  rationale: Avec le passif de עשה, ל peut indiquer ce qui serait fait à l'enfant ou pour lui. « Lui serait fait » maintient en français la même ouverture contextuelle.
