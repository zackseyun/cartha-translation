  yaml_path: translation/ot/exodus/002/025.yaml
  text: God saw the sons of Israel, and God knew.
translation:
  language: fr
  text: Dieu vit les Israélites, et Dieu sut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Littéralement « les fils d’Israël » ; en français moderne, « les Israélites » désigne naturellement l’ensemble du peuple sans suggérer que seuls les hommes sont concernés.
- source_word: וַיֵּדַע
  choice: et Dieu sut
  rationale: Conserve le sens premier et la formulation ouverte de ידע, « savoir/connaître », sans expliciter par « prit connaissance » ou « se préoccupa », ce qui réduirait volontairement l’ambiguïté du texte.
theological_decisions:
- issue: Portée de l’affirmation « Dieu sut »
  choice: Maintenir la formulation brève et non explicitée
  alternative: « Dieu prit connaissance de leur situation » ou « Dieu se préoccupa d’eux »
  rationale: L’hébreu ne précise aucun complément à « sut ». Cette ellipse peut évoquer à la fois la connaissance, la reconnaissance et l’attention de Dieu ; la traduction ne doit pas choisir silencieusement une seule de ces nuances.
translation_notes:
  register: Français moderne, sobre et dignifié. Le passé simple convient au registre narratif biblique et maintient le parallélisme concis des deux verbes hébreux.
