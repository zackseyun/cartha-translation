base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/019.yaml
  text: They said[a], “An Egyptian man rescued us from the hand of the shepherds[b], and he even drew water for us and watered the flock.”
translation:
  language: fr
  text: 'Elles répondirent : « Un Égyptien nous a délivrées des bergers[a] ; il a même puisé de l’eau pour nous[b] et abreuvé le troupeau. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la main des bergers », c’est-à-dire de leur pouvoir ou de leur emprise.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu renforce le verbe « puiser » par une répétition grammaticale, soulignant l’action de puiser.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  choice: Elles répondirent
  rationale: Le wayyiqtol féminin pluriel de אמר introduit la réponse des filles à la question de leur père. « Répondirent » rend naturellement la fonction du discours dans ce contexte, sans devoir conserver mécaniquement le connecteur hébreu.
- source_word: אִישׁ מִצְרִי
  choice: Un Égyptien
  rationale: En français courant, « un Égyptien » désigne déjà explicitement un homme ; « un homme égyptien » serait lourd et moins naturel.
- source_word: הִצִּילָנוּ
  choice: nous a délivrées
  rationale: Le hiphil de נצל exprime ici le fait d’arracher quelqu’un à une situation de contrainte ou de danger. L’accord féminin rend explicite que le pronom renvoie aux filles.
- source_word: מִיַּד הָרֹעִים
  choice: des bergers
  rationale: Littéralement « de la main des bergers », l’expression désigne leur pouvoir ou leur emprise. Le texte principal emploie une formulation française naturelle, tandis que la note conserve l’image hébraïque.
- source_word: וְגַם
  choice: il a même
  rationale: וְגַם ajoute une action remarquable à la délivrance précédente ; « même » en restitue bien la progression emphatique.
- source_word: דָּלֹה דָלָה
  choice: puisé de l’eau
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’action de puiser. En français, l’emphase est portée naturellement par « même » et explicitée en note.
- source_word: לָנוּ
  choice: pour nous
  rationale: Le datif indique que l’homme a puisé l’eau à leur intention et pour leur bénéfice.
- source_word: וַיַּשְׁקְ
  choice: abreuvé
  rationale: Le hiphil de שקה signifie donner à boire. « Abreuver » est précis, naturel et approprié pour du bétail.
- source_word: אֶת הַצֹּאן
  choice: le troupeau
  rationale: צאן est un collectif désignant le petit bétail, souvent des moutons et des chèvres. « Le troupeau » préserve cette généralité.
