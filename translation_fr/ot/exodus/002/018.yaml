base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/018.yaml
  text: When they came to Reuel their father[a], he said, “Why have you come back so quickly today?”
translation:
  language: fr
  text: 'Lorsqu’elles revinrent auprès de Réouel, leur père, il leur demanda : « Pourquoi êtes-vous revenues si vite[a] aujourd’hui ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Pourquoi vous êtes-vous hâtées de venir aujourd’hui ? » L’hébreu emploie le verbe « se hâter » avec « venir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאנָה
  choice: Lorsqu’elles revinrent
  rationale: Le wayyiqtol féminin pluriel de בוא poursuit le récit. « Lorsqu’elles » exprime naturellement en français le rapport temporel avec la question qui suit, et « revinrent » rend le retour des filles auprès de leur père dans ce contexte.
- source_word: אֶל
  choice: auprès de
  rationale: La préposition indique le mouvement vers Réouel. « Auprès de » convient naturellement avec le retour auprès d’une personne, sans modifier le sens directionnel.
- source_word: רְעוּאֵל
  choice: Réouel
  rationale: Translittération française proche de la forme hébraïque, préférable ici à la forme d’origine grecque « Raguel ».
- source_word: אֲבִיהֶן
  choice: leur père
  rationale: Le nom אָב avec suffixe féminin pluriel désigne ici simplement le père des filles.
- source_word: וַיֹּאמֶר
  choice: il leur demanda
  rationale: Le verbe אמר signifie littéralement « il dit », mais introduit ici une question adressée aux filles. « Il leur demanda » est idiomatique et explicite seulement ce que la forme interrogative établit déjà.
- source_word: מַדּוּעַ
  choice: Pourquoi
  rationale: Équivalent direct et courant de l’adverbe interrogatif demandant la raison.
- source_word: מִהַרְתֶּן
  choice: êtes-vous revenues si vite
  rationale: Le piel accompli féminin pluriel de מהר exprime l’empressement ou la rapidité. Avec l’infinitif בֹּא et dans la situation narrative, le français naturel exprime cette idée par « revenir si vite ».
- source_word: בֹּא
  choice: revenues
  rationale: L’infinitif de בוא signifie littéralement « venir » et complète מהר. Le contexte montre qu’il s’agit du retour des filles auprès de leur père ; « revenues » rend cette valeur contextuelle.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: L’expression hébraïque définie « le jour » a ici le sens idiomatique d’« aujourd’hui ».
