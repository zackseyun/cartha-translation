  yaml_path: translation/ot/exodus/002/012.yaml
  text: He looked this way and that[a], and when he saw that there was no one there, he struck down the Egyptian and hid him in the sand.
translation:
  language: fr
  text: Il regarda d’un côté et de l’autre et, voyant qu’il n’y avait personne, il abattit l’Égyptien et le cacha dans le sable.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֶן כֹּה וָכֹה
  choice: Il regarda d’un côté et de l’autre
  rationale: Le verbe פנה signifie littéralement « se tourner », mais, associé à כֹּה וָכֹה, il décrit ici le fait de porter le regard dans les deux directions. Cette formulation française rend naturellement l’idée d’inspecter les alentours.
- source_word: וַיַּרְא כִּי אֵין אִישׁ
  choice: voyant qu’il n’y avait personne
  rationale: אִישׁ signifie littéralement « homme », mais la tournure אֵין אִישׁ indique ici l’absence de toute personne susceptible d’être présente ou témoin. « Personne » est l’équivalent idiomatique exact en français moderne.
- source_word: וַיַּךְ
  choice: il abattit
  rationale: נכה signifie fondamentalement « frapper ». Dans ce contexte, l’ensevelissement qui suit montre que le coup est mortel. « Abattit » conserve l’image d’un coup porté tout en exprimant son issue létale, sans remplacer le verbe par le plus explicite « tua ».
- source_word: הַמִּצְרִי
  choice: l’Égyptien
  rationale: Désignation ethnique ou nationale définie, rendue directement en français.
- source_word: וַיִּטְמְנֵהוּ
  choice: le cacha
  rationale: טמן signifie « cacher, dissimuler ». Le complément « dans le sable » indique la manière concrète, probablement en recouvrant le corps, sans qu’il soit nécessaire de préciser « enterra ».
- source_word: בַּחוֹל
  choice: dans le sable
  rationale: חוֹל désigne le sable ; l’article hébreu est naturellement rendu par l’article défini français.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La coordination hébraïque est légèrement fluidifiée par le participe « voyant », sans modifier la succession des actions. Aucune note n’est nécessaire, car « personne » rend sans ambiguïté la valeur générique contextuelle de אִישׁ.
