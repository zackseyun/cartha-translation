  text: וַ/תֹּ֣אמֶר אֲחֹת/וֹ֮ אֶל בַּת פַּרְעֹה֒ הַ/אֵלֵ֗ךְ וְ/קָרָ֤אתִי לָ/ךְ֙ אִשָּׁ֣ה מֵינֶ֔קֶת מִ֖ן הָ/עִבְרִיֹּ֑ת וְ/תֵינִ֥ק לָ֖/ךְ אֶת הַ/יָּֽלֶד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/007.yaml
  text: Then his sister said to Pharaoh’s daughter[a], “Shall I go and call a nursing woman from the Hebrew women for you, so that she may nurse the child for you?”
translation:
  language: fr
  text: 'Alors sa sœur dit à la fille du pharaon : « Veux-tu que j’aille te chercher, parmi les femmes hébreues, une femme qui allaite, afin qu’elle allaite l’enfant pour toi ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Alors ... dit
  rationale: Le waw consécutif fait avancer le récit ; « Alors » rend naturellement la succession narrative.
- source_word: אֲחֹתוֹ
  choice: sa sœur
  rationale: Le suffixe masculin singulier renvoie contextuellement à l’enfant ; la traduction conserve ce renvoi implicite.
- source_word: בַּת פַּרְעֹה
  choice: la fille du pharaon
  rationale: Rendu français naturel de la chaîne construite, avec la désignation royale en nom commun.
- source_word: הַאֵלֵךְ וְקָרָאתִי
  choice: Veux-tu que j’aille te chercher
  rationale: L’interrogatif suivi de l’imparfait à la première personne exprime une proposition polie. « Chercher » rend ici l’idée d’aller appeler ou faire venir quelqu’un.
- source_word: אִשָּׁה מֵינֶקֶת
  choice: une femme qui allaite
  rationale: Cette formulation claire reste proche de l’hébreu, littéralement une femme allaitante, sans imposer le statut professionnel suggéré par « nourrice ».
- source_word: מִן הָעִבְרִיֹּת
  choice: parmi les femmes hébreues
  rationale: La préposition מן indique ici l’appartenance au groupe parmi lequel la femme sera choisie.
- source_word: וְתֵינִק
  choice: afin qu’elle allaite
  rationale: Le hiphil de ינק signifie faire téter, donc allaiter. Dans cette proposition, la coordination exprime naturellement le but.
- source_word: הַיָּלֶד
  choice: l’enfant
  rationale: ילד désigne ici le jeune enfant ; « l’enfant » évite de sur-préciser tout en convenant au contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La répétition d’« allaite » et de « pour toi » reflète l’insistance du texte source sans lourdeur excessive. Aucun marqueur de note n’est requis, car l’alternative lexicale peut être rendue directement et sans perte par « une femme qui allaite ».
