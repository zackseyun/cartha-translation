base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/013.yaml
  text: He went out the next day[a], and behold, two Hebrew men were fighting. And he said to the wicked one[b], “Why are you striking your companion?”
translation:
  language: fr
  text: 'Le lendemain, il sortit, et voici que deux Hébreux se battaient. Il dit à celui qui avait tort[a] : « Pourquoi frappes-tu ton compagnon[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au coupable » ou « au méchant ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ton prochain » ou « ton semblable ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: il sortit
  rationale: Le wayyiqtol qal de יצא fait avancer simplement le récit. Le sujet, Moïse, est fourni par le contexte.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: Le lendemain
  rationale: Littéralement « le deuxième jour » ; dans ce récit, « le lendemain » exprime naturellement la relation temporelle.
- source_word: וְהִנֵּה
  choice: et vit
  rationale: הִנֵּה présente vivement ce qui s'offre soudain au regard de Moïse. En français narratif moderne, « vit » en restitue ici la fonction sans l'archaïsme de « voici » après un verbe de mouvement.
- source_word: שְׁנֵי אֲנָשִׁים עִבְרִים
  choice: deux Hébreux
  rationale: Le masculin et le nombre sont explicites en français, et la formulation est plus naturelle que « deux hommes hébreux » dans ce contexte.
- source_word: נִצִּים
  choice: qui se battaient
  rationale: Le participe nifal décrit une altercation en cours, physique d'après la question qui suit.
- source_word: לָרָשָׁע
  choice: celui qui avait tort
  rationale: Dans ce différend précis, רָשָׁע désigne celui qui est en faute ou dans son tort. Ce choix évite de transformer trop fortement un jugement situationnel en caractérisation générale de la personne.
- source_word: לָמָּה תַכֶּה
  choice: Pourquoi frappes-tu
  rationale: L'imparfait hébreu désigne ici l'action en cours. Le présent français est direct et idiomatique.
- source_word: רֵעֶךָ
  choice: ton compagnon
  rationale: רֵעַ peut désigner un compagnon, un prochain ou un semblable. « Compagnon » convient à la relation immédiate entre les deux hommes sans importer un sens juridique particulier.
theological_decisions:
- issue: Portée morale de רָשָׁע
  choice: celui qui avait tort
  alternative: le méchant / le coupable
  rationale: Le contexte permet une désignation de l'agresseur comme personne en faute, sans exiger que le texte définisse l'ensemble de son caractère moral. La note conserve les autres nuances possibles.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique écrit sans rendre la phrase obscure. Les notes signalent les principales nuances lexicales réellement présentes dans l'hébreu.
