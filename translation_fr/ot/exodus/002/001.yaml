  text: וַ/יֵּ֥לֶךְ אִ֖ישׁ מִ/בֵּ֣ית לֵוִ֑י וַ/יִּקַּ֖ח אֶת בַּת לֵוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/001.yaml
  text: A man from the house of Levi went and took a daughter of Levi as his wife[a].
translation:
  language: fr
  text: Un homme de la maison de Lévi alla prendre pour femme une descendante de Lévi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une fille de Lévi » ; c’est-à-dire une femme de la descendance de Lévi. Autre traduction possible : « une Lévite ».'
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: alla
  rationale: Le verbe הלך signifie normalement « aller ». Le passé simple convient au récit et conserve la succession hébraïque des actions sans ajouter de marqueur temporel absent du texte.
- source_word: אִישׁ
  choice: un homme
  rationale: Le terme désigne ici un individu de sexe masculin et maintient son anonymat initial ; « mari » anticiperait le résultat de l’action.
- source_word: מִבֵּית לֵוִי
  choice: de la maison de Lévi
  rationale: Cette formulation conserve l’expression généalogique de l’hébreu. Ici, « maison » renvoie à la lignée ou au groupe familial de Lévi.
- source_word: וַיִּקַּח
  choice: prendre pour femme
  rationale: לקח signifie littéralement « prendre », mais, dans ce contexte matrimonial, « prendre pour femme » exprime naturellement en français le sens de l’action sans le réduire au seul verbe « épouser ».
- source_word: אֶת
  choice: '[marque de l’objet direct, non traduite]'
  rationale: Cette particule signale l’objet direct défini en hébreu et n’appelle aucun équivalent lexical distinct en français.
- source_word: בַּת לֵוִי
  choice: une descendante de Lévi
  rationale: Littéralement « une fille de Lévi », l’expression désigne ici une femme appartenant à la descendance de Lévi. « Une descendante de Lévi » communique clairement cette valeur généalogique en français moderne, tandis que la forme littérale est conservée en note.
