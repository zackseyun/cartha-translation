  to: 'Mais l’homme répondit : « Qui t’a établi chef et juge sur nous ? Veux-tu me tuer comme tu as tué l’Égyptien ? » Moïse eut peur et dit : « C’est donc que l’affaire est maintenant connue ! »'
  rationale: La révision conserve les choix lexicaux français naturels du projet, tout en évitant d’interpréter la dernière parole de Moïse comme exclusivement intérieure et en rendant plus explicitement la déduction et la divulgation déjà accomplie exprimées en hébreu.
