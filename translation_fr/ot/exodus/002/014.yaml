  text: וַ֠/יֹּאמֶר מִ֣י שָֽׂמְ/ךָ֞ לְ/אִ֨ישׁ שַׂ֤ר וְ/שֹׁפֵט֙ עָלֵ֔י/נוּ הַ/לְ/הָרְגֵ֨/נִי֙ אַתָּ֣ה אֹמֵ֔ר כַּ/אֲשֶׁ֥ר הָרַ֖גְתָּ אֶת הַ/מִּצְרִ֑י וַ/יִּירָ֤א מֹשֶׁה֙ וַ/יֹּאמַ֔ר אָכֵ֖ן נוֹדַ֥ע הַ/דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/014.yaml
  text: But he said[a], “Who made you a ruler and a judge over us? Are you saying, ‘Will you kill me as you killed the Egyptian?’” Then Moses was afraid and said, “Surely the matter has become known.”
translation:
  language: fr
  text: 'Mais l’homme répondit : « Qui t’a établi chef et juge sur nous ? Veux-tu me tuer comme tu as tué l’Égyptien ? » Moïse eut peur et dit : « C’est donc que l’affaire est maintenant connue ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי שָׂמְךָ
  choice: Qui t’a établi
  rationale: שׂים signifie ici établir ou nommer dans une fonction; cette tournure française rend naturellement la contestation de l’autorité de Moïse.
- source_word: לְאִישׁ שַׂר וְשֹׁפֵט
  choice: chef et juge
  rationale: אִישׁ introduit ici les fonctions en apposition plutôt qu’une désignation indépendante à rendre littéralement par « homme »; « chef » exprime l’autorité de שַׂר sans connotation monarchique excessive.
- source_word: עָלֵינוּ
  choice: sur nous
  rationale: La préposition עַל marque l’autorité exercée sur les interlocuteurs.
- source_word: הַלְהָרְגֵנִי אַתָּה אֹמֵר
  choice: Veux-tu me tuer
  rationale: La construction avec אֹמֵר peut littéralement évoquer le fait de « dire », mais elle exprime idiomatiquement ici l’intention; cette formulation française naturelle conserve la portée interrogative.
- source_word: כַּאֲשֶׁר הָרַגְתָּ אֶת־הַמִּצְרִי
  choice: comme tu as tué l’Égyptien
  rationale: Rend directement la comparaison et conserve la détermination de « l’Égyptien ».
- source_word: וַיִּירָא מֹשֶׁה
  choice: Moïse eut peur
  rationale: Rend simplement le récit au passé et la réaction de crainte de Moïse.
- source_word: וַיֹּאמַר
  choice: se dit
  rationale: Dans ce contexte de réaction intérieure, le réfléchi est naturel en français, sans exclure absolument une parole prononcée.
- source_word: אָכֵן נוֹדַע הַדָּבָר
  choice: Ainsi, l’affaire est connue !
  rationale: אָכֵן marque ici une constatation ou une déduction; le niphal נוֹדַע indique que l’affaire a été découverte ou est désormais connue.
theological_decisions:
- issue: Valeur de אֹמֵר dans הַלְהָרְגֵנִי אַתָּה אֹמֵר
  choice: Veux-tu me tuer
  alternative: 'Dis-tu : « Vais-tu me tuer ? » / As-tu l’intention de me tuer'
  rationale: La formulation choisie rend l’intention menaçante de façon idiomatique sans faire de la parole elle-même l’enjeu théologique du passage.
- issue: Rendu de לְאִישׁ
  choice: Non exprimé séparément devant « chef et juge »
  alternative: Qui t’a établi comme homme, chef et juge sur nous ?
  rationale: אִישׁ fonctionne vraisemblablement comme élément appositionnel dans la formule; le rendre par « homme » produirait en français une coordination artificielle et pourrait suggérer à tort que la masculinité de Moïse est contestée.
translation_notes:
  register: Français moderne, international et digne. Le dialogue reste direct et vif; le passé simple convient au registre narratif biblique sans vocabulaire archaïque.
