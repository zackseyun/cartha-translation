  text: וַ/תֹּ֧אמֶר לָ֣/הּ בַּת פַּרְעֹ֗ה הֵילִ֜יכִי אֶת הַ/יֶּ֤לֶד הַ/זֶּה֙ וְ/הֵינִקִ֣/הוּ לִ֔/י וַ/אֲנִ֖י אֶתֵּ֣ן אֶת שְׂכָרֵ֑/ךְ וַ/תִּקַּ֧ח הָ/אִשָּׁ֛ה הַ/יֶּ֖לֶד וַ/תְּנִיקֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/009.yaml
  text: Then Pharaoh’s daughter said to her[a], “Take this child and nurse him for me, and I will give you your wages.” So the woman took the child and nursed him.
translation:
  language: fr
  text: 'La fille du pharaon lui dit : « Emporte cet enfant et allaite-le pour moi ; je te donnerai ton salaire. » La femme prit donc l’enfant et l’allaita.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: la fille du pharaon
  rationale: Le groupe construit désigne la fille de Pharaon. L’article devant « pharaon » convient ici à l’usage courant du français moderne.
- source_word: הֵילִיכִי
  choice: Emporte
  rationale: Le hifil impératif de הלך exprime ici l’ordre de prendre l’enfant avec soi et de l’emmener. « Emporte » rend naturellement le déplacement demandé sans ajouter un second verbe.
- source_word: הַיֶּלֶד הַזֶּה
  choice: cet enfant
  rationale: יֶלֶד peut désigner un enfant ou un garçon. « Cet enfant » reste proche du texte et convient au nourrisson présent dans le contexte.
- source_word: וְהֵינִקִהוּ לִי
  choice: et allaite-le pour moi
  rationale: Le verbe ינק au hifil désigne le fait de faire téter, donc d’allaiter. En français actuel, « allaiter » est précis, naturel et explicite ; « pour moi » conserve la valeur de לִי, indiquant un service rendu pour la fille du pharaon.
- source_word: וַאֲנִי אֶתֵּן אֶת שְׂכָרֵךְ
  choice: je te donnerai ton salaire
  rationale: שָׂכָר désigne la rémunération d’un travail. Cette formulation suit de près l’hébreu tout en restant idiomatique en français.
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: Le texte dit littéralement « la femme », et non « sa mère ». Cette désignation préserve la formulation narrative sans expliciter ici une identité déjà connue du contexte.
- source_word: וַתְּנִיקֵהוּ
  choice: et l’allaita
  rationale: Le même verbe d’allaitement est rendu de manière cohérente avec l’ordre précédent. Le passé simple convient au registre narratif biblique français, tout en restant clair.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe demeure proche de l’hébreu sans calque pesant. « Allaiter » évite l’ambiguïté que pourrait avoir « nourrir » et ne nécessite donc pas de note lexicale. Le passé simple est maintenu pour une narration biblique littéraire mais accessible.
