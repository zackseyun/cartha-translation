  text: וַ/יָּבֹ֥אוּ הָ/רֹעִ֖ים וַ/יְגָרְשׁ֑וּ/ם וַ/יָּ֤קָם מֹשֶׁה֙ וַ/יּ֣וֹשִׁעָ֔/ן וַ/יַּ֖שְׁקְ אֶת צֹאנָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/017.yaml
  text: Then the shepherds came and drove them away[a], but Moses stood up and saved them, and watered their flock.
translation:
  language: fr
  text: Alors les bergers arrivèrent et les chassèrent. Mais Moïse se leva, les délivra[a] et abreuva leur troupeau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les sauva » ou « vint à leur secours ». Le verbe hébreu exprime le fait de sauver ou de délivrer; ici, Moïse soustrait les femmes à l’hostilité des bergers.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹעִים
  choice: les bergers
  rationale: Le participe substantivé de רעה désigne ceux qui gardent les troupeaux. « Bergers » est naturel en français et convient au contexte.
- source_word: וַיְגָרְשׁוּם
  choice: les chassèrent
  rationale: גרש exprime l’action hostile de chasser ou d’expulser. « Les chassèrent » est concis et idiomatique.
- source_word: וַיָּקָם
  choice: se leva
  rationale: קום marque ici la réaction résolue de Moïse. « Se leva » conserve à la fois le mouvement et l’entrée en action.
- source_word: וַיּוֹשִׁעָן
  choice: les délivra
  rationale: Le hifil de ישׁע signifie sauver ou délivrer. « Les délivra » préserve la force du verbe tout en laissant le contexte préciser qu’il s’agit de les soustraire aux bergers.
- source_word: וַיַּשְׁקְ
  choice: abreuva
  rationale: שקה signifie donner à boire. « Abreuva » est le verbe français précis et naturel pour un troupeau.
- source_word: צֹאנָם
  choice: leur troupeau
  rationale: צאן est un nom collectif désignant le petit bétail, souvent des moutons et des chèvres. « Leur troupeau » évite de préciser indûment l’espèce.
- source_word: וַיָּבֹאוּ
  choice: Alors … arrivèrent
  rationale: Le wayyiqtol fait progresser le récit. « Alors » rend naturellement cette succession narrative en français.
theological_decisions:
- issue: Portée du verbe ישׁע appliqué à l’intervention de Moïse
  choice: les délivra
  alternative: vint à leur secours / les sauva
  rationale: Le choix conserve le sens fort de délivrance sans transformer la scène en affirmation doctrinale; le contexte indique une délivrance face à l’hostilité des bergers.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide tout en reproduisant la succession des actions. « Abreuva » apporte la précision usuelle du français pour donner à boire au bétail.
