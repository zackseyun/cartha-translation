  yaml_path: translation/ot/exodus/002/008.yaml
  text: Pharaoh’s daughter said to her, “Go.” So the young woman went and called the child’s mother.
translation:
  language: fr
  text: 'La fille de Pharaon lui dit : « Va. » Alors la jeune fille alla appeler la mère de l’enfant.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: la fille du pharaon
  rationale: Le groupe construit désigne la fille de Pharaon. Cette formulation est naturelle en français et reste proche de l’hébreu.
- source_word: לֵכִי
  choice: Va
  rationale: Impératif qal féminin singulier de הלך. L’impératif bref « Va » reproduit directement la concision de l’hébreu.
- source_word: הָעַלְמָה
  choice: la jeune fille
  rationale: עַלְמָה désigne une jeune femme ou une jeune fille en âge de se marier. Dans ce contexte, où il s’agit de la sœur encore jeune de Moïse, « la jeune fille » est naturel et ne suggère pas un âge adulte avec une précision excessive.
- source_word: וַתִּקְרָא אֶת אֵם הַיָּלֶד
  choice: alla donc appeler la mère de l’enfant
  rationale: קרא avec un complément direct signifie ici appeler ou faire venir. « Appeler » conserve la simplicité narrative; « alla donc » exprime naturellement en français l’enchaînement des formes narratives hébraïques.
- source_word: הַיָּלֶד
  choice: l’enfant
  rationale: יֶלֶד peut désigner un enfant ou un garçon. « L’enfant » convient au nourrisson évoqué ici sans ajouter une précision absente de ce membre de phrase.
