source:
  edition: WLC
  text: וַ/יִגְדַּ֣ל הַ/יֶּ֗לֶד וַ/תְּבִאֵ֨/הוּ֙ לְ/בַת פַּרְעֹ֔ה וַֽ/יְהִי לָ֖/הּ לְ/בֵ֑ן וַ/תִּקְרָ֤א שְׁמ/וֹ֙ מֹשֶׁ֔ה וַ/תֹּ֕אמֶר כִּ֥י מִן הַ/מַּ֖יִם מְשִׁיתִֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/010.yaml
  text: When the child grew[a], she brought him to Pharaoh’s daughter, and he became her son. She named him Moses, for she said[b], “I drew him out of the water.”
translation:
  language: fr
  text: 'Quand l’enfant eut grandi, elle l’amena à la fille du pharaon, et il devint son fils.[a] Elle l’appela Moïse, car elle dit : « Je l’ai tiré de l’eau. »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il fut pour elle un fils ».'
    reason: lexical_alternative
  - marker: b
    text: Le nom Moïse présente en hébreu une ressemblance sonore avec l’expression traduite par « je l’ai tiré ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִגְדַּל
  choice: eut grandi
  rationale: Le verbe גדל décrit ici la croissance de l’enfant. Le passé antérieur marque naturellement en français que cette croissance précède le moment où sa mère l’amène à la fille du pharaon.
- source_word: הַיֶּלֶד
  choice: l’enfant
  rationale: יֶלֶד peut désigner un enfant ou un garçon. « L’enfant » maintient le lien avec le contexte de sa petite enfance sans préciser davantage son âge.
- source_word: וַתְּבִאֵהוּ
  choice: elle l’amena
  rationale: La forme causative de בוא signifie couramment « amener ». D’après le contexte précédent, le sujet est la mère de Moïse.
- source_word: לְבַת פַּרְעֹה
  choice: à la fille du pharaon
  rationale: Cette formulation naturelle conserve exactement la relation exprimée par la construction hébraïque.
- source_word: וַיְהִי לָהּ לְבֵן
  choice: il devint son fils
  rationale: L’expression indique que l’enfant acquiert auprès d’elle un véritable statut filial, sans que le texte précise les modalités juridiques de cette relation.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: Elle l’appela
  rationale: La formule hébraïque de nomination se rend naturellement en français par « elle l’appela » devant le nom donné.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: « Moïse » est la forme française traditionnelle et largement reconnue de ce nom.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit l’explication donnée par la fille du pharaon pour le choix du nom.
- source_word: מִן הַמַּיִם
  choice: de l’eau
  rationale: Bien que מַיִם soit morphologiquement pluriel, « de l’eau » est ici l’expression française naturelle dans ce contexte.
- source_word: מְשִׁיתִהוּ
  choice: Je l’ai tiré
  rationale: « Tirer » rend le sens de משה dans ce contexte de sauvetage et permet à la note de signaler le rapprochement sonore avec le nom Moïse.
theological_decisions:
- issue: Nature de la relation de Moïse avec la fille du pharaon dans וַיְהִי לָהּ לְבֵן
  choice: « il devint son fils » présente une relation filiale réelle, de nature adoptive dans le récit
  alternative: « il fut pour elle comme un fils », qui pourrait suggérer une simple ressemblance affective
  rationale: L’hébreu affirme qu’il fut pour elle un fils, mais ne décrit aucune procédure juridique. La traduction garde donc la force de la relation filiale sans ajouter de cadre institutionnel.
translation_notes:
  register: Français moderne, international et digne, avec une narration fluide. Le titre « pharaon » reste en minuscule conformément à l’usage français courant. Les marqueurs de note sont placés immédiatement après les expressions qu’ils éclairent.
