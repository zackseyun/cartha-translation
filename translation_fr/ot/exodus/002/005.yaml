review_pass:
  verdict: revise
  source_fidelity: 'La dernière proposition du brouillon attribue à la servante l’action de prendre la corbeille (« envoya sa servante la prendre »). Or le sujet grammatical de וַתִּקָּחֶהָ demeure la fille du pharaon : elle envoya sa servante, puis elle prit la corbeille. Le reste rend fidèlement la scène, y compris la valeur durative de « marchaient » et la localisation parmi les roseaux.'
  naturalness: Le français est moderne et narratif. « Ses jeunes suivantes » rend plus naturellement, dans ce contexte de cour, les נערות tout en conservant l’idée de jeunes femmes attachées à la fille du pharaon. La reprise explicite « elle la prit » évite toute ambiguïté d’attribution.
  terminology: « La fille du pharaon », « Nil », « corbeille » et « roseaux » conviennent. La note sur תבה préserve utilement le lien lexical avec l’arche de Noé. La note sur אֲמָתָהּ doit signaler précisément l’alternative « son bras », sans la présenter comme le texte principal.
  issues:
  - severity: high
    issue: Le brouillon attribue la prise de la corbeille à la servante.
    rationale: Dans le texte hébreu, après « elle envoya sa servante », le verbe וַתִּקָּחֶהָ est toujours au féminin singulier avec la fille du pharaon comme sujet; le suffixe désigne la corbeille. La construction française proposée modifie donc l’agent de l’action.
  - severity: low
    issue: La note b paraphrase l’alternative au lieu d’indiquer clairement le mot alternatif.
    rationale: L’alternative traditionnelle porte sur אֲמָתָהּ, compris comme « son bras ». Une formulation lexicale précise préserve mieux l’ambiguïté sans imposer une reconstruction interprétative complète.
