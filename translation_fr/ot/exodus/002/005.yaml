base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/005.yaml
  text: Then Pharaoh’s daughter went down to bathe at the Nile[a], while her young women were walking along the bank of the Nile. She saw the basket in the midst of the reeds[c][b], and she sent her servant girl and took it.
translation:
  language: fr
  text: La fille du pharaon descendit au Nil pour se baigner, tandis que ses jeunes suivantes marchaient le long de la rive. Elle aperçut la corbeille[a] au milieu des roseaux. Elle envoya sa servante[b], puis elle la prit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « corbeille » est le même que celui qui désigne l’« arche » de Noé en Genèse 6–9.
    reason: cross_reference
  - marker: b
    text: 'Hébreu : « sa servante » ; une lecture traditionnelle comprend « son bras ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּרֶד
  choice: descendit
  rationale: Le verbe ירד exprime un mouvement vers le bas; « descendit » est naturel et précis dans ce récit.
- source_word: בַּת פַּרְעֹה
  choice: la fille du pharaon
  rationale: Rend directement la construction hébraïque; la minuscule convient au titre royal employé ici.
- source_word: לִרְחֹץ עַל הַיְאֹר
  choice: au Nil pour se baigner
  rationale: רחץ désigne ici l’action de se baigner, et על a une valeur locale dans le contexte.
- source_word: וְנַעֲרֹתֶיהָ
  choice: ses jeunes servantes
  rationale: נערות désigne de jeunes femmes; le contexte de la suite de la princesse permet de préciser leur fonction sans employer le désuet « jeunes filles » au sens de suivantes.
- source_word: הֹלְכֹת עַל יַד הַיְאֹר
  choice: marchaient le long de la rive
  rationale: Le participe marque l’action d’arrière-plan en cours, et l’expression על יד indique la proximité du fleuve; « la rive » évite une répétition lourde du Nil.
- source_word: הַתֵּבָה
  choice: la corbeille
  rationale: Dans ce contexte, תבה désigne le petit contenant de l’enfant. « Corbeille » est idiomatique en français, tandis qu’une note conserve le lien lexical avec l’arche de Noé.
- source_word: בְּתוֹךְ הַסּוּף
  choice: au milieu des roseaux
  rationale: Rend de près la localisation et le sens collectif de סוּף.
- source_word: אֲמָתָהּ
  choice: sa servante
  rationale: La vocalisation massorétique et la syntaxe avec שלח favorisent le sens de « servante »; le genre féminin est exprimé naturellement en français.
- source_word: וַתִּקָּחֶהָ
  choice: la prendre
  rationale: Le suffixe féminin renvoie à la corbeille. La subordination française « envoya sa servante la prendre » rend naturellement la séquence hébraïque et attribue la prise à la servante, conformément à la syntaxe contextuelle.
theological_decisions:
- issue: Traduction de תבה dans le récit de Moïse
  choice: corbeille
  alternative: arche
  rationale: Le référent immédiat est un petit contenant, mais le même nom hébreu désigne l’arche de Noé; la note préserve cette résonance intertextuelle sans rendre le texte principal artificiel.
- issue: Identification de אֲמָתָהּ
  choice: sa servante
  alternative: son bras
  rationale: La lecture « servante » correspond au texte massorétique vocalisé et s’accorde avec le verbe « envoyer ». La lecture traditionnelle « bras » est signalée afin de préserver l’alternative ancienne.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation évite les archaïsmes (« jeune fille » au sens de suivante, « servante » composée) et maintient les liens lexicaux et l’alternative textuelle en notes.
