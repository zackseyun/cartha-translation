  rationale: La révision rétablit la fille du pharaon comme sujet de « prit », conformément à la syntaxe et à la succession verbale hébraïques. Elle affine aussi la note textuelle afin de documenter l’alternative « bras » sans l’intégrer au sens principal. Aucun changement théologique ou interprétatif n’est introduit.
