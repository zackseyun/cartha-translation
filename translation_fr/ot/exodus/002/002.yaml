  text: וַ/תַּ֥הַר הָ/אִשָּׁ֖ה וַ/תֵּ֣לֶד בֵּ֑ן וַ/תֵּ֤רֶא אֹת/וֹ֙ כִּי ט֣וֹב ה֔וּא וַֽ/תִּצְפְּנֵ֖/הוּ שְׁלֹשָׁ֥ה יְרָחִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/002.yaml
  text: The woman became pregnant and gave birth to a son. When she saw that he was good[a], she hid him for three months.
translation:
  language: fr
  text: La femme devint enceinte et donna naissance à un fils. Quand elle vit qu’il était bon[a], elle le cacha pendant trois mois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « beau ». L’hébreu dit littéralement « bon », terme qui peut aussi signifier ici qu’il était beau, agréable à voir ou bien fait.
    reason: Alternative lexicale préservant l’étendue sémantique de טוֹב.
lexical_decisions:
- source_word: וַתַּהַר
  choice: devint enceinte
  rationale: Le verbe הרה exprime le fait de concevoir ou de devenir enceinte. « Devint enceinte » est clair et naturel, tout en conservant la succession narrative.
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: L’hébreu dit explicitement « la femme ». Cette formulation suit le texte sans ajouter ici « sa femme » à partir du contexte.
- source_word: וַתֵּלֶד בֵּן
  choice: donna naissance à un fils
  rationale: Cette expression rend naturellement l’idiome hébreu de l’accouchement dans un français moderne et digne.
- source_word: וַתֵּרֶא אֹתוֹ כִּי טוֹב הוּא
  choice: Quand elle vit qu’il était bon
  rationale: La subordination avec « quand » restitue naturellement le déroulement du récit. « Elle vit qu’il était… » exprime clairement la construction avec l’objet suivi de la proposition introduite par כִּי.
- source_word: טוֹב
  choice: bon
  rationale: טוֹב signifie fondamentalement « bon », avec selon le contexte les nuances de beau, agréable ou bien fait. « Bon » préserve aussi un possible écho au vocabulaire de Genèse 1, sans imposer une lecture exclusivement esthétique.
- source_word: וַתִּצְפְּנֵהוּ
  choice: elle le cacha
  rationale: Le verbe צפן signifie cacher ou dissimuler. « Cacha » est direct et idiomatique dans ce récit.
- source_word: שְׁלֹשָׁה יְרָחִים
  choice: pendant trois mois
  rationale: יֶרַח désigne un mois, historiquement lié au cycle lunaire. « Trois mois » transmet exactement le sens requis sans précision technique superflue.
theological_decisions:
- issue: Description du nourrisson par טוֹב
  choice: bon
  alternative: beau ; agréable à voir ; bien fait
  rationale: Le sens lexical premier est « bon ». Ce choix ne réduit pas le terme à la beauté physique et maintient son éventuelle résonance avec le langage de la création. Comme une lecture esthétique est ancienne et contextuellement possible, elle est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste proche de la syntaxe narrative hébraïque tout en évitant un calque maladroit. Le mot « bon » est volontairement conservé dans le texte principal, avec l’interprétation esthétique en note.
