  yaml_path: translation/ot/exodus/002/020.yaml
  text: And he said to his daughters, “Then where is he? Why is it that you left the man? Call him, so that he may eat bread.”
translation:
  language: fr
  text: 'Il dit à ses filles : « Alors, où est-il ? Pourquoi donc avez-vous laissé cet homme ? Appelez-le, pour qu’il mange du pain. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַיּוֹ
  choice: Mais où est-il ?
  rationale: L’interrogatif אַיּוֹ signifie « où est-il ? » ; וְ est rendu ici par « mais », qui exprime naturellement la réaction du père dans le contexte.
- source_word: לָמָּה זֶּה
  choice: Pourquoi
  rationale: L’expression interrogative renforcée demande la raison de leur conduite ; en français courant, « pourquoi » en transmet le sens sans lourdeur.
- source_word: עֲזַבְתֶּן אֶת־הָאִישׁ
  choice: avez-vous laissé cet homme là-bas
  rationale: עָזַב signifie ici laisser quelqu’un sur place plutôt que l’abandonner au sens affectif. « Cet homme » reprend naturellement l’homme dont les filles viennent de parler.
- source_word: קִרְאֶן לוֹ
  choice: Appelez-le
  rationale: L’impératif féminin pluriel invite les filles à faire venir l’homme ; « appelez-le » conserve la formulation directe de l’hébreu.
- source_word: וְיֹאכַל לָחֶם
  choice: pour qu’il vienne manger
  rationale: Littéralement « afin qu’il mange du pain » ; l’expression hébraïque signifie prendre un repas. « vienne » explicite naturellement le but de l’invitation déjà contenu dans le contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, oral et digne. Le dialogue conserve la vivacité des questions du père sans reproduire des tournures hébraïques artificielles.
