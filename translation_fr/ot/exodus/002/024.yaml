  text: וַ/יִּשְׁמַ֥ע אֱלֹהִ֖ים אֶת נַאֲקָתָ֑/ם וַ/יִּזְכֹּ֤ר אֱלֹהִים֙ אֶת בְּרִית֔/וֹ אֶת אַבְרָהָ֖ם אֶת יִצְחָ֥ק וְ/אֶֽת יַעֲקֹֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/024.yaml
  text: God heard their groaning[a], and God remembered his covenant with Abraham, with Isaac[b], and with Jacob.
translation:
  language: fr
  text: Dieu entendit leurs gémissements[a], et Dieu se souvint[b] de son alliance avec Abraham, avec Isaac et avec Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur plainte ». Le nom hébreu peut désigner un cri douloureux ou des gémissements causés par l’oppression.
    reason: lexical_alternative
  - marker: b
    text: 'Ici, « se souvint » appartient au langage de l’alliance : l’expression ne signifie pas nécessairement que Dieu avait oublié, mais qu’il allait intervenir avec fidélité conformément à son alliance.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: entendit
  rationale: Le verbe שׁמע désigne ici naturellement le fait que Dieu entend la détresse d’Israël. « Écouta » pourrait suggérer une attention prolongée que la forme hébraïque n’explicite pas.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le nom régit ici des verbes au singulier et désigne le Dieu unique.
- source_word: נַאֲקָתָם
  choice: leurs gémissements
  rationale: נַאֲקָה désigne un gémissement ou un cri douloureux provoqué par l’oppression. Le pluriel français exprime naturellement la détresse collective et persistante.
- source_word: וַיִּזְכֹּר
  choice: se souvint
  rationale: Cette traduction conserve le sens lexical direct et le langage anthropomorphique du texte, sans développer dans le corps du verset l’action fidèle qu’il implique dans ce contexte d’alliance.
- source_word: בְּרִיתוֹ
  choice: son alliance
  rationale: בְּרִית est le terme habituel pour une alliance, et le suffixe possessif indique qu’il s’agit de l’alliance de Dieu.
- source_word: אֶת אַבְרָהָם אֶת יִצְחָק וְאֶת יַעֲקֹב
  choice: avec Abraham, avec Isaac et avec Jacob
  rationale: La préposition « avec », exigée par l’usage français après « alliance », explicite correctement la relation. Sa répétition reflète la cadence et l’insistance de l’hébreu.
theological_decisions:
- issue: Langage anthropomorphique dans « Dieu se souvint »
  choice: Conserver « se souvint » dans le texte principal.
  alternative: « Dieu porta de nouveau son attention sur son alliance » ou « Dieu agit conformément à son alliance »
  rationale: L’hébreu emploie le langage ordinaire du souvenir dans un cadre d’alliance. Il signale la fidélité et l’intervention de Dieu sans nécessairement supposer un oubli préalable. Une paraphrase comme « agit conformément à » résoudrait une tension que le texte laisse intacte.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique soutenu sans être archaïque. La répétition de « Dieu » et de « avec » préserve l’insistance et le rythme de l’hébreu.
