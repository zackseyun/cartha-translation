base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/003.yaml
  text: But when she could no longer hide him[a], she took for him a papyrus basket and coated it with bitumen and pitch. Then she put the child in it and placed it among the reeds by the bank of the Nile.
translation:
  language: fr
  text: Mais lorsqu’elle ne put plus le cacher, elle prit pour lui une corbeille de papyrus[a], l’enduisit de bitume et de poix, y déposa l’enfant et la plaça parmi les roseaux, au bord du Nil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une arche de papyrus ». Le mot hébreu téva est le même que celui qui désigne l’arche de Noé dans la Genèse, ce qui préserve un écho littéraire de délivrance à travers les eaux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּפִינוֹ
  choice: le cacher
  rationale: L’infinitif construit au hifil de צפן, avec suffixe masculin singulier, signifie « le cacher ». Cette formulation est naturelle en français et conserve l’action concrète.
- source_word: תֵּבַת
  choice: une corbeille
  rationale: תֵּבָה désigne un coffre ou contenant; ici, il s’agit d’un petit récipient flottant destiné au nourrisson. « Corbeille » convient au contexte et reste clair, tandis que « arche » est signalé en note afin de préserver l’écho avec le récit de Noé.
- source_word: גֹּמֶא
  choice: de papyrus
  rationale: גֹּמֶא désigne précisément le papyrus, matériau cohérent avec le cadre égyptien.
- source_word: וַתַּחְמְרָה בַחֵמָר
  choice: l’enduisit de bitume
  rationale: Le verbe exprime l’action d’enduire ou de recouvrir, et חֵמָר désigne le bitume. La formulation rend clairement l’imperméabilisation du contenant.
- source_word: וּבַזָּפֶת
  choice: et de poix
  rationale: זֶפֶת désigne la poix, matière résineuse utilisée pour l’étanchéité. « Poix » se distingue utilement de « bitume » tout en restant précis.
- source_word: הַיֶּלֶד
  choice: l’enfant
  rationale: יֶלֶד signifie largement « enfant » ou « garçon ». « L’enfant » respecte le degré de précision du texte hébreu sans expliciter davantage son âge.
- source_word: בַּסּוּף
  choice: parmi les roseaux
  rationale: סוּף désigne des roseaux ou joncs. « Parmi les roseaux » exprime naturellement que la corbeille est placée dans cette végétation.
- source_word: עַל שְׂפַת הַיְאֹר
  choice: au bord du Nil
  rationale: Dans le contexte égyptien de l’Exode, יְאֹר renvoie au Nil. « Au bord du Nil » est précis et idiomatique.
- source_word: לֹא יָכְלָה עוֹד
  choice: ne put plus
  rationale: Cette tournure concise rend l’idée qu’elle avait atteint la limite de sa capacité à continuer de le cacher.
- source_word: לּוֹ
  choice: pour lui
  rationale: Le pronom datif est conservé explicitement, conformément à l’hébreu, pour indiquer que la corbeille est préparée à l’intention de l’enfant.
