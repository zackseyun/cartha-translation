  text: וַ/תֵּ֣לֶד בֵּ֔ן וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ גֵּרְשֹׁ֑ם כִּ֣י אָמַ֔ר גֵּ֣ר הָיִ֔יתִי בְּ/אֶ֖רֶץ נָכְרִיָּֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/022.yaml
  text: She gave birth to a son[a], and he called his name Gershom, for he said[b], “I have been a sojourner in a foreign land.”
translation:
  language: fr
  text: 'Elle mit au monde un fils et lui donna le nom de Guershom[a], car il dit : « J’ai été un étranger dans un pays étranger. »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom « Guershom » évoque en hébreu l’expression « un étranger là-bas », en lien avec l’explication donnée dans ce verset.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « J’étais un étranger dans un pays étranger. »'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּלֶד בֵּן
  choice: Elle mit au monde un fils
  rationale: Rend naturellement en français moderne la formule de naissance, tout en conservant explicitement בֵּן, « fils ».
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: et lui donna le nom de
  rationale: Équivalent français idiomatique de la formule hébraïque littérale « il appela son nom », avec le sujet masculin conservé par « lui donna ».
- source_word: גֵּרְשֹׁם
  choice: Guershom
  rationale: Translittération française conventionnelle du nom hébreu, qui permet aussi d’en signaler l’écho sonore en note.
- source_word: כִּי אָמַר
  choice: car il avait dit
  rationale: כִּי introduit l’explication du nom. Le plus-que-parfait situe naturellement la parole explicative par rapport à l’acte de nommer, sans modifier son contenu.
- source_word: גֵּר
  choice: immigré
  rationale: Désigne ici une personne installée hors de son pays et vivant parmi une autre population. « Immigré » est actuel et plus précis que « étranger », tandis que « résident étranger » serait trop technique.
- source_word: הָיִיתִי
  choice: J’ai été
  rationale: Le passé composé préserve la possible portée résultative de l’accompli hébreu; l’imparfait « j’étais » reste également possible.
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: dans un pays étranger
  rationale: Rend directement l’idée d’un territoire qui n’est pas celui de Moïse, dans une formulation française claire et digne.
theological_decisions:
- issue: Portée temporelle de הָיִיתִי
  choice: J’ai été
  alternative: J’étais
  rationale: L’accompli hébreu peut être compris comme un constat rétrospectif ayant encore une pertinence au moment où Moïse nomme son fils, mais une simple référence passée demeure possible; cette ambiguïté est indiquée en note.
translation_notes:
  register: Français international moderne, naturel et digne. « Mettre au monde » et « donner le nom de » évitent les calques peu idiomatiques. « Immigré » exprime le statut de גֵּר sans archaïsme; la note conserve le jeu de mots imparfaitement reproductible avec Guershom.
