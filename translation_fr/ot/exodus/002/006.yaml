  text: וַ/תִּפְתַּח֙ וַ/תִּרְאֵ֣/הוּ אֶת הַ/יֶּ֔לֶד וְ/הִנֵּה נַ֖עַר בֹּכֶ֑ה וַ/תַּחְמֹ֣ל עָלָ֔י/ו וַ/תֹּ֕אמֶר מִ/יַּלְדֵ֥י הָֽ/עִבְרִ֖ים זֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/006.yaml
  text: She opened it and saw him[a], the child, and behold, a boy was crying. She had compassion on him and said[c][b], “This is one of the Hebrews’ children.”
translation:
  language: fr
  text: 'Elle l’ouvrit et vit l’enfant[a] : voici qu’un petit garçon pleurait. Elle eut compassion de lui[b] et dit : « C’est un des enfants des Hébreux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « elle le vit, l’enfant »; le pronom masculin est suivi de la précision « l’enfant ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Elle eut pitié de lui. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְתַּח
  choice: Elle l’ouvrit
  rationale: Le verbe signifie « ouvrir »; le pronom féminin « l’ » reprend naturellement la corbeille mentionnée dans le contexte.
- source_word: וַתִּרְאֵהוּ אֶת הַיֶּלֶד
  choice: et vit l’enfant
  rationale: Le suffixe masculin singulier est immédiatement explicité par « l’enfant ». Le français naturel peut réunir les deux éléments sans perdre le référent; une note signale la forme hébraïque.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette tournure actuelle conserve la fonction présentative et la vivacité de la particule hébraïque sans employer l’archaïsme « voici » isolé ou « et voici ».
- source_word: נַעַר בֹּכֶה
  choice: un petit garçon pleurait
  rationale: נַעַר désigne ici l’enfant mâle découvert dans la corbeille, tandis que le participe exprime l’action en cours. « Petit garçon » convient au contexte sans suggérer un adolescent.
- source_word: וַתַּחְמֹל עָלָיו
  choice: Elle eut compassion de lui
  rationale: חמל avec עַל exprime ici la compassion ou la pitié. Cette formulation dignifiée conserve la force affective sans anticiper explicitement l’idée de l’épargner.
- source_word: מִיַּלְדֵי הָעִבְרִים
  choice: un des enfants des Hébreux
  rationale: 'La préposition מן a une valeur partitive : elle identifie l’enfant comme appartenant au groupe des enfants des Hébreux.'
- source_word: זֶה
  choice: C’est
  rationale: Le démonstratif désigne l’enfant présent devant elle; « C’est » est la formulation idiomatique en français direct.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation resserre la scène visuelle; « voici que » préserve l’effet d’attention de l’hébreu. Le terme « Hébreux » conserve la désignation ethnique traditionnelle et précise.
