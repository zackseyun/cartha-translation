  text: וַ/יְהִי֩ בַ/יָּמִ֨ים הָֽ/רַבִּ֜ים הָ/הֵ֗ם וַ/יָּ֨מָת֙ מֶ֣לֶךְ מִצְרַ֔יִם וַ/יֵּאָנְח֧וּ בְנֵֽי יִשְׂרָאֵ֛ל מִן הָ/עֲבֹדָ֖ה וַ/יִּזְעָ֑קוּ וַ/תַּ֧עַל שַׁוְעָתָ֛/ם אֶל הָ/אֱלֹהִ֖ים מִן הָ/עֲבֹדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/023.yaml
  text: It happened in those many days that the king of Egypt died[a], and the sons of Israel groaned because of the slavery and cried out[c][b], and their cry for help went up to God because of the slavery.
translation:
  language: fr
  text: Au cours de cette longue période[a], le roi d’Égypte mourut. Les fils d’Israël[b] gémirent à cause de leur esclavage[c] et crièrent. Leur appel au secours monta jusqu’à Dieu à cause de leur esclavage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pendant ces nombreux jours »; autre traduction possible : « bien des jours plus tard ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque « les fils d’Israël » désigne ici collectivement le peuple d’Israël.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « travail forcé » ou « servitude ». Le terme hébreu désigne ici le labeur oppressif imposé aux Israélites.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Au cours de cette longue période
  rationale: Le verbe narratif introduit une nouvelle étape du récit. En français, la transition est portée naturellement par la proposition temporelle, sans formule archaïque comme « il arriva que ».
- source_word: בַיָּמִים הָרַבִּים הָהֵם
  choice: au cours de cette longue période
  rationale: La locution désigne une durée prolongée. Cette formulation française naturelle conserve cette valeur sans imposer le sens plus interprétatif « bien des années plus tard ».
- source_word: וַיָּמָת מֶלֶךְ מִצְרַיִם
  choice: le roi d’Égypte mourut
  rationale: Rendu direct de l’énoncé narratif, au passé simple adapté au registre du récit biblique.
- source_word: וַיֵּאָנְחוּ
  choice: gémirent
  rationale: Le verbe exprime la plainte profonde et perceptible que provoque la souffrance.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction conserve la forme masculine de l’expression hébraïque, qui désigne collectivement le peuple d’Israël.
- source_word: מִן הָעֲבֹדָה
  choice: à cause de leur esclavage
  rationale: Dans ce contexte, עֲבֹדָה renvoie au travail forcé oppressif imposé par l’Égypte. « Esclavage » en communique clairement la réalité et la valeur causale de מִן.
- source_word: וַיִּזְעָקוּ
  choice: crièrent
  rationale: Le verbe désigne un cri intense né de la détresse; l’absence de complément dans le texte source est préservée.
- source_word: וַתַּעַל שַׁוְעָתָם
  choice: leur appel au secours monta
  rationale: « Appel au secours » exprime la demande d’aide contenue dans שַׁוְעָה, tandis que « monta » conserve la métaphore verticale.
- source_word: אֶל הָאֱלֹהִים
  choice: jusqu’à Dieu
  rationale: « Jusqu’à » rend naturellement en français la destination atteinte par l’appel qui monte, sans ajouter de précision théologique.
- source_word: מִן הָעֲבֹדָה (seconde occurrence)
  choice: à cause de leur esclavage
  rationale: La répétition est maintenue afin de préserver l’insistance rhétorique et le lien causal du texte hébreu.
theological_decisions:
- issue: Sens de עֲבֹדָה dans le contexte de l’oppression en Égypte
  choice: esclavage
  alternative: travail forcé; servitude; travail
  rationale: Le contexte décrit une exploitation coercitive, non un travail neutre. « Esclavage » rend clairement la condition sociale et l’oppression sans importer une affirmation doctrinale.
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites; les enfants d’Israël
  rationale: Le choix conserve la forme de l’ethnonyme hébreu tout en signalant en note sa portée collective, sans limiter le groupe aux seuls hommes.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple convient au récit écrit sans archaïsme excessif. La première phrase a été restructurée pour éviter le calque peu naturel « Il arriva pendant ces nombreux jours que », tout en conservant l’idée d’une longue période. Les deux occurrences de la cause liée à l’esclavage sont maintenues.
