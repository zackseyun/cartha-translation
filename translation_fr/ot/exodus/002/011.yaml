base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/011.yaml
  text: It happened in those days[a], when Moses had grown up, that he went out to his brothers and saw their burdens. And he saw an Egyptian man striking a Hebrew man, one of his brothers.
translation:
  language: fr
  text: Il arriva, en ce temps-là, que Moïse, devenu adulte, se rendit auprès de ses frères[a] et vit leurs fardeaux. Il vit alors un Égyptien qui frappait un Hébreu, l’un de ses frères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « les siens » ou « les membres de son peuple ». L’hébreu emploie ici, puis à la fin du verset, le langage de la fraternité pour exprimer le lien de Moïse avec les Hébreux.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: Il arriva, en ce temps-là
  rationale: Rend la formule de transition narrative hébraïque dans un français actuel et digne, sans recourir à l’archaïsme « il advint » ni ajouter un marqueur temporel absent du texte.
- source_word: וַיִּגְדַּל
  choice: devenu adulte
  rationale: Dans ce contexte, le verbe indique que Moïse est parvenu à l’âge adulte, non qu’il est devenu grand par son rang. La tournure participiale s’intègre naturellement à la séquence française.
- source_word: אֶל אֶחָיו
  choice: vers ses frères
  rationale: Conserve le langage familial explicite de l’hébreu et le mouvement exprimé par אֶל, tout en soulignant la solidarité de Moïse avec les Hébreux.
- source_word: בְּסִבְלֹתָם
  choice: leurs pénibles travaux
  rationale: Le nom désigne les lourdes tâches imposées aux Israélites. « Pénibles travaux » communique le travail oppressif sans réduire le terme à la seule souffrance ni employer le mot plus étroit « corvées ».
- source_word: אִישׁ מִצְרִי מַכֶּה אִישׁ עִבְרִי
  choice: un Égyptien qui frappait un Hébreu
  rationale: Le français identifie naturellement les hommes par « un Égyptien » et « un Hébreu » sans répéter « homme ». L’imparfait dans la relative rend l’action en cours exprimée par le participe מַכֶּה.
- source_word: מֵאֶחָיו
  choice: l’un de ses frères
  rationale: Maintient le lien lexical avec la première occurrence de « ses frères » et préserve l’image de parenté par laquelle le récit exprime l’appartenance de Moïse au peuple hébreu.
theological_decisions:
- issue: Sens du langage de parenté אֶחָיו / מֵאֶחָיו
  choice: ses frères / l’un de ses frères
  alternative: les siens, les membres de son peuple ou ses compatriotes
  rationale: Le texte désigne collectivement les Hébreux comme les « frères » de Moïse. La traduction conserve cette métaphore familiale et la solidarité qu’elle véhicule, tandis que la note signale les équivalents contextuels possibles sans effacer l’expression du texte.
translation_notes:
  register: Français international moderne, narratif et digne. La légère solennité de « Il arriva, en ce temps-là » reflète la formule hébraïque sans archaïsme. Les tournures idiomatiques françaises évitent la répétition peu naturelle de « homme », tout en conservant les oppositions ethniques et le langage familial du texte source.
