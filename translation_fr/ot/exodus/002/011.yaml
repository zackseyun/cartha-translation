  - severity: low
    issue: « sortit vers ses frères » est peu idiomatique
    rationale: La préposition « vers » rend la direction, mais la tournure est raide en français moderne. « Se rendit auprès de » exprime naturellement le mouvement vers ses frères sans modifier le sens contextuel.
