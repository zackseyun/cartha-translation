  text: וּ/לְ/כֹהֵ֥ן מִדְיָ֖ן שֶׁ֣בַע בָּנ֑וֹת וַ/תָּבֹ֣אנָה וַ/תִּדְלֶ֗נָה וַ/תְּמַלֶּ֨אנָה֙ אֶת הָ֣/רְהָטִ֔ים לְ/הַשְׁק֖וֹת צֹ֥אן אֲבִי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/016.yaml
  text: The priest of Midian had seven daughters[b][a], and they came and drew water and filled the troughs to water their father's flock.
translation:
  language: fr
  text: Le prêtre de Madian[a] avait sept filles. Elles vinrent puiser de l’eau[b] et remplirent les abreuvoirs pour faire boire le troupeau de leur père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un prêtre de Madian ». L’hébreu peut désigner soit un prêtre précis, soit simplement l’un des prêtres associés à Madian.
    reason: lexical_alternative
  - marker: b
    text: Le verbe traduit par « puiser de l’eau » désigne l’action de remonter l’eau d’un puits.
    reason: cultural_note
lexical_decisions:
- source_word: וּלְכֹהֵן מִדְיָן
  choice: Le prêtre de Madian
  rationale: La proposition nominale hébraïque exprime naturellement la possession en français (« avait »). כֹּהֵן désigne un prêtre, et מִדְיָן marque ici son rattachement à Madian. Le waw initial n’exige pas l’ajout d’un adverbe temporel.
- source_word: שֶׁבַע בָּנוֹת
  choice: avait sept filles
  rationale: La tournure hébraïque, littéralement « au prêtre… sept filles », est rendue par la construction possessive française courante.
- source_word: וַתָּבֹאנָה
  choice: Elles vinrent
  rationale: Le verbe בוא indique simplement leur venue sur les lieux; le passé simple convient au registre narratif digne du passage.
- source_word: וַתִּדְלֶנָה
  choice: puiser de l’eau
  rationale: דלה désigne ici l’action de remonter de l’eau d’un puits; l’objet implicite est explicité naturellement en français.
- source_word: וַתְּמַלֶּאנָה אֶת הָרְהָטִים
  choice: remplirent les abreuvoirs
  rationale: רְהָטִים désigne les récipients ou auges servant à abreuver les animaux; « abreuvoirs » est précis et idiomatique.
- source_word: לְהַשְׁקוֹת צֹאן אֲבִיהֶן
  choice: pour faire boire le troupeau de leur père
  rationale: Le hiphil de שקה signifie littéralement « faire boire ». צֹאן est un collectif pour le petit bétail, rendu naturellement par « troupeau ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient un registre narratif soutenu mais courant dans la traduction biblique. La rupture de phrase après « sept filles » évite une coordination lourde sans modifier la progression du récit.
