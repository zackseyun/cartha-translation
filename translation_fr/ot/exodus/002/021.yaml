  text: And Moses agreed to dwell with the man[b][a], and he gave Zipporah his daughter to Moses.
translation:
  language: fr
  text: Moïse consentit à vivre avec cet homme[a], et celui-ci lui donna sa fille Séphora[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « voulut bien vivre avec cet homme ». Le verbe hébreu peut exprimer la volonté, le consentement ou le fait de se montrer disposé.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « lui donna sa fille Séphora ». Le contexte indique qu’il la lui donna en mariage.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: accepta
  rationale: Le verbe יאל exprime ici le consentement ou la disposition volontaire. « Accepta » est naturel en français moderne et s’accorde bien avec l’infinitif qui suit, sans exclure la nuance « consentit / voulut bien » signalée en note.
- source_word: לָשֶׁבֶת
  choice: de rester chez
  rationale: Dans ce contexte, ישב désigne le fait de demeurer ou de s’établir auprès de quelqu’un. « Rester chez » rend naturellement la résidence auprès de l’homme, sans conserver le sens littéral inapproprié de « s’asseoir ».
- source_word: הָאִישׁ
  choice: cet homme
  rationale: L’hébreu emploie le nom commun « l’homme », renvoyant au prêtre de Madian déjà mentionné. Le démonstratif français assure une référence naturelle sans introduire un nom propre absent du verset.
- source_word: וַיִּתֵּן
  choice: donna pour femme
  rationale: Le verbe signifie littéralement « donna », mais le contexte culturel et narratif indique sans ambiguïté qu’il s’agit d’un mariage. L’explicitation dans le texte français évite une formulation susceptible d’être comprise comme un simple transfert de personne.
- source_word: צִפֹּרָה
  choice: Séphora
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu צִפֹּרָה.
- source_word: בִּתּוֹ
  choice: sa fille
  rationale: Le suffixe possessif renvoie au sujet de « donna » ; « sa fille » en est le rendu direct.
- source_word: לְמֹשֶׁה
  choice: à Moïse
  rationale: La préposition לְ marque le bénéficiaire ou destinataire. La construction française « donner sa fille pour femme à Moïse » en restitue naturellement le rapport.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Accepta de rester chez » évite l’archaïsme de « demeurer » tout en exprimant une installation auprès de l’homme. L’ordre de la seconde proposition a été légèrement réorganisé pour une syntaxe française fluide. Les deux marqueurs figurent dans le texte principal.
