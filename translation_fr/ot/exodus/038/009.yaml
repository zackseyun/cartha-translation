source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ אֶת הֶ/חָצֵ֑ר לִ/פְאַ֣ת נֶ֣גֶב תֵּימָ֗נָ/ה קַלְעֵ֤י הֶֽ/חָצֵר֙ שֵׁ֣שׁ מָשְׁזָ֔ר מֵאָ֖ה בָּ/אַמָּֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/009.yaml
  text: He made the courtyard. On the south side[a], toward the south, the hangings of the courtyard were of finely twisted linen, a hundred cubits long.
translation:
  language: fr
  text: Il fit le parvis. Sur le côté sud, en direction du sud, les tentures du parvis[a] étaient en fin lin retors et mesuraient cent coudées de long.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les rideaux du parvis ».
    reason: Alternative lexicale pour קַלְעֵי, qui peut désigner des tentures ou des rideaux suspendus formant l’enceinte.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol de עשה poursuit le récit par une action successive. « Il fit » rend simplement l’acte sans alourdir la phrase d’un connecteur.
- source_word: הֶחָצֵר
  choice: le parvis
  rationale: Dans ce contexte, חָצֵר désigne l’espace extérieur délimité autour du sanctuaire. « Parvis » est le terme français courant et précis dans le vocabulaire du tabernacle.
- source_word: לִפְאַת נֶגֶב תֵּימָנָה
  choice: Sur le côté sud, en direction du sud
  rationale: Cette formulation conserve les deux indications méridionales de l’hébreu au lieu de les réduire à une seule, tout en restant intelligible en français moderne.
- source_word: קַלְעֵי הֶחָצֵר
  choice: les tentures du parvis
  rationale: קְלָעִים désigne ici les pièces de tissu suspendues qui formaient l’enceinte du parvis. « Tentures » exprime mieux cette fonction que le terme plus général « rideaux ».
- source_word: שֵׁשׁ מָשְׁזָר
  choice: en fin lin retors
  rationale: שֵׁשׁ indique le lin fin et מָשְׁזָר un fil retors. La formulation retenue est précise, concise et consacrée dans le registre biblique français sans être obscure.
- source_word: מֵאָה בָּאַמָּה
  choice: mesuraient cent coudées de long
  rationale: L’hébreu donne la mesure sans verbe explicite. « Mesuraient… de long » explicite naturellement en français la dimension indiquée.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La répétition directionnelle « sud… sud » est volontaire afin de préserver la formulation appuyée de l’hébreu. Le terme « parvis » maintient la précision cultuelle du passage.
