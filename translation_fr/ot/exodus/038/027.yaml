  text: וַ/יְהִ֗י מְאַת֙ כִּכַּ֣ר הַ/כֶּ֔סֶף לָ/צֶ֗קֶת אֵ֚ת אַדְנֵ֣י הַ/קֹּ֔דֶשׁ וְ/אֵ֖ת אַדְנֵ֣י הַ/פָּרֹ֑כֶת מְאַ֧ת אֲדָנִ֛ים לִ/מְאַ֥ת הַ/כִּכָּ֖ר כִּכָּ֥ר לָ/אָֽדֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/027.yaml
  text: 'The hundred talents of silver were for casting the bases of the sanctuary and the bases of the veil: one hundred bases for the hundred talents[b][a], a talent for each base.'
translation:
  language: fr
  text: 'Les cent talents d’argent furent employés à couler les bases du sanctuaire et les bases du voile[a] : cent bases pour les cent talents, soit un talent par base.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « voile » était le rideau intérieur qui séparait le lieu saint du lieu très saint.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: servirent à
  rationale: Dans ce relevé comptable, le verbe introduit l’affectation de l’argent. « Servirent à » exprime naturellement cet emploi en français.
- source_word: מְאַת כִּכַּר הַכֶּסֶף
  choice: les cent talents d’argent
  rationale: Le groupe construit indique une quantité précise déjà inscrite dans l’inventaire; « les cent talents d’argent » conserve le nombre et la mesure.
- source_word: לָצֶקֶת
  choice: à couler
  rationale: L’infinitif exprime ici le but; dans le contexte du travail du métal, « couler » désigne la fabrication par moulage.
- source_word: אַדְנֵי
  choice: bases
  rationale: Le terme désigne les pièces métalliques de fondation placées sous les éléments du sanctuaire. « Bases » est clair en français moderne; « socles » reste une possibilité.
- source_word: הַקֹּדֶשׁ
  choice: du sanctuaire
  rationale: Le mot désigne ici la structure sacrée, par contraste avec les bases du voile, sans imposer le sens plus restreint de « lieu saint ».
- source_word: הַפָּרֹכֶת
  choice: du voile
  rationale: Le terme désigne spécifiquement le rideau intérieur séparant les espaces sacrés du tabernacle; « voile » en conserve la portée cultuelle.
- source_word: לִמְאַת הַכִּכָּר
  choice: avec les cent talents
  rationale: La préposition marque ici la correspondance entre les cent bases et les cent talents employés. « Avec » reste proche de la formulation hébraïque sans surinterpréter la relation.
- source_word: כִּכָּר לָאָדֶן
  choice: un talent par base
  rationale: Cette formulation française concise rend exactement le rapport distributif d’un talent pour chaque base.
theological_decisions: []
