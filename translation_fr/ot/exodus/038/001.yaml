  text: וַ/יַּ֛עַשׂ אֶת מִזְבַּ֥ח הָ/עֹלָ֖ה עֲצֵ֣י שִׁטִּ֑ים חָמֵשׁ֩ אַמּ֨וֹת אָרְכּ֜/וֹ וְ/חָֽמֵשׁ אַמּ֤וֹת רָחְבּ/וֹ֙ רָב֔וּעַ וְ/שָׁלֹ֥שׁ אַמּ֖וֹת קֹמָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/001.yaml
  text: He made the altar of burnt offering of acacia wood[a], five cubits its length and five cubits its width, square, and three cubits its height.
translation:
  language: fr
  text: Il fit en bois d’acacia l’autel de l’holocauste. Celui-ci mesurait cinq coudées de long sur cinq coudées de large — il était carré — et trois coudées de haut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol poursuit le récit par une action passée. « Il fit » est direct, naturel et fidèle au verbe עשה.
- source_word: מִזְבַּח הָעֹלָה
  choice: l’autel de l’holocauste
  rationale: Le groupe construit désigne l’autel associé à l’offrande entièrement consumée. « L’autel de l’holocauste » conserve le singulier hébreu et emploie la terminologie française biblique usuelle.
- source_word: עֲצֵי שִׁטִּים
  choice: en bois d’acacia
  rationale: שִׁטִּים désigne l’acacia. Cette formulation est précise et immédiatement compréhensible en français moderne.
- source_word: חָמֵשׁ אַמּוֹת
  choice: cinq coudées
  rationale: La coudée est l’unité donnée par le texte et doit être conservée afin de rester cohérent avec l’ensemble des dimensions du sanctuaire.
- source_word: אָרְכּוֹ ... רָחְבּוֹ
  choice: cinq coudées de long sur cinq coudées de large
  rationale: Cette tournure française exprime naturellement les deux dimensions tout en conservant exactement leurs valeurs.
- source_word: רָבוּעַ
  choice: il était carré
  rationale: L’adjectif signifie « carré » ou « quadrangulaire ». « Carré » est le terme moderne le plus clair et rend pleinement la forme indiquée.
- source_word: קֹמָתוֹ
  choice: trois coudées de haut
  rationale: Dans ce contexte architectural, קוֹמָה désigne la hauteur. La formulation retenue est idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La seconde phrase allège l’accumulation des dimensions sans modifier leur rapport à l’autel. Les tirets mettent en relief l’indication de forme, qui intervient entre la largeur et la hauteur dans l’hébreu.
