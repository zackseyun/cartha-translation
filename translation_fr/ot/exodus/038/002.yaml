source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ קַרְנֹתָ֗י/ו עַ֚ל אַרְבַּ֣ע פִּנֹּתָ֔י/ו מִמֶּ֖/נּוּ הָי֣וּ קַרְנֹתָ֑י/ו וַ/יְצַ֥ף אֹת֖/וֹ נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/002.yaml
  text: He made its horns on its four corners[a]; its horns were of one piece with it[b], and he overlaid it with bronze.
translation:
  language: fr
  text: Il fit ses cornes à ses quatre angles; les cornes faisaient corps avec lui[a], puis il le recouvrit de bronze[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement: « de lui étaient ses cornes »; elles n’étaient donc pas fabriquées séparément puis fixées à l’autel.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut désigner le bronze ou le cuivre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le verbe עשה exprime ici simplement l’action de fabriquer. « Il fit » restitue naturellement la progression narrative du wayyiqtol sans ajout.
- source_word: קַרְנֹתָיו
  choice: ses cornes
  rationale: קֶרֶן signifie littéralement « corne » et désigne ici les saillies en forme de corne de l’autel. Le terme concret traditionnel reste clair dans ce contexte cultuel.
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: à ses quatre angles
  rationale: La préposition עַל situe les cornes par rapport aux quatre extrémités de l’autel. En français, « à ses quatre angles » est plus naturel que le calque « sur ses quatre angles » tout en conservant précisément la disposition.
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: les cornes faisaient corps avec lui
  rationale: Littéralement, « de lui étaient ses cornes ». La formulation indique que les cornes étaient intégrées à l’autel et non fabriquées séparément puis fixées; « faisaient corps avec lui » rend ce sens de manière claire sans préciser au-delà de l’hébreu le procédé exact de fabrication.
- source_word: וַיְצַף אֹתוֹ
  choice: puis il le recouvrit
  rationale: Dans les descriptions du sanctuaire, צפה désigne l’application d’un revêtement métallique. « Recouvrit » est idiomatique en français; « puis » marque naturellement la succession exprimée par le wayyiqtol.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: נְחֹשֶׁת peut désigner le cuivre ou le bronze. « Bronze » est le rendu conventionnel et contextuellement probable pour le mobilier du sanctuaire, tandis que l’autre possibilité est conservée en note.
