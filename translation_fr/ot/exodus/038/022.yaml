id: EXO.38.22
reference: Exodus 38:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בְצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֣ה יְהוּדָ֑ה עָשָׂ֕ה אֵ֛ת כָּל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/022.yaml
  text: And Bezalel son of Uri[a], son of Hur, of the tribe of Judah, made all that Yahweh had commanded Moses.
translation:
  language: fr
  text: Et Betsalel, fils d’Ouri, fils de Hour, de la tribu de Juda, réalisa tout ce que Yahweh[a] avait ordonné à Moïse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque du nom divin et son rendu traditionnel.
lexical_decisions:
- source_word: וּ/בְצַלְאֵל
  choice: Et Betsalel
  rationale: La conjonction וּ maintient le lien narratif avec ce qui précède. Le nom propre est translittéré selon un usage français clair et proche de l’hébreu.
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: fils d’Ouri, fils de Hour
  rationale: Dans cette formule généalogique, בֶּן désigne naturellement la filiation; «fils de» conserve la structure répétée de l’hébreu.
- source_word: לְ/מַטֵּה יְהוּדָה
  choice: de la tribu de Juda
  rationale: מַטֶּה signifie ici «tribu», et la préposition לְ marque l’appartenance.
- source_word: עָשָׂה
  choice: réalisa
  rationale: Le verbe עשה peut signifier «faire» ou «fabriquer». Dans le contexte de l’exécution des travaux du sanctuaire, «réalisa» exprime naturellement l’accomplissement concret de tout ce qui avait été prescrit sans restreindre le verbe à la seule fabrication.
- source_word: אֵת כָּל אֲשֶׁר
  choice: tout ce que
  rationale: Cette tournure française rend de manière idiomatique et complète la totalité exprimée par l’hébreu.
- source_word: צִוָּה
  choice: avait ordonné
  rationale: Le plus-que-parfait explicite naturellement en français que l’ordre donné à Moïse précédait sa réalisation par Betsalel, sans modifier le rapport temporel du texte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre plutôt que remplacé par un titre, afin de refléter directement le texte hébreu.
- source_word: אֶת מֹשֶׁה
  choice: à Moïse
  rationale: Après «ordonner», le français demande ici le complément indirect «à Moïse»; le marqueur אֵת n’a pas d’équivalent lexical autonome.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin YHWH. «Yahweh» le conserve comme nom propre, tandis qu’une note signale le rendu traditionnel sans imposer une substitution dans le texte.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe généalogique reste proche de l’hébreu, tandis que « réalisa » et le plus-que-parfait assurent une lecture fluide dans le contexte des travaux du sanctuaire.
