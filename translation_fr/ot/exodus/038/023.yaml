base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/023.yaml
  text: And with him was Oholiab son of Ahisamach[a], of the tribe of Dan, an engraver, a designer, and an embroiderer in blue, in purple, in scarlet yarn[b], and in fine linen.
translation:
  language: fr
  text: Avec lui se trouvait Oholiab, fils d’Ahisamac[a], de la tribu de Dan, artisan, créateur de motifs et brodeur du bleu, de la pourpre, de l’écarlate[b] et du fin lin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On trouve aussi la forme « Aholiab » pour ce nom hébreu.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque désigne une matière textile teinte en écarlate; on peut aussi traduire simplement par « l’écarlate ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתּוֹ
  choice: Avec lui travaillait
  rationale: La proposition hébraïque est sans verbe et rattache Oholiab à Betsaléel, mentionné au verset précédent. « Travaillait » explicite naturellement leur collaboration dans ce contexte artisanal sans ajouter l’idée d’une simple présence.
- source_word: אָהֳלִיאָב
  choice: Oholiab
  rationale: Translittération française courante du nom hébreu.
- source_word: בֶּן אֲחִיסָמָךְ
  choice: fils d’Ahisamak
  rationale: Rendu direct du patronyme; la finale hébraïque כ est transcrite par « k » selon un usage français lisible.
- source_word: לְמַטֵּה דָן
  choice: de la tribu de Dan
  rationale: Expression française naturelle indiquant l’appartenance tribale.
- source_word: חָרָשׁ
  choice: un artisan
  rationale: Le nom désigne largement un ouvrier qualifié. « Artisan » préserve cette largeur sémantique; « graveur » serait ici plus spécifique que ne l’impose l’hébreu.
- source_word: וְחֹשֵׁב
  choice: un créateur de motifs
  rationale: Dans le vocabulaire du sanctuaire, le terme évoque la conception experte de motifs ouvragés, particulièrement textiles. Cette formulation distingue cette fonction de celle du brodeur.
- source_word: וְרֹקֵם
  choice: un brodeur
  rationale: Équivalent français clair du spécialiste des ouvrages brodés ou de l’aiguille.
- source_word: בַּתְּכֵלֶת
  choice: le fil bleu
  rationale: Le terme désigne la matière textile teinte en bleu dans le contexte du sanctuaire. « Fil » rend explicite la nature textile en français.
- source_word: וּבָאַרְגָּמָן
  choice: la pourpre
  rationale: « Pourpre » est le terme français traditionnel et précis pour cette matière ou teinture prestigieuse; l’ellipse de « fil » évite une répétition pesante.
- source_word: וּבְתוֹלַעַת הַשָּׁנִי
  choice: le fil écarlate
  rationale: L’expression hébraïque désigne une matière textile teinte en écarlate. « Fil écarlate » en communique clairement le sens matériel.
- source_word: וּבַשֵּׁשׁ
  choice: le fin lin
  rationale: Dans le contexte du sanctuaire, שֵׁשׁ désigne du lin fin; « fin lin » est une expression française claire et consacrée.
theological_decisions: []
