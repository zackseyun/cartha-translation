base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/003.yaml
  text: 'He made all the utensils of the altar: the pots[a], the shovels, the basins, the forks, and the firepans[b]. He made all its utensils of bronze.'
translation:
  language: fr
  text: 'Il fit tous les ustensiles de l’autel : les récipients[a], les pelles, les bassins, les fourches et les brasiers. Il fit tous ses ustensiles en bronze[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut désigner plus précisément des récipients destinés à enlever les cendres.
    reason: lexical_alternative
  - marker: b
    text: Ou « cuivre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי הַמִּזְבֵּחַ
  choice: les ustensiles de l’autel
  rationale: כְּלִי désigne largement des objets, récipients ou instruments fonctionnels. « Ustensiles » convient naturellement à l’ensemble des accessoires énumérés.
- source_word: הַסִּירֹת
  choice: les récipients
  rationale: סִירוֹת désigne des pots ou récipients. Dans ce contexte, ils ont pu servir à recueillir ou enlever les cendres, mais le texte hébreu ne le précise pas.
- source_word: הַיָּעִים
  choice: les pelles
  rationale: יַע désigne un outil servant à pelleter ou à ramasser; « pelles » est clair et adapté au service de l’autel.
- source_word: הַמִּזְרָקֹת
  choice: les bassins
  rationale: מִזְרָקוֹת désigne des récipients employés dans le rituel, notamment pour manipuler des liquides; « bassins » conserve cette fonction cultuelle.
- source_word: הַמִּזְלָגֹת
  choice: les fourches
  rationale: Le terme désigne des instruments à dents. « Fourches » est naturel en français et évite d’ajouter la précision interprétative « à viande ».
- source_word: הַמַּחְתֹּת
  choice: les brasiers
  rationale: מַחְתָּה désigne un récipient ou instrument destiné aux braises. « Brasiers » est une désignation française établie dans ce contexte, sans imposer la fonction plus spécifique d’un encensoir.
- source_word: כָּל כֵּלָיו
  choice: tous ses ustensiles
  rationale: Le suffixe renvoie à l’autel; la répétition d’« ustensiles » reproduit la reprise présente dans l’hébreu.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: נְחֹשֶׁת peut désigner le cuivre ou le bronze. « Bronze » correspond à l’usage conventionnel et historiquement plausible pour le mobilier du sanctuaire, tandis que l’autre possibilité est signalée en note.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: Il fit… Il fit
  rationale: La répétition du verbe עשה est conservée afin de refléter la structure récapitulative du texte hébreu.
