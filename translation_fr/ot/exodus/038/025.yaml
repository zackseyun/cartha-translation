base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/025.yaml
  text: And the silver of those counted from the congregation was one hundred talents and one thousand seven hundred seventy-five shekels[b][a], according to the sanctuary shekel.
translation:
  language: fr
  text: L’argent provenant des membres de la communauté qui avaient été recensés s’élevait à cent talents et mille sept cent soixante-quinze sicles, selon le sicle du sanctuaire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire d’après l’étalon de poids employé au sanctuaire.
    reason: cultural_note
lexical_decisions:
- source_word: כֶסֶף
  choice: argent
  rationale: Dans ce relevé comptable, le terme désigne le métal recueilli, non l’argent au sens abstrait de monnaie.
- source_word: פְּקוּדֵי הָעֵדָה
  choice: les membres de la communauté qui avaient été recensés
  rationale: Le participe passif désigne les personnes enregistrées lors du recensement; cette formulation française est naturelle et explicite leur appartenance à la communauté.
- source_word: מְאַת כִּכָּר
  choice: cent talents
  rationale: « Talent » est l’équivalent traditionnel de cette grande unité ancienne de poids.
- source_word: וְאֶלֶף וּשְׁבַע מֵאוֹת וַחֲמִשָּׁה וְשִׁבְעִים שֶׁקֶל
  choice: et mille sept cent soixante-quinze sicles
  rationale: La suite additive hébraïque donne un total de 1 775 sicles, rendu selon l’usage numérique naturel en français.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: selon le sicle du sanctuaire
  rationale: La préposition indique ici la norme de poids employée; « sicle du sanctuaire » conserve l’expression technique traditionnelle.
