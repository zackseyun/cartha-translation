  text: He made the poles of acacia wood and overlaid them with bronze[a].
translation:
  language: fr
  text: Il fit les barres en bois d’acacia et les recouvrit de bronze[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « cuivre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol qal de עשה exprime l’action suivante du récit. En français, « Il fit » rend naturellement la séquence sans devoir conserver systématiquement la conjonction hébraïque.
- source_word: הַבַּדִּים
  choice: les barres
  rationale: Dans le contexte du mobilier du sanctuaire, בדים désigne les longues pièces servant au transport. « Barres » est le terme français biblique et artisanal naturel dans ce contexte.
- source_word: עֲצֵי שִׁטִּים
  choice: en bois d’acacia
  rationale: La construction hébraïque désigne le matériau. « Bois d’acacia » est une traduction claire et actuelle, contrairement à une translittération telle que « bois de sittim ».
- source_word: וַיְצַף
  choice: et les recouvrit
  rationale: Dans ce contexte artisanal, צפה signifie couvrir ou plaquer une surface de métal. « Recouvrir » est naturel en français et conserve le sens sans préciser une technique non explicitée.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom objet masculin pluriel renvoie aux barres.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: נחשת peut désigner le cuivre ou le bronze. « Bronze » est l’appellation conventionnelle et contextuellement probable pour les éléments du sanctuaire, tout en signalant « cuivre » en note comme possibilité réelle.
