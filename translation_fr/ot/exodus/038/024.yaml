base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/024.yaml
  text: All the gold that was used for the work[a], in all the work of the sanctuary—the gold of the wave offering—was twenty-nine talents and seven hundred thirty shekels[b], according to the sanctuary shekel.
translation:
  language: fr
  text: Tout l’or mis en œuvre pour les travaux, pour tous les travaux du sanctuaire — l’or de l’offrande de présentation[a] —, s’élevait à vingt-neuf talents et sept cent trente sicles[b], selon le sicle du sanctuaire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque désigne une offrande présentée rituellement devant le Seigneur; elle est aussi souvent rendue par « offrande agitée » et évoque un geste rituel de présentation.
    reason: cultural_note
  - marker: b
    text: Le talent et le sicle sont des unités de poids anciennes. Leur valeur exacte a varié selon les époques; le texte précise ici qu’il s’agit du sicle étalon du sanctuaire.
    reason: cultural_note
lexical_decisions:
- source_word: הֶעָשׂוּי לַמְּלָאכָה
  choice: employé … aux travaux
  rationale: Le participe passif de עשה décrit ici l’or affecté à la fabrication du sanctuaire. « Employé » exprime cet usage sans laisser entendre que l’or lui-même aurait été fabriqué.
- source_word: בְּכֹל מְלֶאכֶת הַקֹּדֶשׁ
  choice: à l’ensemble des travaux du sanctuaire
  rationale: Dans ce relevé des matériaux, מְלָאכָה désigne les travaux de construction et de fabrication, tandis que הַקֹּדֶשׁ renvoie au sanctuaire. Cette formulation restitue le sens global sans lourde répétition.
- source_word: זְהַב הַתְּנוּפָה
  choice: l’or de l’offrande de présentation
  rationale: תְּנוּפָה désigne une offrande rituellement présentée devant Dieu, vraisemblablement au moyen d’un mouvement. « Offrande de présentation » reste intelligible en français moderne, et la note conserve la dimension gestuelle du terme.
- source_word: תֵּשַׁע וְעֶשְׂרִים כִּכָּר וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים שֶׁקֶל
  choice: vingt-neuf talents et sept cent trente sicles
  rationale: Les unités anciennes et les nombres sont conservés fidèlement, dans l’ordre idiomatique du français moderne.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: selon le sicle du sanctuaire
  rationale: La préposition בְּ indique ici l’étalon de poids servant au calcul. « Selon » rend clairement cette fonction métrologique.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase hébraïque est légèrement resserrée pour éviter une répétition pesante de « travaux », tout en conservant l’idée que la totalité de l’or employé au sanctuaire est comptabilisée. Les unités de poids anciennes sont translittérées selon l’usage biblique français.
