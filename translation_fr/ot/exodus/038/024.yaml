revisions:
- from: Tout l’or employé à l’ensemble des travaux du sanctuaire — l’or de l’offrande de présentation[a] — s’élevait à vingt-neuf talents et sept cent trente sicles[b], selon le sicle du sanctuaire.
  to: Tout l’or mis en œuvre pour les travaux, pour tous les travaux du sanctuaire — l’or de l’offrande de présentation[a] —, s’élevait à vingt-neuf talents et sept cent trente sicles[b], selon le sicle du sanctuaire.
  rationale: La révision rétablit explicitement les deux expressions hébraïques relatives aux travaux, tout en gardant une syntaxe française lisible. Les unités et l’étalon du sanctuaire sont conservés. La note sur תְּנוּפָה garde l’information culturelle sans surinterpréter le geste rituel.
