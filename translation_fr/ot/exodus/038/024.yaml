    rationale: Le texte hébreu distingue l’or « mis en œuvre pour le travail » et « dans tout le travail du sanctuaire ». La rédaction proposée ne rend qu’une formulation synthétique.
  - severity: low
    issue: Note sur l’offrande de présentation trop affirmative quant au geste
    rationale: La note peut signaler l’association du terme à un geste rituel de présentation sans définir de façon trop précise un mouvement dont la forme n’est pas explicitée ici.
