translation:
  language: fr
  text: les socles[a] tout autour du parvis, les socles de la porte du parvis, tous les piquets[b] du tabernacle et tous les piquets tout autour du parvis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bases ».
    reason: lexical_alternative
  - marker: b
    text: Ou « pieux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְנֵי
  choice: socles
  rationale: Dans le contexte de la construction du tabernacle, le terme désigne les pièces de fondation métalliques dans lesquelles étaient fixés les montants. « Socles » est concret, naturel et précis en français.
- source_word: חָצֵר
  choice: parvis
  rationale: Le mot désigne ici l’espace extérieur clos entourant le sanctuaire. « Parvis » est le terme français établi dans ce contexte cultuel tout en restant compréhensible.
- source_word: סָבִיב
  choice: tout autour
  rationale: Cette expression conserve la valeur spatiale et distributive de l’hébreu, en indiquant le pourtour complet du parvis.
- source_word: שַׁעַר
  choice: porte
  rationale: Le terme désigne l’ouverture aménagée donnant accès au parvis. « Porte » rend directement le terme hébreu sans préciser davantage la forme de cette entrée.
- source_word: יִתְדֹת
  choice: piquets
  rationale: Il s’agit des pièces plantées dans le sol qui servaient à fixer le tabernacle et l’enceinte du parvis. « Piquets » est le terme français courant pour ce matériel mobile.
- source_word: מִּשְׁכָּן
  choice: tabernacle
  rationale: Dans l’Exode, ce terme est la désignation spécifique du sanctuaire portatif. « Tabernacle » maintient cette identité cultuelle et la continuité terminologique.
- source_word: כָּל
  choice: tous
  rationale: « Tous » exprime naturellement l’inclusion exhaustive des piquets mentionnés.
- source_word: וְאֵת / וְאֶת
  choice: et
  rationale: Le marqueur d’objet direct répété, accompagné de la conjonction, structure la suite de l’inventaire. En français, la coordination par « et » suffit sans rendre explicitement le marqueur grammatical.
