base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/020.yaml
  text: And all the pegs for the tabernacle and for the surrounding courtyard were bronze[a].
translation:
  language: fr
  text: Et tous les piquets du tabernacle et de la cour qui l’entourait étaient en bronze[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cuivre ». Le mot hébreu נְחֹשֶׁת peut désigner le cuivre ou le bronze selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: Tous
  rationale: Avec le nom pluriel, כָּל exprime naturellement la totalité. En français, l’absence de « et » en tête de verset donne une phrase autonome plus naturelle sans perdre le lien contextuel.
- source_word: הַיְתֵדֹת
  choice: les piquets
  rationale: יָתֵד désigne ici les piquets servant à fixer la structure. « Piquets » est précis et courant; « pieux » évoquerait des éléments plus massifs.
- source_word: לַמִּשְׁכָּן
  choice: du tabernacle
  rationale: מִשְׁכָּן est le terme habituel pour le sanctuaire mobile dans l’Exode. Après « piquets », le complément français « du tabernacle » exprime naturellement leur destination.
- source_word: וְלֶחָצֵר סָבִיב
  choice: et de la cour tout autour
  rationale: חָצֵר désigne l’enceinte extérieure, et סָבִיב précise qu’elle se trouvait autour du tabernacle. Cette formulation conserve la portée spatiale sans préciser un référent absent de l’hébreu.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Dans le contexte des matériaux du tabernacle, « bronze » est le rendu français conventionnel et plausible. Le mot hébreu peut aussi désigner le cuivre, possibilité conservée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formulation reste concise et suit la structure nominale du texte hébreu; « cour » est préféré à « parvis », plus traditionnel et moins immédiatement transparent.
