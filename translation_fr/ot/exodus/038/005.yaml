  yaml_path: translation/ot/exodus/038/005.yaml
  text: He cast four rings on the four corners of the bronze grating as holders for the poles[a][b].
translation:
  language: fr
  text: Il coula quatre anneaux aux quatre coins de la grille de bronze[a], afin de recevoir les barres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux quatre extrémités » de la grille de bronze.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « des maisons » pour les barres, c’est-à-dire des logements ou des pièces destinés à les recevoir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  choice: Il coula
  rationale: Dans le contexte du travail du métal, יצק désigne l’action de couler le métal pour fabriquer une pièce. « Il coula » est naturel et précis en français.
- source_word: אַרְבַּע טַבָּעֹת
  choice: quatre anneaux
  rationale: טַבָּעוֹת désigne ici des anneaux métalliques destinés au transport; « anneaux » en est l’équivalent direct.
- source_word: בְּאַרְבַּע הַקְּצָוֺת
  choice: aux quatre coins
  rationale: קָצֶה peut désigner une extrémité, un bord ou un coin. Pour une grille rectangulaire munie de quatre anneaux, « aux quatre coins » exprime naturellement leur emplacement, tout en signalant l’autre possibilité en note.
- source_word: לְמִכְבַּר הַנְּחֹשֶׁת
  choice: de la grille de bronze
  rationale: מִכְבָּר désigne un ouvrage ajouré, ici la grille de l’autel. נְחֹשֶׁת est rendu par « bronze », terme moderne approprié dans ce contexte.
- source_word: בָּתִּים
  choice: supports
  rationale: Le mot signifie littéralement « maisons », mais désigne fonctionnellement les logements ou pièces qui reçoivent les barres. « Supports » reste clair sans imposer une forme technique trop précise.
- source_word: לַבַּדִּים
  choice: aux barres
  rationale: בַּדִּים désigne les barres servant à transporter le mobilier du sanctuaire. « Barres » est courant, clair et conforme au contexte.
