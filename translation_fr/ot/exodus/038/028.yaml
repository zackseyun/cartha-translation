  text: And with the one thousand seven hundred and seventy-five he made hooks for the pillars[a], overlaid their tops, and made bands for them.
translation:
  language: fr
  text: Avec les mille sept cent soixante-quinze, il fit les crochets pour les colonnes, en revêtit les sommets et les garnit de bandes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les relia par des bandes ». Le verbe hébreu peut désigner le fait de munir les colonnes de bandes ou d’éléments de liaison.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הָאֶלֶף וּשְׁבַע הַמֵּאוֹת וַחֲמִשָּׁה וְשִׁבְעִים
  choice: Avec les mille sept cent soixante-quinze sicles restants
  rationale: La somme poursuit le décompte de l’argent du verset précédent. « Avec » exprime naturellement l’emploi de cette quantité; « sicles » et « restants » sont fournis par le contexte immédiat, sans répéter « d’argent » dès l’ouverture.
- source_word: עָשָׂה
  choice: il fit
  rationale: Rendu simple et digne du verbe courant עשה dans un contexte de fabrication.
- source_word: וָוִים
  choice: les crochets
  rationale: Dans les descriptions du sanctuaire, le terme désigne les crochets métalliques fixés aux colonnes.
- source_word: לָעַמּוּדִים
  choice: pour les colonnes
  rationale: « Colonnes » est le terme architectural français naturel pour les supports de l’enceinte du sanctuaire.
- source_word: וְצִפָּה רָאשֵׁיהֶם
  choice: en plaqua d’argent le sommet
  rationale: Le piel de צפה indique un revêtement métallique. L’argent est explicitement établi par le décompte contextuel; « sommet » rend l’hébreu littéral « tête » sans imposer le terme technique « chapiteau ».
- source_word: וְחִשַּׁק אֹתָם
  choice: et les garnit de tringles
  rationale: Le verbe חִשַּׁק désigne ici l’équipement des colonnes avec des éléments horizontaux de liaison. « Tringles » est compréhensible en français moderne et convient mieux que l’archaïque « baguettes » ou le trop vague « bandes ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et adapté au style d’inventaire du passage. La formulation explicite les unités et le métal à partir du verset précédent afin d’éviter une quantité sans référent, tout en conservant dans la note l’incertitude sur la fonction exacte des tringles.
