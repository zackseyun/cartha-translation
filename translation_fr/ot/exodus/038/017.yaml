base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/017.yaml
  text: The bases for the pillars were bronze[a], and the hooks of the pillars and their bands were silver, and the overlay of their tops was silver[b]; all the pillars of the courtyard were banded with silver.
translation:
  language: fr
  text: Les socles des piliers étaient en bronze[a]. Les crochets des piliers et leurs bandes étaient en argent, et le revêtement de leurs sommets était en argent[b]. Tous les piliers de la cour étaient entourés de bandes d’argent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bases ».
    reason: lexical_alternative
  - marker: b
    text: La nature exacte des éléments rendus ici par « bandes » est incertaine ; il s’agit de pièces en argent associées aux piliers.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדָנִים
  choice: socles
  rationale: Dans le contexte de la construction du sanctuaire, le terme désigne les supports inférieurs dans lesquels reposent les piliers. « Socles » est précis et naturel en français moderne.
- source_word: עַמֻּדִים
  choice: piliers
  rationale: Le mot désigne les supports verticaux de la clôture de la cour; « piliers » convient au registre architectural et biblique.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: « Bronze » est la désignation conventionnelle et vraisemblable du métal dans les descriptions du sanctuaire, même si l'hébreu peut aussi désigner le cuivre.
- source_word: וָוֵי
  choice: crochets
  rationale: Le terme désigne ici les crochets fixés aux piliers et servant à la structure de la clôture.
- source_word: חֲשׁוּקֵיהֶם
  choice: leurs tringles
  rationale: La pièce architecturale exacte reste incertaine. Dans le contexte de la cour, « tringles » désigne naturellement les éléments d'argent associés aux piliers, sans recourir à l'archaïque « baguettes » ou au trop vague « bandes ».
- source_word: צִפּוּי
  choice: revêtement
  rationale: Le nom désigne une couche couvrante, ici faite d'argent; « revêtement » est clair et idiomatique.
- source_word: רָאשֵׁיהֶם
  choice: leurs sommets
  rationale: Littéralement « leurs têtes »; il s'agit de la partie supérieure des piliers. « Sommets » évite de préciser abusivement qu'il s'agirait de chapiteaux.
- source_word: מְחֻשָּׁקִים
  choice: munis de tringles
  rationale: Le participe est apparenté à חֲשׁוּקֵיהֶם. Cette formulation conserve ce lien lexical et décrit l'équipement des piliers sans prétendre déterminer avec certitude la forme exacte des pièces.
- source_word: חָצֵר
  choice: cour
  rationale: Dans le contexte du sanctuaire, le terme désigne l'espace extérieur clos; « cour » est le terme français usuel et concis.
