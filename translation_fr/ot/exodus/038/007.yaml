base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/007.yaml
  text: He put the poles into the rings on the sides of the altar[a], to carry it with them. He made it hollow[b], with boards.
translation:
  language: fr
  text: Il introduisit les barres dans les anneaux placés sur les côtés de l’autel[a], afin de le porter au moyen de ces barres. Il le fit creux, avec des planches[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il apporta les barres dans les anneaux situés sur les côtés de l’autel. » Le verbe hébreu signifie plus littéralement « faire venir » ou « apporter », mais il désigne ici vraisemblablement la mise en place des barres.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « creux, planches ». Cette expression elliptique signifie probablement que l’autel était une structure creuse faite de planches.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Il introduisit
  rationale: Le hiphil de בוא décrit ici la mise en place des barres dans les anneaux. « Introduisit » conserve l’idée de mouvement vers l’intérieur tout en étant naturel en français.
- source_word: הַבַּדִּים
  choice: les barres
  rationale: Dans le contexte du sanctuaire, בַּדִּים désigne les longues barres servant au transport du mobilier sacré. « Barres » est clair et courant.
- source_word: בַּטַּבָּעֹת
  choice: dans les anneaux
  rationale: La préposition ב indique ici l’insertion ou la position à l’intérieur des anneaux; après « introduisit », « dans » est idiomatique.
- source_word: עַל צַלְעֹת הַמִּזְבֵּחַ
  choice: placés sur les côtés de l’autel
  rationale: צְלָעוֹת désigne les côtés ou faces latérales. L’ajout explicatif « placés » rattache naturellement la localisation aux anneaux sans modifier le sens matériel.
- source_word: לָשֵׂאת אֹתוֹ בָּהֶם
  choice: afin de le porter au moyen de ces barres
  rationale: L’infinitif exprime le but. Le référent pronominal de בָּהֶם est explicité en français pour éviter l’ambiguïté de « avec elles ».
- source_word: נְבוּב
  choice: creux
  rationale: נְבוּב qualifie l’autel comme une structure vide à l’intérieur.
- source_word: לֻחֹת
  choice: avec des planches
  rationale: La construction hébraïque « creux, planches » est elliptique. « Avec des planches » rend prudemment le matériau ou le mode de construction sans préciser davantage la relation syntaxique.
- source_word: עָשָׂה אֹתוֹ
  choice: Il le fit
  rationale: Rend directement עשה avec son complément pronominal tout en conservant la structure de la proposition hébraïque.
