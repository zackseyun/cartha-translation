  text: And for the west side there were hangings of fifty cubits[a], with ten of their pillars and ten of their bases; the hooks of the pillars and their bands were silver.
translation:
  language: fr
  text: Du côté ouest, les tentures mesuraient cinquante coudées, avec dix piliers et dix socles. Les crochets et les tringles[a] des piliers étaient en argent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne des pièces techniques fixées aux piliers ; il peut s’agir de tringles, de bandeaux ou de pièces de liaison décoratives.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְאַת יָם
  choice: Du côté ouest
  rationale: יָם signifie littéralement « mer », mais désigne idiomatiquement l’ouest dans les descriptions du sanctuaire. Cette formulation rend clairement l’orientation en français naturel.
- source_word: קְלָעִים
  choice: les tentures
  rationale: Dans le contexte de la cour du sanctuaire, le terme désigne les pièces d’étoffe qui formaient l’enceinte. « Tentures » est précis, courant et suffisamment concret.
- source_word: חֲמִשִּׁים בָּאַמָּה
  choice: mesuraient cinquante coudées
  rationale: Le texte donne directement la mesure. Le verbe « mesuraient », implicite en hébreu, produit une phrase française claire sans préciser indûment s’il s’agit de la longueur ou de la largeur.
- source_word: עַמּוּדֵיהֶם עֲשָׂרָה
  choice: avec dix piliers
  rationale: עַמּוּד désigne ici les éléments verticaux de la clôture. « Piliers » convient au vocabulaire architectural du sanctuaire, et « avec » rend naturellement la construction nominale de l’hébreu.
- source_word: וְאַדְנֵיהֶם עֲשָׂרָה
  choice: et dix socles
  rationale: אֶדֶן désigne les supports dans lesquels reposaient les piliers. « Socles » est ici plus précis que « bases » tout en restant accessible.
- source_word: וָוֵי הָעַמֻּדִים
  choice: Les crochets des piliers
  rationale: וָוִים désigne dans ces passages les crochets fixés aux piliers; « crochets » est le terme français le plus direct et le mieux établi.
- source_word: וַחֲשׁוּקֵיהֶם
  choice: et leurs tringles
  rationale: Le référent architectural exact de חֲשׁוּקִים demeure incertain. « Tringles » convient à des pièces métalliques associées aux piliers sans imposer une forme trop précise; une note conserve l’ambiguïté lexicale.
- source_word: כָּסֶף
  choice: étaient en argent
  rationale: Le nom de matière a ici une fonction prédicative. « Étaient en argent » est la tournure française naturelle.
