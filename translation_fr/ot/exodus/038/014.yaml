lexical_decisions:
- source_word: קְלָעִים
  choice: tentures
  rationale: Dans la description de la cour du sanctuaire, le terme désigne les pièces d’étoffe qui formaient l’enceinte. « Tentures » est naturel en français et convient mieux ici que « rideaux », qui pourrait évoquer un usage intérieur.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: mesuraient quinze coudées
  rationale: L’hébreu juxtapose le nom et la mesure sans verbe exprimé. Le verbe « mesuraient » rend cette relation clairement et naturellement en français, sans préciser une dimension que le texte ne nomme pas.
- source_word: אֶל הַכָּתֵף
  choice: d’un côté
  rationale: כָּתֵף signifie littéralement « épaule » et, dans ce contexte architectural, désigne l’un des côtés ou flancs de l’entrée. « D’un côté » restitue ce sens spatial de manière idiomatique.
- source_word: עַמּוּדֵיהֶם
  choice: elles avaient trois poteaux
  rationale: Le suffixe pluriel renvoie aux tentures ou à la section qui vient d’être décrite. « Poteaux » convient à des supports dressés dans la cour et est plus précis ici que « colonnes ».
- source_word: אַדְנֵיהֶם
  choice: trois socles
  rationale: Le mot désigne les pièces de base dans lesquelles les poteaux étaient fixés. « Socles » est clair, architectural et suffisamment précis en français moderne.
