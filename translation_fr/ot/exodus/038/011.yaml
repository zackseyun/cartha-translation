source:
  edition: WLC
  text: וְ/לִ/פְאַ֤ת צָפוֹן֙ מֵאָ֣ה בָֽ/אַמָּ֔ה עַמּוּדֵי/הֶ֣ם עֶשְׂרִ֔ים וְ/אַדְנֵי/הֶ֥ם עֶשְׂרִ֖ים נְחֹ֑שֶׁת וָוֵ֧י הָֽ/עַמּוּדִ֛ים וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/011.yaml
  text: And for the north side there were a hundred cubits[a], their twenty pillars and their twenty bases of bronze, and the hooks of the pillars and their bands were of silver.
translation:
  language: fr
  text: Du côté nord, la longueur était de cent coudées. Il y avait vingt poteaux et vingt socles en bronze ; les crochets des poteaux et leurs tringles[a] étaient en argent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : leurs bandeaux. Le terme hébreu désigne des pièces en argent fixées aux poteaux, mais leur forme exacte est incertaine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹן
  choice: Du côté nord
  rationale: פֵּאָה désigne ici un côté ou un bord ; cette formulation est naturelle en français et conserve l’orientation donnée par צָפוֹן.
- source_word: מֵאָה בָאַמָּה
  choice: la longueur était de cent coudées
  rationale: L’hébreu énonce de façon elliptique la mesure du côté. L’ajout de « la longueur était de » explicite naturellement la relation sans ajouter de mesure absente du texte.
- source_word: עַמּוּדֵיהֶם
  choice: vingt poteaux
  rationale: Dans la description de la cour, עַמּוּדִים désigne les supports verticaux. « Poteaux » convient mieux que « colonnes » à cette structure et reste accessible.
- source_word: אַדְנֵיהֶם
  choice: vingt socles
  rationale: אֶדֶן désigne les pièces servant d’assise aux poteaux. « Socles » est précis et usuel en français moderne.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: « Bronze » est le terme traditionnel et contextuellement approprié pour ce métal dans les descriptions du sanctuaire, même si נְחֹשֶׁת peut parfois couvrir le cuivre et ses alliages.
- source_word: וָוֵי הָעַמּוּדִים
  choice: les crochets des poteaux
  rationale: וָוִים désigne ici les crochets fixés aux poteaux, et non des piquets de tente.
- source_word: חֲשֻׁקֵיהֶם
  choice: leurs tringles
  rationale: Le mot désigne des éléments architecturaux en argent associés aux poteaux. « Tringles » est une désignation claire et courante, tout en signalant en note l’incertitude sur leur forme exacte.
- source_word: כָּסֶף
  choice: argent
  rationale: Terme français standard pour le matériau mentionné, appliqué ici aux crochets et aux tringles.
