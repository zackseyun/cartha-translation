  text: וַ/יַּ֣עַשׂ בָּ֗/הּ אֶת אַדְנֵי֙ פֶּ֚תַח אֹ֣הֶל מוֹעֵ֔ד וְ/אֵת֙ מִזְבַּ֣ח הַ/נְּחֹ֔שֶׁת וְ/אֶת מִכְבַּ֥ר הַ/נְּחֹ֖שֶׁת אֲשֶׁר ל֑/וֹ וְ/אֵ֖ת כָּל כְּלֵ֥י הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/030.yaml
  text: With it he made the bases for the entrance of the tent of meeting[a], the bronze altar, the bronze grating for it[b], and all the utensils of the altar.
translation:
  language: fr
  text: Avec ce bronze, il fit les bases de l’entrée de la tente de la Rencontre[a], l’autel de bronze, la grille de bronze qui lui était rattachée[b], ainsi que tous les ustensiles de l’autel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les socles de l’entrée de la tente de la Rencontre ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le treillis de bronze qui lui était rattaché » ou « la grille de bronze qui lui appartenait »; l’expression indique son association avec l’autel sans en préciser exactement la disposition.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּהּ
  choice: Avec ce bronze
  rationale: Le pronom féminin renvoie au bronze mentionné au verset précédent. La reprise explicite évite en français un pronom ambigu tout en conservant le sens instrumental.
- source_word: וַיַּעַשׂ
  choice: il fit
  rationale: Rendu narratif simple et digne du verbe courant עשה.
- source_word: אַדְנֵי
  choice: les bases
  rationale: Dans le contexte du sanctuaire, le terme désigne les supports métalliques dans lesquels s’insèrent les éléments verticaux. « Bases » est clair; « socles » reste possible.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: l’entrée de la tente de la rencontre
  rationale: Rend directement la chaîne construite hébraïque. « Tente de la rencontre » exprime מוֹעֵד sans transformer le terme en simple réunion humaine.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: l’autel de bronze
  rationale: Formulation française conventionnelle et naturelle pour l’autel fabriqué en bronze.
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: la grille de bronze
  rationale: מִכְבָּר désigne ici un ouvrage ajouré associé à l’autel; « grille » est concret et accessible.
- source_word: אֲשֶׁר לוֹ
  choice: qui lui était destinée
  rationale: Conserve l’association de la grille avec l’autel sans préciser indûment sa position exacte.
- source_word: כָּל כְּלֵי הַמִּזְבֵּחַ
  choice: tous les ustensiles de l’autel
  rationale: « Ustensiles » rend naturellement le terme général כְּלִים dans le contexte du matériel cultuel.
