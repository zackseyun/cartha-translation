  yaml_path: translation/ot/exodus/038/013.yaml
  text: And for the east side[a], eastward, fifty cubits.
translation:
  language: fr
  text: 'Et pour le côté est[a], vers le levant : cinquante coudées.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « pour le côté vers l’est, vers le lever du soleil ».'
    reason: La note rend visible le parallélisme directionnel concret de l’hébreu, que « côté est, vers le levant » formule plus naturellement en français.
lexical_decisions:
- source_word: וְ/לִ/פְאַת
  choice: Et pour le côté
  rationale: פֵּאָה désigne ici un côté ou une bordure. « Côté » convient naturellement à la description des dimensions de la cour, tandis que « et pour » conserve la coordination et le style descriptif du passage.
- source_word: קֵדְמָה
  choice: est
  rationale: Le terme peut désigner l’avant ou l’est. Associé à מִזְרָחָה, il indique clairement le côté oriental.
- source_word: מִזְרָחָה
  choice: vers le levant
  rationale: Le mot renvoie au lieu où le soleil se lève, donc à l’est. « Vers le levant » préserve l’expression directionnelle redoublée de l’hébreu sans réduire les deux termes à un seul.
- source_word: חֲמִשִּׁים
  choice: cinquante
  rationale: Traduction directe du nombre cardinal.
- source_word: אַמָּה
  choice: coudées
  rationale: La coudée est l’unité de longueur indiquée par le texte; le pluriel est requis après « cinquante ».
