  text: וַ/יַּ֗עַשׂ אֵ֚ת הַ/כִּיּ֣וֹר נְחֹ֔שֶׁת וְ/אֵ֖ת כַּנּ֣/וֹ נְחֹ֑שֶׁת בְּ/מַרְאֹת֙ הַ/צֹּ֣בְאֹ֔ת אֲשֶׁ֣ר צָֽבְא֔וּ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/008.yaml
  text: He made the basin of bronze and its stand of bronze from the mirrors of the women who served at the entrance to the tent of meeting[a][b].
translation:
  language: fr
  text: Il fit la cuve en bronze et son socle en bronze à partir des miroirs des femmes qui servaient à l’entrée de la tente de la rencontre[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des femmes qui se rassemblaient à l’entrée de la tente de la rencontre ». L’hébreu peut évoquer aussi bien un rassemblement organisé qu’un service.'
    reason: alternative_reading
  - marker: b
    text: Les miroirs anciens étaient généralement faits de métal poli, souvent de bronze, et non de verre.
    reason: cultural_note
lexical_decisions:
- source_word: כִּיּוֹר
  choice: cuve
  rationale: Désigne le grand récipient destiné aux ablutions dans le sanctuaire. « Cuve » est clair, concret et courant en français biblique moderne.
- source_word: כַּן
  choice: socle
  rationale: Désigne le support sur lequel reposait la cuve. « Socle » exprime naturellement cette fonction matérielle.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Dans le contexte du sanctuaire, « bronze » est la traduction conventionnelle et vraisemblable, même si le terme hébreu peut couvrir plus largement le cuivre et ses alliages.
- source_word: בְּמַרְאֹת
  choice: avec les miroirs
  rationale: La préposition indique ici vraisemblablement la matière employée. « Avec les miroirs » reste naturel en français et laisse entendre qu’ils ont servi à fabriquer la cuve et son socle.
- source_word: הַצֹּבְאֹת אֲשֶׁר צָבְאוּ
  choice: des femmes qui servaient
  rationale: La répétition de la racine צבא peut évoquer un rassemblement organisé ou un service. « Servaient » rend l’activité intentionnelle dans ce contexte sans leur attribuer une fonction sacerdotale précise.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à l’entrée de la tente de la rencontre
  rationale: Rend directement l’expression spatiale et le nom traditionnel de la tente, dans une formulation française claire.
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le passé simple convient au registre narratif biblique français et conserve la dignité du récit sans reproduire mécaniquement la conjonction hébraïque.
theological_decisions:
- issue: Identité et rôle des הַצֹּבְאֹת אֲשֶׁר צָבְאוּ
  choice: les femmes qui servaient à l’entrée de la tente de la rencontre
  alternative: les femmes qui se rassemblaient à l’entrée de la tente de la rencontre
  rationale: La racine צבא peut exprimer le fait de se rassembler en groupe organisé ou d’accomplir un service. Le texte ne précise ni office sacerdotal ni fonction liturgique; « servaient » rend leur présence active sans aller au-delà de ce qui est affirmé, tandis que la note conserve l’autre lecture possible.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient à la narration écrite. « Tente de la rencontre » est transparent et proche de l’hébreu; les notes préservent l’ambiguïté lexicale et apportent le contexte matériel sans alourdir le verset.
