source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ לַ/מִּזְבֵּ֨חַ֙ מִכְבָּ֔ר מַעֲשֵׂ֖ה רֶ֣שֶׁת נְחֹ֑שֶׁת תַּ֧חַת כַּרְכֻּבּ֛/וֹ מִ/לְּ/מַ֖טָּה עַד חֶצְיֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/004.yaml
  text: He made for the altar a grating[a], a network of bronze, under its ledge, beneath[c][b], up to its halfway point.
translation:
  language: fr
  text: Il fit pour l’autel une grille[a] en treillis de bronze, sous son rebord[b], depuis le bas jusqu’à mi-hauteur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une grille, ouvrage en forme de filet, en bronze ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désignant cet élément de l’autel peut aussi être traduit par « bordure », « moulure » ou « pourtour ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « depuis le bas jusqu’à sa moitié ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol fait avancer le récit. Le passé simple convient au registre narratif biblique en français moderne et rend inutile l’ajout systématique de « et ».
- source_word: לַמִּזְבֵּחַ
  choice: pour l’autel
  rationale: La préposition ל indique ici la destination de l’objet fabriqué, plutôt que son emplacement.
- source_word: מִכְבָּר
  choice: une grille
  rationale: Le terme désigne une structure ajourée ou grillagée. « Grille » est clair, concret et naturel en français.
- source_word: מַעֲשֵׂה רֶשֶׁת
  choice: en treillis
  rationale: L’expression signifie littéralement « ouvrage de filet/réseau ». « En treillis » exprime naturellement le mode de fabrication sans effacer l’idée d’une structure maillée.
- source_word: נְחֹשֶׁת
  choice: de bronze
  rationale: Dans le contexte du sanctuaire, « bronze » est le rendu traditionnel et vraisemblable de ce métal, même si « cuivre » reste lexicalement possible.
- source_word: תַּחַת
  choice: sous
  rationale: Ce choix rend directement la relation spatiale exprimée par la préposition.
- source_word: כַּרְכֻּבּוֹ
  choice: son rebord
  rationale: Le mot désigne un élément saillant entourant l’autel. « Rebord » est accessible et conserve la nature exacte de cet élément sans la préciser excessivement.
- source_word: מִלְּמַטָּה
  choice: depuis le bas
  rationale: Le composé adverbial signifie littéralement « d’en bas/depuis le bas » et marque ici le point de départ de l’étendue de la grille.
- source_word: עַד חֶצְיוֹ
  choice: jusqu’à mi-hauteur
  rationale: Cette formulation idiomatique exprime l’extension jusqu’au milieu vertical de l’autel, tout en gardant la référence du pronom implicite compréhensible dans le contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste proche de la structure hébraïque tout en évitant une répétition spatiale maladroite. Les notes conservent les principales possibilités lexicales et la formulation plus littérale de l’indication de hauteur.
