base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/026.yaml
  text: 'a beka per head[a], that is, half a shekel by the sanctuary shekel, for everyone who passed over to those counted[c][b], from twenty years old and upward: 603,550.'
translation:
  language: fr
  text: 'un béqa par personne[a], soit un demi-sicle au poids du sicle du sanctuaire, pour tous ceux qui passaient parmi les recensés[b], à partir de vingt ans et plus : 603 550.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Un béqa équivalait à un demi-sicle selon l’étalon du sanctuaire. Littéralement : « par crâne », c’est-à-dire par personne.'
    reason: cultural_note
  - marker: b
    text: Ou « qui passaient pour être recensés ». L’hébreu emploie le vocabulaire du recensement tout en conservant l’image d’un passage.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּקַע
  choice: béqa
  rationale: Ce terme technique désigne une unité de poids valant un demi-sicle. La translittération conserve la réalité culturelle ancienne, tandis que l’explication qui suit en précise immédiatement la valeur.
- source_word: לַגֻּלְגֹּלֶת
  choice: par personne
  rationale: Littéralement « par crâne » ou « par tête » ; dans ce contexte de recensement, l’expression désigne chaque individu compté. « Par personne » transmet naturellement cet idiome en français moderne.
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: un demi-sicle
  rationale: Rend directement la valeur du béqa indiquée par le texte.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: selon le sicle du sanctuaire
  rationale: La préposition indique ici l’étalon de poids employé. Cette formulation conserve la référence cultuelle et reste claire en français.
- source_word: לְכֹל הָעֹבֵר עַל הַפְּקֻדִים
  choice: pour chacun de ceux qui passèrent parmi les recensés
  rationale: La formulation conserve l’image concrète de personnes passant dans le cadre du dénombrement, sans la réduire à la simple idée abstraite d’inscription.
- source_word: הַפְּקֻדִים
  choice: les recensés
  rationale: Le terme désigne ici les personnes dénombrées lors du recensement.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: depuis l’âge de vingt ans et au-dessus
  rationale: Cette formule rend fidèlement le seuil d’âge du recensement tout en restant intelligible en français courant.
- source_word: לְשֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: 603 550
  rationale: Le nombre hébreu est rendu en chiffres avec l’espacement typographique français pour faciliter la lecture.
