  text: All the hangings of the courtyard all around were of finely twisted linen[a].
translation:
  language: fr
  text: Toutes les tentures qui entouraient la cour étaient en fin lin retors[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Toutes les tentures de la cour, sur tout son pourtour, étaient en lin finement torsadé. »'
    reason: Alternative lexicale et syntaxique explicitant סָבִיב et rendant מָשְׁזָר dans un vocabulaire moins technique.
lexical_decisions:
- source_word: כָּל
  choice: Toutes
  rationale: Le quantificateur porte collectivement sur l’ensemble des tentures; « toutes » exprime naturellement cette totalité en français.
- source_word: קַלְעֵי
  choice: les tentures
  rationale: Le terme désigne les pièces de tissu formant l’enceinte de la cour. « Tentures » convient au contexte architectural cultuel sans suggérer de simples rideaux intérieurs.
- source_word: הֶחָצֵר
  choice: de la cour
  rationale: Dans le contexte du tabernacle, חָצֵר désigne l’espace extérieur clos. « Cour » est le terme français naturel et traditionnel dans ce contexte.
- source_word: סָבִיב
  choice: qui entouraient
  rationale: Cette formulation française restitue idiomatiquement l’idée d’une disposition sur tout le pourtour, sans la répétition peu naturelle de « toutes… tout autour ».
- source_word: שֵׁשׁ
  choice: fin lin
  rationale: Dans les descriptions du tabernacle, שֵׁשׁ désigne un lin de qualité; « fin lin » est clair, digne et conforme à l’usage français.
- source_word: מָשְׁזָר
  choice: retors
  rationale: Le mot décrit des fils tordus ou assemblés par torsion. « Retors » est le terme textile précis et concis en français.
