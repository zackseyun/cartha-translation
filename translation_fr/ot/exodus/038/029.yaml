  text: וּ/נְחֹ֥שֶׁת הַ/תְּנוּפָ֖ה שִׁבְעִ֣ים כִּכָּ֑ר וְ/אַלְפַּ֥יִם וְ/אַרְבַּע מֵא֖וֹת שָֽׁקֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/029.yaml
  text: And the bronze of the wave offering was seventy talents and 2,400 shekels[a][b].
translation:
  language: fr
  text: Le bronze[a] de l’offrande présentée[b] pesait soixante-dix talents et 2 400 sicles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cuivre » ; le mot hébreu נְחֹשֶׁת peut désigner le cuivre ou le bronze selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque désigne une offrande présentée devant le Seigneur, habituellement par un geste rituel de balancement. On peut aussi traduire « offrande balancée » ou, plus généralement, « contribution présentée ».
    reason: cultural_note
lexical_decisions:
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Le terme peut désigner le cuivre ou le bronze. Dans l’inventaire des matériaux travaillés du sanctuaire, « bronze » est le terme français conventionnel et vraisemblable, tout en signalant l’autre possibilité en note.
- source_word: הַתְּנוּפָה
  choice: l’offrande présentée
  rationale: תְּנוּפָה désigne techniquement une offrande présentée devant le Seigneur, souvent au moyen d’un geste rituel de balancement. La formulation choisie reste naturelle en français sans imposer que le métal lui-même ait été physiquement balancé.
- source_word: שִׁבְעִים כִּכָּר
  choice: soixante-dix talents
  rationale: כִּכָּר est une ancienne unité de poids importante. Le maintien de « talent » préserve l’unité historique plutôt que de proposer une conversion moderne incertaine dans le texte.
- source_word: וְאַלְפַּיִם וְאַרְבַּע מֵאוֹת שָׁקֶל
  choice: et 2 400 sicles
  rationale: שֶׁקֶל est ici une unité de poids. « Sicle » est son équivalent traditionnel et précis en français biblique, tandis que les chiffres facilitent la lecture.
- source_word: וּ־
  choice: Le
  rationale: Le waw relie le verset à l’inventaire précédent. En français, la continuité est suffisamment exprimée par la structure de la phrase; commencer par « Et » serait possible, mais moins naturel ici.
theological_decisions:
- issue: Sens rituel de תְּנוּפָה
  choice: offrande présentée
  alternative: offrande balancée
  rationale: « Présentée » rend la fonction cultuelle sans affirmer de façon trop précise que toute la masse de métal a fait l’objet d’un balancement physique; une note conserve le sens rituel du terme hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase explicite « pesait », sous-entendu naturellement par l’énumération hébraïque, afin de rendre clairement le total pondéral. Les anciennes unités sont conservées.
