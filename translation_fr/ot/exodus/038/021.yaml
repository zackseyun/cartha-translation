source:
  edition: WLC
  text: אֵ֣לֶּה פְקוּדֵ֤י הַ/מִּשְׁכָּן֙ מִשְׁכַּ֣ן הָ/עֵדֻ֔ת אֲשֶׁ֥ר פֻּקַּ֖ד עַל פִּ֣י מֹשֶׁ֑ה עֲבֹדַת֙ הַ/לְוִיִּ֔ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/021.yaml
  text: These are the records of the tabernacle[a], the tabernacle of the testimony, as they were recorded at the command of Moses[c][b], by the service of the Levites under the direction of Ithamar son of Aaron the priest.
translation:
  language: fr
  text: Voici les comptes du tabernacle[a], le tabernacle du Témoignage[b], établis sur l’ordre de Moïse par le service des lévites, sous la direction d’Itamar[c], fils d’Aaron, le prêtre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’inventaire » ou « le relevé » du tabernacle ; le terme hébreu désigne un décompte officiel.
    reason: lexical_alternative
  - marker: b
    text: Le « Témoignage » renvoie probablement au témoignage de l’alliance, en particulier aux tablettes déposées dans l’arche.
    reason: cultural_note
  - marker: c
    text: Littéralement « par la main d’Itamar », expression qui peut indiquer l’action ou la supervision.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: les comptes
  rationale: Le nom désigne ici un décompte ou relevé administratif officiel des matériaux du tabernacle. « Les comptes » convient au contexte tout en laissant ouverte la nuance d’inventaire.
- source_word: הַמִּשְׁכָּן
  choice: le tabernacle
  rationale: Terme français consacré et précis pour la demeure-sanctuaire portative décrite dans l’Exode.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: le tabernacle du Témoignage
  rationale: La répétition en apposition est conservée. « Témoignage » rend עֵדֻת sans préciser indûment dans le texte principal s’il s’agit des tables ou, plus largement, du témoignage de l’alliance.
- source_word: פֻּקַּד
  choice: établis
  rationale: Dans ce contexte comptable, le passif de פקד renvoie à l’établissement officiel des comptes. L’accord pluriel français reprend naturellement « les comptes », malgré la forme verbale hébraïque au singulier.
- source_word: עַל פִּי מֹשֶׁה
  choice: sur l’ordre de Moïse
  rationale: L’expression idiomatique signifie « selon la parole/l’ordre de ». Cette formulation française exprime clairement l’autorité de Moïse.
- source_word: עֲבֹדַת הַלְוִיִּם
  choice: dans le cadre du service des lévites
  rationale: עֲבֹדָה désigne ici la tâche assignée aux lévites. La formulation conserve la notion de service cultuel et administratif sans introduire un vocabulaire ecclésiastique ultérieur.
- source_word: בְּיַד אִיתָמָר
  choice: sous la direction d’Itamar
  rationale: Littéralement « par la main d’Itamar » ; l’idiome indique ici son agence ou sa supervision.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Traduction directe du titre d’Aaron, conservé en apposition.
theological_decisions:
- issue: Sens de « Témoignage »
  choice: Maintien du terme « Témoignage » dans le texte principal
  alternative: « document de l’alliance » ou « tables du témoignage »
  rationale: Le contexte renvoie vraisemblablement au témoignage de l’alliance, notamment aux tables placées dans l’arche, mais le verset ne l’explicite pas. La traduction préserve donc l’ambiguïté du terme hébreu.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire cultuel traditionnel (« tabernacle », « lévites », « prêtre ») est conservé, tandis que la syntaxe administrative est rendue de façon naturelle. Les trois appels de note figurent dans le texte principal.
