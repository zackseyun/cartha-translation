  rationale: La révision remplace une expression contextuelle par « par le service des lévites », qui restitue mieux la fonction instrumentale ou agentive de la construction hébraïque, sans trancher excessivement entre agence et supervision pour Itamar. La note b emploie « tablettes », terme français plus naturel pour les tablettes de l’alliance.
