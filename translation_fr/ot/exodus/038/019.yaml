base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/019.yaml
  text: Their four pillars and their four bronze bases[a], their hooks of silver[c][b], and the overlay of their tops and their bands of silver.
translation:
  language: fr
  text: Ses quatre poteaux avaient chacun un socle de bronze[a]. Leurs crochets étaient en argent; leur sommet était revêtu d’argent, et ils avaient des bandes d’argent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bases ». Il s’agit des pièces métalliques qui soutenaient les poteaux à leur pied.
    reason: lexical_alternative
  - marker: b
    text: La forme exacte de ces éléments en argent est incertaine; on peut aussi traduire « tringles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדֵיהֶם
  choice: ses quatre poteaux
  rationale: Dans le contexte de la cour du sanctuaire, עַמּוּד désigne les éléments verticaux qui soutiennent la tenture. « Poteaux » est ici plus naturel et concret que « colonnes ».
- source_word: אַדְנֵיהֶם
  choice: quatre socles
  rationale: אֶדֶן désigne les pièces métalliques placées au pied des poteaux pour les soutenir. « Socles » est précis et courant; « bases » reste possible.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Dans les descriptions du sanctuaire, נְחֹשֶׁת est traditionnellement et adéquatement rendu par « bronze », même si le terme hébreu peut désigner plus largement le cuivre ou un alliage cuivreux.
- source_word: וָוֵיהֶם
  choice: leurs crochets
  rationale: וָו désigne ici des pièces d’attache fixées aux poteaux; « crochets » convient au contexte et à l’usage répété du terme dans l’Exode.
- source_word: כֶּסֶף
  choice: argent
  rationale: Le nom de matière כֶּסֶף désigne sans ambiguïté l’argent dans ce contexte.
- source_word: צִפּוּי רָאשֵׁיהֶם
  choice: le revêtement de leur sommet
  rationale: 'La formulation conserve le groupe nominal hébreu: צִפּוּי est un revêtement ou placage, et רָאשֵׁיהֶם désigne littéralement la tête, donc le sommet, des poteaux.'
- source_word: חֲשֻׁקֵיהֶם
  choice: leurs tringles
  rationale: Le terme désigne des éléments d’argent associés aux poteaux, mais leur forme exacte demeure incertaine. « Tringles » fournit une désignation moderne intelligible sans reprendre l’archaïque « baguettes d’attache »; une note signale l’alternative « bandes ».
theological_decisions: []
translation_notes:
  register: 'Français international moderne, sobre et adapté à une description technique. La première phrase évite de laisser entendre que les poteaux eux-mêmes étaient en bronze: dans l’hébreu, la mention du bronze qualifie les quatre socles. La seconde phrase explicite sobrement le lien syntaxique entre les différents éléments en argent.'
