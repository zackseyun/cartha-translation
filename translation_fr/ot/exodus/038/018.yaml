  text: וּ/מָסַ֞ךְ שַׁ֤עַר הֶ/חָצֵר֙ מַעֲשֵׂ֣ה רֹקֵ֔ם תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר וְ/עֶשְׂרִ֤ים אַמָּה֙ אֹ֔רֶךְ וְ/קוֹמָ֤ה בְ/רֹ֨חַב֙ חָמֵ֣שׁ אַמּ֔וֹת לְ/עֻמַּ֖ת קַלְעֵ֥י הֶ/חָצֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/018.yaml
  text: And the screen for the gate of the courtyard was the work of an embroiderer[a], in blue and purple and scarlet yarn, and fine twined linen, twenty cubits long, and five cubits high[c][b], corresponding in width to the hangings of the courtyard.
translation:
  language: fr
  text: Le rideau de l’entrée de la cour était un ouvrage de brodeur, fait de fils bleus, pourpres et écarlates, ainsi que de fin lin retors. Il avait vingt coudées de long et cinq coudées de haut[a], comme les tentures de la cour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et une hauteur, en largeur, de cinq coudées, en correspondance avec les tentures de la cour ». La formulation hébraïque indique vraisemblablement que le rideau avait la même hauteur que les tentures de la cour.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָסַךְ שַׁעַר הֶחָצֵר
  choice: le rideau de l’entrée de la cour
  rationale: מָסַךְ désigne ici une tenture servant de fermeture, et שַׁעַר l’accès à la cour. « Rideau de l’entrée » exprime clairement la fonction sans suggérer une porte rigide.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: un ouvrage de brodeur
  rationale: La formulation conserve l’idée d’un travail textile exécuté par un artisan spécialisé, plutôt que de la réduire au seul adjectif « brodé ».
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: des fils bleus, pourpres et écarlates
  rationale: Ces termes désignent des matières textiles caractérisées par leur teinture. L’ajout explicite de « fils » rend la liste naturelle en français dans ce contexte de confection.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: fin lin retors
  rationale: Cette expression rend à la fois la qualité du lin et le fait que ses brins sont torsadés.
- source_word: עֶשְׂרִים אַמָּה אֹרֶךְ
  choice: vingt coudées de long
  rationale: La tournure française est naturelle et conserve l’unité de mesure ancienne.
- source_word: וְקוֹמָה בְרֹחַב חָמֵשׁ אַמּוֹת לְעֻמַּת קַלְעֵי הֶחָצֵר
  choice: cinq coudées de haut, comme les tentures de la cour
  rationale: La phrase hébraïque est dimensionnelle et quelque peu elliptique. Le contexte indique que la hauteur du rideau correspond à celle des tentures de la cour; la note conserve l’étrangeté de l’expression littérale.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Rideau » et « tentures » distinguent la fermeture de l’entrée des étoffes entourant la cour. La syntaxe est légèrement réorganisée pour rendre naturellement les dimensions tout en signalant en note l’expression hébraïque inhabituelle.
