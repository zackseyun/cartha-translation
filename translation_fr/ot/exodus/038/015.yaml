  text: And for the other side[a], on this side and on that side of the gate of the courtyard, there were hangings of fifteen cubits, their pillars three[b], and their bases three.
translation:
  language: fr
  text: Pour l’autre côté[a], de part et d’autre de l’entrée de la cour, il y avait des tentures de quinze coudées, avec trois piliers et trois socles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pour le second côté ». L’expression peut aussi être comprise globalement : « De part et d’autre de l’entrée de la cour » (avec le verset précédent).'
    reason: Ambiguïté syntaxique et spatiale de לַכָּתֵף הַשֵּׁנִית מִזֶּה וּמִזֶּה.
  - marker: b
    text: 'Ou : « bases ».'
    reason: אֶדֶן peut désigner un socle, une embase ou une base dans les descriptions du sanctuaire.
lexical_decisions:
- source_word: לַכָּתֵף ... הַשֵּׁנִית
  choice: pour l’autre côté
  rationale: כָּתֵף signifie littéralement « épaule », puis « côté » dans un emploi architectural. Ici, le mot désigne la seconde section latérale qui jouxte l’entrée ; « l’autre côté » est naturel en français tout en conservant le lien avec la description précédente.
- source_word: מִזֶּה וּמִזֶּה
  choice: de ce côté-ci et de ce côté-là
  rationale: Cette formulation garde la valeur spatiale et distributive de l’expression hébraïque sans la réduire d’emblée à une interprétation unique.
- source_word: לְשַׁעַר הֶחָצֵר
  choice: de l’entrée de la cour
  rationale: Dans ce contexte architectural, שַׁעַר désigne l’accès aménagé à la cour. « Entrée » convient mieux que « porte », qui pourrait évoquer à tort un battant rigide, et le rapport introduit par ל est rendu naturellement par « de ».
- source_word: קְלָעִים
  choice: tentures
  rationale: Le terme désigne les pièces textiles qui formaient l’enceinte de la cour. « Tentures » est précis, compréhensible et évite la confusion avec les rideaux intérieurs du sanctuaire.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: mesuraient quinze coudées
  rationale: L’unité ancienne est conservée. Le verbe « mesuraient », suppléé en français, exprime naturellement la proposition nominale hébraïque sans préciser arbitrairement s’il s’agit de longueur ou de hauteur.
- source_word: עַמֻּדֵיהֶם שְׁלֹשָׁה
  choice: elles avaient trois piliers
  rationale: עַמּוּד désigne ici les supports verticaux de l’enceinte. « Piliers » maintient le vocabulaire architectural et la relation possessive exprimée par le suffixe hébreu.
- source_word: וְאַדְנֵיהֶם שְׁלֹשָׁה
  choice: et trois socles
  rationale: אֶדֶן désigne la pièce inférieure qui reçoit et stabilise un pilier. « Socle » est clair en français moderne ; « base » reste une possibilité plus générale.
