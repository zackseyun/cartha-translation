  text: Their pillars were twenty[a], and their twenty bases were bronze[b]; the hooks of the pillars and their bands were silver.
translation:
  language: fr
  text: Leurs poteaux étaient au nombre de vingt, et leurs vingt socles[a] étaient en bronze ; les crochets des poteaux et leurs bandes[b] étaient en argent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « douilles ».
    reason: lexical_alternative
  - marker: b
    text: Traditionnellement « tringles ». Le terme hébreu désigne des éléments fixés aux poteaux, peut-être des bandes qui les ceinturaient ou des pièces qui les reliaient.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵיהֶם
  choice: leurs poteaux
  rationale: עַמּוּדִים désigne ici les supports verticaux de l’enceinte. « Poteaux » est plus naturel et précis que « colonnes » dans ce contexte de tentures.
- source_word: עֶשְׂרִים
  choice: vingt
  rationale: Le nombre cardinal est rendu directement dans ses deux occurrences.
- source_word: אַדְנֵיהֶם
  choice: leurs vingt socles
  rationale: Dans les descriptions du sanctuaire, אֶדֶן désigne la pièce servant de base ou de logement au poteau. « Socles » est clair en français moderne, tandis qu’« emboîtements » explicite davantage la fonction possible.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Le terme peut désigner le cuivre ou le bronze ; « bronze » est la désignation conventionnelle et contextuellement appropriée pour les éléments métalliques du sanctuaire.
- source_word: וָוֵי הָעַמֻּדִים
  choice: les crochets des poteaux
  rationale: וָוִים désigne des crochets ou pièces d’attache fixés aux poteaux. « Crochets » exprime clairement leur fonction probable.
- source_word: חֲשֻׁקֵיהֶם
  choice: leurs tringles
  rationale: Ce terme rare désigne des éléments qui ceinturent ou relient les poteaux. « Tringles » convient au contexte architectural et reste compréhensible, tout en signalant en note l’autre représentation possible.
- source_word: כָּסֶף
  choice: argent
  rationale: Le nom du matériau est rendu directement.
