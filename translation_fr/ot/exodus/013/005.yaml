  text: וְ/הָיָ֣ה כִֽי יְבִֽיאֲ/ךָ֣ יְהוָ֡ה אֶל אֶ֣רֶץ הַֽ֠/כְּנַעֲנִי וְ/הַ/חִתִּ֨י וְ/הָ/אֱמֹרִ֜י וְ/הַ/חִוִּ֣י וְ/הַ/יְבוּסִ֗י אֲשֶׁ֨ר נִשְׁבַּ֤ע לַ/אֲבֹתֶ֨י/ךָ֙ לָ֣/תֶת לָ֔/ךְ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ וְ/עָבַדְתָּ֛ אֶת הָ/עֲבֹדָ֥ה הַ/זֹּ֖את בַּ/חֹ֥דֶשׁ הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/005.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], the Hittites, the Amorites, the Hivites, and the Jebusites, which he swore to your fathers to give you, a land flowing with milk and honey, you shall perform this service in this month.
translation:
  language: fr
  text: Quand Yahweh t’aura fait entrer dans le pays des Cananéens, des Hittites, des Amorites, des Hivites et des Jébusites, pays qu’il a juré à tes ancêtres de te donner, un pays où coulent le lait et le miel, tu accompliras ce rite[a] pendant ce mois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce service » ou « cette observance ». Le terme hébreu peut désigner un acte prescrit de culte ou de service.
    reason: alternative lexicale
lexical_decisions:
- source_word: וְהָיָה כִי
  choice: Quand
  rationale: La construction introduit une circonstance future. « Quand » en restitue naturellement la valeur temporelle en français.
- source_word: יְבִיאֲךָ
  choice: t’aura fait entrer
  rationale: Le hiphil de בוא signifie « faire entrer » ou « amener ». Le futur antérieur exprime clairement que l’entrée dans le pays précède l’accomplissement du rite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי וְהַחִתִּי וְהָאֱמֹרִי וְהַחִוִּי וְהַיְבוּסִי
  choice: dans le pays des Cananéens, des Hittites, des Amorites, des Hivites et des Jébusites
  rationale: Les ethnonymes hébreux sont au singulier collectif, mais le pluriel désignant les peuples est idiomatique et précis en français.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: pays qu’il a juré à tes ancêtres de te donner
  rationale: Cette formulation conserve le serment et rattache explicitement la proposition relative au pays. « Ancêtres » rend ici naturellement אָבוֹת dans son sens générationnel.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: un pays où coulent le lait et le miel
  rationale: Cette tournure française naturelle conserve l’image hébraïque d’abondance et de fertilité.
- source_word: וְעָבַדְתָּ אֶת הָעֲבֹדָה הַזֹּאת
  choice: tu accompliras ce rite
  rationale: Le verbe עבד et le nom apparenté עֲבֹדָה décrivent ici l’exécution d’un service prescrit dans un contexte cultuel. « Accomplir ce rite » est clair sans préciser davantage la forme liturgique.
- source_word: בַּחֹדֶשׁ הַזֶּה
  choice: pendant ce mois
  rationale: La préposition temporelle situe l’observance au cours du mois désigné; « pendant » est idiomatique en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le Tétragramme comme nom personnel. « Yahweh » le préserve sans le remplacer par un titre.
- issue: Nuance cultuelle de עֲבֹדָה dans le contexte de la Pâque et des pains sans levain
  choice: ce rite
  alternative: ce service; cette observance
  rationale: Le terme peut désigner un service ou un acte cultuel prescrit. « Rite » communique ce sens en français courant, tandis que la note maintient les autres possibilités lexicales.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier suit les formes hébraïques adressées à Israël comme interlocuteur collectif. La longue phrase et l’énumération des peuples sont conservées, tout en employant une syntaxe française naturelle.
