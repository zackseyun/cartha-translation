lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Puis … parla
  rationale: Le wayyiqtol fait avancer le récit. « Puis » exprime naturellement la succession narrative, tandis que « parla » rend directement דבר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre plutôt que remplacé par un titre, conformément à sa fonction dans le texte hébreu.
- source_word: אֶל
  choice: à
  rationale: La préposition introduit ici le destinataire de la parole ; « à » est l’équivalent français naturel.
- source_word: מֹשֶׁה
  choice: Moïse
  rationale: Le nom propre est donné sous sa forme française conventionnelle.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif introduit le discours direct qui suit. « En ces termes » conserve cette fonction sans reproduire le tour hébraïque moins naturel « en disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: YHWH ; Jéhovah ; le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » en préserve le caractère de nom personnel, tandis que la note signale la forme hébraïque et l’existence d’autres traditions de rendu.
translation_notes:
  register: Français international moderne, sobre et digne. La formule « en ces termes » introduit naturellement la parole qui suit, tout en conservant la structure du texte hébreu.
