  text: וְ/הָיָ֞ה כִּֽי יִשְׁאָלְ/ךָ֥ בִנְ/ךָ֛ מָחָ֖ר לֵ/אמֹ֣ר מַה זֹּ֑את וְ/אָמַרְתָּ֣ אֵלָ֔י/ו בְּ/חֹ֣זֶק יָ֗ד הוֹצִיאָ֧/נוּ יְהוָ֛ה מִ/מִּצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/014.yaml
  text: And when your son asks you in time to come, saying, ‘What is this?’ then you shall say to him, ‘By a mighty hand the LORD brought us out from Egypt, from the house of servants.’
translation:
  language: fr
  text: 'Quand, à l’avenir, ton fils te demandera : « Que signifie cela ? », tu lui répondras : « D’une main puissante, l’Éternel nous a fait sortir d’Égypte, de la maison d’esclavage. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָחָר
  choice: à l’avenir
  rationale: Dans ce contexte, le terme ne désigne pas nécessairement le lendemain, mais un temps futur où l’enfant posera la question.
- source_word: בְּחֹזֶק יָד
  choice: d’une main puissante
  rationale: Expression française naturelle qui conserve l’image hébraïque de la main et exprime la force irrésistible de l’intervention divine.
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Rendu français traditionnel et intelligible du tétragramme, distinct du titre אֲדֹנָי (« Seigneur »).
- source_word: מִבֵּית עֲבָדִים
  choice: de la maison d’esclavage
  rationale: L’expression désigne l’Égypte comme lieu et régime de servitude; ce rendu idiomatique préserve la métaphore de la maison.
theological_decisions:
- issue: Identification communautaire dans « nous a fait sortir »
  choice: 'Conserver la première personne du pluriel : « nous a fait sortir »'
  alternative: « a fait sortir nos ancêtres »
  rationale: L’hébreu הוֹצִיאָנוּ associe directement les générations suivantes à l’acte fondateur de la délivrance; expliciter « nos ancêtres » réduirait cette solidarité narrative et théologique.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe catéchétique de la question et de la réponse est conservée, avec une formulation naturelle à l’oral comme à la lecture publique.
