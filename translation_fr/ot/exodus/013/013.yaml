  text: And every firstborn of a donkey you shall redeem with a lamb; and if you do not redeem it[a], then you shall break its neck. And every firstborn of man among your sons you shall redeem.
translation:
  language: fr
  text: Tu rachèteras tout premier-né d’un âne avec une bête du petit bétail[a] ; si tu ne le rachètes pas, tu lui briseras la nuque. Tu rachèteras aussi tout premier-né humain parmi tes fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne une bête du petit bétail, mouton ou chèvre.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּטֶר חֲמֹר
  choice: premier-né d’un âne
  rationale: פֶּטֶר désigne littéralement celui qui ouvre le sein maternel. Dans cette prescription, « premier-né d’un âne » exprime ce sens avec naturel en français.
- source_word: תִּפְדֶּה
  choice: tu rachèteras
  rationale: פדה indique la libération moyennant un prix ou un substitut. « Racheter » conserve ici la portée juridique et cultuelle du verbe.
- source_word: בְשֶׂה
  choice: avec une bête du petit bétail
  rationale: שֶׂה peut désigner un ovin ou un caprin. Cette formulation préserve l’étendue du terme hébreu sans la réduire à « agneau ».
- source_word: וַעֲרַפְתּוֹ
  choice: tu lui briseras la nuque
  rationale: ערף désigne la mise à mort par rupture de la nuque, et non l’abattage rituel ordinaire.
- source_word: בְּכוֹר אָדָם בְּבָנֶיךָ
  choice: tout fils premier-né
  rationale: אָדָם marque le contraste avec l’animal, tandis que בְּבָנֶיךָ précise qu’il s’agit des fils. « Tout fils premier-né » transmet les deux éléments sans la tournure peu naturelle « premier-né d’homme parmi tes fils ».
theological_decisions:
- issue: Rapport entre בְּכוֹר אָדָם et בְּבָנֶיךָ
  choice: tout fils premier-né
  alternative: tout premier-né humain parmi tes fils
  rationale: Le texte oppose le premier-né humain au premier-né animal, puis précise « parmi tes fils ». La formulation choisie garde la référence masculine explicite de בָּנֶיךָ tout en restant idiomatique, sans donner à אָדָם le sens d’« homme adulte ».
translation_notes:
  register: Français moderne, clair et digne. Le futur simple rend la force prescriptive de la loi. La répétition de « rachèteras » et la structure conditionnelle de l’hébreu sont conservées.
