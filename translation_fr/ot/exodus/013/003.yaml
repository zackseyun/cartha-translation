  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל הָ/עָ֗ם זָכ֞וֹר אֶת הַ/יּ֤וֹם הַ/זֶּה֙ אֲשֶׁ֨ר יְצָאתֶ֤ם מִ/מִּצְרַ֨יִם֙ מִ/בֵּ֣ית עֲבָדִ֔ים כִּ֚י בְּ/חֹ֣זֶק יָ֔ד הוֹצִ֧יא יְהֹוָ֛ה אֶתְ/כֶ֖ם מִ/זֶּ֑ה וְ/לֹ֥א יֵאָכֵ֖ל חָמֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/003.yaml
  text: Then Moses said to the people[a], “Remember this day in which you came out from Egypt, from the house of slavery, because Yahweh brought you out from there by a strong hand[c][b]; and no leavened bread shall be eaten.”
translation:
  language: fr
  text: 'Moïse dit au peuple : « Souvenez-vous de ce jour où vous êtes sortis d’Égypte, de la maison de l’esclavage[a], car Yahweh vous en a fait sortir par la force de sa main[b] ; et l’on ne mangera rien de levé[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la maison des esclaves », expression qui présente l’Égypte comme un lieu d’asservissement.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « d’une main puissante ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « aucun pain levé ne sera mangé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכוֹר
  choice: Souvenez-vous
  rationale: L’impératif hébreu est au singulier parce que le peuple est envisagé collectivement. En français, le pluriel « Souvenez-vous » est l’adresse naturelle au peuple assemblé et conserve la portée mémorielle du commandement.
- source_word: הַיּוֹם הַזֶּה
  choice: ce jour
  rationale: Rend directement le nom défini accompagné du démonstratif, sans ajouter une insistance absente du texte.
- source_word: יְצָאתֶם מִמִּצְרַיִם
  choice: vous êtes sortis d’Égypte
  rationale: Le verbe יצא exprime ici la sortie d’un lieu. Le passé composé convient à une parole qui rappelle un événement accompli et « sortir d’Égypte » est naturel en français.
- source_word: מִבֵּית עֲבָדִים
  choice: de la maison de l’esclavage
  rationale: Littéralement « de la maison des esclaves ». La formulation retenue restitue en français courant l’idiome désignant l’Égypte comme lieu d’asservissement, tout en conservant l’image de la maison.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison pour laquelle ce jour doit être gardé en mémoire. « Car » maintient clairement le rapport causal dans un registre digne.
- source_word: בְּחֹזֶק יָד
  choice: par la force de sa main
  rationale: Rend l’image hébraïque de la puissance agissante exprimée par la « force de la main ». Le possessif explicite naturellement en français que cette main est celle de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: הוֹצִיא ... אֶתְכֶם מִזֶּה
  choice: vous en a fait sortir
  rationale: Le hiphil de יצא est causatif, « faire sortir ». Le pronom « en » reprend naturellement en français l’Égypte, la maison de l’esclavage, correspondant à « de là ».
- source_word: וְלֹא יֵאָכֵל חָמֵץ
  choice: et l’on ne mangera rien de levé
  rationale: La tournure avec « l’on » garde la valeur générale et impersonnelle du passif hébreu. « Rien de levé » préserve l’étendue possible de חָמֵץ, qui ne se limite pas nécessairement au pain.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte directement le tétragramme, nom personnel du Dieu d’Israël. « Yahweh » le conserve sans le remplacer par un titre ni privilégier une tradition confessionnelle.
- issue: Sens de עֲבָדִים dans la formule de l’Exode
  choice: l’esclavage
  alternative: les esclaves / la servitude
  rationale: Le contexte décrit l’asservissement réel d’Israël en Égypte. Le nom abstrait convient à l’idiome français « maison de l’esclavage » sans atténuer cette réalité.
- issue: Étendue de l’interdiction portant sur חָמֵץ
  choice: rien de levé
  alternative: aucun pain levé
  rationale: Le terme hébreu peut désigner ce qui est levé ou fermenté, et pas uniquement le pain. La formulation principale garde cette portée sans préciser davantage que la source.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe directe garde la solennité du discours sans archaïsmes. Les images hébraïques de la maison et de la main sont conservées sous une forme idiomatique, tandis que l’ambiguïté de חָמֵץ reste visible dans le texte et la note.
