id: EXO.13.15
reference: Exodus 13:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּֽי הִקְשָׁ֣ה פַרְעֹה֮ לְ/שַׁלְּחֵ/נוּ֒ וַ/יַּהֲרֹ֨ג יְהֹוָ֤ה כָּל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מִ/בְּכֹ֥ר אָדָ֖ם וְ/עַד בְּכ֣וֹר בְּהֵמָ֑ה עַל כֵּן֩ אֲנִ֨י זֹבֵ֜חַ לַֽ/יהוָ֗ה כָּל פֶּ֤טֶר רֶ֨חֶם֙ הַ/זְּכָרִ֔ים וְ/כָל בְּכ֥וֹר בָּנַ֖/י אֶפְדֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/015.yaml
  text: And when Pharaoh stubbornly refused to let us go[a], Yahweh killed every firstborn in the land of Egypt, from the firstborn of man to the firstborn of beast. Therefore I sacrifice to Yahweh every male that opens the womb, but every firstborn of my sons I redeem.
translation:
  language: fr
  text: Comme Pharaon refusait obstinément de nous laisser partir, Yahweh tua tous les premiers-nés du pays d’Égypte, depuis le premier-né des humains jusqu’au premier-né du bétail[a]. C’est pourquoi j’offre en sacrifice à Yahweh tout mâle qui ouvre le sein maternel, mais je rachète tout premier-né parmi mes fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « depuis le premier-né de l’être humain jusqu’au premier-né des animaux domestiques ».'
    reason: Alternative lexicale pour le contraste générique entre אָדָם et בְּהֵמָה.
lexical_decisions:
- source_word: הִקְשָׁה
  choice: refusait obstinément
  rationale: Dans la construction avec לְשַׁלְּחֵנוּ, le hifil de קשׁה exprime la résistance opiniâtre de Pharaon. Cette formulation rend naturellement en français la force contextuelle du verbe sans lui ajouter un objet absent.
- source_word: לְשַׁלְּחֵנוּ
  choice: de nous laisser partir
  rationale: Dans le récit de l’Exode, שׁלח désigne ici le fait de libérer ou de laisser partir le peuple. « Nous laisser partir » reprend le refrain narratif dans un français idiomatique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La traduction conserve le nom divin personnel exprimé par le tétragramme.
- source_word: בְּכוֹר
  choice: premier-né
  rationale: Équivalent français précis et traditionnel, maintenu dans toutes les occurrences du verset.
- source_word: מִבְּכֹר אָדָם וְעַד בְּכוֹר בְּהֵמָה
  choice: depuis le premier-né des humains jusqu’au premier-né du bétail
  rationale: אָדָם désigne ici les êtres humains en contraste avec les animaux, tandis que בְּהֵמָה renvoie au bétail ou aux animaux domestiques. La construction « depuis… jusqu’à… » préserve l’étendue exprimée en hébreu.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette locution marque clairement le lien de conséquence entre la mort des premiers-nés en Égypte et la pratique d’Israël.
- source_word: זֹבֵחַ
  choice: j’offre en sacrifice
  rationale: זבח désigne l’acte d’immoler ou d’offrir comme sacrifice. La formulation explicite le sens cultuel en français courant et digne.
- source_word: פֶּטֶר רֶחֶם
  choice: qui ouvre le sein maternel
  rationale: L’expression hébraïque désigne le premier petit qui sort du sein. « Sein maternel » garde l’image corporelle tout en évitant l’ambiguïté moderne de « sein » employé seul.
- source_word: הַזְּכָרִים
  choice: tout mâle
  rationale: L’adjectif substantivé au pluriel précise que la règle sacrificielle concerne les mâles parmi ceux qui ouvrent le sein; le singulier distributif français convient avec « tout ».
- source_word: בָּנַי
  choice: mes fils
  rationale: Le texte hébreu emploie explicitement le terme « fils », qui doit être conservé plutôt que généralisé en « enfants ».
- source_word: אֶפְדֶּה
  choice: je rachète
  rationale: Dans ce contexte juridique et cultuel, פדה désigne la délivrance d’un premier-né moyennant un substitut ou un prix. « Racheter » est naturel et conserve cette notion.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom personnel plutôt que de le remplacer par un titre.
- issue: Portée de אָדָם en contraste avec בְּהֵמָה
  choice: les humains
  alternative: l’homme
  rationale: אָדָם est générique dans cette opposition entre l’humanité et le bétail. « Les humains » communique cette portée collective sans suggérer que seuls les hommes de sexe masculin sont visés.
- issue: Nature du sacrifice et du rachat des premiers-nés
  choice: distinguer les mâles offerts en sacrifice des fils premiers-nés rachetés
  alternative: formuler les deux groupes comme s’ils subissaient le même sort
  rationale: 'Le contraste explicite entre זֹבֵחַ et אֶפְדֶּה doit être préservé: les animaux mâles concernés sont sacrifiés, tandis que les fils premiers-nés sont rachetés.'
translation_notes:
  register: Français international moderne, narratif et digne. L’imparfait dans « refusait obstinément » présente la résistance de Pharaon comme la circonstance conduisant à l’action ponctuelle exprimée par « tua ». Le vocabulaire cultuel reste accessible sans effacer la précision juridique du passage.
