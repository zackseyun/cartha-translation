source:
  edition: WLC
  text: וַ/יַּסֵּ֨ב אֱלֹהִ֧ים אֶת הָ/עָ֛ם דֶּ֥רֶךְ הַ/מִּדְבָּ֖ר יַם ס֑וּף וַ/חֲמֻשִׁ֛ים עָל֥וּ בְנֵי יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/018.yaml
  text: So God led the people around by the way of the wilderness to the Sea of Reeds[b][a], and the sons of Israel went up from the land of Egypt armed.
translation:
  language: fr
  text: Dieu fit faire au peuple un détour par le chemin du désert, vers la mer des Roseaux[a]. Les fils d’Israël montèrent du pays d’Égypte en ordre de bataille[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la mer Rouge ». Le nom hébreu signifie littéralement « mer des Roseaux ».
    reason: alternative_reading
  - marker: b
    text: Le terme hébreu est incertain ; il peut aussi signifier « armés », « équipés pour le combat » ou, plus généralement, « en rangs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: fit donc faire un détour
  rationale: Le hiphil de סבב exprime ici l’action de faire prendre au peuple un itinéraire détourné; cette formulation française conserve clairement l’initiative divine.
- source_word: דֶּרֶךְ הַמִּדְבָּר
  choice: par le chemin du désert
  rationale: דֶּרֶךְ désigne la route empruntée; «par le chemin du désert» reste proche de l’hébreu tout en étant naturel en français.
- source_word: יַם סוּף
  choice: la mer des Roseaux
  rationale: Cette traduction rend le sens lexical de סוּף et donne priorité au texte hébreu plutôt qu’à l’appellation traditionnelle «mer Rouge».
- source_word: וַחֲמֻשִׁים
  choice: en ordre de bataille
  rationale: Le terme est incertain et peut évoquer des hommes armés, équipés ou organisés en formation; «en ordre de bataille» exprime la préparation collective sans affirmer plus précisément que l’hébreu.
- source_word: עָלוּ
  choice: sortirent
  rationale: Bien que le verbe signifie littéralement «montèrent», dans ce contexte de départ d’Égypte, «sortirent» produit un français naturel et rend correctement le mouvement hors du pays.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La formulation conserve la forme masculine et la transparence de l’expression hébraïque, qui désigne collectivement le peuple d’Israël.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: du pays d’Égypte
  rationale: Rendu direct et idiomatique de la provenance exprimée par מִן.
theological_decisions:
- issue: Désignation de יַם סוּף
  choice: la mer des Roseaux
  alternative: la mer Rouge
  rationale: Le choix principal suit le sens lexical de l’hébreu; l’appellation traditionnelle est conservée en note sans être imposée au texte.
- issue: Portée de בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: La traduction préserve la forme de l’expression source tout en la comprenant comme une désignation collective du peuple.
- issue: Sens incertain de וַחֲמֻשִׁים
  choice: en ordre de bataille
  alternative: armés; équipés pour le combat; en rangs
  rationale: Le texte principal retient un sens vraisemblable sans supprimer l’incertitude lexicale, explicitement signalée en note.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche de l’hébreu sans calque pesant; les deux phrases améliorent la lisibilité. Les ambiguïtés lexicales réelles sont préservées par les notes.
