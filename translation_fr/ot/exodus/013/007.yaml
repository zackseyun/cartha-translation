base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/007.yaml
  text: Unleavened bread shall be eaten throughout the seven days[a], and no leaven shall be seen with you[b], and no yeast shall be seen with you within all your territory.
translation:
  language: fr
  text: Pendant les sept jours, on mangera des pains sans levain. Aucun produit levé ne se trouvera chez toi[a], et aucun levain ne se trouvera chez toi dans tout ton territoire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu חָמֵץ désigne ce qui est levé, notamment du pain levé, par opposition au levain lui-même dans la proposition suivante.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « ne sera pas vu avec toi ». Dans ce contexte, la formule signifie qu’aucun levain ne doit être présent dans ta possession ou sur ton territoire.
    reason: lexical_clarification
lexical_decisions:
- source_word: מַצּוֹת
  choice: pain sans levain
  rationale: Dans le contexte de la Pâque, le terme désigne des pains préparés sans levain. Le singulier collectif « pain sans levain » est l’expression française courante et conserve clairement la portée rituelle.
- source_word: יֵאָכֵל
  choice: on mangera
  rationale: Le nifal exprime littéralement le passif (« sera mangé »). La tournure impersonnelle française transmet naturellement cette valeur et la force prescriptive du contexte sans transformer la forme en impératif direct.
- source_word: אֵת שִׁבְעַת הַיָּמִים
  choice: pendant les sept jours
  rationale: L’accusatif de durée couvre toute la période des sept jours. La formulation française est claire sans ajouter une intensité absente du texte.
- source_word: יֵרָאֶה לְךָ
  choice: on ne verra chez toi
  rationale: Le nifal de ראה signifie littéralement « être vu ». « Chez toi » rend ici l’emploi idiomatique de לְךָ, qui concerne ce qui se trouve dans la sphère ou le domaine du destinataire, tout en conservant l’image de la visibilité.
- source_word: חָמֵץ
  choice: rien de fermenté
  rationale: Le mot désigne ici ce qui est levé ou fermenté, plutôt que le seul agent de fermentation. Cette traduction maintient la distinction avec שְׂאֹר dans la proposition suivante.
- source_word: שְׂאֹר
  choice: levain
  rationale: Le terme désigne la matière fermentée servant à faire lever la pâte. « Levain » convient mieux au contexte ancien que « levure » et le distingue de la denrée déjà fermentée exprimée par חָמֵץ.
- source_word: בְּכָל גְּבֻלֶךָ
  choice: dans tout ton territoire
  rationale: L’expression vise toute l’étendue comprise dans les limites du domaine du destinataire. « Territoire » est naturel en français moderne et évite le calque ambigu « dans toutes tes frontières ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure impersonnelle « on mangera » évite le passif peu naturel « sera mangé », tandis que la répétition de « chez toi » conserve le parallélisme juridique de l’hébreu. La distinction entre חָמֵץ et שְׂאֹר est maintenue par « rien de fermenté » et « levain ».
