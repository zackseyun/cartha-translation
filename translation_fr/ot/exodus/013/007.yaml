    rationale: Le français « fermenté » peut inclure des aliments ou boissons fermentés qui ne relèvent pas de ce que le texte oppose au levain (שְׂאֹר). « Produit levé » conserve mieux la référence à une denrée levée tout en évitant de limiter indûment le terme au pain.
  - severity: low
