  source_fidelity: La distinction entre חָמֵץ (ce qui est levé) et שְׂאֹר (l’agent de levage) doit être conservée. « Fermenté » est trop large en français, car il peut viser des produits fermentés sans rapport avec le levain. La formule « ne se trouvera chez toi » rend naturellement, dans ce contexte juridique, le passif « ne sera pas vu avec/chez toi » et sa portée de possession ou de présence.
  naturalness: « Des pains sans levain » reflète le pluriel de מַצּוֹת et reste idiomatique. « Aucun produit levé ne se trouvera chez toi » est plus naturel et plus précis que « on ne verra chez toi rien de fermenté », tout en gardant un registre juridique sobre.
  terminology: « Pain sans levain », « produit levé » et « levain » maintiennent la terminologie rituelle et la distinction lexicale du texte hébreu sans imposer une identification plus étroite de חָמֵץ avec le seul pain levé.
