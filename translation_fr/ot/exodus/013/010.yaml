  yaml_path: translation/ot/exodus/013/010.yaml
  text: You shall keep this statute at its appointed time from year to year[a].
translation:
  language: fr
  text: Tu observeras cette prescription au temps fixé pour elle, d’année en année[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « de jours en jours » ; cette expression est souvent comprise ici au sens de « d’année en année ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Tu observeras
  rationale: Dans un contexte légal et cultuel, שׁמר signifie respecter ou observer une prescription. « Observer » est naturel en français et exprime l’obéissance durable.
- source_word: הַחֻקָּה הַזֹּאת
  choice: cette prescription
  rationale: חֻקָּה désigne une règle fixée ou une ordonnance. « Prescription » conserve le caractère normatif sans coloration ecclésiastique particulière.
- source_word: לְמוֹעֲדָהּ
  choice: au temps fixé pour elle
  rationale: מוֹעֵד indique un moment déterminé; le suffixe féminin renvoie à la prescription ou à son observance. Cette formulation explicite fidèlement le rapport grammatical.
- source_word: מִיָּמִים יָמִימָה
  choice: d’année en année
  rationale: L’expression signifie littéralement « de jours en jours », mais désigne ici la périodicité annuelle de la célébration. Le sens idiomatique convient au texte principal, tandis que la forme hébraïque est signalée en note.
