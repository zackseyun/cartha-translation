  yaml_path: translation/ot/exodus/013/004.yaml
  text: Today you are going out[a], in the month of Abib.
translation:
  language: fr
  text: Aujourd’hui, vous sortez au mois d’Abib.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abib est le nom du mois ; ce terme est associé aux jeunes épis, au printemps.
    reason: cultural_note
lexical_decisions:
- source_word: הַיּוֹם
  choice: Aujourd’hui
  rationale: Le nom avec article a ici une valeur adverbiale et désigne le jour présent de la sortie; « Aujourd’hui » rend naturellement l’immédiateté de l’adresse.
- source_word: אַתֶּם
  choice: vous
  rationale: Le pronom hébreu est à la deuxième personne du pluriel et s’adresse aux Israélites; le français « vous » en conserve le nombre sans ajout explicatif.
- source_word: יֹצְאִים
  choice: sortez
  rationale: Le participe qal pluriel exprime une action en cours ou imminente. Le présent français « sortez » reste naturel et maintient le mouvement hors d’Égypte.
- source_word: בְּחֹדֶשׁ
  choice: au mois de
  rationale: La préposition בְּ introduit ici une indication calendaire; « au mois de » est l’expression française idiomatique correspondante.
- source_word: הָאָבִיב
  choice: Abib
  rationale: La translittération conserve la désignation hébraïque du mois sans remplacer celle-ci par une interprétation comme « printemps » ou « épis nouveaux ».
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La tournure brève conserve l’immédiateté de l’énoncé hébreu; le nom ancien du mois est maintenu et expliqué en note.
