base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/009.yaml
  text: And it shall be for you as a sign on your hand and as a memorial between your eyes[a], so that the law of Yahweh may be in your mouth[c][b]; for with a strong hand Yahweh brought you out of Egypt.
translation:
  language: fr
  text: Ce sera pour toi un signe sur ta main et un rappel entre tes yeux[a], afin que l’enseignement de Yahweh soit dans ta bouche[b] ; car Yahweh t’a fait sortir d’Égypte d’une main forte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « entre tes yeux » peut aussi se comprendre idiomatiquement comme « sur ton front » ; le texte conserve ici la formulation hébraïque.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la loi de Yahweh ». Le mot hébreu torah peut désigner la loi ou, plus largement, l’enseignement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה לְךָ לְאוֹת
  choice: Ce sera pour toi un signe
  rationale: La tournure prospective convient à cette instruction commémorative. « Signe » garde la portée large de אוֹת sans imposer qu’il s’agisse déjà d’un objet rituel précis.
- source_word: עַל יָדְךָ
  choice: sur ta main
  rationale: Traduction directe de l’image hébraïque, sans la remplacer par « sur ton bras » ni l’identifier explicitement aux tefillin.
- source_word: וּלְזִכָּרוֹן
  choice: et un mémorial
  rationale: זִכָּרוֹן désigne ce qui entretient le souvenir. « Mémorial » conserve ici la force commémorative et cultuelle du substantif.
- source_word: בֵּין עֵינֶיךָ
  choice: entre tes yeux
  rationale: La formulation concrète de l’hébreu est maintenue dans le texte, tandis que son sens idiomatique possible est signalé en note.
- source_word: תּוֹרַת יְהוָה
  choice: l’enseignement de Yahweh
  rationale: תּוֹרָה peut désigner une instruction ou une loi. Dans ce contexte d’enseignement lié à la commémoration de la sortie d’Égypte, « enseignement » conserve sa portée plus large sans exclure le sens légal.
- source_word: בְּפִיךָ
  choice: dans ta bouche
  rationale: La traduction littérale préserve l’image de paroles récitées, proclamées ou tenues prêtes à être dites.
- source_word: בְּיָד חֲזָקָה
  choice: d’une main forte
  rationale: Cette expression reproduit étroitement l’idiome de l’Exode et attribue la délivrance à l’action puissante de Yahweh.
- source_word: הוֹצִאֲךָ
  choice: t’a fait sortir
  rationale: Le hifil de יצא exprime le fait de faire sortir. Cette formulation française demeure naturelle tout en reflétant précisément la valeur causative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver dans le texte le nom propre présent dans la source hébraïque.
theological_decisions:
- issue: Portée du signe sur la main et du mémorial entre les yeux
  choice: Conserver les images concrètes sans les identifier explicitement à une pratique rituelle ultérieure.
  alternative: Traduire directement par « sur le front » et expliciter les tefillin, ou paraphraser l’ensemble comme un simple souvenir intérieur.
  rationale: Le verset ne nomme aucun objet rituel et n’indique pas non plus que l’image serait uniquement métaphorique. La formulation retenue préserve cette ouverture interprétative.
- issue: Sens de תּוֹרָה dans ce contexte
  choice: Employer « enseignement » dans le texte principal.
  alternative: Employer « loi » ou conserver « Torah ».
  rationale: Le mot hébreu couvre l’instruction aussi bien que la loi. « Enseignement » rend ici cette amplitude, tandis que « loi » reste une possibilité légitime indiquée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu lorsque ses images sont compréhensibles en français. Le point-virgule distingue clairement le but commémoratif de son fondement historique.
