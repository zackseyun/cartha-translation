source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/שַׁלַּ֣ח פַּרְעֹה֮ אֶת הָ/עָם֒ וְ/לֹא נָחָ֣/ם אֱלֹהִ֗ים דֶּ֚רֶךְ אֶ֣רֶץ פְּלִשְׁתִּ֔ים כִּ֥י קָר֖וֹב ה֑וּא כִּ֣י אָמַ֣ר אֱלֹהִ֗ים פֶּֽן יִנָּחֵ֥ם הָ/עָ֛ם בִּ/רְאֹתָ֥/ם מִלְחָמָ֖ה וְ/שָׁ֥בוּ מִצְרָֽיְמָ/ה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/017.yaml
  text: When Pharaoh let the people go[a], God did not lead them by the way of the land of the Philistines, though it was near; for God said[b], “Lest the people change their minds when they see war and return to Egypt.”
translation:
  language: fr
  text: 'Lorsque le pharaon laissa partir le peuple, Dieu ne le conduisit pas par la route du pays des Philistins, bien qu’elle fût proche[a], car Dieu s’était dit : « Il ne faudrait pas que le peuple change d’avis[b] en voyant la guerre et retourne en Égypte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parce qu’elle était proche ». La conjonction hébraïque peut être comprise dans un sens causal ou concessif.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « regrette son départ » ou « revienne sur sa décision ». Le verbe hébreu évoque ici un changement d’avis devant la guerre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׁלַּח
  choice: Lorsque le pharaon laissa partir
  rationale: La préposition ב avec l’infinitif construit marque ici une circonstance temporelle. « Laisser partir » rend naturellement l’idée de libération exprimée par שׁלח dans le contexte de l’Exode.
- source_word: נָחָם
  choice: conduisit
  rationale: Le verbe נחה signifie conduire ou guider. « Conduire » convient au choix d’un itinéraire et évite une formulation trop littérale.
- source_word: דֶּרֶךְ אֶרֶץ פְּלִשְׁתִּים
  choice: par la route du pays des Philistins
  rationale: Cette formulation conserve à la fois l’idée de route portée par דֶּרֶךְ et la désignation géographique construite avec le nom du peuple philistin.
- source_word: כִּי קָרוֹב הוּא
  choice: bien qu’elle fût proche
  rationale: כִּי peut recevoir ici une valeur concessive ou causale. La valeur concessive exprime clairement que Dieu évite cet itinéraire malgré sa proximité, tandis que l’autre possibilité est signalée en note.
- source_word: פֶּן
  choice: Il ne faudrait pas que
  rationale: פֶּן introduit une éventualité redoutée. Dans le discours direct, cette tournure française actuelle et digne rend naturellement cette appréhension.
- source_word: יִנָּחֵם
  choice: change d’avis
  rationale: Le niphal de נחם désigne ici un changement de disposition ou de résolution devant la guerre, sans nécessairement exprimer un repentir moral.
- source_word: בִּרְאֹתָם מִלְחָמָה
  choice: en voyant la guerre
  rationale: L’infinitif construit précédé de ב exprime la circonstance. « La guerre » garde le sens général de מִלְחָמָה, qui peut aussi désigner le combat.
- source_word: וְשָׁבוּ מִצְרָיְמָה
  choice: et retourne en Égypte
  rationale: שׁוב exprime le retour, et la terminaison directionnelle de מִצְרַיִם est rendue par « en Égypte ».
- source_word: וַיְהִי
  choice: Lorsque
  rationale: Le wayyiqtol de היה fait avancer le récit et introduit la circonstance temporelle. En français, « Lorsque » restitue cette fonction sans ajouter un marqueur tel que « Or » ou « Maintenant ».
theological_decisions:
- issue: La raison divine d’éviter la route du pays des Philistins
  choice: Le texte présente Dieu comme choisissant l’itinéraire en considération du possible changement d’avis du peuple devant la guerre.
  alternative: Comprendre cette motivation comme une conjecture du narrateur ou comme un changement réactif du projet divin.
  rationale: La proposition explicite « car Dieu s’était dit » attribue cette raison à Dieu. La traduction conserve cette motivation telle que le verset la formule sans tirer de conclusion doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au récit biblique soutenu sans archaïsme marqué. Le discours intérieur est rendu par « Dieu s’était dit », et l’éventualité redoutée par « Il ne faudrait pas que », tournure claire pour un lectorat général.
