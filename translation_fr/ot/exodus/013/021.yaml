  variant: modern international French
source:
  edition: WLC
  text: וַֽ/יהוָ֡ה הֹלֵךְ֩ לִ/פְנֵי/הֶ֨ם יוֹמָ֜ם בְּ/עַמּ֤וּד עָנָן֙ לַ/נְחֹתָ֣/ם הַ/דֶּ֔רֶךְ וְ/לַ֛יְלָה בְּ/עַמּ֥וּד אֵ֖שׁ לְ/הָאִ֣יר לָ/הֶ֑ם לָ/לֶ֖כֶת יוֹמָ֥ם וָ/לָֽיְלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/021.yaml
  text: And Yahweh was going before them by day in a pillar of cloud to lead them on the way[a], and by night in a pillar of fire to give them light, so that they could travel by day and by night.
translation:
  language: fr
  text: 'Yahweh allait devant eux : le jour dans une colonne de nuée pour les guider sur le chemin, et la nuit dans une colonne de feu pour les éclairer, afin qu’ils puissent marcher de jour comme de nuit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin présent dans le texte hébreu.
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: allait devant eux
  rationale: Le participe exprime une action continue; l’imparfait français rend naturellement cette présence qui les précédait et les conduisait.
- source_word: יוֹמָם
  choice: le jour
  rationale: Formulation temporelle naturelle, mise en parallèle avec « la nuit ».
- source_word: בְּעַמּוּד עָנָן
  choice: dans une colonne de nuée
  rationale: « Colonne de nuée » conserve l’image concrète traditionnelle; « dans » rend la manifestation de Yahweh sous cette forme visible sans réduire la préposition à un simple moyen instrumental.
- source_word: לַנְחֹתָם הַדֶּרֶךְ
  choice: pour les guider sur le chemin
  rationale: Le verbe נחה désigne l’action de conduire ou guider. « Sur le chemin » restitue le complément défini dans un français idiomatique.
- source_word: וְלַיְלָה בְּעַמּוּד אֵשׁ
  choice: et la nuit dans une colonne de feu
  rationale: La formulation maintient le parallélisme avec la colonne de nuée et préserve l’image hébraïque.
- source_word: לְהָאִיר לָהֶם
  choice: pour les éclairer
  rationale: 'L’infinitif causatif indique le but : leur procurer de la lumière. « Les éclairer » est concis et naturel.'
- source_word: לָלֶכֶת יוֹמָם וָלָיְלָה
  choice: afin qu’ils puissent marcher de jour comme de nuit
  rationale: L’infinitif exprime ici le but ou le résultat permis par la lumière. « Marcher » reste proche du verbe הלך tout en convenant au déplacement du peuple; « de jour comme de nuit » rend clairement la totalité exprimée par la paire temporelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » conserve le caractère de nom propre sans introduire un titre absent de l’hébreu.
- issue: Rapport entre Yahweh et les colonnes
  choice: dans une colonne de nuée… dans une colonne de feu
  alternative: au moyen d’une colonne de nuée… au moyen d’une colonne de feu
  rationale: La préposition בְּ permet plusieurs nuances. « Dans » suit de près la formulation hébraïque et laisse subsister le mystère du mode de présence divine, sans l’expliquer comme un simple instrument.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le parallélisme du texte hébreu et son mouvement continu, tout en évitant une syntaxe artificiellement littérale.
