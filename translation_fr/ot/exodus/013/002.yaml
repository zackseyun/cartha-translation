source:
  edition: WLC
  text: קַדֶּשׁ לִ֨/י כָל בְּכ֜וֹר פֶּ֤טֶר כָּל רֶ֨חֶם֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה לִ֖/י הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/002.yaml
  text: Consecrate to me every firstborn[a], the first to open every womb among the sons of Israel, among man and among beast; it is mine.
translation:
  language: fr
  text: 'Consacre-moi tout premier-né, tout ce qui ouvre le sein maternel parmi les Israélites, chez les humains et chez les animaux : il m’appartient.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַדֶּשׁ
  choice: Consacre
  rationale: L’impératif demande de mettre à part pour Dieu comme saint. « Consacre » est actuel, digne et conserve la portée cultuelle du verbe.
- source_word: לִי
  choice: -moi
  rationale: Le pronom avec ל indique ici la destination et l’appartenance à Dieu ; la construction française « consacre-moi » l’exprime naturellement.
- source_word: כָל בְּכוֹר
  choice: tout premier-né
  rationale: Le texte dit « premier-né » sans ajouter explicitement « mâle » ; cette précision n’est donc pas introduite.
- source_word: פֶּטֶר כָּל רֶחֶם
  choice: tout être qui ouvre le sein maternel
  rationale: La formule précise le premier-né comme celui qui sort le premier du sein maternel. « Tout être » permet une formulation française naturelle applicable aux humains et aux animaux.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: parmi les Israélites
  rationale: Le sens collectif de « fils d’Israël » désigne ici le peuple d’Israël ; « les Israélites » est clair et naturel en français moderne.
- source_word: בָּאָדָם
  choice: chez les humains
  rationale: אָדָם est ici un singulier collectif désignant l’espèce humaine par contraste avec les animaux. « Les humains » rend ce sens sans suggérer que seuls les hommes de sexe masculin sont visés.
- source_word: וּבַבְּהֵמָה
  choice: comme chez les animaux
  rationale: בְּהֵמָה fonctionne comme un collectif et s’oppose ici à l’être humain. « Animaux » conserve l’étendue du terme, contrairement à « bétail », qui serait plus restrictif.
- source_word: לִי הוּא
  choice: il m’appartient
  rationale: La proposition finale affirme l’appartenance à Dieu. Cette formulation est concise et idiomatique en français.
theological_decisions:
- issue: Emploi collectif de אָדָם en contraste avec בְּהֵמָה
  choice: les humains
  alternative: l’être humain / l’homme
  rationale: Le singulier hébreu représente la catégorie humaine entière, opposée à la catégorie animale. Le pluriel collectif français transmet cette portée sans restreindre le référent aux personnes de sexe masculin.
- issue: Sexe du premier-né
  choice: Ne pas ajouter « mâle »
  alternative: tout premier-né mâle
  rationale: Même si les dispositions juridiques voisines peuvent expliciter les mâles, ce verset ne comporte aucun terme signifiant « mâle ». La traduction préserve cette formulation sans la préciser au-delà du texte.
translation_notes:
  register: Français international moderne, clair et digne. « Sein maternel » conserve l’image anatomique de l’hébreu sans recourir au terme plus archaïque « matrice ». La répétition de « tout » maintient la portée distributive des deux occurrences de כָל.
