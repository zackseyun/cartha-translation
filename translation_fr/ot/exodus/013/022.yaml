  yaml_path: translation/ot/exodus/013/022.yaml
  text: The pillar of cloud by day and the pillar of fire by night did not depart from before the people[a].
translation:
  language: fr
  text: La colonne de nuée, le jour, et la colonne de feu, la nuit, ne se retiraient pas de devant le peuple[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne s’éloignaient pas de devant le peuple ». Le verbe hébreu souligne que les colonnes demeuraient continuellement présentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִישׁ
  choice: ne se retiraient pas
  rationale: Le verbe מוּשׁ exprime l’éloignement ou le retrait. L’imparfait français rend ici la présence continue des deux manifestations dans le récit, tandis que le pluriel suit naturellement le sujet composé.
- source_word: עַמּוּד
  choice: colonne
  rationale: « Colonne » décrit naturellement en français une forme verticale et convient à la manifestation de nuée comme à celle de feu.
- source_word: הֶעָנָן
  choice: nuée
  rationale: « Nuée » est un mot français digne et courant dans le registre biblique pour une masse nuageuse visible; il maintient l’image concrète sans l’expliquer.
- source_word: יוֹמָם
  choice: le jour
  rationale: L’expression adverbiale indique la période diurne et forme un parallélisme français naturel avec « la nuit ».
- source_word: וְעַמּוּד הָאֵשׁ
  choice: et la colonne de feu
  rationale: Cette formulation conserve le parallélisme concret de l’hébreu avec « la colonne de nuée ».
- source_word: לָיְלָה
  choice: la nuit
  rationale: Employé adverbialement, le nom désigne la période nocturne et répond avec concision à « le jour ».
- source_word: לִפְנֵי
  choice: de devant
  rationale: 'Avec le verbe de retrait, cette expression préserve la relation spatiale: les colonnes ne s’éloignaient pas de leur position devant le peuple.'
- source_word: הָעָם
  choice: le peuple
  rationale: Le singulier collectif défini désigne ici le peuple d’Israël comme un ensemble.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve le parallélisme hébreu entre le jour et la nuit. « Nuée » maintient la coloration biblique tout en restant intelligible; la note explicite l’autre nuance possible du verbe sans résoudre l’image au-delà du texte.
