- from: Tu mettras à part pour Yahweh tout être qui ouvre le sein maternel[a]. Quant à tout premier produit du bétail que tu posséderas, les mâles appartiendront à Yahweh[b].
  to: Tu mettras à part pour Yahweh tout premier-né qui ouvre le sein maternel[a] ; et, parmi les premiers-nés de ton bétail, les mâles appartiendront à Yahweh[b].
  rationale: La révision remplace « premier produit du bétail » par « premiers-nés de ton bétail », expression française plus naturelle qui désigne sans ambiguïté les petits animaux nés les premiers. Elle améliore également la première expression tout en conservant l’image hébraïque dans le texte et dans la note. La dislocation finale maintient la précision source selon laquelle les mâles sont à Yahweh.
