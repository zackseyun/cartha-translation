  yaml_path: translation/ot/exodus/013/012.yaml
  text: you shall set apart to Yahweh every one that opens the womb[b][a], and every male firstborn of the livestock that you have belongs to Yahweh.
translation:
  language: fr
  text: Tu mettras à part pour Yahweh tout premier-né qui ouvre le sein maternel[a] ; et, parmi les premiers-nés de ton bétail, les mâles appartiendront à Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tout ce qui ouvre le sein ». Cette expression désigne le premier-né.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « tout ouvreur de rejeton du bétail qui sera à toi ». Il s’agit des premières naissances du bétail ; le texte précise que les mâles appartiennent à Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: Tu mettras à part
  rationale: Le hiphil de עבר signifie littéralement « faire passer », mais, dans ce contexte cultuel, il exprime le transfert ou la consécration à Yahweh. « Mettre à part » en rend clairement la portée sans ajouter l’idée plus précise d’un rite particulier.
- source_word: פֶּטֶר רֶחֶם
  choice: tout être qui ouvre le sein maternel
  rationale: Cette formulation conserve l’image hébraïque de « celui qui ouvre le sein » et désigne le premier-né, sans réduire d’emblée l’expression à une catégorie que le texte ne précise qu’ensuite.
- source_word: לַיהוָה
  choice: pour Yahweh / à Yahweh
  rationale: Le nom divin יהוה est translittéré « Yahweh ». La première occurrence marque la destination de la mise à part ; la seconde, l’appartenance consacrée.
- source_word: פֶּטֶר שֶׁגֶר בְּהֵמָה
  choice: tout premier produit du bétail
  rationale: שֶׁגֶר désigne la progéniture ou le produit de la mise bas. « Premier produit du bétail » garde ce sens animal et la notion de première naissance, tout en restant intelligible en français.
- source_word: אֲשֶׁר יִהְיֶה לְךָ
  choice: que tu posséderas
  rationale: La proposition indique que le bétail est en possession du destinataire. Le futur s’accorde avec la portée prescriptive de la phrase.
- source_word: הַזְּכָרִים
  choice: les mâles
  rationale: Le pluriel défini désigne, parmi les premiers produits mentionnés, ceux de sexe mâle. Le maintien d’une proposition distincte respecte la structure hébraïque.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Portée de la consécration dans la seconde proposition
  choice: les mâles appartiendront à Yahweh
  alternative: tout premier-né mâle du bétail sera pour Yahweh
  rationale: La formulation retenue garde la reprise hébraïque « les mâles, à Yahweh » et évite de fondre silencieusement cette précision dans le groupe nominal précédent.
translation_notes:
  register: Français international moderne, clair et digne. « Sein maternel » évite l’ambiguïté moderne de « sein » employé seul. La seconde phrase conserve la légère dislocation de l’hébreu afin de ne pas effacer la précision finale portant sur les mâles.
