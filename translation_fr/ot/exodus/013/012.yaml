  source_fidelity: 'La structure essentielle est conservée : consécration de tout « ouvreur de sein » à Yahweh, puis précision que les mâles parmi les premières naissances du bétail lui appartiennent. Toutefois, « premier produit du bétail » est moins exact et peut évoquer un produit non animal ; « premier-né » rend plus directement פֶּטֶר, tandis que la note préserve l’idiome hébreu.'
  naturalness: « Tout être qui ouvre le sein maternel » est compréhensible, mais peu idiomatique en français moderne, car il présente l’enfant comme l’agent qui ouvre. « Tout premier-né qui ouvre le sein maternel » est plus naturel dans un registre biblique moderne et demeure suffisamment proche de l’expression source. La formulation révisée rend aussi plus nettement la portée de « les mâles ».
  terminology: « Yahweh » est conforme à la décision fournie. « Mettre à part » convient au sens cultuel de וְהַעֲבַרְתָּ sans imposer un rite précis. « Premier-né » convient ici mieux que « premier produit », tout en explicitant en note le sens littéral de l’expression hébraïque.
