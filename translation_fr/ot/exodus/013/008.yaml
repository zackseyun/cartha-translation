base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/008.yaml
  text: And you shall tell your son on that day[a], saying, ‘It is because of this that Yahweh acted for me when I came out of Egypt.’
translation:
  language: fr
  text: 'Tu diras à ton fils, ce jour-là : « C’est à cause de cela que Yahweh a agi pour moi lorsque je suis sorti d’Égypte. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Yahweh a fait cela pour moi lorsque je suis sorti d’Égypte. » En hébreu, « cela » peut se rattacher soit à la raison de cette observance, soit plus directement à ce que Yahweh a fait.'
    reason: ambiguïté syntaxique et lexicale
lexical_decisions:
- source_word: וְהִגַּדְתָּ
  choice: Tu raconteras
  rationale: Le hifil de נגד signifie ici raconter, déclarer ou faire connaître. « Raconter » convient naturellement à la transmission à un fils du sens de la célébration.
- source_word: לְבִנְךָ
  choice: à ton fils
  rationale: Le nom hébreu est masculin singulier et ל marque le destinataire; la formulation conserve ces deux éléments.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Expression temporelle française naturelle qui maintient la valeur démonstrative de l’hébreu.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif introduit les paroles rapportées. En français, les deux-points remplissent cette fonction plus naturellement qu’un participe tel que « en disant ».
- source_word: בַּעֲבוּר זֶה
  choice: C’est à cause de cela
  rationale: Cette tournure rend la valeur causale de בַּעֲבוּר tout en conservant le démonstratif זֶה et son ambiguïté référentielle.
- source_word: עָשָׂה יְהוָה לִי
  choice: Yahweh a agi pour moi
  rationale: עשה est employé sans objet exprimé. « A agi pour moi » évite d’ajouter explicitement « cela » tout en exprimant l’intervention en faveur du locuteur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin conserve le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בְּצֵאתִי מִמִּצְרָיִם
  choice: lorsque je suis sorti d’Égypte
  rationale: Le ב préfixé à l’infinitif construit exprime ici la circonstance temporelle; la traduction maintient également la première personne du singulier.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le Tétragramme comme nom propre. « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Terme filial masculin בֵּן
  choice: ton fils
  alternative: ton enfant
  rationale: L’hébreu emploie le masculin singulier dans cette instruction de transmission; le conserver évite de neutraliser une précision explicite du texte.
- issue: Rapport syntaxique de בַּעֲבוּר זֶה
  choice: « cela » désigne la raison liée à l’observance, sans expliciter davantage son référent
  alternative: « Yahweh a fait cela pour moi »
  rationale: La syntaxe hébraïque permet de rattacher « cela » soit à la raison de l’observance, soit plus directement à l’action de Yahweh. Le texte principal garde la première construction et la note signale l’autre.
translation_notes:
  register: Français international actuel, digne et accessible. Le futur simple exprime l’instruction, tandis que les deux-points allègent la construction hébraïque introduite par לֵאמֹר. L’ambiguïté du démonstratif est conservée et documentée.
