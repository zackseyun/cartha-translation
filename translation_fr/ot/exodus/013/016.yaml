source:
  edition: WLC
  text: וְ/הָיָ֤ה לְ/אוֹת֙ עַל יָ֣דְ/כָ֔ה וּ/לְ/טוֹטָפֹ֖ת בֵּ֣ין עֵינֶ֑י/ךָ כִּ֚י בְּ/חֹ֣זֶק יָ֔ד הוֹצִיאָ֥/נוּ יְהוָ֖ה מִ/מִּצְרָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/016.yaml
  text: And it shall be as a sign on your hand and as frontlets between your eyes[b][a], for with a strong hand Yahweh brought us out from Egypt.
translation:
  language: fr
  text: Ce sera un signe sur ta main et comme des bandeaux entre tes yeux[a][b], car c’est d’une main forte que Yahweh nous a fait sortir d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « marques frontales » ; traditionnellement « phylactères ». Le terme hébreu est rare et désigne probablement quelque chose que l’on portait sur le front comme rappel.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « entre tes yeux », expression souvent comprise au sens de « sur ton front ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Ce sera
  rationale: Le parfait qal précédé de la conjonction a ici une valeur future ou résultative et présente la fonction durable de ce qui précède.
- source_word: לְאוֹת
  choice: un signe
  rationale: אוֹת désigne couramment un signe ou un symbole visible ; « signe » reste naturel et suffisamment large.
- source_word: עַל יָדְכָה
  choice: sur ta main
  rationale: La formulation conserve le mot hébreu « main » plutôt que de l’interpréter comme « bras ».
- source_word: וּלְטוֹטָפֹת
  choice: comme des bandeaux
  rationale: Le terme rare טוֹטָפֹת semble désigner des objets portés sur le front comme rappel. « Bandeaux » demeure concret et compréhensible, tandis qu’une note signale l’incertitude lexicale et l’appellation traditionnelle.
- source_word: בֵּין עֵינֶיךָ
  choice: entre tes yeux
  rationale: La traduction littérale préserve l’image hébraïque ; l’interprétation « sur ton front » est donnée en note.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif du signe et se rend naturellement par « car » dans ce registre.
- source_word: בְּחֹזֶק יָד
  choice: d’une main forte
  rationale: Cette tournure française conserve l’image de la main et exprime la puissance de l’action divine sans l’expliciter davantage que l’hébreu.
- source_word: הוֹצִיאָנוּ
  choice: nous a fait sortir
  rationale: Le hiphil de יצא exprime l’action causative de faire sortir, rendue ici directement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: מִמִּצְרָיִם
  choice: d’Égypte
  rationale: Avec « faire sortir », cette formulation est idiomatique en français et correspond au sens de la préposition hébraïque.
theological_decisions:
- issue: Faut-il interpréter les expressions concernant la main et les yeux comme des objets rituels précis ?
  choice: Conserver dans le texte l’image concrète de la main et des bandeaux « entre les yeux ».
  alternative: Employer directement « phylactères » ou reformuler comme un simple rappel symbolique.
  rationale: L’hébreu ne nomme pas explicitement la pratique juive ultérieure et laisse ouverte la portée littérale, symbolique, ou les deux. Le texte principal préserve donc cette tension, et les notes indiquent les principales possibilités.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier suit les formes hébraïques de deuxième personne. La syntaxe reste proche de l’image source tout en étant naturelle en français.
