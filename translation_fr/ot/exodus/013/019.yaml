  verdict: revise
  source_fidelity: 'Le sens général est fidèle : Moïse prend les ossements de Joseph, en exécution du serment imposé aux fils d’Israël; פקד est bien rendu comme une intervention divine certaine et favorable. Toutefois, « avait fait prêter un serment » peut signifier en français qu’il avait chargé quelqu’un d’administrer le serment, plutôt qu’il avait fait jurer les fils d’Israël. Le verbe העליתם comporte en outre la nuance de faire monter, utile à conserver ici.'
  naturalness: Le registre est moderne et digne. « Avait solennellement fait jurer » est plus direct et idiomatique que « avait fait prêter un serment solennel ». « Vous ferez remonter mes ossements d’ici avec vous » préserve le mouvement du verbe hébreu sans archaïsme excessif.
  terminology: « Ossements », « fils d’Israël » et « Dieu » conviennent. La note doit présenter « visiter » comme une traduction possible de l’idiome plutôt que comme son sens littéral strict.
  issues:
  - severity: medium
    issue: « avait fait prêter un serment »
    rationale: Cette tournure peut évoquer l’administration d’un serment par un tiers. Le hiphil hébreu signifie que Joseph a fait jurer les fils d’Israël; la construction française explicite doit conserver ce rapport causatif.
  - severity: low
    issue: « vous emporterez » atténue la direction de וְהַעֲלִיתֶם
    rationale: Le verbe hiphil de עלה signifie littéralement faire monter/faire remonter. Une formulation française fluide peut conserver cette nuance.
  - severity: low
    issue: La note qualifie « Dieu vous visitera » de traduction « littérale »
    rationale: « Visiter » est une traduction lexicale traditionnelle possible de פקד dans cet idiome, mais ne constitue pas un littéralisme univoque; la note devrait préserver l’éventail sémantique sans le présenter ainsi.
