base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/019.yaml
  text: And Moses took Joseph’s bones with him[a], because Joseph had made the sons of Israel solemnly swear, saying, “God will surely attend to you, and you shall bring up my bones from here with you.”
translation:
  language: fr
  text: 'Moïse prit avec lui les ossements de Joseph, car celui-ci avait solennellement fait jurer les fils d’Israël en disant : « Dieu interviendra certainement en votre faveur[a], et vous ferez remonter mes ossements d’ici avec vous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Dieu s’occupera assurément de vous »; ou : « Dieu vous visitera certainement. » L’idiome hébreu exprime l’attention de Dieu se manifestant par une intervention décisive en faveur de son peuple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le qal narratif de לקח signifie normalement « prendre » ; « prit » est direct et naturel dans ce récit.
- source_word: עַצְמוֹת / עַצְמֹתַי
  choice: les ossements / mes ossements
  rationale: « Ossements » conserve le caractère concret du terme hébreu tout en convenant, en français actuel et digne, aux restes d’une personne décédée.
- source_word: עִמּוֹ / אִתְּכֶם
  choice: avec lui / avec vous
  rationale: Ces deux expressions marquent l’accompagnement. Leur répétition est conservée comme dans l’hébreu.
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  choice: avait fait prêter un serment solennel
  rationale: La construction causative renforcée par l’infinitif absolu exprime à la fois le fait de faire jurer et l’insistance solennelle.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Ce choix garde l’expression familiale explicite de l’hébreu, plutôt que de la remplacer par le terme collectif « Israélites ».
- source_word: פָּקֹד יִפְקֹד אֱלֹהִים אֶתְכֶם
  choice: Dieu interviendra certainement en votre faveur
  rationale: Le redoublement verbal marque la certitude, tandis que פקד évoque ici une attention divine qui débouche sur une action décisive. La formulation française exprime cette intervention sans en préciser indûment les modalités.
- source_word: וְהַעֲלִיתֶם
  choice: et vous emporterez
  rationale: Dans le cadre du serment, le parfait a une valeur future et obligatoire. « Emporterez » rend naturellement le déplacement des ossements hors d’Égypte ; la direction ascendante implicite dans עלה est difficile à conserver ici sans lourdeur.
- source_word: מִזֶּה
  choice: d’ici
  rationale: L’expression déictique désigne le lieu présent, l’Égypte, et se rend naturellement par « d’ici ».
theological_decisions:
- issue: Portée de la formule פָּקֹד יִפְקֹד
  choice: Dieu interviendra certainement en votre faveur
  alternative: Dieu vous visitera certainement
  rationale: Le sens contextuel inclut la sollicitude, la prise en compte et l’intervention de Dieu en faveur de son peuple. Le texte principal communique cette portée en français moderne, tandis que la note conserve l’image plus littérale et son ambiguïté.
- issue: Désignation בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: La formulation retenue préserve l’idiome généalogique du texte source sans ajouter de précision doctrinale.
- issue: Force de וְהַעֲלִיתֶם dans le serment
  choice: vous emporterez
  alternative: vous devrez emporter
  rationale: Le futur français garde ensemble la prédiction et l’obligation issue du serment, sans trancher artificiellement entre ces deux nuances.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement narratif hébreu, tout en évitant les tournures archaïques. « Ossements » convient mieux que « os » au registre funéraire, et « celui-ci » évite de répéter inutilement le nom de Joseph.
