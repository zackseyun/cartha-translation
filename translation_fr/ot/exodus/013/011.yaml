  text: וְ/הָיָ֞ה כִּֽי יְבִֽאֲ/ךָ֤ יְהוָה֙ אֶל אֶ֣רֶץ הַֽ/כְּנַעֲנִ֔י כַּ/אֲשֶׁ֛ר נִשְׁבַּ֥ע לְ/ךָ֖ וְ/לַֽ/אֲבֹתֶ֑י/ךָ וּ/נְתָנָ֖/הּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/011.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], as he swore to you and to your fathers, and gives it to you[b],
translation:
  language: fr
  text: Quand Yahweh t’aura fait entrer dans le pays des Cananéens[a], comme il te l’a juré, ainsi qu’à tes pères[b], et qu’il te l’aura donné,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Et il arrivera que, lorsque ». La traduction emploie simplement « Quand » pour rendre l’idiome.'
    reason: lexical_alternative
  - marker: b
    text: Ou « à tes ancêtres » ; l’hébreu dit littéralement « à tes pères ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Quand
  rationale: Cette tournure introduit une circonstance future. « Quand » en restitue naturellement la valeur temporelle en français moderne, sans reprendre littéralement l’idiome hébreu « et il arrivera que ».
- source_word: יְבִיאֲךָ
  choice: t’aura fait entrer
  rationale: Le hifil de בוא signifie « faire venir, faire entrer ». Après « quand », le futur antérieur français exprime naturellement l’accomplissement futur préalable à l’action principale du contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי
  choice: dans le pays des Cananéens
  rationale: Avec le verbe causatif de mouvement, אֶל indique l’entrée dans le territoire. Le gentilé collectif singulier hébreu est rendu idiomatiquement par le pluriel français « des Cananéens ».
- source_word: כַּאֲשֶׁר נִשְׁבַּע
  choice: comme il l’a juré
  rationale: « Comme » conserve le rapport avec le serment antérieur, et le passé composé rend naturellement en français l’acte déjà accompli.
- source_word: לְךָ וְלַאֲבֹתֶיךָ
  choice: à toi et à tes pères
  rationale: La répétition de la préposition est conservée, ainsi que l’image masculine explicite de l’hébreu. Une note signale le sens possible plus large d’« ancêtres ».
- source_word: וּנְתָנָהּ לָךְ
  choice: et qu’il te l’aura donné
  rationale: La proposition poursuit la circonstance future introduite par « quand ». Le pronom « l’ » renvoie au pays, et le futur antérieur s’accorde avec « t’aura fait entrer ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve comme nom personnel sans le remplacer par un titre ni adopter la forme traditionnelle plus tardive « Jéhovah ».
- issue: Portée de אֲבֹתֶיךָ
  choice: tes pères
  alternative: tes ancêtres
  rationale: « Tes pères » traduit formellement le terme hébreu et maintient le lien avec les patriarches, tandis que la note préserve la possibilité du sens généalogique plus général.
translation_notes:
  register: Français international moderne, digne et fluide. Le futur antérieur rend clairement le cadre prospectif de la phrase, qui se poursuit au verset suivant. La structure du serment et le nom divin restent explicites.
