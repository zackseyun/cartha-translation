  yaml_path: translation/ot/exodus/013/020.yaml
  text: They set out from Succoth and camped at Etham, on the edge of the wilderness.
translation:
  language: fr
  text: Ils partirent de Soukkoth et campèrent à Étam, à la lisière du désert.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Ils partirent
  rationale: 'Le verbe נסע au wayyiqtol pluriel décrit l’action narrative suivante : lever le camp et reprendre la route. « Partirent » est naturel en français moderne et exprime clairement le déplacement.'
- source_word: מִסֻּכֹּת
  choice: de Soukkoth
  rationale: Le préfixe מִן indique la provenance. Le nom de lieu est translittéré selon une forme française qui rend la consonne redoublée.
- source_word: וַיַּחֲנוּ
  choice: et campèrent
  rationale: Le verbe חנה signifie « camper, établir son camp ». « Campèrent » est direct, courant et adapté au récit de voyage.
- source_word: בְאֵתָם
  choice: à Étam
  rationale: La préposition בְ a ici une valeur locative. « À Étam » est l’expression française naturelle pour une étape géographique.
- source_word: בִּקְצֵה
  choice: à la lisière de
  rationale: קָצֶה désigne l’extrémité, le bord ou la limite. Dans ce contexte géographique, « à la lisière de » rend naturellement l’idée d’une position en bordure.
- source_word: הַמִּדְבָּר
  choice: du désert
  rationale: מִדְבָּר désigne une région inhabitée ou aride, sans impliquer nécessairement une étendue de sable. En français biblique moderne, « désert » est idiomatique et suffisamment large dans ce contexte.
