  yaml_path: translation/ot/exodus/013/006.yaml
  text: For seven days you shall eat unleavened bread[b][a], and on the seventh day there shall be a feast to Yahweh.
translation:
  language: fr
  text: Pendant sept jours, tu mangeras du pain sans levain, et le septième jour, il y aura une fête en l’honneur de Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, le nom divin rendu ici par « Yahweh ». Dans les traductions françaises traditionnelles, il est souvent rendu par « le Seigneur » ou « l’Éternel ».'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Pendant sept jours
  rationale: Le groupe construit exprime une durée ; « Pendant sept jours » en rend explicitement la valeur dans un français naturel.
- source_word: תֹּאכַל
  choice: tu mangeras
  rationale: L’imparfait hébreu à la deuxième personne du masculin singulier a ici une valeur directive. Le futur français conserve le ton solennel de l’instruction sans le renforcer par « tu dois ».
- source_word: מַצֹּת
  choice: du pain sans levain
  rationale: Dans ce contexte pascal, le pluriel hébreu désigne les pains non levés comme aliment ; cette formulation est claire, usuelle et idiomatique en français.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: et le septième jour
  rationale: Le waw est simplement coordonnant, et la tournure française marque naturellement le moment sans qu’il soit nécessaire d’ajouter « pendant » ou « au ».
- source_word: חַג
  choice: une fête
  rationale: Le nom désigne une célébration cultuelle, parfois liée à un pèlerinage. « Fête » est ici plus naturel et digne que « festival » en français biblique moderne.
- source_word: לַיהוָה
  choice: en l’honneur de Yahweh
  rationale: La préposition ל indique ici que la fête est consacrée ou adressée à Yahweh. « En l’honneur de » exprime naturellement cette relation en français sans réduire le sens à une simple possession.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme, nom d’alliance de Dieu. « Yahweh » le représente dans le texte principal, tandis qu’une note signale le rendu traditionnel.
- issue: Relation exprimée par ל dans לַיהוָה
  choice: une fête en l’honneur de Yahweh
  alternative: une fête pour Yahweh
  rationale: La préposition peut exprimer la destination, la consécration ou la relation. « En l’honneur de » garde la portée cultuelle sans préciser davantage la nature exacte de la célébration.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement singulier reflète la deuxième personne masculine singulière de l’hébreu, qui s’adresse ici à chaque membre du peuple. La syntaxe reste proche de l’original tout en étant idiomatique.
