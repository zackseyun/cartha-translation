id: EZK.26.21
reference: Ezekiel 26:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בַּלָּה֥וֹת אֶתְּנֵ֖/ךְ וְ/אֵינֵ֑/ךְ וּֽ/תְבֻקְשִׁ֗י וְ/לֹֽא תִמָּצְאִ֥י עוֹד֙ לְ/עוֹלָ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/021.yaml
  text: I will make you a terror[a], and you will be no more. Though you are sought, you will never again be found[b], declares the Lord GOD.
translation:
  language: fr
  text: Je ferai de toi un objet d’épouvante, et tu ne seras plus. On te cherchera, mais on ne te trouvera plus jamais[a], déclare le Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « et tu seras recherchée, et tu ne seras plus jamais trouvée ».'
    reason: La suite des propositions hébraïques peut être rendue comme une simple coordination plutôt que par le contraste explicite « mais ».
lexical_decisions:
- source_word: בַּלָּהוֹת
  choice: un objet d’épouvante
  rationale: Le pluriel hébreu peut avoir une valeur intensive ou abstraite. Cette expression naturelle en français présente Tyr comme une réalité qui inspire l’épouvante, sans imposer le pluriel peu idiomatique « des terreurs ».
- source_word: אֶתְּנֵךְ
  choice: Je ferai de toi
  rationale: Avec un nom attribut, נתן (« donner ») prend ici le sens idiomatique de « faire de » quelqu’un ou quelque chose.
- source_word: וְאֵינֵךְ
  choice: et tu ne seras plus
  rationale: La proposition nominale négative exprime la disparition ou la cessation de présence de Tyr. Le français conserve la formulation concise de l’hébreu.
- source_word: וּתְבֻקְשִׁי
  choice: On te cherchera
  rationale: La forme passive hébraïque est rendue par le « on » indéfini, plus naturel en français que « tu seras recherchée », sans préciser l’identité de ceux qui chercheront.
- source_word: וְלֹא תִמָּצְאִי עוֹד לְעוֹלָם
  choice: mais on ne te trouvera plus jamais
  rationale: Le nifal de מצא est passif. La tournure française avec « on » maintient le même agent indéfini, tandis que « plus jamais » exprime naturellement la force cumulée de עוֹד et לְעוֹלָם.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclare le Seigneur Yahweh
  rationale: נְאֻם introduit une déclaration solennelle. « Le Seigneur Yahweh » distingue le titre אֲדֹנָי du nom divin יְהוִה et évite la répétition artificielle « le Seigneur, le SEIGNEUR ».
theological_decisions:
- issue: Rendu du nom divin יְהוִה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte associe le titre אֲדֹנָי au nom propre divin יְהוִה. Conserver « Yahweh » rend visible cette distinction et ne remplace pas le nom par un second titre.
- issue: Rapport entre la recherche de Tyr et l’impossibilité de la trouver
  choice: On te cherchera, mais on ne te trouvera plus jamais
  alternative: Et tu seras recherchée, et tu ne seras plus jamais trouvée
  rationale: Le contraste est fortement suggéré par le sens de la séquence, mais les conjonctions hébraïques restent formellement coordonnées. La note conserve cette possibilité syntaxique sans modifier le sens général du jugement.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement féminin renvoie à Tyr, personnifiée comme une ville. « Objet d’épouvante » évite un calque maladroit tout en gardant la force du pluriel intensif hébreu.
