source:
  edition: WLC
  text: וְ/הִשְׁבַּתִּ֖י הֲמ֣וֹן שִׁירָ֑יִ/ךְ וְ/ק֣וֹל כִּנּוֹרַ֔יִ/ךְ לֹ֥א יִשָּׁמַ֖ע עֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/013.yaml
  text: And I will put an end to the noise of your songs[a], and the sound of your lyres will be heard no more.
translation:
  language: fr
  text: Je mettrai fin au tumulte de tes chants, et le son de tes lyres[a] ne se fera plus entendre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « harpes ». Le mot hébreu כִּנּוֹר désigne un instrument à cordes, souvent identifié comme une lyre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: Je mettrai fin à
  rationale: Le hiphil de שׁבת exprime ici une cessation provoquée et décisive. « Mettre fin à » rend naturellement cette valeur causative en français moderne.
- source_word: הֲמוֹן
  choice: au tumulte
  rationale: Dans ce contexte musical, הֲמוֹן désigne une abondance sonore, un bruit animé, plutôt qu’une multitude numérique. « Tumulte » conserve l’intensité du terme sans suggérer que les chants ne seraient que du bruit informe.
- source_word: שִׁירָיִךְ
  choice: de tes chants
  rationale: Le pluriel muni du suffixe féminin singulier renvoie aux chants de Tyr, ville personnifiée et directement interpellée.
- source_word: וְקוֹל
  choice: et le son de
  rationale: Avec un instrument, קוֹל se rend naturellement par « son » plutôt que par « voix ».
- source_word: כִּנּוֹרַיִךְ
  choice: tes lyres
  rationale: כִּנּוֹר désigne un instrument à cordes généralement identifié comme une lyre. Ce choix est plus précis que le traditionnel « harpe », tout en restant compréhensible.
- source_word: לֹא יִשָּׁמַע עוֹד
  choice: ne se fera plus entendre
  rationale: La forme niphal de שׁמע a ici un sens passif, « être entendu », tandis que עוֹד marque la cessation définitive. La tournure retenue est idiomatique et garde cette nuance.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme sonore entre le tumulte des chants et le son des instruments est conservé. Le tutoiement féminin singulier correspond à l’adresse prophétique à Tyr personnifiée.
