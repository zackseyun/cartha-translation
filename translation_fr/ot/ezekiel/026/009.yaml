  text: He will direct the blow of his battering ram against your walls[a], and with his axes he will tear down your towers.
translation:
  language: fr
  text: Il portera le coup de son bélier contre tes murailles et abattra tes tours avec ses épées[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « avec ses haches » ou « avec ses outils de fer », si le terme désigne ici plus généralement des instruments de démolition employés lors d’un siège.'
    reason: Alternative lexicale motivée par le contexte, puisque le texte massorétique se lit normalement « avec ses épées ».
lexical_decisions:
- source_word: מְחִי
  choice: le coup
  rationale: Le nom désigne un coup ou un impact. Le singulier français conserve celui de l’hébreu et convient à l’action d’un bélier.
- source_word: קָבַלּוֹ
  choice: son bélier
  rationale: Dans ce contexte de siège, le terme désigne un engin servant à frapper les murailles ; « bélier » est précis et immédiatement compréhensible.
- source_word: יִתֵּן
  choice: portera
  rationale: Le verbe signifie littéralement « donner, placer ». Dans l’expression française « porter un coup », ce choix rend naturellement l’action exercée contre la muraille sans effacer l’image hébraïque.
- source_word: בְּחֹמוֹתַיִךְ
  choice: contre tes murailles
  rationale: Avec l’idée de frapper, la préposition exprime ici l’impact hostile contre les fortifications. « Murailles » convient mieux que « murs » au contexte d’une ville assiégée.
- source_word: וּמִגְדְּלֹתַיִךְ
  choice: tes tours
  rationale: Le nom désigne les tours défensives de la ville ; la traduction directe est claire.
- source_word: יִתֹּץ
  choice: abattra
  rationale: Le verbe signifie démolir ou renverser. « Abattre » est naturel, vigoureux et adapté à la destruction de tours.
- source_word: בְּחַרְבוֹתָיו
  choice: avec ses épées
  rationale: Le texte massorétique porte le pluriel de חֶרֶב, dont le sens usuel est « épée ». La difficulté contextuelle — des tours abattues avec des épées — est conservée dans le texte et signalée en note plutôt que résolue silencieusement.
