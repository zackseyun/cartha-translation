source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֥י עָלַ֖יִ/ךְ צֹ֑ר וְ/הַעֲלֵיתִ֤י עָלַ֨יִ/ךְ֙ גּוֹיִ֣ם רַבִּ֔ים כְּ/הַעֲל֥וֹת הַ/יָּ֖ם לְ/גַלָּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/003.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am against you, Tyre, and I will bring up many nations against you, as the sea brings up its waves.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit le Seigneur Yahweh[a] : Me voici contre toi, Tyr ! Je ferai monter contre toi de nombreuses nations, comme la mer fait monter ses vagues.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « le Seigneur Yahweh » (אֲדֹנָי יְהוִה), titre qui associe אֲדֹנָי (« Seigneur ») au nom divin יהוה (« Yahweh »).'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit la conséquence du motif de jugement énoncé dans le contexte précédent, dans un français naturel et soutenu.
- source_word: כֹּה אָמַר
  choice: voici ce que dit
  rationale: Rend naturellement en français moderne la formule prophétique consacrée, sans archaïsme.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Représente distinctement le titre אֲדֹנָי et le nom divin יהוה, tout en évitant la répétition « le Seigneur SEIGNEUR ».
- source_word: הִנְנִי עָלַיִךְ
  choice: Me voici contre toi
  rationale: Conserve la force emphatique de הִנְנִי et le sens hostile de la préposition dans ce contexte de jugement.
- source_word: צֹר
  choice: Tyr
  rationale: Forme française traditionnelle et courante du nom de la ville.
- source_word: וְהַעֲלֵיתִי עָלַיִךְ
  choice: Je ferai monter contre toi
  rationale: Préserve le sens causatif du hiphil de עלה ainsi que son écho avec l’image des vagues dans la proposition suivante.
- source_word: גּוֹיִם רַבִּים
  choice: de nombreuses nations
  rationale: Désigne ici plusieurs entités étrangères venant attaquer Tyr ; « nations » convient au contexte international et militaire.
- source_word: כְּהַעֲלוֹת הַיָּם לְגַלָּיו
  choice: comme la mer fait monter ses vagues
  rationale: Reproduit l’image du mouvement des vagues et le parallèle verbal avec « Je ferai monter ».
theological_decisions:
- issue: Rendu du nom divin יהוה dans le titre composé אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte hébreu associe le titre אֲדֹנָי au nom propre divin יהוה. « Yahweh » conserve explicitement ce nom et la note signale la forme source, sans imposer une interprétation confessionnelle.
translation_notes:
  register: Français moderne, international et digne. La formule « voici ce que dit » garde la solennité prophétique dans une tournure actuelle ; « Me voici contre toi » préserve l’emphase et la menace du texte hébreu.
