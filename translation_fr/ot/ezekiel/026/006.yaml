base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/006.yaml
  text: And her daughters who are in the field will be killed by the sword[b][a], and they will know that I am Yahweh.
translation:
  language: fr
  text: Ses filles qui sont dans la campagne[a] seront tuées par l’épée, et ils sauront que je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « dans le champ ». Les « filles » désignent probablement les villes ou localités dépendantes de Tyr, situées sur le continent ou dans la campagne.
    reason: Précision lexicale et géographique sur וּבְנוֹתֶיהָ אֲשֶׁר בַּשָּׂדֶה.
lexical_decisions:
- source_word: וּבְנוֹתֶיהָ
  choice: ses filles
  rationale: Le sens littéral est « ses filles ». Dans l’usage géographique et prophétique, il s’agit vraisemblablement des localités dépendant de Tyr; l’image hébraïque est conservée dans le texte et explicitée en note.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: qui sont dans la campagne
  rationale: Le syntagme signifie littéralement « qui sont dans le champ ». Ici, « dans la campagne » est plus naturel en français et peut désigner les localités situées hors de la cité insulaire, probablement sur le continent.
- source_word: בַּחֶרֶב
  choice: par l’épée
  rationale: Cette tournure française conserve la valeur instrumentale de l’expression hébraïque et son image conventionnelle de mort violente à la guerre.
- source_word: תֵּהָרַגְנָה
  choice: seront tuées
  rationale: Le nifal inaccompli à la troisième personne du féminin pluriel exprime ici un passif futur; « seront tuées » est direct et actuel.
- source_word: וְיָדְעוּ
  choice: et l’on saura
  rationale: Le verbe est formellement au pluriel sans antécédent masculin pluriel explicite dans ce verset. La tournure impersonnelle française préserve cette référence ouverte plutôt que de rattacher artificiellement le sujet aux « filles », qui sont féminines en hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit comme nom propre plutôt que remplacé par un titre.
theological_decisions:
- issue: Référent de « ses filles » dans l’oracle contre Tyr
  choice: Conserver « ses filles » dans le texte, avec une note indiquant les villes ou localités dépendantes de Tyr.
  alternative: Traduire directement « ses villes dépendantes » ou « ses villages ».
  rationale: L’usage prophétique permet de comprendre les « filles » comme des communautés rattachées à une ville mère. Le maintien de la métaphore préserve la forme du texte sans dissimuler son sens géographique probable.
- issue: Sujet de וְיָדְעוּ (« ils sauront »)
  choice: Employer l’impersonnel « l’on saura ».
  alternative: « Ils sauront » ou « elles sauront ».
  rationale: La forme hébraïque est masculine plurielle, alors que « ses filles » et le verbe précédent sont féminins pluriels. L’impersonnel français conserve la portée indéterminée ou générale de la formule sans résoudre silencieusement cette tension grammaticale.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: Le SEIGNEUR ou Jéhovah
  rationale: La transcription maintient le caractère personnel du tétragramme dans le texte.
translation_notes:
  register: Français international moderne, sobre et digne. La métaphore « ses filles » est volontairement conservée; « dans la campagne » évite le calque peu naturel « dans le champ ». La formule finale emploie « l’on » afin de respecter l’indétermination du sujet masculin pluriel hébreu.
