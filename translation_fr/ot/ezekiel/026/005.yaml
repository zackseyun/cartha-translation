  text: מִשְׁטַ֨ח חֲרָמִ֤ים תִּֽהְיֶה֙ בְּ/ת֣וֹךְ הַ/יָּ֔ם כִּ֚י אֲנִ֣י דִבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה וְ/הָיְתָ֥ה לְ/בַ֖ז לַ/גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/005.yaml
  text: She will become a place for spreading nets in the midst of the sea[a], for I have spoken, declares the Lord GOD, and she will become plunder for the nations.
translation:
  language: fr
  text: Elle deviendra, au milieu de la mer, un lieu où l’on étend les filets[a], car moi, j’ai parlé — déclaration du Seigneur Yahweh —, et elle deviendra un butin pour les nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « une aire où l’on étend des filets de pêche ».

      '
    reason: Alternative lexicale permettant de rendre מִשְׁטַח comme une surface aménagée plutôt que comme un lieu exprimé par une proposition relative.
lexical_decisions:
- source_word: מִשְׁטַח חֲרָמִים
  choice: un lieu où l’on étend les filets
  rationale: Le nom מִשְׁטַח désigne un emplacement ou une surface où quelque chose est étendu. Avec חֲרָמִים, l’expression évoque un endroit servant à étendre des filets, vraisemblablement pour les faire sécher. Cette formulation est naturelle en français et conserve l’image concrète.
- source_word: בְּתוֹךְ הַיָּם
  choice: au milieu de la mer
  rationale: Traduction directe et idiomatique de la locution hébraïque, qui préserve le cadre maritime sans ajouter une précision absente du texte.
- source_word: כִּי אֲנִי דִבַּרְתִּי
  choice: car moi, j’ai parlé
  rationale: Le pronom explicite אֲנִי renforce le sujet; « moi » rend cette insistance. Le parfait « j’ai parlé » fonde la certitude de l’annonce sur la parole divine déjà prononcée.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: נְאֻם introduit solennellement un oracle divin. « Déclaration » conserve la forme nominale de la formule, tandis que « Yahweh » représente directement le nom divin après אֲדֹנָי.
- source_word: וְהָיְתָה לְבַז
  choice: et elle deviendra le butin
  rationale: 'La tournure avec לְ exprime le résultat: Tyr sera livrée comme butin. « Le butin » est naturel en français dans ce contexte de conquête.'
- source_word: לַגּוֹיִם
  choice: des nations
  rationale: גּוֹיִם désigne ici les peuples ou nations qui pilleront Tyr; « nations » évite une lecture théologique anachronique de « païens ».
- source_word: תִּהְיֶה ... וְהָיְתָה
  choice: Elle deviendra ... et elle deviendra
  rationale: Les deux formes féminines singulières renvoient à Tyr, ville personnifiée au féminin. Le pronom « elle » maintient cette cohérence littéraire en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte explicitement le tétragramme après אֲדֹנָי. « Yahweh » distingue le nom propre divin du titre « Seigneur » et évite la répétition « Seigneur Seigneur », sans résoudre autrement la tension du titre composé.
translation_notes:
  register: Français international moderne, digne et prophétique. La phrase conserve la répétition de « elle deviendra », l’insistance de « moi » et la personnification féminine de Tyr. Le tiret détache clairement la formule oraculaire sans archaïsme.
