  text: וְ/שָׁלְל֣וּ חֵילֵ֗/ךְ וּ/בָֽזְזוּ֙ רְכֻלָּתֵ֔/ךְ וְ/הָֽרְסוּ֙ חוֹמוֹתַ֔יִ/ךְ וּ/בָתֵּ֥י חֶמְדָּתֵ֖/ךְ יִתֹּ֑צוּ וַ/אֲבָנַ֤יִ/ךְ וְ/עֵצַ֨יִ/ךְ֙ וַֽ/עֲפָרֵ֔/ךְ בְּ/ת֥וֹךְ מַ֖יִם יָשִֽׂימוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/012.yaml
  text: They will plunder your wealth and loot your merchandise. They will tear down your walls and demolish your splendid houses. They will throw your stones[a], your timbers, and your dust into the midst of the waters.
translation:
  language: fr
  text: Ils pilleront tes richesses et s’empareront de tes marchandises. Ils abattront tes murailles et démoliront tes maisons magnifiques. Ils jetteront tes pierres, ton bois et ta poussière[a] au milieu des eaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi désigner la terre ou, dans ce contexte, les débris pulvérisés de la ville démolie.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלְלוּ
  choice: pilleront
  rationale: Le verbe désigne la prise de butin en contexte de guerre. « Piller » exprime clairement cette saisie violente.
- source_word: חֵילֵךְ
  choice: tes richesses
  rationale: חַיִל peut désigner la force, une armée ou les biens. Son association avec les marchandises et le contexte commercial de Tyr favorisent ici le sens économique.
- source_word: בָזְזוּ
  choice: s’empareront de
  rationale: Ce verbe évoque également le pillage. Cette formulation naturelle évite une répétition pesante tout en conservant l’idée de saisie violente.
- source_word: רְכֻלָּתֵךְ
  choice: tes marchandises
  rationale: Le nom désigne les biens destinés au commerce, lesquels peuvent concrètement être emportés.
- source_word: הָרְסוּ חוֹמוֹתַיִךְ
  choice: abattront tes murailles
  rationale: הרס décrit la destruction d’une construction; « abattre » convient à des murailles et « murailles » précise qu’il s’agit des défenses de la ville.
- source_word: בָתֵּי חֶמְדָּתֵךְ
  choice: tes maisons magnifiques
  rationale: L’expression désigne des maisons désirables, précieuses ou somptueuses. « Magnifiques » rend naturellement leur caractère remarquable.
- source_word: יִתֹּצוּ
  choice: démoliront
  rationale: נתץ signifie mettre en pièces ou abattre une construction. « Démolir » convient directement aux maisons.
- source_word: אֲבָנַיִךְ
  choice: tes pierres
  rationale: Il s’agit littéralement des pierres de la ville détruite.
- source_word: עֵצַיִךְ
  choice: tes charpentes
  rationale: Le mot désigne le bois; avec les pierres et la poussière provenant des bâtiments, « charpentes » rend clairement le bois de construction sans réduire le référent à de simples arbres.
- source_word: עֲפָרֵךְ
  choice: ta poussière
  rationale: Le sens premier est « poussière » ou « terre ». Le contexte permet d’y voir les débris pulvérisés de la ville, mais le texte retient le terme concret et imagé, avec une note explicative.
- source_word: בְּתוֹךְ מַיִם יָשִׂימוּ
  choice: jetteront … au milieu des eaux
  rationale: L’hébreu dit littéralement qu’ils placeront ces matériaux au milieu des eaux. « Jetteront » exprime naturellement le mouvement et l’évacuation des décombres, tandis que « au milieu des eaux » conserve le pluriel et l’image du texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier est conservé parce que l’oracle s’adresse à Tyr personnifiée. Les futurs maintiennent la perspective prophétique du passage, et les verbes concrets rendent la progression du pillage à la démolition puis au rejet des matériaux dans les eaux.
