source:
  edition: WLC
  text: כֹּ֥ה אָמַ֛ר אֲדֹנָ֥/י יְהוִ֖ה לְ/צ֑וֹר הֲ/לֹ֣א מִ/קּ֣וֹל מַפַּלְתֵּ֗/ךְ בֶּ/אֱנֹ֨ק חָלָ֜ל בֵּ/הָ֤רֵֽג הֶ֨רֶג֙ בְּ/תוֹכֵ֔/ךְ יִרְעֲשׁ֖וּ הָ/אִיִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/015.yaml
  text: 'Thus says the Lord GOD to Tyre: Will not the coastlands quake at the sound of your fall[a], when the wounded groan[b], when the slaughter is carried out in your midst?'
translation:
  language: fr
  text: 'Voici ce que dit le Seigneur Yahweh à Tyr : Au bruit de ta chute, quand les blessés[a] gémiront et qu’un massacre aura lieu au milieu de toi, les régions côtières[b] ne trembleront-elles pas ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot traduit par « blessés » peut aussi désigner les personnes transpercées ou tuées.
    reason: lexical_alternative
  - marker: b
    text: Ou « les îles ». Le terme hébreu peut désigner les îles ou, plus largement, les régions côtières et maritimes.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: « Seigneur » rend אֲדֹנָי, tandis que « Yahweh » représente le nom divin יהוה sans produire l’expression française maladroite « le Seigneur, le SEIGNEUR ».
- source_word: לְצוֹר
  choice: à Tyr
  rationale: Forme française usuelle du nom de la cité phénicienne.
- source_word: הֲלֹא
  choice: ne… pas ?
  rationale: La tournure interrogative négative conserve la question rhétorique qui appelle une réponse affirmative.
- source_word: מִקּוֹל מַפַּלְתֵּךְ
  choice: Au bruit de ta chute
  rationale: Rend directement l’idée du bruit provoqué par la chute de Tyr, tout en gardant l’adresse à la ville au féminin singulier.
- source_word: בֶּאֱנֹק
  choice: quand… gémiront
  rationale: Transforme naturellement en proposition temporelle l’infinitif exprimant le gémissement.
- source_word: חָלָל
  choice: les blessés
  rationale: Le terme désigne des personnes transpercées ou frappées, parfois les morts. Le contexte du gémissement favorise ici « les blessés », sans exclure des blessures mortelles.
- source_word: בֵּהָרֵג הֶרֶג
  choice: qu’un massacre aura lieu
  rationale: L’infinitif accompagné d’un nom de même racine souligne l’acte violent de tuer. Cette formulation française en restitue l’intensité sans reproduire une répétition artificielle.
- source_word: בְּתוֹכֵךְ
  choice: au milieu de toi
  rationale: Conserve la personnification de Tyr et la référence aux événements qui se déroulent dans la ville.
- source_word: יִרְעֲשׁוּ
  choice: trembleront
  rationale: Le verbe peut évoquer une secousse physique aussi bien que l’effroi suscité par le désastre.
- source_word: הָאִיִּים
  choice: les régions côtières
  rationale: Dans les textes prophétiques, le mot peut désigner les îles, mais aussi plus largement les territoires maritimes liés au monde de Tyr.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Cette formulation distingue le titre אֲדֹנָי du nom propre יהוה et rend explicitement le nom divin présent dans le texte hébreu.
- issue: Portée de la question rhétorique
  choice: conserver une interrogation négative
  alternative: formuler une affirmation avec « certainement »
  rationale: La forme interrogative hébraïque est maintenue afin de préserver sa force prophétique sans transformer la question en affirmation explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’adresse directe à Tyr, la question rhétorique et le mouvement du texte hébreu, tout en plaçant le sujet à la fin de façon naturelle en français.
