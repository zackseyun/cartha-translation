  variant: modern international French
source:
  edition: WLC
  text: בֶּן אָדָ֗ם יַ֠עַן אֲשֶׁר אָ֨מְרָה צֹּ֤ר עַל יְרוּשָׁלִַ֨ם֙ הֶאָ֔ח נִשְׁבְּרָ֛ה דַּלְת֥וֹת הָ/עַמִּ֖ים נָסֵ֣בָּה אֵלָ֑/י אִמָּלְאָ֖ה הָחֳרָֽבָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/002.yaml
  text: Son of man[a], because Tyre said concerning Jerusalem, ‘Aha! The gateway of the peoples is broken; it has turned to me. I will be filled[b], now that she is laid waste,’
translation:
  language: fr
  text: 'Fils d’homme, parce que Tyr a dit au sujet de Jérusalem : « Ah ! La porte des peuples[a] est brisée ! Elle s’est tournée vers moi. Je serai comblée[b], maintenant qu’elle est dévastée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les portes des peuples ». L’expression hébraïque est condensée et peut présenter Jérusalem comme un point d’accès pour de nombreux peuples.
    reason: lexical_alternative
  - marker: b
    text: Tyr espère tirer avantage de la chute de Jérusalem, notamment parce que les échanges ou les voies d’accès se reporteraient vers elle.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Formule d’adresse habituelle à Ézéchiel ; elle conserve l’expression hébraïque et sa répétition caractéristique dans le livre.
- source_word: יַעַן אֲשֶׁר
  choice: parce que
  rationale: Rend naturellement la valeur causale de la locution conjonctive.
- source_word: צֹּר
  choice: Tyr
  rationale: Forme française usuelle du nom de la ville.
- source_word: עַל יְרוּשָׁלִַם
  choice: au sujet de Jérusalem
  rationale: Avec un verbe de parole, עַל peut signifier « au sujet de » ou « contre » ; l’hostilité ressort déjà clairement des paroles rapportées.
- source_word: הֶאָח
  choice: Ah !
  rationale: Interjection de jubilation malveillante ; « Ah ! » est idiomatique en français et son ton est précisé par le contexte.
- source_word: נִשְׁבְּרָה
  choice: est brisée
  rationale: Conserve la valeur passive et résultative du niphal.
- source_word: דַּלְתוֹת הָעַמִּים
  choice: la porte des peuples
  rationale: Le pluriel hébreu désigne littéralement les battants ou portes, mais peut évoquer collectivement une porte urbaine ou un accès. Le singulier français exprime naturellement cette fonction tout en gardant l’image.
- source_word: נָסֵבָּה אֵלַי
  choice: Elle s’est tournée vers moi
  rationale: Préserve le mouvement métaphorique vers Tyr et l’accord féminin avec « porte », sans expliciter dans le texte le trafic ou l’avantage attendu.
- source_word: אִמָּלְאָה
  choice: Je vais être comblée
  rationale: Préserve la métaphore de la plénitude et l’attente de gain de Tyr, sans la réduire explicitement au profit commercial.
- source_word: הָחֳרָבָה
  choice: maintenant qu’elle est dévastée
  rationale: Le féminin renvoie à Jérusalem. La tournure exprime que sa dévastation est la circonstance dont Tyr espère tirer avantage.
theological_decisions:
- issue: Description métaphorique de Jérusalem comme דַּלְתוֹת הָעַמִּים
  choice: la porte des peuples
  alternative: les portes des peuples ; la porte des nations
  rationale: L’expression est condensée et son référent fonctionnel demeure quelque peu ambigu. La traduction conserve l’image d’un point d’accès associé à de nombreux peuples sans imposer une interprétation exclusivement commerciale.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation fait entendre la jubilation hostile de Tyr. Les féminins « tournée », « comblée » et « dévastée » correspondent respectivement à la porte, à Tyr et à Jérusalem dans le fil métaphorique du texte.
