base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/010.yaml
  text: From the abundance of his horses their dust will cover you[a]; at the sound of horsemen and wheel and chariot your walls will quake when he enters your gates[b], as one enters a city that has been breached.
translation:
  language: fr
  text: À cause de la multitude de ses chevaux, leur poussière te couvrira. Au bruit des cavaliers, des roues et des chars, tes murailles trembleront quand il entrera par tes portes, comme on entre dans une ville où une brèche a été pratiquée dans les murailles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu, littéralement : « comme les accès d’une ville ayant subi une brèche ». Le pluriel « accès » donne une tournure difficile à reproduire naturellement en français.'
    reason: Le pluriel מְבוֹאֵי (« entrées », « accès ») et la construction de la comparaison sont difficiles à rendre littéralement; la note préserve cette particularité sans surinterpréter le texte.
lexical_decisions:
- source_word: מִשִּׁפְעַת סוּסָיו
  choice: À cause de la multitude de ses chevaux
  rationale: 'שִׁפְעָה exprime l’abondance ou le grand nombre. Avec מִן, le contexte appelle ici une nuance causale : la multitude des chevaux soulève la poussière.'
- source_word: יְכַסֵּךְ אֲבָקָם
  choice: leur poussière te couvrira
  rationale: La traduction conserve l’image concrète de la poussière soulevée par les chevaux et l’adresse à Tyr au féminin singulier.
- source_word: מִקּוֹל פָּרַשׁ וְגַלְגַּל וָרֶכֶב
  choice: Au bruit des cavaliers, des roues et des chars
  rationale: קוֹל désigne ici le bruit de l’approche militaire. Les noms singuliers hébreux ont une valeur collective; le pluriel est naturel en français et rend clairement la scène.
- source_word: תִּרְעַשְׁנָה חוֹמוֹתַיִךְ
  choice: tes murailles trembleront
  rationale: רעשׁ décrit une forte secousse. « Murailles » convient aux fortifications d’une ville et garde le possessif adressé à Tyr.
- source_word: בְּבֹאוֹ בִּשְׁעָרַיִךְ
  choice: quand il entrera par tes portes
  rationale: L’infinitif construit précédé de בְּ a une valeur temporelle. En français, on entre naturellement « par » des portes.
- source_word: כִּמְבוֹאֵי עִיר מְבֻקָּעָה
  choice: comme on entre dans une ville ouverte par une brèche
  rationale: Le pluriel מְבוֹאֵי signifie littéralement « les entrées » ou « les accès », mais l’expression décrit la facilité d’entrer dans une ville dont les défenses ont été éventrées. Cette formulation française conserve la comparaison sans imposer un sujet absent de l’hébreu.
