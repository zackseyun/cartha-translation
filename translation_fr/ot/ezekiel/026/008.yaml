base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/008.yaml
  text: He will kill your daughters in the field with the sword[a], set up a siege wall against you, throw up a siege ramp against you[b], and raise a large shield against you.
translation:
  language: fr
  text: Il tuera par l’épée tes filles dans la campagne[a]. Il dressera contre toi un ouvrage de siège, élèvera contre toi une rampe de siège et dressera contre toi un grand bouclier[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « tes filles dans la campagne ». L’expression peut désigner les localités dépendantes de Tyr, c’est-à-dire ses villes secondaires ou ses villages situés dans l’arrière-pays.
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, le « grand bouclier » peut désigner plus précisément une protection de siège, telle qu’un mantelet ou un abri couvert de boucliers employé pendant l’assaut.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנוֹתַיִךְ
  choice: tes filles
  rationale: Le sens littéral est « tes filles ». Dans ce contexte militaire, l’expression peut désigner les localités dépendantes de Tyr ; le texte conserve l’image hébraïque et la note en précise le sens probable.
- source_word: בַּשָּׂדֶה
  choice: dans la campagne
  rationale: Rend le champ ou le pays ouvert. Dans l’oracle contre Tyr, il s’agit vraisemblablement des localités situées sur le continent, mais la traduction évite de préciser ce que l’hébreu laisse implicite.
- source_word: בַּחֶרֶב יַהֲרֹג
  choice: Il tuera par l’épée
  rationale: Expression française naturelle qui conserve à la fois le verbe direct « tuer » et l’instrument de guerre.
- source_word: דָּיֵק
  choice: un mur de siège
  rationale: Terme technique désignant un ouvrage d’encerclement ou d’assaut. « Mur de siège » respecte le singulier et convient au contexte sans recourir à un terme trop spécialisé.
- source_word: סֹלְלָה
  choice: une rampe d’assaut
  rationale: Désigne un remblai ou une rampe élevée contre une ville assiégée. « Rampe d’assaut » explicite sobrement sa fonction militaire.
- source_word: צִנָּה
  choice: un grand bouclier
  rationale: Le mot désigne ordinairement un grand bouclier ; dans un contexte de siège, il peut aussi évoquer une protection collective ou mobile.
- source_word: וְנָתַן ... וְשָׁפַךְ ... וְהֵקִים
  choice: dressera ... élèvera ... lèvera
  rationale: Les formes verbales poursuivent la prédiction au futur. Des verbes français distincts rendent naturellement les opérations successives du siège.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’image concrète des « filles » et les répétitions de « contre toi » qui structurent l’hébreu, tout en répartissant la longue séquence en deux phrases pour une lecture naturelle.
