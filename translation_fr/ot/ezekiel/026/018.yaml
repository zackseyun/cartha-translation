  text: עַתָּה֙ יֶחְרְד֣וּ הָֽ/אִיִּ֔ן י֖וֹם מַפַּלְתֵּ֑/ךְ וְ/נִבְהֲל֛וּ הָ/אִיִּ֥ים אֲשֶׁר בַּ/יָּ֖ם מִ/צֵּאתֵֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/018.yaml
  text: Now the coastlands will tremble on the day of your downfall[b][a], and the islands that are in the sea will be terrified at your departure.
translation:
  language: fr
  text: Maintenant, les terres côtières trembleront au jour de ta chute[a], et les îles qui sont dans la mer seront épouvantées à ton départ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les îles ». Le mot hébreu peut désigner des îles aussi bien que des terres côtières ou des territoires maritimes.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « à ta sortie »; ou « à cause de ta sortie ». L’expression évoque probablement la disparition de Tyr à la suite du jugement.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Maintenant
  rationale: Rend directement l’adverbe temporel qui introduit la conséquence immédiate de la chute de Tyr.
- source_word: יֶחְרְדוּ
  choice: trembleront
  rationale: Conserve à la fois la manifestation physique et la peur exprimées par חרד.
- source_word: הָאִיִּן
  choice: les terres côtières
  rationale: Le nom peut désigner des îles ou, plus largement, des territoires maritimes; le sens large convient ici, tout en maintenant l’ambiguïté dans une note.
- source_word: יוֹם מַפַּלְתֵּךְ
  choice: au jour de ta chute
  rationale: Formulation française naturelle et solennelle qui exprime le moment de la ruine de Tyr.
- source_word: וְנִבְהֲלוּ
  choice: seront épouvantées
  rationale: Traduit l’alarme intense du niphal de בהל, sans le confondre avec le tremblement du premier verbe.
- source_word: הָאִיִּים אֲשֶׁר בַּיָּם
  choice: les îles qui sont dans la mer
  rationale: La précision « dans la mer » favorise ici le sens concret d’îles.
- source_word: מִצֵּאתֵךְ
  choice: par ton départ
  rationale: Préserve l’image littérale de la « sortie » ou du départ de Tyr sans expliciter davantage que l’hébreu sa disparition à la suite du jugement.
