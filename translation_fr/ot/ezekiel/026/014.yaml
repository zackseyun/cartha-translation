source:
  edition: WLC
  text: וּ/נְתַתִּ֞י/ךְ לִ/צְחִ֣יחַ סֶ֗לַע מִשְׁטַ֤ח חֲרָמִים֙ תִּֽהְיֶ֔ה לֹ֥א תִבָּנֶ֖ה ע֑וֹד כִּ֣י אֲנִ֤י יְהוָה֙ דִּבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/014.yaml
  text: I will make you a bare rock[a], a place for spreading nets. You will not be rebuilt again, for I, Yahweh, have spoken[b], declares the Lord GOD.
translation:
  language: fr
  text: Je ferai de toi un rocher dénudé, un endroit où l’on étend les filets. Tu ne seras plus rebâtie, car moi, Yahvé, j’ai parlé — déclaration du Seigneur Yahvé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְתַתִּיךְ לִצְחִיחַ סֶלַע
  choice: Je ferai de toi un rocher dénudé
  rationale: Avec un complément prédicatif, נתן exprime ici le fait de réduire Tyr à cet état. « Rocher dénudé » restitue l’image d’une surface rocheuse mise à nu et dépouillée.
- source_word: מִשְׁטַח חֲרָמִים תִּהְיֶה
  choice: un endroit où l’on étend les filets
  rationale: מִשְׁטַח désigne une surface ou un lieu d’étendage, et חֲרָמִים des filets de pêche. La formulation est naturelle en français tout en conservant l’image concrète.
- source_word: לֹא תִבָּנֶה עוֹד
  choice: Tu ne seras plus rebâtie
  rationale: Le nifal de בנה est passif, « être rebâti », et עוֹד signifie ici « encore, désormais ». Le féminin s’accorde avec Tyr, ville personnifiée.
- source_word: כִּי אֲנִי יְהוָה דִּבַּרְתִּי
  choice: car moi, Yahvé, j’ai parlé
  rationale: כִּי donne le fondement de la certitude annoncée. La tournure emphatique garde la solennité de אֲנִי, et le nom divin est translittéré sous sa forme française courante.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahvé
  rationale: נְאֻם introduit une formule solennelle d’oracle. « Déclaration » conserve sa valeur nominale, tandis que « Seigneur Yahvé » représente distinctement אֲדֹנָי et le nom divin.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: « Yahvé » représente directement le tétragramme et convient à l’usage français moderne. Une note n’est pas indispensable puisque le texte ne dépend d’aucun jeu de mots sur ce nom.
- issue: Rendu du titre אֲדֹנָי יְהוִה
  choice: le Seigneur Yahvé
  alternative: le Seigneur DIEU
  rationale: 'Ce rendu fait entendre les deux éléments hébreux sans les confondre : אֲדֹנָי comme titre et יְהוִה comme nom propre.'
- issue: Portée de לֹא תִבָּנֶה עוֹד
  choice: Tu ne seras plus rebâtie
  alternative: Tu ne seras jamais rebâtie
  rationale: « Plus » préserve la valeur temporelle de עוֹד sans renforcer silencieusement l’énoncé par un absolu explicite comme « jamais ».
translation_notes:
  register: Français international moderne, digne et direct. La ville de Tyr est personnifiée au féminin. Le tiret avant la formule finale marque son caractère solennel sans ajouter de contenu.
