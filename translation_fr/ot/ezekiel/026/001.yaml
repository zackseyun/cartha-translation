source:
  edition: WLC
  text: וַ/יְהִ֛י בְּ/עַשְׁתֵּֽי עֶשְׂרֵ֥ה שָׁנָ֖ה בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/001.yaml
  text: And it happened in the eleventh year[a], on the first day of the month, that the word of Yahweh came to me, saying,
translation:
  language: fr
  text: 'La onzième année, le premier jour du mois[a], la parole de Yahweh me fut adressée en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « le premier du mois », une formule de datation qui désigne le premier jour du mois ; le mois n’est pas précisé.
    reason: explication de la formule de datation hébraïque
lexical_decisions:
- source_word: וַיְהִי
  choice: La onzième année… la parole… me fut adressée
  rationale: La formule narrative introduit ici un épisode prophétique daté. En français, il est plus naturel de l’intégrer à la phrase sans calquer « et il arriva ».
- source_word: בְּעַשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: La onzième année
  rationale: Rendu idiomatique de la formule chronologique hébraïque.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: le premier jour du mois
  rationale: Littéralement « au premier du mois » ; il s’agit de la formule habituelle désignant le premier jour, sans que le mois soit nommé dans le texte hébreu.
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: la parole de Yahweh me fut adressée
  rationale: Cette tournure française naturelle rend la formule prophétique, bien que l’hébreu emploie littéralement le verbe « être ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération courante du nom divin, qui préserve son caractère de nom propre plutôt que de lui substituer un titre.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: Introduit naturellement en français le discours direct qui commence au verset suivant.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme ; « Yahweh » en conserve la fonction de nom propre sans imposer une substitution traditionnelle par un titre.
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe évite l’archaïsme « il arriva que » tout en conservant la formule prophétique et l’imprécision du mois.
