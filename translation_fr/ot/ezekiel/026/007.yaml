source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֧י מֵבִ֣יא אֶל צֹ֗ר נְבוּכַדְרֶאצַּ֧ר מֶֽלֶךְ בָּבֶ֛ל מִ/צָּפ֖וֹן מֶ֣לֶךְ מְלָכִ֑ים בְּ/ס֛וּס וּ/בְ/רֶ֥כֶב וּ/בְ/פָרָשִׁ֖ים וְ/קָהָ֥ל וְ/עַם רָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/007.yaml
  text: 'For thus says the Lord GOD: Behold[a], I am bringing against Tyre Nebuchadnezzar king of Babylon from the north, king of kings, with horses and chariots and horsemen, and an assembly and a numerous people.'
translation:
  language: fr
  text: 'Car voici ce que dit le Seigneur Yahweh : « Voici que je fais venir contre Tyr Nabuchodonosor[a], roi de Babylone, depuis le nord, roi des rois, avec des chevaux, des chars et des cavaliers, ainsi qu’une assemblée et un peuple nombreux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La graphie hébraïque correspond ici plus précisément à « Nebuchadrezzar » (ou « Nebucadretsar ») ; la tradition française emploie couramment « Nabuchodonosor ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication divine du jugement annoncé dans le contexte précédent.
- source_word: כֹה אָמַר
  choice: voici ce que dit
  rationale: Rend naturellement en français actuel la formule prophétique de messager tout en conservant sa solennité.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Distingue le titre אֲדֹנָי du nom divin יהוה et conserve explicitement le nom d’alliance.
- source_word: הִנְנִי מֵבִיא אֶל
  choice: Voici que je fais venir contre
  rationale: « Voici que » marque l’annonce divine solennelle; dans ce contexte d’invasion, אֶל a naturellement le sens directionnel hostile de « contre ».
- source_word: צֹר
  choice: Tyr
  rationale: Forme française usuelle du nom de la ville.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabuchodonosor
  rationale: Forme française traditionnelle et immédiatement reconnaissable; la graphie précise de l’hébreu est signalée en note.
- source_word: מֶלֶךְ בָּבֶל
  choice: roi de Babylone
  rationale: Rend directement la construction nominale hébraïque.
- source_word: מִצָּפוֹן
  choice: depuis le nord
  rationale: Exprime clairement la provenance de l’envahisseur.
- source_word: מֶלֶךְ מְלָכִים
  choice: roi des rois
  rationale: Conserve l’apposition et l’expression hébraïque de suprématie impériale sans lui ajouter d’article définissant Nabuchodonosor comme l’unique détenteur absolu de ce titre.
- source_word: בְּסוּס וּבְרֶכֶב וּבְפָרָשִׁים
  choice: avec des chevaux, des chars et des cavaliers
  rationale: Rend les collectifs militaires par des pluriels idiomatiques en français.
- source_word: וְקָהָל וְעַם רָב
  choice: ainsi qu’une assemblée et un peuple nombreux
  rationale: Préserve les deux éléments coordonnés et la portée collective de קָהָל sans les fusionner.
theological_decisions:
- issue: Rendu du nom divin יהוה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU; le Seigneur Yahvé
  rationale: Le texte porte directement le Tétragramme. « Yahweh » conserve le nom divin plutôt que de le remplacer par un titre, tandis que « Seigneur » rend אֲדֹנָי.
- issue: Portée de מֶלֶךְ מְלָכִים appliqué à Nabuchodonosor
  choice: roi des rois
  alternative: un roi parmi les rois; roi au-dessus des rois
  rationale: La formulation littérale désigne ici la suprématie impériale de Nabuchodonosor. Elle est conservée sans résoudre ni atténuer la tension que cette expression peut avoir avec ses autres emplois bibliques.
translation_notes:
  register: Français international moderne, digne et accessible. La double formule « voici ce que dit… Voici que… » conserve deux éléments hébreux distincts malgré une légère répétition rhétorique. Le marqueur [a] est placé immédiatement après le nom auquel la note se rapporte.
