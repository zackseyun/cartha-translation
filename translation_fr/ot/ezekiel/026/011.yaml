id: EZK.26.11
reference: Ezekiel 26:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/פַרְס֣וֹת סוּסָ֔י/ו יִרְמֹ֖ס אֶת כָּל חֽוּצוֹתָ֑יִ/ךְ עַמֵּ/ךְ֙ בַּ/חֶ֣רֶב יַהֲרֹ֔ג וּ/מַצְּב֥וֹת עֻזֵּ֖/ךְ לָ/אָ֥רֶץ תֵּרֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/011.yaml
  text: With the hoofs of his horses he will trample all your streets[a]; he will kill your people with the sword[b], and the pillars of your strength will come down to the ground.
translation:
  language: fr
  text: Sous les sabots de ses chevaux, il piétinera toutes tes rues[a] ; il tuera ton peuple par l’épée, et les piliers de ta puissance[b] s’écrouleront à terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes tes places » ou « tous tes espaces ouverts ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les monuments de ta puissance ». Le terme hébreu peut désigner des piliers, des stèles ou des monuments dressés associés à la puissance de Tyr.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפַרְסוֹת סוּסָיו
  choice: Sous les sabots de ses chevaux
  rationale: La préposition בְּ exprime ici le moyen. « Sous les sabots » rend naturellement en français l’image concrète du piétinement causé par les chevaux.
- source_word: יִרְמֹס
  choice: il piétinera
  rationale: רמס désigne l’action de fouler ou piétiner. « Piétinera » conserve la force de l’image militaire sans ajouter l’idée plus précise d’écrasement.
- source_word: כָּל חוּצוֹתָיִךְ
  choice: toutes tes rues
  rationale: חוּצוֹת peut désigner les rues, les places ou les espaces ouverts d’une ville. « Rues » est le choix contextuel le plus naturel, tandis qu’une note préserve les autres possibilités.
- source_word: עַמֵּךְ
  choice: ton peuple
  rationale: עַם désigne ici la population de la ville. « Ton peuple » est direct et respecte l’adresse féminine singulière à Tyr.
- source_word: בַּחֶרֶב יַהֲרֹג
  choice: il tuera … par l’épée
  rationale: La formulation conserve l’image concrète de l’épée et rend simplement le verbe הרג, sans recourir au plus littéraire « faire périr ».
- source_word: וּמַצְּבוֹת עֻזֵּךְ
  choice: et les piliers de ta puissance
  rationale: מַצְּבוֹת peut désigner des pierres dressées, des stèles, des colonnes ou des monuments. Cette formulation préserve le rapport génitif et l’ambiguïté entre structures réelles et symboles de puissance.
- source_word: לָאָרֶץ תֵּרֵד
  choice: s’écrouleront à terre
  rationale: Le verbe ירד signifie littéralement « descendre ». Dans ce contexte de destruction, « s’écrouleront à terre » exprime idiomatiquement la chute des piliers sans introduire explicitement un agent passif.
