  text: וְ/שִׁחֲת֞וּ חֹמ֣וֹת צֹ֗ר וְ/הָֽרְסוּ֙ מִגְדָּלֶ֔י/הָ וְ/סִֽחֵיתִ֥י עֲפָרָ֖/הּ מִמֶּ֑/נָּה וְ/נָתַתִּ֥י אוֹתָ֖/הּ לִ/צְחִ֥יחַ סָֽלַע׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/004.yaml
  text: They will destroy the walls of Tyre and tear down her towers[a], and I will scrape her dust away from her and make her a bare rock.
translation:
  language: fr
  text: Ils détruiront les murailles de Tyr et démoliront ses tours. Je raclerai la poussière qui la recouvre[a] et je ferai d’elle un rocher nu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la terre qui la recouvre » ; le mot hébreu peut désigner la poussière, la terre meuble ou le sol. L’image est celle d’une ville entièrement décapée jusqu’au roc.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁחֲתוּ
  choice: Ils détruiront
  rationale: Dans ce contexte de siège, שׁחת exprime la destruction des fortifications; « détruiront » est naturel et convient à « murailles ».
- source_word: חֹמוֹת צֹר
  choice: les murailles de Tyr
  rationale: « Murailles » désigne clairement les murs défensifs d’une ville, et « Tyr » est la forme française usuelle du toponyme.
- source_word: וְהָרְסוּ מִגְדָּלֶיהָ
  choice: démoliront ses tours
  rationale: הרס évoque l’action d’abattre une construction; « démoliront » préserve la distinction avec le premier verbe et מִגְדָּל désigne concrètement une tour.
- source_word: וְסִחֵיתִי עֲפָרָהּ מִמֶּנָּה
  choice: Je raclerai la poussière qui la recouvre
  rationale: Le verbe rare évoque l’enlèvement de la couche superficielle. Cette formulation rend en français l’image d’un site raclé jusqu’au roc tout en conservant le sens concret de עָפָר.
- source_word: וְנָתַתִּי אוֹתָהּ לִצְחִיחַ סָלַע
  choice: je ferai d’elle un rocher nu
  rationale: נתן avec un complément de résultat peut signifier « faire de »; צְחִיחַ סָלַע décrit une surface rocheuse mise à nu.
theological_decisions: []
