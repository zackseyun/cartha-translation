source:
  edition: WLC
  text: וְ/הוֹרַדְתִּי/ךְ֩ אֶת י֨וֹרְדֵי ב֜וֹר אֶל עַ֣ם עוֹלָ֗ם וְ֠/הוֹשַׁבְתִּי/ךְ בְּ/אֶ֨רֶץ תַּחְתִּיּ֜וֹת כָּ/חֳרָב֤וֹת מֵֽ/עוֹלָם֙ אֶת י֣וֹרְדֵי ב֔וֹר לְמַ֖עַן לֹ֣א תֵשֵׁ֑בִי וְ/נָתַתִּ֥י צְבִ֖י בְּ/אֶ֥רֶץ חַיִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/020.yaml
  text: Then I will bring you down with those who go down to the pit[a], to the people of long ago; and I will make you dwell in the land below, like ruins from ancient times, with those who go down to the pit, so that you will not be inhabited[c][b]. But I will set beauty in the land of the living.
translation:
  language: fr
  text: Alors je te ferai descendre avec ceux qui descendent dans la fosse, auprès du peuple d’autrefois[a]. Je te ferai habiter dans le pays d’en bas[b], pareille aux ruines des temps anciens, avec ceux qui descendent dans la fosse, afin que tu ne sois pas habitée[c]. Mais j’établirai la beauté[d] dans le pays des vivants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le peuple des temps anciens » ou « le peuple antique ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans le pays des profondeurs » ou « dans les régions les plus basses ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « afin que tu n’habites pas ». Puisqu’il est question d’une ville, le sens peut être : « afin que tu ne sois pas habitée ».'
    reason: source_ambiguity
  - marker: d
    text: 'Ou : « la splendeur » ou « la gloire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַדְתִּיךְ
  choice: Alors je te ferai descendre
  rationale: Le hiphil de ירד exprime la causation. « Je te ferai descendre » conserve le mouvement vers le bas et l’adresse féminine à la ville, sans ajouter l’idée d’une précipitation violente.
- source_word: יֹרְדֵי בוֹר
  choice: ceux qui descendent dans la fosse
  rationale: La tournure participiale est rendue naturellement en français. « Fosse » préserve l’image concrète ainsi que ses résonances de tombe et de séjour des morts.
- source_word: עַם עוֹלָם
  choice: le peuple d’autrefois
  rationale: Dans ce contexte, עוֹלָם renvoie à un passé reculé. Cette formulation reste naturelle tout en évitant de donner au syntagme le sens d’un peuple éternel.
- source_word: וְהוֹשַׁבְתִּיךְ
  choice: Je te ferai habiter
  rationale: Le causatif de ישׁב est conservé directement, ce qui convient au jugement prononcé contre la ville personnifiée.
- source_word: בְּאֶרֶץ תַּחְתִּיּוֹת
  choice: dans le pays d’en bas
  rationale: Cette expression concise garde l’image spatiale des régions inférieures sans introduire un terme technique ultérieur comme « enfer ».
- source_word: כָּחֳרָבוֹת מֵעוֹלָם
  choice: pareille aux ruines des temps anciens
  rationale: « Pareille » rend la comparaison marquée par כ et s’accorde avec la ville personnifiée; « des temps anciens » exprime ici l’ancienneté indiquée par מֵעוֹלָם.
- source_word: לְמַעַן לֹא תֵשֵׁבִי
  choice: afin que tu ne sois plus habitée
  rationale: Le verbe signifie littéralement « habiter » ou « demeurer », mais, appliqué à une ville, le français demande naturellement une formulation passive. « Plus » exprime l’état de désolation visé dans le contexte.
- source_word: וְנָתַתִּי צְבִי
  choice: Mais j’établirai la beauté
  rationale: Le waw est compris comme marquant ici le contraste avec la descente de Tyr. צְבִי peut désigner la beauté, la splendeur ou la gloire; « beauté » laisse le référent aussi ouvert que possible.
- source_word: בְּאֶרֶץ חַיִּים
  choice: dans le pays des vivants
  rationale: Cette expression idiomatique désigne le domaine de la vie terrestre, en contraste avec la fosse et le pays d’en bas.
theological_decisions:
- issue: Sens et référent de וְנָתַתִּי צְבִי בְּאֶרֶץ חַיִּים
  choice: « Mais j’établirai la beauté dans le pays des vivants »
  alternative: « Et je mettrai la splendeur dans le pays des vivants » ou « j’établirai la gloire dans le pays des vivants »
  rationale: La proposition hébraïque est brève et son référent demeure indéterminé. La traduction maintient le contraste entre la condamnation de Tyr et l’action de Dieu parmi les vivants, sans préciser s’il s’agit d’une restauration, d’une gloire particulière ou d’un autre bienfait.
- issue: Portée funéraire de בּוֹר et אֶרֶץ תַּחְתִּיּוֹת
  choice: Conserver les images de « fosse » et de « pays d’en bas »
  alternative: Employer explicitement « tombe » ou « séjour des morts »
  rationale: Le texte évoque nettement le domaine des morts, mais ses images ne doivent pas être réduites à une construction doctrinale plus précise que l’hébreu.
translation_notes:
  register: Français international actuel, digne et accessible. La ville de Tyr reste personnifiée au féminin. Les répétitions de « descendre » et de « fosse » sont maintenues pour conserver la structure et le contraste spatial du texte hébreu.
