base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/017.yaml
  text: They will raise a lament over you and say to you[a], ‘How you have perished, you who were inhabited from the seas, the praised city, which was strong in the sea, she and her inhabitants[c][b], who imposed their terror on all her inhabitants.’
translation:
  language: fr
  text: 'Ils entonneront sur toi une complainte et te diront :


    « Comment as-tu péri,


    toi qui étais peuplée depuis les mers[a],


    ville célébrée[b],


    qui étais puissante sur la mer,


    toi et tes habitants,


    qui imposiez votre terreur[c]


    à tous ses habitants ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « habitée depuis les mers ». L’expression hébraïque est difficile ; elle peut évoquer une population venue des régions maritimes ou un approvisionnement assuré par la mer.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ville renommée » ; littéralement : « ville louée ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « qui donniez votre terreur », c’est-à-dire qui inspiriez l’effroi. La fin de la phrase dit littéralement « à tous ses habitants », formulation dont le sens est difficile dans ce contexte.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְנָשְׂאוּ ... קִינָה
  choice: Ils entonneront sur toi une complainte
  rationale: L’expression hébraïque signifie prononcer ou entonner un chant funèbre. « Entonner une complainte » restitue naturellement en français sa dimension poétique et publique.
- source_word: אֵיךְ אָבַדְתְּ
  choice: Comment as-tu disparu
  rationale: Dans une lamentation, אֵיךְ introduit une exclamation douloureuse. « Disparu » rend ici אָבַד sans déterminer plus précisément si la ville a péri, a été détruite ou s’est évanouie.
- source_word: נוֹשֶׁבֶת מִיַּמִּים
  choice: toi qui étais peuplée par les mers
  rationale: Le texte massorétique présente une forme passive liée à « habiter » avec « depuis/par les mers ». La formulation française garde l’image difficile et le pluriel « mers », tandis que la note expose les principales compréhensions.
- source_word: הָעִיר הַהֻלָּלָה
  choice: ville célébrée
  rationale: Le participe passif de הלל désigne ici une ville louée, célébrée ou renommée. « Célébrée » reste proche de la forme passive tout en étant idiomatique.
- source_word: חֲזָקָה בַיָּם
  choice: puissante au milieu de la mer
  rationale: « Puissante » rend la force exprimée par חזק. « Au milieu de la mer » traduit le cadre maritime marqué par בַיָּם et convient à la situation insulaire de Tyr sans réduire la formule à sa puissance navale.
- source_word: הִיא וְיֹשְׁבֶיהָ
  choice: toi et tes habitants
  rationale: Le passage s’adresse directement à la ville au féminin. La deuxième personne maintient cette personnification et s’intègre plus naturellement au discours direct français que « elle et ses habitants ».
- source_word: נָתְנוּ חִתִּיתָם
  choice: qui imposiez votre terreur
  rationale: Littéralement, le groupe verbal signifie « qui donniez leur/votre terreur » et exprime le fait d’inspirer l’effroi. « Imposer votre terreur » en conserve la force active.
- source_word: לְכָל יֹשְׁבֶיהָ
  choice: à tous ses habitants
  rationale: Le suffixe féminin est conservé par « ses » et renvoie grammaticalement à la ville. Cette lecture produit une difficulté de sens réelle dans le texte hébreu; elle n’est donc pas silencieusement remplacée par une référence absente au texte.
theological_decisions:
- issue: Personnification de la ville de Tyr
  choice: Maintenir l’adresse féminine à la ville avec « toi » et les accords féminins
  alternative: Employer des tournures impersonnelles ou faire de Tyr un simple lieu
  rationale: Les formes hébraïques féminines et le genre de la complainte personnifient Tyr. Le français permet de préserver cet effet poétique sans lui ajouter de portée doctrinale.
- issue: Référent de « tous ses habitants »
  choice: Conserver le suffixe féminin du texte massorétique, malgré la difficulté contextuelle
  alternative: Traduire de manière explicative par « tous les habitants des alentours » ou une expression semblable
  rationale: L’hébreu reçu dit littéralement « tous ses habitants ». Une reformulation géographique résoudrait la tension en ajoutant un référent qui n’est pas exprimé.
translation_notes:
  register: Français international actuel, digne et poétique. La mise en vers fait entendre la complainte. Le tutoiement convient à l’apostrophe prophétique adressée à une ville personnifiée. Les formulations difficiles du texte massorétique sont maintenues dans le corps du verset et précisées en notes plutôt que normalisées par conjecture.
