  to: 'Ils entonneront sur toi une complainte et te diront :


    « Comment as-tu péri,


    toi qui étais peuplée depuis les mers[a],


    ville célébrée[b],


    qui étais puissante sur la mer,


    toi et tes habitants,


    qui imposiez votre terreur[c]


    à tous ses habitants ! »'
  rationale: La révision corrige la valeur de la préposition dans « peuplée depuis les mers », évite de préciser indûment la position de la ville avec « au milieu de », et emploie « péri », plus fidèle au lexique de lamentation. La construction directe « toi et tes habitants » et le possessif final « ses habitants » maintiennent la tension syntaxique du texte massorétique, explicitée en note plutôt que résolue par ajout interprétatif.
  reviewer_model: gpt-5.6-terra
