    issue: « peuplée par les mers » ne rend pas fidèlement מִיָּמִים.
    rationale: La préposition מן exprime ici une provenance ou une origine (« depuis / venant des mers »), non l’agent d’un passif. La note reconnaît d’ailleurs ce sens par « depuis les mers ».
  - severity: low
    issue: « au milieu de la mer » surdétermine בַּיָּם.
    rationale: Le texte dit simplement « dans/sur la mer ». « Au milieu » ajoute une précision spatiale qui peut évoquer l’île de Tyr mais n’est pas formulée par l’hébreu.
  - severity: low
    issue: « disparu » affaiblit légèrement la notion de périr dans le cadre funèbre.
    rationale: אָבַד peut avoir le sens de disparaître, mais « périr » rend plus directement le ton de ruine et de lamentation tout en restant non spécifique.
