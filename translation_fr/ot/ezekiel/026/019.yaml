  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה בְּ/תִתִּ֤/י אֹתָ/ךְ֙ עִ֣יר נֶחֱרֶ֔בֶת כֶּ/עָרִ֖ים אֲשֶׁ֣ר לֹֽא נוֹשָׁ֑בוּ בְּ/הַעֲל֤וֹת עָלַ֨יִ/ךְ֙ אֶת תְּה֔וֹם וְ/כִסּ֖וּ/ךְ הַ/מַּ֥יִם הָ/רַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/019.yaml
  text: 'For thus says the Lord GOD: When I make you a ruined city[a], like the cities that are not inhabited, when I bring up the deep over you and the great waters cover you[b],'
translation:
  language: fr
  text: 'Car voici ce que dit le Seigneur Yahweh : Quand je ferai de toi une ville dévastée, pareille aux villes qui ne sont pas habitées, quand je ferai monter sur toi l’abîme et que les grandes eaux te couvriront,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Cette formulation distingue le titre אֲדֹנָי du nom divin יהוה, tout en évitant l’expression française maladroite « le Seigneur SEIGNEUR ».
- source_word: בְּתִתִּי אֹתָךְ עִיר נֶחֱרֶבֶת
  choice: Quand je ferai de toi une ville dévastée
  rationale: Dans cette construction, נתן a le sens de « faire de » ou « rendre »; נֶחֱרֶבֶת décrit une ville mise en ruines.
- source_word: כֶּעָרִים אֲשֶׁר לֹא נוֹשָׁבוּ
  choice: pareille aux villes qui ne sont plus habitées
  rationale: Le niphal de ישב exprime ici l’absence d’habitants. « Ne sont plus habitées » convient au contexte de villes devenues désertes.
- source_word: בְּהַעֲלוֹת עָלַיִךְ אֶת תְּהוֹם
  choice: quand je ferai monter sur toi l’abîme
  rationale: Le hifil de עלה exprime l’action de faire monter. « L’abîme » conserve l’image dense et potentiellement cosmologique de תְּהוֹם sans la réduire à de simples eaux profondes.
- source_word: וְכִסּוּךְ הַמַּיִם הָרַבִּים
  choice: et que les grandes eaux te couvriront
  rationale: Avec מַיִם, רַבִּים peut évoquer une masse d’eau vaste ou puissante; « les grandes eaux » est naturel en français biblique moderne et garde la force de l’image.
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte explicitement le nom divin יהוה après le titre אֲדֹנָי. Le rendre par « Yahweh » préserve la distinction entre le titre et le nom propre.
- issue: Portée de תְּהוֹם dans l’image du jugement
  choice: l’abîme
  alternative: les eaux profondes
  rationale: « L’abîme » maintient la résonance plus large du terme hébreu et ne tranche pas entre la profondeur marine concrète et l’imagerie cosmique.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La structure répétée « quand… quand… » reproduit le mouvement syntaxique de l’hébreu; la virgule finale est conservée puisque le verset introduit la suite de la déclaration.
