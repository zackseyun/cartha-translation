  terminology: « Le Seigneur Yahweh » distingue adéquatement אֲדֹנָי de יהוה. « Ville dévastée », « l’abîme » et « les grandes eaux » sont des choix recevables et conservent la force de l’imagerie hébraïque sans surinterprétation.
