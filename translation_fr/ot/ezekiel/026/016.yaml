source:
  edition: WLC
  text: וְֽ/יָרְד֞וּ מֵ/עַ֣ל כִּסְאוֹתָ֗/ם כֹּ֚ל נְשִׂיאֵ֣י הַ/יָּ֔ם וְ/הֵסִ֨ירוּ֙ אֶת מְעִ֣ילֵי/הֶ֔ם וְ/אֶת בִּגְדֵ֥י רִקְמָתָ֖/ם יִפְשֹׁ֑טוּ חֲרָד֤וֹת יִלְבָּ֨שׁוּ֙ עַל הָ/אָ֣רֶץ יֵשֵׁ֔בוּ וְ/חָֽרְדוּ֙ לִ/רְגָעִ֔ים וְ/שָׁמְמ֖וּ עָלָֽיִ/ךְ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/016.yaml
  text: Then all the princes of the sea will come down from their thrones[a], remove their robes, and strip off their embroidered garments. They will clothe themselves with trembling, sit on the ground, tremble moment by moment[b], and be appalled at you.
translation:
  language: fr
  text: Alors tous les princes de la mer descendront de leurs trônes[a]. Ils ôteront leurs robes et se dépouilleront de leurs vêtements brodés. Ils se revêtiront de tremblements[b], s’assiéront par terre, trembleront à chaque instant et seront consternés à ton sujet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les chefs de la mer ». L’hébreu dit littéralement « tous les princes de la mer » et désigne des dirigeants maritimes.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « ils revêtiront des tremblements » : la terreur est représentée comme un vêtement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרְדוּ מֵעַל כִּסְאוֹתָם
  choice: descendront de leurs trônes
  rationale: Le verbe ירד exprime une descente, et מֵעַל indique qu’ils quittent la position élevée de leurs trônes. La formulation conserve à la fois le mouvement et l’humiliation des dirigeants.
- source_word: כֹּל נְשִׂיאֵי הַיָּם
  choice: tous les princes de la mer
  rationale: נָשִׂיא peut désigner un prince, un chef ou un dirigeant. « Princes » maintient le rang politique, tandis que « de la mer » préserve l’image hébraïque des souverains maritimes.
- source_word: וְהֵסִירוּ אֶת מְעִילֵיהֶם
  choice: Ils ôteront leurs robes
  rationale: Le hiphil de סור signifie ici enlever, et מְעִיל désigne une robe ou un manteau de dessus. « Robes » convient aux vêtements prestigieux de ces princes.
- source_word: וְאֶת בִּגְדֵי רִקְמָתָם יִפְשֹׁטוּ
  choice: se dépouilleront de leurs vêtements brodés
  rationale: פשט appliqué aux vêtements signifie les enlever ou s’en dépouiller; רִקְמָה évoque un ouvrage brodé ou multicolore. Cette tournure restitue la vigueur du geste et le luxe perdu.
- source_word: חֲרָדוֹת יִלְבָּשׁוּ
  choice: Ils se revêtiront de tremblements
  rationale: Littéralement, ils « revêtiront des tremblements ». Le pluriel inhabituel et la métaphore vestimentaire sont conservés afin de rendre l’image saisissante du texte.
- source_word: עַל הָאָרֶץ יֵשֵׁבוּ
  choice: s’assiéront par terre
  rationale: Dans ce contexte de posture d’abaissement et de deuil, הָאָרֶץ désigne naturellement le sol. « Par terre » est idiomatique en français moderne.
- source_word: וְחָרְדוּ לִרְגָעִים
  choice: trembleront à chaque instant
  rationale: לִרְגָעִים, littéralement « par moments/pour des instants », exprime ici un tremblement répété. « À chaque instant » rend clairement cette valeur itérative.
- source_word: וְשָׁמְמוּ עָלָיִךְ
  choice: seront consternés à cause de toi
  rationale: שׁמם décrit ici la stupeur ou la consternation devant le sort de Tyr. עַל peut marquer l’objet ou la cause de cette réaction; « à cause de toi » convient naturellement au contexte.
