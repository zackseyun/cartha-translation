  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא בְּ/י֨וֹם בּ֥וֹא גוֹג֙ עַל אַדְמַ֣ת יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה תַּעֲלֶ֥ה חֲמָתִ֖/י בְּ/אַפִּֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/018.yaml
  text: And it will happen on that day[a], on the day when Gog comes against the land of Israel, declares the Lord GOD, that my wrath will rise up in my nostrils.
translation:
  language: fr
  text: 'Ce jour-là, le jour où Gog viendra contre le territoire d’Israël, voici ce qui arrivera — déclaration du Seigneur Yahweh : ma fureur me montera au nez[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ma fureur montera dans mon nez ». En hébreu, le « nez » est associé de manière imagée à la colère.'
    reason: Précise l’image idiomatique hébraïque conservée par l’expression française « me montera au nez ».
lexical_decisions:
- source_word: וְהָיָה
  choice: voici ce qui arrivera
  rationale: Rend la formule prophétique annonçant un événement futur dans un français actuel, tout en conservant sa solennité.
- source_word: בַּיּוֹם הַהוּא בְּיוֹם בּוֹא גוֹג
  choice: Ce jour-là, le jour où Gog viendra
  rationale: Conserve la reprise emphatique de « jour » et exprime naturellement la construction temporelle avec l’infinitif hébreu.
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: contre le territoire d’Israël
  rationale: Dans ce contexte d’invasion hostile, עַל signifie « contre »; « territoire » exprime ici אַדְמָה comme terre géographique sans suggérer seulement le sol.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: « Déclaration » restitue la formule prophétique נְאֻם; « Yahweh » représente directement le nom divin יהוה et évite l’étrange répétition « Seigneur SEIGNEUR ».
- source_word: תַּעֲלֶה חֲמָתִי בְּאַפִּי
  choice: ma fureur me montera aux narines
  rationale: Préserve l’image corporelle concrète de l’hébreu tout en donnant une tournure française intelligible; חֵמָה désigne ici une fureur ardente.
theological_decisions:
- issue: Rendu du nom divin יהוה après אֲדֹנָי
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte contient explicitement le nom divin. Sa translittération préserve cette donnée et distingue le nom יהוה du titre אֲדֹנָי.
- issue: Anthropomorphisme de la colère montant aux narines
  choice: conserver l’image dans le texte principal
  alternative: ma colère s’enflammera
  rationale: L’image hébraïque est intentionnellement concrète et intense. La conserver évite d’aplanir le langage théologique; une note en précise la valeur idiomatique.
translation_notes:
  register: Français international moderne, digne et prophétique. La syntaxe a été réorganisée pour éviter une phrase pesante, mais la double indication temporelle, la formule d’oracle et l’image des narines sont conservées.
