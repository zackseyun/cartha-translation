base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/022.yaml
  text: And I will enter into judgment with him by pestilence and bloodshed[a]; and I will rain down on him, on his troops, and on the many peoples who are with him, torrential rain, hailstones, fire[c][b], and sulfur.
translation:
  language: fr
  text: J’entrerai en jugement contre lui par la peste et par le sang versé ; je ferai pleuvoir sur lui, sur ses troupes[a] et sur les nombreux peuples qui sont avec lui une pluie torrentielle, des grêlons, du feu et du soufre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses bandes » ou « ses armées » ; le terme hébreu désigne ici les forces qui l’accompagnent.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁפַּטְתִּי אִתּוֹ
  choice: J’entrerai en jugement contre lui
  rationale: Le niphal de שׁפט avec אֵת exprime ici une action judiciaire engagée envers un adversaire. Cette formulation conserve la nuance juridique, tandis que « contre lui » rend clairement en français la valeur adversative de la construction.
- source_word: בְּדֶבֶר וּבְדָם
  choice: par la peste et par le sang versé
  rationale: דֶּבֶר désigne couramment la peste comme instrument du jugement divin. Dans cette énumération, דָּם évoque par métonymie la mort violente ; « sang versé » en exprime le sens sans supprimer l’image du sang.
- source_word: וְגֶשֶׁם שׁוֹטֵף
  choice: une pluie torrentielle
  rationale: Le nom accompagné du participe décrit une pluie violente et débordante. « Pluie torrentielle » est naturel en français moderne et conserve l’idée d’un déluge irrésistible.
- source_word: וְאַבְנֵי אֶלְגָּבִישׁ
  choice: des grêlons
  rationale: L’expression hébraïque signifie littéralement des pierres de grêle. « Grêlons » en est l’équivalent français précis et idiomatique.
- source_word: אֵשׁ וְגָפְרִית
  choice: du feu et du soufre
  rationale: « Soufre » est l’équivalent moderne direct de גָפְרִית et évite une tournure traditionnelle vieillie tout en conservant concrètement l’image du jugement.
- source_word: אַמְטִיר
  choice: Je ferai pleuvoir
  rationale: Le hiphil de מטר est causatif. « Faire pleuvoir » en restitue directement la valeur et convient à tous les éléments de l’énumération.
- source_word: אֲגַפָּיו
  choice: ses troupes
  rationale: Dans ce contexte militaire, le terme désigne les corps, bandes ou forces qui accompagnent Gog. « Troupes » est clair sans imposer une organisation militaire trop précise.
- source_word: עַמִּים רַבִּים אֲשֶׁר אִתּוֹ
  choice: les nombreux peuples qui seront avec lui
  rationale: עַמִּים désigne des peuples plutôt que nécessairement des États-nations. Le futur s’accorde naturellement en français avec l’annonce prophétique tout en exprimant leur présence aux côtés de Gog.
theological_decisions:
- issue: Nature des images du jugement
  choice: Présenter la peste, le sang versé, la pluie, la grêle, le feu et le soufre comme les actes concrets annoncés par Dieu.
  alternative: Reformuler ces éléments comme de simples symboles de catastrophe.
  rationale: L’hébreu formule directement un oracle de jugement au moyen d’images conventionnelles du jugement divin et de la théophanie. La traduction en préserve le caractère concret sans trancher la question de leur accomplissement ou de leur portée symbolique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe conserve le mouvement solennel de l’oracle tout en évitant les archaïsmes. La répétition de « sur » et l’énumération finale reproduisent l’accumulation emphatique de l’hébreu.
