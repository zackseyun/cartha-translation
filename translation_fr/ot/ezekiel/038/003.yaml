  text: 'and say, ‘Thus says the Lord GOD: Behold, I am against you, Gog, chief prince of Meshech and Tubal.’'
translation:
  language: fr
  text: 'Tu diras : « Voici ce que dit le Seigneur DIEU : Voici, je suis contre toi, Gog, prince en chef de Méchek et de Toubal[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « prince de Rosh, de Méchek et de Toubal ». Le mot hébreu traduit par « en chef » peut aussi être compris comme le nom propre Rosh.'
