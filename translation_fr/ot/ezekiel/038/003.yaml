lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Formule prophétique rendue en français naturel et solennel, sans affaiblir l’autorité de la déclaration.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur DIEU
  rationale: Distingue le titre אֲדֹנָי du nom divin יהוה, ici représenté selon la convention typographique DIEU.
- source_word: הִנְנִי אֵלֶיךָ
  choice: Je m’en prends à toi
  rationale: Exprime idiomatiquement l’hostilité et l’intervention annoncées par la formule hébraïque, plutôt qu’une simple orientation spatiale.
- source_word: נְשִׂיא רֹאשׁ
  choice: prince suprême
  rationale: Comprend רֹאשׁ comme un qualificatif de נְשִׂיא, « principal/suprême », conformément à la syntaxe retenue dans le texte de consultation, sans en faire le nom propre Rosh.
- source_word: מֶשֶׁךְ וְתֻבָל
  choice: de Méchek et de Toubal
  rationale: Translittération française moderne des noms propres, avec la relation de gouvernement exprimée par « de ».
theological_decisions:
- issue: Interprétation de רֹאשׁ dans נְשִׂיא רֹאשׁ
  choice: 'Titre : « prince suprême »'
  alternative: 'Nom territorial : « prince de Rosh, de Méchek et de Toubal »'
  rationale: L’absence de conjonction avant מֶשֶׁךְ permet l’analyse de רֹאשׁ comme substantif attributif/adjectival qualifiant le prince. Cette lecture est retenue sans identifier Gog à une nation moderne.
translation_notes:
  register: Français international actuel, digne et accessible. Le futur injonctif « Tu diras » convient à la continuité du discours prophétique. Guillemets français employés.
