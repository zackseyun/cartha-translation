  yaml_path: translation/ot/ezekiel/038/010.yaml
  text: 'Thus says the Lord GOD: On that day[a], things will come up in your heart[b], and you will devise an evil plan.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh : En ce jour-là, des pensées surgiront dans ton cœur[a], et tu concevras un mauvais dessein[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans la manière de penser hébraïque, le cœur est aussi le siège de la pensée et de l’intention, et pas seulement des émotions.
    reason: cultural_note
  - marker: b
    text: Le terme hébreu rendu par « pensées » peut aussi désigner des « paroles », des « choses » ou des « affaires » qui montent dans le cœur.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule française consacrée et naturelle du messager prophétique, qui conserve la solennité de l’hébreu.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Le titre אֲדֹנָי est rendu par « le Seigneur » et le nom divin יהוה par « Yahweh », sans les confondre.
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Rend naturellement la circonstance temporelle future exprimée par l’idiome hébreu.
- source_word: יַעֲלוּ דְבָרִים
  choice: des pensées surgiront
  rationale: Littéralement, des « paroles/choses » monteront; dans ce contexte intérieur et préparatoire au projet, « pensées » exprime naturellement l’idée sans masquer l’ambiguïté, signalée en note.
- source_word: עַל לְבָבֶךָ
  choice: dans ton cœur
  rationale: Conserve l’image hébraïque du cœur comme siège de la pensée, de la volonté et de l’intention.
- source_word: וְחָשַׁבְתָּ
  choice: tu concevras
  rationale: Le verbe indique ici l’élaboration intentionnelle d’un dessein et fait écho au nom de même racine qui suit.
- source_word: מַחֲשֶׁבֶת רָעָה
  choice: un projet mauvais
  rationale: « Projet » rend une intention élaborée; « mauvais » préserve la qualification morale de רָעָה sans ajouter une nuance absente du texte.
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Cette traduction distingue le titre אֲדֹנָי du nom propre יהוה et rend explicitement le tétragramme.
- issue: Portée anthropologique de לֵבָב
  choice: cœur, avec explication en note
  alternative: esprit
  rationale: Le texte hébreu parle du cœur, qui désigne ici le centre de la pensée et de l’intention; le remplacer par « esprit » supprimerait l’image source.
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique demeure solennelle; l’image du cœur est conservée et expliquée. Le tutoiement correspond à l’adresse directe au personnage visé.
