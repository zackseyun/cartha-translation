    rationale: Bien que les participes féminins s’accordent formellement avec « terre » en hébreu, le rassemblement d’entre de nombreux peuples vise ses habitants. En français, dire qu’une terre est « rassemblée d’entre des peuples » est opaque et peut faire croire à un déplacement matériel du territoire. L’explicitation minimale des habitants rend le sens sans modifier la personnification maintenue par « Cette terre a été tirée… ».
