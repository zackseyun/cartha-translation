  text: מִ/יָּמִ֣ים רַבִּים֮ תִּפָּקֵד֒ בְּ/אַחֲרִ֨ית הַ/שָּׁנִ֜ים תָּב֣וֹא אֶל אֶ֣רֶץ מְשׁוֹבֶ֣בֶת מֵ/חֶ֗רֶב מְקֻבֶּ֨צֶת֙ מֵ/עַמִּ֣ים רַבִּ֔ים עַ֚ל הָרֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר הָי֥וּ לְ/חָרְבָּ֖ה תָּמִ֑יד וְ/הִיא֙ מֵ/עַמִּ֣ים הוּצָ֔אָה וְ/יָשְׁב֥וּ לָ/בֶ֖טַח כֻּלָּֽ/ם׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/008.yaml
  text: After many days you will be mustered[a]; in the latter years you will come into a land restored from the sword, gathered from many peoples, onto the mountains of Israel, which had been a continual waste; but it was brought out from the peoples[b], and all of them will dwell securely.
translation:
  language: fr
  text: Après bien des jours, tu seras mobilisé[a] ; dans les dernières années[b], tu viendras vers une terre rétablie après les ravages de l’épée, dont les habitants ont été rassemblés d’entre de nombreux peuples, sur les montagnes d’Israël, qui avaient été constamment dévastées. Cette terre a été tirée d’entre les peuples, et tous y habiteront en sécurité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu seras convoqué » ou « on fera appel à toi ». Dans ce contexte, l’hébreu évoque probablement une mobilisation en vue d’agir.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans la dernière partie des années » ; certaines traductions ont « dans les derniers jours ».
    reason: alternative_rendering
lexical_decisions:
- source_word: תִּפָּקֵד
  choice: tu seras mobilisé
  rationale: Dans ce contexte de rassemblement militaire et d’invasion, le niphal de פקד évoque naturellement le fait d’être appelé ou mobilisé pour agir, tout en gardant en note les autres valeurs possibles du verbe.
- source_word: בְּאַחֲרִית הַשָּׁנִים
  choice: dans les dernières années
  rationale: Cette formulation suit la mention précise des « années » dans l’hébreu et évite de la remplacer par la formule prophétique plus courante « dans les derniers jours ».
- source_word: אֶרֶץ מְשׁוֹבֶבֶת מֵחֶרֶב
  choice: une terre rétablie après les ravages de l’épée
  rationale: Le participe exprime le rétablissement ou le retour à un état antérieur. « Les ravages de l’épée » rend en français naturel la guerre et la dévastation évoquées par l’image hébraïque.
- source_word: מְקֻבֶּצֶת מֵעַמִּים רַבִּים
  choice: rassemblée d’entre de nombreux peuples
  rationale: Le féminin singulier prolonge grammaticalement « terre » dans l’hébreu, tout en évoquant le rassemblement de sa population; la traduction conserve cette formulation compacte et sa légère personnification.
- source_word: עַל הָרֵי יִשְׂרָאֵל
  choice: sur les montagnes d’Israël
  rationale: Avec le verbe de mouvement, עַל indique ici l’arrivée sur le territoire montagneux d’Israël. « Sur » est naturel en français après « venir vers une terre ».
- source_word: אֲשֶׁר הָיוּ לְחָרְבָּה תָּמִיד
  choice: qui avaient été constamment dévastées
  rationale: Le relatif se rattache naturellement aux montagnes, et cette formulation exprime leur état durable de ruine sans suggérer qu’il était nécessairement sans fin.
- source_word: וְהִיא מֵעַמִּים הוּצָאָה
  choice: Cette terre a été tirée d’entre les peuples
  rationale: Le pronom féminin renvoie à la terre. La reprise explicite évite une ambiguïté de référent en français et conserve l’image d’une terre personnifiée ramenée avec sa population.
- source_word: וְיָשְׁבוּ לָבֶטַח כֻּלָּם
  choice: et tous y habiteront en sécurité
  rationale: La formule ישב לבטח désigne une habitation sûre. « Tous » maintient l’insistance explicite de כֻּלָּם, et « y » rattache leur résidence à la terre décrite.
theological_decisions:
- issue: Formule eschatologique
  choice: dans les dernières années
  alternative: dans les derniers jours
  rationale: Le texte hébreu parle expressément de la dernière partie des « années », et non de la formule plus habituelle « derniers jours ». La traduction préserve cette distinction sans harmonisation eschatologique.
- issue: Référent du rassemblement
  choice: conserver l’image d’une terre rassemblée d’entre les peuples
  alternative: expliciter que seuls les habitants sont rassemblés
  rationale: La syntaxe hébraïque emploie des formes féminines singulières accordées avec « terre », même si le sens inclut manifestement sa population. Garder cette formulation préserve la personnification et l’ambiguïté poétique plutôt que de la résoudre entièrement.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse prophétique directe à Gog. La traduction conserve la métaphore de l’épée, la personnification de la terre et la distinction entre « dernières années » et « derniers jours ».
