lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans la formule prophétique וַיְהִי דְבַר־יְהוָה אֵלַי, le français idiomatique dit que la parole divine « fut adressée » au prophète. Ce choix rend la formule dans son ensemble sans traduire mécaniquement le verbe par « fut » ou « arriva ».
- source_word: דְבַר
  choice: La parole
  rationale: דָּבָר désigne ici la parole ou le message divin. « La parole » conserve le vocabulaire prophétique traditionnel et le lien direct avec l'acte de parler.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin YHWH. « Yahweh » le représente comme nom propre plutôt que de lui substituer le titre « le Seigneur ».
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément de « fut adressée » exprime naturellement en français la direction marquée par אֶל avec le suffixe de première personne.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L'infinitif לֵאמֹר introduit les paroles qui suivent. Dans cette formule, « en ces termes » est un équivalent français naturel et digne, plutôt que le calque « disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte hébreu emploie directement le Tétragramme. Le conserver sous la forme « Yahweh » maintient son caractère de nom propre sans le remplacer par un titre ; la note signale les autres usages de traduction.
translation_notes:
  register: Français international moderne, clair et digne. La tournure prophétique consacrée « La parole de Yahweh me fut adressée » reste naturelle dans le registre biblique, tandis que « en ces termes » introduit avec fluidité le discours du verset suivant.
