  text: And the word of Yahweh came to me[a], saying,
translation:
  language: fr
  text: 'La parole de Yahweh[a] me fut adressée en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, transcrit « Yahweh » ou « Jéhovah » ; traditionnellement rendu par « le SEIGNEUR ».'
