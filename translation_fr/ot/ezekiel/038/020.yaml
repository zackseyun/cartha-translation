reference: Ezekiel 38:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/רָעֲשׁ֣וּ מִ/פָּנַ֡/י דְּגֵ֣י הַ/יָּם֩ וְ/ע֨וֹף הַ/שָּׁמַ֜יִם וְ/חַיַּ֣ת הַ/שָּׂדֶ֗ה וְ/כָל הָ/רֶ֨מֶשׂ֙ הָ/רֹמֵ֣שׂ עַל הָֽ/אֲדָמָ֔ה וְ/כֹל֙ הָֽ/אָדָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֣י הָ/אֲדָמָ֑ה וְ/נֶהֶרְס֣וּ הֶ/הָרִ֗ים וְ/נָֽפְלוּ֙ הַ/מַּדְרֵג֔וֹת וְ/כָל חוֹמָ֖ה לָ/אָ֥רֶץ תִּפּֽוֹל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/020.yaml
  text: The fish of the sea[a], the birds of the heavens, the beasts of the field, every creeping thing that creeps on the ground, and every man who is on the face of the earth will quake at my presence; the mountains will be thrown down, the cliffs will fall, and every wall will fall to the ground.
translation:
  language: fr
  text: Les poissons de la mer, les oiseaux du ciel, les animaux sauvages des champs, toutes les créatures qui rampent sur le sol et tous les êtres humains qui sont sur la face de la terre trembleront devant moi. Les montagnes s’écrouleront, les escarpements[a] tomberont et toutes les murailles s’effondreront à terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu est rare et son sens exact est incertain; il peut aussi désigner des pentes en gradins ou des terrasses.
    reason: Préserver l’ambiguïté lexicale de הַמַּדְרֵגוֹת sans imposer une interprétation topographique unique.
lexical_decisions:
- source_word: וְרָעֲשׁוּ
  choice: trembleront
  rationale: Le verbe רעשׁ exprime ici un violent tremblement provoqué par la manifestation divine. « Trembleront » convient aux êtres vivants énumérés et s’intègre à l’imagerie sismique du verset.
- source_word: מִפָּנַי
  choice: devant moi
  rationale: L’expression signifie littéralement « de devant ma face/ma présence ». « Devant moi » reste naturel en français et conserve la réaction suscitée par la présence divine sans préciser davantage la relation causale.
- source_word: דְּגֵי הַיָּם
  choice: les poissons de la mer
  rationale: Rendu direct de la construction hébraïque, naturel en français.
- source_word: עוֹף הַשָּׁמַיִם
  choice: les oiseaux du ciel
  rationale: « Du ciel » est l’expression française courante et digne correspondant à cette formule hébraïque.
- source_word: חַיַּת הַשָּׂדֶה
  choice: les animaux sauvages
  rationale: חַיַּת הַשָּׂדֶה désigne les animaux terrestres, souvent sauvages. Cette formulation moderne évite l’ambiguïté française de « bêtes des champs ».
- source_word: כָּל הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאֲדָמָה
  choice: toutes les petites bêtes qui se déplacent sur le sol
  rationale: רמשׂ englobe les petites créatures qui rampent ou se meuvent près du sol. Cette formulation restitue la catégorie sans limiter indûment le mouvement aux seuls reptiles rampants.
- source_word: כֹל הָאָדָם
  choice: tous les êtres humains
  rationale: אָדָם est ici un singulier collectif désignant l’humanité. Le pluriel français inclusif en communique précisément le sens.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: qui vivent à la surface de la terre
  rationale: L’hébreu dit littéralement « qui [sont] sur la face du sol/de la terre ». L’ajout idiomatique de « vivent » explicite en français la portée géographique de la formule sans modifier son référent.
- source_word: וְנֶהֶרְסוּ הֶהָרִים
  choice: Les montagnes s’écrouleront
  rationale: Le niphal de הרס indique que les montagnes seront renversées ou abattues. « S’écrouleront » exprime clairement leur effondrement catastrophique.
- source_word: הַמַּדְרֵגוֹת
  choice: les escarpements
  rationale: Ce nom rare désigne vraisemblablement des pentes, gradins ou lieux abrupts. « Escarpements » préserve le caractère topographique sans le réduire à des falaises précises ni évoquer des terrasses agricoles.
- source_word: כָל חוֹמָה לָאָרֶץ תִּפּוֹל
  choice: toutes les murailles s’effondreront à terre
  rationale: La formulation rend le mouvement de chute totale. « Murailles » convient mieux que « murs » à l’ampleur publique et défensive souvent associée à חוֹמָה.
theological_decisions:
- issue: Portée collective de אָדָם
  choice: tous les êtres humains
  alternative: tout homme / toute l’humanité
  rationale: Dans כֹל הָאָדָם, אָדָם désigne collectivement l’ensemble des humains, non les seuls hommes de sexe masculin. Le rendu choisi exprime directement cette portée sans ajouter de distinction théologique.
- issue: Sens de מִפָּנַי
  choice: devant moi
  alternative: à cause de ma présence / loin de ma face
  rationale: La préposition מן peut exprimer la provenance ou la cause, tandis que פנים désigne la face ou la présence. « Devant moi » préserve la tension entre position face à Dieu et réaction provoquée par sa présence.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’énumération cosmique du texte hébreu et son mouvement vers l’effondrement général. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
