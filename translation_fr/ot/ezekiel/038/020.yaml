- from: Les poissons de la mer, les oiseaux du ciel, les animaux sauvages, toutes les petites bêtes qui se déplacent sur le sol et tous les êtres humains qui vivent à la surface de la terre trembleront devant moi. Les montagnes s’écrouleront, les escarpements tomberont et toutes les murailles s’effondreront à terre.
  to: Les poissons de la mer, les oiseaux du ciel, les animaux sauvages des champs, toutes les créatures qui rampent sur le sol et tous les êtres humains qui sont sur la face de la terre trembleront devant moi. Les montagnes s’écrouleront, les escarpements[a] tomberont et toutes les murailles s’effondreront à terre.
  rationale: La révision conserve l’imagerie cosmique et sismique du texte, tout en relevant le registre de « petites bêtes », en évitant l’ajout de « vivent », en restituant « des champs » et en documentant l’incertitude du terme topographique rare.
