    reason: Préserver l’ambiguïté lexicale de הַמַּדְרֵגוֹת sans imposer une interprétation topographique unique.
  revision_rationale: La révision conserve l’imagerie cosmique et sismique du texte, tout en relevant le registre de « petites bêtes », en évitant l’ajout de « vivent », en restituant « des champs » et en documentant l’incertitude du terme topographique rare.
