  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה הַֽ/אַתָּה ה֨וּא אֲשֶׁר דִּבַּ֜רְתִּי בְּ/יָמִ֣ים קַדְמוֹנִ֗ים בְּ/יַד֙ עֲבָדַ/י֙ נְבִיאֵ֣י יִשְׂרָאֵ֔ל הַֽ/נִּבְּאִ֛ים בַּ/יָּמִ֥ים הָ/הֵ֖ם שָׁנִ֑ים לְ/הָבִ֥יא אֹתְ/ךָ֖ עֲלֵי/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/017.yaml
  text: 'Thus says the Lord GOD: Are you the one of whom I spoke in former days by the hand of my servants the prophets of Israel[c][b][a], who prophesied in those days for years that I would bring you against them?'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh : N’est-ce pas toi dont j’ai parlé autrefois par l’intermédiaire de mes serviteurs, les prophètes d’Israël[a], qui, en ces jours-là, ont prophétisé pendant des années[b] que je te ferais venir contre eux ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main de mes serviteurs, les prophètes d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu juxtapose « en ces jours-là » et « des années », formulation qui souligne que ces prophéties se sont étendues sur une longue période.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Conserve le titre אֲדֹנָי (« Seigneur ») et rend explicitement le nom divin יהוה par « Yahweh », sans produire l’expression maladroite « le Seigneur SEIGNEUR ».
- source_word: הַאַתָּה הוּא
  choice: N’est-ce pas toi
  rationale: La construction interrogative emphatique désigne directement Gog. Cette tournure française exprime naturellement l’identification appuyée, sans imposer davantage que le contexte rhétorique.
- source_word: אֲשֶׁר דִּבַּרְתִּי
  choice: dont j’ai parlé
  rationale: Rend directement et idiomatiquement la proposition relative ayant une personne pour référent.
- source_word: בְּיָמִים קַדְמוֹנִים
  choice: autrefois
  rationale: Expression française actuelle et digne qui restitue la référence à des temps antérieurs, avec la possibilité contextuelle d’un passé ancien.
- source_word: בְּיַד
  choice: par l’intermédiaire de
  rationale: Rend le sens instrumental de l’idiome hébreu « par la main de » en français naturel.
- source_word: עֲבָדַי
  choice: mes serviteurs
  rationale: Dans le cadre de la mission prophétique, « serviteurs » exprime convenablement leur relation et leur fonction sans mettre au premier plan le sens social d’« esclaves ».
- source_word: הַנִּבְּאִים
  choice: qui […] ont prophétisé
  rationale: Le participe relatif décrit l’activité prophétique de ces serviteurs; le passé composé convient au discours direct en français moderne.
- source_word: בַּיָּמִים הָהֵם שָׁנִים
  choice: en ces jours-là […] pendant des années
  rationale: Préserve les deux indications juxtaposées dans l’hébreu et fait ressortir l’étendue temporelle de l’activité prophétique.
- source_word: לְהָבִיא אֹתְךָ עֲלֵיהֶם
  choice: que je te ferais venir contre eux
  rationale: Rend l’infinitif comme contenu de la prophétie antérieure; « contre eux » explicite naturellement l’orientation hostile indiquée par le contexte.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte le nom divin יהוה. « Yahweh » le distingue du titre אֲדֹנָי et évite de confondre les deux éléments du syntagme.
- issue: Portée de la question divine
  choice: N’est-ce pas toi dont j’ai parlé
  alternative: Es-tu celui dont j’ai parlé
  rationale: La question semble constituer une identification rhétorique de Gog plutôt qu’une demande d’information. La formulation retenue le suggère sans transformer la question en affirmation explicite.
- issue: Identification des prophéties antérieures
  choice: maintien d’une formulation générale
  alternative: identifier un prophète ou un passage précis
  rationale: Le verset ne nomme aucun prophète ni oracle particulier; la traduction ne résout donc pas cette question interprétative.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La syntaxe conserve la longue question rhétorique de l’hébreu tout en employant des expressions françaises naturelles. Les marqueurs [a] et [b] figurent dans le texte dans l’ordre de leurs notes.
