lexical_decisions:
- source_word: פָּרַס
  choice: la Perse
  rationale: Nom usuel en français pour le peuple ou territoire perse; l’article défini convient naturellement au nom de pays.
- source_word: כּוּשׁ
  choice: Koush
  rationale: Translittération française du nom ethnogéographique, préférable à l’identification traditionnelle « Éthiopie », qui peut être anachronique.
- source_word: פוּט
  choice: Pouth
  rationale: Translittération française traditionnelle proche de la forme hébraïque; « Libye » constituerait une identification interprétative.
- source_word: אִתָּם
  choice: sont avec eux
  rationale: Restitue naturellement en français la proposition nominale hébraïque et le sens de la préposition avec suffixe pronominal.
- source_word: כֻּלָּם
  choice: tous
  rationale: Préserve la portée récapitulative et distributive de l’expression hébraïque.
- source_word: מָגֵן
  choice: boucliers
  rationale: Terme militaire français courant; le pluriel s’impose naturellement après « tous équipés de ».
- source_word: כוֹבָע
  choice: casques
  rationale: Équivalent militaire précis et courant dans ce contexte.
