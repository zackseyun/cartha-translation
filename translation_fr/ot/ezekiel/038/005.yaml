  text: Persia[a], Cush, and Put are with them[b], all of them with shield and helmet.
translation:
  language: fr
  text: La Perse, Koush[a] et Pouth[b] sont avec eux, tous équipés de boucliers et de casques.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Koush est traditionnellement rendu par « Éthiopie » dans certaines traductions.
