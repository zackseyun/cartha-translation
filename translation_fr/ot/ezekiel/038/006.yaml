source:
  edition: WLC
  text: גֹּ֚מֶר וְ/כָל אֲגַפֶּ֔י/הָ בֵּ֚ית תּֽוֹגַרְמָ֔ה יַרְכְּתֵ֥י צָפ֖וֹן וְ/אֶת כָּל אֲגַפָּ֑י/ו עַמִּ֥ים רַבִּ֖ים אִתָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/006.yaml
  text: Gomer and all its troops[b][a], the house of Togarmah from the far north and all its troops—many peoples are with you.
translation:
  language: fr
  text: Gomer et toutes ses troupes[a], la maison de Togarma, venue des régions les plus reculées du nord, et toutes ses troupes ; des peuples nombreux sont avec toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes ses ailes », « tous ses détachements ». Le terme hébreu peut désigner des ailes, des extrémités ou des groupes rattachés ; le contexte est ici militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּמֶר
  choice: Gomer
  rationale: Nom propre d’un peuple, conservé par translittération usuelle.
- source_word: אֲגַפֶּיהָ / אֲגַפָּיו
  choice: toutes ses troupes
  rationale: Le nom peut désigner des ailes, des extrémités ou des groupes rattachés ; dans cette énumération militaire, « troupes » exprime naturellement le sens contextuel, tout en signalant l’ambiguïté en note.
- source_word: בֵּית תּוֹגַרְמָה
  choice: la maison de Togarma
  rationale: Conserve la construction ethnogéographique hébraïque « maison de » et translittère le nom propre.
- source_word: יַרְכְּתֵי צָפוֹן
  choice: venue des régions les plus reculées du nord
  rationale: Rend la notion des confins ou parties reculées du nord, avec un accord naturel sur « maison » en français.
- source_word: עַמִּים רַבִּים
  choice: des peuples nombreux
  rationale: « Peuples » préserve mieux que « nations » la portée ethnoculturelle possible de עַמִּים.
- source_word: אִתָּךְ
  choice: avec toi
  rationale: Traduction directe de la préposition avec suffixe de deuxième personne ; le genre grammatical du suffixe n’a pas à être explicité en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. La ponctuation maintient la structure d’une liste avant la proposition finale. Le marqueur [a] figure dans le texte après la première occurrence et sa note vaut pour les deux occurrences du même terme hébreu.
