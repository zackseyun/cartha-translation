  text: וְ/עָלִ֨יתָ֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל כֶּֽ/עָנָ֖ן לְ/כַסּ֣וֹת הָ/אָ֑רֶץ בְּ/אַחֲרִ֨ית הַ/יָּמִ֜ים תִּֽהְיֶ֗ה וַ/הֲבִאוֹתִ֨י/ךָ֙ עַל אַרְצִ֔/י לְמַעַן֩ דַּ֨עַת הַ/גּוֹיִ֜ם אֹתִ֗/י בְּ/הִקָּדְשִׁ֥/י בְ/ךָ֛ לְ/עֵינֵי/הֶ֖ם גּֽוֹג־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/016.yaml
  text: And you will come up against my people Israel like a cloud to cover the land. In the latter days it will happen that I will bring you against my land[a], so that the nations may know me when I show myself holy through you before their eyes, O Gog.
translation:
  language: fr
  text: 'Tu monteras contre mon peuple, Israël, comme un nuage pour couvrir le pays. Dans les derniers temps, cela arrivera : je te ferai venir contre mon pays, afin que les nations me connaissent lorsque je me montrerai saint en toi sous leurs yeux, Gog.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « lorsque je me sanctifierai en toi sous leurs yeux ». La préposition peut aussi être comprise au sens de « par toi ».'
    reason: La note conserve la formulation de sanctification plus littérale et signale sans la trancher l’ambiguïté de בְךָ.
lexical_decisions:
- source_word: וְעָלִיתָ עַל עַמִּי יִשְׂרָאֵל
  choice: Tu monteras contre mon peuple, Israël
  rationale: Le verbe עלה évoque littéralement une montée, mais désigne ici une avancée militaire hostile. « Monter contre » conserve l’image hébraïque tout en restant intelligible; la virgule rend Israël apposé à « mon peuple ».
- source_word: כֶּעָנָן לְכַסּוֹת הָאָרֶץ
  choice: comme un nuage qui couvre le pays
  rationale: La comparaison est explicite. Dans ce contexte d’invasion d’Israël, הָאָרֶץ désigne plus naturellement « le pays » que la terre entière. La proposition relative exprime naturellement en français la portée de l’infinitif.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: Dans les derniers temps
  rationale: Cette expression prophétique garde une portée eschatologique ouverte sans imposer un calendrier doctrinal précis. « Dans les derniers temps » est naturel en français moderne.
- source_word: תִּהְיֶה
  choice: cela arrivera
  rationale: Le verbe renvoie vraisemblablement à l’événement annoncé; cette formulation française restitue clairement sa valeur événementielle.
- source_word: וַהֲבִאוֹתִיךָ עַל אַרְצִי
  choice: je te ferai venir contre mon pays
  rationale: La forme causative de בוא souligne l’action souveraine de Dieu. « Contre » convient au mouvement hostile, tandis que « mon pays » conserve la revendication divine exprimée par le possessif.
- source_word: לְמַעַן דַּעַת הַגּוֹיִם אֹתִי
  choice: afin que les nations me connaissent
  rationale: La formule exprime le but divin. « Me connaissent » conserve la dimension révélatrice et relationnelle de ידע.
- source_word: בְּהִקָּדְשִׁי בְךָ
  choice: lorsque je manifesterai ma sainteté par toi
  rationale: Cette formulation indique que la sainteté de Dieu devient publiquement manifeste au moyen de ce qu’il accomplit à l’égard de Gog, sans suggérer que Dieu acquiert davantage de sainteté. La note conserve une traduction plus formelle et l’ambiguïté de la préposition.
- source_word: לְעֵינֵיהֶם
  choice: sous leurs yeux
  rationale: Expression française vivante qui traduit le caractère public et visible de la manifestation.
- source_word: גּוֹג
  choice: Gog
  rationale: Le nom placé en fin de phrase fonctionne comme une apostrophe; en français, la ponctuation suffit à marquer l’adresse directe sans ajouter « ô », devenu soutenu ou archaïque.
theological_decisions:
- issue: Portée eschatologique de בְּאַחֲרִית הַיָּמִים
  choice: Dans les derniers temps
  alternative: Dans les jours à venir; à la fin des jours
  rationale: Le choix maintient la portée prophétique de l’expression sans la rattacher à un système particulier de la fin des temps.
- issue: Langage de sanctification divine en בְּהִקָּדְשִׁי בְךָ
  choice: lorsque je manifesterai ma sainteté par toi
  alternative: lorsque je me sanctifierai en toi
  rationale: Le texte parle de la sainteté de Dieu rendue manifeste devant les nations. Le texte principal évite de suggérer un changement moral en Dieu, tandis que la note préserve la forme plus littérale et la tension du texte hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur prophétique est conservé. « Monter contre » maintient l’image du texte source sans employer une paraphrase comme « attaquer ». La note [a] est placée après l’unité de sens qu’elle éclaire.
