  revision_rationale: La révision maintient tous les choix fidèles du projet tout en rendant la fonction de l’infinitif « pour couvrir » et en rapprochant la dernière proposition de la formulation hébraïque. Elle préserve l’ambiguïté de la préposition dans le texte et dans la note, sans imposer d’interprétation doctrinale.
