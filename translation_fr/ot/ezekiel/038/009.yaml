source:
  edition: WLC
  text: וְ/עָלִ֨יתָ֙ כַּ/שֹּׁאָ֣ה תָב֔וֹא כֶּ/עָנָ֛ן לְ/כַסּ֥וֹת הָ/אָ֖רֶץ תִּֽהְיֶ֑ה אַתָּה֙ וְ/כָל אֲגַפֶּ֔י/ךָ וְ/עַמִּ֥ים רַבִּ֖ים אוֹתָֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/009.yaml
  text: You will come up like a storm; you will be like a cloud covering the land—you and all your troops, and many peoples with you.
translation:
  language: fr
  text: Tu monteras, tu viendras comme une tempête ; tu seras comme un nuage couvrant le pays, toi, toutes tes troupes et de nombreux peuples avec toi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַשֹּׁאָה
  choice: comme une tempête
  rationale: Le nom שׁוֹאָה évoque ici une tempête dévastatrice ou un assaut tumultueux ; « tempête » restitue naturellement l’image dans ce contexte militaire.
- source_word: אֲגַפֶּיךָ
  choice: tes troupes
  rationale: Bien que אֲגַפִּים puisse désigner des ailes ou des flancs, le contexte d’une armée favorise le sens de contingents ou troupes.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte, אֶרֶץ désigne vraisemblablement le territoire envahi plutôt que la terre entière ; « pays » conserve cette portée contextuelle.
- source_word: לְכַסּוֹת
  choice: qui couvre
  rationale: L’infinitif exprime la fonction ou l’effet du nuage ; la proposition relative produit un français naturel tout en maintenant l’image de recouvrement.
theological_decisions:
- issue: Portée de הָאָרֶץ
  choice: le pays
  alternative: la terre
  rationale: Le cadre immédiat est celui d’une invasion territoriale. Le choix n’impose pas une portée universelle que le terme hébreu, à lui seul, ne requiert pas.
- issue: Valeur de תִּהְיֶה
  choice: tu seras
  alternative: tu viendras
  rationale: Le verbe hébreu est explicitement « être ». Conserver « tu seras » respecte la distinction avec תָבוֹא, « tu viendras », dans la proposition précédente.
translation_notes:
  register: Français moderne, clair et digne. La répétition « Tu monteras, tu viendras » conserve les deux verbes hébreux et leur progression. Aucun marqueur de note n’est requis.
