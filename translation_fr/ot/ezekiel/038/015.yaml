  text: וּ/בָ֤אתָ מִ/מְּקֽוֹמְ/ךָ֙ מִ/יַּרְכְּתֵ֣י צָפ֔וֹן אַתָּ֕ה וְ/עַמִּ֥ים רַבִּ֖ים אִתָּ֑/ךְ רֹכְבֵ֤י סוּסִים֙ כֻּלָּ֔/ם קָהָ֥ל גָּד֖וֹל וְ/חַ֥יִל רָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/015.yaml
  text: And you will come from your place[a], from the far north—you and many peoples with you[b], all of them riding horses—a great assembly and a mighty army.
translation:
  language: fr
  text: 'Tu viendras du lieu où tu te trouves, des confins du nord[a], toi et de nombreux peuples avec toi, tous montés sur des chevaux : une grande assemblée et une armée nombreuse[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des régions les plus reculées du nord » ou « de l’extrême nord ». L’expression hébraïque désigne les lointaines extrémités du nord.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une grande troupe et une force considérable ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: Tu viendras
  rationale: Le parfait qal à la 2e personne masculine singulière, précédé de la conjonction, a ici une valeur future dans le discours prophétique. Le français n’a pas besoin de rendre וְ par « et » en tête de phrase pour conserver l’enchaînement.
- source_word: מִמְּקוֹמְךָ
  choice: du lieu où tu te trouves
  rationale: מָקוֹם signifie largement « lieu, endroit ». Cette formulation actuelle évite le tour peu naturel « de ton lieu » sans préciser abusivement qu’il s’agit d’une demeure ou d’un territoire.
- source_word: מִיַּרְכְּתֵי צָפוֹן
  choice: des confins du nord
  rationale: L’expression désigne les parties les plus reculées ou les extrémités du nord. « Les confins du nord » restitue l’image géographique avec concision et dignité.
- source_word: אַתָּה וְעַמִּים רַבִּים אִתָּךְ
  choice: toi et de nombreux peuples avec toi
  rationale: Le pronom indépendant אַתָּה met le destinataire en relief. « Peuples » traduit עַמִּים sans le réduire à des États ou nations au sens moderne.
- source_word: רֹכְבֵי סוּסִים כֻּלָּם
  choice: tous montés sur des chevaux
  rationale: La formulation rend directement les « cavaliers de chevaux » et rattache clairement כֻּלָּם à l’ensemble des troupes accompagnatrices.
- source_word: קָהָל גָּדוֹל
  choice: une grande assemblée
  rationale: קָהָל désigne un groupe rassemblé. « Assemblée » conserve ce sens de base sans lui donner ici une coloration ecclésiale particulière.
- source_word: וְחַיִל רָב
  choice: et une puissante armée
  rationale: Dans ce contexte militaire, חַיִל désigne une armée ou une force combattante. רָב peut évoquer son ampleur et sa puissance ; « puissante armée » est naturel et convient à la menace décrite.
