source:
  edition: WLC
  text: וּ/בְ/קִנְאָתִ֥/י בְ/אֵשׁ עֶבְרָתִ֖/י דִּבַּ֑רְתִּי אִם לֹ֣א בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ רַ֣עַשׁ גָּד֔וֹל עַ֖ל אַדְמַ֥ת יִשְׂרָאֵֽל־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/019.yaml
  text: 'For in my jealousy[a], in the fire of my wrath, I have spoken: surely on that day there will be a great earthquake upon the land of Israel.'
translation:
  language: fr
  text: 'Dans ma jalousie, dans le feu de ma colère, j’ai parlé : oui, ce jour-là, il y aura un grand tremblement[a] sur la terre d’Israël.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un grand tremblement de terre » ou « une grande secousse ». Le mot hébreu רַעַשׁ peut désigner plus largement un ébranlement, bien qu’un séisme convienne bien au contexte.
    reason: alternative lexicale
lexical_decisions:
- source_word: וּבְקִנְאָתִי
  choice: Dans ma jalousie
  rationale: קִנְאָה peut exprimer la jalousie ou le zèle. « Jalousie » conserve ici la force personnelle et relationnelle de l’indignation divine. Le ו initial relie la phrase au contexte, sans qu’il soit nécessaire de le rendre par une conjonction distincte en français.
- source_word: בְאֵשׁ עֶבְרָתִי
  choice: dans le feu de ma colère
  rationale: La formulation garde l’image hébraïque du feu tout en employant « colère », terme fort, naturel et actuel pour עֶבְרָה.
- source_word: דִּבַּרְתִּי
  choice: j’ai parlé
  rationale: Le passé composé rend l’accompli hébreu comme une parole solennellement prononcée et toujours valable.
- source_word: אִם לֹא
  choice: oui
  rationale: Dans cet emploi de serment ou d’affirmation solennelle, אִם לֹא ne constitue pas une condition littérale ; « oui » en restitue la valeur emphatique sans ajouter explicitement une formule de serment.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Cette tournure française naturelle conserve la formule temporelle prophétique.
- source_word: יִהְיֶה
  choice: il y aura
  rationale: Le verbe היה a ici une valeur existentielle, rendue naturellement en français par « il y aura ».
- source_word: רַעַשׁ גָּדוֹל
  choice: un grand tremblement
  rationale: רַעַשׁ désigne une secousse, un tremblement ou, selon le contexte, un séisme. Le terme plus général « tremblement » préserve l’étendue sémantique de l’hébreu ; la note signale la traduction contextuelle « tremblement de terre ».
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: sur la terre d’Israël
  rationale: אַדְמָה désigne le sol ou la terre. « Terre d’Israël » conserve le sens spatial concret et le registre prophétique, tandis que « sur » rend directement עַל.
theological_decisions:
- issue: Conserver sans l’atténuer le langage des émotions divines
  choice: ma jalousie… le feu de ma colère
  alternative: mon zèle… l’ardeur de ma fureur
  rationale: L’hébreu attribue à Dieu une jalousie et une colère fortes et personnelles. La traduction maintient cette tension sans la réduire à un jugement impersonnel ni lui ajouter une explication doctrinale.
- issue: Identifier le locuteur divin sans ajouter de formule absente du verset
  choice: Maintien de la première personne sans incise explicative
  alternative: Ajouter « dit le Seigneur »
  rationale: Le contexte identifie déjà Dieu comme locuteur ; une incise supplémentaire dépasserait le texte hébreu du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme solennel de l’hébreu, tout en évitant des termes vieillissants comme « courroux ». Le marqueur de note est placé après le mot auquel porte l’alternative lexicale.
