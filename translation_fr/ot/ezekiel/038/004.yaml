    issue: Formulation des deux types de boucliers
    rationale: « le grand et le petit bouclier » est une tournure collective raide en français et peut évoquer deux objets précis. Le pluriel indéfini rend plus naturellement la troupe munie de ces armes tout en préservant la distinction des deux termes hébreux.
  - severity: low
    issue: Nombre de « épées »
    rationale: Le pluriel חֲרָבוֹת est mieux représenté par « des épées » que par le générique singulier « l’épée ».
