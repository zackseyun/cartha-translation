  text: וְ/שׁ֣וֹבַבְתִּ֔י/ךָ וְ/נָתַתִּ֥י חַחִ֖ים בִּ/לְחָיֶ֑י/ךָ וְ/הוֹצֵאתִי֩ אוֹתְ/ךָ֨ וְ/אֶת כָּל חֵילֶ֜/ךָ סוּסִ֣ים וּ/פָרָשִׁ֗ים לְבֻשֵׁ֤י מִכְלוֹל֙ כֻּלָּ֔/ם קָהָ֥ל רָב֙ צִנָּ֣ה וּ/מָגֵ֔ן תֹּפְשֵׂ֥י חֲרָב֖וֹת כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/004.yaml
  text: I will turn you around[a], put hooks in your jaws, and bring you out—you and all your army, horses and horsemen, all of them clothed in full armor, a great assembly with shield and buckler[b], all of them wielding swords.
translation:
  language: fr
  text: 'Je te ferai faire demi-tour[a], je mettrai des crochets dans tes mâchoires et je te ferai sortir, toi et toute ton armée : chevaux et cavaliers, tous revêtus d’un équipement complet, une vaste assemblée munie de grands boucliers et de petits boucliers[b], tous maniant des épées.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je te ramènerai ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie deux mots différents, qui désignent probablement un grand bouclier et un bouclier plus petit.
    reason: cultural_note
lexical_decisions:
- source_word: וְשׁוֹבַבְתִּיךָ
  choice: Je te ferai faire demi-tour
  rationale: Le causatif exprime que YHWH réoriente Gog. Cette formulation française conserve l’action divine et l’image d’un changement de direction sans préciser indûment l’itinéraire.
- source_word: חַחִים בִּלְחָיֶיךָ
  choice: des crochets dans tes mâchoires
  rationale: חַחִים désigne des crochets ou anneaux servant à maîtriser, tandis que לְחָיַיִם peut désigner les mâchoires ou les joues. « Mâchoires » convient naturellement à l’image concrète du contrôle.
- source_word: וְהוֹצֵאתִי אוֹתְךָ
  choice: je te ferai sortir
  rationale: Le hiphil de יצא signifie « faire sortir ». La formulation maintient explicitement YHWH comme agent de l’action.
- source_word: חֵילֶךָ
  choice: ton armée
  rationale: Dans ce contexte militaire, חַיִל désigne les forces ou les troupes de Gog.
- source_word: סוּסִים וּפָרָשִׁים
  choice: chevaux et cavaliers
  rationale: Cette traduction directe conserve les deux éléments de l’expression hébraïque au lieu de les condenser en « cavalerie ».
- source_word: לְבֻשֵׁי מִכְלוֹל
  choice: revêtus d’un équipement complet
  rationale: Le sens précis de מִכְלוֹל est discuté. Dans le contexte militaire, il s’agit vraisemblablement d’un équipement complet; cette formulation évite toutefois de réduire avec certitude l’expression à une armure.
- source_word: קָהָל רָב
  choice: une vaste assemblée
  rationale: קָהָל désigne un groupe rassemblé; ici, une masse militaire nombreuse.
- source_word: צִנָּה וּמָגֵן
  choice: le grand et le petit bouclier
  rationale: Les deux termes hébreux désignent vraisemblablement deux types ou tailles de boucliers. Les expliciter est plus intelligible en français moderne que d’employer « targe » ou « bocle ».
- source_word: תֹּפְשֵׂי חֲרָבוֹת
  choice: maniant l’épée
  rationale: Le participe signifie littéralement saisir ou tenir des épées; « maniant l’épée » exprime naturellement leur préparation militaire.
- source_word: כֻּלָּם
  choice: tous
  rationale: La répétition hébraïque est maintenue deux fois afin de conserver l’insistance sur l’ensemble des forces.
theological_decisions:
- issue: L’action divine dans la mobilisation de Gog
  choice: YHWH fait activement changer Gog de direction, le maîtrise et le fait sortir avec son armée.
  alternative: Comprendre les verbes dans un sens seulement permissif, comme si Dieu se bornait à laisser venir Gog.
  rationale: La série de verbes causatifs à la première personne présente une action divine forte. La traduction conserve cette tension sans expliquer le rapport entre la souveraineté divine et les intentions de Gog.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement correspond à l’adresse singulière faite à Gog. La ponctuation clarifie l’apposition militaire tout en conservant la longue accumulation et les répétitions du texte hébreu.
