  to: 'Je te ferai faire demi-tour[a], je mettrai des crochets dans tes mâchoires et je te ferai sortir, toi et toute ton armée : chevaux et cavaliers, tous revêtus d’un équipement complet, une vaste assemblée munie de grands boucliers et de petits boucliers[b], tous maniant des épées.'
  rationale: 'La révision se limite à deux ajustements sûrs : elle remplace une expression française maladroite par une formulation collective naturelle qui garde la distinction entre les deux boucliers, et elle restitue le pluriel des épées. Elle ne résout pas davantage l’incertitude lexicale, laquelle demeure signalée par la note.'
