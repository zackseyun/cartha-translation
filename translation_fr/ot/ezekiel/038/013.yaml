base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/013.yaml
  text: Sheba and Dedan and the merchants of Tarshish, with all her young lions, will say to you, ‘Have you come to take plunder? Have you assembled your company to seize silver and gold, to take livestock and goods, to take great plunder?’
translation:
  language: fr
  text: 'Saba, Dedân, les marchands de Tarsis et tous ses jeunes lions[a] te diront : « Est-ce pour emporter du butin que tu es venu ? Est-ce pour emporter du butin que tu as rassemblé tes troupes, afin d’emporter de l’argent et de l’or, de prendre du bétail et des biens, et d’emporter un grand butin ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « jeunes lions » peut désigner, de façon imagée, des chefs, des puissants ou des partenaires dépendant de Tarsis ; son sens précis est incertain.
    reason: L’hébreu emploie clairement l’image des « jeunes lions », mais son référent dans ce contexte reste discuté.
lexical_decisions:
- source_word: שְׁבָא וּדְדָן
  choice: Saba, Dedân
  rationale: Formes françaises traditionnelles et reconnaissables des noms géographiques.
- source_word: סֹחֲרֵי תַרְשִׁישׁ
  choice: les marchands de Tarsis
  rationale: Rend directement le statut commercial du groupe et conserve le toponyme sous sa forme française usuelle.
- source_word: כְּפִירֶיהָ
  choice: ses jeunes lions
  rationale: Traduction formelle de l’image hébraïque, dont le référent est ambigu; une note expose les principales possibilités sans trancher.
- source_word: שָׁלָל / בַּז
  choice: butin / piller
  rationale: La variation française reflète les deux racines hébraïques proches tout en gardant la répétition rhétorique autour du pillage.
- source_word: קְהָלֶךָ
  choice: tes troupes
  rationale: Dans ce contexte militaire, le rassemblement désigne la force assemblée par l’envahisseur; « troupes » est naturel et contextuellement précis.
- source_word: מִקְנֶה וְקִנְיָן
  choice: du bétail et des biens
  rationale: Distingue les animaux possédés des autres possessions ou richesses acquises.
- source_word: שָׁלָל גָּדוֹל
  choice: un immense butin
  rationale: Rend l’intensité de גָּדוֹל dans un français idiomatique.
theological_decisions:
- issue: Identité des « jeunes lions » de Tarsis
  choice: Conserver l’image « jeunes lions » dans le texte
  alternative: « ses puissants », « ses chefs » ou « ses villages »
  rationale: Le texte massorétique porte clairement le terme imagé « jeunes lions », mais sa portée métaphorique demeure incertaine. La traduction ne doit pas imposer une identification politique ou sociale.
- issue: Tonalité des questions adressées à Gog
  choice: Les rendre comme des questions directes, sans préciser s’il s’agit d’un reproche, d’une approbation ou d’un intérêt commercial
  alternative: Ajouter une nuance explicitement accusatrice ou complice
  rationale: L’hébreu formule des questions sur le but de l’expédition sans expliciter les motivations des interlocuteurs; l’ambiguïté narrative est préservée.
translation_notes:
  register: Français moderne, soutenu sans archaïsme. La structure interrogative et l’accumulation de verbes de prise reproduisent l’insistance du texte hébreu, tandis que « tes troupes » évite le peu naturel « ton assemblée » dans ce contexte militaire.
