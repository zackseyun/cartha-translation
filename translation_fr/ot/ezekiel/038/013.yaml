  terminology: « Saba », « Dedân », « Tarsis », « marchands », « jeunes lions », « bétail » et « biens » conviennent. « Tes troupes » est une contextualisation militaire naturelle de « ton assemblée/ton rassemblement » sans excès interprétatif. La note conserve l’image sans imposer l’identification de ses référents.
