  terminology: « Murailles », « habitent en sécurité » et « portes » conviennent. « Barres » rend mieux בְּרִיחַ que « verrous » ; le pluriel français est idiomatique dans cette description collective, bien que les formes hébraïques soient au singulier pour « muraille » et « barre ».
