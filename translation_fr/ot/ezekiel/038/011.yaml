  text: וְ/אָמַרְתָּ֗ אֶֽעֱלֶה֙ עַל אֶ֣רֶץ פְּרָז֔וֹת אָבוֹא֙ הַ/שֹּׁ֣קְטִ֔ים יֹשְׁבֵ֖י לָ/בֶ֑טַח כֻּלָּ֗/ם יֹֽשְׁבִים֙ בְּ/אֵ֣ין חוֹמָ֔ה וּ/בְרִ֥יחַ וּ/דְלָתַ֖יִם אֵ֥ין לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/011.yaml
  text: and you will say[a], ‘I will go up against a land of unwalled villages; I will come against those who are at rest, who dwell securely, all of them dwelling without walls[d][c][b], and having no bars or gates.’
translation:
  language: fr
  text: 'Tu diras : « Je monterai contre un pays de villages sans murailles[a] ; je viendrai vers ceux qui vivent tranquilles et habitent en sécurité. Tous habitent sans murailles et n’ont ni barres ni portes[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un pays ouvert » ou « un pays de localités rurales » ; le terme hébreu désigne des lieux dépourvus de murailles défensives.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sans muraille, et ils n’ont ni barre ni portes ». Les singuliers hébreux pour « muraille » et « barre » peuvent ici avoir une valeur collective ; « portes » traduit un terme de forme duel.'
    reason: formal_equivalence
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Tu diras
  rationale: Le parfait avec waw dans ce discours prophétique a une valeur future ou séquentielle. Le futur simple est naturel en français.
- source_word: אֶעֱלֶה
  choice: Je monterai contre
  rationale: עלה exprime le mouvement vers le haut. La préposition française « contre » rend ici la cible hostile introduite par עַל sans effacer le verbe de mouvement.
- source_word: אֶרֶץ פְּרָזוֹת
  choice: un pays de villages sans murailles
  rationale: פְּרָזוֹת désigne des lieux ouverts, dépourvus d’enceintes défensives. Cette formulation concrète prépare la reprise sur l’absence de murailles.
- source_word: אָבוֹא
  choice: j’irai vers
  rationale: בוא signifie directement « venir/aller, entrer ». Le contexte est hostile, mais « vers » conserve la valeur du mouvement sans introduire dans ce second verbe un « contre » absent du texte.
- source_word: הַשֹּׁקְטִים
  choice: des gens tranquilles
  rationale: Le participe décrit des personnes paisibles, au repos ou non inquiétées. « Gens tranquilles » est clair et actuel.
- source_word: יֹשְׁבֵי לָבֶטַח
  choice: qui habitent en sécurité
  rationale: La locution conserve le sens d’habitation de ישב et celui de sûreté ou confiance de לָבֶטַח.
- source_word: כֻּלָּם יֹשְׁבִים
  choice: Tous habitent
  rationale: Une proposition indépendante rend clairement la reprise explicative du participe ישב et évite une chaîne participiale lourde en français.
- source_word: בְּאֵין חוֹמָה
  choice: sans murailles
  rationale: Le singulier hébreu חוֹמָה peut avoir une valeur collective. Le pluriel français est idiomatique pour plusieurs villages et leurs enceintes.
- source_word: וּבְרִיחַ
  choice: verrous
  rationale: בְּרִיחַ désigne une barre ou un verrou servant à fermer une porte ou une porte de ville. « Verrous » convient naturellement au dispositif défensif.
- source_word: וּדְלָתַיִם
  choice: portes
  rationale: דְּלָתַיִם signifie directement « doubles portes/portes ». « Portes » préserve le lexème sans imposer « portes de ville ».
- source_word: אֵין לָהֶם
  choice: n’ont ni… ni…
  rationale: La tournure possessive française rend naturellement l’absence exprimée par אֵין לָהֶם et coordonne les deux éléments.
theological_decisions:
- issue: Force hostile de אָבוֹא
  choice: j’irai vers
  alternative: je viendrai contre / j’attaquerai
  rationale: L’intention hostile ressort déjà de « monterai contre » et du contexte. Le second verbe est laissé plus proche de son sens lexical afin de ne pas résoudre inutilement sa nuance directionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation sépare la dernière proposition explicative pour restituer le mouvement rhétorique de l’hébreu. Les répétitions liées à l’habitation et à l’absence de défenses sont conservées.
