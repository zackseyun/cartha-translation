  text: וְ/הִתְגַּדִּלְתִּי֙ וְ/הִתְקַדִּשְׁתִּ֔י וְ/נ֣וֹדַעְתִּ֔י לְ/עֵינֵ֖י גּוֹיִ֣ם רַבִּ֑ים וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/023.yaml
  text: I will show myself great and show myself holy[a], and I will make myself known in the sight of many nations[b]. Then they will know that I am Yahweh.
translation:
  language: fr
  text: Je manifesterai ma grandeur et ma sainteté[a], et je me ferai connaître aux yeux de nombreuses nations. Alors elles sauront que je suis Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus littérale : « Je me montrerai grand, je me montrerai saint et je serai connu. » Les deux premiers verbes hébreux sont de forme réfléchie, et le troisième de forme passive ; le texte principal en exprime le sens dans un français naturel.'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « YHWH », nom divin traditionnellement rendu en français par « l’Éternel » ou, dans certaines traditions, par « le Seigneur ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִתְגַּדִּלְתִּי
  choice: Je manifesterai ma grandeur
  rationale: Le hitpael de גדל exprime ici la grandeur que Dieu fait publiquement apparaître par son action. Cette formulation française garde la portée réflexive de l’hébreu sans suggérer que Dieu chercherait à accroître une grandeur qui lui manquerait.
- source_word: וְהִתְקַדִּשְׁתִּי
  choice: ma sainteté
  rationale: Coordonné à « manifesterai », le syntagme exprime la manifestation publique de la sainteté divine. « Je me sanctifierai » serait plus formel, mais pourrait laisser entendre à tort que Dieu devient saint.
- source_word: וְנוֹדַעְתִּי
  choice: je me ferai connaître
  rationale: Le niphal de ידע peut signifier « être connu ». Dans cette suite de verbes à la première personne, « je me ferai connaître » rend naturellement l’action divine de se révéler publiquement, tout en conservant la possibilité formelle dans la note.
- source_word: לְעֵינֵי
  choice: aux yeux de
  rationale: Cette expression idiomatique conserve l’image visuelle et souligne que la manifestation a lieu publiquement devant les nations.
- source_word: גּוֹיִם רַבִּים
  choice: de nombreuses nations
  rationale: « Nations » convient au cadre collectif et géopolitique d’Ézéchiel. « Gentils » introduirait une opposition religieuse ultérieure qui n’est pas mise en avant ici.
- source_word: וְיָדְעוּ
  choice: elles sauront
  rationale: Le qal de ידע est rendu directement et préserve la formule de reconnaissance fréquente dans Ézéchiel. Le pronom féminin reprend naturellement « nations ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer le titre traditionnel « le Seigneur ».
theological_decisions:
- issue: Expression de la manifestation publique de la grandeur et de la sainteté divines
  choice: « Je manifesterai ma grandeur et ma sainteté »
  alternative: « Je me montrerai grand et saint » ou, plus formellement, « Je me grandirai et me sanctifierai »
  rationale: Le choix retenu communique en français courant que Dieu révèle publiquement ce qu’il est. Il évite de faire croire qu’il acquiert grandeur ou sainteté, tout en signalant dans la note la forme réflexive des verbes hébreux.
- issue: Valeur du niphal וְנוֹדַעְתִּי
  choice: « je me ferai connaître »
  alternative: « je serai connu »
  rationale: La formulation retenue fait ressortir l’initiative divine dans le contexte, sans exclure la valeur passive plus formelle, donnée en note.
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: « le Seigneur » ou « Jéhovah »
  rationale: « Yahweh » préserve le caractère de nom propre du tétragramme. Une note renseigne le lecteur sur la substitution traditionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la progression des trois verbes hébreux et la visibilité publique exprimée par « aux yeux de ». Les marqueurs de notes sont placés après « sainteté » pour l’alternative verbale et après « Yahweh » pour la note sur le nom divin.
