  text: הִכֹּן֙ וְ/הָכֵ֣ן לְ/ךָ֔ אַתָּ֕ה וְ/כָל קְהָלֶ֖/ךָ הַ/נִּקְהָלִ֣ים עָלֶ֑י/ךָ וְ/הָיִ֥יתָ לָ/הֶ֖ם לְ/מִשְׁמָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/007.yaml
  text: Be prepared[b][a], and prepare yourself—you and all your assembly who are gathered around you—and be a guard for them.
translation:
  language: fr
  text: Tiens-toi prêt et prépare-toi[a], toi et toute la troupe rassemblée autour de toi, et veille sur eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Mets-toi en état, oui, prépare-toi ». Les deux verbes apparentés renforcent l’ordre de se tenir prêt et de faire les préparatifs nécessaires.
    reason: lexical_alternative
  - marker: b
    text: Ou « sois leur gardien » ou « prends-les sous ta responsabilité ». Le mot hébreu peut évoquer la garde, la surveillance ou la prise en charge.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכֹּן וְהָכֵן לְךָ
  choice: Tiens-toi prêt et prépare-toi
  rationale: Les deux impératifs de כון expriment et renforcent l’appel à la disponibilité et à une préparation active. Cette formulation naturelle en français conserve leur parallélisme sans les confondre.
- source_word: קְהָלֶךָ
  choice: toute la troupe
  rationale: קָהָל désigne ici le groupe assemblé autour de Gog. Dans ce contexte militaire, « troupe » est naturel tout en restant moins spécifique que « armée ».
- source_word: הַנִּקְהָלִים עָלֶיךָ
  choice: rassemblée autour de toi
  rationale: Le participe de קהל décrit ceux qui se rassemblent auprès de Gog; « autour de toi » rend idiomatiquement עָלֶיךָ dans ce contexte.
- source_word: וְהָיִיתָ לָהֶם לְמִשְׁמָר
  choice: et veille sur eux
  rationale: מִשְׁמָר peut évoquer la garde, la surveillance ou la responsabilité exercée sur un groupe. « Veille sur eux » est idiomatique et conserve l’idée centrale sans préciser indûment la fonction de Gog.
theological_decisions:
- issue: Nature exacte du rôle confié à Gog envers les troupes assemblées
  choice: veille sur eux
  alternative: sois leur gardien / prends-les sous ta responsabilité
  rationale: Le terme מִשְׁמָר ne permet pas de trancher avec certitude entre protection, surveillance et prise en charge. Le texte principal garde une formulation large, et la note signale l’ambiguïté.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement correspond à l’adresse directe au singulier. « Troupe » convient au cadre militaire sans transformer explicitement l’assemblée en armée; « veille sur eux » préserve l’indétermination du rôle exprimé par מִשְׁמָר.
