  text: וְ/קָרָ֨אתִי עָלָ֤י/ו לְ/כָל הָרַ/י֙ חֶ֔רֶב נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה חֶ֥רֶב אִ֖ישׁ בְּ/אָחִ֥י/ו תִּֽהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/021.yaml
  text: And I will summon a sword against him on all my mountains[a], declares the Lord GOD; every man's sword will be against his brother.
translation:
  language: fr
  text: Je ferai venir l’épée contre lui sur toutes mes montagnes, déclare le Seigneur Yahweh ; l’épée de chacun sera contre son frère.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְקָרָאתִי
  choice: J’appellerai
  rationale: Le verbe קרא signifie ici appeler ou faire venir l’instrument du jugement. « J’appellerai » reste proche de l’image hébraïque tout en étant naturel en français.
- source_word: עָלָיו
  choice: contre lui
  rationale: Dans ce contexte de jugement dirigé contre Gog, עַל exprime une orientation hostile.
- source_word: לְכָל הָרַי
  choice: sur toutes mes montagnes
  rationale: La formule situe le jugement dans l’ensemble des montagnes que Yahweh appelle siennes ; elle conserve le possessif et la tournure spatiale du texte.
- source_word: חֶרֶב
  choice: l’épée
  rationale: Le français emploie naturellement l’article défini pour personnifier ou désigner l’épée comme instrument de jugement, aux deux occurrences.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclare le Seigneur Yahweh
  rationale: נְאֻם introduit une déclaration divine solennelle. « Seigneur Yahweh » distingue le titre אֲדֹנָי du nom divin יְהוָה.
- source_word: חֶרֶב אִישׁ בְּאָחִיו תִּהְיֶה
  choice: l’épée de chacun se tournera contre son frère
  rationale: Cette formulation restitue la valeur distributive de אִישׁ et l’hostilité exprimée par בְּ, tout en rendant explicite en français le retournement mutuel des combattants sans ajouter une cause absente du verset.
theological_decisions:
- issue: Rendu du nom divin יְהוָה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte distingue le titre אֲדֹנָי du nom propre יְהוָה. « Le Seigneur Yahweh » préserve cette distinction et évite de remplacer silencieusement le nom divin par un titre.
- issue: Nature de la violence annoncée
  choice: l’épée de chacun se tournera contre son frère
  alternative: chacun tirera l’épée contre son frère
  rationale: Le sujet grammatical est « l’épée », non la personne. Conserver cette image respecte la formulation du texte et n’explicite pas davantage le mécanisme du jugement.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure prophétique reste concise et solennelle ; « frère » est conservé pour désigner ici un compagnon d’armes ou membre du même camp.
