    rationale: Le verbe hébreu תִּהְיֶה signifie ici « sera ». « Se tournera » introduit une dynamique de retournement absente du texte, même si elle peut correspondre au contexte.
  - severity: low
    issue: Formulation initiale peu naturelle
    rationale: La succession « appellerai contre lui l’épée sur » est lourde en français. « Je ferai venir l’épée contre lui sur » rend naturellement l’appel de l’instrument de jugement sans modifier le sens.
