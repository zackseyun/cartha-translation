source:
  edition: WLC
  text: בֶּן אָדָ֗ם שִׂ֤ים פָּנֶ֨י/ךָ֙ אֶל גּוֹג֙ אֶ֣רֶץ הַ/מָּג֔וֹג נְשִׂ֕יא רֹ֖אשׁ מֶ֣שֶׁךְ וְ/תֻבָ֑ל וְ/הִנָּבֵ֖א עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/002.yaml
  text: Son of man, set your face toward Gog, of the land of Magog, the chief prince of Meshech and Tubal, and prophesy against him.
translation:
  language: fr
  text: Fils d’homme, tourne ton visage vers Gog, du pays de Magog, prince suprême[a] de Méshek et de Toubal, et prophétise contre lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une lecture ancienne : « le prince de Rosh, de Méshek et de Toubal ». Le terme hébreu rosh signifie habituellement « tête, chef, principal », mais il peut aussi être compris comme un nom propre.'
    reason: Signale sans la trancher l’ambiguïté reconnue de רֹאשׁ.
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: Fils d’homme
  rationale: Rend littéralement l’appellation récurrente adressée à Ézéchiel, dans une formulation française consacrée et compréhensible.
- source_word: שִׂים פָּנֶיךָ אֶל
  choice: tourne ton visage vers
  rationale: Préserve l’image hébraïque d’une orientation résolue vers la cible de l’oracle, sans la réduire à un simple « dirige-toi vers ».
- source_word: גּוֹג אֶרֶץ הַמָּגוֹג
  choice: Gog, du pays de Magog
  rationale: Conserve les noms propres et rattache naturellement Gog au pays de Magog.
- source_word: נְשִׂיא רֹאשׁ
  choice: prince suprême
  rationale: Comprend רֹאשׁ comme un nom commun au sens de « tête, chef, principal », qualifiant נְשִׂיא, plutôt que comme le nom propre incertain « Rosh ».
- source_word: מֶשֶׁךְ וְתֻבָל
  choice: Méchek et de Toubal
  rationale: Transcrit les deux noms de peuples ou territoires et les coordonne comme dépendants de « prince suprême ».
- source_word: וְהִנָּבֵא עָלָיו
  choice: et prophétise contre lui
  rationale: Dans ce contexte d’oracle hostile, עַל indique que la prophétie est dirigée contre Gog.
theological_decisions:
- issue: Interprétation de רֹאשׁ
  choice: 'Adjectif ou substantif qualificatif : « suprême »'
  alternative: 'Nom propre : « Rosh » (« prince de Rosh, de Méchek et de Toubal »)'
  rationale: L’usage courant de רֹאשׁ et la construction permettent naturellement le sens de chef ou principal. Le texte ne contraint pas à identifier un peuple nommé Rosh, lecture qui demeure néanmoins grammaticalement discutée.
translation_notes:
  register: 'Français moderne, digne et direct. La métaphore « tourne ton visage » est maintenue en raison de son importance dans la phraséologie prophétique d’Ézéchiel. Les noms sont francisés selon un usage biblique lisible : Méchek, Toubal.'
