source:
  edition: WLC
  text: לָ/כֵן֙ הִנָּבֵ֣א בֶן אָדָ֔ם וְ/אָמַרְתָּ֣ לְ/ג֔וֹג כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הֲ/ל֣וֹא בַּ/יּ֣וֹם הַ/ה֗וּא בְּ/שֶׁ֨בֶת עַמִּ֧/י יִשְׂרָאֵ֛ל לָ/בֶ֖טַח תֵּדָֽע־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/014.yaml
  text: 'Therefore prophesy[a], son of man, and say to Gog, ‘Thus says the Lord GOD: On that day, when my people Israel dwell securely, will you not know it?’'
translation:
  language: fr
  text: 'C’est pourquoi, prophétise, fils d’homme, et dis à Gog : « Voici ce que dit le Seigneur Yahweh : Ce jour-là, quand mon peuple Israël habitera en sécurité[a], ne le sauras-tu pas ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vivra sans crainte ». L’expression hébraïque peut désigner le fait de vivre en sécurité, avec confiance ou sans inquiétude.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque naturellement en français la conséquence tirée du contexte précédent.
- source_word: הִנָּבֵא
  choice: prophétise
  rationale: Rend directement l’impératif adressé à Ézéchiel.
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: Conserve l’adresse récurrente propre au livre d’Ézéchiel et sa continuité littéraire.
- source_word: וְאָמַרְתָּ לְגוֹג
  choice: et dis à Gog
  rationale: Exprime simplement la seconde instruction qui suit l’impératif.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Formulation prophétique solennelle, mais naturelle en français moderne.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Distingue le titre אֲדֹנָי du nom divin יהוה sans produire la répétition « Seigneur Seigneur ».
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Équivalent idiomatique de la formule temporelle prophétique.
- source_word: בְּשֶׁבֶת עַמִּי יִשְׂרָאֵל
  choice: quand mon peuple Israël habitera
  rationale: Rend la valeur temporelle de l’infinitif construit et l’état envisagé dans l’avenir.
- source_word: לָבֶטַח
  choice: en sécurité
  rationale: Exprime clairement une situation de sûreté; « dans l’insouciance » reste une nuance contextuellement possible.
- source_word: הֲלוֹא ... תֵּדָע
  choice: ne le sauras-tu pas ?
  rationale: Préserve la question rhétorique qui appelle une réponse affirmative; le pronom « le » explicite en français l’objet implicite.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte associe un titre et le tétragramme; « le Seigneur Yahweh » maintient cette distinction et rend explicitement le nom divin.
- issue: Portée de la question הֲלוֹא ... תֵּדָע
  choice: 'question rhétorique : « ne le sauras-tu pas ? »'
  alternative: 'affirmation : « tu le sauras certainement »'
  rationale: La particule interrogative הֲלוֹא favorise une question attendant une réponse affirmative; la formulation conserve cette tension plutôt que de la convertir en assertion.
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique est rendue de façon solennelle sans archaïsme. Le nom Yahweh est conservé dans le titre composé.
