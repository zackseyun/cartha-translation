source:
  edition: WLC
  text: לִ/שְׁלֹ֥ל שָׁלָ֖ל וְ/לָ/בֹ֣ז בַּ֑ז לְ/הָשִׁ֨יב יָדְ/ךָ֜ עַל חֳרָב֣וֹת נוֹשָׁבֹ֗ת וְ/אֶל עַם֙ מְאֻסָּ֣ף מִ/גּוֹיִ֔ם עֹשֶׂה֙ מִקְנֶ֣ה וְ/קִנְיָ֔ן יֹשְׁבֵ֖י עַל טַבּ֥וּר הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/012.yaml
  text: to seize spoil and to carry off plunder[a], to turn your hand against ruins now inhabited and against a people gathered from the nations, who have acquired livestock and goods, who dwell at the center of the earth.
translation:
  language: fr
  text: pour saisir du butin et emporter des dépouilles, pour porter la main sur des ruines désormais habitées et sur un peuple rassemblé d’entre les nations, qui a acquis du bétail et des biens et qui habite au centre de la terre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur le nombril de la terre » ; expression désignant le centre ou le milieu du pays, de la terre ou du monde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹל שָׁלָל
  choice: pour saisir du butin
  rationale: L’infinitif suivi d’un nom de même racine renforce l’idée de pillage. « Saisir du butin » reste naturel en français tout en gardant l’action énergique.
- source_word: וְלָבֹז בַּז
  choice: et emporter des dépouilles
  rationale: Cette seconde construction à infinitif et complément de même racine est parallèle à la première. La formulation française évite une répétition artificielle tout en exprimant clairement l’enlèvement du produit du pillage.
- source_word: לְהָשִׁיב יָדְךָ
  choice: pour porter la main sur
  rationale: L’expression hébraïque signifie ici diriger son action ou sa puissance contre une cible. « Porter la main sur » conserve la métaphore corporelle dans un français idiomatique.
- source_word: חֳרָבוֹת נוֹשָׁבוֹת
  choice: des ruines désormais habitées
  rationale: La formulation préserve la tension entre l’état antérieur de dévastation et le repeuplement présent.
- source_word: עַם מְאֻסָּף מִגּוֹיִם
  choice: un peuple rassemblé d’entre les nations
  rationale: Le participe passif décrit un peuple regroupé à partir de plusieurs nations; « d’entre » rend explicite cette provenance sans ajouter d’interprétation doctrinale.
- source_word: עֹשֶׂה מִקְנֶה וְקִנְיָן
  choice: qui a acquis du bétail et des biens
  rationale: Avec ces compléments, עֹשֶׂה désigne l’acquisition ou l’accumulation plutôt que la fabrication. « Bétail et biens » couvre les richesses animales et les autres possessions.
- source_word: יֹשְׁבֵי עַל טַבּוּר הָאָרֶץ
  choice: qui habite au centre de la terre
  rationale: טַבּוּר signifie littéralement « nombril » et désigne métaphoriquement le milieu ou le centre. Le singulier « qui habite » reprend grammaticalement « un peuple », tandis que la note conserve l’image hébraïque et l’ambiguïté de אֶרֶץ entre terre, pays et monde.
theological_decisions:
- issue: Géographie métaphorique de טַבּוּר הָאָרֶץ
  choice: au centre de la terre
  alternative: sur le nombril de la terre
  rationale: La traduction idiomatique communique la position centrale sans transformer la métaphore en affirmation cosmologique. La note donne toutefois l’image littérale et signale l’étendue sémantique possible de אֶרֶץ.
translation_notes:
  register: Français international actuel, digne et accessible. Le verset étant syntaxiquement rattaché au contexte précédent, la traduction conserve sa forme de proposition de but. Les deux expressions de pillage restent parallèles sans reproduire mécaniquement en français les répétitions de racine hébraïques.
