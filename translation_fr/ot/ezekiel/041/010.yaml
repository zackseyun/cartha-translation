lexical_decisions:
- source_word: וּבֵין הַלְּשָׁכוֹת
  choice: Entre les chambres
  rationale: Le syntagme introduit un nouvel élément architectural. « Chambres » reste proche du terme hébreu sans préciser abusivement qu’elles sont latérales.
- source_word: רֹחַב עֶשְׂרִים אַמָּה
  choice: un espace large de vingt coudées
  rationale: La proposition nominale indique la largeur de l’intervalle. En français, « un espace large de » rend clairement la mesure implicite tout en conservant la coudée biblique.
- source_word: לַבַּיִת
  choice: le temple
  rationale: Dans cette vision, בַּיִת désigne l’édifice du temple plutôt qu’une maison ordinaire.
- source_word: סָבִיב ... סָבִיב סָבִיב
  choice: tout autour, de tous côtés
  rationale: Cette formulation naturelle conserve l’insistance produite par la triple occurrence de סָבִיב sans imposer une répétition française excessivement lourde.
