  text: And between the chambers was a width of twenty cubits all around the temple[a], all around.
translation:
  language: fr
  text: Entre les chambres, il y avait un espace de vingt coudées de large tout autour du temple, tout autour, tout autour.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
