  text: וּ/מָדַ֣ד אֶת הַ/בַּ֔יִת אֹ֖רֶךְ מֵאָ֣ה אַמָּ֑ה וְ/הַ/גִּזְרָ֤ה וְ/הַ/בִּנְיָה֙ וְ/קִ֣ירוֹתֶ֔י/הָ אֹ֖רֶךְ מֵאָ֥ה אַמָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/013.yaml
  text: 'Then he measured the temple: its length was a hundred cubits; and the separate area[a], the building, and its walls had a length of a hundred cubits.'
translation:
  language: fr
  text: 'Puis il mesura le temple : il avait cent coudées de long. L’espace séparé[a], le bâtiment et ses murs avaient cent coudées de long.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’emplacement séparé ». Le terme hébreu désigne un espace distinct, mis à part dans l’ensemble du temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָדַד
  choice: Puis il mesura
  rationale: Le waw suivi de l’accompli fait progresser le récit; « Puis » exprime naturellement cette succession.
- source_word: הַבַּיִת
  choice: le temple
  rationale: Dans la vision d’Ézéchiel, le terme désigne ici l’édifice du temple, et non une maison ordinaire.
- source_word: אֹרֶךְ מֵאָה אַמָּה
  choice: avait cent coudées de long
  rationale: Cette formulation française restitue clairement l’expression hébraïque de mesure tout en conservant l’unité ancienne.
- source_word: הַגִּזְרָה
  choice: l’espace séparé
  rationale: Le terme désigne un emplacement distinct, mis à part dans l’ensemble du temple; cette traduction reste précise sans en définir davantage la fonction.
- source_word: הַבִּנְיָה
  choice: le bâtiment
  rationale: Équivalent courant et clair du nom hébreu désignant une construction.
- source_word: קִירוֹתֶיהָ
  choice: ses murs
  rationale: Le pluriel muni du suffixe féminin renvoie naturellement au bâtiment, nom féminin en hébreu comme en français; « ses murs » préserve la concision de l’original.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La ponctuation répartit les deux mesures en phrases brèves pour éviter une coordination lourde, sans ajouter de relation absente de l’hébreu.
