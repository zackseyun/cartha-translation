  yaml_path: translation/ot/ezekiel/041/001.yaml
  text: 'Then he brought me into the nave and measured the jambs: six cubits wide on one side and six cubits wide on the other side—the width of the tent[a][b].'
translation:
  language: fr
  text: 'Puis il me fit entrer dans la grande salle[a] et mesura les montants : six coudées de largeur d’un côté et six coudées de largeur de l’autre — la largeur de la tente[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « salle principale » ou « sanctuaire ». Le mot hébreu désigne ici la pièce principale de l’édifice du temple, et non l’ensemble du complexe.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « tente ». Dans le contexte de cette vision du temple, certains comprennent ce mot comme une désignation architecturale technique et traduisent « tabernacle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיכָל
  choice: grande salle
  rationale: Dans cette vision du temple, le terme désigne la pièce principale de l’édifice, distincte du sanctuaire intérieur. « Grande salle » est clair en français courant et évite de faire penser à l’ensemble du complexe.
- source_word: אֵילִים
  choice: montants
  rationale: Dans ce contexte architectural, le mot désigne les éléments latéraux qui encadrent l’entrée. « Montants » convient mieux que « colonnes », qui évoquerait des supports indépendants.
- source_word: אַמּוֹת
  choice: coudées
  rationale: Terme français traditionnel pour cette ancienne unité de longueur; il préserve le système de mesure du texte source.
- source_word: רֹחַב
  choice: largeur / de largeur
  rationale: Le nom exprime la largeur. La tournure « six coudées de largeur » est naturelle, tandis que la dernière occurrence est rendue par « la largeur ».
- source_word: מִפּוֹ ... מִפּוֹ
  choice: d’un côté ... de l’autre
  rationale: Les deux expressions déictiques désignent les côtés correspondants de l’entrée; cette formulation est idiomatique en français.
- source_word: אֹהֶל
  choice: tente
  rationale: Le sens lexical ordinaire est « tente ». Le conserver respecte l’étrangeté réelle du texte hébreu, tandis qu’une note signale l’interprétation architecturale possible.
- source_word: וַיְבִיאֵנִי
  choice: Puis il me fit entrer
  rationale: Le waw consécutif fait progresser le récit. « Puis » marque naturellement la succession, et « fit entrer » rend le mouvement vers l’intérieur.
- source_word: וַיָּמָד
  choice: mesura
  rationale: Rendu direct de l’action de mesurer dans la vision.
