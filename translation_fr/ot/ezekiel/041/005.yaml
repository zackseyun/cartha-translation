  text: וַ/יָּ֥מָד קִֽיר הַ/בַּ֖יִת שֵׁ֣שׁ אַמּ֑וֹת וְ/רֹ֣חַב הַ/צֵּלָע֩ אַרְבַּ֨ע אַמּ֜וֹת סָבִ֧יב סָבִ֛יב לַ/בַּ֖יִת סָבִֽיב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/005.yaml
  text: 'Then he measured the wall of the house: six cubits[a]; and the width of the side chambers was four cubits all around the house on every side.'
translation:
  language: fr
  text: 'Puis il mesura le mur de la Maison : six coudées ; et la largeur des chambres latérales[a] était de quatre coudées, tout autour de la Maison, de tous côtés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la pièce latérale » ou « la construction latérale ». Le terme hébreu désigne ici les espaces construits le long des côtés du bâtiment du Temple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: Puis il mesura
  rationale: Le wayyiqtol poursuit la succession des actions dans le récit de la vision. « Puis » exprime naturellement cette progression.
- source_word: קִיר הַבַּיִת
  choice: le mur de la Maison
  rationale: קִיר désigne le mur de la construction, et בַּיִת le bâtiment du Temple. « Maison » conserve l’image hébraïque traditionnelle sans remplacer explicitement le terme par « Temple ».
- source_word: שֵׁשׁ אַמּוֹת
  choice: six coudées
  rationale: La mesure ancienne est conservée plutôt que convertie en unité moderne.
- source_word: הַצֵּלָע
  choice: les chambres latérales
  rationale: Dans l’architecture du Temple, צֵלָע désigne ici les espaces aménagés le long du bâtiment. Le pluriel français rend la valeur collective suggérée par leur disposition tout autour de la Maison.
- source_word: אַרְבַּע אַמּוֹת
  choice: quatre coudées
  rationale: La mesure ancienne est rendue directement et sans conversion.
- source_word: סָבִיב סָבִיב לַבַּיִת סָבִיב
  choice: tout autour de la Maison, de tous côtés
  rationale: Cette formulation française naturelle restitue l’insistance produite par la triple répétition de סָבִיב.
