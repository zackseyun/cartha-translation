  text: The nave had a square doorframe[b][a], and the front of the sanctuary had the same appearance.
translation:
  language: fr
  text: La grande salle du Temple avait un encadrement de porte carré[a], et le devant du sanctuaire avait le même aspect[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « La salle du Temple avait un montant de porte carré ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « l’aspect comme l’aspect » ; l’expression hébraïque est elliptique.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: הֵיכָל
  choice: la grande salle du Temple
  rationale: Dans cette vision, le mot désigne la salle principale située devant le sanctuaire intérieur, plutôt que l’ensemble du complexe. Cette formulation est plus immédiatement compréhensible en français moderne que « nef ».
- source_word: מְזוּזַת
  choice: encadrement de porte
  rationale: Le terme peut désigner un montant de porte, mais le singulier associé à une forme carrée se rend naturellement ici par l’ensemble de l’encadrement.
- source_word: רְבֻעָה
  choice: carré
  rationale: L’adjectif décrit une forme carrée ou à quatre côtés; « carré » est le terme architectural français le plus naturel.
- source_word: וּפְנֵי
  choice: et le devant de
  rationale: Le sens littéral est « la face de », mais, dans ce contexte architectural, il s’agit de la façade ou du côté visible.
- source_word: הַקֹּדֶשׁ
  choice: du sanctuaire
  rationale: Dans le contexte du Temple, le mot désigne l’espace saint; « sanctuaire » conserve clairement sa fonction sacrée.
- source_word: הַמַּרְאֶה כַּמַּרְאֶה
  choice: avait le même aspect
  rationale: L’hébreu emploie une formule elliptique et répétitive, littéralement « l’aspect comme l’aspect ». La traduction exprime naturellement la correspondance visuelle sans préciser davantage ce que le texte laisse implicite.
