  text: וּ/פֶ֤תַח הַ/צֵּלָע֙ לַ/מֻּנָּ֔ח פֶּ֤תַח אֶחָד֙ דֶּ֣רֶךְ הַ/צָּפ֔וֹן וּ/פֶ֥תַח אֶחָ֖ד לַ/דָּר֑וֹם וְ/רֹ֨חַב֙ מְק֣וֹם הַ/מֻּנָּ֔ח חָמֵ֥שׁ אַמּ֖וֹת סָבִ֥יב סָבִֽיב׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/011.yaml
  text: And the doorway of the side chamber was toward the free space[a], one doorway toward the north and one doorway toward the south; and the width of the free space was five cubits all around.
translation:
  language: fr
  text: 'L’ouverture de la chambre latérale donnait sur l’espace libre[a] : une ouverture du côté nord et une autre du côté sud. L’espace libre avait cinq coudées de largeur tout autour.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’espace ouvert » ou « la zone dégagée ». Le mot hébreu מֻנָּח désigne ici l’espace laissé libre autour de la construction.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶתַח
  choice: ouverture
  rationale: Dans cette description architecturale, « ouverture » désigne naturellement l’accès ménagé dans la paroi et convient aux deux occurrences.
- source_word: הַצֵּלָע
  choice: la chambre latérale
  rationale: Dans la vision du Temple, צֵלָע désigne une pièce attenante à l’édifice principal.
- source_word: לַמֻּנָּח
  choice: sur l’espace libre
  rationale: Le terme מֻנָּח désigne ici l’espace laissé dégagé autour de la construction; « donnait sur » exprime idiomatiquement l’orientation de l’ouverture.
- source_word: דֶּרֶךְ הַצָּפוֹן
  choice: du côté nord
  rationale: דֶּרֶךְ marque ici la direction; cette formulation française est naturelle sans préciser indûment que l’ouverture faisait face au nord.
- source_word: לַדָּרוֹם
  choice: du côté sud
  rationale: Le rendu maintient le parallélisme directionnel avec le membre précédent.
- source_word: רֹחַב
  choice: largeur
  rationale: Terme architectural français usuel pour la dimension mesurée.
- source_word: מְקוֹם הַמֻּנָּח
  choice: l’espace libre
  rationale: La locution désigne l’aire laissée ouverte autour du bâtiment; le français évite la lourdeur de « l’endroit de l’espace laissé libre ».
- source_word: חָמֵשׁ אַמּוֹת
  choice: cinq coudées
  rationale: L’unité ancienne est conservée pour respecter les mesures de la vision architecturale.
- source_word: סָבִיב סָבִיב
  choice: tout autour
  rationale: Cette expression idiomatique rend la valeur circonférentielle et intensive du redoublement hébreu.
theological_decisions: []
