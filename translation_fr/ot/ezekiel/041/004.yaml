source:
  edition: WLC
  text: וַ/יָּ֨מָד אֶת אָרְכּ֜/וֹ עֶשְׂרִ֣ים אַמָּ֗ה וְ/רֹ֛חַב עֶשְׂרִ֥ים אַמָּ֖ה אֶל פְּנֵ֣י הַֽ/הֵיכָ֑ל וַ/יֹּ֣אמֶר אֵלַ֔/י זֶ֖ה קֹ֥דֶשׁ הַ/קֳּדָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/004.yaml
  text: 'Then he measured its length: twenty cubits[a], and the width: twenty cubits, before the nave; and he said to me, “This is the Most Holy Place.”'
translation:
  language: fr
  text: 'Il mesura ensuite sa longueur : vingt coudées, et sa largeur : vingt coudées, devant la grande salle du sanctuaire. Puis il me dit : « C’est le lieu très saint[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon l’expression traditionnelle : « le Saint des saints ».'
    reason: Alternative lexicale traditionnelle pour la construction superlative hébraïque קֹדֶשׁ הַקֳּדָשִׁים.
lexical_decisions:
- source_word: וַיָּמָד
  choice: Il mesura ensuite
  rationale: Le wayyiqtol fait progresser le récit. « Ensuite » exprime naturellement cette succession en français.
- source_word: אָרְכּוֹ
  choice: sa longueur
  rationale: Le suffixe masculin singulier renvoie à l’espace intérieur mesuré ; le possessif français restitue cette relation.
- source_word: עֶשְׂרִים אַמָּה
  choice: vingt coudées
  rationale: La coudée est l’unité de mesure ancienne désignée par אַמָּה ; elle est conservée plutôt que convertie.
- source_word: וְרֹחַב
  choice: et sa largeur
  rationale: רֹחַב désigne la largeur. La répétition du possessif rend la formulation claire et naturelle en français.
- source_word: אֶל־פְּנֵי הַהֵיכָל
  choice: devant la grande salle du sanctuaire
  rationale: La préposition exprime ici une relation spatiale. Dans cette description, הֵיכָל désigne la salle principale du sanctuaire plutôt que l’ensemble du temple ; cette formulation la distingue de la pièce intérieure.
- source_word: וַיֹּאמֶר אֵלַי
  choice: Puis il me dit
  rationale: Cette formule narrative introduit l’action suivante ; « Puis » conserve l’enchaînement sans lourdeur.
- source_word: זֶה
  choice: C’est
  rationale: Le démonstratif introduit une identification ; « C’est » est son équivalent idiomatique dans ce contexte.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: le lieu très saint
  rationale: Cette construction superlative hébraïque désigne la pièce la plus sainte. « Le lieu très saint » en transmet clairement le sens, tandis que la formulation traditionnelle est donnée en note.
theological_decisions:
- issue: Traduction de קֹדֶשׁ הַקֳּדָשִׁים
  choice: le lieu très saint
  alternative: le Saint des saints
  rationale: La traduction retenue communique directement la valeur superlative et la fonction spatiale de l’expression. La tournure traditionnelle, importante pour la continuité intertextuelle, est conservée en note sans imposer une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, sobre et digne. Les unités anciennes sont conservées. « Grande salle du sanctuaire » évite l’ambiguïté de « temple » et distingue le הֵיכָל de la pièce intérieure.
