base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/016.yaml
  text: the thresholds[a], the recessed windows, and the galleries all around on their three sides, opposite the threshold, were paneled with wood all around, from the floor up to the windows[c][b]; and the windows were covered.
translation:
  language: fr
  text: Les seuils, les fenêtres en retrait[a] et les galeries[b], tout autour, sur leurs trois côtés[d], en face du seuil, étaient revêtus de bois[c] tout autour, depuis le sol jusqu’aux fenêtres ; et les fenêtres étaient couvertes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fenêtres fermées », « fenêtres munies de volets » ou « fenêtres à treillis ». L’hébreu semble désigner un type architectural fixe plutôt que des fenêtres simplement fermées à ce moment-là.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu traduit par « galeries » est rare ; il pourrait désigner des saillies, des colonnades ou des passages supérieurs.
    reason: lexical_alternative
  - marker: c
    text: Ou « avaient un parement de bois » ou « étaient lambrissés ». L’expression hébraïque est rare et désigne probablement un revêtement en bois.
    reason: lexical_alternative
  - marker: d
    text: Littéralement, « autour des trois ». Le référent exact n’est pas explicite dans ce verset ; certains comprennent « sur leurs trois côtés », d’autres « sur les trois niveaux ».
    reason: textual_ambiguity
lexical_decisions:
- source_word: הַסִּפִּים / הַסַּף
  choice: les seuils / le seuil
  rationale: סַף désigne un seuil, un appui ou un élément de l’encadrement d’une porte. « Seuil » convient au contexte architectural et conserve la répétition hébraïque.
- source_word: הַחַלּוֹנִים הָאֲטֻמוֹת
  choice: les fenêtres en retrait
  rationale: אֲטֻמוֹת évoque littéralement ce qui est fermé ou obturé, mais semble ici qualifier un type architectural fixe. « En retrait » exprime ce sens probable sans présenter les fenêtres comme simplement fermées à cet instant.
- source_word: הָאַתִּיקִים
  choice: les galeries
  rationale: Ce terme architectural rare peut désigner des galeries, des saillies, des colonnades ou des passages supérieurs. « Galeries » s’intègre naturellement à la description, tandis que l’incertitude est signalée en note.
- source_word: סָבִיב לִשְׁלָשְׁתָּם
  choice: tout autour de tous les trois
  rationale: Le suffixe masculin pluriel de לִשְׁלָשְׁתָּם signifie littéralement « des trois / de tous les trois » et renvoie probablement aux trois ensembles architecturaux du contexte. Cette traduction évite d’ajouter explicitement « côtés » ou « niveaux », absents de l’hébreu.
- source_word: נֶגֶד הַסַּף
  choice: en face du seuil
  rationale: נֶגֶד indique une position en face de, devant ou vis-à-vis de quelque chose. « En face du seuil » conserve simplement la relation spatiale.
- source_word: שְׂחִיף עֵץ
  choice: étaient revêtus de bois
  rationale: שְׂחִיף est rare et paraît désigner un revêtement ou un placage. La formulation verbale française rend clairement le probable habillage en bois.
- source_word: וְהָאָרֶץ
  choice: depuis le sol
  rationale: Dans ce contexte intérieur, אֶרֶץ désigne vraisemblablement le niveau inférieur ou le sol. Avec עַד, « depuis le sol jusqu’aux fenêtres » exprime l’étendue verticale du revêtement.
- source_word: עַד הַחַלּוֹנוֹת
  choice: jusqu’aux fenêtres
  rationale: La préposition עַד marque ici la limite spatiale supérieure du revêtement.
- source_word: וְהַחַלּוֹנוֹת מְכֻסּוֹת
  choice: et les fenêtres étaient couvertes
  rationale: מְכֻסּוֹת signifie « couvertes ». La nature de cette couverture n’étant pas précisée, la traduction conserve cette indétermination.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et architectural. La phrase conserve la structure descriptive et la répétition autour du seuil et des fenêtres, tout en explicitant seulement les relations spatiales nécessaires. Le référent ambigu de « tous les trois » reste volontairement ouvert.
