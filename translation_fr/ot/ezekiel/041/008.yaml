source:
  edition: WLC
  text: וְ/רָאִ֧יתִי לַ/בַּ֛יִת גֹּ֖בַהּ סָבִ֣יב סָבִ֑יב מיסדות הַ/צְּלָעוֹת֙ מְל֣וֹ הַ/קָּנֶ֔ה שֵׁ֥שׁ אַמּ֖וֹת אַצִּֽילָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/008.yaml
  text: And I saw that the house had a raised platform all around[a]; the foundations of the side chambers were a full reed of six cubits to the offset.
translation:
  language: fr
  text: Je vis que le Temple présentait une élévation tout autour[a] ; les fondations des salles latérales mesuraient une canne entière, soit six coudées, jusqu’au ressaut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avait une plate-forme surélevée tout autour ». Le mot hébreu signifie littéralement « hauteur » ou « élévation » ; le détail architectural visé est incertain.
    reason: Ambiguïté architecturale de גֹּבַהּ.
  - marker: b
    text: Le terme hébreu rendu par « ressaut » est obscur ; il peut aussi désigner un point de raccordement, un rebord ou peut-être la base.
    reason: Sens incertain du terme architectural rare אַצִּילָה.
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: Je vis
  rationale: Le qal accompli à la première personne du singulier de ראה exprime simplement l’observation du prophète dans la suite du récit.
- source_word: לַבַּיִת
  choice: le Temple
  rationale: Dans ce contexte architectural, בַּיִת désigne l’édifice du Temple. « Le Temple » est plus immédiatement clair en français que le calque « la maison ».
- source_word: גֹּבַהּ
  choice: avait une plate-forme surélevée
  rationale: Le mot signifie littéralement « hauteur, élévation », mais le contexte des fondations entourant l’édifice indique vraisemblablement un soubassement ou une base surélevée. Cette formulation rend naturellement la réalité architecturale sans prétendre en fixer tous les détails.
- source_word: סָבִיב סָבִיב
  choice: tout autour
  rationale: La répétition hébraïque renforce l’idée que l’élévation entourait entièrement l’édifice.
- source_word: מיסדות
  choice: les fondations
  rationale: Le terme désigne les fondations ou structures de fondation; « fondations » est le rendu français le plus transparent.
- source_word: הַצְּלָעוֹת
  choice: des salles latérales
  rationale: Dans l’architecture du Temple, צלעות désigne les pièces ou structures latérales accolées au bâtiment principal.
- source_word: מְלֹא הַקָּנֶה
  choice: une canne entière
  rationale: מְלֹא exprime la pleine mesure, et קָנֶה la canne servant à mesurer; la longueur est précisée aussitôt par « six coudées ».
- source_word: שֵׁשׁ אַמּוֹת
  choice: soit six coudées
  rationale: Cette expression précise en apposition la longueur de la canne; « soit » rend clairement ce rapport en français.
- source_word: אַצִּילָה
  choice: jusqu’au ressaut
  rationale: Le terme architectural est obscur. « Ressaut » convient à l’idée possible d’un décalage ou d’une saillie dans le soubassement, mais l’incertitude doit être signalée en note.
