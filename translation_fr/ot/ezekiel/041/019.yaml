  text: וּ/פְנֵ֨י אָדָ֤ם אֶל הַ/תִּֽמֹרָה֙ מִ/פּ֔וֹ וּ/פְנֵֽי כְפִ֥יר אֶל הַ/תִּֽמֹרָ֖ה מִ/פּ֑וֹ עָשׂ֥וּי אֶל כָּל הַ/בַּ֖יִת סָבִ֥יב סָבִֽיב־־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/019.yaml
  text: with a human face toward the palm tree on one side[a], and a young lion’s face toward the palm tree on the other side. They were made all around the whole temple.
translation:
  language: fr
  text: un visage humain[a] tourné vers le palmier d’un côté, et un visage de jeune lion tourné vers le palmier de l’autre côté. Ce décor était exécuté tout autour du temple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un visage d’homme […] un visage de jeune lion ».'
    reason: La note conserve la forme construite littérale de l’hébreu et signale l’autre rendu possible de אָדָם.
lexical_decisions:
- source_word: פְנֵי אָדָם
  choice: un visage humain
  rationale: Le syntagme construit signifie littéralement « visage d’homme/de l’être humain ». Dans ce décor, « visage humain » exprime naturellement le contraste avec celui du lion sans désigner un individu précis.
- source_word: הַתִּמֹרָה
  choice: le palmier
  rationale: Le terme désigne ici le motif de palmier sculpté décrit dans le contexte immédiat.
- source_word: מִפּוֹ ... מִפּוֹ
  choice: d’un côté ... de l’autre côté
  rationale: La répétition indique les deux côtés opposés du palmier; cette formulation en rend le sens clairement en français courant.
- source_word: פְנֵי כְפִיר
  choice: un visage de jeune lion
  rationale: כְפִיר désigne un jeune lion; le choix conserve cette précision lexicale.
- source_word: עָשׂוּי
  choice: Ce motif était réalisé
  rationale: Le participe passif masculin singulier résume vraisemblablement l’ensemble du travail décoratif. « Ce motif » explicite sobrement ce référent collectif plutôt que d’imposer un pluriel.
- source_word: אֶל כָּל הַבַּיִת
  choice: tout autour du temple
  rationale: Dans cette vision, הַבַּיִת désigne l’édifice du temple. La préposition, associée à סָבִיב סָבִיב, exprime l’étendue du décor autour de tout l’édifice.
- source_word: סָבִיב סָבִיב
  choice: tout autour
  rationale: La répétition intensifie l’idée d’une extension complète sur le pourtour; « tout autour » la restitue idiomatiquement.
theological_decisions:
- issue: Sens de אָדָם dans la description d’un motif décoratif
  choice: humain
  alternative: homme
  rationale: Le mot peut désigner l’homme ou l’être humain. Ici, il caractérise un visage sculpté opposé à celui d’un lion; « humain » préserve ce contraste sans suggérer un homme particulier.
- issue: Nombre du résumé עָשׂוּי
  choice: singulier collectif renvoyant au motif décoratif
  alternative: pluriel renvoyant aux figures sculptées
  rationale: La forme hébraïque est masculine singulière, tandis que le contexte décrit plusieurs figures. La traduction garde cette tension en donnant au singulier un référent collectif explicite.
translation_notes:
  register: Français international moderne, clair et digne. La répétition syntaxique des deux visages est conservée, tandis que מִפּוֹ est rendue idiomatiquement. « Ce motif » assure un référent naturel au participe singulier hébreu sans effacer la pluralité des éléments sculptés.
