source:
  edition: WLC
  text: וְ/חַלּוֹנִ֨ים אֲטֻמ֤וֹת וְ/תִֽמֹרִים֙ מִ/פּ֣וֹ וּ/מִ/פּ֔וֹ אֶל כִּתְפ֖וֹת הָֽ/אוּלָ֑ם וְ/צַלְע֥וֹת הַ/בַּ֖יִת וְ/הָ/עֻבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/026.yaml
  text: And there were shuttered windows and palm trees on this side and on that[a], along the sidewalls of the vestibule, and on the side chambers of the temple[c][b], and the canopies.
translation:
  language: fr
  text: Il y avait des fenêtres fermées[a] et des palmiers[b] de part et d’autre, le long des côtés du vestibule, sur les pièces latérales du Temple et sur les auvents[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fenêtres obturées » ; l’hébreu indique qu’elles étaient closes ou masquées d’une manière ou d’une autre.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit probablement de motifs décoratifs représentant des palmiers.
    reason: cultural_note
  - marker: c
    text: Le sens de ce terme architectural rare est incertain ; il pourrait désigner des toits en saillie, des avant-toits ou d’autres éléments débordants.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַלּוֹנִים
  choice: fenêtres
  rationale: Le nom désigne normalement des ouvertures architecturales servant de fenêtres; « fenêtres » est ici le terme français naturel.
- source_word: אֲטֻמוֹת
  choice: fermées
  rationale: Le participe passif indique que les fenêtres étaient closes ou obturées d’une manière non précisée. « Fermées » préserve cette indétermination.
- source_word: תִמֹרִים
  choice: palmiers
  rationale: Dans la description architecturale du sanctuaire, il s’agit vraisemblablement de motifs décoratifs représentant des palmiers; le nom concret du texte hébreu est conservé.
- source_word: מִפּוֹ וּמִפּוֹ
  choice: de part et d’autre
  rationale: Cette expression distributive marque une disposition des deux côtés et se rend naturellement ainsi en français.
- source_word: אֶל כִּתְפוֹת הָאוּלָם
  choice: le long des côtés du vestibule
  rationale: כָּתֵף signifie littéralement « épaule » et désigne ici les parties latérales d’un élément architectural; אוּלָם est le vestibule ou portique du sanctuaire.
- source_word: צַלְעוֹת הַבַּיִת
  choice: les pièces latérales du Temple
  rationale: Dans le vocabulaire architectural du sanctuaire, צֵלָע peut désigner les pièces ou structures latérales. « Temple » explicite le sens contextuel de הַבַּיִת.
- source_word: הָעֻבִּים
  choice: les auvents
  rationale: Ce terme architectural rare est de sens incertain. « Auvents » exprime prudemment l’idée possible d’éléments en saillie ou de couvertures débordantes, sans présenter cette identification comme assurée.
