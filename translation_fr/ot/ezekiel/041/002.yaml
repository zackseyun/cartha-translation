  text: וְ/רֹ֣חַב הַ/פֶּתַח֮ עֶ֣שֶׂר אַמּוֹת֒ וְ/כִתְפ֣וֹת הַ/פֶּ֔תַח חָמֵ֤שׁ אַמּוֹת֙ מִ/פּ֔וֹ וְ/חָמֵ֥שׁ אַמּ֖וֹת מִ/פּ֑וֹ וַ/יָּ֤מָד אָרְכּ/וֹ֙ אַרְבָּעִ֣ים אַמָּ֔ה וְ/רֹ֖חַב עֶשְׂרִ֥ים אַמָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/002.yaml
  text: 'And the width of the entrance was ten cubits[a], and the sidewalls of the entrance were five cubits on this side and five cubits on that side. Then he measured its length: forty cubits, and the width: twenty cubits.'
translation:
  language: fr
  text: 'La largeur de l’entrée était de dix coudées. Les pans de mur qui encadraient l’entrée[a] mesuraient cinq coudées d’un côté et cinq coudées de l’autre. Puis il mesura sa longueur : quarante coudées, et sa largeur : vingt coudées.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les épaules de l’entrée », c’est-à-dire les sections latérales qui la flanquaient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹחַב
  choice: largeur
  rationale: Terme architectural courant et naturel dans un contexte de mesures.
- source_word: הַפֶּתַח
  choice: l’entrée
  rationale: Désigne ici l’ouverture architecturale donnant accès à la salle, sans la réduire à la porte elle-même.
- source_word: עֶשֶׂר אַמּוֹת
  choice: dix coudées
  rationale: Conserve l’unité de mesure du texte source.
- source_word: כִתְפוֹת
  choice: les pans de mur qui encadraient
  rationale: Le mot signifie littéralement « épaules » et désigne ici les sections latérales qui flanquent l’entrée; cette formulation est claire sans être excessivement technique.
- source_word: מִפּוֹ ... מִפּוֹ
  choice: d’un côté ... de l’autre
  rationale: Rend naturellement la disposition bilatérale exprimée en hébreu.
- source_word: וַיָּמָד
  choice: Puis il mesura
  rationale: Le passé simple convient au registre narratif biblique moderne, tandis que « puis » marque la progression du récit.
- source_word: אָרְכּוֹ
  choice: sa longueur
  rationale: Conserve le pronom suffixe de l’hébreu sans préciser explicitement le référent, qui dépend du contexte précédent.
- source_word: אַרְבָּעִים אַמָּה
  choice: quarante coudées
  rationale: Rendu direct de la mesure source.
- source_word: וְרֹחַב עֶשְׂרִים אַמָּה
  choice: 'et sa largeur : vingt coudées'
  rationale: Reproduit de façon lisible la formule de mesure elliptique de l’hébreu.
theological_decisions: []
