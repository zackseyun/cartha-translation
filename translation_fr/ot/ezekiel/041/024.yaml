  text: וּ/שְׁתַּ֥יִם דְּלָת֖וֹת לַ/דְּלָת֑וֹת שְׁ֚תַּיִם מוּסַבּ֣וֹת דְּלָת֔וֹת שְׁ֚תַּיִם לְ/דֶ֣לֶת אֶחָ֔ת וּ/שְׁתֵּ֥י דְלָת֖וֹת לָ/אַחֶֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/024.yaml
  text: 'And the doors had two leaves each[a], two turning leaves: two leaves for the one door and two leaves for the other.'
translation:
  language: fr
  text: 'Les portes avaient chacune deux battants, deux battants pivotants[a] : deux battants pour l’une des portes et deux pour l’autre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « deux battants tournants » ou « deux battants pliants ». Le terme hébreu indique que les battants tournent, sans préciser exactement leur mécanisme.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּלָתוֹת / דֶּלֶת
  choice: portes / battants
  rationale: Le nom peut désigner une porte entière ou l’un de ses éléments mobiles. Le contexte distingue les deux portes de leurs battants, comptés par paires.
- source_word: מוּסַבּוֹת
  choice: pivotants
  rationale: Le terme décrit des éléments qui tournent. « Pivotants » rend clairement le mouvement tout en évitant d’affirmer qu’ils se repliaient.
- source_word: שְׁתַּיִם ... שְׁתַּיִם ... שְׁתַּיִם ... וּשְׁתֵּי
  choice: deux ... deux ... deux ... deux
  rationale: La répétition du nombre est conservée autant que le permet un français naturel, afin de respecter le style architectural et l’insistance sur les éléments disposés par paires.
- source_word: לַדְּלָתוֹת
  choice: Les portes avaient
  rationale: La préposition est rendue ici par une construction possessive idiomatique en français.
- source_word: לְדֶלֶת אֶחָת ... לָאַחֶרֶת
  choice: pour l’une des portes ... pour l’autre
  rationale: 'Cette formulation conserve le sens distributif : chacune des deux portes possède deux battants.'
