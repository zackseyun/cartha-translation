  text: וְ/עָשׂ֥וּי כְּרוּבִ֖ים וְ/תִֽמֹרִ֑ים וְ/תִֽמֹרָה֙ בֵּין כְּר֣וּב לִ/כְר֔וּב וּ/שְׁנַ֥יִם פָּנִ֖ים לַ/כְּרֽוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/018.yaml
  text: Cherubim and palm trees were made on it[a], with a palm tree between cherub and cherub; and each cherub had two faces.
translation:
  language: fr
  text: 'On y avait représenté des chérubins et des palmiers[a] : un palmier se trouvait entre deux chérubins, et chaque chérubin avait deux visages.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fait ». Dans ce contexte architectural, il s’agit vraisemblablement de motifs exécutés ou sculptés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּי
  choice: On y avait représenté
  rationale: Le participe passif de עשה signifie littéralement « fait ». Dans ce contexte de décoration architecturale, « représenté » exprime naturellement l’exécution des motifs, tandis que « y » reprend la surface décrite par le contexte.
- source_word: כְּרוּבִים
  choice: des chérubins
  rationale: « Chérubins » est le terme français courant et digne pour ces figures célestes et ornementales.
- source_word: וְתִמֹרִים
  choice: et des palmiers
  rationale: Le nom désigne ici des motifs de palmiers dans l’ornementation du temple; « palmiers » reste clair sans explicitation excessive.
- source_word: וְתִמֹרָה בֵּין כְּרוּב לִכְרוּב
  choice: un palmier entre chaque chérubin
  rationale: La construction hébraïque distributive, littéralement « entre chérubin et chérubin », indique qu’un palmier séparait les chérubins successifs. Cette formulation est idiomatique en français.
- source_word: וּשְׁנַיִם פָּנִים לַכְּרוּב
  choice: et chaque chérubin avait deux visages
  rationale: Littéralement « et deux visages au chérubin ». La tournure distributive française rend clairement que chacun des chérubins possédait deux visages, comme le précise le verset suivant.
theological_decisions:
- issue: Nature des figures de chérubins et de palmiers dans le décor du temple
  choice: Les présenter simplement comme des motifs décoratifs figurés
  alternative: Ajouter une interprétation symbolique ou typologique
  rationale: Le verset décrit l’ornementation architecturale sans expliquer sa portée symbolique; la traduction n’ajoute donc aucune interprétation théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase explicite sobrement la valeur distributive de l’hébreu et conserve le caractère descriptif du passage.
