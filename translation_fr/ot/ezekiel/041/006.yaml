    rationale: La construction hébraïque « chambre contre chambre » décrit une relation ou une répétition architecturale, mais ne tranche pas explicitement entre superposition et juxtaposition.
  - severity: medium
    issue: « dans des retraits du mur » ajoute un dispositif architectural absent du verset.
    rationale: Le texte dit que les chambres « entraient/s’engageaient dans le mur »; les retraits peuvent être une reconstruction contextuelle, mais ne doivent pas figurer dans le texte courant sans appui explicite.
