  text: וְ/הַ/צְּלָעוֹת֩ צֵלָ֨ע אֶל צֵלָ֜ע שָׁל֧וֹשׁ וּ/שְׁלֹשִׁ֣ים פְּעָמִ֗ים וּ֠/בָאוֹת בַּ/קִּ֨יר אֲשֶׁר לַ/בַּ֧יִת לַ/צְּלָע֛וֹת סָבִ֥יב סָבִ֖יב לִ/הְי֣וֹת אֲחוּזִ֑ים וְ/לֹֽא יִהְי֥וּ אֲחוּזִ֖ים בְּ/קִ֥יר הַ/בָּֽיִת־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/006.yaml
  text: And the side chambers were side chamber upon side chamber[a], three and thirty times; and they entered into the wall that belonged to the house for the side chambers all around, so that they might be supported[b], but they were not supported by the wall of the house.
translation:
  language: fr
  text: Les chambres latérales étaient disposées chambre contre chambre[a], au nombre de trente-trois. Elles s’engageaient dans le mur du bâtiment, tout autour, afin d’être maintenues[b], mais elles n’étaient pas fixées dans le mur du bâtiment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « chambre contre chambre », « trois et trente fois ». La disposition précise — superposée ou juxtaposée — n’est pas certaine.
    reason: ambiguïté architecturale et numérale
  - marker: b
    text: Ou « retenues » ou « attachées ». Le terme hébreu exprime le fait d’être fermement maintenu en place.
    reason: alternative lexicale
lexical_decisions:
- source_word: הַצְּלָעוֹת / צֵלָע
  choice: les chambres latérales
  rationale: Dans ce contexte architectural, צלע désigne les pièces ou structures aménagées sur les côtés du bâtiment, et non une « côte » au sens littéral.
- source_word: צֵלָע אֶל צֵלָע
  choice: disposées l’une au-dessus de l’autre
  rationale: La formule distributive décrit vraisemblablement une disposition verticale par niveaux; cette tournure est naturelle en français tout en conservant l’image architecturale.
- source_word: שָׁלוֹשׁ וּשְׁלֹשִׁים פְּעָמִים
  choice: au nombre de trente-trois
  rationale: Le sens contextuel porte vraisemblablement sur le nombre total de chambres ou d’emplacements, et non sur trente-trois répétitions temporelles. Le français moderne exprime naturellement le nombre par « trente-trois ».
- source_word: וּבָאוֹת בַּקִּיר אֲשֶׁר לַבַּיִת
  choice: elles s’engageaient dans des retraits du mur appartenant au temple
  rationale: Le participe féminin renvoie aux chambres. « S’engageaient » conserve l’idée d’entrer dans la structure; « des retraits » explicite avec prudence le dispositif architectural suggéré par le contexte et par le contraste final.
- source_word: סָבִיב סָבִיב
  choice: tout autour
  rationale: Cette expression rend naturellement en français l’insistance produite par la répétition hébraïque.
- source_word: לִהְיוֹת אֲחוּזִים
  choice: afin d’y être maintenues
  rationale: Le passif de אחז exprime le fait d’être tenu fermement ou assuré en place. « Maintenues » convient à l’architecture sans imposer un mécanisme précis.
- source_word: וְלֹא יִהְיוּ אֲחוּזִים בְּקִיר הַבָּיִת
  choice: mais elles n’étaient pas fixées dans le mur même du temple
  rationale: La proposition marque que les chambres étaient retenues par le dispositif périphérique sans être encastrées ou ancrées directement dans le mur principal. « Le mur même » souligne cette distinction.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le choix « temple » rend ici בַּיִת selon son référent architectural. La syntaxe a été légèrement explicitée pour rendre intelligible une description hébraïque particulièrement difficile, tout en signalant en note l’ambiguïté de la disposition des chambres.
