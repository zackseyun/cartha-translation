revisions:
- from: Les chambres latérales étaient disposées l’une au-dessus de l’autre[a], au nombre de trente-trois. Elles s’engageaient dans des retraits du mur appartenant au temple, tout autour, afin d’y être maintenues[b], mais elles n’étaient pas fixées dans le mur même du temple.
  to: Les chambres latérales étaient disposées chambre contre chambre[a], au nombre de trente-trois. Elles s’engageaient dans le mur du bâtiment, tout autour, afin d’être maintenues[b], mais elles n’étaient pas fixées dans le mur du bâtiment.
  rationale: 'La révision supprime deux interprétations non explicitement exprimées par le texte — la superposition verticale et les retraits du mur — tout en gardant une description française fluide. Elle maintient le contraste architectural du verset: les chambres sont maintenues par le dispositif du mur sans être fixées dans le mur du bâtiment lui-même.'
