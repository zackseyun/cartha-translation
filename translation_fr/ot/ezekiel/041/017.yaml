  text: עַל מֵ/עַ֣ל הַ/פֶּ֡תַח וְ/עַד הַ/בַּיִת֩ הַ/פְּנִימִ֨י וְ/לַ/ח֜וּץ וְ/אֶל כָּל הַ/קִּ֨יר סָבִ֧יב סָבִ֛יב בַּ/פְּנִימִ֥י וּ/בַ/חִיצ֖וֹן מִדּֽוֹת־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/017.yaml
  text: Above the doorway[a], and as far as the inner house, and outside, and on all the wall all around, in the inner part and in the outer part[b], were measurements.
translation:
  language: fr
  text: Au-dessus de l’entrée, jusqu’à la maison intérieure[b], et au-dehors, sur tout le mur, tout autour, aussi bien à l’intérieur qu’à l’extérieur, il y avait des mesures[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des dimensions ». Le texte hébreu est elliptique, et le sens précis du terme dans cette description architecturale est incertain.
    reason: lexical_alternative
  - marker: b
    text: Ou « le temple intérieur ». Dans la vision du temple d’Ézéchiel, « maison » peut souvent désigner l’édifice du temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעַל הַפֶּתַח
  choice: au-dessus de l’entrée
  rationale: מֵעַל situe l’élément au-dessus de l’ouverture; « entrée » convient naturellement au contexte architectural.
- source_word: וְעַד הַבַּיִת הַפְּנִימִי
  choice: jusqu’à la Maison intérieure
  rationale: בַּיִת désigne ici la Maison, c’est-à-dire l’édifice du temple, tandis que הַפְּנִימִי marque son caractère intérieur. La majuscule aide à signaler ce sens sans remplacer l’image hébraïque par une désignation plus précise.
- source_word: וְלַחוּץ
  choice: ainsi qu’à l’extérieur
  rationale: Le terme désigne la zone extérieure, en contraste avec l’intérieur; « ainsi que » relie naturellement les indications spatiales dans cette phrase elliptique.
- source_word: וְאֶל כָּל הַקִּיר סָבִיב סָבִיב
  choice: sur tout le mur, tout autour
  rationale: Dans cette description architecturale, אֶל exprime la relation avec la surface du mur. « Tout autour » rend l’insistance de la répétition סָבִיב סָבִיב sans lourdeur excessive.
- source_word: בַּפְּנִימִי וּבַחִיצוֹן
  choice: à l’intérieur comme à l’extérieur
  rationale: Les deux adjectifs substantivés opposent les parties intérieure et extérieure. Cette formulation française est claire et conserve le parallélisme.
- source_word: מִדּוֹת
  choice: des mesures
  rationale: Le pluriel désigne normalement des mesures ou des dimensions. L’hébreu est elliptique; « il y avait » est ajouté pour former une phrase française complète sans préciser davantage la nature de ces mesures.
