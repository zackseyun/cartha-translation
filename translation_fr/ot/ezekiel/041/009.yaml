revisions:
- from: Le mur des salles latérales avait, vers l’extérieur, cinq coudées d’épaisseur. Quant à l’espace laissé libre, c’était l’emplacement des salles latérales rattachées au Temple[a].
  to: Le mur des salles latérales avait, vers l’extérieur, cinq coudées d’épaisseur. Quant à ce qui était laissé libre, c’était l’ensemble des salles latérales du Temple[a].
  rationale: La révision remplace « emplacement » par « ensemble », qui correspond mieux à בֵּית dans l’expression « maison/structure des salles latérales ». Elle maintient « ce qui était laissé libre » afin de ne pas trancher plus qu’il ne faut le sens de מֻנָּח ni d’ajouter dans le texte principal la relation « entre », absente explicitement de l’hébreu et signalée en note comme interprétation possible.
