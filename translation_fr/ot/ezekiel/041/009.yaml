  text: The width of the wall that belonged to the side chambers on the outside was five cubits[a], and the open area between the side chambers of the house.
translation:
  language: fr
  text: Le mur des salles latérales avait, vers l’extérieur, cinq coudées d’épaisseur. Quant à ce qui était laissé libre, c’était l’ensemble des salles latérales du Temple[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu de la dernière proposition est difficile. On peut aussi comprendre : « l’espace libre se trouvait entre les salles latérales du Temple », ou : « ce qui restait libre était la construction latérale rattachée au Temple ».'
    reason: alternative_reading
lexical_decisions:
- source_word: רֹחַב הַקִּיר
  choice: le mur… avait… d’épaisseur
  rationale: Dans cette description architecturale, le « largeur du mur » hébraïque désigne naturellement son épaisseur en français.
- source_word: אֲשֶׁר לַצֵּלָע
  choice: des salles latérales
  rationale: צֵלָע désigne ici collectivement les pièces ou annexes aménagées sur les côtés du bâtiment.
- source_word: אֶל הַחוּץ
  choice: vers l’extérieur
  rationale: Cette expression indique le côté extérieur ou l’orientation extérieure du mur.
- source_word: חָמֵשׁ אַמּוֹת
  choice: cinq coudées
  rationale: La mesure ancienne est conservée, conformément au caractère précis de la vision architecturale.
- source_word: וַאֲשֶׁר מֻנָּח
  choice: quant à l’espace laissé libre
  rationale: Le participe exprime ce qui a été laissé ou maintenu libre; la formulation garde cette idée sans préciser indûment la disposition exacte.
- source_word: בֵּית צְלָעוֹת אֲשֶׁר לַבָּיִת
  choice: l’emplacement des salles latérales rattachées au Temple
  rationale: La tournure hébraïque est obscure. « Emplacement » rend prudemment בֵּית dans ce contexte, tandis que « Temple » explicite le référent architectural de בַּיִת.
