  text: וּ/מָדַ֣ד אֹֽרֶךְ הַ֠/בִּנְיָן אֶל פְּנֵ֨י הַ/גִּזְרָ֜ה אֲשֶׁ֨ר עַל אַחֲרֶ֧י/הָ ו/אתוקי/הא מִ/פּ֥וֹ וּ/מִ/פּ֖וֹ מֵאָ֣ה אַמָּ֑ה וְ/הַֽ/הֵיכָל֙ הַ/פְּנִימִ֔י וְ/אֻֽלַמֵּ֖י הֶ/חָצֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/015.yaml
  text: 'Then he measured the length of the building facing the separate area that was behind it[a], with its galleries on this side and on that side: one hundred cubits[b]; and the inner nave and the porches of the court.'
translation:
  language: fr
  text: 'Puis il mesura la longueur du bâtiment qui faisait face à l’espace séparé, situé derrière le bâtiment, avec ses galeries de part et d’autre[a] : cent coudées[b], ainsi que la salle intérieure[c] et les vestibules de la cour.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu est incertain ; il peut désigner des galeries, des colonnades ou un autre élément architectural latéral.
    reason: lexical_alternative
  - marker: b
    text: Une coudée mesurait approximativement 50 à 53 centimètres dans ce passage ; cent coudées représentent donc environ 50 à 53 mètres.
    reason: measurement_clarification
  - marker: c
    text: Ou « le temple intérieur » ou « le sanctuaire intérieur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָדַד
  choice: Puis il mesura
  rationale: Le verbe narratif fait progresser la séquence; « Puis » rend naturellement cette succession.
- source_word: אֹרֶךְ הַבִּנְיָן
  choice: la longueur du bâtiment
  rationale: Traduction directe et naturelle du vocabulaire architectural.
- source_word: אֶל פְּנֵי הַגִּזְרָה
  choice: qui faisait face à l’espace séparé
  rationale: « Faisait face à » exprime l’orientation, tandis que « espace séparé » conserve le sens distinctif de גִּזְרָה sans préciser indûment sa fonction.
- source_word: אֲשֶׁר עַל אַחֲרֶיהָ
  choice: situé derrière lui
  rationale: La formule indique que l’espace séparé se trouvait à l’arrière du bâtiment; le pronom reprend naturellement « bâtiment ».
- source_word: וְאתוקיהא
  choice: avec ses galeries
  rationale: Le terme architectural est textuellement et lexicalement difficile; « galeries » est une possibilité plausible, mais l’incertitude est signalée en note.
- source_word: מִפּוֹ וּמִפּוֹ
  choice: de part et d’autre
  rationale: Cette expression française idiomatique indique clairement les deux côtés.
- source_word: מֵאָה אַמָּה
  choice: cent coudées
  rationale: L’unité ancienne est conservée plutôt que convertie.
- source_word: הַהֵיכָל הַפְּנִימִי
  choice: la grande salle intérieure
  rationale: הֵיכָל désigne ici vraisemblablement la salle principale du sanctuaire; cette traduction reste architecturale sans l’assimiler nécessairement à tout le temple.
- source_word: וְאֻלַמֵּי הֶחָצֵר
  choice: les vestibules de la cour
  rationale: אוּלָם désigne un espace d’entrée de type vestibule ou portique; « vestibules » convient au contexte architectural.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est légèrement explicitée par la répétition de « Il mesura aussi », car l’hébreu passe après la mesure chiffrée à une série d’éléments architecturaux sans répéter le verbe. Les termes techniques incertains sont rendus lisiblement et accompagnés de variantes en note.
