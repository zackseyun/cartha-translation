  text: וְ/הַ/בִּנְיָ֡ן אֲשֶׁר֩ אֶל פְּנֵ֨י הַ/גִּזְרָ֜ה פְּאַ֣ת דֶּֽרֶךְ הַ/יָּ֗ם רֹ֚חַב שִׁבְעִ֣ים אַמָּ֔ה וְ/קִ֧יר הַ/בִּנְיָ֛ן חָֽמֵשׁ אַמּ֥וֹת רֹ֖חַב סָבִ֣יב סָבִ֑יב וְ/אָרְכּ֖/וֹ תִּשְׁעִ֥ים אַמָּֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/012.yaml
  text: And the building that faced the separate area on the side toward the west was seventy cubits wide[a], and the wall of the building was five cubits wide all around, and its length was ninety cubits.
translation:
  language: fr
  text: Le bâtiment qui faisait face à la zone séparée, du côté ouest[a], avait une largeur de soixante-dix coudées. Le mur du bâtiment était large de cinq coudées tout autour, et sa longueur était de quatre-vingt-dix coudées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du côté du chemin de la mer » ; c’est-à-dire du côté ouest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּנְיָן
  choice: le bâtiment
  rationale: בִּנְיָן désigne ici un édifice construit; « bâtiment » est naturel et précis dans cette description architecturale.
- source_word: אֲשֶׁר אֶל־פְּנֵי הַגִּזְרָה
  choice: qui faisait face à la zone séparée
  rationale: אֶל־פְּנֵי exprime l’orientation spatiale, tandis que הַגִּזְרָה désigne la zone distincte ou séparée du complexe.
- source_word: פְּאַת דֶּרֶךְ הַיָּם
  choice: du côté ouest
  rationale: L’expression signifie littéralement « du côté du chemin de la mer »; dans l’orientation géographique d’Israël, la mer indique l’ouest.
- source_word: רֹחַב שִׁבְעִים אַמָּה
  choice: avait trente-cinq mètres de large
  rationale: Les soixante-dix coudées sont converties selon l’équivalence courante d’environ 0,5 mètre par coudée afin de rendre la mesure immédiatement compréhensible.
- source_word: קִיר הַבִּנְיָן חָמֵשׁ אַמּוֹת רֹחַב
  choice: Le mur du bâtiment avait deux mètres et demi d’épaisseur
  rationale: Pour un mur, « épaisseur » rend naturellement la dimension exprimée par רֹחַב; cinq coudées correspondent approximativement à 2,5 mètres.
- source_word: סָבִיב סָבִיב
  choice: tout autour
  rationale: La locution redoublée renforce l’idée que le mur entourait entièrement le bâtiment.
- source_word: וְאָרְכּוֹ תִּשְׁעִים אַמָּה
  choice: et le bâtiment avait quarante-cinq mètres de long
  rationale: Le référent du suffixe est explicité pour éviter en français que « il » semble renvoyer au mur; quatre-vingt-dix coudées correspondent approximativement à 45 mètres.
theological_decisions: []
