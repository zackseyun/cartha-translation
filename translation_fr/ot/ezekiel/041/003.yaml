  text: וּ/בָ֣א לִ/פְנִ֔ימָה וַ/יָּ֥מָד אֵֽיל הַ/פֶּ֖תַח שְׁתַּ֣יִם אַמּ֑וֹת וְ/הַ/פֶּ֨תַח֙ שֵׁ֣שׁ אַמּ֔וֹת וְ/רֹ֥חַב הַ/פֶּ֖תַח שֶׁ֥בַע אַמּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/003.yaml
  text: 'Then he went inside and measured the jambs of the entrance: two cubits[a]; the entrance: six cubits[b]; and the width of the entrance: seven cubits.'
translation:
  language: fr
  text: 'Puis il entra à l’intérieur et mesura les montants de l’entrée : deux coudées[a] ; l’entrée : six coudées[b] ; et la largeur de l’entrée : sept coudées.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les pilastres de l’entrée ».
    reason: lexical_alternative
  - marker: b
    text: Le rapport architectural entre les six coudées indiquées ici et la largeur de sept coudées mentionnée ensuite est difficile à déterminer. Certains comprennent qu’il s’agit d’une autre dimension de la structure plutôt que de la seule ouverture.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָא לִפְנִימָה
  choice: Puis il entra à l’intérieur
  rationale: La forme narrative fait progresser la scène, tandis que לִפְנִימָה indique un déplacement vers l’intérieur. Cette formulation reste naturelle sans préciser davantage le local visé.
- source_word: וַיָּמָד
  choice: mesura
  rationale: Traduction directe du verbe dans le contexte des mesures du temple.
- source_word: אֵיל הַפֶּתַח
  choice: les montants de l’entrée
  rationale: Dans ce contexte architectural, אֵיל désigne vraisemblablement les éléments verticaux saillants qui encadrent l’entrée. « Montants » est clair en français moderne, tandis que « pilastres » demeure une possibilité technique signalée en note.
- source_word: שְׁתַּיִם אַמּוֹת
  choice: deux coudées
  rationale: Restitution directe de la mesure hébraïque.
- source_word: וְהַפֶּתַח שֵׁשׁ אַמּוֹת
  choice: 'l’entrée : six coudées'
  rationale: La formulation nominale concise reproduit l’ellipse de l’hébreu sans ajouter « elle-même » ni préciser quelle dimension architecturale est mesurée.
- source_word: וְרֹחַב הַפֶּתַח שֶׁבַע אַמּוֹת
  choice: 'et la largeur de l’entrée : sept coudées'
  rationale: Cette traduction conserve le sens lexical le plus immédiat du texte massorétique et laisse subsister la difficulté architecturale au lieu de la résoudre par conjecture.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La ponctuation par deux-points conserve la succession elliptique des mesures dans l’hébreu. Le terme traditionnel « coudée » est maintenu, et l’ambiguïté architecturale du texte source n’est pas artificiellement levée.
