base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/007.yaml
  text: And the side chambers became wider as they went around upward and upward[a], because the structure of the temple went around upward and upward all around the temple. Therefore the width of the temple increased upward[c][b], and so one went up from the lowest story to the highest by way of the middle story.
translation:
  language: fr
  text: Les chambres latérales s’élargissaient à mesure qu’elles montaient en tournant[a], car une construction entourait le temple en s’élevant de niveau en niveau, tout autour de lui. Ainsi, le temple gagnait en largeur vers le haut[b]. On montait donc de l’étage inférieur à l’étage supérieur en passant par l’étage intermédiaire[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les pièces latérales ». Le terme hébreu peut désigner des pièces ou des structures latérales accolées au bâtiment principal.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque décrivant la construction qui entourait le temple est difficile sur le plan architectural ; certains y voient une galerie, un ressaut ou un passage périphérique.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement, l’hébreu présente une formulation comprimée : « de l’inférieure à la supérieure, vers l’intermédiaire ». Il semble s’agir d’une montée du niveau inférieur au niveau supérieur en passant par le niveau intermédiaire.'
    reason: textual_or_syntactic_difficulty
lexical_decisions:
- source_word: וְרָחֲבָה
  choice: s’élargissaient
  rationale: Le verbe רחב exprime ici l’accroissement de la largeur des chambres aux niveaux supérieurs. L’imparfait français convient à la description architecturale.
- source_word: וְנָסְבָה לְמַעְלָה לְמַעְלָה
  choice: à mesure qu’elles montaient en tournant
  rationale: Cette formulation conserve à la fois la progression ascendante marquée par la répétition de לְמַעְלָה et la valeur d’encerclement de סבב, sans produire une répétition peu naturelle en français.
- source_word: לַצְּלָעוֹת
  choice: les chambres latérales
  rationale: Dans ce contexte architectural, צלעות désigne les pièces ou structures accolées au bâtiment principal plutôt que des « côtés » ou des « côtes » au sens littéral.
- source_word: כִּי מוּסַב הַבַּיִת
  choice: car une construction entourait le temple
  rationale: מוּסַב est un terme architectural difficile. « Une construction entourait » maintient l’idée sûre d’un dispositif périphérique sans préciser indûment s’il s’agissait d’une galerie, d’un ressaut ou d’un passage.
- source_word: סָבִיב סָבִיב לַבַּיִת
  choice: tout autour de lui
  rationale: « Tout autour » rend naturellement en français la force intensive du redoublement de סביב; le pronom évite une répétition lourde de « temple ».
- source_word: עַל כֵּן רֹחַב לַבַּיִת לְמָעְלָה
  choice: Ainsi, le temple gagnait en largeur vers le haut
  rationale: La proposition hébraïque est elliptique. « Gagnait en largeur » explicite sobrement l’élargissement progressif aux niveaux supérieurs.
- source_word: וְכֵן הַתַּחְתּוֹנָה יַעֲלֶה עַל הָעֶלְיוֹנָה לַתִּיכוֹנָה
  choice: On montait donc de l’étage inférieur à l’étage supérieur en passant par l’étage intermédiaire
  rationale: La syntaxe hébraïque est comprimée et difficile, mais décrit une montée entre trois niveaux. Le pronom indéfini « on » n’impose pas de sujet absent du texte.
- source_word: הַבַּיִת
  choice: le temple
  rationale: Dans la vision d’Ézéchiel, « la maison » désigne l’édifice du temple; « le temple » rend clairement le référent en français moderne.
