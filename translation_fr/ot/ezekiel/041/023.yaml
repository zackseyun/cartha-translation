  source_fidelity: La formulation « avaient chacun deux portes » rend explicite une distribution que l’hébreu ne marque pas. Le texte dit littéralement qu’il y avait « deux portes pour la grande salle et pour le sanctuaire »; dans le contexte immédiat (v. 24), ces deux portes sont ensuite décrites avec leurs battants. Une formulation collective conserve mieux la concision et l’ambiguïté de l’original.
