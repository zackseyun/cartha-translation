  text: And the nave and the sanctuary each had two doors[a].
translation:
  language: fr
  text: La grande salle et le sanctuaire avaient deux portes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׁתַּיִם
  choice: deux
  rationale: Le cardinal féminin s’accorde avec le pluriel féminin דְּלָתוֹת ; « deux » est la formulation française naturelle.
- source_word: דְּלָתוֹת
  choice: portes
  rationale: Le nom pluriel désigne des portes. « Battants » ou « portes à deux battants » préciserait une configuration que le lexème seul n’impose pas.
- source_word: הֵיכָל
  choice: grande salle
  rationale: Dans la vision du temple, le terme désigne la salle principale de l’édifice, distincte du sanctuaire intérieur. « Grande salle » est clair et naturel en français moderne.
- source_word: קֹּדֶשׁ
  choice: sanctuaire
  rationale: Le terme désigne ici l’espace sacré intérieur opposé à la grande salle. « Sanctuaire » conserve le caractère sacré sans imposer une désignation cultuelle plus technique.
- source_word: לַ/הֵיכָל וְ/לַ/קֹּדֶשׁ
  choice: La grande salle et le sanctuaire avaient chacun
  rationale: 'L’hébreu est une proposition sans verbe, littéralement « deux portes pour la grande salle et pour le sanctuaire ». L’ajout idiomatique de « avaient chacun » exprime naturellement la valeur distributive : deux portes pour chacun des deux espaces.'
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et architectural. « Grande salle » est préféré à « nef », qui évoque trop directement l’architecture ecclésiale postérieure ; la distinction avec le « sanctuaire » demeure nette.
