source:
  edition: WLC
  text: וַ/עֲשׂוּיָ֨ה אֲלֵי/הֶ֜ן אֶל דַּלְת֤וֹת הַֽ/הֵיכָל֙ כְּרוּבִ֣ים וְ/תִֽמֹרִ֔ים כַּ/אֲשֶׁ֥ר עֲשׂוּיִ֖ם לַ/קִּיר֑וֹת וְ/עָ֥ב עֵ֛ץ אֶל פְּנֵ֥י הָ/אוּלָ֖ם מֵ/הַ/חֽוּץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/025.yaml
  text: And cherubim and palm trees were made on them[a], on the doors of the nave, just as they were made on the walls[c][b]; and there was a wooden canopy before the front of the vestibule outside.
translation:
  language: fr
  text: Des chérubins et des palmiers étaient représentés[b] sur les portes de la grande salle[a], comme sur les murs. Une avancée en bois[c] se trouvait devant la façade du vestibule, à l’extérieur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la salle du sanctuaire ». Le mot hébreu désigne ici la salle principale de l’édifice.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « faits ». Dans ce contexte décoratif, on peut aussi comprendre « sculptés » ou « façonnés ».
    reason: lexical_alternative
  - marker: c
    text: Le terme architectural hébreu est incertain. Il pourrait désigner un auvent, une saillie ou un autre élément en bois placé devant le vestibule.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשׂוּיָה אֲלֵיהֶן
  choice: on avait représenté
  rationale: Le verbe passif dérivé de עשה signifie littéralement « avait été fait ». Dans ce contexte de décor architectural, « représenter » exprime naturellement en français la réalisation de figures sans préciser indûment qu’elles étaient sculptées plutôt que façonnées d’une autre manière.
- source_word: דַּלְתוֹת הַהֵיכָל
  choice: les portes de la grande salle
  rationale: הֵיכָל désigne ici la salle principale de l’édifice, et non l’ensemble du complexe. « Grande salle » est clair pour un lecteur moderne et évite les connotations ecclésiales possibles de « nef ».
- source_word: כְּרוּבִים
  choice: des chérubins
  rationale: « Chérubins » est le terme français traditionnel et intelligible pour ces êtres composites figurant dans le décor du sanctuaire.
- source_word: וְתִמֹרִים
  choice: et des palmiers
  rationale: Le nom désigne des figures de palmiers. La formulation directe conserve l’image concrète, tandis que le contexte indique qu’il s’agit de motifs décoratifs.
- source_word: כַּאֲשֶׁר עֲשׂוּיִם לַקִּירוֹת
  choice: comme sur les murs
  rationale: Cette formulation française concise maintient la comparaison explicite avec le décor déjà réalisé sur les murs, sans répétition lourde du verbe.
- source_word: וְעָב עֵץ
  choice: une avancée en bois
  rationale: עָב est un terme architectural incertain. « Avancée » rend prudemment l’idée probable d’un élément en saillie sans imposer l’identification plus précise d’un auvent, d’une poutre ou d’un seuil.
- source_word: אֶל פְּנֵי הָאוּלָם
  choice: devant la façade du vestibule
  rationale: La locution situe l’élément devant la face antérieure du אוּלָם, le vestibule ou portique qui précède la grande salle.
- source_word: מֵהַחוּץ
  choice: à l’extérieur
  rationale: Cette expression indique clairement que l’élément se trouvait du côté extérieur.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase est restructurée pour éviter la lourdeur de l’apposition hébraïque tout en conservant les portes comme support du décor. « Grande salle » privilégie l’intelligibilité ordinaire; les incertitudes relatives au procédé décoratif et à l’élément architectural sont conservées en notes.
