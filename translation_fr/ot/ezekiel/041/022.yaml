  text: הַ/מִּזְבֵּ֡חַ עֵ֣ץ שָׁלוֹשׁ֩ אַמּ֨וֹת גָּבֹ֜הַּ וְ/אָרְכּ֣/וֹ שְׁתַּֽיִם אַמּ֗וֹת וּ/מִקְצֹֽעוֹתָי/ו֙ ל֔/וֹ וְ/אָרְכּ֥/וֹ וְ/קִֽירֹתָ֖י/ו עֵ֑ץ וַ/יְדַבֵּ֣ר אֵלַ֔/י זֶ֚ה הַ/שֻּׁלְחָ֔ן אֲשֶׁ֖ר לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/022.yaml
  text: The altar was of wood[a], three cubits high and two cubits long; its corners, its length, and its sides were of wood. And he said to me, “This is the table that is before Yahweh.”
translation:
  language: fr
  text: 'L’autel était en bois[a], haut de trois coudées et long de deux coudées. Ses angles, sa longueur et ses parois étaient en bois. Et il me dit : « Voici la table qui est devant Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu commence par « l’autel », puis désigne le même objet comme « la table », sans expliquer ce changement de terme.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: l’autel
  rationale: Le nom désigne normalement un autel. Le texte le qualifie ensuite de « table » ; les deux termes sont donc conservés sans harmonisation.
- source_word: עֵץ
  choice: en bois
  rationale: Expression française naturelle indiquant le matériau de l’objet.
- source_word: שָׁלוֹשׁ אַמּוֹת גָּבֹהַּ
  choice: haut de trois coudées
  rationale: Formulation dimensionnelle claire et fidèle au masculin de « l’autel ».
- source_word: וְאָרְכּוֹ שְׁתַּיִם אַמּוֹת
  choice: long de deux coudées
  rationale: Rend explicitement la mesure de la longueur dans un français fluide.
- source_word: וּמִקְצֹעוֹתָיו לוֹ
  choice: ses angles
  rationale: מִקְצֹעוֹת désigne les angles ou parties d’angle ; le לוֹ idiomatique est naturellement absorbé dans le possessif.
- source_word: וְקִירֹתָיו
  choice: ses parois
  rationale: « Parois » conserve l’idée de surfaces verticales exprimée par קִירוֹת tout en convenant mieux que « murs » à ce petit meuble cultuel.
- source_word: וַיְדַבֵּר אֵלַי
  choice: Puis il me dit
  rationale: Introduction naturelle du discours direct en français narratif ; « puis » marque la progression sans surcharger la coordination.
- source_word: זֶה הַשֻּׁלְחָן
  choice: Voici la table
  rationale: « Voici » est idiomatique dans une désignation directe. « Table » maintient le changement lexical voulu par le texte.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: Rend directement l’expression spatiale et le nom divin.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme ; « Yahweh » préserve le nom propre plutôt que de le remplacer par un titre.
- issue: Rapport entre « autel » et « table »
  choice: Conserver les deux désignations dans le texte principal
  alternative: Uniformiser en « autel », en « table » ou en « autel-table »
  rationale: L’hébreu emploie successivement מִזְבֵּחַ et שֻׁלְחָן. Garder cette tension évite d’imposer une interprétation de la fonction du meuble.
translation_notes:
  register: Français international moderne, clair et digne. Les dimensions sont formulées naturellement ; « parois » évite l’étrangeté de « murs » pour un petit meuble tout en restant proche de l’hébreu. La ponctuation sépare la description générale de l’énumération structurelle.
