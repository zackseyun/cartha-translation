  text: מֵ/הָ/אָ֨רֶץ֙ עַד מֵ/עַ֣ל הַ/פֶּ֔תַח הַ/כְּרוּבִ֥ים וְ/הַ/תִּֽמֹרִ֖ים עֲשׂוּיִ֑ם וְ/קִ֖יר הַׄ/הֵׄיׄכָֽׄלׄ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/020.yaml
  text: From the floor to above the entrance[a], cherubim and palm trees were made[b], and on the wall of the nave.
translation:
  language: fr
  text: Du sol[a] jusqu’au-dessus de l’entrée, des chérubins et des palmiers étaient représentés sur le mur de la grande salle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis la terre » ou « depuis le niveau du sol », si l’on traduit plus littéralement ; dans ce contexte architectural, il s’agit du sol de la pièce.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu désigne probablement ici la grande salle du sanctuaire, et non l’ensemble du temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהָאָרֶץ
  choice: Du sol
  rationale: אֶרֶץ signifie ordinairement « terre » ou « pays », mais, dans cette description architecturale, désigne naturellement le niveau inférieur de la pièce, donc le sol.
- source_word: עַד מֵעַל הַפֶּתַח
  choice: jusqu’au-dessus de l’entrée
  rationale: La tournure indique l’étendue verticale du décor. « Entrée » rend naturellement פֶּתַח dans ce contexte architectural.
- source_word: הַכְּרוּבִים
  choice: des chérubins
  rationale: « Chérubins » est le terme biblique français consacré pour ces êtres associés à la présence et au trône divins.
- source_word: וְהַתִּמֹרִים
  choice: et des palmiers
  rationale: Le nom désigne des formes de palmiers dans le décor; le contexte indique qu’il s’agit de motifs représentés.
- source_word: עֲשׂוּיִם
  choice: étaient représentés
  rationale: Le participe passif signifie littéralement qu’ils étaient « faits » ou « exécutés ». « Représentés » exprime idiomatiquement leur réalisation comme motifs décoratifs sans préciser indûment la technique.
- source_word: וְקִיר הַהֵיכָל
  choice: sur le mur de la grande salle
  rationale: La proposition hébraïque finale est elliptique. L’ajout de « sur » explicite le rapport architectural naturel, tandis que הֵיכָל désigne ici la salle principale du sanctuaire plutôt que l’ensemble du complexe.
theological_decisions: []
