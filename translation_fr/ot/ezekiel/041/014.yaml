lexical_decisions:
- source_word: רֹחַב
  choice: largeur
  rationale: Le nom désigne ici une dimension horizontale dans un relevé architectural; « largeur » est le terme français courant et précis.
- source_word: פְּנֵי
  choice: façade
  rationale: Littéralement « face », le mot désigne ici la partie avant ou le front architectural; « façade » rend naturellement cet emploi spatial.
- source_word: הַבַּיִת
  choice: le Temple
  rationale: Dans cette vision, « la maison » désigne l’édifice du Temple. La traduction explicite le référent sans changer sa portée.
- source_word: הַגִּזְרָה
  choice: l’espace séparé
  rationale: Le terme désigne une zone distincte ou mise à part dans l’ensemble architectural; « espace séparé » reste clair sans préciser davantage une fonction incertaine.
- source_word: לַקָּדִים
  choice: du côté de l’est
  rationale: La préposition et le nom d’orientation indiquent le côté oriental. Cette formulation française convient au contexte de mesure tout en conservant la valeur spatiale.
- source_word: מֵאָה אַמָּה
  choice: cent coudées
  rationale: La mesure ancienne est conservée conformément au texte source, sans conversion moderne.
