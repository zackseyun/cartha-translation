review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : l’épée figure l’invasion, Koush est affecté par la catastrophe égyptienne, et les richesses de l’Égypte sont emportées. Toutefois, « l’angoisse saisira Koush » transforme la construction existentielle hébraïque (« il y aura de l’angoisse en Koush ») en une personnification plus interprétative. « Les morts tomberont » est également peu naturel et sémantiquement maladroit en français pour les victimes tuées dans le combat.'
  naturalness: La formulation révisée est plus idiomatique tout en gardant le ton prophétique. « Il y aura de l’angoisse en Koush » suit plus directement le texte; « les victimes tomberont » rend naturellement l’image militaire sans suggérer que des personnes déjà mortes tombent.
  terminology: « Koush » est une translittération appropriée. « Richesses » est défendable pour הֲמוֹנָהּ dans ce contexte de pillage, à condition que l’alternative « multitude/abondance » soit signalée. Une note sur « angoisse », qui peut aussi évoquer le tremblement ou les convulsions, préserve l’ambiguïté lexicale de חַלְחָלָה.
  issues:
  - severity: medium
    issue: Construction de וְהָיְתָה חַלְחָלָה
    rationale: « L’angoisse saisira Koush » ajoute une personnification et fait de Koush l’objet direct d’une action, tandis que l’hébreu énonce l’existence de la détresse en Koush.
  - severity: medium
    issue: « les morts tomberont »
    rationale: חָלָל désigne les tués ou victimes d’un conflit; « les morts tomberont » sonne contradictoire en français courant. « Les victimes tomberont » conserve l’image de la chute au combat.
  - severity: low
    issue: Ambiguïté de חַלְחָלָה non annotée
    rationale: Le texte principal « angoisse » est acceptable, mais le terme peut aussi renvoyer au tremblement ou aux convulsions. Une note brève rend compte de cette ambiguïté, conformément à l’approche retenue pour הָמוֹן.
