revisions:
- from: Une épée viendra contre l’Égypte, et l’angoisse saisira Koush[a] lorsque les morts tomberont en Égypte. On emportera ses richesses[b], et ses fondations seront démolies.
  to: Une épée viendra contre l’Égypte, et il y aura de l’angoisse[b] en Koush[a], lorsque les victimes tomberont en Égypte. On emportera ses richesses[c], et ses fondations seront démolies.
  rationale: La révision rapproche la syntaxe française de la proposition existentielle hébraïque, remplace une expression française maladroite pour les tués au combat et ajoute une note pour préserver l’ambiguïté de חַלְחָלָה. Elle conserve les choix contextuellement solides de « contre l’Égypte », « Koush », « richesses » et « fondations ».
