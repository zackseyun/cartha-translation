source:
  edition: WLC
  text: וּ/בָאָ֥ה חֶ֨רֶב֙ בְּ/מִצְרַ֔יִם וְ/הָיְתָ֤ה חַלְחָלָה֙ בְּ/כ֔וּשׁ בִּ/נְפֹ֥ל חָלָ֖ל בְּ/מִצְרָ֑יִם וְ/לָקְח֣וּ הֲמוֹנָ֔/הּ וְ/נֶהֶרְס֖וּ יְסוֹדֹתֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/004.yaml
  text: And a sword will come against Egypt[a], and there will be anguish in Cush, when the slain fall in Egypt, and they take away her wealth[c][b], and her foundations are torn down.
translation:
  language: fr
  text: Une épée viendra contre l’Égypte, et il y aura de l’angoisse[b] en Koush[a], lorsque les victimes tomberont en Égypte. On emportera ses richesses[c], et ses fondations seront démolies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Koush était la région située au sud de l’Égypte et correspondait largement à l’ancienne Nubie ; ce nom ne désigne donc pas simplement l’État moderne d’Éthiopie.
    reason: cultural_note
  - marker: b
    text: Ou « du tremblement ». Le terme hébreu peut évoquer le tremblement, les convulsions ou l’angoisse causés par le désastre.
    reason: lexical_alternative
  - marker: c
    text: Ou « sa multitude » ou « son abondance ». Le mot hébreu peut désigner une population, une abondance ou des richesses ; il est compris ici comme les biens emportés lors du pillage.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאָה
  choice: viendra
  rationale: Le parfait qal avec waw, dans ce discours prophétique, annonce ici un événement futur.
- source_word: חֶרֶב בְּמִצְרַיִם
  choice: une épée viendra contre l’Égypte
  rationale: « Épée » conserve la métonymie hébraïque de la guerre ou de l’invasion; « contre » exprime naturellement en français la portée hostile de la venue.
- source_word: וְהָיְתָה חַלְחָלָה
  choice: l’angoisse saisira
  rationale: חַלְחָלָה évoque le tremblement, les convulsions ou l’angoisse provoqués par le désastre; cette formulation française rend la détresse avec naturel.
- source_word: בְּכוּשׁ
  choice: en Koush
  rationale: Le nom historique est translittéré afin d’éviter l’identification trompeuse avec le seul État moderne d’Éthiopie.
- source_word: בִּנְפֹל חָלָל
  choice: lorsque les morts tomberont
  rationale: L’infinitif construit introduit une circonstance temporelle; חָלָל désigne couramment les tués au combat.
- source_word: וְלָקְחוּ הֲמוֹנָהּ
  choice: on emportera ses richesses
  rationale: הָמוֹן peut désigner une multitude, une abondance ou des richesses. Dans ce contexte de conquête et de destruction, le sens de biens emportés comme butin est probable; le pronom indéfini conserve l’agent non exprimé.
- source_word: וְנֶהֶרְסוּ יְסוֹדֹתֶיהָ
  choice: ses fondations seront démolies
  rationale: Le niphal indique que les fondations seront abattues ou détruites; l’image reste ouverte à un sens matériel ou figuré.
theological_decisions: []
