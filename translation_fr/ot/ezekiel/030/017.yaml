  yaml_path: translation/ot/ezekiel/030/017.yaml
  text: The young men of Aven and Pi-beseth will fall by the sword[b][a], and these cities will go into captivity.
translation:
  language: fr
  text: Les jeunes hommes d’Aven[a] et de Pi-Béset[b] tomberont par l’épée, et ces villes iront en captivité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aven désigne probablement On, c’est-à-dire Héliopolis, en Égypte.
    reason: alternative_reading
  - marker: b
    text: Pi-Béset est généralement identifiée à Bubastis.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּח֥וּרֵי
  choice: les jeunes hommes de
  rationale: Le nom désigne couramment des hommes jeunes, dans la force de l’âge; cette formulation convient au contexte guerrier sans suggérer qu’il s’agit nécessairement de soldats d’élite.
- source_word: אָ֛וֶן
  choice: Aven
  rationale: Le toponyme hébreu est conservé par translittération; son identification probable avec On, c’est-à-dire Héliopolis, est signalée en note.
- source_word: וּ/פִי בֶ֖סֶת
  choice: et de Pi-Béset
  rationale: Le nom de lieu est translittéré d’après la forme hébraïque; son identification habituelle avec Bubastis est indiquée en note.
- source_word: בַּ/חֶ֣רֶב
  choice: par l’épée
  rationale: Cette expression française naturelle conserve le sens instrumental et l’image conventionnelle de la mort au combat.
- source_word: יִפֹּ֑לוּ
  choice: tomberont
  rationale: Le verbe signifie littéralement « tomber » et évoque ici la mort au combat; garder cette image respecte la formulation hébraïque.
- source_word: וְ/הֵ֖נָּה
  choice: et ces villes
  rationale: Le pronom féminin pluriel renvoie aux deux villes nommées. Le référent est explicité en français afin d’éviter qu’il soit compris comme désignant les jeunes hommes.
- source_word: בַּ/שְּׁבִ֥י
  choice: en captivité
  rationale: Le nom exprime l’état de captivité ou la déportation; « en captivité » est direct et idiomatique dans cet oracle de jugement.
- source_word: תֵלַֽכְנָה
  choice: partiront
  rationale: Le verbe signifie « aller ». Avec « en captivité », « partiront » exprime naturellement la déportation tout en restant proche de l’image hébraïque.
