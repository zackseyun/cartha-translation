source:
  edition: WLC
  text: וְ/נָתַ֤תִּי אֵשׁ֙ בְּ/מִצְרַ֔יִם ח֤וּל תחיל סִ֔ין וְ/נֹ֖א תִּהְיֶ֣ה לְ/הִבָּקֵ֑עַ וְ/נֹ֖ף צָרֵ֥י יוֹמָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/016.yaml
  text: And I will set fire in Egypt[a]; Sin will writhe in anguish, and No will be broken open[d][c][b], and Noph will have enemies by day.
translation:
  language: fr
  text: Je mettrai le feu à l’Égypte ; Sin[a] se tordra de douleur, No[b] sera éventrée, et Noph[c] aura des ennemis en plein jour[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sin est généralement identifiée à la ville égyptienne de Péluse.
    reason: cross_reference
  - marker: b
    text: No est généralement identifiée à Thèbes.
    reason: cross_reference
  - marker: c
    text: Noph est généralement identifiée à Memphis.
    reason: cross_reference
  - marker: d
    text: 'Le texte hébreu de cette dernière proposition est très concis. On peut aussi comprendre : « Noph aura des adversaires pendant le jour » ; il pourrait s’agir d’une attaque ouverte ou continuelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֵשׁ בְּמִצְרַיִם
  choice: Je mettrai le feu à l’Égypte
  rationale: Littéralement « je mettrai/donnerai du feu en Égypte ». En français, « mettre le feu à » exprime naturellement l’action destructrice annoncée, sans réduire le feu à une simple métaphore.
- source_word: חוּל תחיל
  choice: se tordra de douleur
  rationale: La construction intensive du verbe חול évoque les convulsions, le tremblement ou les douleurs de l’enfantement. Cette formulation conserve l’image vive de la souffrance.
- source_word: סִין
  choice: Sin
  rationale: Le nom hébreu est translittéré dans le texte ; son identification courante avec Péluse est donnée en note.
- source_word: וְנֹא תִּהְיֶה לְהִבָּקֵעַ
  choice: No sera éventrée
  rationale: Le verbe בקע signifie fendre, ouvrir par rupture ou faire une brèche. Appliqué à une ville, « éventrée » restitue concrètement et avec concision l’idée d’une ville forcée et ouverte.
- source_word: וְנֹף
  choice: Noph
  rationale: Le nom hébreu est translittéré ; l’identification courante avec Memphis figure en note.
- source_word: צָרֵי יוֹמָם
  choice: aura des ennemis en plein jour
  rationale: La proposition hébraïque est très elliptique. צָרֵי désigne vraisemblablement des ennemis ou assaillants, et יוֹמָם signifie « de jour ». « En plein jour » souligne le caractère manifeste de l’attaque sans en préciser abusivement la durée.
