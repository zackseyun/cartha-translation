id: EZK.30.9
reference: Ezekiel 30:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יֵצְא֨וּ מַלְאָכִ֤ים מִ/לְּ/פָנַ/י֙ בַּ/צִּ֔ים לְ/הַחֲרִ֖יד אֶת כּ֣וּשׁ בֶּ֑טַח וְ/הָיְתָ֨ה חַלְחָלָ֤ה בָ/הֶם֙ בְּ/י֣וֹם מִצְרַ֔יִם כִּ֥י הִנֵּ֖ה בָּאָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/009.yaml
  text: On that day messengers will go out from before me in ships to terrify Cush[a], secure as she is, and trembling will come upon them on the day of Egypt, for behold[c][b], it is coming.
translation:
  language: fr
  text: Ce jour-là, des messagers[a] partiront d’auprès de moi sur des navires pour terrifier Koush[b], qui vit en sécurité. L’angoisse les saisira au jour de l’Égypte[c], car voici qu’elle arrive[d] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « envoyés ». Le mot hébreu peut aussi désigner des anges, mais le contexte évoque plus probablement des messagers humains apportant la nouvelle de la chute de l’Égypte.
    reason: lexical_alternative
  - marker: b
    text: Koush désigne une région située au sud de l’Égypte, souvent associée à la Nubie ; le nom est traditionnellement rendu par « Éthiopie ».
    reason: cultural_note
  - marker: c
    text: Littéralement « au jour de l’Égypte », c’est-à-dire au jour où le jugement atteindra l’Égypte.
    reason: cultural_note
  - marker: d
    text: Le verbe hébreu est au féminin singulier. Il peut renvoyer à l’angoisse qui vient d’être mentionnée ou, de manière elliptique, à la calamité imminente.
    reason: ambiguity_note
lexical_decisions:
- source_word: מַלְאָכִים
  choice: messagers
  rationale: Dans cet oracle géopolitique, le terme désigne très probablement des messagers humains annonçant la chute de l’Égypte, tout en conservant le sens général du mot hébreu.
- source_word: מִלְּפָנַי
  choice: d’auprès de moi
  rationale: Cette formulation française naturelle conserve l’idée d’un départ depuis la présence du locuteur divin, sans la lourdeur de « de devant moi ».
- source_word: בַּצִּים
  choice: sur des navires
  rationale: Le substantif désigne des embarcations ou navires ; « sur des navires » exprime naturellement en français le moyen de déplacement.
- source_word: לְהַחֲרִיד
  choice: pour terrifier
  rationale: La forme causative indique qu’ils provoquent l’effroi ou le tremblement ; « terrifier » en restitue la force.
- source_word: כּוּשׁ
  choice: Koush
  rationale: La translittération française du nom ancien évite de l’identifier sans nuance à l’Éthiopie moderne.
- source_word: בֶּטַח
  choice: qui vit en sécurité
  rationale: Le mot décrit l’état confiant de Koush et fait ressortir le contraste avec la terreur imminente.
- source_word: חַלְחָלָה
  choice: l’angoisse
  rationale: Le nom évoque un tremblement convulsif causé par l’effroi ; « l’angoisse » est naturel en français et garde sa force émotionnelle.
- source_word: בָהֶם
  choice: les saisira
  rationale: La construction française rend de façon idiomatique l’expérience qui vient sur eux, tout en conservant le pronom pluriel hébreu.
- source_word: בְּיוֹם מִצְרַיִם
  choice: au jour de l’Égypte
  rationale: Le tour compact de l’hébreu est maintenu dans le texte, avec une note explicitant qu’il s’agit du temps du jugement de l’Égypte.
- source_word: כִּי הִנֵּה בָּאָה
  choice: car voici qu’elle arrive
  rationale: La tournure conserve l’imminence et la certitude de l’annonce ainsi que le féminin du verbe hébreu, sans expliciter abusivement son référent.
theological_decisions:
- issue: Perspective du locuteur divin dans l’annonce du jugement
  choice: Les messagers partent « d’auprès de moi »
  alternative: « envoyés par moi » ou simplement « de moi »
  rationale: L’hébreu emploie une expression de présence. La conserver présente le jugement comme procédant de la présence même de Dieu, sans ajouter d’interprétation doctrinale.
- issue: Référent féminin dans la dernière proposition
  choice: Conserver le pronom féminin « elle » et signaler l’ambiguïté en note
  alternative: Expliciter « l’angoisse arrive » ou « ce jour arrive »
  rationale: Le verbe hébreu est féminin singulier, mais son référent demeure elliptique. Le rattacher définitivement à l’angoisse ou à une calamité implicite résoudrait une tension que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase garde le rythme solennel de l’oracle, évite les archaïsmes et explicite seulement ce qui est nécessaire à la fluidité.
