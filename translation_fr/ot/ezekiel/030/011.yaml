  text: ה֠וּא וְ/עַמּ֤/וֹ אִתּ/וֹ֙ עָרִיצֵ֣י גוֹיִ֔ם מֽוּבָאִ֖ים לְ/שַׁחֵ֣ת הָ/אָ֑רֶץ וְ/הֵרִ֤יקוּ חַרְבוֹתָ/ם֙ עַל מִצְרַ֔יִם וּ/מָלְא֥וּ אֶת הָ/אָ֖רֶץ חָלָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/011.yaml
  text: He and his people with him—the ruthless of the nations—will be brought in to destroy the land[a]. They will draw their swords against Egypt and fill the land with the slain.
translation:
  language: fr
  text: Lui et son peuple — les plus violents des nations — seront amenés pour dévaster le pays. Ils tireront leurs épées contre l’Égypte et rempliront le pays de morts.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַמּוֹ
  choice: son peuple
  rationale: Le nom עַם signifie normalement « peuple » et peut, dans ce contexte militaire, désigner les hommes qui accompagnent le conquérant sans imposer la précision « armée ».
- source_word: עָרִיצֵי גוֹיִם
  choice: les hommes violents parmi les nations
  rationale: עָרִיץ qualifie des personnes brutales, impitoyables ou redoutables. « Hommes violents » rend leur caractère, tandis que « parmi les nations » exprime naturellement la relation du construit sans introduire un superlatif absent de l’hébreu.
- source_word: מוּבָאִים
  choice: seront amenés
  rationale: Le participe hofal de בוא exprime le fait d’être conduit ou amené. Le futur convient à la perspective prophétique et aux verbes qui suivent.
- source_word: לְשַׁחֵת
  choice: pour dévaster
  rationale: Dans une attaque dirigée contre un pays, שׁחת évoque sa ruine et sa dévastation. « Dévaster » est plus idiomatique ici que « détruire le pays ».
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans cet oracle contre l’Égypte, אֶרֶץ désigne son territoire; « le pays » est naturel en français et maintient le référent contextuel.
- source_word: וְהֵרִיקוּ חַרְבוֹתָם עַל
  choice: Ils tireront leurs épées contre
  rationale: L’expression idiomatique signifie sortir les épées de leur fourreau en vue d’attaquer. « Tirer leurs épées contre » restitue clairement cette image militaire.
- source_word: וּמָלְאוּ אֶת־הָאָרֶץ חָלָל
  choice: rempliront le pays de morts
  rationale: חָלָל désigne ici des personnes tuées, notamment au combat. « De morts » est direct, naturel et digne en français.
