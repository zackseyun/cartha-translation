  to: Lui et son peuple — les plus violents des nations — seront amenés pour dévaster le pays. Ils tireront leurs épées contre l’Égypte et rempliront le pays de morts.
  rationale: La révision corrige principalement la construction « parmi les nations », qui ne rendait pas adéquatement le génitif hébreu. Elle allège aussi la première proposition sans modifier le référent ni la portée prophétique. Aucun ajout doctrinal ou interprétatif n’est introduit, et aucune note n’est nécessaire pour ce verset.
