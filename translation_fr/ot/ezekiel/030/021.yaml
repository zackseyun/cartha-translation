  text: בֶּן אָדָ֕ם אֶת זְר֛וֹעַ פַּרְעֹ֥ה מֶֽלֶךְ מִצְרַ֖יִם שָׁבָ֑רְתִּי וְ/הִנֵּ֣ה לֹֽא חֻ֠בְּשָׁה לָ/תֵ֨ת רְפֻא֜וֹת לָ/שׂ֥וּם חִתּ֛וּל לְ/חָבְשָׁ֥/הּ לְ/חָזְקָ֖/הּ לִ/תְפֹּ֥שׂ בֶּ/חָֽרֶב־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/021.yaml
  text: Son of man[a], I have broken the arm of Pharaoh king of Egypt, and behold, it has not been bound up to apply remedies, to put on a bandage, to bind it, to strengthen it so that it may grasp the sword.
translation:
  language: fr
  text: 'Fils d’homme, j’ai brisé le bras du pharaon, roi d’Égypte. Or voici qu’il n’a pas été pansé : on n’y a pas appliqué de remèdes[a], ni posé un bandage pour le bander et le fortifier, afin qu’il puisse saisir l’épée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lui apporter des soins » ; l’expression hébraïque désigne le traitement médical du bras brisé.
    reason: alternative_lexicale
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Conserve l’expression caractéristique par laquelle Dieu s’adresse au prophète dans Ézéchiel, sans l’interpréter comme simple synonyme de « mortel ».
- source_word: זְרוֹעַ
  choice: bras
  rationale: Le sens concret porte naturellement la métaphore de la puissance militaire du pharaon.
- source_word: שָׁבָרְתִּי
  choice: j’ai brisé
  rationale: Le passé composé exprime un acte accompli dont les conséquences demeurent présentes.
- source_word: וְהִנֵּה
  choice: Or voici que
  rationale: Rend la vivacité du marqueur discursif hébreu dans un français actuel et soutenu.
- source_word: חֻבְּשָׁה
  choice: il n’a pas été pansé
  rationale: Le verbe « panser » restitue ici l’image médicale tout en convenant grammaticalement au bras.
- source_word: לָתֵת רְפֻאוֹת
  choice: on n’y a pas appliqué de remèdes
  rationale: Rend concrètement l’administration de traitements au membre brisé et respecte le pluriel hébreu.
- source_word: חִתּוּל
  choice: bandage
  rationale: Terme médical clair et courant pour ce qui enveloppe et soutient le membre blessé.
- source_word: לְחָבְשָׁהּ לְחָזְקָהּ
  choice: pour le maintenir et le fortifier
  rationale: Exprime la fonction du bandage et la finalité de rendre le bras de nouveau ferme, sans alourdir le français par une répétition maladroite de « bander ».
- source_word: לִתְפֹּשׂ בֶּחָרֶב
  choice: afin qu’il puisse saisir l’épée
  rationale: Préserve l’image concrète du retour à la capacité militaire, sans substituer le terme plus interprétatif « manier ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation clarifie la longue chaîne de soins absents. Le texte conserve l’image du bras brisé et de l’épée, tout en formulant naturellement le traitement médical.
