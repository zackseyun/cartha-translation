    issue: Alternative restrictive dans la note c
    rationale: « Toute sa richesse » peut limiter « le pays et ce qui le remplit » aux biens matériels, alors que l’hébreu englobe tout ce qui remplit le pays. Une alternative inclusive évite cette réduction.
