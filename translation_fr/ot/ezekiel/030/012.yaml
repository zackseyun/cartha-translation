source:
  edition: WLC
  text: וְ/נָתַתִּ֤י יְאֹרִים֙ חָֽרָבָ֔ה וּ/מָכַרְתִּ֥י אֶת הָ/אָ֖רֶץ בְּ/יַד רָעִ֑ים וַ/הֲשִׁמֹּתִ֞י אֶ֤רֶץ וּ/מְלֹאָ/הּ֙ בְּ/יַד זָרִ֔ים אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/012.yaml
  text: And I will make the Nile channels dry[a], and I will sell the land into the hand of evil men; and I will devastate the land and its fullness by the hand of foreigners. I am Yahweh[c][b]; I have spoken.
translation:
  language: fr
  text: Je mettrai à sec les bras du Nil[a], je vendrai le pays à des hommes méchants[b] et, par la main d’étrangers, je dévasterai le pays et tout ce qu’il contient[c]. Moi, Yahweh, j’ai parlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les canaux » ou « les fleuves » ; dans le contexte égyptien, le terme désigne probablement les cours d’eau du Nil.
    reason: lexical_alternative
  - marker: b
    text: Ou « je livrerai le pays au pouvoir d’hommes méchants » ; le verbe hébreu signifie littéralement « vendre » et évoque ici le fait de livrer le pays à une puissance hostile.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement « le pays et ce qui le remplit » ; autre traduction possible : « le pays et tout ce qui s’y trouve ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְאֹרִים
  choice: les bras du Nil
  rationale: Dans ce contexte égyptien, le terme désigne les cours d’eau liés au Nil; « bras du Nil » est précis, naturel en français et laisse la note signaler les autres possibilités.
- source_word: חָרָבָה
  choice: à sec
  rationale: Avec le verbe נתן et des cours d’eau comme complément, l’expression signifie les assécher; « mettre à sec » est idiomatique en français.
- source_word: וּמָכַרְתִּי
  choice: je vendrai
  rationale: Le verbe signifie littéralement « vendre ». Cette formulation conserve l’image forte du jugement divin, tandis que la note explicite le sens contextuel de livrer au pouvoir d’autrui.
- source_word: בְּיַד רָעִים
  choice: à des hommes mauvais
  rationale: Le pluriel substantivé désigne des personnes mauvaises. Avec « vendre », la préposition française « à » exprime naturellement le transfert de pouvoir impliqué par l’hébreu « dans la main de ».
- source_word: וַהֲשִׁמֹּתִי
  choice: je dévasterai
  rationale: Ce verbe rend clairement la valeur causative de la forme hébraïque et convient au registre prophétique sans archaïsme.
- source_word: אֶרֶץ וּמְלֹאָהּ
  choice: le pays et tout ce qu’il contient
  rationale: Cette expression restitue naturellement l’idée du pays avec tout ce qui le remplit, sans le calque peu idiomatique « sa plénitude ».
- source_word: בְּיַד זָרִים
  choice: par la main d’étrangers
  rationale: La formulation conserve l’image hébraïque de la main comme instrument ou pouvoir et traduit זָרִים par « étrangers » dans le contexte d’envahisseurs venus du dehors.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: דִּבַּרְתִּי
  choice: j’ai parlé
  rationale: Cette traduction directe conserve la formule prophétique qui souligne la certitude de l’annonce.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin lui-même. « Yahweh » le représente comme nom propre, sans remplacer celui-ci par un titre.
- issue: Image judiciaire de la vente du pays
  choice: je vendrai le pays
  alternative: je livrerai le pays
  rationale: Le choix principal conserve la métaphore hébraïque forte de la vente. La note indique le sens contextuel possible sans effacer l’image ni en fixer excessivement l’interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le rythme solennel de l’oracle tout en évitant les calques obscurs. Les images hébraïques significatives, notamment « vendre » et « par la main », sont conservées ou expliquées en note.
