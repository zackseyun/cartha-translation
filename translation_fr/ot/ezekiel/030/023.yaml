  text: וַ/הֲפִצוֹתִ֥י אֶת מִצְרַ֖יִם בַּ/גּוֹיִ֑ם וְ/זֵרִיתִ֖/ם בָּ/אֲרָצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/023.yaml
  text: And I will scatter Egypt among the nations[a], and I will disperse them among the lands.
translation:
  language: fr
  text: Et je disperserai l’Égypte[a] parmi les nations, et je les éparpillerai dans les pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit « l’Égypte » dans la première proposition, puis emploie « les » dans la seconde : le nom du pays représente ici ses habitants.'
    reason: Préciser le passage du nom national singulier à un pronom désignant collectivement la population.
lexical_decisions:
- source_word: וַהֲפִצוֹתִי
  choice: Et je disperserai
  rationale: Le hifil de פוץ exprime l’action causative de disperser. Le futur français convient à cette déclaration prophétique, et la conjonction initiale est conservée.
- source_word: מִצְרַיִם
  choice: l’Égypte
  rationale: Le texte nomme littéralement l’Égypte. Le nom du pays désigne ici, par métonymie, sa population, comme le confirme le pronom pluriel de la proposition suivante.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: גּוֹיִם désigne couramment les nations, et « parmi » exprime naturellement la dispersion au milieu d’elles.
- source_word: וְזֵרִיתִם
  choice: et je les éparpillerai
  rationale: זרה signifie disperser ou éparpiller, avec parfois l’image du vannage. « Éparpiller » préserve la variation lexicale du parallélisme et rend explicitement le suffixe pluriel « les ».
- source_word: בָּאֲרָצוֹת
  choice: dans les pays
  rationale: Le pluriel אֲרָצוֹת renvoie à plusieurs terres ou pays. « Dans les pays » garde la valeur locative de la préposition sans préciser davantage que l’hébreu.
theological_decisions:
- issue: Passage du nom singulier « l’Égypte » au pronom pluriel « les »
  choice: Conserver « l’Égypte » dans la première proposition et le pronom pluriel « les » dans la seconde.
  alternative: Traduire « les Égyptiens » dans les deux propositions pour régulariser l’accord.
  rationale: L’hébreu juxtapose le nom du pays et un suffixe pronominal pluriel, le pays représentant collectivement ses habitants. La traduction conserve ce déplacement plutôt que de l’aplanir.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme est maintenu par « disperser » puis « éparpiller », tandis que la légère rupture grammaticale entre « l’Égypte » et « les » reproduit une particularité significative de l’hébreu.
