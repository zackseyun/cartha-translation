  text: בֶּן אָדָ֕ם הִנָּבֵא֙ וְ/אָ֣מַרְתָּ֔ כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הֵילִ֖ילוּ הָ֥הּ לַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/002.yaml
  text: 'Son of man[a], prophesy and say, ‘Thus says the Lord GOD: Wail[b], “Alas for the day!”’'
translation:
  language: fr
  text: 'Fils d’homme, prophétise et dis : « Ainsi parle le Seigneur Yahweh : Lamentez-vous[a] : “Hélas pour le jour[b] !” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Poussez des hurlements ». Le verbe hébreu désigne un cri intense de lamentation.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le jour ». Ou : « Ah, le jour ! » L’interjection exprime la douleur ou l’effroi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Adresse divine caractéristique et répétée dans Ézéchiel. Cette traduction conserve l’image et la cohérence du livre sans réduire l’expression à « mortel ».
- source_word: הִנָּבֵא
  choice: prophétise
  rationale: L’impératif de נבא ordonne à Ézéchiel de transmettre une parole prophétique; « prophétise » est direct, naturel et fidèle au registre.
- source_word: וְאָמַרְתָּ
  choice: et dis
  rationale: La formulation conserve les deux impératifs successifs de l’hébreu dans un français concis.
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule française consacrée et naturelle pour la formule prophétique introduisant un message divin.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: « Seigneur » traduit אֲדֹנָי et « Yahweh » représente distinctement le nom divin יהוה, en évitant le redoublement « Seigneur SEIGNEUR ».
- source_word: הֵילִילוּ
  choice: Lamentez-vous
  rationale: L’impératif pluriel décrit une lamentation exprimée à grands cris. « Lamentez-vous » reste digne et intelligible; une note conserve la possibilité plus expressive « poussez des hurlements ».
- source_word: הָהּ
  choice: Hélas
  rationale: Interjection exprimant la douleur ou l’effroi. « Hélas » garde sa valeur de cri sans la transformer en formule explicite de condamnation.
- source_word: לַיּוֹם
  choice: pour ce jour
  rationale: Rend la préposition ל et la référence définie au jour annoncé, tout en conservant la brièveté menaçante de l’hébreu.
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte associe le titre אֲדֹנָי au nom propre יהוה. La traduction retenue distingue les deux éléments et rend visible le nom divin présent dans la source.
- issue: Nature du cri הָהּ לַיּוֹם
  choice: Hélas pour ce jour !
  alternative: Malheur à ce jour !
  rationale: « Hélas » préserve d’abord l’interjection de douleur ou d’effroi. « Malheur » préciserait davantage une déclaration de jugement que ne le fait à lui seul le terme hébreu, même si le contexte annonce bien un jugement.
translation_notes:
  register: Français international moderne, solennel mais accessible. La structure impérative et la formule prophétique sont conservées; les guillemets emboîtés distinguent l’ordre divin du cri de lamentation.
