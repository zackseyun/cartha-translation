  terminology: « Seigneur Yahweh » rend distinctement אֲדֹנָי יְהוִה sans imposer de lecture doctrinale supplémentaire. « Lamentez-vous » convient au cri de deuil/détresse, tandis que la note conserve une possibilité plus véhémente.
