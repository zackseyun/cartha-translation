source:
  edition: WLC
  text: וְ/חִזַּקְתִּ֗י אֶת זְרֹעוֹת֙ מֶ֣לֶךְ בָּבֶ֔ל וְ/נָתַתִּ֥י אֶת חַרְבִּ֖/י בְּ/יָד֑/וֹ וְ/שָׁבַרְתִּי֙ אֶת זְרֹע֣וֹת פַּרְעֹ֔ה וְ/נָאַ֛ק נַאֲק֥וֹת חָלָ֖ל לְ/פָנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/024.yaml
  text: And I will strengthen the arms of the king of Babylon[a], and I will put my sword into his hand; but I will break the arms of Pharaoh, and he will groan before him with the groanings of a slain man.
translation:
  language: fr
  text: Je fortifierai les bras du roi de Babylone et je mettrai mon épée dans sa main. Mais je briserai les bras du pharaon, et celui-ci poussera devant lui[a] les gémissements d’un homme mortellement blessé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant moi », si l’on comprend que le pronom final renvoie au Seigneur plutôt qu’au roi de Babylone.
    reason: alternative_reading
lexical_decisions:
- source_word: וְחִזַּקְתִּי
  choice: Je fortifierai
  rationale: Le parfait avec waw, dans cette suite prophétique, a une valeur future. « Fortifier » conserve l’image concrète de la puissance militaire accrue.
- source_word: זְרֹעוֹת
  choice: les bras
  rationale: 'Le sens littéral maintient la métaphore structurante du passage : les bras du roi de Babylone sont fortifiés, tandis que ceux du pharaon sont brisés.'
- source_word: מֶלֶךְ בָּבֶל
  choice: le roi de Babylone
  rationale: Rendu direct de la construction hébraïque, sans ajouter le nom du souverain.
- source_word: וְנָתַתִּי אֶת חַרְבִּי בְּיָדוֹ
  choice: je mettrai mon épée dans sa main
  rationale: Cette formulation française naturelle conserve l’image de l’épée de Dieu confiée au roi de Babylone comme instrument de jugement.
- source_word: וְשָׁבַרְתִּי אֶת זְרֹעוֹת פַּרְעֹה
  choice: je briserai les bras du pharaon
  rationale: « Briser » et « les bras » préservent le contraste verbal et imagé avec la première proposition.
- source_word: וְנָאַק נַאֲקוֹת
  choice: celui-ci gémira
  rationale: « Celui-ci » identifie naturellement le pharaon comme sujet, tandis que « gémira » exprime sa plainte douloureuse. La construction intensive avec le nom apparenté est rendue sans lourdeur artificielle en français.
- source_word: חָלָל
  choice: un homme blessé à mort
  rationale: Le terme désigne une victime frappée ou transpercée, souvent un homme tué. « Blessé à mort » convient à l’image d’un homme qui gémit encore tout en étant voué à mourir.
- source_word: לְפָנָיו
  choice: devant lui
  rationale: Le pronom renvoie le plus naturellement au roi de Babylone, mais son antécédent demeure suffisamment ambigu pour justifier une note.
theological_decisions:
- issue: Référent du pronom dans לְפָנָיו
  choice: Le pharaon gémit devant le roi de Babylone.
  alternative: Le pharaon gémit devant le Seigneur (« devant moi » selon le référent compris dans le discours divin).
  rationale: Le roi de Babylone est l’antécédent masculin singulier le plus proche et le contexte décrit l’humiliation du pharaon devant le conquérant dont Dieu se sert. La note conserve toutefois l’ambiguïté réelle du référent sans en tirer une conclusion doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Les images concrètes des bras et de l’épée sont conservées; la tournure du gémissement est légèrement idiomatisée pour éviter une répétition maladroite en français.
