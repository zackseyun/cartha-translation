reference: Ezekiel 30:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הַחֲזַקְתִּ֗י אֶת זְרֹעוֹת֙ מֶ֣לֶךְ בָּבֶ֔ל וּ/זְרֹע֥וֹת פַּרְעֹ֖ה תִּפֹּ֑לְנָה וְֽ/יָדְע֞וּ כִּֽי אֲנִ֣י יְהוָ֗ה בְּ/תִתִּ֤/י חַרְבִּ/י֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל וְ/נָטָ֥ה אוֹתָ֖/הּ אֶל אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/025.yaml
  text: I will strengthen the arms of the king of Babylon[a], but Pharaoh’s arms will fall. Then they will know that I am Yahweh[b], when I put my sword into the hand of the king of Babylon and he stretches it out against the land of Egypt.
translation:
  language: fr
  text: Je fortifierai les bras du roi de Babylone, mais les bras du pharaon tomberont[a]. Alors ils sauront que je suis Yahweh[b], quand je mettrai mon épée dans la main du roi de Babylone et qu’il la tendra contre le pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « les bras du pharaon faibliront ». L’hébreu dit littéralement « tomberont », conservant l’image d’un effondrement militaire.'
    reason: lexical_alternative
  - marker: b
    text: Le nom hébreu YHWH est rendu ici par « Yahweh ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֲזַקְתִּי
  choice: Je fortifierai
  rationale: Le hifil de חזק exprime ici l’action de rendre fort. « Fortifierai » est naturel en français et maintient le contraste militaire avec la chute des bras du pharaon.
- source_word: זְרֹעוֹת
  choice: les bras
  rationale: Le terme concret est conservé afin de préserver l’image corporelle qui représente la puissance militaire.
- source_word: מֶלֶךְ בָּבֶל
  choice: le roi de Babylone
  rationale: Traduction directe de la construction hébraïque.
- source_word: וּזְרֹעוֹת פַּרְעֹה תִּפֹּלְנָה
  choice: mais les bras du pharaon tomberont
  rationale: « Mais » rend naturellement le contraste contextuel porté par la conjonction. « Tomberont » conserve le verbe נפל et l’image saisissante de l’effondrement militaire.
- source_word: וְיָדְעוּ
  choice: Alors ils sauront
  rationale: « Alors » exprime en français la conséquence des actes de jugement qui précèdent.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: בְּתִתִּי חַרְבִּי בְּיַד מֶלֶךְ בָּבֶל
  choice: quand je mettrai mon épée dans la main du roi de Babylone
  rationale: Cette formulation conserve l’image selon laquelle Yahweh remet son propre instrument de jugement au roi de Babylone.
- source_word: חַרְבִּי
  choice: mon épée
  rationale: La traduction littérale préserve l’image de l’instrument du jugement de Yahweh.
- source_word: וְנָטָה אוֹתָהּ
  choice: et qu’il la tendra
  rationale: « Tendra » correspond au sens courant de נטה et garde le geste concret de l’épée dirigée vers sa cible.
- source_word: אֶל אֶרֶץ מִצְרָיִם
  choice: contre le pays d’Égypte
  rationale: Dans ce contexte militaire hostile, « contre » exprime naturellement la direction de l’attaque sans effacer la valeur directionnelle de אֶל.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le tétragramme. « Yahweh » conserve le nom propre divin, tandis que « le SEIGNEUR » lui substituerait un titre.
- issue: Babylone comme instrument du jugement divin
  choice: Yahweh met son épée dans la main du roi de Babylone, qui la tend contre l’Égypte
  alternative: Une formulation plus générale qui dissocierait l’action de Yahweh de celle du roi de Babylone
  rationale: L’hébreu maintient ensemble la souveraineté de Yahweh et l’action du roi babylonien, sans développer davantage leur relation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure proche de l’hébreu tout en étant idiomatique. Les images coordonnées des bras, de l’épée et de la main sont conservées. L’article est employé dans « du pharaon », usage naturel en français lorsque le titre désigne ici le souverain d’Égypte.
