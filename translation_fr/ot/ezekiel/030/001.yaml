lexical_decisions:
- source_word: וַיְהִי
  choice: me fut adressée
  rationale: Dans cette formule prophétique, la forme narrative de היה se combine naturellement en français avec l’idée que la parole divine parvient au prophète. « Me fut adressée » restitue cette venue sans employer le calque lourd « il arriva que ».
- source_word: דְבַר
  choice: la parole
  rationale: Dans la formule דְבַר יְהוָה, « la parole » désigne une communication divine précise et conserve le vocabulaire prophétique traditionnel.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin YHWH et le rend comme un nom propre plutôt que de lui substituer un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » exprime naturellement en français la direction vers le prophète indiquée par אֵלַי.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif introduit le contenu du discours divin qui suit. « En ces termes » remplit cette fonction de manière naturelle et digne en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu emploie directement le tétragramme YHWH. Le choix « Yahvé » conserve le nom personnel, tandis que la note signale les substitutions traditionnelles par un titre.
translation_notes:
  register: Français moderne, clair et digne. La tournure prophétique consacrée « La parole de … me fut adressée » évite un calque hébraïque maladroit, tandis que « en ces termes » annonce naturellement l’oracle du verset suivant.
