  yaml_path: translation/ot/ezekiel/030/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: fr
  text: 'La parole de Yahvé[a] me fut adressée en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le Seigneur » ou « l’Éternel ».'
