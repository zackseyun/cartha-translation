  text: וַ/הֲשִׁמֹּתִי֙ אֶת פַּתְר֔וֹס וְ/נָתַ֥תִּי אֵ֖שׁ בְּ/צֹ֑עַן וְ/עָשִׂ֥יתִי שְׁפָטִ֖ים בְּ/נֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/014.yaml
  text: I will make Pathros desolate[a], and I will set fire in Zoan[c][b], and I will execute judgments on No.
translation:
  language: fr
  text: Je dévasterai Patros[a], je mettrai le feu à Tsoan[b] et j’exécuterai des jugements contre No[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je ferai de Patros une terre désolée ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « je donnerai du feu à Tsoan ».'
    reason: lexical_alternative
  - marker: c
    text: No est la ville égyptienne aussi connue sous le nom de Thèbes.
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  choice: Je dévasterai
  rationale: Le causatif de שׁמם exprime le fait de rendre un lieu désolé. « Dévaster » restitue naturellement en français l’action et son résultat, tandis que la variante en note conserve une formulation plus formelle.
- source_word: פַּתְרוֹס
  choice: Patros
  rationale: Nom géographique égyptien, translittéré selon une forme française claire et proche de l’hébreu.
- source_word: וְנָתַתִּי אֵשׁ
  choice: je mettrai le feu
  rationale: Littéralement « je donnerai du feu » ; l’expression française « mettre le feu » rend naturellement l’idée d’un incendie destructeur provoqué.
- source_word: בְּצֹעַן
  choice: à Tsoan
  rationale: La préposition בְּ situe ici l’incendie dans la ville. « À » est la tournure française naturelle devant un nom de ville.
- source_word: וְעָשִׂיתִי שְׁפָטִים
  choice: j’exécuterai mes jugements
  rationale: L’expression hébraïque désigne l’accomplissement d’actes judiciaires punitifs. L’ajout naturel du possessif « mes » explicite que ces jugements sont ceux du locuteur divin sans changer l’agent.
- source_word: בְּנֹא
  choice: contre No
  rationale: Avec des actes de jugement, בְּ marque ici la cible. « Contre » exprime clairement leur orientation punitive tout en gardant le nom hébreu de la ville.
theological_decisions:
- issue: Caractère direct de l’action divine dans l’oracle de jugement
  choice: 'Conserver les verbes à la première personne comme des actions directement accomplies par Dieu : « Je dévasterai… je mettrai… j’exécuterai ».'
  alternative: Employer une formulation atténuée présentant Dieu comme permettant seulement ces événements.
  rationale: L’hébreu présente explicitement le locuteur divin comme sujet et agent des trois actions ; la traduction ne doit pas affaiblir cette affirmation.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme des trois verbes à la première personne est préservé. Les toponymes « Patros », « Tsoan » et « No » suivent de près les formes hébraïques ; l’identification de No à Thèbes est donnée en note plutôt qu’intégrée au texte.
