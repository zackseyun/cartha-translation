  text: וַ/יְהִ֗י בְּ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה בָּֽ/רִאשׁ֖וֹן בְּ/שִׁבְעָ֣ה לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/020.yaml
  text: And it happened in the eleventh year, in the first month, on the seventh day of the month, that the word of Yahweh came to me, saying,
translation:
  language: fr
  text: 'La onzième année, le septième jour du premier mois, la parole de Yahweh me fut adressée :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: La onzième année… la parole… me fut adressée
  rationale: Dans cette formule narrative datée, le français naturel n’a pas besoin d’un équivalent indépendant de « et il arriva » ; la construction est intégrée à la proposition principale sans perte de sens.
- source_word: בְּאַחַת עֶשְׂרֵה שָׁנָה
  choice: La onzième année
  rationale: Le cardinal hébreu employé dans la formule chronologique correspond idiomatiquement à un ordinal en français.
- source_word: בָּרִאשׁוֹן
  choice: du premier mois
  rationale: « Premier » est substantivé en hébreu ; l’ajout de « mois » explicite le nom sous-entendu par la formule de datation.
- source_word: בְּשִׁבְעָה לַחֹדֶשׁ
  choice: le septième jour
  rationale: La tournure hébraïque désigne le septième jour du mois. Réunie à « du premier mois », elle donne une date claire et fluide en français.
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: la parole de Yahweh me fut adressée
  rationale: Cette formulation française courante rend la formule prophétique selon laquelle la parole divine parvient au prophète.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel exprimé par le tétragramme, au lieu de le remplacer par un titre.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Les deux-points introduisent naturellement en français le discours direct qui commence au verset suivant, sans alourdir la phrase par « disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le caractère de nom propre sans lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et lisible. La formule de datation est resserrée selon l’usage français, et les deux-points signalent que l’oracle se poursuit au verset suivant.
