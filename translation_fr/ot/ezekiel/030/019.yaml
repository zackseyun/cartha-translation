  text: וְ/עָשִׂ֥יתִי שְׁפָטִ֖ים בְּ/מִצְרָ֑יִם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/019.yaml
  text: Thus I will execute judgments on Egypt[a], and they will know that I am Yahweh.
translation:
  language: fr
  text: J’exercerai ainsi des jugements en Égypte, et ils sauront que je suis Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתִי
  choice: J’exercerai ainsi
  rationale: Avec שְׁפָטִים pour complément, עשה signifie idiomatiquement « exercer » ou « exécuter » des jugements. « Ainsi » rend naturellement la valeur conclusive de la conjonction dans ce contexte.
- source_word: שְׁפָטִים
  choice: mes jugements
  rationale: Le pluriel désigne ici les actes judiciaires et punitifs de Dieu. Le possessif, naturel en français avec « exercer », explicite sans en changer le sens que ces jugements sont accomplis par le locuteur divin.
- source_word: בְּמִצְרָיִם
  choice: contre l’Égypte
  rationale: La préposition ב est littéralement locative, mais avec des actes punitifs elle marque ici la sphère visée. « Contre l’Égypte » exprime clairement cette orientation en français.
- source_word: וְיָדְעוּ
  choice: et ils sauront
  rationale: Cette formulation conserve le verbe « savoir/connaître » de la formule de reconnaissance récurrente chez Ézéchiel, sans l’atténuer en « comprendre » ou « se rendre compte ».
- source_word: כִּי אֲנִי יְהוָה
  choice: que je suis Yahweh
  rationale: La formule de reconnaissance est rendue directement, et le nom divin יהוה est translittéré « Yahweh » afin de préserver le nom propre présent dans l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu porte explicitement le Tétragramme. « Yahweh » préserve ici le caractère de nom propre et évite de le remplacer par un titre.
translation_notes:
  register: Français international moderne, sobre et solennel. La phrase conserve le parallélisme prophétique et la formule de reconnaissance caractéristique d’Ézéchiel.
