  source_fidelity: 'Le sens du texte hébreu est globalement bien rendu : la formule de jugement, l’opposition à Pharaon, le brisement des bras et la chute de l’épée sont préservés. Toutefois, les deux qualificatifs hébreux sont féminins singuliers et renvoient à « bras » ; le français « celui qui est fort et celui qui est brisé » emploie indûment le masculin et rend l’antécédent moins clair.'
