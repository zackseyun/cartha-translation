  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה הִנְ/נִי֙ אֶל פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם וְ/שָֽׁבַרְתִּי֙ אֶת זְרֹ֣עֹתָ֔י/ו אֶת הַ/חֲזָקָ֖ה וְ/אֶת הַ/נִּשְׁבָּ֑רֶת וְ/הִפַּלְתִּ֥י אֶת הַ/חֶ֖רֶב מִ/יָּדֽ/וֹ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/022.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am against Pharaoh king of Egypt, and I will break his arms, both the strong one and the broken one, and I will make the sword fall from his hand.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit le Seigneur Yahweh : « Me voici contre le pharaon, roi d’Égypte : je briserai ses bras, le bras fort et le bras brisé, et je ferai tomber l’épée de sa main. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence tirée du jugement annoncé dans le contexte précédent.
- source_word: כֹּה אָמַר
  choice: voici ce que dit
  rationale: Formule prophétique claire et actuelle, qui conserve la solennité de la formule de messager.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend אֲדֹנָי par « le Seigneur » et conserve le nom divin יהוה sous la forme « Yahweh », sans confondre les deux éléments du titre.
- source_word: הִנְנִי אֶל
  choice: Me voici contre
  rationale: « Me voici » restitue l’insistance de הִנְנִי sur l’intervention personnelle de Dieu; dans ce contexte hostile, אֶל signifie « contre ».
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: le pharaon, roi d’Égypte
  rationale: La virgule rend clairement l’apposition du titre royal en français moderne.
- source_word: וְשָׁבַרְתִּי אֶת זְרֹעֹתָיו
  choice: Je briserai ses bras
  rationale: Conserve l’image concrète des bras représentant la puissance militaire, ainsi que le verbe « briser », repris du contexte.
- source_word: אֶת הַחֲזָקָה וְאֶת הַנִּשְׁבָּרֶת
  choice: celui qui est fort et celui qui est brisé
  rationale: Les deux formes féminines singulières qualifient chacune un bras sous-entendu. Cette formulation reste proche de l’hébreu sans ajouter explicitement une antériorité au bras déjà atteint.
- source_word: וְהִפַּלְתִּי אֶת הַחֶרֶב מִיָּדוֹ
  choice: et je ferai tomber l’épée de sa main
  rationale: Le causatif est rendu par « ferai tomber » et l’image de la perte de l’arme est conservée sans explicitation interprétative.
theological_decisions:
- issue: Traduction du titre divin אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: La traduction distingue le titre אֲדֹנָי du nom personnel יהוה et préserve explicitement le nom divin présent dans le texte hébreu.
- issue: Portée symbolique des bras du pharaon
  choice: Conserver l’image concrète sans l’expliquer dans le corps du texte
  alternative: Traduire directement par « sa puissance »
  rationale: Les bras évoquent la force militaire et la capacité de manier l’épée, mais traduire par « puissance » supprimerait l’enchaînement imagé voulu par le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique demeure solennelle sans tournure archaïque. L’image corporelle et militaire est conservée, ainsi que la tension entre le bras encore fort et le bras brisé.
