reference: Ezekiel 30:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/הֲפִצוֹתִ֤י אֶת מִצְרַ֨יִם֙ בַּ/גּוֹיִ֔ם וְ/זֵרִיתִ֥י אוֹתָ֖/ם בָּ/אֲרָצ֑וֹת וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/026.yaml
  text: I will scatter Egypt among the nations[a], and I will disperse them through the lands. Then they will know that I am Yahweh.
translation:
  language: fr
  text: Je disperserai l’Égypte parmi les nations[a] et je les disséminerai dans les pays. Alors ils sauront que je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je disperserai les Égyptiens parmi les nations et je les disséminerai dans les pays. » L’hébreu nomme d’abord « l’Égypte », puis désigne sa population par un pronom pluriel.'
    reason: Précision sur le passage du nom collectif singulier au pronom pluriel et indication d’une formulation française alternative.
lexical_decisions:
- source_word: וַהֲפִצוֹתִי
  choice: Je disperserai
  rationale: Le verbe פוץ exprime la dispersion. « Disperser » est naturel en français et convient au contexte de jugement et d’exil.
- source_word: מִצְרַיִם
  choice: l’Égypte
  rationale: Le texte nomme explicitement l’Égypte comme nation collective; la suite passe au pluriel pour désigner sa population.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: גּוֹיִם désigne couramment les nations; « parmi » exprime ici la dispersion au milieu d’elles.
- source_word: וְזֵרִיתִי
  choice: je les disséminerai
  rationale: זרה peut signifier répandre, disperser ou vanner. « Disséminer » garde l’image d’une dispersion étendue tout en distinguant ce verbe du précédent.
- source_word: אוֹתָם
  choice: les
  rationale: Le pronom hébreu est masculin pluriel et renvoie aux membres du peuple égyptien, après le nom collectif « l’Égypte ».
- source_word: בָּאֲרָצוֹת
  choice: dans les pays
  rationale: Le pluriel אֲרָצוֹת peut désigner des terres ou des pays. « Dans les pays » est idiomatique et correspond au contexte international.
- source_word: וְיָדְעוּ
  choice: Alors ils sauront
  rationale: Le waw relie la reconnaissance de Yahweh au jugement annoncé; « alors » rend naturellement cette succession sans imposer une causalité plus forte que le texte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel représenté par le tétragramme, plutôt que de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom propre et évite de le remplacer par un titre.
- issue: Référent du pluriel après « l’Égypte »
  choice: Conserver le passage de « l’Égypte » à « les/ils »
  alternative: Expliciter partout « les Égyptiens »
  rationale: 'Le changement de nombre appartient à la formulation hébraïque: le pays ou la nation est d’abord nommé collectivement, puis sa population est visée au pluriel. La note clarifie cette tension grammaticale sans l’effacer.'
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme est conservé grâce à « disperserai » et « disséminerai », et la légère rupture grammaticale du texte source est maintenue puis expliquée en note.
