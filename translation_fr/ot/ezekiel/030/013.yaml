    text: Noph est le nom hébreu de la ville égyptienne appelée plus tard Memphis en grec.
    reason: cross_reference
  - marker: b
    text: 'Ou : « Il n’y aura plus de dirigeant originaire du pays d’Égypte. »'
    reason: lexical_alternative
  revision_rationale: La révision évite de transformer les objets cultuels désignés par אֱלִילִים en « faux dieux », tout en maintenant une distinction lisible avec גִלּוּלִים. Elle préserve également dans le texte et dans la note l’idée qu’aucun chef ne sera originaire d’Égypte, et emploie « crainte » comme équivalent français sobre et naturel de יִרְאָה dans ce contexte de jugement.
