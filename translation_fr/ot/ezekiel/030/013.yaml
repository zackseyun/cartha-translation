  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה וְ/הַאֲבַדְתִּ֨י גִלּוּלִ֜ים וְ/הִשְׁבַּתִּ֤י אֱלִילִים֙ מִ/נֹּ֔ף וְ/נָשִׂ֥יא מֵ/אֶֽרֶץ מִצְרַ֖יִם לֹ֣א יִֽהְיֶה ע֑וֹד וְ/נָתַתִּ֥י יִרְאָ֖ה בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/013.yaml
  text: 'Thus says the Lord GOD: I will destroy the idols and put an end to the images from Noph[a], and there will no longer be a prince from the land of Egypt[b]; and I will put fear in the land of Egypt.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh : Je détruirai les idoles et je ferai disparaître de Noph[a] les statues. Il n’y aura plus de chef originaire du pays d’Égypte[b], et je répandrai la crainte dans le pays d’Égypte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Noph est le nom hébreu de la ville égyptienne appelée plus tard Memphis en grec.
    reason: cross_reference
  - marker: b
    text: 'Ou : « Il n’y aura plus de dirigeant originaire du pays d’Égypte. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Le titre אֲדֹנָי est rendu par « le Seigneur », tandis que le nom divin יהוה est translittéré « Yahweh », ce qui distingue les deux éléments de l’expression.
- source_word: וְהַאֲבַדְתִּי גִלּוּלִים
  choice: Je détruirai les idoles
  rationale: Le hiphil de אבד exprime ici une destruction décisive. « Idoles » est clair et naturel, même si גִלּוּלִים porte en hébreu une nuance méprisante difficile à reproduire sans lourdeur.
- source_word: וְהִשְׁבַּתִּי אֱלִילִים
  choice: je ferai disparaître les faux dieux
  rationale: Le hiphil de שׁבת signifie « faire cesser, mettre fin à ». אֱלִילִים désigne des divinités vaines ou sans valeur ; « faux dieux » préserve la distinction avec גִלּוּלִים rendu par « idoles ».
- source_word: מִנֹּף
  choice: de Noph
  rationale: Le nom hébreu de la ville est conservé dans le texte, avec une note donnant son nom grec plus connu, Memphis.
- source_word: וְנָשִׂיא מֵאֶרֶץ מִצְרַיִם לֹא יִהְיֶה עוֹד
  choice: Il n’y aura plus de chef issu du pays d’Égypte
  rationale: נָשִׂיא peut désigner un prince, un chef ou un dirigeant. « Chef » conserve cette amplitude sans suggérer nécessairement un titre dynastique précis. « Issu du pays » rend naturellement מן tout en préservant son sens d’origine.
- source_word: וְנָתַתִּי יִרְאָה
  choice: je répandrai la peur
  rationale: Littéralement, « je mettrai/donnerai la peur ». « Répandre la peur » est une formulation française idiomatique qui conserve l’action divine causative sans intensifier יִרְאָה en « terreur ».
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: dans le pays d’Égypte
  rationale: Rendu direct de la préposition et du syntagme géographique, sans ajouter l’idée distributive de « dans tout le pays ».
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU / le Seigneur, l’Éternel
  rationale: La translittération « Yahweh » rend explicitement le tétragramme et évite de confondre יהוה avec le nom commun « Dieu », tout en conservant אֲדֹנָי comme titre « Seigneur ».
- issue: Nature du נָשִׂיא qui cessera d’exister
  choice: chef issu du pays d’Égypte
  alternative: prince du pays d’Égypte / dirigeant du pays d’Égypte
  rationale: Le terme peut désigner plusieurs formes d’autorité. Le texte ne précise ni un titre royal exact ni le mécanisme politique ; « chef » maintient cette indétermination.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe prophétique est conservée, avec une formulation naturelle. Le nom ancien « Noph » reste dans le texte et reçoit une explication en note. Les deux termes hébreux voisins pour les objets de culte sont distingués par « idoles » et « faux dieux ».
