  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה וְ/נָֽפְלוּ֙ סֹמְכֵ֣י מִצְרַ֔יִם וְ/יָרַ֖ד גְּא֣וֹן עֻזָּ֑/הּ מִ/מִּגְדֹּ֣ל סְוֵנֵ֗ה בַּ/חֶ֨רֶב֙ יִפְּלוּ בָ֔/הּ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/006.yaml
  text: 'Thus says Yahweh: The supporters of Egypt will fall[a], and the pride of her strength will come down. From Migdol to Syene they will fall by the sword within her[c][b], declares the Lord GOD.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : Ceux qui soutiennent l’Égypte tomberont, et l’orgueil de sa puissance s’abaissera. De Migdol à Syène[a], ils tomberont en elle sous les coups de l’épée[b], déclare le Seigneur Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Migdol et Syène délimitent ici l’Égypte du nord au sud.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « ils tomberont en elle par l’épée » ; « en elle » renvoie probablement à l’Égypte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Formule prophétique traditionnelle, naturelle et digne en français ; le nom divin est translittéré conformément à sa forme hébraïque.
- source_word: סֹמְכֵי מִצְרַיִם
  choice: ceux qui soutiennent l’Égypte
  rationale: Le participe de סמך exprime l’action de soutenir ou d’appuyer, sans préciser s’il s’agit exclusivement d’alliés militaires.
- source_word: וְנָפְלוּ
  choice: tomberont
  rationale: Le futur français convient à l’annonce prophétique du jugement.
- source_word: גְּאוֹן עֻזָּהּ
  choice: l’orgueil de sa puissance
  rationale: Cette formulation conserve les deux notions de גאון, l’orgueil ou l’élévation, et de עז, la force ou la puissance.
- source_word: וְיָרַד
  choice: s’abaissera
  rationale: Rend le mouvement descendant du verbe intransitif ירד sans introduire un agent implicite comme le ferait « sera abaissé ».
- source_word: מִמִּגְדֹּל סְוֵנֵה
  choice: De Migdol à Syène
  rationale: Les deux noms géographiques délimitent l’Égypte du nord au sud ; « de… à… » exprime clairement cette étendue.
- source_word: בַּחֶרֶב
  choice: sous les coups de l’épée
  rationale: Expression française naturelle pour la mort violente à la guerre, là où l’hébreu emploie littéralement « par l’épée ».
- source_word: יִפְּלוּ בָהּ
  choice: ils tomberont en elle
  rationale: Le pronom féminin renvoie probablement à l’Égypte conçue comme pays ; la traduction maintient ce renvoi plutôt que de le remplacer silencieusement par « là ».
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclare le Seigneur Yahweh
  rationale: Rend la formule solennelle d’attestation et distingue אֲדֹנָי, titre « Seigneur », du nom propre divin יהוה.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel / le SEIGNEUR
  rationale: La translittération préserve le nom divin personnel présent dans le texte hébreu, y compris dans la combinaison אֲדֹנָי יְהוִה rendue « le Seigneur Yahweh ».
- issue: Référent du pluriel יִפְּלוּ dans la seconde moitié du verset
  choice: ils tomberont
  alternative: on tombera / les habitants tomberont
  rationale: Le texte ne nomme pas explicitement un nouveau sujet. Le masculin pluriel peut reprendre ceux qui soutiennent l’Égypte ou viser plus largement les personnes présentes dans le pays ; la formulation conserve cette ambiguïté.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. « Ainsi parle » garde la cadence prophétique. « Ceux qui soutiennent » évite de réduire le terme à des alliés militaires. Tous les marqueurs de notes figurent dans le texte principal.
