base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/005.yaml
  text: Cush and Put and Lud and all the mixed people and Cub and the sons of the land of the covenant—with them they will fall by the sword[a][b][c].
translation:
  language: fr
  text: Koush, Pout, Loud, toute la population mêlée[a], Koub[b] et les fils du pays de l’alliance[c] tomberont avec eux par l’épée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute l’Arabie », « tous les mercenaires » ou « toute la multitude mêlée » ; le sens du terme hébreu est discuté.
    reason: lexical_alternative
  - marker: b
    text: « Koub » est un nom de lieu rare dont l’identification reste incertaine.
    reason: lexical_alternative
  - marker: c
    text: Ou « les gens du pays de l’alliance ». L’expression peut désigner des personnes liées par un traité ; certains y voient des Judéens établis en Égypte.
    reason: alternative_reading
lexical_decisions:
- source_word: כּוּשׁ
  choice: Koush
  rationale: Translittération française du nom ethnogéographique, plus précise ici que l’identification traditionnelle « Éthiopie ».
- source_word: פּוּט
  choice: Pout
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: לוּד
  choice: Loud
  rationale: La translittération conserve la forme hébraïque sans imposer l’identification à la Lydie ou aux Lydiens.
- source_word: כָל הָעֶרֶב
  choice: toute la population mêlée
  rationale: Dans ce contexte, עֶרֶב désigne probablement un ensemble humain mêlé. Cette formulation est naturelle en français et les autres interprétations restent signalées en note.
- source_word: כּוּב
  choice: Koub
  rationale: Le nom de lieu est rare et son identification incertaine ; une translittération prudente convient.
- source_word: בְנֵי אֶרֶץ הַבְּרִית
  choice: les fils du pays de l’alliance
  rationale: Le rendu formel préserve à la fois l’expression בְנֵי et l’ambiguïté du référent du « pays de l’alliance ».
- source_word: אִתָּם
  choice: avec eux
  rationale: La préposition exprime l’association avec les peuples mentionnés dans le contexte.
- source_word: בַּחֶרֶב
  choice: par l’épée
  rationale: Ce rendu conserve l’image prophétique hébraïque de la mort au combat.
- source_word: יִפֹּלוּ
  choice: tomberont
  rationale: Le sens littéral de נפל est conservé ; dans ce contexte, la chute implique la mort violente.
theological_decisions:
- issue: Référent des « fils du pays de l’alliance »
  choice: Conserver la formule ambiguë dans le texte principal.
  alternative: « les gens du pays de l’alliance », ou une identification explicite aux Judéens vivant en Égypte.
  rationale: L’hébreu ne permet pas d’identifier avec certitude ce groupe ; expliciter une alliance politique ou une population judéenne trancherait indûment la question.
translation_notes:
  register: Français international moderne, clair et digne. Les noms propres sont translittérés selon une graphie lisible en français ; l’image de l’épée et les ambiguïtés lexicales du texte hébreu sont préservées.
