source:
  edition: WLC
  text: וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה בְּ/תִתִּ/י אֵ֣שׁ בְּ/מִצְרַ֔יִם וְ/נִשְׁבְּר֖וּ כָּל עֹזְרֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/008.yaml
  text: Then they will know that I am Yahweh[a], when I set fire to Egypt and all her helpers are broken.
translation:
  language: fr
  text: Alors ils sauront que je suis Yahweh, quand j’allumerai un feu en Égypte et que tous ceux qui la soutiennent seront brisés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ses alliés seront brisés ». L’hébreu dit littéralement « tous ceux qui l’aident » ; il peut s’agir des nations alliées ou des forces qui soutiennent l’Égypte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Alors ils sauront
  rationale: Le verbe signifie « savoir, connaître ». Dans ce contexte, la conjonction introduit le résultat du jugement annoncé ; « Alors » rend naturellement cette progression.
- source_word: כִּי
  choice: que
  rationale: כִּי introduit ici le contenu de ce qu’ils sauront.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בְּתִתִּי אֵשׁ בְּמִצְרַיִם
  choice: quand je mettrai le feu à l’Égypte
  rationale: L’infinitif avec בְּ exprime la circonstance temporelle. En français courant, « mettre le feu à l’Égypte » rend idiomatiquement l’acte de jugement, bien que la préposition hébraïque soit littéralement locative (« en Égypte »).
- source_word: וְנִשְׁבְּרוּ
  choice: et que ... seront brisés
  rationale: Le niphal de שׁבר exprime le fait d’être brisé. Le futur convient à la portée prophétique de la proposition temporelle.
- source_word: כָּל עֹזְרֶיהָ
  choice: tous ceux qui la soutiennent
  rationale: עֹזְרֶיהָ désigne littéralement « ceux qui l’aident ». Cette formulation française reste proche du sens lexical tout en étant plus naturelle que « tous ses assistants » et sans limiter indûment le référent à des alliés politiques.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » préserve le nom propre et évite de le remplacer par un titre.
- issue: Identité des עֹזְרֶיהָ
  choice: tous ceux qui la soutiennent
  alternative: tous ses alliés ; tous ceux qui l’aident
  rationale: Le terme peut viser les nations alliées, les forces ou plus largement les soutiens de l’Égypte. La traduction conserve cette ouverture référentielle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe prophétique est conservée, avec un futur naturel en français. Le marqueur de note est placé immédiatement après la proposition qu’il éclaire.
