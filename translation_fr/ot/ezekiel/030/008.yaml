review_pass:
  verdict: revise
  source_fidelity: La structure temporelle et le futur prophétique sont bien rendus, de même que « tous ceux qui la soutiennent » pour כָּל עֹזְרֶיהָ. Toutefois, « mettre le feu à l’Égypte » présente l’Égypte comme objet directement incendié, tandis que בְּמִצְרַיִם est locatif (« en Égypte »). « Allumer un feu en Égypte » conserve cette nuance sans lourdeur.
  naturalness: Le français est globalement moderne et naturel. « Quand j’allumerai un feu en Égypte » est idiomatique dans un registre prophétique et évite le léger glissement de sens de « mettre le feu à l’Égypte ».
  terminology: « Yahweh » respecte le choix de rendre le tétragramme par le nom divin. « Tous ceux qui la soutiennent » maintient utilement l’ouverture du terme « ses aides/soutiens », sans le réduire à des alliances politiques.
  issues:
  - severity: medium
    issue: Préposition et image du feu
    rationale: L’hébreu dit littéralement que Yahweh donne/met un feu « en Égypte ». La formulation « mettre le feu à l’Égypte » est française courante, mais elle transforme la localisation du feu en une action dirigée contre l’ensemble du pays. « Allumer un feu en Égypte » est à la fois naturel et plus proche du texte source.
  revised_text: Alors ils sauront que je suis Yahweh, quand j’allumerai un feu en Égypte et que tous ceux qui la soutiennent seront brisés.[a]
  revised_footnotes:
