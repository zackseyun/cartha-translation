  terminology: « Barres de l’Égypte » conserve la métaphore de מֹטוֹת; la variante « barres du joug » est utile en note. « Orgueil de sa puissance » restitue les deux termes de גְּאוֹן עֻזָּהּ. « Ses filles » est maintenu dans le corps du texte, avec une note expliquant l’usage prophétique possible, sans imposer le référent précis des pronoms.
