  text: וּ/בִֽ/תְחַפְנְחֵס֙ חָשַׂ֣ךְ הַ/יּ֔וֹם בְּ/שִׁבְרִ/י שָׁם֙ אֶת מֹט֣וֹת מִצְרַ֔יִם וְ/נִשְׁבַּת בָּ֖/הּ גְּא֣וֹן עֻזָּ֑/הּ הִ֚יא עָנָ֣ן יְכַסֶּ֔/נָּה וּ/בְנוֹתֶ֖י/הָ בַּ/שְּׁבִ֥י תֵלַֽכְנָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/018.yaml
  text: And in Tahpanhes the day will grow dark when I break there the bars of Egypt[a], and the pride of her strength will cease in her. As for her, a cloud will cover her[b], and her daughters will go into captivity.
translation:
  language: fr
  text: À Tahpanès, le jour s’obscurcira quand j’y briserai les barres de l’Égypte[a], et l’orgueil de sa puissance prendra fin en elle. Quant à elle, un nuage la couvrira, et ses filles[b] iront en captivité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les barres du joug de l’Égypte ». L’image hébraïque peut évoquer les appuis de la puissance égyptienne ou les instruments de sa domination.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ses filles ». Cette expression prophétique peut désigner les localités rattachées à une ville ou à un pays.
    reason: cultural_note
lexical_decisions:
- source_word: וּבִתְחַפְנְחֵס
  choice: À Taphnès
  rationale: La préposition ב marque ici le lieu. « Taphnès » est la forme française traditionnelle et courante du nom de lieu biblique.
- source_word: חָשַׂךְ הַיּוֹם
  choice: le jour s’obscurcira
  rationale: Cette formulation naturelle conserve l’image menaçante de l’assombrissement du jour sans préciser indûment s’il s’agit d’un phénomène littéral ou symbolique.
- source_word: בְּשִׁבְרִי שָׁם
  choice: quand j’y briserai
  rationale: L’infinitif construit avec suffixe de première personne a une valeur temporelle; « y » restitue avec naturel l’adverbe שָׁם, renvoyant à Taphnès.
- source_word: מֹטוֹת מִצְרַיִם
  choice: les barres de l’Égypte
  rationale: מֹטוֹת peut désigner des barres, des perches ou les barres d’un joug. Le choix principal maintient la métaphore concrète et son ambiguïté, tandis qu’une note signale l’autre lecture importante.
- source_word: וְנִשְׁבַּת בָּהּ
  choice: Là prendra fin
  rationale: Le niphal de שבת exprime la cessation. « Là » restitue la valeur locative de בָּהּ tout en évitant en français une succession peu naturelle de pronoms féminins aux référents potentiellement flottants.
- source_word: גְּאוֹן עֻזָּהּ
  choice: l’orgueil de sa puissance
  rationale: La traduction garde les deux noms de la chaîne construite et laisse ouverte la nuance entre la fierté tirée de la puissance et la puissance orgueilleuse.
- source_word: הִיא
  choice: Quant à elle
  rationale: Le pronom indépendant est emphatique. « Quant à elle » en marque la reprise disjonctive et conserve l’imagerie féminine sans imposer si le référent précis est Taphnès ou l’Égypte personnifiée.
- source_word: עָנָן יְכַסֶּנָּה
  choice: un nuage la couvrira
  rationale: La traduction préserve simplement l’image prophétique du nuage, sans l’expliciter comme nuage d’orage, obscurité ou armée.
- source_word: וּבְנוֹתֶיהָ
  choice: ses villes dépendantes
  rationale: Littéralement « ses filles »; dans les oracles prophétiques, l’expression désigne couramment les localités rattachées à une ville principale. Le sens est rendu dans le texte et la métaphore hébraïque est signalée en note.
- source_word: בַּשְּׁבִי תֵלַכְנָה
  choice: partiront en captivité
  rationale: Cette formulation rend le mouvement exprimé par « aller » et la déportation exprimée par שְּׁבִי, dans un français digne et compréhensible.
theological_decisions:
- issue: Référent des pronoms féminins dans la seconde moitié du verset
  choice: Conserver la personnification féminine sans identifier explicitement son référent à Taphnès seule.
  alternative: Rapporter tous les pronoms soit précisément à Taphnès, soit plus largement à l’Égypte personnifiée.
  rationale: La proximité de Taphnès et l’expression « ses filles » favorisent l’image de la ville, mais l’ensemble de l’oracle porte sur l’Égypte. La traduction maintient donc la tension du texte source.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme prophétique et les images du texte hébreu sont conservés; les ambiguïtés concernant les « barres » et le référent de la personnification féminine ne sont pas résolues abusivement.
