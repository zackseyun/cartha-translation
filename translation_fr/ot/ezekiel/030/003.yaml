  text: כִּֽי קָר֣וֹב י֔וֹם וְ/קָר֥וֹב י֖וֹם לַֽ/יהוָ֑ה י֣וֹם עָנָ֔ן עֵ֥ת גּוֹיִ֖ם יִֽהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/003.yaml
  text: For the day is near[a], yes, the day of Yahweh is near; it will be a day of clouds[c][b], a time of nations.
translation:
  language: fr
  text: Car le jour est proche, oui, le jour de Yahweh est proche ; ce sera un jour de nuée[a], un temps des nations[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un jour nuageux ». L’hébreu emploie le singulier « nuage/nuée ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un temps pour les nations ». L’expression hébraïque est concise et peut désigner un moment décisif concernant les nations.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison ou l'explication de la lamentation qui précède, tout en conservant le lien discursif du texte hébreu.
- source_word: קָרוֹב
  choice: est proche
  rationale: Rend naturellement l'adjectif prédicatif et son idée d'imminence.
- source_word: יוֹם
  choice: jour
  rationale: Traduction usuelle ; la répétition est maintenue afin de préserver l'insistance rhétorique de l'hébreu.
- source_word: וְקָרוֹב
  choice: oui, ... est proche
  rationale: Le « oui » restitue en français courant la reprise intensive introduite par la conjonction, sans produire la tournure raide « et proche ».
- source_word: לַיהוָה
  choice: de Yahweh
  rationale: Dans cette formule prophétique, le lamed exprime la relation au Dieu nommé par le tétragramme.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin présent dans le texte source plutôt que de le remplacer par un titre.
- source_word: יוֹם עָנָן
  choice: un jour de nuages
  rationale: Conserve l'image nominale sombre de l'hébreu dans une expression française naturelle ; le singulier plus littéral « un jour de nuée » reste possible.
- source_word: עֵת גּוֹיִם
  choice: un temps pour les nations
  rationale: 'Préserve le caractère elliptique de la formule : il s''agit d''un temps décisif concernant les nations, sans préciser au-delà du texte la nature exacte de ce rapport.'
- source_word: יִהְיֶה
  choice: ce sera
  rationale: Rend la copule à valeur future en reprenant clairement « le jour ».
theological_decisions:
- issue: Formule prophétique יוֹם לַיהוָה
  choice: le jour de Yahweh
  alternative: le jour du Seigneur ; un jour pour Yahweh
  rationale: Le texte emploie directement le nom divin. « Le jour de Yahweh » conserve à la fois ce nom et la formule prophétique, sans réduire celle-ci à une simple désignation chronologique.
- issue: Sens de עֵת גּוֹיִם
  choice: un temps pour les nations
  alternative: un temps des nations ; le temps des nations
  rationale: La relation entre « temps » et « nations » n'est pas explicitée en hébreu. La traduction retenue indique qu'elles sont concernées tout en évitant d'affirmer s'il s'agit exclusivement de leur jugement, de leur période assignée ou d'une époque dominée par elles.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « proche » et de « jour » reproduit l'urgence du texte. La ponctuation ordonne la phrase sans effacer son rythme prophétique.
