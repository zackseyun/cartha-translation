id: EZK.30.15
reference: Ezekiel 30:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/שָׁפַכְתִּ֣י חֲמָתִ֔/י עַל סִ֖ין מָע֣וֹז מִצְרָ֑יִם וְ/הִכְרַתִּ֖י אֶת הֲמ֥וֹן נֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/015.yaml
  text: And I will pour out my wrath on Sin[a], the stronghold of Egypt[b], and I will cut off the multitude of No.
translation:
  language: fr
  text: Je déverserai ma fureur sur Sin[a], la forteresse de l’Égypte, et je retrancherai la multitude de No[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sin est généralement identifiée à Péluse, ville fortifiée située sur la frontière nord-est de l’Égypte.
    reason: cross_reference
  - marker: b
    text: No est généralement identifiée à Thèbes.
    reason: cross_reference
lexical_decisions:
- source_word: וְשָׁפַכְתִּי
  choice: Je déverserai
  rationale: Le verbe שׁפך exprime l’action de verser ou déverser. Avec la fureur divine, « déverser » est naturel en français et conserve l’image hébraïque. Le וְ coordonne cette annonce à son contexte sans devoir être rendu mécaniquement par « et » au début du verset.
- source_word: חֲמָתִי
  choice: ma fureur
  rationale: חֵמָה désigne une colère ardente. « Fureur » en restitue l’intensité dans ce contexte prophétique de jugement, sans atténuation.
- source_word: עַל
  choice: sur
  rationale: « Sur » correspond directement à la préposition עַל et s’emploie naturellement avec « déverser ».
- source_word: סִין
  choice: Sin
  rationale: Le nom hébreu du lieu est conservé dans le texte; son identification courante avec Péluse relève d’une note.
- source_word: מָעוֹז מִצְרָיִם
  choice: la forteresse de l’Égypte
  rationale: מָעוֹז désigne ici une place forte ou fortifiée. « Forteresse » exprime clairement la fonction stratégique attribuée à Sin et conserve l’apposition.
- source_word: וְהִכְרַתִּי
  choice: et je retrancherai
  rationale: Au hiphil, כרת signifie souvent « retrancher, supprimer ». « Retrancher » maintient la métaphore et la force du jugement sans préciser abusivement son mode d’exécution.
- source_word: אֶת הֲמוֹן
  choice: la multitude
  rationale: הָמוֹן peut évoquer une multitude, une masse, une abondance ou un tumulte. « La multitude » garde ici une référence collective suffisamment ouverte, probablement la population de No.
- source_word: נֹא
  choice: 'No'
  rationale: Le toponyme hébreu est translittéré dans le texte principal; son identification courante avec Thèbes est donnée en note.
theological_decisions:
- issue: Expression directe du jugement divin
  choice: Conserver « ma fureur » et « je retrancherai » comme actions directes de Dieu
  alternative: Atténuer par « ma colère » ou expliciter par « je détruirai »
  rationale: L’hébreu présente le jugement divin en termes intenses et actifs. La formulation retenue en préserve la gravité sans ajouter une interprétation sur la manière précise dont la multitude sera supprimée.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La syntaxe reste concise et solennelle. Les toponymes hébreux sont conservés dans le texte et éclairés par des notes historiques prudentes.
