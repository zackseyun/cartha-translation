source:
  edition: WLC
  text: כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה וְ/הִשְׁבַּתִּי֙ אֶת הֲמ֣וֹן מִצְרַ֔יִם בְּ/יַ֖ד נְבוּכַדְרֶאצַּ֥ר מֶלֶךְ בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/010.yaml
  text: 'Thus says the Lord GOD: I will put an end to the multitude of Egypt by the hand of Nebuchadnezzar king of Babylon[a][b].'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh : Je mettrai fin à la multitude de l’Égypte par l’intermédiaire de Nabuchodonosor, roi de Babylone.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom hébreu est ici écrit sous une forme que l’on peut transcrire « Neboukadrètsar » (traditionnellement « Nabuchodonosor » en français).
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique consacrée, à la fois naturelle et solennelle en français moderne.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה, sans produire la répétition « Seigneur Seigneur ».
- source_word: וְהִשְׁבַּתִּי
  choice: Je mettrai fin à
  rationale: Le hiphil de שׁבת exprime ici l’action de faire cesser; cette tournure française en conserve la force causative.
- source_word: הֲמוֹן
  choice: la multitude
  rationale: Le terme peut évoquer la masse de la population, la foule ou l’abondance collective; « multitude » conserve cette amplitude sans la réduire aux seules richesses ou aux seules troupes.
- source_word: בְּיַד
  choice: par l’intermédiaire de
  rationale: Rend naturellement en français l’idiome hébreu d’agence « par la main de ».
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nabuchodonosor
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom royal; la note signale la forme plus proche de l’orthographe hébraïque.
- source_word: מֶלֶךְ בָּבֶל
  choice: roi de Babylone
  rationale: Traduction directe de la chaîne construite désignant le titre et le royaume.
theological_decisions:
- issue: Rendu du nom divin יהוה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: « Yahweh » représente explicitement le nom divin présent dans le texte hébreu, tandis que « Seigneur » rend אֲדֹנָי.
translation_notes:
  register: Français international moderne, digne et accessible. « Ainsi parle » maintient le ton de l’oracle prophétique. L’idiome בְּיַד est traduit selon son sens d’agence plutôt que calqué littéralement.
