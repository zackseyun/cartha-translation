id: EZK.30.7
reference: Ezekiel 30:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נָשַׁ֕מּוּ בְּ/ת֖וֹךְ אֲרָצ֣וֹת נְשַׁמּ֑וֹת וְ/עָרָ֕י/ו בְּ/תוֹךְ עָרִ֥ים נַחֲרָב֖וֹת תִּֽהְיֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/007.yaml
  text: They will be desolated among desolated lands[a], and its cities will be among ruined cities.
translation:
  language: fr
  text: Ils seront dévastés au milieu de territoires dévastés[a], et ses villes seront au milieu de villes en ruine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi des territoires dévastés […] parmi des villes en ruine ».
    reason: 'Alternative syntaxique pour בְּתוֹךְ : l’expression peut se rendre soit par « au milieu de », soit plus idiomatiquement par « parmi ».'
lexical_decisions:
- source_word: וְנָשַׁמּוּ
  choice: ils seront dévastés
  rationale: Le nifal de שׁמם exprime ici l’état résultant de la dévastation. Cette formulation conserve la valeur passive et convient au contexte de jugement.
- source_word: בְּתוֹךְ
  choice: au milieu de
  rationale: Rend directement l’idée de position au sein d’un ensemble et maintient le parallélisme des deux membres du verset.
- source_word: אֲרָצוֹת
  choice: territoires
  rationale: Le pluriel d’אֶרֶץ désigne ici des contrées ou espaces nationaux plutôt que le sol ou la terre entière. « Territoires » est clair et évite l’ambiguïté de « terres ».
- source_word: נְשַׁמּוֹת
  choice: dévastés
  rationale: La forme adjectivale qualifie les territoires. « Dévastés » conserve en français le lien lexical avec le verbe précédent, issu de la même racine hébraïque.
- source_word: וְעָרָיו
  choice: et ses villes
  rationale: Le suffixe masculin singulier renvoie à l’Égypte envisagée comme entité nationale. Le possessif français conserve ce référent singulier sans le personnaliser davantage.
- source_word: עָרִים
  choice: villes
  rationale: Équivalent courant d’עִיר, adapté à l’ampleur et au registre de l’oracle prophétique.
- source_word: נַחֲרָבוֹת
  choice: en ruine
  rationale: La forme passive ou descriptive de חרב indique des villes ravagées. « En ruine » est une expression française naturelle et nette.
- source_word: תִּהְיֶינָה
  choice: seront
  rationale: Le futur de היה relie simplement « ses villes » à leur situation parmi les villes ruinées.
theological_decisions: []
