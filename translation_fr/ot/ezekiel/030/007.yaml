  source_fidelity: Le texte rend fidèlement le futur pluriel de וְנָשַׁמּוּ, la double construction בְּתוֹךְ, le pluriel « territoires », ainsi que le contraste entre les territoires dévastés et les villes en ruine. « Ses villes » respecte le suffixe singulier renvoyant à l’Égypte comme entité nationale, sans lever artificiellement l’ambiguïté contextuelle du sujet pluriel initial.
