  text: When I returned[a], behold, on the bank of the stream were very many trees, on this side and on that side.
translation:
  language: fr
  text: Quand je revins, voici qu’il y avait, au bord du torrent, des arbres en très grand nombre, de ce côté-ci et de ce côté-là[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'C’est-à-dire des deux côtés du torrent. L’hébreu dit littéralement : « de ce côté-ci et de ce côté-là ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּבֵנִי
  choice: Quand je revins
  rationale: L’infinitif construit qal de שׁוב avec suffixe de première personne a ici une valeur temporelle. Cette formulation rend directement le retour du prophète sans introduire un sujet causatif absent de la forme hébraïque.
- source_word: וְהִנֵּה
  choice: voici qu’il y avait
  rationale: « Voici » conserve la force de découverte soudaine et le caractère vivant de la vision, tandis que « qu’il y avait » permet une syntaxe française naturelle.
- source_word: אֶל שְׂפַת הַנַּחַל
  choice: au bord du torrent
  rationale: שׂפה désigne le bord ou la rive, et נחל un cours d’eau, souvent un torrent. Dans cette scène où l’eau coule, « torrent » reste concret sans imposer la grandeur suggérée par « fleuve ».
- source_word: עֵץ רַב מְאֹד
  choice: des arbres en très grand nombre
  rationale: עֵץ, bien que formellement singulier, a ici un sens collectif. La tournure française exprime clairement l’abondance marquée par רַב מְאֹד.
- source_word: מִזֶּה וּמִזֶּה
  choice: de ce côté-ci et de ce côté-là
  rationale: Cette formulation garde l’image spatiale et distributive de l’expression hébraïque, laquelle signifie que les arbres se trouvent des deux côtés du torrent.
