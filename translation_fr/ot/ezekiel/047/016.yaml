reference: Ezekiel 47:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חֲמָ֤ת בֵּר֨וֹתָה֙ סִבְרַ֔יִם אֲשֶׁר֙ בֵּין גְּב֣וּל דַּמֶּ֔שֶׂק וּ/בֵ֖ין גְּב֣וּל חֲמָ֑ת חָצֵר֙ הַתִּיכ֔וֹן אֲשֶׁ֖ר אֶל גְּב֥וּל חַוְרָֽן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/016.yaml
  text: Hamath[a], Berothah, Sibraim—which is between the border of Damascus and the border of Hamath—Hazer-hattikon[c][b], which is toward the border of Hauran.
translation:
  language: fr
  text: Hamath, Bérotha[a], Sibraïm — qui se trouve entre la frontière de Damas et celle de Hamath —, Hatser-Hattikon[b], qui est du côté de la frontière du Hauran[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte « Bérotha »; certains rapprochent ce nom de « Bérothaï » en 2 Samuel 8.8.
    reason: alternative_reading
  - marker: b
    text: Hatser-Hattikon est probablement un nom de lieu; ses éléments signifient littéralement quelque chose comme « l’enclos du milieu » ou « l’établissement du milieu ».
    reason: lexical_alternative
  - marker: c
    text: 'Autres traductions possibles : « qui est vers la frontière du Hauran » ou « qui est près de la frontière du Hauran ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמָת
  choice: Hamath
  rationale: Translittération française usuelle du nom de lieu. Le texte porte simplement « Hamath », et non la forme plus longue « Lebo-Hamath ».
- source_word: בֵּרוֹתָה
  choice: Bérotha
  rationale: Translittération du toponyme selon la forme du texte massorétique, avec une graphie lisible en français.
- source_word: סִבְרַיִם
  choice: Sibraïm
  rationale: Translittération proche de la forme hébraïque; le tréma indique clairement la séparation des voyelles en français.
- source_word: אֲשֶׁר בֵּין גְּבוּל דַּמֶּשֶׂק וּבֵין גְּבוּל חֲמָת
  choice: qui se trouve entre la frontière de Damas et celle de Hamath
  rationale: La relative se rattache naturellement à Sibraïm. La reprise française « celle de » évite une lourdeur sans effacer la répétition conceptuelle de גְּבוּל.
- source_word: חָצֵר הַתִּיכוֹן
  choice: Hatser-Hattikon
  rationale: L’expression fonctionne comme un nom de lieu dans cette liste frontalière; elle est donc translittérée plutôt que traduite.
- source_word: אֲשֶׁר אֶל גְּבוּל חַוְרָן
  choice: qui est du côté de la frontière du Hauran
  rationale: Cette formulation conserve la valeur directionnelle ou relationnelle assez souple de אֶל sans affirmer que le lieu atteint nécessairement la frontière.
- source_word: גְּבוּל
  choice: frontière
  rationale: Dans cette délimitation géographique, « frontière » exprime clairement une limite territoriale; « territoire » déplacerait le sens vers la région elle-même.
