  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה גֵּ֤ה גְבוּל֙ אֲשֶׁ֣ר תִּתְנַחֲל֣וּ אֶת הָ/אָ֔רֶץ לִ/שְׁנֵ֥י עָשָׂ֖ר שִׁבְטֵ֣י יִשְׂרָאֵ֑ל יוֹסֵ֖ף חֲבָלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/013.yaml
  text: 'Thus says the Lord GOD: This is the boundary by which you shall apportion the land as an inheritance among the twelve tribes of Israel[a]; Joseph shall have two portions.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh : « Voici la limite du territoire que vous aurez à partager en héritage entre les douze tribus d’Israël. Joseph recevra deux parts[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu porte littéralement : « Joseph : des lots [de terrain] ». La phrase est elliptique et ne précise pas le nombre « deux » ; celui-ci est compris dans le contexte du partage territorial.'
    reason: Précise l’ellipse de יוֹסֵף חֲבָלִים et indique que la double part est contextuellement comprise, non explicitement chiffrée dans cette proposition.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Le titre אֲדֹנָי est rendu par « le Seigneur », tandis que le nom divin יהוה est transcrit « Yahweh », ce qui évite l’expression peu naturelle « le Seigneur, le SEIGNEUR » et distingue les deux éléments hébreux.
- source_word: גֵּה גְבוּל
  choice: Voici les limites
  rationale: La particule déictique introduit la délimitation à venir. Bien que גְבוּל soit au singulier, le pluriel français « les limites » convient naturellement à l’ensemble des frontières territoriales décrites dans la suite.
- source_word: תִּתְנַחֲלוּ אֶת־הָאָרֶץ
  choice: vous répartirez le pays en héritage
  rationale: Dans ce contexte, la forme verbale de נחל évoque l’attribution du pays sous forme de possessions héréditaires, et non seulement le fait d’en hériter. Cette formulation conserve à la fois l’idée de répartition et celle d’héritage.
- source_word: לִשְׁנֵי עָשָׂר שִׁבְטֵי יִשְׂרָאֵל
  choice: entre les douze tribus d’Israël
  rationale: « Entre » exprime clairement en français la distribution du territoire aux tribus.
- source_word: יוֹסֵף חֲבָלִים
  choice: Joseph recevra deux parts
  rationale: חֲבָלִים peut désigner des portions de territoire mesurées. Le contexte des douze tribus indique que Joseph reçoit une double part, par l’intermédiaire des deux tribus issues de lui, même si le nombre « deux » n’est pas exprimé dans cette proposition hébraïque elliptique.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: La traduction conserve distinctement le titre אֲדֹנָי et le nom personnel יהוה sans substituer un second titre au tétragramme.
- issue: Double part attribuée à Joseph
  choice: Joseph recevra deux parts
  alternative: Joseph recevra des parts
  rationale: 'Le contexte tribal éclaire l’expression elliptique : Joseph compte pour deux territoires, ceux d’Éphraïm et de Manassé. Une note signale toutefois que le texte hébreu n’énonce pas explicitement le nombre deux.'
translation_notes:
  register: Français moderne, international et soutenu sans archaïsmes. La formulation reste proche de la structure hébraïque tout en rendant clairement le partage territorial et l’ellipse finale.
