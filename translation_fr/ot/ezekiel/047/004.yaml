base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/004.yaml
  text: Again he measured a thousand[a], and led me through the water—water up to the knees. Again he measured a thousand[b], and led me through water up to the waist.
translation:
  language: fr
  text: 'Il mesura encore mille[a], puis me fit passer dans l’eau : elle m’arrivait aux genoux. Il mesura encore mille, puis me fit passer dans l’eau : elle m’arrivait à la taille[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mille » ; d’après le verset précédent, l’unité sous-entendue est la coudée.'
    reason: cross_reference
  - marker: b
    text: 'Ou : « à hauteur des reins ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: Il mesura
  rationale: Le qal wayyiqtol de מדד décrit directement l’action de mesurer dans la vision. « Il mesura » est naturel et fidèle en français.
- source_word: אֶלֶף
  choice: mille
  rationale: L’hébreu porte seulement « mille »; l’unité, les coudées, ressort du verset précédent. La conserver en note évite de l’ajouter silencieusement au texte.
- source_word: וַיַּעֲבִרֵנִי
  choice: me fit traverser
  rationale: 'Le hifil de עבר avec suffixe de première personne exprime la causation : l’homme fait passer le prophète dans l’eau. Cette formulation rend précisément la valeur causative sans suggérer nécessairement qu’il le tient ou le guide physiquement.'
- source_word: בַמַּיִם
  choice: traverser l’eau
  rationale: Avec le verbe causatif de mouvement, la préposition indique ici le passage dans ou à travers l’eau; « traverser l’eau » est idiomatique en français.
- source_word: מַיִם בִּרְכָּיִם
  choice: elle m’arrivait aux genoux
  rationale: La construction nominale indique le niveau atteint par l’eau. La reprise pronominale produit un français courant tout en gardant le sens exact.
- source_word: מֵי מָתְנָיִם
  choice: elle m’arrivait à la taille
  rationale: מָתְנַיִם désigne la région des reins ou de la taille. « À la taille » est clair et naturel aujourd’hui; l’alternative plus littérale « jusqu’aux reins » est signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « Il mesura encore mille, puis me fit traverser l’eau » reproduit la progression rythmée de l’hébreu. Le point-virgule implicite de la scène est rendu par deux-points afin d’introduire naturellement le niveau de l’eau.
