  source_fidelity: 'Le sens général est fidèle : l’homme mesure successivement mille unités implicites et fait passer le prophète dans une eau qui atteint d’abord les genoux, puis la taille / les reins. Toutefois, « me fit traverser l’eau » peut suggérer le franchissement complet d’une étendue d’eau, alors que le hifil de עבר avec בַמַּיִם décrit ici le fait de le faire passer dans l’eau afin d’en constater la profondeur. « Me fit passer dans l’eau » rend plus précisément ce mouvement sans ajouter l’idée d’une traversée jusqu’à l’autre rive.'
