base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/014.yaml
  text: You shall inherit it[a], each like his brother, concerning which I raised my hand to give it to your fathers[c][b]; and this land shall fall to you as an inheritance.
translation:
  language: fr
  text: 'Vous la recevrez en héritage, chacun au même titre que son frère[a] : j’ai levé la main[b] pour la donner à vos pères. Cette terre vous échoira en héritage[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un homme comme son frère »; dans ce contexte, l’expression indique un partage à égalité.'
    reason: lexical_alternative
  - marker: b
    text: 'Lever la main est ici le geste d’un serment; autrement dit : « j’ai juré ».'
    reason: idiom_explanation
  - marker: c
    text: L’hébreu dit littéralement que la terre « tombera » en héritage, image liée à l’attribution d’un lot.
    reason: idiom_explanation
lexical_decisions:
- source_word: וּנְחַלְתֶּם אוֹתָהּ
  choice: Vous la recevrez en héritage
  rationale: Le qal de נחל désigne ici la réception de la terre comme bien attribué en héritage. Cette formulation française conserve à la fois l’idée de réception et celle d’héritage.
- source_word: אִישׁ כְּאָחִיו
  choice: chacun au même titre que son frère
  rationale: Littéralement « un homme comme son frère ». Dans le contexte du partage territorial, la comparaison exprime une attribution égale. « Chacun » rend la valeur distributive, tandis que « son frère » conserve la forme masculine du texte.
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: j’ai levé la main
  rationale: L’expression concrète hébraïque est conservée dans le texte principal. Elle désigne le geste par lequel Dieu s’engage sous serment; ce sens est explicité en note.
- source_word: לְתִתָּהּ לַאֲבֹתֵיכֶם
  choice: pour la donner à vos pères
  rationale: Le pronom féminin renvoie à la terre. « Vos pères » correspond directement à אֲבֹתֵיכֶם et maintient l’écho aux promesses faites aux générations antérieures.
- source_word: וְנָפְלָה הָאָרֶץ הַזֹּאת לָכֶם בְּנַחֲלָה
  choice: Cette terre vous échoira en héritage
  rationale: נפל est employé dans l’idiome de ce qui « tombe » à quelqu’un lors d’un partage. Le verbe français « échoir » transmet naturellement cette idée d’attribution tout en gardant la tonalité juridique de l’héritage.
theological_decisions:
- issue: L’idiome du serment נָשָׂאתִי אֶת יָדִי
  choice: Conserver « j’ai levé la main » dans le texte et expliquer le serment en note
  alternative: « j’ai juré »
  rationale: Le texte hébreu présente un geste concret qui exprime un engagement solennel de Dieu. Le conserver évite de remplacer l’image par sa seule interprétation, tout en assurant la compréhension grâce à la note.
- issue: La portée de אִישׁ כְּאָחִיו dans le partage de la terre
  choice: « chacun au même titre que son frère »
  alternative: « chacun comme son frère » ou, littéralement, « un homme comme son frère »
  rationale: Le contexte d’attribution territoriale indique l’égalité de statut ou de part. La traduction rend cette portée sans effacer le terme relationnel masculin « frère ».
- issue: Le référent de la promesse faite sous serment
  choice: Relier le geste de serment au don de la terre mentionnée
  alternative: Transformer la proposition relative en simple déclaration indépendante sans lien explicite
  rationale: Le féminin singulier de לְתִתָּהּ renvoie à la terre. Les deux-points gardent ce lien en français sans imposer une construction relative lourde ou ambiguë.
translation_notes:
  register: Français international moderne, digne et lisible. « Recevoir en héritage » est courant; « échoir » apporte une nuance juridique adaptée au partage du territoire sans rendre l’ensemble archaïque. Les images hébraïques importantes sont soit conservées dans le texte, soit signalées en note.
