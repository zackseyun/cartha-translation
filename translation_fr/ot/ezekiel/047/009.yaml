  text: וְ/הָיָ֣ה כָל נֶ֣פֶשׁ חַיָּ֣ה אֲֽשֶׁר יִשְׁרֹ֡ץ אֶ֣ל כָּל אֲשֶׁר֩ יָב֨וֹא שָׁ֤ם נַחֲלַ֨יִם֙ יִֽחְיֶ֔ה וְ/הָיָ֥ה הַ/דָּגָ֖ה רַבָּ֣ה מְאֹ֑ד כִּי֩ בָ֨אוּ שָׁ֜מָּ/ה הַ/מַּ֣יִם הָ/אֵ֗לֶּה וְ/יֵרָֽפְאוּ֙ וָ/חָ֔י כֹּ֛ל אֲשֶׁר יָ֥בוֹא שָׁ֖מָּ/ה הַ/נָּֽחַל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/009.yaml
  text: And every living creature that swarms[a], wherever the river goes, will live. And there will be very many fish, because these waters go there and are healed[b]; everything will live wherever the river goes.
translation:
  language: fr
  text: Tout être vivant qui pullule, partout où les cours d’eau arriveront, vivra. Les poissons seront extrêmement nombreux, car ces eaux y arriveront et elles seront guéries. Tout vivra partout où ira le cours d’eau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֶפֶשׁ חַיָּה
  choice: être vivant
  rationale: L’expression désigne ici toute créature animée, dans le contexte de la vie aquatique, et non une « âme » humaine au sens étroit.
- source_word: יִשְׁרֹץ
  choice: pullule
  rationale: Le verbe évoque la multiplication foisonnante de créatures, particulièrement dans l’eau; « pulluler » conserve cette image vive.
- source_word: נַחֲלַיִם
  choice: les cours d’eau
  rationale: La forme est morphologiquement duelle ou plurielle. « Cours d’eau » en conserve le nombre sans imposer avec certitude l’idée de deux bras distincts.
- source_word: יִחְיֶה
  choice: vivra
  rationale: Cette traduction directe préserve la simplicité de l’énoncé hébreu et sa portée vivifiante.
- source_word: הַדָּגָה רַבָּה מְאֹד
  choice: les poissons seront extrêmement nombreux
  rationale: Le nom collectif désigne la population de poissons, et רַבָּה מְאֹד en souligne la très grande abondance.
- source_word: וְיֵרָפְאוּ
  choice: les eaux en seront guéries
  rationale: Le passif de רפא exprime explicitement la guérison. L’ajout explicatif « les eaux en » donne en français le sujet implicite le plus probable sans réduire l’image à « devenir douces ».
- source_word: וָחָי כֹּל
  choice: Tout vivra
  rationale: La formulation concise garde la portée universelle et récapitulative de la proposition.
- source_word: הַנָּחַל
  choice: le torrent
  rationale: נחל désigne un cours d’eau ou torrent; dans cette vision, il s’agit d’un écoulement durable. « Torrent » distingue naturellement ce singulier des cours d’eau mentionnés plus tôt.
theological_decisions:
- issue: Image visionnaire de la guérison des eaux
  choice: 'Conserver le langage explicite de guérison: « les eaux en seront guéries »'
  alternative: « les eaux y deviendront saines » ou « y deviendront douces »
  rationale: Le texte décrit la restauration au moyen du verbe « guérir ». Maintenir cette personnification préserve la force théologique de la vision sans en fixer une interprétation doctrinale ultérieure.
- issue: Nombre de נַחֲלַיִם
  choice: Rendre la forme duelle/plurielle par « les cours d’eau »
  alternative: Harmoniser avec le singulier final et traduire « le torrent »
  rationale: La morphologie hébraïque présente une tension réelle entre la forme duelle/plurielle au début et הַנָּחַל au singulier à la fin; la traduction la conserve plutôt que de l’effacer.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme en deux phrases suit la progression du verset. « Pullule » garde la vigueur de l’image biologique; « guéries » préserve la métaphore hébraïque. La distinction entre « cours d’eau » au pluriel et « torrent » au singulier reflète volontairement la variation du texte source.
