revisions:
- from: Tout être vivant qui pullule vivra partout où iront les cours d’eau[a]. Les poissons seront extrêmement nombreux, car ces eaux arriveront là, et les eaux en seront guéries[b]. Tout vivra partout où ira le torrent.
  to: Tout être vivant qui pullule, partout où les cours d’eau arriveront, vivra. Les poissons seront extrêmement nombreux, car ces eaux y arriveront et elles seront guéries. Tout vivra partout où ira le cours d’eau.
  rationale: 'La révision remplace une formulation française ambiguë par une coordination qui reflète directement l’hébreu : les eaux arrivent en ce lieu et sont guéries. Elle emploie « cours d’eau » au singulier final pour un registre plus neutre, tout en conservant la variation morphologique du texte source par le pluriel initial. Les ancres et les notes sont maintenues et ajustées à la formulation révisée.'
