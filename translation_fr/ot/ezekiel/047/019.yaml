  text: וּ/פְאַת֙ נֶ֣גֶב תֵּימָ֔נָ/ה מִ/תָּמָ֗ר עַד מֵי֙ מְרִיב֣וֹת קָדֵ֔שׁ נַחֲלָ֖ה אֶל הַ/יָּ֣ם הַ/גָּד֑וֹל וְ/אֵ֥ת פְּאַת תֵּימָ֖נָ/ה נֶֽגְבָּ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/019.yaml
  text: And the south side[a], southward, shall be from Tamar to the waters of Meriboth-kadesh, to the wadi, to the Great Sea. This is the south side[c][b], southward.
translation:
  language: fr
  text: La limite du côté sud, vers le sud, ira de Tamar jusqu’aux eaux de Meriboth-Qadesh[a], jusqu’au torrent[b], jusqu’à la Grande Mer[c]. Voilà le côté sud, vers le sud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les eaux de Meriba-Qadesh ». L’hébreu porte ici la forme apparentée « Meriboth-Qadesh ».
    reason: alternative_reading
  - marker: b
    text: Le terme hébreu désigne ici un cours d’eau ou un lit de torrent, souvent saisonnier.
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire la mer Méditerranée.
    reason: cultural_note
lexical_decisions:
- source_word: פְאַת
  choice: côté
  rationale: Dans cette description des limites du pays, le nom désigne le côté ou le bord formant la frontière. « Côté » convient à la formule répétée du passage.
- source_word: נֶגֶב / תֵּימָנָה
  choice: du côté sud, vers le sud
  rationale: Les deux termes directionnels sont conservés afin de rendre l’insistance de l’hébreu sans transformer נֶגֶב en nom propre régional.
- source_word: מִתָּמָר
  choice: de Tamar
  rationale: Tamar est un nom de lieu, conservé sous une forme usuelle en français.
- source_word: מֵי מְרִיבוֹת קָדֵשׁ
  choice: les eaux de Meriboth-Qadesh
  rationale: La forme consonantique du texte porte Meriboth-Qadesh. La variante apparentée et plus connue Meriba-Qadesh est signalée en note.
- source_word: נַחֲלָה
  choice: jusqu’au torrent
  rationale: Dans cette liste de frontières, la forme renvoie vraisemblablement à un cours d’eau ou lit de torrent, avec une valeur directionnelle. « Torrent » est naturel dans le registre géographique biblique, tout en laissant en note la possibilité d’un cours d’eau saisonnier.
- source_word: הַיָּם הַגָּדוֹל
  choice: la Grande Mer
  rationale: Cette traduction conserve la désignation géographique conventionnelle de l’hébreu; son identification à la Méditerranée est donnée en note plutôt qu’intégrée au texte.
- source_word: וְאֵת פְּאַת תֵּימָנָה נֶגְבָּה
  choice: Tel sera le côté sud, vers le sud
  rationale: La proposition hébraïque est elliptique et récapitulative. « Tel sera » explicite sobrement sa fonction tout en maintenant la répétition directionnelle.
