base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/018.yaml
  text: And the eastern side shall be from between Hauran and Damascus[a], and between Gilead and the land of Israel, the Jordan, from the border to the eastern sea; you shall measure the eastern side.
translation:
  language: fr
  text: Quant au côté est, entre le Hauran et Damas, et entre Galaad et le pays d’Israël, le Jourdain servira de limite. De la frontière jusqu’à la mer orientale[a], vous mesurerez le côté est.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'C’est-à-dire, plus précisément, la mer Morte. Littéralement : « la mer orientale ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְאַת קָדִים / פְאַת קָדִימָה
  choice: côté est
  rationale: Dans cette description territoriale, פאה désigne un côté ou une ligne de délimitation. « Côté est » est naturel en français et conserve la répétition qui encadre le verset.
- source_word: מִבֵּין ... וּמִבֵּין ...
  choice: entre… puis entre…
  rationale: La répétition situe la limite entre deux paires de territoires. « Puis » rend l’enchaînement lisible sans alourdir la phrase par un calque de מן + בין.
- source_word: חַוְרָן
  choice: le Hauran
  rationale: Forme française usuelle du nom de cette région, employée avec l’article.
- source_word: דַּמֶּשֶׂק
  choice: Damas
  rationale: Forme française conventionnelle du nom de la ville.
- source_word: הַגִּלְעָד
  choice: Galaad
  rationale: Forme française biblique conventionnelle du nom de la région.
- source_word: אֶרֶץ יִשְׂרָאֵל
  choice: le pays d’Israël
  rationale: Le mot אֶרֶץ est explicitement présent; « pays » distingue ici le territoire du peuple.
- source_word: הַיַּרְדֵּן
  choice: le Jourdain servira de limite
  rationale: Le nom est en apposition dans une syntaxe hébraïque condensée. Cette formulation française explicite sa fonction géographique sans ajouter un autre tracé.
- source_word: מִגְּבוּל
  choice: depuis la frontière
  rationale: גְּבוּל désigne une frontière ou une limite. Le texte ne précise pas ici laquelle; la traduction conserve cette indétermination.
- source_word: הַיָּם הַקַּדְמוֹנִי
  choice: la mer orientale
  rationale: Traduction directe du titre descriptif hébreu; l’identification probable avec la mer Morte est donnée en note plutôt que substituée au texte.
- source_word: תָּמֹדּוּ
  choice: vous mesurerez
  rationale: Le verbe מדד signifie « mesurer » et reprend le vocabulaire de mesure employé dans le chapitre.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et soutenu. La syntaxe hébraïque très condensée autour du Jourdain est légèrement explicitée pour être intelligible, tandis que l’imprécision de « la frontière » est conservée. Le marqueur de note est placé après « mer orientale », expression qu’il explique.
