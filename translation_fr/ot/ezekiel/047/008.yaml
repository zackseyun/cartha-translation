  text: וַ/יֹּ֣אמֶר אֵלַ֗/י הַ/מַּ֤יִם הָ/אֵ֨לֶּה֙ יוֹצְאִ֗ים אֶל הַ/גְּלִילָה֙ הַ/קַּדְמוֹנָ֔ה וְ/יָרְד֖וּ עַל הָֽ/עֲרָבָ֑ה וּ/בָ֣אוּ הַ/יָּ֔מָּ/ה אֶל הַ/יָּ֥מָּ/ה הַ/מּֽוּצָאִ֖ים ו/נרפאו הַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/008.yaml
  text: Then he said to me[a], “These waters flow out toward the eastern district and go down into the Arabah; then they enter the sea. and when they are brought out into the sea[c][b], the waters are healed.”
translation:
  language: fr
  text: 'Puis il me dit : « Ces eaux coulent vers la région orientale, descendent dans l’Araba et arrivent à la mer. Lorsqu’elles sont déversées dans cette mer[a][b], les eaux sont guéries[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit probablement de la mer Morte, située à l’est de Juda.
    reason: Identification géographique contextuelle que le texte hébreu ne formule pas comme un nom propre.
  - marker: b
    text: 'L’hébreu de cette proposition est difficile. Autres traductions possibles : « quand elles débouchent dans la mer » ou « vers la mer où elles se déversent ».'
    reason: La syntaxe et la fonction du participe passif הַמּוּצָאִים sont débattues; la note préserve cette ambiguïté textuelle.
  - marker: c
    text: 'Ou : « les eaux sont assainies », voire « deviennent douces ». Littéralement : « les eaux sont guéries ».'
    reason: La note donne le sens contextuel possible tout en signalant la métaphore littérale de רפא.
lexical_decisions:
- source_word: הַמַּיִם הָאֵלֶּה
  choice: ces eaux
  rationale: Le nom hébreu מַיִם est morphologiquement pluriel et s’accorde ici avec le démonstratif et le participe au pluriel. « Ces eaux » conserve cette forme tout en restant naturel en français.
- source_word: יוֹצְאִים
  choice: coulent
  rationale: Le participe de יצא exprime ici le mouvement continu des eaux qui sortent du sanctuaire. « Coulent » rend naturellement ce mouvement dans le contexte, sans imposer une simple marche directionnelle.
- source_word: הַגְּלִילָה הַקַּדְמוֹנָה
  choice: la région orientale
  rationale: גְּלִילָה désigne une région ou une zone, et קַדְמוֹנָה indique l’est. « Région orientale » est clair, actuel et géographiquement sobre.
- source_word: וְיָרְדוּ עַל הָעֲרָבָה
  choice: descendent dans l’Araba
  rationale: ירד marque une descente, tandis que l’Araba est ici la région géographique de la grande dépression. La préposition « dans » convient au mouvement vers cette zone encaissée.
- source_word: וּבָאוּ הַיָּמָּה
  choice: arrivent à la mer
  rationale: La forme directionnelle הַיָּמָּה exprime le mouvement vers la mer. « Arrivent à la mer » restitue clairement cette destination.
- source_word: אֶל הַיָּמָּה הַמּוּצָאִים
  choice: lorsqu’elles sont déversées dans la mer
  rationale: La construction massorétique est difficile. הַמּוּצָאִים peut être compris comme un participe passif de יצא, évoquant les eaux conduites ou déversées dans la mer. Cette formulation française rend ce mouvement sans adopter l’interprétation conjecturale de « mer aux eaux stagnantes ».
- source_word: וְנרפאו הַמָּיִם
  choice: les eaux sont guéries
  rationale: Le verbe רפא signifie littéralement « guérir ». Conserver la métaphore respecte l’image frappante du texte; l’idée d’eaux rendues saines ou douces est indiquée en note.
theological_decisions:
- issue: Nature de la transformation des eaux
  choice: les eaux sont guéries
  alternative: les eaux deviennent saines / douces
  rationale: Le texte emploie le vocabulaire de la guérison plutôt qu’un terme technique désignant directement la désalinisation. La traduction maintient donc la personnification et laisse ouverte la portée symbolique de cette guérison.
- issue: Identification de « la mer »
  choice: la mer, avec identification probable en note
  alternative: la mer Morte dans le corps du texte
  rationale: Le contexte géographique renvoie très probablement à la mer Morte, mais le texte hébreu dit simplement « la mer ». Ne pas ajouter le nom propre dans le corps du verset évite de transformer une identification contextuelle en formulation explicite du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme suit les trois mouvements géographiques du cours d’eau. « Araba » est conservé comme nom géographique; « région orientale » évite un calque obscur; « guéries » maintient l’image hébraïque sans l’aplanir.
