  text: וְ/זֶ֖ה גְּב֣וּל הָ/אָ֑רֶץ לִ/פְאַ֨ת צָפ֜וֹנָ/ה מִן הַ/יָּ֧ם הַ/גָּד֛וֹל הַ/דֶּ֥רֶךְ חֶתְלֹ֖ן לְב֥וֹא צְדָֽדָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/015.yaml
  text: 'And this shall be the boundary of the land: on the north side[d][c][b][a], from the Great Sea by the way of Hethlon to Lebo-zedad.'
translation:
  language: fr
  text: 'Et voici la frontière du pays du côté nord : depuis la Grande Mer[a], par le chemin de Hetlôn[b], en allant vers Tsedad[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « Grande Mer » désigne la mer Méditerranée.
    reason: cultural_note
  - marker: b
    text: 'Autre traduction possible : « par la route qui mène à Hetlôn ».'
    reason: lexical_alternative
  - marker: c
    text: Littéralement, « pour venir à Tsedad ». L’expression peut aussi évoquer l’approche de Tsedad.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה גְּבוּל הָאָרֶץ
  choice: Voici la limite du pays
  rationale: La proposition nominale hébraïque n’exprime aucun verbe. « Voici » introduit naturellement en français la délimitation qui suit sans imposer un temps verbal absent du texte.
- source_word: לִפְאַת צָפוֹנָה
  choice: du côté nord
  rationale: Rend le côté ou bord septentrional du territoire dans un français géographique naturel.
- source_word: מִן הַיָּם הַגָּדוֹל
  choice: elle partira de la Grande Mer
  rationale: La préposition מִן marque le point de départ. « Grande Mer » conserve la désignation géographique biblique plutôt que de lui substituer son identification moderne.
- source_word: הַדֶּרֶךְ חֶתְלֹן
  choice: suivra la route de Hetlôn
  rationale: הַדֶּרֶךְ désigne ici la route ou l’itinéraire associé à Hetlôn. La formulation française explicite sobrement le parcours de la limite.
- source_word: לְבוֹא צְדָדָה
  choice: ira jusqu’à l’entrée de Tsedad
  rationale: Dans les formules de frontière, לְבוֹא peut désigner l’approche ou l’entrée d’un lieu. Le hé final de צְדָדָה marque la direction vers Tsedad; il ne justifie pas de former ici le toponyme composé « Lebo-Tsedad ».
theological_decisions: []
translation_notes:
  register: 'Français international moderne, clair et digne. Le style de relevé frontalier est conservé, mais la syntaxe est rendue fluide par des verbes de parcours. Les noms propres sont translittérés d’après l’hébreu : Hetlôn et Tsedad.'
