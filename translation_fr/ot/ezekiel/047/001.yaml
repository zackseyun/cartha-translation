  terminology: « Maison » conserve le lexique source tout en étant utilement éclairé par la note; « autel », « seuil », « façade » et « côté droit » sont exacts et naturels. La note b explique correctement l’emploi architectural de « épaule » sans l’imposer dans le texte courant.
