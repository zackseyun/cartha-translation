source:
  edition: WLC
  text: וַ/יְשִׁבֵ/נִי֮ אֶל פֶּ֣תַח הַ/בַּיִת֒ וְ/הִנֵּה מַ֣יִם יֹצְאִ֗ים מִ/תַּ֨חַת מִפְתַּ֤ן הַ/בַּ֨יִת֙ קָדִ֔ימָ/ה כִּֽי פְנֵ֥י הַ/בַּ֖יִת קָדִ֑ים וְ/הַ/מַּ֣יִם יֹרְדִ֗ים מִ/תַּ֜חַת מִ/כֶּ֤תֶף הַ/בַּ֨יִת֙ הַ/יְמָנִ֔ית מִ/נֶּ֖גֶב לַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/001.yaml
  text: Then he brought me back to the entrance of the house[a], and behold, water was coming out from under the threshold of the house eastward, because the front of the house faced east; and the water was flowing down from under the south side of the house[b], on the right side, south of the altar.
translation:
  language: fr
  text: Puis il me ramena à l’entrée de la Maison[a]. Et voici que de l’eau sortait de dessous le seuil de la Maison, en direction de l’est, car la façade de la Maison était tournée vers l’est. L’eau descendait de dessous le côté droit de la Maison[b], au sud de l’autel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du Temple ». L’hébreu dit littéralement « de la Maison » ; dans cette vision, il s’agit du bâtiment du temple.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de dessous l’épaule droite de la Maison ». Dans ce contexte architectural, « épaule » désigne le côté d’un bâtiment.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשִׁבֵנִי
  choice: Puis il me ramena
  rationale: 'Le hiphil de שוב avec suffixe de première personne exprime une action causative : il fait revenir le prophète, d’où le français naturel « il me ramena ».'
- source_word: פֶּתַח הַבַּיִת
  choice: à l’entrée de la Maison
  rationale: פֶּתַח désigne l’entrée ou l’ouverture. « Maison » conserve le terme hébreu tout en renvoyant, dans cette vision, au bâtiment du temple.
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Cette tournure française conserve la fonction présentative et l’appel à l’attention de la particule hébraïque.
- source_word: מַיִם יֹצְאִים
  choice: de l’eau sortait
  rationale: Le participe décrit une action en cours ; le nom hébreu formellement pluriel se rend naturellement par le collectif singulier « eau » en français.
- source_word: מִתַּחַת מִפְתַּן
  choice: de dessous le seuil
  rationale: Rend directement la relation spatiale et le sens architectural de מִפְתָּן.
- source_word: קָדִימָה
  choice: en direction de l’est
  rationale: La forme directionnelle indique un mouvement vers l’est.
- source_word: כִּי פְנֵי הַבַּיִת קָדִים
  choice: car la façade de la Maison était tournée vers l’est
  rationale: « Façade » exprime ici naturellement les « faces/devant » du bâtiment et « était tournée » son orientation.
- source_word: יֹרְדִים
  choice: descendait
  rationale: Le verbe décrit le mouvement descendant de l’eau ; le singulier s’accorde avec le collectif français « l’eau ».
- source_word: מִכֶּתֶף הַבַּיִת הַיְמָנִית
  choice: de dessous le côté droit de la Maison
  rationale: כָּתֵף, littéralement « épaule », désigne par extension le côté d’une construction ; הַיְמָנִית le qualifie comme le côté droit. Cette formulation évite de doubler ou de confondre « droit » et « sud ».
- source_word: מִנֶּגֶב לַמִּזְבֵּחַ
  choice: au sud de l’autel
  rationale: La locution situe le passage de l’eau par rapport à l’autel ; « au sud de » est précis et idiomatique.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, digne et lisible. La majuscule à « Maison » signale son emploi comme désignation du sanctuaire sans remplacer dans le texte le terme concret de l’hébreu. La syntaxe finale suit les deux indications distinctes du texte : le côté droit de la Maison et la position au sud de l’autel.'
