source:
  edition: WLC
  text: וְ/הָיָ֣ה בַ/שֵּׁ֔בֶט אֲשֶׁר גָּ֥ר הַ/גֵּ֖ר אִתּ֑/וֹ שָׁ֚ם תִּתְּנ֣וּ נַחֲלָת֔/וֹ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/023.yaml
  text: And it shall be that in the tribe with which the sojourner resides[a], there you shall give him his inheritance, declares the Lord GOD.
translation:
  language: fr
  text: 'Il en sera ainsi : dans la tribu où réside l’étranger établi[a], c’est là que vous lui donnerez son héritage, déclare le Seigneur Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « résident étranger ». Le mot hébreu גֵּר désigne une personne non native installée au milieu d’Israël sous son ordre communautaire, et non un simple voyageur de passage.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Dans la tribu… c’est là que
  rationale: La tournure française met directement en relief la stipulation et rend la valeur prospective et juridique de la formule hébraïque sans calque lourd.
- source_word: בַשֵּׁבֶט
  choice: dans la tribu
  rationale: Dans le contexte du partage du pays, שֵׁבֶט désigne la tribu comme unité territoriale.
- source_word: אֲשֶׁר גָּר הַגֵּר אִתּוֹ
  choice: où réside l’étranger établi
  rationale: גֵּר désigne ici un non-Israélite installé durablement au sein de la communauté, et non un simple voyageur; «où réside» restitue naturellement en français son rattachement à la tribu.
- source_word: שָׁם
  choice: c’est là
  rationale: La construction emphatique souligne que l’héritage doit être attribué précisément dans la tribu où l’étranger réside.
- source_word: תִּתְּנוּ
  choice: vous lui donnerez
  rationale: Le futur français convient à cette prescription juridique adressée au pluriel et conserve le sens direct de נתן.
- source_word: נַחֲלָתוֹ
  choice: son héritage
  rationale: נַחֲלָה désigne ici la part territoriale attribuée; «héritage» maintient le vocabulaire foncier et théologique du passage.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclare le Seigneur Yahweh
  rationale: Cette formule prophétique est rendue clairement, tandis que «Yahweh» représente le nom divin et distingue יהוה du titre אֲדֹנָי.
theological_decisions:
- issue: Traduction du nom divin יהוה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: «Yahweh» préserve le nom propre de l’hébreu et évite de confondre les deux éléments de la formule, le titre אֲדֹנָי et le nom יהוה.
- issue: Statut du גֵּר dans l’attribution territoriale
  choice: étranger établi recevant «son héritage»
  alternative: étranger de passage recevant seulement un bien
  rationale: Le contexte et le lexème גֵּר décrivent une personne non native durablement intégrée à l’ordre communautaire; le texte lui attribue explicitement une נַחֲלָה, sans atténuer cette égalité foncière.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase évite le calque «Et il arrivera que», peu naturel ici, tout en conservant l’accent juridique sur le lieu exact de l’attribution. Le terme «étranger établi» explicite sobrement la stabilité impliquée par גֵּר.
