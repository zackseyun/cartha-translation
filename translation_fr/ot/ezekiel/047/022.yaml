review_pass:
  verdict: revise
  source_fidelity: La structure de l’attribution foncière et l’inclusion des gérim sont bien rendues. Toutefois, « ont eu des enfants » atténue le sens explicite de הוֹלִידוּ בָנִים (« ont engendré des fils »), dont le sujet est vraisemblablement masculin dans cette formulation. « Comme quelqu’un né dans le pays parmi les Israélites » est également moins direct que la comparaison avec un Israélite natif.
  naturalness: Le français est globalement clair, mais « Ils seront pour vous comme quelqu’un né dans le pays parmi les Israélites » est lourd et quelque peu imprécis. « Des étrangers résidant parmi vous » est plus neutre et plus idiomatique, dans un texte ancien, que « immigrés », terme qui peut évoquer des catégories administratives contemporaines.
  terminology: « Héritage », « tribus d’Israël » et « Israélites » conviennent. Le terme « étrangers résidant parmi vous » rend de manière transparente le statut de גֵּר sans suggérer un simple étranger de passage ni importer indûment un cadre migratoire moderne.
  issues:
  - severity: medium
    issue: Rendu de הוֹלִידוּ בָנִים par « ont eu des enfants ».
    rationale: Le texte hébreu dit littéralement qu’ils ont engendré des fils. Même si בָנִים peut parfois avoir une portée collective, le verbe au hiphil et le nom « fils » justifient de conserver cette formulation dans le texte, plutôt que de la reléguer en note.
  - severity: low
    issue: Formulation de כְּאֶזְרָח בִּבְנֵי יִשְׂרָאֵל.
    rationale: « Comme quelqu’un né dans le pays parmi les Israélites » est syntaxiquement pesant et rend moins nettement l’assimilation statutaire aux Israélites natifs. « Comme des Israélites nés dans le pays » est plus naturel tout en gardant la comparaison.
  - severity: low
    issue: Choix de « immigrés » pour הַגֵּרִים.
    rationale: Le mot est possible, mais son sens socio-administratif moderne est plus marqué. « Étrangers résidant parmi vous » conserve mieux la notion ancienne de non-natifs établis au sein de la communauté.
  revised_text: Vous la distribuerez en héritage pour vous-mêmes et pour les étrangers résidant parmi vous[a], qui ont engendré des fils parmi vous[b]. Ils seront pour vous comme des Israélites nés dans le pays[c]. Avec vous, ils recevront un héritage parmi les tribus d’Israël.
