revisions:
- from: Vous la répartirez en héritage pour vous-mêmes et pour les immigrés qui résident parmi vous[a] et qui ont eu des enfants parmi vous[b]. Ils seront pour vous comme quelqu’un né dans le pays parmi les Israélites[c]. Avec vous, ils recevront une part d’héritage parmi les tribus d’Israël.
  to: Vous la distribuerez en héritage pour vous-mêmes et pour les étrangers résidant parmi vous[a], qui ont engendré des fils parmi vous[b]. Ils seront pour vous comme des Israélites nés dans le pays[c]. Avec vous, ils recevront un héritage parmi les tribus d’Israël.
  rationale: La révision conserve l’attribution effective d’un héritage aux résidents non israélites et la progression des deux verbes de partage. Elle rétablit « fils », explicitement présent dans l’hébreu, et reformule la comparaison avec le natif israélite dans un français plus naturel. Les notes gardent les principales possibilités lexicales sans résoudre au-delà du texte les questions de statut ou d’application.
  reviewer_model: gpt-5.6-terra
