source:
  edition: WLC
  text: וְ/הָיָ֗ה תַּפִּ֣לוּ אוֹתָ/הּ֮ בְּ/נַחֲלָה֒ לָ/כֶ֗ם וּ/לְ/הַ/גֵּרִים֙ הַ/גָּרִ֣ים בְּ/תוֹכְ/כֶ֔ם אֲשֶׁר הוֹלִ֥דוּ בָנִ֖ים בְּ/תֽוֹכְ/כֶ֑ם וְ/הָי֣וּ לָ/כֶ֗ם כְּ/אֶזְרָח֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל אִתְּ/כֶם֙ יִפְּל֣וּ בְ/נַחֲלָ֔ה בְּ/ת֖וֹךְ שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/022.yaml
  text: And it shall be that you shall allot it as an inheritance for yourselves and for the sojourners who sojourn among you[a], who have fathered children among you; and they shall be to you like a native among the sons of Israel[c][b]. With you they shall receive an inheritance among the tribes of Israel.
translation:
  language: fr
  text: Vous la distribuerez en héritage pour vous-mêmes et pour les étrangers résidant parmi vous[a], qui ont engendré des fils parmi vous[b]. Ils seront pour vous comme des Israélites nés dans le pays[c]. Avec vous, ils recevront un héritage parmi les tribus d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les immigrés » ou « les étrangers établis » ; le terme hébreu désigne des non-Israélites vivant durablement au sein de la communauté avec un statut reconnu.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « qui ont engendré des fils ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « comme un natif parmi les fils d’Israël » ; ou « comme des Israélites nés dans le pays ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּפִּלוּ / יִפְּלוּ (נפל avec נַחֲלָה)
  choice: répartirez / recevront une part d’héritage
  rationale: Le premier verbe, au hiphil, exprime l’attribution du territoire; le second, au qal, présente le résultat pour les bénéficiaires. Ces formulations rendent naturellement l’idiome foncier hébreu tout en conservant la distinction entre attribuer et recevoir.
- source_word: נַחֲלָה
  choice: héritage / part d’héritage
  rationale: Dans le contexte du partage du pays, le terme désigne une possession territoriale attribuée comme patrimoine héréditaire. « Part d’héritage » explicite cette dimension dans la dernière proposition.
- source_word: הַגֵּרִים הַגָּרִים בְּתוֹכְכֶם
  choice: les immigrés qui résident parmi vous
  rationale: גֵּר désigne ici une personne non originaire d’Israël mais durablement établie au sein de la communauté. « Immigrés » est actuel et compréhensible; « résident » souligne qu’il ne s’agit pas de voyageurs de passage.
- source_word: הוֹלִדוּ בָנִים
  choice: ont eu des enfants
  rationale: L’expression indique qu’ils ont fondé une famille au sein de la communauté. « Enfants » peut rendre בָנִים dans son sens collectif de descendance; la formulation littérale est signalée en note.
- source_word: כְּאֶזְרָח בִּבְנֵי יִשְׂרָאֵל
  choice: comme quelqu’un né dans le pays parmi les Israélites
  rationale: Cette formulation exprime le statut d’un membre natif du pays sans employer le terme potentiellement équivoque « autochtone ». « Israélites » rend naturellement l’expression collective « fils d’Israël ».
- source_word: אִתְּכֶם
  choice: Avec vous
  rationale: La place initiale conserve l’accent hébreu sur la participation commune des immigrés et des Israélites au partage.
- source_word: בְּתוֹךְ שִׁבְטֵי יִשְׂרָאֵל
  choice: parmi les tribus d’Israël
  rationale: La formule situe leur part à l’intérieur même de la structure tribale du partage territorial.
theological_decisions:
- issue: Statut des immigrés lors du partage du pays restauré
  choice: Le texte leur accorde une véritable part d’héritage aux côtés des Israélites natifs.
  alternative: Comprendre qu’ils bénéficient seulement d’un droit de résidence ou de protection, sans possession foncière.
  rationale: La répétition du vocabulaire de l’héritage et du partage, ainsi que la comparaison avec une personne née dans le pays, indique une inclusion réelle dans l’attribution territoriale. La traduction garde cette force sans préciser comment cette vision doit être appliquée ou interprétée au-delà du verset.
- issue: Portée de בָנִים
  choice: Le mot est compris collectivement comme « enfants » ou descendance.
  alternative: Le rendre formellement par « fils ».
  rationale: Le contexte met l’accent sur l’établissement familial durable des immigrés plutôt que sur le sexe de leur descendance. La note conserve toutefois la forme plus littérale.
- issue: Sens de כְּאֶזְרָח
  choice: La comparaison porte sur le statut d’une personne née dans le pays au sein d’Israël.
  alternative: Employer « comme un citoyen » ou « comme un autochtone ».
  rationale: « Né dans le pays » conserve l’idée de naissance et d’appartenance locale sans importer la notion moderne de citoyenneté ni les connotations contemporaines possibles d’« autochtone ».
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de la progression hébraïque, tandis que « immigrés », « Israélites » et « part d’héritage » assurent une lecture naturelle. Les trois marqueurs de note figurent dans le texte principal.
