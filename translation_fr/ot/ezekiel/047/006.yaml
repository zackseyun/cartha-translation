source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֵלַ֖/י הֲ/רָאִ֣יתָ בֶן אָדָ֑ם וַ/יּוֹלִכֵ֥/נִי וַ/יְשִׁבֵ֖/נִי שְׂפַ֥ת הַ/נָּֽחַל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/006.yaml
  text: Then he said to me[a], “Have you seen this[d][c][b], son of man?” Then he led me and brought me back to the bank of the stream.
translation:
  language: fr
  text: 'Il me dit alors : « As-tu vu, fils d’homme ? » Puis il me conduisit et me ramena au bord du torrent[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut aussi désigner un cours d’eau ou le lit d’un torrent.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Il me dit alors
  rationale: Le waw consécutif fait avancer le récit. « Alors » exprime naturellement la succession en français sans alourdir la phrase.
- source_word: הֲרָאִיתָ
  choice: As-tu vu ?
  rationale: La forme interrogative avec l’accompli demande si Ézéchiel a bien observé ce qui vient de lui être montré. L’hébreu n’énonce aucun complément d’objet; le français conserve cette formulation possible et son léger caractère implicite.
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: Cette formule vocative revient constamment dans Ézéchiel. Une traduction formelle préserve son motif littéraire et sa portée théologique, tout en restant intelligible en français.
- source_word: וַיּוֹלִכֵנִי
  choice: il me conduisit
  rationale: Le hifil de הלך est causatif. « Conduire » en rend naturellement le sens dans ce déplacement guidé.
- source_word: וַיְשִׁבֵנִי
  choice: me ramena
  rationale: Le hifil de שוב indique qu’il fait revenir le prophète. « Ramener » exprime clairement et idiomatiquement ce retour.
- source_word: שְׂפַת
  choice: au bord
  rationale: Le mot signifie littéralement « lèvre », puis « bord ». Pour un cours d’eau, « au bord » est naturel et ne précise pas indûment la nature de la rive.
- source_word: הַנָּחַל
  choice: du torrent
  rationale: נחל peut désigner un torrent, un cours d’eau ou son lit. Dans la vision, l’eau coule et s’accroît; « torrent » convient au contexte tout en gardant le caractère dynamique du cours d’eau.
theological_decisions:
- issue: Traduction de אדם dans l’appellation בֶן אָדָם
  choice: fils d’homme
  alternative: être humain ; mortel
  rationale: La formule est l’appellation prophétique récurrente adressée à Ézéchiel. « Fils d’homme » préserve sa forme hébraïque, sa répétition littéraire et sa tension théologique, sans lui imposer une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique sans archaïsme lexical. La question garde l’objet implicite de l’hébreu, et « au bord » évite le calque peu naturel « à la lèvre ».
