  text: וְ/חִלַּקְתֶּ֞ם אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את לָ/כֶ֖ם לְ/שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/021.yaml
  text: So you shall divide this land among yourselves according to the tribes of Israel[a].
translation:
  language: fr
  text: Vous répartirez donc ce pays entre vous, selon les tribus d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Vous répartirez ce pays pour vous, pour les tribus d’Israël. »'
    reason: La préposition ל peut introduire les bénéficiaires (« pour vous », « pour les tribus ») plutôt que le cadre selon lequel s’effectue la répartition.
lexical_decisions:
- source_word: וְחִלַּקְתֶּם
  choice: Vous répartirez donc
  rationale: Le piel de חלק signifie « partager, répartir, attribuer en parts ». « Répartir » convient naturellement au partage territorial. Le waw est rendu par « donc » pour exprimer la continuité logique avec la délimitation précédente.
- source_word: אֶת
  choice: '[marque de l’objet direct, non traduite]'
  rationale: La marque hébraïque de l’objet direct défini n’a pas d’équivalent autonome en français.
- source_word: הָאָרֶץ הַזֹּאת
  choice: ce pays
  rationale: Dans ce contexte de frontières et d’attribution territoriale, אֶרֶץ désigne le pays. « Ce pays » est direct, naturel et dignifié en français moderne.
- source_word: לָכֶם
  choice: entre vous
  rationale: Le syntagme signifie littéralement « pour vous ». Dans le contexte d’une répartition interne, « entre vous » exprime naturellement les bénéficiaires collectifs sans exclure la lecture plus littérale, signalée en note.
- source_word: לְשִׁבְטֵי יִשְׂרָאֵל
  choice: selon les tribus d’Israël
  rationale: Le ל marque ici le cadre de la répartition. « Selon les tribus d’Israël » indique que le partage est organisé suivant les divisions tribales, tout en conservant en note l’alternative syntaxique « pour les tribus ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. Le futur à valeur injonctive restitue naturellement la forme verbale hébraïque dans ce contexte prescriptif.
