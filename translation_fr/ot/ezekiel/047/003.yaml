base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/003.yaml
  text: As the man went out eastward with a measuring line in his hand[a], he measured a thousand cubits and led me through the water, water up to the ankles.
translation:
  language: fr
  text: 'Lorsque l’homme sortit vers l’est, tenant à la main un cordeau à mesurer, il mesura mille coudées, puis me fit traverser l’eau : elle m’arrivait aux chevilles.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des eaux de chevilles », c’est-à-dire de l’eau arrivant aux chevilles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאת הָאִישׁ
  choice: Lorsque l’homme sortit
  rationale: L’infinitif construit précédé de בְּ introduit une proposition temporelle. « Lorsque » restitue naturellement ce rapport en français, et « l’homme » renvoie à la figure masculine déjà présentée.
- source_word: קָדִים
  choice: vers l’est
  rationale: Le terme est employé ici dans un sens directionnel ; « vers l’est » est clair et idiomatique.
- source_word: וְקָו בְּיָדוֹ
  choice: un cordeau à mesurer à la main
  rationale: קָו désigne ici un cordeau servant à mesurer. La formulation conserve l’image concrète de l’instrument tenu en main.
- source_word: וַיָּמָד אֶלֶף בָּאַמָּה
  choice: il mesura mille coudées
  rationale: La tournure indique une distance exprimée selon l’unité de la coudée. « Mille coudées » est la formulation française conventionnelle.
- source_word: וַיַּעֲבִרֵנִי בַמַּיִם
  choice: me fit traverser l’eau
  rationale: La forme causative de עבר signifie qu’il fait passer le prophète dans ou à travers l’eau ; cette traduction préserve explicitement la valeur causative.
- source_word: מֵי אָפְסָיִם
  choice: elle m’arrivait aux chevilles
  rationale: L’expression littérale « eaux des chevilles » décrit la profondeur de l’eau. La reformulation française en explicite le sens sans ajouter d’interprétation.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche de la progression hébraïque tout en évitant une formulation artificielle ; la coudée est conservée comme unité ancienne.
