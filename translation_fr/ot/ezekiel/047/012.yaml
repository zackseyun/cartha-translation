source:
  edition: WLC
  text: וְ/עַל הַ/נַּ֣חַל יַעֲלֶ֣ה עַל שְׂפָת֣/וֹ מִ/זֶּ֣ה וּ/מִ/זֶּ֣ה כָּל עֵֽץ מַ֠אֲכָל לֹא יִבּ֨וֹל עָלֵ֜/הוּ וְ/לֹֽא יִתֹּ֣ם פִּרְי֗/וֹ לָֽ/חֳדָשָׁי/ו֙ יְבַכֵּ֔ר כִּ֣י מֵימָ֔י/ו מִן הַ/מִּקְדָּ֖שׁ הֵ֣מָּה יֽוֹצְאִ֑ים ו/היו פִרְי/וֹ֙ לְ/מַֽאֲכָ֔ל וְ/עָלֵ֖/הוּ לִ/תְרוּפָֽה־־׀׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/012.yaml
  text: Along the river[a], on its bank, on this side and on that side, every kind of tree for food will grow. Its leaf will not wither, and its fruit will not fail; every month it will bear fresh fruit, because its waters are coming out from the sanctuary. Its fruit will be for food[c][b], and its leaf for healing.
translation:
  language: fr
  text: Le long du torrent, sur chacune de ses rives[a], pousseront toutes sortes d’arbres fruitiers. Leur feuillage ne se flétrira pas et leurs fruits ne s’épuiseront pas. Chaque mois, ils donneront de nouveaux fruits[b], car les eaux du torrent sortent du sanctuaire. Leurs fruits serviront de nourriture et leurs feuilles, de remède[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur sa rive, de ce côté-ci et de ce côté-là ».'
    reason: La note préserve la formulation spatiale imagée de l’hébreu derrière le français idiomatique « sur chacune de ses rives ».
  - marker: b
    text: 'Ou : « ils produiront des fruits de primeur ». Le verbe hébreu évoque une production précoce ou nouvellement mûrie.'
    reason: La nuance de בכר ne se laisse pas reproduire entièrement par une formulation française à la fois claire et naturelle dans ce contexte.
  - marker: c
    text: 'Ou : « pour la guérison » ou « comme médicament ».'
    reason: תרופה admet une nuance générale de guérison aussi bien qu’un sens concret de remède.
lexical_decisions:
- source_word: הַנַּחַל
  choice: le torrent
  rationale: Dans la vision d’Ézéchiel, נחל désigne le cours d’eau qui jaillit du sanctuaire. « Torrent » conserve son caractère d’eau courante, tandis que « fleuve » pourrait suggérer d’emblée un grand cours d’eau.
- source_word: יַעֲלֶה
  choice: pousseront
  rationale: Le verbe signifie littéralement « monter », mais décrit ici la croissance des arbres; « pousser » est l’équivalent idiomatique naturel.
- source_word: עַל שְׂפָתוֹ מִזֶּה וּמִזֶּה
  choice: sur chacune de ses rives
  rationale: Cette formulation française exprime clairement que les arbres poussent des deux côtés du cours d’eau, tout en rendant l’image hébraïque « de ce côté-ci et de ce côté-là ».
- source_word: כָּל עֵץ מַאֲכָל
  choice: toutes sortes d’arbres fruitiers
  rationale: L’expression désigne l’ensemble des arbres fournissant de quoi manger. « Arbres fruitiers » est naturel en français et ne suppose pas une espèce particulière.
- source_word: לֹא יִבּוֹל עָלֵהוּ
  choice: leur feuillage ne se flétrira pas
  rationale: Le singulier collectif hébreu « sa feuille » se rend naturellement par « leur feuillage » lorsque les arbres sont exprimés au pluriel.
- source_word: וְלֹא יִתֹּם פִּרְיוֹ
  choice: leurs fruits ne s’épuiseront pas
  rationale: תם exprime le fait d’arriver à son terme ou de manquer. « Ne s’épuiseront pas » conserve l’idée d’une production qui ne tarit jamais.
- source_word: לָחֳדָשָׁיו יְבַכֵּר
  choice: Chaque mois, ils donneront de nouveaux fruits
  rationale: בכר évoque une production précoce ou de primeur. Dans ce contexte de fructification mensuelle, « nouveaux fruits » exprime une récolte renouvelée sans introduire l’idée moins naturelle que chaque récolte serait chronologiquement la toute première.
- source_word: מֵימָיו מִן הַמִּקְדָּשׁ הֵמָּה יוֹצְאִים
  choice: les eaux du torrent sortent du sanctuaire
  rationale: Le référent du possessif est explicité pour éviter une ambiguïté française. « Sanctuaire » rend directement מקדש dans le cadre de la vision du temple.
- source_word: לִתְרוּפָה
  choice: de remède
  rationale: תרופה peut désigner la guérison, le soin ou un remède. Ici, avec les feuilles comme sujet concret, « servir de remède » est idiomatique et conserve la portée médicinale du terme.
theological_decisions:
- issue: Nature de l’abondance vivifiante dans la vision du sanctuaire
  choice: Conserver l’imagerie concrète des arbres, de la nourriture et du remède, en maintenant le lien causal avec les eaux issues du sanctuaire.
  alternative: Interpréter explicitement le torrent et les arbres comme des symboles sacramentels, ecclésiaux ou eschatologiques.
  rationale: Le verset porte une forte charge théologique, mais il ne fournit pas lui-même une telle identification. La traduction laisse donc ouvertes les lectures théologiques ultérieures.
- issue: Nuance de יְבַכֵּר
  choice: Rendre la production continuellement renouvelée par « donneront de nouveaux fruits », avec une note sur la nuance de primeur.
  alternative: Traduire littéralement par « produiront des fruits précoces » ou « des fruits de primeur ».
  rationale: Le contexte insiste sur une fructification mensuelle ininterrompue. La formulation retenue reste naturelle en français et la note préserve la nuance lexicale sans la transformer en terminologie cultuelle de « prémices ».
translation_notes:
  register: Français international moderne, clair et digne. Les pluriels rendent naturellement la référence collective aux nombreuses espèces d’arbres. La ponctuation sépare la description, sa cause et les deux usages finaux. Tous les marqueurs de note figurent dans le texte principal.
