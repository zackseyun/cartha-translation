  yaml_path: translation/ot/ezekiel/047/020.yaml
  text: And the west side shall be the Great Sea[a], from the border up to opposite Lebo-hamath[b]. This is the west side.
translation:
  language: fr
  text: La limite ouest sera la Grande Mer[a], depuis la frontière jusqu’au point situé en face de Lebo-Hamath[b]. Telle est la limite ouest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire la mer Méditerranée.
    reason: cultural_note
  - marker: b
    text: L’hébreu Lebo-Hamath peut aussi être compris comme « l’entrée de Hamath » ; il s’agit vraisemblablement ici d’un nom de lieu situé vers la limite nord du pays.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְאַת יָם
  choice: Le côté ouest
  rationale: Dans les descriptions territoriales d’Israël, l’expression littérale « côté de la mer » désigne l’ouest, puisque la Méditerranée se trouve à l’ouest. Cette formulation française est naturelle tout en conservant le style d’une liste de frontières.
- source_word: הַיָּם הַגָּדוֹל
  choice: la Grande Mer
  rationale: Cette expression hébraïque désigne habituellement la Méditerranée. « Grande Mer » conserve la désignation de la source sans la remplacer par une identification moderne.
- source_word: מִגְּבוּל
  choice: depuis la frontière
  rationale: גְּבוּל désigne une frontière ou une limite territoriale. Le contexte ne précise pas davantage ici quelle frontière est visée.
- source_word: עַד נֹכַח
  choice: jusqu’en face de
  rationale: נֹכַח exprime ici une position spatiale en vis-à-vis. Avec עַד, la locution marque le point jusqu’auquel s’étend le côté décrit.
- source_word: לְבֹא חֲמָת
  choice: Lebo-Hamath
  rationale: L’expression, littéralement susceptible de signifier « l’entrée de Hamath », fonctionne vraisemblablement comme un nom géographique dans cette formule de délimitation. La translittération préserve cette possibilité sans trancher abusivement.
- source_word: זֹאת פְּאַת יָם
  choice: Tel est le côté ouest
  rationale: La proposition récapitule la limite qui vient d’être décrite. « Tel est » rend naturellement la formule démonstrative hébraïque en français.
