  text: בצאת/ו וּ/גְבָאָ֛י/ו וְ/לֹ֥א יֵרָפְא֖וּ לְ/מֶ֥לַח נִתָּֽנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/011.yaml
  text: But its swamps and marshes will not be healed[b][a]; they are left for salt.
translation:
  language: fr
  text: Mais ses marécages et ses mares ne seront pas assainis[a] ; ils sont voués au sel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « guéris », dans le prolongement de l’image des eaux guéries au verset précédent.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction : « ils ont été livrés au sel » ou « ils sont donnés au sel ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בצאתו
  choice: ses marécages
  rationale: Dans ce contexte topographique, le terme désigne des zones basses et humides liées aux eaux environnantes. « Marécages » rend naturellement cette réalité, et le possessif reprend le référent masculin singulier du contexte.
- source_word: וגבאיו
  choice: et ses mares
  rationale: גבא désigne des creux où l’eau s’accumule, des bassins ou des mares. « Mares » forme avec « marécages » un couple naturel sans rendre les deux termes identiques.
- source_word: ולא
  choice: ne… pas
  rationale: Négation simple du verbe qui suit, rendue selon l’usage courant du français.
- source_word: ירפאו
  choice: seront assainis
  rationale: Le niphal de רפא signifie littéralement « être guéri ». Appliqué aux eaux, « être assaini » conserve l’image d’une restauration tout en restant naturel en français ; une note signale la formulation littérale.
- source_word: למלח
  choice: pour le sel
  rationale: 'La préposition ל exprime ici la destination ou le résultat : ces lieux demeurent destinés au sel.'
- source_word: נתנו
  choice: seront réservés
  rationale: Le passif de נתן indique que ces zones sont vouées ou affectées au sel. « Seront réservés » exprime cette destination sans suggérer simplement un abandon involontaire.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La traduction maintient deux termes distincts pour les zones humides et conserve, en note, la métaphore hébraïque de la guérison ainsi que l’alternative plus littérale pour leur destination au sel.
