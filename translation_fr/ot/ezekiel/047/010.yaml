  text: וְ/הָיָה֩ יעמדו עָלָ֜י/ו דַּוָּגִ֗ים מֵ/עֵ֥ין גֶּ֨דִי֙ וְ/עַד עֵ֣ין עֶגְלַ֔יִם מִשְׁט֥וֹחַ לַֽ/חֲרָמִ֖ים יִהְי֑וּ לְ/מִינָ/ה֙ תִּהְיֶ֣ה דְגָתָ֔/ם כִּ/דְגַ֛ת הַ/יָּ֥ם הַ/גָּד֖וֹל רַבָּ֥ה מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/010.yaml
  text: And it will happen that fishermen will stand beside it[a]; from En-gedi even to En-eglaim there will be a place for spreading nets. Their fish will be of many kinds, like the fish of the Great Sea[b], very many.
translation:
  language: fr
  text: Des pêcheurs se tiendront sur ses rives. D’En-Guédi jusqu’à En-Églaïm, ce sera un lieu où l’on étendra les filets. Les poissons y seront de toutes sortes[a], comme les poissons de la Grande Mer[b], très nombreux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « selon son espèce », expression indiquant ici une grande diversité d’espèces.'
    reason: lexical_alternative
  - marker: b
    text: La « Grande Mer » désigne la mer Méditerranée.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה יעמדו עָלָיו דַּוָּגִים
  choice: Des pêcheurs se tiendront sur ses rives
  rationale: La tournure française exprime naturellement la scène future. עָלָיו signifie ici que les pêcheurs se tiennent au bord de l’étendue d’eau; «sur ses rives» évite l’expression peu naturelle «sur elle».
- source_word: מֵעֵין גֶּדִי וְעַד עֵין עֶגְלַיִם
  choice: D’En-Guédi jusqu’à En-Églaïm
  rationale: La construction מִן…וְעַד marque toute l’étendue comprise entre les deux lieux. Les formes françaises usuelles des noms propres sont retenues.
- source_word: מִשְׁטוֹחַ לַחֲרָמִים יִהְיוּ
  choice: il y aura des endroits où étendre les filets
  rationale: מִשְׁטוֹחַ désigne un lieu ou une surface où l’on étend quelque chose, et חֲרָמִים des filets de pêche. Le pluriel «des endroits» s’accorde naturellement avec l’étendue allant d’un lieu à l’autre.
- source_word: לְמִינָהּ תִּהְיֶה דְגָתָם
  choice: Ses poissons seront de toutes sortes
  rationale: Littéralement, le texte dit qu’ils seront «selon son espèce», formule distributive qui, dans ce contexte, exprime une grande diversité de poissons. «De toutes sortes» rend clairement ce sens en français courant.
- source_word: כִּדְגַת הַיָּם הַגָּדוֹל
  choice: comme les poissons de la Grande Mer
  rationale: La traduction conserve l’appellation biblique «la Grande Mer» au lieu de remplacer dans le texte le nom source par son identification géographique.
- source_word: רַבָּה מְאֹד
  choice: et ils seront très nombreux
  rationale: L’adjectif au singulier collectif qualifie la faune aquatique; une proposition avec un pronom pluriel produit une formulation française claire et naturelle.
