  text: וַ/יָּ֣מָד אֶ֔לֶף נַ֕חַל אֲשֶׁ֥ר לֹֽא אוּכַ֖ל לַ/עֲבֹ֑ר כִּֽי גָא֤וּ הַ/מַּ֨יִם֙ מֵ֣י שָׂ֔חוּ נַ֖חַל אֲשֶׁ֥ר לֹֽא יֵעָבֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/005.yaml
  text: Again he measured a thousand[a], and it was a river that I could not cross, because the waters had risen—waters to swim in[b], a river that could not be crossed.
translation:
  language: fr
  text: 'Il en mesura encore mille[a] : c’était une rivière que je ne pouvais pas traverser, car les eaux avaient monté — des eaux assez profondes pour y nager[b], une rivière qu’on ne pouvait pas traverser.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « mille » ; l’unité de mesure, probablement les coudées, est sous-entendue d’après le contexte.
    reason: implicit_unit
  - marker: b
    text: Littéralement « des eaux de nage ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: Il en mesura encore
  rationale: Le wayyiqtol poursuit la séquence narrative, tandis que « encore » exprime naturellement la répétition de la mesure dans le contexte immédiat. Le pronom « en » reprend la distance mesurée.
- source_word: אֶלֶף
  choice: mille
  rationale: Le texte hébreu indique simplement le nombre, l’unité étant sous-entendue d’après les mesures précédentes. La traduction conserve cette formulation, avec une note explicative.
- source_word: נַחַל
  choice: rivière
  rationale: Bien que le terme puisse désigner un torrent ou un oued, le cours d’eau visionnaire est ici devenu assez profond pour qu’on y nage ; « rivière » rend donc clairement la scène en français courant.
- source_word: אֲשֶׁר לֹא אוּכַל לַעֲבֹר
  choice: que je ne pouvais pas traverser
  rationale: La formulation rend directement l’incapacité exprimée par אוּכַל et le mouvement de traversée exprimé par לַעֲבֹר.
- source_word: כִּי גָאוּ הַמַּיִם
  choice: car les eaux avaient monté
  rationale: כִּי introduit la cause, et גָאוּ décrit des eaux qui montent ou grossissent. Le plus-que-parfait convient à la progression constatée dans le récit.
- source_word: מֵי שָׂחוּ
  choice: des eaux assez profondes pour y nager
  rationale: L’expression littérale « eaux de nage » désigne une profondeur qui exige ou permet la nage. Cette formulation française en communique naturellement le sens, tandis qu’une note en conserve la forme hébraïque.
- source_word: נַחַל אֲשֶׁר לֹא יֵעָבֵר
  choice: une rivière qu’on ne pouvait pas traverser
  rationale: Le passif impersonnel « qu’on ne pouvait pas traverser » rend le niphal et maintient la reprise emphatique de « rivière » présente en hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition finale de « rivière » et de l’impossibilité de la traverser est maintenue pour respecter l’insistance de l’hébreu.
