  text: וַ/יּוֹצִאֵ/נִי֮ דֶּֽרֶךְ שַׁ֣עַר צָפוֹנָ/ה֒ וַ/יְסִבֵּ֨/נִי֙ דֶּ֣רֶךְ ח֔וּץ אֶל שַׁ֣עַר הַ/ח֔וּץ דֶּ֖רֶךְ הַ/פּוֹנֶ֣ה קָדִ֑ים וְ/הִנֵּה מַ֣יִם מְפַכִּ֔ים מִן הַ/כָּתֵ֖ף הַ/יְמָנִֽית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/002.yaml
  text: Then he brought me out by way of the north gate[a], and led me around by the outside way to the outer gate, the one facing east; and behold[b], water was trickling from the right side.
translation:
  language: fr
  text: Puis il me fit sortir par la porte du nord et me conduisit tout autour, par l’extérieur, jusqu’à la porte extérieure, celle qui fait face à l’est. Et voici que de l’eau ruisselait[a] du côté droit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jaillissait » ou « s’écoulait » ; le verbe hébreu évoque un faible débit qui commence à sortir, plutôt qu’un courant abondant.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de l’épaule droite » ; ici, « épaule » désigne le côté ou le flanc de la structure.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִאֵנִי
  choice: il me fit sortir
  rationale: 'Le hiphil de יצא exprime la causation : « faire sortir » ou, selon le contexte, « conduire dehors ». « Il me fit sortir » conserve cette valeur.'
- source_word: דֶּרֶךְ שַׁעַר צָפוֹנָה
  choice: par la porte du nord
  rationale: דֶּרֶךְ indique ici l’itinéraire emprunté, et צָפוֹנָה l’orientation vers le nord. Cette formulation est naturelle en français.
- source_word: וַיְסִבֵּנִי דֶּרֶךְ חוּץ
  choice: me conduisit tout autour, par l’extérieur
  rationale: Le hiphil de סבב indique qu’il lui fait contourner l’enceinte, tandis que חוּץ précise que le trajet se fait à l’extérieur.
- source_word: אֶל שַׁעַר הַחוּץ
  choice: jusqu’à la porte extérieure
  rationale: Dans ce contexte architectural, הַחוּץ qualifie la porte située à l’extérieur ou dans l’enceinte extérieure.
- source_word: דֶּרֶךְ הַפּוֹנֶה קָדִים
  choice: celle qui fait face à l’est
  rationale: Le participe פנה décrit l’orientation de la porte; קָדִים signifie ici « vers l’est ».
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: הִנֵּה attire vivement l’attention sur un nouvel élément de la vision. « Voici que » en garde la force sans archaïsme excessif.
- source_word: מַיִם מְפַכִּים
  choice: de l’eau ruisselait
  rationale: Le verbe פכה évoque une eau qui jaillit ou s’écoule en faible quantité. « Ruisselait » rend naturellement ce petit écoulement naissant tout en laissant les autres nuances en note.
- source_word: מִן הַכָּתֵף הַיְמָנִית
  choice: du côté droit
  rationale: כָּתֵף signifie littéralement « épaule », mais désigne aussi le côté ou le flanc d’une structure. « Côté droit » convient au contexte architectural.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et visuel. La syntaxe garde la progression spatiale de l’hébreu, tandis que « tout autour, par l’extérieur » clarifie naturellement le trajet. Les deux notes sont rattachées aux expressions qu’elles expliquent, contrairement au décalage apparent des marqueurs dans la couche anglaise fournie.
