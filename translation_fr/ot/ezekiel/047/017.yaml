  text: וְ/הָיָ֨ה גְב֜וּל מִן הַ/יָּ֗ם חֲצַ֤ר עֵינוֹן֙ גְּב֣וּל דַּמֶּ֔שֶׂק וְ/צָפ֥וֹן צָפ֖וֹנָ/ה וּ/גְב֣וּל חֲמָ֑ת וְ/אֵ֖ת פְּאַ֥ת צָפֽוֹן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/017.yaml
  text: So the border shall be from the sea to Hazar-enon[a], at the border of Damascus; and on the north, northward, with the border of Hamath[b]. This shall be the north side.
translation:
  language: fr
  text: La frontière s’étendra donc de la mer[a] jusqu’à Hatsar-Énon[b], à la frontière de Damas ; au nord, vers le nord, jusqu’à la frontière de Hamath. Ce sera le côté nord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte simplement « la mer ». Dans ce contexte, il s’agit de la mer Méditerranée, sans qu’elle soit appelée ici « la Grande Mer ».
    reason: cross_reference
  - marker: b
    text: 'Hatsar-Énon : traditionnellement aussi transcrit « Hatsar-Énan ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה גְבוּל
  choice: La frontière s’étendra donc
  rationale: Le parfait avec waw introduit ici la détermination topographique de la frontière. « S’étendra » exprime naturellement en français son tracé sans modifier sa valeur descriptive.
- source_word: מִן הַיָּם
  choice: de la mer
  rationale: L’hébreu dit simplement « de la mer ». Le contexte désigne la Méditerranée, mais le texte ne répète pas ici « la Grande Mer ».
- source_word: חֲצַר עֵינוֹן
  choice: Hatsar-Énon
  rationale: Le nom de lieu est translittéré selon une forme adaptée au français moderne et conforme à la vocalisation massorétique.
- source_word: גְּבוּל דַּמֶּשֶׂק
  choice: à la frontière de Damas
  rationale: La construction situe Hatsar-Énon par rapport au territoire de Damas ; cette formulation rend clairement le rapport géographique.
- source_word: וְצָפוֹן צָפוֹנָה
  choice: au nord, vers le nord
  rationale: La répétition inhabituelle du terme « nord », avec la désinence directionnelle, est conservée afin de ne pas effacer l’insistance ou la difficulté du texte hébreu.
- source_word: וּגְבוּל חֲמָת
  choice: elle suivra la frontière de Hamath
  rationale: Dans cette description de limite territoriale, « suivra » rend en français courant le rapport topographique marqué de façon elliptique par la coordination hébraïque.
- source_word: וְאֵת פְּאַת צָפוֹן
  choice: Tel sera le côté nord
  rationale: La formule finale reprend et résume la délimitation précédente. Le français explicite sobrement cette fonction récapitulative.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la répétition hébraïque « au nord, vers le nord », tout en donnant à la phrase une syntaxe française lisible. Les noms propres suivent une translittération française usuelle.
