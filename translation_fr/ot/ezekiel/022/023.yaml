  text: And the word of Yahweh came to me[a], saying,
translation:
  language: fr
  text: 'La parole de Yahweh me fut adressée[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Et la parole de Yahweh fut à moi, disant » ; formule prophétique habituelle signifiant que Yahweh adressa sa parole au prophète.'
    reason: La note signale la forme littérale de l’hébreu et explique le rendu idiomatique français.
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans la formule prophétique וַיְהִי דְבַר־יְהוָה אֵלַי, le verbe signifie littéralement « fut/advint », mais l’expression française naturelle est « la parole … fut adressée à ». Cette tournure conserve le caractère solennel et formulaire.
- source_word: דְבַר
  choice: La parole
  rationale: Dans cette formule prophétique, דָּבָר désigne la parole ou le message divin. « La parole » maintient le vocabulaire biblique établi sans réduire le terme à une simple information.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », plutôt que remplacé par un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom indirect dans « me fut adressée » rend naturellement en français le destinataire marqué par אֵלַי, littéralement « à moi ».
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif « en disant/pour dire » introduit ici le discours direct qui suit. En français moderne, les deux-points remplissent naturellement cette fonction sans alourdir la formule.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte hébreu porte le nom divin personnel. « Yahweh » le conserve au lieu de lui substituer un titre, sans ajouter d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, digne et fluide. La tournure « fut adressée » conserve la solennité de la formule prophétique ; les deux-points introduisent naturellement l’oracle du verset suivant.
