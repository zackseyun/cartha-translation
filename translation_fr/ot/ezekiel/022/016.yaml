  yaml_path: translation/ot/ezekiel/022/016.yaml
  text: And you will be profaned through yourself before the eyes of the nations[a], and you will know that I am Yahweh.
translation:
  language: fr
  text: Tu seras profanée en toi-même sous les yeux des nations[a], et tu sauras que je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Tu seras souillée » ou « tu seras déshonorée en toi-même ». Le verbe hébreu peut évoquer la profanation, la souillure ou le déshonneur public. L’expression « en toi-même » rend de manière littérale une construction hébraïque concise, qui peut aussi suggérer « par toi-même ».'
    reason: alternative lexicale et syntaxique
lexical_decisions:
- source_word: נִחַלְתְּ
  choice: tu seras profanée
  rationale: Le nifal féminin singulier de חלל exprime ici le fait d’être profanée, avec une possible nuance réflexive. Dans le contexte d’Ézéchiel, « profanée » conserve mieux que « déshonorée » la dimension de sainteté violée.
- source_word: בָּךְ
  choice: par toi-même
  rationale: La préposition ב avec suffixe féminin est concise et ambiguë. « Par toi-même » rend naturellement en français le lien de cette profanation avec Jérusalem elle-même, sans exclure totalement une nuance réflexive.
- source_word: לְעֵינֵי
  choice: sous les yeux de
  rationale: Cette expression idiomatique garde l’image hébraïque de la visibilité publique tout en étant naturelle en français.
- source_word: גוֹיִם
  choice: les nations
  rationale: Dans ce contexte prophétique, le terme désigne collectivement les nations étrangères. « Les nations » est précis et n’introduit pas une terminologie propre au Nouveau Testament.
- source_word: וְיָדַעַתְּ
  choice: et tu sauras
  rationale: Le parfait dans ce discours prophétique a une valeur future ou résultative. « Tu sauras » exprime naturellement cette force.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel du texte hébreu au lieu de lui substituer un titre.
theological_decisions:
- issue: Sens de חלל dans ce verset
  choice: profanation judiciaire et cultuelle de Jérusalem devant les nations
  alternative: perte d’héritage ou simple déshonneur public
  rationale: Le contexte immédiat d’impureté, de honte et de jugement, ainsi que le vocabulaire caractéristique d’Ézéchiel sur le sacré et le profane, favorisent ce sens sans réduire le terme à une simple atteinte à la réputation.
- issue: Rapport de בָּךְ à la profanation
  choice: la profanation se produit par Jérusalem elle-même
  alternative: la profanation demeure en Jérusalem, « en toi-même »
  rationale: « Par toi-même » donne une lecture française intelligible de la construction, tandis que la note conserve l’ambiguïté de la préposition hébraïque et les autres nuances possibles.
translation_notes:
  register: Français moderne, digne et direct. Le féminin singulier indique que la parole s’adresse à Jérusalem. « Sous les yeux des nations » conserve l’image publique de l’hébreu.
