  text: וְ/אִ֣ישׁ אֶת אֵ֣שֶׁת רֵעֵ֗/הוּ עָשָׂה֙ תּֽוֹעֵבָ֔ה וְ/אִ֥ישׁ אֶת כַּלָּת֖/וֹ טִמֵּ֣א בְ/זִמָּ֑ה וְ/אִ֛ישׁ אֶת אֲחֹת֥/וֹ בַת אָבִ֖י/ו עִנָּה בָֽ/ךְ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/011.yaml
  text: One man commits an abomination with his neighbor’s wife[a], another defiles his daughter-in-law with lewdness, and another violates his sister, his father’s daughter[c][b], within you.
translation:
  language: fr
  text: L’un commet une abomination avec la femme de son prochain[a] ; un autre souille sa belle-fille par une conduite sexuelle honteuse[b] ; un autre encore fait violence[c] à sa sœur, fille de son père, au milieu de toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fait une abomination avec ». Il s’agit ici d’un acte sexuel adultère tenu pour abominable.'
    reason: lexical_alternative
  - marker: b
    text: '« Belle-fille » désigne ici la femme de son fils. On pourrait aussi traduire la fin de la proposition par : « dans la dépravation sexuelle ».'
    reason: lexical_clarification
  - marker: c
    text: 'Ou : « humilie » ou « viole ». Dans ce contexte sexuel, le verbe hébreu peut exprimer une violation accompagnée d’humiliation ou de mauvais traitements.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: l’un… un autre… un autre encore
  rationale: La répétition de אִישׁ énumère des coupables distincts. Cette tournure restitue clairement la structure en français naturel.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: la femme de son prochain
  rationale: רֵעַ désigne un prochain, un compagnon ou un semblable. « Son prochain » convient au registre biblique moderne sans limiter le sens au seul voisinage géographique.
- source_word: עָשָׂה תּוֹעֵבָה
  choice: commet une abomination avec
  rationale: La formulation conserve le poids moral de תּוֹעֵבָה et l’association avec la femme concernée, sans expliciter au-delà de l’hébreu la nature précise de l’acte.
- source_word: כַּלָּתוֹ
  choice: sa belle-fille
  rationale: Le terme désigne ici la femme du fils. « Belle-fille » est l’équivalent français usuel, malgré sa possible ambiguïté dans l’usage moderne.
- source_word: טִמֵּא
  choice: souille
  rationale: Dans ce contexte sexuel, le verbe exprime à la fois l’impureté et la dégradation morale. « Souille » préserve cette double portée.
- source_word: בְּזִמָּה
  choice: par une conduite sexuelle honteuse
  rationale: זִמָּה désigne ici une conduite sexuelle infâme ou dépravée. Cette formulation rend explicite la portée sexuelle imposée par le contexte tout en évitant un terme français vieilli.
- source_word: אֲחֹתוֹ בַת־אָבִיו
  choice: sa sœur, la fille de son père
  rationale: La formulation appositive reproduit la précision familiale et juridique de l’hébreu sans décider s’il s’agit nécessairement d’une demi-sœur.
- source_word: עִנָּה
  choice: fait violence à
  rationale: Dans un contexte sexuel, ענה peut associer violation, humiliation et mauvais traitement. « Fait violence à » maintient cette gravité et une certaine latitude sémantique, sans imposer exclusivement le sens juridique moderne de « violer ».
- source_word: בָּךְ
  choice: Voilà ce qui se passe chez toi
  rationale: Le pronom féminin singulier s’adresse à Jérusalem personnifiée. Placée en conclusion, cette formulation naturelle conserve l’adresse directe à la ville et l’idée d’actes commis en son sein.
theological_decisions:
- issue: Force morale des désignations des offenses sexuelles
  choice: 'Conserver des termes fortement accusateurs : « abomination », « souille », « conduite sexuelle honteuse » et « fait violence à ».'
  alternative: Employer des expressions atténuées comme « a des relations avec » ou « se conduit mal avec ».
  rationale: Le passage dénonce une grave corruption morale et sociale. Le vocabulaire hébreu porte un jugement sévère, qui ne doit pas être neutralisé.
- issue: Portée de עִנָּה dans la dernière proposition
  choice: Rendre le verbe par « fait violence à », qui laisse entendre la violation et l’humiliation sans réduire le terme à une seule modalité précise.
  alternative: Traduire par « viole », « humilie » ou « abuse de ».
  rationale: Le verbe peut, dans un contexte sexuel, évoquer une atteinte abusive et dégradante. La traduction retenue préserve cette tension sémantique.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe ternaire rend l’énumération des coupables. « Son prochain » garde une légère coloration biblique encore intelligible ; les formulations plus archaïques ou inutilement techniques ont été évitées.
