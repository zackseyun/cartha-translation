  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֛עַן הֱי֥וֹת כֻּלְּ/כֶ֖ם לְ/סִגִ֑ים לָ/כֵן֙ הִנְ/נִ֣י קֹבֵ֣ץ אֶתְ/כֶ֔ם אֶל תּ֖וֹךְ יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/019.yaml
  text: 'Therefore thus says the Lord GOD: Because all of you have become dross[a], therefore behold, I am gathering you into the midst of Jerusalem.'
translation:
  language: fr
  text: 'C’est pourquoi, ainsi parle le Seigneur Yahweh : Puisque vous êtes tous devenus des scories[a], voici que je vais vous rassembler au milieu de Jérusalem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « résidus métalliques » ou « impuretés ». Le mot hébreu désigne les scories ou autres matières sans valeur associées au métal lors de sa fusion ou de son affinage.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן כֹּה אָמַר
  choice: C’est pourquoi, ainsi parle
  rationale: Conserve la formule prophétique et le lien conclusif exprimé par לָכֵן dans un français digne et naturel.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה, sans produire l’expression redondante « le Seigneur SEIGNEUR ».
- source_word: יַעַן הֱיוֹת כֻּלְּכֶם
  choice: Puisque vous êtes tous devenus
  rationale: Exprime la cause introduite par יַעַן, l’état résultant de היה et la totalité explicite du groupe.
- source_word: לְסִגִים
  choice: des scories
  rationale: Dans la métaphore métallurgique du contexte, « scories » désigne clairement les matières impures ou résiduelles séparées du métal lors de la fonte.
- source_word: הִנְנִי קֹבֵץ
  choice: 'me voici : je vous rassemble'
  rationale: « Me voici » préserve l’emphase de הִנְנִי, tandis que le présent rend la force vive et imminente du participe קֹבֵץ.
- source_word: אֶל תּוֹךְ יְרוּשָׁלִָם
  choice: au cœur de Jérusalem
  rationale: Rend l’idée d’entrée dans l’intérieur de la ville portée par אֶל תּוֹךְ, avec une tournure française naturelle.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte hébreu associe le titre אֲדֹנָי au nom propre יהוה. « Le Seigneur Yahweh » maintient les deux éléments et rend visible le nom divin sans imposer une lecture confessionnelle supplémentaire.
- issue: Valeur temporelle de הִנְנִי קֹבֵץ
  choice: 'me voici : je vous rassemble'
  alternative: voici que je vais vous rassembler
  rationale: Le participe avec הִנְנִי présente l’action comme vive, certaine et imminente. Le présent français conserve cette tension sans la réduire à un simple futur.
translation_notes:
  register: Français international moderne, solennel mais accessible. La répétition logique de « C’est pourquoi » et « Puisque » reflète les deux connecteurs hébreux sans alourdir excessivement la phrase. « Au cœur de Jérusalem » conserve l’image spatiale de l’intérieur de la ville.
