  text: אַנְשֵׁ֥י רָכִ֛יל הָ֥יוּ בָ֖/ךְ לְמַ֣עַן שְׁפָךְ דָּ֑ם וְ/אֶל הֶֽ/הָרִים֙ אָ֣כְלוּ בָ֔/ךְ זִמָּ֖ה עָשׂ֥וּ בְ/תוֹכֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/009.yaml
  text: Men of slander were in you in order to shed blood[a]; and on the mountains they ate[c][b]; they committed lewdness in your midst.
translation:
  language: fr
  text: Il y avait chez toi des hommes qui colportaient des accusations afin de faire couler le sang[a]. Chez toi, ils mangeaient sur les montagnes[b] et commettaient des actes infâmes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque peut aussi désigner des calomniateurs, des médisants ou des informateurs qui font circuler des accusations.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit vraisemblablement de repas pris sur les hauts lieux et associés à un culte idolâtre.
    reason: cultural_note
  - marker: c
    text: Le terme hébreu peut aussi se traduire par « conduite scandaleuse » ou « dépravation sexuelle »; il désigne souvent un acte honteux à caractère sexuel.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי רָכִיל
  choice: des hommes qui colportent des accusations
  rationale: רָכִיל évoque le fait de faire circuler des propos accusateurs ou diffamatoires. Cette formulation naturelle conserve ici le lien possible avec une violence judiciaire ou meurtrière, sans réduire le terme à la seule médisance.
- source_word: לְמַעַן שְׁפָךְ דָּם
  choice: afin de faire couler le sang
  rationale: « Afin de » rend la valeur de but de לְמַעַן, tandis que l’expression concrète « faire couler le sang » conserve l’image hébraïque de la violence homicide.
- source_word: וְאֶל הֶהָרִים אָכְלוּ
  choice: on mange sur les montagnes
  rationale: La traduction maintient l’image explicite du texte hébreu sans introduire directement dans le corps du verset l’interprétation cultuelle probable des repas pris sur les hauts lieux.
- source_word: זִמָּה
  choice: des actes infâmes
  rationale: זִמָּה peut désigner une conduite honteuse ou scandaleuse, souvent de nature sexuelle. « Actes infâmes » préserve cette gravité et une certaine amplitude sémantique.
- source_word: עָשׂוּ בְתוֹכֵךְ
  choice: chez toi … l’on commet
  rationale: Cette tournure française rend idiomatiquement l’action commise au sein de Jérusalem tout en conservant l’adresse personnifiée à la ville.
theological_decisions:
- issue: Nature des repas pris sur les montagnes
  choice: Conserver dans le texte l’expression concrète « mange sur les montagnes » et préciser sa portée probable en note.
  alternative: Traduire directement par « participe à des repas idolâtres sur les hauts lieux ».
  rationale: Le contexte prophétique suggère fortement des repas liés aux sanctuaires illégitimes, mais le texte hébreu ne nomme pas explicitement l’idolâtrie dans ce membre de phrase.
- issue: Portée de זִמָּה
  choice: Employer une expression morale large, « actes infâmes », avec une note signalant la fréquente connotation sexuelle.
  alternative: Traduire explicitement par « débauche sexuelle ».
  rationale: Le terme possède souvent une dimension sexuelle, mais peut plus largement exprimer une conduite scandaleuse ou un outrage moral; la traduction évite donc de supprimer cette ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement conserve l’adresse prophétique à Jérusalem personnifiée. Le passage au pronom indéfini « on » dans la seconde phrase évite d’imposer avec certitude que les mêmes hommes accomplissent tous les actes, tout en rendant naturellement les pluriels indéfinis de l’hébreu.
