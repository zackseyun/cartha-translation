language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בֶּן אָדָ֕ם הָיוּ לִ֥/י בֵֽית יִשְׂרָאֵ֖ל ל/סוג כֻּלָּ֡/ם נְ֠חֹשֶׁת וּ/בְדִ֨יל וּ/בַרְזֶ֤ל וְ/עוֹפֶ֨רֶת֙ בְּ/ת֣וֹךְ כּ֔וּר סִגִ֥ים כֶּ֖סֶף הָיֽוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/018.yaml
  text: Son of man[a], the house of Israel has become dross to me; all of them are bronze and tin and iron and lead in the midst of a furnace; they are the dross of silver.
translation:
  language: fr
  text: 'Fils d’homme, la maison d’Israël est devenue pour moi comme des scories : ils sont tous du cuivre[a], de l’étain, du fer et du plomb au milieu d’un fourneau ; ils sont les scories de l’argent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bronze ».
    reason: Le nom hébreu נְחֹשֶׁת peut désigner le cuivre ou le bronze.
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Formule d’adresse caractéristique du livre d’Ézéchiel, conservée sous sa forme française traditionnelle et immédiatement compréhensible.
- source_word: הָיוּ לִי
  choice: est devenue pour moi
  rationale: Exprime l’état résultant et maintient explicitement le point de vue du locuteur divin. Le singulier suit « la maison d’Israël », collectif grammaticalement singulier en français.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Conserve l’expression collective et relationnelle de l’hébreu plutôt que de la réduire au seul nom « Israël ».
- source_word: לְסוּג
  choice: comme des scories
  rationale: « Scories » rend le résidu sans valeur issu du travail des métaux. « Comme » donne en français une construction naturelle tout en préservant l’image métallurgique.
- source_word: כֻּלָּם
  choice: ils sont tous
  rationale: Rend la portée distributive du pronom et renvoie aux membres de la maison d’Israël.
- source_word: נְחֹשֶׁת
  choice: cuivre
  rationale: Le terme peut désigner le cuivre ou le bronze. « Cuivre » est retenu dans le texte, tandis que l’autre possibilité est signalée en note.
- source_word: בְדִיל
  choice: étain
  rationale: Équivalent français usuel du métal nommé dans ce contexte de métallurgie.
- source_word: בַרְזֶל
  choice: fer
  rationale: Équivalent lexical direct.
- source_word: עוֹפֶרֶת
  choice: plomb
  rationale: Équivalent lexical direct.
- source_word: בְּתוֹךְ כּוּר
  choice: au milieu d’un fourneau
  rationale: Conserve בְּתוֹךְ et rend כּוּר comme un fourneau destiné à la fusion des métaux.
- source_word: סִגִים כֶּסֶף
  choice: les scories de l’argent
  rationale: Reproduit le rapport construit de l’hébreu et souligne qu’Israël est assimilé non au métal précieux, mais à ce qui en est séparé comme déchet.
theological_decisions:
- issue: Rapport au locuteur divin exprimé par לִי
  choice: Maintien de « pour moi »
  alternative: « à mes yeux » ou « devant moi »
  rationale: L’hébreu marque simplement la relation évaluative du peuple au locuteur divin ; la formulation retenue n’ajoute ni motif ni développement doctrinal.
- issue: Image métallurgique du jugement
  choice: Conservation littérale des métaux, du fourneau et des scories
  alternative: Paraphrase générale portant sur la corruption morale
  rationale: La force théologique du verset réside dans l’image prophétique elle-même. La conserver évite d’en réduire ou d’en préciser indûment l’interprétation.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La ponctuation maintient en une seule phrase le développement de la métaphore. Le marqueur [a] est placé après le mot concerné, « cuivre ».
