  variant: modern international French
source:
  edition: WLC
  text: וַ/הֲפִיצוֹתִ֤י אוֹתָ/ךְ֙ בַּ/גּוֹיִ֔ם וְ/זֵרִיתִ֖י/ךְ בָּ/אֲרָצ֑וֹת וַ/הֲתִמֹּתִ֥י טֻמְאָתֵ֖/ךְ מִמֵּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/015.yaml
  text: I will scatter you among the nations and disperse you through the lands[a], and I will purge your uncleanness from you.
translation:
  language: fr
  text: Je te disperserai parmi les nations, je t’éparpillerai dans les pays, et je te débarrasserai de ton impureté.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je ferai disparaître ton impureté » ou « je mettrai fin à ton impureté ».
    reason: La forme causative de תמם peut signifier faire cesser ou éliminer; ces formulations rendent des nuances possibles sans trancher davantage la portée de l’impureté.
lexical_decisions:
- source_word: וַהֲפִיצוֹתִי
  choice: Je te disperserai
  rationale: Le verbe exprime ici la dispersion causée par le jugement et l’exil. « Disperser » est naturel en français et convient à ce contexte.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: גּוֹיִם désigne les nations étrangères au milieu desquelles les habitants de Jérusalem seront exilés. « Nations » reste précis et sans surcharge confessionnelle.
- source_word: וְזֵרִיתִיךְ
  choice: et te répandrai
  rationale: זרה peut évoquer l’action d’éparpiller ou de vanner. « Répandre » conserve le parallélisme avec le premier verbe sans répétition pesante.
- source_word: בָּאֲרָצוֹת
  choice: dans les pays
  rationale: Le pluriel אֲרָצוֹת désigne ici les différents pays où aura lieu la dispersion. « Dans les pays » est idiomatique en français moderne.
- source_word: וַהֲתִמֹּתִי
  choice: et j’ôterai complètement
  rationale: La forme causative de תמם exprime l’idée de faire cesser, d’éliminer ou de mener à son terme. Cette formulation rend explicitement l’élimination tout en conservant la valeur d’achèvement.
- source_word: טֻמְאָתֵךְ
  choice: ton impureté
  rationale: טֻמְאָה peut avoir des dimensions rituelles, morales et métaphoriques. « Impureté » garde cette amplitude en français biblique actuel.
- source_word: מִמֵּךְ
  choice: de toi
  rationale: La préposition indique que l’impureté est retirée de la personne collective à laquelle Dieu s’adresse.
theological_decisions:
- issue: Nature de la purification accomplie par le jugement
  choice: Le jugement et la dispersion ôtent l’impureté de Jérusalem, sans préciser si celle-ci est surtout morale, rituelle ou métaphorique.
  alternative: Je mettrai fin à ton impureté en toi.
  rationale: Le texte associe étroitement châtiment et élimination de l’impureté. La traduction conserve cette tension sans définir plus étroitement la nature de la purification.
translation_notes:
  register: Français international moderne, clair et digne. Le féminin singulier de l’hébreu, qui s’adresse à Jérusalem personnifiée, est rendu par le pronom français « te », sans explicitation ajoutée. Le parallélisme des deux verbes de dispersion est conservé.
