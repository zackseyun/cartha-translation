source:
  edition: WLC
  text: שֹׁ֥חַד לָֽקְחוּ בָ֖/ךְ לְמַ֣עַן שְׁפָךְ דָּ֑ם נֶ֧שֶׁךְ וְ/תַרְבִּ֣ית לָקַ֗חַתְּ וַ/תְּבַצְּעִ֤י רֵעַ֨יִ/ךְ֙ בַּ/עֹ֔שֶׁק וְ/אֹתִ֣/י שָׁכַ֔חַתְּ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/012.yaml
  text: In you they have taken bribes to shed blood; you have taken interest and profit[a], and you have extorted your neighbors by oppression, and you have forgotten me, declares the Lord GOD.
translation:
  language: fr
  text: Chez toi, on a accepté des pots-de-vin pour verser le sang. Tu as prélevé des intérêts et réalisé des profits[a] ; tu as exploité tes prochains par l’oppression. Et moi, tu m’as oublié — déclare le Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « des intérêts et un accroissement ». L’hébreu emploie deux termes apparentés pour le gain tiré d’un prêt : נֶשֶׁךְ (« intérêts ») et תַרְבִּית (« accroissement, profit »).'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד לָקְחוּ בָךְ
  choice: Chez toi, on a accepté des pots-de-vin
  rationale: « Chez toi » conserve l’adresse à Jérusalem personnifiée, tandis que « on » rend naturellement le verbe hébreu au pluriel, qui vise les habitants de la ville. Le pluriel « pots-de-vin » exprime la portée collective de l’accusation.
- source_word: לְמַעַן שְׁפָךְ דָּם
  choice: pour répandre le sang
  rationale: La construction exprime le but. « Répandre le sang » garde l’image hébraïque et sa gravité, notamment dans un contexte de meurtre ou de condamnation obtenue par corruption.
- source_word: נֶשֶׁךְ
  choice: intérêts
  rationale: Le mot désigne les intérêts perçus sur un prêt. « Intérêts » est immédiatement compréhensible en français moderne sans limiter le sens aux seuls taux excessifs, comme pourrait le faire « usure ».
- source_word: תַרְבִּית
  choice: profits
  rationale: Associé à נֶשֶׁךְ, le terme évoque l’accroissement ou le gain retiré d’un prêt. « Profits » distingue ce second terme des « intérêts » tout en faisant ressortir le gain financier illicite dans ce contexte.
- source_word: וַתְּבַצְּעִי רֵעַיִךְ בַּעֹשֶׁק
  choice: tu as exploité tes prochains par l’oppression
  rationale: Le verbe évoque ici le gain injuste et cupide. « Exploité » convient au complément humain sans ajouter un objet absent de l’hébreu ; « par l’oppression » conserve le moyen explicitement indiqué.
- source_word: רֵעַיִךְ
  choice: tes prochains
  rationale: Le terme vise les autres membres de la communauté. « Prochains » exprime la proximité sociale et s’accorde avec le registre éthique du passage.
- source_word: וְאֹתִי שָׁכַחַתְּ
  choice: Et moi, tu m’as oublié
  rationale: La dislocation française de « moi » reproduit l’emphase portée par אֹתִי et fait ressortir le point culminant de l’accusation.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclare le Seigneur Yahweh
  rationale: « Déclare » rend naturellement la formule prophétique נְאֻם. « Seigneur Yahweh » distingue le titre אֲדֹנָי du nom divin יְהוִה.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: La traduction conserve à la fois le titre אֲדֹנָי (« Seigneur ») et le nom personnel יְהוִה (« Yahweh »), sans les fusionner ni masquer la présence du nom divin.
- issue: Lien entre l’oubli de Dieu et les injustices précédentes
  choice: 'Conserver la simple coordination : « Et moi, tu m’as oublié »'
  alternative: Expliciter que l’oubli de Dieu est la cause des injustices
  rationale: Le texte place cette accusation au point culminant, mais n’énonce pas explicitement un rapport causal. La traduction préserve cette force théologique sans ajouter d’interprétation.
translation_notes:
  register: 'Français international moderne, direct et solennel. Le passage de « on » à « tu » reproduit le changement de nombre dans l’hébreu : les habitants commettent les actes au sein de Jérusalem, puis la ville personnifiée est directement accusée. Le passé composé présente ces actes comme accomplis et constitutifs de l’acte d’accusation prophétique.'
