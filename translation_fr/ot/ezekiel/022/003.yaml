  text: וְ/אָמַרְתָּ֗ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה עִ֣יר שֹׁפֶ֥כֶת דָּ֛ם בְּ/תוֹכָ֖/הּ לָ/ב֣וֹא עִתָּ֑/הּ וְ/עָשְׂתָ֧ה גִלּוּלִ֛ים עָלֶ֖י/הָ לְ/טָמְאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/003.yaml
  text: 'And say, ‘Thus says the Lord GOD: O city that sheds blood in her midst, so that her time may come, and that makes idols against herself to defile herself!’'
translation:
  language: fr
  text: 'Tu diras : « Ainsi parle le Seigneur DIEU : Ô ville qui répands le sang en ton sein, pour faire venir ton heure, et qui fabriques des idoles contre toi-même, pour te rendre impure ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִיר שֹׁפֶכֶת דָּם
  choice: Ô ville qui répands le sang
  rationale: Le participe féminin décrit directement la ville comme versant le sang. Le vocatif « Ô ville » rend explicite l’adresse portée par le contexte et conserve le ton solennel de l’oracle.
- source_word: בְּתוֹכָהּ
  choice: en ton sein
  rationale: Cette expression rend le sens spatial de « au milieu d’elle » tout en maintenant l’adresse directe à la ville.
- source_word: לָבוֹא עִתָּהּ
  choice: faisant ainsi venir ton heure
  rationale: La construction indique que l’effusion de sang fait arriver le temps fixé de la ville, ici son heure de jugement, sans préciser davantage ce que le texte laisse implicite.
- source_word: גִלּוּלִים
  choice: idoles
  rationale: Terme français courant et clair pour les objets cultuels condamnés, même si le mot hébreu porte une nuance fortement méprisante.
- source_word: לְטָמְאָה
  choice: pour te rendre impure
  rationale: Conserve la notion cultuelle et morale d’impureté ainsi que la valeur finale ou résultative de l’infinitif hébreu.
theological_decisions:
- issue: Nature de « ton heure »
  choice: Ne pas expliciter « heure du jugement » dans le texte principal
  alternative: « faisant venir l’heure de ton jugement »
  rationale: Le contexte suggère le jugement, mais l’hébreu dit seulement « son heure/son temps ». La traduction préserve cette retenue.
- issue: Rapport des idoles à la ville
  choice: « à ton propre détriment » avec note
  alternative: « sur ton territoire » ou « contre toi-même »
  rationale: La préposition עַל avec le suffixe féminin peut exprimer une action pesant sur la ville ou tournée contre elle. Le choix français exprime l’effet autodestructeur sans exclure entièrement la nuance locale, signalée en note.
translation_notes:
  register: Français moderne, solennel et direct. Le tutoiement suit l’apostrophe prophétique adressée à la ville personnifiée. « Seigneur DIEU » distingue le titre אֲדֹנָי du nom divin יהוה selon une convention typographique transparente.
