revisions:
- from: 'Tu diras : « Ainsi parle le Seigneur DIEU : Ô ville qui répands le sang en ton sein, faisant ainsi venir ton heure, et qui fabriques des idoles à ton propre détriment[a], pour te rendre impure ! »'
  to: 'Tu diras : « Ainsi parle le Seigneur DIEU : Ô ville qui répands le sang en ton sein, pour faire venir ton heure, et qui fabriques des idoles contre toi-même, pour te rendre impure ! »'
  rationale: La révision supprime l’adverbe non exprimé « ainsi » et rend plus directement la construction infinitive « pour faire venir ton heure ». Elle conserve une formulation française naturelle et le caractère volontairement non explicité de « ton heure ». La relation ambiguë des idoles à la ville est rendue par « contre toi-même » et documentée par une note élargie.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:59:39Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : l’adresse à la ville, le sang versé « en son sein », l’arrivée de son temps et l’impureté liée aux idoles sont conservés. Toutefois, « ainsi » n’est pas exprimé par l’hébreu ; l’infinitif לָבוֹא marque directement le but ou l’aboutissement (« pour faire venir »).'
  naturalness: Le registre est moderne et solennel. La révision resserre la syntaxe et évite l’ajout causal de « ainsi », tout en gardant le tutoiement de la ville personnifiée.
  terminology: « Seigneur DIEU », « idoles » et « impure » conviennent. « Contre toi-même » reproduit plus directement la valeur préjudiciable/adversative possible de עָלֶיהָ ; la note maintient les autres lectures possibles.
  issues:
  - severity: low
    issue: Ajout de « ainsi » dans « faisant ainsi venir ton heure »
    rationale: Le texte hébreu dit littéralement « pour faire venir son temps » et ne contient pas d’adverbe équivalent à « ainsi ». L’infinitif doit être rendu sans renforcer explicitement le lien causal.
  - severity: low
    issue: La note peut exprimer plus exactement l’ambiguïté de עָלֶיהָ
    rationale: La préposition peut avoir une nuance « contre/au détriment de », mais une compréhension locale (« sur elle », donc dans la ville) reste possible. La note révisée le signale sans présenter une lecture comme certaine.
  revised_text: 'Tu diras : « Ainsi parle le Seigneur DIEU : Ô ville qui répands le sang en ton sein, pour faire venir ton heure, et qui fabriques des idoles contre toi-même, pour te rendre impure ! »'
  revised_footnotes:
