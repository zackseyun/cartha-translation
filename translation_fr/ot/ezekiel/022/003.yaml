    text: 'Littéralement : « contre toi » ou « sur toi ». L’expression peut aussi être comprise dans un sens local (« sur ton territoire ») ; elle peut évoquer des idoles faites au détriment de la ville.'
    reason: 'Le rapport exact exprimé par עָלֶיהָ est ambigu : il peut être adversatif ou préjudiciable, et possiblement local.'
