source:
  edition: WLC
  text: וּ/נְבִיאֶ֗י/הָ טָח֤וּ לָ/הֶם֙ תָּפֵ֔ל חֹזִ֣ים שָׁ֔וְא וְ/קֹסְמִ֥ים לָ/הֶ֖ם כָּזָ֑ב אֹמְרִ֗ים כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וַֽ/יהוָ֖ה לֹ֥א דִבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/028.yaml
  text: And her prophets have plastered for them with whitewash[a], seeing falsehood and divining lies for them, saying[b], ‘Thus says the Lord GOD,’ when Yahweh has not spoken.
translation:
  language: fr
  text: 'Ses prophètes ont, pour eux, appliqué du badigeon[a], voyant des faussetés et pratiquant pour eux des divinations mensongères. Ils disent : « Ainsi parle le Seigneur Yahweh[b] », alors que Yahweh n’a pas parlé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un enduit sans consistance ». L’image hébraïque évoque une couche superficielle qui dissimule les défauts.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « le Seigneur Yahweh » (אֲדֹנָי יְהוִה). Yahweh représente le nom divin יהוה.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְבִיאֶיהָ
  choice: Ses prophètes
  rationale: Le suffixe féminin singulier renvoie à la ville évoquée dans le contexte. « Ses prophètes » est naturel en français.
- source_word: טָחוּ לָהֶם תָּפֵל
  choice: passent pour eux une couche de badigeon
  rationale: La formulation conserve l’image concrète d’un enduit superficiel qui masque les défauts, tout en restant intelligible en français moderne.
- source_word: חֹזִים שָׁוְא
  choice: ils ont des visions trompeuses
  rationale: Le participe renvoie à l’activité visionnaire des prophètes, et שָׁוְא désigne ici ce qui est faux, vain ou trompeur.
- source_word: וְקֹסְמִים לָהֶם כָּזָב
  choice: et leur prédisent des mensonges
  rationale: קֹסְמִים désigne la divination. « Prédire » rend naturellement l’activité en contexte, tandis que « des mensonges » préserve la force de כָּזָב.
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique consacrée, digne et immédiatement compréhensible en français.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Cette traduction distingue אֲדֹנָי, « Seigneur », du nom divin יהוה et évite l’expression artificielle « Seigneur SEIGNEUR ».
- source_word: וַיהוָה לֹא דִבֵּר
  choice: alors que Yahweh n’a pas parlé
  rationale: La proposition marque le contraste entre leur revendication et la réalité; le passé composé exprime naturellement en français l’absence de parole divine validant leur message.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel / le SEIGNEUR
  rationale: « Yahweh » représente directement le nom propre dans les deux occurrences et permet de préserver la distinction au sein du titre אֲדֹנָי יְהוִה.
- issue: Nature des déclarations prophétiques
  choice: visions trompeuses et prédictions mensongères
  alternative: visions vaines et divinations mensongères
  rationale: Le texte condamne explicitement leur prétention à parler de la part de Dieu sans trancher au-delà de ce qu’il affirme sur le mécanisme ou l’origine de leurs expériences.
translation_notes:
  register: Français international moderne, digne et lisible. La ponctuation explicite le lien entre l’image du badigeon et les actes prophétiques qui la développent. Le vocabulaire concret préserve la métaphore d’Ézéchiel sans recourir au terme technique et peu transparent « mortier non détrempé ».
