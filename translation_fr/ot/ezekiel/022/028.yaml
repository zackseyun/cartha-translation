revisions:
- from: 'Ses prophètes passent pour eux une couche de badigeon[a] : ils ont des visions trompeuses et leur prédisent des mensonges. Ils disent : « Ainsi parle le Seigneur Yahweh[b] », alors que Yahweh n’a pas parlé.'
  to: 'Ses prophètes ont, pour eux, appliqué du badigeon[a], voyant des faussetés et pratiquant pour eux des divinations mensongères. Ils disent : « Ainsi parle le Seigneur Yahweh[b] », alors que Yahweh n’a pas parlé.'
  rationale: La révision rend le parfait de טָחוּ par un passé composé, conserve la valeur de référence ou d’avantage de לָהֶם par « pour eux », et traduit explicitement קֹסְמִים par « pratiquant ... des divinations ». Elle maintient l’ambiguïté du texte quant aux bénéficiaires précis de l’action et n’explicite pas davantage la métaphore du badigeon.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:59:42Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu, y compris l’image du revêtement trompeur, le titre divin et le contraste final. Toutefois, le présent « passent » ne reflète pas le parfait hébreu, et « prédisent des mensonges » atténue la notion spécifique de divination (קֹסְמִים).
  naturalness: Le français est globalement clair et d’un registre approprié. « Ont appliqué du badigeon » est plus idiomatique que « passent ... une couche de badigeon » tout en évitant d’ajouter un objet absent de l’hébreu.
  terminology: « Yahweh » est employé de façon cohérente pour יהוה, et « le Seigneur Yahweh » distingue correctement אֲדֹנָי de יהוה. « Divinations mensongères » préserve la terminologie de l’activité divinatoire sans lui prêter une origine ou un mécanisme non exprimé par le texte.
  issues:
  - severity: medium
    issue: Le verbe principal est au présent (« passent »).
    rationale: טָחוּ est un parfait. En français narratif et accusateur du contexte, le passé composé (« ont appliqué ») rend plus exactement l’action imputée aux prophètes.
  - severity: medium
    issue: « Leur prédisent des mensonges » ne rend pas explicitement la divination.
    rationale: קֹסְמִים désigne l’exercice de la divination, non simplement l’annonce ou la prédiction. Une formulation avec « pratiquer des divinations » conserve cette distinction.
  - severity: low
    issue: « Une couche de badigeon » est un peu lourd après « passent ».
    rationale: « Appliquer du badigeon » est plus fluide en français moderne et garde l’image d’un enduit superficiel.
