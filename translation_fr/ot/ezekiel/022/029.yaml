source:
  edition: WLC
  text: עַ֤ם הָ/אָ֨רֶץ֙ עָ֣שְׁקוּ עֹ֔שֶׁק וְ/גָזְל֖וּ גָּזֵ֑ל וְ/עָנִ֤י וְ/אֶבְיוֹן֙ הוֹנ֔וּ וְ/אֶת הַ/גֵּ֥ר עָשְׁק֖וּ בְּ/לֹ֥א מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/029.yaml
  text: The people of the land have practiced oppression and committed robbery; they have mistreated the poor and needy[a], and they have oppressed the foreigner without justice.
translation:
  language: fr
  text: Le peuple du pays s’est livré à l’oppression et a commis des vols. Il a maltraité le pauvre et l’indigent, et il a opprimé l’étranger[a] sans justice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’immigré », « l’étranger résident » ou « l’étranger établi parmi eux ». Le terme hébreu désigne une personne d’origine étrangère qui réside au sein de la population.
    reason: Précision lexicale sur le statut du גֵּר.
lexical_decisions:
- source_word: עַם הָאָרֶץ
  choice: le peuple du pays
  rationale: Cette formulation directe conserve l’expression hébraïque et désigne ici largement la population du pays, sans la réduire à une classe sociale particulière.
- source_word: עָשְׁקוּ עֹשֶׁק
  choice: s’est livré à l’oppression
  rationale: La tournure idiomatique française rend la construction intensive verbe-nom et son caractère habituel, sans reproduire lourdement la répétition hébraïque.
- source_word: וְגָזְלוּ גָּזֵל
  choice: et a commis des vols
  rationale: Cette expression naturelle rend la seconde construction verbe-nom et maintient le caractère concret et criminel de l’action.
- source_word: וְעָנִי וְאֶבְיוֹן
  choice: le pauvre et l’indigent
  rationale: Le singulier collectif de l’hébreu est conservé, ainsi que les deux catégories apparentées de personnes socialement vulnérables.
- source_word: הוֹנוּ
  choice: a maltraité
  rationale: Le verbe exprime un traitement abusif ou préjudiciable. « Maltraiter » garde cette portée assez large sans le confondre avec le verbe rendu par « opprimer ».
- source_word: הַגֵּר
  choice: l’étranger résident
  rationale: Le terme désigne une personne d’origine étrangère établie parmi la population. Cette formulation est plus précise que « étranger » seul et moins administrative que « résident étranger ».
- source_word: עָשְׁקוּ
  choice: a opprimé
  rationale: Le verbe exprime ici directement l’oppression ou l’exploitation et maintient le lien lexical avec la première accusation.
- source_word: בְּלֹא מִשְׁפָּט
  choice: au mépris de la justice
  rationale: Cette tournure conserve le poids du nom מִשְׁפָּט, qui évoque à la fois la justice, le droit et l’ordre juste, plutôt que de le réduire au seul adverbe « injustement ».
theological_decisions:
- issue: Terminologie sociale et éthique de l’accusation prophétique
  choice: 'Conserver les formes concrètes d’injustice : oppression, vol, mauvais traitements et déni de justice envers l’étranger résident.'
  alternative: Employer des termes moraux généraux tels que « faire le mal » ou « agir avec méchanceté ».
  rationale: 'Le texte ne formule pas une condamnation vague : il nomme des atteintes précises aux personnes pauvres, indigentes et étrangères. La traduction garde donc la force sociale et judiciaire de l’accusation sans lui ajouter une interprétation confessionnelle.'
translation_notes:
  register: Français international moderne, clair et digne. Les passés composés rendent l’accusation récapitulative du contexte, tandis que le vocabulaire concret conserve la vigueur de la dénonciation prophétique. Le marqueur de note est placé après le terme qu’il explique.
