review_pass:
  verdict: revise
  source_fidelity: 'Le texte hébreu porte : « Voici, les princes d’Israël, chacun selon son bras, ont été en toi pour verser du sang. » La formulation proposée rend bien l’interpellation, les princes, la force figurée du « bras » et le but. Cependant, « qui sont chez toi » transforme le parfait hébreu היו en présent relatif et « chacun use de sa force » explicite une action instrumentale qui n’est pas formulée ainsi. Une formulation au passé, conservant « chacun selon sa force », est plus proche sans être maladroite.'
  naturalness: « Voici les princes d’Israël qui sont chez toi » est compréhensible, mais le présent est moins cohérent dans une dénonciation rappelant leurs agissements. « Chez toi » est naturel pour l’adresse personnifiée à Jérusalem. « Chacun selon sa force » est idiomatique et évite l’affirmation plus interprétative « use de sa force ».
  terminology: '« Princes d’Israël » convient à נשיאי ישראל dans ce registre prophétique. « Verser le sang » préserve l’image concrète de שפך דם et reste naturel en français. La note doit correspondre exactement au choix français : « selon sa force » rend l’idiome hébreu « selon son bras ».'
  issues:
