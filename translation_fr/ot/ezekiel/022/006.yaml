    issue: Temps verbal de « qui sont chez toi »
    rationale: הָיוּ est un parfait pluriel ; le présent français ne reflète pas directement la forme source. Le passé composé permet de conserver l’idée d’une présence/agence attestée dans Jérusalem tout en restant naturel.
  - severity: medium
    issue: « chacun use de sa force » ajoute une relation instrumentale explicite
    rationale: L’hébreu dit littéralement « chacun selon son bras » et rattache l’ensemble à la finalité de verser du sang. « Use de sa force » peut suggérer que la force est spécifiquement le moyen matériel employé ; « chacun selon sa force » préserve mieux la concision et l’ambiguïté de l’original.
  revised_text: Voici[a] les princes d’Israël qui ont été chez toi, chacun selon sa force, pour verser le sang.
