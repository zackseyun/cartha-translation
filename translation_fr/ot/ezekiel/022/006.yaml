source:
  edition: WLC
  text: הִנֵּה֙ נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל אִ֥ישׁ לִ/זְרֹע֖/וֹ הָ֣יוּ בָ֑/ךְ לְמַ֖עַן שְׁפָךְ דָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/006.yaml
  text: Look[a], the princes of Israel in you, each according to his power, were in you to shed blood.
translation:
  language: fr
  text: Voici[a] les princes d’Israël qui ont été chez toi, chacun selon sa force, pour verser le sang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « selon sa force » signifie littéralement « selon son bras » ; en hébreu, le bras peut représenter la force ou le pouvoir.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Marque avec insistance ce qui est présenté à l’attention. « Voici » est naturel dans le registre prophétique français et conserve la force déictique de l’hébreu.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: les princes d’Israël
  rationale: נָשִׂיא désigne ici les détenteurs d’une autorité politique. « Princes » préserve leur rang et le ton de l’accusation prophétique, contrairement au terme plus général « dirigeants ».
- source_word: אִישׁ
  choice: chacun
  rationale: 'Le nom est employé distributivement : chaque prince est individuellement mis en cause.'
- source_word: לִזְרֹעוֹ
  choice: use de sa force
  rationale: Littéralement « selon/pour son bras ». Le bras représente par métonymie la force ou le pouvoir dont chacun dispose. La formulation française exprime cette idée tout en maintenant le lien avec l’action qui suit.
- source_word: הָיוּ בָךְ
  choice: qui sont chez toi
  rationale: Le suffixe féminin singulier renvoie à Jérusalem, directement interpellée. « Chez toi » conserve cette adresse et situe les princes au sein de la ville.
- source_word: לְמַעַן שְׁפָךְ דָּם
  choice: pour verser le sang
  rationale: La construction exprime le but. Cette traduction garde sans amplification la finalité coupable attribuée aux princes ainsi que l’image concrète du sang versé.
theological_decisions:
- issue: Valeur de לְמַעַן dans l’accusation
  choice: pour verser le sang
  alternative: résolus à verser le sang
  rationale: La traduction retient explicitement la finalité grammaticale sans ajouter l’état psychologique impliqué par « résolus à ».
translation_notes:
  register: Français international moderne, digne et prophétique. L’adresse à Jérusalem est conservée au féminin singulier par « chez toi ». La répétition lourde de בָךְ dans l’hébreu est intégrée en une construction française naturelle sans effacer sa fonction locative.
