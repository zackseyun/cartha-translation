source:
  edition: WLC
  text: כְּ/הִתּ֥וּךְ כֶּ֨סֶף֙ בְּ/ת֣וֹךְ כּ֔וּר כֵּ֖ן תֻּתְּכ֣וּ בְ/תוֹכָ֑/הּ וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה שָׁפַ֥כְתִּי חֲמָתִ֖/י עֲלֵי/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/022.yaml
  text: As silver is melted in the midst of a furnace[a], so you will be melted in the midst of it; and you will know that I, Yahweh, have poured out my wrath on you.
translation:
  language: fr
  text: Comme l’argent est fondu dans un four, ainsi vous serez fondus au milieu d’elle[a], et vous saurez que moi, Yahweh, j’ai déversé ma fureur sur vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le pronom féminin renvoie à la ville, Jérusalem, dans le contexte immédiat. On pourrait aussi traduire : « à l’intérieur d’elle ».'
    reason: Référent pronominal implicite et variante lexicale.
lexical_decisions:
- source_word: כְּהִתּוּךְ כֶּסֶף
  choice: Comme l’argent fond
  rationale: Le nom verbal précédé de כְּ introduit une comparaison. Cette formulation française naturelle conserve l’image de la fusion sans technicité superflue.
- source_word: בְּתוֹךְ כּוּר
  choice: au milieu du four
  rationale: כּוּר désigne un four servant à fondre ou affiner les métaux. « Au milieu » maintient la répétition de בְּתוֹךְ et l’idée d’un espace de jugement qui enferme.
- source_word: תֻּתְּכוּ
  choice: vous fondrez
  rationale: Le passif hébreu signifie que les destinataires seront mis en fusion. En français, « vous fondrez » exprime naturellement le résultat subi dans ce contexte.
- source_word: בְתוֹכָהּ
  choice: au milieu d’elle
  rationale: Le suffixe féminin singulier renvoie à la ville, Jérusalem, dans le contexte immédiat. Le pronom est conservé afin de ne pas expliciter dans le texte ce que l’hébreu laisse implicite.
- source_word: וִידַעְתֶּם
  choice: Alors vous saurez
  rationale: La formule de reconnaissance, fréquente chez Ézéchiel, marque ici la conséquence du jugement. « Alors » rend clairement cette progression en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin, qui préserve le nom personnel présent dans le texte plutôt que de lui substituer un titre.
- source_word: שָׁפַכְתִּי
  choice: j’ai déversé
  rationale: Le parfait présente l’action comme accomplie; le passé composé convient après « vous saurez que ». « Déverser » conserve l’image concrète du verbe.
- source_word: חֲמָתִי
  choice: ma fureur
  rationale: חֵמָה désigne une colère ardente. « Fureur » transmet cette intensité dans un registre prophétique digne et actuel.
- source_word: עֲלֵיכֶם
  choice: sur vous
  rationale: Équivalent français direct et idiomatique de עַל dans cette annonce de jugement.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Valeur temporelle de שָׁפַכְתִּי après une reconnaissance future
  choice: j’ai déversé
  alternative: j’aurai déversé
  rationale: Le parfait hébreu présente le déversement comme accompli. Le passé composé maintient la formulation de la déclaration divine et sa pertinence au moment où les destinataires reconnaîtront Yahweh, sans imposer une lecture strictement futur antérieur.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « au milieu » conserve la structure de la comparaison hébraïque; le vocabulaire reste concret et accessible.
