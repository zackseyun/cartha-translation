id: EZK.22.24
reference: Ezekiel 22:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בֶּן אָדָ֕ם אֱמָר לָ֕/הּ אַ֣תְּ אֶ֔רֶץ לֹ֥א מְטֹהָרָ֖ה הִ֑יא לֹ֥א גֻשְׁמָ֖/הּ בְּ/י֥וֹם זָֽעַם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/024.yaml
  text: Son of man[a], say to her[c][b], ‘You are a land not cleansed and not rained on in the day of indignation.’
translation:
  language: fr
  text: 'Fils d’homme, dis-lui : « Tu es un pays qui n’a pas été purifié[a] et qui n’a pas reçu de pluie[b] au jour de l’indignation[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui n’a pas été nettoyé ». Le participe hébreu peut désigner un état d’impureté ou le fait de ne pas avoir été purifié.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque est rare ; on peut aussi traduire « sur lequel il n’est pas tombé de pluie » ou « qui n’a pas été arrosé ».
    reason: lexical_alternative
  - marker: c
    text: Ou « au jour de la colère ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Formule d’adresse prophétique caractéristique d’Ézéchiel ; elle conserve la forme et le registre de l’hébreu.
- source_word: אֱמָר לָהּ
  choice: dis-lui
  rationale: Rend directement l’impératif suivi de la préposition et du suffixe féminin, lequel renvoie au pays personnifié.
- source_word: אַתְּ אֶרֶץ
  choice: Tu es un pays
  rationale: Le pronom féminin désigne métaphoriquement le pays ; l’article indéfini donne une formulation française naturelle sans imposer un défini absent de l’hébreu.
- source_word: לֹא מְטֹהָרָה
  choice: qui n’a pas été purifié
  rationale: Préserve la valeur passive et l’état résultant exprimés par le participe, ainsi que la possible portée morale ou rituelle.
- source_word: לֹא גֻשְׁמָהּ
  choice: qui n’a pas reçu de pluie
  rationale: Rend naturellement en français la forme passive rare liée à la pluie, sans ajouter explicitement l’idée interprétative d’un lavage.
- source_word: בְּיוֹם זָעַם
  choice: au jour de l’indignation
  rationale: Conserve l’expression prophétique et ne précise pas explicitement l’auteur de l’indignation, même si le contexte évoque le jugement divin.
theological_decisions:
- issue: Nature de l’état du pays
  choice: Le pays est présenté à la fois comme non purifié et privé de pluie au temps du jugement.
  alternative: Comprendre l’ensemble comme une image exclusivement morale, ou voir dans la pluie absente un moyen de purification refusé.
  rationale: L’hébreu permet une tension entre impureté et absence de pluie. La traduction maintient ces deux images sans les réduire à un mécanisme doctrinal unique.
translation_notes:
  register: Français international moderne, digne et accessible. La personnification féminine du pays est perceptible par « dis-lui », tandis que les relatives évitent une tournure passive maladroite. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
