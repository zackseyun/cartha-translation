source:
  edition: WLC
  text: קָדָשַׁ֖/י בָּזִ֑ית וְ/אֶת שַׁבְּתֹתַ֖/י חִלָּֽלְתְּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/008.yaml
  text: You have despised my holy things[a], and you have profaned my Sabbaths.
translation:
  language: fr
  text: Tu as méprisé ce qui m’est consacré[a] et tu as profané mes sabbats.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes sanctuaires » ou « mes lieux saints ». L’hébreu peut désigner plus précisément des lieux sacrés, mais il est rendu ici dans un sens plus large.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָדָשַׁי
  choice: ce qui m’est consacré
  rationale: Le pluriel avec suffixe de première personne désigne largement les réalités saintes qui appartiennent à Dieu. Cette formulation française naturelle conserve cette portée sans la limiter au sanctuaire.
- source_word: בָּזִית
  choice: tu as méprisé
  rationale: Le verbe exprime le mépris et le fait de tenir pour peu de valeur; « méprisé » en restitue directement la force morale.
- source_word: שַׁבְּתֹתַי
  choice: mes sabbats
  rationale: Le pluriel avec suffixe signifie directement « mes sabbats » et conserve le vocabulaire cultuel et allianciel du texte.
- source_word: חִלָּלְתְּ
  choice: tu as profané
  rationale: Au piel et dans un contexte de sainteté, le verbe signifie traiter comme ordinaire ce qui est saint; « profané » est ici le terme français précis.
theological_decisions:
- issue: Portée de קָדָשַׁי
  choice: référence large à ce qui est consacré à Dieu
  alternative: référence particulière aux sanctuaires ou aux lieux saints de Dieu
  rationale: Le pluriel hébreu permet un sens collectif large. La traduction évite de préciser indûment qu’il s’agit seulement du Temple ou de lieux sacrés, tout en gardant le lien avec la sainteté divine.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme accusatoire est conservé, ainsi que le terme biblique « sabbats ». Le singulier collectif « ce qui m’est consacré » évite la tournure peu idiomatique « mes choses saintes ».
