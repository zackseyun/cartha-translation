source:
  edition: WLC
  text: וְ/הִנֵּה֙ הִכֵּ֣יתִי כַפִּ֔/י אֶל בִּצְעֵ֖/ךְ אֲשֶׁ֣ר עָשִׂ֑ית וְ/עַ֨ל דָּמֵ֔/ךְ אֲשֶׁ֥ר הָי֖וּ בְּ/תוֹכֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/013.yaml
  text: And behold[a], I strike my hand against your unjust gain that you have made[b], and against the bloodshed that has been in your midst.
translation:
  language: fr
  text: 'Et voici : je frappe dans mes mains à cause du gain injuste[a] que tu as réalisé et du sang versé[b] qui se trouve au milieu de toi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le profit malhonnête que tu as acquis », ou « ta cupidité ». Le mot hébreu peut désigner un gain obtenu par l’injustice ou la violence.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « tes sangs ». Cette expression peut désigner collectivement les meurtres commis et la culpabilité qui s’y attache.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: Conserve la particule prophétique qui attire vivement l’attention, dans un registre élevé mais courant.
- source_word: הִכֵּיתִי כַפִּי
  choice: je frappe dans ma main
  rationale: Préserve le geste anthropomorphique concret. Le parfait hébreu est rendu par un présent déclaratif et vivant; « dans ma main » exprime idiomatiquement le geste sans le réduire explicitement à des applaudissements.
- source_word: אֶל בִּצְעֵךְ
  choice: à cause du gain injuste
  rationale: בצע désigne ici un profit entaché d’injustice ou de violence. Avec ce geste d’indignation, אֶל peut introduire ce qui le provoque; « à cause de » est naturel en français.
- source_word: אֲשֶׁר עָשִׂית
  choice: que tu as réalisé
  rationale: Rend le verbe courant עשה tout en s’accordant naturellement avec « gain »; le féminin singulier du discours à Jérusalem est conservé par « tu » sans marquage artificiel.
- source_word: וְעַל דָּמֵךְ
  choice: et du sang versé
  rationale: Le terme hébreu « sangs » dénonce collectivement les meurtres et peut aussi évoquer la culpabilité qui en résulte. « Sang versé » conserve l’image et reste idiomatique.
- source_word: אֲשֶׁר הָיוּ בְּתוֹכֵךְ
  choice: qui se trouve au milieu de toi
  rationale: Conserve l’adresse personnifiée à la ville et rend naturellement בתוך. Le singulier collectif français convient à « sang versé ».
theological_decisions:
- issue: Nature du geste divin de jugement
  choice: « je frappe dans ma main »
  alternative: « je bats des mains » ou « je frappe ma main contre toi »
  rationale: La formulation garde le geste corporel d’indignation et de jugement attribué à Dieu sans décider qu’il s’agit d’applaudissements ni faire de la ville l’objet direct du coup.
- issue: Portée de דָּמֵךְ (« tes sangs »)
  choice: « le sang versé »
  alternative: « ta culpabilité pour le sang versé »
  rationale: Le texte peut viser à la fois les actes meurtriers et la culpabilité qu’ils entraînent. Le corps du texte conserve l’image concrète, tandis que la note signale l’autre nuance.
translation_notes:
  register: Français international moderne, digne et direct. La personnification féminine de Jérusalem est maintenue par l’adresse au singulier. La ponctuation après « voici » met en relief la déclaration prophétique sans recourir à un archaïsme.
