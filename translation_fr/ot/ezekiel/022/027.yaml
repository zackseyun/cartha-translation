  text: שָׂרֶ֣י/הָ בְ/קִרְבָּ֔/הּ כִּ/זְאֵבִ֖ים טֹ֣רְפֵי טָ֑רֶף לִ/שְׁפָּךְ דָּם֙ לְ/אַבֵּ֣ד נְפָשׁ֔וֹת לְמַ֖עַן בְּצֹ֥עַ בָּֽצַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/027.yaml
  text: Her princes within her are like wolves tearing prey[a], to shed blood, to destroy lives[b], in order to gain dishonest profit.
translation:
  language: fr
  text: Ses princes, au milieu d’elle, sont comme des loups qui déchirent leur proie, pour verser le sang et faire périr des personnes[a], afin de tirer un profit malhonnête[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « détruire des vies » ou « détruire des âmes » ; le terme hébreu peut désigner, selon le contexte, des personnes, des vies ou des âmes.
    reason: lexical_alternative
  - marker: b
    text: Ou « obtenir un gain injuste » ou « s’enrichir par l’extorsion ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֶיהָ
  choice: ses princes
  rationale: שַׂר désigne un prince, un dirigeant ou un haut responsable. « Princes » conserve ici la portée politique et le registre élevé de l’accusation prophétique.
- source_word: בְקִרְבָּהּ
  choice: au milieu d’elle
  rationale: La locution situe la corruption au sein même de la ville personnifiée et reproduit naturellement l’image hébraïque.
- source_word: כִזְאֵבִים
  choice: comme des loups
  rationale: Le כ comparatif introduit une comparaison explicite, rendue de manière idiomatique en français.
- source_word: טֹרְפֵי טָרֶף
  choice: qui déchirent leur proie
  rationale: Le participe accompagné d’un complément de même racine intensifie l’image de prédation. « Déchirent leur proie » en restitue la violence sans archaïsme.
- source_word: לִשְׁפָּךְ דָּם
  choice: ils répandent le sang
  rationale: Il s’agit de l’expression hébraïque courante pour une mise à mort violente. La coordination verbale rend la séquence clairement et naturellement en français.
- source_word: לְאַבֵּד נְפָשׁוֹת
  choice: détruisent des vies
  rationale: Dans ce contexte de violence politique et de sang versé, נְפָשׁוֹת renvoie concrètement à des vies ou à des personnes, sans imposer le sens étroit d’« âmes ».
- source_word: לְמַעַן
  choice: afin de
  rationale: Cette locution exprime explicitement le but ou le mobile de la violence.
- source_word: בְּצֹעַ בָּצַע
  choice: tirer un profit malhonnête
  rationale: L’infinitif et le nom de même racine soulignent l’avidité pour un gain acquis injustement. Cette formulation garde à la fois la dimension économique et la condamnation morale.
theological_decisions:
- issue: Sens de נְפָשׁוֹת dans un contexte de violence et de jugement
  choice: « vies », désignant concrètement les personnes que l’on fait périr
  alternative: « âmes » ou « personnes »
  rationale: Le contexte porte sur le sang versé par les gouvernants. Le choix de « vies » évite de transformer l’accusation sociale en affirmation doctrinale sur la nature de l’âme, tout en signalant l’éventail lexical en note.
translation_notes:
  register: Français international moderne, digne et direct. La métaphore animale demeure vive. Les infinitifs hébreux de but sont rendus par des verbes coordonnés, puis leur visée commune est explicitée par « afin de », ce qui assure une syntaxe française naturelle sans effacer le rapport de motivation.
