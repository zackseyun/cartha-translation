  verdict: revise
  source_fidelity: 'Le sens général est fidèle : les princes de Jérusalem sont comparés à des loups prédateurs, versent le sang, font périr des êtres humains et recherchent un gain coupable. Toutefois, les infinitifs hébreux לִשְׁפָּךְ et לְאַבֵּד ont une valeur de visée et sont mieux rendus explicitement par « pour ».'
  naturalness: « Détruisent des vies » se comprend, mais demeure moins idiomatique en français que « font périr des personnes » dans ce contexte d’accusation de violence meurtrière. Une construction parallèle avec « pour verser ... et faire périr ... afin de ... » est fluide et conserve la progression du texte.
  terminology: « Princes », « au milieu d’elle », « comme des loups », « verser le sang » et « profit malhonnête » conviennent au registre prophétique moderne. « Personnes » rend ici נְפָשׁוֹת concrètement, sans suggérer une thèse sur l’âme. Les notes conservent les alternatives pertinentes, et leurs ancres doivent rester sur les expressions concernées.
  issues:
