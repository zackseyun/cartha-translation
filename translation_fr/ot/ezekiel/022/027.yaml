    rationale: « Ils répandent ... et détruisent ... afin de » exprime bien le but final, mais ne reflète pas aussi directement la série des infinitifs introduits par ל. « Pour verser le sang et faire périr des personnes » restitue plus nettement la syntaxe et la violence intentionnelle.
  - severity: low
    issue: « Détruisent des vies » est légèrement peu idiomatique.
    rationale: En français, on fait plus naturellement « périr des personnes » ou « ôte la vie à des personnes ». « Font périr des personnes » est sobre, clair et correspond au sens contextuel de נְפָשׁוֹת.
  revised_text: Ses princes, au milieu d’elle, sont comme des loups qui déchirent leur proie, pour verser le sang et faire périr des personnes[a], afin de tirer un profit malhonnête[b].
