source:
  edition: WLC
  text: עֶרְוַת אָ֖ב גִּלָּה בָ֑/ךְ טְמֵאַ֥ת הַ/נִּדָּ֖ה עִנּוּ בָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/010.yaml
  text: In you they uncover a father's nakedness[c][b][a]; in you they violate a woman in her menstrual impurity.
translation:
  language: fr
  text: En toi[b], on découvre la nudité d’un père[a] ; en toi, on fait violence à une femme alors qu’elle est impure à cause de ses règles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « découvrir la nudité d’un père », expression juridique désignant des relations sexuelles interdites ; voir Lévitique 18.7.
    reason: cross_reference
  - marker: b
    text: 'Ou « parmi vous ». L’hébreu s’adresse à Jérusalem comme à une femme et à une ville : « en toi ».'
    reason: lexical_alternative
  - marker: c
    text: Littéralement « une femme impure à cause de ses menstruations ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת אָב
  choice: la nudité d’un père
  rationale: Cette traduction conserve la construction indéfinie et l’expression juridique de l’hébreu, sans préciser davantage l’identité de la partenaire sexuelle.
- source_word: גִּלָּה
  choice: on découvre
  rationale: Le singulier hébreu a ici une portée indéfinie ou collective. Le pronom « on » rend naturellement cette accusation générale en français et maintient le présent vigoureux du réquisitoire prophétique.
- source_word: בָךְ
  choice: en toi
  rationale: Le suffixe féminin singulier s’adresse directement à Jérusalem personnifiée. « En toi » préserve cette image, tandis que « parmi vous » ferait disparaître l’adresse à la ville.
- source_word: טְמֵאַת הַנִּדָּה
  choice: une femme pendant l’impureté de ses règles
  rationale: La formulation explicite le référent féminin sous-entendu tout en conservant la notion rituelle d’impureté associée aux menstruations.
- source_word: עִנּוּ
  choice: on fait violence à
  rationale: Dans ce contexte sexuel, ענה exprime une atteinte dégradante et violente. « Faire violence à » garde cette gravité sans imposer plus précisément que l’hébreu la qualification moderne de viol.
theological_decisions:
- issue: Rendu de l’expression sexuelle lévitique
  choice: Conserver « découvrir la nudité d’un père » dans le texte principal.
  alternative: Expliciter par « avoir des relations sexuelles avec la femme de son père » ou « commettre un inceste ».
  rationale: L’expression appartient au langage juridique du Lévitique. Sa conservation maintient le lien intertextuel et évite de trancher dans le texte principal l’identité exacte de la femme visée.
- issue: Portée de עִנּוּ dans le contexte sexuel
  choice: « faire violence à »
  alternative: « violer », « humilier » ou « avoir des relations sexuelles avec »
  rationale: Le choix maintient la dimension abusive du verbe sans réduire son sens à une simple humiliation ni préciser au-delà de ce que permet la formulation hébraïque.
translation_notes:
  register: Français international moderne, sobre et digne. Le maintien de « en toi » et de l’expression « découvrir la nudité » conserve la personnification de Jérusalem et l’écho au vocabulaire légal du Lévitique ; les notes éclairent ces tournures moins courantes.
