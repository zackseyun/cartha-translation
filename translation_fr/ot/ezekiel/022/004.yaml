source:
  edition: WLC
  text: בְּ/דָמֵ֨/ךְ אֲשֶׁר שָׁפַ֜כְתְּ אָשַׁ֗מְתְּ וּ/בְ/גִלּוּלַ֤יִ/ךְ אֲשֶׁר עָשִׂית֙ טָמֵ֔את וַ/תַּקְרִ֣יבִי יָמַ֔יִ/ךְ וַ/תָּב֖וֹא עַד שְׁנוֹתָ֑יִ/ךְ עַל כֵּ֗ן נְתַתִּ֤י/ךְ חֶרְפָּה֙ לַ/גּוֹיִ֔ם וְ/קַלָּסָ֖ה לְ/כָל הָ/אֲרָצֽוֹת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/004.yaml
  text: By your blood that you have shed[a], you have become guilty, and by your idols that you have made, you have become unclean. You have brought your days near and have come to your years[b]. Therefore I have made you a reproach to the nations and a mockery to all the lands.
translation:
  language: fr
  text: Par le sang que tu as versé, tu es devenue coupable ; par les idoles[a] que tu as fabriquées, tu es devenue impure. Tu as rapproché tes jours et tu as atteint tes années[b]. C’est pourquoi j’ai fait de toi un objet d’opprobre pour les nations et un objet de dérision pour tous les pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu rendu par « idoles » est un terme méprisant qu’Ézéchiel emploie souvent pour désigner les faux dieux.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « tu as rapproché tes jours et tu as atteint tes années ». Cette expression évoque probablement l’approche du temps fixé pour le jugement de Jérusalem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדָמֵךְ אֲשֶׁר שָׁפַכְתְּ
  choice: Par le sang que tu as versé
  rationale: Le בְּ est causal ou instrumental dans ce contexte judiciaire. La formulation française conserve le lien direct entre le sang versé et la culpabilité de Jérusalem.
- source_word: אָשַׁמְתְּ
  choice: tu es devenue coupable
  rationale: Le verbe exprime l’entrée dans un état de culpabilité ou le fait d’avoir contracté une faute. Le féminin correspond à Jérusalem personnifiée.
- source_word: גִלּוּלַיִךְ
  choice: tes idoles
  rationale: Le terme est nettement péjoratif chez Ézéchiel, mais « idoles » reste la désignation française la plus claire et naturelle ; sa nuance méprisante est signalée en note.
- source_word: טָמֵאת
  choice: tu es devenue impure
  rationale: Le qal décrit ici l’état d’impureté résultant de l’idolâtrie, en parallèle avec l’état de culpabilité causé par le sang versé.
- source_word: וַתַּקְרִיבִי יָמַיִךְ
  choice: Tu as rapproché tes jours
  rationale: Cette traduction conserve l’image hébraïque du hiphil de קרב, tout en laissant la proposition suivante et la note éclairer son sens probable.
- source_word: וַתָּבוֹא עַד שְׁנוֹתָיִךְ
  choice: tu es arrivée au terme de tes années
  rationale: L’expression marque vraisemblablement l’arrivée au temps fixé pour le jugement. « Au terme » rend l’implication idiomatique sans préciser indûment la nature exacte de ce terme.
- source_word: חֶרְפָּה
  choice: un objet de honte
  rationale: Le nom évoque la honte publique, l’opprobre ou le mépris. Cette formulation est naturelle en français moderne et convient au contexte prophétique.
- source_word: קַלָּסָה
  choice: un objet de moquerie
  rationale: Le terme désigne la dérision ou la raillerie ; « objet de moquerie » préserve sa distinction par rapport à la honte exprimée dans le membre parallèle.
- source_word: הָאֲרָצוֹת
  choice: tous les pays
  rationale: Au pluriel et en parallèle avec « les nations », le mot désigne ici les territoires ou pays environnants plutôt que la terre entière prise collectivement.
theological_decisions:
- issue: Nature de la culpabilité et de l’impureté de Jérusalem
  choice: Le texte présente le sang versé comme source de culpabilité et les idoles comme source d’impureté, dans le cadre du jugement de Jérusalem.
  alternative: Réduire l’impureté à une catégorie seulement cérémonielle, ou comprendre la culpabilité comme une simple métaphore.
  rationale: Le parallélisme hébreu associe deux accusations concrètes, l’effusion de sang et l’idolâtrie, sans permettre de dissocier entièrement leurs dimensions morale, cultuelle et judiciaire.
- issue: Sens des jours rapprochés et des années atteintes
  choice: Conserver l’image temporelle tout en indiquant qu’elle évoque probablement l’arrivée du temps fixé pour le jugement.
  alternative: Traduire directement par « tu as hâté ton jugement » ou, à l’inverse, reproduire mot à mot une expression peu intelligible en français.
  rationale: 'L’hébreu laisse une part d’implicite : les actes de Jérusalem ont fait approcher ses jours et l’ont menée à ses années. La traduction et la note préservent cette image sans identifier explicitement le terme avec une doctrine plus précise.'
translation_notes:
  register: Français international moderne, courant et digne. Le féminin singulier est maintenu parce que la ville de Jérusalem est directement personnifiée. Le parallélisme prophétique et la tension entre formulation littérale et sens idiomatique sont conservés.
