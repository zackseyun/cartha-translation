review_pass:
  verdict: revise
  source_fidelity: 'La première partie rend fidèlement les liens causaux : le sang versé entraîne la culpabilité et les idoles fabriquées entraînent l’impureté. En revanche, « tu es arrivée au terme de tes années » explicite « le terme / la fin », qui n’est pas exprimé par עַד שְׁנוֹתָיִךְ. Le sens est probablement celui de l’échéance du jugement, mais l’hébreu conserve l’idiome sans nommer explicitement une fin.'
  naturalness: Le français est globalement clair, moderne et d’un registre prophétique digne. « Tu as atteint tes années » demeure une formulation inhabituelle, mais elle est volontairement proche de l’image hébraïque et devient intelligible grâce à la note. « Objet d’opprobre » et « objet de dérision » sont plus précis et plus idiomatiques dans ce registre que « objet de honte » et « de moquerie ».
  terminology: « Coupable », « impure », « idoles », « nations » et « pays » conviennent. La note sur « idoles » conserve justement la nuance péjorative de גִלּוּלִים sans imposer en texte une paraphrase telle que « immondes idoles ».
  issues:
  - severity: medium
    issue: « au terme de tes années » ajoute l’idée de fin.
    rationale: La locution hébraïque dit littéralement que Jérusalem est venue / parvenue jusqu’à ses années. Le contexte autorise l’allusion à l’échéance du jugement en note, mais non l’ajout non marqué de « terme » dans le texte.
  - severity: low
    issue: « objet de honte » atténue légèrement le sens de חֶרְפָּה.
    rationale: חֶרְפָּה désigne surtout l’opprobre, le déshonneur public ou le sujet de reprobre. « Objet d’opprobre » conserve mieux cette valeur tout en restant naturel.
  revised_text: Par le sang que tu as versé, tu es devenue coupable ; par les idoles[a] que tu as fabriquées, tu es devenue impure. Tu as rapproché tes jours et tu as atteint tes années[b]. C’est pourquoi j’ai fait de toi un objet d’opprobre pour les nations et un objet de dérision pour tous les pays.
  revised_footnotes:
