  to: Par le sang que tu as versé, tu es devenue coupable ; par les idoles[a] que tu as fabriquées, tu es devenue impure. Tu as rapproché tes jours et tu as atteint tes années[b]. C’est pourquoi j’ai fait de toi un objet d’opprobre pour les nations et un objet de dérision pour tous les pays.
