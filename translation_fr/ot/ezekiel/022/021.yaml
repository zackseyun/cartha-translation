- from: Je vous rassemblerai et je soufflerai sur vous avec le feu de ma colère ; alors vous fondrez en son sein.[a]
  to: Je vous rassemblerai, je soufflerai sur vous avec le feu de ma colère, et vous serez fondus en son sein.[a]
