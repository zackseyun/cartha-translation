review_pass:
  verdict: revise
  source_fidelity: 'Le sens essentiel est bien rendu : rassemblement, souffle divin, feu de colère et fusion. Toutefois, « alors » ajoute une articulation consécutive qui n’est pas exprimée par le simple waw, et « vous fondrez » ne reflète pas la forme passive de נִתַּכְתֶּם. Une tournure passive française est ici possible sans perdre l’image métallurgique.'
  naturalness: Le français est globalement naturel et de registre prophétique digne. « En son sein » maintient heureusement un référent non explicité, même si son genre ne permet pas à lui seul de reproduire le suffixe féminin hébreu ; la note doit donc préciser que cette donnée appartient à l’hébreu.
  terminology: « Rassembler », « souffler sur », « feu de ma colère » et « fondus » conviennent au contexte de jugement figuré par la fusion. « Colère » rend sobrement עֶבְרָה sans surcharge doctrinale.
  issues:
  - severity: low
    issue: Ajout de « alors »
    rationale: Le texte hébreu coordonne les actions et leur résultat sans marquer explicitement une conséquence temporelle par « alors ». Sa suppression préserve mieux la sobriété de l’original.
  - severity: low
    issue: Rendu actif de la forme passive נִתַּכְתֶּם
    rationale: « Vous fondrez » exprime le résultat, mais « vous serez fondus » restitue aussi la voix passive du verbe hébreu et l’action subie dans l’image du feu divin.
  - severity: low
    issue: Note sur le référent
    rationale: La note doit attribuer explicitement le féminin au suffixe hébreu, car « son sein » ne distingue pas grammaticalement en français un antécédent féminin d’un antécédent masculin.
  revised_text: Je vous rassemblerai, je soufflerai sur vous avec le feu de ma colère, et vous serez fondus en son sein.[a]
  revised_footnotes:
  - marker: a
    text: Ou « au milieu d’elle ». Le suffixe féminin en hébreu peut renvoyer à la ville dans le contexte général ou au four, voire au creuset, dans l’image de la fonte des métaux.
    reason: alternative_reading
