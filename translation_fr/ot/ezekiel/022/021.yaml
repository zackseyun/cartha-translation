id: EZK.22.21
reference: Ezekiel 22:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כִנַּסְתִּ֣י אֶתְ/כֶ֔ם וְ/נָפַחְתִּ֥י עֲלֵי/כֶ֖ם בְּ/אֵ֣שׁ עֶבְרָתִ֑/י וְ/נִתַּכְתֶּ֖ם בְּ/תוֹכָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/021.yaml
  text: I will gather you[a], and I will blow on you with the fire of my wrath, and you will be melted within it.
translation:
  language: fr
  text: Je vous rassemblerai, je soufflerai sur vous avec le feu de ma colère, et vous serez fondus en son sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au milieu d’elle ». Le suffixe féminin en hébreu peut renvoyer à la ville dans le contexte général ou au four, voire au creuset, dans l’image de la fonte des métaux.
    reason: alternative_reading
lexical_decisions:
- source_word: כִנַּסְתִּי
  choice: je vous rassemblerai
  rationale: Le verbe désigne ici le rassemblement du peuple en vue du jugement et prolonge l’image de la fonte des métaux. « Rassembler » est naturel et concret en français.
- source_word: נָפַחְתִּי עֲלֵיכֶם
  choice: je soufflerai sur vous
  rationale: Cette formulation conserve le sens premier de נפח et l’image du souffle qui attise le feu d’un four, sans expliciter davantage le moyen technique.
- source_word: בְּאֵשׁ עֶבְרָתִי
  choice: avec le feu de ma colère
  rationale: « Avec » rend bien la valeur instrumentale possible de בְּ, tandis que « colère » exprime עֶבְרָה dans un français actuel et digne.
- source_word: נִתַּכְתֶּם
  choice: vous fondrez
  rationale: Dans cette métaphore métallurgique, le verbe décrit la liquéfaction du métal. La tournure active française est naturelle, bien que la forme hébraïque soit passive.
- source_word: בְּתוֹכָהּ
  choice: en son sein
  rationale: Cette expression maintient le pronom féminin singulier et évite de trancher entre la ville et la réalité évoquée par l’image du four ou du creuset.
theological_decisions:
- issue: Référent du suffixe féminin dans בְּתוֹכָהּ
  choice: 'Conserver un pronom non explicité : « en son sein ».'
  alternative: « au milieu de la ville » ou « au milieu du four/creuset »
  rationale: Le contexte superpose Jérusalem et le lieu de fonte. Ne pas nommer l’antécédent préserve cette tension métaphorique.
translation_notes:
  register: Français international moderne, clair et digne. Le futur prophétique est conservé, ainsi que l’image concrète du souffle attisant le feu. « En son sein » permet de respecter le genre féminin du pronom hébreu et son référent ambigu.
