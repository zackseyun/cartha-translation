id: EZK.22.2
reference: Ezekiel 22:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם הֲ/תִשְׁפֹּ֥ט הֲ/תִשְׁפֹּ֖ט אֶת עִ֣יר הַ/דָּמִ֑ים וְ/ה֣וֹדַעְתָּ֔/הּ אֵ֖ת כָּל תּוֹעֲבוֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/002.yaml
  text: And you[a], son of man, will you judge, will you judge the bloody city? Then make known to her all her abominations.
translation:
  language: fr
  text: Et toi, fils d’homme, vas-tu juger, vas-tu juger la ville sanguinaire[a] ? Fais-lui donc connaître toutes ses abominations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « la ville du sang versé » ou « la ville coupable de meurtres » ; littéralement : « la ville des sangs ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: Cette formule constitue l’adresse divine habituelle à Ézéchiel. La traduction formelle conserve l’idiome hébreu et sa cohérence dans le livre.
- source_word: הֲתִשְׁפֹּט הֲתִשְׁפֹּט
  choice: vas-tu juger, vas-tu juger
  rationale: La répétition interrogative exprime une forte insistance rhétorique; elle est conservée plutôt que réduite à un seul verbe.
- source_word: עִיר הַדָּמִים
  choice: la ville sanguinaire
  rationale: Le pluriel hébreu « sangs » évoque les meurtres et la culpabilité liée au sang versé. « Ville sanguinaire » est naturel en français et caractérise la ville par la violence meurtrière.
- source_word: וְהוֹדַעְתָּהּ
  choice: Fais-lui donc connaître
  rationale: 'Le hifil de ידע est causatif : faire connaître. « Donc » rend ici l’enchaînement discursif après la question rhétorique, sans transformer la proposition en simple information.'
- source_word: כָּל תּוֹעֲבוֹתֶיהָ
  choice: toutes ses abominations
  rationale: « Toutes » préserve la totalité explicite, et « abominations » maintient la forte portée morale et cultuelle du terme prophétique.
theological_decisions:
- issue: Sens de אָדָם dans l’adresse בֶן אָדָם
  choice: fils d’homme
  alternative: être humain; mortel
  rationale: Il s’agit d’une formule hébraïque récurrente adressée au prophète. « Fils d’homme » en conserve la forme et le rôle littéraire sans lui imposer ici un sens christologique.
- issue: Portée de עִיר הַדָּמִים
  choice: ville sanguinaire
  alternative: ville du sang versé; ville coupable de meurtres
  rationale: La formulation retenue maintient l’accusation de violence meurtrière, tandis que la note signale la formulation littérale et la nuance possible de culpabilité sanguinaire.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition abrupte de la question est volontairement conservée, de même que le terme prophétique fort « abominations ».
