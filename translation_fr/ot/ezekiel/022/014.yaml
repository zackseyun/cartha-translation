source:
  edition: WLC
  text: הֲ/יַעֲמֹ֤ד לִבֵּ/ךְ֙ אִם תֶּחֱזַ֣קְנָה יָדַ֔יִ/ךְ לַ/יָּמִ֕ים אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֣ה אוֹתָ֑/ךְ אֲנִ֥י יְהוָ֖ה דִּבַּ֥רְתִּי וְ/עָשִֽׂיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/014.yaml
  text: Will your heart endure[a], or will your hands remain strong, in the days when I deal with you? I, Yahweh, have spoken, and I will do it.
translation:
  language: fr
  text: Ton cœur tiendra-t-il bon, ou tes mains resteront-elles fortes, quand j’agirai contre toi[a] ? Moi, Yahvé, j’ai parlé, et je le ferai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est elliptique : littéralement, « aux jours où je te fais » ; dans ce contexte, il s’agit d’une action dirigée contre Jérusalem.'
    reason: ambiguïté syntaxique et lexicale
lexical_decisions:
- source_word: הֲיַעֲמֹד לִבֵּךְ
  choice: Ton cœur tiendra-t-il bon
  rationale: עמד signifie littéralement « se tenir, rester debout ». Dans cette question sur la capacité à supporter le jugement, « tenir bon » exprime naturellement l’endurance ou le courage tout en conservant l’image du cœur.
- source_word: אִם תֶּחֱזַקְנָה יָדַיִךְ
  choice: ou tes mains resteront-elles fortes
  rationale: אִם relie ici les deux questions avec une valeur alternative. L’expression désigne la force ou la capacité d’agir, et la traduction conserve l’image corporelle des mains.
- source_word: לַיָּמִים אֲשֶׁר אֲנִי עֹשֶׂה אוֹתָךְ
  choice: quand j’agirai contre toi
  rationale: La construction hébraïque est elliptique, littéralement proche de « aux jours où je te fais ». Dans le contexte immédiat du jugement, elle désigne l’action hostile de Dieu envers Jérusalem. « Quand » rend le sens temporel en français courant.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » représente le nom divin יהוה au lieu de le remplacer par un titre.
- source_word: דִּבַּרְתִּי
  choice: j’ai parlé
  rationale: Le parfait présente la déclaration divine comme déjà prononcée et certaine.
- source_word: וְעָשִׂיתִי
  choice: et je le ferai
  rationale: Dans cette formule prophétique, le parfait exprime la certitude de l’accomplissement futur. Le pronom « le » renvoie à ce que Yahvé a annoncé.
theological_decisions:
- issue: Portée de l’action divine dans אֲנִי עֹשֶׂה אוֹתָךְ
  choice: quand j’agirai contre toi
  alternative: quand j’interviendrai à ton égard
  rationale: Le contexte est explicitement celui du châtiment, ce qui justifie « contre toi », sans préciser davantage la forme judiciaire de cette action. La note signale l’ellipse de l’hébreu.
- issue: Valeur temporelle de וְעָשִׂיתִי
  choice: et je le ferai
  alternative: et je l’ai fait
  rationale: Bien que la forme hébraïque soit un parfait, la formule garantit ici l’exécution future de la parole divine. Le futur français communique cette fonction sans affaiblir sa certitude.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier correspond à l’adresse faite à Jérusalem personnifiée. Les images parallèles du cœur et des mains sont conservées.
