source:
  edition: WLC
  text: קְבֻ֣צַת כֶּ֡סֶף וּ֠/נְחֹשֶׁת וּ/בַרְזֶ֨ל וְ/עוֹפֶ֤רֶת וּ/בְדִיל֙ אֶל תּ֣וֹךְ כּ֔וּר לָ/פַֽחַת עָלָ֥י/ו אֵ֖שׁ לְ/הַנְתִּ֑יךְ כֵּ֤ן אֶקְבֹּץ֙ בְּ/אַפִּ֣/י וּ/בַ/חֲמָתִ֔/י וְ/הִנַּחְתִּ֥י וְ/הִתַּכְתִּ֖י אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/020.yaml
  text: As silver and bronze and iron and lead and tin are gathered into the midst of a furnace[a], to blow fire on it in order to melt it, so I will gather you in my anger and in my wrath[b], and I will place you there and melt you.
translation:
  language: fr
  text: Comme on rassemble l’argent, le bronze[a], le fer, le plomb et l’étain au cœur d’un fourneau, pour y attiser le feu afin de les faire fondre, ainsi je vous rassemblerai dans ma colère et dans ma fureur ; je vous y mettrai et je vous ferai fondre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cuivre ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe peut aussi se rendre par « je vous mettrai en fusion ».
    reason: lexical_alternative
lexical_decisions:
- source_word: קְבֻצַת
  choice: Comme on rassemble
  rationale: Le nom verbal introduit, avec כֵּן dans la proposition principale, une comparaison. Une tournure verbale impersonnelle exprime naturellement cette valeur en français.
- source_word: כֶּסֶף וּנְחֹשֶׁת וּבַרְזֶל וְעוֹפֶרֶת וּבְדִיל
  choice: l’argent, le bronze, le fer, le plomb et l’étain
  rationale: La liste des métaux est conservée intégralement. « Bronze » convient bien à נְחֹשֶׁת dans ce contexte métallurgique, tout en laissant « cuivre » comme possibilité en note.
- source_word: אֶל תּוֹךְ כּוּר
  choice: au cœur d’un fourneau
  rationale: « Au cœur de » restitue la notion d’intériorité portée par תּוֹךְ, tandis que « fourneau » désigne naturellement l’installation de fusion.
- source_word: לָפַחַת עָלָיו אֵשׁ
  choice: pour attiser le feu contre cet amas
  rationale: La formulation rend l’action de souffler ou d’activer le feu sur la masse des métaux sans produire en français une tournure artificielle.
- source_word: לְהַנְתִּיךְ
  choice: afin de le faire fondre
  rationale: La forme causative de נתך signifie ici provoquer la fusion de la masse métallique.
- source_word: כֵּן אֶקְבֹּץ
  choice: ainsi je vous rassemblerai
  rationale: « Ainsi » reprend explicitement la comparaison et « rassemblerai » maintient la répétition de la racine קבץ.
- source_word: בְּאַפִּי וּבַחֲמָתִי
  choice: dans ma colère et dans ma fureur
  rationale: La traduction idiomatique distingue les deux termes hébreux et conserve leur accumulation intensive.
- source_word: וְהִנַּחְתִּי
  choice: je vous y mettrai
  rationale: Dans la suite de l’image, le causatif de נוח exprime le fait de placer les destinataires dans le fourneau figuré. « Y » explicite sobrement le lieu déjà évoqué.
- source_word: וְהִתַּכְתִּי אֶתְכֶם
  choice: et je vous ferai fondre
  rationale: La forme causative prolonge directement l’image du fourneau et garde toute la force du jugement annoncé.
theological_decisions:
- issue: Portée de l’image de la fusion
  choice: 'Conserver l’image punitive : « je vous ferai fondre »'
  alternative: Interpréter par « je vous purifierai » ou « je vous mettrai à l’épreuve »
  rationale: Le contexte immédiat décrit le jugement contre Jérusalem. Le texte parle de fusion sous l’effet de la colère divine, sans présenter explicitement cette opération comme une purification bénéfique.
- issue: Double expression de la colère divine
  choice: « dans ma colère et dans ma fureur »
  alternative: Réduire les deux termes à une seule expression française
  rationale: Le redoublement hébreu intensifie le jugement divin et doit être conservé sans l’atténuer.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve la longue comparaison métallurgique, avec un point-virgule pour en clarifier l’articulation. « Au cœur d’un fourneau » et « attiser le feu » donnent une image naturelle sans atténuer la sévérité du jugement.
