  text: קֶ֤שֶׁר נְבִיאֶ֨י/הָ֙ בְּ/תוֹכָ֔/הּ כַּ/אֲרִ֥י שׁוֹאֵ֖ג טֹ֣רֵֽף טָ֑רֶף נֶ֣פֶשׁ אָכָ֗לוּ חֹ֤סֶן וִ/יקָר֙ יִקָּ֔חוּ אַלְמְנוֹתֶ֖י/הָ הִרְבּ֥וּ בְ/תוֹכָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/025.yaml
  text: 'A conspiracy of her prophets is in her midst[a], like a roaring lion tearing prey: they have devoured lives, they take wealth and precious things, they have multiplied her widows in her midst.'
translation:
  language: fr
  text: 'Une conspiration de ses prophètes est en son sein, pareille à un lion rugissant qui déchire sa proie : ils dévorent des vies[a], s’emparent des richesses et des objets précieux, et multiplient ses veuves en son sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des personnes » ; plus littéralement, « des êtres vivants ». Le mot hébreu néfèsh désigne souvent un être vivant ou la vie, et pas seulement l’âme au sens immatériel.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁר
  choice: conjuration
  rationale: Le nom désigne une alliance ou un complot hostile. « Conjuration » convient au registre prophétique et exprime l’action coordonnée des prophètes.
- source_word: נְבִיאֶיהָ
  choice: ses prophètes
  rationale: Le suffixe féminin renvoie à la ville personnifiée; le possessif français conserve cette relation.
- source_word: בְּתוֹכָהּ
  choice: en son sein
  rationale: Cette expression naturelle et digne conserve l’image spatiale et sa répétition qui encadre le verset.
- source_word: כַּאֲרִי שׁוֹאֵג טֹרֵף טָרֶף
  choice: comme un lion rugissant qui déchire sa proie
  rationale: La formulation restitue la comparaison violente ainsi que le participe et son complément apparenté, sans lourdeur excessive en français.
- source_word: נֶפֶשׁ אָכָלוּ
  choice: ils dévorent des vies
  rationale: נֶפֶשׁ désigne ici des êtres vivants ou leur vie. « Des vies » maintient la métaphore prédatrice sans suggérer exclusivement l’âme immatérielle.
- source_word: חֹסֶן וִיקָר
  choice: les richesses et les objets précieux
  rationale: Dans ce contexte de pillage, les deux noms renvoient aux biens matériels et aux choses de valeur.
- source_word: יִקָּחוּ
  choice: s’emparent
  rationale: Le verbe exprime ici leur conduite caractéristique; « s’emparent » rend naturellement la prise prédatrice suggérée par le contexte.
- source_word: אַלְמְנוֹתֶיהָ הִרְבּוּ
  choice: multiplient les veuves
  rationale: 'La formulation conserve l’expression frappante de l’hébreu: leurs violences font mourir des hommes et augmentent ainsi le nombre des veuves.'
theological_decisions:
- issue: Sens de נֶפֶשׁ dans ce contexte de jugement
  choice: vies
  alternative: personnes; âmes
  rationale: Le passage dénonce une exploitation meurtrière plutôt qu’il ne formule une définition anthropologique de l’âme. « Vies » préserve le sens contextuel et la métaphore sans imposer une précision doctrinale ultérieure.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation française répartit la longue phrase hébraïque en deux phrases pour en faciliter la lecture. La répétition « en son sein » est conservée afin de respecter l’encadrement du texte source.
