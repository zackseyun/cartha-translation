  yaml_path: translation/ot/ezekiel/022/017.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: fr
  text: 'La parole de Yahweh[a] me fut adressée :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque du nom divin et son rendu traditionnel.
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans cette formule prophétique, le wayyiqtol de היה introduit l’arrivée de la parole divine. La tournure française « la parole… me fut adressée » restitue naturellement la formule sans calquer « et il arriva ».
- source_word: דְבַר
  choice: La parole
  rationale: Dans l’expression prophétique figée דְבַר יְהוָה, « la parole » conserve la transparence lexicale et la portée solennelle de la révélation divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre, plutôt que remplacé par le titre traditionnel « le Seigneur ».
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » rend naturellement en français la préposition אֶל avec le suffixe de première personne.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif לֵאמֹר introduit ici le discours direct qui suit. En français moderne, les deux-points remplissent cette fonction plus naturellement que le calque « disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom divin, tandis que « le Seigneur » représente la substitution traditionnelle.
translation_notes:
  register: Français international moderne, digne et fluide. La formule passive « me fut adressée » est courante dans le registre prophétique biblique ; les deux-points introduisent naturellement la parole annoncée au verset suivant.
