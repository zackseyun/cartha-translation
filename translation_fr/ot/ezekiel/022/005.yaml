  source_fidelity: 'Le sens de l’ensemble est fidèlement rendu : le parallélisme « proches / lointaines », la moquerie dirigée contre la destinataire, ainsi que les deux épithètes finales sont conservés. « Toi dont le nom est souillé » est une explicitation recevable de טְמֵאַת הַשֵּׁם, à condition que la note maintienne la formulation condensée et les lectures possibles. En revanche, « Celles qui » donne en français l’impression que les moqueuses sont nécessairement des femmes ; le féminin pluriel hébreu substantivé renvoie plus vraisemblablement à des entités collectives sous-entendues (p. ex. villes ou peuples) et ne justifie pas cette restriction française.'
