base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/005.yaml
  text: Those who are near and those who are far from you will mock you[a], defiled of name[b], full of turmoil.
translation:
  language: fr
  text: Ceux qui sont près de toi et ceux qui sont loin de toi se moqueront de toi, toi dont le nom est souillé[a], pleine de tumulte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « souillée de nom ». On peut aussi comprendre : « impure de réputation » ou « dont la réputation est souillée ». L’expression hébraïque est très condensée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pleine de confusion », « pleine de vacarme » ou « débordante de désordre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרֹבוֹת וְהָרְחֹקוֹת מִמֵּךְ
  choice: Celles qui sont proches et celles qui sont loin de toi
  rationale: Les adjectifs féminins pluriels substantivés désignent vraisemblablement des populations ou des villes proches et lointaines. Le féminin français maintient la personnification et le parallélisme spatial sans ajouter un référent absent du verset.
- source_word: יִתְקַלְּסוּ בָךְ
  choice: se moqueront de toi
  rationale: Le hitpael de קלס exprime la moquerie ou la dérision. Cette tournure est naturelle en français moderne et rend correctement le complément introduit par ב.
- source_word: טְמֵאַת הַשֵּׁם
  choice: toi dont le nom est souillé
  rationale: La formule hébraïque est très condensée, littéralement proche de « souillée de nom ». L'explicitation retenue demeure proche de la syntaxe possible et communique naturellement l'atteinte portée au nom ou à la réputation, tandis que la note conserve l'ambiguïté.
- source_word: רַבַּת הַמְּהוּמָה
  choice: pleine de tumulte
  rationale: רַבַּת indique ici l'abondance, et מְהוּמָה peut évoquer tumulte, confusion ou désordre. « Pleine de tumulte » est concise, digne et garde la force de la description.
theological_decisions:
- issue: Interprétation de la formule condensée טְמֵאַת הַשֵּׁם
  choice: toi dont le nom est souillé
  alternative: souillée de nom ; impure de réputation
  rationale: La formulation principale rend le sens intelligible sans réduire le « nom » à la seule réputation. La note signale la littéralité et les autres compréhensions possibles afin de préserver l'ambiguïté du texte.
- issue: Identification explicite de la destinataire
  choice: Maintenir la deuxième personne sans ajouter « Jérusalem » ou « ville »
  alternative: toi, Jérusalem ; toi, la ville
  rationale: Le contexte identifie la destinataire, mais le verset ne la nomme pas. Les accords féminins suffisent à conserver la personnification sans ajout interprétatif.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme entre proximité et éloignement est conservé, ainsi que l'adresse féminine personnifiée. Les notes rendent visibles les ambiguïtés lexicales sans alourdir le texte principal.
