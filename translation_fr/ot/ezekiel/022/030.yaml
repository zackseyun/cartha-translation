  source_fidelity: 'Révision nécessaire : « répare le mur » restreint le participe hébreu גֹּדֵר (« qui construit/élève une clôture ou un mur ») et introduit un mur défini. Le texte évoque plus largement l’établissement d’une défense, suivi de la position à la brèche. Le reste rend fidèlement la recherche parmi le peuple, l’homme au singulier, la position devant Dieu, l’action pour le pays et l’absence de résultat.'
