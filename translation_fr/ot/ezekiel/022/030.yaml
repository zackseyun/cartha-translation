  terminology: « Un homme », « mur », « brèche », « devant moi » et « pays » maintiennent le registre prophétique et l’imagerie défensive et représentative. « En faveur du pays » conserve la valeur de בְּעַד sans réduire le passage à l’intercession explicite.
