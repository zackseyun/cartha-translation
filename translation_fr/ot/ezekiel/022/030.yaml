  text: וָ/אֲבַקֵּ֣שׁ מֵ/הֶ֡ם אִ֣ישׁ גֹּֽדֵר גָּדֵר֩ וְ/עֹמֵ֨ד בַּ/פֶּ֧רֶץ לְ/פָנַ֛/י בְּעַ֥ד הָ/אָ֖רֶץ לְ/בִלְתִּ֣י שַׁחֲתָ֑/הּ וְ/לֹ֖א מָצָֽאתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/030.yaml
  text: And I sought among them for a man who would build up a wall and stand in the breach before me on behalf of the land[a], so that I would not destroy it[b], but I found none.
translation:
  language: fr
  text: J’ai cherché parmi eux un homme qui construise un mur et se tienne à la brèche devant moi, en faveur du pays, afin que je ne le détruise pas, mais je n’en ai trouvé aucun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֲבַקֵּשׁ מֵהֶם
  choice: J’ai cherché parmi eux
  rationale: בקש exprime une recherche active, et מן marque ici le groupe au sein duquel la recherche s’effectue. Cette formulation est naturelle en français tout en conservant cette nuance.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom est masculin singulier. « Un homme » préserve la forme concrète et représentative de l’hébreu sans la neutraliser.
- source_word: גֹּדֵר גָּדֵר
  choice: qui répare le mur
  rationale: La construction avec verbe et nom de même racine évoque l’action de murer ou de remettre en état une enceinte. Dans le contexte d’une brèche, « répare le mur » rend clairement l’image défensive sans reproduire maladroitement la répétition hébraïque.
- source_word: וְעֹמֵד בַּפֶּרֶץ
  choice: et se tienne […] sur la brèche
  rationale: פֶּרֶץ désigne une ouverture produite dans une enceinte. « Sur la brèche » conserve l’image concrète d’une personne prenant position à l’endroit vulnérable.
- source_word: לְפָנַי
  choice: devant moi
  rationale: Traduction directe de l’expression de présence; elle laisse perceptible la dimension possible de représentation ou d’intercession sans l’expliciter excessivement.
- source_word: בְּעַד הָאָרֶץ
  choice: en faveur du pays
  rationale: בְּעַד indique que l’homme recherché agit pour la protection ou au bénéfice du pays. « En faveur de » préserve cette valeur représentative.
- source_word: לְבִלְתִּי שַׁחֲתָהּ
  choice: afin que je ne le détruise pas
  rationale: La construction exprime le but ou le résultat préventif recherché. Le pronom féminin hébreu reprend הָאָרֶץ; en français, « le » reprend naturellement « le pays ».
- source_word: וְלֹא מָצָאתִי
  choice: mais je n’en ai trouvé aucun
  rationale: Le waw introduit ici un contraste tragique avec la recherche. « Aucun » reprend clairement « un homme » et conserve l’absence totale exprimée par le texte.
theological_decisions:
- issue: Articulation entre l’image défensive et l’intervention devant Dieu
  choice: Conserver ensemble « le mur », « la brèche », « devant moi » et « en faveur du pays ».
  alternative: Paraphraser uniquement en termes d’intercession, par exemple « quelqu’un qui intercède pour le pays ».
  rationale: L’hébreu superpose l’image de la défense d’une ville et celle d’une intervention représentative devant Dieu. La traduction ne réduit pas cette tension à la seule prière ni à de simples travaux de fortification.
- issue: Portée de אִישׁ
  choice: un homme
  alternative: quelqu’un / une personne
  rationale: La formulation masculine singulière du texte est conservée. Elle peut avoir une portée représentative, mais la traduction n’impose pas une reformulation inclusive absente de la source.
- issue: Agent de la destruction
  choice: afin que je ne le détruise pas
  alternative: pour empêcher sa destruction
  rationale: Le sujet à la première personne demeure explicite dans שַׁחֲתָהּ. La traduction maintient donc la déclaration selon laquelle Dieu serait l’agent de la destruction, sans en atténuer la tension théologique.
translation_notes:
  register: Français international moderne, sobre et digne. Le présent après « un homme qui » (« répare ») pourrait suggérer une caractéristique recherchée, mais le subjonctif coordonné « se tienne » rend naturellement l’objet de la recherche. « Sur la brèche » garde l’image militaire concrète et reste idiomatique.
