  terminology: 'La terminologie est cohérente : « loi », « profané », « saint », « ordinaire », « impur », « pur » et « sabbats » rendent les catégories sacerdotales sans imposer d’interprétation confessionnelle. Les deux notes conservent de manière appropriée les possibilités lexicales de « profane » et de « traité comme profane ».'
