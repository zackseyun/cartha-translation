  source_fidelity: 'Le texte rend fidèlement les accusations sacerdotales : « ont fait violence à ma loi » conserve la force de חמס, « ont profané mes choses saintes » respecte le pluriel large de קָדָשַׁי, et les distinctions entre saint/ordinaire et impur/pur sont maintenues sans les moraliser. « Ils ont fermé les yeux sur mes sabbats » exprime bien le refus délibéré impliqué par l’idiome hébreu. La clausule passive « j’ai été profané au milieu d’eux » correspond au sens contextuel le plus probable de וָאֵחַל.'
