source:
  edition: WLC
  text: כֹּהֲנֶ֜י/הָ חָמְס֣וּ תוֹרָתִ/י֮ וַ/יְחַלְּל֣וּ קָדָשַׁ/י֒ בֵּֽין קֹ֤דֶשׁ לְ/חֹל֙ לֹ֣א הִבְדִּ֔ילוּ וּ/בֵין הַ/טָּמֵ֥א לְ/טָה֖וֹר לֹ֣א הוֹדִ֑יעוּ וּ/מִ/שַׁבְּתוֹתַ/י֙ הֶעְלִ֣ימוּ עֵֽינֵי/הֶ֔ם וָ/אֵחַ֖ל בְּ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/026.yaml
  text: Her priests have done violence to my law and have profaned my holy things[a]. They have not distinguished between the holy and the common, and they have not made known the difference between the unclean and the clean. They have hidden their eyes from my Sabbaths[b], and I have been profaned among them.
translation:
  language: fr
  text: Ses prêtres ont fait violence à ma loi et ont profané mes choses saintes. Ils n’ont pas distingué ce qui est saint de ce qui est ordinaire[a], et ils n’ont pas fait connaître la différence entre ce qui est impur et ce qui est pur. Ils ont fermé les yeux sur mes sabbats, et j’ai été profané au milieu d’eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ce qui est profane ». Ici, le terme hébreu désigne plus précisément ce qui est commun ou ordinaire, par opposition à ce qui est saint.
    reason: lexical_alternative
  - marker: b
    text: Ou « j’ai été traité comme profane au milieu d’eux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: חָמְסוּ
  choice: ont fait violence à
  rationale: Cette expression conserve la force de חמס, qui évoque une atteinte violente ou abusive, plutôt qu’une simple désobéissance à la loi.
- source_word: תוֹרָתִי
  choice: ma loi
  rationale: Dans cette accusation visant les prêtres, « loi » rend naturellement la Torah comme norme divine qu’ils devaient observer et enseigner.
- source_word: וַיְחַלְּלוּ
  choice: ont profané
  rationale: Le piel de חלל exprime la profanation de ce qui appartient au domaine saint.
- source_word: קָדָשַׁי
  choice: mes choses saintes
  rationale: Le pluriel désigne largement les réalités consacrées à Dieu sans le limiter aux offrandes, au sanctuaire ou à un autre référent particulier.
- source_word: בֵּין קֹדֶשׁ לְחֹל
  choice: ce qui est saint de ce qui est ordinaire
  rationale: חֹל désigne ici ce qui n’est pas consacré, par opposition au saint, sans nécessairement impliquer une faute morale ou une attitude irrespectueuse.
- source_word: הִבְדִּילוּ
  choice: n’ont pas distingué
  rationale: Le verbe exprime le devoir sacerdotal d’établir et de respecter les distinctions cultuelles.
- source_word: וּבֵין הַטָּמֵא לְטָהוֹר
  choice: entre ce qui est impur et ce qui est pur
  rationale: « Impur » et « pur » sont les termes français naturels pour les catégories rituelles exprimées par טָמֵא et טָהוֹר.
- source_word: הוֹדִיעוּ
  choice: n’ont pas fait connaître la différence
  rationale: Cette formulation reste proche du sens causatif de ידע, « faire connaître », tout en explicitant naturellement l’objet de la distinction en français.
- source_word: וּמִשַׁבְּתוֹתַי
  choice: sur mes sabbats
  rationale: Le pluriel hébreu est conservé et renvoie aux observances récurrentes appartenant à Dieu.
- source_word: הֶעְלִימוּ עֵינֵיהֶם
  choice: ont fermé les yeux sur
  rationale: L’expression française transmet clairement l’image hébraïque et l’idée d’un refus délibéré de tenir compte des sabbats.
- source_word: וָאֵחַל
  choice: j’ai été profané
  rationale: 'La forme est comprise comme passive : par la conduite des prêtres, Dieu est traité sans le respect dû à sa sainteté.'
- source_word: בְּתוֹכָם
  choice: au milieu d’eux
  rationale: La formulation conserve la dimension communautaire et spatiale de l’expression hébraïque.
theological_decisions:
- issue: Sens de חֹל dans la distinction sacerdotale
  choice: ordinaire
  alternative: profane
  rationale: 'Le contraste porte d’abord sur le statut cultuel : ce qui est ordinaire ou non consacré s’oppose à ce qui est saint. « Ordinaire » évite de présenter tout ce qui n’est pas saint comme moralement mauvais, tandis qu’une note préserve le rendu traditionnel « profane ».'
- issue: Voix et sens de וָאֵחַל
  choice: 'passif : « j’ai été profané au milieu d’eux »'
  alternative: « j’ai été traité comme profane au milieu d’eux »
  rationale: Le contexte présente la profanation du nom et de la sainteté de Dieu comme la conséquence des manquements sacerdotaux. Le passif maintient cette tension sans suggérer que Dieu devient lui-même impur.
translation_notes:
  register: Français international moderne, digne et accessible. Le texte conserve les images fortes de l’hébreu (« faire violence à », « fermer les yeux ») ainsi que le vocabulaire sacerdotal de la sainteté et de la pureté, sans moraliser indûment les catégories cultuelles.
