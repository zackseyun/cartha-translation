source:
  edition: WLC
  text: אָ֤ב וָ/אֵם֙ הֵקַ֣לּוּ בָ֔/ךְ לַ/גֵּ֛ר עָשׂ֥וּ בַ/עֹ֖שֶׁק בְּ/תוֹכֵ֑/ךְ יָת֥וֹם וְ/אַלְמָנָ֖ה ה֥וֹנוּ בָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/007.yaml
  text: In you they have treated father and mother with contempt[a]; in your midst they have oppressed the sojourner[c][b]; in you they have defrauded the fatherless and the widow.
translation:
  language: fr
  text: Chez toi, on traite père et mère avec mépris ; au milieu de toi, on opprime l’immigré[a] ; chez toi, on exploite l’orphelin[b] et la veuve.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’étranger résident » ; le terme désigne un non-natif établi au sein de la communauté.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « celui qui est privé de père » ; on peut aussi traduire « l’enfant sans père ».
    reason: lexical_alternative
  - marker: c
    text: L’expression « chez toi », répétée, ainsi que « au milieu de toi », s’adressent directement à Jérusalem, personnifiée comme une femme.
    reason: cultural_note
lexical_decisions:
- source_word: הֵקַלּוּ
  choice: on traite ... avec mépris
  rationale: Le hiphil de קלל signifie ici tenir pour peu, déshonorer ou mépriser. Cette formulation française est naturelle et conserve la force morale de l’accusation.
- source_word: אָב וָאֵם
  choice: père et mère
  rationale: L’hébreu nomme explicitement les deux, ce qui maintient l’écho au langage du commandement plutôt que de généraliser par « les parents ».
- source_word: בָךְ
  choice: chez toi
  rationale: Le pronom féminin singulier s’adresse directement à Jérusalem personnifiée. « Chez toi » rend idiomatiquement le lieu social tout en préservant la répétition rhétorique.
- source_word: לַגֵּר
  choice: l’immigré
  rationale: גֵּר désigne un non-natif établi au sein de la communauté. « Immigré » est courant en français moderne et souligne sa résidence parmi le peuple, sans le réduire à un simple visiteur.
- source_word: עָשׂוּ בָעֹשֶׁק
  choice: on opprime
  rationale: L’expression, littéralement « agir par oppression/extorsion », décrit un traitement abusif et exploiteur. « Opprimer » en donne le sens avec concision.
- source_word: בְּתוֹכֵךְ
  choice: au milieu de toi
  rationale: Cette traduction conserve l’image spatiale de תוֹךְ et souligne que l’injustice se commet au cœur même de la ville.
- source_word: יָתוֹם וְאַלְמָנָה
  choice: l’orphelin et la veuve
  rationale: Ces termes français naturels conservent les catégories particulières de personnes protégées dans la loi biblique. יָתוֹם peut plus précisément évoquer celui qui est privé de père, d’où la note.
- source_word: הוֹנוּ
  choice: on exploite
  rationale: Le hiphil de ינה exprime l’idée de léser, maltraiter ou exploiter. « Exploiter » convient aux abus sociaux et économiques sans restreindre le terme à la fraude financière.
theological_decisions:
- issue: Terminologie socio-éthique relative aux personnes vulnérables
  choice: 'Conserver les catégories précises : l’immigré, l’orphelin et la veuve.'
  alternative: Employer une désignation générale telle que « les personnes vulnérables », ou traduire גֵּר par « étranger » / « résident étranger ».
  rationale: Le verset dénonce des violations envers des groupes expressément protégés dans la loi d’Israël. Les nommer maintient la portée intertextuelle sans ajouter d’interprétation doctrinale.
- issue: Personnification féminine de Jérusalem
  choice: Conserver l’adresse directe répétée par « chez toi » et « au milieu de toi ».
  alternative: Expliciter « à Jérusalem » ou reformuler impersonnellement « dans la ville ».
  rationale: Les suffixes féminins singuliers du texte hébreu interpellent directement la ville personnifiée ; l’explicitation dans le corps du verset effacerait cet effet rhétorique.
translation_notes:
  register: Français international moderne, digne et accessible. Le présent de narration rend la série d’accusations hébraïques avec vigueur. La répétition locative est maintenue sous deux formes naturelles afin de conserver l’interpellation de la ville.
