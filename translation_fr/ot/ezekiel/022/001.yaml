  text: 'La parole de Yahvé me fut adressée en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans cette formule prophétique, la forme narrative de היה introduit la réception de la parole divine. « Me fut adressée » rend naturellement en français l’idée que la parole parvint au prophète.
- source_word: דְבַר
  choice: la parole
  rationale: Dans l’expression construite דְבַר יְהוָה, « la parole » conserve le terme récurrent de la révélation prophétique sans le réduire à un simple message.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française courante « Yahvé » représente le nom divin YHWH plutôt que de lui substituer le titre « le Seigneur ».
- source_word: אֵלַי
  choice: me
  rationale: Le pronom indirect dans « me fut adressée » exprime de manière idiomatique la direction vers le prophète indiquée par אֵלַי.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'L’infinitif introduit les paroles directes qui suivent. « En ces termes : » est naturel et dignifié en français, tout en évitant le calque pesant « disant ».'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom propre YHWH. « Yahvé » le conserve explicitement selon l’usage français, tandis que « le SEIGNEUR » représente la substitution traditionnelle par un titre.
translation_notes:
  register: Français international moderne, sobre et dignifié. La formule prophétique est rendue idiomatiquement; les deux-points annoncent directement l’oracle du verset suivant.
