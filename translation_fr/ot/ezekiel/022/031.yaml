id: EZK.22.31
reference: Ezekiel 22:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וָ/אֶשְׁפֹּ֤ךְ עֲלֵי/הֶם֙ זַעְמִ֔/י בְּ/אֵ֥שׁ עֶבְרָתִ֖/י כִּלִּיתִ֑י/ם דַּרְכָּ/ם֙ בְּ/רֹאשָׁ֣/ם נָתַ֔תִּי נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/031.yaml
  text: So I poured out my indignation on them[a]; with the fire of my wrath I consumed them. I have put their way on their own heads[c][b], declares the Lord GOD.
translation:
  language: fr
  text: Alors j’ai déversé sur eux mon indignation ; je les ai consumés par le feu de ma fureur. J’ai fait retomber leur conduite sur leur propre tête[a], déclare le Seigneur Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « J’ai mis leur conduite sur leur tête. » Cette expression évoque les conséquences de leurs actes qui retombent sur eux.'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : Adonaï YHWH, c’est-à-dire « le Seigneur Yahweh ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁפֹּךְ עֲלֵיהֶם זַעְמִי
  choice: j’ai déversé sur eux mon indignation
  rationale: « Déverser » conserve la métaphore de שׁפך, tandis qu’« indignation » exprime la colère morale et judiciaire portée par זַעַם.
- source_word: בְּאֵשׁ עֶבְרָתִי
  choice: par le feu de ma fureur
  rationale: La préposition בְּ a ici une valeur instrumentale. « Fureur » restitue la force dעֶבְרָה, et l’image du feu demeure explicite.
- source_word: כִּלִּיתִים
  choice: je les ai consumés
  rationale: Le piel de כלה peut signifier achever, anéantir ou consumer. « Consumer » convient particulièrement à l’image du feu, sans exclure l’idée de destruction complète.
- source_word: דַּרְכָּם בְּרֹאשָׁם נָתַתִּי
  choice: J’ai fait retomber leur conduite sur leur propre tête
  rationale: « Conduite » rend le sens figuré de דֶּרֶךְ. La formulation française conserve l’image de la tête tout en communiquant naturellement l’idée de rétribution.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclare le Seigneur Yahweh
  rationale: « Déclare » rend clairement la formule prophétique נְאֻם. « Yahweh » représente directement le nom divin יהוה et évite l’expression artificielle « Seigneur SEIGNEUR ».
theological_decisions:
- issue: Langage du jugement divin
  choice: Conserver les termes forts « indignation », « fureur » et l’image de la conduite retombant sur la tête des coupables.
  alternative: Atténuer par « mécontentement », « colère » ou une formulation générale du châtiment.
  rationale: L’hébreu attribue explicitement à Dieu une colère judiciaire intense et une rétribution correspondant à la conduite du peuple ; il ne convient pas d’en réduire la force.
- issue: Forme de la rétribution
  choice: « J’ai fait retomber leur conduite sur leur propre tête »
  alternative: « Je leur ai rendu selon leur conduite »
  rationale: La formulation retenue préserve l’image prophétique concrète du texte sans trancher au-delà de ce qu’elle affirme sur le rapport entre les actes et leurs conséquences.
- issue: Nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Cette solution distingue le titre אֲדֹנָי du nom propre יהוה et rend visible le nom divin présent dans le texte hébreu.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme bref et solennel du jugement prophétique est conservé. Le passé composé présente les actes comme accomplis, conformément aux formes verbales du passage et à son contexte.
