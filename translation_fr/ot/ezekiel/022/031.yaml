  source_fidelity: 'Le texte rend fidèlement les trois propositions hébraïques : le déversement de l’indignation sur eux, leur consumation par le feu de la fureur divine, puis le retour de leur conduite sur leur tête. « Leur conduite » explicite justement le sens figuré du singulier collectif דַּרְכָּם sans ajouter de détail doctrinal. « J’ai fait retomber » transmet naturellement l’idiome rétributif tout en préservant son image.'
