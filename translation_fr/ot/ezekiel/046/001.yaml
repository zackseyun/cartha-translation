source:
  edition: WLC
  text: כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ שַׁ֜עַר הֶ/חָצֵ֤ר הַ/פְּנִימִית֙ הַ/פֹּנֶ֣ה קָדִ֔ים יִהְיֶ֣ה סָג֔וּר שֵׁ֖שֶׁת יְמֵ֣י הַֽ/מַּעֲשֶׂ֑ה וּ/בְ/י֤וֹם הַ/שַּׁבָּת֙ יִפָּתֵ֔חַ וּ/בְ/י֥וֹם הַ/חֹ֖דֶשׁ יִפָּתֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/001.yaml
  text: 'Thus says the Lord GOD: The gate of the inner court that faces east shall be shut during the six working days[a], but on the Sabbath day it shall be opened, and on the day of the new moon it shall be opened.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahvé : « La porte de la cour intérieure qui donne à l’est restera fermée pendant les six jours de travail. Mais le jour du sabbat, elle sera ouverte, et le jour de la nouvelle lune[a], elle sera ouverte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de la célébration mensuelle marquant le début du nouveau mois.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique française consacrée, digne et naturelle, qui conserve la solennité de la formule de messager.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahvé
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה, sans produire la répétition maladroite « le Seigneur SEIGNEUR ».
- source_word: שַׁעַר הֶחָצֵר הַפְּנִימִית
  choice: La porte de la cour intérieure
  rationale: Restitue directement la chaîne construite dans le contexte architectural du Temple.
- source_word: הַפֹּנֶה קָדִים
  choice: qui donne à l’est
  rationale: Expression française naturelle pour indiquer l’orientation d’une porte ou d’un accès.
- source_word: יִהְיֶה סָגוּר
  choice: restera fermée
  rationale: Le verbe היה avec l’adjectif passif exprime ici un état maintenu; « restera fermée » le communique clairement.
- source_word: שֵׁשֶׁת יְמֵי הַמַּעֲשֶׂה
  choice: pendant les six jours de travail
  rationale: Exprime les jours ordinaires consacrés au travail, en contraste avec le sabbat.
- source_word: וּבְיוֹם הַשַּׁבָּת
  choice: Mais le jour du sabbat
  rationale: Le « mais » rend explicitement le contraste contextuel introduit par la conjonction hébraïque.
- source_word: יִפָּתֵחַ
  choice: elle sera ouverte
  rationale: Conserve la valeur passive du nifal et la répétition intentionnelle du verbe dans les deux propositions.
- source_word: וּבְיוֹם הַחֹדֶשׁ
  choice: et le jour de la nouvelle lune
  rationale: Dans ce contexte cultuel et calendaire, חֹדֶשׁ désigne la nouvelle lune, et non simplement le mois.
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahvé
  alternative: le Seigneur DIEU
  rationale: Le texte associe le titre אֲדֹנָי au nom propre יהוה. « Yahvé » préserve cette distinction, tandis que « DIEU » remplace le nom par un titre.
translation_notes:
  register: Français international moderne, clair et solennel. La répétition de « elle sera ouverte » est maintenue parce qu’elle correspond à la structure insistante de l’hébreu. Le marqueur [a] est placé après « nouvelle lune », expression qu’il explique.
