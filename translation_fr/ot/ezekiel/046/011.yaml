  text: וּ/בַ/חַגִּ֣ים וּ/בַ/מּוֹעֲדִ֗ים תִּהְיֶ֤ה הַ/מִּנְחָה֙ אֵיפָ֤ה לַ/פָּר֙ וְ/אֵיפָ֣ה לָ/אַ֔יִל וְ/לַ/כְּבָשִׂ֖ים מַתַּ֣ת יָד֑/וֹ וְ/שֶׁ֖מֶן הִ֥ין לָ/אֵיפָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/011.yaml
  text: At the festivals and the appointed times[a], the grain offering shall be one ephah for the bull and one ephah for the ram, and for the lambs as much as he is able to give, with a hin of oil to each ephah.
translation:
  language: fr
  text: Lors des fêtes et des temps fixés, l’offrande de céréales sera d’un épha pour le taureau, d’un épha pour le bélier et, pour les agneaux, selon ses moyens[a], avec un hin d’huile par épha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour les agneaux, le don de sa main », expression signifiant qu’il donne selon ses moyens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחַגִּים וּבַמּוֹעֲדִים
  choice: Lors des fêtes et des temps fixés
  rationale: Cette formulation distingue חַגִּים, les célébrations festives, de מוֹעֲדִים, les temps déterminés du calendrier cultuel, sans les réduire à un seul terme.
- source_word: תִּהְיֶה הַמִּנְחָה
  choice: l’offrande de céréales sera
  rationale: Dans ce contexte sacrificiel, מִנְחָה désigne l’offrande végétale mesurée en éphas et accompagnée d’huile.
- source_word: אֵיפָה לַפָּר וְאֵיפָה לָאַיִל
  choice: d’un épha pour le taureau, d’un épha pour le bélier
  rationale: La formulation conserve la mesure ancienne et le parallélisme de la prescription hébraïque.
- source_word: וְלַכְּבָשִׂים מַתַּת יָדוֹ
  choice: pour les agneaux, d’une quantité à la mesure de ses moyens
  rationale: L’expression littérale « le don de sa main » est un idiome indiquant une quantité proportionnée à ce que la personne peut donner.
- source_word: וְשֶׁמֶן הִין לָאֵיפָה
  choice: avec un hin d’huile par épha
  rationale: « Par épha » rend clairement la valeur distributive de la prescription, selon laquelle chaque épha de céréales est accompagné d’un hin d’huile.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Les unités anciennes « épha » et « hin » sont conservées afin de ne pas introduire de conversion approximative. La distinction entre « fêtes » et « temps fixés » reflète les deux termes hébreux.
