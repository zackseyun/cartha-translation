  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹא יִקַּ֨ח הַ/נָּשִׂ֜יא מִ/נַּחֲלַ֣ת הָ/עָ֗ם לְ/הֽוֹנֹתָ/ם֙ מֵ/אֲחֻזָּתָ֔/ם מֵ/אֲחֻזָּת֖/וֹ יַנְחִ֣ל אֶת בָּנָ֑י/ו לְמַ֨עַן֙ אֲשֶׁ֣ר לֹֽא יָפֻ֣צוּ עַמִּ֔/י אִ֖ישׁ מֵ/אֲחֻזָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/018.yaml
  text: The prince shall not take any of the people's inheritance[a], thrusting them out of their property. He shall give his sons an inheritance out of his own property, so that my people may not be scattered[b], each man from his property.
translation:
  language: fr
  text: Le prince ne prélèvera pas sur l’héritage du peuple pour les opprimer[a] en les dépouillant de leurs biens fonciers. Il donnera à ses fils un héritage provenant de ses propres biens fonciers, afin que mon peuple ne soit pas dispersé[b], chacun hors de ses biens fonciers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les léser » ou « les frauder ».'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « chacun » (littéralement « homme ») ; l’expression a ici une valeur distributive.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּשִׂיא
  choice: le prince
  rationale: Dans Ézéchiel, נָשִׂיא désigne de façon caractéristique le dirigeant civil, sans l’identifier simplement à un roi.
- source_word: יִקַּח מִנַּחֲלַת הָעָם
  choice: ne prendra rien sur l’héritage du peuple
  rationale: La construction avec מִן exprime un prélèvement sur ce qui revient au peuple; « rien sur » rend naturellement en français la portée négative et le contexte foncier.
- source_word: לְהוֹנֹתָם מֵאֲחֻזָּתָם
  choice: en les dépouillant de leur propriété
  rationale: Le hifil de ינה évoque ici l’exploitation ou le tort causé au peuple, tandis que מֵאֲחֻזָּתָם précise la dépossession foncière. « Dépouiller » exprime ensemble l’oppression et son effet sans réduire le verbe à une simple fraude.
- source_word: מֵאֲחֻזָּתוֹ יַנְחִל אֶת־בָּנָיו
  choice: C’est sur sa propre propriété qu’il donnera un héritage à ses fils
  rationale: Le hifil de נחל signifie faire hériter ou donner en héritage; la tournure emphatique souligne le contraste entre le domaine du prince et celui du peuple.
- source_word: לְמַעַן אֲשֶׁר לֹא יָפֻצוּ
  choice: afin que ... ne soient pas dispersés
  rationale: פּוּץ conserve l’image d’une dispersion; le contexte foncier indique qu’elle résulterait de la dépossession, sans que le verbe précise à lui seul le procédé.
- source_word: עַמִּי אִישׁ מֵאֲחֻזָּתוֹ
  choice: les membres de mon peuple ... chacun loin de sa propriété
  rationale: אִישׁ a une valeur distributive. « Les membres de mon peuple » permet un accord français naturel, et « chacun » conserve explicitement la portée individuelle; מִן après un verbe de dispersion indique l’éloignement hors de la propriété.
theological_decisions:
- issue: Valeur distributive de אִישׁ
  choice: chacun
  alternative: chaque homme
  rationale: Dans cette construction, אִישׁ distribue l’action parmi les membres du peuple plutôt qu’il ne met l’accent sur leur sexe. « Chacun » conserve cette valeur grammaticale avec une formulation française naturelle, sans modifier la portée du texte.
translation_notes:
  register: Français international moderne, digne et direct. Le vocabulaire foncier est maintenu par « héritage » et « propriété ». La répétition de « propriété » reflète celle de אֲחֻזָּה et rend clairement l’opposition entre le domaine du prince et les biens du peuple.
