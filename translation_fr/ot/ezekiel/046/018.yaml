revisions:
- from: Le prince ne prendra rien sur l’héritage du peuple en les dépouillant de leur propriété. C’est sur sa propre propriété qu’il donnera un héritage à ses fils, afin que les membres de mon peuple ne soient pas dispersés, chacun loin de sa propriété.
  to: Le prince ne prélèvera pas sur l’héritage du peuple pour les opprimer[a] en les dépouillant de leurs biens fonciers. Il donnera à ses fils un héritage provenant de ses propres biens fonciers, afin que mon peuple ne soit pas dispersé[b], chacun hors de ses biens fonciers.
  rationale: La révision corrige la construction française liée à la provenance de l’héritage, élimine des ajouts ou des explicitations non nécessaires, et conserve le parallélisme des possessions foncières du peuple et du prince. Elle distingue « opprimer » de la dépossession qui en est le moyen contextuel, tout en signalant les alternatives lexicales sans imposer une lecture plus étroite.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:01:15Z'
review_pass:
  verdict: revise
  source_fidelity: 'La draft rend correctement le prince, l’interdiction de prendre sur l’héritage du peuple, la transmission aux fils à partir du bien propre du prince et le but d’éviter la dispersion. Toutefois, « rien sur » est moins précis que « ne prélèvera pas sur », et « C’est sur sa propre propriété » est une construction française fautive dans ce sens : la préposition requise est « de ». « Les membres de mon peuple » ajoute une notion absente de עַמִּי, tandis que « loin de » explicite davantage que le simple מִן (« hors de »).'
  naturalness: La version révisée emploie un français moderne, clair et soutenu. « Biens fonciers » rend explicitement le cadre de tenure de אֲחֻזָּה sans l’ambiguïté moderne de « propriété », et la répétition maintient le contraste voulu.
  terminology: « Prince » convient au titre technique נָשִׂיא. « Héritage », « biens fonciers » et « donner en héritage » préservent le vocabulaire juridique et foncier. Le sens d’exploitation de להונותם est conservé en texte, avec les autres sens lexicaux possibles en note.
  issues:
  - severity: medium
    issue: Construction « C’est sur sa propre propriété qu’il donnera un héritage »
    rationale: Le texte hébreu emploie מֵאֲחֻזָּתוֹ, « de/à partir de sa propre possession ». En français, « sur sa propriété » ne peut pas introduire naturellement la source de l’héritage.
  - severity: low
    issue: « les membres de mon peuple » et « loin de sa propriété »
    rationale: « Membres » est ajouté au texte, et « loin de » interprète la préposition מן de façon plus spatiale que nécessaire. « Mon peuple ... chacun hors de ses biens fonciers » est à la fois plus direct et plus proche de la formulation hébraïque.
  - severity: low
    issue: Absence de notes correspondant aux ambiguïtés lexicales signalées dans l’audit anglais
    rationale: Une note sur « opprimer » préserve les sens possibles de להונותם; une note sur « chacun » indique la valeur distributive de איש.
