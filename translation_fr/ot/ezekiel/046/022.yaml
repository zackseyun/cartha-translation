base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/022.yaml
  text: In the four corners of the court there were enclosed courts[a], forty long and thirty wide[c][b]; the four of them had the same measurement.
translation:
  language: fr
  text: Aux quatre coins de la cour se trouvaient des cours encloses[a], longues de quarante et larges de trente[b]. Toutes les quatre avaient les mêmes dimensions[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cours entourées de murs » ou « cours isolées ». L’adjectif hébreu décrit probablement des espaces clos.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu ne répète pas ici l’unité de mesure. D’après les mesures du temple données dans le contexte, il s’agit vraisemblablement de coudées.
    reason: cultural_note
  - marker: c
    text: Le dernier mot hébreu est rare et difficile. Il pourrait aussi souligner que ces quatre cours étaient aménagées dans les coins.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֹעוֹת
  choice: coins
  rationale: Dans ce contexte architectural, le nom désigne les coins ou secteurs d’angle de la grande cour. « Coins » est naturel et précis en français.
- source_word: חֲצֵרוֹת
  choice: cours
  rationale: Le pluriel désigne de petites cours aménagées à l’intérieur du vaste ensemble du temple. « Cours » convient au vocabulaire architectural.
- source_word: קְטֻרוֹת
  choice: fermées
  rationale: L’adjectif décrit probablement des espaces clos ou isolés. « Fermées » rend cette idée sans préciser indûment qu’elles étaient entourées de murs.
- source_word: אַרְבָּעִים אֹרֶךְ וּשְׁלֹשִׁים רֹחַב
  choice: longues de quarante et larges de trente
  rationale: L’hébreu exprime les dimensions de manière elliptique. Cette formulation française restitue naturellement la longueur et la largeur sans ajouter dans le texte l’unité implicite.
- source_word: מִדָּה אַחַת
  choice: les mêmes dimensions
  rationale: L’expression indique que les quatre cours avaient une mesure identique. Le pluriel français convient puisque deux dimensions viennent d’être données.
- source_word: לְאַרְבַּעְתָּם
  choice: toutes les quatre
  rationale: Le suffixe renvoie aux quatre cours situées dans les coins. Cette reprise est idiomatique en français.
- source_word: מְהֻקְצָעוֹת
  choice: avaient
  rationale: La forme finale, rare et difficile, semble rappeler leur situation aux coins ou leur disposition correspondante. La traduction principale privilégie le sens contextuel de dimensions communes, tandis qu’une note conserve l’incertitude lexicale.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La phrase est divisée en deux pour alléger la description architecturale. « Cours fermées » reste accessible tout en conservant l’incertitude sur la nature exacte de leur clôture; les notes signalent l’unité implicite et la difficulté du dernier terme hébreu.
