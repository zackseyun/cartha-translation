source:
  edition: WLC
  text: וְ/כִֽי יִתֵּ֨ן מַתָּנָ֜ה מִ/נַּחֲלָת֗/וֹ לְ/אַחַד֙ מֵֽ/עֲבָדָ֔י/ו וְ/הָ֤יְתָה לּ/וֹ֙ עַד שְׁנַ֣ת הַ/דְּר֔וֹר וְ/שָׁבַ֖ת לַ/נָּשִׂ֑יא אַ֚ךְ נַחֲלָת֔/וֹ בָּנָ֖י/ו לָ/הֶ֥ם תִּהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/017.yaml
  text: But if he gives a gift from his inheritance to one of his servants[a], it shall belong to him until the year of liberty; then it shall return to the prince. Only his inheritance belongs to his sons; it shall be theirs.
translation:
  language: fr
  text: Mais s’il fait don d’une partie de son héritage à l’un de ses serviteurs, elle lui appartiendra jusqu’à l’année de la libération[a] ; ensuite, elle reviendra au prince. Seuls ses fils auront son héritage ; il sera à eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’année de la remise en liberté ». Il s’agit probablement d’une année de restauration comparable à celle du jubilé, bien que l’hébreu emploie ici le mot « libération » et non le terme habituel pour « jubilé ».
    reason: Signale l’alternative lexicale et évite d’identifier sans réserve cette année au jubilé alors que le texte emploie un autre terme.
lexical_decisions:
- source_word: וְכִי
  choice: Mais s’il
  rationale: Introduit un cas conditionnel qui contraste avec la règle du verset précédent.
- source_word: מַתָּנָה מִנַּחֲלָתוֹ
  choice: don d’une partie de son héritage
  rationale: Le complément partitif indique que le don est prélevé sur le patrimoine héréditaire du prince ; cette formulation est plus naturelle en français que « un don de son héritage ».
- source_word: לְאַחַד מֵעֲבָדָיו
  choice: à l’un de ses serviteurs
  rationale: עבד peut désigner un serviteur ou un esclave. « Serviteur » convient ici au contraste juridique entre les fils et les personnes au service du prince, sans préciser davantage que le texte leur statut exact.
- source_word: וְהָיְתָה לּוֹ
  choice: elle lui appartiendra
  rationale: Le pronom féminin reprend la part d’héritage donnée et exprime une possession réelle mais limitée dans le temps.
- source_word: עַד שְׁנַת הַדְּרוֹר
  choice: jusqu’à l’année de la libération
  rationale: דְּרוֹר signifie « libération » ou « remise en liberté ». La traduction conserve ce terme au lieu de le remplacer directement par « jubilé ».
- source_word: וְשָׁבַת לַנָּשִׂיא
  choice: ensuite, elle reviendra au prince
  rationale: שׁוב exprime le retour du bien à son détenteur initial ; « prince » est le terme cohérent pour נָשִׂיא dans cette vision d’Ézéchiel.
- source_word: אַךְ נַחֲלָתוֹ בָּנָיו לָהֶם תִּהְיֶה
  choice: Seul son héritage accordé à ses fils leur appartiendra
  rationale: La formulation française explicite sobrement le rapport elliptique entre l’héritage et les fils, tout en conservant la restriction marquée par אַךְ et l’insistance sur leur possession.
theological_decisions:
- issue: Statut désigné par עבד
  choice: serviteurs
  alternative: esclaves
  rationale: Le mot hébreu permet les deux sens. Le contexte oppose surtout une attribution temporaire à un membre dépendant de la maison à l’attribution héréditaire aux fils ; « serviteurs » préserve cette opposition sans trancher inutilement le statut juridique précis.
- issue: Sens de דְּרוֹר
  choice: libération
  alternative: remise en liberté ; jubilé
  rationale: Le passage évoque vraisemblablement une année de restauration comparable au jubilé, mais n’emploie pas le terme hébreu habituel יוֹבֵל. Le texte principal conserve donc le sens lexical de דְּרוֹר, avec une note explicative.
translation_notes:
  register: Français international moderne, clair et digne. Le style juridique demeure lisible ; les pronoms féminins renvoient à la partie d’héritage donnée. Le marqueur de note est placé après « l’année de la libération », expression à laquelle la note se rapporte.
