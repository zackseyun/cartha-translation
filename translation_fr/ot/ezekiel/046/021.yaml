base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/021.yaml
  text: Then he brought me out to the outer court and led me past the four corners of the court[a], and behold, in each corner of the court there was a court.
translation:
  language: fr
  text: Puis il me fit sortir dans la cour extérieure et me fit passer devant les quatre coins de la cour[a]. Et voici, il y avait une cour dans chaque coin de la cour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu répète littéralement : « une cour dans le coin de la cour, une cour dans le coin de la cour », après avoir mentionné les quatre coins. Le sens est distributif : il y avait une cour dans chacun des quatre coins.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵנִי
  choice: Puis il me fit sortir
  rationale: Le hiphil de יצא avec suffixe de première personne signifie « faire sortir ». « Puis » rend naturellement la progression narrative du waw.
- source_word: הֶחָצֵר הַחִיצֹנָה
  choice: vers la cour extérieure
  rationale: חָצֵר désigne ici la cour du complexe du temple, et חִיצֹנָה la qualifie d’extérieure. La préposition אֶל marque le mouvement vers cette cour.
- source_word: וַיַּעֲבִירֵנִי
  choice: me fit passer par
  rationale: Le hiphil de עבר exprime le fait de faire passer ou de conduire à travers un espace. « Me fit passer par » conserve cette idée de déplacement guidé sans réduire le verbe à une simple arrivée.
- source_word: אַרְבַּעַת מִקְצוֹעֵי הֶחָצֵר
  choice: les quatre coins de la cour
  rationale: מִקְצוֹעַ désigne un coin ou un angle architectural ; « les quatre coins » est l’expression française naturelle.
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: La formule attire soudainement l’attention sur ce que le prophète découvre et conserve le relief visionnaire du texte.
- source_word: חָצֵר בְּמִקְצֹעַ הֶחָצֵר חָצֵר בְּמִקְצֹעַ הֶחָצֵר
  choice: dans chaque coin de la cour, il y avait une cour
  rationale: Après la mention explicite des quatre coins, la répétition hébraïque a un sens distributif. La formulation française en exprime naturellement le sens, tandis que la note signale la forme littérale.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Cour » maintient le vocabulaire architectural du temple. « Et voici » conserve la marque d’attention propre au récit visionnaire, tandis que la légère explicitation distributive évite en français une répétition potentiellement trompeuse.
