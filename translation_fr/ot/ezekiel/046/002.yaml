  text: וּ/בָ֣א הַ/נָּשִׂ֡יא דֶּרֶךְ֩ אוּלָ֨ם הַ/שַּׁ֜עַר מִ/ח֗וּץ וְ/עָמַד֙ עַל מְזוּזַ֣ת הַ/שַּׁ֔עַר וְ/עָשׂ֣וּ הַ/כֹּהֲנִ֗ים אֶת עֽוֹלָת/וֹ֙ וְ/אֶת שְׁלָמָ֔י/ו וְ/הִֽשְׁתַּחֲוָ֛ה עַל מִפְתַּ֥ן הַ/שַּׁ֖עַר וְ/יָצָ֑א וְ/הַ/שַּׁ֥עַר לֹֽא יִסָּגֵ֖ר עַד הָ/עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/002.yaml
  text: And the prince shall enter by way of the porch of the gate from outside[a], and shall stand by the doorpost of the gate. Then the priests shall offer his burnt offering and his peace offerings, and he shall bow down in worship at the threshold of the gate. Then he shall go out, but the gate shall not be shut until evening.
translation:
  language: fr
  text: Le prince entrera de l’extérieur par le vestibule de la porte et se tiendra auprès du montant de la porte. Les prêtres offriront son holocauste et ses sacrifices de communion[a]. Il se prosternera sur le seuil de la porte, puis il sortira. Mais la porte ne sera pas fermée avant le soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifices de paix ».
    reason: Alternative lexicale traditionnelle pour שְׁלָמִים, terme qui peut évoquer la paix, l’intégrité et la communion.
lexical_decisions:
- source_word: הַנָּשִׂיא
  choice: le prince
  rationale: Dans la vision du temple d’Ézéchiel, le terme désigne un dirigeant reconnu sans l’identifier nécessairement comme roi. « Prince » maintient cette distinction et n’impose pas une lecture messianique.
- source_word: דֶּרֶךְ אוּלָם הַשַּׁעַר מִחוּץ
  choice: de l’extérieur par le vestibule de la porte
  rationale: Cette formulation naturelle conserve le point de départ extérieur et l’itinéraire passant par le vestibule.
- source_word: מְזוּזַת הַשַּׁעַר
  choice: le montant de la porte
  rationale: מְזוּזָה désigne précisément le montant ou jambage d’une ouverture; « montant » est clair en français moderne.
- source_word: וְעָשׂוּ הַכֹּהֲנִים אֶת עֹלָתוֹ
  choice: les prêtres offriront son holocauste
  rationale: Avec un sacrifice pour complément, עָשָׂה signifie accomplir ou offrir celui-ci. « Offrir » est l’expression française usuelle.
- source_word: שְׁלָמָיו
  choice: ses sacrifices de communion
  rationale: שְׁלָמִים désigne des sacrifices associés à la paix, à l’intégrité et au repas partagé. « Sacrifices de communion » est intelligible et évite de réduire le sens à la seule absence de conflit; l’équivalent traditionnel figure en note.
- source_word: וְהִשְׁתַּחֲוָה
  choice: il se prosternera
  rationale: Le verbe exprime un geste corporel d’abaissement révérencieux; dans ce cadre cultuel, « se prosterner » en conserve à la fois la force physique et religieuse.
- source_word: מִפְתַּן הַשַּׁעַר
  choice: sur le seuil de la porte
  rationale: מִפְתָּן désigne le seuil; la préposition עַל est rendue directement par « sur ».
- source_word: לֹא יִסָּגֵר עַד הָעָרֶב
  choice: ne sera pas fermée avant le soir
  rationale: Cette formulation exprime naturellement en français que la fermeture n’aura lieu qu’au soir.
theological_decisions:
- issue: Identité et statut du prince dans la vision du temple
  choice: Conserver le titre « prince » sans autre qualification.
  alternative: « dirigeant », « chef » ou identification explicite au Messie
  rationale: Le verset attribue à ce personnage un rôle cultuel particulier, mais ne le présente explicitement ni comme roi ni comme Messie. La traduction ne tranche donc pas cette question.
translation_notes:
  register: Français international moderne, digne et fluide. La syntaxe demeure proche de la progression hébraïque tout en évitant les tournures archaïques. Le vocabulaire architectural et cultuel reste précis et accessible.
