    rationale: L’hébreu עַל מְזוּזַת indique que le prince se tient au montant/auprès de celui-ci. « Près de » peut évoquer une proximité moins définie. « Auprès du montant » conserve mieux l’ancrage architectural tout en restant idiomatique.
