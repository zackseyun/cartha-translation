  verdict: revise
  source_fidelity: La traduction rend fidèlement la progression du texte hébreu, les offrandes, la prosternation et l’indication temporelle concernant la porte. Toutefois, « près du montant » affaiblit légèrement la localisation précise de עַל מְזוּזַת (« auprès de/à côté du montant »), en suggérant une simple proximité.
  naturalness: Le français est moderne, fluide et d’un registre convenant à une vision cultuelle. « Auprès du montant de la porte » est naturel et plus précis que « près du montant ».
  terminology: « Prince », « vestibule », « montant », « holocauste », « sacrifices de communion », « se prosterner » et « seuil » sont des choix exacts et cohérents. La note offre utilement l’équivalent traditionnel « sacrifices de paix » sans imposer une interprétation théologique.
  issues:
