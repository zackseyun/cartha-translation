revisions:
- from: Le prince entrera de l’extérieur par le vestibule de la porte et se tiendra près du montant de la porte. Les prêtres offriront son holocauste et ses sacrifices de communion[a]. Il se prosternera sur le seuil de la porte, puis il sortira. Mais la porte ne sera pas fermée avant le soir.
  to: Le prince entrera de l’extérieur par le vestibule de la porte et se tiendra auprès du montant de la porte. Les prêtres offriront son holocauste et ses sacrifices de communion[a]. Il se prosternera sur le seuil de la porte, puis il sortira. Mais la porte ne sera pas fermée avant le soir.
