  text: וּ/מִנְחָה֙ אֵיפָ֣ה לָ/אַ֔יִל וְ/לַ/כְּבָשִׂ֥ים מִנְחָ֖ה מַתַּ֣ת יָד֑/וֹ וְ/שֶׁ֖מֶן הִ֥ין לָ/אֵיפָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/005.yaml
  text: And the grain offering shall be an ephah with the ram[a], and with the lambs a grain offering as much as his hand can give[b], and a hin of oil with each ephah.
translation:
  language: fr
  text: L’offrande de céréales sera d’un épha avec le bélier[a] ; avec les agneaux, une offrande de céréales selon ce que sa main peut donner[b] ; et un hin d’huile par épha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour le bélier » et, plus loin, « pour les agneaux » ; dans les prescriptions sacrificielles, la préposition hébraïque peut exprimer l’association ou l’affectation.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le don de sa main », expression qui désigne ce qu’il a les moyens de donner.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: offrande de céréales
  rationale: Dans ce contexte sacrificiel, le terme désigne l’offrande végétale mesurée en éphas, et non une offrande générique.
- source_word: אֵיפָה
  choice: épha
  rationale: Cette unité ancienne de mesure sèche est translittérée afin de conserver la précision cultuelle du texte.
- source_word: לָאַיִל
  choice: avec le bélier
  rationale: La préposition rattache la quantité prescrite à l’animal offert ; « avec » exprime naturellement cette association sans exclure le sens d’allocation.
- source_word: לַכְּבָשִׂים
  choice: avec les agneaux
  rationale: Le même lien d’association ou d’allocation vaut ici, tandis que la quantité est précisée comme variable dans la proposition suivante.
- source_word: מַתַּת יָדוֹ
  choice: ce que sa main pourra donner
  rationale: Cette formulation conserve l’image concrète de la main tout en rendant clairement l’idée d’une offrande proportionnée aux moyens du donateur.
- source_word: שֶׁמֶן
  choice: huile
  rationale: Équivalent français usuel et précis dans un contexte sacrificiel.
- source_word: הִין
  choice: hin
  rationale: Cette unité ancienne de mesure liquide est translittérée pour préserver la terminologie technique du texte.
- source_word: לָאֵיפָה
  choice: par épha
  rationale: La préposition exprime ici le rapport entre la quantité d’huile et chaque épha ; « par épha » est idiomatique et précis en français.
theological_decisions:
- issue: Valeur de la préposition ל devant « bélier » et « agneaux »
  choice: avec
  alternative: pour
  rationale: Dans les prescriptions sacrificielles, la préposition peut marquer aussi bien l’association que l’affectation. Le texte principal emploie « avec », tandis qu’une note préserve explicitement l’autre lecture.
translation_notes:
  register: Français moderne, clair et digne. Les unités cultuelles anciennes « épha » et « hin » sont conservées. Le point-virgule clarifie les trois prescriptions parallèles sans atténuer la concision de l’hébreu.
