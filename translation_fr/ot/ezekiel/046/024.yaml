  text: וַ/יֹּ֖אמֶר אֵלָ֑/י אֵ֚לֶּה בֵּ֣ית הַֽ/מְבַשְּׁלִ֔ים אֲשֶׁ֧ר יְבַשְּׁלוּ שָׁ֛ם מְשָׁרְתֵ֥י הַ/בַּ֖יִת אֶת זֶ֥בַח הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/024.yaml
  text: Then he said to me[b][a], “These are the kitchens where the ministers of the temple shall boil the people's sacrifice.”
translation:
  language: fr
  text: 'Puis il me dit : « Voici les cuisines[a] où les serviteurs du Temple[b] feront cuire le sacrifice du peuple. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la maison de ceux qui font cuire » ; autre traduction possible : « les locaux de cuisson ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les desservants du Temple ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Puis il me dit
  rationale: Le waw consécutif fait progresser le récit. « Puis » exprime naturellement cette succession en français.
- source_word: בֵּית הַמְבַשְּׁלִים
  choice: les cuisines
  rationale: Littéralement, « la maison de ceux qui font cuire ». Dans ce contexte architectural, « les cuisines » désigne clairement et naturellement les locaux affectés à la cuisson.
- source_word: יְבַשְּׁלוּ
  choice: feront cuire
  rationale: Le verbe בשׁל peut signifier faire cuire ou bouillir. « Faire cuire » convient au contexte sacrificiel sans préciser un procédé que le français n'a pas besoin d'imposer.
- source_word: מְשָׁרְתֵי הַבַּיִת
  choice: les serviteurs du Temple
  rationale: Le participe désigne ceux qui assurent un service officiel, et « la Maison » renvoie ici au Temple. « Serviteurs » conserve l'idée de service sans suggérer un ministère chrétien moderne.
- source_word: זֶבַח הָעָם
  choice: les sacrifices du peuple
  rationale: זֶבַח désigne un sacrifice, notamment une victime sacrificielle. Le pluriel français est naturel pour l'ensemble des sacrifices apportés par le peuple, bien que l'hébreu emploie un singulier collectif.
- source_word: שָׁם
  choice: où
  rationale: L'adverbe locatif « là » est naturellement rendu par le relatif « où » après l'identification des cuisines.
