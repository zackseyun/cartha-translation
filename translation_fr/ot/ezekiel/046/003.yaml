reference: Ezekiel 46:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִשְׁתַּחֲו֣וּ עַם הָ/אָ֗רֶץ פֶּ֚תַח הַ/שַּׁ֣עַר הַ/ה֔וּא בַּ/שַּׁבָּת֖וֹת וּ/בֶ/חֳדָשִׁ֑ים לִ/פְנֵ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/003.yaml
  text: And the people of the land shall bow down at the entrance of that gate[a], before Yahweh[b], on the Sabbaths and on the new moons.
translation:
  language: fr
  text: Le peuple du pays[a] se prosternera à l’entrée de cette porte, devant Yahweh[b], les jours de sabbat et aux nouvelles lunes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « peuple du pays » désigne vraisemblablement ici la population laïque, par contraste avec le prince et les prêtres mentionnés dans le contexte.
    reason: cultural_note
  - marker: b
    text: Ou « le SEIGNEUR ». L’hébreu porte le nom divin יהוה (YHWH).
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִשְׁתַּחֲווּ
  choice: se prosternera
  rationale: Le verbe שׁחה décrit ici un geste corporel de révérence accompli dans un cadre cultuel. « Se prosterner » en conserve à la fois le caractère concret et la portée religieuse.
- source_word: עַם הָאָרֶץ
  choice: le peuple du pays
  rationale: Cette traduction proche de l’hébreu préserve l’expression sociale employée dans la vision du Temple, où elle désigne vraisemblablement la population laïque par contraste avec le prince et les prêtres.
- source_word: פֶּתַח הַשַּׁעַר הַהוּא
  choice: à l’entrée de cette porte
  rationale: פֶּתַח désigne l’entrée ou l’ouverture, tandis que le démonstratif הַהוּא renvoie à la porte précise décrite dans le contexte.
- source_word: בַּשַּׁבָּתוֹת
  choice: les jours de sabbat
  rationale: Cette formulation française naturelle rend le pluriel hébreu et souligne le caractère récurrent de ces jours consacrés.
- source_word: וּבֶחֳדָשִׁים
  choice: et aux nouvelles lunes
  rationale: Dans ce contexte cultuel, חֹדֶשׁ désigne les célébrations liées au début du mois, marqué par la nouvelle lune, et non simplement les mois.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי exprime la présence devant Dieu dans l’adoration, et « Yahweh » représente directement le nom divin יהוה.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » préserve le caractère personnel du nom divin, tandis que « le SEIGNEUR » reflète la tradition de substitution à la lecture.
- issue: Portée du geste exprimé par שׁחה
  choice: se prosternera
  alternative: adorera
  rationale: Le contexte implique l’adoration, mais le verbe évoque concrètement l’inclination ou la prosternation. La traduction retenue évite de supprimer cette dimension corporelle.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe est légèrement réorganisée pour être naturelle en français, sans perdre les repères spatiaux et calendaires du texte hébreu.
