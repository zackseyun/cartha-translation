  text: They shall provide the lamb, the grain offering, and the oil, morning by morning, as a regular burnt offering.
translation:
  language: fr
  text: Ils offriront l’agneau, l’offrande de céréales et l’huile, matin après matin, comme holocauste perpétuel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: Ils offriront
  rationale: Le verbe signifie littéralement « ils feront/prépareront »; dans ce contexte cultuel, « offriront » exprime naturellement l’action prescrite sans alourdir la phrase.
- source_word: הַמִּנְחָה
  choice: l’offrande de céréales
  rationale: Dans la terminologie sacrificielle, מִנְחָה désigne ici l’offrande végétale associée à l’agneau; « de céréales » est clair en français moderne.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: matin après matin
  rationale: La répétition distributive hébraïque indique que l’action se fait chaque matin.
- source_word: עוֹלַת תָּמִיד
  choice: holocauste perpétuel
  rationale: עוֹלָה est l’offrande entièrement brûlée, traditionnellement appelée « holocauste »; תָּמִיד souligne son caractère régulier et continuel.
theological_decisions:
- issue: Rapport entre les trois éléments et l’holocauste perpétuel
  choice: « comme holocauste perpétuel »
  alternative: « pour l’holocauste perpétuel »
  rationale: La construction appositive hébraïque permet de présenter l’ensemble prescrit sous la désignation d’« holocauste perpétuel »; « comme » conserve ce rapport sans imposer une finalité absente du texte.
translation_notes:
  register: Français international moderne, sobre et liturgiquement digne. La formulation conserve la répétition distributive et la terminologie sacrificielle courante.
