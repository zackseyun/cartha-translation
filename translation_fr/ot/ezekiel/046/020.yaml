  text: וַ/יֹּ֣אמֶר אֵלַ֔/י זֶ֣ה הַ/מָּק֗וֹם אֲשֶׁ֤ר יְבַשְּׁלוּ שָׁם֙ הַ/כֹּ֣הֲנִ֔ים אֶת הָ/אָשָׁ֖ם וְ/אֶת הַ/חַטָּ֑את אֲשֶׁ֤ר יֹאפוּ֙ אֶת הַ/מִּנְחָ֔ה לְ/בִלְתִּ֥י הוֹצִ֛יא אֶל הֶ/חָצֵ֥ר הַ/חִֽיצוֹנָ֖ה לְ/קַדֵּ֥שׁ אֶת הָ/עָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/020.yaml
  text: Then he said to me[a], “This is the place where the priests shall boil the guilt offering and the sin offering, and where they shall bake the grain offering, so as not to bring them out into the outer court to make the people holy.”
translation:
  language: fr
  text: 'Puis il me dit : « Voici l’endroit où les prêtres feront bouillir le sacrifice de réparation et le sacrifice pour le péché, et où ils feront cuire au four l’offrande de céréales, de peur qu’en les faisant sortir dans la cour extérieure ils ne sanctifient le peuple[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne rendent le peuple saint » ou « ne consacrent le peuple ». Le verbe hébreu signifie rendre saint ; dans ce contexte lié au temple, il évoque probablement une sainteté communiquée par le contact avec les offrandes sacrées.
    reason: Alternative lexicale et clarification du sens cultuel possible de קדש.
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Puis il me dit
  rationale: Le waw consécutif fait progresser le récit. « Puis » exprime naturellement cette succession en français.
- source_word: זֶה הַמָּקוֹם
  choice: Voici l’endroit
  rationale: Cette formulation française rend naturellement l’identification déictique du lieu montré au prophète.
- source_word: אֲשֶׁר יְבַשְּׁלוּ שָׁם הַכֹּהֲנִים
  choice: où les prêtres feront bouillir
  rationale: Dans ce contexte sacrificiel, בשל désigne vraisemblablement une cuisson dans un liquide; « feront bouillir » est plus précis que le simple « feront cuire ».
- source_word: הָאָשָׁם
  choice: le sacrifice de réparation
  rationale: Dans le vocabulaire cultuel, אָשָׁם désigne le sacrifice lié à une faute et à sa réparation. Cette expression française évite de réduire le terme au seul sentiment de culpabilité.
- source_word: הַחַטָּאת
  choice: le sacrifice pour le péché
  rationale: Il s’agit ici d’une catégorie sacrificielle reconnue. Cette traduction courante conserve le lien lexical avec le péché sans imposer l’interprétation plus spécialisée de « sacrifice de purification ».
- source_word: אֲשֶׁר יֹאפוּ אֶת הַמִּנְחָה
  choice: et où ils feront cuire au four l’offrande de céréales
  rationale: אפה indique une cuisson au four, tandis que מִנְחָה, dans ce contexte sacerdotal, désigne l’offrande végétale ou céréalière.
- source_word: לְבִלְתִּי הוֹצִיא אֶל הֶחָצֵר הַחִיצוֹנָה
  choice: de peur qu’en les faisant sortir dans la cour extérieure
  rationale: לְבִלְתִּי exprime ici la prévention. Le pronom « les » explicite en français l’objet sous-entendu, à savoir les offrandes mentionnées.
- source_word: לְקַדֵּשׁ אֶת הָעָם
  choice: ils ne sanctifient le peuple
  rationale: Le hiphil de קדש signifie « rendre saint, consacrer, sanctifier ». La tournure avec « de peur que » présente cette sanctification comme la conséquence à éviter, conformément à la logique cultuelle du passage.
theological_decisions:
- issue: Sens de la transmission de la sainteté dans לְקַדֵּשׁ אֶת הָעָם
  choice: La sortie des offrandes saintes dans la cour extérieure risquerait de sanctifier le peuple par contact ou proximité cultuelle.
  alternative: La clause pourrait être comprise plus généralement comme l’interdiction d’exposer le peuple à des choses saintes, sans insister sur une transmission de sainteté.
  rationale: Le contexte des espaces sacerdotaux réservés et le sens causatif de קדש favorisent l’idée d’une sainteté communiquée. La traduction conserve toutefois le verbe biblique « sanctifier » et signale en note les équivalents possibles, sans développer une doctrine au-delà du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur convient au cadre visionnaire et prescriptif. Les termes sacrificiels restent explicites; « sanctifier » préserve la tension théologique du texte, tandis que la note en précise les autres formulations possibles.
