  text: וְ/אֵיפָ֨ה לַ/פָּ֜ר וְ/אֵיפָ֤ה לָ/אַ֨יִל֙ יַעֲשֶׂ֣ה מִנְחָ֔ה וְ/לַ֨/כְּבָשִׂ֔ים כַּ/אֲשֶׁ֥ר תַּשִּׂ֖יג יָד֑/וֹ וְ/שֶׁ֖מֶן הִ֥ין לָ/אֵיפָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/007.yaml
  text: And he shall provide as a grain offering an ephah for the bull and an ephah for the ram[a], and for the lambs whatever his hand can afford, and a hin of oil with each ephah.
translation:
  language: fr
  text: Il présentera comme offrande de céréales un épha pour le taureau et un épha pour le bélier, et, pour les agneaux, ce que ses moyens lui permettent[a], ainsi qu’un hin d’huile par épha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon ce que sa main peut atteindre »; c’est-à-dire selon ce qu’il est en mesure de fournir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיפָה
  choice: un épha
  rationale: Conserve le nom de cette ancienne mesure de capacité, important dans cette prescription cultuelle, plutôt que de le remplacer par une équivalence moderne approximative.
- source_word: פַּר
  choice: le taureau
  rationale: L’article préfixé dans לַפָּר indique ici le taureau sacrificiel déjà visé par la prescription.
- source_word: אַיִל
  choice: le bélier
  rationale: L’article préfixé dans לָאַיִל indique ici le bélier sacrificiel déterminé par le contexte.
- source_word: יַעֲשֶׂה מִנְחָה
  choice: Il présentera comme offrande de céréales
  rationale: Dans ce contexte sacrificiel, מִנְחָה désigne une offrande de céréales. « Présentera » rend naturellement l’action prescrite par יַעֲשֶׂה sans réduire celle-ci à la seule préparation matérielle.
- source_word: כְּבָשִׂים
  choice: les agneaux
  rationale: Traduction française courante et suffisamment précise dans ce contexte sacrificiel; le texte ne requiert pas ici d’ajouter « mâles ».
- source_word: כַּאֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: ce que ses moyens lui permettent
  rationale: Rend clairement l’idiome hébreu, littéralement lié à ce que sa main peut atteindre ou fournir, c’est-à-dire selon ses ressources.
- source_word: שֶׁמֶן הִין לָאֵיפָה
  choice: un hin d’huile par épha
  rationale: Exprime avec concision le rapport distributif entre la quantité d’huile et chaque épha de céréales.
