  register: Français international moderne, digne et direct. Les termes anciens « épha » et « hin » sont conservés en raison de leur rôle précis dans la réglementation cultuelle; l’idiome de la main est expliqué en note plutôt que reproduit de façon peu naturelle dans le corps du verset.
