language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כִֽי יַעֲשֶׂה֩ הַ/נָּשִׂ֨יא נְדָבָ֜ה עוֹלָ֣ה אֽוֹ שְׁלָמִים֮ נְדָבָ֣ה לַֽ/יהוָה֒ וּ/פָ֣תַֽח ל֗/וֹ אֶת הַ/שַּׁ֨עַר֙ הַ/פֹּנֶ֣ה קָדִ֔ים וְ/עָשָׂ֤ה אֶת עֹֽלָת/וֹ֙ וְ/אֶת שְׁלָמָ֔י/ו כַּ/אֲשֶׁ֥ר יַעֲשֶׂ֖ה בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וְ/יָצָ֛א וְ/סָגַ֥ר אֶת הַ/שַּׁ֖עַר אַחֲרֵ֥י צֵאתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/012.yaml
  text: But when the prince makes a freewill offering to Yahweh[a], either a burnt offering or peace offerings, the gate that faces east shall be opened for him, and he shall offer his burnt offering and his peace offerings as he does on the Sabbath day. Then he shall go out[b], and after he goes out the gate shall be shut.
translation:
  language: fr
  text: Mais lorsque le prince fera une offrande volontaire à Yahweh, que ce soit un holocauste ou des sacrifices de communion[a], on ouvrira pour lui la porte qui fait face à l’est. Il offrira son holocauste et ses sacrifices de communion comme il le fait le jour du sabbat. Puis il sortira, et l’on fermera la porte après sa sortie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifices de paix ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu ne précise pas qui ouvre puis ferme la porte.
    reason: source_ambiguity
lexical_decisions:
- source_word: וְכִי
  choice: Mais lorsque
  rationale: Introduit un cas particulier dans la suite des prescriptions, en contraste avec les occasions régulières évoquées auparavant.
- source_word: הַנָּשִׂיא
  choice: le prince
  rationale: Désigne dans cette section d’Ézéchiel un titulaire d’une fonction politique et cultuelle, sans nécessairement en faire un roi.
- source_word: נְדָבָה
  choice: une offrande volontaire
  rationale: Exprime une offrande faite librement plutôt qu’en vertu d’une obligation fixée.
- source_word: עוֹלָה
  choice: un holocauste
  rationale: Terme sacrificiel français établi pour l’offrande entièrement consumée.
- source_word: שְׁלָמִים
  choice: des sacrifices de communion
  rationale: Rend naturellement le pluriel sacrificiel et son association au partage et à la communion; l’alternative traditionnelle « sacrifices de paix » est signalée en note.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition indique le destinataire ou la dédicace de l’offrande; le nom divin est translittéré.
- source_word: וּפָתַח לוֹ
  choice: on ouvrira pour lui
  rationale: Le verbe hébreu est au masculin singulier sans sujet exprimé. Le pronom indéfini français garde l’agent non identifié sans donner l’impression que la porte s’ouvre d’elle-même.
- source_word: הַשַּׁעַר הַפֹּנֶה קָדִים
  choice: la porte qui fait face à l’est
  rationale: Restitution claire et directe du groupe participial.
- source_word: וְעָשָׂה
  choice: Il offrira
  rationale: Dans un contexte sacrificiel, עשה signifie accomplir ou présenter le sacrifice; « offrir » est idiomatique en français.
- source_word: כַּאֲשֶׁר יַעֲשֶׂה בְּיוֹם הַשַּׁבָּת
  choice: comme il le fait le jour du sabbat
  rationale: Renvoie à la procédure habituelle du sabbat déjà décrite; le présent français convient à cette comparaison normative.
- source_word: וְיָצָא
  choice: Puis il sortira
  rationale: Marque naturellement l’étape suivante de la procédure.
- source_word: וְסָגַר אֶת־הַשַּׁעַר אַחֲרֵי צֵאתוֹ
  choice: et l’on fermera la porte après sa sortie
  rationale: Conserve l’agent non exprimé du verbe hébreu et distingue clairement cet agent du prince qui sort.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre divin sans lui substituer un titre.
- issue: Sens de שְׁלָמִים
  choice: sacrifices de communion
  alternative: sacrifices de paix
  rationale: Le terme peut évoquer bien-être, paix et communion dans le repas sacrificiel. Le texte principal retient une formulation française intelligible, tandis que la note préserve l’autre équivalent reconnu.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe procédurale reste nette. « On ouvrira » et « l’on fermera » préservent l’absence de sujet explicite en hébreu; l’alternance évite une répétition lourde tout en maintenant le même degré d’indétermination.
