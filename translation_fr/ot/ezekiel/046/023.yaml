  text: וְ/ט֨וּר סָבִ֥יב בָּ/הֶ֛ם סָבִ֖יב לְ/אַרְבַּעְתָּ֑/ם וּ/מְבַשְּׁל֣וֹת עָשׂ֔וּי מִ/תַּ֥חַת הַ/טִּיר֖וֹת סָבִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/023.yaml
  text: A row ran around within them[a], around all four of them, and hearths had been made beneath the rows all around.
translation:
  language: fr
  text: Une rangée courait tout autour, à l’intérieur de chacune des quatre cours, et des installations de cuisson avaient été aménagées sous les rangées[a], tout autour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sous les enceintes », « sous les saillies » ou « sous les murs » ; le sens architectural exact du terme hébreu est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוּר
  choice: rangée
  rationale: Le nom désigne ici une rangée ou une assise architecturale continue entourant les cours. « Rangée » conserve la généralité du terme sans imposer l’idée d’un mur complet.
- source_word: סָבִיב ... סָבִיב
  choice: faisait le tour ... tout autour
  rationale: Cette formulation reproduit l’insistance spatiale de la répétition hébraïque tout en restant naturelle en français.
- source_word: בָּהֶם
  choice: à l’intérieur de chacune d’elles
  rationale: Le pronom renvoie aux quatre petites cours du verset précédent. « Chacune » explicite naturellement la portée distributive sans changer le référent.
- source_word: לְאַרְבַּעְתָּם
  choice: des quatre
  rationale: La formule indique que la structure entourait toutes les quatre cours.
- source_word: מְבַשְּׁלוֹת
  choice: foyers de cuisson
  rationale: Le terme, issu de la racine « cuire/faire bouillir », désigne des installations destinées à la cuisson. « Foyers de cuisson » est clair, concret et adapté au contexte des cuisines du temple.
- source_word: עָשׂוּי
  choice: avaient été aménagés
  rationale: Le participe passif décrit des installations déjà réalisées; « aménagés » convient naturellement à des emplacements ou foyers construits à cet effet.
- source_word: מִתַּחַת
  choice: au-dessous de
  rationale: Cette locution exprime directement la relation spatiale indiquée par l’hébreu.
- source_word: הַטִּירוֹת
  choice: les rangées
  rationale: Le mot architectural est incertain, mais paraît lié à la structure périphérique mentionnée au début du verset. La traduction cohérente par « rangées » préserve ce lien, tandis que la note signale les autres possibilités.
