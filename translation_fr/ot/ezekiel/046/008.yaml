id: EZK.46.8
reference: Ezekiel 46:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בְ/ב֖וֹא הַ/נָּשִׂ֑יא דֶּ֣רֶךְ אוּלָ֤ם הַ/שַּׁ֨עַר֙ יָב֔וֹא וּ/בְ/דַרְכּ֖/וֹ יֵצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/008.yaml
  text: When the prince enters[a], he shall enter by way of the porch of the gate, and he shall go out by the same way.
translation:
  language: fr
  text: Quand le prince entrera, il entrera par le vestibule de la porte et ressortira par le même chemin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְ/ב֖וֹא
  choice: Quand … entrera
  rationale: La conjonction et la préposition jointes à l’infinitif construit de בוא ont ici une valeur temporelle. Le futur français convient à cette prescription dans le cadre de la vision.
- source_word: הַ/נָּשִׂיא
  choice: le prince
  rationale: Dans la vision du temple d’Ézéchiel, נָשִׂיא désigne le dirigeant civil sans nécessairement lui attribuer le titre de roi. « Prince » maintient cette distinction et l’usage traditionnel du livre.
- source_word: דֶּ֣רֶךְ
  choice: par
  rationale: דֶּרֶךְ signifie littéralement « chemin, voie ». Devant un élément architectural, « par » exprime naturellement en français le trajet emprunté.
- source_word: אוּלָ֤ם הַ/שַּׁ֨עַר
  choice: le vestibule de la porte
  rationale: אוּלָם désigne l’espace couvert situé à l’entrée de la porte monumentale. « Vestibule » est précis, actuel et adapté au contexte architectural.
- source_word: יָב֔וֹא
  choice: il entrera
  rationale: L’imparfait hébreu énonce ici une procédure prescrite. Le futur français garde cette valeur normative sans la renforcer en ordre explicite.
- source_word: וּ/בְ/דַרְכּ֖/וֹ
  choice: par le même chemin
  rationale: La forme signifie littéralement « et par son chemin ». Dans le contexte, le possessif renvoie au trajet par lequel le prince vient d’entrer; « le même chemin » rend clairement cette reprise.
- source_word: יֵצֵֽא
  choice: ressortira
  rationale: יצא signifie « sortir ». « Ressortira » exprime naturellement qu’après être entré, le prince quittera les lieux par le trajet indiqué.
theological_decisions:
- issue: Identité et statut de הַנָּשִׂיא dans la vision du temple
  choice: Traduction neutre par « le prince »
  alternative: « le dirigeant » ou une identification explicite à un prince messianique
  rationale: Le verset règle les déplacements du personnage sans préciser son identité ultime. La traduction ne tranche donc pas les débats messianiques ou royaux qui dépassent son énoncé.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation privilégie une syntaxe fluide tout en conservant la symétrie procédurale entre l’entrée et la sortie. Aucun appel de note n’est requis, puisque « par le même chemin » explicite directement le sens contextuel de וּבְדַרְכּוֹ.
