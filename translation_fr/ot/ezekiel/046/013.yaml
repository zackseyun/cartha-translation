id: EZK.46.13
reference: Ezekiel 46:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כֶ֨בֶשׂ בֶּן שְׁנָת֜/וֹ תָּמִ֗ים תַּעֲשֶׂ֥ה עוֹלָ֛ה לַ/יּ֖וֹם לַֽ/יהֹוָ֑ה בַּ/בֹּ֥קֶר בַּ/בֹּ֖קֶר תַּעֲשֶׂ֥ה אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/013.yaml
  text: And you shall offer a year-old male lamb without blemish as a burnt offering to Yahweh daily[a]; morning by morning you shall offer it.
translation:
  language: fr
  text: Tu offriras chaque jour à Yahweh un agneau d’un an, sans défaut, en holocauste ; matin après matin[a], tu l’offriras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au matin, au matin » ; la répétition signifie « chaque matin » ou « matin après matin ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶבֶשׂ
  choice: agneau
  rationale: Le nom désigne un jeune mouton et, dans ce contexte sacrificiel, la forme masculine « agneau » convient naturellement sans qu’il soit nécessaire d’ajouter « mâle », absent comme qualificatif distinct dans l’hébreu.
- source_word: בֶּן שְׁנָתוֹ
  choice: d’un an
  rationale: Cette expression idiomatique, littéralement « fils de son année », indique l’âge requis de l’animal. « D’un an » est clair et naturel en français moderne.
- source_word: תָּמִים
  choice: sans défaut
  rationale: Dans le vocabulaire sacrificiel, le terme qualifie un animal exempt de défaut physique ; « sans défaut » rend ce sens avec précision.
- source_word: תַּעֲשֶׂה
  choice: tu offriras
  rationale: Bien que le verbe signifie fondamentalement « faire », il désigne ici l’accomplissement rituel du sacrifice. « Offrir » est idiomatique et précis dans ce contexte.
- source_word: עוֹלָה
  choice: holocauste
  rationale: « Holocauste » est le terme français établi pour le sacrifice entièrement consumé désigné par עוֹלָה.
- source_word: לַיּוֹם
  choice: chaque jour
  rationale: L’expression a ici une valeur distributive et indique que l’offrande doit être présentée quotidiennement.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition indique le destinataire de l’offrande, et le nom divin יהוה est translittéré « Yahweh ».
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: matin après matin
  rationale: La répétition hébraïque exprime une récurrence régulière. « Matin après matin » en conserve l’insistance distributive.
- source_word: אֹתוֹ
  choice: le
  rationale: Le pronom objet renvoie à l’agneau mentionné au début du verset ; le masculin « le » est naturel en français.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. La structure en deux propositions conserve à la fois l’exigence quotidienne et l’insistance hébraïque sur sa répétition chaque matin.
