  source_fidelity: 'Le texte français suit fidèlement le texte massorétique : « le prince » rend הַנָּשִׂיא, « au milieu d’eux » rend בְּתוֹכָם, et l’alternance entre le singulier (« il entrera ») et le pluriel final (« ils sortiront ») est correctement conservée. Le dernier verbe hébreu יֵצֵאוּ est bien un pluriel ; il ne faut pas le remplacer par un singulier sous l’influence d’une interprétation contextuelle ou de la piste d’audit anglaise.'
