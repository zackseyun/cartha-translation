  text: וְֽ/הַ/נָּשִׂ֑יא בְּ/תוֹכָ֤/ם בְּ/בוֹאָ/ם֙ יָב֔וֹא וּ/בְ/צֵאתָ֖/ם יֵצֵֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/010.yaml
  text: And the prince shall be among them[a]; when they enter, he shall enter, and when they go out[b], he shall go out.
translation:
  language: fr
  text: Le prince sera au milieu d’eux ; quand ils entreront, il entrera, et quand ils sortiront, ils sortiront[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu porte le pluriel : « ils sortiront ». Dans le contexte, ce pluriel peut désigner le prince avec le peuple.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: הַנָּשִׂיא
  choice: le prince
  rationale: Dans Ézéchiel 40–48, נָשִׂיא sert de titre au dirigeant civil associé au culte du temple. « Le prince » conserve ce titre sans préciser davantage son identité.
- source_word: בְּתוֹכָם
  choice: au milieu d’eux
  rationale: Cette expression rend directement l’idée de présence au sein du groupe et demeure naturelle en français moderne.
- source_word: בְּבוֹאָם יָבוֹא
  choice: quand ils entreront, il entrera
  rationale: La construction à l’infinitif exprime le moment de l’action, tandis que le verbe au singulier a pour sujet le prince.
- source_word: וּבְצֵאתָם יֵצֵאוּ
  choice: et quand ils sortiront, ils sortiront
  rationale: Le texte massorétique porte deux formes au pluriel. La répétition française préserve cette donnée et l’ambiguïté concernant l’étendue exacte du second « ils », sans substituer un singulier absent de l’hébreu.
theological_decisions:
- issue: Identité et statut du prince dans la vision du temple
  choice: Conserver le titre « prince » sans lui attribuer explicitement une identité messianique ou royale particulière.
  alternative: dirigeant ; chef
  rationale: Le verset règle les déplacements du prince avec les adorateurs, mais ne définit pas ici plus précisément son identité.
- issue: Sujet du dernier verbe יֵצֵאוּ
  choice: Maintenir le pluriel « ils sortiront ».
  alternative: « il sortira » ou « ils sortiront ensemble »
  rationale: Le texte hébreu vocalisé est sans ambiguïté morphologique au pluriel, même si le contexte peut inclure le prince dans le groupe. Employer le singulier corrigerait le texte, tandis qu’ajouter « ensemble » expliciterait une interprétation.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme et la répétition de l’hébreu sont conservés afin de ne pas effacer le contraste entre le singulier « il entrera » et le pluriel final « ils sortiront ».
