  text: וּ/בְ/י֣וֹם הַ/חֹ֔דֶשׁ פַּ֥ר בֶּן בָּקָ֖ר תְּמִימִ֑ם וְ/שֵׁ֧שֶׁת כְּבָשִׂ֛ם וָ/אַ֖יִל תְּמִימִ֥ם יִהְיֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/006.yaml
  text: And on the day of the new moon[a], there shall be an unblemished young bull from the herd, and six lambs and a ram; they shall be unblemished.
translation:
  language: fr
  text: Le jour de la nouvelle lune[a], il y aura un jeune taureau sans défaut, six agneaux et un bélier ; ils seront sans défaut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le jour du mois » ; dans ce contexte cultuel, l’expression désigne la célébration de la nouvelle lune.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/י֣וֹם הַ/חֹ֔דֶשׁ
  choice: Le jour de la nouvelle lune
  rationale: Dans ce contexte cultuel, l’expression désigne le jour de l’observance de la nouvelle lune, plutôt qu’un jour quelconque du mois.
- source_word: פַּ֥ר בֶּן בָּקָ֖ר
  choice: un jeune taureau … pris dans le gros bétail
  rationale: L’expression sacrificielle désigne un jeune bovin mâle ; cette formulation française conserve à la fois l’âge approximatif et l’appartenance au gros bétail.
- source_word: תְּמִימִ֑ם … תְּמִימִ֥ם
  choice: sans défaut … sans défaut
  rationale: Dans le vocabulaire sacrificiel, תמים qualifie un animal exempt de défaut physique ; « sans défaut » est naturel et précis.
- source_word: וְ/שֵׁ֧שֶׁת כְּבָשִׂ֛ים
  choice: six agneaux
  rationale: כְּבָשִׂים désigne ici des agneaux destinés au sacrifice ; le genre grammatical masculin n’a pas besoin d’être explicité en français.
- source_word: וָ/אַ֖יִל
  choice: et un bélier
  rationale: אַיִל est le terme ordinaire pour un bélier dans les listes sacrificielles.
- source_word: יִהְיֽוּ
  choice: ils seront sans défaut
  rationale: Le verbe pluriel reprend explicitement les animaux énumérés et conserve la formulation prescriptive de l’hébreu.
theological_decisions: []
