source:
  edition: WLC
  text: וְ/הָ֣/עֹלָ֔ה אֲשֶׁר יַקְרִ֥ב הַ/נָּשִׂ֖יא לַֽ/יהוָ֑ה בְּ/י֣וֹם הַ/שַּׁבָּ֗ת שִׁשָּׁ֧ה כְבָשִׂ֛ים תְּמִימִ֖ם וְ/אַ֥יִל תָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/004.yaml
  text: And the burnt offering that the prince presents to Yahweh on the Sabbath day shall be six unblemished lambs and one unblemished ram[a].
translation:
  language: fr
  text: L’holocauste que le prince présentera à Yahweh le jour du sabbat sera de six agneaux sans défaut et d’un bélier sans défaut[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « offrira »; le verbe hébreu signifie littéralement « fera approcher » dans l’usage sacrificiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֹלָה
  choice: L’holocauste
  rationale: Dans le vocabulaire sacrificiel, עֹלָה désigne l’offrande entièrement brûlée. « Holocauste » est le terme français établi et précis dans ce contexte.
- source_word: אֲשֶׁר יַקְרִב
  choice: que ... présentera
  rationale: Le hifil de קרב signifie ici apporter ou présenter une offrande. « Présentera » reste proche de l’idée de faire approcher tout en étant naturel en français.
- source_word: הַנָּשִׂיא
  choice: le prince
  rationale: Dans la vision du temple d’Ézéchiel, נָשִׂיא désigne le dirigeant civil reconnu, sans nécessairement en faire un roi. « Prince » est la désignation traditionnelle adaptée au contexte.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל exprime ici la destination ou la dédicace de l’offrande; le nom divin יהוה est rendu par « Yahweh ».
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: le jour du sabbat
  rationale: Cette formulation française claire conserve explicitement le mot « jour » présent dans l’hébreu.
- source_word: שִׁשָּׁה כְבָשִׂים תְּמִימִם
  choice: six agneaux sans défaut
  rationale: Dans une liste sacrificielle, כְבָשִׂים désigne vraisemblablement des agneaux, et תָּמִימִם indique l’absence de défaut physique exigée pour les victimes.
- source_word: וְאַיִל תָּמִים
  choice: et d’un bélier sans défaut
  rationale: אַיִל signifie « bélier »; תָּמִים reçoit le même équivalent que son pluriel afin de conserver la cohérence terminologique.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre divin plutôt que de le remplacer par un titre.
- issue: Nature de עֹלָה
  choice: holocauste
  alternative: offrande ascendante
  rationale: Le contexte est celui du sacrifice entièrement consumé. Le choix retient le sens cultuel reconnu sans imposer une interprétation symbolique de l’étymologie.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « sera de » reflète la construction nominale hébraïque et introduit naturellement la composition de l’offrande. « Sans défaut » est plus transparent pour le grand public que « sans tache » ou « parfait ».
