  text: וַ/יְבִיאֵ֣/נִי בַ/מָּבוֹא֮ אֲשֶׁ֣ר עַל כֶּ֣תֶף הַ/שַּׁעַר֒ אֶל הַ/לִּשְׁכ֤וֹת הַ/קֹּ֨דֶשׁ֙ אֶל הַ/כֹּ֣הֲנִ֔ים הַ/פֹּנ֖וֹת צָפ֑וֹנָ/ה וְ/הִנֵּה שָׁ֣ם מָק֔וֹם ב/ירכת/ם יָֽמָּ/ה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/019.yaml
  text: Then he brought me through the entrance that was beside the gate to the holy chambers for the priests[a], which faced north; and behold, there was a place there at their far western end.
translation:
  language: fr
  text: Puis il me conduisit par l’entrée située à côté de la porte, vers les salles saintes réservées aux prêtres, celles qui sont orientées vers le nord. Et voici qu’il y avait là un emplacement, au fond de ces salles, du côté ouest[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à leur extrémité, vers l’ouest » ou « dans leur partie reculée, vers l’ouest ».'
    reason: La formulation hébraïque בְּיַרְכְתָם יָמָּה conserve une image spatiale plus littérale et peut désigner l’extrémité ou la partie la plus reculée des salles.
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: Puis il me fit entrer
  rationale: Le wayyiqtol poursuit la séquence narrative; la forme causative de בוא signifie que le guide fait entrer Ézéchiel.
- source_word: בַמָּבוֹא
  choice: par l’entrée
  rationale: מָבוֹא désigne une entrée ou un passage d’accès; avec le mouvement exprimé par le verbe, « par » indique naturellement le passage emprunté.
- source_word: אֲשֶׁר עַל כֶּתֶף הַשַּׁעַר
  choice: située sur le côté de la porte
  rationale: כֶּתֶף signifie littéralement « épaule », puis « côté, flanc » dans un contexte architectural.
- source_word: אֶל הַלִּשְׁכוֹת הַקֹּדֶשׁ אֶל הַכֹּהֲנִים
  choice: vers les salles saintes réservées aux prêtres
  rationale: לִשְׁכָּה désigne une salle du complexe du temple. Le second אֶל indique ici le rapport fonctionnel de ces salles avec les prêtres; « réservées aux » rend ce rapport sans répéter maladroitement « vers ».
- source_word: הַפֹּנוֹת צָפוֹנָה
  choice: celles qui sont orientées vers le nord
  rationale: Le participe de פנה et la forme directionnelle צָפוֹנָה décrivent l’orientation des salles.
- source_word: וְהִנֵּה שָׁם מָקוֹם
  choice: Et voici qu’il y avait là un emplacement
  rationale: « Voici » conserve la fonction visuelle et déictique de הִנֵּה dans la vision. « Emplacement » convient au lieu architectural que les versets suivants préciseront.
- source_word: בְּיַרְכְתָם יָמָּה
  choice: au fond de ces salles, du côté ouest
  rationale: יַרְכָה désigne la partie reculée ou l’extrémité; le suffixe pluriel est explicité par « de ces salles ». יָמָּה est l’indication directionnelle idiomatique de l’ouest.
