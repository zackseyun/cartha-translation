source:
  edition: WLC
  text: כֹּה אָמַ֞ר אֲדֹנָ֣/י יְהֹוִ֗ה כִּֽי יִתֵּ֨ן הַ/נָּשִׂ֤יא מַתָּנָה֙ לְ/אִ֣ישׁ מִ/בָּנָ֔י/ו נַחֲלָת֥/וֹ הִ֖יא לְ/בָנָ֣י/ו תִּֽהְיֶ֑ה אֲחֻזָּתָ֥/ם הִ֖יא בְּ/נַחֲלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/016.yaml
  text: 'Thus says the Lord GOD: If the prince gives a gift to any one of his sons[a], it is his inheritance[b]; it shall belong to his sons as their property by inheritance.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh : Si le prince fait un don à l’un de ses fils, ce don est l’héritage de celui-ci ; il appartiendra à ses fils : ce sera leur propriété héréditaire.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique consacrée, naturelle et digne en français, qui introduit une parole divine toujours valable.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה, sans produire l’expression redondante « le Seigneur SEIGNEUR ».
- source_word: כִּי
  choice: Si
  rationale: Introduit ici un cas conditionnel dans une disposition juridique.
- source_word: הַנָּשִׂיא
  choice: le prince
  rationale: Titre technique du dirigeant civil dans la législation du temple en Ézéchiel.
- source_word: מַתָּנָה
  choice: un don
  rationale: Terme clair et actuel pour un bien accordé, adapté au contexte patrimonial.
- source_word: לְאִישׁ מִבָּנָיו
  choice: à l’un de ses fils
  rationale: Restitue naturellement en français l’expression distributive désignant un individu parmi ses fils.
- source_word: נַחֲלָתוֹ הִיא
  choice: ce don sera l’héritage de celui-ci
  rationale: Le pronom hébreu peut être compris par rapport au fils bénéficiaire ; l’explicitation évite en français une succession de pronoms ambigus tout en conservant le sens patrimonial.
- source_word: לְבָנָיו תִּהְיֶה
  choice: il appartiendra à ses fils
  rationale: Indique que le bien demeure dans la descendance du fils qui l’a reçu.
- source_word: אֲחֻזָּתָם ... בְּנַחֲלָה
  choice: ce sera leur propriété héréditaire
  rationale: Réunit idiomatiquement les notions de possession foncière et de transmission par héritage, sans lourdeur juridique artificielle.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte explicitement le nom divin יהוה après אֲדֹנָי ; « Yahweh » préserve cette distinction et évite de remplacer le nom propre par un titre.
- issue: Référent de נַחֲלָתוֹ et des suffixes de la suite
  choice: L’héritage appartient au fils bénéficiaire et passe ensuite à ses propres fils
  alternative: Le bien reste présenté comme l’héritage du prince et appartient collectivement aux fils de celui-ci
  rationale: La progression juridique la plus cohérente fait du bénéficiaire le nouveau détenteur d’un patrimoine transmissible. Le français explicite « de celui-ci » pour rendre ce lien, tout en reconnaissant que les suffixes hébreux sont formellement susceptibles d’une autre lecture.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La formulation conserve le ton juridique et prophétique du passage. « Propriété héréditaire » exprime avec concision la possession durable transmise comme héritage.
