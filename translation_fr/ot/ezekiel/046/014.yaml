  source_fidelity: Le projet rend fidèlement les quantités, le caractère quotidien de l’offrande et le sens probable de לָרֹס (« humecter »). La reprise explicite de « fleur de farine » après la mesure, suivie de « pour en humecter la fleur de farine », est cependant lourde et peut brouiller la relation entre l’huile et la farine. La clause finale gagne à expliciter que la continuité concerne la présentation de l’offrande, sans transformer le texte en une injonction distincte à « observer ».
  naturalness: Le français est moderne et d’un registre approprié. « Un tiers de hin d’huile pour l’humecter » est plus fluide et évite la répétition. « Selon une prescription perpétuelle, à présenter continuellement » reste solennel, naturel dans un contexte cultuel et rend l’insistance de la formule hébraïque.
  terminology: « Offrande de céréales », « fleur de farine », « épha », « hin » et « Yahweh » sont cohérents et précis. Le maintien de « avec lui » et de sa note préserve l’ambiguïté contextuelle de עָלָיו.
