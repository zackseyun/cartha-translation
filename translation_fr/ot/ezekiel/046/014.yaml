  variant: modern international French
source:
  edition: WLC
  text: וּ/מִנְחָה֩ תַעֲשֶׂ֨ה עָלָ֜י/ו בַּ/בֹּ֤קֶר בַּ/בֹּ֨קֶר֙ שִׁשִּׁ֣ית הָֽ/אֵיפָ֔ה וְ/שֶׁ֛מֶן שְׁלִישִׁ֥ית הַ/הִ֖ין לָ/רֹ֣ס אֶת הַ/סֹּ֑לֶת מִנְחָה֙ לַֽ/יהוָ֔ה חֻקּ֥וֹת עוֹלָ֖ם תָּמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/014.yaml
  text: And you shall prepare with it[a], morning by morning, a grain offering of a sixth of an ephah, and a third of a hin of oil to moisten the fine flour—a grain offering to Yahweh[c][b], a perpetual statute continually.
translation:
  language: fr
  text: 'Avec lui[a], tu prépareras, matin après matin, une offrande de céréales : un sixième d’épha de fleur de farine, ainsi qu’un tiers de hin d’huile pour l’humecter[b]. C’est une offrande de céréales pour Yahweh, selon une prescription perpétuelle, à présenter continuellement[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour lui » ou « sur lui ». Le pronom renvoie probablement à l’agneau ou à l’holocauste quotidien mentionné au verset précédent.
    reason: alternative_reading
  - marker: b
    text: Ou « pour mélanger la fleur de farine ». Le verbe hébreu est rare et évoque son humidification avec l’huile.
    reason: lexical_alternative
  - marker: c
    text: L’hébreu dit littéralement « prescriptions de perpétuité, continuellement », expression qui souligne le caractère durable et régulier de cette obligation.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנְחָה
  choice: une offrande de céréales
  rationale: Dans ce contexte sacrificiel, מִנְחָה désigne l’offrande non sanglante faite de farine et d’huile; « offrande de céréales » est clair et précis en français moderne.
- source_word: תַעֲשֶׂה
  choice: tu prépareras
  rationale: Le verbe עשה signifie largement « faire », mais « préparer » convient naturellement à une prescription sacrificielle et conserve la deuxième personne masculine du singulier.
- source_word: עָלָיו
  choice: avec lui
  rationale: Le suffixe renvoie probablement à l’agneau ou à l’holocauste quotidien du verset précédent; « avec lui » exprime l’accompagnement sans imposer le sens spatial de « sur lui ».
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: matin après matin
  rationale: Cette tournure restitue la répétition distributive de l’hébreu et souligne la régularité quotidienne.
- source_word: שִׁשִּׁית הָאֵיפָה
  choice: un sixième d’épha
  rationale: La mesure ancienne est conservée fidèlement sous sa forme française usuelle.
- source_word: וְשֶׁמֶן שְׁלִישִׁית הַהִין
  choice: un tiers de hin d’huile
  rationale: La syntaxe française est fluide tout en conservant exactement la quantité et l’unité anciennes.
- source_word: לָרֹס
  choice: pour en humecter
  rationale: Le verbe rare רוס évoque l’action d’humidifier la farine avec l’huile; « humecter » préserve ce sens sans affirmer nécessairement un mélange complet.
- source_word: אֶת־הַסֹּלֶת
  choice: la fleur de farine
  rationale: סֹלֶת désigne une farine fine de qualité destinée aux offrandes; « fleur de farine » est l’équivalent cultuel français naturel.
- source_word: מִנְחָה לַיהוָה
  choice: une offrande de céréales pour Yahweh
  rationale: La reprise française conserve l’identification explicite de l’offrande et son destinataire, ainsi que le nom divin.
- source_word: חֻקּוֹת עוֹלָם תָּמִיד
  choice: une prescription perpétuelle, à observer continuellement
  rationale: Cette formulation restitue l’insistance cumulative de l’hébreu sur la durée et la régularité, tout en rendant idiomatiquement le pluriel חֻקּוֹת comme une prescription unique.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre d’alliance sans le remplacer par un titre.
- issue: Référent de עָלָיו
  choice: avec lui, probablement l’agneau ou l’holocauste quotidien du verset précédent
  alternative: sur lui / pour lui
  rationale: Le référent grammatical dépend du contexte précédent et reste légèrement ambigu; le texte principal adopte l’accompagnement, tandis que la note conserve les autres possibilités.
- issue: Portée de חֻקּוֹת עוֹלָם תָּמִיד
  choice: prescription perpétuelle, à observer continuellement
  alternative: prescriptions éternelles, continuellement
  rationale: Le français idiomatique traite l’expression comme une seule obligation durable, sans supprimer l’insistance hébraïque sur sa pratique régulière.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement conserve l’adresse hébraïque à la deuxième personne du singulier. Les unités cultuelles anciennes « épha » et « hin » sont maintenues. La légère solennité de « prescription perpétuelle » convient au registre juridique et cultuel du passage.
