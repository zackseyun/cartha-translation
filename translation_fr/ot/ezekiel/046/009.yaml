source:
  edition: WLC
  text: וּ/בְ/ב֨וֹא עַם הָ/אָ֜רֶץ לִ/פְנֵ֣י יְהוָה֮ בַּ/מּֽוֹעֲדִים֒ הַ/בָּ֡א דֶּרֶךְ שַׁ֨עַר צָפ֜וֹן לְ/הִֽשְׁתַּחֲוֺ֗ת יֵצֵא֙ דֶּרֶךְ שַׁ֣עַר נֶ֔גֶב וְ/הַ/בָּא֙ דֶּרֶךְ שַׁ֣עַר נֶ֔גֶב יֵצֵ֖א דֶּרֶךְ שַׁ֣עַר צָפ֑וֹנָ/ה לֹ֣א יָשׁ֗וּב דֶּ֤רֶךְ הַ/שַּׁ֨עַר֙ אֲשֶׁר בָּ֣א ב֔/וֹ כִּ֥י נִכְח֖/וֹ יצאו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/009.yaml
  text: And when the people of the land come before Yahweh at the appointed times[a], whoever enters by way of the north gate to worship shall go out by way of the south gate, and whoever enters by way of the south gate shall go out by way of the north gate. He shall not return by way of the gate through which he entered[c][b], but shall go out straight ahead.
translation:
  language: fr
  text: Quand le peuple du pays viendra devant Yahweh aux temps fixés[a], celui qui entrera par la porte nord pour se prosterner[b] sortira par la porte sud, et celui qui entrera par la porte sud sortira par la porte nord. Il ne reviendra pas par la porte par laquelle il est entré, mais il sortira tout droit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aux fêtes fixées » ou « lors des fêtes ».'
    reason: lexical_alternative
  - marker: b
    text: Le verbe peut aussi être rendu ici par « adorer » ; il désigne littéralement le fait de s’incliner ou de se prosterner.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « car ils sortiront en face de lui » ; le sens est qu’ils continuent tout droit et sortent du côté opposé, au lieu de repartir par la porte d’entrée.'
    reason: textual_or_grammatical_clarification
lexical_decisions:
- source_word: עַם הָאָרֶץ
  choice: le peuple du pays
  rationale: Rend formellement l’expression hébraïque et distingue l’ensemble de la population du prince et des prêtres, sans imposer l’interprétation « les gens du peuple ».
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » conserve l’idée de se présenter dans la présence divine; le nom propre Yahweh représente directement le tétragramme.
- source_word: בַּמּוֹעֲדִים
  choice: lors des temps fixés
  rationale: Préserve la portée de מוֹעֵד, qui peut désigner des moments déterminés et, dans ce contexte cultuel, les fêtes fixées.
- source_word: הַבָּא ... לְהִשְׁתַּחֲוֺת
  choice: celui qui entrera ... pour se prosterner
  rationale: Le participe énonce une règle générale. « Se prosterner » conserve le geste corporel explicite du verbe tout en étant naturel dans ce contexte de culte.
- source_word: דֶּרֶךְ שַׁעַר צָפוֹן / דֶּרֶךְ שַׁעַר נֶגֶב
  choice: par la porte nord / par la porte sud
  rationale: Formulation française directe qui exprime clairement l’itinéraire d’entrée et de sortie.
- source_word: יֵצֵא
  choice: sortira
  rationale: Le futur français convient à la prescription formulée comme règle générale dans ce passage.
- source_word: לֹא יָשׁוּב
  choice: Il ne reviendra pas
  rationale: Représente directement le sens de שוב et l’interdiction de rebrousser chemin vers la porte d’entrée.
- source_word: אֲשֶׁר בָּא בוֹ
  choice: par laquelle il est entré
  rationale: Rend naturellement la proposition relative hébraïque en français.
- source_word: כִּי נִכְחוֹ יֵצֵאוּ
  choice: mais chacun sortira droit devant lui
  rationale: « Droit devant lui » communique le mouvement vers la sortie opposée. « Chacun » rend la reprise au pluriel après les sujets génériques singuliers sans masquer entièrement ce changement de nombre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le tétragramme; « Yahweh » conserve le nom divin personnel sans le remplacer par un titre.
- issue: Nature de l’acte exprimé par הִשְׁתַּחֲוָה
  choice: se prosterner
  alternative: adorer; rendre un culte
  rationale: Le contexte indique un acte cultuel, mais le verbe nomme aussi concrètement l’inclination ou la prosternation. Le rendu retenu préserve cette dimension corporelle sans réduire l’acte à un geste dénué de portée religieuse.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe prescriptive reste nette. Le texte conserve « peuple du pays », le geste concret de prosternation et l’alternance hébraïque entre le singulier générique et le pluriel final.
