source:
  edition: WLC
  text: וּֽ/בְ/דַבְּרִ֤/י אֽוֹתְ/ךָ֙ אֶפְתַּ֣ח אֶת פִּ֔י/ךָ וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהֹוִ֑ה הַ/שֹּׁמֵ֤עַ יִשְׁמָע֙ וְ/הֶ/חָדֵ֣ל יֶחְדָּ֔ל כִּ֛י בֵּ֥ית מְרִ֖י הֵֽמָּה־׀׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/027.yaml
  text: 'But when I speak with you[a], I will open your mouth, and you shall say to them, ‘Thus says the Lord GOD: The one who hears, let him hear; and the one who refrains, let him refrain[b], for they are a rebellious house.’'
translation:
  language: fr
  text: 'Mais quand je te parlerai, j’ouvrirai ta bouche, et tu leur diras : « Voici ce que dit le Seigneur Yahweh : Que celui qui écoute écoute, et que celui qui s’abstient s’abstienne[a], car ils sont une maison rebelle[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Celui qui écoute écoutera, et celui qui s’abstient s’abstiendra. » Les formes hébraïques peuvent exprimer soit une permission ou une exhortation, soit une prédiction.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « une maison de rébellion ». Cette expression récurrente d’Ézéchiel désigne collectivement les Israélites dans leur révolte obstinée.'
    reason: cultural_note
lexical_decisions:
- source_word: וּבְדַבְּרִי אוֹתְךָ
  choice: Mais quand je te parlerai
  rationale: La préposition בְּ avec l’infinitif construit a une valeur temporelle. « Mais » exprime naturellement le contraste avec le mutisme imposé au prophète dans le contexte précédent; le futur convient à l’annonce de la prochaine prise de parole divine.
- source_word: אֶפְתַּח אֶת־פִּיךָ
  choice: j’ouvrirai ta bouche
  rationale: Traduction directe qui conserve l’image de Dieu rendant au prophète la capacité de parler.
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: et tu leur diras
  rationale: Le parfait consécutif poursuit l’action future et exprime ici la mission confiée à Ézéchiel.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Formulation française actuelle et solennelle de la formule conventionnelle du messager prophétique, sans l’archaïsme de « Ainsi parle ».
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Conserve les deux éléments du titre hébreu, אֲדֹנָי (« Seigneur ») et le nom divin יהוה (« Yahweh »), sans les fusionner.
- source_word: הַשֹּׁמֵעַ יִשְׁמָע
  choice: Que celui qui écoute écoute
  rationale: Conserve le parallélisme et rend l’imparfait comme une formule permissive ou volitive, lecture possible dans ce contexte.
- source_word: וְהֶחָדֵל יֶחְדָּל
  choice: et que celui qui s’abstient s’abstienne
  rationale: חדל désigne le fait de cesser ou de s’abstenir. Cette traduction évite d’ajouter explicitement l’idée plus forte de refus, tout en gardant la répétition rhétorique de la racine hébraïque.
- source_word: כִּי בֵּית מְרִי הֵמָּה
  choice: car ils sont une maison rebelle
  rationale: Préserve l’expression caractéristique d’Ézéchiel בֵּית מְרִי et sa métaphore collective, plutôt que de l’aplanir en « peuple rebelle ».
theological_decisions:
- issue: Rendu du titre divin אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU; le Seigneur, l’Éternel
  rationale: Le texte associe un titre de souveraineté au nom personnel divin. « Seigneur Yahweh » rend distinctement les deux termes et ne remplace pas le tétragramme par un autre titre.
- issue: Valeur des imparfaits יִשְׁמָע et יֶחְדָּל
  choice: 'lecture permissive ou volitive : « qu’il écoute… qu’il s’abstienne »'
  alternative: 'lecture prédictive : « il écoutera… il s’abstiendra »'
  rationale: Les formes hébraïques permettent les deux nuances. Le texte principal retient la force permissive adaptée à la conclusion de l’ordre prophétique, tandis que la note maintient l’ambiguïté réelle.
- issue: Masculin singulier à valeur représentative
  choice: celui qui…
  alternative: quiconque…
  rationale: Le français « celui qui » suit le nombre et le genre grammaticaux de l’hébreu tout en ayant ici une portée générale.
translation_notes:
  register: Français international moderne, solennel sans être archaïque. La formule prophétique est rendue de manière idiomatique par « Voici ce que dit ». Les répétitions des deux propositions centrales et l’expression inhabituelle « maison rebelle » sont maintenues parce qu’elles portent la rhétorique et l’imagerie propres au texte hébreu.
