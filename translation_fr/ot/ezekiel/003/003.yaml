base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/003.yaml
  text: And he said to me[a], “Son of man, feed your belly and fill your inward parts with this scroll that I am giving you.” So I ate it, and it was in my mouth as sweet as honey.
translation:
  language: fr
  text: 'Il me dit : « Fils d’homme[a], rassasie ton ventre et remplis tes entrailles de ce rouleau que je te donne. » Je le mangeai, et il fut dans ma bouche doux comme du miel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « être humain », « mortel ». L’expression hébraïque « fils d’homme » est conservée ici, car c’est ainsi qu’Ézéchiel est appelé à plusieurs reprises.
    reason: Alternative lexicale et explication de l’idiome hébreu.
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Conserve la formule d’adresse prophétique récurrente d’Ézéchiel et sa forme concrète, tout en signalant en note sa portée humaine.
- source_word: בִּטְנְךָ תַאֲכֵל
  choice: nourris ton ventre
  rationale: Rend la valeur causative du hifil תַאֲכֵל et maintient l’image corporelle concrète du ventre.
- source_word: וּמֵעֶיךָ תְמַלֵּא
  choice: remplis tes entrailles
  rationale: « Entrailles » désigne naturellement l’intérieur du corps dans un registre digne et conserve le parallélisme avec « ventre ».
- source_word: הַמְּגִלָּה
  choice: ce rouleau
  rationale: Désigne clairement le rouleau écrit présenté au prophète, sans l’anachronisme de « livre ».
- source_word: אֲנִי נֹתֵן אֵלֶיךָ
  choice: que je te donne
  rationale: Le présent français exprime naturellement l’action immédiate du participe hébreu dans cette scène.
- source_word: וָאֹכְלָה
  choice: Je le mangeai
  rationale: Le passé simple convient à une narration biblique française actuelle et digne; le pronom reprend explicitement le rouleau.
- source_word: וַתְּהִי בְּפִי כִּדְבַשׁ לְמָתוֹק
  choice: dans ma bouche il fut doux comme du miel
  rationale: Rend à la fois la localisation sensorielle et la comparaison hébraïque, littéralement « comme du miel, pour la douceur ».
theological_decisions:
- issue: Portée de אָדָם dans בֶּן אָדָם
  choice: homme dans la formule « Fils d’homme »
  alternative: humain; mortel; fils d’Adam
  rationale: La formule traditionnelle et textuellement transparente est conservée. Dans Ézéchiel, elle souligne l’humanité du prophète; la note préserve les autres manières d’en expliciter le sens sans imposer une interprétation plus étroite.
translation_notes:
  register: Français international moderne, naturel et digne. L’image corporelle forte de l’hébreu est maintenue par « ventre » et « entrailles ». Le passé simple assure une narration soutenue sans archaïsmes lexicaux.
