  text: So I opened my mouth[a], and he fed me this scroll.
translation:
  language: fr
  text: J’ouvris donc la bouche, et il me fit manger ce rouleau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶפְתַּח
  choice: J’ouvris donc
  rationale: Le wayyiqtol qal de פתח fait avancer le récit. « donc » exprime naturellement en français la conséquence de l’ordre donné au verset précédent.
- source_word: אֶת־פִּי
  choice: la bouche
  rationale: 'Avec le possessif intégré au sujet verbal, le français emploie naturellement l’article défini pour une partie du corps : « j’ouvris la bouche ».'
- source_word: וַיַּאֲכִלֵנִי
  choice: et il me fit manger
  rationale: Le hifil de אכל avec suffixe de première personne signifie littéralement « il me fit manger » ou « il me donna à manger ». Cette formulation conserve clairement la valeur causative de l’hébreu sans imposer l’idée d’une contrainte.
- source_word: אֵת הַמְּגִלָּה הַזֹּאת
  choice: ce rouleau
  rationale: מְגִלָּה désigne un rouleau destiné à l’écriture. « ce rouleau » restitue directement le nom et le démonstratif.
theological_decisions:
- issue: Nuance causative de l’action divine
  choice: il me fit manger
  alternative: il me donna ce rouleau à manger
  rationale: « fit manger » préserve la construction causative sans décider si l’action implique contrainte, assistance ou simple mise à disposition.
translation_notes:
  register: Français moderne, sobre et narratif. Le passé simple convient au registre biblique littéraire tout en restant clair; la syntaxe demeure proche de l’hébreu sans être artificielle.
