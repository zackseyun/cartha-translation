source:
  edition: WLC
  text: וּ/לְשֽׁוֹנְ/ךָ֙ אַדְבִּ֣יק אֶל חִכֶּ֔/ךָ וְ/נֶֽאֱלַ֔מְתָּ וְ/לֹא תִֽהְיֶ֥ה לָ/הֶ֖ם לְ/אִ֣ישׁ מוֹכִ֑יחַ כִּ֛י בֵּ֥ית מְרִ֖י הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/026.yaml
  text: And I will make your tongue cling to the roof of your mouth[a], and you will be mute and will not be for them a man who rebukes[d][c][b], for they are a rebellious house.
translation:
  language: fr
  text: 'Je ferai adhérer ta langue à ton palais[a] : tu deviendras muet[b] et tu ne seras pas pour eux un homme qui les reprend[c], car ils sont une maison rebelle[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la partie supérieure de ta bouche ».
    reason: lexical_alternative
  - marker: b
    text: Ou « tu seras réduit au silence » ou « tu resteras sans voix ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « un homme qui reprend », c’est-à-dire quelqu’un qui réprimande ou corrige.
    reason: lexical_alternative
  - marker: d
    text: « Maison rebelle » est une expression fréquente dans Ézéchiel pour désigner le peuple comme une collectivité en rébellion.
    reason: cultural_note
lexical_decisions:
- source_word: אַדְבִּיק
  choice: Je ferai coller
  rationale: 'Le hiphil de דבק exprime ici la causalité : Dieu fera adhérer la langue d’Ézéchiel. Cette formulation française garde cette force causative.'
- source_word: לְשׁוֹנְךָ
  choice: ta langue
  rationale: L’image corporelle concrète est conservée, car elle est essentielle à la restriction de parole imposée au prophète.
- source_word: אֶל חִכֶּךָ
  choice: à ton palais
  rationale: חֵךְ désigne le palais, c’est-à-dire la partie supérieure intérieure de la bouche. « Palais » est précis et naturel en français.
- source_word: נֶאֱלַמְתָּ
  choice: tu deviendras muet
  rationale: Le niphal décrit l’entrée dans un état d’incapacité à parler. « Tu deviendras muet » rend cette valeur résultative sans réduire l’image à une simple inefficacité sociale.
- source_word: לֹא תִהְיֶה לָהֶם
  choice: tu ne seras pas pour eux
  rationale: La construction relationnelle hébraïque est conservée, malgré son registre légèrement soutenu, sans ajouter une fonction absente du texte.
- source_word: לְאִישׁ
  choice: un homme
  rationale: Le masculin singulier désigne concrètement Ézéchiel; « un homme » préserve donc la forme et le référent du texte.
- source_word: מוֹכִיחַ
  choice: qui les reprend
  rationale: Le participe hiphil de יכח exprime l’action de reprendre, réprimander ou corriger. « Reprendre » convient au registre prophétique et reste clair en français courant.
- source_word: בֵּית מְרִי
  choice: une maison rebelle
  rationale: Cette expression caractéristique d’Ézéchiel présente le peuple comme une collectivité familiale en rébellion. Le maintien de « maison » préserve l’idiome du livre.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de la restriction imposée au prophète; « car » convient au registre et à la relation logique.
theological_decisions:
- issue: Nature de l’incapacité d’Ézéchiel à parler
  choice: Une incapacité de parler imposée par Dieu et décrite au moyen d’une image corporelle concrète.
  alternative: Une mise au silence purement métaphorique ou une simple incapacité à convaincre.
  rationale: La langue qui colle au palais indique une restriction effective de la parole. La traduction conserve cette image sans préciser au-delà de ce qu’affirme le verset.
- issue: Sens collectif de בֵּית מְרִי
  choice: une maison rebelle
  alternative: un peuple rebelle
  rationale: « Maison » maintient la manière propre à Ézéchiel de désigner collectivement la communauté; « peuple » serait plus explicite, mais atténuerait cet idiome.
- issue: Masculin de לְאִישׁ
  choice: un homme
  alternative: quelqu’un ou une personne
  rationale: Le terme renvoie au prophète Ézéchiel lui-même et n’est pas ici un masculin générique indéterminé.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conserve volontairement « tu ne seras pas pour eux », qui reflète la construction hébraïque, tandis que « qui les reprend » explicite naturellement en français l’objet implicite de l’action dans ce contexte.
