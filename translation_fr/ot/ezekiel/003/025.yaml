id: EZK.3.25
reference: Ezekiel 3:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם הִנֵּ֨ה נָתְנ֤וּ עָלֶ֨י/ךָ֙ עֲבוֹתִ֔ים וַ/אֲסָר֖וּ/ךָ בָּ/הֶ֑ם וְ/לֹ֥א תֵצֵ֖א בְּ/תוֹכָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/025.yaml
  text: But you[a], son of man, behold, they will put ropes on you and bind you with them[b], so that you will not go out among them.
translation:
  language: fr
  text: Quant à toi, fils d’homme, voici qu’on mettra sur toi des cordes[a] et qu’on t’attachera avec elles ; ainsi, tu ne sortiras pas au milieu d’eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « liens » ou « cordons ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « en leur milieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Quant à toi
  rationale: La tournure détache et met en relief le destinataire, comme le fait le pronom hébreu explicite précédé de la conjonction.
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: Cette adresse récurrente à Ézéchiel conserve l’idiome hébreu et la cohérence littéraire du livre.
- source_word: הִנֵּה
  choice: voici que
  rationale: Ce marqueur attire solennellement l’attention sur ce qui va arriver, dans un français actuel et naturel.
- source_word: נָתְנוּ
  choice: on mettra
  rationale: Le parfait hébreu prend ici naturellement une valeur future dans l’annonce prophétique. Le pronom indéfini « on » préserve l’absence d’identification explicite des agents.
- source_word: עֲבוֹתִים
  choice: cordes
  rationale: Le nom désigne des objets servant à lier. « Cordes » est concret, clair et convient au verbe qui suit.
- source_word: וַאֲסָרוּךָ
  choice: et qu’on t’attachera
  rationale: Le verbe signifie lier ou attacher. Cette formulation directe évite le sens plus interprétatif d’« emprisonner ».
- source_word: בָּהֶם
  choice: avec elles
  rationale: 'La préposition a ici un sens instrumental : les cordes sont le moyen par lequel Ézéchiel sera attaché.'
- source_word: וְלֹא תֵצֵא
  choice: ainsi, tu ne sortiras pas
  rationale: « Ainsi » rend la relation de conséquence probable avec l’action de lier, sans transformer l’énoncé en incapacité absolue.
- source_word: בְּתוֹכָם
  choice: parmi eux
  rationale: Cette expression française naturelle indique qu’Ézéchiel ne pourra pas aller au milieu des gens, sans inverser la direction du mouvement.
theological_decisions:
- issue: Identité du sujet pluriel non exprimé
  choice: Employer le pronom indéfini « on » sans identifier les agents.
  alternative: « ils », les agents de Dieu, ou les gens parmi lesquels vit Ézéchiel
  rationale: L’hébreu porte une troisième personne du pluriel sans sujet nommé. « On » conserve cette indétermination en français sans attribuer explicitement l’action à Dieu ou aux habitants.
- issue: Rapport entre le fait d’être lié et l’interdiction de sortir
  choice: Rendre la conjonction par « ainsi », avec une valeur de conséquence.
  alternative: 'Simple coordination : « et tu ne sortiras pas »'
  rationale: Le contexte suggère que le fait de ne pas sortir résulte des liens, mais la formulation reste sobre et n’ajoute ni motif ni agent.
translation_notes:
  register: Français international moderne, clair et digne. « Voici que » maintient la force prophétique sans archaïsme marqué ; « fils d’homme » conserve l’adresse caractéristique du livre. La syntaxe évite de préciser l’identité des personnes qui attachent Ézéchiel.
