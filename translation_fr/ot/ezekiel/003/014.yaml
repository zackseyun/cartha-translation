id: EZK.3.14
reference: Ezekiel 3:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/ר֥וּחַ נְשָׂאַ֖תְ/נִי וַ/תִּקָּחֵ֑/נִי וָ/אֵלֵ֥ךְ מַר֙ בַּ/חֲמַ֣ת רוּחִ֔/י וְ/יַד יְהוָ֥ה עָלַ֖/י חָזָֽקָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/014.yaml
  text: And the Spirit lifted me up and took me away[a], and I went in bitterness, in the heat of my spirit[b], while the hand of Yahweh was strong upon me.
translation:
  language: fr
  text: L’Esprit me souleva et m’emporta[a]. Je m’en allai, amer, dans l’ardeur de mon esprit[b], et la main de Yahweh était forte sur moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « un esprit me souleva » ; le mot hébreu peut également signifier « vent ».'
    reason: alternative_reading
  - marker: b
    text: L’expression « dans l’ardeur de mon esprit » peut aussi se comprendre comme « dans la fureur de mon esprit » ou « dans la colère de mon esprit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ
  choice: L’Esprit
  rationale: רוּחַ peut désigner l’esprit, le vent ou le souffle. Dans ce contexte de transport visionnaire, « l’Esprit » renvoie vraisemblablement à l’Esprit divin, sans éliminer les autres possibilités, signalées en note.
- source_word: נְשָׂאַתְנִי
  choice: me souleva
  rationale: נשׂא signifie couramment « soulever, porter ». « Me souleva » conserve l’image concrète du mouvement ascendant.
- source_word: וַתִּקָּחֵנִי
  choice: m’emporta
  rationale: לקח signifie fondamentalement « prendre ». Dans la séquence de déplacement, « m’emporta » exprime naturellement le fait d’être pris et transporté, sans imposer l’idée plus forte d’une saisie violente.
- source_word: וָאֵלֵךְ
  choice: Je m’en allai
  rationale: הלך signifie « aller, marcher ». « Je m’en allai » convient au mouvement narratif et garde ici un registre digne et naturel.
- source_word: מַר
  choice: amer
  rationale: L’adjectif est employé adverbialement ou comme indication de l’état intérieur du prophète. « Amer » conserve sa concision et son intensité sans préciser davantage la nature de cette amertume.
- source_word: בַּחֲמַת רוּחִי
  choice: dans l’ardeur de mon esprit
  rationale: חֵמָה peut évoquer la chaleur, l’ardeur, la fureur ou la colère. « Ardeur » préserve la métaphore de la chaleur et laisse ouverte la nature exacte de l’agitation intérieure.
- source_word: וְיַד יְהוָה עָלַי חָזָקָה
  choice: et la main de Yahweh était forte sur moi
  rationale: La formulation conserve l’image prophétique de la « main de Yahweh » ainsi que l’adjectif חָזָקָה, qui exprime la force de l’action ou de l’emprise divine.
theological_decisions:
- issue: Référent du premier רוּחַ
  choice: l’Esprit divin
  alternative: un esprit ou le vent
  rationale: Le contexte immédiat décrit un transport prophétique et visionnaire, ce qui favorise l’Esprit divin. La note maintient toutefois l’ambiguïté lexicale réelle de l’hébreu.
- issue: Traduction de יְהוָה
  choice: Yahweh
  alternative: le Seigneur ou Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » représente le nom divin plutôt que de le remplacer par un titre.
- issue: Nature de l’émotion exprimée par חֵמָה
  choice: ardeur intérieure non davantage définie
  alternative: fureur ou colère du prophète
  rationale: Le mot peut désigner une vive chaleur émotionnelle, souvent la fureur ou la colère, mais le verset ne permet pas d’en fixer absolument la nuance. La traduction et la note préservent cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche des images hébraïques, notamment « la main de Yahweh », tout en employant une syntaxe accessible. La répétition d’« esprit » est conservée afin de maintenir le lien lexical et le contraste possible entre l’action divine et la réaction intérieure d’Ézéchiel.
