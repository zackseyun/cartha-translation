  text: וְ/אַתָּ֞ה כִּ֧י הִזְהַרְתּ֣/וֹ צַדִּ֗יק לְ/בִלְתִּ֥י חֲטֹ֛א צַדִּ֖יק וְ/ה֣וּא לֹא חָטָ֑א חָי֤וֹ יִֽחְיֶה֙ כִּ֣י נִזְהָ֔ר וְ/אַתָּ֖ה אֶֽת נַפְשְׁ/ךָ֥ הִצַּֽלְתָּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/021.yaml
  text: But if you warn a righteous man not to sin[a], and he does not sin, he will surely live because he took warning, and you will have delivered your life.
translation:
  language: fr
  text: Mais si tu avertis le juste afin qu’il ne pèche pas, et qu’il ne pèche pas, il vivra assurément, car il aura été averti[a]. Et toi, tu auras sauvé ta vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « car il aura tenu compte de l’avertissement » ou « car il aura écouté l’avertissement ». Le verbe hébreu peut souligner soit le fait de recevoir l’avertissement, soit le fait d’y répondre.
    reason: alternative lexicale
lexical_decisions:
- source_word: כִּי
  choice: si
  rationale: 'Dans cette construction, כִּי introduit la condition qui prolonge les cas précédents : « si tu avertis… ».'
- source_word: הִזְהַרְתּוֹ
  choice: tu avertis un homme juste
  rationale: Le hifil de זהר signifie « avertir, mettre en garde ». Le présent français convient à l’énoncé conditionnel général, et le pronom objet hébreu est naturellement intégré au groupe nominal.
- source_word: צַדִּיק
  choice: un homme juste
  rationale: L’adjectif substantivé est masculin singulier et désigne ici un individu présenté comme juste. « Un homme juste » restitue à la fois le genre grammatical et le caractère indéfini du cas envisagé.
- source_word: לְבִלְתִּי חֲטֹא
  choice: de ne pas pécher
  rationale: La construction infinitive exprime le but préventif de l’avertissement. Cette formulation est concise et idiomatique en français.
- source_word: וְהוּא לֹא חָטָא
  choice: et qu’il ne pèche pas
  rationale: Après la proposition introduite par « si », le subjonctif français exprime naturellement la seconde condition, sans imposer au parfait hébreu une valeur strictement passée.
- source_word: חָיוֹ יִחְיֶה
  choice: il vivra assurément
  rationale: L’infinitif absolu suivi de l’imparfait renforce l’affirmation verbale. « Assurément » transmet cette emphase dans un français moderne et digne.
- source_word: נִזְהָר
  choice: il aura tenu compte de l’avertissement
  rationale: Le nifal de זהר peut mettre l’accent sur le fait d’avoir reçu l’avertissement ou sur la réaction à celui-ci. Le choix principal exprime ici la prise en compte effective, tandis que la note conserve l’ambiguïté lexicale.
- source_word: נַפְשְׁךָ
  choice: ta vie
  rationale: נֶפֶשׁ désigne ici la vie de la personne, plutôt qu’une « âme » immatérielle au sens théologique ultérieur.
- source_word: הִצַּלְתָּ
  choice: tu auras sauvé
  rationale: Le hifil de נצל signifie délivrer ou sauver. Le futur antérieur rend naturellement en français le résultat acquis de l’avertissement donné dans cette séquence conditionnelle.
theological_decisions:
- issue: Sens de « tu auras sauvé ta vie » dans le contexte de la sentinelle
  choice: Conserver l’expression concrète et judiciaire du texte sans l’expliciter dans la traduction.
  alternative: Paraphraser comme une délivrance de la culpabilité du sang, ou comme le salut spirituel de soi-même.
  rationale: Le contexte associe l’avertissement à la responsabilité du prophète devant Dieu, mais le verset dit littéralement qu’il aura sauvé sa vie. La traduction garde cette tension et évite d’importer une doctrine du salut par mérite ou de réduire arbitrairement la phrase à la seule survie physique.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement est maintenu pour l’adresse directe de Dieu au prophète. La répétition emphatique hébraïque est rendue par « assurément », et la syntaxe conditionnelle reste fluide sans effacer les nuances du texte source.
