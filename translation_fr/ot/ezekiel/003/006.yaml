  text: not to many peoples of obscure speech and difficult language[a], whose words you cannot understand; surely, if I had sent you to them, they would listen to you.
translation:
  language: fr
  text: Ce n’est pas vers de nombreux peuples au parler obscur et à la langue difficile[a], dont tu ne comprendrais pas les paroles ; assurément, si je t’avais envoyé vers eux, eux t’auraient écouté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « profonds de lèvre et lourds de langue », expression désignant des paroles difficiles à comprendre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּים רַבִּים
  choice: de nombreux peuples
  rationale: « Peuples » conserve ici la pluralité ethnique ou nationale de עַמִּים sans la restreindre au sens politique de « nations ».
- source_word: עִמְקֵי שָׂפָה
  choice: au parler obscur
  rationale: L’expression signifie littéralement « profonds de lèvre » et désigne une manière de parler difficile à saisir. « Parler obscur » en rend le sens tout en gardant une certaine coloration imagée.
- source_word: וְכִבְדֵי לָשׁוֹן
  choice: et à la langue difficile
  rationale: Littéralement « lourds de langue » ; dans ce contexte, l’expression caractérise une langue difficile à comprendre plutôt qu’un défaut d’élocution.
- source_word: אֲשֶׁר לֹא תִשְׁמַע דִּבְרֵיהֶם
  choice: dont tu ne comprendrais pas les paroles
  rationale: שׁמע peut signifier « entendre » ou « comprendre ». Puisqu’il est question de langues étrangères, « comprendre » exprime le sens contextuel ; le conditionnel s’accorde naturellement en français avec les peuples envisagés de façon hypothétique.
- source_word: אִם לֹא
  choice: Assurément, si
  rationale: Dans cette construction, אִם לֹא donne une forte valeur affirmative à la condition. « Assurément, si » en conserve l’insistance sans transformer l’hypothèse en affirmation pure et simple.
- source_word: שְׁלַחְתִּיךָ
  choice: je t’avais envoyé
  rationale: Le plus-que-parfait convient à la condition irréelle du passé exprimée ici en français.
- source_word: הֵמָּה יִשְׁמְעוּ אֵלֶיךָ
  choice: eux, ils t’auraient écouté
  rationale: Le pronom indépendant הֵמָּה est rendu par la reprise emphatique « eux, ils ». Avec אֶל, שׁמע signifie naturellement « écouter quelqu’un », ce qui laisse ouverte la portée exacte de leur réponse sans surtraduire par « obéir ».
