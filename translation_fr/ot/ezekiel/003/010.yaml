  text: וַ/יֹּ֖אמֶר אֵלָ֑/י בֶּן אָדָ֕ם אֶת כָּל דְּבָרַ/י֙ אֲשֶׁ֣ר אֲדַבֵּ֣ר אֵלֶ֔י/ךָ קַ֥ח בִּֽ/לְבָבְ/ךָ֖ וּ/בְ/אָזְנֶ֥י/ךָ שְׁמָֽע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/010.yaml
  text: Then he said to me[a], “Son of man, receive in your heart all my words that I speak to you, and hear with your ears.”
translation:
  language: fr
  text: 'Puis il me dit : « Fils d’homme, toutes les paroles que je te dirai, reçois-les dans ton cœur[a] et écoute-les de tes propres oreilles. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « prends-les à cœur » ; le verbe hébreu signifie littéralement « prendre » et exprime ici l’accueil intérieur des paroles de Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Cette formule récurrente par laquelle Dieu s’adresse à Ézéchiel conserve la forme concrète de l’hébreu sans la réduire à une simple désignation comme « mortel ».
- source_word: אֶת כָּל דְּבָרַי
  choice: toutes les paroles
  rationale: '« Paroles » préserve l’accent concret mis sur ce que Dieu communique et convient aux deux actions demandées : recevoir et écouter.'
- source_word: אֲדַבֵּר אֵלֶיךָ
  choice: que je te dirai
  rationale: L’imparfait hébreu peut viser ici les paroles que Dieu adressera au prophète. Le futur français s’accorde naturellement avec la mission qui lui est confiée.
- source_word: קַח בִּלְבָבְךָ
  choice: reçois-les dans ton cœur
  rationale: Le verbe signifie littéralement « prendre », mais l’expression décrit l’accueil intérieur des paroles. « Reçois-les » rend ce sens tout en conservant l’image du cœur.
- source_word: וּבְאָזְנֶיךָ שְׁמָע
  choice: et écoute-les de tes oreilles
  rationale: Cette formulation volontairement concrète maintient la mention explicite des oreilles et l’appel à une écoute attentive.
theological_decisions:
- issue: Sens de אָדָם dans l’adresse בֶּן אָדָם
  choice: Fils d’homme
  alternative: être humain ; mortel
  rationale: La traduction garde la formule hébraïque caractéristique d’Ézéchiel, sans la neutraliser ni lui imposer ici une interprétation christologique ultérieure.
translation_notes:
  register: Français moderne, clair et digne. La tournure « écoute-les de tes oreilles », légèrement marquée en français courant, est conservée pour rendre l’insistance corporelle de l’hébreu.
