reference: Ezekiel 3:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֔/י בֶּן אָדָ֕ם אֵ֥ת אֲשֶׁר תִּמְצָ֖א אֱכ֑וֹל אֱכוֹל֙ אֶת הַ/מְּגִלָּ֣ה הַ/זֹּ֔את וְ/לֵ֥ךְ דַּבֵּ֖ר אֶל בֵּ֥ית יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/001.yaml
  text: Then he said to me[a], “Son of man, eat what you find; eat this scroll, and go, speak to the house of Israel.”
translation:
  language: fr
  text: 'Puis il me dit : « Fils d’homme, mange ce que tu trouves[a] ; mange ce rouleau-ci, puis va parler à la maison d’Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mange tout ce que tu trouves ». L’expression hébraïque peut se comprendre dans un sens plus englobant ; dans le contexte, Ézéchiel doit consommer ce qui lui est présenté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Puis il me dit
  rationale: Le waw consécutif fait avancer le récit. « Puis » exprime naturellement cette succession en français moderne.
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Cette formulation traditionnelle et transparente conserve l’image hébraïque ainsi que le contraste entre le prophète humain et Dieu, sans la réduire à une paraphrase.
- source_word: אֵת אֲשֶׁר תִּמְצָא
  choice: ce que tu trouves
  rationale: Rendu idiomatique et proche de la construction hébraïque. Le sens plus englobant « tout ce que tu trouves » reste possible et est signalé en note.
- source_word: אֱכֹל אֱכוֹל
  choice: mange… mange
  rationale: La répétition de l’impératif est conservée afin de rendre son insistance plutôt que de la remplacer par un adverbe interprétatif.
- source_word: מְגִלָּה
  choice: rouleau
  rationale: « Rouleau » désigne clairement le support écrit ancien et correspond précisément au terme hébreu.
- source_word: וְלֵךְ
  choice: puis va
  rationale: L’impératif simple et l’enchaînement des ordres sont conservés ; « puis » rend la progression naturelle en français.
- source_word: דַּבֵּר
  choice: parler
  rationale: « Parler » est l’équivalent direct du verbe hébreu et évite d’ajouter la force interprétative de « proclamer ».
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Cette traduction préserve l’expression collective et l’image d’alliance du texte hébreu.
theological_decisions:
- issue: Sens de אָדָם dans l’appellation בֶּן אָדָם
  choice: Fils d’homme
  alternative: être humain
  rationale: Le choix conserve la forme imagée et récurrente de l’adresse faite à Ézéchiel, sans lui imposer ici un sens christologique ni effacer sa valeur représentative humaine.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement correspond à l’adresse directe singulière. La répétition de « mange » et l’expression « maison d’Israël » maintiennent les traits saillants de l’hébreu.
