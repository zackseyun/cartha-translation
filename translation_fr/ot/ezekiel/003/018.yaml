  text: בְּ/אָמְרִ֤/י לָֽ/רָשָׁע֙ מ֣וֹת תָּמ֔וּת וְ/לֹ֣א הִזְהַרְתּ֗/וֹ וְ/לֹ֥א דִבַּ֛רְתָּ לְ/הַזְהִ֥יר רָשָׁ֛ע מִ/דַּרְכּ֥/וֹ הָ/רְשָׁעָ֖ה לְ/חַיֹּת֑/וֹ ה֤וּא רָשָׁע֙ בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/דָמ֖/וֹ מִ/יָּדְ/ךָ֥ אֲבַקֵּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/018.yaml
  text: When I say to the wicked man[a], ‘You shall surely die,’ and you do not warn him, and you do not speak to warn the wicked man from his wicked way so that he may live, that wicked man shall die in his iniquity[b], but I will require his blood from your hand.
translation:
  language: fr
  text: 'Quand je dis au méchant : « Tu mourras certainement ! » et que tu ne l’avertis pas, que tu ne lui parles pas pour l’avertir de sa mauvaise conduite afin qu’il vive, ce méchant mourra dans sa faute[a], mais je réclamerai son sang de ta main[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « à cause de sa faute » ou « pour sa faute ».'
    reason: La préposition ב peut exprimer la situation dans laquelle il meurt ou la cause de sa mort.
  - marker: b
    text: 'L’expression signifie : « je te demanderai compte de son sang », c’est-à-dire que je te tiendrai pour responsable de sa mort.'
    reason: 'L’hébreu emploie littéralement une image judiciaire : réclamer le sang de quelqu’un de la main d’un autre.'
lexical_decisions:
- source_word: בְּאָמְרִי
  choice: Quand je dis
  rationale: La construction introduit une proposition temporelle. « Quand je dis » est naturel en français et conserve cette valeur.
- source_word: לָרָשָׁע / רָשָׁע
  choice: au méchant / le méchant
  rationale: Le terme désigne ici un individu coupable ou mauvais. La forme masculine singulière et la répétition rhétorique de la racine sont conservées.
- source_word: מוֹת תָּמוּת
  choice: Tu mourras certainement
  rationale: L’infinitif absolu suivi du verbe conjugué exprime une forte insistance et la certitude de la mort annoncée.
- source_word: הִזְהַרְתּוֹ / לְהַזְהִיר
  choice: l’avertis / l’avertir
  rationale: Le hifil de זהר signifie ici donner un avertissement. La répétition des deux occurrences est maintenue.
- source_word: מִדַּרְכּוֹ הָרְשָׁעָה
  choice: de renoncer à sa mauvaise conduite
  rationale: דֶּרֶךְ désigne métaphoriquement la manière de vivre. Cette formulation française exprime naturellement l’avertissement visant à éloigner le méchant de sa conduite mauvaise.
- source_word: לְחַיֹּתוֹ
  choice: afin qu’il vive
  rationale: L’infinitif exprime le but. La traduction ne précise pas si la vie envisagée est seulement physique ou possède une portée plus large.
- source_word: בַּעֲוֺנוֹ
  choice: dans sa faute
  rationale: La formulation garde la valeur circonstancielle possible de la préposition ב sans réduire le rapport à une causalité explicite; une note signale les autres nuances possibles.
- source_word: דָּמוֹ
  choice: son sang
  rationale: Le terme concret « sang » conserve l’image judiciaire de la responsabilité pour la mort d’autrui.
- source_word: מִיָּדְךָ אֲבַקֵּשׁ
  choice: je réclamerai son sang de ta main
  rationale: La traduction conserve l’image hébraïque solennelle de la main dont le sang est réclamé, tout en signalant en note le sens idiomatique de responsabilité.
theological_decisions:
- issue: Portée des termes « mourir » et « vivre »
  choice: Traduire simplement par « mourir » et « vivre », sans en limiter la portée.
  alternative: Les interpréter exclusivement comme la mort et la vie physiques, ou exclusivement comme la mort et la vie spirituelles.
  rationale: Le texte associe jugement, conduite morale et possibilité de vivre sans préciser ici une seule dimension de la mort ou de la vie.
- issue: Rapport entre la faute et la mort
  choice: « mourra dans sa faute »
  alternative: « mourra à cause de sa faute » ou « mourra pour sa faute »
  rationale: La préposition hébraïque permet une nuance circonstancielle aussi bien qu’une nuance causale. Le texte principal conserve cette ouverture et la note présente les autres possibilités.
translation_notes:
  register: Français international moderne, solennel mais accessible. La répétition de « méchant » et d’« avertir » reflète l’insistance du texte hébreu. L’expression finale, volontairement plus littérale, conserve l’image judiciaire et est expliquée en note.
