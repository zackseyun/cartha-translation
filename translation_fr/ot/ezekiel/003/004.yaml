id: EZK.3.4
reference: Ezekiel 3:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֵלָ֑/י בֶּן אָדָ֗ם לֶךְ בֹּא֙ אֶל בֵּ֣ית יִשְׂרָאֵ֔ל וְ/דִבַּרְתָּ֥ בִ/דְבָרַ֖/י אֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/004.yaml
  text: Then he said to me[a], “Son of man, go to the house of Israel and speak my words to them.”
translation:
  language: fr
  text: 'Puis il me dit : « Fils d’homme[a], va auprès de la maison d’Israël et dis-leur mes paroles. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « être humain » ou « mortel ». Cette expression hébraïque est la formule récurrente par laquelle Dieu s’adresse à Ézéchiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Puis il me dit
  rationale: Le waw consécutif fait avancer le récit. « Puis » exprime naturellement la succession en français.
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Cette formule récurrente par laquelle Dieu s’adresse à Ézéchiel est conservée afin de respecter l’image et la portée littéraire de l’hébreu, sans lui imposer un sens christologique ultérieur.
- source_word: לֶךְ בֹּא
  choice: va auprès de
  rationale: Les deux impératifs hébreux forment ici une instruction de déplacement vers un destinataire. Une reproduction mécanique telle que « va, viens vers » serait obscure en français ; « va auprès de » en restitue naturellement le mouvement et le but.
- source_word: אֶל בֵּית יִשְׂרָאֵל
  choice: auprès de la maison d’Israël
  rationale: « Maison d’Israël » conserve l’expression prophétique qui désigne le peuple d’Israël, tandis que « auprès de » convient à la mission adressée à ce peuple.
- source_word: וְדִבַּרְתָּ בִדְבָרַי אֲלֵיהֶם
  choice: et dis-leur mes paroles
  rationale: Après les impératifs, la forme verbale exprime une instruction conséquente. Cette formulation française conserve « mes paroles » plutôt que de généraliser en « mon message » et rend clairement le destinataire.
theological_decisions:
- issue: Sens de אָדָם dans l’adresse בֶּן אָדָם
  choice: Fils d’homme
  alternative: Être humain ; mortel
  rationale: « Fils d’homme » préserve la forme de l’expression hébraïque et son rôle distinctif dans Ézéchiel. Les autres traductions possibles explicitent davantage la fragilité ou la condition humaine, mais ne sont pas imposées dans le texte.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste naturelle tout en conservant l’expression prophétique « maison d’Israël » et l’adresse caractéristique « Fils d’homme ».
