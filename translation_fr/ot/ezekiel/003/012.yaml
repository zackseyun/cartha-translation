  text: וַ/תִּשָּׂאֵ֣/נִי ר֔וּחַ וָ/אֶשְׁמַ֣ע אַחֲרַ֔/י ק֖וֹל רַ֣עַשׁ גָּד֑וֹל בָּר֥וּךְ כְּבוֹד יְהוָ֖ה מִ/מְּקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/012.yaml
  text: 'Then the Spirit lifted me up, and I heard behind me a sound of a great rumbling: “Blessed be the glory of the LORD from his place.”'
translation:
  language: fr
  text: 'Alors l’Esprit me souleva, et j’entendis derrière moi le bruit d’un grand grondement : « Bénie soit la gloire du Seigneur depuis son lieu ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רוּחַ
  choice: l’Esprit
  rationale: Dans le contexte visionnaire d’Ézéchiel, le terme désigne la puissance personnelle qui saisit et transporte le prophète; la majuscule reflète cette lecture contextuelle sans effacer la polysémie possible de « souffle/esprit ».
- source_word: קוֹל רַעַשׁ גָּדוֹל
  choice: le bruit d’un grand grondement
  rationale: קוֹל peut désigner un son ou un bruit, tandis que רַעַשׁ évoque un fracas, grondement ou tumulte; cette formulation française conserve les deux éléments sans les réduire à une simple voix.
- source_word: בָּרוּךְ כְּבוֹד יְהוָה
  choice: Bénie soit la gloire du Seigneur
  rationale: La formule hébraïque est une acclamation elliptique. Le subjonctif français restitue naturellement sa force doxologique, et « le Seigneur » suit l’usage français de lecture du tétragramme.
- source_word: מִמְּקוֹמוֹ
  choice: depuis le lieu où il demeure
  rationale: Littéralement « depuis son lieu ». La formulation explicite légèrement l’expression possessive pour produire un français naturel tout en conservant l’idée de provenance.
theological_decisions:
- issue: Identification de רוּחַ
  choice: l’Esprit
  alternative: un souffle / le vent
  rationale: Le contexte immédiat présente רוּחַ comme l’agent qui soulève Ézéchiel; « l’Esprit » convient le mieux, sans développer davantage son identité théologique.
- issue: Sens de la bénédiction prononcée sur la gloire divine
  choice: Conserver l’acclamation « Bénie soit la gloire »
  alternative: « Louée soit la gloire » ou « la gloire du Seigneur se leva »
  rationale: Le texte massorétique porte clairement בָּרוּךְ, « béni ». Il faut préserver cette formulation inhabituelle plutôt que la normaliser ou adopter une reconstruction conjecturale.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme solennel de la vision est conservé; « grand grondement » rend l’intensité sonore sans lourdeur archaïque.
