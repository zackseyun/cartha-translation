source:
  edition: WLC
  text: בֶּן אָדָ֕ם צֹפֶ֥ה נְתַתִּ֖י/ךָ לְ/בֵ֣ית יִשְׂרָאֵ֑ל וְ/שָׁמַעְתָּ֤ מִ/פִּ/י֙ דָּבָ֔ר וְ/הִזְהַרְתָּ֥ אוֹתָ֖/ם מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/017.yaml
  text: Son of man[a], I have made you a watchman for the house of Israel[b]; and you shall hear a word from my mouth and warn them from me.
translation:
  language: fr
  text: Fils d’homme[a], je t’ai établi comme sentinelle pour la maison d’Israël. Tu écouteras une parole de ma bouche et tu les avertiras de ma part.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « être humain » ou « mortel ». Cette expression hébraïque revient souvent lorsque Dieu s’adresse à Ézéchiel.
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi comprendre : « Quand tu entendras une parole de ma bouche, tu les avertiras de ma part. »'
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Rend directement l’expression hébraïque récurrente par laquelle Dieu s’adresse à Ézéchiel, tout en préservant sa portée littéraire et intertextuelle.
- source_word: צֹפֶה
  choice: sentinelle
  rationale: Le terme désigne une personne chargée de veiller et de donner l’alerte. « Sentinelle » exprime naturellement ces deux fonctions en français moderne.
- source_word: נְתַתִּיךָ
  choice: je t’ai établi
  rationale: Le verbe signifie littéralement « je t’ai donné/placé » ; avec la fonction de sentinelle, « établir » communique clairement la nomination sans lourdeur.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: pour la maison d’Israël
  rationale: La préposition indique ici la collectivité auprès de laquelle Ézéchiel reçoit sa mission. « Pour » reste naturel et n’ajoute pas l’idée d’autorité contenue dans « sur ».
- source_word: וְשָׁמַעְתָּ
  choice: Tu écouteras
  rationale: Le futur français porte ici la valeur d’instruction de la forme verbale hébraïque et conserve la coordination du texte sans imposer une subordination temporelle.
- source_word: מִפִּי דָּבָר
  choice: une parole de ma bouche
  rationale: Cette formulation garde à la fois le sens large de דָּבָר et l’image concrète de la parole qui sort de la bouche de Dieu.
- source_word: וְהִזְהַרְתָּ אוֹתָם
  choice: tu les avertiras
  rationale: Le hifil exprime l’action de mettre en garde. Le pronom renvoie collectivement à la maison d’Israël.
- source_word: מִמֶּנִּי
  choice: de ma part
  rationale: Cette expression française naturelle indique que l’avertissement vient de Dieu et qu’Ézéchiel le transmet en son nom, sans modifier la source du message.
theological_decisions:
- issue: Valeur coordonnée ou temporelle de la séquence verbale
  choice: Tu écouteras une parole de ma bouche et tu les avertiras de ma part.
  alternative: Quand tu entendras une parole de ma bouche, tu les avertiras de ma part.
  rationale: La coordination reproduit plus directement les deux verbes reliés par וְ et laisse au contexte le rapport temporel évident entre réception et transmission. La note signale la lecture temporelle possible sans la rendre obligatoire dans le texte.
- issue: Maintien de l’expression בֶּן אָדָם
  choice: Fils d’homme
  alternative: Être humain ; mortel
  rationale: Dans Ézéchiel, il s’agit d’une formule d’adresse répétée au prophète. La traduction directe préserve cette caractéristique et ses résonances, tandis que la note en précise le sens hébraïque sans l’assimiler automatiquement à d’autres emplois bibliques.
translation_notes:
  register: Français international moderne, sobre et digne. « Fils d’homme » conserve l’idiome traditionnel ; « sentinelle » est courant et rend la fonction de veille et d’alerte. Le futur a ici une valeur de consigne solennelle.
