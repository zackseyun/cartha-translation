source:
  edition: WLC
  text: וַ/תְּהִ֥י עָלַ֛/י שָׁ֖ם יַד יְהוָ֑ה וַ/יֹּ֣אמֶר אֵלַ֗/י ק֥וּם צֵא֙ אֶל הַ/בִּקְעָ֔ה וְ/שָׁ֖ם אֲדַבֵּ֥ר אוֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/022.yaml
  text: And there the hand of Yahweh was upon me[a], and he said to me, “Rise, go out to the valley[b], and there I will speak with you.”
translation:
  language: fr
  text: 'Là, la main de Yahweh fut sur moi, et il me dit : « Lève-toi, sors vers la vallée[a] ; là, je parlerai avec toi[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la plaine ».
    reason: lexical_alternative
  - marker: b
    text: Ou « je te parlerai ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי עָלַי
  choice: fut sur moi
  rationale: Conserve l’image hébraïque d’une puissance ou d’une influence divine reposant sur le prophète, sans ajouter explicitement l’idée d’une venue soudaine.
- source_word: שָׁם
  choice: là
  rationale: Adverbe locatif direct, repris deux fois afin de préserver l’insistance spatiale du texte.
- source_word: יַד יְהוָה
  choice: la main de Yahweh
  rationale: Maintient la métaphore prophétique concrète de la main divine plutôt que de l’expliciter par « puissance ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme au lieu de lui substituer un titre.
- source_word: וַיֹּאמֶר אֵלַי
  choice: et il me dit
  rationale: Rendu français courant et fidèle de la formule narrative ; le pronom renvoie à Yahweh dans le contexte.
- source_word: קוּם
  choice: Lève-toi
  rationale: Impératif naturel en français moderne, clair et digne.
- source_word: צֵא
  choice: sors
  rationale: Rend directement le mouvement vers l’extérieur exprimé par le verbe hébreu.
- source_word: הַבִּקְעָה
  choice: la vallée
  rationale: Le nom peut désigner une large dépression ou une plaine encaissée ; « vallée » convient au contexte, tandis que « plaine » reste possible.
- source_word: אֲדַבֵּר אוֹתָךְ
  choice: je parlerai avec toi
  rationale: Préserve la construction hébraïque et sa possible nuance relationnelle, sans exclure le sens plus unidirectionnel « je te parlerai ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le tétragramme ; « Yahweh » préserve le nom personnel plutôt que de le remplacer par un titre.
- issue: Portée de l’expression « la main de Yahweh »
  choice: conserver la métaphore
  alternative: la puissance de Yahweh fut sur moi
  rationale: La formulation concrète peut évoquer puissance, emprise ou impulsion prophétique ; la traduire littéralement préserve cette richesse sans trancher entre ces nuances.
- issue: Direction de la parole dans אֲדַבֵּר אוֹתָךְ
  choice: je parlerai avec toi
  alternative: je te parlerai
  rationale: La construction autorise les deux rendus ; « avec toi » reflète de près la forme hébraïque sans imposer que l’échange soit nécessairement réciproque.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe narrative reste proche de l’hébreu ; les répétitions spatiales et la métaphore prophétique sont conservées. Les marqueurs [a] et [b] figurent dans le texte aux endroits correspondants.
