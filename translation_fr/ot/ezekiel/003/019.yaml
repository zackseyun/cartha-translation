source:
  edition: WLC
  text: וְ/אַתָּה֙ כִּֽי הִזְהַ֣רְתָּ רָשָׁ֔ע וְ/לֹא שָׁב֙ מֵֽ/רִשְׁע֔/וֹ וּ/מִ/דַּרְכּ֖/וֹ הָ/רְשָׁעָ֑ה ה֚וּא בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/אַתָּ֖ה אֶֽת נַפְשְׁ/ךָ֥ הִצַּֽלְתָּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/019.yaml
  text: But if you warn a wicked man and he does not turn from his wickedness or from his wicked way[a], he will die in his iniquity[b], but you will have delivered your life.
translation:
  language: fr
  text: Mais si tu avertis le méchant et qu’il ne se détourne ni de sa méchanceté ni de sa mauvaise conduite[a], il mourra dans son iniquité[b] ; mais toi, tu auras sauvé ta vie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ni de son mauvais chemin ».'
    reason: La note conserve la métaphore hébraïque de דֶּרֶךְ, rendue dans le texte par le français moderne « conduite ».
  - marker: b
    text: 'Ou : « dans sa culpabilité ».'
    reason: עָוֹן peut désigner l’iniquité, la culpabilité ou les conséquences de la faute ; la note préserve cette nuance morale et juridique.
  - marker: c
    text: 'Ou : « tu t’auras sauvé toi-même » ou « tu auras délivré ta vie ».'
    reason: Dans cette expression, נֶפֶשׁ désigne la vie ou la personne elle-même, non nécessairement une âme au sens immatériel moderne.
lexical_decisions:
- source_word: הִזְהַרְתָּ
  choice: tu avertis
  rationale: Le hifil de זהר signifie ici « avertir » ou « mettre en garde ». « Avertir » est direct, naturel et adapté au contexte de la sentinelle.
- source_word: רָשָׁע
  choice: le méchant
  rationale: L’adjectif masculin singulier substantivé désigne ici un homme caractérisé par sa méchanceté. « Le méchant » conserve la forme générique et traditionnelle sans alourdir la phrase.
- source_word: שָׁב
  choice: se détourne
  rationale: שׁוב exprime fondamentalement l’idée de tourner ou revenir. Avec la préposition מן, « se détourner de » restitue naturellement l’image hébraïque sans imposer le terme théologique « se repentir ».
- source_word: מֵרִשְׁעוֹ
  choice: de sa méchanceté
  rationale: רֶשַׁע désigne la méchanceté, le mal ou l’agir coupable. « Méchanceté » maintient le lien lexical avec « le méchant ».
- source_word: וּמִדַּרְכּוֹ הָרְשָׁעָה
  choice: ni de sa mauvaise conduite
  rationale: דֶּרֶךְ est littéralement le « chemin », mais désigne souvent métaphoriquement la manière de vivre. « Conduite » rend clairement ce sens en français moderne ; avec la négation, la coordination hébraïque se formule naturellement par « ni… ni ».
- source_word: בַּעֲוֺנוֹ
  choice: dans sa faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou les conséquences de l’iniquité. « Dans sa faute » conserve la préposition et l’ambiguïté entre acte coupable et état de culpabilité, sans préciser indûment la nature de la mort.
- source_word: הִצַּלְתָּ אֶת־נַפְשְׁךָ
  choice: tu auras sauvé ta vie
  rationale: נֶפֶשׁ désigne ici la vie ou la personne elle-même plutôt qu’une âme immatérielle au sens restreint. Le futur antérieur exprime la valeur contextuelle de l’accompli après l’énoncé futur précédent.
theological_decisions:
- issue: La portée de la mort annoncée au méchant
  choice: Dire simplement qu’il « mourra dans sa faute »
  alternative: Préciser qu’il mourra à cause de son péché, ou qu’il subira une condamnation éternelle
  rationale: L’hébreu affirme sa mort dans sa faute ou sa culpabilité, mais ne définit pas ici explicitement s’il s’agit seulement d’une mort judiciaire et temporelle ou si l’énoncé comporte une portée plus large. La traduction maintient cette tension.
- issue: Le sens de נַפְשְׁךָ
  choice: « ta vie »
  alternative: « ton âme » ou « toi-même »
  rationale: Dans ce contexte de responsabilité de la sentinelle, נֶפֶשׁ renvoie à la vie ou à la personne d’Ézéchiel. « Ta vie » évite de suggérer sans nécessité une doctrine particulière de l’âme tout en conservant la gravité de l’avertissement.
- issue: La relation entre « méchanceté » et « mauvaise conduite »
  choice: 'Les présenter comme deux formulations étroitement associées sous une coordination négative : « ni… ni »'
  alternative: Les traiter comme deux conditions indépendantes reliées par « ou »
  rationale: Après une proposition négative, le français idiomatique emploie « ni… ni » pour rendre la coordination hébraïque. Cela ne tranche pas artificiellement entre l’état moral et la conduite qui l’exprime.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement suit l’adresse divine singulière à Ézéchiel. La formulation garde le parallélisme moral du texte tout en évitant des expressions archaïques ou une explicitation doctrinale excessive.
