reference: Ezekiel 3:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בֵ֣ית יִשְׂרָאֵ֗ל לֹ֤א יֹאבוּ֙ לִ/שְׁמֹ֣עַ אֵלֶ֔י/ךָ כִּֽי אֵינָ֥/ם אֹבִ֖ים לִ/שְׁמֹ֣עַ אֵלָ֑/י כִּ֚י כָּל בֵּ֣ית יִשְׂרָאֵ֔ל חִזְקֵי מֵ֥צַח וּ/קְשֵׁי לֵ֖ב הֵֽמָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/007.yaml
  text: But the house of Israel will not be willing to listen to you[a], because they are not willing to listen to me[b]; for all the house of Israel are hard of forehead and stubborn of heart.
translation:
  language: fr
  text: Mais la maison d’Israël ne voudra pas t’écouter, parce qu’elle ne veut pas m’écouter ; en effet, toute la maison d’Israël a le front dur[a] et le cœur obstiné[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le front fort ». L’image évoque une obstination effrontée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le cœur dur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בֵית יִשְׂרָאֵל
  choice: Mais la maison d’Israël
  rationale: Le waw marque ici le contraste avec les peuples étrangers évoqués juste avant. « La maison d’Israël » conserve l’expression collective et son caractère d’alliance.
- source_word: יֹאבוּ / אֹבִים
  choice: ne voudra pas / ne veut pas
  rationale: Le verbe אָבָה exprime la volonté ou le consentement. La variation temporelle rend l’imparfait puis le participe hébreux sans réduire l’idée à une simple incapacité d’entendre.
- source_word: לִשְׁמֹעַ אֵלֶיךָ / לִשְׁמֹעַ אֵלַי
  choice: t’écouter / m’écouter
  rationale: « Écouter » rend naturellement שׁמע avec אֶל et maintient le parallèle entre le rejet du prophète et celui de Dieu, sans expliciter excessivement l’implication d’obéissance.
- source_word: כִּי ... כִּי
  choice: parce que ... en effet
  rationale: Le premier כִּי donne la cause directe du refus d’écouter Ézéchiel ; le second introduit l’explication de cette disposition générale.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: toute la maison d’Israël
  rationale: Cette formulation préserve la portée collective et exhaustive de l’expression hébraïque.
- source_word: חִזְקֵי מֵצַח
  choice: a le front dur
  rationale: La traduction conserve l’image corporelle frappante de l’hébreu, qui évoque une obstination effrontée, tout en restant compréhensible en français.
- source_word: וּקְשֵׁי לֵב
  choice: le cœur obstiné
  rationale: Cette expression préserve la métaphore du cœur comme siège de la volonté et rend la résistance intérieure sans répéter « dur ».
- source_word: הֵמָּה
  choice: a ... le front ... et le cœur
  rationale: Le pronom emphatique final est intégré à la prédication française. Le sujet collectif « toute la maison » appelle naturellement le singulier grammatical.
theological_decisions:
- issue: Caractérisation collective d’Israël
  choice: Conserver « toute la maison d’Israël » sans atténuer la portée de l’énoncé.
  alternative: « Beaucoup en Israël » ou « les chefs d’Israël ».
  rationale: Le texte hébreu formule une accusation collective explicite dans ce contexte prophétique. La traduction ne doit pas la restreindre à un groupe que le verset ne nomme pas.
translation_notes:
  register: Français international moderne, digne et accessible. La structure causale et le parallélisme du texte hébreu sont maintenus ; les images du front et du cœur sont conservées, avec des notes pour en préciser les nuances.
