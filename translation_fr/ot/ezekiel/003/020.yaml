revisions:
- from: Mais si un homme juste se détourne de sa justice et commet l’injustice[a], et si je place devant lui une pierre d’achoppement[b], il mourra. Parce que tu ne l’as pas averti, il mourra dans son péché. Les actes de justice qu’il a accomplis ne seront pas retenus[c], et je te demanderai compte de son sang[d].
  to: Mais lorsqu’un homme juste se détourne de sa justice et commet l’injustice[a], et que je place devant lui une pierre d’achoppement[b], il mourra. Parce que tu ne l’as pas averti, il mourra dans son péché. Les actes de justice qu’il a accomplis ne seront pas gardés en mémoire[c], et je te demanderai compte de son sang[d].
  rationale: La révision supprime le second « si », qui n’est pas présent dans l’hébreu et conditionnait indûment l’action divine. Elle rend également l’idée de « ne pas être rappelé » par « ne pas être gardé en mémoire », plus proche du champ sémantique de זכר tout en restant idiomatique. Elle ne résout ni l’attribution explicite à Dieu de la pierre d’achoppement ni les implications théologiques de la non-mémoire des actes justes antérieurs.
  reviewer_model: gpt-5.6-terra
