source:
  edition: WLC
  text: וּ/בְ/שׁ֨וּב צַדִּ֤יק מִ/צִּדְק/וֹ֙ וְ/עָ֣שָׂה עָ֔וֶל וְ/נָתַתִּ֥י מִכְשׁ֛וֹל לְ/פָנָ֖י/ו ה֣וּא יָמ֑וּת כִּ֣י לֹ֤א הִזְהַרְתּ/וֹ֙ בְּ/חַטָּאת֣/וֹ יָמ֔וּת וְ/לֹ֣א תִזָּכַ֗רְןָ צִדְקֹתָ/ו֙ אֲשֶׁ֣ר עָשָׂ֔ה וְ/דָמ֖/וֹ מִ/יָּדְ/ךָ֥ אֲבַקֵּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/020.yaml
  text: And when a righteous man turns from his righteousness and does injustice[a], and I place a stumbling block before him, he will die. Because you did not warn him, he will die in his sin, and his righteous deeds that he did will not be remembered[d][c][b]; and I will require his blood from your hand.
translation:
  language: fr
  text: Mais lorsqu’un homme juste se détourne de sa justice et commet l’injustice[a], et que je place devant lui une pierre d’achoppement[b], il mourra. Parce que tu ne l’as pas averti, il mourra dans son péché. Les actes de justice qu’il a accomplis ne seront pas gardés en mémoire[c], et je te demanderai compte de son sang[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « commet le mal » ou « commet l’iniquité ». Le terme hébreu désigne ce qui est mauvais, injuste ou contraire au droit.
    reason: lexical_alternative
  - marker: b
    text: Ou « un obstacle qui le fera trébucher ». L’hébreu emploie littéralement l’image de ce qui fait trébucher.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « ne seront pas rappelés »; c’est-à-dire qu’ils ne seront plus gardés en mémoire.
    reason: lexical_alternative
  - marker: d
    text: Cette expression signifie que Dieu tiendra la sentinelle pour responsable de la mort de cet homme.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְשׁוּב
  choice: Mais si ... se détourne
  rationale: L’infinitif construit avec ב introduit une circonstance temporelle à valeur conditionnelle. « Si » exprime naturellement cette force en français; « mais » marque le contraste avec le cas précédent dans le contexte immédiat.
- source_word: צַדִּיק
  choice: un homme juste
  rationale: L’adjectif masculin singulier est employé comme substantif. Cette formulation conserve le genre et le nombre du texte tout en restant naturelle.
- source_word: מִצִּדְקוֹ
  choice: de sa justice
  rationale: Le nom désigne ici la justice ou la conduite juste dont l’homme se détourne. La formulation directe préserve aussi le lien lexical avec les actes de justice mentionnés ensuite.
- source_word: וְעָשָׂה עָוֶל
  choice: et commet l’injustice
  rationale: עָוֶל désigne le mal, l’iniquité ou l’injustice. « Commet l’injustice » garde sa portée morale et judiciaire dans un français actuel.
- source_word: וְנָתַתִּי מִכְשׁוֹל לְפָנָיו
  choice: et si je place devant lui une pierre d’achoppement
  rationale: מִכְשׁוֹל est un obstacle qui fait trébucher. « Pierre d’achoppement » conserve la métaphore concrète et l’attribution explicite de l’action à Dieu.
- source_word: הוּא יָמוּת
  choice: il mourra
  rationale: Le pronom hébreu est emphatique, mais le français exprime adéquatement le résultat par cette proposition simple.
- source_word: כִּי לֹא הִזְהַרְתּוֹ
  choice: Parce que tu ne l’as pas averti
  rationale: כִּי introduit ici une explication causale, et le verbe signifie avertir ou mettre en garde.
- source_word: בְּחַטָּאתוֹ
  choice: dans son péché
  rationale: La préposition ב présente le péché comme la situation dans laquelle il meurt; la traduction reste proche de l’idiome prophétique.
- source_word: וְלֹא תִזָּכַרְןָ צִדְקֹתָיו אֲשֶׁר עָשָׂה
  choice: Les actes de justice qu’il a accomplis ne seront pas retenus
  rationale: Le pluriel צִדְקֹתָיו renvoie à des actes justes concrets. « Ne seront pas retenus » exprime ici que ces actes ne seront pas pris en compte, tout en conservant l’idée de mémoire judiciaire.
- source_word: וְדָמוֹ מִיָּדְךָ אֲבַקֵּשׁ
  choice: et je te demanderai compte de son sang
  rationale: Cette tournure française naturelle conserve l’image du sang et le sens judiciaire de responsabilité porté par l’expression hébraïque.
theological_decisions:
- issue: Dieu place une pierre d’achoppement devant l’homme juste qui se détourne
  choice: Conserver explicitement l’action divine et la métaphore de la pierre d’achoppement.
  alternative: Paraphraser par « un obstacle le fera tomber » ou réduire l’action divine à une simple conséquence providentielle.
  rationale: L’hébreu attribue sans détour cette action à Dieu. La traduction ne doit ni atténuer cette affirmation ni résoudre la tension entre l’action divine et la responsabilité humaine.
- issue: Les actes justes antérieurs ne sont pas retenus après le détournement
  choice: Affirmer qu’ils ne seront pas retenus dans ce contexte de jugement.
  alternative: Préciser qu’il s’agit d’une perte du salut, d’une perte de statut d’alliance ou seulement d’un avertissement rhétorique.
  rationale: Le verset parle de la non-prise en compte des actes justes antérieurs, sans développer un système doctrinal sur la persévérance ou l’apostasie.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement de l’hébreu, tandis que « demander compte de son sang » rend naturellement l’idiome judiciaire. Les marqueurs de notes sont placés aux segments auxquels ils se rapportent.
