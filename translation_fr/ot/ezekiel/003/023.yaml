  text: וָ/אָקוּם֮ וָ/אֵצֵ֣א אֶל הַ/בִּקְעָה֒ וְ/הִנֵּה שָׁ֤ם כְּבוֹד יְהוָה֙ עֹמֵ֔ד כַּ/כָּב֕וֹד אֲשֶׁ֥ר רָאִ֖יתִי עַל נְהַר כְּבָ֑ר וָ/אֶפֹּ֖ל עַל פָּנָֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/023.yaml
  text: So I arose and went out to the valley[a], and behold, the glory of Yahweh was standing there, like the glory that I had seen by the Kebar River; and I fell on my face.
translation:
  language: fr
  text: Je me levai et sortis pour aller dans la vallée[a]. Et voici que la gloire de Yahweh se tenait là, semblable à la gloire que j’avais vue près du fleuve Kebar. Alors je tombai face contre terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la plaine » ; le mot hébreu peut désigner une large vallée ou une plaine encaissée.
    reason: Alternative lexicale authentique pour בִּקְעָה.
lexical_decisions:
- source_word: וָאָקוּם וָאֵצֵא
  choice: Je me levai donc et sortis
  rationale: Les deux wayyiqtol expriment la succession narrative. « donc » relie naturellement l’action à l’ordre précédent, tandis que « sortis » rend simplement יצא.
- source_word: הַבִּקְעָה
  choice: la vallée
  rationale: בִּקְעָה désigne une large dépression ou une plaine encaissée. « vallée » convient au contexte, mais « plaine » demeure possible et figure en note.
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Cette tournure française actuelle conserve la fonction de הִנֵּה, qui attire vivement l’attention sur la vision.
- source_word: כְּבוֹד יְהוָה
  choice: la gloire de Yahweh
  rationale: « gloire » garde le poids théologique de כָּבוֹד sans expliciter davantage la nature de cette manifestation; le nom divin est translittéré.
- source_word: עֹמֵד
  choice: se tenait là
  rationale: Le participe décrit une présence ou posture durable dans la scène. « se tenait là » est idiomatique en français et évite l’étrangeté de dire que la gloire était simplement « debout ».
- source_word: כַּכָּבוֹד אֲשֶׁר רָאִיתִי
  choice: semblable à la gloire que j’avais vue
  rationale: Le כ préfixé marque la comparaison, et le plus-que-parfait situe naturellement la vision antérieure par rapport au récit présent.
- source_word: עַל נְהַר כְּבָר
  choice: près du fleuve Kebar
  rationale: Dans ce contexte géographique, עַל indique la proximité. « fleuve » rend נְהַר, et « Kebar » translittère le nom propre.
- source_word: וָאֶפֹּל עַל פָּנָי
  choice: Alors je tombai face contre terre
  rationale: La formulation française exprime clairement la prosternation physique indiquée littéralement par « tomber sur son visage », tout en restant naturelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le Tétragramme. « Yahweh » conserve le nom personnel plutôt que de lui substituer un titre.
- issue: Sens de כְּבוֹד יְהוָה
  choice: la gloire de Yahweh
  alternative: la présence glorieuse de Yahweh
  rationale: La traduction littérale préserve la portée visuelle et théologique de l’expression sans réduire la gloire à une définition interprétative.
- issue: Posture exprimée par עֹמֵד à propos de la gloire
  choice: se tenait là
  alternative: était là; se dressait là
  rationale: Le participe évoque une présence stable et possiblement une posture. « se tenait là » préserve cette image sans expliquer comment la gloire prend forme.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple convient au registre biblique soutenu sans archaïsmes marqués; « Et voici que » maintient la vivacité prophétique. Le texte conserve l’ambiguïté de la gloire qui « se tient » là.
