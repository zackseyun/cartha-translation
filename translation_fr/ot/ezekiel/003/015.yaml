base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/015.yaml
  text: Then I came to the exiles at Tel-abib[a], who were living by the Kebar River, where they were living; and I sat there among them for seven days, appalled.
translation:
  language: fr
  text: Puis j’arrivai auprès des exilés à Tel-Abib, qui habitaient près du fleuve Kebar, là où ils étaient établis ; je restai assis là, parmi eux, pendant sept jours, frappé de stupeur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « consterné », « bouleversé » ou « anéanti ». Le terme hébreu évoque un état de choc et d’accablement.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגּוֹלָה
  choice: les exilés
  rationale: Le terme désigne ici la communauté des Judéens déportés plutôt que l’état abstrait d’exil. « Les exilés » est naturel et précis en français moderne.
- source_word: תֵּל אָבִיב
  choice: Tel-Abib
  rationale: Nom de lieu ancien translittéré avec un trait d’union, afin de rendre visible sa forme composée et de le distinguer de la ville moderne de Tel-Aviv.
- source_word: הַיֹּשְׁבִים אֶל נְהַר כְּבָר
  choice: qui habitaient près du fleuve Kebar
  rationale: Le participe indique une résidence établie. « Près de » rend naturellement la relation locale exprimée par אֶל, et « Kebar » translittère כְּבָר.
- source_word: וַאֲשֶׁר הֵמָּה יוֹשְׁבִים שָׁם
  choice: là où ils habitaient
  rationale: La syntaxe hébraïque est difficile et répétitive. Cette formulation conserve la reprise du verbe « habiter » sans ajouter une action absente du texte, telle que « je vis ».
- source_word: וָאֵשֵׁב שָׁם
  choice: Je restai assis là
  rationale: Le verbe signifie littéralement « s’asseoir », mais peut aussi suggérer le fait de demeurer. « Restai assis » préserve la posture concrète ainsi que la durée impliquée par le contexte.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: Formulation française idiomatique pour exprimer une durée.
- source_word: מַשְׁמִים
  choice: frappé de stupeur
  rationale: Le terme exprime un état de choc, de désolation ou de sidération. « Frappé de stupeur » traduit cet accablement sans le réduire à un simple étonnement.
- source_word: בְּתוֹכָם
  choice: parmi eux
  rationale: Équivalent français naturel indiquant la présence d’Ézéchiel au milieu du groupe.
theological_decisions: []
translation_notes:
