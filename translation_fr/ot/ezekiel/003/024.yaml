source:
  edition: WLC
  text: וַ/תָּבֹא בִ֣/י ר֔וּחַ וַ/תַּעֲמִדֵ֖/נִי עַל רַגְלָ֑/י וַ/יְדַבֵּ֤ר אֹתִ/י֙ וַ/יֹּ֣אמֶר אֵלַ֔/י בֹּ֥א הִסָּגֵ֖ר בְּ/ת֥וֹךְ בֵּיתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/024.yaml
  text: Then the Spirit entered into me and set me on my feet[a], and he spoke to me and said to me, “Go[b], shut yourself inside your house.”
translation:
  language: fr
  text: 'Alors l’Esprit[a] entra en moi et me fit tenir debout. Il me parla et me dit : « Va[b], enferme-toi dans ta maison. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un esprit ».'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « Viens »; dans ce contexte, le français dit naturellement « Va ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֔וּחַ
  choice: l’Esprit
  rationale: Dans le contexte de l’appel et de l’habilitation prophétiques d’Ézéchiel, le terme désigne très probablement l’Esprit de Dieu. L’absence d’article en hébreu permet néanmoins aussi la lecture « un esprit », conservée en note.
- source_word: וַ/תָּבֹא בִ֣/י
  choice: entra en moi
  rationale: La construction בוא + ב avec une personne exprime ici l’entrée en elle; cette formulation reprend directement l’image récurrente du livre.
- source_word: וַ/תַּעֲמִדֵ֖/נִי עַל רַגְלָ֑/י
  choice: me fit tenir debout
  rationale: Le hifil de עמד a une valeur causative. « Me fit tenir debout » est naturel en français et maintient l’action exercée sur le prophète.
- source_word: וַ/יְדַבֵּ֤ר אֹתִ/י֙
  choice: Il me parla
  rationale: La construction introduit une parole adressée à Ézéchiel. « Il me parla » est idiomatique et reste proche de la formulation hébraïque.
- source_word: בֹּ֥א
  choice: Va
  rationale: Le sens lexical premier est « viens », mais, dans cette consigne de déplacement et de retrait, le français emploie naturellement « va ». Le sens littéral est signalé en note.
- source_word: הִסָּגֵ֖ר
  choice: enferme-toi
  rationale: L’impératif nifal a ici une valeur réfléchie ou médio-passive et commande au prophète de se retirer dans un espace clos.
- source_word: בְּ/ת֥וֹךְ בֵּיתֶֽ/ךָ
  choice: dans ta maison
  rationale: בְּתוֹךְ indique l’intérieur. « Dans ta maison » transmet ce sens clairement sans la lourdeur de « au milieu de ta maison ».
theological_decisions:
- issue: Identification de רוּחַ
  choice: « l’Esprit », compris comme l’Esprit de Dieu qui habilite Ézéchiel
  alternative: « un esprit »
  rationale: Le contexte immédiat et les emplois récurrents dans Ézéchiel favorisent l’identification à l’Esprit divin, sans supprimer l’ambiguïté grammaticale de l’hébreu, signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement allégée en deux phrases; les images de l’entrée de l’Esprit et de la mise debout sont conservées, ainsi que les ambiguïtés pertinentes en notes.
