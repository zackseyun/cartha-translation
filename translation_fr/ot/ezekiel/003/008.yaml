source:
  edition: WLC
  text: הִנֵּ֨ה נָתַ֧תִּי אֶת פָּנֶ֛י/ךָ חֲזָקִ֖ים לְ/עֻמַּ֣ת פְּנֵי/הֶ֑ם וְ/אֶֽת מִצְחֲ/ךָ֥ חָזָ֖ק לְ/עֻמַּ֥ת מִצְחָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/008.yaml
  text: Behold[a], I have made your face strong against their faces, and your forehead strong against their foreheads.
translation:
  language: fr
  text: Voici, j’ai rendu ton visage dur face à leurs visages, et ton front dur face à leurs fronts.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi traduire « fort » ou « ferme » au lieu de « dur » dans les deux propositions; l’hébreu évoque la force ou la dureté permettant de résister à l’opposition.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Introduit avec solennité et insistance la déclaration divine, dans un français biblique encore naturel.
- source_word: נָתַתִּי
  choice: j’ai rendu
  rationale: Littéralement « j’ai donné »; avec une partie du corps suivie d’un adjectif, le verbe exprime ici le fait de lui conférer une qualité.
- source_word: פָּנֶיךָ
  choice: ton visage
  rationale: Le nom hébreu a une forme plurielle, mais désigne idiomatiquement le visage d’une seule personne.
- source_word: חֲזָקִים
  choice: dur
  rationale: Dans ce contexte, l’adjectif évoque une résistance ferme, voire la dureté, en réponse à celle des interlocuteurs; « dur » maintient aussi le réseau lexical du passage.
- source_word: לְעֻמַּת
  choice: face à
  rationale: Exprime la position en vis-à-vis et la confrontation sans suraccentuer l’hostilité.
- source_word: פְּנֵיהֶם
  choice: leurs visages
  rationale: Préserve l’image corporelle concrète et le pluriel renvoyant aux opposants d’Ézéchiel.
- source_word: מִצְחֲךָ
  choice: ton front
  rationale: Équivalent anatomique direct, naturel en français, qui conserve la métaphore visible de la fermeté.
- source_word: חָזָק
  choice: dur
  rationale: La répétition du même adjectif conserve le parallélisme hébreu et l’idée de résistance.
- source_word: מִצְחָם
  choice: leurs fronts
  rationale: Maintient l’image concrète et la structure équilibrée du texte source.
theological_decisions:
- issue: Portée métaphorique du visage et du front rendus fermes par Dieu
  choice: Conserver les images corporelles concrètes (« visage », « front ») et la dureté accordée par Dieu pour la confrontation prophétique.
  alternative: Paraphraser par « je t’ai rendu plus obstiné qu’eux » ou « je t’ai donné la force de leur résister ».
  rationale: Le texte attribue à Dieu la capacité d’Ézéchiel à tenir ferme devant un peuple réfractaire, mais ne qualifie pas explicitement le prophète d’obstiné au sens moral. Les images doivent donc rester ouvertes et ne pas être réduites à une interprétation abstraite.
translation_notes:
  register: Français moderne, digne et accessible. « Voici » garde la force solennelle de l’introduction. Le parallélisme et les images corporelles de l’hébreu sont conservés; « face à » est plus idiomatique que la répétition de « contre ».
