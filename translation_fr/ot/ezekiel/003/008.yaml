  source_fidelity: 'Le texte rend fidèlement l’hébreu : הנה par « Voici », נתתי dans sa valeur résultative par « j’ai rendu », les images concrètes de « visage » et « front », ainsi que le parallélisme de confrontation exprimé par לעמת. « Dur » est un choix lexical défendable pour חזק dans ce contexte et préserve la relation littéraire avec la résistance évoquée dans le passage, sans transformer l’image en paraphrase psychologique.'
