lexical_decisions:
- source_word: וַיְהִי מִקְצֵה שִׁבְעַת יָמִים
  choice: Au bout de sept jours
  rationale: La formule narrative וַיְהִי fait progresser le récit, tandis que מִקְצֵה indique le terme de la période écoulée. En français naturel, « Au bout de sept jours » exprime les deux sans alourdir la phrase.
- source_word: וַיְהִי דְבַר יְהוָה אֵלַי
  choice: la parole de Yahweh me fut adressée
  rationale: Cette tournure française courante pour la formule prophétique conserve le syntagme « la parole de Yahweh » et indique clairement qu'elle parvient au prophète.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré comme nom propre plutôt que remplacé par un titre.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L'infinitif hébreu introduit le discours direct qui suit. En français, les deux-points remplissent naturellement cette fonction et évitent le calque pesant « en disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » en conserve la fonction de nom personnel sans lui substituer un titre.
- issue: Statut de דְבַר יְהוָה
  choice: la parole de Yahweh
  alternative: une parole venant de Yahweh
  rationale: Le groupe construit hébreu et la formule prophétique traditionnelle favorisent le défini « la parole de Yahweh », tout en laissant le contexte préciser la teneur du message.
translation_notes:
  register: Français international moderne, digne et fluide. La formulation évite les calques narratifs peu naturels tout en conservant la formule prophétique et le nom divin.
