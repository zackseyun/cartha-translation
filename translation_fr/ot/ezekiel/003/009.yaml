  text: כְּ/שָׁמִ֛יר חָזָ֥ק מִ/צֹּ֖ר נָתַ֣תִּי מִצְחֶ֑/ךָ לֹֽא תִירָ֤א אוֹתָ/ם֙ וְ/לֹא תֵחַ֣ת מִ/פְּנֵי/הֶ֔ם כִּ֛י בֵּֽית מְרִ֖י הֵֽמָּה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/009.yaml
  text: Like diamond[a], harder than flint, I have made your forehead. Do not fear them, and do not be dismayed before them, for they are a rebellious house.
translation:
  language: fr
  text: J’ai rendu ton front comme le diamant[a], plus dur que le silex. Ne les crains pas et ne te laisse pas abattre devant eux, car ils sont une maison rebelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une substance extrêmement dure » ; le mot hébreu שָׁמִיר peut désigner une pierre ou une substance très dure.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמִיר
  choice: diamant
  rationale: Dans cette comparaison fondée sur la dureté et renforcée par « plus dur que le silex », le mot désigne une pierre ou une substance extrêmement dure, et non une plante. « Diamant » est clair en français moderne, tandis que l’incertitude lexicale est signalée en note.
- source_word: חָזָק מִצֹּר
  choice: plus dur que le silex
  rationale: La construction comparative avec מִן exprime ici une dureté supérieure. Cette formulation restitue naturellement l’image d’un front rendu inébranlable.
- source_word: צֹר
  choice: silex
  rationale: Le terme peut désigner une roche très dure, notamment le silex. « Silex » convient précisément au champ lexical de la dureté.
- source_word: מִצְחֶךָ
  choice: ton front
  rationale: Le sens anatomique direct préserve la métaphore corporelle de la fermeté donnée au prophète.
- source_word: לֹא תִירָא אוֹתָם
  choice: Ne les crains pas
  rationale: Dans le contexte de l’envoi prophétique, l’imparfait négatif a valeur d’exhortation ou d’assurance. Cette tournure est concise, naturelle et fidèle.
- source_word: וְלֹא תֵחַת
  choice: et ne sois pas terrifié
  rationale: Le niphal de חתת évoque le fait d’être brisé intérieurement, abattu ou saisi d’effroi. « Terrifié » maintient la force du verbe sans produire une expression littérale maladroite.
- source_word: מִפְּנֵיהֶם
  choice: devant eux
  rationale: Cette traduction conserve l’image de leur présence ou de leur face et s’intègre naturellement à l’avertissement contre l’intimidation.
- source_word: בֵּית מְרִי
  choice: une maison rebelle
  rationale: Cette expression récurrente d’Ézéchiel présente Israël comme une collectivité familiale et caractérisée par la rébellion. Garder « maison » préserve cette désignation prophétique.
theological_decisions:
- issue: Désignation collective d’Israël dans la réprimande prophétique
  choice: une maison rebelle
  alternative: un peuple rebelle
  rationale: L’hébreu emploie explicitement « maison », terme collectif à portée familiale et communautaire. Le conserver évite d’aplanir l’image et ne résout pas la tension par une paraphrase.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe conserve le parallélisme et l’image frappante du front, tandis que « maison rebelle » maintient le langage caractéristique d’Ézéchiel.
