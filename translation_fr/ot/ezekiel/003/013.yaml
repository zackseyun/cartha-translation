  text: וְ/ק֣וֹל כַּנְפֵ֣י הַ/חַיּ֗וֹת מַשִּׁיקוֹת֙ אִשָּׁ֣ה אֶל אֲחוֹתָ֔/הּ וְ/ק֥וֹל הָ/אוֹפַנִּ֖ים לְ/עֻמָּתָ֑/ם וְ/ק֖וֹל רַ֥עַשׁ גָּדֽוֹל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/013.yaml
  text: and the sound of the wings of the living creatures touching one another[a], and the sound of the wheels beside them[c][b], and the sound of a great rumbling.
translation:
  language: fr
  text: et le bruit des ailes des êtres vivants qui se touchaient les unes les autres[a], le bruit des roues à côté d’eux[b], et le bruit d’un grand grondement[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « chacune vers sa sœur », tournure hébraïque exprimant ici le rapport mutuel entre les ailes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « en face d’eux » ou « vis-à-vis d’eux ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « un grand fracas » ou « un grand bruit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: bruit
  rationale: Dans cette scène visionnaire, le mot désigne des phénomènes audibles et non une voix. « Bruit » convient naturellement aux ailes, aux roues et au fracas final.
- source_word: כַּנְפֵי הַחַיּוֹת
  choice: les ailes des êtres vivants
  rationale: Le groupe construit désigne clairement les ailes appartenant aux êtres animés de la vision. « Êtres vivants » reste précis sans déterminer davantage leur identité.
- source_word: מַשִּׁיקוֹת
  choice: qui se touchaient
  rationale: Le participe exprime ici le contact ou la jonction des ailes. « Se touchaient » rend l’image clairement, sans employer le littéralisme trompeur « s’embrassaient ».
- source_word: אִשָּׁה אֶל אֲחוֹתָהּ
  choice: l’une l’autre
  rationale: L’expression signifie littéralement « une femme vers sa sœur », mais fonctionne comme une tournure distributive appliquée ici aux ailes. Le féminin français convient à « ailes ».
- source_word: הָאוֹפַנִּים
  choice: les roues
  rationale: Dans la vision d’Ézéchiel, le terme désigne les roues associées aux êtres vivants.
- source_word: לְעֻמָּתָם
  choice: à côté d’eux
  rationale: La préposition marque la position des roues par rapport aux êtres vivants. « À côté d’eux » est naturel dans ce contexte, tandis que « en face d’eux » demeure possible.
- source_word: רַעַשׁ גָּדוֹל
  choice: un grand fracas
  rationale: רַעַשׁ peut évoquer une secousse, un grondement ou un bruit tumultueux. « Grand fracas » restitue ici la puissance du phénomène sonore sans imposer l’idée précise d’un séisme.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La répétition de « le bruit » conserve la structure auditive ternaire de l’hébreu. Le participe hébreu est rendu par un imparfait relatif, adapté au déroulement de la vision.
