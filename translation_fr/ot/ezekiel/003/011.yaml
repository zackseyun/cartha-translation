  text: וְ/לֵ֨ךְ בֹּ֤א אֶל הַ/גּוֹלָה֙ אֶל בְּנֵ֣י עַמֶּ֔/ךָ וְ/דִבַּרְתָּ֤ אֲלֵי/הֶם֙ וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהֹוִ֑ה אִֽם יִשְׁמְע֖וּ וְ/אִם יֶחְדָּֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/011.yaml
  text: And go[a], come to the exiles, to the sons of your people, and speak to them and say to them[b], ‘Thus says the Lord GOD,’ whether they hear or whether they refuse.
translation:
  language: fr
  text: 'Va, rends-toi auprès des exilés, auprès des fils de ton peuple[a]. Parle-leur et dis-leur : « Ainsi parle le Seigneur Yahweh : qu’ils écoutent ou qu’ils refusent d’écouter[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les enfants de ton peuple » ; l’hébreu dit littéralement « les fils », expression de parenté pouvant désigner collectivement les membres du peuple.
    reason: lexical_alternative
  - marker: b
    text: Ou « qu’ils s’en abstiennent » ; le verbe hébreu signifie littéralement « cesser » ou « s’abstenir » et, dans cette opposition, évoque le fait de ne pas écouter.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֵךְ בֹּא
  choice: Va, rends-toi
  rationale: Les deux impératifs de mouvement sont conservés sans employer l’enchaînement peu naturel « va, viens » en français. « Rends-toi » exprime ici le mouvement vers le groupe indiqué par אֶל.
- source_word: הַגּוֹלָה
  choice: les exilés
  rationale: Le nom désigne collectivement la communauté déportée, plutôt que la condition abstraite de l’exil.
- source_word: בְּנֵי עַמֶּךָ
  choice: les fils de ton peuple
  rationale: Cette formulation conserve l’image de parenté masculine du texte hébreu; une note indique sa portée collective possible.
- source_word: וְדִבַּרְתָּ ... וְאָמַרְתָּ
  choice: Parle-leur et dis-leur
  rationale: Les deux verbes de parole et leur répétition sont maintenus, tandis que la valeur injonctive de la séquence est rendue par des impératifs.
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule française consacrée et soutenue qui restitue naturellement la formule prophétique de messager.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: « Seigneur » traduit le titre אֲדֹנָי et « Yahweh » représente distinctement le nom divin יהוה.
- source_word: אִם יִשְׁמְעוּ וְאִם יֶחְדָּלוּ
  choice: qu’ils écoutent ou qu’ils s’y refusent
  rationale: La paire אִם ... וְאִם présente deux possibilités. « Écoutent » garde la portée de שׁמע, tandis que « s’y refusent » rend le contraste contextuel avec חדל sans masquer son sens littéral, signalé en note.
theological_decisions:
- issue: Représentation du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte associe un titre au nom propre divin. Les rendre séparément préserve cette distinction et évite de remplacer silencieusement le nom par un titre.
- issue: Portée du masculin dans בְּנֵי עַמֶּךָ
  choice: les fils de ton peuple
  alternative: les enfants de ton peuple
  rationale: Le texte principal conserve la forme masculine et l’expression de parenté de l’hébreu, sans exclure la portée représentative ou collective que précise la note.
- issue: Sens de חדל dans l’alternative finale
  choice: qu’ils s’y refusent
  alternative: qu’ils s’en abstiennent
  rationale: Dans l’opposition à « écouter », le verbe exprime ici le refus d’accueillir le message. La note conserve néanmoins le sens lexical plus littéral « cesser / s’abstenir ».
translation_notes:
  register: Français international moderne, clair et digne. La formule prophétique garde un registre soutenu, tandis que les impératifs et l’alternative finale restent naturels à l’oral comme à l’écrit.
