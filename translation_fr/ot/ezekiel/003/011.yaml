  terminology: Le registre est moderne et digne. « Exilés », « fils de ton peuple », « Ainsi parle » et « le Seigneur Yahweh » sont cohérents avec le texte source et avec les choix terminologiques indiqués. Les notes conservent utilement les possibilités lexicales sans les introduire dans le texte principal.
