id: EZK.3.5
reference: Ezekiel 3:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֡י לֹא֩ אֶל עַ֨ם עִמְקֵ֥י שָׂפָ֛ה וְ/כִבְדֵ֥י לָשׁ֖וֹן אַתָּ֣ה שָׁל֑וּחַ אֶל בֵּ֖ית יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/005.yaml
  text: For you are not being sent to a people of obscure speech and difficult language[a], but to the house of Israel.
translation:
  language: fr
  text: Car ce n’est pas vers un peuple au parler obscur et à la langue difficile[a] que tu es envoyé, mais vers la maison d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « profond de lèvre et lourd de langue », idiome hébreu désignant une façon de parler difficile à comprendre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de la mission donnée dans le contexte précédent et conserve naturellement la valeur causale ou explicative.
- source_word: לֹא אֶל עַם
  choice: ce n’est pas vers un peuple
  rationale: La tournure clivée rend clairement en français la négation portant sur la destination; « peuple » convient à un groupe humain envisagé sous l’angle linguistique.
- source_word: עִמְקֵי שָׂפָה
  choice: au parler obscur
  rationale: Rend l’idiome littéral « profond de lèvre » par une expression française naturelle désignant une parole difficile à saisir, sans imposer l’idée plus forte d’une incompréhensibilité absolue.
- source_word: וְכִבְדֵי לָשׁוֹן
  choice: et à la langue difficile
  rationale: Rend « lourd de langue » dans ce contexte linguistique par une formulation compréhensible, tout en conservant le parallélisme avec le premier idiome.
- source_word: אַתָּה שָׁלוּחַ
  choice: tu es envoyé
  rationale: Le participe passif prédicatif exprime la mission actuelle d’Ézéchiel; le singulier « tu » correspond à l’adresse directe.
- source_word: אֶל בֵּית יִשְׂרָאֵל
  choice: mais vers la maison d’Israël
  rationale: « Vers » reprend la destination de l’envoi, tandis que « maison d’Israël » préserve la désignation prophétique collective et son relief historique.
theological_decisions:
- issue: Valeur du contraste devant « la maison d’Israël »
  choice: mais vers
  alternative: vers
  rationale: Bien que le texte hébreu juxtapose ici la destination positive sans conjonction adversative explicite, le contraste « non pas… [mais]… » est directement porté par la syntaxe et s’exprime naturellement ainsi en français.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image hébraïque en note, maintient la désignation prophétique « maison d’Israël » et évite de préciser indûment s’il s’agit d’une langue étrangère ou simplement difficile à comprendre.
