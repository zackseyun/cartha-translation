  text: וָ/אֶשְׁפֹּ֤ךְ חֲמָתִ/י֙ עֲלֵי/הֶ֔ם עַל הַ/דָּ֖ם אֲשֶׁר שָׁפְכ֣וּ עַל הָ/אָ֑רֶץ וּ/בְ/גִלּוּלֵי/הֶ֖ם טִמְּאֽוּ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/018.yaml
  text: So I poured out my wrath upon them for the blood that they had poured out on the land[a], and because they had defiled it with their idols.
translation:
  language: fr
  text: J’ai déversé ma fureur sur eux à cause du sang qu’ils avaient répandu sur le pays, et parce qu’ils l’avaient rendu impur par leurs idoles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « idoles » est un terme fortement méprisant; on pourrait aussi le rendre par une expression telle que « idoles répugnantes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁפֹּךְ
  choice: J’ai donc déversé
  rationale: Le qal wayyiqtol de שׁפך exprime ici l’action de répandre la fureur divine. « Déversé » conserve l’image du liquide tout en étant idiomatique en français; « donc » marque le lien de conséquence avec le contexte.
- source_word: חֲמָתִי
  choice: ma fureur
  rationale: חֵמָה désigne une colère intense, particulièrement dans un contexte de jugement divin. « Fureur » garde la force du terme sans ajouter une interprétation doctrinale.
- source_word: עֲלֵיהֶם
  choice: sur eux
  rationale: La préposition עַל maintient l’image de la fureur déversée sur ceux qui subissent le jugement.
- source_word: עַל הַדָּם אֲשֶׁר שָׁפְכוּ
  choice: à cause du sang qu’ils avaient répandu
  rationale: « À cause de » explicite la valeur causale de עַל. « Répandu » est l’expression française naturelle pour le sang versé et reflète le second emploi de la racine שׁפך.
- source_word: עַל הָאָרֶץ
  choice: sur le pays
  rationale: Dans ce contexte d’Ézéchiel, הָאָרֶץ désigne vraisemblablement le pays d’Israël. « Sur le pays » préserve aussi la préposition hébraïque et l’image du sang répandu sur le sol du pays.
- source_word: וּבְגִלּוּלֵיהֶם
  choice: et parce que […] par leurs idoles
  rationale: Le waw relie un second motif du jugement. La préposition בְּ indique ici le moyen de la profanation. « Idoles » est clair dans le texte principal, tandis qu’une note signale la nuance fortement méprisante de גִּלּוּלִים.
- source_word: טִמְּאוּהָ
  choice: ils l’avaient rendu impur
  rationale: Le piel de טמא signifie rendre impur ou souiller. Cette formulation conserve la dimension cultuelle de l’impureté; le pronom féminin renvoie au pays.
theological_decisions:
- issue: Nature du langage du jugement divin
  choice: '« ma fureur », avec les deux motifs du jugement explicitement maintenus: le sang répandu et l’impureté causée par les idoles'
  alternative: « ma colère »
  rationale: Le verset présente une réaction judiciaire aux actes du peuple. « Fureur » rend l’intensité de חֵמָה sans réduire le jugement à une simple émotion ni en atténuer la gravité.
- issue: Référent de הָאָרֶץ
  choice: « le pays »
  alternative: « la terre »
  rationale: Le contexte immédiat concerne le pays d’Israël, souillé par le sang et les idoles. « Le pays » conserve ce cadre territorial sans imposer une portée universelle.
- issue: Relation entre les deux motifs introduits par עַל et בְּ
  choice: « à cause du sang… et parce que… »
  alternative: Traiter la seconde proposition comme une simple circonstance de moyen sans parallélisme causal explicite
  rationale: 'La formulation française rend clairement les deux griefs étroitement liés: le sang répandu sur le pays et sa souillure par les idoles, sans effacer la valeur instrumentale de בְּ.'
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’image de la fureur déversée, le cadre du pays d’Israël et la dimension cultuelle de l’impureté. Le plus-que-parfait situe naturellement les fautes avant le jugement dans le récit.
