revisions:
- from: Je ferai venir sur vous des hommes — mon peuple, Israël —, qui prendront possession de toi. Tu seras leur héritage et tu ne les priveras plus de leurs enfants.[a]
  to: Je ferai venir sur vous des gens — mon peuple Israël — ; ils prendront possession de toi. Tu seras leur héritage et tu ne les priveras plus d’enfants.[a]
  rationale: La révision améliore l’usage moderne sans modifier le sens. Elle conserve l’alternance source entre l’adresse plurielle initiale et le singulier collectif ultérieur, le vocabulaire de la possession et de l’héritage, ainsi que l’ambiguïté lexicale de שׁכל grâce au texte principal et à la note.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:17:33Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le projet rend bien les principaux éléments hébreux : la causation du déplacement sur le pays, l’identification d’אָדָם à « mon peuple Israël », la possession du pays, l’« héritage » (נַחֲלָה) et la cessation de l’action exprimée par שׁכל. L’alternance « vous » / « toi » correspond aux suffixes pluriel puis singulier du texte hébreu. Toutefois, « des hommes » est moins naturel en français international contemporain pour le collectif explicitement identifié comme Israël, et « priver de leurs enfants » choisit plus étroitement le sens de deuil d’enfants déjà existants là où l’hébreu peut aussi signifier rendre sans enfants.'
  naturalness: « Des gens » est plus idiomatique et inclusif au sens collectif sans élargir le référent, qui est aussitôt précisé. La construction en deux propositions indépendantes est plus nette que la relative après l’incise. « Priver d’enfants » maintient en français l’ambiguïté entre rendre sans enfants et ôter des enfants.
  terminology: « Prendre possession » et « héritage » sont appropriés pour ירשׁ et נַחֲלָה. Le terme « héritage » conserve la portée foncière et théologique du texte sans interprétation confessionnelle ajoutée. La note doit présenter l’autre nuance de שׁכל sans imposer une lecture exclusive.
  issues:
  - severity: medium
    issue: « des hommes » pour אָדָם
    rationale: 'Dans le français international moderne, « des hommes » peut être compris comme exclusivement masculin. Ici, אָדָם est un collectif dont le référent est immédiatement donné : le peuple Israël. « Des gens » rend plus naturellement cette valeur collective.'
  - severity: medium
    issue: « les priveras plus de leurs enfants » restreint la portée de שׁכל
    rationale: Cette formulation évoque spécifiquement la perte d’enfants qu’ils possèdent déjà. Le piel peut aussi signifier rendre sans enfants. « Les priver d’enfants » est plus englobant et la note conserve l’alternative de l’endeuilement.
  revised_text: Je ferai venir sur vous des gens — mon peuple Israël — ; ils prendront possession de toi. Tu seras leur héritage et tu ne les priveras plus d’enfants.[a]
