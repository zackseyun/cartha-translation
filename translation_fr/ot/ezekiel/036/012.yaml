  text: וְ/הוֹלַכְתִּי֩ עֲלֵי/כֶ֨ם אָדָ֜ם אֶת עַמִּ֤/י יִשְׂרָאֵל֙ וִֽ/ירֵשׁ֔וּ/ךָ וְ/הָיִ֥יתָ לָ/הֶ֖ם לְ/נַחֲלָ֑ה וְ/לֹא תוֹסִ֥ף ע֖וֹד לְ/שַׁכְּלָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/012.yaml
  text: And I will cause people—my people Israel—to walk upon you[a], and they will possess you, and you will be their inheritance[c][b], and you will no longer bereave them.
translation:
  language: fr
  text: Je ferai venir sur vous des gens — mon peuple Israël — ; ils prendront possession de toi. Tu seras leur héritage et tu ne les priveras plus d’enfants.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu ne les endeuilleras plus ». Le verbe hébreu peut signifier rendre sans enfants ou priver de ses enfants.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹלַכְתִּי עֲלֵיכֶם
  choice: Je ferai venir sur vous
  rationale: Le hiphil de הלך est causatif. Dans cette adresse aux montagnes d’Israël, la tournure française naturelle « faire venir sur » exprime le déplacement du peuple vers le territoire sans réduire l’idée à une simple conduite abstraite.
- source_word: אָדָם אֶת עַמִּי יִשְׂרָאֵל
  choice: des hommes — mon peuple, Israël —
  rationale: אָדָם a ici une valeur collective, explicitée par « mon peuple, Israël ». « Des hommes » convient au français courant et le tiret conserve la relation explicative entre les deux expressions.
- source_word: וִירֵשׁוּךָ
  choice: qui prendront possession de toi
  rationale: ירשׁ peut signifier posséder ou hériter d’un territoire. « Prendre possession » rend clairement l’occupation du pays tout en laissant au substantif נַחֲלָה de la proposition suivante le vocabulaire explicite de l’héritage.
- source_word: וְהָיִיתָ לָהֶם לְנַחֲלָה
  choice: Tu seras leur héritage
  rationale: « Héritage » conserve la portée du terme נַחֲלָה et son lien avec le don du pays à Israël.
- source_word: וְלֹא תוֹסִף עוֹד לְשַׁכְּלָם
  choice: tu ne les priveras plus de leurs enfants
  rationale: Le piel de שׁכל signifie rendre sans enfants ou priver d’enfants. Cette formulation explicite en français moderne le contenu de « endeuiller » et « ne… plus » rend naturellement la cessation renforcée exprimée par תוֹסִף עוֹד.
theological_decisions:
- issue: Maintien du vocabulaire du pays comme héritage
  choice: Tu seras leur héritage
  alternative: Tu deviendras leur possession
  rationale: « Héritage » préserve la résonance liée au don du pays sans expliciter davantage le mécanisme théologique.
- issue: Sens de la terre qui ne rendra plus Israël sans enfants
  choice: tu ne les priveras plus de leurs enfants
  alternative: tu ne les endeuilleras plus
  rationale: Le choix retenu rend directement le sens causatif de שׁכל. L’alternative est plus concise mais peut laisser indéterminée la nature de la perte.
translation_notes:
  register: Français international moderne, digne et accessible. Le passage de « vous » à « toi » reproduit le changement du pluriel עֲלֵיכֶם, adressé aux montagnes, au singulier des suffixes suivants, qui envisage collectivement le pays.
