  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה ע֗וֹד זֹ֛את אִדָּרֵ֥שׁ לְ/בֵֽית יִשְׂרָאֵ֖ל לַ/עֲשׂ֣וֹת לָ/הֶ֑ם אַרְבֶּ֥ה אֹתָ֛/ם כַּ/צֹּ֖אן אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/037.yaml
  text: 'Thus says the Lord GOD: Yet in this also I will let the house of Israel ask me to act for them: I will multiply them like a flock of men[a][b].'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh : Je me laisserai encore solliciter à ce sujet par la maison d’Israël, pour agir en leur faveur[a] : je les multiplierai comme un troupeau d’êtres humains[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « je me laisserai consulter par la maison d’Israël pour faire cela en leur faveur ».'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « comme un troupeau d’humains » ; l’image désigne une grande multitude comparable à un troupeau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה, tout en évitant l’expression artificielle « le Seigneur SEIGNEUR ».
- source_word: עוֹד זֹאת
  choice: Pour cela encore
  rationale: Conserve à la fois la valeur additive de עוֹד et le renvoi de זֹאת à la bénédiction qui vient d’être annoncée.
- source_word: אִדָּרֵשׁ
  choice: je me laisserai solliciter
  rationale: Le nifal de דרש indique ici que Dieu se laissera rechercher ou consulter. Cette formulation française préserve l’initiative souveraine de Dieu ainsi que la démarche attendue d’Israël.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: par la maison d’Israël
  rationale: Maintient l’expression collective et liée à l’alliance, plutôt que de la réduire simplement à « Israël ».
- source_word: לַעֲשׂוֹת לָהֶם
  choice: afin d’agir en sa faveur
  rationale: Exprime naturellement l’idée générale de faire ou d’accomplir quelque chose pour Israël, sans préciser indûment l’objet de l’action.
- source_word: אַרְבֶּה אֹתָם
  choice: je multiplierai ses membres
  rationale: Le hifil de רבה signifie rendre nombreux. « Ses membres » explicite en français le pluriel אֹתָם, dont l’antécédent sémantique est la collectivité appelée « maison d’Israël ».
- source_word: כַּצֹּאן אָדָם
  choice: comme un troupeau humain
  rationale: Préserve l’image inhabituelle qui associe un troupeau à אָדָם, tout en restant intelligible et naturel en français moderne.
theological_decisions:
- issue: Rapport entre la promesse divine et la sollicitation d’Israël
  choice: je me laisserai solliciter par la maison d’Israël
  alternative: la maison d’Israël me demandera d’agir
  rationale: 'Le choix conserve la forme passive du nifal et la tension du texte : Dieu promet d’agir, mais il veut encore être sollicité par Israël.'
- issue: Valeur collective de אָדָם dans כַּצֹּאן אָדָם
  choice: un troupeau humain
  alternative: un troupeau de personnes
  rationale: « Humain » garde la texture singulière et collective de l’hébreu sans limiter אָדָם aux seuls hommes de sexe masculin.
- issue: Rendu du nom divin יהוה dans le titre composé
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Ce rendu distingue le titre אֲדֹנָי du nom personnel יהוה et rend visible le nom divin présent dans le texte hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve « maison d’Israël » et l’étrangeté mesurée de la métaphore finale, tout en évitant une rupture grammaticale entre le collectif singulier français et le pronom pluriel hébreu.
