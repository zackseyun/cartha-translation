id: EZK.36.1
reference: Ezekiel 36:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם הִנָּבֵ֖א אֶל הָרֵ֣י יִשְׂרָאֵ֑ל וְ/אָ֣מַרְתָּ֔ הָרֵי֙ יִשְׂרָאֵ֔ל שִׁמְע֖וּ דְּבַר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/001.yaml
  text: And you[a], son of man, prophesy to the mountains of Israel, and say, ‘Mountains of Israel[c][b], hear the word of Yahweh.’
translation:
  language: fr
  text: 'Et toi, fils d’homme[a], prophétise aux montagnes d’Israël[b] et dis : « Montagnes d’Israël, écoutez la parole de Yahvé[c] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mortel ». « Fils d’homme » est l’appellation récurrente adressée à Ézéchiel.
    reason: lexical_alternative
  - marker: b
    text: Ou « région montagneuse d’Israël ». L’hébreu dit littéralement « montagnes d’Israël »; le texte principal conserve cette personnification du pays.
    reason: lexical_alternative
  - marker: c
    text: Le nom hébreu est YHWH; on le rend aussi traditionnellement par « le SEIGNEUR ».
    reason: alternative_reading
lexical_decisions:
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: Cette formule est l’appellation récurrente adressée à Ézéchiel. La conserver maintient la continuité littéraire du livre sans imposer une interprétation christologique; « mortel » reste une possibilité de sens.
- source_word: הִנָּבֵא
  choice: prophétise
  rationale: L’impératif niphal de נבא appartient à la formule habituelle de mission prophétique; « prophétise » en est l’équivalent français direct et naturel.
- source_word: אֶל
  choice: aux
  rationale: La préposition désigne ici les destinataires auxquels Ézéchiel doit s’adresser. Le verset ne marque pas explicitement une parole hostile qui exigerait « contre ».
- source_word: הָרֵי יִשְׂרָאֵל
  choice: montagnes d’Israël
  rationale: La traduction littérale préserve la personnification géographique, renforcée par l’apostrophe répétée aux montagnes. « Région montagneuse d’Israël » exprimerait le territoire, mais atténuerait cette image.
- source_word: וְאָמַרְתָּ
  choice: et dis
  rationale: Dans la suite de l’impératif principal, cette formulation française concise rend naturellement l’enchaînement des consignes.
- source_word: שִׁמְעוּ
  choice: écoutez
  rationale: L’impératif pluriel appelle les montagnes personnifiées à prêter attention au message prophétique. « Écoutez » est plus naturel en français actuel que l’impératif « entendez ».
- source_word: דְּבַר יְהוָה
  choice: la parole de Yahvé
  rationale: « Parole » conserve la formule prophétique et sa continuité littéraire; « Yahvé » représente directement le nom divin יהוה.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est une transcription française courante du tétragramme et préserve le nom propre présent dans le texte hébreu plutôt que de le remplacer silencieusement par un titre.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, nom propre du Dieu d’Israël. Le rendre par « Yahvé » le distingue du titre אֲדֹנָי, tandis qu’une note signale la convention traditionnelle « le SEIGNEUR ».
- issue: Sens de בֶן אָדָם dans Ézéchiel
  choice: fils d’homme
  alternative: mortel
  rationale: Il s’agit ici de l’appellation prophétique récurrente d’Ézéchiel. La traduction formelle en maintient l’écho à travers le livre sans en faire ici un titre christologique; « mortel » explicite plutôt la condition humaine sous-jacente.
translation_notes:
  register: Français international moderne, digne et accessible. « Et toi » conserve la mise en relief initiale du prophète; « écoutez » rend naturellement l’impératif pluriel. La citation directe et la répétition de « montagnes d’Israël » maintiennent la force oraculaire et la personnification du texte hébreu.
