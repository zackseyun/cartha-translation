  text: לֹ֧א לְמַעַנְ/כֶ֣ם אֲנִֽי עֹשֶׂ֗ה נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה יִוָּדַ֖ע לָ/כֶ֑ם בּ֧וֹשׁוּ וְ/הִכָּלְמ֛וּ מִ/דַּרְכֵי/כֶ֖ם בֵּ֥ית יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/032.yaml
  text: It is not for your sake that I am acting[a], declares the Lord GOD; let it be known to you. Be ashamed and humiliated because of your ways, O house of Israel.
translation:
  language: fr
  text: 'Ce n’est pas pour vous que j’agis — déclaration du Seigneur Yahweh. Qu’il vous soit connu : ayez honte et soyez humiliés à cause de votre conduite, maison d’Israël.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַנְכֶם
  choice: pour vous
  rationale: Cette expression naturelle conserve l’idée de but ou d’intérêt sans préciser indûment si l’action serait motivée par Israël ou accomplie à son avantage.
- source_word: עֹשֶׂה
  choice: j’agis
  rationale: Le verbe עשה est large (« faire, agir »). Ici, « j’agis » renvoie naturellement à l’intervention divine décrite dans le contexte.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: « Déclaration » restitue la formule prophétique נְאֻם, tandis que « Seigneur Yahweh » distingue le titre אֲדֹנָי du nom divin יְהוִה.
- source_word: יִוָּדַע לָכֶם
  choice: Sachez-le bien !
  rationale: Le nifal exprime ici qu’Israël doit tenir ce fait pour certain. Cette formulation française actuelle rend sa force injonctive, et « bien » en souligne la solennité.
- source_word: בֹּשׁוּ
  choice: Ayez honte
  rationale: L’impératif appelle directement Israël à éprouver de la honte devant sa conduite.
- source_word: וְהִכָּלְמוּ
  choice: et soyez déshonorés
  rationale: Le nifal de כלם évoque la disgrâce ou le déshonneur. Ce choix maintient la distinction avec בוש tout en conservant le parallélisme intensif.
- source_word: מִדַּרְכֵיכֶם
  choice: à cause de votre conduite
  rationale: Après des verbes de honte, מן indique la cause. Le singulier collectif français « conduite » exprime naturellement les « voies » au sens moral.
- source_word: בֵּית יִשְׂרָאֵל
  choice: maison d’Israël
  rationale: L’expression traditionnelle et intelligible conserve l’image collective ainsi que la fonction d’apostrophe.
theological_decisions:
- issue: Raison de l’action divine
  choice: Ce n’est pas pour vous que j’agis
  alternative: Ce n’est pas à cause de vous que j’agis
  rationale: « Pour vous » préserve l’étendue sémantique de לְמַעַן, qui peut concerner le but, l’intérêt ou la considération, sans réduire explicitement l’énoncé à la seule question du mérite.
- issue: Rendu du titre divin אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Ce rendu conserve à la fois le titre אֲדֹנָי et le nom propre divin יהוה, sans les confondre ni produire la répétition « Seigneur SEIGNEUR ».
translation_notes:
  register: Français international moderne, direct et solennel. L’apostrophe finale garde le ton prophétique. La ponctuation sépare nettement la déclaration divine de l’exhortation adressée à Israël.
