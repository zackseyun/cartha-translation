  source_fidelity: 'Le sens fondamental est bien rendu : l’action de Yahweh n’est pas accomplie « pour » Israël, et l’exhortation à la honte causée par ses voies est conservée. Toutefois, « Sachez-le bien ! » ajoute l’intensif « bien », qui n’est pas explicitement présent dans יִוָּדַע לָכֶם. « Soyez humiliés » rend plus directement le nifal de כלם que « soyez déshonorés ».'
  naturalness: Le français est globalement direct et contemporain. « Qu’il vous soit connu » garde néanmoins mieux la tournure passive et solennelle de l’hébreu que l’injonction plus familière « Sachez-le bien ! ». La ponctuation avec tiret convient à la formule prophétique.
