  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֣עַן אָמַ֧ר הָ/אוֹיֵ֛ב עֲלֵי/כֶ֖ם הֶאָ֑ח וּ/בָמ֣וֹת עוֹלָ֔ם לְ/מֽוֹרָשָׁ֖ה הָ֥יְתָה לָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/002.yaml
  text: 'Thus says the Lord GOD: Because the enemy said against you, ‘Aha!’ and, ‘The ancient heights have become our possession,’'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur, YHWH : Parce que l’ennemi a dit à votre sujet : « Aha ! Les hauteurs anciennes sont devenues notre possession ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur, YHWH
  rationale: Distingue le titre אֲדֹנָי du nom divin יהוה tout en gardant une formulation française intelligible et solennelle.
- source_word: הָאוֹיֵב
  choice: l’ennemi
  rationale: Correspondance directe ; le singulier collectif ou représentatif de l’hébreu est conservé.
- source_word: הֶאָח
  choice: Ah ! Ah !
  rationale: Interjection de joie malveillante ou de triomphe ; le redoublement français rend naturellement sa force dans ce contexte.
- source_word: בָמוֹת עוֹלָם
  choice: les hauteurs antiques
  rationale: במות désigne ici des hauteurs, probablement les montagnes d’Israël, et עולם porte un sens temporel ancien ou immémorial ; « antiques » évite de suggérer qu’elles sont littéralement éternelles.
- source_word: לְמוֹרָשָׁה הָיְתָה לָּנוּ
  choice: sont devenues notre possession
  rationale: Rend l’idée d’un bien acquis ou hérité, avec un français naturel ; le pluriel français s’accorde avec « hauteurs ».
theological_decisions:
- issue: Représentation du tétragramme dans אֲדֹנָי יְהוִה
  choice: le Seigneur, YHWH
  alternative: le Seigneur DIEU / le Seigneur, l’Éternel
  rationale: La translittération signale clairement le nom divin sans confondre יהוה avec le nom commun « Dieu » ni imposer la traduction interprétative « l’Éternel ».
- issue: Sens de עוֹלָם appliqué aux hauteurs
  choice: antiques
  alternative: éternelles / de toujours
  rationale: Le contexte porte sur les hauteurs ancestrales du pays. « Antiques » conserve leur ancienneté sans introduire une affirmation métaphysique d’éternité.
translation_notes:
  register: Français moderne international, digne et accessible. La syntaxe causale inachevée de ce verset est conservée, puisqu’elle mène à la suite de l’oracle au verset 3. La ponctuation présente les deux éléments comme les paroles triomphantes de l’ennemi.
