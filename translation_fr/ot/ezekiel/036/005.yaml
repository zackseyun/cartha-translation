  text: לָ/כֵ֗ן כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ אִם לֹ֠א בְּ/אֵ֨שׁ קִנְאָתִ֥/י דִבַּ֛רְתִּי עַל שְׁאֵרִ֥ית הַ/גּוֹיִ֖ם וְ/עַל אֱד֣וֹם כֻּלָּ֑/א אֲשֶׁ֣ר נָתְנֽוּ אֶת אַרְצִ֣/י לָ֠/הֶם לְ/מ֨וֹרָשָׁ֜ה בְּ/שִׂמְחַ֤ת כָּל לֵבָב֙ בִּ/שְׁאָ֣ט נֶ֔פֶשׁ לְמַ֥עַן מִגְרָשָׁ֖/הּ לָ/בַֽז־־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/005.yaml
  text: 'Therefore thus says the Lord GOD: Surely in the fire of my jealousy I have spoken against the remnant of the nations and against all Edom[a], who gave my land to themselves as a possession with wholehearted joy and with contempt of soul[c][b], in order to make its pastureland plunder.'
translation:
  language: fr
  text: 'C’est pourquoi, ainsi parle le Seigneur Yahweh : Assurément, c’est dans le feu de ma jalousie que j’ai parlé contre le reste des nations et contre Édom tout entier, qui se sont attribué ma terre comme possession, dans la joie de tout leur cœur et avec un profond mépris, afin de faire de ses terres ouvertes un butin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu de la dernière proposition est difficile. On peut aussi comprendre : « afin de livrer ses pâturages au pillage ».'
    reason: Préserver l’incertitude syntaxique et lexicale de לְמַעַן מִגְרָשָׁהּ לָבַז, notamment le sens de מִגְרָשׁ (« terrain ouvert », « pâturage »).
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend les deux éléments du titre hébreu et conserve explicitement le nom divin.
- source_word: אִם לֹא
  choice: Aussi vrai que je vis
  rationale: L’expression introduit ici une affirmation solennelle de type serment plutôt qu’une condition littérale; cette formule française en restitue la force, même si la mention de la vie est implicite et non exprimée dans l’hébreu.
- source_word: בְּאֵשׁ קִנְאָתִי
  choice: dans le feu de ma jalousie
  rationale: Conserve la métaphore concrète du feu et la dimension relationnelle et judiciaire de קִנְאָה.
- source_word: שְׁאֵרִית הַגּוֹיִם
  choice: le reste des nations
  rationale: Dans ce contexte, שְׁאֵרִית désigne les nations restantes; « reste » évite de suggérer automatiquement le sens théologique positif que peut prendre « reste fidèle ».
- source_word: אֱדוֹם כֻּלָּהּ
  choice: Édom tout entier
  rationale: Expression française naturelle qui rend la totalité de la nation ou du territoire d’Édom.
- source_word: נָתְנוּ אֶת אַרְצִי לָהֶם לְמוֹרָשָׁה
  choice: ils se sont attribué mon pays comme possession
  rationale: Exprime l’appropriation illégitime marquée par לָהֶם et rend מוֹרָשָׁה sans lui donner ici le caractère d’un héritage légitime.
- source_word: בְּשִׂמְחַת כָּל לֵבָב
  choice: dans la joie de tout leur cœur
  rationale: Formulation idiomatique qui garde l’idée d’une joie entière et volontaire.
- source_word: בִּשְׁאָט נֶפֶשׁ
  choice: avec un profond mépris
  rationale: Rend naturellement l’attitude intérieure de dédain ou de mépris; נֶפֶשׁ intensifie ici la disposition profonde.
- source_word: לְמַעַן מִגְרָשָׁהּ לָבַז
  choice: afin d’en livrer les pâturages au pillage
  rationale: מִגְרָשׁ désigne normalement un terrain ouvert ou pâturage. La syntaxe finale est difficile; la traduction conserve ce sens lexical et l’idée de but liée au pillage.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: La traduction maintient le titre אֲדֹנָי et représente directement le tétragramme par « Yahweh », sans confondre les deux éléments.
- issue: Portée de la jalousie divine
  choice: ma jalousie
  alternative: mon ardeur
  rationale: « Jalousie » préserve la tension du langage d’alliance et de jugement, sans réduire le terme à une simple intensité émotionnelle.
- issue: Sens de שְׁאֵרִית appliqué aux nations
  choice: le reste des nations
  alternative: le reste fidèle des nations
  rationale: Le contexte ne confère pas à ce groupe un statut salvifique ou fidèle; il s’agit des autres nations ou de celles qui subsistent.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation garde les images fortes du texte hébreu tout en évitant les calques peu naturels. Le marqueur [a] est placé après la proposition difficile qu’il explique.
