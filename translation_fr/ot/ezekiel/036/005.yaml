revisions:
- from: 'C’est pourquoi, ainsi parle le Seigneur Yahweh : Aussi vrai que je vis, c’est dans le feu de ma jalousie que j’ai parlé contre le reste des nations et contre Édom tout entier. Ils se sont attribué mon pays comme possession, dans la joie de tout leur cœur et avec un profond mépris, afin d’en livrer les pâturages au pillage.[a]'
  to: 'C’est pourquoi, ainsi parle le Seigneur Yahweh : Assurément, c’est dans le feu de ma jalousie que j’ai parlé contre le reste des nations et contre Édom tout entier, qui se sont attribué ma terre comme possession, dans la joie de tout leur cœur et avec un profond mépris, afin de faire de ses terres ouvertes un butin.[a]'
  rationale: La révision retire l’ajout interprétatif « je vis » de la formule assertive אִם־לֹא et conserve sa force par « Assurément ». Elle emploie « ma terre » pour אַרְצִי et rattache explicitement la relative à l’ensemble « le reste des nations et Édom ». La dernière clause demeure volontairement prudente et sa difficulté est signalée par une note ancrée au bon endroit.
