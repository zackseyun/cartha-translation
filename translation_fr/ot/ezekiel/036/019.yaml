source:
  edition: WLC
  text: וָ/אָפִ֤יץ אֹתָ/ם֙ בַּ/גּוֹיִ֔ם וַ/יִּזָּר֖וּ בָּ/אֲרָצ֑וֹת כְּ/דַרְכָּ֥/ם וְ/כַ/עֲלִילוֹתָ֖/ם שְׁפַטְתִּֽי/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/019.yaml
  text: So I scattered them among the nations[a], and they were dispersed through the lands; I judged them according to their ways and according to their deeds.
translation:
  language: fr
  text: Je les ai dispersés parmi les nations, et ils ont été disséminés dans les pays. Je les ai jugés selon leur conduite et selon leurs actes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָפִיץ
  choice: Je les ai dispersés
  rationale: Le hifil de פוץ exprime l’action de faire disperser. Cette formulation naturelle conserve explicitement l’initiative divine.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: Dans ce contexte d’exil, גּוֹיִם désigne les nations étrangères; « nations » évite les connotations plus tardives de « païens » ou « non-Juifs ».
- source_word: וַיִּזָּרוּ
  choice: ils ont été disséminés
  rationale: La forme passive décrit l’état résultant de l’action précédente. « Disséminés » conserve le chevauchement sémantique sans répéter « dispersés ».
- source_word: בָּאֲרָצוֹת
  choice: dans les différents pays
  rationale: Le pluriel אֲרָצוֹת renvoie ici aux multiples territoires où les exilés se sont retrouvés. « Différents » explicite sobrement la valeur distributive du pluriel.
- source_word: כְּדַרְכָּם
  choice: selon leur conduite
  rationale: Dans ce contexte moral et prophétique, דֶּרֶךְ désigne la manière de vivre. « Conduite » est plus immédiatement intelligible en français que le calque « voies ».
- source_word: וְכַעֲלִילוֹתָם
  choice: et selon leurs actes
  rationale: עֲלִילוֹת désigne les actions ou les œuvres, avec ici une portée morale. « Actes » est naturel et suffisamment solennel.
- source_word: שְׁפַטְתִּים
  choice: Je les ai jugés
  rationale: שׁפט signifie fondamentalement juger. La traduction maintient le cadre judiciaire sans réduire le sens à la seule punition.
theological_decisions:
- issue: Rapport entre le jugement divin et l’exil
  choice: Le texte attribue explicitement à Dieu la dispersion et le jugement d’Israël en fonction de sa conduite.
  alternative: Mettre davantage l’accent sur l’état passif de dispersion, au risque d’atténuer l’action divine exprimée par le premier verbe.
  rationale: La première personne de וָאָפִיץ et de שְׁפַטְתִּים présente clairement la dispersion comme un acte judiciaire de Dieu, tandis que la forme passive וַיִּזָּרוּ en décrit le résultat.
translation_notes:
  register: 'Français international moderne, digne et accessible. La traduction privilégie une équivalence optimale: elle conserve l’agence divine, le parallélisme entre conduite et actes, ainsi que la distinction entre l’action de disperser et son résultat.'
