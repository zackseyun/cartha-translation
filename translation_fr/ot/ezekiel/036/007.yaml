  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה אֲנִ֖י נָשָׂ֣אתִי אֶת יָדִ֑/י אִם לֹ֤א הַ/גּוֹיִם֙ אֲשֶׁ֣ר לָ/כֶ֣ם מִ/סָּבִ֔יב הֵ֖מָּה כְּלִמָּתָ֥/ם יִשָּֽׂאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/007.yaml
  text: 'Therefore thus says the Lord GOD: I have lifted up my hand in oath that surely the nations that are around you will bear their disgrace[a].'
translation:
  language: fr
  text: 'C’est pourquoi, ainsi parle le Seigneur Yahweh : J’ai levé la main en prêtant serment : oui, les nations qui vous entourent porteront leur opprobre.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « J’ai levé ma main ». Cette expression est une formule de serment.'
    reason: Explicite l’idiome hébreu tout en conservant son image dans le texte.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Le titre composé associe אֲדֹנָי, « Seigneur », au nom divin YHWH. « Le Seigneur Yahweh » rend distinctement les deux éléments sans produire « le Seigneur SEIGNEUR ».
- source_word: נָשָׂאתִי אֶת יָדִי
  choice: J’ai levé la main pour jurer
  rationale: L’expression signifie littéralement « j’ai levé ma main » et désigne ici le geste de prêter serment. La formulation conserve l’image tout en explicitant sa portée idiomatique.
- source_word: אִם לֹא
  choice: que … bel et bien
  rationale: Après la formule de serment, אִם לֹא introduit avec insistance le contenu juré. « Bel et bien » restitue cette valeur emphatique en français naturel.
- source_word: הַגּוֹיִם אֲשֶׁר לָכֶם מִסָּבִיב
  choice: les nations qui vous entourent
  rationale: « Nations » convient aux peuples étrangers voisins, tandis que « qui vous entourent » exprime naturellement la relation spatiale du texte.
- source_word: כְּלִמָּתָם
  choice: leur honte
  rationale: כְּלִמָּה désigne la honte, l’opprobre ou l’humiliation. « Honte » reste direct, courant et suffisamment large pour préserver la portée du terme.
- source_word: יִשָּׂאוּ
  choice: porteront
  rationale: Le verbe נשׂא signifie « porter ». Son emploi avec « honte » conserve ici l’image hébraïque de devoir porter sa propre humiliation.
theological_decisions:
- issue: Rendu du nom divin יְהוָה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte donne le nom divin YHWH. Sa transcription par « Yahweh » préserve le nom propre et permet de rendre séparément אֲדֹנָי par « Seigneur ».
- issue: Identité du référent de כְּלִמָּתָם
  choice: leur honte, celle des nations
  alternative: la honte infligée au pays ou à Israël
  rationale: 'Le suffixe masculin pluriel renvoie grammaticalement le plus naturellement aux nations environnantes : elles porteront leur propre honte en retour. La traduction ne développe pas davantage la nature de cette honte.'
translation_notes:
  register: Français moderne, international et digne. La syntaxe prophétique « ainsi parle » est conservée; « bel et bien » communique l’insistance du serment sans alourdir la phrase.
