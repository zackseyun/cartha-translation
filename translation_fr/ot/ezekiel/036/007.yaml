    issue: « pour jurer » suggère une relation de but absente du texte.
    rationale: נָשָׂאתִי אֶת־יָדִי signifie littéralement « j’ai levé ma main » et constitue une formule de serment. « en prêtant serment » rend cette fonction sans présenter le geste comme accompli dans le but de jurer.
  - severity: low
    issue: « bel et bien » est un peu familier au regard du ton d’oracle judiciaire.
    rationale: L’asserveration de אִם־לֹא est mieux exprimée par « oui » dans une formule de serment française solennelle.
  - severity: low
    issue: « leur honte » est recevable mais moins précis que « leur opprobre » dans ce contexte.
    rationale: כְּלִמָּה couvre honte, disgrâce et opprobre ; « opprobre » conserve la dimension publique et judiciaire, et « porter son opprobre » est une collocation naturelle.
  revised_text: 'C’est pourquoi, ainsi parle le Seigneur Yahweh : J’ai levé la main en prêtant serment : oui, les nations qui vous entourent porteront leur opprobre.[a]'
