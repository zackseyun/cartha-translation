id: EZK.36.34
reference: Ezekiel 36:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָ/אָ֥רֶץ הַ/נְּשַׁמָּ֖ה תֵּֽעָבֵ֑ד תַּ֚חַת אֲשֶׁ֣ר הָיְתָ֣ה שְׁמָמָ֔ה לְ/עֵינֵ֖י כָּל עוֹבֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/034.yaml
  text: And the desolate land will be cultivated instead of being a desolation in the sight of all who pass by[a].
translation:
  language: fr
  text: Le pays dévasté sera cultivé, alors qu’il était une désolation aux yeux de tous les passants.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte de restauration, אֶרֶץ désigne le territoire d’Israël plutôt que la terre entière. « Le pays » est naturel et précis en français.
- source_word: הַנְּשַׁמָּה
  choice: dévasté
  rationale: Le participe passif qualifie le pays dans son état de ruine. « Dévasté » exprime clairement les effets de la destruction et convient au contraste avec sa remise en culture.
- source_word: תֵּעָבֵד
  choice: sera cultivé
  rationale: Le niphal de עבד indique ici que le sol sera travaillé à des fins agricoles. Le passif « sera cultivé » restitue ce sens avec naturel.
- source_word: תַּחַת אֲשֶׁר
  choice: au lieu de rester
  rationale: La construction marque le remplacement ou le contraste entre l’état antérieur du pays et sa restauration. « Au lieu de rester » l’exprime idiomatiquement sans alourdir la phrase.
- source_word: הָיְתָה שְׁמָמָה
  choice: rester une étendue désolée
  rationale: שְׁמָמָה est un nom. « Une étendue désolée » en conserve la valeur nominale tout en produisant une formulation française naturelle.
- source_word: לְעֵינֵי
  choice: sous les yeux de
  rationale: Cette expression conserve l’image concrète du texte hébreu et souligne que l’état du pays était publiquement visible.
- source_word: כָּל עוֹבֵר
  choice: tous les passants
  rationale: Le participe singulier précédé de כָּל a une portée collective. « Tous les passants » est concis et naturel en français moderne.
theological_decisions: []
