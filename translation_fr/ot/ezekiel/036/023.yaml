source:
  edition: WLC
  text: וְ/קִדַּשְׁתִּ֞י אֶת שְׁמִ֣/י הַ/גָּד֗וֹל הַֽ/מְחֻלָּל֙ בַּ/גּוֹיִ֔ם אֲשֶׁ֥ר חִלַּלְתֶּ֖ם בְּ/תוֹכָ֑/ם וְ/יָדְע֨וּ הַ/גּוֹיִ֜ם כִּי אֲנִ֣י יְהוָ֗ה נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה בְּ/הִקָּדְשִׁ֥/י בָ/כֶ֖ם לְ/עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/023.yaml
  text: I will sanctify my great name[a], which has been profaned among the nations, which you have profaned among them. Then the nations will know that I am Yahweh, declares the Lord GOD[b], when I show myself holy through you before their eyes.
translation:
  language: fr
  text: Je manifesterai la sainteté de mon grand nom[a], qui a été profané parmi les nations, que vous avez profané au milieu d’elles. Alors les nations sauront que je suis Yahvé — déclaration du Seigneur Yahvé — quand je manifesterai ma sainteté par vous sous leurs yeux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Je sanctifierai mon grand nom ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « quand je serai sanctifié en vous sous leurs yeux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי
  choice: Je manifesterai la sainteté de
  rationale: Le piel exprime ici la manifestation publique et la reconnaissance de la sainteté du nom divin, non l’acquisition d’une sainteté qui lui manquerait. Cette formulation française rend ce sens tout en gardant le lien lexical avec la suite du verset.
- source_word: שְׁמִי הַגָּדוֹל
  choice: mon grand nom
  rationale: Rend directement le nom suivi de son adjectif et conserve les idées de majesté et de réputation attachées au nom divin.
- source_word: הַמְחֻלָּל
  choice: qui a été profané
  rationale: Le participe pual décrit le nom traité comme profane. « Profané » est précis et naturel dans ce contexte religieux.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: « Nations » désigne ici les peuples au milieu desquels Israël se trouve, sans importer la distinction plus tardive entre Juifs et non-Juifs.
- source_word: אֲשֶׁר חִלַּלְתֶּם בְּתוֹכָם
  choice: que vous avez profané au milieu d’elles
  rationale: La proposition relative reprend « mon grand nom » et בְּתוֹכָם indique que cette profanation s’est produite au milieu des nations.
- source_word: וְיָדְעוּ
  choice: Alors les nations sauront
  rationale: « Alors » exprime naturellement la conséquence de l’intervention divine portée par la coordination hébraïque.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française usuelle du tétragramme préserve le nom personnel divin au lieu de lui substituer un titre.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahvé
  rationale: נְאֻם est une formule prophétique d’autorité. « Déclaration » conserve sa forme nominale, tandis que « Seigneur Yahvé » distingue le titre אֲדֹנָי du nom divin.
- source_word: בְּהִקָּדְשִׁי בָכֶם
  choice: quand je manifesterai ma sainteté par vous
  rationale: L’infinitif nifal présente Dieu comme manifesté ou reconnu saint. « Par vous » rend la valeur instrumentale possible de בָכֶם dans le contexte de ce que Dieu accomplira à l’égard d’Israël, tout en signalant l’alternative plus formelle en note.
- source_word: לְעֵינֵיהֶם
  choice: sous leurs yeux
  rationale: Expression française naturelle et vive pour une manifestation publique et visible.
theological_decisions:
- issue: Sens de קדשׁ appliqué au nom de Dieu
  choice: Je manifesterai la sainteté de mon grand nom
  alternative: Je sanctifierai mon grand nom
  rationale: Le texte affirme la démonstration et la reconnaissance publiques de la sainteté du nom de Dieu après sa profanation parmi les nations; il ne suppose pas que ce nom serait intrinsèquement dépourvu de sainteté. La traduction plus formelle est conservée en note.
- issue: Valeur de ב dans בְּהִקָּדְשִׁי בָכֶם
  choice: quand je manifesterai ma sainteté par vous
  alternative: quand je serai sanctifié en vous
  rationale: L’hébreu permet une formulation locale plus littérale, mais le contexte souligne que Dieu fera reconnaître sa sainteté aux nations par sa manière d’agir envers Israël. La note préserve l’ambiguïté grammaticale.
- issue: Rendu de אֲדֹנָי יְהוִה
  choice: le Seigneur Yahvé
  alternative: le Seigneur DIEU
  rationale: Le français peut juxtaposer naturellement le titre « Seigneur » et le nom « Yahvé », ce qui préserve la distinction lexicale de l’hébreu sans recourir à une convention typographique héritée de l’anglais.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre « manifesterai la sainteté de mon grand nom » et « manifesterai ma sainteté » rend perceptible la répétition de la racine hébraïque קדשׁ. Les deux notes maintiennent les formulations plus littérales et l’ambiguïté de בָכֶם.
