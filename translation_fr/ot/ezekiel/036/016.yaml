  text: 'La parole de Yahweh me fut adressée en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans la formule prophétique ויהי דבר־יהוה אלי, le français biblique naturel exprime la venue de la parole par « la parole me fut adressée », sans reproduire lourdement « fut vers moi ».
- source_word: דְבַר
  choice: parole
  rationale: Dans cette formule de révélation, דָּבָר désigne la parole ou le message divin. « Parole » reste précis, traditionnel et naturel en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération « Yahweh », qui conserve le nom divin personnel présent dans le texte hébreu.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » rend naturellement la direction vers le prophète, destinataire de la révélation.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'לֵאמֹר introduit le contenu du discours qui suit. « En ces termes : » remplit clairement cette fonction en français moderne et évite le calque peu idiomatique « disant ».'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
translation_notes:
  register: Français moderne, digne et fluide. La tournure « me fut adressée » conserve la solennité de la formule prophétique tout en restant immédiatement compréhensible.
