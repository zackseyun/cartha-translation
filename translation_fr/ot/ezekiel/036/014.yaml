  text: לָ/כֵ֗ן אָדָם֙ לֹא תֹ֣אכְלִי ע֔וֹד ו/גוי/ך לֹ֣א תכשלי ע֑וֹד נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/014.yaml
  text: Therefore you will no longer devour people[a], and you will no longer cause your nation to stumble, declares the Lord GOD.
translation:
  language: fr
  text: C’est pourquoi tu ne dévoreras plus d’êtres humains et tu ne feras plus trébucher ton peuple[a], déclare le Seigneur Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Selon une autre tradition de lecture : « tu ne priveras plus ton peuple de ses enfants ».'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Cette locution marque naturellement en français la conséquence qui rattache la promesse au contexte précédent.
- source_word: אָדָם
  choice: des êtres humains
  rationale: Le nom est ici collectif et désigne les habitants que le pays, personnifié au féminin, était réputé dévorer. Cette formulation garde le sens collectif sans employer le générique ambigu « homme ».
- source_word: תֹאכְלִי
  choice: tu ne dévoreras plus
  rationale: Le verbe signifie littéralement « manger », mais « dévorer » restitue en français la métaphore appliquée au pays et à ses habitants.
- source_word: וְגוֹיִךְ
  choice: ton peuple
  rationale: Dans cette adresse au pays personnifié, le terme désigne la collectivité qui lui appartient. « Ton peuple » est plus naturel en français que « ta nation » tout en conservant le sens collectif.
- source_word: תכשלי
  choice: tu ne feras plus trébucher
  rationale: Cette traduction suit la forme consonantique transmise en la rattachant à כשל, « trébucher, chanceler », avec une valeur causative. L’autre tradition de lecture est signalée en note.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclare le Seigneur Yahvé
  rationale: La formule prophétique נְאֻם est rendue par « déclare ». אֲדֹנָי est traduit comme titre, tandis que le nom divin יהוה est translittéré « Yahvé », forme française courante.
theological_decisions:
- issue: Traduction du nom divin יהוה après אֲדֹנָי
  choice: le Seigneur Yahvé
  alternative: le Seigneur DIEU
  rationale: Cette formulation distingue le titre אֲדֹנָי du nom propre יהוה et évite de remplacer silencieusement le nom divin par un autre titre.
- issue: Lecture de תכשלי
  choice: tu ne feras plus trébucher ton peuple
  alternative: tu ne priveras plus ton peuple de ses enfants
  rationale: Le texte principal suit les consonnes dans l’ordre transmis et les comprend à partir de כשל. Une tradition de lecture ancienne inverse deux consonnes et donne le sens de « priver d’enfants »; l’ambiguïté textuelle est donc conservée en note plutôt que tranchée sans indication.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement féminin singulier répond à la personnification du pays dans le contexte, sans qu’il soit nécessaire de l’expliciter dans le verset isolé.
