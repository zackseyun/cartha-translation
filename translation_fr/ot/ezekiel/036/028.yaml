source:
  edition: WLC
  text: וִ/ישַׁבְתֶּ֣ם בָּ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לַ/אֲבֹֽתֵי/כֶ֑ם וִ/הְיִ֤יתֶם לִ/י֙ לְ/עָ֔ם וְ/אָ֣נֹכִ֔י אֶהְיֶ֥ה לָ/כֶ֖ם לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/028.yaml
  text: You will dwell in the land that I gave to your fathers[a], and you will be my people, and I will be your God.
translation:
  language: fr
  text: Vous habiterez dans le pays que j’ai donné à vos pères[a]. Vous serez mon peuple, et moi, je serai votre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ancêtres ». L’hébreu dit littéralement « pères », en écho aux promesses de l’alliance faites aux pères d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִישַׁבְתֶּם
  choice: Vous habiterez
  rationale: Le verbe ישׁב désigne ici le fait de vivre durablement dans un lieu. Dans ce discours prophétique, la forme a une valeur future; « habiterez » reste naturelle et préserve l’idée d’une habitation établie.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: Dans ce contexte géographique et lié à la promesse, אֶרֶץ désigne le territoire donné aux ancêtres. En français courant, « le pays » exprime plus naturellement cette réalité que « la terre », qui pourrait évoquer le sol ou la planète.
- source_word: אֲשֶׁר נָתַתִּי
  choice: que j’ai donné
  rationale: Le passé composé rend naturellement en français l’acte accompli par lequel Dieu a donné le pays aux ancêtres.
- source_word: לַאֲבֹתֵיכֶם
  choice: à vos pères
  rationale: Le terme אָבוֹת signifie littéralement « pères » et fait écho aux promesses ancestrales de l’alliance. Une note signale la traduction plus inclusive « ancêtres ».
- source_word: וִהְיִיתֶם לִי לְעָם
  choice: Vous serez mon peuple
  rationale: Cette formulation française idiomatique conserve la formule classique de l’alliance sans la rendre artificiellement par « un peuple pour moi ».
- source_word: וְאָנֹכִי אֶהְיֶה לָכֶם לֵאלֹהִים
  choice: et moi, je serai votre Dieu
  rationale: « Votre Dieu » rend idiomatiquement « Dieu pour vous ». Le pronom hébreu explicite אָנֹכִי apporte une insistance que le français restitue naturellement par « moi, je ».
theological_decisions:
- issue: Formule d’alliance
  choice: « Vous serez mon peuple, et moi, je serai votre Dieu. »
  alternative: « Vous serez pour moi un peuple, et je serai pour vous Dieu. »
  rationale: La formulation retenue est naturelle en français et préserve la résonance canonique de la formule d’alliance. « Moi, je » maintient en outre l’emphase du pronom אָנֹכִי.
- issue: Désignation genrée des ancêtres
  choice: Conserver « pères » dans le texte principal
  alternative: « ancêtres »
  rationale: L’hébreu emploie explicitement le mot « pères », dont la résonance patriarcale et liée aux promesses est pertinente. La variante idiomatique inclusive figure en note afin de ne pas masquer la portée du terme source.
translation_notes:
  register: Français international moderne, clair et digne. Le futur prophétique et la formule d’alliance sont conservés. « Pays » est privilégié pour le territoire promis; « moi, je » rend l’emphase explicite du pronom hébreu.
