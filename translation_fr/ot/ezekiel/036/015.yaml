  text: וְ/לֹא אַשְׁמִ֨יעַ אֵלַ֤יִ/ךְ עוֹד֙ כְּלִמַּ֣ת הַ/גּוֹיִ֔ם וְ/חֶרְפַּ֥ת עַמִּ֖ים לֹ֣א תִשְׂאִי ע֑וֹד ו/גוי/ך לֹא תַכְשִׁ֣לִי ע֔וֹד נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/015.yaml
  text: And I will no longer let you hear the disgrace of the nations[a], and you will no longer bear the reproach of the peoples, and you will no longer cause your nation to stumble, declares the Lord GOD.
translation:
  language: fr
  text: Je ne te ferai plus entendre l’humiliation des nations ; tu ne porteras plus l’opprobre des peuples et tu ne feras plus trébucher ta nation[a] — déclaration du Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « tu ne feras plus tomber ta nation » ; selon une autre tradition d’interprétation : « tu ne priveras plus ta nation de ses enfants ». Le texte consonantique hébreu est difficile ici ; la vocalisation massorétique appuie « tu ne feras plus trébucher ta nation ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׁמִיעַ
  choice: je ne te ferai plus entendre
  rationale: Le hiphil de שׁמע exprime ici la causation. Cette formulation française conserve directement ce sens tout en évoquant la fin des propos humiliants adressés au pays personnifié.
- source_word: כְּלִמַּת
  choice: les humiliations
  rationale: Le nom désigne la honte ou l'humiliation publique. Le pluriel français est naturel après « entendre » et évoque les paroles humiliantes des nations.
- source_word: הַגּוֹיִם
  choice: des nations
  rationale: Dans ce contexte, le terme désigne les nations étrangères environnantes ; « nations » évite la connotation plus tardive de « païens ».
- source_word: חֶרְפַּת
  choice: les insultes
  rationale: Le mot peut désigner l'opprobre, le mépris ou l'insulte. « Insultes » est actuel, compréhensible et convient au parallélisme avec les humiliations entendues.
- source_word: עַמִּים
  choice: des peuples
  rationale: Ce choix préserve la distinction lexicale avec גּוֹיִם, rendu juste avant par « nations ».
- source_word: תִשְׂאִי
  choice: tu ne porteras plus
  rationale: Le qal de נשׂא signifie littéralement porter et, dans cette expression, supporter l'opprobre. « Porter les insultes » conserve l'image hébraïque sans être obscur.
- source_word: וְגוֹיִךְ
  choice: ta nation
  rationale: Le nom singulier assorti du suffixe féminin de deuxième personne désigne la nation rattachée au pays personnifié auquel le discours s'adresse.
- source_word: תַכְשִׁלִי
  choice: tu ne feras plus trébucher
  rationale: La vocalisation massorétique analyse la forme comme le hiphil de כשל, « faire trébucher ». La difficulté du texte et l'autre tradition d'interprétation sont signalées en note.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: נְאֻם introduit solennellement un oracle divin. « Déclaration » rend la formule nominale, tandis que « Seigneur Yahweh » distingue le titre אֲדֹנָי du nom divin יְהוִה.
theological_decisions:
- issue: Rendu du nom divin יְהוִה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte à la fois le titre אֲדֹנָי et le nom propre divin יְהוִה. « Seigneur Yahweh » représente les deux éléments sans les fondre ni produire « Seigneur Seigneur ».
- issue: Responsabilité du pays personnifié dans la dernière proposition
  choice: tu ne feras plus trébucher ta nation
  alternative: tu ne priveras plus ta nation de ses enfants
  rationale: La vocalisation massorétique soutient le causatif de כשל. Le contexte peut rendre cette image difficile, mais la traduction ne la résout pas silencieusement en faveur de l'autre tradition ; celle-ci est conservée en note.
translation_notes:
  register: Français moderne, international et digne. Le pays d’Israël demeure personnifié au féminin singulier. Le parallélisme hébreu est conservé, avec une ponctuation qui rend lisibles les trois promesses et la formule oraculaire finale.
