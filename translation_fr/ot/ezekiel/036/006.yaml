base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/006.yaml
  text: 'Therefore prophesy concerning the land of Israel, and say to the mountains and the hills, to the ravines and the valleys, ‘Thus says the Lord GOD: Look, I have spoken in my jealousy and in my wrath, because you have borne the disgrace of the nations.’'
translation:
  language: fr
  text: 'C’est pourquoi, prophétise au sujet de la terre d’Israël et dis aux montagnes et aux collines, aux ravins et aux vallées : « Voici ce que dit le Seigneur DIEU : Oui, j’ai parlé dans ma jalousie ardente et dans ma fureur, parce que vous avez porté l’opprobre des nations. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Rend explicitement le lien logique avec le contexte précédent.
- source_word: אֲפִיקִים
  choice: ravins
  rationale: Dans cette série topographique, le terme désigne naturellement des creux ou lits encaissés.
- source_word: גֵּאָיוֹת
  choice: vallées
  rationale: Équivalent courant et naturel pour les dépressions du relief visées.
- source_word: קִנְאָתִי
  choice: mon ardeur jalouse
  rationale: Conserve la dimension de zèle exclusif et passionné de קנאה sans réduire le terme à la jalousie humaine ordinaire.
- source_word: חֲמָתִי
  choice: ma fureur
  rationale: Reproduit la forte intensité de la colère exprimée par le terme hébreu.
- source_word: כְּלִמַּת גּוֹיִם
  choice: l’opprobre des nations
  rationale: Préserve le sens de honte infligée, de mépris et de déshonneur provenant des nations.
- source_word: נְשָׂאתֶם
  choice: vous avez porté
  rationale: Conserve la métaphore hébraïque et l’adresse plurielle aux éléments personnifiés du pays.
theological_decisions:
- issue: Titre divin אֲדֹנָי יְהוִה
  choice: le Seigneur DIEU
  alternative: le Seigneur, l’Éternel
  rationale: Distingue le titre אֲדֹנָי du nom divin יהוה tout en suivant une convention française sobre, sans imposer une vocalisation confessionnelle du tétragramme.
- issue: Sens de la jalousie divine
  choice: ardeur jalouse
  alternative: zèle
  rationale: Maintient la tension du terme source, qui évoque à la fois le zèle passionné et la jalousie d’alliance, plutôt que d’en sélectionner un seul aspect.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe solennelle de l’oracle est conservée, ainsi que la personnification de la terre et de ses reliefs.
