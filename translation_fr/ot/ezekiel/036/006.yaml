    issue: Omission de הִנְנִי
    rationale: Le texte source dit littéralement « Voici, moi, j’ai parlé ». Le projet rend « j’ai parlé » mais ne traduit pas l’élément déictique et emphatique הִנְנִי. L’ajout de « Oui » restitue naturellement cette insistance en français sans alourdir l’oracle.
