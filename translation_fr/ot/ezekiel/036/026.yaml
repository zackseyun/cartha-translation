id: EZK.36.26
reference: Ezekiel 36:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נָתַתִּ֤י לָ/כֶם֙ לֵ֣ב חָדָ֔שׁ וְ/ר֥וּחַ חֲדָשָׁ֖ה אֶתֵּ֣ן בְּ/קִרְבְּ/כֶ֑ם וַ/הֲסִ֨רֹתִ֜י אֶת לֵ֤ב הָ/אֶ֨בֶן֙ מִ/בְּשַׂרְ/כֶ֔ם וְ/נָתַתִּ֥י לָ/כֶ֖ם לֵ֥ב בָּשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/026.yaml
  text: And I will give you a new heart[a], and I will put a new spirit within you; and I will remove the heart of stone from your flesh and give you a heart of flesh.
translation:
  language: fr
  text: Je vous donnerai un cœur nouveau et je mettrai en vous un esprit nouveau[a]. J’enlèverai de votre chair le cœur de pierre et je vous donnerai un cœur de chair.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un esprit renouvelé ». Certains comprennent ici une anticipation du don de l’Esprit de Dieu mentionné au verset suivant.
    reason: Lecture alternative et ambiguïté théologique concernant רוּחַ.
lexical_decisions:
- source_word: לֵב
  choice: cœur
  rationale: « Cœur » est le correspondant français le plus transparent dans ce contexte; il désigne ici le centre intérieur de la pensée, de la volonté et des dispositions, sans réduire le terme à l’intellect ou aux émotions.
- source_word: חָדָשׁ / חֲדָשָׁה
  choice: nouveau / nouvel
  rationale: L’adjectif signifie directement « nouveau ». « Renouvelé » introduirait une interprétation qui n’est pas explicitement formulée par l’hébreu.
- source_word: רוּחַ
  choice: esprit
  rationale: Dans ce contexte de transformation intérieure, « esprit » convient mieux que « vent » ou « souffle ». La minuscule laisse ouverte la relation avec l’Esprit de Dieu explicitement mentionné au verset suivant.
- source_word: בְּקִרְבְּכֶם
  choice: en vous
  rationale: Cette formulation française naturelle exprime l’intériorité indiquée par le parallélisme avec le cœur, tout en gardant la valeur collective du pronom pluriel.
- source_word: וַהֲסִרֹתִי
  choice: j’enlèverai
  rationale: « Enlever » rend clairement l’action de retirer le cœur de pierre avant de le remplacer.
- source_word: לֵב הָאֶבֶן
  choice: le cœur de pierre
  rationale: La construction conserve directement la métaphore hébraïque et son contraste avec le cœur de chair.
- source_word: מִבְּשַׂרְכֶם
  choice: de votre chair
  rationale: « Chair » préserve l’image corporelle concrète du texte hébreu; « corps » serait plus explicatif.
- source_word: לֵב בָּשָׂר
  choice: un cœur de chair
  rationale: Cette traduction maintient le contraste formel avec « cœur de pierre » sans expliciter la métaphore par des termes comme « sensible » ou « tendre ».
- source_word: וְנָתַתִּי ... אֶתֵּן ... וְנָתַתִּי
  choice: je donnerai… je mettrai… je donnerai
  rationale: Le verbe נתן est répété, mais « mettre en vous » est l’équivalent contextuel naturel en français dans la proposition médiane, tandis que « donner » convient aux deux autres occurrences.
theological_decisions:
- issue: Sens de « un esprit nouveau »
  choice: Un esprit humain ou une disposition intérieure rendue nouvelle par Dieu, sans majuscule dans le texte principal
  alternative: L’Esprit Saint
  rationale: Le parallélisme immédiat avec « un cœur nouveau » favorise le sens d’une transformation intérieure du peuple, tandis que le verset suivant distingue « mon Esprit ». La traduction conserve néanmoins « esprit », et la note signale le lien théologique possible sans trancher au-delà du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme et les métaphores concrètes de l’hébreu. Le pronom « vous » reste collectivement pluriel, comme dans le texte source.
