  text: וּ/זְכַרְתֶּם֙ אֶת דַּרְכֵי/כֶ֣ם הָ/רָעִ֔ים וּ/מַעַלְלֵי/כֶ֖ם אֲשֶׁ֣ר לֹֽא טוֹבִ֑ים וּ/נְקֹֽטֹתֶם֙ בִּ/פְנֵי/כֶ֔ם עַ֚ל עֲוֺנֹ֣תֵי/כֶ֔ם וְ/עַ֖ל תּוֹעֲבֽוֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/031.yaml
  text: Then you will remember your evil ways and your deeds that were not good[a], and you will loathe yourselves for your iniquities and your abominations.
translation:
  language: fr
  text: Alors vous vous souviendrez de vos mauvaises voies et de vos actes qui n’étaient pas bons, et vous éprouverez du dégoût pour vous-mêmes[a] à cause de vos iniquités et de vos abominations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous vous dégoûterez à vos propres yeux ».'
    reason: La locution בִּפְנֵיכֶם, littéralement « devant vos faces », peut exprimer ici l’idée de se considérer avec dégoût; la traduction principale en rend la portée réflexive.
lexical_decisions:
- source_word: וּזְכַרְתֶּם
  choice: Alors vous vous souviendrez
  rationale: Le parfait qal à la deuxième personne du pluriel, précédé du waw et inscrit dans la suite prophétique, a ici une valeur future. « Alors » explicite naturellement le lien de conséquence avec l’œuvre restauratrice annoncée auparavant.
- source_word: דַּרְכֵיכֶם הָרָעִים
  choice: vos mauvaises voies
  rationale: דֶּרֶךְ désigne ici, par image, la conduite morale. « Voies » conserve cette image hébraïque, tandis que « mauvaises » exprime sa qualification éthique sans la renforcer indûment.
- source_word: וּמַעַלְלֵיכֶם אֲשֶׁר לֹא טוֹבִים
  choice: vos actes qui n’étaient pas bons
  rationale: מַעֲלָל désigne des actes ou des agissements. La formulation « n’étaient pas bons » conserve la litote explicite de l’hébreu au lieu de la remplacer par « mauvais ».
- source_word: וּנְקֹטֹתֶם בִּפְנֵיכֶם
  choice: vous éprouverez du dégoût pour vous-mêmes
  rationale: Dans ce contexte, נקט exprime une forte répulsion morale. Avec בִּפְנֵיכֶם, la tournure a une portée réflexive; cette formulation est claire et naturelle en français actuel tout en préservant la force du verbe.
- source_word: עַל עֲוֺנֹתֵיכֶם
  choice: à cause de vos fautes
  rationale: עַל a ici une valeur causale. עָוֹן peut désigner la faute, l’iniquité ou la culpabilité; « fautes » rend le sens moral de façon directe et compréhensible sans trancher en faveur de la seule culpabilité subie.
- source_word: וְעַל תּוֹעֲבֹתֵיכֶם
  choice: et de vos actes abominables
  rationale: תּוֹעֵבָה désigne ce qui est détestable ou abominable, dans des domaines moraux et cultuels. « Actes abominables » communique clairement en français moderne la gravité du terme et son application concrète.
theological_decisions:
- issue: Nature de la réaction d’Israël après sa restauration
  choice: Le verset décrit le souvenir des fautes passées et une profonde répulsion envers soi-même à cause d’elles, comme conséquence de la restauration divine annoncée dans le contexte.
  alternative: Y voir soit un simple remords psychologique, soit l’énoncé complet d’une doctrine ultérieure de la repentance.
  rationale: Le texte affirme un souvenir moral et une répulsion profonde sans employer un terme technique pour la repentance. La traduction conserve cette tension et n’ajoute aucune catégorie doctrinale absente du verset.
translation_notes:
  register: Français international moderne, naturel et digne. La traduction conserve l’image des « voies », la litote « n’étaient pas bons » et la forte répulsion morale exprimée par נקט, tout en évitant un vocabulaire confessionnel spécialisé.
