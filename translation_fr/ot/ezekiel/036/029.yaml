source:
  edition: WLC
  text: וְ/הוֹשַׁעְתִּ֣י אֶתְ/כֶ֔ם מִ/כֹּ֖ל טֻמְאֽוֹתֵי/כֶ֑ם וְ/קָרָ֤אתִי אֶל הַ/דָּגָן֙ וְ/הִרְבֵּיתִ֣י אֹת֔/וֹ וְ/לֹא אֶתֵּ֥ן עֲלֵי/כֶ֖ם רָעָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/029.yaml
  text: I will save you from all your uncleannesses[a], and I will call for the grain and multiply it[b], and I will not bring famine upon you.
translation:
  language: fr
  text: Je vous sauverai de toutes vos impuretés[a]. J’appellerai le grain et je le rendrai abondant[b] ; je ne ferai pas venir sur vous la famine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de toutes vos souillures ». Le terme hébreu peut désigner aussi bien des impuretés rituelles que morales.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « j’appellerai le grain et je le multiplierai ». L’hébreu présente Dieu comme appelant, ou convoquant, le grain et lui donnant l’abondance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשַׁעְתִּי
  choice: Je vous sauverai
  rationale: Le hiphil de ישׁע exprime ici l’action de Dieu qui délivre son peuple de son état d’impureté. « Sauver » est direct, naturel et conserve la portée théologique du terme sans préciser indûment la manière de cette délivrance.
- source_word: מִכֹּל טֻמְאוֹתֵיכֶם
  choice: de toutes vos impuretés
  rationale: Le pluriel « impuretés » conserve la catégorie hébraïque, qui peut englober dans Ézéchiel la souillure rituelle aussi bien que morale, sans la réduire au seul péché ni au seul domaine cérémoniel.
- source_word: וְקָרָאתִי אֶל הַדָּגָן
  choice: J’appellerai le grain
  rationale: קרא אל signifie littéralement « appeler vers/à » et présente Dieu comme convoquant la production céréalière. Cette formulation garde l’image de son autorité souveraine sur l’abondance agricole.
- source_word: הַדָּגָן
  choice: le grain
  rationale: דגן désigne globalement les céréales ou leur produit, et non une espèce précise. « Le grain » maintient le singulier collectif du texte et évite de restreindre le sens au blé.
- source_word: וְהִרְבֵּיתִי אֹתוֹ
  choice: je le rendrai abondant
  rationale: Le hiphil de רבה signifie rendre nombreux ou abondant. Cette tournure est plus naturelle en français que « je le multiplierai » tout en exprimant clairement l’accroissement de la récolte.
- source_word: וְלֹא אֶתֵּן עֲלֵיכֶם רָעָב
  choice: je ne ferai pas venir sur vous la famine
  rationale: נתן על associé à רָעָב exprime le fait d’infliger ou de faire venir une famine. La formulation française est idiomatique et maintient explicitement l’action divine.
theological_decisions:
- issue: Nature du salut dans le contexte
  choice: Une délivrance historique et liée à l’alliance, qui libère le peuple de l’impureté et de ses conséquences tout en gardant une portée théologique plus large.
  alternative: Un salut principalement spirituel hors du cadre historique, ou une purification exclusivement rituelle.
  rationale: Ézéchiel 36 associe purification, cœur et esprit nouveaux, restauration du pays et bénédiction agricole. « Sauver » préserve cette ampleur sans imposer au verset une catégorie doctrinale plus tardive ni le réduire au rituel.
- issue: Portée du vocabulaire de l’impureté
  choice: Conserver le langage de l’impureté sans trancher entre dimensions rituelle et morale.
  alternative: Traduire seulement par « péchés » ou limiter le terme aux souillures cérémonielles.
  rationale: Dans Ézéchiel, טֻמְאָה peut désigner une pollution cultuelle et morale. « Impuretés » préserve cette tension sémantique.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image concrète par laquelle Dieu appelle le grain, tandis que « je le rendrai abondant » évite une tournure artificielle. Le point-virgule relie naturellement l’abondance promise à l’absence de famine.
