source:
  edition: WLC
  text: וְ/הִרְבֵּיתִ֤י עֲלֵי/כֶם֙ אָדָ֔ם כָּל בֵּ֥ית יִשְׂרָאֵ֖ל כֻּלֹּ֑/ה וְ/נֹֽשְׁבוּ֙ הֶֽ/עָרִ֔ים וְ/הֶ/חֳרָב֖וֹת תִּבָּנֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/010.yaml
  text: And I will multiply people upon you—all the house of Israel[a], all of it. The cities will be inhabited[b], and the ruins will be rebuilt.
translation:
  language: fr
  text: Je ferai croître sur vous une population nombreuse[a] — toute la maison d’Israël, tout entière. Les villes seront habitées, et les ruines[b] seront rebâties.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici ’adam comme terme collectif pour les êtres humains ; on pourrait aussi traduire : « les êtres humains » ou, plus littéralement, « l’homme ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les lieux dévastés » ou « les lieux désolés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  choice: Je multiplierai
  rationale: Le hiphil de רבה exprime l’action de rendre nombreux. « Je multiplierai » conserve cette valeur causative et reste clair dans un registre biblique moderne.
- source_word: עֲלֵיכֶם
  choice: sur vous
  rationale: Le pronom pluriel renvoie aux montagnes ou au territoire apostrophés dans le contexte. « Sur vous » préserve cette image spatiale.
- source_word: אָדָם
  choice: la population
  rationale: אָדָם a ici un sens collectif et désigne les êtres humains qui peupleront de nouveau le territoire. « La population » rend ce sens naturellement en français sans réduire le terme aux hommes de sexe masculin.
- source_word: כָּל בֵּית יִשְׂרָאֵל כֻּלֹּה
  choice: toute la maison d’Israël, tout entière
  rationale: La reprise de l’idée de totalité dans l’hébreu est conservée afin de rendre son insistance, sans la réduire à une seule expression.
- source_word: וְנֹשְׁבוּ הֶעָרִים
  choice: Les villes seront habitées
  rationale: Le niphal de ישׁב présente les villes comme recevant de nouveau des habitants. La tournure passive française rend directement ce résultat.
- source_word: וְהֶחֳרָבוֹת
  choice: les ruines
  rationale: חֳרָבוֹת désigne des lieux dévastés ou ruinés. « Les ruines » est concis, concret et s’accorde naturellement avec l’idée de reconstruction.
- source_word: תִּבָּנֶינָה
  choice: seront rebâties
  rationale: Le niphal de בנה appelle ici une forme passive. Le préfixe « re- » explicite la restauration de lieux auparavant détruits, déjà indiquée par « les ruines ».
theological_decisions:
- issue: Référent de l’interpellation et portée de la restauration
  choice: Le verset s’adresse au territoire ou aux montagnes d’Israël et annonce concrètement le repeuplement d’Israël ainsi que la restauration de ses villes.
  alternative: Comprendre la restauration comme une réalité uniquement spirituelle, sans rapport direct avec le territoire.
  rationale: Le contexte immédiat apostrophe le pays, tandis que les villes habitées et les ruines rebâties relèvent d’un langage concret. La traduction conserve cette dimension territoriale sans exclure d’éventuelles implications théologiques plus larges.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’adresse directe au territoire, l’insistance de « toute… tout entière » et les passifs de restauration. « Maison d’Israël » est maintenu comme expression collective biblique établie.
