source:
  edition: WLC
  text: וְ/זָרַקְתִּ֧י עֲלֵי/כֶ֛ם מַ֥יִם טְהוֹרִ֖ים וּ/טְהַרְתֶּ֑ם מִ/כֹּ֧ל טֻמְאוֹתֵי/כֶ֛ם וּ/מִ/כָּל גִּלּ֥וּלֵי/כֶ֖ם אֲטַהֵ֥ר אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/025.yaml
  text: And I will sprinkle clean water on you[a], and you will be clean; from all your uncleannesses and from all your idols I will cleanse you.
translation:
  language: fr
  text: Je vous aspergerai d’une eau pure, et vous serez purs. De toutes vos impuretés et de toutes vos idoles[a], je vous purifierai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traduit par « idoles » est volontairement méprisant ; on pourrait le rendre plus littéralement par « idoles-ordures ». Ézéchiel l’emploie souvent pour tourner les idoles en dérision.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרַקְתִּי
  choice: Je vous aspergerai
  rationale: Dans ce contexte de purification, זרק désigne l’aspersion. Cette formulation française est naturelle et conserve l’image rituelle sans préciser le moyen théologique de la purification.
- source_word: מַיִם טְהוֹרִים
  choice: d’une eau pure
  rationale: טָהוֹר exprime ici la pureté, notamment rituelle. « Eau pure » est idiomatique en français et permet de conserver la reprise lexicale avec « purs » et « purifierai ».
- source_word: וּטְהַרְתֶּם
  choice: et vous serez purs
  rationale: La forme décrit l’état qui résultera de l’action divine. « Vous serez purs » la distingue du verbe causatif final, rendu par « je vous purifierai ».
- source_word: מִכֹּל טֻמְאוֹתֵיכֶם
  choice: de toutes vos impuretés
  rationale: Le pluriel טֻמְאוֹת désigne l’ensemble des souillures ou états d’impureté. « Impuretés » convient au registre moderne et maintient le champ lexical de la purification.
- source_word: וּמִכָּל גִּלּוּלֵיכֶם
  choice: et de toutes vos idoles[a]
  rationale: « Idoles » transmet clairement le référent. La nuance volontairement méprisante du terme favori d’Ézéchiel est signalée en note plutôt que développée dans le texte principal.
- source_word: אֲטַהֵר אֶתְכֶם
  choice: je vous purifierai
  rationale: Le piel présente Dieu comme celui qui fait disparaître l’impureté. Cette traduction directe conserve la répétition de la racine טהר à travers « pure », « purs » et « purifierai ».
theological_decisions:
- issue: Nature de l’image de purification
  choice: Conserver l’image de l’aspersion et de la purification sans en préciser le mécanisme sacramentel.
  alternative: Interpréter explicitement le passage comme une restauration nationale seulement, ou comme une référence directe au baptême.
  rationale: Dans son contexte, le texte hébreu annonce que Dieu purifiera son peuple de ses impuretés et de ses idoles. Il convient de laisser ouverte la portée théologique de cette image, sans introduire dans le texte une identification doctrinale ultérieure.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe met en relief la totalité de la purification tout en préservant la triple reprise « pure / purs / purifierai ». Le marqueur de note est placé après « idoles », le mot auquel la note se rapporte.
