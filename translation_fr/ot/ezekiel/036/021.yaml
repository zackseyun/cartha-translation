source:
  edition: WLC
  text: וָ/אֶחְמֹ֖ל עַל שֵׁ֣ם קָדְשִׁ֑/י אֲשֶׁ֤ר חִלְּל֨וּ/הוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל בַּ/גּוֹיִ֖ם אֲשֶׁר בָּ֥אוּ שָֽׁמָּ/ה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/021.yaml
  text: But I had pity for my holy name[a], which the house of Israel had profaned among the nations where they had gone.
translation:
  language: fr
  text: Mais j’ai eu égard à mon saint nom[a], que la maison d’Israël avait profané parmi les nations où elle était allée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’ai épargné mon saint nom » ou « j’ai pris en pitié mon saint nom ». Le verbe hébreu peut exprimer le fait d’épargner ou de prendre en pitié; ici, il souligne la sollicitude de l’Éternel pour la sainteté et l’honneur de son nom.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶחְמֹל
  choice: j’ai eu égard à
  rationale: Le verbe חמל peut exprimer le fait d’épargner, de prendre en pitié ou de se soucier de quelque chose. Avec « mon saint nom » pour objet, « avoir égard à » rend naturellement en français la sollicitude protectrice de Dieu sans suggérer que le nom lui-même inspire de la compassion.
- source_word: עַל
  choice: à
  rationale: Avec « avoir égard », la préposition française « à » marque naturellement l’objet de la considération ou de la sollicitude.
- source_word: שֵׁם קָדְשִׁי
  choice: mon saint nom
  rationale: Cette expression, proche de la forme hébraïque et bien établie en français biblique, désigne le nom de Dieu dans sa sainteté, avec ce qu’il révèle de son identité et de son honneur.
- source_word: אֲשֶׁר חִלְּלוּהוּ
  choice: que … avait profané
  rationale: Au piel, חלל signifie traiter comme profane ce qui est saint. « Profaner » conserve le contraste essentiel entre sainteté et profanation dans ce passage.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Cette désignation prophétique fréquente est intelligible en français et préserve l’expression collective du texte source.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: Le contexte vise les peuples étrangers au milieu desquels Israël a été dispersé; « parmi les nations » est précis et naturel.
- source_word: אֲשֶׁר בָּאוּ שָׁמָּה
  choice: où elle était allée
  rationale: Littéralement, l’expression signifie « où ils étaient venus ». Du point de vue du départ en exil, le français idiomatique emploie « aller ». Le singulier « elle » reprend grammaticalement le collectif « la maison d’Israël ».
theological_decisions:
- issue: Rapport de Dieu à « mon saint nom » dans וָאֶחְמֹל
  choice: Dieu manifeste une sollicitude protectrice pour son saint nom.
  alternative: Dieu épargne son saint nom; Dieu prend son saint nom en pitié; Dieu agit par égard pour son saint nom.
  rationale: Le nom est l’objet explicite de חמל, et le contexte des versets 20–23 porte sur sa sanctification devant les nations. « J’ai eu égard à » maintient cet objet et la portée du verbe sans réduire le sens à la seule réputation de Dieu ni transférer implicitement la compassion sur Israël.
translation_notes:
  register: Français international moderne, digne et lisible. « Avoir égard à » garde une légère solennité adaptée au discours prophétique tout en évitant l’expression peu naturelle « avoir pitié de mon nom ». Le plus-que-parfait des relatives situe la profanation et l’arrivée parmi les nations avant la réaction divine exprimée dans la proposition principale.
