  source_fidelity: « Mais j’ai eu égard à mon saint nom » rend de façon idiomatique et contextuellement juste וָאֶחְמֹל עַל־שֵׁם קָדְשִׁי. « Avoir égard à » exprime une considération protectrice sans l’anthropomorphisme peu naturel de « prendre mon nom en pitié », tout en laissant la note signaler les possibilités lexicales d’« épargner » et de « prendre en pitié ». « Que la maison d’Israël avait profané parmi les nations où elle était allée » respecte les relations syntaxiques du texte hébreu, y compris le collectif « maison d’Israël » et la destination de l’exil.
  naturalness: Le français est clair, actuel et d’un registre prophétique sobre. « Avoir égard à » est légèrement soutenu mais demeure naturel dans ce contexte. Le singulier féminin « elle » reprend normalement le collectif grammatical « la maison d’Israël »; il ne crée pas d’ambiguïté notable.
  terminology: « Saint nom », « maison d’Israël », « profané » et « parmi les nations » sont précis, cohérents avec le vocabulaire biblique français et fidèles aux termes hébreux. La note explique utilement l’ambivalence lexicale de חמל sans imposer une lecture doctrinale.
