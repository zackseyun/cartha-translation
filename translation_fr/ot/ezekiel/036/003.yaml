source:
  edition: WLC
  text: לָ/כֵן֙ הִנָּבֵ֣א וְ/אָמַרְתָּ֔ כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה יַ֣עַן בְּ/יַ֡עַן שַׁמּוֹת֩ וְ/שָׁאֹ֨ף אֶתְ/כֶ֜ם מִ/סָּבִ֗יב לִֽ/הְיוֹתְ/כֶ֤ם מֽוֹרָשָׁה֙ לִ/שְׁאֵרִ֣ית הַ/גּוֹיִ֔ם וַ/תֵּֽעֲל֛וּ עַל שְׂפַ֥ת לָשׁ֖וֹן וְ/דִבַּת עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/003.yaml
  text: 'Therefore prophesy and say[a], Thus says the Lord GOD: Because, indeed because they have made you desolate and have snapped at you from every side, so that you became a possession for the remnant of the nations, and you have come up on the lips of the tongue and in the slander of the people[b],'
translation:
  language: fr
  text: 'C’est pourquoi, prophétise et dis : Ainsi parle le Seigneur Yahweh : Parce que, oui, parce qu’on vous a dévastées et harcelées de toutes parts[a], afin que vous deveniez une propriété pour le reste des nations, et que vous êtes devenues le sujet des propos et des calomnies du peuple[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu est difficile. Il peut évoquer le fait de poursuivre en haletant, de chercher à engloutir ou d’exercer une pression hostile et prédatrice.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « vous êtes montées sur la lèvre de la langue et [dans] le mauvais bruit du peuple ». Cette expression signifie qu’elles sont devenues l’objet de propos hostiles et diffamatoires.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement la conséquence prophétique de la situation décrite auparavant.
- source_word: הִנָּבֵא וְאָמַרְתָּ
  choice: prophétise et dis
  rationale: Reproduit directement l’impératif et le verbe coordonné adressés à Ézéchiel.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Distingue le titre אֲדֹנָי du nom divin יהוה et évite l’expression redondante « le Seigneur, le SEIGNEUR ».
- source_word: יַעַן בְּיַעַן
  choice: Parce que, oui, parce que
  rationale: Conserve l’insistance inhabituelle de la formule causale redoublée.
- source_word: שַׁמּוֹת
  choice: on vous a dévastées
  rationale: Dans l’adresse aux montagnes d’Israël, le féminin pluriel convient et le verbe exprime leur mise en désolation.
- source_word: שָׁאֹף
  choice: convoitées avec avidité
  rationale: Le verbe difficile évoque ici un désir haletant et prédateur de s’emparer du territoire; cette formulation conserve l’idée d’avidité sans imposer l’image incertaine d’une morsure.
- source_word: מִסָּבִיב
  choice: de toutes parts
  rationale: Expression française naturelle pour l’hostilité des peuples environnants.
- source_word: לִהְיוֹתְכֶם מוֹרָשָׁה
  choice: afin que vous deveniez la propriété
  rationale: Préserve la valeur de but ou de résultat de l’infinitif ainsi que l’idée d’un bien approprié.
- source_word: לִשְׁאֵרִית הַגּוֹיִם
  choice: de ce qui reste des nations
  rationale: Évite de donner ici à שְׁאֵרִית le sens théologique spécialisé de « reste fidèle »; il s’agit des autres nations encore présentes.
- source_word: וַתֵּעֲלוּ עַל שְׂפַת לָשׁוֹן
  choice: vous êtes devenues le sujet des propos
  rationale: Rend intelligiblement l’idiome littéral « monter sur la lèvre de la langue », c’est-à-dire être constamment mentionné.
- source_word: וְדִבַּת עָם
  choice: des médisances des gens
  rationale: דִבָּה désigne un mauvais bruit ou des paroles diffamatoires; « médisances » s’accorde au contexte de propos hostiles.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte à la fois le titre אֲדֹנָי et le nom propre יהוה. « le Seigneur Yahweh » les représente séparément sans confondre le nom divin avec un titre.
- issue: Référent du suffixe féminin pluriel « vous »
  choice: 'accord avec les montagnes d’Israël : « dévastées », « convoitées », « devenues »'
  alternative: accord générique ou masculin
  rationale: Le contexte immédiat de 36.1-2 adresse la prophétie aux montagnes d’Israël; l’accord français explicite ce référent grammatical sans modifier le sens théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset conserve sa structure suspendue, puisque la déclaration divine se poursuit au verset suivant. Les accords féminins pluriels renvoient aux montagnes d’Israël, destinataires depuis le verset 1.
