revisions:
- from: 'C’est pourquoi, prophétise et dis : Ainsi parle le Seigneur Yahweh : Parce que, oui, parce qu’on vous a dévastées et convoitées avec avidité de toutes parts[a], afin que vous deveniez la propriété de ce qui reste des nations, et parce que vous êtes devenues le sujet des propos et des médisances des gens[b],'
  to: 'C’est pourquoi, prophétise et dis : Ainsi parle le Seigneur Yahweh : Parce que, oui, parce qu’on vous a dévastées et harcelées de toutes parts[a], afin que vous deveniez une propriété pour le reste des nations, et que vous êtes devenues le sujet des propos et des calomnies du peuple[b],'
  rationale: La révision maintient la structure suspendue du verset et les accords féminins pluriels renvoyant aux montagnes. Elle remplace une interprétation trop restrictive du verbe incertain שָׁאֹף par un terme français hostile mais non surspécifié, corrige la coordination syntaxique finale et rend plus exactement les référents collectifs hébreux. La note b indique les difficultés de la construction elliptique sans imposer une analyse grammaticale contestée.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:00:31Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu, y compris l’adresse féminine plurielle aux montagnes d’Israël et l’insistance de יַעַן בְּיַעַן. Toutefois, « convoitées avec avidité » réduit trop le verbe difficile שָׁאֹף à une convoitise intérieure, alors que le contexte et son emploi avec un objet direct suggèrent une pression hostile exercée contre les montagnes. « Ce qui reste des nations » est également moins précis que « le reste des nations ».
  naturalness: 'Le français est globalement fluide et le registre convient. La reprise de « parce que » avant la dernière proposition brouille cependant la syntaxe de la phrase hébraïque : la mention des propos hostiles est coordonnée aux mauvais traitements, non une nouvelle subordonnée causale. « Le sujet des propos et des médisances des gens » peut être resserré en « le sujet des propos et des calomnies du peuple ».'
  terminology: « Le Seigneur Yahweh » représente correctement les deux éléments d’אֲדֹנָי יְהוִה. « Calomnies » rend avec justesse le caractère hostile de דִּבָּה. « Propriété » est possible pour מוֹרָשָׁה, dans le sens d’un bien dont les nations se sont emparées.
  issues:
  - severity: medium
    issue: Sens trop étroit de « convoitées avec avidité » pour שָׁאֹף
    rationale: Le verbe est obscur, mais le contexte exprime l’hostilité active des nations entourant Israël. « Harcelées » conserve cette pression hostile sans trancher entre les lectures lexicographiques concurrentes (haleter après, engloutir, etc.).
  - severity: medium
    issue: 'Ajout d’une seconde relation causale : « et parce que vous êtes devenues »'
    rationale: Le waw de וַתֵּעֲלוּ coordonne ce fait aux actions précédentes dans le développement de la cause; il ne nécessite pas un second « parce que ». La coordination française directe reflète mieux la structure.
  - severity: low
    issue: « ce qui reste des nations » et « des gens » sont imprécis
    rationale: « Le reste des nations » rend directement שְׁאֵרִית הַגּוֹיִם, et « du peuple » correspond au singulier עָם.
