  text: כִּ֖י הִנְ/נִ֣י אֲלֵי/כֶ֑ם וּ/פָנִ֣יתִי אֲלֵי/כֶ֔ם וְ/נֶעֱבַדְתֶּ֖ם וְ/נִזְרַעְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/009.yaml
  text: For behold[a], I am for you, and I will turn to you, and you will be cultivated and sown.
translation:
  language: fr
  text: Car voici que je suis pour vous[a]. Je me tournerai vers vous, et vous serez cultivées et ensemencées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je suis tourné vers vous ». L’expression hébraïque indique que le Seigneur porte sur le pays un regard favorable.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de la promesse précédente et conserve clairement le lien logique avec le contexte.
- source_word: הִנְנִי
  choice: me voici
  rationale: Formule déictique solennelle qui attire l’attention et marque l’engagement immédiat du locuteur; « me voici » est naturel et digne en français moderne.
- source_word: אֲלֵיכֶם
  choice: pour vous
  rationale: Dans ce contexte de restauration des montagnes d’Israël, la préposition exprime une orientation favorable plutôt qu’une simple direction.
- source_word: וּפָנִיתִי אֲלֵיכֶם
  choice: Je me tournerai vers vous
  rationale: Conserve la métaphore hébraïque du mouvement orienté vers les destinataires et son sens d’attention favorable.
- source_word: וְנֶעֱבַדְתֶּם
  choice: vous serez cultivées
  rationale: Le nifal de עבד désigne ici les terres travaillées à des fins agricoles; le féminin pluriel reprend naturellement les montagnes auxquelles le discours s’adresse.
- source_word: וְנִזְרַעְתֶּם
  choice: et ensemencées
  rationale: Rend directement le nifal agricole de זרע et s’accorde avec les montagnes ou terres interpellées.
theological_decisions:
- issue: Orientation divine exprimée par הִנְנִי אֲלֵיכֶם
  choice: je suis pour vous
  alternative: je suis tourné vers vous; me voici, venant vers vous
  rationale: Le contexte annonce que le Seigneur se montre favorable au pays et agit pour sa restauration. « Je suis pour vous » exprime cette faveur sans ajouter de précision doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, clair et digne. Le féminin pluriel de « cultivées » et « ensemencées » explicite l’accord contextuel avec les montagnes d’Israël apostrophées dans le passage, tandis que la deuxième personne du texte hébreu est conservée.
