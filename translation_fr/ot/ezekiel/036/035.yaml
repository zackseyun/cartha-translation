  text: וְ/אָמְר֗וּ הָ/אָ֤רֶץ הַלֵּ֨זוּ֙ הַ/נְּשַׁמָּ֔ה הָיְתָ֖ה כְּ/גַן עֵ֑דֶן וְ/הֶ/עָרִ֧ים הֶ/חֳרֵב֛וֹת וְ/הַֽ/נְשַׁמּ֥וֹת וְ/הַ/נֶּהֱרָס֖וֹת בְּצוּר֥וֹת יָשָֽׁבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/035.yaml
  text: And they will say, ‘This land that was desolate has become like the garden of Eden, and the cities that were ruined, desolate, and torn down are fortified and inhabited.’
translation:
  language: fr
  text: 'On dira : « Ce pays qui était dévasté est devenu comme le jardin d’Éden, et les villes qui étaient en ruine, dévastées et démolies sont fortifiées et habitées. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאָרֶץ הַלֵּזוּ הַנְּשַׁמָּה
  choice: ce pays qui était dévasté
  rationale: « Pays » convient ici au territoire restauré ; « dévasté » rend l’état de désolation exprimé par נְשַׁמָּה.
- source_word: כְּגַן עֵדֶן
  choice: comme le jardin d’Éden
  rationale: Rend directement la comparaison et conserve le nom biblique traditionnel Éden.
- source_word: הֶחֳרֵבוֹת וְהַנְּשַׁמּוֹת וְהַנֶּהֱרָסוֹת
  choice: en ruine, dévastées et démolies
  rationale: Préserve les trois descriptions coordonnées sans les réduire à une seule idée.
- source_word: בְּצוּרוֹת יָשָׁבוּ
  choice: sont maintenant fortifiées et habitées
  rationale: « Fortifiées » exprime בְּצוּרוֹת et « habitées » rend le qal passif contextuel de ישׁב ; « maintenant » fait ressortir naturellement le contraste avec leur état antérieur sans ajouter une nouvelle affirmation.
theological_decisions:
- issue: Identification des locuteurs du pluriel וְאָמְרוּ
  choice: On dira
  alternative: Ils diront
  rationale: Le sujet n’est pas nommé dans ce verset isolé. Le pronom indéfini français préserve cette indétermination sans imposer un antécédent.
translation_notes:
  register: Français international moderne, naturel et digne. La structure parallèle et l’accumulation des trois qualificatifs appliqués aux villes sont conservées.
