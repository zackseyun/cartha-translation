  text: וְ/יָדְע֣וּ הַ/גּוֹיִ֗ם אֲשֶׁ֣ר יִֽשָּׁאֲרוּ֮ סְבִיבוֹתֵי/כֶם֒ כִּ֣י אֲנִ֣י יְהוָ֗ה בָּנִ֨יתִי֙ הַ/נֶּ֣הֱרָס֔וֹת נָטַ֖עְתִּי הַ/נְּשַׁמָּ֑ה אֲנִ֥י יְהוָ֖ה דִּבַּ֥רְתִּי וְ/עָשִֽׂיתִי׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/036.yaml
  text: Then the nations that remain around you will know that I[a], Yahweh, have rebuilt the ruined places and planted what was desolate. I, Yahweh, have spoken, and I will do it.
translation:
  language: fr
  text: Alors les nations qui resteront autour de vous sauront que moi, Yahweh, j’ai rebâti ce qui était en ruine et planté ce qui était dévasté. Moi, Yahweh, j’ai parlé, et je le ferai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « j’ai parlé et je l’ai fait ». Le dernier verbe hébreu est formellement à l’accompli, mais il exprime probablement ici la certitude de ce que Yahweh accomplira.'
    reason: Variante aspectuelle et temporelle du parfait prophétique.
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Alors ... sauront
  rationale: Le waw poursuit ici la promesse de restauration avec une valeur de conséquence. « Alors » exprime naturellement cette progression en français, tandis que le futur rend l’orientation contextuelle.
- source_word: הַגּוֹיִם
  choice: les nations
  rationale: Le terme désigne ici les peuples environnants ; « nations » évite la connotation religieuse plus tardive de « païens » ou « non-Juifs ».
- source_word: אֲשֶׁר יִשָּׁאֲרוּ סְבִיבוֹתֵיכֶם
  choice: qui resteront autour de vous
  rationale: Le niphal de שׁאר indique ceux qui resteront ou auront été laissés. Cette formulation demeure naturelle et ne précise pas excessivement s’il s’agit de survivants.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: בָּנִיתִי הַנֶּהֱרָסוֹת
  choice: j’ai rebâti ce qui était en ruine
  rationale: Avec pour objet ce qui a été démoli, בנה a ici un sens restauratif ; « rebâti » le communique clairement. La tournure collective « ce qui était en ruine » respecte le pluriel substantivé sans alourdir le français.
- source_word: נָטַעְתִּי הַנְּשַׁמָּה
  choice: planté ce qui était dévasté
  rationale: « Planté » traduit directement נטע, sans ajouter l’idée non exprimée de replantation. « Ce qui était dévasté » conserve l’indétermination du substantif hébreu au lieu d’imposer « la terre ».
- source_word: דִּבַּרְתִּי וְעָשִׂיתִי
  choice: j’ai parlé, et je le ferai
  rationale: Le premier parfait constate la parole prononcée. Dans cette formule prophétique, le second parfait peut présenter l’accomplissement futur comme certain ; le futur français rend cette force contextuelle, tandis que « le » explicite l’objet sous-entendu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve au lieu de le remplacer par le titre traditionnel, sans ajouter d’interprétation confessionnelle.
- issue: Valeur temporelle et aspectuelle de וְעָשִׂיתִי dans la formule prophétique
  choice: je le ferai
  alternative: je l’ai fait
  rationale: La forme est morphologiquement un parfait et permet un rendu accompli, mais le contexte de promesse favorise un accomplissement futur présenté comme certain. La variante formelle est signalée en note afin de préserver l’ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme de la déclaration divine est conservé, ainsi que la distinction entre la reconstruction des ruines et la remise en culture de ce qui était dévasté.
