  text: וְ/אַתֶּ֞ם הָרֵ֤י יִשְׂרָאֵל֙ עַנְפְּ/כֶ֣ם תִּתֵּ֔נוּ וּ/פֶרְיְ/כֶ֥ם תִּשְׂא֖וּ לְ/עַמִּ֣/י יִשְׂרָאֵ֑ל כִּ֥י קֵרְב֖וּ לָ/בֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/008.yaml
  text: But you[a], mountains of Israel, shall put forth your branches and bear your fruit for my people Israel, for they are about to come.
translation:
  language: fr
  text: Mais vous, montagnes d’Israël, vous donnerez vos rameaux et porterez vos fruits pour mon peuple Israël, car ils vont bientôt venir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « car leur venue est proche ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֵי יִשְׂרָאֵל
  choice: montagnes d’Israël
  rationale: Cette expression récurrente chez Ézéchiel désigne le relief du pays, ici personnifié et directement interpellé.
- source_word: עַנְפְּכֶם תִּתֵּנוּ
  choice: vous déploierez vos rameaux
  rationale: Le verbe signifie littéralement « donner », mais avec « rameaux », « déployer » exprime naturellement en français la croissance annoncée tout en conservant l’image végétale.
- source_word: וּפֶרְיְכֶם תִּשְׂאוּ
  choice: et porterez vos fruits
  rationale: Le verbe נָשָׂא signifie fondamentalement « porter » ; associé aux fruits, il forme une expression agricole naturelle en français.
- source_word: לְעַמִּי יִשְׂרָאֵל
  choice: pour mon peuple Israël
  rationale: La préposition לְ indique ici le bénéficiaire. La formulation maintient à la fois l’appartenance exprimée par « mon peuple » et l’apposition « Israël ».
- source_word: קֵרְבוּ לָבוֹא
  choice: ils vont bientôt revenir
  rationale: La tournure exprime l’imminence de la venue du peuple. Dans le contexte du retour des exilés vers le pays, « revenir » est naturel et rend la direction implicite sans alourdir la phrase.
theological_decisions:
- issue: Référent du pluriel dans קֵרְבוּ (« ils se sont approchés »)
  choice: Le pronom « ils » renvoie aux membres du peuple d’Israël, sur le point de revenir au pays.
  alternative: 'Comprendre la proposition de manière plus impersonnelle : « leur venue est proche ».'
  rationale: « Mon peuple Israël » est l’antécédent immédiat et peut être envisagé collectivement comme une pluralité. La note conserve l’autre formulation possible sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La reprise « vous » après l’apostrophe souligne naturellement l’adresse aux montagnes. « Rameaux » préserve l’image poétique et agricole du texte hébreu.
