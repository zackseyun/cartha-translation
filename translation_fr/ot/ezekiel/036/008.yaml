    text: 'Autre traduction : « car leur venue est proche ».'
    reason: lexical_alternative
  revision_rationale: 'La révision remplace deux précisions interprétatives par des formulations françaises naturelles qui restent au plus près des verbes hébreux : les montagnes « donneront » leurs rameaux, et le peuple est sur le point de « venir ». La note maintient l’alternative qui formule la dernière proposition avec un nom plutôt qu’avec le pronom pluriel.'
