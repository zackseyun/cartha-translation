review_pass:
  verdict: revise
  source_fidelity: La structure de l’adresse et les images agricoles sont bien préservées. Toutefois, « déploierez » évoque surtout l’extension de rameaux déjà présents, tandis que תתנו עם ענפכם annonce qu’ils seront produits. De plus, « revenir » explicite le retour d’exil impliqué par le contexte, mais le verbe לבוא signifie simplement « venir » dans ce verset ; il vaut mieux ne pas ajouter cette direction au texte principal.
  naturalness: Le français est globalement fluide et d’un registre biblique moderne accessible. « Vous donnerez vos rameaux » est légèrement poétique, mais naturel dans cette personnification des montagnes et plus proche de l’hébreu que « vous déploierez vos rameaux ». « Ils vont bientôt venir » rend naturellement l’imminence.
  terminology: « Montagnes d’Israël », « rameaux », « fruits » et « mon peuple Israël » rendent adéquatement les termes et la personnification du texte. La note conserve de façon utile l’alternative nominale pour la dernière proposition.
  issues:
  - severity: medium
    issue: « vous déploierez vos rameaux »
    rationale: Le choix ajoute l’idée de déployer ou d’étendre les rameaux. Le verbe hébreu נתן, avec « rameaux », exprime plus directement le fait de les donner/produire.
  - severity: medium
    issue: « ils vont bientôt revenir »
    rationale: Le contexte envisage bien le retour d’Israël, mais le texte hébreu dit « venir » et n’explicite pas « revenir ». La traduction principale doit préserver cette formulation sans ajouter la direction du mouvement.
  revised_text: Mais vous, montagnes d’Israël, vous donnerez vos rameaux et porterez vos fruits pour mon peuple Israël, car ils vont bientôt venir[a].
  revised_footnotes:
