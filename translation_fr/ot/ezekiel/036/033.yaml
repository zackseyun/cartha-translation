  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה בְּ/יוֹם֙ טַהֲרִ֣/י אֶתְ/כֶ֔ם מִ/כֹּ֖ל עֲוֺנֽוֹתֵי/כֶ֑ם וְ/הֽוֹשַׁבְתִּי֙ אֶת הֶ֣/עָרִ֔ים וְ/נִבְנ֖וּ הֶ/חֳרָבֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/033.yaml
  text: 'Thus says the Lord GOD: On the day I cleanse you from all your iniquities[a], I will cause the cities to be inhabited[c][b], and the ruins will be rebuilt.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh : Le jour où je vous purifierai de toutes vos fautes, je ferai habiter les villes[a], et les ruines seront rebâties.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je repeuplerai les villes » ou « je ferai en sorte que les villes soient habitées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה, sans produire l'expression française maladroite « le Seigneur SEIGNEUR ».
- source_word: בְּיוֹם טַהֲרִי אֶתְכֶם
  choice: Le jour où je vous purifierai
  rationale: Conserve l'image temporelle de בְּיוֹם et rend le piel de טהר par « purifier », naturel dans ce contexte moral et cultuel.
- source_word: מִכֹּל עֲוֺנוֹתֵיכֶם
  choice: de toutes vos fautes
  rationale: « Fautes » exprime ici les torts moraux désignés par עָוֹן, tout en restant clair et courant; le pluriel et la totalité sont conservés.
- source_word: וְהוֹשַׁבְתִּי אֶת הֶעָרִים
  choice: je ferai habiter les villes
  rationale: Préserve la valeur causative du hiphil de ישׁב et les villes comme complément direct, sans ajouter explicitement « des gens ».
- source_word: וְנִבְנוּ הֶחֳרָבוֹת
  choice: les ruines seront rebâties
  rationale: Rend naturellement le passif נִבְנוּ et le sens de חֳרָבוֹת comme lieux ruinés ou dévastés.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le choix conserve à la fois le titre « Seigneur » et le nom propre divin, évitant de confondre les deux éléments du syntagme.
- issue: Portée de עֲוֺנוֹתֵיכֶם
  choice: vos fautes
  alternative: vos iniquités / vos culpabilités
  rationale: Le terme peut désigner la faute, l'iniquité ou la culpabilité qui en découle. « Fautes » garde une portée morale large sans trancher en faveur de la seule culpabilité juridique.
translation_notes:
  register: Français moderne, digne et accessible. « Ainsi parle » conserve la formule prophétique; « rebâties » s'accorde au contexte de restauration urbaine. Le tour « je ferai habiter les villes » est légèrement soutenu mais reproduit utilement la construction causative hébraïque.
