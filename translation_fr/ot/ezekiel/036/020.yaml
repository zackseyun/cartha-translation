  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּב֗וֹא אֶל הַ/גּוֹיִם֙ אֲשֶׁר בָּ֣אוּ שָׁ֔ם וַֽ/יְחַלְּל֖וּ אֶת שֵׁ֣ם קָדְשִׁ֑/י בֶּ/אֱמֹ֤ר לָ/הֶם֙ עַם יְהוָ֣ה אֵ֔לֶּה וּ/מֵ/אַרְצ֖/וֹ יָצָֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/020.yaml
  text: And when they came to the nations where they went[a], they profaned my holy name, in that people said of them, ‘These are the people of Yahweh[b], and yet they had to go out of his land.’
translation:
  language: fr
  text: 'Lorsqu’ils sont arrivés parmi les nations où ils s’étaient rendus[a], ils ont profané mon saint nom, car on disait à leur sujet : « Ce sont le peuple de Yahweh, et pourtant ils sont sortis de son pays[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le premier verbe est au singulier en hébreu (« il est arrivé »), probablement avec Israël compris comme un sujet collectif ; la suite emploie le pluriel.
    reason: grammatical_ambiguity
  - marker: b
    text: 'Ou : « mais ils ont quitté son pays ». L’hébreu évoque la honte de l’exil sans dire explicitement qui les en a chassés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבוֹא
  choice: Ils sont arrivés
  rationale: Le verbe hébreu est morphologiquement au singulier, mais le contexte immédiat parle d’Israël comme d’un groupe et enchaîne avec des formes plurielles. Le pluriel français rend naturellement ce sujet collectif sans masquer l’anomalie, signalée en note.
- source_word: אֶל־הַגּוֹיִם
  choice: parmi les nations
  rationale: « Nations » désigne ici les peuples étrangers au milieu desquels Israël a été dispersé. « Parmi » convient mieux que « vers » au contexte de l’exil et de la présence d’Israël chez ces peuples.
- source_word: וַיְחַלְּלוּ
  choice: ils ont profané
  rationale: Au piel, חלל exprime le fait de traiter comme profane ce qui est saint. « Profaner » conserve la force religieuse et théologique du verbe.
- source_word: שֵׁם קָדְשִׁי
  choice: mon saint nom
  rationale: Formulation française naturelle qui conserve à la fois la sainteté du nom divin et ce qu’il représente de l’identité et de la réputation de Dieu.
- source_word: בֶּאֱמֹר לָהֶם
  choice: car on disait à leur sujet
  rationale: L’hébreu dit littéralement « en disant à eux ». Dans le contexte, ces paroles tenues parmi les nations concernent Israël. La tournure impersonnelle française préserve le lien entre la profanation et ce qui se disait d’eux.
- source_word: עַם יְהוָה אֵלֶּה
  choice: Ceux-là sont le peuple de Yahweh
  rationale: « Ceux-là » maintient l’accent démonstratif, possiblement dépréciatif, tandis que « le peuple de Yahweh » exprime clairement le lien d’alliance.
- source_word: וּמֵאַרְצוֹ יָצָאוּ
  choice: et pourtant ils sont sortis de son pays
  rationale: Le texte affirme littéralement leur sortie du pays de Yahweh sans préciser qu’ils en ont été chassés. « Pourtant » fait entendre le contraste honteux implicite dans la remarque des nations sans transformer le verbe en passif.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / l’Éternel
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom d’alliance au lieu de le remplacer par un titre.
- issue: Agent de la profanation du nom divin
  choice: Israël reste le sujet de « ils ont profané », tandis que les propos des nations montrent comment cette profanation s’est manifestée
  alternative: Les nations profanent elles-mêmes le nom par leurs paroles
  rationale: Le contexte et le verbe pluriel rattachent naturellement l’action aux Israélites, mais la construction comprime le rapport entre leur situation et les paroles prononcées à leur sujet. La traduction ne tranche pas davantage que le texte.
- issue: Nature de la sortie du pays
  choice: ils sont sortis de son pays
  alternative: ils ont dû quitter son pays / ils ont été chassés de son pays
  rationale: L’exil forcé et la honte sont implicites dans le contexte, mais le verbe hébreu ne nomme ni la contrainte ni l’agent qui les a expulsés.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition du déplacement est légèrement allégée par « où ils s’étaient rendus ». Le discours cité garde une pointe de mépris ou d’incrédulité avec « Ceux-là » et le point d’exclamation, sans expliciter davantage l’ironie des nations.
