reference: Ezekiel 36:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בֶּן אָדָ֗ם בֵּ֤ית יִשְׂרָאֵל֙ יֹשְׁבִ֣ים עַל אַדְמָתָ֔/ם וַ/יְטַמְּא֣וּ אוֹתָ֔/הּ בְּ/דַרְכָּ֖/ם וּ/בַ/עֲלִֽילוֹתָ֑/ם כְּ/טֻמְאַת֙ הַ/נִּדָּ֔ה הָיְתָ֥ה דַרְכָּ֖/ם לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/017.yaml
  text: Son of man[a], when the house of Israel was dwelling on their own land, they defiled it by their way and by their deeds; their way before me was like the uncleanness of a menstruating woman.
translation:
  language: fr
  text: Fils d’homme, lorsque la maison d’Israël habitait sur sa terre, elle l’a rendue impure par sa conduite et par ses actes. Sa conduite devant moi était comme l’impureté liée aux règles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme l’impureté menstruelle ». L’hébreu compare la conduite d’Israël à l’impureté rituelle associée aux règles.
    reason: Préciser la référence cultuelle de l’image et signaler une traduction plus littérale.
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Formule d’adresse prophétique caractéristique d’Ézéchiel; cette expression consacrée préserve l’image hébraïque et la continuité littéraire.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Conserve la désignation collective et son poids corporatif, sans la réduire au sens plus général de « peuple ».
- source_word: יֹשְׁבִים עַל אַדְמָתָם
  choice: habitait sur sa terre
  rationale: Le participe exprime une résidence continue; le singulier s’accorde naturellement en français avec le collectif « maison d’Israël ». « Terre » rend ici le territoire appartenant à Israël.
- source_word: וַיְטַמְּאוּ אוֹתָהּ
  choice: elle l’a rendue impure
  rationale: Rend explicitement le fait de communiquer une impureté à la terre et maintient la résonance rituelle et morale de טמא.
- source_word: בְּדַרְכָּם וּבַעֲלִילוֹתָם
  choice: par sa conduite et par ses actes
  rationale: « Conduite » exprime naturellement en français le sens métaphorique de « voie », tandis que « actes » restitue concrètement les agissements.
- source_word: כְּטֻמְאַת הַנִּדָּה
  choice: comme l’impureté liée aux règles
  rationale: Préserve explicitement l’image de l’impureté menstruelle tout en évitant de présenter la menstruation elle-même comme une faute morale.
- source_word: הָיְתָה דַרְכָּם לְפָנָי
  choice: Sa conduite devant moi était
  rationale: « Devant moi » conserve la présence évaluative de Dieu exprimée par לְפָנַי.
theological_decisions:
- issue: Nature de l’image d’impureté
  choice: Conserver la comparaison avec l’impureté rituelle liée aux menstruations.
  alternative: Employer un terme générique comme « souillure » sans mention des règles.
  rationale: Le texte utilise délibérément une catégorie cultuelle pour qualifier moralement la conduite d’Israël; supprimer la référence menstruelle effacerait la métaphore théologique.
- issue: Rapport entre menstruation et culpabilité morale
  choice: Formuler « impureté liée aux règles » et expliquer la portée rituelle en note.
  alternative: Dire simplement « impureté d’une femme qui a ses règles », formulation susceptible de suggérer une culpabilité personnelle.
  rationale: La comparaison porte sur l’état d’impureté selon le cadre rituel ancien, non sur une faute morale attribuée à la femme.
- issue: Valeur temporelle de la proposition participiale initiale
  choice: Introduire la proposition par « lorsque ».
  alternative: Conserver une construction appositive littérale et peu naturelle.
  rationale: Le participe hébreu fournit le cadre temporel de l’action suivante; « lorsque » explicite cette relation sans résoudre une ambiguïté théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’enchaînement hébreu, mais « conduite » est préféré à « voie » pour une compréhension immédiate. Le féminin singulier reprend naturellement le nom collectif « maison d’Israël ».
