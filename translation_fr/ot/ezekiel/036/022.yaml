  text: לָ/כֵ֞ן אֱמֹ֣ר לְ/בֵֽית יִשְׂרָאֵ֗ל כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה לֹ֧א לְמַעַנְ/כֶ֛ם אֲנִ֥י עֹשֶׂ֖ה בֵּ֣ית יִשְׂרָאֵ֑ל כִּ֤י אִם לְ/שֵׁם קָדְשִׁ/י֙ אֲשֶׁ֣ר חִלַּלְתֶּ֔ם בַּ/גּוֹיִ֖ם אֲשֶׁר בָּ֥אתֶם שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/022.yaml
  text: 'Therefore say to the house of Israel[a], ‘Thus says the Lord GOD: It is not for your sake that I am acting, O house of Israel, but for my holy name[b], which you have profaned among the nations where you went.’'
translation:
  language: fr
  text: 'C’est pourquoi, dis à la maison d’Israël : « Voici ce que dit le Seigneur Yahweh : Ce n’est pas par égard pour vous que j’agis, ô maison d’Israël, mais pour mon saint nom, que vous avez profané parmi les nations où vous êtes allés. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque naturellement en français la conséquence tirée du contexte précédent.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: à la maison d’Israël
  rationale: Conserve l’expression collective et covenantale de l’hébreu sans la réduire au simple nom « Israël ».
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Rend la formule du messager prophétique dans un français actuel et digne.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: 'Rend les deux éléments du titre hébreu : אֲדֹנָי par « le Seigneur » et le nom divin יהוה par « Yahweh ».'
- source_word: לֹא לְמַעַנְכֶם
  choice: Ce n’est pas par égard pour vous
  rationale: Exprime clairement que l’action divine n’est pas motivée par les mérites ou l’intérêt d’Israël.
- source_word: אֲנִי עֹשֶׂה
  choice: que j’agis
  rationale: Le participe décrit l’action divine présente ou imminente sans imposer un complément absent de l’hébreu.
- source_word: בֵּית יִשְׂרָאֵל
  choice: maison d’Israël
  rationale: Maintient la reprise en apostrophe, qui souligne directement l’identité des destinataires.
- source_word: כִּי אִם לְשֵׁם קָדְשִׁי
  choice: mais pour mon saint nom
  rationale: Préserve le contraste et la notion biblique du nom de Dieu comme objet de sa sollicitude.
- source_word: אֲשֶׁר חִלַּלְתֶּם
  choice: que vous avez profané
  rationale: '« Profaner » restitue la force cultuelle et théologique du piel de חלל : traiter comme commun ce qui est saint.'
- source_word: בַּגּוֹיִם אֲשֶׁר בָּאתֶם שָׁם
  choice: parmi les nations où vous êtes allés
  rationale: Rend idiomatiquement le déplacement vers les nations et le milieu dans lequel le nom a été profané.
theological_decisions:
- issue: Rendu du nom divin יהוה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte consonantique contient le nom divin יהוה. « Yahweh » le conserve comme nom propre, tandis que « Seigneur » rend אֲדֹנָי et évite de confondre les deux termes.
- issue: Motif de l’action restauratrice de Dieu
  choice: Ce n’est pas par égard pour vous… mais pour mon saint nom
  alternative: Ce n’est pas à cause de vous… mais à cause de mon saint nom
  rationale: « Par égard pour » exprime plus précisément le motif visé par לְמַעַן et préserve l’opposition théologique entre le mérite d’Israël et la sainteté du nom divin, sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, clair et soutenu. La formule prophétique reste solennelle sans archaïsmes. La répétition de « maison d’Israël » est conservée pour respecter l’insistance et l’apostrophe du texte hébreu.
