  text: וְ/לָקַחְתִּ֤י אֶתְ/כֶם֙ מִן הַ/גּוֹיִ֔ם וְ/קִבַּצְתִּ֥י אֶתְ/כֶ֖ם מִ/כָּל הָ/אֲרָצ֑וֹת וְ/הֵבֵאתִ֥י אֶתְ/כֶ֖ם אֶל אַדְמַתְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/024.yaml
  text: For I will take you from the nations[a], and gather you from all the lands[c][b], and bring you into your own land.
translation:
  language: fr
  text: Je vous prendrai du milieu des nations, je vous rassemblerai de tous les pays et je vous amènerai dans votre terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: Je vous prendrai
  rationale: Le verbe לקח exprime ici l’action personnelle et délibérée de Dieu qui retire son peuple de sa dispersion.
- source_word: מִן הַגּוֹיִם
  choice: du milieu des nations
  rationale: גּוֹיִם désigne les nations parmi lesquelles le peuple a été dispersé; «du milieu de» rend naturellement cette provenance sans employer le terme plus chargé «païens».
- source_word: וְקִבַּצְתִּי
  choice: je vous rassemblerai
  rationale: קבץ est le verbe prophétique courant pour le rassemblement d’un peuple dispersé.
- source_word: מִכָּל הָאֲרָצוֹת
  choice: de tous les pays
  rationale: Le pluriel אֲרָצוֹת désigne ici les différents territoires ou pays de la dispersion; «pays» est naturel et précis en français moderne.
- source_word: וְהֵבֵאתִי
  choice: je vous ramènerai
  rationale: Le hiphil de בוא signifie «faire venir, amener». Dans ce contexte explicite de restauration vers la terre du peuple, «ramener» exprime naturellement le mouvement de retour, bien que l’idée de retour soit contextuelle plutôt que lexicalement marquée.
- source_word: אֶל אַדְמַתְכֶם
  choice: sur votre terre
  rationale: אַדָמָה peut signifier sol ou terre. Ici, avec le suffixe possessif, il s’agit de la terre du peuple; «sur votre terre» est idiomatique et conserve directement le possessif.
theological_decisions:
- issue: Restauration et possession de la terre
  choice: sur votre terre
  alternative: dans votre propre pays
  rationale: La traduction conserve le suffixe «votre» et le langage de restauration sans développer le sens en une formulation théologique plus explicite que l’hébreu.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme des trois actions divines est conservé. Aucun marqueur de note n’est requis, puisque les nuances principales peuvent être rendues directement dans le texte.
