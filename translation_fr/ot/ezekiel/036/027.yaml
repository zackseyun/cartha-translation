source:
  edition: WLC
  text: וְ/אֶת רוּחִ֖/י אֶתֵּ֣ן בְּ/קִרְבְּ/כֶ֑ם וְ/עָשִׂ֗יתִי אֵ֤ת אֲשֶׁר בְּ/חֻקַּ/י֙ תֵּלֵ֔כוּ וּ/מִשְׁפָּטַ֥/י תִּשְׁמְר֖וּ וַ/עֲשִׂיתֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/027.yaml
  text: And I will put my Spirit within you[a], and I will cause you to walk in my statutes[b], and you will keep my judgments and do them.
translation:
  language: fr
  text: Je mettrai mon Esprit en vous et je ferai en sorte que vous marchiez selon mes prescriptions[a], que vous observiez mes règles[b] et les mettiez en pratique.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes décrets ».
    reason: lexical_alternative
  - marker: b
    text: Ou « mes ordonnances » ou « mes décisions de justice ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחִי
  choice: mon Esprit
  rationale: Dans ce contexte de restauration, רוּחַ avec le suffixe de première personne désigne l'Esprit de Dieu plutôt que son souffle ou le vent. La majuscule indique naturellement ce référent divin en français.
- source_word: בְּקִרְבְּכֶם
  choice: en vous
  rationale: L'expression peut évoquer l'intérieur ou le milieu. Associée au cœur nouveau dans le contexte immédiat, « en vous » rend clairement la transformation intérieure sans alourdir la phrase.
- source_word: וְעָשִׂיתִי
  choice: je ferai en sorte que
  rationale: 'Bien que עשה signifie ordinairement « faire », la construction introduit ici ce que Dieu fera advenir : la conduite obéissante du peuple. Cette formulation française exprime nettement cette valeur causative.'
- source_word: בְּחֻקַּי תֵּלֵכוּ
  choice: vous marchiez selon mes prescriptions
  rationale: « Marcher » conserve la métaphore biblique de la conduite, tandis que « selon » exprime naturellement la norme donnée par les prescriptions divines.
- source_word: חֻקַּי
  choice: mes prescriptions
  rationale: חֹק/חֻקָּה désigne des dispositions prescrites. « Prescriptions » garde la nuance normative et distingue ce terme de מִשְׁפָּטִים.
- source_word: מִשְׁפָּטַי
  choice: mes règles
  rationale: Dans cette association de termes juridiques de l'alliance, מִשְׁפָּטִים désigne les règles ou ordonnances divines. « Règles » est clair en français moderne tout en conservant la nuance normative.
- source_word: תִּשְׁמְרוּ
  choice: vous observiez
  rationale: Dans un contexte juridique, שׁמר signifie garder au sens de respecter ou observer. « Observer » est idiomatique avec des règles.
- source_word: וַעֲשִׂיתֶם
  choice: les mettiez en pratique
  rationale: Le dernier verbe souligne l'exécution concrète, au-delà de la simple conservation. « Mettre en pratique » rend cette idée naturellement en français.
theological_decisions:
- issue: Action divine et obéissance humaine
  choice: je ferai en sorte que vous marchiez selon mes prescriptions
  alternative: j'agirai afin que vous marchiez selon mes prescriptions
  rationale: L'hébreu présente l'action efficace de Dieu comme conduisant à l'obéissance du peuple. La traduction maintient cette forte initiative divine sans l'expliquer au moyen d'un cadre doctrinal ultérieur.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore biblique de la marche est conservée, tandis que les termes juridiques sont différenciés sans technicité excessive.
