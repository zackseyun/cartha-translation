source:
  edition: WLC
  text: וְ/הִרְבֵּיתִי֙ אֶת פְּרִ֣י הָ/עֵ֔ץ וּ/תְנוּבַ֖ת הַ/שָּׂדֶ֑ה לְמַ֗עַן אֲ֠שֶׁר לֹ֣א תִקְח֥וּ ע֛וֹד חֶרְפַּ֥ת רָעָ֖ב בַּ/גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/030.yaml
  text: And I will multiply the fruit of the tree and the produce of the field[a], so that you will no longer bear the reproach of famine among the nations.
translation:
  language: fr
  text: Je multiplierai le fruit des arbres et les produits des champs, afin que vous ne subissiez plus l’opprobre de la famine parmi les nations[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin que vous ne souffriez plus de la honte de la famine parmi les nations ».'
    reason: Alternative lexicale et idiomatique pour l’expression « prendre l’opprobre ».
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  choice: Je multiplierai
  rationale: Le hifil exprime l’action causative de Dieu et, dans ce discours prophétique, une promesse future. « Multiplier » conserve cette nuance tout en restant naturel.
- source_word: פְּרִי הָעֵץ
  choice: le fruit des arbres
  rationale: Le singulier hébreu est collectif. Le pluriel français « des arbres » exprime naturellement l’ensemble de la production arboricole.
- source_word: וּתְנוּבַת הַשָּׂדֶה
  choice: et les produits des champs
  rationale: תְּנוּבָה désigne la production ou le rendement agricole. Le pluriel français rend idiomatiquement le singulier collectif hébreu.
- source_word: לְמַעַן אֲשֶׁר
  choice: afin que
  rationale: Cette locution introduit ici le but ou le résultat de l’abondance promise.
- source_word: לֹא תִקְחוּ עוֹד
  choice: vous n’ayez plus à subir
  rationale: Pris avec חֶרְפָּה, le verbe לקח forme une expression qu’un rendu littéral par « prendre » obscurcirait. « Subir » communique clairement l’expérience imposée de l’opprobre.
- source_word: חֶרְפַּת רָעָב
  choice: l’opprobre de la famine
  rationale: « Opprobre » préserve la dimension publique de honte et de déshonneur liée à la famine, sans réduire le propos à la seule privation matérielle.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: La préposition situe cette honte au milieu ou au regard des peuples environnants. « Nations » convient mieux au contexte d’Ézéchiel que « païens » ou « gentils ».
theological_decisions:
- issue: La promesse porte-t-elle seulement sur la prospérité agricole ou aussi sur la réhabilitation d’Israël devant les nations ?
  choice: 'Conserver les deux dimensions : Dieu accorde l’abondance agricole afin que cesse le déshonneur public associé à la famine.'
  alternative: Comprendre le verset comme une promesse purement économique, ou au contraire comme une restauration d’honneur détachée de l’abondance matérielle.
  rationale: L’hébreu relie explicitement l’augmentation des fruits et des produits à la fin de l’opprobre de la famine parmi les nations ; aucune des deux dimensions ne doit être effacée.
translation_notes:
  register: Français international moderne, clair et digne. « Opprobre » est légèrement soutenu, mais précis dans ce contexte prophétique d’humiliation publique. Les collectifs hébreux au singulier sont rendus par des pluriels français naturels.
