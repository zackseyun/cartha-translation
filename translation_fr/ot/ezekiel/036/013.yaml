  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֚עַן אֹמְרִ֣ים לָ/כֶ֔ם אֹכֶ֥לֶת אָדָ֖ם אתי וּ/מְשַׁכֶּ֥לֶת גוי/ך הָיִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/013.yaml
  text: 'Thus says the Lord GOD: Because they say of you[b][a], ‘You devour people and have bereaved your nation,’'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh : Parce qu’on dit de toi : « Tu as été une dévoreuse d’êtres humains[a] et tu as privé ton peuple de ses enfants[b] »,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dévoreuse d’humains »; le terme « humains » a ici un sens collectif : les gens, l’humanité.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tu as rendu ton peuple sans enfants » ou « tu as endeuillé ton peuple »; le verbe évoque la perte des enfants ou le fait d’en être privé.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique consacrée, naturelle et digne en français moderne.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend les deux éléments du titre divin sans produire l’expression artificielle « le Seigneur SEIGNEUR » et conserve le nom propre divin.
- source_word: יַעַן
  choice: Parce que
  rationale: Introduit directement la proposition qui motive la déclaration divine, laquelle se poursuit au verset suivant.
- source_word: אֹמְרִים לָכֶם
  choice: on dit de toi
  rationale: Le pluriel indéfini se rend naturellement par « on »; dans ce contexte, לָכֶם introduit ce qui est dit au sujet du pays, tutoyé au féminin dans la citation.
- source_word: אֹכֶלֶת אָדָם
  choice: Tu dévores les êtres humains
  rationale: Conserve l’image forte de la dévoration tout en rendant אָדָם dans son sens collectif et générique.
- source_word: וּמְשַׁכֶּלֶת גּוֹיִךְ
  choice: et tu prives ton peuple de ses enfants
  rationale: Exprime le sens causatif de שׁכל sans le limiter à la fausse couche; « peuple » est ici plus naturel que « nation » pour la population appartenant au pays.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte contient à la fois le titre אֲדֹנָי et le nom divin יהוה; cette formulation maintient leur distinction.
- issue: Portée de l’accusation adressée au pays
  choice: 'Maintenir la personnification directe : « Tu dévores… »'
  alternative: 'Expliciter : « Tu es un pays qui dévores… »'
  rationale: Le référent est le pays, mais le mot « pays » n’est pas exprimé dans ce verset; l’apostrophe préserve donc la formulation hébraïque sans ajout interprétatif.
- issue: Sens de וּמְשַׁכֶּלֶת
  choice: tu prives ton peuple de ses enfants
  alternative: tu endeuilles ton peuple / tu rends ta nation stérile
  rationale: Le verbe peut évoquer la perte des enfants ou le fait d’en être privé. La traduction retenue préserve cette idée sans spécifier indûment le mécanisme de la perte.
translation_notes:
  register: Français international moderne, avec une cadence prophétique digne. Le tutoiement féminin du pays, visible en hébreu, ne peut être marqué grammaticalement dans ces verbes français, mais la personnification est conservée. La phrase reste ouverte par une virgule, car la conséquence de « Parce que » vient au verset suivant.
