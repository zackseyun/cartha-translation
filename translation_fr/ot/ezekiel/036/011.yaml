  naturalness: Le français est globalement moderne et clair. « Je ferai se multiplier sur vous » est plus naturel et plus exact que « Je multiplierai sur vous », tout en conservant l’image spatiale liée aux montagnes. « Je vous rendrai de nouveau habitées » exprime naturellement le sens contextuel sans modifier la portée de la promesse.
  terminology: « les humains et les animaux » rend convenablement le couple collectif אדם ובהמה en français international actuel. « Yahweh » représente directement le Tétragramme. « Féconds » est approprié pour la fécondité des populations humaine et animale.
