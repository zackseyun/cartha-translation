  edition: WLC
  text: וְ/הִרְבֵּיתִ֧י עֲלֵי/כֶ֛ם אָדָ֥ם וּ/בְהֵמָ֖ה וְ/רָב֣וּ וּ/פָר֑וּ וְ/הוֹשַׁבְתִּ֨י אֶתְ/כֶ֜ם כְּ/קַדְמֽוֹתֵי/כֶ֗ם וְ/הֵטִֽבֹתִי֙ מֵ/רִאשֹׁ֣תֵי/כֶ֔ם וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/011.yaml
  text: And I will multiply upon you man and beast[a], and they will multiply and be fruitful; and I will settle you as in your former times, and I will do better for you than at your beginnings[c][b]. Then you will know that I am Yahweh.
translation:
  language: fr
  text: Je ferai se multiplier sur vous les humains et les animaux ; ils se multiplieront et seront féconds. Je vous rendrai de nouveau habitées, comme autrefois[a], et je vous ferai plus de bien qu’à vos premiers temps[b]. Alors vous saurez que je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je vous ferai habiter ». Le destinataire étant les montagnes d’Israël dans le contexte, le sens est qu’elles seront de nouveau habitées.'
    reason: Précise la construction causative et le référent contextuel du pronom.
  - marker: b
    text: 'Ou : « je vous traiterai mieux qu’à vos premiers temps ».'
    reason: Indique une autre formulation du verbe יטב et de la comparaison avec les premiers temps.
lexical_decisions:
- source_word: וְהִרְבֵּיתִי עֲלֵיכֶם
  choice: Je multiplierai sur vous
  rationale: 'Le hiphil de רבה exprime l’accroissement causé par Yahweh. « Sur vous » conserve l’image spatiale du texte : les montagnes d’Israël, auxquelles le discours s’adresse, seront couvertes d’une population croissante.'
- source_word: אָדָם וּבְהֵמָה
  choice: les humains et les animaux
  rationale: Les deux noms sont collectifs et désignent ensemble la population humaine et animale. Cette formulation française actuelle évite de restreindre אָדָם aux hommes de sexe masculin et בְּהֵמָה au seul bétail.
- source_word: וְרָבוּ וּפָרוּ
  choice: ils se multiplieront et seront féconds
  rationale: Les deux verbes annoncent l’accroissement numérique et la fécondité. La formulation garde leur distinction ainsi que l’écho du langage biblique de bénédiction.
- source_word: וְהוֹשַׁבְתִּי אֶתְכֶם
  choice: Je vous repeuplerai
  rationale: Le hiphil de ישב signifie ici rendre de nouveau habitées les montagnes auxquelles Yahweh parle. « Repeupler » rend naturellement en français le caractère causatif et le contexte de restauration.
- source_word: כְּקַדְמֹתֵיכֶם
  choice: comme autrefois
  rationale: Le terme renvoie à l’état ou aux temps antérieurs. « Comme autrefois » exprime la restauration sans suggérer nécessairement un retour au commencement absolu.
- source_word: וְהֵטִבֹתִי מֵרִאשֹׁתֵיכֶם
  choice: je vous ferai plus de bien qu’à vos débuts
  rationale: Le hiphil de יטב a ici un sens bénéf actif, et מִן introduit la comparaison. « Vos débuts » conserve la référence aux premiers temps sans confondre cette expression avec « autrefois » dans le membre précédent.
- source_word: וִידַעְתֶּם כִּי אֲנִי יְהוָה
  choice: Alors vous saurez que je suis Yahweh
  rationale: « Alors » explicite avec naturel la conséquence contextuelle portée par le waw. Le nom divin est translittéré « Yahweh » afin de représenter directement יהוה.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte donne le nom propre de l’alliance. « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Portée collective de אָדָם dans le couple humain-animal
  choice: les humains
  alternative: l’homme
  rationale: אָדָם désigne ici collectivement la population humaine opposée aux animaux, et non un individu masculin. « Les humains » rend cette portée sans ajouter de distinction de sexe.
- issue: Destinataire de וְהוֹשַׁבְתִּי אֶתְכֶם
  choice: Je vous repeuplerai
  alternative: Je vous ferai habiter
  rationale: Dans le contexte, Yahweh s’adresse aux montagnes d’Israël. Le sens est donc qu’elles redeviendront habitées, plutôt que les montagnes elles-mêmes seraient amenées à demeurer quelque part.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « multiplierai / se multiplieront » est conservée pour refléter le lien verbal de l’hébreu. Le point-virgule structure les promesses successives sans alourdir la phrase.
