source:
  edition: WLC
  text: כְּ/צֹ֣אן קָֽדָשִׁ֗ים כְּ/צֹ֤אן יְרוּשָׁלִַ֨ם֙ בְּ/מ֣וֹעֲדֶ֔י/הָ כֵּ֤ן תִּהְיֶ֨ינָה֙ הֶ/עָרִ֣ים הֶ/חֳרֵב֔וֹת מְלֵא֖וֹת צֹ֣אן אָדָ֑ם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/038.yaml
  text: Like the holy flock[a], like the flock of Jerusalem at her appointed feasts, so the ruined cities will be filled with flocks of people. Then they will know that I am Yahweh.
translation:
  language: fr
  text: Comme un troupeau consacré[a], comme le troupeau de Jérusalem lors de ses fêtes prescrites, ainsi les villes en ruine seront remplies de troupeaux humains. Alors ils sauront que je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un troupeau d’animaux consacrés ». Il s’agit vraisemblablement des nombreux animaux destinés aux sacrifices lors des fêtes à Jérusalem.
    reason: Précise la valeur cultuelle probable de קָדָשִׁים tout en signalant la construction collective et condensée de l’hébreu.
lexical_decisions:
- source_word: כְּצֹאן קָדָשִׁים
  choice: Comme un troupeau consacré
  rationale: צֹאן est un collectif désignant le petit bétail, donc un « troupeau ». Dans ce contexte cultuel, קָדָשִׁים évoque des animaux consacrés, destinés aux sacrifices. « Consacré » rend cette valeur plus clairement en français que « saint », qui pourrait suggérer une qualité morale du troupeau.
- source_word: כְּצֹאן יְרוּשָׁלִַם בְּמוֹעֲדֶיהָ
  choice: comme le troupeau de Jérusalem lors de ses fêtes fixées
  rationale: מוֹעֵד désigne ici les temps cultuels établis, c’est-à-dire les fêtes fixées. Le possessif « ses » reprend le suffixe féminin renvoyant à Jérusalem.
- source_word: כֵּן תִּהְיֶינָה
  choice: ainsi ... seront
  rationale: Conserve la construction corrélative « comme… ainsi… » et la valeur future du verbe.
- source_word: הֶעָרִים הֶחֳרֵבוֹת
  choice: les villes en ruine
  rationale: Expression française naturelle qui restitue l’état de dévastation indiqué par חֳרֵבוֹת.
- source_word: מְלֵאוֹת צֹאן אָדָם
  choice: seront remplies de troupeaux humains
  rationale: La formulation maintient la métaphore hébraïque inhabituelle, où la population multipliée est comparée aux nombreux troupeaux sacrificiels, sans réduire le sens à « beaucoup de gens ».
- source_word: וְיָדְעוּ
  choice: Alors ils sauront
  rationale: « Alors » exprime naturellement la conséquence dans ce contexte, tandis que « ils » conserve l’indétermination du sujet pluriel hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin exprimé par le tétragramme, plutôt que substitution par un titre.
theological_decisions:
- issue: Sens cultuel de קָדָשִׁים
  choice: un troupeau consacré
  alternative: un troupeau saint
  rationale: Le parallèle avec les fêtes de Jérusalem fait probablement référence au bétail consacré aux sacrifices. La traduction retient cette orientation cultuelle sans préciser un type particulier de sacrifice.
- issue: Métaphore de צֹאן אָדָם
  choice: des troupeaux humains
  alternative: des gens comme un troupeau
  rationale: Le choix conserve la tension de l’expression hébraïque et son lien direct avec les troupeaux présents à Jérusalem pendant les fêtes.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte source emploie le nom propre divin; sa transcription le distingue d’un simple titre.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe « Comme… comme… ainsi… » préserve le parallélisme hébreu. « Troupeaux humains » est volontairement imagé et légèrement inhabituel, comme l’expression source.
