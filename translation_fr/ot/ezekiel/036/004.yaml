- from: 'C’est pourquoi, montagnes d’Israël, écoutez la parole du Seigneur Yahweh. Ainsi parle le Seigneur Yahweh aux montagnes et aux collines, aux ravins[a] et aux vallées, aux ruines dévastées et aux villes abandonnées, qui sont devenues la proie et la risée du reste[b] des nations alentour :'
  to: 'C’est pourquoi, montagnes d’Israël, écoutez la parole du Seigneur Yahweh. Ainsi parle le Seigneur Yahweh aux montagnes et aux collines, aux ravins[a] et aux vallées, aux ruines désolées et aux villes abandonnées, qui sont devenues un butin et une risée pour le reste[b] des nations alentour :'
  rationale: La révision limite les changements aux deux expressions où le français proposé ne rendait pas de façon optimale le lexique et l’aspect du texte hébreu. Elle maintient l’ordre, l’ambiguïté de « reste », les adresses répétées et les deux ancres de note.
