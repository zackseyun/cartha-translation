source:
  edition: WLC
  text: לָ/כֵן֙ הָרֵ֣י יִשְׂרָאֵ֔ל שִׁמְע֖וּ דְּבַר אֲדֹנָ֣/י יְהוִ֑ה כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְ֠הוִה לֶ/הָרִ֨ים וְ/לַ/גְּבָע֜וֹת לָ/אֲפִיקִ֣ים וְ/לַ/גֵּאָי֗וֹת וְ/לֶ/חֳרָב֤וֹת הַ/שֹּֽׁמְמוֹת֙ וְ/לֶ/עָרִ֣ים הַ/נֶּעֱזָב֔וֹת אֲשֶׁ֨ר הָי֤וּ לְ/בַז֙ וּ/לְ/לַ֔עַג לִ/שְׁאֵרִ֥ית הַ/גּוֹיִ֖ם אֲשֶׁ֥ר מִ/סָּבִֽיב־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/004.yaml
  text: 'Therefore[a], mountains of Israel, hear the word of the Lord GOD. Thus says the Lord GOD to the mountains and to the hills, to the ravines and to the valleys[b], to the desolate ruins and to the abandoned cities that have become plunder and mockery to the remnant of the nations that are all around:'
translation:
  language: fr
  text: 'C’est pourquoi, montagnes d’Israël, écoutez la parole du Seigneur Yahweh. Ainsi parle le Seigneur Yahweh aux montagnes et aux collines, aux ravins[a] et aux vallées, aux ruines désolées et aux villes abandonnées, qui sont devenues un butin et une risée pour le reste[b] des nations alentour :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux cours d’eau » ou « aux chenaux ».
    reason: lexical_alternative
  - marker: b
    text: Ou « aux survivants des nations ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence de l’oracle précédent, tout en gardant la force logique de la particule hébraïque.
- source_word: הָרֵי יִשְׂרָאֵל
  choice: montagnes d’Israël
  rationale: Conserve l’apostrophe directe et la personnification des reliefs du pays.
- source_word: שִׁמְעוּ
  choice: écoutez
  rationale: Impératif pluriel naturel en français moderne; il exprime ici l’attention obéissante demandée par la proclamation prophétique.
- source_word: דְּבַר אֲדֹנָי יְהוִה
  choice: la parole du Seigneur Yahweh
  rationale: « Parole » maintient la formule prophétique; « Seigneur Yahweh » distingue les deux éléments du titre hébreu אֲדֹנָי יְהוִה.
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique consacrée et idiomatique en français, le présent rendant la proclamation actuelle du message.
- source_word: אֲפִיקִים
  choice: ravins
  rationale: Dans cette énumération topographique, « ravins » est clair et naturel, sans exclure l’idée de lits ou de chenaux où coule l’eau.
- source_word: גֵּאָיוֹת
  choice: vallées
  rationale: Terme topographique large et courant, adapté au parallélisme avec montagnes, collines et ravins.
- source_word: חֳרָבוֹת הַשֹּׁמְמוֹת
  choice: ruines dévastées
  rationale: Rend à la fois les lieux ruinés et leur état de désolation.
- source_word: עָרִים הַנֶּעֱזָבוֹת
  choice: villes abandonnées
  rationale: Expression moderne et directe pour des villes laissées sans habitants ni défense.
- source_word: לְבַז וּלְלַעַג
  choice: la proie et la risée
  rationale: « Proie » exprime ce qui est livré au pillage, tandis que « risée » rend l’objet de moquerie; la paire garde le rythme nominal de l’hébreu.
- source_word: שְׁאֵרִית הַגּוֹיִם אֲשֶׁר מִסָּבִיב
  choice: le reste des nations alentour
  rationale: « Le reste » préserve le sens lexical sans lui imposer ici une valeur sotériologique; « alentour » rend avec concision la situation environnante.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le titre composé contient à la fois אֲדֹנָי, « Seigneur », et le nom propre יהוה. « Seigneur Yahweh » les représente distinctement sans confondre le nom divin avec un nom commun.
- issue: Portée de שְׁאֵרִית appliqué aux nations
  choice: le reste des nations
  alternative: les survivants des nations
  rationale: Le contexte désigne les nations encore présentes autour d’Israël. « Le reste » conserve l’ambiguïté lexicale sans introduire une doctrine particulière du « reste » ni préciser indûment qu’il s’agit de survivants.
translation_notes:
  register: Français international moderne, digne et lisible, avec une cadence prophétique soutenue. L’énumération répétée par « aux » reflète la structure rhétorique hébraïque. Les marqueurs [a] et [b] figurent dans le texte principal.
