source:
  edition: WLC
  text: וָ/אֶעֱשֶׂ֖ה לְמַ֣עַן שְׁמִ֑/י לְ/בִלְתִּ֤י הֵחֵל֙ לְ/עֵינֵ֣י הַ/גּוֹיִ֔ם אֲשֶׁ֥ר הוֹצֵאתִ֖י/ם לְ/עֵינֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/014.yaml
  text: But I acted for the sake of my name[a], so that it would not be profaned in the sight of the nations[b], in whose sight I had brought them out.
translation:
  language: fr
  text: Mais j’ai agi par égard pour mon nom, afin qu’il ne soit pas profané[a] aux yeux des nations, devant lesquelles je les avais fait sortir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Profaner » signifie ici traiter comme dépourvu de sainteté ce qui est saint, et ainsi porter atteinte à son honneur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱשֶׂה
  choice: Mais j’ai agi
  rationale: Le verbe עשה a ici le sens large d’« agir ». « Mais » rend la valeur adversative du ו dans le contexte, où Dieu oppose son action au jugement annoncé auparavant.
- source_word: לְמַעַן שְׁמִי
  choice: par égard pour mon nom
  rationale: Cette tournure française naturelle conserve l’idée que Dieu agit en considération de son nom, c’est-à-dire de l’honneur lié à son identité révélée, sans expliciter davantage que l’hébreu.
- source_word: לְבִלְתִּי הֵחֵל
  choice: afin qu’il ne soit pas profané
  rationale: 'La construction exprime le but préventif. Le pronom renvoie naturellement au « nom » de Dieu, et le passif français rend clairement le sens contextuel de חלל : porter atteinte au caractère saint.'
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: sous les yeux des nations
  rationale: Cette expression idiomatique garde l’image concrète des « yeux » et souligne le caractère public de ce qui se produit.
- source_word: הַגּוֹיִם
  choice: les nations
  rationale: גוים désigne ici les peuples environnants. « Les nations » convient au contexte d’Ézéchiel sans importer le sens religieux plus tardif que pourrait suggérer « les païens ».
- source_word: אֲשֶׁר הוֹצֵאתִים לְעֵינֵיהֶם
  choice: sous les yeux desquelles je les avais fait sortir
  rationale: Le causatif de יצא est rendu par « faire sortir ». Le plus-que-parfait marque l’antériorité de cette action, tandis que la répétition de « sous les yeux » préserve l’insistance hébraïque sur le témoignage public.
theological_decisions:
- issue: Sens de l’action de Dieu « par égard pour mon nom »
  choice: Dieu agit de manière à préserver la sainteté et l’honneur public de son nom parmi les nations.
  alternative: Dieu agirait par simple souci superficiel de réputation.
  rationale: Dans Ézéchiel, le « nom » de Dieu représente son identité révélée et son honneur saint. La traduction maintient l’expression biblique sans la réduire à une question de prestige ni développer une interprétation doctrinale dans le texte.
- issue: Voix de l’expression לְבִלְתִּי הֵחֵל
  choice: 'Rendre le sens contextuel au passif : « afin qu’il ne soit pas profané ».'
  alternative: 'Traduire activement : « afin de ne pas profaner mon nom ».'
  rationale: La forme hébraïque peut susciter une traduction active, mais le contexte vise la profanation publique du nom divin parmi les nations. Le passif conserve cette orientation sans attribuer explicitement à Dieu l’acte de profaner son propre nom.
translation_notes:
  register: 'Français international moderne, digne et accessible. La répétition « sous les yeux… sous les yeux desquelles » est volontaire : elle reproduit l’insistance de l’hébreu sur le caractère visible et public de l’action divine.'
