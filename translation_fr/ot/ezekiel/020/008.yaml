revisions:
- from: Mais ils se sont rebellés contre moi et ont refusé de m’écouter. Aucun d’eux n’a rejeté les choses abominables qu’il avait sous les yeux[a] ni abandonné les idoles[b] d’Égypte. Alors j’ai dit que je déverserais ma fureur sur eux et que j’irais jusqu’au bout de ma colère contre eux, au cœur de l’Égypte.
  to: Mais ils se sont rebellés contre moi et ont refusé de m’écouter. Aucun d’eux n’a rejeté les choses abominables qu’il avait sous les yeux[a] ni abandonné les idoles[b] d’Égypte. Alors j’ai dit que je déverserais ma fureur sur eux, pour déployer jusqu’au bout ma colère contre eux, au milieu du pays d’Égypte.
  rationale: La révision conserve le sens et les notes du projet, tout en rendant plus explicitement la localisation interne en Égypte et l’idée que la colère divine devait être menée à son plein accomplissement contre eux.
