  source_fidelity: La traduction rend fidèlement la rébellion, le refus volontaire, le rejet des objets idolâtres, l’abandon des idoles d’Égypte et la double expression de la colère divine. « Au cœur de l’Égypte » atténue toutefois légèrement la localisation concrète de בְּתוֹךְ אֶרֶץ מִצְרָיִם (« au milieu du pays d’Égypte »).
  naturalness: Le français est moderne et généralement fluide. La formulation « j’irais jusqu’au bout de ma colère » est compréhensible, mais moins idiomatique et un peu moins précise pour l’idée de mener la colère à son plein accomplissement contre eux.
  terminology: « Se rebeller », « choses abominables », « idoles », « fureur » et « colère » sont appropriés. Les deux notes rendent correctement l’ambiguïté de l’expression relative aux yeux et la nuance péjorative de גִּלּוּלִים.
