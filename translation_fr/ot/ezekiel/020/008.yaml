  - severity: low
    issue: Expression de לְכַלּוֹת אַפִּי בָּהֶם
    rationale: « Aller jusqu’au bout de ma colère » est un peu elliptique en français. « Déployer jusqu’au bout ma colère contre eux » exprime plus nettement l’accomplissement complet de cette colère dirigée contre eux.
