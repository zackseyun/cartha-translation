source:
  edition: WLC
  text: וַ/יַּמְרוּ בִ֗/י וְ/לֹ֤א אָבוּ֙ לִּ/שְׁמֹ֣עַ אֵלַ֔/י אִ֣ישׁ אֶת שִׁקּוּצֵ֤י עֵֽינֵי/הֶם֙ לֹ֣א הִשְׁלִ֔יכוּ וְ/אֶת גִּלּוּלֵ֥י מִצְרַ֖יִם לֹ֣א עָזָ֑בוּ וָ/אֹמַ֞ר לִ/שְׁפֹּ֧ךְ חֲמָתִ֣/י עֲלֵי/הֶ֗ם לְ/כַלּ֤וֹת אַפִּ/י֙ בָּ/הֶ֔ם בְּ/ת֖וֹךְ אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/008.yaml
  text: But they rebelled against me and refused to listen to me. None of them cast away the detestable things before their eyes[a] or abandoned the idols[b] of Egypt. So I said that I would pour out my wrath on them, bringing my anger against them to its full measure in the midst of the land of Egypt.
translation:
  language: fr
  text: Mais ils se sont rebellés contre moi et ont refusé de m’écouter. Aucun d’eux n’a rejeté les choses abominables qu’il avait sous les yeux[a] ni abandonné les idoles[b] d’Égypte. Alors j’ai dit que je déverserais ma fureur sur eux, pour déployer jusqu’au bout ma colère contre eux, au milieu du pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « les choses abominables de leurs yeux ». L’hébreu peut désigner les objets abominables qu’ils avaient sous les yeux et peut aussi suggérer qu’ils y attachaient idolâtrement leur regard.
    reason: alternative_reading
  - marker: b
    text: Le mot hébreu traduit par « idoles » est volontairement méprisant et évoque quelque chose de répugnant ou d’immonde.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְרוּ בִי
  choice: ils se sont rebellés contre moi
  rationale: מרה avec ב exprime une rébellion dirigée contre quelqu’un. Cette formulation est directe, naturelle et conserve la force de la désobéissance.
- source_word: וְלֹא אָבוּ לִשְׁמֹעַ אֵלַי
  choice: ont refusé de m’écouter
  rationale: La tournure volitive négative indique un refus délibéré, et non une simple incapacité à entendre.
- source_word: אִישׁ
  choice: Aucun d’eux
  rationale: Le singulier distributif signifie qu’aucun membre du groupe ne s’est conformé à l’ordre. La formulation française exprime clairement cette portée sans introduire une restriction masculine absente du sens contextuel.
- source_word: שִׁקּוּצֵי עֵינֵיהֶם
  choice: les choses abominables qu’il avait sous les yeux
  rationale: Le construit hébreu est difficile et peut désigner les objets abominables placés devant leurs yeux, tout en suggérant l’attachement idolâtre du regard. Le texte principal reste concret et la note conserve l’ambiguïté.
- source_word: הִשְׁלִיכוּ
  choice: a rejeté
  rationale: Le verbe signifie littéralement jeter, mais dans ce contexte il s’agit de se débarrasser résolument de ces objets; « rejeter » est naturel et suffisamment énergique.
- source_word: גִּלּוּלֵי מִצְרַיִם
  choice: les idoles d’Égypte
  rationale: גִּלּוּלִים est un terme volontairement méprisant pour les idoles. « Idoles » assure la clarté dans le texte, tandis qu’une note signale sa coloration dépréciative.
- source_word: עָזָבוּ
  choice: abandonné
  rationale: עזב signifie ici délaisser ou renoncer à. « Abandonner » convient naturellement à la rupture exigée avec l’idolâtrie.
- source_word: וָאֹמַר
  choice: Alors j’ai dit que je déverserais
  rationale: Le waw consécutif fait avancer le récit et introduit la résolution divine sans exiger que l’on précise s’il s’agit de paroles prononcées ou intérieures.
- source_word: לִשְׁפֹּךְ חֲמָתִי עֲלֵיהֶם
  choice: déverserais ma fureur sur eux
  rationale: L’image du déversement est conservée. « Fureur » rend la forte intensité de חֵמָה et permet de distinguer ce terme de אַף dans la proposition suivante.
- source_word: לְכַלּוֹת אַפִּי בָּהֶם
  choice: j’irais jusqu’au bout de ma colère contre eux
  rationale: כלה présente ici la colère comme menée à son terme contre ses objets. Cette tournure française exprime l’accomplissement complet du jugement sans réduire le langage à un simple défoulement émotionnel.
- source_word: בְּתוֹךְ אֶרֶץ מִצְרָיִם
  choice: au cœur de l’Égypte
  rationale: La formulation conserve la valeur de בְּתוֹךְ, « au milieu de, à l’intérieur de », dans un français actuel et fluide; « Égypte » suffit naturellement à rendre le nom du pays.
theological_decisions:
- issue: Langage anthropopathique du jugement divin
  choice: Conserver « fureur » et « colère » comme deux expressions proches mais distinctes de la réaction judiciaire de Dieu
  alternative: Uniformiser les deux termes par « colère », ou les atténuer en « châtiment » ou « jugement »
  rationale: L’hébreu juxtapose חֵמָה et אַף pour produire une intensification rhétorique. Les conserver sans les systématiser respecte la vigueur du texte et sa représentation de l’opposition divine à l’idolâtrie.
- issue: Portée représentative de אִישׁ
  choice: Rendre le singulier distributif par « Aucun d’eux »
  alternative: « Pas un homme » ou « pas un seul »
  rationale: Dans le contexte, אִישׁ distribue la négation à chacun des membres du groupe. « Aucun d’eux » transmet exactement cette portée en français moderne sans faire du sexe masculin un élément sémantique du verset.
- issue: Ambiguïté de la relation entre les yeux et les objets abominables
  choice: Employer « qu’il avait sous les yeux » et expliciter l’autre nuance en note
  alternative: Traduire directement « sur lesquelles leurs yeux se fixaient »
  rationale: Le génitif hébreu peut évoquer les objets présents devant les yeux ou ceux vers lesquels le regard idolâtre se porte. Le texte ne permet pas d’imposer exclusivement la seconde lecture.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme garde la progression rébellion–idolâtrie–jugement. « Au cœur de l’Égypte » évite la lourdeur de « au milieu du pays d’Égypte » tout en conservant la localisation interne exprimée par l’hébreu.
