source:
  edition: WLC
  text: וְ/הוֹצֵאתִ֤י אֶתְ/כֶם֙ מִן הָ֣/עַמִּ֔ים וְ/קִבַּצְתִּ֣י אֶתְ/כֶ֔ם מִן הָ֣/אֲרָצ֔וֹת אֲשֶׁ֥ר נְפוֹצֹתֶ֖ם בָּ֑/ם בְּ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בְ/חֵמָ֖ה שְׁפוּכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/034.yaml
  text: I will bring you out from the peoples and gather you from the lands where you have been scattered[c][b][a], with a strong hand and an outstretched arm and with wrath poured out.
translation:
  language: fr
  text: Je vous ferai sortir du milieu des peuples et je vous rassemblerai des pays où vous avez été dispersés, avec une main forte[a], un bras étendu et une colère déversée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Formulation biblique traditionnelle : « d’une main puissante et le bras étendu ».'
    reason: cross_reference
  - marker: b
    text: 'Ou : « une fureur déversée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתִי
  choice: Je vous ferai sortir
  rationale: Le hiphil de יצא exprime l’action de faire sortir. Cette formulation naturelle conserve l’écho de l’exode.
- source_word: הָעַמִּים
  choice: les peuples
  rationale: Le pluriel désigne les groupes humains parmi lesquels Israël a été dispersé. « Peuples » préserve le parallélisme avec les « pays ».
- source_word: וְקִבַּצְתִּי
  choice: je vous rassemblerai
  rationale: קבץ est le verbe courant du rassemblement des exilés; « rassembler » est idiomatique et précis.
- source_word: הָאֲרָצוֹת
  choice: les pays
  rationale: Dans ce contexte, le terme désigne les différents territoires de la dispersion; « pays » est plus naturel en français actuel que « terres ».
- source_word: אֲשֶׁר נְפוֹצֹתֶם בָּם
  choice: où vous avez été dispersés
  rationale: Le niphal de פוץ est passif. Le passé composé exprime naturellement une dispersion antérieure dont la situation demeure pertinente.
- source_word: בְּיָד חֲזָקָה
  choice: d’une main forte
  rationale: Traduction proche de l’hébreu qui conserve la formule et l’imagerie de l’exode.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: le bras étendu
  rationale: Formule biblique consacrée exprimant une intervention divine manifeste et décisive; l’absence de répétition de « avec » donne une coordination française naturelle.
- source_word: וּבְחֵמָה שְׁפוּכָה
  choice: en déversant ma fureur
  rationale: חֵמָה peut désigner la fureur ou la colère ardente, et שְׁפוּכָה signifie « déversée ». La tournure verbale est naturelle en français et explicite que cette fureur est celle du locuteur divin.
theological_decisions:
- issue: Imagerie de l’exode dans un contexte mêlant rassemblement et jugement
  choice: Conserver « d’une main forte, le bras étendu » tout en maintenant l’image de la fureur déversée.
  alternative: Présenter le rassemblement comme une délivrance uniquement bienveillante, ou au contraire comme un acte purement punitif.
  rationale: Le verset reprend délibérément le langage de l’exode, mais Ézéchiel 20 associe le rassemblement à l’action judiciaire de Dieu. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure proche de la structure hébraïque sans être artificielle; les images de la main, du bras et de la fureur déversée sont conservées.
