revisions:
- from: Je vous ferai sortir du milieu des peuples et je vous rassemblerai des pays où vous avez été dispersés, d’une main forte[a], le bras étendu, et en déversant ma fureur[b].
  to: Je vous ferai sortir du milieu des peuples et je vous rassemblerai des pays où vous avez été dispersés, avec une main forte[a], un bras étendu et une colère déversée[b].
  rationale: La révision rétablit le parallélisme instrumental de l’hébreu et conserve la forme nominale passive de « colère déversée », sans expliciter indûment un possessif ou une action verbale. Elle maintient l’écho de l’exode et la dimension judiciaire du verset.
