source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֗ית בַּֽ/חֲמִשִׁי֙ בֶּ/עָשׂ֣וֹר לַ/חֹ֔דֶשׁ בָּ֧אוּ אֲנָשִׁ֛ים מִ/זִּקְנֵ֥י יִשְׂרָאֵ֖ל לִ/דְרֹ֣שׁ אֶת יְהוָ֑ה וַ/יֵּשְׁב֖וּ לְ/פָנָֽ/י׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/001.yaml
  text: And it happened in the seventh year[a], in the fifth month, on the tenth day of the month, that some of the elders of Israel came to inquire of Yahweh[b], and they sat before me.
translation:
  language: fr
  text: La septième année, au cinquième mois, le dixième jour du mois, quelques-uns des anciens d’Israël vinrent consulter Yahweh[a] et s’assirent devant moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Consulter Yahweh » peut aussi se traduire par « chercher Yahweh » ou « interroger Yahweh »; dans ce contexte, il s’agit de solliciter officiellement de lui une réponse ou une indication.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: La septième année…
  rationale: La formule narrative hébraïque ouvre ici un nouvel épisode daté. En français moderne, commencer directement par la date est plus naturel que « Et il arriva », sans perdre la fonction introductive.
- source_word: בַּשָּׁנָה הַשְּׁבִיעִית
  choice: La septième année
  rationale: Le verset ne précise pas à partir de quel événement l’année est comptée; cette donnée n’est donc pas ajoutée.
- source_word: בַּחֲמִשִׁי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: au cinquième mois, le dixième jour du mois
  rationale: Cette formulation conserve la structure solennelle de la date hébraïque tout en restant idiomatique en français.
- source_word: בָּאוּ אֲנָשִׁים מִזִּקְנֵי יִשְׂרָאֵל
  choice: quelques-uns des anciens d’Israël vinrent
  rationale: Littéralement, « des hommes d’entre les anciens d’Israël »; l’expression désigne naturellement certains membres ou représentants du groupe. « Quelques-uns des anciens » rend ce sens sans lourdeur.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: consulter Yahweh
  rationale: Dans cette scène, דרש désigne la recherche formelle d’une réponse ou d’une direction divine. « Consulter » exprime clairement cette démarche auprès du prophète.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte source et à la convention du projet.
- source_word: וַיֵּשְׁבוּ לְפָנַי
  choice: et s’assirent devant moi
  rationale: Rendu direct de leur posture physique dans la présence d’Ézéchiel; « devant moi » garde également la nuance d’une audience formelle.
theological_decisions:
- issue: Référence chronologique de « la septième année »
  choice: Ne pas préciser le point de départ du décompte
  alternative: « la septième année de l’exil du roi Yoyakîn »
  rationale: Le cadre de l’exil est vraisemblablement sous-entendu dans le livre, mais il n’est pas formulé dans ce verset. L’ajouter au texte principal résoudrait une information implicite.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: « le SEIGNEUR » ou « Jéhovah »
  rationale: Le texte emploie le tétragramme comme nom propre. « Yahweh » le représente directement sans lui substituer un titre.
- issue: Portée de אֲנָשִׁים מִזִּקְנֵי יִשְׂרָאֵל
  choice: « quelques-uns des anciens d’Israël »
  alternative: « des hommes d’entre les anciens d’Israël »
  rationale: Le français naturel indique qu’il s’agit d’une partie ou de représentants des anciens, tout en évitant de suggérer que leur collège entier était présent.
translation_notes:
  register: Français international moderne, digne et narratif. L’ordre formel de la date est conservé; les tournures archaïques telles que « il advint » sont évitées. Le seul appel de note [a] figure bien dans le texte principal.
