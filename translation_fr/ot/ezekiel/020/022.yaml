base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/022.yaml
  text: But I held back my hand[a], and I acted for the sake of my name, so that it would not be profaned in the sight of the nations[b], before whose eyes I had brought them out.
translation:
  language: fr
  text: Mais j’ai retenu ma main[a] et j’ai agi par égard pour mon nom, afin qu’il ne soit pas profané aux yeux des nations[b], sous les yeux desquelles je les avais fait sortir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’ai fait revenir ma main » ou « j’ai retiré ma main ». L’expression hébraïque indique ici que Dieu s’est retenu d’exécuter le jugement.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu laisse le complément sous-entendu ; il renvoie à « mon nom ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁבֹתִי אֶת־יָדִי
  choice: j’ai retenu ma main
  rationale: L’expression signifie littéralement faire revenir sa main et, dans ce contexte, renoncer à exécuter le jugement annoncé. « Retenir sa main » conserve l’image tout en exprimant clairement la retenue.
- source_word: וָאַעַשׂ
  choice: j’ai agi
  rationale: Le verbe עשה a ici le sens général d’agir ou de faire. Cette formulation reste concise sans préciser indûment la nature de l’action.
- source_word: לְמַעַן שְׁמִי
  choice: par égard pour mon nom
  rationale: Cette tournure naturelle en français conserve « mon nom » et exprime que Dieu agit en considération de l’honneur public attaché à son nom.
- source_word: לְבִלְתִּי הֵחֵל
  choice: afin qu’il ne soit pas profané
  rationale: Le verbe exprime la profanation. Le pronom renvoie au « nom » mentionné juste avant; le passif français rend naturellement le but sans imposer explicitement l’agent de la profanation.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: aux yeux des nations
  rationale: Cette expression française reproduit l’image hébraïque et souligne le caractère public de la profanation envisagée.
- source_word: אֲשֶׁר הוֹצֵאתִי אוֹתָם
  choice: je les avais fait sortir
  rationale: Le hiphil de יצא signifie « faire sortir ». Le plus-que-parfait marque naturellement l’antériorité de cette délivrance.
- source_word: לְעֵינֵיהֶם
  choice: sous les yeux desquelles
  rationale: La formulation maintient la répétition intentionnelle du motif des yeux et indique que les nations avaient été témoins de la sortie.
theological_decisions:
- issue: La retenue divine après l’annonce du jugement
  choice: Dieu retient sa main et agit par égard pour son nom.
  alternative: Dieu fait revenir ou retire sa main.
  rationale: « Retenir sa main » conserve la métaphore hébraïque tout en montrant qu’il s’agit de ne pas exécuter le jugement annoncé, sans ajouter d’explication doctrinale.
- issue: Le sens de « mon nom »
  choice: Conserver l’expression biblique « mon nom ».
  alternative: Paraphraser par « mon honneur » ou « ma réputation ».
  rationale: Le texte nomme explicitement le nom de Dieu. Le conserver maintient sa portée théologique et le contexte des nations en éclaire la dimension publique.
- issue: L’agent de la profanation
  choice: 'Employer le passif : « afin qu’il ne soit pas profané ».'
  alternative: 'Traduire plus littéralement : « afin de ne pas le profaner ».'
  rationale: L’infinitif hébreu peut se rendre activement, mais son objet est sous-entendu. Le passif français explicite le renvoi au nom sans affirmer de façon trop tranchée qui en serait l’agent, préservant ainsi la tension du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « aux yeux… sous les yeux » est volontaire afin de préserver le motif hébraïque, malgré une légère lourdeur stylistique.
