  text: וּ/בִ/שְׂאֵ֣ת מַתְּנֹֽתֵי/כֶ֡ם בְּֽ/הַעֲבִיר֩ בְּנֵי/כֶ֨ם בָּ/אֵ֜שׁ אַתֶּם֩ נִטְמְאִ֤֨ים לְ/כָל גִּלּֽוּלֵי/כֶם֙ עַד הַ/יּ֔וֹם וַ/אֲנִ֛י אִדָּרֵ֥שׁ לָ/כֶ֖ם בֵּ֣ית יִשְׂרָאֵ֑ל חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה אִם אִדָּרֵ֖שׁ לָ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/031.yaml
  text: And when you present your gifts[a], when you make your sons pass through the fire, you defile yourselves with all your idols to this day. And shall I be inquired of by you, O house of Israel? As I live, declares the Lord GOD[c][b], I will not be inquired of by you.
translation:
  language: fr
  text: En présentant vos dons, en faisant passer vos fils par le feu[a], vous vous souillez avec toutes vos idoles, jusqu’à ce jour. Et moi, me laisserais-je consulter par vous, maison d’Israël ? Aussi vrai que je suis vivant — déclaration du Seigneur Yahweh —, je ne me laisserai pas consulter par vous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Faire passer ses fils par le feu désigne ici leur sacrifice dans le cadre d’un culte idolâtre.
    reason: cultural_note
  - marker: b
    text: 'L’hébreu emploie littéralement « si » dans une formule de serment elliptique qui exprime ici une négation catégorique : « je ne me laisserai certainement pas consulter par vous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׂאֵת מַתְּנֹתֵיכֶם
  choice: En présentant vos dons
  rationale: « Présenter » exprime naturellement l’action cultuelle de נשׂא avec מַתָּנוֹת, tandis que « dons » conserve le sens lexical direct sans exclure celui d’offrandes.
- source_word: בְּהַעֲבִיר בְּנֵיכֶם בָּאֵשׁ
  choice: en faisant passer vos fils par le feu
  rationale: Cette formulation préserve l’expression hébraïque et son masculin explicite, sans préciser au-delà du texte le déroulement du sacrifice.
- source_word: אַתֶּם נִטְמְאִים
  choice: vous vous rendez impurs
  rationale: Le niphal décrit l’état d’impureté qui résulte de leurs propres actes; cette tournure française rend à la fois le résultat et leur responsabilité.
- source_word: לְכָל גִּלּוּלֵיכֶם
  choice: par toutes vos idoles
  rationale: « Idoles » rend le terme fortement péjoratif propre à Ézéchiel; « par » indique ici le moyen de la souillure.
- source_word: וַאֲנִי אִדָּרֵשׁ לָכֶם
  choice: Et moi, me laisserais-je consulter par vous
  rationale: Le niphal de דרשׁ évoque le fait que Dieu se laisse rechercher ou consulter pour recevoir une réponse; la question rhétorique est maintenue.
- source_word: בֵּית יִשְׂרָאֵל
  choice: communauté d’Israël
  rationale: Dans l’adresse prophétique, בֵּית désigne collectivement le peuple d’Israël plutôt qu’un bâtiment ou une maisonnée particulière; « communauté » est clair en français actuel.
- source_word: חַי אָנִי
  choice: Aussi vrai que je suis vivant
  rationale: Formule française solennelle et naturelle qui conserve la force du serment divin.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: « Déclaration » rend la formule prophétique נְאֻם, et « Yahweh » représente directement le nom divin יהוה après אֲדֹנָי.
- source_word: אִם אִדָּרֵשׁ לָכֶם
  choice: je ne me laisserai pas consulter par vous
  rationale: Dans la formule de serment, אִם introduit elliptiquement une négation emphatique; une traduction littérale par « si » serait trompeuse en français.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le choix garde distincts le titre אֲדֹנָי et le nom propre יהוה, sans remplacer ce dernier par un titre.
- issue: Genre de בְּנֵיכֶם
  choice: vos fils
  alternative: vos enfants
  rationale: L’hébreu emploie explicitement le masculin pluriel « fils »; le texte ne justifie pas de le généraliser silencieusement.
- issue: Force de אִם dans le serment final
  choice: 'négation emphatique : « je ne me laisserai pas consulter »'
  alternative: 'condition littérale : « si je me laisse consulter »'
  rationale: Après חַי אָנִי, la proposition avec אִם est une formule de serment elliptique exprimant un refus catégorique; la traduction explicite sa valeur pragmatique sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international actuel, digne et prophétique. La syntaxe conserve la progression accusatrice, la question rhétorique et le serment solennel, tout en évitant des tours inutilement archaïques.
