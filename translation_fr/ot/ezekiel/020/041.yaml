base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/041.yaml
  text: I will accept you like a pleasing aroma when I bring you out from the peoples and gather you from the lands where you have been scattered, and I will show myself holy through you before the eyes of the nations.
translation:
  language: fr
  text: Je vous accueillerai comme un parfum agréable lorsque je vous ferai sortir du milieu des peuples et que je vous rassemblerai des pays où vous avez été dispersés. Je manifesterai ma sainteté en vous[a], sous les yeux des nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi vous » ; la préposition hébraïque peut aussi, selon le contexte, suggérer que Dieu manifeste sa sainteté par son action en faveur de son peuple.
    reason: Préserve l’ambiguïté de בָכֶם sans imposer exclusivement le sens instrumental (« par vous »).
lexical_decisions:
- source_word: בְּרֵיחַ נִיחֹחַ אֶרְצֶה אֶתְכֶם
  choice: Je vous accueillerai comme un parfum agréable
  rationale: רֵיחַ נִיחֹחַ désigne un parfum plaisant, souvent dans un cadre sacrificiel. « Comme » exprime naturellement en français la valeur circonstancielle de בְּ et évite de faire des personnes elles-mêmes un parfum au sens littéral. « Accueillir » rend ici רצה, qui signifie recevoir avec faveur ou agréer.
- source_word: בְּהוֹצִיאִי אֶתְכֶם
  choice: lorsque je vous ferai sortir
  rationale: L’infinitif construit avec suffixe et préposition בְּ a ici une valeur temporelle. La tournure causative du hifil est conservée par « ferai sortir ».
- source_word: וְנִקְדַּשְׁתִּי בָכֶם
  choice: Par vous, je manifesterai ma sainteté
  rationale: Le nifal de קדש peut exprimer le fait d’être reconnu ou manifesté comme saint. בָכֶם se comprend naturellement comme le moyen par lequel Dieu manifeste sa sainteté; « par vous » préserve cette relation sans suggérer que Dieu acquiert la sainteté.
theological_decisions:
- issue: Sens de וְנִקְדַּשְׁתִּי בָכֶם
  choice: Par vous, je manifesterai ma sainteté
  alternative: Je serai reconnu comme saint parmi vous / en vous
  rationale: La préposition בְּ permet plusieurs nuances. Le contexte, notamment « sous les yeux des nations », favorise l’idée que l’action de Dieu envers Israël donnera publiquement à voir sa sainteté. La traduction conserve l’initiative divine et la portée publique sans imposer une doctrine particulière.
- issue: Imagerie sacrificielle de רֵיחַ נִיחֹחַ
  choice: comme un parfum agréable
  alternative: comme une odeur apaisante / avec un parfum agréable
  rationale: L’expression traditionnelle évoque l’acceptation favorable d’une offrande. « Parfum agréable » garde l’image cultuelle tout en restant naturel et digne en français moderne; elle n’explicite pas davantage le mécanisme théologique.
translation_notes:
  register: Français international moderne, clair et solennel. La phrase est divisée en deux pour faciliter la lecture, sans modifier la progression logique. « Du milieu des peuples » distingue les populations des « pays » géographiques.
