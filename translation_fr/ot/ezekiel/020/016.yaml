id: EZK.20.16
reference: Ezekiel 20:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יַ֜עַן בְּ/מִשְׁפָּטַ֣/י מָאָ֗סוּ וְ/אֶת חֻקּוֹתַ/י֙ לֹא הָלְכ֣וּ בָ/הֶ֔ם וְ/אֶת שַׁבְּתוֹתַ֖/י חִלֵּ֑לוּ כִּ֛י אַחֲרֵ֥י גִלּוּלֵי/הֶ֖ם לִבָּ֥/ם הֹלֵֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/016.yaml
  text: because they rejected my judgments[a], and did not walk in my statutes, and profaned my Sabbaths; for their heart went after their idols.
translation:
  language: fr
  text: parce qu’ils ont rejeté mes règles, n’ont pas suivi mes prescriptions et ont profané mes sabbats, car leur cœur suivait leurs idoles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « idoles » est fortement méprisant et peut évoquer quelque chose de répugnant ou des excréments.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: parce que
  rationale: Introduit naturellement en français la cause du jugement énoncé dans le contexte.
- source_word: מִשְׁפָּטַי
  choice: mes règles
  rationale: Rend le sens juridique de מִשְׁפָּט dans une langue actuelle, tout en restant distinct de חֻקּוֹתַי.
- source_word: מָאָסוּ
  choice: ont rejeté
  rationale: Exprime un refus actif sans ajouter nécessairement la nuance affective de « mépriser ».
- source_word: חֻקּוֹתַי
  choice: mes prescriptions
  rationale: Terme naturel pour des dispositions établies, distinct de « mes règles » dans la proposition précédente.
- source_word: לֹא הָלְכוּ בָהֶם
  choice: n’ont pas suivi mes prescriptions
  rationale: Rend en français courant l’image hébraïque de marcher selon des prescriptions, sans obscurcir le sens comportemental.
- source_word: שַׁבְּתוֹתַי
  choice: mes sabbats
  rationale: Conserve explicitement le pluriel hébreu et le terme biblique reconnu.
- source_word: חִלֵּלוּ
  choice: ont profané
  rationale: Exprime le fait de traiter comme profane ce qui est consacré.
- source_word: אַחֲרֵי גִלּוּלֵיהֶם
  choice: suivait leurs idoles
  rationale: Avec le verbe « aller », אַחֲרֵי exprime l’idée de suivre; cette formulation française en conserve clairement l’image.
- source_word: גִלּוּלֵיהֶם
  choice: leurs idoles
  rationale: Le texte principal emploie le terme français courant; la nuance fortement méprisante du mot hébreu est signalée en note.
- source_word: לִבָּם הֹלֵךְ
  choice: leur cœur suivait
  rationale: Conserve le singulier collectif « leur cœur » et la métaphore qui situe leur inclination idolâtre au centre de leur être; l’imparfait rend la valeur durative du participe.
theological_decisions:
- issue: Distinction entre les termes de la loi d’alliance מִשְׁפָּטַי et חֻקּוֹתַי
  choice: mes règles / mes prescriptions
  alternative: rendre les deux termes par « mes lois » ou « mes commandements »
  rationale: Deux termes français distincts préservent la variété juridique du texte hébreu sans imposer une distinction technique plus précise que le contexte.
- issue: Métaphore anthropologique de לִבָּם הֹלֵךְ
  choice: leur cœur suivait leurs idoles
  alternative: ils étaient attachés à leurs idoles
  rationale: La formulation retenue garde le cœur comme centre de l’inclination morale et spirituelle, ainsi que le mouvement figuré vers les idoles, sans réduire l’énoncé à un simple comportement extérieur.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe demeure celle d’une proposition causale liée au contexte précédent. Le marqueur de note est placé après « idoles », le mot auquel la note se rapporte.
