  text: אֲנִי֙ יְהוָ֣ה אֱלֹהֵי/כֶ֔ם בְּ/חֻקּוֹתַ֖/י לֵ֑כוּ וְ/אֶת מִשְׁפָּטַ֥/י שִׁמְר֖וּ וַ/עֲשׂ֥וּ אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/019.yaml
  text: I am Yahweh your God; walk in my statutes[a], and keep my judgments and do them.
translation:
  language: fr
  text: Moi, je suis Yahweh, votre Dieu. Suivez mes prescriptions, respectez mes règles et mettez-les en pratique.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Moi, je suis Yahweh, votre Dieu
  rationale: Le pronom indépendant אֲנִי porte une emphase rendue naturellement par « Moi, je ». Le tétragramme est translittéré « Yahweh », et אֱלֹהֵיכֶם désigne ici le Dieu d’Israël avec le suffixe pluriel « votre ».
- source_word: בְּחֻקּוֹתַי לֵכוּ
  choice: Suivez mes prescriptions
  rationale: L’expression formée avec הלך et בְּחֻקּוֹתַי concerne la conduite réglée par les prescriptions divines. « Suivez » restitue en français actuel l’image conventionnelle de « marcher selon », sans suggérer un déplacement physique.
- source_word: מִשְׁפָּטַי
  choice: mes règles
  rationale: Dans ce contexte juridique et covenantal, מִשְׁפָּטִים désigne les règles ou décisions normatives de Dieu. « Règles » est clair en français moderne et reste distinct de חֻקּוֹת, rendu par « prescriptions ».
- source_word: שִׁמְרוּ
  choice: respectez
  rationale: Dans un cadre légal, שׁמר signifie observer fidèlement. « Respectez » est naturel et évite l’ambiguïté du calque « gardez ».
- source_word: וַעֲשׂוּ אוֹתָם
  choice: et mettez-les en pratique
  rationale: La formule souligne l’exécution concrète des commandements. « Mettez-les en pratique » exprime idiomatiquement en français le sens direct de « faites-les ».
theological_decisions:
- issue: Rendu du nom d’alliance יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte hébreu emploie explicitement le tétragramme. La translittération « Yahweh » conserve le nom personnel plutôt que de lui substituer un titre.
- issue: Rapport entre l’observation et la mise en pratique
  choice: respectez mes règles et mettez-les en pratique
  alternative: gardez mes jugements et faites-les
  rationale: Les deux impératifs hébreux sont maintenus afin de préserver l’insistance sur l’observance fidèle et l’exécution concrète, sans les fusionner.
translation_notes:
  register: Français international moderne, digne et accessible. La structure impérative et la répétition sémantique de l’hébreu sont conservées, avec des formulations idiomatiques plutôt que des calques opaques.
