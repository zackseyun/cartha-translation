id: EZK.20.35
reference: Ezekiel 20:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הֵבֵאתִ֣י אֶתְ/כֶ֔ם אֶל מִדְבַּ֖ר הָֽ/עַמִּ֑ים וְ/נִשְׁפַּטְתִּ֤י אִתְּ/כֶם֙ שָׁ֔ם פָּנִ֖ים אֶל פָּנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/035.yaml
  text: I will bring you into the wilderness of the peoples[b][a], and there I will enter into judgment with you face to face.
translation:
  language: fr
  text: Je vous conduirai dans le désert des peuples[a] et, là, j’entrerai en jugement avec vous, face à face[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « désert des peuples » peut désigner un lieu comparable à un désert, parmi les peuples où Israël avait été dispersé.
    reason: cultural_note
  - marker: b
    text: 'Autre traduction : « là, je vous jugerai face à face ». Le verbe hébreu peut se traduire simplement par « juger », mais sa construction évoque aussi l’entrée dans une confrontation judiciaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: Je vous conduirai
  rationale: Le hifil de בוא signifie faire venir ou amener. « Conduire » rend naturellement en français l’action souveraine de mener les destinataires jusqu’au lieu indiqué, sans ajouter l’idée d’un accompagnement bienveillant.
- source_word: אֶל מִדְבַּר הָעַמִּים
  choice: dans le désert des peuples
  rationale: אֶל marque ici le mouvement vers l’intérieur d’un lieu. מִדְבָּר désigne un espace inculte ou désertique, et « désert » conserve en français l’écho de l’Exode. « Des peuples » traduit formellement le pluriel הָעַמִּים sans le réduire nécessairement à des États-nations.
- source_word: וְנִשְׁפַּטְתִּי אִתְּכֶם
  choice: j’entrerai en jugement avec vous
  rationale: Le nifal de שׁפט construit avec אֵת exprime ici une confrontation judiciaire. Cette formulation préserve la nuance de procédure ou de litige, plutôt que de ne rendre que le verdict par « je vous jugerai ».
- source_word: שָׁם
  choice: là
  rationale: L’adverbe renvoie directement au désert des peuples qui vient d’être mentionné.
- source_word: פָּנִים אֶל פָּנִים
  choice: face à face
  rationale: La locution est rendue littéralement et naturellement; elle souligne le caractère direct et personnel de la confrontation.
theological_decisions:
- issue: Nuance judiciaire de l’action divine
  choice: j’entrerai en jugement avec vous
  alternative: je vous jugerai
  rationale: La construction hébraïque évoque une confrontation judiciaire directe, et non seulement l’énoncé unilatéral d’une sentence. La traduction conserve ainsi la tension solennelle du procès d’alliance sans imposer une technicité juridique excessive.
translation_notes:
  register: Français international moderne, digne et accessible. La structure hébraïque est conservée lorsque le français reste naturel. « Désert » maintient la résonance biblique de l’Exode; « entrer en jugement avec » garde l’ambiguïté entre jugement et confrontation judiciaire.
