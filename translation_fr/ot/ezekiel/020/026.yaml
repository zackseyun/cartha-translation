  text: וָ/אֲטַמֵּ֤א אוֹתָ/ם֙ בְּ/מַתְּנוֹתָ֔/ם בְּ/הַעֲבִ֖יר כָּל פֶּ֣טֶר רָ֑חַם לְמַ֣עַן אֲשִׁמֵּ֔/ם לְמַ֨עַן֙ אֲשֶׁ֣ר יֵֽדְע֔וּ אֲשֶׁ֖ר אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/026.yaml
  text: And I defiled them through their gifts[a], by making every firstborn pass through the fire, so that I might devastate them[d][c][b], so that they might know that I am Yahweh.
translation:
  language: fr
  text: Je les ai rendus impurs par leurs offrandes[a], en faisant passer tous les premiers-nés[b], afin de les dévaster[c], afin qu’ils sachent que je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leurs dons ». Dans ce contexte, il s’agit de dons cultuels, donc d’offrandes.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tout ce qui ouvre le sein maternel », expression hébraïque désignant tout premier-né. L’expression « faire passer » renvoie probablement à un rite lié au sacrifice d’enfants ; le feu n’est toutefois pas mentionné dans ce verset.'
    reason: cultural_note
  - marker: c
    text: 'Ou : « afin de les frapper de stupeur » ou « afin de les rendre désolés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲטַמֵּא
  choice: Je les ai rendus impurs
  rationale: Le hiphil de טמא exprime ici l’action causative de rendre impur. Cette formulation conserve la portée cultuelle et morale ainsi que l’affirmation directe de l’action divine.
- source_word: בְּמַתְּנוֹתָם
  choice: par leurs offrandes
  rationale: מַתָּנוֹת signifie littéralement « dons », mais désigne ici des dons cultuels. « Offrandes » rend naturellement ce sens en français, tandis que la préposition « par » conserve la valeur instrumentale de בְּ.
- source_word: בְּהַעֲבִיר
  choice: en faisant passer
  rationale: L’infinitif hiphil exprime l’action de faire passer. La construction française maintient son lien avec l’action divine énoncée au début du verset, sans reformuler celle-ci comme une simple permission.
- source_word: כָּל פֶּטֶר רָחַם
  choice: tout premier-né
  rationale: L’expression signifie littéralement « tout ce qui ouvre le sein maternel » et constitue un idiome hébreu courant pour le premier-né. Le choix retenu est clair et naturel, tandis que la forme littérale est signalée en note.
- source_word: לְמַעַן אֲשִׁמֵּם
  choice: afin de les dévaster
  rationale: Le hiphil de שמם peut évoquer la dévastation ou le fait de frapper de stupeur. « Dévaster » convient au contexte de jugement tout en laissant l’autre nuance en note.
- source_word: לְמַעַן אֲשֶׁר יֵדְעוּ
  choice: afin qu’ils sachent
  rationale: Cette formulation conserve la finalité exprimée par לְמַעַן et correspond à la formule de reconnaissance fréquente dans Ézéchiel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver sa fonction de nom propre dans le texte hébreu.
theological_decisions:
- issue: Action divine dans la souillure d’Israël et contexte du sacrifice des premiers-nés
  choice: Conserver l’affirmation directe « Je les ai rendus impurs » et la construction causative « en faisant passer », sans atténuer explicitement l’action divine.
  alternative: Paraphraser par « je les ai livrés à l’impureté » ou attribuer explicitement aux Israélites seuls l’action de faire passer.
  rationale: Le texte hébreu emploie une première personne causative et laisse subsister une forte tension entre le jugement divin et les offrandes coupables d’Israël. La traduction ne doit pas résoudre cette tension en transformant l’action en simple permission.
- issue: Identification du rite consistant à faire passer les premiers-nés
  choice: Expliciter « par le feu » dans le texte et signaler en note que ces mots ne figurent pas dans ce verset.
  alternative: Traduire seulement « faire passer tout premier-né », au risque de rendre l’allusion rituelle opaque.
  rationale: Le verbe « faire passer » désigne dans ce contexte d’Ézéchiel un rite lié au sacrifice d’enfants, explicitement associé au feu ailleurs dans le même chapitre. La note distingue clairement l’explicitation contextuelle du libellé hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve la répétition de « afin de », qui reflète les deux propositions finales du texte hébreu. « Rendus impurs » garde la coloration cultuelle sans employer un vocabulaire inutilement archaïque.
