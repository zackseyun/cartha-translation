source:
  edition: WLC
  text: לָ/כֵ֞ן דַּבֵּ֨ר אֶל בֵּ֤ית יִשְׂרָאֵל֙ בֶּן אָדָ֔ם וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה ע֗וֹד זֹ֚את גִּדְּפ֤וּ אוֹתִ/י֙ אֲב֣וֹתֵי/כֶ֔ם בְּ/מַעֲלָ֥/ם בִּ֖/י מָֽעַל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/027.yaml
  text: 'Therefore speak to the house of Israel[a], son of man, and say to them, ‘Thus says the Lord Yahweh: In this also your fathers blasphemed me[b], by acting treacherously against me.’'
translation:
  language: fr
  text: 'C’est pourquoi, fils d’homme, parle à la maison d’Israël et dis-leur : « Ainsi parle le Seigneur Yahweh : Vos pères m’ont encore outragé en ceci : ils m’ont trahi par leur infidélité envers moi.[a][b] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « m’ont blasphémé » ou « m’ont traité avec mépris ».
    reason: גדף désigne un outrage ou une parole méprisante dirigée contre Dieu ; « blasphémé » est une autre traduction possible.
  - marker: b
    text: Ou « par leur trahison envers moi » ou « en rompant leur engagement envers moi ».
    reason: La construction avec מעל souligne une grave déloyauté, ou rupture de fidélité, envers Dieu.
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Rend naturellement en français le lien logique de conséquence avec ce qui précède.
- source_word: דַּבֵּר אֶל בֵּית יִשְׂרָאֵל
  choice: parle à la maison d’Israël
  rationale: Conserve la formule prophétique et l’expression collective et historique « maison d’Israël ».
- source_word: בֶּן אָדָם
  choice: fils d’homme
  rationale: Maintient l’appellation récurrente adressée à Ézéchiel, sans lui imposer ici une interprétation christologique.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Voici ce que dit le Seigneur Yahweh
  rationale: Formule idiomatique française qui distingue אֲדֹנָי, titre de souveraineté, de יהוה, le nom divin.
- source_word: עוֹד זֹאת
  choice: encore … en ceci
  rationale: Préserve à la fois la valeur additive de עוֹד et la référence démonstrative de זֹאת.
- source_word: גִּדְּפוּ אוֹתִי
  choice: m’ont offensé
  rationale: Exprime une grave atteinte portée à Dieu tout en laissant ouverte la nuance entre outrage verbal, mépris et blasphème.
- source_word: אֲבוֹתֵיכֶם
  choice: vos pères
  rationale: Reproduit le terme familial masculin du texte hébreu et son lien direct avec les générations antérieures d’Israël.
- source_word: בְּמַעֲלָם בִּי מָעַל
  choice: ils se sont montrés infidèles envers moi
  rationale: Rend la construction intensive fondée sur מעל par une formulation française naturelle évoquant une déloyauté grave et une rupture de fidélité.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte explicitement le nom יהוה après אֲדֹנָי ; « Yahweh » permet de préserver cette distinction sans confondre le nom divin avec un simple titre.
- issue: Portée de בֶּן אָדָם dans Ézéchiel
  choice: fils d’homme
  alternative: être humain / mortel
  rationale: La traduction littérale maintient la désignation répétée du prophète dans le livre, sans résoudre cette expression par une paraphrase interprétative.
- issue: Nature de l’offense exprimée par גדף
  choice: m’ont offensé
  alternative: m’ont blasphémé / m’ont outragé
  rationale: Le terme peut désigner un outrage ou une parole méprisante contre Dieu. Le texte principal conserve une certaine amplitude sémantique, tandis que la note présente les rendus plus précis possibles.
translation_notes:
  register: Français moderne, digne et accessible. L’ordre de l’adresse « fils d’homme » a été avancé pour une syntaxe française naturelle. Les deux propositions finales et les deux-points font ressortir que l’infidélité explique en quoi les pères ont offensé Dieu.
