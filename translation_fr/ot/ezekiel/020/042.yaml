source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בַּ/הֲבִיאִ֥/י אֶתְ/כֶ֖ם אֶל אַדְמַ֣ת יִשְׂרָאֵ֑ל אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לָ/תֵ֥ת אוֹתָ֖/הּ לַ/אֲבֽוֹתֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/042.yaml
  text: Then you will know that I am Yahweh[a], when I bring you into the land of Israel, into the land that I lifted up my hand to give to your fathers.
translation:
  language: fr
  text: Alors vous saurez que je suis Yahweh, lorsque je vous ferai entrer dans le pays d’Israël, dans le pays que j’ai levé la main pour donner à vos pères.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le pays que j’ai levé la main pour donner à vos pères ». Lever la main était un geste de serment.'
    reason: Précise le sens idiomatique de l’expression hébraïque tout en conservant dans le texte principal l’image littérale du geste.
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Alors vous saurez
  rationale: Le parfait qal précédé de la conjonction prend ici, dans le discours prophétique, une valeur future et consécutive. « Alors » exprime naturellement le résultat de l’action divine annoncée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin, qui conserve sa valeur de nom propre et sa portée d’alliance.
- source_word: בַּהֲבִיאִי
  choice: quand je vous ferai entrer
  rationale: L’infinitif construit précédé de ב marque la circonstance temporelle. Le factitif français « faire entrer » rend naturellement l’action de conduire le peuple dans le pays.
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: sur la terre d’Israël
  rationale: אֲדָמָה évoque la terre ou le sol, mais désigne ici le territoire d’Israël. La préposition « sur » convient au français avec « faire entrer » suivi de ce complément territorial.
- source_word: הָאָרֶץ
  choice: dans le pays
  rationale: Le terme renvoie au pays promis, non à la terre entière. « Pays » évite une répétition française lourde tout en gardant la reprise explicative de l’hébreu.
- source_word: נָשָׂאתִי אֶת־יָדִי
  choice: j’ai levé la main pour promettre
  rationale: La traduction conserve l’image concrète du geste tout en explicitant sa valeur idiomatique de serment, afin que le lecteur moderne en saisisse immédiatement le sens.
- source_word: לָתֵת אֹתָהּ
  choice: de donner
  rationale: L’infinitif exprime l’objet de la promesse. Le pronom féminin renvoyant au pays peut rester implicite en français.
- source_word: לַאֲבוֹתֵיכֶם
  choice: à vos pères
  rationale: Cette formulation rend précisément le terme hébreu et désigne ici les pères ancestraux d’Israël.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. Le rendre par « Yahweh » préserve son statut de nom propre sans substituer un titre.
- issue: Valeur de l’expression de serment נָשָׂאתִי אֶת־יָדִי
  choice: 'Conserver le geste et expliciter sa valeur : « j’ai levé la main pour promettre »'
  alternative: « j’ai juré » ou, très littéralement, « j’ai levé la main pour donner »
  rationale: Le geste de lever la main exprime ici un engagement solennel. La formulation choisie maintient l’image hébraïque sans laisser son sens théologique implicite ou obscur.
translation_notes:
  register: Français international moderne, clair et digne. La reprise « terre d’Israël… pays » reflète les deux termes hébreux distincts. Le futur simple convient à l’annonce prophétique. Le marqueur [a] est placé après l’ensemble de l’expression expliquée.
