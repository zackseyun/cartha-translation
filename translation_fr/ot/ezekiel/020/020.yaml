  text: וְ/אֶת שַׁבְּתוֹתַ֖/י קַדֵּ֑שׁוּ וְ/הָי֤וּ לְ/אוֹת֙ בֵּינִ֣/י וּ/בֵֽינֵי/כֶ֔ם לָ/דַ֕עַת כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/020.yaml
  text: Keep my Sabbaths holy[a], and let them be a sign between me and you, so that you may know that I am Yahweh your God.
translation:
  language: fr
  text: Respectez la sainteté de mes sabbats. Qu’ils soient un signe entre moi et vous, afin que vous sachiez que je suis Yahvé[a], votre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, le nom divin, traditionnellement rendu par « le Seigneur ».'
    reason: Le lecteur est informé de la forme hébraïque et de l’autre convention de traduction courante.
lexical_decisions:
- source_word: שַׁבְּתוֹתַי
  choice: mes sabbats
  rationale: Le pluriel hébreu avec suffixe de première personne est conservé, car il désigne les sabbats récurrents appartenant à Dieu.
- source_word: קַדֵּשׁוּ
  choice: Considérez … comme saints
  rationale: Le piel impératif de קדשׁ demande de reconnaître et de traiter les sabbats comme saints. Cette formulation est naturelle en français moderne tout en maintenant la force de l’ordre.
- source_word: וְהָיוּ
  choice: Qu’ils soient
  rationale: Après l’impératif, la forme prolonge l’exhortation avec une nuance volitive ou résultative, bien rendue par le subjonctif français.
- source_word: לְאוֹת
  choice: un signe
  rationale: אוֹת désigne ici un signe distinctif de la relation d’alliance.
- source_word: בֵּינִי וּבֵינֵיכֶם
  choice: entre moi et vous
  rationale: La formule relationnelle hébraïque est rendue directement, sans explicitation supplémentaire.
- source_word: לָדַעַת
  choice: afin que vous sachiez
  rationale: L’infinitif précédé de ל exprime ici le but; « afin que » restitue clairement cette relation.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu comme nom propre plutôt que remplacé par un titre. « Yahvé » est la forme française courante du nom divin.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: אֱלֹהִים renvoie ici au Dieu d’Israël au singulier; le suffixe exprime la relation d’alliance avec les destinataires.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le tétragramme. Le conserver sous une forme française usuelle préserve son caractère de nom personnel, tandis que la note signale la graphie hébraïque.
- issue: Fonction des sabbats comme signe
  choice: Qu’ils soient un signe
  alternative: Ils seront un signe
  rationale: Le contexte impératif permet une lecture exhortative de וְהָיוּ. Le choix retenu préserve cette continuité sans exclure la portée déclarative de la formule.
translation_notes:
  register: Français international moderne, digne et accessible. Le pluriel « sabbats » et le vocabulaire d’alliance sont conservés; la syntaxe reste fluide sans effacer la nuance exhortative de l’hébreu.
