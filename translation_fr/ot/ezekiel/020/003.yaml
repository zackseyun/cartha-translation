  text: בֶּן אָדָ֗ם דַּבֵּ֞ר אֶת זִקְנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הֲ/לִ/דְרֹ֥שׁ אֹתִ֖/י אַתֶּ֣ם בָּאִ֑ים חַי אָ֨נִי֙ אִם אִדָּרֵ֣שׁ לָ/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/003.yaml
  text: 'Son of man[a], speak to the elders of Israel and say to them, Thus says the Lord GOD: Is it to inquire of me that you have come? As I live, I will not be inquired of by you[b], declares the Lord GOD.'
translation:
  language: fr
  text: 'Fils d’homme, parle aux anciens d’Israël et dis-leur : « Ainsi parle le Seigneur Yahweh : Est-ce pour me consulter[a] que vous êtes venus ? Aussi vrai que je suis vivant, je ne me laisserai pas consulter par vous[b], déclare le Seigneur Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « m’interroger ». Le verbe peut désigner le fait de solliciter de Dieu une réponse ou un oracle.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « Aussi vrai que je suis vivant, si je suis consulté par vous… » Dans cette formule de serment, la proposition inachevée exprime une forte négation.'
    reason: source_form
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Conserve la formule d’adresse caractéristique du livre d’Ézéchiel et l’image littérale de l’hébreu, tout en restant familière au lectorat francophone.
- source_word: דַּבֵּר אֶת זִקְנֵי יִשְׂרָאֵל
  choice: parle aux anciens d’Israël
  rationale: Rend directement l’impératif et désigne naturellement en français le groupe reconnu des responsables d’Israël.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Ainsi parle le Seigneur Yahweh
  rationale: « Ainsi parle » restitue la formule de messager prophétique. « Le Seigneur Yahweh » distingue le titre אֲדֹנָי du nom divin יְהוִה sans les fondre.
- source_word: הֲלִדְרֹשׁ אֹתִי
  choice: Est-ce pour me consulter
  rationale: Dans ce contexte, דרשׁ désigne la démarche consistant à solliciter de Dieu une réponse ou un oracle, plutôt qu’une recherche spirituelle générale.
- source_word: בָּאִים
  choice: vous êtes venus
  rationale: Le participe décrit ici leur venue présente selon son but; le passé composé est la formulation française la plus naturelle.
- source_word: חַי אָנִי
  choice: Aussi vrai que je suis vivant
  rationale: Formulation française solennelle et intelligible de la formule divine de serment « vivant, moi ».
- source_word: אִם אִדָּרֵשׁ לָכֶם
  choice: je ne me laisserai pas consulter par vous
  rationale: Après le serment, אִם porte une négation énergique. La tournure pronominale restitue le nifal et maintient le lien lexical avec « me consulter ».
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclare le Seigneur Yahweh
  rationale: Rend la formule d’attestation prophétique avec autorité, dans un français actuel et naturel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte comporte à la fois le titre אֲדֹנָי et le nom propre divin יְהוָה. Les rendre séparément évite de masquer cette distinction présente dans la source.
- issue: Valeur du serment suivi de אִם
  choice: Aussi vrai que je suis vivant, je ne me laisserai pas consulter par vous
  alternative: Aussi vrai que je suis vivant, si je me laisse consulter par vous…
  rationale: La condition laissée en suspens appartient à une formule hébraïque de serment qui exprime ici un refus catégorique. La négation explicite en communique la force sans inventer la conséquence sous-entendue.
- issue: Portée de דרשׁ dans la démarche des anciens
  choice: consulter
  alternative: chercher
  rationale: Le contexte vise une demande de réponse divine adressée au prophète. « Consulter » préserve cette dimension oraculaire sans suggérer à lui seul une recherche religieuse générale.
translation_notes:
  register: Français international moderne, digne et direct. La répétition de « consulter » reproduit volontairement le lien verbal de l’hébreu. « Fils d’homme » et les formules prophétiques conservent la couleur littéraire propre à Ézéchiel.
