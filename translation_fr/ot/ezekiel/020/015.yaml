revisions:
- from: Et moi aussi, dans le désert, j’ai levé la main devant eux[a], jurant de ne pas les faire entrer dans le pays que je leur avais donné, un pays ruisselant de lait et de miel, le joyau de tous les pays[b].
  to: Et moi aussi, dans le désert, j’ai levé la main à leur sujet[a], jurant de ne pas les faire entrer dans le pays que j’avais donné, pays ruisselant de lait et de miel, le joyau de tous les pays[b].
  rationale: La révision corrige la relation de לָהֶם sans transformer le geste en simple scène « devant eux », retire le bénéficiaire non exprimé après « donné », et aligne la note a sur le texte hébreu et sur la formulation française. Elle conserve l’image de la main levée tout en signalant explicitement, par « jurant », la valeur idiomatique de serment.
