  text: וְ/גַם אֲנִ֗י נָשָׂ֧אתִי יָדִ֛/י לָ/הֶ֖ם בַּ/מִּדְבָּ֑ר לְ/בִלְתִּי֩ הָבִ֨יא אוֹתָ֜/ם אֶל הָ/אָ֣רֶץ אֲשֶׁר נָתַ֗תִּי זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ צְבִ֥י הִ֖יא לְ/כָל הָ/אֲרָצֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/015.yaml
  text: Yet I myself also raised my hand to them in the wilderness[a], that I would not bring them into the land that I had given them, flowing with milk and honey[b], the glory of all lands.
translation:
  language: fr
  text: Et moi aussi, dans le désert, j’ai levé la main à leur sujet[a], jurant de ne pas les faire entrer dans le pays que j’avais donné, pays ruisselant de lait et de miel, le joyau de tous les pays[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « j’ai levé ma main à leur sujet » ; ce geste est une formule de serment et peut se rendre par « j’ai juré ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la splendeur » ou « la beauté parmi tous les pays ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Et moi aussi
  rationale: Préserve la valeur additive de וְגַם et l’insistance portée par le pronom אֲנִי, dans un français naturel.
- source_word: נָשָׂאתִי יָדִי לָהֶם
  choice: j’ai levé la main devant eux
  rationale: Conserve l’image concrète du geste de serment. « Devant eux » exprime naturellement en français les personnes en présence desquelles l’engagement est pris.
- source_word: לְבִלְתִּי הָבִיא אוֹתָם
  choice: jurant de ne pas les faire entrer
  rationale: Le participe ajouté explicite la fonction idiomatique du geste sans remplacer l’image hébraïque; « faire entrer » rend la valeur causative de הֵבִיא.
- source_word: הָאָרֶץ אֲשֶׁר נָתַתִּי
  choice: le pays que je leur avais donné
  rationale: Le plus-que-parfait situe le don antérieurement au serment évoqué; le pronom « leur » est fourni par le contexte immédiat et rend explicite le bénéficiaire sous-entendu en hébreu.
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: un pays ruisselant de lait et de miel
  rationale: Formule française consacrée qui garde l’image d’abondance du participe hébreu.
- source_word: צְבִי הִיא לְכָל הָאֲרָצוֹת
  choice: le joyau de tous les pays
  rationale: « Joyau » rend de façon naturelle l’idée de beauté, d’attrait et d’excellence portée ici par צְבִי, tout en conservant le registre élevé.
theological_decisions:
- issue: Faut-il expliciter le sens de serment de נָשָׂאתִי יָדִי ?
  choice: Conserver le geste « j’ai levé la main » et en expliciter la fonction par « jurant »
  alternative: Traduire seulement « j’ai juré » ou conserver uniquement l’expression littérale
  rationale: Cette formulation garde l’image propre au texte source tout en évitant que le lecteur moderne ne manque sa valeur idiomatique de serment.
- issue: Valeur de נָתַתִּי à propos du pays
  choice: « que je leur avais donné »
  alternative: « que je leur ai donné » ou « que je leur avais promis »
  rationale: Le plus-que-parfait respecte la perspective rétrospective sans substituer explicitement la notion de promesse au verbe hébreu « donner ».
- issue: Portée de צְבִי dans la description du pays
  choice: « le joyau de tous les pays »
  alternative: « la beauté », « la splendeur » ou « la gloire de tous les pays »
  rationale: Le choix exprime l’excellence désirable du pays sans transformer cette appréciation en affirmation doctrinale plus précise que l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. L’image hébraïque du geste de serment est maintenue, mais son sens est explicité dans la phrase. « Désert », « ruisselant de lait et de miel » et « joyau » offrent une formulation courante sans banaliser le registre prophétique.
