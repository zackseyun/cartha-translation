  yaml_path: translation/ot/ezekiel/020/010.yaml
  text: So I brought them out from the land of Egypt and brought them into the wilderness.
translation:
  language: fr
  text: Je les ai donc fait sortir du pays d’Égypte et les ai amenés dans le désert.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹוצִיאֵם
  choice: Je les ai donc fait sortir
  rationale: 'Le hifil de יצא exprime ici la causation : faire sortir. « Donc » rend naturellement la progression narrative marquée par le waw dans le contexte.'
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: du pays d’Égypte
  rationale: Cette formulation conserve explicitement אֶרֶץ, « pays », et reprend une expression française biblique claire et naturelle.
- source_word: וָאֲבִאֵם
  choice: et je les ai conduits
  rationale: Le hifil de בוא signifie « faire venir, amener ». Dans ce mouvement vers le désert, « conduire » est idiomatique en français et évite la répétition peu naturelle de « faire sortir » puis « amener », sans effacer l’action divine.
- source_word: אֶל הַמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne le désert ou une région sauvage et inhabitée. « Dans » exprime ici le mouvement vers l’intérieur du lieu, tandis que « désert » est le terme courant et digne en français moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La phrase conserve le parallélisme des deux actions divines tout en privilégiant une tournure idiomatique.
