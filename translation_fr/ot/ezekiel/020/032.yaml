source:
  edition: WLC
  text: וְ/הָֽ/עֹלָה֙ עַל ר֣וּחֲ/כֶ֔ם הָי֖וֹ לֹ֣א תִֽהְיֶ֑ה אֲשֶׁ֣ר אַתֶּ֣ם אֹמְרִ֗ים נִֽהְיֶ֤ה כַ/גּוֹיִם֙ כְּ/מִשְׁפְּח֣וֹת הָ/אֲרָצ֔וֹת לְ/שָׁרֵ֖ת עֵ֥ץ וָ/אָֽבֶן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/032.yaml
  text: What is coming up in your mind will certainly not happen—that you say[a], ‘We will be like the nations, like the clans of the lands[d][c][b], serving wood and stone.’
translation:
  language: fr
  text: 'Ce qui vous monte à l’esprit ne se réalisera absolument pas : « Nous serons comme les nations, comme les clans des pays, en servant le bois et la pierre[a] », dites-vous.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire des idoles faites de bois et de pierre ; « servir » peut aussi désigner un acte d’adoration dans ce contexte.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָעֹלָה עַל רוּחֲכֶם
  choice: Ce qui vous monte à l’esprit
  rationale: L’expression désigne ce qui surgit dans la pensée ou l’intention intérieure. « Monte à l’esprit » conserve l’image hébraïque tout en étant naturel en français.
- source_word: הָיוֹ לֹא תִהְיֶה
  choice: ne se réalisera certainement pas
  rationale: L’infinitif absolu associé au verbe renforce ici la négation. Cette formulation rend clairement l’idée d’un projet qui ne se produira en aucun cas.
- source_word: אֲשֶׁר אַתֶּם אֹמְרִים
  choice: vous qui dites
  rationale: La tournure rattache directement la déclaration qui suit aux destinataires, sans atténuer leur responsabilité.
- source_word: נִהְיֶה
  choice: Nous serons
  rationale: L’imparfait hébreu à la première personne du pluriel exprime ici l’intention ou le projet d’adopter la condition des nations.
- source_word: כַגּוֹיִם
  choice: comme les nations
  rationale: « Nations » désigne naturellement les peuples environnants et évite les connotations plus tardives de « païens » ou de « Gentils ».
- source_word: כְּמִשְׁפְּחוֹת הָאֲרָצוֹת
  choice: comme les clans des différents pays
  rationale: « Clans » conserve la dimension de groupes de parenté de מִשְׁפָּחוֹת. « Des différents pays » rend le pluriel הָאֲרָצוֹת de manière idiomatique en français moderne.
- source_word: לְשָׁרֵת
  choice: en servant
  rationale: Le verbe signifie d’abord « servir ». En contexte, ce service est cultuel, mais le texte principal garde le terme lexical plutôt que de préciser d’emblée « adorer ».
- source_word: עֵץ וָאָבֶן
  choice: le bois et la pierre
  rationale: L’expression nomme les matériaux dont sont faites les idoles et conserve la force polémique du texte, qui réduit les objets servis à leur matière.
theological_decisions:
- issue: Nature du service rendu au bois et à la pierre
  choice: en servant le bois et la pierre
  alternative: en adorant le bois et la pierre
  rationale: Le contexte est clairement idolâtre, mais le verbe hébreu signifie « servir ». Le texte principal préserve ce choix lexical, tandis que la note explicite la portée cultuelle.
- issue: Faculté intérieure désignée par רוּחַ
  choice: l’esprit
  alternative: la pensée
  rationale: Dans l’expression française « monter à l’esprit », le mot désigne naturellement la conscience ou la pensée intérieure sans imposer une distinction anthropologique particulière. Il permet aussi de conserver un lien formel avec רוּחַ.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’image de ce qui « monte à l’esprit », l’insistance de la négation et le vocabulaire concret du « bois et de la pierre », tout en évitant des termes confessionnellement marqués.
