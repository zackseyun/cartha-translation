  text: לָ/כֵ֞ן אֱמֹ֣ר אֶל בֵּ֣ית יִשְׂרָאֵ֗ל כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הַ/בְּ/דֶ֥רֶךְ אֲבֽוֹתֵי/כֶ֖ם אַתֶּ֣ם נִטְמְאִ֑ים וְ/אַחֲרֵ֥י שִׁקּוּצֵי/הֶ֖ם אַתֶּ֥ם זֹנִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/030.yaml
  text: 'Therefore say to the house of Israel[a], Thus says the Lord Yahweh: Are you defiling yourselves in the way of your fathers[b], and whoring after their detestable things?'
translation:
  language: fr
  text: 'C’est pourquoi, dis à la maison d’Israël : « Ainsi parle le Seigneur Yahweh : Est-ce en suivant la conduite de vos pères que vous vous rendez impurs[a] et que vous vous prostituez en poursuivant leurs horreurs[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous devenez impurs ».'
    reason: La forme hébraïque peut souligner soit l’entrée progressive dans l’impureté, soit le fait de se souiller par ses propres pratiques.
  - marker: b
    text: Le terme hébreu peut aussi se traduire par « choses abominables » et désigne souvent, dans ce contexte, des idoles.
    reason: La traduction « horreurs » préserve la portée générale du mot, tandis que le contexte idolâtre permet une interprétation plus précise.
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence tirée de l’accusation précédente.
- source_word: אֱמֹר אֶל בֵּית יִשְׂרָאֵל
  choice: dis à la maison d’Israël
  rationale: Conserve la formule de mission prophétique et la désignation collective et liée à l’alliance.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Ainsi parle le Seigneur Yahweh
  rationale: Formule prophétique française consacrée et naturelle; « Yahweh » représente explicitement le nom divin יהוה, tandis que « Seigneur » rend אדני.
- source_word: הַבְּדֶרֶךְ אֲבוֹתֵיכֶם
  choice: en suivant la conduite de vos pères
  rationale: Exprime l’idée idiomatique de marcher selon le modèle ou les pratiques des ancêtres, sans donner au mot « chemin » une lourdeur artificielle.
- source_word: אַתֶּם נִטְמְאִים
  choice: vous vous rendez impurs
  rationale: Rend la valeur présente et la participation active d’Israël à son impureté, tout en conservant le vocabulaire cultuel et moral de l’impureté.
- source_word: וְאַחֲרֵי
  choice: en poursuivant
  rationale: Exprime le mouvement figuré consistant à aller après ces objets et s’intègre naturellement à la métaphore de la prostitution.
- source_word: שִׁקּוּצֵיהֶם
  choice: leurs horreurs
  rationale: Conserve la forte répulsion exprimée par le terme hébreu sans limiter explicitement la référence aux seules idoles.
- source_word: אַתֶּם זֹנִים
  choice: vous vous prostituez
  rationale: Préserve la métaphore prophétique forte de l’infidélité envers Dieu par l’idolâtrie, plutôt que de l’atténuer en simple « infidélité ».
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Distingue les deux éléments du titre et rend directement le nom personnel יהוה, sans les confondre ni produire la répétition « le Seigneur Seigneur ».
- issue: Métaphore sexuelle de זנה appliquée à l’idolâtrie
  choice: vous vous prostituez
  alternative: vous êtes infidèles
  rationale: Maintient la vigueur et la tension de la métaphore prophétique de l’infidélité à l’alliance au lieu de l’expliquer ou de l’adoucir dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La question rhétorique est conservée, tout comme le langage collectif (« maison d’Israël », « vos pères »), le vocabulaire de l’impureté et la métaphore volontairement choquante de la prostitution.
