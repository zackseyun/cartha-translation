reference: Ezekiel 20:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/גַ֤ם אֶת שַׁבְּתוֹתַ/י֙ נָתַ֣תִּי לָ/הֶ֔ם לִ/הְי֣וֹת לְ/א֔וֹת בֵּינִ֖/י וּ/בֵֽינֵי/הֶ֑ם לָ/דַ֕עַת כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/012.yaml
  text: I also gave them my Sabbaths to be a sign between me and them[a], so that they might know that I am Yahweh who sanctifies them.
translation:
  language: fr
  text: Je leur ai aussi donné mes sabbats, pour qu’ils soient un signe entre moi et eux, afin qu’ils sachent que c’est moi, Yahweh, qui les sanctifie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui les rend saints ».
    reason: Alternative lexicale naturelle pour מְקַדְּשָׁם, qui explicite le sens de « sanctifier ».
lexical_decisions:
- source_word: וְגַם
  choice: aussi
  rationale: L’adverbe conserve la valeur additive de l’expression hébraïque tout en s’intégrant naturellement à la phrase française.
- source_word: שַׁבְּתוֹתַי
  choice: mes sabbats
  rationale: Le pluriel hébreu et le suffixe possessif sont rendus directement; « sabbats » peut désigner les jours de sabbat et leur observance collective.
- source_word: נָתַתִּי לָהֶם
  choice: Je leur ai donné
  rationale: Cette formulation idiomatique rend directement le verbe נתן avec son complément indirect.
- source_word: לִהְיוֹת לְאוֹת
  choice: pour qu’ils soient un signe
  rationale: Le pluriel « ils » reprend « mes sabbats », tandis que la tournure finale exprime la fonction voulue par l’infinitif hébreu.
- source_word: בֵּינִי וּבֵינֵיהֶם
  choice: entre moi et eux
  rationale: Traduction directe de la formule relationnelle qui présente les sabbats comme signe entre Dieu et Israël.
- source_word: לָדַעַת
  choice: afin qu’ils sachent
  rationale: La tournure exprime clairement la finalité indiquée par ל et l’infinitif constructif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: מְקַדְּשָׁם
  choice: qui les sanctifie
  rationale: Le participe piel décrit l’action de Dieu qui met son peuple à part comme saint; « sanctifie » conserve le registre cultuel et théologique sans préciser au-delà du texte le mode de cette action.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Sens de קדשׁ dans le contexte de l’alliance
  choice: qui les sanctifie
  alternative: qui les rend saints; qui les consacre
  rationale: « Sanctifie » maintient la notion que Dieu met Israël à part comme saint, sans réduire le sens à une consécration seulement rituelle. La variante plus transparente est signalée en note.
- issue: Mise en relief du sujet divin dans כִּי אֲנִי יְהוָה
  choice: que c’est moi, Yahweh, qui
  alternative: que moi, Yahweh, je
  rationale: La construction clivée rend naturellement en français l’insistance de אֲנִי tout en conservant l’identification explicite de Yahweh comme celui qui sanctifie.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en évitant un calque lourd. Le terme biblique « sabbats » et le verbe théologique courant « sanctifie » sont conservés; leur sens demeure compréhensible grâce au contexte et à la note.
