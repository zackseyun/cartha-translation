source:
  edition: WLC
  text: כִּ֣י בְ/הַר קָדְשִׁ֞/י בְּ/הַ֣ר מְר֣וֹם יִשְׂרָאֵ֗ל נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה שָׁ֣ם יַעַבְדֻ֜/נִי כָּל בֵּ֧ית יִשְׂרָאֵ֛ל כֻּלֹּ֖/ה בָּ/אָ֑רֶץ שָׁ֣ם אֶרְצֵ֔/ם וְ/שָׁ֞ם אֶדְר֣וֹשׁ אֶת תְּרוּמֹֽתֵי/כֶ֗ם וְ/אֶת רֵאשִׁ֛ית מַשְׂאוֹתֵי/כֶ֖ם בְּ/כָל קָדְשֵׁי/כֶֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/040.yaml
  text: For on my holy mountain[a], on the high mountain of Israel, declares the Lord GOD, there all the house of Israel, all of them in the land, will serve me. There I will accept them, and there I will require your contributions and the firstfruits of your offerings[c][b], with all your holy things.
translation:
  language: fr
  text: Car c’est sur ma montagne sainte, sur la haute montagne d’Israël — déclaration du Seigneur Yahweh — que toute la maison d’Israël, tout entière, me servira dans le pays. Là, je leur réserverai un accueil favorable, et là, je réclamerai vos contributions[a], les prémices de vos offrandes[b], ainsi que tout ce que vous consacrez[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos offrandes prélevées »; le terme hébreu désigne des parts mises à part et présentées à Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « la première part de ce que vous apportez »; l’expression hébraïque peut évoquer les prémices ou la part initiale des dons apportés.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « avec toutes vos choses saintes »; il s’agit de tout ce qui est mis à part comme sacré.
    reason: literal_rendering
lexical_decisions:
- source_word: בְהַר קָדְשִׁי
  choice: sur ma montagne sainte
  rationale: La préposition בְ est locative et « sur » convient naturellement à un lieu de culte situé sur une montagne.
- source_word: בְהַר מְרוֹם יִשְׂרָאֵל
  choice: sur la haute montagne d’Israël
  rationale: מְרוֹם exprime la hauteur ou l’élévation; cette formulation conserve le parallélisme avec « ma montagne sainte ».
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: נְאֻם introduit solennellement une parole prophétique; « Yahweh » représente explicitement le nom divin יהוה sans produire l’expression peu naturelle « Seigneur SEIGNEUR ».
- source_word: יַעַבְדֻנִי
  choice: me servira
  rationale: עבד peut désigner à la fois le service et le culte; « servir » préserve cette amplitude dans le contexte cultuel.
- source_word: כָּל בֵּית יִשְׂרָאֵל כֻּלֹּה
  choice: toute la maison d’Israël, tout entière
  rationale: La reprise emphatique de la totalité est maintenue plutôt que réduite à une seule expression.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: Dans ce contexte de restauration d’Israël, אֶרֶץ désigne naturellement le pays; la formulation le rattache au service rendu par Israël.
- source_word: אֶרְצֵם
  choice: je leur réserverai un accueil favorable
  rationale: רצה exprime ici l’acceptation bienveillante. Cette formulation rend la nuance favorable plus explicitement que le simple verbe « accepter ».
- source_word: אֶדְרוֹשׁ
  choice: je réclamerai
  rationale: דרש signifie ici demander comme dû ou requis; « réclamer » garde cette force sans aller jusqu’à « exiger ».
- source_word: תְּרוּמֹתֵיכֶם
  choice: vos contributions
  rationale: תְּרוּמָה désigne une part prélevée et présentée à Dieu; « contributions » distingue ce terme du mot plus général « offrandes » qui suit.
- source_word: רֵאשִׁית מַשְׂאוֹתֵיכֶם
  choice: les prémices de vos offrandes
  rationale: רֵאשִׁית évoque ce qui vient en premier et, dans un contexte cultuel, les prémices; מַשְׂאוֹת désigne vraisemblablement ce qui est apporté ou élevé comme offrande.
- source_word: בְּכָל קָדְשֵׁיכֶם
  choice: ainsi que tout ce que vous consacrez
  rationale: קָדְשֵׁיכֶם est une expression large pour les choses saintes ou consacrées; cette traduction reste naturelle sans la limiter à une catégorie précise d’offrandes.
theological_decisions:
- issue: Traduction du nom divin יהוה après אֲדֹנָי
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le choix retient le nom d’alliance présent dans l’hébreu et évite de confondre יהוה avec un simple titre, tout en conservant אֲדֹנָי par « Seigneur ».
- issue: Portée cultuelle du verbe עבד
  choice: servir
  alternative: adorer
  rationale: Le contexte concerne le culte et les offrandes, mais le verbe hébreu garde un sens plus large que la seule adoration; « servir » préserve cette tension.
- issue: Référent de בָּאָרֶץ
  choice: dans le pays
  alternative: sur la terre
  rationale: Le contexte de rassemblement et de restauration favorise le pays d’Israël, sans ajouter explicitement son nom là où l’hébreu dit seulement « le pays ».
translation_notes:
  register: Français international actuel, solennel mais accessible. La répétition emphatique concernant toute la maison d’Israël est conservée. Le tiret encadre la formule prophétique sans alourdir la phrase, et le vocabulaire cultuel demeure compréhensible sans technicisme excessif.
