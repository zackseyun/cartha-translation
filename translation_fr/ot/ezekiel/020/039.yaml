revisions:
- from: 'Mais vous, maison d’Israël, voici ce que dit le Seigneur, l’Éternel : Allez donc, que chacun serve ses idoles[a], puisque ensuite vous ne m’écoutez pas[b] ! Mais ne profanez plus mon saint nom par vos dons et vos idoles.'
  to: 'Mais vous, maison d’Israël, voici ce que dit le Seigneur, l’Éternel : Allez, servez chacun ses idoles[a], si par la suite vous ne m’écoutez pas[b] ; mais vous ne profanerez plus mon saint nom par vos dons et vos idoles.'
  rationale: La révision remplace la causalité introduite par « puisque » par la condition explicitement exprimée en hébreu, « si ». Elle conserve « par la suite » pour וְאַחַר sans lui attribuer un sens plus précis que le texte ne permet. Les impératifs français sont rendus de façon plus directe, et le futur final maintient la force déclarative/prohibitive de לֹא תְחַלְּלוּ עוֹד.
