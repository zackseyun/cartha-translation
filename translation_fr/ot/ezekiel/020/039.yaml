source:
  edition: WLC
  text: וְ/אַתֶּ֨ם בֵּֽית יִשְׂרָאֵ֜ל כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה אִ֤ישׁ גִּלּוּלָי/ו֙ לְכ֣וּ עֲבֹ֔דוּ וְ/אַחַ֕ר אִם אֵינְ/כֶ֖ם שֹׁמְעִ֣ים אֵלָ֑/י וְ/אֶת שֵׁ֤ם קָדְשִׁ/י֙ לֹ֣א תְחַלְּלוּ ע֔וֹד בְּ/מַתְּנֽוֹתֵי/כֶ֖ם וּ/בְ/גִלּוּלֵי/כֶֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/039.yaml
  text: 'But as for you[a], house of Israel, thus says the Lord GOD: Go, each man, serve his idols—if afterward you will not listen to me[b]; but you shall no longer profane my holy name with your gifts and with your idols.'
translation:
  language: fr
  text: 'Mais vous, maison d’Israël, voici ce que dit le Seigneur, l’Éternel : Allez, servez chacun ses idoles[a], si par la suite vous ne m’écoutez pas[b] ; mais vous ne profanerez plus mon saint nom par vos dons et vos idoles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « idoles » est fortement méprisant ; il pourrait aussi être rendu par « idoles répugnantes » ou, plus littéralement, « idoles-excréments ».
    reason: lexical_alternative
  - marker: b
    text: 'La syntaxe hébraïque est difficile. Autre ponctuation possible : « Allez, servez chacun ses idoles ; mais par la suite, si vous ne m’écoutez pas… »'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Mais vous
  rationale: La conjonction suivie du pronom indépendant introduit une adresse fortement contrastive ; « Mais vous » est naturel et direct en français.
- source_word: בֵּית יִשְׂרָאֵל
  choice: maison d’Israël
  rationale: Cette formulation conserve l’adresse collective et traditionnelle du texte hébreu.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur, l’Éternel
  rationale: Cette tournure française distingue les deux éléments du titre divin et évite la répétition maladroite « Seigneur SEIGNEUR ».
- source_word: אִישׁ גִּלּוּלָיו
  choice: que chacun serve ses idoles
  rationale: אִישׁ a ici une valeur distributive. « Chacun » l’exprime naturellement en français, tandis que « ses » maintient la responsabilité individuelle.
- source_word: גִּלּוּלִים
  choice: idoles
  rationale: « Idoles » est clair dans le texte principal ; la nuance fortement méprisante propre au terme d’Ézéchiel est signalée en note.
- source_word: לְכוּ עֲבֹדוּ
  choice: Allez donc, que chacun serve
  rationale: Les impératifs sont conservés. « donc » fait entendre leur portée tranchante et probablement ironique sans supprimer leur forme grammaticale.
- source_word: וְאַחַר אִם אֵינְכֶם שֹׁמְעִים אֵלָי
  choice: puisque ensuite vous ne m’écoutez pas
  rationale: La syntaxe est difficile. Cette formulation rend le refus persistant qui motive la concession judiciaire, tout en gardant le repère temporel « ensuite » ; une autre ponctuation possible est donnée en note.
- source_word: שֹׁמְעִים אֵלָי
  choice: vous ne m’écoutez pas
  rationale: « Écouter » préserve à la fois le sens auditif et l’implication d’obéissance sans expliciter excessivement cette dernière.
- source_word: שֵׁם קָדְשִׁי
  choice: mon saint nom
  rationale: C’est l’équivalent français idiomatique qui conserve la portée théologique du nom divin.
- source_word: לֹא תְחַלְּלוּ עוֹד
  choice: ne profanez plus
  rationale: Cette défense ferme rend naturellement le verbe חלל appliqué au nom divin et l’adverbe עוֹד.
- source_word: בְּמַתְּנוֹתֵיכֶם וּבְגִלּוּלֵיכֶם
  choice: par vos dons et vos idoles
  rationale: « Dons » reste proche du lexème, qui désigne ici probablement des offrandes ; « par » marque les moyens de la profanation.
theological_decisions:
- issue: Portée des impératifs initiaux
  choice: 'Concession judiciaire teintée d’ironie : Dieu leur ordonne formellement de poursuivre leur choix idolâtre s’ils refusent de l’écouter.'
  alternative: Commandement simple approuvant le culte des idoles, ou parole purement sarcastique dépourvue de force impérative.
  rationale: Le contexte exclut une approbation de l’idolâtrie, mais la traduction conserve la forme impérative et la tension rhétorique du texte.
- issue: Syntaxe de וְאַחַר אִם
  choice: 'Relier la proposition au refus d’écouter : « puisque ensuite vous ne m’écoutez pas ».'
  alternative: « Allez, servez chacun vos idoles ; mais ensuite, si vous ne m’écoutez pas… »
  rationale: L’enchaînement hébreu est difficile et permet plusieurs ponctuations. Le texte principal offre une lecture française cohérente, tandis que la note préserve l’autre analyse.
- issue: Traduction du titre אֲדֹנָי יְהוִה
  choice: le Seigneur, l’Éternel
  alternative: le Seigneur YHWH / le Seigneur Yahvé
  rationale: La formulation suit un usage français digne et largement intelligible, sans imposer dans le texte principal une prononciation particulière du tétragramme.
translation_notes:
  register: Français international moderne, digne et direct. Le ton prophétique abrupt est conservé. La formulation évite l’archaïsme, tout en maintenant « maison d’Israël » et « mon saint nom », expressions importantes dans ce contexte.
