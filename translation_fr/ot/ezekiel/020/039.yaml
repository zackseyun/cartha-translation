review_pass:
  verdict: revise
  source_fidelity: La traduction de l’adresse, du titre divin, de l’injonction distributive et de la défense finale est globalement fidèle. Toutefois, « puisque » transforme la condition אִם (« si ») en cause présupposée et résout indûment une syntaxe reconnue comme difficile. La formulation révisée conserve explicitement la condition et le repère temporel.
  naturalness: « Allez donc, que chacun serve ses idoles » est moins direct et moins idiomatique que deux impératifs coordonnés. « Allez, servez chacun ses idoles » est naturel, conserve le ton abrupt et maintient la valeur distributive. « Vous ne profanerez plus » rend bien l’imparfait prophétique final.
  terminology: « Maison d’Israël », « le Seigneur, l’Éternel », « idoles », « mon saint nom », « dons » et « profaner » conviennent au registre prophétique moderne et à la terminologie du passage. La note sur גִּלּוּלִים conserve utilement sa force dépréciative sans la surcharger dans le texte.
  issues:
  - severity: high
    issue: « puisque ensuite vous ne m’écoutez pas » remplace la particule conditionnelle אִם par une relation causale.
    rationale: Le texte hébreu comporte אִם, « si ». Même si la construction וְאַחַר אִם est disputée, « puisque » présente le refus comme un fait causal établi et ne préserve pas l’ambiguïté syntaxique signalée par la tradition textuelle et la note anglaise.
  - severity: medium
    issue: « que chacun serve » atténue la succession d’impératifs directs.
    rationale: לְכוּ עֲבֹדוּ est formé de deux impératifs. En français, « Allez, servez chacun ses idoles » reproduit plus directement cette forme et son ton judiciaire.
  - severity: low
    issue: La note b ne correspond plus exactement à l’analyse donnée dans le texte principal.
    rationale: Puisque le texte principal doit conserver « si », la note doit présenter l’autre ponctuation sans suggérer que la lecture principale est causale.
