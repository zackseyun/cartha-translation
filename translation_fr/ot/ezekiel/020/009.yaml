  text: וָ/אַ֨עַשׂ֙ לְמַ֣עַן שְׁמִ֔/י לְ/בִלְתִּ֥י הֵחֵ֛ל לְ/עֵינֵ֥י הַ/גּוֹיִ֖ם אֲשֶׁר הֵ֣מָּה בְ/תוֹכָ֑/ם אֲשֶׁ֨ר נוֹדַ֤עְתִּי אֲלֵי/הֶם֙ לְ/עֵ֣ינֵי/הֶ֔ם לְ/הוֹצִיאָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/009.yaml
  text: But I acted for the sake of my name[a], so that it should not be profaned in the sight of the nations among whom they were[c][b], to whom I had made myself known in their sight by bringing them out of the land of Egypt.
translation:
  language: fr
  text: Mais j’ai agi par égard pour mon nom[a], afin qu’il ne soit pas profané[b] sous les yeux des nations parmi lesquelles ils se trouvaient et auxquelles je m’étais fait connaître, sous leurs yeux, en faisant sortir les Israélites[c] du pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à cause de mon nom » ou « pour mon nom ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « afin de ne pas le profaner ».'
    reason: grammatical_alternative
  - marker: c
    text: 'L’hébreu emploie ici un pronom : « en les faisant sortir » ; son référent est le peuple d’Israël.'
    reason: referent_clarification
lexical_decisions:
- source_word: וָאַעַשׂ
  choice: Mais j’ai agi
  rationale: Le verbe עשה a ici le sens large d’« agir ». « Mais » exprime le contraste avec la rébellion évoquée au verset précédent.
- source_word: לְמַעַן שְׁמִי
  choice: par égard pour mon nom
  rationale: Cette formulation française naturelle conserve l’idée que Dieu agit en considération de l’honneur attaché à son nom, sans développer cette implication dans le texte.
- source_word: לְבִלְתִּי הֵחֵל
  choice: afin qu’il ne soit pas profané
  rationale: Le passif rend le sens de « subir une profanation »; le pronom renvoie au nom de Dieu. « Profané » préserve la dimension sacrée du terme חלל.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: sous les yeux des nations
  rationale: Cette expression conserve l’image visuelle et souligne le caractère public de l’action.
- source_word: אֲשֶׁר הֵמָּה בְתוֹכָם
  choice: parmi lesquelles ils se trouvaient
  rationale: Le relatif reprend « les nations », tandis que « ils » désigne les Israélites; la formulation reste proche de l’expression hébraïque sans ajouter explicitement l’idée d’habitation.
- source_word: אֲשֶׁר נוֹדַעְתִּי אֲלֵיהֶם
  choice: Je m’étais fait connaître à ces nations
  rationale: Le niphal de ידע exprime ici la manifestation de Dieu. La répétition explicite de « ces nations » évite en français une succession obscure de pronoms tout en conservant le complément אֲלֵיהֶם.
- source_word: לְעֵינֵיהֶם
  choice: sous leurs yeux
  rationale: La répétition de la formule visuelle présente dans l’hébreu est maintenue.
- source_word: לְהוֹצִיאָם
  choice: en faisant sortir les Israélites
  rationale: Le gérondif rend naturellement la valeur circonstancielle ou instrumentale de l’infinitif. Le nom explicite son référent afin d’éviter que « les » soit compris comme désignant les nations.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: du pays d’Égypte
  rationale: Expression française biblique courante qui rend exactement le point de départ de la sortie.
theological_decisions:
- issue: Sens de l’action entreprise « par égard pour mon nom »
  choice: Conserver l’idiome du nom divin et son lien avec sa profanation publique.
  alternative: Paraphraser en parlant directement de la réputation ou de l’honneur de Dieu.
  rationale: Dans Ézéchiel, le « nom » porte la révélation publique du caractère et de la sainteté de Dieu. L’idiome doit demeurer visible sans être réduit à une simple préoccupation de réputation.
- issue: Valeur de חלל appliqué au nom de Dieu
  choice: profané
  alternative: déshonoré ou souillé
  rationale: « Profané » maintient la tension entre sainteté et traitement commun ou indigne, essentielle au vocabulaire théologique d’Ézéchiel.
- issue: Référent des nations dans la révélation de Dieu
  choice: Comprendre que Dieu s’est fait connaître aux nations publiquement en faisant sortir Israël d’Égypte.
  alternative: Comprendre אֲלֵיהֶם comme renvoyant directement aux Israélites malgré l’antécédent grammatical « les nations ».
  rationale: L’antécédent immédiat du relatif est « les nations » et la répétition « sous leurs yeux » souligne leur rôle de témoins. Le texte explicite néanmoins Israël comme objet de la délivrance pour éviter toute confusion.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « sous leurs yeux » est volontaire, car elle reproduit l’insistance du texte hébreu sur le caractère public de l’action divine. Les référents pronominaux sont explicités là où le français risquerait de faire croire que Dieu a fait sortir les nations d’Égypte.
