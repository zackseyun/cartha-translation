source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר נִשְׁפַּ֨טְתִּי֙ אֶת אֲב֣וֹתֵי/כֶ֔ם בְּ/מִדְבַּ֖ר אֶ֣רֶץ מִצְרָ֑יִם כֵּ֚ן אִשָּׁפֵ֣ט אִתְּ/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/036.yaml
  text: Just as I entered into judgment with your fathers in the wilderness of the land of Egypt[a], so I will enter into judgment with you, declares the Lord GOD.
translation:
  language: fr
  text: Tout comme je suis entré en jugement avec vos pères dans le désert du pays d’Égypte[a], ainsi j’entrerai en jugement avec vous — déclaration du Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « j’ai jugé vos pères… ainsi je vous jugerai ». Le verbe hébreu peut se traduire plus simplement par « juger », mais « entrer en jugement » en préserve la nuance judiciaire formelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Tout comme… ainsi
  rationale: Cette construction française marque clairement la correspondance entre l’action passée de Dieu et son action future.
- source_word: נִשְׁפַּטְתִּי ... אִשָּׁפֵט
  choice: je suis entré en jugement… j’entrerai en jugement
  rationale: Le nifal de שׁפט avec אֶת/אִתְּ exprime ici une confrontation judiciaire. Cette formulation préserve la nuance formelle ainsi que le parallélisme des deux verbes.
- source_word: אֶת אֲבוֹתֵיכֶם ... אִתְּכֶם
  choice: avec vos pères… avec vous
  rationale: « Avec » rend l’engagement judiciaire sans renforcer le texte en « contre », même si le contexte est conflictuel.
- source_word: בְּמִדְבַּר אֶרֶץ מִצְרָיִם
  choice: dans le désert du pays d’Égypte
  rationale: La traduction conserve les deux éléments lexicaux, מִדְבָּר et אֶרֶץ מִצְרָיִם, ainsi que l’expression inhabituelle du texte hébreu.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: « Déclaration » restitue la formule prophétique נְאֻם; « Seigneur Yahweh » traduit distinctement le titre אֲדֹנָי et le nom divin יְהוִה.
theological_decisions:
- issue: Traduction du nom divin יְהוִה après אֲדֹנָי
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: La forme choisie rend à la fois le titre אֲדֹנָי et le nom propre divin יְהוִה, sans les confondre ni produire « le Seigneur SEIGNEUR ».
- issue: Portée judiciaire du nifal de שׁפט
  choice: entrer en jugement avec
  alternative: juger
  rationale: Le choix principal conserve la nuance de confrontation judiciaire, tandis que la note reconnaît que le verbe peut être rendu plus simplement.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme hébreu et l’étrangeté relative de « désert du pays d’Égypte » sont conservés; la ponctuation met en relief la formule prophétique finale.
