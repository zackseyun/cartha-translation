source:
  edition: WLC
  text: וּ/זְכַרְתֶּם שָׁ֗ם אֶת דַּרְכֵי/כֶם֙ וְ/אֵת֙ כָּל עֲלִיל֣וֹתֵי/כֶ֔ם אֲשֶׁ֥ר נִטְמֵאתֶ֖ם בָּ֑/ם וּ/נְקֹֽטֹתֶם֙ בִּ/פְנֵי/כֶ֔ם בְּ/כָל רָעוֹתֵי/כֶ֖ם אֲשֶׁ֥ר עֲשִׂיתֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/043.yaml
  text: There you will remember your ways and all your deeds by which you defiled yourselves[b][a], and you will loathe yourselves in your own sight for all the evils that you have done.
translation:
  language: fr
  text: Là, vous vous souviendrez de votre conduite et de tous vos actes par lesquels vous vous êtes souillés. Vous vous prendrez vous-mêmes en dégoût[a], à cause de tout le mal que vous avez fait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « devant vos faces ». L’expression évoque le fait d’avoir horreur de soi-même, à ses propres yeux.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְכַרְתֶּם שָׁם
  choice: Là, vous vous souviendrez
  rationale: Le parfait précédé de וּ prend ici une valeur future dans le discours prophétique; « là » reprend naturellement le lieu évoqué dans le contexte précédent.
- source_word: דַּרְכֵיכֶם
  choice: votre conduite
  rationale: Dans ce contexte moral, דֶּרֶךְ désigne la manière de vivre. « Conduite » exprime clairement ce sens en français moderne sans suggérer des chemins matériels.
- source_word: כָּל עֲלִילוֹתֵיכֶם
  choice: tous vos actes
  rationale: Le nom désigne les actions accomplies; « actes » reste distinct de la conduite générale et convient au registre moral du passage.
- source_word: אֲשֶׁר נִטְמֵאתֶם בָּם
  choice: par lesquels vous vous êtes rendus impurs
  rationale: Le niphal de טמא peut signifier devenir impur. La tournure pronominale conserve ici la responsabilité des sujets, tandis que בָּם est compris comme indiquant le moyen.
- source_word: וּנְקֹטֹתֶם בִּפְנֵיכֶם
  choice: Vous éprouverez du dégoût pour vous-mêmes
  rationale: קוט exprime une forte répulsion. La formulation française rend idiomatiquement l'auto-répulsion indiquée par בִּפְנֵיכֶם, littéralement « devant vos faces », sans reproduire un calque obscur.
- source_word: בְּכָל רָעוֹתֵיכֶם אֲשֶׁר עֲשִׂיתֶם
  choice: à cause de tout le mal que vous avez fait
  rationale: Le pluriel hébreu רָעוֹת peut désigner l'ensemble des actions mauvaises. Le singulier collectif « tout le mal » est naturel en français et la préposition בְּ exprime ici la cause.
theological_decisions:
- issue: Nature de la réaction d'Israël après son rétablissement
  choice: Le texte décrit une profonde répulsion envers soi-même à cause des fautes passées.
  alternative: Comprendre la réaction comme un simple regret ou un sentiment de honte.
  rationale: La force lexicale de קוט dépasse le simple regret. La traduction conserve cette intensité sans introduire un système doctrinal ou une terminologie théologique absents du verset.
translation_notes:
  register: Français international moderne, naturel et digne. « Votre conduite » explicite la métaphore morale de la « voie »; « vous vous êtes rendus impurs » préserve le vocabulaire d'impureté ainsi que la responsabilité exprimée dans le contexte. Le marqueur [a] figure dans le texte principal.
