base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/007.yaml
  text: And I said to them[a], ‘Each man, throw away the detestable things before his eyes, and do not defile yourselves with the idols of Egypt[b]. I am Yahweh your God.’
translation:
  language: fr
  text: 'Je leur ai dit : « Que chacun rejette les choses abominables qui sont sous ses yeux[a] et ne se rende pas impur par les idoles d’Égypte[b]. Je suis Yahweh, votre Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les choses abominables de ses yeux ». L’expression imagée désigne vraisemblablement les objets idolâtriques que chacun a sous les yeux, regarde avec faveur ou désire.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « idoles » est un terme fortement méprisant, fréquent chez Ézéchiel ; on pourrait aussi traduire « idoles immondes » ou, plus littéralement, « idoles-excréments ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר אֲלֵהֶם
  choice: Je leur ai dit
  rationale: Le waw narratif situe la parole dans le récit passé. En français, « Je leur ai dit » rend naturellement la succession sans exiger un « et » initial.
- source_word: אִישׁ ... הַשְׁלִיכוּ
  choice: Que chacun rejette
  rationale: אִישׁ a ici une valeur distributive devant l’impératif pluriel. « Que chacun » est idiomatique, inclusif et conserve la responsabilité individuelle; « rejette » exprime l’abandon résolu demandé.
- source_word: שִׁקּוּצֵי עֵינָיו
  choice: les choses abominables auxquelles il attache les yeux
  rationale: Cette formulation garde l’image des yeux et le caractère répugnant de שִׁקּוּצִים, tout en rendant l’expression compréhensible en français. Le contexte suggère des objets idolâtriques sans que le texte les nomme explicitement ici.
- source_word: וּבְגִלּוּלֵי מִצְרַיִם אַל תִּטַּמָּאוּ
  choice: et ne vous rendez pas impurs avec les idoles de l’Égypte
  rationale: La tournure pronominale rend la valeur réflexive de תִּטַּמָּאוּ et conserve la dimension cultuelle et morale de l’impureté. « Idoles » donne le référent clair de גִּלּוּלִים; sa nuance fortement méprisante est signalée en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin conserve le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Dans cette déclaration où Yahweh est le locuteur, la forme désigne le Dieu d’Israël au singulier et exprime la relation d’alliance.
theological_decisions:
- issue: Sens de שִׁקּוּצֵי עֵינָיו
  choice: les choses abominables auxquelles il attache les yeux
  alternative: les objets abominables qui sont sous ses yeux; les idoles abominables qu’il regarde
  rationale: Le contexte est idolâtrique, mais la locution hébraïque demeure imagée et peut évoquer ce que chacun regarde avec faveur ou désire. La traduction conserve cette image sans réduire silencieusement l’expression au seul mot « idoles ».
- issue: Force polémique de גִּלּוּלִים
  choice: les idoles
  alternative: les idoles immondes; littéralement, les idoles-excréments
  rationale: « Idoles » est clair et digne dans le corps du texte. Une note préserve la coloration volontairement méprisante, caractéristique du vocabulaire d’Ézéchiel, sans imposer une image étymologique trop crue comme équivalent principal.
translation_notes:
  register: Français international moderne, naturel et digne. « Que chacun » rend la distribution individuelle sans lourdeur genrée. L’image inhabituelle liée aux yeux ainsi que la violence lexicale du terme appliqué aux idoles sont conservées ou explicitées en note.
