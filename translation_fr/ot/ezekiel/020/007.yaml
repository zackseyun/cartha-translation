  source_fidelity: La traduction rend correctement la séquence narrative, l’injonction distributive, le rejet des objets abominables, l’interdiction de l’impureté liée aux idoles d’Égypte et l’auto-identification divine. « Auxquelles il attache les yeux » interprète toutefois plus fortement l’idiome hébreu que nécessaire. La coordination actuelle mêle aussi sans transition un sujet singulier (« chacun ») et une injonction au pluriel (« ne vous rendez pas »).
  naturalness: Le texte est globalement digne et moderne, mais l’accord grammatical et énonciatif de « Que chacun ... et ne vous rendez pas » n’est pas naturel en français. Une formulation distributive entièrement au singulier est fluide et conserve le sens de l’adresse collective à responsabilité individuelle.
  terminology: « Choses abominables », « idoles », « impur », « Yahweh » et « votre Dieu » sont appropriés. « Par les idoles d’Égypte » rend plus directement la relation causale ou instrumentale exprimée par la préposition hébraïque que « avec les idoles ».
