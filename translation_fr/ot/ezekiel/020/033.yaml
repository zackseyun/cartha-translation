  terminology: « Seigneur Yahweh » préserve correctement la distinction entre אַדֹנָי et le nom divin יהוה. « Régner sur vous » conserve la force royale de מלך. La note est appropriée, avec une légère amélioration stylistique de l’alternative littérale.
