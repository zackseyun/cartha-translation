source:
  edition: WLC
  text: חַי אָ֕נִי נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה אִם לֹ֠א בְּ/יָ֨ד חֲזָקָ֜ה וּ/בִ/זְר֧וֹעַ נְטוּיָ֛ה וּ/בְ/חֵמָ֥ה שְׁפוּכָ֖ה אֶמְל֥וֹךְ עֲלֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/033.yaml
  text: As I live[a], declares the Lord GOD, surely with a strong hand and an outstretched arm and with wrath poured out, I will reign over you.
translation:
  language: fr
  text: « Aussi vrai que je suis vivant — déclaration du Seigneur Yahweh —, certainement, c’est avec une main forte, un bras étendu et une fureur déversée que je régnerai[a] sur vous. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je vous gouvernerai » ou, plus littéralement, « je serai roi sur vous ». Le verbe hébreu exprime explicitement la royauté.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָ֕נִי
  choice: Aussi vrai que je suis vivant
  rationale: Cette formule française naturelle conserve l’image de la vie divine et rend clairement la valeur de serment de la formule prophétique hébraïque.
- source_word: נְאֻ֖ם אֲדֹנָ֣י יְהוִ֑ה
  choice: déclaration du Seigneur Yahweh
  rationale: « Déclaration » rend la formule prophétique נְאֻם, tandis que « Seigneur Yahweh » distingue le titre אֲדֹנָי du nom divin יהוה sans produire l’expression confuse « Seigneur SEIGNEUR ».
- source_word: אִם לֹ֠א
  choice: oui
  rationale: Dans le cadre d’un serment, אִם לֹא est une formule d’assertion énergique et non une condition littérale. « Oui » en restitue l’insistance sans alourdir la phrase.
- source_word: בְּיָ֨ד חֲזָקָ֜ה
  choice: d’une main forte
  rationale: Ce choix conserve l’image traditionnelle, ainsi que son écho aux actes de puissance associés à l’Exode.
- source_word: וּבִזְר֧וֹעַ נְטוּיָ֛ה
  choice: d’un bras tendu
  rationale: La formulation garde l’image corporelle et le parallélisme avec « une main forte ».
- source_word: וּבְחֵמָ֥ה שְׁפוּכָ֖ה
  choice: en déversant ma fureur
  rationale: Cette tournure française idiomatique préserve l’image d’une fureur répandue, tout en évitant l’expression peu naturelle « avec une fureur déversée ».
- source_word: אֶמְל֥וֹךְ עֲלֵיכֶֽם
  choice: je régnerai sur vous
  rationale: « Régner » conserve explicitement la portée royale du verbe מלך, plus nettement que le terme général « gouverner ».
theological_decisions:
- issue: Rendu de la séquence divine אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte associe un titre de souveraineté au nom divin. « Seigneur Yahweh » maintient cette distinction et rend directement le nom de l’alliance.
- issue: Affirmation de la royauté divine au moyen d’images de jugement
  choice: je régnerai sur vous
  alternative: je vous gouvernerai / je serai roi sur vous
  rationale: « Régner » préserve la force royale du verbe sans atténuer la tension du passage, où la royauté divine s’impose par la puissance et la fureur.
translation_notes:
  register: Français international moderne, solennel et accessible. Les tirets isolent la formule prophétique sans obscurcir la structure du serment. Le parallélisme des images de la main et du bras est conservé, tandis que la dernière expression est légèrement réorganisée pour rester naturelle en français.
