  variant: modern international French
source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בַּ/עֲשׂוֹתִ֥/י אִתְּ/כֶ֖ם לְמַ֣עַן שְׁמִ֑/י לֹא֩ כְ/דַרְכֵי/כֶ֨ם הָ/רָעִ֜ים וְ/כַ/עֲלִילֽוֹתֵי/כֶ֤ם הַ/נִּשְׁחָתוֹת֙ בֵּ֣ית יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/044.yaml
  text: Then you will know that I am Yahweh[a], when I deal with you for the sake of my name, not according to your evil ways or according to your corrupt deeds, O house of Israel[b], declares the Lord GOD.
translation:
  language: fr
  text: Alors vous saurez que je suis Yahweh, quand j’agirai envers vous[a] à cause de mon nom[b], et non selon vos mauvaises voies ni selon vos actes corrompus, ô maison d’Israël — déclaration du Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quand je vous traiterai ». L’hébreu reste général et ne précise pas ici la nature de l’action de Dieu.'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire en considération de l’honneur attaché à son nom et de sa réputation.
    reason: cultural_note
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Alors vous saurez
  rationale: Le parfait avec waw, dans ce discours prophétique, exprime ici un résultat futur. « Alors » rend naturellement cette conséquence.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel plutôt que de lui substituer un titre.
- source_word: בַּעֲשׂוֹתִי אִתְּכֶם
  choice: quand j’agirai envers vous
  rationale: La tournure reste assez large pour ne pas préciser si l’action divine est punitive, restauratrice, ou les deux.
- source_word: לְמַעַן שְׁמִי
  choice: à cause de mon nom
  rationale: Cette expression indique que Dieu agit en considération de son nom, c’est-à-dire de son honneur et de sa réputation.
- source_word: לֹא כְדַרְכֵיכֶם הָרָעִים
  choice: et non selon vos mauvaises voies
  rationale: « Voies » garde l’image hébraïque de la conduite comme chemin de vie, tandis que « selon » exprime la norme de rétribution écartée ici.
- source_word: וְכַעֲלִילוֹתֵיכֶם הַנִּשְׁחָתוֹת
  choice: ni selon vos actes corrompus
  rationale: « Actes » traduit clairement les agissements visés, et « corrompus » conserve leur qualification morale forte.
- source_word: בֵּית יִשְׂרָאֵל
  choice: maison d’Israël
  rationale: La formule traditionnelle reste intelligible en français et conserve l’interpellation collective explicite.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: « Déclaration » rend la formule prophétique נְאֻם, tandis que « Seigneur Yahweh » distingue le titre אֲדֹנָי du nom divin יְהוָה.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel
  rationale: Le texte emploie le tétragramme comme nom personnel; « Yahweh » le conserve sans le remplacer par un titre traditionnel.
- issue: Nature de l’action divine dans בַּעֲשׂוֹתִי אִתְּכֶם
  choice: quand j’agirai envers vous
  alternative: quand je vous traiterai
  rationale: L’hébreu ne précise pas si cette action relève principalement du jugement, de la restauration ou des deux. La formulation retenue préserve cette ouverture.
- issue: Principe selon lequel Dieu agit
  choice: à cause de mon nom, et non selon vos mauvaises voies ni selon vos actes corrompus
  alternative: pour l’honneur de mon nom, sans vous traiter comme le méritent vos mauvaises voies et vos actes corrompus
  rationale: La traduction conserve la formulation et la tension du texte sans expliciter excessivement la notion de mérite ou la modalité de l’action divine.
translation_notes:
  register: Français international moderne, digne et accessible. La structure prophétique demeure soutenue sans archaïsmes inutiles. « Maison d’Israël » et « déclaration du Seigneur Yahweh » conservent les formules hébraïques caractéristiques.
