source:
  edition: WLC
  text: וּ/בָרוֹתִ֣י מִ/כֶּ֗ם הַ/מֹּרְדִ֤ים וְ/הַ/פּֽוֹשְׁעִים֙ בִּ֔/י מֵ/אֶ֤רֶץ מְגֽוּרֵי/הֶם֙ אוֹצִ֣יא אוֹתָ֔/ם וְ/אֶל אַדְמַ֥ת יִשְׂרָאֵ֖ל לֹ֣א יָב֑וֹא וִֽ/ידַעְתֶּ֖ם כִּי אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/038.yaml
  text: I will purge from among you the rebels and those who transgress against me[a]. I will bring them out of the land where they sojourn, but they will not enter the land of Israel[c][b]. Then you will know that I am Yahweh.
translation:
  language: fr
  text: Je séparerai d’entre vous les rebelles et ceux qui se rendent coupables de transgression envers moi[a]. Je les ferai sortir du pays où ils séjournent[b], mais aucun d’eux n’entrera dans le pays d’Israël[c]. Alors vous saurez que je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui se révoltent contre moi ». Le terme hébreu désigne une transgression, une infidélité ou une révolte contre Dieu.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « du pays de leurs séjours ».
    reason: lexical_alternative
  - marker: c
    text: 'Le verbe hébreu est au singulier, littéralement « il n’entrera pas », avec un sens distributif : aucun des membres du groupe n’entrera.'
    reason: source_form
lexical_decisions:
- source_word: וּבָרוֹתִי מִכֶּם
  choice: Je séparerai de vous
  rationale: Le verbe ברר exprime ici l’action de trier et d’écarter les membres indignes du groupe. « Séparerai de vous » conserve cette image judiciaire sans imposer la connotation rituelle que pourrait suggérer « purifierai ».
- source_word: הַמֹּרְדִים
  choice: les rebelles
  rationale: Le participe substantivé désigne ceux qui persistent dans la rébellion.
- source_word: וְהַפּוֹשְׁעִים בִּי
  choice: ceux qui se révoltent contre moi
  rationale: פשע peut désigner une transgression prenant la forme d’une rupture de loyauté ou d’une révolte. Cette formulation naturelle conserve l’objet personnel בִּי, « contre moi ».
- source_word: מֵאֶרֶץ מְגוּרֵיהֶם
  choice: du pays où ils séjournent
  rationale: מְגוּרִים évoque un lieu de séjour, notamment hors de sa terre d’origine; « séjournent » préserve mieux cette nuance que le simple verbe « habitent ».
- source_word: אוֹצִיא אוֹתָם
  choice: Je les ferai sortir
  rationale: Le hiphil de יצא signifie littéralement faire sortir. Cette traduction rend clairement la causalité du verbe hébreu.
- source_word: וְאֶל אַדְמַת יִשְׂרָאֵל לֹא יָבוֹא
  choice: mais aucun d’eux n’entrera sur la terre d’Israël
  rationale: Le verbe hébreu est au singulier après le groupe pluriel, avec une valeur distributive. « Aucun d’eux » rend naturellement cette construction et évite d’effacer le singulier. « Terre d’Israël » restitue אַדְמָה comme désignation territoriale.
- source_word: וִידַעְתֶּם
  choice: Alors vous saurez
  rationale: Le waw introduit ici la conséquence du jugement annoncé; « alors » exprime naturellement ce lien en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Portée du jugement exprimé par וּבָרוֹתִי
  choice: Je séparerai de vous
  alternative: Je purifierai d’entre vous / Je trierai parmi vous
  rationale: Le texte annonce l’exclusion judiciaire des rebelles. « Séparerai » préserve cette gravité et l’idée de tri sans ajouter une interprétation rituelle.
- issue: Relation entre מֹרְדִים et פּוֹשְׁעִים
  choice: les rebelles et ceux qui se révoltent contre moi
  alternative: les rebelles et ceux qui transgressent contre moi
  rationale: Les deux termes ont des champs sémantiques qui se recouvrent. La traduction conserve les deux désignations sans chercher à leur attribuer artificiellement deux catégories théologiques distinctes.
- issue: Nombre du verbe לֹא יָבוֹא
  choice: aucun d’eux n’entrera
  alternative: ils n’entreront pas
  rationale: La formulation distributive rend le singulier hébreu tout en le rattachant clairement au groupe précédemment mentionné.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom propre divin; sa translittération préserve cette donnée explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’enchaînement hébreu tout en explicitant naturellement la valeur distributive du verbe singulier. Les marqueurs [a], [b] et [c] figurent tous dans le texte principal.
