review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire pour mieux rendre מִכֶּם (« d’entre vous ») et surtout pour ne pas neutraliser la distinction, certes partiellement recouvrante, entre les « rebelles » (מֹרְדִים) et ceux qui commettent une transgression envers Yahweh (פֹּשְׁעִים בִּי). La formulation distributive « aucun d’eux n’entrera » rend correctement le singulier hébreu.
  naturalness: Le français est globalement clair et de registre biblique moderne. « Séparerai de vous » est toutefois moins idiomatique et moins précis que « séparerai d’entre vous ». « Se révoltent » après « les rebelles » produit une répétition inutile.
  terminology: « Yahweh » reproduit adéquatement le nom divin. « Pays où ils séjournent » exprime bien la nuance de résidence temporaire ou étrangère de מְגוּרִים. « Pays d’Israël » est une désignation territoriale naturelle pour אַדְמַת יִשְׂרָאֵל.
  issues:
  - severity: medium
    issue: Répétition sémantique entre « les rebelles » et « ceux qui se révoltent contre moi ».
    rationale: מֹרְדִים désigne déjà les rebelles. Rendre פֹּשְׁעִים par un second terme de même famille efface la distinction lexicale que le texte maintient. Une formulation en termes de transgression ou de faute envers Yahweh conserve cette différence sans la surinterpréter.
  - severity: low
    issue: « Je séparerai de vous » rend de manière imprécise מִכֶּם.
    rationale: Dans ce contexte de retrait d’un groupe, « d’entre vous » exprime plus naturellement et plus exactement la séparation depuis l’intérieur de la communauté.
  - severity: low
    issue: « Sur la terre d’Israël » est moins naturel après « entrer ».
    rationale: En français, on entre « dans le pays d’Israël » ; ce choix conserve la portée territoriale de אַדָמָה sans modifier le sens.
  revised_text: Je séparerai d’entre vous les rebelles et ceux qui se rendent coupables de transgression envers moi[a]. Je les ferai sortir du pays où ils séjournent[b], mais aucun d’eux n’entrera dans le pays d’Israël[c]. Alors vous saurez que je suis Yahweh.
