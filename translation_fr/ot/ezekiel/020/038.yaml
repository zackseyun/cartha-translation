revisions:
- from: Je séparerai de vous les rebelles et ceux qui se révoltent contre moi[a]. Je les ferai sortir du pays où ils séjournent[b], mais aucun d’eux n’entrera sur la terre d’Israël[c]. Alors vous saurez que je suis Yahweh.
  to: Je séparerai d’entre vous les rebelles et ceux qui se rendent coupables de transgression envers moi[a]. Je les ferai sortir du pays où ils séjournent[b], mais aucun d’eux n’entrera dans le pays d’Israël[c]. Alors vous saurez que je suis Yahweh.
  rationale: La révision conserve la structure et le sens judiciaire du verset, tout en rendant explicitement « d’entre vous » et en évitant de traduire deux termes hébreux distincts par deux expressions synonymes de révolte. Les trois appels de note restent ancrés au bon endroit et leurs explications correspondent au texte hébreu.
