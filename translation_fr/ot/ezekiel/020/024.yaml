id: EZK.20.24
reference: Ezekiel 20:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יַ֜עַן מִשְׁפָּטַ֤/י לֹֽא עָשׂוּ֙ וְ/חֻקּוֹתַ֣/י מָאָ֔סוּ וְ/אֶת שַׁבְּתוֹתַ֖/י חִלֵּ֑לוּ וְ/אַחֲרֵי֙ גִּלּוּלֵ֣י אֲבוֹתָ֔/ם הָי֖וּ עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/024.yaml
  text: because they did not practice my judgments[a], and they rejected my statutes, and they profaned my Sabbaths, and their eyes were after the idols of their fathers.
translation:
  language: fr
  text: parce qu’ils n’avaient pas mis en pratique mes règles de droit, qu’ils avaient rejeté mes prescriptions et profané mes sabbats, et que leurs yeux restaient fixés sur les idoles[a] de leurs pères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « idoles » est fortement méprisant; il peut évoquer des idoles répugnantes, voire des « idoles d’excréments ».
    reason: Signaler la connotation péjorative marquée de גִּלּוּלִים sans alourdir le texte principal.
lexical_decisions:
- source_word: יַעַן
  choice: parce que
  rationale: Introduit la cause de l’action divine mentionnée dans le contexte précédent; « parce que » est le lien causal le plus naturel en français moderne.
- source_word: מִשְׁפָּטַי
  choice: mes règles de droit
  rationale: Le terme désigne ici les exigences juridiques de l’alliance. « Règles de droit » en garde la portée normative tout en le distinguant de חֻקּוֹתַי.
- source_word: עָשׂוּ
  choice: n’avaient pas mis en pratique
  rationale: Avec des exigences juridiques comme complément, « mettre en pratique » exprime naturellement l’idée de les accomplir ou de les observer.
- source_word: חֻקּוֹתַי
  choice: mes prescriptions
  rationale: Rend un terme courant du vocabulaire des obligations de l’alliance et maintient une distinction lexicale avec מִשְׁפָּטַי.
- source_word: מָאָסוּ
  choice: avaient rejeté
  rationale: Exprime clairement la répudiation volontaire indiquée par le verbe hébreu.
- source_word: שַׁבְּתוֹתַי
  choice: mes sabbats
  rationale: Reproduit directement le pluriel et la désignation des temps sabbatiques appartenant à Dieu.
- source_word: חִלֵּלוּ
  choice: profané
  rationale: Dans ce contexte cultuel et lié à l’alliance, le verbe signifie traiter comme ordinaire ou dépouiller de son caractère sacré.
- source_word: הָיוּ עֵינֵיהֶם אַחֲרֵי
  choice: leurs yeux restaient fixés sur
  rationale: Conserve l’image hébraïque des yeux tout en exprimant en français naturel une orientation persistante du désir et de l’attention.
- source_word: גִּלּוּלֵי
  choice: les idoles
  rationale: « Idoles » donne le référent avec clarté; la nuance fortement méprisante propre au terme d’Ézéchiel est signalée en note.
- source_word: אֲבוֹתָם
  choice: de leurs pères
  rationale: Reproduit le terme familial masculin explicitement employé dans l’hébreu sans l’élargir en « ancêtres ».
theological_decisions:
- issue: Valeur méprisante de גִּלּוּלִים
  choice: idoles dans le texte, avec une note explicative
  alternative: idoles répugnantes / idoles d’excréments
  rationale: Le terme d’Ézéchiel est délibérément dépréciatif. Le texte principal reste naturel et mesuré, tandis que la note préserve cette force lexicale sans imposer une expression française excessivement interprétative.
- issue: Désignation des générations précédentes par אֲבוֹתָם
  choice: de leurs pères
  alternative: de leurs ancêtres
  rationale: L’hébreu emploie précisément le masculin pluriel « pères »; le conserver respecte la formulation familiale du texte source.
translation_notes:
  register: Français international moderne, digne et accessible. La structure causale est conservée comme prolongement du verset précédent. Le plus-que-parfait situe naturellement ces manquements avant l’action divine évoquée dans le contexte, et « restaient fixés » préserve l’image concrète des yeux ainsi que l’idée d’une orientation durable.
