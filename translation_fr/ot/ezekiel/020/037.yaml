  text: וְ/הַעֲבַרְתִּ֥י אֶתְ/כֶ֖ם תַּ֣חַת הַ/שָּׁ֑בֶט וְ/הֵבֵאתִ֥י אֶתְ/כֶ֖ם בְּ/מָסֹ֥רֶת הַ/בְּרִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/037.yaml
  text: I will make you pass under the rod[b][a], and I will bring you into the bond of the covenant.
translation:
  language: fr
  text: Je vous ferai passer sous le bâton[a] et je vous ferai entrer dans le lien de l’alliance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Passer « sous le bâton » évoque probablement le dénombrement ou l’inspection d’un troupeau passant sous le bâton du berger.
    reason: cultural_note
  - marker: b
    text: Ou « dans l’entrave de l’alliance » ou « dans l’obligation de l’alliance ». Le mot hébreu traduit par « lien » est rare et évoque le fait d’être lié ou contraint par rapport à l’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתִּי
  choice: Je vous ferai passer
  rationale: Le hifil de עבר a une valeur causative, que « ferai passer » rend clairement et naturellement.
- source_word: תַּחַת הַשָּׁבֶט
  choice: sous la houlette
  rationale: שֵׁבֶט peut désigner un bâton ou une verge. Dans cette image pastorale de dénombrement ou d’inspection du troupeau, « houlette » rend naturellement en français le bâton du berger, sans éliminer la dimension d’autorité.
- source_word: וְהֵבֵאתִי
  choice: je vous ferai entrer
  rationale: Le hifil de בוא signifie « faire venir, faire entrer ». Avec בְ, « faire entrer dans » exprime bien le mouvement vers une situation contraignante liée à l’alliance.
- source_word: בְּמָסֹרֶת
  choice: dans le lien
  rationale: מָסֹרֶת est un terme rare évoquant ce qui lie ou contraint. « Lien » conserve la métaphore et son ambiguïté entre attachement et obligation, sans imposer l’image trop physique des chaînes.
- source_word: הַבְּרִית
  choice: l’alliance
  rationale: בְּרִית est le terme biblique courant pour une relation formellement établie; « alliance » en préserve la portée reconnue en français.
theological_decisions:
- issue: Portée de l’image du passage sous la houlette et du lien de l’alliance
  choice: Conserver ensemble les idées d’examen souverain et d’assujettissement à l’alliance, sans préciser si l’accent est surtout punitif ou restaurateur.
  alternative: Interpréter explicitement l’image soit comme une punition et une contrainte, soit comme une réintégration bienveillante dans la communion de l’alliance.
  rationale: Le contexte et les métaphores permettent à la fois le jugement, la sélection et un renouvellement de l’appartenance à l’alliance. Le texte français maintient cette tension.
translation_notes:
  register: Français moderne, international et digne. « Houlette » est légèrement littéraire mais reste intelligible et précise l’image pastorale; la note en explicite la pratique. « Lien de l’alliance » garde la formulation métaphorique et l’ambivalence du terme hébreu rare.
