  text: וָ/אֹמַ֣ר אֲלֵ/הֶ֔ם מָ֣ה הַ/בָּמָ֔ה אֲשֶׁר אַתֶּ֥ם הַ/בָּאִ֖ים שָׁ֑ם וַ/יִּקָּרֵ֤א שְׁמָ/הּ֙ בָּמָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/029.yaml
  text: Then I said to them, ‘What is this high place where you are going?’ So its name is called Bamah to this day.
translation:
  language: fr
  text: 'Je leur ai dit : « Qu’est-ce que ce haut lieu où vous allez ? » Et on l’appelle Bama jusqu’à ce jour.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bama transcrit le mot hébreu qui signifie « haut lieu ». Le verset fait ainsi un jeu sur ce mot; sa portée exacte est incertaine.
    reason: Le français ne peut pas reproduire pleinement l’identité entre le nom commun et le nom donné au lieu en hébreu.
lexical_decisions:
- source_word: בָּמָה (bāmâ)
  choice: haut lieu / Bama
  rationale: Le premier emploi désigne un lieu de culte surélevé; le second fonctionne comme son nom propre et conserve en français le jeu de mots hébreu autant que possible.
- source_word: מָה הַבָּמָה
  choice: Qu’est-ce que ce haut lieu
  rationale: Reproduit la question hébraïque concise et son possible effet critique, sans expliciter une étymologie incertaine.
- source_word: הַבָּאִים שָׁם
  choice: où vous allez
  rationale: Rend idiomatiquement le participe avec l’adverbe de lieu, littéralement « où vous venez/entrez » dans le contexte d’une destination.
- source_word: וַיִּקָּרֵא שְׁמָהּ
  choice: on l’appelle
  rationale: Le passif hébreu de dénomination est rendu par une tournure impersonnelle française naturelle, avec une valeur maintenue jusqu’au présent.
theological_decisions:
- issue: Portée polémique du nom Bama
  choice: Conserver le nom Bama sans lui attribuer un sens théologique explicite
  alternative: Expliquer dans le texte que le nom constitue une condamnation ou un jeu étymologique
  rationale: Le verset met clairement en relief le terme, mais la nature exacte du jeu de mots reste discutée; la traduction ne doit pas trancher au-delà du texte.
translation_notes:
  register: Français moderne, clair et digne. La question reste brève et incisive. « Jusqu’à ce jour » conserve la formule narrative traditionnelle et précise de l’hébreu.
