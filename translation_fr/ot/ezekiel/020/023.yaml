  text: גַּם אֲנִ֗י נָשָׂ֧אתִי אֶת יָדִ֛/י לָ/הֶ֖ם בַּ/מִּדְבָּ֑ר לְ/הָפִ֤יץ אֹתָ/ם֙ בַּ/גּוֹיִ֔ם וּ/לְ/זָר֥וֹת אוֹתָ֖/ם בָּ/אֲרָצֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/023.yaml
  text: Moreover[a], I also raised my hand to them in the wilderness, to scatter them among the nations and disperse them through the lands.
translation:
  language: fr
  text: Moi aussi, dans le désert, j’ai levé ma main vers eux[a], jurant de les disperser parmi les nations et de les disséminer à travers les pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression « lever la main » désigne ici le geste par lequel on prête serment. On pourrait traduire : « Dans le désert, je leur ai juré de les disperser parmi les nations et de les disséminer à travers les pays. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: Moi aussi
  rationale: Rend naturellement en français la valeur additive et emphatique de גַּם avec le pronom explicite אֲנִי.
- source_word: נָשָׂאתִי אֶת יָדִי לָהֶם
  choice: j’ai levé la main vers eux
  rationale: Préserve l’image concrète de l’idiome hébreu du serment; « vers eux » convient au geste orienté vers les personnes concernées.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: « Désert » est naturel en français biblique moderne pour le lieu aride où Israël a séjourné, sans exclure le sens plus large de région sauvage.
- source_word: לְהָפִיץ אֹתָם בַּגּוֹיִם
  choice: de les disperser parmi les nations
  rationale: Exprime la dispersion punitive au sein de peuples étrangers et conserve « nations » pour גּוֹיִם.
- source_word: וּלְזָרוֹת אוֹתָם בָּאֲרָצוֹת
  choice: et de les disséminer dans les différents pays
  rationale: Distingue le second verbe du premier tout en gardant le parallélisme; « les différents pays » restitue le pluriel et la répartition géographique.
theological_decisions:
- issue: Faut-il expliciter l’idiome du geste de serment?
  choice: Conserver « j’ai levé la main vers eux » dans le texte et ajouter « jurant de » pour relier clairement le geste au contenu du serment.
  alternative: « je leur ai juré dans le désert de les disperser… »
  rationale: Cette formulation garde l’image hébraïque tout en évitant que le lecteur moderne ne prenne le geste pour une simple menace ou une action non précisée. Elle rend explicite la fonction syntaxique des infinitifs comme contenu du serment sans effacer l’idiome.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme des deux verbes de dispersion est conservé sans répétition lourde; l’image du serment reste visible et son sens est clarifié.
