    rationale: Le texte hébreu porte explicitement « ma main » (יָדִי). En français, « ma main » conserve cette précision sans alourdir la phrase.
  - severity: low
    issue: « Les différents pays » ajoute une nuance non présente dans le texte source.
    rationale: Le pluriel « les pays » / « les terres » suffit à rendre בָּאֲרָצוֹת; « différents » introduit une distinction supplémentaire.
  - severity: low
    issue: La position de « dans le désert » est légèrement moins nette.
    rationale: Le placer avant le verbe principal rend plus immédiatement la localisation de l’acte de serment, telle que l’exprime l’hébreu.
