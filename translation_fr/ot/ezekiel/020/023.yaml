review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est fidèle : l’addition emphatique, le geste de serment, le désert et la double dispersion sont tous présents. Toutefois, « la main » atténue inutilement le possessif hébreu (« ma main »), et « les différents pays » ajoute l’idée de différenciation, qui n’est pas exprimée par le simple pluriel אַרָצוֹת.'
  naturalness: La formulation révisée reste naturelle en français international moderne. Le déplacement de « dans le désert » près de l’action qu’il situe suit plus clairement la syntaxe hébraïque, et « à travers les pays » exprime idiomatiquement la dispersion géographique.
  terminology: « Nations » convient pour גּוֹיִם. « Disperser » puis « disséminer » maintiennent utilement le parallélisme de הָפִיץ et זָרָה sans répétition pesante. La note préserve correctement l’alternative interprétative « jurer ».
