revisions:
- from: Moi aussi, j’ai levé la main vers eux dans le désert[a], jurant de les disperser parmi les nations et de les disséminer dans les différents pays.
  to: Moi aussi, dans le désert, j’ai levé ma main vers eux[a], jurant de les disperser parmi les nations et de les disséminer à travers les pays.
  rationale: La révision rend le possessif explicite, retire l’ajout sémantique « différents » et améliore l’alignement syntaxique avec le texte hébreu. Elle conserve l’image concrète du geste et explicite prudemment, par « jurant de » et par la note, sa valeur de serment.
