source:
  edition: WLC
  text: וָ/אֹמַ֤ר אֶל בְּנֵי/הֶם֙ בַּ/מִּדְבָּ֔ר בְּ/חוּקֵּ֤י אֲבֽוֹתֵי/כֶם֙ אַל תֵּלֵ֔כוּ וְ/אֶת מִשְׁפְּטֵי/הֶ֖ם אַל תִּשְׁמֹ֑רוּ וּ/בְ/גִלּוּלֵי/הֶ֖ם אַל תִּטַּמָּֽאוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/018.yaml
  text: And I said to their children in the wilderness[a], ‘Do not walk in the statutes of your fathers, and do not keep their judgments, and do not defile yourselves with their idols.’
translation:
  language: fr
  text: 'Je dis à leurs enfants dans le désert : « Ne suivez pas les prescriptions de vos pères, n’observez pas leurs règles et ne vous rendez pas impurs par leurs idoles[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu גִּלּוּלִים est un terme fortement méprisant pour désigner les idoles; on pourrait aussi traduire « idoles immondes », voire « idoles-ordures ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Je dis
  rationale: Le wayyiqtol poursuit le récit par une action passée successive. En français narratif, le passé simple rend naturellement cette progression sans devoir ajouter « et ».
- source_word: בְּנֵיהֶם
  choice: leurs enfants
  rationale: בנים peut désigner les fils ou, plus largement, les enfants. Ici, il s’agit de la génération suivante d’Israël.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne une région inculte ou désertique. « Dans le désert » est naturel en français et convient au cadre de l’Exode.
- source_word: בְּחוּקֵּי
  choice: les prescriptions
  rationale: חֻקִּים désigne des dispositions prescrites. Avec הלך, le français idiomatique emploie « suivre »; « prescriptions » conserve la nuance normative.
- source_word: אֲבוֹתֵיכֶם
  choice: vos pères
  rationale: Le terme masculin pluriel renvoie ici à la génération précédente. « Vos pères » préserve la forme et la portée ancestrale de l’hébreu.
- source_word: אַל תֵּלֵכוּ
  choice: ne suivez pas
  rationale: Littéralement « ne marchez pas dans »; dans cet idiome, הלך décrit une conduite réglée sur des prescriptions. « Ne suivez pas » restitue clairement le sens en français actuel.
- source_word: מִשְׁפְּטֵיהֶם
  choice: leurs règles
  rationale: מִשְׁפָּטִים peut désigner des décisions, règles ou ordonnances. « Règles » maintient une distinction naturelle avec חֻקִּים, rendu par « prescriptions ».
- source_word: תִּשְׁמֹרוּ
  choice: n’observez pas
  rationale: שׁמר appliqué à des règles signifie les garder ou les observer. « Observer » est l’expression juridique naturelle en français.
- source_word: גִּלּוּלֵיהֶם
  choice: leurs idoles[a]
  rationale: גִּלּוּלִים désigne les idoles avec une forte nuance de mépris. « Idoles » reste clair et digne dans le texte, tandis que la note signale la connotation péjorative.
- source_word: תִּטַּמָּאוּ
  choice: ne vous rendez pas impurs
  rationale: La forme hitpael exprime ici l’impureté contractée par le rapport aux idoles. Cette formulation conserve la dimension réflexive et la notion rituelle et morale d’impureté.
theological_decisions:
- issue: Sens ancestral de אֲבוֹתֵיכֶם
  choice: vos pères
  alternative: vos ancêtres
  rationale: « Vos pères » correspond directement au masculin pluriel hébreu et souligne le contraste avec leurs enfants, sans empêcher la portée générationnelle du terme.
- issue: Force méprisante de גִּלּוּלִים
  choice: idoles dans le texte, avec une note explicative
  alternative: ordures idolâtriques / idoles immondes
  rationale: Le caractère dépréciatif est réel, mais une expression crue dans le corps du texte risquerait de surcharger ou de particulariser la traduction. La note préserve cette donnée lexicale sans l’effacer.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe privilégie l’idiome français (« suivre des prescriptions ») plutôt qu’un calque de « marcher dans », tout en conservant les distinctions entre les termes juridiques hébreux et la notion d’impureté.
