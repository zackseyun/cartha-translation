  text: הֲ/תִשְׁפֹּ֣ט אֹתָ֔/ם הֲ/תִשְׁפּ֖וֹט בֶּן אָדָ֑ם אֶת תּוֹעֲבֹ֥ת אֲבוֹתָ֖/ם הוֹדִיעֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/004.yaml
  text: Will you judge them? Will you judge[b][a], son of man? Make known to them the abominations of their fathers.
translation:
  language: fr
  text: Les jugeras-tu ? Jugeras-tu, fils d’homme[b] ? Fais-leur connaître les abominations de leurs pères[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs ancêtres ». L’hébreu dit littéralement « leurs pères ».
    reason: lexical_alternative
  - marker: b
    text: '« Fils d’homme » est la formule habituelle par laquelle Ézéchiel est interpellé ; autres traductions possibles : « mortel » ou « être humain ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִשְׁפֹּט / הֲתִשְׁפּוֹט
  choice: Les jugeras-tu ? Les jugeras-tu
  rationale: Le qal de שׁפט a ici un sens judiciaire. La répétition rhétorique de l’hébreu est conservée, ainsi que la nuance interrogative marquée par הֲ.
- source_word: בֶּן אָדָם
  choice: fils d’homme
  rationale: Cette expression est la formule habituelle par laquelle Ézéchiel est interpellé. « Fils d’homme » conserve l’image hébraïque et sa forme masculine sans lui imposer ici un sens messianique ultérieur.
- source_word: תּוֹעֲבוֹת
  choice: abominations
  rationale: Dans Ézéchiel, le terme désigne avec une grande force morale et cultuelle des actes détestables, souvent idolâtres ou profanateurs. « Abominations » en préserve la gravité.
- source_word: אֲבוֹתָם
  choice: leurs pères
  rationale: Le texte hébreu dit littéralement « leurs pères ». Cette formulation garde la dimension familiale et généalogique; « leurs ancêtres » reste une traduction contextuelle possible.
- source_word: הוֹדִיעֵם
  choice: Fais-leur connaître
  rationale: 'Le hiphil de ידע exprime la causation: faire savoir ou faire connaître. La formulation française conserve cette valeur tout en restant naturelle.'
theological_decisions:
- issue: Portée de בֶּן אָדָם
  choice: fils d’homme
  alternative: mortel; être humain
  rationale: Il s’agit ici de l’appellation prophétique habituelle d’Ézéchiel. La traduction maintient l’idiome hébreu sans transformer ce verset en affirmation messianique directe.
- issue: Portée généalogique de אֲבוֹתָם
  choice: leurs pères
  alternative: leurs ancêtres
  rationale: Le choix principal reflète précisément le masculin et la métaphore familiale du texte; l’autre possibilité est signalée sans effacer la formulation de l’hébreu.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’ordre des compléments est légèrement adapté au français, tandis que la répétition emphatique, l’interpellation prophétique et la forte qualification morale de l’hébreu sont préservées.
