source:
  edition: WLC
  text: וָ/אֶתֵּ֤ן לָ/הֶם֙ אֶת חֻקּוֹתַ֔/י וְ/אֶת מִשְׁפָּטַ֖/י הוֹדַ֣עְתִּי אוֹתָ֑/ם אֲשֶׁ֨ר יַעֲשֶׂ֥ה אוֹתָ֛/ם הָ/אָדָ֖ם וָ/חַ֥י בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/011.yaml
  text: I gave them my statutes[a], and I made my judgments known to them, which, if a man does them, he will live by them.
translation:
  language: fr
  text: 'Je leur ai donné mes prescriptions et je leur ai fait connaître mes ordonnances : l’homme[a] qui les met en pratique vivra grâce à elles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « l’homme » désigne de manière représentative toute personne, ou l’être humain en général.
    reason: Le singulier hébreu הָאָדָם a une portée générique que la formulation française pourrait autrement sembler limiter aux hommes de sexe masculin.
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: J’ai donné
  rationale: Le verbe נתן exprime ici simplement le fait de donner, dans le cadre de la loi de l’alliance.
- source_word: חֻקּוֹתַי
  choice: mes prescriptions
  rationale: חֻקּוֹת désigne des dispositions établies. « Prescriptions » garde le registre juridique et se distingue naturellement de « règles ».
- source_word: מִשְׁפָּטַי
  choice: mes règles
  rationale: Dans ce contexte légal, מִשְׁפָּטִים désigne les règles ou ordonnances communiquées par Dieu. « Règles » est clair en français moderne tout en maintenant la distinction avec חֻקּוֹת.
- source_word: הוֹדַעְתִּי אוֹתָם
  choice: leur ai fait connaître
  rationale: Le hiphil de ידע signifie littéralement « faire connaître »; cette formulation évite l’interprétation plus étroite « enseigner ».
- source_word: אֲשֶׁר יַעֲשֶׂה אוֹתָם
  choice: qui les met en pratique
  rationale: Pour des prescriptions et des règles, « mettre en pratique » rend naturellement le sens de עשׂה sans réduire l’action à une exécution ponctuelle.
- source_word: הָאָדָם
  choice: L’homme
  rationale: Le nom singulier défini a ici une valeur représentative et désigne l’être humain qui agit ainsi. La note explicite cette portée inclusive.
- source_word: וָחַי בָּהֶם
  choice: vivra par elles
  rationale: Cette traduction conserve le lien exprimé par ב entre la vie et les prescriptions, sans préciser si la vie envisagée est temporelle, collective ou eschatologique.
theological_decisions:
- issue: Portée de la vie promise en lien avec l’obéissance
  choice: « vivra par elles », sans explication doctrinale ajoutée
  alternative: « grâce à elles, il conservera la vie » ou « il obtiendra la vie éternelle par elles »
  rationale: Le texte ne précise pas ici toute la portée de cette vie. La traduction préserve donc la tension entre les dimensions individuelle, collective, temporelle et eschatologique possibles.
translation_notes:
  register: Français international moderne, clair et digne. « Prescriptions » et « règles » maintiennent le registre juridique sans archaïsme; deux phrases brèves rendent le lien logique plus naturel en français.
