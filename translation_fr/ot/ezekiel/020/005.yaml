  verdict: revise
  source_fidelity: 'La traduction rend correctement la structure, les temps verbaux et les principaux éléments du verset : l’élection d’Israël, la descendance de la maison de Jacob, la révélation en Égypte et la formule « Je suis Yahweh, votre Dieu ». Toutefois, « devant les descendants » et « devant eux » ne rendent pas adéquatement la préposition לוׄ/לָהֶם (« à, envers ») : le geste est dirigé vers eux, non simplement accompli en leur présence.'
