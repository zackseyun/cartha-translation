  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ בְּ/יוֹם֙ בָּחֳרִ֣/י בְ/יִשְׂרָאֵ֔ל וָ/אֶשָּׂ֣א יָדִ֗/י לְ/זֶ֨רַע֙ בֵּ֣ית יַֽעֲקֹ֔ב וָ/אִוָּדַ֥ע לָ/הֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם וָ/אֶשָּׂ֨א יָדִ֤/י לָ/הֶם֙ לֵ/אמֹ֔ר אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/005.yaml
  text: 'And say to them[a], ‘Thus says the Lord GOD: On the day when I chose Israel, I lifted up my hand to the offspring of the house of Jacob and made myself known to them in the land of Egypt; I lifted up my hand to them, saying, “I am Yahweh your God.”’'
translation:
  language: fr
  text: 'Tu leur diras : « Voici ce que dit le Seigneur Yahweh : Le jour où j’ai choisi Israël, j’ai levé la main[a] vers les descendants de la maison de Jacob et je me suis fait connaître à eux dans le pays d’Égypte. J’ai levé la main vers eux en disant : “Je suis Yahweh, votre Dieu.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « j’ai levé ma main ». En hébreu, ce geste exprime souvent un serment ou un engagement solennel.
    reason: Préciser la portée idiomatique de l’image hébraïque conservée dans le texte.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Le titre composé conserve à la fois אֲדֹנָי, « Seigneur », et le nom divin יהוה, rendu « Yahweh », sans produire l’expression peu naturelle « le Seigneur SEIGNEUR ».
- source_word: בְּיוֹם בָּחֳרִי בְיִשְׂרָאֵל
  choice: Le jour où j’ai choisi Israël
  rationale: Cette formulation française naturelle maintient l’expression temporelle explicite בְּיוֹם et le sens d’élection du verbe בחר sans lui ajouter un système théologique.
- source_word: וָאֶשָּׂא יָדִי
  choice: j’ai levé la main
  rationale: La traduction conserve l’image concrète de l’hébreu. Comme ce geste exprime ici un serment ou un engagement solennel, cette portée est précisée en note.
- source_word: לְזֶרַע בֵּית יַעֲקֹב
  choice: devant les descendants de la maison de Jacob
  rationale: « Descendants » exprime naturellement le sens collectif de זֶרַע en français moderne. « Devant » rend la relation du geste envers eux tout en restant compatible avec le contexte de serment.
- source_word: וָאִוָּדַע לָהֶם
  choice: et je me suis fait connaître à eux
  rationale: Le nifal de ידע exprime ici la manifestation de Dieu à son peuple ; la tournure pronominale française en conserve nettement la valeur de révélation de soi.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: dans le pays d’Égypte
  rationale: La traduction garde אֶרֶץ, explicitement présent dans le texte hébreu, et situe pleinement la scène.
- source_word: לֵאמֹר אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: 'en disant : « Je suis Yahweh, votre Dieu. »'
  rationale: La formule d’alliance est rendue directement, avec le nom divin יהוה translittéré « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération préserve le nom propre divin et le distingue du titre אֲדֹנָי dans l’expression composée qui ouvre la déclaration.
- issue: Valeur de l’expression וָאֶשָּׂא יָדִי
  choice: Conserver « j’ai levé la main » dans le texte et expliquer sa valeur de serment en note
  alternative: j’ai juré / je me suis engagé solennellement
  rationale: L’image hébraïque demeure visible, tandis que la note signale sa force idiomatique sans imposer dans le corps du texte une seule paraphrase interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la progression hébraïque, mais la ponctuation et les enchaînements sont adaptés à un français naturel. Le tutoiement correspond à l’adresse divine au prophète.
