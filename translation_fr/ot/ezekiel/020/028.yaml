revisions:
- from: Je les ai donc fait entrer dans le pays que j’avais juré, la main levée, de leur donner[a]. Ils ont vu toute colline élevée et tout arbre au feuillage épais ; là, ils ont offert leurs sacrifices, là, ils ont présenté leurs offrandes qui provoquaient ma colère[b], là, ils ont fait monter leurs parfums apaisants, et là, ils ont répandu leurs offrandes de vin.
  to: Je les ai donc fait entrer dans le pays que j’avais juré de leur donner en levant la main[a]. Ils ont vu toute colline élevée et tout arbre au feuillage épais ; là, ils ont offert leurs sacrifices, là, ils ont présenté leur offrande offensante[b], là, ils ont fait monter leurs parfums apaisants, et là, ils ont répandu leurs offrandes de vin.
  rationale: La révision supprime l’ajout explicite de « ma colère » afin de respecter la formulation hébraïque compacte et de ne pas préciser davantage que le texte. Elle rend aussi l’expression du serment plus naturelle en français, tout en préservant le geste de la main levée et son explication en note. Le reste de la formulation est conservé, car il rend correctement les éléments cultuels et la répétition rhétorique de « là ».
