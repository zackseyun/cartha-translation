    text: 'Littéralement : « la provocation de leur offrande ». L’expression présente leur offrande comme offensante et provocatrice devant Dieu.'
    reason: cultural_note
  revision_rationale: La révision supprime l’ajout explicite de « ma colère » afin de respecter la formulation hébraïque compacte et de ne pas préciser davantage que le texte. Elle rend aussi l’expression du serment plus naturelle en français, tout en préservant le geste de la main levée et son explication en note. Le reste de la formulation est conservé, car il rend correctement les éléments cultuels et la répétition rhétorique de « là ».
