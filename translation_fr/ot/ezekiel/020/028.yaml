source:
  edition: WLC
  text: וָ/אֲבִיאֵ/ם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לָ/תֵ֥ת אוֹתָ֖/הּ לָ/הֶ֑ם וַ/יִּרְאוּ֩ כָל גִּבְעָ֨ה רָמָ֜ה וְ/כָל עֵ֣ץ עָבֹ֗ת וַ/יִּזְבְּחוּ שָׁ֤ם אֶת זִבְחֵי/הֶם֙ וַ/יִּתְּנוּ שָׁם֙ כַּ֣עַס קָרְבָּנָ֔/ם וַ/יָּשִׂ֣ימוּ שָׁ֗ם רֵ֚יחַ נִיח֣וֹחֵי/הֶ֔ם וַ/יַּסִּ֥יכוּ שָׁ֖ם אֶת נִסְכֵּי/הֶֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/028.yaml
  text: So I brought them into the land that I had lifted up my hand to give to them[a], and they saw every high hill and every leafy tree, and there they sacrificed their sacrifices, and there they presented the provocation of their offering, and there they set their pleasing aromas[c][b], and there they poured out their drink offerings.
translation:
  language: fr
  text: Je les ai donc fait entrer dans le pays que j’avais juré de leur donner en levant la main[a]. Ils ont vu toute colline élevée et tout arbre au feuillage épais ; là, ils ont offert leurs sacrifices, là, ils ont présenté leur offrande offensante[b], là, ils ont fait monter leurs parfums apaisants, et là, ils ont répandu leurs offrandes de vin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le pays que j’avais levé la main pour leur donner ». Lever la main était un geste par lequel on prêtait serment.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la provocation de leur offrande ». L’expression présente leur offrande comme offensante et provocatrice devant Dieu.'
    reason: cultural_note
lexical_decisions:
- source_word: וָאֲבִיאֵם
  choice: Je les ai donc fait entrer
  rationale: Le hiphil de בוא signifie « faire entrer » ou « amener ». « Donc » rend ici l’enchaînement narratif du waw sans lourdeur.
- source_word: נָשָׂאתִי אֶת־יָדִי
  choice: j’avais juré, la main levée
  rationale: L’expression désigne un serment. Cette formulation française en explicite le sens tout en conservant l’image concrète du geste.
- source_word: כָל גִּבְעָה רָמָה
  choice: toute colline élevée
  rationale: Traduction descriptive de l’hébreu, qui n’emploie pas ici le terme technique pour « haut lieu ».
- source_word: וְכָל עֵץ עָבֹת
  choice: tout arbre au feuillage épais
  rationale: עָבֹת évoque la densité ou l’épaisseur. La formulation rend naturellement l’image d’un arbre touffu propice aux rites idolâtres.
- source_word: וַיִּזְבְּחוּ שָׁם אֶת־זִבְחֵיהֶם
  choice: là, ils ont offert leurs sacrifices
  rationale: « Offrir des sacrifices » est naturel en français et rend l’acte cultuel, même si la répétition étymologique du verbe et du nom hébreux n’est pas reproductible avec élégance.
- source_word: וַיִּתְּנוּ שָׁם כַּעַס קָרְבָּנָם
  choice: là, ils ont présenté leurs offrandes qui provoquaient ma colère
  rationale: La tournure hébraïque condensée associe l’offrande à la provocation ou à la colère. La formulation française en explicite la relation, l’objet divin étant clairement indiqué par le discours à la première personne.
- source_word: וַיָּשִׂימוּ שָׁם רֵיחַ נִיחוֹחֵיהֶם
  choice: là, ils ont fait monter leurs parfums apaisants
  rationale: רֵיחַ נִיחוֹחַ est une formule sacrificielle. « Parfums apaisants » conserve sa dimension cultuelle et l’ironie du réemploi pour un culte idolâtre ; « faire monter » est idiomatique en français dans ce contexte.
- source_word: וַיַּסִּיכוּ שָׁם אֶת־נִסְכֵּיהֶם
  choice: là, ils ont répandu leurs offrandes de vin
  rationale: Les נְסָכִים sont des libations. « Offrandes de vin » est transparent pour le lecteur moderne, tandis que la note conserve le terme technique.
theological_decisions:
- issue: Expression du serment divin נָשָׂא יָד
  choice: j’avais juré, la main levée
  alternative: j’avais levé la main pour leur donner
  rationale: La traduction réunit le sens idiomatique du serment et l’image hébraïque, sans obliger le lecteur à déduire seul la valeur du geste.
- issue: Nature des lieux de culte illicites
  choice: toute colline élevée et tout arbre au feuillage épais
  alternative: tout haut lieu et tout arbre verdoyant
  rationale: L’hébreu est descriptif plutôt que technique. La traduction préserve donc le paysage concret sans introduire le nom cultuel « haut lieu » absent du verset.
- issue: כַּעַס appliqué à l’offrande
  choice: leurs offrandes qui provoquaient ma colère
  alternative: la provocation de leur offrande
  rationale: Le français explicite la relation condensée en hébreu. La première personne est justifiée par le locuteur divin, tout en maintenant le jugement porté sur ces offrandes.
- issue: Formule רֵיחַ נִיחוֹחַ dans un contexte idolâtre
  choice: leurs parfums apaisants
  alternative: leurs parfums agréables
  rationale: La formule cultuelle est conservée sans affirmer que Dieu agréait effectivement ces sacrifices idolâtres ; le possessif « leurs » maintient la distance critique du texte.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition de « là » reproduit l’insistance du texte hébreu. Le vocabulaire cultuel reste compréhensible sans effacer les images du serment, du paysage et des sacrifices.
