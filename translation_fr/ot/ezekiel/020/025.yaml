source:
  edition: WLC
  text: וְ/גַם אֲנִי֙ נָתַ֣תִּי לָ/הֶ֔ם חֻקִּ֖ים לֹ֣א טוֹבִ֑ים וּ/מִ֨שְׁפָּטִ֔ים לֹ֥א יִֽחְי֖וּ בָּ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/025.yaml
  text: Moreover[b][a], I myself gave them statutes that were not good and ordinances by which they could not live.
translation:
  language: fr
  text: De plus, je leur ai moi-même donné[a] des prescriptions qui n’étaient pas bonnes et des ordonnances par lesquelles ils ne vivraient pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une interprétation : « je les ai livrés à des prescriptions qui n’étaient pas bonnes ». Cette formulation comprend le don comme un acte de jugement plutôt que comme la promulgation, par Dieu, de lois moralement défectueuses.'
    reason: alternative_reading
  - marker: b
    text: L’expression « vivre par elles » reprend le langage de l’alliance, selon lequel l’obéissance aux prescriptions de Dieu conduit à la vie (voir Lévitique 18.5). Ici, cette expression est délibérément inversée.
    reason: cross_reference
lexical_decisions:
- source_word: וְגַם
  choice: De plus
  rationale: Rend la valeur additive et emphatique de l’expression tout en assurant un enchaînement naturel en français.
- source_word: אֲנִי
  choice: moi-même
  rationale: Le pronom indépendant renforce le sujet déjà marqué dans le verbe; « moi-même » conserve cette insistance.
- source_word: נָתַתִּי
  choice: j’ai donné
  rationale: Conserve le sens lexical direct de נתן sans transformer dans le texte principal cette action en simple permission.
- source_word: חֻקִּים
  choice: prescriptions
  rationale: Terme juridique courant et digne, adapté au contexte législatif et distinct de « règles ».
- source_word: לֹא טוֹבִים
  choice: qui n’étaient pas bonnes
  rationale: Reproduit sobrement la négation hébraïque sans la renforcer en « mauvaises » ni atténuer la tension du texte.
- source_word: וּמִשְׁפָּטִים
  choice: et des règles
  rationale: Rend le sens juridique de מִשְׁפָּטִים dans un français moderne et accessible, tout en le distinguant de חֻקִּים.
- source_word: לֹא יִחְיוּ בָּהֶם
  choice: par lesquelles ils ne pourraient pas vivre
  rationale: Préserve l’image biblique de « vivre par » les commandements et exprime naturellement en français la portée modale ou résultative de l’imparfait hébreu dans ce contexte.
theological_decisions:
- issue: Faut-il atténuer l’affirmation selon laquelle Dieu a « donné » des prescriptions qui n’étaient pas bonnes?
  choice: 'Maintenir dans le texte principal : « moi-même, je leur ai donné »'
  alternative: « je les ai livrés à des prescriptions qui n’étaient pas bonnes »
  rationale: L’hébreu emploie directement נתן, « donner », avec Dieu pour sujet. La traduction conserve donc la formulation saisissante du texte au lieu d’y intégrer une solution théologique; l’interprétation judiciaire possible est signalée en note.
- issue: Rapport entre ce verset et les passages affirmant la bonté de la loi divine
  choice: 'Traduire sans qualification : « qui n’étaient pas bonnes »'
  alternative: Comprendre ces prescriptions comme des pratiques nuisibles auxquelles Dieu les aurait livrés, ou comme des prescriptions étrangères et idolâtres
  rationale: Le verset formule explicitement cette tension. La traduction ne précise pas l’identité des prescriptions au-delà de ce que dit le texte et laisse l’interprétation à l’exégèse.
translation_notes:
  register: Français international moderne, sobre et digne. Le vocabulaire juridique reste accessible. La formulation directe préserve l’ambiguïté et la tension théologique de l’hébreu sans imposer une harmonisation dans le texte principal.
