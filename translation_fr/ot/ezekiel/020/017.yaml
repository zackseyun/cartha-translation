source:
  edition: WLC
  text: וַ/תָּ֧חָס עֵינִ֛/י עֲלֵי/הֶ֖ם מִֽ/שַּׁחֲתָ֑/ם וְ/לֹֽא עָשִׂ֧יתִי אוֹתָ֛/ם כָּלָ֖ה בַּ/מִּדְבָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/017.yaml
  text: But my eye spared them from destroying them[a], and I did not make a complete end of them in the wilderness.
translation:
  language: fr
  text: Mais mon œil les a épargnés, au lieu de les détruire[a], et je ne les ai pas entièrement anéantis dans le désert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « mon œil les a épargnés de les détruire » ; l’expression évoque le regard compatissant qui retient la destruction.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּחָס
  choice: a pris en pitié
  rationale: Le verbe חוס exprime la pitié qui conduit à épargner. « A pris en pitié » convient naturellement avec l’image du « mon œil » et met en valeur la compassion qui retient le jugement.
- source_word: עֵינִי
  choice: mon œil
  rationale: Le singulier concret de l’hébreu est conservé afin de maintenir l’image anthropomorphique vive du regard compatissant de Dieu.
- source_word: עֲלֵיהֶם
  choice: les
  rationale: Avec חוס, la préposition introduit les personnes qui font l’objet de la compassion ; le pronom objet est la formulation française naturelle.
- source_word: מִשַּׁחֲתָם
  choice: les a préservés de la destruction
  rationale: La préposition מן suivie de l’infinitif construit de שׁחת indique que la compassion divine retient leur destruction. Cette formulation rend clairement le sens verbal tout en restant idiomatique en français.
- source_word: וְלֹא עָשִׂיתִי אוֹתָם כָּלָה
  choice: je ne les ai pas exterminés
  rationale: L’expression עשה כלה désigne une destruction complète. « Exterminés » en rend la force totale de manière concise et compréhensible.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: Dans le contexte de l’Exode, « désert » est le terme français courant et établi pour מדבר, désignant la région inhabitée traversée par Israël.
theological_decisions:
- issue: Expression anthropomorphique de la compassion divine
  choice: Conserver « mon œil les a pris en pitié »
  alternative: « J’ai eu pitié d’eux » ou « mon regard compatissant s’est posé sur eux »
  rationale: L’hébreu fait intentionnellement de « mon œil » le sujet. Garder cette image préserve la force rhétorique du texte sans transformer la compassion divine en formulation abstraite.
translation_notes:
  register: Français moderne, digne et accessible. L’image concrète « mon œil » est volontairement conservée, tandis que la construction hébraïque avec l’infinitif est rendue par une formulation française naturelle. Le point-virgule maintient le parallélisme entre la compassion qui épargne et l’absence d’extermination totale.
