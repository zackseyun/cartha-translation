  source_fidelity: 'Le projet conserve bien l’image anthropomorphique au singulier (« mon œil ») et le cadre du désert. Toutefois, « je ne les ai pas exterminés » ne rend pas la nuance de כָּלָה : le texte ne dit pas simplement qu’aucune extermination n’a eu lieu, mais que Dieu n’a pas consommé leur destruction, c’est-à-dire ne les a pas anéantis entièrement.'
  naturalness: « Mon œil les a pris en pitié » est compréhensible et proche de l’hébreu, mais « mon œil les a épargnés » est plus direct et idiomatique tout en conservant l’image. « Au lieu de les détruire » rend naturellement la construction hébraïque « les épargnant de les détruire ».
  terminology: « Anéantir entièrement » rend avec sobriété la portée d’« faire une fin complète ». « Désert » convient au contexte de l’Exode. Aucun terme théologique confessionnel n’est introduit.
