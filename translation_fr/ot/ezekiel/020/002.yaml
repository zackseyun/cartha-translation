  text: And the word of Yahweh came to me[a], saying,
translation:
  language: fr
  text: 'La parole de Yahvé me fut adressée en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans cette formule prophétique, le waw consécutif avec היה introduit la venue de la parole divine. En français naturel, « la parole… me fut adressée » rend idiomatiquement l’événement sans le calque lourd « il arriva que ».
- source_word: דְבַר
  choice: la parole
  rationale: Dans la formule דְבַר יְהוָה, « la parole » désigne une communication divine précise et conserve le lien avec la formule prophétique récurrente.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin représenté par le tétragramme, plutôt qu’un remplacement par le titre « le Seigneur ».
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » exprime naturellement en français le sens de « vers moi / à moi ».
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'L’infinitif hébreu introduit le contenu du discours qui suit. « En ces termes : » remplit cette fonction avec naturel et dignité en français contemporain.'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte directement le nom divin. Le rendre par « Yahvé » préserve le nom propre au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La formulation idiomatique « me fut adressée » conserve la formule prophétique et prépare directement la citation du verset suivant.
