source:
  edition: WLC
  text: וַ/יַּמְרוּ בִ֨/י בֵֽית יִשְׂרָאֵ֜ל בַּ/מִּדְבָּ֗ר בְּ/חֻקּוֹתַ֨/י לֹא הָלָ֜כוּ וְ/אֶת מִשְׁפָּטַ֣/י מָאָ֗סוּ אֲשֶׁר֩ יַעֲשֶׂ֨ה אֹתָ֤/ם הָֽ/אָדָם֙ וָ/חַ֣י בָּ/הֶ֔ם וְ/אֶת שַׁבְּתֹתַ֖/י חִלְּל֣וּ מְאֹ֑ד וָ/אֹמַ֞ר לִ/שְׁפֹּ֨ךְ חֲמָתִ֧/י עֲלֵי/הֶ֛ם בַּ/מִּדְבָּ֖ר לְ/כַלּוֹתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/013.yaml
  text: But the house of Israel rebelled against me in the wilderness[a]. They did not walk in my statutes, and they rejected my judgments, which if a person does them, he will live by them. They greatly profaned my Sabbaths. Then I said I would pour out my wrath on them in the wilderness[c][b], to put an end to them.
translation:
  language: fr
  text: 'Mais la maison d’Israël s’est révoltée contre moi dans le désert. Ils n’ont pas suivi mes prescriptions et ont rejeté mes règles : quiconque les met en pratique vivra par elles.[a] Ils ont gravement profané mes sabbats. Alors j’ai dit que je déverserais ma fureur sur eux dans le désert, pour les anéantir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette formulation reprend Lévitique 18.5.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּמְרוּ בִי
  choice: s’est révoltée contre moi
  rationale: Le verbe מרה construit avec ב exprime une rébellion dirigée contre Dieu. Le singulier français assure l’accord naturel avec le collectif « la maison d’Israël ».
- source_word: בֵית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Conserve la désignation collective et prophétique de l’hébreu.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: « Désert » est le terme courant en français biblique moderne pour le cadre de l’errance d’Israël, sans exiger l’idée d’une étendue entièrement sablonneuse.
- source_word: בְּחֻקּוֹתַי לֹא הָלָכוּ
  choice: Ils n’ont pas suivi mes prescriptions
  rationale: « Suivre » rend naturellement en français l’image hébraïque de marcher selon des prescriptions, tandis que « prescriptions » exprime le caractère normatif de חֻקּוֹת.
- source_word: מִשְׁפָּטַי
  choice: mes règles
  rationale: Dans ce contexte légal et alliance, מִשְׁפָּטִים désigne des règles ou décisions normatives. « Règles » est clair et distinct de « prescriptions » sans surcharger la phrase de jargon juridique.
- source_word: מָאָסוּ
  choice: ils ont rejeté
  rationale: Exprime nettement le refus volontaire, sans imposer une nuance émotionnelle plus forte que le texte.
- source_word: אֲשֶׁר יַעֲשֶׂה אֹתָם הָאָדָם וָחַי בָּהֶם
  choice: celles que l’être humain doit mettre en pratique pour vivre par elles
  rationale: Rend la construction relative et préserve la formule « vivre par elles », ainsi que son écho à Lévitique 18.5, sans définir davantage la nature de la vie promise.
- source_word: הָאָדָם
  choice: l’être humain
  rationale: Ici, אָדָם a une portée générique et représentative. « L’être humain » conserve le singulier et inclut naturellement toute personne en français moderne.
- source_word: שַׁבְּתֹתַי
  choice: mes sabbats
  rationale: Le pluriel de l’hébreu est conservé, de même que le terme biblique qui désigne les jours consacrés du repos.
- source_word: חִלֵּלוּ מְאֹד
  choice: ont gravement profané
  rationale: « Profaner » rend le piel de חלל et « gravement » communique l’intensification de מְאֹד dans un français naturel.
- source_word: לִשְׁפֹּךְ חֲמָתִי
  choice: je déverserais ma fureur
  rationale: L’infinitif après « j’ai dit » exprime ici l’action envisagée. « Déverser ma fureur » conserve l’image forte et la valeur judiciaire de חֲמָה.
- source_word: לְכַלּוֹתָם
  choice: afin de les exterminer
  rationale: Le piel de כלה exprime ici l’achèvement destructeur; « exterminer » restitue plus directement sa force que le plus vague « mettre fin à leur existence ».
theological_decisions:
- issue: Portée générique de הָאָדָם dans la formule de vie liée aux commandements
  choice: l’être humain doit mettre en pratique… pour vivre par elles
  alternative: l’homme les mettra en pratique et vivra par elles
  rationale: Le nom singulier est générique dans ce contexte. La formulation choisie le rend sans limiter indûment la promesse aux hommes de sexe masculin.
- issue: Nature de la vie dans וָחַי בָּהֶם
  choice: vivre par elles
  alternative: rester en vie grâce à elles
  rationale: La formulation retenue préserve l’ambiguïté et la tension théologique de la formule de Lévitique 18.5, sans la réduire à la survie physique ni l’élargir explicitement à la vie éternelle.
- issue: Intention divine de jugement dans וָאֹמַר לִשְׁפֹּךְ
  choice: j’ai dit que je déverserais
  alternative: j’ai décidé de déverser
  rationale: La traduction conserve le verbe « dire » du texte et n’interprète pas la déclaration comme une décision irrévocable.
translation_notes:
  register: Français international moderne, digne et accessible. Les pronoms pluriels reprennent les membres du collectif « la maison d’Israël », tandis que le verbe initial reste au singulier. La syntaxe hébraïque est légèrement réorganisée pour éviter une relative lourde, tout en conservant la formule « vivre par elles ».
