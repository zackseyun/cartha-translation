- from: Mais la maison d’Israël s’est révoltée contre moi dans le désert. Ils n’ont pas suivi mes prescriptions et ils ont rejeté mes règles, celles que l’être humain doit mettre en pratique pour vivre par elles.[a] Ils ont gravement profané mes sabbats. Alors j’ai dit que je déverserais ma fureur sur eux dans le désert, afin de les exterminer.
  to: 'Mais la maison d’Israël s’est révoltée contre moi dans le désert. Ils n’ont pas suivi mes prescriptions et ont rejeté mes règles : quiconque les met en pratique vivra par elles.[a] Ils ont gravement profané mes sabbats. Alors j’ai dit que je déverserais ma fureur sur eux dans le désert, pour les anéantir.'
  rationale: La révision restitue la construction générique de l’hébreu sans ajouter l’idée explicite d’un devoir ni présenter la vie comme le seul but grammatical de l’observance. « Quiconque » préserve la portée représentative du singulier hébreu dans un français international naturel; « vivra par elles » conserve l’ambiguïté théologique et l’écho à Lévitique 18.5. L’ancre de renvoi est maintenue au terme de la formule concernée.
