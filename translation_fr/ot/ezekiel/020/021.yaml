  to: Mais leurs enfants se révoltèrent contre moi. Ils ne suivirent pas mes prescriptions et ne gardèrent pas mes règles pour les mettre en pratique, règles que l’être humain[a] qui les met en pratique vivra par elles[b]. Ils profanèrent mes sabbats. Alors je dis que je déverserais ma fureur sur eux, afin d’aller jusqu’au bout de ma colère contre eux dans le désert.
