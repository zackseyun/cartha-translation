  text: וַ/יַּמְרוּ בִ֣/י הַ/בָּנִ֗ים בְּ/חֻקּוֹתַ֣/י לֹֽא הָ֠לָכוּ וְ/אֶת מִשְׁפָּטַ֨/י לֹא שָׁמְר֜וּ לַ/עֲשׂ֣וֹת אוֹתָ֗/ם אֲשֶׁר֩ יַעֲשֶׂ֨ה אוֹתָ֤/ם הָֽ/אָדָם֙ וָ/חַ֣י בָּ/הֶ֔ם אֶת שַׁבְּתוֹתַ֖/י חִלֵּ֑לוּ וָ/אֹמַ֞ר לִ/שְׁפֹּ֧ךְ חֲמָתִ֣/י עֲלֵי/הֶ֗ם לְ/כַלּ֥וֹת אַפִּ֛/י בָּ֖/ם בַּ/מִּדְבָּֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/021.yaml
  text: But the children rebelled against me[a]. They did not walk in my statutes, and they did not keep my judgments so as to do them—the judgments that, if a man does them, he will live by them. They profaned my Sabbaths. So I said I would pour out my wrath on them[b], to spend my anger against them in the wilderness.
translation:
  language: fr
  text: Mais leurs enfants se révoltèrent contre moi. Ils ne suivirent pas mes prescriptions et ne gardèrent pas mes règles pour les mettre en pratique, règles que l’être humain[a] qui les met en pratique vivra par elles[b]. Ils profanèrent mes sabbats. Alors je dis que je déverserais ma fureur sur eux, afin d’aller jusqu’au bout de ma colère contre eux dans le désert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’homme », employé ici au sens générique.'
    reason: lexical_alternative
  - marker: b
    text: Cette proposition reprend Lévitique 18.5.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּמְרוּ בִי
  choice: se révoltèrent contre moi
  rationale: Le verbe מרה construit avec ב exprime une rébellion dirigée contre Dieu; « se révolter contre » conserve cette force plus nettement que « désobéir ».
- source_word: הַבָּנִים
  choice: leurs enfants
  rationale: Le terme désigne ici la génération suivante d’Israël. Le possessif, explicité d’après le contexte, rend le lien générationnel naturel en français sans limiter le groupe aux hommes.
- source_word: בְּחֻקּוֹתַי לֹא הָלָכוּ
  choice: Ils ne suivirent pas mes prescriptions
  rationale: L’expression hébraïque signifie littéralement « marcher dans mes prescriptions ». « Suivre » restitue naturellement en français l’idée d’une conduite réglée par elles.
- source_word: מִשְׁפָּטַי
  choice: mes règles
  rationale: Dans ce contexte légal et allianciel, מִשְׁפָּטִים désigne les règles établies par Dieu. « Règles » est clair et actuel, sans réduire le terme à des verdicts judiciaires.
- source_word: לֹא שָׁמְרוּ לַעֲשׂוֹת אוֹתָם
  choice: ne gardèrent pas mes règles pour les mettre en pratique
  rationale: Cette formulation conserve à la fois l’idée de garder fidèlement les règles et la visée pratique exprimée par l’infinitif de עשׂה.
- source_word: אֲשֶׁר יַעֲשֶׂה אוֹתָם הָאָדָם וָחַי בָּהֶם
  choice: ces règles que l’être humain qui les met en pratique vivra par elles
  rationale: La formulation maintient le singulier générique de אָדָם, la répétition de « mettre en pratique » et l’expression théologiquement chargée « vivra par elles », sans préciser davantage la nature de cette vie.
- source_word: אֶת שַׁבְּתוֹתַי חִלֵּלוּ
  choice: Ils profanèrent mes sabbats
  rationale: Au piel, חלל signifie profaner ou rendre commun ce qui est saint. « Profaner » conserve directement l’opposition entre sacré et profane.
- source_word: לִשְׁפֹּךְ חֲמָתִי עֲלֵיהֶם
  choice: je déverserais ma fureur sur eux
  rationale: « Déverser » préserve la métaphore de שפך, tandis que « fureur » rend l’intensité brûlante de חֵמָה.
- source_word: לְכַלּוֹת אַפִּי בָּם
  choice: afin d’aller jusqu’au bout de ma colère contre eux
  rationale: כלה avec אַף évoque la pleine réalisation ou consommation de la colère. Cette tournure française reste naturelle tout en préservant cette idée d’accomplissement complet.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: Dans le contexte de l’Exode, « désert » est le terme français courant pour מִדְבָּר et évoque naturellement le lieu de l’errance d’Israël.
theological_decisions:
- issue: Emploi générique de הָאָדָם dans la proposition sur la vie liée à l’obéissance
  choice: l’être humain
  alternative: l’homme
  rationale: L’article et le singulier ont ici une portée générique. « L’être humain » exprime clairement cette portée universelle en français moderne; une note conserve la forme plus littérale.
- issue: Nature de la vie promise dans וָחַי בָּהֶם
  choice: vivra par elles
  alternative: aura la vie grâce à elles
  rationale: La traduction garde la préposition et l’ambiguïté de « vivre par elles », sans déterminer si le texte vise uniquement la survie, la prospérité dans l’alliance ou une portée théologique plus large.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au récit prophétique écrit; les termes « prescriptions », « règles », « profaner » et « sabbats » maintiennent le registre biblique sans archaïsme excessif. La répétition de « mettre en pratique » est volontaire, car elle reflète l’insistance de l’hébreu.
