  text: בַּ/יּ֣וֹם הַ/ה֗וּא נָשָׂ֤אתִי יָדִ/י֙ לָ/הֶ֔ם לְ/הֽוֹצִיאָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֶל אֶ֜רֶץ אֲשֶׁר תַּ֣רְתִּי לָ/הֶ֗ם זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ צְבִ֥י הִ֖יא לְ/כָל הָ/אֲרָצֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/006.yaml
  text: On that day I raised my hand to them[a], to bring them out from the land of Egypt into a land that I had searched out for them, flowing with milk and honey[c][b]; it is the glory of all lands.
translation:
  language: fr
  text: En ce jour-là, j’ai levé la main vers eux[a] pour les faire sortir du pays d’Égypte vers un pays que j’avais exploré pour eux[b], un pays où coulent le lait et le miel. C’est la splendeur de tous les pays[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « lever la main » signifie ici prêter serment ou prendre un engagement solennel.
    reason: lexical_alternative
  - marker: b
    text: Ou « que j’avais choisi pour eux » ; le verbe hébreu signifie littéralement explorer, reconnaître ou parcourir.
    reason: lexical_alternative
  - marker: c
    text: Ou « la beauté », « l’ornement » ou « le joyau de tous les pays ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשָׂאתִי יָדִי לָהֶם
  choice: j’ai levé la main vers eux
  rationale: Cette formulation conserve l’image concrète du geste hébreu tout en laissant entendre sa valeur de serment. « Vers eux » exprime naturellement en français les destinataires de l’engagement.
- source_word: לְהוֹצִיאָם מֵאֶרֶץ מִצְרָיִם
  choice: pour les faire sortir du pays d’Égypte
  rationale: Le hiphil de יצא indique que Dieu les fait sortir. Cette tournure est claire, naturelle et conforme au langage de l’Exode.
- source_word: אֶל אֶרֶץ אֲשֶׁר תַּרְתִּי לָהֶם
  choice: et les conduire dans un pays que j’avais exploré pour eux
  rationale: « Exploré » conserve la nuance concrète de תור, qui peut signifier parcourir ou reconnaître un territoire, sans réduire le propos au seul sens abstrait de « choisir ». « Les conduire » explicite naturellement en français le mouvement vers le pays déjà contenu dans la construction hébraïque.
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: un pays où coulent le lait et le miel
  rationale: Cette expression française courante restitue l’image hébraïque d’une terre fertile et abondante.
- source_word: צְבִי הִיא לְכָל הָאֲרָצוֹת
  choice: C’est la splendeur de tous les pays
  rationale: « Splendeur » rend la valeur esthétique et honorifique de צְבִי sans transformer explicitement l’expression en superlatif. La formulation demeure élevée mais compréhensible.
theological_decisions:
- issue: Description anthropomorphique de l’action divine dans תַּרְתִּי
  choice: que j’avais exploré pour eux
  alternative: que j’avais choisi pour eux
  rationale: Le choix conserve l’image et la tension propres au verbe hébreu au lieu de les remplacer par une formulation abstraite. Il présente le langage prophétique tel qu’il est sans tirer de conclusion doctrinale sur la connaissance divine.
translation_notes:
  register: Français international moderne, digne et accessible. L’image du serment est conservée dans le texte, tandis que la note en explicite le sens. La syntaxe a été légèrement déployée avec « et les conduire » pour rendre naturellement en français le mouvement de la sortie d’Égypte vers le pays promis.
