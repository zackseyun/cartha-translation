  terminology: « Être vivant », « Dieu d’Israël », « Kebar » et « chérubins » sont des choix cohérents, compréhensibles et adaptés au registre biblique. « Chérubins » maintient utilement le pluriel hébreu et évite le ton plus familier de « chérubins » au sens iconographique—le terme français est ici adéquat.
