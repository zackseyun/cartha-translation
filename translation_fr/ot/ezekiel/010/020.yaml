  source_fidelity: 'Le projet rend fidèlement l’identification rétrospective : le singulier collectif « l’être vivant » est conservé, puis la reconnaissance explicite au pluriel (« des chérubins »). « Je reconnus » représente bien וָאֵדַע dans ce contexte. La localisation au Kebar et l’alternative fleuve/canal sont également bien prises en compte. Une légère révision de « sous » est justifiée : « au-dessous de » exprime plus nettement la relation spatiale de תַּחַת et évite la résonance non spatiale que « sous le Dieu » peut avoir en français courant.'
