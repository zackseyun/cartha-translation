source:
  edition: WLC
  text: הִ֣יא הַ/חַיָּ֗ה אֲשֶׁ֥ר רָאִ֛יתִי תַּ֥חַת אֱלֹהֵֽי יִשְׂרָאֵ֖ל בִּֽ/נְהַר כְּבָ֑ר וָ/אֵדַ֕ע כִּ֥י כְרוּבִ֖ים הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/020.yaml
  text: This was the living creature that I saw beneath the God of Israel by the Kebar Canal[a], and I knew that they were cherubim.
translation:
  language: fr
  text: C’était l’être vivant que j’avais vu au-dessous du Dieu d’Israël, près du canal du Kebar[a], et je reconnus que c’étaient des chérubins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « près du fleuve Kebar » ; le terme hébreu peut désigner un fleuve, une rivière ou un canal.
    reason: Alternative lexicale et géographique pour נְהַר.
lexical_decisions:
- source_word: הִיא הַחַיָּה
  choice: C’était l’être vivant
  rationale: Le pronom féminin singulier reprend l’être de la vision. « C’était » convient au récit rétrospectif, tandis que « l’être vivant » exprime le caractère animé et surnaturel du référent sans le réduire à un animal ordinaire.
- source_word: אֲשֶׁר רָאִיתִי
  choice: que j’avais vu
  rationale: Le plus-que-parfait situe naturellement la vision antérieure par rapport à la reconnaissance racontée à la fin du verset.
- source_word: תַּחַת אֱלֹהֵי יִשְׂרָאֵל
  choice: sous le Dieu d’Israël
  rationale: « Sous » conserve directement la relation spatiale de la vision et le titre défini « le Dieu d’Israël ».
- source_word: בִּנְהַר כְּבָר
  choice: près du canal du Kebar
  rationale: Dans le contexte babylonien, נְהַר peut désigner un canal aussi bien qu’un cours d’eau. « Près de » rend la valeur locative de la préposition, et « Kebar » suit une translittération française claire du nom hébreu.
- source_word: וָאֵדַע
  choice: et je reconnus
  rationale: Le verbe ידע exprime ici l’identification à laquelle Ézéchiel parvient. « Je reconnus » est naturel dans ce contexte tout en gardant l’idée de connaissance certaine.
- source_word: כִּי כְרוּבִים הֵמָּה
  choice: que c’étaient des chérubins
  rationale: כִּי introduit le contenu de la reconnaissance. Le pluriel « c’étaient des chérubins » respecte le passage du singulier collectif à la pluralité explicite des êtres.
theological_decisions:
- issue: Identification des êtres du trône
  choice: Conserver l’identification explicite de l’être vivant aux chérubins
  alternative: Employer une formulation générique qui atténuerait le lien avec les chérubins
  rationale: Le verset présente cette identification comme la reconnaissance d’Ézéchiel lui-même; la traduction doit préserver cette progression littéraire et théologique.
- issue: Tension entre le singulier הַחַיָּה et le pluriel הֵמָּה / כְרוּבִים
  choice: Maintenir « l’être vivant » au singulier puis « c’étaient des chérubins » au pluriel
  alternative: Harmoniser les deux membres entièrement au pluriel
  rationale: Le changement de nombre appartient au texte hébreu. Le conserver évite de résoudre silencieusement la manière dont la réalité visionnaire est envisagée, d’abord comme un ensemble puis comme plusieurs chérubins.
translation_notes:
  register: Français moderne, sobre et digne. La formulation conserve le vocabulaire visionnaire traditionnel (« être vivant », « chérubins ») tout en restant immédiatement compréhensible.
