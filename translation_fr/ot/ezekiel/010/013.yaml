  text: As for the wheels[a], they were called “the whirling wheel” in my hearing.
translation:
  language: fr
  text: Quant aux roues[a], j’entendis qu’on les appelait « le tourbillon ».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la roue ». Le mot hébreu galgal peut désigner une roue ou ce qui tournoie; l’expression finale signifie littéralement « à mes oreilles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאֹופַנִּים
  choice: Quant aux roues
  rationale: Le ל préfixé introduit ici vraisemblablement le thème de l’énoncé; cette tournure française restitue naturellement cette fonction.
- source_word: לָהֶם קוֹרָא
  choice: on les appelait
  rationale: La construction exprime ici une désignation. Le pronom indéfini « on » rend naturellement en français la valeur impersonnelle, sans identifier celui qui parle.
- source_word: הַגַּלְגַּל
  choice: le Tourbillon
  rationale: גַּלְגַּל peut désigner une roue ou un mouvement tournoyant. « Tourbillon » préserve la distinction lexicale avec אֹופַנִּים (« roues ») et convient au caractère dynamique de la vision, tout en gardant le singulier défini comme nom entendu.
- source_word: בְּאָזְנָי
  choice: devant moi
  rationale: Littéralement « à mes oreilles »; dans ce contexte auditif, « devant moi » indique que cette appellation a été prononcée en présence du prophète, dans son audition.
