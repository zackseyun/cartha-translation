id: EZK.10.17
reference: Ezekiel 10:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/עָמְדָ֣/ם יַעֲמֹ֔דוּ וּ/בְ/רוֹמָ֖/ם יֵר֣וֹמּוּ אוֹתָ֑/ם כִּ֛י ר֥וּחַ הַ/חַיָּ֖ה בָּ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/017.yaml
  text: When they stood still[a], these stood still; and when they were lifted up, these were lifted up with them, for the spirit of the living creature was in them.
translation:
  language: fr
  text: Quand ils s’arrêtaient, elles s’arrêtaient ; et quand ils s’élevaient, elles s’élevaient avec eux, car l’esprit de l’être vivant était en elles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « l’esprit de vie était en elles ». Le mot hébreu traduit par « esprit » peut également signifier « souffle » ou « vent ».'
    reason: Alternative lexicale et ambiguïté syntaxique de רוּחַ הַחַיָּה.
lexical_decisions:
- source_word: בְּעָמְדָם יַעֲמֹדוּ
  choice: Quand ils s’arrêtaient, elles s’arrêtaient
  rationale: La construction ב avec l’infinitif exprime ici la circonstance temporelle. « S’arrêtaient » rend le contraste avec le mouvement, tandis que les pronoms français distinguent naturellement les êtres vivants (« ils ») des roues (« elles »), sujets implicites dans le contexte.
- source_word: וּבְרוֹמָם יֵרוֹמּוּ אוֹתָם
  choice: et quand ils s’élevaient, elles s’élevaient avec eux
  rationale: Dans cette vision, רום désigne un mouvement physique vers le haut. « Avec eux » rend clairement le mouvement coordonné des roues et des êtres vivants exprimé par אוֹתָם.
- source_word: כִּי
  choice: car
  rationale: Introduit l’explication du mouvement coordonné dans un registre littéraire naturel.
- source_word: רוּחַ
  choice: l’esprit
  rationale: Le terme peut signifier esprit, souffle ou vent. Ici, « esprit » rend au mieux le principe animateur qui explique le mouvement des roues, sans effacer la richesse du terme hébreu.
- source_word: הַחַיָּה
  choice: de l’être vivant
  rationale: Le singulier hébreu est conservé et peut avoir une portée collective dans le contexte de la vision. « Être vivant » est digne et évite le sens trop ordinaire d’« animal ».
- source_word: בָּהֶם
  choice: était en elles
  rationale: Le pronom renvoie aux roues ; l’accord féminin est requis en français.
theological_decisions:
- issue: Sens de רוּחַ הַחַיָּה
  choice: l’esprit de l’être vivant
  alternative: l’esprit de vie ; le souffle de l’être vivant
  rationale: La lecture retenue rattache le principe animateur à l’être vivant et explique le mouvement concerté des roues. La note conserve les autres nuances permises par l’hébreu sans résoudre abusivement l’ambiguïté.
translation_notes:
  register: Français international moderne, fluide et digne. La répétition de « s’arrêtaient » et « s’élevaient » préserve le parallélisme hébreu ; l’alternance « ils/elles » clarifie sans ajouter de noms absents du verset.
