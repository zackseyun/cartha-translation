revisions:
- from: 'Puis je regardai : voici qu’au-dessus de l’étendue qui se trouvait au-dessus de la tête des chérubins leur apparut quelque chose qui ressemblait à une pierre de saphir[a] et qui avait l’apparence d’une forme de trône.'
  to: 'Puis je regardai : voici que, sur l’étendue qui était au-dessus des têtes des chérubins, apparut au-dessus d’eux quelque chose comme une pierre de saphir[a], ayant l’apparence d’une forme de trône.'
  rationale: La correction rétablit « sur l’étendue » pour עַל הָרָקִיעַ et « au-dessus d’eux » pour עֲלֵיהֶם, sans résoudre ou réduire les comparaisons visionnaires du texte. La note lexicale est exacte et son ancre est correctement maintenue.
