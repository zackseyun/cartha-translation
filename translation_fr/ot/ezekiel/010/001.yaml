  text: וָ/אֶרְאֶ֗ה וְ/הִנֵּ֤ה אֶל הָ/רָקִ֨יעַ֙ אֲשֶׁר֙ עַל רֹ֣אשׁ הַ/כְּרֻבִ֔ים כְּ/אֶ֣בֶן סַפִּ֔יר כְּ/מַרְאֵ֖ה דְּמ֣וּת כִּסֵּ֑א נִרְאָ֖ה עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/001.yaml
  text: Then I looked[a], and behold, on the expanse that was above the heads of the cherubim there appeared over them something like a sapphire stone, in appearance like the likeness of a throne.
translation:
  language: fr
  text: 'Puis je regardai : voici que, sur l’étendue qui était au-dessus des têtes des chérubins, apparut au-dessus d’eux quelque chose comme une pierre de saphir[a], ayant l’apparence d’une forme de trône.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus précisément, « une pierre de lapis-lazuli » ; le mot hébreu traditionnellement traduit par « saphir » peut désigner une pierre précieuse d’un bleu profond dont l’identification minéralogique moderne demeure incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: Puis je regardai
  rationale: Le wayyiqtol fait progresser le récit visionnaire. « Puis je regardai » rend naturellement la succession tout en conservant le témoignage visuel à la première personne.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Ce marqueur attire vivement l’attention sur un nouvel élément de la vision. « Voici que » conserve cette force dans un registre prophétique digne et actuel.
- source_word: הָרָקִיעַ
  choice: l’étendue
  rationale: Dans la vision du trône, le terme désigne l’étendue ou plateforme céleste au-dessus des êtres vivants. « L’étendue » reste proche de l’image hébraïque sans employer l’archaïque « firmament ».
- source_word: אֲשֶׁר עַל רֹאשׁ הַכְּרֻבִים
  choice: qui se trouvait au-dessus de la tête des chérubins
  rationale: La proposition situe spatialement l’étendue. L’hébreu emploie « tête » au singulier collectif, conservé ici sans nuire au naturel français.
- source_word: הַכְּרֻבִים
  choice: les chérubins
  rationale: « Chérubins » est le terme biblique français établi pour cette catégorie d’êtres célestes.
- source_word: כְּאֶבֶן סַפִּיר
  choice: quelque chose qui ressemblait à une pierre de saphir[a]
  rationale: La formulation rend la comparaison visionnaire et le nom traditionnel de cette pierre bleue, tout en signalant en note l’incertitude de son identification minéralogique moderne.
- source_word: כְּמַרְאֵה דְּמוּת כִּסֵּא
  choice: qui avait l’apparence d’une forme de trône
  rationale: Cette traduction maintient l’accumulation des termes d’approximation, מַרְאֶה et דְּמוּת, sans identifier directement l’objet à un trône.
- source_word: נִרְאָה
  choice: apparut
  rationale: Le nifal exprime ce qui devient visible. « Apparut » convient au récit de vision et garde le phénomène au premier plan.
- source_word: עֲלֵיהֶם
  choice: leur apparut
  rationale: Le pronom renvoie probablement aux chérubins. La construction française avec complément indirect rend possible le sens « apparut au-dessus d’eux », mais peut sembler ambiguë; le contexte spatial précédent guide la lecture.
theological_decisions:
- issue: Langage visionnaire et degré d’identification
  choice: 'Conserver les comparaisons successives : « ressemblait à… avait l’apparence d’une forme de trône »'
  alternative: Simplifier en « un trône de saphir apparut au-dessus d’eux »
  rationale: Ézéchiel multiplie les termes d’approximation afin de décrire la vision sans identifier directement ce qu’il voit. La traduction préserve cette réserve et la transcendance de la scène.
- issue: Référent de עֲלֵיהֶם
  choice: Comprendre le pronom comme renvoyant aux chérubins
  alternative: Le rattacher plus largement à leurs têtes ou à la scène située au-dessus d’eux
  rationale: Le pluriel masculin renvoie naturellement aux chérubins, tandis que la proposition précédente précise déjà que l’étendue est au-dessus de leur tête.
translation_notes:
  register: 'Français international moderne, digne et accessible. Le rythme prophétique est conservé par « Puis je regardai : voici que », tandis que les formulations comparatives maintiennent le caractère indirect de la vision.'
