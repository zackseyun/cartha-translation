  text: אַרְבָּעָ֨ה אַרְבָּעָ֤ה פָנִים֙ לְ/אֶחָ֔ד וְ/אַרְבַּ֥ע כְּנָפַ֖יִם לְ/אֶחָ֑ד וּ/דְמוּת֙ יְדֵ֣י אָדָ֔ם תַּ֖חַת כַּנְפֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/021.yaml
  text: Each one had four faces[a], and each one had four wings, and the likeness of human hands was under their wings.
translation:
  language: fr
  text: Chacun avait quatre faces et quatre ailes, et, sous leurs ailes, il y avait une forme de mains humaines[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des mains d’homme ».'
    reason: Alternative lexicale pour אָדָם, qui peut être rendu littéralement par « homme » tout en ayant ici un sens générique.
lexical_decisions:
- source_word: אַרְבָּעָה אַרְבָּעָה פָנִים לְאֶחָד
  choice: Chacun avait quatre faces
  rationale: La répétition distributive du nombre, associée à לְאֶחָד, signifie que chaque être avait quatre faces. Cette formulation l’exprime naturellement en français.
- source_word: וְאַרְבַּע כְּנָפַיִם לְאֶחָד
  choice: et quatre ailes
  rationale: Le sujet distributif « chacun » reste valable dans le second membre, ce qui permet une formulation française concise tout en conservant le parallélisme.
- source_word: וּדְמוּת
  choice: quelque chose qui ressemblait à
  rationale: Dans les visions d’Ézéchiel, דְּמוּת indique une ressemblance ou une apparence plutôt qu’une identité stricte. La tournure choisie préserve cette réserve analogique.
- source_word: יְדֵי אָדָם
  choice: des mains humaines
  rationale: אָדָם désigne ici l’être humain en général, et non nécessairement un homme de sexe masculin. « Mains humaines » rend clairement le contraste morphologique.
- source_word: תַּחַת כַּנְפֵיהֶם
  choice: sous leurs ailes
  rationale: Traduction directe de l’expression spatiale; le suffixe pluriel renvoie aux êtres décrits.
theological_decisions:
- issue: Sens de אָדָם dans יְדֵי אָדָם
  choice: humaines
  alternative: d’homme
  rationale: Le passage décrit l’aspect des mains et les distingue des autres traits des êtres; il ne met pas l’accent sur le sexe masculin. « Humaines » rend donc mieux le sens générique sans supprimer l’autre traduction traditionnelle.
translation_notes:
  register: Français moderne, clair et digne. La répétition hébraïque distributive est explicitée par « chacun », tandis que le langage de ressemblance propre à la vision est conservé.
