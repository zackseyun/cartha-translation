revisions:
- from: Quand les chérubins avançaient, les roues avançaient à côté d’eux. Et quand les chérubins levaient leurs ailes pour s’élever au-dessus de la terre, les roues, elles non plus, ne quittaient pas leur côté[a].
  to: Quand les chérubins avançaient, les roues avançaient à côté d’eux. Et quand les chérubins levaient leurs ailes pour s’élever de la terre, les roues ne s’écartaient pas non plus d’auprès d’eux[a].
  rationale: La révision rend le mouvement ascensionnel comme un départ depuis la terre et formule plus clairement la solidarité de mouvement des roues avec les chérubins. Elle conserve la temporalité, le parallélisme et l’accent de « elles aussi / non plus » sans imposer une interprétation supplémentaire.
