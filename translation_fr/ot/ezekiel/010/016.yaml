  timestamp: '2026-07-15T07:17:23Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : le déplacement coordonné des chérubins et des roues, ainsi que le maintien des roues auprès d’eux, sont bien exprimés. Toutefois, « s’élever au-dessus de la terre » peut décrire une position au-dessus du sol plutôt que le départ depuis le sol ; מֵעַל הָאָרֶץ se rend plus précisément ici par « de la terre ».'
  naturalness: Le français est globalement naturel et de registre approprié. « Ne quittaient pas leur côté » est compréhensible, mais l’antécédent de « leur » est moins net et la formulation atténue l’idée de ne pas s’écarter / se détourner d’auprès des chérubins. « Ne s’écartaient pas non plus d’auprès d’eux » est plus idiomatique et explicite.
  terminology: « Chérubins » et « roues » conviennent et respectent la terminologie visionnaire établie. Aucun terme théologique ne demande de modification.
  issues:
  - severity: medium
    issue: « au-dessus de la terre »
    rationale: Cette expression peut suggérer le lieu où les chérubins s’élèvent, alors que מֵעַל הָאָרֶץ, avec לָרוּם, indique leur élévation depuis la terre / le sol.
  - severity: low
    issue: « ne quittaient pas leur côté »
    rationale: La tournure est moins précise quant au référent de « leur » et ne rend qu’indirectement le mouvement de se détourner ou de s’écarter exprimé par לֹא יִסַּבּוּ מֵאֶצְלָם.
  revised_text: Quand les chérubins avançaient, les roues avançaient à côté d’eux. Et quand les chérubins levaient leurs ailes pour s’élever de la terre, les roues ne s’écartaient pas non plus d’auprès d’eux[a].
  revised_footnotes:
