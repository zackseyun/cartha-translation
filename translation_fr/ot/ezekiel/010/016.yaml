base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/016.yaml
  text: When the cherubim moved[a], the wheels moved beside them; and when the cherubim lifted up their wings to rise from the earth, the wheels also did not turn away from beside them.
translation:
  language: fr
  text: Quand les chérubins avançaient, les roues avançaient à côté d’eux. Et quand les chérubins levaient leurs ailes pour s’élever de la terre, les roues ne s’écartaient pas non plus d’auprès d’eux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne se détournaient pas, elles non plus, d’auprès d’eux ». L’hébreu souligne que les roues ne s’éloignaient pas des chérubins pendant leur élévation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְלֶכֶת הַכְּרוּבִים
  choice: Quand les chérubins avançaient
  rationale: La préposition בְּ suivie de l’infinitif construit introduit une proposition temporelle. « Avançaient » exprime naturellement le déplacement coordonné des êtres dans cette vision.
- source_word: הַכְּרוּבִים
  choice: les chérubins
  rationale: « Chérubins » est la désignation française traditionnelle et précise du pluriel hébreu כְּרוּבִים, sans l’associer aux représentations populaires de petits anges.
- source_word: הָאוֹפַנִּים
  choice: les roues
  rationale: אוֹפַנִּים désigne clairement les roues de la vision et doit rester cohérent dans l’ensemble du passage.
- source_word: אֶצְלָם
  choice: à côté d’eux
  rationale: אֵצֶל exprime la proximité spatiale. Cette formulation française est claire et conserve la relation entre les roues et les chérubins.
- source_word: וּבִשְׂאֵת הַכְּרוּבִים אֶת כַּנְפֵיהֶם
  choice: Et quand les chérubins levaient leurs ailes
  rationale: La seconde construction בְּ + infinitif est temporelle. « Levaient leurs ailes » rend directement l’action de נָשָׂא sans ajouter l’idée de déploiement, absente du texte.
- source_word: לָרוּם מֵעַל הָאָרֶץ
  choice: pour s’élever au-dessus de la terre
  rationale: L’infinitif רוּם indique ici le but ou le résultat du mouvement des ailes. « Au-dessus de la terre » conserve la présence de מֵעַל et convient au cadre visionnaire.
- source_word: לֹא יִסַּבּוּ ... מֵאֶצְלָם
  choice: ne quittaient pas leur côté
  rationale: Le niphal de סבב évoque l’action de se détourner, tandis que מֵאֶצְלָם marque l’éloignement depuis leur proximité. Cette formulation naturelle met en valeur le fait que les roues demeuraient auprès des chérubins.
- source_word: גַּם הֵם
  choice: elles non plus
  rationale: Cette tournure française restitue l’accent porté sur les roues et leur mouvement coordonné avec celui des chérubins.
theological_decisions: []
