  text: וַ/יֹּ֜אמֶר אֶל הָ/אִ֣ישׁ לְבֻ֣שׁ הַ/בַּדִּ֗ים וַ/יֹּ֡אמֶר בֹּא֩ אֶל בֵּינ֨וֹת לַ/גַּלְגַּ֜ל אֶל תַּ֣חַת לַ/כְּר֗וּב וּ/מַלֵּ֨א חָפְנֶ֤י/ךָ גַֽחֲלֵי אֵשׁ֙ מִ/בֵּינ֣וֹת לַ/כְּרֻבִ֔ים וּ/זְרֹ֖ק עַל הָ/עִ֑יר וַ/יָּבֹ֖א לְ/עֵינָֽ/י־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/002.yaml
  text: And he said to the man clothed in linen[a], “Go in among the wheelwork, under the cherub, and fill your hands with coals of fire from among the cherubim, and scatter them over the city.” And he went in before my eyes.
translation:
  language: fr
  text: 'Il dit à l’homme vêtu de lin : « Entre au milieu du mécanisme des roues[a], sous le chérubin, remplis tes mains de braises ardentes prises d’entre les chérubins, et répands-les sur la ville. » Et l’homme y entra sous mes yeux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entre les roues ». Le terme hébreu peut désigner collectivement tout l’ensemble formé par les roues plutôt qu’une roue isolée.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבֻשׁ הַבַּדִּים
  choice: vêtu de lin
  rationale: Cette formulation naturelle et digne identifie l’homme par sa tenue, sans ajouter un nom absent de l’hébreu.
- source_word: בֵּינוֹת לַגַּלְגַּל
  choice: au milieu du rouage
  rationale: גַּלְגַּל peut désigner ici collectivement l’ensemble constitué par les roues du char-trône. « Rouage » conserve cette valeur collective tout en restant intelligible; l’autre lecture est signalée en note.
- source_word: אֶל תַּחַת לַכְּרוּב
  choice: sous le chérubin
  rationale: La traduction maintient la relation spatiale et le singulier du texte hébreu.
- source_word: וּמַלֵּא חָפְנֶיךָ
  choice: remplis le creux de tes mains
  rationale: חָפְנַיִם désigne les mains tenues de manière à contenir quelque chose. Cette expression française rend l’image plus précisément que le simple « remplis tes mains ».
- source_word: גַחֲלֵי אֵשׁ
  choice: braises ardentes
  rationale: Cette tournure française naturelle restitue l’image concrète de braises embrasées sans la lourdeur de « braises de feu ».
- source_word: מִבֵּינוֹת לַכְּרֻבִים
  choice: prises d’entre les chérubins
  rationale: Le participe ajouté en français explicite naturellement l’origine des braises déjà mentionnées, sans modifier le sens spatial.
- source_word: וּזְרֹק עַל הָעִיר
  choice: répands-les sur la ville
  rationale: Le pronom reprend explicitement les braises, comme l’exige le français, et « répands » exprime leur dispersion sur la ville.
- source_word: לְעֵינָי
  choice: sous mes yeux
  rationale: Expression française idiomatique qui préserve le témoignage visuel d’Ézéchiel.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Il dit
  rationale: La répétition du verbe introducteur est idiomatique en hébreu mais serait redondante en français; une seule introduction rend naturellement la même fonction discursive.
theological_decisions:
- issue: Portée symbolique des braises répandues sur la ville
  choice: Présenter l’ordre sans en expliciter la signification symbolique dans le corps du texte.
  alternative: Préciser qu’il s’agit d’un acte de jugement ou, éventuellement, de purification.
  rationale: Le contexte évoque le jugement de Jérusalem, mais ce verset n’interprète pas lui-même le geste. La traduction conserve donc l’image et sa tension théologique.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif demeure concret et visuel; le vocabulaire technique de la vision est conservé sans explication doctrinale ajoutée.
