revisions:
- from: 'Il dit à l’homme vêtu de lin : « Entre au milieu du rouage[a], sous le chérubin, remplis le creux de tes mains de braises ardentes prises d’entre les chérubins, et répands-les sur la ville. » Et l’homme y entra sous mes yeux.'
  to: 'Il dit à l’homme vêtu de lin : « Entre au milieu du mécanisme des roues[a], sous le chérubin, remplis tes mains de braises ardentes prises d’entre les chérubins, et répands-les sur la ville. » Et l’homme y entra sous mes yeux.'
  rationale: La révision remplace seulement « rouage », terme français impropre ou ambigu dans ce contexte, par une expression qui rend la valeur collective possible de גַּלְגַּל. Elle allège aussi l’expression des mains sans perte sémantique. Le singulier « le chérubin », l’origine spatiale des braises, l’action de les répandre et le point de vue d’Ézéchiel sont conservés. La note maintient l’ambiguïté lexicale pertinente.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:17:23Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : l’homme vêtu de lin reçoit l’ordre d’entrer dans la zone des roues, sous le chérubin, de prendre des charbons parmi les chérubins et de les jeter sur la ville; son entrée est vue par le prophète. Toutefois, « rouage » désigne normalement en français une pièce d’un mécanisme (souvent un engrenage), plutôt que l’ensemble des roues, et risque donc de déformer l’image visionnaire de גַּלְגַּל.'
  naturalness: Le registre est clair et digne. « Au milieu du mécanisme des roues » est plus intelligible et plus exact que « au milieu du rouage ». « Remplis tes mains » rend naturellement l’idée des mains creuses/pleines, sans l’expression moins idiomatique « le creux de tes mains ».
  terminology: « Vêtu de lin », « chérubin », « braises ardentes », « ville » et « sous mes yeux » conviennent au français biblique moderne. La note conserve utilement l’alternative spatiale et l’incertitude quant à la valeur collective de גַּלְגַּל.
  issues:
  - severity: medium
    issue: « rouage » pour בֵּינוֹת לַגַּלְגַּל
    rationale: En français moderne, « rouage » évoque d’abord une pièce ou un engrenage, non le dispositif collectif de roues. « Mécanisme des roues » exprime plus justement le sens collectif possible sans réduire le terme à une roue unique.
  - severity: low
    issue: « remplis le creux de tes mains »
    rationale: La formulation est compréhensible, mais « remplis tes mains » est plus idiomatique tout en conservant le sens de חָפְנֶיךָ, les mains formant une capacité.
  revised_text: 'Il dit à l’homme vêtu de lin : « Entre au milieu du mécanisme des roues[a], sous le chérubin, remplis tes mains de braises ardentes prises d’entre les chérubins, et répands-les sur la ville. » Et l’homme y entra sous mes yeux.'
  revised_footnotes:
