base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/012.yaml
  text: And all their bodies[a], their backs, their hands, their wings[b], and the wheels were full of eyes all around—the wheels belonging to the four of them.
translation:
  language: fr
  text: Tous leurs corps[a], leur dos, leurs mains, leurs ailes et les roues étaient remplis d’yeux tout autour — les roues des quatre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « toute leur chair ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu final est elliptique ; on peut aussi rendre : « leurs quatre roues ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשָׂרָם
  choice: tout leur corps
  rationale: Le nom בָּשָׂר signifie littéralement « chair », mais il désigne ici, dans une énumération anatomique, l’ensemble corporel des êtres vivants. « Tout leur corps » est naturel en français et conserve la valeur collective du singulier hébreu.
- source_word: גַבֵּיהֶם
  choice: leur dos
  rationale: Dans la suite des parties corporelles, le sens anatomique « dos » est le plus probable. En français, « leur dos » convient même lorsque plusieurs êtres possèdent chacun un dos.
- source_word: וִידֵיהֶם
  choice: leurs mains
  rationale: יָד désigne normalement la main ; le contexte ne justifie pas l’élargissement à « bras ».
- source_word: וְכַנְפֵיהֶם
  choice: leurs ailes
  rationale: « Ailes » est le sens courant de כָּנָף dans la description des êtres de la vision.
- source_word: וְהָאוֹפַנִּים
  choice: et les roues
  rationale: אוֹפַן désigne concrètement une roue. L’article défini est conservé, puisque ces roues ont déjà été présentées dans la vision.
- source_word: מְלֵאִים עֵינַיִם סָבִיב
  choice: étaient remplis d’yeux tout autour
  rationale: Cette formulation suit de près « pleins d’yeux autour » tout en restant idiomatique en français. Elle évite de remplacer l’image par l’interprétation plus libre « couverts d’yeux ».
- source_word: לְאַרְבַּעְתָּם אוֹפַנֵּיהֶם
  choice: les roues associées à tous les quatre
  rationale: La fin hébraïque reprend « les roues » et les met en relation avec les quatre êtres. « Associées à » rend prudemment la relation exprimée par לְ sans imposer une notion stricte de possession.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et concret. La reprise finale des roues est maintenue au moyen d’un tiret afin de refléter la syntaxe appositionnelle et quelque peu énigmatique de l’hébreu, sans la lisser excessivement.
