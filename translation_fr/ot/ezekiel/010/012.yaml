    issue: « les roues associées à tous les quatre »
    rationale: « Associées à » est une paraphrase relationnelle abstraite et « tous les quatre » est plus conversationnel. Le texte hébreu reprend « leurs roues » en relation avec les quatre êtres ; « les roues des quatre » préserve mieux l’ellipse et le caractère quelque peu énigmatique de l’original.
  - severity: low
    issue: « Tout leur corps »
    rationale: Bien que défendable comme collectif, « Tous leurs corps » est plus naturel dans une énumération où chaque élément est réparti entre plusieurs êtres.
  - severity: low
    issue: Note b incohérente avec le texte proposé
    rationale: La note présente « les roues des quatre » comme alternative alors que cette formulation est préférable pour le texte principal révisé.
