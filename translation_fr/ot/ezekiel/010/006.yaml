    issue: Le pluriel « les roues » est présenté comme le sens du texte principal.
    rationale: Le texte hébreu porte le singulier défini גַּלְגַּל. Il peut désigner une structure de roues, mais le pluriel explicite est une explicitation interprétative qui devrait être évitée dans le texte principal ou signalée comme telle.
  - severity: low
    issue: « près d’une roue » emploie un indéfini.
    rationale: הָאוֹפָן est défini. « Près de la roue » conserve cette détermination et maintient le lien avec l’élément visionnaire déjà évoqué.
