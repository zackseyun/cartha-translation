  text: וַ/יְהִ֗י בְּ/צַוֺּת/וֹ֙ אֶת הָ/אִ֤ישׁ לְבֻֽשׁ הַ/בַּדִּים֙ לֵ/אמֹ֔ר קַ֥ח אֵשׁ֙ מִ/בֵּינ֣וֹת לַ/גַּלְגַּ֔ל מִ/בֵּינ֖וֹת לַ/כְּרוּבִ֑ים וַ/יָּבֹא֙ וַֽ/יַּעֲמֹ֔ד אֵ֖צֶל הָ/אוֹפָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/006.yaml
  text: And it happened[a], when he commanded the man clothed in linen, saying, “Take fire from between the wheelwork, from between the cherubim,” that he went in and stood beside the wheel.
translation:
  language: fr
  text: 'Et lorsqu’il ordonna à l’homme vêtu de lin : « Prends du feu du milieu du mécanisme des roues[a], du milieu des chérubins », l’homme entra et se tint près de la roue.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du milieu de la roue » ou « entre les roues ». Le mot hébreu גַּלְגַּל peut désigner une roue ou, dans cette vision, une structure mobile formée de roues.
    reason: Alternative lexicale pour גַּלְגַּל, dont la portée précise dans la vision reste ambiguë.
lexical_decisions:
- source_word: וַיְהִי בְּצַוֺּתוֹ
  choice: Et lorsqu’il donna cet ordre
  rationale: La construction introduit temporellement l’événement. Cette formulation française rend le tour narratif sans lourdeur ni archaïsme et laisse le sujet sous la forme pronominale du texte hébreu.
- source_word: הָאִישׁ לְבֻשׁ הַבַּדִּים
  choice: l’homme vêtu de lin
  rationale: Formulation naturelle et digne qui conserve l’identification visuelle du personnage déjà présent dans la vision.
- source_word: קַח אֵשׁ
  choice: Prends du feu
  rationale: L’impératif et son complément sont rendus directement; l’article partitif est idiomatique en français.
- source_word: מִבֵּינוֹת לַגַּלְגַּל
  choice: entre les roues
  rationale: Dans cette vision, גַּלְגַּל peut désigner l’ensemble ou la structure mobile formée par les roues. Le pluriel français exprime naturellement cet espace sans confondre le terme avec אוֹפָן à la fin du verset.
- source_word: מִבֵּינוֹת לַכְּרוּבִים
  choice: entre les chérubins
  rationale: La répétition spatiale de l’hébreu est conservée.
- source_word: וַיָּבֹא
  choice: l’homme entra
  rationale: Le contexte décrit son mouvement à l’intérieur de l’espace de la vision. La reprise de « l’homme » évite en français une succession de pronoms dont le référent serait ambigu.
- source_word: וַיַּעֲמֹד אֵצֶל הָאוֹפָן
  choice: se tint près d’une roue
  rationale: אוֹפָן désigne ici une roue au singulier. L’indéfini est naturel en français puisque cette roue n’a pas été individualisée dans la phrase.
theological_decisions:
- issue: Identité du sujet qui donne l’ordre
  choice: Le sujet reste le pronom « il », sans identification explicite.
  alternative: « Le Seigneur donna cet ordre » ou « celui qui siégeait sur le trône donna cet ordre ».
  rationale: Le texte hébreu ne nomme pas de nouveau le sujet dans ce verset. Ne pas l’identifier préserve la continuité narrative et évite d’inscrire une interprétation dans la traduction.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est allégée par rapport au tour hébreu tout en conservant l’ordre des événements, la répétition « entre… entre… » et l’ambiguïté concernant celui qui commande.
