id: EZK.10.5
reference: Ezekiel 10:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/קוֹל֙ כַּנְפֵ֣י הַ/כְּרוּבִ֔ים נִשְׁמַ֕ע עַד הֶ/חָצֵ֖ר הַ/חִיצֹנָ֑ה כְּ/ק֥וֹל אֵל שַׁדַּ֖י בְּ/דַבְּרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/005.yaml
  text: And the sound of the wings of the cherubim was heard as far as the outer court[a], like the sound of God Almighty when he speaks.
translation:
  language: fr
  text: Le bruit des ailes des chérubins s’entendait jusque dans la cour extérieure, pareil à la voix du Dieu tout-puissant lorsqu’il parle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « El Shaddaï »; titre divin traditionnellement rendu par « Dieu tout-puissant ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקוֹל
  choice: Le bruit
  rationale: קוֹל peut désigner un son, une voix ou un bruit. Avec les ailes comme source, « bruit » est naturel en français et prépare le contraste avec la voix divine dans la comparaison.
- source_word: כַּנְפֵי הַכְּרוּבִים
  choice: des ailes des chérubins
  rationale: Rend directement le pluriel construit כַּנְפֵי et conserve le terme biblique conventionnel « chérubins » pour הַכְּרוּבִים.
- source_word: נִשְׁמַע
  choice: s’entendait
  rationale: Le niphal de שׁמע exprime ici qu’un bruit était audible. L’imparfait français convient à la description narrative.
- source_word: עַד הֶחָצֵר הַחִיצֹנָה
  choice: jusque dans la cour extérieure
  rationale: עַד indique la portée du bruit. « Cour extérieure » est l’expression usuelle dans le contexte du temple; « jusque dans » indique naturellement qu’il y parvenait.
- source_word: כְּקוֹל
  choice: pareil à la voix
  rationale: קוֹל désigne ici la voix puisque la proposition suivante évoque Dieu qui parle. « Pareil à » maintient explicitement la comparaison.
- source_word: אֵל שַׁדַּי
  choice: du Dieu tout-puissant
  rationale: Le titre divin est traduit dans le texte pour être immédiatement compréhensible, sans en fixer davantage l’étymologie débattue.
- source_word: בְּדַבְּרוֹ
  choice: lorsqu’il parle
  rationale: La préposition בְּ avec l’infinitif construit et le suffixe exprime la circonstance temporelle. Le présent décrit de manière générale la voix divine.
theological_decisions:
- issue: Traduction du titre divin אֵל שַׁדַּי
  choice: le Dieu tout-puissant
  alternative: El Shaddaï
  rationale: La traduction traditionnelle communique clairement la fonction du titre en français, tandis qu’une note conserve sa forme hébraïque et signale implicitement que « tout-puissant » est un équivalent traditionnel plutôt qu’une étymologie certaine.
translation_notes:
  register: Français international moderne, naturel et digne. « S’entendait » évite une tournure passive lourde; « pareil à la voix » conserve la force de la comparaison et distingue le bruit des ailes de la parole divine.
