  text: וְ/הַ/כְּרֻבִ֗ים עֹֽמְדִ֛ים מִ/ימִ֥ין לַ/בַּ֖יִת בְּ/בֹא֣/וֹ הָ/אִ֑ישׁ וְ/הֶ/עָנָ֣ן מָלֵ֔א אֶת הֶ/חָצֵ֖ר הַ/פְּנִימִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/003.yaml
  text: The cherubim were standing on the right side of the house when the man went in[a], and the cloud filled the inner court.
translation:
  language: fr
  text: Les chérubins se tenaient du côté droit du Temple[a] lorsque l’homme entra, et la nuée remplit le parvis intérieur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Selon l’orientation du Temple, ce côté droit correspond au sud.
    reason: Précise la valeur spatiale contextuelle de l’expression hébraïque sans imposer « sud » dans le texte principal.
lexical_decisions:
- source_word: הַכְּרֻבִים
  choice: les chérubins
  rationale: Conserve le terme traditionnel désignant ces êtres célestes ainsi que l’article défini.
- source_word: עֹמְדִים
  choice: se tenaient
  rationale: Le participe décrit une posture continue dans la scène; « se tenaient » est naturel et digne en français.
- source_word: מִימִין לַבַּיִת
  choice: du côté droit de la Maison
  rationale: Rend directement l’expression hébraïque « du côté droit de la maison » sans remplacer dans le texte le repère relatif par son identification contextuelle au sud.
- source_word: בְּבֹאוֹ הָאִישׁ
  choice: lorsque l’homme entra
  rationale: L’infinitif construit précédé de בְּ exprime ici la simultanéité temporelle; cette formulation française est fluide et précise.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: Le texte dit simplement « l’homme »; son identification plus complète appartient au contexte antérieur.
- source_word: הֶעָנָן
  choice: la nuée
  rationale: « Nuée » est un terme français établi pour le nuage associé à la manifestation divine, tout en conservant le nom concret et son article.
- source_word: מָלֵא
  choice: remplit
  rationale: Le qatal présente l’action comme accomplie et fait avancer le récit.
- source_word: הֶחָצֵר הַפְּנִימִית
  choice: le parvis intérieur
  rationale: « Parvis » est le terme architectural courant et précis pour la cour du Temple; « intérieur » maintient la distinction spatiale.
theological_decisions:
- issue: Interprétation directionnelle de מִימִין dans le cadre du Temple
  choice: du côté droit de la Maison, avec une note indiquant qu’il s’agit du côté sud
  alternative: du côté sud de la Maison
  rationale: L’hébreu exprime littéralement le côté droit. Dans l’orientation du Temple, celui-ci correspond au sud, mais conserver « droit » dans le texte évite de remplacer silencieusement le repère source par son interprétation spatiale.
- issue: Identification de « l’homme »
  choice: l’homme
  alternative: l’homme vêtu de lin
  rationale: Le verset emploie seulement le nom défini. Ne pas développer l’expression préserve la formulation du texte, tandis que le contexte permet d’identifier le personnage.
translation_notes:
  register: Français international moderne, naturel et digne. « Maison » avec une majuscule désigne ici le Temple tout en conservant l’image lexicale de בַּיִת; « parvis intérieur » relève du vocabulaire architectural biblique courant.
