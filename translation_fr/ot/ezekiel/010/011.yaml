  text: בְּ/לֶכְתָּ֗/ם אֶל אַרְבַּ֤עַת רִבְעֵי/הֶם֙ יֵלֵ֔כוּ לֹ֥א יִסַּ֖בּוּ בְּ/לֶכְתָּ֑/ם כִּ֣י הַ/מָּק֞וֹם אֲשֶׁר יִפְנֶ֤ה הָ/רֹאשׁ֙ אַחֲרָ֣י/ו יֵלֵ֔כוּ לֹ֥א יִסַּ֖בּוּ בְּ/לֶכְתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/011.yaml
  text: When they went, they would go in any of their four directions; they did not turn as they went, for to the place where the head faced, they followed after it; they did not turn as they went.
translation:
  language: fr
  text: Quand ils avançaient, ils allaient vers l’un quelconque de leurs quatre côtés. Ils ne se détournaient pas en avançant, car ils allaient à la suite de la tête, vers l’endroit où elle se tournait. Ils ne se détournaient pas en avançant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶל אַרְבַּעַת רִבְעֵיהֶם
  choice: dans l’une ou l’autre de leurs quatre directions
  rationale: Exprime naturellement en français que le déplacement pouvait se faire selon chacune des quatre orientations, sans suggérer qu’ils allaient simultanément dans les quatre directions.
- source_word: יִסַּבּוּ
  choice: pivotaient
  rationale: Dans le contexte des roues et de leur mouvement, « pivoter » rend précisément l’idée de changer d’orientation en tournant, davantage que le simple « se retourner ».
- source_word: הָרֹאשׁ
  choice: la tête
  rationale: Conserve le sens concret et l’ambiguïté du texte hébreu, sans identifier explicitement ce référent difficile.
- source_word: אַחֲרָיו יֵלֵכוּ
  choice: ils suivaient la direction
  rationale: Rend idiomatiquement le mouvement à la suite de l’orientation indiquée par la tête, tout en évitant un français obscur tel que « ils allaient après elle ».
theological_decisions:
- issue: Référent de « la tête »
  choice: Maintenir « la tête » sans l’identifier
  alternative: Interpréter comme « la face », « la roue de tête » ou « le chérubin de tête »
  rationale: Le référent demeure difficile dans le texte source; une identification explicite résoudrait indûment l’ambiguïté.
translation_notes:
  register: Français moderne, clair et digne. La répétition finale du texte hébreu est conservée. Le choix de « pivoter » souligne l’absence de changement d’orientation pendant le déplacement.
