review_pass:
  verdict: revise
  source_fidelity: 'Le mouvement dans les quatre directions et la répétition de l’absence de changement de direction sont bien rendus. Toutefois, « ils suivaient la direction vers laquelle la tête était tournée » atténue la construction hébraïque : le texte dit qu’ils allaient après la tête, vers l’endroit où elle se tournait. Une formulation active conserve mieux le mouvement de « la tête » et le lien de suite, sans résoudre son référent difficile.'
  naturalness: Le français est globalement clair et de registre approprié. « Se détournaient » est plus idiomatique et plus souple que « pivotaient » pour le verbe hébreu, qui exprime le fait de ne pas tourner/changer de direction sans imposer l’image technique d’une rotation sur soi.
  terminology: « La tête » doit être conservé, sans note interprétative identifiant son référent. « L’un quelconque de leurs quatre côtés » rend les « quatre côtés/directions » tout en évitant de suggérer un mouvement simultané.
  issues:
