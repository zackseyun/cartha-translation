    issue: La seconde proposition interprète et reformule excessivement « après elle ils allaient ».
    rationale: La draft remplace la suite de la tête par le fait de « suivre la direction » et transforme l’action de la tête (« là où la tête se tournait ») en état passif (« vers laquelle la tête était tournée »). Cela est compréhensible, mais moins fidèle à la syntaxe et au mouvement exprimés par l’hébreu.
  - severity: low
    issue: « Pivotaient » est trop spécifique.
    rationale: יִסַּבּוּ signifie ici ne pas tourner/se détourner durant le déplacement. « Se détournaient » garde cette portée sans imposer un pivotement mécanique.
  revised_text: Quand ils avançaient, ils allaient vers l’un quelconque de leurs quatre côtés. Ils ne se détournaient pas en avançant, car ils allaient à la suite de la tête, vers l’endroit où elle se tournait. Ils ne se détournaient pas en avançant.
