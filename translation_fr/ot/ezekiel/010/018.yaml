source:
  edition: WLC
  text: וַ/יֵּצֵא֙ כְּב֣וֹד יְהוָ֔ה מֵ/עַ֖ל מִפְתַּ֣ן הַ/בָּ֑יִת וַֽ/יַּעֲמֹ֖ד עַל הַ/כְּרוּבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/018.yaml
  text: Then the glory of Yahweh went out from above the threshold of the house and stood over the cherubim[a].
translation:
  language: fr
  text: Alors, la gloire de Yahweh sortit de dessus le seuil de la maison[a] et se tint au-dessus des chérubins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du Temple ». Hébreu : « de la maison ».'
    reason: 'Alternative lexicale : dans ce contexte, « la maison » désigne le Temple, tout en conservant dans le texte le terme hébreu.'
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: quitta
  rationale: Le verbe יצא décrit ici un mouvement vers l’extérieur. « Quitta » exprime naturellement en français le départ depuis le seuil, sans lui donner le sens plus appuyé d’un abandon définitif.
- source_word: כְּבוֹד יְהוָה
  choice: la gloire de Yahweh
  rationale: Cette expression désigne la gloire manifeste associée à la présence de Yahweh dans la vision; la construction hébraïque est conservée avec clarté.
- source_word: מֵעַל מִפְתַּן
  choice: le seuil
  rationale: La préposition composée indique l’éloignement d’une position située au-dessus du seuil. En français, après « quitter », la simple mention du seuil rend naturellement le point de départ; une note signale la précision spatiale de l’hébreu.
- source_word: הַבָּיִת
  choice: la Maison
  rationale: L’hébreu dit littéralement « la maison », tout en désignant ici le Temple. La majuscule contextuelle permet de conserver l’image source sans rendre le référent obscur.
- source_word: וַיַּעֲמֹד
  choice: se tint
  rationale: עמד signifie se tenir ou prendre position. « Se tint » convient au registre visionnaire et décrit une position sans suggérer nécessairement un arrêt après déplacement.
- source_word: עַל הַכְּרוּבִים
  choice: au-dessus des chérubins
  rationale: Dans cette scène, עַל exprime la position de la gloire par rapport aux êtres célestes. « Au-dessus de » restitue clairement cette relation spatiale.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Yahvé
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve au lieu de le remplacer par un titre.
- issue: Interprétation de הַבָּיִת
  choice: la Maison
  alternative: le Temple
  rationale: Le référent contextuel est le Temple, mais le mot hébreu est « maison ». Le texte garde cette désignation et la note explicite afin de ne pas substituer silencieusement l’interprétation au terme source.
- issue: Position initiale de la gloire
  choice: quitta le seuil, avec précision en note
  alternative: sortit de dessus le seuil
  rationale: L’hébreu situe la gloire au-dessus du seuil. La formulation française principale évite une tournure pesante, tandis que la note préserve explicitement le détail spatial.
translation_notes:
  register: Français moderne, digne et lisible. « Maison » porte une majuscule pour signaler son emploi contextuel comme désignation du Temple. La note conserve à la fois le sens littéral de הַבָּיִת et la nuance spatiale de מֵעַל.
