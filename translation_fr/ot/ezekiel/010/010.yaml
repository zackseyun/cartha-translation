  source_fidelity: 'Le sens général est bien rendu : les quatre roues ont une apparence identique. Toutefois, « au milieu d’une autre roue » peut évoquer une position centrale plutôt que l’imbrication exprimée par בְּתוֹךְ (« à l’intérieur de / dans »). « C’était comme si » ajoute aussi une nuance hypothétique et un décalage au passé qui ne sont pas nécessaires dans la comparaison hébraïque.'
