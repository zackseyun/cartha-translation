  text: As for their appearance[a], the four of them had one likeness[b], as when a wheel is within a wheel.
translation:
  language: fr
  text: 'Quant à leur aspect, toutes les quatre avaient la même forme[a] : c’était comme lorsqu’une roue est à l’intérieur d’une autre roue[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une seule ressemblance pour les quatre ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la roue à l’intérieur de la roue ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַרְאֵיהֶם
  choice: Quant à leur aspect
  rationale: מַרְאֶה désigne l’aspect ou la forme visible. « Quant à » rend naturellement la fonction thématique du waw en français.
- source_word: דְּמוּת אֶחָד לְאַרְבַּעְתָּם
  choice: toutes les quatre avaient la même forme
  rationale: דְּמוּת אֶחָד souligne que les quatre roues partageaient une forme identique. Cette formulation française explicite la relation grammaticale sans modifier le sens.
- source_word: כַּאֲשֶׁר יִהְיֶה
  choice: c’était comme si ... se trouvait
  rationale: La construction introduit une comparaison. Cette tournure idiomatique conserve le caractère descriptif de la vision.
- source_word: הָאוֹפַן בְּתוֹךְ הָאוֹפָן
  choice: une roue se trouvait au milieu d’une autre roue
  rationale: בְּתוֹךְ indique une position au milieu ou à l’intérieur. Les articles hébreux sont rendus par des indéfinis, plus naturels en français dans cette comparaison.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le féminin « toutes les quatre » reprend les quatre roues mentionnées dans le contexte immédiat. La formulation conserve l’étrangeté de l’image visionnaire sans tenter d’en préciser la mécanique.
