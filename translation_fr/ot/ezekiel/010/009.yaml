base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/009.yaml
  text: And I looked[a], and behold, four wheels beside the cherubim, one wheel beside each cherub; and the appearance of the wheels was like beryl stone.
translation:
  language: fr
  text: 'Je regardai : voici quatre roues à côté des chérubins, une roue à côté de chaque chérubin. Les roues avaient l’aspect d’une pierre de Tarsis[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit « pierre de Tarsis ». L’identification exacte de cette pierre précieuse est incertaine; il pourrait s’agir du béryl, de la chrysolithe ou d’une autre gemme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: Je regardai
  rationale: Dans ce récit de vision, le verbe marque l’attention du prophète avant la description; « regardai » restitue naturellement cette progression.
- source_word: וְהִנֵּה
  choice: voici
  rationale: « Voici » conserve la force vive et déictique de הִנֵּה dans une vision prophétique, sans alourdir la phrase.
- source_word: אַרְבָּעָה אוֹפַנִּים
  choice: quatre roues
  rationale: Traduction directe et usuelle dans le contexte de la vision du char divin d’Ézéchiel.
- source_word: אֵצֶל הַכְּרוּבִים
  choice: à côté des chérubins
  rationale: Rend la proximité exprimée par אֵצֶל sans préciser indûment la position.
- source_word: אוֹפַן אֶחָד אֵצֶל הַכְּרוּב אֶחָד
  choice: une roue à côté de chaque chérubin
  rationale: La répétition hébraïque « un… un » a une valeur distributive; « chaque » en donne clairement le sens en français.
- source_word: וּמַרְאֵה הָאוֹפַנִּים
  choice: Les roues avaient l’aspect
  rationale: Formulation française naturelle qui conserve l’idée d’apparence visible exprimée par מַרְאֶה.
- source_word: כְּעֵין אֶבֶן תַּרְשִׁישׁ
  choice: d’une pierre de Tarsis
  rationale: La comparaison porte sur l’apparence de la pierre. La translittération « Tarsis » préserve l’incertitude réelle sur l’identification du minéral, plutôt que d’imposer « béryl », « chrysolithe » ou « topaze ».
