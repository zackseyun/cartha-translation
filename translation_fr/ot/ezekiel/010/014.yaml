source:
  edition: WLC
  text: וְ/אַרְבָּעָ֥ה פָנִ֖ים לְ/אֶחָ֑ד פְּנֵ֨י הָ/אֶחָ֜ד פְּנֵ֣י הַ/כְּר֗וּב וּ/פְנֵ֤י הַ/שֵּׁנִי֙ פְּנֵ֣י אָדָ֔ם וְ/הַ/שְּׁלִישִׁי֙ פְּנֵ֣י אַרְיֵ֔ה וְ/הָ/רְבִיעִ֖י פְּנֵי נָֽשֶׁר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/014.yaml
  text: 'And each one had four faces: the face of the first was the face of the cherub[a], and the face of the second was the face of a man, and the third the face of a lion[b], and the fourth the face of an eagle.'
translation:
  language: fr
  text: 'Chacun avait quatre faces : la face du premier était celle du chérubin[a], la face du deuxième celle d’un homme, la troisième celle d’un lion, et la quatrième celle d’un aigle[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En Ézéchiel 1.10, la face correspondante est décrite comme celle d’un taureau; ici, le texte hébreu porte « le chérubin ».
    reason: cross_reference
  - marker: b
    text: Ou « vautour »; le terme hébreu peut désigner plus largement un grand rapace.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַרְבָּעָה פָנִים לְאֶחָד
  choice: Chacun avait quatre faces
  rationale: La proposition hébraïque est sans verbe et signifie littéralement « quatre faces à chacun ». L’ajout de « avait » donne en français une formulation naturelle tout en conservant le sens distributif.
- source_word: פְּנֵי הָאֶחָד
  choice: la face du premier
  rationale: Dans la suite « deuxième… troisième… quatrième », הָאֶחָד a une valeur ordinale. « Du premier » reproduit clairement cette progression.
- source_word: הַכְּרוּב
  choice: le chérubin
  rationale: Le nom porte l’article défini. Cette traduction directe maintient aussi l’écart remarquable avec Ézéchiel 1.10, où la face correspondante est celle d’un taureau.
- source_word: אָדָם
  choice: un homme
  rationale: Dans cette série de faces d’êtres vivants, le terme désigne une figure humaine. « La face d’un homme » est naturel et précis en français.
- source_word: אַרְיֵה
  choice: un lion
  rationale: Désignation animale directe, rendue naturellement en français après « celle de ».
- source_word: נָשֶׁר
  choice: un aigle
  rationale: Le mot peut désigner plus largement un grand rapace, mais « aigle » est son équivalent traditionnel et convient à l’imagerie de la vision; l’autre possibilité est signalée en note.
theological_decisions:
- issue: Rapport entre « chérubin » ici et la face de taureau en Ézéchiel 1.10
  choice: Traduire le texte reçu par « le chérubin » sans l’harmoniser.
  alternative: Traduire « le taureau » ou paraphraser « un chérubin à face de taureau ».
  rationale: L’hébreu de ce verset dit explicitement « le chérubin ». La traduction conserve cette différence et laisse la note informer le lecteur du parallèle sans résoudre la tension.
translation_notes:
  register: Français international moderne, clair et digne. La répétition complète de « la face » est allégée après le premier membre par « celle », sans modifier la structure de l’énumération.
