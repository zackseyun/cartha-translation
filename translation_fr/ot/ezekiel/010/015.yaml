  terminology: « Chérubins », « être vivant » et « canal de Kebar » conviennent au registre visionnaire et à la terminologie d’Ézéchiel. La note doit toutefois parler de « l’être vivant » au singulier, et non des « êtres », afin de ne pas neutraliser le trait textuel qu’elle explique.
