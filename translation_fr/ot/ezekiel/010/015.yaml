    rationale: L’hébreu porte ici le singulier הַחַיָּה, « l’être vivant ». Même si les chérubins sont collectivement identifiés aux êtres de la vision antérieure, la note doit conserver le singulier et ne pas présenter cette identification comme une pluralisation du texte.
