  text: וַ/יֵּרֹ֖מּוּ הַ/כְּרוּבִ֑ים הִ֣יא הַ/חַיָּ֔ה אֲשֶׁ֥ר רָאִ֖יתִי בִּֽ/נְהַר כְּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/015.yaml
  text: And the cherubim rose up[a]. They were the living creature that I had seen by the Kebar Canal.
translation:
  language: fr
  text: Les chérubins s’élevèrent. C’était l’être vivant que j’avais vu au bord du canal de Kebar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici le singulier « l’être vivant », en identifiant les chérubins à l’être vivant vu auparavant. « Canal de Kebar » peut aussi se traduire par « fleuve Kebar ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּרֹמּוּ
  choice: s’élevèrent
  rationale: Le verbe רוּם exprime ici un mouvement vers le haut sans imposer un agent extérieur; « s’élevèrent » convient au mouvement de la vision.
- source_word: הַכְּרוּבִים
  choice: les chérubins
  rationale: Terme biblique français courant, qui rend le pluriel hébreu כְּרוּבִים dans un registre digne et naturel.
- source_word: הִיא הַחַיָּה
  choice: C’était l’être vivant
  rationale: Le pronom et le nom sont au féminin singulier en hébreu. Cette formulation conserve le singulier surprenant tout en identifiant les chérubins à l’être vivant déjà vu.
- source_word: אֲשֶׁר רָאִיתִי
  choice: que j’avais vu
  rationale: Le plus-que-parfait indique naturellement en français que cette vision était antérieure au moment raconté.
- source_word: בִּנְהַר כְּבָר
  choice: près du canal de Kebar
  rationale: Dans le contexte babylonien, נְהַר peut désigner un canal; « près de » rend la localisation exprimée par בְּ, et « Kebar » suit une translittération française moderne.
theological_decisions:
- issue: Identification des chérubins avec l’être vivant vu en Ézéchiel 1
  choice: Conserver le singulier dans « C’était l’être vivant » malgré le sujet pluriel précédent.
  alternative: « C’étaient les êtres vivants que j’avais vus » ou « Ils étaient l’être vivant »
  rationale: L’hébreu passe intentionnellement du pluriel « les chérubins » au féminin singulier « elle, l’être vivant ». La formulation retenue préserve cette tension grammaticale et l’identification littéraire sans la résoudre par une pluralisation interprétative.
translation_notes:
  register: Français international moderne, sobre et digne. « Être vivant » évite la nuance zoologique que pourrait prendre « créature vivante », tout en restant cohérent avec le vocabulaire visionnaire d’Ézéchiel.
