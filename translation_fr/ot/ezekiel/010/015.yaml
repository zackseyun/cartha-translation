  source_fidelity: Le texte rend correctement וַיֵּרֹמּוּ (« s’élevèrent »), כְּרוּבִים (« chérubins »), le singulier inhabituel de הִיא הַחַיָּה (« C’était l’être vivant ») et l’antériorité de רָאִיתִי (« j’avais vu »). « Canal de Kebar » est un rendu défendable de נְהַר כְּבָר dans le contexte babylonien. En revanche, « près du » atténue légèrement la simple localisation exprimée par בְּ; « au bord du » est plus précis dans ce contexte.
