source:
  edition: WLC
  text: וַ/יָּ֤רָם כְּבוֹד יְהוָה֙ מֵ/עַ֣ל הַ/כְּר֔וּב עַ֖ל מִפְתַּ֣ן הַ/בָּ֑יִת וַ/יִּמָּלֵ֤א הַ/בַּ֨יִת֙ אֶת הֶ֣/עָנָ֔ן וְ/הֶֽ/חָצֵר֙ מָֽלְאָ֔ה אֶת נֹ֖גַהּ כְּב֥וֹד יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/004.yaml
  text: And the glory of Yahweh rose up from above the cherub to the threshold of the house[a], and the house was filled with the cloud[b], and the court was filled with the brightness of the glory of Yahweh.
translation:
  language: fr
  text: La gloire de Yahweh s’éleva d’au-dessus du chérubin[a] jusqu’au seuil du Temple[b]. Le Temple fut rempli de la nuée, et la cour fut remplie de l’éclat de la gloire de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de sur le chérubin ». L’hébreu emploie ici le singulier « chérubin ».'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de la maison » ; dans ce contexte, « la maison » désigne l’édifice du Temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָם
  choice: s’éleva
  rationale: Le verbe רום décrit ici un mouvement vers le haut; la forme pronominale française reste naturelle sans préciser indûment l’agent du mouvement.
- source_word: כְּבוֹד יְהוָה
  choice: la gloire de Yahweh
  rationale: כָּבוֹד désigne ici la manifestation glorieuse de la présence divine; le nom propre Yahweh rend directement le tétragramme.
- source_word: מֵעַל הַכְּרוּב
  choice: d’au-dessus du chérubin
  rationale: מֵעַל marque le départ depuis une position située au-dessus ou sur le chérubin. Le singulier hébreu est conservé.
- source_word: עַל מִפְתַּן הַבָּיִת
  choice: jusqu’au seuil du Temple
  rationale: Avec ce mouvement, עַל indique la destination. מִפְתָּן est le seuil, et הַבַּיִת désigne ici l’édifice du sanctuaire.
- source_word: וַיִּמָּלֵא הַבַּיִת אֶת הֶעָנָן
  choice: Le Temple se remplit de la nuée
  rationale: La tournure française rend naturellement le sens médio-passif de מלא. L’article défini désigne la nuée théophanique déjà connue dans la vision.
- source_word: וְהֶחָצֵר מָלְאָה
  choice: et la cour se remplit
  rationale: חָצֵר désigne la cour du complexe du Temple; la formulation parallèle conserve le rythme de l’hébreu.
- source_word: נֹגַהּ
  choice: l’éclat
  rationale: נֹגַהּ exprime une lumière brillante ou une radiance; « éclat » est clair, digne et idiomatique en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve ici le nom divin plutôt que de le remplacer par un titre.
- issue: Nature de כְּבוֹד יְהוָה
  choice: la gloire de Yahweh
  alternative: la présence de Yahweh
  rationale: « Gloire » conserve le terme concret et théologiquement chargé du texte, sans réduire sa manifestation visible à une simple paraphrase interprétative.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Temple » explicite le référent contextuel de « la Maison »; « nuée » conserve la tonalité biblique et théophanique. Le singulier « chérubin » est maintenu conformément à l’hébreu.
