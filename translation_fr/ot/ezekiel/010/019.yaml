  text: וַ/יִּשְׂא֣וּ הַ/כְּרוּבִ֣ים אֶת כַּ֠נְפֵי/הֶם וַ/יֵּר֨וֹמּוּ מִן הָ/אָ֤רֶץ לְ/עֵינַ/י֙ בְּ/צֵאתָ֔/ם וְ/הָ/אֽוֹפַנִּ֖ים לְ/עֻמָּתָ֑/ם וַֽ/יַּעֲמֹ֗ד פֶּ֣תַח שַׁ֤עַר בֵּית יְהוָה֙ הַ/קַּדְמוֹנִ֔י וּ/כְב֧וֹד אֱלֹהֵֽי יִשְׂרָאֵ֛ל עֲלֵי/הֶ֖ם מִ/לְ/מָֽעְלָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/019.yaml
  text: Then the cherubim lifted up their wings and rose from the earth before my eyes as they went out[a], with the wheels beside them; and it stood at the entrance of the eastern gate of the house of Yahweh[c][b], and the glory of the God of Israel was above them, from above.
translation:
  language: fr
  text: Puis les chérubins levèrent leurs ailes et s’élevèrent de la terre sous mes yeux tandis qu’ils sortaient, avec les roues à leurs côtés[a]. Il se tint[b] à l’entrée de la porte orientale de la maison de Yahweh[c], et la gloire du Dieu d’Israël était au-dessus d’eux, d’en haut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les roues en face d’eux » ou « parallèlement à eux ». L’expression hébraïque indique une position correspondante.
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe hébreu est au singulier : « il se tint ». Le sujet n’est pas exprimé ; il peut désigner la structure composite de la vision plutôt que les chérubins seuls.'
    reason: alternative_reading
  - marker: c
    text: « Yahweh » représente le nom divin YHWH.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ הַכְּרוּבִים אֶת כַּנְפֵיהֶם
  choice: les chérubins levèrent leurs ailes
  rationale: Rend concrètement le mouvement des ailes et conserve le terme biblique précis « chérubins ».
- source_word: וַיֵּרוֹמּוּ מִן הָאָרֶץ
  choice: s’élevèrent de terre
  rationale: Exprime naturellement en français le mouvement ascendant depuis le sol sans imposer une voix passive.
- source_word: לְעֵינַי
  choice: sous mes yeux
  rationale: Expression française courante qui maintient la perspective de témoin d’Ézéchiel.
- source_word: בְּצֵאתָם
  choice: tandis qu’ils sortaient
  rationale: Conserve la simultanéité indiquée par la construction infinitive hébraïque.
- source_word: לְעֻמָּתָם
  choice: à leurs côtés
  rationale: Communique la position correspondante des roues par rapport aux chérubins; d’autres nuances spatiales restent possibles et sont signalées en note.
- source_word: וַיַּעֲמֹד
  choice: Il se tint
  rationale: Préserve le singulier masculin surprenant du texte hébreu sans identifier explicitement son référent.
- source_word: פֶּתַח שַׁעַר בֵּית יְהוָה הַקַּדְמוֹנִי
  choice: à l’entrée de la porte orientale de la maison de Yahweh
  rationale: Suit étroitement les relations nominales du texte et conserve l’image de la maison sanctuaire ainsi que l’orientation de la porte.
- source_word: מִלְמָעְלָה
  choice: tout en haut
  rationale: Conserve l’élément adverbial final, même s’il renforce l’idée déjà exprimée par « au-dessus d’eux ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; la translittération rend visible le nom propre sans lui substituer un titre.
- issue: Sujet singulier de וַיַּעֲמֹד après des noms pluriels
  choice: Il se tint
  alternative: ils se tinrent
  rationale: Le verbe hébreu est au singulier masculin. Le français conserve cette tension grammaticale; le sujet peut être compris comme l’ensemble formé par le trône-char, plutôt que comme les seuls chérubins.
- issue: Redoublement spatial עֲלֵיהֶם מִלְמָעְלָה
  choice: au-dessus d’eux, tout en haut
  alternative: au-dessus d’eux
  rationale: Le maintien du dernier adverbe respecte l’insistance du texte hébreu au lieu de la supprimer comme redondante.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe demeure fluide tout en conservant le singulier inattendu du verbe et l’insistance spatiale finale de l’hébreu.
