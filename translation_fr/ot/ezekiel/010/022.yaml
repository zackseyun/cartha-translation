id: EZK.10.22
reference: Ezekiel 10:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/דְמ֣וּת פְּנֵי/הֶ֔ם הֵ֣מָּה הַ/פָּנִ֗ים אֲשֶׁ֤ר רָאִ֨יתִי֙ עַל נְהַר כְּבָ֔ר מַרְאֵי/הֶ֖ם וְ/אוֹתָ֑/ם אִ֛ישׁ אֶל עֵ֥בֶר פָּנָ֖י/ו יֵלֵֽכוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/022.yaml
  text: And the likeness of their faces was the same as the faces that I had seen by the Kebar River—their appearances and themselves[b][a]. Each one went straight ahead.
translation:
  language: fr
  text: La forme de leurs visages était celle des visages que j’avais vus près du fleuve Kebar — leur aspect et eux-mêmes[a]. Chacun allait droit devant lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leur aspect et eux-mêmes ». Cette expression condensée souligne qu’il s’agissait des mêmes êtres que dans la vision précédente.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « chacun allait dans la direction de son visage », c’est-à-dire sans se détourner.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת
  choice: La forme
  rationale: דְּמוּת désigne la ressemblance ou la forme. « La forme » convient naturellement aux visages tout en conservant le vocabulaire concret de la vision.
- source_word: פְּנֵיהֶם / הַפָּנִים
  choice: leurs visages… les visages
  rationale: פָּנִים signifie ici concrètement « visage(s) ». La répétition préserve l’imagerie des êtres vivants et la correspondance avec la vision antérieure.
- source_word: הֵמָּה
  choice: était celle
  rationale: Le pronom établit avec insistance l’identité entre les visages présents et ceux déjà vus. Cette tournure française rend l’équation sans alourdir la phrase.
- source_word: אֲשֶׁר רָאִיתִי
  choice: que j’avais vus
  rationale: Le plus-que-parfait situe naturellement la vision antérieure par rapport au récit présent; l’accord de « vus » se fait avec « visages ».
- source_word: עַל נְהַר כְּבָר
  choice: près du fleuve Kebar
  rationale: עַל indique ici la proximité géographique. « Fleuve » rend נָהָר dans un registre biblique courant, et « Kebar » translittère le nom propre.
- source_word: מַרְאֵיהֶם וְאוֹתָם
  choice: leur aspect et eux-mêmes
  rationale: La formulation volontairement resserrée conserve les deux éléments de l’hébreu et souligne qu’il s’agit bien des mêmes êtres, sans réduire la phrase à une simple ressemblance.
- source_word: אִישׁ אֶל עֵבֶר פָּנָיו יֵלֵכוּ
  choice: Chacun allait droit devant lui
  rationale: L’expression signifie littéralement que chacun va dans la direction vers laquelle son visage est tourné; « droit devant lui » restitue clairement le déplacement sans détour.
