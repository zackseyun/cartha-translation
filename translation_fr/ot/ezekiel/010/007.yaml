  text: וַ/יִּשְׁלַח֩ הַ/כְּר֨וּב אֶת יָד֜/וֹ מִ/בֵּינ֣וֹת לַ/כְּרוּבִ֗ים אֶל הָ/אֵשׁ֙ אֲשֶׁר֙ בֵּינ֣וֹת הַ/כְּרֻבִ֔ים וַ/יִּשָּׂא֙ וַ/יִּתֵּ֔ן אֶל חָפְנֵ֖י לְבֻ֣שׁ הַ/בַּדִּ֑ים וַ/יִּקַּ֖ח וַ/יֵּצֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/007.yaml
  text: Then the cherub stretched out his hand from among the cherubim to the fire that was among the cherubim[a], and he lifted it up and put it into the palms of the one clothed in linen[b], who took it and went out.
translation:
  language: fr
  text: Alors le chérubin étendit la main d’entre les chérubins vers le feu qui se trouvait entre les chérubins[a]. Il en prit et le déposa dans les paumes de celui qui était vêtu de lin[b]. Celui-ci le prit et sortit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « d’entre les chérubins »… « le feu qui se trouvait entre les chérubins ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans les paumes de celui qui était vêtu de lin ». Dans le contexte, il s’agit du personnage appelé auparavant « l’homme vêtu de lin » (10.2, 10.6).'
    reason: cross_reference
lexical_decisions:
- source_word: הַכְּרוּב
  choice: le chérubin
  rationale: Le nom est singulier et défini; le verset met en scène un seul membre du groupe. « Chérubin » conserve la désignation précise de cet être céleste.
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ
  choice: étendit la main
  rationale: Avec « sa main », le verbe exprime ici le geste concret de tendre ou d'avancer la main.
- source_word: מִבֵּינוֹת לַכְּרוּבִים
  choice: depuis le milieu des chérubins
  rationale: Cette formulation naturelle garde la valeur spatiale de la locution hébraïque, qui peut aussi être rendue plus littéralement par « d'entre les chérubins ».
- source_word: הָאֵשׁ אֲשֶׁר בֵּינוֹת הַכְּרֻבִים
  choice: le feu qui se trouvait au milieu des chérubins
  rationale: La traduction conserve la répétition spatiale et l'article défini de l'hébreu sans alourdir le français.
- source_word: וַיִּשָּׂא
  choice: Il en prit
  rationale: Le verbe signifie lever ou emporter; son objet est implicite. Le pronom « en » renvoie au feu, ou à ce qui est pris dans le feu, sans préciser davantage sa nature.
- source_word: וַיִּתֵּן
  choice: le déposa dans
  rationale: Dans cette scène de transfert, « déposer dans » rend naturellement l'action exprimée par le verbe courant « donner, mettre ».
- source_word: חָפְנֵי
  choice: les mains en creux
  rationale: Le terme désigne les paumes ou mains formant un creux. Cette expression rend l'image plus clairement que le seul mot « paumes » en français.
- source_word: לְבֻשׁ הַבַּדִּים
  choice: celui qui était vêtu de lin
  rationale: L'hébreu ne répète pas ici le mot « homme », bien que le contexte identifie ainsi ce personnage. Cette traduction respecte la formulation minimale du verset.
- source_word: וַיִּקַּח וַיֵּצֵא
  choice: Celui-ci le prit et sortit
  rationale: Le démonstratif clarifie naturellement en français que le sujet des deux derniers verbes est le personnage vêtu de lin, tout en conservant la succession des actions.
theological_decisions:
- issue: Identité du destinataire
  choice: celui qui était vêtu de lin
  alternative: l'homme vêtu de lin
  rationale: Ézéchiel 10.2 et 10.6 l'identifie comme un homme, mais le présent verset dit seulement « vêtu de lin ». Le texte principal n'ajoute donc pas le nom absent, tandis que la note rappelle le contexte.
- issue: Nature de ce qui est transféré
  choice: Il en prit ... le déposa ... Celui-ci le prit
  alternative: il souleva le feu / des braises
  rationale: L'objet des verbes est implicite en hébreu. Les pronoms français maintiennent cette relative indétermination au lieu d'imposer « braises », terme fourni par le contexte mais absent du verset.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au registre narratif biblique sans être archaïque. La répétition de « chérubins » est conservée parce qu'elle structure la scène dans l'hébreu. Les pronoms maintiennent l'objet implicite plutôt que de préciser explicitement « des braises ».
