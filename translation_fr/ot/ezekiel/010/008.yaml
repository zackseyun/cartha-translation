  text: וַ/יֵּרָ֖א לַ/כְּרֻבִ֑ים תַּבְנִית֙ יַד אָדָ֔ם תַּ֖חַת כַּנְפֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/008.yaml
  text: And the cherubim appeared to have the form of a human hand under their wings[a].
translation:
  language: fr
  text: Sous les ailes des chérubins, on distinguait une forme de main humaine[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une main d’homme ». Littéralement : « une forme de main d’homme ».'
    reason: Alternative lexicale et formulation littérale de יַד אָדָם.
lexical_decisions:
- source_word: וַיֵּרָא לַכְּרֻבִים
  choice: On voyait chez les chérubins
  rationale: Le nifal de ראה exprime ici ce qui était visible, tandis que לַכְּרֻבִים rattache la caractéristique aux chérubins. Cette tournure française conserve la valeur visuelle et évite de faire des chérubins ceux qui voient.
- source_word: תַּבְנִית
  choice: la forme de
  rationale: Le nom désigne une forme, une configuration ou une ressemblance visible; « la forme de » convient naturellement à cette description visionnaire.
- source_word: יַד אָדָם
  choice: une main humaine
  rationale: Littéralement « une main d’homme ». Dans cette description anatomique, « une main humaine » exprime clairement le contraste entre une main d’apparence humaine et les chérubins, sans suggérer qu’elle appartient à un homme déterminé.
- source_word: תַּחַת כַּנְפֵיהֶם
  choice: sous leurs ailes
  rationale: Rendu spatial direct et idiomatique de l’expression hébraïque.
theological_decisions:
- issue: Sens de אָדָם dans la description de la main
  choice: une main humaine
  alternative: une main d’homme
  rationale: אָדָם peut désigner l’être humain ou un homme. Ici, l’expression caractérise la forme de la main plutôt que son propriétaire; « humaine » rend ce sens avec naturel, tandis que la note conserve la formulation plus littérale.
translation_notes:
  register: Français moderne, clair et digne. La construction impersonnelle « On voyait » préserve la perspective visuelle du nifal hébreu; « chez les chérubins » rattache sans ambiguïté la main à leur apparence.
