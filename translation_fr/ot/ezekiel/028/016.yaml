    text: Le verbe hébreu signifie « profaner » ou « traiter comme non sacré ». Dans ce contexte, avec la mention de la montagne de Dieu, il exprime vraisemblablement l’exclusion d’un lieu saint.
    reason: lexical_and_syntactic_clarification
  - marker: c
    text: Ou « chérubin qui couvre » ; le participe hébreu évoque le fait de couvrir, d’abriter ou de protéger.
    reason: lexical_alternative
  revision_rationale: 'La révision rend plus directement les deux verbes divins : l’expulsion comme profane exprime de façon idiomatique la profanation associée à l’éloignement de la montagne de Dieu, sans ajouter un second verbe au texte source ; « détruit » restitue la force de אבד. Elle remplace aussi « ton être », formulation abstraite, par « ton intérieur », tout en maintenant le sujet indéterminé de מָל֧וּ par « on ». Les notes sont conservées et la note b est corrigée afin de ne pas revendiquer une littéralité inexacte.'
