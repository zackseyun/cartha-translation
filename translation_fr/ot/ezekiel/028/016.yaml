source:
  edition: WLC
  text: בְּ/רֹ֣ב רְכֻלָּתְ/ךָ֗ מָל֧וּ תוֹכְ/ךָ֛ חָמָ֖ס וַֽ/תֶּחֱטָ֑א וָ/אֶחַלֶּלְ/ךָ֩ מֵ/הַ֨ר אֱלֹהִ֤ים וָֽ/אַבֶּדְ/ךָ֙ כְּר֣וּב הַ/סֹּכֵ֔ךְ מִ/תּ֖וֹךְ אַבְנֵי אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/016.yaml
  text: By the abundance of your trade[a], your midst was filled with violence, and you sinned; so I cast you as profane from the mountain of God, and I destroyed you, O guardian cherub[c][b], from the midst of the stones of fire.
translation:
  language: fr
  text: À cause de l’ampleur de ton commerce[a], on a rempli ton intérieur de violence, et tu as péché. Je t’ai alors expulsé comme profane de la montagne de Dieu[b] ; je t’ai détruit, chérubin protecteur[c], du milieu des pierres de feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ton négoce » ou « de tes échanges commerciaux » ; le terme hébreu peut aussi désigner le trafic de marchandises.
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu signifie « profaner » ou « traiter comme non sacré ». Dans ce contexte, avec la mention de la montagne de Dieu, il exprime vraisemblablement l’exclusion d’un lieu saint.
    reason: lexical_and_syntactic_clarification
  - marker: c
    text: Ou « chérubin qui couvre » ; le participe hébreu évoque le fait de couvrir, d’abriter ou de protéger.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב רְכֻלָּתְךָ
  choice: À cause de l’ampleur de ton commerce
  rationale: La préposition ב avec רֹב exprime ici vraisemblablement la cause ou la circonstance. « Commerce » rend רְכֻלָּה sans lui imposer le caractère illicite que pourrait suggérer « trafic ».
- source_word: מָל֧וּ תוֹכְךָ חָמָס
  choice: on a rempli ton être de violence
  rationale: מָל֧וּ est morphologiquement à la 3e personne du pluriel (« ils ont rempli »), mais son sujet n’est pas exprimé. Le « on » français préserve ce sujet indéterminé au lieu de transformer silencieusement la proposition en passif. « Ton être » exprime naturellement l’intériorité indiquée par תוֹךְ.
- source_word: חָמָס
  choice: violence
  rationale: « Violence » est l’équivalent direct et usuel, tout en pouvant englober l’injustice brutale.
- source_word: וַתֶּחֱטָא
  choice: et tu as péché
  rationale: Traduction directe qui conserve la coordination hébraïque.
- source_word: וָאֶחַלֶּלְךָ מֵהַר אֱלֹהִים
  choice: je t’ai traité comme profane et chassé de la montagne de Dieu
  rationale: Le piel de חלל signifie profaner ou traiter comme non sacré. Avec מִן, le contexte implique l’exclusion du lieu saint ; la formulation française rend ensemble la déchéance cultuelle et l’expulsion sans réduire le verbe à une simple destruction.
- source_word: וָאַבֶּדְךָ
  choice: je t’ai fait disparaître
  rationale: Le piel de אבד peut signifier faire périr, détruire ou faire disparaître. Ici, « fait disparaître » s’accorde avec le complément « du milieu de » tout en préservant la gravité du jugement.
- source_word: כְּרוּב הַסֹּכֵךְ
  choice: chérubin protecteur
  rationale: כְּרוּב est au singulier. Le participe de סכך évoque le fait de couvrir, abriter ou étendre une protection ; « protecteur » exprime naturellement cette fonction.
- source_word: מִתּוֹךְ אַבְנֵי אֵשׁ
  choice: du milieu des pierres de feu
  rationale: La formulation conserve délibérément l’image énigmatique de l’hébreu sans l’expliquer.
theological_decisions:
- issue: Identité du personnage interpellé
  choice: Conserver l’adresse directe et l’appellation « chérubin » sans identifier davantage le personnage.
  alternative: Ramener l’image au seul roi humain ou l’identifier explicitement à Satan ou à un ange déchu.
  rationale: Le verset associe l’interpellation personnelle à une imagerie chérubique et divine. La traduction doit maintenir cette tension interprétative plutôt que lui imposer un système théologique.
- issue: Portée de וָאֶחַלֶּלְךָ
  choice: Exprimer à la fois le traitement comme profane et l’expulsion de la montagne de Dieu.
  alternative: « Je t’ai profané » ou « je t’ai expulsé comme impur ».
  rationale: Le verbe porte une valeur cultuelle réelle, tandis que la préposition « de » et le lieu sacré indiquent une exclusion. La traduction principale articule ces deux dimensions ; la note signale la formulation plus littérale.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme judiciaire et l’imagerie élevée sont conservés. Le sujet indéterminé du pluriel מָל֧וּ est rendu par « on », conformément à sa morphologie, plutôt que par un passif qui effacerait cette particularité.
