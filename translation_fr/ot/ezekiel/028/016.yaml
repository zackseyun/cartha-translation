revisions:
- from: À cause de l’ampleur de ton commerce[a], on a rempli ton être de violence, et tu as péché. Alors je t’ai traité comme profane et chassé de la montagne de Dieu[b] ; je t’ai fait disparaître, chérubin protecteur[c], du milieu des pierres de feu.
  to: À cause de l’ampleur de ton commerce[a], on a rempli ton intérieur de violence, et tu as péché. Je t’ai alors expulsé comme profane de la montagne de Dieu[b] ; je t’ai détruit, chérubin protecteur[c], du milieu des pierres de feu.
  rationale: 'La révision rend plus directement les deux verbes divins : l’expulsion comme profane exprime de façon idiomatique la profanation associée à l’éloignement de la montagne de Dieu, sans ajouter un second verbe au texte source ; « détruit » restitue la force de אבד. Elle remplace aussi « ton être », formulation abstraite, par « ton intérieur », tout en maintenant le sujet indéterminé de מָל֧וּ par « on ». Les notes sont conservées et la note b est corrigée afin de ne pas revendiquer une littéralité inexacte.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:00:06Z'
review_pass:
  verdict: revise
  source_fidelity: La structure du texte hébreu est globalement bien suivie. Toutefois, « chassé » ajoute une action explicite à חלל ; l’idée d’exclusion est très probable avec « de la montagne de Dieu », mais il est préférable de la présenter comme le sens contextuel de « expulsé comme profane ». « Je t’ai fait disparaître » atténue inutilement אבד, dont « je t’ai détruit » rend plus directement la force. La note b qualifie improprement de littérale une paraphrase syntaxiquement incertaine (« loin de »).
  naturalness: « On a rempli ton être de violence » est compréhensible, mais « ton être » est abstrait et peu idiomatique dans ce contexte. « On a rempli ton intérieur de violence » conserve le sujet indéterminé du pluriel hébreu tout en étant plus naturel en français moderne. La formulation révisée garde un registre prophétique soutenu et accessible.
  terminology: « Commerce », « violence », « péché », « montagne de Dieu », « chérubin protecteur » et « pierres de feu » sont appropriés. « Expulsé comme profane » exprime la valeur cultuelle de חלל et l’éloignement impliqué par מן sans prétendre que le texte comporte un second verbe « chasser ».
  issues:
  - severity: medium
    issue: La traduction principale ajoute « chassé » comme seconde action coordonnée.
    rationale: וָאֶחַלֶּלְךָ ne contient qu’un verbe. L’exclusion hors de la montagne est fortement impliquée, mais doit être intégrée à la manière de rendre ce verbe (« expulsé comme profane »), plutôt que présentée comme un verbe supplémentaire.
  - severity: medium
    issue: « Je t’ai fait disparaître » est plus faible et moins précis que le verbe hébreu.
    rationale: אַבֶּדְךָ exprime ici la destruction ou la mise à mort/perte. « Je t’ai détruit » conserve mieux sa force lexicale et le parallèle avec le jugement divin.
  - severity: medium
    issue: La note b décrit comme littérale une formulation qui ne l’est pas strictement.
    rationale: « Loin de la montagne » explicite le mouvement d’éloignement, mais ne constitue pas une traduction littérale neutre de la construction. La note doit distinguer le sens du verbe et l’implication contextuelle d’exclusion.
  revised_text: À cause de l’ampleur de ton commerce[a], on a rempli ton intérieur de violence, et tu as péché. Je t’ai alors expulsé comme profane de la montagne de Dieu[b] ; je t’ai détruit, chérubin protecteur[c], du milieu des pierres de feu.
  revised_footnotes:
