source:
  edition: WLC
  text: בֶּן אָדָ֡ם אֱמֹר֩ לִ/נְגִ֨יד צֹ֜ר כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה יַ֣עַן גָּבַ֤הּ לִבְּ/ךָ֙ וַ/תֹּ֨אמֶר֙ אֵ֣ל אָ֔נִי מוֹשַׁ֧ב אֱלֹהִ֛ים יָשַׁ֖בְתִּי בְּ/לֵ֣ב יַמִּ֑ים וְ/אַתָּ֤ה אָדָם֙ וְֽ/לֹא אֵ֔ל וַ/תִּתֵּ֥ן לִבְּ/ךָ֖ כְּ/לֵ֥ב אֱלֹהִֽים־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/002.yaml
  text: 'Son of man[a], say to the prince of Tyre, ‘Thus says the Lord GOD: Because your heart is proud, and you say, “I am a god; I sit in the seat of gods in the heart of the seas,” yet you are a man and not a god[b], though you set your heart like the heart of gods.”'
translation:
  language: fr
  text: 'Fils d’homme, dis au chef de Tyr : « Voici ce que dit le Seigneur, l’Éternel : Parce que ton cœur s’est enorgueilli et que tu as dit : “Je suis un dieu ; je siège dans la demeure des dieux, au cœur des mers”[a], alors que tu es un homme et non un dieu, tu as fait de ton cœur un cœur semblable à celui des dieux[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Je suis Dieu ; je siège dans la demeure de Dieu, au cœur des mers. » Les termes hébreux אֵל et אֱלֹהִים peuvent ici se comprendre au singulier.'
    reason: alternative_reading
  - marker: b
    text: 'Autre traduction possible : « tu as fait de ton cœur un cœur semblable à celui de Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Expression prophétique caractéristique d’Ézéchiel. La formulation traditionnelle demeure claire en français et conserve l’image hébraïque.
- source_word: לִנְגִיד צֹר
  choice: au chef de Tyr
  rationale: נָגִיד désigne un dirigeant ou chef. « Chef » est naturel en français moderne et n’introduit pas le titre plus précis de « roi », absent de ce verset.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur, l’Éternel
  rationale: Rend les deux éléments du titre composé sans produire l’expression peu naturelle « Seigneur SEIGNEUR » ; « l’Éternel » suit l’usage français courant pour le tétragramme.
- source_word: יַעַן גָּבַהּ לִבְּךָ
  choice: Parce que ton cœur s’est enorgueilli
  rationale: L’hébreu évoque littéralement un cœur qui s’est élevé. Cette formulation française exprime clairement l’orgueil tout en conservant le cœur comme siège intérieur de l’attitude.
- source_word: אֵל אֲנִי
  choice: Je suis un dieu
  rationale: אֵל peut désigner un dieu au sens générique. Le contexte présente la prétention à la divinité d’un dirigeant païen, sans imposer son identification explicite au Dieu d’Israël.
- source_word: מוֹשַׁב אֱלֹהִים
  choice: la demeure des dieux
  rationale: מוֹשָׁב peut désigner un siège, un lieu où l’on réside ou une demeure. Avec « je siège », « demeure » évite une répétition maladroite et conserve l’idée d’un lieu divin.
- source_word: בְּלֵב יַמִּים
  choice: au cœur des mers
  rationale: Reproduit l’image vive de l’hébreu et désigne naturellement le milieu des mers en français.
- source_word: וְאַתָּה אָדָם וְלֹא אֵל
  choice: alors que tu es un homme et non un dieu
  rationale: Le contraste porte sur l’humanité du dirigeant masculin face à sa prétention divine. « Alors que » rend naturellement la tension adversative du contexte.
- source_word: וַתִּתֵּן לִבְּךָ כְּלֵב אֱלֹהִים
  choice: tu as considéré ton cœur comme le cœur des dieux
  rationale: La formulation exprime l’évaluation orgueilleuse que le dirigeant porte sur lui-même, tout en maintenant le vocabulaire hébraïque du cœur et la comparaison explicite.
theological_decisions:
- issue: Faut-il comprendre אֵל et אֱלֹהִים comme des désignations génériques/plurielles de la divinité ou comme une référence singulière à Dieu ?
  choice: Le texte principal porte « un dieu » et « des dieux ».
  alternative: « Je suis Dieu ; je siège dans la demeure de Dieu, au cœur des mers » et « tu as considéré ton cœur comme le cœur de Dieu ».
  rationale: Dans le contexte, le chef de Tyr revendique un statut divin. אֵל peut être générique, tandis que אֱלֹהִים peut être pluriel ou désigner le Dieu unique. Le pluriel donne ici une lecture cohérente, mais la lecture singulière reste linguistiquement possible et doit être signalée plutôt qu’écartée.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le tutoiement correspond à l’adresse prophétique singulière. Les images du cœur et du cœur des mers sont conservées, tandis que la syntaxe est légèrement adaptée pour rester naturelle en français.
