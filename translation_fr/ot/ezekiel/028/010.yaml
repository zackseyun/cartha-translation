  text: מוֹתֵ֧י עֲרֵלִ֛ים תָּמ֖וּת בְּ/יַד זָרִ֑ים כִּ֚י אֲנִ֣י דִבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/010.yaml
  text: You will die the death of the uncircumcised by the hand of foreigners[a], for I have spoken, declares the Lord GOD.
translation:
  language: fr
  text: Tu mourras de la mort des incirconcis[a], par la main d’étrangers, car c’est moi qui ai parlé — déclaration du Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Tu mourras des morts des incirconcis » ; cette expression signifie que tu mourras d’une mort semblable à la leur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹתֵי עֲרֵלִים תָּמוּת
  choice: Tu mourras comme meurent les incirconcis
  rationale: Le pluriel construit מוֹתֵי, associé au verbe תָּמוּת, forme une expression hébraïque précisant la manière ou le caractère de la mort. Cette formulation française transmet naturellement l’idée d’une mort semblable à celle des incirconcis, tout en conservant la portée honteuse et covenantale du terme.
- source_word: עֲרֵלִים
  choice: les incirconcis
  rationale: L’adjectif substantivé désigne des hommes non circoncis et porte ici une connotation de déshonneur. « Les incirconcis » conserve cette force sans explicitation interprétative excessive.
- source_word: בְּיַד
  choice: par la main de
  rationale: L’expression hébraïque indique l’agent du jugement. « Par la main de » en préserve l’image concrète tout en restant compréhensible en français.
- source_word: זָרִים
  choice: étrangers
  rationale: Dans ce contexte, le mot désigne des peuples venus de l’extérieur plutôt que de simples inconnus. « Étrangers » est direct et naturel.
- source_word: כִּי אֲנִי דִבַּרְתִּי
  choice: car c’est moi qui ai parlé
  rationale: La construction causale fonde la certitude du jugement sur la parole divine, tandis que la tournure clivée rend l’emphase portée par אֲנִי.
- source_word: נְאֻם
  choice: déclaration
  rationale: Ce terme introduit une formule prophétique solennelle d’énonciation divine. « Déclaration » conserve son autorité sans ajouter la nuance technique possible d’« oracle ».
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: אֲדֹנָי est rendu par « le Seigneur » et le nom divin יהוה est translittéré « Yahweh », ce qui distingue les deux éléments du titre hébreu.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte à la fois le titre אֲדֹנָי et le nom propre יהוה. « Le Seigneur Yahweh » maintient cette distinction et rend explicitement le nom divin, sans confondre les deux termes.
- issue: Portée de « la mort des incirconcis »
  choice: une comparaison quant à la manière et au déshonneur de la mort
  alternative: une affirmation sur le statut covenantal ultime du destinataire
  rationale: Le contexte annonce une mise à mort par des étrangers. La traduction conserve l’association aux incirconcis sans en tirer une conclusion théologique supplémentaire sur le statut spirituel final du destinataire.
translation_notes:
  register: Français moderne, international et solennel. La syntaxe reste directe et prophétique. « Par la main d’étrangers » conserve volontairement l’image hébraïque, et le tiret marque naturellement la formule finale de déclaration divine.
