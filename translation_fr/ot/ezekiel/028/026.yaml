base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/026.yaml
  text: They will dwell on it securely, and they will build houses and plant vineyards. They will dwell securely when I execute judgments on all those who treat them with contempt all around them. Then they will know that I am the LORD their God.
translation:
  language: fr
  text: Ils y habiteront en sécurité, bâtiront des maisons et planteront des vignes. Ils habiteront en sécurité quand j’exécuterai mes jugements contre tous ceux qui les méprisent, tout autour d’eux. Alors ils sauront que je suis le SEIGNEUR, leur Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשְׁבוּ עָלֶיהָ לָבֶטַח
  choice: Ils y habiteront en sécurité
  rationale: « y » reprend naturellement le pays évoqué dans le contexte; « en sécurité » exprime לָבֶטַח sans surinterpréter la nature de cette sécurité.
- source_word: הַשָּׁאטִים אֹתָם
  choice: ceux qui les méprisent
  rationale: Le participe issu de שׁאט exprime le mépris ou le dédain; « méprisent » est direct, courant et fidèle.
- source_word: בַּעֲשׂוֹתִי שְׁפָטִים בְּכֹל
  choice: quand j’exécuterai mes jugements contre tous
  rationale: Le ב infinitif marque ici la circonstance temporelle; « exécuter des jugements contre » restitue l’action judiciaire et punitive.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rendu français traditionnel du tétragramme, en capitales pour le distinguer du titre ordinaire « Seigneur ».
theological_decisions:
- issue: Rapport temporel entre l’habitation en sécurité et les jugements divins
  choice: quand j’exécuterai mes jugements
  alternative: lorsque j’aurai exécuté mes jugements
  rationale: La construction בַּעֲשׂוֹתִי ne précise pas à elle seule si la sécurité coïncide avec l’exécution des jugements ou en résulte après leur accomplissement; la traduction retenue conserve cette relative ouverture.
- issue: Identification du pays repris par le suffixe féminin עָלֶיהָ
  choice: y
  alternative: sur sa terre
  rationale: Le pronom adverbial reprend le territoire d’Israël mentionné au verset précédent sans ajouter un substantif absent du texte.
translation_notes:
  register: Français moderne, international et digne. La répétition de « habiteront en sécurité » est conservée, car elle structure le verset hébreu. La coordination initiale de la seconde proposition est allégée en français sans perte de contenu.
