source:
  edition: WLC
  text: תָּמִ֤ים אַתָּה֙ בִּ/דְרָכֶ֔י/ךָ מִ/יּ֖וֹם הִבָּֽרְאָ֑/ךְ עַד נִמְצָ֥א עַוְלָ֖תָ/ה בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/015.yaml
  text: You were blameless in your ways from the day you were created[a], until unrighteousness was found in you.
translation:
  language: fr
  text: Tu as été irréprochable dans ta conduite depuis le jour où tu as été créé[a], jusqu’au jour où la perversité a été trouvée en toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parfait dans tes voies ». Le terme hébreu peut exprimer l’intégrité, le fait d’être entier ou sans défaut ; « irréprochable » convient ici au contexte moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמִים
  choice: irréprochable
  rationale: Dans ce contexte moral, le terme exprime l’intégrité ou l’absence de faute plutôt qu’une perfection absolue.
- source_word: בִּדְרָכֶיךָ
  choice: dans ta conduite
  rationale: Littéralement « dans tes voies »; en français actuel, « dans ta conduite » rend naturellement l’idée de manière de vivre.
- source_word: מִיּוֹם הִבָּרְאָךְ
  choice: depuis le jour où tu as été créé
  rationale: Rend directement la valeur passive du niphal et le point de départ temporel marqué par מִן.
- source_word: עַד
  choice: jusqu’à ce que
  rationale: Introduit naturellement en français le moment où la situation décrite change.
- source_word: נִמְצָא
  choice: soit trouvée
  rationale: Conserve la formulation passive de l’hébreu et ne précise pas si le mal est apparu ou a été découvert.
- source_word: עַוְלָתָה
  choice: l’injustice
  rationale: Le nom désigne ce qui est injuste, mauvais ou contraire à la droiture; « injustice » reste clair et laisse au terme sa portée morale générale.
- source_word: בָּךְ
  choice: en toi
  rationale: Traduction directe qui préserve la localisation interne indiquée par le texte.
theological_decisions:
- issue: Risque de comprendre תָּמִים comme une perfection absolue dans un passage chargé d’interprétations théologiques.
  choice: irréprochable
  alternative: parfait
  rationale: « Irréprochable » exprime ici l’intégrité de la conduite sans introduire une affirmation métaphysique plus forte que ne l’exige l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. « Conduite » explicite naturellement l’idiome hébreu des « voies », tandis que la tournure passive « soit trouvée » préserve l’ambiguïté du texte source.
