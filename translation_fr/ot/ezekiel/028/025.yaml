source:
  edition: WLC
  text: כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ בְּ/קַבְּצִ֣/י אֶת בֵּ֣ית יִשְׂרָאֵ֗ל מִן הָֽ/עַמִּים֙ אֲשֶׁ֣ר נָפֹ֣צוּ בָ֔/ם וְ/נִקְדַּ֥שְׁתִּי בָ֖/ם לְ/עֵינֵ֣י הַ/גּוֹיִ֑ם וְ/יָֽשְׁבוּ֙ עַל אַדְמָתָ֔/ם אֲשֶׁ֥ר נָתַ֖תִּי לְ/עַבְדִּ֥/י לְ/יַעֲקֹֽב־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/025.yaml
  text: 'Thus says the Lord GOD: When I gather the house of Israel from the peoples among whom they were scattered[a], and I show myself holy among them in the sight of the nations, then they will dwell on their own land that I gave to my servant Jacob.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh : Quand je rassemblerai la maison d’Israël d’entre les peuples parmi lesquels elle a été dispersée, et que je manifesterai ma sainteté parmi eux[a] sous les yeux des nations, alors ils habiteront sur leur terre, celle que j’ai donnée à mon serviteur Jacob.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « je serai sanctifié en eux » ; l’expression peut aussi évoquer la manifestation de la sainteté de Dieu par eux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend les deux éléments du titre divin et conserve explicitement le nom d’alliance Yahweh, sans produire l’expression française maladroite « le Seigneur SEIGNEUR ».
- source_word: בְּקַבְּצִי
  choice: Quand je rassemblerai
  rationale: La préposition ב avec l’infinitif construit et le suffixe de première personne a ici une valeur temporelle; le futur convient au contexte prophétique français.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Conserve l’expression collective et covenantale hébraïque plutôt que de l’aplanir en « le peuple d’Israël ».
- source_word: מִן הָעַמִּים אֲשֶׁר נָפֹצוּ בָם
  choice: d’entre les peuples parmi lesquels elle a été dispersée
  rationale: Distingue עַמִּים, « peuples », du terme גּוֹיִם, « nations », et rend naturellement le nifal passif de פוץ ainsi que בָם.
- source_word: וְנִקְדַּשְׁתִּי בָם
  choice: et que je manifesterai ma sainteté au milieu d’elle
  rationale: Avec Dieu pour sujet, le nifal de קדשׁ exprime ici la manifestation publique de sa sainteté. « Au milieu d’elle » représente la valeur locative probable de בָם tout en gardant Israël comme référent collectif.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: sous les yeux des nations
  rationale: Conserve l’image visuelle et la dimension publique de l’expression hébraïque.
- source_word: וְיָשְׁבוּ עַל אַדְמָתָם
  choice: alors les Israélites habiteront sur leur terre
  rationale: Le passage du collectif singulier « maison d’Israël » au pluriel hébreu est rendu clairement par « les Israélites ». « Habiteront sur leur terre » exprime l’établissement durable sans surtraduire le possessif.
- source_word: אֲשֶׁר נָתַתִּי לְעַבְדִּי לְיַעֲקֹב
  choice: celle que j’ai donnée à mon serviteur Jacob
  rationale: Rend directement la proposition relative et préserve le titre covenantal « mon serviteur Jacob ».
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le choix maintient à la fois le titre אֲדֹנָי et le nom propre divin יהוה, conformément à une traduction transparente du composé.
- issue: Sens de וְנִקְדַּשְׁתִּי בָם
  choice: je manifesterai ma sainteté au milieu d’elle
  alternative: je serai reconnu comme saint en elle / je manifesterai ma sainteté par elle
  rationale: La formulation évite de suggérer que Dieu devient moralement saint et exprime plutôt que sa sainteté sera publiquement reconnue. Elle retient la lecture locative de בָם sans nier sa possible nuance instrumentale.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe prophétique est conservée, avec « Ainsi parle » et « maison d’Israël ». L’alternance entre le collectif singulier « elle » et « les Israélites » explicite naturellement le passage de la référence collective au verbe hébreu pluriel.
