revisions:
- from: 'Ainsi parle le Seigneur Yahweh : Quand je rassemblerai la maison d’Israël d’entre les peuples parmi lesquels elle a été dispersée, et que je manifesterai ma sainteté au milieu d’elle sous les yeux des nations, alors les Israélites habiteront sur leur terre, celle que j’ai donnée à mon serviteur Jacob.'
  to: 'Ainsi parle le Seigneur Yahweh : Quand je rassemblerai la maison d’Israël d’entre les peuples parmi lesquels elle a été dispersée, et que je manifesterai ma sainteté parmi eux[a] sous les yeux des nations, alors ils habiteront sur leur terre, celle que j’ai donnée à mon serviteur Jacob.'
  rationale: La révision remplace le singulier « au milieu d’elle » par « parmi eux » afin de mieux refléter le pluriel hébreu et de ne pas trancher indûment la nuance de בָם. La note conserve la formulation plus littérale et la possible nuance instrumentale. « Ils habiteront » maintient la continuité référentielle sans sur-explicitation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:00:08Z'
review_pass:
  verdict: revise
  source_fidelity: Le texte rend fidèlement la structure temporelle, le rassemblement d’Israël hors des peuples, la distinction entre « peuples » (עַמִּים) et « nations » (גּוֹיִם), ainsi que le don de la terre à Jacob. Toutefois, « au milieu d’elle » transforme le pluriel בָם en un singulier et restreint inutilement une expression qui demeure quelque peu ouverte entre « parmi eux » et « par eux ».
  naturalness: Le français est globalement naturel et de registre prophétique approprié. « Parmi eux » est plus fluide et plus cohérent que « au milieu d’elle », après le collectif « la maison d’Israël ».
  terminology: « Le Seigneur Yahweh », « maison d’Israël », « sainteté », « nations » et « mon serviteur Jacob » conviennent. « Les Israélites » est possible pour le pluriel final, mais « ils » conserve mieux la continuité avec « la maison d’Israël » sans introduire un terme absent du source.
  issues:
  - severity: medium
    issue: « au milieu d’elle » pour וְנִקְדַּשְׁתִּי בָם
    rationale: Le suffixe de בָם est pluriel. Le singulier féminin français dépend de « maison », mais masque à la fois la pluralité du référent collectif et l’ambiguïté locative/instrumentale de l’hébreu. « Parmi eux » est plus direct; une note préserve les possibilités formelles.
  - severity: low
    issue: « les Israélites » pour le sujet de וְיָשְׁבוּ
    rationale: Cette explicitation est compréhensible, mais « ils » reprend naturellement la maison d’Israël et évite d’ajouter une désignation qui n’est pas employée dans l’hébreu.
