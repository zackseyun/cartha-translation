  text: וְ/לֹֽא יִהְיֶ֨ה ע֜וֹד לְ/בֵ֣ית יִשְׂרָאֵ֗ל סִלּ֤וֹן מַמְאִיר֙ וְ/ק֣וֹץ מַכְאִ֔ב מִ/כֹּל֙ סְבִ֣יבֹתָ֔/ם הַ/שָּׁאטִ֖ים אוֹתָ֑/ם וְ/יָ֣דְע֔וּ כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/024.yaml
  text: And the house of Israel will no longer have a brier that causes bitterness or a thorn that causes pain from all those around them who despise them[a]. Then they will know that I am the Lord GOD.
translation:
  language: fr
  text: Il n’y aura plus, pour la maison d’Israël, ni ronce qui cause de l’amertume[a] ni épine qui fait souffrir, de la part de tous ceux qui l’entourent et la méprisent. Alors ils sauront que je suis le Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ronce irritante » ; le sens précis de l’hébreu est discuté. L’image est celle d’une plante piquante et nuisible, employée pour les voisins hostiles.
    reason: La portée de מַמְאִיר est incertaine; la note préserve une option lexicale plausible sans éliminer l’ambiguïté.
lexical_decisions:
- source_word: סִלּוֹן מַמְאִיר
  choice: ronce irritante
  rationale: Le premier terme désigne une plante piquante et nuisible; le participe exprime son effet nocif ou irritant. Cette formulation naturelle maintient la distinction avec l’épine du membre parallèle.
- source_word: קוֹץ מַכְאִב
  choice: épine douloureuse
  rationale: קוֹץ désigne couramment une épine, et מַכְאִב indique qu’elle fait souffrir. L’adjectif restitue avec concision la valeur causative dans ce contexte imagé.
- source_word: מִכֹּל סְבִיבֹתָם
  choice: parmi tous ceux qui l’entourent
  rationale: La préposition indique ici la provenance de la menace au sein des peuples environnants. « Ceux qui l’entourent » conserve la référence large sans expliciter abusivement « peuples » ou « nations ».
- source_word: הַשָּׁאטִים אוֹתָם
  choice: qui la méprisent
  rationale: Le participe exprime le mépris hostile. Le singulier français renvoie collectivement à la communauté d’Israël, alors que l’hébreu reprend Israël au pluriel.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la communauté d’Israël
  rationale: Littéralement « la maison d’Israël ». En français actuel, « communauté d’Israël » rend clairement la désignation collective sans suggérer un bâtiment ou une dynastie au lecteur ordinaire.
- source_word: וְיָדְעוּ כִּי אֲנִי
  choice: Alors ils sauront que je suis
  rationale: La conjonction fait progresser l’énoncé vers le résultat de la promesse; « alors » exprime naturellement cette conséquence.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Le titre אֲדֹנָי est rendu par « le Seigneur » et le nom divin יהוה par « Yahweh », ce qui évite le redoublement « Seigneur SEIGNEUR » et préserve le nom propre.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte associe le titre אֲדֹנָי au tétragramme יהוה. Rendre ce dernier par « Yahweh » préserve la distinction entre le titre et le nom divin sans imposer une interprétation confessionnelle.
- issue: Référent des images de la ronce et de l’épine
  choice: Les images sont rattachées grammaticalement à ceux qui entourent et méprisent Israël
  alternative: Identifier explicitement ces personnes comme des nations ennemies particulières
  rationale: Le verset décrit largement les voisins hostiles sans les identifier ici. La traduction conserve cette portée et n’ajoute aucune identification théologique ou historique.
translation_notes:
  register: Français international moderne, digne et accessible. La structure est légèrement réorganisée pour que le lien entre les voisins méprisants et les deux images végétales soit immédiatement compréhensible. Le parallélisme entre « ronce irritante » et « épine douloureuse » est conservé.
