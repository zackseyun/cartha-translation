revisions:
- from: La communauté d’Israël n’aura plus, parmi tous ceux qui l’entourent et la méprisent, ni ronce irritante[a] ni épine douloureuse. Alors ils sauront que je suis le Seigneur Yahweh.
  to: Il n’y aura plus, pour la maison d’Israël, ni ronce qui cause de l’amertume[a] ni épine qui fait souffrir, de la part de tous ceux qui l’entourent et la méprisent. Alors ils sauront que je suis le Seigneur Yahweh.
  rationale: La révision rétablit « maison d’Israël », clarifie que les ronces et épines représentent l’hostilité provenant des voisins méprisants, et rend plus explicitement les deux participes causatifs. Elle conserve le parallélisme, le pronom collectif français et le nom divin Yahweh.
