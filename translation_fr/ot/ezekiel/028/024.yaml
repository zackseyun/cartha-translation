    reason: La portée de מַמְאִיר est incertaine; la note préserve une option lexicale plausible sans éliminer l’ambiguïté.
  revision_rationale: La révision rétablit « maison d’Israël », clarifie que les ronces et épines représentent l’hostilité provenant des voisins méprisants, et rend plus explicitement les deux participes causatifs. Elle conserve le parallélisme, le pronom collectif français et le nom divin Yahweh.
