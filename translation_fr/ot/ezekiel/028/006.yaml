  text: לָ/כֵ֕ן כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה יַ֛עַן תִּתְּ/ךָ֥ אֶת לְבָבְ/ךָ֖ כְּ/לֵ֥ב אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/006.yaml
  text: 'Therefore thus says the Lord GOD: Because you have made your heart like the heart of a god,[a]'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit le Seigneur, l’Éternel : Parce que tu as rendu ton cœur semblable à celui d’un dieu[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « semblable à celui de Dieu ». Selon le contexte, le mot hébreu אֱלֹהִים peut désigner Dieu, un dieu ou des dieux.
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence de l’accusation précédente.
- source_word: כֹּה אָמַר
  choice: voici ce que dit
  rationale: Rend la formule prophétique de manière actuelle, claire et digne.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur, l’Éternel
  rationale: Préserve les deux éléments du titre divin tout en évitant la répétition maladroite « Seigneur SEIGNEUR ».
- source_word: יַעַן
  choice: Parce que
  rationale: Marque clairement la cause qui motive la déclaration et la sentence divines.
- source_word: תִּתְּךָ אֶת לְבָבְךָ
  choice: tu as rendu ton cœur
  rationale: Exprime ici le fait d’avoir placé ou constitué son cœur dans un état de prétention divine, tout en conservant l’image du cœur.
- source_word: לְבָבְךָ
  choice: ton cœur
  rationale: Conserve la métaphore hébraïque, qui englobe la pensée, la volonté et l’être intérieur.
- source_word: כְּלֵב אֱלֹהִים
  choice: semblable à celui d’un dieu
  rationale: Cette formulation française naturelle maintient la comparaison avec le cœur et rend אֱלֹהִים comme une prétention à la divinité dans le contexte de l’orgueil du prince de Tyr.
theological_decisions:
- issue: Sens de אֱלֹהִים dans כְּלֵב אֱלֹהִים
  choice: un dieu
  alternative: Dieu
  rationale: Le contexte dénonce l’auto-exaltation d’un être humain et sa prétention à la divinité. Toutefois, puisque l’hébreu peut aussi désigner Dieu, cette ambiguïté réelle est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La formule prophétique est idiomatique; l’image biblique du cœur et l’ambiguïté du terme divin sont préservées.
