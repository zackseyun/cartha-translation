lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans cette formule prophétique, le verbe introduit la réception d’une parole divine. « Me fut adressée » est naturel en français et exprime clairement le mouvement vers le prophète sans lourdeur littérale.
- source_word: דְבַר
  choice: la parole
  rationale: Dans ce contexte, דָּבָר désigne la parole ou le message prophétique venant de Dieu. « La parole » conserve la formule biblique et sa portée théologique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte hébreu porte le nom divin YHWH. « Yahweh » le rend comme nom propre plutôt que de lui substituer un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » rend naturellement אֵלַי et désigne Ézéchiel comme destinataire de la parole.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'L’infinitif introduit le discours divin qui suit. « En ces termes : » assure en français une transition fluide vers la citation du verset suivant.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte source emploie directement le tétragramme. Le rendre par « Yahweh » préserve le nom personnel tout en évitant de le remplacer silencieusement par un titre.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve la formule prophétique traditionnelle sans calquer maladroitement la syntaxe hébraïque. Les deux-points indiquent que la parole annoncée commence au verset suivant.
