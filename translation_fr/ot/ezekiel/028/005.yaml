  text: בְּ/רֹ֧ב חָכְמָתְ/ךָ֛ בִּ/רְכֻלָּתְ/ךָ֖ הִרְבִּ֣יתָ חֵילֶ֑/ךָ וַ/יִּגְבַּ֥הּ לְבָבְ/ךָ֖ בְּ/חֵילֶֽ/ךָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/005.yaml
  text: By your great wisdom in your trade you increased your wealth[c][b][a], and your heart became proud because of your wealth.
translation:
  language: fr
  text: Par ta grande sagesse dans ton commerce[a], tu as accru tes richesses[c], et ton cœur s’est enorgueilli[b] à cause de tes richesses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par ton négoce » ou « dans tes échanges commerciaux » ; le terme hébreu désigne l’activité commerciale.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ton cœur s’est élevé », expression qui désigne l’orgueil.'
    reason: lexical_alternative
  - marker: c
    text: Le mot hébreu traduit par « richesses » peut aussi signifier « ressources » et, selon le contexte, « force » ou « puissance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב חָכְמָתְךָ
  choice: Par ta grande sagesse
  rationale: Le ב instrumental avec רֹב exprime ici le moyen; « grande sagesse » rend naturellement l’abondance de sagesse, laquelle peut inclure l’habileté pratique dans ce contexte commercial.
- source_word: בִּרְכֻלָּתְךָ
  choice: dans ton commerce
  rationale: רְכֻלָּה désigne ici l’activité commerciale de Tyr. « Commerce » est actuel, clair et plus précis que « marchandises », qui évoquerait surtout les biens échangés.
- source_word: הִרְבִּיתָ
  choice: tu as accru
  rationale: Le hiphil de רבה signifie faire croître ou multiplier. « Accru » convient naturellement avec « richesses ».
- source_word: חֵילֶךָ
  choice: tes richesses
  rationale: חַיִל peut signifier force, puissance, ressources ou richesse. Le contexte mercantile favorise « richesses » dans les deux occurrences.
- source_word: וַיִּגְבַּהּ לְבָבְךָ
  choice: ton cœur s’est enorgueilli
  rationale: Cette formulation française conserve le cœur comme sujet tout en communiquant clairement l’idiome hébreu du cœur qui s’élève, c’est-à-dire l’orgueil.
- source_word: בְּחֵילֶךָ
  choice: à cause de tes richesses
  rationale: Le ב indique vraisemblablement ici la cause ou l’occasion de l’orgueil. « À cause de » explicite naturellement ce rapport.
theological_decisions:
- issue: 'Sens plus large possible de חַיִל : richesse ou puissance'
  choice: richesses
  alternative: puissance, ressources ou force
  rationale: L’oracle vise le dirigeant de Tyr dans un contexte explicitement commercial. « Richesses » respecte ce cadre sans effacer les autres valeurs possibles, signalées en note.
- issue: Rendu de l’image hébraïque du cœur élevé
  choice: ton cœur s’est enorgueilli
  alternative: ton cœur s’est élevé
  rationale: Le texte principal transmet clairement le sens idiomatique tout en maintenant le cœur comme sujet; la note préserve l’image littérale.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement suit l’adresse directe au dirigeant de Tyr. « Commerce », « accru » et « s’est enorgueilli » gardent un registre soutenu sans archaïsme.
