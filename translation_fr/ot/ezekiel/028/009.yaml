  text: הֶ/אָמֹ֤ר תֹּאמַר֙ אֱלֹהִ֣ים אָ֔נִי לִ/פְנֵ֖י הֹֽרְגֶ֑/ךָ וְ/אַתָּ֥ה אָדָ֛ם וְ/לֹא אֵ֖ל בְּ/יַ֥ד מְחַלְלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/009.yaml
  text: Will you still say[a], ‘I am a god,’ before the one who kills you? But you are a man, and not a god[c][b], in the hand of those who wound you.
translation:
  language: fr
  text: 'Diras-tu encore[a] : « Je suis un dieu », devant celui qui te tue ? Pourtant, tu es un homme, et non un dieu[b], entre les mains de ceux qui te profanent[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Le diras-tu vraiment ? » La construction hébraïque renforce le verbe.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « tu es homme, et non dieu » : le contraste porte sur la condition humaine opposée à la divinité.'
    reason: lexical_alternative
  - marker: c
    text: Ou « qui te déshonorent » ; le terme hébreu peut évoquer la profanation ou l’humiliation. Selon une autre compréhension, il peut être rendu par « qui te blessent » ou « qui te transpercent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאָמֹר תֹּאמַר
  choice: Diras-tu encore
  rationale: La construction infinitif absolu + verbe conjugué renforce la question. « Diras-tu encore » exprime naturellement en français la vigueur de cette interpellation moqueuse dans le contexte.
- source_word: אֱלֹהִים
  choice: un dieu
  rationale: Le chef de Tyr revendique ici la divinité. L’indéfini rend cette prétention sans l’identifier explicitement au Dieu d’Israël.
- source_word: לִפְנֵי
  choice: devant
  rationale: Ce terme conserve simplement le rapport de présence et de confrontation exprimé par l’hébreu.
- source_word: הֹרְגֶךָ
  choice: celui qui te tue
  rationale: Cette tournure restitue la valeur active du participe et le caractère imminent de la mise à mort.
- source_word: אָדָם
  choice: un homme
  rationale: Dans ce contexte, le mot désigne le dirigeant humain et forme un contraste direct avec sa prétention à être un dieu.
- source_word: אֵל
  choice: un dieu
  rationale: Le nom nie la prétendue divinité du chef de Tyr. La formulation parallèle à « Je suis un dieu » préserve la force rhétorique du verset.
- source_word: בְּיַד
  choice: entre les mains de
  rationale: Cette expression française naturelle conserve l’image hébraïque de la main comme symbole de pouvoir et de domination.
- source_word: מְחַלְלֶיךָ
  choice: ceux qui te profanent
  rationale: Le participe peut exprimer l’action de profaner, déshonorer ou traiter comme chose commune. Ce choix préserve l’ironie de l’humiliation infligée à celui qui se disait divin, tout en signalant en note les lectures à portée physique.
theological_decisions:
- issue: Formulation de la prétention du chef de Tyr à la divinité
  choice: « Je suis un dieu » … « tu es un homme, et non un dieu »
  alternative: « Je suis Dieu » … « tu es un homme, et non Dieu »
  rationale: Le contexte dénonce l’auto-divinisation d’un dirigeant humain. L’article indéfini évite de préciser au-delà de l’hébreu qu’il prétendrait être personnellement le Dieu d’Israël.
- issue: Portée de מְחַלְלֶיךָ
  choice: ceux qui te profanent
  alternative: ceux qui te blessent / ceux qui te transpercent
  rationale: « Profanent » maintient le lien saisissant entre la prétention à la divinité et l’humiliation du condamné. La polysémie et les autres analyses possibles sont conservées dans la note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La question garde son ton de défi, et l’expression « entre les mains de » conserve une image biblique immédiatement compréhensible.
