  text: בֶּן אָדָ֕ם שָׂ֥א קִינָ֖ה עַל מֶ֣לֶךְ צ֑וֹר וְ/אָמַ֣רְתָּ לּ֗/וֹ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה אַתָּה֙ חוֹתֵ֣ם תָּכְנִ֔ית מָלֵ֥א חָכְמָ֖ה וּ/כְלִ֥יל יֹֽפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/012.yaml
  text: 'Son of man[a], raise a lament over the king of Tyre, and say to him, ‘Thus says the Lord GOD: You were the seal of perfection[b], full of wisdom and perfect in beauty.’'
translation:
  language: fr
  text: 'Fils d’homme, prononce une complainte sur le roi de Tyr et dis-lui : « Ainsi parle le Seigneur Yahweh : Tu étais[a] le sceau de la perfection[b], plein de sagesse et d’une beauté parfaite. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Tu es ». L’hébreu n’exprime pas de verbe copule ; le temps se déduit du contexte.'
    reason: alternative_reading
  - marker: b
    text: 'Expression hébraïque difficile : littéralement, « le sceau d’un modèle / d’une forme ». Elle peut aussi être comprise comme « le cachet de la perfection », « le sceau d’une forme parfaite » ou « celui qui scelle le modèle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Formule d’adresse caractéristique adressée à Ézéchiel. Cette traduction conserve l’image hébraïque et sa résonance littéraire tout en restant familière au lectorat biblique francophone.
- source_word: שָׂא קִינָה
  choice: prononce une complainte
  rationale: Dans cette tournure, le verbe signifie faire entendre ou entonner une lamentation. « Prononce une complainte » est clair, digne et adapté au registre prophétique.
- source_word: עַל מֶלֶךְ צֹר
  choice: sur le roi de Tyr
  rationale: La préposition désigne ici celui qui fait l’objet de la complainte; « sur » préserve simplement cette relation.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Voici ce que dit le Seigneur Yahweh
  rationale: « Voici ce que dit » rend naturellement la formule prophétique, tandis que « Seigneur Yahweh » distingue le titre אֲדֹנָי du nom divin יְהוָה.
- source_word: אַתָּה
  choice: Tu étais
  rationale: L’hébreu ne comporte pas ici de copule exprimée. Le passé convient au contexte de complainte et à l’évocation de la grandeur perdue du roi, sans exclure l’autre possibilité dans la note.
- source_word: חוֹתֵם תָּכְנִית
  choice: le sceau de la perfection
  rationale: Cette expression difficile peut évoquer un sceau ou cachet qui incarne l’achèvement parfait. La traduction principale reste proche de la structure hébraïque, tandis que la note signale d’autres analyses possibles.
- source_word: מָלֵא חָכְמָה
  choice: plein de sagesse
  rationale: Traduction directe et idiomatique de l’expression hébraïque.
- source_word: וּכְלִיל יֹפִי
  choice: et d’une beauté parfaite
  rationale: כְלִיל exprime la totalité ou l’accomplissement. Cette formulation transmet le sens en français naturel et conserve le parallélisme élogieux.
theological_decisions:
- issue: Traduction du nom divin יְהוָה après אֲדֹנָי
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte associe le titre אֲדֹנָי au nom divin יְהוָה. « Le Seigneur Yahweh » rend distinctement les deux éléments et préserve le nom personnel présent dans l’hébreu.
- issue: Temps de la proposition nominale אַתָּה חוֹתֵם תָּכְנִית
  choice: Tu étais
  alternative: Tu es
  rationale: Aucun verbe copule n’est exprimé en hébreu. Le contexte de complainte et la description d’une splendeur désormais perdue favorisent le passé, mais le présent demeure grammaticalement possible et est donc signalé en note.
translation_notes:
  register: Français international moderne, au registre poétique et prophétique soutenu sans archaïsme. « Complainte » conserve la tonalité funèbre de קִינָה; la syntaxe finale a été légèrement naturalisée en « d’une beauté parfaite ».
