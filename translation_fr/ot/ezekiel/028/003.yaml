  text: הִנֵּ֥ה חָכָ֛ם אַתָּ֖ה מ/דנאל כָּל סָת֖וּם לֹ֥א עֲמָמֽוּ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/003.yaml
  text: Look[a], you are wiser than Danel; no hidden thing is obscure to you.
translation:
  language: fr
  text: Te voilà plus sage que Danel[a] ; rien de caché n’est obscur pour toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Danel » ; traditionnellement identifié à Daniel. L’orthographe employée ici ne comporte pas le yod présent dans la forme hébraïque plus familière « Daniel » ; le texte conserve donc « Danel ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Te voilà
  rationale: Introduit avec emphase l’affirmation adressée directement au dirigeant de Tyr. « Te voilà » conserve la force déictique de l’hébreu dans un français actuel et soutenu.
- source_word: חָכָם ... מ/דנאל
  choice: plus sage que Danel
  rationale: L’adjectif signifie « sage », tandis que la préposition מ־ devant le nom exprime ici la comparaison ; le comparatif explicite est donc naturel en français.
- source_word: דנאל
  choice: Danel
  rationale: Le texte consonantique porte דנאל, sans le yod de la forme hébraïque habituelle de « Daniel ». La translittération « Danel » préserve cette donnée textuelle sans trancher l’identité du personnage.
- source_word: כָּל סָתוּם
  choice: rien de caché
  rationale: 'La tournure française négative exprime naturellement le sens distributif : aucune chose cachée ou fermée à la connaissance.'
- source_word: לֹא עֲמָמוּךָ
  choice: n’est obscur pour toi
  rationale: Le verbe évoque l’obscurité ou le caractère indistinct plutôt que la seule dissimulation. Cette formulation maintient la nuance entre ce qui est caché et ce qui demeure obscur.
theological_decisions:
- issue: Identité de Danel
  choice: Conserver « Danel » dans le texte
  alternative: « Daniel »
  rationale: L’orthographe hébraïque du verset permet de distinguer ce nom de la forme habituelle « Daniel » ; traduire directement par « Daniel » résoudrait indûment une identification débattue.
translation_notes:
  register: Français international moderne, direct et digne. « Te voilà » rend l’emphase de הִנֵּה sans archaïsme ; le tutoiement suit l’adresse singulière au dirigeant de Tyr. La seconde proposition conserve la tension lexicale entre « caché » et « obscur ».
