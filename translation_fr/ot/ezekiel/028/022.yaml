source:
  edition: WLC
  text: וְ/אָמַרְתָּ֗ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֤י עָלַ֨יִ/ךְ֙ צִיד֔וֹן וְ/נִכְבַּדְתִּ֖י בְּ/תוֹכֵ֑/ךְ וְֽ/יָדְע֞וּ כִּֽי אֲנִ֣י יְהוָ֗ה בַּ/עֲשׂ֥וֹתִ/י בָ֛/הּ שְׁפָטִ֖ים וְ/נִקְדַּ֥שְׁתִּי בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/022.yaml
  text: 'and say[a], ‘Thus says the Lord GOD: Behold, I am against you, Sidon, and I will be glorified in your midst[b]. And they will know that I am Yahweh when I execute judgments in her and show myself holy in her.’'
translation:
  language: fr
  text: 'Tu diras : « Ainsi parle le Seigneur Yahweh : Me voici contre toi, Sidon ! Je serai glorifié au milieu de toi[a]. Alors on saura que je suis Yahweh, quand j’exercerai mes jugements en elle et que je manifesterai en elle ma sainteté[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je manifesterai ma gloire au milieu de toi. » Le verbe hébreu peut souligner soit que Dieu reçoit la gloire, soit qu’il la fait éclater par son jugement.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, on pourrait aussi traduire : « je serai sanctifié en elle » ou « je serai reconnu comme saint en elle ». L’expression indique que la sainteté de Yahweh est publiquement manifestée par ses actes de jugement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Cette formulation distingue le titre אֲדֹנָי du nom divin יהוה, tout en restant naturelle en français et en évitant « le Seigneur SEIGNEUR ».
- source_word: הִנְנִי עָלַיִךְ
  choice: Me voici contre toi
  rationale: הִנְנִי donne à la déclaration divine une force solennelle, tandis que עַל exprime ici l’hostilité.
- source_word: צִידוֹן
  choice: Sidon
  rationale: Forme française usuelle du nom de la ville.
- source_word: וְנִכְבַּדְתִּי
  choice: Je serai glorifié
  rationale: Le nifal de כבד exprime ici la manifestation ou la reconnaissance de la gloire de Dieu à travers son jugement. La tournure passive préserve la forme et la densité théologique de l’hébreu.
- source_word: בְּתוֹכֵךְ
  choice: au milieu de toi
  rationale: La ville est directement interpellée au féminin singulier ; cette traduction conserve cette personnification.
- source_word: וְיָדְעוּ
  choice: Alors on saura
  rationale: Le sujet pluriel non exprimé a une valeur générale. « On saura » est idiomatique en français moderne et conserve la formule de reconnaissance fréquente chez Ézéchiel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin comme un nom propre plutôt que de lui substituer un titre.
- source_word: בַּעֲשׂוֹתִי בָהּ שְׁפָטִים
  choice: quand j’exercerai mes jugements en elle
  rationale: La préposition ב introduit une valeur temporelle devant l’infinitif, et בָהּ signifie littéralement « en elle », la ville étant personnifiée.
- source_word: וְנִקְדַּשְׁתִּי בָהּ
  choice: que je manifesterai en elle ma sainteté
  rationale: Dans ce contexte, le nifal de קדש indique que Dieu fait publiquement reconnaître sa sainteté par ses actes. Cette formulation est claire sans réduire le sens à une simple réputation humaine.
theological_decisions:
- issue: Formules de glorification et de sanctification divines
  choice: Je serai glorifié… je manifesterai… ma sainteté
  alternative: Je manifesterai ma gloire… je serai reconnu comme saint
  rationale: Le jugement contre Sidon révèle à la fois la gloire et la sainteté de Dieu. La traduction maintient ces deux dimensions sans les confondre ni résoudre artificiellement la différence de forme entre les deux verbes hébreux.
- issue: Changement de personne dans la désignation de Sidon
  choice: toi… en elle
  alternative: toi… en toi
  rationale: L’hébreu passe de l’adresse directe à Sidon au féminin singulier à une référence à la ville à la troisième personne. Le texte français conserve ce changement, potentiellement significatif, au lieu de l’harmoniser.
translation_notes:
  register: Français international moderne, solennel et accessible. Le discours prophétique conserve sa vigueur grâce à « Me voici contre toi » et à l’exclamation après « Sidon ». La personnification féminine de la ville et le passage de la deuxième à la troisième personne sont maintenus.
