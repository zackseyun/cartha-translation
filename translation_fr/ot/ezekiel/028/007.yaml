source:
  edition: WLC
  text: לָ/כֵ֗ן הִנְ/נִ֨י מֵבִ֤יא עָלֶ֨י/ךָ֙ זָרִ֔ים עָרִיצֵ֖י גּוֹיִ֑ם וְ/הֵרִ֤יקוּ חַרְבוֹתָ/ם֙ עַל יְפִ֣י חָכְמָתֶ֔/ךָ וְ/חִלְּל֖וּ יִפְעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/007.yaml
  text: Therefore[a], behold, I am bringing strangers against you, the most ruthless of the nations; they will draw their swords against the beauty of your wisdom[c][b], and they will defile your splendor.
translation:
  language: fr
  text: C’est pourquoi, voici que je fais venir contre toi des étrangers[a], les plus impitoyables des nations. Ils tireront leurs épées[b] contre la beauté de ta sagesse et profaneront ton éclat[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des gens venus d’ailleurs ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « dégaineront leurs épées ». Littéralement : « videront leurs épées ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « ta splendeur » ou « ton rayonnement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Rend clairement la conséquence introduite par la conjonction, dans un registre prophétique naturel.
- source_word: הִנְנִי מֵבִיא עָלֶיךָ
  choice: 'me voici : je fais venir contre toi'
  rationale: « Me voici » conserve la formule solennelle d’annonce divine, tandis que le présent rend la force vive et imminente de la construction avec participe.
- source_word: זָרִים
  choice: des étrangers
  rationale: Le terme désigne des personnes étrangères ou extérieures; « étrangers » reste proche de l’hébreu sans préciser davantage leur statut.
- source_word: עָרִיצֵי גּוֹיִם
  choice: les plus impitoyables des nations
  rationale: עָרִיץ évoque des êtres violents, terribles et sans pitié. La formulation française exprime naturellement la valeur intensive du syntagme.
- source_word: וְהֵרִיקוּ חַרְבוֹתָם
  choice: Ils tireront leurs épées
  rationale: Le verbe signifie littéralement « vider », mais, appliqué aux épées, il décrit idiomatiquement l’action de les tirer du fourreau.
- source_word: עַל יְפִי חָכְמָתֶךָ
  choice: contre la beauté de ta sagesse
  rationale: 'Conserve la construction poétique et son ironie : la sagesse dont la beauté faisait la gloire du destinataire devient la cible de l’attaque.'
- source_word: וְחִלְּלוּ
  choice: profaneront
  rationale: Le piel de חלל signifie profaner, déshonorer ou souiller. « Profaner » maintient la force du verbe et l’idée de faire perdre son caractère glorieux, sans supposer ici un objet cultuel.
- source_word: יִפְעָתֶךָ
  choice: ton éclat
  rationale: Le nom évoque la splendeur visible, la brillance ou le rayonnement; « éclat » convient au contexte royal et poétique.
theological_decisions:
- issue: Référent et portée de l’oracle contre le dirigeant de Tyr
  choice: Rendre le verset comme l’annonce historique et prophétique d’un jugement contre le destinataire, par l’intervention de peuples étrangers.
  alternative: Inscrire dans le texte une identification typologique avec la chute d’un être spirituel.
  rationale: Le verset mentionne directement des étrangers, des épées, la sagesse et l’éclat du destinataire. Il ne faut pas imposer à sa formulation une identification théologique ultérieure et discutée.
translation_notes:
  register: Français international moderne, digne et prophétique. Le tutoiement correspond à l’adresse directe au dirigeant de Tyr. La ponctuation après « me voici » évite une tournure artificielle tout en préservant la solennité de la formule hébraïque.
