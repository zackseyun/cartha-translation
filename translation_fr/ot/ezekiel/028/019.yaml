  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : la réaction horrifiée des peuples, le destinataire devenu source d’effroi, puis sa disparition définitive. « À cause de toi » est défendable pour עָלֶיךָ, bien que « devant toi » ou « à ton sujet » soit également possible. La dernière proposition doit cependant exprimer plus nettement l’existence niée par וְאֵינְךָ.'
  naturalness: « Tous ceux qui te connaissent parmi les peuples sont consternés à cause de toi » et « un objet d’épouvante » sont naturels dans un registre prophétique moderne. « Tu ne seras plus jamais » reste elliptique en français et peut laisser entendre qu’il manque un attribut ; « tu n’existeras plus, à jamais » est plus explicite et idiomatique dans ce contexte.
  terminology: « Peuples », « consternés » et « objet d’épouvante » conviennent. La note ne doit pas présenter « tu es devenu » comme une traduction littérale du parfait הָיִיתָ ; elle doit signaler le pluriel hébreu et proposer les alternatives sans surlittéraliser une tournure française peu naturelle.
