  text: All who know you among the peoples are appalled at you[a]; you have become a horror[b], and you will be no more forever.
translation:
  language: fr
  text: Tous ceux qui te connaissent parmi les peuples sont consternés à cause de toi ; tu es devenu un objet d’épouvante[a], et tu n’existeras plus, à jamais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le terme hébreu est au pluriel : « terreurs ». Autres traductions possibles : « une terreur » ou « une cause d’épouvante ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יוֹדְעֶיךָ
  choice: Tous ceux qui te connaissent
  rationale: Le participe qal avec suffixe désigne l’ensemble de ceux qui connaissent le destinataire ; le présent français conserve cette caractérisation générale sans imposer une référence passée.
- source_word: בָּעַמִּים
  choice: parmi les peuples
  rationale: Cette formulation rend directement le pluriel de עַם et la préposition ב, tout en restant naturelle en français.
- source_word: שָׁמְמוּ עָלֶיךָ
  choice: sont consternés à cause de toi
  rationale: Dans ce contexte de jugement, שמם exprime une réaction de stupeur horrifiée. « À cause de toi » indique que le sort du destinataire provoque cette réaction, sans suggérer nécessairement la compassion.
- source_word: בַּלָּהוֹת הָיִיתָ
  choice: tu es devenu un objet d’épouvante
  rationale: Le pluriel abstrait בלהות peut désigner un état ou un objet suscitant l’effroi. Cette expression française rend clairement la valeur prédicative et résultative de la proposition.
- source_word: וְאֵינְךָ עַד עוֹלָם
  choice: et tu ne seras plus jamais
  rationale: L’expression existentielle négative, renforcée par עַד עוֹלָם, annonce ici une disparition irréversible. Le futur convient au mouvement de l’oracle, tandis que « jamais » évite la tournure peu naturelle « ne seras plus pour toujours ».
theological_decisions:
- issue: Portée de la formule finale de disparition dans l’oracle de jugement
  choice: tu ne seras plus jamais
  alternative: et tu n’es plus, pour toujours
  rationale: La traduction conserve la force rhétorique d’une fin irréversible appliquée au destinataire de l’oracle, sans en tirer une affirmation doctrinale générale sur l’existence après la mort.
translation_notes:
  register: Français international moderne, digne et accessible. « Consternés » exprime la stupeur horrifiée sans lourdeur archaïque ; « objet d’épouvante » conserve l’intensité du jugement. Le marqueur [a] figure dans le texte.
