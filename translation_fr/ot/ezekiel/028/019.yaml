    rationale: 'וְאֵינְךָ est une négation existentielle : le texte affirme que le destinataire ne sera plus. « Tu n’existeras plus, à jamais » rend explicitement cette valeur et la finalité de עַד עוֹלָם, sans dépasser la portée de l’oracle.'
  - severity: low
    issue: La note qualifie abusivement « tu es devenu des épouvantes » de littéral.
    rationale: Le pluriel בַּלָּהוֹת mérite d’être signalé, mais הָיִיתָ signifie formellement « tu as été/fus » ; « tu es devenu » est une interprétation contextuelle légitime, non une formulation littérale stricte.
