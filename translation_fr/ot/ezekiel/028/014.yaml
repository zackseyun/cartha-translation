source:
  edition: WLC
  text: אַ֨תְּ כְּר֔וּב מִמְשַׁ֖ח הַ/סּוֹכֵ֑ךְ וּ/נְתַתִּ֗י/ךָ בְּ/הַ֨ר קֹ֤דֶשׁ אֱלֹהִים֙ הָיִ֔יתָ בְּ/ת֥וֹךְ אַבְנֵי אֵ֖שׁ הִתְהַלָּֽכְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/014.yaml
  text: You were an anointed guardian cherub[a], and I placed you on the holy mountain of God[b]; you walked in the midst of stones of fire.
translation:
  language: fr
  text: Tu[b] étais un chérubin oint qui protège[a], et je t’ai placé sur la montagne sainte de Dieu ; tu marchais au milieu des pierres de feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un chérubin oint qui couvre ». Le terme rendu par « oint » est rare ; il est aussi compris par certaines traductions comme « un chérubin protecteur aux ailes déployées ».
    reason: lexical_alternative
  - marker: b
    text: Le pronom hébreu traduit par « tu » est de forme féminine, tandis que les verbes et les suffixes qui l’entourent sont masculins ; il s’agit néanmoins du même « tu » singulier.
    reason: textual_variant
lexical_decisions:
- source_word: כְּרוּב
  choice: chérubin
  rationale: Le singulier désigne la créature céleste associée à la garde du sanctuaire et du trône divin. « Chérubin » conserve cette image précise sans la réduire au terme générique « ange ».
- source_word: מִמְשַׁח
  choice: oint
  rationale: Ce nom lié à l’onction qualifie ici le chérubin. « Oint » garde la notion de consécration tout en restant concis et solennel.
- source_word: הַסּוֹכֵךְ
  choice: protecteur
  rationale: Le participe de סכך évoque l’action de couvrir, d’abriter ou d’étendre une protection. « Protecteur » exprime naturellement la fonction dans ce contexte, tandis que le sens plus littéral est signalé en note.
- source_word: וּנְתַתִּיךָ
  choice: et je t’ai placé
  rationale: נתן peut signifier donner, mettre ou placer. La présence du complément de lieu rend « placer » particulièrement naturel.
- source_word: בְּהַר קֹדֶשׁ אֱלֹהִים
  choice: sur la montagne sainte de Dieu
  rationale: Cette formulation française naturelle préserve le lieu sacré et élevé sans préciser davantage la nature de l’image.
- source_word: בְּתוֹךְ אַבְנֵי אֵשׁ
  choice: au milieu des pierres de feu
  rationale: La traduction littérale maintient l’image poétique, frappante et énigmatique, plutôt que de la lisser en « pierres ardentes ».
- source_word: הִתְהַלָּכְתָּ
  choice: tu marchais
  rationale: L’imparfait convient à la scène descriptive. Le hitpael peut évoquer des déplacements répétés, mais « marchais » n’impose pas une précision absente du contexte.
- source_word: אַתְּ
  choice: Tu
  rationale: Le pronom écrit est féminin singulier, alors que les verbes et suffixes environnants sont masculins singuliers. Le français emploie simplement « tu » et signale l’irrégularité grammaticale en note.
theological_decisions:
- issue: Nature du destinataire dans la complainte sur le roi de Tyr
  choice: Conserver sans l’expliquer l’image exaltée du chérubin sur la montagne sainte.
  alternative: Comprendre l’image uniquement comme une métaphore royale, comme la description d’un être surnaturel, ou comme une référence double ou typologique.
  rationale: L’hébreu emploie un langage sacré et élevé sans trancher explicitement entre ces lectures. La traduction préserve donc la tension théologique du passage.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire traditionnel « chérubin » et « oint » est conservé en raison de sa précision, tandis que la syntaxe reste accessible. L’image énigmatique des « pierres de feu » demeure intacte.
