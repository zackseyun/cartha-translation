lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans la formule prophétique ויהי דבר־יהוה, le verbe existentiel exprime idiomatiquement la réception d’une communication divine. « La parole… me fut adressée » est une tournure française naturelle et digne.
- source_word: דְבַר
  choice: la parole
  rationale: Dans cette formule prophétique, דָּבָר désigne une communication divine. « La parole » en conserve la portée formulaire et théologique sans expliciter davantage par « message ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de préserver le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément de « fut adressée » rend naturellement en français le destinataire marqué par אֵלַי, « à moi ».
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif לֵאמֹר introduit le contenu du discours. « En ces termes » remplit naturellement cette fonction en français et prépare la citation qui suit.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin. La translittération « Yahweh » préserve ce nom, tandis que « le SEIGNEUR » représente la substitution traditionnelle par un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La formule prophétique est rendue idiomatiquement sans lourdeur littérale; les deux-points signalent que le contenu de la parole suit au verset suivant.
