  text: לַ/שַּׁ֖חַת יֽוֹרִד֑וּ/ךָ וָ/מַ֛תָּה מְמוֹתֵ֥י חָלָ֖ל בְּ/לֵ֥ב יַמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/008.yaml
  text: They will bring you down to the pit[c][b][a], and you will die the death of one slain in the heart of the seas.
translation:
  language: fr
  text: Ils te feront descendre dans la fosse[a], et tu mourras de la mort d’un homme tué[b], au cœur des mers[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la tombe » ou « vers la destruction » ; littéralement « dans la fosse ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « des morts d’un homme tué », une expression idiomatique qui évoque une mort violente.
    reason: lexical_alternative
  - marker: c
    text: Ou « au milieu des mers ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לַשַּׁחַת
  choice: dans la fosse
  rationale: שַׁחַת peut désigner une fosse, la tombe ou la destruction. Avec le verbe « faire descendre », « la fosse » conserve l’image concrète sans imposer une conception précise de l’au-delà.
- source_word: יוֹרִדוּךָ
  choice: Ils te feront descendre
  rationale: 'Le hifil de ירד avec suffixe de deuxième personne masculine singulière exprime la causation : ils te feront descendre. Cette formulation reste proche de l’hébreu et naturelle en français.'
- source_word: וָמַתָּה
  choice: et tu mourras
  rationale: Le futur français convient à la portée prédictive de l’énoncé prophétique.
- source_word: מְמוֹתֵי חָלָל
  choice: de la mort des hommes tués
  rationale: L’hébreu emploie littéralement le pluriel « des morts », dans une tournure qui évoque une mort violente. Le singulier « de la mort » donne une phrase française intelligible tout en conservant l’image des hommes tués.
- source_word: חָלָל
  choice: des hommes tués
  rationale: חָלָל désigne couramment une personne tuée ou mortellement blessée. Le collectif français au pluriel correspond ici à la construction hébraïque sans préciser indûment le mode exact de la mort.
- source_word: בְּלֵב יַמִּים
  choice: au cœur des mers
  rationale: לֵב signifie littéralement « cœur » et sert ici d’expression spatiale pour le milieu. « Au cœur des mers » préserve la métaphore vive et le cadre maritime de Tyr.
theological_decisions:
- issue: Faut-il rendre שַׁחַת par un terme théologiquement précis désignant le séjour des morts ?
  choice: dans la fosse
  alternative: dans la tombe ; dans l’abîme ; vers la destruction
  rationale: Le contexte annonce le jugement et la mort, mais le mot hébreu ne détermine pas à lui seul une doctrine précise de l’au-delà. « La fosse » conserve l’image et l’ambiguïté lexicales.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve la descente dans la fosse et la métaphore « au cœur des mers », tout en explicitant en note l’idiome hébreu inhabituel relatif à la mort violente.
