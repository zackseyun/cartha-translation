revisions:
- from: J’enverrai contre elle la peste et le sang dans ses rues[a] ; les victimes tomberont au milieu d’elle, frappées par l’épée qui l’assaillira de tous côtés. Alors ils sauront que je suis Yahweh.
  to: J’enverrai contre elle la peste et le sang dans ses rues[a] ; des morts tomberont en son sein, frappés par l’épée de tous côtés contre elle. Alors ils sauront que je suis Yahweh.
  rationale: La révision supprime la relative interprétative ajoutée à « l’épée », tout en préservant l’instrument de mort et l’encerclement hostile indiqués par le texte hébreu. Elle rend également חָלָל par « des morts », plus spécifique que « les victimes », et adopte « en son sein », plus idiomatique pour la ville personnifiée. La note conserve utilement l’alternative interprétative pour « sang ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:00:05Z'
review_pass:
  verdict: revise
  source_fidelity: La phrase « frappées par l’épée qui l’assaillira de tous côtés » transforme l’épée en sujet explicite d’un verbe ajouté et rattache « de tous côtés » à cette relative. L’hébreu, plus compact, énonce les tués tombant au sein de la ville « par l’épée », celle-ci étant contre elle tout autour. Une formulation française moins interprétative peut conserver ces rapports sans introduire une action autonome de l’épée.
  naturalness: Le texte est généralement fluide et adapté à un registre prophétique moderne. « Au milieu d’elle » est toutefois moins naturel en français que « en son sein » pour une ville personnifiée. « Les victimes » est recevable, mais plus large que חָלָל dans ce contexte guerrier.
  terminology: « La peste », « le sang », « Yahweh » et la note sur « l’effusion de sang » sont appropriés. « Des morts » rend de façon plus précise le résultat exprimé par חָלָל que « les victimes », sans imposer une interprétation confessionnelle.
  issues:
  - severity: medium
    issue: Relative ajoutée attribuant l’assaut à l’épée
    rationale: « qui l’assaillira » n’est pas exprimé dans le texte source et réorganise la syntaxe en faisant de l’épée le sujet d’une action future. Le sens hostile et encerclant doit être maintenu, mais sans cette explicitation interprétative.
  - severity: low
    issue: « Les victimes » est plus général que חָלָל
    rationale: Dans ce contexte, חָלָל désigne des personnes tuées, non simplement des personnes affectées ou blessées. « Des morts » est plus précis en français courant.
  revised_text: J’enverrai contre elle la peste et le sang dans ses rues[a] ; des morts tomberont en son sein, frappés par l’épée de tous côtés contre elle. Alors ils sauront que je suis Yahweh.
