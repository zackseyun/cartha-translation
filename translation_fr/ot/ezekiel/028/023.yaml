  text: וְ/שִׁלַּחְתִּי בָ֞/הּ דֶּ֤בֶר וָ/דָם֙ בְּ/ח֣וּצוֹתֶ֔י/הָ וְ/נִפְלַ֤ל חָלָל֙ בְּ/תוֹכָ֔/הּ בְּ/חֶ֥רֶב עָלֶ֖י/הָ מִ/סָּבִ֑יב וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/023.yaml
  text: And I will send pestilence into her[a], and blood into her streets; the slain will fall in her midst by the sword all around her. Then they will know that I am Yahweh.
translation:
  language: fr
  text: J’enverrai contre elle la peste et le sang dans ses rues[a] ; des morts tomberont en son sein, frappés par l’épée de tous côtés contre elle. Alors ils sauront que je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’effusion de sang dans ses rues ». L’hébreu dit littéralement « le sang » et évoque probablement les violences meurtrières commises dans la ville.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: J’enverrai
  rationale: Le parfait qal précédé de la conjonction exprime ici, dans cette proclamation prophétique, une action future certaine de Dieu. « J’enverrai » est direct et naturel.
- source_word: דֶּבֶר
  choice: la peste
  rationale: Dans les annonces prophétiques de jugement, le nom désigne couramment une épidémie dévastatrice. « La peste » conserve cette portée traditionnelle tout en restant compréhensible.
- source_word: וָדָם
  choice: et le sang
  rationale: Le texte hébreu dit concrètement « sang », même si le contexte évoque une effusion de sang violente. La traduction principale maintient cette image sans l’expliciter davantage.
- source_word: בְּחוּצוֹתֶיהָ
  choice: dans ses rues
  rationale: חוּצוֹת désigne les rues ou espaces publics de la ville. En français, « dans ses rues » est plus idiomatique que « vers/dans ses rues » sous la dépendance du verbe « envoyer ».
- source_word: וְנִפְלַל חָלָל
  choice: les victimes tomberont
  rationale: Malgré la forme verbale inhabituelle, la proposition décrit clairement des personnes abattues. « Les victimes » restitue חָלָל sans produire la tournure française maladroite « les tués tomberont ».
- source_word: בְּתוֹכָהּ
  choice: au milieu d’elle
  rationale: Cette expression conserve la personnification féminine de la ville et situe les morts en son sein.
- source_word: בְּחֶרֶב עָלֶיהָ מִסָּבִיב
  choice: frappées par l’épée qui l’assaillira de tous côtés
  rationale: La formulation rend l’instrument de mort et l’attaque encerclante. L’ajout syntaxique « qui l’assaillira » explicite naturellement en français le rapport compact entre « l’épée », « contre elle » et « de tous côtés ».
- source_word: וְיָדְעוּ
  choice: Alors ils sauront
  rationale: La conjonction présente ici la connaissance de Yahweh comme le résultat du jugement annoncé ; « alors » exprime clairement ce lien.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre plutôt que remplacé par un titre, conformément à sa forme dans le texte source.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: L’hébreu emploie explicitement le tétragramme. La translittération « Yahweh » préserve le caractère de nom propre sans lui substituer un titre.
- issue: Sens de דָם dans l’annonce du jugement
  choice: le sang dans le texte, avec « effusion de sang » en note
  alternative: l’effusion de sang dans le texte principal
  rationale: Le sens violent est net dans le contexte, mais le substantif hébreu signifie littéralement « sang ». Garder l’image concrète évite de résoudre silencieusement cette nuance.
translation_notes:
  register: Français international moderne, digne et prophétique. La personnification féminine de la ville est maintenue par « elle » et « ses ». La structure a été légèrement déployée dans la seconde proposition pour éviter une accumulation obscure de compléments tout en conservant l’image de l’épée encerclant la ville.
