  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: fr
  text: 'La parole de Yahvé[a] me fut adressée en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu YHWH, traditionnellement rendu par « le SEIGNEUR » ; autre translittération possible : « Yahweh ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: me fut adressée
  rationale: Dans cette formule prophétique, le waw consécutif avec היה introduit la réception du message. La tournure française « la parole… me fut adressée » exprime naturellement l’idée sans recourir au calque archaïque « il arriva que ».
- source_word: דְבַר
  choice: la parole
  rationale: Dans les formules prophétiques, דָּבָר désigne la parole ou le message divin communiqué au prophète. « La parole » conserve l’expression biblique consacrée tout en restant claire.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est une forme française courante du nom divin représenté par le tétragramme YHWH et préserve ici l’emploi d’un nom propre plutôt que de lui substituer un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » rend de façon idiomatique la direction vers le prophète exprimée par אֵלַי.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'L’infinitif לֵאמֹר introduit les paroles qui suivent. « En ces termes : » remplit naturellement cette fonction en français et annonce le discours du verset suivant.'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR ; Yahweh
  rationale: Le texte hébreu emploie directement le tétragramme. La traduction retient une forme française du nom propre afin de préserver cette donnée, tandis que la note signale la substitution traditionnelle par un titre et une autre translittération moderne.
translation_notes:
  register: Français moderne, sobre et digne. La formule passive « me fut adressée » est idiomatique dans le registre prophétique ; les deux-points remplacent naturellement le participe « disant » avant le contenu du message.
