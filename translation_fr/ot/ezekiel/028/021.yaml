  text: בֶּן אָדָ֕ם שִׂ֥ים פָּנֶ֖י/ךָ אֶל צִיד֑וֹן וְ/הִנָּבֵ֖א עָלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/021.yaml
  text: Son of man[a], set your face toward Sidon, and prophesy against her.
translation:
  language: fr
  text: Fils d’homme[a], tourne ton visage vers Sidon et prophétise contre elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « être humain » ou « mortel ». L’hébreu dit « fils d’homme », formule par laquelle Ézéchiel est fréquemment interpellé.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Cette traduction conserve l’expression hébraïque récurrente par laquelle Ézéchiel est interpellé, tout en restant traditionnelle et intelligible en français. Ici, elle désigne sa condition humaine et ne constitue pas un titre christologique.
- source_word: שִׂים פָּנֶיךָ
  choice: tourne ton visage
  rationale: L’expression rend naturellement en français l’ordre de diriger résolument son visage vers une personne ou un lieu, tout en conservant l’image concrète de l’hébreu.
- source_word: אֶל צִידוֹן
  choice: vers Sidon
  rationale: La préposition exprime ici l’orientation du visage. « Vers » préserve ce sens directionnel sans anticiper la valeur hostile exprimée ensuite.
- source_word: וְהִנָּבֵא
  choice: et prophétise
  rationale: Traduction directe et concise de l’impératif, adaptée au contexte d’une mission prophétique.
- source_word: עָלֶיהָ
  choice: contre elle
  rationale: Dans ce contexte d’annonce de jugement, la préposition avec le verbe « prophétiser » a une valeur adversative. Le pronom féminin reprend la ville de Sidon, conformément à la personnification grammaticale hébraïque.
theological_decisions:
- issue: Sens de l’adresse בֶּן אָדָם dans Ézéchiel
  choice: Fils d’homme
  alternative: être humain ; mortel
  rationale: Il s’agit de l’adresse divine habituelle à Ézéchiel, qui souligne sa condition humaine. La formulation conserve le motif littéraire du livre sans lui attribuer ici une portée messianique.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement correspond à l’adresse directe au prophète. « Tourne ton visage » est plus idiomatique en français que le calque « mets ton visage », tout en conservant l’image hébraïque.
