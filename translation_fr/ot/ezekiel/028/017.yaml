revisions:
- from: Ton cœur s’est enorgueilli à cause de ta beauté[a] ; tu as corrompu ta sagesse à cause de ton éclat. Je t’ai jeté à terre ; je t’ai exposé devant des rois[b], pour qu’ils te regardent.
  to: Ton cœur s’est enorgueilli à cause de ta beauté[a] ; tu as corrompu ta sagesse à cause de ton éclat. Je t’ai jeté à terre ; je t’ai placé devant des rois[b], afin qu’ils te regardent.
  rationale: La révision remplace « exposé » par « placé » pour conserver la sobriété du verbe hébreu et l’alignement avec le choix anglais audité (« set ... before kings »). L’interprétation contextuelle d’une exposition publique est préservée comme alternative en note. Aucun autre changement n’est nécessaire.
