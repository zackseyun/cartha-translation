  text: גָּבַ֤הּ לִבְּ/ךָ֙ בְּ/יָפְיֶ֔/ךָ שִׁחַ֥תָּ חָכְמָתְ/ךָ֖ עַל יִפְעָתֶ֑/ךָ עַל אֶ֣רֶץ הִשְׁלַכְתִּ֗י/ךָ לִ/פְנֵ֧י מְלָכִ֛ים נְתַתִּ֖י/ךָ לְ/רַ֥אֲוָה בָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/017.yaml
  text: Your heart was lifted up because of your beauty[a]; you corrupted your wisdom because of your splendor. I cast you to the earth; I set you before kings[c][b], for them to look at you.
translation:
  language: fr
  text: Ton cœur s’est enorgueilli à cause de ta beauté[a] ; tu as corrompu ta sagesse à cause de ton éclat. Je t’ai jeté à terre ; je t’ai placé devant des rois[b], afin qu’ils te regardent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « Ton cœur s’est élevé à cause de ta beauté ».
    reason: La note conserve la métaphore hébraïque du cœur devenu haut, tandis que le texte principal en explicite le sens idiomatique d’orgueil.
  - marker: b
    text: 'Ou « je t’ai exposé devant des rois » ; autre traduction possible : « j’ai fait de toi un spectacle devant des rois ».'
    reason: Le verbe hébreu signifie littéralement « j’ai donné/placé » ; dans ce contexte, il peut aussi évoquer une exposition au regard des rois, idée explicitée par la proposition finale.
lexical_decisions:
- source_word: גָּבַהּ לִבְּךָ
  choice: Ton cœur s’est enorgueilli
  rationale: L’expression hébraïque évoque littéralement un cœur qui s’élève. En français actuel, « s’est enorgueilli » exprime clairement l’orgueil visé tout en conservant le cœur comme sujet.
- source_word: בְּיָפְיֶךָ
  choice: à cause de ta beauté
  rationale: 'La préposition ב a ici une valeur causale : la beauté est la cause de l’orgueil.'
- source_word: שִׁחַתָּ חָכְמָתְךָ
  choice: tu as corrompu ta sagesse
  rationale: שׁחת indique l’altération ou la ruine ; « corrompu » convient naturellement à « sagesse » et garde la portée morale de l’énoncé.
- source_word: עַל יִפְעָתֶךָ
  choice: à cause de ton éclat
  rationale: עַל est causal dans ce contexte, tandis que יִפְעָה désigne une apparence rayonnante, un éclat ou une splendeur.
- source_word: עַל אֶרֶץ הִשְׁלַכְתִּיךָ
  choice: Je t’ai jeté à terre
  rationale: La tournure française « jeter à terre » rend naturellement le mouvement d’abaissement exprimé par le verbe causatif et אֶרֶץ.
- source_word: לִפְנֵי מְלָכִים נְתַתִּיךָ
  choice: je t’ai exposé devant des rois
  rationale: Le sens littéral est « je t’ai placé/donné devant des rois ». « Exposé » rend dans ce contexte l’idée d’être publiquement donné à voir, explicitée par la proposition suivante.
- source_word: לְרַאֲוָה בָךְ
  choice: pour qu’ils te regardent
  rationale: L’infinitif précédé de ל exprime le but ou le résultat. Cette formulation française rend le sens sans reproduire maladroitement le ב final.
theological_decisions:
- issue: Référent du destinataire en Ézéchiel 28.17
  choice: Conserver le tutoiement singulier et le langage élevé de la lamentation adressée au roi de Tyr, sans préciser davantage son identité.
  alternative: Identifier explicitement le destinataire soit à un souverain purement humain, soit à un être surnaturel déchu.
  rationale: Le verset lui-même ne tranche pas la question d’une éventuelle portée symbolique ou typologique. La traduction préserve donc cette tension sans importer une identification doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre beauté et éclat est conservé, ainsi que la progression entre orgueil, corruption de la sagesse, chute et exposition publique. Tous les marqueurs de notes figurent dans le texte principal.
