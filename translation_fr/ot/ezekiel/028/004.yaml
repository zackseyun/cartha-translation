  text: בְּ/חָכְמָֽתְ/ךָ֙ וּ/בִ/תְבוּנָ֣תְ/ךָ֔ עָשִׂ֥יתָ לְּ/ךָ֖ חָ֑יִל וַ/תַּ֛עַשׂ זָהָ֥ב וָ/כֶ֖סֶף בְּ/אוֹצְרוֹתֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/004.yaml
  text: By your wisdom and by your understanding you made wealth for yourself[a], and you put gold and silver into your treasuries.
translation:
  language: fr
  text: Par ta sagesse et ton intelligence, tu t’es constitué une fortune[a] et tu as amassé de l’or et de l’argent dans tes réserves.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu as acquis de la force », « de la puissance » ou « des ressources ». Le mot hébreu peut désigner la fortune, la force, la puissance ou les ressources ; ici, la mention de l’or, de l’argent et des réserves favorise « fortune ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחָכְמָתְךָ
  choice: Par ta sagesse
  rationale: 'La préposition בְּ a ici une valeur instrumentale : la sagesse est le moyen par lequel le dirigeant a acquis ses biens.'
- source_word: וּבִתְבוּנָתְךָ
  choice: et ton intelligence
  rationale: תְּבוּנָה désigne l’intelligence, le discernement ou la perspicacité. « Intelligence » forme en français un couple naturel avec « sagesse » sans effacer entièrement la distinction entre les deux termes.
- source_word: עָשִׂיתָ לְּךָ חָיִל
  choice: tu t’es constitué une fortune
  rationale: חַיִל peut désigner la force, la puissance, les ressources ou la richesse. La mention immédiate de l’or, de l’argent et des trésors favorise ici le sens économique. « Se constituer une fortune » rend naturellement עָשָׂה לְךָ tout en conservant l’idée d’une accumulation à son propre profit.
- source_word: וַתַּעַשׂ זָהָב וָכֶסֶף
  choice: tu as amassé de l’or et de l’argent
  rationale: Pris littéralement, עָשָׂה signifie « faire », mais avec l’or, l’argent et les trésors, il exprime ici l’acquisition ou l’accumulation. « Amasser » est idiomatique et convient au contexte commercial.
- source_word: בְּאוֹצְרוֹתֶיךָ
  choice: dans tes trésors
  rationale: אוֹצָר peut désigner un trésor, un dépôt ou une réserve. En français, « trésors » peut ici désigner les réserves de richesses, en accord avec l’or et l’argent qui y sont accumulés.
theological_decisions:
- issue: Sens de חַיִל dans la parole contre le dirigeant de Tyr
  choice: fortune matérielle
  alternative: force, puissance ou ressources
  rationale: Le contexte immédiat, qui parle d’or, d’argent et de trésors, indique principalement l’enrichissement matériel. Une note conserve toutefois la gamme sémantique plus large du terme hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe au dirigeant de Tyr. La formulation privilégie une équivalence optimale et conserve en note l’ambiguïté réelle de חַיִל.
