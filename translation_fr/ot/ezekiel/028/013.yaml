source:
  edition: WLC
  text: בְּ/עֵ֨דֶן גַּן אֱלֹהִ֜ים הָיִ֗יתָ כָּל אֶ֨בֶן יְקָרָ֤ה מְסֻכָתֶ֨/ךָ֙ אֹ֣דֶם פִּטְדָ֞ה וְ/יָהֲלֹ֗ם תַּרְשִׁ֥ישׁ שֹׁ֨הַם֙ וְ/יָ֣שְׁפֵ֔ה סַפִּ֣יר נֹ֔פֶךְ וּ/בָרְקַ֖ת וְ/זָהָ֑ב מְלֶ֨אכֶת תֻּפֶּ֤י/ךָ וּ/נְקָבֶ֨י/ךָ֙ בָּ֔/ךְ בְּ/י֥וֹם הִבָּרַאֲ/ךָ֖ כּוֹנָֽנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/013.yaml
  text: 'You were in Eden[a], the garden of God; every precious stone was your covering: ruby, topaz, and diamond; beryl, onyx, and jasper; sapphire, turquoise, and emerald; and gold. The workmanship of your tambourines and your sockets was in you; on the day you were created[b], they were prepared.'
translation:
  language: fr
  text: 'Tu étais en Éden, le jardin de Dieu. Toute pierre précieuse[a] te couvrait : cornaline, topaze et diamant ; chrysolithe, onyx et jaspe ; saphir, turquoise et émeraude, ainsi que l’or. Le travail de tes tambourins et de tes flûtes était en toi[b] ; ils furent préparés le jour où tu fus créé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification exacte de plusieurs pierres est incertaine, car les noms antiques ne correspondent pas toujours aux catégories minéralogiques modernes. On propose notamment « rubis » pour « cornaline », « béryl » pour « chrysolithe », « lapis-lazuli » pour « saphir », et « escarboucle » ou « grenat » pour certaines autres pierres de la liste.
    reason: lexical_alternative
  - marker: b
    text: Hébreu difficile. Les termes sont traditionnellement compris comme désignant des instruments de musique, d’où « tambourins et flûtes ». Dans le contexte des pierres précieuses, ils peuvent aussi désigner des éléments de joaillerie, tels que des montures et des sertissures.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעֵדֶן גַּן אֱלֹהִים
  choice: en Éden, le jardin de Dieu
  rationale: Conserve le nom propre et la construction en apposition, tout en donnant une formulation française naturelle et solennelle.
- source_word: כָּל אֶבֶן יְקָרָה
  choice: toutes sortes de pierres précieuses
  rationale: Dans cette énumération, כָּל peut naturellement désigner l’ensemble des espèces citées. Cette tournure évite de suggérer que chaque pierre précieuse existante était présente.
- source_word: מְסֻכָתֶךָ
  choice: te couvraient
  rationale: Rend directement l’image d’une couverture sans décider s’il s’agit d’un vêtement, d’une parure ou d’un revêtement protecteur.
- source_word: אֹדֶם
  choice: cornaline
  rationale: La cornaline est une identification historique plausible de cette pierre rouge; la nomenclature antique reste toutefois incertaine.
- source_word: פִּטְדָה
  choice: topaze
  rationale: Équivalent traditionnel et intelligible, malgré l’incertitude minéralogique.
- source_word: יָהֲלֹם
  choice: diamant
  rationale: Conserve l’équivalent traditionnel largement reconnu, sans prétendre à une identification minéralogique certaine.
- source_word: תַּרְשִׁישׁ
  choice: chrysolithe
  rationale: Identification courante dans les listes antiques de gemmes; « béryl » demeure possible.
- source_word: שֹׁהַם
  choice: onyx
  rationale: Équivalent traditionnel bien établi dans les contextes bibliques de pierres précieuses.
- source_word: יָשְׁפֵה
  choice: jaspe
  rationale: Équivalent français standard.
- source_word: סַפִּיר
  choice: saphir
  rationale: Équivalent traditionnel, tout en reconnaissant que le lapis-lazuli est historiquement plausible.
- source_word: נֹפֶךְ
  choice: turquoise
  rationale: Choix moderne lisible pour une pierre dont l’identification exacte est débattue.
- source_word: בָרְקַת
  choice: émeraude
  rationale: Équivalent traditionnel; d’autres pierres brillantes ont aussi été proposées.
- source_word: מְלֶאכֶת תֻּפֶּיךָ וּנְקָבֶיךָ
  choice: le travail de tes montures et de tes sertissures
  rationale: Le contexte de joaillerie favorise ici des termes liés au montage des pierres. L’hébreu est difficile et peut aussi être compris littéralement comme évoquant des tambourins et des cavités; cette possibilité est conservée en note.
- source_word: בְּיוֹם הִבָּרַאֲךָ כּוֹנָנוּ
  choice: elles furent préparées le jour où tu as été créé
  rationale: Respecte le langage explicite de création et le pluriel du verbe, dont l’antécédent est compris comme les montures et les sertissures.
theological_decisions:
- issue: Identité du destinataire et portée de l’imagerie d’Éden
  choice: Traduire directement les images d’Éden et de création sans identifier le destinataire au-delà de ce que dit le verset.
  alternative: Préciser dans le texte qu’il s’agit uniquement du roi humain de Tyr, ou y voir explicitement Satan ou un chérubin déchu.
  rationale: Le passage associe le destinataire à Éden et à la création, mais le verset seul ne tranche pas les lectures plus larges. La traduction préserve donc cette tension interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme de la liste est conservé, tandis que la ponctuation clarifie les deux grandes propositions du verset. Les termes techniques de joaillerie restent assez courants pour être compris avec l’aide de la note.
