  source_fidelity: 'La traduction suit fidèlement la syntaxe et les images du texte hébreu : les sanctuaires sont maintenus au pluriel, le feu est explicitement tiré « du milieu de toi », et la destruction publique en cendres est conservée. « Nombreuses fautes » atténue toutefois légèrement la force quantitative de מֵרֹב (« de la multitude / de l’abondance »).'
  naturalness: Le français est naturel, moderne et d’un registre prophétique approprié. « Dans l’injustice de ton commerce » reflète plus directement le lien prépositionnel hébreu que « par l’injustice de ton commerce », sans nuire à la fluidité.
  terminology: « Profané », « sanctuaires », « commerce », « feu » et « réduit en cendres » sont précis et cohérents avec le registre cultuel et judiciaire du passage. « Fautes » demeure accessible, tandis que « multitude » restitue mieux l’intensité de l’hébreu.
