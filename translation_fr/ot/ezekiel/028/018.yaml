source:
  edition: WLC
  text: מֵ/רֹ֣ב עֲוֺנֶ֗י/ךָ בְּ/עֶ֨וֶל֙ רְכֻלָּ֣תְ/ךָ֔ חִלַּ֖לְתָּ מִקְדָּשֶׁ֑י/ךָ וָֽ/אוֹצִא אֵ֤שׁ מִ/תּֽוֹכְ/ךָ֙ הִ֣יא אֲכָלַ֔תְ/ךָ וָ/אֶתֶּנְ/ךָ֤ לְ/אֵ֨פֶר֙ עַל הָ/אָ֔רֶץ לְ/עֵינֵ֖י כָּל רֹאֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/018.yaml
  text: By the abundance of your iniquities[a], in the unrighteousness of your trade, you profaned your sanctuaries[c][b]; so I brought out fire from your midst—it consumed you—and I turned you to ashes on the earth in the sight of all who saw you.
translation:
  language: fr
  text: 'À cause de la multitude de tes fautes, dans l’injustice de ton commerce, tu as profané tes sanctuaires[a]. Alors j’ai fait sortir un feu du milieu de toi[b] : il t’a consumé, et je t’ai réduit en cendres sur la terre, sous les yeux de tous ceux qui te regardaient.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes lieux saints ». Le terme hébreu est au pluriel.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « j’ai fait sortir un feu de ton milieu ».'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵרֹב עֲוֺנֶיךָ
  choice: À cause de tes nombreuses fautes
  rationale: מִן avec רֹב exprime ici naturellement la cause. « Nombreuses fautes » rend le pluriel et le poids moral de עָוֹן dans un français actuel, sans trancher entre faute commise et culpabilité.
- source_word: בְּעֶוֶל רְכֻלָּתְךָ
  choice: par l’injustice de ton commerce
  rationale: עֶוֶל désigne l’injustice ou ce qui est moralement mauvais, et רְכֻלָּה renvoie à l’activité commerciale dans le contexte de Tyr. « Par » conserve la valeur instrumentale possible de בְּ.
- source_word: חִלַּלְתָּ
  choice: tu as profané
  rationale: Le piel de חלל exprime la profanation de ce qui est saint. « Profané » maintient le registre cultuel.
- source_word: מִקְדָּשֶׁיךָ
  choice: tes sanctuaires
  rationale: Le nom est au pluriel et désigne des lieux consacrés. La traduction conserve ce pluriel sans déterminer leur référent précis.
- source_word: וָאוֹצִא אֵשׁ מִתּוֹכְךָ
  choice: Alors j’ai fait sortir un feu du milieu de toi
  rationale: La formulation garde l’image d’un feu que Dieu fait surgir du milieu du destinataire; « alors » marque la progression vers le jugement.
- source_word: הִיא אֲכָלַתְךָ
  choice: il t’a consumé
  rationale: Le pronom féminin hébreu reprend אֵשׁ, grammaticalement féminin; le français reprend naturellement « feu » par « il ». « Consumer » convient à l’image du feu et du jugement.
- source_word: וָאֶתֶּנְךָ לְאֵפֶר
  choice: je t’ai réduit en cendres
  rationale: Littéralement, Dieu « donne » le destinataire en cendre. « Réduire en cendres » exprime clairement et idiomatiquement le résultat du jugement en français.
- source_word: עַל הָאָרֶץ
  choice: sur la terre
  rationale: אֶרֶץ peut désigner la terre, le pays ou le sol. « Sur la terre » conserve ici l’ampleur et la solennité de l’image.
- source_word: לְעֵינֵי כָּל רֹאֶיךָ
  choice: sous les yeux de tous ceux qui te regardaient
  rationale: La tournure rend l’exposition publique du jugement et la valeur visuelle de l’expression hébraïque.
theological_decisions:
- issue: Référent des « sanctuaires » dans la lamentation sur le roi de Tyr
  choice: Conserver le terme cultuel pluriel « tes sanctuaires » sans préciser leur identité.
  alternative: Interpréter ces sanctuaires comme les lieux sacrés de Tyr, comme une métaphore de la dignité royale ou comme des sanctuaires célestes.
  rationale: L’hébreu est explicitement pluriel et cultuel, mais le contexte ne permet pas de résoudre avec certitude la nature du référent. La traduction préserve donc l’ambiguïté et n’impose aucune lecture historique, typologique ou surnaturelle.
- issue: Origine du feu de jugement
  choice: « un feu du milieu de toi », en maintenant l’image d’un feu que Dieu fait sortir de l’intérieur du destinataire.
  alternative: Rendre plus librement par « un feu intérieur » ou laisser entendre que le feu naît spontanément en lui.
  rationale: Le sujet divin de « j’ai fait sortir » doit rester explicite, tandis que מִתּוֹכְךָ situe le feu au milieu du destinataire sans expliquer la portée théologique de cette image.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La phrase conserve la solennité prophétique et l’enchaînement causal du jugement. « Commerce » convient au cadre marchand de Tyr; « fautes » est plus immédiatement intelligible que « iniquités », tout en préservant la gravité morale du pluriel hébreu.
