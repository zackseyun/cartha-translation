  text: וַ/יָּ֜מָד אֶת אֻלָ֥ם הַ/שַּׁ֛עַר מֵ/הַ/בַּ֖יִת קָנֶ֥ה אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/008.yaml
  text: 'Then he measured the vestibule of the gate on the inside: one rod[a][b].'
translation:
  language: fr
  text: 'Puis il mesura le vestibule de la porte, du côté du Temple : une canne[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un roseau ». Le terme hébreu peut désigner un roseau servant de canne à mesurer.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « depuis la Maison ». Dans la vision du Temple d’Ézékiel, « la Maison » désigne souvent le Temple; la valeur spatiale exacte de « depuis » est ici difficile à déterminer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: Puis il mesura
  rationale: Le wayyiqtol fait progresser le récit; « Puis » rend naturellement la succession.
- source_word: אֻלָם הַשַּׁעַר
  choice: le vestibule de la porte
  rationale: « Vestibule » désigne clairement l'espace couvert situé à l'entrée de l'ensemble architectural.
- source_word: מֵהַבַּיִת
  choice: du côté du Temple
  rationale: Dans cette vision, בַּיִת désigne souvent le Temple; le préfixe מִן exprime ici une relation spatiale difficile à préciser. Cette formulation indique l'orientation sans imposer le sens plus précis d'« à l'intérieur ».
- source_word: קָנֶה אֶחָד
  choice: une canne
  rationale: קָנֶה désigne ici la canne de mesure définie dans le contexte; « canne » conserve l'image concrète et fonctionne comme unité de longueur.
theological_decisions:
- issue: Référence spatiale de מֵהַבַּיִת
  choice: du côté du Temple
  alternative: à l’intérieur; depuis le Temple
  rationale: Le texte est spatialement difficile. La traduction retenue préserve le lien avec le Temple tout en évitant de trancher indûment entre position intérieure, orientation et point de référence.
translation_notes:
  register: Français international moderne, sobre et architectural. La majuscule à « Temple » explicite le référent de « la Maison » dans la vision. Les deux appels de note figurent dans le texte.
