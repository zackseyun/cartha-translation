translation:
  language: fr
  text: Il fit les piliers de soixante coudées. Et, vers le pilier, la cour du portail était tout autour.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sens de la seconde partie du verset hébreu est incertain. Le texte est une construction elliptique, dont le rapport entre le pilier, la cour et le portail n’est pas clair.
    reason: La syntaxe du texte massorétique est exceptionnellement obscure. Cette note explique le caractère littéral et inhabituel de la formulation sans imposer une reconstruction.
lexical_decisions:
- source_word: אֵילִים / אֵיל
  choice: piliers / pilier
  rationale: Dans cette description architecturale, le terme désigne des éléments verticaux du portail. « Piliers » est plus naturel et probablement plus juste ici que « montants », tout en maintenant le singulier surprenant dans la seconde proposition.
- source_word: שִׁשִּׁים אַמָּה
  choice: soixante coudées
  rationale: Conserve la mesure antique du texte hébreu sans conversion conjecturale.
- source_word: סָבִיב סָבִיב
  choice: tout autour
  rationale: Rend l’expression distributive et emphatique de manière idiomatique en français.
theological_decisions:
- issue: Syntaxe obscure de la seconde proposition
  choice: Le portail s’étendait tout autour jusqu’au pilier de la cour.
  alternative: Et vers le pilier de la cour, le portail était tout autour.
  rationale: Le texte massorétique est syntaxiquement difficile. La formulation retenue suit la relation spatiale suggérée par וְאֶל, sans transformer la phrase en une affirmation théologique ni corriger silencieusement le texte.
translation_notes:
  register: Français moderne, sobre et architectural. La ponctuation en deux phrases clarifie la lecture sans prétendre résoudre entièrement l’obscurité du texte source.
