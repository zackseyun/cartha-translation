  text: וְ/אֵלַמָּ֗/ו אֶל חָצֵר֙ הַ/חִ֣צוֹנָ֔ה וְ/תִמֹרִ֖ים אֶל איל/ו וּ/מַעֲל֥וֹת שְׁמוֹנֶ֖ה מעל/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/031.yaml
  text: Its portico faced the outer court[a], and palm trees were on its jambs, and eight steps went up to it.
translation:
  language: fr
  text: Son portique donnait sur la cour extérieure, des palmiers figuraient sur ses montants[a], et on y montait par huit marches.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur ses pilastres ». Les termes architecturaux hébreux d’Ézéchiel 40 sont spécialisés et peuvent être traduits de différentes manières.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלַמּוֹ
  choice: son portique
  rationale: Dans la vision architecturale d’Ézéchiel, אֵלָם désigne la structure d’entrée en saillie. « Portique » est naturel, digne et suffisamment précis en français moderne.
- source_word: אֶל חָצֵר הַחִיצוֹנָה
  choice: donnait sur la cour extérieure
  rationale: La proposition nominale avec אֶל indique l’orientation. « Donnait sur » l’exprime idiomatiquement sans préciser davantage la disposition.
- source_word: תִמֹרִים
  choice: des palmiers étaient sculptés
  rationale: Le nom désigne ici des motifs de palmiers intégrés à l’architecture. « Étaient sculptés » rend explicite, d’après le contexte architectural, qu’il s’agit d’ornements et non d’arbres vivants.
- source_word: אֵילָו
  choice: ses montants
  rationale: Dans Ézéchiel 40, אֵיל désigne les éléments verticaux latéraux d’une ouverture ou d’une porte. « Montants » reste clair et moins technique que « pilastres ».
- source_word: מַעֲלוֹת שְׁמוֹנֶה ... מַעֲלוֹ
  choice: on y montait par huit marches
  rationale: La formulation française réunit naturellement le nombre de marches et l’idée d’accès ascendant exprimée par le dernier terme hébreu.
