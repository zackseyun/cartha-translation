id: EZK.40.3
reference: Ezekiel 40:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּבֵ֨יא אוֹתִ֜/י שָׁ֗מָּ/ה וְ/הִנֵּה אִישׁ֙ מַרְאֵ֨/הוּ֙ כְּ/מַרְאֵ֣ה נְחֹ֔שֶׁת וּ/פְתִיל פִּשְׁתִּ֥ים בְּ/יָד֖/וֹ וּ/קְנֵ֣ה הַ/מִּדָּ֑ה וְ/ה֥וּא עֹמֵ֖ד בַּ/שָּֽׁעַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/003.yaml
  text: He brought me there[a], and behold, there was a man whose appearance was like the appearance of bronze, with a linen cord in his hand and a measuring reed[c][b]; and he was standing in the gateway.
translation:
  language: fr
  text: Il me conduisit là, et voici qu’il y avait un homme dont l’aspect était semblable à celui du bronze. Il avait à la main un cordeau de lin[a] et une canne à mesurer, et il se tenait dans le portail[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une corde de lin » ou « un cordeau de fibres de lin ».
    reason: lexical_alternative
  - marker: b
    text: Ou « à la porte ». Le mot hébreu peut désigner la porte, le passage d’entrée ou l’ensemble du portail.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא אֹתִי שָׁמָּה
  choice: Il me conduisit là
  rationale: La forme narrative fait avancer le récit et décrit un déplacement vers le lieu qui vient d’être indiqué. « Conduisit » est naturel en français dans ce contexte visionnaire.
- source_word: וְהִנֵּה
  choice: et voici que
  rationale: Cette formule introduit avec vivacité ce qui apparaît au prophète et conserve le registre visionnaire du texte.
- source_word: אִישׁ
  choice: un homme
  rationale: Le texte désigne simplement un homme, sans préciser qu’il s’agit d’un ange ou d’une manifestation divine.
- source_word: מַרְאֵהוּ כְּמַרְאֵה נְחֹשֶׁת
  choice: dont l’aspect était semblable à celui du bronze
  rationale: La formulation conserve la répétition de מַרְאֶה sous une forme française naturelle. נְחֹשֶׁת peut désigner le cuivre ou le bronze; « bronze » convient bien à la description visionnaire et demeure traditionnel.
- source_word: פְּתִיל פִּשְׁתִּים
  choice: un cordeau de lin
  rationale: Le syntagme désigne un cordon fait de lin, probablement employé pour mesurer. « Cordeau » exprime clairement cet usage possible.
- source_word: בְּיָדוֹ
  choice: à la main
  rationale: Cette tournure idiomatique française respecte le singulier hébreu et indique que les instruments sont tenus par l’homme.
- source_word: קְנֵה הַמִּדָּה
  choice: une canne à mesurer
  rationale: קָנֶה désigne un roseau ou une canne servant ici d’instrument de mesure. « Canne à mesurer » reste concret et intelligible.
- source_word: וְהוּא עֹמֵד
  choice: et il se tenait
  rationale: Le participe décrit la posture continue du personnage au moment où Ézéchiel l’aperçoit.
- source_word: בַּשַּׁעַר
  choice: dans le portail
  rationale: Dans cette vision architecturale, שַׁעַר peut désigner l’ensemble construit du passage d’entrée, et non seulement une porte mobile.
theological_decisions:
- issue: Identité de l’homme dans la vision
  choice: Le personnage est simplement appelé « un homme ».
  alternative: L’identifier comme un ange, un messager céleste ou une figure théophanique.
  rationale: Le verset ne donne aucune identification plus précise; la traduction préserve donc cette indétermination.
translation_notes:
  register: Français moderne, digne et accessible. Le tour « et voici que » maintient la vivacité prophétique; les termes architecturaux et les instruments restent concrets sans archaïsme inutile.
