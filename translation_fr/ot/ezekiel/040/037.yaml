  text: Its portico faced the outer court[a], and palm trees were on its jambs, on this side and on that side[b]; and eight steps went up to it.
translation:
  language: fr
  text: Son portique donnait sur la cour extérieure[a]. Il y avait des palmiers sur ses montants, de part et d’autre[b], et huit marches y conduisaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son vestibule était tourné vers la cour extérieure » ou « son porche était du côté de la cour extérieure ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « des palmiers étaient sur ses montants, de ce côté-ci et de ce côté-là ». Dans ce contexte architectural, il peut s’agir de motifs de palmiers sculptés plutôt que d’arbres réels.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלָו / אֵילָיו
  choice: son portique
  rationale: Dans la description architecturale des portes en Ézéchiel 40, le terme désigne ici la structure d’entrée en saillie. « Portique » est naturel et digne en français.
- source_word: לֶחָצֵר הַחִיצוֹנָה
  choice: donnait sur la cour extérieure
  rationale: La préposition exprime l’orientation du portique. « Donnait sur » rend cette relation clairement en français architectural courant.
- source_word: תִמֹרִים
  choice: des palmiers étaient sculptés
  rationale: Le nom signifie littéralement « palmiers », mais, placés sur des éléments architecturaux, il s’agit vraisemblablement de motifs sculptés. L’ajout explicite de « sculptés » communique ce contexte sans remplacer l’image du texte.
- source_word: אֶל אֵילָיו
  choice: sur ses montants
  rationale: Le terme apparenté désigne ici les éléments verticaux latéraux de la porte plutôt qu’une seconde mention du portique entier. « Montants » est plus accessible en français moderne que « piédroits ».
- source_word: מִפּוֹ וּמִפּוֹ
  choice: de part et d’autre
  rationale: Cette expression distributive indique une disposition symétrique des deux côtés.
- source_word: שְׁמֹנֶה מַעֲלוֹת מַעֲלוֹ
  choice: huit marches y conduisaient
  rationale: L’expression décrit l’escalier ou l’ascension menant à la structure. Cette formulation idiomatique conserve à la fois le nombre des marches et leur fonction.
