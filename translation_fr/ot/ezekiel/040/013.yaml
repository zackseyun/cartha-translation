base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/013.yaml
  text: 'Then he measured the gateway from the roof of one guardroom to the roof of the other: twenty-five cubits wide[b][a], doorway opposite doorway.'
translation:
  language: fr
  text: 'Puis il mesura le portail, du toit d’une chambre de garde[a] au toit de l’autre : vingt-cinq coudées de large, une ouverture en face d’une ouverture.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu תָּא désigne une petite chambre intégrée à la structure du portail. Il peut aussi se rendre par « chambre latérale » ; dans ce contexte, il est souvent compris comme une chambre de garde.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ouverture en face d’ouverture ». L’expression décrit des ouvertures correspondantes qui se font face de part et d’autre du portail.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: Puis il mesura
  rationale: Le wayyiqtol fait progresser le récit; « Puis » exprime naturellement la succession narrative.
- source_word: הַשַּׁעַר
  choice: le portail
  rationale: Dans ce contexte architectural, le mot désigne l’ensemble de la construction d’accès, et non un simple battant.
- source_word: מִגַּג הַתָּא לְגַגּוֹ
  choice: du toit d’une loge au toit de celle d’en face
  rationale: תָּא désigne une pièce intégrée au portail, souvent comprise comme une loge de garde. La formulation explicite avec prudence la loge correspondante située de l’autre côté, nécessaire pour rendre intelligible la mesure.
- source_word: רֹחַב עֶשְׂרִים וְחָמֵשׁ אַמּוֹת
  choice: vingt-cinq coudées de large
  rationale: Cette tournure française naturelle conserve l’unité antique et indique clairement qu’il s’agit de la largeur.
- source_word: פֶּתַח נֶגֶד פָּתַח
  choice: une entrée en face de l’autre
  rationale: La répétition hébraïque décrit deux ouvertures correspondantes qui se font face; cette formulation en restitue clairement la symétrie.
