  text: וְ/אַרְבָּעָה֩ שֻׁלְחָנ֨וֹת לָ/עוֹלָ֜ה אַבְנֵ֣י גָזִ֗ית אֹרֶךְ֩ אַמָּ֨ה אַחַ֤ת וָ/חֵ֨צִי֙ וְ/רֹ֨חַב אַמָּ֤ה אַחַת֙ וָ/חֵ֔צִי וְ/גֹ֖בַהּ אַמָּ֣ה אֶחָ֑ת אֲלֵי/הֶ֗ם וְ/יַנִּ֤יחוּ אֶת הַ/כֵּלִים֙ אֲשֶׁ֨ר יִשְׁחֲט֧וּ אֶת הָ/עוֹלָ֛ה בָּ֖/ם וְ/הַ/זָּֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/042.yaml
  text: And four tables for the burnt offering were of cut stone[a], a cubit and a half long, a cubit and a half wide, and one cubit high[b]. On them they placed the implements with which they slaughtered the burnt offering and the sacrifice.
translation:
  language: fr
  text: Il y avait aussi quatre tables en pierre de taille[a] pour l’holocauste. Elles mesuraient une coudée et demie de long, une coudée et demie de large et une coudée de haut. On y déposait les instruments avec lesquels on égorgeait l’holocauste et le sacrifice[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en pierres taillées ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut désigner un sacrifice en général ou, dans certains contextes, plus précisément un sacrifice de paix.
    reason: alternative_reading
lexical_decisions:
- source_word: שֻׁלְחָנוֹת
  choice: tables
  rationale: Le nom désigne simplement des tables ou surfaces semblables à des tables; leur fonction sacrificielle est précisée dans la suite.
- source_word: לָעוֹלָה
  choice: pour l’holocauste
  rationale: עוֹלָה est le terme habituel pour l’offrande entièrement brûlée, et la préposition ל indique ici la destination.
- source_word: אַבְנֵי גָזִית
  choice: en pierre de taille
  rationale: Cette expression désigne des pierres travaillées ou taillées. « Pierre de taille » est l’expression française naturelle et précise.
- source_word: אַמָּה אַחַת וָחֵצִי
  choice: une coudée et demie
  rationale: La formulation conserve l’unité ancienne et rend naturellement la mesure en français.
- source_word: וְגֹבַהּ אַמָּה אֶחָת
  choice: une coudée de haut
  rationale: 'Cette tournure française exprime naturellement la dimension tout en reflétant le sens littéral « sa hauteur : une coudée ».'
- source_word: אֲלֵיהֶם
  choice: On y
  rationale: Le pronom adverbial « y » renvoie naturellement à la surface des tables.
- source_word: וְיַנִּיחוּ
  choice: déposait
  rationale: L’imparfait français rend bien l’usage habituel ou fonctionnel décrit dans cette vision, sans imposer un événement ponctuel.
- source_word: הַכֵּלִים
  choice: les instruments
  rationale: Dans ce contexte d’abattage sacrificiel, « instruments » est suffisamment précis sans restreindre indûment la gamme des objets concernés.
- source_word: אֲשֶׁר יִשְׁחֲטוּ
  choice: avec lesquels on égorgeait
  rationale: שׁחט désigne l’égorgement ou l’abattage rituel; « égorgeait » conserve cette précision cultuelle.
- source_word: הָעוֹלָה
  choice: l’holocauste
  rationale: Le même terme sacrificiel est traduit uniformément dans les deux occurrences du verset.
- source_word: וְהַזָּבַח
  choice: et le sacrifice
  rationale: זֶבַח peut désigner un sacrifice de manière générale; le contexte immédiat n’impose pas ici la catégorie plus étroite du sacrifice de paix.
- source_word: בָּם
  choice: avec lesquels
  rationale: Le suffixe renvoie aux instruments comme moyens employés pour l’égorgement; cette intégration dans la relative est idiomatique en français.
theological_decisions:
- issue: Degré de spécificité de זֶבַח dans la terminologie sacrificielle
  choice: le sacrifice
  alternative: le sacrifice de paix
  rationale: Le mot peut être générique ou désigner, selon le contexte, une catégorie sacrificielle plus précise. Le verset ne permettant pas de trancher avec certitude, le texte principal conserve le sens large et la note signale l’autre possibilité.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait décrit l’usage habituel des tables. Les unités anciennes sont conservées, et les termes cultuels « holocauste » et « sacrifice » maintiennent les distinctions du texte hébreu.
