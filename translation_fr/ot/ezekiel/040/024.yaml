  text: וַ/יּוֹלִכֵ֨/נִי֙ דֶּ֣רֶךְ הַ/דָּר֔וֹם וְ/הִנֵּה שַׁ֖עַר דֶּ֣רֶךְ הַ/דָּר֑וֹם וּ/מָדַ֤ד איל/ו ו/אילמ/ו כַּ/מִּדּ֖וֹת הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/024.yaml
  text: Then he led me by way of the south[a], and behold, there was a gate facing south[b]. He measured its side pillars and its porch according to these measurements.
translation:
  language: fr
  text: 'Puis il me conduisit en direction du sud. Et voici : il y avait une porte orientée vers le sud. Il mesura ses piliers latéraux[a] et son porche, selon ces mêmes dimensions[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, dans un vocabulaire plus technique, « ses montants ». Le terme architectural hébreu désigne probablement les structures verticales qui encadrent et soutiennent la porte.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire que les dimensions de cette porte correspondaient à celles des portes décrites précédemment.
    reason: cross_reference
lexical_decisions:
- source_word: וַיּוֹלִכֵנִי
  choice: Puis il me conduisit
  rationale: Le hifil de הלך exprime ici le fait de faire aller, donc de conduire. « Puis » rend naturellement la progression du récit.
- source_word: דֶּרֶךְ הַדָּרוֹם
  choice: en direction du sud
  rationale: Littéralement « le chemin du sud » ; dans ce contexte spatial, l’expression indique la direction du déplacement.
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: Conserve la fonction déictique du marqueur hébreu, qui attire l’attention sur un nouvel élément de la vision.
- source_word: שַׁעַר דֶּרֶךְ הַדָּרוֹם
  choice: une porte orientée vers le sud
  rationale: La tournure désigne la porte selon son orientation ; cette formulation est naturelle et précise en français.
- source_word: אֵילוֹ
  choice: ses piliers latéraux
  rationale: Dans la description architecturale des portes, אֵיל désigne vraisemblablement les éléments verticaux de soutien situés sur les côtés. « Piliers latéraux » reste compréhensible sans imposer un terme trop technique.
- source_word: וְאֵילַמּוֹ
  choice: son porche
  rationale: אֵילָם désigne l’espace couvert ou vestibule associé à la porte. « Porche » est un équivalent architectural accessible.
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: selon ces mêmes dimensions
  rationale: La préposition comparative כ indique que les dimensions correspondent à celles qui viennent d’être décrites. « Ces mêmes dimensions » rend à la fois la comparaison et le renvoi contextuel.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La répétition de « sud » et le marqueur visuel « Et voici » sont conservés afin de respecter le caractère spatial et visionnaire du passage. Les termes architecturaux restent accessibles, avec la variante plus technique donnée en note.
