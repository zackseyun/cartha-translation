  rationale: La révision clarifie que le dallage entoure la cour, conformément à la portée spatiale de סָבִיב סָבִיב, tout en gardant sa répétition emphatique. Elle emploie aussi « conduisit », plus neutre et idiomatique pour וַיְבִיאֵנִי. La formulation prudente et la note concernant la relation des salles au dallage sont conservées.
