base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/017.yaml
  text: Then he brought me into the outer court[a], and behold, there were chambers and a pavement made for the court all around, all around; thirty chambers were on the pavement.
translation:
  language: fr
  text: Puis il me conduisit dans la cour extérieure. Et voici qu’il y avait des salles et un dallage aménagé tout autour de la cour, tout autour ; trente salles donnaient sur le dallage[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « se trouvaient près du dallage », « étaient tournées vers le dallage » ou « se trouvaient sur le dallage ». Littéralement, l’hébreu dit : « trente salles vers le dallage » ; il indique leur relation avec la surface dallée sans en préciser entièrement la nature.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: Puis il me fit entrer
  rationale: Le wayyiqtol poursuit le récit de la vision. « Puis » marque naturellement la progression, et la tournure factitive rend le mouvement vers l’intérieur.
- source_word: הֶחָצֵר הַחִיצוֹנָה
  choice: la cour extérieure
  rationale: Dans cette description architecturale, חָצֵר désigne une cour, qualifiée ici d’extérieure.
- source_word: וְהִנֵּה
  choice: Et voici qu’il y avait
  rationale: Cette formulation conserve la fonction visuelle et présentative de הִנֵּה dans un français actuel et digne.
- source_word: לְשָׁכוֹת
  choice: des salles
  rationale: לִשְׁכָּה désigne ici des pièces intégrées au complexe du temple. « Salles » est clair et architectural sans suggérer arbitrairement de petites cellules.
- source_word: וְרִצְפָה
  choice: et un dallage
  rationale: רִצְפָה désigne une surface pavée ; « dallage » convient au contexte architectural et se lit naturellement en français.
- source_word: עָשׂוּי לֶחָצֵר
  choice: aménagé pour la cour
  rationale: Le participe passif exprime ce qui a été fait ou disposé pour la cour. La traduction conserve la valeur du ל sans préciser indûment le procédé de construction.
- source_word: סָבִיב סָבִיב
  choice: tout autour, tout autour
  rationale: La répétition hébraïque est conservée afin d’en rendre l’insistance spatiale.
- source_word: שְׁלֹשִׁים לְשָׁכוֹת
  choice: trente salles
  rationale: Traduction directe du nombre et du nom, avec cohérence lexicale dans le verset.
- source_word: אֶל הָרִצְפָה
  choice: donnaient sur le dallage
  rationale: אֶל indique ici la relation des salles au dallage et peut suggérer leur orientation vers celui-ci. « Donnaient sur » rend cette relation sans affirmer qu’elles reposaient nécessairement dessus ; l’ambiguïté est signalée en note.
