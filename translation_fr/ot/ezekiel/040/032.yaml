    issue: « les mêmes dimensions » au lieu de « ces dimensions »
    rationale: Le texte hébreu emploie le démonstratif proximal הָאֵלֶּה. « Les mêmes » explicite une comparaison avec les mesures antérieures mais ne reproduit pas exactement la référence déictique du texte; « ces dimensions » est à la fois fidèle et naturel.
