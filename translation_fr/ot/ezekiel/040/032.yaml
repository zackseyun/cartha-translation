  text: וַ/יְבִיאֵ֛/נִי אֶל הֶ/חָצֵ֥ר הַ/פְּנִימִ֖י דֶּ֣רֶךְ הַ/קָּדִ֑ים וַ/יָּ֣מָד אֶת הַ/שַּׁ֔עַר כַּ/מִּדּ֖וֹת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/032.yaml
  text: Then he brought me into the inner court by way of the east[a], and he measured the gate according to these measurements.
translation:
  language: fr
  text: Puis il me conduisit dans la cour intérieure par l’est, et il mesura la porte selon ces dimensions.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le portail ». Le mot hébreu שַׁעַר peut désigner soit la porte elle-même, soit l’ensemble architectural qui l’entoure dans cette vision du Temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: Puis il me conduisit
  rationale: Le wayyiqtol de בוא avec suffixe de première personne poursuit la séquence narrative et a ici un sens causatif. « Puis » marque naturellement la progression, et « conduisit » convient au déplacement guidé dans l’édifice.
- source_word: הֶחָצֵר הַפְּנִימִי
  choice: dans la cour intérieure
  rationale: חָצֵר désigne une cour, et הַפְּנִימִי la qualifie d’intérieure. Cette formulation est usuelle et claire dans un contexte de temple.
- source_word: דֶּרֶךְ הַקָּדִים
  choice: en passant par l’est
  rationale: דֶּרֶךְ indique la voie ou l’itinéraire, tandis que הַקָּדִים désigne l’est. La traduction exprime le trajet sans transformer indûment l’expression en direction de déplacement.
- source_word: וַיָּמָד
  choice: et il mesura
  rationale: Le verbe מדד a son sens architectural ordinaire de « mesurer » et poursuit la narration.
- source_word: הַשַּׁעַר
  choice: la porte
  rationale: שַׁעַר peut désigner la porte ou l’ensemble architectural du portail. « Porte » reste le terme principal, concis et traditionnel dans ce contexte, avec l’autre possibilité signalée en note.
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: selon les mêmes dimensions
  rationale: La préposition כְּ exprime la conformité aux dimensions déjà données. Bien que הָאֵלֶּה soit littéralement « celles-ci », « les mêmes dimensions » rend clairement en français la comparaison avec les mesures précédentes.
