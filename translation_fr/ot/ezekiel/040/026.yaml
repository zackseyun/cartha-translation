  text: And its ascent had seven steps[a], with its vestibule before them; and it had palm-tree ornaments, one on this side and one on that side[b], on its jambs.
translation:
  language: fr
  text: On y montait par sept marches, et son vestibule[a] se trouvait devant elles. Des motifs de palmiers ornaient ses montants[b], un de chaque côté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « porche » pour « vestibule » (hébreu אֵילָם), traduction traditionnelle dans les descriptions de la vision du Temple.
    reason: lexical_alternative
  - marker: b
    text: Ou « poteaux latéraux » ou « piédroits » pour « montants » (hébreu אֵילָו).
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלוֹת שִׁבְעָה עֲלוֹתוֹ
  choice: On y montait par sept marches
  rationale: La formulation rend naturellement l’approche ascendante de la porte et le nombre de marches, sans reproduire en français la répétition peu idiomatique de la racine « monter ».
- source_word: וְאֵילַמּוֹ
  choice: et son vestibule
  rationale: Dans la vision architecturale d’Ézéchiel, אֵילָם désigne l’espace d’entrée couvert de la porte. « Vestibule » est précis, actuel et cohérent avec le contexte.
- source_word: לִפְנֵיהֶם
  choice: se trouvait devant elles
  rationale: Le pronom pluriel renvoie naturellement aux marches; la tournure française explicite la disposition spatiale sans ajouter d’interprétation.
- source_word: וְתִמֹרִים
  choice: Des motifs de palmier ornaient
  rationale: Dans ce contexte architectural, les palmiers sont des représentations décoratives plutôt que des arbres réels. « Motifs de palmier » exprime clairement cette fonction.
- source_word: אֶחָד מִפּוֹ וְאֶחָד מִפּוֹ
  choice: un de chaque côté
  rationale: Cette expression idiomatique conserve la répartition symétrique, un motif sur chacun des deux côtés.
- source_word: אֵילָיו
  choice: ses montants
  rationale: Le terme désigne ici les éléments verticaux latéraux de l’encadrement. « Montants » est précis et plus accessible en français architectural courant que « piédroits ».
