base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/022.yaml
  text: Its windows[a], its porch, and its palm-tree decorations had the same measurements as the gate that faced east. People would go up to it by seven steps[c][b], and its porch was in front of them.
translation:
  language: fr
  text: Ses fenêtres, son vestibule[a] et ses motifs de palmiers[b] avaient les mêmes dimensions que ceux de la porte qui faisait face à l’est. On y montait par sept marches[c], et son vestibule était devant eux[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son portique »; le même terme architectural revient à la fin du verset.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ses palmiers »; dans ce contexte, il s’agit vraisemblablement de sculptures ou de motifs décoratifs représentant des palmiers.
    reason: cultural_note
  - marker: c
    text: 'L’hébreu emploie un verbe au pluriel, littéralement « ils y montaient », probablement avec un sens impersonnel : « on y montait ».'
    reason: lexical_alternative
  - marker: d
    text: Littéralement « devant eux ». Le référent exact du pronom pluriel est incertain dans la formulation hébraïque.
    reason: textual_note
lexical_decisions:
- source_word: וְחַלּוֹנוֹ
  choice: ses fenêtres
  rationale: חַלּוֹן désigne une fenêtre ou une ouverture de fenêtre. Le collectif « ses fenêtres » convient naturellement à la description architecturale.
- source_word: וְאֵלַמּוֹ / וְאֵילַמּוֹ
  choice: son vestibule
  rationale: אֵילָם/אוּלָם désigne ici l’espace ou la construction d’entrée en saillie. « Vestibule » est clair en français architectural et peut être employé uniformément aux deux occurrences.
- source_word: וְתִמָּרוֹ
  choice: ses motifs de palmiers
  rationale: Dans ce contexte architectural, תִּמָּרָה renvoie vraisemblablement à des représentations ornementales de palmiers plutôt qu’à des arbres vivants.
- source_word: כְּמִדַּת
  choice: avaient les mêmes dimensions que
  rationale: La préposition comparative כ avec מִדָּה exprime la conformité des mesures; cette formulation est naturelle en français.
- source_word: הַשַּׁעַר אֲשֶׁר פָּנָיו דֶּרֶךְ הַקָּדִים
  choice: la porte qui faisait face à l’est
  rationale: L’expression indique l’orientation de la façade de la porte vers l’est.
- source_word: וּבְמַעֲלוֹת שֶׁבַע יַעֲלוּ בוֹ
  choice: On y montait par sept marches
  rationale: Le verbe à la troisième personne du pluriel a probablement une valeur impersonnelle. Le pronom « on » la rend naturellement, tandis que « par sept marches » indique le moyen d’accès.
- source_word: לִפְנֵיהֶם
  choice: devant elles
  rationale: לִפְנֵי exprime une relation spatiale, « devant ». L’antécédent grammatical le plus proche en français est « les marches », mais le référent du suffixe pluriel reste comprimé et discuté dans l’hébreu.
