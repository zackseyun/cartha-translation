base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/033.yaml
  text: And its guardrooms[a], its side pillars, and its portico were according to these measurements; and it and its side pillars had windows all around. Its length was fifty cubits[b], and its width twenty-five cubits.
translation:
  language: fr
  text: Ses loges de garde, ses piliers latéraux[a] et son vestibule[b] avaient les mêmes dimensions. La porte et son vestibule avaient des fenêtres tout autour. La porte mesurait cinquante coudées de long et vingt-cinq coudées de large.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses jambages » ou « ses pilastres ». Le terme architectural hébreu est difficile et peut désigner des éléments verticaux de la porte.
    reason: lexical_alternative
  - marker: b
    text: Ou « son portique » ou « son porche ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּא
  choice: loges de garde
  rationale: Dans la description des portes en Ézéchiel 40, le terme désigne les petites pièces intégrées à la porte. « Loges de garde » exprime clairement leur fonction probable tout en restant architectural.
- source_word: אַיִל
  choice: piliers latéraux
  rationale: Le terme désigne ici des éléments verticaux de la structure de la porte. « Piliers latéraux » est intelligible en français courant; « jambages » ou « pilastres » restent possibles.
- source_word: אֵילָם
  choice: vestibule
  rationale: Dans ce contexte architectural, le mot désigne l'espace ou la structure d'entrée de la porte. « Vestibule » convient au français moderne, sans donner au lieu une connotation domestique.
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: avaient les mêmes dimensions que les précédents
  rationale: La formule indique une conformité aux mesures déjà données. L'ajout explicatif « que les précédents » rend naturel en français le démonstratif hébreu contextuel sans modifier la comparaison.
- source_word: חַלּוֹנוֹת
  choice: fenêtres
  rationale: Le sens architectural ordinaire de « fenêtres » convient; « ouvertures » serait possible mais inutilement vague.
- source_word: לוֹ וּלְאֵילַמּוֹ
  choice: La porte et ses piliers latéraux avaient
  rationale: Le pronom renvoie à la porte décrite dans le contexte. La reprise explicite de « la porte » évite en français un pronom ambigu. La forme אֵילַמּוֹ est comprise ici comme renvoyant à ses éléments latéraux, conformément à la distinction contextuelle entre les piliers et le vestibule.
- source_word: סָבִיב סָבִיב
  choice: tout autour
  rationale: Cette expression redoublée souligne que les fenêtres se trouvaient sur tout le pourtour.
- source_word: אֹרֶךְ חֲמִשִּׁים אַמָּה וְרֹחַב חָמֵשׁ וְעֶשְׂרִים אַמָּה
  choice: cinquante coudées de long et vingt-cinq coudées de large
  rationale: Cette formulation française idiomatique conserve exactement les deux dimensions et l'unité ancienne.
