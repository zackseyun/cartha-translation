  text: בְּ/מַרְא֣וֹת אֱלֹהִ֔ים הֱבִיאַ֖/נִי אֶל אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יְנִיחֵ֗/נִי אֶל הַ֤ר גָּבֹ֨הַּ֙ מְאֹ֔ד וְ/עָלָ֥י/ו כְּ/מִבְנֵה עִ֖יר מִ/נֶּֽגֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/002.yaml
  text: In visions of God he brought me into the land of Israel and set me down on a very high mountain[a]; on it, to the south[b], was something like the structure of a city.
translation:
  language: fr
  text: Dans des visions de Dieu[a], il m’a amené dans le pays d’Israël et m’a placé sur une très haute montagne ; sur cette montagne, vers le sud[b], se trouvait quelque chose qui ressemblait à la structure d’une ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans des visions divines » ou « dans des visions venant de Dieu ».
    reason: lexical_alternative
  - marker: b
    text: Ou « au sud » ou « du côté sud » ; l’hébreu peut indiquer une orientation méridionale plutôt qu’un emplacement précisément délimité.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַרְאוֹת אֱלֹהִים
  choice: Dans des visions de Dieu
  rationale: Cette formulation conserve le pluriel et le lien explicite avec Dieu, tout en restant naturelle en français. Elle laisse ouvertes les nuances « visions divines » et « visions venant de Dieu ».
- source_word: הֱבִיאַנִי
  choice: il m’a conduit
  rationale: Le hiphil de בוא exprime ici le fait de mener ou d’amener quelqu’un à destination. « Conduit » convient au transport visionnaire sans expliciter davantage le sujet implicite.
- source_word: אֶל אֶרֶץ יִשְׂרָאֵל
  choice: au pays d’Israël
  rationale: Avec « conduire », « au pays d’Israël » exprime naturellement le mouvement vers cette destination. « Pays » rend אֶרֶץ sans imposer ici une nuance politique moderne.
- source_word: וַיְנִיחֵנִי
  choice: et m’a déposé
  rationale: Le hiphil de נוח signifie ici placer ou déposer. Ce choix garde l’image d’un transport visionnaire et évite le sens trompeur de « donner du repos ».
- source_word: אֶל הַר גָּבֹהַּ מְאֹד
  choice: sur une très haute montagne
  rationale: Après « déposer », « sur » exprime idiomatiquement la position atteinte; גָּבֹהַּ מְאֹד signifie directement « très haute ».
- source_word: וְעָלָיו
  choice: Sur celle-ci
  rationale: Le pronom renvoie à la montagne. « Celle-ci » évite l’ambiguïté possible de « sur elle » et permet une nouvelle phrase fluide.
- source_word: כְּמִבְנֵה עִיר
  choice: quelque chose qui ressemblait à la structure d’une ville
  rationale: מִבְנֶה désigne une structure ou un ensemble bâti, tandis que כְּ marque une comparaison. « Quelque chose qui ressemblait » préserve la prudence descriptive de la vision.
- source_word: מִנֶּגֶב
  choice: du côté sud
  rationale: Cette expression indique naturellement une localisation ou une orientation méridionale sans trancher trop fortement entre « au sud » et « vers le sud ».
theological_decisions:
- issue: Sujet implicite des verbes de transport visionnaire
  choice: Employer « il » sans nommer explicitement Dieu
  alternative: « Dieu m’a conduit… et m’a déposé… »
  rationale: Les verbes hébreux ont un sujet masculin singulier implicite, compris dans le contexte. « Il » respecte cette économie textuelle, tandis que l’expression initiale situe déjà l’expérience dans la sphère divine.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le caractère visionnaire et comparatif du texte, ainsi que l’implicite du sujet divin.
