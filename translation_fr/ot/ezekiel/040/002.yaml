revisions:
- from: Dans des visions de Dieu[a], il m’a conduit au pays d’Israël et m’a déposé sur une très haute montagne. Sur celle-ci, du côté sud[b], se trouvait quelque chose qui ressemblait à la structure d’une ville.
  to: Dans des visions de Dieu[a], il m’a amené dans le pays d’Israël et m’a placé sur une très haute montagne ; sur cette montagne, vers le sud[b], se trouvait quelque chose qui ressemblait à la structure d’une ville.
  rationale: La révision conserve toutes les options interprétatives importantes du texte source tout en évitant de présenter comme certaine une localisation sur le côté sud de la montagne. Elle améliore aussi légèrement le registre de la description du transport visionnaire.
