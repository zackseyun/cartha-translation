  text: וַ/יְדַבֵּ֨ר אֵלַ֜/י הָ/אִ֗ישׁ בֶּן אָדָ֡ם רְאֵ֣ה בְ/עֵינֶי/ךָ֩ וּ/בְ/אָזְנֶ֨י/ךָ שְּׁמָ֜ע וְ/שִׂ֣ים לִבְּ/ךָ֗ לְ/כֹ֤ל אֲשֶׁר אֲנִי֙ מַרְאֶ֣ה אוֹתָ֔/ךְ כִּ֛י לְמַ֥עַן הַרְאוֹתְ/כָ֖ה הֻבָ֣אתָה הֵ֑נָּה הַגֵּ֛ד אֶת כָּל אֲשֶׁר אַתָּ֥ה רֹאֶ֖ה לְ/בֵ֥ית יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/004.yaml
  text: And the man said to me[a], “Son of man, see with your eyes, and hear with your ears, and set your heart on all that I show you, for you were brought here so that I might show you these things. Declare to the house of Israel all that you see.”
translation:
  language: fr
  text: 'L’homme me dit : « Fils d’homme[a], regarde de tes yeux, écoute de tes oreilles et prends à cœur tout ce que je te montre ; car c’est pour te montrer tout cela que tu as été amené ici. Annonce à la maison d’Israël tout ce que tu vois. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « être humain » ou « mortel ». L’expression hébraïque est la manière habituelle de s’adresser à Ézéchiel.
    reason: Alternative lexicale et clarification de la formule récurrente.
lexical_decisions:
- source_word: הָאִישׁ
  choice: L’homme
  rationale: Le nom désigne naturellement la figure masculine introduite au verset précédent.
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Cette formule récurrente par laquelle Ézéchiel est interpellé conserve ici sa continuité littéraire; elle souligne son humanité sans constituer dans ce contexte un titre christologique.
- source_word: רְאֵה בְעֵינֶיךָ
  choice: regarde de tes yeux
  rationale: « Regarde » exprime l’attention visuelle demandée et maintient le parallélisme concret avec l’écoute des oreilles.
- source_word: וּבְאָזְנֶיךָ שְּׁמָע
  choice: écoute de tes oreilles
  rationale: « Écoute » rend l’impératif comme une réception attentive tout en préservant l’image et le parallélisme hébraïques.
- source_word: וְשִׂים לִבְּךָ
  choice: prends à cœur
  rationale: Cette expression française naturelle conserve l’image du cœur comme siège de l’attention, de la réflexion et de la volonté.
- source_word: לְכֹל אֲשֶׁר אֲנִי מַרְאֶה אוֹתָךְ
  choice: tout ce que je vais te montrer
  rationale: Le hiphil de ראה a le sens de « montrer ». Le futur proche convient au cadre visionnaire et à ce qu’Ézéchiel doit encore observer.
- source_word: כִּי לְמַעַן הַרְאוֹתְכָה הֻבָאתָה הֵנָּה
  choice: car tu as été amené ici afin que je te le montre
  rationale: La formulation garde le passif et la relation de but du texte hébreu. Le pronom « le » reprend collectivement tout ce qui doit être montré, sans ajouter un objet pluriel absent de la proposition.
- source_word: הַגֵּד
  choice: Annonce
  rationale: L’impératif demande à Ézéchiel de faire connaître la vision; « annonce » convient au registre prophétique sans être artificiellement solennel.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: à la maison d’Israël
  rationale: Cette traduction préserve une formule prophétique caractéristique et son image collective.
- source_word: כָּל אֲשֶׁר אַתָּה רֹאֶה
  choice: tout ce que tu vois
  rationale: Rendu direct et naturel du résumé de l’ensemble de la vision à transmettre.
theological_decisions:
- issue: Sens de l’adresse récurrente בֶּן אָדָם dans Ézéchiel
  choice: Fils d’homme
  alternative: être humain; mortel
  rationale: Ici, l’expression s’adresse au prophète et met en relief sa condition humaine; elle n’est pas employée comme un titre christologique. La traduction traditionnelle conserve toutefois le motif littéraire récurrent, tandis que la note indique les rendus de sens possibles.
- issue: Agent implicite du passif « tu as été amené »
  choice: Maintenir le passif sans nommer l’agent
  alternative: Dieu t’a amené ici
  rationale: L’hébreu ne précise pas explicitement l’agent dans cette proposition; le conserver implicite évite d’ajouter une identification interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au discours direct singulier. Le parallélisme des yeux, des oreilles et du cœur est volontairement conservé, avec des tournures françaises naturelles.
