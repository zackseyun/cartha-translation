  text: וַ/יָּ֛מָד אֶת רֹ֥חַב פֶּֽתַח הַ/שַּׁ֖עַר עֶ֣שֶׂר אַמּ֑וֹת אֹ֣רֶךְ הַ/שַּׁ֔עַר שְׁל֥וֹשׁ עֶשְׂרֵ֖ה אַמּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/011.yaml
  text: 'Then he measured the width of the entrance of the gate: ten cubits[b][a], and the length of the gate: thirteen cubits.'
translation:
  language: fr
  text: 'Puis il mesura la largeur de l’ouverture de la porte[a] : dix coudées ; la longueur de la porte : treize coudées.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « portail », ici et dans la seconde occurrence du verset. Le mot hébreu peut désigner l’ensemble de la structure d’accès. Le texte dit littéralement « la longueur de la porte » ; « profondeur » interprète cette dimension.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: Puis il mesura
  rationale: Le wayyiqtol de מדד fait progresser la suite des mesures dans la vision. « Puis » exprime naturellement cette succession en français.
- source_word: רֹחַב
  choice: largeur
  rationale: Terme dimensionnel courant et précis pour l’étendue transversale.
- source_word: פֶּתַח
  choice: entrée
  rationale: Le mot désigne l’ouverture par laquelle on entre. « Entrée » convient naturellement à cette description architecturale.
- source_word: הַשַּׁעַר
  choice: la porte
  rationale: שַׁעַר peut désigner ici l’ensemble architectural de la porte, et non seulement son battant ou son ouverture. « Porte » reste la traduction directe, tandis qu’une note signale la portée possible de « portail ».
- source_word: עֶשֶׂר אַמּוֹת
  choice: dix coudées
  rationale: La mesure ancienne est conservée sans conversion afin de rester proche du texte source.
- source_word: אֹרֶךְ
  choice: longueur
  rationale: C’est le sens dimensionnel direct du terme. Des rendus tels que « profondeur » précisent l’orientation de manière interprétative.
- source_word: שְׁלֹשׁ עֶשְׂרֵה אַמּוֹת
  choice: treize coudées
  rationale: Rendu direct du nombre et de l’unité de mesure, conforme au style concis de l’hébreu.
