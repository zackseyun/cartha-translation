source:
  edition: WLC
  text: וַ/יָּ֜מָד אֶת אֻלָ֤ם הַ/שַּׁ֨עַר֙ שְׁמֹנֶ֣ה אַמּ֔וֹת ו/איל/ו שְׁתַּ֣יִם אַמּ֑וֹת וְ/אֻלָ֥ם הַ/שַּׁ֖עַר מֵ/הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/009.yaml
  text: 'Then he measured the portico of the gate: eight cubits[a], and its side pillars two cubits[b]; and the portico of the gate was toward the temple.'
translation:
  language: fr
  text: 'Puis il mesura le vestibule de la porte : huit coudées, et ses piliers latéraux[a] : deux coudées. Le vestibule de la porte était du côté du Temple[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses montants », « ses pilastres » ou « ses poteaux » ; le terme architectural hébreu est difficile à préciser.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « la maison » ; dans cette vision, ce mot désigne le bâtiment du Temple.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָד
  choice: Puis il mesura
  rationale: Le wayyiqtol poursuit la succession des actions dans la vision ; « Puis » rend naturellement cette progression narrative.
- source_word: אֻלָם
  choice: vestibule
  rationale: Le terme désigne l’espace couvert situé à l’entrée de la porte. « Vestibule » est courant, digne et adapté à cette description architecturale.
- source_word: הַשַּׁעַר
  choice: la porte
  rationale: Le mot désigne ici l’ensemble monumental de la porte ; la traduction directe maintient la terminologie du passage.
- source_word: שְׁמֹנֶה אַמּוֹת
  choice: huit coudées
  rationale: La mesure ancienne est conservée, comme il convient dans cette description détaillée du sanctuaire.
- source_word: וְאֵילוֹ
  choice: et ses piliers latéraux
  rationale: Dans ce contexte architectural, אֵיל désigne vraisemblablement des éléments verticaux ou saillants encadrant l’ouverture. L’équivalent précis demeure incertain, d’où la note.
- source_word: שְׁתַּיִם אַמּוֹת
  choice: deux coudées
  rationale: Traduction directe de la mesure appliquée aux éléments architecturaux précédents.
- source_word: מֵהַבָּיִת
  choice: était du côté du Temple
  rationale: La préposition indique ici l’orientation ou la position du vestibule par rapport à la maison, c’est-à-dire au bâtiment du Temple. Cette formulation préserve le rapport spatial sans le préciser au-delà de l’hébreu.
