  rationale: La révision explicite que les sacrifices étaient égorgés sur les tables, conformément à אֲלֵיהֶם, tout en conservant une tournure française fluide. La note a est précisée afin d’exprimer la nuance de purification sans ambiguïté théologique ou grammaticale.
