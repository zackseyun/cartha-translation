base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/039.yaml
  text: And in the portico of the gate were two tables on this side and two tables on that side[a], on which they slaughtered the burnt offering, the sin offering[b], and the guilt offering.
translation:
  language: fr
  text: Dans le vestibule de la porte, il y avait deux tables d’un côté et deux tables de l’autre, sur lesquelles on égorgeait l’holocauste, le sacrifice pour le péché[a] et le sacrifice de réparation[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le sacrifice de purification » : le terme hébreu peut désigner le sacrifice associé à la purification à l’égard du péché ou de l’impureté.'
    reason: lexical_alternative
  - marker: b
    text: Ou « le sacrifice de culpabilité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאֻלָם הַשַּׁעַר
  choice: Dans le vestibule de la porte
  rationale: אֻלָם désigne l’espace couvert situé à l’entrée d’un bâtiment. « Vestibule » convient naturellement à cette partie de la porte monumentale décrite dans la vision.
- source_word: שְׁנַיִם שֻׁלְחָנוֹת מִפּוֹ וּשְׁנַיִם שֻׁלְחָנוֹת מִפֹּה
  choice: deux tables d’un côté et deux tables de l’autre
  rationale: Cette formulation française rend clairement la disposition bilatérale indiquée par מִפּוֹ ... מִפֹּה, tout en conservant le caractère précis de la description architecturale.
- source_word: לִשְׁחֹט אֲלֵיהֶם
  choice: C’est là qu’on égorgeait
  rationale: שׁחט est le verbe rituel usuel pour l’égorgement des animaux sacrificiels. « C’est là » reprend naturellement la référence aux tables sans laisser entendre nécessairement que l’animal était posé sur leur surface pendant l’acte.
- source_word: הָעוֹלָה
  choice: l’holocauste
  rationale: « Holocauste » est le terme cultuel français consacré pour עוֹלָה, sacrifice entièrement consumé, et demeure largement intelligible dans un contexte biblique.
- source_word: הַחַטָּאת
  choice: le sacrifice pour le péché
  rationale: חַטָּאת désigne ici une catégorie sacrificielle liée au péché et à la purification. La formulation retenue est claire en français, tandis que l’autre nuance est conservée en note.
- source_word: הָאָשָׁם
  choice: le sacrifice de réparation
  rationale: Dans le système sacrificiel, אָשָׁם désigne une offrande liée à une faute qui appelle souvent réparation. « Sacrifice de réparation » exprime bien cette fonction sans réduire le terme au seul sentiment de culpabilité.
theological_decisions:
- issue: Rendre les catégories sacrificielles sans leur imposer une interprétation doctrinale ultérieure
  choice: l’holocauste, le sacrifice pour le péché et le sacrifice de réparation
  alternative: l’holocauste, le sacrifice de purification et le sacrifice de culpabilité
  rationale: Le texte énumère des catégories cultuelles reconnues. La traduction emploie des termes français clairs et établis, tout en signalant en notes les nuances légitimes de חַטָּאת et אָשָׁם.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement restructurée pour éviter une relative lourde et rendre naturellement la fonction pratique des tables. Les termes cultuels restent précis, avec leurs principales nuances lexicales indiquées en notes.
