  text: And there was a barrier of one cubit in front of the side rooms[a], and a barrier of one cubit on the other side[b]; and each side room was six cubits on this side and six cubits on that side.
translation:
  language: fr
  text: Devant les chambres[a], il y avait une bordure d’une coudée, et une bordure d’une coudée de l’autre côté[b]. Chaque chambre mesurait six coudées d’un côté et six coudées de l’autre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « postes de garde », « cellules » ou « alcôves » : le mot hébreu désigne ici de petites pièces aménagées dans la structure de la porte.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu répète des expressions spatiales signifiant littéralement « d’ici » ; elles indiquent les mesures de part et d’autre.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבוּל
  choice: bordure
  rationale: Dans ce contexte architectural, le terme désigne une limite matérielle ou une bande délimitant l’espace devant les chambres. « Bordure » reste concret sans imposer l’idée d’un mur ou d’une barrière verticale.
- source_word: לִפְנֵי
  choice: devant
  rationale: Le sens est spatial dans cette description architecturale.
- source_word: הַתָּאוֹת / הַתָּא
  choice: les chambres / chaque chambre
  rationale: Le mot désigne de petites pièces intégrées à la porte. « Chambres » est naturel et ne leur attribue pas une fonction militaire incertaine. Le singulier final est rendu distributivement par « chaque chambre » d’après le contexte pluriel.
- source_word: אַמָּה אֶחָת / שֵׁשׁ אַמּוֹת
  choice: une coudée / six coudées
  rationale: Les unités anciennes sont conservées, conformément au caractère métrologique de la vision.
- source_word: מִפֹּה ... מִפּוֹ
  choice: de l’autre côté / d’un côté ... de l’autre
  rationale: Cette formulation française naturelle conserve l’opposition spatiale exprimée par les déictiques hébreux répétés.
