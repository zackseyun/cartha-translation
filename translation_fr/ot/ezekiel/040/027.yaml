  text: וְ/שַׁ֛עַר לֶ/חָצֵ֥ר הַ/פְּנִימִ֖י דֶּ֣רֶךְ הַ/דָּר֑וֹם וַ/יָּ֨מָד מִ/שַּׁ֧עַר אֶל הַ/שַּׁ֛עַר דֶּ֥רֶךְ הַ/דָּר֖וֹם מֵאָ֥ה אַמּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/027.yaml
  text: 'And there was a gate to the inner court toward the south[a], and he measured from gate to gate toward the south: one hundred cubits.'
translation:
  language: fr
  text: 'Il y avait aussi une porte donnant sur la cour intérieure, du côté sud. Il mesura, de porte à porte, en direction du sud : cent coudées.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשַׁעַר
  choice: Il y avait aussi une porte
  rationale: La proposition hébraïque est sans verbe exprimé; « il y avait » donne une phrase française naturelle, tandis que « aussi » rend la continuité portée par וְ.
- source_word: לֶחָצֵר הַפְּנִימִי
  choice: donnant sur la cour intérieure
  rationale: Le לְ marque ici le rapport de la porte à la cour intérieure; cette formulation architecturale française exprime naturellement qu’elle y donne accès.
- source_word: דֶּרֶךְ הַדָּרוֹם
  choice: du côté sud
  rationale: Dans la première occurrence, l’expression situe la porte selon son orientation; « du côté sud » est idiomatique et conserve le sens spatial.
- source_word: וַיָּמָד
  choice: Il mesura
  rationale: Le sujet demeure le guide chargé des mesures dans le contexte; le verbe poursuit simplement le récit.
- source_word: מִשַּׁעַר אֶל הַשַּׁעַר
  choice: de porte à porte
  rationale: Cette tournure française rend directement la mesure prise entre les deux portes correspondantes.
- source_word: דֶּרֶךְ הַדָּרוֹם
  choice: en direction du sud
  rationale: Dans la seconde occurrence, l’expression précise l’axe de la mesure; la valeur directionnelle est donc rendue explicitement.
- source_word: מֵאָה אַמּוֹת
  choice: cent coudées
  rationale: La mesure ancienne est conservée sans conversion afin de rester transparente au texte source.
