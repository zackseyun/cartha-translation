  yaml_path: translation/ot/ezekiel/040/010.yaml
  text: And the guardrooms of the gate facing east were three on this side and three on that side[a]; the three of them had one measure[b], and the side pillars had one measure on this side and on that side.
translation:
  language: fr
  text: Les chambres de garde de la porte orientée vers l’est étaient au nombre de trois d’un côté et de trois de l’autre[a]. Les trois avaient la même mesure, et les piliers latéraux, d’un côté comme de l’autre, avaient la même mesure[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chambres latérales » ; le terme hébreu désigne de petites pièces intégrées à la structure de la porte.
    reason: lexical_alternative
  - marker: b
    text: Ou « jambages » ou « pilastres » au lieu de « piliers latéraux » ; le sens architectural précis du terme hébreu dans la vision du temple est discuté.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָאֵי
  choice: chambres de garde
  rationale: Le terme désigne de petites chambres intégrées à la porte monumentale. « Chambres de garde » exprime leur fonction probable dans ce contexte, sans perdre leur caractère architectural.
- source_word: הַשַּׁעַר
  choice: la porte
  rationale: Traduction courante et directe de שַׁעַר dans cette description architecturale.
- source_word: דֶּרֶךְ הַקָּדִים
  choice: orientée vers l’est
  rationale: Dans le contexte, l’expression indique l’orientation de la porte. Cette formulation est naturelle et ne précise pas indûment qu’elle se trouve nécessairement sur le côté est.
- source_word: שְׁלֹשָׁה מִפֹּה וּשְׁלֹשָׁה מִפֹּה
  choice: trois d’un côté et trois de l’autre
  rationale: Cette formulation rend clairement la disposition symétrique des chambres de part et d’autre du passage.
- source_word: מִדָּה אַחַת לִשְׁלָשְׁתָּם
  choice: Toutes les trois avaient les mêmes dimensions
  rationale: Le singulier collectif « une mesure » exprime ici l’uniformité dimensionnelle; le pluriel français convient à des espaces architecturaux sans déterminer si une seule mesure ou l’ensemble des dimensions est visé.
- source_word: אֵילִם
  choice: piliers latéraux
  rationale: Le mot désigne ici des éléments verticaux de la porte, mais son identification architecturale précise reste discutée. « Piliers latéraux » demeure compréhensible sans imposer un terme trop technique.
- source_word: וּמִדָּה אַחַת לָאֵילִם מִפֹּה וּמִפּוֹ
  choice: les piliers latéraux avaient aussi les mêmes dimensions des deux côtés
  rationale: La traduction conserve le parallélisme avec les chambres et la symétrie entre les deux côtés de la porte.
