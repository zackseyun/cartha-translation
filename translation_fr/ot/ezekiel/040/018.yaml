  text: וְ/הָ/רִֽצְפָה֙ אֶל כֶּ֣תֶף הַ/שְּׁעָרִ֔ים לְ/עֻמַּ֖ת אֹ֣רֶךְ הַ/שְּׁעָרִ֑ים הָ/רִֽצְפָ֖ה הַ/תַּחְתּוֹנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/018.yaml
  text: And the pavement was beside the side of the gates[a], corresponding to the length of the gates—the lower pavement.
translation:
  language: fr
  text: 'Le dallage était près des portes, correspondant à la longueur des portes[a] : c’était le dallage inférieur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en face de la longueur des portes » ; le mot hébreu peut exprimer une correspondance spatiale ou une position en face de quelque chose.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִצְפָה
  choice: le dallage
  rationale: רִצְפָה désigne une surface pavée. « Dallage » est naturel en français dans une description architecturale.
- source_word: אֶל כֶּתֶף
  choice: longeait le côté
  rationale: L’expression situe le dallage au flanc des portes. Cette formulation française exprime clairement l’adjacence et l’étendue spatiale sans conserver le littéralisme « vers l’épaule ».
- source_word: הַשְּׁעָרִים
  choice: les portes
  rationale: Le pluriel hébreu désigne les portes ou leurs ensembles architecturaux; « les portes » préserve le nombre et reste clair dans le contexte.
- source_word: לְעֻמַּת אֹרֶךְ
  choice: sur toute la longueur
  rationale: Dans ce relevé architectural, לְעֻמַּת exprime une correspondance ou un alignement avec la longueur des portes. La formulation retenue est naturelle, tout en signalant en note l'autre nuance spatiale possible.
- source_word: הָרִצְפָה הַתַּחְתּוֹנָה
  choice: le dallage inférieur
  rationale: תַּחְתּוֹנָה distingue ce dallage d'un niveau plus élevé. « Inférieur » convient au registre architectural et demeure concis.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et architectural. La phrase explicite naturellement la relation spatiale, tandis que la note préserve l’ambiguïté de לְעֻמַּת.
