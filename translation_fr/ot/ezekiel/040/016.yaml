base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/016.yaml
  text: And there were recessed windows toward the guardrooms and toward their side pillars[a], inward, all around the gate; and likewise for the porticos. And windows were all around on the inside[c][b], and on each pillar were palm-tree decorations.
translation:
  language: fr
  text: Des fenêtres à embrasure s’ouvraient vers les salles de garde et vers leurs piliers latéraux[a], à l’intérieur, tout autour de la porte ; de même pour les portiques[b]. Des fenêtres se trouvaient tout autour, à l’intérieur, et des motifs de palmiers ornaient chaque pilier[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les termes hébreux désignant ces éléments de la porte sont difficiles. On pourrait aussi traduire « leurs montants », « leurs jambages » ou « leurs pilastres ». L’expression « fenêtres à embrasure » peut également désigner des fenêtres « fermées », « étroites » ou dotées d’un encadrement en retrait.
    reason: lexical_alternative
  - marker: b
    text: Ou « vestibules » ou « porches ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « et vers chaque pilier, des palmiers » ; il s’agit vraisemblablement de motifs décoratifs.'
    reason: clarification
lexical_decisions:
- source_word: חַלֹּנוֹת אֲטֻמוֹת
  choice: fenêtres à embrasure
  rationale: L’expression semble désigner une forme architecturale particulière, probablement des fenêtres encastrées ou resserrées, plutôt que des ouvertures entièrement fermées. « À embrasure » reste naturel et rend l’idée architecturale sans trancher excessivement.
- source_word: הַתָּאִים
  choice: les salles de garde
  rationale: Dans la description des portes en Ézéchiel 40, ces pièces sont les chambres du corps de garde; cette formulation est claire en français moderne.
- source_word: אֵלֵיהֶמָה / אַיִל
  choice: leurs piliers latéraux / chaque pilier
  rationale: Le vocabulaire architectural est difficile et peut désigner des montants, des jambages ou des pilastres. « Piliers latéraux » explicite la position dans la première occurrence, tandis que « chaque pilier » rend naturellement le singulier distributif final.
- source_word: לִפְנִימָה
  choice: vers l’intérieur / à l’intérieur
  rationale: Les deux formulations françaises rendent l’orientation intérieure indiquée par l’adverbe, selon la syntaxe de chaque occurrence.
- source_word: סָבִיב סָבִיב
  choice: tout autour
  rationale: Cette expression idiomatique restitue la valeur intensive de la répétition hébraïque.
- source_word: אֵלַמּוֹת
  choice: les portiques
  rationale: Le mot désigne des structures d’entrée comparables à des porches ou vestibules; « portiques » convient au contexte architectural.
- source_word: תִּמֹרִים
  choice: orné de palmiers
  rationale: Dans ce contexte architectural, il s’agit de motifs décoratifs représentant des palmiers, non d’arbres plantés.
