source:
  edition: WLC
  text: וְ/הַ/לִּשְׁכָּ֗ה אֲשֶׁ֤ר פָּנֶ֨י/הָ֙ דֶּ֣רֶךְ הַ/צָּפ֔וֹן לַ/כֹּ֣הֲנִ֔ים שֹׁמְרֵ֖י מִשְׁמֶ֣רֶת הַ/מִּזְבֵּ֑חַ הֵ֣מָּה בְנֵֽי צָד֗וֹק הַ/קְּרֵבִ֧ים מִ/בְּנֵֽי לֵוִ֛י אֶל יְהוָ֖ה לְ/שָׁרְתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/046.yaml
  text: And the chamber whose front faces north is for the priests who keep charge of the altar. They are the sons of Zadok[a], who from among the sons of Levi come near to Yahweh to minister to him.
translation:
  language: fr
  text: La salle dont la façade est orientée vers le nord est destinée aux prêtres chargés du service de l’autel. Ce sont les fils de Tsadok qui, parmi les fils de Lévi, s’approchent de Yahweh pour le servir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַלִּשְׁכָּה
  choice: la salle
  rationale: Dans la vision du temple, לִשְׁכָּה désigne une pièce affectée à un usage précis. « Salle » est naturel en français moderne et convient au contexte architectural.
- source_word: פָּנֶיהָ דֶּרֶךְ הַצָּפוֹן
  choice: dont la façade est orientée vers le nord
  rationale: פָּנִים désigne ici la face ou le devant du bâtiment. « Façade » explicite naturellement cette orientation architecturale sans en modifier le sens.
- source_word: לַכֹּהֲנִים
  choice: est destinée aux prêtres
  rationale: Le lamed indique l’affectation de la salle. Le verbe « est destinée » supplée naturellement la copule absente en hébreu.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת הַמִּזְבֵּחַ
  choice: chargés du service de l’autel
  rationale: L’expression idiomatique שׁמר משׁמרת évoque la responsabilité de remplir une fonction prescrite, et pas seulement la garde physique. Cette formulation conserve la nuance cultuelle.
- source_word: בְנֵי צָדוֹק
  choice: les fils de Tsadok
  rationale: La formulation généalogique littérale préserve l’accent du texte sur la lignée sacerdotale. « Tsadok » correspond à une translittération française usuelle.
- source_word: הַקְּרֵבִים
  choice: qui… s’approchent
  rationale: Dans un contexte sacerdotal, קרב désigne le fait de s’approcher de Dieu pour accomplir le service sacré. « S’approchent » conserve cette nuance cultuelle.
- source_word: מִבְּנֵי לֵוִי
  choice: parmi les fils de Lévi
  rationale: 'La préposition מִן a ici une valeur partitive : les fils de Tsadok constituent un groupe au sein des fils de Lévi. La formulation garde aussi l’expression familiale du texte.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לְשָׁרְתוֹ
  choice: pour le servir
  rationale: שׁרת désigne ici le service sacerdotal rendu à Yahweh. « Servir » est clair, digne et suffisamment ouvert pour conserver la portée cultuelle du contexte.
theological_decisions:
- issue: Privilège sacerdotal des fils de Tsadok au sein de la tribu de Lévi
  choice: Le verset présente les fils de Tsadok comme le groupe issu des fils de Lévi qui s’approche de Yahweh pour assurer ce service.
  alternative: Comprendre la phrase comme une référence indistincte à tous les Lévites.
  rationale: La construction hébraïque identifie explicitement les prêtres concernés comme « les fils de Tsadok » et emploie מִן dans « parmi les fils de Lévi ». La traduction maintient cette distinction sans lui ajouter de développement doctrinal.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire architectural reste concret, tandis que « service de l’autel » et « s’approchent de Yahweh » préservent la tonalité sacerdotale du passage.
