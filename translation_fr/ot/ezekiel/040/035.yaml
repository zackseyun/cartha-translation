  yaml_path: translation/ot/ezekiel/040/035.yaml
  text: Then he brought me to the north gate and measured it according to these measurements[a].
translation:
  language: fr
  text: Puis il me conduisit à la porte nord et la mesura selon ces mesures[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et la mesura selon ces mêmes dimensions » ; l’expression renvoie vraisemblablement aux mesures décrites précédemment.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: Puis il me conduisit
  rationale: Le waw consécutif fait progresser le récit. Le hiphil de בוא signifie ici « faire venir, conduire » ; « conduisit » convient naturellement au déplacement guidé dans la vision.
- source_word: אֶל שַׁעַר הַצָּפוֹן
  choice: à la porte nord
  rationale: אֶל indique le mouvement vers un lieu, et la chaîne construite désigne la porte située au nord. « Porte nord » est clair et idiomatique dans une description architecturale.
- source_word: וּמָדַד
  choice: et la mesura
  rationale: Le sujet masculin singulier reste le même. Le complément féminin « la » reprend explicitement « la porte », sous-entendue dans l’hébreu, pour produire une phrase française naturelle.
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: selon les mêmes dimensions
  rationale: Le préfixe כ exprime ici la conformité. Le démonstratif renvoie aux dimensions déjà données ; « les mêmes dimensions » rend ce lien contextuel plus naturellement que le calque « ces dimensions ».
