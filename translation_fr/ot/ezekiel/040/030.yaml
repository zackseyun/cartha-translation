lexical_decisions:
- source_word: אֵלַמּוֹת
  choice: vestibules
  rationale: Dans ce contexte d’architecture du temple, le terme désigne des structures d’entrée comparables à des vestibules ou à des portiques. « Vestibules » est précis, naturel et cohérent avec l’ensemble des portes décrit.
- source_word: סָבִיב סָבִיב
  choice: tout autour, tout autour
  rationale: La répétition hébraïque est conservée afin d’en rendre l’insistance et la portée distributive.
- source_word: אֹרֶךְ
  choice: de long
  rationale: La tournure adjectivale convient naturellement en français avec une mesure, sans perdre la notion de longueur.
- source_word: חָמֵשׁ וְעֶשְׂרִים אַמָּה
  choice: vingt-cinq coudées
  rationale: L’ordre moderne du nombre est employé et l’unité ancienne traditionnelle est conservée.
- source_word: רֹחַב
  choice: de large
  rationale: La tournure adjectivale forme un parallèle naturel avec « de long ».
- source_word: חָמֵשׁ אַמּוֹת
  choice: cinq coudées
  rationale: Traduction directe de la mesure de largeur, avec l’unité ancienne conservée.
