  text: 'And vestibules all around[a], all around: twenty-five cubits long and five cubits wide.'
translation:
  language: fr
  text: 'Des vestibules se trouvaient tout autour[a], tout autour : ils avaient vingt-cinq coudées de long et cinq coudées de large.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « portiques »; le terme désigne ici un élément architectural situé à l’entrée.
