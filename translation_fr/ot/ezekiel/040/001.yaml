  text: בְּ/עֶשְׂרִ֣ים וְ/חָמֵ֣שׁ שָׁנָ֣ה לְ֠/גָלוּתֵ/נוּ בְּ/רֹ֨אשׁ הַ/שָּׁנָ֜ה בֶּ/עָשׂ֣וֹר לַ/חֹ֗דֶשׁ בְּ/אַרְבַּ֤ע עֶשְׂרֵה֙ שָׁנָ֔ה אַחַ֕ר אֲשֶׁ֥ר הֻכְּתָ֖ה הָ/עִ֑יר בְּ/עֶ֣צֶם הַ/יּ֣וֹם הַ/זֶּ֗ה הָיְתָ֤ה עָלַ/י֙ יַד יְהוָ֔ה וַ/יָּבֵ֥א אֹתִ֖/י שָֽׁמָּ/ה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/001.yaml
  text: In the twenty-fifth year of our exile[a], at the beginning of the year, on the tenth day of the month, in the fourteenth year after the city had been struck down, on that very day the hand of Yahweh was upon me[b], and he brought me there.
translation:
  language: fr
  text: Dans la vingt-cinquième année de notre exil, au commencement de l’année[a], le dixième jour du mois, la quatorzième année après que la ville eut été frappée[b], ce jour-là même, la main de Yahweh fut sur moi, et il m’amena là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à la tête de l’année ». L’expression peut désigner le début de l’année ou, éventuellement, une célébration du Nouvel An.'
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire : « après que la ville eut été prise » ou « après la chute de la ville ». L’hébreu dit plus littéralement qu’elle avait été « frappée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְגָלוּתֵנוּ
  choice: de notre exil
  rationale: גָּלוּת désigne l’exil ou la déportation. « Notre exil » restitue naturellement le suffixe communautaire de première personne sans suggérer un simple emprisonnement.
- source_word: בְּרֹאשׁ הַשָּׁנָה
  choice: au commencement de l’année
  rationale: L’expression signifie littéralement « à la tête de l’année ». Cette formulation française reste proche de l’hébreu sans trancher en faveur d’une fête précise du Nouvel An.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: le dixième jour du mois
  rationale: La tournure explicite clairement la date indiquée par l’hébreu.
- source_word: הֻכְּתָה
  choice: eut été abattue
  rationale: Le passif de נכה exprime l’idée de frapper. Appliqué à une ville, « abattue » conserve la violence de l’image tout en restant idiomatique en français.
- source_word: הָעִיר
  choice: la ville
  rationale: L’hébreu ne nomme pas Jérusalem dans ce verset; la traduction conserve donc la référence non explicitée.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ce jour-là même
  rationale: Cette expression rend l’insistance de עֶצֶם sur l’identité exacte du jour.
- source_word: יַד יְהוָה
  choice: la main de Yahweh
  rationale: L’image prophétique récurrente est conservée plutôt que paraphrasée par « puissance », afin de préserver sa portée littéraire et théologique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de représenter directement le tétragramme hébreu.
- source_word: וַיָּבֵא אֹתִי שָׁמָּה
  choice: et il m’amena là-bas
  rationale: Le sujet implicite renvoie à Yahweh, et « là-bas » rend שָׁמָּה sans préciser davantage la destination.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le tétragramme; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Expression prophétique יַד יְהוָה
  choice: la main de Yahweh fut sur moi
  alternative: la puissance de Yahweh s’empara de moi
  rationale: La traduction formelle garde l’image propre à Ézéchiel et n’explicite pas de manière univoque si elle désigne puissance, contrainte ou inspiration prophétique.
translation_notes:
  register: Français international moderne, digne et accessible. La longue structure chronologique de l’hébreu est conservée, avec une ponctuation qui en facilite la lecture. Le passé simple convient au registre narratif biblique sans archaïsme excessif.
