  text: וַ/יְדַבֵּ֖ר אֵלָ֑/י זֹ֣ה הַ/לִּשְׁכָּ֗ה אֲשֶׁ֤ר פָּנֶ֨י/הָ֙ דֶּ֣רֶךְ הַ/דָּר֔וֹם לַ/כֹּ֣הֲנִ֔ים שֹׁמְרֵ֖י מִשְׁמֶ֥רֶת הַ/בָּֽיִת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/045.yaml
  text: 'Then he spoke to me: “This chamber[a], whose front faces south, is for the priests who keep charge of the temple.”'
translation:
  language: fr
  text: 'Puis il me dit : « Cette salle, dont la façade est tournée vers le sud, est destinée aux prêtres chargés du service du Temple[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la maison ». Dans cette vision, ce terme hébreu désigne le Temple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אֵלָי
  choice: Puis il me dit
  rationale: Le wayyiqtol fait progresser le récit et introduit ici des paroles directes. « Puis il me dit » est naturel en français et convient mieux que le littéral « il me parla » dans cette construction.
- source_word: זֹה הַלִּשְׁכָּה
  choice: Cette salle
  rationale: Dans ce contexte architectural, לִשְׁכָּה désigne une pièce du complexe du Temple. « Salle » est clair, courant et digne en français moderne.
- source_word: אֲשֶׁר פָּנֶיהָ דֶּרֶךְ הַדָּרוֹם
  choice: dont la façade est tournée vers le sud
  rationale: Le pluriel morphologique פָּנִים avec suffixe désigne ici la face avant du bâtiment. « Façade » conserve concrètement l'orientation architecturale.
- source_word: לַכֹּהֲנִים
  choice: est destinée aux prêtres
  rationale: La préposition ל indique l'affectation ou la destination de la salle, sans nécessairement exprimer la propriété.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: chargés du service
  rationale: La construction associant le participe שׁמר au nom apparenté מִשְׁמֶרֶת évoque l'accomplissement fidèle d'une fonction assignée. « Chargés du service » exprime naturellement ce sens cultuel sans suggérer une simple garde militaire.
- source_word: הַבָּיִת
  choice: du Temple
  rationale: Dans la vision architecturale d'Ézéchiel, « la maison » désigne le Temple. La majuscule identifie clairement cet édifice cultuel précis en français.
theological_decisions:
- issue: Référent de הַבָּיִת dans la vision du Temple
  choice: le Temple
  alternative: la maison
  rationale: Le contexte architectural et cultuel identifie la « maison » comme le Temple. La traduction explicite le référent sans ajouter de précision doctrinale; la forme littérale est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire architectural reste concret; « service » rend la fonction sacerdotale sans lourdeur technique. La formulation conserve l'enchaînement narratif et l'affectation de la salle.
