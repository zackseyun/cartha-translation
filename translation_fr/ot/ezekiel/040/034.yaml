  text: ו/אלמ/ו לֶֽ/חָצֵר֙ הַ/חִ֣יצוֹנָ֔ה וְ/תִמֹרִ֥ים אֶל אל/ו מִ/פּ֣וֹ וּ/מִ/פּ֑וֹ וּ/שְׁמֹנֶ֥ה מַעֲל֖וֹת מעל/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/034.yaml
  text: Its portico faced the outer court[a], and palm trees were on its jambs, on this side and on that side[b]; and eight steps went up to it.
translation:
  language: fr
  text: Son vestibule donnait sur la cour extérieure. Il y avait des palmiers[a] sur ses montants[b], de part et d’autre, et on y montait par huit marches.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « des motifs de palmiers » : le mot hébreu signifie littéralement « palmiers », mais il désigne probablement ici des décorations sculptées.'
    reason: lexical_alternative
  - marker: b
    text: Ou « piliers latéraux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלַמּוֹ
  choice: Son vestibule
  rationale: Dans la description architecturale des portes, אֵלָם désigne l’espace couvert en saillie, c’est-à-dire le vestibule ou portique. « Vestibule » est naturel et précis en français.
- source_word: לֶחָצֵר הַחִיצוֹנָה
  choice: donnait sur la cour extérieure
  rationale: La préposition ל exprime ici l’orientation du vestibule. « Donnait sur » rend naturellement cette relation spatiale.
- source_word: וְתִמֹרִים
  choice: des palmiers
  rationale: תִמֹרִים signifie littéralement « palmiers ». Dans ce contexte, il s’agit vraisemblablement de motifs sculptés, mais cette précision implicite est laissée en note afin de préserver la formulation hébraïque.
- source_word: אֶל־אֵלָיו
  choice: sur ses montants
  rationale: Dans cette description récurrente des portes, אֵילָיו désigne les éléments verticaux latéraux de la construction. « Montants » convient au contexte architectural sans imposer la forme plus précise de colonnes.
- source_word: מִפֹּה וּמִפֹּה
  choice: de part et d’autre
  rationale: Cette expression idiomatique indique une disposition symétrique sur les deux côtés.
- source_word: וּשְׁמֹנֶה מַעֲלוֹת מַעֲלָו
  choice: et on y montait par huit marches
  rationale: Le texte associe huit marches à l’accès montant vers le vestibule. Cette formulation restitue clairement et naturellement leur fonction.
