  text: Its guardrooms[a], its side pillars, and its portico, with windows all around[b], had a length of fifty cubits and a width of twenty-five cubits.
translation:
  language: fr
  text: Ses salles de garde, ses piliers latéraux[a] et son portique[b] avaient des fenêtres tout autour ; la porte mesurait cinquante coudées de long et vingt-cinq de large.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses montants » ou « ses pilastres ». Le terme hébreu relève d’un vocabulaire architectural assez technique.
    reason: lexical_alternative
  - marker: b
    text: Ou « son vestibule » ou « son porche ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תא/ו
  choice: ses salles de garde
  rationale: Dans la description des portes chez Ézéchiel, תָּא désigne les petites pièces intégrées à la porte, vraisemblablement destinées aux gardes. « Salles de garde » est naturel et précis dans ce contexte architectural.
- source_word: אל/ו
  choice: ses piliers latéraux
  rationale: Ce terme architectural désigne les éléments verticaux situés sur les côtés du passage. « Piliers latéraux » reste accessible, tandis que « montants » ou « pilastres » sont également possibles.
- source_word: אלמ/ו
  choice: son portique
  rationale: Le terme désigne une structure d’entrée couverte dans l’architecture du temple. « Portique » convient au registre architectural et demeure compréhensible en français moderne.
- source_word: וְ/חַלּוֹנ֥וֹת ל֖/וֹ סָבִ֣יב סָבִ֑יב
  choice: avec des fenêtres tout autour
  rationale: La tournure française exprime naturellement la présence de fenêtres sur tout le pourtour; « tout autour » restitue la valeur distributive de la répétition de סָבִיב.
- source_word: אֹ֚רֶךְ חֲמִשִּׁ֣ים אַמָּ֔ה
  choice: avaient une longueur de cinquante coudées
  rationale: Cette formulation conserve l’unité ancienne et rend explicitement la formule nominale de mesure de l’hébreu.
- source_word: וְ/רֹ֕חַב חָמֵ֥שׁ וְ/עֶשְׂרִ֖ים אַמָּֽה
  choice: et une largeur de vingt-cinq coudées
  rationale: « Largeur » est le terme moderne le plus clair, et la conservation des coudées évite une conversion approximative.
