translation_notes:
  register: Français international moderne, clair et digne. La formulation reste architecturale et conserve l’unité ancienne. Le singulier hébreu suivi des deux directions est rendu de manière à faire ressortir la correspondance avec les portes du nord et de l’est, sans gommer l’alternative de formulation signalée en note.
