  yaml_path: translation/ot/ezekiel/040/023.yaml
  text: And a gate to the inner court was opposite the gate on the north and on the east[a]; and he measured from gate to gate one hundred cubits.
translation:
  language: fr
  text: 'Une porte de la cour intérieure faisait face aux portes du nord et de l’est. Il mesura d’une porte à l’autre : cent coudées.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁעַר
  choice: porte
  rationale: Dans cette description architecturale, le nom désigne une porte monumentale ou son passage; « porte » est naturel et suffisamment précis en français.
- source_word: לֶחָצֵר הַפְּנִימִי
  choice: donnant sur la cour intérieure
  rationale: Le ל indique ici le rapport de la porte à la cour intérieure. « Donnant sur » exprime naturellement cette relation architecturale sans suggérer que la porte elle-même constitue la cour.
- source_word: נֶגֶד
  choice: en face de
  rationale: Le terme exprime une correspondance spatiale, face à face. « En face de » conserve ce sens sans imposer une nuance technique supplémentaire.
- source_word: לַצָּפוֹן וְלַקָּדִים
  choice: située au nord, comme de celle située à l’est
  rationale: Les expressions directionnelles désignent les emplacements des portes correspondantes. La formulation française explicite l’ellipse hébraïque et rend clair qu’une porte intérieure correspond à chacune des deux portes mentionnées.
- source_word: וַיָּמָד
  choice: Puis il mesura
  rationale: Le verbe poursuit la séquence narrative; « Puis » rend cette progression avec naturel en français.
- source_word: מִשַּׁעַר אֶל שַׁעַר
  choice: d’une porte à l’autre
  rationale: Cette tournure idiomatique française rend fidèlement la mesure prise entre les portes.
- source_word: מֵאָה אַמָּה
  choice: cent coudées
  rationale: La coudée est l’unité ancienne du texte; elle est conservée plutôt que convertie afin de respecter le système de mesure de la vision.
