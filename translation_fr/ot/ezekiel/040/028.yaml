  text: וַ/יְבִיאֵ֛/נִי אֶל חָצֵ֥ר הַ/פְּנִימִ֖י בְּ/שַׁ֣עַר הַ/דָּר֑וֹם וַ/יָּ֨מָד֙ אֶת הַ/שַּׁ֣עַר הַ/דָּר֔וֹם כַּ/מִּדּ֖וֹת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/028.yaml
  text: Then he brought me into the inner court by way of the south gate[b][a], and he measured the south gate according to these measurements.
translation:
  language: fr
  text: Puis il me fit entrer dans la cour intérieure par la porte sud[a], et il mesura la porte sud selon ces mesures[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en passant par la porte sud ». La préposition hébraïque peut indiquer le passage servant à entrer.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire selon les mesures décrites précédemment pour les portes.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: Puis il me fit entrer
  rationale: Le hiphil de בוא signifie « faire entrer, amener ». « Puis » rend naturellement la progression narrative du wayyiqtol.
- source_word: חָצֵר הַפְּנִימִי
  choice: la cour intérieure
  rationale: Expression architecturale naturelle et usuelle pour désigner la cour située à l’intérieur du complexe.
- source_word: בְּשַׁעַר הַדָּרוֹם
  choice: par la porte sud
  rationale: La préposition בְּ indique ici vraisemblablement le passage ou le moyen d’accès. « Par » garde cette valeur sans la préciser excessivement.
- source_word: וַיָּמָד אֶת הַשַּׁעַר הַדָּרוֹם
  choice: et il mesura la porte sud
  rationale: Le qal de מדד signifie directement « mesurer » ; la répétition de « porte sud » respecte celle de l’hébreu.
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: elle avait les mêmes dimensions que les précédentes
  rationale: La préposition כְּ exprime la correspondance avec les dimensions déjà données. Cette formulation française explicite naturellement le rapport contextuel sans changer le sens.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Cour intérieure » et « porte sud » conservent le vocabulaire architectural du passage. La seconde proposition est légèrement restructurée pour exprimer naturellement en français la comparaison elliptique de l’hébreu.
