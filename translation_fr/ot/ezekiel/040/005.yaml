  source_fidelity: Le sens architectural et les mesures sont correctement rendus. « Bâtiment » traduit plus directement בִּנְיָן que « ouvrage » dans ce contexte, sans trancher davantage la question de savoir si la mesure indique l’épaisseur du mur.
  naturalness: « Il y avait » et « bâtiment » sont plus idiomatiques et plus transparents en français moderne que « se trouvait » et « ouvrage ». La minuscule à « maison » évite d’ajouter une convention interprétative de capitalisation absente de l’hébreu.
  terminology: « Roseau à mesurer » rend explicitement l’instrument de roseau (קָנֶה) et reste usuel dans une description biblique. Les termes techniques « coudée » et « palme » sont conservés, avec une note explicative.
