  text: וְ/הִנֵּ֥ה חוֹמָ֛ה מִ/ח֥וּץ לַ/בַּ֖יִת סָבִ֣יב סָבִ֑יב וּ/בְ/יַ֨ד הָ/אִ֜ישׁ קְנֵ֣ה הַ/מִּדָּ֗ה שֵׁשׁ אַמּ֤וֹת בָּֽ/אַמָּה֙ וָ/טֹ֔פַח וַ/יָּ֜מָד אֶת רֹ֤חַב הַ/בִּנְיָן֙ קָנֶ֣ה אֶחָ֔ד וְ/קוֹמָ֖ה קָנֶ֥ה אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/005.yaml
  text: 'And behold[a], there was a wall outside the house, all around, and in the hand of the man was a measuring reed of six cubits, each cubit being a cubit and a handbreadth. And he measured the width of the structure: one reed[b], and the height: one reed.'
translation:
  language: fr
  text: 'Et voici : il y avait un mur à l’extérieur de la maison, tout autour. L’homme tenait à la main un roseau à mesurer, long de six coudées, chaque coudée correspondant à une coudée ordinaire plus un palme[a]. Il mesura la largeur du bâtiment[b] : une canne, et sa hauteur : une canne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « six coudées, selon la coudée et un palme » ; il s’agit d’une grande coudée, égale à une coudée ordinaire plus un palme.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « de la construction ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: Conserve la force déictique de la vision et attire l’attention sur un nouvel élément, dans un français biblique encore naturel.
- source_word: חוֹמָה
  choice: un mur
  rationale: Équivalent architectural courant, sans préciser indûment qu’il s’agit d’une fortification.
- source_word: מִחוּץ לַבַּיִת
  choice: à l’extérieur de la Maison
  rationale: Rend littéralement « à l’extérieur de la maison »; la majuscule signale ici le sanctuaire décrit dans la vision sans remplacer le terme hébreu par « Temple ».
- source_word: סָבִיב סָבִיב
  choice: tout autour
  rationale: Exprime idiomatiquement l’insistance produite par la répétition hébraïque.
- source_word: וּבְיַד הָאִישׁ
  choice: L’homme tenait à la main
  rationale: Transformation syntaxique naturelle en français qui conserve l’image concrète de l’objet dans la main de l’homme.
- source_word: קְנֵה הַמִּדָּה
  choice: une canne à mesurer
  rationale: קָנֶה désigne ici une canne ou un roseau employé comme instrument de mesure; « canne à mesurer » est précis et compréhensible.
- source_word: שֵׁשׁ אַמּוֹת בָּאַמָּה וָטֹפַח
  choice: longue de six coudées, chaque coudée correspondant à une coudée ordinaire plus un palme
  rationale: Explicite naturellement que la canne compte six grandes coudées, chacune étant formée d’une coudée usuelle augmentée d’un palme, sans convertir l’unité antique.
- source_word: רֹחַב הַבִּנְיָן
  choice: la largeur de l’ouvrage
  rationale: « Ouvrage » rend בִּנְיָן comme chose construite tout en évitant de l’identifier sans certitude à un bâtiment distinct; « largeur » préserve le sens spatial sans imposer l’interprétation « épaisseur du mur ».
- source_word: קָנֶה אֶחָד
  choice: une canne
  rationale: Maintient comme unité le même instrument de six grandes coudées qui vient d’être présenté.
- source_word: וְקוֹמָה
  choice: et sa hauteur
  rationale: Rend directement la dimension verticale et rattache naturellement celle-ci à l’ouvrage mesuré.
