  to: 'Et voici : il y avait un mur à l’extérieur de la maison, tout autour. L’homme tenait à la main un roseau à mesurer, long de six coudées, chaque coudée correspondant à une coudée ordinaire plus un palme[a]. Il mesura la largeur du bâtiment[b] : une canne, et sa hauteur : une canne.'
  rationale: La révision améliore la précision lexicale et la lisibilité sans modifier le sens. Elle conserve l’ambiguïté architecturale du texte, les unités anciennes et l’explication de la grande coudée, tout en supprimant une note interprétative non indispensable.
