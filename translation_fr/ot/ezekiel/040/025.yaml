base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/025.yaml
  text: And it had windows all around[a], and its porch also had windows all around, like these windows. The length was fifty cubits, and the width twenty-five cubits.
translation:
  language: fr
  text: Il avait des fenêtres tout autour, et ses vestibules avaient eux aussi des fenêtres tout autour, semblables à celles-ci. Il mesurait cinquante coudées de long et vingt-cinq coudées de large.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַלּוֹנִים
  choice: fenêtres
  rationale: Le nom désigne ici les fenêtres ou ouvertures de la porte; « fenêtres » est le terme architectural français le plus naturel dans ce contexte.
- source_word: לוֹ
  choice: Il avait
  rationale: La construction hébraïque exprime idiomatiquement la possession; le pronom renvoie à l’édifice de la porte décrit dans le contexte.
- source_word: וְלְאֵילָמָו
  choice: et son vestibule avait lui aussi
  rationale: אֵילָם désigne l’espace architectural attenant à la porte. « Vestibule » convient à la vision du temple et la présence des fenêtres est reprise du premier membre de la phrase.
- source_word: סָבִיב סָבִיב
  choice: tout autour
  rationale: La répétition hébraïque souligne que les fenêtres se trouvent sur l’ensemble du pourtour; « tout autour » en restitue naturellement la force.
- source_word: כְּהַחֲלֹּנוֹת הָאֵלֶּה
  choice: semblables à ces fenêtres
  rationale: Cette formulation conserve la comparaison et la valeur démonstrative de הָאֵלֶּה, qui renvoie aux fenêtres déjà décrites.
- source_word: חֲמִשִּׁים אַמָּה אֹרֶךְ
  choice: cinquante coudées de long
  rationale: Rendu français naturel de la formule hébraïque de mesure architecturale.
- source_word: וְרֹחַב חָמֵשׁ וְעֶשְׂרִים אַמָּה
  choice: vingt-cinq coudées de large
  rationale: Rendu direct et idiomatique de la largeur donnée en hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation reste proche de la description architecturale hébraïque, tout en évitant une syntaxe artificiellement littérale. « Vestibule » est retenu sans note, car il s’agit d’un terme courant et précis dans ce contexte.
