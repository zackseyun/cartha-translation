  yaml_path: translation/ot/ezekiel/040/020.yaml
  text: As for the gate whose front faced north toward the outer court[a], he measured its length and its width.
translation:
  language: fr
  text: Quant à la porte de la cour extérieure[a] qui était orientée vers le nord, il en mesura la longueur et la largeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la porte qui était orientée vers le nord, en direction de la cour extérieure ». Le rapport précis exprimé par la préposition hébraïque peut indiquer le rattachement de la porte à la cour extérieure ou une relation d’orientation spatiale.'
    reason: ambiguïté_spatiale
lexical_decisions:
- source_word: וְהַשַּׁעַר
  choice: Quant à la porte
  rationale: La conjonction et le nom défini introduisent l’élément architectural suivant. Cette formulation marque naturellement la reprise descriptive en français.
- source_word: אֲשֶׁר פָּנָיו דֶּרֶךְ הַצָּפוֹן
  choice: dont la façade était orientée vers le nord
  rationale: פָּנִים désigne littéralement la face ou l’avant; dans ce contexte architectural, « façade » est naturel tout en conservant l’idée d’orientation exprimée par דֶּרֶךְ.
- source_word: לֶחָצֵר הַחִיצוֹנָה
  choice: du côté de la cour extérieure
  rationale: Le ל préfixé exprime ici le rapport spatial de la porte avec la cour extérieure. « Du côté de » préserve ce rapport sans imposer plus précisément l’appartenance ou la direction.
- source_word: מָדַד
  choice: il en mesura
  rationale: Le sujet est l’homme chargé des mesures dans le contexte précédent; « en » rattache naturellement les dimensions à la porte.
- source_word: אָרְכּוֹ וְרָחְבּוֹ
  choice: la longueur et la largeur
  rationale: Ce sont les termes architecturaux français courants correspondant aux deux dimensions de la porte; les suffixes possessifs sont rendus par « en » devant le verbe.
theological_decisions: []
