source:
  edition: WLC
  text: וַ/יְבִאֵ/נִי֮ אֶל אֻלָ֣ם הַ/בַּיִת֒ וַ/יָּ֨מָד֙ אֵ֣ל אֻלָ֔ם חָמֵ֤שׁ אַמּוֹת֙ מִ/פֹּ֔ה וְ/חָמֵ֥שׁ אַמּ֖וֹת מִ/פֹּ֑ה וְ/רֹ֣חַב הַ/שַּׁ֔עַר שָׁלֹ֤שׁ אַמּוֹת֙ מִ/פּ֔וֹ וְ/שָׁלֹ֥שׁ אַמּ֖וֹת מִ/פּֽוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/048.yaml
  text: 'Then he brought me to the vestibule of the house[a], and he measured the jambs of the vestibule: five cubits on this side and five cubits on that side[c][b]; and the width of the gate was three cubits on this side and three cubits on that side.'
translation:
  language: fr
  text: 'Puis il me conduisit au vestibule de la Maison[a] et mesura les montants du vestibule[b] : cinq coudées d’un côté et cinq coudées de l’autre. La largeur de l’entrée était de trois coudées d’un côté et de trois coudées de l’autre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « la maison »; dans cette vision, il s’agit du bâtiment du temple.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu rendu par « montants » est un mot architectural qui peut aussi désigner des poteaux ou des piliers latéraux.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֻלָם
  choice: vestibule
  rationale: Dans l’architecture du temple, le terme désigne l’espace couvert précédant le bâtiment principal. « Vestibule » est précis, naturel et digne en français moderne.
- source_word: הַבַּיִת
  choice: la Maison
  rationale: L’hébreu dit littéralement « la maison ». La majuscule contextuelle signale qu’il s’agit du bâtiment du temple sans remplacer l’image hébraïque par une explicitation.
- source_word: אֵל אֻלָם
  choice: les montants du vestibule
  rationale: אֵל est ici un terme architectural désignant les structures latérales de l’entrée. « Montants » convient aux deux éléments mesurés de part et d’autre et évite de confondre ce mot avec le nom divin.
- source_word: חָמֵשׁ אַמּוֹת ... מִפֹּה וְחָמֵשׁ אַמּוֹת מִפֹּה
  choice: cinq coudées d’un côté et cinq coudées de l’autre
  rationale: Cette formulation française rend clairement la symétrie spatiale exprimée par les deux déictiques hébreux.
- source_word: רֹחַב הַשַּׁעַר
  choice: la largeur de l’entrée
  rationale: שַׁעַר peut désigner une porte ou un passage d’entrée. Ici, la mesure porte vraisemblablement sur l’ouverture; « entrée » est plus naturel que « portail » à l’intérieur du bâtiment.
- source_word: שָׁלֹשׁ אַמּוֹת מִפּוֹ וְשָׁלֹשׁ אַמּוֹת מִפּוֹ
  choice: trois coudées d’un côté et trois coudées de l’autre
  rationale: Le parallélisme bilatéral de l’hébreu est conservé dans une expression française idiomatique.
- source_word: וַיְבִאֵנִי ... וַיָּמָד
  choice: Puis il me conduisit ... et mesura
  rationale: « Puis » marque la progression du récit visionnaire, tandis que les passés simples conviennent au registre narratif biblique moderne et soutenu.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la progression et les mesures symétriques de l’hébreu. « Maison » maintient l’expression source, avec une note explicative; « entrée » privilégie la fonction architecturale dans ce contexte.
