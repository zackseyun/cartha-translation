base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/049.yaml
  text: The length of the vestibule was twenty cubits, and the width was twelve cubits, and by the steps by which one went up to it; and pillars were beside the sidewalls, one on this side and one on that side.
translation:
  language: fr
  text: Le vestibule avait vingt coudées de long et onze coudées de large.[a] On y montait par des marches. Il y avait des colonnes près des piliers latéraux, une de chaque côté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '« onze coudées » : lecture du texte hébreu massorétique. Plusieurs manuscrits hébreux et des versions anciennes portent « douze coudées ».'
    reason: La largeur présente une variante textuelle significative. La traduction suit le WLC tout en signalant l’autre lecture attestée.
lexical_decisions:
- source_word: הָאֻלָם
  choice: le vestibule
  rationale: Désigne ici le porche ou vestibule situé devant la grande salle du temple; « vestibule » est naturel et précis dans ce contexte architectural.
- source_word: עַשְׁתֵּי עֶשְׂרֵה אַמָּה
  choice: douze coudées
  rationale: Suit le texte consonantique et la vocalisation massorétique du WLC, malgré une difficulté textuelle ancienne.
- source_word: אֵילִים
  choice: piliers latéraux
  rationale: Dans la description architecturale d’Ézéchiel, le terme désigne les éléments verticaux ou jambages placés sur les côtés; cette formulation évite de les confondre avec les colonnes עַמֻּדִים.
- source_word: וּבַמַּעֲלוֹת אֲשֶׁר יַעֲלוּ אֵלָיו
  choice: On y montait par des marches
  rationale: Reformule en français naturel la construction hébraïque elliptique tout en conservant l’idée du moyen d’accès au vestibule.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La phrase hébraïque est syntaxiquement abrupte autour des marches; elle est répartie en phrases françaises naturelles. « Une de chaque côté » restitue l’expression idiomatique finale.
