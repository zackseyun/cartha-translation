  yaml_path: translation/ot/ezekiel/040/038.yaml
  text: There was a chamber with its doorway by the gateposts of the gates[a]; there they would rinse the burnt offering.
translation:
  language: fr
  text: Il y avait une salle dont l’entrée se trouvait près des piliers des portes[a] ; c’est là qu’on rinçait l’holocauste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme architectural hébreu rendu par « piliers » peut aussi désigner des montants, des vestibules, des pilastres en saillie ou un élément comparable de l’ensemble des portes.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁכָּה
  choice: une salle
  rationale: Dans le cadre architectural du temple, le terme désigne une pièce intégrée à un ensemble plus vaste. « Salle » est naturel et digne en français.
- source_word: וּפִתְחָהּ
  choice: dont l’entrée se trouvait
  rationale: Cette formulation exprime naturellement en français le lien possessif entre la salle et son entrée, tout en rendant la relation architecturale indiquée par l’hébreu.
- source_word: בְּאֵילִים
  choice: près des piliers
  rationale: Le terme architectural est difficile à identifier avec précision. « Piliers » offre une désignation accessible, tandis que la note conserve les principales autres possibilités.
- source_word: הַשְּׁעָרִים
  choice: des portes
  rationale: Le pluriel hébreu est conservé et renvoie aux portes ou aux ensembles monumentaux qui les entourent.
- source_word: שָׁם
  choice: c’est là
  rationale: Cette tournure française met clairement en rapport l’action rituelle et le lieu qui vient d’être décrit.
- source_word: יָדִיחוּ
  choice: on rinçait
  rationale: Le hiphil désigne ici le lavage ou rinçage de la victime sacrificielle. L’imparfait exprime naturellement l’action habituelle, et le pronom indéfini évite d’ajouter un sujet absent du texte.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: « Holocauste » est le terme français traditionnel et précis pour le sacrifice entièrement brûlé désigné par עֹלָה.
