base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/021.yaml
  text: 'Its guardrooms were three on this side and three on that side[a], and its side pillars and its portico had the same measurements as the first gate: its length was fifty cubits[b], and the width twenty-five cubits.'
translation:
  language: fr
  text: Ses chambres de garde étaient au nombre de trois d’un côté et de trois de l’autre ; ses piliers latéraux[a] et son vestibule[b] avaient les mêmes dimensions que les éléments correspondants de la première porte. Cette porte avait cinquante coudées de long et vingt-cinq coudées de large.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « montants » ou « pilastres » ; le sens précis de ce terme architectural hébreu est incertain.
    reason: lexical_alternative
  - marker: b
    text: Ou « portique » ou « porche ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּא
  choice: chambres de garde
  rationale: Dans le contexte des portes d’Ézéchiel 40, le terme désigne de petites pièces intégrées à la construction. « Chambres de garde » est clair en français moderne tout en restant adapté au contexte architectural.
- source_word: שְׁלוֹשָׁה מִפּוֹ ... וּשְׁלֹשָׁה מִפּוֹ
  choice: trois d’un côté et trois de l’autre
  rationale: Cette formulation rend naturellement la répartition symétrique indiquée par l’hébreu.
- source_word: אֵיל
  choice: piliers latéraux
  rationale: Le terme architectural est incertain, mais semble désigner des éléments verticaux ou saillants de la porte. « Piliers latéraux » reste compréhensible sans imposer une identification trop technique.
- source_word: אֵלַם
  choice: vestibule
  rationale: Le mot désigne l’espace couvert associé à l’entrée de la porte. « Vestibule » convient au contexte, même si « portique » ou « porche » demeure possible.
- source_word: הָיָה כְּמִדַּת הַשַּׁעַר הָרִאשׁוֹן
  choice: avaient les mêmes dimensions que ceux de la première porte
  rationale: La tournure exprime clairement la comparaison avec les éléments correspondants de la porte décrite en premier.
- source_word: חֲמִשִּׁים אַמָּה אָרְכּוֹ ... וְרֹחַב חָמֵשׁ וְעֶשְׂרִים בָּאַמָּה
  choice: cinquante coudées de long et vingt-cinq coudées de large
  rationale: Cette formulation française naturelle conserve exactement les mesures et leur unité biblique.
