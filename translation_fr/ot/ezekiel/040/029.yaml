base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/029.yaml
  text: And its guardroom[a], its side pillars, and its porch were according to these measurements; and it had windows, and its porch had windows, all around. The length was fifty cubits[b], and the width twenty-five cubits.
translation:
  language: fr
  text: Ses loges, ses piliers latéraux[a] et son vestibule[b] étaient conformes à ces mesures. Il y avait des fenêtres tout autour, dans la porte et dans son vestibule. La longueur était de cinquante coudées[c], et la largeur de vingt-cinq coudées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses montants », « ses pilastres » ou « ses poteaux ».
    reason: lexical_alternative
  - marker: b
    text: Ou « son porche » ou « son portique ».
    reason: lexical_alternative
  - marker: c
    text: La coudée était une ancienne unité de longueur fondée sur la distance entre le coude et l'extrémité des doigts.
    reason: measurement_clarification
lexical_decisions:
- source_word: תָּא
  choice: loge
  rationale: Dans la description architecturale des portes, le terme désigne les petites pièces intégrées à la structure. « Loge » est concis, naturel et moins interprétatif que « poste de garde ».
- source_word: אַיִל
  choice: pilier latéral
  rationale: Le terme désigne ici un élément vertical de la porte. « Pilier latéral » reste compréhensible tout en conservant la portée architecturale du mot.
- source_word: אֵילָם
  choice: vestibule
  rationale: Le mot désigne l'espace couvert situé à l'entrée. « Vestibule » convient bien au contexte architectural et évite les connotations domestiques modernes de « porche ».
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: avaient les mêmes dimensions que les précédents
  rationale: La formule renvoie aux mesures de la porte décrite auparavant. Cette expression française rend clairement la conformité sans alourdir la phrase.
- source_word: חַלּוֹנוֹת
  choice: fenêtres
  rationale: C'est le sens ordinaire du terme; le verset ne précise pas à lui seul qu'elles étaient grillagées ou à claire-voie.
- source_word: סָבִיב סָבִיב
  choice: tout autour
  rationale: Cette tournure idiomatique rend l'insistance produite par la répétition hébraïque.
- source_word: חֲמִשִּׁים אַמָּה אֹרֶךְ
  choice: La longueur était de cinquante coudées
  rationale: La formulation conserve explicitement l'axe de longueur et le style métrique du texte.
- source_word: וְרֹחַב עֶשְׂרִים וְחָמֵשׁ אַמּוֹת
  choice: et la largeur de vingt-cinq coudées
  rationale: La construction coordonnée reflète sobrement la seconde dimension donnée par l'hébreu.
- source_word: לּוֹ ... וְלְאֵילָמוֹ
  choice: dans la porte et dans son vestibule
  rationale: Les constructions pronominales indiquent que les fenêtres appartiennent à la structure évoquée et à son vestibule. « Dans » exprime naturellement leur emplacement en français.
