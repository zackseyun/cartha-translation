  text: וַ/יָּ֨מָד אֶת הֶ/חָצֵ֜ר אֹ֣רֶךְ מֵאָ֣ה אַמָּ֗ה וְ/רֹ֛חַב מֵאָ֥ה אַמָּ֖ה מְרֻבָּ֑עַת וְ/הַ/מִּזְבֵּ֖חַ לִ/פְנֵ֥י הַ/בָּֽיִת־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/047.yaml
  text: 'Then he measured the court: one hundred cubits long and one hundred cubits wide[a], square[b]; and the altar was before the house.'
translation:
  language: fr
  text: 'Puis il mesura la cour : elle avait cent coudées de long sur cent coudées de large et formait un carré. L’autel était devant le Temple[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « la maison », c’est-à-dire le bâtiment du sanctuaire dans la vision d’Ézéchiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: Puis il mesura
  rationale: Le waw consécutif fait progresser le récit ; « Puis » exprime naturellement cette succession, et « mesura » rend le passé narratif de מדד.
- source_word: הֶחָצֵר
  choice: la cour
  rationale: חָצֵר désigne ici l’espace clos du complexe du sanctuaire ; « cour » est le terme architectural naturel en français.
- source_word: אֹרֶךְ מֵאָה אַמָּה וְרֹחַב מֵאָה אַמָּה
  choice: elle avait cent coudées de long sur cent coudées de large
  rationale: Cette formulation française claire conserve les deux dimensions et l’unité ancienne sans conversion moderne.
- source_word: מְרֻבָּעַת
  choice: formait un carré
  rationale: Le participe décrit la forme carrée de la cour ; cette tournure est plus naturelle que le simple adjectif après l’énoncé des dimensions.
- source_word: הַמִּזְבֵּחַ
  choice: l’autel
  rationale: Équivalent cultuel usuel et précis de מִזְבֵּחַ.
- source_word: לִפְנֵי הַבָּיִת
  choice: devant le Temple
  rationale: לִפְנֵי indique ici une position spatiale en face de l’édifice ; dans cette vision, הַבָּיִת désigne le bâtiment du sanctuaire. La note conserve le sens littéral « la maison ».
