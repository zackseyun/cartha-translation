base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/040.yaml
  text: And on the outer side[a], by the ascent to the entrance of the north gate, were two tables; and on the other side, which belonged to the porch of the gate[c][b], were two tables.
translation:
  language: fr
  text: Du côté extérieur, en montant vers l’entrée de la porte nord, il y avait deux tables ; de l’autre côté, du côté du vestibule de la porte[a], il y avait deux tables.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « près du vestibule de la porte » ou « qui appartenait au vestibule de la porte » ; l’hébreu indique un rapport avec le vestibule sans en préciser exactement la nature.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּתֵף
  choice: côté
  rationale: Littéralement « épaule » ; dans cette description architecturale, le mot désigne un côté ou un flanc. « Côté » est naturel et précis en français moderne.
- source_word: מִחוּצָה
  choice: extérieur
  rationale: Indique ce qui se trouve dehors ou du côté externe ; avec « côté », « côté extérieur » rend clairement la relation spatiale.
- source_word: לָעוֹלֶה
  choice: près de la montée
  rationale: Le participe substantivé de עלה peut désigner l’endroit par lequel on monte, probablement la montée ou l’escalier conduisant à l’entrée. La formulation conserve cette nuance sans préciser indûment la présence de marches.
- source_word: פֶּתַח
  choice: entrée
  rationale: Terme architectural courant et naturel pour l’ouverture donnant accès à la porte.
- source_word: שַׁעַר
  choice: porte
  rationale: Rendu habituel dans les descriptions de l’architecture du temple ; le contexte montre qu’il s’agit de l’ensemble de la porte monumentale.
- source_word: הַצָּפוֹנָה
  choice: nord
  rationale: La tournure « porte nord » est idiomatique en français et exprime directement l’orientation.
- source_word: שְׁנַיִם שֻׁלְחָנוֹת
  choice: deux tables
  rationale: Traduction directe de l’expression numérique dans le contexte des installations sacrificielles.
- source_word: הָאַחֶרֶת
  choice: l’autre
  rationale: Désigne le côté correspondant ou opposé ; « l’autre côté » est la formulation française naturelle.
- source_word: אֲשֶׁר לְאֻלָם הַשַּׁעַר
  choice: près du vestibule de la porte
  rationale: La préposition לְ exprime ici une relation spatiale ou associative dont la précision reste incertaine. « Près de » convient au contexte architectural sans imposer l’idée de possession.
- source_word: אֻלָם
  choice: vestibule
  rationale: Dans l’architecture de la vision, le terme désigne l’espace couvert attenant à la porte. « Vestibule » est plus précis que « porche » tout en restant compréhensible.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « il y avait deux tables » est conservée pour refléter la structure hébraïque. « Côté » remplace l’image littérale de l’« épaule », peu naturelle en français architectural.
