translation_notes:
  register: Français international moderne, clair et digne. « Entrée » rend ici la structure de passage plutôt que le seul battant d’une porte. La formulation conserve l’ambiguïté temporelle et fonctionnelle du verbe hébreu au moyen d’une note.
