base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/041.yaml
  text: Four tables on this side and four tables on that side[a], by the side of the gate—eight tables[c][b]; on them they slaughtered.
translation:
  language: fr
  text: 'Quatre tables d’un côté et quatre tables de l’autre[a], sur les côtés de la porte[b] : huit tables ; on y égorgeait[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « d’ici et d’ici » ; autrement dit, de part et d’autre.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à l’épaule de la porte ». Dans ce contexte architectural, « épaule » désigne le côté ou le flanc de la structure.'
    reason: cultural_note
  - marker: c
    text: 'Ou : « on y égorgera » ou « on devait y égorger ». La forme verbale hébraïque peut évoquer l’usage prévu, habituel ou futur des tables.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְבָּעָה שֻׁלְחָנוֹת
  choice: quatre tables
  rationale: Rend directement le nombre et le nom; la fonction des tables est précisée dans la dernière proposition.
- source_word: מִפֹּה ... מִפֹּה
  choice: d’un côté ... de l’autre
  rationale: Cette tournure française naturelle exprime le contraste spatial des deux expressions déictiques.
- source_word: לְכֶתֶף הַשָּׁעַר
  choice: sur les côtés de l’entrée
  rationale: כָּתֵף signifie littéralement « épaule », mais désigne ici le côté ou le flanc d’une structure. Le pluriel s’accorde naturellement avec la répartition des tables de part et d’autre.
- source_word: שְׁמוֹנָה שֻׁלְחָנוֹת
  choice: huit tables en tout
  rationale: Explicite naturellement en français la récapitulation des deux groupes de quatre sans ajouter d’information substantielle.
- source_word: אֲלֵיהֶם
  choice: sur elles
  rationale: Le pronom renvoie aux tables et indique la surface ou l’emplacement où avait lieu l’égorgement.
- source_word: יִשְׁחָטוּ
  choice: on devait égorger
  rationale: L’imparfait hébreu peut exprimer ici la destination ou l’usage prévu des tables; le pronom indéfini « on » évite d’identifier des agents que le texte ne nomme pas.
