  yaml_path: translation/ot/ezekiel/040/006.yaml
  text: 'Then he came to the gate that faced east[a], and he went up its steps and measured the threshold of the gate: one reed wide. And the other threshold was one reed wide.'
translation:
  language: fr
  text: 'Puis il arriva à la porte qui faisait face à l’est. Il en monta les marches et mesura le seuil de la porte : une canne de large ; l’autre seuil : une canne de large.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et un seuil avait une canne de large ». L’hébreu porte littéralement « un seuil », mais le contexte semble désigner le seuil correspondant de l’autre côté de la porte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעַר
  choice: porte
  rationale: Dans cette description architecturale, « porte » désigne naturellement l’entrée fortifiée ou l’ensemble monumental d’accès.
- source_word: אֲשֶׁר פָּנָיו דֶּרֶךְ הַקָּדִימָה
  choice: qui faisait face à l’est
  rationale: Cette formulation rend naturellement l’orientation de la face ou façade de la porte vers l’est.
- source_word: במעלותיו
  choice: il en monta les marches
  rationale: Le pluriel מַעֲלוֹת désigne ici les marches permettant d’accéder à la porte; le pronom « en » renvoie clairement à celle-ci.
- source_word: סַף הַשַּׁעַר
  choice: le seuil de la porte
  rationale: סַף désigne le seuil ou soubassement franchi à l’entrée; « seuil » est le terme architectural français le plus clair.
- source_word: קָנֶה אֶחָד רֹחַב
  choice: une canne de large
  rationale: La canne est l’unité de mesure employée dans la vision, et cette expression française restitue directement la largeur indiquée.
- source_word: וְאֵת סַף אֶחָד
  choice: L’autre seuil
  rationale: Bien que אֶחָד signifie littéralement « un », le contexte architectural suggère le seuil correspondant de l’autre côté; « l’autre seuil » rend cette relation sans lourdeur.
- source_word: וַיָּבֹא ... וַיַּעַל ... וַיָּמָד
  choice: Puis il arriva ... Il en monta ... et mesura
  rationale: La succession narrative des formes hébraïques est rendue par des passés simples, naturels dans un récit français soutenu.
