base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/007.yaml
  text: And each guardroom was one reed long and one reed wide[a], and between the guardrooms was five cubits[c][b]. And the threshold of the gate beside the portico of the gate on the inside was one reed.
translation:
  language: fr
  text: Chaque loge[a] avait une canne de longueur et une canne de largeur. Il y avait cinq coudées entre les loges. Le seuil de la porte, près du vestibule[b] de la porte, du côté intérieur[c], mesurait une canne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chambre latérale ». Le terme hébreu désigne ici une petite pièce intégrée à l’ensemble de la porte, sans en préciser explicitement la fonction.
    reason: lexical_alternative
  - marker: b
    text: Ou « porche ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « depuis la maison » ou « du côté de la maison » ; l’expression indique probablement le côté intérieur, orienté vers le bâtiment du temple.
    reason: textual_ambiguity
lexical_decisions:
- source_word: הַתָּא
  choice: loge
  rationale: Dans l’ensemble architectural de la porte, תָּא désigne une petite pièce latérale. « Loge » reste fonctionnellement neutre, contrairement à « poste de garde », qui précise une fonction non explicitée dans le verset.
- source_word: קָנֶה אֶחָד
  choice: une canne
  rationale: קָנֶה est ici l’unité de mesure définie par le contexte immédiat. « Une canne » conserve le vocabulaire concret et technique de la vision.
- source_word: אֹרֶךְ / רֹחַב
  choice: de longueur / de largeur
  rationale: Cette formulation française naturelle maintient le parallélisme exact des deux dimensions.
- source_word: בֵּין הַתָּאִים
  choice: entre les loges
  rationale: Le même équivalent de תָּא est conservé au pluriel pour assurer la cohérence architecturale.
- source_word: חָמֵשׁ אַמּוֹת
  choice: cinq coudées
  rationale: « Coudée » est le terme français usuel pour l’unité de mesure אַמָּה, sans ajout absent de l’hébreu.
- source_word: סַף
  choice: seuil
  rationale: Dans ce contexte architectural, סַף désigne le seuil de l’entrée.
- source_word: הַשַּׁעַר
  choice: la porte
  rationale: « Porte » rend directement le terme hébreu tout en pouvant désigner ici l’ensemble monumental d’entrée.
- source_word: מֵאֵצֶל
  choice: près de
  rationale: La préposition exprime la proximité spatiale; « près de » convient naturellement à la description architecturale.
- source_word: אוּלָם הַשַּׁעַר
  choice: le vestibule de la porte
  rationale: אוּלָם désigne un porche ou vestibule. « Vestibule » exprime clairement l’espace architectural sans lui attribuer une forme plus précise.
- source_word: מֵהַבַּיִת
  choice: du côté intérieur
  rationale: Dans cette description, l’expression indique vraisemblablement le côté orienté vers l’intérieur ou vers le bâtiment du temple. La traduction principale donne le sens spatial probable, tandis que la note conserve la formulation littérale ambiguë.
