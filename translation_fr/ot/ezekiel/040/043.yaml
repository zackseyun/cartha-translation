  text: וְ/הַֽ/שְׁפַתַּ֗יִם טֹ֧פַח אֶחָ֛ד מוּכָנִ֥ים בַּ/בַּ֖יִת סָבִ֣יב סָבִ֑יב וְ/אֶל הַ/שֻּׁלְחָנ֖וֹת בְּשַׂ֥ר הַ/קָּרְבָֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/043.yaml
  text: And hooks[a], a handbreadth long, were fastened all around inside the house, and on the tables was the flesh of the offering.
translation:
  language: fr
  text: Des crochets[a], longs d’une palme, étaient fixés tout autour à l’intérieur de la maison, et la chair de l’offrande était sur les tables.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traduit par « crochets » est incertain; il pourrait aussi désigner des rebords ou un autre dispositif associé à l’espace d’abattage.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁפַתַּיִם
  choice: crochets
  rationale: Ce nom rare et difficile peut désigner des crochets, des rebords ou un autre dispositif. Dans cet espace lié à l’abattage et aux tables, « crochets » convient au contexte, sans masquer l’incertitude, signalée en note.
- source_word: טֹפַח אֶחָד
  choice: longs d’une palme
  rationale: טֹפַח désigne la palme, petite unité de longueur. L’accord au pluriel et « longs de » donnent une formulation française naturelle.
- source_word: מוּכָנִים
  choice: étaient fixés
  rationale: Le participe passif de כון exprime ici vraisemblablement l’idée d’objets établis ou installés en place; « fixés » s’accorde bien avec « crochets ».
- source_word: בַּבַּיִת
  choice: à l’intérieur de la maison
  rationale: Le terme désigne ici la maison ou le bâtiment dans l’ensemble du temple. La formulation conserve ce vocabulaire architectural sans préciser davantage.
- source_word: סָבִיב סָבִיב
  choice: tout autour
  rationale: La répétition hébraïque renforce l’idée d’une disposition sur tout le pourtour; « tout autour » en rend naturellement la force.
- source_word: וְאֶל הַשֻּׁלְחָנוֹת
  choice: et … sur les tables
  rationale: Bien que אֶל signifie habituellement « vers », la construction descriptive elliptique indique vraisemblablement ici la relation locale avec la chair déposée sur les tables.
- source_word: בְּשַׂר הַקָּרְבָן
  choice: la chair de l’offrande
  rationale: « Chair » conserve le sens concret de בשר, tandis que « offrande » rend le terme cultuel קרבן sans ajouter une précision absente du texte.
