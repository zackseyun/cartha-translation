id: EZK.40.15
reference: Ezekiel 40:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַ֗ל פְּנֵי֙ הַ/שַּׁ֣עַר ה/יאתון עַל לִ/פְנֵ֕י אֻלָ֥ם הַ/שַּׁ֖עַר הַ/פְּנִימִ֑י חֲמִשִּׁ֖ים אַמָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/015.yaml
  text: And from the front of the outer gateway to the front of the vestibule of the inner gate was fifty cubits[a][b][c].
translation:
  language: fr
  text: De la façade du portail extérieur[a] à la façade du vestibule[b] du portail intérieur[c], il y avait cinquante coudées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu est difficile à cet endroit; le terme traduit par « extérieur » est inhabituel. D’après le contexte des mesures environnantes, beaucoup le comprennent comme une référence au portail extérieur.
    reason: textual_variant
  - marker: b
    text: Ou « porche ».
    reason: lexical_alternative
  - marker: c
    text: Dans ce chapitre, le mot hébreu traduit par « portail » peut désigner tout l’ouvrage d’entrée, et non seulement la porte elle-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל ... עַל לִפְנֵי
  choice: De ... à
  rationale: Dans ce contexte de mesures architecturales, les prépositions indiquent le point de départ et le point d’arrivée de la distance; cette tournure est naturelle et précise en français.
- source_word: פְּנֵי ... לִפְנֵי
  choice: la façade ... la façade
  rationale: Le terme désigne ici la face avant d’un élément architectural; « façade » convient mieux que le calque « face ».
- source_word: הַשַּׁעַר
  choice: portail
  rationale: Dans Ézéchiel 40, le mot peut désigner tout un ouvrage d’entrée et non les seuls battants; « portail » garde cette portée architecturale.
- source_word: היאתון
  choice: extérieur
  rationale: La forme hébraïque est inhabituelle et difficile; d’après le contexte des mesures, elle est comprise comme désignant le portail extérieur, tout en signalant l’incertitude en note.
- source_word: אֻלָם
  choice: vestibule
  rationale: Le mot désigne un espace couvert situé à l’entrée; « vestibule » est précis, actuel et adapté au contexte architectural.
- source_word: הַשַּׁעַר הַפְּנִימִי
  choice: le portail intérieur
  rationale: Cette expression qualifie le portail selon sa position intérieure dans l’ensemble architectural.
- source_word: חֲמִשִּׁים אַמָּה
  choice: cinquante coudées
  rationale: « Coudée » est le terme français traditionnel et intelligible pour cette unité de longueur antique.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La phrase nominale hébraïque est rendue par « il y avait » pour une syntaxe française naturelle. « Façade » maintient la précision spatiale, tandis que les notes préservent la difficulté textuelle et les possibilités lexicales.
