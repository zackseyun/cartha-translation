base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/019.yaml
  text: 'Then he measured the width from the front of the lower gate to the front of the inner court outside: one hundred cubits[b][a], to the east and to the north.'
translation:
  language: fr
  text: 'Puis il mesura la largeur depuis la porte inférieure[a] jusqu’à la cour intérieure, à l’extérieur : cent coudées[b], à l’est comme au nord.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le portail inférieur ». Le mot hébreu traduit par « porte » peut désigner l’ensemble de la construction, et non seulement son ouverture.
    reason: lexical_alternative
  - marker: b
    text: La distance était de cent coudées aussi bien du côté est que du côté nord.
    reason: clarification
lexical_decisions:
- source_word: וַיָּמָד
  choice: Puis il mesura
  rationale: Le wayyiqtol fait avancer le récit de la vision. « Puis » exprime naturellement cette succession en français.
- source_word: רֹחַב
  choice: la largeur
  rationale: Le nom désigne ici une étendue mesurée; « largeur » est le terme architectural courant.
- source_word: מִלִּפְנֵי
  choice: depuis le devant de
  rationale: La préposition indique spatialement le point de départ de la mesure. Cette formulation conserve l’image du texte hébreu.
- source_word: הַשַּׁעַר הַתַּחְתּוֹנָה
  choice: la porte inférieure
  rationale: « Inférieure » rend le contraste spatial sans suggérer une valeur moindre. « Porte » est naturel, tout en pouvant désigner l’ensemble architectural.
- source_word: לִפְנֵי הֶחָצֵר הַפְּנִימִי
  choice: jusqu’au devant de la cour intérieure
  rationale: La même expression spatiale marque ici le terme de la mesure; sa répétition maintient la structure architecturale de l’hébreu.
- source_word: מִחוּץ
  choice: à l’extérieur
  rationale: L’expression précise que la mesure est prise du côté extérieur.
- source_word: מֵאָה אַמָּה
  choice: cent coudées
  rationale: La mesure ancienne est conservée, conformément au cadre architectural et culturel du texte.
- source_word: הַקָּדִים וְהַצָּפוֹן
  choice: à l’est comme au nord
  rationale: Cette formulation naturelle indique que la mesure donnée vaut pour les deux côtés, oriental et septentrional.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et architectural. La répétition de « devant » conserve le parallélisme spatial du texte hébreu, tandis que « à l’est comme au nord » explicite sans lourdeur la portée distributive de la mesure.
