  text: וּ/מִ/חוּצָ/ה֩ לַ/שַּׁ֨עַר הַ/פְּנִימִ֜י לִֽשְׁכ֣וֹת שָׁרִ֗ים בֶּ/חָצֵ֤ר הַ/פְּנִימִי֙ אֲשֶׁ֗ר אֶל כֶּ֨תֶף֙ שַׁ֣עַר הַ/צָּפ֔וֹן וּ/פְנֵי/הֶ֖ם דֶּ֣רֶךְ הַ/דָּר֑וֹם אֶחָ֗ד אֶל כֶּ֨תֶף֙ שַׁ֣עַר הַ/קָּדִ֔ים פְּנֵ֖י דֶּ֥רֶךְ הַ/צָּפֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/044.yaml
  text: And outside the inner gate were chambers for singers in the inner court[a], which were beside the shoulder of the north gate, with their front toward the south; one was beside the shoulder of the east gate[c][b], facing toward the north.
translation:
  language: fr
  text: À l’extérieur de la porte intérieure, dans la cour intérieure, se trouvaient des salles pour les chanteurs. Elles étaient à côté de la porte nord[a], leur façade tournée vers le sud ; l’une d’elles était à côté de la porte est[b], sa façade tournée vers le nord.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « à l’épaule de la porte nord » ; « épaule » désigne ici le côté ou le flanc d’une construction.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit de même « à l’épaule de la porte est ».
    reason: lexical_alternative
  - marker: c
    text: La syntaxe hébraïque de ce verset est très condensée et présente des variations de nombre et de genre. La disposition exacte des salles peut donc être formulée différemment ; le texte massorétique les situe près des portes nord et est, avec des façades orientées respectivement vers le sud et vers le nord.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִחוּצָה לַשַּׁעַר הַפְּנִימִי
  choice: À l’extérieur de la porte intérieure
  rationale: Cette formulation conserve le lien spatial et rend naturellement en français la localisation indiquée par מִחוּצָה.
- source_word: לִשְׁכוֹת שָׁרִים
  choice: des salles pour les chanteurs
  rationale: לִשְׁכוֹת désigne ici des pièces du complexe du Temple, et שָׁרִים ceux qui chantent. « Salles » et « chanteurs » sont clairs, actuels et sans connotation confessionnelle ajoutée.
- source_word: בֶּחָצֵר הַפְּנִימִי
  choice: dans la cour intérieure
  rationale: « Cour intérieure » est l’expression architecturale française naturelle correspondant à חָצֵר הַפְּנִימִי.
- source_word: אֶל כֶּתֶף שַׁעַר הַצָּפוֹן
  choice: à côté de la porte nord
  rationale: כֶּתֶף signifie littéralement « épaule », mais désigne métaphoriquement le côté ou le flanc d’un ouvrage. Le sens architectural est rendu dans le texte, tandis que l’image hébraïque est signalée en note.
- source_word: וּפְנֵיהֶם דֶּרֶךְ הַדָּרוֹם
  choice: leur façade tournée vers le sud
  rationale: פָּנִים désigne ici la face avant des salles. « Façade » exprime clairement l’orientation architecturale sans suggérer que les chanteurs eux-mêmes regardaient nécessairement vers le sud.
- source_word: אֶחָד אֶל כֶּתֶף שַׁעַר הַקָּדִים
  choice: l’une d’elles était à côté de la porte est
  rationale: Le texte passe de salles au pluriel à אֶחָד, « un », dans une construction elliptique. « L’une d’elles » fournit en français le référent implicite sans modifier l’emplacement donné par le texte massorétique, la porte est.
- source_word: פְּנֵי דֶּרֶךְ הַצָּפוֹן
  choice: sa façade tournée vers le nord
  rationale: La formulation reprend le parallélisme spatial de la proposition précédente et rend l’orientation vers le nord.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire architectural reste concret. La métaphore hébraïque de l’« épaule » est expliquée en note plutôt qu’imposée dans le corps du texte, où elle serait obscure. La ponctuation sépare la localisation générale de la description détaillée afin de rendre lisible la syntaxe hébraïque condensée.
