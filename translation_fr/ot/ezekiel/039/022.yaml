  text: וְ/יָֽדְעוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹֽהֵי/הֶ֑ם מִן הַ/יּ֥וֹם הַ/ה֖וּא וָ/הָֽלְאָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/022.yaml
  text: And the house of Israel will know that I am Yahweh their God from that day onward[a].
translation:
  language: fr
  text: Alors la maison d’Israël saura que je suis Yahweh, leur Dieu, dès ce jour-là et désormais[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à partir de ce jour-là et par la suite ».
    reason: Alternative lexicale pour la locution temporelle מִן־הַיּוֹם הַהוּא וָהָלְאָה, qui exprime la continuation à compter de ce jour sans imposer l’idée de durée éternelle.
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Alors ... saura
  rationale: Dans ce discours prophétique, le parfait précédé de la conjonction a une valeur future et résultative. « Saura » conserve l’idée de reconnaissance sans la réduire à une simple information intellectuelle; « alors » exprime naturellement l’enchaînement contextuel.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: La formulation conserve l’expression collective hébraïque et son accent sur le peuple comme corps constitué.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce que la maison d’Israël saura.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיהֶם
  choice: son Dieu
  rationale: Le suffixe hébreu est au pluriel parce qu’il renvoie collectivement aux membres d’Israël; en français, le nom collectif singulier « la maison d’Israël » appelle naturellement « son Dieu ».
- source_word: מִן הַיּוֹם הַהוּא
  choice: dès ce jour-là
  rationale: La locution marque le point de départ d’un état durable. « Dès » rend clairement cette valeur initiale en français actuel.
- source_word: וָהָלְאָה
  choice: et pour toujours
  rationale: L’adverbe indique la continuation à partir du moment nommé. Dans ce contexte, cette expression française naturelle communique la permanence prospective, tout en signalant en note une traduction plus formellement proche.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom personnel et évite de le remplacer par un titre.
- issue: Portée temporelle de וָהָלְאָה
  choice: et pour toujours
  alternative: et désormais
  rationale: La formulation retenue exprime l’état durable de reconnaissance à partir de ce jour. La variante en note préserve la valeur plus strictement prospective de l’adverbe sans préciser explicitement une durée illimitée.
translation_notes:
  register: Français moderne, international et digne. La syntaxe demeure simple; l’expression biblique « maison d’Israël » et le nom « Yahweh » sont conservés, tandis que l’accord pronominal suit l’usage français avec le collectif singulier.
