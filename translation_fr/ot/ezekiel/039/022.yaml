revisions:
- from: Alors la maison d’Israël saura que je suis Yahweh, son Dieu, dès ce jour-là et pour toujours[a].
  to: Alors la maison d’Israël saura que je suis Yahweh, leur Dieu, dès ce jour-là et désormais[a].
  rationale: La révision retire l’ajout interprétatif « pour toujours » et rend la continuation prospective par « désormais ». Elle restitue également le pluriel sémantique de « leur Dieu ».
