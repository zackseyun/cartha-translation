  yaml_path: translation/ot/ezekiel/039/016.yaml
  text: And the name of the city will also be Hamonah[a]. Thus they will cleanse the land.
translation:
  language: fr
  text: Le nom de la ville sera aussi Hamona[a]. Ainsi, ils purifieront le pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Hamona est probablement apparenté au mot hébreu qui signifie « multitude » ou « horde ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: aussi
  rationale: L’adverbe conserve la valeur additive de l’expression hébraïque tout en restant naturel en français.
- source_word: שֵׁם עִיר
  choice: le nom de la ville
  rationale: Le syntagme désigne le nom de la ville particulière évoquée dans ce contexte.
- source_word: הֲמוֹנָה
  choice: Hamona
  rationale: Il s’agit d’un nom de lieu, translittéré selon une forme française lisible plutôt que traduit dans le corps du texte.
- source_word: וְטִהֲרוּ
  choice: Ainsi, ils purifieront
  rationale: Le parfait piel coordonné prend dans ce contexte une valeur future et résultative; « purifier » rend le sens cultuel et concret de טהר sans l’aplanir.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Le terme renvoie ici au territoire concerné, et non à la terre entière; « le pays » est idiomatique dans ce contexte.
theological_decisions:
- issue: Nature de la purification du territoire
  choice: purifieront le pays
  alternative: nettoieront le pays
  rationale: « Purifier » préserve la dimension possible de souillure rituelle liée aux morts, tout en convenant à l’assainissement concret décrit dans le contexte.
translation_notes:
  register: Français moderne, digne et accessible. La coordination finale est rendue par « Ainsi » pour exprimer naturellement le résultat dans le contexte, sans surcharger la phrase.
