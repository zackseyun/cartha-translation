  text: וְ/נָשׂוּ֙ אֶת כְּלִמָּתָ֔/ם וְ/אֶת כָּל מַעֲלָ֖/ם אֲשֶׁ֣ר מָעֲלוּ בִ֑/י בְּ/שִׁבְתָּ֧/ם עַל אַדְמָתָ֛/ם לָ/בֶ֖טַח וְ/אֵ֥ין מַחֲרִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/026.yaml
  text: They will bear their shame and all their unfaithfulness by which they were unfaithful to me[a], when they dwell securely on their land with no one to make them afraid.
translation:
  language: fr
  text: Ils porteront leur honte et toute l’infidélité dont ils se sont rendus coupables envers moi[a], lorsqu’ils habiteront en sécurité sur leur terre, sans que personne les fasse trembler.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils oublieront leur honte et toute leur infidélité. » Certaines traductions, influencées par des versions anciennes et par le contexte, comprennent ici le verbe dans ce sens ; toutefois, l’hébreu se lit le plus directement « porteront ».'
    reason: Signaler une autre compréhension ancienne et contextuelle du verbe sans écarter le sens lexical le plus direct du texte hébreu.
lexical_decisions:
- source_word: וְנָשׂוּ
  choice: Ils porteront
  rationale: Le verbe נשׂא signifie le plus directement « porter ». Cette traduction conserve la tension entre la restauration annoncée et la honte passée, sans lui substituer le sens contextuel possible « oublier ».
- source_word: כְּלִמָּתָם
  choice: leur honte
  rationale: כְּלִמָּה désigne la honte ou l’opprobre ; « honte » est direct, naturel et adapté au registre.
- source_word: מַעֲלָם / מָעֲלוּ
  choice: toute l’infidélité dont ils se sont rendus coupables
  rationale: Le nom et le verbe de la racine מעל expriment une rupture de fidélité. Cette formulation française rend le nom et son verbe apparenté sans la lourdeur de « l’infidélité par laquelle ils ont été infidèles ».
- source_word: בִי
  choice: envers moi
  rationale: Avec מעל, la préposition indique la personne lésée par l’infidélité. « Envers moi » met en valeur la dimension relationnelle tout en restant idiomatique.
- source_word: בְּשִׁבְתָּם
  choice: lorsqu’ils habiteront
  rationale: 'L’infinitif construit précédé de ב exprime ici une circonstance temporelle : « lorsqu’ils habiteront ».'
- source_word: עַל אַדְמָתָם
  choice: sur leur terre
  rationale: אֲדָמָה peut désigner le sol ou la terre. « Sur leur terre » préserve l’image hébraïque et le thème du rétablissement territorial.
- source_word: לָבֶטַח
  choice: en sécurité
  rationale: La locution exprime une habitation sûre, à l’abri du danger ; « en sécurité » est naturel en français contemporain.
- source_word: וְאֵין מַחֲרִיד
  choice: sans que personne les fasse trembler
  rationale: Le participe מַחֲרִיד désigne quelqu’un qui provoque l’effroi. « Sans que personne les fasse trembler » conserve cette nuance causative et personnelle.
theological_decisions:
- issue: Sens de וְנָשׂוּ dans un contexte de restauration après la faute
  choice: Conserver le sens hébreu direct « ils porteront »
  alternative: « Ils oublieront leur honte et toute leur infidélité »
  rationale: Le texte massorétique emploie un verbe signifiant normalement « porter ». Même si le contexte de restauration et certaines traditions anciennes ont conduit à comprendre « oublier », retenir cette interprétation dans le corps du texte effacerait une ambiguïté réelle et atténuerait la tension théologique entre restauration et mémoire de la faute.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition hébraïque fondée sur la racine מעל est rendue par une formulation idiomatique qui maintient l’idée de culpabilité liée à l’infidélité. Le futur convient au contexte prophétique, et « fasse trembler » conserve la force concrète de la formule finale.
