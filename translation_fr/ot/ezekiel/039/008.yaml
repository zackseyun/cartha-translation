base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/008.yaml
  text: Behold[a], it is coming, and it will happen, declares the Lord GOD. This is the day of which I have spoken.
translation:
  language: fr
  text: Voici, cela vient et cela arrivera[a] — déclaration du Seigneur Yahweh. C’est le jour dont j’ai parlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « Voici, elle est venue et elle s’est produite. » L’hébreu emploie des formes accomplies qui peuvent présenter l’avenir comme tellement certain qu’il est décrit comme déjà réalisé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Conserve l’interjection prophétique qui attire l’attention sur l’imminence et la certitude de l’annonce, dans un registre français digne et courant.
- source_word: בָאָה
  choice: cela vient
  rationale: Le parfait féminin peut présenter prophétiquement un événement futur comme certain. Le pronom neutre « cela » évite d’imposer un antécédent féminin sous-entendu.
- source_word: וְנִהְיָתָה
  choice: et cela arrivera
  rationale: Exprime naturellement l’idée de réalisation ou d’accomplissement portée par היה, sans résoudre la tension entre forme accomplie et référence future.
- source_word: נְאֻם
  choice: déclaration de
  rationale: Rend la formule prophétique de façon concise et solennelle, tout en marquant explicitement l’origine divine de l’oracle.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Distingue le titre אֲדֹנָי du nom divin יהוה et préserve le nom d’alliance dans le titre composé.
- source_word: הוּא הַיּוֹם
  choice: C’est le jour
  rationale: Rend l’identification emphatique portée par הוּא dans un français naturel.
- source_word: אֲשֶׁר דִּבַּרְתִּי
  choice: dont j’ai parlé
  rationale: Traduction idiomatique et fidèle de la proposition relative, avec le passé composé qui maintient la pertinence présente de la parole antérieure.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: « Yahweh » représente directement le Tétragramme et évite de confondre le nom divin avec le nom commun « Dieu », tout en conservant אֲדֹנָי comme « Seigneur ».
- issue: Valeur temporelle des parfaits בָאָה et נִהְיָתָה
  choice: présent imminent puis futur, avec note
  alternative: « elle est venue et elle s’est produite »
  rationale: Le contexte prophétique permet de décrire un événement futur comme déjà accompli en raison de sa certitude. Le texte principal reste naturel en français, tandis que la note conserve l’ambiguïté formelle.
translation_notes:
  register: Français international moderne, clair et digne, avec une tonalité prophétique. « Voici » conserve la solennité sans archaïsme excessif. La répétition de « cela » reflète l’absence d’un antécédent explicite sans introduire « jugement » ou « calamité » dans le texte.
