  text: וְֽ/יָצְא֞וּ יֹשְׁבֵ֣י עָרֵ֣י יִשְׂרָאֵ֗ל וּ/בִעֲר֡וּ וְ֠/הִשִּׂיקוּ בְּ/נֶ֨שֶׁק וּ/מָגֵ֤ן וְ/צִנָּה֙ בְּ/קֶ֣שֶׁת וּ/בְ/חִצִּ֔ים וּ/בְ/מַקֵּ֥ל יָ֖ד וּ/בְ/רֹ֑מַח וּ/בִעֲר֥וּ בָ/הֶ֛ם אֵ֖שׁ שֶׁ֥בַע שָׁנִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/009.yaml
  text: Then the inhabitants of the cities of Israel will go out and make fires with the weapons and burn them—the small shield and the large shield[a], the bow and the arrows[c][b], the hand-club and the spear—and they will make fires with them for seven years.
translation:
  language: fr
  text: Alors les habitants des villes d’Israël sortiront ; ils mettront le feu aux armes[a] et les brûleront — le petit bouclier et le grand bouclier[b], l’arc et les flèches, le bâton de combat[c] et la lance — et ils feront du feu avec elles pendant sept ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation hébraïque est difficile. Les deux verbes évoquent l’action de mettre le feu et de brûler ; le contexte indique que les armes servent de combustible.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie deux mots différents, qui désignent probablement un bouclier plus petit et un grand bouclier protégeant davantage le corps.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « bâton de main ». Dans cette liste d’armes, il s’agit probablement d’un bâton tenu à la main pour combattre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצְאוּ
  choice: sortiront
  rationale: Le sens courant de יצא est « sortir ». Le futur convient à la suite prophétique et conserve explicitement le mouvement hors des villes.
- source_word: יֹשְׁבֵי עָרֵי יִשְׂרָאֵל
  choice: les habitants des villes d’Israël
  rationale: Cette formulation naturelle rend directement la construction « les habitants des villes d’Israël ».
- source_word: וּבִעֲרוּ וְהִשִּׂיקוּ בְּנֶשֶׁק
  choice: ils allumeront et alimenteront le feu avec les armes
  rationale: La succession verbale est difficile, mais le contexte montre que les armes servent de combustible. Cette formulation garde deux actions verbales sans présenter les armes comme de simples objets incendiés.
- source_word: נֶשֶׁק
  choice: les armes
  rationale: נשק est ici un collectif désignant l’armement; « les armes » est clair et actuel.
- source_word: מָגֵן וְצִנָּה
  choice: le petit bouclier et le grand bouclier
  rationale: La traduction distingue les deux types de boucliers énumérés par l’hébreu, tout en évitant des termes techniques peu accessibles.
- source_word: קֶשֶׁת וּבְחִצִּים
  choice: l’arc et les flèches
  rationale: Équivalents français usuels et précis.
- source_word: מַקֵּל יָד
  choice: le bâton de combat
  rationale: L’expression signifie littéralement « bâton de main ». Dans cette liste militaire, « bâton de combat » indique vraisemblablement sa fonction tout en laissant une note signaler la formulation littérale.
- source_word: רֹמַח
  choice: la lance
  rationale: Équivalent militaire français courant.
- source_word: וּבִעֲרוּ בָהֶם אֵשׁ שֶׁבַע שָׁנִים
  choice: ils s’en serviront pour faire du feu pendant sept ans
  rationale: 'La formulation exprime clairement la valeur instrumentale de בָהֶם : les armes serviront de combustible durant sept ans.'
