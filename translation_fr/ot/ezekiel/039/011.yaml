source:
  edition: WLC
  text: וְ/הָיָ֣ה בַ/יּ֣וֹם הַ/ה֡וּא אֶתֵּ֣ן לְ/גוֹג֩ מְקֽוֹם שָׁ֨ם קֶ֜בֶר בְּ/יִשְׂרָאֵ֗ל גֵּ֤י הָ/עֹֽבְרִים֙ קִדְמַ֣ת הַ/יָּ֔ם וְ/חֹסֶ֥מֶת הִ֖יא אֶת הָ/עֹֽבְרִ֑ים וְ/קָ֣בְרוּ שָׁ֗ם אֶת גּוֹג֙ וְ/אֶת כָּל הֲמוֹנֹ֔/ה וְ/קָ֣רְא֔וּ גֵּ֖יא הֲמ֥וֹן גּֽוֹג׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/011.yaml
  text: And it will be in that day that I will give Gog a burial place there in Israel[a], the Valley of the Travelers, east of the sea; and it will block the travelers. There they will bury Gog and all his multitude[c][b], and they will call it the Valley of Hamon-gog.
translation:
  language: fr
  text: 'En ce jour-là, je donnerai à Gog un lieu de sépulture là, en Israël : la vallée des Voyageurs[a], à l’est de la mer[b]. Elle fera obstacle aux voyageurs. Là, on enterrera Gog et toute sa multitude, et on appellera cet endroit « vallée de Hamôn-Gog »[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la vallée de ceux qui passent » ou « la vallée des Passants ».
    reason: lexical_alternative
  - marker: b
    text: Ou « en face de la mer » ; l’expression hébraïque peut indiquer une orientation plutôt qu’une direction strictement orientale.
    reason: lexical_alternative
  - marker: c
    text: Hamôn-Gog signifie probablement « multitude de Gog ».
    reason: name_meaning
lexical_decisions:
- source_word: מְקוֹם שָׁם קֶבֶר
  choice: un lieu de sépulture là
  rationale: Cette formulation conserve à la fois l’idée de lieu, l’adverbe שָׁם (« là ») et le sens funéraire de קֶבֶר, dans un français naturel.
- source_word: גֵּי הָעֹבְרִים
  choice: la vallée des Voyageurs
  rationale: Le participe substantivé désigne ceux qui passent ou voyagent. « Voyageurs » est fluide en français moderne et convient à un nom de lieu, tandis que la valeur plus littérale est signalée en note.
- source_word: קִדְמַת הַיָּם
  choice: à l’est de la mer
  rationale: Dans une indication géographique, קִדְמַת exprime probablement la position orientale. La possibilité d’une orientation « en face de la mer » est conservée en note.
- source_word: וְחֹסֶמֶת הִיא אֶת הָעֹבְרִים
  choice: Elle fera obstacle aux voyageurs
  rationale: Cette traduction rend le sens de חסם, « bloquer, obstruer », sans préciser abusivement la nature de l’obstacle.
- source_word: הֲמוֹנוֹ
  choice: toute sa multitude
  rationale: הָמוֹן désigne une masse, une foule ou une multitude. « Multitude » reste large et n’ajoute pas explicitement une nuance militaire.
- source_word: גֵּיא הֲמוֹן גּוֹג
  choice: vallée de Hamôn-Gog
  rationale: La translittération préserve la fonction de nom propre nouvellement attribué au lieu; sa signification est donnée en note.
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Formule prophétique concise, digne et naturelle en français actuel.
- source_word: אֶתֵּן לְגוֹג
  choice: je donnerai à Gog
  rationale: Le verbe נתן suivi de ל exprime ici l’attribution à Gog d’un lieu de sépulture.
theological_decisions:
- issue: Traduction ou translittération du nom final du lieu
  choice: Translittérer « Hamôn-Gog » dans le texte principal
  alternative: Traduire « Multitude de Gog »
  rationale: L’expression fonctionne comme un nom de lieu. La translittération conserve ce statut, tandis que la note en expose le sens probable sans effacer le jeu entre le nom et la multitude enterrée.
translation_notes:
  register: Français international moderne, clair et digne. La cadence prophétique demeure sobre. Les majuscules à « Voyageurs » signalent la valeur toponymique, et « cet endroit » explicite seulement le référent naturel du pronom implicite dans l’acte de nomination.
