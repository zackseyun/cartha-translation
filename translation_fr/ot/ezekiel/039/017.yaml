revisions:
- from: 'Et toi, fils d’homme, ainsi parle le Seigneur Yahweh : Dis à tous les oiseaux, quels que soient leurs plumages[a], et à toutes les bêtes sauvages : « Rassemblez-vous et venez ! Réunissez-vous de tous côtés autour du sacrifice que je vous offre, un grand sacrifice sur les montagnes d’Israël[b]. Vous mangerez de la chair et vous boirez du sang. »'
  to: 'Et toi, fils d’homme, ainsi parle le Seigneur Yahweh : Dis à tous les oiseaux, à tout ce qui a des ailes[a], et à toutes les bêtes sauvages : « Rassemblez-vous et venez ! Réunissez-vous de tous côtés pour le sacrifice que je prépare pour vous[b], un grand sacrifice sur les montagnes d’Israël. Vous mangerez de la chair et vous boirez du sang. »'
  rationale: La révision corrige la direction du rassemblement (« pour le sacrifice »), remplace l’image imprécise des « plumages » par une expression française qui reflète l’idiome des êtres ailés, et déplace l’ancre de la note b vers le syntagme qu’elle explique. Le caractère saisissant de l’ordre de manger la chair et de boire le sang est conservé.
