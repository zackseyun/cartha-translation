source:
  edition: WLC
  text: וְ/עָבְר֤וּ הָ/עֹֽבְרִים֙ בָּ/אָ֔רֶץ וְ/רָאָה֙ עֶ֣צֶם אָדָ֔ם וּ/בָנָ֥ה אֶצְל֖/וֹ צִיּ֑וּן עַ֣ד קָבְר֤וּ אֹת/וֹ֙ הַֽ/מְקַבְּרִ֔ים אֶל גֵּ֖יא הֲמ֥וֹן גּֽוֹג־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/015.yaml
  text: And those who pass through the land will pass through[a], and when one sees a human bone[b], he will set up a marker beside it until the buriers have buried it in the Valley of Hamon-gog.
translation:
  language: fr
  text: Ceux qui parcourront le pays le parcourront ; quand l’un d’eux verra un ossement humain[a], il dressera un repère à côté de celui-ci, jusqu’à ce que ceux qui sont chargés d’enterrer l’aient enterré dans la vallée de Hamon-Gog[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un os d’homme ». Le mot hébreu adam peut désigner un homme ou, de manière générique, un être humain ; ce dernier sens convient mieux ici.
    reason: lexical_alternative
  - marker: b
    text: Hamon-Gog signifie probablement « la multitude de Gog » ou « la foule de Gog » ; l’expression est conservée ici comme nom de lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבְרוּ הָעֹבְרִים
  choice: Ceux qui parcourront le pays le parcourront
  rationale: La reprise de la racine עבר par le verbe et le participe substantivé est conservée afin de rendre l’insistance ou le caractère systématique du parcours.
- source_word: בָּאָרֶץ
  choice: le pays
  rationale: Dans ce contexte, le terme désigne le territoire concerné, non la terre entière. « Pays » est naturel en français pour cette opération menée sur l’ensemble du territoire.
- source_word: וְרָאָה
  choice: quand l’un d’eux verra
  rationale: Le verbe masculin singulier individualise un membre du groupe précédent. Cette formulation exprime clairement la procédure sans restreindre le référent à un homme.
- source_word: עֶצֶם אָדָם
  choice: un ossement humain
  rationale: עֶצֶם désigne ici un os ou reste osseux, et אָדָם qualifie génériquement un être humain. « Ossement humain » convient au contexte de ramassage funéraire.
- source_word: וּבָנָה אֶצְלוֹ צִיּוּן
  choice: il dressera un repère à côté
  rationale: בנה signifie littéralement « construire », mais avec צִיּוּן il s’agit d’installer un signe signalant l’emplacement. « Dresser un repère » rend naturellement cette action.
- source_word: עַד קָבְרוּ אֹתוֹ הַמְקַבְּרִים
  choice: jusqu’à ce que ceux qui sont chargés d’enterrer l’aient enterré
  rationale: Le participe désigne les personnes affectées à l’ensevelissement. La formulation reste claire et conserve la répétition de la racine קבר.
- source_word: אֶל גֵּיא הֲמוֹן גּוֹג
  choice: dans la vallée de Hamon-Gog
  rationale: Après « enterrer », le français emploie naturellement « dans ». Hamon-Gog est conservé comme nom de lieu, tandis que גֵּיא est traduit par « vallée ».
theological_decisions:
- issue: Sens générique de אָדָם
  choice: humain
  alternative: d’homme
  rationale: Le passage concerne les restes de toute personne découverte, sans indication qu’il s’agisse spécifiquement d’un individu masculin. La valeur générique est donc explicitée.
- issue: Interprétation de הֲמוֹן גּוֹג
  choice: Hamon-Gog, conservé comme nom de lieu
  alternative: la multitude de Gog / la horde de Gog
  rationale: Le contexte emploie l’expression comme toponyme. La translittération préserve cette fonction tout en signalant en note son sens probable.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition inhabituelle de « parcourront » est maintenue pour refléter celle de l’hébreu, tandis que « ceux qui sont chargés d’enterrer » évite un substantif français artificiel.
