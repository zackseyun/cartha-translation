source:
  edition: WLC
  text: עַל פְּנֵ֥י הַ/שָּׂדֶ֖ה תִּפּ֑וֹל כִּ֚י אֲנִ֣י דִבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/005.yaml
  text: You will fall on the open field[a], for I have spoken[c][b], declares the Lord GOD.
translation:
  language: fr
  text: Tu tomberas en pleine campagne, car moi, j’ai parlé — déclaration du Seigneur Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu porte « le Seigneur Yahweh » : Yahweh représente ici le nom divin יהוה (YHWH), traditionnellement rendu par « l’Éternel » ou « le SEIGNEUR ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: en pleine campagne
  rationale: L’expression signifie littéralement « sur la face du champ », mais désigne ici un espace découvert. « En pleine campagne » est naturel en français et conserve l’idée d’un lieu ouvert, hors des zones habitées.
- source_word: תִּפּוֹל
  choice: tu tomberas
  rationale: L’imparfait hébreu à la deuxième personne masculine singulière s’adresse directement à Gog. Le futur français exprime clairement l’annonce prophétique.
- source_word: כִּי
  choice: car
  rationale: 'La conjonction introduit le fondement de l’annonce précédente : sa réalisation est certaine parce que Dieu a parlé.'
- source_word: דִבַּרְתִּי
  choice: moi, j’ai parlé
  rationale: Le parfait souligne le caractère arrêté et certain de la parole divine. Le pronom explicite אֲנִי est rendu par la dislocation emphatique « moi, j’ai parlé ».
- source_word: נְאֻם
  choice: déclaration de
  rationale: Cette tournure conserve le caractère solennel de la formule prophétique et s’intègre naturellement après un tiret.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Le titre אֲדֹנָי est rendu par « le Seigneur » et le nom divin יהוה par « Yahweh », ce qui évite l’expression artificielle « le Seigneur SEIGNEUR » et distingue les deux éléments hébreux.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte explicitement le nom divin יהוה. « Yahweh » le représente comme un nom propre et préserve la distinction avec אֲדֹנָי, sans imposer une interprétation confessionnelle supplémentaire.
translation_notes:
  register: Français international moderne, sobre et solennel. Le tutoiement singulier maintient l’adresse directe à Gog. Le tiret met en relief la formule prophétique finale sans alourdir la phrase.
