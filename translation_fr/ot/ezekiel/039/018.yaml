source:
  edition: WLC
  text: בְּשַׂ֤ר גִּבּוֹרִים֙ תֹּאכֵ֔לוּ וְ/דַם נְשִׂיאֵ֥י הָ/אָ֖רֶץ תִּשְׁתּ֑וּ אֵילִ֨ים כָּרִ֤ים וְ/עַתּוּדִים֙ פָּרִ֔ים מְרִיאֵ֥י בָשָׁ֖ן כֻּלָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/018.yaml
  text: You will eat the flesh of mighty men[a], and you will drink the blood of the princes of the earth—rams, lambs, male goats, and bulls[b], all of them fattened ones of Bashan.
translation:
  language: fr
  text: 'Vous mangerez la chair des guerriers[a] et vous boirez le sang des princes de la terre : des béliers, des agneaux, des boucs et des taureaux, tous, des bêtes grasses du Bashân[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les animaux énumérés ensuite — béliers, agneaux, boucs et taureaux — représentent, dans cette image de sacrifice, les chefs et les guerriers tués.
    reason: cultural_note
  - marker: b
    text: 'Ou : « tous les animaux engraissés du Bashân ». Le Bashân était réputé pour ses riches pâturages et son bétail bien nourri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׂר
  choice: chair
  rationale: Le nom désigne ici la chair corporelle et conserve toute la force crue de l’image sacrificielle.
- source_word: גִּבּוֹרִים
  choice: guerriers
  rationale: Dans le contexte d’une armée vaincue, le terme désigne des hommes puissants au combat; « guerriers » est naturel et précis en français moderne.
- source_word: תֹּאכֵלוּ
  choice: vous mangerez
  rationale: L’imparfait hébreu a ici la valeur d’une annonce prophétique au futur adressée aux oiseaux et aux bêtes convoqués.
- source_word: דַם
  choice: sang
  rationale: Le sens littéral convient à l’image volontairement saisissante du festin sacrificiel.
- source_word: נְשִׂיאֵי הָאָרֶץ
  choice: princes de la terre
  rationale: « Princes » maintient le registre élevé de נְשִׂיאִים, tandis que « terre » laisse à l’expression sa portée internationale dans ce contexte.
- source_word: תִּשְׁתּוּ
  choice: vous boirez
  rationale: Comme תֹּאכֵלוּ, cette forme exprime ici une annonce prophétique au futur.
- source_word: אֵילִים
  choice: béliers
  rationale: Le sens animal littéral doit être conservé dans cette série d’animaux sacrificiels, même si l’ensemble fonctionne comme métaphore des chefs et guerriers tués.
- source_word: כָּרִים
  choice: agneaux
  rationale: Le terme peut désigner de jeunes moutons engraissés; « agneaux » évite de répéter « béliers » et convient à la liste sacrificielle.
- source_word: עַתּוּדִים
  choice: boucs
  rationale: Le mot désigne précisément des chèvres mâles; « boucs » est le terme français courant et exact.
- source_word: פָּרִים
  choice: taureaux
  rationale: Le terme désigne des bovins mâles dans le cadre de l’imagerie sacrificielle.
- source_word: מְרִיאֵי בָשָׁן
  choice: bêtes grasses du Bashân
  rationale: Cette formulation rend l’idée d’animaux bien engraissés provenant des riches pâturages du Bashân, tout en permettant au qualificatif de reprendre l’ensemble de la liste.
- source_word: כֻּלָּם
  choice: tous
  rationale: Le masculin pluriel récapitule collectivement les animaux qui précèdent; la tournure « tous bêtes grasses » reste concise et souligne qu’ils le sont tous.
theological_decisions:
- issue: Faut-il traduire la liste animale comme du bétail littéral seulement ou comme une apposition métaphorique désignant les victimes humaines?
  choice: Conserver littéralement les noms d’animaux dans le texte, avec une ponctuation qui les met en apposition aux princes et guerriers.
  alternative: Remplacer les animaux par des désignations explicites de dirigeants humains ou ajouter dans le corps du verset « c’est-à-dire les chefs ».
  rationale: L’hébreu superpose délibérément le festin de bêtes sacrifiées et le massacre des puissants. Traduire les animaux littéralement préserve cette métaphore sans l’aplatir par une explication intégrée.
translation_notes:
  register: Français international moderne, clair et digne. Le futur conserve la force de l’annonce prophétique. « Chair » et « sang » maintiennent sans l’atténuer la violence de l’image. La graphie « Bashân » aide à indiquer la prononciation traditionnelle du nom biblique.
