  text: And I will no longer hide my face from them, when I have poured out my Spirit on the house of Israel, declares the Lord GOD.
translation:
  language: fr
  text: Je ne leur cacherai plus mon visage, quand j’aurai répandu mon Esprit sur la maison d’Israël, déclare le Seigneur, l’Éternel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַסְתִּיר ... פָּנַי
  choice: je leur cacherai ... mon visage
  rationale: Conserve l’image hébraïque du visage caché, qui exprime le retrait de la présence et de la faveur divines.
- source_word: אֲשֶׁר
  choice: quand
  rationale: Dans ce contexte, la conjonction peut introduire la circonstance liée à la fin du retrait divin; « quand » préserve le rapport temporel retenu sans imposer une causalité explicite.
- source_word: שָׁפַכְתִּי
  choice: je répandrai
  rationale: Le parfait prophétique hébreu présente l’acte futur comme assuré; le futur français convient au contexte eschatologique et à la principale au futur.
- source_word: רוּחִי
  choice: mon Esprit
  rationale: La majuscule signale naturellement en français qu’il s’agit de l’Esprit de Dieu, tout en conservant le possessif du texte.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la communauté d’Israël
  rationale: Littéralement « la maison d’Israël »; ici, l’expression désigne collectivement le peuple plutôt qu’un bâtiment ou une dynastie.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur, l’Éternel
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה selon un usage français digne et largement intelligible.
theological_decisions:
- issue: Rapport entre la fin du visage caché et l’effusion de l’Esprit
  choice: quand
  alternative: parce que / après que
  rationale: אֲשֶׁר permet plusieurs nuances contextuelles. « Quand » maintient le lien temporel sans réduire le texte à une causalité stricte ni trancher excessivement l’ordre logique.
- issue: Valeur temporelle du parfait שָׁפַכְתִּי
  choice: futur (« je répandrai »)
  alternative: passé composé (« j’ai répandu »)
  rationale: Dans cette annonce prophétique, l’action est présentée comme certaine et liée à la restauration future; le futur est naturel en français, même si la forme hébraïque est un parfait.
translation_notes:
  register: Français international moderne, clair et solennel. La métaphore biblique « cacher mon visage » est conservée. « Communauté d’Israël » explicite la valeur collective de בֵּית sans ajouter de précision confessionnelle.
