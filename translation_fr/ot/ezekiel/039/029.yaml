  source_fidelity: La principale et l’image de Dieu qui ne cache plus son visage sont fidèles. Toutefois, le parfait שָׁפַכְתִּי, lié par אֲשֶׁר à la cessation du retrait divin, est mieux rendu en français par un futur antérieur (« quand j’aurai répandu »), qui conserve l’aspect d’action accomplie sans imposer une causalité. « Maison d’Israël » correspond directement à בֵּית יִשְׂרָאֵל et reste parfaitement intelligible dans ce registre biblique.
