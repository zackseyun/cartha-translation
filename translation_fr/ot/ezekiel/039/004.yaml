  text: עַל הָרֵ֨י יִשְׂרָאֵ֜ל תִּפּ֗וֹל אַתָּה֙ וְ/כָל אֲגַפֶּ֔י/ךָ וְ/עַמִּ֖ים אֲשֶׁ֣ר אִתָּ֑/ךְ לְ/עֵ֨יט צִפּ֧וֹר כָּל כָּנָ֛ף וְ/חַיַּ֥ת הַ/שָּׂדֶ֖ה נְתַתִּ֥י/ךָ לְ/אָכְלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/004.yaml
  text: On the mountains of Israel you will fall—you and all your troops and the peoples who are with you[b][a]. I have given you as food to every kind of bird of prey and to the wild animals of the field.
translation:
  language: fr
  text: Sur les montagnes d’Israël, tu tomberas, toi, toutes tes troupes[a] et les peuples qui sont avec toi. Je t’ai donné en pâture aux oiseaux de proie de toute espèce[b] et aux animaux sauvages des champs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toutes tes ailes »; il s’agit probablement d’une image désignant les divisions ou les forces rattachées à l’armée de Gog.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, plus littéralement : « aux oiseaux de proie, à tout oiseau de toute aile »; l’expression hébraïque souligne l’ensemble des oiseaux, notamment ceux qui se nourrissent de charognes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפּוֹל
  choice: tu tomberas
  rationale: Le verbe נפל signifie concrètement « tomber ». Dans ce contexte de jugement, la chute implique la défaite et la mort, sans qu’il soit nécessaire de les expliciter dans le texte.
- source_word: אֲגַפֶּיךָ
  choice: tes troupes
  rationale: Le nom désigne littéralement des « ailes », mais il s’emploie ici comme image militaire pour les ailes, divisions ou forces rattachées à l’armée de Gog. « Troupes » est clair en français moderne, tandis qu’une note conserve l’image hébraïque.
- source_word: עַמִּים אֲשֶׁר אִתָּךְ
  choice: les peuples qui sont avec toi
  rationale: Le pluriel עַמִּים désigne normalement des peuples plutôt que de simples unités militaires; cette traduction préserve donc la pluralité des groupes accompagnant Gog.
- source_word: לְעֵיט צִפּוֹר כָּל כָּנָף
  choice: aux oiseaux de proie de toute espèce
  rationale: L’expression accumule les termes désignant l’oiseau de proie et « l’oiseau de toute aile ». La formulation française rend naturellement l’idée englobante de toutes sortes d’oiseaux prédateurs ou charognards.
- source_word: חַיַּת הַשָּׂדֶה
  choice: aux animaux sauvages des champs
  rationale: Cette expression hébraïque courante désigne les animaux sauvages vivant hors des espaces habités. « Des champs » conserve l’image du texte sans employer le mot aujourd’hui plus marqué « bêtes ».
- source_word: נְתַתִּיךָ לְאָכְלָה
  choice: Je t’ai donné en pâture
  rationale: La construction signifie que Gog est donné comme nourriture. « En pâture » restitue de façon naturelle et forte l’image de son corps abandonné aux oiseaux et aux animaux.
theological_decisions:
- issue: L’action divine dans l’image du jugement
  choice: Je t’ai donné en pâture
  alternative: Je te donnerai en pâture
  rationale: נְתַתִּיךָ est un parfait à la première personne, littéralement « je t’ai donné ». Dans le discours prophétique, il peut annoncer un acte futur comme déjà arrêté et certain. Le passé composé conserve cette forme et la force d’un jugement divin décrété, sans éliminer la tension temporelle.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement suit l’adresse directe singulière à Gog. « Tomberas » conserve l’image concrète du texte; « en pâture » maintient la vigueur solennelle de l’oracle. Les ambiguïtés lexicales liées aux « ailes » sont signalées en notes.
