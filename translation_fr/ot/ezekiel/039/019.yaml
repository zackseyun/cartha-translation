source:
  edition: WLC
  text: וַ/אֲכַלְתֶּם חֵ֣לֶב לְ/שָׂבְעָ֔ה וּ/שְׁתִ֥יתֶם דָּ֖ם לְ/שִׁכָּר֑וֹן מִ/זִּבְחִ֖/י אֲשֶׁר זָבַ֥חְתִּי לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/019.yaml
  text: You will eat fat until you are full[a], and you will drink blood to drunkenness, from my sacrifice that I have sacrificed for you.
translation:
  language: fr
  text: Vous mangerez de la graisse jusqu’à satiété et vous boirez du sang jusqu’à l’ivresse, de mon sacrifice que j’ai sacrifié pour vous.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lors du festin sacrificiel que j’ai préparé pour vous ». L’hébreu emploie littéralement le langage du sacrifice (« mon sacrifice que j’ai sacrifié »), tandis que le contexte décrit un festin où sont dévorés les morts.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: vous mangerez
  rationale: Dans ce discours prophétique adressé aux oiseaux et aux bêtes, le wayyiqtol à la 2e personne du pluriel annonce naturellement une action future.
- source_word: חֵלֶב
  choice: de la graisse
  rationale: Équivalent lexical direct qui conserve l’imagerie sacrificielle, sans ajouter l’interprétation « morceaux gras ».
- source_word: לְשָׂבְעָה
  choice: jusqu’à satiété
  rationale: Exprime l’aboutissement ou le degré de rassasiement tout en restant naturel dans un registre français digne.
- source_word: וּשְׁתִיתֶם דָּם לְשִׁכָּרוֹן
  choice: et vous boirez du sang jusqu’à l’ivresse
  rationale: Conserve le parallélisme avec la première proposition ainsi que l’image crue du sang et le substantif exprimant l’ivresse.
- source_word: מִזִּבְחִי
  choice: provenant du sacrifice
  rationale: Le nom signifie littéralement « sacrifice ». « Provenant de » rattache naturellement la graisse et le sang au sacrifice sans transformer explicitement celui-ci en festin.
- source_word: אֲשֶׁר זָבַחְתִּי לָכֶם
  choice: que j’ai sacrifié pour vous
  rationale: Maintient la répétition délibérée du nom et du verbe sacrificiels ainsi que le sens direct de לָכֶם, « pour vous ».
theological_decisions:
- issue: Imagerie sacrificielle appliquée au jugement divin
  choice: Conserver « sacrifice » et « sacrifié » dans le texte principal.
  alternative: « le festin sacrificiel que j’ai préparé pour vous »
  rationale: L’hébreu présente le jugement contre les armées de Gog sous la forme d’un sacrifice livré aux oiseaux et aux bêtes. La formulation littérale préserve la force et la sombre ironie de cette image sans l’adoucir ni lui imposer une catégorie doctrinale ultérieure.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Jusqu’à satiété » et « jusqu’à l’ivresse » rendent le parallélisme hébreu. La répétition « sacrifice… sacrifié » est volontairement conservée malgré sa rudesse, car elle est significative dans le texte source.
