  naturalness: « Jusqu’à satiété » et « jusqu’à l’ivresse » sont naturels dans un français moderne soutenu. « De mon sacrifice que j’ai sacrifié » demeure volontairement rude, mais est grammatical et reflète la répétition nominale et verbale marquée de l’hébreu.
  terminology: « Graisse », « sang », « sacrifice » et « sacrifié » préservent le vocabulaire sacrificiel sans euphémisation interprétative. L’ajout de « mon » restitue le suffixe de l’original.
