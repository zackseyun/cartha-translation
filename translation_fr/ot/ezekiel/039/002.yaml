  variant: modern international French
source:
  edition: WLC
  text: וְ/שֹׁבַבְתִּ֨י/ךָ֙ וְ/שִׁשֵּׁאתִ֔י/ךָ וְ/הַעֲלִיתִ֖י/ךָ מִ/יַּרְכְּתֵ֣י צָפ֑וֹן וַ/הֲבִאוֹתִ֖/ךָ עַל הָרֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/002.yaml
  text: I will turn you around[a], lead you on, bring you up from the far north[b], and bring you against the mountains of Israel.
translation:
  language: fr
  text: Je te ferai faire demi-tour, je te pousserai en avant[a], je te ferai monter de l’extrême nord[b] et je t’amènerai contre les montagnes d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu, difficile, a aussi été compris ainsi : « je ne laisserai subsister qu’un sixième de toi ».'
    reason: alternative_reading
  - marker: b
    text: 'Plus littéralement : « des parties les plus reculées du nord ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֹׁבַבְתִּיךָ
  choice: Je te ferai faire demi-tour
  rationale: Le verbe exprime ici l’action de faire tourner ou revenir Gog. Cette formulation naturelle souligne que Dieu dirige son mouvement sans préciser un retour vers un lieu antérieur.
- source_word: וְשִׁשֵּׁאתִיךָ
  choice: je te pousserai en avant
  rationale: La forme hébraïque est difficile. Dans la succession de verbes de déplacement, le sens de pousser ou mener plus avant est le plus cohérent et conserve la nuance de contrainte propre à l’oracle.
- source_word: וְהַעֲלִיתִיךָ
  choice: je te ferai monter
  rationale: Le hifil de עלה signifie normalement faire monter ou amener vers le haut. La traduction garde explicitement cette valeur causative et directionnelle.
- source_word: מִיַּרְכְּתֵי צָפוֹן
  choice: de l’extrême nord
  rationale: L’expression désigne les parties les plus reculées du nord. « L’extrême nord » est idiomatique en français tout en conservant l’idée d’éloignement géographique.
- source_word: וַהֲבִאוֹתִיךָ עַל
  choice: et je t’amènerai contre
  rationale: Dans ce contexte militaire, la préposition עַל indique une progression hostile contre les montagnes d’Israël plutôt qu’un simple déplacement jusqu’à elles.
- source_word: הָרֵי יִשְׂרָאֵל
  choice: les montagnes d’Israël
  rationale: Cette expression géographique récurrente chez Ézéchiel est rendue directement et conformément à l’usage français.
theological_decisions:
- issue: Interprétation de וְשִׁשֵּׁאתִיךָ, forme hébraïque difficile
  choice: 'Un verbe de mouvement : « je te pousserai en avant »'
  alternative: 'Une lecture numérique : « je ne laisserai subsister qu’un sixième de toi »'
  rationale: 'Le contexte immédiat enchaîne des actions par lesquelles Dieu dirige le déplacement de Gog : faire tourner, pousser en avant, faire monter et amener. La lecture comme verbe de mouvement respecte mieux cette progression. La lecture numérique, bien attestée dans l’histoire de la traduction mais lexicalement incertaine, est signalée en note afin de préserver l’ambiguïté.'
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « je te » reproduit l’insistance de la série verbale hébraïque. « Faire demi-tour » et « pousser en avant » rendent de façon naturelle le contrôle divin du déplacement, sans atténuer la tonalité contraignante de l’oracle.
