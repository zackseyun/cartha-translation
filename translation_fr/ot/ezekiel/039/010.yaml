  text: וְ/לֹֽא יִשְׂא֨וּ עֵצִ֜ים מִן הַ/שָּׂדֶ֗ה וְ/לֹ֤א יַחְטְבוּ֙ מִן הַ/יְּעָרִ֔ים כִּ֥י בַ/נֶּ֖שֶׁק יְבַֽעֲרוּ אֵ֑שׁ וְ/שָׁלְל֣וּ אֶת שֹׁלְלֵי/הֶ֗ם וּ/בָֽזְזוּ֙ אֶת בֹּ֣זְזֵי/הֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/010.yaml
  text: They will not carry wood from the field[a], nor cut it from the forests, because they will make fires with the weapons. They will plunder those who plundered them and loot those who looted them[b], declares the Lord Yahweh.
translation:
  language: fr
  text: Ils ne rapporteront pas de bois des champs et n’en couperont pas dans les forêts, car ils feront du feu avec les armes[a]. Ils dépouilleront ceux qui les ont dépouillés et pilleront ceux qui les ont pillés[b], déclare le Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « car, avec les armes, ils brûleront du feu » ; les armes des envahisseurs serviront de combustible.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu répète dans chaque proposition des mots de même racine : « ils dépouilleront ceux qui les ont dépouillés et pilleront ceux qui les ont pillés ». Cette répétition souligne le renversement de situation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ עֵצִים מִן הַשָּׂדֶה
  choice: rapporteront du bois des champs
  rationale: Le verbe נשׂא évoque ici le transport du bois destiné au feu. « Rapporter du bois » est naturel en français et « des champs » rend le singulier collectif הַשָּׂדֶה sans suggérer un champ précis.
- source_word: יַחְטְבוּ מִן הַיְּעָרִים
  choice: n’en couperont pas dans les forêts
  rationale: חטב désigne l’action de couper du bois. Le pronom « en » reprend « bois » avec fluidité, tandis que le pluriel « les forêts » correspond au texte hébreu.
- source_word: כִּי בַנֶּשֶׁק יְבַעֲרוּ אֵשׁ
  choice: car ils feront du feu avec les armes
  rationale: Cette formulation française naturelle conserve la relation causale de כִּי et présente les armes des envahisseurs comme le combustible des feux.
- source_word: וְשָׁלְלוּ אֶת שֹׁלְלֵיהֶם
  choice: Ils dépouilleront ceux qui les ont dépouillés
  rationale: La répétition de « dépouiller » reproduit la construction hébraïque fondée sur des mots de même racine et souligne le renversement de situation.
- source_word: וּבָזְזוּ אֶת בֹּזְזֵיהֶם
  choice: et pilleront ceux qui les ont pillés
  rationale: La répétition de « piller » préserve le second jeu de mots hébreu tout en le distinguant du premier couple lexical.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclare le Seigneur Yahweh
  rationale: « Déclare » rend la formule prophétique נְאֻם, « Seigneur » correspond à אֲדֹנָי et « Yahweh » représente explicitement le nom divin יהוה.
theological_decisions:
- issue: Traduction du nom divin יהוה après אֲדֹנָי
  choice: le Seigneur Yahweh
  alternative: le Seigneur Dieu
  rationale: Cette traduction distingue le titre אֲדֹנָי du nom propre יהוה et rend le nom divin de façon transparente, sans le remplacer par un autre titre.
- issue: Renversement entre les pillards et leurs victimes
  choice: conserver les deux répétitions lexicales parallèles
  alternative: simplifier en « ils prendront le butin de leurs ennemis »
  rationale: Le texte exprime la rétribution au moyen de deux constructions de même racine. Les conserver laisse apparaître l’insistance rhétorique sans développer une interprétation théologique supplémentaire.
translation_notes:
  register: Français international actuel, clair et digne. Les tournures concrètes sont conservées, mais l’ordre des mots et les reprises pronominales sont adaptés à un français naturel. Le parallélisme final et ses répétitions volontaires sont maintenus.
