  text: And I will strike your bow from your left hand[a], and I will make your arrows fall from your right hand.
translation:
  language: fr
  text: Je ferai tomber ton arc de ta main gauche, et je ferai tomber tes flèches de ta main droite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִכֵּיתִי
  choice: Je frapperai
  rationale: Le hiphil de נכה exprime ici l’action de frapper l’arme afin de la déloger. « Je frapperai » conserve la force concrète du verbe dans un français actuel.
- source_word: קַשְׁתְּךָ
  choice: ton arc
  rationale: Équivalent courant de קֶשֶׁת, avec restitution du suffixe masculin singulier de deuxième personne.
- source_word: מִיַּד שְׂמֹאולֶךָ
  choice: de ta main gauche
  rationale: Formulation française naturelle qui conserve l’image concrète et le parallélisme des deux mains.
- source_word: וְחִצֶּיךָ
  choice: et tes flèches
  rationale: Restitue le pluriel, le suffixe de deuxième personne et la conjonction.
- source_word: מִיַּד יְמִינְךָ
  choice: de ta main droite
  rationale: Rend idiomatiquement l’hébreu tout en préservant son parallélisme avec « de ta main gauche ».
- source_word: אַפִּיל
  choice: je ferai tomber
  rationale: 'Le hiphil de נפל est causatif : Dieu fait tomber les flèches de la main de Gog, sans que le texte précise qu’il les détruit.'
