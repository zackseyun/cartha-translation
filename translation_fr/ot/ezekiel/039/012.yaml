  text: וּ/קְבָרוּ/ם֙ בֵּ֣ית יִשְׂרָאֵ֔ל לְמַ֖עַן טַהֵ֣ר אֶת הָ/אָ֑רֶץ שִׁבְעָ֖ה חֳדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/012.yaml
  text: The house of Israel will bury them for seven months[a], in order to cleanse the land.
translation:
  language: fr
  text: La maison d’Israël les enterrera pendant sept mois afin de purifier le pays.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּקְבָרוּם
  choice: les enterrera
  rationale: Le parfait qal avec waw prend ici une valeur future dans la séquence prophétique. Le pronom « les » conserve le suffixe objet renvoyant aux cadavres ennemis.
- source_word: בֵּית יִשְׂרָאֵל
  choice: La communauté d’Israël
  rationale: Cette formulation française naturelle conserve la portée collective de l’expression hébraïque sans le calque moins courant « la maison d’Israël ».
- source_word: לְמַעַן
  choice: afin de
  rationale: Rend clairement et avec dignité la relation de but.
- source_word: טַהֵר
  choice: purifier
  rationale: Le piel de טהר évoque ici la suppression de l’impureté causée par les cadavres; « purifier » préserve à la fois la dimension rituelle et concrète.
- source_word: אֶת־הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte, הָאָרֶץ désigne le territoire d’Israël plutôt que la terre entière.
- source_word: שִׁבְעָה חֳדָשִׁים
  choice: pendant sept mois
  rationale: L’expression fonctionne comme un accusatif de durée, naturellement rendu en français par « pendant ».
theological_decisions:
- issue: Nature de la purification du pays
  choice: purifier le pays
  alternative: rendre le pays pur; nettoyer le pays
  rationale: « Purifier » maintient la dimension d’impureté rituelle liée aux cadavres sans préciser indûment un mécanisme théologique.
translation_notes:
  register: Français international moderne, clair et digne. Le collectif « communauté d’Israël » évite un calque opaque tout en gardant la portée corporative de l’hébreu.
