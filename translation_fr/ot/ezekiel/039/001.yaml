source:
  edition: WLC
  text: וְ/אַתָּ֤ה בֶן אָדָם֙ הִנָּבֵ֣א עַל גּ֔וֹג וְ/אָ֣מַרְתָּ֔ כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הִנְ/נִ֤י אֵלֶ֨י/ךָ֙ גּ֔וֹג נְשִׂ֕יא רֹ֖אשׁ מֶ֥שֶׁךְ וְ/תֻבָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/001.yaml
  text: 'And you[a], son of man, prophesy against Gog, and say: Thus says the Lord GOD: Behold, I am against you, Gog, prince of Rosh, Meshech, and Tubal.'
translation:
  language: fr
  text: 'Et toi, fils d’homme, prophétise contre Gog et dis : Ainsi parle le Seigneur Yahweh : Me voici contre toi, Gog, grand prince de Méshek et de Toubal[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « prince de Rosh, de Méshek et de Toubal ». Le mot hébreu rosh peut signifier « tête, chef » ou être compris ici comme un nom propre.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: Expression par laquelle Dieu s’adresse habituellement à Ézéchiel ; cette traduction conserve l’idiome et la continuité littéraire du livre.
- source_word: הִנָּבֵא עַל
  choice: prophétise contre
  rationale: L’impératif appelle Ézéchiel à prononcer un oracle, et עַל prend ici un sens hostile dans ce contexte de jugement.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה, sans produire la répétition « Seigneur Seigneur ».
- source_word: הִנְנִי אֵלֶיךָ
  choice: Me voici contre toi
  rationale: Formule française naturelle et solennelle qui conserve l’emphase de הִנְנִי ainsi que la valeur hostile de אֵלֶיךָ dans cet oracle.
- source_word: נְשִׂיא רֹאשׁ
  choice: prince suprême
  rationale: רֹאשׁ est compris comme un nom commun qualifiant le rang du נְשִׂיא ; « prince suprême » exprime naturellement cette relation en français.
- source_word: מֶשֶׁךְ וְתֻבָל
  choice: Méshek et Toubal
  rationale: Translittération française moderne de ces deux noms propres.
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: La traduction conserve le nom personnel יהוה sous la forme Yahweh et distingue celui-ci du titre אֲדֹנָי.
- issue: Interprétation de רֹאשׁ dans נְשִׂיא רֹאשׁ מֶשֶׁךְ וְתֻבָל
  choice: prince suprême de Méshek et de Toubal
  alternative: prince de Rosh, de Méshek et de Toubal
  rationale: La syntaxe permet de comprendre רֹאשׁ comme un nom commun indiquant la prééminence. L’analyse comme nom propre demeure possible et est signalée en note afin de préserver l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et lisible. Le tour prophétique « Ainsi parle » et la formule « Me voici contre toi » maintiennent la solennité du texte sans archaïsme excessif.
