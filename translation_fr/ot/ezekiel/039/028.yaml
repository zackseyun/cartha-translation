  rationale: La révision conserve les deux actions divines dans une structure parallèle et garde le futur antérieur, qui situe naturellement l’exil et le rassemblement avant la reconnaissance annoncée. Elle rend aussi la lecture instrumentale possible en note sans imposer une causalité plus forte que celle du texte.
