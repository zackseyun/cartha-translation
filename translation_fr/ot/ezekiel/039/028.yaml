  text: וְ/יָדְע֗וּ כִּ֣י אֲנִ֤י יְהוָה֙ אֱלֹ֣הֵי/הֶ֔ם בְּ/הַגְלוֹתִ֤/י אֹתָ/ם֙ אֶל הַ/גּוֹיִ֔ם וְ/כִנַּסְתִּ֖י/ם עַל אַדְמָתָ֑/ם וְ/לֹֽא אוֹתִ֥יר ע֛וֹד מֵ/הֶ֖ם שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/028.yaml
  text: Then they will know that I am Yahweh their God[a], when I exiled them among the nations and then gathered them onto their own land, and I will leave none of them there any longer.
translation:
  language: fr
  text: Alors ils sauront que je suis Yahweh, leur Dieu[a], lorsque je les aurai exilés parmi les nations et que je les aurai rassemblés sur leur terre. Je ne laisserai plus aucun d’eux là-bas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Ils sauront que je suis Yahweh, leur Dieu, en les exilant parmi les nations et en les rassemblant sur leur terre. »'
    reason: La préposition hébraïque peut introduire soit le moment où cette reconnaissance aura lieu, soit le moyen par lequel elle se produira.
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Alors ils sauront
  rationale: Le verbe exprime le fait de savoir ou de reconnaître. « Alors » rend naturellement la conséquence et la progression du discours portée ici par la conjonction וְ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom propre du texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵיהֶם
  choice: leur Dieu
  rationale: Le nom en état construit avec suffixe pronominal signifie littéralement « leur Dieu ».
- source_word: בְּהַגְלוֹתִי אֹתָם אֶל־הַגּוֹיִם
  choice: après les avoir exilés parmi les nations
  rationale: Le verbe גלה à cette forme présente Dieu comme l’auteur de l’exil. Dans la formulation principale, « après les avoir exilés » s’intègre à la séquence temporelle qui aboutit au rassemblement, tandis que « parmi les nations » exprime la dispersion au sein des peuples étrangers.
- source_word: וְכִנַּסְתִּים
  choice: je les aurai rassemblés
  rationale: כנס signifie « rassembler, réunir ». Le futur antérieur français situe naturellement ce rassemblement avant la reconnaissance annoncée par « ils sauront », sans transformer l’action en simple passé historique.
- source_word: עַל אַדְמָתָם
  choice: sur leur propre terre
  rationale: אַדָמָה désigne ici la terre appartenant au peuple. « Sur » correspond à עַל, et « propre » rend clairement la valeur possessive dans un français naturel.
- source_word: וְלֹא אוֹתִיר עוֹד מֵהֶם שָׁם
  choice: Je ne laisserai plus aucun d’eux là-bas
  rationale: Le hiphil de יתר signifie « laisser subsister, laisser derrière ». Le futur « laisserai » correspond à l’inaccompli hébreu, « plus » rend עוֹד sous la négation, et « là-bas » renvoie au lieu d’exil parmi les nations.
theological_decisions:
- issue: Valeur de בְּ devant בְּהַגְלוֹתִי et relation entre l’exil, le rassemblement et la connaissance de Yahweh
  choice: 'Lecture temporelle dans le texte principal : Israël reconnaîtra Yahweh lorsque la séquence exil-rassemblement aura manifesté son action.'
  alternative: 'Lecture instrumentale : ils sauront qu’il est Yahweh leur Dieu par le fait même qu’il les aura exilés puis rassemblés.'
  rationale: La préposition בְּ avec l’infinitif peut exprimer le temps ou le moyen. Le contexte favorise une progression temporelle, mais la valeur instrumentale demeure authentiquement possible et est conservée en note.
- issue: Référent de שָׁם (« là-bas »)
  choice: Les nations, lieu de l’exil
  alternative: Un lieu indiqué de façon générale sans antécédent strictement défini
  rationale: Le contraste immédiat oppose la dispersion parmi les nations au rassemblement sur la terre du peuple. La promesse signifie donc qu’aucun exilé ne restera parmi les nations.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase est divisée en deux pour éviter une coordination trop lourde. « Là-bas » distingue clairement le lieu d’exil de « leur propre terre ». Le marqueur [a] figure dans le texte principal et correspond à l’unique note.
