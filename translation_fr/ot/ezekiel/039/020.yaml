  text: וּ/שְׂבַעְתֶּ֤ם עַל שֻׁלְחָנִ/י֙ ס֣וּס וָ/רֶ֔כֶב גִּבּ֖וֹר וְ/כָל אִ֣ישׁ מִלְחָמָ֑ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/020.yaml
  text: And you will be filled at my table with horse and chariot[a], mighty man and every man of war[b], declares the Lord GOD.
translation:
  language: fr
  text: Vous vous rassasierez à ma table de chevaux et de chars[a], de vaillants guerriers[b] et de tous les hommes de guerre — déclaration du Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cheval et char » ; les formes au singulier ont probablement ici un sens collectif.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « hommes puissants » ou « vaillants hommes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׂבַעְתֶּם
  choice: Vous vous rassasierez
  rationale: Le verbe שׂבע exprime ici le fait de manger à satiété. « Se rassasier » restitue directement cette idée dans le contexte du festin sacrificiel.
- source_word: עַל שֻׁלְחָנִי
  choice: à ma table
  rationale: Bien que עַל signifie littéralement « sur », « à ma table » est l’expression française naturelle qui conserve l’image du repas.
- source_word: סוּס וָרֶכֶב
  choice: de chevaux et de chars
  rationale: Les singuliers hébreux ont vraisemblablement une valeur collective. Le pluriel est idiomatique en français et rend clairement la masse des forces et du matériel militaires dévorés.
- source_word: גִּבּוֹר
  choice: de vaillants guerriers
  rationale: גִּבּוֹר désigne un homme fort ou vaillant, souvent un guerrier. Cette expression préserve sa nuance de bravoure tout en le distinguant de la formule plus générale « hommes de guerre ».
- source_word: וְכָל אִישׁ מִלְחָמָה
  choice: et de tous les hommes de guerre
  rationale: La formulation rend étroitement l’hébreu « tout homme de guerre » et vise ici spécifiquement les combattants.
- source_word: נְאֻם
  choice: déclaration de
  rationale: Cette formule nominale conserve la solennité de l’oracle prophétique et reste intelligible en français moderne.
- source_word: אֲדֹנָי יְהוִה
  choice: du Seigneur Yahweh
  rationale: « Seigneur » rend אֲדֹנָי et « Yahweh » représente explicitement le nom divin יהוה, sans confondre les deux éléments du titre.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte associe le titre אֲדֹנָי au nom propre יהוה. « Le Seigneur Yahweh » garde visibles ces deux éléments et évite de remplacer silencieusement le nom divin par un titre.
- issue: Identification des êtres dévorés dans l’image du festin
  choice: conserver la liste concrète sans l’expliquer dans le corps du verset
  alternative: expliciter qu’il s’agit des forces ennemies vaincues
  rationale: Le verset précédent établit le cadre métaphorique. La traduction préserve ici l’image saisissante et la tension du texte au lieu d’en insérer l’interprétation.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe de la liste a été rendue naturelle par la répétition de « de ». Le tiret avant la formule prophétique marque son caractère solennel sans alourdir la phrase.
