source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה עַתָּ֗ה אָשִׁיב֙ אֶת שבית יַֽעֲקֹ֔ב וְ/רִֽחַמְתִּ֖י כָּל בֵּ֣ית יִשְׂרָאֵ֑ל וְ/קִנֵּאתִ֖י לְ/שֵׁ֥ם קָדְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/025.yaml
  text: 'Therefore thus says the Lord GOD: Now I will restore the fortunes of Jacob[a], and I will have compassion on the whole house of Israel[b], and I will be jealous for my holy name.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit le Seigneur Yahweh : Maintenant, je rétablirai la situation de Jacob[a], j’aurai compassion de toute la maison d’Israël et je manifesterai mon zèle pour mon saint nom[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je ramènerai les captifs de Jacob ». L’expression hébraïque peut désigner précisément le retour de captivité ou, plus largement, le rétablissement de la situation d’un peuple.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « je serai jaloux pour mon saint nom »; on peut aussi comprendre : « je déploierai mon zèle pour mon saint nom ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque clairement la conclusion tirée du contexte précédent, dans un français naturel.
- source_word: כֹּה אָמַר
  choice: voici ce que dit
  rationale: Rend la formule prophétique de messager de façon actuelle, digne et transparente.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Distingue le titre אֲדֹנָי du nom divin יהוה et conserve explicitement le nom d’alliance.
- source_word: עַתָּה
  choice: Maintenant
  rationale: Signale le passage décisif à l’action divine annoncée.
- source_word: אָשִׁיב אֶת שבית יַעֲקֹב
  choice: je rétablirai la situation de Jacob
  rationale: Exprime la portée large de l’idiome de restauration sans le limiter silencieusement au retour des captifs; cette lecture plus concrète figure en note.
- source_word: וְרִחַמְתִּי
  choice: j’aurai compassion
  rationale: Conserve la profondeur affective de רחם dans un français courant et digne.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: toute la maison d’Israël
  rationale: Préserve l’expression collective et communautaire du texte hébreu.
- source_word: וְקִנֵּאתִי לְשֵׁם קָדְשִׁי
  choice: je défendrai avec ardeur mon saint nom
  rationale: Communique le zèle jaloux de Dieu pour son nom sans suggérer en français moderne une envie fautive; la traduction plus littérale est conservée en note.
theological_decisions:
- issue: Traduction du nom divin יהוה dans le titre combiné
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte explicitement le nom divin; « Yahweh » le conserve tout en distinguant אֲדֹנָי, rendu par « Seigneur ».
- issue: Sens de l’idiome אֶת שבית יעקב
  choice: je rétablirai la situation de Jacob
  alternative: je ramènerai les captifs de Jacob
  rationale: L’idiome peut désigner globalement le rétablissement d’un peuple ou, plus concrètement, son retour de captivité. Le texte principal retient le sens large et la note préserve l’autre possibilité.
- issue: Nuance de קנא appliqué à Dieu
  choice: je défendrai avec ardeur mon saint nom
  alternative: je serai jaloux pour mon saint nom
  rationale: La formulation principale exprime un zèle ardent et protecteur, tandis que la note maintient la correspondance lexicale directe et sa tension théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La formule prophétique reste solennelle sans archaïsme. « Maison d’Israël » est conservé comme expression biblique collective; les ambiguïtés portant sur la restauration et le zèle jaloux sont signalées en notes.
