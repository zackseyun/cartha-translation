source:
  edition: WLC
  text: וְ/יָדְע֣וּ הַ֠/גּוֹיִם כִּ֣י בַ/עֲוֺנָ֞/ם גָּל֣וּ בֵֽית יִשְׂרָאֵ֗ל עַ֚ל אֲשֶׁ֣ר מָֽעֲלוּ בִ֔/י וָ/אַסְתִּ֥ר פָּנַ֖/י מֵ/הֶ֑ם וָֽ/אֶתְּנֵ/ם֙ בְּ/יַ֣ד צָרֵי/הֶ֔ם וַ/יִּפְּל֥וּ בַ/חֶ֖רֶב כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/023.yaml
  text: And the nations will know that the house of Israel went into exile for their iniquity[a], because they acted unfaithfully against me; so I hid my face from them and gave them into the hand of their adversaries[b], and they all fell by the sword.
translation:
  language: fr
  text: Les nations sauront que la maison d’Israël est partie en exil à cause de son iniquité, parce qu’elle m’a été infidèle[a]. Alors je leur ai caché mon visage, je les ai livrés aux mains de leurs adversaires[b], et ils sont tous tombés par l’épée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu évoque une rupture de fidélité, une conduite déloyale envers Dieu.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans la main de ses adversaires » ; cette expression hébraïque signifie être livré à leur pouvoir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ הַגּוֹיִם
  choice: Les nations sauront
  rationale: Le parfait précédé de וְ dans ce discours prophétique a une valeur future ou résultative. « Les nations » désigne ici les peuples étrangers et évite la coloration néotestamentaire de « païens ».
- source_word: בַעֲוֺנָם
  choice: à cause de son iniquité
  rationale: עָוֹן associe faute morale et culpabilité. Le singulier français reprend la maison d’Israël comme collectivité et conserve la force morale et judiciaire du terme.
- source_word: גָּלוּ בֵית יִשְׂרָאֵל
  choice: la maison d’Israël est partie en exil
  rationale: La formule collective « maison d’Israël » est conservée. « Est partie en exil » rend le verbe sans lui imposer une forme passive absente de l’hébreu.
- source_word: מָעֲלוּ בִי
  choice: elle m’a été infidèle
  rationale: מעל exprime une rupture de fidélité ou une conduite déloyale, souvent dans le cadre de la relation d’alliance. Cette formulation est naturelle en français et garde cette dimension relationnelle.
- source_word: וָאַסְתִּר פָּנַי מֵהֶם
  choice: Alors je lui ai caché mon visage
  rationale: L’image biblique du visage caché est maintenue plutôt que remplacée par une explication. « Alors » rend naturellement le lien de conséquence dans la séquence.
- source_word: וָאֶתְּנֵם בְּיַד צָרֵיהֶם
  choice: je l’ai livrée aux mains de ses adversaires
  rationale: « Livrer aux mains de » est un équivalent français clair de l’expression hébraïque qui signifie remettre au pouvoir d’autrui. « Adversaires » rend צָרִים sans réduire le mot à une nuance particulière.
- source_word: וַיִּפְּלוּ בַחֶרֶב כֻּלָּם
  choice: tous ses membres sont tombés par l’épée
  rationale: L’hébreu revient au pluriel après le collectif « maison d’Israël ». « Tous ses membres » explicite seulement ce passage grammatical nécessaire en français, tandis que « tombés par l’épée » conserve l’image solennelle de la mort violente.
theological_decisions:
- issue: Rapport entre la faute d’Israël, le visage caché de Dieu et la défaite
  choice: Présenter l’exil et la mort par l’épée comme les conséquences du jugement divin suscité par l’iniquité et l’infidélité d’Israël.
  alternative: Décrire l’exil comme un simple événement historique en atténuant l’action explicite de Dieu.
  rationale: Le texte relie directement l’exil à l’iniquité d’Israël, puis attribue à Dieu le fait de cacher son visage et de livrer le peuple à ses adversaires. La traduction conserve à la fois la responsabilité humaine et l’action judiciaire divine.
translation_notes:
  register: Français international moderne, digne et accessible. Les expressions bibliques « maison d’Israël », « cacher mon visage » et « tomber par l’épée » sont maintenues. Le passage du collectif singulier au pluriel hébreu est rendu par « tous ses membres » afin d’éviter une rupture grammaticale obscure en français.
