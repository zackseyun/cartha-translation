  text: וְ/קָֽבְרוּ֙ כָּל עַ֣ם הָ/אָ֔רֶץ וְ/הָיָ֥ה לָ/הֶ֖ם לְ/שֵׁ֑ם י֚וֹם הִכָּ֣בְדִ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/013.yaml
  text: All the people of the land will bury them[a], and it will be to their renown on the day I glorify myself[b], declares the Lord GOD.
translation:
  language: fr
  text: Tout le peuple du pays les enterrera, et cela leur vaudra de la renommée[a], le jour où je serai glorifié[b], déclare le Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cela sera pour eux comme nom » ou « pour un nom » ; cette expression hébraïque signifie que cela leur apportera honneur ou renommée.'
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « le jour où je me glorifierai » ou « le jour où je manifesterai ma gloire ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְקָבְרוּ
  choice: enterrera
  rationale: Le parfait qal avec waw dans ce discours prophétique a ici une valeur future. Le singulier français s’accorde naturellement avec le collectif « tout le peuple ».
- source_word: כָּל עַם הָאָרֶץ
  choice: tout le peuple du pays
  rationale: Dans ce contexte local d’ensevelissement, הָאָרֶץ désigne le pays plutôt que la terre entière; עַם est rendu comme un collectif.
- source_word: וְהָיָה לָהֶם לְשֵׁם
  choice: cela leur vaudra du renom
  rationale: Littéralement « cela sera pour eux comme un nom »; לְשֵׁם exprime ici la réputation ou l’honneur acquis. La formulation française restitue naturellement l’idiome sans en effacer le sens.
- source_word: יוֹם הִכָּבְדִי
  choice: le jour où je manifesterai ma gloire
  rationale: La forme niphal peut évoquer le fait que Dieu est glorifié, se glorifie ou manifeste sa gloire. Le choix principal exprime clairement la manifestation divine tout en signalant les autres possibilités en note.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclare le Seigneur Yahweh
  rationale: נְאֻם introduit la formule prophétique « déclare ». אֲדֹנָי est rendu par « le Seigneur » et le nom divin יְהוִה est translittéré « Yahweh », ce qui évite de confondre les deux termes.
theological_decisions:
- issue: Sens de יוֹם הִכָּבְדִי
  choice: le jour où je manifesterai ma gloire
  alternative: le jour où je serai glorifié; le jour où je me glorifierai
  rationale: L’hébreu permet une nuance passive, réflexive ou de manifestation. Le texte principal privilégie une expression française naturelle, tandis que la note conserve l’ambiguïté théologique réelle.
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU; le Seigneur, l’Éternel
  rationale: Le texte hébreu juxtapose le titre אֲדֹנָי et le nom propre יְהוִה. « Le Seigneur Yahweh » maintient cette distinction sans importer une lecture confessionnelle particulière.
translation_notes:
  register: Français international moderne, clair et digne. « Enterrer » est courant et précis; « ensevelir » serait plus soutenu. La construction « cela leur vaudra du renom » rend l’idiome hébreu de façon naturelle, et les notes préservent ses lectures possibles.
