  source_fidelity: 'Le sens général est bien rendu : les habitants du pays ensevelissent les morts et cet acte leur procure honneur. Toutefois, יוֹם הִכָּבְדִי est le plus directement rendu par « le jour où je serai glorifié » (niphal). « Je manifesterai ma gloire » est une interprétation possible, mais ne doit pas occuper seule le texte principal alors que la voix passive est explicite dans l’hébreu.'
