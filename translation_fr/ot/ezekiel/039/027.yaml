  text: בְּ/שׁוֹבְבִ֤/י אוֹתָ/ם֙ מִן הָ֣/עַמִּ֔ים וְ/קִבַּצְתִּ֣י אֹתָ֔/ם מֵֽ/אַרְצ֖וֹת אֹֽיְבֵי/הֶ֑ם וְ/נִקְדַּ֣שְׁתִּי בָ֔/ם לְ/עֵינֵ֖י הַ/גּוֹיִ֥ם רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/027.yaml
  text: when I bring them back from the peoples and gather them from the lands of their enemies[a], and I am shown holy through them before the eyes of many nations.
translation:
  language: fr
  text: quand je les ramènerai d’entre les peuples et que je les rassemblerai depuis les pays de leurs ennemis, je manifesterai ma sainteté par eux aux yeux de nombreuses nations.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « je serai sanctifié en eux » ou « je serai reconnu comme saint à travers eux ». Le sens est que la sainteté du Seigneur sera publiquement manifestée par ce qu’il fera pour eux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוֹבְבִי
  choice: quand je les ramènerai
  rationale: 'L’infinitif construit au hifil avec ב et le suffixe de première personne a ici une valeur temporelle et causative : « quand je les ferai revenir ». Le contexte géographique de l’exil favorise « ramener » plutôt que le plus général « rétablir ».'
- source_word: הָעַמִּים
  choice: les peuples
  rationale: « Peuples » rend עמים tout en maintenant la distinction lexicale avec גוים, rendu plus loin par « nations ».
- source_word: וְקִבַּצְתִּי
  choice: et que je les rassemblerai
  rationale: Le verbe קבץ signifie « rassembler ». Dans la construction temporelle française, la coordination avec « quand » appelle naturellement « et que » suivi du futur.
- source_word: מֵאַרְצוֹת אֹיְבֵיהֶם
  choice: depuis les pays de leurs ennemis
  rationale: ארצות est un pluriel désignant des terres ou des pays. « Depuis » marque clairement le point de départ du rassemblement, tandis que « pays de leurs ennemis » conserve le rapport génitif.
- source_word: וְנִקְדַּשְׁתִּי בָם
  choice: je manifesterai ma sainteté par eux
  rationale: Le nifal de קדש avec Dieu pour sujet exprime ici la manifestation publique de sa sainteté. Cette formulation naturelle évite de suggérer que Dieu acquiert la sainteté, tout en rendant בם par « par eux ».
- source_word: לְעֵינֵי
  choice: aux yeux de
  rationale: Cette expression française conserve l’image hébraïque et exprime la visibilité publique.
- source_word: הַגּוֹיִם רַבִּים
  choice: de nombreuses nations
  rationale: גוים désigne ici les nations au sens international. « De nombreuses nations » est idiomatique en français et conserve la pluralité du témoignage public.
theological_decisions:
- issue: Langage de la sanctification divine
  choice: je manifesterai ma sainteté par eux
  alternative: je serai sanctifié en eux
  rationale: Le texte présente la sainteté de Dieu comme publiquement reconnue ou manifestée par son action envers Israël, sans impliquer un changement dans sa sainteté intrinsèque. La note conserve la formulation plus littérale et l’ambiguïté de la préposition ב.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la distinction entre « peuples » et « nations », ainsi que l’image « aux yeux de ». Le futur convient au cadre prophétique et à la subordonnée temporelle française.
