  source_fidelity: 'Le texte principal rend correctement la construction temporelle (« quand »), le retour d’exil, le rassemblement depuis les pays ennemis, et la manifestation publique de la sainteté divine. « Je manifesterai ma sainteté par eux » est une explicitation recevable du nifal de קדש avec Dieu comme sujet, bien que la voix passive du texte reste plus directe dans la note. La note doit toutefois éviter de présenter « par eux » comme une traduction littérale de בם : la préposition signifie plus directement « en eux » et peut, selon le contexte, être comprise comme « à travers eux ».'
