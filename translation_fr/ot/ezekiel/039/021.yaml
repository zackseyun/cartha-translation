  text: וְ/נָתַתִּ֥י אֶת כְּבוֹדִ֖/י בַּ/גּוֹיִ֑ם וְ/רָא֣וּ כָל הַ/גּוֹיִ֗ם אֶת מִשְׁפָּטִ/י֙ אֲשֶׁ֣ר עָשִׂ֔יתִי וְ/אֶת יָדִ֖/י אֲשֶׁר שַׂ֥מְתִּי בָ/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/021.yaml
  text: And I will set my glory among the nations[a], and all the nations will see my judgment that I have executed[b], and my hand that I have laid on them.
translation:
  language: fr
  text: Je mettrai ma gloire parmi les nations, et toutes les nations verront le jugement[a] que j’aurai exécuté et la main[b] que j’aurai posée sur eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la justice que j’aurai exercée » ou « accomplie ».
    reason: lexical_alternative
  - marker: b
    text: Dans cet idiome hébreu, la « main » de Dieu représente sa puissance à l’œuvre, ici particulièrement dans le jugement.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתִּי אֶת־כְּבוֹדִי
  choice: Je manifesterai ma gloire
  rationale: Littéralement, נתן signifie « donner, placer ». Avec « ma gloire » et dans ce contexte où les nations la voient à travers l’action divine, « manifester » exprime naturellement en français l’idée de rendre la gloire visible, sans la réduire à un honneur abstrait.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: גּוֹיִם désigne ici l’ensemble des peuples étrangers. « Parmi les nations » est actuel, naturel et dépourvu de connotations néotestamentaires indues.
- source_word: וְרָאוּ כָל־הַגּוֹיִם
  choice: et toutes les nations verront
  rationale: Le futur convient au déroulement prophétique et restitue directement le sens du verbe « voir ».
- source_word: מִשְׁפָּטִי אֲשֶׁר עָשִׂיתִי
  choice: le jugement que j’aurai exécuté
  rationale: מִשְׁפָּט peut désigner le jugement ou la justice. Ici, il s’agit de l’acte judiciaire de Dieu. Le futur antérieur français situe naturellement son exécution avant le moment où les nations en constateront le résultat.
- source_word: יָדִי
  choice: la main
  rationale: L’image hébraïque de la main, qui représente la puissance divine en action, est conservée plutôt que remplacée par une explicitation.
- source_word: אֲשֶׁר שַׂמְתִּי בָהֶם
  choice: que j’aurai fait peser sur eux
  rationale: Cette expression française conserve l’image concrète de la main tout en rendant clairement son emploi judiciaire. « Eux » évite de rattacher artificiellement le masculin hébreu au nom français féminin « nations ».
theological_decisions:
- issue: Sens de la gloire de Dieu parmi les nations
  choice: Sa majesté rendue manifeste par ses actes de jugement
  alternative: Son honneur considéré de manière abstraite
  rationale: Le contexte immédiat associe cette gloire au jugement et à la main de Dieu que les nations verront.
- issue: Portée de « ma main »
  choice: Métaphore de la puissance active de Dieu dans le jugement, conservée dans le texte
  alternative: Remplacer directement l’image par « ma puissance »
  rationale: L’image prophétique est intelligible et théologiquement forte; la note en précise le sens sans l’aplanir.
- issue: Référent de בָהֶם (« sur eux »)
  choice: Conserver le pronom masculin « eux » sans identifier davantage son référent
  alternative: Écrire « sur elles » en le rattachant explicitement aux nations
  rationale: Le suffixe hébreu est masculin pluriel. Le rendre par « elles » créerait en français un rattachement plus précis à « nations » que ne l’impose la forme source.
translation_notes:
  register: Français international moderne, digne et lisible. Le rythme coordonné du verset hébreu est conservé. « Faire peser la main » rend l’image de façon idiomatique sans supprimer la métaphore.
