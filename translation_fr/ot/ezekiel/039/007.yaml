source:
  edition: WLC
  text: וְ/אֶת שֵׁ֨ם קָדְשִׁ֜/י אוֹדִ֗יעַ בְּ/תוֹךְ֙ עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/לֹֽא אַחֵ֥ל אֶת שֵׁם קָדְשִׁ֖/י ע֑וֹד וְ/יָדְע֤וּ הַ/גּוֹיִם֙ כִּי אֲנִ֣י יְהוָ֔ה קָד֖וֹשׁ בְּ/יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/007.yaml
  text: And I will make my holy name known in the midst of my people Israel[a], and I will no longer let my holy name be profaned; and the nations will know that I am Yahweh[b], the Holy One in Israel.
translation:
  language: fr
  text: Je ferai connaître mon saint nom au milieu de mon peuple, Israël, et je ne laisserai plus profaner mon saint nom[a]. Les nations sauront que je suis Yahweh, le Saint en Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « je ne profanerai plus mon saint nom ». Le verbe hébreu permet cette traduction, mais, dans le contexte, il signifie probablement que Dieu ne permettra plus que son nom soit profané.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « que je suis Yahweh, saint en Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם קָדְשִׁי
  choice: mon saint nom
  rationale: Cette tournure française naturelle rend l’expression hébraïque désignant le nom révélé de Dieu, associé à sa sainteté et à sa réputation.
- source_word: אוֹדִיעַ
  choice: je ferai connaître
  rationale: Le hiphil de ידע a ici une valeur causative, et son complément direct est « mon saint nom ».
- source_word: בְּתוֹךְ עַמִּי יִשְׂרָאֵל
  choice: au milieu de mon peuple, Israël
  rationale: « Au milieu de » conserve l’image concrète de la présence au sein du peuple; la virgule rend clairement l’apposition qui identifie ce peuple comme Israël.
- source_word: אַחֵל
  choice: je ne laisserai plus profaner
  rationale: Le hiphil de חלל peut être compris activement ou dans un sens permissif. Le contexte de la manifestation et de la défense du saint nom de Dieu favorise ici le sens permissif, sans effacer la lecture plus formelle donnée en note.
- source_word: הַגּוֹיִם
  choice: les nations
  rationale: Dans ce contexte, le terme désigne collectivement les peuples autres qu’Israël; « les nations » est plus exact et moins chargé que « les païens ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: קָדוֹשׁ בְּיִשְׂרָאֵל
  choice: le Saint en Israël
  rationale: Cette formulation naturelle en français fait ressortir la valeur quasi titulaire de קָדוֹשׁ tout en maintenant le lien spatial et relationnel exprimé par בְּיִשְׂרָאֵל.
theological_decisions:
- issue: Sens de וְלֹא אַחֵל אֶת שֵׁם קָדְשִׁי עוֹד
  choice: je ne laisserai plus profaner mon saint nom
  alternative: je ne profanerai plus mon saint nom
  rationale: La forme hébraïque permet les deux formulations. Dans le contexte d’Ézéchiel 39, Dieu met fin à la profanation de son nom parmi les peuples; le sens permissif convient donc au contexte, tandis que la lecture active plus littérale est conservée en note.
- issue: Valeur syntaxique de קָדוֹשׁ בְּיִשְׂרָאֵל
  choice: Yahweh, le Saint en Israël
  alternative: Yahweh, saint en Israël
  rationale: L’hébreu peut présenter קָדוֹשׁ comme une désignation substantivée ou comme un adjectif prédicatif. Le texte principal retient la première possibilité, plus idiomatique en français, et la seconde figure en note.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme; « Yahweh » préserve le nom personnel et évite de le remplacer silencieusement par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu sans devenir artificielle; les ambiguïtés réelles concernant le verbe « profaner » et la fonction de « saint » sont explicitement conservées dans les notes.
