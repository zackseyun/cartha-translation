  text: כְּ/טֻמְאָתָ֥/ם וּ/כְ/פִשְׁעֵי/הֶ֖ם עָשִׂ֣יתִי אֹתָ֑/ם וָ/אַסְתִּ֥ר פָּנַ֖/י מֵ/הֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/024.yaml
  text: According to their uncleanness and according to their transgressions I dealt with them[a], and I hid my face from them.
translation:
  language: fr
  text: Je les ai traités selon leur impureté et leurs transgressions[a], et je leur ai caché mon visage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « J’ai agi envers eux à la mesure de leur impureté et de leurs rébellions. »'
    reason: 'Alternative lexicale et syntaxique : le préfixe כְ peut exprimer la conformité ou la mesure, et פֶּשַׁע peut souligner la dimension de rébellion.'
lexical_decisions:
- source_word: כְּטֻמְאָתָם
  choice: selon leur impureté
  rationale: Le préfixe כְּ exprime ici la conformité ou la mesure. « Impureté » conserve la portée rituelle et morale de טֻמְאָה dans Ézéchiel, tout en étant naturel en français moderne.
- source_word: וּכְפִשְׁעֵיהֶם
  choice: et leurs révoltes
  rationale: פֶּשַׁע désigne des transgressions ayant une forte dimension de rébellion contre Dieu. « Révoltes » rend cette force relationnelle et religieuse sans l’atténuer en simples fautes.
- source_word: עָשִׂיתִי אֹתָם
  choice: Je les ai traités
  rationale: Dans ce contexte, עשה avec un complément de personne signifie agir envers quelqu’un ou le traiter, et non le fabriquer. Cette tournure française est idiomatique et convient au jugement évoqué.
- source_word: וָאַסְתִּר פָּנַי מֵהֶם
  choice: et je leur ai caché mon visage
  rationale: La formulation garde l’image hébraïque du visage caché, qui évoque le retrait de la faveur ou de la présence divine sans réduire la métaphore à une seule explication.
theological_decisions:
- issue: Sens de l’impureté dans le contexte prophétique
  choice: impureté
  alternative: souillure
  rationale: Le terme peut englober l’impureté rituelle et la corruption morale. « Impureté » préserve cette amplitude, tandis que « souillure » accentuerait davantage l’image de contamination.
- issue: Force de פֶּשַׁע
  choice: révoltes
  alternative: transgressions
  rationale: « Révoltes » met en évidence l’opposition envers Dieu souvent portée par le terme, tandis que « transgressions » reste possible mais moins courant en français ordinaire.
- issue: Métaphore du visage divin caché
  choice: conserver « je leur ai caché mon visage »
  alternative: je me suis détourné d’eux
  rationale: La conservation de l’image respecte la formulation prophétique et maintient sa tension théologique entre retrait de présence, de faveur et de protection.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste naturelle tout en conservant l’image biblique du visage caché et la relation de mesure entre leur conduite et le traitement reçu.
