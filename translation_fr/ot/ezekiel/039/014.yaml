revisions:
- from: Ils mettront continuellement à part des hommes[a] qui parcourront le pays, ensevelissant ceux qui le parcourent[b], ceux qui seront restés à la surface du pays, afin de le purifier. Au bout de sept mois, ils mèneront des recherches[c].
  to: Ils désigneront de façon permanente des hommes[a] qui parcourront le pays et qui enseveliront, avec ceux qui le parcourent[b], ceux qui seront restés à la surface du pays, afin de le purifier. Au terme de sept mois, ils feront des recherches approfondies[c].
  rationale: La révision corrige la relation syntaxique entre les deux emplois de « parcourir » et « ceux qui sont restés », tout en maintenant la répétition voulue et l’incertitude du texte en note. Elle améliore également l’idiomaticité du français et conserve les termes essentiels du passage.
