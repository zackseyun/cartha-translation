  text: וְ/אַנְשֵׁ֨י תָמִ֤יד יַבְדִּ֨ילוּ֙ עֹבְרִ֣ים בָּ/אָ֔רֶץ מְקַבְּרִ֣ים אֶת הָ/עֹבְרִ֗ים אֶת הַ/נּוֹתָרִ֛ים עַל פְּנֵ֥י הָ/אָ֖רֶץ לְ/טַֽהֲרָ֑/הּ מִ/קְצֵ֥ה שִׁבְעָֽה חֳדָשִׁ֖ים יַחְקֹֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/014.yaml
  text: And they will set apart men continually[a], who will pass through the land burying those who pass through, those left on the surface of the land, to cleanse it[c][b]. At the end of seven months they will make a search.
translation:
  language: fr
  text: Ils désigneront de façon permanente des hommes[a] qui parcourront le pays et qui enseveliront, avec ceux qui le parcourent[b], ceux qui seront restés à la surface du pays, afin de le purifier. Au terme de sept mois, ils feront des recherches approfondies[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils affecteront régulièrement des hommes ». L’hébreu dit littéralement « des hommes de continuité » et évoque une mission durable.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu répète le verbe « parcourir ». La construction est difficile : le premier « ceux qui parcourent » peut être compris comme un complément de compagnie, « avec ceux qui parcourent [le pays] », tandis que « ceux qui sont restés » désigne vraisemblablement les morts laissés sur le sol.'
    reason: lexical_alternative
  - marker: c
    text: Ou « ils chercheront minutieusement » ou « ils feront une enquête ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי תָמִיד
  choice: continuellement … des hommes
  rationale: L’expression construite signifie littéralement « des hommes de continuité » et indique une affectation durable. La tournure française, associée à « mettre à part », exprime cette permanence sans transformer explicitement le verbe en « nommer ».
- source_word: יַבְדִּילוּ
  choice: ils mettront … à part
  rationale: Le hiphil de בדל signifie « séparer, mettre à part ». Dans ce cadre organisé, il implique une désignation pour une tâche, tout en conservant ici son sens formel.
- source_word: עֹבְרִים בָּאָרֶץ
  choice: qui parcourront le pays
  rationale: Le participe de עבר décrit les hommes chargés de circuler à travers tout le pays. Une relative au futur est naturelle en français dans cette annonce prophétique.
- source_word: מְקַבְּרִים
  choice: ensevelissant
  rationale: Le participe de קבר présente l’ensevelissement comme l’action concomitante de ceux qui parcourent le pays.
- source_word: הָעֹבְרִים
  choice: ceux qui le parcourent
  rationale: La reprise de עבר est conservée malgré sa difficulté. Le contexte indique vraisemblablement des morts trouvés dans le pays, mais la traduction principale n’explicite pas davantage que l’hébreu cette relation.
- source_word: הַנּוֹתָרִים עַל־פְּנֵי הָאָרֶץ
  choice: ceux qui seront restés à la surface du pays
  rationale: La formulation conserve l’idée de personnes ou de corps demeurés exposés sur le pays, sans donner à אֶרֶץ le sens global de « terre entière ».
- source_word: לְטַהֲרָהּ
  choice: afin de le purifier
  rationale: טהר peut englober ici la purification du pays souillé par les cadavres et son nettoyage concret. « Purifier » maintient ces deux dimensions.
- source_word: מִקְצֵה שִׁבְעָה חֳדָשִׁים
  choice: Au bout de sept mois
  rationale: Cette expression marque le point à partir duquel commence l’étape suivante. « Au bout de » est idiomatique et précis en français.
- source_word: יַחְקֹרוּ
  choice: ils mèneront des recherches
  rationale: חקר désigne une recherche ou une investigation approfondie et organisée. Cette formulation rend le caractère méthodique de l’opération.
theological_decisions:
- issue: Nature de la purification du pays
  choice: Employer « purifier » sans préciser davantage la nature de l’action.
  alternative: Réduire le sens à une purification exclusivement rituelle ou à un simple nettoyage matériel.
  rationale: L’ensevelissement des cadavres exposés comporte dans Ézéchiel une dimension de souillure, mais le passage associe aussi cette purification à une opération concrète. La traduction préserve les deux dimensions.
- issue: Identité de « ceux qui parcourent »
  choice: Conserver la répétition difficile de עבר et expliquer l’ambiguïté en note.
  alternative: Traduire directement par « les morts » ou « les cadavres ».
  rationale: Le contexte funéraire rend probable une référence aux morts restés sur le sol, mais le texte hébreu répète le vocabulaire du passage à travers le pays. L’expliciter dans le corps du texte supprimerait une ambiguïté réelle.
translation_notes:
  register: Français international actuel, soutenu mais accessible. Le futur convient au contexte prophétique. La répétition volontaire de « parcourir » reproduit la difficulté de l’hébreu; les notes offrent les principales solutions sans imposer une interprétation.
