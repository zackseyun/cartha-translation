    issue: Analyse syntaxique de אֶת־הָעֹבְרִים
    rationale: Le brouillon traite « ceux qui le parcourent » comme la personne ensevelie, puis « ceux qui seront restés » comme une apposition. La construction hébraïque se comprend plus probablement comme « avec ceux qui parcourent [le pays], ensevelissant ceux qui restent ». Il convient de rendre cette possibilité de façon lisible et de signaler la difficulté.
  - severity: low
    issue: Formulation de l’affectation continue
    rationale: « Ils mettront continuellement à part des hommes » place l’adverbe de manière ambiguë et sonne calqué. « Ils désigneront de façon permanente des hommes » exprime plus idiomatiquement une affectation durable.
  - severity: low
    issue: Note b insuffisamment précise
    rationale: 'La note actuelle explique la répétition lexicale mais non la difficulté grammaticale déterminante : le premier אֶת peut être compris au sens de « avec ». Une note révisée permet de préserver l’ambiguïté textuelle.'
