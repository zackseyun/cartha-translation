  text: וְ/שִׁלַּחְתִּי אֵ֣שׁ בְּ/מָג֔וֹג וּ/בְ/יֹשְׁבֵ֥י הָ/אִיִּ֖ים לָ/בֶ֑טַח וְ/יָדְע֖וּ כִּי אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/006.yaml
  text: And I will send fire on Magog and on those who live securely in the coastlands[a], and they will know that I am Yahweh.
translation:
  language: fr
  text: J’enverrai du feu sur Magog et sur ceux qui habitent en sécurité dans les régions côtières[a], et ils sauront que je suis Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les îles ». Le terme hébreu peut désigner des îles ou, plus largement dans les textes prophétiques, des régions côtières lointaines.
    reason: alternative lexicale
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: J’enverrai
  rationale: Le hifil accompli avec waw, dans ce discours prophétique prononcé par Dieu, exprime naturellement une action future. « J’enverrai » reste proche du sens de שׁלח et convient avec « le feu » comme complément.
- source_word: אֵשׁ
  choice: le feu
  rationale: La traduction littérale conserve à la fois le sens lexical et l’image prophétique du jugement, sans expliciter cette image dans le texte.
- source_word: בְּמָגוֹג
  choice: sur Magog
  rationale: Avec l’envoi d’un feu destructeur, la préposition בְּ désigne ici sa cible ; « sur Magog » est naturel en français et conserve Magog comme nom propre.
- source_word: וּבְיֹשְׁבֵי הָאִיִּים
  choice: et sur ceux qui habitent … dans les régions côtières
  rationale: Le participe construit יֹשְׁבֵי désigne « ceux qui habitent ». הָאִיִּים peut désigner des îles ou, plus largement dans les textes prophétiques, des contrées maritimes ; « régions côtières » rend naturellement cette portée géographique.
- source_word: לָבֶטַח
  choice: en sécurité
  rationale: Cette locution rend l’état de sûreté exprimé par לָבֶטַח et se rattache naturellement en français à ceux qui habitent les régions côtières.
- source_word: וְיָדְעוּ
  choice: et ils sauront
  rationale: Le futur simple maintient la suite verbale hébraïque, tandis que « et » conserve le lien explicite sans ajouter une nuance temporelle absente du texte.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin représenté par le tétragramme, plutôt qu’un remplacement par le titre « le Seigneur ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte emploie directement le nom divin. La forme française « Yahvé » préserve son caractère de nom propre au lieu de lui substituer un titre.
- issue: Portée syntaxique de לָבֶטַח
  choice: 'rattaché aux habitants des régions côtières : « ceux qui habitent en sécurité »'
  alternative: rattachement plus lâche à l’ensemble de la proposition
  rationale: La syntaxe rattache le plus naturellement לָבֶטַח au groupe participial décrivant les habitants. La traduction conserve ce lien sans étendre la sécurité à Magog.
translation_notes:
  register: Français moderne, international et digne. La formulation reste proche de la structure hébraïque tout en étant naturelle ; elle conserve l’image concrète du feu et l’ambiguïté géographique de הָאִיִּים au moyen d’une note.
