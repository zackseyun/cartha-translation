source:
  edition: WLC
  text: וּ/לְ/אֵ֨לֶּה֙ אָמַ֣ר בְּ/אָזְנַ֔/י עִבְר֥וּ בָ/עִ֛יר אַחֲרָ֖י/ו וְ/הַכּ֑וּ על תָּחֹ֥ס עיני/כם וְ/אַל תַּחְמֹֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/005.yaml
  text: And to the others he said in my hearing[a], “Pass through the city after him and strike; do not let your eye spare, and do not show pity.”
translation:
  language: fr
  text: 'Puis je l’entendis dire aux autres : « Parcourez la ville derrière lui et frappez. Que vos yeux n’épargnent pas, et n’ayez pas de compassion. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְאֵלֶּה
  choice: Puis il dit aux autres
  rationale: Le démonstratif désigne les autres exécuteurs, par contraste avec l’homme vêtu de lin au verset précédent. « Aux autres » exprime naturellement ce lien contextuel.
- source_word: אָמַר בְּאָזְנַי
  choice: de manière que je l’entende
  rationale: 'Littéralement « il dit à mes oreilles » : l’expression souligne qu’Ézéchiel entend directement l’ordre. Cette formulation française en restitue le sens sans conserver un idiome hébreu peu naturel.'
- source_word: עִבְרוּ בָעִיר
  choice: Parcourez la ville
  rationale: Le verbe עבר commande ici de se déplacer à travers la ville. « Parcourez » est naturel en français et convient à l’exécution méthodique de l’ordre.
- source_word: אַחֲרָיו
  choice: derrière lui
  rationale: Le pronom renvoie à l’homme vêtu de lin. « Derrière lui » indique clairement que les autres doivent suivre son passage.
- source_word: וְהַכּוּ
  choice: et frappez
  rationale: נכה signifie frapper ou abattre. « Frappez » conserve l’étendue lexicale du verbe sans atténuer le caractère meurtrier que la suite du contexte rend explicite.
- source_word: עַל תָּחֹס עֵינֵיכֶם
  choice: Que votre regard soit sans pitié
  rationale: 'Le texte massorétique se comprend comme une interdiction : « que votre œil n’épargne pas ». La formulation choisie garde l’image du regard tout en étant idiomatique en français.'
- source_word: וְאַל תַּחְמֹלוּ
  choice: et n’ayez aucune compassion
  rationale: חמל interdit d’éprouver ou de manifester la compassion. Cette traduction distingue légèrement ce membre du précédent tout en conservant leur parallélisme intensif.
theological_decisions:
- issue: Sévérité de l’ordre de jugement
  choice: L’ordre est rendu sans atténuer sa violence ni lui ajouter d’explication théologique.
  alternative: Employer un euphémisme qui réduirait la force de « frappez » ou expliciterait dès ce verset « tuez ».
  rationale: L’hébreu présente un ordre de jugement brutal. « Frappez » respecte le lexème, tandis que le contexte immédiat en manifeste la portée létale.
- issue: Rapport entre les deux interdictions finales
  choice: 'Les deux expressions sont conservées comme des formulations parallèles mais non identiques : « regard sans pitié » et « aucune compassion ».'
  alternative: Fusionner les deux membres en une seule interdiction générale de prendre pitié.
  rationale: Le parallélisme accumule les interdictions et intensifie l’absence de clémence; il ne faut pas l’aplanir.
translation_notes:
  register: Français international moderne, digne et direct. L’impératif et la dureté de la scène sont maintenus. La note conserve l’image corporelle de l’hébreu, tandis que le texte principal privilégie une formulation française naturelle.
