id: EZK.9.10
reference: Ezekiel 9:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/גַ֨ם אֲנִ֔י לֹא תָח֥וֹס עֵינִ֖/י וְ/לֹ֣א אֶחְמֹ֑ל דַּרְכָּ֖/ם בְּ/רֹאשָׁ֥/ם נָתָֽתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/010.yaml
  text: And as for me[a], my eye will not spare, nor will I show pity[b]; I have brought their way upon their heads.
translation:
  language: fr
  text: Quant à moi, mon regard sera sans pitié et je n’aurai aucune compassion. Je ferai retomber leur conduite[a] sur leur tête[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leur chemin » ; en hébreu, cette expression peut désigner la manière de vivre ou la conduite.'
    reason: lexical_alternative
  - marker: b
    text: « Sur leur tête » est une expression hébraïque évoquant la rétribution qui revient sur les coupables.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Quant à moi
  rationale: L’expression marque ici l’insistance et le contraste. « Quant à moi » les rend naturellement en français sans ajouter un « aussi » pesant.
- source_word: לֹא תָחוֹס עֵינִי
  choice: mon regard sera sans pitié
  rationale: Littéralement, l’hébreu dit que l’œil de Dieu n’épargnera pas. « Mon regard sera sans pitié » conserve l’image du regard tout en exprimant clairement l’absence de clémence en français courant.
- source_word: וְלֹא אֶחְמֹל
  choice: et je n’aurai aucune compassion
  rationale: Cette formulation maintient le parallélisme avec le membre précédent et rend explicitement le refus de compatir, sans répétition maladroite.
- source_word: דַּרְכָּם
  choice: leur conduite
  rationale: Le singulier hébreu « leur chemin » désigne idiomatiquement leur manière d’agir. « Leur conduite » communique directement ce sens moral en français moderne.
- source_word: בְּרֹאשָׁם נָתָתִּי
  choice: Je ferai retomber … sur leur tête
  rationale: La formule hébraïque exprime la rétribution qui atteint les coupables. Le futur français convient à la déclaration de jugement dans le contexte, tandis que « sur leur tête » en conserve l’image.
theological_decisions:
- issue: Sévérité du jugement divin et absence de compassion
  choice: Le texte déclare sans atténuation que Dieu n’accordera ni pitié ni compassion et fera retomber sur les coupables leur propre conduite.
  alternative: Expliciter davantage par « les conséquences de leur conduite » ou adoucir la formule concernant la compassion.
  rationale: L’hébreu énonce un jugement sans réserve. La traduction en conserve la force et la tension théologique sans ajouter d’explication doctrinale ni réduire sa sévérité.
- issue: Valeur temporelle de נָתָתִּי
  choice: Je ferai retomber
  alternative: J’ai fait retomber / je fais retomber
  rationale: Bien que la forme hébraïque soit un accompli, elle présente ici le jugement annoncé comme arrêté et certain. Le futur est le moyen le plus naturel de l’exprimer dans le fil du discours français.
translation_notes:
  register: Français international moderne, digne et direct. La traduction garde le parallélisme du jugement et une trace de l’image concrète du regard, tout en rendant idiomatiquement les expressions hébraïques.
