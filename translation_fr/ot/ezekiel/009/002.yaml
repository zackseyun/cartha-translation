id: EZK.9.2
reference: Ezekiel 9:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה שִׁשָּׁ֣ה אֲנָשִׁ֡ים בָּאִ֣ים מִ/דֶּרֶךְ שַׁ֨עַר הָ/עֶלְי֜וֹן אֲשֶׁ֣ר מָפְנֶ֣ה צָפ֗וֹנָ/ה וְ/אִ֨ישׁ כְּלִ֤י מַפָּצ/וֹ֙ בְּ/יָד֔/וֹ וְ/אִישׁ אֶחָ֤ד בְּ/תוֹכָ/ם֙ לָבֻ֣שׁ בַּדִּ֔ים וְ/קֶ֥סֶת הַ/סֹּפֵ֖ר בְּ/מָתְנָ֑י/ו וַ/יָּבֹ֨אוּ֙ וַ/יַּ֣עַמְד֔וּ אֵ֖צֶל מִזְבַּ֥ח הַ/נְּחֹֽשֶׁת׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/002.yaml
  text: And behold[a], six men were coming from the direction of the upper gate, which faces north, each with his weapon for smashing in his hand; and one man among them was clothed in linen, with a scribe’s writing case at his waist[b]. And they came and stood beside the bronze altar.
translation:
  language: fr
  text: 'Et voici[a] : six hommes arrivaient du côté de la porte supérieure, celle qui fait face au nord. Chacun tenait à la main son arme pour fracasser[b]. Au milieu d’eux se trouvait un homme vêtu de lin, avec le nécessaire d’écriture d’un scribe à la ceinture[c]. Ils vinrent se placer près de l’autel de bronze.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression introduit avec vivacité ce qu’Ézéchiel voit soudain dans la vision.
    reason: discourse_feature
  - marker: b
    text: Ou « son arme de destruction ». Le mot hébreu désigne un instrument servant à briser ou fracasser, mais le type exact d’arme reste incertain.
    reason: lexical_alternative
  - marker: c
    text: 'Traditionnellement : « l’encrier d’un scribe à la ceinture ». Le terme peut désigner un étui ou nécessaire contenant le matériel d’écriture.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: Conserve la force déictique et soudaine de la vision dans un français narratif digne et naturel.
- source_word: שִׁשָּׁה אֲנָשִׁים
  choice: six hommes
  rationale: Le texte emploie explicitement un pluriel masculin et décrit les agents selon leur apparence dans la vision.
- source_word: בָּאִים
  choice: arrivaient
  rationale: L’imparfait rend la valeur progressive du participe hébreu et présente les hommes en train d’approcher.
- source_word: מִדֶּרֶךְ שַׁעַר הָעֶלְיוֹן
  choice: du côté de la porte supérieure
  rationale: Expression française naturelle qui indique la provenance ou la direction de l’approche sans préciser excessivement l’itinéraire.
- source_word: אֲשֶׁר מָפְנֶה צָפוֹנָה
  choice: celle qui fait face au nord
  rationale: Rend clairement l’orientation architecturale indiquée par l’hébreu.
- source_word: וְאִישׁ כְּלִי מַפָּצוֹ בְּיָדוֹ
  choice: Chacun tenait à la main son arme pour fracasser
  rationale: מַפָּץ désigne un instrument servant à briser ou fracasser. Cette formulation conserve la fonction destructrice sans déterminer abusivement le type précis d’arme.
- source_word: וְאִישׁ אֶחָד בְּתוֹכָם
  choice: Au milieu d’eux se trouvait un homme
  rationale: Rend à la fois la présence d’un homme distinct et sa position au sein du groupe.
- source_word: לָבֻשׁ בַּדִּים
  choice: vêtu de lin
  rationale: Formulation concise et digne qui conserve la matière du vêtement sans ajouter explicitement une interprétation sacerdotale.
- source_word: קֶסֶת הַסֹּפֵר
  choice: le nécessaire d’écriture d’un scribe
  rationale: Désigne de façon compréhensible l’équipement du scribe tout en évitant le terme vieilli et trop spécifique « encrier ».
- source_word: בְּמָתְנָיו
  choice: à la ceinture
  rationale: Expression idiomatique indiquant que le nécessaire d’écriture est porté au niveau de la taille.
- source_word: וַיָּבֹאוּ וַיַּעַמְדוּ
  choice: Ils vinrent se placer
  rationale: Rend la succession narrative des deux verbes et exprime naturellement l’arrivée suivie de la prise de position.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: l’autel de bronze
  rationale: Traduction usuelle et claire de la désignation matérielle de l’autel.
theological_decisions:
- issue: Identité et nature des six hommes et de l’homme vêtu de lin
  choice: Les désigner phénoménologiquement comme des « hommes », conformément à ce qu’Ézéchiel voit.
  alternative: Les identifier dans le texte comme des anges exécuteurs et un scribe angélique.
  rationale: Le contexte peut suggérer des agents célestes, mais l’hébreu les présente comme des hommes. La traduction ne tranche donc pas leur nature au-delà de la description visionnaire.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme visionnaire est conservé par « Et voici » et l’imparfait « arrivaient ». Les termes techniques sont rendus de manière intelligible sans archaïsme ni précision non garantie par l’hébreu.
