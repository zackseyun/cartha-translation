source:
  edition: WLC
  text: זָקֵ֡ן בָּח֣וּר וּ/בְתוּלָה֩ וְ/טַ֨ף וְ/נָשִׁ֜ים תַּהַרְג֣וּ לְ/מַשְׁחִ֗ית וְ/עַל כָּל אִ֨ישׁ אֲשֶׁר עָלָ֤י/ו הַ/תָּו֙ אַל תִּגַּ֔שׁוּ וּ/מִ/מִּקְדָּשִׁ֖/י תָּחֵ֑לּוּ וַ/יָּחֵ֨לּוּ֙ בָּ/אֲנָשִׁ֣ים הַ/זְּקֵנִ֔ים אֲשֶׁ֖ר לִ/פְנֵ֥י הַ/בָּֽיִת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/006.yaml
  text: Old man[a], young man, and virgin, and little children, and women—you shall kill them utterly. But do not come near anyone on whom is the mark, and begin at my sanctuary[b]. So they began with the old men who were before the house.
translation:
  language: fr
  text: Vieillard, jeune homme et jeune fille vierge, petits enfants et femmes, tuez-les tous. Mais ne vous approchez de personne qui porte la marque[a]. Commencez par mon sanctuaire. Ils commencèrent donc par les hommes âgés[b] qui se trouvaient devant le Temple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « le taw », c’est-à-dire la marque protectrice apposée sur les fidèles (voir v. 4).
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les anciens ».'
    reason: alternative_reading
lexical_decisions:
- source_word: זָקֵן
  choice: vieillard / hommes âgés
  rationale: Au début du verset, le singulier distributif est conservé dans l’énumération. À la fin, le pluriel « hommes âgés » reprend le sens lié à l’âge sans imposer la fonction institutionnelle d’« anciens ».
- source_word: בָּחוּר
  choice: jeune homme
  rationale: Le terme désigne ici un homme dans la force de la jeunesse, au sein d’une liste de catégories démographiques.
- source_word: בְתוּלָה
  choice: jeune fille vierge
  rationale: Cette formulation naturelle en français conserve explicitement le sens lexical de virginité ainsi que le contraste démographique.
- source_word: טַף
  choice: petits enfants
  rationale: Le terme vise les enfants en bas âge ou les petits, nuance que « petits enfants » restitue clairement.
- source_word: נָשִׁים
  choice: femmes
  rationale: Dans cette énumération, le sens générique « femmes » convient mieux que « épouses ».
- source_word: תַּהַרְגוּ לְמַשְׁחִית
  choice: tuez-les jusqu’à l’extermination
  rationale: La traduction garde la violence directe du commandement et rend la valeur intensive ou résultative de לְמַשְׁחִית sans atténuation.
- source_word: עַל כָּל אִישׁ
  choice: de personne
  rationale: Dans cette construction distributive, le français idiomatique « ne… personne » exprime naturellement « aucun individu » sans exclure les femmes.
- source_word: הַתָּו
  choice: la marque
  rationale: Dans le contexte immédiat, le mot désigne le signe protecteur apposé au verset 4. La relation au nom de la lettre taw est signalée en note.
- source_word: אַל תִּגַּשׁוּ
  choice: n’approchez
  rationale: Le verbe interdit de s’approcher; « ne touchez pas » préciserait indûment le geste.
- source_word: וּמִמִּקְדָּשִׁי תָּחֵלּוּ
  choice: Commencez par mon sanctuaire
  rationale: La construction indique le point de départ du jugement. « Commencez par » est naturel et précis en français.
- source_word: וַיָּחֵלּוּ
  choice: Ils commencèrent donc
  rationale: Le passé simple convient au registre narratif digne, et « donc » marque l’exécution consécutive de l’ordre.
- source_word: הַבָּיִת
  choice: le Temple
  rationale: Dans ce contexte cultuel, « la Maison » désigne le temple. « Le Temple » rend immédiatement le référent pour le lecteur moderne.
theological_decisions:
- issue: Rendre הַתָּו comme nom de lettre ou comme signe protecteur
  choice: la marque
  alternative: la marque en forme de taw / le taw
  rationale: Le rôle narratif du signe est premier dans le contexte. La note conserve l’information lexicale selon laquelle l’hébreu dit littéralement « le taw ».
- issue: Comprendre הַזְּקֵנִים comme une catégorie d’âge ou une charge
  choice: les hommes âgés
  alternative: les anciens
  rationale: La reprise de זקן après l’énumération initiale favorise le sens lié à l’âge, mais la présence de ces hommes devant le Temple rend le sens institutionnel « anciens » plausible; l’ambiguïté est donc conservée en note.
translation_notes:
  register: Français international actuel, clair et digne. Les singuliers distributifs de l’énumération hébraïque sont maintenus. Le passé simple soutient le registre narratif biblique sans archaïsme lexical; la brutalité du commandement n’est ni adoucie ni amplifiée.
