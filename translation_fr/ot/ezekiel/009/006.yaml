  terminology: « Vieillard », « jeune homme », « jeune fille vierge », « petits enfants », « femmes », « sanctuaire » et « hommes âgés » respectent le registre et les choix lexicaux. La note sur taw est utile. La note b doit se limiter à l’alternative lexicale, sans phrase explicative redondante.
