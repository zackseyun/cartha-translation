    rationale: La double formulation « de dessus … au-dessus duquel » est fidèle mais peu fluide. « De l’endroit où elle se trouvait, au-dessus du chérubin » maintient les deux données spatiales sans ambiguïté.
  - severity: low
    issue: Nuance directionnelle de אֶל
    rationale: La préposition אֶל indique le mouvement en direction du seuil; « vers le seuil » évite de suggérer plus fortement une destination atteinte par « jusqu’au seuil ».
