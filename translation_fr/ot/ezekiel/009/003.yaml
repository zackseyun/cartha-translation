  text: וּ/כְב֣וֹד אֱלֹהֵ֣י יִשְׂרָאֵ֗ל נַעֲלָה֙ מֵ/עַ֤ל הַ/כְּרוּב֙ אֲשֶׁ֣ר הָיָ֣ה עָלָ֔י/ו אֶ֖ל מִפְתַּ֣ן הַ/בָּ֑יִת וַ/יִּקְרָ֗א אֶל הָ/אִישׁ֙ הַ/לָּבֻ֣שׁ הַ/בַּדִּ֔ים אֲשֶׁ֛ר קֶ֥סֶת הַ/סֹּפֵ֖ר בְּ/מָתְנָֽי/ו׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/003.yaml
  text: And the glory of the God of Israel went up from above the cherub on which it had been[a], to the threshold of the house. And he called to the man clothed in linen[c][b], who had the scribe’s writing case at his waist.
translation:
  language: fr
  text: La gloire du Dieu d’Israël s’éleva de l’endroit où elle se trouvait, au-dessus du chérubin, vers le seuil du Temple[a]. Alors il[b] appela l’homme vêtu de lin, qui avait à la taille un étui d’écriture de scribe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « de la maison »; dans ce contexte, il s’agit du bâtiment du Temple.
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire : « Alors elle appela », en faisant de « la gloire » le sujet du verbe.'
    reason: alternative_reading
  - marker: c
    text: Ou « une écritoire de scribe »; le terme désigne un contenant pour le matériel d’écriture, traditionnellement rendu par « encrier ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כְבוֹד אֱלֹהֵי יִשְׂרָאֵל
  choice: la gloire du Dieu d’Israël
  rationale: « Gloire » est le correspondant français traditionnel et précis de כָּבוֹד dans les visions d’Ézéchiel; il évoque la manifestation visible de la présence divine sans la réduire à la seule lumière.
- source_word: נַעֲלָה מֵעַל
  choice: s’éleva de dessus
  rationale: Le verbe exprime un mouvement ascendant, et מֵעַל le point de départ situé au-dessus du chérubin. Cette formulation conserve les deux indications spatiales.
- source_word: הַכְּרוּב אֲשֶׁר הָיָה עָלָיו
  choice: le chérubin au-dessus duquel elle se trouvait
  rationale: Le nom hébreu est singulier. Le féminin « elle » reprend naturellement « la gloire » en français, tandis que « au-dessus duquel » restitue la position de celle-ci par rapport au chérubin.
- source_word: מִפְתַּן הַבָּיִת
  choice: le seuil du Temple
  rationale: מִפְתָּן désigne le seuil. Bien que בַּיִת signifie littéralement « maison », le contexte désigne sans ambiguïté l’édifice du Temple; la majuscule signale ici ce référent particulier.
- source_word: וַיִּקְרָא
  choice: il appela
  rationale: Le verbe hébreu est au masculin singulier et le contexte présente l’action comme personnellement divine. Le pronom évite cependant d’ajouter un nom divin absent du texte.
- source_word: הָאִישׁ הַלָּבֻשׁ הַבַּדִּים
  choice: l’homme vêtu de lin
  rationale: Cette traduction directe garde le singulier et la description solennelle de la tenue, sans préciser indûment la fonction du personnage.
- source_word: קֶסֶת הַסֹּפֵר
  choice: une écritoire de scribe
  rationale: « Écritoire » désigne de façon concise un nécessaire servant à écrire et convient à l’objet porté par un scribe, sans recourir au terme vieilli « encrier » lorsque le contenant exact demeure incertain.
- source_word: בְּמָתְנָיו
  choice: à la taille
  rationale: Cette expression moderne et concrète rend naturellement l’emplacement indiqué par l’hébreu, littéralement « à ses reins ».
theological_decisions:
- issue: Sujet de וַיִּקְרָא après « la gloire du Dieu d’Israël »
  choice: « il appela », avec une note signalant l’autre lecture
  alternative: « elle appela », si le sujet grammatical est directement « la gloire »
  rationale: Le masculin singulier hébreu permet de comprendre l’action comme celle de Dieu manifesté par sa gloire, mais le nom כָּבוֹד, lui-même masculin en hébreu, peut aussi être le sujet grammatical. La traduction principale conserve l’agent personnel suggéré par le contexte, tandis que la note préserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe conserve le mouvement spatial précis de la vision. « Temple » clarifie le référent contextuel de « maison », et les notes maintiennent les principales ambiguïtés lexicales et grammaticales.
