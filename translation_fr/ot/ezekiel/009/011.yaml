  text: וְ/הִנֵּ֞ה הָ/אִ֣ישׁ לְבֻ֣שׁ הַ/בַּדִּ֗ים אֲשֶׁ֤ר הַ/קֶּ֨סֶת֙ בְּ/מָתְנָ֔י/ו מֵשִׁ֥יב דָּבָ֖ר לֵ/אמֹ֑ר עָשִׂ֕יתִי כ/אשר צִוִּיתָֽ/נִי׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/011.yaml
  text: And behold[a], the man clothed in linen, who had the writing case at his waist, brought back word, saying, “I have done as you commanded me.”
translation:
  language: fr
  text: 'Et voici que l’homme vêtu de lin, qui avait l’écritoire[a] à la taille, faisait son rapport en disant : « J’ai fait comme tu me l’as ordonné. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « encrier », terme traditionnel pour le récipient d’écriture porté à la taille.
    reason: Alternative lexicale pour הַקֶּסֶת; elle reflète le rendu traditionnel sans réduire le sens principal d’« écritoire ».
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Conserve la fonction de mise en relief et l’effet visuel soudain du marqueur narratif hébreu, dans une formulation française naturelle et digne.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: Rend le masculin singulier explicite et renvoie naturellement au personnage déjà présenté.
- source_word: לְבֻשׁ הַבַּדִּים
  choice: vêtu de lin
  rationale: Expression concise et naturelle qui décrit fidèlement sa tenue sans préciser indûment sa fonction ou sa nature.
- source_word: הַקֶּסֶת
  choice: l’écritoire
  rationale: Désigne en français un nécessaire ou récipient destiné à l’écriture et convient mieux au contexte que le terme traditionnel mais plus étroit « encrier ».
- source_word: בְּמָתְנָיו
  choice: à la taille
  rationale: Rend clairement et naturellement l’emplacement de l’objet, sans l’archaïsme de « aux reins ».
- source_word: מֵשִׁיב דָּבָר
  choice: revint rendre compte
  rationale: Restitue l’idée d’une réponse ou d’un rapport présenté au retour, tout en employant une tournure idiomatique en français.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Introduit directement les paroles rapportées, conformément à la formule quotative hébraïque.
- source_word: עָשִׂיתִי
  choice: J’ai fait
  rationale: Le passé composé exprime naturellement une action achevée dont le résultat est présenté dans le compte rendu.
- source_word: כַּאֲשֶׁר צִוִּיתָנִי
  choice: ce que tu m’avais ordonné
  rationale: Formulation française idiomatique qui conserve l’idée de conformité au commandement reçu et situe logiquement celui-ci avant son exécution.
theological_decisions:
- issue: Nature de l’homme vêtu de lin
  choice: Le désigner uniquement comme « l’homme vêtu de lin »
  alternative: L’identifier comme un ange, une figure sacerdotale ou une manifestation divine
  rationale: Le verset le décrit par son apparence et son rôle sans définir explicitement sa nature. La traduction préserve cette retenue et n’impose aucune identification théologique.
translation_notes:
  register: Français international moderne, clair et digne. « Et voici que » maintient la vivacité prophétique; « écritoire » reste précis sans être excessivement technique. Aucun marqueur de note n’est requis, car aucune note n’est fournie.
