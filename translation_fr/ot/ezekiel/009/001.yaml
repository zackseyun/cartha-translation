source:
  edition: WLC
  text: וַ/יִּקְרָ֣א בְ/אָזְנַ֗/י ק֤וֹל גָּדוֹל֙ לֵ/אמֹ֔ר קָרְב֖וּ פְּקֻדּ֣וֹת הָ/עִ֑יר וְ/אִ֛ישׁ כְּלִ֥י מַשְׁחֵת֖/וֹ בְּ/יָדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/001.yaml
  text: Then he cried out in my ears with a loud voice[a], saying, “Draw near, you executioners of the city[b], each with his weapon of destruction in his hand.”
translation:
  language: fr
  text: 'Alors il cria d’une voix forte à mes oreilles : « Approchez, vous qui êtes chargés de la ville[a], chacun avec son arme de destruction à la main[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu est difficile et peut désigner ceux qui sont chargés de la ville, ou des agents de visitation/jugement contre elle. Le contexte les présente comme porteurs d’armes destructrices.
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « chacun, son instrument de destruction dans sa main ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: il cria
  rationale: Le verbe signifie appeler ou crier. La mention d’une voix forte indique ici un cri puissant plutôt qu’un simple appel.
- source_word: בְאָזְנַי
  choice: à mes oreilles
  rationale: Cette formulation conserve l’image concrète et saisissante de l’expression hébraïque, tout en restant compréhensible en français.
- source_word: קוֹל גָּדוֹל
  choice: d’une voix forte
  rationale: Équivalent français naturel de l’expression hébraïque désignant une parole prononcée avec force.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français moderne, les deux-points introduisent naturellement les paroles directes et rendent la fonction de l’infinitif hébreu sans l’alourdir par « en disant ».
- source_word: קָרְבוּ
  choice: Approchez
  rationale: L’impératif pluriel exprime un ordre solennel adressé aux agents convoqués.
- source_word: פְּקֻדּוֹת הָעִיר
  choice: vous qui êtes chargés de punir la ville
  rationale: Le nom issu de פקד peut évoquer une charge, une intervention ou une visitation punitive. Le contexte immédiat des armes destructrices justifie la valeur punitive, tandis qu’une note conserve l’ambiguïté lexicale.
- source_word: וְאִישׁ
  choice: chacun
  rationale: Le singulier distributif hébreu se rend naturellement par « chacun » en français.
- source_word: כְּלִי מַשְׁחֵתוֹ
  choice: son arme de destruction
  rationale: כְּלִי désigne un instrument ou, dans ce contexte, une arme; מַשְׁחֵת exprime sa fonction destructrice.
- source_word: בְּיָדוֹ
  choice: à la main
  rationale: Expression française idiomatique qui conserve l’image de chaque agent tenant son arme.
theological_decisions:
- issue: Sens de פְּקֻדּוֹת הָעִיר dans le contexte du jugement
  choice: vous qui êtes chargés de punir la ville
  alternative: vous qui êtes chargés de la ville ; agents d’intervention contre la ville ; interventions punitives contre la ville
  rationale: Le contexte présente des agents armés qui exécutent un jugement, mais le terme hébreu peut désigner plus largement une charge, une surveillance ou une intervention. La traduction principale explicite la dimension punitive sans préciser la nature angélique ou humaine des agents; la note signale l’éventail sémantique.
translation_notes:
  register: Français international moderne, digne et direct. L’image inhabituelle « à mes oreilles » est conservée pour sa force, tandis que les paroles directes sont introduites par deux-points afin d’éviter une tournure inutilement lourde.
