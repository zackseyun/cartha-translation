    rationale: Bien que וְהִכּוּ n’exprime pas son objet, « frapper dans la ville » est incomplet et peu naturel en français moderne. Le contexte désigne sans ambiguïté des personnes visées par l’exécution ; « frapper des gens » est une explicitation minimale nécessaire.
  - severity: low
    issue: « de morts » est moins idiomatique que « de cadavres » après « remplissez les cours »
    rationale: Le français emploie plus naturellement « remplir ... de cadavres » pour décrire la présence de corps. Cette formulation rend aussi clairement le résultat mortel impliqué par חֲלָלִים.
