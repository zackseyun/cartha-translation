  source_fidelity: 'Le sens des impératifs est fidèlement rendu : טַמְּאוּ conserve l’idée de souillure rituelle, « la Maison » correspond à הַבַּיִת dans son contexte cultuel, et « Sortez ! » rend directement צֵאוּ. Le dernier verbe, וְהִכּוּ, est employé absolument en hébreu, mais le français moderne ne supporte pas naturellement « frapper dans la ville » sans complément. L’ajout minimal « des gens » explicite seulement l’objet que le contexte immédiat impose, comme le fait l’anglais audité.'
  naturalness: « Remplissez les cours de morts » est compréhensible, mais « de cadavres » est plus idiomatique et concret en français moderne dans cette scène de jugement. « Ils sortirent donc et frappèrent dans la ville » reste syntaxiquement et idiomatiquement heurté ; « ils frappèrent des gens dans la ville » est naturel sans élargir la portée du texte.
  terminology: « Maison » avec majuscule préserve le lexique hébreu tout en signalant le référent cultuel ; une note donne l’alternative « le Temple ». « Rendez la Maison impure » maintient la nuance rituelle sans atténuer l’ordre. « Cadavres » convient à חֲלָלִים dans le cadre de cours remplies par les personnes mises à mort ; la note conserve la possibilité plus personnelle de « morts ».
