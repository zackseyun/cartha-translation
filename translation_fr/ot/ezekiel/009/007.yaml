  rationale: La révision corrige deux maladresses françaises sans modifier le sens ni adoucir la violence judiciaire du texte. Elle conserve l’ambiguïté lexicale de « la Maison » et celle de חֲלָלִים au moyen de notes, tout en rendant la dernière proposition intelligible et naturelle en français.
