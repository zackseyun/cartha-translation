  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם טַמְּא֣וּ אֶת הַ/בַּ֗יִת וּ/מַלְא֧וּ אֶת הַ/חֲצֵר֛וֹת חֲלָלִ֖ים צֵ֑אוּ וְ/יָצְא֖וּ וְ/הִכּ֥וּ בָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/007.yaml
  text: And he said to them[a], “Defile the house, and fill the courts with the slain[b]. Go out.” So they went out and struck down people in the city.
translation:
  language: fr
  text: 'Il leur dit : « Rendez la Maison impure[a] et remplissez les cours de cadavres[b]. Sortez ! » Ils sortirent donc et frappèrent des gens dans la ville.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Temple ». Hébreu littéralement « la maison ».
    reason: lexical_alternative
  - marker: b
    text: Ou « de morts » ; le terme peut désigner les personnes tuées.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַמְּאוּ
  choice: Rendez … impure
  rationale: Le piel impératif commande de rendre la Maison rituellement impure. Cette formulation française actuelle conserve la portée cultuelle et le caractère saisissant de l’ordre.
- source_word: הַבַּיִת
  choice: la Maison
  rationale: Littéralement « la maison »; dans le contexte, il s’agit du Temple. La majuscule aide à signaler ce référent précis sans remplacer l’image hébraïque dans le texte principal.
- source_word: הַחֲצֵרוֹת
  choice: les cours
  rationale: Désigne les cours de l’enceinte du Temple; « les cours » est naturel dans ce contexte architectural et cultuel.
- source_word: חֲלָלִים
  choice: de morts
  rationale: Le terme désigne des personnes tuées, souvent transpercées. « Morts » exprime sobrement les cadavres qui remplissent les cours, sans préciser davantage le mode de mise à mort.
- source_word: צֵאוּ
  choice: Sortez !
  rationale: Impératif direct ordonnant aux exécuteurs de quitter l’espace du Temple pour intervenir dans la ville.
- source_word: וְיָצְאוּ
  choice: Ils sortirent donc
  rationale: Le waw fait avancer le récit et présente l’exécution immédiate de l’ordre; « donc » rend naturellement cette succession en français.
- source_word: וְהִכּוּ
  choice: frappèrent
  rationale: נכה décrit ici une frappe meurtrière. Le complément demeure implicite comme en hébreu; le contexte indique qu’ils frappent les habitants à mort.
- source_word: בָעִיר
  choice: dans la ville
  rationale: Rend directement la valeur locative, sans ajouter l’idée distributive de « partout dans ».
theological_decisions:
- issue: Ordre de rendre impur le sanctuaire
  choice: 'Conserver directement l’ordre : « Rendez la Maison impure »'
  alternative: Atténuer par une formulation indirecte ou moins cultuelle
  rationale: La vision attribue explicitement cet ordre au locuteur divin; il faut préserver la tension théologique et la violence judiciaire du passage sans les adoucir.
- issue: Identification de הַבַּיִת
  choice: Employer « la Maison » dans le texte, avec une note indiquant le Temple
  alternative: Traduire directement « le Temple »
  rationale: Ce choix garde l’image littérale de l’hébreu tout en permettant au lecteur d’identifier clairement le référent grâce à la note.
- issue: Objet implicite de וְהִכּוּ
  choice: 'Garder l’objet implicite : « frappèrent dans la ville »'
  alternative: Expliciter « frappèrent les habitants » ou « tuèrent des gens »
  rationale: L’hébreu ne nomme pas l’objet dans ce membre de phrase. Le contexte le rend évident; ne pas l’ajouter préserve la concision et évite une explicitation interprétative inutile.
translation_notes:
  register: Français international moderne, sobre et digne. Les impératifs restent directs; « la Maison » conserve l’image hébraïque, tandis que les notes éclairent le référent et la nuance de חֲלָלִים.
