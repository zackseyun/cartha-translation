  text: וַֽ/יְהִי֙ כְּ/הַכּוֹתָ֔/ם וְ/נֵֽאשֲׁאַ֖ר אָ֑נִי וָ/אֶפְּלָ֨/ה עַל פָּנַ֜/י וָ/אֶזְעַ֗ק וָֽ/אֹמַר֙ אֲהָהּ֙ אֲדֹנָ֣/י יְהוִ֔ה הֲ/מַשְׁחִ֣ית אַתָּ֗ה אֵ֚ת כָּל שְׁאֵרִ֣ית יִשְׂרָאֵ֔ל בְּ/שָׁפְכְּ/ךָ֥ אֶת חֲמָתְ/ךָ֖ עַל יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/008.yaml
  text: And it happened, while they were striking them down, and I alone was left, that I fell on my face and cried out, and I said, “Ah, Lord GOD, will you destroy all the remnant of Israel as you pour out your wrath on Jerusalem?”
translation:
  language: fr
  text: 'Il arriva que, pendant qu’ils les frappaient et que je restais seul, je tombai face contre terre et m’écriai : « Ah ! Seigneur DIEU, vas-tu détruire tout ce qui reste d’Israël en déversant ta fureur sur Jérusalem ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּהַכּוֹתָם
  choice: Pendant qu’ils les frappaient
  rationale: La construction temporelle avec כְּ et l’infinitif construit exprime ici la simultanéité; « frappaient » conserve la portée violente du verbe sans préciser au-delà du contexte le moyen de mise à mort.
- source_word: וְנֵאשֲאַר אָנִי
  choice: je restai seul
  rationale: Le niphal de שׁאר signifie « rester, être laissé ». L’ordre marqué du pronom אָנִי met Ézéchiel en relief; « seul » rend naturellement cette emphase dans le contexte.
- source_word: אֲדֹנָי יְהוִה
  choice: Seigneur DIEU
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה selon une convention française lisible et digne.
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: tout ce qui reste d’Israël
  rationale: Formulation française courante qui restitue le sens collectif de « reste » sans imposer ici une lecture théologique technique.
- source_word: בְּשָׁפְכְּךָ אֶת־חֲמָתְךָ
  choice: en déversant ta fureur
  rationale: Le בְּ avec l’infinitif construit peut marquer l’action concomitante; « en déversant » préserve cette relation. « Fureur » exprime l’intensité de חֵמָה.
theological_decisions:
- issue: Portée de la question d’Ézéchiel
  choice: vas-tu détruire tout ce qui reste d’Israël
  alternative: es-tu en train de détruire tout le reste d’Israël
  rationale: La forme participiale peut décrire une action en cours ou imminente. La question avec « vas-tu » préserve l’appel angoissé du prophète sans affirmer que l’anéantissement total a déjà lieu.
- issue: Sens de « reste d’Israël »
  choice: tout ce qui reste d’Israël
  alternative: tout le reste d’Israël
  rationale: La formulation choisie évite de transformer automatiquement שְׁאֵרִית en catégorie doctrinale tout en conservant l’idée des survivants d’Israël.
translation_notes:
  register: Français international moderne, naturel et digne. La succession hébraïque des verbes est légèrement resserrée pour éviter une lourdeur artificielle, tout en conservant la simultanéité du massacre, l’isolement du prophète, sa prosternation et son cri.
