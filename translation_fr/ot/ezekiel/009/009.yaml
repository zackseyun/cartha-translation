  text: וַ/יֹּ֣אמֶר אֵלַ֗/י עֲוֺ֨ן בֵּֽית יִשְׂרָאֵ֤ל וִֽ/יהוּדָה֙ גָּדוֹל֙ בִּ/מְאֹ֣ד מְאֹ֔ד וַ/תִּמָּלֵ֤א הָ/אָ֨רֶץ֙ דָּמִ֔ים וְ/הָ/עִ֖יר מָלְאָ֣ה מֻטֶּ֑ה כִּ֣י אָמְר֗וּ עָזַ֤ב יְהוָה֙ אֶת הָ/אָ֔רֶץ וְ/אֵ֥ין יְהוָ֖ה רֹאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/009.yaml
  text: Then he said to me[a], “The iniquity of the house of Israel and Judah is exceedingly great, and the land is filled with bloodshed, and the city is full of perversion. For they say, ‘Yahweh has forsaken the land, and Yahweh does not see.’”
translation:
  language: fr
  text: 'Puis il me dit : « La faute de la maison d’Israël et de Juda est extrêmement grave. Le pays est rempli de sang versé, et la ville est pleine de perversion[a]. Car ils disent : “Yahweh a abandonné le pays ; Yahweh ne voit pas.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pleine d’injustice » ou « pleine d’une justice faussée ». Le terme hébreu désigne ce qui est tordu ou détourné de ce qui est droit, et peut notamment évoquer l’injustice judiciaire.
    reason: alternative lexicale et préservation de l’ambiguïté
lexical_decisions:
- source_word: עֲוֺן
  choice: faute
  rationale: Dans ce contexte, le nom désigne la perversité morale et la culpabilité collective d’Israël et de Juda, non le châtiment qui en résulte. « Faute » reste clair et garde cette portée éthique.
- source_word: בֵּית יִשְׂרָאֵל וִיהוּדָה
  choice: la maison d’Israël et de Juda
  rationale: Cette formulation conserve l’expression collective « maison de » et laisse celle-ci porter sur Israël et Juda ensemble, comme le permet la syntaxe hébraïque.
- source_word: גָּדוֹל בִּמְאֹד מְאֹד
  choice: est extrêmement grave
  rationale: Le double מְאֹד marque une très forte intensification. En français naturel, « extrêmement grave » restitue mieux cette force que la répétition littérale « très, très grande ».
- source_word: וַתִּמָּלֵא הָאָרֶץ דָּמִים
  choice: le pays est rempli de sang versé
  rationale: Le pluriel דָּמִים évoque ici les meurtres, la violence sanglante et la culpabilité qui s’y attache, plutôt que du sang envisagé comme simple substance.
- source_word: מֻטֶּה
  choice: ce qui est faussé
  rationale: Le terme évoque ce qui est dévié ou rendu tortueux, probablement la perversion du droit. La formulation conserve cette largeur de sens sans limiter indûment le mot au seul domaine judiciaire.
- source_word: עָזַב
  choice: a abandonné
  rationale: Le parfait exprime l’affirmation selon laquelle Yahweh aurait délaissé le pays. « Abandonné » est actuel, naturel et conserve la gravité relationnelle de cette accusation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de représenter directement le tétragramme présent deux fois dans le texte.
- source_word: רֹאֶה
  choice: ne voit rien
  rationale: Cette tournure française naturelle exprime leur négation de la vigilance et de l’intervention divines, tout en restant proche du sens littéral « ne voit pas ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le nom propre divin. « Yahweh » le préserve sans lui substituer un titre.
- issue: Portée de דָּמִים et מֻטֶּה dans l’accusation
  choice: sang versé … ce qui est faussé
  alternative: sang … injustice / perversion du droit
  rationale: Ces choix expriment la violence meurtrière et la corruption de ce qui devrait être droit, tout en préservant l’ambiguïté de מֻטֶּה entre déformation générale et injustice judiciaire.
- issue: Sens de עֲוֺן
  choice: faute
  alternative: iniquité / culpabilité
  rationale: « Faute » peut englober l’acte mauvais et la culpabilité collective sans faire du mot une désignation du châtiment. « Iniquité » serait plus formel mais moins courant.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste solennelle sans archaïsmes. « Maison d’Israël et de Juda » conserve l’expression collective biblique ; « ce qui est faussé » maintient l’ambiguïté du terme hébreu, explicitée en note.
