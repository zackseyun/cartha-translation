  text: וַ/יֹּ֤אמֶר יְהוָה֙ אל/ו עֲבֹר֙ בְּ/ת֣וֹךְ הָ/עִ֔יר בְּ/ת֖וֹךְ יְרֽוּשָׁלִָ֑ם וְ/הִתְוִ֨יתָ תָּ֜ו עַל מִצְח֣וֹת הָ/אֲנָשִׁ֗ים הַ/נֶּֽאֱנָחִים֙ וְ/הַ/נֶּ֣אֱנָקִ֔ים עַ֚ל כָּל הַ/תּ֣וֹעֵב֔וֹת הַֽ/נַּעֲשׂ֖וֹת בְּ/תוֹכָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/004.yaml
  text: And Yahweh said to him[a], “Pass through the midst of the city, through the midst of Jerusalem, and put a mark on the foreheads of the men who sigh and groan over all the abominations being done in her midst.”
translation:
  language: fr
  text: 'Et Yahweh lui dit : « Passe au milieu de la ville, au milieu de Jérusalem, et place une marque[a] sur le front des hommes qui soupirent et gémissent à cause de toutes les abominations qui se commettent au milieu d’elle. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : taw ; ce mot pourrait désigner la lettre ת employée comme marque.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin YHWH conformément à sa forme personnelle, sans le remplacer par un titre.
- source_word: עֲבֹר
  choice: Passe
  rationale: Rend directement l’impératif de mouvement à travers la ville.
- source_word: בְּתוֹךְ ... בְּתוֹךְ
  choice: au milieu de ... au milieu de
  rationale: Conserve la répétition hébraïque et son insistance, dans un français naturel et digne.
- source_word: וְהִתְוִיתָ תָּו
  choice: trace un signe
  rationale: Exprime l’action d’apposer un signe distinctif tout en évitant de préciser dans le texte principal une forme graphique qui demeure incertaine.
- source_word: מִצְחוֹת
  choice: le front
  rationale: Le singulier distributif français est idiomatique après « des hommes » et correspond aux fronts de chacun.
- source_word: הָאֲנָשִׁים
  choice: des hommes
  rationale: Préserve la valeur masculine plurielle du nom hébreu dans ce contexte.
- source_word: הַנֶּאֱנָחִים וְהַנֶּאֱנָקִים
  choice: qui soupirent et gémissent
  rationale: Maintient les deux expressions audibles de douleur sans les fondre en une seule notion.
- source_word: עַל כָּל הַתּוֹעֵבוֹת
  choice: à cause de toutes les abominations
  rationale: Rend clairement ici la cause de leur affliction et conserve la forte portée morale et cultuelle de תּוֹעֵבוֹת.
- source_word: הַנַּעֲשׂוֹת
  choice: qui se commettent
  rationale: Le présent pronominal exprime naturellement en français les actes en cours, avec leur caractère répréhensible.
- source_word: בְּתוֹכָהּ
  choice: au milieu d’elle
  rationale: Conserve la référence féminine à la ville ou à Jérusalem ainsi que l’écho de בְּתוֹךְ.
theological_decisions:
- issue: Portée symbolique possible de תָּו comme nom de la lettre taw
  choice: Le texte principal porte « un signe »
  alternative: « un taw » ou « la lettre taw »
  rationale: Dans le contexte immédiat, il s’agit d’un signe distinctif. Identifier explicitement sa forme à une lettre dans le texte principal risquerait d’imposer une interprétation historique ou symbolique qui n’est pas certaine; la possibilité lexicale est donc signalée en note.
translation_notes:
  register: Français international moderne, clair et soutenu. La répétition « au milieu de » reproduit la cadence du texte hébreu; « trace un signe » reste concret sans surinterpréter la nature du signe.
