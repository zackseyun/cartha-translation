  source_fidelity: 'Le sens général est fidèle : la bande réservée longe Juda d’est en ouest, mesure vingt-cinq mille en largeur, a la longueur de l’une des parts, et contient le sanctuaire en son milieu. Toutefois, « elle s’étendra comme l’une des parts attribuées » rend moins directement la construction nominale hébraïque, qui qualifie la longueur de la bande.'
  naturalness: Le français est globalement naturel. Une formulation nominale parallèle (« d’une longueur égale à celle de l’une des parts ») est plus claire et plus idiomatique dans une description cadastrale. L’ajout de « unités » n’est pas nécessaire et alourdit légèrement la mesure.
