source:
  edition: WLC
  text: וְ/עַל֙ גְּב֣וּל יְהוּדָ֔ה מִ/פְּאַ֥ת קָדִ֖ים עַד פְּאַת יָ֑מָּ/ה תִּהְיֶ֣ה הַ/תְּרוּמָ֣ה אֲֽשֶׁר תָּרִ֡ימוּ חֲמִשָּׁה֩ וְ/עֶשְׂרִ֨ים אֶ֜לֶף רֹ֗חַב וְ/אֹ֜רֶךְ כְּ/אַחַ֤ד הַ/חֲלָקִים֙ מִ/פְּאַ֤ת קָדִ֨ימָ/ה֙ עַד פְּאַת יָ֔מָּ/ה וְ/הָיָ֥ה הַ/מִּקְדָּ֖שׁ בְּ/תוֹכֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/008.yaml
  text: 'Along the border of Judah[a], from the east side to the west side, shall be the contribution that you shall set apart: twenty-five thousand in width, and in length like one of the portions, from the east side to the west side[c][b]; and the sanctuary shall be in its midst.'
translation:
  language: fr
  text: 'Le long de la frontière de Juda, du côté est jusqu’au côté ouest, se trouvera la part que vous mettrez à part[a] : elle aura vingt-cinq mille de largeur[b] et une longueur égale à celle de l’une des parts attribuées, du côté est jusqu’au côté ouest[c]. Le sanctuaire sera en son milieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’offrande que vous réserverez » ou « le territoire que vous mettrez à part ». Le terme hébreu désigne ici une portion spécialement prélevée et réservée.
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu ne précise pas ici l’unité de mesure.
    reason: textual_clarification
  - marker: c
    text: Littéralement « jusqu’au côté de la mer » ; dans cet emploi géographique, la mer indique l’ouest.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבוּל
  choice: frontière
  rationale: Dans ce contexte de répartition territoriale, le terme désigne la limite du territoire de Juda ; « frontière » est clair et naturel en français.
- source_word: מִפְּאַת קָדִים ... עַד פְּאַת יָמָּה
  choice: du côté est jusqu’au côté ouest
  rationale: פֵּאָה désigne ici un côté ou un bord. יָמָּה, littéralement orienté vers la mer, fonctionne comme indication de l’ouest.
- source_word: הַתְּרוּמָה ... תָּרִימוּ
  choice: la part que vous prélèverez
  rationale: Le nom désigne ce qui est prélevé et réservé, et le hiphil de רוּם l’acte de le mettre à part. « Part » convient mieux à une étendue de terre que « contribution », tandis que la note conserve la valeur cultuelle du terme.
- source_word: חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: vingt-cinq mille unités
  rationale: Le texte donne le nombre sans répéter l’unité. « unités » signale cette absence sans imposer dans le corps du texte une mesure qui n’est pas exprimée dans ce verset.
- source_word: רֹחַב
  choice: de largeur
  rationale: Formulation française naturelle pour une dimension territoriale.
- source_word: וְאֹרֶךְ כְּאַחַד הַחֲלָקִים
  choice: en longueur, elle s’étendra comme l’une des parts attribuées
  rationale: חֵלֶק est une part ou portion attribuée. La formulation maintient la comparaison sans ajouter explicitement « tribale », implicite seulement dans le contexte.
- source_word: הַמִּקְדָּשׁ
  choice: le sanctuaire
  rationale: Équivalent français usuel et suffisamment large pour le lieu consacré désigné ici.
- source_word: בְּתוֹכוֹ
  choice: en son milieu
  rationale: Rend directement la position du sanctuaire à l’intérieur de la part mise à part, sans affirmer une précision géométrique supérieure à celle du texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe a été légèrement réorganisée pour éviter une phrase française pesante tout en conservant les dimensions, la comparaison avec les autres parts et la position du sanctuaire. Les marqueurs [a], [b] et [c] figurent tous dans le texte.
