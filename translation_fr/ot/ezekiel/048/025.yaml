  text: וְ/עַ֣ל גְּב֣וּל שִׁמְע֗וֹן מִ/פְּאַ֥ת קָדִ֛ימָ/ה עַד פְּאַת יָ֖מָּ/ה יִשָׂשכָ֥ר אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/025.yaml
  text: And along the border of Simeon[a], from the east side to the west side, Issachar, one portion.
translation:
  language: fr
  text: 'Le long de la frontière de Siméon, du côté est jusqu’au côté ouest : une part pour Issacar.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עַל
  choice: Le long de
  rationale: Dans cette formule de répartition territoriale, la préposition introduit la bande contiguë à celle qui précède. « Le long de » convient naturellement à une frontière en français.
- source_word: גְּבוּל
  choice: frontière
  rationale: Le nom désigne ici la ligne délimitant le territoire tribal. « Frontière » est précis et idiomatique.
- source_word: שִׁמְעוֹן
  choice: Siméon
  rationale: Forme française traditionnelle et courante du nom tribal.
- source_word: מִ/פְּאַת קָדִימָ/ה עַד פְּאַת יָמָּ/ה
  choice: du côté est jusqu’au côté ouest
  rationale: La formule indique toute l’étendue d’est en ouest. יָם, littéralement « mer », a ici son sens géographique conventionnel d’« ouest ».
- source_word: יִשָׂשכָר
  choice: Issacar
  rationale: Forme française traditionnelle et courante du nom tribal.
- source_word: אֶחָד
  choice: une part
  rationale: L’hébreu dit littéralement « un/une », mais le contexte répétitif des attributions territoriales permet d’expliciter naturellement le nom sous-entendu « part ».
