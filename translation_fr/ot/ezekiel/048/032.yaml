  text: וְ/אֶל פְּאַ֣ת קָדִ֗ימָ/ה חֲמֵ֤שׁ מֵאוֹת֙ וְ/אַרְבַּ֣עַת אֲלָפִ֔ים וּ/שְׁעָרִ֖ים שְׁלֹשָׁ֑ה וְ/שַׁ֨עַר יוֹסֵ֜ף אֶחָ֗ד שַׁ֤עַר בִּנְיָמִן֙ אֶחָ֔ד שַׁ֥עַר דָּ֖ן אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/032.yaml
  text: 'And on the east side[a], four thousand five hundred cubits, with three gates: the gate of Joseph, one; the gate of Benjamin, one; the gate of Dan, one.'
translation:
  language: fr
  text: 'Du côté est[a] : quatre mille cinq cents coudées, avec trois portes : la porte de Joseph, une ; la porte de Benjamin, une ; la porte de Dan, une.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit simplement « quatre mille cinq cents » ; « coudées » est ajouté d’après le contexte des dimensions de la ville dans ce chapitre.
    reason: cross_reference
lexical_decisions:
- source_word: פְּאַת קָדִימָה
  choice: du côté est
  rationale: פְּאַת désigne un côté ou un bord, et קָדִימָה indique l’est. « Du côté est » est naturel en français et convient à la formule descriptive répétée dans ce passage.
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים
  choice: quatre mille cinq cents coudées
  rationale: L’ordre littéral hébreu, « cinq cents et quatre mille », exprime idiomatiquement 4 500. L’unité « coudées », sous-entendue ici, est fournie par le contexte immédiat des dimensions de la ville.
- source_word: וּשְׁעָרִים שְׁלֹשָׁה
  choice: avec trois portes
  rationale: Cette formulation française restitue naturellement la proposition nominale hébraïque et relie le nombre de portes à la mesure du côté.
- source_word: שַׁעַר
  choice: porte
  rationale: Terme français courant pour les accès de la ville nommés d’après les tribus dans cette vision.
- source_word: יוֹסֵף
  choice: Joseph
  rationale: Forme française traditionnelle et usuelle du nom personnel et tribal.
- source_word: בִּנְיָמִן
  choice: Benjamin
  rationale: Forme française traditionnelle et usuelle du nom personnel et tribal.
- source_word: דָּן
  choice: Dan
  rationale: Forme française traditionnelle et usuelle du nom personnel et tribal.
- source_word: אֶחָד ... אֶחָד ... אֶחָד
  choice: une ... une ... une
  rationale: La distribution d’une porte à chacun des trois noms est maintenue. La tournure « une porte pour Joseph, une pour Benjamin et une pour Dan » évite une répétition pesante tout en conservant l’énumération explicite.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe nominale est rendue par une ponctuation descriptive. L’article est répété de manière naturelle, sans archaïsme, et l’unité implicite est signalée en note.
