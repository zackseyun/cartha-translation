source:
  edition: WLC
  text: וַ/חֲמֵ֨שֶׁת אֲלָפִ֜ים הַ/נּוֹתָ֣ר בָּ/רֹ֗חַב עַל פְּנֵ֨י חֲמִשָּׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף חֹֽל ה֣וּא לָ/עִ֔יר לְ/מוֹשָׁ֖ב וּ/לְ/מִגְרָ֑שׁ וְ/הָיְתָ֥ה הָ/עִ֖יר ב/תוכ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/015.yaml
  text: And the remaining five thousand in width[a], along the face of the twenty-five thousand, shall be common land for the city, for dwelling, and for open land[c][b]; and the city shall be in its midst.
translation:
  language: fr
  text: Les cinq mille restants en largeur, le long des vingt-cinq mille[a], constitueront une zone non consacrée[b], destinée à la ville, pour l’habitation et pour les espaces libres[c]. La ville sera au milieu de cette zone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque traduite par « le long des vingt-cinq mille » signifie littéralement « sur la face des vingt-cinq mille » ; elle peut aussi se rendre par « à côté des vingt-cinq mille ».
    reason: lexical_alternative
  - marker: b
    text: « Non consacrée » traduit un terme hébreu qui désigne ce qui est ordinaire, par opposition aux terrains sacrés attribués dans les versets précédents.
    reason: cultural_note
  - marker: c
    text: Les « espaces libres » sont des terrains ouverts liés à la ville ; ils pouvaient notamment servir de pâturages.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָר
  choice: qui restent
  rationale: Le participe niphal désigne ce qui subsiste après les attributions précédentes; cette tournure conserve le sens foncier et s'intègre naturellement à la phrase.
- source_word: בָּרֹחַב
  choice: en largeur
  rationale: רֹחַב indique la largeur d'une étendue dans ce contexte d'arpentage.
- source_word: עַל־פְּנֵי
  choice: le long de
  rationale: L'expression spatiale, littéralement « sur la face de », indique ici que la bande s'étend le long du côté de l'étendue mesurant vingt-cinq mille, sans préciser davantage sa géométrie.
- source_word: חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: des vingt-cinq mille
  rationale: Le nombre renvoie à la dimension déjà donnée dans le contexte. L'unité n'étant pas répétée dans ce membre de phrase, elle n'est pas ajoutée au texte.
- source_word: חֹל
  choice: un territoire non consacré
  rationale: חֹל s'oppose ici aux terrains sacrés ou consacrés. « Non consacré » rend clairement ce contraste cultuel sans la connotation péjorative possible de « profane ».
- source_word: לָעִיר
  choice: destiné à la ville
  rationale: La préposition ל marque l'affectation ou la destination du terrain.
- source_word: לְמוֹשָׁב
  choice: aux habitations
  rationale: מוֹשָׁב désigne ici la fonction résidentielle ou l'établissement humain; le pluriel concret est naturel en français moderne.
- source_word: וּלְמִגְרָשׁ
  choice: et aux espaces libres
  rationale: מִגְרָשׁ désigne les terrains ouverts qui entourent ou desservent une ville, parfois utilisés comme pâturages. « Espaces libres » laisse ouverte leur fonction précise.
- source_word: בְּתוֹכָהּ
  choice: au milieu de ce territoire
  rationale: Le suffixe féminin renvoie vraisemblablement à l'étendue foncière décrite. La reprise explicite évite une ambiguïté grammaticale artificielle en français tout en conservant la situation centrale de la ville.
