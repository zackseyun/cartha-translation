translation_notes:
  register: Français international moderne, clair et digne. La syntaxe de description cadastrale est conservée sans calque inutile. « Territoire non consacré » maintient le contraste spatial et cultuel, tandis que « espaces libres » évite l'anachronisme de « banlieue » et ne réduit pas מִגְרָשׁ aux seuls pâturages.
