  text: וְ/עַ֣ל גְּב֣וּל אָשֵׁ֗ר מִ/פְּאַ֥ת קָדִ֛ימָ/ה וְ/עַד פְּאַת יָ֖מָּ/ה נַפְתָּלִ֥י אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/003.yaml
  text: And alongside the border of Asher[a], from the eastern side to the western side, Naphtali, one portion.
translation:
  language: fr
  text: 'Et le long de la frontière d’Aser, du côté est jusqu’au côté ouest : Nephtali, une part[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « Nephtali, un. » Le mot « part » est ajouté pour clarifier le sens d’après le contexte de la répartition du pays dans ce chapitre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Le long de
  rationale: Dans cette formule de répartition territoriale, la préposition situe la bande suivante contre la frontière précédente. « Le long de » exprime naturellement cette contiguïté.
- source_word: גְּבוּל
  choice: frontière
  rationale: Le nom désigne ici la limite territoriale séparant les parts tribales.
- source_word: אָשֵׁר
  choice: Aser
  rationale: Forme française courante du nom de la tribu.
- source_word: מִפְּאַת קָדִימָה
  choice: du côté est
  rationale: פֵּאָה désigne un côté ou une extrémité, et קָדִימָה indique l’est.
- source_word: וְעַד פְּאַת יָמָּה
  choice: jusqu’au côté ouest
  rationale: עַד marque l’étendue jusqu’à une limite; יָמָּה, littéralement orienté vers la mer, signifie ici l’ouest.
- source_word: נַפְתָּלִי
  choice: Nephtali
  rationale: Forme française traditionnelle et largement reconnaissable du nom de la tribu.
- source_word: אֶחָד
  choice: une part
  rationale: L’hébreu dit seulement « un », mais le contexte de la répartition du pays rend implicite une part territoriale. Le nom est ajouté pour que la phrase soit naturelle et intelligible en français.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La structure nominal et concise de l’hébreu est conservée au moyen des deux-points, sans ajouter de verbe tel que « recevra ».
