  text: וְ/עַ֣ל גְּב֣וּל אֶפְרַ֗יִם מִ/פְּאַ֥ת קָדִ֛ים וְ/עַד פְּאַת יָ֖מָּ/ה רְאוּבֵ֥ן אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/006.yaml
  text: And along the border of Ephraim[a], from the east side to the west side, Reuben[b], one portion.
translation:
  language: fr
  text: 'Et le long de la frontière d’Éphraïm, du côté est jusqu’au côté ouest[a] : Ruben, une part[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « jusqu’au côté de la mer » ; en hébreu, la mer désigne ici l’ouest.'
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « Ruben, un ». Le mot « part » est ajouté pour rendre l’ellipse : il s’agit d’une part attribuée à une tribu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל גְּבוּל
  choice: Le long de la frontière
  rationale: Dans cette liste territoriale, עַל situe la part le long de la limite d’Éphraïm, et גְּבוּל désigne la frontière. La coordination initiale est naturellement rendue par l’enchaînement de la phrase en français.
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Forme française usuelle du nom de la tribu.
- source_word: מִפְּאַת קָדִים
  choice: du côté est
  rationale: פֵּאָה désigne ici un côté ou une extrémité, et קָדִים indique l’est. Cette formulation conserve le schéma géographique du chapitre dans un français naturel.
- source_word: וְעַד פְּאַת יָמָּה
  choice: jusqu’au côté ouest
  rationale: Littéralement « jusqu’au côté de la mer »; יָם sert couramment à désigner l’ouest dans l’orientation géographique hébraïque.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Forme française usuelle du nom de la tribu.
- source_word: אֶחָד
  choice: une part
  rationale: L’hébreu dit seulement « un/une »; dans le contexte des attributions tribales d’Ézéchiel 48, le nom « part » est sous-entendu. Il est ajouté pour que l’ellipse soit intelligible en français.
