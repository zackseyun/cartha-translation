  text: וְ/עַ֣ל גְּב֣וּל זְבוּלֻ֗ן מִ/פְּאַ֥ת קָדִ֛מָ/ה עַד פְּאַת יָ֖מָּ/ה גָּ֥ד אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/027.yaml
  text: And along the border of Zebulun[a], from the east side to the west side, Gad, one portion.
translation:
  language: fr
  text: 'Et le long de la frontière de Zabulon, du côté est jusqu’au côté ouest : Gad, une part[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Gad, un ». Le mot « part » est sous-entendu d’après la formule de répartition répétée dans ce chapitre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: Et le long de
  rationale: Dans la formule de répartition territoriale, la préposition עַל introduit la bande tribale suivante par rapport à la frontière précédente. « Le long de » exprime naturellement cette relation spatiale.
- source_word: גְּבוּל
  choice: la frontière
  rationale: גְּבוּל désigne ici la ligne qui délimite un territoire; « frontière » convient à la formule géographique répétée du chapitre.
- source_word: זְבוּלֻן
  choice: Zabulon
  rationale: Forme française traditionnelle et courante du nom de la tribu.
- source_word: מִ/פְּאַת קָדִימָ/ה
  choice: du côté est
  rationale: פֵּאָה signifie « côté » ou « bord », et קָדִימָה indique la direction de l’est. La formulation conserve le sens de repère territorial dans un français naturel.
- source_word: עַד פְּאַת יָמָּ/ה
  choice: jusqu’au côté ouest
  rationale: L’expression marque l’étendue de la bande d’est en ouest. יָמָּה, littéralement orienté vers la mer, désigne ici l’ouest.
- source_word: גָּד
  choice: Gad
  rationale: Forme française usuelle du nom de la tribu.
- source_word: אֶחָד
  choice: une part
  rationale: L’hébreu porte seulement « un/une », mais la formule répétée des attributions territoriales dans le chapitre sous-entend une part. Le nom est explicité pour rendre l’ellipse intelligible en français.
