  text: 'On the south side[a], 4,500 cubits by measure, with three gates: the gate of Simeon, one; the gate of Issachar, one; the gate of Zebulun, one.'
translation:
  language: fr
  text: 'Du côté sud[a], 4 500 coudées, selon la mesure, avec trois portes : une porte de Siméon, une porte d’Issacar et une porte de Zabulon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit simplement « 4 500 de mesure » ; « coudées » est ajouté d’après le contexte immédiat, qui donne les dimensions de la ville dans cette section.
