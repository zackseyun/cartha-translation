lexical_decisions:
- source_word: וּ/פְאַת נֶגְבָּה
  choice: Du côté sud
  rationale: פֵּאָה désigne ici un côté ou bord, et נֶגְבָּה indique la direction du sud. Cette formulation est naturelle en français dans une description architecturale ; la conjonction initiale est absorbée dans l’enchaînement.
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים מִדָּה
  choice: 4 500 coudées de mesure
  rationale: Le nombre hébreu correspond à 4 500. Le texte dit littéralement « 4 500 de mesure » ; « coudées » est explicité d’après le contexte immédiat, tandis que « de mesure » maintient la présence de מִדָּה.
- source_word: וּ/שְׁעָרִים שְׁלֹשָׁה
  choice: avec trois portes
  rationale: La tournure présente les portes situées sur ce côté. « Avec trois portes » rend naturellement la fonction descriptive de la proposition nominale sans ajouter de verbe.
- source_word: שַׁעַר שִׁמְעוֹן אֶחָד
  choice: la porte de Siméon, une
  rationale: La structure répétitive « porte de [tribu], une » est conservée afin de reproduire la cadence formelle de l’énumération hébraïque.
- source_word: שַׁעַר יִשָּׂשכָר אֶחָד
  choice: la porte d’Issacar, une
  rationale: La même structure appositionnelle est maintenue avec la graphie française traditionnelle du nom propre.
- source_word: שַׁעַר זְבוּלֻן אֶחָד
  choice: la porte de Zabulon, une
  rationale: La répétition de l’hébreu est préservée, avec la forme française usuelle du nom propre.
