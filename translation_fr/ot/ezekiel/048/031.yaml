source:
  edition: WLC
  text: וְ/שַׁעֲרֵ֣י הָ/עִ֗יר עַל שְׁמוֹת֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל שְׁעָרִ֥ים שְׁלוֹשָׁ֖ה צָפ֑וֹנָ/ה שַׁ֣עַר רְאוּבֵ֞ן אֶחָ֗ד שַׁ֤עַר יְהוּדָה֙ אֶחָ֔ד שַׁ֥עַר לֵוִ֖י אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/031.yaml
  text: 'And the gates of the city shall be named after the tribes of Israel: three gates on the north side—one gate of Reuben[a], one gate of Judah, one gate of Levi.'
translation:
  language: fr
  text: 'Les portes de la ville porteront les noms des tribus d’Israël[a]. Du côté nord, il y aura trois portes : une porte de Ruben, une porte de Juda et une porte de Lévi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « seront désignées d’après les noms des tribus d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁעֲרֵי הָעִיר
  choice: Les portes de la ville
  rationale: Le syntagme construit est rendu directement. La conjonction וְ sert ici de liaison descriptive et n’a pas besoin d’être traduite par « et » dans ce verset autonome.
- source_word: עַל שְׁמוֹת שִׁבְטֵי יִשְׂרָאֵל
  choice: porteront les noms des tribus d’Israël
  rationale: Avec שְׁמוֹת, la préposition עַל exprime ici la correspondance de désignation. « Porteront les noms » est naturel en français et évite l’ambiguïté possible de « nommées d’après », qui pourrait suggérer un hommage.
- source_word: שְׁעָרִים שְׁלוֹשָׁה צָפוֹנָה
  choice: Du côté nord, il y aura trois portes
  rationale: Le locatif directionnel צָפוֹנָה désigne le côté nord dans cette description architecturale. La tournure existentielle française restitue clairement l’énumération.
- source_word: שַׁעַר רְאוּבֵן אֶחָד
  choice: une porte de Ruben
  rationale: Le génitif bref conserve l’association de la porte au nom tribal et maintient le parallélisme de l’énumération.
- source_word: שַׁעַר יְהוּדָה אֶחָד
  choice: une porte de Juda
  rationale: Même construction que pour Ruben ; la formulation uniforme respecte le caractère énumératif de l’hébreu.
- source_word: שַׁעַר לֵוִי אֶחָד
  choice: une porte de Lévi
  rationale: Le nom tribal Lévi est conservé, sans le développer en « Lévites », puisque le texte énumère les désignations tribales.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition hébraïque de « une » est conservée pour chacune des trois portes, tandis que la syntaxe est légèrement réorganisée afin d’être naturelle en français.
