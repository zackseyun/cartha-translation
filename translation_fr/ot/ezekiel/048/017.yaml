base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/017.yaml
  text: And the city's open land shall be two hundred fifty cubits to the north[a], two hundred fifty to the south, two hundred fifty to the east[b], and two hundred fifty to the west.
translation:
  language: fr
  text: Le terrain non bâti destiné à la ville mesurera deux cent cinquante coudées au nord[a], deux cent cinquante au sud, deux cent cinquante à l’est[b] et deux cent cinquante à l’ouest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu donne littéralement « cinquante et deux cents »; l’ordre usuel en français est « deux cent cinquante ». L’unité de mesure, implicite dans ce verset, est fournie par le contexte immédiat : des coudées.'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu traduit par « terrain non bâti » peut aussi désigner un pâturage ou un terrain communal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: s’étendra
  rationale: Dans cette description visionnaire, la forme verbale poursuit l’énoncé des dispositions à venir. « S’étendra » exprime naturellement l’existence et la mesure du terrain autour de la ville.
- source_word: מִגְרָשׁ
  choice: terrain libre
  rationale: Le terme désigne un espace non bâti réservé autour d’une localité, pouvant servir de pâturage ou de terrain communal. « Terrain libre » évite le sens moderne trompeur de « banlieue ».
- source_word: לָעִיר
  choice: réservé à la ville
  rationale: La préposition marque ici le rapport d’affectation ou d’appartenance du terrain à la ville.
- source_word: צָפוֹנָה / נֶגְבָּה / קָדִימָה / יָמָּה
  choice: au nord / au sud / à l’est / à l’ouest
  rationale: Les formes directionnelles indiquent les quatre côtés ou directions. Les points cardinaux sont la formulation française la plus claire; יָמָּה, littéralement « vers la mer », désigne conventionnellement l’ouest.
- source_word: חֲמִשִּׁים וּמָאתַיִם
  choice: deux cent cinquante coudées
  rationale: L’hébreu dit littéralement « cinquante et deux cents ». L’ordre français usuel est « deux cent cinquante ». L’unité, implicite dans ce verset mais établie par le contexte immédiat, est explicitée pour la clarté.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la répétition structurée des quatre directions tout en évitant une tournure inutilement archaïque. L’ajout explicatif « réservé » rend la relation marquée par ל, et « coudées » est signalé en note comme une unité fournie par le contexte.
