  text: וְ/עַ֣ל גְּב֣וּל מְנַשֶּׁ֗ה מִ/פְּאַ֥ת קָדִ֛מָ/ה עַד פְּאַת יָ֖מָּ/ה אֶפְרַ֥יִם אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/005.yaml
  text: And along the border of Manasseh[a], from the east side to the west side, Ephraim, one portion.
translation:
  language: fr
  text: 'Le long de la frontière de Manassé, depuis le côté est jusqu’au côté ouest : Éphraïm, une part.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Éphraïm, un »; dans ce contexte, le sens est : « Éphraïm, une part ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל גְּבוּל
  choice: Le long de la frontière
  rationale: La formule enchaîne avec la part tribale suivante et situe celle-ci le long de la frontière de Manassé. En français, l’absence de « Et » en tête est plus naturelle tout en conservant la progression de la liste.
- source_word: מְנַשֶּׁה
  choice: Manassé
  rationale: Forme française traditionnelle et courante du nom de la tribu.
- source_word: מִפְּאַת קָדִימָה עַד פְּאַת יָמָּה
  choice: depuis le côté est jusqu’au côté ouest
  rationale: Cette formulation restitue le parallélisme des deux occurrences de פְּאַת et l’étendue complète d’est en ouest; יָמָּה a ici son sens géographique occidental.
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Forme française courante du nom de la tribu.
- source_word: אֶחָד
  choice: une part
  rationale: L’hébreu dit littéralement « un », mais la formule distributive du chapitre sous-entend une part territoriale; « une part » rend ce sens implicite en français.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La construction nominale brève après les deux-points conserve le caractère schématique de la liste des attributions territoriales.
