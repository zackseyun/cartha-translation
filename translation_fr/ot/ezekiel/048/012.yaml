reference: Ezekiel 48:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיְתָ֨ה לָ/הֶ֧ם תְּרוּמִיָּ֛ה מִ/תְּרוּמַ֥ת הָ/אָ֖רֶץ קֹ֣דֶשׁ קָדָשִׁ֑ים אֶל גְּב֖וּל הַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/012.yaml
  text: And it shall be for them a special allotment from the contribution of the land[a], most holy[c][b], beside the territory of the Levites.
translation:
  language: fr
  text: Ce sera pour eux une part réservée, prise sur la portion prélevée du pays[a], très sainte[b], à côté du territoire des Lévites[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prise sur l’offrande du pays ». Le terme hébreu désigne une contribution ou une portion mise à part, notamment pour un usage sacré.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « saint des saints », tournure superlative qui peut aussi se rendre par « très saint ». Ici, elle qualifie la portion de terre.
    reason: lexical_alternative
  - marker: c
    text: Ou « à côté de la frontière des Lévites ». Le mot hébreu peut désigner une frontière ou le territoire qu’elle délimite.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Ce sera
  rationale: Dans cette description de la répartition future du pays, le parfait avec waw a une valeur future et résultative. « Ce sera » est naturel en français.
- source_word: לָהֶם
  choice: pour eux
  rationale: La préposition ל exprime ici la destination ou l’appartenance au bénéfice des prêtres mentionnés dans le contexte immédiat.
- source_word: תְּרוּמִיָּה
  choice: une part réservée
  rationale: Le nom désigne une portion mise à part, apparentée à l’offrande prélevée. Dans le contexte foncier d’Ézéchiel 45–48, « part réservée » exprime clairement qu’il s’agit d’un terrain consacré.
- source_word: מִתְּרוּמַת הָאָרֶץ
  choice: prise sur la portion prélevée du pays
  rationale: La préposition מִן indique que cette part provient de la grande portion mise à part dans le pays. « Portion prélevée » conserve l’image et le lien lexical avec תְּרוּמָה.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: très sainte
  rationale: La construction exprime un degré superlatif de sainteté. L’accord avec « part » restitue sa fonction prédicative sans ajouter le nom « lieu », absent de l’hébreu.
- source_word: אֶל
  choice: à côté de
  rationale: Dans cette description territoriale, la préposition marque la proximité ou la contiguïté.
- source_word: גְּבוּל הַלְוִיִּם
  choice: le territoire des Lévites
  rationale: גְּבוּל peut désigner soit la frontière, soit l’étendue territoriale qu’elle délimite. « Territoire » convient naturellement au partage foncier, tandis que l’autre possibilité est signalée en note.
theological_decisions:
- issue: Portée de l’expression קֹדֶשׁ קָדָשִׁים
  choice: très sainte
  alternative: un lieu très saint / le saint des saints
  rationale: Ici, l’expression qualifie une portion de terre. La traduction retenue préserve le superlatif sacré sans l’identifier au sanctuaire intérieur ni ajouter explicitement « lieu ».
translation_notes:
  register: Français international moderne, sobre et digne. La formulation garde le vocabulaire du prélèvement foncier tout en évitant le cultisme potentiellement trompeur « offrande » dans le texte principal. La syntaxe reste proche de l’hébreu sans devenir lourde.
