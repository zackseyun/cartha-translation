source:
  edition: WLC
  text: וְ/עַל֙ גְּב֣וּל גָּ֔ד אֶל פְּאַ֖ת נֶ֣גֶב תֵּימָ֑נָ/ה וְ/הָיָ֨ה גְב֜וּל מִ/תָּמָ֗ר מֵ֚י מְרִיבַ֣ת קָדֵ֔שׁ נַחֲלָ֖ה עַל הַ/יָּ֥ם הַ/גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/028.yaml
  text: And along the border of Gad[a], on the south side southward, the border shall run from Tamar to the waters of Meribath-kadesh, to the Wadi of Egypt[b], and on to the Great Sea.
translation:
  language: fr
  text: Le long de la frontière de Gad, du côté sud, vers le sud, la frontière ira de Tamar jusqu’aux eaux de Meribath-Cadès[a], jusqu’à l’oued[b], puis jusqu’à la Grande Mer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi rendre ce nom par « Meriba-Cadès », forme plus familière dans certaines traductions.
    reason: lexical_alternative
  - marker: b
    text: Ou « le torrent ». Le mot hébreu peut désigner un cours d’eau saisonnier ou son lit; le texte hébreu de ce verset ne porte pas « d’Égypte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל גְּבוּל גָּד
  choice: Le long de la frontière de Gad
  rationale: Dans une description territoriale, « le long de » rend naturellement la relation spatiale exprimée par עַל, tandis que le groupe construit désigne la frontière du lot attribué à Gad.
- source_word: אֶל פְּאַת נֶגֶב תֵּימָנָה
  choice: du côté sud, vers le sud
  rationale: Cette formulation conserve l’accumulation de termes directionnels du texte hébreu sans la réduire à une seule indication.
- source_word: וְהָיָה גְבוּל
  choice: la frontière ira
  rationale: Dans une formule de délimitation, « ira » exprime clairement le tracé de la frontière tout en rendant la valeur prospective du verbe.
- source_word: מִתָּמָר
  choice: de Tamar
  rationale: Le nom géographique est translittéré sous sa forme courante et la préposition indique le point de départ.
- source_word: מֵי מְרִיבַת קָדֵשׁ
  choice: aux eaux de Meribath-Cadès
  rationale: Le toponyme composé est translittéré au plus près de la forme construite du texte hébreu; « eaux » rend explicitement מֵי.
- source_word: נַחֲלָה
  choice: au torrent
  rationale: Il s’agit ici de la forme directionnelle de נַחַל, qui désigne un cours d’eau ou un lit de torrent. Le complément « d’Égypte », absent de ce verset dans le texte massorétique, n’est pas ajouté.
- source_word: עַל הַיָּם הַגָּדוֹל
  choice: et jusqu’à la Grande Mer
  rationale: Dans la séquence du tracé, la préposition marque l’aboutissement à la mer Méditerranée, appelée ici littéralement « la Grande Mer ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La répétition directionnelle de l’hébreu est conservée par « du côté sud, vers le sud ». Les noms propres suivent des formes françaises lisibles, avec « Cadès » et « Grande Mer ».
