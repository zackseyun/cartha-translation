base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/013.yaml
  text: And alongside the territory of the priests[a], the Levites shall have twenty-five thousand cubits in length and ten thousand in width. The whole length shall be twenty-five thousand, and the width ten thousand.
translation:
  language: fr
  text: À côté du territoire des prêtres, les Lévites auront une portion de vingt-cinq mille coudées[a] de longueur et de dix mille de largeur. La longueur totale sera de vingt-cinq mille coudées, et la largeur de dix mille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu ne précise ici que « vingt-cinq mille » et « dix mille »; l’unité « coudées » est ajoutée d’après le contexte des mesures en Ézéchiel 48.
    reason: cross_reference
lexical_decisions:
- source_word: לְעֻמַּת
  choice: le long de
  rationale: Dans ce contexte de répartition territoriale, la préposition exprime la correspondance spatiale et la contiguïté avec le territoire des prêtres.
- source_word: גְּבוּל
  choice: territoire
  rationale: Le nom peut désigner une frontière, mais il renvoie ici par métonymie à la portion de terre délimitée attribuée aux prêtres.
- source_word: וְהַלְוִיִּם
  choice: les Lévites auront une portion
  rationale: L’hébreu est elliptique et sans verbe; le contexte fournit l’idée d’une portion attribuée. Cette formulation rend la phrase naturelle en français sans modifier son sens.
- source_word: חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: vingt-cinq mille coudées
  rationale: Le texte donne seulement le nombre; l’unité « coudées » est reprise du contexte des mesures d’Ézéchiel 48 et explicitée pour éviter toute ambiguïté.
- source_word: אֹרֶךְ וְרֹחַב
  choice: de long sur … de large
  rationale: Cette tournure française courante exprime clairement les deux dimensions tout en conservant leur parallélisme.
- source_word: כָּל אֹרֶךְ
  choice: la longueur totale
  rationale: La formule introduit la récapitulation de la dimension longitudinale de toute la portion.
