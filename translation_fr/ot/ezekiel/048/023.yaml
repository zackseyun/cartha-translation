source:
  edition: WLC
  text: וְ/יֶ֖תֶר הַ/שְּׁבָטִ֑ים מִ/פְּאַ֥ת קָדִ֛ימָ/ה עַד פְּאַת יָ֖מָּ/ה בִּנְיָמִ֥ן אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/023.yaml
  text: 'And for the rest of the tribes: from the eastern side to the western side[a], Benjamin, one portion.'
translation:
  language: fr
  text: 'Quant au reste des tribus, de la limite orientale jusqu’à la limite occidentale : Benjamin, une part.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Benjamin, un ». Le mot « part » est ajouté, car, dans ce chapitre, « un » désigne de manière elliptique une part de territoire attribuée à une tribu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר הַשְּׁבָטִים
  choice: Quant au reste des tribus
  rationale: Cette formulation introduit naturellement en français une nouvelle section consacrée aux tribus restantes, tout en conservant le sens du nom יֶתֶר et son lien avec ce qui précède.
- source_word: מִפְּאַת קָדִימָה
  choice: de la limite orientale
  rationale: פֵּאָה peut désigner un côté, une extrémité ou une limite. Dans ce contexte de délimitation territoriale, « limite orientale » est précis et naturel.
- source_word: עַד פְּאַת יָמָּה
  choice: jusqu’à la limite occidentale
  rationale: יָמָּה indique ici la direction de l’ouest, littéralement le côté de la mer. « Jusqu’à la limite occidentale » rend clairement l’étendue du territoire.
- source_word: בִּנְיָמִן
  choice: Benjamin
  rationale: Forme française traditionnelle et courante du nom propre de la tribu.
- source_word: אֶחָד
  choice: une part
  rationale: L’hébreu dit littéralement « un ». Dans le schéma répétitif du chapitre, ce nombre désigne elliptiquement une part territoriale attribuée à une tribu; le féminin s’accorde avec « part » sous-entendu puis explicité.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Quant au reste » marque la transition; « limite » privilégie le contexte territorial. La brièveté nominale de la conclusion hébraïque est conservée autant que possible.
