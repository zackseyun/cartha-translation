  text: וְ/אֵ֖לֶּה תּוֹצְאֹ֣ת הָ/עִ֑יר מִ/פְּאַ֣ת צָפ֔וֹן חֲמֵ֥שׁ מֵא֛וֹת וְ/אַרְבַּ֥עַת אֲלָפִ֖ים מִדָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/030.yaml
  text: 'And these are the exits of the city: on the north side[b][a], four thousand five hundred measures.'
translation:
  language: fr
  text: 'Et voici les issues de la ville[a] : du côté nord, quatre mille cinq cents mesures[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les limites extérieures de la ville ». Le terme hébreu peut désigner ses issues ou ses limites extérieures.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « cinq cents et quatre mille », soit, dans l’ordre usuel en français, « quatre mille cinq cents ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: Introduit naturellement en français moderne une nouvelle section descriptive, tout en conservant la solennité d’une énumération.
- source_word: תּוֹצְאֹת הָעִיר
  choice: les issues de la ville
  rationale: « Issues » exprime les points ou voies de sortie sans les identifier prématurément aux portes mentionnées dans les versets suivants; le terme hébreu peut aussi évoquer les prolongements extérieurs.
- source_word: מִפְּאַת צָפוֹן
  choice: du côté nord
  rationale: Rend idiomatiquement la préposition et le nom פֵּאָה dans ce contexte de description du périmètre urbain.
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים
  choice: quatre mille cinq cents
  rationale: Adopte l’ordre numérique naturel en français tout en conservant exactement la quantité exprimée par l’hébreu, littéralement « cinq cents et quatre mille ».
- source_word: מִדָּה
  choice: mesures
  rationale: Conserve l’indétermination de l’unité dans ce verset et évite d’ajouter « coudées », absent du texte hébreu.
