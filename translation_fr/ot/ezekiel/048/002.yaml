source:
  edition: WLC
  text: וְ/עַ֣ל גְּב֣וּל דָּ֗ן מִ/פְּאַ֥ת קָדִ֛ים עַד פְּאַת יָ֖מָּ/ה אָשֵׁ֥ר אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/002.yaml
  text: And along the border of Dan[a], from the eastern side to the western side, Asher, one portion.
translation:
  language: fr
  text: 'Le long de la frontière de Dan, depuis le côté est jusqu’au côté ouest[a] : une part pour Aser.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « jusqu’au côté de la mer ». Ici, « mer » sert de terme directionnel et désigne l’ouest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל גְּבוּל דָּן
  choice: Le long de la frontière de Dan
  rationale: La préposition עַל situe la part suivante au contact de la frontière de Dan. En français, « le long de » exprime naturellement cette relation spatiale; la coordination initiale n’a pas besoin d’être reproduite par « et » dans cette énumération.
- source_word: מִפְּאַת קָדִים
  choice: depuis le côté est
  rationale: פֵאָה désigne ici un côté ou une extrémité, et קָדִים indique l’est. Cette formulation reste proche de la structure géographique de l’hébreu.
- source_word: עַד פְּאַת יָמָּה
  choice: jusqu’au côté ouest
  rationale: Dans cet emploi directionnel, יָם (« mer ») désigne l’ouest. La traduction explicite le repère cardinal tout en signalant le sens littéral en note.
- source_word: אָשֵׁר אֶחָד
  choice: une part pour Aser
  rationale: אֶחָד, littéralement « un », est elliptique dans la formule répétée des attributions territoriales. « Une part » rend explicite le nom sous-entendu, tandis que « pour Aser » exprime clairement le bénéficiaire de l’attribution.
