source:
  edition: WLC
  text: וּ/מֵ/אֲחֻזַּ֤ת הַ/לְוִיִּם֙ וּ/מֵ/אֲחֻזַּ֣ת הָ/עִ֔יר בְּ/ת֛וֹךְ אֲשֶׁ֥ר לַ/נָּשִׂ֖יא יִֽהְיֶ֑ה בֵּ֣ין גְּב֣וּל יְהוּדָ֗ה וּ/בֵין֙ גְּב֣וּל בִּנְיָמִ֔ן לַ/נָּשִׂ֖יא יִהְיֶֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/022.yaml
  text: And from the property of the Levites and from the property of the city[a], in the midst of what belongs to the prince, between the border of Judah and the border of Benjamin[b], it shall belong to the prince.
translation:
  language: fr
  text: Et, à partir du domaine des Lévites et du domaine de la ville, au milieu de ce qui appartiendra au prince, entre la frontière de Juda et la frontière de Benjamin, cela appartiendra au prince.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cela sera au prince ». « Frontière » peut aussi se traduire par « territoire ».'
    reason: La reprise finale est elliptique en hébreu; le pronom « cela » conserve ce référent non précisé sans l’élargir. Le mot hébreu peut désigner une frontière ou un territoire.
lexical_decisions:
- source_word: אֲחֻזַּת
  choice: propriété
  rationale: Le nom désigne ici un bien foncier attribué. « Propriété » est naturel en français moderne et convient au contexte territorial.
- source_word: הַלְוִיִּם
  choice: les Lévites
  rationale: Désignation traditionnelle et claire du groupe, avec l’article défini conservé.
- source_word: הָעִיר
  choice: la ville
  rationale: Référence directe à la portion foncière de la ville dans le partage décrit par le contexte.
- source_word: בְּתוֹךְ
  choice: au milieu de
  rationale: Cette expression conserve la valeur spatiale du texte hébreu et situe les propriétés des Lévites et de la ville à l’intérieur de la portion du prince.
- source_word: אֲשֶׁר לַנָּשִׂיא יִהְיֶה
  choice: ce qui appartiendra au prince
  rationale: Rend naturellement en français la proposition relative et sa valeur possessive, tout en gardant le futur du texte.
- source_word: נָשִׂיא
  choice: prince
  rationale: Titre traditionnel qui maintient la distinction du texte entre ce dirigeant et un roi, sans préciser davantage son statut.
- source_word: בֵּין גְּבוּל יְהוּדָה וּבֵין גְּבוּל בִּנְיָמִן
  choice: entre la frontière de Juda et la frontière de Benjamin
  rationale: « Frontière » préserve l’image de lignes de démarcation territoriales; le nom גְּבוּל peut aussi désigner le territoire lui-même.
- source_word: לַנָּשִׂיא יִהְיֶה
  choice: appartiendra au prince
  rationale: La reprise finale souligne l’attribution au prince; cette formulation française exprime clairement la valeur possessive.
theological_decisions:
- issue: Sens de נָשִׂיא dans la vision du partage restauré du pays
  choice: prince
  alternative: dirigeant; chef
  rationale: « Prince » conserve le titre politique distinct employé par Ézéchiel, sans imposer une identification constitutionnelle ou messianique que ce verset ne formule pas.
- issue: Référent grammatical de l’attribution finale au prince
  choice: tout ce qui se trouve entre les frontières tribales
  alternative: il appartiendra au prince
  rationale: L’ajout explicatif « tout ce qui se trouve » rend intelligible la syntaxe elliptique hébraïque. Une traduction plus formelle laisserait le pronom sans antécédent immédiatement clair.
translation_notes:
  register: Français international moderne, digne et lisible. La structure répétitive de l’hébreu est largement conservée, mais la proposition finale est explicitée afin d’éviter un pronom français ambigu. Le marqueur de note [a] figure dans le texte.
