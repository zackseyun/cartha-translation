    rationale: שַׁעֲרֵיהֶם comprend un suffixe possessif pluriel. Même si le français peut parfois le sous-entendre, « avec trois portes » ne le représente pas. « Avec ses trois portes » est idiomatique en français et conserve le lien des portes avec la ville/le côté décrit.
