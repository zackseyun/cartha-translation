  yaml_path: translation/ot/ezekiel/048/034.yaml
  text: 'On the west side[a], four thousand five hundred, with their three gates: the gate of Gad, one; the gate of Asher, one; the gate of Naphtali[b], one.'
translation:
  language: fr
  text: 'Du côté ouest : quatre mille cinq cents[a], avec ses trois portes[b] : une porte de Gad, une d’Aser et une de Nephtali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « cinq cents et quatre mille ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie une formule sans verbe, littéralement : « leurs portes, trois ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּאַת יָמָּה
  choice: Du côté ouest
  rationale: פְּאַת désigne ici le côté ou la bordure, et יָמָּה indique la direction de l’ouest, littéralement « vers la mer ». « Du côté ouest » convient naturellement à l’énumération des côtés de la ville.
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים
  choice: quatre mille cinq cents
  rationale: L’hébreu énonce littéralement « cinq cents et quatre mille », soit 4 500. Le français place normalement le millier avant les centaines.
- source_word: שַׁעֲרֵיהֶם שְׁלֹשָׁה
  choice: avec trois portes
  rationale: La proposition nominale signifie littéralement « leurs portes, trois ». Dans cette liste de mesures, « avec trois portes » exprime clairement et sans ajouter de verbe temporel que ce côté comporte trois portes.
- source_word: שַׁעַר גָּד אֶחָד
  choice: une porte pour Gad
  rationale: La formule hébraïque « porte de Gad, une » attribue une porte à la tribu de Gad. Cette formulation française conserve l’énumération tout en restant naturelle.
- source_word: שַׁעַר אָשֵׁר אֶחָד
  choice: une pour Aser
  rationale: La construction identique attribue une porte à Aser. La reprise elliptique de « porte » évite une lourdeur sans perdre aucun élément de sens.
- source_word: שַׁעַר נַפְתָּלִי אֶחָד
  choice: une pour Nephtali
  rationale: La même formule attribue une porte à Nephtali. Les graphies « Aser » et « Nephtali » suivent l’usage biblique français courant.
