  text: 'Along the border of Benjamin[a], from the east side to the west side, Simeon: one portion.'
translation:
  language: fr
  text: 'Le long de la frontière de Benjamin, du côté est jusqu’au côté ouest : Siméon, une part.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « Siméon, un » ; le nom « part » est sous-entendu dans la formule de répartition répétée dans ce chapitre.
