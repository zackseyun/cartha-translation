lexical_decisions:
- source_word: וְעַל גְּבוּל
  choice: Le long de la frontière
  rationale: Dans la formule de répartition territoriale, la locution situe la part suivante par rapport à la limite de Benjamin. Le « et » initial hébreu marque la succession et peut rester implicite en français.
- source_word: בִּנְיָמִן
  choice: Benjamin
  rationale: Forme française traditionnelle du nom de la tribu.
- source_word: מִפְּאַת קָדִימָה עַד פְּאַת יָמָּה
  choice: du côté est jusqu’au côté ouest
  rationale: Rend symétriquement les deux indications spatiales et conserve l’idée d’une étendue allant d’un bord à l’autre.
- source_word: שִׁמְעוֹן
  choice: Siméon
  rationale: Forme française traditionnelle du nom de la tribu.
- source_word: אֶחָד
  choice: une part
  rationale: L’hébreu porte littéralement « un », mais le nom sous-entendu désigne, d’après la formule répétée du chapitre, une part territoriale. Le féminin s’accorde avec « part ».
