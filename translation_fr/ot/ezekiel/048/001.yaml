  text: וְ/אֵ֖לֶּה שְׁמ֣וֹת הַ/שְּׁבָטִ֑ים מִ/קְצֵ֣ה צָפ֡וֹנָ/ה אֶל יַ֣ד דֶּֽרֶךְ חֶתְלֹ֣ן לְֽבוֹא חֲמָ֡ת חֲצַ֣ר עֵינָן֩ גְּב֨וּל דַּמֶּ֤שֶׂק צָפ֨וֹנָ/ה֙ אֶל יַ֣ד חֲמָ֔ת וְ/הָיוּ ל֧/וֹ פְאַת קָדִ֛ים הַ/יָּ֖ם דָּ֥ן אֶחָֽד־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/001.yaml
  text: 'These are the names of the tribes: from the northern extremity[a], beside the way of Hethlon to Lebo-hamath, Hazar-enan, at the border of Damascus northward beside Hamath, and extending from the east side to the sea, Dan[b], one portion.'
translation:
  language: fr
  text: 'Voici les noms des tribus : à partir de l’extrémité nord, le long de la route de Hethlôn, vers Lebo-Hamath[a], Hatsar-Enân, à la frontière de Damas, au nord, à côté de Hamath ; du côté est jusqu’à la mer : une part pour Dan[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers l’entrée de Hamath » ; Lebo-Hamath est traditionnellement compris comme un nom de lieu.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu est condensé ; littéralement : « et il y aura pour lui [une étendue] du côté est [jusqu’à] la mer : Dan, une [part] ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: Introduit naturellement en français moderne la liste qui suit, sans ajouter une valeur temporelle absente de l’hébreu.
- source_word: שְׁמוֹת הַשְּׁבָטִים
  choice: les noms des tribus
  rationale: Rend directement la chaîne construite et emploie le terme consacré pour les tribus d’Israël.
- source_word: מִקְצֵה צָפוֹנָה
  choice: depuis l’extrémité nord
  rationale: קָצֶה désigne une extrémité ou une limite ; cette formulation convient au contexte topographique.
- source_word: אֶל יַד דֶּרֶךְ חֶתְלֹן
  choice: le long de la route de Hethlôn
  rationale: Dans une description de frontière, אֶל יַד exprime la proximité ou le parcours longeant un repère ; « le long de » est idiomatique et précis.
- source_word: לְבוֹא חֲמָת
  choice: vers Lebo-Hamath
  rationale: L’expression peut se comprendre littéralement comme « l’entrée de Hamath », mais elle fonctionne aussi comme un nom de lieu ; la translittération préserve cet usage tout en signalant l’autre possibilité en note.
- source_word: חֲצַר עֵינָן
  choice: Hatsar-Enân
  rationale: Translittération française du nom propre géographique.
- source_word: גְּבוּל דַּמֶּשֶׂק צָפוֹנָה אֶל יַד חֲמָת
  choice: à la frontière de Damas, au nord, à côté de Hamath
  rationale: Conserve l’enchaînement des repères et l’orientation du texte hébreu sans trancher excessivement la relation syntaxique entre eux.
- source_word: פְאַת קָדִים הַיָּם
  choice: du côté est jusqu’à la mer
  rationale: Rend פֵאָה par « côté », קָדִים par « est » et garde l’image explicite de la mer, qui marque ici l’étendue vers l’ouest.
- source_word: דָּן אֶחָד
  choice: une part pour Dan
  rationale: La formule elliptique désigne une bande territoriale attribuée à Dan ; « une part » restitue sobrement ce sens dans le contexte du partage.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation structure la longue description topographique sans transformer les repères en propositions trop explicatives. Les noms de lieux sont translittérés selon des formes adaptées au français.
