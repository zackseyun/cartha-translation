  - severity: low
    issue: La note b propose « son côté s’étendra », formulation plus interprétative que nécessaire.
    rationale: L’hébreu emploie une formulation condensée avec « ils seront pour lui » et des termes sous-entendus. Une note littérale avec crochets informe le lecteur sans imposer une reconstruction syntaxique particulière.
