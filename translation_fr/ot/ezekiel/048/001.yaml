  rationale: La révision conserve tous les repères et la formulation topographique du projet, tout en clarifiant par la ponctuation que l’étendue allant de l’est à la mer caractérise la part de Dan. La note b est rendue plus proche de l’ellipse hébraïque et évite de présenter comme certaine une explicitation verbale contestable.
