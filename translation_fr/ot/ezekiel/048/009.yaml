source:
  edition: WLC
  text: הַ/תְּרוּמָ֕ה אֲשֶׁ֥ר תָּרִ֖ימוּ לַֽ/יהוָ֑ה אֹ֗רֶךְ חֲמִשָּׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף וְ/רֹ֖חַב עֲשֶׂ֥רֶת אֲלָפִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/009.yaml
  text: The contribution that you shall set apart for Yahweh shall be twenty-five thousand in length and ten thousand in width[a].
translation:
  language: fr
  text: La part que vous prélèverez pour Yahweh aura vingt-cinq mille de longueur et dix mille de largeur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’offrande » ou « la portion mise à part ». Le terme hébreu désigne ce qui est prélevé et consacré comme contribution; ici, il s’agit d’une étendue sacrée prise sur le territoire. L’unité de mesure n’est pas précisée dans ce verset.
    reason: Alternative lexicale et unité de mesure implicite.
lexical_decisions:
- source_word: הַתְּרוּמָה
  choice: la part
  rationale: Dans Ézéchiel 45–48, תְּרוּמָה désigne une étendue de terre prélevée et consacrée. « La part » convient naturellement au contexte territorial sans réduire le terme à une offrande cultuelle.
- source_word: אֲשֶׁר תָּרִימוּ
  choice: que vous prélèverez
  rationale: Le hiphil de רוּם signifie ici retirer une portion de l’ensemble afin de la consacrer. « Prélever » exprime à la fois la séparation et le contexte foncier.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל indique ici la destination ou la consécration; « pour » est idiomatique en français. Le tétragramme est transcrit « Yahweh ».
- source_word: אֹרֶךְ חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: aura vingt-cinq mille de longueur
  rationale: Cette formulation française rend clairement la première dimension. Aucune unité n’est ajoutée, puisque le texte hébreu n’en donne pas dans ce verset.
- source_word: וְרֹחַב עֲשֶׂרֶת אֲלָפִים
  choice: et dix mille de largeur
  rationale: La construction parallèle conserve la présentation des dimensions et laisse, comme l’hébreu, l’unité implicite.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme; sa transcription préserve le nom divin plutôt que de lui substituer un titre.
- issue: Nature de la תְּרוּמָה
  choice: une part territoriale consacrée
  alternative: une offrande cultuelle
  rationale: Le contexte de la répartition du pays indique une étendue mise à part, tout en conservant la notion de consécration attachée au terme hébreu.
translation_notes:
  register: Français international moderne, clair et digne. « Prélever » convient au partage foncier; la syntaxe garde le parallélisme des deux dimensions sans fournir une unité absente de l’hébreu.
