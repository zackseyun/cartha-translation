  text: וְ/הָ/עֹבֵ֖ד הָ/עִ֑יר יַעַבְד֕וּ/הוּ מִ/כֹּ֖ל שִׁבְטֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/019.yaml
  text: And those who serve the city shall serve it from all the tribes of Israel[a][b].
translation:
  language: fr
  text: Ceux qui servent la ville la serviront, venant de toutes les tribus d’Israël[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui sert la ville la servira ». Le participe hébreu est au singulier, mais il semble avoir ici un sens collectif, notamment parce que le verbe suivant est au pluriel.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu porte littéralement un suffixe masculin singulier : « le serviront ». Dans le contexte, ce suffixe renvoie à la ville ; le français exige donc naturellement « la serviront ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹבֵד הָעִיר
  choice: ceux qui servent la ville
  rationale: Le participe hébreu est grammaticalement au singulier, mais il a ici vraisemblablement un sens collectif ou générique, confirmé par le verbe suivant au pluriel. « Servent » conserve le lien lexical avec la seconde forme du verbe עבד.
- source_word: יַעַבְד֕וּהוּ
  choice: la serviront
  rationale: Le verbe עבד exprime ici un travail ou service rendu. Le suffixe masculin singulier renvoie, dans le contexte, à la ville ; le français emploie naturellement le pronom féminin « la ».
- source_word: מִכֹּל
  choice: venant de toutes
  rationale: La préposition מן avec כֹּל indique l’origine ou la provenance des personnes chargées du service de la ville.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: les tribus d’Israël
  rationale: Rendu naturel et direct de l’état construit hébreu.
