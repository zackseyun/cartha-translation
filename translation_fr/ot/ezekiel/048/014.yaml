  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹא יִמְכְּר֣וּ מִמֶּ֗/נּוּ וְ/לֹ֥א יָמֵ֛ר וְ/לֹ֥א יעבור רֵאשִׁ֣ית הָ/אָ֑רֶץ כִּי קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/014.yaml
  text: They must not sell any of it[a], nor exchange it, nor shall this choice portion of the land pass over to another, for it is holy to Yahweh.
translation:
  language: fr
  text: Ils n’en vendront rien, ne l’échangeront pas, et cette part de choix du pays[a] ne passera pas à quelqu’un d’autre, car elle est sainte, consacrée à Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la première part du pays » ou « les prémices du pays ». L’expression hébraïque peut souligner soit le caractère premier ou privilégié de cette part, soit son statut de don consacré comparable à des prémices.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְכְּרוּ
  choice: vendront
  rationale: Le verbe מכר désigne simplement la vente; le futur français à valeur prescriptive convient à cette interdiction.
- source_word: מִמֶּנּוּ
  choice: n’en… rien
  rationale: Cette tournure française naturelle rend « de cela » après le verbe vendre et renvoie à la part consacrée décrite dans le contexte.
- source_word: יָמֵר
  choice: l’échangeront
  rationale: Le verbe מור signifie échanger ou substituer; « échanger » convient au contexte juridique d’un bien foncier consacré.
- source_word: יעבור
  choice: ne passera pas à quelqu’un d’autre
  rationale: עבר signifie littéralement « passer »; dans ce contexte de propriété, il évoque le passage du bien à un autre détenteur, tout en conservant l’image hébraïque.
- source_word: רֵאשִׁית הָאָרֶץ
  choice: cette portion de choix du pays
  rationale: רֵאשִׁית peut désigner ce qui est premier, principal ou offert comme prémices. Ici, l’expression renvoie à la portion privilégiée et consacrée du pays, sans imposer une image agricole.
- source_word: קֹדֶשׁ
  choice: sainte
  rationale: Le terme indique le caractère mis à part et consacré de cette portion; « sainte » conserve le vocabulaire théologique direct du texte.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל exprime ici l’appartenance ou la consécration, et le nom divin יהוה est rendu par « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le nom propre divin; « Yahweh » le rend comme nom d’alliance plutôt que de le remplacer par un titre.
- issue: Nature sacrée de la portion
  choice: elle est sainte pour Yahweh
  alternative: elle est consacrée à Yahweh
  rationale: « Sainte » traduit directement קֹדֶשׁ et préserve l’affirmation de statut du texte; « consacrée » en expliciterait davantage la fonction au prix d’une légère interprétation.
translation_notes:
  register: Français international moderne, clair et digne. La formulation juridique reste naturelle, tandis que la note préserve l’ambiguïté de רֵאשִׁית הָאָרֶץ.
