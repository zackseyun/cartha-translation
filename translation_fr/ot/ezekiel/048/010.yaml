  text: וּ֠/לְ/אֵ֜לֶּה תִּהְיֶ֣ה תְרֽוּמַת הַ/קֹּדֶשׁ֮ לַ/כֹּֽהֲנִים֒ צָפ֜וֹנָ/ה חֲמִשָּׁ֧ה וְ/עֶשְׂרִ֣ים אֶ֗לֶף וְ/יָ֨מָּ/ה֙ רֹ֚חַב עֲשֶׂ֣רֶת אֲלָפִ֔ים וְ/קָדִ֗ימָ/ה רֹ֚חַב עֲשֶׂ֣רֶת אֲלָפִ֔ים וְ/נֶ֕גְבָּ/ה אֹ֕רֶךְ חֲמִשָּׁ֥ה וְ/עֶשְׂרִ֖ים אָ֑לֶף וְ/הָיָ֥ה מִקְדַּשׁ יְהוָ֖ה בְּ/תוֹכֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/010.yaml
  text: 'And for these[a], the holy contribution shall belong to the priests: on the north, twenty-five thousand in length; on the west, ten thousand in width; on the east, ten thousand in width; and on the south, twenty-five thousand in length[b]; and the sanctuary of Yahweh shall be in its midst.'
translation:
  language: fr
  text: 'À ceux-ci reviendra la portion sacrée[a] réservée aux prêtres : au nord, elle mesurera 25 000 de long ; à l’ouest, 10 000 de large ; à l’est, 10 000 de large ; et au sud, 25 000 de long[b] ; et le sanctuaire de Yahweh sera en son milieu.


    [a] Littéralement « le prélèvement sacré » : une portion mise à part pour un usage sacré.


    [b] L’unité de mesure n’est pas précisée dans le texte hébreu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « le prélèvement sacré » : une portion mise à part pour un usage sacré.'
    reason: Signale le sens concret et cultuel de תְּרוּמַת הַקֹּדֶשׁ, dont « portion sacrée » donne une traduction contextuelle.
  - marker: b
    text: L’unité de mesure n’est pas précisée dans le texte hébreu.
    reason: Évite d’introduire une unité absente de la source et informe le lecteur de cette indétermination.
lexical_decisions:
- source_word: וּלְאֵלֶּה
  choice: À ceux-ci reviendra
  rationale: Le לְ marque ici l’attribution. Cette formulation conserve le démonstratif hébreu et exprime naturellement l’idée d’une portion assignée.
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  choice: la portion sacrée
  rationale: Dans cette vision territoriale, תְּרוּמָה désigne une portion de territoire prélevée et mise à part. « Portion sacrée » rend le référent concret et le caractère consacré, tandis que la note signale la formulation plus littérale.
- source_word: לַכֹּהֲנִים
  choice: réservée aux prêtres
  rationale: Le datif désigne les bénéficiaires de cette portion. « Réservée aux prêtres » est idiomatique et explicite l’attribution.
- source_word: צָפוֹנָה ... וְיָמָּה ... וְקָדִימָה ... וְנֶגְבָּה
  choice: au nord ... à l’ouest ... à l’est ... au sud
  rationale: Ces adverbes directionnels décrivent les quatre côtés du territoire ; cette série est naturelle dans une description de limites en français.
- source_word: רֹחַב / אֹרֶךְ
  choice: de large / de long
  rationale: Ces expressions françaises rendent clairement l’opposition entre largeur et longueur sans alourdir l’énumération.
- source_word: מִקְדַּשׁ יְהוָה
  choice: le sanctuaire de Yahweh
  rationale: מִקְדָּשׁ désigne le sanctuaire, et le tétragramme est transcrit « Yahweh » afin de préserver le nom divin présent dans le texte.
- source_word: בְּתוֹכוֹ
  choice: en son milieu
  rationale: La formulation garde le pronom masculin du texte hébreu, dont le référent naturel est la portion ou le territoire décrit.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » en donne une transcription usuelle et préserve le caractère personnel du nom.
- issue: Nature de la תְּרוּמָה dans la vision
  choice: portion de territoire mise à part pour un usage sacré
  alternative: offrande cultuelle au sens matériel ordinaire
  rationale: Le contexte et les dimensions montrent qu’il s’agit ici d’un lot territorial consacré, tout en maintenant par « sacrée » la portée cultuelle du terme.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe est allégée pour rendre naturellement l’énumération cadastrale, sans ajouter d’unité de mesure ni résoudre au-delà du texte le référent de « son ».
