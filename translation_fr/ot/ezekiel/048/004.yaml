id: EZK.48.4
reference: Ezekiel 48:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַ֣ל גְּב֣וּל נַפְתָּלִ֗י מִ/פְּאַ֥ת קָדִ֛מָ/ה עַד פְּאַת יָ֖מָּ/ה מְנַשֶּׁ֥ה אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/004.yaml
  text: And along the border of Naphtali[a], from the east side to the west side, Manasseh, one portion.
translation:
  language: fr
  text: 'Le long de la frontière de Nephtali, depuis le côté est jusqu’au côté ouest : Manassé, une part.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Manassé, un. » Le mot « part » est ajouté parce que le chapitre emploie à plusieurs reprises cette formule elliptique pour les lots territoriaux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Le long de
  rationale: Dans la succession des bandes territoriales, la préposition indique que la part suivante longe la frontière de la tribu précédente. En français, « le long de » rend naturellement ce rapport spatial; la coordination hébraïque n’a pas besoin d’être reproduite par « et » dans cette énumération.
- source_word: גְּבוּל
  choice: frontière
  rationale: Dans ce contexte de partage territorial, le terme désigne la limite entre deux territoires tribaux. « Frontière » est clair et idiomatique en français.
- source_word: נַפְתָּלִי
  choice: Nephtali
  rationale: Forme française traditionnelle et courante du nom de la tribu.
- source_word: מִפְּאַת קָדִימָה עַד פְּאַת יָמָּה
  choice: depuis le côté est jusqu’au côté ouest
  rationale: Cette formule répétée indique toute l’étendue d’est en ouest. « Côté » conserve le sens concret de פֵּאָה, tandis que « est » et « ouest » rendent ici les orientations géographiques visées.
- source_word: מְנַשֶּׁה
  choice: Manassé
  rationale: Forme française usuelle du nom de la tribu.
- source_word: אֶחָד
  choice: une part
  rationale: L’hébreu porte littéralement « un », mais la formule elliptique récurrente du chapitre sous-entend une part territoriale. « Une part » restitue cette ellipse en français sans préciser davantage la nature du lot.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. Les deux-points préservent le caractère nominal et elliptique de la formule d’attribution, sans ajouter de verbe absent de l’hébreu.
