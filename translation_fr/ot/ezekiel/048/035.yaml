id: EZK.48.35
reference: Ezekiel 48:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: סָבִ֕יב שְׁמֹנָ֥ה עָשָׂ֖ר אָ֑לֶף וְ/שֵׁם הָ/עִ֥יר מִ/יּ֖וֹם יְהוָ֥ה שָֽׁמָּ/ה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/035.yaml
  text: All around shall be eighteen thousand[a], and the name of the city from that day on shall be, Yahweh Is There.
translation:
  language: fr
  text: 'Le pourtour sera de dix-huit mille[a]. Dès ce jour, le nom de la ville sera : « Yahvé est là »[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu ne répète pas ici l’unité de mesure, comprise d’après le contexte.
    reason: clarification
  - marker: b
    text: 'En hébreu : YHWH shammah, c’est-à-dire « Yahvé est là ».'
    reason: source_language
lexical_decisions:
- source_word: סָבִיב
  choice: Le pourtour
  rationale: Dans cette conclusion aux mesures de la ville, le terme spatial résume la mesure totale de son enceinte. « Le pourtour » est naturel en français et restitue clairement cette valeur topographique.
- source_word: שְׁמֹנָה עָשָׂר אָלֶף
  choice: dix-huit mille
  rationale: L’hébreu indique le nombre sans répéter l’unité de mesure. La traduction conserve cette concision plutôt que d’ajouter « coudées » dans le texte.
- source_word: וְשֵׁם הָעִיר
  choice: le nom de la ville sera
  rationale: Cette formulation française naturelle conserve la solennité de la formule par laquelle la ville reçoit son nom.
- source_word: מִיּוֹם
  choice: Dès ce jour
  rationale: La préposition מִן marque ici le point de départ à partir duquel ce nom s’appliquera. « Dès ce jour » exprime cette valeur de façon concise et idiomatique.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin YHWH et préserve ici le nom propre plutôt que de le remplacer par le titre « le Seigneur ».
- source_word: שָׁמָּה
  choice: est là
  rationale: 'Dans le nom symbolique de la ville, l’adverbe a une fonction prédicative : YHWH est présent en ce lieu. La proposition « Yahvé est là » conserve directement cette affirmation.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה dans le nom symbolique de la ville
  choice: Yahvé est là
  alternative: Le Seigneur est là
  rationale: Le texte emploie directement le tétragramme. Garder le nom propre « Yahvé » préserve la portée de la déclaration et évite de le remplacer par un titre.
- issue: Nature de l’expression finale
  choice: La présenter comme le nom attribué à la ville
  alternative: 'La lire seulement comme une affirmation descriptive : « Yahvé est là »'
  rationale: La syntaxe dit explicitement que tel sera « le nom de la ville ». Les guillemets signalent donc un nom symbolique sans effacer le sens affirmatif de l’expression.
translation_notes:
  register: Français international moderne, clair et digne. La tournure conserve la brièveté de l’hébreu, tandis que les deux notes rendent explicites l’unité sous-entendue et la forme hébraïque du nom symbolique.
