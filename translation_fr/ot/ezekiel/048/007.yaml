base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/007.yaml
  text: And along the border of Reuben[a], from the eastern side to the western side, Judah[c][b], one portion.
translation:
  language: fr
  text: 'Le long de la frontière de Ruben, du côté est jusqu’au côté ouest : Juda, une part.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Juda, un ». Le nom « part » est sous-entendu par la formule de répartition des terres employée dans ce chapitre.'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque traduite par « côté ouest » signifie littéralement « côté de la mer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל גְּבוּל
  choice: Le long de la frontière
  rationale: Dans la succession des attributions territoriales, la formule situe la part suivante par rapport à la limite de la tribu précédente. « Le long de » est naturel en français et « frontière » convient à la délimitation entre territoires tribaux.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Forme française traditionnelle et courante du nom de la tribu.
- source_word: מִפְּאַת קָדִים
  choice: du côté est
  rationale: פֵּאָה désigne ici un côté ou une extrémité, et קָדִים fournit l’orientation vers l’est.
- source_word: עַד פְּאַת יָמָּה
  choice: au côté ouest
  rationale: Dans cette formule géographique, יָם, littéralement « mer », fonctionne comme terme d’orientation désignant l’ouest.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle et courante du nom de la tribu.
- source_word: אֶחָד
  choice: une part
  rationale: L’hébreu porte seulement « un/une »; « part » est sous-entendu par la formule répétée de répartition du territoire dans ce chapitre et doit être explicité pour obtenir un français intelligible.
