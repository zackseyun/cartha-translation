  text: כָּל הַ/תְּרוּמָ֗ה חֲמִשָּׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף בַּ/חֲמִשָּׁ֥ה וְ/עֶשְׂרִ֖ים אָ֑לֶף רְבִיעִ֗ית תָּרִ֨ימוּ֙ אֶת תְּרוּמַ֣ת הַ/קֹּ֔דֶשׁ אֶל אֲחֻזַּ֖ת הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/020.yaml
  text: The whole contribution shall be twenty-five thousand by twenty-five thousand[a]; you shall set apart the holy contribution as a quarter of the city's property.
translation:
  language: fr
  text: 'La totalité de la portion réservée fera vingt-cinq mille sur vingt-cinq mille[a], en carré[b] : vous réserverez la portion sainte avec le domaine de la ville.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vingt-cinq mille coudées sur vingt-cinq mille coudées », si l’on explicite l’unité suggérée par le contexte.'
    reason: lexical_alternative
  - marker: b
    text: 'Le terme hébreu est difficile et peut aussi être compris au sens de « quart ». On pourrait alors traduire : « vous réserverez la portion sainte comme un quart du domaine de la ville ».'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַתְּרוּמָה
  choice: la totalité de la part réservée
  rationale: Dans ce contexte de partage territorial, תְּרוּמָה désigne une portion prélevée et affectée à un usage particulier, non un sacrifice offert sur l’autel. « Part réservée » exprime clairement cette fonction foncière.
- source_word: חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף בַּחֲמִשָּׁה וְעֶשְׂרִים אָלֶף
  choice: vingt-cinq mille sur vingt-cinq mille
  rationale: L’hébreu indique les deux dimensions sans nommer ici l’unité. La formulation française conserve cette absence tout en exprimant naturellement des mesures.
- source_word: רְבִיעִית
  choice: formera un carré
  rationale: Dans la description, la totalité de la portion mesure vingt-cinq mille dans chacune des deux dimensions. Le terme est donc compris comme indiquant une figure à quatre côtés égaux, lecture cohérente avec la géographie des versets environnants. La lecture fractionnelle « un quart » reste signalée en note en raison de la forme du mot.
- source_word: תָּרִימוּ
  choice: vous prélèverez
  rationale: Le hiphil de רום associé à תְּרוּמָה exprime ici l’action de retirer et réserver une portion du territoire. « Prélever » convient au cadre administratif sans suggérer un soulèvement matériel.
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  choice: la part sainte
  rationale: L’expression désigne la portion réservée au domaine sacré. « Sainte » conserve le vocabulaire biblique usuel, tandis que « part » convient au partage foncier.
- source_word: אֶל אֲחֻזַּת הָעִיר
  choice: avec le domaine de la ville
  rationale: אֶל marque ici la relation ou l’association entre la part sainte et la propriété affectée à la ville. « Avec » rend cette relation dans un français naturel; אֲחֻזָּה désigne un bien foncier ou domaine attribué.
theological_decisions:
- issue: Sens de רְבִיעִית et relation avec אֲחֻזַּת הָעִיר
  choice: La totalité de la part réservée forme un carré, comprenant la part sainte associée au domaine de la ville.
  alternative: La part sainte constitue un quart du domaine de la ville.
  rationale: Le contexte immédiat décrit un ensemble de vingt-cinq mille sur vingt-cinq mille, ce qui favorise nettement le sens géométrique « carré ». Les répartitions précédentes montrent en outre que la part sainte n’est pas simplement le quart du domaine urbain. L’ambiguïté lexicale est néanmoins conservée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire foncier (« part réservée », « domaine ») évite les connotations sacrificielles indues. La première phrase explicite naturellement la valeur géométrique de רְבִיעִית, tandis que les notes préservent l’unité implicite et l’ambiguïté lexicale.
