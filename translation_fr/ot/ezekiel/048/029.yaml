  text: זֹ֥את הָ/אָ֛רֶץ אֲשֶׁר תַּפִּ֥ילוּ מִֽ/נַּחֲלָ֖ה לְ/שִׁבְטֵ֣י יִשְׂרָאֵ֑ל וְ/אֵ֨לֶּה֙ מַחְלְקוֹתָ֔/ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/029.yaml
  text: This is the land that you shall assign as an inheritance to the tribes of Israel[a], and these are their portions, declares the Lord GOD.
translation:
  language: fr
  text: Voici le pays que vous attribuerez en héritage aux tribus d’Israël, et voici leurs parts, déclare le Seigneur Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת הָאָרֶץ
  choice: Voici le pays
  rationale: Le démonstratif introduit une récapitulation. « Voici le pays » est naturel en français et garde la valeur déictique de l’hébreu.
- source_word: אֲשֶׁר תַּפִּילוּ
  choice: que vous attribuerez
  rationale: Le hiphil de נפל, dans le contexte du partage territorial, désigne l’attribution de lots ou de parts; « attribuerez » exprime clairement ce sens sans reproduire littéralement l’image de « faire tomber ».
- source_word: מִנַּחֲלָה
  choice: en héritage
  rationale: נַחֲלָה désigne ici un bien territorial reçu en héritage; la tournure française « attribuer en héritage » rend naturellement la fonction de l’expression.
- source_word: לְשִׁבְטֵי יִשְׂרָאֵל
  choice: aux tribus d’Israël
  rationale: Le לְ marque les bénéficiaires de l’attribution.
- source_word: וְאֵלֶּה מַחְלְקוֹתָם
  choice: et telles seront leurs parts
  rationale: מַחְלְקוֹתָם désigne les parts territoriales résultant du partage. « Telles seront leurs parts » forme une conclusion idiomatique, tout en gardant la référence aux lots attribués.
- source_word: נְאֻם
  choice: déclare
  rationale: Rend la formule prophétique d’authentification divine dans un français actuel et digne.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: 'Rend les deux éléments du titre composé: אֲדֹנָי par « le Seigneur » et le nom divin יהוה par « Yahweh ».'
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte explicitement le tétragramme après אֲדֹנָי. « Le Seigneur Yahweh » distingue les deux termes et préserve le nom divin sans les fusionner.
translation_notes:
  register: Français international moderne, clair et solennel. Le futur convient à l’instruction visionnaire. Aucun marqueur de note n’est nécessaire, puisque « parts » transmet directement le sens contextuel de מַחְלְקוֹתָם.
