  text: וְ/אֵלֶּה֮ מִדּוֹתֶי/הָ֒ פְּאַ֣ת צָפ֗וֹן חֲמֵ֤שׁ מֵאוֹת֙ וְ/אַרְבַּ֣עַת אֲלָפִ֔ים וּ/פְאַת נֶ֕גֶב חֲמֵ֥שׁ חמש מֵא֖וֹת וְ/אַרְבַּ֣עַת אֲלָפִ֑ים וּ/מִ/פְּאַ֣ת קָדִ֗ים חֲמֵ֤שׁ מֵאוֹת֙ וְ/אַרְבַּ֣עַת אֲלָפִ֔ים וּ/פְאַת יָ֕מָּ/ה חֲמֵ֥שׁ מֵא֖וֹת וְ/אַרְבַּ֥עַת אֲלָפִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/016.yaml
  text: 'And these are its measurements: the north side[a], four thousand five hundred; and the south side, four thousand five hundred; and from the east side, four thousand five hundred; and the west side, four thousand five hundred.'
translation:
  language: fr
  text: 'Voici ses dimensions : le côté nord : quatre mille cinq cents[a] ; le côté sud : quatre mille cinq cents[b] ; du côté est : quatre mille cinq cents ; et le côté ouest : quatre mille cinq cents.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « cinq cents et quatre mille » ; l’ordre est inversé ici selon l’usage normal du français.
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu répète « cinq » avant « cents » pour le côté sud. La traduction rend le nombre comme pour les autres côtés.
    reason: textual_note
lexical_decisions:
- source_word: מִדּוֹתֶיהָ
  choice: ses dimensions
  rationale: Le terme désigne ici les mesures de la ville; « dimensions » est naturel en français dans ce contexte topographique.
- source_word: פְּאַת
  choice: côté
  rationale: Dans cette description des limites de la ville, le mot désigne chacun de ses côtés.
- source_word: נֶגֶב
  choice: sud
  rationale: Il s’agit ici du point cardinal, en parallèle avec le nord, l’est et l’ouest, et non de la région du Néguev.
- source_word: מִפְּאַת קָדִים
  choice: du côté est
  rationale: La tournure conserve discrètement la préposition מִן propre à ce membre de phrase tout en restant naturelle en français.
- source_word: יָמָּה
  choice: ouest
  rationale: Bien que la forme soit liée à la mer, son emploi directionnel signifie ici « ouest ».
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים
  choice: quatre mille cinq cents
  rationale: L’ordre des éléments est adapté à l’expression numérique normale en français, sans changer la valeur répétée pour chaque côté.
