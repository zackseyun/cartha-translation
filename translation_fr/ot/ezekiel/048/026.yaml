  text: וְ/עַ֣ל גְּב֣וּל יִשָׂשכָ֗ר מִ/פְּאַ֥ת קָדִ֛ימָ/ה עַד פְּאַת יָ֖מָּ/ה זְבוּלֻ֥ן אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/026.yaml
  text: And along the border of Issachar[a], from the east side to the west side, Zebulun[b], one portion.
translation:
  language: fr
  text: 'Le long de la frontière d’Issacar, du côté est jusqu’au côté ouest : une part[a] pour Zabulon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « Zabulon, un »; le mot « part » est sous-entendu d’après la formule d’attribution territoriale répétée dans le chapitre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל גְּבוּל
  choice: Le long de la frontière
  rationale: Dans la série des attributions territoriales, la préposition עַל situe la part suivante le long de la limite de la tribu précédente. Cette formulation est naturelle en français et conserve le rapport spatial.
- source_word: יִשָׂשכָר
  choice: Issacar
  rationale: Forme française traditionnelle et couramment reconnue du nom de la tribu.
- source_word: מִפְּאַת קָדִימָה עַד פְּאַת יָמָּה
  choice: du côté est jusqu’au côté ouest
  rationale: פֵּאָה désigne ici un côté ou une extrémité; יָם, littéralement « mer », sert dans cet idiome géographique à désigner l’ouest.
- source_word: זְבוּלֻן
  choice: Zabulon
  rationale: Forme française traditionnelle et couramment reconnue du nom de la tribu.
- source_word: אֶחָד
  choice: une part
  rationale: L’hébreu porte seulement « un/une »; « part » est sous-entendu par la formule répétée des attributions territoriales dans ce chapitre et doit être explicité pour obtenir une phrase française intelligible.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La structure géographique est conservée, tandis que l’ellipse hébraïque finale est explicitée avec une note. Le וְ initial n’est pas rendu par « et », car la juxtaposition dans la série des lots reste claire en français et « Le long de » assure une transition naturelle.
