  source_fidelity: 'Le sens général est fidèle : le terrain restant est situé par rapport à la part sacrée, avec dix mille à l’est et dix mille à l’ouest, et son produit est destiné aux travailleurs de la ville. Toutefois, « s’étendra sur dix mille vers l’est » rend moins clairement la double mesure/disposition exprimée par l’hébreu.'
