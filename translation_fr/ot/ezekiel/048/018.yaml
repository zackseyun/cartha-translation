  text: וְ/הַ/נּוֹתָ֨ר בָּ/אֹ֜רֶךְ לְ/עֻמַּ֣ת תְּרוּמַ֣ת הַ/קֹּ֗דֶשׁ עֲשֶׂ֨רֶת אֲלָפִ֤ים קָדִ֨ימָ/ה֙ וַ/עֲשֶׂ֤רֶת אֲלָפִים֙ יָ֔מָּ/ה וְ/הָיָ֕ה לְ/עֻמַּ֖ת תְּרוּמַ֣ת הַ/קֹּ֑דֶשׁ וְ/הָיְתָ֤ה תבואת/ה לְ/לֶ֔חֶם לְ/עֹבְדֵ֖י הָ/עִֽיר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/018.yaml
  text: And the remainder along the length[a], corresponding to the holy contribution, shall be ten thousand to the east and ten thousand to the west; it shall correspond to the holy contribution[b], and its produce shall be for food for the workers of the city.
translation:
  language: fr
  text: 'Le reste, dans le sens de la longueur, en face de la part sacrée : dix mille à l’est et dix mille à l’ouest[a]. Il sera en face de la part sacrée, et ses récoltes serviront de nourriture[b] aux travailleurs de la ville.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « vers la mer », expression qui désigne habituellement l’ouest.
    reason: lexical_alternative
  - marker: b
    text: Ou « de pain » ; ici, le pain représente probablement la nourriture en général.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: Ce qui restera
  rationale: Le terme désigne le terrain restant après les attributions précédentes ; cette tournure garde la valeur participiale et convient au contexte de partage foncier.
- source_word: בָּאֹרֶךְ
  choice: sur la longueur
  rationale: L’expression décrit la dimension longitudinale de la parcelle restante.
- source_word: לְעֻמַּת
  choice: en regard de
  rationale: La préposition exprime ici une correspondance spatiale ou un alignement avec la part sacrée, sans imposer une précision géométrique absente du texte.
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  choice: la part sacrée
  rationale: Dans Ézéchiel 45–48, תְּרוּמָה désigne une portion de territoire mise à part ; « part sacrée » rend clairement cette fonction foncière et cultuelle.
- source_word: עֲשֶׂרֶת אֲלָפִים קָדִימָה
  choice: dix mille vers l’est
  rationale: La mesure et son orientation orientale sont conservées sans ajouter explicitement l’unité, qui demeure implicite dans l’hébreu de ce verset.
- source_word: וַעֲשֶׂרֶת אֲלָפִים יָמָּה
  choice: et dix mille vers l’ouest
  rationale: יָמָּה signifie littéralement « vers la mer » et sert couramment à désigner l’ouest dans ce cadre géographique.
- source_word: וְהָיָה לְעֻמַּת תְּרוּמַת הַקֹּדֶשׁ
  choice: Il sera en regard de la part sacrée
  rationale: La répétition de la relation spatiale dans le texte hébreu est maintenue afin d’en préserver l’insistance structurelle.
- source_word: וְהָיְתָה תבואתה
  choice: et ses récoltes serviront
  rationale: תְּבוּאָה désigne le produit ou le rendement agricole du terrain ; « récoltes » est naturel et concret en français.
- source_word: לְלֶחֶם
  choice: de nourriture
  rationale: לֶחֶם signifie littéralement « pain », mais peut désigner plus largement les vivres ; le contexte évoque les produits agricoles destinés à l’entretien des travailleurs.
- source_word: לְעֹבְדֵי הָעִיר
  choice: aux travailleurs de la ville
  rationale: Le participe de עבד désigne ceux qui travaillent au service de la ville, sans exiger ici une fonction cultuelle particulière.
