revisions:
- from: Le reste appartiendra au prince, de part et d’autre de la contribution sainte et de la propriété de la ville. À l’est, il s’étendra le long des vingt-cinq mille[a] de la contribution jusqu’à la frontière orientale et, à l’ouest, le long des vingt-cinq mille jusqu’à la frontière occidentale. En parallèle avec les autres parts, ce territoire appartiendra au prince. La contribution sainte et le sanctuaire de la Maison seront au milieu de ce territoire.
  to: 'Le reste sera pour le prince, de part et d’autre de la contribution sainte et de la propriété de la ville : le long des vingt-cinq mille[a] de la contribution jusqu’à la frontière orientale et, à l’ouest, le long des vingt-cinq mille jusqu’à la frontière occidentale, en parallèle avec les parts : ce sera pour le prince. La contribution sainte et le sanctuaire du Temple seront en son milieu.'
  rationale: La révision retire l’ajout interprétatif « autres », conserve la relation spatiale rendue par « en parallèle avec », et remplace l’antécédent explicité de « au milieu » par « en son milieu » afin de ne pas résoudre indûment la référence du suffixe hébreu. Elle conserve la note et l’absence d’unité chiffrée dans le texte principal.
