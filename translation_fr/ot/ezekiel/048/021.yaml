  text: וְ/הַ/נּוֹתָ֣ר לַ/נָּשִׂ֣יא מִ/זֶּ֣ה וּ/מִ/זֶּ֣ה לִ/תְרֽוּמַת הַ/קֹּ֣דֶשׁ וְ/לַ/אֲחֻזַּ֪ת הָ/עִ֟יר אֶל פְּנֵ֣י חֲמִשָּׁה֩ וְ/עֶשְׂרִ֨ים אֶ֥לֶף תְּרוּמָה֮ עַד גְּב֣וּל קָדִימָ/ה֒ וְ/יָ֗מָּ/ה עַל פְּ֠נֵי חֲמִשָּׁ֨ה וְ/עֶשְׂרִ֥ים אֶ֨לֶף֙ עַל גְּב֣וּל יָ֔מָּ/ה לְ/עֻמַּ֥ת חֲלָקִ֖ים לַ/נָּשִׂ֑יא וְ/הָֽיְתָה֙ תְּרוּמַ֣ת הַ/קֹּ֔דֶשׁ וּ/מִקְדַּ֥שׁ הַ/בַּ֖יִת ב/תוכ/ה׀׀־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/021.yaml
  text: And what remains shall belong to the prince[a], on both sides of the holy contribution and of the city's property, alongside the twenty-five thousand of the contribution as far as the eastern border, and westward alongside the twenty-five thousand toward the western border, parallel to the portions for the prince. And the holy contribution and the sanctuary of the temple shall be in its midst.
translation:
  language: fr
  text: 'Le reste sera pour le prince, de part et d’autre de la contribution sainte et de la propriété de la ville : le long des vingt-cinq mille[a] de la contribution jusqu’à la frontière orientale et, à l’ouest, le long des vingt-cinq mille jusqu’à la frontière occidentale, en parallèle avec les parts : ce sera pour le prince. La contribution sainte et le sanctuaire du Temple seront en son milieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit simplement « vingt-cinq mille » ; l’unité de mesure est sous-entendue d’après le contexte des mesures territoriales dans Ézéchiel.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַנּוֹתָר לַנָּשִׂיא
  choice: Le reste appartiendra au prince
  rationale: Le participe substantivé désigne le territoire restant; le datif לַנָּשִׂיא indique qu’il est destiné au prince. « Appartiendra » explicite naturellement cette relation en français.
- source_word: מִזֶּה וּמִזֶּה
  choice: de part et d’autre
  rationale: Cette expression idiomatique situe le territoire du prince sur les deux côtés de la zone centrale.
- source_word: לִתְרוּמַת הַקֹּדֶשׁ
  choice: de la contribution sainte
  rationale: תְּרוּמָה désigne ici une portion de terre mise à part comme contribution; « contribution sainte » conserve à la fois la dimension territoriale et la nuance cultuelle.
- source_word: וְלַאֲחֻזַּת הָעִיר
  choice: et de la propriété de la ville
  rationale: אֲחֻזָּה désigne un bien foncier ou une possession; « propriété de la ville » est clair et actuel.
- source_word: אֶל־פְּנֵי / עַל־פְּנֵי
  choice: le long de
  rationale: Dans cette description géographique, les expressions marquent l’alignement ou la contiguïté avec la bande de vingt-cinq mille unités.
- source_word: חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: vingt-cinq mille
  rationale: Le texte hébreu ne répète pas ici l’unité de mesure; elle reste donc implicite dans le corps du texte et fait l’objet d’une note.
- source_word: לְעֻמַּת חֲלָקִים לַנָּשִׂיא
  choice: En parallèle avec les autres parts, ce territoire appartiendra au prince
  rationale: לְעֻמַּת exprime une correspondance ou un alignement spatial. La syntaxe rattache naturellement לַנָּשִׂיא à l’attribution du territoire au prince; « autres » clarifie que les חֲלָקִים sont les parts voisines sans préciser davantage leur bénéficiaire.
- source_word: וּמִקְדַּשׁ הַבַּיִת
  choice: et le sanctuaire de la Maison
  rationale: « Maison » conserve l’appellation biblique du temple, tandis que « sanctuaire » rend מִקְדָּשׁ.
- source_word: בְתוֹכָהּ
  choice: au milieu de ce territoire
  rationale: Le suffixe féminin peut renvoyer à la contribution sainte, mais le contexte spatial permet aussi de comprendre l’ensemble territorial décrit. La formulation française rend le référent explicite sans identifier le pronom à la ville ou au prince.
