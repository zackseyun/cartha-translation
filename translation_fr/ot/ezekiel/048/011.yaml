  text: לַ/כֹּהֲנִ֤ים הַֽ/מְקֻדָּשׁ֙ מִ/בְּנֵ֣י צָד֔וֹק אֲשֶׁ֥ר שָׁמְר֖וּ מִשְׁמַרְתִּ֑/י אֲשֶׁ֣ר לֹֽא תָע֗וּ בִּ/תְעוֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כַּ/אֲשֶׁ֥ר תָּע֖וּ הַ/לְוִיִּֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/011.yaml
  text: It shall be for the priests who are consecrated from the sons of Zadok[a], who kept my charge, who did not go astray when the sons of Israel went astray[c][b], as the Levites went astray.
translation:
  language: fr
  text: Elle sera destinée aux prêtres consacrés issus de la descendance de Tsadok[a], qui ont gardé ma charge[b]. Ils ne se sont pas égarés lorsque les Israélites se sont égarés[c], comme les lévites se sont égarés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « issus des fils de Tsadok ».'
    reason: lexical_alternative
  - marker: b
    text: « Garder ma charge » désigne l’accomplissement fidèle de la responsabilité confiée par Dieu, particulièrement dans le service sacerdotal.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַכֹּהֲנִים
  choice: aux prêtres
  rationale: Le préfixe ל indique ici le destinataire de la part attribuée dans le partage du territoire. « Aux prêtres » s’intègre naturellement à la proposition implicite « elle sera destinée ».
- source_word: הַמְקֻדָּשׁ
  choice: consacrés
  rationale: Le participe passif de קדשׁ exprime la mise à part cultuelle. « Consacrés » convient au contexte sacerdotal mieux que le terme plus général « saints ».
- source_word: מִבְּנֵי צָדוֹק
  choice: parmi les descendants de Tsadok
  rationale: Dans ce contexte généalogique, בנים désigne la lignée de Tsadok, et מן sélectionne les prêtres appartenant à cette lignée. Cette formulation est naturelle en français tout en conservant les deux éléments.
- source_word: שָׁמְרוּ מִשְׁמַרְתִּי
  choice: ont fidèlement rempli la charge que je leur avais confiée
  rationale: La tournure hébraïque évoque l’accomplissement loyal d’une responsabilité confiée par Dieu, notamment dans le service sacerdotal. « Fidèlement » explicite la valeur contextuelle de שׁמר sans transformer la charge en simple règlement.
- source_word: לֹא תָעוּ
  choice: ne se sont pas égarés
  rationale: Le verbe תעה décrit ici une déviation religieuse et morale, et non un déplacement physique. « S’égarer » préserve cette image et sa portée.
- source_word: בִּתְעוֹת בְּנֵי יִשְׂרָאֵל
  choice: lorsque les Israélites se sont égarés
  rationale: L’infinitif construit précédé de ב exprime la circonstance temporelle. « Les Israélites » rend idiomatiquement « les fils d’Israël » sans limiter l’expression aux hommes.
- source_word: כַּאֲשֶׁר תָּעוּ הַלְוִיִּם
  choice: comme les lévites l’ont fait
  rationale: כַּאֲשֶׁר introduit une comparaison. Le pronom « l’ » évite en français une répétition pesante tout en renvoyant clairement au fait de s’égarer.
theological_decisions:
- issue: Lignée sacerdotale et fidélité dans la vision du temple
  choice: Le texte présente ces bénéficiaires à la fois comme des prêtres de la lignée de Tsadok et comme ceux qui sont demeurés fidèles à la charge confiée par Dieu.
  alternative: Mettre surtout en avant la récompense de leur fidélité en atténuant la référence à leur lignée.
  rationale: L’hébreu mentionne explicitement tant l’appartenance aux descendants de Tsadok que leur fidélité cultuelle. La traduction conserve ces deux aspects sans tirer de conclusion doctrinale ultérieure sur le sacerdoce.
translation_notes:
  register: Français international moderne, digne et accessible. « Elle » reprend la part de territoire décrite dans le contexte. La seconde phrase allège une longue succession de propositions relatives sans modifier les rapports logiques du texte hébreu.
