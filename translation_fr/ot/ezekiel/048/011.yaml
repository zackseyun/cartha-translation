revisions:
- from: Elle sera destinée aux prêtres consacrés, parmi les descendants de Tsadok[a], qui ont fidèlement rempli la charge que je leur avais confiée[b]. Ils ne se sont pas égarés lorsque les Israélites se sont égarés[c], comme les lévites l’ont fait.
  to: Elle sera destinée aux prêtres consacrés issus de la descendance de Tsadok[a], qui ont gardé ma charge[b]. Ils ne se sont pas égarés lorsque les Israélites se sont égarés[c], comme les lévites se sont égarés.
  rationale: La révision clarifie l’appartenance généalogique des prêtres à la lignée de Tsadok, resserre le rendu de « ma charge » sur la formulation hébraïque et explicite le dernier verbe afin de préserver la comparaison avec les Lévites. Elle conserve l’ambiguïté et la structure temporelle de la proposition relative, sans ajouter d’interprétation doctrinale.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:01:19Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens central est bien rendu : l’attribution est destinée aux prêtres consacrés de la lignée de Tsadok, distingués par leur fidélité à la charge divine lors de l’égarement d’Israël et des Lévites. Toutefois, « parmi les descendants de Tsadok » est syntaxiquement moins précis ici : le מן hébreu rattache ces prêtres à cette descendance, plutôt qu’il ne les situe simplement à l’intérieur d’un groupe. « Issus de la descendance de Tsadok » rend plus clairement ce rapport. « Fidèlement » et « que je leur avais confiée » explicitent légitimement le contexte, mais excèdent légèrement la formulation concise de l’hébreu ; une formulation plus directe est préférable.'
  naturalness: Le français est globalement naturel et de registre approprié. « Prêtres consacrés issus de la descendance de Tsadok » est plus fluide et plus exact que « prêtres consacrés, parmi les descendants de Tsadok ». La reprise explicite de « se sont égarés » à la fin est préférable au pronom « l’ », qui peut momentanément renvoyer à l’égarement des Israélites plutôt qu’à celui des Lévites.
  terminology: « Prêtres », « consacrés », « Tsadok », « charge », « Israélites » et « lévites » sont appropriés. « Ont gardé ma charge » est une expression biblique française intelligible qui rend directement שָׁמְרוּ מִשְׁמַרְתִּי sans ajouter un degré explicite de fidélité ni reformuler le possessif divin comme une charge antérieurement confiée.
  issues:
  - severity: low
    issue: Rattachement de la descendance de Tsadok
    rationale: « Parmi les descendants de Tsadok » est possible, mais peut présenter les prêtres comme simplement localisés dans ce groupe. Le texte les décrit comme provenant de cette lignée.
  - severity: low
    issue: Explicitation interprétative dans la charge
    rationale: « Ont fidèlement rempli la charge que je leur avais confiée » communique le sens, mais ajoute « fidèlement » et transforme « ma charge » en périphrase. Une traduction plus directe préserve mieux la concision du texte.
  - severity: low
    issue: Antécédent potentiellement diffus de « l’ont fait »
    rationale: La répétition de « se sont égarés » rend explicite que les Lévites, et non seulement les Israélites, sont ceux auxquels la comparaison se rapporte.
  revised_text: Elle sera destinée aux prêtres consacrés issus de la descendance de Tsadok[a], qui ont gardé ma charge[b]. Ils ne se sont pas égarés lorsque les Israélites se sont égarés[c], comme les lévites se sont égarés.
  revised_footnotes:
  - marker: a
    text: 'Littéralement : « issus des fils de Tsadok ».'
    reason: lexical_alternative
  - marker: b
    text: « Garder ma charge » désigne l’accomplissement fidèle de la responsabilité confiée par Dieu, particulièrement dans le service sacerdotal.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
  revision_rationale: La révision clarifie l’appartenance généalogique des prêtres à la lignée de Tsadok, resserre le rendu de « ma charge » sur la formulation hébraïque et explicite le dernier verbe afin de préserver la comparaison avec les Lévites. Elle conserve l’ambiguïté et la structure temporelle de la proposition relative, sans ajouter d’interprétation doctrinale.
