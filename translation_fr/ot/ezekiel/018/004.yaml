source:
  edition: WLC
  text: הֵ֤ן כָּל הַ/נְּפָשׁוֹת֙ לִ֣/י הֵ֔נָּה כְּ/נֶ֧פֶשׁ הָ/אָ֛ב וּ/כְ/נֶ֥פֶשׁ הַ/בֵּ֖ן לִ/י הֵ֑נָּה הַ/נֶּ֥פֶשׁ הַ/חֹטֵ֖את הִ֥יא תָמֽוּת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/004.yaml
  text: Look[a], every life belongs to me. The life of the father is like the life of the son—both belong to me. The person who sins is the one who will die.
translation:
  language: fr
  text: Oui, toute vie m’appartient[a]. La vie du père comme celle du fils m’appartient. La personne qui pèche, c’est elle qui mourra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toutes les âmes sont à moi […] l’âme qui pèche, c’est elle qui mourra ». Le mot hébreu נֶפֶשׁ peut désigner l’âme, la vie, l’être ou la personne, selon le contexte.'
    reason: Signaler l’autre traduction traditionnelle possible et préserver l’étendue sémantique du terme hébreu.
lexical_decisions:
- source_word: הֵן
  choice: Oui
  rationale: La particule introduit et souligne une déclaration solennelle. « Oui » garde cette force affirmative dans un français actuel, sans l’archaïsme possible de « voici » dans ce contexte.
- source_word: כָּל הַנְּפָשׁוֹת
  choice: toute vie
  rationale: נֶפֶשׁ peut désigner l’âme, la vie, l’être ou la personne. Ici, « toute vie » exprime naturellement la portée distributive de כָּל et l’appartenance de chaque être humain à Dieu, sans imposer une anthropologie dualiste.
- source_word: לִי הֵנָּה
  choice: m’appartient
  rationale: L’hébreu dit littéralement « elles sont à moi ». Le singulier français s’accorde avec « toute vie » et rend clairement la possession divine.
- source_word: כְּנֶפֶשׁ הָאָב וּכְנֶפֶשׁ הַבֵּן
  choice: La vie du père comme celle du fils
  rationale: La construction כְּ...וּכְּ place le père et le fils sur un même plan devant Dieu. « Celle » évite une répétition pesante tout en maintenant la comparaison.
- source_word: הַנֶּפֶשׁ
  choice: La personne
  rationale: Dans la dernière proposition, נֶפֶשׁ désigne l’être humain qui agit et répond de son péché. « La personne » communique cette responsabilité individuelle plus clairement que « l’âme » ou « la vie » en français contemporain.
- source_word: הַחֹטֵאת
  choice: qui pèche
  rationale: Le participe désigne la personne qui commet le péché. La proposition relative conserve sa valeur verbale et évite de réduire l’individu à l’étiquette de « pécheur ».
- source_word: הִיא
  choice: c’est elle qui
  rationale: 'Le pronom féminin reprend grammaticalement נֶפֶשׁ. La tournure française détachée rend son insistance identificatrice : c’est bien la personne qui pèche qui subira la mort.'
- source_word: תָמוּת
  choice: mourra
  rationale: L’imparfait hébreu annonce ici la conséquence ou le jugement. Le futur simple est direct, naturel et n’ajoute pas une nuance de nécessité étrangère au texte.
theological_decisions:
- issue: Traduction de נֶפֶשׁ dans un passage souvent invoqué à propos de l’âme
  choice: Traduire selon le contexte par « vie » dans les affirmations d’appartenance, puis par « personne » dans l’affirmation de responsabilité.
  alternative: Employer « âme » dans tout le verset.
  rationale: Le verset affirme que chaque vie appartient à Dieu et que chacun répond de son propre péché. Le mot hébreu ne désigne pas nécessairement ici une composante immatérielle distincte du corps. La traduction contextuelle préserve l’enjeu théologique sans trancher une doctrine anthropologique que le verset ne formule pas techniquement.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise « c’est elle qui » conserve l’emphase hébraïque sans suggérer que le référent est nécessairement de sexe féminin ; « elle » reprend grammaticalement « la personne ».
