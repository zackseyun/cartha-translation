base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/032.yaml
  text: For I take no pleasure in the death of the one who dies[a], declares the Lord GOD[c][b]. Therefore turn back and live.
translation:
  language: fr
  text: Car je ne prends aucun plaisir à la mort de celui qui meurt[a], déclare le Seigneur Yahweh[b]. Revenez[c] donc et vivez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: "Ou « je ne désire pas la mort de celui qui est en train de mourir ».\0"
    reason: lexical_alternative
  - marker: b
    text: "Le titre hébreu est אֲדֹנָי יְהוִה (Adonaï Yahweh) ; on le traduit aussi traditionnellement par « le Seigneur DIEU ».\0"
    reason: alternative_reading
  - marker: c
    text: "Ou « Tournez-vous et vivez ».\0"
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde l’appel précédent et conserve naturellement la valeur explicative de la conjonction.
- source_word: לֹא אֶחְפֹּץ
  choice: je ne prends aucun plaisir
  rationale: חפץ exprime ici le plaisir ou le désir; cette tournure française convient à la construction avec ב et décrit la disposition divine sans l’aplatir en simple volonté.
- source_word: בְּמוֹת הַמֵּת
  choice: à la mort de celui qui meurt
  rationale: Rend l’expression de près tout en évitant «le mort», qui pourrait désigner uniquement quelqu’un déjà décédé. La formulation conserve la répétition et l’étrangeté significative de l’hébreu.
- source_word: נְאֻם
  choice: déclare
  rationale: Rend avec un registre prophétique digne et actuel la formule solennelle d’énoncé divin.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Traduit les deux éléments du titre et rend explicitement le nom divin יהוה, sans produire l’expression maladroite «le Seigneur SEIGNEUR».
- source_word: וְהָשִׁיבוּ
  choice: Revenez donc
  rationale: שוב appelle concrètement à revenir ou à faire demi-tour. «Revenez» n’importe pas à lui seul toute la terminologie doctrinale de la repentance, tandis que «donc» explicite le lien conséquentiel porté par le contexte et la coordination.
- source_word: וִחְיוּ
  choice: et vivez
  rationale: Conserve la forme impérative concise et la coordination de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le composé contient à la fois אֲדֹנָי et le tétragramme. Le choix retenu traduit le titre et préserve le nom personnel divin plutôt que de le remplacer par un titre.
- issue: Identification de הַמֵּת
  choice: celui qui meurt
  alternative: le méchant
  rationale: Le contexte concerne notamment le méchant, mais ce nom n’apparaît pas dans ce verset. La traduction conserve donc la formulation immédiate et sa portée théologique, sans résoudre l’expression par une précision contextuelle ajoutée.
- issue: Force de חפץ
  choice: ne prends aucun plaisir
  alternative: ne désire pas
  rationale: Les deux sens sont possibles, mais la construction avec ב se prête bien à l’idée de prendre plaisir à quelque chose. Ce choix affirme la disposition divine envers la mort sans reformuler le verset comme une proposition exhaustive sur la volonté divine.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde le parallélisme incisif de l’appel prophétique ainsi que la répétition «mort… meurt», laquelle reflète l’hébreu au lieu d’être remplacée par une interprétation contextuelle.
