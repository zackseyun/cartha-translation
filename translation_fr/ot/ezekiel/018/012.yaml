id: EZK.18.12
reference: Ezekiel 18:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עָנִ֤י וְ/אֶבְיוֹן֙ הוֹנָ֔ה גְּזֵל֣וֹת גָּזָ֔ל חֲבֹ֖ל לֹ֣א יָשִׁ֑יב וְ/אֶל הַ/גִּלּוּלִים֙ נָשָׂ֣א עֵינָ֔י/ו תּוֹעֵבָ֖ה עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/012.yaml
  text: He has oppressed the poor and needy[a], committed robbery, not returned a pledge, lifted up his eyes to the idols, and done an abomination.
translation:
  language: fr
  text: Il opprime le pauvre et l’indigent, commet des vols, ne rend pas ce qu’il a pris en gage, lève les yeux vers les idoles[a] et commet une abomination.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traduit par « idoles » est fortement méprisant et peut évoquer des « idoles répugnantes » ou « immondes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנִי וְאֶבְיוֹן
  choice: le pauvre et l’indigent
  rationale: Le couple désigne les personnes socialement vulnérables. Cette formulation reste proche de l’hébreu tout en étant claire et digne en français moderne.
- source_word: הוֹנָה
  choice: opprime
  rationale: Le verbe exprime ici la maltraitance ou l’exploitation d’une personne vulnérable, et non un simple tort générique.
- source_word: גְּזֵלוֹת גָּזָל
  choice: commet des vols
  rationale: La construction associant un nom et un verbe de même racine souligne des actes de spoliation. Le pluriel « des vols » restitue la valeur du nom pluriel sans lourdeur.
- source_word: חֲבֹל לֹא יָשִׁיב
  choice: ne rend pas ce qu’il a pris en gage
  rationale: Cette formulation explicite naturellement en français que l’objet retenu comme garantie d’une dette n’a pas été restitué.
- source_word: וְאֶל־הַגִּלּוּלִים נָשָׂא עֵינָיו
  choice: lève les yeux vers les idoles
  rationale: La traduction conserve l’image hébraïque, laquelle peut impliquer que l’on tourne son attention ou sa dévotion vers les idoles, sans la réduire explicitement à « adore ».
- source_word: הַגִּלּוּלִים
  choice: les idoles
  rationale: « Idoles » est immédiatement compréhensible dans le texte principal; la nuance fortement méprisante du terme propre à Ézéchiel est signalée en note.
- source_word: תּוֹעֵבָה עָשָׂה
  choice: commet une abomination
  rationale: Cette expression française naturelle conserve le poids moral et cultuel de תּוֹעֵבָה ainsi que le registre solennel du passage.
theological_decisions:
- issue: Portée de l’expression liée aux idoles
  choice: lève les yeux vers les idoles
  alternative: adore les idoles
  rationale: Le contexte indique une conduite idolâtre, mais l’hébreu emploie l’image de lever les yeux. La conserver évite de résoudre plus précisément que le texte la nature du regard ou de la dévotion.
- issue: Force morale de תּוֹעֵבָה
  choice: commet une abomination
  alternative: fait ce qui est détestable
  rationale: « Abomination » préserve la force théologique et cultuelle du terme sans limiter son sens à une simple désapprobation morale.
translation_notes:
  register: Français international moderne, clair et solennel. Le présent poursuit naturellement la description du personnage dans le contexte. Les parallélismes de la liste sont conservés sans calquer lourdement la syntaxe hébraïque.
