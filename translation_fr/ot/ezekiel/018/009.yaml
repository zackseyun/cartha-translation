  text: בְּ/חֻקּוֹתַ֧/י יְהַלֵּ֛ךְ וּ/מִשְׁפָּטַ֥/י שָׁמַ֖ר לַ/עֲשׂ֣וֹת אֱמֶ֑ת צַדִּ֥יק הוּא֙ חָיֹ֣ה יִֽחְיֶ֔ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/009.yaml
  text: He walks in my statutes and keeps my judgments[a], acting faithfully; he is righteous; he shall surely live, declares the Lord GOD.
translation:
  language: fr
  text: Il suit mes prescriptions et observe mes décisions en agissant avec fidélité[a]. Cet homme est juste ; il vivra assurément — déclaration du Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour faire la vérité », c’est-à-dire agir avec vérité ou fidélité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחֻקּוֹתַי יְהַלֵּךְ
  choice: Il suit mes prescriptions
  rationale: Le verbe « suivre » rend naturellement en français la métaphore hébraïque de la marche comme conduite de vie. « Prescriptions » exprime le caractère normatif de חֻקּוֹת sans archaïsme excessif.
- source_word: וּמִשְׁפָּטַי שָׁמַר
  choice: et observe mes règles
  rationale: Dans ce contexte juridique, שׁמר signifie « observer », et מִשְׁפָּטִים désigne les règles ou décisions normatives de Dieu. Cette formulation est claire et distingue le terme de « prescriptions ».
- source_word: לַעֲשׂוֹת אֱמֶת
  choice: en agissant avec fidélité
  rationale: Littéralement « faire la vérité ». Ici, אֱמֶת évoque une conduite fiable, loyale et conforme à la vérité ; « agir avec fidélité » en exprime le sens éthique tout en signalant en note la formulation littérale.
- source_word: צַדִּיק הוּא
  choice: Celui-là est juste
  rationale: « Juste » rend le terme éthique et juridique צַדִּיק. « Celui-là » reprend avec une légère emphase la construction hébraïque « juste, il l’est ».
- source_word: חָיֹה יִחְיֶה
  choice: il vivra, oui, il vivra
  rationale: La reprise verbale française restitue l’intensification produite par l’infinitif absolu suivi de l’imparfait, sans préciser au-delà du contexte la nature de cette vie.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: « Déclaration » conserve la forme nominale solennelle de נְאֻם. « Seigneur Yahweh » distingue אֲדֹנָי du nom divin יְהוִה et préserve ce dernier comme nom propre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte à la fois le titre אֲדֹנָי et le nom divin יְהוִה. Les rendre distinctement évite d’effacer le nom propre de l’hébreu.
- issue: Portée de la promesse חָיֹה יִחְיֶה
  choice: il vivra, oui, il vivra
  alternative: il vivra certainement
  rationale: La répétition rend l’affirmation emphatique de l’hébreu sans décider si la vie visée doit être comprise uniquement comme survie terrestre ou dans un sens théologique plus large.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure proche de l’hébreu sans être artificielle ; l’emphase finale est conservée par la répétition verbale.
