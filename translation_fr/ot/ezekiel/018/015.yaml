id: EZK.18.15
reference: Ezekiel 18:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַל הֶֽ/הָרִים֙ לֹ֣א אָכָ֔ל וְ/עֵינָי/ו֙ לֹ֣א נָשָׂ֔א אֶל גִּלּוּלֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל אֶת אֵ֥שֶׁת רֵעֵ֖/הוּ לֹ֥א טִמֵּֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/015.yaml
  text: He has not eaten on the mountains[a], nor lifted up his eyes to the idols of the house of Israel[b]; he has not defiled his neighbor’s wife.
translation:
  language: fr
  text: Il n’a pas mangé sur les montagnes[a] ni levé les yeux vers les idoles de la maison d’Israël[b] ; il n’a pas souillé la femme de son prochain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement : « n’a pas mangé dans les sanctuaires des montagnes », c’est-à-dire qu’il n’a pas participé au culte idolâtre pratiqué sur les hauts lieux.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « idoles » est méprisant et peut aussi se rendre par « idoles immondes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הֶהָרִים ... אָכָל
  choice: n’a pas mangé sur les montagnes
  rationale: Cette expression désigne ici la participation à des repas cultuels liés aux hauts lieux idolâtres. La formulation conserve l’image hébraïque, tandis que la note en explicite le contexte.
- source_word: וְעֵינָיו לֹא נָשָׂא
  choice: ni levé les yeux vers
  rationale: L’expression française reste naturelle et conserve l’idiome hébreu, qui peut évoquer le fait de diriger son attention ou sa dévotion vers quelque chose.
- source_word: גִּלּוּלֵי בֵּית יִשְׂרָאֵל
  choice: les idoles de la maison d’Israël
  rationale: « Idoles » est clair dans le texte principal. Le caractère fortement méprisant du terme hébreu est signalé en note sans surcharger la traduction.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Cette formulation préserve la désignation collective et l’expression caractéristique du livre d’Ézéchiel.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: la femme de son prochain
  rationale: « Prochain » rend naturellement רֵעַ dans ce contexte éthique et conserve l’écho au langage biblique français courant.
- source_word: לֹא טִמֵּא
  choice: il n’a pas souillé
  rationale: « Souillé » exprime ici la portée morale et cultuelle de טמא sans ajouter l’idée de contrainte que pourrait suggérer « violé ».
theological_decisions:
- issue: Portée cultuelle de l’action de manger sur les montagnes
  choice: Conserver dans le texte l’image « mangé sur les montagnes », comprise comme une participation au culte idolâtre des hauts lieux.
  alternative: 'Expliciter directement : « mangé dans les sanctuaires des montagnes » ou « pris part aux repas cultuels sur les hauts lieux ».'
  rationale: Le contexte associe cette expression aux idoles, mais une traduction formellement proche préserve l’image et la tension du texte ; la note fournit l’explication nécessaire.
- issue: Portée morale du vocabulaire de souillure sexuelle
  choice: « il n’a pas souillé la femme de son prochain »
  alternative: « il n’a pas déshonoré la femme de son prochain » ou « il n’a pas violé la femme de son prochain »
  rationale: Le verbe hébreu présente l’adultère sous la catégorie de la souillure. « Violé » risquerait d’introduire explicitement la coercition, qui n’est pas affirmée par ce terme dans ce contexte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe parallèle de l’hébreu est conservée, avec un point-virgule pour rendre clairement les trois actes évoqués. Les expressions bibliques « maison d’Israël » et « son prochain » sont maintenues parce qu’elles restent intelligibles et portent la texture d’Ézéchiel.
