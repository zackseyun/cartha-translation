base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/014.yaml
  text: But behold[a], he fathers a son, and he sees all the sins that his father has done; he sees them[b], and he does not do likewise.
translation:
  language: fr
  text: 'Mais voici : il engendre un fils. Celui-ci voit tous les péchés que son père a commis ; il les voit[a], mais n’agit pas de la même manière.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu répète « il voit » pour insister : « il voit… il les voit, mais n’agit pas de la même manière ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Mais voici
  rationale: Introduit avec vivacité un nouveau cas qui contraste avec le précédent ; « voici » convient au registre biblique tout en restant compréhensible en français moderne.
- source_word: הוֹלִיד בֵּן
  choice: cet homme a un fils
  rationale: Le hiphil de ילד exprime littéralement le fait d’engendrer. Dans ce contexte généalogique, « a un fils » rend naturellement en français l’arrivée d’un fils engendré par l’homme, sans l’idée éducative que pourrait suggérer « devient père ».
- source_word: וַיַּרְא ... וַיִּרְאֶה
  choice: Celui-ci voit ... il les voit
  rationale: Le présent convient à l’exemple hypothétique développé dans le chapitre. La répétition de ראה est conservée, comme dans l’hébreu, afin de maintenir son effet d’insistance.
- source_word: כָּל חַטֹּאת אָבִיו אֲשֶׁר עָשָׂה
  choice: tous les péchés que son père a commis
  rationale: Le nom est pluriel par le sens et renvoie aux actes mauvais du père ; « commettre des péchés » est une collocation française naturelle et précise.
- source_word: וְלֹא יַעֲשֶׂה כָּהֵן
  choice: mais n’agit pas de la même manière
  rationale: כָּהֵן signifie « ainsi, de cette manière ». Cette formulation renvoie clairement à la conduite pécheresse du père sans ajouter de contenu.
theological_decisions:
- issue: Responsabilité morale individuelle dans le cas présenté
  choice: Le fils constate les péchés de son père, mais ne reproduit pas sa conduite.
  alternative: Le fils porterait néanmoins la culpabilité héritée de son père.
  rationale: La proposition finale oppose explicitement l’observation des actes du père à leur imitation. La traduction conserve cette opposition sans développer au-delà du verset la doctrine de la responsabilité individuelle.
- issue: Portée de la répétition du verbe « voir »
  choice: Conserver les deux occurrences sans traduire la seconde par un verbe interprétatif.
  alternative: Rendre la seconde occurrence par « réfléchit » ou « en prend conscience ».
  rationale: L’hébreu répète ראה. Traduire les deux occurrences par « voir » préserve l’insistance et évite d’imposer une nuance psychologique ou morale qui n’est pas lexicalement explicite.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation sépare nettement le nouveau cas de l’action du fils. « Voici » garde la vivacité de הִנֵּה ; la répétition inhabituelle de « voit » est volontairement maintenue et expliquée en note.
