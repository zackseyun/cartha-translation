source:
  edition: WLC
  text: אָבִ֞י/ו כִּֽי עָ֣שַׁק עֹ֗שֶׁק גָּזַל֙ גֵּ֣זֶל אָ֔ח וַ/אֲשֶׁ֥ר לֹא ט֛וֹב עָשָׂ֖ה בְּ/ת֣וֹךְ עַמָּ֑י/ו וְ/הִנֵּה מֵ֖ת בַּ/עֲוֺנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/018.yaml
  text: As for his father[a], because he practiced extortion, robbed his brother, and did what was not good among his people, behold[d][c][b], he shall die in his iniquity.
translation:
  language: fr
  text: Quant à son père, puisqu’il s’est livré à l’oppression[a], qu’il a dépouillé un frère[b] et qu’il a fait ce qui n’est pas bien au milieu de son peuple, eh bien[c], il mourra[d] dans son iniquité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu associe un verbe et un nom de même racine pour renforcer l’idée. Autre traduction possible : « a commis des actes d’extorsion ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « son frère ». « Frère » peut désigner de manière générale un autre membre de la communauté.
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu emploie un marqueur emphatique qui attire l’attention sur l’issue annoncée; on pourrait aussi traduire : « voici » ou « voyez ».'
    reason: lexical_alternative
  - marker: d
    text: Ou « il meurt » ou « il est mort ». Le parfait hébreu présente l’issue comme certaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבִיו
  choice: Quant à son père
  rationale: La tournure reprend le père en contraste avec le fils juste mentionné dans le contexte, tout en gardant explicite le lien familial.
- source_word: כִּי
  choice: parce que
  rationale: Introduit clairement la cause du sort réservé au père.
- source_word: עָשַׁק עֹשֶׁק
  choice: s’est livré à l’oppression
  rationale: La construction associant un verbe et un nom de même racine renforce l’idée d’une oppression effectivement pratiquée. Cette formulation reste naturelle en français et conserve le champ plus large de l’oppression.
- source_word: גָּזַל גֵּזֶל אָח
  choice: a dépouillé son frère
  rationale: « Dépouiller » exprime une spoliation violente ou injuste et rend avec force la construction intensive hébraïque. « Son frère » demeure proche du texte tout en pouvant désigner un membre de la communauté.
- source_word: וַאֲשֶׁר לֹא טוֹב עָשָׂה
  choice: et qu’il a fait ce qui n’est pas bien
  rationale: Conserve la litote hébraïque sans la transformer en une affirmation plus forte telle que « il a fait le mal ».
- source_word: בְּתוֹךְ עַמָּיו
  choice: au milieu de son peuple
  rationale: Rend la situation sociale du péché dans la communauté et garde l’image spatiale de l’hébreu dans un français naturel.
- source_word: וְהִנֵּה
  choice: le voici
  rationale: Marque l’insistance prophétique et attire l’attention sur l’issue certaine annoncée.
- source_word: מֵת
  choice: il mourra
  rationale: Le parfait hébreu présente ici l’issue comme certaine; le futur français convient à cette déclaration judiciaire et prophétique.
- source_word: בַּעֲוֹנוֹ
  choice: dans sa faute
  rationale: « Faute » exprime ici la culpabilité morale personnelle. La préposition « dans » préserve l’ambiguïté de l’hébreu entre la faute comme état ou charge et la faute comme cause de la mort.
theological_decisions:
- issue: Responsabilité individuelle dans Ézéchiel 18
  choice: Le père meurt dans sa propre faute, comme l’indiquent les suffixes personnels et la structure causale.
  alternative: Comprendre l’expression comme une déclaration plus générale de mort dans la culpabilité, sans accent particulier sur la responsabilité individuelle.
  rationale: Le contexte immédiat oppose le comportement du père à celui de son fils. La traduction conserve cette responsabilité personnelle sans ajouter de formulation doctrinale absente du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe causale est explicite; la litote « ce qui n’est pas bien » et l’ambiguïté de « dans sa faute » sont conservées. Les marqueurs de notes [a] à [d] figurent tous dans le texte principal.
