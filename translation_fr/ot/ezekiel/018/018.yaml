    issue: Possessif ajouté dans « son frère »
    rationale: Le texte hébreu porte אָח sans suffixe. Dans ce contexte, « frère » peut être générique; « un frère » préserve cette indétermination sans modifier le sens.
  - severity: medium
    issue: « Le voici » ne rend pas naturellement וְהִנֵּה dans cette syntaxe
    rationale: Cette expression française est référentielle et peut se comprendre comme la présentation du père. וְהִנֵּה est ici un marqueur emphatique introduisant l’issue; « Eh bien » remplit plus naturellement cette fonction.
  - severity: medium
    issue: « Faute » est trop faible pour עָוֹן
    rationale: « Faute » peut évoquer une erreur ou un manquement mineur. « Iniquité » maintient la gravité morale et la résonance terminologique du chapitre.
