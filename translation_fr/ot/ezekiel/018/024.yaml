  text: וּ/בְ/שׁ֨וּב צַדִּ֤יק מִ/צִּדְקָת/וֹ֙ וְ/עָ֣שָׂה עָ֔וֶל כְּ/כֹ֨ל הַ/תּוֹעֵב֜וֹת אֲשֶׁר עָשָׂ֧ה הָ/רָשָׁ֛ע יַעֲשֶׂ֖ה וָ/חָ֑י כָּל צדקת/ו אֲשֶׁר עָשָׂה֙ לֹ֣א תִזָּכַ֔רְנָה בְּ/מַעֲל֧/וֹ אֲשֶׁר מָעַ֛ל וּ/בְ/חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א בָּ֥/ם יָמֽוּת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/024.yaml
  text: But when a righteous man turns away from his righteousness and does injustice[a], doing all the abominations that the wicked man does, shall he live? None of the righteous deeds that he has done will be remembered. In the treachery by which he has acted treacherously[c][b], and in the sin that he has committed—in them he shall die.
translation:
  language: fr
  text: Mais lorsqu’un juste se détourne de sa justice, commet l’injustice et commet toutes les abominations[a] que commet le méchant, vivra-t-il ? Aucun de ses actes justes ne sera rappelé. À cause de l’infidélité dont il s’est rendu coupable[b] et du péché qu’il a commis, il mourra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toutes les choses abominables ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu évoque une infidélité, une trahison ou une faute constituant une rupture de confiance ; le texte emploie un nom et un verbe de la même racine.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « en elles il mourra », c’est-à-dire dans l’infidélité et le péché qui viennent d’être mentionnés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְשׁוּב
  choice: Mais si … se détourne
  rationale: La construction introduit ici l’éventualité opposée au verset précédent. Avec מִן, שׁוּב indique l’abandon d’un état antérieur.
- source_word: צַדִּיק מִצִּדְקָתוֹ
  choice: un juste … de sa justice
  rationale: Cette formulation conserve le lien lexical entre la personne juste et sa justice, ainsi que la portée générique du masculin singulier hébreu.
- source_word: וְעָשָׂה עָוֶל
  choice: commet l’injustice
  rationale: עָוֶל désigne ce qui est injuste ou mauvais. « Commettre l’injustice » est actuel, naturel et suffisamment fort.
- source_word: כְּכֹל הַתּוֹעֵבוֹת
  choice: toutes les pratiques abominables
  rationale: Le substantif pluriel désigne des actes fortement réprouvés. « Pratiques abominables » restitue cette force sans employer le peu naturel « abominations » pour des actes.
- source_word: הָרָשָׁע
  choice: le méchant
  rationale: L’adjectif substantivé forme le contraste direct avec « un juste » et représente une catégorie morale.
- source_word: יַעֲשֶׂה וָחָי
  choice: se livre … vivra-t-il ?
  rationale: Le premier verbe se rattache aux pratiques du méchant, puis vient la question rhétorique sur la vie. La formulation française préserve cet enchaînement.
- source_word: כָּל צדקתו אֲשֶׁר עָשָׂה לֹא תִזָּכַרְנָה
  choice: Aucun des actes justes qu’il a accomplis ne sera retenu
  rationale: 'Sous la négation, כָּל a une portée distributive : aucun acte juste antérieur ne sera rappelé ou pris en compte. « Retenu » convient au contexte judiciaire tout en restant proche de l’idée de mémoire.'
- source_word: בְּמַעֲלוֹ אֲשֶׁר מָעַל
  choice: À cause de l’infidélité dont il s’est rendu coupable
  rationale: La famille מעל exprime une rupture de fidélité. Le français évite une répétition artificielle tout en conservant la responsabilité personnelle et la nuance de trahison.
- source_word: וּבְחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: et du péché qu’il a commis
  rationale: Cette tournure idiomatique rend la construction apparentée nom-verbe sans la répétition peu naturelle « le péché qu’il a péché ».
- source_word: בָּם יָמוּת
  choice: il mourra
  rationale: Le pronom pluriel renvoie à l’infidélité et au péché. Dans ce contexte, בְּ peut désigner la cause ou la sphère de la mort ; cette relation est rendue explicitement par « à cause de » en tête de la proposition.
theological_decisions:
- issue: Responsabilité présente du juste qui abandonne sa justice
  choice: Le texte affirme que ses actes justes antérieurs ne seront pas retenus et qu’il mourra à cause de son infidélité et de son péché.
  alternative: Interpréter le passage comme la perte d’un mérite accumulé, ou en atténuer la portée en simple conséquence sociale.
  rationale: Ézéchiel 18 énonce ici la responsabilité morale individuelle devant Dieu. La traduction maintient cette affirmation et sa tension sans l’intégrer de force à une doctrine ultérieure du mérite, de l’apostasie ou de la persévérance.
translation_notes:
  register: Français international moderne, digne et accessible. Le masculin singulier générique suit la forme représentative du texte hébreu. Les répétitions hébraïques sont rendues naturellement, tandis que les notes signalent les constructions et nuances importantes.
