  to: Mais lorsqu’un juste se détourne de sa justice, commet l’injustice et commet toutes les abominations[a] que commet le méchant, vivra-t-il ? Aucun de ses actes justes ne sera rappelé. À cause de l’infidélité dont il s’est rendu coupable[b] et du péché qu’il a commis, il mourra[c].
