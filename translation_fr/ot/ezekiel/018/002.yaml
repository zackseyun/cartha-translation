    rationale: Bien que le verbe hébreu puisse évoquer le fait de devenir terne ou émoussé, la formulation française évoque d’abord une abrasion matérielle. L’idiome « les dents en sont agacées » transmet l’image sensorielle proverbiale de façon plus idiomatique.
