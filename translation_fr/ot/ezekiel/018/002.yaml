source:
  edition: WLC
  text: מַה לָּ/כֶ֗ם אַתֶּם֙ מֹֽשְׁלִים֙ אֶת הַ/מָּשָׁ֣ל הַ/זֶּ֔ה עַל אַדְמַ֥ת יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר אָבוֹת֙ יֹ֣אכְלוּ בֹ֔סֶר וְ/שִׁנֵּ֥י הַ/בָּנִ֖ים תִּקְהֶֽינָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/002.yaml
  text: What do you mean, that you keep repeating this proverb in the land of Israel[a], saying, ‘The fathers eat sour grapes, and the children’s teeth are set on edge’?”
translation:
  language: fr
  text: '« Pourquoi continuez-vous à répéter ce proverbe dans le pays d’Israël : “Les pères mangent des raisins verts, et les dents des enfants en sont agacées[a]” ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, l’hébreu dit que les dents « deviennent ternes » ou « s’émoussent » sous l’effet des raisins non mûrs.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לָּכֶם
  choice: Pourquoi
  rationale: Dans cette tournure, l’expression introduit une réprimande. « Pourquoi » en rend naturellement la force interrogative et critique en français moderne.
- source_word: מֹשְׁלִים
  choice: continuez-vous à répéter
  rationale: 'Le participe décrit une pratique en cours ou habituelle : les destinataires emploient régulièrement ce proverbe. Cette formulation conserve cette valeur itérative.'
- source_word: הַמָּשָׁל הַזֶּה
  choice: ce proverbe
  rationale: מָשָׁל désigne ici une maxime proverbiale, et non une parabole narrative.
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: dans le pays d’Israël
  rationale: Même si אַדְמָה signifie littéralement « sol, terre », l’expression désigne ici le territoire d’Israël. « Dans le pays d’Israël » est clair et idiomatique.
- source_word: אָבוֹת
  choice: les pères
  rationale: Le terme hébreu est explicitement masculin et désigne les pères des générations précédentes.
- source_word: יֹאכְלוּ בֹסֶר
  choice: mangent des raisins verts
  rationale: בֹסֶר désigne des raisins non mûrs, donc acides. « Raisins verts » est l’expression française naturelle, et le présent rend la portée générale du proverbe.
- source_word: שִׁנֵּי הַבָּנִים
  choice: les dents des enfants
  rationale: בָּנִים signifie formellement « fils », mais représente ici la descendance opposée aux pères. « Enfants » communique cette portée collective sans la limiter aux descendants masculins.
- source_word: תִּקְהֶינָה
  choice: s’émoussent
  rationale: 'Le verbe évoque l’effet désagréable produit sur les dents par un fruit acide : elles deviennent comme émoussées ou engourdies. Le choix conserve l’image concrète de l’hébreu.'
theological_decisions:
- issue: Termes de parenté genrés dans le proverbe
  choice: Conserver « pères », mais rendre בָּנִים par « enfants »
  alternative: « Les pères mangent des raisins verts, et les dents des fils s’émoussent. »
  rationale: « Pères » maintient le terme masculin précis du premier membre. Dans le second, « fils » peut désigner collectivement les descendants ; « enfants » exprime cette fonction représentative sans suggérer que seules les personnes de sexe masculin subissent les conséquences.
- issue: Rapport entre la conduite des pères et l’expérience des enfants
  choice: Préserver tel quel le contraste proverbial, sans l’expliquer dans le verset
  alternative: Paraphraser le proverbe comme une affirmation explicite de culpabilité héréditaire
  rationale: Le verset cite une maxime populaire que la suite du chapitre va contester. La traduction ne doit ni entériner ni réfuter à l’avance son implication théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation interrogative conserve le ton de réprimande, tandis que « continuez-vous à répéter » rend le caractère habituel de l’action. Le proverbe garde sa structure parallèle et son image sensorielle.
