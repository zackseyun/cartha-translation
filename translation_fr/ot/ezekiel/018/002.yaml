  rationale: La révision limite le changement à l’expression française de l’effet des raisins verts sur les dents. Elle conserve l’image et l’ambiguïté lexicale de l’hébreu dans la note, tout en employant dans le texte l’idiome français naturel correspondant au proverbe.
