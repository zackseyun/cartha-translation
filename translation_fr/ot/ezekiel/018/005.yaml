source:
  edition: WLC
  text: וְ/אִ֖ישׁ כִּי יִהְיֶ֣ה צַדִּ֑יק וְ/עָשָׂ֥ה מִשְׁפָּ֖ט וּ/צְדָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/005.yaml
  text: But if a man is righteous and does justice and righteousness,[a]
translation:
  language: fr
  text: Mais si un homme est juste et pratique le droit et la justice,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Or, si un homme » ou « Et si un homme » : la conjonction hébraïque peut marquer une simple continuation aussi bien qu’un contraste.'
    reason: alternative lexicale et discursive
lexical_decisions:
- source_word: וְ/אִישׁ
  choice: Mais si un homme
  rationale: אִישׁ désigne ici un homme au masculin singulier, présenté comme cas représentatif. Le וְ initial est rendu par « Mais » pour marquer le tournant conditionnel dans l’argument, sans exclure une simple continuation.
- source_word: כִּי
  choice: si
  rationale: Avec l’imparfait qui suit, כִּי introduit ici une condition générale.
- source_word: יִהְיֶה
  choice: est
  rationale: Le présent français exprime naturellement une condition générale; « sera » serait inutilement littéral.
- source_word: צַדִּיק
  choice: juste
  rationale: צַדִּיק qualifie celui qui se conforme à ce qui est droit. « Juste » est naturel en français et conserve la portée morale du terme.
- source_word: וְ/עָשָׂה
  choice: et pratique
  rationale: Avec les noms abstraits qui suivent, « pratiquer » rend idiomatiquement l’action habituelle exprimée par עשה.
- source_word: מִשְׁפָּט
  choice: le droit
  rationale: Dans cette paire éthique, מִשְׁפָּט évoque ce qui est conforme au droit et à un jugement équitable. « Le droit » préserve sa distinction avec צְדָקָה.
- source_word: וּ/צְדָקָה
  choice: la justice
  rationale: צְדָקָה désigne ici la conduite juste et droite. « La justice » forme en français une paire naturelle avec « le droit » sans confondre entièrement les deux termes hébreux.
theological_decisions:
- issue: Singulier représentatif masculin
  choice: un homme
  alternative: quelqu’un / une personne
  rationale: Le texte hébreu emploie explicitement אִישׁ, masculin singulier. « Un homme » maintient cette forme tout en présentant un cas représentatif.
- issue: Rapport entre מִשְׁפָּט et צְדָקָה
  choice: le droit et la justice
  alternative: la justice et la droiture / ce qui est droit et juste
  rationale: La traduction conserve deux notions coordonnées plutôt que de les fusionner, sans leur imposer une distinction théologique plus précise que celle du texte.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve le masculin singulier du texte et distingue les deux termes éthiques hébreux par la paire idiomatique « le droit et la justice ».
