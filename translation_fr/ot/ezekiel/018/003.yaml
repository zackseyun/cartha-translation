  yaml_path: translation/ot/ezekiel/018/003.yaml
  text: As I live[a], declares the Lord GOD[b], this proverb shall no longer be used by you in Israel.
translation:
  language: fr
  text: Aussi vrai que je suis vivant, déclare le Seigneur Yahweh, vous ne citerez plus ce proverbe en Israël.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « s’il vous arrive encore d’énoncer ce proverbe en Israël ». Dans cette formule de serment hébraïque, la conséquence imprécatoire est sous-entendue ; le sens est donc : « Vous ne citerez certainement plus ce proverbe en Israël. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָנִי
  choice: Aussi vrai que je suis vivant
  rationale: Cette formule française naturelle conserve la force de la formule de serment divine hébraïque.
- source_word: נְאֻם
  choice: déclaration de
  rationale: Rend la formule prophétique d’autorité tout en s’intégrant dignement dans l’incise.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Distingue le titre אֲדֹנָי du nom divin יהוה et évite la répétition « le Seigneur SEIGNEUR ».
- source_word: אִם יִהְיֶה ... עוֹד
  choice: ne… plus
  rationale: Dans le contexte du serment, אִם introduit une négation implicite et עוֹד marque la cessation.
- source_word: לָכֶם
  choice: vous
  rationale: Le datif indique ici les destinataires qui ont ce proverbe en usage; la tournure active est idiomatique en français.
- source_word: מְשֹׁל הַמָּשָׁל הַזֶּה
  choice: citerez… ce proverbe
  rationale: L’infinitif verbal de משל désigne ici l’emploi ou l’énonciation d’un proverbe; « citer » exprime précisément cet usage.
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: Conserve le cadre géographique et social de la circulation du proverbe.
theological_decisions:
- issue: Rendu du nom divin יהוה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: « Yahweh » représente explicitement le nom divin, tandis que « Seigneur » rend le titre distinct אֲדֹנָי.
- issue: Valeur de אִם dans la formule de serment
  choice: 'affirmation négative catégorique : « vous ne citerez plus »'
  alternative: 'forme littérale conditionnelle : « si vous citez encore »'
  rationale: Dans un serment hébraïque, la conséquence imprécatoire reste sous-entendue; la négation catégorique communique le sens sans inventer cette conséquence.
translation_notes:
  register: Français international moderne, solennel mais accessible. L’incise conserve le caractère prophétique de la déclaration; « citer un proverbe » est plus naturel et précis ici que « employer un proverbe ».
