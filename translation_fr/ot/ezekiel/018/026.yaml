  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/שׁוּב צַדִּ֧יק מִ/צִּדְקָת֛/וֹ וְ/עָ֥שָׂה עָ֖וֶל וּ/מֵ֣ת עֲלֵי/הֶ֑ם בְּ/עַוְל֥/וֹ אֲשֶׁר עָשָׂ֖ה יָמֽוּת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/026.yaml
  text: When a righteous man turns away from his righteousness and does injustice[a], and dies because of them[b], he shall die for the injustice that he has done.
translation:
  language: fr
  text: Quand un juste se détourne de sa justice, pratique l’injustice[a] et meurt à cause de ces actes[b], il mourra à cause de l’injustice qu’il a commise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fait le mal » ou « commet l’iniquité ». Le mot hébreu עָוֶל peut désigner l’injustice, le tort ou ce qui est contraire à la justice.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « à cause d’eux ». Le pronom hébreu est au pluriel et renvoie aux actes injustes qui viennent d’être évoqués.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּב
  choice: Quand … se détourne
  rationale: 'La préposition בְּ avec l’infinitif construit introduit ici une proposition temporelle. Avec מִן, שׁוּב indique l’abandon d’un état antérieur : « se détourner de ».'
- source_word: צַדִּיק
  choice: un juste
  rationale: L’adjectif masculin singulier est employé comme substantif pour présenter un cas individuel. « Un juste » est une formulation française courante, concise et fidèle.
- source_word: מִצִּדְקָתוֹ
  choice: de sa justice
  rationale: Le nom désigne ici la justice ou la conduite juste de l’individu. Le terme « justice » maintient le lien lexical et le contraste éthique avec עָוֶל.
- source_word: וְעָשָׂה עָוֶל
  choice: pratique l’injustice
  rationale: עָוֶל peut désigner l’injustice, le tort ou l’iniquité. « Pratique l’injustice » restitue naturellement en français la construction avec עָשָׂה, sans recourir au terme plus marqué « iniquité ».
- source_word: וּמֵת
  choice: et meurt
  rationale: La forme exprime simplement la mort de l’individu dans la suite de la proposition conditionnelle; le présent français convient à l’énoncé d’un principe général.
- source_word: עֲלֵיהֶם
  choice: à cause de ces actes
  rationale: La préposition et le suffixe pluriel ont ici une valeur causale. « Ces actes » rend explicite l’antécédent implicite tout en signalant la pluralité présente en hébreu.
- source_word: בְּעַוְלוֹ אֲשֶׁר עָשָׂה
  choice: à cause de l’injustice qu’il a commise
  rationale: Le בְּ est compris dans un sens causal. La proposition relative maintient l’accent du texte sur l’acte injuste dont cet individu est lui-même responsable.
- source_word: יָמוּת
  choice: il mourra
  rationale: L’inaccompli énonce ici la conséquence certaine du principe. Le futur français exprime cette conséquence avec naturel, sans ajouter une idée d’obligation absente du verbe.
theological_decisions:
- issue: La portée du fait qu’un juste se détourne de sa justice
  choice: Traduire directement l’avertissement conditionnel et sa conséquence, sans trancher les débats doctrinaux ultérieurs.
  alternative: Reformuler le verset soit pour insister sur une apostasie définitive, soit pour atténuer la réalité du détournement.
  rationale: L’hébreu présente réellement un juste qui se détourne de sa justice, pratique l’injustice et meurt à cause de ses actes. La traduction conserve cette tension sans lui imposer un système théologique extérieur au verset.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le masculin singulier du cas présenté, la répétition intentionnelle autour de la mort et le contraste lexical entre « justice » et « injustice ».
