  text: כָּל פְּשָׁעָי/ו֙ אֲשֶׁ֣ר עָשָׂ֔ה לֹ֥א יִזָּכְר֖וּ ל֑/וֹ בְּ/צִדְקָת֥/וֹ אֲשֶׁר עָשָׂ֖ה יִֽחְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/022.yaml
  text: None of the transgressions that he has committed will be remembered against him[a]; by the righteousness that he has practiced[b], he will live.
translation:
  language: fr
  text: Aucune des transgressions qu’il a commises ne sera retenue contre lui[a] ; il vivra par la justice qu’il a pratiquée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « ne sera mise à son compte ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à cause de la justice qu’il a pratiquée » ou « dans sa justice » ; la préposition hébraïque permet ici plusieurs nuances étroitement liées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל פְּשָׁעָיו
  choice: Aucune de ses transgressions
  rationale: Avec la négation qui suit, « aucune » exprime naturellement en français la portée totale de כָּל. « Transgressions » conserve la dimension morale et juridique de פֶּשַׁע.
- source_word: אֲשֶׁר עָשָׂה
  choice: qu’il a commises
  rationale: En français courant, on « commet » une transgression ; le passé composé convient à des actes passés ayant une incidence présente.
- source_word: לֹא יִזָּכְרוּ לוֹ
  choice: ne sera retenue contre lui
  rationale: Cette tournure française naturelle rend le passif de זכר et la valeur défavorable ou judiciaire de לוֹ. Une traduction plus formelle est signalée en note.
- source_word: בְּצִדְקָתוֹ אֲשֶׁר עָשָׂה
  choice: par la justice qu’il a pratiquée
  rationale: « Par » préserve la valeur instrumentale ou causale possible de בְּ, tandis que « pratiquer la justice » rend idiomatiquement une justice mise en actes.
- source_word: יִחְיֶה
  choice: il vivra
  rationale: Le futur simple restitue clairement l’issue promise sans préciser au-delà du texte la nature de cette vie.
theological_decisions:
- issue: Rapport entre la justice pratiquée, la non-imputation des transgressions et la vie
  choice: Traduire directement que ses transgressions ne seront pas retenues contre lui et qu’il vivra par la justice pratiquée.
  alternative: Reformuler le verset selon des catégories doctrinales ultérieures, soit en termes explicites de justification méritoire, soit en réduisant « vivre » au seul bien-être temporel.
  rationale: Le texte énonce un principe judiciaire et moral dans les catégories propres à Ézéchiel. La traduction conserve cette tension sans trancher des débats théologiques que le verset ne formule pas.
translation_notes:
  register: Français international moderne, digne et accessible. « Retenue contre lui » exprime naturellement le contexte judiciaire ; « pratiquer la justice » présente la justice comme une conduite effective sans importer une terminologie confessionnelle.
