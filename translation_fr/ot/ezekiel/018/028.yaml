  text: וַ/יִּרְאֶ֣ה ו/ישוב מִ/כָּל פְּשָׁעָ֖י/ו אֲשֶׁ֣ר עָשָׂ֑ה חָי֥וֹ יִחְיֶ֖ה לֹ֥א יָמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/028.yaml
  text: Because he considered and turned back from all his transgressions that he had committed[a], he will surely live[b]; he will not die.
translation:
  language: fr
  text: Parce qu’il a pris conscience de toutes les transgressions qu’il avait commises et s’en est détourné[b], il vivra, oui, il vivra ; il ne mourra pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Ou : « est revenu » ou « s’est repenti ». L’hébreu emploie le verbe « tourner, revenir », qui présente l’abandon du péché comme un changement de direction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאֶה
  choice: Parce qu’il a pris conscience
  rationale: Le verbe ראה signifie littéralement « voir », mais il exprime ici une perception ou une prise de conscience qui conduit à changer de conduite. La conjonction ו est rendue par « parce que » selon le rapport logique avec la promesse qui suit.
- source_word: וישוב
  choice: s’est détourné
  rationale: שׁוב signifie « tourner, revenir ». « S’est détourné » conserve l’image concrète d’un changement de direction par rapport aux fautes, sans imposer le terme théologique plus spécialisé « s’est repenti ».
- source_word: מִכָּל פְּשָׁעָיו
  choice: de toutes les transgressions
  rationale: פֶּשַׁע désigne une transgression pouvant comporter l’idée de rébellion volontaire. « Transgressions » en garde la gravité morale sans réduire le sens à une rébellion politique.
- source_word: אֲשֶׁר עָשָׂה
  choice: qu’il avait commises
  rationale: עָשָׂה signifie généralement « faire ». Avec « transgressions », le français idiomatique emploie « commettre » ; le plus-que-parfait marque l’antériorité des actes par rapport au changement de conduite.
- source_word: חָיוֹ יִחְיֶה
  choice: il vivra, oui, il vivra
  rationale: L’infinitif absolu suivi de l’imparfait intensifie l’affirmation. La reprise avec « oui » rend cette insistance en français naturel tout en laissant entendre la répétition hébraïque.
- source_word: לֹא יָמוּת
  choice: il ne mourra pas
  rationale: Traduction directe de l’imparfait nié, conservant le contraste net avec l’affirmation emphatique de la vie.
theological_decisions:
- issue: Portée de la vie et de la mort dans l’avertissement d’Ézéchiel
  choice: 'Conserver la promesse directe : « il vivra… il ne mourra pas », sans définir davantage la nature de cette vie et de cette mort.'
  alternative: Préciser qu’il s’agit exclusivement de survie physique, de vie judiciaire ou liée à l’alliance, de vie spirituelle, ou de vie eschatologique.
  rationale: Dans ce discours, le verset promet la vie à celui qui se détourne de ses transgressions, mais il ne circonscrit pas ici la portée de « vivre » et « mourir ». La formulation directe préserve cette tension théologique.
translation_notes:
  register: Français international moderne, clair et digne. « Pris conscience » explicite naturellement la perception morale exprimée par « voir », tandis que les notes conservent le sens littéral et les autres valeurs possibles. La répétition « il vivra, oui, il vivra » reproduit l’emphase hébraïque sans archaïsme.
