  text: וַ/אֲמַרְתֶּ֕ם לֹ֥א יִתָּכֵ֖ן דֶּ֣רֶךְ אֲדֹנָ֑/י שִׁמְעוּ נָא֙ בֵּ֣ית יִשְׂרָאֵ֔ל הֲ/דַרְכִּ/י֙ לֹ֣א יִתָּכֵ֔ן הֲ/לֹ֥א דַרְכֵי/כֶ֖ם לֹ֥א יִתָּכֵֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/025.yaml
  text: 'Yet you say[a], ‘The way of the Lord is not just.’ Hear now, house of Israel: Is my way not just? Is it not your ways that are not just?'
translation:
  language: fr
  text: 'Pourtant, vous dites : « La voie du Seigneur n’est pas juste[a]. » Écoutez donc, maison d’Israël : ma voie n’est-elle pas juste ? Ne sont-ce pas vos voies qui ne sont pas justes ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « droite » ou « équitable » dans chacune des occurrences de « juste ». Le terme hébreu désigne ici ce qui est approprié ou conforme à l’équité.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: Pourtant, vous dites
  rationale: Dans ce débat, la conjonction introduit l’objection d’Israël en contraste avec ce qui précède. « Pourtant » rend naturellement cette nuance adversative.
- source_word: יִתָּכֵן / יִתָּכֵנוּ
  choice: n’est pas juste / ne sont pas justes
  rationale: Dans ce contexte de justice morale, le niphal de תכן qualifie ce qui est droit, approprié ou équitable. « Juste » conserve la force éthique et judiciaire de l’accusation comme de la réponse.
- source_word: דֶּרֶךְ / דַרְכִּי / דַרְכֵיכֶם
  choice: voie / ma voie / vos voies
  rationale: « Voie » conserve la métaphore hébraïque de la manière d’agir et permet de maintenir le contraste entre la voie du Seigneur et les voies d’Israël, y compris le passage du singulier au pluriel.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Le titre divin אֲדֹנָי est rendu selon son sens habituel et dans un registre prophétique digne.
- source_word: שִׁמְעוּ נָא
  choice: Écoutez donc
  rationale: L’impératif accompagné de נָא exprime ici un appel pressant. « Donc » marque l’insistance sans donner artificiellement à la particule une valeur de politesse.
- source_word: בֵּית יִשְׂרָאֵל
  choice: maison d’Israël
  rationale: Cette formulation conserve la désignation collective et relationnelle traditionnelle du peuple dans le discours prophétique.
theological_decisions:
- issue: Caractérisation morale de la manière d’agir de Dieu face à l’accusation d’Israël
  choice: Rendre uniformément יִתָּכֵן par « juste »
  alternative: « droite », « équitable » ou « bien réglée »
  rationale: Le chapitre traite de la justice divine et de la responsabilité personnelle. « Juste » préserve la portée morale et judiciaire de l’objection sans réduire la question à un simple sentiment d’équité.
- issue: Contraste rhétorique entre la voie de Dieu et les voies d’Israël
  choice: Conserver le singulier « ma voie » et le pluriel « vos voies »
  alternative: Uniformiser par « votre manière d’agir » au singulier
  rationale: Le nombre grammatical fait partie du contraste hébreu. Le préserver évite de résoudre ou d’aplanir une nuance réelle du texte.
translation_notes:
  register: Français international actuel, au registre digne et prophétique. « Voie » garde la métaphore structurante du texte, tandis que « Écoutez donc » reste direct et intelligible. La construction finale conserve l’insistance hébraïque sur « vos voies ».
