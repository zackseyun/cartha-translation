  text: וְ/אָֽמְרוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל לֹ֥א יִתָּכֵ֖ן דֶּ֣רֶךְ אֲדֹנָ֑/י הַ/דְּרָכַ֞/י לֹ֤א יִתָּֽכְנּוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל הֲ/לֹ֥א דַרְכֵי/כֶ֖ם לֹ֥א יִתָּכֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/029.yaml
  text: Yet the house of Israel says[a], ‘The way of the Lord is not just.’ Are my ways not just, O house of Israel? Is it not your ways that are not just?
translation:
  language: fr
  text: 'Pourtant, la maison d’Israël dit : « La manière d’agir du Seigneur n’est pas juste[a]. » Mes manières d’agir ne sont-elles pas justes, maison d’Israël ? Ne sont-ce pas vos manières d’agir qui ne sont pas justes ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’est pas droite » ou « n’est pas équitable ». Le verbe hébreu évoque ce qui est correctement mesuré ou ordonné ; il désigne ici la rectitude morale dans l’action du Seigneur.
    reason: alternative lexicale
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Pourtant, ... dit
  rationale: Le waw et l’accompli reprennent l’objection persistante d’Israël. Le présent français convient à cette parole citée, et « Pourtant » exprime la valeur adversative du contexte.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Cette formulation conserve l’expression collective et sa portée d’adresse au peuple, sans la réduire au simple nom « Israël ».
- source_word: לֹא יִתָּכֵן
  choice: n’est pas juste
  rationale: Le niphal de תכן évoque ici ce qui est correctement mesuré, réglé ou ordonné et, dans ce débat moral, ce qui est juste. La même formulation est maintenue aux trois occurrences pour préserver la symétrie rhétorique.
- source_word: דֶּרֶךְ / דְּרָכַי / דַרְכֵיכֶם
  choice: manière(s) d’agir
  rationale: Dans ce contexte, דרך désigne la conduite ou la façon d’agir. « Manière d’agir » est naturel en français pour le Seigneur comme pour Israël et permet de conserver le contraste entre le singulier initial et les pluriels suivants.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Rendu usuel du titre divin אֲדֹנָי en français moderne.
- source_word: הֲלֹא
  choice: ne ... pas ? / ne ... pas plutôt ?
  rationale: Ces tournures rendent les questions rhétoriques qui attendent l’assentiment. « Plutôt » explicite naturellement le contraste correctif porté par la seconde question sans en changer le contenu.
theological_decisions:
- issue: Terme d’évaluation morale appliqué à l’action de Dieu
  choice: Traduire יִתָּכֵן par « être juste » dans les trois propositions
  alternative: « être droit », « être équitable » ou « être bien réglé »
  rationale: « Juste » exprime clairement la rectitude morale et l’équité contestées dans le chapitre, sans réduire l’accusation à un sentiment subjectif d’injustice. La répétition stricte conserve la force du débat.
- issue: Sens métaphorique de דרך
  choice: Employer « manière(s) d’agir »
  alternative: Employer littéralement « voie(s) »
  rationale: Le passage oppose la conduite du Seigneur à celle du peuple. « Manière d’agir » communique ce sens idiomatiquement tout en préservant le parallèle et sans attribuer au texte une doctrine supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. Le choix « manière d’agir » évite l’opacité possible de « voie » dans cette accusation, tout en maintenant le singulier puis les pluriels de l’hébreu. Le marqueur [a] figure immédiatement après le verbe concerné.
