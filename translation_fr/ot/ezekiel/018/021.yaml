reference: Ezekiel 18:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָ/רָשָׁ֗ע כִּ֤י יָשׁוּב֙ מִ/כָּל חטאת/ו אֲשֶׁ֣ר עָשָׂ֔ה וְ/שָׁמַר֙ אֶת כָּל חֻקּוֹתַ֔/י וְ/עָשָׂ֥ה מִשְׁפָּ֖ט וּ/צְדָקָ֑ה חָיֹ֥ה יִחְיֶ֖ה לֹ֥א יָמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/021.yaml
  text: But if the wicked man turns back from all his sins that he has committed[a], and keeps all my statutes, and does justice and righteousness, he shall surely live; he shall not die.
translation:
  language: fr
  text: Mais si le méchant se détourne de tous les péchés qu’il a commis[a], s’il observe toutes mes prescriptions et pratique le droit et la justice, il vivra à coup sûr ; il ne mourra pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se repent ». Le verbe hébreu signifie littéralement « tourner » ou « revenir » et décrit ici le fait de se détourner du péché.
    reason: Alternative lexicale permettant de signaler le sens théologique possible tout en expliquant l’image concrète du verbe hébreu.
lexical_decisions:
- source_word: הָרָשָׁע
  choice: le méchant
  rationale: L’adjectif substantivé hébreu est au masculin singulier et désigne ici un individu caractérisé par sa méchanceté. « Le méchant » conserve cette forme sans ajouter un nom absent du texte.
- source_word: כִּי
  choice: si
  rationale: Dans cette construction, כִּי introduit le cas conditionnel envisagé. Avec le וְ initial, l’ensemble est naturellement rendu par « Mais si ».
- source_word: יָשׁוּב מִכָּל חטאתו
  choice: se détourne de tous les péchés
  rationale: שׁוּב exprime concrètement un mouvement de retour ou de changement de direction ; avec מִן et les péchés, « se détourner de » rend clairement l’abandon de la conduite antérieure sans remplacer l’image par un terme théologique plus spécialisé.
- source_word: אֲשֶׁר עָשָׂה
  choice: qu’il a commis
  rationale: Avec « péchés », le français idiomatique emploie « commettre ». Le passé composé situe ces actes avant le retournement décrit.
- source_word: וְשָׁמַר
  choice: s’il observe
  rationale: Avec des prescriptions, שׁמר signifie les garder au sens de les respecter. La reprise de « si » clarifie en français que les verbes coordonnés appartiennent tous à la condition.
- source_word: חֻקּוֹתַי
  choice: mes prescriptions
  rationale: « Prescriptions » exprime naturellement en français moderne les règles établies par Dieu, tout en maintenant la nuance juridique de חֻקּוֹת.
- source_word: וְעָשָׂה מִשְׁפָּט וּצְדָקָה
  choice: et pratique le droit et la justice
  rationale: « Pratique » rend idiomatiquement עשה avec deux noms éthiques. « Le droit et la justice » conserve les deux termes distincts et leur poids moral et juridique.
- source_word: חָיֹה יִחְיֶה
  choice: il vivra à coup sûr
  rationale: L’infinitif absolu suivi de l’imparfait renforce l’affirmation. « À coup sûr » transmet cette emphase en français courant et digne.
- source_word: לֹא יָמוּת
  choice: il ne mourra pas
  rationale: Traduction directe de la négation et du verbe, mise en contraste avec la promesse emphatique de vivre.
theological_decisions:
- issue: Rendre שׁוּב par un terme explicitement théologique ou conserver son image concrète
  choice: se détourne
  alternative: se repent
  rationale: « Se détourne » garde l’image hébraïque du changement de direction et, avec le complément « de tous les péchés », exprime nettement le retournement moral sans imposer un vocabulaire théologique plus spécialisé.
- issue: Déterminer la portée de חָיֹה יִחְיֶה
  choice: il vivra à coup sûr
  alternative: il restera certainement en vie / il recevra la vie éternelle
  rationale: La formulation conserve l’ampleur du langage de vie et de mort chez Ézéchiel, sans le réduire à la seule survie physique ni le définir expressément comme salut eschatologique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conditionnelle est explicitée par la répétition de « s’il ». Le point-virgule maintient l’opposition solennelle entre vivre et mourir.
