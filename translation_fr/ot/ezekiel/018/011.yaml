id: EZK.18.11
reference: Ezekiel 18:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/ה֕וּא אֶת כָּל אֵ֖לֶּה לֹ֣א עָשָׂ֑ה כִּ֣י גַ֤ם אֶל הֶֽ/הָרִים֙ אָכַ֔ל וְ/אֶת אֵ֥שֶׁת רֵעֵ֖/הוּ טִמֵּֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/011.yaml
  text: But he has done none of all these things; instead, he has even eaten on the mountains and defiled his neighbor’s wife.
translation:
  language: fr
  text: Mais lui n’a rien fait de tout cela ; au contraire, il a même mangé sur les montagnes et souillé la femme de son prochain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי גַם
  choice: au contraire, il a même
  rationale: 'Dans ce contexte, la locution introduit une opposition renforcée : loin d’accomplir les actes justes évoqués, cet homme commet même les fautes qui suivent.'
- source_word: אֶל הֶהָרִים אָכַל
  choice: mangé sur les montagnes
  rationale: La formulation concrète de l’hébreu est conservée sans expliciter dans le texte le cadre cultuel probablement visé.
- source_word: טִמֵּא
  choice: souillé
  rationale: Le verbe signifie rendre impur ou profaner ; « souillé » préserve ici sa force morale et rituelle.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: la femme de son prochain
  rationale: « Prochain » rend naturellement רֵעַ dans un registre biblique moderne et digne, sans réduire le terme au simple voisinage géographique.
theological_decisions:
- issue: Référent de « tout cela »
  choice: Conserver le renvoi général par « tout cela »
  alternative: Préciser qu’il s’agit des actes justes de son père
  rationale: Le texte hébreu laisse le référent implicite ; la traduction ne doit pas ajouter une identification interprétative absente du verset.
- issue: Nature des repas sur les montagnes
  choice: Ne pas préciser qu’il s’agit de repas idolâtres ou sacrificiels
  alternative: Traduire « pris part à des repas idolâtres sur les montagnes »
  rationale: Le contexte suggère fortement un culte pratiqué sur les hauts lieux, mais le verset emploie seulement le verbe « manger » ; la formulation retenue préserve cette concision.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé composé correspond aux formes accomplies de l’hébreu et assure la continuité avec une présentation narrative des actes. Le point-virgule met clairement en relief l’opposition exprimée par כִּי גַם.
