base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/031.yaml
  text: Cast away from yourselves all your transgressions by which you have transgressed[a], and make for yourselves a new heart and a new spirit. Why should you die, O house of Israel?
translation:
  language: fr
  text: Rejetez loin de vous toutes vos transgressions par lesquelles vous avez transgressé[a], et faites-vous un cœur nouveau et un esprit nouveau. Pourquoi mourriez-vous, maison d’Israël ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toutes vos rébellions, par lesquelles vous vous êtes rebellés ». L’hébreu emploie le même radical pour « transgressions » et « avez transgressé », soulignant la culpabilité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁלִיכוּ מֵעֲלֵיכֶם
  choice: Rejetez loin de vous
  rationale: L’impératif exprime un rejet énergique, tandis que « loin de vous » rend naturellement l’idée littérale d’ôter ce qui se trouve sur eux.
- source_word: כָּל־פִּשְׁעֵיכֶם אֲשֶׁר פְּשַׁעְתֶּם בָּם
  choice: toutes les révoltes que vous avez commises
  rationale: פשע désigne des actes de rébellion ou de rupture envers l’autorité légitime. « Révoltes » conserve cette force; la note signale la répétition étymologique de l’hébreu, difficile à reproduire avec naturel en français.
- source_word: וַעֲשׂוּ לָכֶם
  choice: et faites-vous
  rationale: Cette formulation directe conserve l’impératif et la valeur réfléchie de לָכֶם, sans atténuer la responsabilité adressée aux auditeurs.
- source_word: לֵב חָדָשׁ
  choice: un cœur nouveau
  rationale: « Cœur » conserve l’image centrale d’Ézéchiel pour la disposition intérieure, la volonté et l’orientation de la personne.
- source_word: רוּחַ חֲדָשָׁה
  choice: un esprit nouveau
  rationale: « Esprit » maintient le vocabulaire théologique d’Ézéchiel et le parallélisme avec « cœur ».
- source_word: וְלָמָּה תָמֻתוּ
  choice: Pourquoi mourriez-vous
  rationale: Le conditionnel français rend naturellement la question rhétorique et l’appel exhortatif, plutôt qu’une simple prédiction.
- source_word: בֵּית יִשְׂרָאֵל
  choice: communauté d’Israël
  rationale: Dans cette adresse collective, בֵּית signifie le peuple constitué comme groupe. « Communauté d’Israël » est moderne et intelligible, sans l’ambiguïté domestique de « maison d’Israël ».
theological_decisions:
- issue: Responsabilité humaine et don divin du cœur et de l’esprit nouveaux
  choice: Conserver l’impératif « faites-vous un cœur nouveau et un esprit nouveau »
  alternative: Reformuler comme une demande adressée à Dieu ou atténuer l’ordre en « recevez »
  rationale: Le texte commande directement ce renouvellement à Israël. Cette formulation préserve la tension avec les passages où Dieu promet lui-même de donner un cœur et un esprit nouveaux, sans harmonisation interprétative.
- issue: Valeur de פשע et répétition du nom et du verbe apparentés
  choice: Employer « révoltes » dans le texte et expliquer en note la répétition hébraïque
  alternative: Employer « transgressions par lesquelles vous avez transgressé »
  rationale: « Révoltes » transmet clairement la culpabilité et la défiance envers l’autorité; une reproduction littérale de la même racine serait lourde en français. La note conserve l’information rhétorique.
translation_notes:
  register: Français international moderne, direct et digne. Les impératifs restent vigoureux; le parallélisme « un cœur nouveau et un esprit nouveau » est conservé. « Communauté d’Israël » rend l’adresse collective de façon claire pour le lectorat contemporain.
