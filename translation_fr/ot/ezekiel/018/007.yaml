id: EZK.18.7
reference: Ezekiel 18:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִישׁ֙ לֹ֣א יוֹנֶ֔ה חֲבֹלָת֥/וֹ חוֹב֙ יָשִׁ֔יב גְּזֵלָ֖ה לֹ֣א יִגְזֹ֑ל לַחְמ/וֹ֙ לְ/רָעֵ֣ב יִתֵּ֔ן וְ/עֵירֹ֖ם יְכַסֶּה בָּֽגֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/007.yaml
  text: He does not oppress anyone[a], but restores the debtor’s pledge; he does not commit robbery[c][b]; he gives his bread to the hungry and covers the naked with a garment.
translation:
  language: fr
  text: Il n’opprime personne et rend le gage pris pour une dette[a] ; il ne commet aucun vol, donne son pain à celui qui a faim[b] et couvre d’un vêtement celui qui est nu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rend au débiteur ce qui lui servait de garantie ».
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu signifie littéralement « son pain » et peut désigner plus largement sa nourriture.
    reason: lexical_alternative
  - marker: c
    text: Ou « donne des vêtements à celui qui est nu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹנֶה
  choice: opprime
  rationale: Le hiphil de ינה désigne ici l’exploitation ou l’oppression injuste d’autrui, notamment dans les rapports sociaux et économiques.
- source_word: אִישׁ
  choice: personne
  rationale: Dans cette interdiction éthique, le nom masculin singulier a une portée générique. « Personne » est naturel en français après la négation et ne restreint pas le sens aux hommes.
- source_word: חֲבֹלָתוֹ חוֹב יָשִׁיב
  choice: rend le gage pris pour une dette
  rationale: La formule évoque la restitution d’un objet remis ou saisi comme garantie d’une dette. Cette traduction conserve à la fois l’idée de gage et celle de dette sans surinterpréter les circonstances.
- source_word: גְּזֵלָה לֹא יִגְזֹל
  choice: ne commet aucun vol
  rationale: La construction associant un nom et un verbe de même racine souligne l’acte de dépouiller ou de voler. « Ne commet aucun vol » en restitue la force dans un français naturel.
- source_word: לַחְמוֹ
  choice: son pain
  rationale: « Pain » conserve l’image concrète de l’hébreu, tout en pouvant représenter plus largement la nourriture.
- source_word: לְרָעֵב
  choice: à celui qui a faim
  rationale: L’adjectif substantivé désigne une personne affamée. Cette formulation est claire, actuelle et inclusive en français.
- source_word: עֵירֹם יְכַסֶּה בָּגֶד
  choice: couvre d’un vêtement celui qui est nu
  rationale: La traduction reproduit l’image hébraïque du fait de couvrir une personne nue au moyen d’un vêtement, tout en restant idiomatique.
theological_decisions:
- issue: Sujet éthique masculin à valeur représentative
  choice: Il n’opprime personne…
  alternative: Un homme n’opprime personne…
  rationale: Le pronom « il » maintient la continuité avec le portrait singulier de l’homme juste dans le contexte, tandis que « personne » rend explicitement la portée générale de l’objet sans introduire de particularité doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe suit la série d’actions décrivant le juste, avec un point-virgule pour rendre la progression lisible. Les images concrètes du gage, du pain et du vêtement sont conservées.
