id: EZK.18.10
reference: Ezekiel 18:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הוֹלִ֥יד בֵּן פָּרִ֖יץ שֹׁפֵ֣ךְ דָּ֑ם וְ/עָ֣שָׂה אָ֔ח מֵ/אַחַ֖ד מֵ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/010.yaml
  text: But if he fathers a violent son[a], one who sheds blood and does any one of these things,
translation:
  language: fr
  text: Mais si cet homme engendre un fils violent[a], qui répand le sang et commet ne serait-ce qu’un seul de ces actes,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Et il engendre un fils violent, qui répand le sang et commet un seul de ces actes. »'
    reason: Alternative plus formelle qui reflète la conjonction simple et la structure hébraïque tout en signalant la difficulté de la dernière expression.
lexical_decisions:
- source_word: וְהוֹלִיד
  choice: Mais si cet homme engendre
  rationale: Le hifil de ילד signifie « engendrer ». Le contexte introduit, par contraste, le cas hypothétique du fils violent d’un homme juste; « mais si » rend cette articulation, tandis que « cet homme » explicite naturellement en français le sujet repris du contexte.
- source_word: בֵּן
  choice: un fils
  rationale: בֵּן désigne ici précisément un fils et maintient la référence masculine singulière de l’hébreu.
- source_word: פָּרִיץ
  choice: violent
  rationale: Le terme qualifie une personne violente, brutale ou sans scrupules. « Violent » est direct et convient à la mention immédiate du sang répandu.
- source_word: שֹׁפֵךְ דָּם
  choice: qui répand le sang
  rationale: Cette proposition relative conserve l’image et la portée du participe hébreu sans la réduire au terme juridique plus étroit « meurtrier ».
- source_word: וְעָשָׂה
  choice: et commet
  rationale: Devant le complément « actes », « commet » est plus idiomatique en français que « fait » et convient à des actions répréhensibles.
- source_word: אָח מֵאַחַד מֵאֵלֶּה
  choice: ne serait-ce qu’un seul de ces actes
  rationale: 'La forme אָח est difficile, mais le contexte et l’expression qui suit indiquent l’idée d’un seul parmi les actes mentionnés. Cette formulation française préserve la force minimale: même un seul de ces actes.'
theological_decisions:
- issue: Valeur conditionnelle et adversative de la conjonction initiale
  choice: Mais si cet homme engendre
  alternative: Et il engendre
  rationale: La conjonction hébraïque est formellement « et », mais le mouvement du discours oppose le fils violent à son père juste et poursuit une construction conditionnelle. « Mais si » rend cette logique sans ajouter de conclusion doctrinale.
- issue: Portée de שֹׁפֵךְ דָּם
  choice: qui répand le sang
  alternative: un meurtrier
  rationale: La traduction conserve l’expression hébraïque et évite de décider si elle vise exclusivement le meurtre au sens juridique.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste ouverte par une virgule parce que la construction conditionnelle se poursuit au verset suivant.
