  text: בַּ/נֶּ֣שֶׁךְ לֹֽא יִתֵּ֗ן וְ/תַרְבִּית֙ לֹ֣א יִקָּ֔ח מֵ/עָ֖וֶל יָשִׁ֣יב יָד֑/וֹ מִשְׁפַּ֤ט אֱמֶת֙ יַֽעֲשֶׂ֔ה בֵּ֥ין אִ֖ישׁ לְ/אִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/008.yaml
  text: He does not lend at interest or take profit[a]; he keeps his hand back from injustice[c][b]; he executes true justice between one man and another.
translation:
  language: fr
  text: Il ne prête pas à intérêt et ne perçoit aucun bénéfice[a] ; il détourne sa main de l’injustice[b] et rend un jugement conforme à la vérité entre un homme et un autre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il ne prête pas à usure et ne prélève aucun accroissement. » Les deux mots hébreux désignent des gains tirés d’un prêt.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il ramène sa main de l’injustice ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « entre un homme et un homme » ; il s’agit d’une expression juridique désignant un jugement équitable entre deux parties.'
    reason: cultural_note
lexical_decisions:
- source_word: בַּנֶּשֶׁךְ לֹא יִתֵּן
  choice: Il ne prête pas à intérêt
  rationale: Dans cette association, « donner » désigne l’action de prêter, et נֶשֶׁךְ l’intérêt exigé sur un prêt, souvent avec une nuance d’exploitation. Cette formulation est claire en français moderne.
- source_word: וְתַרְבִּית לֹא יִקָּח
  choice: et ne perçoit aucun bénéfice
  rationale: תַרְבִּית désigne l’accroissement ou le gain tiré du prêt. « Bénéfice » distingue légèrement ce second terme d’« intérêt » sans lui attribuer une technicité excessive.
- source_word: מֵעָוֶל יָשִׁיב יָדוֹ
  choice: il détourne sa main de l’injustice
  rationale: La traduction conserve l’image hébraïque de la main retirée tout en exprimant le refus de participer à l’injustice.
- source_word: מִשְׁפַּט אֱמֶת יַעֲשֶׂה
  choice: rend un jugement conforme à la vérité
  rationale: מִשְׁפַּט a ici une portée judiciaire et אֱמֶת qualifie le jugement par la vérité ou la fidélité. « Rend un jugement » est l’expression française naturelle dans ce contexte.
- source_word: בֵּין אִישׁ לְאִישׁ
  choice: entre un homme et un autre
  rationale: La formulation conserve le masculin singulier du texte et rend naturellement l’idiome juridique désignant deux parties en litige.
theological_decisions:
- issue: Rapport entre נֶשֶׁךְ et תַרְבִּית
  choice: Deux expressions apparentées rendues par « intérêt » et « bénéfice »
  alternative: « usure » et « accroissement », ou « intérêt » pour les deux termes
  rationale: Le texte juxtapose deux termes proches relatifs au gain obtenu sur un prêt. Une légère distinction lexicale respecte cette paire sans prétendre fixer une différence technique certaine.
- issue: Portée de מִשְׁפַּט אֱמֶת
  choice: « un jugement conforme à la vérité »
  alternative: « un jugement juste » ou « une justice véritable »
  rationale: La formulation choisie maintient ensemble la dimension judiciaire de מִשְׁפַּט et la notion de vérité ou de fidélité portée par אֱמֶת, sans les fondre en une seule idée.
- issue: Idiome genré בֵּין אִישׁ לְאִישׁ
  choice: « entre un homme et un autre »
  alternative: « entre une personne et une autre » ou « entre deux parties »
  rationale: Le masculin représentatif de l’hébreu est conservé, tandis que la note précise la fonction juridique générale de l’expression.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme juridique du verset est conservé, de même que la métaphore de la main et la distinction entre les deux termes économiques hébreux.
