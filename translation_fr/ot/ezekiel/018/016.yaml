id: EZK.18.16
reference: Ezekiel 18:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִישׁ֙ לֹ֣א הוֹנָ֔ה חֲבֹל֙ לֹ֣א חָבָ֔ל וּ/גְזֵלָ֖ה לֹ֣א גָזָ֑ל לַחְמ/וֹ֙ לְ/רָעֵ֣ב נָתָ֔ן וְ/עֵר֖וֹם כִּסָּה בָֽגֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/016.yaml
  text: He has not oppressed anyone[a], has not taken a pledge, and has not robbed[b]; he has given his bread to the hungry and covered the naked with a garment.
translation:
  language: fr
  text: Il n’opprime personne, ne prend rien en gage et ne commet aucun vol. Il donne son pain à celui qui a faim et couvre d’un vêtement celui qui est nu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ לֹא הוֹנָה
  choice: Il n’opprime personne
  rationale: Avec la négation, אִישׁ a ici une portée indéfinie (« personne »). Le verbe ינה désigne le fait de léser, maltraiter ou opprimer; « opprimer » convient au contexte de justice sociale.
- source_word: חֲבֹל לֹא חָבָל
  choice: ne prend rien en gage
  rationale: La construction associe l’infinitif absolu et le verbe de même racine pour nier la prise d’un bien comme garantie d’une dette. Cette formulation française reste concise et restitue le cadre juridique et économique.
- source_word: וּגְזֵלָה לֹא גָזָל
  choice: ne commet aucun vol
  rationale: Le nom et le verbe de même racine évoquent une spoliation ou un vol. « Commettre un vol » conserve la figure interne de l’hébreu de manière naturelle, sans préciser arbitrairement le degré de violence.
- source_word: לַחְמוֹ
  choice: son pain
  rationale: Le terme לֶחֶם désigne concrètement le pain, tout en pouvant représenter la nourriture. Le choix littéral préserve ici l’image du partage de ses propres ressources.
- source_word: לְרָעֵב
  choice: à celui qui a faim
  rationale: L’adjectif substantivé désigne une personne affamée. Cette tournure est naturelle et inclusive en français moderne.
- source_word: וְעֵרוֹם כִּסָּה בָגֶד
  choice: et couvre d’un vêtement celui qui est nu
  rationale: La traduction conserve les éléments concrets de l’hébreu — couvrir, la personne nue, un vêtement — plutôt que de les condenser en « habille ».
theological_decisions: []
