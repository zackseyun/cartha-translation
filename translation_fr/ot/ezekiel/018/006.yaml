source:
  edition: WLC
  text: אֶל הֶֽ/הָרִים֙ לֹ֣א אָכָ֔ל וְ/עֵינָי/ו֙ לֹ֣א נָשָׂ֔א אֶל גִּלּוּלֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל וְ/אֶת אֵ֤שֶׁת רֵעֵ֨/הוּ֙ לֹ֣א טִמֵּ֔א וְ/אֶל אִשָּׁ֥ה נִדָּ֖ה לֹ֥א יִקְרָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/006.yaml
  text: he does not eat on the mountains[a], does not lift up his eyes to the idols of the house of Israel, does not defile his neighbor’s wife[c][b], and does not approach a woman during her menstrual impurity.
translation:
  language: fr
  text: il ne mange pas sur les montagnes[a], ne lève pas les yeux vers les idoles[b] de la maison d’Israël, ne souille pas la femme de son prochain et ne s’approche pas d’une femme pendant son impureté menstruelle[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ne mange pas dans les sanctuaires des hauteurs » : l’expression évoque la participation aux repas sacrificiels pratiqués sur les hauts lieux.'
    reason: alternative_reading
  - marker: b
    text: Le mot hébreu traduit par « idoles » est un terme fortement méprisant employé pour désigner les faux dieux.
    reason: lexical_alternative
  - marker: c
    text: Ici, « s’approcher » est un euphémisme hébreu désignant des relations sexuelles.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל־הֶהָרִים ... אָכָל
  choice: mange sur les montagnes
  rationale: Rend directement l’expression hébraïque tout en conservant son image; dans Ézéchiel, elle désigne la participation aux repas sacrificiels pratiqués sur les hauts lieux, précision donnée en note.
- source_word: וְעֵינָיו לֹא נָשָׂא
  choice: ne lève pas les yeux vers
  rationale: Conserve l’idiome hébraïque, qui peut exprimer l’intérêt, le désir ou la dévotion, sans en réduire ici la portée à un simple regard.
- source_word: גִּלּוּלֵי
  choice: idoles
  rationale: « Idoles » est naturel et clair en français; une note signale la nuance fortement méprisante du terme caractéristique d’Ézéchiel.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la communauté d’Israël
  rationale: בֵּית désigne ici Israël comme corps collectif plutôt qu’un bâtiment ou une dynastie; « communauté d’Israël » communique ce sens en français moderne sans l’archaïsme possible de « maison d’Israël ».
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: la femme de son prochain
  rationale: Reproduit naturellement la formulation juridique biblique et laisse à רֵעַ sa portée de prochain, compagnon ou membre du même groupe.
- source_word: לֹא טִמֵּא
  choice: ne souille pas
  rationale: Le piel de טמא évoque ici la souillure liée à l’adultère; « souiller » maintient ensemble les dimensions morale et rituelle.
- source_word: אִשָּׁה נִדָּה
  choice: une femme pendant son impureté menstruelle
  rationale: Exprime clairement l’état rituel associé aux règles dans le langage légal biblique, sans archaïsme.
- source_word: לֹא יִקְרָב
  choice: ne s’approche pas
  rationale: Conserve l’euphémisme sexuel de l’hébreu; la note en explicite le sens contextuel.
theological_decisions:
- issue: Explicitation du cadre cultuel de l’expression « manger sur les montagnes »
  choice: Conserver « mange sur les montagnes » dans le texte
  alternative: mange dans les sanctuaires des hauteurs
  rationale: La formulation littérale préserve l’image et l’idiome prophétique hébreux; la note explique l’allusion aux repas sacrificiels sans l’intégrer silencieusement au texte.
- issue: Traitement du vocabulaire de pureté
  choice: Conserver « souille » et « impureté menstruelle »
  alternative: commet l’adultère avec; pendant ses règles
  rationale: Le verset associe catégories morales et rituelles. Cette formulation garde leur tension au lieu de réduire le passage à une lecture exclusivement éthique ou cérémonielle.
- issue: Explicitation de l’euphémisme sexuel יִקְרָב
  choice: Conserver « s’approche » dans le texte et expliquer en note
  alternative: a des relations sexuelles avec
  rationale: Le choix maintient la retenue et l’ambiguïté formelle de l’expression hébraïque tout en garantissant sa compréhension grâce à la note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la série de comportements du juste commencée au verset précédent. Les expressions imagées et les catégories de pureté de l’hébreu sont maintenues, avec des notes seulement là où leur sens contextuel risque de ne pas être immédiatement perceptible.
