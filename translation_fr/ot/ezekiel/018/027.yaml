base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/027.yaml
  text: And when a wicked man turns away from the wickedness that he has done and does justice and righteousness[a], he will preserve his life.
translation:
  language: fr
  text: Lorsqu’un méchant se détourne de la méchanceté qu’il a commise et pratique le droit et la justice, il préservera sa vie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « il se maintiendra en vie ». L’expression hébraïque emploie « sa néfèsh », terme qui peut désigner, selon le contexte, la vie, la personne elle-même ou l’âme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְשׁוּב רָשָׁע
  choice: Mais si le méchant se détourne
  rationale: L’infinitif construit précédé de ב introduit la circonstance dans laquelle l’issue annoncée se réalise. Dans le contraste du passage, « Mais si » rend naturellement cette valeur conditionnelle et adversative; « se détourne » exprime le changement de conduite impliqué par שוב.
- source_word: מֵרִשְׁעָתוֹ אֲשֶׁר עָשָׂה
  choice: de la méchanceté qu’il a commise
  rationale: רִשְׁעָה désigne ici la conduite coupable. Le possessif hébreu est suffisamment rendu par la relative qui attribue explicitement cette méchanceté au sujet; « commise » convient mieux en français à des actes mauvais que le littéral « faite ».
- source_word: וַיַּעַשׂ מִשְׁפָּט וּצְדָקָה
  choice: et pratique le droit et la justice
  rationale: « Pratique » rend idiomatiquement עשה avec ces notions éthiques. « Le droit et la justice » conserve deux termes distincts pour מִשְׁפָּט et צְדָקָה ainsi que leur association caractéristique, sans les fusionner.
- source_word: הוּא
  choice: il
  rationale: Le pronom explicite souligne que cet individu, malgré sa conduite antérieure, est bien celui qui bénéficiera de l’issue annoncée. Le français « il » le représente sans alourdir la phrase.
- source_word: אֶת נַפְשׁוֹ יְחַיֶּה
  choice: il préservera sa vie
  rationale: Dans le contraste entre vivre et mourir qui structure Ézéchiel 18, נֶפֶשׁ désigne naturellement la vie ou la personne elle-même. Le piel de חיה a ici le sens de maintenir en vie ou préserver; cette formulation française est claire et ne réduit pas נֶפֶשׁ à une âme immatérielle.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans le contexte moral et judiciaire
  choice: sa vie
  alternative: son âme; lui-même
  rationale: Le chapitre oppose à plusieurs reprises la vie et la mort comme issues du jugement. « Sa vie » correspond donc au contexte et évite d’imposer une conception dualiste plus étroite que le terme hébreu.
- issue: Rapport entre le retournement, la conduite juste et la vie
  choice: conserver sans atténuation l’enchaînement conditionnel du texte
  alternative: reformuler pour préciser un système doctrinal du mérite, de la grâce ou du salut éternel
  rationale: Le verset relie directement le détournement de la méchanceté et la pratique du droit à la préservation de la vie. La traduction maintient cette tension telle quelle, sans ajouter d’explication confessionnelle absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le singulier masculin « le méchant » suit la forme représentative du texte hébreu. « Le droit et la justice » conserve la paire lexicale traditionnelle tout en restant intelligible. Le marqueur de note suit immédiatement l’expression concernée.
