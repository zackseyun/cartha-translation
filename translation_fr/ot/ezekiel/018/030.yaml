base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/030.yaml
  text: Therefore I will judge each man according to his ways[a], O house of Israel, declares the Lord GOD. Repent and turn away from all your transgressions, so that iniquity may not become a stumbling block to you.
translation:
  language: fr
  text: C’est pourquoi je jugerai chacun de vous selon sa conduite, maison d’Israël — déclaration du Seigneur DIEU. Revenez et détournez-vous de toutes vos révoltes, afin que la faute ne devienne pas pour vous une cause de chute.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin que la faute ne devienne pas pour vous une pierre d’achoppement ». L’expression hébraïque est concise et peut mettre l’accent soit sur la faute comme ce qui fait trébucher, soit sur la chute à laquelle elle conduit.'
    reason: Ambiguïté lexicale et syntaxique de לְמִכְשׁוֹל עָוֹן.
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conclusion tirée de l’argument précédent.
- source_word: אִישׁ כִּדְרָכָיו אֶשְׁפֹּט אֶתְכֶם
  choice: je vous jugerai chacun selon sa conduite
  rationale: Le singulier distributif אִישׁ individualise les membres du groupe. « Chacun » le restitue clairement, tandis que « conduite » exprime ici le sens moral de דֶּרֶךְ dans un français naturel.
- source_word: בֵּית יִשְׂרָאֵל
  choice: communauté d’Israël
  rationale: Dans cette apostrophe collective, בַּיִת désigne la collectivité d’Israël plutôt qu’un bâtiment ou une famille au sens étroit.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur DIEU
  rationale: « Déclaration » conserve la valeur de la formule prophétique נְאֻם. « Seigneur DIEU » distingue les deux éléments du titre אֲדֹנָי יְהוִה.
- source_word: שׁוּבוּ
  choice: Revenez à moi
  rationale: שׁוּב appelle à un retour ou à un changement de direction. Le complément implicite « à moi » rend en français le mouvement vers Dieu suggéré par le contexte, sans employer d’emblée un terme théologique spécialisé.
- source_word: וְהָשִׁיבוּ מִכָּל פִּשְׁעֵיכֶם
  choice: et détournez-vous de toutes vos révoltes
  rationale: Le hifil suivi de מִן exprime l’éloignement d’avec les fautes. « Révoltes » conserve la dimension de rébellion portée par פֶּשַׁע.
- source_word: לְמִכְשׁוֹל עָוֹן
  choice: que votre faute ne cause pas votre chute
  rationale: La formule hébraïque est compacte. Cette traduction conserve le lien entre עָוֹן et מִכְשׁוֹל tout en donnant une phrase française compréhensible; une note signale l’autre analyse possible.
theological_decisions:
- issue: Portée individuelle du jugement dans une adresse collective
  choice: je vous jugerai chacun
  alternative: je jugerai chaque homme
  rationale: « Chacun » maintient explicitement la distribution individuelle marquée par אִישׁ, tout en étant plus idiomatique et inclusif dans une adresse à toute la communauté, sans transformer le jugement en affirmation seulement collective.
- issue: Sens de עָוֹן dans la proposition finale
  choice: votre faute ne cause pas votre chute
  alternative: la faute ne devienne pas pour vous une pierre d’achoppement
  rationale: עָוֹן peut désigner la faute, la culpabilité ou ses conséquences, et מִכְשׁוֹל ce qui fait trébucher ou mène à la ruine. Le texte principal rend la portée probable sans effacer l’ambiguïté, laquelle est conservée en note.
- issue: Nature de l’appel exprimé par שׁוּבוּ
  choice: Revenez à moi
  alternative: Repentez-vous
  rationale: La traduction garde l’image fondamentale du retour. « Repentez-vous » exprimerait justement le sens contextuel, mais rendrait moins visible la métaphore hébraïque reprise par le verbe suivant.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme « Revenez… détournez-vous » garde le mouvement des deux impératifs sans répétition maladroite. La graphie « DIEU » sert à représenter le nom divin dans le titre composé « Seigneur DIEU ».
