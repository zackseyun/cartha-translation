  verdict: revise
  source_fidelity: La mention explicite « à moi » après « Revenez » n’est pas présente dans l’hébreu et ajoute un complément que le contexte peut suggérer, mais que le texte ne formule pas. La proposition finale doit également conserver davantage la concision et l’ambiguïté de לְמִכְשׁוֹל עָוֹן.
  naturalness: Le français est globalement direct et moderne. « maison d’Israël » rend plus exactement et plus reconnaissablement l’apostrophe prophétique que « communauté d’Israël », sans être archaïque. La formulation révisée de la finale reste idiomatique tout en étant moins interprétative.
  terminology: « Seigneur DIEU » restitue adéquatement אֲדֹנָי יְהוִה. « Révoltes » convient bien à פְּשָׁעִים. « Faute » est un rendu possible de עָוֹן, dont la note explicite la portée potentiellement plus large.
  issues:
