    rationale: שׁוּבוּ est employé ici sans complément exprimé. Ajouter « à moi » précise théologiquement la direction du retour au-delà de la formulation du verset.
  - severity: medium
    issue: La finale « votre faute ne cause pas votre chute » résout trop fortement la construction hébraïque
    rationale: Le possessif « votre » et le verbe causal « cause » déterminent une relation que לְמִכְשׁוֹל עָוֹן laisse compacte et discutée. Une formulation avec « devenir ... une cause de chute » conserve mieux l’image et l’ambiguïté.
  - severity: low
