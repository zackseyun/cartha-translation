  to: C’est pourquoi je jugerai chacun de vous selon sa conduite, maison d’Israël — déclaration du Seigneur DIEU. Revenez et détournez-vous de toutes vos révoltes, afin que la faute ne devienne pas pour vous une cause de chute.[a]
  rationale: La révision retire le complément non exprimé « à moi », rétablit « maison d’Israël » pour l’expression prophétique récurrente, et formule la dernière proposition de manière moins causale et moins possessive. La note conserve l’autre rendu possible sans imposer une analyse syntaxique ou théologique particulière.
