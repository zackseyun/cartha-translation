revisions:
- from: Il prête à intérêt et perçoit un bénéfice[a]. Vivrait-il ? Non, il ne vivra pas. Il a commis toutes ces abominations ; il sera certainement mis à mort[b]. Son sang retombera sur lui[c].
  to: Il prête à intérêt et tire un profit[a]. Vivrait-il ? Non, il ne vivra pas. Il a commis toutes ces abominations ; il sera certainement mis à mort[b]. Son sang sera sur lui[c].
  rationale: La révision resserre le vocabulaire du prêt, remplace une interprétation plus libre de l’idiome du sang par une formulation source-proche, et nuance la note lexicale sans réduire la force condamnatoire du contexte. Les ancres de notes restent correctement attachées aux expressions qu’elles expliquent.
