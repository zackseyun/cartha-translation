  text: בַּ/נֶּ֧שֶׁךְ נָתַ֛ן וְ/תַרְבִּ֥ית לָקַ֖ח וָ/חָ֑י לֹ֣א יִֽחְיֶ֗ה אֵ֣ת כָּל הַ/תּוֹעֵב֤וֹת הָ/אֵ֨לֶּה֙ עָשָׂ֔ה מ֣וֹת יוּמָ֔ת דָּמָ֖י/ו בּ֥/וֹ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/013.yaml
  text: He lends at interest and takes profit—and shall he live? He shall not live[a]. He has done all these abominations; he shall surely be put to death[c][b]; his blood shall be upon him.
translation:
  language: fr
  text: Il prête à intérêt et tire un profit[a]. Vivrait-il ? Non, il ne vivra pas. Il a commis toutes ces abominations ; il sera certainement mis à mort[b]. Son sang sera sur lui[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pratique l’usure et tire un gain ». Les deux termes hébreux désignent l’intérêt ou le gain tiré d’un prêt ; dans ce contexte, cette pratique est condamnée.
    reason: lexical_alternative
  - marker: b
    text: Ou « il mourra certainement ». L’expression hébraïque formule avec insistance une sentence de mort.
    reason: alternative_reading
  - marker: c
    text: 'Littéralement, « son sang sera sur lui » : cette expression signifie qu’il porte la responsabilité de sa propre mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּנֶּשֶׁךְ
  choice: à intérêt
  rationale: נֶשֶׁךְ désigne l’intérêt exigé sur un prêt, particulièrement dans des contextes où cette pratique est condamnée. « À intérêt » est clair en français moderne, tandis que « usure » pourrait suggérer seulement un taux excessif.
- source_word: וְתַרְבִּית
  choice: un bénéfice
  rationale: תַּרְבִּית est associé à נֶשֶׁךְ et désigne le gain ou la majoration tirés d’un prêt. « Bénéfice » maintient une légère distinction avec le premier terme.
- source_word: וָחָי לֹא יִחְיֶה
  choice: Vivrait-il ? Non, il ne vivra pas.
  rationale: La formulation conserve la question rhétorique suivie de sa négation catégorique, au lieu de réduire l’ensemble à une simple affirmation.
- source_word: אֵת כָּל הַתּוֹעֵבוֹת הָאֵלֶּה
  choice: toutes ces abominations
  rationale: תּוֹעֵבוֹת exprime une réprobation morale et cultuelle très forte ; « abominations » en préserve la gravité et le registre prophétique.
- source_word: מוֹת יוּמָת
  choice: il sera certainement mis à mort
  rationale: L’infinitif absolu suivi de la forme passive renforce la sentence de mort. Cette formulation conserve à la fois l’emphase et la valeur passive sans préciser qui exécutera la sentence.
- source_word: דָּמָיו בּוֹ יִהְיֶה
  choice: Son sang retombera sur lui
  rationale: Cette expression idiomatique attribue à l’intéressé la responsabilité de sa propre mort. La tournure française conserve l’image du sang tout en restant intelligible.
theological_decisions:
- issue: Nature de la sentence de mort dans la rhétorique juridique prophétique
  choice: « il sera certainement mis à mort »
  alternative: « il mourra certainement »
  rationale: La forme hébraïque passive présente une sentence de mort, mais le verset ne précise ni l’agent ni les modalités de son exécution. La traduction garde cette tension sans imposer une procédure civile ou une causalité exclusivement divine.
translation_notes:
  register: Français international moderne, digne et direct. La formulation conserve la question rhétorique, la gravité du vocabulaire prophétique, la valeur passive de la sentence et l’image traditionnelle du sang, avec des notes pour les nuances lexicales et idiomatiques.
