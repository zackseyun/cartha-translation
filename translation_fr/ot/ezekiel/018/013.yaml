review_pass:
  verdict: revise
  source_fidelity: La structure du verset, la question rhétorique suivie de sa négation, la sentence passive emphatique et l’idiome final sont correctement rendus. « Retombera sur lui » interprète toutefois et dynamise davantage l’idiome hébreu דָּמָיו בּוֹ יִהְיֶה que ne le fait « sera sur lui ».
  naturalness: Le français est globalement naturel et de registre prophétique approprié. « Tire un profit » est plus idiomatique et plus directement lié au gain provenant du prêt que « perçoit un bénéfice ».
  terminology: « À intérêt », « abominations » et « sera certainement mis à mort » sont des choix sûrs. La note sur l’« usure » doit éviter de présenter le caractère abusif comme une composante lexicale nécessaire des deux termes, tout en signalant justement le contexte condamnatoire.
  issues:
  - severity: low
    issue: L’idiome final est légèrement interprété.
    rationale: « Son sang retombera sur lui » évoque un retour de conséquence; l’hébreu dit littéralement que son sang « sera sur lui », formule de responsabilité. Une traduction plus proche, accompagnée de la note, préserve mieux l’image et son ambiguïté.
  - severity: low
    issue: « Perçoit un bénéfice » est moins précis dans ce contexte.
    rationale: Un bénéfice peut provenir de toute activité. « Tire un profit » rend plus naturellement le gain reçu dans le cadre du prêt et maintient la distinction approximative entre les deux termes hébreux.
  - severity: low
    issue: La note a associe trop étroitement les termes à un prêt abusif.
    rationale: Le contexte prophétique condamne la pratique, mais les mots peuvent désigner intérêt et gain de prêt sans impliquer lexicalement, à eux seuls, un abus au sens moderne.
  revised_text: Il prête à intérêt et tire un profit[a]. Vivrait-il ? Non, il ne vivra pas. Il a commis toutes ces abominations ; il sera certainement mis à mort[b]. Son sang sera sur lui[c].
