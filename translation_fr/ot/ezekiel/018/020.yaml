revisions:
- from: La personne qui pèche, c’est elle qui mourra[a]. Un fils ne portera pas la faute de son père, et un père ne portera pas la faute de son fils. La justice du juste reposera sur lui, et la méchanceté du méchant reposera sur lui[b].
  to: La personne qui pèche, c’est elle qui mourra[a]. Un fils ne portera pas la faute de son père, et un père ne portera pas la faute de son fils. La justice du juste sera sur lui, et la méchanceté du méchant sera sur lui[b].
  rationale: La révision se limite à remplacer « reposera sur lui » par « sera sur lui » dans les deux membres finaux et à ajuster la note en conséquence. Elle conserve l’ambiguïté contrôlée de l’expression hébraïque, le parallélisme rhétorique et la portée de responsabilité individuelle, sans imposer une explication doctrinale ou une conséquence pénale précise.
