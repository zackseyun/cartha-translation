source:
  edition: WLC
  text: הַ/נֶּ֥פֶשׁ הַ/חֹטֵ֖את הִ֣יא תָמ֑וּת בֵּ֞ן לֹא יִשָּׂ֣א בַּ/עֲוֺ֣ן הָ/אָ֗ב וְ/אָב֙ לֹ֤א יִשָּׂא֙ בַּ/עֲוֺ֣ן הַ/בֵּ֔ן צִדְקַ֤ת הַ/צַּדִּיק֙ עָלָ֣י/ו תִּֽהְיֶ֔ה וְ/רִשְׁעַ֥ת רשע עָלָ֥י/ו תִּֽהְיֶֽה־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/020.yaml
  text: The person who sins—he shall die[a]. A son shall not bear the iniquity of the father, and a father shall not bear the iniquity of the son. The righteousness of the righteous shall be upon him[b], and the wickedness of the wicked shall be upon him.
translation:
  language: fr
  text: La personne qui pèche, c’est elle qui mourra[a]. Un fils ne portera pas la faute de son père, et un père ne portera pas la faute de son fils. La justice du juste sera sur lui, et la méchanceté du méchant sera sur lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « L’être vivant qui pèche, c’est lui qui mourra. » Ici, le mot hébreu néfèsh désigne la personne elle-même.'
    reason: lexical_alternative
  - marker: b
    text: « Porter la faute » est une expression juridique hébraïque qui peut englober la faute elle-même et la responsabilité qui en découle. De même, ce qui est « sur » quelqu’un lui est personnellement imputé.
    reason: cultural_note
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: la personne
  rationale: Dans ce contexte juridique et moral, נֶפֶשׁ désigne l’individu tout entier plutôt qu’une composante immatérielle appelée « âme ».
- source_word: הַחֹטֵאת
  choice: qui pèche
  rationale: Le participe exprime de manière générale la personne qui commet le péché; cette formulation est naturelle en français moderne.
- source_word: הִיא תָמוּת
  choice: c’est elle qui mourra
  rationale: La reprise emphatique du pronom hébreu est conservée; le féminin français s’accorde naturellement avec « personne », sans préciser le sexe de l’individu.
- source_word: בֵּן / אָב
  choice: un fils / un père
  rationale: La formulation masculine singulière et le parallélisme juridique du texte source sont maintenus.
- source_word: יִשָּׂא בַּעֲוֺן
  choice: portera la faute
  rationale: « Porter la faute » conserve l’image et l’idiome juridique hébreux; « faute » peut désigner ici le tort moral ainsi que la responsabilité qui s’y attache.
- source_word: צִדְקַת הַצַּדִּיק
  choice: la justice du juste
  rationale: Cette expression préserve le lien de racine et la symétrie rhétorique de l’hébreu.
- source_word: וְרִשְׁעַת רָשָׁע
  choice: la méchanceté du méchant
  rationale: La répétition apparentée et son parallélisme avec « la justice du juste » sont conservés.
- source_word: עָלָיו תִּהְיֶה
  choice: reposera sur lui
  rationale: Cette tournure française garde l’image de ce qui demeure attaché personnellement à chacun, tout en étant plus naturelle que le calque « sera sur lui ».
theological_decisions:
- issue: Sens anthropologique de נֶפֶשׁ
  choice: « la personne »
  alternative: « l’âme »
  rationale: Le passage affirme la responsabilité morale individuelle sans exposer une doctrine technique sur la composition de l’être humain.
- issue: Responsabilité morale individuelle
  choice: Conserver l’idiome « porter la faute »
  alternative: « être puni pour » ou « porter la culpabilité »
  rationale: L’hébreu peut englober à la fois la faute et la responsabilité qui en découle; une paraphrase centrée uniquement sur la punition ou le sentiment de culpabilité serait trop étroite.
- issue: Formulation masculine du rapport familial
  choice: « fils » et « père »
  alternative: « enfant » et « parent »
  rationale: Le texte source emploie ces termes masculins dans une maxime juridique réciproque; leur maintien préserve le parallélisme sans ajouter d’exclusion absente du propos.
- issue: Portée de צדקה et רשעה
  choice: « justice » et « méchanceté » reposent sur leur auteur respectif
  alternative: « mérite » et « culpabilité » lui appartiennent
  rationale: La formulation choisie conserve les catégories morales et l’image hébraïque sans imposer une théorie particulière du mérite.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’emphase initiale et le parallélisme juridique. « Faute » a été préféré à « iniquité », devenu peu courant, tandis que les répétitions « justice du juste » et « méchanceté du méchant » gardent la force rhétorique de l’hébreu.
