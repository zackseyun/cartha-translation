review_pass:
  verdict: revise
  source_fidelity: 'Le sens central est fidèlement rendu : la personne qui pèche meurt, et chacun répond de sa propre faute, de sa justice ou de sa méchanceté. « Personne », « fils » et « père », ainsi que « porter la faute », conviennent bien au contexte juridico-prophétique. Toutefois, « reposera sur lui » ajoute une nuance de permanence ou de fixation absente de la formule hébraïque עָלָיו תִּהְיֶה (« sera sur lui »).'
  naturalness: Le français est clair, moderne et d’un registre convenable. La formule plus littérale « sera sur lui » est légèrement solennelle, mais elle est naturelle dans ce parallélisme moral et préserve mieux l’image source que « reposera sur lui ».
  terminology: « La justice du juste » conserve utilement le jeu de mots צדקת הצדיק. « La méchanceté du méchant » garde le parallélisme avec רשעת רשע, même si le terme peut désigner à la fois le mal commis et sa qualité morale. « Porter la faute » maintient adéquatement l’amplitude de l’idiome hébreu, sans la réduire à la seule peine.
