lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans cette formule prophétique, la construction avec היה introduit la venue d’une communication divine. « La parole… me fut adressée » est une formulation française naturelle et consacrée qui exprime cette arrivée sans calquer lourdement « et il arriva ».
- source_word: דְבַר
  choice: La parole
  rationale: Dans la formule דְבַר־יְהוָה, « la parole » désigne une communication divine précise et préserve le vocabulaire prophétique récurrent.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel représenté par le tétragramme, plutôt que de lui substituer un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » rend naturellement en français la direction exprimée par אֵלַי, « vers moi/à moi ».
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'L’infinitif introduit le discours direct qui suit. « En ces termes : » remplit clairement cette fonction en français moderne.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » conserve le nom personnel, tandis que « le SEIGNEUR » reflète la tradition de substitution à la lecture.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation prophétique traditionnelle « La parole de… me fut adressée » reste naturelle ; les deux-points annoncent explicitement le discours du verset suivant.
