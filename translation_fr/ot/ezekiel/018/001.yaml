  text: 'La parole de Yahweh[a] me fut adressée en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu YHWH, traditionnellement rendu par « le SEIGNEUR » dans de nombreuses traductions ; autre translittération possible : « Yahvé ».'
