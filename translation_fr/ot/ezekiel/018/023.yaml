revisions:
- from: Est-ce que je prends le moindre plaisir à la mort du méchant ? — déclaration du Seigneur, l’Éternel[a]. N’est-ce pas plutôt à ce qu’il se détourne de ses voies et qu’il vive[b] ?
  to: Est-ce que je prends le moindre plaisir à la mort du méchant ? — déclaration du Seigneur YHWH[a]. N’est-ce pas plutôt qu’il se détourne de ses voies et qu’il vive[b] ?
  rationale: La révision corrige la syntaxe de la seconde question et rend le titre divin de façon plus directement fidèle à l’hébreu. Elle conserve l’insistance de la première question (« le moindre plaisir »), le singulier générique (« le méchant »), la métaphore des « voies » et l’ambiguïté de la construction finale, signalée par la note.
