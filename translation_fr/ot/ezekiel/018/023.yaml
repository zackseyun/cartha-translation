base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/023.yaml
  text: Do I take any pleasure at all in the death of the wicked? declares the Lord GOD[c][b][a]. Is it not rather in his turning from his ways and living?
translation:
  language: fr
  text: Est-ce que je prends le moindre plaisir à la mort du méchant ? — déclaration du Seigneur YHWH[a]. N’est-ce pas plutôt qu’il se détourne de ses voies et qu’il vive[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « déclaration du Seigneur YHWH » (אַדֹנָי יְהוִה).'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « lorsqu’il se détourne de ses voies et vit ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הֶחָפֹץ אֶחְפֹּץ
  choice: Est-ce que je prends le moindre plaisir
  rationale: L’infinitif absolu joint au verbe conjugué renforce l’idée verbale. « le moindre plaisir » rend naturellement cette insistance dans une question rhétorique, tout en conservant la gamme affective et volitive de חפץ.
- source_word: מוֹת
  choice: à la mort
  rationale: Le nom désigne la mort comme événement ou état. Cette formulation respecte la construction hébraïque et reste naturelle en français.
- source_word: רָשָׁע
  choice: du méchant
  rationale: L’adjectif substantivé désigne ici une personne méchante de façon générique. Le singulier français conserve la valeur représentative du singulier hébreu.
- source_word: נְאֻם
  choice: déclaration
  rationale: Dans cette formule prophétique, le nom marque une parole solennelle et autoritative. « déclaration » permet de conserver la tournure nominale de l’hébreu sans lourdeur excessive.
- source_word: אֲדֹנָי יְהוִה
  choice: du Seigneur, l’Éternel
  rationale: Cette formulation française distingue אֲדֹנָי du nom divin יהוה, évite « Seigneur SEIGNEUR » et suit un usage biblique français largement intelligible.
- source_word: הֲלוֹא
  choice: N’est-ce pas plutôt
  rationale: La particule introduit une question rhétorique appelant une réponse positive. « plutôt » explicite en français le contraste direct avec la première question sans modifier son sens.
- source_word: בְּשׁוּבוֹ
  choice: à ce qu’il se détourne
  rationale: Le ב avec l’infinitif construit peut désigner la circonstance ou l’objet du plaisir. « se détourne » rend le mouvement de retour impliqué par שוב dans ce contexte, sans ajouter explicitement un vocabulaire doctrinal de repentance.
- source_word: מִדְּרָכָיו
  choice: de ses voies
  rationale: « voies » conserve la métaphore biblique de la conduite et représente directement le pluriel hébreu avec son suffixe.
- source_word: וְחָיָה
  choice: et qu’il vive
  rationale: Le parfait consécutif coordonné peut se comprendre comme la vie qui accompagne ou résulte du détour. Le subjonctif s’intègre naturellement à la construction française et laisse ouverte la nuance entre conséquence et finalité.
theological_decisions:
- issue: Disposition de Dieu envers la mort du méchant et envers son changement de conduite
  choice: La formulation nie rhétoriquement que Dieu prenne plaisir à la mort du méchant et lui oppose le fait qu’il se détourne de ses voies et vive.
  alternative: Traduire חפץ plus fortement par « désirer » ou plus affectivement par « trouver sa joie »; comprendre la fin comme « quand il se détourne de ses voies et vit ».
  rationale: « prendre plaisir » maintient le chevauchement entre plaisir, inclination et désir exprimé par חפץ, sans imposer une théorie systématique de la volonté divine. La double question conserve la tension du texte entre jugement et miséricorde.
translation_notes:
  register: Français international moderne, digne et accessible. La structure en deux questions rhétoriques est conservée. « Le méchant » et « ses voies » maintiennent les images et le singulier représentatif du texte hébreu; la ponctuation met en relief la formule prophétique.
