  text: וַ/אֲמַרְתֶּ֕ם מַדֻּ֛עַ לֹא נָשָׂ֥א הַ/בֵּ֖ן בַּ/עֲוֺ֣ן הָ/אָ֑ב וְ/הַ/בֵּ֞ן מִשְׁפָּ֧ט וּ/צְדָקָ֣ה עָשָׂ֗ה אֵ֣ת כָּל חֻקּוֹתַ֥/י שָׁמַ֛ר וַ/יַּעֲשֶׂ֥ה אֹתָ֖/ם חָיֹ֥ה יִחְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/019.yaml
  text: Yet you say[a], ‘Why does the son not bear the iniquity of the father?’ Because the son has done justice and righteousness, has kept all my statutes, and has done them; he shall surely live.
translation:
  language: fr
  text: 'Pourtant, vous dites : « Pourquoi le fils ne porte-t-il pas la faute de son père[a] ? » Car le fils a pratiqué le droit et la justice, observé toutes mes prescriptions et les a mises en pratique ; il vivra assurément.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la culpabilité de son père » ou « la peine due à la faute de son père ». L’expression hébraïque « porter la faute » peut englober à la fois la culpabilité et ses conséquences.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: Pourtant, vous dites
  rationale: Le waw introduit ici l’objection du peuple en contraste avec le principe énoncé précédemment. « Pourtant » rend cette valeur adversative dans un français naturel.
- source_word: לֹא נָשָׂא ... בַּעֲוֺן הָאָב
  choice: ne porte-t-il pas la faute de son père
  rationale: L’expression hébraïque « porter la faute » peut viser la culpabilité aussi bien que ses conséquences. La formulation française conserve cette ambiguïté sans la réduire à la seule peine.
- source_word: מִשְׁפָּט וּצְדָקָה עָשָׂה
  choice: a pratiqué le droit et la justice
  rationale: « Le droit et la justice » préserve le binôme ézékielien, tandis que « pratiquer » exprime naturellement une conduite effective et habituelle.
- source_word: חֻקּוֹתַי שָׁמַר
  choice: observé toutes mes prescriptions
  rationale: Dans ce contexte d’obéissance à Dieu, שמר signifie observer, et חֻקּוֹת désigne des prescriptions établies. Ce vocabulaire est clair et actuel sans perdre la portée juridique et covenantale.
- source_word: וַיַּעֲשֶׂה אֹתָם
  choice: et les a mises en pratique
  rationale: La formulation maintient la distinction entre observer les prescriptions et les accomplir concrètement, tout en évitant le tour peu idiomatique « les faire ».
- source_word: חָיֹה יִחְיֶה
  choice: À coup sûr, il vivra
  rationale: L’infinitif absolu suivi de l’imparfait intensifie l’affirmation. « À coup sûr » restitue avec naturel cette forte certitude.
theological_decisions:
- issue: Sens de « porter la faute de son père »
  choice: Conserver l’expression « porter la faute » sans préciser si elle désigne principalement la culpabilité ou les conséquences de la faute.
  alternative: « subir la peine due à la faute de son père » ou « porter la culpabilité de son père »
  rationale: Le contexte affirme la responsabilité individuelle, mais עָוֺן et l’expression נָשָׂא עָוֺן peuvent englober la faute, la culpabilité et ses conséquences. Une explicitation dans le texte trancherait une ambiguïté réelle de l’hébreu.
- issue: Lien entre la question et la conduite du fils
  choice: C’est que
  alternative: Mais
  rationale: 'Le waw qui introduit la description du fils prend ici une valeur explicative : sa conduite juste explique pourquoi il ne porte pas la faute de son père. « C’est que » rend ce rapport logique sans ajouter une causalité doctrinale étrangère au contexte.'
translation_notes:
  register: Français international moderne, digne et accessible. Le vouvoiement pluriel rend l’adresse collective. Les termes « droit », « justice » et « prescriptions » conservent le registre moral et juridique du passage, tandis que « mises en pratique » communique clairement l’obéissance concrète.
