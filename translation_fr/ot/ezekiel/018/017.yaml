source:
  edition: WLC
  text: מֵ/עָנִ֞י הֵשִׁ֣יב יָד֗/וֹ נֶ֤שֶׁךְ וְ/תַרְבִּית֙ לֹ֣א לָקָ֔ח מִשְׁפָּטַ֣/י עָשָׂ֔ה בְּ/חֻקּוֹתַ֖/י הָלָ֑ךְ ה֗וּא לֹ֥א יָמ֛וּת בַּ/עֲוֺ֥ן אָבִ֖י/ו חָיֹ֥ה יִחְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/017.yaml
  text: He has withheld his hand from the poor[a], has not taken interest or profit, has carried out my judgments, and has walked in my statutes. He will not die for his father's iniquity[c][b]; he will surely live.
translation:
  language: fr
  text: Il s’est abstenu de faire du tort au pauvre[a], il n’a prélevé ni intérêt ni bénéfice[b], il a appliqué mes règles de droit et suivi mes prescriptions. Il ne mourra pas pour la faute de son père[c] ; il vivra assurément.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il a détourné sa main du pauvre ». L’expression évoque le fait de s’abstenir de lui nuire ou de l’exploiter.'
    reason: lexical_alternative
  - marker: b
    text: 'Les deux termes hébreux désignent l’intérêt et le surplus ou gain prélevés sur un prêt ; traditionnellement : « usure et accroissement ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou, plus littéralement : « il ne mourra pas dans la faute de son père ». Dans ce contexte, il ne mourra pas à cause de la faute de son père.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעָנִי הֵשִׁיב יָדוֹ
  choice: Il s’est abstenu de porter la main sur le pauvre
  rationale: Littéralement, il a « ramené sa main loin du pauvre ». En contexte, l’expression décrit le fait de renoncer à lui nuire ou à l’exploiter. La formulation française conserve l’image de la main tout en en rendant clairement le sens.
- source_word: נֶשֶׁךְ
  choice: intérêt
  rationale: Le terme désigne l’intérêt exigé sur un prêt. « Intérêt » est plus exact et actuel que « usure », qui évoque aujourd’hui surtout un taux abusif.
- source_word: תַרְבִּית
  choice: bénéfice
  rationale: Associé à נֶשֶׁךְ, le mot désigne un surplus ou gain tiré d’un prêt. « Bénéfice » maintient une distinction avec l’intérêt tout en exprimant le gain économique.
- source_word: מִשְׁפָּטַי
  choice: mes règles de droit
  rationale: מִשְׁפָּטַי possède une portée juridique. « Règles de droit » rend cette nuance en français moderne sans limiter le sens à des verdicts judiciaires ponctuels.
- source_word: בְּחֻקּוֹתַי הָלָךְ
  choice: suivi mes prescriptions
  rationale: L’hébreu dit littéralement « a marché dans mes prescriptions ». En français courant, « suivre » exprime naturellement cette conduite conforme tout en gardant le registre d’alliance et de loi.
- source_word: בַּעֲוֺן אָבִיו
  choice: pour la faute de son père
  rationale: 'Dans le contexte d’Ézéchiel 18, la préposition indique le motif de la mort : cet homme ne mourra pas à cause de la faute paternelle. « Faute » rend ici à la fois l’acte coupable et la responsabilité qui s’y attache.'
- source_word: חָיֹה יִחְיֶה
  choice: oui, il vivra
  rationale: L’infinitif absolu suivi du verbe conjugué exprime une forte insistance. « Oui, il vivra » reproduit cette emphase avec naturel et dignité.
theological_decisions:
- issue: Responsabilité individuelle et faute du père
  choice: Il ne mourra pas pour la faute de son père
  alternative: Il ne mourra pas dans la faute de son père
  rationale: La formulation principale exprime le rapport causal indiqué par le contexte immédiat, qui oppose la conduite du fils à celle du père. Une note conserve toutefois la construction hébraïque plus littérale et son ambiguïté formelle.
translation_notes:
  register: Français international moderne, digne et accessible. La traduction conserve l’image concrète de la main, maintient les deux termes économiques distincts et rend l’emphase finale sans tournure archaïque.
