source:
  edition: WLC
  text: וַֽ/יְהִי֙ בִּ/שְׁתֵּ֣י עֶשְׂרֵ֣ה שָׁנָ֔ה בִּ/שְׁנֵי עָשָׂ֥ר חֹ֖דֶשׁ בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/001.yaml
  text: And it happened in the twelfth year[a], in the twelfth month, on the first day of the month, that the word of Yahweh came to me, saying,
translation:
  language: fr
  text: 'La douzième année, le douzième mois, le premier jour du mois, la parole de Yahweh[a] me fut adressée :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte YHWH, nom divin traditionnellement rendu par « le SEIGNEUR » dans de nombreuses traductions.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: La douzième année…
  rationale: Le wayyiqtol ouvre ici une formule narrative de datation. En français moderne, il n’est pas nécessaire de traduire séparément par « il arriva » ; l’entrée directe dans la date restitue naturellement sa fonction.
- source_word: בִּשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: La douzième année
  rationale: Formule chronologique ordinale. Le texte hébreu ne précise pas ici explicitement le point de départ de cette datation, qui n’est donc pas ajouté.
- source_word: בִּשְׁנֵי עָשָׂר חֹדֶשׁ
  choice: le douzième mois
  rationale: Équivalent français direct et naturel de l’expression calendaire hébraïque.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: le premier jour du mois
  rationale: Littéralement « au un du mois » ; il s’agit de la formule hébraïque habituelle désignant le premier jour du mois.
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: la parole de Yahweh me fut adressée
  rationale: Cette tournure française naturelle rend la formule prophétique, littéralement « la parole de YHWH fut vers moi », en exprimant la réception d’une révélation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin YHWH, qui préserve le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Le deux-points introduit naturellement en français le discours direct qui commence au verset suivant, sans le calque lourd « en disant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu emploie le nom propre YHWH. « Yahweh » en conserve la fonction et la distinction d’avec le titre אֲדֹנָי, tandis qu’une note signale la tradition de substitution.
translation_notes:
  register: Français international moderne, digne et fluide. La phrase suit l’ordre chronologique naturel du français. Le deux-points annonce la parole du verset suivant.
