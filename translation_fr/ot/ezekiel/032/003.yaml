  naturalness: « Ainsi parle le Seigneur Yahweh » et « Je déploierai mon filet sur toi » sont naturels dans un registre prophétique moderne. « Avec une assemblée de peuples nombreux » est plus fluide que « par le moyen d’un rassemblement de peuples nombreux ». « Ils te feront remonter dans ma senne » restitue clairement le causatif hébreu et fonctionne mieux en français que « ils te remonteront ».
  terminology: « Seigneur Yahweh » distingue adéquatement le titre אדני du nom divin יהוה. « Senne » est un terme français exact et suffisamment accessible dans ce contexte pour rendre le second terme de filet sans effacer la variation lexicale. La note b doit maintenir explicitement cette distinction.
