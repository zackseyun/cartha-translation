base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/003.yaml
  text: 'Thus says the Lord GOD: I will spread my net over you with an assembly of many peoples[b][a], and they will haul you up in my dragnet.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh : Je déploierai mon filet sur toi avec une assemblée de peuples nombreux[a], et ils te feront remonter dans ma senne[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans/avec une assemblée de peuples nombreux ». L’expression peut indiquer que ces peuples sont le moyen par lequel Dieu déploie son filet.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie ici un second terme pour un filet de pêche, différent de celui traduit par « filet » plus tôt dans le verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Le titre composé associe אֲדֹנָי, « Seigneur », au nom divin יהוה. « Yahweh » distingue clairement le nom propre du titre et évite « le Seigneur SEIGNEUR ».
- source_word: וּפָרַשְׂתִּי
  choice: Je déploierai
  rationale: פרשׂ signifie étendre ou déployer. Avec un filet, « déployer » est naturel en français et conserve l’image concrète.
- source_word: רִשְׁתִּי
  choice: mon filet
  rationale: רֶשֶׁת est le terme courant pour un filet; le suffixe possessif est rendu explicitement.
- source_word: בִּקְהַל עַמִּים רַבִּים
  choice: par le moyen d’un rassemblement de peuples nombreux
  rationale: קהל désigne un groupe rassemblé. Dans ce contexte, ב peut indiquer le moyen employé; la formulation française l’explicite tout en signalant en note l’ambiguïté possible. « Peuples » préserve le pluriel עַמִּים.
- source_word: וְהֶעֱלוּךָ
  choice: et ils te remonteront
  rationale: Le hiphil de עלה exprime ici l’action de faire monter ou de tirer hors de l’eau. « Remonteront » convient à la scène de pêche sans ajouter une manière absente du texte.
- source_word: בְּחֶרְמִי
  choice: dans ma senne
  rationale: חֶרֶם désigne ici un filet de pêche distinct de רֶשֶׁת, probablement une senne. Ce choix préserve la variation lexicale de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יהוה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU / le Seigneur, l’Éternel
  rationale: Le texte porte le nom divin יהוה. Le translittérer par « Yahweh » préserve sa fonction de nom propre et distingue celui-ci du titre אֲדֹנָי, sans introduire une interprétation confessionnelle particulière.
- issue: Agent du déploiement et de la remontée du filet
  choice: Dieu déploie le filet par le rassemblement des peuples, puis « ils » remontent la cible
  alternative: Dieu déploie le filet au sein du rassemblement des peuples
  rationale: Le préfixe ב permet plusieurs nuances. Le contexte favorise une valeur instrumentale, mais la note conserve la lecture locative ou circonstancielle; le pluriel verbal וְהֶעֱלוּךָ garde les peuples comme sujet naturel de la seconde action.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe prophétique est conservée, ainsi que la métaphore de pêche et la distinction entre les deux termes hébreux désignant des filets.
