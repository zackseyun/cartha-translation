id: EZK.32.14
reference: Ezekiel 32:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָ֚ז אַשְׁקִ֣יעַ מֵֽימֵי/הֶ֔ם וְ/נַהֲרוֹתָ֖/ם כַּ/שֶּׁ֣מֶן אוֹלִ֑יךְ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/014.yaml
  text: Then I will let their waters settle[a], and I will make their rivers flow like oil[b], declares the Lord GOD.
translation:
  language: fr
  text: Alors je ferai se déposer leurs eaux[a], et je ferai couler leurs fleuves comme de l’huile[b], — déclaration du Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je ferai baisser leurs eaux » ou « je laisserai leurs eaux s’apaiser ». Le verbe hébreu peut exprimer le fait de faire descendre les eaux, de les faire se déposer ou de les rendre calmes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je conduirai leurs fleuves comme de l’huile », c’est-à-dire que je les ferai avancer avec la fluidité tranquille de l’huile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: L’adverbe temporel introduit la conséquence annoncée dans l’oracle; « Alors » est naturel et direct.
- source_word: אַשְׁקִיעַ
  choice: je ferai se déposer
  rationale: Le hifil de שׁקע exprime l’action de faire descendre, s’affaisser ou se déposer. Avec les eaux, cette formulation conserve l’idée causative tout en évoquant leur apaisement après l’agitation.
- source_word: מֵימֵיהֶם
  choice: leurs eaux
  rationale: Le pluriel poétique de l’hébreu est conservé et convient au contexte fluvial.
- source_word: וְנַהֲרוֹתָם
  choice: et leurs fleuves
  rationale: נְהָרוֹת désigne des cours d’eau; « fleuves » convient à l’imagerie égyptienne et à son ampleur.
- source_word: כַּשֶּׁמֶן
  choice: comme de l’huile
  rationale: La comparaison est rendue brièvement, sans préciser « huile d’olive », détail que le texte n’explicite pas.
- source_word: אוֹלִיךְ
  choice: je ferai couler
  rationale: Le hifil de הלך signifie « faire aller ». Appliqué à des fleuves, « faire couler » est idiomatique et préserve la valeur causative.
- source_word: נְאֻם
  choice: déclaration
  rationale: Ce nom appartient à la formule prophétique solennelle; « déclaration de » en conserve la force sans archaïsme excessif.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: « Seigneur » rend אֲדֹנָי, tandis que « Yahweh » représente distinctement le nom divin יהוה et évite le redoublement « Seigneur SEIGNEUR ».
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte associe le titre אֲדֹנָי au nom propre יהוה. Le choix retenu maintient cette distinction au lieu de remplacer le nom divin par un autre titre.
- issue: État ou mouvement des eaux dans אַשְׁקִיעַ
  choice: je ferai se déposer
  alternative: je ferai baisser / je calmerai
  rationale: Le verbe peut évoquer l’enfoncement, la baisse ou la stabilisation des eaux. La traduction retenue préserve cette tension sans réduire l’image à un simple apaisement.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le parallélisme hébreu et les deux causatifs sont conservés. « Fleuves » maintient l’ampleur de l’imagerie liée à l’Égypte; les notes signalent les ambiguïtés réelles sans les trancher artificiellement.
