  text: וְ/הִשְׁקֵיתִ֨י אֶ֧רֶץ צָפָתְ/ךָ֛ מִ/דָּמְ/ךָ֖ אֶל הֶֽ/הָרִ֑ים וַ/אֲפִקִ֖ים יִמָּלְא֥וּ/ן מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/006.yaml
  text: I will drench the land with your flowing blood up to the mountains[c][b][a], and the ravines will be filled with you.
translation:
  language: fr
  text: Je détremperai le pays avec le sang qui coulera de toi, jusqu’aux montagnes[a] ; les ravins[b] se rempliront de toi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque rendue par « le sang qui coulera de toi » est difficile. Autre traduction possible : « Je détremperai le pays de ce qui s’écoule de toi — de ton sang — jusqu’aux montagnes. »'
    reason: lexical_alternative
  - marker: b
    text: Ou « les chenaux » ou « les lits des cours d’eau ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « se rempliront de ce qui vient de toi », ce qui désigne probablement son sang ou ses restes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁקֵיתִי
  choice: Je détremperai
  rationale: Le hifil de שׁקה signifie littéralement « faire boire » ou « arroser ». Dans cette scène de jugement sanglant, « détremper » exprime naturellement la saturation du pays sans donner à l’image une tonalité agricole.
- source_word: אֶרֶץ
  choice: le pays
  rationale: אֶרֶץ peut désigner la terre, le sol ou un pays. Ici, il s’agit du territoire égyptien envisagé comme paysage ; « le pays » convient donc au contexte.
- source_word: צָפָתְךָ מִדָּמְךָ
  choice: du sang qui coulera de toi
  rationale: צָפָתְךָ est une forme rare et difficile, probablement liée à l’idée d’un écoulement ou d’un débordement, tandis que מִדָּמְךָ précise qu’il s’agit du sang. Cette formulation française rend le sens probable sans transformer le terme incertain en détail anatomique trop précis.
- source_word: אֶל הֶהָרִים
  choice: jusqu’aux montagnes
  rationale: אֶל marque ici vraisemblablement l’étendue atteinte par le sang. « Jusqu’aux montagnes » restitue cette portée spatiale.
- source_word: וַאֲפִקִים
  choice: les ravins
  rationale: אֲפִיקִים peut désigner des ravins, des chenaux ou des lits de cours d’eau. « Ravins » offre une image claire du relief tout en restant compatible avec le parallélisme des montagnes.
- source_word: יִמָּלְאוּן מִמֶּךָּ
  choice: se rempliront de toi
  rationale: Le nifal de מלא signifie « être rempli » ou « se remplir ». מִמֶּךָּ est littéralement « de toi » ; la traduction maintient cette adresse directe et saisissante sans préciser dans le texte s’il s’agit du sang ou des restes.
