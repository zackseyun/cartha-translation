source:
  edition: WLC
  text: וְ/נָתַתִּ֥י אֶת בְּשָׂרְ/ךָ֖ עַל הֶֽ/הָרִ֑ים וּ/מִלֵּאתִ֥י הַ/גֵּאָי֖וֹת רָמוּתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/005.yaml
  text: And I will put your flesh on the mountains[a], and I will fill the valleys with your carcass.
translation:
  language: fr
  text: Je mettrai ta chair sur les montagnes et je remplirai les vallées de ta masse imposante[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ton cadavre » ; plus littéralement, « de ta hauteur ». Le terme hébreu est difficile. Dans ce contexte, il évoque vraisemblablement l’immense corps de Pharaon abattu et étendu sur le pays.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Je mettrai
  rationale: Le verbe נתן a ici le sens concret de « mettre, déposer ». Le futur français exprime naturellement l’action divine annoncée dans cet oracle de jugement.
- source_word: בְּשָׂרְךָ
  choice: ta chair
  rationale: בשר désigne littéralement la chair. Cette formulation conserve le caractère physique et violent de l’image sans l’atténuer en « corps ».
- source_word: הֶהָרִים
  choice: les montagnes
  rationale: הרים signifie normalement « montagnes » et forme un parallèle topographique avec les vallées.
- source_word: וּמִלֵּאתִי
  choice: et je remplirai
  rationale: À cette forme, מלא signifie directement « remplir » ; cette traduction restitue clairement l’ampleur de la scène.
- source_word: הַגֵּאָיוֹת
  choice: les vallées
  rationale: גיא peut désigner une vallée ou un ravin. « Vallées » est naturel en français et convient au contraste avec les montagnes.
- source_word: רָמוּתֶךָ
  choice: ta masse imposante
  rationale: Le terme inhabituel est lié à l’idée de hauteur ou d’élévation. « Masse imposante » préserve ce trait lexical tout en permettant de comprendre, dans le contexte, qu’il s’agit du vaste corps abattu de Pharaon, représenté sous les traits du monstre marin.
theological_decisions:
- issue: Représentation violente du jugement
  choice: Conserver l’image concrète de la chair déposée sur les montagnes et du corps abattu remplissant les vallées.
  alternative: Atténuer l’image par « corps » ou « restes ».
  rationale: L’oracle décrit volontairement de manière saisissante l’humiliation et la défaite de Pharaon ; adoucir le vocabulaire réduirait la force du texte.
- issue: Sens de רָמוּתֶךָ
  choice: Préserver dans le texte l’idée de grandeur physique par « masse imposante », avec une note signalant les autres compréhensions possibles.
  alternative: Traduire directement par « cadavre » ou, très littéralement, par « hauteur ».
  rationale: Le mot hébreu est difficile. Le contexte suggère le corps gigantesque et désormais abattu de Pharaon, mais la forme lexicale évoque la hauteur ou l’élévation. La traduction ne doit pas effacer cette ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement correspond à l’adresse directe à Pharaon. L’image prophétique demeure volontairement crue, tandis que la note rend visible l’incertitude lexicale du dernier terme.
