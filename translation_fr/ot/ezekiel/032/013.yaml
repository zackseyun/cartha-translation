revisions:
- from: Je ferai disparaître tout son bétail des abords de ses eaux abondantes[a]. Aucun pied humain ne les troublera plus[b], et les sabots du bétail ne les troubleront plus.
  to: Je détruirai tous ses animaux d’auprès de ses nombreuses eaux[a]. Aucun pied humain ne les rendra plus troubles[b], et les sabots des animaux ne les rendront pas troubles.
  rationale: La révision conserve l’ordre, le parallélisme et le registre de l’original, tout en évitant de limiter « animaux » au bétail domestique et en explicitant le trouble matériel des eaux. Elle ne répète pas dans la dernière proposition l’adverbe « plus », absent de cette proposition en hébreu.
