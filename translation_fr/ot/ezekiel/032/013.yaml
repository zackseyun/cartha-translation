source:
  edition: WLC
  text: וְ/הַֽאֲבַדְתִּי֙ אֶת כָּל בְּהֶמְתָּ֔/הּ מֵ/עַ֖ל מַ֣יִם רַבִּ֑ים וְ/לֹ֨א תִדְלָחֵ֤/ם רֶֽגֶל אָדָם֙ ע֔וֹד וּ/פַרְס֥וֹת בְּהֵמָ֖ה לֹ֥א תִדְלָחֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/013.yaml
  text: And I will destroy all its beasts from beside its abundant waters[a], and no human foot will muddy them anymore[b], nor will the hooves of beasts muddy them.
translation:
  language: fr
  text: Je détruirai tous ses animaux d’auprès de ses nombreuses eaux[a]. Aucun pied humain ne les rendra plus troubles[b], et les sabots des animaux ne les rendront pas troubles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de ses eaux abondantes ».'
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu désigne le fait de rendre les eaux troubles ou boueuses par le piétinement.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְהַאֲבַדְתִּי
  choice: Je ferai disparaître
  rationale: Le hifil de אבד exprime ici l’élimination causée par Dieu. « Faire disparaître » rend naturellement la disparition du bétail dans ce contexte de jugement, sans imposer nécessairement la manière dont elle advient.
- source_word: בְּהֶמְתָּהּ
  choice: tout son bétail
  rationale: בְּהֵמָה peut désigner les animaux, particulièrement les grands animaux domestiques. « Bétail » convient aux animaux qui fréquentent les points d’eau et maintient le parallèle avec leurs sabots.
- source_word: מֵעַל מַיִם רַבִּים
  choice: des abords de ses eaux abondantes
  rationale: מֵעַל marque ici l’éloignement depuis la proximité ou la surface des eaux. « Des abords de » est idiomatique en français; מַיִם רַבִּים décrit des eaux nombreuses ou abondantes.
- source_word: תִדְלָחֵם
  choice: ne les troublera plus
  rationale: דלח évoque des eaux rendues troubles par le piétinement. « Troubler » s’applique naturellement à l’eau et conserve une légère largeur sémantique; la note précise l’image concrète.
- source_word: רֶגֶל אָדָם
  choice: aucun pied humain
  rationale: אָדָם est générique et désigne ici l’être humain, non un homme particulier. La tournure négative avec « aucun » est naturelle en français.
- source_word: עוֹד
  choice: plus
  rationale: Dans une proposition négative orientée vers l’avenir, עוֹד signifie « désormais plus » ou « plus jamais »; « ne… plus » exprime sobrement la cessation.
- source_word: וּפַרְסוֹת בְּהֵמָה
  choice: et les sabots du bétail
  rationale: פַּרְסוֹת désigne les sabots, probablement fendus. La répétition de « bétail » préserve le lien lexical avec la première proposition.
theological_decisions:
- issue: Portée générique de אָדָם
  choice: pied humain
  alternative: pied d’un homme
  rationale: Dans cette expression, אָדָם renvoie à l’humanité en général. « Humain » évite de restreindre indûment le sens aux personnes de sexe masculin.
- issue: Nature de la disparition du bétail
  choice: ferai disparaître
  alternative: détruirai
  rationale: Le causatif peut exprimer la destruction, mais aussi le fait de faire périr ou disparaître. La formulation retenue préserve cette latitude tout en restant ferme dans le contexte du jugement.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le parallélisme entre le pied humain et les sabots du bétail est conservé, de même que la répétition du verbe « troubler ».
