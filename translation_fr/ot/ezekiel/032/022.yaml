  text: שָׁ֤ם אַשּׁוּר֙ וְ/כָל קְהָלָ֔/הּ סְבִֽיבוֹתָ֖י/ו קִבְרֹתָ֑י/ו כֻּלָּ֣/ם חֲלָלִ֔ים הַ/נֹּפְלִ֖ים בֶּ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/022.yaml
  text: There is Assyria and all her assembly[a], with his graves all around him; all of them are slain, fallen by the sword.
translation:
  language: fr
  text: Là se trouvent l’Assyrie et toute son assemblée[a], avec ses tombes tout autour de lui ; tous ont été tués, ils sont tombés par l’épée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu change de genre dans la personnification : « l’Assyrie » et « toute son assemblée » sont suivies de suffixes masculins dans « ses tombes » et « autour de lui ». En français, le possessif « ses » ne marque pas le genre du possesseur ; le masculin est donc rendu explicitement par « lui », sans harmoniser la formulation avec le féminin « l’Assyrie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Là se trouvent
  rationale: L’adverbe situe l’Assyrie dans la scène du séjour des morts. La tournure française explicite naturellement la proposition nominale hébraïque sans ajouter l’idée qu’elle serait couchée.
- source_word: אַשּׁוּר
  choice: l’Assyrie
  rationale: Le nom désigne ici l’empire ou la nation personnifiée ; « l’Assyrie » est sa désignation française courante.
- source_word: וְכָל־קְהָלָהּ
  choice: et toute son assemblée
  rationale: קהל désigne un groupe rassemblé. « Assemblée » conserve cette valeur collective sans la limiter explicitement à une armée. En français, « son » convient grammaticalement devant le nom féminin commençant par une voyelle.
- source_word: קִבְרֹתָיו סְבִיבוֹתָיו
  choice: avec ses tombes tout autour de lui
  rationale: « Tombes » rend directement קברות. « Tout autour de lui » restitue la valeur locative et surtout le suffixe masculin hébreu, sans harmoniser silencieusement la personnification avec le féminin « Assyrie ».
- source_word: כֻּלָּם חֲלָלִים
  choice: tous ont été tués
  rationale: חללים désigne ici les victimes d’une mort violente. Cette formulation moderne et sobre exprime clairement leur état, tandis que « tous » reprend l’ensemble du groupe.
- source_word: הַנֹּפְלִים בֶּחָרֶב
  choice: ils sont tombés par l’épée
  rationale: La formulation conserve l’image martiale du participe « tombés » et l’expression prophétique de la mort causée par l’épée.
