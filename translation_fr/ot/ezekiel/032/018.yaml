  text: בֶּן אָדָ֕ם נְהֵ֛ה עַל הֲמ֥וֹן מִצְרַ֖יִם וְ/הוֹרִדֵ֑/הוּ א֠וֹתָ/הּ וּ/בְנ֨וֹת גּוֹיִ֧ם אַדִּרִ֛ם אֶל אֶ֥רֶץ תַּחְתִּיּ֖וֹת אֶת י֥וֹרְדֵי בֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/018.yaml
  text: Son of man[a], wail over the multitude of Egypt, and bring her down, her and the daughters of mighty nations, to the land beneath[c][b], with those who go down to the pit.
translation:
  language: fr
  text: Fils d’homme, lamente-toi sur la multitude de l’Égypte[a] et fais-la descendre, elle et les filles des nations puissantes[b], dans le pays des profondeurs[c], avec ceux qui descendent dans la fosse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la foule tumultueuse de l’Égypte ». Le mot hébreu peut désigner une multitude, une foule ou une masse nombreuse.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « les filles des nations puissantes » : expression imagée désignant vraisemblablement des nations ou des peuples associés à l’Égypte.'
    reason: cultural_note
  - marker: c
    text: Ou « dans les régions inférieures de la terre ». L’hébreu évoque le domaine d’en bas associé aux morts.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Formule d’adresse prophétique caractéristique d’Ézéchiel; cette traduction traditionnelle reste transparente par rapport à l’hébreu et naturelle en français biblique moderne.
- source_word: נְהֵה
  choice: lamente-toi
  rationale: Le verbe exprime une lamentation funèbre, possiblement à voix haute. « Lamente-toi » restitue clairement l’impératif sans ajouter un objet comme « entonne une complainte ».
- source_word: הֲמוֹן מִצְרַיִם
  choice: la multitude de l’Égypte
  rationale: הָמוֹן désigne couramment une multitude, une foule ou une masse nombreuse et parfois tumultueuse. Dans ce contexte de jugement, « multitude » convient mieux que le sens possible de « richesse ».
- source_word: וְהוֹרִדֵהוּ … אוֹתָהּ
  choice: et fais-la descendre
  rationale: Le causatif impératif de ירד signifie « faire descendre ». Le pronom féminin explicite אוֹתָהּ reprend l’Égypte personnifiée; le français emploie donc « la », sans reproduire l’irrégularité de genre du suffixe écrit dans וְהוֹרִדֵהוּ.
- source_word: וּבְנוֹת גּוֹיִם אַדִּרִם
  choice: elle et les filles des nations puissantes
  rationale: « Filles » conserve l’image hébraïque, qui personnifie vraisemblablement des peuples ou nations liés à l’Égypte. אַדִּרִם exprime ici la puissance ou la grandeur.
- source_word: אֶרֶץ תַּחְתִּיּוֹת
  choice: au pays d’en bas
  rationale: L’expression évoque littéralement le pays ou domaine des régions inférieures. « Le pays d’en bas » garde l’image spatiale et funéraire sans imposer une doctrine ultérieure précise de l’au-delà.
- source_word: אֶת יֹרְדֵי בוֹר
  choice: avec ceux qui descendent dans la fosse
  rationale: 'אֶת est compris dans un sens associatif: l’Égypte rejoint ceux qui descendent dans le domaine des morts. La tournure française est claire et conserve le mouvement de descente.'
- source_word: בּוֹר
  choice: la fosse
  rationale: Dans ce contexte funéraire, « fosse » préserve l’image concrète du בּוֹר et son association avec le séjour des morts, sans la réduire explicitement à « la tombe » ni à « l’enfer ».
theological_decisions:
- issue: Nature du domaine des morts évoqué par אֶרֶץ תַּחְתִּיּוֹת et בּוֹר
  choice: Conserver les images « pays d’en bas » et « fosse ».
  alternative: Traduire par « séjour des morts », « Shéol » ou « enfer ».
  rationale: Le texte présente poétiquement la descente au domaine des morts dans un oracle de jugement. Les images concrètes permettent de préserver cette portée sans identifier le lieu à une formulation doctrinale plus tardive ou plus précise.
- issue: Personnification de l’Égypte et des nations
  choice: Employer le féminin pour l’Égypte et conserver « les filles des nations puissantes ».
  alternative: Neutraliser l’image par « l’Égypte et les peuples puissants qui lui sont associés ».
  rationale: La personnification appartient à la rhétorique du texte. La conserver maintient sa force poétique, tandis qu’une note explique l’expression figurée afin d’éviter une lecture littérale inadéquate.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du parallélisme hébreu tout en étant fluide. « Fils d’homme », « pays d’en bas » et « fosse » conservent les images prophétiques sans introduire de terminologie confessionnelle plus précise.
