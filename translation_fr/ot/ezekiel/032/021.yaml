source:
  edition: WLC
  text: יְדַבְּרוּ ל֞/וֹ אֵלֵ֧י גִבּוֹרִ֛ים מִ/תּ֥וֹךְ שְׁא֖וֹל אֶת עֹֽזְרָ֑י/ו יָֽרְד֛וּ שָׁכְב֥וּ הָ/עֲרֵלִ֖ים חַלְלֵי חָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/021.yaml
  text: 'The mighty among the chiefs will speak to him from the midst of Sheol[a], with his helpers: ‘They have gone down; they lie still, the uncircumcised[c][b], slain by the sword.’'
translation:
  language: fr
  text: 'Les plus puissants parmi les guerriers[a] lui parleront du milieu du Shéol[b], avec ses alliés[c] : « Ils sont descendus ; ils gisent là, les incirconcis, tués par l’épée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque est difficile ; on pourrait aussi traduire : « les puissants d’entre les héros » ou « les plus forts des guerriers ».'
    reason: lexical_alternative
  - marker: b
    text: Le Shéol est, dans la Bible hébraïque, le domaine des morts ; son sens ne correspond pas exactement à celui du mot « enfer ».
    reason: cultural_note
  - marker: c
    text: 'Ou : « avec ceux qui l’ont soutenu ». L’hébreu peut désigner ceux qui lui sont associés jusque dans la mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַבְּרוּ לּוֹ
  choice: lui parleront
  rationale: L’imparfait piel situe la parole dans la scène prophétique à venir, et לּוֹ désigne naturellement celui à qui elle est adressée, ici le pharaon.
- source_word: אֵלֵי גִבּוֹרִים
  choice: les plus puissants parmi les guerriers
  rationale: Cette expression difficile désigne vraisemblablement l’élite des guerriers morts. Cette formulation reste proche de la construction hébraïque sans introduire des êtres divins.
- source_word: מִתּוֹךְ שְׁאוֹל
  choice: du milieu du Shéol
  rationale: La traduction conserve l’image spatiale de voix venant de l’intérieur du séjour des morts et maintient le terme hébreu dans sa spécificité.
- source_word: אֶת עֹזְרָיו
  choice: avec ses alliés
  rationale: אֶת est compris dans son emploi associatif, « avec ». « Alliés » rend naturellement ceux qui ont soutenu le pharaon, tout en signalant en note l’alternative plus littérale.
- source_word: יָרְדוּ
  choice: ils sont descendus
  rationale: Le parfait présente comme accompli leur mouvement de descente vers le monde des morts.
- source_word: שָׁכְבוּ
  choice: ils gisent là
  rationale: Dans ce contexte funéraire, שׁכב décrit les morts étendus. « Gisent » exprime clairement cet état, tandis que « là » rend la valeur résultative sans ajouter de notion doctrinale.
- source_word: הָעֲרֵלִים
  choice: les incirconcis
  rationale: Ce terme courant dans Ézéchiel conserve ici ses connotations de honte et d’exclusion associées aux nations vaincues.
- source_word: חַלְלֵי חָרֶב
  choice: tués par l’épée
  rationale: Formulation française naturelle qui restitue l’expression hébraïque désignant ceux qui sont morts sous les coups de l’épée.
theological_decisions:
- issue: Sens de שְׁאוֹל
  choice: Shéol
  alternative: le séjour des morts ; la tombe ; l’enfer
  rationale: Le mot hébreu désigne le domaine des morts sans correspondre exactement ni à une tombe individuelle ni aux conceptions théologiques ultérieures de l’enfer. Le conserver évite de préciser abusivement le texte.
- issue: Identité des אֵלֵי גִבּוֹרִים
  choice: des guerriers humains particulièrement puissants
  alternative: les dieux des guerriers
  rationale: Bien que אֵלֵי puisse être rapproché d’un terme désignant des dieux, le contexte immédiat présente les guerriers et les nations tombés au Shéol. La lecture humaine convient donc mieux, tout en laissant la difficulté lexicale visible dans une note.
- issue: Portée de אֶת עֹזְרָיו
  choice: les puissants parlent avec les alliés du pharaon
  alternative: l’expression pourrait simplement associer les alliés au pharaon dans la mort
  rationale: L’emploi associatif de אֶת soutient « avec », mais le rattachement syntaxique demeure compact et difficile. La note préserve cette incertitude sans la transformer en affirmation théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur maintient la mise en scène prophétique ; « gisent » conserve le ton funéraire. Les termes « Shéol » et « incirconcis » sont gardés pour préserver l’univers conceptuel et la force du texte d’Ézéchiel.
