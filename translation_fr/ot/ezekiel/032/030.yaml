revisions:
- from: Là se trouvent[a] tous les princes du nord, eux tous, et tous les Sidoniens. Ils sont descendus avec les victimes, couverts de honte malgré la terreur qu’inspirait leur puissance[b]. Ils reposent, incirconcis[c], avec ceux que l’épée a tués, et ils portent leur humiliation avec ceux qui descendent dans la fosse.
  to: Là se trouvent[a] tous les princes du nord, eux tous, et tous les Sidoniens, qui sont descendus avec les victimes, eux qui inspiraient la terreur par leur puissance, couverts de honte. Ils gisent, incirconcis[c], avec ceux que l’épée a tués, et ils portent leur humiliation avec ceux qui descendent dans la fosse.[b]
  rationale: La révision retire la concession ajoutée par « malgré », rend de manière claire mais non dogmatique l’idée de la terreur liée à leur puissance, et remplace « reposent » par « gisent » pour préserver le caractère funéraire et déshonorant de la scène. La note culturelle est resserrée afin de ne pas imposer une lecture théologique particulière. L’ancre b est placée en fin de verset, car elle explicite une expression située dans la première phrase ; son contenu identifie sans ambiguïté le segment concerné.
