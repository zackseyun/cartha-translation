  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שָׁ֣מָּ/ה נְסִיכֵ֥י צָפ֛וֹן כֻּלָּ֖/ם וְ/כָל צִֽדֹנִ֑י אֲשֶׁר יָרְד֣וּ אֶת חֲלָלִ֗ים בְּ/חִתִּיתָ֤/ם מִ/גְבֽוּרָתָ/ם֙ בּוֹשִׁ֔ים וַ/יִּשְׁכְּב֤וּ עֲרֵלִים֙ אֶת חַלְלֵי חֶ֔רֶב וַ/יִּשְׂא֥וּ כְלִמָּתָ֖/ם אֶת י֥וֹרְדֵי בֽוֹר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/030.yaml
  text: There are all the princes of the north[a], all of them, and all the Sidonians, who went down with the slain in the terror they caused by their might, ashamed. They lie uncircumcised with those slain by the sword[c][b], and they bear their disgrace with those who go down to the pit.
translation:
  language: fr
  text: Là se trouvent[a] tous les princes du nord, eux tous, et tous les Sidoniens, qui sont descendus avec les victimes, eux qui inspiraient la terreur par leur puissance, couverts de honte. Ils gisent, incirconcis[c], avec ceux que l’épée a tués, et ils portent leur humiliation avec ceux qui descendent dans la fosse.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Là sont tous les princes du nord. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans leur terreur, venant de leur puissance ». La construction évoque la terreur associée à leur puissance, vraisemblablement celle qu’ils inspiraient par leur force militaire.'
    reason: lexical_alternative
  - marker: c
    text: « Incirconcis » est conservé comme terme littéral d’opprobre dans le langage de jugement d’Ézéchiel.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמָּה
  choice: Là se trouvent
  rationale: L’adverbe désigne le séjour des morts évoqué dans le contexte. « Là se trouvent » restitue naturellement en français la valeur présentative de l’hébreu.
- source_word: נְסִיכֵי צָפוֹן
  choice: les princes du nord
  rationale: נְסִיךְ désigne des princes ou dirigeants. « Princes » conserve la portée politique et le registre élevé sans préciser indûment leur statut monarchique.
- source_word: כֻּלָּם
  choice: eux tous
  rationale: Cette reprise, un peu insistante, maintient l’accent explicite de l’hébreu sur la totalité.
- source_word: וְכָל צִדֹנִי
  choice: et tous les Sidoniens
  rationale: Le gentilé singulier a ici un sens collectif. Le pluriel français désigne naturellement l’ensemble de ce peuple.
- source_word: יָרְדוּ אֶת חֲלָלִים
  choice: Ils sont descendus avec les victimes
  rationale: 'Dans le refrain du chapitre, la descente désigne l’entrée dans le séjour des morts. אֶת prend ici une valeur associative : ils descendent en compagnie des morts frappés.'
- source_word: בְּחִתִּיתָם מִגְבוּרָתָם
  choice: malgré la terreur qu’inspirait leur puissance
  rationale: La formulation hébraïque, littéralement proche de « dans leur terreur issue de leur puissance », associe leur puissance à la terreur qu’ils inspiraient. « Malgré » explicite le contraste contextuel avec leur honte, tout en signalant en note la construction plus littérale.
- source_word: בּוֹשִׁים
  choice: couverts de honte
  rationale: Le participe décrit leur état humilié dans la mort. Cette expression française est plus idiomatique que le simple adjectif « honteux » dans cette phrase.
- source_word: וַיִּשְׁכְּבוּ
  choice: Ils reposent
  rationale: Dans ce tableau funéraire, le verbe décrit la position durable des morts. Le présent rend cet état, tandis que « reposent » conserve l’image de corps couchés sans suggérer nécessairement une paix bienheureuse.
- source_word: עֲרֵלִים
  choice: incirconcis
  rationale: Le terme concret est conservé, car il fonctionne comme une marque d’opprobre dans le langage de jugement d’Ézéchiel.
- source_word: אֶת חַלְלֵי חֶרֶב
  choice: avec ceux que l’épée a tués
  rationale: La construction est associative. La proposition française exprime clairement la mort violente causée par l’épée.
- source_word: וַיִּשְׂאוּ כְלִמָּתָם
  choice: ils portent leur humiliation
  rationale: « Porter son humiliation » reproduit l’image hébraïque et fait écho à leur honte mentionnée plus tôt.
- source_word: אֶת יֹרְדֵי בוֹר
  choice: avec ceux qui descendent dans la fosse
  rationale: La traduction garde la valeur associative de אֶת et le présent caractéristique qui désigne la catégorie de ceux qui vont au séjour des morts.
theological_decisions:
- issue: Sens d’עֲרֵלִים dans ce contexte de jugement
  choice: incirconcis
  alternative: étrangers à l’alliance
  rationale: Le texte emploie un terme corporel concret qui, chez Ézéchiel, véhicule aussi l’opprobre lié à l’exclusion. Le conserver évite de réduire sa portée à une seule interprétation théologique.
- issue: Valeur temporelle de וַיִּשְׁכְּבוּ dans le catalogue des morts
  choice: 'présent d’état : « Ils reposent »'
  alternative: 'passé narratif : « Ils se sont couchés »'
  rationale: Bien que la forme verbale s’inscrive dans une séquence passée, la vision décrit la disposition actuelle des morts dans la fosse. Le présent français rend mieux cet effet de tableau.
- issue: Rapport entre la terreur, la puissance et la honte
  choice: contraste rendu par « malgré »
  alternative: 'formulation plus littérale : « dans la terreur issue de leur puissance »'
  rationale: La syntaxe hébraïque est serrée et son rapport logique n’est pas entièrement explicite. Le contexte oppose leur ancienne puissance terrifiante à leur honte actuelle ; la note conserve toutefois la formulation plus proche de la surface hébraïque.
translation_notes:
  register: Français international moderne, digne et lisible. La cadence de catalogue funéraire est préservée par des phrases mesurées et par la répétition de « tous ». Les termes « fosse », « humiliation » et « incirconcis » maintiennent le registre solennel et les images propres au texte sans ajouter de terminologie confessionnelle.
