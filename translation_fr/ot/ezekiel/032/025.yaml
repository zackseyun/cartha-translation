source:
  edition: WLC
  text: בְּ/ת֣וֹךְ חֲ֠לָלִים נָתְנ֨וּ מִשְׁכָּ֥ב לָ/הּ֙ בְּ/כָל הֲמוֹנָ֔/הּ סְבִֽיבוֹתָ֖י/ו קִבְרֹתֶ֑/הָ כֻּלָּ֣/ם עֲרֵלִ֣ים חַלְלֵי חֶ֡רֶב כִּֽי נִתַּ֨ן חִתִּיתָ֜/ם בְּ/אֶ֣רֶץ חַיִּ֗ים וַ/יִּשְׂא֤וּ כְלִמָּתָ/ם֙ אֶת י֣וֹרְדֵי ב֔וֹר בְּ/ת֥וֹךְ חֲלָלִ֖ים נִתָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/025.yaml
  text: Among the slain they made a bed for her with all her multitude[a]; her graves are all around her. All of them are uncircumcised, slain by the sword, because their terror was set in the land of the living. So they bore their disgrace with those who go down to the pit[c][b]; she was placed among the slain.
translation:
  language: fr
  text: Parmi les tués, on lui a préparé une couche avec toute sa multitude ; ses tombes sont tout autour de lui[a]. Tous sont incirconcis, tués par l’épée, car leur terreur a été établie dans le pays des vivants[b]. Ils ont porté leur honte avec ceux qui descendent dans la fosse. Il a été placé parmi les tués.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu alterne ici entre des formes féminines et masculines, peut-être en passant du peuple personnifié à son représentant. La traduction conserve les masculins explicites plutôt que d’uniformiser le référent.
    reason: alternative_reading
  - marker: b
    text: 'Autre traduction possible : « car ils avaient répandu la terreur dans le pays des vivants ». L’hébreu dit littéralement : « car leur terreur a été établie dans le pays des vivants ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹךְ חֲלָלִים
  choice: Au milieu de ceux qui ont été tués
  rationale: חֲלָלִים désigne ici des personnes abattues, dans un contexte de guerre et de sépulture. Cette formulation française conserve l’idée de mort violente sans recourir à un terme archaïque.
- source_word: נָתְנוּ מִשְׁכָּב לָהּ
  choice: on lui a préparé une couche
  rationale: La tournure hébraïque signifie littéralement qu’une couche lui a été donnée. « Préparé une couche » garde l’image funéraire tout en étant naturel en français.
- source_word: בְּכָל הֲמוֹנָהּ
  choice: avec toute sa multitude
  rationale: הָמוֹן désigne la masse de ceux qui lui sont associés. « Multitude » est ample, compréhensible et moins interprétatif que « hordes ».
- source_word: סְבִיבוֹתָיו קִבְרֹתֶהָ
  choice: ses tombes sont tout autour de lui
  rationale: 'La formulation suit les suffixes hébreux : « ses tombes » porte un suffixe féminin, tandis que « autour de lui » porte un suffixe masculin. Le français ne rend pas le genre du possessif, mais conserve le masculin explicite du second élément.'
- source_word: כֻּלָּם עֲרֵלִים
  choice: Tous sont incirconcis
  rationale: Le terme concret עֲרֵלִים est conservé, car il participe directement au langage de honte et de jugement du passage.
- source_word: חַלְלֵי חֶרֶב
  choice: tués par l’épée
  rationale: Cette expression française rend clairement la formule hébraïque de mort violente causée par l’épée.
- source_word: כִּי נִתַּן חִתִּיתָם
  choice: car leur terreur avait été établie
  rationale: Le passif de נִתַּן est maintenu plutôt que remplacé dans le texte par l’idée plus explicite qu’ils auraient eux-mêmes répandu la terreur.
- source_word: בְּאֶרֶץ חַיִּים
  choice: dans le pays des vivants
  rationale: Cette expression garde le contraste biblique entre le monde des vivants et la fosse où descendent les morts.
- source_word: וַיִּשְׂאוּ כְלִמָּתָם
  choice: Ils ont ainsi porté leur honte
  rationale: Le verbe נשׂא signifie porter, et כְּלִמָּה exprime ici la honte ou l’opprobre. « Porter leur honte » conserve l’image de façon naturelle.
- source_word: אֶת יֹרְדֵי בוֹר
  choice: avec ceux qui descendent dans la fosse
  rationale: Dans ce contexte, אֶת est compris comme associant le groupe à ceux qui descendent dans le séjour des morts. « Fosse » préserve l’image sans la réduire à une tombe particulière.
- source_word: בְּתוֹךְ חֲלָלִים נִתָּן
  choice: Il a été placé au milieu de ceux qui ont été tués
  rationale: Le verbe final est au masculin singulier. La traduction le rend par « il », sans harmoniser ce masculin avec les suffixes féminins antérieurs.
theological_decisions:
- issue: Maintien de la désignation « incirconcis » dans l’oracle de jugement
  choice: Tous sont incirconcis
  alternative: Tous sont des étrangers impurs
  rationale: Le texte hébreu emploie un terme concret chargé d’une portée d’alliance, de honte et d’exclusion. Le remplacer par une abstraction interprétative effacerait une dimension importante du passage.
- issue: Alternance des genres grammaticaux dans l’imagerie funéraire
  choice: ses tombes sont tout autour de lui … Il a été placé
  alternative: ses tombes sont tout autour d’elle … Elle a été placée
  rationale: L’hébreu passe de suffixes féminins à des formes masculines. La traduction conserve les masculins explicites au lieu d’uniformiser silencieusement le référent, tout en signalant l’alternance par une note.
- issue: Responsabilité liée à la terreur exercée dans le pays des vivants
  choice: leur terreur avait été établie
  alternative: ils avaient répandu la terreur
  rationale: Le passif hébreu ne nomme pas explicitement l’agent. Le texte principal garde cette indétermination ; la formulation active, contextuellement possible, est donnée en note.
translation_notes:
  register: Français international moderne, digne et accessible. L’image de la couche funéraire, la fosse, l’incirconcision et les alternances de genre du texte hébreu sont conservées. Les répétitions de « ceux qui ont été tués » reflètent le motif insistant du verset.
