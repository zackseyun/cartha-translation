  to: Parmi les tués, on lui a préparé une couche avec toute sa multitude ; ses tombes sont tout autour de lui[a]. Tous sont incirconcis, tués par l’épée, car leur terreur a été établie dans le pays des vivants[b]. Ils ont porté leur honte avec ceux qui descendent dans la fosse. Il a été placé parmi les tués.
