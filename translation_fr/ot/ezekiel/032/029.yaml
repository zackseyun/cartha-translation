source:
  edition: WLC
  text: שָׁ֣מָּ/ה אֱד֗וֹם מְלָכֶ֨י/הָ֙ וְ/כָל נְשִׂיאֶ֔י/הָ אֲשֶׁר נִתְּנ֥וּ בִ/גְבוּרָתָ֖/ם אֶת חַלְלֵי חָ֑רֶב הֵ֛מָּה אֶת עֲרֵלִ֥ים יִשְׁכָּ֖בוּ וְ/אֶת יֹ֥רְדֵי בֽוֹר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/029.yaml
  text: There is Edom[a], her kings and all her princes, who were laid among those slain by the sword despite their might[b]. They lie with the uncircumcised and with those who go down to the pit.
translation:
  language: fr
  text: Là se trouvent Édom, ses rois et tous ses princes, qui, avec leur puissance[a], ont été placés parmi ceux que l’épée a tués. Ils sont couchés avec les incirconcis et avec ceux qui descendent dans la fosse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « dans leur puissance ». La préposition hébraïque peut aussi être comprise dans un sens concessif : « malgré leur puissance »; le contexte souligne alors que leur puissance n’a pas empêché leur chute.'
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, « la fosse » est une image du domaine des morts ou de la tombe.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמָּה
  choice: C’est là qu’est
  rationale: Rend naturellement la valeur déictique de l’adverbe dans la scène décrivant le séjour des morts.
- source_word: אֱדוֹם
  choice: Édom
  rationale: Forme française traditionnelle et courante du nom de la nation.
- source_word: מְלָכֶיהָ וְכָל נְשִׂיאֶיהָ
  choice: avec ses rois et tous ses princes
  rationale: Le possessif renvoie à Édom; « princes » conserve le registre politique élevé de נְשִׂיאִים.
- source_word: אֲשֶׁר נִתְּנוּ
  choice: ils ont été placés
  rationale: Le nifal exprime ici un passif; dans ce contexte funèbre, « placés » reste clair sans ajouter explicitement l’idée d’ensevelissement.
- source_word: בִגְבוּרָתָם
  choice: Malgré leur puissance
  rationale: Le contexte souligne l’ironie de puissants chefs désormais comptés parmi les morts, tout en signalant en note les lectures plus littérales possibles de la préposition.
- source_word: אֶת חַלְלֵי חָרֶב
  choice: parmi ceux que l’épée a tués
  rationale: Expression française naturelle qui restitue les victimes d’une mort violente par l’épée.
- source_word: עֲרֵלִים
  choice: les incirconcis
  rationale: Conserve le terme concret, ainsi que ses connotations d’exclusion de l’alliance et de déshonneur dans la rhétorique d’Ézéchiel.
- source_word: יִשְׁכָּבוּ
  choice: sont couchés
  rationale: Le présent descriptif convient à la vision de leur état parmi les morts; « couchés » maintient l’image hébraïque.
- source_word: יֹרְדֵי בוֹר
  choice: ceux qui descendent dans la fosse
  rationale: « Fosse » préserve l’image traditionnelle du domaine des morts sans la réduire au seul tombeau individuel.
theological_decisions:
- issue: Sens des « incirconcis » dans cet oracle de jugement
  choice: Conserver littéralement « les incirconcis ».
  alternative: « les morts déshonorés » ou « les nations »
  rationale: Le terme hébreu porte à la fois des connotations d’alliance et de honte. La traduction littérale préserve cette tension sans imposer une seule explication.
- issue: Valeur de בִגְבוּרָתָם
  choice: 'Lire la formule de manière concessive: « malgré leur puissance ».'
  alternative: « avec leur puissance » ou « dans leur puissance »
  rationale: La chute des chefs d’Édom crée une forte ironie contextuelle, mais la préposition hébraïque n’exprime pas explicitement la concession; la note conserve donc l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les images funèbres d’Ézéchiel et les termes théologiquement chargés sans les paraphraser excessivement.
