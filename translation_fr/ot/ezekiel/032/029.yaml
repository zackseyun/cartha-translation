  source_fidelity: La traduction rend correctement la scène funèbre, les dirigeants d’Édom, les victimes de l’épée, les « incirconcis » et la « fosse ». Toutefois, « Malgré leur puissance » explicite une valeur concessive que la préposition בְּ ne marque pas à elle seule. Le contexte peut créer une ironie concessive, mais la formulation française ne devrait pas la trancher dans le texte principal.
  naturalness: Le français est globalement naturel, moderne et d’un registre approprié. « C’est là qu’est Édom, avec ses rois… » est intelligible; « Là se trouvent Édom, ses rois et tous ses princes » restitue plus directement l’énumération hébraïque et s’enchaîne plus fluidement.
  terminology: « Édom », « princes », « les incirconcis » et « la fosse » sont appropriés et cohérents avec le registre prophétique. « Placés parmi ceux que l’épée a tués » rend convenablement le passif נִתְּנוּ et l’expression « tués par l’épée ».
