source:
  edition: WLC
  text: שָׁ֤ם עֵילָם֙ וְ/כָל הֲמוֹנָ֔/הּ סְבִיב֖וֹת קְבֻרָתָ֑/הּ כֻּלָּ֣/ם חֲלָלִים֩ הַ/נֹּפְלִ֨ים בַּ/חֶ֜רֶב אֲֽשֶׁר יָרְד֥וּ עֲרֵלִ֣ים אֶל אֶ֣רֶץ תַּחְתִּיּ֗וֹת אֲשֶׁ֨ר נָתְנ֤וּ חִתִּיתָ/ם֙ בְּ/אֶ֣רֶץ חַיִּ֔ים וַ/יִּשְׂא֥וּ כְלִמָּתָ֖/ם אֶת י֥וֹרְדֵי בֽוֹר־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/024.yaml
  text: There is Elam and all her multitude[a], all around her grave, all of them slain, fallen by the sword, who went down uncircumcised to the land below, who spread their terror in the land of the living; and they bore their shame with those who go down to the pit.
translation:
  language: fr
  text: Là se trouvent Élam et toute sa multitude, autour de sa tombe. Tous, victimes de guerre, tombés par l’épée, sont descendus incirconcis au pays d’en bas[a], eux qui répandaient la terreur dans le pays des vivants. Ils portent leur honte avec ceux qui descendent dans la fosse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les profondeurs de la terre » ou « au séjour des morts ». L’hébreu parle littéralement du « pays des régions inférieures », image du domaine des morts.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם עֵילָם
  choice: Là se trouve Élam
  rationale: Cette formulation introduit naturellement Élam dans la scène du monde des morts tout en conservant la valeur déictique de שָׁם.
- source_word: וְכָל הֲמוֹנָהּ
  choice: avec toute sa multitude
  rationale: הָמוֹן désigne ici la masse des gens ou des forces rattachées à Élam. « Multitude » reste large et digne sans limiter le sens à une armée.
- source_word: סְבִיבוֹת קְבֻרָתָהּ
  choice: autour de sa tombe
  rationale: Rend directement la disposition spatiale de la multitude autour du lieu de sépulture d’Élam.
- source_word: כֻּלָּם חֲלָלִים הַנֹּפְלִים בַּחֶרֶב
  choice: Tous ont été tués, ils sont tombés par l’épée
  rationale: חֲלָלִים désigne des morts violentes, souvent au combat, tandis que la seconde proposition conserve l’image martiale de la chute par l’épée.
- source_word: יָרְדוּ עֲרֵלִים
  choice: Ils sont descendus incirconcis
  rationale: Le terme עֲרֵלִים est maintenu littéralement, car il porte dans ce contexte une forte nuance de honte et d’exclusion appliquée aux nations.
- source_word: אֶל אֶרֶץ תַּחְתִּיּוֹת
  choice: au pays d’en bas
  rationale: Cette expression française conserve l’imagerie spatiale du domaine inférieur sans imposer une conception systématisée du séjour des morts.
- source_word: נָתְנוּ חִתִּיתָם
  choice: répandaient la terreur
  rationale: Rend idiomatiquement l’expression hébraïque « donner/placer leur terreur », en exprimant son effet parmi les vivants.
- source_word: בְּאֶרֶץ חַיִּים
  choice: dans le pays des vivants
  rationale: Formulation transparente et naturelle pour le monde où vivent les humains.
- source_word: וַיִּשְׂאוּ כְלִמָּתָם
  choice: Ils ont porté leur honte
  rationale: Conserve l’image de porter durablement son déshonneur plutôt que de réduire כְלִמָּה à une simple émotion intérieure.
- source_word: אֶת יֹרְדֵי בוֹר
  choice: avec ceux qui descendent dans la fosse
  rationale: 'Le marqueur אֶת a ici une valeur associative dans le contexte : Élam partage le sort de ceux qui descendent dans la fosse.'
theological_decisions:
- issue: Sens de עֲרֵלִים dans ce contexte de jugement
  choice: incirconcis
  alternative: impurs ; non-initiés
  rationale: Le sens concret est conservé parce que le mot fonctionne chez Ézéchiel comme une désignation chargée de honte pour les nations. Une paraphrase atténuerait la rhétorique prophétique.
- issue: Identification de אֶרֶץ תַּחְתִּיּוֹת
  choice: le pays d’en bas
  alternative: le séjour des morts ; les profondeurs de la terre
  rationale: L’hébreu évoque le domaine situé sous le pays des vivants, mais ne requiert pas ici une doctrine détaillée de l’au-delà. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, clair et digne. Les phrases ont été légèrement segmentées pour la lisibilité sans effacer les reprises ni l’imagerie funéraire du texte hébreu.
