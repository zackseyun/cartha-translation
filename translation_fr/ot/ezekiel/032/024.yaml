  source_fidelity: 'Le projet rend fidèlement les éléments principaux : Élam et sa multitude autour de la tombe, les morts violentes par l’épée, la descente « incirconcis » vers le pays inférieur, la terreur exercée parmi les vivants et la honte partagée avec les descendus dans la fosse. La répétition française « ont été tués, ils sont tombés » affaiblit toutefois le lien appositionnel des deux qualifications hébraïques et segmente inutilement la phrase.'
