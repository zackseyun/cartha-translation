source:
  edition: WLC
  text: וְ/אַתָּ֗ה בְּ/ת֧וֹךְ עֲרֵלִ֛ים תִּשָּׁבַ֥ר וְ/תִשְׁכַּ֖ב אֶת חַלְלֵי חָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/028.yaml
  text: But you[a], in the midst of the uncircumcised, will be broken and will lie with those slain by the sword.
translation:
  language: fr
  text: Mais toi, au milieu des incirconcis, tu seras brisé et tu reposeras avec ceux qui sont tombés sous l’épée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mais toi
  rationale: La conjonction jointe au pronom indépendant introduit une adresse emphatique à Pharaon et marque ici un contraste avec les nations précédemment évoquées.
- source_word: בְּתוֹךְ עֲרֵלִים
  choice: au milieu des incirconcis
  rationale: Cette formulation conserve l’image spatiale solennelle ainsi que le terme corporel et culturel qui, dans ce contexte, exprime l’opprobre dans la mort.
- source_word: תִּשָּׁבַר
  choice: tu seras brisé
  rationale: Le nifal imperfectif de שׁבר exprime la défaite et la ruine subies. « Brisé » reste proche de la forme passive de l’hébreu sans préciser indûment la manière.
- source_word: וְתִשְׁכַּב
  choice: et tu reposeras
  rationale: שׁכב désigne ici le fait d’être étendu dans la mort. « Reposeras » est naturel en français dans un contexte funéraire, sans effacer la suite qui explicite la mort violente.
- source_word: אֶת חַלְלֵי חָרֶב
  choice: avec ceux qui sont tombés sous l’épée
  rationale: Avec שׁכב, אֶת prend ici une valeur d’accompagnement. La tournure française rend clairement le groupe des morts frappés par l’épée tout en conservant l’imagerie du jugement.
theological_decisions:
- issue: Sens de עֲרֵלִים dans la complainte prophétique sur les nations
  choice: Conserver le terme littéral « les incirconcis »
  alternative: les impurs ; les impies ; les païens
  rationale: L’hébreu emploie explicitement le terme corporel associé à la circoncision. Dans Ézéchiel 32, il fonctionne comme une marque d’opprobre parmi les morts. Une traduction littérale préserve cette texture culturelle et théologique sans la remplacer par une catégorie doctrinale plus générale.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme binaire et funèbre est conservé. « Reposeras » est employé dans son sens funéraire, tandis que « tombés sous l’épée » maintient explicitement la violence du jugement.
