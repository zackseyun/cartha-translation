translation:
  language: fr
  text: 'Car voici ce que dit le Seigneur Yahweh : L’épée du roi de Babylone viendra contre toi[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie « viendra » avec « toi » comme complément ; l’expression peut se comprendre comme « viendra vers toi » ou, dans ce contexte de jugement, « viendra contre toi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’affirmation précédente et maintient clairement le lien logique.
- source_word: כֹּה אָמַר
  choice: voici ce que dit
  rationale: Rend naturellement en français moderne la formule prophétique de messager, tout en conservant sa solennité.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: 'Préserve les deux éléments du titre hébreu : אֲדֹנָי, « Seigneur », et le nom divin יהוה, « Yahweh ».'
- source_word: חֶרֶב מֶלֶךְ בָּבֶל
  choice: L’épée du roi de Babylone
  rationale: Reproduit directement la chaîne construite hébraïque et désigne l’instrument militaire précis du jugement.
- source_word: תְּבוֹאֶךָ
  choice: viendra contre toi
  rationale: Dans ce contexte de jugement, la venue de l’épée est hostile ; « contre toi » exprime cette force sans ambiguïté en français naturel.
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: La traduction conserve distinctement le titre אֲדֹנָי et le nom propre יהוה, sans confondre les deux éléments.
- issue: Portée hostile de la venue de l’épée
  choice: viendra contre toi
  alternative: viendra jusqu’à toi
  rationale: Le contexte de jugement donne à la formule une valeur hostile, mais la note signale la formulation plus littérale afin de préserver la nuance de l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La formule prophétique est rendue avec une solennité naturelle, sans tournure inutilement archaïque.
