  text: וְ/כִסֵּיתִ֤י בְ/כַבּֽוֹתְ/ךָ֙ שָׁמַ֔יִם וְ/הִקְדַּרְתִּ֖י אֶת כֹּֽכְבֵי/הֶ֑ם שֶׁ֚מֶשׁ בֶּ/עָנָ֣ן אֲכַסֶּ֔/נּוּ וְ/יָרֵ֖חַ לֹא יָאִ֥יר אוֹרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/007.yaml
  text: When I extinguish you[a], I will cover the heavens and darken their stars; I will cover the sun with a cloud, and the moon will not give its light.
translation:
  language: fr
  text: Quand tu seras éteint[a], je couvrirai les cieux et j’obscurcirai leurs étoiles ; je couvrirai le soleil d’un nuage, et la lune ne donnera pas sa lumière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quand je t’éteindrai ». L’hébreu évoque quelqu’un que l’on éteint comme une lumière, sans nommer explicitement l’agent dans cette expression.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִסֵּיתִי
  choice: je couvrirai
  rationale: Le verbe כסה signifie « couvrir, dissimuler ». Le futur convient à l’enchaînement du discours prophétique.
- source_word: בְכַבּוֹתְךָ
  choice: quand tu seras éteint
  rationale: L’infinitif de כבה avec suffixe de deuxième personne exprime littéralement le fait que le destinataire est éteint. Le passif français préserve l’ambiguïté sur l’agent tout en maintenant l’image d’une lumière que l’on éteint.
- source_word: שָׁמַיִם
  choice: les cieux
  rationale: « Les cieux » conserve la forme plurielle et le registre élevé de cette scène de jugement cosmique.
- source_word: וְהִקְדַּרְתִּי
  choice: et j’obscurcirai
  rationale: La forme causative de קדר signifie rendre sombre ; « obscurcir » est naturel et précis en français.
- source_word: כֹּכְבֵיהֶם
  choice: leurs étoiles
  rationale: Le suffixe pluriel renvoie grammaticalement aux cieux ; « leurs étoiles » le reproduit naturellement.
- source_word: שֶׁמֶשׁ בֶּעָנָן אֲכַסֶּנּוּ
  choice: je couvrirai le soleil d’un nuage
  rationale: La préposition ב peut ici marquer le moyen. Cette formulation française exprime clairement que le nuage voile le soleil.
- source_word: וְיָרֵחַ לֹא יָאִיר אוֹרוֹ
  choice: et la lune ne donnera plus sa lumière
  rationale: La tournure rend la valeur causative de אור. « Ne… plus » exprime idiomatiquement la cessation impliquée par la scène, sans modifier l’image.
theological_decisions:
- issue: Nature du langage cosmique
  choice: Conserver telle quelle l’image de l’obscurcissement des astres lors du jugement.
  alternative: Préciser qu’il s’agit soit d’une catastrophe astronomique littérale, soit uniquement d’une métaphore de la chute politique de l’Égypte.
  rationale: L’hébreu emploie un langage prophétique cosmique sans imposer ici une seule lecture de son rapport aux événements ; la traduction doit préserver cette tension.
- issue: Agent de l’extinction dans בְכַבּוֹתְךָ
  choice: Employer le passif « quand tu seras éteint ».
  alternative: « Quand je t’éteindrai » ou « quand tu t’éteindras ».
  rationale: La construction hébraïque désigne l’extinction du destinataire sans exprimer directement l’agent. Le passif français conserve cette indétermination, tandis que le contexte permet de comprendre le jugement divin.
translation_notes:
  register: Français international moderne, digne et accessible. « Les cieux » maintient le registre prophétique ; le reste de la syntaxe demeure direct et naturel.
