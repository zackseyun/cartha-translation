source:
  edition: WLC
  text: וּ/נְטַשְׁתִּ֣י/ךָ בָ/אָ֔רֶץ עַל פְּנֵ֥י הַ/שָּׂדֶ֖ה אֲטִילֶ֑/ךָ וְ/הִשְׁכַּנְתִּ֤י עָלֶ֨י/ךָ֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וְ/הִשְׂבַּעְתִּ֥י מִמְּ/ךָ֖ חַיַּ֥ת כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/004.yaml
  text: I will cast you onto the land[a]; I will throw you down on the open field, and I will cause every bird of the heavens to settle on you[b], and I will satisfy the beasts of all the earth with you.
translation:
  language: fr
  text: Je te jetterai sur la terre[a], je te précipiterai à la surface du champ. Je ferai se poser sur toi tous les oiseaux du ciel, et je rassasierai de toi[b] les bêtes de toute la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je t’abandonnerai sur la terre ». Le verbe hébreu peut exprimer l’idée de laisser, d’abandonner ou de jeter au loin.
    reason: lexical_alternative
  - marker: b
    text: 'C’est-à-dire : elles se rassasieront en se nourrissant de toi.'
    reason: lexical_clarification
lexical_decisions:
- source_word: וּנְטַשְׁתִּיךָ
  choice: Je t’abandonnerai
  rationale: Le verbe נטשׁ peut signifier laisser, abandonner ou rejeter. « Abandonner » conserve son sens central et convient à l’image du corps livré aux charognards, tandis que le verbe suivant exprime explicitement l’action de jeter.
- source_word: בָאָרֶץ
  choice: sur la terre
  rationale: אֶרֶץ peut désigner la terre ou le pays. Le parallèle avec le champ indique ici le sol terrestre où la victime est exposée.
- source_word: עַל־פְּנֵי הַשָּׂדֶה
  choice: en plein champ
  rationale: Cette formulation française naturelle rend l’exposition à la surface du champ sans reproduire littéralement l’idiome hébreu « sur la face du champ ».
- source_word: אֲטִילֶךָ
  choice: je te jetterai
  rationale: La forme causative de טול exprime le fait de jeter ou de précipiter. « Jeter » garde la force de l’image et évite de surtraduire la direction.
- source_word: וְהִשְׁכַּנְתִּי עָלֶיךָ
  choice: Je ferai se poser sur toi
  rationale: La forme causative de שכן signifie faire demeurer ou s’installer. Pour des oiseaux attirés par une carcasse, « faire se poser » est clair et naturel.
- source_word: כָּל עוֹף הַשָּׁמַיִם
  choice: tous les oiseaux du ciel
  rationale: עוֹף est un collectif désignant les créatures ailées; l’expression française usuelle « oiseaux du ciel » conserve le registre biblique sans archaïsme.
- source_word: וְהִשְׂבַּעְתִּי מִמְּךָ
  choice: je rassasierai de toi
  rationale: Le causatif de שׂבע signifie rassasier, et מִמְּךָ indique la source de cette satiété. La construction volontairement saisissante montre que les animaux se nourriront de la victime.
- source_word: חַיַּת כָּל הָאָרֶץ
  choice: les bêtes de toute la terre
  rationale: חַיָּה désigne ici les animaux sauvages dans une scène de charognage. « Bêtes » maintient la vigueur et le registre prophétique de l’image.
theological_decisions:
- issue: Portée de אֶרֶץ et הָאָרֶץ dans l’oracle de jugement
  choice: Rendre les deux occurrences par « terre », la première dans un cadre local et la seconde dans l’expression ample « toute la terre »
  alternative: Employer « pays » dans l’un ou les deux cas
  rationale: Le champ situe d’abord la scène sur le sol, tandis que la dernière expression élargit rhétoriquement l’image. Le français « terre » préserve cette souplesse sans imposer une portée strictement locale ou universelle.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le rythme cumulatif de l’oracle, tandis que « en plein champ » et « faire se poser » évitent des calques peu naturels. L’image violente et la construction frappante « rassasierai de toi » sont maintenues.
