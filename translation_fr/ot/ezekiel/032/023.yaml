revisions:
- from: Ses tombes ont été placées dans les profondeurs de la fosse[a], et toute son assemblée est autour de sa tombe. Tous ont été tués, abattus par l’épée, eux qui avaient semé la terreur dans le pays des vivants[b].
  to: dont les tombes avaient été placées dans les recoins les plus reculés de la fosse[a], et son assemblée se trouvait autour de sa tombe. Tous, tués, tombés par l’épée, eux qui avaient répandu la terreur dans le pays des vivants[b].
  rationale: La révision restitue la relative initiale, évite l’ajout de « toute », précise l’image des recoins reculés de la fosse et corrige la note b pour qu’elle soit rattachée à l’expression hébraïque pertinente. Le plus-que-parfait français maintient la relation narrative entre la terreur qu’ils avaient répandue parmi les vivants et leur état présent parmi les morts, sans ajouter de sens doctrinal.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:00:18Z'
review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire : « toute son assemblée » ajoute une totalité qui n’est pas exprimée par קְהָלָהּ; la totalité est formulée ensuite par כֻּלָּם. La relative initiale אֲשֶׁר est mieux rendue par « dont ». « Les recoins les plus reculés » rend plus précisément יַרְכְּתֵי que « profondeurs ».'
  naturalness: Le français révisé reste moderne et digne. « Son assemblée se trouvait autour de sa tombe » rend naturellement le verbe narratif וַיְהִי, et la série « tués, tombés par l’épée » conserve le parallélisme descriptif sans redondance interprétative.
  terminology: « Fosse » respecte l’image de בּוֹר sans la remplacer par « séjour des morts ». « Pays des vivants » conserve l’expression idiomatique. La note b doit porter sur l’idiome נָתְנוּ חִתִּית (« répandre/causer la terreur »), et non proposer « sur la terre des vivants », qui ne correspond pas à l’alternative anglaise ni à la décision lexicale.
  issues:
  - severity: medium
    issue: Ajout de « toute » devant « son assemblée »
    rationale: קְהָלָהּ signifie « son assemblée/son groupe »; le quantificateur « tous » apparaît dans la proposition suivante (כֻּלָּם). Ajouter « toute » anticipe et renforce inutilement la totalité.
  - severity: medium
    issue: La note b ne correspond pas à l’ancre ni à l’alternative lexicale
    rationale: L’ancre b suit « la terreur » et doit donner l’alternative pour נָתְנוּ חִתִּית, soit « causer la terreur ». « Sur la terre des vivants » porte sur une autre expression et modifie en outre la préposition.
  - severity: low
    issue: « Dans les profondeurs » atténue la notion de recul extrême
    rationale: יַרְכְּתֵי désigne les parties les plus éloignées ou retirées; « recoins les plus reculés » est plus exact.
  revised_text: dont les tombes avaient été placées dans les recoins les plus reculés de la fosse[a], et son assemblée se trouvait autour de sa tombe. Tous, tués, tombés par l’épée, eux qui avaient répandu la terreur dans le pays des vivants[b].
  revised_footnotes:
