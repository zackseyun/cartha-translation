  text: אֲשֶׁ֨ר נִתְּנ֤וּ קִבְרֹתֶ֨י/הָ֙ בְּ/יַרְכְּתֵי ב֔וֹר וַ/יְהִ֣י קְהָלָ֔/הּ סְבִיב֖וֹת קְבֻרָתָ֑/הּ כֻּלָּ֤/ם חֲלָלִים֙ נֹפְלִ֣ים בַּ/חֶ֔רֶב אֲשֶׁר נָתְנ֥וּ חִתִּ֖ית בְּ/אֶ֥רֶץ חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/023.yaml
  text: whose graves were set in the remotest parts of the pit[a], and her assembly was around her grave—all of them slain, fallen by the sword[b], who spread terror in the land of the living.
translation:
  language: fr
  text: dont les tombes avaient été placées dans les recoins les plus reculés de la fosse[a], et son assemblée se trouvait autour de sa tombe. Tous, tués, tombés par l’épée, eux qui avaient répandu la terreur dans le pays des vivants[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les profondeurs de la fosse ».
    reason: lexical_alternative
  - marker: b
    text: Ou « avaient causé la terreur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נִתְּנוּ
  choice: ont été placées
  rationale: Le passif de נתן indique ici l’emplacement assigné aux tombes, non un don au sens transactionnel.
- source_word: קִבְרֹתֶיהָ
  choice: ses tombes
  rationale: Le suffixe féminin singulier est rendu sans explicitation supplémentaire; en français, « ses » conserve naturellement la référence contextuelle.
- source_word: בְּיַרְכְּתֵי בוֹר
  choice: dans les profondeurs de la fosse
  rationale: יַרְכְּתֵי désigne les parties reculées ou profondes; « fosse » préserve l’image de בוֹר sans l’interpréter comme le shéol.
- source_word: קְהָלָהּ
  choice: toute son assemblée
  rationale: קהל désigne le groupe rassemblé. « Assemblée » garde le sens collectif et le registre solennel; « toute » rend naturellement en français l’ensemble collectif décrit, en accord avec כֻּלָּם qui suit.
- source_word: סְבִיבוֹת קְבֻרָתָהּ
  choice: autour de sa tombe
  rationale: Traduction spatiale directe; « tombe » convient à l’imagerie funéraire du passage.
- source_word: כֻּלָּם חֲלָלִים
  choice: tous ont été tués
  rationale: חֲלָלִים désigne les victimes d’une mort violente, souvent au combat; « tués » conserve cette nuance.
- source_word: נֹפְלִים בַּחֶרֶב
  choice: abattus par l’épée
  rationale: Le participe fonctionne en apposition à חֲלָלִים. « Abattus par l’épée » restitue l’image guerrière sans suggérer une simple chute physique.
- source_word: נָתְנוּ חִתִּית
  choice: avaient semé la terreur
  rationale: L’expression idiomatique signifie infliger ou répandre la terreur. Le plus-que-parfait situe naturellement cette action avant leur présence dans la fosse.
- source_word: בְּאֶרֶץ חַיִּים
  choice: dans le pays des vivants
  rationale: Expression hébraïque conventionnelle opposant le monde des vivants à la fosse; « pays des vivants » en conserve la formulation imagée.
theological_decisions:
- issue: Personnification marquée par les suffixes féminins
  choice: Conserver les possessifs contextuels « ses », « son » et « sa » sans neutraliser ni sur-expliciter la référence
  alternative: Expliciter le référent par un nom féminin répété ou reformuler comme une entité politique neutre
  rationale: L’hébreu emploie des suffixes féminins dans cette description. Les possessifs français maintiennent la continuité de la personnification sans ajouter d’interprétation.
- issue: Imagerie du monde souterrain associée à בוֹר
  choice: Traduire par « fosse »
  alternative: « shéol » ou « séjour des morts »
  rationale: Le texte porte בוֹר et non שְׁאוֹל. « Fosse » respecte l’image concrète et évite de préciser au-delà du terme source.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve le parallélisme funéraire et guerrier de l’hébreu. « Assemblée » maintient un registre collectif solennel; « fosse », « tombe » et « épée » préservent les images concrètes du texte.
