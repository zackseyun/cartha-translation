source:
  edition: WLC
  text: כִּֽי נָתַ֥תִּי אֶת חתית/ו בְּ/אֶ֣רֶץ חַיִּ֑ים וְ/הֻשְׁכַּב֩ בְּ/ת֨וֹךְ עֲרֵלִ֜ים אֶת חַלְלֵי חֶ֗רֶב פַּרְעֹה֙ וְ/כָל הֲמוֹנֹ֔/ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/032.yaml
  text: For I put his terror in the land of the living[a], and he will be laid among the uncircumcised, with those slain by the sword—Pharaoh and all his multitude, declares the Lord GOD.
translation:
  language: fr
  text: 'Car j’ai mis sa terreur dans le pays des vivants[a]. Il sera étendu au milieu des incirconcis, avec ceux qui sont tombés sous l’épée : Pharaon et toute sa multitude. — Déclaration du Seigneur Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon certains témoins anciens : « ma terreur dans le pays des vivants ». Le texte hébreu porte ici « sa terreur ».'
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication du jugement qui précède et conserve naturellement la valeur causale du connecteur.
- source_word: נָתַתִּי
  choice: j’ai répandu
  rationale: Littéralement « j’ai mis/donné » ; avec la terreur comme objet et le pays comme cadre, « répandu » exprime en français naturel sa diffusion sans préciser davantage le moyen.
- source_word: חֲתִיתוֹ
  choice: la terreur qu’il inspirait
  rationale: Le nom désigne la terreur ou l’effroi, et le suffixe masculin singulier signifie « sa ». Cette formulation indique clairement qu’il s’agit de la terreur associée à Pharaon, tout en signalant la variante ancienne en note.
- source_word: בְּאֶרֶץ חַיִּים
  choice: dans le pays des vivants
  rationale: Expression hébraïque désignant le monde des vivants, par opposition au séjour des morts.
- source_word: וְהֻשְׁכַּב
  choice: Il sera couché
  rationale: 'Le hophal de שׁכב a ici un sens passif : Pharaon sera placé parmi les morts. « Sera couché » conserve le motif funéraire du contexte.'
- source_word: בְּתוֹךְ עֲרֵלִים
  choice: au milieu des incirconcis
  rationale: Rend littéralement le terme chargé de honte et de portée identitaire employé par Ézéchiel.
- source_word: אֶת חַלְלֵי חֶרֶב
  choice: avec ceux qui sont tombés sous l’épée
  rationale: אֶת exprime ici l’association ; la tournure française conserve l’image de la mort violente par l’épée.
- source_word: פַּרְעֹה
  choice: Pharaon
  rationale: Forme française usuelle du titre royal égyptien.
- source_word: וְכָל הֲמוֹנוֹ
  choice: et toute sa multitude
  rationale: הָמוֹן désigne une foule ou une masse nombreuse ; « multitude » préserve l’ampleur sans imposer un sens exclusivement militaire.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: נְאֻם est une formule d’oracle prophétique. « Yahweh » représente directement le nom divin, tandis que « Seigneur » rend אֲדֹנָי sans produire le redoublement « Seigneur Seigneur ».
theological_decisions:
- issue: Suffixe de חֲתִיתוֹ et identité de celui qui inspire la terreur
  choice: la terreur qu’il inspirait
  alternative: la terreur que j’inspirais
  rationale: Le texte massorétique porte un suffixe de troisième personne masculin singulier, qui renvoie naturellement à Pharaon. Certains témoins anciens soutiennent toutefois la première personne ; cette variante significative est conservée en note.
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Cette solution distingue אֲדֹנָי, « Seigneur », du nom propre divin יהוה et évite d’effacer ce dernier derrière un titre.
- issue: Portée de עֲרֵלִים
  choice: incirconcis
  alternative: non-circoncis
  rationale: « Incirconcis » conserve le terme biblique et sa charge de honte dans ce tableau des nations au séjour des morts, sans expliciter une doctrine au-delà du texte.
translation_notes:
  register: Français international moderne, digne et lisible. Le verset garde le contraste funéraire entre le pays des vivants et le sort de Pharaon parmi les morts. Le tiret isole l’apposition récapitulative « Pharaon et toute sa multitude » ; la formule finale conserve le registre solennel de l’oracle prophétique.
