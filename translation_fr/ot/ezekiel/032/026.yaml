  text: שָׁ֣ם מֶ֤שֶׁךְ תֻּבַל֙ וְ/כָל הֲמוֹנָ֔/הּ סְבִֽיבוֹתָ֖י/ו קִבְרוֹתֶ֑י/הָ כֻּלָּ֤/ם עֲרֵלִים֙ מְחֻ֣לְלֵי חֶ֔רֶב כִּֽי נָתְנ֥וּ חִתִּיתָ֖/ם בְּ/אֶ֥רֶץ חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/026.yaml
  text: There are Meshech and Tubal[a], and all her multitude; their graves are all around him. All of them are uncircumcised, slain by the sword, because they spread their terror in the land of the living.
translation:
  language: fr
  text: Là sont Méshek et Toubal[a], avec toute leur multitude. Leurs tombes sont tout autour de lui. Tous sont incirconcis, tués par l’épée, car ils ont répandu la terreur dans le pays des vivants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « et toute sa multitude ; autour de lui sont ses tombes », avec un changement de genre dans les suffixes singuliers de ce vers poétique.'
    reason: Préciser l’ambiguïté grammaticale du texte hébreu que la traduction française régularise partiellement.
lexical_decisions:
- source_word: שָׁם
  choice: Là sont
  rationale: Le déictique situe Méshek et Toubal dans le séjour des morts; « Là sont » restitue naturellement la proposition sans verbe tout en gardant sa solennité.
- source_word: מֶשֶׁךְ תֻּבַל
  choice: Méshek et Toubal
  rationale: Noms propres de peuples ou régions, translittérés selon des formes françaises claires et proches de l’hébreu.
- source_word: וְכָל הֲמוֹנָהּ
  choice: avec toute leur multitude
  rationale: הָמוֹן désigne ici l’ensemble nombreux associé à ces peuples, sans imposer un sens exclusivement militaire. Le possessif est harmonisé au pluriel en français.
- source_word: סְבִיבוֹתָיו קִבְרוֹתֶיהָ
  choice: Leurs tombes sont tout autour de lui
  rationale: La formulation conserve le singulier inattendu « lui » tout en régularisant le possessif pour rendre la ligne compréhensible; une note signale les suffixes hébreux fluctuants.
- source_word: כֻּלָּם עֲרֵלִים
  choice: Tous sont incirconcis
  rationale: La traduction littérale maintient le vocabulaire d’opprobre et ses résonances identitaires et alliancielles chez Ézéchiel.
- source_word: מְחֻלְלֵי חֶרֶב
  choice: tués par l’épée
  rationale: Dans cette formule funéraire récurrente, le participe désigne ceux que l’épée a frappés à mort; cette expression est exacte et naturelle en français actuel.
- source_word: כִּי נָתְנוּ חִתִּיתָם
  choice: car ils ont répandu la terreur
  rationale: L’expression idiomatique « donner/mettre leur terreur » indique qu’ils inspiraient et propageaient l’effroi.
- source_word: בְּאֶרֶץ חַיִּים
  choice: dans le pays des vivants
  rationale: Rend l’expression hébraïque consacrée qui oppose le monde de la vie terrestre au séjour des morts.
theological_decisions:
- issue: Maintien du langage d’opprobre lié à la circoncision
  choice: incirconcis
  alternative: souillés; non-initiés
  rationale: Le terme hébreu est explicite et participe au contraste rhétorique d’Ézéchiel; le conserver évite d’effacer ou de réinterpréter sa portée théologique.
- issue: Traitement des changements de genre et de nombre dans les suffixes poétiques
  choice: Régulariser « leur multitude » et « leurs tombes », tout en conservant « autour de lui »
  alternative: Reproduire littéralement « toute sa multitude; autour de lui sont ses tombes » avec des référents de genre différents
  rationale: Ce choix préserve l’étrangeté significative du singulier final sans rendre le français inutilement opaque; la note documente précisément la forme du texte source.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le rythme solennel de l’oracle funèbre; « multitude », « incirconcis » et « pays des vivants » préservent les images et les tensions du texte source.
