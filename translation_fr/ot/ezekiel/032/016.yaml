source:
  edition: WLC
  text: קִינָ֥ה הִיא֙ וְ/ק֣וֹנְנ֔וּ/הָ בְּנ֥וֹת הַ/גּוֹיִ֖ם תְּקוֹנֵ֣נָּה אוֹתָ֑/הּ עַל מִצְרַ֤יִם וְ/עַל כָּל הֲמוֹנָ/הּ֙ תְּקוֹנֵ֣נָּה אוֹתָ֔/הּ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/016.yaml
  text: This is a lamentation[a], and the daughters of the nations will lament over her. They will lament over Egypt and over all her multitude[b], declares the Lord GOD.
translation:
  language: fr
  text: C’est une complainte[a], et les filles des nations la chanteront. Elles l’entonneront pour l’Égypte et pour toute sa multitude, — déclaration du Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chant funèbre » ; le mot hébreu désigne une lamentation, notamment un chant de deuil.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִינָה
  choice: complainte
  rationale: Le terme désigne un chant de deuil ou une lamentation funèbre. « Complainte » garde ici à la fois l’idée d’un texte chanté et le registre solennel.
- source_word: וְקוֹנְנוּהָ / תְּקוֹנֵנָּה אוֹתָהּ
  choice: la chanteront
  rationale: Le verbe קונן signifie entonner ou prononcer une complainte. Le pronom féminin renvoie le plus naturellement à la complainte elle-même; cette reprise est conservée plutôt que transformée en lamentation sur une personne.
- source_word: בְּנוֹת הַגּוֹיִם
  choice: les filles des nations
  rationale: Traduction formelle de l’expression hébraïque, qui peut désigner les femmes des nations, notamment comme pleureuses. L’image familiale est préservée.
- source_word: עַל מִצְרַיִם
  choice: sur l’Égypte
  rationale: Dans ce contexte funèbre, עַל introduit le sujet ou l’objet de la complainte. « Sur » permet aussi de maintenir le lien syntaxique avec le chant.
- source_word: כָּל הֲמוֹנָהּ
  choice: toute sa multitude
  rationale: הָמוֹן peut évoquer la masse de la population, une foule ou une troupe. « Multitude » conserve cette amplitude sans réduire le sens à l’armée ou aux richesses.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: La formule prophétique est rendue avec solennité; « Yahweh » représente explicitement le nom divin יהוה et évite l’enchaînement ambigu « Seigneur, le Seigneur ».
theological_decisions:
- issue: Rendu du nom divin יהוה après אֲדֹנָי
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte le nom propre יהוה. Le rendre par « Yahweh » préserve sa fonction de nom divin, tandis que « Seigneur » traduit אֲדֹנָי; aucune interprétation confessionnelle supplémentaire n’est ajoutée.
- issue: Référent du suffixe féminin dans וְקוֹנְנוּהָ et אוֹתָהּ
  choice: la complainte
  alternative: l’Égypte personnifiée
  rationale: Le féminin singulier le plus proche est קִינָה, « complainte », et la construction signifie naturellement chanter ou entonner celle-ci. La suite précise qu’elle porte sur l’Égypte, ce qui distingue le chant de son objet.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition de « la chanteront » reproduit la structure insistante de l’hébreu. « Filles des nations » conserve l’image originale sans décider explicitement s’il s’agit de pleureuses professionnelles.
