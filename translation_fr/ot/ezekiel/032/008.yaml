source:
  edition: WLC
  text: כָּל מְא֤וֹרֵי אוֹר֙ בַּ/שָּׁמַ֔יִם אַקְדִּירֵ֖/ם עָלֶ֑י/ךָ וְ/נָתַ֤תִּי חֹ֨שֶׁךְ֙ עַֽל אַרְצְ/ךָ֔ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/008.yaml
  text: All the lights of light in the heavens I will darken over you[a], and I will put darkness over your land, declares the Lord GOD.
translation:
  language: fr
  text: Tous les luminaires du ciel, je les obscurcirai au-dessus de toi[a], et je mettrai les ténèbres sur ton pays — déclaration du Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tous les luminaires de lumière dans le ciel » ; cette expression désigne les corps célestes qui donnent de la lumière.'
    reason: La note conserve la formulation hébraïque marquée et précise le référent de מְאוֹרֵי אוֹר.
lexical_decisions:
- source_word: כָּל מְאוֹרֵי אוֹר
  choice: Tous les luminaires
  rationale: Le syntagme construit signifie littéralement « tous les luminaires de lumière ». « Tous les luminaires » exprime naturellement en français les corps célestes qui donnent de la lumière; la note conserve la forme hébraïque inhabituelle.
- source_word: בַּשָּׁמַיִם
  choice: du ciel
  rationale: Dans ce contexte cosmique, le français idiomatique « les luminaires du ciel » rend leur emplacement sans reproduire artificiellement le pluriel morphologique hébreu.
- source_word: אַקְדִּירֵם
  choice: je les obscurcirai
  rationale: 'Le hifil de קדר a ici une valeur causative : Yahweh fera devenir obscurs les luminaires.'
- source_word: עָלֶיךָ
  choice: au-dessus de toi
  rationale: Cette traduction préserve l'image spatiale de lumières célestes obscurcies au-dessus du destinataire, plutôt que de donner à עַל un sens hostile plus interprétatif.
- source_word: וְנָתַתִּי חֹשֶׁךְ
  choice: et je répandrai les ténèbres
  rationale: נתן signifie fondamentalement « donner, mettre ». Avec les ténèbres sur un pays, « répandre » produit une formulation française naturelle tout en conservant l'action concrète exercée par Dieu.
- source_word: עַל אַרְצְךָ
  choice: sur ton pays
  rationale: אֶרֶץ désigne ici le territoire du destinataire, et non la terre entière.
- source_word: נְאֻם
  choice: déclaration de
  rationale: Cette formule nominale solennelle reflète de près la formule prophétique hébraïque, sans la transformer en simple verbe de parole.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: « Seigneur » rend אֲדֹנָי et « Yahweh » représente distinctement le nom divin יהוה, évitant le redoublement « Seigneur SEIGNEUR ».
theological_decisions:
- issue: Représentation du nom divin יהוה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte à la fois le titre אֲדֹנָי et le nom propre יהוה. Les rendre distinctement préserve les deux éléments sans importer une interprétation confessionnelle.
- issue: Portée de l'obscurcissement cosmique
  choice: au-dessus de toi
  alternative: contre toi
  rationale: La traduction retient l'image spatiale explicite et laisse ouverte la relation exacte entre le jugement céleste, le destinataire et son pays.
translation_notes:
  register: Français international moderne, digne et prophétique. La dislocation « Tous les luminaires du ciel, je les obscurcirai » conserve la mise en relief initiale de l'hébreu. Le tiret introduit naturellement la formule solennelle finale.
