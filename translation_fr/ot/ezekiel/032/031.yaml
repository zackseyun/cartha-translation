- from: Le pharaon les verra et trouvera une consolation[a] au sujet de toute sa multitude — le pharaon et toute son armée, tombés sous l’épée —, déclare le Seigneur Yahweh.
  to: Pharaon les verra et trouvera du réconfort[a] au sujet de toute sa multitude — Pharaon et toute son armée, tués par l’épée —, déclare le Seigneur Yahweh.
  rationale: La révision explicite la mort violente exprimée par « tués par l’épée », améliore légèrement l’idiomaticité de la formulation de la consolation et corrige une alternative de note trop éloignée du sens contextuel. Elle conserve l’ambiguïté lexicale signalée par la note, la répétition rhétorique de Pharaon, le registre prophétique et le rendu du nom divin.
