  source_fidelity: 'Le sens général est fidèle : Pharaon voit les autres peuples déjà évoqués et éprouve une consolation funeste au sujet de sa propre multitude. Toutefois, « tombés sous l’épée » atténue l’expression hébraïque חַלְלֵי חֶרֶב, qui désigne explicitement des personnes tuées par l’épée.'
  naturalness: « Trouvera une consolation au sujet de » est compréhensible mais un peu lourd. « Trouvera du réconfort au sujet de » est plus idiomatique en français moderne tout en conservant la relation exprimée par עַל. La répétition de « Pharaon » est conservée, car elle appartient à la formulation hébraïque.
