source:
  edition: WLC
  text: אוֹתָ/ם֙ יִרְאֶ֣ה פַרְעֹ֔ה וְ/נִחַ֖ם עַל כָּל המונ/ה חַלְלֵי חֶ֨רֶב֙ פַּרְעֹ֣ה וְ/כָל חֵיל֔/וֹ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/031.yaml
  text: Pharaoh will see them and be comforted over all his multitude[a], Pharaoh and all his army, slain by the sword, declares the Lord GOD.
translation:
  language: fr
  text: Pharaon les verra et trouvera du réconfort[a] au sujet de toute sa multitude — Pharaon et toute son armée, tués par l’épée —, déclare le Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sera consolé » ou « trouvera une consolation ». Dans d’autres contextes, le verbe hébreu peut aussi signifier « regretter » ou « renoncer », mais ici Pharaon semble trouver un sombre réconfort en voyant que d’autres partagent sa chute.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹתָם
  choice: les
  rationale: Le pronom objet pluriel renvoie aux peuples et à leurs chefs décrits précédemment dans le séjour des morts.
- source_word: יִרְאֶה
  choice: verra
  rationale: L’imparfait hébreu a ici une valeur future dans le discours prophétique.
- source_word: וְנִחַם
  choice: et trouvera une consolation
  rationale: Dans ce contexte, le verbe exprime vraisemblablement la sombre consolation que le pharaon éprouve en voyant d’autres partager sa chute. Cette formulation est plus naturelle en français moderne que « sera consolé » tout en préservant l’ironie du passage.
- source_word: עַל כָּל המונה
  choice: au sujet de toute sa multitude
  rationale: עַל indique ici ce à propos de quoi le pharaon trouve une consolation. הָמוֹן désigne la masse de ses gens ou de ses forces, rendue largement par « multitude ».
- source_word: חַלְלֵי חֶרֶב
  choice: tombés sous l’épée
  rationale: Expression idiomatique désignant ceux qui ont péri de mort violente, notamment au combat; le pluriel « tombés » se rapporte au pharaon et à toute son armée.
- source_word: פַּרְעֹה וְכָל חֵילוֹ
  choice: le pharaon et toute son armée
  rationale: חַיִל désigne ici la force militaire du pharaon; « armée » est clair et naturel.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclare le Seigneur Yahweh
  rationale: נְאֻם introduit une déclaration prophétique solennelle. Le nom divin יהוה est translittéré « Yahweh », tandis qu’אֲדֹנָי est rendu par « le Seigneur ».
theological_decisions:
- issue: Rendu du nom divin יהוה dans la formule אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom divin sans confondre אֲדֹנָי et יהוה.
- issue: Nature de la consolation du pharaon
  choice: trouvera une consolation
  alternative: regrettera / se repentira
  rationale: Le contexte du séjour des morts favorise l’idée d’une consolation sinistre devant le sort commun des autres nations. Une note conserve toutefois la gamme sémantique du verbe.
translation_notes:
  register: Français international moderne, digne et accessible. Les tirets mettent en relief l’apposition « le pharaon et toute son armée » et rattachent clairement « tombés sous l’épée » à cet ensemble. Le marqueur [a] figure dans le texte.
