source:
  edition: WLC
  text: וְ/לֹ֤א יִשְׁכְּבוּ֙ אֶת גִּבּוֹרִ֔ים נֹפְלִ֖ים מֵ/עֲרֵלִ֑ים אֲשֶׁ֣ר יָרְדֽוּ שְׁא֣וֹל בִּ/כְלֵֽי מִלְחַמְתָּ/ם֩ וַ/יִּתְּנ֨וּ אֶת חַרְבוֹתָ֜/ם תַּ֣חַת רָאשֵׁי/הֶ֗ם וַ/תְּהִ֤י עֲוֺֽנֹתָ/ם֙ עַל עַצְמוֹתָ֔/ם כִּֽי חִתִּ֥ית גִּבּוֹרִ֖ים בְּ/אֶ֥רֶץ חַיִּֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/027.yaml
  text: And they do not lie with the mighty, the fallen from among the uncircumcised[a], who went down to Sheol with their weapons of war, whose swords were placed under their heads, and whose iniquities were upon their bones[e][d][c][b]; for the terror of the mighty was in the land of the living.
translation:
  language: fr
  text: Ils ne reposent pas[a] avec les héros, ceux qui sont tombés d’entre les incirconcis[b], qui sont descendus au séjour des morts[c] avec leurs armes de guerre. Ils ont placé leurs épées sous leur tête, et leurs fautes étaient sur leurs os[d], car la terreur des héros était dans le pays des vivants[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Ils ne reposeront pas » : dans cette complainte, la forme verbale hébraïque peut avoir une nuance future.'
    reason: lexical_alternative
  - marker: b
    text: Ou « avec les héros tombés d’entre les incirconcis ». La construction hébraïque est difficile, et « héros » peut être rattaché plus étroitement à « tombés ».
    reason: alternative_reading
  - marker: c
    text: 'Littéralement « au Shéol », c’est-à-dire au séjour des morts; autres traductions possibles : « dans la tombe » ou « dans le monde souterrain ».'
    reason: lexical_alternative
  - marker: d
    text: Le mot traduit par « fautes » peut aussi désigner leur culpabilité ou le châtiment de leurs fautes.
    reason: lexical_alternative
  - marker: e
    text: 'La dernière proposition est difficile en hébreu. Autres traductions possibles : « car ils répandaient la terreur comme des héros dans le pays des vivants » ou « car ils étaient la terreur des héros dans le pays des vivants ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא יִשְׁכְּבוּ
  choice: Ils ne sont pas couchés
  rationale: Dans ce contexte funéraire, שׁכב décrit le fait d’être couché dans la mort ou la sépulture. Le présent convient à la description vive de la complainte, tout en signalant en note la possible nuance future.
- source_word: אֶת גִּבּוֹרִים
  choice: avec les héros
  rationale: Dans cette construction difficile, אֶת est compris comme marquant l’association. « Héros » rend גִּבּוֹרִים sans limiter indûment le terme à une catégorie militaire précise.
- source_word: נֹפְלִים מֵעֲרֵלִים
  choice: ceux qui sont tombés parmi les incirconcis
  rationale: Le participe נֹפְלִים est substantivé, et מִן est compris dans un sens partitif. « Incirconcis » conserve la catégorie récurrente et chargée de sens dans ce chapitre.
- source_word: שְׁאוֹל
  choice: le séjour des morts
  rationale: Cette expression française courante désigne le domaine des morts sans le réduire à une tombe individuelle ni l’assimiler à la notion ultérieure de l’enfer. La note indique le nom hébreu Shéol.
- source_word: בִּכְלֵי מִלְחַמְתָּם
  choice: avec leurs armes de guerre
  rationale: כְּלֵי מִלְחָמָה désigne l’équipement militaire; cette formulation naturelle conserve l’image guerrière.
- source_word: וַיִּתְּנוּ אֶת חַרְבוֹתָם תַּחַת רָאשֵׁיהֶם
  choice: on avait placé leurs épées sous leur tête
  rationale: Le tour impersonnel français évite de préciser qui a accompli le geste funéraire, ce que l’hébreu n’explicite pas clairement. Le singulier distributif « leur tête » restitue naturellement l’image de chaque guerrier.
- source_word: וַתְּהִי עֲוֺנֹתָם עַל עַצְמוֹתָם
  choice: leurs fautes pesaient sur leurs os
  rationale: « Fautes » maintient le sens moral de עָוֹן, tandis que « pesaient sur » rend en français l’image de ce qui demeure « sur » les os. La note préserve les nuances possibles de culpabilité et de châtiment.
- source_word: כִּי חִתִּית גִּבּוֹרִים
  choice: car la terreur des héros
  rationale: La construction elliptique est conservée sans décider si le génitif désigne principalement la terreur inspirée par les héros ou la terreur qui les atteint.
- source_word: בְּאֶרֶץ חַיִּים
  choice: était dans le pays des vivants
  rationale: L’expression désigne le monde des vivants, par contraste avec le séjour des morts; le verbe « était » est suppléé pour former une phrase française complète.
theological_decisions:
- issue: Sens de עָוֹן dans un contexte de jugement
  choice: Conserver « fautes » dans le texte et mentionner en note les nuances de culpabilité et de châtiment.
  alternative: « culpabilité » ou « châtiment de leurs fautes »
  rationale: Le mot hébreu peut réunir l’acte mauvais, la culpabilité qui en découle et sa sanction. La traduction ne tranche donc pas artificiellement cette tension.
- issue: Rapport entre les héros et la terreur dans la dernière proposition
  choice: « la terreur des héros »
  alternative: « ils répandaient la terreur comme des héros » ou « ils étaient la terreur des héros »
  rationale: L’hébreu est elliptique et difficile. La formulation retenue préserve l’ambiguïté du rapport génitif au lieu d’imposer une interprétation causative ou objective.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement lissée pour rester naturelle, mais les images funéraires et guerrières ainsi que les ambiguïtés du texte hébreu sont conservées. « Séjour des morts » est plus immédiatement intelligible que la simple translittération « Shéol », laquelle figure en note.
