revisions:
- from: Ils ne sont pas couchés[a] avec les héros, ceux qui sont tombés parmi les incirconcis[b]. Ils étaient descendus au séjour des morts[c] avec leurs armes de guerre; on avait placé leurs épées sous leur tête, et leurs fautes pesaient sur leurs os[d], car la terreur des héros était dans le pays des vivants[e].
  to: Ils ne reposent pas[a] avec les héros, ceux qui sont tombés d’entre les incirconcis[b], qui sont descendus au séjour des morts[c] avec leurs armes de guerre. Ils ont placé leurs épées sous leur tête, et leurs fautes étaient sur leurs os[d], car la terreur des héros était dans le pays des vivants[e].
  rationale: La révision rétablit l’action active des morts guerriers, évite l’interprétation ajoutée par « pesaient », et rend explicitement le sens partitif de מִן. Elle conserve les ambiguïtés syntaxiques et sémantiques signalées par les notes, sans trancher le sens de עָוֹן ni celui de la proposition finale difficile.
