  - severity: medium
    issue: « leurs fautes pesaient sur leurs os »
    rationale: L’hébreu dit littéralement que leurs עֲוֹנוֹת « étaient sur » leurs os. « Peser » interprète et amplifie l’image; « étaient sur » préserve mieux l’ambiguïté entre faute, culpabilité et châtiment.
