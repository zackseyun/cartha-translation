  source_fidelity: La traduction conserve bien les images essentielles (mort, armes, épées, os, pays des vivants) et les notes signalent les principales ambiguïtés. Toutefois, « on avait placé » efface sans nécessité le verbe hébreu actif et introduit un agent indéterminé; « pesaient sur » ajoute une image absente du texte. « Tombés parmi les incirconcis » est aussi moins précis que le partitif « d’entre les incirconcis ».
  naturalness: Le registre est globalement digne et accessible. « Ils ne sont pas couchés » est possible, mais « ils ne reposent pas » est plus idiomatique en français dans une scène funéraire tout en gardant le contraste avec la sépulture honorifique. La phrase révisée reste volontairement dense et poétique, comme l’hébreu.
  terminology: « Héros », « incirconcis », « séjour des morts », « armes de guerre » et « pays des vivants » conviennent. « Fautes » peut rendre עָוֹן si la note maintient explicitement les valeurs de culpabilité et de châtiment; il importe de ne pas lui ajouter le sens figuré de poids.
