  source_fidelity: La reformulation « je ferai connaître ta ruine » ajoute l’idée de divulgation, qui n’est pas exprimée par הֲבִיאִי (« apporter / faire venir »). Le texte révisé conserve l’image et la syntaxe de mouvement, sans trancher plus que nécessaire la manière dont la ruine est portée parmi les nations et vers des pays étrangers.
  naturalness: « Je troublerai le cœur de nombreux peuples » est compréhensible et convient au registre prophétique, mais le pluriel distributif « les cœurs de nombreux peuples » est plus naturel en français moderne tout en rendant correctement le singulier collectif hébreu. « Quand j’apporterai » est idiomatique et plus fidèle que « quand je ferai connaître ».
  terminology: « Peuples » puis « nations » préserve utilement la distinction entre עַמִּים et גּוֹיִם. « Ruine » rend bien שֶׁבֶר sans imposer « destruction ». La note sur le verbe « troubler » signale ses nuances possibles; celle sur « ruine » et celle sur la construction de mouvement maintiennent les ambiguïtés pertinentes.
