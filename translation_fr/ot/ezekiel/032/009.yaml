  yaml_path: translation/ot/ezekiel/032/009.yaml
  text: And I will trouble the hearts of many peoples when I bring your ruin among the nations[c][b][a], into lands that you have not known.
translation:
  language: fr
  text: Je troublerai les cœurs de nombreux peuples quand j’apporterai ta ruine parmi les nations, dans des pays que tu n’as pas connus.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « j’irriterai » ou « j’affligerai les cœurs de nombreux peuples ».'
    reason: alternative lexicale pour le hiphil de כעס
  - marker: b
    text: 'Ou : « ta destruction » ou « ton effondrement ». Le terme hébreu évoque une fracture, une ruine ou un désastre.'
    reason: alternative lexicale pour שֶׁבֶר
  - marker: c
    text: 'Littéralement : « quand j’apporterai ta ruine parmi les nations, sur des pays que tu n’as pas connus ». La construction peut évoquer la ruine portée parmi les nations et vers des territoires étrangers.'
    reason: ambiguïté syntaxique et image de mouvement de l’hébreu
lexical_decisions:
- source_word: וְהִכְעַסְתִּי
  choice: Je troublerai
  rationale: Le hiphil de כעס peut exprimer le fait de provoquer la colère, le chagrin ou l’agitation. Avec « le cœur » pour complément, « troubler » préserve cette amplitude sans réduire l’effet à la seule colère.
- source_word: לֵב עַמִּים רַבִּים
  choice: le cœur de nombreux peuples
  rationale: Le singulier collectif de l’hébreu est conservé en français naturel et solennel; « peuples » distingue עַמִּים du terme גּוֹיִם qui suit.
- source_word: בַּהֲבִיאִי שִׁבְרְךָ בַּגּוֹיִם
  choice: lorsque je ferai connaître ta ruine parmi les nations
  rationale: Littéralement, le texte parle d’« apporter » la ruine parmi les nations. En français, « faire connaître » exprime naturellement la manifestation ou la diffusion de cette ruine, tandis que la note conserve la formulation plus concrète.
- source_word: שִׁבְרְךָ
  choice: ta ruine
  rationale: שֶׁבֶר désigne une fracture, un effondrement, un désastre ou une ruine. « Ruine » convient au jugement prononcé contre le pharaon et l’Égypte sans surdéterminer le terme.
- source_word: עַל אֲרָצוֹת אֲשֶׁר לֹא יְדַעְתָּם
  choice: dans des pays que tu n’as pas connus
  rationale: « Pays » rend ici les territoires étrangers, et « que tu n’as pas connus » maintient l’idée d’absence d’expérience ou de familiarité.
theological_decisions:
- issue: Effet émotionnel du jugement sur les peuples
  choice: Dieu troublera intérieurement de nombreux peuples devant la ruine de l’Égypte.
  alternative: Dieu irritera ou affligera le cœur de nombreux peuples.
  rationale: Le champ sémantique de כעס inclut colère, chagrin et agitation. « Troubler » maintient cette tension plutôt que d’imposer une réaction émotionnelle unique.
- issue: Diffusion de la ruine parmi les nations
  choice: La ruine est portée à la connaissance des nations et des pays étrangers.
  alternative: Dieu apporte littéralement la ruine de l’Égypte parmi les nations ou la conduit vers des pays étrangers.
  rationale: La syntaxe peut évoquer soit la manifestation internationale de la catastrophe, soit son transport vers des terres étrangères. Le texte principal privilégie une expression française intelligible, et la note signale la formulation littérale.
translation_notes:
  register: Français international moderne, digne et accessible. Le singulier collectif « le cœur de nombreux peuples » garde la forme hébraïque. Les marqueurs de note sont placés à la fin des segments concernés.
