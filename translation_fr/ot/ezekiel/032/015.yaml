source:
  edition: WLC
  text: בְּ/תִתִּ/י֩ אֶת אֶ֨רֶץ מִצְרַ֜יִם שְׁמָמָ֣ה וּ/נְשַׁמָּ֗ה אֶ֚רֶץ מִ/מְּלֹאָ֔/הּ בְּ/הַכּוֹתִ֖/י אֶת כָּל י֣וֹשְׁבֵי בָ֑/הּ וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/015.yaml
  text: When I make the land of Egypt a desolation[a], and the land is stripped of all that fills it, when I strike down all who dwell in it, then they will know that I am Yahweh.
translation:
  language: fr
  text: Quand je ferai du pays d’Égypte une désolation[a], quand le pays sera dévasté, vidé de tout ce qui le remplit, quand je frapperai tous ceux qui l’habitent, alors ils sauront que je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une terre dévastée, et que le pays sera privé de tout ce qui le remplit ».'
    reason: La seconde expression de dévastation peut être rendue plus explicitement; le texte principal conserve la valeur nominale de « désolation » pour שְׁמָמָה et rend מִמְּלֹאָהּ par l’idée d’un pays vidé de son contenu.
lexical_decisions:
- source_word: בְּתִתִּי
  choice: Quand je ferai
  rationale: La préposition בְּ avec l’infinitif construit introduit ici une proposition temporelle. Dans cette construction résultative, נתן signifie naturellement « faire de » plutôt que le littéral « donner ».
- source_word: אֶרֶץ מִצְרַיִם
  choice: du pays d’Égypte
  rationale: « Pays d’Égypte » rend naturellement en français la relation entre אֶרֶץ et מִצְרַיִם.
- source_word: שְׁמָמָה
  choice: une terre dévastée
  rationale: Le nom hébreu évoque un lieu ravagé et désolé. Cette formulation française conserve l’image concrète tout en s’intégrant naturellement à « faire de… ».
- source_word: וּנְשַׁמָּה אֶרֶץ מִמְּלֹאָהּ
  choice: quand le pays sera vidé de tout ce qui le remplit
  rationale: Le passif décrit le pays dévasté ou rendu désert, tandis que מִמְּלֹאָהּ précise qu’il est privé de son contenu. « Sera vidé » exprime cette dépossession sans répéter maladroitement « dévasté ».
- source_word: בְּהַכּוֹתִי
  choice: quand j’abattrai
  rationale: La seconde construction בְּ avec infinitif est temporelle. Dans ce contexte de jugement, « abattre » rend la force létale de נכה plus précisément que le simple « frapper ».
- source_word: כָּל יֹשְׁבֵי בָהּ
  choice: tous ceux qui l’habitent
  rationale: Cette formulation proche de l’expression participiale hébraïque est claire et idiomatique en français moderne.
- source_word: וְיָדְעוּ
  choice: alors ils sauront
  rationale: Le waw introduit ici le résultat des actions précédentes; « alors » explicite naturellement cette conséquence en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle du nom divin plutôt que remplacé par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le nom propre divin. « Yahweh » en préserve le caractère personnel sans le remplacer par un titre.
- issue: Portée de la formule de reconnaissance
  choice: ils sauront que je suis Yahweh
  alternative: ils reconnaîtront que je suis Yahweh
  rationale: Le verbe ידע signifie directement « savoir/connaître ». « Sauront » préserve la formulation récurrente d’Ézéchiel sans préciser au-delà du texte s’il s’agit d’une reconnaissance volontaire ou imposée par le jugement.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition des propositions temporelles est conservée pour respecter la progression du texte hébreu; « terre dévastée » et « vidé » évitent une redondance peu naturelle tout en maintenant l’intensification du jugement.
