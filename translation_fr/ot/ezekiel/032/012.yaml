revisions:
- from: Par les épées de guerriers, je ferai tomber ta multitude — tous, hommes impitoyables venus des nations[a]. Ils dépouilleront ce qui fait la fierté de l’Égypte[b], et toute sa multitude sera anéantie.
  to: Par les épées de guerriers, je ferai tomber ta multitude — tous, hommes impitoyables parmi les nations[a]. Ils dépouilleront l’Égypte de ce qui fait sa fierté[b], et toute sa multitude sera détruite.
  rationale: La révision corrige l’ajout de sens introduit par « venus des nations », améliore la construction française de « dépouiller » et emploie pour la destruction finale un équivalent direct, fort mais non amplifié. Les notes conservent les alternatives lexicales importantes sans résoudre artificiellement l’ambiguïté de גְּאוֹן.
