source:
  edition: WLC
  text: בְּ/חַרְב֤וֹת גִּבּוֹרִים֙ אַפִּ֣יל הֲמוֹנֶ֔/ךָ עָרִיצֵ֥י גוֹיִ֖ם כֻּלָּ֑/ם וְ/שָֽׁדְדוּ֙ אֶת גְּא֣וֹן מִצְרַ֔יִם וְ/נִשְׁמַ֖ד כָּל הֲמוֹנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/012.yaml
  text: By the swords of mighty men I will make your multitude fall— all of them the ruthless ones of the nations[a]. They will plunder the pride of Egypt[b], and all her multitude will be destroyed.
translation:
  language: fr
  text: Par les épées de guerriers, je ferai tomber ta multitude — tous, hommes impitoyables parmi les nations[a]. Ils dépouilleront l’Égypte de ce qui fait sa fierté[b], et toute sa multitude sera détruite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous, les tyrans des nations » ; ou « les hommes violents des nations ».
    reason: lexical_alternative
  - marker: b
    text: Ou « de sa splendeur » ; le mot hébreu peut désigner l’orgueil comme la grandeur prestigieuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַרְבוֹת גִּבּוֹרִים
  choice: Par les épées de guerriers
  rationale: La préposition בְּ a ici une valeur instrumentale. « Guerriers » rend naturellement גִּבּוֹרִים dans ce contexte militaire, tout en conservant l’image explicite des épées.
- source_word: אַפִּיל
  choice: je ferai tomber
  rationale: Le hiphil de נפל exprime la causalité. Cette formulation française est directe et respecte cette valeur.
- source_word: הֲמוֹנֶךָ
  choice: ta multitude
  rationale: Le terme הָמוֹן peut désigner une foule, une masse humaine ou des troupes nombreuses. « Multitude » reste assez large et permet de reproduire sa répétition en fin de verset.
- source_word: עָרִיצֵי גוֹיִם כֻּלָּם
  choice: tous, hommes impitoyables venus des nations
  rationale: עָרִיץ désigne des êtres violents, impitoyables ou tyranniques. L’ajout idiomatique de « hommes » explicite le référent personnel sans leur attribuer nécessairement une fonction politique; « venus des nations » rend la relation génitivale de façon naturelle.
- source_word: וְשָׁדְדוּ
  choice: Ils dépouilleront
  rationale: שׁדד exprime le pillage ou la spoliation. « Dépouiller » convient à un objet qui peut être compris comme la fierté, la splendeur ou ce dont l’Égypte se glorifie.
- source_word: גְּאוֹן מִצְרַיִם
  choice: ce qui fait la fierté de l’Égypte
  rationale: גָּאוֹן couvre à la fois l’orgueil et la grandeur prestigieuse. Cette tournure française préserve l’idée de ce dont l’Égypte tire fierté et permet de signaler l’autre nuance en note.
- source_word: וְנִשְׁמַד
  choice: sera anéantie
  rationale: Le niphal de שׁמד indique une destruction complète. « Sera anéantie » restitue la force du verbe dans cet oracle de jugement.
- source_word: כָּל הֲמוֹנָהּ
  choice: toute sa multitude
  rationale: Le suffixe féminin renvoie à l’Égypte. La répétition de « multitude » reproduit celle de הָמוֹן et maintient le parallélisme du verset.
theological_decisions:
- issue: Valeur de גְּאוֹן dans l’oracle contre l’Égypte
  choice: ce qui fait la fierté de l’Égypte
  alternative: la splendeur de l’Égypte
  rationale: Dans un contexte de jugement, le mot évoque volontiers l’orgueil, mais il peut aussi désigner la majesté ou la grandeur dont une nation se glorifie. Le texte principal conserve cette tension, et la note rend explicite l’autre lecture.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le mouvement poétique de l’oracle et la répétition de « multitude », tout en évitant des formulations archaïques.
