  text: מִ/מִּ֖י נָעָ֑מְתָּ רְדָ֥/ה וְ/הָשְׁכְּבָ֖/ה אֶת עֲרֵלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/019.yaml
  text: Whom do you surpass in beauty? Go down[b][a], and lie with the uncircumcised.
translation:
  language: fr
  text: Qui surpasses-tu en beauté[a] ? Descends et couche-toi avec les incirconcis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « De qui es-tu plus belle ? » L’hébreu formule une comparaison rhétorique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמִּי נָעָמְתָּ
  choice: Qui surpasses-tu en beauté ?
  rationale: La préposition comparative מִן jointe à מִי exprime « plus que qui ? ». Cette formulation française naturelle conserve la comparaison rhétorique et la notion de beauté ou d’agrément portée ici par נעם.
- source_word: רְדָה
  choice: Descends
  rationale: Impératif de ירד, qui désigne ici la descente vers le séjour des morts.
- source_word: וְהָשְׁכְּבָה
  choice: et couche-toi
  rationale: La forme impérative de שכב évoque le fait de se coucher parmi les morts. « Couche-toi » reste proche de l’image hébraïque sans ajouter explicitement l’idée de repos.
- source_word: אֶת
  choice: avec
  rationale: 'Après שכב, אֶת marque ici l’association : le destinataire doit être couché avec les personnes mentionnées.'
- source_word: עֲרֵלִים
  choice: les incirconcis
  rationale: Le terme désigne concrètement ceux qui ne portent pas la circoncision et conserve, dans cet oracle funèbre, sa charge d’opprobre liée au jugement.
theological_decisions:
- issue: Portée de עֲרֵלִים dans l’oracle de jugement
  choice: les incirconcis
  alternative: les païens / les impurs
  rationale: L’hébreu vise précisément l’absence de circoncision, et non une notion générale de paganisme ou d’impureté. La traduction retenue préserve l’image concrète et sa tension d’alliance sans l’élargir doctrinalement.
- issue: Nuance funèbre de וְהָשְׁכְּבָה
  choice: couche-toi
  alternative: sois déposé dans la tombe / repose
  rationale: Le contexte implique la mort, mais le verbe conserve l’image simple de se coucher. La traduction évite d’introduire dans le texte une mention explicite de la tombe ou du repos.
translation_notes:
  register: Français moderne, direct et solennel. Le tutoiement correspond à l’adresse singulière visant l’Égypte ou son représentant dans l’oracle. « Incirconcis » conserve le vocabulaire concret du texte et « couche-toi » son image funèbre sans explicitation excessive.
