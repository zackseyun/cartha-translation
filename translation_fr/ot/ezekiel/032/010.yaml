  to: Je plongerai de nombreux peuples dans la stupeur à ton sujet[a], et leurs rois frémiront d’épouvante à ton sujet[b] quand je brandirai mon épée devant eux[c]. Ils trembleront à chaque instant[d], chacun pour sa propre vie, au jour de ta chute.
