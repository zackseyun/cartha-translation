  text: וַ/הֲשִׁמּוֹתִ֨י עָלֶ֜י/ךָ עַמִּ֣ים רַבִּ֗ים וּ/מַלְכֵי/הֶם֙ יִשְׂעֲר֤וּ עָלֶ֨י/ךָ֙ שַׂ֔עַר בְּ/עוֹפְפִ֥/י חַרְבִּ֖/י עַל פְּנֵי/הֶ֑ם וְ/חָרְד֤וּ לִ/רְגָעִים֙ אִ֣ישׁ לְ/נַפְשׁ֔/וֹ בְּ/י֖וֹם מַפַּלְתֶּֽ/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/010.yaml
  text: I will make many peoples appalled at you[a], and their kings will shudder over you when I brandish my sword before them; and they will tremble every moment, each man for his own life[c][b], on the day of your downfall.
translation:
  language: fr
  text: Je plongerai de nombreux peuples dans la stupeur à ton sujet[a], et leurs rois frémiront d’épouvante à ton sujet[b] quand je brandirai mon épée devant eux[c]. Ils trembleront à chaque instant[d], chacun pour sa propre vie, au jour de ta chute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi évoquer la dévastation ; ici, avec les peuples comme objet, il exprime probablement la stupeur ou l’effroi que provoque le sort de l’Égypte.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu associe un verbe et un nom de même racine pour exprimer une épouvante intense.
    reason: source_idiom
  - marker: c
    text: Littéralement, « quand je ferai voler mon épée devant eux ».
    reason: lexical_alternative
  - marker: d
    text: Ou « d’instant en instant ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁמּוֹתִי עָלֶיךָ
  choice: Je frapperai de stupeur … à cause de toi
  rationale: Le hifil de שׁמם, avec les peuples comme objet, exprime ici le fait de les plonger dans la stupeur ou l’effroi devant le sort de l’Égypte. Cette formulation conserve la valeur causative et s’accorde avec les réactions de peur qui suivent.
- source_word: עַמִּים רַבִּים
  choice: de nombreux peuples
  rationale: « Peuples » rend le pluriel עַמִּים sans suggérer nécessairement des États-nations modernes.
- source_word: יִשְׂעֲרוּ עָלֶיךָ שַׂעַר
  choice: frémiront d’épouvante à cause de toi
  rationale: Le verbe et le nom apparenté forment une expression intensive. « Frémir d’épouvante » restitue à la fois la réaction physique et l’horreur extrême dans un français naturel.
- source_word: בְּעוֹפְפִי חַרְבִּי
  choice: quand je brandirai mon épée
  rationale: Le texte évoque littéralement le fait de faire « voler » l’épée. « Brandir » rend naturellement le geste menaçant tout en conservant l’image guerrière.
- source_word: עַל־פְּנֵיהֶם
  choice: devant eux
  rationale: Rendu spatial direct et idiomatique.
- source_word: וְחָרְדוּ
  choice: Ils trembleront
  rationale: חרד désigne un tremblement causé par la peur; le choix français maintient ses dimensions physique et émotionnelle.
- source_word: לִרְגָעִים
  choice: à chaque instant
  rationale: Le pluriel avec ל suggère des moments répétés. « À chaque instant » exprime clairement cette panique continuelle, sans exclure la lecture « d’instant en instant ».
- source_word: אִישׁ לְנַפְשׁוֹ
  choice: chacun pour sa propre vie
  rationale: נֶפֶשׁ désigne ici la vie menacée. « Chacun » rend naturellement la tournure distributive אִישׁ, tandis que « propre » souligne la peur individuelle.
- source_word: בְּיוֹם מַפַּלְתֶּךָ
  choice: au jour de ta chute
  rationale: מַפָּלָה évoque la chute ou l’effondrement sous le jugement. « Ta chute » est direct, naturel et approprié à l’adresse faite à l’Égypte.
theological_decisions:
- issue: L’action divine dans l’image du jugement
  choice: Dieu parle directement et présente l’épée comme la sienne.
  alternative: L’épée peut aussi être comprise historiquement comme celle de Babylone agissant en instrument de Dieu.
  rationale: Les formes à la première personne (« je frapperai », « mon épée ») attribuent explicitement l’action à Dieu. La traduction préserve cette immédiateté sans préciser ni exclure l’intermédiaire historique.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le tutoiement singulier adressé à l’Égypte, l’intensité poétique du jugement et l’ambiguïté lexicale de שׁמם en note, sans imposer une identification doctrinale de l’épée.
