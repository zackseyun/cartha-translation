  text: בֶּן אָדָ֗ם שָׂ֤א קִינָה֙ עַל פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם וְ/אָמַרְתָּ֣ אֵלָ֔י/ו כְּפִ֥יר גּוֹיִ֖ם נִדְמֵ֑יתָ וְ/אַתָּה֙ כַּ/תַּנִּ֣ים בַּ/יַּמִּ֔ים וַ/תָּ֣גַח בְּ/נַהֲרוֹתֶ֗י/ךָ וַ/תִּדְלַח מַ֨יִם֙ בְּ/רַגְלֶ֔י/ךָ וַ/תִּרְפֹּ֖ס נַהֲרוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/002.yaml
  text: 'Son of man[a], raise a lament over Pharaoh king of Egypt, and say to him: You compared yourself to a young lion among the nations, but you were like the monster in the seas; you burst forth in your rivers, and muddied the waters with your feet[c][b], and fouled their rivers.'
translation:
  language: fr
  text: 'Fils d’homme, prononce une lamentation sur le pharaon, roi d’Égypte, et dis-lui :


    « Tu t’es comparé à un jeune lion parmi les nations[a],

    mais tu étais comme le monstre des mers[b].

    Tu as fait irruption dans tes fleuves,

    tu as troublé les eaux de tes pieds

    et tu as piétiné leurs cours d’eau[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu as été comparé à un jeune lion parmi les nations. » Le verbe hébreu peut être compris au passif plutôt qu’au sens réfléchi.'
    reason: alternative_reading
  - marker: b
    text: Le terme hébreu désigne ici vraisemblablement une grande créature aquatique ; on pourrait aussi traduire par « dragon » ou « monstre marin ».
    reason: lexical_alternative
  - marker: c
    text: Le verbe hébreu signifie « piétiner » ou « fouler » ; dans cette image, l’action implique aussi que les cours d’eau sont souillés ou bouleversés.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Expression prophétique consacrée et immédiatement compréhensible en français biblique moderne; elle conserve l’idiome hébreu sans le réduire à une simple paraphrase.
- source_word: שָׂא קִינָה
  choice: entonne une complainte
  rationale: Rend l’idée d’élever ou de commencer un chant funèbre. « Entonne » est naturel en français et préserve le caractère poétique et solennel de la formule prophétique.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: le pharaon, roi d’Égypte
  rationale: Restitue directement le titre royal avec une syntaxe française naturelle.
- source_word: כְּפִיר גּוֹיִם
  choice: un jeune lion parmi les nations
  rationale: כְּפִיר désigne un jeune lion vigoureux; « parmi les nations » exprime naturellement son positionnement au milieu d’elles.
- source_word: נִדְמֵיתָ
  choice: tu t’es comparé
  rationale: Le nifal permet ici une lecture réfléchie dans le contexte de raillerie dirigée contre la prétention du pharaon. L’ambiguïté avec la lecture passive est signalée en note.
- source_word: כַּתַּנִּים בַּיַּמִּים
  choice: comme le monstre des mers
  rationale: Dans ce contexte entièrement aquatique, תַּנִּים évoque une grande créature redoutable des eaux plutôt qu’un chacal. Le pluriel français « des mers » évite la répétition maladroite de « monstre marin dans les mers ».
- source_word: וַתָּגַח בְּנַהֲרוֹתֶיךָ
  choice: Tu faisais irruption dans tes fleuves
  rationale: La forme décrit un mouvement violent ou impétueux. « Faisais irruption » conserve cette force dans l’image aquatique sans imposer l’image plus précise de coups de corne.
- source_word: וַתִּדְלַח מַיִם בְּרַגְלֶיךָ
  choice: tu troublais l’eau de tes pieds
  rationale: דלח exprime le fait de rendre l’eau trouble ou boueuse; cette formulation française reste concrète et proche de l’image hébraïque.
- source_word: וַתִּרְפֹּס נַהֲרוֹתָם
  choice: tu piétinais leurs cours d’eau
  rationale: רפס signifie fondamentalement piétiner ou fouler. Le rendu garde cette action distincte du trouble des eaux déjà exprimé dans le membre précédent et conserve le suffixe pluriel « leurs ».
theological_decisions:
- issue: Sens réfléchi ou passif de נִדְמֵיתָ
  choice: 'Lecture réfléchie : « tu t’es comparé »'
  alternative: 'Lecture passive : « tu as été comparé » ou « tu ressemblais »'
  rationale: Le contexte de complainte satirique permet d’entendre une prétention du pharaon, mais la morphologie nifal autorise aussi une lecture passive. La traduction retient la lecture réfléchie sans dissimuler l’autre possibilité.
translation_notes:
  register: Français international moderne, poétique et solennel sans archaïsmes inutiles. La disposition en vers fait ressortir le parallélisme de la complainte. Les images animales et aquatiques restent concrètes, et les ambiguïtés réelles de l’hébreu sont conservées dans les notes.
