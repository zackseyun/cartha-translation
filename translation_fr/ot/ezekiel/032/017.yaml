  text: וַֽ/יְהִי֙ בִּ/שְׁתֵּ֣י עֶשְׂרֵ֣ה שָׁנָ֔ה בַּ/חֲמִשָּׁ֥ה עָשָׂ֖ר לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/017.yaml
  text: And it happened in the twelfth year[a], on the fifteenth day of the month, that the word of Yahweh came to me, saying,
translation:
  language: fr
  text: 'La douzième année, le quinzième jour du mois, la parole de Yahweh me fut adressée en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: La douzième année… la parole… me fut adressée
  rationale: Le verbe ouvre une notice prophétique datée. En français naturel, sa fonction narrative est intégrée à la formule complète plutôt que rendue littéralement par « il arriva ».
- source_word: בִּשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: La douzième année
  rationale: Formule chronologique standard, exprimée naturellement par un ordinal en français.
- source_word: בַּחֲמִשָּׁה עָשָׂר לַחֹדֶשׁ
  choice: le quinzième jour du mois
  rationale: Le mot « jour », implicite en hébreu, est ajouté pour rendre la date clairement et idiomatiquement.
- source_word: דְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: Conserve la formule prophétique et rend directement le nom divin.
- source_word: אֵלַי
  choice: me fut adressée
  rationale: Rend idiomatiquement en français la venue de la parole « vers moi », sans altérer le sens.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: Introduit naturellement en français le discours direct annoncé par l'infinitif hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » préserve le nom propre sans le remplacer par un titre.
translation_notes:
  register: Français moderne, digne et fluide. La formule traditionnelle « la parole de Yahweh me fut adressée » convient au registre prophétique tout en restant immédiatement compréhensible.
