source:
  edition: WLC
  text: בְּ/ת֥וֹךְ חַלְלֵי חֶ֖רֶב יִפֹּ֑לוּ חֶ֣רֶב נִתָּ֔נָה מָשְׁכ֥וּ אוֹתָ֖/הּ וְ/כָל הֲמוֹנֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/020.yaml
  text: They will fall among those slain by the sword[a]. The sword is given; drag her away[b], and all her multitude.
translation:
  language: fr
  text: Ils tomberont au milieu de ceux que l’épée a tués. L’épée est donnée[a] ; traînez-la[b], elle et toute sa multitude.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Une épée est assignée ». La proposition hébraïque est très concise et peut indiquer que l’épée a été destinée à exécuter le jugement.
    reason: alternative_reading
  - marker: b
    text: Il s’agit de l’Égypte personnifiée, avec toute sa multitude.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹךְ
  choice: au milieu de
  rationale: Cette expression rend directement l’idée d’être placé parmi le groupe des morts, tout en restant naturelle en français.
- source_word: חַלְלֵי חֶרֶב
  choice: ceux que l’épée a tués
  rationale: Le groupe construit désigne les personnes transpercées ou tuées par l’épée. Cette formulation française est claire et conserve l’image guerrière.
- source_word: יִפֹּלוּ
  choice: ils tomberont
  rationale: L’imparfait hébreu a ici une valeur prédictive dans l’oracle prophétique.
- source_word: חֶרֶב נִתָּנָה
  choice: L’épée est livrée
  rationale: La formulation passive et abrupte conserve la concision de l’hébreu et évite de préciser au-delà du texte qui livre l’épée ou à quoi elle est destinée.
- source_word: מָשְׁכוּ
  choice: traînez
  rationale: L’impératif pluriel évoque une action énergique consistant à tirer ou entraîner de force, dans le contexte de la descente parmi les morts.
- source_word: אוֹתָהּ
  choice: la
  rationale: Le pronom féminin singulier renvoie très probablement à l’Égypte personnifiée dans le contexte.
- source_word: וְכָל הֲמוֹנֶיהָ
  choice: elle et toutes ses foules
  rationale: La coordination française conserve le waw hébreu, tandis que le pluriel « foules » rend les masses nombreuses associées à l’Égypte.
theological_decisions:
- issue: Référent du pronom féminin dans l’impératif
  choice: 'Le pronom désigne l’Égypte personnifiée : « traînez-la ».'
  alternative: Le pronom pourrait être compris plus abstraitement dans cette construction difficile.
  rationale: Le contexte immédiat concerne l’Égypte et la présente comme une entité féminine. Cette lecture préserve la personnification prophétique sans la développer davantage.
- issue: Sens de la proposition abrupte חֶרֶב נִתָּנָה
  choice: « L’épée est livrée. »
  alternative: « Une épée est assignée » ou « l’épée a été remise ».
  rationale: L’hébreu est elliptique. Une traduction relativement formelle maintient son ambiguïté quant à l’agent et à la destination de l’épée.
translation_notes:
  register: Français international moderne, digne et direct. Le rythme bref de l’oracle est conservé, notamment dans la proposition isolée « L’épée est livrée ». La reprise « elle et » est volontairement marquée afin de rendre la coordination hébraïque sans effacer la personnification.
