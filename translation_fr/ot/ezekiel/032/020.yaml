revisions:
- from: Ils tomberont au milieu de ceux que l’épée a tués. L’épée est livrée[a] ; traînez-la[b], elle et toutes ses foules.
  to: Ils tomberont au milieu de ceux que l’épée a tués. L’épée est donnée[a] ; traînez-la[b], elle et toute sa multitude.
  rationale: 'La révision remplace « livrée » par « donnée », qui correspond directement au passif de נתן tout en préservant l’ellipse et l’ambiguïté de la clause. Elle remplace aussi le pluriel « toutes ses foules » par le collectif singulier « toute sa multitude », plus fidèle à הֲמוֹנֶיהָ. Les ancres de notes restent correctement placées : [a] sur la clause ambiguë relative à l’épée et [b] sur le pronom féminin renvoyant à l’Égypte.'
