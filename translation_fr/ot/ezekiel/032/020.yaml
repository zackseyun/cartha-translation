review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : la chute parmi les tués par l’épée, l’énoncé passif elliptique concernant l’épée, puis l’ordre visant l’Égypte personnifiée et sa multitude. Toutefois, « livrée » oriente plus spécifiquement vers l’idée de remise/abandon, tandis que נִתָּנָה signifie plus simplement « est donnée » dans cette formulation volontairement abrupte.'
  naturalness: « L’épée est donnée » demeure volontairement elliptique, comme l’hébreu, mais est plus exact que « est livrée ». Dans la dernière proposition, « toute sa multitude » est plus naturel et plus conforme au singulier collectif הֲמוֹנֶיהָ que « toutes ses foules ». La reprise emphatique « elle et » peut être conservée en français littéraire et rend explicitement la coordination sans élucider davantage la construction.
  terminology: « Ceux que l’épée a tués », « tomberont », « traînez-la » et « multitude » conviennent au registre prophétique moderne. « Multitude » restitue le collectif hébreu sans restreindre le groupe à des forces militaires.
  issues:
  - severity: medium
    issue: « L’épée est livrée » interprète excessivement le passif נִתָּנָה.
    rationale: Le verbe נתן signifie d’abord « donner ». « Livrer » peut évoquer la remise à un adversaire ou l’abandon, nuances non exprimées par la clause hébraïque elliptique.
  - severity: low
    issue: « Toutes ses foules » ne reflète pas idéalement le singulier collectif הֲמוֹנֶיהָ.
    rationale: Le nom הָמוֹן est ici un collectif (« sa multitude », « sa foule nombreuse »). Le pluriel français suggère plusieurs foules et affaiblit la correspondance lexicale.
  revised_text: Ils tomberont au milieu de ceux que l’épée a tués. L’épée est donnée[a] ; traînez-la[b], elle et toute sa multitude.
