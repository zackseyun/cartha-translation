revisions:
- from: La redevance prescrite pour l’huile sera d’un dixième de bath d’huile[a] par kor[b] — le kor correspondant à dix baths, soit un homer, puisque dix baths font un homer.
  to: La redevance prescrite pour l’huile sera fixée à un dixième de bath d’huile[a] par kor[b] ; dix baths font un homer ; car dix baths font un homer.
