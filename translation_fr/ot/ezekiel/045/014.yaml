base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/014.yaml
  text: And the fixed due of oil shall be one bath of oil from each cor[a], from ten baths, that is, one homer[c][b], for ten baths are one homer.
translation:
  language: fr
  text: La redevance prescrite pour l’huile sera fixée à un dixième de bath d’huile[a] par kor[b] ; dix baths font un homer ; car dix baths font un homer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le bath d’huile, un dixième de bath prélevé sur le kor ». La formulation hébraïque est condensée.'
    reason: textual_clarity
  - marker: b
    text: Le bath, le kor et le homer sont d’anciennes unités de capacité. Le verset met ici le kor en rapport avec dix baths et précise qu’un homer équivaut à dix baths.
    reason: cultural_note
lexical_decisions:
- source_word: חֹק
  choice: redevance prescrite
  rationale: Dans ce contexte de prélèvement, le terme désigne la part fixée qui doit être versée, plutôt qu’une loi abstraite.
- source_word: שֶּׁמֶן
  choice: huile
  rationale: Le mot hébreu signifie « huile »; même s’il s’agit vraisemblablement d’huile d’olive, le texte ne précise pas ici « olive ».
- source_word: מַעְשַׂר הַבַּת
  choice: un dixième de bath
  rationale: Le syntagme indique explicitement le dixième d’un bath. Cette valeur est conservée malgré la difficulté métrologique du verset.
- source_word: בַּת
  choice: bath
  rationale: Nom translittéré d’une ancienne unité de capacité; aucune conversion moderne incertaine n’est introduite.
- source_word: כֹּר
  choice: kor
  rationale: Nom translittéré de l’unité ancienne, distingué graphiquement du français courant.
- source_word: חֹמֶר
  choice: homer
  rationale: Nom translittéré de l’unité ancienne; le verset en donne lui-même l’équivalence en baths.
- source_word: כִּי
  choice: puisque
  rationale: La conjonction introduit ici l’explication de l’équivalence métrologique.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase explicite la relation sous-entendue entre le kor et les dix baths, tout en conservant le « dixième de bath » exigé par le texte hébreu et sans convertir les mesures anciennes en unités modernes.
