    rationale: « le kor correspondant à dix baths, soit un homer, puisque dix baths font un homer » fusionne l’apposition du texte et son explication introduite par כִּי. Une présentation plus proche, en deux membres, préserve la répétition source tout en restant naturelle.
  - severity: low
    issue: Tour verbal légèrement peu naturel
    rationale: « La redevance ... sera d’un dixième » est possible, mais « sera fixée à un dixième » exprime plus naturellement une redevance réglementée et correspond bien à חֹק dans ce contexte.
