source:
  edition: WLC
  text: יִהְיֶ֤ה מִ/זֶּה֙ אֶל הַ/קֹּ֔דֶשׁ חֲמֵ֥שׁ מֵא֛וֹת בַּ/חֲמֵ֥שׁ מֵא֖וֹת מְרֻבָּ֣ע סָבִ֑יב וַ/חֲמִשִּׁ֣ים אַמָּ֔ה מִגְרָ֥שׁ ל֖/וֹ סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/002.yaml
  text: From this there shall be for the holy place a square of five hundred by five hundred all around[b][a], with fifty cubits of open land for it all around.
translation:
  language: fr
  text: De cette portion, on réservera pour le lieu saint[a] un espace de cinq cents sur cinq cents, formant un carré tout autour, avec cinquante coudées de terrain dégagé[b] tout autour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sanctuaire ». Ici, le mot hébreu קֹדֶשׁ peut désigner plus largement l’espace sacré, et non seulement le bâtiment du sanctuaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « pâturage » ou « terrain communal ». Le terme désigne l’espace ouvert qui entoure l’aire sacrée.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/זֶּה
  choice: Sur cette portion
  rationale: L’expression renvoie à la part décrite au verset précédent et indique qu’une section en est prélevée. Cette formulation explicite naturellement le référent sans ajouter une nouvelle entité.
- source_word: אֶל הַ/קֹּדֶשׁ
  choice: pour le lieu saint
  rationale: La préposition exprime ici l’affectation. « Lieu saint » conserve la portée sacrée de קֹדֶשׁ sans la limiter nécessairement au bâtiment du sanctuaire.
- source_word: חֲמֵשׁ מֵאוֹת בַּ/חֲמֵשׁ מֵאוֹת
  choice: cinq cents sur cinq cents
  rationale: Il s’agit d’une formule de dimensions. L’unité, non exprimée à cet endroit dans l’hébreu, reste implicite comme dans le texte source.
- source_word: מְרֻבָּע
  choice: un carré
  rationale: Le terme décrit la forme géométrique de la parcelle.
- source_word: סָבִיב
  choice: de tous côtés / tout autour
  rationale: 'Les deux occurrences sont rendues distinctement selon leur fonction : la première souligne l’égalité des côtés du carré, la seconde la ceinture de terrain qui l’entoure.'
- source_word: וַ/חֲמִשִּׁים אַמָּה
  choice: avec une bande de… cinquante coudées
  rationale: La conjonction ajoute une spécification concernant l’espace périphérique; « avec » l’intègre naturellement à la description.
- source_word: מִגְרָשׁ
  choice: terrain libre
  rationale: Le mot désigne un espace dégagé réservé autour d’un site. « Terrain libre » convient au contexte et évite l’ancien « faubourg », potentiellement trompeur.
- source_word: ל֖/וֹ
  choice: '[rendu par le rattachement de « tout autour » au lieu saint]'
  rationale: Le pronom renvoie à l’espace sacré. En français, la construction choisie rend ce rapport sans alourdir la phrase par « pour lui ».
theological_decisions:
- issue: Portée de קֹדֶשׁ
  choice: lieu saint
  alternative: sanctuaire
  rationale: Le contexte peut viser l’aire sacrée dans son ensemble plutôt que le seul édifice; la traduction principale préserve cette extension possible, et la note signale l’autre lecture.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la répétition spatiale de סָבִיב tout en distinguant naturellement la forme carrée de la bande périphérique. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
