source:
  edition: WLC
  text: הָ/אֵיפָ֣ה וְ/הַ/בַּ֗ת תֹּ֤כֶן אֶחָד֙ יִֽהְיֶ֔ה לָ/שֵׂ֕את מַעְשַׂ֥ר הַ/חֹ֖מֶר הַ/בָּ֑ת וַ/עֲשִׂירִ֤ת הַ/חֹ֨מֶר֙ הָֽ/אֵיפָ֔ה אֶל הַ/חֹ֖מֶר יִהְיֶ֥ה מַתְכֻּנְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/011.yaml
  text: The ephah and the bath shall be of one measure[a], so that the bath may hold a tenth of a homer, and the ephah a tenth of a homer[c][b]; their standard shall be according to the homer.
translation:
  language: fr
  text: 'L’épha et le bath auront une même mesure : le bath contiendra un dixième de homer, et l’épha un dixième de homer[a]. Leur étalon sera le homer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le homer, aussi appelé « cor », était une grande unité de capacité ; l’épha, pour les matières sèches, et le bath, pour les liquides, en représentaient chacun un dixième.
    reason: cultural_note
lexical_decisions:
- source_word: אֵיפָה
  choice: épha
  rationale: Mesure ancienne de capacité pour les matières sèches, sans équivalent français exact ; la translittération conserve le terme technique.
- source_word: בַּת
  choice: bath
  rationale: Mesure ancienne de capacité pour les liquides ; la translittération évite une conversion moderne incertaine.
- source_word: תֹּכֶן אֶחָד
  choice: la même contenance
  rationale: Dans ce contexte métrologique, l’expression indique que l’épha et le bath ont une capacité identique.
- source_word: לָשֵׂאת
  choice: contiendra
  rationale: Le verbe « porter » prend ici le sens contextuel de contenir une quantité déterminée.
- source_word: מַעְשַׂר / עֲשִׂירִת
  choice: un dixième
  rationale: Les deux termes parallèles expriment chacun la fraction d’un dixième, sans sens cultuel ici.
- source_word: חֹמֶר
  choice: homer
  rationale: Grande unité étalon hébraïque ; la translittération préserve la mesure ancienne sans proposer de conversion contestable.
- source_word: אֶל הַחֹמֶר
  choice: d’après le homer
  rationale: La préposition présente le homer comme l’étalon de référence des deux mesures plus petites.
- source_word: מַתְכֻּנְתּוֹ
  choice: leur mesure sera fixée
  rationale: Le singulier hébreu renvoie au rapport prescrit avec le homer ; le possessif pluriel français reprend naturellement l’épha et le bath ensemble.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Les noms des unités anciennes sont translittérés ; « contenance » rend explicitement le contexte de capacité, tandis que la répétition « un dixième de homer » conserve le parallélisme hébreu.
