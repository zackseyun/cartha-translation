revisions:
- from: Comme propriété de la ville, vous attribuerez un territoire de cinq mille de large sur vingt-cinq mille de long, le long de la portion sainte[a] ; il appartiendra à toute la communauté d’Israël[b].
  to: À titre de propriété de la ville, vous attribuerez un territoire de cinq mille de large sur vingt-cinq mille de long, en regard de la portion sainte[a] ; il appartiendra à tout le peuple d’Israël[b].
  rationale: La révision remplace une indication topographique trop précise par « en regard de », qui préserve mieux l’ambiguïté de לְעֻמַּת, et adopte une formulation française plus naturelle pour l’expression collective finale. Les mesures, l’affectation foncière et le caractère sacré de la portion sont maintenus.
