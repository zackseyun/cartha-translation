source:
  edition: WLC
  text: וַ/אֲחֻזַּ֨ת הָ/עִ֜יר תִּתְּנ֗וּ חֲמֵ֤שֶׁת אֲלָפִים֙ רֹ֔חַב וְ/אֹ֗רֶךְ חֲמִשָּׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף לְ/עֻמַּ֖ת תְּרוּמַ֣ת הַ/קֹּ֑דֶשׁ לְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/006.yaml
  text: And as the city's property[a], you shall give an area five thousand wide and twenty-five thousand long, alongside the holy contribution[b]; it shall belong to the whole house of Israel.
translation:
  language: fr
  text: À titre de propriété de la ville, vous attribuerez un territoire de cinq mille de large sur vingt-cinq mille de long, en regard de la portion sainte[a] ; il appartiendra à tout le peuple d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parallèlement à la portion sainte » ou « correspondant à la portion sainte ». L’expression hébraïque peut indiquer une position en regard, un alignement spatial ou une correspondance.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « toute la maison d’Israël », expression collective désignant le peuple d’Israël.
    reason: cultural_note
lexical_decisions:
- source_word: אֲחֻזַּת הָעִיר
  choice: propriété de la ville
  rationale: אֲחֻזָּה désigne une possession foncière ou un domaine. « Propriété de la ville » est naturel en français actuel et conserve l’idée d’un terrain réservé à la ville.
- source_word: תִּתְּנוּ
  choice: vous attribuerez
  rationale: נתן signifie couramment « donner », mais, dans ce contexte de répartition territoriale, « attribuer » exprime clairement l’acte officiel d’affecter une parcelle.
- source_word: חֲמֵשֶׁת אֲלָפִים רֹחַב וְאֹרֶךְ חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: de cinq mille de large sur vingt-cinq mille de long
  rationale: Cette formulation française restitue les deux dimensions avec concision. L’unité n’étant pas indiquée dans ce verset, elle n’est pas ajoutée.
- source_word: לְעֻמַּת
  choice: le long de
  rationale: Dans la description topographique, לְעֻמַּת indique vraisemblablement une disposition parallèle ou contiguë. « Le long de » rend ce rapport spatial sans imposer une précision absente du texte.
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  choice: la portion sainte
  rationale: תְּרוּמָה désigne ici une part de territoire mise à part. « Portion sainte » rend à la fois son caractère territorial et sa consécration.
- source_word: לְכָל בֵּית יִשְׂרָאֵל
  choice: à toute la communauté d’Israël
  rationale: Littéralement « à toute la maison d’Israël ». Dans cet emploi collectif, « communauté d’Israël » communique naturellement en français qu’il s’agit de l’ensemble du peuple.
- source_word: יִהְיֶה
  choice: il appartiendra
  rationale: Le verbe היה signifie littéralement « être », mais la construction avec לְ exprime ici la destination ou l’appartenance du territoire.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La tournure juridique « vous attribuerez » convient au partage du territoire. Les mesures restent sans unité, conformément à l’hébreu de ce verset.
