  source_fidelity: La désignation foncière, les dimensions et la destination à l’ensemble d’Israël sont bien rendues. Toutefois, « le long de » présente le rapport exprimé par לְעֻמַּת comme nécessairement contigu et longitudinal, alors que le terme peut aussi désigner une position en regard, un alignement ou une correspondance. Une formulation plus ouverte est préférable.
  naturalness: Le français est clair et de registre approprié. « À titre de propriété de la ville » rend plus naturellement en français juridique la fonction d’affectation du terrain. « Tout le peuple d’Israël » est plus immédiatement naturel que « toute la communauté d’Israël », tout en conservant la note sur l’expression collective hébraïque.
  terminology: « Portion sainte » convient à תְּרוּמַת הַקֹּדֶשׁ dans ce contexte de répartition territoriale. « Peuple d’Israël » rend adéquatement le collectif בֵּית יִשְׂרָאֵל sans imposer une structure institutionnelle particulière.
  issues:
  - severity: medium
    issue: « le long de » restreint le sens de לְעֻמַּת.
    rationale: Cette expression française suggère une contiguïté et une extension longitudinale. Le terme hébreu admet également le sens d’« en regard de », d’alignement ou de correspondance; le texte ne permet pas de trancher davantage.
  - severity: low
    issue: « toute la communauté d’Israël » est moins direct que nécessaire.
    rationale: Le collectif « maison d’Israël » désigne ici l’ensemble du peuple. « Tout le peuple d’Israël » est idiomatique en français international moderne et conserve le sens collectif, précisé en note.
