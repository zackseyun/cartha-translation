source:
  edition: WLC
  text: וְ/שִׁבְעַ֨ת יְמֵֽי הֶ/חָ֜ג יַעֲשֶׂ֧ה עוֹלָ֣ה לַֽ/יהוָ֗ה שִׁבְעַ֣ת פָּ֠רִים וְ/שִׁבְעַ֨ת אֵילִ֤ים תְּמִימִם֙ לַ/יּ֔וֹם שִׁבְעַ֖ת הַ/יָּמִ֑ים וְ/חַטָּ֕את שְׂעִ֥יר עִזִּ֖ים לַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/023.yaml
  text: During the seven days of the feast he shall provide as a burnt offering to Yahweh seven bulls and seven rams without blemish each day for the seven days[b][a], and as a sin offering one male goat each day.
translation:
  language: fr
  text: Pendant les sept jours de la fête, il présentera à Yahweh, en holocauste, sept taureaux et sept béliers sans défaut, chaque jour pendant les sept jours, ainsi qu’un bouc chaque jour en sacrifice pour le péché[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sacrifice de purification ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָג
  choice: la fête
  rationale: חַג désigne ici la fête cultuelle mentionnée dans le contexte. « La fête » est naturel, digne et immédiatement compréhensible en français.
- source_word: יַעֲשֶׂה עוֹלָה
  choice: il présentera … en holocauste
  rationale: 'Dans ce contexte sacrificiel, עָשָׂה ne signifie pas simplement « faire » : il exprime l’accomplissement ou la prise en charge de l’offrande. « Présentera … en holocauste » rend cet emploi sans introduire la nuance financière trop marquée de « fournira ».'
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition marque le destinataire de l’offrande, et le tétragramme est rendu par le nom propre « Yahweh ».
- source_word: פָּרִים
  choice: taureaux
  rationale: פַּר désigne un bovin mâle offert en sacrifice ; « taureaux » est précis et naturel.
- source_word: אֵילִים
  choice: béliers
  rationale: אֵילִים désigne des moutons mâles, donc des béliers, dans le vocabulaire sacrificiel.
- source_word: תְּמִימִם
  choice: sans défaut
  rationale: L’adjectif exprime l’intégrité cultuelle requise des animaux offerts. « Sans défaut » est clair et idiomatique.
- source_word: לַיּוֹם
  choice: chaque jour
  rationale: 'Dans l’énumération rituelle, la tournure a une valeur distributive : les quantités indiquées valent pour chacun des sept jours.'
- source_word: חַטָּאת
  choice: sacrifice pour le péché
  rationale: Le nom désigne ici une offrande sacrificielle liée au péché et à la purification. La traduction principale conserve l’expression biblique courante, tandis qu’une note signale l’autre analyse fonctionnelle possible.
- source_word: שְׂעִיר עִזִּים
  choice: un bouc
  rationale: La construction désigne un caprin mâle. « Un bouc » rend naturellement le singulier dans cette liste de sacrifices.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahweh » préserve ici le caractère de nom propre sans substituer un titre.
- issue: Valeur cultuelle de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: Le terme peut être nommé d’après le péché auquel il se rapporte ou d’après sa fonction purificatrice. Le texte principal retient la désignation traditionnelle tout en préservant l’autre possibilité en note.
translation_notes:
  register: Français international moderne, clair et soutenu. La répétition « chaque jour pendant les sept jours » est conservée parce qu’elle reflète l’insistance distributive du texte hébreu. L’ordre des compléments a été légèrement réorganisé pour produire une phrase française naturelle sans atténuer le caractère réglementaire du verset.
