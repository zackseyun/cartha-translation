  text: כֹּה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ בָּֽ/רִאשׁוֹן֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ תִּקַּ֥ח פַּר בֶּן בָּקָ֖ר תָּמִ֑ים וְ/חִטֵּאתָ֖ אֶת הַ/מִּקְדָּֽשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/018.yaml
  text: 'Thus says the Lord GOD: In the first month[a], on the first day of the month, you shall take a bull from the herd without blemish, and you shall purify the sanctuary.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur, l’Éternel : au premier mois, le premier jour du mois, tu prendras un taureau du troupeau, sans défaut, et tu purifieras[a] le sanctuaire.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu feras l’expiation pour le sanctuaire ». Le verbe hébreu employé ici est un terme rituel pouvant désigner la purification, c’est-à-dire l’élimination de la souillure liée au péché.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur, l’Éternel
  rationale: Cette formulation française distingue le titre אֲדֹנָי du nom divin יהוה, tout en évitant l’expression peu naturelle « le Seigneur SEIGNEUR ».
- source_word: בָּרִאשׁוֹן
  choice: Le premier mois
  rationale: Le mot « mois », explicité par la formule de date qui suit, est ajouté en français pour rendre clairement le sens calendaire.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: le premier jour du mois
  rationale: Littéralement « au premier du mois » ; il s’agit de la formule hébraïque habituelle pour désigner le premier jour du mois.
- source_word: תִּקַּח
  choice: tu prendras
  rationale: Dans ce contexte prescriptif, l’imparfait hébreu a une valeur directive ; le futur français convient au style législatif.
- source_word: פַּר בֶּן בָּקָר
  choice: un taureau du gros bétail
  rationale: La formule désigne un bovin mâle provenant du troupeau, sans imposer une précision d’âge que le contexte n’exige pas.
- source_word: תָּמִים
  choice: sans défaut
  rationale: Dans le vocabulaire sacrificiel, cette expression indique qu’un animal est exempt de tare et rituellement acceptable.
- source_word: וְחִטֵּאתָ
  choice: tu purifieras
  rationale: Le piel de חטא désigne ici l’action rituelle d’ôter la souillure liée au péché ; « purifier » exprime naturellement cette opération sans suggérer que le sanctuaire aurait lui-même péché.
- source_word: הַמִּקְדָּשׁ
  choice: le sanctuaire
  rationale: מִקְדָּשׁ désigne le lieu ou l’ensemble sacré ; « sanctuaire » est le terme cultuel français le plus approprié et le moins restrictif.
theological_decisions:
- issue: Sens du verbe rituel חטא lorsque le sanctuaire est son objet
  choice: tu purifieras le sanctuaire
  alternative: tu feras l’expiation pour le sanctuaire
  rationale: L’hébreu décrit une opération rituelle appliquée au sanctuaire. « Purifier » en exprime directement l’effet, tandis que la note conserve l’autre formulation traditionnelle possible sans réduire la tension lexicale.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conserve la solennité de l’introduction prophétique et la précision de la prescription cultuelle. Le marqueur de note est placé après « purifieras », terme auquel la variante se rapporte.
