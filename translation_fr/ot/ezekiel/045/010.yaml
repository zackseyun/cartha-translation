  text: מֹֽאזְנֵי צֶ֧דֶק וְ/אֵֽיפַת צֶ֛דֶק וּ/בַת צֶ֖דֶק יְהִ֥י לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/010.yaml
  text: You must have honest scales[a], an honest ephah[c][b], and an honest bath.
translation:
  language: fr
  text: Vous aurez des balances justes, un épha juste[a] et un bath juste[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’épha était une unité de mesure pour les matières sèches.
    reason: cultural_note
  - marker: b
    text: Le bath était une unité de mesure pour les liquides.
    reason: cultural_note
lexical_decisions:
- source_word: מֹאזְנֵי
  choice: balances
  rationale: Le pluriel construit désigne un instrument de pesage. « Balances » est le terme français courant et naturel dans ce contexte commercial et juridique.
- source_word: צֶדֶק
  choice: juste
  rationale: Le mot est répété pour chacun des trois instruments ou étalons de mesure. « Juste » conserve à la fois l’idée d’exactitude et celle d’intégrité dans les échanges.
- source_word: אֵיפַת
  choice: épha
  rationale: Il s’agit d’une unité hébraïque précise de mesure pour les matières sèches. La translittération préserve la réalité culturelle du texte; une note l’explique.
- source_word: בַת
  choice: bath
  rationale: Il s’agit d’une unité hébraïque précise de mesure pour les liquides. La translittération maintient son parallélisme avec l’épha; une note l’explique.
- source_word: יְהִי לָכֶם
  choice: Vous aurez
  rationale: La tournure jussive avec לָכֶם exprime ici une prescription adressée à la communauté. Le futur français possède une force normative naturelle dans ce contexte législatif, sans surtraduire par une obligation explicite.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La répétition de « juste » reproduit l’insistance de l’hébreu et garde ensemble exactitude des mesures et justice commerciale. Les unités anciennes sont translittérées et expliquées en notes.
