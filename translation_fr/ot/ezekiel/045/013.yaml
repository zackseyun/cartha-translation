  text: זֹ֥את הַ/תְּרוּמָ֖ה אֲשֶׁ֣ר תָּרִ֑ימוּ שִׁשִּׁ֤ית הָֽ/אֵיפָה֙ מֵ/חֹ֣מֶר הַֽ/חִטִּ֔ים וְ/שִׁשִּׁיתֶם֙ הָֽ/אֵיפָ֔ה מֵ/חֹ֖מֶר הַ/שְּׂעֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/013.yaml
  text: 'This is the contribution that you shall offer: one-sixth of an ephah from each homer of wheat[a], and one-sixth of an ephah from each homer of barley.'
translation:
  language: fr
  text: 'Voici la contribution que vous devrez offrir : un sixième d’épha par homer de blé[a], et un sixième d’épha par homer d’orge.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’épha et le homer sont d’anciennes unités de capacité pour les matières sèches. Le verset fixe une contribution d’un sixième d’épha par homer de grain.
    reason: cultural_note
lexical_decisions:
- source_word: תְּרוּמָה
  choice: contribution
  rationale: Dans ce contexte à la fois administratif et cultuel, le terme désigne une part mise à part et présentée. « Contribution » convient naturellement à ce prélèvement fixé par mesure.
- source_word: תָּרִימוּ
  choice: vous prélèverez
  rationale: Le hiphil de רום associé à תְּרוּמָה signifie présenter ou réserver une contribution. Ici, « prélever » exprime clairement qu’une quantité déterminée est prise sur chaque mesure de grain.
- source_word: שִׁשִּׁית
  choice: un sixième
  rationale: La valeur fractionnaire est claire et cette formulation est concise en français moderne.
- source_word: אֵיפָה
  choice: épha
  rationale: Translittération française usuelle de cette ancienne unité de capacité pour les matières sèches; elle préserve la précision technique du texte.
- source_word: חֹמֶר
  choice: homer
  rationale: Translittération directe de l’unité de capacité présente dans l’hébreu; employer un terme générique ferait perdre la précision.
- source_word: מֵחֹמֶר
  choice: sur chaque homer
  rationale: La préposition indique la quantité prélevée sur une unité donnée. « Chaque » explicite la portée distributive impliquée par cette règle.
- source_word: הַחִטִּים
  choice: blé
  rationale: Le français emploie naturellement le nom de matière sans article dans cette formule de mesure.
- source_word: וְשִׁשִּׁיתֶם
  choice: et un sixième
  rationale: Malgré sa morphologie inhabituelle, l’expression est parallèle à la première fraction et introduit la même quantité pour l’orge.
- source_word: הַשְּׂעֹרִים
  choice: orge
  rationale: Le singulier collectif « orge » est la formulation française naturelle pour cette céréale.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe réglementaire de l’hébreu est conservée, tandis que « prélever » rend explicite la nature proportionnelle de la contribution. Les unités anciennes sont translittérées plutôt que converties de manière incertaine.
