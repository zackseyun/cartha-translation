  text: וְ/עַֽל הַ/נָּשִׂ֣יא יִהְיֶ֗ה הָ/עוֹל֣וֹת וְ/הַ/מִּנְחָה֮ וְ/הַ/נֵּסֶךְ֒ בַּ/חַגִּ֤ים וּ/בֶ/חֳדָשִׁים֙ וּ/בַ/שַּׁבָּת֔וֹת בְּ/כָֽל מוֹעֲדֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל הֽוּא יַעֲשֶׂ֞ה אֶת הַ/חַטָּ֣את וְ/אֶת הַ/מִּנְחָ֗ה וְ/אֶת הָֽ/עוֹלָה֙ וְ/אֶת הַ/שְּׁלָמִ֔ים לְ/כַפֵּ֖ר בְּעַ֥ד בֵּֽית יִשְׂרָאֵֽל־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/017.yaml
  text: And the burnt offerings[a], the grain offering, and the drink offering at the feasts, at the new moons, and at the Sabbaths—at all the appointed times of the house of Israel—shall be the prince’s responsibility. He shall provide the sin offering, the grain offering, the burnt offering, and the peace offerings[b], to make atonement for the house of Israel.
translation:
  language: fr
  text: Il incombera au prince de fournir les holocaustes, l’offrande de céréales et la libation lors des fêtes, des nouvelles lunes et des sabbats, à tous les temps fixés de la maison d’Israël. Il fournira le sacrifice pour le péché[a], l’offrande de céréales, l’holocauste et les sacrifices de communion[b], afin de faire l’expiation pour la maison d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sacrifice de purification ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les sacrifices de paix » ou « les sacrifices de bien-être ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַנָּשִׂיא יִהְיֶה
  choice: La responsabilité du prince sera de fournir
  rationale: La construction עַל avec היה exprime ici une charge ou une obligation. Cette formulation française naturelle conserve cette idée sans reproduire littéralement « sera sur le prince ».
- source_word: הַנָּשִׂיא
  choice: le prince
  rationale: Dans Ézéchiel, נָשִׂיא désigne le dirigeant civil sans l’identifier explicitement comme roi. « Prince » maintient la terminologie caractéristique du livre.
- source_word: הָעוֹלוֹת / הָעוֹלָה
  choice: les holocaustes / l’holocauste
  rationale: עוֹלָה désigne l’offrande entièrement brûlée. « Holocauste » est le terme sacrificiel français usuel et permet de conserver le pluriel puis le singulier du texte.
- source_word: הַמִּנְחָה
  choice: l’offrande de céréales
  rationale: Dans ce contexte cultuel, מִנְחָה désigne une offrande végétale, généralement céréalière. La formulation est précise et compréhensible.
- source_word: הַנֵּסֶךְ
  choice: la libation
  rationale: נֶסֶךְ est une offrande liquide versée. « Libation » est le terme français exact et courant dans le vocabulaire biblique.
- source_word: בַּחַגִּים וּבֶחֳדָשִׁים וּבַשַּׁבָּתוֹת
  choice: lors des fêtes, des nouvelles lunes et des sabbats
  rationale: La traduction conserve les trois catégories récurrentes du calendrier cultuel d’Israël dans un français naturel.
- source_word: בְּכָל מוֹעֲדֵי בֵּית יִשְׂרָאֵל
  choice: à toutes les dates fixées pour la communauté d’Israël
  rationale: מוֹעֲדִים désigne ici les temps cultuels fixés. « Dates fixées » évite de répéter « fêtes » tout en conservant l’idée de rendez-vous prescrits; בֵּית יִשְׂרָאֵל est rendu idiomatiquement par « communauté d’Israël » dans ce contexte collectif.
- source_word: הוּא יַעֲשֶׂה
  choice: C’est lui qui fournira
  rationale: עשה peut signifier préparer, faire ou offrir. Dans le contexte de la charge économique du prince, « fournira » exprime sa responsabilité sans affirmer qu’il accomplira personnellement les rites sacerdotaux; la tournure emphatique rend הוּא.
- source_word: הַחַטָּאת
  choice: le sacrifice pour le péché
  rationale: חַטָּאת désigne ici une catégorie sacrificielle. La traduction traditionnelle est retenue, tandis que la nuance possible de purification est signalée en note.
- source_word: הַשְּׁלָמִים
  choice: les sacrifices de communion
  rationale: שְׁלָמִים désigne des sacrifices associés à la paix, au bien-être et à un repas de communion. « Sacrifices de communion » est intelligible et met en valeur leur dimension relationnelle; d’autres nuances sont conservées en note.
- source_word: לְכַפֵּר בְּעַד
  choice: afin de faire l’expiation pour
  rationale: La formulation maintient le sens cultuel de כפר sans le réduire à une théorie doctrinale ultérieure particulière.
theological_decisions:
- issue: Rôle du prince dans le culte sacrificiel
  choice: Le prince a la responsabilité de fournir les sacrifices requis.
  alternative: Le prince accomplit personnellement les rites sacrificiels comme un prêtre.
  rationale: Le contexte impose une charge au prince, mais le verbe עשה ne permet pas à lui seul d’affirmer qu’il officie de ses propres mains. « Fournira » évite de lui attribuer explicitement une fonction sacerdotale.
- issue: Portée de l’expiation sacrificielle
  choice: 'Conserver le langage cultuel: « faire l’expiation pour la communauté d’Israël ».'
  alternative: Paraphraser l’expression selon une théorie systématique ultérieure de l’expiation.
  rationale: Le texte décrit l’expiation dans le cadre de la vision du temple d’Ézéchiel. La traduction préserve cette formulation sans en résoudre les implications théologiques au-delà de l’hébreu.
- issue: Sens de חַטָּאת
  choice: « sacrifice pour le péché » dans le texte, avec « sacrifice de purification » en note.
  alternative: Employer uniquement « sacrifice de purification ».
  rationale: Les deux analyses lexicales sont défendables. Le choix principal reste immédiatement reconnaissable, tandis que la note préserve l’autre nuance sans effacer l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire cultuel précis est conservé, avec « holocauste », « libation » et « expiation ». La syntaxe clarifie la responsabilité du prince sans lui attribuer indûment un rôle sacerdotal personnel. Tous les appels de note [a] et [b] figurent dans le texte.
