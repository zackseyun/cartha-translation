  text: וּ/מִן הַ/מִּדָּ֤ה הַ/זֹּאת֙ תָּמ֔וֹד אֹ֗רֶךְ חמש וְ/עֶשְׂרִים֙ אֶ֔לֶף וְ/רֹ֖חַב עֲשֶׂ֣רֶת אֲלָפִ֑ים וּ/בֽ/וֹ יִהְיֶ֥ה הַ/מִּקְדָּ֖שׁ קֹ֥דֶשׁ קָדָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/003.yaml
  text: From this measured area you shall measure a length of twenty-five thousand and a width of ten thousand[a], and in it shall be the sanctuary, the most holy place.
translation:
  language: fr
  text: À partir de cette étendue mesurée, tu mesureras une longueur de vingt-cinq mille et une largeur de dix mille. Le sanctuaire, le lieu très saint[a], s’y trouvera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « le Saint des saints ».'
    reason: Alternative lexicale traditionnelle pour קֹדֶשׁ קָדָשִׁים.
lexical_decisions:
- source_word: וּמִן הַמִּדָּה הַזֹּאת
  choice: Sur cette étendue mesurée
  rationale: מִדָּה peut désigner une mesure ou une portion mesurée. Dans le contexte du partage du territoire, « étendue mesurée » renvoie concrètement à la zone délimitée; « sur » exprime naturellement en français le point de départ de la mesure à l’intérieur de cette zone.
- source_word: תָּמֹד
  choice: tu mesureras
  rationale: L’imparfait qal à la deuxième personne du masculin singulier a ici une valeur d’instruction. « Tu mesureras » conserve l’adresse directe et le ton procédural.
- source_word: אֹרֶךְ חמש וְעֶשְׂרִים אֶלֶף
  choice: une longueur de vingt-cinq mille
  rationale: La formulation française moderne restitue la première dimension et l’ordre usuel du nombre, sans ajouter une unité absente du texte hébreu.
- source_word: וְרֹחַב עֲשֶׂרֶת אֲלָפִים
  choice: et une largeur de dix mille
  rationale: « Largeur » rend clairement רֹחַב en contraste avec la longueur. Aucune unité n’est ajoutée, conformément au texte source.
- source_word: וּבוֹ יִהְיֶה
  choice: s’y trouvera
  rationale: Cette tournure française naturelle reprend le lieu mesuré auquel renvoie le suffixe de בּוֹ et conserve la valeur future de יִהְיֶה.
- source_word: הַמִּקְדָּשׁ
  choice: le sanctuaire
  rationale: « Sanctuaire » est le terme français courant et suffisamment large pour le lieu sacré évoqué dans la vision d’Ézéchiel.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: le lieu très saint
  rationale: La construction exprime un superlatif cultuel. En apposition à « sanctuaire », « le lieu très saint » est clair pour le lecteur moderne tout en évitant d’imposer une précision doctrinale supplémentaire.
theological_decisions:
- issue: Sens cultuel de קֹדֶשׁ קָדָשִׁים
  choice: le lieu très saint
  alternative: le Saint des saints
  rationale: Le choix principal communique directement le superlatif hébreu en français actuel. La formule traditionnelle reste possible et est signalée en note, sans trancher davantage la portée exacte de l’apposition.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement conserve l’adresse directe au singulier. Les nombres restent sans unité, puisque le verset hébreu n’en précise aucune.
