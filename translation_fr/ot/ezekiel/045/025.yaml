  text: בַּ/שְּׁבִיעִ֡י בַּ/חֲמִשָּׁה֩ עָשָׂ֨ר י֤וֹם לַ/חֹ֨דֶשׁ֙ בֶּ/חָ֔ג יַעֲשֶׂ֥ה כָ/אֵ֖לֶּה שִׁבְעַ֣ת הַ/יָּמִ֑ים כַּֽ/חַטָּאת֙ כָּ/עֹלָ֔ה וְ/כַ/מִּנְחָ֖ה וְ/כַ/שָּֽׁמֶן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/025.yaml
  text: 'In the seventh month[a], on the fifteenth day of the month, at the feast, he shall provide the same offerings for seven days: the sin offering, the burnt offering, the grain offering[b], and the oil.'
translation:
  language: fr
  text: 'Au septième mois, le quinzième jour du mois, pendant la fête, il pourvoira pendant sept jours aux mêmes offrandes : le sacrifice pour le péché, l’holocauste, l’offrande de céréales et l’huile.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּשְּׁבִיעִי
  choice: Au septième mois
  rationale: Dans cette formule de datation, l’ordinal désigne le septième mois; le français exige que « mois » soit explicité.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: le quinzième jour du mois
  rationale: Rend naturellement la formule calendaire hébraïque.
- source_word: בֶּחָג
  choice: pendant la fête
  rationale: חָג désigne ici la fête du septième mois; « pendant » exprime clairement le cadre temporel sans préciser davantage le nom de la fête.
- source_word: יַעֲשֶׂה כָאֵלֶּה
  choice: il pourvoira … aux mêmes offrandes
  rationale: Littéralement « il fera comme celles-ci ». Le contexte sacrificiel et le rôle du prince justifient « pourvoir aux », tandis que « mêmes offrandes » explicite sobrement le renvoi aux prescriptions précédentes.
- source_word: שִׁבְעַת הַיָּמִים
  choice: pendant sept jours
  rationale: Exprime la durée de l’ensemble de la fête dans un français idiomatique.
- source_word: כַּחַטָּאת
  choice: le sacrifice pour le péché
  rationale: Terme sacrificiel traditionnel et intelligible; le כ préfixé introduit ici les catégories auxquelles doivent correspondre les dispositions précédentes.
- source_word: כָעֹלָה
  choice: l’holocauste
  rationale: Équivalent français établi pour l’offrande entièrement consumée.
- source_word: וְכַמִּנְחָה
  choice: l’offrande de céréales
  rationale: Dans ce contexte cultuel, מִנְחָה désigne l’offrande végétale; cette formulation est claire en français moderne.
- source_word: וְכַשָּׁמֶן
  choice: et l’huile
  rationale: Conserve la détermination du texte hébreu et renvoie à l’huile prescrite avec les offrandes.
theological_decisions:
- issue: Référent du sujet implicite de יַעֲשֶׂה
  choice: « il », renvoyant au prince dans le contexte immédiat
  alternative: Un adorateur ou un officiant non précisé
  rationale: Les versets voisins attribuent au prince la responsabilité de fournir les sacrifices. Le pronom « il » préserve néanmoins l’implicite du texte hébreu sans lui attribuer directement l’acte sacerdotal d’offrir.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de la structure hébraïque tout en évitant le calque obscur « il fera comme celles-ci ».
