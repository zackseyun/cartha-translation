source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה רַב לָ/כֶם֙ נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל חָמָ֤ס וָ/שֹׁד֙ הָסִ֔ירוּ וּ/מִשְׁפָּ֥ט וּ/צְדָקָ֖ה עֲשׂ֑וּ הָרִ֤ימוּ גְרֻשֹֽׁתֵי/כֶם֙ מֵ/עַ֣ל עַמִּ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/009.yaml
  text: 'Thus says the Lord GOD: Enough from you[a], princes of Israel! Remove violence and plunder, and do justice and righteousness. Put away your evictions from my people, declares the Lord GOD.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh : « Assez, princes d’Israël ! Renoncez à la violence et au pillage ; pratiquez le droit et la justice. Mettez fin aux expulsions que vous faites subir à mon peuple », déclare le Seigneur Yahweh.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Le titre אֲדֹנָי est rendu par « le Seigneur » et le nom divin יהוה par « Yahweh », ce qui distingue les deux éléments et évite l’expression redondante « le Seigneur SEIGNEUR ».
- source_word: רַב לָכֶם
  choice: Cela suffit
  rationale: Cette formule idiomatique exprime une réprimande ferme. « Cela suffit » est naturel en français et le pluriel des destinataires est explicité par l’adresse qui suit.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: princes d’Israël
  rationale: « Princes » conserve la nuance politique et institutionnelle de נָשִׂיא dans Ézéchiel, plutôt que de généraliser en « dirigeants ».
- source_word: חָמָס וָשֹׁד
  choice: la violence et le pillage
  rationale: La paire désigne les brutalités et la spoliation prédatrice commises par les gouvernants.
- source_word: הָסִירוּ
  choice: Renoncez à
  rationale: Dans cet appel à mettre fin à des pratiques coupables, « renoncez à » exprime naturellement en français l’impératif de les écarter.
- source_word: מִשְׁפָּט וּצְדָקָה עֲשׂוּ
  choice: pratiquez le droit et la justice
  rationale: '« Pratiquez » rend idiomatiquement עֲשׂוּ. « Le droit et la justice » maintient deux notions distinctes : une gouvernance conforme au droit et une conduite juste.'
- source_word: הָרִימוּ גְרֻשֹׁתֵיכֶם מֵעַל עַמִּי
  choice: Cessez d’expulser les membres de mon peuple
  rationale: La formulation française exprime clairement l’ordre de mettre fin aux expulsions imposées au peuple. « Les membres de mon peuple » évite l’ambiguïté française de « expulser mon peuple », qui pourrait suggérer l’expulsion collective de la nation entière.
- source_word: נְאֻם
  choice: déclare
  rationale: Formule prophétique solennelle et courante, marquant l’autorité de l’énoncé divin.
theological_decisions:
- issue: Rendu du nom divin יהוה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: « Yahweh » représente le nom divin présent dans le texte hébreu, tandis que « Seigneur » rend אֲדֹנָי ; les deux éléments du titre composé restent ainsi visibles.
- issue: Rendu de מִשְׁפָּט וּצְדָקָה
  choice: le droit et la justice
  alternative: la justice et la droiture
  rationale: Le choix maintient la distinction entre l’ordre juridique juste (מִשְׁפָּט) et la conformité éthique à ce qui est juste (צְדָקָה), sans les fondre en une seule idée.
- issue: Portée de גְרֻשֹׁתֵיכֶם
  choice: expulser
  alternative: déposséder / chasser de leurs terres
  rationale: Le terme évoque le fait de chasser ou d’expulser. Le contexte foncier peut impliquer une dépossession, mais le texte ne précise pas à lui seul le mécanisme exact ; cette latitude est conservée en note.
translation_notes:
  register: Français international moderne, digne et direct. La parole divine garde son ton de ferme réprimande. Le parallélisme éthique est préservé, tandis que l’expression relative aux expulsions est formulée naturellement sans réduire indûment la portée du terme hébreu.
