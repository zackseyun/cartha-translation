review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu. Toutefois, « Cessez d’expulser les membres de mon peuple » transforme le nom possessif גְרֻשׁוֹתֵיכֶם (« vos expulsions/évictions ») en une formulation verbale et ajoute « les membres de », absent du texte. Une formulation qui conserve les expulsions comme pratiques imputées aux princes est plus fidèle. « Assez » rend avec concision la réprimande רַב לָכֶם, l’adresse « princes d’Israël » en précisant les destinataires.
  naturalness: Le registre est moderne, ferme et naturel. « Mettez fin aux expulsions que vous faites subir à mon peuple » est idiomatique en français international et rend clairement la relation exprimée par « de dessus mon peuple », sans suggérer que le peuple entier est expulsé collectivement.
  terminology: « Le Seigneur Yahweh » distingue correctement אֲדֹנָי de יהוה selon le choix de rendu fourni. « Princes », « violence », « pillage », ainsi que « le droit et la justice » conviennent au contexte prophétique et maintiennent les deux termes de la paire hébraïque.
  issues:
  - severity: low
    issue: La dernière injonction ajoute « les membres de » et ne conserve pas explicitement les « expulsions » comme actes des dirigeants.
    rationale: גְרֻשׁוֹתֵיכֶם est un nom pluriel avec possessif (« vos expulsions »). La révision maintient cette portée tout en évitant une tournure française calquée.
  revised_text: 'Ainsi parle le Seigneur Yahweh : « Assez, princes d’Israël ! Renoncez à la violence et au pillage ; pratiquez le droit et la justice. Mettez fin aux expulsions que vous faites subir à mon peuple », déclare le Seigneur Yahweh.'
  revised_footnotes:
  - marker: a
    text: Ou « aux actes par lesquels vous dépossédez mon peuple ». Le terme hébreu désigne le fait de chasser ou d’expulser ; dans ce contexte, il peut notamment s’agir d’évincer des personnes de leur terre ou de leurs biens.
    reason: lexical_alternative
  revision_rationale: La révision rend plus explicitement le substantif possessif hébreu sans imposer un mécanisme juridique moderne tel que l’« éviction ». Elle préserve l’ambiguïté entre expulsion et dépossession dans la note, tout en supprimant l’ajout interprétatif « les membres de ».
