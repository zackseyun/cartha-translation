revisions:
- from: 'Ainsi parle le Seigneur Yahweh : « Cela suffit, princes d’Israël ! Renoncez à la violence et au pillage ; pratiquez le droit et la justice. Cessez d’expulser[a] les membres de mon peuple », déclare le Seigneur Yahweh.'
  to: 'Ainsi parle le Seigneur Yahweh : « Assez, princes d’Israël ! Renoncez à la violence et au pillage ; pratiquez le droit et la justice. Mettez fin aux expulsions que vous faites subir à mon peuple », déclare le Seigneur Yahweh.'
  rationale: La révision rend plus explicitement le substantif possessif hébreu sans imposer un mécanisme juridique moderne tel que l’« éviction ». Elle préserve l’ambiguïté entre expulsion et dépossession dans la note, tout en supprimant l’ajout interprétatif « les membres de ».
  reviewer_model: gpt-5.6-terra
