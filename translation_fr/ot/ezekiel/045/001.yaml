source:
  edition: WLC
  text: וּ/בְ/הַפִּֽילְ/כֶ֨ם אֶת הָ/אָ֜רֶץ בְּ/נַחֲלָ֗ה תָּרִימוּ֩ תְרוּמָ֨ה לַ/יהוָ֥ה קֹדֶשׁ֮ מִן הָ/אָרֶץ֒ אֹ֗רֶךְ חֲמִשָּׁ֨ה וְ/עֶשְׂרִ֥ים אֶ֨לֶף֙ אֹ֔רֶךְ וְ/רֹ֖חַב עֲשָׂ֣רָה אָ֑לֶף קֹדֶשׁ ה֥וּא בְ/כָל גְּבוּלָ֖/הּ סָבִֽיב־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/001.yaml
  text: 'And when you divide the land as an inheritance[a], you shall set apart a contribution to Yahweh, a holy portion from the land: twenty-five thousand cubits in length and ten thousand in width[b]. It shall be holy within all its surrounding boundary.'
translation:
  language: fr
  text: 'Quand vous répartirez le pays en héritage[a], vous prélèverez pour Yahweh une contribution, une portion sainte prise sur le pays : vingt-cinq mille coudées de longueur sur dix mille de largeur[b]. Elle sera sainte dans toutes ses limites, tout autour.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « attribuerez le pays par tirage au sort comme héritage ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « vingt-cinq mille de longueur et dix mille de largeur » ; l’unité « coudées » est sous-entendue dans ce contexte de mesures.'
    reason: cultural_note
lexical_decisions:
- source_word: וּבְהַפִּילְכֶם
  choice: Quand vous répartirez
  rationale: Le hiphil de נפל, dans le contexte du partage du territoire, évoque l’attribution de lots. « Répartir » exprime naturellement le partage sans imposer dans le texte principal la manière précise, probablement le tirage au sort.
- source_word: אֶת־הָאָרֶץ בְּנַחֲלָה
  choice: le pays en héritage
  rationale: נַחֲלָה désigne ici un bien attribué en héritage. « Le pays » convient au territoire d’Israël envisagé dans son ensemble.
- source_word: תָּרִימוּ תְרוּמָה
  choice: vous prélèverez […] une contribution
  rationale: L’expression désigne une part retirée de l’ensemble et consacrée. « Prélever une contribution » convient mieux à une portion territoriale que le terme général « offrande ».
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition marque la destination ou la consécration de cette part à Yahweh; « pour » est naturel en français dans ce contexte.
- source_word: קֹדֶשׁ מִן־הָאָרֶץ
  choice: une portion sainte prise sur le pays
  rationale: קֹדֶשׁ qualifie substantivement un espace consacré. Le mot « portion » est explicité d’après les dimensions qui suivent, et « prise sur le pays » rend מִן־הָאָרֶץ.
- source_word: אֹרֶךְ חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף אֹרֶךְ וְרֹחַב עֲשָׂרָה אָלֶף
  choice: vingt-cinq mille coudées de longueur sur dix mille de largeur
  rationale: La répétition hébraïque de « longueur » est lissée selon l’usage français. L’unité « coudées », implicite dans ce contexte de mesures, est ajoutée pour rendre la donnée compréhensible.
- source_word: קֹדֶשׁ הוּא בְכָל־גְּבוּלָהּ סָבִיב
  choice: Elle sera sainte sur toute son étendue, jusqu’à ses limites tout autour
  rationale: Cette formulation conserve l’affirmation de sainteté appliquée à l’ensemble de la zone comprise dans son périmètre, tout en restant intelligible en français courant.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom divin plutôt que de le remplacer par un titre.
- issue: Nature de la תְרוּמָה territoriale
  choice: contribution
  alternative: offrande
  rationale: Il s’agit ici d’une portion du pays mise à part pour Yahweh. « Contribution » préserve l’idée de prélèvement consacré sans suggérer principalement un objet sacrificiel.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe juridique et visionnaire du passage est conservée sans archaïsmes; les précisions absentes de l’hébreu sont limitées à celles qu’exige la clarté et signalées en note.
