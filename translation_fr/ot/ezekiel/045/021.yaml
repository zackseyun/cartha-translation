base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/021.yaml
  text: In the first month[a], on the fourteenth day of the month, you shall have the Passover, a feast of seven days[b]; unleavened bread shall be eaten.
translation:
  language: fr
  text: Au premier mois[a], le quatorzième jour du mois, vous célébrerez la Pâque, une fête de sept jours[b] ; on mangera du pain sans levain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au premier » ; le mot « mois » est sous-entendu en hébreu.'
    reason: ellipse_explication
  - marker: b
    text: L’hébreu présente ici la Pâque et la fête de sept jours ensemble. L’expression traduite par « de sept jours » signifie littéralement « semaines de jours » et désigne ici une période de sept jours.
    reason: lexical_and_contextual_clarification
lexical_decisions:
- source_word: בָּרִאשׁוֹן
  choice: Le premier mois
  rationale: Dans ce contexte calendaire, l’hébreu dit littéralement « au premier » et sous-entend le mois, précisé par la formule de date qui suit. Le français explicite naturellement « mois ».
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: le quatorzième jour du mois
  rationale: Cette formule hébraïque indique précisément la date ; la formulation retenue est claire et idiomatique en français moderne.
- source_word: יִהְיֶה לָכֶם
  choice: vous célébrerez
  rationale: Littéralement « sera pour vous », la construction désigne ici l’observance de la Pâque. « Vous célébrerez » rend naturellement cette valeur sans ajouter de détail rituel.
- source_word: הַפָּסַח
  choice: la Pâque
  rationale: Le nom défini désigne la célébration établie de la Pâque ; cette forme est traditionnelle, précise et immédiatement intelligible en français.
- source_word: חָג
  choice: une fête
  rationale: חָג désigne une fête cultuelle, souvent liée à un pèlerinage. « Une fête » convient à son emploi en apposition à « la Pâque ».
- source_word: שְׁבֻעוֹת יָמִים
  choice: de sept jours
  rationale: L’expression, littéralement « semaines de jours », indique ici une période de sept jours. La traduction conserve son rôle descriptif auprès de « fête ».
- source_word: מַצּוֹת
  choice: du pain sans levain
  rationale: Le pluriel hébreu désigne les pains préparés sans levain dans ce contexte festif. Le singulier collectif français est naturel et exact.
- source_word: יֵאָכֵל
  choice: on mangera
  rationale: Le nifal à l’inaccompli a un sens passif, littéralement « sera mangé ». Le pronom indéfini français conserve l’absence d’agent exprimé tout en évitant une tournure passive lourde.
theological_decisions:
- issue: Rapport entre la Pâque et la fête de sept jours
  choice: Présenter « une fête de sept jours » en apposition à « la Pâque », comme dans l’hébreu.
  alternative: Distinguer explicitement le jour de la Pâque de la fête des Pains sans levain qui suit.
  rationale: Le verset associe directement la Pâque à une fête de sept jours. La traduction préserve cette formulation et la tension éventuelle avec les distinctions établies ailleurs, sans harmonisation implicite.
translation_notes:
  register: Français international moderne, digne et accessible. « Vous célébrerez » rend idiomatiquement la portée cultuelle de « sera pour vous » ; « on mangera » conserve l’indétermination du passif hébreu. La ponctuation maintient l’apposition entre la Pâque et la fête de sept jours.
