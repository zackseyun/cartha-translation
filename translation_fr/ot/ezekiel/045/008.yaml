  text: לָ/אָ֛רֶץ יִֽהְיֶה לּ֥/וֹ לַֽ/אֲחֻזָּ֖ה בְּ/יִשְׂרָאֵ֑ל וְ/לֹא יוֹנ֨וּ ע֤וֹד נְשִׂיאַ/י֙ אֶת עַמִּ֔/י וְ/הָ/אָ֛רֶץ יִתְּנ֥וּ לְ/בֵֽית יִשְׂרָאֵ֖ל לְ/שִׁבְטֵי/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/008.yaml
  text: This land shall belong to him as a possession in Israel. And my princes shall no longer oppress my people[a], but they shall give the land to the house of Israel according to their tribes.
translation:
  language: fr
  text: Quant au pays, il constituera pour lui un domaine en Israël. Mes princes n’opprimeront plus mon peuple, mais ils attribueront le pays à la maison d’Israël selon leurs tribus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָאָרֶץ
  choice: Cette terre
  rationale: Le syntagme placé en tête introduit la terre comme thème. « Cette terre » reprend naturellement la portion mentionnée dans le contexte.
- source_word: יִהְיֶה לּוֹ לַאֲחֻזָּה
  choice: sera sa propriété
  rationale: La tournure hébraïque « être à lui comme possession » exprime une possession foncière durable; cette formulation française est claire et concise.
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: La préposition a ici son sens locatif ordinaire.
- source_word: יוֹנוּ עוֹד
  choice: n’opprimeront plus
  rationale: Le hifil de ינה désigne ici l’abus ou l’exploitation exercés par des dirigeants; avec la négation et עוֹד, il marque la cessation de cette oppression.
- source_word: נְשִׂיאַי
  choice: Mes princes
  rationale: Dans Ézéchiel, נָשִׂיא est un titre politique. « Princes » conserve ce titre et son lien avec le prince évoqué dans le contexte.
- source_word: עַמִּי
  choice: mon peuple
  rationale: Cette expression d’alliance se traduit directement et naturellement ainsi.
- source_word: וְהָאָרֶץ יִתְּנוּ
  choice: mais ils attribueront le pays
  rationale: « Mais » rend le contraste implicite entre l’oppression passée et la juste répartition attendue. Dans ce contexte foncier, « attribuer » exprime plus précisément qu’un simple « donner » l’idée d’allotir le territoire.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: à la maison d’Israël
  rationale: Cette formulation conserve la désignation prophétique traditionnelle et la texture littéraire du texte.
- source_word: לְשִׁבְטֵיהֶם
  choice: à chacune de ses tribus
  rationale: Cette formulation française rend clairement le sens distributif de l’hébreu tout en rattachant les tribus à la maison d’Israël.
theological_decisions:
- issue: Référent du pronom dans « sa propriété »
  choice: Le pronom renvoie au prince mentionné dans le contexte immédiat.
  alternative: Un dirigeant générique ou la fonction princière considérée collectivement.
  rationale: Le contexte d’Ézéchiel 45 traite de la portion réservée au prince. Le maintien du pronom, sans explicitation dans le verset, laisse le contexte déterminer son référent.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le titre « princes » et l’expression prophétique « maison d’Israël », tout en employant « attribuer » pour rendre naturellement la répartition foncière.
