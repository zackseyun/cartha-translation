  text: All the people of the land shall give this contribution to the prince in Israel[a][b].
translation:
  language: fr
  text: Tout le peuple du pays apportera cette contribution au prince en Israël[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Tout le peuple du pays sera pour cette contribution au prince en Israël. » La tournure hébraïque signifie probablement que le peuple doit fournir au prince cette contribution fixée.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « contribution » désigne une part mise à part ou une offrande. Selon que l’on souligne l’aspect cultuel ou civique, on pourrait aussi traduire par « offrande » ou « tribut ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל הָעָם הָאָרֶץ
  choice: Tout le peuple du pays
  rationale: Cette expression désigne l’ensemble de la population du pays. « Le peuple du pays » conserve la tournure hébraïque, naturelle dans ce contexte juridique et prophétique.
- source_word: יִהְיוּ אֶל
  choice: apportera
  rationale: Littéralement, « sera pour/vers ». Dans le contexte d’une contribution fixée, cette tournure indique que le peuple doit la fournir. « Apportera » rend clairement l’action implicite sans effacer l’expression littérale, signalée en note.
- source_word: הַתְּרוּמָה
  choice: contribution
  rationale: תְּרוּמָה désigne une part mise à part, souvent destinée à un usage sacré ou officiel. « Contribution » maintient ici l’articulation entre les dimensions cultuelle et civique.
- source_word: הַזֹּאת
  choice: cette
  rationale: Le démonstratif renvoie à la contribution précisée dans les versets précédents.
- source_word: לַנָּשִׂיא
  choice: au prince
  rationale: Dans Ézéchiel, נָשִׂיא désigne habituellement le dirigeant civil appelé « prince », sans l’identifier nécessairement comme roi. La préposition marque ici le destinataire ou bénéficiaire de la contribution.
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: Cette traduction conserve directement la préposition hébraïque et situe la fonction du prince dans la communauté d’Israël.
