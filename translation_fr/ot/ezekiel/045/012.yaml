  register: Français international moderne, sobre et prescriptif. Les unités anciennes sont conservées sous leurs formes françaises usuelles. L’énumération inhabituelle de la mine reste visible dans le texte, sans être reformulée silencieusement en « soixante sicles » ; la note en explicite le total.
