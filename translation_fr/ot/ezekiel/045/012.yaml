  text: וְ/הַ/שֶּׁ֖קֶל עֶשְׂרִ֣ים גֵּרָ֑ה עֶשְׂרִ֨ים שְׁקָלִ֜ים חֲמִשָּׁ֧ה וְ/עֶשְׂרִ֣ים שְׁקָלִ֗ים עֲשָׂרָ֤ה וַ/חֲמִשָּׁה֙ שֶׁ֔קֶל הַ/מָּנֶ֖ה יִֽהְיֶ֥ה לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/012.yaml
  text: And the shekel shall be twenty gerahs[a]; twenty shekels, twenty-five shekels[b], and fifteen shekels shall be your mina.
translation:
  language: fr
  text: Le sicle vaudra vingt guéras[a] ; votre mine sera de vingt sicles, vingt-cinq sicles et quinze sicles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La guéra était une petite unité de poids ou de valeur ; vingt guéras formaient ici un sicle.
    reason: cultural_note
  - marker: b
    text: L’hébreu énumère « vingt sicles, vingt-cinq sicles et quinze sicles », soit un total de soixante sicles. Ce calcul diffère d’autres évaluations anciennes de la mine et semble indiquer la norme propre à la législation du temple dans Ézéchiel.
    reason: cultural_note
lexical_decisions:
- source_word: הַשֶּׁקֶל
  choice: le sicle
  rationale: « Sicle » est le terme français traditionnel et intelligible pour cette ancienne unité de poids et de valeur ; l’article signale ici une unité étalon.
- source_word: גֵּרָה
  choice: guéras
  rationale: Cette petite unité ancienne est translittérée plutôt que convertie approximativement en une mesure moderne.
- source_word: שְׁקָלִים / שֶׁקֶל
  choice: sicles
  rationale: Le même nom d’unité est conservé dans toute l’énumération ; après quinze, le singulier hébreu est rendu par le pluriel exigé en français.
- source_word: חֲמִשָּׁה וְעֶשְׂרִים
  choice: vingt-cinq
  rationale: L’ordre naturel des nombres en français moderne remplace l’ordre littéral « cinq et vingt ».
- source_word: עֲשָׂרָה וַחֲמִשָּׁה
  choice: quinze
  rationale: Forme numérique courante en français pour l’expression hébraïque littérale « dix et cinq ».
- source_word: הַמָּנֶה
  choice: mine
  rationale: « Mine » est le nom français conventionnel de cette unité ancienne supérieure de poids ou de valeur.
- source_word: יִהְיֶה לָכֶם
  choice: votre mine sera
  rationale: Cette formulation exprime naturellement la norme prescrite aux destinataires tout en conservant la relation possessive portée par לָכֶם.
