  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֣ם הַ/חַטָּ֗את וְ/נָתַן֙ אֶל מְזוּזַ֣ת הַ/בַּ֔יִת וְ/אֶל אַרְבַּ֛ע פִּנּ֥וֹת הָ/עֲזָרָ֖ה לַ/מִּזְבֵּ֑חַ וְ/עַ֨ל מְזוּזַ֔ת שַׁ֖עַר הֶ/חָצֵ֥ר הַ/פְּנִימִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/019.yaml
  text: And the priest shall take some of the blood of the sin offering and put it on the doorposts of the temple[a], on the four corners of the altar ledge, and on the doorposts of the gate of the inner court.
translation:
  language: fr
  text: Le prêtre prendra du sang du sacrifice pour le péché[a] et en mettra sur le montant de la porte du Temple, sur les quatre angles de la bordure de l’autel et sur le montant de la porte de la cour intérieure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de purification ». Le terme hébreu peut désigner, dans les rites sacrificiels, le sacrifice lié au péché et à la purification.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח הַכֹּהֵן
  choice: Le prêtre prendra
  rationale: Le parfait avec waw, dans cette série de prescriptions rituelles, exprime l’action à accomplir. Le futur français est naturel et conserve le singulier de « prêtre ».
- source_word: מִדַּם
  choice: du sang
  rationale: La préposition מִן indique qu’une partie du sang est prélevée. En français, « prendre du sang » exprime naturellement cette valeur partitive.
- source_word: הַחַטָּאת
  choice: le sacrifice pour le péché
  rationale: Dans ce contexte cultuel, le terme désigne le sacrifice associé au péché et à la purification, non le péché abstrait. La variante fonctionnelle est signalée en note.
- source_word: וְנָתַן
  choice: et en mettra
  rationale: נתן signifie ici appliquer ou déposer le sang sur les éléments désignés. Le pronom « en » reprend naturellement « du sang ».
- source_word: אֶל מְזוּזַת הַבַּיִת
  choice: sur le montant de la porte du Temple
  rationale: מְזוּזָה est morphologiquement singulier et désigne le montant d’une entrée. הַבַּיִת renvoie ici au bâtiment du sanctuaire, rendu clairement par « Temple ».
- source_word: אַרְבַּע פִּנּוֹת הָעֲזָרָה לַמִּזְבֵּחַ
  choice: les quatre angles de la bordure de l’autel
  rationale: פִּנּוֹת signifie « angles » ou « coins ». Dans la description architecturale d’Ézéchiel, עֲזָרָה désigne vraisemblablement une bordure ou plate-forme associée à l’autel, sans justifier « cornes ».
- source_word: מְזוּזַת שַׁעַר הֶחָצֵר הַפְּנִימִית
  choice: le montant de la porte de la cour intérieure
  rationale: Le singulier hébreu est conservé. « Cour intérieure » est le terme français courant pour cette partie du complexe du Temple.
theological_decisions:
- issue: Sens cultuel de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: « Sacrifice pour le péché » garde le lien lexical avec le péché et reste immédiatement compréhensible. « Sacrifice de purification » met davantage en avant la fonction purificatrice du rite; cette nuance légitime est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le futur prescriptif convient au contexte rituel. Les singuliers de מְזוּזַת sont conservés plutôt que transformés en pluriels; « Temple » explicite le référent de « la maison » dans la vision d’Ézéchiel.
