id: EZK.45.22
reference: Ezekiel 45:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עָשָׂ֤ה הַ/נָּשִׂיא֙ בַּ/יּ֣וֹם הַ/ה֔וּא בַּעֲד֕/וֹ וּ/בְעַ֖ד כָּל עַ֣ם הָ/אָ֑רֶץ פַּ֖ר חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/022.yaml
  text: On that day the prince shall provide[a], for himself and for all the people of the land, a bull as a sin offering.
translation:
  language: fr
  text: Ce jour-là, le prince offrira, pour lui-même et pour tout le peuple du pays, un taureau en sacrifice pour le péché.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un taureau en sacrifice de purification ». Le mot hébreu חַטָּאת peut désigner le sacrifice qui enlève le péché ou l’impureté.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: offrira
  rationale: Dans ce contexte sacrificiel, עשה désigne l’accomplissement ou la présentation du sacrifice. « Offrira » exprime naturellement cet acte cultuel sans ajouter l’idée distincte que le prince se contente de fournir l’animal.
- source_word: הַנָּשִׂיא
  choice: le prince
  rationale: Dans la vision d’Ézéchiel, נָשִׂיא désigne le dirigeant civil doté d’une fonction précise. « Le prince » conserve cette désignation caractéristique.
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Rendu temporel direct, idiomatique et naturel en français moderne.
- source_word: בַּעֲדוֹ
  choice: pour lui-même
  rationale: בעד avec suffixe indique ici la personne au bénéfice ou en faveur de laquelle le sacrifice est offert.
- source_word: וּבְעַד כָּל עַם הָאָרֶץ
  choice: et pour tout le peuple du pays
  rationale: La formulation conserve la portée représentative de בעד et rend עַם הָאָרֶץ par son sens collectif général dans ce contexte.
- source_word: פַּר
  choice: un taureau
  rationale: פַּר désigne un taureau destiné au sacrifice; le texte ne précise pas explicitement qu’il est jeune.
- source_word: חַטָּאת
  choice: en sacrifice pour le péché
  rationale: Le nom désigne ici nécessairement une offrande sacrificielle. Cette formulation française reste claire et familière, tout en laissant la note signaler la valeur possible de purification.
theological_decisions:
- issue: Sens cultuel de חַטָּאת
  choice: sacrifice pour le péché
  alternative: sacrifice de purification
  rationale: L’objet, « un taureau », montre qu’il s’agit du sacrifice qui traite le péché ou l’impureté, et non du péché abstrait. Le texte principal conserve la terminologie biblique courante, tandis que la note préserve l’autre nuance lexicale reconnue.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit étroitement l’ordre et les relations du texte hébreu, avec une formulation cultuelle naturelle.
