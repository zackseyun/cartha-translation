  text: וְ/לַ/נָּשִׂ֡יא מִ/זֶּ֣ה וּ/מִ/זֶּה֩ לִ/תְרוּמַ֨ת הַ/קֹּ֜דֶשׁ וְ/לַ/אֲחֻזַּ֣ת הָ/עִ֗יר אֶל פְּנֵ֤י תְרֽוּמַת הַ/קֹּ֨דֶשׁ֙ וְ/אֶל פְּנֵי֙ אֲחֻזַּ֣ת הָ/עִ֔יר מִ/פְּאַת יָ֣ם יָ֔מָּ/ה וּ/מִ/פְּאַת קֵ֖דְמָ/ה קָדִ֑ימָ/ה וְ/אֹ֗רֶךְ לְ/עֻמּוֹת֙ אַחַ֣ד הַ/חֲלָקִ֔ים מִ/גְּב֥וּל יָ֖ם אֶל גְּב֥וּל קָדִֽימָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/007.yaml
  text: And for the prince there shall be land on both sides of the holy district and the property of the city[a], adjoining the holy district and adjoining the property of the city, from the west side westward and from the east side eastward; and in length corresponding to one of the tribal portions[b], from the western border to the eastern border.
translation:
  language: fr
  text: Au prince reviendra un territoire de part et d’autre de la zone sacrée[a] et de la propriété de la ville, en bordure de la zone sacrée et de la propriété de la ville, s’étendant, du côté ouest, vers l’ouest, et, du côté est, vers l’est. Sa longueur correspondra à celle de l’une des parts tribales, de la frontière occidentale à la frontière orientale[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « le prélèvement sacré » ou « la part sacrée réservée ». Ici, l’expression désigne une étendue de terre mise à part.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie littéralement « mer » pour désigner l’ouest. Dans les descriptions territoriales d’Ézéchiel, la mer sert de repère pour cette direction.
    reason: cultural_note
lexical_decisions:
- source_word: לַנָּשִׂיא
  choice: Au prince reviendra
  rationale: Dans Ézéchiel, נָשִׂיא désigne habituellement le dirigeant civil, traditionnellement appelé « prince ». La tournure exprime naturellement l’attribution foncière.
- source_word: מִזֶּה וּמִזֶּה
  choice: de part et d’autre
  rationale: Cette expression idiomatique rend clairement la distribution du territoire sur les deux côtés de la zone centrale.
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  choice: la zone sacrée
  rationale: Dans ce contexte cadastral, תְּרוּמָה désigne une étendue de terre mise à part plutôt qu’une offrande mobilière. « Zone sacrée » est naturel et garde l’idée de consécration.
- source_word: אֲחֻזַּת הָעִיר
  choice: la propriété de la ville
  rationale: אֲחֻזָּה désigne ici une possession foncière. Cette formulation est claire dans un contexte de répartition territoriale.
- source_word: אֶל־פְּנֵי ... וְאֶל־פְּנֵי
  choice: le long de ... et de
  rationale: Dans cette description de limites, l’expression indique que le territoire fait face aux deux parcelles et les longe. La traduction évite le littéralisme obscur « devant la face de ».
- source_word: מִפְּאַת יָם יָמָּה
  choice: du côté ouest vers l’ouest
  rationale: יָם, littéralement « mer », sert ici de désignation directionnelle pour l’ouest. La répétition spatiale de l’hébreu est conservée.
- source_word: וּמִפְּאַת קֵדְמָה קָדִימָה
  choice: du côté est vers l’est
  rationale: La formulation française maintient le parallélisme cadastral avec le côté occidental.
- source_word: וְאֹרֶךְ לְעֻמּוֹת אַחַד הַחֲלָקִים
  choice: Sa longueur correspondra à celle de l’une des parts attribuées aux tribus
  rationale: לְעֻמּוֹת exprime une correspondance ou un alignement. Le contexte montre que les חֲלָקִים sont les parts territoriales des tribus; l’explicitation rend le référent accessible.
- source_word: מִגְּבוּל יָם אֶל־גְּבוּל קָדִימָה
  choice: de la frontière occidentale à la frontière orientale
  rationale: Cette traduction idiomatique rend toute l’étendue est-ouest décrite par la formule hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. Le vocabulaire foncier reste précis sans reproduire les tournures cadastrales hébraïques de manière artificielle; le parallélisme ouest-est et la portée territoriale sont néanmoins préservés.
