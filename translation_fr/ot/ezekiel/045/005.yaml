base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/005.yaml
  text: And an area twenty-five thousand long and ten thousand wide shall be for the Levites[a], the ministers of the house, for their possession[b], with twenty chambers.
translation:
  language: fr
  text: Une portion de vingt-cinq mille de long et de dix mille de large appartiendra aux Lévites, qui assurent le service de la Maison[a] ; elle sera leur propriété, avec vingt salles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « la Maison » désigne le Temple.
    reason: cultural_note
  - marker: b
    text: 'La syntaxe de la fin du verset est difficile en hébreu. On peut aussi comprendre : « comme leur propriété, pour vingt salles » ou « comme leur propriété comportant vingt salles ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַחֲמִשָּׁה וְעֶשְׂרִים אֶלֶף אֹרֶךְ
  choice: vingt-cinq mille unités de long
  rationale: Le nombre est rendu selon l’ordre naturel du français moderne. Le texte ne précise pas ici l’unité de mesure; « unités » évite de laisser entendre qu’il s’agit de personnes ou d’objets tout en préservant cette indétermination.
- source_word: וַעֲשֶׂרֶת אֲלָפִים רֹחַב
  choice: sur dix mille de large
  rationale: Cette formulation française exprime naturellement la seconde dimension du territoire, sans ajouter d’unité absente du texte hébreu.
- source_word: יהיה לַלְוִיִּם
  choice: appartiendra aux lévites
  rationale: L’imparfait hébreu et la préposition marquent ici l’attribution de cette portion aux lévites dans les dispositions de la vision.
- source_word: מְשָׁרְתֵי הַבַּיִת
  choice: qui assurent le service de la Maison
  rationale: Cette tournure exprime la fonction cultuelle des lévites sans importer le sens ecclésiastique moderne du mot « ministres ».
- source_word: הַבַּיִת
  choice: la Maison
  rationale: Le sens littéral est conservé, tandis qu’une majuscule signale son emploi comme désignation du Temple; une note explicite le référent.
- source_word: לָהֶם לַאֲחֻזָּה
  choice: ce sera leur propriété
  rationale: אֲחֻזָּה désigne un bien foncier détenu en propre; la formulation est claire et naturelle en français.
- source_word: עֶשְׂרִים לְשָׁכֹת
  choice: avec vingt salles
  rationale: לְשָׁכוֹת désigne des pièces ou salles, souvent dans un ensemble cultuel. « Avec » propose une lecture intelligible de la syntaxe comprimée, dont la difficulté est signalée en note.
theological_decisions:
- issue: Référent de « la Maison »
  choice: Conserver « la Maison » dans le texte et préciser en note qu’il s’agit du Temple.
  alternative: Traduire directement « le Temple ».
  rationale: Le choix retient l’image lexicale de l’hébreu sans obscurcir son référent cultuel.
- issue: Lien syntaxique de עֶשְׂרִים לְשָׁכֹת
  choice: 'Rattacher la proposition comme un complément: « avec vingt salles ».'
  alternative: Comprendre la fin comme « pour leur propriété, pour vingt salles » ou selon une autre répartition syntaxique.
  rationale: La formulation massorétique est difficile. Le texte principal adopte une lecture possible et fluide, tandis que la note maintient l’incertitude réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation demeure proche des dimensions et de l’attribution foncière du texte hébreu. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
