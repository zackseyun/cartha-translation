    rationale: 'L’hébreu emploie le singulier וְהָיָה, qui reprend la portion sainte: « elle sera pour eux ». La reformulation française n’altère pas substantiellement le sens, mais la conservation du sujet singulier est à la fois plus proche du texte et plus cohérente avec « Elle sera destinée ».'
