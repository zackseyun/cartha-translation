  text: קֹ֣דֶשׁ מִן הָ/אָ֜רֶץ ה֗וּא לַ/כֹּ֨הֲנִ֜ים מְשָׁרְתֵ֤י הַ/מִּקְדָּשׁ֙ יִֽהְיֶ֔ה הַ/קְּרֵבִ֖ים לְ/שָׁרֵ֣ת אֶת יְהוָ֑ה וְ/הָיָ֨ה לָ/הֶ֤ם מָקוֹם֙ לְ/בָ֣תִּ֔ים וּ/מִקְדָּ֖שׁ לַ/מִּקְדָּֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/004.yaml
  text: It is a holy portion of the land; it shall be for the priests[a], the ministers of the sanctuary, who draw near to minister to Yahweh. And it shall be for them as a place for houses and as a holy place for the sanctuary.
translation:
  language: fr
  text: C’est une portion sainte du pays. Elle sera destinée aux prêtres, ceux qui assurent le service du sanctuaire et qui s’approchent pour servir Yahweh. Elle sera pour eux un emplacement pour leurs maisons et un lieu consacré au sanctuaire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque est concise et peut aussi se traduire : « et un sanctuaire pour le sanctuaire ». Elle semble désigner un espace consacré appartenant au sanctuaire ou l’entourant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֶשׁ מִן הָאָרֶץ
  choice: une portion sainte du pays
  rationale: Dans ce contexte de partage territorial, קֹדֶשׁ désigne une part de terrain mise à part comme sacrée, et מִן a une valeur partitive.
- source_word: מְשָׁרְתֵי הַמִּקְדָּשׁ
  choice: ceux qui assurent le service du sanctuaire
  rationale: Cette formulation naturelle en français exprime le service cultuel sans évoquer indûment une catégorie particulière de clergé chrétien.
- source_word: הַקְּרֵבִים לְשָׁרֵת
  choice: qui s’approchent pour servir
  rationale: « S’approcher » conserve la nuance cultuelle de l’accès sacerdotal, tandis que « servir » rend simplement le verbe שׁרת.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend explicitement le nom divin présent dans le texte hébreu.
- source_word: מָקוֹם לְבָתִּים
  choice: un emplacement pour leurs maisons
  rationale: Le possessif est implicite dans l’attribution aux prêtres; « emplacement » convient naturellement à un espace résidentiel dans un partage foncier.
- source_word: וּמִקְדָּשׁ לַמִּקְדָּשׁ
  choice: et un lieu consacré au sanctuaire
  rationale: La formule hébraïque est compacte et difficile. Cette traduction distingue le secteur consacré du sanctuaire lui-même sans ajouter une précision architecturale absente du texte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve au lieu de le remplacer par un titre.
- issue: Nature du premier מִקְדָּשׁ dans וּמִקְדָּשׁ לַמִּקְדָּשׁ
  choice: un lieu consacré
  alternative: un sanctuaire
  rationale: Le parallélisme avec l’espace destiné aux maisons suggère ici une aire sacrée liée au sanctuaire, mais l’ambiguïté lexicale est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Les phrases ont été légèrement segmentées pour assurer la clarté de la longue proposition hébraïque, tout en préservant le vocabulaire cultuel et l’ambiguïté de la dernière expression.
