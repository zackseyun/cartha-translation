  rationale: La seule modification apporte une correspondance plus directe avec le singulier hébreu et l’attribution de la portion aux prêtres. Le rendu prudent de la dernière expression et sa note sont conservés, car le sens exact du premier « sanctuaire » dans cette formule est discuté.
