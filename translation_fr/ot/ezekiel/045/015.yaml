base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/015.yaml
  text: and one sheep from every two hundred from the well-watered pastures of Israel[a], for a grain offering and for a burnt offering and for peace offerings, to make atonement for them, declares the Lord GOD.
translation:
  language: fr
  text: On prélèvera aussi un animal du petit bétail sur deux cents du troupeau, provenant des pâturages bien arrosés d’Israël[a], pour l’offrande de céréales, l’holocauste et les sacrifices de paix, afin de faire l’expiation pour eux — déclaration du Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des terres irriguées d’Israël » ou « des riches pâturages d’Israël ». L’expression hébraïque renvoie probablement à des terres de pâture bien alimentées en eau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֶׂה אַחַת מִן הַצֹּאן מִן הַמָּאתַיִם
  choice: une bête du petit bétail sur deux cents
  rationale: שֶׂה peut désigner un mouton ou une chèvre, sans préciser ici l’âge ni le sexe. « Une bête du petit bétail » préserve cette extension sémantique, tandis que « sur deux cents » exprime clairement le taux du prélèvement.
- source_word: מִמַּשְׁקֵה יִשְׂרָאֵל
  choice: parmi les pâturages bien arrosés d’Israël
  rationale: מַשְׁקֶה se rapporte littéralement à l’abreuvement ou à l’irrigation et désigne vraisemblablement ici, par métonymie, les terres où paissent les troupeaux. La formulation française rend ce cadre agricole tout en signalant en note l’incertitude lexicale.
- source_word: לְמִנְחָה
  choice: pour l’offrande de céréales
  rationale: Dans cette série sacrificielle, מִנְחָה désigne naturellement l’offrande végétale, traditionnellement composée de farine ou de céréales.
- source_word: וּלְעוֹלָה
  choice: l’holocauste
  rationale: עוֹלָה est le terme cultuel usuel pour le sacrifice entièrement consumé; « holocauste » est son équivalent français biblique établi.
- source_word: וְלִשְׁלָמִים
  choice: les sacrifices de paix
  rationale: שְׁלָמִים désigne des sacrifices liés à la paix ou au bien-être. « Sacrifices de paix » conserve la portée du terme sans la réduire à la seule communion.
- source_word: לְכַפֵּר עֲלֵיהֶם
  choice: afin de faire l’expiation pour eux
  rationale: Le verbe כפר a ici sa valeur cultuelle. « Faire l’expiation » en préserve la force sans préciser un mécanisme théologique particulier.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: נְאֻם marque une parole divine solennelle. « Yahweh » transcrit le nom propre divin, tandis que « Seigneur » rend אֲדֹנָי et évite le redoublement artificiel « Seigneur SEIGNEUR ».
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte hébreu associe le titre אֲדֹנָי au nom propre יהוה. La traduction conserve les deux éléments distincts plutôt que de remplacer le nom par un autre titre.
- issue: Portée de כפר dans le contexte sacrificiel
  choice: faire l’expiation pour eux
  alternative: les purifier rituellement
  rationale: Le contexte cultuel autorise plusieurs nuances, notamment expiation et purification. La formulation retenue garde le terme théologique large et traditionnel sans trancher exclusivement en faveur d’une théorie ou d’un effet rituel particulier.
translation_notes:
  register: Français international moderne, digne et lisible. « On prélèvera » explicite naturellement la valeur prescriptive du fragment nominal dans son contexte. Le terme collectif « petit bétail » évite de limiter שֶׂה aux seuls moutons.
