- from: On prélèvera aussi une bête du petit bétail sur deux cents, parmi les pâturages bien arrosés d’Israël[a], pour l’offrande de céréales, l’holocauste et les sacrifices de paix, afin de faire l’expiation pour eux — déclaration du Seigneur Yahweh.
  to: On prélèvera aussi un animal du petit bétail sur deux cents du troupeau, provenant des pâturages bien arrosés d’Israël[a], pour l’offrande de céréales, l’holocauste et les sacrifices de paix, afin de faire l’expiation pour eux — déclaration du Seigneur Yahweh.
  rationale: La révision rétablit explicitement le lien avec le troupeau et clarifie que les animaux proviennent des pâturages ou terres bien arrosés. Elle maintient l’ambiguïté lexicale de מַשְׁקֶה dans la note et ne modifie ni les termes cultuels ni le sens de la déclaration divine.
