  text: וּ/מִנְחָ֗ה אֵיפָ֥ה לַ/פָּ֛ר וְ/אֵיפָ֥ה לָ/אַ֖יִל יַֽעֲשֶׂ֑ה וְ/שֶׁ֖מֶן הִ֥ין לָ/אֵיפָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/024.yaml
  text: And as the grain offering[a], he shall provide an ephah for each bull and an ephah for each ram, and a hin of oil for each ephah.
translation:
  language: fr
  text: Comme offrande de céréales, il fournira un épha pour chaque taureau et un épha pour chaque bélier, ainsi qu’un hin d’huile pour chaque épha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu signifie littéralement « faire » et peut aussi se traduire ici par « préparera » ou « présentera ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: offrande de céréales
  rationale: Dans ce contexte sacrificiel, le terme désigne l’offrande végétale ou céréalière plutôt qu’un don générique.
- source_word: אֵיפָה
  choice: épha
  rationale: Cette unité de mesure pour les matières sèches est conservée afin de respecter la terminologie cultuelle du texte.
- source_word: לַפָּר
  choice: pour chaque taureau
  rationale: Dans cette prescription, l’article a une valeur générique et la quantité indiquée s’applique distributivement à chaque animal.
- source_word: לָאַיִל
  choice: pour chaque bélier
  rationale: La formulation distributive exprime clairement la quantité requise par bélier.
- source_word: יַעֲשֶׂה
  choice: il fournira
  rationale: Le verbe signifie littéralement « faire », mais, dans ce contexte sacrificiel, il désigne naturellement le fait de préparer ou de fournir l’offrande prescrite.
- source_word: שֶׁמֶן
  choice: huile
  rationale: L’hébreu dit simplement « huile »; préciser qu’il s’agit d’huile d’olive ajouterait une information implicite mais non exprimée.
- source_word: הִין
  choice: hin
  rationale: Cette unité de mesure pour les liquides est conservée afin de préserver la précision et le vocabulaire technique du texte.
- source_word: לָאֵיפָה
  choice: pour chaque épha
  rationale: La préposition exprime ici le rapport prescrit entre la quantité d’huile et chaque mesure de céréales.
theological_decisions: []
