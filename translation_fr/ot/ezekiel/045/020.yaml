  text: וְ/כֵ֤ן תַּֽעֲשֶׂה֙ בְּ/שִׁבְעָ֣ה בַ/חֹ֔דֶשׁ מֵ/אִ֥ישׁ שֹׁגֶ֖ה וּ/מִ/פֶּ֑תִי וְ/כִפַּרְתֶּ֖ם אֶת הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/020.yaml
  text: And so you shall do on the seventh day of the month for anyone who sins unintentionally or through simplicity[b][a]; thus you shall make atonement for the temple.
translation:
  language: fr
  text: Tu feras de même le septième jour du mois, à cause de toute personne qui s’égare et de toute personne naïve[a] ; vous ferez ainsi l’expiation pour le temple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu peut distinguer deux catégories de personnes : « la personne qui s’égare » et « la personne naïve ». פֶּתִי peut aussi se traduire par « simple » ou « inexpérimentée ». Certains comprennent l’expression comme visant une faute commise par inadvertance ou par naïveté.'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « la maison », c’est-à-dire ici le temple ou le sanctuaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  choice: Vous ferez de même
  rationale: L’expression renvoie au rite prescrit au verset précédent et introduit une action correspondante. « De même » rend ce lien avec naturel.
- source_word: תַּעֲשֶׂה
  choice: vous ferez
  rationale: Le verbe courant עשה désigne ici l’accomplissement du rite prescrit. Le futur français convient à la valeur directive du contexte.
- source_word: בְּשִׁבְעָה בַחֹדֶשׁ
  choice: le septième jour du mois
  rationale: La formule hébraïque est elliptique ; « jour » est explicité en français pour éviter de comprendre « le septième mois ».
- source_word: מֵאִישׁ
  choice: pour toute personne
  rationale: אִישׁ est au masculin singulier, mais sa portée est générique ici. « Toute personne » exprime cette portée sans la limiter aux hommes.
- source_word: שֹׁגֶה
  choice: qui aura commis une faute par inadvertance
  rationale: Le participe de שגה évoque le fait de s’égarer ou de fauter involontairement. « Commettre une faute par inadvertance » convient au contexte cultuel sans préciser indûment la nature exacte de la faute.
- source_word: וּמִפֶּתִי
  choice: ou par naïveté
  rationale: פֶּתִי désigne une personne simple, naïve ou inexpérimentée. La formulation principale comprend l’expression comme une seconde cause possible de la faute, tandis que la note conserve la possibilité de deux catégories de personnes.
- source_word: וְכִפַּרְתֶּם
  choice: Vous ferez ainsi l’expiation
  rationale: Dans ce contexte sacerdotal, כפר exprime l’expiation ou la purification rituelle. « Faire l’expiation » reste transparent et traditionnel sans développer une théorie théologique absente du verset.
- source_word: הַבָּיִת
  choice: le temple
  rationale: Littéralement « la maison », le terme désigne ici le temple ou sanctuaire de la vision d’Ézéchiel. « Le temple » rend le référent immédiatement compréhensible.
theological_decisions:
- issue: Portée du rite d’expiation
  choice: Le rite est accompli pour le temple à cause de fautes humaines commises par inadvertance ou naïveté.
  alternative: Le rite serait accompli directement en faveur des personnes concernées.
  rationale: Le complément direct de וְכִפַּרְתֶּם est « la maison », c’est-à-dire le temple. La traduction maintient néanmoins le lien entre sa purification rituelle et les fautes des personnes sans expliquer davantage ce lien.
- issue: Une catégorie de faute ou deux catégories de personnes
  choice: La formulation principale présente l’inadvertance et la naïveté comme deux circonstances possibles.
  alternative: L’hébreu peut distinguer « celui qui s’égare » de « la personne naïve ».
  rationale: La syntaxe hébraïque permet une lecture distributive avec deux catégories de personnes. Cette ambiguïté réelle est signalée en note plutôt que supprimée.
- issue: Portée du masculin singulier אִישׁ
  choice: toute personne
  alternative: un homme
  rationale: Le substantif masculin singulier a ici une fonction générique. La traduction française en restitue la portée sans restriction sexuelle indue.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation demeure accessible tout en conservant le vocabulaire cultuel d’« expiation ». Les notes rendent visibles l’expression hébraïque « la maison » et l’ambiguïté syntaxique concernant la personne qui s’égare et la personne naïve.
