  naturalness: Le français révisé demeure naturel dans un registre biblique moderne. Le passage du singulier au pluriel est inhabituel en français, mais il correspond à celui de l’hébreu et doit être maintenu.
  terminology: « Expiation » convient à כפר dans ce contexte cultuel, sans imposer une interprétation doctrinale. « Temple » explicite justement הַבַּיִת dans la vision d’Ézéchiel. « Personne naïve » restitue פֶּתִי de façon accessible; la note indique l’autre analyse possible.
