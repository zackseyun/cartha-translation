  text: Then I looked[a], and behold, a hand was stretched out toward me, and behold, in it was a scroll.
translation:
  language: fr
  text: Je regardai, et voici qu’une main était tendue vers moi ; et voici que, dans cette main, se trouvait un rouleau[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un rouleau de livre » ; l’expression hébraïque désigne un document en forme de rouleau.'
    reason: Préciser la forme littérale de מְגִלַּת סֵפֶר tout en conservant dans le texte principal une formulation française naturelle.
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: Je regardai
  rationale: Le wayyiqtol fait progresser le récit et introduit une nouvelle perception visuelle. Le passé simple convient au registre narratif soutenu sans être archaïque.
- source_word: וְהִנֵּה
  choice: et voici que / et voici que
  rationale: La répétition de הִנֵּה attire vivement l’attention d’abord sur la main, puis sur ce qu’elle contient. La conserver respecte le relief prophétique du texte.
- source_word: יָד
  choice: une main
  rationale: Le texte nomme simplement une main sans en préciser le propriétaire ; la traduction garde cette indétermination.
- source_word: שְׁלוּחָה
  choice: était tendue
  rationale: Dans ce contexte visuel, le participe passif de שלח décrit naturellement une main étendue en direction du prophète.
- source_word: אֵלָי
  choice: vers moi
  rationale: La préposition אֶל exprime ici la direction de la main.
- source_word: בּוֹ
  choice: elle contenait
  rationale: Cette formulation française rapporte naturellement le rouleau à la main présentée, sans ajouter l’identité de celui qui la tend. Elle rend de façon idiomatique l’idée de présence « en elle ».
- source_word: מְגִלַּת סֵפֶר
  choice: un rouleau
  rationale: L’expression construite désigne idiomatiquement un document sous forme de rouleau. « Un rouleau » est naturel en français, tandis que la forme plus littérale est signalée en note.
theological_decisions:
- issue: Identité du propriétaire de la main
  choice: Ne pas préciser à qui appartient la main
  alternative: la main de Dieu ou celle d’un messager céleste
  rationale: L’hébreu dit seulement « une main ». En identifier le propriétaire introduirait une interprétation absente du verset.
translation_notes:
  register: Français moderne, digne et narratif. Le passé simple convient au récit prophétique écrit. La double formule « et voici que » reproduit l’insistance visuelle de l’hébreu sans identifier la main.
