    text: 'Littéralement : « un rouleau de livre » ; l’expression hébraïque désigne un document en forme de rouleau.'
    reason: Préciser la forme littérale de מְגִלַּת סֵפֶר tout en conservant dans le texte principal une formulation française naturelle.
  revision_rationale: La révision remplace « elle contenait » par une tournure locative plus idiomatique et plus proche de la présentation visuelle du texte. Elle maintient l’indétermination quant au propriétaire de la main et conserve le choix naturel de « rouleau », explicité par la note.
