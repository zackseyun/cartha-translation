reference: Ezekiel 2:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֗/י בֶּן אָדָם֙ שׁוֹלֵ֨חַ אֲנִ֤י אֽוֹתְ/ךָ֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל גּוֹיִ֥ם הַ/מּוֹרְדִ֖ים אֲשֶׁ֣ר מָרְדוּ בִ֑/י הֵ֤מָּה וַ/אֲבוֹתָ/ם֙ פָּ֣שְׁעוּ בִ֔/י עַד עֶ֖צֶם הַ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/003.yaml
  text: And he said to me[a], “Son of man, I am sending you to the sons of Israel, to the rebellious nations that have rebelled against me; they and their fathers have transgressed against me to this very day.”
translation:
  language: fr
  text: 'Il me dit : « Fils d’homme[a], je t’envoie vers les Israélites, vers les nations rebelles qui se sont rebellées contre moi. Eux et leurs pères se sont révoltés contre moi jusqu’à ce jour même. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « être humain » ou « mortel ».
    reason: Alternative lexicale pour בֶּן אָדָם.
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Conserve la forme de l’adresse prophétique récurrente dans Ézéchiel et ses résonances intertextuelles, tandis que la note indique des équivalents de sens possibles.
- source_word: שׁוֹלֵחַ אֲנִי אֹתְךָ
  choice: je t’envoie
  rationale: Le participe accompagné du pronom explicite exprime avec vivacité la mission en cours de formulation; le présent français convient naturellement à cette commission.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Rend naturellement en français moderne l’expression hébraïque désignant les descendants, hommes et femmes, d’Israël, sans suggérer que seuls les fils masculins sont visés.
- source_word: גּוֹיִם
  choice: nations
  rationale: Conserve le terme frappant appliqué ici à Israël et évite de l’atténuer en simple désignation du peuple.
- source_word: הַמּוֹרְדִים / מָרְדוּ בִי
  choice: rebelles / se sont rebellées contre moi
  rationale: Maintient la répétition de la racine hébraïque et son accusation insistante; l’accord féminin correspond à « nations ».
- source_word: פָּשְׁעוּ בִי
  choice: se sont révoltés contre moi
  rationale: Distingue ce second verbe de מרד tout en gardant l’idée forte d’une rupture coupable et délibérée envers Dieu.
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour même
  rationale: Restitue l’intensification de l’expression temporelle sans traduire littéralement l’idiome hébreu.
theological_decisions:
- issue: L’emploi de גּוֹיִם pour désigner Israël
  choice: Conserver « nations »
  alternative: « peuple » ou « Israélites » à la seconde occurrence
  rationale: Le texte formule volontairement une accusation saisissante en appliquant à Israël un terme souvent employé pour les nations; la traduction ne doit pas neutraliser cette tension.
- issue: Le sens de l’adresse בֶּן אָדָם
  choice: Employer « Fils d’homme » dans le texte
  alternative: « être humain » ou « mortel »
  rationale: Dans Ézéchiel, il s’agit de l’adresse divine au prophète, non d’une identification christologique explicite. La forme traditionnelle préserve néanmoins le motif récurrent et la portée intertextuelle; les autres valeurs lexicales figurent en note.
- issue: La distinction entre מרד et פשע
  choice: Employer successivement « se rebeller » et « se révolter »
  alternative: Répéter « se rebeller » ou traduire פשע par « pécher »
  rationale: Deux verbes français proches mais distincts préservent à la fois la cohérence de l’accusation et la variation du texte hébreu, sans réduire פשע au terme général « pécher ».
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde la répétition rhétorique de « rebelles / rebellées » et l’étonnant pluriel « nations », tout en rendant בְּנֵי יִשְׂרָאֵל par l’expression collective naturelle « les Israélites ».
