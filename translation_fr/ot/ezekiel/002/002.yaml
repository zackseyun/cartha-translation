id: EZK.2.2
reference: Ezekiel 2:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/תָּ֧בֹא בִ֣/י ר֗וּחַ כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר אֵלַ֔/י וַ/תַּעֲמִדֵ֖/נִי עַל רַגְלָ֑/י וָ/אֶשְׁמַ֕ע אֵ֖ת מִדַּבֵּ֥ר אֵלָֽ/י־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/002.yaml
  text: And the Spirit entered into me when he spoke to me[a], and set me on my feet[b]; and I heard the one speaking to me.
translation:
  language: fr
  text: L'Esprit entra en moi pendant qu'il me parlait[a] et me fit tenir debout. Alors j'entendis celui qui me parlait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un esprit entra en moi ». Le mot hébreu peut signifier « esprit », « vent » ou « souffle »; ici, le contexte favorise l''Esprit de Dieu qui donne à Ézéchiel la force d''accomplir sa mission.'
    reason: alternative_reading
lexical_decisions:
- source_word: ר֗וּחַ
  choice: l'Esprit
  rationale: Dans le contexte de l'appel prophétique d'Ézéchiel, le terme désigne très probablement l'Esprit de Dieu qui lui donne la force de se tenir debout. L'absence d'article en hébreu laisse toutefois possible la traduction « un esprit ».
- source_word: וַתָּבֹא בִי
  choice: entra en moi
  rationale: La construction בוא + ב exprime ici un mouvement vers l'intérieur; cette formulation conserve l'image d'une puissance qui pénètre le prophète.
- source_word: כַּאֲשֶׁר דִּבֶּר אֵלַי
  choice: pendant qu'il me parlait
  rationale: Le contexte et la valeur temporelle de כַאֲשֶׁר permettent de représenter l'action comme simultanée à la parole adressée au prophète.
- source_word: וַתַּעֲמִדֵנִי עַל רַגְלָי
  choice: me fit tenir debout
  rationale: Le hifil de עמד est causatif. Cette tournure française naturelle exprime que l'Esprit rend Ézéchiel capable de se tenir sur ses pieds.
- source_word: וָאֶשְׁמַע
  choice: Alors j'entendis
  rationale: « Alors » explicite naturellement en français la progression narrative du wayyiqtol sans en modifier le sens.
- source_word: אֵת מִדַּבֵּר אֵלָי
  choice: celui qui me parlait
  rationale: Le participe substantivé désigne la personne en train de parler; la proposition relative est naturelle en français et conserve cette construction.
theological_decisions:
- issue: Référent de רוּחַ
  choice: l'Esprit, compris comme l'Esprit de Dieu
  alternative: un esprit
  rationale: Dans cette scène de vocation, l'Esprit rend le prophète capable de se relever et d'écouter. La majuscule et l'article rendent ce référent contextuel probable sans développer une doctrine ultérieure; la note conserve l'indétermination grammaticale de l'hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. « Me fit tenir debout » est plus naturel que le calque « me plaça sur mes pieds ». L'imparfait dans « pendant qu'il me parlait » et « celui qui me parlait » rend la simultanéité et la valeur durative du participe.
