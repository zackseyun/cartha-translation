source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֵלָ֑/י בֶּן אָדָם֙ עֲמֹ֣ד עַל רַגְלֶ֔י/ךָ וַ/אֲדַבֵּ֖ר אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/001.yaml
  text: And he said to me[a], “Son of man, stand on your feet, and I will speak to you.”
translation:
  language: fr
  text: 'Il me dit : « Fils d’homme, tiens-toi debout, et je te parlerai[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je parlerai avec toi ». La construction hébraïque peut exprimer une parole adressée à quelqu’un ou un échange avec lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָי
  choice: Il me dit
  rationale: Le wayyiqtol narratif se rend naturellement au passé simple en français. « Dire » correspond précisément à אמר dans cette formule d’introduction au discours.
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Cette traduction littérale conserve la formule d’adresse caractéristique adressée à Ézéchiel, sans la réduire à « humain » ou à « mortel » ni lui imposer une lecture christologique ultérieure.
- source_word: עֲמֹד עַל רַגְלֶיךָ
  choice: tiens-toi debout
  rationale: Cette formulation française naturelle exprime l’ordre de prendre une position verticale tout en conservant l’idée concrète de se tenir sur ses pieds.
- source_word: וַאֲדַבֵּר אֹתָךְ
  choice: et je te parlerai
  rationale: Après l’impératif, la forme verbale annonce l’action qui suivra. « Je te parlerai » est idiomatique et laisse au contexte la relation entre parole adressée et échange, tandis qu’une note signale l’autre rendu possible.
theological_decisions:
- issue: Traduction de בֶּן אָדָם dans Ézéchiel
  choice: Fils d’homme
  alternative: Humain ; mortel
  rationale: Le maintien de l’expression hébraïque préserve son rôle littéraire récurrent et sa portée théologique ouverte, sans importer dans ce verset une identification confessionnelle étrangère au contexte immédiat.
- issue: Portée relationnelle de דּבר avec אֵת
  choice: je te parlerai
  alternative: je parlerai avec toi
  rationale: La construction peut présenter la parole comme adressée à Ézéchiel ou comme un échange avec lui. Le texte principal adopte le français le plus naturel, et la note conserve explicitement l’autre nuance.
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient au récit biblique écrit ; « tiens-toi debout » évite le calque moins naturel « tiens-toi sur tes pieds ». La ponctuation rend clairement l’adresse directe.
