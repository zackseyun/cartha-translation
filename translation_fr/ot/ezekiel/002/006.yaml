  to: Mais toi, fils d’homme, n’aie pas peur d’eux ni de leurs paroles, même si tu es au milieu de ronces et d’épines[a] et que tu habites parmi des scorpions. N’aie pas peur de leurs paroles et ne te laisse pas abattre par leur mine[b], car c’est une maison rebelle.
