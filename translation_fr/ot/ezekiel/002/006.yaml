  text: וְ/אַתָּ֣ה בֶן אָ֠דָם אַל תִּירָ֨א מֵ/הֶ֜ם וּ/מִ/דִּבְרֵי/הֶ֣ם אַל תִּירָ֗א כִּ֣י סָרָבִ֤ים וְ/סַלּוֹנִים֙ אוֹתָ֔/ךְ וְ/אֶל עַקְרַבִּ֖ים אַתָּ֣ה יוֹשֵׁ֑ב מִ/דִּבְרֵי/הֶ֤ם אַל תִּירָא֙ וּ/מִ/פְּנֵי/הֶ֣ם אַל תֵּחָ֔ת כִּ֛י בֵּ֥ית מְרִ֖י הֵֽמָּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/006.yaml
  text: But you[a], son of man, do not fear them, and do not fear their words, though briers and thorns are with you and you sit among scorpions. Do not fear their words, and do not be dismayed by their faces[b], for they are a rebellious house.
translation:
  language: fr
  text: Mais toi, fils d’homme, n’aie pas peur d’eux ni de leurs paroles, même si tu es au milieu de ronces et d’épines[a] et que tu habites parmi des scorpions. N’aie pas peur de leurs paroles et ne te laisse pas abattre par leur mine[b], car c’est une maison rebelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « même si des rebelles et des épines sont avec toi ». Le mot hébreu rendu par « ronces » est difficile et a reçu plusieurs interprétations ; les images voisines des épines et des scorpions favorisent toutefois celle d’une plante épineuse et dangereuse.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « devant leurs visages ». L’expression peut désigner leur mine ou leur présence intimidante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: Conserve l’adresse idiomatique masculine qui revient tout au long d’Ézéchiel et sa force rhétorique.
- source_word: תִּירָא
  choice: n’aie pas peur
  rationale: Rend naturellement l’interdiction répétée en français moderne tout en conservant sa structure.
- source_word: דִּבְרֵיהֶם
  choice: leurs paroles
  rationale: Maintient le nom concret et sa répétition, sans réduire l’expression à une paraphrase.
- source_word: סָרָבִים וְסַלּוֹנִים
  choice: des ronces et des épines
  rationale: Préserve l’image végétale dangereuse, favorisée par l’association immédiate avec les scorpions, tout en signalant l’incertitude du premier terme en note.
- source_word: אוֹתָךְ
  choice: t’entourent
  rationale: Explicite naturellement en français la situation hostile exprimée de façon elliptique en hébreu, sans changer la métaphore.
- source_word: עַקְרַבִּים
  choice: scorpions
  rationale: Équivalent lexical direct qui conserve l’image de danger.
- source_word: יוֹשֵׁב
  choice: tu habites parmi
  rationale: Dans ce contexte, le participe décrit la situation durable du prophète; «habites» est plus naturel que le littéral «es assis» en français.
- source_word: מִפְּנֵיהֶם
  choice: par leur visage
  rationale: Conserve l’image concrète de leur visage ou de leur mine intimidante, expliquée en note.
- source_word: תֵּחָת
  choice: ne sois pas terrifié
  rationale: Exprime l’idée d’être abattu ou brisé par l’intimidation et se distingue légèrement de l’interdiction répétée d’avoir peur.
- source_word: בֵּית מְרִי
  choice: une communauté rebelle
  rationale: Rend le sens collectif de «maison» en français courant sans transformer l’expression en simple abstraction.
theological_decisions:
- issue: Sens de אָדָם dans l’adresse בֶן אָדָם
  choice: fils d’homme
  alternative: être humain; mortel
  rationale: Il s’agit de l’adresse divine récurrente et masculine donnée à Ézéchiel; la formulation traditionnelle reste intelligible et respecte l’expression source.
- issue: Force métaphorique des images hostiles
  choice: Conserver les ronces, les épines et les scorpions
  alternative: Paraphraser en parlant simplement de personnes hostiles ou rebelles
  rationale: Les images prophétiques structurent le verset et doivent rester visibles plutôt que d’être aplaties en une affirmation abstraite.
- issue: Valeur collective de בֵּית מְרִי
  choice: une communauté rebelle
  alternative: une maison rebelle; une maison de rébellion
  rationale: «Communauté» communique ici la désignation collective d’Israël sans introduire de précision confessionnelle; «maison» serait plus formel mais moins immédiatement naturel.
translation_notes:
  register: Français international moderne, naturel et digne. Les répétitions de « leurs paroles » et de l’interdiction d’avoir peur sont conservées. L’imagerie concrète demeure au premier plan, avec les ambiguïtés lexicales importantes signalées en notes.
