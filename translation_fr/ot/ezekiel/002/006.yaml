    issue: « des ronces et des épines t’entourent »
    rationale: Le verbe « entourer » ajoute l’idée d’encerclement. L’hébreu présente une construction elliptique dont le sens de base est que les ronces et épines sont avec le prophète; la formulation française doit éviter de renforcer cette relation spatiale.
  - severity: medium
    issue: « car ils sont une communauté rebelle »
    rationale: Cette formulation explique le collectif mais remplace « maison », métaphore et expression caractéristique du livre (בֵּית מְרִי). Une traduction peut rester naturelle tout en préservant ce terme.
