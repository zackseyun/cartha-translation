  text: וַ/יִּפְרֹ֤שׂ אוֹתָ/הּ֙ לְ/פָנַ֔/י וְ/הִ֥יא כְתוּבָ֖ה פָּנִ֣ים וְ/אָח֑וֹר וְ/כָת֣וּב אֵלֶ֔י/הָ קִנִ֥ים וָ/הֶ֖גֶה וָ/הִֽי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/010.yaml
  text: And he spread it out before me[a], and it was written on the front and on the back[b]; and written on it were lamentations and mourning and woe.
translation:
  language: fr
  text: 'Il la déploya devant moi. Elle était écrite au recto et au verso[a] ; il y était écrit : complaintes, gémissements et malheur[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « sur ses deux faces » ; traduction traditionnelle : « à l’intérieur et à l’extérieur ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « lamentations, gémissements et malheur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרֹשׂ
  choice: Il la déploya
  rationale: Le verbe פרשׂ exprime l’action d’étendre ou de déployer. « Déploya » convient à l’ouverture du rouleau sans préciser excessivement qu’il l’aurait entièrement déroulé.
- source_word: לְפָנַי
  choice: devant moi
  rationale: Rend directement et naturellement la relation spatiale exprimée par l’hébreu.
- source_word: כְתוּבָה
  choice: Elle était écrite
  rationale: Reproduit le participe passif de כתב, avec le féminin renvoyant en français au rouleau mentionné au verset précédent.
- source_word: פָּנִים וְאָחוֹר
  choice: au recto et au verso
  rationale: Littéralement « face et dos » ; cette formulation indique clairement que les deux faces du rouleau portaient du texte, sans adopter l’interprétation traditionnelle « à l’intérieur et à l’extérieur ».
- source_word: וְכָתוּב אֵלֶיהָ
  choice: on y avait écrit
  rationale: Formulation française naturelle qui conserve le caractère indéfini de l’auteur de l’inscription et introduit son contenu.
- source_word: קִנִים
  choice: complaintes
  rationale: Le terme désigne des lamentations ou chants funèbres. « Complaintes » garde ici la nuance de compositions de deuil et le registre solennel.
- source_word: הֶגֶה
  choice: gémissements
  rationale: Le nom évoque le fait de gémir, de murmurer ou de se lamenter. « Gémissements » en préserve la dimension vocale et le distingue de קִנִים.
- source_word: הִי
  choice: malheur
  rationale: Terme de lamentation et d’annonce funeste ; « malheur » convient au langage prophétique et à la série nominale.
theological_decisions:
- issue: Rendu de la triade décrivant le contenu du rouleau
  choice: complaintes, gémissements et malheur
  alternative: lamentations, deuil et malheur
  rationale: Le choix maintient trois termes distincts et cumulatifs de lamentation et de jugement, sans préciser davantage la nature du malheur ni importer une interprétation doctrinale.
- issue: Description des deux faces du rouleau
  choice: au recto et au verso
  alternative: à l’intérieur et à l’extérieur
  rationale: L’hébreu dit littéralement « face et dos ». Le rendu choisi conserve l’idée d’une écriture sur les deux faces, tandis que l’alternative traditionnelle dépend de la manière dont on se représente le rouleau.
translation_notes:
  register: Français international moderne, clair et digne. « Recto et verso » est précis et courant ; « complaintes » conserve la solennité funèbre de קִנִים, tandis que « gémissements » préserve la valeur sonore de הֶגֶה. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
