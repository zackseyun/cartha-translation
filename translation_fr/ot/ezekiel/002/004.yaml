id: EZK.2.4
reference: Ezekiel 2:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הַ/בָּנִ֗ים קְשֵׁ֤י פָנִים֙ וְ/חִזְקֵי לֵ֔ב אֲנִ֛י שׁוֹלֵ֥חַ אוֹתְ/ךָ֖ אֲלֵי/הֶ֑ם וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֥/י יְהֹוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/004.yaml
  text: And the children are hard-faced and hard-hearted[a]; I am sending you to them, and you shall say to them[b], ‘Thus says the Lord GOD.’
translation:
  language: fr
  text: 'Ces fils ont le visage dur et le cœur obstiné[a]. Moi, je t’envoie vers eux, et tu leur diras : « Voici ce que dit le Seigneur Yahvé[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « durs de visage et forts de cœur », expression qui décrit des gens effrontés et obstinés.'
    reason: Précision sur l’expression idiomatique hébraïque.
  - marker: b
    text: 'Ou : « le Seigneur DIEU ». Le titre hébreu est Adonaï YHWH.'
    reason: Signalement d’une convention alternative pour rendre le nom divin.
lexical_decisions:
- source_word: וְהַבָּנִים
  choice: Ces fils
  rationale: Le nom masculin pluriel signifie littéralement « les fils ». Dans le contexte, il désigne la génération actuelle des Israélites; le démonstratif français rattache naturellement le groupe à ceux qui viennent d’être mentionnés.
- source_word: קְשֵׁי פָנִים
  choice: ont le visage dur
  rationale: Cette formulation conserve l’image concrète de l’hébreu, littéralement « durs de visage », qui exprime l’effronterie et la résistance.
- source_word: וְחִזְקֵי לֵב
  choice: le cœur obstiné
  rationale: Littéralement « forts de cœur »; dans ce contexte négatif, la force désigne l’obstination et non le courage. « Cœur obstiné » garde l’ancrage corporel de l’expression tout en en rendant clairement le sens.
- source_word: אֲנִי שׁוֹלֵחַ
  choice: Moi, je t’envoie
  rationale: Le pronom explicite suivi du participe souligne celui qui donne la mission et présente l’envoi comme actuel ou imminent.
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: et tu leur diras
  rationale: Dans cette parole de mission, la forme accomplie hébraïque a une valeur prospective et directive, naturellement rendue par le futur français.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Formule française naturelle et solennelle correspondant à la formule prophétique de messager, sans l’archaïsme de « Ainsi parle ».
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahvé
  rationale: « Seigneur » traduit אֲדֹנָי et « Yahvé » représente distinctement le nom divin יהוה, évitant de confondre les deux éléments du titre.
theological_decisions:
- issue: Représentation du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahvé
  alternative: le Seigneur DIEU
  rationale: Le texte associe un titre, אֲדֹנָי, au nom propre divin, יהוה. La traduction retenue rend les deux éléments visibles; une note signale la convention française qui remplace le nom par « DIEU » dans cette combinaison.
- issue: Portée morale des expressions « dur de visage » et « fort de cœur »
  choice: visage dur et cœur obstiné
  alternative: effrontés et obstinés
  rationale: La traduction conserve la tension entre les images corporelles hébraïques et leur sens négatif, sans transformer entièrement les expressions en qualificatifs abstraits.
translation_notes:
  register: Français international actuel, digne et accessible. La formule prophétique reste solennelle, tandis que les images hébraïques sont préservées avec une note explicative.
