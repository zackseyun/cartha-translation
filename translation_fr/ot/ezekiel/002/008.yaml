source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם שְׁמַע֙ אֵ֤ת אֲשֶׁר אֲנִי֙ מְדַבֵּ֣ר אֵלֶ֔י/ךָ אַל תְּהִי מֶ֖רִי כְּ/בֵ֣ית הַ/מֶּ֑רִי פְּצֵ֣ה פִ֔י/ךָ וֶ/אֱכֹ֕ל אֵ֥ת אֲשֶׁר אֲנִ֖י נֹתֵ֥ן אֵלֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/008.yaml
  text: But you[a], son of man, hear what I am speaking to you. Do not be rebellious like the rebellious house. Open your mouth and eat what I am giving you.
translation:
  language: fr
  text: Mais toi, fils d’homme[a], écoute ce que je te dis. Ne sois pas rebelle comme la maison rebelle. Ouvre la bouche et mange ce que je te donne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « être humain » ou « mortel ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: Conserve la formule d’adresse caractéristique et répétée dans Ézéchiel. Dans ce contexte, elle désigne un être humain mortel plutôt qu’un titre christologique.
- source_word: שְׁמַע
  choice: écoute
  rationale: L’impératif appelle une écoute attentive. « Écoute » est plus naturel en français que « entends » tout en évitant de rendre explicitement le verbe par « obéis ».
- source_word: מְדַבֵּר אֵלֶיךָ
  choice: je te dis
  rationale: Rend naturellement en français l’action de parler actuellement au prophète, sans alourdir la phrase par « je suis en train de te parler ».
- source_word: אַל תְּהִי מֶרִי
  choice: Ne sois pas rebelle
  rationale: Le substantif hébreu exprime ici la rébellion comme trait de conduite; l’adjectif français donne une formulation idiomatique fidèle.
- source_word: כְּבֵית הַמֶּרִי
  choice: comme cette communauté rebelle
  rationale: בַּיִת désigne collectivement la maison d’Israël. « Communauté » rend clairement ce sens corporatif en français moderne, tandis que « cette » renvoie au groupe déjà caractérisé dans le contexte.
- source_word: פְּצֵה פִיךָ
  choice: Ouvre la bouche
  rationale: Équivalent français naturel de l’ordre concret d’ouvrir la bouche, le sens d’ouverture ample étant implicite dans l’action qui suit.
- source_word: וֶאֱכֹל
  choice: et mange
  rationale: Préserve la coordination et la succession directe des deux impératifs.
- source_word: אֵת אֲשֶׁר אֲנִי נֹתֵן אֵלֶיךָ
  choice: ce que je te donne
  rationale: Formulation française naturelle qui conserve l’immédiateté de l’action exprimée par le participe נֹתֵן.
theological_decisions:
- issue: Sens de אָדָם dans la formule prophétique בֶן אָדָם
  choice: fils d’homme
  alternative: être humain; mortel
  rationale: La traduction retenue préserve la formule vocative récurrente et sa force littéraire dans Ézéchiel. La note indique son sens anthropologique afin de ne pas imposer ici un titre christologique.
- issue: Sens collectif de בֵית הַמֶּרִי
  choice: cette communauté rebelle
  alternative: la maison rebelle; la maison de rébellion
  rationale: Le mot « maison » désigne ici collectivement Israël. « Communauté » rend ce référent intelligible sans introduire une désignation confessionnelle ni réduire la rébellion à un bâtiment ou à une famille privée.
translation_notes:
  register: Français international moderne, direct et digne. Les impératifs restent nets; la répétition de « rebelle » reproduit l’insistance de l’hébreu. La formule traditionnelle « fils d’homme » est conservée, avec une note qui en précise ici la portée humaine.
