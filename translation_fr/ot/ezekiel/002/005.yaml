  naturalness: La phrase révisée reste naturelle dans un français moderne et conserve un registre biblique sobre. « Maison rebelle » est une métaphore collective inhabituelle en français courant, mais elle est intelligible et préférable ici pour préserver l’expression source.
  terminology: « Prophète », « sauront » et « parmi eux » sont appropriés. La conservation de « maison rebelle » respecte le terme corporatif hébreu et évite de le réduire à une notion sociologique comme « communauté ».
