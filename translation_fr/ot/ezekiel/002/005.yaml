  text: וְ/הֵ֨מָּה֙ אִם יִשְׁמְע֣וּ וְ/אִם יֶחְדָּ֔לוּ כִּ֛י בֵּ֥ית מְרִ֖י הֵ֑מָּה וְ/יָ֣דְע֔וּ כִּ֥י נָבִ֖יא הָיָ֥ה בְ/תוֹכָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/005.yaml
  text: And whether they listen or refuse—for they are a rebellious house—they will know that a prophet has been among them[a][b].
translation:
  language: fr
  text: Qu’ils écoutent ou qu’ils refusent d’écouter — car ils sont une maison rebelle —, ils sauront qu’un prophète a été parmi eux[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « qu’ils entendent ou qu’ils cessent / s’abstiennent » ; l’hébreu oppose « entendre » à « cesser, s’abstenir », ce qui signifie ici refuser de tenir compte du message.
    reason: lexical_alternative
  - marker: b
    text: Ou « a été au milieu d’eux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יִשְׁמְעוּ ... וְאִם יֶחְדָּלוּ
  choice: Qu’ils écoutent ou qu’ils refusent
  rationale: La double construction conditionnelle présente deux réactions possibles sans modifier l’issue. « Écoutent » implique ici l’attention obéissante, tandis que « refusent » rend idiomatiquement יֶחְדָּלוּ, littéralement « cessent/s’abstiennent », dans ce contexte prophétique.
- source_word: בֵּית מְרִי
  choice: une communauté rebelle
  rationale: Littéralement « maison de rébellion ». En français actuel, « communauté » conserve le sens collectif et corporatif de בֵּית sans l’étrangeté de « maison rebelle » appliquée au peuple.
- source_word: וְיָדְעוּ
  choice: ils sauront
  rationale: La forme verbale prend ici une valeur future ou résultative après l’alternative conditionnelle.
- source_word: נָבִיא
  choice: un prophète
  rationale: Traduction directe du nom, avec l’indéfini approprié au contexte.
- source_word: הָיָה בְתוֹכָם
  choice: a été parmi eux
  rationale: Rend naturellement en français l’accompli hébreu et la présence du prophète au sein du peuple, avec sa portée ultérieure.
- source_word: וְהֵמָּה
  choice: Qu’ils
  rationale: Le pronom hébreu antéposé met le peuple en relief. La tournure française concessive « Qu’ils… ou qu’ils… » restitue cette mise en relief et l’indifférence du résultat à leur réponse.
theological_decisions:
- issue: Nature de la réaction du peuple
  choice: Le peuple saura qu’un prophète a été parmi lui, qu’il prête attention au message ou qu’il refuse de le faire.
  alternative: Comprendre יִשְׁמְעוּ comme la simple perception auditive et יֶחְדָּלוּ comme « cesser » sans complément implicite.
  rationale: Dans ce contexte prophétique, le contraste porte sur l’accueil ou le refus du message. La formulation conserve les deux possibilités sans faire dépendre la reconnaissance du prophète de l’obéissance du peuple.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « Qu’ils… ou qu’ils… » exprime naturellement l’alternative concessive. « Communauté rebelle » évite l’ambiguïté moderne de « maison » tout en maintenant la dimension collective de l’expression hébraïque.
