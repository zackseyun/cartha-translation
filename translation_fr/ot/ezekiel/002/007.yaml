reference: Ezekiel 2:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/דִבַּרְתָּ֤ אֶת דְּבָרַ/י֙ אֲלֵי/הֶ֔ם אִֽם יִשְׁמְע֖וּ וְ/אִם יֶחְדָּ֑לוּ כִּ֥י מְרִ֖י הֵֽמָּה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/007.yaml
  text: You shall speak my words to them[a], whether they listen or whether they refuse, for they are rebellious.
translation:
  language: fr
  text: Tu leur diras mes paroles, qu’ils écoutent ou qu’ils refusent d’écouter[a], car ils sont rebelles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’ils entendent ou qu’ils s’en abstiennent ». L’expression hébraïque oppose le fait d’écouter au refus de prêter attention.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבַּרְתָּ
  choice: Tu diras
  rationale: Le parfait qal avec waw, dans ce contexte de mission, exprime une instruction. « Tu diras » conserve la force de l’ordre tout en restant naturel en français.
- source_word: אֶת דְּבָרַי
  choice: mes paroles
  rationale: Le pluriel de דָּבָר avec suffixe de première personne désigne les paroles de Dieu. Le rendu concret « mes paroles » évite la reformulation plus interprétative « mon message ».
- source_word: אֲלֵיהֶם
  choice: leur
  rationale: Le pronom indirect français rend naturellement la direction exprimée par la préposition hébraïque.
- source_word: אִם יִשְׁמְעוּ וְאִם יֶחְדָּלוּ
  choice: qu’ils écoutent ou qu’ils refusent d’écouter
  rationale: La formule oppose l’écoute au refus de prêter attention. « Écoutent » préserve la dimension auditive de שׁמע sans imposer le sens plus fort d’« obéir » ; l’ajout de « d’écouter » après « refusent » explicite en français le complément sous-entendu par l’idiome.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison pour laquelle Ézéchiel doit parler indépendamment de la réaction de ses auditeurs.
- source_word: מְרִי הֵמָּה
  choice: ils sont rebelles
  rationale: מְרִי caractérise ici leur rébellion. Ce rendu prédicatif est idiomatique et n’ajoute pas « maison », absent de ce verset.
theological_decisions:
- issue: Faut-il rendre יִשְׁמְעוּ par « entendre », « écouter » ou « obéir » ?
  choice: écouter
  alternative: entendre ; obéir
  rationale: שׁמע peut impliquer l’obéissance, mais la formule immédiate oppose surtout l’écoute au refus d’écouter. « Écouter » garde cette tension sans réduire le verbe à la simple perception sonore ni expliciter une obéissance que le texte ne formule pas ici.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond à l’adresse divine singulière au prophète. La formulation conserve « mes paroles » et la caractérisation sobre « ils sont rebelles », sans importer « maison rebelle » depuis le contexte voisin.
