source:
  edition: WLC
  text: וְ/נָתַתִּ֨י פָנַ֜/י בָּ/אִ֣ישׁ הַ/ה֗וּא וַ/הֲשִֽׂמֹתִ֨י/הוּ֙ לְ/א֣וֹת וְ/לִ/מְשָׁלִ֔ים וְ/הִכְרַתִּ֖י/ו מִ/תּ֣וֹךְ עַמִּ֑/י וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/008.yaml
  text: And I will set my face against that man[a], and I will make him a sign and a proverb, and I will cut him off from the midst of my people. Then you will know that I am Yahweh.
translation:
  language: fr
  text: Je tournerai mon visage contre cet homme, je ferai de lui un signe et un sujet de proverbes[a], et je le retrancherai du milieu de mon peuple. Alors vous saurez que je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un objet de railleries ». Le terme hébreu peut désigner des proverbes, des formules frappantes ou des paroles moqueuses prononcées au sujet de quelqu’un.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: וְנָתַתִּי פָנַי בָּאִישׁ הַהוּא
  choice: Je tournerai ma face contre cet homme
  rationale: Cette formulation conserve l’image hébraïque de la face divine et exprime une opposition résolue. En français, « tourner sa face contre » convient au registre solennel du jugement.
- source_word: הָאִישׁ הַהוּא
  choice: cet homme
  rationale: Le groupe nominal hébreu est masculin singulier et renvoie à l’individu évoqué dans le contexte.
- source_word: וַהֲשִׂמֹתִיהוּ לְאוֹת
  choice: je ferai de lui un signe
  rationale: Le verbe exprime ici le fait d’établir quelqu’un dans une fonction ou une condition; « faire de lui » est naturel en français. « Signe » garde la portée large de אוֹת sans préciser indûment qu’il s’agit d’un avertissement ou d’un présage.
- source_word: וְלִמְשָׁלִים
  choice: et un sujet de proverbes
  rationale: Le pluriel hébreu est conservé par « proverbes ». L’ajout idiomatique de « sujet de » indique naturellement en français que cet homme deviendra l’objet de paroles mémorables et publiques, sans imposer la nuance plus étroite de la raillerie.
- source_word: וְהִכְרַתִּיו
  choice: et je le retrancherai
  rationale: « Retrancher » préserve l’image forte et la portée judiciaire de כרת, notamment dans les contextes d’exclusion du peuple.
- source_word: מִתּוֹךְ עַמִּי
  choice: du milieu de mon peuple
  rationale: Cette traduction suit de près l’expression spatiale hébraïque tout en restant claire et solennelle en français.
- source_word: וִידַעְתֶּם
  choice: Alors vous saurez
  rationale: '« Alors » rend la valeur consécutive du contexte : le jugement conduira les destinataires à reconnaître qui est Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de conserver le nom personnel présent dans le texte hébreu.
theological_decisions:
- issue: Formule de jugement associée à la face divine
  choice: Je tournerai ma face contre cet homme
  alternative: Je dirigerai ma face contre cet homme
  rationale: Le choix conserve l’anthropomorphisme et la force d’une opposition divine active, sans l’atténuer en simple désapprobation.
- issue: Sens de מְשָׁלִים dans ce contexte de jugement
  choice: un sujet de proverbes
  alternative: un objet de railleries
  rationale: Le contexte autorise une nuance de dérision ou d’opprobre, mais le terme hébreu demeure assez large pour désigner des proverbes, des formules ou des paroles exemplaires. Le texte principal garde cette amplitude et la note signale l’autre nuance plausible.
translation_notes:
  register: Français international moderne, clair et solennel. La syntaxe conserve les trois actes successifs du jugement ainsi que l’image concrète de la face divine. « Retrancher » maintient la gravité du registre biblique sans devenir obscur.
