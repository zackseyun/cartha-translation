language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ֠/הָיוּ שְׁלֹ֨שֶׁת הָ/אֲנָשִׁ֤ים הָ/אֵ֨לֶּה֙ בְּ/תוֹכָ֔/הּ נֹ֖חַ דנאל וְ/אִיּ֑וֹב הֵ֤מָּה בְ/צִדְקָתָ/ם֙ יְנַצְּל֣וּ נַפְשָׁ֔/ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/014.yaml
  text: even if these three men were in its midst—Noah[a], Daniel, and Job—they would deliver only themselves by their righteousness, declares the Lord GOD.
translation:
  language: fr
  text: Même si ces trois hommes se trouvaient au milieu d’elle — Noé, Daniel[a] et Job —, ils ne délivreraient que leur propre vie par leur justice, déclare le Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu דנאל peut aussi être transcrit « Danel »; certains y voient Danel, personnage connu de l’ancien Proche-Orient, plutôt que le Daniel de la Bible.
    reason: Lecture et identification alternatives du nom propre.
lexical_decisions:
- source_word: וְהָיוּ
  choice: Même si ... se trouvaient
  rationale: Dans le contexte de cet oracle de jugement, la forme exprime une concession hypothétique. « Même si » restitue naturellement cette valeur en français.
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: ces trois hommes
  rationale: Le pluriel אֲנָשִׁים désigne explicitement des hommes; la formulation française reste directe et fidèle.
- source_word: בְּתוֹכָהּ
  choice: au milieu d’elle
  rationale: Le suffixe féminin renvoie à l’entité féminine visée dans le contexte, vraisemblablement la terre. Cette formulation conserve le référent grammatical sans l’expliciter abusivement.
- source_word: נֹחַ
  choice: Noé
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: דנאל
  choice: Daniel
  rationale: « Daniel » est la forme biblique française habituelle; l’orthographe consonantique particulière et la lecture possible « Danel » sont signalées en note.
- source_word: וְאִיּוֹב
  choice: et Job
  rationale: Forme française traditionnelle du nom, avec conservation de la conjonction.
- source_word: הֵמָּה
  choice: eux seuls
  rationale: Le pronom indépendant est emphatique. Avec נַפְשָׁם, « eux seuls » exprime clairement qu’ils ne délivreraient personne d’autre.
- source_word: בְצִדְקָתָם
  choice: par leur justice
  rationale: צְדָקָה désigne ici la qualité d’une conduite droite. « Justice » est le correspondant français biblique naturel et conserve la valeur instrumentale de la préposition.
- source_word: יְנַצְּלוּ
  choice: se délivreraient
  rationale: La racine נצל exprime l’action d’arracher au danger ou de délivrer. Le conditionnel convient à l’hypothèse concessive.
- source_word: נַפְשָׁם
  choice: eux seuls
  rationale: נֶפֶשׁ désigne ici leur propre personne ou leur vie. La tournure idiomatique « eux seuls se délivreraient » rend l’exclusivité impliquée par le contexte.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclare le Seigneur Yahweh
  rationale: נְאֻם introduit la formule prophétique « déclare ». אֲדֹנָי est rendu par « le Seigneur » et le nom divin יהוה par « Yahweh », sans les confondre.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: La formulation distingue le titre אֲדֹנָי du nom propre divin יהוה et rend explicitement ce dernier par « Yahweh ».
- issue: Identification de דנאל
  choice: Daniel dans le texte, avec note
  alternative: Danel
  rationale: Le texte hébreu porte דנאל, orthographe qui permet la lecture « Danel » et peut évoquer un personnage ancien du Proche-Orient. La forme conventionnelle « Daniel » est retenue sans masquer l’autre possibilité.
- issue: Portée de la délivrance obtenue par leur justice
  choice: eux seuls se délivreraient
  alternative: ils délivreraient leur propre vie
  rationale: La formulation souligne que leur droiture ne profiterait pas à d’autres, tout en évitant d’élaborer une doctrine générale du mérite au-delà de l’oracle de jugement.
translation_notes:
  register: Français international moderne, digne et lisible. La structure concessive est rendue idiomatiquement; « au milieu d’elle » préserve le renvoi féminin du contexte; la note maintient l’ambiguïté réelle entourant דנאל.
