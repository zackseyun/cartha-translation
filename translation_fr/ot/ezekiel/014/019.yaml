base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/019.yaml
  text: Or if I send a plague against that land and pour out my wrath on it with blood[a], to cut off from it man and beast,
translation:
  language: fr
  text: Ou si j’envoie la peste contre ce pays et que je déverse sur lui ma fureur avec effusion de sang[a], afin d’en retrancher hommes et bêtes,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par le sang versé ». L’hébreu dit littéralement : « dans le sang ».'
    reason: Préserve l’ambiguïté de בְּדָם et indique la formulation littérale, tandis que le texte principal emploie une expression française naturelle.
lexical_decisions:
- source_word: אוֹ
  choice: Ou si
  rationale: Dans la série de jugements hypothétiques des versets 13, 15, 17 et 19, « Ou si » exprime naturellement la nouvelle éventualité conditionnelle.
- source_word: דֶּבֶר
  choice: la peste
  rationale: Le terme désigne une épidémie meurtrière envoyée comme jugement; « la peste » est une formulation française claire et bibliquement établie.
- source_word: אֲשַׁלַּח אֶל־הָאָרֶץ הַהִיא
  choice: j’envoie la peste contre ce pays
  rationale: « Contre » rend la direction hostile du jugement dans ce contexte, tandis que « ce pays » reprend naturellement le territoire déjà évoqué.
- source_word: וְשָׁפַכְתִּי חֲמָתִי
  choice: et que je déverse sur lui ma fureur
  rationale: « Déverser sa fureur » conserve l’image concrète du verbe et l’intensité de חֵמָה; le second « que » rend explicite la coordination à l’intérieur de la condition.
- source_word: בְּדָם
  choice: dans le sang
  rationale: Cette expression garde la formulation brève et saisissante de l’hébreu sans décider si le sang est le moyen du jugement ou son résultat; une explicitation figure en note.
- source_word: לְהַכְרִית מִמֶּנָּה
  choice: afin d’en retrancher
  rationale: « Retrancher » préserve la force judiciaire de כרת et le pronom « en » renvoie avec concision au pays.
- source_word: אָדָם וּבְהֵמָה
  choice: hommes et bêtes
  rationale: Cette paire compacte restitue la formule hébraïque de dévastation totale. Le pluriel générique « hommes » désigne ici les êtres humains, par contraste avec les animaux.
theological_decisions:
- issue: Portée de אָדָם dans la formule de jugement
  choice: hommes
  alternative: êtres humains / population
  rationale: Dans l’expression figée associant אָדָם à בְּהֵמָה, le mot vise l’humanité sans distinction de sexe. « Hommes et bêtes » conserve la concision et le parallélisme de la formule, sans ajouter une précision absente du texte.
- issue: Sens de בְּדָם
  choice: dans le sang
  alternative: par le sang versé / dans un bain de sang
  rationale: L’hébreu reste laconique et permet une nuance instrumentale ou résultative. Le texte principal préserve cette tension, et la note propose l’explicitation la plus probable sans l’imposer.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve la structure conditionnelle ouverte du contexte et la virgule finale, puisque le verset se poursuit syntaxiquement. « Fureur » maintient la gravité du jugement divin; « hommes et bêtes » garde la cadence de la formule hébraïque.
