source:
  edition: WLC
  text: וְ/הִנֵּ֨ה נֽוֹתְרָה בָּ֜/הּ פְּלֵטָ֗ה הַֽ/מּוּצָאִים֮ בָּנִ֣ים וּ/בָנוֹת֒ הִנָּ/ם֙ יוֹצְאִ֣ים אֲלֵי/כֶ֔ם וּ/רְאִיתֶ֥ם אֶת דַּרְכָּ֖/ם וְ/אֶת עֲלִֽילוֹתָ֑/ם וְ/נִחַמְתֶּ֗ם עַל הָֽ/רָעָה֙ אֲשֶׁ֤ר הֵבֵ֨אתִי֙ עַל יְר֣וּשָׁלִַ֔ם אֵ֛ת כָּל אֲשֶׁ֥ר הֵבֵ֖אתִי עָלֶֽי/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/022.yaml
  text: Yet behold[a], a remnant will be left in it—those brought out, sons and daughters. Behold, they are coming out to you, and you will see their way and their deeds; and you will be comforted concerning the disaster that I brought upon Jerusalem[c][b], all that I brought upon it.
translation:
  language: fr
  text: 'Mais voici qu’il y restera des rescapés : des fils et des filles qu’on fera sortir.[a] Les voici qui sortiront pour venir vers vous. Vous verrez leur conduite et leurs actes, et vous serez consolés au sujet du malheur[b] que j’ai fait venir sur Jérusalem, de tout ce que j’ai fait venir sur elle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des fils et des filles ». L’hébreu nomme explicitement les deux sexes plutôt que d’employer un terme générique comme « enfants ».'
    reason: précision lexicale
  - marker: b
    text: Ici, « malheur » désigne la calamité du jugement qui frappe Jérusalem, et non le mal moral.
    reason: précision lexicale
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Mais voici
  rationale: Dans le contexte des jugements annoncés, la conjonction marque un contraste, tandis que הִנֵּה attire fortement l’attention.
- source_word: נוֹתְרָה בָּהּ פְּלֵטָה
  choice: il y restera des rescapés
  rationale: פְּלֵטָה désigne ici un groupe ayant échappé au désastre; « rescapés » est naturel en français et נוֹתְרָה exprime qu’ils subsisteront dans la ville.
- source_word: הַמּוּצָאִים
  choice: que l’on fera sortir
  rationale: 'Le participe hophal de יצא a une valeur causative passive : ces personnes seront amenées ou conduites hors de Jérusalem.'
- source_word: בָּנִים וּבָנוֹת
  choice: des fils et des filles
  rationale: La formulation conserve la mention explicite des deux groupes présente dans l’hébreu.
- source_word: הִנָּם יוֹצְאִים אֲלֵיכֶם
  choice: Les voici qui sortiront pour venir vers vous
  rationale: Cette formulation distingue le mouvement de sortie de Jérusalem de sa direction vers les destinataires.
- source_word: דַּרְכָּם
  choice: leur conduite
  rationale: Dans ce contexte moral et prophétique, דֶּרֶךְ désigne la manière de vivre; « conduite » rend ce sens clairement sans exiger une métaphore peu naturelle.
- source_word: עֲלִילוֹתָם
  choice: leurs actes
  rationale: Le terme désigne leurs actions ou agissements, avec ici une portée morale.
- source_word: וְנִחַמְתֶּם
  choice: vous serez consolés
  rationale: Le niphal de נחם exprime ici la consolation reçue lorsque les destinataires constateront la conduite des rescapés.
- source_word: עַל הָרָעָה
  choice: au sujet du malheur
  rationale: רָעָה désigne ici la calamité infligée à Jérusalem, non le mal moral; « malheur » convient au registre prophétique et garde la force du terme.
- source_word: הֵבֵאתִי עַל יְרוּשָׁלִַם
  choice: que j’ai fait venir sur Jérusalem
  rationale: La tournure causative française rend naturellement l’idiome hébreu et maintient explicitement l’action divine.
- source_word: אֵת כָּל אֲשֶׁר הֵבֵאתִי עָלֶיהָ
  choice: de tout ce que j’ai fait venir sur elle
  rationale: La reprise conserve l’insistance hébraïque sur la totalité du jugement; « elle » reprend naturellement la ville de Jérusalem en français.
theological_decisions:
- issue: Sens de הָרָעָה dans l’affirmation de l’action divine
  choice: malheur
  alternative: mal, calamité, désastre
  rationale: Le contexte parle d’un jugement catastrophique subi par Jérusalem, et non d’un acte moralement mauvais. La traduction préserve néanmoins sans l’atténuer l’affirmation selon laquelle Dieu l’a fait venir.
- issue: Motif de la consolation
  choice: ne pas expliciter la raison au-delà du texte
  alternative: ajouter que la conduite des rescapés démontrera que le jugement était mérité
  rationale: Le contexte peut suggérer cette explication, mais le verset dit seulement que la vue de leur conduite et de leurs actes conduira à la consolation; la traduction laisse subsister cette articulation sans lui imposer une interprétation.
translation_notes:
  register: Français international moderne, clair et digne. « Mais voici » conserve l’effet d’annonce prophétique. « Rescapés » est plus courant que « réchappés » et plus concret que « reste ». La répétition « fait venir » et la reprise finale sont maintenues afin de préserver l’insistance de l’hébreu.
