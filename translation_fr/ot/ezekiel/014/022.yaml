  source_fidelity: 'Le sens général est fidèlement rendu : un groupe survivant demeure à Jérusalem, est amené à en sortir, vient vers les destinataires, et leur conduite mène à la consolation au sujet de la calamité infligée à Jérusalem. « Malheur » convient bien à הָרָעָה dans ce contexte. Toutefois, la note a attribue au groupe « fils et filles » une ambiguïté syntaxique et sémantique que le texte ne requiert pas : l’expression qualifie les rescapés/ceux qui sont amenés dehors et ne suggère pas qu''il s''agirait des enfants d’autres rescapés.'
  naturalness: La formulation est claire et de registre approprié. Une légère réorganisation rend plus nettement en français l’apposition hébraïque entre « rescapés », « fils et filles » et « ceux qu’on fera sortir », sans changer le sens.
