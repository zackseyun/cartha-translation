  text: כִּי֩ כֹ֨ה אָמַ֜ר אֲדֹנָ֣/י יְהֹוִ֗ה אַ֣ף כִּֽי אַרְבַּ֣עַת שְׁפָטַ֣/י הָ/רָעִ֡ים חֶ֠רֶב וְ/רָעָ֞ב וְ/חַיָּ֤ה רָעָה֙ וָ/דֶ֔בֶר שִׁלַּ֖חְתִּי אֶל יְרוּשָׁלִָ֑ם לְ/הַכְרִ֥ית מִמֶּ֖/נָּה אָדָ֥ם וּ/בְהֵמָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/021.yaml
  text: 'For thus says the Lord GOD: How much more when I send my four disastrous judgments against Jerusalem—sword and famine and wild beasts and plague—to cut off from it man and beast![a][b]'
translation:
  language: fr
  text: 'Car ainsi parle le Seigneur Yahweh : À plus forte raison lorsque j’enverrai contre Jérusalem mes quatre jugements désastreux — l’épée, la famine, les bêtes féroces et la peste — afin d’en retrancher les êtres humains et les animaux ![a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes quatre jugements sévères ». L’adjectif hébreu peut signifier ici « mauvais », « nuisibles » ou « désastreux ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la pestilence » pour « la peste ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend les deux éléments du titre composé et conserve le nom divin Yahweh sans produire l’expression maladroite « le Seigneur SEIGNEUR ».
- source_word: אַף כִּי
  choice: À combien plus forte raison, lorsque
  rationale: La locution introduit ici un raisonnement a fortiori fondé sur le verset précédent, plutôt qu’une simple condition.
- source_word: אַרְבַּעַת שְׁפָטַי הָרָעִים
  choice: mes quatre jugements désastreux
  rationale: « Jugements » désigne les actes punitifs de Dieu, et l’adjectif qualifie leur effet calamiteux, non une faute morale en Dieu.
- source_word: חֶרֶב
  choice: l’épée
  rationale: Conserve l’image concrète traditionnelle du jugement plutôt que de l’abstraire en « guerre ».
- source_word: רָעָב
  choice: la famine
  rationale: Équivalent français courant dans une liste de calamités collectives.
- source_word: חַיָּה רָעָה
  choice: les bêtes féroces
  rationale: Exprime des animaux sauvages dangereux sans leur attribuer une perversité morale.
- source_word: דֶבֶר
  choice: la peste
  rationale: Terme français clair et traditionnel pour une épidémie meurtrière dans ce contexte prophétique.
- source_word: שִׁלַּחְתִּי
  choice: j’enverrai
  rationale: Le parfait hébreu se comprend dans cette déclaration comme l’action envisagée avec certitude; le futur français s’accorde naturellement avec « lorsque ».
- source_word: לְהַכְרִית
  choice: afin d’en retrancher
  rationale: Préserve l’idée forte d’élimination exprimée par la racine כרת et son emploi dans les formules de jugement.
- source_word: אָדָם וּבְהֵמָה
  choice: les humains et les animaux
  rationale: Rend la formule collective de manière naturelle, inclusive et exacte en français moderne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre d’alliance tout en distinguant אֲדֹנָי, rendu par « Seigneur ».
- issue: Nature des « mauvais » jugements divins
  choice: jugements désastreux
  alternative: jugements sévères
  rationale: L’adjectif הָרָעִים décrit ici des calamités nuisibles. « Désastreux » maintient cette portée sans laisser entendre que les jugements seraient moralement mauvais.
translation_notes:
  register: Français international moderne, digne et accessible. La structure a fortiori est explicitement conservée; l’énumération solennelle et l’image de « l’épée » restent proches de l’hébreu.
