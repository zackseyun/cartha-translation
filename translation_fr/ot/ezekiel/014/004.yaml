source:
  edition: WLC
  text: לָ/כֵ֣ן דַּבֵּר א֠וֹתָ/ם וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה אִ֣ישׁ אִ֣ישׁ מִ/בֵּ֣ית יִשְׂרָאֵ֡ל אֲשֶׁר֩ יַעֲלֶ֨ה אֶת גִּלּוּלָ֜י/ו אֶל לִבּ֗/וֹ וּ/מִכְשׁ֤וֹל עֲוֺנ/וֹ֙ יָשִׂים֙ נֹ֣כַח פָּנָ֔י/ו וּ/בָ֖א אֶל הַ/נָּבִ֑יא אֲנִ֣י יְהוָ֗ה נַעֲנֵ֧יתִי ל֦/וֹ ב/ה בְּ/רֹ֥ב גִּלּוּלָֽי/ו־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/004.yaml
  text: 'Therefore speak to them and say to them[a], ‘Thus says the Lord GOD: Any man of the house of Israel who brings up his idols into his heart, and sets the stumbling block of his iniquity before his face, and then comes to the prophet—I, Yahweh[c][b], will answer him according to the multitude of his idols.’'
translation:
  language: fr
  text: 'C’est pourquoi, parle-leur et dis-leur : « Voici ce que dit le Seigneur Yahweh : Tout homme de la maison d’Israël qui fait monter ses idoles dans son cœur, qui place devant lui l’obstacle de sa faute, puis vient trouver le prophète, moi, Yahweh, je lui répondrai[a] à la mesure du grand nombre de ses idoles. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La clause hébraïque est difficile. Littéralement, elle peut se comprendre : « je lui répondrai par elle / par cela, dans le grand nombre de ses idoles ». Le pronom féminin a un référent incertain. Le texte traduit la clause dans le sens d’une réponse de Yahweh à la mesure de l’idolâtrie de cet homme; d’autres comprennent « par cela » ou « par elle ».'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque naturellement en français la conséquence tirée du contexte précédent.
- source_word: דַּבֵּר אוֹתָם וְאָמַרְתָּ אֲלֵיהֶם
  choice: parle-leur et dis-leur
  rationale: Conserve le redoublement verbal emphatique de l’hébreu, malgré la construction inhabituelle דַּבֵּר אוֹתָם.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Voici ce que dit le Seigneur Yahweh
  rationale: Formule prophétique idiomatique; « Seigneur Yahweh » distingue le titre אֲדֹנָי du nom divin יְהוָה.
- source_word: אִישׁ אִישׁ
  choice: un homme, quel qu’il soit
  rationale: Rend la répétition distributive sans suggérer qu’il s’agit seulement d’un individu particulier.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: de la maison d’Israël
  rationale: Préserve l’expression familiale et collective traditionnelle.
- source_word: יַעֲלֶה אֶת גִּלּוּלָיו אֶל לִבּוֹ
  choice: fait monter ses idoles dans son cœur
  rationale: Maintient l’image vive et volontaire du causatif de עלה plutôt que de la réduire à une simple pensée intérieure.
- source_word: וּמִכְשׁוֹל עֲוֺנוֹ
  choice: ce qui le fait tomber dans sa faute
  rationale: Exprime en français courant le « piège/obstacle » associé à sa propre faute, tout en gardant l’image de la chute.
- source_word: יָשִׂים נֹכַח פָּנָיו
  choice: place devant lui
  rationale: Rend l’action délibérée et l’image spatiale sans le calque peu naturel « devant son visage ».
- source_word: וּבָא אֶל הַנָּבִיא
  choice: puis vient trouver le prophète
  rationale: Le « puis » explicite sobrement la succession déjà portée par la coordination hébraïque.
- source_word: אֲנִי יְהוָה
  choice: moi, Yahweh
  rationale: Préserve l’accent emphatique du pronom suivi du nom divin.
- source_word: נַעֲנֵיתִי לוֹ
  choice: je lui répondrai
  rationale: Le futur français convient à la déclaration judiciaire divine dans ce contexte, malgré la difficulté morphosyntaxique de la forme hébraïque.
- source_word: בָהּ בְּרֹב גִּלּוּלָיו
  choice: en fonction de cela, selon la multitude de ses idoles
  rationale: Conserve explicitement בָהּ, dont le référent reste obscur, ainsi que la correspondance exprimée par בְּרֹב.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / l’Éternel
  rationale: Transcrit le nom propre dans ses deux occurrences et permet de distinguer אֲדֹנָי יְהוִה (« le Seigneur Yahweh »).
- issue: Portée distributive de אִישׁ אִישׁ
  choice: un homme, quel qu’il soit
  alternative: quiconque / toute personne
  rationale: Préserve à la fois le masculin grammatical du texte et sa valeur distributive, sans introduire une limitation doctrinale supplémentaire.
- issue: Sens de נַעֲנֵיתִי לוֹ בָהּ בְּרֹב גִּלּוּלָיו
  choice: je lui répondrai en fonction de cela, selon la multitude de ses idoles
  alternative: je lui répondrai moi-même à cause de la multitude de ses idoles / je me laisserai consulter par lui malgré la multitude de ses idoles
  rationale: La syntaxe est difficile, surtout בָהּ. Le texte principal conserve cette composante sous une forme prudemment indéterminée plutôt que de résoudre silencieusement la tension en faveur d’une réponse exclusivement judiciaire ou d’une consultation accordée.
translation_notes:
  register: Français moderne, international et digne. La formulation garde les images concrètes du cœur, de la montée et de la chute, tout en évitant les calques les moins naturels. Le nom divin est transcrit « Yahweh ». Le marqueur [a] figure dans le texte principal et correspond à l’unique note.
