    text: 'La clause hébraïque est difficile. Littéralement, elle peut se comprendre : « je lui répondrai par elle / par cela, dans le grand nombre de ses idoles ». Le pronom féminin a un référent incertain. Le texte traduit la clause dans le sens d’une réponse de Yahweh à la mesure de l’idolâtrie de cet homme; d’autres comprennent « par cela » ou « par elle ».'
    reason: alternative_reading
  revision_rationale: La révision améliore la syntaxe française et maintient plus étroitement les images et relations nominales de l’hébreu. Pour la finale textuellement disputée, elle emploie une formulation judiciaire cohérente avec le contexte et l’audit anglais, tout en exposant dans une unique note l’incertitude de בָּהּ et les possibilités de traduction. Aucun ajout doctrinal n’est introduit.
