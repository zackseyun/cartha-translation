  text: And the word of Yahweh came to me, saying,
translation:
  language: fr
  text: 'La parole de Yahweh me fut adressée :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans cette formule prophétique, le verbe היה introduit la venue de la parole divine. La tournure française idiomatique « la parole … fut adressée » rend naturellement cette fonction narrative sans calquer « il arriva ».
- source_word: דְבַר
  choice: La parole
  rationale: Dans les formules prophétiques, דָּבָר désigne la parole ou le message divin. « La parole » conserve l’expression biblique établie et le registre solennel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu fourni.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom objet de « fut adressée » exprime idiomatiquement en français la direction indiquée par אֵלַי, littéralement « vers moi ».
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif introduit les paroles divines qui suivent. En français moderne, les deux-points remplissent naturellement cette fonction sans la lourdeur de « en disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » le représente directement sans lui substituer un titre.
translation_notes:
  register: Français moderne, digne et courant. La formule passive « fut adressée » est naturelle dans le registre prophétique; les deux-points annoncent directement le discours du verset suivant.
