  text: וַ/יָּב֤וֹא אֵלַ/י֙ אֲנָשִׁ֔ים מִ/זִּקְנֵ֖י יִשְׂרָאֵ֑ל וַ/יֵּשְׁב֖וּ לְ/פָנָֽ/י׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/001.yaml
  text: Then some of the elders of Israel came to me and sat before me[a].
translation:
  language: fr
  text: Des hommes d’entre les anciens d’Israël vinrent à moi et s’assirent devant moi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quelques-uns des anciens d’Israël vinrent à moi » ; l’expression hébraïque peut désigner des hommes pris d’entre les anciens, plutôt que l’ensemble des anciens.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּב֤וֹא
  choice: vinrent
  rationale: Le verbe, morphologiquement au singulier parce qu’il précède le sujet pluriel, se traduit naturellement au pluriel en français. Le passé simple convient au récit suivi.
- source_word: אֵלַי
  choice: auprès de moi
  rationale: Cette formulation rend le mouvement vers Ézéchiel et s’accorde naturellement avec la scène où les anciens viennent ensuite siéger devant lui.
- source_word: אֲנָשִׁים
  choice: des hommes
  rationale: Le terme hébreu désigne explicitement des hommes; la traduction conserve cette précision.
- source_word: מִזִּקְנֵי יִשְׂרָאֵל
  choice: parmi les anciens d’Israël
  rationale: La préposition מן indique que ces hommes étaient issus du groupe des anciens, sans suggérer que l’ensemble des anciens était présent.
- source_word: וַיֵּשְׁבוּ
  choice: s’assirent
  rationale: Le sens concret de ישׁב dans ce contexte est celui de prendre place en position assise.
- source_word: לְפָנָי
  choice: devant moi
  rationale: Cette expression française conserve à la fois l’idée de position et celle de présence face au prophète.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. Le passé simple maintient le registre narratif biblique sans archaïsme lexical; la formulation « des hommes parmi les anciens » préserve la structure et la nuance partitive de l’hébreu.
