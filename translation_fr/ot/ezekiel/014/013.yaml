base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/013.yaml
  text: Son of man[a], if a land sins against me by acting unfaithfully, and I stretch out my hand against it and break its supply of bread, and send famine upon it, and cut off from it man and beast[b],
translation:
  language: fr
  text: Fils d’homme, si un pays pèche contre moi en se montrant infidèle, et que j’étende ma main contre lui, que je brise le soutien de son pain[a], que j’y envoie la famine et que j’en retranche les êtres humains et les animaux[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le bâton de son pain ». Cette expression hébraïque désigne le pain comme soutien de la vie, c’est-à-dire l’approvisionnement alimentaire.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « l’humain et la bête », expression qui englobe les êtres humains et les animaux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Formule d’adresse caractéristique d’Ézéchiel; cette traduction consacrée conserve l’image hébraïque et le ton prophétique.
- source_word: אֶרֶץ
  choice: un pays
  rationale: Le nom est indéfini et générique dans cette proposition conditionnelle; « pays » est naturel en français sans imposer l’idée moderne d’un État.
- source_word: תֶחֱטָא לִי
  choice: pèche contre moi
  rationale: Le complément introduit par ל indique ici que la faute est dirigée contre Dieu.
- source_word: לִמְעָל מַעַל
  choice: en se montrant infidèle
  rationale: La construction avec infinitif et nom de même racine souligne une infidélité grave; la formulation française garde sa dimension relationnelle sans préciser indûment la nature de la faute.
- source_word: וְנָטִיתִי יָדִי עָלֶיהָ
  choice: si j’étends la main contre lui
  rationale: Conserve l’image conventionnelle du geste divin de jugement; le pronom masculin reprend naturellement « pays ».
- source_word: וְשָׁבַרְתִּי לָהּ מַטֵּה לָחֶם
  choice: si je brise son bâton de pain
  rationale: Maintient dans le texte l’image concrète de l’hébreu, dont le sens de soutien ou de réserve alimentaire est expliqué en note.
- source_word: וְהִשְׁלַחְתִּי בָהּ רָעָב
  choice: si j’y envoie la famine
  rationale: « Y » rend naturellement בָהּ en français et « famine » exprime le fléau collectif désigné par רָעָב.
- source_word: וְהִכְרַתִּי מִמֶּנָּה
  choice: si j’en retranche
  rationale: « Retrancher » exprime une suppression décisive et conserve la force judiciaire de כרת.
- source_word: אָדָם וּבְהֵמָה
  choice: les humains et les animaux
  rationale: אָדָם a ici un sens collectif; cette formulation moderne restitue clairement l’ensemble des habitants humains et animaux sans ambiguïté de genre.
theological_decisions:
- issue: Nature de la faute exprimée par מַעַל
  choice: une infidélité envers Dieu
  alternative: une faute générale ou une trahison juridique plus étroitement définie
  rationale: L’association de « pécher contre moi » et de la construction intensive לִמְעָל מַעַל évoque une rupture de fidélité envers Dieu, mais le texte ne précise pas la forme exacte de cette infidélité.
- issue: Portée conditionnelle de la série verbale
  choice: répéter « si » devant chaque acte divin
  alternative: coordonner les actes par « et » sous un seul « si » initial
  rationale: Les formes hébraïques poursuivent une même protase conditionnelle jusqu’au verset suivant. La répétition française de « si » rend la syntaxe nette tout en laissant la phrase ouverte, comme dans la source.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase reste suspendue par une virgule, puisque la proposition conditionnelle se poursuit dans les versets suivants. L’image du « bâton de pain » est conservée pour préserver la métaphore hébraïque, avec une note explicative.
