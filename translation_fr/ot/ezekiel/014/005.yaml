  source_fidelity: 'Le projet rend correctement le but de לְמַעַן, l’action énergique de תפשׂ, la désignation collective « la maison d’Israël », l’éloignement exprimé par נָזֹרוּ et l’insistance de כֻּלָּם. La construction בְּלִבָּם demeure réellement difficile : la version principale doit conserver cette indétermination sans donner à entendre que Dieu saisit littéralement Israël « par son cœur » comme par une prise physique.'
