source:
  edition: WLC
  text: לְמַ֛עַן תְּפֹ֥שׂ אֶת בֵּֽית יִשְׂרָאֵ֖ל בְּ/לִבָּ֑/ם אֲשֶׁ֤ר נָזֹ֨רוּ֙ מֵֽ/עָלַ֔/י בְּ/גִלּֽוּלֵי/הֶ֖ם כֻּלָּֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/005.yaml
  text: so that I may seize the house of Israel by their heart[b][a], because all of them have turned away from me through their idols.
translation:
  language: fr
  text: afin que je saisisse la maison d’Israël au cœur[a], car tous se sont détournés de moi par leurs idoles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans son cœur » ou « par son cœur ». L’expression hébraïque est difficile et peut indiquer le domaine ou le moyen par lequel le SEIGNEUR saisit Israël.
    reason: lexical_alternative
  - marker: b
    text: Ou « sont devenus étrangers à moi à cause de leurs idoles ».
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן
  choice: afin que
  rationale: Introduit le but et convient au registre digne du discours divin.
- source_word: תְּפֹשׂ
  choice: je saisisse
  rationale: Le verbe תפשׂ exprime l’action de saisir ou de prendre; la première personne découle du contexte immédiat où Dieu parle.
- source_word: אֶת בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Conserve la désignation collective et relationnelle du peuple plutôt que de la réduire au seul nom « Israël ».
- source_word: בְּלִבָּם
  choice: par son cœur
  rationale: Préserve la préposition potentiellement instrumentale et rend en français le cœur collectif de la maison d’Israël. Une note signale les autres compréhensions possibles de cette expression difficile.
- source_word: אֲשֶׁר
  choice: car
  rationale: Dans ce contexte, la particule introduit la raison ou la circonstance qui motive l’action annoncée.
- source_word: נָזֹרוּ
  choice: se sont détournés
  rationale: Rend clairement en français moderne l’éloignement volontaire ou l’aliénation exprimés par le niphal de זור, sans exclure la nuance d’étrangeté indiquée en note.
- source_word: מֵעָלַי
  choice: de moi
  rationale: Exprime directement la séparation d’avec Dieu; l’idée d’éloignement est déjà portée par le verbe.
- source_word: בְּגִלּוּלֵיהֶם
  choice: par leurs idoles
  rationale: Conserve la valeur possible de moyen de la préposition ב et traduit le terme méprisant qu’Ézéchiel emploie régulièrement pour les idoles.
- source_word: כֻּלָּם
  choice: tous
  rationale: Maintient l’insistance du texte sur la totalité des membres concernés.
theological_decisions:
- issue: La manière dont Dieu saisit Israël au niveau du cœur
  choice: je saisisse la maison d’Israël par son cœur
  alternative: je saisisse la maison d’Israël dans son cœur; je saisisse la maison d’Israël au moyen de son cœur
  rationale: L’hébreu est compact et ambigu. Le texte principal garde la métaphore forte et la possible valeur instrumentale sans la réduire à une simple persuasion intérieure; la note conserve les autres analyses possibles.
- issue: La nature de l’éloignement idolâtre d’Israël
  choice: se sont détournés de moi par leurs idoles
  alternative: se sont rendus étrangers à moi par leurs idoles; se sont éloignés de moi à cause de leurs idoles
  rationale: « Se sont détournés » est naturel en français moderne et exprime la rupture relationnelle, tandis que la note préserve la nuance possible d’aliénation du niphal.
translation_notes:
  register: Français international moderne, clair et digne. Le singulier collectif « son cœur » reprend « la maison d’Israël » et évite une discordance grammaticale, tout en conservant l’image inhabituelle de l’hébreu. Les formulations moins naturelles sont maintenues seulement là où elles protègent une ambiguïté réelle du texte source.
