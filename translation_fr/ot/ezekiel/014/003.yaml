  verdict: revise
  source_fidelity: La première proposition et la question finale rendent bien le texte hébreu. Toutefois, « ce qui les fait trébucher dans leur faute » interprète le génitif « de leur faute/iniquité » comme si l’obstacle les faisait tomber dans la faute. L’hébreu désigne plutôt « l’obstacle / la pierre d’achoppement de leur faute », placé devant leur visage.
  naturalness: « Ont installé ... dans leur cœur » est plus idiomatique en français tout en conservant la métaphore d’une mise en place intérieure. « Me laisserai-je vraiment consulter par eux ? » donne une interrogation rhétorique plus nette et plus digne que le futur proche.
  terminology: « Fils d’homme », « ces hommes », « idoles méprisables » et « faute » conviennent. « Obstacle de leur faute » conserve la construction et l’ambiguïté de מִכְשׁוֹל עֲוֺנָם sans imposer une relation causale absente du texte.
  issues:
