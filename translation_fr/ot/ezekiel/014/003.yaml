base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/003.yaml
  text: Son of man[a], these men have set up their idols in their hearts and have placed the stumbling block of their iniquity before their faces[b]. Should I indeed let myself be consulted by them?
translation:
  language: fr
  text: Fils d’homme, ces hommes ont installé leurs idoles méprisables[a] dans leur cœur et ont placé devant leur visage l’obstacle de leur faute. Me laisserai-je vraiment consulter par eux[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « idoles méprisables » est une appellation particulièrement dédaigneuse des idoles, fréquente dans Ézéchiel.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Est-ce vraiment que je me laisserai consulter par eux ? » La formulation hébraïque intensifie la question et laisse entendre une réponse négative.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Formule d’adresse caractéristique du livre d’Ézéchiel; cette traduction traditionnelle conserve l’image hébraïque et sa résonance littéraire.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: ces hommes
  rationale: Le terme désigne ici les anciens de sexe masculin mentionnés dans le contexte; le masculin précis est donc conservé.
- source_word: הֶעֱלוּ
  choice: ont érigé
  rationale: Le verbe signifie littéralement « faire monter » ou « élever »; avec les idoles et le cœur, il exprime ici leur installation intérieure comme objets d’allégeance.
- source_word: גִלּוּלֵיהֶם
  choice: leurs idoles méprisables
  rationale: גִלּוּלִים est le terme fortement dépréciatif qu’Ézéchiel emploie pour les idoles. « Idoles méprisables » communique cette valeur sans recourir à une formulation française grossière ou obscure.
- source_word: עַל לִבָּם
  choice: dans leur cœur
  rationale: Cette tournure française naturelle exprime l’intériorité morale et religieuse visée par l’image, même si la préposition hébraïque signifie littéralement « sur ».
- source_word: מִכְשׁוֹל עֲוֺנָם
  choice: ce qui les fait trébucher dans leur faute
  rationale: מִכְשׁוֹל désigne un obstacle ou une cause de chute, tandis que עָוֹן peut exprimer la faute, l’iniquité ou la culpabilité. La formulation conserve l’image de la chute et laisse subsister l’étendue sémantique de la faute.
- source_word: נָתְנוּ נֹכַח פְּנֵיהֶם
  choice: placé devant eux
  rationale: Le français idiomatique « devant eux » rend l’orientation délibérée exprimée littéralement par « en face de leur visage ».
- source_word: הַאִדָּרֹשׁ אִדָּרֵשׁ לָהֶם
  choice: Vais-je vraiment me laisser consulter par eux ?
  rationale: Le niphal de דרש concerne ici le fait d’être consulté pour obtenir une réponse divine. La construction intensive donne à la question une forte portée rhétorique sans transformer la réponse négative implicite en déclaration explicite.
theological_decisions:
- issue: Réponse de Dieu à des idolâtres qui viennent chercher une parole auprès de lui
  choice: 'La question reste rhétorique : « Vais-je vraiment me laisser consulter par eux ? »'
  alternative: « Me laisserai-je donc consulter par eux ? » ou « Est-ce que je vais seulement répondre à leurs consultations ? »
  rationale: L’infinitif absolu suivi de l’imparfait intensifie l’interrogation et appelle, dans le contexte, une réponse négative. La traduction préserve toutefois la forme interrogative du texte au lieu d’ajouter un « non » explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’adresse prophétique « Fils d’homme », le caractère masculin précis de « ces hommes », la métaphore du cœur et de la chute, ainsi que la question rhétorique finale. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
