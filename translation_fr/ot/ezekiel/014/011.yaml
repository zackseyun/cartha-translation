  text: לְ֠מַעַן לֹֽא יִתְע֨וּ ע֤וֹד בֵּֽית יִשְׂרָאֵל֙ מֵ/אַֽחֲרַ֔/י וְ/לֹֽא יִטַּמְּא֥וּ ע֖וֹד בְּ/כָל פִּשְׁעֵי/הֶ֑ם וְ/הָ֥יוּ לִ֣/י לְ/עָ֗ם וַֽ/אֲנִי֙ אֶהְיֶ֤ה לָ/הֶם֙ לֵֽ/אלֹהִ֔ים נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/011.yaml
  text: so that the house of Israel may no longer go astray from me[a], and may no longer defile themselves with all their transgressions, but may be my people, and I may be their God, declares the Lord GOD.
translation:
  language: fr
  text: afin que la maison d’Israël ne s’égare plus en se détournant de moi[a] et ne se souille plus par toutes ses révoltes, et qu’ils soient mon peuple, et que moi, je sois leur Dieu — oracle du Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne s’égare plus de derrière moi » ; cette expression évoque le fait de cesser de suivre Yahweh.'
    reason: Précise l’image hébraïque de מֵאַחֲרַי, que la formulation française idiomatique explicite.
lexical_decisions:
- source_word: לְמַעַן
  choice: afin que
  rationale: Introduit le but visé; « afin que » conserve clairement la valeur finale tout en restant naturel en français.
- source_word: יִתְעוּ ... מֵאַחֲרַי
  choice: ne s’égare plus loin de moi
  rationale: תעה exprime l’égarement, tandis que מֵאַחֲרַי signifie littéralement « de derrière moi » et évoque l’abandon de la marche à la suite de Dieu. La formulation française garde l’image relationnelle sans être artificielle.
- source_word: יִטַּמְּאוּ
  choice: ne se rende plus impure
  rationale: La forme réfléchie indique une impureté contractée par leurs propres actes; la tournure préserve les dimensions morale et cultuelle.
- source_word: בְּכָל פִּשְׁעֵיהֶם
  choice: par toutes ses révoltes
  rationale: פשע désigne des transgressions ayant une forte nuance de rébellion. « Par » rend ici la valeur instrumentale de בְּ.
- source_word: וְהָיוּ לִי לְעָם
  choice: ils seront mon peuple
  rationale: Rend naturellement la formule d’alliance. Le futur français exprime ici le résultat voulu dans la proposition introduite par « afin que ».
- source_word: וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: et moi, je serai leur Dieu
  rationale: Préserve la formule réciproque de l’alliance et met en relief le pronom divin explicitement présent en hébreu.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: נְאֻם est une formule prophétique d’oracle. « Yahweh » représente directement le nom divin, et « Seigneur » rend אֲדֹנָי sans produire le redoublement « Seigneur Seigneur ».
theological_decisions:
- issue: Formule de l’alliance
  choice: ils seront mon peuple, et moi, je serai leur Dieu
  alternative: ils seront pour moi un peuple, et moi, je serai pour eux Dieu
  rationale: La formulation idiomatique française conserve la réciprocité et la portée relationnelle de la formule hébraïque sans ajout doctrinal.
- issue: Représentation du nom divin יְהוָה après אֲדֹנָי
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: La distinction entre le titre אֲדֹנָי et le nom propre יְהוָה est maintenue explicitement.
- issue: Portée de לְמַעַן sur les propositions coordonnées
  choice: but suivi de résultats formulés au futur
  alternative: 'subjonctif dans toutes les propositions : « qu’ils soient… que je sois… »'
  rationale: Le lien final demeure explicite par « afin que », tandis que le futur restitue en français naturel les formes וְהָיוּ et אֶהְיֶה et la solennité de la formule d’alliance.
translation_notes:
  register: Français international moderne, digne et accessible. « Maison d’Israël » conserve l’expression collective biblique; le singulier collectif se poursuit dans « se rende impure », puis l’hébreu passe naturellement au pluriel dans la formule « ils seront mon peuple ».
