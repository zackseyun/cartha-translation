base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/006.yaml
  text: 'Therefore say to the house of Israel[a], ‘Thus says the Lord GOD: Turn back, and turn away from your idols[b], and turn your faces away from all your abominations.’'
translation:
  language: fr
  text: 'C’est pourquoi, dis à la maison d’Israël : « Voici ce que dit le Seigneur Yahweh : Revenez, détournez-vous de vos idoles et détournez vos visages de toutes vos abominations. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence de l’accusation précédente et conserve la logique prophétique.
- source_word: אֶל־בֵּית יִשְׂרָאֵל
  choice: à la maison d’Israël
  rationale: Conserve la désignation collective et historique d’Israël sans la réduire à « aux Israélites ».
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Formule française actuelle, digne et naturelle pour rendre la formule de messager prophétique.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה, en évitant l’expression artificielle « le Seigneur SEIGNEUR ».
- source_word: שׁוּבוּ
  choice: Revenez
  rationale: Préserve l’image concrète du retour tout en laissant entendre l’appel prophétique à la repentance.
- source_word: וְהָשִׁיבוּ מֵעַל גִּלּוּלֵיכֶם
  choice: détournez-vous de vos idoles
  rationale: Exprime naturellement le mouvement de séparation exigé par la forme causative de שׁוב; « idoles » donne le sens contextuel stable de גִּלּוּלִים.
- source_word: וּמֵעַל כָּל תּוֹעֲבֹתֵיכֶם הָשִׁיבוּ פְנֵיכֶם
  choice: détournez votre visage de toutes vos pratiques abominables
  rationale: Conserve l’image corporelle du visage orienté ailleurs; « pratiques abominables » explicite en français que les תּוֹעֵבוֹת sont ici les réalités et conduites cultuelles condamnées.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte associe le titre « Seigneur » au nom propre YHWH. Le maintien de « Yahweh » rend visible cette distinction sans imposer une périphrase traditionnelle.
- issue: Portée pénitentielle de שׁוּב
  choice: Revenez
  alternative: Repentez-vous
  rationale: « Revenez » garde la métaphore directionnelle et l’appel au retour vers Dieu, sans réduire le verbe à un terme théologique plus technique.
translation_notes:
  register: Français international moderne, sobre et prophétique. Le parallélisme des impératifs est maintenu. « Maison d’Israël » et « détournez votre visage » conservent les images hébraïques tout en restant compréhensibles.
