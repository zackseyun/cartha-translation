review_pass:
  verdict: revise
  source_fidelity: 'Le sens global et la succession des impératifs reflètent fidèlement l’hébreu : appel au retour, renoncement aux idoles, puis réorientation délibérée loin de toutes les abominations. Toutefois, « pratiques abominables » restreint תּוֹעֲבוֹת à des conduites, alors que le terme désigne plus largement des choses ou réalités abominables.'
  naturalness: Le français est moderne et d’un registre prophétique approprié. « Détournez vos visages » rend mieux le pluriel hébreu פְנֵיכֶם que le singulier collectif « votre visage », tout en conservant l’image corporelle.
  terminology: « Maison d’Israël », « le Seigneur Yahweh », « Revenez » et « idoles » sont des choix recevables. « Abominations » conserve la portée et la gravité cultuelle et morale de תּוֹעֲבוֹת sans surinterprétation.
  issues:
  - severity: medium
    issue: « pratiques abominables » est une explicitation restrictive de תּוֹעֲבוֹת.
    rationale: Le mot hébreu peut viser des objets, des réalités ou des actes jugés abominables ; le limiter à des « pratiques » ajoute une précision absente du texte.
  - severity: low
    issue: « votre visage » ne reflète pas le pluriel de פְנֵיכֶם.
    rationale: Le français peut employer un singulier collectif, mais « vos visages » conserve plus précisément l’image et le nombre du texte source.
  - severity: low
    issue: Les ancres des notes dans la piste anglaise ne correspondent pas à leur contenu.
    rationale: La note a, attachée à « house of Israel », traite de שׁוּבוּ ; la note b, attachée à « idols », traite d’אֲדֹנָי יְהוִה. Le brouillon français ne comporte aucune note à corriger.
