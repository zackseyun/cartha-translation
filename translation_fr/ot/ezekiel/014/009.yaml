  text: וְ/הַ/נָּבִ֤יא כִֽי יְפֻתֶּה֙ וְ/דִבֶּ֣ר דָּבָ֔ר אֲנִ֤י יְהוָה֙ פִּתֵּ֔יתִי אֵ֖ת הַ/נָּבִ֣יא הַ/ה֑וּא וְ/נָטִ֤יתִי אֶת יָדִ/י֙ עָלָ֔י/ו וְ/הִ֨שְׁמַדְתִּ֔י/ו מִ/תּ֖וֹךְ עַמִּ֥/י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/009.yaml
  text: And if the prophet is deceived and speaks a word[a], I, Yahweh, have deceived that prophet; and I will stretch out my hand against him and destroy him from the midst of my people Israel.
translation:
  language: fr
  text: Et si le prophète est trompé et prononce une parole, c’est moi, YHWH, qui ai trompé ce prophète[a]. J’étendrai la main contre lui et je le ferai disparaître du milieu de mon peuple Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « qui ai séduit ce prophète » ; certains comprennent dans un sens permissif : « qui ai laissé ce prophète être trompé ».'
    reason: La racine פתה peut évoquer la tromperie ou la séduction. Le sens permissif est une interprétation destinée à préciser l’action divine, mais il n’est pas exprimé explicitement par la forme hébraïque.
lexical_decisions:
- source_word: יְפֻתֶּה
  choice: se laisse tromper
  rationale: Le poual exprime ici l’état passif du prophète soumis à la tromperie ou à la séduction. « Se laisse tromper » est naturel en français et ne désigne pas explicitement l’agent.
- source_word: וְדִבֶּר דָּבָר
  choice: et prononce une parole
  rationale: Cette formulation conserve le terme « parole » et la brièveté de l’expression prophétique hébraïque, tout en étant idiomatique en français.
- source_word: אֲנִי יְהוָה
  choice: c’est moi, YHWH
  rationale: La construction met en relief le pronom de première personne. « C’est moi » restitue cette emphase, et YHWH représente sans substitution le nom divin du texte source.
- source_word: פִּתֵּיתִי
  choice: ai trompé
  rationale: Le piel avec YHWH pour sujet attribue directement l’action à Dieu. La traduction garde cette affirmation difficile au lieu de la transformer en simple permission.
- source_word: וְנָטִיתִי אֶת יָדִי עָלָיו
  choice: J’étendrai la main contre lui
  rationale: La traduction conserve l’image hébraïque usuelle d’une intervention divine en jugement.
- source_word: וְהִשְׁמַדְתִּיו
  choice: je le ferai disparaître
  rationale: Le hiphil de שׁמד exprime l’élimination ou la destruction. Cette tournure forte et naturelle convient au complément « du milieu de mon peuple ».
- source_word: מִתּוֹךְ עַמִּי יִשְׂרָאֵל
  choice: du milieu de mon peuple Israël
  rationale: Cette formulation suit de près l’image spatiale de l’hébreu et exprime l’exclusion de l’intérieur du peuple.
theological_decisions:
- issue: L’action divine dans la tromperie du prophète
  choice: « c’est moi, YHWH, qui ai trompé ce prophète »
  alternative: « j’ai séduit ce prophète » ou, selon une compréhension permissive, « j’ai laissé ce prophète être trompé »
  rationale: L’hébreu emploie la même racine פתה pour l’expérience du prophète et pour l’action attribuée à YHWH. Le texte principal conserve donc l’attribution directe et la tension théologique, tandis que la note signale les nuances lexicales et l’interprétation permissive.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe emphatique « c’est moi » restitue l’insistance de l’hébreu. Le nom divin est rendu par YHWH, conformément à sa forme dans la source et sans introduire un titre confessionnel.
