source:
  edition: WLC
  text: לֽוּ חַיָּ֥ה רָעָ֛ה אַעֲבִ֥יר בָּ/אָ֖רֶץ וְ/שִׁכְּלָ֑תָּ/ה וְ/הָיְתָ֤ה שְׁמָמָה֙ מִ/בְּלִ֣י עוֹבֵ֔ר מִ/פְּנֵ֖י הַ/חַיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/015.yaml
  text: If I cause dangerous wild animals to pass through the land[a], and they bereave it, and it becomes a desolation, without anyone passing through because of the animals[b],
translation:
  language: fr
  text: Si je fais passer dans le pays des bêtes sauvages dangereuses[a], qu’elles le privent des siens[b] et que le pays devienne une désolation, sans que personne y passe à cause de ces bêtes,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des bêtes féroces » ; littéralement « une bête mauvaise », expression collective désignant des animaux sauvages dangereux.
    reason: lexical_alternative
  - marker: b
    text: Ou « qu’elles le rendent sans enfants ». Le pays est personnifié comme ayant perdu ses habitants.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֽוּ
  choice: Si
  rationale: Introduit l’hypothèse qui ouvre ce cas de jugement; « si » est naturel en français et maintient la proposition en suspens jusqu’à la suite du passage.
- source_word: חַיָּה רָעָה
  choice: des bêtes sauvages dangereuses
  rationale: Le singulier hébreu a une valeur collective et désigne des animaux sauvages nuisibles ou menaçants. Le pluriel français exprime naturellement cette valeur collective.
- source_word: אַעֲבִיר בָּאָרֶץ
  choice: je fais traverser le pays à
  rationale: La forme causative du verbe עבר présente Dieu comme celui qui fait passer les bêtes à travers le territoire; cette tournure conserve explicitement cette causalité.
- source_word: וְשִׁכְּלָתָּהּ
  choice: qu’elles le privent des siens
  rationale: Le verbe évoque le fait de perdre ses enfants ou d’en être privé. Appliqué au pays personnifié, il décrit la perte de ses habitants tout en conservant l’image du deuil.
- source_word: וְהָיְתָה שְׁמָמָה
  choice: et qu’il devienne un lieu dévasté
  rationale: Cette formulation française naturelle rend le résultat de désolation exprimé par le substantif hébreu שְׁמָמָה.
- source_word: מִבְּלִי עוֹבֵר
  choice: où personne ne passe plus
  rationale: Rend clairement la cessation complète du passage comme conséquence de la dévastation.
- source_word: מִפְּנֵי הַחַיָּה
  choice: à cause de ces bêtes
  rationale: La préposition indique ici la cause, et le démonstratif renvoie naturellement en français aux bêtes déjà mentionnées.
theological_decisions:
- issue: L’action divine dans le jugement
  choice: « Si je fais traverser le pays à des bêtes sauvages dangereuses »
  alternative: « Si j’envoie des bêtes sauvages dans le pays »
  rationale: La forme causative hébraïque présente explicitement Dieu comme l’agent qui fait passer les bêtes dans le pays; la traduction ne réduit pas cette action à une simple permission.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure hypothétique inachevée du verset, qui se poursuit dans le contexte. « Privent des siens » maintient la personnification du pays sans employer une tournure française obscure.
