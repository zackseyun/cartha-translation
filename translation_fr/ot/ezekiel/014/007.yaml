  text: כִּי֩ אִ֨ישׁ אִ֜ישׁ מִ/בֵּ֣ית יִשְׂרָאֵ֗ל וּ/מֵ/הַ/גֵּר֮ אֲשֶׁר יָג֣וּר בְּ/יִשְׂרָאֵל֒ וְ/יִנָּזֵ֣ר מֵֽ/אַחֲרַ֗/י וְ/יַ֤עַל גִּלּוּלָי/ו֙ אֶל לִבּ֔/וֹ וּ/מִכְשׁ֣וֹל עֲוֺנ֔/וֹ יָשִׂ֖ים נֹ֣כַח פָּנָ֑י/ו וּ/בָ֤א אֶל הַ/נָּבִיא֙ לִ/דְרָשׁ ל֣/וֹ בִ֔/י אֲנִ֣י יְהוָ֔ה נַֽעֲנֶה לּ֖/וֹ בִּֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/007.yaml
  text: For any man from the house of Israel[a], or from the foreigner who sojourns in Israel, who separates himself from following me and brings up his idols into his heart, and sets the stumbling block of his iniquity before his face, and then comes to the prophet to inquire of me through him, I, Yahweh[d][c][b], will answer him myself.
translation:
  language: fr
  text: Car tout homme de la maison d’Israël[a], ou tout étranger qui réside en Israël[b], qui se détourne de me suivre[c], fait monter ses idoles dans son cœur et place devant son visage la pierre d’achoppement de sa faute, puis vient voir le prophète pour me consulter par son intermédiaire[d], moi, Yahvé, je lui répondrai moi-même[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu répète « homme » pour souligner chaque cas individuel : « chaque homme » ou « tout homme, quel qu’il soit ».'
    reason: lexical_alternative
  - marker: b
    text: Il s’agit d’un non-Israélite résidant parmi les Israélites; on peut aussi traduire « étranger résident ».
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « se sépare de derrière moi », c’est-à-dire cesse de me suivre.'
    reason: lexical_alternative
  - marker: d
    text: Littéralement, « pour le consulter à mon sujet ». La formulation indique que l’homme s’adresse au prophète afin de consulter Yahvé par son intermédiaire.
    reason: lexical_alternative
  - marker: e
    text: 'La fin de la phrase est compacte et difficile en hébreu. Autres traductions possibles : « je lui répondrai par moi-même » ou « je lui répondrai en personne ».'
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: tout homme
  rationale: 'La répétition du nom hébreu exprime une valeur distributive : chaque homme pris individuellement. « Tout homme » conserve à la fois cette force et la forme masculine du texte.'
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: de la maison d’Israël
  rationale: Cette formulation préserve l’expression collective et identitaire « maison d’Israël » sans la réduire au simple nom « Israël ».
- source_word: הַגֵּר אֲשֶׁר יָגוּר
  choice: tout immigré qui séjourne
  rationale: גֵּר désigne ici un non-Israélite installé au milieu d’Israël. « Immigré » indique son statut d’étranger résident, tandis que « séjourne » rend l’écho verbal de la source.
- source_word: וְיִנָּזֵר מֵאַחֲרַי
  choice: qui se détourne de moi
  rationale: Le niphal de נזר exprime ici une séparation volontaire, et l’expression littérale « de derrière moi » évoque l’abandon de la fidélité à Dieu. « Se détourne de moi » rend naturellement les deux éléments.
- source_word: וְיַעַל גִּלּוּלָיו אֶל לִבּוֹ
  choice: élève ses idoles jusque dans son cœur
  rationale: Le verbe עלה conserve l’image d’une élévation ou d’une montée, tandis que « jusque dans son cœur » situe l’idolâtrie au centre de la volonté et de la pensée.
- source_word: מִכְשׁוֹל עֲוֺנוֹ
  choice: l’obstacle qui le fait tomber dans sa faute
  rationale: מִכְשׁוֹל est ce qui provoque une chute ou fait trébucher. Cette formulation française maintient l’image tout en rendant עָוֹן par « faute », terme qui peut porter ici l’idée de péché et de culpabilité.
- source_word: יָשִׂים נֹכַח פָּנָיו
  choice: place devant lui
  rationale: La traduction reste proche de l’image concrète de quelque chose délibérément placé devant le visage de la personne, tout en évitant le calque peu naturel « devant sa face ».
- source_word: וּבָא אֶל הַנָּבִיא
  choice: puis vient trouver le prophète
  rationale: '« Puis » marque la progression du texte : après avoir nourri son idolâtrie, l’homme consulte néanmoins le prophète.'
- source_word: לִדְרָשׁ לוֹ בִי
  choice: pour me consulter pour lui-même
  rationale: Le complément בִי fait de Dieu l’objet de la consultation, tandis que לוֹ peut exprimer l’intérêt personnel du consultant. La formulation évite d’imposer au pronom le sens « par l’intermédiaire du prophète », qui n’est pas nécessaire grammaticalement.
- source_word: אֲנִי יְהוָה
  choice: moi, Yahvé
  rationale: Le pronom indépendant est emphatique et introduit la réponse divine. « Yahvé » représente directement le nom propre יהוה plutôt qu’un titre.
- source_word: נַעֲנֶה לוֹ בִּי
  choice: je lui répondrai moi-même
  rationale: La construction hébraïque est compacte et difficile. Dans ce contexte, elle souligne que Yahvé répond personnellement; « moi-même » restitue cette emphase sans prétendre résoudre entièrement la syntaxe.
theological_decisions:
- issue: Représentation du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, nom propre du Dieu d’Israël. « Yahvé » le représente comme un nom plutôt que de le remplacer par le titre traditionnel « le SEIGNEUR ».
- issue: Portée du masculin singulier אִישׁ אִישׁ
  choice: tout homme
  alternative: toute personne / quiconque
  rationale: La source emploie deux fois le nom masculin singulier avec une force distributive. « Tout homme » conserve cette forme et souligne la responsabilité individuelle, sans affirmer que l’avertissement serait sans pertinence pour les femmes.
- issue: Agent et mode de la réponse divine dans נַעֲנֶה לוֹ בִּי
  choice: Yahvé répond personnellement
  alternative: Yahvé répond par l’intermédiaire du prophète
  rationale: Le בִי final et le pronom emphatique mettent vraisemblablement l’accent sur Dieu lui-même. Le texte ne précise pas nettement si la réponse sera communiquée par le prophète; la traduction ne l’ajoute donc pas.
translation_notes:
  register: Français international moderne, soutenu sans archaïsmes. La syntaxe ample du verset est conservée, mais articulée par « puis » et par des verbes courants. Les images du cœur, de l’élévation et de l’obstacle qui fait tomber sont maintenues. Le terme « immigré » est employé dans son sens descriptif de personne venue s’établir parmi Israël, sans connotation administrative moderne précise.
