  to: Car tout homme de la maison d’Israël[a], ou tout étranger qui réside en Israël[b], qui se détourne de me suivre[c], fait monter ses idoles dans son cœur et place devant son visage la pierre d’achoppement de sa faute, puis vient voir le prophète pour me consulter par son intermédiaire[d], moi, Yahvé, je lui répondrai moi-même[e].
