  text: וְ/נָשְׂא֖וּ עֲוֺנָ֑/ם כַּֽ/עֲוֺן֙ הַ/דֹּרֵ֔שׁ כַּ/עֲוֺ֥ן הַ/נָּבִ֖יא יִֽהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/010.yaml
  text: And they will bear their punishment[a]; the punishment of the one who inquires will be the same as the punishment of the prophet.
translation:
  language: fr
  text: 'Ils porteront leur peine[a] : la peine de celui qui consulte sera comme la peine du prophète.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Ils porteront leur faute » ou « leur culpabilité » ; la faute ou la culpabilité de celui qui consulte sera comme celle du prophète. Le terme hébreu peut désigner la faute, la culpabilité ou la peine qui en résulte.'
    reason: 'alternative lexicale : le champ sémantique de עָוֹן permet aussi les sens de faute ou de culpabilité, tandis que le contexte judiciaire peut désigner la peine qui en résulte.'
lexical_decisions:
- source_word: וְנָשְׂאוּ
  choice: Ils porteront
  rationale: Avec עָוֹן, le verbe נָשָׂא forme l’expression « porter sa faute » ou « en porter la peine ». « Porteront » conserve cette image hébraïque tout en restant naturel en français.
- source_word: עֲוֺנָם
  choice: la peine de leur faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou la peine qui en découle. Cette formulation exprime la conséquence judiciaire sans effacer entièrement la notion de faute.
- source_word: כַּעֲוֺן
  choice: la peine … sera la même que celle
  rationale: Le préfixe comparatif כְּ établit une correspondance entre le sort de celui qui consulte et celui du prophète. La formulation française explicite clairement cette égalité.
- source_word: הַדֹּרֵשׁ
  choice: celui qui consulte
  rationale: Dans ce contexte, דָּרַשׁ désigne celui qui vient interroger un prophète afin d’obtenir une réponse ou un oracle. « Consulte » rend ce cadre plus précisément que le général « interroge ».
- source_word: הַנָּבִיא
  choice: le prophète
  rationale: Équivalent français usuel de נָבִיא.
- source_word: יִהְיֶה
  choice: sera
  rationale: Le verbe exprime ici une relation d’identité ou de correspondance au futur.
theological_decisions:
- issue: Sens de עָוֹן dans une formule de jugement
  choice: La peine de leur faute
  alternative: Leur faute / leur culpabilité
  rationale: Dans l’expression « porter עָוֹן », le terme peut viser la faute ou la culpabilité elle-même, mais aussi la peine qui en résulte. Le contexte judiciaire favorise la conséquence punitive; la formulation retenue maintient néanmoins le lien explicite avec la faute, tandis que la note préserve l’ambiguïté de l’hébreu.
translation_notes:
  register: Français moderne, digne et direct. La structure parallèle du texte hébreu est conservée, avec une légère explicitation de la comparaison pour assurer la clarté.
