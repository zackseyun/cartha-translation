  variant: modern international French
source:
  edition: WLC
  text: וְ/נֹ֨חַ דנאל וְ/אִיּוֹב֮ בְּ/תוֹכָ/הּ֒ חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה אִם בֵּ֥ן אִם בַּ֖ת יַצִּ֑ילוּ הֵ֥מָּה בְ/צִדְקָתָ֖/ם יַצִּ֥ילוּ נַפְשָֽׁ/ם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/020.yaml
  text: Even if Noah[a], Daniel, and Job were in it, as I live, declares the Lord GOD, they would deliver neither son nor daughter; by their righteousness they would deliver only themselves.
translation:
  language: fr
  text: Même si Noé, Daniel[a] et Job s’y trouvaient, aussi vrai que je suis vivant — déclaration du Seigneur Yahweh —, ils ne sauveraient ni fils ni fille ; par leur justice, ils ne sauveraient qu’eux-mêmes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu דנאל peut aussi se lire « Danel » et désigner un ancien personnage réputé juste, plutôt que le Daniel mieux connu.
    reason: Lecture et identification alternatives du nom propre.
lexical_decisions:
- source_word: בְּתוֹכָהּ
  choice: au milieu d’elle
  rationale: Le suffixe féminin renvoie à la réalité féminine évoquée dans le contexte, vraisemblablement la terre; cette formulation conserve le genre et le sens locatif de l’hébreu.
- source_word: חַי אָנִי נְאֻם אֲדֹנָי יְהוִה
  choice: aussi vrai que je suis vivant — déclaration du Seigneur Yahweh —
  rationale: La formulation rend la force solennelle du serment divin et distingue le titre אֲדֹנָי du nom propre יהוה.
- source_word: אִם בֵּן אִם בַּת
  choice: ni fils ni fille
  rationale: Après la formule de serment, la construction exclut catégoriquement l’un comme l’autre.
- source_word: יַצִּילוּ
  choice: ils ne sauveraient / ils sauveraient
  rationale: Le hiphil de נצל désigne ici le fait d’arracher quelqu’un au jugement; « sauver » est naturel en français et permet de conserver la répétition du verbe.
- source_word: הֵמָּה
  choice: ils
  rationale: Le pronom emphatique désigne les trois justes; l’exclusivité est exprimée naturellement par « qu’eux-mêmes » dans la proposition finale.
- source_word: בְצִדְקָתָם
  choice: par leur justice
  rationale: « Par » conserve la nuance de moyen ou de fondement portée par la préposition ב.
- source_word: נַפְשָׁם
  choice: eux-mêmes
  rationale: Dans ce contexte, נֶפֶשׁ désigne les personnes ou leur vie, non une âme immatérielle; « eux-mêmes » exprime clairement qu’eux seuls échapperaient au jugement.
- source_word: דנאל
  choice: Daniel
  rationale: La lecture traditionnelle « Daniel » demeure immédiatement reconnaissable, tandis que la forme consonantique inhabituelle et la lecture possible « Danel » sont signalées en note.
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU; le Seigneur, l’Éternel
  rationale: « Yahweh » représente le nom divin יהוה plutôt que de le remplacer par un titre, tandis que « Seigneur » rend אֲדֹנָי.
- issue: Identité de דנאל
  choice: Daniel dans le texte, avec « Danel » en note
  alternative: Danel dans le texte principal
  rationale: L’orthographe hébraïque autorise une identification distincte du Daniel biblique sans la rendre certaine; la note préserve donc cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « sauver » reproduit celle du verbe hébreu, et les tirets mettent en relief la formule prophétique sans alourdir la phrase.
