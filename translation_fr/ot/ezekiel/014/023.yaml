source:
  edition: WLC
  text: וְ/נִחֲמ֣וּ אֶתְ/כֶ֔ם כִּֽי תִרְא֥וּ אֶת דַּרְכָּ֖/ם וְ/אֶת עֲלִֽילוֹתָ֑/ם וִֽ/ידַעְתֶּ֗ם כִּי֩ לֹ֨א חִנָּ֤ם עָשִׂ֨יתִי֙ אֵ֣ת כָּל אֲשֶׁר עָשִׂ֣יתִי בָ֔/הּ נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/023.yaml
  text: And they will comfort you when you see their ways and their deeds[a], and you will know that I have not done without cause all that I did in it[c][b], declares the Lord GOD.
translation:
  language: fr
  text: Ils vous consoleront[a] quand vous verrez leur conduite et leurs actes, et vous saurez que ce n’est pas sans raison que j’ai fait tout ce que j’ai fait en elle[b], déclare le Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « vous serez consolés par eux ». La forme hébraïque permet de voir dans les survivants le moyen par lequel la consolation vient lorsque leur conduite est observée.'
    reason: lexical_alternative
  - marker: b
    text: 'C’est-à-dire en Jérusalem. On pourrait aussi traduire, selon le sens contextuel : « à son égard » ou « contre elle ».'
    reason: referent_and_alternative_reading
lexical_decisions:
- source_word: וְנִחֲמוּ אֶתְכֶם
  choice: Ils vous consoleront
  rationale: Le nifal de נחם est compris ici avec les survivants comme sujet et les destinataires comme objet. La formule française conserve l’idée que la vue de leur conduite apportera une consolation, sans préciser davantage son mécanisme.
- source_word: כִּי תִרְאוּ
  choice: quand vous verrez
  rationale: Dans ce contexte, כִּי introduit naturellement la circonstance dans laquelle la consolation se produira; « quand » rend clairement cet enchaînement sans exclure toute nuance causale.
- source_word: דַּרְכָּם וְאֶת עֲלִילוֹתָם
  choice: leur conduite et leurs actes
  rationale: « Conduite » exprime le sens figuré de דֶּרֶךְ comme manière de vivre, tandis que « actes » rend les actions concrètes désignées par עֲלִילוֹת. Cette formulation est naturelle en français moderne et maintient la distinction entre les deux termes.
- source_word: וִידַעְתֶּם
  choice: et vous saurez
  rationale: Le futur et la coordination hébraïque sont conservés; le rapport de conséquence ressort déjà du contexte.
- source_word: לֹא חִנָּם
  choice: ce n’est pas sans raison
  rationale: חִנָּם signifie ici « gratuitement », « sans motif » ou « sans raison ». La traduction souligne que l’action divine n’était pas arbitraire, sans ajouter de justification étrangère au texte.
- source_word: עָשִׂיתִי אֵת כָּל אֲשֶׁר עָשִׂיתִי
  choice: j’ai fait tout ce que j’ai fait
  rationale: La répétition du verbe עשה est maintenue afin de préserver l’insistance du texte sur l’ensemble des actes de Dieu.
- source_word: בָהּ
  choice: en elle
  rationale: La préposition ב avec le pronom féminin est rendue formellement. Le féminin renvoie à Jérusalem, la ville évoquée dans le contexte; une note clarifie le référent sans introduire « contre », qui serait plus interprétatif.
- source_word: נְאֻם אֲדֹנָי יְהוָה
  choice: déclare le Seigneur Yahweh
  rationale: נְאֻם est rendu par la formule prophétique courante « déclare ». אֲדֹנָי est traduit par « le Seigneur » et le nom divin יהוה est transcrit « Yahweh ».
theological_decisions:
- issue: Effet des survivants sur les destinataires
  choice: Les survivants consoleront les destinataires lorsque ceux-ci verront leur conduite et leurs actes.
  alternative: Les destinataires seront consolés par eux, ou se consoleront en les voyant.
  rationale: La syntaxe permet d’exprimer les survivants comme source ou moyen de consolation. Le contexte relie cette consolation à la reconnaissance que le jugement de Jérusalem n’était pas sans raison; la traduction conserve ce lien sans expliquer exhaustivement comment la consolation opère.
- issue: Caractère justifié de l’action divine
  choice: « ce n’est pas sans raison »
  alternative: « ce n’est pas en vain » ou « ce n’est pas gratuitement »
  rationale: Le contexte porte sur l’absence d’arbitraire dans les actes de Dieu envers Jérusalem. « Sans raison » rend ce point tout en préservant la tension du texte, qui affirme la justification sans la reformuler en système théologique.
- issue: Rendu de אֲדֹנָי יְהוָה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Cette formulation distingue le titre אֲדֹנָי du nom propre divin יהוה et rend explicitement ce dernier par « Yahweh ».
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la répétition emphatique de « faire » et la référence féminine à Jérusalem, tout en évitant un vocabulaire confessionnel spécialisé.
