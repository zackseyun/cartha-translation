  variant: modern international French
source:
  edition: WLC
  text: וּ/שְׁלֹ֨שֶׁת הָ/אֲנָשִׁ֣ים הָ/אֵלֶּה֮ בְּ/תוֹכָ/הּ֒ חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה לֹ֥א יַצִּ֖ילוּ בָּנִ֣ים וּ/בָנ֑וֹת כִּ֛י הֵ֥ם לְ/בַדָּ֖/ם יִנָּצֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/018.yaml
  text: And if these three men were in its midst[a], as I live, declares the Lord GOD, they would not deliver sons or daughters[b]; they alone would be delivered.
translation:
  language: fr
  text: Même si ces trois hommes se trouvaient au milieu d’elle, aussi vrai que je suis vivant — déclaration du Seigneur Yahweh —, ils ne délivreraient ni fils ni filles ; eux seuls seraient délivrés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: Même si ces trois hommes
  rationale: La conjonction וּ relie ce verset à la série d’hypothèses des versets 14, 16, 18 et 20. « Même si » explicite naturellement en français cette valeur conditionnelle contextuelle, tandis que « hommes » correspond au masculin et renvoie à Noé, Daniel et Job.
- source_word: בְּתוֹכָהּ
  choice: au milieu d’elle
  rationale: Cette formulation conserve l’image spatiale de l’hébreu et le pronom féminin renvoie au pays mentionné dans le contexte.
- source_word: חַי אָנִי
  choice: aussi vrai que je suis vivant
  rationale: Équivalent français naturel et solennel de la formule de serment divin, plus immédiatement compréhensible que le calque « vivant, moi ».
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: « Déclaration » rend la formule prophétique נְאֻם, et « Seigneur Yahweh » distingue le titre אֲדֹנָי du nom divin יְהוִה sans produire la répétition « Seigneur SEIGNEUR ».
- source_word: לֹא יַצִּילוּ ... יִנָּצֵלוּ
  choice: ils ne délivreraient ... eux seuls seraient délivrés
  rationale: La répétition de « délivrer » préserve le lien lexical entre le hiphil actif et le niphal passif de נצל. Dans ce contexte, il s’agit d’échapper au jugement temporel, sans imposer la notion de salut éternel.
- source_word: בָּנִים וּבָנוֹת
  choice: ni fils ni filles
  rationale: Après une négation, « ni… ni… » est idiomatique en français et conserve la mention explicite des deux sexes.
- source_word: כִּי הֵם לְבַדָּם
  choice: eux seuls
  rationale: Dans ce contexte, כִּי introduit ou renforce le contraste, tandis que לְבַדָּם marque l’exclusivité. « Eux seuls » restitue cette insistance avec concision.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte à la fois le titre אֲדֹנָי et le nom propre יהוה. « Le Seigneur Yahweh » les représente distinctement et évite d’effacer le nom divin.
- issue: Portée de la délivrance
  choice: délivreraient / seraient délivrés
  alternative: sauveraient / seraient sauvés
  rationale: Le contexte concerne la préservation lors d’un jugement historique. « Délivrer » garde la force du verbe נצל et son parallélisme grammatical sans orienter indûment le passage vers le salut éternel.
- issue: Condition implicite dans la série rhétorique
  choice: Même si
  alternative: Et ces trois hommes étant
  rationale: L’hébreu n’emploie pas ici de particule conditionnelle autonome, mais la construction reprend clairement les cas hypothétiques des versets voisins. « Même si » rend ce rapport discursif sans changer l’issue catégorique du serment.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve le serment solennel, la désignation explicite des fils et des filles, ainsi que la répétition du même verbe dans les deux voix grammaticales.
