id: EZK.14.17
reference: Ezekiel 14:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: א֛וֹ חֶ֥רֶב אָבִ֖יא עַל הָ/אָ֣רֶץ הַ/הִ֑יא וְ/אָמַרְתִּ֗י חֶ֚רֶב תַּעֲבֹ֣ר בָּ/אָ֔רֶץ וְ/הִכְרַתִּ֥י מִמֶּ֖/נָּה אָדָ֥ם וּ/בְהֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/017.yaml
  text: Or if I bring a sword against that land and say[a], ‘Let a sword pass through the land,’ and I cut off from it man and beast,
translation:
  language: fr
  text: 'Ou bien, si je fais venir l’épée contre ce pays et que je dise : « Que l’épée traverse le pays ! », et que j’en retranche les humains et les bêtes,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’humain et la bête », formule consacrée qui évoque la disparition de la vie humaine et animale du pays.'
    reason: Préciser la forme hébraïque et la portée collective de l’expression אָדָם וּבְהֵמָה.
lexical_decisions:
- source_word: א֛וֹ
  choice: Ou bien, si
  rationale: Introduit un nouveau cas hypothétique dans la série des jugements; « si » explicite naturellement la valeur conditionnelle donnée par le contexte.
- source_word: חֶ֥רֶב אָבִ֖יא
  choice: je fais venir l’épée
  rationale: Le hiphil de בוא exprime l’action de faire venir; l’article défini convient en français à l’épée comme fléau personnifié ou image prophétique de la guerre.
- source_word: עַל הָאָרֶץ הַהִיא
  choice: contre ce pays
  rationale: Dans ce contexte de jugement, עַל a une valeur hostile; הַהִיא renvoie au pays hypothétique déjà présenté, naturellement rendu par « ce pays ».
- source_word: וְאָמַרְתִּי
  choice: et que je dise
  rationale: Le subjonctif coordonné prolonge en français la construction conditionnelle ouverte par « si », tout en conservant la parole souveraine de Dieu.
- source_word: חֶרֶב תַּעֲבֹר בָּאָרֶץ
  choice: Que l’épée traverse le pays !
  rationale: La construction exprime un ordre ou décret; « Que… ! » restitue cette force sans réduire l’image à une simple prédiction.
- source_word: וְהִכְרַתִּי מִמֶּנָּה
  choice: et que j’en retranche
  rationale: כרת signifie ici supprimer ou exterminer. « Retrancher » conserve l’image verbale et « en » reprend idiomatiquement le pays.
- source_word: אָדָם וּבְהֵמָה
  choice: les humains et les bêtes
  rationale: Expression globale désignant la vie humaine et animale. « Les humains » rend le sens collectif de אָדָם sans suggérer un seul homme; « les bêtes » garde le parallélisme traditionnel et la portée générale de בְּהֵמָה.
theological_decisions:
- issue: Portée générique de אָדָם dans la formule de jugement
  choice: les humains
  alternative: l’homme
  rationale: אָדָם désigne ici collectivement les habitants humains opposés aux animaux. « Les humains » rend explicitement cette portée générique sans modifier l’étendue du jugement.
- issue: Valeur de l’épée dans l’oracle
  choice: conserver l’image de « l’épée »
  alternative: expliciter par « la guerre »
  rationale: L’épée est une métonymie prophétique de la guerre et de la mort violente; conserver l’image respecte la formulation du texte et sa tension poétique.
translation_notes:
  register: Français international moderne, digne et accessible. La structure conditionnelle demeure ouverte, comme dans le verset hébreu qui se poursuit ensuite. Le vocabulaire prophétique de l’épée et du retranchement est conservé sans explicitation doctrinale.
