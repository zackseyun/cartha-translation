source:
  edition: WLC
  text: שְׁלֹ֨שֶׁת הָ/אֲנָשִׁ֣ים הָ/אֵלֶּה֮ בְּ/תוֹכָ/הּ֒ חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה אִם בָּנִ֥ים וְ/אִם בָּנ֖וֹת יַצִּ֑ילוּ הֵ֤מָּה לְ/בַדָּ/ם֙ יִנָּצֵ֔לוּ וְ/הָ/אָ֖רֶץ תִּהְיֶ֥ה שְׁמָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/016.yaml
  text: Even if these three men were in its midst[a], as I live, declares the Lord GOD, they would deliver neither sons nor daughters; they alone would be delivered, and the land would become a desolation.
translation:
  language: fr
  text: Même si ces trois hommes se trouvaient au milieu de ce pays, aussi vrai que je suis vivant — déclaration du Seigneur Yahweh —, ils ne sauveraient ni fils ni filles. Eux seuls seraient sauvés, et le pays deviendrait une désolation.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: ces trois hommes
  rationale: Rend formellement le syntagme démonstratif et conserve le masculin, puisque le contexte nomme trois figures masculines exemplaires.
- source_word: בְּתוֹכָהּ
  choice: au milieu de ce pays
  rationale: Explicite naturellement en français le référent féminin du suffixe, הָאָרֶץ, repris à la fin du verset.
- source_word: חַי אָנִי
  choice: aussi vrai que je suis vivant
  rationale: Formule française naturelle et solennelle qui conserve la force du serment divin.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: Préserve la formule prophétique נְאֻם, le titre אֲדֹנָי et le nom divin יהוה sans produire l'expression maladroite « Seigneur SEIGNEUR ».
- source_word: אִם בָּנִים וְאִם בָּנוֹת יַצִּילוּ
  choice: ils ne sauveraient ni fils ni filles
  rationale: Dans ce serment, אִם a une valeur négative implicite. « Sauver » rend נצל de façon claire et maintient le lien lexical avec le passif qui suit.
- source_word: הֵמָּה לְבַדָּם יִנָּצֵלוּ
  choice: Eux seuls seraient sauvés
  rationale: L'antéposition de « Eux » et « seuls » restitue l'insistance du pronom emphatique et de לְבַדָּם; le passif rend le niphal.
- source_word: וְהָאָרֶץ תִּהְיֶה שְׁמָמָה
  choice: et le pays deviendrait une étendue désolée
  rationale: Conserve la valeur résultative de תִּהְיֶה et la force nominale de שְׁמָמָה dans un français courant.
theological_decisions:
- issue: Rendu du nom divin יהוה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: « Yahweh » représente directement le nom divin, tandis que « Seigneur » rend אֲדֹנָי; cette solution distingue le titre du nom.
- issue: Portée de la justice des trois hommes sur leurs enfants
  choice: ils ne sauveraient ni fils ni filles; eux seuls seraient sauvés
  alternative: ils ne sauveraient pas même leurs propres fils ou filles
  rationale: Le texte ne comporte pas de possessif explicite. La traduction conserve donc la formulation générale tout en maintenant la tension sur l'impossibilité d'un salut représentatif dans ce jugement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la solennité de l'oracle et l'emphase sur « Eux seuls », sans archaïsmes ni ajout possessif absent de l'hébreu.
