lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans cette formule narrative prophétique, le waw consécutif avec היה introduit l’événement. En français naturel, son sens s’intègre à la locution « la parole… fut adressée ».
- source_word: דְבַר
  choice: la parole
  rationale: Dans דְבַר יְהוָה, « parole » conserve la formule prophétique établie et sa portée, sans expliciter davantage par « message ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre plutôt que remplacé par un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » exprime naturellement en français le sens de « à moi ».
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Dans l’introduction d’un discours direct, cette formule française rend idiomatiquement « disant » et annonce les paroles qui suivent.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom propre, tandis que « le SEIGNEUR » représente la substitution traditionnelle.
translation_notes:
  register: Français international moderne, digne et fluide. La tournure biblique reconnue « la parole de Yahweh me fut adressée » reste naturelle sans archaïsme marqué.
