base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/033.yaml
  text: 'And you[a], son of man, prophesy and say, ‘Thus says the Lord GOD concerning the sons of Ammon and concerning their reproach’: And you shall say, ‘A sword, a sword, drawn for slaughter, polished for devouring[c][b], so that it flashes like lightning.’'
translation:
  language: fr
  text: 'Et toi, fils d’homme, prophétise et dis : « Ainsi parle le Seigneur Yahweh au sujet des Ammonites[a] et de leurs outrages[b] : Tu diras : “Une épée ! Une épée, tirée pour le carnage, polie pour dévorer, pour étinceler[c].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des fils d’Ammon ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « leur opprobre », « leurs insultes » ou « leurs railleries ».'
    reason: lexical_alternative
  - marker: c
    text: 'La fin de la phrase est très concise en hébreu. On peut aussi traduire : « fourbie pour consumer, afin de briller comme l’éclair » ou « … afin qu’elle lance des éclairs ».'
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: Cette adresse divine récurrente à Ézéchiel est conservée sous sa forme traditionnelle et transparente, afin de préserver son rôle littéraire dans le livre.
- source_word: בְּנֵי עַמּוֹן
  choice: les Ammonites
  rationale: L’expression hébraïque signifie littéralement « les fils d’Ammon » ; le gentilé courant est plus naturel en français moderne sans perte de sens.
- source_word: חֶרְפָּתָם
  choice: leurs insultes
  rationale: Dans ce contexte d’oracle contre Ammon, le mot évoque vraisemblablement les outrages ou railleries des Ammonites, tout en pouvant aussi désigner l’opprobre ou la honte ; cette amplitude est signalée en note.
- source_word: חֶרֶב חֶרֶב
  choice: Une épée ! Une épée
  rationale: La répétition emphatique est maintenue, avec une ponctuation qui restitue sa force en français.
- source_word: פְּתוּחָה
  choice: tirée
  rationale: Appliqué à une épée, le participe désigne naturellement une arme tirée de son fourreau.
- source_word: לְטֶבַח
  choice: pour le carnage
  rationale: La préposition exprime la destination ou le but de l’épée ; « carnage » conserve la violence de l’image.
- source_word: מְרוּטָה
  choice: polie
  rationale: Le terme décrit une lame polie ou fourbie, particulièrement en vue de son éclat.
- source_word: לְהָכִיל
  choice: pour dévorer
  rationale: Dans cette image guerrière, l’infinitif exprime la destruction ou la consommation des victimes ; « dévorer » conserve la personnification menaçante de l’épée.
- source_word: לְמַעַן בָּרָק
  choice: afin qu’elle lance des éclairs
  rationale: La formule hébraïque est elliptique et associe la lame polie à l’éclair ; cette traduction restitue clairement son éclat fulgurant sans neutraliser l’image.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU ; le Souverain Seigneur
  rationale: Le composé conserve à la fois le titre אֲדֹנָי et le nom propre divin יהוה. « Le Seigneur Yahweh » distingue les deux éléments et évite de remplacer silencieusement le nom par un second titre.
- issue: Sens de חֶרְפָּתָם dans l’oracle contre Ammon
  choice: leurs insultes
  alternative: leur opprobre ; leurs outrages ; leurs railleries
  rationale: Le contexte favorise les insultes ou railleries attribuées aux Ammonites, mais le mot peut également évoquer l’opprobre qu’ils portent ou subissent. La note conserve cette ambiguïté sans en faire une affirmation doctrinale.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La répétition et les images violentes de l’oracle sont préservées. « Ammonites » privilégie l’intelligibilité courante, tandis que la forme littérale figure en note.
