  text: וְ/שָׁפַכְתִּ֤י עָלַ֨יִ/ךְ֙ זַעְמִ֔/י בְּ/אֵ֥שׁ עֶבְרָתִ֖/י אָפִ֣יחַ עָלָ֑יִ/ךְ וּ/נְתַתִּ֗י/ךְ בְּ/יַד֙ אֲנָשִׁ֣ים בֹּֽעֲרִ֔ים חָרָשֵׁ֖י מַשְׁחִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/036.yaml
  text: And I will pour out my indignation on you[a]; with the fire of my wrath I will blow on you, and I will give you into the hand of brutal men[b], craftsmen of destruction.
translation:
  language: fr
  text: Je déverserai sur toi mon indignation ; dans le feu de ma fureur, je soufflerai contre toi et je te livrerai entre les mains d’hommes brutaux[a], artisans de destruction[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « hommes féroces » ; littéralement « hommes brûlants ».
    reason: lexical_alternative
  - marker: b
    text: Ou « experts en destruction » ou « forgerons de ruine ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפַכְתִּי
  choice: Je déverserai
  rationale: Le verbe שׁפך exprime ici l’image courante de la colère divine répandue. « Déverser » conserve cette métaphore avec force et naturel.
- source_word: זַעְמִי
  choice: mon indignation
  rationale: זַעַם désigne une colère intense, souvent liée au jugement. « Indignation » en garde la gravité et permet de la distinguer du terme עֶבְרָה employé ensuite.
- source_word: בְּאֵשׁ עֶבְרָתִי אָפִיחַ עָלָיִךְ
  choice: je soufflerai sur toi le feu de ma fureur
  rationale: Cette formulation conserve à la fois le feu du courroux et l’action de souffler exprimée par נפח, tout en rendant l’image intelligible en français.
- source_word: וּנְתַתִּיךְ בְּיַד
  choice: je te livrerai entre les mains de
  rationale: L’expression hébraïque signifie remettre quelqu’un au pouvoir d’autrui. Le pluriel idiomatique français « entre les mains de » transmet clairement ce sens.
- source_word: אֲנָשִׁים בֹּעֲרִים
  choice: hommes brutaux
  rationale: Dans ce contexte, בֹּעֲרִים caractérise des hommes animés d’une violence destructrice. « Brutaux » communique ce sens sans imposer au texte français l’image obscure d’« hommes brûlants ».
- source_word: חָרָשֵׁי מַשְׁחִית
  choice: artisans de destruction
  rationale: חָרָשׁ désigne un artisan ou un ouvrier qualifié. Cette traduction conserve la métaphore de personnes expertes à produire la destruction.
theological_decisions:
- issue: Maintien de la distinction entre les deux termes hébreux désignant la colère divine
  choice: « indignation » pour זַעַם et « fureur » pour עֶבְרָה
  alternative: Employer « colère » pour les deux termes
  rationale: Le texte rapproche deux mots distincts pour intensifier l’annonce du jugement. Des équivalents français différents mais proches préservent cet effet sans ajouter de distinction doctrinale étrangère au passage.
translation_notes:
  register: Français international moderne, solennel et direct. La structure prophétique et les images du déversement, du feu et du travail artisanal de destruction sont conservées, tandis que les expressions idiomatiques sont rendues naturellement.
