    issue: Construction de « souffler » avec « le feu »
    rationale: Le texte hébreu dit littéralement que Dieu soufflera contre la destinataire « dans/avec le feu » de sa fureur. La formulation du brouillon suggère plutôt qu’il souffle le feu lui-même sur elle.
