base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/008.yaml
  text: 'And say to the land of Israel[a], ‘Thus says Yahweh: Behold, I am against you, and I will draw my sword from its sheath and cut off from you both righteous and wicked.’'
translation:
  language: fr
  text: 'Tu diras à la terre d’Israël : « Voici ce que dit Yahvé : Me voici contre toi. Je tirerai mon épée de son fourreau et je retrancherai de toi le juste et le méchant. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: la terre d’Israël
  rationale: אַדְמָה désigne la terre ou le sol. Dans cette adresse prophétique où le territoire est personnifié, « la terre d’Israël » est naturel et conserve l’image concrète.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Cette forme française courante translittère le nom divin au lieu de le remplacer par un titre.
- source_word: הִנְנִי אֵלַיִךְ
  choice: Me voici contre toi
  rationale: La tournure conserve la force de présentation de הִנְנִי ainsi que le sens d’opposition exprimé ici par אֵלַיִךְ.
- source_word: וְהוֹצֵאתִי חַרְבִּי מִתַּעְרָהּ
  choice: Je tirerai mon épée de son fourreau
  rationale: Avec une épée et son fourreau, « tirer » est l’équivalent idiomatique de « faire sortir », tout en préservant l’image hébraïque.
- source_word: וְהִכְרַתִּי מִמֵּךְ
  choice: et je retrancherai de chez toi
  rationale: « Retrancher » garde la force concrète et judiciaire du hiphil de כרת; « de chez toi » convient à la terre personnifiée à laquelle Dieu s’adresse.
- source_word: צַדִּיק וְרָשָׁע
  choice: aussi bien le juste que le méchant
  rationale: L’hébreu nomme explicitement les deux catégories au singulier. Cette formulation française exprime clairement l’étendue générale du jugement sans effacer la tension du texte.
theological_decisions:
- issue: Portée du jugement touchant « le juste » et « le méchant »
  choice: Le texte affirme sans atténuation que l’épée annoncée retranchera aussi bien le juste que le méchant.
  alternative: Comprendre la formule de manière rhétorique ou collective, sans y voir une négation de la justice individuelle de Dieu.
  rationale: Le verset ne précise pas ici comment cette déclaration s’articule avec les autres enseignements bibliques sur la justice individuelle. La traduction maintient donc la tension théologique au lieu de la résoudre par une paraphrase.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct est ponctué clairement; « Me voici contre toi » conserve la solennité de l’oracle sans employer un archaïsme comme « voici, je suis contre toi ».
