lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans cette formule prophétique, le verbe היה avec waw consécutif introduit l’événement. En français naturel, « la parole… me fut adressée » rend idiomatiquement l’ensemble de la formule.
- source_word: דְבַר
  choice: La parole de
  rationale: « Parole » conserve la formule prophétique et sa portée théologique, là où « message » serait plus explicatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération préserve le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » exprime naturellement en français la direction indiquée par la préposition hébraïque et son suffixe de première personne.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Devant le discours direct qui suit, les deux-points rendent en français moderne la fonction introductive de l’infinitif « disant », sans calque inutile.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » en préserve le caractère de nom propre sans remplacer celui-ci par un titre.
translation_notes:
  register: Français moderne, digne et fluide. La formule passive « me fut adressée » est consacrée dans le registre prophétique sans être obscure; les deux-points annoncent naturellement la parole rapportée au verset suivant.
