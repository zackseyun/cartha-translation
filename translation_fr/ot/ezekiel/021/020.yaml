  text: לְמַ֣עַן לָ/מ֣וּג לֵ֗ב וְ/הַרְבֵּה֙ הַ/מִּכְשֹׁלִ֔ים עַ֚ל כָּל שַׁ֣עֲרֵי/הֶ֔ם נָתַ֖תִּי אִבְחַת חָ֑רֶב אָ֛ח עֲשׂוּיָ֥ה לְ/בָרָ֖ק מְעֻטָּ֥ה לְ/טָֽבַח׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/020.yaml
  text: so that the heart may melt and the stumbling blocks may be many[a]. At all their gates I have set the flash of the sword. Ah! It is made for lightning[b], drawn for slaughter.
translation:
  language: fr
  text: afin que le cœur défaille et que les chutes se multiplient[a]. À toutes leurs portes, j’ai placé l’éclat de l’épée. Ah ! Elle est façonnée pour briller comme l’éclair, aiguisée pour le massacre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et que beaucoup trébuchent ». Le nom hébreu peut désigner ce qui fait trébucher ou la chute qui en résulte.
    reason: lexical_alternative
  - marker: b
    text: La dernière expression est difficile en hébreu. « Aiguisée pour le massacre » peut aussi être rendu par « dégainée pour le massacre » ou « polie pour le massacre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן לָמוּג לֵב
  choice: afin que le cœur défaille
  rationale: La tournure exprime le but ou le résultat. « Le cœur défaille » conserve l’image hébraïque de l’effondrement du courage tout en étant naturel en français.
- source_word: וְהַרְבֵּה הַמִּכְשֹׁלִים
  choice: et que les chutes se multiplient
  rationale: מִכְשׁוֹל peut désigner ce qui fait trébucher ou la chute qui en résulte. Dans ce contexte de jugement, « les chutes » rend clairement l’idée de défaites ou d’effondrements nombreux sans exclure l’image du trébuchement.
- source_word: עַל כָּל שַׁעֲרֵיהֶם
  choice: À toutes leurs portes
  rationale: La préposition situe ici la menace à chacune des portes, probablement celles des villes.
- source_word: נָתַתִּי
  choice: j’ai placé
  rationale: Ce verbe exprime naturellement en français la mise en place de l’épée menaçante.
- source_word: אִבְחַת חָרֶב
  choice: l’éclair de l’épée
  rationale: Le nom rare אִבְחָה est compris comme l’éclat fulgurant de l’épée. « Éclair » s’accorde avec בָרָק dans la proposition suivante.
- source_word: אָח
  choice: Ah !
  rationale: L’interjection conserve la brusque intensité émotionnelle sans préciser indûment s’il s’agit de plainte, d’effroi ou d’exclamation.
- source_word: עֲשׂוּיָה לְבָרָק
  choice: Elle est faite pour lancer des éclairs
  rationale: Le participe féminin renvoie à l’épée, et בָרָק évoque l’éclair ou le scintillement. Cette formulation rend l’image de l’épée préparée à étinceler avec une syntaxe française naturelle.
- source_word: מְעֻטָּה לְטָבַח
  choice: préparée pour le massacre
  rationale: La forme מְעֻטָּה est difficile et diversement comprise. Le contexte indique au minimum que l’épée est apprêtée ou prête à tuer; le choix principal reste donc général et la note conserve les possibilités plus précises.
