  text: זְעַ֤ק וְ/הֵילֵל֙ בֶּן אָדָ֔ם כִּי הִיא֙ הָיתָ֣ה בְ/עַמִּ֔/י הִ֖יא בְּ/כָל נְשִׂיאֵ֣י יִשְׂרָאֵ֑ל מְגוּרֵ֤י אֶל חֶ֨רֶב֙ הָי֣וּ אֶת עַמִּ֔/י לָ/כֵ֖ן סְפֹ֥ק אֶל יָרֵֽךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/017.yaml
  text: Cry out and wail[a], son of man, for it has come upon my people; it is upon all the princes of Israel. They are given over to the sword along with my people[b]; therefore strike your thigh.
translation:
  language: fr
  text: Pousse des cris et lamente-toi, fils d’homme, car elle s’est abattue sur mon peuple ; elle s’est abattue sur tous les princes d’Israël. Ils sont livrés à l’épée[a] avec mon peuple. C’est pourquoi frappe-toi la cuisse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Les terreurs causées par l’épée sont venues sur mon peuple. » L’hébreu de cette proposition est difficile, et le sens exact de מְגוּרֵי est discuté.'
    reason: alternative_reading
  - marker: b
    text: Se frapper la cuisse est un geste exprimant le deuil, la stupeur ou la lamentation dans les textes prophétiques.
    reason: cultural_note
lexical_decisions:
- source_word: זְעַק וְהֵילֵל
  choice: Pousse des cris et lamente-toi
  rationale: Les deux impératifs expriment une lamentation intense. « Pousse des cris » rend la force de זעק, tandis que « lamente-toi » restitue ילל dans un français naturel et digne.
- source_word: בֶּן אָדָם
  choice: fils d’homme
  rationale: Formule d’adresse caractéristique du livre d’Ézéchiel, conservée sous sa forme traditionnelle et immédiatement reconnaissable.
- source_word: כִּי הִיא הָיְתָה בְעַמִּי
  choice: car elle s’est abattue sur mon peuple
  rationale: Le pronom féminin renvoie vraisemblablement à l’épée évoquée dans le contexte. « S’est abattue sur » exprime naturellement la venue du jugement sans ajouter un substantif absent de la proposition.
- source_word: הִיא בְּכָל נְשִׂיאֵי יִשְׂרָאֵל
  choice: elle s’est abattue sur tous les princes d’Israël
  rationale: La répétition de « elle » reproduit l’insistance de l’hébreu. « Princes » garde la portée politique de נְשִׂיאֵי, plus précise que le terme général « dirigeants ».
- source_word: מְגוּרֵי אֶל חֶרֶב הָיוּ
  choice: Ils sont livrés à l’épée
  rationale: Cette proposition difficile est comprise comme décrivant les princes exposés ou abandonnés à l’épée. La formulation reste concise, tandis qu’une autre analyse possible est signalée en note.
- source_word: אֶת עַמִּי
  choice: avec mon peuple
  rationale: 'אֶת est compris ici dans un sens associatif : les princes subissent le même sort que le peuple.'
- source_word: סְפֹק אֶל יָרֵךְ
  choice: frappe-toi la cuisse
  rationale: Rend directement le geste corporel de deuil, de stupeur ou de lamentation demandé au prophète.
theological_decisions:
- issue: Référent du pronom féminin הִיא
  choice: Le pronom est conservé au féminin (« elle »), avec pour référent contextuel probable l’épée.
  alternative: Expliciter « l’épée » ou employer un nom général comme « le malheur » ou « le jugement ».
  rationale: Le féminin français permet de préserver le lien probable avec l’épée sans remplacer silencieusement le pronom par une interprétation plus précise que le texte.
- issue: Sens de מְגוּרֵי אֶל חֶרֶב הָיוּ
  choice: Les princes sont « livrés à l’épée » avec le peuple.
  alternative: « Les terreurs causées par l’épée sont venues sur mon peuple. »
  rationale: La syntaxe et le sens exact de מְגוּרֵי sont discutés. Le texte principal suit une lecture passive ou résultative cohérente avec le sort des princes, tout en conservant l’autre lecture en note.
translation_notes:
  register: Français international actuel, soutenu sans archaïsme. La répétition du pronom féminin garde l’insistance de l’hébreu et son lien contextuel probable avec « l’épée ». Les notes sont placées au point précis qu’elles éclairent.
