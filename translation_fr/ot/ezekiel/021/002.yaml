base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/002.yaml
  text: Son of man[a], set your face toward the south, and preach toward the south[c][b], and prophesy against the forest of the field in the Negeb.
translation:
  language: fr
  text: Fils d’homme, tourne ton visage vers le sud, fais ruisseler vers le midi[a] et prophétise contre la forêt de la campagne du Néguev.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu enchaîne trois termes apparentés désignant le sud : « Témân/sud », « darom/midi » et « Néguev ». Le verbe traduit par « fais ruisseler » signifie littéralement « fais goutter » ou « laisse tomber goutte à goutte » ; c’est une image de la parole prophétique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Conserve la forme de l’adresse caractéristique et récurrente adressée à Ézéchiel.
- source_word: שִׂים פָּנֶיךָ
  choice: tourne ton visage
  rationale: Rend naturellement l’expression hébraïque d’orientation résolue tout en conservant l’image du visage.
- source_word: דֶּרֶךְ תֵּימָנָה
  choice: vers le sud
  rationale: תֵּימָנָה a ici une valeur directionnelle; « vers le sud » convient mieux que le toponyme Témân dans ce parallélisme.
- source_word: וְהַטֵּף
  choice: fais couler tes paroles
  rationale: Préserve la métaphore hébraïque de la parole qui goutte ou coule, tout en explicitant qu’il s’agit d’une proclamation prophétique.
- source_word: אֶל דָּרוֹם
  choice: vers le midi
  rationale: Rend la direction exprimée par אֶל et conserve en français, grâce à un second terme méridional, une partie de la variation lexicale hébraïque.
- source_word: וְהִנָּבֵא
  choice: prophétise
  rationale: Équivalent direct et usuel du verbe נבא dans une mission prophétique.
- source_word: אֶל יַעַר הַשָּׂדֶה נֶגֶב
  choice: contre la forêt de la campagne du Néguev
  rationale: « Contre » exprime la portée hostile de l’oracle; la formulation conserve l’image inhabituelle de la forêt du champ et prend נֶגֶב comme nom de région.
- source_word: נֶגֶב
  choice: Néguev
  rationale: Le nom régional distingue le troisième terme méridional des deux indications directionnelles précédentes.
