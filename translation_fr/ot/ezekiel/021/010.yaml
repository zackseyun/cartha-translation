source:
  edition: WLC
  text: וְ/יָֽדְעוּ֙ כָּל בָּשָׂ֔ר כִּ֚י אֲנִ֣י יְהוָ֔ה הוֹצֵ֥אתִי חַרְבִּ֖/י מִ/תַּעְרָ֑/הּ לֹ֥א תָשׁ֖וּב עֽוֹד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/010.yaml
  text: And all flesh will know that I[a], Yahweh, have drawn my sword from its sheath; it will not return again.
translation:
  language: fr
  text: Et tous les humains[a] sauront que moi, Yahweh, j’ai tiré mon épée de son fourreau ; elle n’y rentrera plus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toute chair » ; on peut aussi traduire : « toute l’humanité » ou « tous les êtres humains ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Et … sauront
  rationale: Dans ce discours prophétique, la forme verbale exprime le résultat futur de l’action annoncée. « Sauront » conserve aussi la formule de reconnaissance fréquente chez Ézéchiel.
- source_word: כָּל בָּשָׂר
  choice: tous les humains
  rationale: Littéralement « toute chair ». Ici, l’expression désigne collectivement les êtres humains au-delà du seul Israël. La formulation retenue est claire en français moderne, tandis que le sens littéral est signalé en note.
- source_word: כִּי אֲנִי יְהוָה
  choice: que moi, Yahweh,
  rationale: La construction met fortement en relief l’identité du locuteur. L’apposition française « moi, Yahweh » préserve cette emphase sans ajouter le verbe « être », absent de la proposition hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte source.
- source_word: הוֹצֵאתִי חַרְבִּי
  choice: j’ai tiré mon épée
  rationale: Le hiphil de יצא signifie faire sortir. Avec une épée et son fourreau, « tirer son épée » est l’expression française naturelle et fidèle à l’image martiale.
- source_word: מִתַּעְרָהּ
  choice: de son fourreau
  rationale: « Fourreau » est le terme français courant pour l’étui d’une épée. Le possessif renvoie naturellement à l’épée.
- source_word: לֹא תָשׁוּב עוֹד
  choice: elle n’y rentrera plus
  rationale: Le verbe féminin renvoie à l’épée. « N’y rentrera plus » rend explicitement son retour dans le fourreau et conserve la valeur de עוֹד, « plus/de nouveau ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom propre divin au lieu de lui substituer un titre.
- issue: Portée de כָּל בָּשָׂר
  choice: tous les humains
  alternative: toute chair
  rationale: L’expression a ici une portée collective dépassant Israël. Le texte principal communique ce sens sans imposer une lecture confessionnelle, et la note conserve l’idiome hébraïque.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe garde l’emphase de « moi, Yahweh », et le point-virgule maintient le lien étroit entre l’épée tirée et son non-retour au fourreau.
