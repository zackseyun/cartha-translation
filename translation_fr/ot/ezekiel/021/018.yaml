  yaml_path: translation/ot/ezekiel/021/018.yaml
  text: For there is a testing[b][a]; and what if even the scepter that despises will not remain? declares the Lord GOD.
translation:
  language: fr
  text: Car il y a une mise à l’épreuve[a]. Et qu’en sera-t-il si même le sceptre qui méprise ne subsiste pas[b] ? — déclare le Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu de ce verset est particulièrement difficile et elliptique, surtout dans la proposition qui concerne le sceptre.
    reason: textual_difficulty
  - marker: b
    text: 'Autre traduction possible : « Et si même le sceptre qui méprise n’existait plus ? » Le mot hébreu rendu par « sceptre » peut aussi signifier « bâton », « verge » ou « tribu ».'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Conserve la valeur explicative ou justificative du lien avec le contexte précédent.
- source_word: בֹחַן
  choice: c’est une mise à l’épreuve
  rationale: Rend la formulation nominale, brève et elliptique, sans préciser indûment qui éprouve quoi.
- source_word: וּמָה אִם גַּם
  choice: Et qu’arrivera-t-il si même
  rationale: Exprime naturellement en français la force interrogative et conditionnelle de cette suite de particules difficile.
- source_word: שֵׁבֶט
  choice: sceptre
  rationale: Le contexte de royauté et de jugement favorise « sceptre », tout en laissant « bâton » et « tribu » comme possibilités lexicales.
- source_word: מֹאֶסֶת
  choice: qui méprise
  rationale: Préserve le sens actif du participe féminin de מאס et son accord avec שֵׁבֶט, féminin dans cette construction.
- source_word: לֹא יִהְיֶה
  choice: ne subsiste plus
  rationale: Rend l’idée littérale de « ne sera pas » dans un français intelligible, sans imposer une disparition violente ou immédiate.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: Conserve la formule prophétique solennelle et rend explicitement le nom divin יהוה par « Yahweh ».
theological_decisions:
- issue: Sens de שֵׁבֶט dans l’oracle
  choice: sceptre
  alternative: bâton, verge ou tribu
  rationale: « Sceptre » correspond le mieux à l’imagerie royale et judiciaire du contexte, mais le terme hébreu reste polysémique.
- issue: Rapport syntaxique de מֹאֶסֶת
  choice: 'participe actif qualifiant le sceptre : « le sceptre qui méprise »'
  alternative: « le sceptre méprisé » ou « le sceptre du mépris »
  rationale: La forme massorétique est active et féminine singulière; la traduction conserve cette donnée malgré l’obscurité du sens.
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte le nom propre יהוה; « Yahweh » le distingue du titre אֲדֹנָי sans produire la répétition « Seigneur Seigneur ».
translation_notes:
  register: Français international moderne, digne et prophétique. La phrase reste volontairement abrupte afin de ne pas effacer l’obscurité réelle de l’hébreu. Les deux appels de note [a] et [b] figurent dans le texte.
