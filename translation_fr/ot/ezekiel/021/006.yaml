lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans la formule prophétique ויהי דבר־יהוה אלי, cette tournure idiomatique française exprime naturellement la venue d’une révélation au prophète, sans conserver le calque raide « fut ».
- source_word: דְבַר
  choice: la parole
  rationale: Dans cette formule, דָּבָר désigne la parole ou le message divin. « La parole » préserve la formulation prophétique traditionnelle et son caractère révélatoire.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu par la forme française courante du nom divin, plutôt que par le titre substitutif « le Seigneur ».
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément de « fut adressée » rend naturellement en français la direction exprimée par אֶל avec le suffixe de première personne.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'L’infinitif introduit la parole divine qui suit. « En ces termes : » est une formulation française naturelle et dignifiée qui remplit clairement cette fonction.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. Le rendre par « Yahvé » conserve le nom propre dans une forme française reconnue, tandis que la note signale la convention traditionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. La formule prophétique est rendue idiomatiquement, avec deux-points pour introduire l’oracle qui suit.
