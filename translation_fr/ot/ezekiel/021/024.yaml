  text: וְ/אַתָּ֨ה בֶן אָדָ֜ם שִׂים לְ/ךָ֣ שְׁנַ֣יִם דְּרָכִ֗ים לָ/בוֹא֙ חֶ֣רֶב מֶֽלֶךְ בָּבֶ֔ל מֵ/אֶ֥רֶץ אֶחָ֖ד יֵצְא֣וּ שְׁנֵי/הֶ֑ם וְ/יָ֣ד בָּרֵ֔א בְּ/רֹ֥אשׁ דֶּֽרֶךְ עִ֖יר בָּרֵֽא־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/024.yaml
  text: And you[a], son of man, set for yourself two roads for the sword of the king of Babylon to come by; both of them shall go out from one land. And make a signpost[b]; make it at the head of the road to the city.
translation:
  language: fr
  text: Et toi, fils d’homme, trace deux routes par lesquelles viendra l’épée du roi de Babylone. Toutes deux sortiront d’un seul pays. Fabrique un panneau indicateur[a] ; place-le à la tête de la route qui mène à une ville[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu signifie littéralement « main » ; il désigne probablement ici un repère ou un panneau indiquant une direction.
    reason: lexical_alternative
  - marker: b
    text: Ou « au commencement de la route qui mène à une ville » ; l’expression hébraïque peut aussi désigner le point principal ou l’embranchement de la route.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: Conserve la formule d’adresse caractéristique d’Ézéchiel et le contraste implicite entre la condition humaine du prophète et Dieu.
- source_word: שִׂים לְךָ שְׁנַיִם דְּרָכִים
  choice: trace deux routes
  rationale: Dans cette action symbolique, « tracer » exprime naturellement l’idée de disposer ou de représenter les deux itinéraires, sans imposer qu’Ézéchiel construise matériellement des routes.
- source_word: לָבוֹא חֶרֶב מֶלֶךְ בָּבֶל
  choice: par lesquelles pourra venir l’épée du roi de Babylone
  rationale: Maintient l’image prophétique de l’épée comme représentation de l’offensive militaire, tout en reliant clairement sa venue aux routes.
- source_word: מֵאֶרֶץ אֶחָד יֵצְאוּ שְׁנֵיהֶם
  choice: Toutes deux partiront du même pays
  rationale: Rend idiomatiquement l’origine commune des deux routes ; « même pays » explicite en français naturel la valeur contextuelle de « un pays ».
- source_word: יָד
  choice: poteau indicateur
  rationale: Le sens premier est « main », mais le contexte routier indique vraisemblablement un repère directionnel, peut-être façonné comme une main.
- source_word: בָּרֵא
  choice: fabrique
  rationale: Ce verbe rare paraît ici signifier façonner ou confectionner. « Fabrique » convient au repère matériel sans préciser indûment sa matière.
- source_word: בְּרֹאשׁ דֶּרֶךְ עִיר
  choice: au départ de la route qui mène à la ville
  rationale: Reproduit l’image de la « tête » de la route dans un français compréhensible, tout en laissant la note signaler qu’un embranchement principal peut être visé.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’image de l’épée est conservée plutôt que remplacée par « armée » ou « attaque ». Les deux impératifs successifs gardent le caractère concret de l’action symbolique.
