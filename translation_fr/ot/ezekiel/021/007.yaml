  text: בֶּן אָדָ֗ם שִׂ֤ים פָּנֶ֨י/ךָ֙ אֶל יְר֣וּשָׁלִַ֔ם וְ/הַטֵּ֖ף אֶל מִקְדָּשִׁ֑ים וְ/הִנָּבֵ֖א אֶל אַדְמַ֥ת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/007.yaml
  text: Son of man[a], set your face toward Jerusalem, and preach toward the sanctuaries, and prophesy against the land of Israel.
translation:
  language: fr
  text: Fils d’homme, tourne ton visage vers Jérusalem, proclame en direction des sanctuaires[a] et prophétise contre la terre d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fais couler goutte à goutte [des paroles] vers les sanctuaires » ; il s’agit d’une image prophétique désignant la proclamation d’un message, ici un jugement.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Cette formule d’adresse récurrente à Ézéchiel conserve l’image hébraïque et son caractère vocationnel, sans en faire ici un titre messianique.
- source_word: שִׂים פָּנֶיךָ אֶל
  choice: tourne ton visage vers
  rationale: Rend naturellement l’orientation volontaire et résolue exprimée par l’idiome hébreu.
- source_word: יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
- source_word: וְהַטֵּף
  choice: prononce tes paroles contre
  rationale: Le verbe signifie littéralement « faire couler goutte à goutte », mais désigne ici la profération d’un message prophétique. La formulation française exprime clairement cet acte de parole, tandis que l’image littérale est signalée en note.
- source_word: מִקְדָּשִׁים
  choice: les sanctuaires
  rationale: Conserve le pluriel hébreu et le sens général de lieux consacrés, sans le restreindre à des temples distincts.
- source_word: וְהִנָּבֵא
  choice: prophétise contre
  rationale: Rend directement l’impératif et explicite la portée hostile de l’oracle de jugement dans ce contexte.
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: la terre d’Israël
  rationale: « Terre » convient au sens territorial et national du syntagme tout en restant proche de l’hébreu אַדָמָה.
theological_decisions:
- issue: Portée de l’idiome prophétique וְהַטֵּף dans un oracle de jugement
  choice: prononce tes paroles contre
  alternative: fais couler goutte à goutte tes paroles vers
  rationale: Une traduction strictement littérale obscurcirait probablement l’acte prophétique en français. Le texte principal en donne donc le sens contextuel, tandis que la note préserve la métaphore et la direction littérale de l’hébreu.
- issue: Valeur de la préposition אֶל avec les sanctuaires et la terre d’Israël
  choice: contre, selon la portée hostile de l’oracle
  alternative: vers / en direction de
  rationale: La préposition indique littéralement la direction, mais le contexte de jugement donne au discours une orientation hostile. La note attachée au premier verbe permet de conserver cette nuance directionnelle sans affaiblir la force de l’oracle.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe impérative reste proche de l’hébreu, avec une légère explicitation de l’idiome prophétique pour assurer la compréhension.
