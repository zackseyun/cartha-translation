  - severity: medium
    issue: « vous avez été rappelés au souvenir » est peu idiomatique
    rationale: Cette expression n’est pas naturelle en français moderne. « Vous êtes revenus en mémoire » rend le passif/réflexif sans identifier qui se souvient et préserve la répétition recherchée.
