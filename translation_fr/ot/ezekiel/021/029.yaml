  text: לָ/כֵ֗ן כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ יַ֗עַן הַזְכַּרְ/כֶם֙ עֲוֺ֣נְ/כֶ֔ם בְּ/הִגָּל֣וֹת פִּשְׁעֵי/כֶ֗ם לְ/הֵֽרָאוֹת֙ חַטֹּ֣אותֵי/כֶ֔ם בְּ/כֹ֖ל עֲלִילֽוֹתֵי/כֶ֑ם יַ֚עַן הִזָּ֣כֶרְ/כֶ֔ם בַּ/כַּ֖ף תִּתָּפֵֽשׂוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/029.yaml
  text: 'Therefore thus says the Lord GOD: Because you have brought your guilt to remembrance by uncovering your transgressions[a], so that your sins are seen in all your deeds, because you have come to remembrance[b], you will be seized by the hand.'
translation:
  language: fr
  text: 'C’est pourquoi, ainsi parle le Seigneur Yahweh : Puisque vous avez remis votre faute en mémoire[a] par le dévoilement de vos révoltes, afin que vos péchés soient visibles dans toutes vos actions, puisque vous êtes revenus en mémoire, vous serez saisis[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous avez fait rappeler votre faute ». L’hébreu répète la racine « se souvenir / rappeler » tout au long du verset.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vous serez pris dans la main », c’est-à-dire saisis et placés au pouvoir de quelqu’un.'
    reason: idiom_clarification
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה, conformément à la forme explicite du texte hébreu.
- source_word: הַזְכַּרְכֶם עֲוֺנְכֶם
  choice: vous avez rappelé votre faute
  rationale: 'Le hiphil de זכר est causatif : leur conduite remet leur faute en mémoire. « Rappeler » conserve aussi l’écho avec la seconde occurrence de la racine.'
- source_word: עֲוֺנְכֶם
  choice: votre faute
  rationale: עָוֹן peut désigner l’iniquité, la culpabilité ou sa conséquence. Ici, « faute » s’accorde naturellement avec les révoltes dévoilées et les péchés rendus visibles.
- source_word: בְּהִגָּלוֹת פִּשְׁעֵיכֶם
  choice: en dévoilant vos révoltes
  rationale: L’infinitif avec ב exprime ici la circonstance ou le moyen; פשׁע souligne la rébellion contre l’autorité, d’où « révoltes ».
- source_word: לְהֵרָאוֹת חַטֹּאתֵיכֶם
  choice: de sorte que vos péchés apparaissent
  rationale: Conserve la valeur passive de ראה au niphal et exprime naturellement le résultat de leur dévoilement.
- source_word: בְּכֹל עֲלִילוֹתֵיכֶם
  choice: dans toutes vos actions
  rationale: עֲלִילוֹת désigne les actes ou la conduite; « actions » est courant, large et compréhensible.
- source_word: הִזָּכֶרְכֶם
  choice: vous avez été rappelés au souvenir
  rationale: Cette formulation passive préserve l’ambiguïté sur l’agent et rend perceptible la répétition rhétorique de זכר.
- source_word: בַּכַּף תִּתָּפֵשׂוּ
  choice: vous serez saisis par la main
  rationale: La traduction garde l’image concrète de la main ou de la paume qui s’empare de quelqu’un, tout en exprimant la capture.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: « Yahweh » représente le nom propre יהוה plutôt que de le remplacer par un titre, tandis que « Seigneur » rend אֲדֹנָי.
- issue: Agent implicite du souvenir et de la saisie
  choice: ne pas identifier explicitement l’agent
  alternative: ajouter « devant Dieu » ou « par l’ennemi »
  rationale: L’hébreu emploie des formes passives sans nommer expressément l’agent; l’ajouter résoudrait une ambiguïté que le texte maintient.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La répétition de la racine זכר est conservée autant que possible par « rappelé / rappelés au souvenir », et les passifs hébreux restent non explicités quant à leur agent.
