revisions:
- from: 'C’est pourquoi, voici ce que dit le Seigneur Yahweh : Parce que vous avez rappelé votre faute en dévoilant vos révoltes, de sorte que vos péchés apparaissent dans toutes vos actions, parce que vous avez été rappelés au souvenir[a], vous serez saisis par la main[b].'
  to: 'C’est pourquoi, ainsi parle le Seigneur Yahweh : Puisque vous avez remis votre faute en mémoire[a] par le dévoilement de vos révoltes, afin que vos péchés soient visibles dans toutes vos actions, puisque vous êtes revenus en mémoire, vous serez saisis[b].'
  rationale: La révision maintient le jeu rhétorique sur זכר par « remis ... en mémoire » et « revenus en mémoire », tout en remplaçant deux formulations françaises déficientes. Le passif de l’infinitif hébreu est conservé par « par le dévoilement », sans préciser l’agent. La finale reste non spécifique quant à celui qui saisit.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:59:39Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens causal, la succession des deux emplois de זכר et l’absence d’agent explicite sont globalement reconnus. Toutefois, « en dévoilant vos révoltes » transforme le dévoilement passif de l’hébreu en une action explicitement accomplie par « vous », et « vous avez été rappelés au souvenir » n’est pas idiomatique en français.
  naturalness: La formulation proposée pour la seconde occurrence de זכר est lourde et peu naturelle. « Revenir en mémoire » est une expression française courante qui conserve l’agent implicite et l’écho lexical. « Par le dévoilement de vos révoltes » préserve naturellement le passif sans imposer d’agent.
  terminology: « Le Seigneur Yahweh » rend distinctement אֲדֹנָי et יהוה, conformément au choix de translittérer le nom divin. « Faute », « révoltes » et « péchés » maintiennent utilement les distinctions de la triade hébraïque. « Saisis » convient au contexte de capture, tandis que la note explicite l’image de la main.
  issues:
