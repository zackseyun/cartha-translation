base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/028.yaml
  text: And it will be to them like a false divination in their eyes; they have sworn sworn oaths to them[a], but he brings guilt to remembrance, so that they may be captured.
translation:
  language: fr
  text: Cela leur paraîtra une divination mensongère, alors même qu’ils leur ont fait des serments solennels[a]. Mais lui, il rappelle leur faute, afin qu’ils soient capturés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est difficile : littéralement, quelque chose comme « jurés de serments pour eux ». On peut aussi comprendre : « bien que des serments solennels les engagent » ou « serments sur serments pour eux ».'
    reason: La construction שְׁבֻעֵי שְׁבֻעוֹת לָהֶם est comprimée et son rapport syntaxique avec le contexte demeure discuté.
lexical_decisions:
- source_word: וְהָיָה לָהֶם
  choice: Ce sera à leurs yeux
  rationale: Dans ce discours prophétique, le parfait précédé de וְ porte naturellement une valeur future. La formulation française intègre avec fluidité לָהֶם et l’expression de perception qui suit.
- source_word: כְּקֶסוֹם שָׁוְא
  choice: comme une divination mensongère
  rationale: קֶסֶם désigne la divination, tandis que שָׁוְא évoque ici ce qui est faux, illusoire ou sans valeur. « Mensongère » exprime clairement le jugement porté par les intéressés.
- source_word: בְּעֵינֵיהֶם
  choice: à leurs yeux
  rationale: L’expression idiomatique hébraïque désigne leur manière de percevoir ou d’évaluer la divination; l’équivalent français est naturel et fidèle.
- source_word: שְׁבֻעֵי שְׁבֻעוֹת לָהֶם
  choice: eux qui leur ont prêté des serments solennels[a]
  rationale: La formule hébraïque est très condensée et difficile. Elle semble évoquer des serments formellement jurés, probablement en lien avec les obligations politiques du contexte. Les pronoms et la construction restent volontairement peu explicités, et une note signale les autres analyses possibles.
- source_word: וְהוּא
  choice: Mais lui
  rationale: Le pronom masculin marque un contraste avec l’évaluation des habitants. « Lui » conserve la référence implicite du texte, vraisemblablement au roi de Babylone dans le contexte, sans l’insérer explicitement.
- source_word: מַזְכִּיר עָוֹן
  choice: remet leur faute en mémoire
  rationale: Le verbe hiphil signifie faire se souvenir ou rappeler, et עָוֹן peut désigner la faute aussi bien que la culpabilité qui en découle. Cette formulation conserve la portée judiciaire sans préciser indûment à qui la faute est rappelée.
- source_word: לְהִתָּפֵשׂ
  choice: afin qu’ils soient capturés
  rationale: L’infinitif passif exprime ici le but ou le résultat. « Capturés » convient au contexte militaire et judiciaire.
theological_decisions:
- issue: Référent du pronom masculin וְהוּא
  choice: Conserver « lui » sans identifier explicitement le référent
  alternative: Nommer le roi de Babylone, ou comprendre le pronom comme renvoyant à la divination
  rationale: Le contexte favorise le roi de Babylone, mais le verset ne le nomme pas et le pronom masculin peut grammaticalement rappeler קֶסֶם. La traduction préserve cette tension.
- issue: Valeur de עָוֹן
  choice: faute
  alternative: culpabilité / iniquité
  rationale: « Faute » permet de garder ensemble l’acte répréhensible et sa conséquence judiciaire, sans imposer une distinction théologique absente du terme hébreu.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition hébraïque autour du serment est rendue par « serments solennels » dans le texte courant et explicitée en note. Les pronoms restent non identifiés afin de ne pas résoudre artificiellement les ambiguïtés du texte source.
