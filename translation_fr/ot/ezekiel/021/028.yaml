- from: Ce sera à leurs yeux comme une divination mensongère, eux qui leur ont prêté des serments solennels[a]. Mais lui remet leur faute en mémoire, afin qu’ils soient capturés.
  to: Cela leur paraîtra une divination mensongère, alors même qu’ils leur ont fait des serments solennels[a]. Mais lui, il rappelle leur faute, afin qu’ils soient capturés.
  rationale: La révision remplace une collocation française peu idiomatique par « faire des serments », rend plus naturellement la perspective exprimée par « pour eux / à leurs yeux », et conserve l’ambiguïté des pronoms. La note maintient les analyses concurrentes de la formule hébraïque difficile. Aucun référent n’est nommé et aucune interprétation doctrinale n’est ajoutée.
