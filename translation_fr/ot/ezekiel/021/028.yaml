    rationale: « jurés de serments pour eux » ne constitue pas une représentation française suffisamment transparente de la forme hébraïque et peut être compris comme une analyse certaine. Il convient de la présenter explicitement comme une littéralité approximative et de maintenir les autres possibilités.
  revised_text: Cela leur paraîtra une divination mensongère, alors même qu’ils leur ont fait des serments solennels[a]. Mais lui, il rappelle leur faute, afin qu’ils soient capturés.
