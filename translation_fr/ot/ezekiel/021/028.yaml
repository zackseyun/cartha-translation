    rationale: « eux qui leur ont prêté des serments solennels » introduit une tournure française impropre et traite comme certaine une relation syntaxique que l’hébreu comprimé ne permet pas d’établir avec certitude. Une formulation « alors même qu’ils leur ont fait des serments solennels » est naturelle tout en laissant les référents implicites.
  - severity: low
