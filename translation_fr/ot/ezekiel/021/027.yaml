  text: בִּֽ/ימִינ֞/וֹ הָיָ֣ה הַ/קֶּ֣סֶם יְרוּשָׁלִַ֗ם לָ/שׂ֤וּם כָּרִים֙ לִ/פְתֹּ֤חַ פֶּה֙ בְּ/רֶ֔צַח לְ/הָרִ֥ים ק֖וֹל בִּ/תְרוּעָ֑ה לָ/שׂ֤וּם כָּרִים֙ עַל שְׁעָרִ֔ים לִ/שְׁפֹּ֥ךְ סֹלְלָ֖ה לִ/בְנ֥וֹת דָּיֵֽק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/027.yaml
  text: 'In his right hand was the divination for Jerusalem: to set battering rams[a], to open the mouth with slaughter, to raise the voice with a battle cry, to set battering rams against the gates, to heap up a siege ramp[b], to build a siege wall.'
translation:
  language: fr
  text: 'Dans sa main droite, le présage désignait Jérusalem : mettre en place des béliers[a], ouvrir la bouche pour le carnage[b], pousser un cri de guerre, mettre en place des béliers contre les portes, élever une rampe de siège, construire un ouvrage de siège[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « installer des machines de siège ». Le terme hébreu désigne ici probablement des béliers.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ouvrir la bouche dans le carnage »; l’expression peut évoquer l’ordre ou le cri qui déclenche le massacre.
    reason: lexical_ambiguity
  - marker: c
    text: Ou « construire un mur d’encerclement »; le terme hébreu désigne de façon générale un ouvrage militaire employé lors d’un siège.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּימִינוֹ
  choice: Dans sa main droite
  rationale: 'Rend concrètement la scène divinatoire : le résultat ou signe concernant Jérusalem se trouve dans la main droite du roi.'
- source_word: הַקֶּסֶם יְרוּשָׁלִַם
  choice: l’oracle concernant Jérusalem
  rationale: « Oracle » exprime ici le résultat de la divination, tandis que « concernant » conserve le lien syntaxique sans préciser au-delà de l’hébreu comment le signe désigne la ville.
- source_word: לָשׂוּם כָּרִים
  choice: placer des béliers
  rationale: Dans ce contexte de siège, כָּרִים désigne des béliers servant à l’assaut; la formule est répétée comme dans l’hébreu.
- source_word: לִפְתֹּחַ פֶּה בְּרֶצַח
  choice: ouvrir la bouche pour le carnage
  rationale: Conserve l’image vive et inhabituelle de l’ouverture de la bouche, tout en rendant בְּ par une relation de but possible en contexte; l’ambiguïté est signalée en note.
- source_word: לְהָרִים קוֹל בִּתְרוּעָה
  choice: pousser un cri de guerre
  rationale: Formulation française naturelle qui communique l’élévation de la voix et la valeur militaire de תְּרוּעָה.
- source_word: עַל שְׁעָרִים
  choice: contre les portes
  rationale: « Contre » exprime naturellement la direction hostile des béliers vers les portes de la ville.
- source_word: לִשְׁפֹּךְ סֹלְלָה
  choice: élever une rampe de siège
  rationale: סֹלְלָה désigne une levée ou rampe d’assaut; « élever » rend idiomatiquement l’amoncellement de matériaux suggéré par le verbe.
- source_word: לִבְנוֹת דָּיֵק
  choice: construire un ouvrage de siège
  rationale: Le référent militaire exact de דָּיֵק est incertain; le terme générique évite de trancher arbitrairement entre mur d’encerclement, retranchement ou tour.
theological_decisions: []
