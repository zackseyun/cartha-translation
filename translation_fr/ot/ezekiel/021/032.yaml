base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/032.yaml
  text: A ruin[a], a ruin, a ruin—I will make it. This also shall not be, until he comes whose right it is[b], and I will give it to him.
translation:
  language: fr
  text: 'Une ruine[a], une ruine, une ruine : j’en ferai une ruine. Cela aussi ne sera plus, jusqu’à ce que vienne celui à qui appartient le droit[b], et je le lui donnerai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Renversement, renversement, renversement ». L’hébreu répète trois fois le même nom pour insister.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « à qui appartient le jugement » ou « à qui cela revient légitimement ». Beaucoup d’interprètes y voient une allusion à Genèse 49.10 et une possible référence messianique.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַוָּה עַוָּה עַוָּה
  choice: Une ruine, une ruine, une ruine
  rationale: La triple répétition nominale est conservée afin de rendre l’insistance solennelle et l’annonce d’un renversement total.
- source_word: אֲשִׂימֶנָּה
  choice: voilà ce que j’en ferai
  rationale: Cette formulation française naturelle rend le verbe « mettre, faire » et son suffixe féminin sans préciser abusivement l’objet implicite.
- source_word: גַּם זֹאת לֹא הָיָה
  choice: Cela non plus ne sera
  rationale: La tournure conserve l’ajout exprimé par גַּם et la formulation dépouillée du verbe « être », dont la valeur est prospective dans cet oracle.
- source_word: עַד בֹּא
  choice: jusqu’à ce que vienne celui
  rationale: Le français maintient l’attente d’une personne à venir, identifiée seulement par la proposition relative qui suit.
- source_word: אֲשֶׁר לוֹ הַמִּשְׁפָּט
  choice: à qui appartient le droit
  rationale: מִשְׁפָּט peut désigner le jugement, la justice ou un droit légitime. Dans ce contexte royal, « le droit » exprime l’idée de titre légitime sans identifier explicitement son détenteur.
- source_word: וּנְתַתִּיו
  choice: je le lui donnerai
  rationale: Le pronom garde implicite l’objet du don, comme en hébreu, probablement la dignité ou l’autorité royale évoquée par le contexte.
theological_decisions:
- issue: Identité de celui « à qui appartient le droit »
  choice: Ne pas identifier cette personne dans le corps du texte
  alternative: La désigner explicitement comme le Messie ou comme un souverain davidique à venir
  rationale: La formulation peut évoquer Genèse 49.10 et recevoir une lecture messianique, mais le texte hébreu ne nomme pas la personne. La traduction préserve donc cette ouverture.
translation_notes:
  register: Français international moderne, solennel et accessible. La répétition rhétorique et la brièveté énigmatique de l’oracle sont maintenues ; la ponctuation clarifie la lecture sans résoudre les référents implicites.
