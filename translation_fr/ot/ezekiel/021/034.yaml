  text: בַּ/חֲז֥וֹת לָ/ךְ֙ שָׁ֔וְא בִּ/קְסָם לָ֖/ךְ כָּזָ֑ב לָ/תֵ֣ת אוֹתָ֗/ךְ אֶֽל צַוְּארֵי֙ חַֽלְלֵ֣י רְשָׁעִ֔ים אֲשֶׁר בָּ֣א יוֹמָ֔/ם בְּ/עֵ֖ת עֲוֺ֥ן קֵֽץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/034.yaml
  text: while they see false visions for you and divine lies for you[a], to place you on the necks of the slain wicked[c][b], whose day has come at the time of the punishment of the end.
translation:
  language: fr
  text: pendant qu’on a pour toi des visions trompeuses et qu’on pratique pour toi une divination mensongère[a], pour te placer sur les cous des méchants tués[b], ceux dont le jour est venu au temps du châtiment final[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quand on voit pour toi ce qui est faux et qu’on pratique pour toi une divination trompeuse ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sur les cous des méchants tués ». L’image est difficile ; elle peut évoquer le fait de te faire tomber parmi ceux qui ont déjà été tués.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « au temps de la faute finale » ou « au temps de la culpabilité finale ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחֲזוֹת לָךְ שָׁוְא
  choice: pendant qu’on a pour toi des visions trompeuses
  rationale: L’infinitif construit avec בְּ a une valeur circonstancielle et temporelle. Le sujet implicite demeure indéfini en français, comme dans l’hébreu, et « visions trompeuses » exprime naturellement la fausseté de שָׁוְא dans ce contexte prophétique.
- source_word: בִּקְסָם לָךְ כָּזָב
  choice: et qu’on pratique pour toi une divination mensongère
  rationale: La construction parallèle est conservée. « Pratiquer une divination » rend clairement l’action de קסם, tandis que « mensongère » traduit כָּזָב sans suggérer que la divination obtient ici une révélation véritable.
- source_word: לָתֵת אוֹתָךְ
  choice: afin de te placer
  rationale: L’infinitif לָתֵת exprime ici le but ou le résultat. « Placer » conserve la valeur causative concrète de נתן devant le complément introduit par אֶל.
- source_word: אֶל צַוְּארֵי חַלְלֵי רְשָׁעִים
  choice: sur le cou des méchants tués
  rationale: La formulation maintient l’image concrète et difficile du texte hébreu au lieu de l’expliquer dans le corps du verset. חַלְלֵי רְשָׁעִים est compris comme désignant des méchants qui ont été tués.
- source_word: אֲשֶׁר בָּא יוֹמָם
  choice: ceux dont le jour est venu
  rationale: Cette formulation conserve explicitement l’image prophétique du « jour » arrivé, plutôt que de la réduire à « leur heure ».
- source_word: בְּעֵת עֲוֺן קֵץ
  choice: au temps du châtiment final
  rationale: Dans ce contexte de jugement, עָוֺן peut désigner la peine liée à la faute. « Final » rend la force de קֵץ de manière naturelle, tout en signalant en note les lectures « faute » et « culpabilité ».
theological_decisions:
- issue: Sens de עֲוֺן dans la formule de jugement
  choice: châtiment
  alternative: faute ou culpabilité
  rationale: Le contexte porte sur l’arrivée du jour du jugement des méchants. Le sens conséquentiel « châtiment » est donc retenu, sans exclure les autres valeurs du nom hébreu, qui sont indiquées en note.
- issue: Image du cou des méchants tués
  choice: conserver l’image concrète
  alternative: te faire tomber parmi les méchants tués
  rationale: L’image hébraïque est obscure. La conserver évite de résoudre par paraphrase une ambiguïté réelle du texte et préserve sa tension prophétique.
translation_notes:
  register: Français international actuel, digne et accessible. Le pronom indéfini « on » évite d’ajouter un sujet précis absent de la proposition hébraïque. L’image obscure des cous est maintenue dans le texte et brièvement éclairée en note.
