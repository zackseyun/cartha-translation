lexical_decisions:
- source_word: וָאֹמַר
  choice: Alors j’ai dit
  rationale: Le waw suivi du verbe narratif fait progresser le récit; « Alors » exprime naturellement la succession en français.
- source_word: אֲהָהּ
  choice: Ah !
  rationale: Interjection de détresse ou de plainte; « Ah ! » reste naturel et digne, sans la nuance triomphante que pourrait avoir « Ah ah ! ».
- source_word: אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה, sans produire l’expression maladroite « Seigneur SEIGNEUR ».
- source_word: הֵמָּה אֹמְרִים לִי
  choice: Ils disent à mon sujet
  rationale: Dans ce contexte, לִי peut désigner ce que les gens disent au sujet d’Ézéchiel; cette formulation française convient au discours cité à la troisième personne tout en signalant l’autre possibilité en note.
- source_word: הֲלֹא
  choice: Ne…-t-il pas
  rationale: La tournure négative introduit une question rhétorique qui attend l’assentiment.
- source_word: מְמַשֵּׁל מְשָׁלִים
  choice: parle… en paraboles
  rationale: Le groupe verbal et nominal de même racine évoque l’emploi de propos figurés, proverbiaux ou énigmatiques. La formulation française est naturelle et ne réduit pas le sens à de simples énigmes.
- source_word: הוּא
  choice: il
  rationale: Le pronom renvoie directement à Ézéchiel dans les paroles rapportées.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  alternative: Seigneur DIEU
  rationale: « Seigneur Yahweh » distingue le titre du nom propre divin et rend explicitement le tétragramme présent dans le texte hébreu.
- issue: Sens de לִי dans les paroles de la population
  choice: à mon sujet
  alternative: à moi
  rationale: La reprise d’Ézéchiel à la troisième personne favorise l’idée de propos tenus à son sujet, mais l’hébreu permet aussi de comprendre qu’ils lui adressent directement ces mots; l’ambiguïté est conservée en note.
translation_notes:
  register: Français international actuel, sobre et digne. La ponctuation rend audible la plainte du prophète. « Paraboles » conserve le terme biblique courant, tandis que la note en élargit la portée sémantique.
