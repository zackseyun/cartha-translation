base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/005.yaml
  text: Then I said[a], “Ah, Lord GOD! They are saying of me[b], ‘Is he not a speaker of parables?’”
translation:
  language: fr
  text: 'Alors j’ai dit : « Ah ! Seigneur Yahweh ! Ils disent de moi[a] : “Ne parle-t-il pas en paraboles[b] ?” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils me disent : “Ne parle-t-il pas en paraboles ?” » L’hébreu peut désigner soit ce qu’ils disent à Ézéchiel, soit ce qu’ils disent de lui.'
    reason: alternative_reading
  - marker: b
    text: L’expression hébraïque associe un verbe et un nom de même racine; elle peut évoquer des paraboles, des proverbes ou un langage figuré et énigmatique.
