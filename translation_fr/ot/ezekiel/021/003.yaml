- from: 'Tu diras à la forêt du Néguev[a] : « Écoute la parole de Yahvé. Voici ce que dit le Seigneur Yahvé : Je vais allumer en toi un feu qui dévorera tous tes arbres verts et tous tes arbres secs. La flamme ardente ne s’éteindra pas, et elle brûlera tous les visages, du sud jusqu’au nord. »'
  to: 'Tu diras à la forêt du Néguev[a] : « Écoute la parole de Yahvé. Voici ce que dit le Seigneur Yahvé : Je vais allumer en toi un feu ; il dévorera en toi tout arbre vert et tout arbre sec. La flamme ardente ne s’éteindra pas, et tous les visages seront brûlés par elle, du sud jusqu’au nord. »'
  rationale: La révision corrige la représentation de la voix passive dans la dernière proposition et retire le possessif ajouté devant « arbres ». Elle maintient le sens imagé, l’ambiguïté géographique de néguev signalée en note, et les rendus établis des noms divins.
