review_pass:
  verdict: revise
  source_fidelity: 'Le projet rend fidèlement l’adresse à la forêt du Néguev, le nom divin, l’annonce du feu et l’étendue « du sud au nord ». Toutefois, וְנִצְרְבוּ בָהּ est une forme passive : les visages sont brûlés/roussis par le feu, plutôt que le feu qui les brûle activement. La révision restitue cette construction sans interpréter l’image.'
  naturalness: Le français est clair, actuel et conserve un registre prophétique digne. « Tout arbre vert et tout arbre sec » reflète mieux les deux occurrences distributives de כָל que « tous tes arbres », tout en évitant d’ajouter un possessif absent de l’hébreu.
  terminology: « Néguev », « Yahvé » et « le Seigneur Yahvé » sont cohérents et naturels dans un français biblique moderne. « Flamme ardente » rend bien l’intensification de לַהֶבֶת שַׁלְהֶבֶת.
  issues:
  - severity: medium
    issue: La dernière proposition transforme une construction passive en active.
    rationale: וְנִצְרְבוּ בָהּ כָּל פָּנִים signifie littéralement que « tous les visages seront brûlés/roussis par elle [la flamme] ». « Elle brûlera tous les visages » exprime un sens proche, mais efface la voix passive et l’instrumental בָהּ.
  - severity: low
    issue: Le possessif « tes » n’est pas exprimé dans la source.
    rationale: L’hébreu dit « tout arbre vert et tout arbre sec » avec la localisation répétée « en toi ». Employer « tout arbre » préserve plus directement la formulation et la portée distributive.
  revised_text: 'Tu diras à la forêt du Néguev[a] : « Écoute la parole de Yahvé. Voici ce que dit le Seigneur Yahvé : Je vais allumer en toi un feu ; il dévorera en toi tout arbre vert et tout arbre sec. La flamme ardente ne s’éteindra pas, et tous les visages seront brûlés par elle, du sud jusqu’au nord. »'
  revised_footnotes:
