source:
  edition: WLC
  text: וְ/אָֽמַרְתָּ֙ לְ/יַ֣עַר הַ/נֶּ֔גֶב שְׁמַ֖ע דְּבַר יְהוָ֑ה כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֡ה הִנְ/נִ֣י מַֽצִּית בְּ/ךָ֣ אֵ֡שׁ וְ/אָכְלָ֣ה בְ/ךָ֣ כָל עֵֽץ לַח֩ וְ/כָל עֵ֨ץ יָבֵ֤שׁ לֹֽא תִכְבֶּה֙ לַהֶ֣בֶת שַׁלְהֶ֔בֶת וְ/נִצְרְבוּ בָ֥/הּ כָּל פָּנִ֖ים מִ/נֶּ֥גֶב צָפֽוֹנָ/ה־־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/003.yaml
  text: 'And say to the forest of the Negev[a], ‘Hear the word of Yahweh. Thus says the Lord GOD: Behold, I am kindling a fire in you, and it will consume in you every green tree and every dry tree. The blazing flame will not be quenched[b], and by it every face from south to north will be scorched.’'
translation:
  language: fr
  text: 'Tu diras à la forêt du Néguev[a] : « Écoute la parole de Yahvé. Voici ce que dit le Seigneur Yahvé : Je vais allumer en toi un feu ; il dévorera en toi tout arbre vert et tout arbre sec. La flamme ardente ne s’éteindra pas, et tous les visages seront brûlés par elle, du sud jusqu’au nord. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la forêt du pays du Sud ». Le mot hébreu néguev peut désigner le sud ou le pays du Sud, ainsi que la région appelée le Néguev.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַר הַנֶּגֶב
  choice: la forêt du Néguev
  rationale: יַעַר désigne une forêt ou une région boisée. הַנֶּגֶב peut être le nom de la région du Néguev ou désigner plus généralement le sud ; le nom géographique est retenu dans le texte, avec l’autre possibilité en note.
- source_word: שְׁמַע דְּבַר יְהוָה
  choice: Écoute la parole de Yahvé
  rationale: L’impératif singulier personnifie la forêt et introduit la formule prophétique avec naturel en français actuel.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française traditionnelle « Yahvé » rend directement le nom divin YHWH plutôt que de lui substituer un titre.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahvé
  rationale: Cette formulation distingue le titre אֲדֹנָי du nom propre divin יְהוָה tout en conservant leur association.
- source_word: הִנְנִי מַצִּית בְּךָ אֵשׁ
  choice: Je vais allumer en toi un feu
  rationale: הִנְנִי suivi du participe annonce une action divine imminente. « Je vais » est naturel en français et garde cette force prospective.
- source_word: וְאָכְלָה
  choice: qui dévorera
  rationale: Le verbe אָכַל, appliqué au feu, évoque concrètement une destruction qui consume ; « dévorer » maintient la vigueur de l’image.
- source_word: כָל עֵץ לַח וְכָל עֵץ יָבֵשׁ
  choice: tous tes arbres verts et tous tes arbres secs
  rationale: לַח signifie ici frais ou encore vert, en contraste avec יָבֵשׁ, sec. La reprise distributive de כָל est rendue naturellement en français.
- source_word: לֹא תִכְבֶּה לַהֶבֶת שַׁלְהֶבֶת
  choice: La flamme ardente ne s’éteindra pas
  rationale: La collocation intensive décrit une flamme vive. « Ne s’éteindra pas » rend clairement l’idée d’un feu impossible à éteindre sans ajouter d’agent.
- source_word: וְנִצְרְבוּ בָהּ כָּל פָּנִים
  choice: elle brûlera tous les visages
  rationale: Le verbe rare צרב exprime l’action de brûler ou roussir. « Tous les visages » conserve l’image hébraïque et sa possible portée humaine sans l’interpréter dans le texte.
- source_word: מִנֶּגֶב צָפוֹנָה
  choice: du sud jusqu’au nord
  rationale: La formulation exprime l’étendue complète du jugement depuis le sud en direction du nord.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom divin ; le rendre comme un nom propre préserve cette distinction, tandis que « Seigneur » est réservé au titre אֲדֹנָי.
- issue: Identification de la forêt et du feu
  choice: Conserver l’image concrète de la forêt incendiée
  alternative: Identifier explicitement la forêt à Juda et le feu au jugement divin
  rationale: Le verset formule l’oracle sous forme d’image. Son interprétation ne doit pas être introduite dans la traduction elle-même.
- issue: Portée de כָּל פָּנִים, « tous les visages »
  choice: Conserver « tous les visages »
  alternative: toute la surface du pays
  rationale: L’expression peut évoquer les personnes exposées au feu ou, par extension, toute la face du territoire. La traduction garde cette tension au lieu de choisir silencieusement une interprétation.
translation_notes:
  register: Français international actuel, clair et digne. Le discours direct et les images concrètes de l’oracle sont conservés. « Voici ce que dit » maintient la solennité de la formule prophétique sans archaïsme ; « Yahvé » suit l’usage français du nom divin.
