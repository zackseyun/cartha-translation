source:
  edition: WLC
  text: וְ/הָיָה֙ כִּֽי יֹאמְר֣וּ אֵלֶ֔י/ךָ עַל מָ֖ה אַתָּ֣ה נֶאֱנָ֑ח וְ/אָמַרְתָּ֡ אֶל שְׁמוּעָ֣ה כִֽי בָאָ֡ה וְ/נָמֵ֣ס כָּל לֵב֩ וְ/רָפ֨וּ כָל יָדַ֜יִם וְ/כִהֲתָ֣ה כָל ר֗וּחַ וְ/כָל בִּרְכַּ֨יִם֙ תֵּלַ֣כְנָה מַּ֔יִם הִנֵּ֤ה בָאָה֙ וְ/נִֽהְיָ֔תָה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/012.yaml
  text: And it shall be[a], when they say to you, ‘Why are you groaning?’ that you shall say, ‘Because of the news, for it is coming.’ Then every heart will melt, all hands will grow weak, every spirit will faint, and all knees will run with water. Look, it is coming, and it will happen[b], declares the Lord GOD.
translation:
  language: fr
  text: 'Et quand ils te demanderont : « Pourquoi gémis-tu ? », tu répondras : « À cause de la nouvelle[a], car elle arrive. » Alors tous les cœurs fondront, toutes les mains faibliront, tout esprit défaillira, et tous les genoux ruisselleront d’eau[b]. La voici qui arrive, et cela se produira — déclaration du Seigneur Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « À cause de ce qui a été annoncé » ; le mot hébreu peut désigner une nouvelle, une annonce ou un rapport.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie une image difficile, littéralement liée aux genoux et à l’eau. Elle évoque la terreur et l’effondrement ; elle peut décrire des genoux devenus faibles comme de l’eau ou une perte de contrôle corporel sous l’effet de la peur.
    reason: cultural_note
lexical_decisions:
- source_word: נֶאֱנָח
  choice: gémis-tu
  rationale: Le participe niphal exprime une lamentation audible. « Gémir » conserve mieux sa force physique et affective que le plus léger « soupirer ».
- source_word: שְׁמוּעָה
  choice: la nouvelle
  rationale: Le mot désigne ici l’annonce redoutée d’un désastre imminent. « La nouvelle » est naturel en français moderne, tandis que « le rapport » demeure une possibilité lexicale signalée en note.
- source_word: כִּי בָאָה
  choice: car elle arrive
  rationale: Le féminin du verbe reprend שְׁמוּעָה. Le présent français exprime naturellement l’arrivée imminente de la nouvelle annoncée.
- source_word: וְנָמֵס כָּל לֵב
  choice: tous les cœurs fondront
  rationale: La métaphore hébraïque de la perte de courage est conservée sans la réduire à une explication abstraite.
- source_word: וְרָפוּ כָל יָדַיִם
  choice: toutes les mains faibliront
  rationale: Cette formulation garde l’image corporelle tout en exprimant clairement la perte de force et de capacité d’agir.
- source_word: וְכִהֲתָה כָל רוּחַ
  choice: tout esprit défaillira
  rationale: רוּחַ renvoie ici à l’élan intérieur ou au courage. « Défaillira » communique l’effondrement de la résolution tout en préservant « esprit ».
- source_word: וְכָל בִּרְכַּיִם תֵּלַכְנָה מַּיִם
  choice: tous les genoux ruisselleront d’eau
  rationale: La formulation reste proche de l’image hébraïque délibérément saisissante sans décider si elle évoque surtout la faiblesse des genoux ou la perte de contrôle corporel sous l’effet de la peur.
- source_word: הִנֵּה בָאָה
  choice: La voici qui arrive
  rationale: « Voici » rend l’interjection déictique avec son urgence et permet au féminin de reprendre naturellement « la nouvelle ».
- source_word: וְנִהְיָתָה
  choice: cela se produira
  rationale: Le verbe affirme l’accomplissement certain de l’événement annoncé dans un français actuel et digne.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Cette forme distingue אֲדֹנָי, rendu par « Seigneur », du nom divin יהוה, translittéré « Yahweh », et évite l’expression redondante « Seigneur SEIGNEUR ».
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte à la fois le titre אֲדֹנָי et le nom propre יהוה. La traduction retenue rend explicitement les deux éléments sans importer une interprétation confessionnelle.
- issue: Référent de « elle arrive » et de « cela se produira »
  choice: Maintenir le passage de la nouvelle qui arrive à l’événement qui se réalise
  alternative: Faire de chaque expression une référence explicite au désastre
  rationale: L’hébreu laisse la nouvelle annoncée et son contenu menaçant étroitement liés. La traduction préserve cette tension au lieu d’expliciter partout « le désastre ».
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsmes. Les métaphores corporelles du texte hébreu sont conservées. Les futurs rendent les formes verbales qui présentent ici les conséquences certaines de l’annonce imminente.
