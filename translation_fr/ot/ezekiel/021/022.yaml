  terminology: « Yahweh » reproduit correctement le tétragramme selon les choix du projet. « Fureur » rend bien חֵמָה dans ce contexte. La note b doit conserver l’image de la fureur mise au repos et expliciter prudemment que cela résulte de l’accomplissement du jugement.
