  source_fidelity: La première proposition rend fidèlement l’emphase additive de וְגַם אֲנִי et l’image de frapper une main contre l’autre. En revanche, « donner libre cours à ma fureur » signifie surtout laisser la fureur se déployer; וַהֲנִחֹתִי exprime sa mise au repos, dans ce contexte par son plein exercice. « J’assouvirai ma fureur » rend mieux ce résultat sans effacer le cadre judiciaire.
