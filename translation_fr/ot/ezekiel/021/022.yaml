  text: וְ/גַם אֲנִ֗י אַכֶּ֤ה כַפִּ/י֙ אֶל כַּפִּ֔/י וַ/הֲנִחֹתִ֖י חֲמָתִ֑/י אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/022.yaml
  text: And I too will strike my hands together[a], and I will satisfy my wrath. I, Yahweh[b], have spoken.
translation:
  language: fr
  text: Moi aussi, je frapperai mes mains l’une contre l’autre[a], et j’assouvirai ma fureur[b]. Moi, Yahweh, j’ai parlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je frapperai ma main contre ma main »; ce geste souligne ici avec force le jugement.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « je ferai reposer ma fureur »; elle sera apaisée après s’être pleinement exercée dans le jugement.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Moi aussi
  rationale: Rend naturellement en français la valeur additive et emphatique de גַם avec le pronom אֲנִי.
- source_word: אַכֶּה כַפִּי אֶל כַּפִּי
  choice: je frapperai mes mains l’une contre l’autre
  rationale: Préserve l’image physique et la force du geste de jugement, sans employer « applaudir », qui pourrait suggérer à tort la joie ou l’approbation.
- source_word: וַהֲנִחֹתִי חֲמָתִי
  choice: je donnerai libre cours à ma fureur
  rationale: Exprime idiomatiquement l’idée que la fureur est menée jusqu’à son terme et ainsi amenée au repos; une note conserve la formulation plus littérale.
- source_word: חֲמָתִי
  choice: ma fureur
  rationale: « Fureur » rend l’intensité de חֵמָה et convient au contexte prophétique de jugement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: דִּבַּרְתִּי
  choice: j’ai parlé
  rationale: Conserve la formule solennelle de déclaration divine exprimée par le parfait hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » en préserve la fonction de nom personnel sans importer un titre de substitution.
- issue: Repos de la fureur divine
  choice: je donnerai libre cours à ma fureur
  alternative: je ferai reposer ma fureur
  rationale: Le causatif de נוח appliqué à la fureur évoque sa mise au repos par l’accomplissement du jugement. Le texte principal en donne le sens idiomatique, tandis que la note maintient l’image hébraïque et son ambiguïté.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe met en relief « Moi aussi » et « Moi, Yahweh », comme le fait l’hébreu. Les notes signalent les deux idiomes sans alourdir le corps du verset.
