source:
  edition: WLC
  text: וְ/אַתָּה֙ חָלָ֣ל רָשָׁ֔ע נְשִׂ֖יא יִשְׂרָאֵ֑ל אֲשֶׁר בָּ֣א יוֹמ֔/וֹ בְּ/עֵ֖ת עֲוֺ֥ן קֵֽץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/030.yaml
  text: And you[a], slain wicked one, prince of Israel, whose day has come at the time of the punishment of the end[b],
translation:
  language: fr
  text: Et toi, prince méchant d’Israël, transpercé[a], dont le jour est venu, au temps du châtiment final[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « profane ». Le mot hébreu peut aussi se comprendre comme « mortellement blessé ».
    reason: alternative_reading
  - marker: b
    text: Plus littéralement, « la faute de la fin ». L’hébreu peut désigner soit une faute parvenue à son comble, soit le châtiment final qu’elle entraîne.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלָל
  choice: transpercé
  rationale: Le terme désigne ici le plus naturellement quelqu’un qui a été percé et voué à la mort. « Transpercé » conserve l’image concrète et la certitude prophétique du jugement, tout en laissant en note l’autre sens possible, « profané ».
- source_word: רָשָׁע
  choice: méchant
  rationale: Employé comme qualificatif substantivé dans l’interpellation, le mot exprime directement la culpabilité morale du prince sans ajouter une qualification juridique absente du texte.
- source_word: נְשִׂיא יִשְׂרָאֵל
  choice: prince d’Israël
  rationale: « Prince » conserve le titre politique traditionnel et le registre prophétique de נָשִׂיא; « dirigeant » serait possible, mais moins précis comme titre.
- source_word: אֲשֶׁר בָּא יוֹמוֹ
  choice: dont le jour est arrivé
  rationale: Cette formulation garde l’image hébraïque du jour assigné au jugement, plutôt que de la remplacer par l’expression plus générale « dont le temps est venu ».
- source_word: בְּעֵת
  choice: au temps de
  rationale: Rendu temporel direct, naturel dans un registre soutenu mais accessible.
- source_word: עֲוֺן קֵץ
  choice: châtiment final
  rationale: עָוֹן peut désigner la faute ou la peine qui en découle. Dans cet oracle de jugement, « châtiment final » donne un sens clair à la formule hébraïque très condensée, tandis que la note conserve l’ambiguïté réelle.
theological_decisions:
- issue: Valeur de עֲוֺן dans la formule de jugement
  choice: Compris dans le texte comme le châtiment consécutif à la faute
  alternative: Comprendre « la faute arrivée à son terme » ou, très littéralement, « la faute de la fin »
  rationale: Le contexte immédiat favorise la conséquence punitive, mais le champ sémantique de עָוֹן permet aussi de viser la faute ou la culpabilité elle-même. La note maintient cette tension sans imposer une lecture doctrinale.
- issue: Sens de חָלָל dans l’adresse au prince
  choice: « transpercé », comme quelqu’un déjà voué à la mort par la sentence prophétique
  alternative: « profané » ou « frappé à mort »
  rationale: Le contexte d’exécution du jugement soutient le sens de « transpercé ». Cependant, le sens lié à la profanation est lexicalement possible et mérite d’être signalé.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La construction demeure une interpellation prophétique qui se poursuit dans le contexte; la virgule finale respecte ce caractère non achevé.
