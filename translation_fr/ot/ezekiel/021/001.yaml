  text: 'La parole de Yahweh me fut adressée en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans la formule prophétique ויהי דבר־יהוה אלי, « me fut adressée » rend naturellement en français la venue d’une communication divine, sans calquer lourdement l’hébreu.
- source_word: דְבַר
  choice: La parole
  rationale: דָּבָר désigne ici une communication divine prononcée. « La parole » conserve la formule prophétique traditionnelle et sa portée théologique, tout en restant naturel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération « Yahweh », afin de préserver le nom divin personnel présent dans le texte source plutôt que de lui substituer un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom indirect dans « me fut adressée » exprime fidèlement la direction vers le prophète indiquée par אֵלַי.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif לֵאמֹר introduit les paroles divines qui suivent. « En ces termes » remplit cette fonction de manière idiomatique et digne en français.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » maintient le nom propre dans la traduction au lieu de le remplacer par un titre.
translation_notes:
  register: Français international moderne, naturel et digne. La formule prophétique est rendue de façon idiomatique sans perdre les notions de parole divine, de destinataire prophétique et d’introduction au discours qui suit.
