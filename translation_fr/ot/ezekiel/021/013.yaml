  text: 'And the word of Yahweh came to me[a], saying:'
translation:
  language: fr
  text: 'La parole de Yahweh[a] me fut adressée :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hébreu YHWH, traditionnellement rendu « le SEIGNEUR » ; on trouve aussi la translittération « Yahvé ».
    reason: Signaler le tétragramme et les principales conventions françaises de traduction.
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans la formule prophétique וַיְהִי דְבַר־יְהוָה אֵלַי, cette tournure française idiomatique exprime naturellement que la parole divine parvient au prophète, sans reproduire littéralement « et il arriva ».
- source_word: דְבַר
  choice: La parole
  rationale: « Parole » conserve le terme récurrent de la révélation prophétique et reste plus proche de l’hébreu que « message ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, tandis que la note signale l’usage traditionnel français.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » rend naturellement la direction vers le prophète exprimée par אֵלַי.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Dans cette formule d’introduction, les deux-points annoncent directement les paroles qui suivent et rendent en français la fonction de לֵאמֹר sans l’expression lourde « en disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom propre divin. « Yahweh » le conserve, tandis qu’une note indique le rendu traditionnel afin de ne pas masquer la convention liturgique et éditoriale courante.
translation_notes:
  register: Français moderne, sobre et digne. La formule « me fut adressée » est courante dans le style prophétique français et évite le calque hébraïque. Le deux-points introduit la révélation qui suit.
