source:
  edition: WLC
  text: וְ/רָאוּ֙ כָּל בָּשָׂ֔ר כִּ֛י אֲנִ֥י יְהוָ֖ה בִּֽעַרְתִּ֑י/הָ לֹ֖א תִּכְבֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/004.yaml
  text: And all flesh will see that I[a], Yahweh, have kindled it; it will not be quenched.
translation:
  language: fr
  text: 'Et toute chair[a] verra que c’est moi, Yahweh, qui ai allumé ce feu : il ne s’éteindra pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tous les humains »; littéralement : « toute chair ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאוּ
  choice: Alors … verra
  rationale: Dans ce discours prophétique, la forme verbale décrit une conséquence future. « Verra » conserve le sens concret de ראה, tandis que « alors » exprime naturellement l’enchaînement avec le jugement annoncé.
- source_word: כָּל בָּשָׂר
  choice: toute chair
  rationale: Traduction formelle de l’expression hébraïque désignant collectivement les êtres humains. Elle préserve l’idiome prophétique et ses échos bibliques; une note donne l’équivalent courant.
- source_word: כִּי
  choice: que
  rationale: 'La conjonction introduit ici le contenu de ce que tous constateront : Yahweh lui-même a allumé le feu.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin יהוה, plutôt que substitution par un titre.
- source_word: בִּעַרְתִּיהָ
  choice: je l’ai allumé
  rationale: Le verbe בער exprime ici le fait de mettre le feu. Le suffixe féminin singulier renvoie au feu ou à la flamme du contexte immédiat; « l’ » conserve cette reprise sans explicitation excessive.
- source_word: לֹא תִּכְבֶּה
  choice: il ne s’éteindra pas
  rationale: Pour un feu, le verbe français « s’éteindre » rend naturellement l’intransitif hébreu et maintient l’idée que l’incendie continuera sans pouvoir être arrêté.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » conserve le nom propre sans le remplacer par un titre.
- issue: Identification de l’antécédent du suffixe féminin dans בִּעַרְתִּיהָ
  choice: Pronom « l’ », repris ensuite par « il » en référence au feu du contexte
  alternative: « je l’ai embrasée », avec référence possible à la forêt ou à la terre du Néguev
  rationale: Le suffixe hébreu est féminin, mais son antécédent précis dépend du contexte précédent. Le français exige un genre dans la reprise; la formulation retenue suit l’image immédiate du feu tout en évitant de nommer explicitement un antécédent incertain.
translation_notes:
  register: Français moderne, digne et accessible. La tournure emphatique « c’est moi, Yahweh, qui… » rend clairement l’insistance du pronom אָנִי. « Toute chair » conserve l’idiome biblique, éclairé par une note.
