  text: בֶּן אָדָ֕ם הִנָּבֵא֙ וְ/אָ֣מַרְתָּ֔ כֹּ֖ה אָמַ֣ר אֲדֹנָ֑/י אֱמֹ֕ר חֶ֥רֶב חֶ֛רֶב הוּחַ֖דָּה וְ/גַם מְרוּטָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/014.yaml
  text: 'Son of man[a], prophesy and say, ‘Thus says the Lord GOD: Say, “A sword, a sword, sharpened and also polished.”’'
translation:
  language: fr
  text: 'Fils d’homme, prophétise et dis : « Ainsi parle le Seigneur : Dis : “Une épée, une épée, elle a été aiguisée et même polie.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Reprend littéralement l’adresse prophétique caractéristique du livre d’Ézéchiel, dans une formulation consacrée et compréhensible en français.
- source_word: הִנָּבֵא
  choice: prophétise
  rationale: L’impératif du verbe נבא ordonne une proclamation prophétique; « prophétise » en conserve directement la force.
- source_word: וְאָמַרְתָּ
  choice: et dis
  rationale: Rend naturellement le commandement qui suit « prophétise », sans transformer la forme verbale en futur.
- source_word: כֹּה אָמַר אֲדֹנָי
  choice: Ainsi parle le Seigneur
  rationale: « Ainsi parle » est la formule française habituelle du messager prophétique. אֲדֹנָי est ici le titre divin « le Seigneur »; le texte hébreu fourni ne comporte pas le tétragramme.
- source_word: אֱמֹר
  choice: Dis
  rationale: Conserve le second impératif et la répétition du verbe אמר, qui introduit l’oracle cité.
- source_word: חֶרֶב חֶרֶב
  choice: Une épée, une épée !
  rationale: Maintient la répétition emphatique de l’hébreu; l’article indéfini donne une tournure française naturelle.
- source_word: הוּחַדָּה
  choice: Elle a été aiguisée
  rationale: La forme passive de חדד indique que l’épée a été rendue tranchante. Le pronom explicite permet une phrase française fluide.
- source_word: וְגַם
  choice: et aussi
  rationale: Préserve la valeur additive et insistante de l’expression hébraïque.
- source_word: מְרוּטָה
  choice: polie
  rationale: Le terme décrit une lame rendue lisse et brillante. « Polie » est précis et courant; « fourbie » demeure une possibilité plus traditionnelle.
theological_decisions:
- issue: Rendu du titre divin אֲדֹנָי
  choice: le Seigneur
  alternative: le Seigneur DIEU
  rationale: Le texte hébreu fourni porte אֲדֹנָי seul. Traduire « le Seigneur » respecte donc directement la forme source sans introduire le tétragramme ni un second titre absent.
- issue: Portée menaçante de l’image de l’épée
  choice: Conserver l’énoncé imagé sans expliciter sa destination
  alternative: Ajouter qu’elle est préparée pour le massacre
  rationale: Le verset affirme seulement que l’épée a été aiguisée et polie. Son usage meurtrier ressort du contexte, mais ne doit pas être ajouté au corps du texte.
translation_notes:
  register: Français moderne, solennel et accessible. La répétition emphatique de « une épée » et l’enchâssement des paroles rapportées sont conservés; la ponctuation clarifie les différents niveaux de citation.
