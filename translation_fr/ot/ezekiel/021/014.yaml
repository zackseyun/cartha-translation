    rationale: La ponctuation « Une épée, une épée ! Elle a été... » introduit une rupture expressive non imposée par le texte. De plus, « et aussi polie » est moins idiomatique que « et même polie » dans une coordination descriptive.
  revised_text: 'Fils d’homme, prophétise et dis : « Ainsi parle le Seigneur : Dis : “Une épée, une épée, elle a été aiguisée et même polie.” »'
