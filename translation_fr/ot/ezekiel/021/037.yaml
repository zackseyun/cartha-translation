  - severity: high
    issue: La note a ne fournit pas l'alternative qu'elle annonce.
    rationale: Elle introduit « Ou » mais cite « ton sang restera au milieu du pays », qui est le texte principal, et ne donne pas l'alternative « ta culpabilité de sang »/« ton sang versé ». Elle doit être reformulée afin que son ancrage et sa fonction lexicale soient cohérents.
