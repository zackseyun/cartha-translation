  text: לָ/אֵ֤שׁ תִּֽהְיֶה֙ לְ/אָכְלָ֔ה דָּמֵ֥/ךְ יִהְיֶ֖ה בְּ/ת֣וֹךְ הָ/אָ֑רֶץ לֹ֣א תִזָּכֵ֔רִי כִּ֛י אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/037.yaml
  text: You will be fuel for the fire; your blood will be in the midst of the land. You will not be remembered[a], for I, Yahweh, have spoken.
translation:
  language: fr
  text: Tu seras livrée au feu pour être consumée ; ton sang sera au milieu du pays. On ne se souviendra plus de toi[a], car moi, Yahvé, j’ai parlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, pour « ton sang » : « ta culpabilité de sang ». L’hébreu dit littéralement « ton sang » ; dans ce contexte, l’expression peut évoquer le sang versé ou la culpabilité qui en résulte.'
    reason: La note conserve le sens littéral dans le texte tout en signalant, sans l'imposer, la portée possible de l'expression hébraïque dans ce contexte de jugement.
lexical_decisions:
- source_word: לָאֵשׁ תִּהְיֶה לְאָכְלָה
  choice: Tu seras livrée au feu pour être consumée
  rationale: La construction exprime la destination et la destruction par le feu. Cette formulation française est naturelle, garde l’image du texte et respecte le féminin singulier de l’entité interpellée.
- source_word: דָּמֵךְ
  choice: ton sang
  rationale: Le sens premier est « ton sang ». Le contexte peut suggérer le sang versé ou la culpabilité liée au sang, mais le texte principal conserve volontairement l’image hébraïque.
- source_word: בְּתוֹךְ הָאָרֶץ
  choice: au milieu du pays
  rationale: Cette traduction conserve la valeur spatiale marquée de בְּתוֹךְ et le caractère public du jugement.
- source_word: לֹא תִזָּכֵרִי
  choice: On ne se souviendra plus de toi
  rationale: Le niphal de זכר indique ici que la destinataire ne sera plus gardée en mémoire. La tournure impersonnelle est idiomatique en français moderne.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, qui préserve le nom propre plutôt que de le remplacer par un titre.
- source_word: דִּבַּרְתִּי
  choice: j’ai parlé
  rationale: Le parfait, dans cette formule prophétique, exprime la solennité et le caractère définitif de la déclaration.
theological_decisions:
- issue: Sens de דָּמֵךְ dans le contexte du jugement
  choice: ton sang
  alternative: ta culpabilité pour le sang versé
  rationale: Le texte hébreu dit littéralement « ton sang ». Expliciter la culpabilité dans le corps du verset résoudrait une ambiguïté réelle ; cette possibilité est donc signalée en note.
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte emploie le nom divin. La transcription « Yahvé », usuelle en français, le distingue d’un simple titre.
translation_notes:
  register: Français international moderne, digne et direct. Le féminin singulier est conservé puisque la destinataire est personnifiée au féminin. « Yahvé » suit l’usage français établi pour la transcription du tétragramme.
