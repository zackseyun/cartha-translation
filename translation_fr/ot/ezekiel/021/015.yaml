source:
  edition: WLC
  text: לְמַ֨עַן טְבֹ֤חַ טֶ֨בַח֙ הוּחַ֔דָּה לְמַעַן הֱיֵה לָ֥/הּ בָּ֖רָק מֹרָ֑טָּה א֣וֹ נָשִׂ֔ישׂ שֵׁ֥בֶט בְּנִ֖/י מֹאֶ֥סֶת כָּל עֵֽץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/015.yaml
  text: So that it may slaughter a slaughter[a], it is sharpened; so that it may have a flash, it is polished[b]. Or shall we rejoice? The scepter of my son despises every tree.
translation:
  language: fr
  text: Afin de faire un massacre, elle a été aiguisée ; afin d’étinceler, elle a été polie[b]. Ou bien, allons-nous nous réjouir ? Le sceptre de mon fils méprise tout arbre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La dernière proposition est difficile en hébreu. « Mon fils » suit le texte massorétique ; certains comprennent l’expression plus largement comme une désignation de Juda ou de mon peuple. « Tout arbre » peut aussi signifier tout objet de bois, notamment un bâton ou une arme.
    reason: alternative_reading
  - marker: b
    text: Ou « afin qu’elle ait un éclair » ou « afin qu’elle étincelle » ; l’expression hébraïque est elliptique et décrit l’éclat de l’épée après son polissage.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: afin que
  rationale: Conserve la valeur de but ou de résultat dans les deux propositions, dans un français naturel et soutenu.
- source_word: טְבֹחַ טֶבַח
  choice: faire un grand carnage
  rationale: Rend l’intensification produite par l’infinitif et son complément de même racine sans imposer au français la tournure peu naturelle « égorger un égorgement ».
- source_word: הוּחַדָּה
  choice: elle a été aiguisée
  rationale: Le féminin renvoie à l’épée du contexte ; le passif accompli correspond à la forme hébraïque.
- source_word: הֱיֵה לָהּ בָּרָק
  choice: elle lance des éclairs
  rationale: Rend l’expression elliptique par l’image visible de l’épée polie qui étincelle, sans transformer explicitement l’éclair en comparaison.
- source_word: מֹרָטָה
  choice: elle a été polie
  rationale: Désigne le polissage de la lame qui la fait briller ; « polie » est clair en français moderne.
- source_word: אוֹ נָשִׂישׂ
  choice: Ou bien, allons-nous nous réjouir ?
  rationale: Préserve le brusque tournant rhétorique et la valeur interrogative de la première personne du pluriel.
- source_word: שֵׁבֶט
  choice: sceptre
  rationale: Conserve ici la possible connotation royale et l’idée d’autorité, sans réduire le terme à un simple bâton.
- source_word: בְּנִי
  choice: mon fils
  rationale: Suit le texte massorétique malgré la difficulté de la proposition, plutôt que de choisir silencieusement une interprétation.
- source_word: מֹאֶסֶת
  choice: méprise
  rationale: Exprime le rejet teinté de dédain porté par le participe hébreu.
- source_word: כָּל עֵץ
  choice: tout arbre
  rationale: Préserve l’image concrète et l’ambiguïté de l’hébreu, qui peut aussi évoquer le bois, un bâton ou une arme de bois.
theological_decisions:
- issue: Sens de la proposition finale, notoirement difficile
  choice: Le sceptre de mon fils méprise tout arbre.
  alternative: Comprendre « mon fils » comme une désignation de Juda ou du peuple de Dieu, et « tout arbre » comme tout bâton, sceptre ou arme de bois.
  rationale: La syntaxe et le sens exacts sont incertains. Une traduction proche du texte massorétique préserve cette tension sans faire d’une conjecture interprétative le texte principal.
translation_notes:
  register: Français international moderne, digne et intelligible. Le parallélisme poétique est conservé, tandis que le cognat hébreu de la première proposition est rendu idiomatiquement par « faire un grand carnage ». La proposition finale demeure volontairement proche et difficile, avec les principales possibilités signalées en note.
