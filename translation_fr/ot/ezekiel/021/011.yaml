source:
  edition: WLC
  text: וְ/אַתָּ֥ה בֶן אָדָ֖ם הֵֽאָנַ֑ח בְּ/שִׁבְר֤וֹן מָתְנַ֨יִם֙ וּ/בִ/מְרִיר֔וּת תֵּֽאָנַ֖ח לְ/עֵינֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/011.yaml
  text: And you[a], son of man, groan with breaking loins, and in bitterness you shall groan before their eyes.
translation:
  language: fr
  text: Et toi, fils d’homme, gémis, les reins brisés[a] ; avec amertume, tu gémiras sous leurs yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans le brisement des reins ». Cette image hébraïque exprime une souffrance physique intense.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: Formule d’adresse récurrente dans Ézéchiel. Cette traduction conserve l’image et la cohérence interne du livre sans lui attribuer ici une valeur de titre messianique.
- source_word: הֵאָנַח
  choice: gémis
  rationale: Le verbe אנח exprime une plainte audible et douloureuse. « Gémis » rend mieux son intensité physique que « soupire ».
- source_word: בְּשִׁבְרוֹן מָתְנַיִם
  choice: les reins brisés
  rationale: שִׁבְרוֹן évoque la brisure ou l’écrasement, et מָתְנַיִם les reins, la taille ou les hanches. « Les reins brisés » garde l’image corporelle saisissante tout en restant idiomatique en français.
- source_word: וּבִמְרִירוּת
  choice: avec amertume
  rationale: Le nom מְרִירוּת désigne l’amertume. La formulation conserve le nom abstrait sans le réduire à une émotion particulière telle que le chagrin.
- source_word: תֵּאָנַח
  choice: tu gémiras
  rationale: Le futur français maintient la distinction avec l’impératif précédent tout en pouvant exprimer ici une instruction ferme.
- source_word: לְעֵינֵיהֶם
  choice: sous leurs yeux
  rationale: Expression française naturelle qui garde la référence explicite aux yeux et indique que le geste doit être accompli publiquement devant eux.
