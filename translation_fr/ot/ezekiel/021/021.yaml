source:
  edition: WLC
  text: הִתְאַחֲדִ֥י הֵימִ֖נִי הָשִׂ֣ימִי הַשְׂמִ֑ילִי אָ֖נָה פָּנַ֥יִ/ךְ מֻעָדֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/021.yaml
  text: Gather yourself[a]; go to the right; set yourself to the left[c][b], wherever your face is appointed.
translation:
  language: fr
  text: Rassemble-toi[a] ! Va à droite ! Place-toi à gauche, où que ton visage soit dirigé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Unis tes forces » ou « Concentre-toi ». Le verbe hébreu est rare et réfléchi ; dans ce contexte guerrier, il semble exprimer un rassemblement ou une concentration avant de frapper.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « où que ton visage soit dirigé ». Le « visage » peut ici désigner la direction vers laquelle on fait face. On peut aussi comprendre : « où que ton visage soit fixé » ou « assigné ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הִתְאַחֲדִי
  choice: Rassemble-toi
  rationale: Impératif féminin singulier d’une forme rare et réfléchie. Dans ce contexte martial, le verbe évoque le fait de se concentrer ou de réunir ses forces avant de frapper; « Rassemble-toi » conserve la valeur réfléchie sans préciser excessivement l’image.
- source_word: הֵימִנִי
  choice: Va à droite
  rationale: Impératif directionnel formé sur le terme désignant la droite. Cette formulation française naturelle garde la brièveté du commandement.
- source_word: הָשִׂימִי הַשְׂמִילִי
  choice: Place-toi à gauche
  rationale: La combinaison de l’impératif de שׂים avec la forme directionnelle liée à la gauche signifie littéralement se placer ou se diriger à gauche. « Place-toi » maintient le parallélisme avec le premier impératif réfléchi.
- source_word: אָנָה
  choice: partout où
  rationale: Adverbe interrogatif ou indéfini de direction. Ici, il introduit le lieu ou la direction vers lesquels le visage est orienté.
- source_word: פָּנַיִךְ
  choice: ton visage
  rationale: Le nom signifie littéralement « visage » avec un suffixe féminin singulier. Dans ce langage directionnel, il peut désigner la direction vers laquelle on fait face; l’image hébraïque est conservée dans le texte.
- source_word: מֻעָדוֹת
  choice: est dirigé
  rationale: Forme passive plurielle accordée avec le nom hébreu « visage », morphologiquement pluriel. Elle exprime l’idée d’être fixé, assigné ou orienté vers une cible. « Est dirigé » est naturel en français tout en préservant le passif et sans identifier celui qui détermine la direction.
theological_decisions:
- issue: Destinataire personnifié et image guerrière
  choice: Conserver les impératifs adressés à un destinataire féminin singulier sans ajouter « épée » dans le verset.
  alternative: Ajouter explicitement « Ô épée » ou comprendre les ordres comme adressés à une armée.
  rationale: Les impératifs hébreux sont au féminin singulier et le contexte immédiat personnifie l’épée, mais le mot « épée » n’apparaît pas dans ce verset. Ne pas l’ajouter préserve la formulation abrupte et laisse le contexte identifier le destinataire.
- issue: Sens passif de מֻעָדוֹת
  choice: « est dirigé »
  alternative: « est assigné », « est fixé » ou « est destiné »
  rationale: Le passif peut suggérer une orientation imposée, une désignation ou une destination, sans préciser l’agent. « Dirigé » convient à l’image du visage et évite d’expliciter une détermination divine ou fatale que le verset ne nomme pas.
translation_notes:
  register: Français international moderne, digne et direct. Les impératifs courts reproduisent le rythme martial. Le tutoiement s’impose puisque l’hébreu s’adresse à un destinataire féminin singulier personnifié. La ponctuation rend la succession énergique des ordres sans ajouter le mot « épée », absent du verset.
