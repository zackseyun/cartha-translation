base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/031.yaml
  text: 'Thus says the Lord GOD: Remove the turban[a], and take off the crown. This will not remain the same: exalt the lowly[b], and humble the exalted.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh : « Enlève le turban et ôte la couronne.[a] Cela ne sera plus comme avant.[b] Élève ce qui est bas, et abaisse ce qui est élevé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « turban » peut désigner une coiffure sacerdotale, tandis que la « couronne » symbolise l’autorité royale. Le verset annonce le retrait d’insignes établis, sans préciser davantage ici leur rapport.
    reason: cultural_note
  - marker: b
    text: 'L’hébreu est très concis : littéralement, « ceci, non ceci ». On peut aussi comprendre : « Cela ne sera plus » ou « Ce ne sera pas ainsi ». La formule annonce le renversement de l’ordre présent.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Ainsi parle le Seigneur Yahweh
  rationale: Formule prophétique rendue naturellement; le titre אֲדֹנָי est traduit par « le Seigneur » et le nom divin יהוה est transcrit « Yahweh », ce qui préserve les deux éléments.
- source_word: הָסִיר הַמִּצְנֶפֶת
  choice: Enlève le turban
  rationale: L’impératif hiphil exprime le retrait; מִצְנֶפֶת désigne une coiffure enroulée, souvent sacerdotale. « Turban » est précis et courant.
- source_word: וְהָרִים הָעֲטָרָה
  choice: et ôte la couronne
  rationale: רום signifie littéralement « élever », mais, avec une couronne dans ce contexte de destitution, il signifie la soulever pour la retirer. « Ôte » restitue clairement cet emploi idiomatique.
- source_word: זֹאת לֹא זֹאת
  choice: Rien ne restera comme avant
  rationale: La formule hébraïque est très elliptique, littéralement proche de « ceci, non ceci ». La traduction exprime le bouleversement de l’ordre présent sans préciser indûment sa nature.
- source_word: הַשָּׁפָלָה הַגְבֵּהַ
  choice: Élève ce qui est abaissé
  rationale: La formulation conserve l’opposition spatiale et sociale entre ce qui est bas et ce qui est élevé, ainsi que la force factitive de l’impératif.
- source_word: וְהַגָּבֹהַ הַשְׁפִּיל
  choice: et abaisse ce qui est élevé
  rationale: Le parallélisme antithétique de l’hébreu est reproduit directement, sans transformer nécessairement l’abaissement en qualité morale d’humilité.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU / le Souverain Seigneur
  rationale: La transcription « Yahweh » distingue le nom propre divin du titre אֲדֹנָי et évite de confondre les deux termes.
- issue: Interprétation de זֹאת לֹא זֹאת
  choice: Rien ne restera comme avant
  alternative: Cela ne sera plus / Ce ne sera pas ainsi
  rationale: L’hébreu est volontairement bref et ambigu. Le texte principal communique la rupture radicale, tandis que la note conserve les principales possibilités de lecture.
- issue: Portée des symboles de tête
  choice: turban et couronne
  alternative: tiare et diadème
  rationale: Le texte associe des insignes pouvant évoquer les autorités sacerdotale et royale, mais la traduction ne tranche pas explicitement l’identité de leurs porteurs.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le parallélisme final est conservé sous une forme concrète (« élevé/abaissé »), et l’ellipse centrale est rendue lisible tout en étant explicitée en note.
