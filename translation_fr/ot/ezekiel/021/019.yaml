base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/019.yaml
  text: And you[a], son of man, prophesy and strike palm to palm, and let the sword be doubled a third time—the sword of the slain. It is the sword of the great slain one[c][b], the one that presses in on them.
translation:
  language: fr
  text: Et toi, fils d’homme, prophétise et frappe une paume contre l’autre[a]. Que l’épée soit redoublée, une troisième fois[b] — l’épée des victimes. C’est l’épée de la grande victime, celle qui pénètre parmi eux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « frappe paume contre paume » ; il s’agit d’un geste prophétique. On peut aussi traduire : « frappe dans tes mains » ou « applaudis ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Que l’épée soit redoublée, triplée » ou « trois fois ». L’hébreu associe l’idée de redoublement à une expression pouvant indiquer une troisième occurrence ou une intensification triple.'
    reason: textual_ambiguity
  - marker: c
    text: 'Ou : « celle qui pénètre en eux », « qui fait irruption contre eux » ou « qui les encercle ». Le participe hébreu peut évoquer l’entrée ou la pénétration ; son sens précis dans cette construction est discuté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: Formule d’adresse caractéristique d’Ézéchiel, conservée sous sa forme française traditionnelle et transparente.
- source_word: הִנָּבֵא
  choice: prophétise
  rationale: L’impératif niphal de נבא constitue ici l’ordre prophétique habituel, sans complément exprimé.
- source_word: וְהַךְ כַּף אֶל כָּף
  choice: frappe une paume contre l’autre
  rationale: Rend concrètement le geste prophétique décrit par l’hébreu, tout en restant naturel en français.
- source_word: וְתִכָּפֵל חֶרֶב שְׁלִישִׁתָה
  choice: Que l’épée frappe une deuxième, puis une troisième fois
  rationale: 'La tournure hébraïque est difficile : le verbe évoque le redoublement et שְׁלִישִׁתָה un troisième coup ou une multiplication par trois. Cette formulation restitue clairement la répétition sans éliminer l’autre lecture, signalée en note.'
- source_word: חֶרֶב חֲלָלִים
  choice: l’épée des victimes
  rationale: Le pluriel חֲלָלִים désigne ceux qui sont tombés sous les coups. « Victimes » convient mieux au contexte anticipatif que « morts », qui pourrait suggérer que l’épée leur appartient.
- source_word: חֶרֶב חָלָל הַגָּדוֹל
  choice: l’épée de la grande victime
  rationale: Conserve le singulier concret חָלָל et l’ambiguïté concernant l’identité ou le statut de cette importante victime.
- source_word: הַחֹדֶרֶת לָהֶם
  choice: celle qui les assaille de toutes parts
  rationale: Le participe peut évoquer l’entrée, la pénétration ou l’encerclement hostile. Le contexte et l’emploi avec ל permettent une attaque qui se resserre sur eux, sans imposer une image exclusivement physique de pénétration.
theological_decisions:
- issue: Identité de חָלָל הַגָּדוֹל
  choice: la grande victime
  alternative: le grand tué / le grand massacre
  rationale: Le texte ne précise pas l’identité de cette figure et ne justifie pas une identification théologique. Le singulier personnel est conservé sans ajout interprétatif.
translation_notes:
  register: Français moderne, digne et accessible. Le rythme impérieux de l’oracle est maintenu. Les répétitions autour de l’épée et des victimes sont conservées, tandis que les principales ambiguïtés lexicales sont exposées en notes plutôt que résolues silencieusement.
