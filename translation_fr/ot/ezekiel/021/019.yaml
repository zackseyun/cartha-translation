review_pass:
  verdict: revise
  source_fidelity: La proposition « Que l’épée frappe une deuxième, puis une troisième fois » transforme le passif/jussif תִכָּפֵל (« être redoublée ») en un verbe actif (« frapper ») et introduit explicitement un deuxième coup qui n’est pas formulé ainsi dans l’hébreu. La formulation doit conserver l’image d’une épée redoublée et la valeur difficile de « pour la troisième fois / trois fois ». « Celle qui les assaille de toutes parts » privilégie indûment l’interprétation d’encerclement ; le participe de חדר doit rester plus ouvert.
  naturalness: Le français est globalement moderne et lisible. « Que l’épée soit redoublée, une troisième fois » est à la fois plus proche du texte et plus naturel que l’explicitation par des coups successifs. « Qui pénètre parmi eux » maintient une image intelligible sans imposer « de toutes parts ».
  terminology: « Fils d’homme », « prophétise » et le geste « frappe une paume contre l’autre » conviennent. « Victimes » est acceptable pour חללים dans ce contexte ; « la grande victime » conserve le singulier concret et l’adjectif sans identifier la personne. Les notes doivent présenter les options sans faire de l’encerclement le sens retenu.
  issues:
  - severity: medium
    issue: Le redoublement de l’épée est rendu comme deux actions explicites de frapper.
    rationale: 'וְתִכָּפֵל est un passif à valeur injonctive : il porte sur l’épée qui est redoublée, non sur une épée qui « frappe une deuxième fois ». שְׁלִישִׁתָה demeure syntaxiquement et sémantiquement disputé ; une note doit préserver cette incertitude.'
  - severity: medium
    issue: « Assaille de toutes parts » impose la lecture d’encerclement.
    rationale: הַחֹדֶרֶת לָהֶם peut évoquer la pénétration, l’irruption ou, selon l’analyse, l’encerclement. Le texte principal ne devrait pas sélectionner « de toutes parts ».
