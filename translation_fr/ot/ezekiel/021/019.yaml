revisions:
- from: Et toi, fils d’homme, prophétise et frappe une paume contre l’autre[a]. Que l’épée frappe une deuxième, puis une troisième fois[b] — l’épée des victimes. C’est l’épée de la grande victime, celle qui les assaille de toutes parts[c].
  to: Et toi, fils d’homme, prophétise et frappe une paume contre l’autre[a]. Que l’épée soit redoublée, une troisième fois[b] — l’épée des victimes. C’est l’épée de la grande victime, celle qui pénètre parmi eux[c].
  rationale: La révision rétablit la voix passive et l’image du redoublement de l’épée, sans convertir la phrase en une succession de deuxième et troisième coups. Elle remplace également une paraphrase spatiale trop déterminée par une expression française qui garde l’idée centrale d’irruption/pénétration, tandis que la note conserve les lectures concurrentes.
