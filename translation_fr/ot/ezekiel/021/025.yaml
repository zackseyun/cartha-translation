revisions:
- from: Tu traceras une route pour que l’épée vienne jusqu’à Rabba, la capitale des Ammonites[a], et jusqu’en Juda, à Jérusalem fortifiée[b].
  to: Tu traceras une route pour que l’épée vienne vers Rabba des Ammonites[a] et vers Juda, à Jérusalem, la ville fortifiée[b].
  rationale: La révision retire l’explication « capitale » du texte pour la laisser dans la note, remplace « jusqu’à/jusqu’en » par « vers » afin de conserver la direction sans rigidifier la syntaxe, et reformule le second membre pour éviter de présenter Juda comme géographiquement contenu dans Jérusalem. La note maintient explicitement l’alternative « contre » et ses ancres demeurent valides.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:59:39Z'
review_pass:
  verdict: revise
  source_fidelity: Le projet rend correctement l’ordre de tracer une voie et l’image de l’épée qui avance vers deux cibles. Toutefois, « jusqu’en Juda, à Jérusalem fortifiée » relie maladroitement Juda à Jérusalem, comme si Juda se trouvait dans la ville. L’hébreu associe Juda à Jérusalem, qualifiée de fortifiée, dans une formule compacte; il convient de préserver ce lien sans cette implication géographique inexacte. « Vers » maintient en outre la valeur directionnelle sans exclure la nuance hostile.
  naturalness: « Tu traceras une route » est naturel et approprié. La reformulation « vers Juda, à Jérusalem, la ville fortifiée » est plus lisible en français moderne que « en Juda, à Jérusalem fortifiée », tout en gardant la densité de la désignation hébraïque.
  terminology: « Rabba des Ammonites » rend fidèlement רַבַּת בְּנֵי עַמּוֹן sans intégrer dans le texte une information explicative qui relève de la note. « L’épée » et « la ville fortifiée » conviennent au registre prophétique. La note alternative doit conserver les mêmes référents et ne pas remplacer « Rabba des Ammonites » par la formulation moins précise « Rabba, chez les Ammonites ».
  issues:
  - severity: medium
    issue: Relation syntaxique ambiguë et potentiellement inexacte entre Juda et Jérusalem
    rationale: « Jusqu’en Juda, à Jérusalem fortifiée » donne facilement à entendre que Jérusalem est simplement un lieu situé dans Juda. La formule hébraïque vise Juda à Jérusalem et qualifie Jérusalem de fortifiée; une ponctuation appositionnelle rend mieux cette relation sans la surinterpréter.
  - severity: low
    issue: Information culturelle intégrée au texte
    rationale: « La capitale des Ammonites » est une explication exacte, mais elle n’est pas exprimée par le texte hébreu et figure déjà en note. « Rabba des Ammonites » est plus fidèle au niveau du corps du verset.
  - severity: low
    issue: Formulation de la note alternative
    rationale: « Rabba, chez les Ammonites » ne correspond pas aussi directement à « Rabba des Ammonites » et affaiblit le parallélisme avec le texte.
  revised_text: Tu traceras une route pour que l’épée vienne vers Rabba des Ammonites[a] et vers Juda, à Jérusalem, la ville fortifiée[b].
  revised_footnotes:
  - marker: a
    text: Rabba était la principale ville des Ammonites.
