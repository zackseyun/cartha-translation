    reason: alternative_reading
  revision_rationale: La révision retire l’explication « capitale » du texte pour la laisser dans la note, remplace « jusqu’à/jusqu’en » par « vers » afin de conserver la direction sans rigidifier la syntaxe, et reformule le second membre pour éviter de présenter Juda comme géographiquement contenu dans Jérusalem. La note maintient explicitement l’alternative « contre » et ses ancres demeurent valides.
