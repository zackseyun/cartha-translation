source:
  edition: WLC
  text: דֶּ֣רֶךְ תָּשִׂ֔ים לָ/ב֣וֹא חֶ֔רֶב אֵ֖ת רַבַּ֣ת בְּנֵֽי עַמּ֑וֹן וְ/אֶת יְהוּדָ֥ה בִ/ירוּשָׁלִַ֖ם בְּצוּרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/025.yaml
  text: You shall set a road for the sword to come to Rabbah of the Ammonites[b][a], and to Judah in fortified Jerusalem.
translation:
  language: fr
  text: Tu traceras une route pour que l’épée vienne vers Rabba des Ammonites[a] et vers Juda, à Jérusalem, la ville fortifiée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rabba était la principale ville des Ammonites.
    reason: cultural_note
  - marker: b
    text: 'On pourrait aussi traduire : « contre Rabba des Ammonites et contre Juda, à Jérusalem, la ville fortifiée ». La construction hébraïque peut présenter ces lieux soit comme les destinations de l’épée, soit comme les cibles de son avancée hostile.'
    reason: alternative_reading
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: une route
  rationale: Le nom désigne un chemin ou un itinéraire. « Route » convient naturellement à l’image militaire d’une voie tracée pour l’avancée d’une armée.
- source_word: תָּשִׂים
  choice: tu traceras
  rationale: Le verbe שׂים signifie littéralement « mettre, placer ». Dans le contexte du geste prophétique consistant à établir un itinéraire, « tracer » exprime clairement l’action demandée tout en conservant la force directive du futur français.
- source_word: לָבוֹא
  choice: pour que … vienne
  rationale: 'L’infinitif de בוא indique ici le but ou le résultat : la route est tracée afin que l’épée puisse venir.'
- source_word: חֶרֶב
  choice: l’épée
  rationale: L’épée personnifie l’instrument de l’invasion et du jugement annoncé. L’article défini rend naturellement cette image prophétique en français.
- source_word: אֵת רַבַּת בְּנֵי עַמּוֹן
  choice: jusqu’à Rabba, la capitale des Ammonites
  rationale: Rabba est le nom de la principale ville ammonite. « Ammonites » rend idiomatiquement בְּנֵי עַמּוֹן, littéralement « fils d’Ammon ». La précision « capitale » est informative et signalée par une note.
- source_word: וְאֶת יְהוּדָה
  choice: et jusqu’en Juda
  rationale: Le syntagme est traité parallèlement à Rabba comme une seconde destination ou cible de l’épée. « Jusqu’en » convient au nom de territoire.
- source_word: בִירוּשָׁלַם
  choice: à Jérusalem
  rationale: La préposition ב marque ici la localisation de Juda dans la ville visée; « à Jérusalem » est la tournure française naturelle.
- source_word: בְּצוּרָה
  choice: fortifiée
  rationale: L’adjectif qualifie Jérusalem comme une place protégée par des fortifications, sans qu’il soit nécessaire d’ajouter « ville » dans le corps du verset.
theological_decisions:
- issue: Valeur syntaxique des destinations introduites par אֵת après « pour que l’épée vienne »
  choice: Rabba et Juda/Jérusalem sont présentés parallèlement comme les destinations ou cibles de l’avancée de l’épée.
  alternative: 'Traduire explicitement dans un sens hostile : « contre Rabba… et contre Juda »; ou ne considérer que Rabba comme destination principale.'
  rationale: Le contexte montre deux voies possibles pour l’épée babylonienne. « Jusqu’à/jusqu’en » préserve l’image du déplacement, tandis que la note signale que le mouvement est hostile sans imposer une seule valeur française à la construction hébraïque.
translation_notes:
  register: Français international moderne, direct et digne. Le futur « tu traceras » garde la forme verbale hébraïque tout en ayant, dans ce contexte d’ordre prophétique, une valeur directive. La formulation conserve le parallélisme entre les deux cibles et explicite seulement en note la nuance hostile possible.
