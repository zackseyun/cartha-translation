source:
  edition: WLC
  text: כִּֽי עָמַ֨ד מֶלֶךְ בָּבֶ֜ל אֶל אֵ֣ם הַ/דֶּ֗רֶךְ בְּ/רֹ֛אשׁ שְׁנֵ֥י הַ/דְּרָכִ֖ים לִ/קְסָם קָ֑סֶם קִלְקַ֤ל בַּֽ/חִצִּים֙ שָׁאַ֣ל בַּ/תְּרָפִ֔ים רָאָ֖ה בַּ/כָּבֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/026.yaml
  text: 'For the king of Babylon stands at the mother of the road[a], at the head of the two roads, to practice divination: he shakes the arrows, he consults the teraphim[c][b], he examines the liver.'
translation:
  language: fr
  text: 'En effet, le roi de Babylone se tient à l’embranchement de la route[a], au départ des deux routes, pour pratiquer la divination : il secoue les flèches, consulte les téraphim[b] et examine le foie[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à la mère de la route » ; cette expression hébraïque désigne le point où la route se divise.'
    reason: lexical_alternative
  - marker: b
    text: Les téraphim sont des images cultuelles que l’on consultait notamment pour obtenir des présages.
    reason: cultural_note
  - marker: c
    text: Il s’agit d’une pratique divinatoire consistant à inspecter le foie d’un animal.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: En effet
  rationale: Introduit ici l’explication de la scène annoncée précédemment; « En effet » rend naturellement cette valeur explicative en français.
- source_word: עָמַד
  choice: s’est arrêté
  rationale: Le parfait qal situe le roi en position au carrefour. En français, « s’est arrêté » exprime naturellement son arrivée et sa station à cet endroit, sans imposer un présent visionnaire.
- source_word: אֵם הַדֶּרֶךְ
  choice: à la croisée des chemins
  rationale: Littéralement « à la mère de la route »; l’expression désigne le lieu d’où partent ou se séparent les routes. « À la croisée des chemins » transmet clairement l’image idiomatique.
- source_word: בְּרֹאשׁ שְׁנֵי הַדְּרָכִים
  choice: au point de départ des deux routes
  rationale: Rend le sens spatial de רֹאשׁ, « tête, commencement », tout en évitant en français l’expression peu naturelle « à la tête des deux routes ».
- source_word: לִקְסָם קָסֶם
  choice: pour pratiquer la divination
  rationale: L’infinitif accompagné du nom de même racine décrit explicitement l’action divinatoire; cette formulation est naturelle et précise.
- source_word: קִלְקַל בַּחִצִּים
  choice: il secoue les flèches
  rationale: Conserve le geste concret associé à la divination par les flèches, sans ajouter une procédure que le texte ne précise pas.
- source_word: שָׁאַל בַּתְּרָפִים
  choice: consulte les téraphim
  rationale: « Consulter » convient au contexte divinatoire. Le terme culturel « téraphim » est conservé afin de ne pas préciser abusivement leur nature.
- source_word: רָאָה בַּכָּבֵד
  choice: examine le foie
  rationale: Dans cette série de pratiques divinatoires, l’expression désigne l’inspection du foie; « examine » rend l’action plus justement qu’un simple « regarde ».
theological_decisions:
- issue: Rendu des pratiques païennes de divination
  choice: Nommer distinctement les flèches, les téraphim et l’examen du foie.
  alternative: Résumer toute la série par « il cherche des présages ».
  rationale: L’hébreu énumère trois procédés concrets. Les conserver respecte la portée prophétique et le cadre historique sans ajouter de jugement doctrinal absent de cette proposition.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve les trois gestes divinatoires concrets et explique en notes les réalités culturelles obscures. Le passé composé donne une narration naturelle, tandis que la série au présent rend les actes en cours de façon vive.
