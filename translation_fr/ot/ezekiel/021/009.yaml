  text: יַ֛עַן אֲשֶׁר הִכְרַ֥תִּי מִמֵּ֖/ךְ צַדִּ֣יק וְ/רָשָׁ֑ע לָ֠/כֵן תֵּצֵ֨א חַרְבִּ֧/י מִ/תַּעְרָ֛/הּ אֶל כָּל בָּשָׂ֖ר מִ/נֶּ֥גֶב צָפֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/009.yaml
  text: Because I will cut off from you both the righteous and the wicked[b][a], therefore my sword will go out from its sheath against all flesh from south to north.
translation:
  language: fr
  text: Parce que je retrancherai de toi le juste et le méchant[a], c’est pourquoi mon épée sortira de son fourreau contre toute chair[b], du sud au nord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’ai retranché ». En contexte prophétique, l’accompli hébreu peut désigner soit une action accomplie, soit une action future présentée comme certaine.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « toute chair », expression courante pour désigner l’ensemble des êtres humains mortels.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Parce que
  rationale: Cette locution introduit la cause du jugement annoncé. « Parce que » en restitue clairement la valeur causale dans un français moderne.
- source_word: הִכְרַתִּי
  choice: je retrancherai
  rationale: Le verbe כרת signifie couramment « retrancher ». Bien qu’il soit à l’accompli, le contexte prophétique permet de l’entendre comme une action future présentée comme certaine. « Retrancher » conserve l’image concrète et la tonalité judiciaire.
- source_word: מִמֵּךְ
  choice: de chez toi
  rationale: Le pronom féminin singulier renvoie à la destinataire personnifiée. « De chez toi » est naturel en français et exprime l’éloignement hors de son domaine sans ajouter explicitement l’idée de « sein » ou de « milieu ».
- source_word: צַדִּיק וְרָשָׁע
  choice: le juste comme le méchant
  rationale: La tournure française rend les deux catégories sans atténuer la portée indiscriminée du jugement.
- source_word: לָכֵן
  choice: donc
  rationale: « Donc » marque naturellement la conséquence qui découle de la proposition causale précédente.
- source_word: תֵּצֵא חַרְבִּי
  choice: mon épée sortira
  rationale: Cette formulation conserve l’image vive et personnifiée de l’hébreu plutôt que de la remplacer par le passif interprétatif « sera tirée ».
- source_word: מִתַּעְרָהּ
  choice: de son fourreau
  rationale: « Fourreau » est le terme français courant et précis pour l’étui d’une épée; le suffixe renvoie à l’épée.
- source_word: אֶל כָּל בָּשָׂר
  choice: contre toute chair
  rationale: La traduction littérale conserve l’expression hébraïque solennelle désignant l’ensemble des êtres humains mortels. « Contre » rend la visée hostile de l’épée.
- source_word: מִנֶּגֶב צָפוֹן
  choice: du sud au nord
  rationale: La formulation exprime clairement l’étendue géographique totale. Dans ce contexte, נגב fonctionne vraisemblablement comme indication directionnelle plutôt que comme nom propre de la région du Néguev.
theological_decisions:
- issue: Le jugement atteint « le juste comme le méchant »
  choice: Conserver l’affirmation selon laquelle l’épée atteint le juste comme le méchant.
  alternative: Limiter « juste » à une justice seulement apparente, ou préciser que le verset ne concerne que les conséquences temporelles du jugement.
  rationale: Le texte décrit un jugement historique qui balaie le pays sans distinguer ces deux catégories dans ses effets immédiats. La traduction doit préserver cette tension sans introduire une qualification théologique absente de l’hébreu.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe causale est conservée, ainsi que les images concrètes de l’épée qui sort de son fourreau et de « toute chair ». Les notes signalent les deux ambiguïtés lexicales significatives sans alourdir le corps du verset.
