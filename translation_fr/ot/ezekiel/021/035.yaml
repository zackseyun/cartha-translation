  text: הָשַׁ֖ב אֶל תַּעְרָ֑/הּ בִּ/מְק֧וֹם אֲשֶׁר נִבְרֵ֛את בְּ/אֶ֥רֶץ מְכֻרוֹתַ֖יִ/ךְ אֶשְׁפֹּ֥ט אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/035.yaml
  text: Return to your sheath[a]. In the place where you were created, in the land of your origins[b], I will judge you.
translation:
  language: fr
  text: Remets-la dans son fourreau[a] ! Là où tu as été créée, dans le pays de tes origines[b], je te jugerai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Fais-la retourner dans son fourreau ». L’hébreu emploie un impératif causatif : « remets-la / fais-la retourner dans son fourreau » ; le suffixe féminin de « son fourreau » renvoie à l’épée sous-entendue.'
    reason: lexical_alternative
  - marker: b
    text: Ou « dans le pays de ta naissance » ou « dans ton pays natal ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשַׁב
  choice: Retourne
  rationale: L’impératif de שוב commande un retour. Dans le contexte, il s’adresse directement à l’épée personnifiée.
- source_word: תַּעְרָהּ
  choice: dans ton fourreau
  rationale: תער désigne le fourreau d’une épée. Bien que l’hébreu dise littéralement « son fourreau », la deuxième personne préserve en français l’adresse directe à l’épée personnifiée.
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: Là où
  rationale: Cette formulation française naturelle rend avec concision la proposition locative « dans le lieu où ».
- source_word: נִבְרֵאת
  choice: tu as été créée
  rationale: Le nifal de ברא signifie normalement « être créé ». Le féminin convient à « épée » en français et conserve le caractère inhabituel de l’image.
- source_word: בְּאֶרֶץ מְכֻרוֹתַיִךְ
  choice: dans le pays de tes origines
  rationale: מְכֻרוֹת peut évoquer la naissance ou les origines. « Tes origines » est moderne, naturel et reste applicable à l’épée comme à l’entité qu’elle représente.
- source_word: אֶשְׁפֹּט אֹתָךְ
  choice: je te jugerai
  rationale: Cette traduction directe de שפט avec complément d’objet conserve la portée judiciaire sans l’expliciter davantage.
theological_decisions:
- issue: Référent féminin auquel le verset s’adresse
  choice: L’épée personnifiée est l’interlocutrice immédiate, tandis que le jugement atteint en définitive le peuple ou l’entité qu’elle représente.
  alternative: L’interlocuteur serait directement la nation ammonite ou son dirigeant.
  rationale: Le fourreau et la personnification de l’épée dans le contexte immédiat soutiennent cette lecture. La traduction maintient l’image prophétique et son ambiguïté référentielle au lieu de la résoudre.
translation_notes:
  register: Français international moderne, digne et accessible. L’accord féminin (« créée ») fait naturellement porter la personnification sur l’épée, nom féminin en français. Le futur « je te jugerai » conserve la sobriété et la force judiciaire de l’hébreu.
