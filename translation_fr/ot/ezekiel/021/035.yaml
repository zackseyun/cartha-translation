  source_fidelity: La première forme, הָשַׁב, est un impératif hifil masculin singulier (« fais revenir / remets »), et non un impératif féminin signifiant « retourne ». Le suffixe féminin de תַּעְרָהּ signifie « son fourreau » et renvoie à l’épée sous-entendue. Les formes féminines qui suivent (« tu as été créée », « tes origines », « je te jugerai ») doivent être conservées sans identifier de manière indue leur référent.
  naturalness: « Remets-la dans son fourreau ! » est naturel, concis et rend la valeur causative de l’impératif. « Là où tu as été créée » et « dans le pays de tes origines » sont idiomatiques dans un registre prophétique moderne et soutenu.
  terminology: « Fourreau » est le terme exact. « Créée », malgré son caractère inhabituel dans cette image, traduit sans l’affaiblir le nifal de ברא. « Jugerai » rend sobrement la portée judiciaire de שפט. La note ne doit pas transformer le suffixe possessif de troisième personne en « ton ».
  issues:
