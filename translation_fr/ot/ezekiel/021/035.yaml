    issue: « Retourne dans ton fourreau » inverse la syntaxe et les personnes de l’hébreu.
    rationale: Le texte hébreu porte un impératif hifil masculin singulier, suivi de « vers/dans son fourreau » (suffixe féminin de troisième personne), non une adresse féminine « retourne dans ton fourreau ». La révision rend l’objet féminin implicite, l’épée, par « la ».
  - severity: medium
    issue: La note a affirme à tort que l’hébreu dit littéralement « Retourne dans son fourreau » et propose « Remets-la dans son fourreau » comme simple variante.
    rationale: La lecture causative (« Remets-la » / « Fais-la retourner ») est celle que requiert la forme hifil. La note doit présenter correctement cette donnée grammaticale.
