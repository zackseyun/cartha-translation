base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/016.yaml
  text: It is given to be polished[a], to be grasped in the hand. It is sharpened—the sword—and it is polished[c][b], to put it into the hand of a slayer.
translation:
  language: fr
  text: Elle a été donnée à polir[a], pour qu’on la prenne en main[b]. Elle est aiguisée — l’épée —, et elle est polie, afin de la mettre dans la main d’un tueur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « à faire briller » : le verbe hébreu évoque le polissage qui rend la lame brillante.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans la paume ».
    reason: lexical_alternative
  - marker: c
    text: Ou « de celui qui tue ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֹתָהּ
  choice: On l’a donnée
  rationale: La forme verbale signifie littéralement « il l’a donnée », mais son sujet n’est pas exprimé. Le pronom féminin renvoie à l’épée. Le français impersonnel avec « on » conserve l’action sans identifier arbitrairement l’agent.
- source_word: לְמָרְטָה / מֹרָטָּה
  choice: à polir / elle est polie
  rationale: מרט décrit ici le polissage de la lame, qui la rend lisse et brillante. La répétition française reproduit l’insistance de l’hébreu.
- source_word: לִתְפֹּשׂ בַּכָּף
  choice: pour qu’on la saisisse dans la main
  rationale: תפש exprime l’action de saisir ou d’empoigner, tandis que כף désigne littéralement la paume et, par extension, la main. La tournure retenue est naturelle tout en gardant l’image concrète.
- source_word: הוּחַדָּה
  choice: elle est aiguisée
  rationale: Le hophal de חדד exprime le fait d’avoir été rendu tranchant. « Aiguisée » est le terme français courant pour une lame.
- source_word: חֶרֶב
  choice: l’épée
  rationale: Le nom placé en apposition identifie explicitement le référent du pronom féminin. L’article défini convient au contexte, où l’épée est déjà le sujet de l’oracle.
- source_word: לָתֵת אֹתָהּ בְּיַד
  choice: afin de la mettre dans la main
  rationale: נתן avec ביד décrit la remise d’un objet à quelqu’un. La formulation conserve l’image hébraïque de la main sans la réduire à la seule notion abstraite de pouvoir.
- source_word: הוֹרֵג
  choice: un tueur
  rationale: Le participe actif de הרג désigne celui qui tue. « Tueur » est direct, actuel et conserve la force menaçante du passage.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et solennel. La répétition de « polir / polie » et l’apposition « l’épée » préservent le rythme abrupt et insistant de l’oracle. Le recours à « on » évite d’ajouter un agent absent du texte explicite.
