  yaml_path: translation/ot/ezekiel/011/022.yaml
  text: Then the cherubim lifted up their wings[a], with the wheels beside them[b], and the glory of the God of Israel was above them.
translation:
  language: fr
  text: Alors les chérubins levèrent leurs ailes, avec les roues à côté d’eux, et la gloire du Dieu d’Israël était au-dessus d’eux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « au-dessus d’eux, d’en haut », expression spatiale insistante indiquant que la gloire les surplombait.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: déployèrent
  rationale: Avec « leurs ailes » comme complément, נשׂא décrit le geste de les lever. « Déployèrent » donne en français naturel l’image du mouvement préparant l’envol, sans suggérer qu’ils transportent leurs ailes.
- source_word: הַכְּרוּבִים
  choice: les chérubins
  rationale: Terme traditionnel et intelligible pour ces êtres célestes; le pluriel français courant convient au pluriel hébreu.
- source_word: כַּנְפֵיהֶם
  choice: leurs ailes
  rationale: Rendu direct du nom avec suffixe masculin pluriel.
- source_word: וְהָאוֹפַנִּים לְעֻמָּתָם
  choice: tandis que les roues se tenaient à côté d’eux
  rationale: La proposition nominale situe les roues par rapport aux chérubins. « À côté d’eux » convient au mouvement coordonné décrit dans la vision; « se tenaient » explicite sobrement la relation nominale sans confondre les roues avec l’objet du verbe précédent.
- source_word: וּכְבוֹד אֱלֹהֵי יִשְׂרָאֵל
  choice: et la gloire du Dieu d’Israël
  rationale: « Gloire » conserve le terme théologiquement chargé et l’imagerie propre à Ézéchiel sans l’élargir en paraphrase interprétative.
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: était au-dessus d’eux
  rationale: Cette formulation française naturelle exprime la position surplombante. L’expression hébraïque cumule deux indications de hauteur; une note signale cette emphase.
theological_decisions:
- issue: Sens de כבוד dans la vision du trône
  choice: la gloire du Dieu d’Israël
  alternative: la présence glorieuse du Dieu d’Israël
  rationale: Le rendu traditionnel « gloire » préserve la portée visuelle, théologique et intertextuelle du mot sans imposer l’interprétation explicative « présence ».
translation_notes:
  register: Français moderne, digne et accessible. « Tandis que » clarifie la syntaxe de la proposition nominale concernant les roues. L’emphase spatiale hébraïque, lourde si elle est reproduite mot à mot en français, est conservée dans la note.
