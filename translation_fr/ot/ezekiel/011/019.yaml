base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/019.yaml
  text: And I will give them one heart[a], and I will put a new spirit within them[b]. I will remove the heart of stone from their flesh and give them a heart of flesh.
translation:
  language: fr
  text: Je leur donnerai un seul cœur[a] et je mettrai en eux[b] un esprit nouveau. J’ôterai de leur chair le cœur de pierre et je leur donnerai un cœur de chair.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Un seul cœur » peut aussi se comprendre comme « un cœur sans partage », mettant l’accent sur une fidélité sans partage.
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu fourni porte littéralement « en vous » ; « en eux » correspond aux pronoms qui entourent l’expression et au parallèle d’Ézéchiel 36.26.
    reason: textual_variant
lexical_decisions:
- source_word: לֵב אֶחָד
  choice: un seul cœur
  rationale: Cette traduction directe conserve la métaphore hébraïque du cœur comme siège de la volonté, de la pensée et des dispositions. Elle peut évoquer un cœur unifié ou sans partage sans imposer cette interprétation dans le texte.
- source_word: רוּחַ חֲדָשָׁה
  choice: un esprit nouveau
  rationale: Dans ce contexte de renouvellement intérieur, « esprit » rend naturellement רוּחַ tout en préservant sa distinction avec le cœur.
- source_word: בְּקִרְבְּכֶם
  choice: en eux
  rationale: La forme consonantique fournie se lit littéralement « en vous », mais les pronoms de troisième personne qui entourent l’expression et le parallèle d’Ézéchiel 36.26 appuient ici « en eux ». La difficulté est signalée en note.
- source_word: וַהֲסִרֹתִי
  choice: j’ôterai
  rationale: Le verbe exprime l’action de faire disparaître ou d’enlever. « Ôter » est naturel et digne dans cette image concrète.
- source_word: לֵב הָאֶבֶן
  choice: le cœur de pierre
  rationale: La formulation littérale conserve l’image vive de l’hébreu.
- source_word: מִבְּשָׂרָם
  choice: de leur chair
  rationale: « Chair » maintient le terme concret et prépare le contraste explicite entre la pierre et la chair.
- source_word: לֵב בָּשָׂר
  choice: un cœur de chair
  rationale: La traduction littérale préserve le contraste métaphorique avec le cœur de pierre sans le réduire à une seule explication, telle que « cœur tendre » ou « réceptif ».
theological_decisions:
- issue: Métaphore anthropologique du renouvellement intérieur
  choice: Conserver « cœur » et « esprit » comme deux termes distincts mais liés.
  alternative: Les fondre dans une paraphrase psychologique telle que « pensée » et « disposition ».
  rationale: Le verset décrit l’action transformatrice de Dieu au moyen de catégories anthropologiques propres au texte. Leur maintien en préserve la richesse sans définir excessivement leur relation.
- issue: Sens de « un seul cœur »
  choice: Maintenir la formulation littérale dans le texte principal.
  alternative: Traduire « un cœur sans partage » ou « une même pensée ».
  rationale: « Un seul cœur » préserve à la fois la forme hébraïque et son ouverture sémantique; la fidélité unifiée est une interprétation probable, indiquée en note.
- issue: Métaphore du « cœur de chair »
  choice: Traduire littéralement « un cœur de chair ».
  alternative: Employer « un cœur tendre » ou « un cœur réceptif ».
  rationale: Le texte oppose lui-même la pierre à la chair. Conserver cette image respecte sa tension théologique et laisse ouvertes ses nuances de vitalité, de sensibilité et de réceptivité.
translation_notes:
  register: Français international moderne, naturel et digne. Les métaphores « cœur de pierre » et « cœur de chair » sont conservées, ainsi que la distinction entre le cœur et l’esprit. Les deux appels de note figurent dans le texte principal.
