revisions:
- from: 'C’est pourquoi, dis : « Voici ce que dit le Seigneur Yahweh : Même si je les ai éloignés parmi les nations et dispersés dans différents pays, je suis pourtant devenu pour eux un petit sanctuaire[a] dans les pays où ils étaient allés. »'
  to: 'C’est pourquoi, dis : « Voici ce que dit le Seigneur Yahweh : Même si je les ai éloignés parmi les nations et que je les ai dispersés dans les pays, je suis pourtant devenu pour eux un petit sanctuaire[a] dans les pays où ils étaient allés. »'
  rationale: 'Révision limitée à deux améliorations sûres : suppression de l’adjectif interprétatif « différents » et explicitation de la seconde proposition concessive. Le passé composé « je suis devenu » et le plus-que-parfait « ils étaient allés » préservent adéquatement la succession des actions dans le français courant. La note conserve l’ambiguïté reconnue de מְעַט.'
