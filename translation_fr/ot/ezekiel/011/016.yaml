source:
  edition: WLC
  text: לָ/כֵ֣ן אֱמֹ֗ר כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ כִּ֤י הִרְחַקְתִּי/ם֙ בַּ/גּוֹיִ֔ם וְ/כִ֥י הֲפִֽיצוֹתִ֖י/ם בָּ/אֲרָצ֑וֹת וָ/אֱהִ֤י לָ/הֶם֙ לְ/מִקְדָּ֣שׁ מְעַ֔ט בָּ/אֲרָצ֖וֹת אֲשֶׁר בָּ֥אוּ שָֽׁם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/016.yaml
  text: 'Therefore say[a], ‘Thus says the Lord GOD: Though I removed them far off among the nations, and though I scattered them among the lands, yet I became for them a little sanctuary in the lands where they had gone.’'
translation:
  language: fr
  text: 'C’est pourquoi, dis : « Voici ce que dit le Seigneur Yahweh : Même si je les ai éloignés parmi les nations et que je les ai dispersés dans les pays, je suis pourtant devenu pour eux un petit sanctuaire[a] dans les pays où ils étaient allés. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un sanctuaire pour quelque temps ». L’expression hébraïque peut désigner soit un sanctuaire petit ou limité, soit une présence-sanctuaire temporaire.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן אֱמֹר
  choice: C’est pourquoi, dis
  rationale: Rend naturellement la conclusion introduite par לָכֵן et conserve l’impératif direct adressé au prophète.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Formule prophétique idiomatique en français moderne, fidèle à la fonction de formule de messager.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Conserve à la fois le titre אֲדֹנָי et le nom divin יהוה sans produire l’expression redondante « le Seigneur, le SEIGNEUR ».
- source_word: כִּי ... וְכִי
  choice: Même si ... et
  rationale: Les deux propositions ont ici une valeur concessive par rapport à l’affirmation qui suit; la coordination française évite de répéter lourdement « même si » tout en maintenant leur unité.
- source_word: הִרְחַקְתִּים
  choice: je les ai éloignés
  rationale: Exprime la valeur causative du hiphil et l’action divine qui a placé les exilés au loin.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: Désigne les peuples étrangers au milieu desquels les Israélites ont été exilés.
- source_word: הֲפִיצוֹתִים בָּאֲרָצוֹת
  choice: dispersés dans différents pays
  rationale: « Dispersés » rend le hiphil de פוץ; « différents pays » communique naturellement le pluriel אֲרָצוֹת et la multiplicité des territoires.
- source_word: וָאֱהִי לָהֶם
  choice: je suis pourtant devenu pour eux
  rationale: Le passé composé français rend l’événement passé du wayyiqtol, tandis que « pourtant » explicite le contraste contextuel avec l’éloignement et la dispersion.
- source_word: לְמִקְדָּשׁ מְעַט
  choice: un petit sanctuaire
  rationale: Retient le sens qualitatif ou quantitatif le plus direct de מְעַט, tout en signalant en note la lecture temporelle possible.
- source_word: בָּאֲרָצוֹת אֲשֶׁר בָּאוּ שָׁם
  choice: dans les pays où ils étaient allés
  rationale: Le plus-que-parfait marque naturellement que leur arrivée dans ces pays précède le fait que Dieu y devienne pour eux un sanctuaire.
theological_decisions:
- issue: Traduction du nom divin יהוה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: La formulation choisie distingue le titre אֲדֹנָי du nom personnel יהוה et préserve explicitement ce dernier.
- issue: Sens de מְעַט dans לְמִקְדָּשׁ מְעַט
  choice: 'sens qualitatif ou quantitatif : « un petit sanctuaire »'
  alternative: 'sens temporel : « un sanctuaire pour quelque temps »'
  rationale: La syntaxe permet de rattacher מְעַט à la nature ou à la portée du sanctuaire, mais une valeur temporelle demeure possible; la note conserve cette ambiguïté sans l’effacer.
- issue: Relation entre l’exil et la présence divine
  choice: concession explicite avec « même si » et « pourtant »
  alternative: 'causalité : « parce que… »'
  rationale: Dans le contexte, l’affirmation que Dieu devient un sanctuaire contraste avec l’éloignement et la dispersion qu’il a lui-même causés; une lecture concessive préserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique est idiomatique; le vocabulaire de l’exil et du sanctuaire reste concret. Le marqueur [a] est placé immédiatement après l’expression ambiguë qu’il explique.
