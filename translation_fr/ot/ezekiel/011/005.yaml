source:
  edition: WLC
  text: וַ/תִּפֹּ֣ל עָלַ/י֮ ר֣וּחַ יְהוָה֒ וַ/יֹּ֣אמֶר אֵלַ֗/י אֱמֹר֙ כֹּה אָמַ֣ר יְהוָ֔ה כֵּ֥ן אֲמַרְתֶּ֖ם בֵּ֣ית יִשְׂרָאֵ֑ל וּ/מַעֲל֥וֹת רֽוּחֲ/כֶ֖ם אֲנִ֥י יְדַעְתִּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/005.yaml
  text: 'And the Spirit of Yahweh fell upon me[a], and he said to me, “Say, ‘Thus says Yahweh: So you have said, O house of Israel, and I know the things that come up in your spirit.’”'
translation:
  language: fr
  text: 'L’Esprit de Yahweh tomba sur moi et il me dit : « Dis : “Ainsi parle Yahweh : Voilà donc ce que vous avez dit, maison d’Israël, et moi, je connais ce qui monte dans votre esprit[a].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ce qui vous vient à l’esprit » ; littéralement : « ce qui monte dans votre esprit ».'
    reason: Signale une formulation française plus idiomatique tout en explicitant la métaphore hébraïque conservée dans le texte.
lexical_decisions:
- source_word: וַתִּפֹּל עָלַי
  choice: tomba sur moi
  rationale: Conserve l’image vive de נפל avec עַל, qui décrit ici l’irruption saisissante de l’Esprit dans le contexte prophétique.
- source_word: רוּחַ יְהוָה
  choice: l’Esprit de Yahweh
  rationale: Dans cette vision prophétique, רוּחַ désigne l’Esprit divin plutôt qu’un vent naturel ou une simple disposition intérieure.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Formule prophétique traditionnelle, exacte et naturelle en français biblique contemporain.
- source_word: כֵּן אֲמַרְתֶּם
  choice: Voilà donc ce que vous avez dit
  rationale: Rend la valeur récapitulative de כֵּן et le parfait אֲמַרְתֶּם, tout en restant idiomatique en français.
- source_word: בֵּית יִשְׂרָאֵל
  choice: maison d’Israël
  rationale: Maintient la formule collective et son poids rhétorique plutôt que de la réduire à « Israël ».
- source_word: וּמַעֲלוֹת רוּחֲכֶם
  choice: ce qui monte dans votre esprit
  rationale: Préserve la métaphore des choses qui montent ou surgissent dans l’intériorité, sans imposer le sens plus explicatif de « pensées ».
- source_word: אֲנִי יְדַעְתִּיהָ
  choice: moi, je connais
  rationale: La dislocation emphatique rend אֲנִי; le complément est fourni par la proposition précédente, ce qui évite en français une reprise pronominale maladroite.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le nom divin personnel; « Yahweh » le préserve sans le remplacer par un titre.
- issue: Sens de רוּחַ dans la première proposition
  choice: Esprit
  alternative: vent
  rationale: Le contexte de saisie et de parole prophétiques identifie ici la רוּחַ comme l’Esprit de Yahweh.
- issue: Sens anthropologique de רוּחֲכֶם dans la dernière proposition
  choice: votre esprit
  alternative: votre pensée / votre intelligence
  rationale: « Esprit » conserve le terme hébreu et son ambiguïté anthropologique; la note indique le sens contextuel possible sans l’imposer au texte.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient à la narration biblique soutenue. La formule « Ainsi parle Yahweh » conserve la solennité prophétique; « Voilà donc » rend l’insistance sans archaïsme. Le marqueur [a] figure dans le texte après l’expression qu’il éclaire.
