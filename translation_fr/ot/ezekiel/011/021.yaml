source:
  edition: WLC
  text: וְ/אֶל לֵ֧ב שִׁקּוּצֵי/הֶ֛ם וְ/תוֹעֲבוֹתֵי/הֶ֖ם לִבָּ֣/ם הֹלֵ֑ךְ דַּרְכָּ/ם֙ בְּ/רֹאשָׁ֣/ם נָתַ֔תִּי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/021.yaml
  text: But as for those whose heart goes after their detestable things and their abominations[a], I have brought their way upon their own heads[b], declares the Lord GOD.
translation:
  language: fr
  text: Mais quant à ceux dont le cœur s’attache[a] à leurs objets détestables[b] et à leurs abominations, j’ai fait retomber leur conduite sur leur propre tête, déclare le Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « leur cœur va vers le cœur de leurs objets détestables et de leurs abominations »; l’expression décrit leur attachement intérieur à ces choses.'
    reason: lexical_alternative
  - marker: b
    text: Ou « leurs idoles »; le terme hébreu désigne souvent des objets de culte jugés répugnants.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶל
  choice: Mais quant à ceux
  rationale: La conjonction et la préposition introduisent ici, en contraste avec la promesse des versets 19-20, le groupe qui reste attaché aux pratiques condamnées.
- source_word: לֵב ... לִבָּם הֹלֵךְ
  choice: dont le cœur s’attache
  rationale: Cette formulation française conserve l’image du cœur tout en exprimant naturellement l’orientation intérieure et persistante indiquée par l’hébreu.
- source_word: שִׁקּוּצֵיהֶם
  choice: leurs objets détestables
  rationale: Le terme désigne ce qui inspire le dégoût, souvent des objets idolâtres, sans se limiter lexicalement aux seules idoles.
- source_word: וְתוֹעֲבוֹתֵיהֶם
  choice: leurs abominations
  rationale: Ce terme prophétique fort peut viser des réalités ou des pratiques odieuses sur les plans cultuel et moral; «abominations» en garde la gravité.
- source_word: דַּרְכָּם
  choice: leur conduite
  rationale: Le sens métaphorique de «voie» est ici le comportement; «conduite» rend cette valeur clairement en français courant.
- source_word: נָתַתִּי ... בְּרֹאשָׁם
  choice: je fais retomber ... sur leur propre tête
  rationale: L’expression idiomatique décrit une rétribution qui revient sur ses auteurs. Le présent français exprime une décision divine effective sans alourdir la phrase par un calque de «mettre».
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclare le Seigneur Yahweh
  rationale: «Déclare» rend la formule prophétique נְאֻם; «le Seigneur Yahweh» distingue le titre אֲדֹנָי du nom divin יְהוִה.
theological_decisions:
- issue: Sens des objets détestables et des abominations
  choice: Maintenir deux expressions distinctes
  alternative: Fondre les deux termes dans une mention explicite des idoles
  rationale: Les deux noms hébreux se recouvrent partiellement, mais ne sont pas identiques. Le texte peut viser des objets idolâtres ainsi que d’autres réalités ou pratiques odieuses.
- issue: Valeur temporelle de נָתַתִּי dans l’annonce du jugement
  choice: je fais retomber
  alternative: j’ai fait retomber; je ferai retomber
  rationale: Le qatal présente la rétribution comme arrêtée ou accomplie du point de vue divin. Le présent français conserve cette force déclarative, tandis qu’un futur résoudrait davantage la perspective temporelle.
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU; le Souverain Seigneur
  rationale: Cette traduction rend séparément le titre אֲדֹנָי et le nom propre יְהוִה, sans confondre les deux éléments.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve le langage biblique du cœur et l’image de la rétribution retombant sur la tête, tout en évitant un calque syntaxique obscur.
