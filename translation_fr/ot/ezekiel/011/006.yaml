  text: You have multiplied your slain in this city and filled its streets with the slain[a][b].
translation:
  language: fr
  text: Vous avez multiplié vos morts dans cette ville et rempli ses rues[b] de morts[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de personnes tuées » ou « de cadavres ». Le terme hébreu désigne particulièrement des personnes mortes de manière violente.
    reason: lexical_alternative
  - marker: b
    text: Ou « ses places » ou « ses espaces ouverts ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְבֵּיתֶם
  choice: vous avez multiplié
  rationale: Le hifil accompli, à la 2e personne du pluriel, exprime le fait de rendre nombreux. « Vous avez multiplié » conserve cette valeur causative et le caractère accusateur de l’énoncé.
- source_word: חַלְלֵיכֶם
  choice: vos victimes
  rationale: Le nom désigne ici des personnes mortes de manière violente. « Vos victimes » exprime à la fois cette violence et le suffixe possessif, qui souligne la responsabilité des destinataires.
- source_word: בָּעִיר הַזֹּאת
  choice: dans cette ville
  rationale: Cette formulation rend directement la valeur locative et maintient l’insistance du démonstratif.
- source_word: וּמִלֵּאתֶם
  choice: et rempli
  rationale: Le piel accompli signifie « remplir ». L’auxiliaire déjà exprimé avec le premier verbe reste sous-entendu dans la coordination, conformément à l’usage naturel du français.
- source_word: חוּצֹתֶיהָ
  choice: ses rues
  rationale: Dans un cadre urbain, le terme peut désigner les rues, les places ou d’autres espaces publics ouverts. « Ses rues » est ici le choix français le plus courant et le plus naturel.
- source_word: חָלָל
  choice: personnes tuées
  rationale: Le singulier hébreu a une valeur collective et reprend le même terme que précédemment. Le pluriel français « personnes tuées » rend clairement le caractère violent de leur mort sans employer le singulier collectif peu naturel « le tué ».
