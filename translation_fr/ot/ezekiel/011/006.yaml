translation_notes:
  register: Français moderne, sobre et accusateur. « Vos victimes » attribue naturellement aux destinataires la responsabilité des morts, tandis que « personnes tuées » évite une répétition française maladroite tout en conservant le lien sémantique avec le même mot hébreu.
