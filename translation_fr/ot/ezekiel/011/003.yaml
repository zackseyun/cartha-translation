  text: who say[a], ‘It is not near to build houses. This city is the pot[b], and we are the meat.’
translation:
  language: fr
  text: 'qui disent[a] : « Construire des maisons, ce n’est pas pour bientôt. La ville est la marmite[b], et nous sommes la viande. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est elliptique. On peut aussi comprendre : « Ce n’est pas bientôt qu’on construira des maisons » ou « La construction de maisons n’est pas pour bientôt ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la chair ». Dans cette métaphore culinaire, « viande » rend plus naturellement l’image en français.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמְרִים
  choice: qui disent
  rationale: Le participe avec article a une valeur substantivale et renvoie aux hommes mentionnés dans le contexte ; la proposition relative est naturelle en français.
- source_word: לֹא בְקָרוֹב בְּנוֹת בָּתִּים
  choice: Ce n’est pas pour bientôt, la construction de maisons
  rationale: L’hébreu est elliptique. Cette formulation conserve l’idée de proximité temporelle sans ajouter explicitement « le moment » et laisse subsister la concision énigmatique de la phrase.
- source_word: הִיא הַסִּיר
  choice: La ville est la marmite
  rationale: Le pronom féminin renvoie vraisemblablement à Jérusalem, implicite dans le contexte. « La ville » explicite ce référent, tandis que « marmite » restitue naturellement סִיר et l’image culinaire.
- source_word: וַאֲנַחְנוּ הַבָּשָׂר
  choice: et nous sommes la viande
  rationale: Dans la métaphore de la marmite, « viande » exprime plus naturellement que « chair » le sens concret de בָּשָׂר en français.
theological_decisions:
- issue: Sens du proverbe de la marmite et de la viande
  choice: Conserver la métaphore sans en déterminer le sens dans le corps du texte.
  alternative: L’interpréter soit comme l’assurance que Jérusalem protège ses habitants, soit comme une formule sarcastique minimisant l’imminence du jugement.
  rationale: La formulation proverbiale demeure ambiguë dans ce verset ; la traduction ne doit pas résoudre une tension que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure disloquée « Ce n’est pas pour bientôt, la construction de maisons » rend l’ellipse hébraïque sans lui imposer une interprétation trop précise. Les deux marqueurs de note figurent dans le texte.
