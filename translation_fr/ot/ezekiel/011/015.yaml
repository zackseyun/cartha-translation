source:
  edition: WLC
  text: בֶּן אָדָ֗ם אַחֶ֤י/ךָ אַחֶ֨י/ךָ֙ אַנְשֵׁ֣י גְאֻלָּתֶ֔/ךָ וְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל כֻּלֹּ֑/ה אֲשֶׁר֩ אָמְר֨וּ לָ/הֶ֜ם יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם רַֽחֲקוּ֙ מֵ/עַ֣ל יְהוָ֔ה לָ֥/נוּ הִ֛יא נִתְּנָ֥ה הָ/אָ֖רֶץ לְ/מוֹרָשָֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/015.yaml
  text: Son of man[a], your brothers, your brothers, the men of your redemption, and all the house of Israel, all of it—these are the ones to whom the inhabitants of Jerusalem have said, ‘Go far away from Yahweh[b]; this land has been given to us as a possession.’
translation:
  language: fr
  text: 'Fils d’homme, tes frères, tes frères, tes proches parents ayant droit au rachat[a], et toute la maison d’Israël, tout entière — ce sont ceux à qui les habitants de Jérusalem ont dit : « Éloignez-vous de Yahweh ! C’est à nous que cette terre a été donnée comme possession[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les hommes de ton rachat ». Expression hébraïque difficile. On peut aussi comprendre : « les hommes de ta parenté », « tes compagnons d’exil » ou « les membres de ta parenté qui disposent d’un droit de rachat ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « en héritage ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Formule d’adresse caractéristique du livre d’Ézéchiel, conservée dans sa forme traditionnelle et idiomatique.
- source_word: אַחֶיךָ אַחֶיךָ
  choice: tes frères, tes frères
  rationale: La répétition emphatique du texte hébreu est maintenue plutôt que lissée.
- source_word: אַנְשֵׁי גְאֻלָּתֶךָ
  choice: les hommes qui ont sur toi un droit de rachat
  rationale: La formulation conserve le lien avec la racine גאל, associée au rachat exercé dans le cadre de la parenté, tout en étant plus intelligible en français que le calque « hommes de ton rachat ».
- source_word: וְכָל בֵּית יִשְׂרָאֵל כֻּלֹּה
  choice: et toute la maison d’Israël, tout entière
  rationale: Cette formulation préserve l’expression collective « maison d’Israël » ainsi que l’insistance redoublée de כֻּלֹּה.
- source_word: אֲשֶׁר ... לָהֶם
  choice: ce sont ceux à qui
  rationale: Cette explicitation rend clairement en français le lien entre le groupe précédent et le pronom indirect de la proposition relative.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: les habitants de Jérusalem
  rationale: Rendu naturel du participe hébreu, qui maintient le contraste avec les personnes éloignées ou exilées.
- source_word: רַחֲקוּ מֵעַל יְהוָה
  choice: Éloignez-vous de Yahweh
  rationale: L’impératif pluriel est conservé comme parole méprisante adressée par les habitants de Jérusalem aux autres Israélites.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription courante du nom divin personnel, qui le distingue d’un titre tel que « le Seigneur ».
- source_word: לָנוּ הִיא נִתְּנָה הָאָרֶץ
  choice: C’est à nous que ce pays a été donné
  rationale: La tournure emphatique française rend la mise en avant de לָנוּ et conserve le passif hébreu.
- source_word: לְמוֹרָשָׁה
  choice: en possession
  rationale: Le terme désigne ici un bien possédé ou reçu en héritage; « en possession » exprime naturellement la revendication territoriale sans imposer exclusivement la nuance successorale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le nom divin personnel; « Yahweh » le rend explicitement sans le remplacer par un titre.
- issue: Sens de אַנְשֵׁי גְאֻלָּתֶךָ
  choice: les hommes qui ont sur toi un droit de rachat
  alternative: les hommes de ta parenté; tes compagnons d’exil; les hommes de ton rachat
  rationale: L’expression hébraïque est difficile. Le texte principal conserve la notion juridique et familiale liée à la racine du rachat, tandis que la note signale les principales autres compréhensions sans trancher davantage que la source.
- issue: Valeur de לְמוֹרָשָׁה
  choice: en possession
  alternative: en héritage
  rationale: Le mot peut évoquer à la fois une possession durable et un héritage. Le texte retient la première nuance et la note préserve la seconde.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve les répétitions emphatiques et la tension du texte hébreu, tandis que les formulations les plus obscures sont éclairées sans supprimer leur ambiguïté.
