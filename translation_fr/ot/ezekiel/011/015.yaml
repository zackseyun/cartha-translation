revisions:
- from: 'Fils d’homme, tes frères, tes frères, les hommes qui ont sur toi un droit de rachat[a], et toute la maison d’Israël, tout entière — ce sont ceux à qui les habitants de Jérusalem ont dit : « Éloignez-vous de Yahweh ! C’est à nous que ce pays a été donné en possession[b]. »'
  to: 'Fils d’homme, tes frères, tes frères, tes proches parents ayant droit au rachat[a], et toute la maison d’Israël, tout entière — ce sont ceux à qui les habitants de Jérusalem ont dit : « Éloignez-vous de Yahweh ! C’est à nous que cette terre a été donnée comme possession[b]. »'
  rationale: La révision retire l’implication non attestée d’un droit de rachat « sur » Ézéchiel. « Tes proches parents ayant droit au rachat » exprime naturellement en français le lien familial et juridique vraisemblablement visé; la note conserve le littéralisme et les autres lectures possibles. « Cette terre » et « comme possession » suivent de près la formulation hébraïque sans changer le sens.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:17:28Z'
review_pass:
  verdict: revise
  source_fidelity: La répétition « tes frères, tes frères », l’expression collective « toute la maison d’Israël, tout entière », l’impératif « Éloignez-vous de Yahweh » et la revendication passive concernant la terre sont bien rendus. Toutefois, « les hommes qui ont sur toi un droit de rachat » oriente indûment le rapport juridique comme s’il s’exerçait sur Ézéchiel lui-même. L’expression אַנְשֵׁי גְאֻלָּתֶךָ est difficile, mais renvoie plus vraisemblablement à ses proches parents / gens de parenté associés au droit de rachat.
  naturalness: Le français est globalement naturel, soutenu et accessible. « ayant droit au rachat » est plus idiomatique et moins ambigu que « qui ont sur toi un droit de rachat ».
  terminology: « Fils d’homme », « maison d’Israël » et « Yahweh » sont cohérents. « Terre » rend plus directement הָאָרֶץ dans ce contexte et conserve la portée territoriale et théologique du terme. La note doit signaler explicitement la difficulté de l’expression de parenté-rachat.
