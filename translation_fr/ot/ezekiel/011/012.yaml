id: EZK.11.12
reference: Ezekiel 11:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה אֲשֶׁ֤ר בְּ/חֻקַּ/י֙ לֹ֣א הֲלַכְתֶּ֔ם וּ/מִשְׁפָּטַ֖/י לֹ֣א עֲשִׂיתֶ֑ם וּֽ/כְ/מִשְׁפְּטֵ֧י הַ/גּוֹיִ֛ם אֲשֶׁ֥ר סְבִיבוֹתֵי/כֶ֖ם עֲשִׂיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/012.yaml
  text: Then you will know that I am Yahweh[a], in whose statutes you have not walked, and whose judgments you have not carried out, but you have acted according to the judgments of the nations that are around you.
translation:
  language: fr
  text: 'Alors vous saurez que je suis Yahweh : vous n’avez pas suivi mes prescriptions ni appliqué mes règles, mais vous avez agi selon les règles[a] des nations qui vous entourent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon les coutumes des nations qui vous entourent ». Dans ce contexte, le mot hébreu traduit par « règles » peut aussi désigner les pratiques ou les coutumes suivies par ces nations.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Alors vous saurez
  rationale: Le qatal qal à la 2e personne du pluriel, précédé de la conjonction, a ici une valeur future et consécutive dans le discours prophétique. « Alors » exprime naturellement le résultat des jugements annoncés.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin, qui préserve sa fonction de nom propre et sa portée dans l’alliance.
- source_word: בְּחֻקַּי לֹא הֲלַכְתֶּם
  choice: vous n’avez pas suivi mes prescriptions
  rationale: « Suivre des prescriptions » rend en français courant l’image hébraïque de la marche comme conduite de vie, sans perdre sa portée morale et liée à l’alliance.
- source_word: חֻקַּי
  choice: mes prescriptions
  rationale: « Prescriptions » convient au cadre juridique de חֹק et permet de le distinguer de מִשְׁפָּט dans la proposition suivante.
- source_word: וּמִשְׁפָּטַי לֹא עֲשִׂיתֶם
  choice: ni appliqué mes règles
  rationale: Avec עשה, « appliquer » exprime idiomatiquement la mise en pratique des exigences divines. « Règles » garde ici le sens normatif de מִשְׁפָּטִים.
- source_word: מִשְׁפָּטַי / כְמִשְׁפְּטֵי
  choice: mes règles / les règles
  rationale: La répétition de « règles » préserve la reprise du même terme hébreu מִשְׁפָּט et souligne le contraste entre les normes de Yahweh et celles des nations.
- source_word: וּכְמִשְׁפְּטֵי הַגּוֹיִם
  choice: mais vous avez agi selon les règles des nations
  rationale: La conjonction a ici une valeur adversative. « Agir selon » rend naturellement עשה avec la préposition comparative כְּ, tandis que « règles » conserve la répétition lexicale, avec « coutumes » signalé en note.
- source_word: הַגּוֹיִם אֲשֶׁר סְבִיבוֹתֵיכֶם
  choice: des nations qui vous entourent
  rationale: Cette formulation française directe conserve la proposition relative et désigne clairement les peuples voisins.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » le rend comme nom propre sans le remplacer par un titre.
- issue: Rapport entre les prescriptions de Yahweh et la conduite d’Israël
  choice: Juxtaposition explicative après deux-points
  alternative: « dont vous n’avez pas suivi les prescriptions »
  rationale: Le deux-points conserve l’enchaînement du texte sans imposer à אֲשֶׁר une nuance causale ou une construction relative possessive peu naturelle en français. Le contraste théologique demeure entre la norme divine délaissée et les normes des nations adoptées.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset conserve le contraste juridique et moral ainsi que la répétition de מִשְׁפָּט, tout en remplaçant l’expression littérale « marcher dans » par le français naturel « suivre ».
