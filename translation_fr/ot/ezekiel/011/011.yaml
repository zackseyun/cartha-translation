reference: Ezekiel 11:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִ֗יא לֹֽא תִהְיֶ֤ה לָ/כֶם֙ לְ/סִ֔יר וְ/אַתֶּ֛ם תִּהְי֥וּ בְ/תוֹכָ֖/הּ לְ/בָשָׂ֑ר אֶל גְּב֥וּל יִשְׂרָאֵ֖ל אֶשְׁפֹּ֥ט אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/011.yaml
  text: It will not be for you as a pot[a], and you will not be within it as meat; at the border of Israel I will judge you.
translation:
  language: fr
  text: Elle ne sera pas pour vous une marmite, et vous serez[b] en son sein comme de la viande[a]. À la frontière d’Israël, je vous jugerai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « chair ». Dans l’image de la marmite, il s’agit de viande.'
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu porte « vous serez » ; plusieurs versions anciennes lisent « vous ne serez pas ».
    reason: textual_variant
lexical_decisions:
- source_word: הִיא
  choice: Elle
  rationale: Le pronom féminin renvoie à Jérusalem, désignée comme une ville dans le contexte précédent. Le français conserve naturellement ce genre grammatical.
- source_word: לְסִיר
  choice: une marmite
  rationale: סִיר désigne un récipient servant à cuire. « Marmite » restitue clairement et naturellement l’image proverbiale reprise dans le contexte.
- source_word: בְתוֹכָהּ
  choice: à l’intérieur
  rationale: L’expression signifie littéralement « en son milieu » ou « en elle » et renvoie à la ville. « À l’intérieur » préserve l’image spatiale sans lourdeur.
- source_word: לְבָשָׂר
  choice: la viande
  rationale: בָּשָׂר signifie littéralement « chair », mais, dans l’image de la marmite, il s’agit de viande destinée à cuire. « Viande » rend immédiatement l’image en français moderne.
- source_word: אֶל גְּבוּל יִשְׂרָאֵל
  choice: À la frontière d’Israël
  rationale: Dans ce contexte, אֶל גְּבוּל désigne le lieu vers lequel ils seront conduits et où le jugement aura lieu. « À la frontière » exprime naturellement cette valeur contextuelle tout en maintenant la formulation géographique.
- source_word: אֶשְׁפֹּט אֶתְכֶם
  choice: je vous jugerai
  rationale: שׁפט a ici son sens judiciaire dans un oracle de jugement. « Je vous jugerai » est direct, solennel et fidèle.
theological_decisions:
- issue: Image proverbiale de Jérusalem comme marmite protectrice
  choice: Conserver sans l’expliquer l’image de la marmite et de la viande
  alternative: Paraphraser en disant que Jérusalem ne les protégera pas
  rationale: Le verset reprend et renverse la formule proverbiale du contexte. Garder l’image préserve la force rhétorique de l’oracle sans imposer une interprétation dans le corps du texte.
- issue: Portée de la négation dans les deux propositions coordonnées
  choice: 'Rendre la seconde proposition à la forme négative : « vous ne serez pas »'
  alternative: 'Traduire formellement le second verbe à l’affirmatif : « vous serez »'
  rationale: Bien que לֹא ne soit exprimé qu’avant le premier verbe dans le texte consonantique transmis, la négation porte naturellement sur l’ensemble coordonné dans le contexte immédiat, comme le comprennent couramment les traductions anciennes et modernes. La formulation française explicite cette portée nécessaire à une lecture naturelle.
translation_notes:
  register: Français international moderne, sobre et digne. « Marmite » et « viande » rendent l’image culinaire de façon immédiatement compréhensible, tandis que la structure brève conserve le ton tranchant de l’oracle.
