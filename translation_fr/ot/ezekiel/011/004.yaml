  yaml_path: translation/ot/ezekiel/011/004.yaml
  text: Therefore prophesy against them[a]; prophesy[b], son of man.
translation:
  language: fr
  text: C’est pourquoi, prophétise contre eux[a] ; prophétise, fils d’homme[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prophétise à leur sujet » ; la préposition hébraïque a un sens plus large, mais, dans ce contexte de réprimande et de jugement, « contre eux » convient le mieux.
    reason: lexical_alternative
  - marker: b
    text: « Fils d’homme » est la manière récurrente dont Ézéchiel est interpellé ; on pourrait aussi traduire « être humain » ou « mortel ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque la conséquence logique de ce qui précède, dans un français naturel et soutenu.
- source_word: הִנָּבֵא
  choice: prophétise
  rationale: Impératif direct du verbe נבא ; la répétition est conservée pour rendre l’insistance et l’urgence de l’hébreu.
- source_word: עֲלֵיהֶם
  choice: contre eux
  rationale: Avec נבא, la préposition עַל peut signifier « contre » ou « au sujet de ». Le contexte de réprimande et de jugement favorise ici « contre eux ».
- source_word: בֶּן אָדָם
  choice: fils d’homme
  rationale: Formule d’adresse récurrente d’Ézéchiel, rendue de façon transparente et cohérente avec sa forme hébraïque.
theological_decisions:
- issue: Traduction de l’adresse בֶּן אָדָם dans Ézéchiel
  choice: fils d’homme
  alternative: être humain ; mortel
  rationale: La formule souligne la condition humaine du prophète. « Fils d’homme » conserve toutefois l’expression source et sa continuité dans le livre, sans imposer une paraphrase interprétative.
translation_notes:
  register: Français international moderne, digne et direct. La répétition impérative de l’hébreu est maintenue, ainsi que l’expression traditionnelle « fils d’homme » ; le point d’exclamation rend la force de l’ordre.
