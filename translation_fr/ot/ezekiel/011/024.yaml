  text: וְ/ר֣וּחַ נְשָׂאַ֗תְ/נִי וַ/תְּבִיאֵ֤/נִי כַשְׂדִּ֨ימָ/ה֙ אֶל הַ/גּוֹלָ֔ה בַּ/מַּרְאֶ֖ה בְּ/ר֣וּחַ אֱלֹהִ֑ים וַ/יַּ֨עַל֙ מֵֽ/עָלַ֔/י הַ/מַּרְאֶ֖ה אֲשֶׁ֥ר רָאִֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/024.yaml
  text: Then the Spirit lifted me up and brought me to the exiles in Chaldea[a], in the vision by the Spirit of God[d][c][b]; and the vision that I had seen went up from me.
translation:
  language: fr
  text: Alors l’Esprit me souleva et m’amena en Chaldée, auprès des exilés, dans la vision, par l’Esprit de Dieu[a]. Et la vision que j’avais vue s’éleva de moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans l’Esprit de Dieu ». La préposition hébraïque peut indiquer le moyen (« par ») ou la sphère (« dans »).'
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu dit littéralement : « monta de dessus moi » ; on peut aussi comprendre : « se retira de moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ
  choice: Alors l’Esprit
  rationale: Dans ce contexte de transport visionnaire, רוּחַ désigne le plus naturellement l’Esprit; «Alors» rend la progression narrative du וְ préfixé.
- source_word: נְשָׂאַתְנִי
  choice: me souleva
  rationale: נשא peut signifier soulever ou porter. «Me souleva» conserve l’image concrète du mouvement vers le haut.
- source_word: וַתְּבִיאֵנִי
  choice: m’amena
  rationale: Le hiphil de בוא signifie «faire venir», donc «amener».
- source_word: כַשְׂדִּימָה
  choice: en Chaldée
  rationale: La forme directionnelle indique un mouvement vers le territoire des Chaldéens; «Chaldée» préserve la désignation géographique ancienne.
- source_word: אֶל הַגּוֹלָה
  choice: auprès des exilés
  rationale: הַגּוֹלָה peut désigner collectivement la communauté déportée. «Auprès des exilés» est naturel après l’indication géographique et évite de répéter «à».
- source_word: בַּמַּרְאֶה
  choice: dans la vision
  rationale: מַרְאֶה désigne ici l’expérience visionnaire prophétique; l’article renvoie à la vision en cours.
- source_word: בְּרוּחַ אֱלֹהִים
  choice: par l’Esprit de Dieu
  rationale: La préposition בְּ peut marquer le moyen ou la sphère. Le contexte favorise ici l’action médiatrice de l’Esprit, tout en laissant l’autre possibilité en note.
- source_word: וַיַּעַל מֵעָלַי
  choice: s’éleva et s’éloigna de moi
  rationale: עלה avec מֵעַל exprime littéralement une montée depuis ce qui est au-dessus de quelqu’un. Cette formulation conserve le mouvement ascendant tout en rendant clairement le retrait de la vision.
- source_word: הַמַּרְאֶה אֲשֶׁר רָאִיתִי
  choice: la vision que j’avais vue
  rationale: La répétition de מַרְאֶה est conservée, et le plus-que-parfait marque naturellement l’antériorité en français.
theological_decisions:
- issue: Sens de רוּחַ dans le transport visionnaire
  choice: «l’Esprit» et «l’Esprit de Dieu»
  alternative: «le vent» ou «le souffle»
  rationale: Le contexte immédiat concerne un transport prophétique et une révélation. «Esprit» assure la cohérence des deux emplois sans préciser davantage que le texte.
- issue: Valeur de la préposition בְּ dans בְּרוּחַ אֱלֹהִים
  choice: «par l’Esprit de Dieu» (moyen ou agent)
  alternative: «dans l’Esprit de Dieu» (sphère)
  rationale: Les deux valeurs sont grammaticalement possibles. Le texte principal retient le moyen, plus naturel dans la séquence du transport, et la note préserve l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la succession narrative et distingue clairement la destination géographique, la communauté exilée et le cadre visionnaire. Les deux ambiguïtés importantes — la valeur de בְּ et le mouvement de retrait exprimé par וַיַּעַל מֵעָלַי — sont signalées sans surcharge de notes.
