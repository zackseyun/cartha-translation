revisions:
- from: Alors l’Esprit me souleva et m’amena en Chaldée, auprès des exilés, dans la vision, par l’Esprit de Dieu[a]. Puis la vision que j’avais vue s’éleva et s’éloigna de moi[b].
  to: Alors l’Esprit me souleva et m’amena en Chaldée, auprès des exilés, dans la vision, par l’Esprit de Dieu[a]. Et la vision que j’avais vue s’éleva de moi[b].
  rationale: La révision retire l’ajout « et s’éloigna », afin de conserver le mouvement ascendant exprimé par le verbe hébreu sans développer dans le texte principal le retrait seulement implicite. La note conserve l’alternative interprétative. « Et » rend la coordination narrative sans introduire une nuance temporelle supplémentaire.
