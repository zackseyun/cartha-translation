    reason: lexical_alternative
  revision_rationale: La révision retire l’ajout « et s’éloigna », afin de conserver le mouvement ascendant exprimé par le verbe hébreu sans développer dans le texte principal le retrait seulement implicite. La note conserve l’alternative interprétative. « Et » rend la coordination narrative sans introduire une nuance temporelle supplémentaire.
