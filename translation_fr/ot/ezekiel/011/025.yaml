source:
  edition: WLC
  text: וָ/אֲדַבֵּ֖ר אֶל הַ/גּוֹלָ֑ה אֵ֛ת כָּל דִּבְרֵ֥י יְהוָ֖ה אֲשֶׁ֥ר הֶרְאָֽ/נִי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/025.yaml
  text: Then I spoke to the exiles all the words of Yahweh that he had shown me[a].
translation:
  language: fr
  text: Je transmis alors aux exilés[a] toutes les paroles de Yahweh qu’il m’avait fait voir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « l’exil », terme collectif désignant la communauté des exilés.
    reason: Précision lexicale sur le singulier collectif hébreu הַגּוֹלָה.
lexical_decisions:
- source_word: וָאֲדַבֵּר
  choice: Je transmis alors
  rationale: Le wayyiqtol fait progresser le récit. « Alors » en marque naturellement la succession, et « transmis » exprime ici l’acte de communiquer à la communauté le contenu reçu, sans réduire דּבר à une simple conversation.
- source_word: אֶל הַגּוֹלָה
  choice: aux exilés[a]
  rationale: הַגּוֹלָה est un singulier collectif désignant la communauté déportée. « Aux exilés » est clair et naturel en français moderne; une note signale la forme hébraïque.
- source_word: אֵת כָּל דִּבְרֵי
  choice: toutes les paroles de
  rationale: Cette formulation conserve le substantif « paroles » et donc le caractère verbal de la révélation, plutôt que de généraliser par « tout ce que ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre, sans lui substituer un titre.
- source_word: אֲשֶׁר הֶרְאַנִי
  choice: qu’il m’avait fait voir
  rationale: Le hifil de ראה signifie ici « faire voir, montrer ». Le plus-que-parfait situe cette révélation avant sa transmission aux exilés, tandis que « fait voir » conserve le lien avec l’expérience visionnaire.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le nom divin. « Yahweh » préserve sa fonction de nom propre plutôt que de le remplacer par un titre.
- issue: Rapport entre les « paroles » et ce qui a été « fait voir »
  choice: Conserver l’expression « les paroles… qu’il m’avait fait voir »
  alternative: Expliciter par « tout ce que Yahweh m’avait montré »
  rationale: La formulation hébraïque associe délibérément des paroles à une révélation visionnaire. La traduction conserve cette tension au lieu de l’aplanir.
translation_notes:
  register: Français international moderne, sobre et digne. « Je transmis » évite la lourdeur de « je dis… toutes les paroles » tout en gardant l’idée d’une communication fidèle; « fait voir » maintient la coloration visionnaire du texte.
