  text: וַ/תִּשָּׂ֨א אֹתִ֜/י ר֗וּחַ וַ/תָּבֵ֣א אֹ֠תִ/י אֶל שַׁ֨עַר בֵּית יְהוָ֤ה הַ/קַּדְמוֹנִי֙ הַ/פּוֹנֶ֣ה קָדִ֔ימָ/ה וְ/הִנֵּה֙ בְּ/פֶ֣תַח הַ/שַּׁ֔עַר עֶשְׂרִ֥ים וַ/חֲמִשָּׁ֖ה אִ֑ישׁ וָ/אֶרְאֶ֨ה בְ/תוֹכָ֜/ם אֶת יַאֲזַנְיָ֧ה בֶן עַזֻּ֛ר וְ/אֶת פְּלַטְיָ֥הוּ בֶן בְּנָיָ֖הוּ שָׂרֵ֖י הָ/עָֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/001.yaml
  text: Then the Spirit lifted me up and brought me to the east gate of the house of Yahweh[a], which faces eastward. And behold, at the entrance of the gate were twenty-five men, and I saw among them Jaazaniah son of Azzur and Pelatiah son of Benaiah[c][b], leaders of the people.
translation:
  language: fr
  text: Puis l’Esprit me souleva et m’amena à la porte orientale de la maison de Yahvé[a], celle qui fait face à l’est. Et voici qu’à l’entrée de la porte se tenaient vingt-cinq hommes. Je vis parmi eux Yaazania, fils d’Azzour, et Pelatia, fils de Benaya, dirigeants du peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « la maison de Yahvé », c’est-à-dire le temple. Le mot hébreu traduit par « l’Esprit » peut aussi signifier « un esprit » ou « le vent »; dans le contexte de la vision d’Ézéchiel, il désigne très probablement l’Esprit divin.
    reason: Précision culturelle et conservation d’une possibilité lexicale authentique.
  - marker: b
    text: Ou « chefs du peuple », « responsables du peuple » ou « princes du peuple ».
    reason: Le terme hébreu désigne des personnes exerçant une autorité, sans préciser ici la nature exacte de leur fonction.
lexical_decisions:
- source_word: רוּחַ
  choice: l’Esprit
  rationale: Dans le contexte des visions d’Ézéchiel, le terme désigne le plus naturellement l’agent divin qui transporte le prophète. La majuscule explicite cette lecture contextuelle, tout en signalant l’autre possibilité en note.
- source_word: וַתִּשָּׂא אֹתִי
  choice: me souleva
  rationale: Cette formulation conserve le mouvement ascendant et l’image vive du verbe נשׂא sans paraphrase excessive.
- source_word: וַתָּבֵא אֹתִי
  choice: m’amena
  rationale: Le hifil de בוא signifie couramment « amener » ou « faire venir »; « m’amena » rend clairement la progression du transport visionnaire.
- source_word: שַׁעַר בֵּית יְהוָה
  choice: la porte orientale de la maison de Yahvé
  rationale: « Maison de Yahvé » reproduit l’expression hébraïque et laisse la note préciser qu’il s’agit du temple; « porte orientale » est naturel en français.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, plutôt que substitution par un titre.
- source_word: הַפּוֹנֶה קָדִימָה
  choice: celle qui fait face à l’est
  rationale: La proposition conserve la répétition descriptive et la précision spatiale de l’hébreu.
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Cette tournure française actuelle conserve la vivacité du marqueur narratif et prophétique.
- source_word: בְּפֶתַח הַשַּׁעַר
  choice: à l’entrée de la porte
  rationale: Rendu transparent et naturel de l’emplacement indiqué.
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אִישׁ
  choice: vingt-cinq hommes
  rationale: Le collectif אִישׁ désigne ici des hommes; la traduction respecte le genre et le nombre du groupe.
- source_word: בְּתוֹכָם
  choice: parmi eux
  rationale: Expression idiomatique qui conserve l’idée de présence au milieu du groupe.
- source_word: שָׂרֵי הָעָם
  choice: dirigeants du peuple
  rationale: שׂרים peut désigner des chefs, princes ou responsables. « Dirigeants » exprime leur autorité sans suggérer nécessairement une noblesse héréditaire.
theological_decisions:
- issue: Identification de רוּחַ dans le transport visionnaire d’Ézéchiel
  choice: « l’Esprit », compris comme l’Esprit divin
  alternative: « un esprit » ou « le vent »
  rationale: Les emplois visionnaires voisins dans Ézéchiel favorisent un agent divin déterminé. La note maintient toutefois visible l’amplitude lexicale du mot hébreu.
translation_notes:
  register: 'Français international moderne, digne et accessible. La syntaxe conserve le mouvement visionnaire ainsi que la répétition spatiale de l’hébreu. Les noms propres suivent des formes françaises proches de l’hébreu : Yaazania, Azzour, Pelatia et Benaya.'
