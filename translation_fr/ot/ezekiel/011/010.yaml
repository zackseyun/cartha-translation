id: EZK.11.10
reference: Ezekiel 11:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בַּ/חֶ֣רֶב תִּפֹּ֔לוּ עַל גְּב֥וּל יִשְׂרָאֵ֖ל אֶשְׁפּ֣וֹט אֶתְ/כֶ֑ם וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/010.yaml
  text: You will fall by the sword; I will judge you at the border of Israel[a], and you will know that I am Yahweh.
translation:
  language: fr
  text: Vous tomberez par l’épée ; je vous jugerai à la frontière d’Israël[a], et vous saurez que je suis Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur la frontière d’Israël ». L’expression hébraïque peut désigner un emplacement à la frontière ou sur celle-ci.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֶרֶב
  choice: par l’épée
  rationale: La préposition בְּ exprime ici le moyen. « Par l’épée » conserve l’image concrète et désigne naturellement une mort violente.
- source_word: תִּפֹּלוּ
  choice: vous tomberez
  rationale: Le verbe נפל signifie littéralement « tomber ». Dans ce contexte de jugement, il implique la mort, mais le rendu littéral préserve l’image hébraïque.
- source_word: עַל גְּבוּל יִשְׂרָאֵל
  choice: à la frontière d’Israël
  rationale: גְּבוּל peut désigner une frontière, une limite ou un territoire. Avec עַל, « à la frontière » exprime naturellement le lieu sans exclure la nuance « sur la frontière ».
- source_word: אֶשְׁפּוֹט אֶתְכֶם
  choice: je vous jugerai
  rationale: Rendu direct de שׁפט ; le contexte suffit à indiquer le caractère punitif du jugement.
- source_word: וִידַעְתֶּם
  choice: et vous saurez
  rationale: La forme a ici une valeur future et résultative. « Et » conserve la coordination hébraïque sans expliciter davantage la relation logique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » le rend comme nom propre, sans remplacer celui-ci par un titre.
- issue: Portée géographique de עַל גְּבוּל יִשְׂרָאֵל
  choice: à la frontière d’Israël
  alternative: sur la frontière d’Israël ; dans le territoire d’Israël
  rationale: Le contexte immédiat situe le jugement à la limite d’Israël, mais la préposition עַל permet une légère ambiguïté spatiale, conservée dans une note.
translation_notes:
  register: Français international moderne, clair et digne. Le futur simple rend la déclaration prophétique ; le parallélisme et l’image concrète de l’épée sont conservés.
