source:
  edition: WLC
  text: לָ/כֵ֣ן אֱמֹ֗ר כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ וְ/קִבַּצְתִּ֤י אֶתְ/כֶם֙ מִן הָ֣/עַמִּ֔ים וְ/אָסַפְתִּ֣י אֶתְ/כֶ֔ם מִן הָ֣/אֲרָצ֔וֹת אֲשֶׁ֥ר נְפֹצוֹתֶ֖ם בָּ/הֶ֑ם וְ/נָתַתִּ֥י לָ/כֶ֖ם אֶת אַדְמַ֥ת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/017.yaml
  text: 'Therefore say[a], ‘Thus says the Lord GOD: I will gather you from the peoples and assemble you from the lands where you have been scattered[b], and I will give you the land of Israel.’'
translation:
  language: fr
  text: 'C’est pourquoi, dis : « Voici ce que dit le Seigneur Yahweh[a] : Je vous rassemblerai d’entre les peuples[b], je vous réunirai des pays où vous avez été dispersés, et je vous donnerai la terre d’Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu porte : « Adonaï YHWH » ; traduction traditionnelle possible : « le Seigneur DIEU ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « des nations ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן אֱמֹר
  choice: C’est pourquoi, dis
  rationale: Rend le lien logique avec l’oracle précédent et conserve l’impératif singulier adressé au prophète.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Formule prophétique solennelle, exprimée dans un français actuel et naturel.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Traduit distinctement le titre אֲדֹנָי et le nom divin יהוה, sans produire l’expression maladroite « Seigneur SEIGNEUR ».
- source_word: וְקִבַּצְתִּי ... וְאָסַפְתִּי
  choice: Je vous rassemblerai ... je vous réunirai
  rationale: Préserve le parallélisme de deux verbes hébreux proches en employant deux équivalents français naturels.
- source_word: מִן הָעַמִּים
  choice: du milieu des peuples
  rationale: עַמִּים désigne littéralement des peuples; « du milieu de » explicite naturellement le point de départ exprimé par מִן.
- source_word: מִן הָאֲרָצוֹת
  choice: depuis les pays
  rationale: Dans le contexte de la dispersion, אֲרָצוֹת désigne les différents territoires ou pays où vivent les exilés.
- source_word: אֲשֶׁר נְפֹצוֹתֶם בָּהֶם
  choice: où vous avez été dispersés
  rationale: Rend la tournure passive et le lieu de la dispersion sans préciser un agent que le texte ne nomme pas ici.
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: la terre d’Israël
  rationale: Dans cette promesse de restauration, אַדְמָה renvoie au territoire d’Israël plutôt qu’à la seule matière du sol.
theological_decisions:
- issue: Traduction du titre divin אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le choix conserve à la fois le titre « Seigneur » et le nom propre divin. Une note signale la convention française alternative sans effacer la présence du tétragramme.
- issue: Agent de la dispersion
  choice: 'forme passive sans agent : « vous avez été dispersés »'
  alternative: « je vous ai dispersés »
  rationale: Le verset emploie une forme passive et ne nomme pas explicitement l’agent; la traduction préserve cette retenue.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la cadence prophétique et le parallélisme du texte hébreu, tout en évitant un calque peu naturel.
