source:
  edition: WLC
  text: וּ/בָ֖אוּ שָׁ֑מָּ/ה וְ/הֵסִ֜ירוּ אֶת כָּל שִׁקּוּצֶ֛י/הָ וְ/אֶת כָּל תּוֹעֲבוֹתֶ֖י/הָ מִמֶּֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/018.yaml
  text: They will come there and remove from it all its detestable things and all its abominations[a].
translation:
  language: fr
  text: Ils viendront là et en retireront toutes les choses détestables[a] et toutes les abominations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes ses idoles » ; le terme hébreu désigne souvent des objets idolâtres considérés comme détestables.
    reason: Alternative lexicale pour « choses détestables » (שִׁקּוּצֶיהָ), dont le contexte peut viser des objets idolâtres.
lexical_decisions:
- source_word: וּבָאוּ
  choice: Ils viendront
  rationale: Dans ce discours prophétique, le parfait précédé de la conjonction prend naturellement une valeur future et résultative; le contexte précédent annonce le retour.
- source_word: שָׁמָּה
  choice: là
  rationale: L’adverbe directionnel signifie « là, jusque-là »; après « venir », « là » est idiomatique et ne précise pas excessivement le référent.
- source_word: וְהֵסִירוּ
  choice: et en retireront
  rationale: Le hiphil de סור exprime ici l’action d’enlever. Le pronom « en » anticipe naturellement en français le complément final מִמֶּנָּה, sans en modifier le sens.
- source_word: אֶת כָּל שִׁקּוּצֶיהָ
  choice: toutes les choses détestables
  rationale: שִׁקּוּץ désigne ce qui est détestable, souvent un objet idolâtre. Cette formulation conserve la portée générale du terme sans imposer « idoles » dans le texte principal.
- source_word: וְאֶת כָּל תּוֹעֲבוֹתֶיהָ
  choice: et toutes les abominations
  rationale: תּוֹעֵבָה est un terme fort désignant ce qui est abominable, notamment dans des contextes cultuels et moraux; « abominations » en maintient le poids et le distingue du terme précédent.
- source_word: מִמֶּנָּה
  choice: en
  rationale: La préposition avec suffixe féminin singulier renvoie au lieu évoqué; en français, « en retirer » rend naturellement « retirer de celui-ci/de là ».
theological_decisions:
- issue: Faut-il rendre שִׁקּוּצֶיהָ explicitement par « idoles » ?
  choice: Conserver dans le texte principal le sens plus large « choses détestables ».
  alternative: « toutes ses idoles » ou « tous ses objets idolâtres »
  rationale: Le contexte rend l’allusion à l’idolâtrie très probable, mais le mot hébreu n’est pas limité lexicalement aux idoles. Une note préserve cette possibilité sans réduire l’ambiguïté du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le tour « en retireront » évite la lourdeur de « retireront de cet endroit » tout en conservant le référent féminin implicite du texte hébreu.
