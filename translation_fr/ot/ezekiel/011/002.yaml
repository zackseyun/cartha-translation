source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֵלָ֑/י בֶּן אָדָ֕ם אֵ֣לֶּה הָ/אֲנָשִׁ֞ים הַ/חֹשְׁבִ֥ים אָ֛וֶן וְ/הַ/יֹּעֲצִ֥ים עֲצַת רָ֖ע בָּ/עִ֥יר הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/002.yaml
  text: And he said to me[a], “Son of man[b], these are the men who devise iniquity and give evil counsel in this city.”
translation:
  language: fr
  text: 'Il me dit : « Fils d’homme, ce sont ces hommes qui trament le mal[a] et donnent de mauvais conseils[b] dans cette ville. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui projettent l’injustice » ou « qui pensent au mal ».
    reason: lexical_alternative
  - marker: b
    text: Ou « et recommandent un projet mauvais ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Il me dit
  rationale: Le wayyiqtol poursuit le récit. Le passé simple rend naturellement la séquence narrative en français sans exiger un « et » initial.
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Cette formule est l’adresse divine récurrente faite au prophète dans Ézéchiel. La traduction conserve l’idiome hébreu et sa portée littéraire.
- source_word: אֵלֶּה הָאֲנָשִׁים
  choice: ce sont ces hommes
  rationale: Le masculin pluriel désigne ici des hommes précis, présentés dans le contexte comme des dirigeants de la ville.
- source_word: הַחֹשְׁבִים אָוֶן
  choice: qui trament le mal
  rationale: חשב exprime ici une élaboration intentionnelle, et אָוֶן porte une valeur morale négative. « Tramer le mal » restitue l’idée d’un projet mauvais sans la réduire à une simple pensée intérieure.
- source_word: וְהַיֹּעֲצִים עֲצַת רָע
  choice: et donnent de mauvais conseils
  rationale: La construction associant le participe et le nom de même racine souligne l’activité de conseiller. Cette formulation française reste naturelle tout en préservant ce sens.
- source_word: בָּעִיר הַזֹּאת
  choice: dans cette ville
  rationale: Traduction directe et idiomatique de la tournure locative.
theological_decisions:
- issue: Traduction de אדם dans l’adresse בֶּן אָדָם
  choice: Fils d’homme
  alternative: Mortel ; être humain
  rationale: La formule récurrente d’Ézéchiel doit garder sa forme reconnaissable et sa résonance littéraire. Elle désigne ici le prophète dans une adresse, plutôt que l’humanité en général.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au récit biblique écrit ; « trament » marque l’intention délibérée sans ajouter de précision doctrinale.
