  text: חֶ֖רֶב יְרֵאתֶ֑ם וְ/חֶ֨רֶב֙ אָבִ֣יא עֲלֵי/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/008.yaml
  text: You have feared the sword[a], and I will bring the sword upon you[b], declares the Lord GOD.
translation:
  language: fr
  text: Vous avez redouté l’épée[a], et je ferai venir l’épée contre vous[b], déclare le Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’épée ». Le terme peut aussi désigner plus largement la guerre ou un jugement violent.'
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire, en conservant l’ordre emphatique de l’hébreu : « Vous avez redouté l’épée, et une épée, je la ferai venir contre vous. »'
    reason: alternative_reading
lexical_decisions:
- source_word: חֶרֶב
  choice: l’épée
  rationale: Le nom désigne littéralement l’épée et peut, par métonymie, évoquer la guerre ou un jugement violent. Le choix concret préserve l’image et sa répétition rhétorique.
- source_word: יְרֵאתֶם
  choice: vous avez redouté
  rationale: Le qal accompli, deuxième personne du masculin pluriel, exprime ici une crainte éprouvée. « Redouter » est naturel et prend directement « l’épée » comme complément.
- source_word: וְחֶרֶב אָבִיא עֲלֵיכֶם
  choice: eh bien, je ferai venir l’épée sur vous
  rationale: L’ordre hébreu place « épée » en tête et souligne la correspondance entre la menace redoutée et le jugement annoncé. « Eh bien » rend naturellement la portée conséquente de la coordination, tandis que la répétition de « l’épée » conserve l’insistance.
- source_word: נְאֻם
  choice: déclare
  rationale: Dans la formule prophétique, « déclare » transmet avec naturel et dignité la solennité de l’énoncé divin.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: « Seigneur » rend אֲדֹנָי et « Yahweh » représente explicitement le nom divin יהוה, sans produire l’expression ambiguë « le Seigneur SEIGNEUR ».
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte directement le tétragramme après אֲדֹנָי. « Le Seigneur Yahweh » distingue le titre du nom propre et suit l’indication doctrinale fournie, sans ajouter d’interprétation confessionnelle.
- issue: Portée de חֶרֶב dans l’annonce du jugement
  choice: conserver l’image concrète « l’épée »
  alternative: traduire par « la guerre » ou « un jugement violent »
  rationale: Le contexte permet une portée plus large, mais le lexème et sa répétition mettent en avant l’image de l’épée. La traduction ne doit pas résoudre silencieusement cette amplitude métaphorique.
translation_notes:
  register: Français international moderne, digne et accessible. « Redouter » maintient le ton prophétique sans archaïsme. Le point-virgule et « eh bien » rendent la relation rhétorique entre la peur reprochée et le jugement correspondant. Tous les appels de note figurent dans le texte.
