  source_fidelity: 'Le texte rend correctement la séquence hébraïque : la gloire de Yahweh monte/quitte le milieu de la ville, puis prend place sur la montagne à l’est de celle-ci. « S’éleva » est un rendu naturel de וַיַּעַל et « s’arrêta » exprime adéquatement l’aboutissement du mouvement implicite dans וַיַּעֲמֹד. « Du milieu de la ville » suit une solution idiomatique recevable pour מֵעַל תּוֹךְ הָעִיר, sans prétendre résoudre plus précisément la nuance spatiale de la préposition.'
