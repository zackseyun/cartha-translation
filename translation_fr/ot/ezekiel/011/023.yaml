id: EZK.11.23
reference: Ezekiel 11:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֨עַל֙ כְּב֣וֹד יְהוָ֔ה מֵ/עַ֖ל תּ֣וֹךְ הָ/עִ֑יר וַֽ/יַּעֲמֹד֙ עַל הָ/הָ֔ר אֲשֶׁ֖ר מִ/קֶּ֥דֶם לָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/023.yaml
  text: And the glory of Yahweh went up from the midst of the city and stood on the mountain that is east of the city[a][b].
translation:
  language: fr
  text: La gloire de Yahweh s’éleva du milieu de la ville et s’arrêta sur la montagne située à l’est de la ville[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « située devant la ville »; le terme hébreu peut désigner l’est ou ce qui se trouve devant, selon l’orientation adoptée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: s’éleva
  rationale: Le verbe עלה exprime un mouvement vers le haut. « S’éleva » convient au déplacement visionnaire de la gloire et reste naturel en français.
- source_word: כְּבוֹד יְהוָה
  choice: la gloire de Yahweh
  rationale: Cette formulation conserve le rapport construit et la portée de כבוד comme manifestation visible de la présence divine, tout en rendant directement le nom divin.
- source_word: מֵעַל תּוֹךְ הָעִיר
  choice: du milieu de la ville
  rationale: La combinaison de מֵעַל et תּוֹךְ indique le départ depuis l’espace situé au-dessus du centre ou de l’intérieur de la ville. La formulation retenue est naturelle, sans alourdir le texte.
- source_word: וַיַּעֲמֹד
  choice: s’arrêta
  rationale: Dans cette séquence de déplacement, עמד décrit le fait de prendre position ou de s’immobiliser. « S’arrêta » rend clairement ce passage du mouvement à l’immobilité.
- source_word: עַל הָהָר
  choice: sur la montagne
  rationale: הַר désigne ici une élévation topographique identifiable; « montagne » préserve le sens ordinaire et le registre solennel.
- source_word: אֲשֶׁר מִקֶּדֶם לָעִיר
  choice: située à l’est de la ville
  rationale: Dans cette indication géographique, קֶדֶם désigne très probablement l’est. Une note conserve toutefois la possibilité du sens spatial « devant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu porte le tétragramme. « Yahweh » conserve le nom personnel au lieu de lui substituer un titre.
- issue: Nature de la « gloire »
  choice: la gloire de Yahweh
  alternative: la présence glorieuse de Yahweh
  rationale: La traduction conserve le terme כבוד sans expliciter davantage sa nature, afin de ne pas résoudre dans le texte la relation entre gloire, présence et manifestation divine.
translation_notes:
  register: Français moderne, international et digne. La phrase suit le mouvement narratif de l’hébreu tout en évitant une formulation artificielle. Le nom divin est translittéré « Yahweh ».
