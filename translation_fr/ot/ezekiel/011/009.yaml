id: EZK.11.9
reference: Ezekiel 11:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הוֹצֵאתִ֤י אֶתְ/כֶם֙ מִ/תּוֹכָ֔/הּ וְ/נָתַתִּ֥י אֶתְ/כֶ֖ם בְּ/יַד זָרִ֑ים וְ/עָשִׂ֛יתִי בָ/כֶ֖ם שְׁפָטִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/009.yaml
  text: And I will bring you out from its midst[a], and I will give you into the hand of foreigners[b], and I will execute judgments on you.
translation:
  language: fr
  text: Je vous ferai sortir du milieu d’elle, je vous livrerai au pouvoir d’étrangers[a] et j’exécuterai mes jugements contre vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la main d’étrangers ». Cette expression hébraïque signifie être livré à leur pouvoir.'
    reason: idiome lexical
lexical_decisions:
- source_word: וְהוֹצֵאתִי
  choice: Je vous ferai sortir
  rationale: 'Le hiphil de יצא exprime ici la causation : « faire sortir ». Cette formulation française conserve directement cette valeur.'
- source_word: מִתּוֹכָהּ
  choice: du milieu d’elle
  rationale: תּוֹךְ désigne le milieu ou l’intérieur, et le suffixe féminin singulier renvoie à la ville, Jérusalem. La formulation préserve le pronom du texte hébreu.
- source_word: וְנָתַתִּי אֶתְכֶם בְּיַד
  choice: je vous livrerai au pouvoir de
  rationale: L’expression נתן ביד signifie remettre quelqu’un au pouvoir d’un autre. La traduction restitue naturellement en français le sens de l’idiome sans conserver artificiellement l’image de la main.
- source_word: זָרִים
  choice: étrangers
  rationale: זָרִים désigne ici des personnes étrangères, dans le contexte des conquérants non israélites. « Étrangers » est clair et actuel.
- source_word: וְעָשִׂיתִי בָכֶם שְׁפָטִים
  choice: et j’exécuterai mes jugements contre vous
  rationale: עשה ב... שפטים désigne l’accomplissement d’actes judiciaires punitifs. « Exécuter mes jugements contre vous » conserve le registre judiciaire et la valeur adversative du contexte.
theological_decisions:
- issue: Référent du suffixe féminin dans מִתּוֹכָהּ
  choice: Le suffixe renvoie implicitement à Jérusalem, rendue par « elle ».
  alternative: « du milieu de la ville » expliciterait le référent.
  rationale: Le contexte identifie la ville, mais le verset emploie un pronom plutôt que le nom. La traduction conserve cette anaphore sans ajouter un substantif absent.
translation_notes:
  register: Français international moderne, digne et direct. Le futur divin est maintenu. « Du milieu d’elle » conserve la structure et le référent féminin de l’hébreu, tandis que « au pouvoir d’étrangers » rend l’idiome de façon naturelle.
