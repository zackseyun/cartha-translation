source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ חַלְלֵי/כֶם֙ אֲשֶׁ֣ר שַׂמְתֶּ֣ם בְּ/תוֹכָ֔/הּ הֵ֥מָּה הַ/בָּשָׂ֖ר וְ/הִ֣יא הַ/סִּ֑יר וְ/אֶתְ/כֶ֖ם הוֹצִ֥יא מִ/תּוֹכָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/007.yaml
  text: 'Therefore thus says Lord Yahweh: Your slain whom you have placed in its midst—they are the meat[a], and it is the pot; but you I will bring out from its midst.'
translation:
  language: fr
  text: 'C’est pourquoi, ainsi parle le Seigneur Yahweh : Vos victimes, que vous avez placées au milieu d’elle, ce sont elles qui sont la viande, et c’est elle qui est la marmite. Mais vous, je vous ferai sortir du milieu d’elle.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Conserve le titre אֲדֹנָי et rend explicitement le nom divin יהוה, tout en produisant une expression française digne et intelligible.
- source_word: חַלְלֵיכֶם אֲשֶׁר שַׂמְתֶּם
  choice: Ceux que vous avez tués et placés
  rationale: חָלָל désigne des personnes tuées, souvent violemment. La formulation verbale est plus naturelle en français que « vos tués » et maintient la responsabilité exprimée par « vous ».
- source_word: בְּתוֹכָהּ / מִתּוֹכָהּ
  choice: au milieu d’elle / du milieu d’elle
  rationale: Le suffixe féminin renvoie à la ville. Cette formulation conserve à la fois la référence grammaticale et la dimension spatiale du texte.
- source_word: הֵמָּה הַבָּשָׂר
  choice: ce sont eux la viande
  rationale: La tournure emphatique hébraïque est reflétée par « ce sont eux ». « Viande » rend clairement l’image culinaire liée à la marmite, tandis que « chair » demeure une possibilité lexicale signalée en note.
- source_word: הַסִּיר
  choice: la marmite
  rationale: סִיר désigne ici un récipient de cuisson. « Marmite » rend l’image plus précisément que le terme général « pot » en français moderne.
- source_word: הוֹצִיא
  choice: je vous ferai sortir
  rationale: La forme hifil exprime l’action causative de faire sortir. Malgré la morphologie de troisième personne dans le discours prophétique rapporté, le passage à la première personne restitue naturellement la parole directe de Yahweh.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le choix conserve le nom propre de l’alliance sans produire l’expression maladroite « le Seigneur SEIGNEUR ».
- issue: Métaphore de la viande et de la marmite
  choice: Métaphore conservée directement
  alternative: Expliciter que seuls les morts restent protégés dans la ville
  rationale: Le texte renverse la comparaison précédente sans en développer explicitement toutes les implications. La traduction maintient cette tension plutôt que de l’interpréter dans le corps du verset.
- issue: Sujet de הוֹצִיא
  choice: 'Première personne : « je vous ferai sortir »'
  alternative: 'Troisième personne : « il vous fera sortir »'
  rationale: Dans la formule prophétique « ainsi parle », une troisième personne peut apparaître alors que Yahweh poursuit lui-même son discours. La première personne est la lecture contextuelle naturelle, mais la discordance formelle est réelle.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La dislocation « ce sont eux… et elle, c’est… » reproduit l’emphase et le contraste de l’hébreu tout en restant naturelle à l’oral comme à l’écrit.
