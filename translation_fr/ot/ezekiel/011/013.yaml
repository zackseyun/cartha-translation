  text: וַֽ/יְהִי֙ כְּ/הִנָּ֣בְאִ֔/י וּ/פְלַטְיָ֥הוּ בֶן בְּנָיָ֖ה מֵ֑ת וָ/אֶפֹּ֨ל עַל פָּנַ֜/י וָ/אֶזְעַ֣ק קוֹל גָּד֗וֹל וָ/אֹמַר֙ אֲהָהּ֙ אֲדֹנָ֣/י יְהוִ֔ה כָּלָה֙ אַתָּ֣ה עֹשֶׂ֔ה אֵ֖ת שְׁאֵרִ֥ית יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/013.yaml
  text: And it happened[a], as I was prophesying, that Pelatiah son of Benaiah died. Then I fell on my face and cried out with a loud voice and said, “Ah, Lord GOD[b], will you make a complete end of the remnant of Israel?”
translation:
  language: fr
  text: 'Il arriva que, pendant que je prophétisais, Pelatia, fils de Benaïa, est mort. Alors je suis tombé face contre terre et j’ai crié d’une voix forte : « Ah ! Seigneur Yahweh[a], vas-tu faire disparaître entièrement le reste d’Israël ?[b] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « Seigneur YHWH », c’est-à-dire le titre אֲדֹנָי suivi du nom divin יהוה.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « es-tu en train de faire disparaître entièrement le reste d’Israël ? » L’hébreu peut avoir une valeur présente ou imminente.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי כְּהִנָּבְאִי
  choice: Pendant que je prophétisais
  rationale: La préposition כְּ avec l’infinitif construit et le suffixe de première personne exprime ici la simultanéité. Le français rend naturellement la progression narrative sans reproduire mécaniquement וַיְהִי.
- source_word: וּפְלַטְיָהוּ בֶן־בְּנָיָה מֵת
  choice: Pelatia, fils de Benaya, est mort
  rationale: Le parfait de מות rapporte l’événement de la mort. Le passé composé est clair et naturel en français moderne.
- source_word: וָאֶפֹּל עַל־פָּנַי
  choice: Alors je suis tombé face contre terre
  rationale: « Face contre terre » restitue clairement le geste hébreu de détresse, de supplication ou de saisissement.
- source_word: וָאֶזְעַק קוֹל גָּדוֹל
  choice: et j’ai crié d’une voix forte
  rationale: זעק désigne un cri intense, souvent poussé dans la détresse, et « d’une voix forte » correspond directement à קוֹל גָּדוֹל.
- source_word: אֲהָהּ
  choice: Ah !
  rationale: Cette interjection exprime ici l’effroi et la lamentation sans recourir au plus littéraire « Hélas ! ».
- source_word: אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  rationale: Cette formulation distingue le titre אֲדֹנָי du nom divin יהוה et conserve explicitement le nom d’alliance.
- source_word: כָּלָה אַתָּה עֹשֶׂה
  choice: vas-tu faire disparaître entièrement
  rationale: La construction forme l’idée de mener à une fin complète. Cette tournure française conserve l’imminence et la totalité sans employer le calque peu naturel « faire une fin complète ».
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: le reste d’Israël
  rationale: « Le reste » est la désignation française naturelle des survivants et préserve la portée théologique de שְׁאֵרִית.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  alternative: Seigneur DIEU
  rationale: Le texte associe le titre « Seigneur » au nom propre YHWH. « Seigneur Yahweh » maintient les deux éléments et évite de remplacer silencieusement le nom divin par un titre.
- issue: Valeur de la dernière proposition
  choice: vas-tu faire disparaître entièrement le reste d’Israël ?
  alternative: es-tu en train de faire disparaître entièrement le reste d’Israël ?
  rationale: L’hébreu ne comporte pas de particule interrogative explicite, mais le cri adressé à Dieu se comprend naturellement comme une question alarmée. La forme « vas-tu » exprime une action imminente tout en laissant en note la possible valeur présente.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé composé rend le récit accessible; « face contre terre » et « d’une voix forte » conservent l’intensité concrète de la scène. La question finale maintient l’alarme et la tension intercessrice du prophète.
