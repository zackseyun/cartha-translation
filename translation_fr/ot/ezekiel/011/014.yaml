  yaml_path: translation/ot/ezekiel/011/014.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: fr
  text: 'Et la parole de Yahweh[a] me fut adressée :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler la forme hébraïque du nom divin et son rendu traditionnel.
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans cette formule prophétique, le waw consécutif avec היה introduit la séquence et se rend naturellement en français avec la tournure consacrée « la parole… fut adressée », sans calquer le littéral « et il arriva ».
- source_word: דְבַר
  choice: La parole
  rationale: Dans le construit דְבַר יְהוָה, « parole » désigne avec précision la révélation prophétique et conserve l’écho de la formule récurrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte directement le tétragramme, nom divin personnel, ici translittéré plutôt que remplacé par un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » exprime naturellement en français la direction indiquée par la préposition אֶל avec le suffixe de première personne.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif hébreu introduit les paroles directes qui suivent. En français moderne, les deux-points remplissent naturellement cette fonction et évitent la tournure lourde « en ces termes ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération conserve le nom personnel présent dans le texte hébreu; une note signale le rendu traditionnel sans substituer silencieusement un titre au nom.
translation_notes:
  register: Français moderne, digne et fluide. La formule prophétique française « La parole de Yahweh me fut adressée » restitue l’idiome hébreu sans archaïsme excessif; les deux-points annoncent naturellement le discours du verset suivant.
