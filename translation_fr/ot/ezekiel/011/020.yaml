base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/020.yaml
  text: so that they may walk in my statutes and keep my judgments and do them[a], and they will be my people, and I will be their God.
translation:
  language: fr
  text: afin qu’ils marchent selon mes prescriptions, qu’ils observent mes règles et les mettent en pratique[a]. Ils seront mon peuple, et moi, je serai leur Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes ordonnances ». Le mot hébreu peut désigner des règles, des décisions de justice ou des ordonnances prescrites dans le cadre de l’alliance.
    reason: alternative lexicale
lexical_decisions:
- source_word: לְמַעַן
  choice: afin que
  rationale: Introduit ici le but ou le résultat recherché; « afin que » en conserve clairement la valeur.
- source_word: בְּחֻקֹּתַי יֵלֵכוּ
  choice: ils suivent mes prescriptions
  rationale: Littéralement « ils marchent dans mes prescriptions ». « Suivre » restitue naturellement en français la métaphore de la conduite de vie, tandis que « prescriptions » exprime le caractère normatif de חֻקִּים.
- source_word: מִשְׁפָּטַי
  choice: mes règles
  rationale: Dans ce contexte d’alliance, le terme désigne des décisions ou normes prescrites. « Règles » est clair en français moderne, sans limiter le sens à des jugements judiciaires.
- source_word: יִשְׁמְרוּ
  choice: gardent
  rationale: Conserve le verbe concret hébreu, qui signifie observer fidèlement des prescriptions.
- source_word: וְעָשׂוּ אֹתָם
  choice: et les mettent en pratique
  rationale: Rend explicitement l’idée d’exécuter ces règles, dans un français plus naturel que « les faire ».
- source_word: וְהָיוּ לִי לְעָם
  choice: Alors ils seront mon peuple
  rationale: Préserve la formule d’alliance. « Alors » fait entendre le rapport de résultat porté par la construction sans ajouter de contenu doctrinal.
- source_word: וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: et moi, je serai leur Dieu
  rationale: Restitue la formule réciproque de l’alliance; le pronom tonique « moi » représente l’insistance du וַאֲנִי hébreu.
theological_decisions:
- issue: Formule réciproque de l’alliance
  choice: « ils seront mon peuple, et moi, je serai leur Dieu »
  alternative: « ils deviendront pour moi un peuple, et je deviendrai pour eux Dieu »
  rationale: La formulation retenue est naturelle et consacrée en français tout en conservant exactement la réciprocité du texte, sans explicitation théologique supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore hébraïque de la marche est rendue idiomatiquement par « suivre »; le parallélisme entre garder et mettre en pratique est conservé.
