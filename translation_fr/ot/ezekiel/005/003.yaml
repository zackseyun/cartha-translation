  text: וְ/לָקַחְתָּ֥ מִ/שָּׁ֖ם מְעַ֣ט בְּ/מִסְפָּ֑ר וְ/צַרְתָּ֥ אוֹתָ֖/ם בִּ/כְנָפֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/003.yaml
  text: And you shall take from there a few in number and bind them in the folds of your garment[a].
translation:
  language: fr
  text: Tu en prendras ensuite un petit nombre et tu les attacheras dans les pans de ton vêtement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les bords de ton vêtement » ou « dans les plis de ta robe » ; le mot hébreu signifie littéralement « dans tes ailes » et peut désigner les extrémités d’un vêtement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Tu en prendras ensuite
  rationale: Le parfait qatal précédé de ו poursuit ici la série d’instructions prophétiques. Le futur français exprime naturellement cette valeur directive; « en » explicite sans lourdeur que le prélèvement se fait parmi les cheveux mentionnés dans le contexte.
- source_word: מִשָּׁם
  choice: en… ensuite
  rationale: Littéralement « de là ». Dans le contexte, l’adverbe renvoie aux cheveux précédemment traités. La tournure française « en prendre » rend naturellement cette relation, tandis que « ensuite » marque l’enchaînement porté par ו.
- source_word: מְעַט בְּמִסְפָּר
  choice: un petit nombre
  rationale: La formule associe l’idée de peu à celle de nombre. « Un petit nombre » conserve la précision quantitative dans un français naturel.
- source_word: וְצַרְתָּ
  choice: tu les attacheras
  rationale: Le verbe signifie serrer, lier ou enfermer. « Attacher » convient au geste concret effectué avec quelques cheveux et reste clair en français moderne.
- source_word: אוֹתָם
  choice: les
  rationale: Le pronom masculin pluriel renvoie aux cheveux prélevés; le pronom objet « les » est la reprise française naturelle.
- source_word: בִּכְנָפֶיךָ
  choice: dans les pans de ton vêtement
  rationale: כָּנָף désigne littéralement une aile, puis l’extrémité, le bord ou le pan d’un vêtement. « Les pans de ton vêtement » transmet cette image vestimentaire sans suggérer des ailes au lecteur moderne.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement correspond à l’adresse divine singulière à Ézéchiel. La formulation conserve la séquence d’instructions et l’image concrète du vêtement, avec une note pour l’étendue sémantique de כָּנָף.
