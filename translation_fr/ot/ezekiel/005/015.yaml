source:
  edition: WLC
  text: וְֽ/הָ֨יְתָ֜ה חֶרְפָּ֤ה וּ/גְדוּפָה֙ מוּסָ֣ר וּ/מְשַׁמָּ֔ה לַ/גּוֹיִ֖ם אֲשֶׁ֣ר סְבִיבוֹתָ֑יִ/ךְ בַּ/עֲשׂוֹתִ/י֩ בָ֨/ךְ שְׁפָטִ֜ים בְּ/אַ֤ף וּ/בְ/חֵמָה֙ וּ/בְ/תֹכְח֣וֹת חֵמָ֔ה אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/015.yaml
  text: And you shall become a reproach and a taunt[a], a warning and a horror, to the nations that are around you, when I execute judgments on you in anger and in wrath and with wrathful rebukes. I am Yahweh[c][b]; I have spoken.
translation:
  language: fr
  text: Tu deviendras un objet d’opprobre et de raillerie, un avertissement[a] et un objet d’épouvante[b] pour les nations qui t’entourent, lorsque j’exécuterai mes jugements contre toi dans la colère et la fureur, avec des réprimandes pleines de fureur[c]. Moi, Yahvé, j’ai parlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi signifier « instruction », « discipline » ou « correction » ; Jérusalem devient ici une leçon pour les nations voisines.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut aussi désigner la dévastation ou la stupeur qu’elle provoque.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « avec des réprimandes de fureur » ; il peut aussi s’agir de corrections ou de châtiments.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Tu deviendras
  rationale: Le verbe au féminin singulier renvoie à Jérusalem, directement interpellée. Le tutoiement conserve cette adresse prophétique.
- source_word: חֶרְפָּה
  choice: un objet de honte
  rationale: Cette expression rend à la fois le déshonneur subi et le mépris public dont Jérusalem fera l’objet.
- source_word: גְדוּפָה
  choice: d’insultes
  rationale: Le nom désigne des paroles outrageantes ou injurieuses. Cette formulation française s’accorde naturellement avec « objet de » tout en restant distincte de la honte.
- source_word: מוּסָר
  choice: un avertissement
  rationale: Dans cette série de conséquences visibles pour les peuples voisins, le terme présente Jérusalem comme une leçon qui doit les mettre en garde.
- source_word: מְשַׁמָּה
  choice: un objet d’épouvante
  rationale: Le mot peut évoquer la dévastation aussi bien que la réaction horrifiée qu’elle provoque. Ici, la construction avec les nations met en relief cette réaction.
- source_word: לַגּוֹיִם אֲשֶׁר סְבִיבוֹתָיִךְ
  choice: pour les nations qui t’entourent
  rationale: La formulation conserve le rapport aux peuples voisins et se lit naturellement en français.
- source_word: בַּעֲשׂוֹתִי בָךְ שְׁפָטִים
  choice: lorsque j’exécuterai mes jugements contre toi
  rationale: L’infinitif introduit une circonstance temporelle. « Exécuter mes jugements » maintient la dimension judiciaire sans réduire le terme à de simples punitions.
- source_word: בְּאַף וּבְחֵמָה
  choice: dans la colère et la fureur
  rationale: Deux termes proches sont conservés afin de rendre l’intensification du texte hébreu.
- source_word: וּבְתוֹכְחוֹת חֵמָה
  choice: avec des réprimandes pleines de fureur
  rationale: 'La formulation conserve les deux composantes de l’expression hébraïque : les réprimandes ou corrections, et la fureur qui les caractérise.'
- source_word: אֲנִי יְהוָה דִּבַּרְתִּי
  choice: Moi, Yahvé, j’ai parlé
  rationale: La tournure garde l’insistance du pronom initial, rend le nom divin comme nom propre et conserve la formule solennelle qui garantit l’oracle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur ; YHWH
  rationale: Le texte emploie directement le Tétragramme. « Yahvé » le rend comme nom propre en français courant, sans lui substituer un titre.
- issue: Portée de מוּסָר dans cette liste de jugements
  choice: un avertissement
  alternative: une instruction ; une discipline ; une correction
  rationale: Jérusalem devient, par le jugement qui la frappe, une leçon adressée aux nations voisines. « Avertissement » exprime cette portée exemplaire sans effacer les autres nuances, signalées en note.
- issue: Nuance de מְשַׁמָּה
  choice: un objet d’épouvante
  alternative: une dévastation ; un objet de stupeur
  rationale: Le contexte peut viser à la fois l’état dévasté de Jérusalem et l’effroi des témoins. La traduction privilégie ici la réaction des nations tout en préservant l’ambiguïté dans la note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le tutoiement maintient l’adresse directe à Jérusalem. Les répétitions de « fureur » et la succession des termes de jugement sont volontairement conservées pour respecter l’intensité de l’hébreu.
