id: EZK.5.14
reference: Ezekiel 5:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶתְּנֵ/ךְ֙ לְ/חָרְבָּ֣ה וּ/לְ/חֶרְפָּ֔ה בַּ/גּוֹיִ֖ם אֲשֶׁ֣ר סְבִיבוֹתָ֑יִ/ךְ לְ/עֵינֵ֖י כָּל עוֹבֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/014.yaml
  text: And I will make you a ruin and a reproach among the nations that are around you[b][a], in the sight of everyone who passes by.
translation:
  language: fr
  text: Je ferai de toi un lieu dévasté[a] et un objet de mépris[b] parmi les nations qui t’entourent, sous les yeux de tous les passants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une ruine ».
    reason: lexical_alternative
  - marker: b
    text: Ou « un sujet d’opprobre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶתְּנֵךְ
  choice: Je ferai de toi
  rationale: Dans cette construction avec לְ, le verbe נתן exprime le fait de mettre ou de rendre dans un certain état. « Je ferai de toi » restitue naturellement cette valeur en français.
- source_word: לְחָרְבָּה
  choice: un lieu dévasté
  rationale: חָרְבָּה désigne ici l’état d’un endroit ravagé et laissé en ruine. « Un lieu dévasté » convient à une ville personnifiée tout en restant clair en français moderne.
- source_word: וּלְחֶרְפָּה
  choice: et un objet de mépris
  rationale: חֶרְפָּה peut évoquer le déshonneur, l’opprobre ou les railleries subies. « Un objet de mépris » rend explicitement la manière dont les nations considéreront la ville sans restreindre le terme aux seules moqueries verbales.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: גּוֹיִם désigne ici les peuples environnants. « Nations » évite d’introduire une opposition théologique entre Juifs et non-Juifs qui n’est pas le point du passage.
- source_word: אֲשֶׁר סְבִיבוֹתָיִךְ
  choice: qui t’entourent
  rationale: Cette formulation française naturelle conserve la proposition relative et l’idée géographique des nations situées autour de Jérusalem.
- source_word: לְעֵינֵי
  choice: sous les yeux de
  rationale: L’expression hébraïque signifie littéralement « aux yeux de » et souligne le caractère public et visible du jugement. « Sous les yeux de » conserve cette image.
- source_word: כָּל עוֹבֵר
  choice: tous les passants
  rationale: Le participe עוֹבֵר désigne toute personne qui passe. Le pluriel générique « tous les passants » restitue avec concision la portée distributive de כָּל.
theological_decisions:
- issue: Personnification de Jérusalem par une adresse au féminin singulier
  choice: Maintien de l’adresse directe avec « toi » et « t’ », sans ajouter le nom de Jérusalem
  alternative: Rendre explicite le référent en ajoutant « Jérusalem »
  rationale: Les formes hébraïques au féminin singulier poursuivent la personnification prophétique de la ville. L’adresse pronominale préserve la force rhétorique du jugement divin et n’ajoute aucun nom absent du verset.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’adresse directe à la ville personnifiée ainsi que l’image visuelle du jugement exposé publiquement.
