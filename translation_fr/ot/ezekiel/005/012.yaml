revisions:
- from: Un tiers de tes habitants mourra de la peste et périra de faim au milieu de toi ; un tiers tombera sous l’épée tout autour de toi ; et le dernier tiers, je le disperserai à tous les vents[a], puis je dégainerai l’épée à leur poursuite[b].
  to: Un tiers de tes habitants mourront de la peste et seront consumés par la famine au milieu de toi ; un tiers tombera sous l’épée tout autour de toi ; et un tiers, je le disperserai à tous les vents[a], puis je dégainerai l’épée à leur poursuite[b].
  rationale: La révision retire l’ajout interprétatif « dernier » et rend explicitement le verbe de consommation associé à la famine. Elle maintient l’adresse féminine à la ville par « tes habitants » et « au milieu de toi », ainsi que la répétition rhétorique des trois tiers. Les ancres de notes correspondent bien aux expressions commentées.
