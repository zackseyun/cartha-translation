  variant: modern international French
source:
  edition: WLC
  text: שְׁלִשִׁתֵ֞/יךְ בַּ/דֶּ֣בֶר יָמ֗וּתוּ וּ/בָֽ/רָעָב֙ יִכְל֣וּ בְ/תוֹכֵ֔/ךְ וְ/הַ֨/שְּׁלִשִׁ֔ית בַּ/חֶ֖רֶב יִפְּל֣וּ סְבִיבוֹתָ֑יִ/ךְ וְ/הַ/שְּׁלִישִׁית֙ לְ/כָל ר֣וּחַ אֱזָרֶ֔ה וְ/חֶ֖רֶב אָרִ֥יק אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/012.yaml
  text: A third of you will die by pestilence and be consumed by famine in your midst[a], and a third will fall by the sword all around you, and a third I will scatter to every wind[b], and I will draw out a sword after them.
translation:
  language: fr
  text: Un tiers de tes habitants mourront de la peste et seront consumés par la famine au milieu de toi ; un tiers tombera sous l’épée tout autour de toi ; et un tiers, je le disperserai à tous les vents[a], puis je dégainerai l’épée à leur poursuite[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « vers tout vent » : expression signifiant dans toutes les directions.'
    reason: cultural_note
  - marker: b
    text: Littéralement « je tirerai l’épée derrière eux » ou « après eux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלִשִׁתֵיךְ / הַשְּׁלִשִׁית / הַשְּׁלִישִׁית
  choice: un tiers / le dernier tiers
  rationale: La triple division du jugement est conservée. « De tes habitants » explicite naturellement en français les personnes comprises dans la ville personnifiée, sans nommer Jérusalem dans le verset.
- source_word: דֶּבֶר
  choice: la peste
  rationale: Dans ce contexte de jugement prophétique, le terme désigne une épidémie meurtrière ; « peste » garde la force traditionnelle et concrète du mot sans le limiter nécessairement à une maladie précise.
- source_word: רָעָב
  choice: la faim
  rationale: Avec « périr de », « la faim » rend naturellement en français l’effet mortel de la famine. Le contexte évoque bien une situation de famine, non une simple sensation passagère.
- source_word: יִכְלוּ
  choice: périra
  rationale: Le verbe exprime le fait d’être entièrement anéanti ou consumé. « Périr » est idiomatique avec la faim et maintient la gravité de l’annonce.
- source_word: בְּתוֹכֵךְ
  choice: au milieu de toi
  rationale: Cette formulation maintient l’adresse directe à la ville personnifiée au féminin singulier.
- source_word: חֶרֶב
  choice: l’épée
  rationale: L’image concrète de l’épée, métonymie de la mort violente à la guerre, est conservée plutôt que remplacée par le terme abstrait « guerre ».
- source_word: יִפְּלוּ
  choice: tombera
  rationale: « Tomber sous l’épée » est une tournure française claire qui préserve l’image du texte hébreu.
- source_word: סְבִיבוֹתָיִךְ
  choice: tout autour de toi
  rationale: Le pluriel hébreu renforce l’idée d’un encerclement de tous côtés, bien rendue par « tout autour ».
- source_word: לְכָל רוּחַ
  choice: à tous les vents
  rationale: L’image hébraïque est intelligible en français et signifie une dispersion dans toutes les directions ; elle est conservée et expliquée en note.
- source_word: אֱזָרֶה
  choice: je le disperserai
  rationale: Le verbe peut évoquer le vannage, mais son sens contextuel principal est la dispersion. Le pronom singulier reprend collectivement « le dernier tiers ».
- source_word: אָרִיק
  choice: je dégainerai
  rationale: Associé à « l’épée », le verbe forme une expression signifiant tirer l’arme de son fourreau. « Dégainer » est précis, actuel et vigoureux.
- source_word: אַחֲרֵיהֶם
  choice: à leur poursuite
  rationale: Littéralement « derrière eux » ou « après eux » ; dans ce contexte, la formule exprime une poursuite hostile. La note conserve la formulation plus littérale.
theological_decisions:
- issue: Destinataire personnifié et objet du jugement
  choice: Maintenir la deuxième personne du féminin singulier en parlant à la ville comme à une personne.
  alternative: Nommer explicitement Jérusalem dans le verset.
  rationale: Les suffixes hébreux s’adressent directement à la ville personnifiée. Ajouter son nom réduirait l’effet rhétorique et introduirait un élément absent de ce verset.
- issue: Imagerie concrète du jugement
  choice: Conserver « la peste », « l’épée » et « à tous les vents ».
  alternative: Employer des abstractions comme « maladie », « guerre » et « dans toutes les directions ».
  rationale: Les images prophétiques sont compréhensibles en français et portent une force rhétorique et théologique qu’une paraphrase abstraite atténuerait.
- issue: Sens de l’épée tirée après les dispersés
  choice: 'Rendre l’action comme une poursuite armée : « je dégainerai l’épée à leur poursuite ».'
  alternative: Traduire formellement « je tirerai l’épée derrière eux » ou « après eux ».
  rationale: L’hébreu décrit l’épée tirée « après eux ». La traduction principale exprime le sens contextuel sans préciser davantage la manière dont le jugement s’accomplira ; la note préserve la forme littérale.
translation_notes:
  register: Français international moderne, digne et prophétique. La ponctuation en trois membres fait ressortir la structure répétée du jugement. Le tutoiement maintient l’adresse directe à la ville personnifiée ; « tes habitants » évite l’expression peu naturelle « un tiers de toi » tout en conservant le référent humain implicite.
