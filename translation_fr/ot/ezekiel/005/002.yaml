    issue: Nuances ajoutées dans « un autre tiers » et « le dernier tiers ».
    rationale: Le texte hébreu répète simplement « un tiers / le tiers ». Employer trois fois « un tiers » préserve plus exactement le parallélisme sans suggérer une catégorisation supplémentaire.
  - severity: medium
    issue: La note c propose « derrière eux ».
    rationale: En français, « tirer l’épée derrière eux » est ambigu et ne communique pas naturellement l’idée d’une épée tirée en poursuite hostile. Une formulation avec « à leur poursuite » est plus exacte et idiomatique.
