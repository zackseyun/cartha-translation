base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/002.yaml
  text: A third you shall burn in the fire in the midst of the city[a], when the days of the siege are completed; and you shall take a third and strike it with the sword all around the city, and a third you shall scatter to the wind[c][b], and I will draw out a sword after them.
translation:
  language: fr
  text: Tu en brûleras un tiers dans le feu, au milieu de la ville, lorsque les jours du siège seront achevés[a]. Tu prendras un tiers et tu le frapperas avec l’épée tout autour de la ville. Tu disperseras un tiers au vent[b], et moi, je dégainerai l’épée à leur poursuite[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lorsque les jours du siège seront accomplis ».'
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire : « aux vents » ; l’hébreu emploie le singulier.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « je tirerai l’épée à leur poursuite ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלִשִׁית / הַשְּׁלִשִׁית
  choice: un tiers / un autre tiers / le dernier tiers
  rationale: Le terme désigne chacune des trois portions de cheveux. Cette variation légère est naturelle en français tout en maintenant clairement la structure tripartite.
- source_word: בָּאוּר תַּבְעִיר
  choice: tu en brûleras ... dans le feu
  rationale: Le hiphil de בער exprime l’action de faire brûler. « Brûler dans le feu » conserve explicitement le complément hébreu sans alourdir la phrase.
- source_word: בְּתוֹךְ הָעִיר
  choice: au milieu de la ville
  rationale: Cette formulation restitue l’image spatiale précise de תוך plutôt que le sens plus général de « dans la ville ».
- source_word: כִּמְלֹאת יְמֵי הַמָּצוֹר
  choice: lorsque les jours du siège seront achevés
  rationale: L’infinitif construit précédé de כ marque ici le moment où la période du siège arrive à son terme.
- source_word: תַּכֶּה בַחֶרֶב
  choice: tu le frapperas avec l’épée
  rationale: « Frapper avec l’épée » rend directement l’action violente et la valeur instrumentale de la préposition ב.
- source_word: סְבִיבוֹתֶיהָ
  choice: tout autour de la ville
  rationale: Le suffixe féminin renvoie à la ville. La répétition explicite évite en français toute ambiguïté sur le référent.
- source_word: תִּזְרֶה לָרוּחַ
  choice: tu disperseras ... au vent
  rationale: זרה évoque la dispersion, voire le vannage. « Disperser au vent » est clair et conserve le singulier de רוּחַ.
- source_word: וְחֶרֶב אָרִיק אַחֲרֵיהֶם
  choice: et moi, je dégainerai l’épée à leur poursuite
  rationale: Le verbe à la première personne marque l’intervention directe de Dieu. « Dégainer » exprime idiomatiquement l’action de tirer l’épée, tandis que « à leur poursuite » préserve la force hostile et poursuivante de אַחֲרֵיהֶם.
theological_decisions:
- issue: Changement de locuteur dans la dernière proposition
  choice: 'Conserver la première personne divine : « et moi, je dégainerai l’épée à leur poursuite »'
  alternative: Transformer la proposition en annonce impersonnelle du jugement
  rationale: Le verbe אָרִיק est à la première personne du singulier. Le passage des ordres adressés à Ézéchiel à l’action directe de Dieu fait partie du sens théologique du geste prophétique et ne doit pas être aplani.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur conserve la force prescriptive et prophétique des formes hébraïques. « Et moi » met naturellement en relief le passage soudain à la parole divine sans ajouter d’explication au texte.
