  to: Tu en brûleras un tiers dans le feu, au milieu de la ville, lorsque les jours du siège seront achevés[a]. Tu prendras un tiers et tu le frapperas avec l’épée tout autour de la ville. Tu disperseras un tiers au vent[b], et moi, je dégainerai l’épée à leur poursuite[c].
