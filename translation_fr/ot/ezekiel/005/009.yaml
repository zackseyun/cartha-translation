source:
  edition: WLC
  text: וְ/עָשִׂ֣יתִי בָ֗/ךְ אֵ֚ת אֲשֶׁ֣ר לֹֽא עָשִׂ֔יתִי וְ/אֵ֛ת אֲשֶֽׁר לֹֽא אֶעֱשֶׂ֥ה כָמֹ֖/הוּ ע֑וֹד יַ֖עַן כָּל תּוֹעֲבֹתָֽיִ/ךְ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/009.yaml
  text: And I will do in you what I have not done[a], and the like of which I will never do again, because of all your abominations.
translation:
  language: fr
  text: Je ferai en toi[a] ce que je n’ai jamais fait, et jamais plus je ne ferai rien de semblable, à cause de toutes tes abominations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre toi » ou « à ton égard ». La préposition hébraïque signifie littéralement « en » ou « dans », mais elle peut être rendue de manière plus interprétative dans ce contexte de jugement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתִי
  choice: Je ferai
  rationale: Le verbe עשה a le sens large de « faire ». Cette formulation conserve la force abrupte de l’annonce sans préciser au-delà de l’hébreu la nature de l’action.
- source_word: בָךְ
  choice: en toi
  rationale: La préposition ב signifie ici littéralement « en » ou « dans ». Jérusalem étant interpellée comme une personne, « en toi » conserve l’image d’un jugement accompli à l’intérieur de la ville.
- source_word: אֵת אֲשֶׁר לֹא עָשִׂיתִי
  choice: ce que je n’ai jamais fait
  rationale: Le parfait nie toute action comparable dans le passé. En français courant, « jamais » exprime naturellement cette absence de précédent sans affaiblir la portée absolue de l’énoncé.
- source_word: וְאֵת אֲשֶׁר לֹא אֶעֱשֶׂה כָמֹהוּ עוֹד
  choice: et jamais plus je ne ferai rien de semblable
  rationale: 'Cette formulation rend ensemble la négation future, la comparaison כָמֹהוּ et עוֹד : aucun acte semblable ne se reproduira.'
- source_word: יַעַן
  choice: à cause de
  rationale: יַעַן introduit le motif du jugement et se construit naturellement avec le groupe nominal qui suit.
- source_word: כָל תּוֹעֲבֹתָיִךְ
  choice: toutes tes abominations
  rationale: « Abominations » garde le poids prophétique de תּוֹעֵבָה, qui désigne des actes ou pratiques profondément odieux, notamment dans le domaine de l’idolâtrie.
theological_decisions:
- issue: Caractère sans précédent du jugement
  choice: 'Conserver l’affirmation absolue : Dieu n’a jamais rien fait de tel et ne fera jamais plus rien de semblable.'
  alternative: Paraphraser simplement comme un jugement d’une sévérité exceptionnelle.
  rationale: Le texte insiste explicitement sur l’absence de précédent et de répétition future ; il ne faut pas réduire cette tension rhétorique à une simple indication d’intensité.
- issue: Portée de בָךְ dans l’action divine
  choice: Traduire par « en toi ».
  alternative: « contre toi » ou « à ton égard »
  rationale: L’hébreu n’impose pas une valeur hostile explicite de la préposition. « En toi » maintient l’image du jugement qui se déroule au sein de Jérusalem, tandis que la note signale les lectures contextuelles possibles.
translation_notes:
  register: Français moderne, digne et direct. La tournure « en toi » est volontairement plus proche de l’image hébraïque ; « jamais plus je ne ferai rien de semblable » clarifie naturellement en français la construction comparative de la seconde proposition.
