    reason: clarification_du_référent_implicite
  revision_rationale: La révision supprime l’action ajoutée « pèse », rétablit les balances comme objet de l’impératif, conserve leur pluriel et explicite prudemment le référent implicite du pronom final. Le geste symbolique demeure non interprété.
