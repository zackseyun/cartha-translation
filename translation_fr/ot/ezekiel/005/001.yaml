  text: וְ/אַתָּ֨ה בֶן אָדָ֜ם קַח לְ/ךָ֣ חֶ֣רֶב חַדָּ֗ה תַּ֤עַר הַ/גַּלָּבִים֙ תִּקָּחֶ֣/נָּה לָּ֔/ךְ וְ/הַעֲבַרְתָּ֥ עַל רֹאשְׁ/ךָ֖ וְ/עַל זְקָנֶ֑/ךָ וְ/לָקַחְתָּ֥ לְ/ךָ֛ מֹאזְנֵ֥י מִשְׁקָ֖ל וְ/חִלַּקְתָּֽ/ם־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/001.yaml
  text: And you[a], son of man, take for yourself a sharp sword; take it as a barber’s razor, and pass it over your head and over your beard[b]. Then take for yourself scales for weighing and divide the hair.
translation:
  language: fr
  text: Et toi, fils d’homme, prends une épée bien aiguisée. Prends-la pour t’en servir comme d’un rasoir de barbier, et passe-la sur ta tête et sur ta barbe. Puis prends pour toi des balances de pesée et répartis les poils.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « prends pour toi des balances de pesée et répartis-les » ; le pronom « les » désigne les poils qui viennent d’être rasés.'
    reason: clarification_du_référent_implicite
lexical_decisions:
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: Conserve la formule d’adresse caractéristique d’Ézéchiel et suit de près l’expression hébraïque, dans une forme française familière aux lecteurs de la Bible.
- source_word: חֶרֶב חַדָּה
  choice: une épée bien aiguisée
  rationale: Rend directement le nom חֶרֶב et la qualité exprimée par חַדָּה; « bien aiguisée » est naturel en français pour une lame destinée ici à raser.
- source_word: תַּעַר הַגַּלָּבִים
  choice: un rasoir de barbier
  rationale: Rend naturellement le syntagme construit hébreu et conserve l’image concrète de l’instrument du barbier.
- source_word: תִּקָּחֶנָּה לָּךְ
  choice: prends-la pour t’en servir comme
  rationale: Préserve la répétition de לקח tout en explicitant en français la fonction que l’épée doit remplir comme rasoir.
- source_word: וְהַעֲבַרְתָּ עַל רֹאשְׁךָ וְעַל זְקָנֶךָ
  choice: passe-la sur ta tête et sur ta barbe
  rationale: Représente le verbe explicite « faire passer » et sa construction avec עַל, sans ajouter directement « rase », que l’image du rasoir implique déjà.
- source_word: מֹאזְנֵי מִשְׁקָל
  choice: une balance
  rationale: L’expression désigne une balance servant à peser. Le singulier collectif est la formulation française courante et concrète.
- source_word: וְחִלַּקְתָּם
  choice: pèse les poils pour les répartir
  rationale: Le suffixe pluriel renvoie implicitement aux poils issus du rasage. La pesée indiquée par מֹאזְנֵי מִשְׁקָל sert à leur répartition; cette formulation clarifie le référent et le lien entre les deux actes sans modifier l’action.
