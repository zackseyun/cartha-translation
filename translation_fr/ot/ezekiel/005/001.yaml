revisions:
- from: Et toi, fils d’homme, prends une épée bien aiguisée. Prends-la pour t’en servir comme d’un rasoir de barbier, et passe-la sur ta tête et sur ta barbe. Puis prends une balance et pèse les poils pour les répartir.[a]
  to: Et toi, fils d’homme, prends une épée bien aiguisée. Prends-la pour t’en servir comme d’un rasoir de barbier, et passe-la sur ta tête et sur ta barbe. Puis prends pour toi des balances de pesée et répartis les poils.[a]
  rationale: La révision supprime l’action ajoutée « pèse », rétablit les balances comme objet de l’impératif, conserve leur pluriel et explicite prudemment le référent implicite du pronom final. Le geste symbolique demeure non interprété.
