source:
  edition: WLC
  text: וְ/כָלָ֣ה אַפִּ֗/י וַ/הֲנִחוֹתִ֧י חֲמָתִ֛/י בָּ֖/ם וְ/הִנֶּחָ֑מְתִּי וְֽ/יָדְע֞וּ כִּי אֲנִ֣י יְהוָ֗ה דִּבַּ֨רְתִּי֙ בְּ/קִנְאָתִ֔/י בְּ/כַלּוֹתִ֥/י חֲמָתִ֖/י בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/013.yaml
  text: So my anger will be spent[a], and I will cause my wrath to rest on them, and I will be comforted. Then they will know that I, Yahweh, have spoken in my jealousy[b], when I spend my wrath against them.
translation:
  language: fr
  text: Ainsi, ma colère ira jusqu’au bout, je ferai reposer ma fureur sur eux et je trouverai l’apaisement[a]. Alors ils sauront que moi, Yahweh, j’ai parlé dans ma jalousie[b], lorsque j’aurai épuisé ma fureur contre eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je serai consolé ». Le verbe hébreu peut évoquer le réconfort ou le soulagement trouvé lorsque le jugement est achevé.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans mon zèle ». Le terme hébreu peut exprimer la jalousie ou le zèle ; « jalousie » conserve ici sa force relationnelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָלָה אַפִּי
  choice: ma colère ira jusqu’au bout
  rationale: L’expression indique que la colère accomplit entièrement son cours. Cette formulation française conserve l’idée d’achèvement sans suggérer qu’elle s’affaiblit d’elle-même.
- source_word: וַהֲנִחוֹתִי חֲמָתִי בָּם
  choice: je ferai reposer ma fureur sur eux
  rationale: Le hifil de נוח signifie ici faire reposer ou déposer la fureur sur sa cible. La traduction suit de près l’image hébraïque et maintient בם comme désignant ceux sur qui tombe le jugement.
- source_word: וְהִנֶּחָמְתִּי
  choice: je trouverai l’apaisement
  rationale: Le nifal de נחם peut exprimer le réconfort ou le soulagement obtenu une fois le jugement mené à terme. « Trouver l’apaisement » est naturel en français tout en laissant subsister la force affective du texte.
- source_word: וְיָדְעוּ
  choice: Alors ils sauront
  rationale: « Alors » rend naturellement la conséquence temporelle et logique de la séquence hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: בְּקִנְאָתִי
  choice: dans ma jalousie
  rationale: קנאה peut signifier jalousie ou zèle. « Jalousie » préserve ici la dimension relationnelle et exigeante de la fidélité divine.
- source_word: בְּכַלּוֹתִי חֲמָתִי בָּם
  choice: lorsque j’aurai déversé sur eux toute ma fureur
  rationale: L’infinitif de כלה exprime l’achèvement. La formulation française indique que la fureur est exercée jusqu’au bout et reprend clairement l’idée du début du verset.
theological_decisions:
- issue: Langage affectif appliqué au jugement divin
  choice: Conserver directement « colère », « fureur », « jalousie » et « je trouverai l’apaisement ».
  alternative: Remplacer ces termes par des abstractions comme « indignation », « justice accomplie » ou « satisfaction judiciaire ».
  rationale: L’hébreu décrit explicitement le jugement de Dieu au moyen d’un langage affectif. Le garder préserve la vigueur prophétique et la tension théologique au lieu de l’expliquer ou de l’atténuer.
- issue: Sens de וְהִנֶּחָמְתִּי après l’exécution du jugement
  choice: je trouverai l’apaisement
  alternative: je serai consolé ; je serai satisfait ; je renoncerai
  rationale: Le contexte ne décrit pas l’abandon du jugement, mais l’apaisement qui suit son plein accomplissement. « Je renoncerai » contredirait la progression du verset, tandis que « je serai satisfait » expliciterait davantage que l’hébreu.
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: « Yahweh » rend le nom propre dans le corps du texte et distingue clairement celui-ci d’un titre.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre la colère qui va jusqu’au bout et la fureur entièrement déversée est conservé sans calque maladroit. Les deux notes signalent les principales ambiguïtés lexicales réelles.
