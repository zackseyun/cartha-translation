  text: וְ/שִׁלַּחְתִּ֣י עֲ֠לֵי/כֶם רָעָ֞ב וְ/חַיָּ֤ה רָעָה֙ וְ/שִׁכְּלֻ֔/ךְ וְ/דֶ֥בֶר וָ/דָ֖ם יַעֲבָר בָּ֑/ךְ וְ/חֶ֨רֶב֙ אָבִ֣יא עָלַ֔יִ/ךְ אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/017.yaml
  text: And I will send famine and wild beasts against you[a], and they will bereave you; and pestilence and bloodshed will pass through you, and I will bring a sword upon you. I, Yahweh[d][c][b], have spoken.
translation:
  language: fr
  text: J’enverrai contre vous la famine et des bêtes féroces[a], qui te priveront de tes enfants[b]. La peste et le sang versé[c] passeront au milieu de toi, et je ferai venir l’épée contre toi. Moi, Yahweh, j’ai parlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des bêtes mauvaises » ; on peut aussi traduire : « des animaux sauvages ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui te laisseront dans le deuil » ou « qui te rendront sans enfants ». Le verbe hébreu évoque habituellement la perte d’enfants.'
    reason: lexical_alternative
  - marker: c
    text: 'Hébreu : « le sang » ; dans ce contexte, il s’agit probablement de sang versé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי עֲלֵיכֶם
  choice: J’enverrai contre vous
  rationale: Le piel exprime l’action directe de Dieu, et la préposition prend ici une valeur hostile. Le pluriel « vous » respecte la forme hébraïque initiale.
- source_word: רָעָב
  choice: la famine
  rationale: Dans cette liste de jugements, le nom désigne une famine collective, non la simple sensation de faim.
- source_word: וְחַיָּה רָעָה
  choice: et des bêtes féroces
  rationale: Littéralement « une bête mauvaise ». « Bêtes féroces » rend naturellement la menace d’animaux dangereux sans leur attribuer une qualité morale.
- source_word: וְשִׁכְּלֻךְ
  choice: qui vous priveront de vos enfants
  rationale: Le verbe piel signifie couramment causer la perte d’enfants ou rendre sans enfants. Cette formulation rend ce contenu lexical implicite tout en signalant l’autre possibilité en note.
- source_word: וְדֶבֶר
  choice: La peste
  rationale: Le terme désigne une épidémie meurtrière dans les séries prophétiques de jugements.
- source_word: וָדָם
  choice: et le sang versé
  rationale: Le mot signifie littéralement « sang », mais désigne vraisemblablement ici l’effusion de sang. « Sang versé » conserve l’image concrète hébraïque.
- source_word: יַעֲבָר בָּךְ
  choice: passeront au milieu de toi
  rationale: La forme est au singulier féminin et s’adresse à Jérusalem personnifiée. Le français emploie naturellement le pluriel avec les deux sujets coordonnés tout en conservant le passage du pluriel « vous » au singulier « toi » présent dans l’hébreu.
- source_word: וְחֶרֶב אָבִיא עָלַיִךְ
  choice: et je ferai venir l’épée contre toi
  rationale: Le concret « épée » est conservé plutôt que généralisé en « guerre »; « contre toi » exprime la valeur hostile de la préposition.
- source_word: אֲנִי יְהוָה דִּבַּרְתִּי
  choice: Moi, Yahweh, j’ai parlé
  rationale: Le pronom indépendant marque l’insistance, le nom divin est translittéré, et le parfait conclut solennellement l’oracle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le caractère personnel du nom d’alliance sans adopter une substitution confessionnelle.
- issue: Portée de שׁכל
  choice: vous priveront de vos enfants
  alternative: vous laisseront dans le deuil / vous rendront sans enfants
  rationale: Le verbe évoque spécifiquement la perte de descendants, mais aucun complément « enfants » n’est exprimé séparément en hébreu. La traduction explicite son sens lexical, et la note préserve une formulation moins explicite.
- issue: Sens de דָם dans la série de jugements
  choice: le sang versé
  alternative: le sang
  rationale: Le contexte favorise l’idée d’effusion de sang, mais l’image littérale du sang reste visible dans la formulation retenue.
- issue: Variation entre destinataires pluriel et singulier
  choice: conserver « vous », puis « toi »
  alternative: uniformiser entièrement au singulier ou au pluriel
  rationale: L’hébreu passe de עֲלֵיכֶם, deuxième personne masculine plurielle, à des suffixes féminins singuliers visant vraisemblablement Jérusalem personnifiée. Conserver ce déplacement respecte une tension réelle du texte.
translation_notes:
  register: Français international moderne, sobre et prophétique. La syntaxe garde le rythme accumulatif des jugements et la formule finale solennelle. Le passage délibéré de « vous » à « toi » reproduit le changement de nombre et de genre du texte hébreu plutôt que de l’harmoniser.
