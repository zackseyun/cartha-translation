revisions:
- from: Elle s’est révoltée contre mes règles avec plus de méchanceté que les nations[a], et contre mes prescriptions plus que les pays qui l’entourent. En effet, ses habitants ont rejeté mes règles et n’ont pas vécu selon mes prescriptions[b].
  to: Elle s’est révoltée contre mes ordonnances en faisant le mal, plus que les nations[a] ; elle s’est révoltée contre mes prescriptions plus que les pays qui l’entourent. En effet, ses habitants ont rejeté mes ordonnances et n’ont pas vécu selon mes prescriptions[b].
  rationale: La révision resserre le lien entre la qualification « en faisant le mal » et l’action de Jérusalem, adopte un terme juridique plus approprié pour מִשְׁפָּטַי, et explicite le verbe dans le parallélisme. Les notes gardent l’alternative lexicale sans la présenter comme certaine, et leurs ancres restent correctement placées.
