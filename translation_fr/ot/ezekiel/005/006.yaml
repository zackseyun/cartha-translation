  text: וַ/תֶּ֨מֶר אֶת מִשְׁפָּטַ֤/י לְ/רִשְׁעָה֙ מִן הַ/גּוֹיִ֔ם וְ/אֶ֨ת חֻקּוֹתַ֔/י מִן הָ/אֲרָצ֖וֹת אֲשֶׁ֣ר סְבִיבוֹתֶ֑י/הָ כִּ֤י בְ/מִשְׁפָּטַ/י֙ מָאָ֔סוּ וְ/חֻקּוֹתַ֖/י לֹא הָלְכ֥וּ בָ/הֶֽם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/006.yaml
  text: And she rebelled against my judgments with wickedness more than the nations[a], and against my statutes more than the lands that are around her; for they rejected my judgments[b], and they did not walk in my statutes.
translation:
  language: fr
  text: Elle s’est révoltée contre mes ordonnances en faisant le mal, plus que les nations[a] ; elle s’est révoltée contre mes prescriptions plus que les pays qui l’entourent. En effet, ses habitants ont rejeté mes ordonnances et n’ont pas vécu selon mes prescriptions[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Elle a changé mes ordonnances en méchanceté, plus que les nations. » Le verbe hébreu peut être compris comme une rébellion ou comme une altération de ce que Dieu avait donné.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « n’ont pas marché dans mes prescriptions ». En hébreu, « marcher » ainsi signifie régler sa conduite sur elles.'
    reason: cultural_note
lexical_decisions:
- source_word: וַתֶּמֶר
  choice: elle s’est révoltée
  rationale: Le verbe מרה exprime ici la rébellion ou la désobéissance à l’autorité divine. Le féminin singulier conserve la personnification prophétique de Jérusalem. Une autre analyse possible, signalée en note, comprend le verbe au sens de « changer » ou « altérer ».
- source_word: מִשְׁפָּטַי
  choice: mes règles
  rationale: מִשְׁפָּטִים désigne ici les règles établies par Dieu dans un cadre juridique et d’alliance. « Règles » est clair en français moderne et reste distinct de חֻקּוֹתַי.
- source_word: לְרִשְׁעָה מִן־הַגּוֹיִם
  choice: avec plus de méchanceté que les nations
  rationale: Cette formulation rend naturellement le nom רִשְׁעָה et la valeur comparative de מִן, en attribuant à la révolte de Jérusalem une méchanceté supérieure à celle des nations.
- source_word: חֻקּוֹתַי
  choice: mes prescriptions
  rationale: « Prescriptions » conserve le registre normatif de חֻקִּים et la distinction lexicale avec מִשְׁפָּטִים.
- source_word: מִן הָאֲרָצוֹת אֲשֶׁר סְבִיבוֹתֶיהָ
  choice: plus que les pays qui l’entourent
  rationale: מִן a une valeur comparative parallèle à la proposition précédente. « Pays » exprime ici naturellement les territoires environnants sans évoquer nécessairement l’État-nation moderne.
- source_word: מָאָסוּ
  choice: ont rejeté
  rationale: מָאַס exprime un refus marqué, parfois teinté de mépris. « Rejeter » rend clairement l’acte de refus sans exagérer sa composante affective.
- source_word: לֹא הָלְכוּ בָהֶם
  choice: n’ont pas vécu selon mes prescriptions
  rationale: Littéralement « n’ont pas marché en elles », cette expression hébraïque décrit une conduite réglée par les prescriptions. « Vivre selon » restitue l’image dans un français naturel.
theological_decisions:
- issue: Personnification féminine de Jérusalem
  choice: Conserver « elle » dans la première proposition.
  alternative: Nommer explicitement Jérusalem ou employer une tournure impersonnelle.
  rationale: Le verbe hébreu est au féminin singulier et personnifie la ville. Le pronom français préserve cette force littéraire.
- issue: Passage du féminin singulier au pluriel
  choice: Rendre le pluriel hébreu par « ses habitants » dans l’explication.
  alternative: Employer simplement « ils », au risque de faire croire que le pronom renvoie aux nations ou aux pays.
  rationale: Le texte passe de la ville personnifiée au peuple qui la compose. L’explicitation minimale évite une fausse référence grammaticale sans modifier l’accusation.
- issue: Distinction entre les deux termes juridiques
  choice: Traduire מִשְׁפָּטַי par « mes règles » et חֻקּוֹתַי par « mes prescriptions ».
  alternative: Traduire les deux termes par « lois ».
  rationale: Le parallélisme hébreu emploie deux termes distincts. Les différencier conserve la texture juridique du reproche sans leur attribuer artificiellement des catégories théologiques rigides.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe comparative a été rendue de façon idiomatique. « Ses habitants » explicite discrètement le pluriel hébreu après la personnification féminine de la ville, afin d’éviter que « ils » soit rattaché à tort aux nations ou aux pays.
