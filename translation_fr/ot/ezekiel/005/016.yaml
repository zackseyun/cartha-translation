  variant: modern international French
source:
  edition: WLC
  text: בְּֽ/שַׁלְּחִ֡/י אֶת חִצֵּי֩ הָ/רָעָ֨ב הָ/רָעִ֤ים בָּ/הֶם֙ אֲשֶׁ֣ר הָי֣וּ לְ/מַשְׁחִ֔ית אֲשֶׁר אֲשַׁלַּ֥ח אוֹתָ֖/ם לְ/שַֽׁחֶתְ/כֶ֑ם וְ/רָעָב֙ אֹסֵ֣ף עֲלֵי/כֶ֔ם וְ/שָׁבַרְתִּ֥י לָ/כֶ֖ם מַטֵּה לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/016.yaml
  text: When I send against them the deadly arrows of famine[a], which are for destruction, which I will send to destroy you[b], then I will add famine upon you and break for you the staff of bread.
translation:
  language: fr
  text: Quand j’enverrai contre eux les flèches funestes de la famine[a], destinées à détruire, que j’enverrai pour vous détruire, j’intensifierai la famine contre vous et je briserai pour vous le bâton du pain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les flèches désastreuses de la famine ».
    reason: lexical_alternative
  - marker: b
    text: Expression hébraïque désignant le soutien ou l’approvisionnement en pain, c’est-à-dire en nourriture.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׁלְּחִי
  choice: Quand j’enverrai
  rationale: La préposition בְּ avec l’infinitif construit introduit une proposition temporelle; le futur français convient à cette annonce de jugement.
- source_word: חִצֵּי הָרָעָב הָרָעִים
  choice: les flèches funestes de la famine
  rationale: Cette formulation conserve la métaphore des flèches et rend רָעִים par « funestes », qui exprime ici leur effet calamiteux sans leur attribuer une qualité morale.
- source_word: בָּהֶם
  choice: contre eux
  rationale: Dans le contexte de l’envoi de flèches, la préposition indique naturellement leur cible.
- source_word: לְמַשְׁחִית
  choice: destinées à détruire
  rationale: Cette tournure rend la valeur de but ou de résultat du terme מַשְׁחִית et s’intègre naturellement à la syntaxe française.
- source_word: לְשַׁחֶתְכֶם
  choice: pour vous détruire
  rationale: L’infinitif avec suffixe de deuxième personne du pluriel exprime directement le but de l’envoi.
- source_word: וְרָעָב אֹסֵף עֲלֵיכֶם
  choice: j’aggraverai encore la famine qui vous frappe
  rationale: Le hiphil de אָסַף signifie ici ajouter ou augmenter. Cette formulation française exprime l’intensification ainsi que la portée hostile de עֲלֵיכֶם.
- source_word: וְשָׁבַרְתִּי לָכֶם מַטֵּה לָחֶם
  choice: je briserai pour vous le bâton du pain
  rationale: Le texte principal conserve l’image hébraïque du bâton comme soutien, tandis qu’une note en explique le sens idiomatique.
theological_decisions:
- issue: Action divine dans le jugement
  choice: 'Conserver les verbes à la première personne : « j’enverrai », « j’aggraverai », « je briserai ».'
  alternative: Employer des formulations impersonnelles où la famine survient d’elle-même.
  rationale: L’hébreu attribue explicitement et à plusieurs reprises ce jugement à Dieu; la traduction ne doit pas en atténuer l’agentivité.
- issue: Métaphores du jugement et de la subsistance
  choice: Maintenir « les flèches… de la famine » et « le bâton du pain » dans le texte.
  alternative: Interpréter directement par « famine mortelle » et « réserves de nourriture ».
  rationale: Les images structurent l’oracle. La seconde étant moins transparente en français, une note en donne le sens sans effacer la métaphore.
translation_notes:
  register: Français international moderne, solennel mais accessible. La répétition de « quand je les enverrai » est maintenue parce qu’elle reflète l’insistance de l’hébreu. « Funestes » préserve la gravité poétique de l’oracle; « bâton du pain » conserve l’image source et reçoit une explication en note.
