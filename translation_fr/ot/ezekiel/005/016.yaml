  verdict: revise
  source_fidelity: 'La reprise « quand je les enverrai » ne rend pas correctement le second relatif אֲשֶׁר אֲשַׁלַּח (« que j’enverrai »). Le texte hébreu enchaîne les relatives décrivant les flèches : elles sont vouées à la destruction et Dieu les enverra pour détruire les destinataires. La révision conserve aussi l’addition/intensification de la famine et l’image du « bâton du pain ».'
  naturalness: La phrase révisée reste solennelle et lisible en français international moderne. « J’intensifierai la famine contre vous » est plus proche de l’image hostile de עֲלֵיכֶם que « la famine qui vous frappe », tout en évitant une paraphrase excessive.
  terminology: « Flèches funestes de la famine » rend naturellement l’adjectif calamiteux sans lui donner un sens moral. « Bâton du pain » maintient délibérément la métaphore hébraïque ; la note explique l’idiome de manière plus précise.
