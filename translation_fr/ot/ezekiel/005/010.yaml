  text: לָ/כֵ֗ן אָב֞וֹת יֹאכְל֤וּ בָנִים֙ בְּ/תוֹכֵ֔/ךְ וּ/בָנִ֖ים יֹאכְל֣וּ אֲבוֹתָ֑/ם וְ/עָשִׂ֤יתִי בָ/ךְ֙ שְׁפָטִ֔ים וְ/זֵרִיתִ֥י אֶת כָּל שְׁאֵרִיתֵ֖/ךְ לְ/כָל רֽוּחַ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/010.yaml
  text: Therefore fathers will eat sons in your midst[a], and sons will eat their fathers[b]; and I will execute judgments on you and scatter all your remnant to every wind.
translation:
  language: fr
  text: C’est pourquoi, au milieu de toi, des pères mangeront leurs fils, et des fils mangeront leurs pères. J’exécuterai mes jugements contre toi et je disperserai tout ce qui reste de toi[a] à tous les vents[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous tes survivants » ou « tout ton reste ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « à tout vent » : image d’une dispersion complète dans toutes les directions.'
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence directe de l’accusation et de l’annonce de jugement précédentes.
- source_word: אָבוֹת ... בָנִים
  choice: des pères ... leurs fils
  rationale: Conserve les termes masculins précis de l’hébreu et l’horreur du renversement des liens familiaux; le possessif, implicite dans le rapport familial, rend la phrase idiomatique en français.
- source_word: בְּתוֹכֵךְ
  choice: au milieu de toi
  rationale: Reproduit l’adresse à la ville au féminin singulier et situe ces actes en son sein.
- source_word: יֹאכְלוּ
  choice: mangeront
  rationale: Rend le verbe ordinaire « manger » sans atténuer ni amplifier sa portée; le contexte de famine indique le cannibalisme.
- source_word: וְעָשִׂיתִי בָךְ שְׁפָטִים
  choice: J’exécuterai mes jugements contre toi
  rationale: Préserve la tonalité judiciaire de l’expression hébraïque tout en exprimant clairement que ces jugements frappent la ville.
- source_word: וְזֵרִיתִי
  choice: je disperserai
  rationale: Exprime clairement la dispersion liée au jugement et à l’exil.
- source_word: כָּל שְׁאֵרִיתֵךְ
  choice: tout ce qui restera de toi
  rationale: Rend שְׁאֵרִית dans un français naturel sans lui imposer ici une connotation positive de restauration.
- source_word: לְכָל רוּחַ
  choice: à tous les vents
  rationale: Conserve l’image hébraïque de la dispersion complète, sous une forme idiomatique en français.
theological_decisions:
- issue: Portée de שְׁאֵרִית dans ce contexte de jugement
  choice: tout ce qui restera de toi
  alternative: tout ton reste; tous tes survivants
  rationale: Le terme peut ailleurs évoquer un « reste » porteur d’espérance, mais le présent verset annonce sa dispersion punitive. La formulation retenue préserve l’idée de ce qui subsiste sans introduire une promesse absente du texte.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe garde l’adresse directe à Jérusalem au féminin singulier. Les répétitions familiales et judiciaires sont conservées afin de ne pas atténuer la violence du jugement annoncé.
