  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֥י עָלַ֖יִ/ךְ גַּם אָ֑נִי וְ/עָשִׂ֧יתִי בְ/תוֹכֵ֛/ךְ מִשְׁפָּטִ֖ים לְ/עֵינֵ֥י הַ/גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/008.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I myself am against you, and I will execute judgments in your midst before the eyes of the nations.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit le Seigneur Yahweh[a] : « Voici, moi aussi, je suis contre toi, et j’exécuterai des jugements au milieu de toi, sous les yeux des nations. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « le Seigneur YHWH » ; YHWH est ici transcrit « Yahweh ». Certaines traductions rendent traditionnellement ce titre par « le Seigneur DIEU ».
    reason: Explique le rendu du nom divin dans le titre composé et signale l’alternative traditionnelle.
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence du réquisitoire précédent.
- source_word: כֹּה אָמַר
  choice: voici ce que dit
  rationale: Rend de façon actuelle et digne la formule prophétique, sans le tour archaïque « ainsi parle ».
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend אֲדֹנָי par « Seigneur » et conserve le nom divin יהוה sous la forme « Yahweh », au lieu de le remplacer par un titre.
- source_word: הִנְנִי עָלַיִךְ גַּם אָנִי
  choice: Me voici contre toi, moi aussi
  rationale: Préserve à la fois la solennité de הִנְנִי, le sens hostile de עָלַיִךְ dans ce contexte de jugement et l’emphase quelque peu inhabituelle de גַּם אָנִי.
- source_word: וְעָשִׂיתִי ... מִשְׁפָּטִים
  choice: j’exécuterai des jugements
  rationale: Expression française formelle qui conserve le pluriel hébreu et évoque des actes concrets de jugement.
- source_word: בְתוֹכֵךְ
  choice: au milieu de toi
  rationale: Jérusalem est interpellée comme une entité féminine singulière; le jugement aura lieu en son sein.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: sous les yeux des nations
  rationale: Conserve l’image visuelle et souligne le caractère public du jugement devant les peuples environnants.
theological_decisions:
- issue: Rendu du nom divin יהוה dans le titre composé אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte hébreu emploie explicitement le nom divin. Le conserver évite d’effacer la distinction entre אֲדֹנָי, titre signifiant « Seigneur », et יהוה, nom propre divin.
- issue: Portée emphatique de גַּם אָנִי
  choice: moi aussi
  alternative: moi-même
  rationale: « Moi aussi » maintient la valeur additive possible de גַּם et l’étrangeté rhétorique du texte, tandis que « moi-même » ne garderait que l’emphase réflexive.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La formule « voici ce que dit » reste accessible, tandis que « Me voici contre toi, moi aussi » conserve volontairement l’emphase et la tension de l’hébreu.
