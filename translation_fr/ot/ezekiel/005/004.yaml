  to: Tu en prendras encore quelques-uns, tu les jetteras au milieu du feu et tu les brûleras dans le feu. De là[a] sortira un feu qui ira vers toute la maison d’Israël.
  rationale: La révision rétablit « maison d’Israël », évite de surdéterminer le référent du pronom final, et déplace la note vers l’ambiguïté textuelle réellement significative. Elle conserve le sens partitif de « quelques-uns », le geste violent du signe prophétique et la répétition voulue de « feu ».
