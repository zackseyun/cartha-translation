  text: וּ/מֵ/הֶם֙ ע֣וֹד תִּקָּ֔ח וְ/הִשְׁלַכְתָּ֤ אוֹתָ/ם֙ אֶל תּ֣וֹךְ הָ/אֵ֔שׁ וְ/שָׂרַפְתָּ֥ אֹתָ֖/ם בָּ/אֵ֑שׁ מִמֶּ֥/נּוּ תֵצֵא אֵ֖שׁ אֶל כָּל בֵּ֥ית יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/004.yaml
  text: And from them you shall take some more[a], and throw them into the midst of the fire and burn them in the fire. From it a fire will go out to all the house of Israel.
translation:
  language: fr
  text: Tu en prendras encore quelques-uns, tu les jetteras au milieu du feu et tu les brûleras dans le feu. De là[a] sortira un feu qui ira vers toute la maison d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « De celui-ci sortira un feu » ; le suffixe singulier renvoie vraisemblablement au feu qui vient d’être mentionné. Certains comprennent, moins probablement, « d’eux sortira un feu ».'
    reason: Préserve l’ambiguïté interprétative du suffixe de מִמֶּנּוּ sans l’imposer dans le corps du texte.
lexical_decisions:
- source_word: וּמֵהֶם עוֹד תִּקָּח
  choice: Tu en prendras encore quelques-uns
  rationale: Le pronom « en » rend naturellement מֵהֶם dans son sens partitif, tandis que « encore quelques-uns » exprime l’ajout indiqué par עוֹד sans suggérer que tous doivent être pris.
- source_word: וְהִשְׁלַכְתָּ אוֹתָם אֶל תּוֹךְ הָאֵשׁ
  choice: tu les jetteras au milieu du feu
  rationale: « Jeter » restitue le sens courant de שלך, et « au milieu du feu » conserve la valeur explicite de תּוֹךְ.
- source_word: וְשָׂרַפְתָּ אֹתָם בָּאֵשׁ
  choice: et tu les brûleras dans le feu
  rationale: Traduction directe de שרף avec בָּאֵשׁ; la répétition de « feu » est maintenue parce qu’elle structure l’image hébraïque.
- source_word: מִמֶּנּוּ
  choice: De celui-ci
  rationale: Le suffixe hébreu est masculin singulier et renvoie le plus naturellement au feu qui vient d’être mentionné. Cette formulation garde le référent légèrement ouvert tout en respectant le nombre grammatical.
- source_word: תֵצֵא אֵשׁ
  choice: sortira un feu
  rationale: « Sortir » conserve l’image concrète de יצא; l’inversion donne une phrase française naturelle et soutenue.
- source_word: אֶל כָּל בֵּית יִשְׂרָאֵל
  choice: qui atteindra toute la communauté d’Israël
  rationale: Dans ce contexte, אֶל marque la direction ou l’extension du feu. « Atteindra » exprime ce mouvement sans ajouter explicitement « contre ». « Communauté d’Israël » rend l’expression collective בֵּית יִשְׂרָאֵל en français moderne.
theological_decisions:
- issue: Origine et portée du feu final
  choice: Le feu sort de celui qui vient d’être mentionné et atteint toute la communauté d’Israël.
  alternative: Le feu sort des quelques cheveux brûlés, ou se dirige explicitement contre toute la maison d’Israël.
  rationale: Le singulier מִמֶּנּוּ favorise un renvoi au feu, mais la formulation n’explicite pas davantage le mécanisme symbolique. Pour אֶל, « atteindra » préserve la direction et la portée du jugement sans transformer la préposition en « contre ».
translation_notes:
  register: Français international moderne, digne et accessible. Le futur garde la force directive de l’instruction prophétique. La répétition volontaire du mot « feu » et l’image du geste symbolique sont conservées.
