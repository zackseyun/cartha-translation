source:
  edition: WLC
  text: לָ/כֵ֣ן חַי אָ֗נִי נְאֻם֮ אֲדֹנָ֣/י יְהוִה֒ אִם לֹ֗א יַ֚עַן אֶת מִקְדָּשִׁ֣/י טִמֵּ֔את בְּ/כָל שִׁקּוּצַ֖יִ/ךְ וּ/בְ/כָל תּוֹעֲבֹתָ֑יִ/ךְ וְ/גַם אֲנִ֤י אֶגְרַע֙ וְ/לֹא תָח֣וֹס עֵינִ֔/י וְ/גַם אֲנִ֖י לֹ֥א אֶחְמֽוֹל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/011.yaml
  text: Therefore[a], as I live, declares the Lord GOD, surely because you have defiled my sanctuary with all your detestable things and with all your abominations, I also will diminish you; my eye will not spare, and I also will show no pity.
translation:
  language: fr
  text: C’est pourquoi, aussi vrai que je suis vivant — déclaration du Seigneur Yahweh —, oui, parce que tu as rendu impur mon sanctuaire par tous tes objets répugnants et toutes tes abominations, moi aussi, je te réduirai[a]. Mon œil sera sans pitié et, moi non plus, je n’aurai aucune compassion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « moi aussi, je diminuerai » ou « je retrancherai ». En hébreu, le verbe est bref et son complément n’est pas exprimé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence judiciaire tirée du contexte précédent.
- source_word: חַי אָ֗נִי
  choice: aussi vrai que je suis vivant
  rationale: Rend explicitement la force solennelle de la formule de serment divine tout en restant idiomatique.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur Yahweh
  rationale: Préserve la formule prophétique et distingue le titre אֲדֹנָי du nom divin יהוה.
- source_word: אִם לֹא
  choice: '[force affirmative portée par le serment, sans équivalent séparé]'
  rationale: Dans cette formule de serment, אִם לֹא renforce l’affirmation. En français, cette force est déjà portée par « aussi vrai que je suis vivant »; ajouter « certainement » alourdirait la phrase.
- source_word: מִקְדָּשִׁי
  choice: mon sanctuaire
  rationale: Correspond au lieu consacré sans réduire le terme au seul bâtiment du temple.
- source_word: טִמֵּאת
  choice: tu as rendu impur
  rationale: Exprime directement la profanation cultuelle et morale du sanctuaire dans une langue claire.
- source_word: שִׁקּוּצַיִךְ
  choice: tes choses répugnantes
  rationale: Conserve la référence assez large à des objets ou réalités détestables, probablement idolâtres, sans l’imposer explicitement.
- source_word: תּוֹעֲבֹתָיִךְ
  choice: tes pratiques abominables
  rationale: Distingue ce second terme du précédent et communique son caractère religieux et moral odieux.
- source_word: אֶגְרַע
  choice: je te retrancherai
  rationale: Rend la menace de diminution ou de suppression dans son contexte, tout en signalant par une note que l’objet demeure implicite en hébreu.
- source_word: לֹא תָחוֹס עֵינִי
  choice: Mon œil sera sans pitié
  rationale: Préserve l’image hébraïque de l’œil tout en produisant une formulation française naturelle.
- source_word: לֹא אֶחְמוֹל
  choice: je n’aurai aucune compassion
  rationale: Conserve le parallélisme avec l’absence de pitié sans répéter exactement le même vocabulaire.
theological_decisions:
- issue: Rendu du nom divin יהוה après אֲדֹנָי
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte à la fois le titre « Seigneur » et le nom propre divin. « Yahweh » préserve cette distinction et évite de masquer le tétragramme sous un second titre.
- issue: Portée du jugement exprimé par אֶגְרַע
  choice: je te retrancherai
  alternative: je diminuerai / je retirerai
  rationale: Le verbe est bref et son objet n’est pas exprimé. Le contexte autorise une menace visant Jérusalem, mais la note maintient l’incertitude sur la nuance exacte au lieu de préciser arbitrairement ce que Dieu retirerait.
translation_notes:
  register: Français international moderne, solennel mais accessible. La ponctuation met en relief la formule d’oracle. Le féminin singulier des verbes et possessifs s’adresse à Jérusalem personnifiée, conformément au contexte et aux formes hébraïques.
