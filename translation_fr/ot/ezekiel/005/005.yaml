  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהֹוִ֔ה זֹ֚את יְר֣וּשָׁלִַ֔ם בְּ/ת֥וֹךְ הַ/גּוֹיִ֖ם שַׂמְתִּ֑י/הָ וּ/סְבִיבוֹתֶ֖י/הָ אֲרָצֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/005.yaml
  text: 'Thus says the Lord GOD: This is Jerusalem. I have set her in the midst of the nations[a], with lands all around her.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh : Voici Jérusalem. Je l’ai placée au milieu des nations, avec des pays tout autour d’elle.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule d’introduction prophétique consacrée, naturelle en français soutenu et fidèle à la valeur déclarative de l’hébreu.
- source_word: אֲדֹנָי יְהֹוִה
  choice: le Seigneur Yahweh
  rationale: « Seigneur » traduit אֲדֹנָי, tandis que « Yahweh » représente distinctement le nom divin יהוה et évite l’expression redondante « le Seigneur SEIGNEUR ».
- source_word: זֹאת יְרוּשָׁלִַם
  choice: Voici Jérusalem
  rationale: Le présentatif « voici » rend avec naturel la force démonstrative et identificatrice de זֹאת dans cette mise en scène symbolique.
- source_word: בְּתוֹךְ הַגּוֹיִם
  choice: au milieu des nations
  rationale: Cette formulation conserve l’idée d’une position centrale, plus précise que le simple « parmi les nations ».
- source_word: שַׂמְתִּיהָ
  choice: Je l’ai placée
  rationale: Le passé composé rend l’action accomplie dont résulte la position de Jérusalem; le pronom féminin reprend naturellement la ville.
- source_word: וּסְבִיבוֹתֶיהָ אֲרָצוֹת
  choice: avec des pays tout autour d’elle
  rationale: La formulation restitue idiomatiquement les territoires qui entourent Jérusalem; « pays » convient ici au sens géographique et politique de אֲרָצוֹת.
theological_decisions:
- issue: Traduction du nom divin dans le titre composé אֲדֹנָי יְהֹוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: La traduction distingue le titre אֲדֹנָי du nom propre יהוה sans effacer ce dernier ni produire une répétition artificielle en français.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence prophétique est préservée par « Ainsi parle », tandis que le reste de la phrase demeure direct et naturel.
