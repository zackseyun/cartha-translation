source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה יַ֤עַן הֲמָנְ/כֶם֙ מִן הַ/גּוֹיִם֙ אֲשֶׁ֣ר סְבִיבֽוֹתֵי/כֶ֔ם בְּ/חֻקּוֹתַ/י֙ לֹ֣א הֲלַכְתֶּ֔ם וְ/אֶת מִשְׁפָּטַ֖/י לֹ֣א עֲשִׂיתֶ֑ם וּֽ/כְ/מִשְׁפְּטֵ֧י הַ/גּוֹיִ֛ם אֲשֶׁ֥ר סְבִיבוֹתֵי/כֶ֖ם לֹ֥א עֲשִׂיתֶֽם־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/007.yaml
  text: 'Therefore thus says the Lord GOD: Because you have been more turbulent than the nations that are around you[a], you have not walked in my statutes, and you have not carried out my judgments; and you have not even acted according to the judgments of the nations that are around you.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit le Seigneur Yahweh : Parce que vous vous êtes montrés plus turbulents que les nations qui vous entourent[a], vous n’avez pas suivi mes prescriptions ni mis en pratique mes règles. Vous n’avez même pas agi selon les règles des nations qui vous entourent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous vous êtes davantage agités », « vous avez été plus rebelles », ou peut-être « vous avez été plus nombreux que les nations qui vous entourent ». Le terme hébreu est difficile ; le texte retient un sens évoquant un désordre excessif, qui convient au contexte.
    reason: Alternative lexicale due à l’incertitude du terme hébreu הֲמָנְכֶם.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Cette formulation rend le titre אֲדֹנָי par « le Seigneur » et conserve le nom divin יהוה sous la forme « Yahweh », sans produire l’expression maladroite « le Seigneur SEIGNEUR ».
- source_word: יַעַן
  choice: Parce que
  rationale: Le terme introduit la cause du jugement annoncé; « Parce que » exprime clairement ce lien dans un français actuel.
- source_word: הֲמָנְכֶם
  choice: vous avez été plus turbulents
  rationale: Le mot hébreu est difficile et son sens précis reste discuté. « Plus turbulents » exprime ici une agitation ou un désordre excessif sans réduire arbitrairement le terme à la seule rébellion.
- source_word: מִן הַגּוֹיִם אֲשֶׁר סְבִיבוֹתֵיכֶם
  choice: que les nations qui vous entourent
  rationale: Après le comparatif implicite dans הֲמָנְכֶם, מִן marque la comparaison; la tournure française avec « plus… que » la restitue naturellement.
- source_word: בְּחֻקּוֹתַי לֹא הֲלַכְתֶּם
  choice: vous n’avez pas suivi mes prescriptions
  rationale: « Suivre » transpose naturellement l’image hébraïque de marcher dans les prescriptions, tandis que « prescriptions » rend חֻקּוֹת comme des exigences établies par Dieu.
- source_word: מִשְׁפָּטַי
  choice: mes règles
  rationale: « Règles » convient ici à des normes à mettre en pratique et permet de conserver le lien lexical avec les מִשְׁפְּטֵי des nations dans la dernière proposition.
- source_word: לֹא עֲשִׂיתֶם
  choice: ni mis en pratique
  rationale: Avec les règles divines, « mettre en pratique » exprime idiomatiquement l’obéissance concrète indiquée par עשה.
- source_word: וּכְמִשְׁפְּטֵי הַגּוֹיִם אֲשֶׁר סְבִיבוֹתֵיכֶם לֹא עֲשִׂיתֶם
  choice: Vous n’avez même pas agi selon les règles des nations qui vous entourent
  rationale: 'La préposition כ marque la conformité (« selon »). « Même pas » explicite la force rhétorique du contraste: le peuple n’a suivi ni les normes de Dieu ni même celles des peuples voisins.'
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte explicitement le nom divin יהוה. Le conserver sous la forme « Yahweh » distingue le nom d’alliance du titre אֲדֹנָי, rendu par « le Seigneur ».
- issue: Portée de la dernière accusation
  choice: Israël n’a même pas agi selon les règles des nations environnantes
  alternative: Israël a agi selon les règles des nations environnantes
  rationale: La traduction suit le texte massorétique, qui comporte clairement la négation לֹא. Elle conserve ainsi la tension rhétorique du verset au lieu d’harmoniser cette phrase avec d’autres accusations prophétiques.
translation_notes:
  register: Français international actuel, digne et accessible. Les formulations « suivre mes prescriptions » et « mettre en pratique mes règles » privilégient un français naturel tout en maintenant le parallélisme et la répétition de מִשְׁפָּט. Le tutoiement collectif est rendu par « vous », conformément à l’adresse au peuple.
