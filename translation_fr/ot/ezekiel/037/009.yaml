  to: 'Puis il me dit : « Prophétise en t’adressant au souffle ; prophétise, fils d’homme, et dis au souffle : “Ainsi parle le Seigneur DIEU : Viens des quatre vents, ô souffle[a], et souffle sur ces hommes tués, afin qu’ils vivent.” »'
