  text: וַ/יֹּ֣אמֶר אֵלַ֔/י הִנָּבֵ֖א אֶל הָ/ר֑וּחַ הִנָּבֵ֣א בֶן אָ֠דָם וְ/אָמַרְתָּ֨ אֶל הָ/ר֜וּחַ כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה מֵ/אַרְבַּ֤ע רוּחוֹת֙ בֹּ֣אִי הָ/ר֔וּחַ וּ/פְחִ֛י בַּ/הֲרוּגִ֥ים הָ/אֵ֖לֶּה וְ/יִֽחְיֽוּ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/009.yaml
  text: 'Then he said to me[a], “Prophesy to the breath; prophesy, son of man, and say to the breath, ‘Thus says the Lord GOD: Come from the four winds, O breath, and breathe on these slain, so that they may live.’”'
translation:
  language: fr
  text: 'Puis il me dit : « Prophétise en t’adressant au souffle ; prophétise, fils d’homme, et dis au souffle : “Ainsi parle le Seigneur DIEU : Viens des quatre vents, ô souffle[a], et souffle sur ces hommes tués, afin qu’ils vivent.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu רוּחַ peut signifier « souffle », « vent » ou « esprit ». Ici, il est traduit par « souffle » au singulier et par « vents » dans l’expression « les quatre vents » ; on pourrait aussi comprendre « esprit », ce qui préserve les différents niveaux de l’image.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּבֵא
  choice: Prophétise
  rationale: L’impératif du verbe נבא désigne ici l’acte de prononcer une parole prophétique. « Prophétise » est direct, naturel et conserve la force de l’ordre.
- source_word: הָרוּחַ / רוּחוֹת
  choice: souffle / vents
  rationale: רוּחַ peut désigner le souffle, le vent ou l’esprit. Le singulier « souffle » convient à l’action qui rend la vie, tandis que l’expression plurielle מֵאַרְבַּע רוּחוֹת correspond naturellement aux « quatre vents ». Une note maintient la polysémie voulue.
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: Adresse caractéristique faite à Ézéchiel, cette formulation transparente conserve l’idiome hébreu qui souligne sa condition humaine sans lui imposer ici une lecture christologique.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur DIEU
  rationale: Cette forme évite la répétition « Seigneur SEIGNEUR » dans le titre composé et distingue le nom divin selon une convention typographique française claire.
- source_word: בֹּאִי
  choice: Viens
  rationale: L’impératif féminin singulier s’accorde avec רוּחַ et introduit naturellement l’invocation adressée au souffle.
- source_word: וּפְחִי
  choice: souffle sur
  rationale: Le verbe נפח signifie « souffler » ou « insuffler ». Avec la préposition ב, « souffle sur » rend directement le mouvement décrit sans ajouter l’idée non explicite d’une pénétration.
- source_word: בַּהֲרוּגִים הָאֵלֶּה
  choice: sur ces morts
  rationale: Le participe הֲרוּגִים désigne des personnes tuées. Dans le contexte du champ de bataille, « ces morts » est naturel en français et conserve le résultat violent implicite, quoique « ces hommes tués » soit plus explicite.
- source_word: וְיִחְיוּ
  choice: afin qu’ils vivent
  rationale: Dans ce contexte, la conjonction suivie de l’imparfait exprime le but ou le résultat attendu. « Afin qu’ils vivent » en donne une formulation concise et digne.
theological_decisions:
- issue: Polysémie de רוּחַ dans la vision de la vallée
  choice: Traduire le singulier par « souffle » et le pluriel par « vents », avec une note signalant « esprit ».
  alternative: Employer uniformément « esprit » ou uniformément « vent ».
  rationale: Le verset exploite le champ sémantique de רוּחַ. « Souffle » convient immédiatement à la revivification, et « quatre vents » est l’expression idiomatique attendue. La note préserve la résonance théologique avec l’Esprit sans réduire l’ambiguïté littéraire.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « prophétise » et de « souffle » reproduit la structure insistante de l’hébreu. « À l’adresse du souffle » évite l’ambiguïté française de « prophétiser au souffle » tout en gardant le destinataire explicite.
