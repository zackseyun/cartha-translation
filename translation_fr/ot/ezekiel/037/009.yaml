  source_fidelity: 'La structure et les principaux choix lexicaux suivent fidèlement l’hébreu : le double impératif « prophétise », l’adresse au souffle, « des quatre vents », l’impératif féminin singulier, et la finale de but sont conservés. Toutefois, « ces morts » ne rend pas suffisamment הֲרוּגִים, qui désigne des personnes tuées/mises à mort. « Ces hommes tués » maintient cette nuance sans surinterpréter le contexte.'
  naturalness: « Prophétise à l’adresse du souffle » est compréhensible, mais paraît administratif et peu naturel dans ce registre. « Prophétise en t’adressant au souffle » est plus idiomatique tout en conservant clairement le destinataire de la prophétie.
