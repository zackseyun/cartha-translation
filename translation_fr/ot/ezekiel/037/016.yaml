  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם קַח לְ/ךָ֙ עֵ֣ץ אֶחָ֔ד וּ/כְתֹ֤ב עָלָי/ו֙ לִֽ/יהוּדָ֔ה וְ/לִ/בְנֵ֥י יִשְׂרָאֵ֖ל חבר/ו וּ/לְקַח֙ עֵ֣ץ אֶחָ֔ד וּ/כְת֣וֹב עָלָ֗י/ו לְ/יוֹסֵף֙ עֵ֣ץ אֶפְרַ֔יִם וְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל חבר/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/016.yaml
  text: And you[a], son of man, take for yourself one stick and write on it, ‘For Judah and for the sons of Israel, his companions.’ Then take one stick and write on it, ‘For Joseph, the stick of Ephraim, and all the house of Israel[c][b], his companions.’
translation:
  language: fr
  text: 'Et toi, fils d’homme, prends pour toi un morceau de bois[a] et écris dessus : « Pour Juda et pour les fils d’Israël[b] qui lui sont associés[c]. » Puis prends un morceau de bois et écris dessus : « Pour Joseph, le morceau de bois d’Éphraïm, et toute la maison d’Israël qui lui est associée[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « un bâton », « une pièce de bois » ou, de manière plus interprétative, « une tablette de bois ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les fils d’Israël »; l’expression peut aussi désigner collectivement les descendants ou le peuple d’Israël.'
    reason: lexical_clarification
  - marker: c
    text: 'Ou : « qui lui sont rattachés », « ses compagnons » ou « ses alliés ». Le même terme hébreu revient à la fin de la seconde inscription.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: Formule d’adresse caractéristique du livre d’Ézéchiel. Cette traduction conserve l’image et la répétition de l’hébreu tout en restant familière en français biblique moderne.
- source_word: קַח לְךָ
  choice: prends pour toi
  rationale: Le pronom datif לְךָ apporte une nuance personnelle que « prends pour toi » rend directement.
- source_word: עֵץ
  choice: morceau de bois
  rationale: Dans cette action symbolique, עֵץ désigne un objet en bois que le prophète peut prendre et sur lequel il peut écrire. « Morceau de bois » préserve la nature indéterminée de l’objet sans imposer l’image plus précise d’un bâton ou d’une tablette.
- source_word: וּכְתֹב עָלָיו
  choice: écris dessus
  rationale: Formulation française courante qui rend clairement l’action physique d’écrire sur l’objet.
- source_word: לִיהוּדָה / לְיוֹסֵף
  choice: Pour Juda / Pour Joseph
  rationale: La préposition ל introduit ici le contenu des inscriptions et peut naturellement être rendue par « pour ».
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression hébraïque littérale et son lien avec le nom du patriarche Israël; une note indique le sens collectif possible.
- source_word: חֲבֵרָיו
  choice: qui lui sont associés / qui lui est associée
  rationale: Le terme désigne ceux qui sont liés ou rattachés à Juda ou à Joseph. La formulation conserve le suffixe singulier tout en s’accordant naturellement avec les groupes désignés en français.
- source_word: עֵץ אֶפְרַיִם
  choice: le morceau de bois d’Éphraïm
  rationale: Le rapport construit est rendu directement et maintient l’identification symbolique de Joseph avec Éphraïm.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: toute la maison d’Israël
  rationale: « Maison d’Israël » est une expression prophétique importante; « toute » rend כָּל sans neutraliser cette image collective.
theological_decisions:
- issue: Représentation des deux ensembles d’Israël dans l’action symbolique
  choice: Maintenir distincts Juda avec ceux qui lui sont associés, et Joseph/Éphraïm avec toute la maison d’Israël qui lui est associée.
  alternative: Réduire les deux groupes à une désignation générale telle que « les Israélites », ou traiter Joseph et Éphraïm comme de simples synonymes sans portée rhétorique.
  rationale: Le texte hébreu met intentionnellement en parallèle Juda et Joseph/Éphraïm dans une action symbolique liée à la division historique du peuple. La traduction préserve cette structure sans lui imposer une interprétation doctrinale ultérieure.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe répétitive de l’action symbolique est conservée, ainsi que les expressions prophétiques « fils d’homme » et « maison d’Israël ». Les guillemets signalent clairement le texte des deux inscriptions.
