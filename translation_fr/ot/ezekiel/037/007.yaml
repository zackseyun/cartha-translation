  text: וְ/נִבֵּ֖אתִי כַּ/אֲשֶׁ֣ר צֻוֵּ֑יתִי וַֽ/יְהִי ק֤וֹל כְּ/הִנָּֽבְאִ/י֙ וְ/הִנֵּה רַ֔עַשׁ וַ/תִּקְרְב֣וּ עֲצָמ֔וֹת עֶ֖צֶם אֶל עַצְמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/007.yaml
  text: So I prophesied as I was commanded[a], and as I prophesied, there was a sound, and behold, a rattling, and the bones came together[b], bone to its bone.
translation:
  language: fr
  text: 'Je prophétisai donc comme j’en avais reçu l’ordre. Pendant que je prophétisais, il y eut un bruit, et voici : un cliquetis[a] ; les os se rapprochèrent, chaque os rejoignant celui qui lui correspondait[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une secousse », « un tremblement » ou « un fracas ». Le mot hébreu רַעַשׁ peut avoir ces différents sens ; le contexte des os qui s’assemblent favorise ici « cliquetis ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un os vers son os » ; cette expression distributive indique que chaque os rejoint l’os qui lui correspond.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבֵּאתִי
  choice: je prophétisai
  rationale: Le niphal de נבא désigne ici l’exercice de la parole prophétique. « Je prophétisai » est précis, établi et naturel dans ce registre.
- source_word: כַּאֲשֶׁר צֻוֵּיתִי
  choice: comme j’en avais reçu l’ordre
  rationale: La formulation conserve l’idée d’un ordre donné à Ézéchiel et rend naturellement en français la forme passive de l’hébreu.
- source_word: וַיְהִי קוֹל
  choice: il y eut un bruit
  rationale: Cette proposition introduit un phénomène audible sans le confondre avec רַעַשׁ, qui en précise ensuite la nature.
- source_word: כְּהִנָּבְאִי
  choice: pendant que je prophétisais
  rationale: L’infinitif construit précédé de כ exprime ici la simultanéité; l’imparfait français souligne le déroulement de l’action.
- source_word: וְהִנֵּה
  choice: voici
  rationale: « Voici » conserve la vivacité et la fonction d’appel à l’attention de הִנֵּה dans un français actuel et digne.
- source_word: רַעַשׁ
  choice: un cliquetis
  rationale: Le mot peut désigner une secousse, un tremblement ou un fracas. Dans la scène où des os s’assemblent, « cliquetis » évoque clairement le bruit produit par leur mouvement sans imposer l’idée d’un séisme.
- source_word: וַתִּקְרְבוּ עֲצָמוֹת
  choice: les os se rapprochèrent
  rationale: קרב signifie fondamentalement « s’approcher ». Le contexte montre que les os viennent se joindre les uns aux autres; « se rapprochèrent » garde le mouvement exprimé par l’hébreu.
- source_word: עֶצֶם אֶל עַצְמוֹ
  choice: chaque os rejoignant celui qui lui correspondait
  rationale: La tournure distributive signifie littéralement « un os vers son os ». Cette formulation française explicite sobrement que chaque os rejoint l’os auquel il appartient.
theological_decisions: []
translation_notes:
  register: Français international moderne, avec une tenue prophétique sobre. Le passé simple convient au récit, tandis que l’imparfait marque l’action en cours. « Voici » préserve l’effet de saisissement sans archaïsme excessif. Les marqueurs [a] et [b] figurent tous deux dans le texte principal et sont placés sur les expressions qu’ils expliquent.
