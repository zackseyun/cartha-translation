source:
  edition: WLC
  text: הָיְתָ֣ה עָלַ/י֮ יַד יְהוָה֒ וַ/יּוֹצִאֵ֤/נִי בְ/ר֨וּחַ֙ יְהוָ֔ה וַ/יְנִיחֵ֖/נִי בְּ/ת֣וֹךְ הַ/בִּקְעָ֑ה וְ/הִ֖יא מְלֵאָ֥ה עֲצָמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/001.yaml
  text: The hand of Yahweh was upon me[a], and he brought me out by the Spirit of Yahweh and set me down in the middle of the valley[b]; it was full of bones.
translation:
  language: fr
  text: 'La main de Yahvé fut sur moi. Par l’Esprit de Yahvé[a], il me fit sortir et me déposa au milieu de la vallée[b] : elle était pleine d’ossements.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans l’Esprit de Yahvé ». La tournure hébraïque peut indiquer soit le moyen (« par l’Esprit »), soit la sphère ou l’état (« dans l’Esprit »).'
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « vallée » peut aussi désigner une plaine ou une large vallée.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַד יְהוָה
  choice: la main de Yahvé
  rationale: Conserve l’image concrète de l’idiome prophétique, qui évoque la puissance ou l’emprise de Yahvé sur le prophète, sans la remplacer par une interprétation abstraite.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Rend le tétragramme par la forme française courante du nom divin plutôt que de lui substituer le titre « le Seigneur ».
- source_word: וַיּוֹצִאֵנִי
  choice: il me fit sortir
  rationale: Le hiphil de יצא a un sens causatif. « Me fit sortir » le restitue clairement tout en restant naturel en français.
- source_word: בְרוּחַ יְהוָה
  choice: par l’Esprit de Yahvé
  rationale: Dans ce contexte d’expérience prophétique et d’action divine, « Esprit » convient mieux que « vent » ; « par » exprime naturellement le moyen ou l’agent, tandis qu’une note conserve la possibilité d’un état ou d’une sphère.
- source_word: וַיְנִיחֵנִי
  choice: me déposa
  rationale: Le hiphil de נוח indique que le prophète est amené à se poser en un lieu. « Me déposa » rend avec concision le mouvement et le positionnement.
- source_word: בְּתוֹךְ הַבִּקְעָה
  choice: au milieu de la vallée
  rationale: « Au milieu de » rend clairement בְּתוֹךְ. בִּקְעָה peut désigner une vallée large ou une plaine encaissée ; « vallée » convient à l’image tout en laissant les autres nuances en note.
- source_word: מְלֵאָה עֲצָמוֹת
  choice: elle était pleine d’ossements
  rationale: Traduction directe de la proposition adjectivale ; « ossements » est plus naturel et évocateur que « os » dans cette scène de restes humains dispersés.
theological_decisions:
- issue: Sens de רוּחַ dans le transport prophétique
  choice: l’Esprit de Yahvé
  alternative: le vent de Yahvé
  rationale: La situation visionnaire et prophétique favorise l’action de l’Esprit divin, sans réduire רוּחַ à une force impersonnelle. La construction avec בְּ demeure cependant ambiguë entre moyen et sphère ou état, ambiguïté signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste vive et narrative ; « ossements » préserve la force macabre de l’image. Les deux notes maintiennent les ambiguïtés lexicales réelles de l’hébreu.
