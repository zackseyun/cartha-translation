reference: Ezekiel 37:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֣י יְהוָ֑ה בְּ/פִתְחִ֣/י אֶת קִבְרֽוֹתֵי/כֶ֗ם וּ/בְ/הַעֲלוֹתִ֥/י אֶתְ/כֶ֛ם מִ/קִּבְרוֹתֵי/כֶ֖ם עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/013.yaml
  text: Then you will know that I am Yahweh[a], when I open your graves and bring you up from your graves[b], O my people.
translation:
  language: fr
  text: Alors vous saurez que je suis Yahweh[a], quand j’ouvrirai vos tombes et que je vous ferai remonter de vos tombes[b], mon peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Éternel ». Le texte hébreu porte le nom divin YHWH.
    reason: lexical_alternative
  - marker: b
    text: Ou « je vous ferai sortir de vos tombes ». Le verbe hébreu signifie littéralement « faire monter » ou « faire remonter ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Alors vous saurez
  rationale: Le parfait qal précédé du waw prend ici, dans le discours prophétique, une valeur future et résultative. « Alors » exprime naturellement la conséquence dans le contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: בְּפִתְחִי
  choice: quand j’ouvrirai
  rationale: La préposition ב avec l’infinitif construit et le suffixe a ici une valeur temporelle, rendue naturellement en français par « quand » suivi du futur.
- source_word: קִבְרוֹתֵיכֶם
  choice: vos tombes
  rationale: קבר désigne une tombe ou un lieu de sépulture. « Tombes » est direct, courant et adapté à l’image concrète du passage.
- source_word: וּבְהַעֲלוֹתִי
  choice: et que je vous ferai remonter
  rationale: Le hiphil de עלה signifie littéralement « faire monter ». « Ferai remonter » conserve le mouvement causatif hors des tombes sans préciser davantage si l’image doit être comprise uniquement comme restauration nationale ou comme résurrection.
- source_word: מִקִּבְרוֹתֵיכֶם
  choice: de vos tombes
  rationale: La préposition מן indique le point de départ. Avec « remonter », « de vos tombes » est idiomatique et fidèle.
- source_word: עַמִּי
  choice: mon peuple
  rationale: L’expression est une apostrophe qui identifie les destinataires comme le peuple de Dieu et conserve sa portée relationnelle et d’alliance.
theological_decisions:
- issue: Faut-il résoudre l’image comme une simple métaphore du rétablissement national ou comme une référence explicite à la résurrection corporelle ?
  choice: Conserver directement l’ouverture des tombes et la remontée hors des tombes.
  alternative: Paraphraser en termes de retour d’exil, ou expliciter une résurrection corporelle.
  rationale: L’hébreu emploie une image concrète évoquant la résurrection dans une vision de restauration. La traduction préserve cette tension sans imposer une seule interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe temporelle respecte l’hébreu tout en restant naturelle. « Mon peuple » fonctionne comme une apostrophe sans ajout d’une interjection devenue peu naturelle en français courant.
