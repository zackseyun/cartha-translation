source:
  edition: WLC
  text: וְ/נָתַתִּי֩ עֲלֵי/כֶ֨ם גִּדִ֜ים וְֽ/הַעֲלֵתִ֧י עֲלֵי/כֶ֣ם בָּשָׂ֗ר וְ/קָרַמְתִּ֤י עֲלֵי/כֶם֙ ע֔וֹר וְ/נָתַתִּ֥י בָ/כֶ֛ם ר֖וּחַ וִ/חְיִיתֶ֑ם וִ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/006.yaml
  text: I will put sinews on you[a], and I will bring flesh up over you, and I will cover you with skin, and I will put breath in you, and you will live. Then you will know that I am Yahweh.
translation:
  language: fr
  text: Je mettrai sur vous des tendons, je ferai pousser de la chair sur vous et je vous couvrirai de peau. Je mettrai en vous le souffle[a], et vous vivrez. Alors vous saurez que je suis Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’esprit » ou « le vent »; le mot hébreu רוּחַ peut avoir ces trois sens, et Ézéchiel 37 joue sur cette diversité de sens.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּדִים
  choice: tendons
  rationale: Dans cette scène de reconstitution corporelle, le terme désigne les tissus qui relient et maintiennent les os. « Tendons » est précis et naturel en français moderne.
- source_word: וְהַעֲלֵתִי עֲלֵיכֶם בָּשָׂר
  choice: je ferai pousser de la chair sur vous
  rationale: Le hifil de עלה exprime l’idée de faire monter ou pousser. Cette formulation conserve l’image progressive et vivante de la chair qui vient recouvrir les os.
- source_word: וְקָרַמְתִּי עֲלֵיכֶם עוֹר
  choice: je vous couvrirai de peau
  rationale: Le verbe évoque l’action de recouvrir ou d’étendre une enveloppe; la formulation est claire et naturelle.
- source_word: רוּחַ
  choice: souffle
  rationale: Le résultat immédiat étant la vie retrouvée, « souffle » convient le mieux ici, sans effacer les autres sens possibles du mot dans l’ensemble du passage.
- source_word: וִחְיִיתֶם
  choice: vous vivrez
  rationale: Rendu direct de la proposition exprimant le résultat, concis et fidèle.
- source_word: וִידַעְתֶּם כִּי אֲנִי יְהוָה
  choice: Alors vous saurez que je suis Yahvé
  rationale: « Alors » rend naturellement la progression et la conséquence de la restauration, tandis que « Yahvé » représente le nom divin.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, qui préserve sa valeur de nom propre dans le texte source.
theological_decisions:
- issue: Sens de רוּחַ dans un contexte où le terme peut désigner le souffle, l’esprit ou le vent
  choice: souffle
  alternative: esprit ou vent
  rationale: La reconstitution physique aboutit ici à l’animation des corps, ce qui favorise « souffle ». Toutefois, Ézéchiel 37 exploite volontairement toute l’étendue sémantique du terme; la note préserve donc cette ambiguïté sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La succession des actions reste proche du rythme hébreu, tout en évitant une formulation anatomique trop technique.
