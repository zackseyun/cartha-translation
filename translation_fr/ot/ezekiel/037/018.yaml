  yaml_path: translation/ot/ezekiel/037/018.yaml
  text: And when the sons of your people say to you[a], ‘Will you not tell us what these things are to you?’
translation:
  language: fr
  text: 'Et lorsque les fils de ton peuple te diront : « Ne nous diras-tu pas ce que ces choses représentent pour toi ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכַאֲשֶׁר
  choice: Et lorsque
  rationale: Introduit l’étape suivante de l’action prophétique tout en conservant le lien narratif et la valeur temporelle.
- source_word: יֹאמְרוּ אֵלֶיךָ
  choice: te diront
  rationale: Rend directement le verbe אָמַר et convient naturellement à l’introduction d’une citation.
- source_word: בְּנֵי עַמְּךָ
  choice: les gens de ton peuple
  rationale: Dans cette adresse collective, l’expression hébraïque désigne les membres du peuple d’Ézéchiel. « Les gens de ton peuple » est naturel en français moderne et évite l’expression peu idiomatique « les fils de ton peuple ».
- source_word: לֵאמֹר
  choice: rendu par les deux-points et la citation
  rationale: L’infinitif sert à introduire les paroles rapportées; le reproduire par « en disant » serait redondant en français.
- source_word: הֲלוֹא תַגִּיד לָנוּ
  choice: Ne nous expliqueras-tu pas
  rationale: La tournure négative conserve l’attente rhétorique de הֲלוֹא. Dans le contexte d’un geste symbolique, « expliquer » exprime naturellement la demande de faire connaître sa portée.
- source_word: מָה אֵלֶּה לָּךְ
  choice: ce que cela signifie
  rationale: Littéralement, « ce que ceux-ci sont pour toi ». Dans le contexte, l’expression demande la signification des objets et du geste symbolique; le singulier neutre « cela » reprend naturellement l’ensemble de la scène en français.
theological_decisions:
- issue: Portée de la question sur les morceaux de bois symboliques
  choice: ce que cela signifie
  alternative: ce que ces choses sont pour toi
  rationale: La formulation française explicite seulement la valeur idiomatique imposée par le contexte, sans préciser à l’avance l’interprétation théologique du signe.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le futur « diront » correspond à l’imparfait hébreu dans cette annonce. La question négative conserve la nuance d’attente de la formulation hébraïque.
