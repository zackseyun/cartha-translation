  - severity: low
    issue: « les gens de ton peuple » atténue « fils »
    rationale: Bien que « fils » puisse désigner largement les membres du peuple dans cet usage hébreu, la formulation source est explicitement construite avec בְּנֵי. « Les fils de ton peuple » est recevable et plus fidèle dans un registre biblique moderne.
