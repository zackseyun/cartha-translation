id: EZK.37.28
reference: Ezekiel 37:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יָֽדְעוּ֙ הַ/גּוֹיִ֔ם כִּ֚י אֲנִ֣י יְהוָ֔ה מְקַדֵּ֖שׁ אֶת יִשְׂרָאֵ֑ל בִּ/הְי֧וֹת מִקְדָּשִׁ֛/י בְּ/תוֹכָ֖/ם לְ/עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/028.yaml
  text: Then the nations will know that I am Yahweh who sanctifies Israel[c][b][a], when my sanctuary is in their midst forever.
translation:
  language: fr
  text: Alors[a] les nations sauront que je suis Yahweh, celui qui sanctifie[b] Israël, quand mon sanctuaire sera au milieu d’eux[c] pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et les nations sauront. » La conjonction hébraïque peut simplement signifier « et », mais elle semble ici introduire la conséquence des promesses de restauration précédentes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui rend Israël saint ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « parmi eux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Alors … sauront
  rationale: Dans ce discours prophétique, le parfait précédé de וְ exprime naturellement un résultat futur découlant des promesses de restauration qui précèdent. « Alors » explicite cette conséquence, tandis que « sauront » rend la valeur future contextuelle.
- source_word: הַגּוֹיִם
  choice: les nations
  rationale: Le terme désigne ici les peuples autres qu’Israël. « Les nations » est naturel en français contemporain et convient au langage prophétique.
- source_word: כִּי אֲנִי יְהוָה
  choice: que je suis Yahweh
  rationale: Cette formulation conserve la formule de reconnaissance caractéristique d’Ézéchiel et rend le nom divin comme un nom propre.
- source_word: מְקַדֵּשׁ
  choice: celui qui sanctifie
  rationale: Le participe présente l’action caractéristique de Yahweh envers Israël. « Sanctifie » maintient le lien lexical et théologique avec la sainteté et le sanctuaire sans limiter le sens à un rite de consécration.
- source_word: מִקְדָּשִׁי
  choice: mon sanctuaire
  rationale: מִקְדָּשׁ désigne le lieu saint. « Sanctuaire » garde la portée du terme sans préciser indûment qu’il s’agit seulement d’un bâtiment appelé temple.
- source_word: בְּתוֹכָם
  choice: au milieu d’eux
  rationale: Cette expression rend la présence localisée de Dieu au sein de son peuple et conserve l’écho du langage biblique de la présence divine.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Dans cette promesse de restauration, l’expression indique une durée sans fin; « pour toujours » est clair et naturel en français moderne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Yahvé
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » le présente comme le nom personnel de Dieu plutôt que de lui substituer un titre.
- issue: Sens de מְקַדֵּשׁ appliqué à Israël
  choice: celui qui sanctifie Israël
  alternative: celui qui rend Israël saint ; celui qui consacre Israël
  rationale: « Sanctifie » exprime que Yahweh met Israël à part et le rend saint, tout en préservant le rapport avec son sanctuaire. Le terme ne réduit pas l’action à une consécration purement rituelle.
translation_notes:
  register: Français international moderne, clair et digne. La formulation « celui qui sanctifie » conserve la valeur caractéristique du participe hébreu; « au milieu d’eux » maintient le langage concret de la présence divine.
