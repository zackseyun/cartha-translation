  text: וְ/כָרַתִּ֤י לָ/הֶם֙ בְּרִ֣ית שָׁל֔וֹם בְּרִ֥ית עוֹלָ֖ם יִהְיֶ֣ה אוֹתָ֑/ם וּ/נְתַתִּי/ם֙ וְ/הִרְבֵּיתִ֣י אוֹתָ֔/ם וְ/נָתַתִּ֧י אֶת מִקְדָּשִׁ֛/י בְּ/תוֹכָ֖/ם לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/026.yaml
  text: I will make with them a covenant of peace[a]; it will be an everlasting covenant with them. And I will place them and multiply them[c][b], and I will set my sanctuary in their midst forever.
translation:
  language: fr
  text: Je conclurai avec eux une alliance de paix ; ce sera une alliance éternelle avec eux. Je les établirai[a] et je les multiplierai, et je placerai mon sanctuaire au milieu d’eux pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je les placerai. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָרַתִּי ... בְּרִית
  choice: Je conclurai ... une alliance
  rationale: Le français « conclure une alliance » rend naturellement l’expression idiomatique hébraïque, littéralement « couper une alliance », sans en affaiblir la portée.
- source_word: בְּרִית שָׁלוֹם
  choice: une alliance de paix
  rationale: Cette formulation conserve le lien formel entre « alliance » et « paix » ; ici, la paix peut englober la sécurité et le bien-être sans que la traduction impose une paraphrase.
- source_word: בְּרִית עוֹלָם
  choice: une alliance éternelle
  rationale: « Éternelle » exprime naturellement la durée indéfinie et permanente de עוֹלָם dans un contexte d’alliance.
- source_word: יִהְיֶה אוֹתָם
  choice: ce sera avec eux
  rationale: Le pronom « ce » reprend l’alliance, tandis que « avec eux » respecte la relation exprimée par אֵת et le parallélisme avec la proposition précédente.
- source_word: וּנְתַתִּים
  choice: Je les établirai
  rationale: Avec le peuple comme objet dans ce contexte de restauration, נתן évoque vraisemblablement le fait de le placer de façon stable. « Établir » communique cette idée en français naturel, tout en signalant en note la traduction plus formelle.
- source_word: וְהִרְבֵּיתִי אוֹתָם
  choice: je les multiplierai
  rationale: Le hifil de רבה signifie faire devenir nombreux ; « multiplier » conserve cette valeur et les échos des promesses d’accroissement.
- source_word: מִקְדָּשִׁי
  choice: mon sanctuaire
  rationale: « Sanctuaire » désigne avec précision le lieu saint sans préciser indûment qu’il s’agit d’un édifice particulier.
- source_word: בְּתוֹכָם
  choice: au milieu d’eux
  rationale: Cette expression rend la présence du sanctuaire au sein du peuple pris collectivement, sans suggérer en premier lieu une intériorité individuelle.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Expression française actuelle et naturelle qui restitue la permanence indiquée par l’hébreu.
theological_decisions:
- issue: Portée de l’alliance dans le contexte de restauration
  choice: Conserver explicitement « alliance de paix » et « alliance éternelle »
  alternative: Paraphraser en termes généraux de bénédiction, de sécurité ou de prospérité
  rationale: Le verset présente les promesses sous une forme expressément relationnelle et alliancielle ; une paraphrase effacerait cette structure théologique.
- issue: Localisation du sanctuaire de Dieu
  choice: « au milieu d’eux », au sens collectif
  alternative: « en eux », compris principalement comme une présence intérieure et individuelle
  rationale: בְּתוֹכָם désigne le plus naturellement le sanctuaire situé parmi le peuple rétabli. Cette traduction préserve l’image communautaire sans importer une catégorie théologique ultérieure.
- issue: Nuance de וּנְתַתִּים dans la restauration du peuple
  choice: « Je les établirai »
  alternative: « Je les placerai »
  rationale: Le verbe נתן signifie fondamentalement donner ou placer, mais son objet humain et le contexte peuvent évoquer une installation stable. La note maintient visible l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la progression des promesses hébraïques, tout en employant les collocations françaises naturelles « conclure une alliance » et « au milieu d’eux ».
