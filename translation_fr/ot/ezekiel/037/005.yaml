source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה לָ/עֲצָמ֖וֹת הָ/אֵ֑לֶּה הִנֵּ֨ה אֲנִ֜י מֵבִ֥יא בָ/כֶ֛ם ר֖וּחַ וִ/חְיִיתֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/005.yaml
  text: 'Thus says the Lord GOD to these bones: Behold[a], I am bringing breath into you, and you shall live.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh à ces ossements : « Voici, je vais faire entrer en vous un souffle[a], et vous vivrez. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu רוּחַ peut aussi signifier « esprit » ou « vent ». Ici, « souffle » convient à l’image immédiate d’ossements sans vie qui reçoivent la vie, mais cette pluralité de sens est importante dans l’ensemble du chapitre.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique consacrée, naturelle en français soutenu et fidèle à la valeur performative du parfait hébreu dans cette formule de messager.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה, sans produire l’expression française maladroite « le Seigneur SEIGNEUR ».
- source_word: לָעֲצָמוֹת הָאֵלֶּה
  choice: à ces ossements
  rationale: La préposition ל désigne ici les destinataires de la parole. « Ossements » convient à des os humains considérés collectivement dans cette vision.
- source_word: הִנֵּה אֲנִי מֵבִיא
  choice: Voici, je vais faire entrer
  rationale: « Voici » conserve la force solennelle d’appel à l’attention; la tournure « je vais » exprime l’imminence portée par הִנֵּה, אֲנִי et le participe.
- source_word: בָכֶם
  choice: en vous
  rationale: Avec « faire entrer », cette formulation rend le mouvement vers l’intérieur indiqué en contexte et s’adresse naturellement aux ossements personnifiés.
- source_word: רוּחַ
  choice: le souffle
  rationale: Dans l’image immédiate d’ossements privés de vie, « souffle » est le sens concret le plus naturel, tout en laissant signaler en note les sens également possibles de « esprit » et « vent ».
- source_word: וִחְיִיתֶם
  choice: et vous vivrez
  rationale: Le parfait coordonné exprime ici le résultat futur de l’action annoncée; le futur simple est clair, digne et idiomatique en français moderne.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte à la fois le titre « Seigneur » et le tétragramme. « Yahweh » préserve explicitement le nom propre et évite de confondre les deux éléments du titre composé.
- issue: Polysémie de רוּחַ
  choice: le souffle, avec note
  alternative: l’Esprit ou le vent
  rationale: Le souffle correspond le mieux à la revivification immédiate des ossements, mais le chapitre exploite la gamme sémantique souffle/vent/esprit. La note préserve cette ambiguïté significative sans la résoudre artificiellement.
translation_notes:
  register: Français international moderne, clair et digne, avec maintien de la formule prophétique solennelle « Ainsi parle » et de l’interjection biblique encore intelligible « Voici ». Les guillemets délimitent naturellement la parole divine en français.
