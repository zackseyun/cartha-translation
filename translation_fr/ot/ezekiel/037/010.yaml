  source_fidelity: 'Le sens de la chaîne narrative hébraïque est bien rendu : Ézéchiel prophétise conformément à l’ordre reçu, le souffle entre dans les corps, ils reviennent à la vie, se tiennent sur leurs pieds, et constituent une armée d’une grandeur intensément soulignée. La traduction de רוּחַ par « souffle » préserve adéquatement le sens immédiat tout en appelant une note lexicale.'
  naturalness: Le français est globalement fluide et d’un registre biblique moderne accessible. « Se tinrent debout sur leurs pieds » conserve volontairement l’image hébraïque, bien qu’elle soit légèrement redondante en français. La répétition « immense, vraiment immense » est naturelle et communique l’insistance finale.
  terminology: « Prophétisai », « souffle », « prirent vie » et « armée » sont appropriés. Dans la note, « esprit » doit rester en minuscule afin de ne pas trancher par une capitalisation interprétative la polyvalence de רוּחַ. L’ancre de note doit aussi porter sur « souffle », non sur « eux », puisque c’est le terme lexical commenté.
