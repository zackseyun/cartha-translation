  text: וְ/הִנַּבֵּ֖אתִי כַּ/אֲשֶׁ֣ר צִוָּ֑/נִי וַ/תָּבוֹא֩ בָ/הֶ֨ם הָ/ר֜וּחַ וַ/יִּֽחְי֗וּ וַ/יַּֽעַמְדוּ֙ עַל רַגְלֵי/הֶ֔ם חַ֖יִל גָּד֥וֹל מְאֹד מְאֹֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/010.yaml
  text: So I prophesied as he commanded me[a], and the breath entered into them, and they lived and stood on their feet, an exceedingly great army.
translation:
  language: fr
  text: 'Je prophétisai donc comme il me l’avait ordonné. Alors le souffle[a] entra en eux : ils prirent vie et se tinrent debout sur leurs pieds. C’était une armée immense, vraiment immense.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’esprit entra en eux ». Le mot hébreu רוּחַ peut signifier « souffle », « vent » ou « esprit » selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנַּבֵּאתִי
  choice: Je prophétisai donc
  rationale: Le hitpael de נבא désigne ici l’acte prophétique d’Ézéchiel parlant conformément à l’ordre reçu. « Prophétiser » est précis, concis et naturel dans ce contexte biblique.
- source_word: כַּאֲשֶׁר צִוָּנִי
  choice: comme il me l’avait ordonné
  rationale: La formulation conserve la comparaison et laisse implicite, comme l’hébreu, l’identité du sujet connue par le contexte. Le plus-que-parfait exprime naturellement en français l’antériorité de l’ordre.
- source_word: וַתָּבוֹא בָהֶם
  choice: entra en eux
  rationale: Le verbe בוא accompagné de ב exprime ici l’entrée dans les corps. Cette traduction garde l’image de mouvement sans l’alourdir.
- source_word: הָרוּחַ
  choice: le souffle
  rationale: Dans la proposition immédiate, רוּחַ est le souffle qui anime les morts et leur rend la vie. Le mot hébreu reste néanmoins polysémique; l’alternative « l’Esprit » est donc signalée en note.
- source_word: וַיִּחְיוּ
  choice: ils prirent vie
  rationale: Cette tournure française exprime clairement le passage de la mort à la vie indiqué par חיה, de façon plus idiomatique que « ils vécurent ».
- source_word: וַיַּעַמְדוּ עַל רַגְלֵיהֶם
  choice: se tinrent debout sur leurs pieds
  rationale: La traduction conserve les deux éléments explicites de l’hébreu, la station debout et les pieds, ainsi que le caractère visuel de la scène.
- source_word: חַיִל
  choice: armée
  rationale: חַיִל désigne ici une force organisée debout et rassemblée; « armée » rend le sens concret et militaire le plus probable.
- source_word: גָּדוֹל מְאֹד מְאֹד
  choice: immense, vraiment immense
  rationale: Cette formulation française naturelle reproduit l’insistance créée par la répétition de מְאֹד sans recourir au peu idiomatique « très, très grande ».
theological_decisions:
- issue: Polysémie de רוּחַ dans la vision des ossements
  choice: le souffle
  alternative: l’Esprit; le vent
  rationale: Le rôle narratif immédiat est celui du souffle vital qui entre dans les corps, mais l’ensemble du passage fait aussi résonner les sens de vent et d’Esprit. La note conserve cette tension sans imposer une seule lecture théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation segmente la longue chaîne narrative hébraïque pour assurer une lecture naturelle tout en maintenant sa progression. L’intensification finale est rendue par une répétition idiomatique.
