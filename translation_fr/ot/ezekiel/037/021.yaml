    issue: Omission distincte de הִנֵּה
    rationale: Le texte source dit littéralement « Voici, moi, je prends... ». Le premier « Voici » du projet rend déjà כֹּה אָמַר (« Voici ce que dit ») et ne peut donc pas également rendre הִנֵּה. Il convient de conserver ce second signal d’attention.
