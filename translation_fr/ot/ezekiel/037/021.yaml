  text: וְ/דַבֵּ֣ר אֲלֵי/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנֵּ֨ה אֲנִ֤י לֹקֵ֨חַ֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל מִ/בֵּ֥ין הַ/גּוֹיִ֖ם אֲשֶׁ֣ר הָֽלְכוּ שָׁ֑ם וְ/קִבַּצְתִּ֤י אֹתָ/ם֙ מִ/סָּבִ֔יב וְ/הֵבֵאתִ֥י אוֹתָ֖/ם אֶל אַדְמָתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/021.yaml
  text: 'Then say to them[a], ‘Thus says the Lord GOD: Behold, I am taking the children of Israel from among the nations where they have gone[b], and I will gather them from all around and bring them to their own land.’'
translation:
  language: fr
  text: 'Dis-leur : « Ainsi parle le Seigneur Yahweh : Voici, je vais prendre les fils d’Israël du milieu des nations où ils sont allés ; je les rassemblerai de toutes parts et je les ramènerai sur leur terre. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדַבֵּר אֲלֵיהֶם
  choice: Dis-leur
  rationale: L’impératif « parler » prend ici naturellement en français le sens d’introduire les paroles qui suivent. La coordination poursuit l’instruction prophétique sans exiger un « puis » explicite.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Cette formulation française actuelle et digne rend clairement la formule de messager prophétique.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: « Seigneur » rend אֲדֹנָי et « Yahweh » représente distinctement le nom divin יהוה, sans produire le redoublement « Seigneur SEIGNEUR ».
- source_word: הִנֵּה אֲנִי לֹקֵחַ
  choice: Je vais prendre
  rationale: Avec הִנֵּה, le participe présente l’action divine comme imminente et certaine. « Je vais prendre » en restitue naturellement la force vive en français.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La traduction conserve l’expression familiale et collective de l’hébreu, courante dans le registre biblique français.
- source_word: מִבֵּין הַגּוֹיִם
  choice: du milieu des nations
  rationale: L’expression indique que les Israélites seront retirés d’entre les peuples étrangers parmi lesquels ils se trouvent.
- source_word: אֲשֶׁר הָלְכוּ שָׁם
  choice: où ils sont allés
  rationale: Le passé composé rend naturellement le déplacement antérieur dont la situation présente est encore le résultat.
- source_word: וְקִבַּצְתִּי אֹתָם מִסָּבִיב
  choice: je les rassemblerai de toutes parts
  rationale: « De toutes parts » exprime la provenance depuis les différentes directions environnantes et le caractère complet du rassemblement.
- source_word: וְהֵבֵאתִי אוֹתָם אֶל אַדְמָתָם
  choice: je les ramènerai sur leur terre
  rationale: Le contexte de dispersion et de retour justifie « ramènerai » ; « sur leur terre » rend naturellement אֶל אַדְמָתָם et sa valeur territoriale.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte à la fois le titre אֲדֹנָי et le nom propre יהוה. Les rendre séparément préserve cette distinction et évite de masquer le nom divin.
- issue: Portée de la promesse de rassemblement
  choice: Conserver une promesse concrète adressée aux fils d’Israël dispersés et ramenés sur leur terre
  alternative: Expliciter une interprétation exclusivement politique, ecclésiale ou eschatologique
  rationale: Le verset affirme le rassemblement et le retour sans préciser ici leur accomplissement théologique ultime ; la traduction ne tranche donc pas au-delà du texte.
translation_notes:
  register: Français international moderne, clair et solennel. Le registre prophétique est préservé sans archaïsmes inutiles. Aucun appel de note n’est requis, car les principaux choix peuvent être rendus directement et sans perte importante dans le texte.
