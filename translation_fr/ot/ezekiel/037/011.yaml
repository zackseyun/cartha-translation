  text: וַ/יֹּאמֶר֮ אֵלַ/י֒ בֶּן אָדָ֕ם הָ/עֲצָמ֣וֹת הָ/אֵ֔לֶּה כָּל בֵּ֥ית יִשְׂרָאֵ֖ל הֵ֑מָּה הִנֵּ֣ה אֹמְרִ֗ים יָבְשׁ֧וּ עַצְמוֹתֵ֛י/נוּ וְ/אָבְדָ֥ה תִקְוָתֵ֖/נוּ נִגְזַ֥רְנוּ לָֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/011.yaml
  text: Then he said to me, “Son of man, these bones are the whole house of Israel. Look, they are saying, ‘Our bones have dried up, and our hope has perished; we are cut off.’”
translation:
  language: fr
  text: 'Puis il me dit : « Fils d’homme, ces os, c’est toute la maison d’Israël. Voici ce qu’ils disent : “Nos os sont desséchés, notre espérance a disparu ; nous sommes retranchés.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: Fils d’homme
  rationale: Formule traditionnelle et naturelle en français biblique, qui conserve l’adresse hébraïque au prophète.
- source_word: הִנֵּה
  choice: Ils disent
  rationale: Dans ce contexte, הִנֵּה attire l’attention sur les paroles rapportées. Une traduction autonome comme « voici » ou « regardez » alourdirait la phrase française ; l’effet déictique demeure dans l’introduction directe de leur plainte.
- source_word: יָבְשׁוּ עַצְמוֹתֵינוּ
  choice: Nos os sont desséchés
  rationale: Rend directement l’accompli hébreu et maintient le lien avec la vision des os desséchés.
- source_word: וְאָבְדָה תִקְוָתֵנוּ
  choice: notre espérance a disparu
  rationale: אָבַד exprime ici la perte ou la disparition de l’espérance ; cette formulation naturelle conserve le caractère définitif ressenti par les exilés.
- source_word: נִגְזַרְנוּ לָנוּ
  choice: nous sommes retranchés
  rationale: Conserve l’image de séparation ou d’exclusion portée par גזר, sans préciser artificiellement de qui ou de quoi Israël se dit retranché.
theological_decisions:
- issue: Identification des os
  choice: « ces os, c’est toute la maison d’Israël »
  alternative: « ces os représentent toute la maison d’Israël »
  rationale: La formulation avec « c’est » préserve la force identificatrice de l’hébreu הֵמָּה sans transformer explicitement l’énoncé en explication symbolique.
- issue: Objet implicite de « retranchés »
  choice: Laisser l’objet non exprimé
  alternative: « retranchés de notre peuple », « retranchés de Dieu » ou « anéantis »
  rationale: Le texte hébreu ne précise pas l’objet de la séparation. Le conserver implicite maintient l’ambiguïté et la tension de la plainte.
translation_notes:
  register: Français moderne, digne et oralement fluide. « Maison d’Israël » conserve l’expression collective biblique. Les paroles sont enchâssées avec une ponctuation française claire, sans ajout explicatif.
