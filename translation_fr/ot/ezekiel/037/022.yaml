source:
  edition: WLC
  text: וְ/עָשִׂ֣יתִי אֹ֠תָ/ם לְ/ג֨וֹי אֶחָ֤ד בָּ/אָ֨רֶץ֙ בְּ/הָרֵ֣י יִשְׂרָאֵ֔ל וּ/מֶ֧לֶךְ אֶחָ֛ד יִֽהְיֶ֥ה לְ/כֻלָּ֖/ם לְ/מֶ֑לֶךְ וְ/לֹ֤א יהיה עוֹד֙ לִ/שְׁנֵ֣י גוֹיִ֔ם וְ/לֹ֨א יֵחָ֥צוּ ע֛וֹד לִ/שְׁתֵּ֥י מַמְלָכ֖וֹת עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/022.yaml
  text: And I will make them one nation in the land[a], on the mountains of Israel, and one king will be king over all of them. They will no longer be two nations[b], and they will no longer be divided into two kingdoms.
translation:
  language: fr
  text: Je ferai d’eux une seule nation dans le pays, sur les montagnes d’Israël[a]. Un seul roi sera leur roi à tous[b]. Ils ne seront plus deux nations et ne seront plus divisés en deux royaumes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans la région montagneuse d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un seul roi sera pour eux tous comme roi »; l’hébreu répète le mot « roi » pour insister.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתִי אֹתָם לְגוֹי אֶחָד
  choice: Je ferai d’eux une seule nation
  rationale: La construction de עשה avec l’objet et לְ exprime la transformation en un nouvel état. « Je ferai d’eux » est naturel en français et maintient clairement l’action divine; « une seule nation » rend גוֹי אֶחָד et souligne l’unification.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: Dans ce contexte, הָאָרֶץ désigne le territoire d’Israël plutôt que la terre entière. « Le pays » exprime naturellement cette référence géographique déterminée.
- source_word: בְּהָרֵי יִשְׂרָאֵל
  choice: sur les montagnes d’Israël
  rationale: Cette formulation transparente conserve l’expression caractéristique d’Ézéchiel. Une note signale l’autre compréhension topographique possible.
- source_word: וּמֶלֶךְ אֶחָד יִהְיֶה לְכֻלָּם לְמֶלֶךְ
  choice: Un seul roi sera leur roi à tous
  rationale: La formulation française conserve la répétition emphatique de מֶלֶךְ sans devenir artificielle, et rend לְכֻלָּם par « à tous ».
- source_word: וְלֹא יהיה עוֹד לִשְׁנֵי גוֹיִם
  choice: Ils ne seront plus deux nations
  rationale: Le collectif précédemment désigné par « eux » est repris au pluriel en français. « Ne… plus » rend naturellement עוֹד dans cette promesse de cessation.
- source_word: וְלֹא יֵחָצוּ עוֹד לִשְׁתֵּי מַמְלָכוֹת
  choice: et ne seront plus divisés en deux royaumes
  rationale: Le nifal de חצה a ici un sens passif. « Divisés en deux royaumes » conserve nettement la dimension politique de la séparation.
theological_decisions:
- issue: Nature de la réunification promise à Israël
  choice: Exprimer directement l’unification nationale, territoriale et royale annoncée par le verset.
  alternative: Introduire explicitement une interprétation messianique ou spiritualiser la réunification.
  rationale: Le verset parle d’une seule nation dans le pays et d’un seul roi, sans identifier ici ce roi comme le Messie. La traduction préserve donc la formulation prophétique immédiate et laisse ouverte son interprétation dans le contexte plus large.
translation_notes:
  register: Français international moderne, digne et accessible. « Une seule nation » et « un seul roi » rendent l’insistance sur l’unité; la répétition de « ne… plus » reflète celle de עוֹד. Les marqueurs de notes sont placés exactement sur les expressions qu’ils expliquent.
