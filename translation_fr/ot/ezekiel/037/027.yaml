source:
  edition: WLC
  text: וְ/הָיָ֤ה מִשְׁכָּנִ/י֙ עֲלֵי/הֶ֔ם וְ/הָיִ֥יתִי לָ/הֶ֖ם לֵֽ/אלֹהִ֑ים וְ/הֵ֖מָּה יִֽהְיוּ לִ֥/י לְ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/027.yaml
  text: My dwelling place will be over them[a], and I will be their God, and they will be my people.
translation:
  language: fr
  text: Ma demeure sera au-dessus d’eux[a]. Je serai leur Dieu, et ils seront mon peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Mon tabernacle sera au-dessus d’eux » ou « Mon lieu d’habitation sera au-dessus d’eux ».
    reason: Alternative lexicale pour מִשְׁכָּן, qui peut désigner une demeure, un lieu d’habitation ou le tabernacle.
lexical_decisions:
- source_word: מִשְׁכָּנִי
  choice: ma demeure
  rationale: Le nom מִשְׁכָּן désigne une demeure ou un lieu d’habitation, et peut aussi évoquer le tabernacle. « Ma demeure » est naturel en français moderne tout en conservant l’image concrète sans la limiter au tabernacle mosaïque.
- source_word: עֲלֵיהֶם
  choice: au-dessus d’eux
  rationale: La préposition עַל signifie ici le plus directement « sur » ou « au-dessus de ». Cette formulation préserve l’image spatiale du texte au lieu de l’aplanir en « parmi eux » ou « avec eux ».
- source_word: וְהָיִיתִי לָהֶם לֵאלֹהִים
  choice: Je serai leur Dieu
  rationale: Cette tournure française naturelle conserve la formule d’alliance hébraïque et sa résonance biblique.
- source_word: וְהֵמָּה יִהְיוּ לִי לְעָם
  choice: ils seront mon peuple
  rationale: Cette formulation idiomatique reproduit fidèlement le second volet de la formule d’alliance.
- source_word: וְהָיָה
  choice: sera
  rationale: Dans ce discours prophétique, la forme verbale se rend naturellement par un futur simple en français.
theological_decisions:
- issue: Formule d’alliance
  choice: « Je serai leur Dieu, et ils seront mon peuple. »
  alternative: « Je serai Dieu pour eux, et ils seront pour moi un peuple. »
  rationale: La formulation retenue préserve la forme classique et reconnaissable de l’alliance sans ajouter d’interprétation doctrinale.
- issue: Valeur spatiale de עֲלֵיהֶם
  choice: « au-dessus d’eux »
  alternative: « parmi eux » ou « avec eux »
  rationale: Le texte hébreu porte une image inhabituelle mais réelle, « sur/au-dessus d’eux ». La conserver évite de résoudre silencieusement la tension avec le verset précédent, qui parle d’une demeure « parmi eux ».
translation_notes:
  register: Français international moderne, simple et digne. « Demeure » garde une tonalité biblique accessible. « Au-dessus d’eux » est volontairement plus formel que « avec eux », car il préserve la préposition et l’image du texte source.
