review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement la progression du verset et la formule d’alliance. Cependant, « les lieux où ils habitent » remplace le possessif hébreu (« leurs lieux d’habitation ») et introduit un présent qui n’est pas exprimé par le texte. La relative porte sur les lieux d’habitation et doit demeurer ainsi liée, sans reformulation qui atténue cette difficulté du texte massorétique.
  naturalness: Le français est globalement clair et d’un registre approprié. « Se souilleront » est plus naturel et plus idiomatique que « se rendront impurs », tout en gardant la valeur réflexive, morale et cultuelle. « Choses abominables » évite de limiter indûment le référent aux seuls objets matériels.
  terminology: « Idoles », « transgressions », « sauverai », « purifierai » et la formule « mon peuple… leur Dieu » sont fidèles et naturels. La note sur les idoles rend utilement le caractère méprisant de גִּלּוּלִים. La note textuelle doit présenter « apostasies » comme une correction proposée, sans affirmer sans précision une attestation ancienne.
  issues:
  - severity: medium
    issue: La formulation « de tous les lieux où ils habitent et où ils ont péché » ne reproduit pas exactement le syntagme hébreu.
    rationale: מוֹשְׁבֹתֵיהֶם signifie « leurs lieux d’habitation »; le présent « ils habitent » est ajouté, et la coordination modifie légèrement la relation syntaxique entre les lieux et le péché.
  - severity: low
    issue: « Objets abominables » restreint possiblement le sens de שִׁקּוּצִים.
    rationale: Le terme peut viser des réalités idolâtres abhorrées plus largement, y compris des pratiques; « choses abominables » conserve l’ouverture du terme.
  - severity: low
    issue: La note b qualifie de manière imprécise l’alternative « apostasies » comme lecture « ancienne ou proposée ».
    rationale: Pour ne pas surdéterminer l’état des témoins ni présenter une correction comme certaine, il vaut mieux l’identifier sobrement comme une correction textuelle proposée.
  revised_text: Ils ne se souilleront plus par leurs idoles[a], par leurs choses abominables ni par aucune de leurs transgressions. Je les sauverai de tous leurs lieux d’habitation où ils ont péché[b], et je les purifierai. Ils seront mon peuple, et moi, je serai leur Dieu.
  revised_footnotes:
  - marker: a
    text: Le mot hébreu traduit par « idoles » est un terme fortement méprisant employé pour désigner les faux dieux.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de tous leurs lieux d’habitation où ils ont péché ». Le texte hébreu est difficile ; une correction textuelle proposée donnerait : « de toutes leurs apostasies par lesquelles ils ont péché ».'
    reason: alternative_reading
  revision_rationale: La révision rétablit le possessif et le lien relatif du texte massorétique sans résoudre sa difficulté par une paraphrase. Elle emploie un français moderne et naturel tout en préservant l’extension sémantique des termes idolâtres et en présentant avec prudence l’alternative textuelle.
