  text: וְ/לֹ֧א יִֽטַמְּא֣וּ ע֗וֹד בְּ/גִלּֽוּלֵי/הֶם֙ וּ/בְ/שִׁקּ֣וּצֵי/הֶ֔ם וּ/בְ/כֹ֖ל פִּשְׁעֵי/הֶ֑ם וְ/הוֹשַׁעְתִּ֣י אֹתָ֗/ם מִ/כֹּ֤ל מוֹשְׁבֹֽתֵי/הֶם֙ אֲשֶׁ֣ר חָטְא֣וּ בָ/הֶ֔ם וְ/טִהַרְתִּ֤י אוֹתָ/ם֙ וְ/הָיוּ לִ֣/י לְ/עָ֔ם וַ/אֲנִ֕י אֶהְיֶ֥ה לָ/הֶ֖ם לֵ/אלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/023.yaml
  text: They will no longer defile themselves with their idols[a], with their detestable things, or with any of their transgressions. I will save them from all their dwelling places in which they sinned, and I will cleanse them. Then they will be my people[b], and I will be their God.
translation:
  language: fr
  text: Ils ne se souilleront plus par leurs idoles[a], par leurs choses abominables ni par aucune de leurs transgressions. Je les sauverai de tous leurs lieux d’habitation où ils ont péché[b], et je les purifierai. Ils seront mon peuple, et moi, je serai leur Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « idoles » est un terme fortement méprisant employé pour désigner les faux dieux.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de tous leurs lieux d’habitation où ils ont péché ». Le texte hébreu est difficile ; une correction textuelle proposée donnerait : « de toutes leurs apostasies par lesquelles ils ont péché ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יִטַמְּאוּ
  choice: se rendront impurs
  rationale: La forme verbale exprime ici une action réfléchie. Cette formulation conserve à la fois la dimension morale et la dimension cultuelle de l’impureté.
- source_word: גִּלּוּלֵיהֶם
  choice: leurs idoles
  rationale: « Idoles » est clair et naturel en français moderne; une note signale la nuance fortement méprisante du terme hébreu propre au langage d’Ézéchiel.
- source_word: שִׁקּוּצֵיהֶם
  choice: leurs objets abominables
  rationale: Le nom désigne des choses jugées répugnantes, particulièrement dans un contexte idolâtre. « Objets abominables » rend explicite qu’il s’agit ici de réalités concrètes sans limiter indûment le référent.
- source_word: פִּשְׁעֵיהֶם
  choice: leurs transgressions
  rationale: Le terme peut évoquer la rébellion contre une autorité légitime. « Transgressions » préserve le caractère grave et volontaire des fautes dans ce contexte d’alliance.
- source_word: וְהוֹשַׁעְתִּי
  choice: Je les sauverai
  rationale: Le verbe signifie sauver ou délivrer. « Sauver » convient au mouvement de restauration qui mène à la purification et au renouvellement de l’alliance.
- source_word: מִכֹּל מוֹשְׁבֹתֵיהֶם אֲשֶׁר חָטְאוּ בָהֶם
  choice: de tous les lieux où ils habitent et où ils ont péché
  rationale: Le texte massorétique parle littéralement de leurs lieux d’habitation. La coordination française évite une lourdeur tout en maintenant le lien entre ces lieux et leur péché; la difficulté textuelle et interprétative est signalée en note.
- source_word: וְטִהַרְתִּי
  choice: je les purifierai
  rationale: « Purifier » conserve les dimensions cultuelle et morale du verbe et répond naturellement à « se rendre impurs » au début du verset.
- source_word: וְהָיוּ לִי לְעָם
  choice: Ils seront mon peuple
  rationale: Cette formulation française naturelle préserve la formule d’alliance hébraïque.
- source_word: וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: et moi, je serai leur Dieu
  rationale: Le pronom tonique « moi » reflète l’accent porté par l’hébreu sur le sujet et conserve la seconde moitié de la formule d’alliance.
theological_decisions:
- issue: Rapport entre le salut, les lieux d’habitation, le péché et l’exil
  choice: Conserver dans le texte principal la lecture du texte massorétique qui évoque les lieux où le peuple habite et pèche.
  alternative: Lire, sur la base d’une variante ou d’une correction proposée, « toutes leurs apostasies par lesquelles ils ont péché ».
  rationale: Le libellé massorétique est difficile, mais il ne convient pas de le remplacer silencieusement par une interprétation plus fluide. Le texte principal maintient l’image géographique, qui peut inclure les lieux de dispersion, tandis que la note préserve l’autre lecture sans imposer une compréhension doctrinale particulière.
- issue: Nature de la restauration promise
  choice: 'Maintenir la séquence divine: salut, purification, puis renouvellement de la relation d’alliance.'
  alternative: Préciser que le salut vise exclusivement le retour d’exil ou, au contraire, exclusivement la délivrance spirituelle du péché.
  rationale: Le verset associe sans les dissocier la délivrance, la purification et l’appartenance à Dieu. La traduction ne réduit pas cette tension à un seul cadre théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide sans effacer la difficulté du texte hébreu. Les marqueurs [a] et [b] sont placés auprès des expressions qu’expliquent réellement les notes.
