- from: Ils ne se rendront plus impurs par leurs idoles[a], par leurs objets abominables ni par aucune de leurs transgressions. Je les sauverai de tous les lieux où ils habitent et où ils ont péché[b], et je les purifierai. Ils seront mon peuple, et moi, je serai leur Dieu.
  to: Ils ne se souilleront plus par leurs idoles[a], par leurs choses abominables ni par aucune de leurs transgressions. Je les sauverai de tous leurs lieux d’habitation où ils ont péché[b], et je les purifierai. Ils seront mon peuple, et moi, je serai leur Dieu.
  rationale: La révision rétablit le possessif et le lien relatif du texte massorétique sans résoudre sa difficulté par une paraphrase. Elle emploie un français moderne et naturel tout en préservant l’extension sémantique des termes idolâtres et en présentant avec prudence l’alternative textuelle.
