id: EZK.37.24
reference: Ezekiel 37:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַבְדִּ֤/י דָוִד֙ מֶ֣לֶךְ עֲלֵי/הֶ֔ם וְ/רוֹעֶ֥ה אֶחָ֖ד יִהְיֶ֣ה לְ/כֻלָּ֑/ם וּ/בְ/מִשְׁפָּטַ֣/י יֵלֵ֔כוּ וְ/חֻקֹּתַ֥/י יִשְׁמְר֖וּ וְ/עָשׂ֥וּ אוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/024.yaml
  text: My servant David will be king over them[a], and there will be one shepherd for all of them. They will walk in my judgments[b], and they will keep my statutes and do them.
translation:
  language: fr
  text: Mon serviteur David[a] sera roi sur eux, et il y aura un seul berger pour eux tous[b]. Ils suivront mes règles de droit, garderont mes prescriptions et les mettront en pratique.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « David » peut désigner ici David lui-même, un futur souverain de sa lignée ou, dans une lecture typologique, le Messie. La traduction conserve le nom hébreu sans trancher.
    reason: alternative_reading
  - marker: b
    text: 'On peut aussi comprendre : « et il sera pour eux tous l’unique berger », en rapportant directement cette proposition à David.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: Dans ce contexte royal et prophétique, עֶבֶד est un titre honorifique exprimant l’appartenance et le service envers Dieu; « serviteur » convient mieux que « esclave » au registre et au sens contextuel.
- source_word: דָוִד
  choice: David
  rationale: Le nom propre est conservé tel quel, sans explicitation interprétative.
- source_word: מֶלֶךְ עֲלֵיהֶם
  choice: sera roi sur eux
  rationale: מֶלֶךְ désigne précisément un roi, et עַל avec suffixe exprime ici l’autorité exercée sur eux.
- source_word: וְרֹעֶה אֶחָד יִהְיֶה לְכֻלָּם
  choice: et il y aura un seul berger pour eux tous
  rationale: « Berger » conserve l’image pastorale et royale. La tournure existentielle rend naturellement la construction hébraïque tout en maintenant l’accent sur l’unité de la direction.
- source_word: וּבְמִשְׁפָּטַי יֵלֵכוּ
  choice: Ils suivront mes règles de droit
  rationale: מִשְׁפָּט désigne ici des normes ou décisions de droit. « Suivre » exprime naturellement en français l’emploi métaphorique de הלך relatif à la conduite, sans calquer l’expression « marcher dans ».
- source_word: חֻקֹּתַי
  choice: mes prescriptions
  rationale: חֻקּוֹת désigne des dispositions prescrites. « Prescriptions » garde la nuance normative et la distingue de מִשְׁפָּטַי.
- source_word: יִשְׁמְרוּ
  choice: garderont
  rationale: שׁמר signifie garder ou observer; « garder » conserve la formulation d’alliance tout en restant compréhensible.
- source_word: וְעָשׂוּ אוֹתָם
  choice: et les mettront en pratique
  rationale: La locution française explicite naturellement que עשה désigne l’obéissance concrète aux prescriptions, tout en conservant le pronom objet masculin pluriel de l’hébreu.
theological_decisions:
- issue: Identité de « David » dans cet oracle de restauration
  choice: Conserver « David » dans le texte sans ajout interprétatif.
  alternative: Le David historique revenu à la vie, un futur souverain davidique ou le Messie en tant que roi-berger issu de David.
  rationale: L’hébreu dit simplement « David ». La traduction ne tranche donc pas entre les lectures littérale, dynastique, typologique ou messianique.
- issue: Rapport entre David et l’unique berger
  choice: 'Rendre la seconde proposition par une tournure existentielle distincte : « il y aura un seul berger ».'
  alternative: 'Comprendre que David est directement le sujet sous-entendu : « il sera pour eux tous l’unique berger ».'
  rationale: La construction hébraïque permet de mettre l’accent soit sur l’existence d’un berger unique, soit sur David comme ce berger. Le texte principal adopte une formulation naturelle sans exclure l’autre analyse, signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme juridique est conservé par « règles de droit » et « prescriptions », tandis que « mettront en pratique » évite le calque peu naturel « les feront ».
