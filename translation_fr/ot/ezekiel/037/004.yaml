  text: וַ/יֹּ֣אמֶר אֵלַ֔/י הִנָּבֵ֖א עַל הָ/עֲצָמ֣וֹת הָ/אֵ֑לֶּה וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם הָ/עֲצָמוֹת֙ הַ/יְבֵשׁ֔וֹת שִׁמְע֖וּ דְּבַר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/004.yaml
  text: Then he said to me[a], “Prophesy over these bones, and say to them, ‘Dry bones, hear the word of Yahweh.’”
translation:
  language: fr
  text: 'Puis il me dit : « Prophétise sur ces ossements et dis-leur : “Ossements desséchés, écoutez la parole de Yahvé[a].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH ; traditionnellement rendu par « le Seigneur ».'
    reason: La note rend visible le tétragramme et l’autre convention française courante de traduction du nom divin.
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Puis il me dit
  rationale: Le waw consécutif fait avancer le récit. « Puis » exprime naturellement la succession en français, tandis que « il me dit » rend directement le verbe et son complément.
- source_word: הִנָּבֵא
  choice: Prophétise
  rationale: L’impératif nifal de נבא constitue l’ordre prophétique habituel. « Prophétise » en est l’équivalent français précis et consacré.
- source_word: עַל הָעֲצָמוֹת הָאֵלֶּה
  choice: sur ces os
  rationale: Avec נבא, עַל peut marquer ce sur quoi porte la prophétie ou ce à quoi elle s’adresse. « Sur » conserve l’image d’Ézéchiel parlant au-dessus des os sans introduire la nuance hostile de « contre ».
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: et dis-leur
  rationale: Cette formulation française naturelle conserve l’impératif coordonné et le fait que les os sont directement interpellés.
- source_word: הָעֲצָמוֹת הַיְבֵשׁוֹת
  choice: Os desséchés
  rationale: Le groupe nominal est un vocatif. « Desséchés » exprime plus fortement que « secs » l’état de complète dessiccation décrit dans la vision, sans ajouter d’information étrangère au texte.
- source_word: שִׁמְעוּ
  choice: écoutez
  rationale: L’impératif pluriel de שמע appelle ici les os personnifiés à prêter attention à la parole divine. « Écoutez » est naturel en français tout en gardant la force de l’ordre.
- source_word: דְּבַר יְהוָה
  choice: la parole de Yahvé
  rationale: דָּבָר désigne ici la parole prophétique. « Yahvé » représente directement le nom divin יהוה plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le tétragramme, nom propre de Dieu. « Yahvé » le représente dans le texte principal; une note signale la graphie hébraïque et l’usage traditionnel de « le Seigneur ».
- issue: Destinataires de l’ordre d’écouter
  choice: Les os desséchés sont directement interpellés
  alternative: Comprendre la phrase comme une simple annonce concernant les os
  rationale: Les formes אֲלֵיהֶם et שִׁמְעוּ indiquent explicitement une adresse aux os personnifiés. La traduction conserve cette tension visionnaire sans la rationaliser.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la progression hébraïque, tandis que « Os desséchés » et « écoutez » donnent à l’apostrophe une formulation naturelle et solennelle.
