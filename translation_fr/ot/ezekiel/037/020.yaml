  text: And the sticks on which you write will be in your hand before their eyes[a].
translation:
  language: fr
  text: Les bâtons sur lesquels tu écriras seront dans ta main, sous leurs yeux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les morceaux de bois ». Le terme hébreu peut désigner plus largement du bois ou un objet en bois ; dans ce geste symbolique, il désigne les objets de bois qu’Ézéchiel tient et sur lesquels il écrit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: seront
  rationale: Le parfait qal précédé de la conjonction prend ici une valeur future dans la suite des instructions prophétiques et décrit le résultat de l’action commandée.
- source_word: הָעֵצִים
  choice: les morceaux de bois
  rationale: עֵץ peut désigner un arbre, du bois ou un objet en bois. Dans ce geste symbolique, il s’agit d’objets de bois sur lesquels Ézéchiel écrit; « morceaux de bois » reste naturel sans préciser indûment leur forme.
- source_word: אֲשֶׁר תִּכְתֹּב עֲלֵיהֶם
  choice: sur lesquels tu écriras
  rationale: Cette formulation française claire conserve la proposition relative ainsi que le sens de la préposition עַל liée à l’écriture.
- source_word: בְּיָדְךָ
  choice: dans ta main
  rationale: Le singulier hébreu est conservé et exprime le fait qu’Ézéchiel tient matériellement les objets, plutôt que l’idée d’agence.
- source_word: לְעֵינֵיהֶם
  choice: sous leurs yeux
  rationale: Cette expression idiomatique française garde l’image des yeux et souligne que le geste doit être accompli visiblement devant eux.
