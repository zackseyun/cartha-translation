source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֔/י בֶּן אָדָ֕ם הֲ/תִחְיֶ֖ינָה הָ/עֲצָמ֣וֹת הָ/אֵ֑לֶּה וָ/אֹמַ֕ר אֲדֹנָ֥/י יְהוִ֖ה אַתָּ֥ה יָדָֽעְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/003.yaml
  text: And he said to me[a], “Son of man, can these bones live?” And I said, “Lord GOD, you know.”
translation:
  language: fr
  text: 'Il me dit : « Fils d’homme, ces os peuvent-ils revivre ? » Je répondis : « Seigneur Yahweh[a], c’est toi qui le sais. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Seigneur Yahweh », titre associant אֲדֹנָי (« Seigneur ») au nom divin יהוה (« Yahweh »).'
    reason: Précision sur le nom divin présent dans le texte source.
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Il me dit
  rationale: Le waw consécutif fait progresser le récit. En français, la juxtaposition suffit naturellement ici; « me dit » rend directement אֵלַי sans alourdir la phrase par un « et » hébraïsant.
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Cette formule est l’appellation récurrente d’Ézéchiel. Elle conserve l’image et la portée littéraire de l’hébreu sans lui imposer une interprétation christologique étrangère au contexte.
- source_word: הֲתִחְיֶינָה
  choice: peuvent-ils revivre
  rationale: L’interrogation porte ici naturellement sur la possibilité que les os retrouvent la vie. « Revivre » est idiomatique en français et ne transforme pas la question en prédiction certaine.
- source_word: הָעֲצָמוֹת הָאֵלֶּה
  choice: ces os
  rationale: Le verset dit simplement « ces os ». L’adjectif « desséchés », bien que présent dans le contexte, n’est pas ajouté ici.
- source_word: וָאֹמַר
  choice: Je répondis
  rationale: Dans cet échange, « répondis » exprime naturellement la fonction du second verbe de parole en français, sans modifier le contenu de la réponse.
- source_word: אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  rationale: « Seigneur » rend אֲדֹנָי et « Yahweh » représente explicitement le nom divin יהוה, en évitant la répétition artificielle « Seigneur SEIGNEUR ».
- source_word: אַתָּה יָדָעְתָּ
  choice: c’est toi qui le sais
  rationale: La tournure disloquée rend la présence emphatique du pronom אַתָּה et le sens statif présent de יָדָעְתָּ, sans ajouter « seul ».
theological_decisions:
- issue: Rendu du nom divin יהוה dans le titre אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  alternative: Seigneur DIEU
  rationale: Le texte contient le nom propre divin. « Yahweh » le rend de manière transparente, tandis que « Seigneur DIEU » le remplace par un titre et dépend d’une convention typographique.
- issue: Portée de בֶּן אָדָם dans Ézéchiel
  choice: Fils d’homme
  alternative: Humain
  rationale: La traduction conserve l’appellation hébraïque récurrente et sa tension littéraire, sans importer dans ce passage une identification théologique ultérieure.
translation_notes:
  register: Français moderne, courant et digne. La syntaxe du dialogue est fluide, tandis que « Fils d’homme » et « Seigneur Yahweh » maintiennent les traits littéraires et théologiques propres au texte hébreu.
