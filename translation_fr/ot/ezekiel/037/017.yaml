  yaml_path: translation/ot/ezekiel/037/017.yaml
  text: Then bring them near to each other for yourself as one stick[b][a], so that they may become one in your hand.
translation:
  language: fr
  text: Puis rapproche-les l’un de l’autre, pour qu’ils deviennent pour toi un seul morceau de bois[a] et qu’ils ne fassent plus qu’un dans ta main[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme un seul morceau de bois ». La préposition hébraïque peut indiquer le résultat (« pour devenir ») ou l’état (« comme »).'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et ils seront des uns dans ta main », tournure hébraïque exprimant le fait qu’ils deviennent un.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרַב
  choice: Puis rapproche
  rationale: L’impératif commande à Ézéchiel de mettre les deux objets à proximité; « Puis » restitue naturellement la progression marquée par le waw.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom objet renvoie aux deux morceaux de bois mentionnés au verset précédent.
- source_word: אֶחָד אֶל אֶחָד
  choice: l’un de l’autre
  rationale: Cette tournure française naturelle conserve le sens réciproque de l’expression hébraïque, littéralement « un vers un ».
- source_word: לְךָ
  choice: pour toi
  rationale: Le datif rattache personnellement le geste symbolique à Ézéchiel sans lui prêter une nuance plus précise que le texte.
- source_word: לְעֵץ אֶחָד
  choice: afin qu’ils forment un seul morceau de bois
  rationale: עֵץ désigne ici les objets de bois du geste prophétique. La formulation exprime naturellement la valeur résultative probable de לְ tout en signalant en note la lecture stative possible.
- source_word: וְהָיוּ לַאֲחָדִים
  choice: et deviennent un
  rationale: La construction décrit le résultat attendu; le pluriel hébreu inhabituel de « un » exprime ici l’unité des deux objets.
- source_word: בְיָדֶךָ
  choice: dans ta main
  rationale: Traduction directe qui préserve l’image concrète du geste symbolique.
theological_decisions:
- issue: Nature de l’unité représentée par les deux morceaux de bois
  choice: Décrire concrètement les morceaux de bois qui deviennent un dans la main d’Ézéchiel.
  alternative: Interpréter directement le geste par « unis-les » ou expliciter ici la réunification d’Israël.
  rationale: Le contexte donne le sens du signe, mais ce verset décrit d’abord l’action prophétique. La traduction conserve donc l’image sans lui imposer son interprétation théologique.
translation_notes:
  register: Français international moderne, clair et digne. « Morceau de bois » rend עֵץ plus précisément dans ce geste symbolique que « bâton », sans exclure la forme concrète des objets. Les deux notes conservent l’ambiguïté de la préposition et l’étrangeté expressive du pluriel hébreu.
