  text: וְ/רָאִ֜יתִי וְ/הִנֵּֽה עֲלֵי/הֶ֤ם גִּדִים֙ וּ/בָשָׂ֣ר עָלָ֔ה וַ/יִּקְרַ֧ם עֲלֵי/הֶ֛ם ע֖וֹר מִ/לְ/מָ֑עְלָ/ה וְ/ר֖וּחַ אֵ֥ין בָּ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/008.yaml
  text: And I looked[a], and behold, there were sinews on them, and flesh had come up, and skin covered them from above; but there was no breath in them.
translation:
  language: fr
  text: 'Je regardai : voici que des tendons étaient sur eux, que de la chair avait poussé et que la peau les avait recouverts par-dessus. Mais il n’y avait pas de souffle[a] en eux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu rouah peut signifier « souffle », « vent » ou « esprit ». Ici, « souffle » convient aux corps encore sans vie, mais l’ensemble du passage joue sur ces trois sens.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: Je regardai
  rationale: Le verbe ראה peut signifier « voir » ou « regarder ». Ici, le passé simple convient au récit visionnaire et met en valeur l’observation du prophète.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: הִנֵּה attire vivement l’attention sur ce qui apparaît. « Voici que » garde cette fonction tout en restant naturel dans un récit français soutenu.
- source_word: גִּדִים
  choice: tendons
  rationale: גִּדִים désigne les tissus reliant les éléments du corps. « Tendons » est précis et plus courant en français moderne que « nerfs » ou « ligaments » dans ce contexte.
- source_word: וּבָשָׂר עָלָה
  choice: de la chair avait poussé
  rationale: בָּשָׂר désigne ici la chair corporelle, et עָלָה évoque sa montée ou sa croissance sur les os. Le plus-que-parfait exprime le résultat déjà visible au moment où Ézéchiel regarde.
- source_word: וַיִּקְרַם עֲלֵיהֶם עוֹר מִלְמָעְלָה
  choice: de la peau les avait recouverts par-dessus
  rationale: קרם décrit la formation d’une couche couvrante, tandis que מִלְמָעְלָה précise que la peau recouvre extérieurement les corps. « Par-dessus » restitue cette nuance sans lourdeur excessive.
- source_word: וְרוּחַ אֵין בָּהֶם
  choice: Mais il n’y avait pas de souffle en eux
  rationale: Dans la situation immédiate, רוּחַ désigne le souffle vital qui manque encore aux corps reconstitués. La conjonction est rendue par « Mais » afin de faire ressortir le contraste entre leur intégrité physique et leur absence de vie.
theological_decisions:
- issue: Sens de רוּחַ dans la vision des ossements desséchés
  choice: souffle
  alternative: vent ou esprit
  rationale: Le contexte immédiat présente des corps reformés mais toujours inanimés, ce qui favorise « souffle ». Cependant, la suite du passage exploite délibérément les sens de souffle, vent et esprit; la note conserve donc cette polysémie sans la résoudre.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient la tonalité narrative biblique sans archaïsme marqué; « voici que » conserve la vivacité de la vision.
