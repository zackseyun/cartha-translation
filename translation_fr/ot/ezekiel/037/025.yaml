  text: וְ/יָשְׁב֣וּ עַל הָ/אָ֗רֶץ אֲשֶׁ֤ר נָתַ֨תִּי֙ לְ/עַבְדִּ֣/י לְ/יַֽעֲקֹ֔ב אֲשֶׁ֥ר יָֽשְׁבוּ בָ֖/הּ אֲבֽוֹתֵי/כֶ֑ם וְ/יָשְׁב֣וּ עָלֶ֡י/הָ הֵ֠מָּה וּ/בְנֵי/הֶ֞ם וּ/בְנֵ֤י בְנֵי/הֶם֙ עַד עוֹלָ֔ם וְ/דָוִ֣ד עַבְדִּ֔/י נָשִׂ֥יא לָ/הֶ֖ם לְ/עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/025.yaml
  text: They will dwell in the land that I gave to my servant Jacob[a], where your fathers dwelt; and they will dwell on it, they and their sons and their sons' sons, forever[c][b]. And David my servant will be prince for them forever.
translation:
  language: fr
  text: Ils habiteront dans le pays que j’ai donné à mon serviteur Jacob, où vos pères ont habité[a]. Ils y habiteront, eux, leurs fils et les fils de leurs fils, pour toujours. Et David, mon serviteur, sera leur prince[b] pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos ancêtres ». L’hébreu dit littéralement « vos pères ».
    reason: lexical_alternative
  - marker: b
    text: « David » peut désigner le dirigeant promis issu de David. Le texte ne précise pas s’il s’agit du David historique rétabli ou d’une figure davidique à venir. Le mot traduit par « prince » peut aussi signifier « chef » ou « dirigeant » ; l’hébreu n’emploie pas ici le mot « roi ».
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָשְׁבוּ עַל הָאָרֶץ
  choice: Ils habiteront dans le pays
  rationale: Avec le verbe ישׁב et dans le contexte du don du pays, « habiter dans le pays » est l’expression française naturelle tout en conservant le sens territorial.
- source_word: אֲשֶׁר נָתַתִּי לְעַבְדִּי לְיַעֲקֹב
  choice: que j’ai donné à mon serviteur Jacob
  rationale: Le passé composé exprime naturellement en français le don antérieur dont les effets restent pertinents; le titre d’alliance « mon serviteur Jacob » est conservé.
- source_word: אֲשֶׁר יָשְׁבוּ בָהּ אֲבוֹתֵיכֶם
  choice: où vos pères ont habité
  rationale: « Où » rend naturellement la relative hébraïque, tandis que « vos pères » conserve la formulation masculine explicite du texte.
- source_word: וְיָשְׁבוּ עָלֶיהָ
  choice: Ils y habiteront
  rationale: Le pronom adverbial « y » reprend idiomatiquement « le pays » et évite en français la tournure peu naturelle « habiter sur lui », sans effacer la répétition du verbe.
- source_word: הֵמָּה וּבְנֵיהֶם וּבְנֵי בְנֵיהֶם
  choice: eux, leurs fils et les fils de leurs fils
  rationale: Cette formulation suit de près l’expression hébraïque et maintient ses termes masculins explicites plutôt que de les généraliser en « enfants » et « descendants ».
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Expression française claire et courante de la permanence durable indiquée par l’hébreu.
- source_word: וְדָוִד עַבְדִּי
  choice: Et David, mon serviteur
  rationale: Le nom propre et l’apposition sont conservés sans explicitation interprétative.
- source_word: נָשִׂיא לָהֶם
  choice: sera leur prince
  rationale: « Prince » préserve la distinction lexicale avec « roi »; le possessif français exprime naturellement la relation de direction marquée par לָהֶם sans imposer la préposition plus forte « sur ».
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: La même traduction que pour עַד עוֹלָם maintient l’insistance du verset sur la permanence.
theological_decisions:
- issue: Identité de « David, mon serviteur »
  choice: Conserver « David » sans développement interprétatif dans le texte principal.
  alternative: Le David historique rétabli, un futur dirigeant davidique ou le Messie issu de David.
  rationale: L’hébreu nomme David sans préciser comment cette promesse doit être comprise; la traduction préserve donc cette tension.
- issue: Portée de אֲבוֹתֵיכֶם
  choice: vos pères
  alternative: vos ancêtres
  rationale: Le texte porte explicitement le masculin pluriel « pères »; une note signale le sens généalogique plus large possible.
- issue: Sens de נָשִׂיא
  choice: prince
  alternative: chef ou dirigeant
  rationale: Ézéchiel emploie נָשִׂיא et non le terme hébreu habituel pour « roi »; « prince » préserve cette distinction.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition d’« habiter » et de « pour toujours » est maintenue. Les notes sont regroupées en fin de verset, tout en étant explicitement appelées dans le texte principal.
