  yaml_path: translation/ot/ezekiel/037/002.yaml
  text: And he led me around among them[a], all around; and behold, there were very many on the surface of the valley, and behold[b], they were very dry.
translation:
  language: fr
  text: Il me fit passer auprès d’eux, tout autour ; et voici qu’ils étaient très nombreux à la surface de la vallée[a] ; et voici qu’ils étaient très secs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur la face de la vallée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱבִירַנִי
  choice: Il me fit passer
  rationale: Le hiphil de עבר exprime ici le fait de faire passer ou circuler quelqu’un. Cette formulation conserve la valeur causative et reste naturelle en français.
- source_word: עֲלֵיהֶם
  choice: parmi eux
  rationale: La préposition signifie littéralement « sur eux » ou « au-dessus d’eux », mais, dans le cadre du déplacement au milieu des ossements, « parmi eux » rend vraisemblablement le rapport spatial sans suggérer un survol.
- source_word: סָבִיב סָבִיב
  choice: tout autour
  rationale: La répétition hébraïque intensifie l’idée d’un parcours circulaire ou complet. « Tout autour » en restitue l’emphase avec naturel.
- source_word: וְהִנֵּה
  choice: et voici
  rationale: La particule attire vivement l’attention sur ce que le prophète découvre dans la vision. « Et voici » en conserve la force narrative et prophétique.
- source_word: רַבּוֹת מְאֹד
  choice: un très grand nombre
  rationale: Le féminin pluriel renvoie aux ossements mentionnés au verset précédent. Cette tournure exprime clairement leur quantité considérable.
- source_word: עַל־פְּנֵי הַבִּקְעָה
  choice: à la surface de la vallée
  rationale: La formulation garde l’image hébraïque de la « face » visible de la vallée, tout en étant idiomatique en français.
- source_word: יְבֵשׁוֹת מְאֹד
  choice: extrêmement secs
  rationale: L’adjectif accompagné de מְאֹד souligne fortement l’état desséché des ossements. « Extrêmement secs » préserve cette intensité sans transformer l’expression en absolu.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La syntaxe garde la vivacité de la vision grâce à la répétition de « et voici », tandis que « il me fit passer » préserve la valeur causative de l’hébreu. Le référent implicite de « un très grand nombre » est explicité par « étendus », accordé avec les ossements du contexte immédiat.
