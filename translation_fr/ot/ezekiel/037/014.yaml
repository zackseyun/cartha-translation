source:
  edition: WLC
  text: וְ/נָתַתִּ֨י רוּחִ֤/י בָ/כֶם֙ וִ/חְיִיתֶ֔ם וְ/הִנַּחְתִּ֥י אֶתְ/כֶ֖ם עַל אַדְמַתְ/כֶ֑ם וִ/ידַעְתֶּ֞ם כִּי אֲנִ֧י יְהוָ֛ה דִּבַּ֥רְתִּי וְ/עָשִׂ֖יתִי נְאֻם יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/014.yaml
  text: I will put my Spirit within you[a], and you will live, and I will settle you on your own land. Then you will know that I am Yahweh. I have spoken, and I have done it, declares Yahweh.
translation:
  language: fr
  text: 'Je mettrai mon Esprit en vous[a], et vous vivrez; je vous installerai sur votre terre. Alors vous saurez que je suis Yahweh : j’ai parlé et j’ai agi — déclaration de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mon souffle » ou « mon esprit »; le mot hébreu peut aussi signifier « vent ». Ézéchiel 37 fait intentionnellement résonner ces différents sens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחִי
  choice: mon Esprit
  rationale: רוּחַ peut désigner le souffle, le vent ou l’esprit. Ici, le suffixe « mon » et l’action divine favorisent « mon Esprit », tandis que la note conserve les résonances voulues dans l’ensemble du chapitre.
- source_word: וִחְיִיתֶם
  choice: vous vivrez
  rationale: Cette formulation concise convient à la fois à l’image immédiate du retour à la vie et à la promesse plus large de restauration.
- source_word: וְהִנַּחְתִּי אֶתְכֶם עַל אַדְמַתְכֶם
  choice: Je vous établirai sur votre terre
  rationale: Le causatif exprime l’idée de placer, faire reposer ou établir. « Établir » rend naturellement, dans ce contexte, une installation stable sans effacer entièrement la notion de placement.
- source_word: וִידַעְתֶּם כִּי אֲנִי יְהוָה
  choice: Alors vous saurez que moi, je suis Yahweh
  rationale: « Alors » explicite la succession résultative; « moi, je suis » restitue l’insistance du pronom hébreu אֲנִי.
- source_word: דִּבַּרְתִּי וְעָשִׂיתִי
  choice: J’ai parlé et je l’accomplirai
  rationale: Le premier parfait affirme la parole déjà prononcée; le second peut être compris comme un parfait prophétique présentant l’accomplissement futur comme certain. Le futur est naturel en français après les promesses du verset, tout en maintenant cette certitude.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule nominale conserve plus directement la forme de l’hébreu qu’un verbe de parole ajouté, tout en restant claire et digne en français.
theological_decisions:
- issue: 'Sens de רוּחִי : souffle ou Esprit'
  choice: mon Esprit
  alternative: mon souffle / mon esprit; le mot peut aussi signifier « vent »
  rationale: Le contexte immédiat exploite volontairement plusieurs sens de רוּחַ. La majuscule rend ici le don divin le plus naturellement compris, tandis que la note préserve l’ambiguïté lexicale et la tension du chapitre.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le nom divin; « Yahweh » le représente directement au lieu de lui substituer un titre.
- issue: Valeur temporelle de וְעָשִׂיתִי
  choice: je l’accomplirai
  alternative: je l’ai accompli / je l’ai fait
  rationale: Le parfait hébreu peut présenter comme déjà certaine l’action promise. Dans le fil du verset, le futur français exprime clairement l’accomplissement annoncé, sans réduire la force de certitude.
translation_notes:
  register: Français international moderne, naturel et digne. Phrases légèrement segmentées pour la lisibilité. « Terre » est retenu plutôt que « pays » afin de rester proche de אֲדָמָה; « établir » communique une installation durable. La formule finale conserve le caractère solennel de l’oracle prophétique.
