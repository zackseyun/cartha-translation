  text: לָ/כֵן֩ הִנָּבֵ֨א וְ/אָמַרְתָּ֜ אֲלֵי/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנֵּה֩ אֲנִ֨י פֹתֵ֜חַ אֶת קִבְרֽוֹתֵי/כֶ֗ם וְ/הַעֲלֵיתִ֥י אֶתְ/כֶ֛ם מִ/קִּבְרוֹתֵי/כֶ֖ם עַמִּ֑/י וְ/הֵבֵאתִ֥י אֶתְ/כֶ֖ם אֶל אַדְמַ֥ת יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/012.yaml
  text: 'Therefore prophesy and say to them[a], ‘Thus says the Lord GOD: Behold, I am opening your graves and will bring you up from your graves, my people[b], and I will bring you into the land of Israel.’'
translation:
  language: fr
  text: 'C’est pourquoi, prophétise et dis-leur : « Voici ce que dit le Seigneur, l’Éternel : Voici, je vais ouvrir vos tombes et je vous ferai remonter de vos tombes[a], mon peuple ; et je vous amènerai dans le pays d’Israël.[b] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « je vous ferai sortir de vos tombes ». Littéralement, le verbe hébreu exprime le fait de faire monter.'
    reason: lexical_alternative
  - marker: b
    text: L’image peut décrire le rétablissement d’Israël par le langage de l’ouverture des tombes, tout en faisant écho à l’espérance ultérieure de la résurrection.
    reason: cross_reference
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Exprime le lien logique avec la vision et l’ordre qui précèdent, dans un français naturel et soutenu.
- source_word: הִנָּבֵא
  choice: prophétise
  rationale: Rend directement l’impératif adressé à Ézéchiel.
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: et dis-leur
  rationale: Conserve simplement la formule d’introduction du discours.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Formule prophétique reconnaissable, plus naturelle en français actuel que le calque « Ainsi dit ».
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur, l’Éternel
  rationale: Représente les deux éléments du titre hébreu tout en suivant une convention française largement intelligible pour le tétragramme.
- source_word: הִנֵּה אֲנִי פֹתֵחַ
  choice: Je vais ouvrir
  rationale: Le présentatif et le participe décrivent une intervention divine imminente et vivement annoncée ; « je vais » l’exprime naturellement.
- source_word: קִבְרוֹתֵיכֶם
  choice: vos tombes
  rationale: Équivalent concret et courant de קבר, approprié à l’image du passage.
- source_word: וְהַעֲלֵיתִי אֶתְכֶם מִקִּבְרוֹתֵיכֶם
  choice: et je vous ferai remonter de vos tombes
  rationale: Préserve la valeur causative et le mouvement ascendant de עלה sans réduire l’image à une interprétation théologique unique.
- source_word: עַמִּי
  choice: mon peuple
  rationale: Conserve l’apostrophe d’alliance et son accent affectif.
- source_word: וְהֵבֵאתִי אֶתְכֶם
  choice: puis je vous ramènerai
  rationale: Dans le contexte du retour d’Israël, « ramener » rend naturellement l’action de faire revenir au pays ; « puis » marque la progression sans surcharger la coordination.
- source_word: אֶל אַדְמַת יִשְׂרָאֵל
  choice: sur la terre d’Israël
  rationale: אַדְמָה désigne ici le territoire d’Israël tout en gardant sa nuance concrète de terre ; la préposition « sur » est idiomatique avec « terre ».
theological_decisions:
- issue: Portée de l’image de l’ouverture des tombes
  choice: Conserver le langage concret de l’ouverture des tombes et de la remontée, tout en situant explicitement son contexte de restauration nationale dans une note.
  alternative: Interpréter exclusivement le verset soit comme une métaphore du retour d’exil, soit comme une annonce directe de la résurrection corporelle individuelle.
  rationale: Le contexte immédiat vise le rétablissement d’Israël, mais la force de l’image évoque réellement la résurrection. La formulation française maintient cette tension au lieu de la trancher.
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur, l’Éternel
  alternative: le Seigneur DIEU ; le Seigneur YHWH
  rationale: Ce rendu distingue les deux termes hébreux, évite « Seigneur Seigneur » et reste digne et familier au lectorat biblique francophone, sans imposer une vocalisation reconstruite.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence prophétique est maintenue sans archaïsmes inutiles. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
