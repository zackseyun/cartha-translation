  text: דַּבֵּ֣ר אֲלֵ/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנֵּה֩ אֲנִ֨י לֹקֵ֜חַ אֶת עֵ֤ץ יוֹסֵף֙ אֲשֶׁ֣ר בְּ/יַד אֶפְרַ֔יִם וְ/שִׁבְטֵ֥י יִשְׂרָאֵ֖ל חבר/ו וְ/נָתַתִּי֩ אוֹתָ֨/ם עָלָ֜י/ו אֶת עֵ֣ץ יְהוּדָ֗ה וַֽ/עֲשִׂיתִ/ם֙ לְ/עֵ֣ץ אֶחָ֔ד וְ/הָי֥וּ אֶחָ֖ד בְּ/יָדִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/019.yaml
  text: 'tell them[a], ‘Thus says the Lord GOD: Behold, I am taking the stick of Joseph, which is in the hand of Ephraim, and the tribes of Israel associated with him, and I will place them with it, with the stick of Judah, and make them one stick[b], and they will be one in my hand.’'
translation:
  language: fr
  text: 'Dis-leur : « Ainsi parle le Seigneur Yahweh : Voici, je prends le bâton de Joseph, qui est dans la main d’Éphraïm, ainsi que les tribus d’Israël qui lui sont associées[a]. Je les placerai sur lui, avec le bâton de Juda[b] ; j’en ferai un seul bâton, et ils ne feront qu’un dans ma main. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « les tribus d’Israël, ses compagnes » ou « les tribus d’Israël réunies à lui ». La forme hébraïque désigne vraisemblablement les tribus associées à Joseph ou à Éphraïm.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « je les placerai sur lui, le bâton de Juda ». La construction hébraïque est difficile : « sur lui » peut renvoyer au bâton de Joseph, tandis que « le bâton de Juda » exprime la réunion symbolique des deux bâtons en un seul.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: דַּבֵּר אֲלֵהֶם
  choice: dis-leur
  rationale: L’impératif introduit l’adresse prophétique directe. « Dis-leur » est naturel en français et conserve la force du commandement.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Ainsi parle le Seigneur Yahweh
  rationale: Cette formulation conserve la solennité de la formule prophétique et rend explicitement le nom divin יהוה par « Yahweh ».
- source_word: הִנֵּה אֲנִי לֹקֵחַ
  choice: Voici, je prends
  rationale: « Voici » attire solennellement l’attention, tandis que le présent rend la valeur vive et imminente du participe hébreu.
- source_word: עֵץ
  choice: morceau de bois
  rationale: Dans cette action symbolique, עֵץ désigne un objet en bois portant une inscription plutôt qu’un arbre vivant. « Morceau de bois » est clair et évite de préciser indûment sa forme.
- source_word: אֲשֶׁר בְּיַד אֶפְרַיִם
  choice: qui est dans la main d’Éphraïm
  rationale: La traduction conserve l’image littérale de la main, reprise à la fin du verset, même si elle peut aussi exprimer la possession ou la représentation.
- source_word: וְשִׁבְטֵי יִשְׂרָאֵל חברו
  choice: ainsi que les tribus d’Israël qui lui sont associées
  rationale: Le terme issu de חבר évoque l’association ou la réunion. Cette formulation rend clairement le lien politique et tribal avec Joseph ou Éphraïm sans le préciser davantage.
- source_word: וְנָתַתִּי אוֹתָם עָלָיו אֶת עֵץ יְהוּדָה
  choice: Je les placerai sur celui-ci, sur le morceau de bois de Juda
  rationale: La formulation suit de près la construction difficile du texte hébreu, où le référent de « sur lui/celui-ci » est explicité par le morceau de bois de Juda, sans remplacer directement l’image par une simple notion abstraite de réunion.
- source_word: וַעֲשִׂיתִם לְעֵץ אֶחָד
  choice: je ferai d’eux un seul morceau de bois
  rationale: La construction עשה + ל exprime ici la transformation en une seule unité symbolique.
- source_word: וְהָיוּ אֶחָד בְּיָדִי
  choice: ils ne feront qu’un dans ma main
  rationale: Cette tournure française naturelle conserve à la fois l’unité exprimée par אֶחָד et l’importante image finale de la main de Dieu.
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: « Yahweh » représente directement le tétragramme et distingue le nom divin du titre אֲדֹנָי, rendu par « le Seigneur ».
- issue: Nature de l’unité annoncée
  choice: Conserver l’image concrète de deux morceaux de bois devenant un
  alternative: Paraphraser explicitement comme la réunification politique ou spirituelle d’Israël
  rationale: Le verset interprète une action symbolique. La traduction ne doit pas réduire d’avance la portée théologique de l’unité en choisissant une seule forme d’accomplissement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe prophétique reste solennelle sans archaïsmes. « Morceau de bois » a été préféré à « bâton » afin de ne pas imposer une forme que le nom hébreu ne précise pas.
