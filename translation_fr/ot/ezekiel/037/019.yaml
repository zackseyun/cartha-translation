revisions:
- from: 'dis-leur : « Ainsi parle le Seigneur Yahweh : Voici, je prends le morceau de bois de Joseph, qui est dans la main d’Éphraïm, ainsi que les tribus d’Israël qui lui sont associées[a]. Je les placerai sur celui-ci, sur le morceau de bois de Juda[b] ; je ferai d’eux un seul morceau de bois, et ils ne feront qu’un dans ma main. »'
  to: 'Dis-leur : « Ainsi parle le Seigneur Yahweh : Voici, je prends le bâton de Joseph, qui est dans la main d’Éphraïm, ainsi que les tribus d’Israël qui lui sont associées[a]. Je les placerai sur lui, avec le bâton de Juda[b] ; j’en ferai un seul bâton, et ils ne feront qu’un dans ma main. »'
  rationale: La révision adopte « bâton », plus naturel pour l’objet symbolique, et reformule la clause difficile sans fixer indûment le référent du pronom hébreu. La note b signale explicitement l’ambiguïté syntaxique et l’effet symbolique de réunion. La répétition des images du bâton et de la main, ainsi que la distinction « le Seigneur Yahweh », sont maintenues.
