lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans la formule prophétique וַיְהִי דְבַר־יְהוָה אֵלַי, le français naturel exprime la venue de la parole par « me fut adressée », plutôt que par le calque « il arriva ».
- source_word: דְבַר
  choice: La parole
  rationale: Le terme désigne ici la communication divine. « La parole » conserve la formule prophétique et sa portée théologique, sans expliciter davantage par « message ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit comme un nom propre plutôt que remplacé par un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » rend naturellement la direction vers le prophète.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Cette expression française introduit naturellement le contenu du discours qui suit et rend la fonction de l’infinitif hébreu « disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le caractère personnel du nom divin sans lui substituer un titre.
translation_notes:
  register: Français moderne, digne et fluide. La formule prophétique hébraïque est rendue idiomatiquement, tout en conservant « la parole » et le nom divin.
