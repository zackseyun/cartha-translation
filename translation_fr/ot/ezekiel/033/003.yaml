  text: וְ/רָאָ֥ה אֶת הַ/חֶ֖רֶב בָּאָ֣ה עַל הָ/אָ֑רֶץ וְ/תָקַ֥ע בַּ/שּׁוֹפָ֖ר וְ/הִזְהִ֥יר אֶת הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/003.yaml
  text: and he sees the sword coming against the land[a], and he blows the trumpet and warns the people,
translation:
  language: fr
  text: et qu’il voie l’épée venir contre le pays, qu’il sonne du cor[a] et avertisse le peuple,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de la trompe », notamment une corne de bélier (hébreu : shofar).'
    reason: Alternative lexicale précisant la nature de l’instrument.
lexical_decisions:
- source_word: וְרָאָה
  choice: et qu’il voie
  rationale: Le qatal avec waw poursuit la situation éventuelle énoncée au verset précédent. Le subjonctif français s’intègre naturellement à cette construction tout en conservant l’enchaînement avec le contexte.
- source_word: הַחֶרֶב
  choice: l’épée
  rationale: Le terme concret est conservé, même s’il évoque ici par métonymie la guerre ou une invasion.
- source_word: בָּאָה עַל הָאָרֶץ
  choice: venir contre le pays
  rationale: La formulation rend le mouvement menaçant exprimé par בוא + עַל. « Pays » désigne ici le territoire menacé, non la terre entière.
- source_word: וְתָקַע בַּשּׁוֹפָר
  choice: qu’il sonne de la trompe
  rationale: « Sonner de la trompe » exprime naturellement l’action de donner l’alarme au moyen du shofar, tout en gardant l’instrument dans le texte.
- source_word: שׁוֹפָר
  choice: trompe
  rationale: « Trompe » convient à l’instrument à vent utilisé comme signal. La possibilité plus matérielle de « cor » ou « corne de bélier » est indiquée en note.
- source_word: וְהִזְהִיר
  choice: et avertisse
  rationale: Le hiphil de זהר signifie ici donner un avertissement. Le verbe français est concis et maintient le parallélisme de la proposition.
- source_word: הָעָם
  choice: le peuple
  rationale: Ce choix courant désigne naturellement l’ensemble de la population qui doit recevoir l’avertissement.
theological_decisions:
- issue: Valeur métonymique de « l’épée » dans l’avertissement prophétique
  choice: Conserver l’image littérale « l’épée » dans le texte principal.
  alternative: Traduire explicitement par « la guerre » ou « une armée ennemie ».
  rationale: L’hébreu emploie חֶרֶב. Maintenir cette image préserve la force prophétique et laisse le contexte communiquer l’idée d’invasion et de jugement sans l’imposer par paraphrase.
translation_notes:
  register: Français moderne, clair et soutenu. Les subjonctifs prolongent la construction éventuelle du verset précédent; la ponctuation finale maintient le lien syntaxique avec la suite. Le marqueur de note est placé après « trompe », terme auquel la note se rapporte.
