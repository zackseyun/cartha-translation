    rationale: « Il délivrera sa personne » n’est pas une formulation française naturelle. « Il se délivrera lui-même » rend de manière recevable la possibilité de comprendre נֶפֶשׁ comme « soi-même », sans évacuer le sens principal « sa vie ».
