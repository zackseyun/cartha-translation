  text: אֵת֩ ק֨וֹל הַ/שּׁוֹפָ֤ר שָׁמַע֙ וְ/לֹ֣א נִזְהָ֔ר דָּמ֖/וֹ בּ֣/וֹ יִֽהְיֶ֑ה וְ/ה֥וּא נִזְהָ֖ר נַפְשׁ֥/וֹ מִלֵּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/005.yaml
  text: He heard the sound of the trumpet and did not take warning[a]; his blood will be upon himself. But if he takes warning[b], he will save his life.
translation:
  language: fr
  text: Il a entendu le son de la trompette et ne s’est pas laissé avertir ; son sang sera sur lui[a]. Mais s’il se laisse avertir, il sauvera sa vie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son sang sera sur lui » ; cette expression hébraïque signifie qu’il est responsable de sa propre mort.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il se délivrera lui-même ». Ici, « sa vie » convient au contexte, puisqu’il s’agit d’échapper à la mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל הַשּׁוֹפָר
  choice: le son de la trompette
  rationale: קוֹל signifie « son » ou « voix », et שׁוֹפָר désigne ici l’instrument qui donne l’alarme. « Le son de la trompette » conserve la construction hébraïque dans un français naturel.
- source_word: שָׁמַע
  choice: a entendu
  rationale: Le verbe exprime ici la perception audible du signal d’alarme ; « a entendu » en rend directement le sens.
- source_word: נִזְהָר
  choice: tenir compte de l’avertissement
  rationale: Le niphal de זהר signifie ici recevoir un avertissement et y réagir. Cette formulation française met en valeur la réponse attendue sans dépasser le sens du contexte.
- source_word: דָּמוֹ בּוֹ יִהְיֶה
  choice: son sang retombera sur lui-même
  rationale: Cette formule idiomatique attribue à l’homme la responsabilité de sa propre mort. La traduction conserve l’image du sang ainsi que sa force judiciaire et morale.
- source_word: נַפְשׁוֹ
  choice: sa vie
  rationale: נֶפֶשׁ peut désigner la vie, la personne ou l’âme. Dans ce contexte de mort physique évitée, « sa vie » convient le mieux.
- source_word: מִלֵּט
  choice: sauvera
  rationale: Le piel exprime ici le fait de faire échapper ou de préserver. Avec « sa vie », « sauvera » constitue une formulation française claire et idiomatique.
- source_word: וְהוּא נִזְהָר
  choice: Mais s’il tient compte de l’avertissement
  rationale: La conjonction introduit un contraste avec celui qui ne réagit pas. La formulation conditionnelle rend explicite la relation implicite dans l’hébreu et produit un français naturel.
theological_decisions:
- issue: Formule de responsabilité dans un contexte de jugement
  choice: son sang retombera sur lui-même
  alternative: il sera responsable de sa propre mort
  rationale: La formule hébraïque affirme la responsabilité personnelle de celui qui refuse l’avertissement. Conserver l’image du sang maintient la portée morale et judiciaire du texte sans la réduire à une paraphrase.
- issue: Sens contextuel de נַפְשׁוֹ
  choice: sa vie
  alternative: son âme / sa personne
  rationale: Le passage traite de l’échappée à une mort imminente. « Sa vie » préserve ce sens contextuel sans introduire une distinction doctrinale entre l’âme et le corps.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « tenir compte de l’avertissement » reflète celle du verbe hébreu. L’image biblique du sang est conservée dans le texte, puis expliquée en note.
