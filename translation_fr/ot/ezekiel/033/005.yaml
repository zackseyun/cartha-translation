revisions:
- from: Il a entendu le son de la trompette, mais n’a pas tenu compte de l’avertissement ; son sang retombera sur lui-même[a]. Mais s’il tient compte de l’avertissement, il sauvera sa vie[b].
  to: Il a entendu le son de la trompette et ne s’est pas laissé avertir ; son sang sera sur lui[a]. Mais s’il se laisse avertir, il sauvera sa vie[b].
  rationale: La révision rétablit une représentation plus directe de l’idiome hébreu de responsabilité (« son sang sera sur lui »), tout en conservant une explication non doctrinale en note. Elle harmonise aussi les deux occurrences de נִזְהָר et remplace l’alternative peu idiomatique de la note b par une formulation française naturelle qui préserve l’éventail sémantique de נֶפֶשׁ.
