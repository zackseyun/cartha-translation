source:
  edition: WLC
  text: חֲבֹ֨ל יָשִׁ֤יב רָשָׁע֙ גְּזֵלָ֣ה יְשַׁלֵּ֔ם בְּ/חֻקּ֤וֹת הַֽ/חַיִּים֙ הָלַ֔ךְ לְ/בִלְתִּ֖י עֲשׂ֣וֹת עָ֑וֶל חָי֥וֹ יִֽחְיֶ֖ה לֹ֥א יָמֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/015.yaml
  text: if the wicked man restores the pledge[a], repays what he has stolen, walks in the statutes of life without doing injustice, he shall surely live[b]; he shall not die.
translation:
  language: fr
  text: si le méchant rend le gage[a], restitue ce qu’il a volé, suit les prescriptions de la vie[b] sans commettre d’injustice, il vivra assurément ; il ne mourra pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rend ce qui avait été donné en gage ». L’hébreu désigne un bien donné ou détenu comme garantie d’une dette.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « marche dans les prescriptions de la vie ». L’expression peut aussi désigner des prescriptions qui donnent la vie ou qui y conduisent.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבֹל
  choice: le gage
  rationale: Le terme désigne un bien remis ou pris comme garantie d’une dette. « Le gage » conserve ce sens juridique et économique dans un français concis.
- source_word: יָשִׁיב
  choice: rend
  rationale: Dans ce contexte de réparation, « rend » exprime naturellement la restitution du bien retenu.
- source_word: רָשָׁע
  choice: le méchant
  rationale: L’adjectif substantivé est masculin singulier et désigne ici l’individu coupable envisagé dans la situation conditionnelle.
- source_word: גְּזֵלָה
  choice: ce qu’il a volé
  rationale: Le nom peut désigner le bien obtenu par vol ou extorsion. Cette formulation française rend clairement l’objet de la restitution.
- source_word: יְשַׁלֵּם
  choice: restitue
  rationale: Le piel exprime ici l’idée de rendre intégralement ou de réparer le tort. « Restitue » convient au contexte légal sans imposer l’idée exclusive d’un remboursement monétaire.
- source_word: בְּחֻקּוֹת הַחַיִּים
  choice: suit les prescriptions qui mènent à la vie
  rationale: Littéralement, l’expression évoque les « prescriptions de la vie ». La formulation retenue est naturelle en français tout en signalant, par une note, l’ambiguïté entre prescriptions conduisant à la vie et prescriptions caractérisées par elle.
- source_word: הָלַךְ
  choice: suit
  rationale: Le verbe signifie littéralement « marcher », métaphore de la conduite. Avec « prescriptions », « suit » exprime cette observance plus naturellement en français moderne.
- source_word: לְבִלְתִּי עֲשׂוֹת עָוֶל
  choice: sans commettre d’injustice
  rationale: La construction exprime l’abstention de tout acte mauvais ou injuste ; la formulation garde la nuance éthique et juridique.
- source_word: חָיוֹ יִחְיֶה
  choice: il vivra, oui, il vivra
  rationale: L’infinitif absolu suivi du verbe conjugué renforce fortement la certitude. La répétition idiomatique française conserve cette emphase.
- source_word: לֹא יָמוּת
  choice: il ne mourra pas
  rationale: Traduction directe de la proposition négative, en cohérence avec la promesse emphatique précédente.
theological_decisions:
- issue: Portée de la vie et de la mort dans la promesse conditionnelle
  choice: Conserver l’affirmation directe « il vivra… il ne mourra pas » sans préciser la nature de cette vie ou de cette mort.
  alternative: Interpréter explicitement les termes comme survie physique, restauration dans l’alliance ou vie eschatologique.
  rationale: L’hébreu ne limite pas explicitement la portée de ces termes. La traduction préserve donc leurs possibles dimensions temporelle, relationnelle et eschatologique sans trancher.
- issue: Rapport entre les prescriptions et la vie dans בְּחֻקּוֹת הַחַיִּים
  choice: « les prescriptions qui mènent à la vie », avec une note conservant les autres rapports possibles
  alternative: « les prescriptions de la vie » ou « les prescriptions qui donnent la vie »
  rationale: 'Le génitif hébreu est ambigu : les prescriptions peuvent être associées à la vie, y conduire ou la procurer. Le texte principal privilégie une tournure française intelligible, tandis que la note maintient l’ouverture sémantique.'
translation_notes:
  register: Français international moderne, digne et accessible. Le début en minuscule respecte le fait que le verset poursuit la condition ouverte au verset précédent. La métaphore hébraïque de la marche est rendue naturellement par « suit », tandis que la note en conserve la forme littérale.
