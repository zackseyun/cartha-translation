revisions:
- from: 'Et toi, fils d’homme, dis aux gens de ton peuple[a] : La justice du juste ne le délivrera pas le jour où il commettra une transgression. Quant à la méchanceté du méchant, elle ne le fera pas tomber[b] le jour où il se détournera de sa méchanceté. Et le juste ne pourra pas vivre grâce à sa justice[c] le jour où il péchera.'
  to: 'Et toi, fils d’homme, dis aux gens de ton peuple[a] : La justice du juste ne le délivrera pas le jour où il commet une transgression. Quant à la méchanceté du méchant, il ne trébuchera pas à cause d’elle[b] le jour où il se détourne de sa méchanceté. Et le juste ne pourra pas vivre par sa justice[c] le jour où il pèche.'
  rationale: La révision conserve toutes les décisions lexicales fondamentales et les trois ancres de note. Elle remplace les futurs temporels par le présent de vérité générale, rétablit explicitement l’image hébraïque du trébuchement et emploie « par sa justice », formulation instrumentale plus neutre. L’explicitation du référent dans la dernière proposition reste signalée par la note.
