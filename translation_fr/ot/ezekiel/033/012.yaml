reference: Ezekiel 33:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם אֱמֹ֤ר אֶל בְּנֵֽי עַמְּ/ךָ֙ צִדְקַ֣ת הַ/צַּדִּ֗יק לֹ֤א תַצִּילֶ֨/נּוּ֙ בְּ/י֣וֹם פִּשְׁע֔/וֹ וְ/רִשְׁעַ֤ת הָֽ/רָשָׁע֙ לֹֽא יִכָּ֣שֶׁל בָּ֔/הּ בְּ/י֖וֹם שׁוּב֣/וֹ מֵֽ/רִשְׁע֑/וֹ וְ/צַדִּ֗יק לֹ֥א יוּכַ֛ל לִֽ/חְי֥וֹת בָּ֖/הּ בְּ/י֥וֹם חֲטֹאתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/012.yaml
  text: 'And you[a], son of man, say to the sons of your people: The righteousness of the righteous man will not deliver him in the day of his transgression, and the wickedness of the wicked man—he will not stumble by it in the day he turns from his wickedness[c][b]; and the righteous man will not be able to live by it in the day of his sin.'
translation:
  language: fr
  text: 'Et toi, fils d’homme, dis aux gens de ton peuple[a] : La justice du juste ne le délivrera pas le jour où il commet une transgression. Quant à la méchanceté du méchant, il ne trébuchera pas à cause d’elle[b] le jour où il se détourne de sa méchanceté. Et le juste ne pourra pas vivre par sa justice[c] le jour où il pèche.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils de ton peuple ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « elle ne le fera pas tomber ». L’hébreu emploie l’image du trébuchement ou de la chute.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « par elle ». Le pronom féminin renvoie très probablement à la justice du juste.'
    reason: referent_clarification
lexical_decisions:
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: Formule d’adresse caractéristique du livre d’Ézéchiel; elle conserve l’image hébraïque et sa fonction littéraire récurrente.
- source_word: בְּנֵי עַמְּךָ
  choice: les gens de ton peuple
  rationale: Expression française naturelle désignant les membres du peuple d’Ézéchiel; une note signale la formulation littérale avec « fils ».
- source_word: צִדְקַת הַצַּדִּיק
  choice: la justice du juste
  rationale: Préserve la parenté lexicale et désigne ici la conduite ou la qualité juste de la personne, sans réduire le terme à une notion judiciaire abstraite.
- source_word: תַצִּילֶנּוּ
  choice: ne le délivrera pas
  rationale: Rend le hiphil de נצל dans ce contexte de jugement sans ajouter les connotations doctrinales plus larges que pourrait porter « sauver ».
- source_word: בְּיוֹם פִּשְׁעוֹ
  choice: le jour où il commettra une transgression
  rationale: Formulation française claire qui conserve la valeur temporelle et la gravité de פשע.
- source_word: רִשְׁעַת הָרָשָׁע
  choice: la méchanceté du méchant
  rationale: Conserve le jeu de mots hébreu entre la conduite mauvaise et celui qui la pratique.
- source_word: יִכָּשֶׁל בָּהּ
  choice: elle ne le fera pas tomber
  rationale: Conserve l’image de la chute tout en rendant explicitement le pronom féminin, qui renvoie à la méchanceté.
- source_word: בְּיוֹם שׁוּבוֹ מֵרִשְׁעוֹ
  choice: le jour où il se détournera de sa méchanceté
  rationale: שוב avec מן exprime ici le fait de se détourner d’une conduite antérieure; cette traduction préserve le motif du retournement sans le surinterpréter.
- source_word: לֹא יוּכַל לִחְיוֹת בָּהּ
  choice: ne pourra pas vivre grâce à sa justice
  rationale: Rend explicitement l’incapacité exprimée par יכל et clarifie le référent le plus naturel du pronom féminin, tout en documentant cette explicitation en note.
- source_word: בְּיוֹם חֲטֹאתוֹ
  choice: le jour où il péchera
  rationale: Traduction temporelle naturelle de la construction hébraïque, parallèle à la première proposition.
theological_decisions:
- issue: Le rapport entre la conduite passée, le retournement et le jugement
  choice: Présenter le principe prophétique selon lequel la justice passée ne protège pas celui qui pèche, tandis que la méchanceté passée ne fait pas tomber celui qui s’en détourne.
  alternative: Formuler le verset comme une affirmation systématique sur la perte du salut ou, inversement, sur la persévérance garantie.
  rationale: Le texte traite directement du jugement divin en rapport avec la conduite et le retournement présents; la traduction n’importe aucune conclusion confessionnelle ultérieure.
- issue: Référent de בָּהּ dans la dernière proposition
  choice: Expliciter « grâce à sa justice », référent le plus naturel dans la structure parallèle du verset.
  alternative: Conserver un pronom ambigu (« grâce à elle ») ou y voir plus largement son statut antérieur.
  rationale: Le pronom féminin singulier s’accorde naturellement avec צִדְקָה, « justice ». Une note préserve la forme pronominale de l’hébreu et signale l’explicitation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été allégée par trois phrases coordonnées, tout en maintenant le parallélisme prophétique, les termes répétés « justice/juste » et « méchanceté/méchant », ainsi que la tension entre conduite passée et conduite présente.
