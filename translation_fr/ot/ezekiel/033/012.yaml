review_pass:
  verdict: revise
  source_fidelity: 'Le sens d’ensemble est fidèle au parallélisme hébreu : la justice antérieure ne délivre pas au jour de la transgression, la méchanceté antérieure ne fait pas tomber celui qui s’en détourne, et la justice ne permet pas au juste de vivre au jour de son péché. Toutefois, les subordonnées françaises au futur (« commettra », « se détournera », « péchera ») présentent comme futurs des faits que l’hébreu exprime par des constructions temporelles générales (« au jour de... »). Le présent restitue mieux le principe proverbial-prophétique. « Trébucher » conserve aussi plus directement l’image de כשל que « tomber ».'
  naturalness: Le français est clair, moderne et d’un registre convenant à Ézéchiel. La formulation révisée avec le présent gnomique est plus naturelle pour l’énoncé d’un principe général. « Grâce à sa justice » est compréhensible, mais « par sa justice » évite la nuance habituellement favorable de « grâce à » dans une phrase négative.
  terminology: '« Fils d’homme », « justice du juste », « méchanceté du méchant », « délivrer » et « pécher » sont appropriés. L’explicitation finale « sa justice » est soutenable : le pronom féminin hébreu renvoie naturellement à צִדְקָה (« justice »), et la note documente correctement l’explicitation.'
  issues:
  - severity: low
    issue: Temps futur dans les propositions temporelles
    rationale: Les formes « le jour où il commettra/se détournera/péchera » peuvent être lues comme des événements à venir. Le texte énonce plutôt une règle valable chaque fois que ces situations surviennent; le présent français le rend plus exactement.
  - severity: low
    issue: Affaiblissement de l’image de trébuchement
    rationale: « Elle ne le fera pas tomber » communique l’idée générale, mais rend la tournure comme plus explicitement causative. « Il ne trébuchera pas à cause d’elle » maintient plus précisément l’image et le lien pronominal de l’hébreu.
  - severity: low
    issue: Nuance de « grâce à »
    rationale: Dans ce contexte négatif, « par sa justice » est plus neutre et plus proche de la valeur instrumentale de בָּהּ, sans suggérer une faveur.
