  text: וְ֠/אַתָּה כִּֽי הִזְהַ֨רְתָּ רָשָׁ֤ע מִ/דַּרְכּ/וֹ֙ לָ/שׁ֣וּב מִמֶּ֔/נָּה וְ/לֹא שָׁ֖ב מִ/דַּרְכּ֑/וֹ ה֚וּא בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/אַתָּ֖ה נַפְשְׁ/ךָ֥ הִצַּֽלְתָּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/009.yaml
  text: But if you warn a wicked man to turn from his way[a], and he does not turn from his way, he will die in his iniquity[b]; but you will have delivered your soul.
translation:
  language: fr
  text: Mais si tu avertis le méchant afin qu’il se détourne de sa voie, et qu’il ne se détourne pas de sa voie, il mourra dans son iniquité[a] ; mais toi, tu auras sauvé ta vie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il mourra à cause de son iniquité » ou « pour son iniquité ».'
    reason: alternative_reading
  - marker: b
    text: Le mot hébreu peut aussi être rendu par « ta personne » ou, traditionnellement, « ton âme » ; ici, il désigne la vie ou la personne elle-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִזְהַרְתָּ
  choice: tu avertis
  rationale: Le hifil de זהר signifie ici avertir ou mettre en garde. « Avertir » est naturel et convient au contexte de la sentinelle.
- source_word: רָשָׁע
  choice: le méchant
  rationale: L’adjectif masculin singulier est substantivé et désigne l’individu coupable d’une conduite mauvaise. Cette formulation conserve la force morale du terme.
- source_word: מִדַּרְכּוֹ ... לָשׁוּב מִמֶּנָּה
  choice: afin qu’il se détourne de sa conduite
  rationale: דֶּרֶךְ est une « voie » au sens figuré, c’est-à-dire une manière de vivre. « Conduite » rend clairement ce sens éthique en français moderne, tandis que « afin que » exprime la visée de l’avertissement.
- source_word: וְלֹא שָׁב מִדַּרְכּוֹ
  choice: et qu’il ne se détourne pas de sa conduite
  rationale: La répétition de « sa conduite » reproduit l’insistance de l’hébreu plutôt que de la remplacer par un pronom.
- source_word: בַּעֲוֺנוֹ
  choice: dans sa faute
  rationale: Le beth peut indiquer la situation dans laquelle la mort survient tout en comportant une nuance causale. « Dans sa faute » garde cette concision et cette ambiguïté.
- source_word: הִצַּלְתָּ
  choice: tu auras sauvé
  rationale: Le hifil de נצל signifie délivrer, sauver ou arracher au danger. Le futur antérieur français exprime naturellement le résultat acquis après l’accomplissement du devoir d’avertir.
- source_word: נַפְשְׁךָ
  choice: ta vie
  rationale: Dans ce contexte de responsabilité et de mort, נֶפֶשׁ désigne la vie ou la personne elle-même, sans imposer le sens métaphysique moderne de « âme ».
- source_word: כִּי
  choice: si
  rationale: כִּי introduit ici la condition. « Mais » rend en outre le contraste discursif avec le cas précédent.
- source_word: וְאַתָּה ... וְאַתָּה
  choice: Mais si tu ... mais toi
  rationale: Le second « toi », exprimé et accentué, marque le contraste entre le sort du méchant et la responsabilité de la sentinelle.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans la proposition finale
  choice: « ta vie », au sens de la vie ou de la personne préservée
  alternative: « ton âme »
  rationale: Le contexte porte sur la responsabilité de la sentinelle face au jugement et à la mort. « Ta vie » évite d’introduire une opposition ultérieure entre âme immatérielle et corps.
- issue: Rapport entre la faute et la mort dans בַּעֲוֺנוֹ
  choice: « il mourra dans sa faute »
  alternative: « il mourra à cause de sa faute » ou « pour sa faute »
  rationale: La formulation retenue préserve la valeur circonstancielle du beth ainsi que sa possible nuance causale, sans résoudre plus précisément que l’hébreu le rapport entre faute et mort.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement conserve l’adresse directe singulière à la sentinelle. « Conduite » explicite la portée morale de l’image de la voie sans en modifier le sens.
