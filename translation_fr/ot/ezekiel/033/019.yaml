  text: וּ/בְ/שׁ֤וּב רָשָׁע֙ מֵֽ/רִשְׁעָת֔/וֹ וְ/עָשָׂ֥ה מִשְׁפָּ֖ט וּ/צְדָקָ֑ה עֲלֵי/הֶ֖ם ה֥וּא יִֽחְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/019.yaml
  text: And when a wicked man turns from his wickedness and does justice and righteousness[a], by them he shall live.
translation:
  language: fr
  text: Et quand le méchant se détourne de sa méchanceté et pratique le droit et la justice, il vivra grâce à eux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à cause d’eux ». Littéralement : « sur eux ». L’expression hébraïque renvoie au droit et à la justice comme au fondement ou à la cause de sa vie.'
    reason: Alternative lexicale et préservation de l’ambiguïté de la préposition hébraïque.
lexical_decisions:
- source_word: וּ/בְ/שׁוּב
  choice: Et quand … se détourne
  rationale: La préposition avec l’infinitif construit introduit une proposition temporelle, tandis que la conjonction maintient l’enchaînement du texte. « Se détourner de » exprime naturellement le changement de conduite.
- source_word: רָשָׁע
  choice: le méchant
  rationale: L’adjectif masculin singulier est employé comme substantif et désigne ici un représentant de la catégorie des méchants.
- source_word: מֵֽ/רִשְׁעָת֔/וֹ
  choice: de sa méchanceté
  rationale: Ce choix conserve le lien lexical avec « le méchant » et la portée morale forte du terme hébreu.
- source_word: וְ/עָשָׂ֥ה
  choice: et pratique
  rationale: Avec « le droit et la justice », « pratiquer » est plus idiomatique en français que le calque « faire », tout en gardant l’accent sur la conduite concrète.
- source_word: מִשְׁפָּ֖ט וּ/צְדָקָ֑ה
  choice: le droit et la justice
  rationale: Cette paire française naturelle rend la conduite conforme au droit et moralement droite, sans réduire מִשְׁפָּט à un jugement judiciaire.
- source_word: עֲלֵי/הֶ֖ם
  choice: par eux
  rationale: Le pronom renvoie aux deux réalités qui précèdent. « Par eux » conserve de façon concise la valeur possible de moyen ou de fondement sans la préciser excessivement.
- source_word: ה֥וּא יִֽחְיֶֽה
  choice: il vivra
  rationale: Le futur exprime clairement le résultat annoncé. Le pronom hébreu renforce le sujet, mais cette insistance n’exige pas ici un ajout lourd en français.
theological_decisions:
- issue: Rapport entre le détournement du mal, la conduite juste et la vie
  choice: Le méchant qui se détourne de sa méchanceté et pratique le droit et la justice vivra « par eux ».
  alternative: Expliciter que la vie dépend uniquement de la repentance, ou élargir la formule à une fidélité générale à l’alliance.
  rationale: La formulation maintient le lien explicite établi par le texte entre le changement de conduite, les actes justes et la vie, sans l’harmoniser avec un système doctrinal ultérieur.
- issue: Valeur de la préposition עַל dans עֲלֵיהֶם
  choice: par eux
  alternative: à cause d’eux ; sur eux
  rationale: Le contexte permet une nuance de moyen ou de fondement, mais la préposition reste suffisamment souple pour qu’une traduction française ne doive pas trancher davantage. La note signale cette ambiguïté.
translation_notes:
  register: Français moderne, sobre et digne. La répétition « méchant / méchanceté » reproduit le lien lexical hébreu. « Pratique le droit et la justice » est idiomatique dans un registre prophétique et éthique.
