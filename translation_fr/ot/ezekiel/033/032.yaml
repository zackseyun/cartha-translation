reference: Ezekiel 33:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִנְּ/ךָ֤ לָ/הֶם֙ כְּ/שִׁ֣יר עֲגָבִ֔ים יְפֵ֥ה ק֖וֹל וּ/מֵטִ֣ב נַגֵּ֑ן וְ/שָֽׁמְעוּ֙ אֶת דְּבָרֶ֔י/ךָ וְ/עֹשִׂ֥ים אֵינָ֖/ם אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/032.yaml
  text: Look[a], you are to them like a sensual song, with a beautiful voice and skillful playing; they hear your words, but they do not do them.
translation:
  language: fr
  text: Et te voilà pour eux comme une chanson sensuelle[a], chantée d’une belle voix et jouée avec talent. Ils entendent tes paroles, mais ils ne les mettent pas en pratique.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une chanson d’amour ». Le terme hébreu peut évoquer un désir passionné ou sensuel ; l’image souligne que les auditeurs traitent le message du prophète comme un divertissement séduisant.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנְּךָ
  choice: Et te voilà
  rationale: הִנֵּה attire l’attention et présente la manière dont les auditeurs perçoivent Ézéchiel. « Et te voilà » en conserve la force déictique dans un français naturel.
- source_word: לָהֶם
  choice: pour eux
  rationale: 'La préposition ל exprime ici le point de vue ou la perception des auditeurs : à leurs yeux, le prophète ressemble à une chanson séduisante.'
- source_word: כְּשִׁיר עֲגָבִים
  choice: comme une chanson sensuelle
  rationale: עֲגָבִים évoque des amours ou désirs passionnés, avec une possible nuance sensuelle ou moralement suspecte. « Chanson sensuelle » préserve cette séduction sans rendre l’expression inutilement explicite.
- source_word: יְפֵה קוֹל
  choice: chantée d’une belle voix
  rationale: L’expression décrit la beauté de la voix. L’ajout idiomatique de « chantée » rattache clairement cette qualité à la chanson sans changer l’image.
- source_word: וּמֵטִב נַגֵּן
  choice: et jouée avec talent
  rationale: Le participe hiphil de יטב associé à נגן indique une exécution musicale habile. « Jouée avec talent » restitue naturellement cette idée.
- source_word: וְשָׁמְעוּ אֶת־דְּבָרֶיךָ
  choice: Ils entendent tes paroles
  rationale: שׁמע désigne ici l’écoute effective du message, mise en contraste avec l’absence de mise en œuvre.
- source_word: וְעֹשִׂים אֵינָם אוֹתָם
  choice: mais ils ne les mettent pas en pratique
  rationale: La tournure hébraïque signifie littéralement qu’ils ne « font » pas les paroles. En français, « mettre en pratique » exprime clairement l’idée de les exécuter tout en conservant le contraste entre entendre et agir.
theological_decisions:
- issue: Nuance morale de עֲגָבִים
  choice: chanson sensuelle
  alternative: chanson d’amour
  rationale: Le public traite la parole prophétique comme une prestation attirante plutôt que comme un appel à obéir. « Sensuelle » conserve la nuance de désir passionné ou charnel possible dans le terme hébreu, tandis que « chanson d’amour » pourrait paraître trop neutre.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’image musicale et le contraste central entre l’écoute et la mise en pratique.
