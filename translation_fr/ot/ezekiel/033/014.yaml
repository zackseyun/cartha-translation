source:
  edition: WLC
  text: וּ/בְ/אָמְרִ֥/י לָֽ/רָשָׁ֖ע מ֣וֹת תָּמ֑וּת וְ/שָׁב֙ מֵֽ/חַטָּאת֔/וֹ וְ/עָשָׂ֥ה מִשְׁפָּ֖ט וּ/צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/014.yaml
  text: And when I say to the wicked man[a], ‘You shall surely die,’ and he turns from his sin and does justice and righteousness,
translation:
  language: fr
  text: 'Et quand je dis au méchant : « Tu mourras certainement », s’il se détourne de son péché et pratique le droit et la justice,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְאָמְרִי
  choice: Et quand je dis
  rationale: La construction avec בְּ et l’infinitif construit portant le suffixe de première personne a ici une valeur temporelle, rendue naturellement en français par « quand je dis ».
- source_word: לָרָשָׁע
  choice: au méchant
  rationale: רָשָׁע désigne une personne coupable ou mauvaise. « Au méchant » conserve le masculin singulier représentatif sans alourdir la phrase.
- source_word: מוֹת תָּמוּת
  choice: Tu mourras certainement
  rationale: L’infinitif absolu suivi du verbe conjugué renforce la certitude de la mort. « Certainement » restitue cette insistance en français moderne.
- source_word: וְשָׁב
  choice: s’il se détourne
  rationale: שׁוּב exprime ici l’abandon d’une conduite pécheresse. Dans la syntaxe française, « s’il » rend clairement la valeur conditionnelle que prend la coordination dans ce contexte, sans transformer l’énoncé en simple succession temporelle.
- source_word: מֵחַטָּאתוֹ
  choice: de son péché
  rationale: Traduction directe du nom singulier חַטָּאת avec suffixe masculin singulier.
- source_word: וְעָשָׂה
  choice: et pratique
  rationale: Avec des notions éthiques abstraites, « pratiquer » est plus idiomatique que « faire » tout en conservant l’idée d’une conduite effective.
- source_word: מִשְׁפָּט
  choice: le droit
  rationale: Dans ce contexte éthique, מִשְׁפָּט désigne ce qui est conforme au droit et à la justice, plutôt qu’un jugement judiciaire particulier.
- source_word: וּצְדָקָה
  choice: la justice
  rationale: צְדָקָה évoque la conduite juste et droite. « Justice » maintient sa distinction avec מִשְׁפָּט, ici rendu par « le droit ».
theological_decisions:
- issue: Masculin singulier représentatif de רָשָׁע
  choice: au méchant
  alternative: à la personne méchante
  rationale: Le français substantivé « le méchant » conserve sobrement le masculin singulier de l’hébreu et sa portée représentative.
- issue: Valeur logique de וְשָׁב après l’annonce de mort
  choice: s’il se détourne
  alternative: et qu’il se détourne
  rationale: La coordination hébraïque introduit, dans le contexte, le cas conditionnel d’un changement de conduite. « S’il » explicite cette relation nécessaire en français, sans ajouter une opposition adversative.
- issue: Distinction du couple מִשְׁפָּט וּצְדָקָה
  choice: le droit et la justice
  alternative: ce qui est juste et droit
  rationale: Deux termes distincts préservent la texture du couple hébraïque et évitent de fondre les deux notions en une seule expression.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste ouverte par une virgule, comme le verset source, dont la conséquence est donnée au verset suivant.
