  text: 'La parole de Yahweh me fut adressée en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans cette formule prophétique, le verbe היה introduit la venue de la parole divine. La tournure française « la parole… fut adressée » rend naturellement la formule sans conserver un lourd « et il arriva ».
- source_word: דְבַר
  choice: La parole
  rationale: « Parole » correspond au sens de דָּבָר dans la formule récurrente דְבַר־יְהוָה et maintient le lien avec la révélation prophétique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin יהוה au lieu de lui substituer un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » exprime idiomatiquement la préposition אֶל avec le suffixe de première personne.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: L’infinitif לֵאמֹר introduit les paroles directes qui suivent. Les deux-points et la formule « en ces termes » remplissent naturellement cette fonction en français.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le Tétragramme, nom propre divin. « Yahweh » le représente directement, tandis que « le SEIGNEUR » reflète la substitution traditionnelle à la lecture.
translation_notes:
  register: Français moderne, digne et courant. La formule passive « me fut adressée » est consacrée dans le registre prophétique sans être obscure; elle évite le calque peu naturel « la parole vint à moi ». Aucun marqueur de note n’est nécessaire.
