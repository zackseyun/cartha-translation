base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/024.yaml
  text: Son of man, the inhabitants of these ruins on the land of Israel are saying, ‘Abraham was only one man, yet he possessed the land; but we are many—the land has been given to us as a possession.’
translation:
  language: fr
  text: 'Fils d’homme, les habitants de ces ruines, sur le territoire d’Israël, disent : « Abraham n’était qu’un seul homme, et pourtant il a possédé le pays. Nous, nous sommes nombreux : le pays nous a été donné en possession. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: Fils d’homme
  rationale: Formule d’adresse récurrente d’Ézéchiel, rendue littéralement et naturellement dans le registre biblique français.
- source_word: יֹשְׁבֵי הֶחֳרָבוֹת
  choice: les habitants de ces ruines
  rationale: Préserve l’image concrète des lieux dévastés habités par les survivants.
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: sur le territoire d’Israël
  rationale: « Territoire » rend ici אַדְמָה comme sol ou territoire, tout en évitant la répétition avec הָאָרֶץ dans la citation.
- source_word: אֶחָד הָיָה אַבְרָהָם
  choice: Abraham était seul
  rationale: Dans ce raisonnement comparatif, אֶחָד souligne qu’Abraham n’était qu’un seul homme; « était seul » est idiomatique et conserve ce contraste.
- source_word: וַיִּירַשׁ אֶת־הָאָרֶץ
  choice: et pourtant il a pris possession du pays
  rationale: ירשׁ peut signifier hériter ou prendre possession. Ici, la possession du pays par Abraham fonde l’argument; « et pourtant » explicite le contraste porté par le contexte sans changer sa logique.
- source_word: לָנוּ נִתְּנָה הָאָרֶץ לְמוֹרָשָׁה
  choice: le pays nous a été donné en possession
  rationale: Conserve la voix passive et l’idée d’un bien attribué durablement, sans préciser explicitement l’agent sous-entendu.
theological_decisions:
- issue: Nature de la revendication fondée sur Abraham
  choice: Traduire directement les paroles des habitants sans les valider ni les corriger dans le verset
  alternative: Signaler dans la formulation même que leur raisonnement est illégitime
  rationale: Le texte rapporte leur revendication; la réponse divine et son évaluation viennent dans les versets suivants. La traduction ne doit pas anticiper ce jugement.
- issue: Agent de « nous a été donné »
  choice: Maintenir la tournure passive
  alternative: Rendre « Dieu nous a donné le pays »
  rationale: L’hébreu n’exprime pas l’agent. Même si un passif divin est plausible, le nommer supprimerait une ambiguïté réelle.
- issue: Sens de ירשׁ appliqué à Abraham
  choice: « a pris possession »
  alternative: « a hérité »
  rationale: « Hériter » pourrait suggérer en français qu’Abraham a reçu le pays d’un propriétaire humain décédé. « Prendre possession » convient mieux à l’affirmation des habitants, tout en gardant le lien lexical avec leur propre « possession ».
translation_notes:
  register: Français international moderne, clair et digne. La reprise « Nous, nous sommes nombreux » marque naturellement le contraste emphatique avec Abraham seul. La ponctuation distingue les deux étapes du raisonnement des habitants.
