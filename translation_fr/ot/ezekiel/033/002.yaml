source:
  edition: WLC
  text: בֶּן אָדָ֗ם דַּבֵּ֤ר אֶל בְּנֵֽי עַמְּ/ךָ֙ וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם אֶ֕רֶץ כִּֽי אָבִ֥יא עָלֶ֖י/הָ חָ֑רֶב וְ/לָקְח֨וּ עַם הָ/אָ֜רֶץ אִ֤ישׁ אֶחָד֙ מִ/קְצֵי/הֶ֔ם וְ/נָתְנ֥וּ אֹת֛/וֹ לָ/הֶ֖ם לְ/צֹפֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/002.yaml
  text: Son of man[a], speak to the sons of your people and say to them, ‘If I bring a sword upon a land, and the people of the land take one man from among them and appoint him as their watchman,’
translation:
  language: fr
  text: 'Fils d’homme, parle aux membres de ton peuple et dis-leur : « Si je fais venir l’épée[a] contre un pays, et que les gens du pays prennent parmi eux un homme et l’établissent comme leur guetteur, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une épée ». Dans l’hébreu, l’« épée » est une image courante de la guerre ou du jugement.'
    reason: La construction hébraïque est sans article, tandis que le français peut employer soit l’article défini pour l’image conventionnelle, soit l’indéfini pour une menace particulière.
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Formule d’adresse caractéristique du livre d’Ézéchiel. Cette expression traditionnelle conserve l’image hébraïque et sa fonction littéraire.
- source_word: בְּנֵי עַמְּךָ
  choice: les membres de ton peuple
  rationale: Littéralement « les fils de ton peuple ». En français actuel, cette tournure ne désigne pas naturellement l’ensemble des compatriotes du prophète ; « les membres de ton peuple » en restitue le sens collectif sans exclure les femmes.
- source_word: אֶרֶץ
  choice: un pays
  rationale: Le nom sans article introduit ici un cas général. « Un pays » est plus naturel en français moderne que « une terre » dans ce scénario.
- source_word: כִּי
  choice: Si
  rationale: La particule introduit un scénario général présenté comme une éventualité. « Si » rend clairement cette valeur, tout en laissant possible une nuance temporelle selon le contexte.
- source_word: אָבִיא עָלֶיהָ חָרֶב
  choice: je fais venir l’épée contre un pays
  rationale: La traduction garde l’image concrète de l’épée, qui évoque ici une attaque guerrière et, dans le contexte, le jugement, sans la remplacer directement par « guerre ».
- source_word: עַם הָאָרֶץ
  choice: les gens du pays
  rationale: Expression collective ordinaire dans ce contexte. « Les gens du pays » est clair et idiomatique, sans en faire un titre technique.
- source_word: אִישׁ אֶחָד
  choice: un homme
  rationale: L’hébreu emploie un nom masculin singulier. « Un homme » conserve cette précision, tandis que le contexte suffit à exprimer qu’il s’agit d’un seul individu.
- source_word: מִקְצֵיהֶם
  choice: parmi eux
  rationale: Dans cette expression, le terme désigne une personne prise au sein du groupe, plutôt que ses « extrémités » au sens spatial.
- source_word: וְנָתְנוּ אֹתוֹ לָהֶם לְצֹפֶה
  choice: l’établissent comme leur guetteur
  rationale: Cette formulation rend naturellement l’idée de désigner quelqu’un pour exercer la fonction de guetteur au service du groupe, fonction essentielle dans le contexte d’Ézéchiel 33.
theological_decisions:
- issue: Portée de l’image de l’épée
  choice: Conserver « l’épée » dans le texte
  alternative: Traduire explicitement par « la guerre » ou « une armée ennemie »
  rationale: L’épée est une image conventionnelle de la guerre ou du jugement, mais le texte garde cette image concrète. La traduire littéralement préserve sa force et évite de limiter son interprétation.
- issue: Langage collectif genré
  choice: « les membres de ton peuple » pour בְּנֵי עַמְּךָ, mais « un homme » pour אִישׁ אֶחָד
  alternative: « les fils de ton peuple » et « une personne »
  rationale: La première expression est un idiome collectif qui, rendu littéralement, serait trompeur ou peu naturel en français actuel ; la seconde désigne explicitement un individu masculin dans le scénario. Cette distinction respecte à la fois le sens et les formes pertinentes du texte.
translation_notes:
  register: Français international moderne, clair et digne. « Fils d’homme » et « guetteur » maintiennent les termes structurants du livre, tandis que « membres de ton peuple » et « gens du pays » évitent des calques peu naturels. La virgule finale à l’intérieur de la citation indique que la phrase et le scénario se poursuivent au verset suivant.
