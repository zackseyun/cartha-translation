id: EZK.33.18
reference: Ezekiel 33:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/שׁוּב צַדִּ֥יק מִ/צִּדְקָת֖/וֹ וְ/עָ֣שָׂה עָ֑וֶל וּ/מֵ֖ת בָּ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/018.yaml
  text: When a righteous man turns from his righteousness and does injustice[b][a], he shall die because of them.
translation:
  language: fr
  text: Quand un homme juste se détourne de sa justice et commet l’injustice, il mourra à cause de ces actes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּשׁוּב
  choice: Quand … se détourne
  rationale: La préposition ב avec l’infinitif construit introduit une proposition temporelle. Dans ce contexte, שוב suivi de מן exprime l’abandon d’une conduite antérieure; « se détourne de » est naturel et précis en français.
- source_word: צַדִּיק
  choice: un homme juste
  rationale: L’adjectif masculin singulier substantivé désigne ici un individu de sexe masculin. « Un homme juste » conserve cette forme et convient au caractère général de l’énoncé.
- source_word: מִצִּדְקָתוֹ
  choice: de sa justice
  rationale: צדקה désigne ici la justice morale ou la conduite juste de cet homme. « Sa justice » conserve le lien lexical avec « juste » sans réduire le sens à un acte isolé.
- source_word: וְעָשָׂה עָוֶל
  choice: et commet l’injustice
  rationale: עשה avec עָוֶל signifie faire ou commettre ce qui est injuste. « Commet l’injustice » est idiomatique, digne et garde le contraste avec la justice.
- source_word: וּמֵת
  choice: il mourra
  rationale: Dans cette formulation conditionnelle, la forme verbale exprime le résultat certain. Le futur français rend clairement cette conséquence solennelle.
- source_word: בָּהֶם
  choice: à cause de ces actes
  rationale: La préposition avec le suffixe pluriel signifie littéralement « en eux » ou « par eux ». Le pluriel renvoie naturellement aux actes injustes envisagés collectivement; l’explicitation « ces actes » transmet la valeur causale sans ambiguïté pronominale.
theological_decisions:
- issue: Nature de la mort et portée doctrinale du retournement de l’homme juste
  choice: 'Traduire simplement la conséquence affirmée: « il mourra », sans préciser s’il s’agit uniquement d’une mort temporelle ni définir la condition spirituelle ultime de l’homme.'
  alternative: Interpréter explicitement le verset soit comme la perte du salut, soit comme un jugement exclusivement temporel dans le cadre de l’alliance.
  rationale: L’hébreu affirme le retournement moral, l’injustice et la mort qui en résulte, mais ne tranche pas ici les catégories doctrinales ultérieures. La traduction préserve donc cette tension.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste proche de la structure hébraïque tout en évitant le calque obscur « il mourra en eux ». Aucun marqueur de note n’est requis, puisqu’aucune note n’est proposée.
