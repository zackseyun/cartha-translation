revisions:
- from: 'Quand je dis au méchant : « Méchant, tu mourras certainement ! » et que tu ne prends pas la parole pour l’avertir de renoncer à sa conduite, ce méchant mourra à cause de sa faute, mais je te redemanderai son sang[a].'
  to: 'Quand je dis au méchant : « Méchant, tu mourras certainement ! » et que tu ne parles pas pour l’avertir de renoncer à sa conduite, ce méchant mourra pour sa faute, mais je te demanderai compte de son sang[a].'
  rationale: 'La révision remplace une expression française qui implique à tort une répétition par une formulation idiomatique de responsabilité. Elle maintient la double affirmation du verset : le méchant meurt pour sa propre faute, et celui qui n’a pas averti est tenu responsable de son omission.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:00:17Z'
review_pass:
  verdict: revise
  source_fidelity: 'La structure et les éléments essentiels sont bien rendus : l’adresse au méchant, la certitude de la mort, le défaut d’avertissement, la responsabilité du méchant et celle de la sentinelle. Toutefois, « je te redemanderai son sang » suggère indûment une demande répétée et ne rend pas naturellement l’idiome hébreu de mise en cause. « Je te demanderai compte de son sang » exprime précisément la responsabilité recherchée, tout en gardant l’image du sang.'
  naturalness: Le français est globalement clair et solennel. « Tu ne parles pas pour l’avertir » est plus direct et plus naturel ici que « tu ne prends pas la parole », sans changement de sens. La formulation révisée conserve un registre biblique moderne international.
  terminology: « Méchant », « faute » et « sang » conviennent au registre et au sens. La note doit présenter l’image littérale de la main plutôt que paraphraser seulement « sa mort », puisque le texte source emploie explicitement le sang.
  issues:
  - severity: medium
    issue: « je te redemanderai son sang »
    rationale: Le préfixe re- introduit l’idée non attestée d’une demande antérieure. En français moderne, l’expression est en outre moins idiomatique pour l’hébreu וְדָמוֹ מִיָּדְךָ אֲבַקֵּשׁ, qui signifie que Dieu tiendra le destinataire responsable du sang versé.
  - severity: low
    issue: Note de bas de page insuffisamment liée à l’image source
    rationale: La note actuelle explicite correctement l’idée de responsabilité, mais « de sa mort » remplace l’image explicite du « sang » et omet « de ta main ». Une note peut donner à la fois la formulation littérale et son sens.
  revised_text: 'Quand je dis au méchant : « Méchant, tu mourras certainement ! » et que tu ne parles pas pour l’avertir de renoncer à sa conduite, ce méchant mourra pour sa faute, mais je te demanderai compte de son sang[a].'
  revised_footnotes:
