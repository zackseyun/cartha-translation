    reason: Explicite l’idiome hébreu de responsabilité tout en préservant dans le texte l’image du sang.
  revision_rationale: 'La révision remplace une expression française qui implique à tort une répétition par une formulation idiomatique de responsabilité. Elle maintient la double affirmation du verset : le méchant meurt pour sa propre faute, et celui qui n’a pas averti est tenu responsable de son omission.'
