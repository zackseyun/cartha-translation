source:
  edition: WLC
  text: בְּ/אָמְרִ֣/י לָ/רָשָׁ֗ע רָשָׁע֙ מ֣וֹת תָּמ֔וּת וְ/לֹ֣א דִבַּ֔רְתָּ לְ/הַזְהִ֥יר רָשָׁ֖ע מִ/דַּרְכּ֑/וֹ ה֤וּא רָשָׁע֙ בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/דָמ֖/וֹ מִ/יָּדְ/ךָ֥ אֲבַקֵּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/008.yaml
  text: When I say to the wicked[a], ‘Wicked one, you shall surely die,’ and you do not speak to warn the wicked from his way, that wicked man shall die in his iniquity, but I will require his blood from your hand.
translation:
  language: fr
  text: 'Quand je dis au méchant : « Méchant, tu mourras certainement ! » et que tu ne parles pas pour l’avertir de renoncer à sa conduite, ce méchant mourra pour sa faute, mais je te demanderai compte de son sang[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je réclamerai son sang de ta main » ; c’est-à-dire : « je te tiendrai pour responsable de sa mort ».'
    reason: Explicite l’idiome hébreu de responsabilité tout en préservant dans le texte l’image du sang.
lexical_decisions:
- source_word: בְּאָמְרִי
  choice: Quand je dis
  rationale: La préposition בְּ avec la forme infinitive introduit ici une proposition temporelle; cette tournure est naturelle en français.
- source_word: לָרָשָׁע / רָשָׁע
  choice: au méchant / Méchant
  rationale: רָשָׁע désigne ici une personne moralement mauvaise; la répétition conserve l’adresse directe et solennelle de l’hébreu.
- source_word: מוֹת תָּמוּת
  choice: tu mourras certainement
  rationale: L’infinitif absolu suivi de l’imparfait renforce la certitude de la mort annoncée.
- source_word: וְלֹא דִבַּרְתָּ
  choice: et que tu ne prends pas la parole
  rationale: Dans cette construction temporelle et conditionnelle, le français au présent rend naturellement la situation envisagée; « prendre la parole » souligne l’omission de l’avertissement.
- source_word: לְהַזְהִיר רָשָׁע מִדַּרְכּוֹ
  choice: pour l’avertir de renoncer à sa conduite
  rationale: Le hiphil de זהר signifie « avertir ». Avec מִן, l’avertissement vise à éloigner le méchant de sa manière de vivre; « conduite » exprime naturellement en français la métaphore de la voie.
- source_word: הוּא רָשָׁע
  choice: ce méchant
  rationale: Le pronom suivi du nom reprend le sujet avec emphase; « ce méchant » conserve cette insistance sans lourdeur excessive.
- source_word: בַּעֲוֺנוֹ
  choice: à cause de sa faute
  rationale: עָוֹן peut désigner la faute, la perversité ou la culpabilité qui en résulte. Ici, la tournure française explicite naturellement que sa mort est liée à sa propre faute.
- source_word: וְדָמוֹ מִיָּדְךָ אֲבַקֵּשׁ
  choice: mais je te redemanderai son sang
  rationale: Cette formule hébraïque exprime l’obligation de rendre compte d’une mort. « Redemander son sang » conserve l’image biblique tout en restant intelligible; la note en donne le sens explicite.
theological_decisions:
- issue: Responsabilité du guetteur qui omet d’avertir
  choice: Le méchant meurt à cause de sa propre faute, tandis que celui qui devait l’avertir doit aussi répondre de son silence.
  alternative: Comprendre que le guetteur porte la faute du méchant à sa place, ou que sa responsabilité n’est que rhétorique.
  rationale: Le texte maintient conjointement la responsabilité personnelle du méchant et la responsabilité réelle du guetteur. La traduction conserve cette tension sans assimiler l’une à l’autre.
translation_notes:
  register: Français international moderne, clair et solennel. La répétition de « méchant » et l’image du sang sont conservées pour maintenir la force rhétorique et judiciaire du texte hébreu.
