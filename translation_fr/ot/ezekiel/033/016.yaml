  text: כָּל חטאת/ו אֲשֶׁ֣ר חָטָ֔א לֹ֥א תִזָּכַ֖רְנָה ל֑/וֹ מִשְׁפָּ֧ט וּ/צְדָקָ֛ה עָשָׂ֖ה חָי֥וֹ יִֽחְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/016.yaml
  text: None of the sins that he committed will be remembered against him[a]; he has done justice and righteousness; he shall surely live.
translation:
  language: fr
  text: 'Aucun des péchés qu’il a commis ne sera retenu contre lui[a]. Il a pratiqué le droit et la justice : il vivra, oui, il vivra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ne lui seront pas rappelés ». Littéralement : « ne lui seront pas rappelés », avec ici une portée judiciaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל חטאתו אֲשֶׁר חָטָא
  choice: Aucun des péchés qu’il a commis
  rationale: Le nom est morphologiquement singulier, mais כָּל, la proposition relative et le verbe féminin pluriel donnent ici un sens collectif et distributif. Le pluriel est naturel en français.
- source_word: לֹא תִזָּכַרְנָה לוֹ
  choice: ne sera retenu contre lui
  rationale: La tournure française exprime naturellement la portée judiciaire de « ne pas être rappelé à son sujet », sans aller au-delà du contexte.
- source_word: מִשְׁפָּט וּצְדָקָה
  choice: le droit et la justice
  rationale: Dans cette paire prophétique, מִשְׁפָּט désigne la conduite conforme au droit et צְדָקָה la droiture ou justice morale. Cette formulation française reste concise et traditionnelle sans être archaïque.
- source_word: עָשָׂה
  choice: a pratiqué
  rationale: Avec « le droit et la justice », « pratiquer » rend idiomatiquement l’exercice concret de la conduite juste.
- source_word: חָיוֹ יִחְיֶה
  choice: il vivra, oui, il vivra
  rationale: La reprise rend l’intensification produite par l’infinitif absolu suivi de l’imparfait, dans un français actuel et solennel.
theological_decisions:
- issue: Portée judiciaire du non-souvenir des péchés
  choice: ne sera retenu contre lui
  alternative: ne sera pas rappelé à son sujet
  rationale: Le contexte indique que les fautes antérieures ne sont plus prises en compte contre la personne repentante. La traduction garde cette nuance judiciaire sans introduire une formulation doctrinale étrangère au verset.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’accent solennel de la conclusion hébraïque et évite un vocabulaire confessionnel spécialisé.
