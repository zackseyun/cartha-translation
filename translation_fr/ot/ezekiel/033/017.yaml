id: EZK.33.17
reference: Ezekiel 33:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אָמְרוּ֙ בְּנֵ֣י עַמְּ/ךָ֔ לֹ֥א יִתָּכֵ֖ן דֶּ֣רֶךְ אֲדֹנָ֑/י וְ/הֵ֖מָּה דַּרְכָּ֥/ם לֹֽא יִתָּכֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/017.yaml
  text: Yet the sons of your people say[a], ‘The way of the Lord is not just,’ though it is their own way that is not just.
translation:
  language: fr
  text: 'Pourtant, les membres de ton peuple disent : « La manière d’agir du Seigneur n’est pas juste[a] », alors que c’est leur propre manière d’agir qui n’est pas juste.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « n’est pas droite » ou « n’est pas équitable », ici et à la fin du verset.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Pourtant, … disent
  rationale: La conjonction et la forme verbale poursuivent le discours avec une nuance de contraste; « Pourtant » rend naturellement cette valeur dans le contexte.
- source_word: בְּנֵי עַמְּךָ
  choice: les membres de ton peuple
  rationale: Littéralement « les fils de ton peuple »; en français actuel, l’expression désigne naturellement les membres du peuple sans laisser entendre qu’il s’agit uniquement des hommes ou des descendants directs.
- source_word: לֹא יִתָּכֵן
  choice: n’est pas juste
  rationale: Le niphal de תכן exprime ici ce qui est juste, droit ou équitable. « N’est pas juste » convient à l’accusation morale portée dans ce contexte et permet de conserver exactement la reprise rhétorique.
- source_word: דֶּרֶךְ אֲדֹנָי
  choice: la manière d’agir du Seigneur
  rationale: Ici, דֶּרֶךְ désigne la conduite ou la façon d’agir plutôt qu’un chemin matériel. Cette formulation française est claire et préserve le sens métaphorique.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Le texte porte le titre divin אֲדֹנָי, rendu selon l’usage français courant par « le Seigneur ».
- source_word: וְהֵמָּה
  choice: alors que c’est leur propre
  rationale: Le pronom est emphatique et contrastif. La tournure française fait ressortir le renversement de l’accusation vers ceux qui la formulent.
- source_word: דַּרְכָּם
  choice: leur propre manière d’agir
  rationale: « Propre » explicite sans surinterprétation l’opposition emphatique entre la manière d’agir du Seigneur et la leur.
theological_decisions:
- issue: Évaluation morale de la « voie » du Seigneur
  choice: Rendre les deux occurrences de לֹא יִתָּכֵן par « n’est pas juste »
  alternative: « n’est pas droite » ou « n’est pas équitable »
  rationale: Le contexte concerne la justice divine et la responsabilité humaine. La répétition identique conserve la tension théologique et le renversement rhétorique du texte hébreu sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. « Manière d’agir » rend le sens moral de דֶּרֶךְ avec plus de naturel que le calque « voie »; la structure contrastive et la répétition du jugement sont conservées.
