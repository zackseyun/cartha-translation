source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֕ם לֹ֥א יִתָּכֵ֖ן דֶּ֣רֶךְ אֲדֹנָ֑/י אִ֧ישׁ כִּ/דְרָכָ֛י/ו אֶשְׁפּ֥וֹט אֶתְ/כֶ֖ם בֵּ֥ית יִשְׂרָאֵֽלפ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/020.yaml
  text: Yet you say[a], ‘The way of the Lord is not just.’ I will judge each of you according to his ways[b], O house of Israel.
translation:
  language: fr
  text: 'Pourtant, vous dites[a] : « La manière d’agir du Seigneur n’est pas juste. » Je jugerai chacun de vous selon sa conduite[b], maison d’Israël.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mais vous dites » ou « Et vous dites ».'
    reason: La conjonction hébraïque peut simplement poursuivre le propos ou, dans ce contexte, marquer une opposition.
  - marker: b
    text: 'Littéralement : « un homme, selon ses voies ». La formulation souligne que chaque personne est jugée d’après sa propre conduite.'
    reason: La note signale le singulier distributif « un homme » et le pluriel idiomatique hébreu « ses voies ».
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: Pourtant, vous dites
  rationale: 'Le waw poursuit le discours avec une nuance d’opposition : Israël maintient son accusation malgré la défense précédente de la justice divine. « Pourtant » rend naturellement ce contraste.'
- source_word: לֹא יִתָּכֵן
  choice: n’est pas juste
  rationale: Dans cet emploi, le niphal de תכן qualifie ce qui est tenu pour droit, équitable ou bien réglé. Le contexte porte sur l’équité du jugement divin ; « juste » conserve cette portée morale et judiciaire.
- source_word: דֶּרֶךְ אֲדֹנָי
  choice: la manière d’agir du Seigneur
  rationale: דֶּרֶךְ désigne métaphoriquement la manière d’agir. Cette formulation française actuelle rend le sens plus clairement que le calque « la voie du Seigneur » dans le contexte de l’accusation.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Le texte porte le titre divin Adonaï, et non le tétragramme. « Le Seigneur » est son équivalent français usuel.
- source_word: אִישׁ כִּדְרָכָיו
  choice: chacun de vous selon sa conduite
  rationale: אִישׁ a ici une force distributive et souligne la responsabilité individuelle. Le singulier « chacun… sa conduite » maintient cette individualisation, tandis que « conduite » exprime naturellement le pluriel idiomatique hébreu « ses voies ».
- source_word: אֶשְׁפּוֹט אֶתְכֶם
  choice: Je jugerai chacun de vous
  rationale: Le verbe שׁפט est judiciaire. « Chacun de vous » explicite la valeur distributive de אִישׁ sans alourdir le français.
- source_word: בֵּית יִשְׂרָאֵל
  choice: maison d’Israël
  rationale: L’expression désigne collectivement le peuple d’Israël et fonctionne ici comme une apostrophe prophétique.
theological_decisions:
- issue: L’accusation portée contre la manière dont Dieu juge
  choice: La manière d’agir du Seigneur n’est pas juste
  alternative: La manière d’agir du Seigneur n’est pas équitable / n’est pas droite
  rationale: « Juste » garde la dimension morale et judiciaire du reproche sans préciser abusivement si celui-ci vise surtout l’équité, la rectitude ou la régularité du jugement.
- issue: La responsabilité individuelle au sein d’une adresse collective
  choice: Je jugerai chacun de vous selon sa conduite, maison d’Israël
  alternative: Je vous jugerai chacun selon vos voies, maison d’Israël
  rationale: Le texte associe l’adresse collective « maison d’Israël » à des termes distributifs au singulier. La traduction conserve cette tension en individualisant le jugement tout en maintenant l’apostrophe collective.
translation_notes:
  register: Français international moderne, clair et digne. « La manière d’agir » et « sa conduite » rendent les métaphores hébraïques de la voie sans obscurité, tandis que les notes conservent les formes et nuances pertinentes de l’original.
