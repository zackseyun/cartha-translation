  text: לָ/כֵן֩ אֱמֹ֨ר אֲלֵי/הֶ֜ם כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה עַל הַ/דָּ֧ם תֹּאכֵ֛לוּ וְ/עֵינֵ/כֶ֛ם תִּשְׂא֥וּ אֶל גִּלּוּלֵי/כֶ֖ם וְ/דָ֣ם תִּשְׁפֹּ֑כוּ וְ/הָ/אָ֖רֶץ תִּירָֽשׁוּ־׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/025.yaml
  text: 'Therefore say to them[a], ‘Thus says the Lord GOD: You eat with the blood, and you lift up your eyes to your idols, and you shed blood[c][b]; shall you then possess the land?’'
translation:
  language: fr
  text: 'C’est pourquoi, dis-leur : « Voici ce que dit le Seigneur Yahweh : Vous mangez avec le sang[a], vous levez les yeux vers vos idoles[b] et vous répandez le sang ; et vous prendriez possession du pays[c] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Vous mangez avec ou sur le sang. » L’expression désigne probablement la consommation de viande contenant encore son sang, en violation de l’interdiction concernant le sang.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « idoles » est un terme méprisant fréquemment employé par Ézéchiel.
    reason: cultural_note
  - marker: c
    text: 'Ou : « et pourtant, vous prendriez possession du pays ? » La dernière proposition hébraïque a ici la force probable d’une question indignée.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן אֱמֹר אֲלֵיהֶם
  choice: C’est pourquoi, dis-leur
  rationale: Conserve le lien logique avec le contexte précédent et la formulation directe de la mission prophétique.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Voici ce que dit le Seigneur Yahweh
  rationale: Formule prophétique naturelle en français moderne ; « Yahweh » représente le nom divin, tandis que אֲדֹנָי est rendu par « le Seigneur ».
- source_word: עַל הַדָּם תֹּאכֵלוּ
  choice: Vous mangez la viande avec son sang
  rationale: Explicite le complément implicite « viande » afin que l’expression soit intelligible en français, tout en conservant la référence concrète au sang.
- source_word: וְעֵינֵיכֶם תִּשְׂאוּ אֶל גִּלּוּלֵיכֶם
  choice: vous levez les yeux vers vos idoles
  rationale: Préserve l’image hébraïque du regard dirigé vers les idoles, avec sa possible valeur de recours ou de dévotion.
- source_word: גִּלּוּלֵיכֶם
  choice: vos idoles
  rationale: Équivalent français naturel ; une note signale la nuance méprisante propre au terme favori d’Ézéchiel.
- source_word: וְדָם תִּשְׁפֹּכוּ
  choice: vous répandez le sang
  rationale: Expression française courante correspondant à l’hébreu pour désigner le meurtre ou la violence meurtrière.
- source_word: וְהָאָרֶץ תִּירָשׁוּ
  choice: prétendriez-vous alors prendre possession du pays ?
  rationale: Rend la force rhétorique indignée suggérée par le contexte, sans transformer la revendication du pays en promesse divine.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU / le Seigneur, l’Éternel
  rationale: Distingue le titre אֲדֹנָי du nom propre יהוה et conserve explicitement le nom divin présent dans le texte hébreu.
- issue: Force de la proposition finale וְהָאָרֶץ תִּירָשׁוּ
  choice: 'question rhétorique indignée : « prétendriez-vous alors prendre possession du pays ? »'
  alternative: 'proposition coordonnée : « et vous prendrez possession du pays »'
  rationale: Dans cette réprimande, la forme verbale et l’enchaînement contestent l’attente des habitants plutôt qu’ils ne leur garantissent le pays ; la formulation interrogative conserve néanmoins la tension implicite de l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe prophétique reste reconnaissable sans être archaïque. Les trois appels de note figurent dans le texte dans l’ordre a, b, c.
