revisions:
- from: Mais si la sentinelle voit venir l’épée et ne sonne pas du cor[a], de sorte que le peuple n’est pas averti, et que l’épée survient et emporte l’un d’eux, celui-ci est emporté à cause de sa faute, mais je demanderai compte de son sang à la sentinelle[b].
  to: Mais si la sentinelle voit venir l’épée et ne sonne pas du cor, et que le peuple n’est pas averti[a], et que l’épée survient et emporte l’un d’eux, celui-ci est emporté à cause de sa faute, mais je demanderai compte de son sang à la sentinelle[b].
  rationale: La révision retire l’inférence causale explicite de « de sorte que », conserve la coordination du texte source et déplace l’alternative lexicale au marqueur qui suit « n’est pas averti ». Elle maintient sans les résoudre la responsabilité de la victime pour sa faute et celle de la sentinelle pour son absence d’alerte.
