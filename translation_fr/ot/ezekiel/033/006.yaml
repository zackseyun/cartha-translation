  text: וְ֠/הַ/צֹּפֶה כִּֽי יִרְאֶ֨ה אֶת הַ/חֶ֜רֶב בָּאָ֗ה וְ/לֹֽא תָקַ֤ע בַּ/שּׁוֹפָר֙ וְ/הָ/עָ֣ם לֹֽא נִזְהָ֔ר וַ/תָּב֣וֹא חֶ֔רֶב וַ/תִּקַּ֥ח מֵ/הֶ֖ם נָ֑פֶשׁ ה֚וּא בַּ/עֲוֺנ֣/וֹ נִלְקָ֔ח וְ/דָמ֖/וֹ מִ/יַּֽד הַ/צֹּפֶ֥ה אֶדְרֹֽשׁ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/006.yaml
  text: But if the watchman sees the sword coming and does not blow the trumpet[a], and the people are not warned, and the sword comes and takes a life from among them, that one is taken away in his iniquity[b], but I will require his blood from the watchman's hand.
translation:
  language: fr
  text: Mais si la sentinelle voit venir l’épée et ne sonne pas du cor, et que le peuple n’est pas averti[a], et que l’épée survient et emporte l’un d’eux, celui-ci est emporté à cause de sa faute, mais je demanderai compte de son sang à la sentinelle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le peuple ne tient pas compte de l’avertissement ». L’hébreu peut désigner soit l’absence d’avertissement, soit le fait de ne pas y prêter attention; le texte principal suit le sens passif, dans le contexte où la sentinelle n’a pas sonné du cor.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « je réclamerai son sang de la main de la sentinelle ». Cette expression juridique indique que Dieu tiendra la sentinelle responsable de cette mort.'
    reason: cultural_note
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: la sentinelle
  rationale: Désigne la personne chargée de surveiller et de donner l’alerte. « Sentinelle » est naturel en français moderne et convient à la métaphore prophétique d’Ézéchiel 33.
- source_word: כִּי יִרְאֶה
  choice: si ... voit
  rationale: כִּי introduit ici le cas conditionnel envisagé dans cette formulation de responsabilité.
- source_word: הַחֶרֶב בָּאָה
  choice: voit venir l’épée
  rationale: Conserve l’image concrète de l’épée, qui représente ici une attaque ou un jugement violent, sans expliciter davantage que l’hébreu.
- source_word: תָקַע בַּשּׁוֹפָר
  choice: sonne ... du cor
  rationale: Le שׁוֹפָר est un cor utilisé notamment pour donner l’alerte. « Sonner du cor » restitue l’instrument ancien et l’action idiomatique en français.
- source_word: וְהָעָם לֹא נִזְהָר
  choice: de sorte que le peuple n’est pas averti
  rationale: Le nifal de זהר peut signifier « être averti » ou « tenir compte de l’avertissement ». Le lien causal avec l’absence de sonnerie favorise ici le passif, tout en signalant l’autre possibilité en note.
- source_word: וַתִּקַּח מֵהֶם נָפֶשׁ
  choice: emporte l’un d’eux
  rationale: נֶפֶשׁ désigne ici une personne ou une vie parmi le peuple. Cette formulation française exprime naturellement la mort causée par l’épée.
- source_word: הוּא ... נִלְקָח
  choice: celui-ci est emporté
  rationale: Le démonstratif reprend clairement l’individu singulier mentionné, et « est emporté » rend le passif de לקח dans ce contexte de mort.
- source_word: בַּעֲוֺנוֹ
  choice: à cause de sa faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou ses conséquences. « À cause de sa faute » exprime ici la responsabilité propre de la victime sans charger le français d’un archaïsme.
- source_word: דָּמוֹ
  choice: son sang
  rationale: Le terme concret est maintenu parce qu’il appartient à une formule juridique et morale de responsabilité pour une mort.
- source_word: מִיַּד הַצֹּפֶה אֶדְרֹשׁ
  choice: je demanderai compte ... à la sentinelle
  rationale: דרשׁ מן־יד est une tournure juridique par laquelle Dieu exige réparation ou tient quelqu’un responsable. La formulation choisie est claire en français, tandis qu’une note explique l’image littérale de la « main ».
theological_decisions:
- issue: Responsabilité respective de la victime et de la sentinelle
  choice: Maintenir ensemble la faute propre de la personne emportée et la responsabilité réelle de la sentinelle qui n’a pas averti.
  alternative: Faire porter à la sentinelle la faute de la victime, ou présenter la défaillance de la sentinelle comme l’unique cause morale de la mort.
  rationale: L’hébreu affirme simultanément que la personne est emportée dans ou à cause de sa faute et que Dieu réclamera son sang à la sentinelle. La traduction préserve cette tension sans transformer l’une des responsabilités en transfert de culpabilité.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure conditionnelle et l’image de l’épée. « Sentinelle » et « cor » évitent un registre trop archaïque tout en gardant la couleur historique. Les marqueurs [a] et [b] figurent dans le texte principal.
