lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans cette formule prophétique, le verbe introduit la venue de la parole divine. En français naturel, « me fut adressée » exprime idiomatiquement l’événement sans recourir au calque lourd « il arriva que ».
- source_word: דְבַר
  choice: la parole
  rationale: « La parole » conserve la formule prophétique traditionnelle et la portée révélatrice du terme, tout en restant claire en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte hébreu emploie directement le nom divin YHWH ; « Yahweh » le représente comme un nom propre plutôt que de lui substituer un titre.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « me fut adressée » rend naturellement la préposition hébraïque avec le suffixe de première personne.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Cette formule introduit les paroles qui suivent. « En ces termes » en restitue la fonction avec dignité et naturel, sans laisser en suspens le participe « disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme comme nom personnel. Le rendre par « Yahweh » préserve cette donnée du texte source sans la remplacer par le titre « Seigneur ».
translation_notes:
  register: Français moderne, sobre et digne. La formulation conserve le caractère solennel de l’introduction prophétique tout en évitant un calque syntaxique de l’hébreu.
