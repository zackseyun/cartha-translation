  text: וַ/יְהִ֞י בִּ/שְׁתֵּ֧י עֶשְׂרֵ֣ה שָׁנָ֗ה בָּ/עֲשִׂרִ֛י בַּ/חֲמִשָּׁ֥ה לַ/חֹ֖דֶשׁ לְ/גָלוּתֵ֑/נוּ בָּא אֵלַ֨/י הַ/פָּלִ֧יט מִ/ירוּשָׁלִַ֛ם לֵ/אמֹ֖ר הֻכְּתָ֥ה הָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/021.yaml
  text: And it happened in the twelfth year[a], in the tenth month, on the fifth day of the month of our exile, that the fugitive from Jerusalem came to me, saying[b], “The city has been struck down.”
translation:
  language: fr
  text: 'La douzième année de notre exil, le cinquième jour du dixième mois, un rescapé[a] de Jérusalem vint auprès de moi et dit : « La ville a été frappée[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui s’était échappé » ; ou « le survivant ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « La ville est tombée ». L’hébreu dit plus littéralement : « a été frappée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: La douzième année… vint
  rationale: La tournure narrative hébraïque ouvre un nouvel épisode. En français actuel, elle s’intègre naturellement à la proposition datée sans qu’il soit nécessaire de traduire littéralement « il arriva que ».
- source_word: בִּשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: La douzième année
  rationale: Formulation française normale pour cette indication chronologique.
- source_word: בָּעֲשִׂרִי
  choice: le dixième mois
  rationale: Le mot « mois », sous-entendu en hébreu et explicité dans la proposition suivante, est ajouté pour rendre la date claire en français.
- source_word: בַּחֲמִשָּׁה לַחֹדֶשׁ
  choice: le cinquième jour du mois
  rationale: Rendu idiomatique de la formule hébraïque de datation.
- source_word: לְגָלוּתֵנוּ
  choice: de notre exil
  rationale: « Exil » exprime clairement et sobrement la déportation et la condition des personnes déplacées.
- source_word: הַפָּלִיט
  choice: le rescapé
  rationale: Le nom désigne celui qui a échappé au désastre. « Rescapé » convient mieux ici que « fugitif », qui peut suggérer en français une personne recherchée par la justice, tout en laissant en note l’autre nuance possible.
- source_word: מִירוּשָׁלַם
  choice: de Jérusalem
  rationale: Traduction directe du complément d’origine.
- source_word: בָּא אֵלַי
  choice: vint me trouver
  rationale: Expression naturelle en français pour la venue du rescapé auprès du prophète.
- source_word: לֵאמֹר
  choice: et dit
  rationale: Le français rend naturellement l’infinitif hébraïque introduisant le discours direct par un verbe conjugué.
- source_word: הֻכְּתָה
  choice: est tombée
  rationale: Dans ce contexte militaire, cette expression française indique naturellement que la ville a été vaincue ou prise. Une note conserve le sens passif plus littéral, « a été frappée ».
- source_word: הָעִיר
  choice: la ville
  rationale: Le référent est Jérusalem, mais le texte hébreu dit simplement « la ville »; cette formulation est donc conservée.
