  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם בְּנֵ֣י עַמְּ/ךָ֗ הַ/נִּדְבָּרִ֤ים בְּ/ךָ֙ אֵ֣צֶל הַ/קִּיר֔וֹת וּ/בְ/פִתְחֵ֖י הַ/בָּתִּ֑ים וְ/דִבֶּר חַ֣ד אֶת אַחַ֗ד אִ֤ישׁ אֶת אָחִי/ו֙ לֵ/אמֹ֔ר בֹּֽאוּ נָ֣א וְ/שִׁמְע֔וּ מָ֣ה הַ/דָּבָ֔ר הַ/יּוֹצֵ֖א מֵ/אֵ֥ת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/030.yaml
  text: And you[a], son of man, the sons of your people who talk about you beside the walls and in the doorways of the houses, each one speaking with another, each man with his brother, saying[b], ‘Come now and hear what the word is that comes from Yahweh.’
translation:
  language: fr
  text: 'Et toi, fils d’homme, les gens de ton peuple parlent de toi près des murs et aux entrées des maisons ; chacun parle à son frère en disant : « Venez donc écouter quelle est la parole qui vient de Yahweh[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « quelle est la parole qui sort de Yahweh ». On peut aussi comprendre au début du verset : « parlent avec toi », mais le contexte suggère plutôt qu’ils parlent d’Ézéchiel entre eux.'
    reason: La note conserve l’image directionnelle de יָצָא et signale l’ambiguïté grammaticale de הַנִּדְבָּרִים בְּךָ, sans attribuer à מֵאֵת le sens spatial inexact de « d’auprès de ».
lexical_decisions:
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: Formule d’adresse caractéristique du livre d’Ézéchiel, conservée littéralement en français pour préserver sa force rhétorique.
- source_word: בְּנֵי עַמְּךָ
  choice: les gens de ton peuple
  rationale: L’expression hébraïque désigne ici les membres du peuple. Cette formulation actuelle évite le calque peu naturel « les fils de ton peuple » sans élargir le référent.
- source_word: הַנִּדְבָּרִים בְּךָ
  choice: parlent de toi
  rationale: Avec la préposition ב, le contexte indique plus probablement qu’ils parlent d’Ézéchiel entre eux. L’autre analyse possible est signalée en note.
- source_word: אֵצֶל הַקִּירוֹת וּבְפִתְחֵי הַבָּתִּים
  choice: près des murs et aux portes des maisons
  rationale: Rend naturellement les lieux où se tiennent ces conversations; « aux portes » exprime ici les entrées ou embrasures des maisons.
- source_word: וְדִבֶּר חַד אֶת אַחַד אִישׁ אֶת אָחִיו
  choice: Ils se parlent l’un à l’autre, chacun à son frère
  rationale: Préserve le parallélisme distributif et le terme familial concret אָחִיו, tout en donnant une syntaxe française claire.
- source_word: בֹּאוּ נָא וְשִׁמְעוּ
  choice: Venez donc écouter
  rationale: « donc » rend ici l’invitation pressante de נָא; « écouter » convient mieux que « entendre » à l’action volontaire demandée.
- source_word: מָה הַדָּבָר הַיּוֹצֵא מֵאֵת יְהוָה
  choice: quelle parole vient de Yahweh
  rationale: « parole » maintient le registre prophétique de דָּבָר. En français, « vient de » exprime naturellement l’origine divine, tandis que la note signale l’image plus littérale de la parole qui sort d’auprès de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin plutôt que substitution par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, nom propre du Dieu d’Israël; sa transcription préserve cette distinction sans lui substituer un titre.
- issue: Nature de la parole provenant de Yahweh
  choice: « parole » sans explicitation ajoutée
  alternative: « message prophétique »
  rationale: Le contexte permet de comprendre qu’il s’agit d’une parole prophétique, mais le texte dit simplement דָּבָר. La traduction conserve cette sobriété et ne précise pas davantage que la source.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le verset est segmenté en deux phrases pour rendre lisible la longue construction hébraïque, tout en conservant les répétitions et le mouvement de la scène.
