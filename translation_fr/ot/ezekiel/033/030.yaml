    issue: Construction « Ils se parlent l’un à l’autre, chacun à son frère »
    rationale: 'Cette formulation ne fonctionne pas naturellement : « se parler l’un à l’autre » exprime déjà la réciprocité, tandis que « chacun à son frère » est ajouté sans construction syntaxique claire. Le texte hébreu combine les expressions distributives « l’un à l’autre » et « chacun à son frère » ; le français peut les rendre par « chacun à son frère » dans une tournure collective fluide.'
  - severity: low
    issue: « aux portes des maisons »
    rationale: פתחי הבתים désigne les ouvertures ou entrées des habitations, non nécessairement des portes au sens matériel. « Aux entrées des maisons » est plus transparent.
  - severity: low
    issue: 'Note : « qui sort d’auprès de Yahweh »'
    rationale: La préposition מֵאֵת indique la provenance (« de la part de », « de »), non une localisation « d’auprès de ». La note peut conserver l’image de la sortie tout en disant « qui sort de Yahweh ».
