  source_fidelity: 'Le sens principal est bien rendu : les membres du peuple parlent d’Ézéchiel entre eux et invitent leurs frères à écouter la parole venant de Yahweh. Toutefois, « Ils se parlent l’un à l’autre, chacun à son frère » est syntaxiquement et idiomatiquement défectueux en français, et la note traduit מֵאֵת de façon trop littérale et inexacte par « d’auprès de ».'
  naturalness: Le registre est globalement moderne et digne. La révision rétablit une construction française fluide pour la conversation réciproque et conserve le caractère distributif de l’hébreu.
  terminology: « fils d’homme », « parole » et « Yahweh » conviennent. « Les gens de ton peuple » est naturel et rend le référent collectif sans imposer le calque masculin « les fils ». « Aux entrées des maisons » est plus précis et naturel que « aux portes des maisons » dans ce contexte domestique.
  issues:
