revisions:
- from: Ils viennent vers toi comme vient une foule, et ils s’assoient devant toi, eux, mon peuple. Ils écoutent tes paroles, mais ne les mettent pas en pratique. De leur bouche, ils expriment des désirs passionnés[a], tandis que leur cœur court après leurs gains malhonnêtes[b].
  to: Ils viennent en foule auprès de toi et s’assoient devant toi comme mon peuple. Ils écoutent tes paroles, mais ne les mettent pas en pratique. Car leur bouche se livre à des propos passionnés[a], tandis que leur cœur court après leurs gains malhonnêtes[b].
  rationale: La révision améliore la fidélité idiomatique de la première comparaison et remplace une expression française peu naturelle par une formulation qui conserve l’ambiguïté contrôlée de עֲגָבִים. Les contrastes rhétoriques et la terminologie principale sont maintenus, ainsi que les deux notes et leurs ancres.
