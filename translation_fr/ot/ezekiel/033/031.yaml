source:
  edition: WLC
  text: וְ/יָב֣וֹאוּ אֵ֠לֶי/ךָ כִּ/מְבוֹא עָ֞ם וְ/יֵשְׁב֤וּ לְ/פָנֶ֨י/ךָ֙ עַמִּ֔/י וְ/שָֽׁמְעוּ֙ אֶת דְּבָרֶ֔י/ךָ וְ/אוֹתָ֖/ם לֹ֣א יַֽעֲשׂ֑וּ כִּֽי עֲגָבִ֤ים בְּ/פִי/הֶם֙ הֵ֣מָּה עֹשִׂ֔ים אַחֲרֵ֥י בִצְעָ֖/ם לִבָּ֥/ם הֹלֵֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/031.yaml
  text: And they come to you as people come[a], and they sit before you as my people, and they hear your words, but they do not do them; for with their mouth they speak lustful things[b], while their heart goes after their unjust gain.
translation:
  language: fr
  text: Ils viennent en foule auprès de toi et s’assoient devant toi comme mon peuple. Ils écoutent tes paroles, mais ne les mettent pas en pratique. Car leur bouche se livre à des propos passionnés[a], tandis que leur cœur court après leurs gains malhonnêtes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu est rare. Il peut désigner des passions, des désirs sensuels, des paroles amoureuses ou, peut-être, des chants d’amour. Il se peut que le peuple transforme ainsi les paroles du prophète en simple divertissement.
    reason: lexical_alternative
  - marker: b
    text: Ou « leur profit », « leur avidité » ou « leurs gains obtenus par convoitise ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְבוֹא עָם
  choice: comme vient une foule
  rationale: Rend la comparaison introduite par כְּ et comprend עָם ici comme un rassemblement de personnes venues écouter. « Une foule » est naturel en français et évite de suggérer que leur venue est authentiquement celle du peuple de Dieu, désignation qui apparaît ensuite.
- source_word: עַמִּי
  choice: eux, mon peuple
  rationale: 'Conserve la désignation d’alliance « mon peuple » ainsi que son effet ironique : ils se présentent devant le prophète comme le peuple de Dieu, mais n’obéissent pas.'
- source_word: וְשָׁמְעוּ אֶת־דְּבָרֶיךָ
  choice: Ils écoutent tes paroles
  rationale: Dans ce contexte d’audition publique, « écouter » exprime naturellement l’attention apparente tout en préparant le contraste avec l’absence de mise en pratique.
- source_word: וְאוֹתָם לֹא יַעֲשׂוּ
  choice: mais ne les mettent pas en pratique
  rationale: Rend idiomatiquement en français l’expression hébraïque « ne pas faire les paroles », sans affaiblir l’opposition entre entendre et agir.
- source_word: עֲגָבִים בְּפִיהֶם הֵמָּה עֹשִׂים
  choice: De leur bouche, ils expriment des désirs passionnés
  rationale: Le terme rare עֲגָבִים évoque des passions ou des élans amoureux. « Expriment » rend intelligiblement l’action accomplie « de leur bouche » sans trancher en faveur d’un genre précis, tel qu’un chant d’amour; une note conserve les principales possibilités.
- source_word: בִצְעָם
  choice: leurs gains malhonnêtes
  rationale: בֶּצַע désigne souvent un profit recherché avec avidité ou obtenu injustement. « Gains malhonnêtes » maintient cette coloration morale tout en laissant la note signaler les sens plus larges.
- source_word: לִבָּם הֹלֵךְ אַחֲרֵי
  choice: leur cœur court après
  rationale: Conserve l’image hébraïque de l’orientation intérieure et exprime naturellement une poursuite avide en français.
theological_decisions:
- issue: Caractérisation des paroles et des désirs du peuple
  choice: Le texte dénonce des auditeurs qui parlent sous l’impulsion de désirs passionnés tandis que leur attachement intérieur va au profit malhonnête.
  alternative: Le membre de phrase peut évoquer des paroles affectueuses ou flatteuses, ou encore le fait de traiter les paroles d’Ézéchiel comme un chant d’amour, en lien avec le verset 32.
  rationale: Le contexte met surtout en relief l’écart entre écoute et obéissance. La formulation retenue préserve le contraste entre la bouche et le cœur sans réduire le terme rare à une interprétation sexuelle ou musicale certaine.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le contraste rhétorique entre l’écoute publique, les paroles de la bouche et l’orientation réelle du cœur. Le tutoiement correspond à l’adresse directe de Dieu au prophète.
