review_pass:
  verdict: revise
  source_fidelity: 'La structure fondamentale est bien rendue : venue auprès du prophète, positionnement comme « mon peuple », écoute sans obéissance, contraste entre bouche et cœur, et poursuite du gain. Toutefois, « comme vient une foule » transforme עָם (« peuple », « gens ») en une « foule » indéfinie et la formulation française est raide. « Ils viennent en foule auprès de toi » rend naturellement l’idée idiomatique de כִּמְבוֹא־עָם sans effacer le « mon peuple » qui suit.'
  naturalness: 'Le français est globalement moderne et clair. « De leur bouche, ils expriment des désirs passionnés » est cependant peu idiomatique : on exprime un désir, mais l’hébreu associe le terme rare à ce qu’ils font avec leur bouche. « Leur bouche se livre à des propos passionnés » est plus naturel, conserve l’image de la bouche et ne décide pas indûment entre paroles séduisantes, désirs sensuels et possible chant amoureux.'
  terminology: « Mon peuple », « mettent [les paroles] en pratique », « cœur » et « gains malhonnêtes » conviennent. La note sur עֲגָבִים préserve utilement l’incertitude lexicale et contextuelle. Les ancres françaises sont correctement placées sur les deux termes concernés, contrairement à l’incohérence de placement présente dans la piste anglaise.
  issues:
  - severity: low
    issue: « comme vient une foule » est une traduction trop spécifique et une tournure peu fluide.
    rationale: עָם ne désigne pas nécessairement une foule ; dans cette expression, l’idée est celle d’une venue collective/publique. « Ils viennent en foule auprès de toi » est idiomatique et garde cette valeur sans modifier la désignation ultérieure « mon peuple ».
  - severity: medium
    issue: « ils expriment des désirs passionnés » ne rend pas naturellement l’action accomplie « avec leur bouche ».
    rationale: Le tour français peut laisser entendre qu’ils verbalisent leurs propres désirs, alors que le syntagme hébreu rare permet aussi des propos amoureux, sensuels ou flatteurs, possiblement en rapport avec le chant du v. 32. Une formulation centrée sur des « propos » maintient l’ambiguïté.
  revised_text: Ils viennent en foule auprès de toi et s’assoient devant toi comme mon peuple. Ils écoutent tes paroles, mais ne les mettent pas en pratique. Car leur bouche se livre à des propos passionnés[a], tandis que leur cœur court après leurs gains malhonnêtes[b].
  revised_footnotes:
