  text: עֲמַדְתֶּ֤ם עַֽל חַרְבְּ/כֶם֙ עֲשִׂיתֶ֣ן תּוֹעֵבָ֔ה וְ/אִ֛ישׁ אֶת אֵ֥שֶׁת רֵעֵ֖/הוּ טִמֵּאתֶ֑ם וְ/הָ/אָ֖רֶץ תִּירָֽשׁוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/026.yaml
  text: You stand on your sword[a], you commit abominations, and each of you defiles his neighbor’s wife[b]. Shall you then possess the land?
translation:
  language: fr
  text: Vous vous appuyez sur votre épée[a], vous commettez des actes abominables, et chacun de vous souille la femme de son prochain. Posséderiez-vous donc le pays[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Vous vous tenez sur votre épée. » L’expression évoque probablement le recours à la violence ou la confiance dans la force armée.'
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire la dernière proposition : « et vous posséderiez le pays ». L’hébreu ne marque pas explicitement l’interrogation ; le contexte favorise une question rhétorique. Le verbe peut également signifier « hériter de ».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: עֲמַדְתֶּם עַל חַרְבְּכֶם
  choice: Vous vous appuyez sur votre épée
  rationale: L’expression signifie littéralement « vous vous tenez sur votre épée ». Dans ce contexte d’accusation, elle évoque vraisemblablement le recours à la violence ou la confiance placée dans la force armée. « Vous vous appuyez sur » conserve l’image tout en exprimant naturellement sa portée en français.
- source_word: חַרְבְּכֶם
  choice: votre épée
  rationale: חֶרֶב désigne précisément l’épée. Ce choix préserve l’image concrète de la violence plutôt que de la généraliser en « arme ».
- source_word: עֲשִׂיתֶן תּוֹעֵבָה
  choice: vous commettez des actes abominables
  rationale: Le nom singulier תּוֹעֵבָה peut avoir ici une valeur collective. Cette formulation française rend des pratiques moralement détestables sans imposer un sens exclusivement cultuel.
- source_word: וְאִישׁ
  choice: et chacun de vous
  rationale: אִישׁ a une valeur distributive au sein du groupe interpellé. « Chacun de vous » s’intègre naturellement à l’adresse à la deuxième personne du pluriel.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: la femme de son prochain
  rationale: רֵעַ peut désigner le prochain, le compagnon ou le semblable. « Son prochain » convient au cadre social et préserve la formulation masculine distributive du texte.
- source_word: טִמֵּאתֶם
  choice: souille
  rationale: Le piel de טמא signifie rendre impur ou souiller. Dans cette accusation d’inconduite sexuelle, « souille » conserve à la fois la force morale et la notion d’impureté.
- source_word: וְהָאָרֶץ תִּירָשׁוּ
  choice: Posséderiez-vous donc le pays ?
  rationale: ירש peut signifier prendre possession ou hériter. « Posséder » convient à la revendication territoriale immédiate, tandis que le conditionnel interrogatif exprime naturellement en français la contestation indignée suggérée par le contexte.
theological_decisions:
- issue: Valeur de la proposition finale
  choice: 'Question rhétorique : « Posséderiez-vous donc le pays ? »'
  alternative: 'Déclaration : « et vous posséderez le pays »'
  rationale: L’hébreu ne comporte pas de particule interrogative explicite, mais le contexte immédiat est une réprimande qui conteste le droit des destinataires à posséder le pays. La traduction interrogative respecte cette force contextuelle sans masquer dans la note l’ambiguïté formelle.
- issue: Formulation distributive masculine
  choice: « chacun de vous souille la femme de son prochain »
  alternative: « chacun souille la femme d’autrui »
  rationale: Le texte emploie אִישׁ et des suffixes masculins singuliers dans une structure distributive. La formulation retenue reste naturelle tout en préservant cette référence et la dimension relationnelle de l’offense.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme accusateur est conservé. « Actes abominables » évite la raideur de « une abomination », tandis que « le pays » rend הָאָרֶץ dans son sens territorial contextuel.
