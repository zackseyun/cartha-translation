base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/004.yaml
  text: then if the one who hears hears the sound of the trumpet and does not take warning[a], and the sword comes and takes him away, his blood will be on his own head.
translation:
  language: fr
  text: Si quelqu’un entend le son de la trompette sans tenir compte de l’avertissement, et que l’épée vient l’emporter, son sang sera sur sa tête[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son sang sera sur sa tête » ; expression signifiant qu’il porte lui-même la responsabilité de sa mort.'
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁמַע הַשֹּׁמֵעַ
  choice: alors, si celui qui entend
  rationale: Le contexte poursuit la situation conditionnelle commencée au verset précédent. Le français explicite donc la valeur conditionnelle, tandis que le participe substantivé est rendu naturellement par « celui qui entend ».
- source_word: קוֹל הַשּׁוֹפָר
  choice: le son de la trompette
  rationale: קוֹל désigne ici le signal audible. « Le son de la trompette » conserve l’image et reste plus proche de l’hébreu que « le coup de trompette ».
- source_word: וְלֹא נִזְהָר
  choice: ne tient pas compte de l’avertissement
  rationale: Le niphal exprime le fait de se laisser avertir ou de prendre garde. Cette formulation française met en évidence l’absence de réaction au signal sans surinterpréter le verbe.
- source_word: חֶרֶב
  choice: l’épée
  rationale: L’article et l’image hébraïque sont conservés. Dans ce contexte, l’épée évoque la violence ennemie et la mort, mais la traduction ne remplace pas cette métaphore par son interprétation.
- source_word: וַתִּקָּחֵהוּ
  choice: l’emporte
  rationale: Le verbe signifie littéralement « le prend ». Dans ce contexte létal, « l’emporte » exprime naturellement en français que l’épée lui ôte la vie, sans ajouter une image étrangère.
- source_word: דָּמוֹ בְרֹאשׁוֹ יִהְיֶה
  choice: son sang retombera sur sa propre tête
  rationale: La tournure conserve l’idiome hébreu de responsabilité personnelle. « Sa propre tête » rend explicite la valeur réflexive implicite dans le contexte.
theological_decisions:
- issue: Responsabilité personnelle dans le contexte du jugement
  choice: son sang retombera sur sa propre tête
  alternative: il sera lui-même responsable de sa mort
  rationale: L’idiome concret de l’hébreu est maintenu afin de préserver sa force rhétorique et théologique, tandis qu’une note en explique le sens sans introduire une catégorie doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conditionnelle est explicitée d’après le contexte immédiat, et les images hébraïques de la trompette, de l’épée et du sang sur la tête sont conservées.
