  text: When it comes—and look, it is coming—then they will know that a prophet has been among them.
translation:
  language: fr
  text: Quand cela arrivera — eh bien, cela arrive —, ils sauront qu’un prophète a été au milieu d’eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְבֹאָהּ
  choice: Quand cela arrivera
  rationale: La tournure temporelle avec בְּ et l’infinitif construit signifie « quand cela arrivera ». Le pronom féminin renvoie vraisemblablement à la parole ou à la chose annoncée dans le contexte, sans qu’il soit nécessaire d’expliciter le référent.
- source_word: הִנֵּה בָאָה
  choice: et voici, cela arrive
  rationale: « Voici » conserve la fonction déictique et emphatique de הִנֵּה ainsi que la solennité de l’annonce; le présent « cela arrive » rend l’imminence exprimée par le participe/perfectif en contexte prophétique.
- source_word: נָבִיא הָיָה בְתוֹכָם
  choice: qu’un prophète était au milieu d’eux
  rationale: Rendu direct de la proposition hébraïque, en préservant l’indéfini « un prophète » et l’idée de présence au sein du peuple.
theological_decisions:
- issue: Moment où l’identité prophétique sera reconnue
  choice: ils sauront qu’un prophète était au milieu d’eux
  alternative: ils reconnaîtront qu’il y avait un prophète parmi eux
  rationale: La formulation retenue suit de près וְיָדְעוּ et הָיָה, sans préciser davantage la nature de cette reconnaissance ni identifier explicitement le prophète.
translation_notes:
  register: Français moderne, sobre et solennel. « Voici » est retenu plutôt que « regardez » afin de rendre naturellement l’interjection prophétique hébraïque dans ce registre. La répétition « arrivera / arrive » reproduit volontairement l’insistance du texte source.
