review_pass:
  verdict: revise
  source_fidelity: La traduction rend fidèlement l’adresse prophétique, le doublet moral « révoltes et péchés », l’image du poids et le dépérissement. Toutefois, le parfait אֲמַרְתֶּם est mieux conservé par « vous avez dit » que par le présent « vous dites », et l’imparfait נִחְיֶה se rend plus directement par « vivrons-nous ? » que par un conditionnel modal.
  naturalness: Le français est clair, moderne et d’un registre prophétique approprié. « Comment vivrons-nous donc ? » est à la fois idiomatique et plus proche de la forme interrogative hébraïque.
  terminology: « Fils d’homme », « maison d’Israël », « révoltes » et « péchés » conviennent. « Pèsent sur nous » rend naturellement l’image de fautes qui sont « sur » les locuteurs. La note lexicale est conservée, avec une formulation un peu resserrée et sans faire de « sous le poids » une composante nécessaire du sens du verbe.
  issues:
  - severity: low
    issue: Temps de « vous dites »
    rationale: L’hébreu emploie le parfait « vous avez dit ». Même si un présent de discours peut être défendu en français, le passé composé préserve mieux la référence à la parole que le prophète doit rapporter.
  - severity: low
    issue: Conditionnel dans la question finale
    rationale: L’imparfait hébreu signifie directement « comment vivrons-nous ? ». Le conditionnel « pourrions-nous » explicite une modalité de possibilité qui est plausible dans le contexte, mais non requise par la forme verbale.
