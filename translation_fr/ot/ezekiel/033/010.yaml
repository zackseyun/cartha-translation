  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם אֱמֹר֙ אֶל בֵּ֣ית יִשְׂרָאֵ֔ל כֵּ֤ן אֲמַרְתֶּם֙ לֵ/אמֹ֔ר כִּֽי פְשָׁעֵ֥י/נוּ וְ/חַטֹּאתֵ֖י/נוּ עָלֵ֑י/נוּ וּ/בָ֛/ם אֲנַ֥חְנוּ נְמַקִּ֖ים וְ/אֵ֥יךְ נִֽחְיֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/010.yaml
  text: 'And you[a], son of man, say to the house of Israel, ‘Thus you have said: “Surely our transgressions and our sins are upon us, and in them we are wasting away; so how can we live?”’'
translation:
  language: fr
  text: 'Et toi, fils d’homme, dis à la maison d’Israël : « Voici ce que vous avez dit : “Oui, nos révoltes et nos péchés pèsent sur nous, et à cause d’eux nous dépérissons[a]. Comment donc vivrons-nous ?” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous nous consumons » ou « nous pourrissons ». Le verbe hébreu évoque le dépérissement, la décomposition ou l’épuisement.
    reason: Alternative lexicale destinée à préserver l’étendue imagée du verbe נְמַקִּים.
lexical_decisions:
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: Conserve la formule d’adresse caractéristique d’Ézéchiel et son registre prophétique, tout en restant familière en français biblique.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Préserve l’image collective et l’expression d’alliance de l’hébreu, plutôt que de la réduire à « peuple d’Israël ».
- source_word: כֵּן אֲמַרְתֶּם
  choice: Voici ce que vous dites
  rationale: Rend naturellement en français la force présentative de כֵּן. Le parfait peut ici désigner la parole déjà formulée ou couramment tenue; le présent convient à l’introduction de la citation.
- source_word: פְשָׁעֵינוּ
  choice: nos révoltes
  rationale: פשע évoque des actes de rébellion ou des ruptures volontaires; « révoltes » distingue ce terme de חטאות tout en gardant sa gravité morale.
- source_word: חַטֹּאתֵינוּ
  choice: nos péchés
  rationale: Équivalent direct qui préserve le second terme du couple hébreu sans confondre les deux notions.
- source_word: עָלֵינוּ
  choice: pèsent sur nous
  rationale: Exprime en français naturel la charge, la culpabilité et les conséquences qui reposent sur les locuteurs, tout en conservant la métaphore du poids.
- source_word: וּבָם
  choice: à cause d’eux
  rationale: Dans ce contexte, ב indique vraisemblablement la cause ou le moyen par lequel ils dépérissent. Le littéral « en eux » serait obscur et peu naturel en français.
- source_word: נְמַקִּים
  choice: nous dépérissons
  rationale: Le verbe décrit un processus de décomposition, d’épuisement ou de dépérissement. « Dépérissons » exprime clairement la détérioration continue sans imposer l’image plus crue de la pourriture.
- source_word: וְאֵיךְ נִחְיֶה
  choice: Comment donc pourrions-nous vivre ?
  rationale: La tournure rend l’enchaînement logique et le désespoir de la question; le conditionnel traduit naturellement l’idée d’une possibilité jugée presque inconcevable.
theological_decisions:
- issue: La parole du peuple est-elle une simple confession ou l’expression d’un désespoir sous le jugement ?
  choice: 'Une reconnaissance angoissée de la culpabilité et de ses conséquences, culminant dans la question : « Comment donc pourrions-nous vivre ? »'
  alternative: Une confession de péché formulée sans accent particulier sur le désespoir.
  rationale: 'Le dépérissement en cours et la question finale indiquent plus qu’un simple aveu : le peuple ne voit plus comment la vie serait possible. La traduction maintient cette tension sans anticiper la réponse divine du verset suivant.'
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les expressions prophétiques « fils d’homme » et « maison d’Israël », mais évite les archaïsmes. Les guillemets emboîtés distinguent clairement l’ordre adressé au prophète de la parole citée du peuple.
