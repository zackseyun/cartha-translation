  text: וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה בְּ/תִתִּ֤/י אֶת הָ/אָ֨רֶץ֙ שְׁמָמָ֣ה וּ/מְשַׁמָּ֔ה עַ֥ל כָּל תּוֹעֲבֹתָ֖/ם אֲשֶׁ֥ר עָשֽׂוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/029.yaml
  text: Then they will know that I am Yahweh[b][a], when I make the land a desolation and a waste because of all the abominations that they have committed.
translation:
  language: fr
  text: Alors ils sauront que je suis Yahweh[a], quand je ferai du pays une désolation et un lieu dévasté[b], à cause de toutes leurs abominations qu’ils ont commises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et ils sauront ». La conjonction hébraïque peut simplement signifier « et », mais elle semble ici introduire le résultat de ce qui précède.'
    reason: lexical_alternative
  - marker: b
    text: 'Le second terme hébreu peut aussi évoquer un spectacle qui provoque la stupeur ou l’effroi : « une désolation et un objet d’effroi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Alors ils sauront
  rationale: Le waw poursuit ici la conséquence du jugement annoncé dans le contexte. « Alors » exprime naturellement cette valeur résultative en français; la possibilité d’une simple coordination est signalée en note.
- source_word: כִּי
  choice: que
  rationale: כִּי introduit le contenu de ce qu’ils reconnaîtront, et non la cause de leur connaissance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, au lieu de lui substituer un titre.
- source_word: בְּתִתִּי
  choice: quand je ferai
  rationale: La préposition ב avec l’infinitif construit exprime ici la circonstance temporelle. Avec le pays comme objet et les termes de dévastation comme résultat, « faire de » rend idiomatiquement נתן.
- source_word: הָאָרֶץ
  choice: du pays
  rationale: Dans ce contexte de jugement, הָאָרֶץ désigne le pays concerné, plutôt que la terre entière.
- source_word: שְׁמָמָה וּמְשַׁמָּה
  choice: un lieu dévasté et désolé
  rationale: Cette formulation française conserve le redoublement intensif de deux termes proches tout en décrivant naturellement l’état du pays.
- source_word: עַל כָּל תּוֹעֲבֹתָם
  choice: à cause de toutes les pratiques abominables
  rationale: עַל exprime ici le motif du jugement. « Pratiques abominables » communique clairement que תּוֹעֲבוֹת désigne les actes jugés odieux, sans imposer un vocabulaire confessionnel.
- source_word: אֲשֶׁר עָשׂוּ
  choice: qu’ils ont commises
  rationale: Avec « pratiques », le verbe « commettre » est idiomatique et rend le fait d’accomplir ces actes.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve comme tel sans le remplacer par un titre.
- issue: Nature du jugement sur le pays
  choice: Énoncé comme conséquence des pratiques abominables commises
  alternative: Atténuer la causalité ou préciser la nature exacte de ces pratiques
  rationale: Le verset relie explicitement la dévastation aux תּוֹעֲבוֹת, mais ne les détaille pas ici; la traduction préserve cette relation sans ajout interprétatif.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase garde la solennité prophétique sans calque excessif. Les marqueurs [a] et [b] figurent dans le texte et correspondent exactement aux notes.
