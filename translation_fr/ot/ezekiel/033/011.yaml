source:
  edition: WLC
  text: אֱמֹ֨ר אֲלֵי/הֶ֜ם חַי אָ֣נִי נְאֻ֣ם אֲדֹנָ֣/י יְהוִ֗ה אִם אֶחְפֹּץ֙ בְּ/מ֣וֹת הָ/רָשָׁ֔ע כִּ֣י אִם בְּ/שׁ֥וּב רָשָׁ֛ע מִ/דַּרְכּ֖/וֹ וְ/חָיָ֑ה שׁ֣וּבוּ שׁ֜וּבוּ מִ/דַּרְכֵי/כֶ֧ם הָ/רָעִ֛ים וְ/לָ֥/מָּה תָמ֖וּתוּ בֵּ֥ית יִשְׂרָאֵֽל־׀׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/011.yaml
  text: Say to them[a], ‘As I live,’ declares the Lord GOD, ‘I take no pleasure in the death of the wicked, but rather that the wicked turn from his way and live. Turn back, turn back from your evil ways! Why will you die[b], O house of Israel?’
translation:
  language: fr
  text: 'Dis-leur : « Aussi vrai que je suis vivant — déclaration du Seigneur DIEU —, je ne prends aucun plaisir[a] à la mort du méchant, mais plutôt à ce que le méchant se détourne de sa voie et vive. Détournez-vous, détournez-vous[b] de vos mauvaises voies ! Pourquoi mourriez-vous, maison d’Israël ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « je ne trouve aucune satisfaction » ou « je ne désire pas ». Le verbe hébreu peut exprimer le plaisir, la satisfaction ou le désir.'
    reason: lexical_alternative
  - marker: b
    text: La répétition « Détournez-vous, détournez-vous » renforce l’appel. Le même verbe hébreu décrit juste avant le méchant qui se détourne de sa voie.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָנִי
  choice: Aussi vrai que je suis vivant
  rationale: Cette formule française naturelle conserve la force solennelle de la formule de serment hébraïque.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur DIEU
  rationale: « Déclaration » rend la formule prophétique נְאֻם. « Seigneur DIEU » distingue les deux titres divins accolés et évite « Seigneur Seigneur ».
- source_word: אִם אֶחְפֹּץ בְּמוֹת הָרָשָׁע
  choice: je ne prends aucun plaisir à la mort du méchant
  rationale: Dans cette formule de serment, אִם exprime une forte négation. חפץ peut désigner le plaisir, la satisfaction ou le désir ; « ne prends aucun plaisir » restitue clairement sa nuance affective sans la renforcer.
- source_word: כִּי אִם
  choice: mais plutôt
  rationale: La locution établit l’opposition entre ce à quoi Dieu ne prend pas plaisir et le retournement qui conduit à la vie.
- source_word: בְּשׁוּב רָשָׁע מִדַּרְכּוֹ וְחָיָה
  choice: à ce que le méchant se détourne de sa voie et vive
  rationale: « Se détourner » conserve l’image concrète de שׁוּב et « voie » celle de la conduite. La formulation garde le singulier représentatif du texte hébreu.
- source_word: שׁוּבוּ שׁוּבוּ
  choice: Détournez-vous, détournez-vous
  rationale: La répétition de l’impératif est maintenue pour préserver l’insistance et le lien lexical avec le retournement du méchant mentionné juste avant.
- source_word: מִדַּרְכֵיכֶם הָרָעִים
  choice: de vos mauvaises voies
  rationale: Cette expression française compréhensible conserve la métaphore prophétique des voies pour désigner la conduite moralement mauvaise.
- source_word: וְלָמָּה תָמוּתוּ
  choice: Pourquoi mourriez-vous
  rationale: Le conditionnel français rend naturellement la question rhétorique et pressante, sans ajouter l’idée que les destinataires voudraient délibérément mourir.
- source_word: בֵּית יִשְׂרָאֵל
  choice: maison d’Israël
  rationale: Le maintien de « maison » préserve l’adresse collective et l’idiome prophétique du texte source.
theological_decisions:
- issue: Disposition de Dieu envers la mort du méchant
  choice: Exprimer que Dieu ne prend aucun plaisir à la mort du méchant et lui opposer le retournement qui mène à la vie.
  alternative: Traduire חפץ plus fortement par « désirer » ou introduire une distinction systématique entre différentes volontés divines.
  rationale: Le verset affirme directement la disposition divine dans le cadre d’un appel prophétique. La traduction conserve cette affirmation et sa tension sans y importer un système théologique ultérieur.
- issue: Passage du singulier représentatif au pluriel collectif
  choice: Conserver « le méchant » et « sa voie », puis passer au pluriel dans l’exhortation adressée à Israël.
  alternative: Uniformiser tout le passage au singulier ou au pluriel, ou employer une formulation épicène qui effacerait le mouvement grammatical.
  rationale: L’hébreu passe volontairement du méchant pris comme figure représentative à l’interpellation directe de la collectivité ; la traduction reproduit ce mouvement.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La solennité de l’oracle est conservée sans archaïsmes inutiles. La répétition emphatique et la métaphore des « voies » restent visibles.
