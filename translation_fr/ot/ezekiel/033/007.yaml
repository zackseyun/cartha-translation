  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם צֹפֶ֥ה נְתַתִּ֖י/ךָ לְ/בֵ֣ית יִשְׂרָאֵ֑ל וְ/שָׁמַעְתָּ֤ מִ/פִּ/י֙ דָּבָ֔ר וְ/הִזְהַרְתָּ֥ אֹתָ֖/ם מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/007.yaml
  text: And you[a], son of man, I have made you a watchman for the house of Israel[b]; when you hear a word from my mouth, you shall warn them from me.
translation:
  language: fr
  text: Quant à toi, fils d’homme[a], je t’ai établi comme guetteur[b] pour la maison d’Israël. Quand tu entendras une parole de ma bouche, tu les avertiras de ma part.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « fils d’homme » ; on peut aussi comprendre « être humain » ou « mortel ». Dans Ézéchiel, cette expression est l’adresse habituelle donnée au prophète.
    reason: lexical_alternative
  - marker: b
    text: Ou « sentinelle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: fils d’homme
  rationale: L’expression hébraïque signifie littéralement « fils d’homme ». Dans Ézéchiel, elle constitue l’adresse récurrente de Dieu au prophète. La conserver respecte ce motif littéraire tout en restant familière en français biblique.
- source_word: צֹפֶה
  choice: guetteur
  rationale: Le terme désigne celui qui observe depuis un poste de garde et donne l’alerte. « Guetteur » exprime clairement cette fonction et convient à la métaphore prophétique.
- source_word: נְתַתִּיךָ
  choice: je t’ai établi comme
  rationale: Le verbe signifie littéralement « je t’ai donné », mais, suivi du rôle « guetteur », il indique ici une désignation à une fonction. « Établi comme » rend naturellement cette valeur en français.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: pour la maison d’Israël
  rationale: La préposition marque l’attribution de la mission. « Maison d’Israël » conserve l’expression collective hébraïque traditionnelle.
- source_word: וְשָׁמַעְתָּ
  choice: Quand tu entendras
  rationale: Dans la suite de la commission, la forme verbale introduit naturellement la circonstance qui déclenche l’obligation d’avertir. La tournure temporelle est claire en français sans effacer la séquence hébraïque.
- source_word: מִפִּי דָּבָר
  choice: une parole de ma bouche
  rationale: Cette formulation conserve l’image anthropomorphique et souligne que le message vient directement de Dieu.
- source_word: וְהִזְהַרְתָּ אֹתָם
  choice: tu les avertiras
  rationale: Le hiphil exprime l’action de donner un avertissement. Le futur français porte ici la force de la mission confiée au prophète.
- source_word: מִמֶּנִּי
  choice: de ma part
  rationale: L’expression indique que Dieu est la source et l’autorité de l’avertissement. « De ma part » est plus idiomatique que « venant de moi » après le verbe « avertir ».
theological_decisions:
- issue: Sens de l’adresse récurrente בֶן אָדָם
  choice: fils d’homme
  alternative: être humain ; mortel
  rationale: Le rendu littéral préserve la formule caractéristique du livre sans décider qu’elle ne désigne que la mortalité ou la faiblesse du prophète.
- issue: Articulation entre l’écoute et l’avertissement
  choice: Quand tu entendras… tu les avertiras
  alternative: Tu entendras… et tu les avertiras
  rationale: La lecture temporelle rend en français le rapport fonctionnel entre la parole reçue et l’avertissement, tout en maintenant le caractère obligatoire de la mission.
- issue: Source divine de l’avertissement
  choice: de ma part
  alternative: venant de moi
  rationale: Le texte affirme que l’avertissement est autorisé et communiqué par Dieu. « De ma part » conserve cette origine sans ajouter une interprétation sur le mode précis de l’inspiration.
translation_notes:
  register: Français international actuel, digne et accessible. « Quant à toi » marque l’emphase initiale du pronom hébreu. Les expressions imagées « fils d’homme », « guetteur », « maison d’Israël » et « de ma bouche » sont conservées en raison de leur importance littéraire, avec des notes seulement là où une autre traduction lexicale est réellement utile.
