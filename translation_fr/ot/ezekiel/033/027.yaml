  text: כֹּֽה תֹאמַ֨ר אֲלֵ/הֶ֜ם כֹּה אָמַ֨ר אֲדֹנָ֣/י יְהוִה֮ חַי אָנִי֒ אִם לֹ֞א אֲשֶׁ֤ר בֶּֽ/חֳרָבוֹת֙ בַּ/חֶ֣רֶב יִפֹּ֔לוּ וַֽ/אֲשֶׁר֙ עַל פְּנֵ֣י הַ/שָּׂדֶ֔ה לַ/חַיָּ֥ה נְתַתִּ֖י/ו לְ/אָכְל֑/וֹ וַ/אֲשֶׁ֛ר בַּ/מְּצָד֥וֹת וּ/בַ/מְּעָר֖וֹת בַּ/דֶּ֥בֶר יָמֽוּתוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/027.yaml
  text: 'Thus you shall say to them[a], ‘Thus says the Lord GOD: As I live, surely those who are in the ruins will fall by the sword, and whoever is on the face of the field I have given to the wild animals to be devoured[c][b], and those who are in the strongholds and in the caves will die by pestilence.’'
translation:
  language: fr
  text: 'Tu leur diras : « Voici ce que dit le Seigneur Yahweh : Aussi vrai que je suis vivant, ceux qui sont parmi les ruines tomberont par l’épée ; celui qui est en rase campagne, je le livrerai aux animaux sauvages pour qu’ils le dévorent[a] ; et ceux qui sont dans les lieux fortifiés et dans les grottes mourront de la peste[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie littéralement un parfait : « je l’ai donné pour le dévorer ». Le pronom est au singulier, probablement avec une valeur distributive ; le futur français exprime la portée de l’annonce.'
    reason: Précise exactement la forme verbale, l’infinitif et le nombre grammatical du texte source, tout en expliquant le choix idiomatique français.
  - marker: b
    text: Ou « d’une épidémie ».
    reason: Signale une autre traduction possible de דֶּבֶר.
lexical_decisions:
- source_word: כֹּה תֹאמַר ... כֹּה אָמַר
  choice: 'Tu leur diras : « Voici ce que dit'
  rationale: Cette formulation française naturelle conserve la formule du messager prophétique et sa répétition de כֹּה sans raideur excessive.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: « Seigneur » rend אֲדֹנָי et « Yahweh » représente explicitement le nom divin יהוה, tout en évitant « Seigneur SEIGNEUR ».
- source_word: חַי אָנִי אִם־לֹא
  choice: Aussi vrai que je suis vivant
  rationale: Rend comme une seule formule idiomatique l’assermentation hébraïque, dans laquelle אִם־לֹא renforce solennellement la certitude de la déclaration.
- source_word: אֲשֶׁר בֶּחֳרָבוֹת
  choice: ceux qui sont parmi les ruines
  rationale: חֳרָבוֹת désigne ici des lieux ruinés ou dévastés ; « parmi les ruines » est concret et naturel dans le contexte.
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: tomberont par l’épée
  rationale: Conserve l’image hébraïque et une tournure biblique encore intelligible en français moderne.
- source_word: אֲשֶׁר עַל־פְּנֵי הַשָּׂדֶה
  choice: celui qui est en rase campagne
  rationale: « En rase campagne » exprime naturellement l’exposition à découvert suggérée par עַל־פְּנֵי הַשָּׂדֶה, sans traduire mécaniquement « sur la face du champ ».
- source_word: לַחַיָּה נְתַתִּיו לְאָכְלוֹ
  choice: je le livrerai aux animaux sauvages pour qu’ils le dévorent
  rationale: Le singulier « le » maintient le suffixe masculin singulier de נְתַתִּיו et sa probable valeur distributive. Le futur français convient à la série d’annonces, bien que l’hébreu emploie formellement un parfait prophétique.
- source_word: בַּמְּצָדוֹת וּבַמְּעָרוֹת
  choice: dans les lieux fortifiés et dans les grottes
  rationale: מְצָדוֹת peut désigner des refuges défensifs ou places fortes ; « lieux fortifiés » préserve cette largeur de sens.
- source_word: בַּדֶּבֶר יָמוּתוּ
  choice: mourront de la peste
  rationale: « Peste » rend clairement דֶּבֶר comme fléau épidémique et terme de jugement, sans employer le français plus vieilli « pestilence ».
theological_decisions:
- issue: Rendu du titre divin אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le choix distingue les deux éléments du titre et représente le tétragramme comme nom propre, sans introduire d’interprétation confessionnelle supplémentaire.
- issue: Aspect verbal de נְתַתִּיו au sein d’une annonce de jugement
  choice: je le livrerai
  alternative: je l’ai livré
  rationale: Le parfait peut présenter le décret comme déjà arrêté, tandis que le contexte coordonne trois destins futurs. Le futur donne en français la valeur contextuelle sans nier la certitude du décret ; la note signale la forme hébraïque.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence prophétique est conservée sans calques opaques. Les points-virgules structurent les trois groupes frappés par le jugement. Tous les marqueurs de notes [a] et [b] figurent dans le texte.
