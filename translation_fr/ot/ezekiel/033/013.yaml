revisions:
- from: 'Quand je dis au juste : « Il vivra, oui, il vivra », mais qu’il se fie à sa propre justice et commette l’injustice, aucun de ses actes justes ne sera rappelé[a] ; à cause de l’injustice qu’il a commise, il mourra[b].'
  to: 'Quand je dis au juste : « Il vivra, oui, il vivra », mais qu’il se fie à sa justice et commette une injustice, aucun de ses actes justes ne sera rappelé[a] ; à cause de l’injustice qu’il a commise, il mourra[b].'
  rationale: La révision retire l'intensif interprétatif « propre », remplace l'expression moins idiomatique « commettre l'injustice » par « commettre une injustice », et précise la note sur la double préposition hébraïque. Elle conserve l'avertissement judiciaire et son ambiguïté théologique sans lui imposer de cadre doctrinal.
