  text: בְּ/אָמְרִ֤/י לַ/צַּדִּיק֙ חָיֹ֣ה יִֽחְיֶ֔ה וְ/הֽוּא בָטַ֥ח עַל צִדְקָת֖/וֹ וְ/עָ֣שָׂה עָ֑וֶל כָּל צדקת/ו לֹ֣א תִזָּכַ֔רְנָה וּ/בְ/עַוְל֥/וֹ אֲשֶׁר עָשָׂ֖ה בּ֥/וֹ יָמֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/013.yaml
  text: When I say to the righteous man[a], ‘He shall surely live,’ and he trusts in his righteousness and does injustice, none of his righteous deeds will be remembered[b], but by the injustice that he has done he shall die.
translation:
  language: fr
  text: 'Quand je dis au juste : « Il vivra, oui, il vivra », mais qu’il se fie à sa justice et commette une injustice, aucun de ses actes justes ne sera rappelé[a] ; à cause de l’injustice qu’il a commise, il mourra[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tous ses actes justes ne seront pas rappelés ». Le pluriel hébreu peut désigner collectivement ses actes de justice.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, la construction peut se rendre : « dans son injustice qu’il a commise, il mourra en elle ». Les prépositions peuvent aussi exprimer la cause ; le pronom renvoie vraisemblablement à l’injustice commise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָמְרִי
  choice: Quand je dis
  rationale: La préposition בְּ avec la forme verbale suffixée introduit ici une proposition temporelle. « Quand je dis » est naturel en français et conserve la parole divine à la première personne.
- source_word: לַצַּדִּיק
  choice: au juste
  rationale: צַדִּיק désigne une personne juste. Le substantif français « le juste » conserve le masculin singulier représentatif sans ajouter le mot « homme ».
- source_word: חָיֹה יִחְיֶה
  choice: Il vivra, oui, il vivra
  rationale: L’infinitif absolu suivi de l’imparfait renforce fortement l’affirmation. La reprise avec « oui » rend cette insistance dans un français actuel et solennel.
- source_word: בָטַח עַל צִדְקָתוֹ
  choice: il se fie à sa propre justice
  rationale: בָטַח עַל exprime la confiance ou l’appui placé en quelque chose. « Sa propre justice » explicite naturellement en français le caractère réflexif du suffixe sans définir davantage la nature de cette justice.
- source_word: וְעָשָׂה עָוֶל
  choice: et commette l’injustice
  rationale: עָוֶל peut désigner le tort, l’iniquité ou l’injustice. « Commettre l’injustice » garde le lien lexical avec la seconde occurrence et convient au cadre judiciaire du passage.
- source_word: כָּל צִדְקֹתָו
  choice: aucun de ses actes justes
  rationale: Sous la négation, « aucun » rend naturellement l’idée que pas un seul de ses actes de justice ne sera retenu. Le pluriel hébreu peut viser concrètement l’ensemble de ses actes justes.
- source_word: לֹא תִזָּכַרְנָה
  choice: ne sera rappelé
  rationale: Le nifal de זכר signifie « être rappelé » ou « être gardé en mémoire ». La formulation conserve le passif et la portée judiciaire sans transformer explicitement le souvenir en comptabilité.
- source_word: וּבְעַוְלוֹ אֲשֶׁר עָשָׂה ... בּוֹ
  choice: à cause de l’injustice qu’il a commise
  rationale: La préposition בְּ peut ici exprimer la sphère ou la cause de la mort, et le pronom בּוֹ reprend vraisemblablement l’injustice. « À cause de » donne un français clair tout en signalant le rapport causal.
- source_word: יָמוּת
  choice: il mourra
  rationale: Le verbe simple מות annonce la mort dans un ton judiciaire. Le futur français répond nettement à l’affirmation initiale sur la vie.
theological_decisions:
- issue: Portée de l’avertissement concernant le juste qui se détourne vers l’injustice
  choice: Présenter l’avertissement comme une déclaration judiciaire réelle et conditionnelle, sans l’intégrer à un système doctrinal ultérieur.
  alternative: Le réduire à une hypothèse irréelle, ou préciser qu’il décrit nécessairement la perte d’un statut spirituel défini par une théologie particulière.
  rationale: L’hébreu affirme directement que les actes justes antérieurs ne seront pas rappelés lorsque le juste se fie à sa justice et commet l’injustice. La traduction maintient cette tension sans trancher les débats ultérieurs sur la persévérance ou l’apostasie.
- issue: Sens de צִדְקָתוֹ dans l’expression « se fier à sa justice »
  choice: Conserver « sa propre justice » sans décider s’il s’agit d’un statut, d’une conduite ou d’un ensemble d’actes.
  alternative: Rendre le terme exclusivement par « ses bonnes œuvres » ou par « son statut de juste ».
  rationale: Le nom hébreu peut couvrir la qualité ou la conduite juste, tandis que la suite mentionne au pluriel les actes justes. Une formulation ouverte préserve cette amplitude sémantique.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « Il vivra, oui, il vivra » restitue l’emphase hébraïque sans archaïsme. Le passage de la déclaration citée à la proposition conditionnelle reste au masculin singulier, comme dans le texte source.
