  source_fidelity: 'Le texte rend fidèlement les trois propositions de l’hébreu : la réduction du pays à la désolation, la cessation du « ge''on » de sa puissance, puis la désolation des montagnes d’Israël sans aucun passant. « Je ferai du pays » exprime de façon idiomatique la valeur résultative de וְנָתַתִּי. « Sans que personne y passe » préserve bien l’idée d’absence totale de passage.'
