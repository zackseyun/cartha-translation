source:
  edition: WLC
  text: וְ/נָתַתִּ֤י אֶת הָ/אָ֨רֶץ֙ שְׁמָמָ֣ה וּ/מְשַׁמָּ֔ה וְ/נִשְׁבַּ֖ת גְּא֣וֹן עֻזָּ֑/הּ וְ/שָֽׁמְמ֛וּ הָרֵ֥י יִשְׂרָאֵ֖ל מֵ/אֵ֥ין עוֹבֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/028.yaml
  text: And I will make the land a desolation and a waste[a], and the pride of its strength will cease, and the mountains of Israel will be desolate[b], with no one passing through.
translation:
  language: fr
  text: Je ferai du pays un lieu dévasté et désolé[a] ; l’orgueil de sa puissance[b] prendra fin. Les montagnes d’Israël seront dévastées, sans que personne y passe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un lieu dévasté qui suscite l’effroi ». Le second terme hébreu peut désigner une ruine qui provoque l’horreur ou la stupeur.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la majesté de sa puissance ». Le mot hébreu peut exprimer aussi bien l’orgueil que la grandeur ou la majesté.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Je ferai
  rationale: Dans cette construction, le verbe « donner, placer » introduit l’état auquel le pays sera réduit. « Je ferai du pays » exprime naturellement cette valeur en français.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Le contexte vise le territoire d’Israël ou de Juda, non la terre entière. « Pays » convient ici au référent territorial.
- source_word: שְׁמָמָה וּמְשַׁמָּה
  choice: un lieu dévasté et désolé
  rationale: Les deux termes proches décrivent une ruine complète. Cette formulation française conserve leur parallélisme sans répétition artificielle, tandis que la note signale la nuance d’effroi ou de stupeur possible pour le second.
- source_word: וְנִשְׁבַּת
  choice: prendra fin
  rationale: Le verbe exprime la cessation. « Prendra fin » s’accorde naturellement avec « l’orgueil ».
- source_word: גְּאוֹן עֻזָּהּ
  choice: l’orgueil de sa puissance
  rationale: גְּאוֹן peut évoquer l’orgueil ou la majesté. Dans cet oracle de jugement, « orgueil » rend bien la connotation négative, tandis que « sa » renvoie au pays.
- source_word: וְשָׁמְמוּ הָרֵי יִשְׂרָאֵל
  choice: Les montagnes d’Israël seront dévastées
  rationale: Le contexte géographique favorise le sens de dévastation plutôt que celui de stupeur. L’expression récurrente « montagnes d’Israël » est conservée.
- source_word: מֵאֵין עוֹבֵר
  choice: sans que personne y passe
  rationale: La formule décrit l’abandon total et l’absence de voyageurs. Le pronom « y » rend explicite en français le passage dans cette région sans ajouter une idée étrangère au texte.
theological_decisions:
- issue: Valeur de גְּאוֹן dans le contexte du jugement
  choice: orgueil
  alternative: majesté
  rationale: Le contexte annonce la fin de la puissance dont le pays tire fierté. « Orgueil » préserve la force critique de l’oracle, mais la note maintient ouverte la lecture plus neutre de « majesté ».
translation_notes:
  register: Français international moderne, sobre et digne. La structure suit de près les trois annonces successives du texte hébreu, tout en employant une syntaxe naturelle et accessible.
