revisions:
- from: La main de Yahweh avait été sur moi le soir, avant l’arrivée du rescapé[a]. Yahweh m’avait ouvert la bouche avant que cet homme arrive auprès de moi le matin. Ma bouche était donc ouverte, et je n’étais plus muet.
  to: La main de Yahweh avait été sur moi le soir, avant l’arrivée du rescapé[a], et Yahweh m’avait ouvert la bouche quand le rescapé est arrivé auprès de moi le matin. Ma bouche était ouverte, et je n’étais plus muet.
  rationale: La révision conserve les choix solides du projet, tout en supprimant l’inférence ajoutée par « donc », en rétablissant la reprise de « rescapé » et en formulant avec plus de prudence la relation temporelle complexe entre l’ouverture de la bouche et l’arrivée matinale.
