  text: וְ/יַד יְהוָה֩ הָיְתָ֨ה אֵלַ֜/י בָּ/עֶ֗רֶב לִ/פְנֵי֙ בּ֣וֹא הַ/פָּלִ֔יט וַ/יִּפְתַּ֣ח אֶת פִּ֔/י עַד בּ֥וֹא אֵלַ֖/י בַּ/בֹּ֑קֶר וַ/יִּפָּ֣תַח פִּ֔/י וְ/לֹ֥א נֶאֱלַ֖מְתִּי עֽוֹד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/022.yaml
  text: The hand of Yahweh had been upon me in the evening[a], before the fugitive came, and he opened my mouth until he came to me in the morning. So my mouth was opened, and I was no longer mute.
translation:
  language: fr
  text: La main de Yahweh avait été sur moi le soir, avant l’arrivée du rescapé[a], et Yahweh m’avait ouvert la bouche quand le rescapé est arrivé auprès de moi le matin. Ma bouche était ouverte, et je n’étais plus muet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du fugitif ». Le terme hébreu désigne une personne qui s’est échappée et a survécu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַד יְהוָה הָיְתָה אֵלַי
  choice: La main de Yahweh avait été sur moi
  rationale: Conserve l’expression prophétique de la « main » divine et rend אֵלַי par « sur moi ». Le plus-que-parfait situe cette action dès le soir, avant l’arrivée du rescapé.
- source_word: בָּעֶרֶב
  choice: le soir
  rationale: Expression temporelle simple et naturelle en français moderne.
- source_word: הַפָּלִיט
  choice: le rescapé
  rationale: Le terme désigne quelqu’un qui s’est échappé et a survécu. « Rescapé » convient au messager ayant échappé à la catastrophe de Jérusalem, sans lui prêter les connotations parfois négatives de « fugitif ».
- source_word: וַיִּפְתַּח אֶת פִּי
  choice: Yahweh m’avait ouvert la bouche
  rationale: Le sujet implicite est naturellement Yahweh. La reprise littérale de l’image de la bouche ouverte maintient le lien avec le mutisme antérieur d’Ézéchiel. Le nom explicite évite en français de confondre l’agent divin avec le rescapé.
- source_word: עַד בּוֹא אֵלַי בַּבֹּקֶר
  choice: avant que cet homme arrive auprès de moi le matin
  rationale: 'Dans ce contexte, עַד fixe la limite temporelle : l’ouverture de la bouche était accomplie au plus tard lors de l’arrivée matinale. La formulation française évite de donner à l’action ponctuelle « ouvrir » un déroulement artificiel jusqu’au matin.'
- source_word: וַיִּפָּתַח פִּי
  choice: Ma bouche était donc ouverte
  rationale: Rend le nifal par une tournure passive et conserve la répétition emphatique de « bouche ».
- source_word: וְלֹא נֶאֱלַמְתִּי עוֹד
  choice: et je n’étais plus muet
  rationale: Rend directement la fin du mutisme imposé au prophète dans un français courant et digne.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin personnel. « Yahweh » le préserve au lieu de lui substituer un titre.
- issue: Agent de l’ouverture de la bouche
  choice: Yahweh est explicitement nommé comme agent
  alternative: Conserver le simple pronom « il »
  rationale: Le sujet grammatical n’est pas répété en hébreu, mais le contexte désigne l’action divine. Répéter « Yahweh » en français empêche que « il » soit compris comme renvoyant au rescapé, tout en respectant le sens contextuel.
- issue: Valeur temporelle de עַד avec וַיִּפְתַּח
  choice: L’ouverture avait eu lieu avant l’arrivée matinale
  alternative: « il m’ouvrit la bouche jusqu’à ce qu’il arrive »
  rationale: Le verbe « ouvrir » décrit ici une action ponctuelle; עַד indique le terme auquel l’état résultant est constaté. La solution choisie rend la chronologie sans suggérer que Dieu aurait ouvert la bouche du prophète de façon continue toute la nuit.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe distingue explicitement Yahweh du rescapé afin d’éviter une ambiguïté pronominale propre au français. Le connecteur « donc » traduit la progression narrative sans ajouter un marqueur initial absent du texte.
