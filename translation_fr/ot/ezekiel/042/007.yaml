  yaml_path: translation/ot/ezekiel/042/007.yaml
  text: And the wall that was outside[a], alongside the chambers, toward the outer court, in front of the chambers—its length was fifty cubits.
translation:
  language: fr
  text: Le mur qui se trouvait à l’extérieur, vis-à-vis des salles[a], du côté de la cour extérieure, devant les salles, avait une longueur de cinquante coudées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parallèle aux salles ». La préposition hébraïque peut exprimer une correspondance, un alignement ou une position en vis-à-vis.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָדֵר
  choice: mur
  rationale: Dans cette description architecturale, le mot désigne une structure qui délimite un espace. « Mur » est naturel et digne, sans suggérer la légèreté ou le caractère provisoire d’une clôture.
- source_word: לַחוּץ
  choice: extérieur
  rationale: Le terme situe le mur à l’extérieur par rapport aux salles. L’adjectif « extérieur » s’intègre naturellement à la phrase française.
- source_word: לְעֻמַּת
  choice: parallèle à
  rationale: La préposition exprime une correspondance ou une position en vis-à-vis. Dans ce relevé architectural, « parallèle à » rend clairement l’alignement spatial, tout en signalant en note l’autre lecture possible.
- source_word: לְּשָׁכוֹת
  choice: salles
  rationale: Dans la vision du temple, le terme désigne des pièces aménagées. « Salles » est plus courant en français moderne que « chambres » pour des locaux architecturaux qui ne sont pas nécessairement destinés au sommeil.
- source_word: דֶּרֶךְ
  choice: du côté de
  rationale: Employé spatialement, le mot indique ici la direction ou le côté de la cour extérieure. « Du côté de » produit une description française claire sans surinterpréter le tracé.
- source_word: הֶחָצֵר הַחִיצוֹנָה
  choice: la cour extérieure
  rationale: « Cour extérieure » est le terme architectural usuel et transparent dans le contexte du sanctuaire.
- source_word: אֶל־פְּנֵי
  choice: devant
  rationale: Cette locution indique une position face à quelque chose. « Devant » conserve simplement cette relation spatiale.
- source_word: אָרְכּוֹ
  choice: avait … de long
  rationale: Le suffixe renvoie au mur. La tournure française « avait cinquante coudées de long » rend naturellement la mesure de sa longueur.
- source_word: חֲמִשִּׁים אַמָּה
  choice: cinquante coudées
  rationale: L’unité ancienne est conservée plutôt que convertie, afin de rester transparente par rapport au texte source.
