  yaml_path: translation/ot/ezekiel/042/002.yaml
  text: Facing the length of one hundred cubits was the north entrance[a], and the width was fifty cubits.
translation:
  language: fr
  text: Face à une longueur de cent coudées se trouvait l’entrée du nord[a], et la largeur était de cinquante coudées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Devant une longueur de cent coudées se trouvait l’entrée du nord. » L’expression spatiale hébraïque est concise et peut se traduire de plusieurs manières très proches.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל פְּנֵי
  choice: Du côté de
  rationale: Cette expression spatiale compacte indique ici la position ou l’orientation par rapport à la dimension mesurée. « Du côté de » reste naturel en français sans imposer une précision absente de l’hébreu.
- source_word: אֹרֶךְ
  choice: longueur
  rationale: Dans ce contexte architectural, le terme désigne la dimension longitudinale.
- source_word: אַמּוֹת הַמֵּאָה
  choice: cent coudées
  rationale: L’unité ancienne est conservée afin de respecter la précision architecturale du texte source.
- source_word: פֶּתַח הַצָּפוֹן
  choice: l’entrée nord
  rationale: פֶּתַח désigne une ouverture ou une entrée ; dans ce contexte de bâtiment, « entrée » est le terme français le plus naturel. « Nord » exprime de façon concise son emplacement ou son orientation.
- source_word: וְהָרֹחַב
  choice: et la largeur était
  rationale: רֹחַב désigne la dimension transversale. Le verbe « était » est ajouté pour rendre naturellement en français cette proposition nominale hébraïque.
- source_word: חֲמִשִּׁים אַמּוֹת
  choice: cinquante coudées
  rationale: Traduction directe de la mesure, avec maintien de la même unité ancienne.
