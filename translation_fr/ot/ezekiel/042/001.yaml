source:
  edition: WLC
  text: וַ/יּוֹצִאֵ֗/נִי אֶל הֶֽ/חָצֵר֙ הַ/חִ֣יצוֹנָ֔ה הַ/דֶּ֖רֶךְ דֶּ֣רֶךְ הַ/צָּפ֑וֹן וַ/יְבִאֵ֣/נִי אֶל הַ/לִּשְׁכָּ֗ה אֲשֶׁ֨ר נֶ֧גֶד הַ/גִּזְרָ֛ה וַ/אֲשֶֽׁר נֶ֥גֶד הַ/בִּנְיָ֖ן אֶל הַ/צָּפֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/001.yaml
  text: Then he brought me out into the outer court by the way toward the north[b][a], and he brought me to the chamber that was opposite the separate area and opposite the building to the north.
translation:
  language: fr
  text: Puis il me fit sortir dans la cour extérieure, en prenant le chemin du nord[a], et il me conduisit jusqu’à la salle qui se trouvait en face de l’espace séparé[b] et en face du bâtiment, du côté nord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu répète littéralement « le chemin, chemin du nord », une tournure indiquant la direction ou l’itinéraire.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’emplacement séparé ». Dans la vision du temple d’Ézéchiel, le terme hébreu désigne une zone distincte, mise à part.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִאֵנִי
  choice: Puis il me fit sortir
  rationale: Le hifil de יצא exprime l’action de faire sortir; « Puis » rend naturellement la progression narrative du waw consécutif.
- source_word: הֶחָצֵר הַחִיצוֹנָה
  choice: dans la cour extérieure
  rationale: « Cour extérieure » est le terme architectural courant et précis dans le contexte du temple.
- source_word: הַדֶּרֶךְ דֶּרֶךְ הַצָּפוֹן
  choice: en prenant le chemin du nord
  rationale: Cette formulation française naturelle conserve l’idée d’un itinéraire orienté vers le nord sans reproduire maladroitement la répétition hébraïque de דֶּרֶךְ.
- source_word: וַיְבִאֵנִי
  choice: et il me conduisit jusqu’à
  rationale: Le hifil de בוא peut signifier « faire venir », « amener » ou « conduire ». Ici, « conduisit jusqu’à » décrit clairement le déplacement sans affirmer qu’il entra dans la salle.
- source_word: הַלִּשְׁכָּה
  choice: la salle
  rationale: Dans l’architecture du temple, לִשְׁכָּה désigne une salle ou une pièce annexe; le singulier suit le texte massorétique.
- source_word: נֶגֶד
  choice: en face de
  rationale: Cette expression rend clairement la relation spatiale indiquée par les deux occurrences de נֶגֶד.
- source_word: הַגִּזְרָה
  choice: l’espace séparé
  rationale: Le terme désigne dans la vision d’Ézéchiel une zone distincte, mise à part; cette traduction garde cette notion sans imposer une fonction plus précise.
- source_word: הַבִּנְיָן
  choice: le bâtiment
  rationale: « Bâtiment » est l’équivalent français direct et naturel du terme architectural général בִּנְיָן.
- source_word: אֶל הַצָּפוֹן
  choice: du côté nord
  rationale: La formule conserve la valeur spatiale de l’hébreu tout en laissant ouverte la portée syntaxique exacte de l’indication finale.
theological_decisions: []
