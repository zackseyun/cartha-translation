  text: For they were in three stories[a], and they had no pillars like the pillars of the courts; therefore the upper stories receded more than the lower and middle ones from the ground.
translation:
  language: fr
  text: En effet, elles étaient disposées sur trois niveaux et n’avaient pas de colonnes comme celles des cours. C’est pourquoi les niveaux supérieurs étaient davantage en retrait[a] que les niveaux inférieur et intermédiaire, par rapport au sol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « étaient réduits » ou « étaient reculés » ; le verbe hébreu est rare ici, et le détail architectural exact reste incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: En effet
  rationale: Introduit l’explication de la disposition architecturale décrite au verset précédent.
- source_word: מְשֻׁלָּשׁוֹת
  choice: disposées sur trois niveaux
  rationale: Dans ce contexte architectural, le terme décrit vraisemblablement une structure organisée en trois étages ou niveaux, tout en restant naturel en français.
- source_word: הֵנָּה
  choice: elles étaient
  rationale: Le pronom féminin pluriel renvoie aux chambres mentionnées dans le contexte.
- source_word: וְאֵין לָהֶן עַמּוּדִים
  choice: et n’avaient pas de colonnes
  rationale: La construction existentielle avec ל exprime ici la possession; « colonnes » convient au contexte architectural.
- source_word: כְּעַמּוּדֵי הַחֲצֵרוֹת
  choice: comme celles des cours
  rationale: Le pronom « celles » reprend naturellement « colonnes » et maintient la comparaison avec les cours du sanctuaire.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Exprime clairement la conséquence de l’absence de colonnes.
- source_word: נֶאֱצַל
  choice: étaient en retrait
  rationale: Le verbe rare semble décrire un retrait ou une réduction progressive de la structure; la formulation française exprime le sens spatial probable sans masquer l’incertitude.
- source_word: מֵהַתַּחְתּוֹנוֹת וּמֵהַתִּיכֹנוֹת
  choice: par rapport aux niveaux inférieur et intermédiaire
  rationale: Les formes féminines renvoient aux parties ou chambres des niveaux inférieur et médian; la tournure comparative explicite leur relation avec les niveaux supérieurs.
- source_word: מֵהָאָרֶץ
  choice: à partir du sol
  rationale: Dans cette description d’un bâtiment, הָאָרֶץ désigne le sol comme point de référence vertical.
