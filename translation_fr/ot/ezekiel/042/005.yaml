  text: וְ/הַ/לְּשָׁכ֥וֹת הָ/עֶלְיוֹנֹ֖ת קְצֻר֑וֹת כִּֽי יוֹכְל֨וּ אַתִּיקִ֜ים מֵ/הֵ֗נָה מֵֽ/הַ/תַּחְתֹּנ֛וֹת וּ/מֵ/הַ/תִּֽכֹנ֖וֹת בִּנְיָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/005.yaml
  text: And the upper chambers were narrower[a], because the galleries took away from them, more than from the lower and the middle parts of the building.
translation:
  language: fr
  text: Les salles supérieures étaient plus étroites, car les galeries[a] empiétaient davantage sur elles que sur celles du bas et du milieu de l’édifice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les terrasses », « les colonnades » ou « les saillies ». Le terme hébreu traduit par « galeries » (אַתִּיקִים) est rare, et l’élément architectural précis qu’il désigne reste incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְּשָׁכוֹת
  choice: les salles
  rationale: Dans ce contexte architectural et cultuel, לִשְׁכָה désigne des pièces annexes. « Salles » est naturel en français moderne et convient à la description de l’édifice.
- source_word: הָעֶלְיוֹנוֹת
  choice: supérieures
  rationale: L’adjectif désigne le niveau du haut, par contraste avec les niveaux inférieur et intermédiaire mentionnés ensuite.
- source_word: קְצֻרוֹת
  choice: plus étroites
  rationale: Le mot signifie littéralement « courtes » ou « réduites », mais la proposition causale indique ici une réduction de l’espace disponible. « Plus étroites » exprime clairement cette comparaison architecturale.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la cause de la moindre largeur des salles supérieures.
- source_word: יוֹכְלוּ
  choice: empiétaient davantage sur
  rationale: Le verbe אָכַל, littéralement « manger, consumer », décrit métaphoriquement des éléments architecturaux qui prennent de la place. « Empiéter sur » rend naturellement cet effet spatial.
- source_word: אַתִּיקִים
  choice: les galeries
  rationale: Ce terme architectural rare est de sens incertain. « Galeries » est une désignation intelligible et traditionnelle, sans exclure d’autres référents possibles, signalés en note.
- source_word: מֵהֵנָה
  choice: sur elles
  rationale: Le pronom renvoie aux salles supérieures auxquelles les galeries retirent de l’espace.
- source_word: מֵהַתַּחְתֹּנוֹת וּמֵהַתִּכֹנוֹת
  choice: que sur celles du bas et du milieu
  rationale: Les groupes prépositionnels prennent une valeur comparative dans la phrase et renvoient aux salles des deux autres niveaux.
- source_word: בִּנְיָן
  choice: de l’édifice
  rationale: Le substantif désigne ici la construction décrite. « Édifice » garde un registre architectural digne et évite l’ambiguïté de « bâtiment » appliqué aux seuls niveaux.
