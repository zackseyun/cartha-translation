base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/011.yaml
  text: And before them was a passage[a], like the appearance of the chambers that faced north; as was their length, so was their width, and all their exits, their arrangements[b], and their entrances were alike.
translation:
  language: fr
  text: Devant elles, il y avait un passage[a] dont l’aspect correspondait à celui des salles du côté nord. Leur longueur et leur largeur correspondaient à celles de ces salles, et toutes leurs sorties, leur agencement[b] et leurs entrées correspondaient également aux leurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Devant elles se trouvait un passage correspondant à l’aspect des salles du côté nord. »'
    reason: La syntaxe comparative peut rattacher plus directement le passage à l’aspect ou à la configuration des salles septentrionales.
  - marker: b
    text: Le terme hébreu peut aussi signifier « règles », « prescriptions » ou « manière prescrite » ; ici, il désigne probablement l’agencement ou le plan prescrit des salles.
    reason: Le sens architectural de מִשְׁפָּט est contextuel et conserve une nuance possible de conformité à une règle.
lexical_decisions:
- source_word: וְדֶרֶךְ לִפְנֵיהֶם
  choice: Devant elles se trouvait un passage
  rationale: דֶּרֶךְ désigne ici une voie d’accès dans un contexte architectural. « Passage » est naturel et précis sans en déterminer excessivement la forme; לִפְנֵיהֶם indique sa position devant les salles.
- source_word: כְּמַרְאֵה הַלְּשָׁכוֹת אֲשֶׁר דֶּרֶךְ הַצָּפוֹן
  choice: semblable à celui des salles situées du côté nord
  rationale: מַרְאֶה porte sur l’aspect ou la configuration visible. Le pronom « celui » reprend le passage et évite la tournure pesante « semblable à l’aspect des salles », tandis que דֶּרֶךְ הַצָּפוֹן exprime ici la localisation ou l’orientation au nord.
- source_word: כְּאָרְכָּן כֵּן רָחְבָּן
  choice: Elles avaient la même longueur et la même largeur
  rationale: La construction corrélative indique que les dimensions de ces salles correspondaient à celles des salles du nord. Cette formulation française rend clairement la comparaison implicite dans le contexte.
- source_word: וְכֹל מוֹצָאֵיהֶן
  choice: toutes leurs sorties
  rationale: מוֹצָא désigne un lieu par lequel on sort; « sorties » convient au cadre architectural tout en laissant ouverte la nuance de points d’accès.
- source_word: וּכְמִשְׁפְּטֵיהֶן
  choice: leur disposition
  rationale: מִשְׁפָּט signifie souvent jugement, règle ou prescription, mais désigne ici vraisemblablement l’agencement conforme au plan prescrit. « Disposition » convient au contexte architectural sans effacer entièrement l’idée de norme, signalée en note.
- source_word: וּכְפִתְחֵיהֶן
  choice: leurs entrées
  rationale: פֶּתַח désigne une ouverture ou une entrée. « Entrées » est clair et idiomatique dans cette description de bâtiment.
