  text: For the length of the chambers that were by the outer court was fifty cubits, and behold, the part facing the temple was a hundred cubits.
translation:
  language: fr
  text: 'En effet, la longueur des salles qui donnaient sur la cour extérieure était de cinquante coudées ; et voici : devant le temple, cent coudées.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְשָׁכוֹת
  choice: salles
  rationale: Dans la description architecturale d’Ézéchiel, le terme désigne des pièces ou salles annexes; « salles » est naturel et cohérent dans ce contexte.
- source_word: לֶחָצֵר הַחִצוֹנָה
  choice: donnaient sur la cour extérieure
  rationale: La préposition לְ exprime ici vraisemblablement l’orientation ou la relation spatiale des salles avec la cour extérieure; cette formulation française rend cette relation sans surcharger le texte.
- source_word: עַל־פְּנֵי הַהֵיכָל
  choice: faisant face au temple
  rationale: L’expression spatiale signifie ici « devant/en face du temple ». « Faisant face » préserve l’idée d’orientation retenue par le contexte, sans identifier plus précisément que l’hébreu le sujet elliptique.
- source_word: אַמָּה
  choice: coudée
  rationale: Unité de mesure antique traditionnelle et immédiatement reconnaissable en français biblique.
- source_word: וְהִנֵּה
  choice: tandis que
  rationale: Dans cette description architecturale, la particule attire l’attention sur le contraste entre les deux mesures; une articulation comparative naturelle convient mieux que le littéral « voici ».
