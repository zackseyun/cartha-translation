source:
  edition: WLC
  text: וְ/לִ/פְנֵ֨י הַ/לְּשָׁכ֜וֹת מַהֲלַךְ֩ עֶ֨שֶׂר אַמּ֥וֹת רֹ֨חַב֙ אֶל הַ/פְּנִימִ֔ית דֶּ֖רֶךְ אַמָּ֣ה אֶחָ֑ת וּ/פִתְחֵי/הֶ֖ם לַ/צָּפֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/004.yaml
  text: Before the chambers was a walkway ten cubits wide toward the inner court[a], and a passage one cubit wide[b]; and their entrances faced north.
translation:
  language: fr
  text: Devant les salles se trouvait une allée large de dix coudées, du côté intérieur[a], ainsi qu’un passage d’une coudée de large[b] ; leurs entrées étaient tournées vers le nord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « vers l’intérieur » ou « du côté intérieur », sans préciser le nom. Certaines traductions comprennent « vers la cour intérieure ».
    reason: alternative_reading
  - marker: b
    text: Le texte hébreu est difficile dans cette proposition. On peut comprendre « un passage d’une coudée » ou, selon une autre vocalisation ou tradition textuelle, « de cent coudées ».
    reason: textual_variant
lexical_decisions:
- source_word: לִפְנֵי הַלְּשָׁכוֹת
  choice: Devant les salles
  rationale: La préposition indique une position en face ou à l’avant des pièces. « Salles » convient au contexte architectural sans l’archaïsme de « chambres ».
- source_word: מַהֲלַךְ
  choice: une allée
  rationale: Le nom désigne un espace aménagé pour circuler. « Allée » reste naturel et ne suppose pas nécessairement un corridor couvert.
- source_word: עֶשֶׂר אַמּוֹת רֹחַב
  choice: large de dix coudées
  rationale: Formulation française idiomatique qui conserve l’unité de mesure du texte source.
- source_word: אֶל הַפְּנִימִית
  choice: du côté intérieur
  rationale: L’adjectif féminin substantivé n’explicite pas le nom auquel il se rapporte. Cette formulation préserve l’ellipse sans ajouter « cour ».
- source_word: דֶּרֶךְ אַמָּה אֶחָת
  choice: un passage d’une coudée de large
  rationale: Dans ce cadre architectural, דֶּרֶךְ peut désigner une voie d’accès. La largeur est explicitée en français d’après le contexte immédiat.
- source_word: וּפִתְחֵיהֶם לַצָּפוֹן
  choice: leurs entrées étaient tournées vers le nord
  rationale: « Entrées » rend naturellement les ouvertures donnant accès aux salles, et « tournées vers » exprime clairement leur orientation.
