base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/015.yaml
  text: When he had finished measuring the inner house[a], he brought me out by way of the gate that faced east[b], and he measured it all around.
translation:
  language: fr
  text: Quand il eut fini de mesurer le bâtiment intérieur[a], il me fit sortir en passant par la porte qui était orientée vers l’est[b], puis il le mesura tout autour[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « la maison intérieure » ; dans cette vision, « maison » désigne un bâtiment du Temple.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la porte dont la face était en direction de l’est ».
    reason: literal_rendering
  - marker: c
    text: Le pronom hébreu est masculin singulier, mais son référent précis n’est pas nommé ici ; il peut renvoyer au bâtiment ou, plus largement, à l’ensemble du Temple que l’homme mesure extérieurement dans les versets suivants.
    reason: referential_ambiguity
lexical_decisions:
- source_word: וְכִלָּה אֶת מִדּוֹת
  choice: Quand il eut fini de prendre les mesures
  rationale: Le verbe כלה exprime l’achèvement, et מִדּוֹת désigne les mesures. La proposition temporelle rend naturellement en français la succession des actions.
- source_word: הַבַּיִת הַפְּנִימִי
  choice: l’édifice intérieur
  rationale: בַּיִת signifie littéralement « maison », mais désigne ici un édifice dans la vision du Temple. « Édifice intérieur » conserve le caractère architectural et la position intérieure sans réduire d’emblée le référent au seul sanctuaire.
- source_word: וְהוֹצִיאַנִי
  choice: il me fit sortir
  rationale: 'Le hiphil de יצא est causatif : « faire sortir ». Cette formulation française conserve directement cette valeur.'
- source_word: הַשַּׁעַר אֲשֶׁר פָּנָיו דֶּרֶךְ הַקָּדִים
  choice: la porte dont la façade était orientée vers l’est
  rationale: פָּנָיו, littéralement « sa face », décrit ici le devant ou la façade de la porte, orientée en direction de l’est.
- source_word: וּמְדָדוֹ
  choice: puis il le mesura
  rationale: Le suffixe masculin singulier est rendu par « le ». Son antécédent précis reste implicite dans l’hébreu et fait l’objet d’une note plutôt que d’être précisé dans le texte.
- source_word: סָבִיב סָבִיב
  choice: tout autour
  rationale: La répétition hébraïque renforce l’idée d’une mesure effectuée sur tous les côtés ; « tout autour » en donne une expression française naturelle.
theological_decisions: []
