base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/020.yaml
  text: He measured it on the four sides[a]; it had a wall all around, five hundred cubits long and five hundred cubits wide[b], to make a separation between the holy and the common.
translation:
  language: fr
  text: 'Il le mesura sur les quatre côtés[a]. Un mur l’entourait de tous côtés : cinq cents de long et cinq cents de large[b], afin de séparer le sacré de ce qui est ordinaire[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux quatre vents »; autrement : « dans les quatre directions ».'
    reason: lexical_alternative
  - marker: b
    text: L’unité n’est pas précisée dans ce verset. Les versets précédents parlent d’une mesure au roseau; certains témoins anciens ou certaines traductions comprennent plutôt des coudées.
    reason: textual_or_measurement_ambiguity
  - marker: c
    text: 'Autrement : « le sacré de ce qui est profane ». Ici, « ordinaire » désigne ce qui n’est pas consacré, sans impliquer nécessairement quelque chose de mauvais ou d’impur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַרְבַּע רוּחוֹת
  choice: dans les quatre directions
  rationale: רוּחוֹת signifie littéralement « vents » et, par extension, « directions ». Dans ce contexte architectural, l’expression désigne les quatre directions ou côtés de l’ensemble.
- source_word: מְדָדוֹ
  choice: Il le mesura
  rationale: Le verbe qal à l’accompli, muni d’un suffixe masculin singulier, signifie naturellement « il le mesura »; le pronom reprend l’ensemble décrit dans le contexte.
- source_word: חוֹמָה לוֹ סָבִיב סָבִיב
  choice: Il y avait tout autour un mur
  rationale: La répétition de סָבִיב souligne que le mur entourait entièrement l’espace. Cette formulation en rend le sens sans reproduire une répétition peu naturelle en français.
- source_word: אֹרֶךְ חֲמֵשׁ מֵאוֹת וְרֹחַב חֲמֵשׁ מֵאוֹת
  choice: de cinq cents de long sur cinq cents de large
  rationale: L’hébreu donne deux dimensions de cinq cents sans répéter ici l’unité. La traduction conserve cette absence plutôt que d’introduire « coudées » dans le texte principal.
- source_word: לְהַבְדִּיל
  choice: destiné à séparer
  rationale: L’infinitif exprime le but ou la fonction du mur. « Destiné à séparer » s’intègre naturellement à la phrase française.
- source_word: בֵּין הַקֹּדֶשׁ לְחֹל
  choice: le sacré de ce qui est ordinaire
  rationale: קֹדֶשׁ désigne ce qui est consacré, tandis que חֹל désigne ce qui ne l’est pas. « Ordinaire » préserve cette opposition cultuelle sans suggérer nécessairement une faute morale.
theological_decisions:
- issue: Opposition cultuelle entre קֹדֶשׁ et חֹל
  choice: le sacré de ce qui est ordinaire
  alternative: le saint du profane
  rationale: Le passage distingue l’espace consacré de l’espace non consacré; il ne présente pas nécessairement ce dernier comme impur ou moralement mauvais. « Ce qui est ordinaire » garde cette nuance, tandis que « profane » peut aujourd’hui évoquer l’irrévérence.
- issue: Unité des dimensions
  choice: ne pas ajouter d’unité dans le texte principal
  alternative: cinq cents coudées de long sur cinq cents coudées de large
  rationale: Le verset hébreu indique deux fois « cinq cents » mais ne nomme pas ici l’unité. Une note signale que le contexte peut permettre de la comprendre comme une coudée, sans trancher silencieusement une difficulté textuelle et contextuelle.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde le caractère architectural du passage, évite d’ajouter une unité absente de ce verset et explicite en note les principales ambiguïtés lexicales et métrologiques.
