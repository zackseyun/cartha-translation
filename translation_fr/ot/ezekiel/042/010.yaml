  yaml_path: translation/ot/ezekiel/042/010.yaml
  text: Along the width of the court wall toward the east[a], facing the separate area and facing the building[b], were chambers.
translation:
  language: fr
  text: Le long du mur de la cour, du côté de l’est[a], en face de l’espace séparé[b] et du bâtiment, se trouvaient des salles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « dans la largeur de l’enceinte de la cour » ou « sur la largeur du mur de la cour, vers l’est ». La formulation hébraïque est condensée et son agencement architectural demeure incertain.'
    reason: lexical_alternative
  - marker: b
    text: « L’espace séparé » traduit un terme technique de la vision du temple d’Ézéchiel, qui désigne une zone distincte mise à part des constructions voisines.
    reason: cultural_note
lexical_decisions:
- source_word: בְּרֹחַב
  choice: le long de
  rationale: Avec גֶּדֶר הֶחָצֵר, l’expression situe les salles par rapport à l’étendue du mur. « Le long de » donne en français une description spatiale naturelle, tout en laissant à la note les autres analyses possibles de cette formulation architecturale condensée.
- source_word: גֶּדֶר הֶחָצֵר
  choice: le mur de la cour
  rationale: גֶּדֶר désigne une clôture ou un mur d’enceinte. Dans ce contexte architectural, « mur » est clair et idiomatique.
- source_word: דֶּרֶךְ הַקָּדִים
  choice: du côté de l’est
  rationale: דֶּרֶךְ suivi d’un point cardinal peut exprimer la direction ou le côté. Ce rendu convient à l’implantation architecturale sans imposer une orientation plus précise que l’hébreu.
- source_word: אֶל פְּנֵי
  choice: en face de
  rationale: Dans cette description, la locution répétée exprime la position ou l’orientation par rapport aux deux éléments mentionnés.
- source_word: הַגִּזְרָה
  choice: l’espace séparé
  rationale: Dans la vision du temple d’Ézéchiel, ce terme technique désigne une zone distincte, séparée du reste de l’ensemble. « Espace séparé » conserve cette idée sans ajouter une fonction non indiquée.
- source_word: הַבִּנְיָן
  choice: le bâtiment
  rationale: Le nom signifie simplement « bâtiment » ou « construction » ; « bâtiment » est le terme français le plus direct dans ce contexte.
- source_word: לְשָׁכוֹת
  choice: se trouvaient des salles
  rationale: לְשָׁכוֹת désigne des salles ou pièces annexes, notamment dans un cadre cultuel. L’hébreu étant elliptique et sans verbe exprimé, « se trouvaient » est ajouté pour former une phrase française naturelle.
