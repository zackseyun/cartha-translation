  register: Français international moderne, sobre et digne. La syntaxe a été fluidifiée sans masquer l’incertitude spatiale de l’hébreu, signalée en note. La répétition hébraïque de אֶל פְּנֵי est rendue une seule fois en français (« en face de… et de… »), puisque les deux compléments gardent clairement la même relation.
