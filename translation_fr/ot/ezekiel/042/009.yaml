  text: And below these chambers was the entrance from the east[a], as one enters them from the outer court.
translation:
  language: fr
  text: Sous ces chambres se trouvait l’entrée, du côté de l’est[a], quand on y entrait depuis la cour extérieure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « depuis l’est ». L’expression peut désigner soit l’emplacement oriental de l’entrée, soit une arrivée depuis l’est.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִתַּחְתֶּה לְשָׁכוֹת הָאֵלֶּה
  choice: Sous ces chambres
  rationale: Rend naturellement la relation spatiale exprimée par « sous, au-dessous de », sans préciser davantage une disposition architecturale incertaine.
- source_word: הַמָּבוֹא
  choice: l’entrée
  rationale: Désigne ici l’accès ou le lieu par lequel on entre dans les chambres.
- source_word: מֵהַקָּדִים
  choice: du côté de l’est
  rationale: Expression française naturelle qui conserve l’orientation orientale tout en évitant d’imposer exclusivement soit l’emplacement, soit la direction d’approche.
- source_word: בְּבֹאוֹ לָהֵנָּה
  choice: quand on y venait
  rationale: Le suffixe masculin singulier peut avoir une valeur indéfinie dans cette description; « on » est idiomatique, et « y » renvoie aux chambres.
- source_word: מֵהֶחָצֵר הַחִיצֹנָה
  choice: depuis la cour extérieure
  rationale: « Cour extérieure » est le terme architectural courant pour cette partie du complexe du temple; « depuis » marque clairement le point de départ.
