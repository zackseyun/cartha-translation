  text: 'He measured the north side: five hundred reeds[a], by the measuring reed all around.'
translation:
  language: fr
  text: 'Il mesura le côté nord : cinq cents roseaux[a], au roseau à mesurer, tout autour.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « cinq cents roseaux ». Certains manuscrits et certaines versions anciennes présentent une leçon rendue dans quelques traductions par « cinq cents coudées ». Le texte principal suit ici l’hébreu massorétique.'
    reason: textual_variant
lexical_decisions:
- source_word: מָדַד
  choice: Il mesura
  rationale: Le qal accompli, troisième personne du masculin singulier, poursuit le récit de l’action de mesurer. Le passé simple convient au registre narratif soutenu.
- source_word: רוּחַ הַצָּפוֹן
  choice: le côté nord
  rationale: Dans ce contexte architectural, רוּחַ désigne un côté ou une direction, et non le vent.
- source_word: חֲמֵשׁ מֵאוֹת
  choice: cinq cents
  rationale: Rendu direct du nombre cardinal hébreu.
- source_word: קָנִים
  choice: roseaux
  rationale: Le texte massorétique porte explicitement le pluriel de קָנֶה, « roseau », employé ici comme unité fondée sur le roseau à mesurer. La variante « coudées » est signalée en note.
- source_word: בִּקְנֵה הַמִּדָּה
  choice: avec le roseau à mesurer
  rationale: Le beth instrumental indique l’instrument ou l’étalon utilisé. Cette formulation est naturelle en français et reste proche de l’hébreu.
- source_word: סָבִיב
  choice: tout autour
  rationale: L’adverbe exprime une mesure entourant le périmètre; « tout autour » en conserve la portée.
