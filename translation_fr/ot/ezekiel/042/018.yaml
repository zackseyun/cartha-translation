lexical_decisions:
- source_word: ר֥וּחַ הַ/דָּר֖וֹם
  choice: le côté sud
  rationale: רוּחַ peut désigner le vent, une direction ou un côté. Dans cette série de mesures architecturales, l’expression désigne naturellement le côté sud.
- source_word: מָדָ֑ד
  choice: Il mesura
  rationale: Le verbe מדד signifie simplement « mesurer »; le sujet est l’homme chargé des mesures dans le contexte précédent.
- source_word: חֲמֵשׁ מֵא֥וֹת
  choice: cinq cents
  rationale: Rendu direct du nombre cardinal hébreu.
- source_word: קָנִ֖ים
  choice: roseaux
  rationale: Le texte massorétique porte קָנִים, « roseaux », employé ici comme unité de mesure. La variante « coudées » est signalée en note.
- source_word: בִּ/קְנֵ֥ה הַ/מִּדָּֽה
  choice: avec le roseau à mesurer
  rationale: 'La préposition ב est instrumentale : la mesure est prise au moyen du roseau étalon. « Roseau à mesurer » est naturel et précis en français.'
