revisions:
- from: Quand les prêtres entreront, ils ne sortiront pas du lieu saint pour aller dans la cour extérieure. Ils y déposeront les vêtements dans lesquels ils auront assuré le service, car ces vêtements sont saints. Ils revêtiront d’autres vêtements, puis s’approcheront de ce qui est destiné au peuple[a].
  to: Quand les prêtres entreront, ils ne sortiront pas du lieu saint pour aller dans la cour extérieure. Ils y déposeront les vêtements dans lesquels ils assurent le service, car ces vêtements sont saints. Ils revêtiront d’autres vêtements, puis s’approcheront de ce qui est pour le peuple[a].
  rationale: La révision remplace « destiné au peuple » par « pour le peuple », qui rend directement la préposition ל sans imposer une notion de destination. Elle simplifie aussi le relatif décrivant les vêtements de service. Le reste du texte rend fidèlement la prescription, le contraste entre le lieu saint et la cour extérieure, ainsi que la sainteté des vêtements.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:00:53Z'
review_pass:
  verdict: revise
  source_fidelity: La structure prescriptive et les principaux termes hébreux sont bien rendus. Toutefois, « destiné au peuple » introduit une nuance de destination que l’expression elliptique אֲשֶׁר לָעָם (« ce qui est pour le peuple ») n’impose pas. La traduction doit conserver l’ellipse sans ajouter cette précision.
  naturalness: Le français est globalement clair et d’un registre approprié. « auront assuré le service » est cependant lourd et son futur antérieur suggère inutilement une antériorité; « assurent le service » exprime naturellement la fonction habituelle des vêtements.
  terminology: « lieu saint », « cour extérieure », « vêtements », « saints » et « revêtir » conviennent au contexte cultuel et au français moderne. « Assurer le service » garde un registre sacerdotal non confessionnel.
  issues:
  - severity: medium
    issue: Nuance ajoutée dans « ce qui est destiné au peuple »
    rationale: « Destiné à » restreint l’expression à une finalité ou à une affectation. L’hébreu אֲשֶׁר לָעָם est elliptique et signifie plus littéralement « ce qui est pour le peuple »; le contexte peut viser une zone accessible au peuple, mais le texte ne le précise pas.
  - severity: low
    issue: Futur antérieur dans « dans lesquels ils auront assuré le service »
    rationale: Le relatif décrit les vêtements servant au ministère, non une action explicitement achevée avant leur dépôt. Un présent générique est plus idiomatique et plus proche de la valeur contextuelle de l’imparfait hébreu.
  revised_text: Quand les prêtres entreront, ils ne sortiront pas du lieu saint pour aller dans la cour extérieure. Ils y déposeront les vêtements dans lesquels ils assurent le service, car ces vêtements sont saints. Ils revêtiront d’autres vêtements, puis s’approcheront de ce qui est pour le peuple[a].
  revised_footnotes:
