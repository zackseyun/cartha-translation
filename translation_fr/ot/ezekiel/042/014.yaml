  text: בְּ/בֹאָ֣/ם הַ/כֹּהֲנִ֗ים וְ/לֹֽא יֵצְא֤וּ מֵ/הַ/קֹּ֨דֶשׁ֙ אֶל הֶ/חָצֵ֣ר הַ/חִיצוֹנָ֔ה וְ/שָׁ֞ם יַנִּ֧יחוּ בִגְדֵי/הֶ֛ם אֲשֶׁר יְשָׁרְת֥וּ בָ/הֶ֖ן כִּֽי קֹ֣דֶשׁ הֵ֑נָּה ילבשו בְּגָדִ֣ים אֲחֵרִ֔ים וְ/קָרְב֖וּ אֶל אֲשֶׁ֥ר לָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/014.yaml
  text: When the priests enter[a], they shall not go out from the holy place into the outer court, but there they shall leave their garments in which they minister, for they are holy. They shall put on other garments, and then approach what belongs to the people.
translation:
  language: fr
  text: Quand les prêtres entreront, ils ne sortiront pas du lieu saint pour aller dans la cour extérieure. Ils y déposeront les vêtements dans lesquels ils assurent le service, car ces vêtements sont saints. Ils revêtiront d’autres vêtements, puis s’approcheront de ce qui est pour le peuple[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque est elliptique et peut désigner l’espace accessible au peuple.
    reason: L’hébreu ne précise pas le nom sous-entendu; la note préserve l’ambiguïté tout en indiquant l’interprétation spatiale probable.
lexical_decisions:
- source_word: בְּבֹאָם הַכֹּהֲנִים
  choice: Quand les prêtres entreront
  rationale: La préposition בְּ suivie de l’infinitif construit et du suffixe forme une proposition temporelle. Le futur convient aux prescriptions qui suivent.
- source_word: וְלֹא יֵצְאוּ מֵהַקֹּדֶשׁ אֶל הֶחָצֵר הַחִיצוֹנָה
  choice: ils ne sortiront pas du lieu saint pour aller dans la cour extérieure
  rationale: La formulation garde la valeur prescriptive de l’imparfait et exprime clairement le déplacement interdit entre l’espace saint et la cour extérieure.
- source_word: וְשָׁם יַנִּיחוּ בִגְדֵיהֶם
  choice: Ils y déposeront les vêtements
  rationale: יַנִּיחוּ signifie ici laisser ou déposer. « Déposeront » rend naturellement l’action de retirer les vêtements et de les laisser dans l’espace prévu.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָהֶן
  choice: dans lesquels ils auront assuré le service
  rationale: שׁרת désigne le service sacerdotal. Cette formulation conserve sa portée cultuelle sans introduire un vocabulaire ecclésiastique ultérieur.
- source_word: כִּי קֹדֶשׁ הֵנָּה
  choice: car ces vêtements sont saints
  rationale: Le pronom féminin pluriel renvoie aux vêtements. La répétition explicite du nom évite en français une référence pronominale ambiguë.
- source_word: יִלְבְּשׁוּ בְּגָדִים אֲחֵרִים
  choice: Ils revêtiront d’autres vêtements
  rationale: « Revêtir » est un verbe actuel et digne qui exprime précisément le changement de tenue requis.
- source_word: וְקָרְבוּ אֶל אֲשֶׁר לָעָם
  choice: puis s’approcheront de ce qui est destiné au peuple
  rationale: L’hébreu est elliptique et ne précise pas le nom sous-entendu. La traduction conserve cette indétermination au lieu d’imposer « espace », « cour » ou « choses ».
theological_decisions:
- issue: Sainteté des vêtements sacerdotaux
  choice: Dire explicitement que les vêtements sont saints en raison du contexte de service sacerdotal, sans expliquer davantage la source ou le mécanisme de cette sainteté.
  alternative: Réduire cette sainteté à une simple règle de procédure ou l’expliciter comme une sainteté transmise par le sanctuaire.
  rationale: Le texte affirme directement la sainteté des vêtements et exige leur séparation de la sphère accessible au peuple, mais il ne développe pas ici une théorie de cette sainteté.
- issue: Référent de אֲשֶׁר לָעָם
  choice: Conserver l’expression indéterminée « ce qui est destiné au peuple ».
  alternative: Traduire explicitement par « l’espace accessible au peuple » ou « la cour du peuple ».
  rationale: Le contexte suggère vraisemblablement une zone accessible au peuple, mais aucun substantif correspondant à « espace » ou « cour » n’apparaît dans cette expression hébraïque.
translation_notes:
  register: Français international moderne, clair et digne. Le ton prescriptif est rendu au futur. Le vocabulaire évite aussi bien l’archaïsme que les termes propres à une tradition ecclésiastique particulière.
