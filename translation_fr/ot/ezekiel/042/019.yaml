  text: He turned to the west side and measured five hundred reeds with the measuring reed[a][b].
translation:
  language: fr
  text: Il se tourna vers le côté ouest[a] et mesura cinq cents roseaux avec le roseau de mesure[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vers la direction de la mer », manière hébraïque de désigner l’ouest.'
    reason: cultural_note
  - marker: b
    text: Certains interprètes et certaines versions lisent « coudées » plutôt que « roseaux » dans ce contexte de mesures, mais le texte hébreu porte ici « roseaux ».
    reason: alternative_reading
lexical_decisions:
- source_word: סָבַב
  choice: Il se tourna
  rationale: Le verbe peut signifier « tourner » ou « faire le tour ». Dans cette suite de mesures, il indique naturellement le passage au côté suivant.
- source_word: אֶל רוּחַ הַיָּם
  choice: vers le côté ouest
  rationale: L’expression signifie littéralement « vers la direction de la mer ». Dans l’usage géographique hébreu, la mer désigne couramment l’ouest; « côté ouest » convient au contexte d’arpentage.
- source_word: מָדַד
  choice: mesura
  rationale: Traduction directe et naturelle du verbe dans un contexte de relevé de dimensions.
- source_word: חֲמֵשׁ מֵאוֹת קָנִים
  choice: cinq cents roseaux
  rationale: Le texte massorétique porte bien « roseaux », unité fondée sur l’instrument de mesure, plutôt que « coudées ».
- source_word: בִּקְנֵה הַמִּדָּה
  choice: avec le roseau à mesurer
  rationale: La préposition est instrumentale et désigne l’outil étalon employé pour prendre la mesure.
