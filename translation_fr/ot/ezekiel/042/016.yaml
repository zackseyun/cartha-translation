  yaml_path: translation/ot/ezekiel/042/016.yaml
  text: 'He measured the east side with the measuring reed: five hundred reeds by the measuring reed[a], all around.'
translation:
  language: fr
  text: 'Il mesura le côté est avec la canne à mesurer : cinq cents cannes[a], selon la canne à mesurer, tout autour.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte littéralement « cinq coudées, cannes ». D’après le contexte, on comprend généralement « cinq cents cannes », conformément aux mesures des versets 16 à 19. Certains manuscrits et certaines versions anciennes l’indiquent plus explicitement.
    reason: textual_variant
lexical_decisions:
- source_word: מָדַד
  choice: Il mesura
  rationale: Le qal accompli, 3e personne du masculin singulier, poursuit naturellement le récit des mesures.
- source_word: רוּחַ הַקָּדִים
  choice: le côté est
  rationale: Dans ce contexte architectural, רוּחַ suivi d’une direction désigne le côté ou l’orientation, et non le vent.
- source_word: בִּקְנֵה הַמִּדָּה
  choice: avec la canne à mesurer / d’après la canne à mesurer
  rationale: La première occurrence exprime l’instrument employé; la seconde rappelle l’unité étalon. Cette légère variation rend en français les deux emplois de la même formule hébraïque sans effacer sa répétition.
- source_word: חֲמֵשׁ אמות קָנִים
  choice: cinq cents cannes
  rationale: Le texte massorétique est difficile et comporte littéralement « cinq coudées, cannes ». Le contexte immédiat, la formule répétée aux versets 16–19 et certains témoins anciens appuient la lecture contextuelle « cinq cents cannes ».
- source_word: סָבִיב
  choice: tout autour
  rationale: Cette expression française courante rend l’idée d’une mesure effectuée sur le pourtour.
