source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֗/י לִֽשְׁכ֨וֹת הַ/צָּפ֜וֹן לִֽשְׁכ֣וֹת הַ/דָּרוֹם֮ אֲשֶׁ֣ר אֶל פְּנֵ֣י הַ/גִּזְרָה֒ הֵ֣נָּה לִֽשְׁכ֣וֹת הַ/קֹּ֗דֶשׁ אֲשֶׁ֨ר יֹאכְלוּ שָׁ֧ם הַ/כֹּהֲנִ֛ים אֲשֶׁר קְרוֹבִ֥ים לַֽ/יהוָ֖ה קָדְשֵׁ֣י הַ/קֳּדָשִׁ֑ים שָׁ֞ם יַנִּ֣יחוּ קָדְשֵׁ֣י הַ/קֳּדָשִׁ֗ים וְ/הַ/מִּנְחָה֙ וְ/הַ/חַטָּ֣את וְ/הָ/אָשָׁ֔ם כִּ֥י הַ/מָּק֖וֹם קָדֹֽשׁ־׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/013.yaml
  text: Then he said to me[a], “The north chambers, the south chambers, which are opposite the separate area—they are the holy chambers, where the priests who draw near to Yahweh shall eat the most holy things. There they shall place the most holy things, the grain offering, the sin offering, and the guilt offering[d][c][b], for the place is holy.”
translation:
  language: fr
  text: 'Puis il me dit : « Les salles du nord et les salles du sud, qui font face à la zone séparée[a], sont les salles saintes où les prêtres qui s’approchent de Yahweh mangeront les choses très saintes[b]. C’est là qu’ils déposeront les choses très saintes : l’offrande de céréales, le sacrifice pour le péché[c] et le sacrifice de culpabilité[d], car ce lieu est saint. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui se trouvent en face de la zone séparée ». L’expression hébraïque indique que ces salles sont situées face à la partie distincte ou réservée de l’ensemble du temple.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les saintetés des saintetés ». L’expression désigne ici les choses ou les offrandes ayant le plus haut degré de sainteté, et non la pièce appelée le Saint des saints.
    reason: lexical_alternative
  - marker: c
    text: Ou « le sacrifice de purification ».
    reason: alternative_reading
  - marker: d
    text: Ou « le sacrifice de réparation ».
    reason: alternative_reading
lexical_decisions:
- source_word: לִשְׁכוֹת
  choice: salles
  rationale: Dans la vision du temple, le terme désigne des pièces construites destinées au service sacerdotal. « Salles » est naturel en français moderne et convient mieux ici que « cellules ».
- source_word: הַצָּפוֹן / הַדָּרוֹם
  choice: les salles du nord et les salles du sud
  rationale: Cette formulation conserve les désignations directionnelles du texte hébreu tout en restant claire et naturelle.
- source_word: אֶל־פְּנֵי הַגִּזְרָה
  choice: qui font face à la zone séparée
  rationale: אֶל־פְּנֵי exprime ici l’orientation spatiale, tandis que הַגִּזְרָה désigne une partie distincte ou réservée de l’ensemble du temple. La traduction évite de préciser indûment qu’il s’agit d’une cour.
- source_word: לִשְׁכוֹת הַקֹּדֶשׁ
  choice: les salles saintes
  rationale: La formulation garde le vocabulaire de la sainteté, répété dans le verset, et indique que ces pièces sont consacrées.
- source_word: קְרוֹבִים לַיהוָה
  choice: qui s’approchent de Yahweh
  rationale: Le participe évoque l’accès des prêtres à Dieu dans le cadre de leur service cultuel, et non une simple proximité physique.
- source_word: יֹאכְלוּ שָׁם
  choice: mangeront
  rationale: L’imparfait hébreu a ici une valeur future dans les indications données au cours de la vision; le lieu est rendu naturellement dans la proposition relative française.
- source_word: קָדְשֵׁי הַקֳּדָשִׁים
  choice: les choses très saintes
  rationale: L’expression désigne les réalités ou offrandes appartenant au degré supérieur de sainteté, comme le montre l’énumération qui suit, et non la pièce appelée le Saint des saints.
- source_word: יַנִּיחוּ
  choice: ils déposeront
  rationale: Le hiphil de נוח signifie ici mettre ou laisser dans un endroit prévu. « Déposer » convient au contexte de conservation des offrandes dans ces salles.
- source_word: הַמִּנְחָה
  choice: l’offrande de céréales
  rationale: Dans ce contexte sacrificiel, מִנְחָה désigne l’offrande non animale préparée à partir de produits céréaliers. Cette formulation est précise et compréhensible.
- source_word: הַחַטָּאת
  choice: le sacrifice pour le péché
  rationale: Cette traduction usuelle identifie clairement la catégorie sacrificielle, tout en signalant en note l’autre analyse possible, « sacrifice de purification ».
- source_word: הָאָשָׁם
  choice: le sacrifice de culpabilité
  rationale: La formulation rend la catégorie sacrificielle traditionnelle associée à אָשָׁם; « sacrifice de réparation » est conservé en note comme autre traduction possible.
- source_word: כִּי הַמָּקוֹם קָדֹשׁ
  choice: car ce lieu est saint
  rationale: כִּי introduit la raison pour laquelle les offrandes doivent y être déposées. « Car » maintient nettement ce lien explicatif.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Sens de קָדְשֵׁי הַקֳּדָשִׁים
  choice: les choses très saintes
  alternative: les offrandes très saintes
  rationale: L’expression hébraïque reste d’abord générale, puis les catégories d’offrandes sont données en apposition. « Choses très saintes » préserve cette progression et évite toute confusion avec le Saint des saints.
- issue: Valeur cultuelle de חַטָּאת et אָשָׁם
  choice: sacrifice pour le péché et sacrifice de culpabilité
  alternative: sacrifice de purification et sacrifice de réparation
  rationale: Les choix principaux restent transparents et largement compréhensibles, tandis que les notes préservent les nuances fonctionnelles proposées pour ces sacrifices sans les imposer au texte principal.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe suit étroitement la structure hébraïque sans produire un calque lourd. Le vocabulaire cultuel est explicite, avec les autres analyses importantes conservées en notes.
