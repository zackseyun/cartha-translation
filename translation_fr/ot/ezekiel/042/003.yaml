  text: נֶ֣גֶד הָֽ/עֶשְׂרִ֗ים אֲשֶׁר֙ לֶ/חָצֵ֣ר הַ/פְּנִימִ֔י וְ/נֶ֣גֶד רִֽצְפָ֔ה אֲשֶׁ֖ר לֶ/חָצֵ֣ר הַ/חִֽיצוֹנָ֑ה אַתִּ֥יק אֶל פְּנֵֽי אַתִּ֖יק בַּ/שְּׁלִשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/003.yaml
  text: Opposite the twenty cubits that belonged to the inner court[a], and opposite the pavement that belonged to the outer court[b], gallery faced gallery in the third story.
translation:
  language: fr
  text: En face des vingt coudées qui appartenaient à la cour intérieure, et en face du dallage de la cour extérieure, galerie[a] face à galerie, sur trois niveaux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu est un terme architectural rare; il peut désigner une galerie, une colonnade, un portique ou une structure supérieure analogue.
    reason: lexical_alternative
  - marker: b
    text: Ou « au troisième niveau ». L’expression hébraïque renvoie probablement à une disposition sur trois niveaux, mais elle est aussi comprise comme désignant le troisième niveau.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגֶד
  choice: en face de
  rationale: Cette expression rend directement la relation spatiale indiquée par la préposition dans cette description architecturale.
- source_word: הָעֶשְׂרִים
  choice: les vingt coudées
  rationale: Le nom de l’unité n’est pas répété dans cette expression, mais le contexte de mesures architecturales permet de suppléer « coudées » pour rendre le texte intelligible.
- source_word: לֶחָצֵר הַפְּנִימִי
  choice: qui appartenaient à la cour intérieure
  rationale: Le lamed exprime ici vraisemblablement un rapport d’appartenance ou d’association entre l’espace de vingt coudées et la cour intérieure.
- source_word: רִצְפָה
  choice: le dallage
  rationale: Le terme désigne une surface pavée; « dallage » est concret et naturel dans un contexte architectural.
- source_word: לֶחָצֵר הַחִיצוֹנָה
  choice: de la cour extérieure
  rationale: Le complément exprime l’association du dallage avec la cour extérieure; la tournure française concise conserve ce rapport.
- source_word: אַתִּיק
  choice: galerie
  rationale: Ce terme architectural rare désigne probablement une structure longitudinale en hauteur. « Galerie » convient au contexte, sans prétendre déterminer avec certitude la forme exacte de l’élément.
- source_word: אֶל פְּנֵי
  choice: faisait face à
  rationale: Cette formulation idiomatique exprime la disposition réciproque des deux éléments architecturaux.
- source_word: בַּשְּׁלִשִׁים
  choice: au troisième niveau
  rationale: Dans ce contexte, l’expression renvoie vraisemblablement au troisième niveau du bâtiment. « Niveau » reste plus général et architectural que « étage ».
