  text: וּ/כְ/פִתְחֵ֣י הַ/לְּשָׁכ֗וֹת אֲשֶׁר֙ דֶּ֣רֶךְ הַ/דָּר֔וֹם פֶּ֖תַח בְּ/רֹ֣אשׁ דָּ֑רֶךְ דֶּ֗רֶךְ בִּ/פְנֵי֙ הַ/גְּדֶ֣רֶת הֲגִינָ֔ה דֶּ֥רֶךְ הַ/קָּדִ֖ים בְּ/בוֹאָֽ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/012.yaml
  text: And corresponding to the doorways of the chambers that were toward the south[a], there was a doorway at the head of the way, the way in front of the protective wall, toward the east[b], as one enters them.
translation:
  language: fr
  text: Et, comme pour les entrées des salles situées du côté sud, il y avait une entrée au début du passage[a], le passage devant le mur protecteur[b], en direction de l’est, lorsqu’on y entre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu répète plusieurs fois le mot traduit par « passage »; la configuration architecturale exacte demeure incertaine.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « protecteur » est rare; il peut désigner un mur de clôture, de protection ou formant écran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְפִתְחֵי
  choice: Et, comme pour les entrées de
  rationale: La conjonction וּ et le כ comparatif expriment une correspondance avec la disposition décrite précédemment. « Comme pour » est naturel en français tout en conservant cette comparaison.
- source_word: הַלְּשָׁכוֹת
  choice: les salles
  rationale: Dans le contexte architectural du temple, לְשָׁכוֹת désigne des pièces annexes. « Salles » est clair et actuel, sans suggérer de petites cellules fermées.
- source_word: אֲשֶׁר דֶּרֶךְ הַדָּרוֹם
  choice: situées du côté sud
  rationale: La formule indique l’emplacement ou l’orientation générale des salles. Cette traduction évite de préciser indûment qu’elles faisaient nécessairement face au sud.
- source_word: פֶּתַח
  choice: une entrée
  rationale: פֶּתַח désigne une ouverture donnant accès à un lieu, sans impliquer nécessairement un battant de porte.
- source_word: בְּרֹאשׁ דָּרֶךְ
  choice: au début du passage
  rationale: רֹאשׁ signifie ici la tête ou le commencement d’un trajet. « Au début du passage » rend naturellement l’expression architecturale en français.
- source_word: דֶּרֶךְ
  choice: le passage
  rationale: Dans cette description d’un bâtiment, דֶּרֶךְ semble désigner une voie d’accès ou un passage. La répétition de « passage » conserve la répétition marquée de l’hébreu.
- source_word: בִּפְנֵי הַגְּדֶרֶת
  choice: devant le mur
  rationale: בִּפְנֵי signifie « devant » et גְּדֶרֶת désigne une clôture, une enceinte ou un mur. « Mur » convient au contexte architectural.
- source_word: הֲגִינָה
  choice: protecteur
  rationale: Ce terme rare paraît qualifier la fonction du mur comme protection ou écran. « Protecteur » reste plausible tout en signalant l’incertitude dans une note.
- source_word: דֶּרֶךְ הַקָּדִים
  choice: en direction de l’est
  rationale: La formule indique une orientation vers l’est sans permettre de reconstruire avec certitude tous les rapports spatiaux.
- source_word: בְּבוֹאָן
  choice: quand on entrait dans ces salles
  rationale: L’infinitif de בוא avec suffixe féminin pluriel renvoie vraisemblablement aux salles. La tournure impersonnelle française restitue naturellement « lorsqu’on y entre » tout en explicitant l’antécédent.
