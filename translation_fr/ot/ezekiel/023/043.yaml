  text: וָ/אֹמַ֕ר לַ/בָּלָ֖ה נִֽאוּפִ֑ים עת יזנה תַזְנוּתֶ֖/הָ וָ/הִֽיא׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/043.yaml
  text: Then I said of her, worn out by adulteries, ‘Now they will commit her prostitution with her, and she herself as well.’
translation:
  language: fr
  text: 'Alors j’ai dit au sujet de celle qui était usée par les adultères : « Maintenant, ils se livreront à sa prostitution avec elle, et elle aussi. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu de la fin du verset est obscur. On peut aussi comprendre : « Va-t-on maintenant se prostituer avec elle ? Elle aussi… » Certains comprennent : « Maintenant encore, on se prostituera avec elle, et elle avec eux. »'
    reason: La syntaxe, le sujet verbal et le rapport de « et elle aussi » à ce qui précède sont incertains dans le texte massorétique.
lexical_decisions:
- source_word: לַבָּלָה נִאֻפִים
  choice: de celle qui était usée par les adultères
  rationale: Le participe בלה exprime l’usure ou l’épuisement, tandis que נִאֻפִים désigne des actes d’adultère. Cette formulation conserve l’image rude du texte sans ajouter explicitement l’idée de vieillesse.
- source_word: תַזְנוּתֶהָ
  choice: à sa prostitution
  rationale: Le nom renvoie à la prostitution ou à l’inconduite sexuelle de cette femme. Le possessif « sa » est maintenu, malgré la tournure inhabituelle, afin de préserver la formulation du texte hébreu.
theological_decisions:
- issue: Sujet et portée de la dernière proposition, dans un texte hébreu difficile
  choice: « ils se livreront avec elle à sa prostitution, et elle aussi »
  alternative: « va-t-on maintenant se prostituer avec elle ? Elle aussi… » ou « maintenant encore, on se prostituera avec elle, et elle avec eux »
  rationale: Le texte transmis est syntaxiquement obscur et paraît possiblement altéré. La traduction suit la compréhension reflétée par la couche anglaise auditée tout en signalant l’incertitude, sans compléter silencieusement la proposition par « avec eux » ni transformer avec assurance l’énoncé en question.
translation_notes:
  register: Français moderne, digne et direct. La rudesse sexuelle et la syntaxe heurtée de l’original sont conservées autant que possible, avec une note pour rendre visible son ambiguïté textuelle.
