  text: וַ/יָּבֹ֨אוּ אֵלֶ֤י/הָ בְנֵֽי בָבֶל֙ לְ/מִשְׁכַּ֣ב דֹּדִ֔ים וַ/יְטַמְּא֥וּ אוֹתָ֖/הּ בְּ/תַזְנוּתָ֑/ם וַ/תִּ֨טְמָא בָ֔/ם וַ/תֵּ֥קַע נַפְשָׁ֖/הּ מֵ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/017.yaml
  text: Then the sons of Babylon came to her[a], to the bed of love, and they defiled her with their prostitution; and she was defiled by them[c][b], and her soul was alienated from them.
translation:
  language: fr
  text: Alors les fils de Babylone vinrent auprès d’elle[a], pour une couche d’amour[b]. Ils la souillèrent par leur prostitution ; elle fut souillée par eux, puis elle les prit en dégoût[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les Babyloniens » ou « les hommes de Babylone ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pour un lit d’amour » ou « pour une couche de relations amoureuses ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « elle les eut en horreur » ou « son âme s’éloigna d’eux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי בָבֶל
  choice: les fils de Babylone
  rationale: Reproduit l’expression hébraïque tout en restant compréhensible ; dans le contexte, elle désigne les Babyloniens, probablement envisagés comme les hommes de Babylone.
- source_word: לְמִשְׁכַּב דֹּדִים
  choice: sur la couche des amours
  rationale: Conserve les deux éléments de l’expression, la couche et les relations amoureuses, avec un français digne qui maintient sa portée érotique sans la sur-expliciter.
- source_word: וַיְטַמְּאוּ אוֹתָהּ
  choice: ils la rendirent impure
  rationale: Exprime directement le factitif du verbe טמא et conserve sa résonance à la fois morale et cultuelle.
- source_word: בְּתַזְנוּתָם
  choice: par leur prostitution
  rationale: Préserve l’image sexuelle explicite de זְנוּת, qui porte aussi dans l’allégorie la dénonciation d’une infidélité politique et religieuse.
- source_word: וַתִּטְמָא בָם
  choice: elle fut rendue impure par eux
  rationale: Rend le résultat passif et la valeur d’agent ou d’instrument de la préposition ב, tout en maintenant la répétition rhétorique du texte hébreu.
- source_word: וַתֵּקַע נַפְשָׁהּ מֵהֶם
  choice: elle les prit en dégoût
  rationale: Rend naturellement en français l’idiome qui décrit un mouvement de répulsion et d’éloignement intérieur, sans imposer le calque peu idiomatique « son âme s’éloigna d’eux ».
theological_decisions:
- issue: Imagerie sexuelle et impureté dans l’allégorie prophétique
  choice: Maintenir explicitement la couche des amours, la prostitution et l’impureté.
  alternative: Réduire le passage à la description d’alliances politiques avec Babylone.
  rationale: Le texte hébreu présente volontairement les compromissions politiques et religieuses sous la forme d’une relation sexuelle infidèle ; neutraliser cette image ferait disparaître une dimension essentielle de la rhétorique prophétique.
- issue: Sens du rejet final
  choice: Traduire par « elle les prit en dégoût », qui exprime la répulsion et l’éloignement.
  alternative: « son âme se détacha d’eux » ou « elle s’éloigna d’eux »
  rationale: L’idiome hébreu associe l’être intérieur à une vive répulsion. La traduction retenue conserve ce mouvement affectif sans résoudre le texte en une simple rupture relationnelle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le passé simple convient au registre narratif biblique. La répétition autour de l’impureté est conservée comme effet rhétorique du texte source. Tous les marqueurs de notes figurent dans le texte.
