base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/042.yaml
  text: And the sound of a carefree multitude was in her[a], and to the men from the mass of mankind were brought drunkards from the wilderness[c][b]; and they put bracelets on their hands and a beautiful crown on their heads.
translation:
  language: fr
  text: Le bruit d’une foule insouciante se faisait entendre chez elle[a]. Et des ivrognes étaient amenés du désert à des hommes issus de la masse des gens[b]. Ils leur mirent des bracelets aux poignets et une couronne magnifique sur la tête[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le bruit d’une foule à l’aise » ou « le bruit d’une foule complaisante ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le milieu du verset est difficile en hébreu. On peut aussi comprendre : « et, auprès des hommes de la masse des gens, des ivrognes étaient amenés du désert ». Une lecture transmise dans la tradition textuelle comprend le mot rendu par « ivrognes » comme « des Sabéens », nom de peuple.'
    reason: alternative_reading
  - marker: c
    text: 'Littéralement : « une couronne de beauté » ou « une couronne de splendeur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹל הָמוֹן֮ שָׁלֵ֣ו
  choice: le bruit d’une foule insouciante
  rationale: « Bruit » rend la dimension audible de קוֹל sans la limiter à une voix, הָמוֹן désigne ici une foule nombreuse et animée, et « insouciante » exprime l’aisance possiblement complaisante de שָׁלֵו dans ce contexte.
- source_word: בָהּ
  choice: chez elle
  rationale: La préposition et le pronom féminin renvoient à la femme personnifiée. « Chez elle » est plus naturel en français que le calque « en elle » pour une scène où une foule est présente.
- source_word: אֲנָשִׁים
  choice: des hommes
  rationale: Le nom est masculin pluriel et le contexte présente des partenaires masculins; la précision de genre est donc conservée.
- source_word: מֵרֹב אָדָם
  choice: venus d’une multitude de gens
  rationale: La formulation hébraïque est condensée et difficile. Cette traduction garde l’idée d’une vaste masse humaine sans employer le français peu naturel « multitude d’humanité ».
- source_word: מוּבָאִים סובאים מִמִּדְבָּר
  choice: on avait fait venir du désert des ivrognes
  rationale: Le passif de בוא est rendu par une tournure impersonnelle naturelle. « Ivrognes » suit la compréhension de סובאים comme des buveurs, tandis que l’autre lecture traditionnelle est signalée en note.
- source_word: צְמִידִים אֶל יְדֵיהֶן
  choice: des bracelets aux poignets de ces femmes
  rationale: « Bracelets » est l’équivalent moderne clair de צְמִידִים. Le français place normalement ces bijoux aux poignets; l’explicitation « de ces femmes » rend sans ambiguïté le suffixe féminin pluriel.
- source_word: עֲטֶרֶת תִּפְאֶרֶת
  choice: une couronne magnifique
  rationale: Cette expression signifie littéralement « une couronne de beauté/de splendeur ». « Une couronne magnifique » en restitue naturellement la valeur qualitative.
