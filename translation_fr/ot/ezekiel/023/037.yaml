source:
  edition: WLC
  text: כִּ֣י נִאֵ֗פוּ וְ/דָם֙ בִּֽ/ידֵי/הֶ֔ן וְ/אֶת גִּלּֽוּלֵי/הֶ֖ן נִאֵ֑פוּ וְ/גַ֤ם אֶת בְּנֵי/הֶן֙ אֲשֶׁ֣ר יָֽלְדוּ לִ֔/י הֶעֱבִ֥ירוּ לָ/הֶ֖ם לְ/אָכְלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/037.yaml
  text: For they have committed adultery[a], and blood is on their hands; they have committed adultery with their idols, and they even made their sons, whom they bore to me[b], pass through the fire to them as food.
translation:
  language: fr
  text: Car elles ont commis l’adultère et elles ont du sang sur les mains. Elles ont commis l’adultère avec leurs idoles[a] ; elles ont même fait passer par le feu leurs fils, qu’elles avaient mis au monde pour moi, pour servir de nourriture à ces idoles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu employé par Ézéchiel pour « idoles » est fortement méprisant et évoque quelque chose de répugnant.
    reason: lexical_nuance
  - marker: b
    text: L’hébreu dit littéralement « elles les ont fait passer ». Dans ce contexte, l’expression renvoie au sacrifice d’enfants et est traditionnellement comprise comme un passage par le feu.
    reason: cultural_note
lexical_decisions:
- source_word: נִאֵפוּ
  choice: ont commis l’adultère
  rationale: Le verbe désigne proprement l’adultère et porte ici aussi la métaphore prophétique de l’infidélité envers Dieu. La répétition du verbe hébreu est conservée.
- source_word: דָם בִּידֵיהֶן
  choice: elles ont du sang sur les mains
  rationale: Cette expression française naturelle rend l’image hébraïque et la culpabilité liée au sang versé.
- source_word: גִּלּוּלֵיהֶן
  choice: leurs idoles
  rationale: « Idoles » exprime clairement le référent. La nuance fortement méprisante du terme propre à Ézéchiel est signalée en note sans alourdir le texte.
- source_word: וְאֶת גִּלּוּלֵיהֶן נִאֵפוּ
  choice: Elles ont commis l’adultère avec leurs idoles
  rationale: La formulation maintient l’image relationnelle de l’adultère spirituel et le parallélisme accusateur du verset.
- source_word: בְּנֵיהֶן אֲשֶׁר יָלְדוּ לִי
  choice: leurs fils, qu’elles avaient mis au monde pour moi
  rationale: « Fils » respecte le terme masculin du texte, tandis que « pour moi » conserve la revendication divine exprimée par לִי sans l’expliquer doctrinalement.
- source_word: הֶעֱבִירוּ
  choice: elles les ont fait passer par le feu
  rationale: Le texte dit littéralement « faire passer » ; dans ce contexte cultuel de sang versé et d’idolâtrie, l’expression désigne le sacrifice d’enfants. « Par le feu » explicite l’idiome établi, avec une note indiquant la forme littérale.
- source_word: לָהֶם לְאָכְלָה
  choice: pour les offrir en nourriture à ces idoles
  rationale: La formulation rend à la fois le destinataire pluriel, qui renvoie aux idoles, et l’image terrible de la nourriture sacrificielle. La répétition de « ces idoles » évite une ambiguïté de pronoms en français.
theological_decisions:
- issue: Faut-il expliciter le sacrifice d’enfants par le feu ?
  choice: les ont fait passer par le feu pour les offrir en nourriture à ces idoles
  alternative: les ont fait passer jusqu’à elles pour servir de nourriture
  rationale: Le contexte de culpabilité sanglante et d’idolâtrie confirme la valeur sacrificielle de l’idiome. L’ajout « par le feu » rend son sens cultuel intelligible, tandis que la note préserve la formulation plus elliptique de l’hébreu.
- issue: Portée de l’expression « mis au monde pour moi »
  choice: conserver la revendication divine sans l’expliciter
  alternative: leurs fils, qui m’appartenaient
  rationale: Le datif לִי peut évoquer l’appartenance ou la relation d’alliance, mais la traduction littéraire « pour moi » laisse subsister cette densité théologique sans imposer une seule interprétation.
translation_notes:
  register: Français international moderne, digne et direct. La répétition rhétorique de « commis l’adultère » est maintenue, de même que la violence des images de culpabilité sanglante et de nourriture sacrificielle.
