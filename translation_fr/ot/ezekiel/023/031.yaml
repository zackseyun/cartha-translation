  text: בְּ/דֶ֥רֶךְ אֲחוֹתֵ֖/ךְ הָלָ֑כְתְּ וְ/נָתַתִּ֥י כוֹסָ֖/הּ בְּ/יָדֵֽ/ךְ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/031.yaml
  text: You have walked in the way of your sister[a], so I will put her cup into your hand.
translation:
  language: fr
  text: Tu as suivi le chemin de ta sœur ; je mettrai donc sa coupe dans ta main.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire la coupe attribuée à ta sœur, image du jugement.
    reason: cultural_note
lexical_decisions:
- source_word: בְּדֶרֶךְ
  choice: suivi le chemin
  rationale: דֶּרֶךְ désigne ici, de manière figurée, la conduite adoptée. « Suivre le chemin » rend naturellement en français l’idée de marcher dans la même voie.
- source_word: אֲחוֹתֵךְ
  choice: ta sœur
  rationale: Le terme de parenté est conservé, conformément à l’allégorie des deux sœurs développée dans le chapitre.
- source_word: הָלָכְתְּ
  choice: tu as suivi
  rationale: Le verbe הלך signifie littéralement « marcher, aller ». Avec « chemin », « suivre » exprime en français courant l’idée idiomatique d’adopter la même conduite, sans effacer l’image.
- source_word: וְנָתַתִּי
  choice: je mettrai donc
  rationale: נתן peut signifier « donner, mettre, placer ». « Mettre entre les mains » est idiomatique, et « donc » exprime la conséquence portée ici par la coordination.
- source_word: כוֹסָהּ
  choice: sa coupe
  rationale: La métaphore hébraïque est maintenue sans ajouter dans le texte principal « jugement » ou « colère ».
- source_word: בְּיָדֵךְ
  choice: entre tes mains
  rationale: Littéralement « dans ta main ». L’expression française « mettre entre les mains » rend naturellement la remise de la coupe à la destinataire.
theological_decisions:
- issue: Métaphore de la coupe du jugement
  choice: Conserver « sa coupe » dans le texte principal.
  alternative: « la coupe de son jugement » ou « la coupe de son châtiment »
  rationale: Le contexte présente la coupe comme la part de jugement subie par la sœur, mais l’hébreu dit simplement « sa coupe ». La métaphore prophétique et sa tension sont donc préservées.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement féminin singulier correspond aux formes hébraïques adressées à la ville personnifiée. Le point-virgule met en relief le rapport entre conduite et conséquence.
