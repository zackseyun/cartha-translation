id: EZK.23.46
reference: Ezekiel 23:46
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֛י כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הַעֲלֵ֤ה עֲלֵי/הֶם֙ קָהָ֔ל וְ/נָתֹ֥ן אֶתְ/הֶ֖ן לְ/זַעֲוָ֥ה וְ/לָ/בַֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/046.yaml
  text: 'For thus says the Lord GOD: Bring up an assembly against them[a], and give them over to terror and plunder.'
translation:
  language: fr
  text: 'Car ainsi parle le Seigneur Yahweh : « Fais venir contre elles[a] une assemblée et livre-les à la terreur[b] et au pillage. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit d’abord littéralement « contre eux » au masculin, puis reprend les deux femmes au féminin avec « livre-les ».
    reason: Le changement de genre grammatical présent dans l’hébreu ne peut être reproduit naturellement dans le texte français.
  - marker: b
    text: 'Ou : « à l’horreur », voire « pour devenir un objet d’horreur ».'
    reason: Le nom hébreu זַעֲוָה peut désigner la terreur éprouvée ou l’horreur suscitée.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Le titre composé est rendu en distinguant אֲדֹנָי (« le Seigneur ») du nom divin יהוה (« Yahweh »), sans produire l’expression redondante « le Seigneur SEIGNEUR ».
- source_word: הַעֲלֵה
  choice: Fais venir
  rationale: L’impératif hiphil commande de faire monter ou venir un groupe hostile. « Fais venir » exprime naturellement cette convocation en français.
- source_word: קָהָל
  choice: une assemblée
  rationale: Le nom désigne un groupe rassemblé. « Assemblée » conserve sa portée générale sans ajouter explicitement une qualification militaire absente du terme lui-même.
- source_word: וְנָתֹן
  choice: et livre-les
  rationale: La forme poursuit la série d’ordres. Dans ce contexte judiciaire, « livrer à » rend idiomatiquement l’idée de placer les femmes sous la puissance de la terreur et du pillage.
- source_word: לְזַעֲוָה
  choice: à la terreur
  rationale: Le nom rare évoque la terreur ou l’horreur. « À la terreur » convient au contexte de dévastation tout en laissant une note signaler l’autre nuance possible.
- source_word: לָבַז
  choice: et au pillage
  rationale: בַּז désigne le butin ou le pillage. Avec la préposition לְ, « au pillage » exprime clairement le sort auquel elles sont livrées.
- source_word: עֲלֵיהֶם / אֶתְהֶן
  choice: contre elles… les
  rationale: Le français emploie le féminin selon les deux femmes personnifiées du contexte. Une note conserve toutefois le changement grammatical de l’hébreu, qui passe du masculin au féminin.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: « Yahweh » représente directement le nom divin יהוה, tandis que « Seigneur » rend אֲדֹנָי. Ce choix préserve les deux éléments distincts du titre hébreu.
- issue: Nature du jugement exprimé par לְזַעֲוָה
  choice: livrées à la terreur
  alternative: devenues un objet d’horreur
  rationale: La construction peut décrire soit l’expérience terrible à laquelle elles sont livrées, soit l’horreur qu’elles inspireront. Le texte principal retient la première possibilité sans exclure la seconde, donnée en note.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’image d’un groupe rassemblé contre les deux femmes personnifiées, tout en évitant de préciser qu’il s’agit d’une armée puisque קָהָל ne l’indique pas expressément.
