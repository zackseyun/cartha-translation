  text: אֶל בְּנֵי֩ אַשּׁ֨וּר עָגָ֜בָה פַּח֨וֹת וּ/סְגָנִ֤ים קְרֹבִים֙ לְבֻשֵׁ֣י מִכְל֔וֹל פָּרָשִׁ֖ים רֹכְבֵ֣י סוּסִ֑ים בַּח֥וּרֵי חֶ֖מֶד כֻּלָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/012.yaml
  text: She lusted after the sons of Assyria—governors and officials[a], clothed in full attire, horsemen riding horses, all of them desirable young men.
translation:
  language: fr
  text: 'Elle brûla de désir pour les fils de l’Assyrie : des gouverneurs et des hauts fonctionnaires proches[a], vêtus d’habits somptueux, des cavaliers montés sur des chevaux, tous de jeunes hommes séduisants.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « qui étaient à proximité ». Le sens précis de l’hébreu est incertain : le terme peut désigner des personnes proches, peut-être des membres de l’entourage immédiat, sans préciser davantage leur fonction ou leur relation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָגָבָה
  choice: brûla de désir pour
  rationale: Le verbe exprime ici un désir érotique intense dans la métaphore sexuelle du chapitre. Cette tournure française en conserve la force sans être archaïque.
- source_word: בְּנֵי אַשּׁוּר
  choice: les fils de l’Assyrie
  rationale: La traduction garde l’expression hébraïque littérale, qui désigne les Assyriens tout en mettant ici l’accent sur les hommes convoités.
- source_word: פַּחוֹת
  choice: gouverneurs
  rationale: Le terme désigne des dirigeants régionaux ou provinciaux. « Gouverneurs » est précis, actuel et n’impose pas une terminologie historique plus étroite.
- source_word: וּסְגָנִים
  choice: hauts fonctionnaires
  rationale: Ce titre administratif est associé à celui de gouverneur. « Hauts fonctionnaires » exprime clairement leur rang sans préciser indûment leur fonction exacte.
- source_word: קְרֹבִים
  choice: des hommes proches
  rationale: Le mot signifie fondamentalement « proches » ou « ceux qui sont à proximité ». La traduction conserve cette idée sans la transformer avec certitude en désignation militaire.
- source_word: לְבֻשֵׁי מִכְלֹל
  choice: vêtus d’habits somptueux
  rationale: L’expression évoque une tenue complète, magnifique ou splendide. Cette formulation rend naturellement en français l’apparat qui les rend impressionnants.
- source_word: פָּרָשִׁים
  choice: cavaliers
  rationale: Le nom désigne couramment des hommes montés, notamment des troupes à cheval.
- source_word: רֹכְבֵי סוּסִים
  choice: montés sur des chevaux
  rationale: La formulation conserve le renforcement quelque peu répétitif de l’hébreu après « cavaliers ».
- source_word: בַּחוּרֵי חֶמֶד
  choice: de jeunes hommes séduisants
  rationale: L’expression qualifie des jeunes hommes désirables ou attirants. « Séduisants » maintient l’évaluation érotique propre au contexte.
- source_word: כֻּלָּם
  choice: tous
  rationale: Ce mot récapitule l’ensemble du groupe avec insistance.
