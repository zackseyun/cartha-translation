  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִי֙ נֹֽתְנָ֔/ךְ בְּ/יַ֖ד אֲשֶׁ֣ר שָׂנֵ֑את בְּ/יַ֛ד אֲשֶׁר נָקְעָ֥ה נַפְשֵׁ֖/ךְ מֵ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/028.yaml
  text: 'For thus says the Lord GOD: Behold[a], I am giving you into the hand of those whom you hate, into the hand of those from whom your soul has turned away.'
translation:
  language: fr
  text: 'Car ainsi parle le Seigneur Yahweh : « Voici que je te livre aux mains de ceux que tu hais, aux mains de ceux dont ton âme s’est détachée[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux que ton âme a pris en aversion », ou « ceux dont ton âme s’est arrachée ». L’expression hébraïque est très vive et peut évoquer une profonde rupture, un éloignement ou de la répulsion.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Le titre composé unit אֲדֹנָי (« Seigneur ») au nom divin YHWH. « Yahweh » conserve ici le nom propre de l’alliance et évite la répétition artificielle « le Seigneur SEIGNEUR ».
- source_word: הִנְנִי
  choice: Voici que
  rationale: Cette formule introduit avec solennité une intervention divine imminente. « Voici que » convient au registre prophétique tout en restant naturel en français moderne.
- source_word: נֹתְנָךְ
  choice: je te livre
  rationale: Le participe précédé de הִנְנִי présente l’action comme imminente. Dans ce contexte judiciaire, « livrer » exprime naturellement la remise au pouvoir d’autrui sans ajouter un détail absent du texte.
- source_word: בְּיַד
  choice: aux mains de
  rationale: Cette expression garde l’image hébraïque de la main comme symbole de pouvoir ou de domination et constitue un idiome français courant.
- source_word: אֲשֶׁר שָׂנֵאת
  choice: ceux que tu détestes
  rationale: Le féminin singulier s’adresse à Oholiba, figure de Jérusalem. Le présent rend la force relationnelle actuelle de l’hostilité exprimée par le parfait hébreu dans ce contexte.
- source_word: נָקְעָה נַפְשֵׁךְ מֵהֶם
  choice: ceux dont ton âme s’est détachée
  rationale: La formulation conserve נֶפֶשׁ (« âme, être, désir ») et laisse subsister la vigueur ambiguë de נקע, qui peut évoquer l’éloignement, la rupture ou la répulsion.
theological_decisions:
- issue: Rendu du nom divin dans la formule אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte consonantique porte explicitement le Tétragramme. Employer « Yahweh » distingue le nom divin du titre אֲדֹנָי et préserve la référence au nom révélé, sans suivre silencieusement la substitution traditionnelle fondée sur la lecture qeré.
translation_notes:
  register: Français moderne, digne et prophétique. Le parallélisme « aux mains de… aux mains de… » et l’image de l’âme sont maintenus afin de préserver la structure et l’intensité de l’hébreu. Le féminin de « détachée » correspond à l’interpellation d’Oholiba/Jérusalem.
