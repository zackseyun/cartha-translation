base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/003.yaml
  text: They prostituted themselves in Egypt[a]; in their youth they committed prostitution there. There their breasts were fondled[c][b], and there their virgin bosoms were handled.
translation:
  language: fr
  text: Elles se prostituèrent en Égypte[a] ; dans leur jeunesse, elles s’y livrèrent à la prostitution. Là, leurs seins furent pressés[b] ; là, on palpa leurs seins de jeunes filles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Elles jouèrent les prostituées en Égypte. »'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie ici des images sexuelles explicites : littéralement, « là, leurs seins furent pressés, et là, on fit [quelque chose aux] seins de leur virginité ». Le second verbe est générique et difficile ; « on palpa » en rend le sens dans ce contexte.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּזְנֶינָה
  choice: elles se prostituèrent
  rationale: Le verbe זנה exprime ici une conduite sexuelle illicite, également porteuse de la métaphore prophétique de l’infidélité. La tournure pronominale est claire et directe en français moderne.
- source_word: בִּנְעוּרֵיהֶן זָנוּ
  choice: dès leur jeunesse, elles s’y livrèrent à la prostitution
  rationale: La seconde occurrence de זנה est conservée afin de respecter la répétition insistante de l’hébreu ; « dès leur jeunesse » rend naturellement la valeur temporelle.
- source_word: מֹעֲכוּ שְׁדֵיהֶן
  choice: on leur pressa les seins
  rationale: מעך désigne littéralement l’action de presser ou d’écraser. « Pressa » conserve davantage la rudesse et l’ambiguïté du geste que le plus doux « caressa ».
- source_word: עִשּׂוּ דַּדֵּי בְתוּלֵיהֶן
  choice: on palpa leur poitrine virginale
  rationale: L’expression hébraïque est graphique et difficile. « Palpa » traduit un maniement sexuel sans préciser davantage la nature du geste ; « poitrine virginale » conserve le lien avec la virginité ou l’état de jeune fille.
- source_word: שָׁמָּה / שָׁם
  choice: là … là
  rationale: La répétition locative de l’hébreu est maintenue pour son effet rhétorique.
theological_decisions:
- issue: Caractère explicite de la métaphore sexuelle prophétique
  choice: Conserver dans le texte principal les images corporelles explicites.
  alternative: Employer une formulation générale telle que « elles y furent déshonorées ».
  rationale: Le langage cru appartient à l’accusation prophétique contre l’infidélité de Samarie et de Jérusalem. L’atténuer ferait disparaître une part importante de sa force, sans que la traduction doive préciser si les gestes évoqués sont consentis ou imposés.
translation_notes:
  register: Français international moderne, digne mais volontairement explicite, conformément à la vigueur de l’hébreu. La répétition et la progression des deux propositions sont préservées sans archaïsmes.
