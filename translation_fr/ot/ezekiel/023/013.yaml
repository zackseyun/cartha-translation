  text: And I saw that she had become unclean[b][a]; both of them followed the same way.
translation:
  language: fr
  text: 'Alors je vis qu’elle était devenue impure[a] : elles avaient l’une et l’autre la même conduite[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elle avait été souillée ». Le verbe hébreu peut décrire un état d’impureté ou une souillure résultante, sans préciser explicitement l’agent de cette souillure.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « une seule voie pour elles deux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Alors je vis
  rationale: Le wayyiqtol de ראה poursuit la séquence narrative. « Alors je vis » rend naturellement en français la progression du récit et la perception à la première personne.
- source_word: כִּי
  choice: que
  rationale: כִּי introduit ici le contenu de ce que le prophète constate.
- source_word: נִטְמָאָה
  choice: elle s’était rendue impure
  rationale: Le nifal parfait de טמא peut décrire un état subi ou le résultat de la conduite du sujet. Cette formulation conserve l’idée d’impureté tout en exprimant, dans ce contexte, la responsabilité liée à ses actes.
- source_word: דֶּרֶךְ אֶחָד
  choice: la même voie
  rationale: L’expression signifie littéralement « une seule voie » partagée par les deux femmes. « La même voie » est idiomatique et maintient la métaphore de la conduite.
- source_word: לִשְׁתֵּיהֶן
  choice: toutes deux
  rationale: La formule indique que cette voie était commune aux deux sœurs; « toutes deux » le rend avec concision.
theological_decisions:
- issue: Nature de l’impureté dans l’allégorie d’Ohola et d’Oholiba
  choice: Exprimer une impureté résultant de sa propre conduite sans expliciter davantage sa portée morale, sexuelle ou cultuelle.
  alternative: « elle était devenue impure » ou « elle avait été souillée »
  rationale: Le chapitre associe l’infidélité sexuelle figurée, l’idolâtrie et l’infidélité politique. « S’était rendue impure » préserve cette tension sans réduire l’image à une seule interprétation.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple maintient le ton narratif biblique sans archaïsme marqué; le plus-que-parfait situe l’impureté comme déjà constatée. Les notes conservent l’ambiguïté du nifal et la forme littérale de la dernière proposition.
