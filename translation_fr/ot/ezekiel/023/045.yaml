source:
  edition: WLC
  text: וַ/אֲנָשִׁ֣ים צַדִּיקִ֗ם הֵ֚מָּה יִשְׁפְּט֣וּ אֽוֹתְ/הֶ֔ם מִשְׁפַּט֙ נֹֽאֲפ֔וֹת וּ/מִשְׁפַּ֖ט שֹׁפְכ֣וֹת דָּ֑ם כִּ֤י נֹֽאֲפֹת֙ הֵ֔נָּה וְ/דָ֖ם בִּֽ/ידֵי/הֶֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/045.yaml
  text: But righteous men will judge them with the judgment of adulteresses and with the judgment of women who shed blood[a], because they are adulteresses[b], and blood is on their hands.
translation:
  language: fr
  text: Mais des hommes justes les jugeront comme on juge les femmes adultères et celles qui versent le sang[a], car elles sont adultères et ont du sang sur les mains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon le jugement des femmes adultères et selon le jugement de celles qui versent le sang ».'
    reason: Le construit hébreu peut exprimer le jugement caractéristique de ces femmes ou le jugement qui leur est appliqué ; la traduction française explicite naturellement ce rapport judiciaire.
  - marker: b
    text: 'Littéralement : « le sang est dans leurs mains ».'
    reason: L’expression française « avoir du sang sur les mains » rend naturellement la métaphore de la culpabilité pour le sang versé.
lexical_decisions:
- source_word: וַ/אֲנָשִׁים צַדִּיקִם הֵמָּה
  choice: Mais des hommes justes, eux
  rationale: « Hommes » respecte le masculin explicite אֲנָשִׁים et l’image d’agents judiciaires humains. « Justes » conserve la portée morale et judiciaire de צַדִּיקִם. Le pronom disjoint הֵמָּה est rendu par « eux » pour préserver son emphase, tandis que « mais » marque naturellement la transition contextuelle.
- source_word: יִשְׁפְּטוּ אוֹתְהֶם
  choice: les jugeront
  rationale: L’imparfait hébreu reçoit ici une valeur future dans l’annonce prophétique. Le pronom objet renvoie collectivement aux deux femmes/villes.
- source_word: מִשְׁפַּט נֹאֲפוֹת וּמִשְׁפַּט שֹׁפְכוֹת דָּם
  choice: selon le jugement réservé aux femmes adultères et à celles qui versent le sang
  rationale: Cette formulation française exprime clairement la norme judiciaire applicable aux deux catégories tout en conservant le parallélisme et le féminin pluriel des participes hébreux.
- source_word: כִּי נֹאֲפֹת הֵנָּה
  choice: car elles sont adultères
  rationale: כִּי introduit la justification du jugement. « Adultères » conserve la qualification juridique et morale sans ajouter d’interprétation.
- source_word: וְדָם בִּידֵיהֶן
  choice: et elles ont du sang sur les mains
  rationale: Littéralement, le sang est « dans leurs mains ». L’expression française « avoir du sang sur les mains » restitue naturellement la métaphore de la culpabilité liée au sang versé.
theological_decisions:
- issue: Identité des agents du jugement
  choice: Conserver « des hommes justes » comme désignation des agents judiciaires dans l’image prophétique
  alternative: Y voir explicitement des agents célestes ou des représentants idéalisés du jugement divin
  rationale: Le texte hébreu dit simplement « des hommes justes ». La traduction maintient cette désignation humaine sans préciser une identité que le verset ne donne pas.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme judiciaire et le parallélisme sont préservés. « Femmes adultères » évite le substantif « adultères », potentiellement moins immédiat, et « celles qui versent le sang » garde explicite le féminin du texte.
