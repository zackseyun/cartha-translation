  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י בֶּן אָדָ֕ם הֲ/תִשְׁפּ֥וֹט אֶֽת אָהֳלָ֖ה וְ/אֶת אָהֳלִיבָ֑ה וְ/הַגֵּ֣ד לָ/הֶ֔ן אֵ֖ת תוֹעֲבוֹתֵי/הֶֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/036.yaml
  text: Then Yahweh said to me, “Son of man, will you judge Oholah and Oholibah? Then declare to them their abominations.”
translation:
  language: fr
  text: 'Alors Yahweh me dit : « Fils d’homme, jugeras-tu Ohola et Oholiba ? Fais-leur connaître leurs actes abominables. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le wayyiqtol fait progresser le récit ; « Alors » exprime naturellement cette succession en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve ici le nom divin personnel plutôt que de lui substituer un titre.
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Cette formule conserve l’expression hébraïque habituelle par laquelle Dieu s’adresse à Ézéchiel, dans un français biblique clair.
- source_word: הֲתִשְׁפּוֹט
  choice: jugeras-tu
  rationale: Le futur interrogatif rend directement la particule interrogative et l’imparfait hébreu, tout en maintenant la nuance d’appel à exercer le jugement.
- source_word: אָהֳלָה וְאֶת אָהֳלִיבָה
  choice: Ohola et Oholiba
  rationale: Les deux noms symboliques sont translittérés selon leur forme française usuelle.
- source_word: וְהַגֵּד לָהֶן
  choice: Fais-leur connaître
  rationale: L’impératif הַגֵּד signifie annoncer, déclarer ou faire connaître. Cette formulation française exprime clairement l’ordre adressé au prophète.
- source_word: תּוֹעֲבוֹתֵיהֶן
  choice: leurs actes abominables
  rationale: Le nom תּוֹעֵבָה désigne ce qui est moralement ou cultuellement détestable. « Actes abominables » est naturel en français et explicite qu’il s’agit ici de leurs conduites.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme ; sa translittération préserve le nom personnel sans le remplacer par un titre.
- issue: Valeur de la question הֲתִשְׁפּוֹט
  choice: jugeras-tu
  alternative: veux-tu juger
  rationale: La forme interrogative est maintenue plutôt que transformée directement en ordre, ce qui préserve la tension rhétorique du texte, même si le contexte implique une mission confiée au prophète.
translation_notes:
  register: Français moderne, international et digne. La syntaxe interrogative reste proche de l’hébreu ; « Fais-leur connaître leurs actes abominables » évite l’expression plus lourde « annonce-leur leurs abominations » tout en conservant la force de la dénonciation prophétique.
