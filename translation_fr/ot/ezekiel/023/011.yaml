base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/011.yaml
  text: When her sister Oholibah saw this[a], she became more corrupt in her lust than her sister, and in her prostitutions more than the prostitutions of her sister.
translation:
  language: fr
  text: Quand sa sœur Oholiba vit cela[a], elle se livra à des désirs charnels plus dépravés que ceux de sa sœur et à davantage d’actes de prostitution que sa sœur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quand sa sœur Oholiba vit cela, elle se corrompit davantage que sa sœur dans ses désirs charnels et dans ses actes de prostitution. »'
    reason: 'La syntaxe comparative hébraïque est condensée : le verbe peut être rattaché directement aux deux domaines, les désirs et les prostitutions.'
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: vit cela
  rationale: Le verbe signifie « voir »; « cela » explicite en français l’objet sous-entendu par le contexte.
- source_word: אֲחוֹתָהּ אָהֳלִיבָה
  choice: Sa sœur Oholiba
  rationale: Conserve le nom propre par translittération et l’apposition hébraïque dans un ordre naturel en français.
- source_word: וַתַּשְׁחֵת
  choice: elle se corrompit encore plus
  rationale: Dans ce contexte moral et sexuel, la forme verbale exprime une conduite corruptrice ou une dégradation; la tournure pronominale rend naturellement la comparaison.
- source_word: עַגְבָתָהּ
  choice: dans ses désirs passionnés
  rationale: Le nom désigne ici un désir ardent à caractère sexuel. Cette formulation reste claire et digne sans atténuer la force du passage.
- source_word: מִמֶּנָּה
  choice: encore plus qu’elle
  rationale: Le préfixe מִן marque la comparaison avec la sœur déjà mentionnée.
- source_word: וְאֶת תַּזְנוּתֶיהָ
  choice: et se livra à la prostitution
  rationale: La formulation française préserve l’image concrète de la prostitution tout en rendant naturellement la coordination hébraïque.
- source_word: מִזְּנוּנֵי אֲחוֹתָהּ
  choice: plus encore que sa sœur
  rationale: Le syntagme compare les actes de prostitution d’Oholiba à ceux de sa sœur; le français évite une répétition lourde tout en conservant ce sens.
theological_decisions:
- issue: Métaphore sexuelle de l’infidélité à l’alliance
  choice: Conserver le langage explicite du désir sexuel et de la prostitution.
  alternative: Employer des termes interprétatifs plus abstraits comme « infidélité » ou « idolâtrie ».
  rationale: L’hébreu déploie volontairement une image sexuelle forte pour dénoncer la trahison de Jérusalem. La conserver maintient la force rhétorique et la tension entre le sens concret de l’image et sa portée religieuse.
translation_notes:
  register: 'Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique. Le connecteur « Pourtant » rend la progression implicite : Oholiba voit l’exemple de sa sœur, mais va plus loin dans la corruption.'
