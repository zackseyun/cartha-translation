source:
  edition: WLC
  text: ע֥וֹד זֹ֖את עָ֣שׂוּ לִ֑/י טִמְּא֤וּ אֶת מִקְדָּשִׁ/י֙ בַּ/יּ֣וֹם הַ/ה֔וּא וְ/אֶת שַׁבְּתוֹתַ֖/י חִלֵּֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/038.yaml
  text: 'Moreover, they did this to me: they defiled my sanctuary on that same day, and they profaned my Sabbaths.'
translation:
  language: fr
  text: 'En outre, voici ce qu’elles m’ont fait : elles ont rendu mon sanctuaire impur ce jour-là et ont profané mes sabbats.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹד זֹאת
  choice: En outre, voici ce que
  rationale: La tournure ajoute une accusation à celles qui précèdent. « En outre » exprime cette valeur additive, tandis que « voici ce que » met naturellement l’acte en relief en français.
- source_word: עָשׂוּ לִי
  choice: elles m’ont fait
  rationale: Le complément לִי marque ici que l’offense atteint personnellement Dieu. « M’ont fait » conserve cette dimension sans expliciter excessivement par « contre moi ».
- source_word: טִמְּאוּ
  choice: ont rendu … impur
  rationale: Le piel de טמא signifie rendre impur. Cette formulation maintient précisément la dimension rituelle de l’acte dans le contexte du sanctuaire.
- source_word: מִקְדָּשִׁי
  choice: mon sanctuaire
  rationale: « Sanctuaire » préserve le sens d’espace saint sans restreindre inutilement le terme au seul bâtiment du Temple.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: C’est l’équivalent français direct et naturel de l’expression démonstrative. Le contexte relie déjà ce jour aux actes évoqués autour du verset.
- source_word: שַׁבְּתוֹתַי
  choice: mes sabbats
  rationale: Le pluriel de l’hébreu est conservé et désigne les temps sabbatiques appartenant à Dieu.
- source_word: חִלֵּלוּ
  choice: profané
  rationale: Le piel de חלל exprime la violation du caractère saint. « Profaner » est précis et convient au registre cultuel du passage.
theological_decisions:
- issue: Terminologie cultuelle concernant l’espace et les temps saints
  choice: Conserver « sanctuaire », « rendu impur » et « sabbats profanés »
  alternative: Employer des termes plus généraux comme « temple », « souillé » ou « déshonoré »
  rationale: 'Le texte articule deux atteintes distinctes à la sainteté : l’impureté imposée au sanctuaire et la profanation des sabbats. Une terminologie cultuelle nette préserve cette tension théologique.'
translation_notes:
  register: Français international moderne, naturel et digne. Le féminin pluriel « elles » reprend les deux femmes personnifiées du contexte. La coordination évite de répéter le sujet tout en conservant la vigueur de l’accusation.
