reference: Ezekiel 23:48
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִשְׁבַּתִּ֥י זִמָּ֖ה מִן הָ/אָ֑רֶץ וְ/נִֽוַּסְּרוּ֙ כָּל הַ/נָּשִׁ֔ים וְ/לֹ֥א תַעֲשֶׂ֖ינָה כְּ/זִמַּתְ/כֶֽנָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/048.yaml
  text: Thus I will put an end to lewdness in the land[a], and all women will be warned and will not act according to your lewdness.
translation:
  language: fr
  text: Ainsi, je mettrai fin à l’inconduite dans le pays, et toutes les femmes en tireront une leçon[a] et ne se livreront pas à une inconduite semblable à la vôtre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « seront averties », « seront corrigées » ou « seront châtiées ». Le verbe hébreu peut désigner l’instruction ou l’avertissement reçus par l’exemple, mais aussi la correction infligée au moyen d’un châtiment.
    reason: Alternative lexicale préservant l’éventail sémantique du pual de יסר.
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: je mettrai fin
  rationale: Le hiphil de שׁבת exprime l’action de faire cesser. « Mettre fin à » rend naturellement cette valeur causative en français moderne.
- source_word: זִמָּה
  choice: inconduite
  rationale: Dans Ézéchiel 23, le mot désigne une conduite sexuellement honteuse et moralement condamnable. « Inconduite » garde cette portée sans devenir inutilement explicite; sa répétition reproduit celle de l’hébreu.
- source_word: מִן הָאָרֶץ
  choice: dans le pays
  rationale: Littéralement « hors du pays » après un verbe signifiant faire cesser; la formulation française « mettre fin à… dans le pays » exprime naturellement le domaine d’où cette conduite sera éliminée.
- source_word: וְנִוַּסְּרוּ
  choice: en tireront une leçon
  rationale: Le pual de יסר peut évoquer l’instruction, l’avertissement ou la correction par le châtiment. Dans ce contexte exemplaire, cette expression préserve la portée pédagogique sans imposer que toutes les femmes subissent elles-mêmes une punition.
- source_word: כָּל הַנָּשִׁים
  choice: toutes les femmes
  rationale: La formulation respecte le féminin pluriel explicite sans élargir ni restreindre son référent.
- source_word: וְלֹא תַעֲשֶׂינָה כְּזִמַּתְכֶנָה
  choice: et ne se livreront pas à une inconduite semblable à la vôtre
  rationale: Cette tournure française rend l’idée comparative de כ et le comportement exprimé par עשה, tout en conservant la reprise de זִמָּה et l’adresse féminine plurielle.
theological_decisions:
- issue: Référent et fonction de « toutes les femmes » dans un oracle de jugement utilisant une imagerie féminine
  choice: Conserver « toutes les femmes » sans explicitation supplémentaire.
  alternative: « toutes les femmes du pays » ou « tous ceux que représentent ces femmes »
  rationale: L’hébreu dit explicitement « toutes les femmes ». Le chapitre présente Samarie et Jérusalem sous les traits de femmes servant d’exemple; la traduction conserve cette rhétorique et son ampleur indéterminée.
- issue: Nature de l’effet exprimé par וְנִוַּסְּרוּ
  choice: « en tireront une leçon »
  alternative: « seront averties », « seront corrigées » ou « seront châtiées »
  rationale: Le contexte permet à la fois l’avertissement par l’exemple et la correction punitive. Le texte principal privilégie l’effet exemplaire, tandis que la note maintient les autres nuances possibles.
translation_notes:
  register: Français international moderne, clair et digne. « Inconduite » convient au registre prophétique tout en gardant la dimension sexuelle et morale du contexte. La syntaxe reste fluide, et l’adresse féminine plurielle est explicitement conservée par « la vôtre ».
