source:
  edition: WLC
  text: וְ/יָשַׁבְתְּ֙ עַל מִטָּ֣ה כְבוּדָּ֔ה וְ/שֻׁלְחָ֥ן עָר֖וּךְ לְ/פָנֶ֑י/הָ וּ/קְטָרְתִּ֥/י וְ/שַׁמְנִ֖/י שַׂ֥מְתְּ עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/041.yaml
  text: You sat on a splendid couch[a], with a table set before it, and on it you placed my incense and my oil.
translation:
  language: fr
  text: Tu t’es assise sur un divan somptueux, devant lequel une table était dressée[a] ; c’est sur cette table que tu as placé mon encens et mon huile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, les suffixes féminins rendus ici par « devant lequel » et « sur cette table » ont des référents qui ne sont pas explicités. Le premier peut, par exemple, se comprendre « devant toi » plutôt que « devant le divan » ; la relation du dernier suffixe à la table dépend alors de l’interprétation de la scène.
    reason: alternative_reading
lexical_decisions:
- source_word: יָשַׁבְתְּ
  choice: tu t’es assise
  rationale: Le qal accompli 2e personne féminin singulier de ישׁב décrit directement l’action de la femme interpellée.
- source_word: מִטָּה כְבוּדָּה
  choice: un divan somptueux
  rationale: מִטָּה peut désigner un lit ou un meuble sur lequel on s’allonge. « Divan » convient à la scène de luxe, tandis que « somptueux » rend ici la valeur imposante et opulente de כְבוּדָּה.
- source_word: שֻׁלְחָן עָרוּךְ
  choice: une table était dressée
  rationale: Le participe passif עָרוּךְ indique une table préparée ou disposée ; « table dressée » est naturel en français et conserve l’image du banquet.
- source_word: לְפָנֶיהָ
  choice: devant lequel
  rationale: Le suffixe féminin singulier est rapporté dans le texte principal à מִטָּה, rendu par le masculin français « divan » ; la note conserve l’autre référent grammaticalement possible.
- source_word: קְטָרְתִּי
  choice: mon encens
  rationale: Le suffixe de première personne est maintenu, car il souligne que l’encens appartenant à Dieu est détourné dans cette scène.
- source_word: שַׁמְנִי
  choice: mon huile
  rationale: Cette traduction concise respecte le nom générique שֶׁמֶן sans préciser indûment qu’il s’agit d’une huile d’onction.
- source_word: שַׂמְתְּ עָלֶיהָ
  choice: c’est sur cette table que tu as placé
  rationale: Le dernier suffixe féminin est rapporté à la table, support naturel de l’encens et de l’huile. La tournure explicite le référent en français sans changer l’action.
theological_decisions:
- issue: Référent des suffixes féminins dans לְפָנֶיהָ et עָלֶיהָ
  choice: Le premier est rapporté au divan et le second à la table.
  alternative: Le premier peut se rapporter à la femme (« devant toi/devant elle »), et la chaîne des référents peut être comprise autrement.
  rationale: 'Cette lecture produit une scène spatiale cohérente : la table est dressée devant le divan, puis l’encens et l’huile sont posés sur la table. Comme les suffixes hébreux demeurent ambigus, l’autre possibilité est signalée en note plutôt qu’écartée.'
translation_notes:
  register: Français international moderne, digne et accessible. « Divan somptueux » restitue le cadre luxueux sans donner à מִטָּה le sens trop exclusivement nocturne de « lit ». La reprise « cette table » clarifie naturellement le référent du dernier suffixe.
