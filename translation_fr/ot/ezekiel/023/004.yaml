source:
  edition: WLC
  text: וּ/שְׁמוֹתָ֗/ן אָהֳלָ֤ה הַ/גְּדוֹלָה֙ וְ/אָהֳלִיבָ֣ה אֲחוֹתָ֔/הּ וַ/תִּֽהְיֶ֣ינָה לִ֔/י וַ/תֵּלַ֖דְנָה בָּנִ֣ים וּ/בָנ֑וֹת וּ/שְׁמוֹתָ֕/ן שֹׁמְר֣וֹן אָהֳלָ֔ה וִ/ירוּשָׁלִַ֖ם אָהֳלִיבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/004.yaml
  text: 'Their names were Oholah the elder and Oholibah her sister[a]. They became mine and bore sons and daughters. As for their names: Samaria is Oholah[b], and Jerusalem is Oholibah.'
translation:
  language: fr
  text: 'Elles s’appelaient Ohola, l’aînée, et Oholiba, sa sœur[a]. Elles devinrent miennes[b] et mirent au monde des fils et des filles. Quant à leurs noms : Samarie est Ohola, et Jérusalem est Oholiba.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les noms Ohola et Oholiba font probablement écho à des expressions hébraïques signifiant respectivement « sa tente » et « ma tente est en elle », ce qui renforce l’allégorie.
    reason: cultural_note
  - marker: b
    text: Ou « Elles furent à moi ». L’hébreu exprime une appartenance ou une relation; dans l’ensemble de l’allégorie, cette relation est présentée sous une image conjugale.
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמוֹתָן
  choice: Elles s’appelaient
  rationale: Cette formulation française naturelle rend l’introduction des noms sans reproduire lourdement la tournure nominale hébraïque « leurs noms étaient ».
- source_word: אָהֳלָה
  choice: Ohola
  rationale: Translittération française traditionnelle et reconnaissable du nom propre; le jeu de mots hébreu est signalé en note plutôt que traduit dans le texte.
- source_word: הַגְּדוֹלָה
  choice: l’aînée
  rationale: Dans le contexte de deux sœurs, l’adjectif indique leur rang d’âge plutôt que leur taille ou leur importance.
- source_word: וְאָהֳלִיבָה אֲחוֹתָהּ
  choice: et Oholiba, sa sœur
  rationale: Rend clairement le lien familial tout en suivant de près l’ordre hébreu.
- source_word: וַתִּהְיֶינָה לִי
  choice: Elles devinrent miennes
  rationale: Préserve l’idée d’entrée dans une relation d’appartenance sans ajouter explicitement « mes femmes », expression que l’hébreu n’emploie pas ici.
- source_word: וַתֵּלַדְנָה
  choice: mirent au monde
  rationale: Expression française actuelle et digne qui conserve explicitement le sens maternel du verbe ילד.
- source_word: בָּנִים וּבָנוֹת
  choice: des fils et des filles
  rationale: Conserve la distinction explicite entre les enfants de sexe masculin et féminin.
- source_word: וּשְׁמוֹתָן
  choice: Quant à leurs noms
  rationale: Le second emploi est récapitulatif et introduit l’identification des femmes aux deux villes.
- source_word: שֹׁמְרוֹן אָהֳלָה
  choice: Samarie, c’est Ohola
  rationale: Le présentatif « c’est » explicite naturellement en français l’équation nominale dépourvue de copule en hébreu.
- source_word: וִירוּשָׁלִַם אָהֳלִיבָה
  choice: et Jérusalem, c’est Oholiba
  rationale: Adopte la même structure claire pour la seconde identification symbolique.
theological_decisions:
- issue: Portée de וַתִּהְיֶינָה לִי dans l’allégorie prophétique
  choice: « Elles devinrent miennes », exprimant une relation d’appartenance sans en préciser explicitement la nature matrimoniale
  alternative: « Elles devinrent mes femmes » ou « Elles furent à moi »
  rationale: L’ensemble de l’allégorie est conjugal, mais la proposition hébraïque dit littéralement qu’elles devinrent « à moi ». La traduction conserve cette tension et n’ajoute pas un terme matrimonial absent du verset.
translation_notes:
  register: Français international moderne, fluide et digne. Les noms propres suivent les formes françaises usuelles « Ohola » et « Oholiba ». Le texte conserve la concision et l’ambiguïté relationnelle de l’hébreu tout en rendant explicites les équations nominales par une tournure française naturelle.
