source:
  edition: WLC
  text: וְ/נָתְנ֤וּ זִמַּתְ/כֶ֨נָה֙ עֲלֵי/כֶ֔ן וַ/חֲטָאֵ֥י גִלּוּלֵי/כֶ֖ן תִּשֶּׂ֑אינָה וִ/ידַעְתֶּ֕ם כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/049.yaml
  text: They will put your lewdness upon you[a], and you will bear the sins of your idols; then you will know that I am the Lord YHWH.
translation:
  language: fr
  text: Ils feront retomber sur vous votre débauche, et vous porterez les péchés de vos idoles[a]. Alors vous saurez que je suis le Seigneur Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traduit par « idoles » est fortement méprisant ; il pourrait aussi être rendu par « idoles répugnantes » ou, plus littéralement, « idoles de fumier ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ ... עֲלֵיכֶן
  choice: Ils feront retomber sur vous
  rationale: Littéralement « ils mettront sur vous ». La tournure française « faire retomber sur » exprime naturellement l’imposition judiciaire des conséquences tout en conservant l’image d’une charge placée sur les destinataires.
- source_word: זִמַּתְכֶנָה
  choice: votre débauche
  rationale: Dans Ézéchiel 23, זִמָּה désigne une conduite sexuelle honteuse envisagée aussi comme faute morale. « Débauche » conserve ces deux dimensions sans développer l’image.
- source_word: וַחֲטָאֵי
  choice: et ... les péchés de
  rationale: חֲטָאִים signifie normalement « péchés ». La traduction garde le rapport de construit avec les idoles sans le réduire explicitement à la culpabilité ou au châtiment.
- source_word: גִלּוּלֵיכֶן
  choice: vos idoles
  rationale: « Idoles » est immédiatement compréhensible en français. Le mépris particulièrement fort porté par גִּלּוּלִים est signalé en note.
- source_word: תִּשֶּׂאינָה
  choice: vous porterez
  rationale: נשא avec « péchés » évoque le fait d’en porter la charge ou les conséquences. « Porterez » préserve cette image et sa portée judiciaire.
- source_word: וִידַעְתֶּם
  choice: Alors vous saurez
  rationale: Le waw introduit ici le résultat du jugement annoncé. « Alors » rend clairement cette progression en français.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur YHWH
  rationale: « Seigneur » traduit אֲדֹנָי, tandis que YHWH représente directement le nom divin יהוה et évite la répétition « Seigneur SEIGNEUR ».
theological_decisions:
- issue: Nature de ce que les femmes « porteront »
  choice: vous porterez les péchés de vos idoles
  alternative: vous porterez la culpabilité liée à vos idoles
  rationale: Le texte dit littéralement « les péchés de vos idoles ». La formulation retenue maintient l’ambiguïté entre les péchés associés au culte idolâtre et leur charge judiciaire, sans imposer « culpabilité » comme interprétation unique.
- issue: Rendu du titre divin אֲדֹנָי יְהוִה
  choice: le Seigneur YHWH
  alternative: le Seigneur Yahvé
  rationale: La translittération YHWH rend le tétragramme visible sans choisir une vocalisation reconstruite, tandis que אֲדֹנָי est traduit par « le Seigneur ».
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Faire retomber sur vous » remplace un calque peu naturel de l’hébreu, tandis que « porterez » maintient l’image judiciaire. Les pronoms « vous » renvoient ici à des destinataires féminines plurielles, distinction que le français ne marque pas.
