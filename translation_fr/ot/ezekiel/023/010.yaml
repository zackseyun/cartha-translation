source:
  edition: WLC
  text: הֵמָּה֮ גִּלּ֣וּ עֶרְוָתָ/הּ֒ בָּנֶ֤י/הָ וּ/בְנוֹתֶ֨י/הָ֙ לָקָ֔חוּ וְ/אוֹתָ֖/הּ בַּ/חֶ֣רֶב הָרָ֑גוּ וַ/תְּהִי שֵׁם֙ לַ/נָּשִׁ֔ים וּ/שְׁפוּטִ֖ים עָ֥שׂוּ בָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/010.yaml
  text: They uncovered her nakedness[a]; they took her sons and her daughters, and they killed her with the sword. So she became a byword among women[c][b], and they executed judgments on her.
translation:
  language: fr
  text: Ils dévoilèrent sa nudité[a] ; ils prirent ses fils et ses filles, et la tuèrent par l’épée. Elle devint ainsi tristement célèbre parmi les femmes[b], et ils exécutèrent des jugements contre elle[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mirent à nu sa nudité » ; l’expression hébraïque peut aussi évoquer l’exposition publique de sa honte.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « elle devint un nom parmi les femmes » ; autrement dit, elle acquit une réputation notoire.'
    reason: lexical_alternative
  - marker: c
    text: Ou « ils exercèrent contre elle des actes de jugement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּלּוּ עֶרְוָתָהּ
  choice: ils dévoilèrent sa nudité
  rationale: Cette formulation conserve l’image concrète et violente de l’expression hébraïque, qui évoque aussi l’exposition publique et l’humiliation.
- source_word: בָּנֶיהָ וּבְנוֹתֶיהָ לָקָחוּ
  choice: ils prirent ses fils et ses filles
  rationale: Le verbe hébreu signifie largement « prendre ». Dans ce contexte de conquête, il peut impliquer la capture ou la déportation, mais le français retenu préserve son indétermination.
- source_word: וְאוֹתָהּ בַּחֶרֶב הָרָגוּ
  choice: et la tuèrent par l’épée
  rationale: Le verbe signifie normalement « tuer » ; « par l’épée » maintient explicitement le moyen indiqué par l’hébreu.
- source_word: וַתְּהִי שֵׁם לַנָּשִׁים
  choice: elle devint ainsi tristement célèbre parmi les femmes
  rationale: Littéralement, elle « devint un nom parmi les femmes ». Le contexte donne à cette réputation une valeur négative ; la formulation française en rend clairement le sens sans employer l’opaque « devenir un nom ».
- source_word: וּשְׁפוּטִים עָשׂוּ בָהּ
  choice: ils exécutèrent des jugements contre elle
  rationale: La traduction conserve le substantif pluriel à portée judiciaire, plutôt que de le réduire au sens plus général de « punir ».
theological_decisions:
- issue: Langage métaphorique sexuel appliqué à Samarie/Oholah
  choice: Conserver l’image de la nudité dévoilée.
  alternative: Rendre l’expression par « ils l’humilièrent publiquement ».
  rationale: L’image sexuelle appartient à la métaphore prophétique structurante du chapitre. La maintenir préserve sa force rhétorique et le lien entre infidélité et jugement, sans l’atténuer par une abstraction.
- issue: Portée judiciaire de la dernière proposition
  choice: Employer « ils exécutèrent des jugements contre elle ».
  alternative: Employer « ils la punirent » ou « ils lui infligèrent des châtiments ».
  rationale: Le texte hébreu emploie explicitement un nom pluriel signifiant des jugements ou des actes judiciaires. Le conserver maintient la présentation théologique de son sort comme jugement, et non comme simple violence militaire.
translation_notes:
  register: Français international moderne, digne et direct. Le verset conserve l’image crue du texte prophétique ainsi que son vocabulaire judiciaire. Le passé simple convient au registre narratif biblique sans être archaïque.
