  text: וַ/יָּב֣וֹא אֵלֶ֔י/הָ כְּ/ב֖וֹא אֶל אִשָּׁ֣ה זוֹנָ֑ה כֵּ֣ן בָּ֗אוּ אֶֽל אָֽהֳלָה֙ וְ/אֶל אָ֣הֳלִיבָ֔ה אִשֹּׁ֖ת הַ/זִּמָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/044.yaml
  text: They went in to her as men go in to a prostitute[a]; so they went in to Oholah and to Oholibah[b], women of depravity.
translation:
  language: fr
  text: Il alla vers elle comme on va vers une prostituée[a]. C’est ainsi qu’ils allèrent vers Ohola et Oholiba, femmes de débauche[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu commence par un verbe au singulier (« Il alla »), puis passe au pluriel (« ils allèrent »). On peut aussi comprendre le premier verbe collectivement : « Ils allèrent vers elle comme on va vers une prostituée. »'
    reason: ambiguïté grammaticale
  - marker: b
    text: Ou « femmes dépravées ». L’expression hébraïque signifie littéralement « femmes de débauche » et évoque une conduite sexuelle infâme.
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיָּבֹא / בָּאוּ
  choice: Il vint / ils vinrent
  rationale: Le texte hébreu passe réellement d’un verbe au singulier à un verbe au pluriel. La traduction conserve cette variation plutôt que de l’uniformiser, puisque son référent exact demeure ambigu.
- source_word: אֵלֶיהָ / אֶל
  choice: vers elle / vers
  rationale: La préposition אֶל indique fondamentalement un mouvement vers quelqu’un. Dans ce contexte, l’expression comporte une nette valeur sexuelle, rendue évidente par la comparaison avec la prostituée sans qu’il soit nécessaire de la paraphraser.
- source_word: כְּבוֹא אֶל
  choice: comme on vient vers
  rationale: L’infinitif précédé de כְּ exprime ici la comparaison ou la manière. Le pronom indéfini « on » restitue naturellement en français le sujet implicite.
- source_word: אִשָּׁה זוֹנָה
  choice: une prostituée
  rationale: « Prostituée » est le terme moderne, clair et non archaïque correspondant à זוֹנָה.
- source_word: כֵּן
  choice: C’est ainsi que
  rationale: Cette formulation marque naturellement en français la correspondance établie par כֵּן entre la comparaison et l’action qui suit.
- source_word: אָהֳלָה ... אָהֳלִיבָה
  choice: Ohola ... Oholiba
  rationale: Les noms propres sont translittérés selon leur forme française biblique courante et restent distincts.
- source_word: אִשֹּׁת הַזִּמָּה
  choice: ces femmes dépravées
  rationale: L’expression désigne des femmes caractérisées par la זִמָּה, terme qui évoque ici une conduite sexuelle infâme et moralement dépravée. « Femmes dépravées » en conserve le poids moral dans un français naturel.
theological_decisions:
- issue: Variation de nombre dans les verbes d’ouverture
  choice: Conserver le singulier « Il vint », puis le pluriel « ils vinrent »
  alternative: 'Uniformiser au pluriel : « Ils vinrent vers elle… ainsi ils vinrent… »'
  rationale: Le texte massorétique porte d’abord un verbe au singulier, puis un verbe au pluriel. Même si le contexte peut suggérer un sujet collectif, préserver la variation évite de résoudre silencieusement une ambiguïté réelle du texte.
- issue: Portée sexuelle de בוא אל
  choice: Traduire formellement « venir vers », en laissant la comparaison expliciter le sens sexuel
  alternative: Employer une formulation plus explicite telle que « avoir des rapports avec elle »
  rationale: La comparaison avec la prostituée rend l’allusion sexuelle transparente. Une explicitation supplémentaire réduirait la retenue et l’ambiguïté idiomatique de l’hébreu.
translation_notes:
  register: Français moderne, international et digne. La formulation demeure proche de la syntaxe hébraïque tout en restant naturelle. « Prostituée » évite les termes archaïques ou inutilement insultants, et « femmes dépravées » conserve la forte condamnation morale de l’expression finale.
