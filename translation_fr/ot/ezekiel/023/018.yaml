id: EZK.23.18
reference: Ezekiel 23:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/תְּגַל֙ תַּזְנוּתֶ֔י/הָ וַ/תְּגַ֖ל אֶת עֶרְוָתָ֑/הּ וַ/תֵּ֤קַע נַפְשִׁ/י֙ מֵֽ/עָלֶ֔י/הָ כַּ/אֲשֶׁ֛ר נָקְעָ֥ה נַפְשִׁ֖/י מֵ/עַ֥ל אֲחוֹתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/018.yaml
  text: She uncovered her prostitutions and uncovered her nakedness[a]; then my soul was repulsed by her[c][b], just as my soul had been repulsed by her sister.
translation:
  language: fr
  text: Elle dévoila ses prostitutions et mit à nu sa nudité[a]. Alors mon âme se détourna d’elle avec dégoût[b], comme mon âme s’était détournée de sa sœur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « révéla ses actes de prostitution et dévoila sa nudité ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « mon âme se détacha d’elle »; l’hébreu exprime un vif mouvement de recul, de répulsion ou d’éloignement.'
    reason: lexical_alternative
  - marker: c
    text: Dans l’allégorie, sa sœur est Samarie, appelée Ohola.
    reason: cross_reference
lexical_decisions:
- source_word: וַתְּגַל
  choice: dévoila / mit à nu
  rationale: Le verbe גלה signifie découvrir ou révéler. « Dévoila » convient aux prostitutions, tandis que « mit à nu » rend concrètement le parallélisme avec la nudité.
- source_word: תַּזְנוּתֶיהָ
  choice: ses prostitutions
  rationale: Le pluriel conserve la force explicite de זְנוּת et l’image prophétique de l’infidélité, sans employer un terme archaïque.
- source_word: עֶרְוָתָהּ
  choice: sa nudité
  rationale: Rend directement עֶרְוָה tout en préservant la portée sexuelle de l’image sans préciser davantage l’anatomie.
- source_word: וַתֵּקַע / נָקְעָה
  choice: se détourna avec dégoût / s’était détournée
  rationale: Le verbe rare exprime ici un vif mouvement de répulsion et de détachement. La formulation française associe le recul relationnel à la révulsion; le plus-que-parfait marque l’antériorité du rejet de la sœur.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: Conserve l’expression hébraïque et son intensité anthropopathique plutôt que de la réduire à « je ».
- source_word: מֵעָלֶיהָ
  choice: d’elle
  rationale: Rend naturellement en français le mouvement d’éloignement exprimé par מֵעַל.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: Introduit clairement la comparaison avec le traitement antérieur de la sœur.
- source_word: אֲחוֹתָהּ
  choice: sa sœur
  rationale: Traduction directe du terme familial dans l’allégorie des deux sœurs.
theological_decisions:
- issue: Image sexuelle de l’infidélité à l’alliance
  choice: Conserver « prostitutions » et « nudité » dans le texte principal
  alternative: Employer « infidélités » ou « honte »
  rationale: Le langage volontairement cru d’Ézéchiel fait partie de la rhétorique prophétique; l’atténuer remplacerait l’image du texte par son interprétation.
- issue: Langage anthropopathique décrivant la réaction divine
  choice: Conserver « mon âme » et expliciter la forte répulsion par « avec dégoût »
  alternative: « Je me suis éloigné d’elle » ou « je lui suis devenu étranger »
  rationale: Cette formulation maintient l’intensité personnelle et la tension théologique de l’hébreu sans réduire la réaction à un simple changement de relation.
translation_notes:
  register: Français international moderne, naturel et digne. Le verset conserve le caractère explicite de la métaphore et l’expression intensive « mon âme ». La variation « dévoila / mit à nu » évite une répétition lourde tout en reproduisant le parallélisme hébreu.
