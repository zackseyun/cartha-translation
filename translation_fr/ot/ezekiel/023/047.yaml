  text: וְ/רָגְמ֨וּ עֲלֵי/הֶ֥ן אֶ֨בֶן֙ קָהָ֔ל וּ/בָרֵ֥א אוֹתְ/הֶ֖ן בְּ/חַרְבוֹתָ֑/ם בְּנֵי/הֶ֤ם וּ/בְנֽוֹתֵי/הֶם֙ יַהֲרֹ֔גוּ וּ/בָתֵּי/הֶ֖ן בָּ/אֵ֥שׁ יִשְׂרֹֽפוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/047.yaml
  text: And the assembly will stone them with stones and cut them down with their swords. They will kill their sons and their daughters[a], and burn their houses with fire.
translation:
  language: fr
  text: Les membres de l’assemblée les lapideront avec des pierres et les tailleront en pièces à coups d’épée[a]. Ils tueront leurs fils et leurs filles, et brûleront leurs maisons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les abattront » ou « les mettront en pièces » à coups d’épée.
    reason: alternative_lexicale
lexical_decisions:
- source_word: וְרָגְמוּ עֲלֵיהֶן אֶבֶן
  choice: les lapideront à coups de pierres
  rationale: Le verbe רגם désigne ici une mise à mort ou une attaque par lapidation. Le singulier אֶבֶן a une valeur collective ou instrumentale, rendue naturellement en français par « à coups de pierres ».
- source_word: קָהָל
  choice: les membres de l’assemblée
  rationale: קָהָל désigne un groupe assemblé. Cette formulation conserve l’idée d’une assemblée tout en permettant en français l’accord naturel avec les verbes et les épées au pluriel.
- source_word: וּבָרֵא אוֹתְהֶן
  choice: et les abattront
  rationale: Le Piel de ברא exprime ici l’action de couper ou de tailler avec violence. « Abattre » convient au contexte des épées sans imposer le degré précis de démembrement, qui demeure lexicalement incertain.
- source_word: בְּחַרְבוֹתָם
  choice: de leurs épées
  rationale: Le beth instrumental est rendu par « de », usage français naturel avec « abattre », et le pluriel avec suffixe masculin pluriel est conservé.
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: leurs fils et leurs filles
  rationale: La traduction maintient la distinction explicite entre les fils et les filles au lieu de la réduire au terme générique « enfants ».
- source_word: יַהֲרֹגוּ
  choice: ils tueront
  rationale: הרג est le verbe courant signifiant tuer. « Tuer » est direct, actuel et fidèle à la violence du texte.
- source_word: וּבָתֵּיהֶן
  choice: leurs maisons
  rationale: Le terme concret בָּתִּים désigne les maisons; cette image est conservée sans l’adoucir par « foyers ».
- source_word: בָּאֵשׁ יִשְׂרֹפוּ
  choice: brûleront leurs maisons par le feu
  rationale: La formulation garde l’expression hébraïque emphatique « brûler par le feu », tout en restant intelligible dans un registre français soutenu.
theological_decisions:
- issue: Référent des pronoms féminins pluriels
  choice: les / leurs, sans identifier de nouveau les femmes dans le verset
  alternative: « ces femmes »
  rationale: Les pronoms renvoient aux deux femmes de l’allégorie, Ohola et Oholiba. Leur maintien préserve la cohésion du texte source sans ajouter une explicitation interprétative.
- issue: Valeur collective de קָהָל et nombre des agents
  choice: « les membres de l’assemblée » avec des verbes au pluriel
  alternative: « l’assemblée » avec des verbes au singulier
  rationale: Les formes verbales et le suffixe de « leurs épées » présentent les exécutants au pluriel, tandis que קָהָל les désigne collectivement. La formulation choisie conserve les deux aspects.
translation_notes:
  register: Français international moderne, direct et digne. La violence concrète du texte est conservée. « Les membres de l’assemblée » évite en français une discordance entre le nom collectif singulier et les agents possesseurs d’épées au pluriel.
