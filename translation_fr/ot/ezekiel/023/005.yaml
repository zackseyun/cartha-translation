  text: וַ/תִּ֥זֶן אָהֳלָ֖ה תַּחְתָּ֑/י וַ/תַּעְגַּב֙ עַֽל מְאַהֲבֶ֔י/הָ אֶל אַשּׁ֖וּר קְרוֹבִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/005.yaml
  text: Oholah played the prostitute while under me[a], and she lusted after her lovers[c][b], the Assyrians who were nearby.
translation:
  language: fr
  text: Ohola se prostitua alors qu’elle était sous moi[a], et elle brûla de désir pour ses amants[b], les Assyriens qui étaient proches[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sous moi ». Dans la métaphore conjugale, l’expression situe Ohola dans sa relation au Seigneur; elle peut évoquer la dépendance ou l’autorité, sans préciser davantage la nuance.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « s’éprit passionnément de ». Le verbe hébreu exprime un désir intense et sensuel.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « les Assyriens, ceux qui étaient proches ». « Proches » peut évoquer leur proximité géographique, sans exclure une nuance relationnelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּזֶן
  choice: se prostitua
  rationale: Le verbe זנה conserve ici l’image sexuelle explicite par laquelle Ézéchiel dépeint l’infidélité religieuse et politique; « se prostitua » est naturel, actuel et suffisamment direct.
- source_word: אָהֳלָה
  choice: Ohola
  rationale: Translittération française usuelle du nom propre, sans en traduire ici le sens symbolique.
- source_word: תַּחְתָּי
  choice: alors qu’elle était sous mon autorité
  rationale: La locution signifie littéralement « sous moi » et évoque, dans la métaphore conjugale, la condition d’Ohola sous l’autorité du Seigneur. L’explicitation « autorité » rend cette relation intelligible sans la réduire à la simple possession.
- source_word: וַתַּעְגַּב
  choice: elle brûla de désir pour
  rationale: עגב exprime un désir passionné, sexuellement chargé et moralement négatif dans ce contexte. Cette tournure française en restitue l’intensité.
- source_word: מְאַהֲבֶיהָ
  choice: ses amants
  rationale: La forme participiale substantivée désigne ici les partenaires illicites d’Ohola dans la métaphore d’adultère.
- source_word: אֶל אַשּׁוּר
  choice: les Assyriens
  rationale: Après le verbe de désir, אֶל marque l’orientation vers l’objet désiré. Le pluriel קְרוֹבִים favorise l’interprétation personnelle et plurielle « les Assyriens » plutôt que le territoire « l’Assyrie ».
- source_word: קְרוֹבִים
  choice: qui étaient proches
  rationale: Le masculin pluriel qualifie vraisemblablement les Assyriens. « Proches » conserve l’ambiguïté entre proximité géographique et proximité relationnelle mieux que « voisins » ou « tout près ».
theological_decisions:
- issue: Métaphore prophétique de la prostitution pour l’infidélité d’Ohola
  choice: Maintenir explicitement les images « se prostitua », « brûla de désir » et « amants ».
  alternative: Employer des formulations atténuées telles que « fut infidèle » ou « rechercha des alliés étrangers ».
  rationale: Le texte hébreu emploie volontairement une imagerie sexuelle forte pour représenter l’idolâtrie et les alliances étrangères. La conserver respecte la force rhétorique et la tension théologique du passage.
- issue: Sens de תַּחְתָּי dans la métaphore conjugale
  choice: « alors qu’elle était sous mon autorité »
  alternative: « alors qu’elle m’appartenait » ou le plus littéral « sous moi »
  rationale: Le choix préserve le rapport d’autorité et de protection impliqué par la métaphore sans transformer implicitement Ohola en propriété ni imposer une interprétation doctrinale plus précise que le texte.
translation_notes:
  register: Français international moderne, direct et digne. Le verset garde l’imagerie sexuelle choquante propre à Ézéchiel sans archaïsme ni atténuation. La syntaxe reste fluide, et les notes signalent les ambiguïtés réelles de תַּחְתָּי, עגב et קְרוֹבִים.
