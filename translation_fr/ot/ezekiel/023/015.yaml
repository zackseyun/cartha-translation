  text: חֲגוֹרֵ֨י אֵז֜וֹר בְּ/מָתְנֵי/הֶ֗ם סְרוּחֵ֤י טְבוּלִים֙ בְּ/רָ֣אשֵׁי/הֶ֔ם מַרְאֵ֥ה שָׁלִשִׁ֖ים כֻּלָּ֑/ם דְּמ֤וּת בְּנֵֽי בָבֶל֙ כַּשְׂדִּ֔ים אֶ֖רֶץ מוֹלַדְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/015.yaml
  text: with belts fastened at their waists[a], with flowing turbans on their heads, all of them having the appearance of officers, the likeness of the sons of Babylon, Chaldeans[b], the land of their birth.
translation:
  language: fr
  text: ceints d’une ceinture à la taille, coiffés de turbans aux pans retombants, ayant tous l’apparence d’officiers[a], semblables aux fils de Babylone[b], des Chaldéens dont c’était le pays natal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chefs militaires ». Le mot hébreu peut désigner des soldats d’élite ou des officiers de haut rang.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « fils de Babylone », expression hébraïque désignant les Babyloniens.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲגוֹרֵי אֵזוֹר בְּמָתְנֵיהֶם
  choice: ceints d’une ceinture à la taille
  rationale: Cette formulation conserve l’image concrète de la ceinture attachée autour des reins, tout en employant « taille », plus naturel en français moderne.
- source_word: סְרוּחֵי טְבוּלִים בְּרָאשֵׁיהֶם
  choice: coiffés de turbans flottants
  rationale: « Turbans » rend le couvre-chef désigné ici, et « flottants » exprime son aspect pendant ou déployé sans alourdir la phrase.
- source_word: מַרְאֵה שָׁלִשִׁים כֻּלָּם
  choice: ayant tous l’apparence d’officiers
  rationale: « Officiers » transmet largement l’idée d’hommes de haut rang, probablement militaires, sans imposer un grade antique précis; « tous » préserve l’insistance de כֻּלָּם.
- source_word: דְּמוּת בְּנֵי בָבֶל
  choice: semblables aux fils de Babylone
  rationale: « Semblables » exprime la ressemblance indiquée par דְּמוּת, tandis que « fils de Babylone » conserve l’expression filiale hébraïque.
- source_word: כַּשְׂדִּים אֶרֶץ מוֹלַדְתָּם
  choice: des Chaldéens dont c’était le pays natal
  rationale: Le nom ethnique distinct est maintenu, et la relation appositionnelle avec leur terre d’origine est rendue dans un français compréhensible.
