  text: וַֽ/תִּפְקְדִ֔י אֵ֖ת זִמַּ֣ת נְעוּרָ֑יִ/ךְ בַּ/עְשׂ֤וֹת מִ/מִּצְרַ֨יִם֙ דַּדַּ֔יִ/ךְ לְמַ֖עַן שְׁדֵ֥י נְעוּרָֽיִ/ךְ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/021.yaml
  text: Thus you revisited the lewdness of your youth[a], when in Egypt they fondled your breasts[c][b], the breasts of your youth.
translation:
  language: fr
  text: Ainsi, tu es revenue à la débauche de ta jeunesse[a], lorsque les Égyptiens te caressaient les seins[c], à cause de tes seins de jeunesse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu t'es souvenue de la débauche de ta jeunesse ». Le verbe hébreu peut signifier « visiter », « s'occuper de », « se souvenir de » ou « revenir à »; ici, il peut évoquer à la fois le rappel et le retour à une ancienne conduite.
    reason: lexical_alternative
  - marker: b
    text: L'hébreu porte littéralement « d'Égypte ». Dans cette construction difficile, le contexte permet de comprendre « les Égyptiens » comme l'agent de l'action; « à cause de » rend le lien introduit par le terme hébreu signifiant aussi « pour » ou « en vue de ».
    reason: lexical_alternative
  - marker: c
    text: L'expression hébraïque est sexuellement explicite et désigne le fait de palper ou de caresser les seins.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְקְדִי
  choice: tu es revenue à
  rationale: Le verbe פקד peut exprimer le fait de se rappeler, de s'occuper de ou de revenir à quelque chose. Dans ce contexte de reprise d'une ancienne conduite, « revenir à » garde à la fois l'idée de rappel et celle de renouvellement des actes.
- source_word: זִמַּת
  choice: pratiques obscènes
  rationale: Dans ce contexte sexuel, זִמָּה désigne une conduite indécente ou dépravée. « Pratiques obscènes » rend clairement la portée sexuelle et morale sans atténuation.
- source_word: נְעוּרַיִךְ
  choice: ta jeunesse
  rationale: Rendu courant du terme, repris à la fin du verset afin de conserver la répétition emphatique de l'hébreu.
- source_word: בַּעֲשׂוֹת מִמִּצְרַיִם דַּדַּיִךְ
  choice: quand, en Égypte, on te caressait les seins
  rationale: La construction est difficile et très concise. Le français explicite idiomatiquement l'action sexuelle exercée en Égypte tout en conservant l'image anatomique directe.
- source_word: מִמִּצְרַיִם
  choice: en Égypte
  rationale: Bien que מִן signifie formellement « de/depuis », la formule désigne ici l'Égypte comme cadre ou source de l'action. Le rendu locatif est naturel en français; une note conserve la forme littérale.
- source_word: דַּדַּיִךְ
  choice: les seins
  rationale: Terme anatomique concret qu'il convient de conserver pour respecter le caractère délibérément explicite de la métaphore.
- source_word: שְׁדֵי נְעוּרַיִךְ
  choice: les seins de ta jeunesse
  rationale: Le maintien de la construction génitive et de la répétition reproduit l'insistance poétique du texte hébreu.
theological_decisions:
- issue: Métaphore sexuelle explicite dans une parole prophétique de jugement
  choice: Conserver les termes directs « pratiques obscènes » et « seins », ainsi que l'action de les caresser.
  alternative: Employer des euphémismes comme « immoralité », « charmes » ou « attraits ».
  rationale: L'imagerie volontairement crue représente l'infidélité de Jérusalem. L'adoucir réduirait la force de l'accusation prophétique.
- issue: Ambiguïté du verbe פקד
  choice: Traduire « tu es revenue à » et signaler en note la possibilité « tu t'es souvenue de ».
  alternative: Choisir uniquement le sens mémoriel « tu t'es souvenue de ».
  rationale: Le contexte suggère non seulement un souvenir, mais une reprise de l'ancienne conduite. La note préserve néanmoins la polysémie réelle du verbe.
translation_notes:
  register: Français international moderne, direct et digne. L'image sexuelle est conservée sans vulgarité ni atténuation. La répétition finale, légèrement marquée en français, reproduit l'insistance du texte source.
