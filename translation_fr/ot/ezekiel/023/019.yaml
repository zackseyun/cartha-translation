  text: וַ/תַּרְבֶּ֖ה אֶת תַּזְנוּתֶ֑י/הָ לִ/זְכֹּר֙ אֶת יְמֵ֣י נְעוּרֶ֔י/הָ אֲשֶׁ֥ר זָנְתָ֖ה בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/019.yaml
  text: Yet she multiplied her prostitutions[a], remembering the days of her youth, when she prostituted herself in the land of Egypt.
translation:
  language: fr
  text: Mais elle multiplia ses prostitutions[a], se souvenant des jours de sa jeunesse, où elle s’était prostituée au pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « augmenta le nombre de ses actes de prostitution ».'
    reason: Alternative lexicale explicitant le sens pluriel et causatif de וַתַּרְבֶּה אֶת־תַּזְנוּתֶיהָ.
lexical_decisions:
- source_word: וַתַּרְבֶּה
  choice: Mais elle multiplia
  rationale: Le hiphil de רבה exprime ici l’idée de rendre nombreux, donc de multiplier. « Mais » rend la nuance adversative suggérée par le contexte, où elle poursuit sa conduite malgré ce qui précède.
- source_word: תַּזְנוּתֶיהָ
  choice: ses prostitutions
  rationale: Le pluriel désigne des actes répétés de prostitution et conserve l’image sexuelle volontairement forte employée par Ézéchiel pour l’infidélité politique et religieuse.
- source_word: לִזְכֹּר
  choice: se souvenant
  rationale: L’infinitif avec ל peut exprimer une circonstance concomitante ou un but. Le participe français garde ce lien sans trancher plus que nécessaire.
- source_word: יְמֵי נְעוּרֶיהָ
  choice: les jours de sa jeunesse
  rationale: Cette formulation naturelle conserve l’expression temporelle hébraïque et son évocation des débuts de son histoire.
- source_word: אֲשֶׁר זָנְתָה
  choice: où elle s’était prostituée
  rationale: Le verbe זנה reprend explicitement la métaphore de la prostitution. Le plus-que-parfait situe naturellement ces actes avant le souvenir évoqué dans la proposition principale.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: au pays d’Égypte
  rationale: Cette tournure française courante préserve l’expression géographique hébraïque « terre/pays d’Égypte » et sa résonance historique.
theological_decisions:
- issue: Métaphore sexuelle prophétique de l’idolâtrie et de l’infidélité politique
  choice: Conserver explicitement le vocabulaire de la prostitution
  alternative: Atténuer par « infidélités » ou « immoralités »
  rationale: L’image choquante appartient à la rhétorique voulue du texte et représente l’apostasie religieuse et politique. L’atténuer ferait perdre une part essentielle de sa force sans qu’il soit nécessaire d’ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et direct. Le passé simple convient au registre narratif biblique soutenu sans être archaïque. La métaphore explicite est conservée, ainsi que l’ambiguïté relative du rapport exprimé par לִזְכֹּר.
