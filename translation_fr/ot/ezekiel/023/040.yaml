  naturalness: Le français est globalement clair et actuel. « Et voici qu’ils sont venus vers celle qui… » conserve la vivacité de וְהִנֵּה tout en suivant la syntaxe et le mouvement de la phrase hébraïque. « Fardé ses yeux » et « s’était parée de bijoux » sont naturels dans ce registre.
  terminology: « Messager » convient pour מַלְאָךְ au sens humain. « Khôl » dans la note précise utilement le cosmétique visé par כָּחַל. « Bijoux » rend naturellement עֱדִי.
