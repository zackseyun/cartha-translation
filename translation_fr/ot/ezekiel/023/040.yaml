  text: וְ/אַ֗ף כִּ֤י תִשְׁלַ֨חְנָה֙ לַֽ/אֲנָשִׁ֔ים בָּאִ֖ים מִ/מֶּרְחָ֑ק אֲשֶׁ֨ר מַלְאָ֜ךְ שָׁל֤וּחַ אֲלֵי/הֶם֙ וְ/הִנֵּה בָ֔אוּ לַ/אֲשֶׁ֥ר רָחַ֛צְתְּ כָּחַ֥לְתְּ עֵינַ֖יִ/ךְ וְ/עָ֥דִית עֶֽדִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/040.yaml
  text: And moreover[a], they sent for men coming from far away, to whom a messenger had been sent; and behold, they came—to the one who had washed herself, painted her eyes, and adorned herself with jewelry.
translation:
  language: fr
  text: Bien plus, elles ont envoyé chercher des hommes venant de loin, auxquels un messager avait été envoyé. Et voici qu’ils sont venus vers celle qui s’était lavée, avait fardé ses yeux[a] et s’était parée de bijoux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « souligné ses yeux de khôl ». Le verbe hébreu désigne l’application d’un cosmétique sombre autour des yeux.'
    reason: Précision lexicale sur le cosmétique mentionné par le verbe hébreu.
lexical_decisions:
- source_word: וְאַף כִּי
  choice: Bien plus
  rationale: Cette expression fait progresser l’accusation tout en la renforçant. « Bien plus » en restitue naturellement la valeur additive et emphatique.
- source_word: תִשְׁלַחְנָה
  choice: elles ont envoyé chercher
  rationale: La forme féminine plurielle renvoie ici aux deux femmes, images des deux villes. « Envoyer chercher » exprime naturellement en français l’idée de faire venir les hommes.
- source_word: לַאֲנָשִׁים בָּאִים מִמֶּרְחָק
  choice: des hommes venus de loin
  rationale: Cette formulation conserve l’origine lointaine des hommes tout en rendant idiomatiquement le participe hébreu dans un récit au passé.
- source_word: אֲשֶׁר מַלְאָךְ שָׁלוּחַ אֲלֵיהֶם
  choice: auxquels un messager avait été envoyé
  rationale: « Messager » désigne ici un envoyé humain. Le plus-que-parfait explicite l’antériorité logique de cet envoi par rapport à leur arrivée.
- source_word: וְהִנֵּה בָאוּ
  choice: Et les voilà arrivés !
  rationale: La tournure présentative restitue la vivacité de וְהִנֵּה et l’accompli hébreu sans recourir au calque peu naturel « voici, ils vinrent ».
- source_word: לַאֲשֶׁר רָחַצְתְּ
  choice: Pour eux, tu t’es lavée
  rationale: Le ל préfixé à אֲשֶׁר est compris comme indiquant les hommes en vue desquels la femme s’est préparée. La construction conserve le passage soudain du pluriel au singulier féminin.
- source_word: כָּחַלְתְּ עֵינַיִךְ
  choice: tu as fardé tes yeux
  rationale: Le verbe désigne l’application d’un cosmétique sombre sur les yeux. « Farder les yeux » est clair et naturel; la mention précise du khôl est conservée en note.
- source_word: וְעָדִית עֶדִי
  choice: tu t’es parée de bijoux
  rationale: La combinaison du verbe et de son complément signifie mettre des ornements. « Se parer de bijoux » rend l’expression avec naturel et dignité.
theological_decisions:
- issue: Alternance entre le féminin pluriel et le féminin singulier
  choice: Rendre d’abord le sujet par « elles », puis interpeller une seule femme par « tu ».
  alternative: Uniformiser tout le verset au singulier ou au pluriel.
  rationale: Le texte hébreu passe des deux femmes/villes considérées ensemble à une femme directement interpellée. Maintenir ce changement préserve la rhétorique prophétique sans déterminer artificiellement laquelle des deux est visée.
- issue: Fonction de לַאֲשֶׁר avant les gestes de préparation
  choice: 'Comprendre « pour eux » : la femme s’est préparée en vue des hommes arrivés.'
  alternative: Comprendre « vers celle qui » et faire de la femme la destination de leur venue.
  rationale: La construction hébraïque est abrupte. Dans ce contexte, rattacher le lamed aux préparatifs effectués pour les visiteurs donne un français cohérent et respecte la relation de finalité, sans effacer le changement de personne.
translation_notes:
  register: Français international actuel, clair et digne. « Et les voilà arrivés ! » conserve l’effet saisissant de la particule prophétique; « fardé » et « parée » appartiennent à un registre courant mais soutenu, adapté au contexte.
