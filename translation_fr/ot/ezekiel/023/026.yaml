  text: וְ/הִפְשִׁיט֖וּ/ךְ אֶת בְּגָדָ֑יִ/ךְ וְ/לָקְח֖וּ כְּלֵ֥י תִפְאַרְתֵּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/026.yaml
  text: They will strip you of your garments and take your splendid ornaments[a].
translation:
  language: fr
  text: Ils te dépouilleront de tes vêtements et prendront les objets qui font ta splendeur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes magnifiques parures » ; plus littéralement, « les objets de ta splendeur » ou « les objets de ta beauté ».
    reason: La construction כְּלֵי תִפְאַרְתֵּךְ peut désigner des objets précieux ou des parures associés à la beauté et à la splendeur de la femme, sans préciser qu’il s’agit exclusivement de bijoux.
lexical_decisions:
- source_word: וְהִפְשִׁיטוּךְ
  choice: Ils te dépouilleront
  rationale: Le hiphil de פשט avec suffixe féminin singulier signifie enlever à quelqu’un ses vêtements. « Dépouiller de » est naturel en français et s’accorde avec le complément explicite « de tes vêtements », sans ajouter l’idée de nudité complète.
- source_word: בְּגָדָיִךְ
  choice: tes vêtements
  rationale: בגד est le terme courant pour les vêtements. Ce choix est clair, actuel et conserve la dignité du registre prophétique.
- source_word: וְלָקְחוּ
  choice: et prendront
  rationale: לקח signifie couramment « prendre ». Le contexte implique une dépossession forcée, mais le verbe simple évite de renforcer explicitement cette nuance.
- source_word: כְּלֵי
  choice: les objets
  rationale: כְּלִי peut désigner un objet, un article, un ustensile ou un récipient. « Objets » préserve ici l’étendue lexicale du mot, sans limiter le référent aux seuls bijoux.
- source_word: תִפְאַרְתֵּךְ
  choice: qui font ta splendeur
  rationale: תפארת exprime la splendeur, la beauté ou la gloire. La tournure relative rend naturellement en français la relation construite « objets de ta splendeur » tout en conservant son ambiguïté.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement féminin singulier reflète les suffixes hébreux adressés à la femme personnifiée. La formulation conserve le parallélisme des deux verbes et évite de préciser excessivement la nature des objets emportés.
