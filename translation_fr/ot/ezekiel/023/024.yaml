review_pass:
  verdict: revise
  source_fidelity: La révision maintient les éléments militaires et judiciaires du texte hébreu, tout en conservant l’incertitude de הֹצֶן en note. Elle rend explicitement l’action de « placer » les armes tout autour de la destinataire et distingue le jugement que Dieu place devant les envahisseurs de leurs propres jugements.
  naturalness: Le français reste moderne et fluide. Les pluriels pour l’équipement militaire sont naturels; « selon leurs jugements » conserve volontairement la répétition juridique de l’original sans réduire le terme à « leurs lois ».
  terminology: « Grands boucliers, petits boucliers et casques » rend les trois termes militaires. « Jugement » et « jugements » préservent le réseau lexical משפט / שפט et évitent l’interprétation plus étroite de « lois ».
  issues:
  - severity: medium
    issue: « Ils t’encercleront avec… »
    rationale: Cette formulation exprime le résultat possible, mais le texte dit qu’ils placeront contre elle, tout autour, bouclier, petit bouclier et casque. Il convient de conserver cette action et cette disposition.
  - severity: medium
    issue: « Je leur confierai ton jugement »
    rationale: « Ton » n’est pas exprimé, et « confier » interprète davantage le geste divin. Le texte dit littéralement que Dieu met/présente « le jugement » devant eux.
  - severity: medium
    issue: « selon leurs lois »
    rationale: Le pluriel משפטיהם signifie plus largement leurs jugements, décisions ou procédures judiciaires; « lois » restreint indûment le sens et affaiblit l’écho avec « jugement ».
