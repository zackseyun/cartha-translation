  text: וּ/בָ֣אוּ עָלַ֡יִ/ךְ הֹ֠צֶן רֶ֤כֶב וְ/גַלְגַּל֙ וּ/בִ/קְהַ֣ל עַמִּ֔ים צִנָּ֤ה וּ/מָגֵן֙ וְ/קוֹבַ֔ע יָשִׂ֥ימוּ עָלַ֖יִ/ךְ סָבִ֑יב וְ/נָתַתִּ֤י לִ/פְנֵי/הֶם֙ מִשְׁפָּ֔ט וּ/שְׁפָט֖וּ/ךְ בְּ/מִשְׁפְּטֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/024.yaml
  text: They will come against you with troops, chariots, and wagons, and with an assembly of peoples. They will set shield and buckler and helmet against you on every side, and I will set judgment before them, and they will judge you by their judgments.
translation:
  language: fr
  text: Ils viendront contre toi avec des troupes[a], des chars et des chariots, ainsi qu’avec une assemblée de peuples. Ils placeront contre toi, tout autour, de grands boucliers, de petits boucliers et des casques. Je placerai devant eux le jugement, et ils te jugeront selon leurs jugements.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le sens du mot hébreu est incertain; autres traductions possibles : « avec des armes » ou « en masse ».'
    reason: הֹצֶן est un hapax ou terme extrêmement rare dont l’interprétation lexicale demeure disputée.
lexical_decisions:
- source_word: הֹצֶן
  choice: une troupe
  rationale: Terme rare et de sens incertain. Le contexte militaire favorise l’idée de troupes ou d’une force armée, sans certitude suffisante pour préciser davantage.
- source_word: רֶכֶב וְגַלְגַּל
  choice: des chars et des chariots
  rationale: רֶכֶב désigne ici les chars, tandis que גַלְגַּל, littéralement « roue », semble désigner par métonymie des véhicules à roues ou chariots.
- source_word: צִנָּה וּמָגֵן
  choice: de grands boucliers, de petits boucliers
  rationale: Les deux mots désignent des types de boucliers; la distinction de taille rend leur contraste probable en français courant.
- source_word: מִשְׁפָּט
  choice: jugement
  rationale: Conserve le vocabulaire judiciaire du passage et son lien avec le verbe שׁפט.
- source_word: בְּמִשְׁפְּטֵיהֶם
  choice: selon leurs lois
  rationale: Le pluriel peut désigner leurs règles de droit, leurs normes ou leurs sentences. « Selon leurs lois » exprime naturellement l’idée de leur propre système judiciaire.
theological_decisions:
- issue: Dieu remet le jugement aux envahisseurs
  choice: Je leur confierai ton jugement
  alternative: Je placerai le jugement devant eux
  rationale: La formulation française exprime que Dieu remet la cause judiciaire à ces peuples, sans nier leur responsabilité ni ajouter une doctrine sur leur statut moral.
- issue: Norme judiciaire des nations
  choice: ils te jugeront selon leurs lois
  alternative: ils te jugeront selon leurs jugements
  rationale: Le texte souligne qu’ils appliqueront leurs propres normes ou décisions. La traduction conserve cette tension sans affirmer que leurs jugements sont identiques au jugement divin.
translation_notes:
  register: Français moderne, international et digne. Le rythme accumulatif du texte hébreu est conservé, avec un vocabulaire militaire concret et une formulation judiciaire naturelle.
