base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/034.yaml
  text: You will drink it and drain it dry[a], and you will gnaw its shards, and tear off your breasts; for I have spoken, declares the Lord GOD.
translation:
  language: fr
  text: Tu la boiras et la videras jusqu’à la dernière goutte ; tu rongeras ses tessons[a] et tu t’arracheras les seins. Car moi, j’ai parlé — déclaration du Seigneur DIEU.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire les morceaux cassés du récipient en terre cuite.
    reason: Précision lexicale sur l’image concrète exprimée par חֲרָשֶׂיהָ.
lexical_decisions:
- source_word: וְשָׁתִית אוֹתָהּ
  choice: Tu la boiras
  rationale: Le parfait qal à la 2e personne du féminin singulier, dans ce discours prophétique, exprime ici une action future. Le pronom féminin renvoie à la coupe du contexte.
- source_word: וּמָצִית
  choice: et la videras jusqu’à la dernière goutte
  rationale: Le verbe מצה évoque le fait de vider ou d’absorber entièrement. Cette formulation française exprime naturellement l’idée de boire la coupe jusqu’au bout.
- source_word: חֲרָשֶׂיהָ
  choice: ses tessons
  rationale: Le pluriel de חֶרֶשׂ désigne les morceaux cassés d’un récipient en terre cuite. « Tessons » conserve précisément l’image concrète.
- source_word: תְּגָרֵמִי
  choice: tu en rongeras
  rationale: Le piel de גרם décrit l’action de ronger ou de broyer quelque chose de dur. « Rongeras » préserve le caractère violent et grotesque de l’image.
- source_word: וְשָׁדַיִךְ תְּנַתֵּקִי
  choice: et tu t’arracheras les seins
  rationale: Au piel, נתק signifie arracher ou détacher avec force. La traduction ne cherche pas à atténuer l’image intentionnellement choquante du jugement.
- source_word: כִּי אֲנִי דִבַּרְתִּי
  choice: Car moi, j’ai parlé
  rationale: כִּי introduit le fondement du jugement annoncé, tandis que le pronom explicite אֲנִי met le locuteur divin en relief.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: déclaration du Seigneur DIEU
  rationale: נְאֻם est une formule prophétique solennelle. « Seigneur DIEU » distingue אֲדֹנָי de יהוה tout en suivant une représentation révérencielle traditionnelle du nom divin.
theological_decisions:
- issue: Rendu du titre divin אֲדֹנָי יְהוִה
  choice: le Seigneur DIEU
  alternative: le Seigneur Yahvé
  rationale: Le texte associe אֲדֹנָי au nom divin יהוה. « Seigneur DIEU » évite la répétition « Seigneur Seigneur » et signale par les capitales que « DIEU » représente le nom divin, sans imposer une vocalisation particulière.
- issue: Agent de l’arrachement des seins
  choice: tu t’arracheras les seins
  alternative: tes seins seront arrachés
  rationale: La forme verbale hébraïque est active à la 2e personne du féminin singulier. La traduction conserve donc l’image d’une action accomplie par la femme elle-même, malgré sa dureté.
translation_notes:
  register: Français international actuel, direct et solennel. Le tutoiement féminin singulier suit l’adresse prophétique. La violence des images est conservée sans euphémisme ; le point-virgule clarifie la progression entre l’épuisement de la coupe et ses conséquences grotesques.
