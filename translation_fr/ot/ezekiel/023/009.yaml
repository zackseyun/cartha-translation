id: EZK.23.9
reference: Ezekiel 23:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֥ן נְתַתִּ֖י/הָ בְּ/יַד מְאַֽהֲבֶ֑י/הָ בְּ/יַד֙ בְּנֵ֣י אַשּׁ֔וּר אֲשֶׁ֥ר עָגְבָ֖ה עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/009.yaml
  text: Therefore I gave her into the hand of her lovers[a], into the hand of the sons of Assyria[b], for whom she lusted.
translation:
  language: fr
  text: C’est pourquoi je l’ai livrée au pouvoir de ses amants, au pouvoir des Assyriens, pour qui elle brûlait de désir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dont elle s’était éprise passionnément ». Le verbe hébreu exprime ici un désir intense, à connotation sexuelle dans la métaphore de l’adultère employée par Ézéchiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque clairement la conséquence de l’accusation précédente dans un français actuel et soutenu.
- source_word: נְתַתִּיהָ בְּיַד
  choice: je l’ai livrée au pouvoir de
  rationale: L’expression française rend naturellement l’idiome hébreu « donner dans la main de », qui indique la remise sous l’autorité ou à la merci de quelqu’un.
- source_word: מְאַהֲבֶיהָ
  choice: ses amants
  rationale: Conserve l’image d’adultère qui structure le passage et désigne métaphoriquement les partenaires politiques illicites.
- source_word: בְּנֵי אַשּׁוּר
  choice: les Assyriens
  rationale: « Les Assyriens » est l’équivalent idiomatique français de l’expression hébraïque littérale « les fils d’Assyrie ».
- source_word: עָגְבָה עֲלֵיהֶם
  choice: pour qui elle brûlait de désir
  rationale: Rend la force du désir passionné et sexuellement chargé exprimé par עגב, sans employer une formulation française artificielle.
theological_decisions:
- issue: Métaphore sexuelle prophétique appliquée aux alliances étrangères de Samarie/Oholah
  choice: Maintenir « ses amants » et « brûlait de désir »
  alternative: Expliciter politiquement par « ses alliés » et « qu’elle recherchait »
  rationale: Le texte hébreu présente délibérément l’infidélité politique sous l’image de l’adultère. La conserver respecte la vigueur prophétique et la tension théologique du passage sans ajouter d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition hébraïque de « dans la main de » est rendue par la répétition de « au pouvoir de », tandis que « les fils d’Assyrie » devient idiomatiquement « les Assyriens ».
