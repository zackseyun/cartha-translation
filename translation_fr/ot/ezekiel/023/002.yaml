  yaml_path: translation/ot/ezekiel/023/002.yaml
  text: Son of man[a], there were two women, daughters of one mother.
translation:
  language: fr
  text: Fils d’homme, il y avait deux femmes, filles d’une même mère.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Fils d’homme
  rationale: Formule d’interpellation habituelle adressée à Ézéchiel. Cette traduction conserve l’expression hébraïque et sa portée reconnue dans le livre, sans la remplacer par une interprétation comme « humain ».
- source_word: שְׁתַּיִם נָשִׁים
  choice: deux femmes
  rationale: Le numéral et le nom ont ici leur sens ordinaire. « Femmes » présente les personnages sans introduire prématurément la métaphore conjugale du contexte.
- source_word: בְּנוֹת אֵם אַחַת
  choice: filles d’une même mère
  rationale: Littéralement, « filles d’une mère unique/une ». En français courant, « d’une même mère » exprime naturellement qu’elles ont la même mère tout en restant proche de la formulation hébraïque.
- source_word: הָיוּ
  choice: il y avait
  rationale: Rend naturellement en français l’emploi existentiel du verbe היה.
