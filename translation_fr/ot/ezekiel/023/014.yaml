  text: וַ/תּ֖וֹסֶף אֶל תַּזְנוּתֶ֑י/הָ וַ/תֵּ֗רֶא אַנְשֵׁי֙ מְחֻקֶּ֣ה עַל הַ/קִּ֔יר צַלְמֵ֣י כשדיים חֲקֻקִ֖ים בַּ/שָּׁשַֽׁר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/014.yaml
  text: Then she added to her acts of prostitution[a], and she saw men portrayed on the wall, images of Chaldeans portrayed in vermilion[b],
translation:
  language: fr
  text: Elle ajouta encore à ses actes de prostitution, et vit des figures d’hommes représentées sur le mur, des images de Chaldéens[a] tracées au pigment rouge vif[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Babyloniens » ; l’hébreu dit « Chaldéens », peuple étroitement associé à Babylone.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu désigne une substance colorante rouge éclatante, peut-être du vermillon ou du cinabre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף אֶל תַּזְנוּתֶיהָ
  choice: Elle ajouta encore à ses prostitutions
  rationale: La formulation conserve l’idiome hébreu avec יסף et le pluriel concret de תזנות, tout en gardant la force volontairement choquante de la métaphore prophétique.
- source_word: וַתֵּרֶא
  choice: elle vit
  rationale: Traduction directe de ראה, qui fait progresser la scène.
- source_word: אַנְשֵׁי מְחֻקֶּה עַל הַקִּיר
  choice: des hommes représentés sur le mur
  rationale: « Représentés » exprime la figuration visuelle sans préciser indûment si elle était peinte, gravée ou sculptée.
- source_word: צַלְמֵי כַשְׂדִּים
  choice: des images de Chaldéens
  rationale: « Chaldéens » préserve la désignation ethnique et politique du texte hébreu; le lien avec Babylone est expliqué en note.
- source_word: חֲקֻקִים
  choice: tracées
  rationale: Le terme appartient au champ de l’inscription ou de la gravure. Ici, avec un pigment coloré, « tracées » reste naturel en français et évite d’imposer une technique précise.
- source_word: בַּשָּׁשַׁר
  choice: avec un pigment rouge vif
  rationale: ששר désigne une matière colorante rouge éclatante dont l’identification exacte demeure incertaine; la formulation descriptive est claire en français moderne.
theological_decisions:
- issue: Métaphore sexuelle de l’infidélité envers Dieu
  choice: Conserver « prostitutions »
  alternative: infidélités
  rationale: Ézéchiel emploie délibérément une image sexuelle crue pour évoquer l’idolâtrie et les alliances politiques. La remplacer par « infidélités » atténuerait la vigueur et la tension du texte.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation en deux-points clarifie que ce qu’elle voit constitue une nouvelle manifestation de ses prostitutions. Le vocabulaire concret et la métaphore provocante de l’hébreu sont maintenus sans ajouter d’interprétation confessionnelle.
