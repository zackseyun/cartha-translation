    Tu deviendras un objet de risée et de moquerie[b] ;

    sa contenance est grande. »'
  to: 'Ainsi parle le Seigneur Yahweh :


    « Tu boiras la coupe de ta sœur[a],

    profonde et large.

    Elle sera un objet de risée et de moquerie ;

    elle contient beaucoup. »'
  rationale: 'La révision corrige l''accord et le référent du verbe principal : la coupe, et non la femme interpellée, est objet de risée. Elle retire en conséquence une note grammaticale erronée. La dernière proposition est reformulée pour rendre la grande capacité de la coupe dans un français moderne, tout en évitant d''ajouter un connecteur causal au texte source.'
