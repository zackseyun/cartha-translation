base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/032.yaml
  text: 'Thus says the Lord GOD: You will drink your sister’s cup[a], deep and wide; it will be for laughter and for mockery[b], for it holds much.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur Yahweh :


    « Tu boiras la coupe de ta sœur[a],

    profonde et large.

    Elle sera un objet de risée et de moquerie ;

    elle contient beaucoup. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La coupe représente ici la part de jugement qui lui est attribuée.
    reason: metaphorical_context
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Le titre אֲדֹנָי est rendu par « le Seigneur » et le nom divin יהוה par « Yahweh », ce qui maintient leur distinction sans produire l’expression artificielle « le Seigneur SEIGNEUR ».
- source_word: כּוֹס אֲחוֹתֵךְ
  choice: la coupe de ta sœur
  rationale: Le groupe construit est rendu directement. L’image concrète de la coupe est conservée, sans intégrer son sens judiciaire dans le corps du texte.
- source_word: תִּשְׁתִּי
  choice: tu boiras
  rationale: L’imparfait 2e personne féminin singulier a ici une valeur future dans la déclaration prophétique.
- source_word: הָעֲמֻקָּה וְהָרְחָבָה
  choice: profonde et large
  rationale: Les deux adjectifs féminins décrivent la coupe et soulignent son importante capacité.
- source_word: תִּהְיֶה לִצְחֹק וּלְלַעַג
  choice: tu deviendras un objet de risée et de moquerie
  rationale: Cette tournure française naturelle conserve l’idée d’être publiquement tournée en ridicule. La forme תִּהְיֶה peut toutefois aussi avoir « la coupe » pour sujet ; cette ambiguïté est signalée en note.
- source_word: מִרְבָּה לְהָכִיל
  choice: sa contenance est grande
  rationale: La formulation exprime naturellement en français la grande capacité de la coupe, sans ajouter un lien causal absent de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יהוה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le choix « Yahweh » représente directement le nom divin, tandis que « le Seigneur » rend le titre distinct אֲדֹנָי.
- issue: Référent de תִּהְיֶה
  choice: 'la femme interpellée : « tu deviendras »'
  alternative: 'la coupe : « elle deviendra »'
  rationale: 'La lecture à la deuxième personne s’accorde avec l’adresse directe et donne un sens contextuel naturel : la destinataire devient objet de risée. La morphologie permet néanmoins une lecture à la troisième personne féminine ayant « coupe » pour sujet ; elle est donc conservée en note.'
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La disposition en lignes met en valeur le parallélisme prophétique. « Objet de risée » reste courant et digne ; « contenance » décrit avec précision la capacité d’un récipient.
