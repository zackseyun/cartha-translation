review_pass:
  verdict: revise
  source_fidelity: 'La forme hébraïque תִּהְיֶה est une 3e personne féminine singulier : son sujet est la « coupe » (כּוֹס), non la destinataire. Le texte français doit donc employer « elle sera », et non « tu deviendras ». La finale décrit la capacité considérable de la coupe ; « elle contient beaucoup » en rend le sens de façon concise sans introduire une causalité explicite absente du texte hébreu.'
  naturalness: « Elle sera un objet de risée et de moquerie » est naturel, solennel et clair en français contemporain. « Elle contient beaucoup » est plus idiomatique que « sa contenance est grande » et conserve l’image de la coupe.
  terminology: « Le Seigneur Yahweh » maintient la distinction entre אֲדֹנָי et יהוה conformément au choix du projet. « Coupe », « risée » et « moquerie » préservent le langage imagé et le registre prophétique. La note b doit être supprimée, car l’alternative proposée repose sur une ambiguïté grammaticale qui n’est pas présente dans la forme verbale hébraïque.
  issues:
  - severity: high
    issue: Le sujet de « Tu deviendras » est incorrect.
    rationale: תִּהְיֶה est morphologiquement une 3e personne féminine singulier, accordée avec « la coupe » ; une 2e personne féminine singulier aurait une autre forme. Le verset dit donc que la coupe sera objet de risée et de moquerie.
  - severity: medium
    issue: La note b affirme une ambiguïté grammaticale inexistante.
    rationale: 'La lecture où la coupe est sujet n''est pas une simple possibilité alternative : elle est imposée par la morphologie de תִּהְיֶה. Maintenir cette note induirait le lecteur en erreur.'
  - severity: low
    issue: « Sa contenance est grande » est moins direct et moins fidèle à la formulation finale.
    rationale: Le texte hébreu conclut par l'idée que la coupe contient beaucoup / a beaucoup de place. « Elle contient beaucoup » l'exprime plus naturellement et garde le sujet grammatical de la coupe.
  revised_text: 'Ainsi parle le Seigneur Yahweh :


    « Tu boiras la coupe de ta sœur[a],

    profonde et large.

    Elle sera un objet de risée et de moquerie ;

