revisions:
- from: Pourtant, elle n’a pas abandonné les prostitutions auxquelles elle se livrait depuis l’Égypte[a]. En effet, dans sa jeunesse, des hommes avaient couché avec elle ; ils avaient caressé sa poitrine virginale[b] et déversé sur elle leur prostitution.
  to: Pourtant, elle n’a pas abandonné les prostitutions auxquelles elle se livrait, venues d’Égypte[a]. En effet, dans sa jeunesse, des hommes avaient couché avec elle ; ils avaient caressé sa poitrine virginale[b] et déversé sur elle leur prostitution.
  rationale: La seule correction nécessaire remplace « depuis l’Égypte », qui risque d’ajouter une notion temporelle de continuité, par « venues d’Égypte », qui rend l’origine indiquée par l’hébreu. Les appels de notes et leur ancrage sont conservés.
