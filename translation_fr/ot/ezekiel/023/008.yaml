  source_fidelity: 'La proposition initiale rend correctement l’idée que les prostitutions ont leur origine en Égypte, mais « depuis l’Égypte » suggère aussi une durée continue (« depuis lors ») qui n’est pas exprimée par מן. Le reste suit fidèlement l’hébreu : les relations sexuelles durant la jeunesse, le geste explicite envers les seins associés à la virginité, et l’image volontairement étrange de « déverser leur prostitution sur elle ».'
