  text: וְ/אֶת תַּזְנוּתֶ֤י/הָ מִ/מִּצְרַ֨יִם֙ לֹ֣א עָזָ֔בָה כִּ֤י אוֹתָ/הּ֙ שָׁכְב֣וּ בִ/נְעוּרֶ֔י/הָ וְ/הֵ֥מָּה עִשּׂ֖וּ דַּדֵּ֣י בְתוּלֶ֑י/הָ וַ/יִּשְׁפְּכ֥וּ תַזְנוּתָ֖/ם עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/008.yaml
  text: Yet she did not abandon her prostitutions from Egypt[a], for in her youth they had lain with her[b], and they fondled her virgin breasts and poured out their prostitution upon her.
translation:
  language: fr
  text: Pourtant, elle n’a pas abandonné les prostitutions auxquelles elle se livrait, venues d’Égypte[a]. En effet, dans sa jeunesse, des hommes avaient couché avec elle ; ils avaient caressé sa poitrine virginale[b] et déversé sur elle leur prostitution.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ses prostitutions venant d’Égypte ». Dans tout le verset, l’hébreu emploie l’image de la prostitution pour évoquer l’infidélité à l’alliance.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, selon une expression hébraïque difficile : « ils avaient fait ou manipulé les seins de sa virginité ». Il s’agit d’une image sexuelle explicite liée à sa jeunesse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּזְנוּתֶיהָ מִמִּצְרַיִם
  choice: les prostitutions auxquelles elle se livrait depuis l’Égypte
  rationale: « Prostitutions » conserve l’image sexuelle explicite et répétée de l’infidélité, tandis que « depuis l’Égypte » exprime naturellement en français l’origine et la continuité suggérées par מִן dans ce contexte.
- source_word: לֹא עָזָבָה
  choice: elle n’a pas abandonné
  rationale: Cette formulation garde le sens de renoncer à des pratiques antérieures et demeure naturelle en français moderne.
- source_word: אוֹתָהּ שָׁכְבוּ
  choice: des hommes avaient couché avec elle
  rationale: Le verbe שׁכב a ici un sens sexuel. L’antériorité du plus-que-parfait convient au rapport avec la persistance évoquée au début du verset ; le sujet indéfini est explicité sans identifier davantage les acteurs.
- source_word: בִנְעוּרֶיהָ
  choice: dans sa jeunesse
  rationale: Rendu direct et idiomatique de l’indication temporelle.
- source_word: עִשּׂוּ דַּדֵּי בְתוּלֶיהָ
  choice: ils avaient caressé sa poitrine virginale
  rationale: Le verbe rare עשה associé aux seins indique ici une manipulation sexuelle. « Caressé » rend ce geste explicitement sans lourdeur ; le singulier collectif « poitrine » est plus naturel en français, et « virginale » préserve la référence à בְתוּלֶיהָ.
- source_word: וַיִּשְׁפְּכוּ תַזְנוּתָם עָלֶיהָ
  choice: et déversé sur elle leur prostitution
  rationale: « Déversé » maintient l’image concrète de שׁפך, et « leur prostitution » conserve la répétition lexicale et l’étrangeté voulue du texte hébreu.
theological_decisions:
- issue: Métaphore prophétique sexualisée de l’infidélité envers l’alliance
  choice: Conserver les images explicites de prostitution, de rapports sexuels et de gestes sur la poitrine.
  alternative: Les atténuer par des termes abstraits comme « immoralité » ou « infidélité ».
  rationale: Le langage choquant appartient à la rhétorique d’Ézéchiel et représente l’infidélité religieuse et politique. Le neutraliser ferait disparaître une dimension essentielle du texte.
- issue: Valeur de « leur prostitution » dans la dernière proposition
  choice: Maintenir la formulation métaphorique littérale « leur prostitution ».
  alternative: Interpréter par « leur désir », « leur débauche » ou une allusion explicite à l’éjaculation.
  rationale: Le substantif תַזְנוּתָם reprend le champ lexical de la prostitution, tandis que l’image de « verser sur elle » reste suggestive et ambiguë. La traduction ne tranche donc pas au-delà de l’hébreu.
translation_notes:
  register: Français international moderne, digne mais volontairement explicite, conformément au registre prophétique. Les temps du passé clarifient l’antériorité des actes subis dans la jeunesse sans réduire leur dureté. Les deux appels de note [a] et [b] figurent dans le texte.
