  text: לָ/כֵ֣ן אָהֳלִיבָ֗ה כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנְ/נִ֨י מֵעִ֤יר אֶת מְאַהֲבַ֨יִ/ךְ֙ עָלַ֔יִ/ךְ אֵ֛ת אֲשֶׁר נָקְעָ֥ה נַפְשֵׁ֖/ךְ מֵ/הֶ֑ם וַ/הֲבֵאתִ֥י/ם עָלַ֖יִ/ךְ מִ/סָּבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/022.yaml
  text: 'Therefore[a], Oholibah, thus says the Lord GOD: Behold, I am stirring up your lovers against you, those from whom your soul has turned away, and I will bring them against you from every side.'
translation:
  language: fr
  text: 'C’est pourquoi, Oholiba, ainsi parle le Seigneur Yahweh : Voici, je vais dresser contre toi tes amants, ceux dont ton âme s’est détournée[a] ; je les ferai venir contre toi de toutes parts.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux que ton âme a pris en aversion » ou « ceux dont tu t’es éloignée ». Le verbe hébreu peut exprimer la répulsion ou la rupture d’une relation.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit la conséquence judiciaire de l’accusation précédente avec une force prophétique naturelle en français.
- source_word: אָהֳלִיבָה
  choice: Oholiba
  rationale: Translittération française usuelle du nom propre, sans en traduire le sens.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: voici ce que dit le Seigneur Yahweh
  rationale: Formule prophétique rendue dans un français actuel et solennel; « Yahweh » représente directement le nom divin, tandis que « Seigneur » rend אֲדֹנָי.
- source_word: הִנְנִי מֵעִיר
  choice: Je vais soulever
  rationale: Exprime l’annonce divine solennelle et l’action imminente consistant à mobiliser des adversaires.
- source_word: מְאַהֲבַיִךְ
  choice: tes amants
  rationale: Conserve la métaphore sexuelle et politique accusatrice qui structure Ézéchiel 23.
- source_word: אֵת אֲשֶׁר נָקְעָה נַפְשֵׁךְ מֵהֶם
  choice: ceux dont ton âme s’est détournée
  rationale: Préserve le sujet hébreu « ton âme » ainsi que l’ambiguïté entre éloignement, rupture et répulsion.
- source_word: וַהֲבֵאתִים עָלַיִךְ מִסָּבִיב
  choice: et je les ferai venir contre toi de toutes parts
  rationale: Rend naturellement le mouvement hostile, causé par Dieu, et l’idée d’encerclement.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Distingue les deux titres contigus et représente explicitement le tétragramme sans produire la répétition « le Seigneur, le SEIGNEUR ».
- issue: Degré d’hostilité exprimé par נָקְעָה
  choice: s’est détournée
  alternative: a pris en aversion
  rationale: Le contexte permet la répulsion comme l’aliénation; le texte principal garde une formulation moins interprétative, et la note signale les nuances plus fortes.
translation_notes:
  register: Français international moderne, digne et prophétique. Le tutoiement féminin correspond à l’adresse directe à Oholiba. La métaphore des « amants » et l’expression anthropologique « ton âme » sont conservées.
