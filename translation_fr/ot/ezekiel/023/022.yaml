  verdict: revise
  source_fidelity: La formulation proposée rend correctement la conséquence (« C’est pourquoi »), l’adresse à Oholiba, les « amants », l’éloignement exprimé par נָקְעָה, ainsi que l’encerclement (« de toutes parts »). Toutefois, « voici ce que dit » rend déjà כֹּה אָמַר et laisse l’emphatique הִנְנִי sans équivalent explicite. Il convient de conserver « Voici » dans l’annonce divine.
  naturalness: Le français est globalement naturel et le registre prophétique convient. « Ainsi parle » suivi de « Voici, je vais dresser » est à la fois plus idiomatique dans une formule prophétique française et plus proche de la structure hébraïque. « Dresser contre toi » exprime clairement la mobilisation hostile.
